  title: Rote Rosen (1959)
  subtitle: Deutschland 2015
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Obwohl Nathalies Krämpfe sich als normale Senkwehen herausstellen, schürt Maurice bei Jana und Fabian die Angst. Aber Nathalie durchschaut ihren überbesorgten Vater. Für sie steht fest: Sie fährt mit Fabian nach Rotterdam, egal, was Maurice sagt. Allerdings hat sie nicht mit dem autoritären Auftritt ihres Vaters gerechnet.\n\nAls 'Tiger Rat' droht, nicht ohne seine Ratte abzureisen, lässt Gunter sich in der Not von Ben überreden, dem Rockstar ein Double aus der Zoohandlung unterzujubeln. Der Schwindel fliegt natürlich auf.\n \nJe mehr Udo von Marlies erfährt, desto mehr fasziniert sie ihn."
