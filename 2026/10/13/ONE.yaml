  ageRating: 12
  description: "Benjamin Evers kommt mit einer leichten Knieverletzung in die Klinik. Die zunächst harmlose Verletzung entzündet sich und Benjamin bekommt Fieber. Dr. Globisch behandelt gegen den Widerstand der Mutter Carolin, die strikt für Homöopathie ist, mit Antibiotika. Über Nacht geht die Entzündung zurück, doch das Fieber steigt weiter. Carolin sieht sich daraufhin in ihrer Haltung bestätigt und will Benjamin eigenmächtig aus der Klinik entlassen. \n\nDa eröffnet die Ärztin den Eltern, dass sich ihr Sohn wahrscheinlich vergiftet hat. Sie bittet die Evers, zuhause nach den möglichen Ursachen zu suchen."
