  audiodesc: true
  description: "Beim geprobten Heiratsantrag mit Marlene ist Konstantin für einen Moment verzaubert. Schließlich traut er sich, vor Natascha auf die Knie zu gehen. Die ist derart überfordert, dass sie sich Bedenkzeit erbittet. Als sie doch noch 'Ja' sagt, bleibt für Konstantin ein schaler Beigeschmack. \n\nNachdem Sabrina Natascha in dem Musical-Vertrag eine Klausel präsentiert, durch die Natascha gezwungen ist, eine etwaige Schwangerschaft offenzulegen, weigert sie sich, ihn zu unterschreiben. Beseelt von Konstantins Antrag, ist sie inzwischen überzeugt, dass ihre private Zukunft mehr wiegt als der Job."
