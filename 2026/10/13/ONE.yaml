  description: Die 16-jährige Kristin Schneider schleppt sich mit letzter Kraft in die Sachsenklinik und wird dort ohnmächtig. Professor Simoni findet auf der Vortreppe seines Hauses einen vor wenigen Tagen geborenen Säugling. Als Kristin Schneider erwacht, gibt sie vor, sich an nichts zu erinnern. Doch die medizinische Untersuchung ergibt schnell, dass sie vor kurzem entbunden hat. Da gesteht Kristin, sie habe die Schwangerschaft verheimlicht und in einer anderen Klinik entbunden, aus der sie dann mit dem Kind verschwunden ist.
