  description: Dr. Drescher verabreicht Charlotte unbemerkt Tropfen eines Medikaments, sodass Charlotte sich willenlos manipulieren lässt. Als sie kurz darauf in Julius' Hütte aufwacht, glaubt sie, eine intensive Tiefenentspannung hinter sich zu haben. Derweil präsentiert Doris Werner ein zerschnittenes Kleid und lenkt den Verdacht geschickt auf Charlotte. Werner glaubt nicht an deren Schuld, aber bittet sie um die Schlüssel zur Saalfeld-Wohnung, um Doris zu beruhigen. Charlotte weigert sich empört, denn sie hat mit dem Vorfall nichts zu tun.
