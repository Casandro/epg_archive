  description: |-
    Marlene hat den Verlobungsring fertiggestellt. Konstantin will Natascha noch am selben Tag einen Antrag machen. Doch als er vor ihr steht, bringt er die Worte einfach nicht heraus, da Natascha sich negativ übers Heiraten äußert. Er zieht sich zurück und beschließt, seinen Antrag vorher zu üben, um nicht noch einmal so ein Debakel zu erleben. Daraufhin kniet er vor Marlene nieder, und macht ihr einen Antrag.

    Nachdem Charlotte gegenüber Doris die Beherrschung verloren hat, ist Werner schockiert und hält es für das Beste, wenn sich die Frauen fürs Erste aus dem Weg gehen. Auch Charlotte ist bestürzt.
