  title: Rote Rosen (1960)
  subtitle: Deutschland 2015
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Trotz Udos Beteuerungen lässt es sich nicht leugnen, dass Marlies ihm den Kopf verdreht hat. Der aufmerksamen Erika entgeht das nicht. Als Udo sich auffällig reuig zeigt, sagt Inge es ihm auf den Kopf zu: Er hat sich in Marlies verguckt!\n \nGunter und Ben sind ratlos, wie sie dem Rockstar seine entlaufene Ratte wiederbeschaffen sollen. Johanna lacht sich derweil ins Fäustchen. Als 'Tiger Rat' aber erneut droht, Ärger zu machen, gibt sie sein Maskottchen zurück. Der Rockstar reist zufrieden ab und Gunter lässt durchblicken, dass er Johanna durchschaut hat."
