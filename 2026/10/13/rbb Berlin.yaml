  audiodesc: true
  description: 'Zucker kann das Leben versüßen - und zerstören. Jährlich konsumieren wir in Deutschland durchschnittlich 33 Kilogramm Zucker pro Kopf. Mehr als das Dreifache der von der Weltgesundheitsorganisation WHO empfohlenen Menge. Dr. Eckart von Hirschhausen widmet sich im neuen Film seiner Doku-Reihe einer Substanz, die es gesundheitlich in sich hat: Industriezucker. Der Arzt und Wissenschaftsjournalist blickt kritisch auf seinen eigenen Verzehr des süßen Verführers, erlebt mit Betroffenen, welche Auswirkungen zu viel Zuckerkonsum haben kann, und sucht nach Alternativen.'
