  title: Abenteuer Amerika - Mit dem Rucksack von Ost nach West
  subtitled: true
  description: '"From Germany wants to see USA" (auf Deutsch: Aus Deutschland, möchte die USA sehen): Mit einem selbst gebastelten Pappschild in der Hand reist Samuel Häde per Anhalter quer durch die Vereinigten Staaten. Während seiner Reise gewinnt Samuel Häde tiefe Einblicke in die Gedanken und Sichtweisen einer jungen Generation, durchquert 15 US-Bundesstaaten, erlebt in einsamen Zeltnächten die unberührte Natur Amerikas, paddelt in einem Kanu den Green River in Utah hinunter und legt insgesamt über 8.500 Kilometer zurück.'
- eventId: 1132015
  start: 2026-10-13T15:30:00Z
