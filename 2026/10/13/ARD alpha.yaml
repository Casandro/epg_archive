  subtitled: true
  description: Wie kommen die Löcher in den Käse? Wer malt die Streifen in die Zahnpasta? Wenn ihr etwas wissen wollt und eure Eltern nicht weiterwissen, hilft "Die Sendung mit der Maus" mit ihren Sachgeschichten. Und daneben gibt es natürlich noch die Lachgeschichten mit den Maus-Stars. Da ist der sympathische Maulwurf, der kleine blaue Elefant oder die kleine gelbe Ente. Bei der "Sendung mit der Maus" gibt es immer was zu lachen.
- eventId: 1132146
