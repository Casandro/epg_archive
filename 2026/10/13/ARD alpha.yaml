- eventId: 1132142
  start: 2026-10-13T03:30:00Z
  stop: 2026-10-13T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Fisherman's Paradise
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 1132143
  start: 2026-10-13T04:00:00Z
  stop: 2026-10-13T04:30:00Z
  title: Fast Track English
  subtitle: The Latest Style
  description: Der Sprachkurs "Fast Track English" bietet die Möglichkeit, vorhandene Englischkenntnisse aufzufrischen und zu vertiefen. Die einzelnen Folgen sind rein englischsprachig. Die Begleitbücher geben aber deutschsprachige Hinweise und Anleitungen. Die Filme wurden an Originalschauplätzen in England gedreht. Es wird alltägliches Englisch gesprochen. Dabei wechseln individuelle Akzente und das Sprechtempo der native speakers, Engländerinnen und Engländer in ihrer normalen Umgebung. Es kann sein, dass der Sprachstudent zunächst nicht alles auf Anhieb versteht.
