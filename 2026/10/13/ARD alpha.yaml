  title: Expedition in die Heimat
  subtitle: Ganz schön im Wandel - Traben-Trarbach an der Mosel
  subtitled: true
  description: "Ihren immensen finanziellen Erfolg ließen viele Weinhändler in Stein meißeln, auf einzigartige und damals sehr moderne Art: im Jugendstil. Anna Lena besucht und bestaunt so wundervolle wie ungewöhnliche Prachtvillen und Kellereigebäude, die allesamt der Architekt Bruno Möhring entwarf. Er war verantwortlich für die einzigartige Architektur, die immer noch den Charme Traben-Trarbachs ausmacht. \n\nInzwischen ist es ein zwar großartiges, aber auch schweres Erbe, mit dem die Doppelstadt heute mehr denn je zu kämpfen hat. Traben-Trarbach hat viel vor, vieles ist in Bewegung, vieles muss sich wandeln."
