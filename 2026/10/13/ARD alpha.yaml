  subtitled: true
  description: Der Norden Chiles ist eine Region der Extreme. Die Atacama, eine der trockensten und ältesten Wüsten der Erde, prägt einen Großteil der Landschaft zwischen Anden und Pazifik. Die 6.500 Meter hohen Vulkane der Andenkette ragen majestätisch über das Altiplano, dem über 4.000 Meter hohen Hochland mit spektakulären Salzseen und einer Wüstenlandschaft, die an Mond und Mars erinnert.
- eventId: 1132055
  start: 2026-10-13T19:00:00Z
  stop: 2026-10-13T19:45:00Z
  title: Mein Körper. Mein Alter.
  subtitle: Wer bestimmt, wie alt ich bin?
  subtitled: true
  description: |-
    Man ist so alt, wie man sich fühlt - Phrase oder Wirklichkeit? Damit beschäftigt sich diese "ARD Wissen"-Dokumentation und geht dabei der Frage nach, inwieweit der Alterungsprozess beeinflusst werden kann und welche Faktoren eine Rolle spielen. Dabei nähert sie sich dem Thema aus unterschiedlichen Perspektiven. Denn Fakt ist: Jeder Mensch altert anders.

    Wie können wir unser biologisches Alter beeinflussen? Die Kölnerin Beatrice nimmt an einem "Verjüngungsprojekt" teil. Für drei Monate absolviert sie ein professionelles Sportprogramm und stellt ihre Ernährung um.
- eventId: 1132056
  start: 2026-10-13T19:45:00Z
  stop: 2026-10-13T20:15:00Z
  title: Werden wir ewig leben?
  description: 'Für Alternsforscherin Andrea Maier ist es eine aufregende Zeit: "In den nächsten zehn Jahren werden wir in der Lage sein zu zeigen, ob wir die Lebensspanne des Menschen um 10 oder auch um 20 Jahre verlängern können." In Singapur leitet Maier Versuchsreihen mit bereits zugelassenen Medikamenten. Weltweit werden derzeit rund 20 Wirkstoffe getestet, die eigentlich gegen Krankheiten wie etwa Diabetes oder Krebs eingesetzt werden, die aber auch das Altern erheblich beeinflussen könnten. Untersucht werden müssen etwa die genaue Dosierung und langfristige Nebenwirkungen.'
