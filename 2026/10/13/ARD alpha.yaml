  title: Tele-Gym (6)
  subtitle: Yoga-Pilates-50plus
  description: 'Überall auf Straßen, Wiesen und Feldern sieht man sie im schnellen Schritt: die Nordic Walker. Jetzt zeigt TELE-GYM, wie man diese Sportart abwechslungsreich gestalten und sich damit optimal auf den Wintersport vorbereiten kann. Nordic Walking wurde ursprünglich als Sommertraining für Skilangläufer entwickelt. Es ist das perfekte Ganzkörpertraining für jedermann, da 90% aller Muskeln im Einsatz sind. Das Übungsprogramm ist in Zusammenarbeit mit dem Deutschen Skiverband aus dem Nordic-Walking-Sport heraus entwickelt worden.'
- eventId: 1132208
  start: 2026-10-13T11:15:00Z
  stop: 2026-10-13T11:30:00Z
  title: Tele-Gym (1)
  subtitle: Aktiv & beweglich mit 60+
  description: "TELE-GYM aktiv & beweglich mit 60+\nmit Gabi Fastner\n\nZwanzig Jahre 50 bleiben! Mit diesem Training schaffen Sie das! \nBewegung ist die beste Möglichkeit, ein gesundes und selbständiges Leben bis ins hohe Alter zu führen. Ohne Bewegung lassen wichtige Funktionen nach, die Muskeln werden schwächer, die Gelenke unbeweglicher, das Gleichgewicht schwindet. Unser Körper erhält nur die Funktionen, die er auch nutzt und im Alltag braucht! Schuld ist also nicht allein der Alterungsprozess, sondern auch wie die körperlichen Fähigkeiten trainiert werden."
