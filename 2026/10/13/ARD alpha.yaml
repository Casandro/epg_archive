  subtitle: Rufen Sie uns an, Ihre Meinung ist gefragt!
  description: 'Diskutieren Sie mit unserem kompetenten Studiogast über ein aktuelles Thema. Politik, Wirtschaft, Kultur, Religion und Sport - im Tagesgespräch debattieren wir über alle gesellschaftlich wichtigen Fragen. Unter dieser gebührenfreien Telefonnummer sind wir werktags ab 11 Uhr für Sie erreichbar: 0800 / 94 95 95 5'
- eventId: 1132207
  start: 2026-10-13T11:00:00Z
