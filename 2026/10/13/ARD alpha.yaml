  title: Willi wills wissen
  subtitle: Wie sieht die Welt im Weltraum aus?
  subtitled: true
  description: |-
    Folge 125: Wie sieht die Welt im Weltraum aus?

    Ferne Galaxien, unendliche Weiten, fremde Welten - heute begibt sich Willi auf eine Reise durch das Weltall. Na ja, nicht wirklich, aber er trifft Menschen, die sich im Weltraum auskennen. Los geht's mit Raumfahrtexperte Matthias Raif von der Technischen Universität in Garching bei München. Matthias hat ein Modell einer Ariane-5-Rakete mitgebracht. Willi zählt den Countdown, und - wusch - zischt die Mini-Rakete dem Himmel entgegen. Die Triebwerke der echten Ariane 5 erzeugen beim Start soviel Energie wie mehrere Kraftwerke zusammen!
