  description: "ADAC 3-Städte-Rallye -Motorsportveranstaltung mit besonderer Geschichte\nDer Motorsport begeistert Menschen schon seit mehr als einem Jahrhundert. Am bekanntesten ist hierbei die Formel 1, doch gibt es auf dem Gebiet weit mehr zu erleben. Unter anderem Rallye-Fahrten. Zu sehen gibt es diese auch bei uns in der Region. So war es am Wochenende an der Zeit für eine besondere Motorsportveranstaltung mit traditionellem Charakter: die ADAC 3 Städte Rallye. Wir waren vor Ort. \n\nGedenken an besondere Ordensfrau - Denkmal im Kloster St. Nikola enthüllt\n80 Jahre Deutsch Orden-Schwestern im Kloster St, Nikola in Passau. Das wurde am Wochenende gefeiert. Aus den Trümmern des Krieges errichtete der Orden ein lebendiges Zentrum für Gebet und Bildung. Wesentlichen Anteil daran hatte eine Ordensfrau derer an diesem Wochenende besonders gedacht wurde. Helmut Degenhart berichtet.\n\nTag des offenen Ateliers Konrad Schmid\nTag der offenen Kunstwerkstätten hies es an diesem vergangen Sonntag. Bildende Künstlerinnen und Künstler öffneten ihre Ateliers und luden zum Tag der offenen Tür ein. Sie zeigten wie ihre Kunst entsteht und präsentierten ihr Handwerk der Öffentlichkeit. Helmut Degenhart hat den Kulturpreisträger Konrad Schmid aus Pocking-Hartkirchen besucht und sich seine Kunst des Holzschnittes erklären lassen."
