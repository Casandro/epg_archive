  title: NIEDERBAYERN TV Journal Deggendorf-Straubing vom 13.10.2026 (Wh.)
  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit ein..
  description: "83.000 Euro für zwei Zoo-Werbeschilder - Straubinger Stadtrat hat abgestimmt\nMit 130 Stundenkilometern auf der Autobahn - Straßenschilder ziehen vorbei. Die Schilder in Blau weisen den Weg. Zwischendrin begegnen einem aber auch immer wieder diese großen, braunen Schilder, die über Kultur und Sehenswürdigkeiten des jeweiligen Ortes erzählen. Aber - wie sehr fallen uns diese Schilder wirklich auf? Mit dieser Frage haben sich die Mitglieder des Straubinger Stadtrats in letzter Zeit besonders beschäftigen müssen. Denn - die Straubinger Autobahnschilder müssten erneuert werden. Aber - ist das 83.000 Euro wert? \n\nAlice im Wunderland - TSV Pilsting bringt Tanzshow auf die Bühne \nWenn man von der \"Grinsekatze\" und dem \"Weißen Kaninchen\" hört, dann dürfte relativ schnell klar sein, dass damit auf die Geschichte von \"Alice im Wunderland\" angespielt wird. Seit der Walt-Disney-Premiere 1951 war das Werk von Autor Lewis Carroll Vorbild für unzählige Nacherzählungen und Neuinszenierungen. Auch die \"Dancers of Wonderland\" des TSV Pilsting haben den Disney-Klassiker unter der Leitung von Ramona Arbinger neu inszeniert. \n\nKlinikum goes school - Vortrag über das Thema Krebsprävention\nLaut einer Prognose der World Health Organisation könnte sich die Anzahl der Krebserkrankten bis zum Jahr 2040 verdoppeln. Diese Entwicklung würde die Gesundheitssysteme weltweit sehr stark belasten. Durch kleine Anpassungen im Alltag könnte das Krebsrisiko allerdings schon um bis zu 40% gesenkt werden. Damit zumindest Niederbayerns Jugendliche gesund altern können, hat das St. Elisabeth Klinikum in Straubing nun dem Krebs den Kampf angesagt. Mittels unterschiedlicher Aufklärungskampagnen sollen die Schülerinnen und Schüler lernen, wie sie das Erkrankungsrisiko senken können."
