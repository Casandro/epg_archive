  description: "Sensationsfund - Archäologen legen jahrtausendealtes Skelett frei\nWo in einigen Monaten moderne Einfamilienhäuser stehen und Kinder im Garten spielen sollen, herrschte vor sieben Jahrtausenden bereits geschäftiges Treiben. Dass es in Großköllnbach eine steinzeitliche Siedlung gab, war bereits bekannt - doch jetzt hat die Erde dort ihr wohl am besten gehütetes Geheimnis preisgegeben: Die Überreste eines Menschen, der womöglich hier vor rund 7.000 Jahren lebte und starb. Für die Kreisarchäologie ist dieser Skelettfund ein wissenschaftlicher Jackpot und das fehlende Puzzleteil zur Geschichte der ersten Niederbayern. \n\nLogistikzentrum - Medizinische Versorgung aus Deggendorf\nVon der klassischen Apotheke über die Versorgung von Kliniken und Arztpraxen bis hin zu medizinischen Notfallsets für Flugzeuge: Die Antonius-Apotheke in Deggendorf hat sich in den vergangenen Jahrzehnten deutlich weiterentwickelt. Jetzt hat das Unternehmen sein neues Logistikzentrum am Kreuzäcker Vertretern aus Politik und Region vorgestellt. Auch wir haben uns das neue Zentrum genauer angeschaut.\n\nHistorischer Erfolg - Straubing Tigers gewinnen erstmals in der DEL zweistellig\nNach fünf Siegen in Folge mussten die Straubing Tigers am Sonntagabend in Mannheim mal wieder eine Niederlage hinnehmen. Wir wollen nun aber zurückblicken auf den Freitagserfolg gegen Iserlohn, den dieser war in doppelter Hinsicht historisch. Zum einen war es der 500. DEL-Sieg für Straubing, zum anderen der erste, bei dem die Tigers zweistellig treffen konnten."
