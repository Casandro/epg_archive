  title: NIEDERBAYERN TV Landshut Journal vom 12.10.2026 (Wh.)
  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit ein..
  description: "Ehrenamt im Fokus: Aktionstag in der Landshuter Innenstadt\nAm Sonntag war es alles andere als ruhig in der Landshuter Innenstadt: Denn es war wieder verkaufsoffener Sonntag. Doch zusätzlich zu den vormittäglichen Geschäften machen, waren 18 Vereine und Organisationen in der Neustadt verteilt, um aufs Ehrenamt aufmerksam zu machen. Passend zum Namen ,,Aktionstag Ehrenamt konnten die Besucherinnen und Besucher somit mehr über die Organisationen und deren Arbeit lernen.  \n\nNorddeutsches Markttreiben in Niederbayern: Hamburger Fischmarkt zu Gast in Eching\nHamburg ist nicht nur für seinen Hafen, die Landungsbrücken und die Reeperbahn bekannt. Auch der Fisch hat in der Hansestadt eine jahrhundertealte Tradition. Besonders der traditionelle Fischmarkt direkt an der Elbe lockt jeden Sonntagmorgen zahlreiche Besucher an. Mit ihren markanten Stimmen und humorvollen Sprüchen gehören die bekannten Marktschreier fest zum Hamburger Original.\nDoch wer aus der Region Landshut schon immer das besondere Flair des Hamburger Fischmarktes erleben wollte, musste dafür nicht extra in den hohen Norden reisen. Denn beim Biller in Eching gab es nicht nur Möbel, sondern auch den echten Markt aus der Hansestadt - ein Stück Hamburger Fischtradition mitten in Niederbayern.\n\nWiedergutmachung gelungen: EV Landshut revanchiert sich in Memmingen für schwachen Heimauftritt gegen Crimmitschau\nEs bleibt weiter eine Achterbahnfahrt beim EV Landshut. Erneut zeigte die Krupp-Truppe am Wochenende zwei Gesichter. Einem katastrophalen 1:5 am Freitag zu Hause gegen Crimmitschau folgte am Sonntag dann in Memmingen eine starke Reaktion."
