  title: A bon entendeur
  description: |-
    Maté : boisson saine ou soda ? Le maté en canette s'est imposé comme la boisson tendance. Son succès repose sur une promesse séduisante: un coup de boost, pas trop de sucre et une image naturelle synonyme de bien-être. Derrière le marketing, les diététiciens appellent à la prudence. Le maté est-il une alternative saine ou un soda déguisé ?
     (Suisse Romande-2026)
