  title: Signes
  description: |-
    Mon père, ce pionnier Quand elle était petite, la présentatrice de Signes Natasha Ruf ne comprenait pas pourquoi son père s'absentait sans cesse. Rolf Ruf, 91 ans aujourd'hui, est un homme exceptionnel qui a surmonté sa surdité par la force de sa volonté et de ses talents : il est le premier sourd en Suisse à avoir suivi une formation en architecture et à côté de son travail, il s'est investi corps et âme dans une troupe de mimes bien connue outre-Sarine, le Mimenchor de Zürich.
    Le portrait émouvant d'un père par sa fille.
     (Suisse Alémanique-2026)  "Audio description"  "Langue des signes"
