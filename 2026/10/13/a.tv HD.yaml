  subtitle: Gesundheitsmagazin in Kooperation mit der Hessing-Klinik
  description: Schwere Beine, starke Schmerzen in den Gliedmaßen, Wassereinlagerungen und häufige Hämatome. Hinter diesen Symptomen steckt häufig ein Lipödem. Etwa 10 Prozent der Frauen leiden darunter, die Dunkelziffer dürfte aber deutlich höher liegen. Was man unter einem Lipödem genau versteht und wie man es behandeln kann, das erklären Patrick Stonner und Christina Hinojosa vom Hessing Sanitätshaus. Moderation Andrea Horn
