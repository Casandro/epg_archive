  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: 'Wenn der Ernstfall eintritt: So ist der Katastrophenschutz in der Region vorbereitet.'
  description: Wir werfen einen Blick hinter die Kulissen des Katastrophenschutzes und besuchen ein Katastrophenschutzlager in Memmingen. Dort zeigen uns die Verantwortlichen, welche Materialien für den Ernstfall bereitstehen und wie die moderne Einsatzzentrale des Amts für Brand- und Katastrophenschutz funktioniert. Anschließend begleiten wir das THW bei einer Übung und zeigen, wie mit Drohne, Bagger und Endoskopiegerät im Katastrophenfall gearbeitet werden kann.
