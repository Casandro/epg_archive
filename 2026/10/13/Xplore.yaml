  description: 'Die Alpen von oben: Von Salzburg zum Königssee - Martin Schierhuber gehören zum Bergputzer-Trupp der Stadt Salzburg. In Anif zeigt Daniela Trobe den im Zoo geborenen großen Waldrapp-Wildvögeln mit ihrem Ultralight den Weg in die Winterquartiere der Toskana. In Ramsau am Dachstein wird seit mehr als 500 Jahren Loden hergestellt, auf einer Alm im Pongau zieht ein altes Ehepaar Murmeltiere auf. Nahe des Großglockner, dem höchsten Berg Österreichs, erklimmt ein Wanderreiter die historischen Pfade der Säumer, die im Mittelalter Waren über die Alpen transportierten.  DE 2012'
