  title: 'Bike Mike: Verona - Venedig - Etappe 2: Von Vicenza nach Padua'
  subtitle: 'Bike Mike: Verona - Venedig - Etappe 2: Von Vicenza nach Padua'
  description: Hier seht ihr den zweiten Teil unserer tollen 3-Tages-Tour von Verona nach Venedig. Die zweite Etappe führt uns von der Palladio Stadt Vicenza auf einer sagenhaft schönen Radstrecke bis nach Padua. Inmitten der wärmenden Frühjahrssonne tuckern wir immer dem Fluss Bacchiglione folgend durch das ländliche Venetien. Vorbei an prunkvollen venezianischen Villen, majestätischen Burganlagen sowie einer altehrwürdigen Klosteranlage genießen wir diese fantastische Tour in vollen Zügen. Kommt einfach mit und seht selbst! DE 2022
- eventId: 660343
  start: 2026-10-13T01:30:00Z
  stop: 2026-10-13T01:48:00Z
  title: 'Bike Mike: Verona - Venedig - Etappe 3: Von Padua nach Venedig'
  subtitle: 'Bike Mike: Verona - Venedig - Etappe 3: Von Padua nach Venedig'
  description: Hier seht ihr den dritten Teil unserer tollen 3-Tages-Tour von Verona nach Venedig. Die dritte Etappe führt uns von Padua in die weltbekannte Lagunenstadt Venedig. In diesem letzten Teilstück folgen wir, vorbei an unzähligen venezianischen Villen, dem ausgeklügelten Jahrhunderte alten Kanalsystem Venetiens bis ans Meer. Ein ideales flaches Terrain, um diese wunderschöne Frühjahrstour zu beenden. Der kulturelle Höhepunkt dieser Etappe befindet sich mit dem Besuch der historischen Altstadt Venedigs sicherlich am Schluss und zieht uns, wie zu Beginn der Tour Verona, in seinen Bann! Kommt einfach mit und seht selbst! DE 2022
