  title: Foodwise - Quanzhou
  subtitle: Foodwise - Quanzhou
  description: In dieser Folge sind Tianran He und Eva May in Quanzhou, dem antiken Ausgangspunkt der maritimen Seidenstraße. Von den überdachten Arkaden und römischen Säulen bis hin zum südostasiatischen Flair entdecken unsere Gastgeber, dass Quanzhou ein wahrer Schmelztiegel der Kulturen ist. CN 2022
- eventId: 660560
  start: 2026-10-13T21:35:00Z
  stop: 2026-10-13T22:04:00Z
  title: Foodwise - Xi'an
  subtitle: Foodwise - Xi'an
  description: In dieser Folge reisen Tianran He und Eva May nach Xi'an, einer antiken Stadt mit über 3000 Jahren Geschichte, die Hauptstadt von 13 chinesischen Dynastien war. Doch zuerst gönnen sich unsere Gastgeber eine Portion Kohlenhydrate mit Streetfood, angefangen von Klebreiskuchen. CN 2022
