  title: Auf den Spuren prähistorischer Künstler - Die Chauvet-Höhle
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Chauvet-Höhle ist ein archäologisches Juwel, das erst vor rund 30 Jahren entdeckt wurde. Ihre Wandmalereien sind vermutlich über 30.000 Jahre alt und gehören somit zu den ältesten in Europa. Anhand spektakulärer 3D-Rekonstruktionen gewährt der Dokumentarfilm faszinierende Einblicke in die Höhle, die nur einmal pro Jahr von einem Wissenschaftlerteam betreten werden darf.
- eventId: 919819
  start: 2026-10-13T08:25:00Z
  stop: 2026-10-13T09:25:00Z
  title: Sulawesi - Am Anfang war die Höhlenmalerei
  subtitle: Frankreich 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Lange ging die Wissenschaft davon aus, dass die ersten Kunstwerke der Menschheitsgeschichte vor etwa 40.000 Jahren in Europa entstanden. Neuerdings stellen jedoch auf der indonesischen Insel Sulawesi entdeckte Höhlenmalereien diese Annahme infrage. Dank einer von einem australischen Forschungsteam entwickelten Methode konnten diese Felsbilder sehr genau datiert werden: Sie sind mindestens 62.700 Jahre alt und entstanden somit lange vor der ältesten in Europa bekannten figurativen Kunst.'
