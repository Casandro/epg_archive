  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Chauvet-Höhle ist ein archäologisches Juwel, das erst vor rund 30 Jahren entdeckt wurde. Ihre Wandmalereien sind vermutlich über 30.000 Jahre alt und gehören somit zu den ältesten in Europa. Anhand spektakulärer 3D-Rekonstruktionen gewährt der Dokumentarfilm faszinierende Einblicke in die Höhle, die nur einmal pro Jahr von einem Wissenschaftlerteam betreten werden darf.
