- eventId: 660143
  start: 2026-10-13T00:50:00Z
  stop: 2026-10-13T01:05:00Z
  title: Feeding Frenzy - Raubende Barsche an der Wasseroberfläche
  subtitle: Feeding Frenzy - Raubende Barsche an der Wasseroberfläche
  description: Barsche die im Rudel jagen, kennen keine Gnade. Sie geraten in einen wahren Fressrausch, jeder will der schnellere sein, um die Beute zu schlagen. Sie drängeln, schubsen sich weg, attackieren den Stickbait mehrfach, ohne Hemmungen. So oft bis letztendlich einer hängen bleibt und dass bei jedem einzelnen Wurf. Um so lauter der Köder desto aggressiver wird der Schwarm. Immer mehr Fische rotten sich zusammen und die Bisse werden von Mal zu Mal brutaler. Es scheint fast so, als wäre es das letzte Abendmal und alle wollen dran teilhaben. Sobald einer von ihnen am Haken hängt, versuchen die anderen ihm den Snack streitig zu machen und den Oberflächenköder aus dem Maul des Kontrahenten zu stehlen. Der Futterneid macht sie Kopflos, es geht nur noch darum zu Fressen. DE 2019
- eventId: 660144
  start: 2026-10-13T01:05:00Z
  stop: 2026-10-13T01:20:00Z
  title: Rapfen on Top
  subtitle: Rapfen on Top
  description: 'Raubfisch-Angeln: Große Industriefüsse in Deutschland sind die Heimat der Rapfen. Diese Weissfische werden ab einem bestimmten alter sehr räuberisch und ihre Hauptbeute besteht aus Kleinfischen wie beispielsweiße Lauben. Da sie sich gerne an der Wasseroberfläche aufhalten und der Rapfen ein oberständiges Maul hat fällt es ihm sehr leicht seiner Bäute direkt dort nachzustellen. Ein Stickbait ist der perfekte Begleiter um auf Rapfenjagd zu gehen, denn er simuliert einen flüchtenden Fisch wenn er hektisch von links nach rechts über die Wasseroberfläche schiesst. Das lieben diese pfeilschnellen Räuber und Attackieren die Köder Explosionsartig. Spannender kann Angeln nicht sein. DE 2015'
- eventId: 660145
  start: 2026-10-13T01:25:00Z
  stop: 2026-10-13T01:52:00Z
  title: Ascension Island - die vergessene Insel im Nirgendwo
  subtitle: Ascension Island - die vergessene Insel im Nirgendwo
  description: Die kleine britische Militärinsel Ascension Iland war jahrzehnte für den Tourismus und die Fischerei tabu. Dementsprechend intakt ist die Unterwasserwelt direkt vor der Insel. Peter Wahl entdeckte zusammen mit seinen Freunden bei einer aufregenden Tour das Potential der kleinen Vulkaninsel inmitten des Atlantiks zwischen Ghana und Brasilien. DE 2017
- eventId: 660146
  start: 2026-10-13T01:55:00Z
  stop: 2026-10-13T02:16:00Z
  title: Kenia Poppertour 2021
  subtitle: Kenia Poppertour 2021
  description: Schon lange hatten wir das Gefühl, dass Kenia eine ganz besondere Fischerei auf GT zu bieten hat. Unsere letzten Gruppenreisen nach Lamu waren ein voller Erfolg und wir konnten GTs bis 45kg landen. Extreme Durchschnittgrößen von über 20kg und der schwerste GT über 55kg! Wir haben in Kenia ein wahres Popperparadies gefunden! Der bisher größte GTs auf Popper wog 62kg, der Größte auf Jig 70kg!!! Hier nun der ganze Rückblick auf die letzte Poppertour nach Kenia. Die wohl fangreichste Woche welche wir je in Kenia hatten. Einige dicke GTs gefangen, die Monster leider verloren aber dennoch eine grandiose Woche erlebt! KE 2021
