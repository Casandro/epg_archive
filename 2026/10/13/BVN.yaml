  description: 'Een Oogje op Brabant is deze keer in Bergen op Zoom. Passanten en inwoners geven commentaar op de oude beelden van Bergen op Zoom. Deze keer in het cultuurmagazine Route C: Marinke van Zandwijk blaast glasbellen in alle soorten en maten. Op haar veertiende liep ze de glasblazerij in Leerdam in en daar is ze gebleven. In Op Oorlogspad nemen Hans Sakkers en Klaas van de Ketterij de kijker mee op reis door de provincie waar de sporen van de Slag om de Schelde nog duidelijk aanwezig zijn. (2026)'
