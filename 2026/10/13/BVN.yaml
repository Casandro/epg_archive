  subtitle: Parels S29 E07. De Keuringsdienst van waarde vraagt kweekzalmen kleur te bekennen en komt erachter dat walvissen het nakijken hebben.
  description: 'Vissers, deftige mevrouwen en influencers worden er opgewonden van: parels. Prachtige praal, ons geschonken door de oester. Maar het is gek: terwijl maar één op de pakweg duizend oesters een parel prijsgeeft, struikel je erover in de winkelstraat en webshop. Glanzende balletjes in allerlei soorten en maten. Van een paar cent per oorbel tot duizenden euro''s voor een ketting. Zoveel parels, zo bijzonder zeldzame wonderen der natuur. Hoe kan dat? Keuringsdienst van waarde gaat op een schitterende zoektocht en eindigt in een Chinees moeras. (2025)'
