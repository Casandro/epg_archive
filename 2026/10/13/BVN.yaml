  title: Zembla
  subtitle: De slaven van de scamfabriek S35 E13. In Zuidoost-Azië worden mensen gedwongen om vanuit scamcentra online fraude te plegen. Onderzoek in Cambodja wijst erop dat de criminelen achter deze industrie zich ook op Nederland richten.
  description: 'In Zuidoost-Azië worden honderdduizenden jonge mensen onder dwang ingezet in grote scamcentra. Ze worden onder valse voorwendselen naar landen als Cambodja gelokt. Daar worden ze mishandeld en gedwongen om via datingsites, nepinvesteringen en cryptoscams mensen wereldwijd geld afhandig te maken. Volgens de Verenigde Naties verdient de scamindustrie via deze dwangarbeid jaarlijks vele miljarden. We onderzoeken in Cambodja hoe deze scamindustrie opereert en vinden aanwijzingen dat de criminelen zich ook specifiek op Nederland richten. Regisseur: Evelien Vehof (2026)'
