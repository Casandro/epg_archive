  title: Unvergessene Legenden - Caterina Valente
  subtitle: Unvergessene Legenden - Caterina Valente
  description: Die Entertainerin Caterina Valente hat das Showlicht selbstbestimmt verlassen. Ihre Karriere begleitet uns mit Geschichten, Hits und Anekdoten. Caterina Valente lebte immer und mit jeder Faser ihres Seins für die Bühne, für die Musik, für die Show. Sie sang, sie steppte und tanzte mit einer Energie und Leidenschaft, dass heutige Generationen nur staunen können. Nach 67 Jahren im Rampenlicht beendete Caterina Valente 2003 ihre Karriere. Ge 2020
