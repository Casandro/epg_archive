  title: Engel der Sünde
  subtitle: Engel der Sünde
  description: Junge, unerfahrene und erlebnishungrigen Mädchen werden von gewissenlosen Zuhältern mit raffinierten Methoden auf die Straße gezwungen, um "anzuschaffen". Wie machen sich die Zuhälter ihre Opfer gefügig?  Die junge Journalistin Silvana will dieser Frage auf den Grund gehen und verkleidet sich als Dirne. Sie kann sogar bis zu einem Zuhälterring vordringen, muss aber schon bald am eigenen Leib erleben, was den Mädchen droht, wenn sie versuchen, sich dem Willen der Unterwelt zu widersetzen... Ge 1968
