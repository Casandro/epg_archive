  title: Alt-Heidelberg
  subtitle: Alt-Heidelberg
  description: Der junge Erbprinz Karl-Heinrich von Sachsen-Karlsburg verbringt ein glückliches Jahr in Heidelberg, fern vom düsteren Schloss und verliebt sich in Käthi. Doch die Pflicht ruft ihn zurück, als sein Onkel erkrankt. Zwei Jahre später besucht er Käthi erneut, doch die Jugendzeit und Liebe sind unwiederbringlich vergangen. Ge 1959
