  title: Liebesgrüße aus der Lederhose
  subtitle: Liebesgrüße aus der Lederhose
  description: Sissy hat von ihren Eltern ein Hotel mit dazugehörigen Gestüt geerbt. Leider war ihr Vater sehr verschuldet, so dass sie sich die Bevormundung einer entfernten Tante gefallen lassen muss. Doch die will auf dem Hof alles umkrempeln und entlässt alle erfahrenen Angestellten. Das führt zu einem Riesenchaos, denn das unerfahrene, neue Personal kommt besonders mit den Pferden kaum klar. Als Sissy auch noch einen befreundeten Bankdirektor heiraten soll, ist der Ärger perfekt. Ge 1972
