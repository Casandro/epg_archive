  title: Legenden der Volksmusik - Hansi Hinterseer
  subtitle: Legenden der Volksmusik - Hansi Hinterseer
  description: Hansi Hinterseer ist eine feste Größe in der Volksmusikszene. Bekannt für seine einzigartige Stimme und seine charismatische Persönlichkeit, eroberte er die Herzen der Menschen weltweit. Ursprünglich als erfolgreicher Skirennläufer bekannt, wechselte er erfolgreich in die Musikbranche und wurde mit Hits wie "Tiroler Berge" und "Du hast mich heut' noch nicht geküsst" zum Superstar. Seine authentische Art und seine Liebe zur Natur spiegeln sich in seiner Musik wieder. Ge 2016
