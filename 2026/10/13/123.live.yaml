  title: Adventszauber auf dem Rhein - Reise Riese
  subtitle: Adventszauber auf dem Rhein - Reise Riese
  description: Die MS Reise Riese Symphony startet gemeinsam mit dem DMF zum Advent 2026 eine Flusskreuzfahrt von Mainz über Straßburg und Rüdesheim zurück nach Mainz. Moderatorin Natalie Langer hat vorab die Crew besucht, den Kapitän getroffen und stellt das Schiff vor, zeigt die Kabinen und informiert im Gespräch mit der Kreuzfahrtdirektorin über die kommende Reise. Einblicke in das Leben an Bord und ein Ausblick auf die musikalischen Gäste, angereichert mit Musikvideos, runden das Ganze ab. Ge 2026
