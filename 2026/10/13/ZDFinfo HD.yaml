    Ein aufsehenerregendes Ereignis findet im März 1990 in Belgien statt. Militärangehörige beobachten ein riesiges schwarzes Dreieck, das sich langsam über ihren Köpfen bewegt. Experten analysieren diese Sichtungen anhand ehemals geheim gehaltener Dokumente.
