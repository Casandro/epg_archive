  description: |-
    Großbritannien 2023
    Ende des Zweiten Weltkriegs treffen alliierte Piloten während ihrer Einsätze auf seltsame Lichterscheinungen: Leuchtende Kugeln scheinen ihren Maschinen zu folgen und mit ihnen zu spielen.

    Die militärische Führung will nicht ausschließen, dass es sich bei dem Phänomen, das auch an anderen Orten beobachtet wird, um eine bislang unbekannte Waffe der Nazis handelt. Die Piloten geben dem unbekannten "Gegner" den Spitznamen "Foo Fighter".
