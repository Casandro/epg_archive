  description: |-
    Deutschland 2025
    Im Zweiten Weltkrieg erreicht der Luftkrieg eine neue Dimension: Hitlers Bomber machen den Blitzkrieg in Polen erst möglich. Bomben und Raketen bringen Tod und Zerstörung mitten in die Städte.

    Der Einsatz von Flugzeugträgern verlagert den Luftkampf auf die Meere. Immer tödlichere Waffen - von Sturzkampfbombern und Jagdflugzeugen bis hin zu ballistischen Raketen - werden entwickelt, angetrieben von Technikbegeisterung, Ideologie und Machtgier.
