    Kaum ist das Flugzeug erfunden, wird es zur Kriegswaffe. Tollkühne Piloten liefern sich in ihren Doppeldeckern tödliche Duelle über den Schützengräben des Ersten Weltkrieges.

    "Fliegerasse" wie Manfred von Richthofen sind Ikonen der Propaganda. Ihre spektakulären Luftkämpfe lenken ab vom massenhaften Sterben an der Front. Auch wenn der Einfluss der Fliegerei auf den Kriegsausgang noch gering ist, verändert sie die Art der Kriegsführung.
    HD-Produktion
- eventId: 1335837
