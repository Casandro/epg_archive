    Russland bedroht den Frieden in Europa. Die Bundeswehr ist wieder gefordert. Jahrelang wurde abgerüstet, jetzt heißt es "Kommando zurück": Aber wie gut ist die Bundeswehr darauf vorbereitet?

    Das Schlachtfeld der Zukunft stellt die Militärs vor neue Herausforderungen. Der Ukrainekrieg zeigt: Mit billigen Drohnen können teure Panzer zerstört werden. Die Waffentechnologie hat sich weiterentwickelt, kann die Bundeswehr da überhaupt noch mit Schritt halten?
