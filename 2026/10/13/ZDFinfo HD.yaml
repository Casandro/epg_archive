    In den Jahren ihrer Beziehung entwickelte Eva Braun sich vom Mädchen aus kleinbürgerlicher Familie zur kompromisslosen Gefährtin Hitlers. Bis in den Tod hielt sie dem Diktator die Treue.

    Wer war die Frau, die Hitler noch kurz vor dem Selbstmord geheiratet hat? Erst nach ihrem Tod wird sie in Deutschland zur öffentlichen Person. Gemeinsam mit Adolf Hitler nahm sie sich am 30. April 1945 im Bunker unter der Berliner Reichskanzlei das Leben.
