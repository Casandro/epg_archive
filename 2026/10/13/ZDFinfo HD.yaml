  audiodesc: true
  description: |-
    Deutschland 2017
    Mehr als 13 Jahre ist Eva Braun Hitlers heimliche Geliebte. Bis heute gilt sie als unpolitisches und unbedarftes Anhängsel des Massenmörders. Doch wer war die "Braut des Bösen" wirklich?

    Offiziell ist Eva Braun auf dem Berghof als Hitlers Privatsekretärin. Erst nach ihrem Tod wird sie in Deutschland zur öffentlichen Person. Gemeinsam mit Adolf Hitler nahm sie sich am 30. April 1945 im Bunker unter der Berliner Reichskanzlei das Leben.
    HD-Produktion
