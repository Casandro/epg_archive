    Mit den Atombombenabwürfen auf Japan beginnt 1945 das Atomzeitalter. Nuklearwaffen werden im Kalten Krieg zur globalen Bedrohung und zum zentralen Instrument der Abschreckung.

    Das Kräftemessen der Supermächte reicht bis ins All. Die Gefahr eines Atomkrieges rückt immer wieder bedrohlich nah. Stellvertreterkriege in Korea, Vietnam und Afghanistan zeigen: Auch ohne nukleare Eskalation fordern konventionelle Kriege zahllose Opfer.
