  description: |-
    USA 2017
    Juli 1947: Ein Rancher findet in der Wüste von New Mexico Trümmer und bringt sie zu einem Militärstützpunkt. Am nächsten Tag erklärt die Armee, eine "fliegende Untertasse" wurde gefunden.

    War es ein Ufo oder nur ein Wetterballon, wie später behauptet wurde? Auch nach Jahrzehnten wird der US-Regierung Vertuschung vorgeworfen. Nun soll endgültig geklärt werden: Stammt das Objekt von der Erde, oder ist es tatsächlich außerirdischen Ursprungs?
