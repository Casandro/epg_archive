  description: |-
    USA 2017
    Während des Kalten Krieges versetzen unbekannte Flugobjekte die Regierungen auf der ganzen Welt in höchste Alarmbereitschaft. Wurde das weltweite Atomwaffenarsenal von Ufos ausspioniert?

    Seit Jahrzehnten werden vermeintlich unbekannte Flugobjekte gesichtet. Tausende dieser "Ufo-Sichtungen" sind in offiziellen US-Regierungsakten dokumentiert. Der "Rendlesham-Forest-Zwischenfall" im Jahr 1980 gilt als einer der am besten dokumentierten.
