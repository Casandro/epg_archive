  description: |-
    Deutschland 2009
    Der Justizpalast von Nürnberg ist 218 Verhandlungstage lang Schauplatz des historischen Ereignisses. Im Oktober 1946 endet der Hauptprozess mit der Verkündung von zwölf Todesurteilen.

    Der Autor Michael Kloft hat mit den letzten lebenden Zeitzeugen und mit Experten gesprochen. Mithilfe einer umfangreichen Sammlung von Originalfilmen und Fotos rekonstruiert er das Verfahren im Gerichtssaal - und die Vorgänge hinter den Kulissen.
