    Schon im Mittelalter, lange vor der Erfindung der Flugzeuge, entwickeln findige Heeresführer erste Raketen. Eine Weiterentwicklung stammt aus dem Korea des 15. Jahrhunderts: Die "Hwacha" kann bis zu 100 tödliche Raketenpfeile gleichzeitig abfeuern.
