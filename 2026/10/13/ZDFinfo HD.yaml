  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Deutschland in der Mitte der "Goldenen Zwanzigerjahre". Adolf Hitler ist noch ein unbekannter Provinzpolitiker. Parteien der demokratischen Mitte bestimmen die Politik.

    Sechs Jahre nach Ausrufung der ersten deutschen Republik scheint die junge Demokratie endlich stabil zu sein. Doch der Tod von Reichspräsident Friedrich Ebert im Februar 1925 erschüttert das Land. Nur wenige Stunden zuvor gründet Hitler die verbotene NSDAP neu.
    HD-Produktion
- eventId: 1327821
  start: 2026-10-13T00:45:00Z
  stop: 2026-10-13T01:30:00Z
  title: Countdown zur Diktatur
  subtitle: 1929-1931 Krise
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Der New Yorker Börsencrash 1929 stürzt die Welt in Arbeitslosigkeit, Armut und Inflation. Besonders hart trifft es Deutschland, das sich gerade erst von Krieg und Schulden zu erholen beginnt.

    Das Deutsche Reich ist jetzt seit zehn Jahren parlamentarische Demokratie. Aber die schwere Wirtschaftskrise nach dem "Schwarzen Freitag" lässt die Zustimmung zur Demokratie rapide sinken. Immer mehr Deutsche wenden sich Nationalsozialisten oder Kommunisten zu.
    HD-Produktion
- eventId: 1327822
  start: 2026-10-13T01:30:00Z
  stop: 2026-10-13T02:15:00Z
  title: Countdown zur Diktatur
  subtitle: 1931-1933 Abgrund
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Die Feinde der Demokratie nutzen die Krise, um das Parlament zu entmachten. Wird der Weg in eine nationalrevolutionäre Diktatur, zurück zur Monarchie oder in den Kommunismus führen?

    In ganz Europa sind Rechtsnationalisten auf dem Vormarsch. Zwei von drei europäischen Demokratien überstehen die zwei Jahrzehnte zwischen den Weltkriegen nicht. Bei den Wahlen zum Deutschen Reichstag im Juli 1932 wird Hitlers NSDAP stärkste Kraft.
    HD-Produktion
- eventId: 1330007
  start: 2026-10-13T02:15:00Z
  stop: 2026-10-13T02:45:00Z
  title: Countdown zur Diktatur
  subtitle: 1933-1934 Zerstörung
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    30. Januar 1933. Deutschland hat einen neuen Kanzler. Konservative und Monarchisten haben Hitler ins Amt gehievt. Im Glauben, ihn und seine Anhänger "zähmen" zu können.

    Tatsächlich ist der neue Kanzler noch weit von einer Alleinherrschaft entfernt - und Deutschland auf dem Papier noch eine Demokratie. Es dauert noch 18 Monate voller Willkür, Rechtsbruch, Mord und politischem Versagen, bis die Nazis die ganze Macht in Händen halten.
    HD-Produktion
