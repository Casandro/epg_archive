  description: "\"Fluss\" folgt der Elbe von der Quelle im Riesengebirge bis zur Mündung in die Nordsee - eine Reise durch Landschaften, Geschichte und Arbeitswelten. Statt Postkartenansichten zeigt der Film Orte, die man sonst nicht zu sehen bekommt: Steinbrüche, Stahlwerke, Forschungsschiffe, Containerriesen, militärische Übungen. \nArchivbilder öffnen Resonanzräume, in denen Vergangenheit und Gegenwart ineinandergreifen. So entsteht ein Film über Vergänglichkeit und Wiederkehr, über die Kraft des Wassers und die Grenzen menschlicher Eingriffe."
