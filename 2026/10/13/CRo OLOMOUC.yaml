  title: Cimbál a husle
  description: Jak zní ryze česká lidová písnička a jaké melodie si po staletí zpívali lidé v malebných, českých vesničkách a okolních luzích a hájích? Jaké hudební poklady skrývá krajina, kde místo cimbálu udávají krok spíš dudy a klarinety? Nová epizoda z cyklu "Cimbál a husle" vás zve na hudební výlet směrem na západ. Zastavíme se totiž přímo pod klatovskou věží a zaposloucháme se do rázovitosti českého hudebního folkloru. Připravuje Honza Žůrek.
