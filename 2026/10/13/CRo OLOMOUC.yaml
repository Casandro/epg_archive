  title: Okolo češtiny
  description: Snad každý z nás si myslí, že pokud něco opravdu dobře ovládá, je to mateřský jazyk. Rozumíme mu, dokážeme se s ním domluvit a ke všemu se ho pěknou řádku let učíme ve škole. Čeština jakoby nás neměla vůbec čím překvapit. Ale ruku na srdce, je tomu opravdu tak? Bohemista Ondřej Bláha vás labyrintem českého jazyka spolehlivě provede.
