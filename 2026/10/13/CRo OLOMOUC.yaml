  title: Dobrá rada
  description: Kdy se smí provádět kácení a ořez dřevin? Co je to období vegetačního klidu? Proč jsou i staré stromy s dutinami důležité, a proč není dobré kácet v době vegetace? Je možné bez povolení pokácet památný strom? A jaký postup - i právní - je třeba při kácení dodržovat? Téma otevřeme s odborníkem na přírodu, zoologem a ornitologem Evženem Tošenovským. Moderuje Zora Ježková.
