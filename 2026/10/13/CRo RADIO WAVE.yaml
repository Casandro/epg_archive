  description: '"Můj politický statement je second hand." Berlin Manson vydali Cheap Fashion a sami jsou velmi v módě - a rozhodně ne laciní. S Adamem i Patrikem dali Modeláři řeč o inspirativních lidech ve veřejném prostoru, návratu ke kytarám a taky chození do fitka a nadcházející roli pedagoga. Mohli být one hit wonder, ale naštěstí se rozhodli jinak.'
