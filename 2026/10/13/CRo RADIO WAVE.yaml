  title: Podhoubí
  description: Podhoubí je magazín o přírodě, životním prostředí a všech cestách k šetrnému životu. Přinášíme v něm rozhovory s odborníky, ochranáři, zemědělci i dalšími aktivními lidmi, jimž životní prostředí není lhostejné. Vysvětlujeme environmentální témata, která v současnosti výrazně pronikají do společenské diskuze. Moderují Magdaléna Kořenová a Prokop Pithart.
- eventId:
  - 707818
  - 721784
  start: 2026-10-13T16:00:00Z
  stop: 2026-10-13T17:00:00Z
  title: Šatníky
  description: Šatníky přináší příběhy módy z českých skříní a ulic. Poslechněte si, co se skutečně nosí a proč. Hledáme odpovědi na to, co dnes móda pro lidi znamená, jakou má hodnotu a co o nás prozrazuje. Za poklady ze skříní zajímavých osobností vás každé úterý od 18:00 zavede Veronika Ruppert a Veronika Dušková.
- eventId:
  - 707819
  - 721785
  start: 2026-10-13T17:00:00Z
  stop: 2026-10-13T17:30:00Z
  title: Nádech
  description: Štíhlost jako ideál. Co dělat, když nám sociální sítě podsouvají nezdravé a škodlivé obsahy? A jde se vůbec problematickým komentářům a narativům spojeným s tělesností vyhnout? Odkud se bere představa "správného" těla? Jaký obsah na sociálních sítích může být problematický? Jak do scrollování zapojit kritické uvažování? A jak posílit svou sebehodnotu a nespojovat ji tolik s tím, jak vypadáme? Poslechněte si nový díl pořadu Nádech s nutriční terapeutkou a psychoterapeutkou ve výcviku Lesanou Hodek.
