  title: Impakt
  description: Asi 20 tisíc lidí je v Česku zcela bez střechy nad hlavou. Ve věku 18 až 27 let jich pak na ulici žije asi 1500. "Končí tam lidi z dětských domovů, nemají záchrannou síť," říká analytik Mikuláš Opletal z Platformy pro sociální bydlení. Proč je bezdomovectví tak vděčné politické téma? A jak zásadní roli hrají duševní obtíže nebo queer identita? Poslechněte si nový Impakt s Mikulášem Opletalem na Radiu Wave.
