  title: DER SCHOENSTE MORGEN
  description: 'Guten Morgen: Julia Rosebrock und Lars Wohlfarth bringen Sie gut gelaunt in den Tag. Mit den Hits unseres Lebens und allem, was Sie an diesem Morgen wissen müssen. Unsere Reporter sind für Sie in Sachsen-Anhalt, Deutschland und der Welt unterwegs. Immer zur vollen Stunde bekommen Sie in den Nachrichten einen Überblick über das Geschehen. Unsere Studios in Stendal, Dessau-Roßlau, Halle und Magdeburg berichten zur halben Stunde aus Ihrer Region. Die Experten im MDR-Wetterstudio sagen Ihnen, ob Sie einen Schirm oder Schal brauchen oder ob die Sonne scheint. Und die Verkehrsredaktion sorgt dafür, dass Sie entspannt unterwegs sein können. Christen erzählen bei "Angedacht" bemerkenswerte Alltagsgeschichten und Gedanken zum Tage.'
