    Fahrzeughalter zwischen 65 bis 75 Jahren zahlen generell höhere Prämien für Kfz-Haftpflichtversicherungen. Auch mit hoher Schadensfreiheitsklasse zahlen sie im Vergleich zu jüngeren Versicherungsnehmer-Gruppen immer drauf. Dies belegt ein Test des Instituts für Demokratie und Zivilgesellschaft. Versicherungen rechtfertigen diese Praxis als notwendige Risikokalkulation und verweisen auf das Allgemeine Gleichbehandlungsgesetz (AGG) und Unfallstatistiken.
