  description: Program Radio-televizije Srbije ove jeseni obogatiće nova dnevna emisija "Druga kafa", koja pred gledaoce Prvog programa stiže 14. septembra, a emitovaće se radnim danima od 10.30 časova. Reč je o savremenom televizijskom formatu koji na jedinstven način spaja informativnost, opuštenu atmosferu i vrhunsku zabavu. Odmah nakon Jutarnjeg programa, "Druga kafa" će gledaocima ponuditi sadržajan nastavak prepodneva, uz korisne informacije, zanimljive priče i poruku da je svaki dan bolji kada ga započnete uz dobru kafu i još bolju atmosferu. Voditelji emisije su Milja Gogić i Milenko Krišan, a u studiju će im se pridružiti kuvar Mladen Arsić, koji će iz dana u dan pripremati raznovrsna jela - od zdravih, laganih salata i obroka namenjenih savremenom načinu života, do egzotičnih specijaliteta iz različitih kuhinja sveta, ali i slatkih poslastica koje svi obožavaju. Recepti će biti jednostavni, primenjivi i prilagođeni svakom domu. "Druga kafa" obuhvatiće širok spektar tema - od društvenih...
