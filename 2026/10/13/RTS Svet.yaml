  description: Narodni orkestar Radio-televizije Srbije proslavio je jubilej 80 godina rada koncertom podnazivom "Tradicija svilom povezana", 2015. godine u sali Kolarčeve zadužbine. Na oduševljenje publike, iz bogate muzičke riznice, poput niti, jedna za drugom vezle su se najpoznatije srpske narodne pesme i kola tokom podsećanja na blago sačuvano u Zvučnom arhivu RTS-a. U prvom delu koncerta predstavili su se instrumentalni solisti Narodnog orkestra RTS, a nastupili su i nekadašnji šefovi orkestra Boki Milošević i Ljubiša Pavković, kao i sadašnji umetnički rukovodilac Vlada Panović.
