  title: Sasvim prirodno
  subtitle: '"Sasvim prirodno" je dokumentarno putopisni serijal o prirodi, životinjama i ljudima koji žive sa prirodom.'
  description: Sasvim Prirodno je dokumentarno putopisni serijal o prirodi, životinjama i ljudima koji žive sa prirodom. Naš tim putuje Srbijom, Crnom Gorom, Balkanom i svetom. Bili smo na Islandu, Grenlandu, Svalbardu, u Sibiru, Laponiji, Norveškoj, Tadžikistanu, Kirgistanu, Kolskom poluostrvu, itd. Cilj nam je da kameru odnesemo na mesta na kojima je retko ili nikada pre bila, da damo glas onima koji se retko čuju, da zabeležimo predele koji se retko viđaju, ali pre svega da ispričamo priče o načinima života koji su u skladu sa prirodom. Kroz tradiciju i kulturu naroda najbolje se vidi neraskidiva veza između čoveka i sredine u kojoj živi. Naše priče su dokumentovane da vas podsećaju na tu vezu i da vam ne dozvole da se od prirode otuđite.
