  title: Djeca sunca, dokumentarna serija (5/7)
  subtitle: ' '
  description: 'U šestoj epizodi upoznat ćemo rad njemačkog optičara Josepha Fraunhofera, koji je zaslužan za otkriće helija i drugih elemenata na Suncu. Dr. Jacob Liberman nastavlja šetnju kroz povijest heliterapije kroz rad indijskog znanstvenika dr. Dinsha Ghadialija. Saznat ćemo kako će funkcionirati svemirske solarne elektrane koje će predstaviti John Mankins i Neville Marzwell iz kalifornijskog JPL-a. Acharya S. predstavit će neke solarne tradicije diljem svijeta, a istarski astronom Korado Korlević megalitske ostatke u Istri, drevne solarne kalendare. Astronom Bojan Vršnak upoznat će nas s načinima promatranja Sunca raznim vrstama teleskopa. Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
