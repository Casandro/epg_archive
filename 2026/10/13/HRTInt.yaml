  title: Kod nas doma
  subtitle: ' '
  description: Više od tri desetljeća Gazde osvajaju publiku prepoznatljivim tamburaškim zvukom. Novi singl "Danas jesi, sutra nisi" i nadolazeći deseti studijski album predstavit će nam članovi benda Marko Bujanović i Damir Popović. Jedan od najomiljenijih HRT-ovih zabavnih formata, "Ples sa zvijezdama", vraća se na Hrvatsku televiziju u subotu, 31. listopada! Među zvijezdama koje će pokazati svoje plesno umijeće je i pjevačica koju smo dosad navikli gledati na glazbenoj pozornici. U goste nam stiže Marija Husar Rimac. "Šokačka rapsodija" slavi 20 godina velikim koncertom u zagrebačkoj Areni. Javljamo se uživo uoči velikog glazbenog spektakla.
