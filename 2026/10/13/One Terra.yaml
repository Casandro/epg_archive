  title: Planet Weltweit - Der weiße Berg von Feuerland
  subtitle: Planet Weltweit - Der weiße Berg von Feuerland
  description: Am südlichsten Ende Südamerikas, zwischen Atlantik und Pazifik, dehnt sich Feuerland als weites Inselmeer bis in die Antarktis aus. Der portugiesische Seefahrer Magellan gab der Gegend einst ihren Namen - ihn hatten die zahllosen Feuer überrascht, die die Ureinwohner zum Schutz gegen die ständige Kälte anzündeten. Die Berggipfel sind von zahlreichen Gletscher umpanzert, die in die Täler fließen und nicht selten bis ins Meer hineinragen. Nur an den windabgewandten Berghängen kann üppiger, immergrüner Urwald aus Buchen, Zypressen und Magnolien wachsen. Unzählige kleine Inseln ragen aus dem Meer, Schlupfwinkel für Kormorane, Fischotter und Seelöwen. Zwei Chilenen, die Eheleute Patricia Soto und Rodrigo Fica, haben sich vorgenommen, den Monte Sarmiento zu bezwingen. Die beiden zählen zu Chiles erfahrendsten Bergsteigern. Patricia Soto war bereits auf dem Mount Everest, Rodrigo Fica durchquerte mit seinem Team als Erster das patagonische Inlandeis. Der Monte Sarmiento ist für beide schon lange ein Traumziel. Doch bereits die Anreise zum Berg stellt eine Herausforderung dar - vom feuerländischen Marinestützpunkt Puerto Williams geht es per Schiff über zahllose, verschlungene Wasserwege in den fast menschenleeren Südwesten. Die raue Natur strapaziert die Expedition unterwegs mit Stürmen, Eisschollen und kieselgroßen Hagelkörnern. Auf der letzten Etappe geht es für die Bergsteiger zu Fuß weiter. Doch auch dann ist das Ziel noch nicht erreicht. Der Monte Sarmiento gilt nicht umsonst als einer der am schwierigsten zu erklimmenden Berge. Selbst als er nur noch wenige hundert Meter entfernt ist, gilt es als keineswegs sicher, dass Patricia Soto und Rodrigo Fica seinen Gipfel ereichen werden.  DE 2005
- eventId: 660691
