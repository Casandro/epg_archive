  title: Planet Weltweit - Die Bärenhunde von Nevada
  subtitle: Planet Weltweit - Die Bärenhunde von Nevada
  description: Ein Bär auf der Veranda. Er sucht Futter bei den Menschen. Das kann gefährlich werden, für Mensch und Tier. Damit solche Bären nicht abgeschossen werden müssen, hat sich Nevadas staatlicher Bären-Biologe Carl Lackey etwas Besonderes ausgedacht. Er fängt sie ein und verpasst Ihnen mit seinen Karelischen Bärenhunden einen solchen Heidenschrecken, dass sie lange nicht wiederkommen. DE 2015
