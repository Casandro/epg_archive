  title: Planet Weltweit - Die letzten Krokodile Venezuelas
  subtitle: Planet Weltweit - Die letzten Krokodile Venezuelas
  description: Das Orinoco-Krokodil gilt als das größte Raubtier Südamerikas. Über sechs Meter lang wird das seltene nur im Süsswasserbereich des Orinoco lebende Tier. In den letzten Jahren hat der Bestand weiter deutlich abgenommen. Geschätzte 1.500 Tiere gibt es noch in freier Wildbahn. Die El Hato Masaguaral Ranch in Venezuela ist einer der wenigen Orte, wo versucht wird, Jungkrokodile aufzuziehen und anschließend auszuwildern. GEO Reportage hat den Krokodil-Kindergarten besucht. Janel Abas hat eine verantwortungsvolle Aufgabe auf der El Hato Masaguaral Ranch, einer ehemaligen Rinderfarm im Norden Venezuelas. Deren Mitarbeiter haben es sich zur Aufgabe gemacht, das in den letzten Jahren selten gewordene Orinoco-Krokodil zu retten. Nachdem die Tiere früher wegen ihres Leders schonungslos gejagt wurden, sind heute die Verringerung ihres Lebensraums und die zunehmende Umweltbelastung die Hauptgründe für ihre Gefährdung. Zu Janels Aufgaben gehört es, die Brut der Eier sowie die Aufzucht der Jungkrokodile zu betreuen, bis diese ausgewildert werden können. Für Nachschub sorgen zum einen Elterntiere auf der Farm. Zum anderen werden Eier und Jungtiere in den Seitenarmen des Orinoco eingesammelt, deren Überlebenschancen bis zum ersten Lebensjahr in der freien Natur sehr gering sind. Eine nicht ungefährliche Aufgabe. Denn auch wenn die Orinoco-Krokodile sehr ruhige Vertreter sind, ihr Nest bewachen sie akribisch. Erschwerend kommt hinzu, dass die Wirtschaftskrise, in der sich Venezuela befindet, auch auf der Farm zu spüren ist. Stromausfälle sorgen für Unterbrechungen bei Licht und Heizung und bedrohen die empfindlichen Gelege. Durch defekte Kühlsysteme kann das Fleisch für die Tiere nicht mehr haltbar gemacht werden. Dennoch sollen demnächst wieder Jungtiere ausgesetzt werden.  DE 2016
