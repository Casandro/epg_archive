  title: Planet Weltweit - Notruf Nordseeküste - Die Robben-Retter
  subtitle: Planet Weltweit - Notruf Nordseeküste - Die Robben-Retter
  description: 'Die Nordsee ist ihr Revier: Seehunde und Kegelrobben, zwei Robbenarten, die miteinander verwandt sind und zu den sogenannten "Hundsrobben" gehören. Sie sind perfekt an ein Leben über und unter Wasser angepasst. Aber wenn Menschen den Robbenbabys zu nah kommen, flüchten die Mütter und nehmen ihren Nachwuchs auch später nicht mehr an. Dann müssen die Robben-Retter ausrücken, um die kleinen "Heuler" mit ihren Kulleraugen vor dem sicheren Hungertod zu bewahren. Jedes Jahr im Frühsommer werden auf den Sandbänken und an den Stränden der Nordsee Hunderte Seehundbabys geboren. Manchmal werden diese Welpen von der Mutter getrennt und können nicht mehr gesäugt werden. Dies passiert zum Beispiel, wenn Menschen oder Hunde den Robbenbabys zu nah kommen oder sie sogar streicheln. Riecht ein Jungtier nach Mensch, wird es von der Mutter nicht mehr angenommen und zurückgelassen, dann heult es vor Hunger und Einsamkeit. Von Borkum bis Helgoland sammeln die Robben-Retter sie ein und bringen sie in die nächstgelegene Seehundstation. Dort werden die Babys tierärztlich versorgt, wieder aufgepäppelt und in den nächsten Wochen aufgezogen. Sie lernen vor allem, selbstständig Fisch zu fressen und den Konkurrenzkampf mit Artgenossen zu bestehen, bevor sie an einsamen Strandabschnitten wieder ausgewildert werden DE 2020'
- eventId: 660811
  start: 2026-10-13T13:10:00Z
  stop: 2026-10-13T14:02:00Z
  title: Planet Weltweit - Das Elefantenkrankenhaus von Thailand
  subtitle: Planet Weltweit - Das Elefantenkrankenhaus von Thailand
  description: 'Sie haben Knochenbrüche, Mangelernährung, wurden misshandelt, sind dehydriert oder gar auf eine Mine getreten. Für viele Elefanten Asiens sind diese Krankheitsbilder der sichere Tod. Doch im Norden Thailands gibt es einen Ort, der seit vielen Jahren Zuflucht und oftmals letzte Rettung ist: Das Elefantenkrankenhaus. Hier wurden erstmalig auch Beinprothesen für die Dickhäuter angepasst. Elefanten sind ein fester Bestandteil in der thailändischen Kultur, die Tiere gelten als Glücksbringer, das Königshaus hält sich selbst eine eigene Armee an Elefanten und bis zum Ende des letzten Jahrhunderts konnten die Tiere ganz legal als Arbeitstiere eingesetzt werden. Doch wenn es um die Pflege von kranken Tieren ging, dann war dafür lange Zeit niemand zuständig, genau genommen wollte niemand dafür zuständig sein. Es musste erst eine Frau kommen und mit eisernem Willen etwas auf die Beine stellen, was bis zum Jahre 1993 als undenkbar galt: Soraida Salwala ist die Gründerin und Besitzerin des ersten Elefantenkrankenhauses in Lampang. Professionell ausgestattet, rund um die Uhr geöffnet, mit einer kostenlosen Behandlung für jeden Elefanten, der Versorgung benötigt: Eine bis dato weltweit einmalige Auffangstation für kranke und verletzte Elefanten.  GEO Reportage war drei Wochen mit den Tierärzten und -pflegern unterwegs. DE 2016'
  ageRating: 6
- eventId: 660812
