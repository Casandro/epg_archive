  subtitle: Planet Weltweit - Der Waldrapp - Punkvogel aus den Alpen
  description: Der exotisch anmutende Waldrapp gehört zu den am stärksten bedrohten Vogelarten weltweit, nur im Zoo gibt es noch einige Exemplare. In freier Natur fliegen die Ibisvögel im Winter von Deutschland nach Italien, doch die Zootiere haben den Weg vergessen. Ein Team aus menschlichen Vogelmüttern zieht in diesem Jahr wieder Küken von Hand auf, um mit ihnen im Spätherbst über die Alpen zu fliegen.  DE 2015
