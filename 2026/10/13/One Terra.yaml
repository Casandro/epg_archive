  stop: 2026-10-13T09:02:00Z
  title: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  subtitle: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  description: 'Ein Vogel, der so viel kostet wie ein Auto, ja sogar ein Haus. In Singapur ist das keine Seltenheit. Singvogel-Liebhaber scheuen dort weder Kosten noch Mühen für die Stars der Szene: Sperbertauben, Schama- und Dajaldrosseln, Bülbüls und Brillenvögel. Je schöner ein Vogel singt, desto teurer ist er. Singvogel-Wettbewerbe demonstrieren diesen Status. Doch die Liebe zu den gefiederten Stimmathleten hat auch Schattenseiten, denn sie befeuert den illegalen Vogelhandel. Die GEO Reportage taucht mit Vogelzüchtern und Umweltaktivisten in den Kosmos von Singapurs Singvögeln. Seine Schamadrosseln, Bülbüls und Finken sind Amirs ganzer Stolz. Am Wochenende trifft er sich mit Gleichgesinnten im Kebun Baru Singing Bird Club in Singapur. Dort steht bald der nächste Wettkampf an. Amir und sein Bülbül Ramdan müssen trainieren. Außer Prestige gibt es dabei nicht viel für Amir zu gewinnen. Denn Wetten und Glücksspiel sind in Singapur verboten. Doch als Züchter will sich Amir einen Namen machen. Das hat in Singapur allerdings seine Tücken: Nur Zoohandlungen dürfen gezüchtete Jungtiere verkaufen. Aber kaum jemand kann nachverfolgen, ob die dort angebotenen Vögel wirklich aus Zuchten stammen. Wildfänge findet man dort ebenso wie in privaten Sammlungen häufig. Ein großes Problem im Stadtstaat, das sowohl Behörden als auch private Umweltverbände herausfordert. Amir ist davon überzeugt: private Züchter können dazu beitragen, der Wilderei den Nährboden zu entziehen, wenn der Handel unter den Vogelzüchtern legalisiert würde. Auch er selber könnte davon profitieren, denn seine Tiere brüten seit Jahren erfolgreich. Deshalb überlegt er, Singapur in Richtung Indonesien zu verlassen. Dort ist der Handel mit den Zuchtvögeln legal. Zuvor müssen er und sein Champion Ramdan jedoch im nächsten Wettbewerb bestehen. DE 2020'
- eventId: 660781
  start: 2026-10-13T09:10:00Z
  stop: 2026-10-13T10:02:00Z
  title: Planet Weltweit - Moskaus berühmte Sprengstoffhunde
  subtitle: Planet Weltweit - Moskaus berühmte Sprengstoffhunde
  description: 'Der Flughafen Sheremetjevo in Moskau ist mit 40 Millionen Passagieren im Jahr einer der größten europäischen Flughäfen. Die Sicherheitsabteilung der Aeroflot setzt im Kampf gegen Sprengstoff-Terrorismus u.a. auf eine ganz besondere Abwehrmethode: Die sogenannten Sulimov-Hunde, Hybriden aus Schakal und dem arktischen Herden-Laika. Sie gelten als die weltbesten "Schnüffler" unter den Hunden. 50 Hunde leben in den Zwingern der Aufzuchtstation am Rand von Moskau. Welpen, Halbwüchsige und erwachsene Hunde. Elena Batajeva ist die Direktorin des kynologischen Zentrums, der Hundetrainingsstation, die der Sicherheitsdienst der Aeroflot unterhält. 25 Mitarbeiter kümmern sich hier rund um die Uhr um die Hunde. Ihr Alltag besteht aus Spielen, Trainieren und den Einsätzen am Flughafen. Nur zum Schlafen und Fressen werden sie in den karg anmutenden Zwingern untergebracht. Elena Batajeva: "Sie haben einen sehr scharfen Geruchssinn, einen kompakten Körperbau, sie sind unprätentiös und absolut unaggressiv Menschen gegenüber." Die Lehrmethode ist auf Belohnung durch Fressen ausgerichtet und baut auf den angeborenen Suchinstinkt der Hunde. Ihre Trefferquote ist so hoch wie bei keinem anderen Spürhund. In Zeiten, da der moderne Terrorismus immer neue, weiter entwickelte Sprengstoffe benutzt, ist das Training mit den Hunden eine Herausforderung. Anderthalb bis zwei Jahre dauert es, bis ein Hund einsatzbereit ist. Elena und ihre Kollegen arbeiten außerdem an dem Prototyp einer elektronischen Ausrüstung, die die Reaktionen des Hundes bei der Suche an ein Smartphone oder Tablet weiterleitet, so dass der Hund alleine das Cockpit eines Flugzeuges nach verdächtigen Stoffen absuchen kann. Doch das Gerät hat noch Tücken. Wie wird es sich in einem ersten Einsatz bewähren? DE 2018'
