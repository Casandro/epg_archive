  title: Planet Weltweit - Die Millionen-Dollar-Hirsche
  subtitle: Planet Weltweit - Die Millionen-Dollar-Hirsche
  description: 'Am Fuße des Altai-Gebirges, zwischen Russland, China und der Mongolei, leben die Maral-Hirsche, deren majestätisches Geweih in der fernöstlichen Medizin ein beliebtes Heilmittel ist. Sibirische Wildhüter treiben die Tiere deshalb in den Sommermonaten zusammen, um ihnen ihren Kopfschmuck abzusägen, was bei aller Erfahrung nicht immer gelingt. "Das letzte Mal haben wir ungefähr 500 Marale inspiziert. Davon hab ich 60 ausgewählt, die wir dann beschnitten haben", sagt Sasha Tcherepanov, der gemeinsam mit seinen Brüdern je Saison 2500 Hirsche unter die Lupe nehmen muss. Es ist Juni im Hirschrevier Sauzar, und den Wildhütern bleibt für die Geweihernte nicht mehr viel Zeit. Denn jetzt ist der Kopfschmuck der Marale zwar ausgewachsen, jedoch noch mit Basthaaren überzogen und durchblutet - ein Zustand, in dem die Geweihe am wertvollsten sind. Mehrere Hundert Dollar kostet ein Geweih. Für die Abnehmer, die hauptsächlich aus Südkorea anreisen, ist der Preis kein Problem. Schließlich finden russische Bastgeweihe in ihrem Heimatland einen reißenden Absatz: In hauchdünne Scheiben geschnitten, verwenden sie Ärzte und Krankhäuser häufig als Teebeimischung. Eine schmerzlindernde Wirkung versprechen sich Sasha und seine Brüder außerdem von dem Blutsud, der nach dem Kochen der Maral-Geweihe übrig bleibt. Seit kurzem bieten sie Hirschblut-Bäder auf ihrer Farm an, an denen vor allem Geschäftsmänner aus Russland großen Gefallen finden. Sie schwören auf die aphrodisierende Wirkung, die der Saft der Edelgeweihe in sich birgt. Nur noch wenige Wochen trennen die Wildhüter vom ersten Kälteeinbruch und ihrer Rückkehr ins Dorf. An manchen Wintertagen kann die Temperatur im sibirischen Dreiländereck auf bis zu minus 55 Grad sinken. Bis dahin müssen alle Geweihe geerntet sein. Die Tcherepanov-Brüder stehen unter Zeitdruck. Über 400 Marale haben sie zusammen gepfercht, als die Herde plötzlich ausbricht. Auf den Zäunen suchen die Männer Zuflucht, um den Hufen der Hirsche zu entkommen. DE 2006'
- eventId: 660930
  start: 2026-10-13T23:15:00Z
  stop: 2026-10-14T00:07:00Z
  title: Planet Weltweit - Sumatra - Ettis Schönheitssalon
  subtitle: Planet Weltweit - Sumatra - Ettis Schönheitssalon
  description: 'Seit mehr als 20 Jahren führt Elitha Suarti Heirunas ihren Schönheitssalon in Bukittinggi auf Westsumatra. Ettis Salon ist eine Institution. Plakate mit asiatischen Schönheiten verraten die neuesten Trends, auch wenn bei den meisten Frauen der wichtigste Haarschmuck das Kopftuch bleibt. Denn auf Westsumatra ist der Islam Hauptreligion. Obwohl Westsumatra zwischen dem 13. und 15. Jahrhundert islamisiert wurde, hat sich ein Großteil der Einwohner, die Volksgruppe der Minangkabau, Teile ihrer früheren Tradition bewahrt. Neben den islamischen Regeln folgen sie dem Adat - einem matrilinear organisierten Gesellschaftssystem. Bis heute sind es nur die Frauen der Minangkabau, die erben - ihnen gehört sämtlicher Besitz. Aber der Einfluss des patriarchalisch geprägten Islam ist dennoch deutlich zu spüren. Friseur- und Kosmetiksalons wie der von Etti hatten lange einen zweifelhaften Ruf: Sie seien nicht "haram", nicht rein. Aber Etti ist über 20 Jahre beharrlich ihren Weg gegangen und überzeugt durch ihre Seriosität. Auch bei der Organisation von Hochzeiten verlässt man sich gerne auf Ettis jahrzehntelange Erfahrung bei der Verschönerung von Haus und Braut. In wenigen Stunden verwandelt sie mit ihrem Team das Haus der Brauteltern in einen prunkvollen Palast aus Gold, feinen Stoffen und aufwendig verzierten Holzbauten. Früher war die Organisation der Hochzeiten ausschließlich Angelegenheit der Familie. Aber auch auf Westsumatra läuft die Zeit immer schneller. Heute überlässt man die aufwendige Arbeit lieber erfahrenen und routinierten Spezialisten wie Etti. Auch Epi hat sich für eine Hochzeit vom Profi entschieden - seit Tagen schon kümmert sich Etti um die Organisation, verziert die Torte, sorgt für die Schönheit der Braut und die Verpflegung der Gäste. Doch ein Restrisiko bliebt immer, denn Etti weiß "Bei der ganzen Aufregung kann immer etwas schief gehen. Eine Hochzeit bleibt eben von Anfang bis Ende etwas, was man nicht genau berechnen kann."  DE 2006'
