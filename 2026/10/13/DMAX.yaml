  title: Die Helgoländer
  subtitle: Von Bullen und Ochsen
  description: |-
    Tjark ist neu auf Helgoland. Auf einer Fahrt in einem der wenigen Autos auf der Insel wird der Polizist von seinem Vorgesetzten Peter in die Gepflogenheiten auf dem Eiland eingewiesen. Die Gesetzeshüter sind dort mit besonderen Bedingungen konfrontiert. Hummerfischer Sven und Handwerker Nils versenken in der Nordsee Begrenzungsbojen. Beim Absetzen der rund 60 Kilo schweren Betonsockel ist volle Konzentration gefragt. Und Jaqueline und Marc stehen kurz vor der Eröffnung ihres Bagel-Bistros. Heute soll ein Kühlcontainer eintreffen. Verläuft die Lieferung wie geplant?
