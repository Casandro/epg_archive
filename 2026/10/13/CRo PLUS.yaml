  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Marika Šoposká je filmová a divadelní herečka: "Psaním her přesahujete herectví, myslím, že díky tomu můžete interpretovat myšlenky, názory a dostat je mezi víc lidí. Na divadlo jsem se vždycky dívala víc komplexně, než na jednu svou roli," říká o své nové zkušenosti s autorstvím divadelních inscenací. Co potřebuje, aby mohla psát divadelní hry? Jak se dá v herectví růst, když je člověk povahou perfekcionista? Jaké nové formy chce zkoumat a čím je jí blízká poslední filmová role zakladatelky úspěšné kosmetické značky, která půjde do kin v roce 2027? Moderuje Michael Rozsypal.'
