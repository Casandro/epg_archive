  title: Wir im Saarland - Grenzenlos extra
  subtitle: 'Einmal Sammler, immer Sammler: außergewöhnliche Kollektionen in Grand Est'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Oft beginnt es mit einem einzigen Objekt. Irgendwann gesellt sich ein zweites dazu, bald darauf ein drittes. Sammeln, suchen, vervollständigen und doch immer wieder weitersammeln. Unter unseren Nachbarn in der Region Grand Est sind zahllose Sammler und Sammlerinnen - manche mit originellen Themen, andere eher konventionell, aber alle mit Leidenschaft. Im luxemburgischen Dörfchen Hinkel sammelt Jean Birsens Matchbox-Autos. In Pfastatt in der Nähe von Mulhouse entdecken wir die beeindruckende Sammlung von Jacqueline Goepfert: sie sammelt "Fèves", die Figürchen, die man im Dreikönigskuchen versteckt.'
