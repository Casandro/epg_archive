  description: 'Oma Anni wohnt und arbeitet jetzt auf dem Rossbauerhof. Gerade hat sie ihrer innig verbundenen Intimfeindin Elisabeth mit der Rückkehr des Geistes vom verstorbenen Ludwig gedroht, da sitzt der schon an ihrem Bett und würgt sie. Allerdings hat Ludwig neuerdings Flügel wie ein gerupftes Huhn. Sollte er ein Engel werden? Im Gasthaus Häberle ist Heinz aufgetaucht: Er sieht dem verstorbenen Alfred zum Verwechseln ähnlich, gibt aber vor, ihn nicht zu kennen. Klara Häberle hat ganz andere Sorgen: Sie betreibt eine heimliche Drogen-Plantage, doch die Gewinne aus Berlin kommen nicht bei ihr an.'
