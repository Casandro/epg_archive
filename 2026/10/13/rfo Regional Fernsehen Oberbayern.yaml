  title: HoamSpui live - Regionalsport Teil 1 (Wh.)
  subtitle: Spieltag 13 - SV Wacker Burghausen gegen SpVgg Greuther Fürth II +++ Face of the Week - Nachwuchsgolfer Marcus Kronast
  description: Greuther Fürths U23 erkämpfte beim SV Wacker Burghausen nach zweimaligem Rückstand ein spektakuläres 3:3, traf durch Günes doppelt und glich in der Nachspielzeit per Fernschuss von Marita aus, was dem Kleeblatt neuen Schwung gibt. +++ Seit vergangenem Jahr spielt Marcus Kronast im Golfclub München-Riedhof und arbeitet an seinem Traum vom Profi; er schätzt den Teamgeist, feilt an Putten und Chippen und findet auf dem anspruchsvollen Platz Maxlrain ideale Trainingsbedingungen.
