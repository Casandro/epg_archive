  title: Süd Journal vom 12.10.2026 (Wh.)
  subtitle: Winterolympioniken beim Bayerischen Sportpreis 2026 ausgezeichnet +++ Planspiel Börse in Waldkraiburg +++ Testphase für Motorradsperre abgelaufen +++ Rund 50 Oldtimer beim Hochbergpreis
  description: 'In der Münchner BMW Welt ehrte Bayern seine Sportstars: Winter-Olympioniken wie Daniela Maier sowie die Rodler Wendl, Arlt, Eitberger und Matschina und Doppel-Goldbobfahrer Johannes Lochner wurden für ihre Leistungen ausgezeichnet, der Sportpreis würdigt auch die Menschen dahinter. +++ Beim Planspiel Börse testen Jugendliche ohne Risiko mit virtuellem Geld, wie Aktienhandel funktioniert und wie sich Gewinne erzielen lassen; auch an der Realschule Waldkraiburg nehmen dieses Jahr wieder viele Schüler teil. +++ Die Motorradsperre am Sudelfeld wurde Ende September und damit einen Monat früher beendet, nachdem das Verwaltungsgericht auf die auf zwölf Monate begrenzte Testdauer hingewiesen hatte; weil sie schon Anfang April startete, stoppten Rosenheim und Miesbach sie gemeinsam, über ein dauerhaftes Verbot. +++ Beim Hochbergpreis in Traunstein fuhren am Sonntag rund 50 historische Fahrzeuge vom Schwimmbad Daxerau hinauf auf den Hochberg, wobei nicht Tempo, sondern zwei möglichst zeitgleiche Durchgänge zählten, darunter klassische Autos, seltene Oldtimer und historische Motorräder.'
- eventId:
  - 1472806
  - 566971
  start: 2026-10-13T02:10:00Z
  stop: 2026-10-13T02:20:00Z
  title: Süd Journal vom 12.10.2026 (Wh.)
  subtitle: Catherine van Bruce auf der Frankfurter Buchmesse +++ Handlungsbedarf am Campus des Sportbunds -  SB DJK Rosenheim hofft auf Förderung für Neubau +++ Süd Sport News +++ Regionalliga Bayern Spieltag 13 - ein Punkt für Buchb..
  description: Die Frankfurter Buchmesse lockt jedes Jahr Hunderttausende an und wird zur Bühne für Autoren wie Catherine van Bruce aus Oberbayern, die dort Inspiration sammelt und sich mit Gleichgesinnten vernetzt, um ihre Leidenschaft fürs Schreiben mit der Welt zu teilen. +++ Wegen marodem Dach und Wasserschäden plant der Sportbund DJK Rosenheim ein neues Multifunktionsgebäude; bei einem Ortstermin informierte sich MdB Daniela Ludwig, während der Verein auf 491.000 Euro aus der Sportmilliarde für Dämmung und Photovoltaik hofft. +++ In der Regionalliga Bayern endeten München II gegen Unterhaching 1:1, Burghausen verspielte beim 3:3 gegen Fürth II eine Zwei-Tore-Führung, Buchbach kam gegen Vilzing nur zu einem 1:1, und in Mühldorf gelang beim 3:1 gegen Stuttgart der dritte Heimsieg. +++ In der Regionalliga Bayern endeten München II gegen Unterhaching sowie Buchbach gegen Vilzing jeweils 1:1, Burghausen verspielte nach 3:1 noch ein 3:3 gegen Fürth II, Buchbach führt nur noch mit einem Punkt, Burghausen ist Achter, Aubstadt und Landsberg bleiben nach 2:2 unten.
- eventId:
  - 1472807
  - 566972
  start: 2026-10-13T02:20:00Z
  stop: 2026-10-13T02:30:00Z
  title: Süd Journal vom 12.10.2026 (Wh.)
  subtitle: DBBL Pokal - Wasserburger Damen fliegen in zweiter Runde raus +++ Zweite BL Süd - Volleyball Mühdlorf Heimsieg gegen Stuttgart +++ Wetter für das Sendegebiet
  description: 'Der TSV 1880 Wasserburg musste sich in der zweiten Runde des DBBL-Pokals dem TS Jahn München mit 59:70 geschlagen geben. Vor heimischem Publikum im Badria erwischten die Wasserburgerinnen einen guten Start, konnten den Vorsprung im weiteren Spielverlauf jedoch nicht halten.  +++ Wasserburg ist aus dem Damen-Basketball-Pokal ausgeschieden, während der TSV Mühldorf in der 2. Volleyball-Bundesliga weiter jubelt: Trotz eines verletzungsbedingten Ausfalls besiegte das Team die Keiler Volleys Stuttgart vor 190 Fans nach 106 Minuten 3:1. +++ Nach einem grauen und nassen Dienstag zeigt sich das Wetter zur Wochenmitte wieder freundlicher. Am Mittwoch und Donnerstag scheint häufig die Sonne, die Temperaturen steigen auf 17 bis 21 Grad am Mittwoch und bis zu 22 Grad am Donnerstag. Damit stehen die Chancen auf goldene Oktober-Momente gut.'
- eventId:
