  title: Süd Journal vom 12.10.2026 (Wh.)
  subtitle: DBBL Pokal - Wasserburger Damen fliegen in zweiter Runde raus +++ Zweite BL Süd - Volleyball Mühdlorf Heimsieg gegen Stuttgart +++ Wetter für das Sendegebiet
  description: 'Der TSV 1880 Wasserburg musste sich in der zweiten Runde des DBBL-Pokals dem TS Jahn München mit 59:70 geschlagen geben. Vor heimischem Publikum im Badria erwischten die Wasserburgerinnen einen guten Start, konnten den Vorsprung im weiteren Spielverlauf jedoch nicht halten.  +++ Wasserburg ist aus dem Damen-Basketball-Pokal ausgeschieden, während der TSV Mühldorf in der 2. Volleyball-Bundesliga weiter jubelt: Trotz eines verletzungsbedingten Ausfalls besiegte das Team die Keiler Volleys Stuttgart vor 190 Fans nach 106 Minuten 3:1. +++ Nach einem grauen und nassen Dienstag zeigt sich das Wetter zur Wochenmitte wieder freundlicher. Am Mittwoch und Donnerstag scheint häufig die Sonne, die Temperaturen steigen auf 17 bis 21 Grad am Mittwoch und bis zu 22 Grad am Donnerstag. Damit stehen die Chancen auf goldene Oktober-Momente gut.'
