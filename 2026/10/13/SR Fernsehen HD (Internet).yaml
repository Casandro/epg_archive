  description: Vorgestellt werden verschiedene Bahnen in Sachsen. Stationen sind unter anderem auch Leipzig und Dresden. Täglich fahren Dampfzüge auf schmaler Spur von Hainsberg in Richtung Erzgebirge. Auf der Elbe verkehrt eine der ältesten und größten Dampfschiffflotten der Welt. Ein besonderes Erlebnis ist die Fahrt in das Elbsandsteingebirge. Auf dem Weg dorthin trifft man auf technische Denkmäler, wie die Hängebrücke "Blaues Wunder", die Standseilbahn und die Schwebebahn bei Loschwitz, deren Metallgerüst Gustave Eiffel konstruiert hat. Das Lustschloss August des Starken in Pillnitz liegt auf dem Weg in Richtung Elbsandsteingebirge.
