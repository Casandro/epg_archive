  start: 2026-10-13T08:25:00Z
  stop: 2026-10-13T09:30:00Z
  title: Otvori spomenar
  subtitle: Religijski
  description: U emisiji gostuje Ivana Kovač, poznata pjevačica zabavne glazbe i kći hrvatske pjevačke legende Mate Miše Kovača. Ivana će se prisjetiti svojega djetinjstva, početaka glazbenog puta u sastavu Magazin i otkriti kako je odlučila krenuti u samostalne glazbene vode. Govorit će o svojemu ocu, legendi hrvatske glazbe, o kojemu s ponosom redovito progovara u javnosti. Otkrit će kako je nakon duljeg duhovnog lutanja pustila Boga u svoj život i odlučila zakoračiti sasvim novim putem, vođena Gospodinovom sigurnom rukom. Urednica i voditeljica emisije je Mirna Sigetić Gudelj.
