  subtitle: Ela i Kvantumi pomažu oko humanitarne pomoći stradalima u prirodnoj katastrofi. Međutim, okolnosti su tako naporne da Ela uskoro shvati da nema snage za nastavak, iako bi jako voljela pomoći.
  description: Ela i Kvantumi pomažu oko humanitarne pomoći stradalima u prirodnoj katastrofi. Međutim, okolnosti su tako naporne da Ela uskoro shvati da nema snage za nastavak, iako bi jako voljela pomoći. U njenom najtežem trenutku, Superknjiga odvodi djecu natrag u vrijeme gdje susreću čovjeka koji je također suočen s nevoljama. Djeca dolaze na brod koji prevozi zatvorenika, imenom Pavao, kako bi ga predali vlastima u Rimu. Prije dolaska u Rim, Pavao se suočava s raznim katastrofama i kad se putovanje činilo najgorim, Bog mu daje snagu da nastavi, pa čak i pomogne drugima u njihovim najmračnijim satima. Ela je ohrabrena sudjelovanjem na Pavlovom putovanju i svjedočenju njegovim čudima na Malti. Ela se zatim, kroz vrijeme, vraća na mjesto humanitarne pomoći toliko ispunjena Duhom da ju nijedna teškoća ne može zaustaviti.
