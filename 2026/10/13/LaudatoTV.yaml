  title: Nova misija
  subtitle: Dokumentarni
  description: 'Dvoje branitelja. Trideset godina braka. Troje djece. I stotine kilometara najtežih svjetskih pustinja. Kad su mnogi mislili da je nakon rata vrijeme za odmor, oni su odlučili pokazati kako se pomiču granice - i u sportu i u životu. Kako izgraditi sretnu obitelj i ostati neslomljivi nakon svega? Renata i Zorislav - supružnici koji pomiču granice mogućeg i poručuju: "Nismo generacija koja je prošla. Sreća je naša zajednička odluka." Dok je Renata u radnom odnosu i snažna čuvarica obitelji, Zorislav kao umirovljeni branitelj niže svoje nove pobjede. Postao je poznat po nevjerojatnim ultramaratonskim pothvatima - poput zahtjevnog Maratona pijeska u Saharskoj pustinji i Tenzing-Hillary Everest Maratona, jedne od najtežih trail utrka na svijetu. Zorislav i prijatelji Martin i Zlatko postali su prva trojica Hrvata u povijesti koji su uspješno istrčali ovaj legendarni maraton.'
