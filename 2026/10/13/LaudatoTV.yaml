  subtitle: Religijski
  description: ',,Pođite po svem svijetu i naviještajte Evanđelje. Ove riječi uoči Misijske nedjelje dobivaju sasvim konkretno lice. Dobivaju lice nade, ali i lica dviju djevojčica iz Benina, Kevine i Machoure, čija je bolna sudbina ujedinila hrvatske liječnike i ljude dobrog srca. Naše su gošće Marijine sestre od čudotvorne medaljice - s. Ivančica Fulir, misionarka u Beninu koja je afričku stvarnost donijela u našu domovinu, i s. Bobana Vidljinović, čiji je životni put svjedočanstvo da s krunicom u ruci nijedna bolest ni prepreka nisu nepobjedive. Kako s osmijehom mijenjati svijet i kako svatko od nas može postati misionar ljubavi? Pogledajte u ,,Izdvojenom!'
