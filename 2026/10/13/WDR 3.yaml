  title: WDR 3 Jazz
  subtitle: 'First Lady of Jazz: Die Pianistin Mary Lou Williams'
  description: "Als gefragte Arrangeurin arbeitete Williams u.a. für Benny Goodman, Duke Ellington und Dizzy Gillespie und schrieb drei Messen. Auch mit dem Free Jazz setzte sie sich - kritisch - auseinander und spielte in der Carnegie Hall ein Duo mit Cecil Taylor. Für ihre musikalischen Verdienste und ihre Vorreiter-Rolle kürte sie das Kennedy Center in Washington posthum zur \"First Lady of Jazz\".\n<strong>A Grand Night for Swinging</strong> | 2:45<br/>Mary Lou Williams\n<strong>A Fungus A Mungus</strong> | 2:55<br/>Mary Lou Williams\n<strong>Who Stole the Lock off the Henhouse Door</strong> | 0:24<br/>Mary Lou Williams\n<strong>Hesitation Boogie</strong> | 0:34<br/>Mary Lou Williams\n<strong>What's That Thing?</strong> | 0:34<br/>Jeanette James\n<strong>Froggy Bottom</strong> | 3:10<br/>Andy Kirk\n<strong>Loose Ankles</strong> | 1:02<br/>Andy Kirk\n<strong>Trumpet No End</strong> | 0:54<br/>Duke Ellington\n<strong>Oo-Bla-Dee</strong> | 0:29<br/>Mary Lou Williams\n<strong>O.W.</strong> | 5:00<br/>Mary Lou Williams\n<strong>N.M.E.</strong> | 0:46<br/>Mary Lou Williams\n<strong>Zodiac Suite</strong> | 0:33<br/>Dizzy Gillespie\n<strong>Praise The Lord </strong>| 0:56<br/>Mary Lou Williams\n<strong>St. Martin de Porres</strong> | 0:52<br/>Mary Lou Williams\n<strong>It Ain't Necessarily So</strong> | 4:40<br/>Mary Lou Williams\n<strong>What's Your Story, Morning Glory?</strong> | 0:42<br/>Marian McPartland &amp; Mary Lou Williams\n<strong>Ayizan</strong> | 5:08<br/>Mary Lou Williams &amp; Cecil Taylor \n<strong>Roll Em</strong> | 0:49<br/>Benny Goodman\n<strong>Old-Fashioned Slow Blues </strong>| 1:09<br/>Mary Lou Williams \n<strong>Lullaby of the Leaves </strong>| 0:45<br/>Kansas City (Soundtrack)\n<strong>Rosa Mae </strong>| 0:24<br/>Marian McPartland &amp; Mary Lou Williams\n<strong>Medi No.2 </strong>| 5:45<br/>Mary Lou Williams\n <strong>All Blues</strong> | 7:01<br/> Mary Lou Williams Trio \n <strong>Baby man</strong> | 8:28<br/> Mary Lou Williams Trio"
