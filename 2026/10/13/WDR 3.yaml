  title: WDR 3 Konzert live
  subtitle: 'Moderation: Johannes Zink'
  description: |-
    "Ein Bogen von der Romantik zur Moderne" - unter diesem Vorzeichen steht der Konzertabend in der Stadthalle Kleve. Geiger Niek Baar und Pianist Ben Kim spannen ein breites Netzwerk von der Klassik bis zur Moderne, mit einer Auswahl, die von César Francks spätromantischer Sonate A-Dur bis zu Anton Weberns knapp gefassten Stücken reicht. Glück und Schmerz liegen dabei oft nah beieinander.

    <strong>Francis Poulenc</strong><br/>Sonate für Violine und Klavier, FP 119

    <strong>César Franck</strong><br/>Sonate für Violine und Klavier A-Dur

    <strong>Anton Webern</strong><br/>Vier Stücke für Violine und Klavier, op. 7

    <strong>Franz Schubert</strong><br/>Fantasie für Violine und Klavier C-Dur
    <strong>Niek Baar</strong>, Violine<br/><strong>Ben Kim</strong>, Klavier
    Live aus der Stadthalle Kleve
