  title: WDR 3 Open
  description: |-
    « Ich hoffe, dass ich eines Tages nicht mehr betonen muss, dass ich eine Schwarze Künstlerin bin, die elektronische Musik macht. » Sagt Dawn Richard, die nicht nur Schwarz ist, sondern auch noch aus New Orleans kommt, was dazu führt, dass sie in die Mardi Gras Jazz &amp; Blues Folklore &amp; Blasmusik-Schublade gesteckt wird. Da will sie raus. Aber ist es dann eine gute Idee, dass sie ihre Alben « Second Line » nennt und « Creole Culture » ? Spielt sie damit nicht genau denjenigen in die Karten, die sich auch 21 Jahre nach dem verheerenden Hurrikan Katrina an die alten New Orleans-Mythen klammern - und Dawn Richard auf diese Stereotypen festlegen? Und what _s so funny about das Kreolische 2026 ? Antworten aus dem Jenseits von toten Schwarzen Männern : Amiri Baraka, Stuart Hall, Édouard Glissant.
    <strong>A Quiet Pulse</strong> | 5:34<br/>L'Antidote
    <strong>Pomegranate</strong> | 4:40<br/>L'Antidote
    <strong>The Orchard</strong> | 5:25<br/>L'Antidote
    <strong>Dates, Figs And Nuts</strong> | 5:03<br/>L'Antidote
    <strong>Rosee</strong> | 4:44<br/>L'Antidote
    <strong>The Wind Through The Cedar Tree</strong> | 4:00<br/>L'Antidote
    <strong>Na Na Na </strong>| 5:03<br/>L'Antidote
    <strong>The Responsibility of Beauty</strong> | 6:04<br/>L'Antidote
    <strong>Simplicity, Shaped by Countless Decisions </strong>| 7:20<br/>L'Antidote
    <strong>Elegance Speaks in Silence</strong> | 7:22<br/>L'Antidote
  subtitle: Creole Culture mit Queen Creole Dawn Richard
