  title: Neplodní (14)
  subtitle: Možnosti pomoci. Odpovede na otázky hľadajú odborníci z oblasti medicíny, psychológie, práva, bioetiky, teológie, životného štýlu, a koloruje ich niekoľko svedectiev.
  description: 'Som neplodná. Ako sa zorientovať vo všetkých dostupných informáciách, ktoré ponúkajú pomoc? So svojimi skúsenosťami sa podelí certifikovaná lektorka Creightonského modelu a poradkyňa Neofertility - Ľudmila Dydňanská. Jej misiou je práca s manželmi, ktorým sa nedarí počať dieťa a vzdelávanie žien v oblasti prirodzenej plodnosti. Réžia: Zuzana Chanasová (2026)'
