  title: Ein Hauch von Himmel
  subtitle: Im Schattenland
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Monica muss sich um den neu erschaffenen Engel Gloria kümmern, der noch keine Ahnung vom Leben auf der Erde oder vom menschlichen Wesen hat. Glorias Gehirn ist so schnell wie ein Computer, aber Emotionen sind ihr noch fremd. Sie freundet sich mit einem kleinen Mädchen namens Madeline an, doch als bei einem Bombenanschlag zahlreiche Menschen, darunter Madelines Mutter, ums Leben kommen, ist es nicht Gloria, die von ihren Gefühlen überwältigt wird, sondern Monica. Zutiefst erschüttert fragt sie sich, warum sie Gloria beibringen soll, ihr Herz zu gebrauchen, wenn es doch nur gebrochen wird. All das menschliche Leid, das sie tagein, tagaus erleben muss, wird ihr zu viel. Wie kann ein liebender Gott so etwas zulassen? Unglücklich flieht Monica in die Wüste, wo sie vom Teufel versucht wird, sich von Gott abzuwenden ...'
