  title: Hautnah - Gott mitten im Leben
  subtitle: Ich hör nicht auf zu glauben
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Christine Golter wollte immer allen gefallen, von ihrem Umfeld geliebt werden. Dafür musste sie "funktionieren", so dachte sie und arbeitete hart im familiären Weinanbau. Dann wird es irgendwann zu viel. Sie übernimmt die Pflege der Schwiegereltern, die Tochter wandert aus, die Schwester stirbt an Krebs. Christine erleidet einen Zusammenbruch: Burnout. Der Glaube und eine Therapie gaben ihr die nötige Kraft, ihr Leben neu anzupacken.'
