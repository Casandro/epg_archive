  title: grenzenlos
  subtitle: Stummen eine Stimme geben
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Dokumentation beleuchtet das Leben von Frauen und Kindern in Indonesien, die sexualisierte Gewalt überlebt haben - und mithilfe von TRUK-F den Weg zurück ins Leben finden. Diese mutige Initiative von Missionarinnen und Missionaren bietet Betroffenen nicht nur Schutz, sondern auch eine Stimme in einer Gesellschaft, in der über die alltägliche Gewalt gegenüber Frauen und Kindern geschwiegen wird. Eine bewegende Reise durch Schmerz, Solidarität und die Kraft der Hoffnung.'
