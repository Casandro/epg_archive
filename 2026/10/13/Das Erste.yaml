  title: Die Kanzlei (81/89)
  subtitle: Bedrohliche Nähe
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Eine junge Ehefrau kämpft um ihre Freiheit: Laura Geiwitz will ihren sittenwidrigen Ehevertrag anfechten, doch ihr vermögender und kontrollsüchtiger Mann setzt alles daran, sie an sich zu binden. Isa von Brede stellt sich einem Gegner, der mit seiner Macht skrupellos umgeht. \n\nMarkus Gellert wiederum wird von einem alten Freund um Hilfe gebeten, der Investoren mit nichtexistierenden Baumaschinen betrogen hat. Gellert lehnt das Mandat entschieden ab und ahnt nicht, dass ihn in der Kanzlei bereits die nächste Bedrohung erwartet: Die gefährliche Stalkerin Meike Giering richtet plötzlich eine Waffe auf Isa."
- eventId:
  - 1130791
  - 919897
  start: 2026-10-13T19:00:00Z
  stop: 2026-10-13T19:45:00Z
  title: In aller Freundschaft (1151)
  subtitle: Zusammen und getrennt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der Sachsenklinik erwartet Dr. Ina Schulte ein medizinisches Wunder: Sie soll die Entbindung der an der Leber zusammengewachsenen Zwillinge von Hilda Renner per Kaiserschnitt durchführen. Doch die werdende Mutter ist in einem emotionalen Ausnahmezustand - die Trennung von ihrem Ehemann Lars belastet sie zusätzlich. Kurz vor der geplanten Entbindung flieht Hilda in Panik aus der Klinik. \n\nPJlerin Lisa Schroth hat es endlich geschafft, Dr. Ina Schulte davon zu überzeugen, bei der seltenen Entbindung dabei sein zu dürfen. Dann jedoch ignoriert sie ihren grippalen Infekt so lange, bis sie schließlich zusammenbricht."
