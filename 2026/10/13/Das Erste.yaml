  - '16'
  description: Als Bernhard Wagner, Chefarzt der Lübecker Uniklinik, von seiner Nachtschicht heimkehrt, macht er eine grauenvolle Entdeckung. Seine Frau Verena liegt tot in der Sauna. Für die Kommissare Finn Kiesewetter und Lars Englen ist eindeutig, dass es sich um einen heimtückischen Mord handelt. Die Tür wurde von außen verriegelt und Verena starb qualvoll in der überhitzten Sauna. Unter Verdacht gerät Rasmus Haffner, der nach dem Tod seines Sohnes vor dem Scherbenhaufen seines Lebens steht. Haffner ist überzeugt, dass sein Sohn aufgrund eines Kunstfehlers von Chefarzt Wagner starb. Wollte er sich rächen? Doch Haffner hat ein Alibi.
