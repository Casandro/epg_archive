  title: Der Tiger - Hightech am Himmel
  subtitle: Der Tiger - Hightech am Himmel
  description: 'Sie sind die fliegende Kavallerie moderner Streitkräfte: Kampfhubschrauber wie der europäische "Tiger". Seine Hauptaufgabe bei der Bundeswehr ist der Schutz der eigenen Soldaten im Krisen- und Kriegseinsatz sowie die Bekämpfung gegnerischer Panzer aus der Luft. Die Dokumentation stellt die ausgefeilte Technik des "Tigers" dar, zeigt ihn beim Einsatz in Afghanistan und begleitet die Ausbildung angehender Tiger-Piloten in Südfrankreich.'
  widescreen: true
- eventId: 653661
  start: 2026-10-13T01:03:00Z
  stop: 2026-10-13T01:51:00Z
  title: Das Gefängnis HMP Durham - Folge 1
  subtitle: Das Gefängnis HMP Durham - Folge 1
  description: 'Die meisten der etwa tausend Insassen im englischen Gefängnis Durham sitzen für Drogendelikte ein. Nicht einmal innerhalb der Gefängnismauern kommt das Wachpersonal gegen den internen Handel mit Spice an - trotz höchster Sicherheitsbestimmungen. Neuankömmlinge schmuggeln die "Zombiedroge" in sogenannten Bodypacks in die Anstalt und verkaufen sie hochpreisig. Schnell ist klar: Eine neue Ladung Spice hat es ins Gefängnis geschafft. Tägliche Überdosisfälle halten die Sanitäter in Atem.'
  widescreen: true
- eventId: 653662
  start: 2026-10-13T01:51:00Z
  stop: 2026-10-13T02:33:00Z
  title: Das Gefängnis HMP Durham - Folge 2
  subtitle: Das Gefängnis HMP Durham - Folge 2
  description: Der Insasse Dale leidet an einer Persönlichkeitsstörung und gefährdet zunehmend das Sicherheitspersonal der Strafanstalt Durham und sich selbst. Die Gefängnisleitung und der psychologische Notdienst sehen zum Schutze aller keine andere Möglichkeit, als Dale in die Isolationshaft zu verlegen - das heißt keinen Kontakt zu anderen Insassen in einer Zelle ohne Tageslicht. Nach nur wenigen Tagen gerät seine innere Uhr aus dem Gleichgewicht. Größter Stressfaktor bleibt jedoch die Einsamkeit ...
  widescreen: true
- eventId: 653663
  start: 2026-10-13T02:33:00Z
  stop: 2026-10-13T03:15:00Z
  title: Das Gefängnis HMP Durham - Folge 3
  subtitle: Das Gefängnis HMP Durham - Folge 3
  description: Täglich kommt es in der Strafanstalt Durham zu gewalttätigen Auseinandersetzungen zwischen den Häftlingen. Die angespannte Stimmung im Gefängnis ist sogar für die Sicherheitsbeamten spürbar. Oft eskalieren schon kleinste Streitereien beim gemeinsamen Frühstück oder Waschgang. Vermeintlich harmlose Alltagsgegenstände wie beispielsweise Kämme werden von den Gefangenen gehortet und zu gefährlichen Waffen umfunktioniert. Außerdem schmuggeln Neuankömmlinge immer häufiger Rasierklingen in die Anstalt.
  widescreen: true
