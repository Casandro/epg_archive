  title: Spacetime
  subtitle: Der Weg ins All - Von der Erde in die Unendlichkeit
  description: Mit unglaublicher Kraft macht sich die Menschheit auf zu einer Reise in ferne Galaxien, um neue Planeten zu erforschen und außerirdisches Leben zu entdecken. Gewaltige Raketen befördern Astronauten samt Ausrüstung bereits seit einigen Jahren ins All. Doch wie weit könnte uns die moderne Technik noch bringen? Die faszinierenden Erkenntnisse aus Wissenschaft und Forschung über die Reise ins Universum erklärt Prof. Dr. Ulrich Walter in einer Folge "Spacetime".
  widescreen: true
- eventId: 653724
  start: 2026-10-13T19:10:00Z
  stop: 2026-10-13T20:05:00Z
  title: Spacetime
  subtitle: Raumfahrt für Jedermann - Der Traum vom Geld aus dem All
  description: 'Mit dem Weltraumtaxi an den Rand des Sonnensystems oder für 20 Millionen zur ISS? Werden wir bald schon im All arbeiten und Urlaub machen? Die kommerzielle Raumfahrt verspricht neue Möglichkeiten und grandiose Visionen. Prof. Dr. Ulrich Walter geht den fantastischen Versprechungen auf den Grund und erklärt, warum nicht jeder, der ins All fliegt, gleich ein Astronaut ist: Das Ticket ins Universum in der sechsten Folge "Spacetime".'
  widescreen: true
- eventId: 653725
  start: 2026-10-13T20:05:00Z
  stop: 2026-10-13T21:01:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Stephenville'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Stephenville'
  description: An einem klaren Winterabend im Januar 2008 kam es zu einer der erschreckendsten und mysteriösesten UFO-Sichtungen aller Zeiten. In der texanischen Kleinstadt Stephenville entdeckten einige Einwohner ein breites ominöses Flugobjekt am Himmel, das minutenlang auf einer Stelle schwebte und daraufhin mit Hyperschallgeschwindigkeit entschwand. Trotz dutzender Augenzeugen bleibt der Fall bis heute ungeklärt. Besonders das Militär leugnete den Vorfall vehement. War dies ein Vertuschungsversuch?
  widescreen: true
- eventId: 653726
  start: 2026-10-13T21:01:00Z
  stop: 2026-10-13T21:56:00Z
  title: Artemis - Das neue Mondprogramm der NASA
  subtitle: Artemis - Das neue Mondprogramm der NASA
  description: 'Ziel der Artemis-Mission der NASA soll es sein, eines Tages wieder Menschen zum Mond zu befördern, darunter erstmals eine Frau und eine nicht weiße Person. Die Dokumentation zeigt die außergewöhnliche Geschichte der NASA-Ingenieure beim Bau und Start der größten Rakete der Welt: Der Artemis I, die die sogenannte Orion-Kapsel ins All transportieren soll. Sie begleitet Expertinnen und Experten der NASA bei der Herstellung von riesigen Raketenteilen, bei Flugtests und Startvorbereitungen.'
  widescreen: true
- eventId: 653727
  start: 2026-10-13T21:56:00Z
  stop: 2026-10-13T22:48:00Z
  title: 'Strip the Cosmos: Die toten Planeten'
  subtitle: 'Strip the Cosmos: Die toten Planeten'
  description: Während die ersten Marsreisen vorbereitet werden, geht der Blick der Astronomen auf der Suche nach habitablen Planeten schon weit über unser Sonnensystem hinaus. Die Suche nach Exoplaneten steht im Fokus der Astronomie. Bislang zeigen die meisten dieser neu entdeckten Welten jedoch nur, wie lebensfeindlich der Kosmos ist. Mit welchen Methoden versuchen die Forscher, in der Milchstraße einen erdähnlichen Planeten aufzuspüren und wie stehen die Chancen, dort draußen eine "zweite Erde" zu finden?
  widescreen: true
- eventId: 653728
  start: 2026-10-13T22:48:00Z
  stop: 2026-10-13T23:31:00Z
  title: 'Strip the Cosmos: Die Asteroiden-Mission'
  subtitle: 'Strip the Cosmos: Die Asteroiden-Mission'
  description: 'Es klingt wie der Plot eines Hollywoodfilms: Die NASA-Sonde Osiris Rex soll einen für die Erde potenziell tödlichen Asteroiden abfangen und genau erforschen. Mehr als eine Million dieser Gesteinsbrocken rasen zwischen Jupiter und Mars durchs All. Die kosmischen Trümmer sind bei der Entstehung unseres Sonnensystems übriggeblieben. Es sind faszinierende Zeitkapseln, von denen wir viel über dessen Vergangenheit und Zukunft lernen können. Zugleich könnten manche von ihnen zu einer Gefahr werden.'
  widescreen: true
