  title: Entdecker der Welt - Raues Land - Namibia
  subtitle: Entdecker der Welt - Raues Land - Namibia
  description: 'Ness Knight hat etwas Besonderes vor: Sie kehrt zurück auf ihren Heimatkontinent Afrika und stellt sich der größten Herausforderung ihres Lebens: einer Expedition durch Namibia. Schon immer wollte Ness Namibia erkunden und seine spektakulären Sanddünen erklimmen. Doch diesmal hat sie sich die Messlatte sehr hoch gelegt: 1000 Kilometer mit dem Rad von der Grenze zu Angola bis zu den Sanddünen von Swakopmund will sie zurücklegen. Namibia gehört zu den heißesten und rauesten Ländern der Erde. Noch nie hat jemand dieses Abenteuer gewagt. Aber Ness Knight will ihren Körper und Geist herausfordern und das auf ihrem Rad. NA 2016'
