  title: Bergwelten - Die Karawanken - Eine Überschreitung in Eis und Schnee
  subtitle: Bergwelten - Die Karawanken - Eine Überschreitung in Eis und Schnee
  description: 'Bergwelten: Eine 100 km lange Ost -West Skiüberschreitung des Grenzgebirges Karawanken, von der Koschuta bis zum Mittagskogel. Die vier Kärntner Skibergsteiger Gerald und Dominik Sagmeister, Andrej Olip und Michael Mautz wagen das Abenteuer einer 100 km langen Ost-West Überschreitung der Karawanken. Das südlichste Gebirge Österreichs ist geprägt durch senkrecht abfallende Nordhänge und steile Südhänge, welche beide völlig unterschiedliche Schneebedingungen bieten. Wind, Sonne, Niederschlag und Temperaturen verändern eine völlig naturbelassene Winterlandschaft in ein Abenteuer mit ungewissem Ausgang. Die Tour fordert den Skibergsteigern über sieben Tage mit Wetterkapriolen und extremen Minustemperaturen, sowie einer permanenten Lawinengefahr auf der Südseite alles ab. Die absolute Härteprobe wird Ihnen auf der Nordseite der Karawanken gestellt. Nach kräfteraubendem Aufstieg über die Ostschlucht und einer riskanten überwächteten Gratüberquerung der Breitwand wartet in der Koschuta Nordwand eine 55 Grad steile Abfahrt durch die 300 Meter lange Pik Schlucht. Ein Sturz hat in dieser extrem schmalen und zum Teil vereisten Rinne fatale Konsequenzen. AT 2021'
