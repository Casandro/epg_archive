  title: Faszination Heimat - Zurück zu den Anfängen
  subtitle: Faszination Heimat - Zurück zu den Anfängen
  description: Schon als Bub packte Schauspieler Steffen Wink die Begeisterung für die Fliegerei. Seitdem hat ihn diese Leidenschaft nie wieder losgelassen, in jeder freien Minute versucht er neben seinem stressigen Job den Ausgleich zu finden und abzuheben. Innerhalb von drei Tagen wollen er und sein Kumpel Alex Ploner mit dem Drachen, von Norditalien aus den Chiemsee erreichen. Auf ihrer Flugroute entdecken sie die faszinierende Schönheit der Alpen von oben. AT 2013
