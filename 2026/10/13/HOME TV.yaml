  title: Pokochaj lub sprzedaj - Vancouver 1 (odc. 12)
  subtitle: Uczestnicy programu są niezadowoleni z domów, w których mieszkają. Z pomocą specjalistów od remontów i wystroju wnętrz mają szansę odmienić swój dom tak, by odpowiadał ich preferencjom.
  description: |-
    Tytuł oryginalny: Love It or List It Vancouver
    CA, 2013
    Reżyseria: Karen Duthie
    Występują: Jillian Harris, Todd Talbot, Nick Jardine, Julia Whyte
    Uczestnicy tego programu nie są zadowoleni ze swoich dotychczasowych domów. Dostają jednak szansę na niepowtarzalną zmianę. Mogą - z pomocą specjalistów od remontów i wystroju wnętrz - odmienić swój dom nie do poznania. Jeśli w dalszym ciągu nie będzie on spełniał ich wymagań, będą mogli go zamieć na coś bardziej odpowiadającego ich preferencjom.
