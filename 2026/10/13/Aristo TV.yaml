  title: ANIXE auf Reisen - Bahrain
  description: 'Dieses mal nimmt uns die Schauspielerin Eva Habermann mit ins Königreich Bahrain und entdeckt für uns die kleinen verwinkelten Gassen der Hafenstadt Mu _harraq. Die Altstadt gehört zum UNESCO-Weltkulturerbe und verzaubert durch ihre Schönheit. Mit einem Adrenalinjunkie wie Eva Habermann gehört ein Besuch auf der Formal 1 Strecke natürlich dazu. Das sie aber nicht nur gut mit Motoren umgehen kann, sondern auch mit den sanfteren PS beweist sie auf einem Ausritt durch die Wüste Bahrains. Die Pflege alter Handwerke hat in Bahrain von jeher Tradition und so dürfen wir Töpfermeistern und Holzschnitzern bei ihrer Arbeit über die Schulter schauen. Für eine Sache ist Bahrain jedoch besonders bekannt: die Perlenfischerei. Einer der bekanntesten Perlenzüchter öffnet seine Türen für Sie und den Anblick der vielen Perlen lässt wohl nicht nur Eva Habermanns Herz schneller schlagen. Das Kulinarische darf auch bei dieser Reise nicht fehlen - lassen Sie sich von den verschiedenen Köstlichkeiten des Orients inspirieren.'
  widescreen: true
