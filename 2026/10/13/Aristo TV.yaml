  description: '"Was tun Sie, wenn um Sie herum alles dunkel ist? Lassen Sie sich von Angst überrollen? In dieser Sendung geht es um die Geschichte von Paulus und Silas, die im Gefängnis saßen und Gott dennoch mit Liedern anbeteten. Und ihre Anbetung ließ die Erde beben! Manche Situationen klären sich erst, wenn Sie sich mit Lobpreis herauskämpfen.  Bayless Conley macht Mut: Loben Sie Gott, auch wenn Ihnen nicht danach ist. Beten Sie ihn an, selbst wenn Sie schlechte Karten haben und alles finster scheint. Denn Anbetung kann Ketten sprengen und Sie aus der Krise führen."'
