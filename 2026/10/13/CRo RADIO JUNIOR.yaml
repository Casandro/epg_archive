- eventId: 706643
  start: 2026-10-13T11:00:00Z
  stop: 2026-10-13T12:00:00Z
  title: Velká pohádka
  description: Cesta do země Lidivoni. U břehů neznámého ostrova ztroskotá obchodní loď. Z posádky se zachrání jen tři námořníci, mezi nimi i navigátor Alexander. Ten se seznamuje s tím, jak to chodí v zemi Lidivoni. A nestačí se divit. Proč se nesmějí obyvatelé ostrova procházet kolem moře, ani se po něm plavit? Kdo nařídil, aby se do rybníků přiléval olej? A čím jsou to všichni zdejší občané tak nepříjemně cítit? Na motivy knihy Eduarda Petišky napsal Tomáš Loužný, režie Dudík, Dimitrij, natočeno v roce 2024. Účinkují Petr Lněnička, Alexandr Mojžíš, Marika Procházková, Hanuš Bor, Kamil Halbich a další.
