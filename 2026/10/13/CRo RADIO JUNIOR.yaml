- eventId: 706752
  start: 2026-10-13T13:00:00Z
  stop: 2026-10-13T14:00:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: nadporučík David Vedral, policejní psovod. O letošních prázdninách se policejní psi vyznamenali při několika velkých pátráních po ztracených lidech a vystopovali i pěknou řádku zlodějů. Jejich práci a statečnost vám přiblížíme s naším hostem, a možná s ním přijde i slavná fenka Pita.'
