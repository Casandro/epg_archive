  description: 'Forschende wissen eines mit Sicherheit: Sternsysteme entstehen immer gleich. Am Anfang. Nachdem sich jedoch Gasplaneten geformt haben, können diese die weitere Entwicklung eines Sternsystems beeinflussen. Jupiter und Saturn haben auch in unserem Sonnensystem die Entwicklungsgeschichte maßgeblich bestimmt. Diese Folge "Spacetime" zeigt, warum unser Planetensystem etwas ganz Besonderes ist, und erforscht die Frage, ob wir Menschen doch nur das Ergebnis eines kosmischen Zufalls sind.'
