  description: |-
    Franz Meersdonk sucht für eine Terminfracht nach Teheran einen Fahrer für den zweiten LKW. Günther Willers wäre der richtige Mann, aber der hat sich in den Kopf gesetzt, sein Glück als Rennfahrer zu machen. Als Hitzkopf Willers am Vortag des großen Bergrennens seine Karriere in den Graben setzt, wird er weich. Aber er verlangt von der Chefin der Spedition Mittermann einen eigenen Wagen zu bekommen, den sie auch noch vorfinanzieren müsse. Überraschend unterstützt Meersdonk diese Forderung.
    Buchstäblich im letzten Moment können Willers und er mit ihren Sattelschleppern termingerecht in Richtung Teheran aufbrechen.
