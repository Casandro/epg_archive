  title: Warum wirfst du dein Leben weg?' I Abt Bernhard Eckerstorfer über seine Berufung
  subtitle: Gespräch
  description: Mitten auf dem Wassergraben des Stifts Kremsmünster erzählt Abt Bernhard Eckerstorfer OSB seine Berufungsgeschichte - geprägt von einem Religionslehrer, gewendet durch die Begegnung mit obdachlosen Menschen in Linz.Warum wurde aus einem Studenten der Theologie und Geografie ein Benediktinermönch und schließlich Abt? Ein persönliches Gespräch über Berufung, Hingabe und die Frage, was das eigene Leben wirklich erfüllt.Ein Gespräch von Athinea Andryszczak mit Abt Bernhard Eckerstorfer OSB.
