  subtitle: Gespräch
  description: Woher kommen die sogenannten Geheimnisse im Rosenkranzgebet? Was ist an ihnen geheim? Studenten der Phil.-Theol. Hochschule Benedikt XVI. Heiligenkreuz im Gespräch mit Direktor Martin Leitner.
- eventId: 669229
  start: 2026-10-13T02:45:00Z
  stop: 2026-10-13T03:15:00Z
  title: Mit Allem, was in mir ist
  subtitle: Dokumentation
  description: '"Mit allem, was in mir ist" - ist ein wundervolles Mosaik von sechs Seminaristen, die sich alle von tief geistlichen Motiven bewegt fühlen, ihre Leben als katholische Priester Gott zu weihen. Es sind sechs Geschichten von unterschiedlichen jungen Männern, die vor unterschiedlichen Herausforderungen stehen, ihrem Ruf treu zu bleiben, den sie in der tiefe ihres Herzens vernommen haben. Ein inspirierender Film, der zeigt, dass es Hoffnung auf eine Zukunft in der Kirche mit mutigen Männern gibt, die bereit sind, ihr Leben in der Nachfolge Christ hinzugeben.'
- eventId: 669230
  start: 2026-10-13T03:15:00Z
  stop: 2026-10-13T03:45:00Z
  title: 'Medizin mit Tiefgang: IGeL-Leistungen - sinnvoll oder riskant?'
  subtitle: Gespräch
  description: Individuelle Gesundheitsleistungen, kurz IGeL, boomen. Jährlich werden Milliarden umgesetzt - doch was steckt medizinisch wirklich dahinter? Im Gespräch mit Dr. Claudia Kaminski ordnet Prof. Dr. Kai Kolpatzik, Chief Scientific Officer des Wort & Bild Verlages, diesen Markt kritisch ein. Er erläutert, warum viele IGeL-Leistungen nicht von den gesetzlichen Krankenkassen übernommen werden, welche Rolle fehlende wissenschaftliche Evidenz spielt - und weshalb gut gemeinte Vorsorgeuntersuchungen mitunter mehr schaden als nutzen können. Falsch-positive Befunde, unnötige Folgeuntersuchungen und verunsichernde Diagnosen sind reale Risiken. Eine Sendung über medizinische Verantwortung, informierte Entscheidungen und die Frage, wie viel "Mehr Medizin" unserer Gesundheit tatsächlich guttut.
- eventId: 669231
  start: 2026-10-13T03:45:00Z
  stop: 2026-10-13T04:00:00Z
  title: 'Spirit: Wie Carlo Acutis die Herzen für den Glauben öffnet'
  subtitle: Gespräch
  description: '"Die Kirche lebt - und sie ist jung." Dieses Wort von Papst Benedikt XVI. scheint im Leben des heiligen Carlo Acutis Wirklichkeit geworden zu sein.Der italienische Teenager verband Glauben, Alltag und digitale Welt auf eine Weise, die bis heute Menschen berührt, weit über kirchliche Grenzen hinaus.Was macht Carlo Acutis zu einem Hoffnungsträger in Zeiten kirchlicher Krisen? Und warum spricht sein Zeugnis gerade junge Menschen an?Darüber spricht Volker Niggewöhner mit Pfarrer Tobias Brantl.'
