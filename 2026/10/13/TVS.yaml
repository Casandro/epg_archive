  title: 'Rosamunde Pilcher: Nie z tego świata 1 (odc. 139)'
  subtitle: Po stracie pracy Natalie zatrudnia się jako opiekunka dzieci u Benjamina Wilsona. Kobieta zmaga się nie tylko z nieufnością szwagierki mężczyzny, ale także własnym bratem, który jest chuliganem.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wie von einem anderen Stern
    DE, 2017
    Reżyseria: Marco Serafini
    Występują: Liza Tzschirner, Daniel Aichinger, Francis Fulton-Smith, Saskia Valencia, Elena Bin, Leo Bilicky
    Natalie jest kasjerką. Po śmierci rodziców sprawuje opiekę nad swym małoletnim bratem Johnem. Chłopak jest chuliganem i drobnym przestępcą. W końcu Natalie traci z jego winy pracę w sklepie. Musi poszukać innego zajęcia i zatrudnia się jako opiekunka dzieci u astrofizyka Benjamina Wilsona, który od śmierci żony sam zajmował się wychowywaniem trójki swych latorośli. Brat Benjamina, Paul i jego żona Ellen próbują go wspierać.
