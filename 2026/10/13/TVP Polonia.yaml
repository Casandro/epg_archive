  title: Stulecie Winnych s.I - odc. 7
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Adam Ferency, Weronika Humaj, Karolina Bacia
    Ania i Mania uczą się w gimnazjum Platerek w Warszawie. Z Brwinowa dochodzą niepokojące wieści o zdrowiu Antoniego. Po konsultacji w warszawskiej klinice, lekarz stwierdza u Winnego chorobę otępienną. Paweł wyznaje Ani miłość i nalega na szybki ślub. Źle znosi wyjazd ukochanej do Warszawy, a za swoje cierpienie wini Lilopopa. Dziewczyna, choć odwzajemnia uczucie, nie chce przerywać nauki i prosi ukochanego o czas. Uczucie do Pawła utrzymuje w tajemnicy przed rodziną.
  ageRating: 12
  genre:
  - '23'
  subtitle: Z Brwinowa nadchodzą niepokojące wieści o stanie zdrowia Antoniego. Lekarz rozpoznaje u nestora rodu Winnych chorobę otępienną. Paweł wyznaje Ani miłość i nalega, by szybko wzięli ślub.
