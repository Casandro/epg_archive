  subtitle: Ponad 80-letnia Jadwiga Szwagrzyk może stracić mieszkanie, gdyż padła ofiarą oszustów wyłudzających kredyty. Dorota i Ada niosą radość samotnym i schorowanym mieszkańcom domów pomocy społecznej.
