  title: Polacy na ratunek Żydom - Instynkt miłości. Historia rodziny Wielebów
  description: |-
    Tytuł oryginalny: Polacy na ratunek Żydom
    PL, 2023
    Historia Agaty i Władysława Wielebów z miejscowości Grudki, zamordowanych przez Niemców za pomoc biednej Żydówce. W czasie okupacji Wielebowie udzielili nieznanej kobiecie wsparcia żywnościowego. 23 września w kościele parafialnym w Gilowie na pograniczu gmin Turobin i Goraj odbyła się Msza święta w intencji zamordowanych. Po niej uczestnicy uroczystości dotarli do miejsca śmierci Wielebów, gdzie ich wnukowie ufundowali kapliczkę.
  ageRating: 12
