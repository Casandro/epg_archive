    Sylwester staje przed wyzwaniem uczestniczenia w trzech wywiadówkach w tym samym dniu. Postanawia poprosić o pomoc. Do akcji wkraczają Miras i Patrycja, którzy będą reprezentować dzieci na zebraniach. Wkrótce jednak okazuje się, że to, co miało być jedynie formalnością, przeradza się w serię absurdalnych sytuacji.
