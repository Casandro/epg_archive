    Wielokrotnie nagradzany i ceniony przez widzów program reporterski, w którym reporterzy Telewizji Polskiej pokazują życie z jego blaskami, ale i dramatami. Zawsze blisko ludzi. W tym wydaniu: Anna Szpręglewska - "Koszmar pani Jadwigi". Jadwiga Szwagrzyk ma ponad 80 lat. Przez całe swoje życie uczciwie pracowała, ale teraz może stracić mieszkanie. Grozi jej starość w Domu Pomocy Społecznej albo noclegowni dla bezdomnych.
  ageRating: 12
