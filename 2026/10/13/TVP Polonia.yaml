  title: Maria Konopnicka
  description: |-
    Tytuł oryginalny: Maria Konopnicka
    PL, 1996
    Reżyseria: Elżbieta Rottermund
    Jej teksty wzbudzały kontrowersje, wywoływały polemiki, często bywały ostro krytykowane, a przecież w swoich czasach była Konopnicka szalenie popularna i czytana przez wszystkich. Pisała nie tylko wiersze, lecz i poematy, nowele, szkice, obrazki, teksty publicystyczno - reportażowe, prace krytycznoliterackie. Była też tłumaczką. Przyswajała polskim czytelnikom utwory m.in. Heinego, Rostanda, Hauptmanna, Vrchlickiego, d'Annunzia. Młodzieży udostępniła "Serce" de Amicisa.
