  title: Klątwa Wyspy Dębów 4 (odc. 13)
  subtitle: Bracia Lagina i ich partnerzy dokonują niesamowitego odkrycia w Smith's Cove i "dziurze z pieniędzmi".
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2017
    Reżyseria: Kevin Burns
    Występują: Robert Clotworthy, Marty Lagina, Rick Lagina, Andrew Folkins, Craig Tester, Jack Begley
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 1545697
  start: 2026-10-13T08:00:00Z
  stop: 2026-10-13T10:10:00Z
  title: Dzisiaj ja, jutro ty
  subtitle: Po pięciu latach spędzonych w więzieniu Bill Kiowa odzyskuje wolność i rusza tropem człowieka, który zamordował jego żonę oraz wrobił go w przestępstwo.
  description: |-
    Tytuł oryginalny: Oggi a me... domani a te!
    IT,JP, 1968
    Reżyseria: Tonino Cervi
    Występują: Brett Halsey, Bud Spencer, Wayde Preston, Jeff Cameron, Franco Borelli, Dana Ghia
    Po pięciu latach spędzonych w więzieniu Bill Kiowa odzyskuje wolność i rusza tropem człowieka, który zamordował jego żonę oraz wrobił go w przestępstwo. Zdeterminowany, by dokonać zemsty, tworzy niezwykłą drużynę złożoną z twardziela, szeryfa, rewolwerowca i hazardzisty. Razem wyruszają w niebezpieczną podróż przez Dziki Zachód, ścigając bezwzględnego przywódcę bandytów. Stawką jest nie tylko sprawiedliwość, lecz także wyrównanie dawnych rachunków.
  ageRating: 16
  genre:
  - '17'
