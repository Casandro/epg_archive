  title: Julia muss sterben
  subtitle: Comedy 2020, FSK 12
  description: '2020 ● FSK: 12 Lya verheimlicht ihrer arabischen Familie die Aufnahmeprüfung an der Schauspielschule. Nachdem sie die letzten acht Jahre ihres Lebens für die Pflege ihres Vaters geopfert hat, möchte sie nun ihre Träume verwirklichen und Schauspielerin werden. Ihr Plan fliegt allerdings zu Hause auf und die Familie taucht kurzerhand an der Schauspielschule auf, um sie zurückzuholen. Lya hat in der Zwischenzeit allerdings bereits Freundschaft mit den beiden Mitbewerbern Kasper und Clara geschlossen. Comedy 2020, Regie: Marco Gadge,  Mit: Sabrina Amali, Mohammad-Ali Behboudi, Uwe Dag Berlin, FSK 12'
