  title: Sternstunde Religion
  subtitle: Aby Warburg - Was Bilder erzählen
  description: |-
    Eigentlich müssten ihn alle kennen. Aby Warburg war ein weit gereister deutscher Kunsthistoriker und Kulturtheoretiker, der die Bildbetrachtung revolutionierte. Sein grosses Vermächtnis ist das Warburg Institute, das seine Nachfahren 1933 vor den Nazis nach London retteten.
    Frankreich 2026
  genre:
