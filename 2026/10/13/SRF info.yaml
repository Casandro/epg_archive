  stop: 2026-10-13T11:55:00Z
  title: Sternstunde Kunst
  subtitle: Hilma af Klint - Jenseits des Sichtbaren
  description: "Wie kann es sein, dass eine Frau Anfang des 20. Jahrhunderts die abstrakte Malerei begründet, und niemand davon Notiz nimmt? Müsste die Kunstgeschichte umgeschrieben werden? Der Dokumentarfilm über die schwedische Künstlerin Hilma af Klint entdeckt die wahre Pionierin der abstrakten Malerei. \nDeutschland 2022"
  genre:
  - '112'
  widescreen: true
