  stop: 2026-10-13T11:00:00Z
  title: Sternstunde Philosophie
  subtitle: '100 Jahre Michel Foucault: Der Wahnsinn der Freiheit'
  description: "Denkikone, Jahrhundertgenie, Skandalfigur. Der 1926 geborene Philosoph Michel Foucault ist der bis heute einflussreichste Denker der Gegenwart. Was macht den besonderen Reiz seines Denkens aus? Und wie können seine Einsichten den Menschen befreien? \nSchweiz 2026"
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
