  title: Noční Mikrofórum
  description: 'Host: Jana Bémová, farmářka. Jaké to je, stát se jedinou dědičkou biofarmy s hovězím dobytkem? Bylo těžké přesvědčit syna, aby pracoval pro rodinnou firmu? A co pro Janu znamená vítězství v soutěži Regionální potravina Libereckého kraje? Moderuje Monika Valentová.'
