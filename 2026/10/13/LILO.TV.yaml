  title: So schmeckt die Welt - Kakao
  subtitle: So schmeckt die Welt - Kakao
  description: Kakao, die Grundlage von Schokolade, stammt aus den Früchten des Kakaobaums. Die Früchte enthalten Kakaobohnen, die nach der Ernte fermentiert, getrocknet und geröstet werden. Durch Mahlen entsteht Kakaomasse, aus der Schokolade hergestellt wird. Kakao ist nicht nur köstlich, sondern enthält auch Antioxidantien und andere Nährstoffe. Seine Verwendung reicht von Süßigkeiten über Getränke bis hin zu Kosmetika, und sein Anbau trägt oft zur wirtschaftlichen Entwicklung in den Anbauregionen bei.
  genre:
  - '129'
  widescreen: true
- eventId: 1533076
