  title: Fit mit den Stars
  subtitle: Corinna Kamper-Campisi
  description: |-
    Stress zählt zu den größten Gesundheitsrisiken unserer Zeit: Rund 70 Prozent der Österreicherinnen und Österreicher fühlen sich häufig unter Druck. "Fit mit den Stars" greift dieses Thema im Rahmen des ORF Schwerpunkts Bewusst gesund auf und zeigt, warum Sport eines der wirksamsten Mittel gegen Stress ist.
    Regelmäßige Bewegung senkt nachweislich das Stresshormon Cortisol, verbessert Schlaf und Stimmung und reduziert das Risiko für Herz Kreislauf Erkrankungen sowie psychische Belastungen. Corinna Kamper Campisi zeigt effektive Übungen zum Stressabbau.
  genre:
  - '164'
