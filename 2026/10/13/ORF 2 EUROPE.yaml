  description: "Nirgendwo sonst kann man etwas Vergleichbares erleben. Die Ökosysteme entlang des Flusses sind unbekannter als der Rio Negro im Amazonasgebiet.  \nAufgrund der langen Isolation Albaniens war das dünn besiedelte Gebiet an der Vjosa und ihren Nebenflüssen beinahe ein Terra incognita. Einige Teile dieser Region sind noch heute unbekanntes Terrain.\nDoch seit Jahren ist das gesamte Flusssystem durch Kraftwerksprojekte bedroht. Mehr als 30 Staudämme waren an der Vjosa und ihren Zuflüssen geplant - und schon ein einziger Staudamm hätte gereicht, um den gesamten Fluss zu zerstören.\nUm diese Zerstörung zu verhindern, kämpften Aktivisten gemeinsam mit der lokalen Bevölkerung über ein Jahrzehnt lang gegen den Bau der Staudämme.\nDann geschah ein Wunder: Am 15. März 2023 wurde die gesamte Vjosa zum ersten Wildfluss-Nationalpark der Welt erklärt. Damit gilt die gesamte Vjosa in Albanien, von der griechischen Grenze bis zur Adria, sowie ihre Hauptzuflüsse - insgesamt ein Flusssystem von mehr als 400 Kilometern Länge - als Nationalpark. Das ist einzigartig in Europa und weit darüber hinaus.\nEin Film von Michael und Rita Schlamberger"
