  title: kreuz & quer
  subtitle: Mysterium Psyche - Von Dämonen und Diagnosen
  description: Seit Jahrtausenden versuchen Menschen zu verstehen, was psychische Erkrankungen verursacht und wie sie behandelt werden können. Die Dokumentation zeichnet den langen Weg von antiken Behandlungsansätzen über religiöse Deutungen bis hin zur Entstehung der modernen Psychiatrie nach. Zugleich begleitet sie Menschen, die heute mit psychischen Erkrankungen leben und von ihrem Alltag und der Angst vor gesellschaftlicher Stigmatisierung erzählen. Es sind aber auch Geschichten, die zeigen können, wie Aufklärung und ein offener Umgang Betroffenen ganz neue Perspektiven eröffnen.
  genre:
  - '115'
