  description: "- Zitter-Herbst: Nach der SPÖ-Krise stellt sich immer drängender die Frage: Wie stabil ist die Dreier-Regierung noch? Sie plant Reformen und hat den Herbst der Ergebnisse ausgerufen - doch stößt dabei auf viele Hürden: Etwa die inhaltlichen Differenzen zwischen den Koalitionspartnern, oder die komplexen Verhandlungen mit den Bundesländern und die geringe Bereitschaft der Opposition, Reformen mitzutragen. \n- Dazu im Studio: Katrin Praprotnik, Politologin & Christoph Badelt, Präsident des Fiskalrats\n- Am Limit - krank in der Politik: An Finanzminister Markus Marterbauer entzündet sich gerade eine heikle Debatte: Was tun, wenn ein Spitzenpolitiker krank wird? Wie transparent muss man damit umgehen? Wieviel Privatsphäre ist erlaubt? \n- Millionen-Mist: 59.000 Tonnen Altreifen lagern, teilweise seit Jahrzehnten, mitten in der oberösterreichischen Gemeinde Ohlsdorf. Und das, obwohl das Reifenlager eigentlich seit einem Bescheid von 2011 längst geräumt sein sollte."
