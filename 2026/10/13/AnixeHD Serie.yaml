  description: Nicht nur in Mexico City kollabiert der Verkehr, kämpfen die Menschen jeden Tag gegen Lärm, Abgase, volle Strassen und Staus. Auch in Deutschland sucht man nach neuen Wegen und einer könnte über die Dächer unserer Städte gehen. München, Berlin und Stuttgart planen bereits entsprechende Seilbahnprojekte. Was derzeit in Mittelamerikas über Jahre gebaut wird, könnte auch wegweisend für anderen Millionenstädte in Europa sein. Die 45 min. Dokumentation "Die Superseilbahn" begleitet den Bau einer der weltweit größten Seilbahnprojekte über den Dächern von Mexico City.
