  title: 'Unsere wilde Schweiz: Das Vanil Noir'
  subtitle: Film von Anja Glücklich
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Nahe der Heimat des berühmten Gruyère-Käses thront das Juwel der Voralpen: das Vanil Noir. Der Gipfel zählt nicht zu den höchsten Bergen der Schweiz, besticht aber durch die wilde Schönheit.

    Mit seiner außergewöhnlich vielfältigen Flora und der reichhaltigen Fauna formt der 2389 Meter hohe Gipfel an der Grenze zwischen den Kantonen Freiburg und Waadt das Herz eines Naturschutzgebietes - ein Geheimtipp für Wanderer und Naturliebhaber.
    HD-Produktion
- eventId:
  - 1130777
  - 1132388
  start: 2026-10-13T12:15:00Z
  stop: 2026-10-13T13:05:00Z
  title: 'Unsere wilde Schweiz: Das Verzascatal'
  subtitle: Film von Marcus Fischötter
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Das Verzascatal mit seinen pittoresken Dörfern und dem smaragdgrünen Fluss, der sich durch eine einzigartige Felslandschaft schlängelt, gilt als eines der schönsten Täler südlich der Alpen.

    Es ist ein raues, wildes Tal mit mächtigen Wasserfällen und seltenen Tieren. Durch seine Abgeschiedenheit konnte es bis heute viel von seiner Ursprünglichkeit bewahren. Obwohl der Tourismus immer wichtiger wird, pflegen die Bewohner weiterhin die alten Traditionen.
    HD-Produktion
- eventId:
  - 1130778
  - 1132389
  start: 2026-10-13T13:05:00Z
  stop: 2026-10-13T13:55:00Z
  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Pilatus" - Die Mythische - Film von Jonas Keller'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Pilatus südlich von Luzern ist eines der eindrücklichsten Bergmassive der Zentralschweiz. Er bietet seit Ende des 19. Jahrhunderts mit der steilsten Zahnradbahn der Welt Nervenkitzel.

    Seit 1889 fährt die Pilatus-Bahn mit großem Landschaftskino von Alpnachstad auf den Pilatus Kulm und bewältigt dabei mehrere Streckenabschnitte mit 48 Prozent Steigung. Das ist bis heute Weltrekord. Möglich wurde das nur dank einer ausgefeilten Technik.
    HD-Produktion
- eventId:
  - 1130779
  - 1132390
  start: 2026-10-13T13:55:00Z
  stop: 2026-10-13T14:45:00Z
  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Gornergratbahn" - Die Imposante - Film von Katharina Deuber'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im Wallis, an der Grenze zu Italien, liegt ein Sehnsuchtsort für viele Reisende: das Matterhorn. Mit seiner unverwechselbaren Pyramidenform gehört es zu den berühmtesten Bergen weltweit.

    Das Matterhorn zieht jedes Jahr Millionen Menschen an. Die beste Sicht auf den von den Einheimischen liebevoll "Horu" genannten Viertausender hat man während der Fahrt mit der Gornergratbahn. Das Filmteam begibt sich auf eine Reise mit dieser Bergbahn.
    HD-Produktion
- eventId:
  - 1130780
  - 1132391
  start: 2026-10-13T14:45:00Z
  stop: 2026-10-13T15:40:00Z
  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Rigi" - Die Königliche - Film von Katharina Deuber'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mit Bedacht geht es auf dem Schienennetz der Rigi-Bahnen zu. Dort verkehrt der imposanteste historische Fuhrpark der Schweizer Bergbahnen. Die Rigi-Bahn war die erste Zahnradbahn Europas.

    Damals wie heute schlängeln sich die Schienen von Art-Goldau über die Ostflanke des Bergs auf den Gipfel der Rigi-Kulm. Die Bergfahrt im legendären Triebwagen "Sächsi" mit der Lokführerin Selina Gehrig bietet den Passagieren eine unvergessliche Reise.
    HD-Produktion
- eventId:
  - 1130828
  - 1132392
  start: 2026-10-13T15:40:00Z
  stop: 2026-10-13T16:30:00Z
  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Brienzer Rothorn" - Die Charmante - Film von Donat Hofer'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schweizer Bergbahnen fahren durch majestätische Landschaften und winden sich auf spektakuläre Gipfel. Sie beeindrucken mit einer einzigartigen Mischung aus Tradition, Technik und Natur.

    Und ziehen Menschen in ihren Bann. Mit Dampf, Schweiß und Fingerspitzengefühl befahren auch heute noch historische Loks und Triebwagen aus dem 19. Jahrhundert die Strecken. Wie ihre modernen Nachfolger, die mit dem neuesten Stand der Technik glänzen.
    HD-Produktion
