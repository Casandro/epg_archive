  title: Der Kommissar und das Meer - Aus glücklichen Tagen
  subtitle: Fernsehfilm, Deutschland 2020
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Krimi, Deutschland 2020
    Ein Mord und ein Einbruch in Visby auf Gotland führen zu einem alten Polizisten-Selbstmord: Kommissar Anders muss sich fragen, ob er in der Vergangenheit einen Ermittlungsfehler begangen hat.

    Eine lokale Einbruchsserie mündet im Mord an einem Hausbesitzer. Robert Anders und sein Team untersuchen den Fall. Unterstützung liefert Polizist Sigge, den keiner leiden kann, weil er einen Kollegen auf der Insel Fårö für einen Mörder hält.
