  description: |-
    Über 3000 Seen, Flüsse und Kanäle, eingebettet in dunkle Wälder und sanfte Hügel: Masuren ist ein Sehnsuchtsort für Menschen, die Natur und Tiere lieben.

    In den riesigen Wäldern leben Elche, Wisente und Wölfe - und auf der Halbinsel Popielno auch Koniks, eine robuste Ponyrasse. Judith Rakers kommt den Nachfahren der polnischen Wildpferde, die dort gezüchtet werden, ganz nah.
