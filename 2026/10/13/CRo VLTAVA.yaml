  stop: 2026-10-13T16:00:00Z
  title: ArtCafé
  description: 'Zrní: Nová energie, konce a smíření na albu LOVE YOU LOVE YOU. Kapela Zrní vydala po třech letech nové album, na kterém se po akustičtějším Široko daleko znovu výrazněji obrací k elektronice. Osmou řadovou desku volně propojují témata konců, přijetí, smíření a lásky a kapela ji tentokrát natočila sama ve zkušebně s producentem Lukášem Palánem. Co Zrní přinesl nový způsob práce a jak se do desky propsaly osobní příběhy i současný svět? O albu LOVE YOU LOVE YOU bude ArtCafé, kam si členy kapely Zrní - zpěváka Honzu Ungera a houslistu Honzu Fišera - pozval moderátor Tomáš Klement. E-mail: artcafe@rozhlas.cz'
