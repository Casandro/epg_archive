  title: Vizitka
  description: Petr Váša, performer a hudebník. Jeho alternativní kapela Ty Syčáci vydala nové album DLOUHÁ ŠIROKÁ A BYSTROZRAKÁ. Tak si říkají fiktivní performerky, které si sám vymyslel. Album podle něj dělá dlouhý nos na patriarchát i konformismus. "Je to feministický konceptuální příběh. Dominance a to, že někdo někomu šéfuje, vyvane ve prospěch spolupráce a kreativní partnerskosti," vysvětluje ve Vizitce, kde taky přiznává, že se jeho fyzické básnictví proměňuje. "Jednu dobu jsem si myslel, že je to čistý experiment, pak jsem tomu dával tvar, tak jsem si představoval, že to je monolit, a v posledních letech mám pocit, že je jako houba." Co to přesně znamená? Jak zapojuje děti do improvizací během veřejných čtení knihy Rajčaťáci a Banáni? A o čem bude jeho další publikace, kterou chystají spolu s Petrem Niklem? Petra Váši se v září ptal Ondřej Cihlář. Repríza z 29. 9. 2026
