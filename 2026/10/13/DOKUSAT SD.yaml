  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Der Italienfeldzug'
  description: Im Jahr 1943 begann der Weg zum Sieg im Italienfeldzug, als die Alliierten die Insel Sizilien eroberten. Sie kämpften sich dann auf dem italienischen Festland vor, aber das Terrain und die deutschen Verteidigungsstellungen machten den Fortschritt langsam. Erst im Juni 1944 gelang es den Alliierten, Rom zu befreien. Doch der harte Widerstand der Deutschen dauerte an, bis schließlich im Mai 1945 die Kapitulation erfolgte und der Weg zum Sieg im Italienfeldzug vollendet wurde.
  genre:
