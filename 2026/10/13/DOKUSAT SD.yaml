  title: Hitlers Berlin - Nazibauten in der Hauptstadt
  subtitle: Hitlers Berlin - Nazibauten in der Hauptstadt
  description: 'Die Dokumentation zeigt die Architektur im Nationalsozialismus. Gigantische Bauten, die alle herkömmlichen Dimensionen sprengen sollten: Hitlers Größenwahn spiegelt sich auch in seinen architektonischen Plänen. Nach der Machtergreifung sollten fünf große Städte nach seinen Vorstellungen umgestaltet werden. Schon damals zeugten die Entwürfe vom Realitätsverlust des Diktators. Adolf Hitler verband eine Art Hassliebe mit Berlin - bis zu seinem Selbstmord im Bunker unter der Reichskanzlei.'
