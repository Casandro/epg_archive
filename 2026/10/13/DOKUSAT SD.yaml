  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Unternehmen Zitadelle'
  description: Das Unternehmen Zitadelle im Juli 1943 war eine der größten Schlachten des Zweiten Weltkriegs. Die deutsche Wehrmacht startete eine Offensive gegen die sowjetischen Truppen an der Ostfront nahe der Kursker Bogen. Obwohl die Deutschen anfangs Geländegewinne erzielten, wurden sie letztendlich von der sowjetischen Verteidigung gestoppt. Die Schlacht war ein Wendepunkt, da sie den Beginn des Rückzugs der Wehrmacht an der Ostfront markierte und den sowjetischen Vormarsch bis zum Sieg in Berlin vorantrieb.
