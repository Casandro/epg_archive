  title: Tiere vor der Kamera - Sommer der Schwalben
  subtitle: Tiere vor der Kamera - Sommer der Schwalben
  description: Der Film von Arendt und Schweiger zeigt die faszinierende Welt der Rauchschwalben, die oft übersehen wird. Er beleuchtet ihr Verhalten beim Nestbau, Brutpflege und sogar beim Baden im Flug. Trotz ihrer jahrtausendealten Verbindung zum Menschen sind sie heute durch Umweltgifte und Wohnraummangel bedroht. Im Allgäu verfolgen die Filmer ihre Rückkehr im Frühling, begleiten sie durch den Sommer auf Bauernhöfen und nehmen Abschied, wenn sie sich im Herbst für den Zug nach Afrika sammeln.
  genre:
