  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Die Befreiung von Paris'
  description: Die Befreiung von Paris im August 1944 markierte einen Wendepunkt im Zweiten Weltkrieg. Nach jahrelanger Besatzung durch die Deutschen stand die Stadt unter Belagerung. Doch mit einer kombinierten Anstrengung von französischem Widerstand, alliierten Truppen und einer Aufstandsbewegung der Pariser Bevölkerung, wurde die deutsche Besatzung schließlich besiegt. Die symbolträchtige Befreiung von Paris festigte den Glauben an einen bevorstehenden Sieg über das nationalsozialistische Regime.
