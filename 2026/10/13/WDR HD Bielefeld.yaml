  title: Garten & Lecker (6)
  subtitle: Brennnesselgemüse aus dem Waldgarten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wer hat das schönste Gartenfest unter dem Motto "Tief verwurzelt" ausgerichtet?
    Zum Finale geht es nach Warburg in Ostwestfalen. Auf 10.000 qm legt Torben Sauerland einen essbaren Waldgarten an. Beim Gartenfest möchte Torben einen Blick in die Zukunft werfen: Das Menü soll aus Zutaten bestehen, die es jetzt oder in absehbarer Zukunft auf dem Grundstück zu ernten geben wird. Es gibt Kürbissuppe zum Empfang, Omelett mit Roter Beete als Vorspeise und zum Hauptgang Brennnesselgemüse mit Fächerkartoffeln und Hühnerbrust. Als Dessert gibt es Esskastanienkuchen und dazu ein Löwenzahnkaffee.
