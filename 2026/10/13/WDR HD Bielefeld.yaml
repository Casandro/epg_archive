  title: In aller Freundschaft - 1029. Schlechtes Timing
  subtitle: Schlechtes Timing
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Rennradfahrerin Jella Themann bricht nach einer Trainingstour mit ihrer jüngeren Freundin Milena Kessler auf dem Bürgersteig zusammen. Auslöser ist eine schwere Herzklappenentzündung aufgrund eines verschleppten Infekts. In der Sachsenklinik muss eine neue Herzklappe eingesetzt werden. Ein schwerer Einschnitt für Jella, die ihren Sport dann nicht mehr auf hohem Niveau ausüben können wird, und für ihre Beziehung zu Milena.
- eventId: 920937
  start: 2026-10-13T06:25:00Z
  stop: 2026-10-13T07:10:00Z
  title: In aller Freundschaft - 1030. Reine Tische
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Paul Gebhardt verunglückt mit einem Elektroroller vor der Sachsenklinik und fällt direkt in Kris Haas' Arme. Bei der Untersuchung stellt sich heraus, dass Paul eine gering dislozierte Zweitfragment-Fraktur hat, die nicht zwingend operiert werden muss. Erleichtert will Paul so schnell wie möglich das Krankenhaus verlassen, aber Kris bemerkt Sprachaussetzer bei Paul. Daraufhin veranlasst Ilay Demir ein CT von Pauls Kopf. Doch Paul hat kein Interesse daran, weil er Angst hat, ernsthaft krank zu sein.
