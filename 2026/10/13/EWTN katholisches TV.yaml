  title: EWTN präsentiert
  subtitle: 'Für unsere Kinder nur das Beste: Wie sieht gute Kleinkinderbetreuung aus - Teil II: Podiumsdiskussion'
  description: "Im ersten Teil des Themenabends des Katholischen Familienverbands Kärnten hat die vierfache Mutter und bekannte Publizistin Birgit Kelle einen Impulsvortrag gehalten. Daran schließt sich nun mit Teil II eine Podiumsdiskussion an. Die Problematik der Kleinkinderbetreuung, die mangelnde Wertschätzung der Erziehungsarbeit, die Eltern leisten und der gesellschaftliche Druck, dass beide Eltern erwerbstätig sein sollen, obwohl die Psychologie längst weiß, wie kontraproduktiv dies angesichts des Bindungsbedürfnisses der Kinder ist:\n \nPodiumsdiskussion mit\nBirgit Kelle, Publizistin, Journalistin und Buchautorin\nNaomi Matthews, Pädagogische Leiterin des International Daycare Center IDC in Villach\nSusanna Fugger, Mutter und Forstwartin\nChristina Patterer BEd, MEd, Abgeordnete zum Kärntner Landtag\n \nModerator: Klaus Schöffmann, Vorsitzender des KFV Kärnten"
  widescreen: true
