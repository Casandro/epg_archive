  title: Himmel, Herz & Hirn
  subtitle: Dürfen Christen fluchen und schimpfen?
  description: |-
    Untergrabe ich mit Make-up Gottes Schöpfung - oder kann ich sie sogar hervorheben?  In dieser Folge sprechen wir über eine Frage, die viele bewegt: Wie schmücke ich mich, ohne eitel zu sein?

    Gemeinsam suchen wir nach einem christlichen Blick auf Schönheit, Kleidung und äußeres Erscheinungsbild. Ist Schminke ein Zeichen von Oberflächlichkeit - oder kann sie auch Ausdruck von Respekt und Wertschätzung sein?

    Wir klären, was das richtige Maß bedeutet und warum Kleidung und Make-up nicht nur mit Mode, sondern auch mit Würde und Haltung zu tun haben. Dabei geht es auch um die besondere Bedeutung von Schönheit als Eigenschaft der Frau und darum, wie man sich anständig und stilvoll kleiden kann, ohne sich selbst oder andere unter Druck zu setzen.

    Ein spannender Aspekt: Wie kann Kleidung sogar helfen, den Sonntag bewusst zu heiligen? Und natürlich schauen wir humorvoll auf Klischees rund um Frauen, Schuhe und Handtaschen.

    Zum Abschluss gibt es einen überraschenden und praktischen Highlight-Tipp: Der ultimative stilbewusste Koffer-Pack-Rat vom Weihbischof.
