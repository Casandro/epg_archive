  title: Na pěknú notečku
  description: Od dětí a o dětech. Dětství mívalo nejrůznější podoby, ovšem dříve i dnes platí, že se napříč Českou republikou rodí množství šikovných dětských zpěváků. Některé zpěv neopustil ani v dospělosti. Ukolébavky, dětské písně i vyzrálý projev dříve dětských zpěváků doplní krátký etnografický exkurz do dětství. Zahrají a zazpívají Klebetnice a Ženičky z Hluku, Malá česká muzika Jiřího Pospíšila, BROLN doprovodí Annu Košvicovou a Luboše Holého, uslyšíme také sestry Juračákovy a Romana Sokola. Pořad připravila Anna Jagošová.
