  title: Borgia - Die Heilige Dreifaltigkeit
  subtitle: Borgia - Die Heilige Dreifaltigkeit
  description: Während Rodrigo sich einen Entzug vom Vitriolo auferlegt und Lucrezia Alfonso D'Este einen Posten in Rom sichert, hofft Cesare, in Lyon Carlotta zu erobern. Beim Jeu de Paume spielen Cesare und König Karl VIII um die junge Hofdame. Cesare gewinnt, doch Karl verletzt sich und stirbt bald darauf. Um sein Ziel zu erlangen, macht er sich Karls Nachfolger Ludwig zum Verbündeten. FR 2012
  ageRating: 16
- eventId: 660271
  start: 2026-10-13T01:40:00Z
  stop: 2026-10-13T02:34:00Z
  title: Borgia - Ein Mysterienspiel
  subtitle: Borgia - Ein Mysterienspiel
  description: In Lyon erfüllt Cesare sein Versprechen gegenüber König Ludwig, aber dieser verweigert ihm dennoch Carlottas Hand. Rodrigo liefert öffentlich den Beweis neu gewonnener Stärke. Stärke beweist auch Lucrezia, als sie ihrem Ehemann Alfonso Di Calabria klar macht, wer in ihrer Ehe die Macht hat. Alfonso muss eine weitere Demütigung hinnehmen, als Lucrezia und nicht er Statthalter von Spoleto wird. FR 2012
  ageRating: 16
- eventId: 660272
  start: 2026-10-13T02:40:00Z
  stop: 2026-10-13T05:00:00Z
  title: Borgia - Die Verklärung Christi
  subtitle: Borgia - Die Verklärung Christi
  description: Cesare bietet Ludwig an, für ihn Mailand zu erobern, was Kardinal Briconnet alarmiert. Als Carlotta schließlich Cesares Liebe erwidert, weiß er Cesares Pläne zu durchkreuzen. Doch Cesare plant seine Rache. In Spoleto erwartet Lucrezia ein eisiger Empfang. Zwar gelingt es ihr mittels einer List, die Herzen der Bewohner zu erobern, doch Lucrezias Bruder Goffredo beschwört bald neue Probleme herauf. FR 2012
  ageRating: 16
