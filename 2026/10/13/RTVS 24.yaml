  title: Slovensko v obrazoch (17)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: 'Synagógu v Trenčíne obdivujú domáci aj zahraniční návštevníci. Táto historická stavba s farebnou secesnou výzdobou sa dostala aj na poštovú známku... Vodná nádrž Zemplínska Šírava oslavuje 60 rokov. V časoch, keď priťahovala najviac rekreantov, sa deväť mesiacov po letnej sezóne zvýšila aj pôrodnosť... Ludwig van Beethoven povedal: "Gitara sama o sebe je ako miniatúrny orchester." Poďte s nami do dielne, kde tento ušľachtilý nástroj vzniká... Malé mesto s množstvom kultúrnych pamiatok - to je Stropkov. Majú tu aj jeden z najväčších barokových oltárov a je to aj najstaršie pútnické miesto na Slovensku. (2026)'
  genre:
  - '35'
