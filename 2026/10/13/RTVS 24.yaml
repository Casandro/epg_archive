  title: SK Dejiny (7)
  subtitle: Dualizmus a Slovensko - Rakúsko-uhorské vyrovnanie. Populárno-náučná diskusia o objavovaní zlomových okamihov našich dejín.
  description: Habsburská monarchia bola od svojho vzniku v 16. storočí multikultúrny pestrý kolos v strede Európy. Rozsiahle premeny vyvolané priemyselnou revolúciou, ako aj politické a nacionálne dôvody viedli k prevratnej štátnej reforme v roku 1867. Poznáme ju ako rakúsko-uhorské vyrovnanie. Dualistickej monarchii sa hovorilo Rakúsko-Uhorsko a v takejto podobe štát existoval do novembra 1918. Čo dualizmus znamenal pre štáty, národy, mestá i ľud Habsburskej monarchie? Slovensko a Slováci boli súčasťou Uhorska vyše tisícročie a dualizmus predstavoval poslednú etapu tejto éry. Rakúsko-Uhorské vyrovnanie je témou štyroch dielov nášho cyklu SK_Dejiny. (2026)
  genre:
  - '35'
