  title: Barry Werkmeister - Auf den Cent genau vom 11.10.2026 (Wh.)
  subtitle: Auf den Cent genau einkaufen! Barry Werkmeister sucht Mitspieler aus, die versuchen im Wert von 1.000.- _ einzukaufen.
  description: 'Hochspannung mit Barry Werkmeister: Ein Kandidat, 30 Minuten, eintausend Euro - wer schnell und gründlich rechnet, hat hier die allerbesten Chancen! Und so funktionierts: Barry sucht sich einen Laden aus und dann einen Mitspieler. Wenn der Kandidat in 30 Minuten Waren im Wert von genau eintausend Euro in seinem Einkaufswagen hat, darf er alles mitnehmen. Aber eben nur, wenn die Rechnung auf den Cent genau ausgeht!'
