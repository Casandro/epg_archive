  title: Britische Gärten und ihre wilden Bewohner
  subtitle: Im Wald
  description: 'Versteckt in einem walisischen Tal liegt ein idyllischer Waldgarten. Obwohl das Sonnenlicht im Winter kaum den Boden erreicht, beherbergt der Garten eine erstaunliche Artenvielfalt: Haselmäuse halten Winterschlaf, Waldkauzküken konkurrieren im Nistkasten ums Futter, und ein junger Dachs kann verbotenen Leckereien nicht widerstehen.'
- eventId: 1130709
  start: 2026-10-13T16:35:00Z
