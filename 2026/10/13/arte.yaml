  subtitle: Am Fluss
  description: 'Die Ufergärten in Oxfordshire sind ein wildes Paradies - Heimat von Eisvögeln, Ottern, Rötelmäusen und Stockenten. Doch die Idylle täuscht: Steigt oder sinkt der Wasserstand, wird das kostbare Nass für jedes Tier zum Überlebensfaktor. Ein plötzlicher Wolkenbruch kann das fragile Ökosystem ebenso bedrohen wie die Sommerhitze.'
