  title: Hubert ohne Staller
  subtitle: Alles im Einklang
  description: |-
    Nahe einem Weiher entdecken Hubert und Girwidz im Kofferraum eines abgestellten Wagens mit Berliner Kennzeichen eine unbekleidete männliche Leiche. Was der Berliner in Bayern gemacht hat, ist für Hubert und Girwidz zunächst ein Rätsel. Spuren von ätherischen Ölen am Körper des Toten führen Hubert und Girwidz zum nahegelegenen Wellness- und Bio-Hotel "Im Einklang". Dort können Gäste aktuell bereits vor der offiziellen Neueröffnung das Angebot testen. Tatsächlich bestätigen die Betreiber Lisa und Gerhard Sonner, dass der Ermordete am Vortag bei ihnen eingecheckt hatte. Der Gärtner des Anwesens verrät den Polizisten jedoch, dass das spätere Opfer bereits in der Nacht die Hotelanlage wieder verlassen hatte. Die Gründe dafür sind zwar erneut ein Rätsel, dafür aber weiß das Zimmermädchen von einem heftigen Streit zu berichten, den der Ermordete mit einer anderen Person auf dem Hotelgelände hatte. Um das Verbrechen näher zu untersuchen, checkt Girwidz kurzerhand, selbstlos wie er ist, für eine Nacht in dem Wellness-Hotel ein.

