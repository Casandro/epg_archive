  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Rückkehr in die Antarktis
  description: "Im Jahr 2016 haben Forscher seltsame Phänomene in der Antarktis entdeckt, die den Gesetzen der Physik widerstreben: Kosmische Strahlung, die vom Untergrund der Antarktis strahlt. Könnte das der Beweis sein, dass die Antarktis von Außerirdischen bewohnt ist oder einst bewohnt wurde? \nDie Theoretiker der Prä-Astronautik sind überzeugt, dass dem so ist und dass Außerirdische die Antarktis seit Jahrtausenden, möglicherweise sogar seit Jahrmillionen, bewohnen. Es gibt auch Theorien, dass die Antarktis jahrhundertelang auf einem wärmeren Breitengrad lag und dass dort eine hochentwickelte Zivilisation lebte, die mit außerirdischem Leben in Kontakt stand. Das Schicksal dieser Zivilisation sei jedoch durch einen Kälteeinbruch besiegelt worden.\nDokumentarfilm, Vereinigte Staaten Von Amerika 2019"
  genre:
