  title: Heimatleuchten
  subtitle: Eigene Wege - Im Kleinwalsertal
  description: "\"Dann hat es mich echt wie der Blitz getroffen, und dann hab ich mir gedacht, whow das ist eigentlich die super Masterplan-Lösung, nicht nur für mich, eigentlich für die ganze Menschheit.\" Andreas Haller zeigt heute, wie nachhaltige Permakultur auch auf über 1.100 Metern funktioniert. Dafür hat er aber mühsam seine Oma überzeugen müssen, ihm ein Stück Land zu überlassen. \nSo wie es ihr Opa früher gemacht hat, verwandelt Viktoria Meusburger auf der Oberen Lüchlealpe mit viel Geduld Nebenprodukte aus der Käseherstellung in \"Gsig\", eine Art Salzkaramell. Den meisten Älplern ist das längst zu mühsam geworden. \nSteffi Feurstein bewirtschaftet die Alpe Stierhof gemeinsam mit ihrem Lebensgefährten und zeigt, wie viel Leidenschaft dahintersteckt und was es bedeutet, ein Kleinkind dabei zu haben.\nDer ehemalige Skinationaltrainer Jodok Fritz hat auf dem elterlichen Bauernhof neue Tiere einziehen lassen. Heute kann er von ihnen sagen \"Es gibt wahrscheinlich mehr Hunde, die weniger folgen wie meine Geissen\". \nKuhhirte Wolfgang Ott zieht mit rund 200 Tieren den ganzen Sommer über in die hochgelegenen Bergtäler und erzählt, warum ihm die Kühe in schweren Zeiten Kraft gegeben haben. \nMit seinem naturbelassenen Speiseeis aus hofeigener Milch beweist Landwirt Roman Feurstein, wie neue Ideen den Fortbestand der Landwirtschaft am Hof sichern. Huf- und Schellenschmied Franz Hiller hält ein jahrhundertealtes Handwerk lebendig und ist mit seiner mobilen Werkstatt unterwegs. Und für Tine und Dominik Müller wird der Sommer zu einem emotionalen Abschied: Nach vielen Jahren schließen sie die Schwarzwasserhütte.\nEin Film über Menschen, die sich nicht in eine Schublade stecken lassen, ihre Heimat mit Leidenschaft und neuen Ideen gestalten. In einem Tal mit einer einzigartigen geografischen Lage.\n\nDokumentarfilm, Österreich 2026, R: Michael Gärtner"
  genre:
  - '116'
