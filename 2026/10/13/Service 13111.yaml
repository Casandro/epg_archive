  title: Hubert ohne Staller
  subtitle: Mord aus zweiter Hand
  description: |-
    Bei einer Streifenfahrt stoßen Hubert und Girwidz am Fuß einer Brücke auf die Leiche des arbeitslosen Fernfahrers Frank Giebel. Deutet zunächst alles auf Selbstmord unter Alkoholeinfluss hin, finden Hubert und Girwidz bei ihren Ermittlungen heraus, dass Giebel mit seiner Schwester zusammen die elterliche Spedition geerbt hat. Sein regelmäßiger Alkoholkonsum jedoch hat ihn nicht nur den Führerschein gekostet, sondern auch seinen Job als Fernfahrer. Das kuriose aber ist, dass Giebel trotz seines verlorenen Führerscheins eine Anstellung als Fahrer bei einem hiesigen Altkleiderverwerter bekommen hat, um dessen Altkleidercontainer zu leeren. Jener Umstand und die Tatsache, dass in Giebels Wohnung eingebrochen wurde, veranlassen Hubert und Girwidz, sich näher in der Altkleiderverwertung umzusehen. Sehr schnell finden sie heraus, dass dort nicht alles mit rechten Dingen zugeht.

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Carsten Fiebeler
