  title: Hubert und Staller
  subtitle: Blackout
  description: |-
    Am Tag nach der Feier zu Anja Lichts 25-jährigen Dienstjubiläum gibt es für alle Beteiligten ein böses Erwachen: In einem schicken Landhotel kommt Hubert neben seiner langjährigen Ex-Frau Anja zu sich. Auch Revierleiter Girwidz kann sich nicht erklären, wie er zu seinem Nasenring gelangt ist. Und Staller erwacht aus einem traumlosen Schlaf, angeschmiegt an die Leiche des Herzspezialisten Dr. Sebastian Hartmann, den sie keine 24 Stunden zuvor in der Tiefgarage der Pathologie tot aufgefunden hatten. Dass alle auf der Feier einen über den Durst getrunken haben, können sie noch nachvollziehen. Nicht aber, warum sie und alle Beteiligten ein komplettes Blackout haben.

    Mit schwerem Kater versuchen Hubert und Staller die Hintergründe im Mordfall Hartmann zu klären. Sogleich erhärtet sich ihr Verdacht, dass Hartmanns Mörder die Gäste der Jubiläumsfeier mit einem Drogencocktail vergiftet haben könnte, um an ein wichtiges Beweisstück zu kommen. Immerhin kann der Täterkreis dadurch einschränkt werden, jedoch werden Hubert und Staller nun auch noch mit der Entführung einer Zeugin konfrontiert.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.
    Krimi, Deutschland 2016, R: Philipp Osthus
  widescreen: true
