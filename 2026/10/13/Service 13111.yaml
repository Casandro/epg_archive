  title: Terra Mater - NaturTalente
  subtitle: Die Kunst der Verführung (2/3)
  description: "Es gibt Momente im Leben, da geht es um alles: den begehrenswerten Blick, den unwiderstehlichen Move, das sexy Signal. Nur, wenn ER die Regeln der Verführung perfekt beherrscht, kann er es schaffen, SIE für sich zu gewinnen. Dabei ist kaum eine Disziplin so komplex wie die Kunst der Verführung, hat doch jede Tierart ihre eigenen Codes bei der Partnerwahl: Winkerfrosch-Männchen quaken nicht nur, um die Weibchen auf sich aufmerksam zu machen - sie schwingen auch ausgiebig mit den Hinterbeinen. Giraffen und Rothirsche liefern sich heftige Balzkämpfe, Brillenkaimane betören die Weibchen mit Infrasound, Glühwürmchen imponieren mit Lichtshows und Prachtbienen hüllen sich in unwiderstehliches Parfum. Doch Achtung: Verführer sollten genau hinschauen, ob ihre Auserwählte auch die Richtige ist. Sonst kann die schönste Sache der Welt... tödlich enden. Gleichwohl wäre die Erde ohne solche Verlockungen unvorstellbar - ist es doch \"Die Kunst der Verführung\", die unser Leben so lebenswert macht.     \nNatur, Österreich 2016"
  genre:
  - '145'
  widescreen: true
