  title: Das Jerico-Projekt
  description: |-
    Die CIA verfolgt einen tollkühnen Plan. Um an gestohlene Zugangsdaten zum US-amerikanischen Raketensystem zu gelangen, lässt Quaker Wells (Gary Oldman) die Erinnerungen des getöteten Agenten Bill Pope (Ryan Reynolds) in den Kopf von Jerico Stewart (Kevin Costner) verpflanzen. Der Arzt Dr. Micah Franks (Tommy Lee Jones) soll den neurologischen Eingriff vornehmen, was einem Experiment am Menschen gleichkommt. Als Jerico Stewart, ein zum Tode verurteilter Killer, tatsächlich die Geheiminformationen in seinem Gehirn erhält, kommt es in London zum Showdown mit russischen Spionen und dem Topterroristen Xavier Heimdahl (Jordi Mollà). - Thriller mit Starbesetzung von Ariel Vromen.
    USA, GBR,  2016
  widescreen: true
