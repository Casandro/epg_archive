  title: Stargate Atlantis
  subtitle: 10.000 Jahre
  description: |-
    Major Sheppard findet in einem verlassenen Labor der Atlantis eine schlafende alte Frau. Als sie wiederbelebt ist, behauptet sie tatsächlich Elisabeth Weir zu sein. Statt in einem Puddle Jumper, sei die Atlantis-Crew damals in einer Zeitmaschine durch das Stargate 10.000 Jahre in die Vergangenheit gereist. Als Dr. Weir damals wieder in ihre Gegenwart wollte, gab es aber kein Zurück.
    USA 2004
