  subtitle: Roboter in Sherwood
  description: |-
    1190 im Sherwood Forest: Der Doktor und Clara reisen ins Reich des legendären Robin Hood (Tom Riley). Als der Timelord den berühmten Bogenschießwettbewerb, an dem auch Robin teilnimmt, mit seinem Schallschraubenzieher sabotiert, rücken überraschenderweise Roboter-Ritter an, um das Zeitreise-Duo zu verhaften! Bei ihrer Spurensuche im mittelalterlichen England decken der Doktor und Clara eine bizarre Alien-Verschwörung auf: Offenbar arbeitet der Sheriff von Nottingham (Ben Miller) mit den Robotern zusammen. Die gehorteten Goldvorräte dienen dazu, das abgestürzte Raumschiff der Aliens zu reparieren.
    GBR 2014
