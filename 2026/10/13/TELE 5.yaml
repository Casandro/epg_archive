  title: Stargate
  subtitle: Vergeltung
  description: |-
    Teal'c wird von seiner Vergangenheit als Krieger im Dienst der Goa'uld eingeholt. Auf dem Planeten Cartago soll der Jaffa wegen Mordes zum Tode verurteilt werden. Die Situation vor dem "Cor-Ai"-Gericht ist prekär: Denn Teal'c hat die Tat vor vielen Jahren tatsächlich begangen und räumt seine Schuld auch ein. Zudem sinnt der Sohn des Getöteten nach Vergeltung! Während Colonel Jack O'Neill das Volk der Byrsa davon überzeugen muss, dass Teal'c nun zu den Guten gehört, greifen plötzlich die Goa'uld an.
    USA 1997
