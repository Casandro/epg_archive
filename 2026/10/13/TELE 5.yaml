  title: Archive
  description: |-
    2038 hat die KI-basierte Robotik ein völlig neues Level erreicht. George Almore (Theo James) forscht in Japan an futuristischen Androiden, die kaum mehr von echten Menschen zu unterscheiden sind. Jetzt steht der Softwareentwickler und Ingenieur kurz davor, die hochentwickelte Version des jüngsten Prototypen "J3" zu vollenden. Den wichtigsten Teil des Projekts hat George bislang geheim gehalten. Er will das digital archivierte Bewusstsein seiner verstorbenen Frau Jules (Stacy Martin) in den Androiden verpflanzen. Aber ist das wirklich so? - Das Regiedebüt von Gavin Rothery wurde u.a. bei der B3 Biennale in Frankfurt ausgezeichnet.
    GBR, , USA 2020
  widescreen: true
