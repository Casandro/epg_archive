- eventId: 749583
  start: 2026-10-13T07:40:00Z
  stop: 2026-10-13T08:25:00Z
  title: Wer weiß denn sowas?
  subtitle: 'Gäste: Matthias Ginter und Christina Ginter'
  description: |-
    Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
    Beide Teams spielen um Bares für ihre Unterstützer. Zu Beginn des Wissensspiels müssen sich die Zuschauer im Studio entscheiden: Setzen sie sich auf die Seite von Superhirn Bernhard Hoëcker oder von Quizmaster Elton?
- eventId: 750003
  start: 2026-10-13T08:25:00Z
  stop: 2026-10-13T09:10:00Z
  title: Garten & Lecker
  subtitle: Brennnesselgemüse aus dem Waldgarten
  description: |-
    Wer hat das schönste Gartenfest unter dem Motto "Tief verwurzelt" ausgerichtet?
    Zum Finale geht es nach Warburg in Ostwestfalen. Auf 10.000 qm legt Torben Sauerland einen essbaren Waldgarten an. Beim Gartenfest möchte Torben einen Blick in die Zukunft werfen: Das Menü soll aus Zutaten bestehen, die es jetzt oder in absehbarer Zukunft auf dem Grundstück zu ernten geben wird. Es gibt Kürbissuppe zum Empfang, Omelett mit Roter Beete als Vorspeise und zum Hauptgang Brennnesselgemüse mit Fächerkartoffeln und Hühnerbrust. Als Dessert gibt es Esskastanienkuchen und dazu ein Löwenzahnkaffee.
- eventId: 750563
  start: 2026-10-13T09:10:00Z
  stop: 2026-10-13T09:55:00Z
  title: Expedition in die Heimat
  subtitle: Magischer Pfälzerwald
  description: Moderator Arndt Reisenbichler erlebt den Pfälzerwald passend zu Halloween von seiner magischen Seite - auf fünf spannenden Wanderungen, die man bequem nachwandern kann - allerdings nur auf eigene Gefahr.
