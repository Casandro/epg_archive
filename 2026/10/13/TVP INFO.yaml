  title: Polskie parki narodowe 1 (odc. 3)
  subtitle: Tematem programu będzie Pieniński Park Narodowy, znany z malowniczego przełomu Dunajca, wapiennych szczytów oraz wyjątkowych walorów przyrodniczych i krajobrazowych.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Prowadzącym program jest Dariusz Gross, dziennikarz, zafascynowany przyrodą poszukiwacz - odkrywca. Pokazuje parki narodowe, które znamy jako turyści, z innej, zaskakującej strony, przez pryzmat pracy naukowców zgłębiających sekrety ekosystemów i pracujących nad ich zachowaniem dla przyszłych pokoleń. To program pokazujący osobliwości przyrody i ukazujący wyjątkowość poszczególnych parków narodowych w Polsce, w którym spotykają się nowoczesne technologie badawcze z odwiecznym dziełem natury.
