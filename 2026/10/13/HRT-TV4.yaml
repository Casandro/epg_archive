  description: 'Američki predsjednik Donald Trump ponovno dolijeva ulje na vatru rata u Ukrajini. Dok Europska unija uvodi nove sankcije Rusiji, Trump s Vladimirom Putinom dogovara isporuku ruskog dizela Sjedinjenim Američkim Državama i traži izbore u Ukrajini. Zelenski uzvraća: održat ćemo izbore ako se dogovori 60 dana primirja. Moskva to ne prihvaća. Kakve će biti posljedice novih globalnih potresa i dogovora?  Gosti su: prof. dr. sc. Đana Luša, politologinja, Fakultet političkih znanosti u Zagrebu, izv. prof. dr. sc. Gordan Akrap, prorektor Sveučilišta obrane i sigurnosti "Dr. Franjo Tuđman", Denis Avdagić, politički analitičar.'
