  description: Es gibt kein Gericht, dass die helle Freude mit nur einem Bissen überzeugender herstellt, als die Kärntner Nudel. Auch, wenn Kärnten immer wieder kritisiert wird, die Kärntner Nudeln gehören unter Denkmalschutz. Davon ist auch Thomas Dorfer überzeugt, seines Zeichens Drei-Hauben-Koch aus dem Landhaus Bacher. Er zeigt mir hier seine Tricks und Kniffe für die perfekten Kasnudeln. AT 2017
