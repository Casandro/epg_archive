  title: Mein wunderbarer Kochsalon - Quinoa Chocolate Cookies
  subtitle: Mein wunderbarer Kochsalon - Quinoa Chocolate Cookies
  description: Meine Teenager-Tochter Lilly war schon immer dem Zucker sehr zugeneigt. Das Teenagertum bringt nun ein gewisses Figurbewusstsein mit sich und das Kind fordert etwas Gesundes Süßes ein. "Hm, wie wäre es mit einer Banane?" Damit bin ich abgeprallt. Also musste ich tiefer graben. Diese Quinoa Cookies mit den kleinen Wunderkörnern und dunkler Schokolade stellten dann Lilly und auch mich äußerst zufrieden. Moderate Sünde, herrlicher Geschmack. Und Teil meines neuen Kochbuchs "Happy". Lilly und ich sind der lebende Beweis, dass es dort hineingehört. AT 2017
