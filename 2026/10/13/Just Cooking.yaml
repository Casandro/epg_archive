  description: Ein Gumbo ist an sich ein typisches Gericht aus der US-amerikanischen Südstaatenküche. Normalerweise wird er mit einer Einbrenn eingedickt, das haben wir uns erspart. Der Begriff gumbo ist wahrscheinlich abgeleitet von dem angolanischen Wort kingombo für Okra, häufig eine Zutat des Gerichts. Bei uns gibt es ihn mit Tomaten, Paprika und Garnelen. Nicht nur rasch gemacht, sondern funktioniert auch in rauen Mengen. Ein garantierter Erfolg auf jeder Party. AT 2017
