  subtitle: Mein wunderbarer Kochsalon - Gebackene Ochsenherztomate mit Couscous
  description: 100 Jahre Geschichte. Das Centennium betrifft nicht nur den Familienbetrieb von Markus Pannagl sondern auch die Tomatensorte, auf die sie sich spezialisiert haben. Die Ochsenherztomate wurde vergessen und war in Österreichs Supermarktregalen nicht mehr zu finden. Die Familie Pannagl sorgt nun für eine Renaissance der stark gerippten, fleischigen und kernarmen Sorte, die bis zu einem Kilogramm pro Stück auf die Waage bringen kann. Die Ochsenherztomate reift übrigens von innen nach außen, man darf sich also nicht von der grünen bis hellroten Farbe abschrecken, roh schmecken sie in diesem Stadium am besten. AT 2017
