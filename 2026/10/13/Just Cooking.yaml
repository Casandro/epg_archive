  title: Mein wunderbarer Kochsalon - Topfen- und Powidlgolatschen
  subtitle: Mein wunderbarer Kochsalon - Topfen- und Powidlgolatschen
  description: 'Mohn, Topfen und Powidl sind die klassischen Füllungen für die Golatsche, ein altslawisches Gebäck, das vor allem bei Hochzeiten zum Einsatz kam. Eigentlich heißt sie ja Kolatsche, aber das kommt mir schwer über die Lippen. Der tschechische Begriff "kolác" steht für Rad, mit einem Kreuz verziert, wurde sie samt tragender Symbolik dem Brautpaar überreicht. Wie wir unsere geliebte Topfengolatsche kennen, ist eine Weiterentwicklung des Originals. Damals wurde sie nämliche aus Germteig zubereitet, was mein Gast und ich ausprobierten: Berit Büttner hat gerade ihre Lehrlingsprüfung bestanden und knetet, walkt und bäckt für Anker mit großer Leidenschaft Tag für Tag. AT 2017'
  ageRating: 6
