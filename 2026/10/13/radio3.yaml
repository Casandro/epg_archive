- eventId: 1077006
  start: 2026-10-13T19:00:00Z
  stop: 2026-10-13T20:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Friederike Westerhaus'
  description: |-
    "Durch die Musik umarmen" - Pascal Dusapin

    Pascal Dusapin hat sich schon früh für ganz unterschiedliche Stile begeistern können, ob Bach oder The Doors, Free Jazz oder Beethoven - all das hat auch seine einzigartige Musiksprache geprägt. Er gehört zu den bedeutenden Komponisten unserer Zeit, ist in fast allen Gattungen unterwegs. Wichtige Impulse bekam er auch im Studium bei Iannis Xenakis und Olivier Messiaen. Immer wieder lässt sich Dusapin auch von anderen Künsten inspirieren, von Architektur, Fotografie und Literatur. An der Staatsoper Hannover wird im Oktober sein von ihm selbst als "Operatorium" bezeichnetes Werk "Il Viaggio, Dante" aufgeführt, ein Stück, das auch die Hoffnung auf Erlösung kennt: "Ich wollte diese metaphysische und spirituelle Dimension durch die Musik umarmen", so Dusapin. Ein Porträt.

    Moderation: Friederike Westerhaus
