  description: Neufundlands Landschaft ist unberührt, dramatisch und dünn besiedelt. Im Sommer treiben manchmal Eisberge an den steilen Klippen vorbei. Da die Titanic hier mit einem Eisberg kollidierte und sank, wurden die letzten Funkmeldungen des Schiffes in einer kleinen Holzhütte auf der Avalon-Halbinsel empfangen.
