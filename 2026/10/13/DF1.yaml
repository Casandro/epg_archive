  title: MareTV
  subtitle: Büsum und die Meldorfer Bucht - Grünstrand, Krabben, Wattmusik
  description: 'Eigentlich ist die Küste von Dithmarschen in Norddeutschland für ihren Kohl bekannt, aber die Region hat viel mehr zu bieten. Insbesondere die Stadt Büsum und die Meldorfer Bucht entwickeln sich allmählich zu Touristenattraktionen. Hier begegnet man ausgedehnten Wattflächen, kantigen Küstenbewohnern und einem enormen Naturreichtum. Sogar die Strände spiegeln dies wider, da sie grün sind. In Ermangelung echter Sandstrände wurden die Deiche der Meldorfer Bucht einfach zu grünen Stränden erklärt. Krabbenkutter gehören zu Büsum wie Gezeitenwasser zur Nordsee. Aber der Handel mit den beliebten Krebstieren wird immer schwieriger: Die Preise fallen und das Schälen von Krabben in Marokko steht aus Nachhaltigkeitsgründen in der Kritik. Kutter-Kapitän Andre Claussen kämpft für die Zukunft der kleinen und schmackhaften braunen Krabben.'
  genre:
  - '161'
