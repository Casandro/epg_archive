  title: MareTV
  subtitle: 'Islands einsamer Osten: Fjorde - Gletscher - Gammelhai'
  description: Die am dünnsten besiedelte Region Islands heißt Austurland oder Ostland. Die mächtigen Ostfjorde gelten als das "grüne Herz" des Landes und der Vatnajökull ist der größte Gletscher. In seinem Hafenschuppen in Borgarfjörður lässt Kalli Sveinsson eine ganz besondere isländische Spezialität reifen, bekannt als Hákarl oder fermentierter Hai. Der absolute Höhepunkt des Jahres muss der Réttir sein, das traditionelle Schafetreiben. Es endet mit der Sortierung der Schafe im Pferch, ein buchstäblich wildes Vergnügen. Thórdur (Doddi) Júliússon züchtet sein ganzes Leben lang Islandpferde und unterhält seine Gäste mit einer Fülle von Liedern und Geschichten. Der 66-jährige Kristinn Kristmundsson ist stolz darauf, dass sein Selbstbedienungsladen - eine winzige, leuchtend grün gestrichene Hütte in der abgelegensten Ecke Ostislands - dank eines Solarstromsystems und einer Windturbine autark funktioniert. Die Gletscherforscherin Hrafnhildur Hannesdóttir und Fotograf Stephan Mantler erkunden einen Schmelzwasserfall in einer Eishöhle, möglicherweise eine der Folgen der globalen Erwärmung.
  genre:
  - '145'
  widescreen: true
  hd: true
