    In der "Sendung mit dem Elefanten" dreht sich heute alles um Piraten. Viele Kinder erklären, was Piraten eigentlich ausmacht und wie sie leben. Ob Piraten wohl jemals Angst haben? Und ob sie auch richtig feiern? Timmy und seine Freunde verkleiden sich als Piraten und gehen auf Schatzsuche. Ob sie wohl einen echten Schatz finden? Karolin Kebekus und Kasalla singen mit ganz vielen Kindern ein wildes Piratenlied. Und zum Schluss verabschieden sich Tanja, André und Knolle in einem selbstgebauten Piratenboot. Harr!
