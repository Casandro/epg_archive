    Pip und Posy haben Einladungskarten für ein Picknick gebastelt und wollen sie nun an alle Freunde verteilen. Jamila übt derweil Radfahren und Zac prescht auf seinem Rad vorbei.

    Zac fordert Jamila auf, mit ihm eine tolle Fahrradtour zu machen, aber Jamila ist damit überfordert. Und während Pip und Posy hinter Frankie herlaufen, um ihr die Einladungskarte zu überreichen, kommt Jamila ganz schön ins Schwitzen.

    Zac scheint Jamilas Nöte gar nicht wahrzunehmen. Als Jamila fast die Schnecke Hercules überfährt, vergeht ihr endgültig die Lust auf die Fahrradtour mit Zac. Pip und Posy machen ihrem Freund klar, dass er sich Jamila gegenüber nicht besonders rücksichtsvoll verhalten hat. Zac entschuldigt sich bei Jamila - sie verzeiht ihm und am Ende verteilen die beiden zusammen auf ihren Fahrrädern die Einladungskarten für das Picknick von Pip und Posy. ...
