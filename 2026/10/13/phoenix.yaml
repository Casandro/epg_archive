  title: Über den Wolken - Leben in den Bergen (2/3)
  subtitle: Himalaya
  widescreen: true
  hd: true
  description: Der Himalaja, das höchste Gebirge der Erde, ist die Heimat von faszinierenden Tieren und außergewöhnlichen alten Kulturen. Im zweiten Teil der Dokumentarreihe werden wir Zeugen, wie sich Schneeleoparden auf der Suche nach Nahrung in einsame Bergdörfer schleichen. Bizarr aussehende Affen drängen sich in einem frostigen Wald zusammen, um einander zu wärmen. Buddhistische Klöster zelebrieren ihre uralten Rituale, und ambitionierte Bergsteiger wetteifern am mörderischen Hang des Mount Everest.
- eventId:
  - 1130329
  - 921243
  start: 2026-10-13T01:45:00Z
  stop: 2026-10-13T02:30:00Z
  title: Über den Wolken - Leben in den Bergen (3/3)
  subtitle: Anden
  widescreen: true
  hd: true
  description: |-
    Die Anden durchziehen den südamerikanischen Kontinent von der Karibik bis nach Feuerland. Auf rund 7500 Kilometern finden sich windumtoste Sechstausender, brodelnde Vulkane, karge Hochebenen und menschenleere Wüsten. Und neben dem landschaftlichen Reichtum besitzt die gesamte Andenregion riesige Vorkommen an Bodenschätzen.
    Diese Folge gewährt Einblicke in die extremen Gegensätze der Anden. In der grandiosen Kulisse zwischen den trockensten Wüsten und artenreichsten Nebelwäldern zeigt die Episode Inka-Nachfahren beim Bau einer Seilbrücke, Brillenbären beim Bad in einer Wüsten-Oase und exotische Kreaturen wie Salzfliegen-Echsen.
