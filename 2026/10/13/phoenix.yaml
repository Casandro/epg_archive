  title: Über den Wolken - Leben in den Bergen (1/3)
  subtitle: Rocky Mountains
  widescreen: true
  hd: true
  description: Die Rocky Mountains sind die mächtigste Bergkette Nordamerikas. Sie erstreckt sich über rund 4500 Kilometer von Alaska bis New Mexico und bietet noch zahllose nahezu unberührte Lebensräume. In dem weitläufigsten Gebirge der Erde leben außergewöhnliche Tiere und bemerkenswerte Menschen. Die "Rockies" sind das Rückgrat Nordamerikas, eine wunderschöne Wildnis, in der Pumas, Wölfe, Vielfraße und Grizzlies zu Hause sind.
