  title: Bayerische Landfrauen kochen auf ...einfach regional genießen! (Wh.)
  subtitle: 'Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es..'
  description: |-
    Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps und Rezepte rund ums bayerische Essen. Diese Landfrauen kommen aus unterschiedlichen landwirtschaftlichen Betrieben in ganz Bayern und lieben die Landwirtschaft und lieben Bayern! Hier erfahren Sie viel über die Vielfalt und Qualität der heimischen Erzeugnisse, aber auch die Arbeit und das Engagement der Landwirte.

    Moderatorin Johanna Nagel führt uns in die kulinarische Welt der bayerischen Landfrauen und trifft auf Landfrau Evi Rieger und Expertin Lea Miesl. Gekocht wird ein Apfelkuchen mit Vanillesoße.
- eventId: 566620
  start: 2026-10-13T06:30:00Z
  stop: 2026-10-13T07:00:00Z
