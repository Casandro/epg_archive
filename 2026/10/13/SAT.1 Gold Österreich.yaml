    Altersfreigabe: ab 12
    (WH vom Montag, 12.10.2026, 20:15 Uhr)
  description: |-
    Moderation: Uwe Ochsenknecht

    Im Jahr 1998 bricht ein Mann in ein Privathaus in Sennewitz ein und nimmt dem Eigentümer sowie dessen Mutter das Leben. Bei dieser eiskalten Bluttat soll es nicht bleiben: Die Ehefrau und Tochter des Hausbesitzers vergewaltigt der Täter über mehrere Stunden hinweg. Ein Fall besonderer Härte, der schon bald eine bundesweite Fahndung auslöst. Außerdem bei "Die 7 Todsünden": Ein entsetzlicher Leichenfund am Ufer der Weißen Elster in Leipzig im Jahr 2012.
