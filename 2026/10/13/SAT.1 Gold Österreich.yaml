    Das liebe Geld
    Western, USA 1994
    Altersfreigabe: ab 6
  description: |-
    Bis zur Hochzeit soll das neue Haus von Dr. Quinn und Sully fertig werden. Es gibt nur ein Problem: Sullys Geld reicht nicht aus, und er will nicht, dass sich Mike an den Baukosten beteiligt. Um den fehlenden Betrag aufzubringen, heuert Sully als Messerwerfer bei einer Schaustellertruppe an. Doch auch seine Auftritte bringen nicht genug ein, um die fehlenden Baumaterialien zu beschaffen. Wird er sich weiter stur stellen oder doch noch auf Dr. Quinns Angebot eingehen?

    Regie: Chuck Bowman
