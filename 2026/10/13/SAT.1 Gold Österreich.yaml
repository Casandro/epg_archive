    Krimi, USA 1998
    Altersfreigabe: ab 12
  description: |-
    Hobbydetektiv Dr. Mark Sloan und die Polizei stehen vor einem Rätsel: Nachdem Celeste bei einem Attentat getötet worden ist, geschehen noch zwei weitere Morde. Alle Opfer weisen eine Gemeinsamkeit auf - und diese Spur führt ausgerechnet ins Krankenhaus. Schon bald verdächtigt Dr. Sloan Rogan, den neuen Computerspezialisten der Klinik, der zu den Patientenkarteien Zugang hat. Bei seinen Ermittlungen kommt Dr. Sloan dahinter, dass bereits der vierte Mord geplant ist.

    Regie: Frank Thackery
