  title: Rentnercops - 46. Aliens
  subtitle: Spielfilm Deutschland 2020
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: |-
    Laura Frebel wird tot in ihrem Bett gefunden, offenbar wurde sie erstickt. Soweit noch nichts Besonderes für Edwin und Günter, aber als Nachbarn behaupten, sie hätten zur Tatzeit ein UFO hinter dem Haus der Frebels gesehen, wird vor allem Edwins Interesse geweckt. Zumal Laura Frebel eine Zeitlang eine Gruppe von UFO-Beobachtern namens "Kölner Sichter" besuchte.

    Mit diesen Durchgeknallten - so Edwin - will er unbedingt reden. Er staunt nicht schlecht, als er und Günter von der Gruppe erzählt bekommen, dass sie schon seit Jahren in Kontakt mit Außerirdischen stehen, die auch vor Mord nicht zurückschrecken.
- eventId: 920653
