  title: Rentnercops - 47. Endlich frei sein
  subtitle: Spielfilm Deutschland 2020
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: "Günter und Edwin genießen im Garten der Hoffmanns einen schönen lauen Sommerabend und sind rundum zufrieden - sogar Edwin. Das ändert sich am nächsten Morgen schlagartig, als sie im Büro unvermutet auf eine neue Kollegin treffen: Hannah Gereg. Hannah, ebenfalls schon in Rente, war Kriminalbeamtin im Sauerland und hat Plocher dazu genötigt, sie genau wie Günter und Edwin wieder in den Dienst zu stellen. \nDie forsche Hannah geht Edwin völlig gegen den Strich, was er sie auch spüren lässt. Und Günter kann Veränderungen sowieso nicht leiden. Schon bei ihrem ersten Fall fliegen die Fetzen."
