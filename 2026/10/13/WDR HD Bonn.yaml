  title: Neues aus dem Münchner Tierpark Hellabrunn (1/30)
  subtitle: Eisbärengeburtstag
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Es gibt so viel, was sich hinter den Kulissen des Tierparks Hellabrunn tut! Die Reporter Felix Heidinger und Jens-Uwe Heins gehen jede Woche auf Erkundungstour und berichten top-aktuell über die Geschehnisse.
    Tag für Tag sind sie im Tierpark unterwegs und zeigen, was sich dort abspielt. Sie begleiten die Pfleger bei ihren Begegnungen und besonderen Erlebnissen mit den Tieren: Wie entwickeln sich die Eisbären-Zwillinge? Was ist die Lieblingsbeschäftigung der Elefanten und welche Pläne gibt es für die Affen?
- eventId: 920652
