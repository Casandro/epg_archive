  audiodesc: true
  description: "* Gustis Baby\nEigentlich wollte René Forberg gerade Feierabend machen, doch dann setzen bei Rothschild-Giraffe Gusti die Wehen ein. Schon seit Wochen warten die Afrikapfleger darauf, dass Gustis Kalb endlich auf die Welt kommt.\n* Bitte nur gucken\nBei den Geparden und Husarenaffen steht eine Premiere an. Beide sollen sich erstmals gemeinsam auf der Außenanlage, der neu erbauten Kiwara-Kopje, begegnen. \n* Big in Japan\nNashornkind Samia soll bald auf eignen Füßen stehen. Seit einigen Wochen lebt sie schon allein - getrennt von ihrer Mutter. Nun steht eine große Reise an - im Zoo von Osaka soll Samia zukünftig wohnen."
