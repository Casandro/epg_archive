  description: Der Historiker Kai Michel sucht Antworten auf die Frage, ob das Führen von Kriegen zur Natur des Menschen gehört und was eigentlich die evolutionären Wurzeln der Gewalt sind. Dabei spielen Biologie, etwa aktuelle Forschung über Bonobos und Schimpansen, aber auch Geschichte und Archäologie eine Rolle. Inwiefern kam mit der Zivilisation der Krieg in das Leben der Menschen?
  subtitle: 'Fragen an den Autor: Warum müssen Menschen ständig Kriege führen?'
