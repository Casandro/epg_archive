  title: SWR Kultur - Das Wissen
  subtitle: Berufsverbot - Dürfen Rechtsextreme für den Staat arbeiten?
  description: |-
    Von Marc Bädorf
    Rund 30 Prozent der Beamte haben bei der Landtagswahl in Sachsen-Anhalt im Herbst 2026 für die AfD gestimmt. Seit im Frühjahr 2025 ein Gutachten bekannt wurde, in dem das Bundesamt für Verfassungsschutz die AfD als gesichert rechtsextremistisch einstuft, gewinnt die Frage, wer für den Staat arbeiten darf, an Brisanz. Zwar darf der Verfassungsschutz aufgrund eines Rechtsstreits mit der Partei die AfD öffentlich nicht mehr "rechtsextrem" nennen. Dennoch wollen manche Länder Beamte stärker auf ihre politische Gesinnung überprüfen. In den 1970er-Jahren hatte die Politik mit dem umstrittenen Radikalenerlass schon mal versucht, gegen - damals linke - Verfassungsfeinde vorzugehen. (SWR 2025/2026)
