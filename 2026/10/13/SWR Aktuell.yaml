  title: SWR Aktuell Langstrecke
  description: "14:00\nQuarks - mal angenommen ......\nAlle in Deutschland machen nur noch Urlaub im eigenen Land - was dann? \nHeute machen deutlich mehr Deutsche Urlaub im Ausland als im eigenen Land. In unserem Zukunftsszenario ist das vorbei. Alle bleiben hier und haben oft kurze Wege. Aber: Gäbe es dafür genug Hotels und Co.? Und: Könnten wir uns dann Urlaub überhaupt noch leisten?\n\n14:30\nSWR Kultur Das Wissen\nMit der Seilbahn durch die Stadt - bald auch in Deutschland?\nIn Paris hat der Verkehrsverbund die längste innerstädtische Seilbahn Europas eröffnet - gebaut in nur drei Jahren. Jetzt planen Bonn und Herne Deutschlands erste ÖPNV-Seilbahn - und kämpfen mit großen bürokratischen Hürden.\nAutor: Max Rauner\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
