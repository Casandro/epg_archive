  subtitle: 'Zu Gast: Nora Tschirner'
  description: 'Lavalampen raus und Klapphandys an! "Die Carolin Kebekus Show" reist in die Zeit, in der das Internet noch unschuldig und die Augenbrauen sehr, sehr dünn waren! Es geht zurück in die Zweitausender, denn die Nuller-Jahre sind gerade wieder überall: Ob Barbara Salesch, Diddl-Maus oder Britney Spears - gefühlt jede Woche feiert eine neue Ikone aus diesem Jahrzehnt ihr Comeback. Welche dieser Retro-Trends begrüßenswert sind und welche sich gerne wieder verabschieden können, das klärt Carolin mit ihrem Gast, Schauspielerin Nora Tschirner.'
