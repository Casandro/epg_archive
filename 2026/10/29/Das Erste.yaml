  description: "Die Dokumentation zeichnet das außergewöhnliche Leben eines der erfolgreichsten Formel-1-Fahrer nach. In vier Episoden beleuchtet sie nicht nur Vettels Weg vom motorsportbegeisterten Jungen zum vierfachen Weltmeister, sondern auch die persönlichen Konflikte und Wendepunkte seiner Karriere. Im Mittelpunkt stehen sein unermüdlicher Ehrgeiz, die sportlichen Erfolge sowie seine zunehmende \nAuseinandersetzung mit gesellschaftlichen und ökologischen Themen. Mit exklusiven Interviews, seltenem Archivmaterial und persönlichen Einblicken des Protagonisten zeigt \"Being Sebastian Vettel\" einen Menschen, der sich immer wieder neu hinterfragt."
