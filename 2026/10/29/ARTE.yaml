  description: 'On a retrouvé dans son casier un opiacé susceptible de ralentir le rythme cardiaque. Accusée de meurtre, elle renoue avec sa fille, qui accepte de l''aider. Après une perquisition de son domicile, elle est incarcérée. C''est un avocat commis d''office qui prendra sa défense : maître Novak, qui se révèle brouillon mais efficace. Les policiers enquêtent sur un autre décès survenu dans le service six ans auparavant. L''infirmière militerait-elle pour l''euthanasie et serait-elle récidiviste ? La direction de l''hôpital décide de tenir une conférence de presse qui va s''avérer houleuse. Quant à Tereza, elle a renoncé à l''exil cap-verdien, et fait face à une horde de journalistes avides de sensationnel et aux factures de sa mère qui s''accumulent. Réalisateur: Michal Blasko. Des acteurs: Klára Melísková (Hana Kucerová), Denisa Baresová (Tereza Kucerová), Miroslav Hanus (Pavel Novák), Ivan Trojan (le docteur Vaculík), Johana Matousková (Bára Danková) (2022)'
