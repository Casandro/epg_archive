  title: 'Carole King and James Taylor : Live at The Troubadour'
  subtitle: En 2007, Carole King et James Taylor foulaient à nouveau la scène du Troubadour de Los Angeles pour un concert historique.
  genre:
  - '97'
  description: 'Ils se sont produits ensemble pour la première fois en 1970. James Taylor, qui vient de sortir son deuxième album, le brillant Sweet Baby James, invite alors la jeune Carole King à fouler avec lui la scène du Troubadour, salle incontournable de Los Angeles située sur le mythique Sunset Boulevard. La New-Yorkaise, pianiste, auteure, compositrice et interprète, auréolée des tubes déjà nombreux qu''elle a ciselés pour d''autres, s''apprête à devenir une star avec l''opus Tapestry, qui se vendra à plus de 25 millions d''exemplaires. Trente-sept ans plus tard, en 2007, les deux icônes du folk rock américain réinvestissaient les lieux à l''occasion des 50 ans du Troubadour. Dans l''antre du club californien, la voix chaleureuse de Carole King et le timbre inimitable de James Taylor se mêlent harmonieusement tout au long de ce concert envoûtant, émaillé de leurs plus grands succès : "I Feel the Earth Move", "So Far Away", "Sweet Baby James", "Will You Still Love Me Tomorrow", "You''ve Got a Friend", "It''s Too Late". Un moment chargé d''émotion, qui inaugura une tournée à guichets fermés aux États-Unis, en Australie et au Japon. Filmé en novembre 2007 au Troubadour à Los Angeles, États-Unis. Réalisateur: Martyn Atkins (2007)'
- eventId: 667010
  start: 2026-10-29T01:36:57Z
  stop: 2026-10-29T02:51:22Z
  title: Carole King and James Taylor - Live at the Troubadour
  description: |-
    Concert (États-Unis, 2010, 1h13mn) Les retrouvailles émouvantes de deux légendes de la musique américaine : en 2007, Carole King et James Taylor foulaient à nouveau la scène du Troubadour de Los Angeles, où ils donnèrent leur premier concert ensemble près de quatre décennies plus tôt.

