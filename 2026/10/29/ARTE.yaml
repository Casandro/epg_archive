  title: L'histoire de "Scénario"
  subtitle: Entre 2018 et son décès en 2022, Jean-Luc Godard travaille sur un nouveau long métrage, "Scénario", une oeuvre hantée par la mort restée inachevée.
  genre:
  - '118'
  description: 'Au cours de l''été 2018, quelques mois après la sortie du "Livre d''image", Jean-Luc Godard commence à travailler sur un nouveau long métrage, titré "Scénario", pour Arte. Le cinéaste envoie à la chaîne des notes, puis des cahiers illustrés qu''il nomme "brochures", précisant l''évolution des thèmes qu''il veut aborder à partir du poème de Lucrèce "De la nature des choses". En octobre 2021, une nouvelle brochure est prête. Collages, coupures de presse, peintures, photos, dessins, motifs visuels et mots en apesanteur sur le papier : le cinéaste de 91 ans mixe les techniques et donne forme à une pensée dont la fulgurance s''agrège à toute une cosmogonie de références et de citations. Réalisateur: Jean-Luc Godard (2024)'
