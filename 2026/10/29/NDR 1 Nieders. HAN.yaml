  title: Unser Thema
  subtitle: Niedersächsische Themen und Menschen im Fokus
  description: 'Ronald Schill ist nun dort, wo er hinwollte: an der Macht. Er ist der neue Innensenator Hamburgs, macht aber immer wieder mit wilden Partys Schlagzeilen. Es kommen Gerüchte auf, dass der Hardliner Schill selbst Drogen nehmen könnte. Er bestreitet das, gerät aber zunehmend unter Druck. "Die Schill-Show" erzählt die Geschichte von Ronald Schill: Vor 25 Jahren kommt er mit einem rechtspopulistischen Law-and-Order-Programm in Hamburg an die Macht. Doch auf den schnellen Aufstieg folgen Schlagzeilen, Skandale und ein beispielloser Absturz.'
