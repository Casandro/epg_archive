  title: Kirche in Not - Spirit
  subtitle: Wie betet man richtig?
  description: |-
    Mit: Pater Dr. Anton Lässer CP, Internationaler Kirchlicher Assistent von KIRCHE IN NOT (ACN)
    Moderation: Volker Niggewöhner

    Viele Menschen sehnen sich nach einer echten Verbindung mit Gott, erleben das Gebet jedoch oft als frustrierende Einbahnstraße oder wissen schlicht nicht, wie es geht. Gibt es ein Geheimnis für ein erfülltes Gebetsleben, das den Alltag verändert? Pater Anton Lässer CP bricht das vermeintlich verstaubte Thema radikal auf und zeigt, warum das tägliche Gespräch mit Gott die ultimative Kraftquelle ist.
  widescreen: true
- eventId: 987400
