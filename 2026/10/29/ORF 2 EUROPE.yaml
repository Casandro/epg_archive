  title: Schauplatz Gericht
  subtitle: Fehlurteil?
  description: "In fast 30 Jahren Schauplatz Gericht sind Peter Resetarits immer wieder Fälle untergekommen, in denen er  starke Zweifel hatte, ob tatsächlich die \"Richtigen\" als Mörder zu langen Haftstrafen verurteilt wurden. In drei Fällen geht er nochmals den zum Teil erstaunlichen Ungereimtheiten in den jeweiligen Gerichtsverfahren nach, widmet sich der Frage wer die wahren Täter sein könnten, und vor allem wie es den Verurteilten ergangen ist. Der als Mörder verurteilte Tibor Foco ist etwa nach wie vor spurlos verschwunden, und wird noch immer gesucht. ORF Reporter Christoph Bendas ist in dieser Causa alten Spuren nachgegangen und auf einen zweiten Mord gestoßen, der mit der Causa Foco zu tun haben könnte. Wurde ein Mitwisser zum Schweigen gebracht? Die als Mörder verurteilten Peter L. und Peter H. haben nach haarsträubenden Fehlurteilen und vielen Jahren, die sie in Haft verbracht haben, in neu aufgerollten Verfahren ihre Unschuld beweisen können und finanzielle Haftentschädigungen bekommen. Aber haben sie in Freiheit noch einmal in ein erfülltes Leben gefunden? Manchmal scheint es aber auch so zu sein, dass Menschen, die andere vorsätzlich getötet haben, mit Hinweis auf ihre Zurechnungsunfähigkeit um eine lange Haftstrafe herumkommen. Ein besonders dramatischer Fall hat sich 2017 in Salzburg ereignet. Ein Familienvater aus Norwegen wurde wegen Mordes an einem jungen Mann, und dreifachen Mordversuchs, begangen an seiner Frau und seinen beiden Kindern, vor Gericht gestellt. \nDie Taten hat er gestanden, aber zur allgemeinen Überraschung wurde er gleich nach der Hauptverhandlung entlassen - und ist sofort in seine Heimat ausgereist. Er sei zum Tatzeitpunkt zurechnungsunfähig, und daher auch nicht schuldfähig gewesen, haben die Geschwornen befunden.\nHat er eine Psychose, wie der Opferanwalt überzeugt ist, nur vorgetäuscht? Hat er die gerichtlichen Auflagen alle eingehalten, wurden sie überprüft, und wie ist sein weiteres Leben verlaufen?\nGehört der Versuch wegen Kapitalverbrechen angeklagte Täter bei Gericht als \"zurechnungsunfähig\" hinzustellen mittlerweile zum Standardrepertoire von Strafverteidigern?"
  genre:
  - '35'
