  title: Die Sakramente - Eucharistie
  subtitle: Gespräch
  description: Gottes unsichtbares Wirken in den Sakramenten ist jener Schatz, den Er allen Menschen zugänglich machen möchte, denn es ist die Quelle für Heil und Heiligung. Prof. Ralph Weimann erläutert im Gespräch mit Athinea Andryszczak worum es geht und warum es gerade heute wichtiger denn je ist, sie zu verstehen und von ihnen Gebrauch zu machen. Deshalb startet bei K-TV ab September eine neue, siebenteilige Gesprächsreihe über die sieben Sakramente.
