  title: Kneipp für d' Leut (Folge 1) Gesundheit durch Lebenswandel
  subtitle: Dokumentation
  description: '"Die Menschheit ist weit von der einfachen, natürlichen Lebensweise abgewichen; sie hat in jeder Beziehung das Leben anders gestaltet, als es sein sollte" (Pfarrer Sebastian Kneipp). Erster Teil einer 6-teiligen Dokumentation über den Wasserdoktor Pfr. Sebastian Kneipp und die fünf Säulen seiner Gesundheitslehre von Pfr. Thomas Maria Rimmel.'
