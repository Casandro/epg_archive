  title: Aussergewöhnliche Frauen
  subtitle: Dokumentation
  description: Sr. Bernadette ist eine von sechs außergewöhnlichen Frauen, die in diesem Film portraitiert werden. Sie erzählt davon, was sie spirituell motiviert hat, um als geweihte Frau in einem Frauenorden zu leben. Sechs Frauen, die in sechs verschiedenen Ländern leben, die sechs unterschiedliche Charismen besitzen. Alle jedoch eint die tiefe Liebe zu ihrem göttlichen Gemahl. Diese Frauen sind verliebt in Gott und ihre Nächsten, haben den verborgenen Schatz des Evangeliums gefunden. Sie haben alles verlassen, um ihrem Geliebten zu folgen. Ihre Arbeit ist wirklich außergewöhnlich. Voller Freude dienen sie Frauen, Kindern und Männern in ihrer Not, sei sie physisch oder spirituell. Diese sechs Zeugnisse sind ein kurzer Ausschnitt von der unschätzbaren Arbeit, die Nonnen, Schwestern und geweihte Frau auf der ganzen Welt leisten. Sie sind Säulen in der Kirche.
