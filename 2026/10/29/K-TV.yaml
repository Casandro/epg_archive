  title: '"Wenn dir Gott begegnet, was willst du da machen?" I Vom Protestanten zum katholischen Mönch'
  subtitle: Gespräch
  description: 'Pater Kilian Müller erlebt 2006 eine Begegnung, die sein bisheriges Leben komplett auf den Kopf stellt. Hinter ihm liegen die Suche nach Erfolg, die Sehnsucht nach Erfüllung, eine tiefe innere Leere und eine erschütternde Diagnose, die alles infrage stellt. Doch dann beginnt ein Weg, mit dem niemand gerechnet hätte - am wenigsten er selber.In dem Gespräch mit Athinea Andryszczak erzählt der Zisterzienserpater von seiner überwältigenden Begegnung mit Gott, von 14 Tagen auf dem "Schoß des himmlischen Vaters" und von dem Moment, der alles entschieden hat: "Wenn dir der Herr begegnet, was willst du da machen?"Ein außergewöhnliches Berufungszeugnis über einen evangelisch Getauften, dessen Leben durch Gottes Gegenwart radikal verwandelt wurde - von der Suche nach Erfüllung bis zum Leben als katholischer Mönch und Priester.'
