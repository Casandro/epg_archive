  description: 'Abschwellende Nasensprays helfen bei Erkältung schnell, können bei längerer Nutzung aber abhängig machen: Die Schleimhaut schwillt ohne Spray wieder an, Schutzfunktion leidet, Nasenbluten droht. Experten raten: nur 3 bis 7 Tage, dann Alternativen wie Meerwasserspray und schrittweise reduzieren. +++ Stephanskirchen schließt das Projekt Mit der Natur im Aufstieg ab und führt die Biodiversitätsmarke Stephanskirchen naturnah ein. Sieben Höfe wurden geprüft, fünf erhielten Zertifikate für naturnahe Landwirtschaft. Die Gemeinde will die Artenvielfalt weiter fördern, auch mit Partnern. +++ Juristin und Autorin Christina Clemm spricht bei den Literaturtagen in Bad Aibling über geschlechtsbezogene Gewalt, Hass und Ausgrenzung. Sie kritisiert Grenzen der Justiz und fordert mehr Unterstützung für Betroffene, damit Anzeigen und Verfahren nicht zur zusätzlichen Belastung werden.'
