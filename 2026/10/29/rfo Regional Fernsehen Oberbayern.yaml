  subtitle: Pferdesport Großer Preis von Gut Ising +++ Wetter für das Sendegebiet
  description: Beim Großen Preis von Gut Ising am Chiemsee (1,45 m) schafften 9 von 19 Startern das Stechen. Karen Boos Pegler siegte mit Honesty CTV Z fehlerfrei und schnell, Timo Beck wurde auf Conthalo Zweiter. Das viertägige Turnier bot Sport von Pony-Cup bis Klasse S bei freiem Eintritt. +++ Ein Hochdruckgebiet bringt Deutschland bis Halloween ruhiges, oft trübes Herbstwetter mit Nebel und Hochnebel. Donnerstag und Freitag ziehen schwache Fronten mit vielen Wolken und örtlichem Sprühregen durch, im Südwesten zeigt sich zeitweise die Sonne.
