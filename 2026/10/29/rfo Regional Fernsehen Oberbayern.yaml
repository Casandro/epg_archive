  subtitle: Die LINKE zu Leerstand in Rosenheim +++ B305 am Weinkaser für den Verkehr freigegeben +++ Neue Geschwindigkeitsbegrenzung auf der A8 +++ Flucht nach Autounfall +++ Kollege verhindert Haft
  description: In Rosenheim sorgt eine Aktion der Linken am leerstehenden Hotel Zum Goldenen Hirsch für neue Debatten über hohe Mieten und Wohnungsnot. Bundestagsabgeordneter Ates Gürpinar und Stadtrat Matthias Menold sprachen mit den neuen Eigentümern über Probleme der alten Bausubstanz. +++ Ein neues Galeriebauwerk schützt die B305 am Weinkaser im Berchtesgadener Land vor Lawinen und Steinschlag. Damit ist die Sanierung der Deutschen Alpenstraße zwischen Schneizlreuth und Antoniberg abgeschlossen. Der Bund investierte 50 Millionen Euro, nach sechs Jahren endet die Baustelle. +++ An der A8-Anschlussstelle Achenmühle gilt künftig Tempo 70. Das Landratsamt Rosenheim lässt heute neue Schilder aufstellen, nachdem es dort mehrere schwere Unfälle gab. Die Polizei stuft den Bereich als Unfallschwerpunkt ein, die Maßnahme soll die Sicherheit erhöhen. +++ In Wasserburg ist ein 20-jähriger Autofahrer nach einem Unfall geflüchtet. Am Brucktor streifte er ein entgegenkommendes Auto, hielt zunächst an und fuhr dann davon. Die Polizei ermittelte ihn später und stellte Alkohol- und Cannabis-Einfluss fest. Ihm droht der Führerscheinentzug. +++ Bei einer Kontrolle auf der A8 bei Holzkirchen stoppte die Autobahnpolizei einen überladenen Kleintransporter. Gegen den 35-jährigen Beifahrer lag wegen einer unbezahlten Geldstrafe ein Haftbefehl vor, doch ein Kollege zahlte. Der Fahrer erwartet ein Bußgeld.
