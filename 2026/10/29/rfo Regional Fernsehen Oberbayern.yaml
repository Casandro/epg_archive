  subtitle: 'Zweite Damen-Basketball-Bundesliga Süd: Wasserburgs Trainerin Walz und Neuzugang Schulz analysieren Sieg gegen Rhein-Main, Ausblick auf TS Jahn München, Verletzungen und Teamgeist.'
  description: |-
    In der Damen-Basketball-Bundesliga Süd baut Wasserburg seine erfolgreiche Serie aus. Beim Heimspiel gegen die Rhein-Main Baskets sicherte sich das Team einen Sieg mit 61 zu 50. Ausschlaggebend war eine starke Defensivleistung, besonders im dritten Viertel, das mit 19 zu 8 gewonnen wurde.

    Trotz einiger verletzungsbedingter Ausfälle hält Trainerin Patricia Walz die Mannschaft für gut aufgestellt. Die Spielerinnen bereiten sich nun auf das kommende Heimspiel gegen die TS Jahn München vor. Das Duell verspricht Spannung, nachdem Wasserburg erst vor wenigen Wochen im Pokal gegen München verloren hatte.

    Neu im Kader ist Franziska Schulz, die von vorherigen Stationen in Würzburg und Neustadt an der Weinstraße zum Team gestoßen ist. Schulz lobt den Zusammenhalt und die Atmosphäre beim Verein. Das Ziel für das Spiel am Samstag ist klar: Mit Konzentration und Teamgeist soll der nächste Sieg eingefahren werden.
