  title: Slovensko v obrazoch (21)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: História, pláže, cyklotúry aj raj pre hubárov - to všetko ponúka Záhorie. Vydajte sa s nami na Kunovskú priehradu I do bylinkovej záhrady na Holíčskom zámku? Keď sa na oblohe začnú kopiť búrkové mraky, berie Jaro Karak do rúk fotoaparát, aby zvečnil silu prírody. Loví búrky, blesky, polárnu žiaru a z prírodných úkazov chce ešte zvečniť guľový blesk a červeného trpaslíka... Knižnica v Bazilike svätého Jakuba v Levoči opäť ožíva. V 16. storočí ju založil farár, humanista a levočský rodák Ján Henkel. Knižnicu napokon zavreli a dlhé roky bola tzv. mŕtvou knižnicou. Dnes ju dobrovoľníci obnovili a sprístupnili pre verejnosť... Ešte pred 60 rokmi to bola dedina plná života. Osudnou sa jej stala neďaleká hlinikáreň. Dnes Horné Opatovce na mape nenájdete. Rodáci a pamätníci sa snažia zachovať aspoň kostol, ktorý z obce ostal. (2026)
  genre:
  - '35'
