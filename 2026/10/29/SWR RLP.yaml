  description: Revierleiter Girwidz` Besuch bei der bekannten Krimi-Schriftstellerin Lydia Fernét nimmt einen dramatischen Ausgang. Denn als er ihr Wohnzimmer betritt, findet er die Frau tot auf dem Boden liegend. Er selbst wird niedergeschlagen und der Täter kann unerkannt flüchten. Wer hat die Erfolgsautorin auf dem Gewissen? Die Ermittlungen führen Hubert und Staller in den Buchverlag von Claus Umbach. Der Verleger und die Assistentin der Toten berichten, wie beliebt Fernét mit ihrer Krimireihe war. Doch der Ruhm hatte seine Schattenseiten, denn seit einiger Zeit wurde sie von einem Stalker massiv belästigt.
