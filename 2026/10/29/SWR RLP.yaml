  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vor kurzem erst hat Andrea ihren Ehemann verloren. Mehr schlecht als recht versucht sie seither, ihren verschuldeten "Kunst und Trödel"-Laden alleine über Wasser zu halten. Ihrem Verehrer Ludwig zeigt die Witwe die kalte Schulter - bis sie in ihrem Kummer auch noch erfahren muss, dass ihr Göttergatte seit elf Jahren eine Geliebte hatte: Elisabeth von Greifenstein führt eine kleine Kunstbuchhandlung und sitzt ebenfalls auf einem Berg Schulden. Zunächst sind die beiden Frauen sich natürlich spinnefeind. Bis ihnen klar wird, dass sie nur gemeinsam eine Chance haben, ihre Geschäfte zu retten.'
