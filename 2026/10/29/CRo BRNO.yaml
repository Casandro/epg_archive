  title: Na pěknú notečku
  description: FS Velen z Boskovic slaví 75 let. Folklorní soubor Velen z Boskovic patří k nejstarším folklorním souborům v České republice. Od svého založení v roce 1951 uchovává a představuje lidové písně, tance a tradice Boskovicka, Malé Hané a Drahanské vrchoviny. Jaká je jeho historie, čím je zdejší folklor charakteristický a jak se daří předávat místní tradice dalším generacím? O tom si s členy souboru Velen povídala Barbora Turčanová.
