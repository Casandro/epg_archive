  description: |-
    Nach der Cube-Quest kehren die Spieler zurück ins Dorf. Alle haben großen Redebedarf. Es bilden sich kleinere Gruppen. Jeder versucht, die letzten Hinweise zu sortieren und die Frage zu beantworten, wem im Dorf noch zu trauen ist. Bei der vierten Dorfversammlung spitzt sich die Lage zu. Wird erneut jemand Unschuldiges eliminiert?
    Am nächsten Morgen werden die Verdächtigungen neu sortiert. Alle versuchen, ihren eigenen Namen reinzuwaschen und gleichzeitig die anderen unter Druck zu setzen. Wem kann man noch glauben? Dann geschieht etwas völlig Unerwartetes.
