  description: 'Nach dem Motto "Lebenslust zum Anziehen" präsentiert die bekannten Stylistin Astrid Rudolph das Lifestyle-Konzept VIA MILANO. Gezeigt wird elegante, feminine Mode inspiriert von den Laufstegen der italienischen Modemetropole Mailand - von Kleidungüber Schuhe bis zu den passenden Accessoires perfekt gestylt. Es handelt sich um ein Komplett-Sortiment für die modebewusste Frau: stilsicher, chic, trendaffin.'
