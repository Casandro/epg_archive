    Auf dem Wanderritt werden die Freundschaften auf eine harte Probe gestellt: Vanessa flirtet mit Jerry, und ihre Pferde fressen während einer unerlaubten Pause Giftefeu, Christian nimmt eine Abkürzung, die im Matsch endet, und Wendy, die sich über Jerry und Vanessa ärgert, macht sich auf die Suche nach dem verloren gegangen Christian. ...
