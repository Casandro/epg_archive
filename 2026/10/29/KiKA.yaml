    Wendys Adoptivschwester Sina wird durch die Geburtstagsvorbereitungen an ihre verstorbene Mutter erinnert. Die war sehr gut mit Heike befreundet, und zu jedem Geburtstag haben die Freundinnen gemeinsam Wildblumen gepflückt. Sina will diese Tradition aufrechterhalten und pflückt mit ihrer Freundin Juana auch Blumen. Als sie ihren Strauß zur Dekoration auf den Tisch stellen will, weist Wendy sie barsch zurück. Wendy merkt vor lauter Organisieren nicht, dass sie damit Sinas Gefühle verletzt. Erst Juana öffnet ihr die Augen. ...
