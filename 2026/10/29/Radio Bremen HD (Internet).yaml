- eventId: 657993
  start: 2026-10-29T00:10:00Z
  stop: 2026-10-29T00:40:00Z
  title: 'Die Nordreportage: Unter Norderney durch'
  subtitle: Buddeln für die Energiewende
  description: Wenn Ernst Fengler auf der Baustelle ist, passiert Entscheidendes. Er ist verantwortlich für vier Bohrungen unter Norderney hindurch, mitten im Nationalpark Niedersächsisches Wattenmeer. In die Bohrschächte müssen Kabelschutzrohre eingezogen werden, damit später Elektroleitungen den Windstrom von der offenen Nordsee ans Festland leiten können. Die Nationalparkverwaltung beäugt die Baustellen im Watt kritisch. Regelmäßig achten deren Mitarbeitenden vor Ort darauf, dass nichts Schädliches in die Umwelt gelangt. Ein schwieriger Spagat zwischen Hightech und Natur.
- eventId: 661898
  start: 2026-10-29T00:40:00Z
  stop: 2026-10-29T01:10:00Z
  title: 'Die Nordreportage: Operation Windrad-Bau'
  subtitle: Hightech und große Hürden
  description: '"Die Nordreportage" zeigt den Bau einer Windkraftanlage: vom massiven Betonturm bis zur finalen Montage der Rotorblätter und den Problemen, die auf dem Weg dorthin entstehen. Tonnenschwere Hightechteile in schwindelerregender Höhe: Der Bau von Windkrafträdern stellt Monteure und Bauleiter vor große Herausforderungen. Gerade in Zeiten der Energiewende. Und oft läuft es anders als geplant.'
- eventId: 663424
  start: 2026-10-29T01:10:00Z
  stop: 2026-10-29T01:45:00Z
  title: Die Nordreportage
  subtitle: Elektro statt Diesel - Neue Energie für Hamburgs Alsterschiffe
  description: Die "Eilbek" soll schnellstmöglich auf eine Werft nach Finkenwerder gebracht werden. Die Werft wird den alten Motor ausbauen und den neuen Batterieantrieb einbauen. Was sicher leichter klingt als getan. Denn häufig passieren unerwartete Dinge, wenn man so einen alten Kahn anpackt. Was sie jetzt schon wissen ist, dass es sehr eng wird im Bauch des Schiffes. Alle Komponenten unterzubringen, ist die größte Herausforderung. Die Passage auf der breiten Elbe zur Werft Cölln wird für den kleinen Alsterdampfer zur Reise in die Zukunft.
