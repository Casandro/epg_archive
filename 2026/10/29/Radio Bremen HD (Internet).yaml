  title: 'Die Nordreportage: 24 Stunden im Wunderland'
  subtitle: Die Miniwelt in der Speicherstadt
  description: "Das Miniatur Wunderland in der Speicherstadt in Hamburg ist eine der größten Touristenattraktionen Deutschlands. Die größte Modelleisenbahnlandschaft der Welt wächst seit ihrer Eröffnung im August 2001 ständig weiter und hat mittlerweile eine Fläche von 1.500 Quadratmetern erreicht. \nDer Film taucht ein in das geheimnisvolle Leben in den Kulissen des Miniaturwunderlands: die kleinen bewegten Szenerien, die Mitarbeiter hinter den Kulissen und der rege Betrieb in der Nacht."
