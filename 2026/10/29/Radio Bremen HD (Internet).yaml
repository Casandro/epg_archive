- eventId: 670125
  start: 2026-10-29T04:15:00Z
  stop: 2026-10-29T05:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Alice Brauner, Filmproduzentin'
  description: Die Filmproduzentin Alice Brauner setzt sich seit Jahren dafür ein, dass die Verbrechen des Nationalsozialismus zwischen 1933 und 1945 nicht in Vergessenheit geraten. Mit ihrem aktuellen Projekt, dem Kinofilm "Block 10", geht sie diesen Weg weiter voran. Erzählt wird die systematische Misshandlung und Ermordung Hunderter jüdischer Frauen und Männer während grausamer medizinischer Experimente im Konzentrationslager Auschwitz. Brauner selbst hat das Drehbuch geschrieben, sie versteht diese Arbeit auch als Vermächtnis ihrer verstorbenen Eltern, den Shoa-Überlebenden Maria und Artur Brauner.
- eventId: 670387
  start: 2026-10-29T05:00:00Z
  stop: 2026-10-29T05:20:00Z
  title: Sesamstraße
  description: Bert lässt sich allerhand einfallen, um den traurigen Ernie aufzuheitern. Aber ist Ernie wirklich traurig? Die "Cleveren Kekse" haben einen Einsatz am Strand. Dort will der Kekser Frau von Knackenberg den entspannten Sommertag am Strand verderben; aber nicht mit Krümel und seinen "Cleveren Keksen". Außerdem hilft Super Grobi 2.0 einer Kuh, die die Treppen vom Friseursalon nicht herunterkommt. Bei den "Unheimlich heimeligen Begegnungen" treffen die drei Musiker dieses mal auf die "Kugelrunden".
