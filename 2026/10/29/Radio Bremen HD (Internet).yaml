  title: Wir werden Camper!
  subtitle: Rudi & Petra auf Rügen
  description: "Rudi und Petra leben in Wacken in Schleswig-Hostein - Rudis Heimat. Petra hingegen ist auf Rügen geboren und aufgewachsen, und dort zieht es sie nun auch wieder hin! Zumindest für diesen Urlaub. \nDie ersten 20 Jahre ihres Lebens hat Petra auf Rügen verbracht, seitdem plagt sie das Heimweh nach der \"schönsten Insel Deutschlands\", wie sie sie nennt. Bei Familienbesuchen blieb bis jetzt nur wenig Zeit für einen richtigen Urlaub in der alten Heimat. Das soll dieses Mal anders werden. Petra möchte ihrem Rudi Orte ihrer Kindheit zeigen und mit ihm zusammen Neues entdecken."
