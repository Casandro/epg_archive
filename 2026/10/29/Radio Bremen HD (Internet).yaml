  title: In aller Freundschaft (337)
  subtitle: Einzelkämpfer
  description: Volker Reichenbach hat sich mit seiner seltenen, gutartigen Knochengeschwulst-Erkrankung arrangiert. Er führt mit seiner temperamentvollen Frau Birgit eine Apotheke. Auf ihr Drängen begibt er sich in die Sachsenklinik, um sich dort wieder einmal eines seiner lästigen Geschwülste entfernen zu lassen. Volker hat in den wiederholten Klinikaufenthalten zu Dr. Kathrin Globisch ein stärkeres Vertrauensverhältnis als zu seiner eigenen Frau entwickelt. Volker schließt seine Frau immer dann aus seinem Leben aus, wenn er akut an seiner Krankheit leidet. Birgit reagiert mit Eifersucht.
