  subtitle: Deutschland 2026
  description: Jess trifft sich für die Vermarktung ihres Romans mit der Presse-Agentin Sunny. Jess Privatleben soll in die Werbekampagne eingebunden werden. Jess möchte einerseits ihr Privatleben schützen, zugleich reizt sie aber die Aussicht, ihren Roman erfolgreich verkaufen zu können. Daniel sperrt sich, was Jess ärgert. Jonas, der eh emotional aufgewühlt ist, wirft Daniel vor, Jess zu bevormunden. Die Situation eskaliert und Jonas stößt Jess versehentlich gegen ein Bücherregal.
