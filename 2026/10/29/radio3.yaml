- eventId: 1540775
  start: 2026-10-29T21:00:00Z
  stop: 2026-10-29T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Henry Altmann'
  description: "Noblesse oblige\nDie Sängerin und Komponistin Fernanda von Sachsen\n\nJazzer adelten den Trompeter \"King\" Oliver einst zum König, den Pianisten Edward Kennedy Ellington zum \"Duke\" (Herzog) und \"Count\" Basie immerhin noch zum Grafen. Die Jazz-Mäzenatin Pannonica de Koenigswaerter erhielt den Titel \"Baroness\". Fernanda von Sachsen trägt als Ur-Ur-Enkelin des letzten sächsischen Königs von Haus aus den Namen \"Prinzessin von Sachsen Gessaphe\", ist aber auch im Jazz gerade auf gutem Weg zur \"Princess\". 2020 begann sie ein Gesangstudium an der Münchner Musikhochschule, kam schnell ins Landesjugendjazz-Orchester Bayern und erhielt ein Stipendium für das New Yorker Voices Vocal Camp. Dazu kamen 2025 der Bayerische Kunstförderpreis und ein Stipendium der Yehudi Menuhin Live Music Now-Stiftung. Aktuell absolviert die Tochter einer Opernsängerin ein Masterstudium in Hamburg. \nIhre Stimme ist klar, fast schon kernig, klassisch unterfüttert und von großem Umfang. Vor allem aber reicht sie inhaltlich weit über das \"Boy Meets Girl\"-Klischee altbekannter Jazz Standards hinaus. Die auch als Schauspielerin Tätige fügt eine gute Portion Bühnendramatik dazu, arbeitet gern mit Streichern, erinnerte - noblesse oblige - mit eigenen Arrangements an von den Nazis vertriebene deutsch-jüdische Komponisten. Da gibt es also einiges zu hören und zu erzählen vom Jazz aus adligem Haus.\n\nModeration: Henry Altmann"
