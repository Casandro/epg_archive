  title: Bares für Rares
  subtitle: Antike Schreibmaschine
  description: |-
    Eine antike Reiseschreibmaschine des Modells "Weltblick" der Marke Blickensderfer Manufactury Company ist im Pulheimer Walzwerk eingelangt. Hergestellt wurde sie um 1900. Dabei handelt es sich um eine kompakte Schreibmaschine mit einem Typenrad, die für den mobilen Einsatz konzipiert war. Die Schreibmaschine stammt aus den USA, wurde aber über einen deutschen Vertrieb in Köln verkauft. Momentan ist sie in einem altersentsprechend guten Zustand, weist aber einige kleinere Mängel auf. Kann der doch recht bescheidene Wunschpreis in der Expertise durch Sven Deutschmanek übertroffen werden? Wie taxiert der Experte die antike Reiseschreibmaschine? Und: Was werden die Händler und Händlerinnen im Pulheimer Walzwerk bieten? Kommt es zum erfolgreichen Verkauf? Es bleibt spannend!
