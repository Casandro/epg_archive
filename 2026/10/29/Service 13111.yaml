  title: Große Erfindungen
  subtitle: Computerspiele
  description: |-
    Spiele stehen seit der Entwicklung des ersten Computers im Zentrum neuer Technologien. Computerspiele bieten außergewöhnlichen Nervenkitzel, ermöglicht durch eine Revolution in der Elektronik und der Kunst. Dieser Wirtschaftssektor stellt mittlerweile ein über hundert Milliarden Dollar schweres Geschäft dar! Berühmte Sportler und Showstars stehen immer öfter Pate für diese bahnbrechende Erfindung, zu der einige der brillantesten Wissenschaftler den Anstoß gegeben haben. Die Erfindung der Computerspiele hat Geschichte geschrieben und stimuliert seither unsere Vorstellungskraft. Tatsache ist: ohne Spiele wären Computer nicht das, was sie heute sind.
    Dokumentarfilm, Vereinigtes Königreich 2019, R: Alex Seaborne
