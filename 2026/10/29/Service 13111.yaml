  title: Mama ist die Best(i)e
  subtitle: Episode 2
  description: "Glorias Rachefeldzug spitzt sich zu. Rund um Victors Tod gibt es viele Geheimnisse, alle scheinen etwas zu wissen oder verschwiegen zu haben. Gemeinsam mit ihren Verbündeten setzt Gloria (Adele Neuhauser) alle Beteiligten unter Druck. Während Maria (Edita Malovcic) das Vertrauen von Glorias undurchsichtigem Schwager Gaston (Andreas Lust) gewinnt, beobachtet Henny (Lara Mandoki) unbemerkt die Familie rund um Glorias Sohn Severin (Manuel Rubey) innerhalb der Villa. Als nahe dem Anwesen eine weitere Leiche gefunden wird, beginnt Kripo-Ermittlerin Regula Fritsch (Aglaia Szyszkowitz) erstmals an den Ereignissen vor zehn Jahren zu zweifeln. Saß Gloria Almeda tatsächlich unschuldig im Gefängnis? Und falls ja, wer steckt hinter dem Mord an Victor Almeda (Bernhard Schir)? \n\nNach einem Drehbuch von Erfolgsautor Uli Brée (\"Vorstadtweiber\") inszenierte Regisseurin Ute Wieland mit \"Mama ist die Best(i)e\" eine bitterböse Krimikomödie, die durch große Bilder und einen deutsch/österreichischen Star-Cast zu überzeugen weiß. Neben Adele Neuhauser in der Hauptrolle versammelt sich das Who ist Who der heimischen Film- und TV-Landschaft vor der Kamera: Manuel Rubey, Fanny Krausz, Bernhard Schir, Elena Uhlig, Roland Koch, Andreas Lust, Michou Friesz, Aglaia Szyszkowitz, Miriam Fussenegger, Edita Malovcic und Stefanie Stappenbeck - sie alle verwandeln mit ihrer großen Spielfreude den Krimi-Zweiteiler in ein packendes TV-Event.\nKrimi, Österreich 2025, R: Ute Wieland"
