  title: TM Wissen
  subtitle: Liebesglück per App - Machen Dating-Apps unglücklich?
  description: 'Dating-Apps machen das Kennenlernen scheinbar einfacher, doch viele Nutzer sind frustriert. Apps versprechen Nähe, führen aber oft zu Distanz. Sozialpsychologin Dr. Johanna L. Degen von der Europa-Universität Flensburg erforscht, wie Dating-Apps unser Wohlbefinden und Beziehungen beeinflussen. Die große Auswahl überfordert viele, statt glücklich zu machen. Helena Spindler setzt auf Alternativen und organisiert Slow-Dating-Abende, bei denen echte Begegnungen im Vordergrund stehen. Zwischen "Choice Overload", Ghosting und App-Müdigkeit bleibt die Frage: Liegt das wahre Glück offline? // Ohne Satelliten gäbe es kein GPS, keinen Wetterbericht und kein mobiles Internet. Doch der Platz im All wird knapp: Tausende Satelliten und Millionen Trümmerteile kreisen um die Erde. Das Wiener Start-up Gate Space will mit einem neuen Satellitentriebwerk Abhilfe schaffen. Daniel Kaiser und Moritz Novak haben einen Antrieb entwickelt, der Schub stufenlos reguliert und präzise Manöver ermöglicht - eine Weltneuheit. Nach jahrelanger Arbeit steht der entscheidende Test bevor. Bald könnte das Triebwerk von Cape Canaveral starten. // Die Fäden australischer Radnetzspinnen sind reißfester als Stahl, elastisch, antibakteriell und biologisch abbaubar - perfekte Eigenschaften für die Medizin. Biologin Dr. Sarah Strauß erforscht, wie Spinnenseide gewonnen und genutzt werden kann. Im Spiderlab liefern Spinnen das wertvolle Material. Chirurg Prof. Dr. Peter Vogt verwendet es, um Nerven zu verbinden und Zellwachstum anzuregen - ohne Abstoßungsreaktionen.Österreich 2025'
  genre:
  - '144'
  widescreen: true
