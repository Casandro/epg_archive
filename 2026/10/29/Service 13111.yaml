  description: 'Imke und Senad zeigen in der neuen Ausgabe von "Best Of" die besten Clips aus der Welt von Red Bull und darüber hinaus, dazu eine Studio-Challenge mit Körperspannung und Zielgenauigkeit. Thema diesmal: Slackline-Weltmeister Jaan Roose balanciert auf 1,9 Zentimeter schmalem Band 3.646 Meter über die Straße von Messina - 200 Meter über dem Meer. Doch reicht die Kraft bis zum letzten Meter nach Sizilien?.Österreich 2027'
