  title: Herzensmarken
  subtitle: Thalheimer Wasser
  description: 'Karli und Pascal bei Thalheimer Heilwasser. Im steirischen Murtal, an Österreichs ältestem Gesundbrunnen, verkosten die beiden direkt an der Quelle ein Wasser, dem nachgesagt wird, gute Laune zu machen. Betriebsleiter Roland Greul zeigt den Weg des Wassers, bis hin zu fruchtigen Limonaden und vollmundigem Bier. Hinauf geht''s zum jahrhundertealten Schloss Sauerbrunn, im 16. Jahrhundert zum Schutz der sieben Quellaustritte erbaut. In der Abfüllung entstehen bis zu 4.000 Flaschen pro Stunde, im Labor sorgt Corinna Grasser für gleichbleibende Qualität. Bei einer Blindverkostung erkennen Karli und Pascal den Unterschied zwischen Leitungswasser, Mineralwasser und dem intensiven Thalheimer sofort. Sogar Bier wird hier gebraut: mit patentiertem Verfahren und dem einzigen Heilwasser-Rezept der Welt. Doch kann das enthaltene Lithium wirklich nachweislich die Stimmung heben?Österreich 2026'
  widescreen: true
