  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Feuerinseln
  description: "Hawaii entstand aus vulkanischer Aktivität und erhob sich vor Ewigkeiten vom Meeresboden des Pazifiks. Die Inselkette zählt zu den entferntesten, außergewöhnlichsten und ökologisch vielfältigsten Lebensräumen auf der Erde. Doch könnten die Vulkane womöglich auch ein Portal für außerirdische Besucher sein, die zur Erde reisen? \nEinige der religiösen Anführer auf Hawaii sind der Meinung, dass die Hawaiianer von einer außerirdischen Zivilisation abstammen, den Akua. Noch vor der Christianisierung Hawaiis im Jahr 1820 glaubten die religiösen Anführer, dass sie selbst sowohl außerirdischer als auch menschlicher Abstammung seien. Auch die ausdrucksstarken Tiki-Figuren könnten ein Beweis für diese Theorie sein. Haben die Statuen einen besonderen Nutzen für die außerirdischen Besucher?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2019"
  genre:
  - '144'
  widescreen: true
