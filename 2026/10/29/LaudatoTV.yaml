  title: Čudesa, serija
  subtitle: Drama
  description: Svećenik koji je na zadatku Kongregacije za kauze svetih saznaje da je navodno čudo koje je istraživao bilo lažno. Planira se vratiti prvim letom u Vatikan, no spriječi ga molba tamošnjeg biskupa da što prije dođe u malen gradić Gariche, gdje se ljudi bune protiv načina rada cementare. Tu je zaposlena većina stanovnika koji tvrde da je njihov prosvjed vjerske prirode. Mole se i utječu svetom Judi Tadeju. Svećenik uvjerava mještane da se vjera i politika ne bi trebali miješati na takav način, ali nakon kraha sa zadnjim istraživanjem i on sam nađe se usred pravog čuda.
