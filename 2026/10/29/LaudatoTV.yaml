  title: Život na stijeni
  subtitle: Religijski
  description: U ovoj epizodi Života na stijeni gošća je dr. Stacy Trasancos. Kemičarka je s doktoratom i vanjska profesorica znanosti i teologije na ,,Holy Apostles koledžu, kao i na drugim učilištima. U ovoj emisiji će govoriti o vjeri i znanosti, te o odnosu vjere i znanosti i o tome kako ju je taj odnos obogatio u njezinu profesionalnom životu. Napisala je knjigu ,,Particles of Faith. Ovo je prva od dviju emisija s njom.
