  title: Superknjiga
  subtitle: Animirani
  description: Elin volonterski klub vodi djecu s posebnim potrebama u zabavni park, ali se automobil Eline mame pokvari i Ela zakasni na autobus. Mala djevojčica Matea odbila je ući u autobus i propustit će svu zabavu. Ela se osjeća odgovornom jer vjeruje da je stigla na vrijeme u školu, da bi uspjela uvjeriti Mateu da krene s ostalima. Frustrirana je i za sve krivi ,,loš trenutak. Superknjiga zatim šalje Elu, Luku i Gizma da upoznaju Isusa taman prije nego će podići Lazara iz mrtvih. Kada je Isus čuo da je Lazar bolestan, on iz nejasnih razloga odgađa odlazak u posjet svom prijatelju. A kada konačno dođe, Lazar je već mrtav. Isus, zbog te odgode, čini još veće čudo na Lazaru tako što ga podiže iz mrtvih. Ela tada shvaća da nas Bog ponekad zadržava da nekome pomognemo kako bi mogli napraviti još veće dobro. Božje vrijeme je uvijek savršeno. Ela razmišlja da je upravo to ono što treba učiniti s Mateom. Ela, Luka i Gizmo posjećuju sramežljivu djevojčicu i provedu s njom zabavan dan bez da su uopće morali ići u zabavni park.
