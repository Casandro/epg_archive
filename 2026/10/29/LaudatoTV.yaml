  description: 'U emisiji Otvori spomenar! gostuje vlč. Ivan Grbešić, duhovnik bogoslova u Nadbiskupskom bogoslovnom sjemeništu u Zagrebu. Svojim sjećanjima odvest će nas u dane djetinjstva koji su u ratom zahvaćenoj Petrinji bili vrlo teški i opasni, ali je osjetio kako ga čuva dragi Bog, što osjeća i danas, dok se kao svećenik trudi biti na raspolaganju drugima, jer kako kaže: "S Božjom ljubavi možemo sve". Vlč. Ivan će nam otkriti i svoja promišljanja o blagosti ali i okrutnosti u današnjem svijetu. Kako nam se bliži svetkovina Svih Svetih i Dušni dan, dok smo osobito u mislima sa našim najmilijima, velečasni Ivan će nam protumačiti i učestala pitanja koja sami sebi znamo postavljati, nadajući se ponovnom susretu u vječnosti s našim najmilijima.'
