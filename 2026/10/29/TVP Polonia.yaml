  description: |-
    Tytuł oryginalny: Messenger of the Truth
    US,PL, 2013
    Reżyseria: Tony Haines
    "Autorzy programu pokazują sytuację Polski za czasów księdza Jerzego Popiełuszki i przybliżają rolę duchownego w życiu rodaków oraz ich walce o wolność. Jego nauki przyciągały tłumy ludzi, którzy ignorowali zakazy władzy i przyjeżdżali z całej Polski do kościoła świętego Stanisława Kostki. Dzięki niemu w wielu Polakach obudziła się wiara w lepsze jutro i nadzieja na zbudowanie przyszłości na prawdzie oraz podstawowych prawach Bożych."
