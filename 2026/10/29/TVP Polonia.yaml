    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Mieszkańców rozlewiska bulwersuje budowa drogi. Jóźwiakowie jednak widzą w niej szansę na poprawę życia i planują zbudowanie stacji benzynowej. Ewa Stern, mówiąc o sukcesie fryzury Oresta, namawia Elwirę, by skłoniła go do udziału w mistrzostwach fryzjerstwa. Marysia wspomina momenty ze wspólnego życia z Kubą, a zakochany Krzysztof rozmyśla o niej. Oboje spotykają się przed próbą zespołu w kościele i dochodzi między nimi do sprzeczki. Mirka postanawia ich pogodzić ich dla dobra zespołu.
  ageRating: 12
  genre:
  - '23'
  subtitle: Budowa drogi bulwersuje mieszkańców rozlewiska. Tylko Jóźwiakowie dostrzegają szansę na poprawę życia. Małgosia pisze petycję przeciw budowie. Zakochany Krzysztof rozmyśla o Marysi.
