    "Klucz wileński" w reżyserii Artura Kalickiego to opowieść o wypędzonych mieszkańcach Wileńszczyzny, którzy po wojnie osiedli na Warmii i Mazurach. To bardzo osobisty zapis spotkań z ostatnimi z żyjących Wilniaków. Historia ludzi przesiedlonych na obcą im ziemię, którą wskazano jako nowe miejsce zamieszkania i która z biegiem czasu stała się ich nową ojczyzną. Odbudowywali to miejsce i przede wszystkim żyli z normalnymi problemami i radościami zwykłych ludzi stopniowo wrastając w tę krainę.
