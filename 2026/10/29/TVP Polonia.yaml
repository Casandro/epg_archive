    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Kasia mówi Czarkowi o problemach nękających mieszkańców rozlewiska i prosi go o wstawiennictwo u Szefa. Konrad wszystkie swoje siły angażuje w projekt drogi omijającej najpiękniejsze miejsca, w czym dzielnie pomaga mu Tomasz. Tymczasem Marysia kontynuuje romans z Krzysztofem. Małgosia dowiaduje się, że córka ją okłamuje. W międzyczasie Agata traci pracę i mieszkanie i zamieszkuje w domu Marysi razem z Kubą. Agata i Kuba spędzają razem wiele czasu i coraz lepiej dogadują się.
  ageRating: 12
