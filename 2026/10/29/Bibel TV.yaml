  title: Ein Hauch von Himmel
  subtitle: Die Verdammnis
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Schon lange ist die angehende Filmstudentin Stevie großer Fan von den Stummfilmen des Regisseurs Chandler Crowne, die in den Zwanzigerjahren ihren Höhepunkt hatten. Für ihre Projektarbeit will Stevie erforschen, warum die Filme des Regisseurs an einem Punkt pltzlich von frhlichen zu dsteren Botschaften wurden. Sie hat die Mglichkeit, ihn selbst zu fragen, denn der mittlerweile ber 100 Jahre alte Mann lebt zurckgezogen in seinem Haus. Fr Stevie ist dieses Projekt enorm wichtig, um einen Studienplatz zu bekommen, doch mit Chandler zu sprechen stellt sich als schwer heraus. Der verbitterte Mann weigert sich, Stevie die ganze Geschichte zu erzhlen, die hinter seiner Karriere steckt. Nicht nur fr Stevie ist es wichtig, die Wahrheit zu erfahren. Andrew wartet schon seit Jahren darauf, Chandler endlich mitnehmen zu knnen, doch Gott will, dass er vorher reinen Tisch mit seiner Vergangenheit macht - das Gesprch mit der Filmstudentin knnte die Lsung sein.'
