  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Film erzählt aus dem Leben des Ludwigsburger Religionspädagogen Professor Siegfried Zimmer und von seiner Leidenschaft für den Reformator Martin Luther. Gemeinsam mit seinem Mentee Mathias Drechsler besucht er wichtige Orte der Reformation wie die Magnuskirche und das Lutherdenkmal in Worms. Der Zuschauer erhält Einblicke in den Alltag von Zimmer und seine zahlreichen Predigtdienste, Vorträge und Projekte wie beispielsweise das Gospelhaus in Stuttgart. Im Fokus der Dokumentation steht der Begriff "Freiheit": Was bedeutet Befreiung von religiöser Enge heute? Wie hat Luther Freiheit verstanden und wie frei sind Christen im Umgang mit anderen Religionen wie beispielsweise dem Islam?'
