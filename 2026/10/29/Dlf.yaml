  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nSeit einigen Jahren haben sich in den sozialen Medien reichweitenstarke Accounts katholischer Geistlicher etabliert: Die Priestfluencer. Sie machen Sketche, singen, machen Sport, fotografieren ihr Essen und predigen zwischendurch. Und sie sind oft auffallend gutaussehend. Die Kirche bezeichnet sie als ihre ?digitalen Missionare?, Boulevard-Medien nennen sie ?Hot Priests?. Wie passen Heiligkeit und Mysterium mit Tanz-Videos zusammen?\n\nFilm ?Glaube?: Familiendrama über ein Mädchen, das ins Kloster gehen will\nEine 17-jährige Schülerin beschließt, nach dem Abitur ins Kloster zu gehen. Obwohl sie bereits eine katholische Schule besucht, ist das ihrer Familie nun doch zu viel. Der spanische Film LOS DOMINGOS erhielt die wichtigsten spanischen Filmpreise, löste öffentliche Debatten aus und regte einen lebhaften Austausch zwischen Katholiken und Nichtkatholiken an. Heute startet der Film unter dem Titel GLAUBE in Deutschland.\n\nRachel Reichhardt, die Thora-Schreiberin von São Paulo\nDas Herzstück jeder Synagoge ist die Thora, also die ersten fünf Bücher Mose aus dem Alten Testament, per Hand geschrieben auf ein eingerolltes Pergament. ..."
