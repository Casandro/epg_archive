  title: Velká pohádka
  description: Pramen temnoty. Pohádkový příběh, v němž bojuje proti sobě černá a bílá magie. A střet to bude vskutku nesmiřitelný. Na jedné straně stojí mladý hoch, na druhé, příšera ze záhrobí, která chce uchvátit jeho dívku. Začíná boj o její záchranu, boj, ve kterém nechybí odvaha, oběti, víra ani magické kouzlo starých rituálů. Napsal Vladimír Zajíc, režíroval Jaroslav Kodeš, natočeno v roce 2002. Účinkují Andrea Elsnerová, David Novotný, Jana Štěpánková, Rudolf Kubík a další.
