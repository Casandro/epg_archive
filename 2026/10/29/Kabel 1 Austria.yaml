  description: |-
    Während er als Gerichtszeichner für eine Zeitung einen Mordprozess begleitet, entwickelt Dumas ein wachsendes Interesse am Schicksal des Angeklagten Sid Cooper. Dieser soll seine Freundin in seinem Wagen erstochen haben, bestreitet die Tat jedoch vehement. Parallel dazu wird der kranke Privatdetektiv Jack von einer verzweifelten Mutter gebeten, ihre verschwundene Stieftochter Kathy zu finden. Bald stellen Jack und Dumas fest, dass die beiden Fälle miteinander verknüpft sind.

