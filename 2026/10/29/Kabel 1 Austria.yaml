    (WH vom Dienstag, 27.10.2026, 01:00 Uhr)
  description: |-
    Ein brutaler Killer versetzt Miami in Angst und Schrecken. Seine Opfer: kleine, wehrlose Mädchen. Für den Polizisten Andrew Blake wird der Fall zur persönlichen Hölle. Nach dem Tod seiner eigenen Tochter treibt ihn die Jagd nach dem Phantom an den Rand des Wahnsinns. Während Privatermittler Jack Costello die Ermittlungen aufnimmt, beginnen die Grenzen zwischen Jäger und Gejagtem auf gefährliche Weise zu verschwimmen.

