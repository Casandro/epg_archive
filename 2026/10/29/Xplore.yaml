  description: Lei Jonas erste Stütze war erst einmal eine gute Schule. Doch bevor er Laos verlässt, macht er eine bittere Erfahrung mit dem Tod eines Motorradfahrers. Jetzt steht er an der Grenze zu Kambodscha. Trotz schlechten Straßenverhältnissen besucht Lei freilebende Elefanten in Kambodschas Norden, Angkor Wat, den über 4000 Meter hohen Mount Kinabalu auf der Insel Borneo und "The Killing fields". DE 2016
