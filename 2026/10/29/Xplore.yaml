  title: Der Rhein von oben - Der fleißige Rhein
  subtitle: Der Rhein von oben - Der fleißige Rhein
  description: 'Die Folge führt mitten durch das Herz der rheinischen Industrie. Im Abschnitt zwischen Köln und Duisburg ist der Rhein ein breiter Transportweg, eine fließende Autobahn für die Binnenschiffe. Die Region wurde geprägt von Kohle, Stahl und Chemieparks, die sich verkehrsgünstig direkt am Fluss angesiedelt haben. Neben gigantischen Industrieanlagen liegen die Rheinauen, scheinbar unberührte Naturidylle. Der Dom bestimmt das Stadtbild von Köln, kein Gebäude darf höher sein als seine Türme. Gegenüber, am rechten Rheinufer, steht eine Currywurstbude. Eva Vosen und Ralf Jäger führen den Imbiss, der die Würstchen als festes Requisit auch an die Kommissare im Kölner "Tatort" verkauft. Im nah gelegenen Ruhrgebiet pulsiert der Strom als wirtschaftliche Lebensader, trotz Zechensterben und Niedergang der Montanindustrie. Binnenschiffer ist hier ein Beruf mit Zukunft und für Sarah Rusbült ein Traumjob. In ihrem Betrieb ist sie die erste Frau in der Ausbildung zur Binnenschifferin. In der Rheinaue Ehingen züchtet Elisabeth Nieskens Lamas und Alpakas. Für die Rheingegend eher untypische Tiere: Die Kamelart stammt aus Südamerika und wird wegen ihrer feinen Wolle geschätzt. Im Hafen von Duisburg entdeckt Rolf Köppen Graffiti an den Kais. Der Fotograf dokumentiert die kleinen und die großen Geschichten im Hafen und kommt mit seinem Boot auch in entlegenste Winkel. Auf der so genannten Schrottinsel wird Metall im großen Stil recycled. Ein echter Männerspielplatz zwischen Presse und Schredder, und mittendrin die Auszubildende Linda Eisermann. Völlig entgegengesetzt präsentiert sich die Rheinaue Walsum, ein Rückzugsgebiet für bedrohte Vogelarten und gestresste Großstädter. Direkt unter der Aue liegt ein großes Mineralwasservorkommen. Bis zu zwei Millionen Flaschen Mineralwasser täglich werden hier abgefüllt. Markus Heuvel wacht darüber, dass das Quellwasser von konstanter Qualität bleibt. DE 2013'
