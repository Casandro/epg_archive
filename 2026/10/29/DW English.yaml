  title: My therapist is AI
  subtitle: Artificial Intelligence and Psychotherapy
  description: 'Psychotherapist Umut Özdemir wants to find out whether AI chatbots can offer genuine help as therapists. To do so, he conducts an experiment: Will participants be able to distinguish between questions and answers from a therapist and those generated by AI? And which will they find more valuable? The film also shows people who are already using AI in this way. Meanwhile, psychologist Bertolt Meyer and psychotherapist Johanna Löchner discuss the psychological and societal challenges posed by this technology, and ethicist Judith Simon sheds light on the dangers and moral questions surrounding our relationship with artificial intelligence.'
