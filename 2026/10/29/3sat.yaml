  title: 'Fernweh: Karibik (7/7)'
  subtitle: Kuba
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    1000 Kilometer fährt Mona Vetsch durch das farbenprächtige Kuba, bis sie in Havanna - dem Ziel ihrer großen Karibikreise - ankommt.

    In der Schweinebucht erzählt ihr ein alter Kämpfer, wie es damals war, als die USA zur Invasion Kubas ansetzten. Auf Kuba lebt die Bienenelfe, der kleinste Vogel der Welt. Dieses Vögelchen ist etwa so groß wie eine Libelle. Es ist schwer zu finden.
    Moderation: Mona Vetsch

