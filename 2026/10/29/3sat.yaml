    Rote Erde, tiefblaues Meer: Wunderschön ist es auf La Gomera! Die Vulkaninsel im Atlantik besticht durch ihre raue Küste und ihre zum Teil noch unberührte Natur.

    Tamina Kallert durchquert den wildromantischen Archipel, um Land, Leute und ihre Traditionen kennenzulernen. Die werden auf La Gomera sorgfältig gepflegt - zum Beispiel der Hirtensprung, eine uralte Form der Fortbewegung im Gebirge.
