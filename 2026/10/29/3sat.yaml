  title: 'Fernweh: Karibik (2/7)'
  subtitle: Martinique, Guadeloupe, Grenada
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die französische Insel Martinique ist ein voll integrierter Teil der EU. Im Landesinnern gibt es sogar einen "Canton Suisse" - es ist der 27. Kanton der Schweiz.

    Seit einigen Jahren produziert eine kleine Kooperative auf der Karibikinsel Grenada Schokolade. Ihre dunkle Bioschokolade ist mittlerweile so gut, dass sie von einer englischen Jury mit Höchstlob ausgezeichnet wurde.
    Moderation: Mona Vetsch

    HD-Produktion
