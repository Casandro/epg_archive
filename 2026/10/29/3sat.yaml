  title: 'mareTV: Fuerteventura'
  subtitle: Die goldene Schöne der Kanaren
  description: |-
    Fuerteventuras Dünen und Vulkankegel glänzen wie Gold in der Sonne, die im Jahresdurchschnitt jeden Tag gut acht Stunden lang scheint.

    Die zweitgrößte Kanarische Insel liegt nur rund 120 Kilometer westlich von Afrika. Dort ist es extrem trocken und der Kampf ums Wasser hat eine lange Geschichte. Die 100 Jahre alten Windwasserpumpen sind ein Wahrzeichen der Insel und erleben eine Renaissance.
