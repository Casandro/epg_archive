  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Israel nach der Wahl - Gespräch mit Ofer Waldman zur Situation in Israel: Nach der Parlamentswahl beanspruchen sowohl Ministerpräsident Benjamin Netanjahu als auch sein Herausforderer Gadi Eisenkot die Regierungsbildung.

    "Die Blauen Reiterinnen" in Wiesbaden - Mit der Ausstellung "Die Blauen Reiterinnen" in Wiesbaden sollen Frauen in den Fokus gerückt werden, die den deutschen Expressionismus mitgeprägt haben.

    ARD-Serie "Breitscheidplatz 19/12" - Vor zehn Jahren, am 19. Dezember 2016, verübt der Tunesier Anis Amri im Namen des islamischen Staates einen Terroranschlag auf den Berliner Weihnachtsmarkt. 13 Menschen sterben, über 60 werden verletzt. Die ARD-Serie "Breitscheidplatz 19/12" erzählt fiktional von den Monaten vor dem Anschlag und rekonstruiert das Geschehen im Vorfeld. "Kulturzeit" spricht mit Schauspielerin Bayan Layla.

    George Harrison als Fotograf - Dass der "stille Beatle" auch mit der Kamera umgehen konnte, zeigt ein neuer Fotoband mit dem Titel "The Third Eye", kuratiert von seiner Witwe Olivia Harrison. Zu sehen sind noch nie veröffentlichte Fotos, die Harrison während seiner Reisen mit den Beatles rund um die Welt gemacht hat.

    Moderation: Lilian Moschen
    HD-Produktion
