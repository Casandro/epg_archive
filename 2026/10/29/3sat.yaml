  title: We are all Detroit - Bochum, eine Stadt im Wandel
  subtitle: Dokumentarfilm von Ulrike Franke und Michael Loeken,
  description: |-
    "We Are All Detroit - Bochum, eine Stadt im Wandel" zeigt die brisanten Entwicklungen zweier Städte auf verschiedenen Kontinenten und die Auswirkungen auf die dort lebenden Menschen.

    Zwischen den beiden so unterschiedlichen Städten - Bochum, der Stadt im Ruhrgebiet, und Detroit, der Stadt im Rust Belt - gibt es eine gewichtige Gemeinsamkeit: Die Autoindustrie hat sowohl Detroit als auch Bochum geprägt.
