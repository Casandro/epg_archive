  title: freizeit
  subtitle: Schmidt Max und der deutsche Rotwein
  description: |-
    Dass wir in Deutschland großartige Weißweine haben, ist mittlerweile unbestritten in der Wein-Welt. Riesling und Silvaner erobern die Weinkarten von Berlin bis Bangkok. Aber Rotwein?

    Noch vor 20 Jahren hat man mitleidig gelächelt, wenn sich deutsche Winzer in dieser Disziplin versuchten. Vor der Klimakatastrophe, die jetzt "Klimaveränderung" heißt, wurden die Trauben oft nicht reif.
