  title: Vietnam - Krieg ohne Fronten - Der kalte Krieg
  subtitle: Vietnam - Krieg ohne Fronten - Der kalte Krieg
  description: Moderne Kriege, die die Welt erschütterten - "Wir werden dieses gottverdammte Land dem Erdboden gleichmachen", so Richard Nixon am 2. Juni 1971. Die Wut des US-Präsidenten gilt dem kleinen Land Vietnam, wo die USA seit 1964 in einen aufreibenden Abnutzungskrieg verwickelt sind. Zu keiner anderen Zeit und an keinem anderen Ort wurden derart viele Vernichtungsmittel eingesetzt wie in Vietnam, wo US-Kampfflugzeuge mehr Bomben abwarfen als auf allen Schauplätzen des Zweiten Weltkrieges zusammen.
  genre:
  - '129'
