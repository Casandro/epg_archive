  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Hiroshima
  description: Die letzten Stunden des Zweiten Weltkrieges veränderten den Lauf der Geschichte und das Leben von über 130.000 Menschen. Der Krieg zwischen Amerika und Japan wurde immer brutaler, eine Kapitulation schien für beide Seiten undenkbar. Zum ersten und bislang einzigen Mal warfen die USA im August 1945 zwei Atombomben über Japan ab. Noch heute streiten Historiker darüber, wer den Pazifikkrieg zu verantworten hatte.
