  title: Coast Guard Alaska
  subtitle: Familienangelegenheiten
  description: Ein Kleinkind schwebt in akuter Lebensgefahr und benötigt dringend medizinische Hilfe. Parallel dazu befindet sich eine verletzte Frau auf einem Fischereiboot, das keine andere Möglichkeit zur Evakuierung bietet als den Luftweg. Beide Notfälle erfordern schnelles Handeln und den Einsatz geeigneter Rettungsmittel, um Leben zu retten und weitere Komplikationen zu verhindern.
  widescreen: true
