  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Befreiung von Buchenwald
  description: 'Die Niederlage Deutschlands im Ersten Weltkrieg ermöglichte Hitler, einen Sündenbock zu kreieren: die Juden. Als 1944 die ersten Lager von den Russen befreit wurden, weigerten sich Weltmedien, die grausamen Bilder zu veröffentlichen. Die Geschichten über Gaskammern und Öfen seien sowjetische Propaganda. Erst im April 1945, als die Amerikaner das Lager Buchenwald befreiten, wurde dem Rest der Welt klar, was das Hitler-Regime getan hatte.'
