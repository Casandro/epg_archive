  title: Vietnam - Krieg ohne Fronten - Im Bombenhagel
  subtitle: Vietnam - Krieg ohne Fronten - Im Bombenhagel
  description: 'Zu keiner anderen Zeit und an keinem anderen Ort wurden derart viele Vernichtungsmittel eingesetzt wie im Vietnamkrieg. Die Dokumentation zeigt die Hintergründe der Tragödie in Südostasien. Es ist die Zeit des Kalten Krieges und die amerikanischen Soldaten haben ein klares Ziel: den Vormarsch des Kommunismus zu stoppen.'
