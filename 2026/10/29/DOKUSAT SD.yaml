- eventId: 1003234
  start: 2026-10-29T16:20:00Z
  stop: 2026-10-29T17:30:00Z
  title: Helden der Evolution - Großkatzen
  description: 'Katzenartige Raubtiere sind ebenso geschmeidige wie effektive Jäger, die in vielen Naturlandschaften der Erde an der Spitze der Nahrungskette stehen. "Helden der Evolution" konzentriert sich auf die eindrucksvollsten unter ihnen: Tiger, Löwen, Leoparden und Jaguare. In packenden Bildern zeigt die Reihe diese imposanten Großkatzen in Aktion. Dabei wird die ungeheure Kraft dieser Tiere deutlich, die sie mit Taktik und enormer Beweglichkeit einsetzen, um im täglichen Kampf ums Dasein zu bestehen.'
  widescreen: true
  subtitle: Helden der Evolution - Großkatzen
