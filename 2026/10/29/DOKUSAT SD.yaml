  title: Die wilden Flüsse Afrikas - Limpopo
  description: Der Limpopo bildet die Lebensader einer ganzen Region. Gemächlich fließt er entlang der Grenzen Südafrikas zu Botswana und Simbabwe, bevor er sich in Mosambik seinen Weg zur Mündung in den Indischen Ozean bahnt. Am Ende seiner Reise hat er 1.750 Kilometer zurückgelegt. Dabei ist der Limpopo die meiste Zeit des Jahres ein verborgener Schatz, der sich nur zur Regenzeit an der Oberfläche zeigt. Dann taucht er die umliegende Landschaft in ein sattes Grün und spendet Nahrung in Hülle und Fülle...
