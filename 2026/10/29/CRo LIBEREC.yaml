- eventId: 766728
  start: 2026-10-29T10:05:00Z
  stop: 2026-10-29T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Na kafíčko s paní eS. Herečka Divadla F. X. Šaldy Jana Hejret Vojtková. Jana Hejret Vojtková je nejen známou herečkou libereckého divadla, ale také režisérkou a uměleckou vedoucí Divadla malých forem nazvaného HáeSko. To navazuje na činnost Hereckého studia Divadla F. X. Šaldy. V čem je výjimečné a o čem pojednává chystaný festival nazvaný Na kafíčko s paní eS, nejen to se dozvíme hodinu před polednem.'
