  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Shrink 01995 -Kunstperformance beim Silbersalzfestival\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1976 Erich Honecker wird zum Staatsratsvorsitzenden gewählt\nDen politisch einflussreichsten Posten als SED-Generalsekretär hat Erich Honecker schon. Nun wird er auch noch zum Staatsratsvorsitzenden gewählt.\nVon Finny Anton.\n\n* 06:50 Uhr - DOK Leipzig - Das Festivalteam empfiehlt: Detention\n\n* 07:10 Uhr - Ausstellungseröffnung \"Schichtwechsel\" in den Kunstsammlungen\n\n* 07:20 Uhr - Lachmesse\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Kulturtipp: Ausstellung in Erfurt \n\n* 08:10 Uhr - Die Filme der Woche\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Goethehaus vor langer Schließung\n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Carsten Tesch"
