  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag \n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Der Stichtag: 1976 Erich Honecker wird zum Staatsratsvorsitzenden gewählt\nDen politisch einflussreichsten Posten als SED-Generalsekretär hat Erich Honecker schon. Nun wird er auch noch zum Staatsratsvorsitzenden gewählt.\nVon Finny Anton.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 10:50 Uhr - Das Gedicht: nö von Arne Rautenberg\nEs liest der Autor.\nDichter, Künstler, Sprachartist oder Wortakrobat? Viele Berufsbezeichnungen könnte man ihm zuschreiben, eines aber ist er ganz sicher: Lyriker. Arne Rautenberg schreibt vor allem Gedichte, das macht der 1967 in Kiel geborene und preisgekrönte Schriftsteller seit etwa 40 Jahren. Und arbeitet auch im sogenannten bildkünstlerischen Bereich - an Collagen, visueller Poesie und großformatigen Schrift-Installationen. \nHören Sie Arne Rautenberg mit einem Text aus seinem Band \"Betrunkene Wälder\".\n\n* 11:15 Uhr - Feuilleton\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 11:40 Uhr - Woods Of Birnam LIVE\nChristian Friedel ist mit seiner Band, den Woods Of Birnam, gerade wieder im Sendegebiet unterwegs\nDonnerstag (29.10.) in Magdeburg und Samstag (31.10.) in Chemnitz\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Annett Mautner"
