  title: 'Café Continental: Geschichten und Plaudereien an Marmortischen (Folge 2 von 2)'
  subtitle: von Bernd-Lutz Lange
  description: "Das Café Continental ist der große Treffpunkt dieser Stadt. Jung und Alt kommen hier zusammen, Einheimische und Fremde, Eilige und Leute, die den halben Tag am Kaffeehaus-Tisch verbringen. Für Richard Dumont, eben noch Student, tut sich eine ganze Welt auf. Mit den Freunden am Malerstammtisch diskutiert er leidenschaftlich über die wechselnden politischen Großwetterlagen, über geheimste Neuigkeiten und allerprivateste Liebesangelegenheiten. \n\nDer Pianist Ferdinand Barnowsky nimmt ihn mit auf eine Reise in die goldenen Jahre des Berliner Kabaretts der zwanziger Jahre, ins Romanische Café und zur Premiere der Dreigroschenoper. Über die Jahre lernt er immer neue interessante Leute kennen und erfährt ihre staunenswerten Familiengeschichten. Und immer wieder kommen jüdische Schicksale in der Stadt zur Sprache.\n\nBernd-Lutz Lange hat in diesem Kaffeehaus einen literarischen Ort gefunden, mit dem er in Geschichten eigentlich die Geschichte dieses Landes ab Mitte der sechziger Jahre bis heute erzählt - und nicht zuletzt vielleicht auch die eigene.\n\nAufzeichnung einer öffentlichen Veranstaltung im Tom-Pauls-Theater in Pirna am 22.11.2025.\n\nProduktion: MDR 2025\n\nMitwirkende: \nBernd-Lutz Lange"
