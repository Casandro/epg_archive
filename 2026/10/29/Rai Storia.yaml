    he cosa resta oggi dell'Impero britannico? Dalla sua trasformazione nasce il Commonwealth moderno, una comunità che riunisce 56 Stati e quasi un terzo della popolazione mondiale. Dai primi Dominions alla Dichiarazione di Londra del 1949, dal ruolo fondamentale di Elisabetta II al Sudafrica dell'apartheid, fino a Margaret Thatcher e alla guerra delle Falkland-Malvine. Una storia di potere, rotture e compromessi, ma anche della capacità di trasformare antichi legami coloniali in nuove relazioni tra Stati indipendenti. Per capire come il Commonwealth sia riuscito a sopravvivere all'Impero da cui era nato e perché, ancora oggi, rimanga così difficile da definire. In studio con Paolo Mieli, la prof.ssa Valentina Villa. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio la prof.ssa Valentina Villa Con la partecipazione di Matteo Marroni
