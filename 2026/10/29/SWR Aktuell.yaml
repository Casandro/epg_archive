  title: SWR Kultur - Das Wissen
  subtitle: Wunschkind Mädchen - Was hinter Gender Disappointment steckt
  description: |-
    Von Marisa Gierlinger
    Hauptsache gesund - und bitte ein Mädchen. In sozialen Medien und Elternforen äußern immer mehr werdende Eltern den expliziten Wunsch nach einer Tochter. Oder die Enttäuschung darüber, dass es (wieder) ein Junge wird. Das Wunschgeschlecht scheint sich in Richtung Mädchen zu verschieben, worauf auch erste internationale Studien hinweisen. Dahinter steckt mehr als die Sorge vor toxischer Männlichkeit. Wo der "männliche Stammhalter" überholt ist, werden Töchter beliebter. Aber nicht, weil alte Rollenbilder ausgedient hätten. Im Gegenteil zeigt es, wie sehr sich die Vorstellung von schwierigen, wilden Jungs und angepassten, braven Mädchen immer noch hält.
