  description: "14:00\nQuarks: Mal angenommen... der tagesschau Zukunftspodcast\nNiemand lässt sich mehr impfen - was dann? \nWelche Krankheiten würden sich schnell verbreiten, welche brauchen länger? Wie würde die Welt nach einem, fünf oder 15 Jahren aussehen? \nHosts: Julia Nestlen & Samira El Hattab \nhttps://www.ardaudiothek.de/sendung/der-tagesschau-zukunfts-podcast-mal-angenommen/71374876/\n\n14:30\nSWR1 Leute mit Wolfgang Knüll | Facharzt für Allgemeinmedizin \nNahtoderfahrungen und was die Medizin darüber weiß\nWas passiert mit uns, wenn das Herz aufhört zu schlagen? \nSind Nahtoderfahrungen bloß Illusionen eines sterbenden Gehirns, oder öffnet sich das Tor zu einer erweiterten Realität?\nFragen rund um Nahtoderfahrungen geht der Mediziner Wolfgang Knüll nach. Ein prägendes Erlebnis mit einem reanimierten Patienten vor über 45 Jahren ließ ihn nicht mehr los: Der ältere Herr war nach seinem Herzstillstand keineswegs dankbar, sondern mürrisch - er wollte zurück in dieses \"wunderschöne Licht\", forderte er.\nSeit diesem Tag trägt Dr. Knüll weltweit wissenschaftliche Fakten und Fallstudien zusammen. In seinem aktuellen Werk \"Über den Tod hinaus - Warum wir unsterblich sind\" geht er der fundamentalen Frage nach, ob unser Bewusstsein zwingend an die Funktionen unseres Gehirns gekoppelt ist - oder ob es unabhängig davon existieren kann. Wer sich auf Knülls Lektüre einlässt, wird sein Verständnis von Bewusstsein - und auch vom Leben selbst - nachhaltig verändern.\nModeration: Jens Wolters\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
