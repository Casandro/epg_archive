  description: Woher nehmen, wenn nicht vergesellschaften? Nach diesem Motto will Die Linke in Berlin der Wohnungsnot zu Leibe rücken. Eine von ihr geführte Regierung würde Unternehmen mit mehr als 10.000 Wohnungen einen Teil ihres Bestands abkaufen, und zwar unterhalb des Verkehrswertes. Nach Artikel 15 des Grundgesetzes können Grund und Boden, Naturschätze und Produktionsmittel in Gemeineigentum überführt werden. Voraussetzung dafür ist ein Gesetz, das Art und Ausmaß der Entschädigung regelt.
