  subtitle: Životní příběh Františka Podstatzkého-Lichtensteina
  description: 'Autor: Iva Horká; Interpret: Hana Sklenářová, Jaroslav Pavlas, Pavla Krejzlová, Iva Horká; Premiéra: 29.10.2026 * Moderátorka Iva Horká není jen ?tazatelka“ ? je také pamětnicí začátku spolupráce s Františkem Podstatzkým-Lichtensteinem. Rozhovor s jejími hosty z Nadačního fondu Františka Podstatzkého a bývalou starostkou Netína proto může mít podobu společné vzpomínky: jaký byl jako člověk, co ho formovalo, proč chtěl pomáhat a jak se z netínských koncerte tato výroční byla i důvodem k natočení tohoto pořadu.'
