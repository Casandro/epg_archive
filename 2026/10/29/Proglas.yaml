  title: Na stole je téma
  subtitle: Životní příběh Františka Podstatzkého-Lichtensteina
  description: 'Autor: Iva Horká; Interpret: Hana Sklenářová, Jaroslav Pavlas, Pavla Krejzlová, Iva Horká * Moderátorka Iva Horká není jen ?tazatelka“ ? je také pamětnicí začátku spolupráce s Františkem Podstatzkým-Lichtensteinem. Rozhovor s jejími hosty z Nadačního fondu Františka Podstatzkého a bývalou starostkou Netína proto může mít podobu společné vzpomínky: jaký byl jako člověk, co ho formovalo, proč chtěl pomáhat a jak se z netínských koncertů od roku 2006 postupně zrodila myšlenka širší dobročinnosti a nakonec nadačního fondu. V roce 2026 si připomínáme 20 let od prvního koncertu,10 let od vzniku nadačního fondu a zároveň i 10 let od úmrtní F. Podstatzkého. A právě tato výroční byla i důvodem k natočení tohoto pořadu.'
