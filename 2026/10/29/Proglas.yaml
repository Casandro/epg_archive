  title: Na stole je téma
  subtitle: Monarchie před republikami ? dokument
  description: 'Autor: Jan Hanák; Interpret: Sandor Habsburg-Lothringen, Herta-Margarete Habsburg-Lothringen, Děpold Czernin, Mojmír Jeřábek; Premiéra: 28.10.2022 * O československém vzniku a rakouském pádu. Dokument, který snad nabízí trochu odlišný úhel pohledu, než je u nás zvykem, pokud jde o okolnosti vzniku Československé republiky, ve vztahu k následujícímu století. Napovědět může to, že se na tyto zlomové události nebudeme dívat z Prahy, nýbrž z Vídně a hlavními vypravěči budou příslušníci bývalého panovnického domu. Účinkují: Sandor Habsburg-Lothringen, Herta-Margarete Habsburg-Lothringen, Děpold Czernin, Mojmír Jeřábek a autor dokumentu Jan Hanák.'
