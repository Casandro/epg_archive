  title: Jak se vám líbí
  subtitle: Halgató, píseň mojí duše
  description: 'Autor: Jannis Moras; Interpret: Oto Bunda * Oto Bunda, romský hudebník s kořeny na východním Slovensku, připravil dokumentární film Halgató: Píseň mojí duše, první celovečerní film věnovaný hudebnímu žánru halgató. Jedná se o pomalý a procítěný způsob zpěvu, který prostřednictvím skutečných příběhů vyjadřuje hluboké emoce, například ztrátu, lásku nebo bolest. Oto Bunda patří k poslední generaci hudebníků, kteří se halgató učili přímo od svých předků, a film proto vnímá jako způsob, jak tuto tradici zachovat pro další generace. Více prozradí v rozhovoru s Jannisem Morasem pro pořad Jak se vám líbí. '
  genre:
  - '96'
