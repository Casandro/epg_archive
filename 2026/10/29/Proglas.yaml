  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Hommage to Chuck Berry
  description: 'Autor a interpret: Josef Javůrek; Premiéra: 26.10.2026 * Charles Edward Anderson ?Chuck“ Berry (*18. října 1926, +18.3. 2017) byl americký kytarista, zpěvák a skladatel, jeden z výrazných průkopníků rocknrollu. S písněmi Maybellene (1955), Roll Over Beethoven (1956), Rock And Roll Music (1957) nebo Johnny B. Goode (1958) rozvinul z původního stylu rhythm and blues hlavní prvky rock and rollu s texty a s kytarovými sóly, která měla velký vliv na pozdější rozvoj rockové hudby. V roce 1985 byl uveden do Blues Hall Of Fame a následující rok byl jedním z prvních hudebníků, kteří byli uvedeni do RocknRoll Hall Of Fame. Do rock and rollu přispěl nejen zvukem, ale i životním postojem. Berry byl vyhlášen časopisem Rolling Stone šestým nejlepším kytaristou všech dob. Medailon výjimečného hudebníka vám nabídne Josef Javůrek.[čak bery]'
