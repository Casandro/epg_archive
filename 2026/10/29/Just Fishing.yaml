  title: Angeln mit der Feeder-Rute
  subtitle: Angeln mit der Feeder-Rute
  description: Der Elbe-Lübeck-Kanal im Norden von Deutschland lockt mit einer bunten Auswahl an diversen Zielfischen. Darunter finden sich Brassen, Rotaugen, Karpfen und in ganz seltenen Fällen auch mal Schleien. Elmar Elfers traf sich mit Frerk Petersen und schaute dem Friedfisch-Profi über die Schulter. Denn der begeisterte Angler liebt das Fischen mit verschiedenen Methoden auf Weißfische & Co. Und eine davon ist das Angeln mit der Feeder-Rute. Frerk gibt einen Einblick in die richtige Rutenwahl, die passende Rolle, die optimale Schnur und natürlich das Vorfach und die Schlaufenmontage. Interessantes zum Thema Köder fehlt genauso wenig wie die Erklärung zum Anlegen eines Futterplatzes. Vorher geht es jedoch ans Mischen der Anfütterung. Hier mag er es einfach. Sein Futter besteht nicht aus vielen verschiedenen Zutaten. Einfach fängt eben auch. Maden, Wurm oder Mais? Welche Köder er nimmt, erfährt der Zuschauer ebenfalls. Beim Angeln mit der Feeder-Rute kommen feine Spitzen zum Einsatz, die zuverlässig jeden Biss anzeigen. Auch hier trumpft der Friedfisch-Experte mit seinem Wissen auf. Im Laufe des Angeltages fängt er verschiedene Fischarten und geht immer wieder auf seine Montage, die Vorfachlänge und den gewählten Schnurdurchmesser ein. Wer mit der Feeder-Rute am Wasser unterwegs ist, wird nicht lange ohne Biss bleiben. Denn der Köder liegt immer in unmittelbarer Nähe des Lockfutters. Dies wird in einem Futterkorb zum Grund transportiert und ist ebenfalls Thema in seinen Erklärungen. Wer mit den Tipps von Frerk zum Angeln mit der Feeder-Rute startet, ist bestens vorbereitet und wird seine Fische fangen! DE 2024
