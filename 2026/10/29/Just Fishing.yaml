  title: Topwater Soft- vs. Hardbait
  subtitle: Topwater Soft- vs. Hardbait
  description: Zusammen mit Vonso von Euw von Bullseye Fishing haben wir das ultimative Experiment gemacht und sind der Frage auf den Grund gegangen, welcher Ködertyp mehr Fische ans Band bringt, Topwater Soft- oder Hardbait. Hierzu ging es auf Hechte in einem stark verkrauteten Gewässer. Die Fische hatten großen Hunger und haben sich mitten in den Seerosenfeldern unsere Köder reingehauen, als ob es kein Morgen gäbe. Unzählige Attacken, Bugwellen, die auf die Köder zurasten und jede Menge gefangene Fische machten dieses Battle zu einem unvergesslichen Angelerlebnis. Wer am Schluss die Nase vorn hatte und welcher Angler mehr gefangen hat, erfahrt ihr natürlich im Film. DE 2022
