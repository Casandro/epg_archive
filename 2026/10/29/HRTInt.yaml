  title: Kod nas doma
  subtitle: ' '
  description: Od legendarnih četvrtaka u zagrebačkom Saloonu do slavljeničkog koncerta u Lisinskom! Između je stalo više od 30 godina glazbe, suradnje s najvećim imenima domaće scene i niz hitova koje pjevaju različite generacije. Oni su Songkillersi, a s nama će biti njihov frontmen Željko Banić Bane! Mlada Međimurka i školska psihologinja Sara Bodulica nedavno se našla u društvu dizajnera, modela i ljudi iz modne industrije na pariškom tjednu mode, gdje je predstavila svoju kolekciju Emotional Alchemy i vlastiti brend SABOA. Sara dolazi u studio i ispričat će nam sve o tome. Obilježavamo Svjetski dan animiranog filma! Na današnji dan 1892. godine u Parizu je održana prva javna projekcija animiranih slika. Otad je animacija prošla nevjerojatan put, a o tome ćemo više s našim filmskim znalcem Boškom Piculom! Voditeljica Iva Šulentić Redateljica Vesna Luković Žarn Urednica i scenaristica Eli Lazarova Sladić
- eventId: 728427
  start: 2026-10-29T11:09:00Z
  stop: 2026-10-29T11:54:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
