  title: Knjiga ili život
  subtitle: ' '
  description: Emisiju započinjemo posvetom pjesniku Danijelu Dragojeviću. Irena Matijašević u novoj knjizi "Ljetni dan", čiji naslov priziva Dragojevićevu pjesmu iz njegove posljednje objavljene zbirke, ispisuje osebujan hommage sugovorniku i mentoru koji je utjecao na njezino profesionalno oblikovanje kao urednice kultnih radijskih emisija Poezija naglas i Riječi i riječi. Na početku romana "Moja dota" prkosna djevojčica Nela nakon prvih velikih batina koje je dobila od barbe počinje se kaliti u zanimanju osvetnice perom pa su te batine bile njen tečaj profesionalne orijentacije. Djevojčica ljeta provodi kod bake na Korčuli a uz njene priče i pjesme, kao babina dota koju nosi kroz godine sa sobom, ostao joj je ponos na bakine doživljaje iz El Shatta. A onda je djevojčica postala tinejdžerka koja u romanu "Pravi život" pronalazi svoje mjesto među splitskim alternativcima, kroz život sa samohranom majkom u skučenom unajmljenom stanu osvještava socijalne nepravde kasnog socijalizma i polako gradi gay identitet dok se vrijednosti društva u kojem je odrastala jedna za drugom ruše. Autorica ovih romana je Nora Verde što je književno ime naše gošće Antonele Marušić.
