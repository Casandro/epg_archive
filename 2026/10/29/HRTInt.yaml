  description: 'Nikad kraja ljudskoj kreativnosti: Svijet znanosti vodi vas na najveći hrvatski sajam inovacija koji je okupio više od 300 sudionika. Mogu li čimpanze govoriti? Uči li umjetna inteligencija jezik brže od djece? S dr. sc. Goranom Šimićem i dr. sc. Kristinom Štrkalj Despot razgovaramo o razvoju misli, govora i jezika. Vodimo vas u Južnoafričku Republiku gdje u proizvodnji poznatih vina sudjeluju - patke.  Na kraju doznajte zašto je Winnie Pooh i u 21. stoljeću jedan od omiljenih dječjih fiktivnih likova.'
