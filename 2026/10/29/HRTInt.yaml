  title: Luda kuća (3), humoristična serija (32/34)
  subtitle: ' '
  description: 'Pospremačica Verica ilegalno je u Slavkovom stanu, jer ju je gazdarica izbacila zbog pušenja. Matildina naivnost i Đurina plemenitost pomažu Verici da se osjeća sigurno i zaštićeno. Božena traži način kako popraviti krov koji prokišnjava, a Zdenko kako izbjeći štetu koju čine psi njegove kćeri Mije, jer ih on loše čuva.  Situacija bračnog para Voloder-Mužić i noćna intervencija Slavka i profesora Kuge kod jedne rasne kujice Laciju donose ideju za otvaranje vrtića za pse. Prvi i zadnji psi koji su dovedeni na adresu vrtića su psi Zdenkove kćeri Mije.  Dok Miljenko pomaže mami u Karlobagu, Filip pohađa glazbenu školu, kako bi naučio svirati gitaru kojom lažno osvaja srce nove djevojke Mirte. Verica to otkriva i smješta mu osvetničku zamku. Gostuje Boris Miholjević. Uloge: Jelena Miholjević, Ivan Glowatzky, Ljubomir Kapor, Goran Grgić, Nada Gaćešić Livaković, Marinko Prga, Jadranka Đokić, Pjer Meničanin Scenaristice: Tanja Kirhmajer, Zinka Kiseljak Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
- eventId: 713571
  start: 2026-10-29T13:44:00Z
  stop: 2026-10-29T14:19:00Z
  title: Luda kuća (3), humoristična serija (32/34)
  subtitle: ' '
  description: 'Pospremačica Verica ilegalno je u Slavkovom stanu, jer ju je gazdarica izbacila zbog pušenja. Matildina naivnost i Đurina plemenitost pomažu Verici da se osjeća sigurno i zaštićeno. Božena traži način kako popraviti krov koji prokišnjava, a Zdenko kako izbjeći štetu koju čine psi njegove kćeri Mije, jer ih on loše čuva.  Situacija bračnog para Voloder-Mužić i noćna intervencija Slavka i profesora Kuge kod jedne rasne kujice Laciju donose ideju za otvaranje vrtića za pse. Prvi i zadnji psi koji su dovedeni na adresu vrtića su psi Zdenkove kćeri Mije.  Dok Miljenko pomaže mami u Karlobagu, Filip pohađa glazbenu školu, kako bi naučio svirati gitaru kojom lažno osvaja srce nove djevojke Mirte. Verica to otkriva i smješta mu osvetničku zamku. Gostuje Boris Miholjević. Uloge: Jelena Miholjević, Ivan Glowatzky, Ljubomir Kapor, Goran Grgić, Nada Gaćešić Livaković, Marinko Prga, Jadranka Đokić, Pjer Meničanin Scenaristice: Tanja Kirhmajer, Zinka Kiseljak Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
- eventId: 728434
  start: 2026-10-29T14:15:00Z
  stop: 2026-10-29T15:05:00Z
  title: 'Romano Bolković - 1 na 1: Gordan Grlić Radman, talk show'
  subtitle: ' '
  description: 'S ministrom vanjskih i europskih poslova Gordanom Grlićem Radmanom razgovaramo o svijetu u kojem se stari međunarodni poredak urušava, a obrisi novoga još nisu jasni. O odnosima velikih sila, sve snažnijoj ulozi Kine, budućnosti transatlantskog savezništva i sposobnosti Europe da postane samostalan geopolitički čimbenik. Kakav je mir moguć u Ukrajini, kakvu politiku Europa vodi na Bliskom istoku i gdje je u tim globalnim preslagivanjima mjesto Hrvatske? Posebnu pozornost posvećujemo hrvatskom susjedstvu: izborima u Srbiji, europskoj perspektivi Crne Gore, položaju Hrvata u Bosni i Hercegovini te otvorenim pitanjima koja opterećuju odnose među državama regije. Razgovaramo i o hrvatskoj mediteranskoj politici, energetskom i prometnom povezivanju Europe te novim diplomatskim i gospodarskim mogućnostima koje se otvaraju izvan tradicionalnog europskog prostora. Naposljetku, nakon deset godina vlade Andreja Plenkovića, pokušavamo podvući vanjskopolitičku bilancu jednoga desetljeća. Hrvatska je ostvarila gotovo sve strateške ciljeve postavljene nakon osamostaljenja, ali koliko je time doista porastao njezin međunarodni utjecaj? Što je obilježilo Plenkovićev način vođenja vanjske politike i, možda najvažnije, koja bi trebala biti sljedeća velika nacionalna ambicija Hrvatske?'
- eventId: 713572
