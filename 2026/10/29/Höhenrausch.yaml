  title: Faszination Heimat - Der letzte Alpenfischer
  subtitle: Faszination Heimat - Der letzte Alpenfischer
  description: Ein kräftiger Zug am Netz und Sepp Poigner hievt seinen Fang über die Kante seines kleinen Boots. Der letzte Berufsfischer vom Traunsee ist ein Eigenbrödler und Unikat. Der wortkarge Einzelgänger hat es gerne ruhig. Und so ist jede Fahrt auf den See eine Reise in die Stille und gleichzeitig zu sich selbst. Hier kann er  die Natur beobachten und einfach er selbst sein. Der See, der Fisch und Sepp das gehört nun schon seit zwei Jahrzehnten zusammen. AT 2013
