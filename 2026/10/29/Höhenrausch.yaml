  title: Bergwelten - Eine Seilschaft fürs Leben - Babsi Zangerl & Jacopo Larcher
  subtitle: Bergwelten - Eine Seilschaft fürs Leben - Babsi Zangerl & Jacopo Larcher
  description: 'Die Liebesgeschichte von Babsi Zangerl und Jacopo Larcher ist außergewöhnlich. Sie zählen zur Weltelite im Klettern: ihr Arbeitsplatz ist die Vertikale, ihr Wohnzimmer der Van. Die Bergwelten -Doku begleitet das Paar auf spektakulären Kletter-Routen im romantischen Boulder-Paradies ,Val di Mello'' (Lombardei) und durch die raue Eiger-Nordwand. Was die Vorarlbergerin, 2019 für National Geographic ,Adventurer of the Year'', und den schüchternen Südtiroler, italienisch-sprachig und anfangs kaum eines deutschen Wortes mächtig, verbindet und wie sie zusammenfanden, darüber sprechen sie in dieser Doku. Jacopo Larcher ist Teil des italienischen Kletter-Nationalteams und italienischer Champion im Bouldern als er sich 2010 entscheidet, den Wettkampfsport sein zu lassen und mit dem Felsklettern zu beginnen. Dass Babsi gut klettert, ist für Jacopo schon damals kein Geheimnis, aber nicht entscheidend für sein Interesse an ihr. "Sie war immer voll happy und voll offen - nd das hat mich von Anfang an angezogen!" Doch eine geeignete Gelegenheit sie anzusprechen bietet sich dem schüchternen Burschen nicht. Da kommt Babsis Neugier und ihr offener Zugang auf Menschen ins Spiel. Mehrfach laufen sich die beiden beim legendären italienischen Boulderfestival, dem ,Melloblocco'', über den Weg. Vorerst bleibt es beim Blickkontakt. Erst als Babsi die Initiative übernimmt, lernen sich die beiden näher kennen - und bald schon verbindet sie mehr als bloß das Bouldern. Doch wie funktioniert eine Beziehung, die solch enormen gemeinsamen Anstrengungen unterworfen ist? Wie lange kann man die tagelange intensive Nähe ertragen? Und steht die Liebe bei den Entbehrungen in der Wand nicht immer auf dem Prüfstand? AT 2022'
