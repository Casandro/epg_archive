  title: WDR 3 Konzert
  subtitle: Türkische Kammermusik in Duisburg
  description: |-
    2009 gründete Geiger Önder Baloglu Les essences, ein Ensemble aus Musikern verschiedener Herkunft, das 2025 den Förderpreis des Landes NRW erhalten hat. Sein Konzert folgt einer Spur nach Kleinasien: Neben Bearbeitungen anatolischer Volksmelodien stehen auch Werke junger türkischer Komponisten auf dem Programm - darunter auch eine Suite des Ensembleleiters selbst.
    <strong>Önder Baloglu</strong><br/>"İstanbul Sarmanı" (Der rote Kater von Istanbul)
    <strong>Anonymus</strong><br/>"Ah Bir Ateş Ver" (Ach, gib mir Feuer)
    <strong>Erberk Eryılmaz</strong><br/>"Bolulu Ama Rasim" (Der blinde Rasim aus Bolu)
    <strong>Anonymus</strong><br/>"Odam Kireçtir" (Mein Zimmer ist gekalkt)
    <strong>Anonymus</strong><br/>"Atabarı" (Reigentanz aus Artvin)
    <strong>Barış Büyükyıldırım</strong><br/>"Teke" (Tanz aus der Teke-Region)
    <strong>Aşık Veysel</strong><br/>"Uzun İnce Bir Yoldayım" (Ich bin auf einem langen, schmalen Weg)
    <strong>Evrim Demirel</strong><br/>"Seikilos" (Zeitreisender)
    <strong>Anonymus</strong><br/>"Sarı Gelin" (Die blonde Braut)
    <strong>Cem Oslu</strong><br/>"Nemrut Heykellerinin Türküsü" (Lied der Statuen vom Nemrut)
    <strong>Les essences<br/>Önder Baloglu</strong>, Violine<br/><strong>Bianca Adamek</strong>, Violine<br/><strong>Odysseas Lavaris</strong>, Viola<br/><strong>Diego Hernandez</strong>, Violoncello
    Aufnahme vom 12. April 2026 aus der Marienkirche, Duisburg
    Moderation: Philipp Quiring<br/>Redaktion: Simon Al-Odeh
