  subtitle: Rock
  description: |-
    Rock
    Moderation: Christoph Reimann

    Was ist Rockmusik im Jahr 2026? Die irische Band Fontaines D.C. entdeckt auf ihrem neuen Album ?Dopamine Chamber? den Synthesizer für sich. Die US-amerikanischen Shoegazer von DIIV lassen ihre neue Platte vom Hyperpop-Produzenten A. G. Cook produzieren. Cameron Winter, Sänger der New Yorker Band Geese, tritt auf seinem neuen Livealbum als Crooner am Klavier auf. Und die britische Popmusikerin Charli XCX hat in diesem Jahr behauptet, Rockmusik zu machen - ohne dass ihre Musik besonders danach klingt. Vier sehr unterschiedliche Antworten auf die Frage, was Rock heute ausmacht. Und ob sich das Genre überhaupt noch eindeutig bestimmen lässt.
