  description: 'Musik ist ein Rätsel der Evolution. Menschen singen, tanzen, fühlen den Beat: Diese Fähigkeit, Musik wahrzunehmen, zu genießen und selbst zu produzieren, nennt man Musikalität. Doch ist der Homo sapiens die einzige musikalische Spezies? Die Dokumentation gibt Einblicke in die bisherige Erforschung von Musikalität und Rhythmus in Natur und Tierwelt auf der Suche nach ihren Ursprüngen.'
