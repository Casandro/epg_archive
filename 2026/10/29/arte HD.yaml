  description: |-
    Die "Troubadour Reunion" vereint die amerikanischen Musiklegenden Carole King und James Taylor zu einem denkwürdigen Auftritt in der Kult-Location am Sunset Strip in Los Angeles, wo sie 1970 ihr erstes gemeinsames Konzert gaben. Auf das bewegende Wiedersehen folgte eine spontane, restlos ausverkaufte Tournee.
