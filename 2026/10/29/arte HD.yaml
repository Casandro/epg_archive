  description: Ein tödlicher Fehler, ein Versehen oder vorsätzlicher Mord? - Die Krankenschwester Hana rückt nach einem ungewöhnlichen Todesfall auf ihrer Station in den Mittelpunkt einer polizeilichen Ermittlung. Sie hatte sich um die Infusion einer älteren Patientin gekümmert, die etwas später überraschend an einem Herzstillstand starb. Hana fehlt es an Empathie, nicht nur für ihre Patienten und Kollegen, sondern auch für ihre Tochter. Ihre kalte Art macht sie zu einer Eigenbrötlerin, die überall aneckt, und plötzlich scheinen ihr Kollegen und Bekannte sogar einen Mord zuzutrauen. Doch wie viel ist an den Anschuldigungen wirklich dran?
