  description: 'Nienke komt lijnrecht tegenover haar zussen te staan als zij ontdekken wat voor een verschrikkelijk nieuws zij voor hen heeft verzwegen. Nienke is ten einde raad en dan heeft haar dochter ook nog een verrassing voor haar. Margot confronteert Trijn met haar vermoeden, maar of haar besluit om haar te beschermen de juiste is, is nog maar de vraag. Terwijl Rolinde aarzelt of ze nog wel groots wil trouwen, vreest Faya dat ze een miskraam krijgt. Ze belandt in het ziekenhuis en treft Mark aan haar bed. Regisseur: Annemarie van de Mond. Acteurs: Joy Delima (Rolinde Veenstra), Melody Klaver (Faya Aardenburg), Fockeline Ouwerkerk (Nienke van Dijk), Abke Haring (Paulien Boogers), Olga Zuiderhoek (Saar Veenstra-Flemming) (2026)'
