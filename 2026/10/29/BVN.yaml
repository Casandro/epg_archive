  title: Tussen Kunst en Kitsch Extra
  subtitle: Miniatuur kroonluchter E31. Een bijzonder voorwerp, een aansprekend verhaal of een opvallende ontwerper of kunstenaar; het kunnen allemaal aanleidingen zijn voor een Tussen Kunst en Kitsch Extra.
  description: Regelmatig krijgt expert Emiel Aardewerk zilveren miniaturen te zien. Een kleine kroonluchter brengt hem ertoe het Kunstmuseum in Den Haag te bezoeken en daar een groot poppenhuis van Sara Rothé te bekijken. Sara Rothé was gehuwd met de rijke koopman Jacob van Ploos van Amstel. Het stel had geen kinderen en in 1743 bedacht Sara het poppenhuis als tijdverdrijf. Emiel bespreekt enkele fraaie miniaturen uit het poppenhuis. Het geeft een kijkje in het huislijke leven in de achttiende eeuw. (2024)
  genre:
  - '118'
