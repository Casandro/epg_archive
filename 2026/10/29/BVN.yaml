  description: Of het nu een griezelboek, een enge film of een spannend spookhuis is, veel mensen zijn dol op griezelen. Waarom vinden we iets dat griezelig is leuk? Griezelboekenschrijver Paul van Loon neemt Anas mee in zijn "grumoristische" wereld vol spoken, heksen, vampieren en weerwolven en legt uit dat er een groot verschil is tussen griezelen en gruwelen. Op een verlaten landgoed ontmoet Anas hersenwetenschapper Linda. Zij legt uit wat er in ons brein gebeurt wanneer we spanning ervaren en waarom griezelen soms best nuttig kan zijn. Bij de Cowboys gooit Spoiler Bob roet in het eten voor iedereen die van spanning houdt. (2025)
