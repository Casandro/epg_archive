  subtitle: Familie Schouten S28 E01. Patrick (45) en Bianca (38) verhuizen met hun drie dochters van Brabant naar Portugal. Ze willen een B&B beginnen gericht op mensen met een glutenintolerantie om hen een onbezorgde vakantie te bieden.
  description: Patrick (45), voormalig eigenaar van een kaasspeciaalzaak, en Bianca (38), intern begeleider op een basisschool, verruilen samen met hun drie dochters Brabant voor Arcos de Valdevez in Portugal. Daar willen ze een B&B opzetten met appartementen, safaritenten en camperplekken, helemaal gericht op glutenvrije gasten. Voor Bianca is het een droom om mensen met een glutenintolerantie onbezorgd op vakantie te laten gaan. Maar bij aankomst mogen ze het huis nog niet in zolang de hypotheek niet rond is. Ook staat de verhuiswagen al voor de deur. Waar moeten ze met al hun spullen naartoe? (2026)
