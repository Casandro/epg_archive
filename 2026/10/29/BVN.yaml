  title: Noord-Zuid-Oost-West
  subtitle: Natuurlijk Noord-Holland - Wat een verbeelding! S06 E132. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'In Natuurlijk Noord-Holland: met het afplaggen van de bovenste grondlaag keert er in de duinen iets zeldzaam natuurlijks terug: open zand. Langzaamaan verovert het stuivende zand weer delen van het duin, zoals dat vroeger heel gewoon was. Natuurbeheerders erkennen dat wild stuivend zand een grote meerwaarde heeft voor de duinnatuur. Wat een verbeelding!: in de openbare ruimte staan honderden beelden. Wie heeft het gemaakt en waarom? Wat vindt de buurt ervan? Er is veel te ontdekken. Deze keer staat Delft centraal. (2026)'
