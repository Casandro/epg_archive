- eventId: 735078
  start: 2026-10-29T00:15:00Z
  stop: 2026-10-29T01:07:00Z
  title: Planet Weltweit - Amas Welt, das neue Ghana
  subtitle: Planet Weltweit - Amas Welt, das neue Ghana
  description: |-
    Eine neue Generation Frauen wächst im westafrikanischen Ghana heran: Stark, selbstbewusst und voller Ideen trotzen sie ihren Eltern, die das westliche Lebensmodel noch als Ideal verstanden. Black is beautiful, lautet das Motto, dem sie ihr Leben verschrieben haben. Ama Boamah gehört zu einer neuen Generation Frauen in Ghana: nach einem Fotografie-Studium im Ausland ist sie voller Pläne nach Hause zurückgekehrt. Heute, mit Anfang Dreißig, besitzt sie in der Hauptstadt Accra die erste Fabrik für Biosäfte. Die dreifache Mutter ist eine Pionierin, die das für Ghana noch neue Konzept von Bionahrung und von Recycling gegen Widerstände durchgesetzt hat. Auch im Privatleben geht Ama einen unkonventionellen Weg: Auf der eigenen Hochzeit schafft sie es, sich gegen die Zwänge ihrer traditionellen Großfamilie zu Wehr zu setzen. Diese Reportage begleitet diese umtriebige junge Afrikanerin und ihre Mitstreiterinnen in ihrem turbulenten Alltag, der in der legendären Roof-on-Fire-Party hoch über den Dächern von Accra gipfelt.
    Es gibt ein Afrika, über das kaum berichtet wird: ein Afrika jenseits von Krieg, Armut und Flüchtlingströmen, ein wachsendes Afrika der aufstrebenden urbanen Mittelschicht, in dem Frauen immer mehr die treibende Kraft sind. Sie wehren sich gegen das Klischee des verlorenen Kontinents und gehen einen eigenen neuen Weg. Sie bauen ihre Zukunft in Afrika auf. Europa ist für sie nicht das Ziel. Und auch nicht das Vorbild. Afrikanerinnen dieser neuen Generation haben in den Metropolen Netzwerke aufgebaut, um sich im Beruf gegenseitig zu unterstützen. Die meisten von ihnen haben ihren Horizont durch ein Studium im Ausland erweitert und sind dann in ihre Heimat zurückgekehrt, wo sie heute als Managerinnen, Designerinnen, Akademikerinnen oder Unternehmerinnen arbeiten. Sie schielen nicht nach den westlichen Industriestaaten, doch zugleich tragen sie Knowhow, Erfahrungen, Werte der westlichen Welt in sich und sind mit den neuesten Technologien vertraut. DE 2016
- eventId: 735084
  start: 2026-10-29T01:15:00Z
  stop: 2026-10-29T02:07:00Z
  title: Planet Weltweit - Rumänien, eine Weihnachtsreise ins Donaudelta
  subtitle: Planet Weltweit - Rumänien, eine Weihnachtsreise ins Donaudelta
  description: |-
    Weihnachten in Rumäniens Osten - mitten im Donaudelta, Europas größtem Sumpf- und Schilfgebiet. Hierher flohen vor Jahrhunderten Altgläubige vor den Repressalien des Patriarchen Nikon und des Zaren Peter I. Weihnachten mit den Lipowanern - eine Reise in die russisch-orthodoxe Vergangenheit, mitten in Rumänien.
    Sie werden Lipowaner genannt, oder auch Altgläubige. Seit sie vor den Repressalien von Zar Peter I. vor mehr als drei Jahrhunderten aus Russland hierher geflohen  sind, leben sie als einfache Fischer im Einklang mit der Natur. Weihnachten wird hier traditionell am 7. Januar gefeiert - in streng russisch-orthodoxer Manier. Eine einfache, kleine Welt, die zu bröckeln beginnt. Diese Reportage hat das Weihnachtsfest bei Eis und Schnee mit den Lipowanern gefeiert.
    Nelik Radaschin ist Fischer, wie schon sein Vater und Großvater. Er lebt mit seiner Familie im Donaudelta, in einem Dorf mit dem eigenartigen Namen Mila 23. Der Name rührt von der Entfernung des Dorfes zum Schwarzen Meer her - genau 23 Meilen. Nelik ist wie alle hier Lipowaner - ein Altgläubiger. Vor Jahrhunderten sind sie vor der Verfolgung durch Zar Peter I. hierher geflohen, um im Schilf und in den Sümpfen Schutz und Nahrung für ihre Familien zu finden. Sie sind geblieben und leben bis heute ein einfaches, streng gläubiges Fischerleben. Doch die Moderne fand den Weg ins Donaudelta, was unweigerlich zu Konflikten führte. Was jedoch alle eint ist die Liebe zu den russischen Traditionen. So wird das Weihnachtsfest in Mila 23 traditionell am 7. Januar gefeiert und ist eine faszinierende Mischung russischer und rumänischer Rituale. Wie lange wird es die Lipowaner hier noch geben, wird die nächste Generation auch noch so stimmungsvolle und streng gläubige Feste feiern? Wie lange gibt es das noch: Russland, mitten in Rumänien?
     DE 2016
- eventId: 735086
  start: 2026-10-29T02:15:00Z
