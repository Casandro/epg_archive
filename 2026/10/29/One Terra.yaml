  title: Planet Weltweit - Hexenwahn in Tansania
  subtitle: Planet Weltweit - Hexenwahn in Tansania
  description: Allein in Tansania fallen jährlich Hunderte von Menschen, meist Frauen, dem Hexenwahn zum Opfer. Juristisch gesehen sind es oft Morde aus Habgier - die Motive sind Erbschaftsstreitigkeiten, Unterhaltskosten oder einfach nur Neid. Doch diese profanen Motive werden okkultistisch verschleiert. Die Journalistin Gaudensia Mngumi und der Professor Simeon Mesaki wollen die Hintergründe aus nächster Nähe erforschen und brechen zu einer Reise ins tansanische Hinterland auf.  Eine Frau ist ermordet worden. Ihr eigener Sohn hielt sie für eine Hexe, die an der Kinderlosigkeit seiner jungen Ehe Schuld war. Ein Hexenmeister hätte ihm empfohlen, sie zu töten, gibt er später zu Protokoll. Die Familie steht unter Schock. Witchdoctor oder Nfumu heißen die professionellen Heiler oder auch Hexenmeister in Tansania. Sie werden um Hilfe angerufen, wenn angeblich durch Hexerei hervorgerufene Krankheiten kuriert werden müssen. Der Mord geschah im Norden Tansanias, in der Nähe der Stadt Shinyanga. Hier beginnen Gaudensia Mngumis und Professor Simeon Mesakis Recherchen. Der Wissenschaftler erforscht die Hexenmorde seit vielen Jahren. Er berät die Journalistin, die sich für die Frauenrechtsinitiative TAMWA engagiert. Nach einer mehrwöchigen Reise durch die Dörfer der Region plant sie eine Artikelserie im Guardian, eine der einflussreichsten Tageszeitungen in Tansania, zu veröffentlichen. Hexerei, wie die Afrikaner sie selbst nennen, ist eine Realität, die tief in der afrikanischen Denk- und Lebensweise verwurzelt ist. Seit Jahrhunderten schon leben die Menschen zwischen Dakar und Daressalam täglich in Furcht vor Hexerei. Die Schuld an Missernten, Unfruchtbarkeit oder beruflichem Misserfolg wird Hexen zugeschrieben, die um den Zustand zu ändern, getötet werden müssen. Jahrhundertlang wurde der Aberglaube der Menschen dafür genutzt, die bestehenden Sozialstrukturen und insbesondere die Unterdrückung der Frauen aufrecht zu erhalten. DE 2007
- eventId: 735102
  start: 2026-10-29T06:10:00Z
  stop: 2026-10-29T07:02:00Z
  title: Planet Weltweit - Uganda - Der Weg zum Fahrradtaxi
  subtitle: Planet Weltweit - Uganda - Der Weg zum Fahrradtaxi
  description: "Der Norden des Victoria-Sees in Uganda mit seinen vielen Hügeln und Bergen ist für Fahrräder eigentlich kein geeignetes Terrain. Gleichwohl wird hier auf Drahteseln fast alles transportiert: Bananenstauden, Wellblechdächer, frischer Fisch - und Fahrgäste. Für Motorräder und Autos fehlt den meisten Menschen das Geld, wer ein eigenes Fahrradtaxi besitzt, ein \"Boda-Boda\", kann sich glücklich schätzen. Denn mit den Einnahmen aus dem Boda-Boda-Geschäft lässt sich eine Familie gut ernähren. In der Reportage wird ein Boda-Boda-Fahrer auf dem Weg zu seinem heiß ersehnten eigenen Gefährt begleitet. \n\nDer 28jährige Joseph Mukisa ist seit gut acht Jahren Boda-Boda-Fahrer. Mit seinem Fahrradtaxi durchstreift er fast täglich die Straßen seines Stamm-Reviers: Jinja, die Stadt nahe der berühmten Nilquelle. Hier findet er so gut wie immer Fahrgäste. Doch das Rad, auf dem Joseph sitzt, gehört ihm nicht. Seit sein eigenes Boda-Boda gestohlen wurde, muss er täglich Geld für die Miete eines Fremdrads ausgeben. Lange schon träumt er von einem eigenen Boda-Boda. Wäre da nicht der hohe Anschaffungspreis.\nHilfe verspricht sich Joseph nun von FABIO, des \"First African Bicycle Information Office\". Die Macher der Organisation wissen, wie wichtig Fahrräder für das öffentliche Leben Ugandas sind. Ohne die Drahtesel blieben viele Waren bei den Produzenten liegen, kranke Menschen kämen in Notfällen nicht ins Hospital, und Fahrrad-Chauffeure wie Joseph hätten keine Arbeit. FABIO unterstützt die Interessenten beim Erwerb des eigenen Fahrrads. Die Organisation bietet fabrikneue Räder zu subventionierten Preisen an oder vereinbart mit den Käufern faire Ratenzahlungen. \nAuf diese Konditionen setzt auch die Kiosk-Besitzerin Florence Musoke. Sie lebt außerhalb von Jinja und benötigt ein neues Rad für ihre täglichen Waren-Einkäufe und dringende Fahrten anderer Familienmitglieder. Wie sieht der Alltag aus im Fahrrad-Land Uganda? Und wie der konkrete Weg zu einem fabrikneuen Rad? \n DE 2008"
- eventId: 735103
  start: 2026-10-29T07:10:00Z
  stop: 2026-10-29T08:01:00Z
  title: 'Planet Weltweit - Tanganjikasee: Vom Kanonenboot zum Passagierschiff'
  subtitle: 'Planet Weltweit - Tanganjikasee: Vom Kanonenboot zum Passagierschiff'
  description: 'Der Tanganjikasee ohne die "Liemba", das wäre undenkbar. Seit rund zwei Jahrzehnten steuert Kapitän Titus Benjamin das uralte Passagierschiff. Es wurde vor fast 100 Jahren auf der Meyerwerft im norddeutschen Papenburg als Fracht- und Truppentransporter "Graf von Goetzen" entwickelt und gebaut. Die Menschen am ostafrikanischen Tanganjikasee vertrauen Kapitän und Schiff, ohne die alte "Liemba" wäre auf dem längsten Süßwassersee der Welt kein Transport möglich. Alle zwei Wochen startet die "Liemba" zu ihrer Reise von Tansania nach Sambia. Sie fährt von der tansanischen Kleinstadt Kigoma am Nordostufer bis zum sambischen Hafen Mpulungu am Südende des Sees und wieder zurück. Fast 1.000 Kilometer mit über 30 Stopps auf dem offenen See. Häfen gibt es nicht, die Passagiere klettern über Ruder- und Motorboote an und von Bord. Über Fünf Tage und vier Nächte dauert die Reise, wenn alles gut geht. Manchmal aber auch länger: zu viel Fracht, zu viele Passagiere oder ein technischer Defekt - Ursachen für Verzögerungen gibt es genug. Planet ist auf der "Liemba" mitgefahren, hat Besatzung und Passagiere auf ihrer Reise begleitet, und zeigt, warum die "Liemba", dieses eigentlich schon museumsreife, aber immer noch funktionierende Überbleibsel deutscher Kolonialgeschichte, für die Menschen am Tanganjikasee unverzichtbar ist. Der 60jährige Chefmaschinist Mathias Masalu Joseph hält die "Liemba" am Laufen. Während Kapitän Titus Benjamin auf der Brücke das Sagen hat, ist sein Reich der dreckige und laute Maschinenraum, die Herzkammer der Liemba: und das seit 30 Jahren. Eigentlich war er schon in Pension, doch dann holte ihn die Reederei zurück, zumindest für ein Jahr, denn er kennt das Schiff und seine Macken am besten. Doch wie lange können Kapitän Titus Benjamin und Maschinist Mathias Masalu Joseph die "Liemba" noch fit halten? DE 2012'
- eventId: 735104
  start: 2026-10-29T08:10:00Z
  stop: 2026-10-29T09:02:00Z
  title: Planet Weltweit - Die einsamen Mönche von Oelenberg
  subtitle: Planet Weltweit - Die einsamen Mönche von Oelenberg
  description: Im Jahr 1825 sind die Trappistenmönche in das Kloster Oelenberg im südlichen Elsass eingezogen. Seitdem verläuft das Leben hier nach den gleichen strengen Regeln des Heiligen Benedikt. "Ora et labora - Bete und arbeite" lautet der Grundsatz für die Benediktinermönche. Ende des 19. Jahrhunderts gehörten über 200 Geistliche der Abtei von Oelenberg an. Heute sind sie nur noch 14. DE 2008
- eventId: 735110
  start: 2026-10-29T09:10:00Z
  stop: 2026-10-29T10:02:00Z
  title: Planet Weltweit - Modelsuche in Sibirien
  subtitle: Planet Weltweit - Modelsuche in Sibirien
  description: Einmal im Jahr machen sich Modelscouts der Agentur "Noah Models" von Sankt Petersburg aus auf nach Sibirien. Dort gibt es nicht nur Mädchen mit perfekten Maßen, sondern mit Gesichtern, so einzigartig und ungewöhnlich, dass sie auf dem internationalen Modemarkt äußerst begehrt und erfolgreich sind. Für die meisten dieser Sibirischen Mädchen ist es die einzige Chance, Geld im Westen zu verdienen und dabei die Welt zu sehen. In der Modebranche sind sie zum Label geworden ' Mädchen aus Sibirien. Zart, mitunter elfengleich, geben sie mit ihren exotischen Gesichtern den Look auf Hochglanzmagazinen und Laufstegen vor. Mädchenhafte Unschuld gepaart mit Sinnlichkeit - perfekte Projektionsflächen der Modeindustrie. Einigen wenigen sibirischen Mädchen hat das Wohlstand und Unabhängigkeit gebracht. Die Reportage begleitet junge Mädchen auf dem Weg von ihren Dörfer auf den Laufsteg und erkundet dabei das Geschäft, das sie im Rampenlicht strahlen lässt. Er erzählt vom Alltag der Mädchen in ihrer sibirischen Heimat, ihren Sehnsüchten fernab davon und fragt, ob die Träume dieser Mädchen, werden sie tatsächlich wahr, sie am Ende glücklich machen. Anna Juschakowa, Modelscout aus Sankt Petersburg und die Fotografin Valeria Kritsova sind seit acht Tagen mit der Transsibirischen Eisenbahn unterwegs. Doch statt Brot, Wurst, Käse oder Wodka, wie die anderen Reisenden, haben sie ihre Laptops auf den Knien, die Ausbeute Ihrer Tour. Mehr als 150 Mädchen haben sie in den Dörfern und Kleinstädten gesichtet, fotografiert oder auf Videos festgehalten. Die 16-jährige Anja hat ihr erstes Casting hinter sich gebracht. Hier, am Ufer des riesigen Jenissei ist sie zu Hause. Während sie Steine auf dem Wasser hüpfen lässt, wehen ihre langen braunen Haare und nur manchmal lugt das dicke Pflaster unter ihrem linken Auge hervor. DE 2012
- eventId: 735111
  start: 2026-10-29T10:10:00Z
  stop: 2026-10-29T11:02:00Z
  title: Planet Weltweit - Kolumbien - Ein Riesenrad auf Reisen
  subtitle: Planet Weltweit - Kolumbien - Ein Riesenrad auf Reisen
  description: Lautes Kinderlachen hallt von jedem Platz, auf dem César Romoleroux mit seiner Kirmes Station macht. Zu seinem fahrbaren Vergnügungspark gehören unter anderem ein Riesenrad, ein Autoscooter und mehrere Kinderkarussells. Seit zehn Jahren reist er mit seinen Fahrgeschäften quer durch die kolumbianischen Anden, eine Gegend, die bis vor kurzem noch Bürgerkriegsgebiet war. Die Reportage hat César Romoleroux bei seinen ungewöhnlichen Reisen begleitet und mit ihm ein Land erlebt, welches mühsam versucht, sich aus dem Schatten der Vergangenheit zu lösen und in eine neue, erfreulichere Zukunft zu steuern. Drei Wochen war César Romoleroux mit seiner Kirmes in dem Dorf Aguadas - jetzt bereitet er zusammen mit seinen Angestellten und einigen Tagelöhnern den Abtransport vor. Er besucht mit seinem Jahrmarkt nur die kleinen Dörfer auf dem Land. Jedes Mal wird er von den Leuten, insbesondere den Kindern, freudig empfangen, bietet er ihnen doch eine willkommene Abwechslung nach all den Jahren des Bürgerkriegs, welcher das Land bis heute innerlich zu zerreißen droht. Insgesamt reist César Romoleroux seit zehn Jahren mit seiner Kirmes von Ort zu Ort. Neben den politischen Problemen muss er sich mit den kleinen, alltäglichen Sorgen herumschlagen, die solch ein Unternehmen zu bewältigen hat - Kurzschlüsse in den Stromleitungen, Wetterkapriolen und die persönlichen Befindlichkeiten, die ein Leben auf Wanderschaft mit sich bringt. So ist Cesar seit einem halben Jahr Vater eines kleinen Sohnes; einer seiner Mitarbeiter erwartet Zwillinge. Zudem muss eine Kirmes ihren Gästen ständig etwas Neues bieten, um nicht langweilig zu werden. In diesem Jahr plant Cesar deshalb den Bau einer Piratenschaukel. Ein riskantes Unternehmen, denn solch eine neue Attraktion kostet etwa 35.000 Euro. Ein Arbeiter verdient auf dem Land jedoch kaum mehr als zwei Euro am Tag und muss davon die ganze Familie ernähren. DE 2007
- eventId: 735115
  start: 2026-10-29T11:10:00Z
  stop: 2026-10-29T12:02:00Z
  title: Planet Weltweit - Der Lachszähler von Kamtschatka
  subtitle: Planet Weltweit - Der Lachszähler von Kamtschatka
  description: 'Am äußersten Zipfel Russlands, zwischen Asien und Alaska, liegt Kamtschatka - eine Halbinsel mit glasklaren Flüssen, kochenden Seen und bis zu 4000 Meter hohen feuerspeienden Vulkanen. Es ist eines der letzten Naturparadiese der Welt, eine unvergleichlich schöne aber auch raue Landschaft. Wer in dieser Abgeschiedenheit lebt, muss vieles entbehren und hat oft einen ungewöhnlichen Beruf: So wie Alexej Maslow, der Lachszähler von Kamtschatka. Rund 200 Flüsse fliegt er pro Saison im Hubschrauber ab, um zu schätzen, wie viele Lachse darin ziehen. Fische zählen im Flug - wie geht das? Die Dokumenation begleitet Alexej Maslow auf seinen Flügen durch die Wildnis und lüftet das Geheimnis des Lachszählers. Kamtschatka ist noch heute wild und unberührt. Das verdankt es seiner geographischen Abgeschiedenheit und der Tatsache, dass die Halbinsel zu Sowjetzeiten verbotenes Land war, Sperrgebiet. Straßen und Wege gibt es noch heute kaum. Tagelang ist Alexej mit dem Hubschrauber unterwegs, ohne auf eine Stadt oder eine Siedlung zu stoßen. Jährlich kehren die Lachse in riesigen Schwärmen aus dem Pazifik hierher auf die Halbinsel zurück, um sich zu paaren und dann zu sterben. Es ist Alexejs Aufgabe, aus der Luft zu schätzen, wie viele es genau sein werden. Seine Schätzungen beeinflussen die staatliche Fangquote und damit auch die Preise an den amerikanischen Warenterminbörsen, wo der Pazifiklachs hoch gehandelt wird. Der Lachs ist auf Kamtschatka aber nicht nur Lebensgrundlage vieler Menschen, sondern auch der riesigen Braunbären. Bis zu 50 Kilogramm Lachs fressen erwachsene Kamtschatka-Bären am Tag, und wagen sich bei ihren Fischzügen auch schon mal bis in die Siedlung der Forscher vor. So hat Alexej Maslow extra den Bärenjäger Wassili für den Schutz der Forschungsstation engagiert. Er duldet lediglich die Bärenwaisen Mischa und Mascha, die regelmäßig die Nähe der Menschen und Schutz vor ihren großen Artgenossen suchen. DE 2007'
- eventId: 735121
  start: 2026-10-29T12:10:00Z
  stop: 2026-10-29T13:02:00Z
  title: Planet Weltweit - Pyrenäen, ein Hirte zwischen Himmel und Erde
  subtitle: Planet Weltweit - Pyrenäen, ein Hirte zwischen Himmel und Erde
  description: 'Der 36-jährige Brice Delsouiller ist ein ungewöhnlicher Mann. Sechs Monate im Jahr verbringt er auf den 3.000 Meter hoch gelegenen Sommerweiden in den Pyrenäen, um Kühe zu hüten. Der Enge des Alltags seines Heimatortes versuchte er sich seit jeher zu entziehen und fand so nicht nur sein Glück in der Einsamkeit der Berge, sondern entdeckte eine weitere Leidenschaft: die des Skyrunnings, des Extrem-Berglaufs. Wer ihn beobachtet, traut seinen Augen nicht: Wie eine Gämse springt er von Bergkuppe zu Bergkuppe, stundenlang rennt er durch Täler und über Berghänge, durch unwegsame, steinige Landschaft. Brice Delsouiller hütet hier im Sommer etwa 400 Kühe, eine Mammut-Aufgabe, denn das Gelände ist unwegsam und Brice treibt seine Tiere immer höher, dorthin, wo das Gras am saftigsten, die Freiheit am größten ist. In seiner kleinen Berghütte lebt er ohne warmes Wasser, ohne Strom, ohne moderne Kommunikation. Nur mit seinen beiden Hunden und seinen Büchern. Seit 14 Jahren führt er dieses Leben als Hirte, erst vor vier Jahren hat er angefangen zu laufen. Zunächst, um seinen Hunden beim Hüten zu helfen, versprengte Tiere zu suchen oder um unten im Tal einzukaufen. Daraus wurde eine Sucht, eine Besessenheit, die ihn ständig an die eigenen Grenzen führt: "Ich weiß nicht, warum ich renne. Es ist eine Selbstverständlichkeit. Mein Körper wollte immer rennen. Ich fühle mich leicht, mächtig. Seit 14 Jahren lebt mein Körper in den Bergen, ist durch die Höhenunterschiede und den Mangel an Luft geformt und geschmiedet. Mein Körper hat sich komplett an die Bergwelt angepasst." Die Wettrennen in Katalonien und Andorra werden ihm zeigen, wo er steht, denn hier laufen die Besten. DE 2016'
- eventId: 735122
  start: 2026-10-29T13:10:00Z
  stop: 2026-10-29T14:02:00Z
  title: Planet Weltweit - Kenias Spürhunde - Rettung für die Elefanten
  subtitle: Planet Weltweit - Kenias Spürhunde - Rettung für die Elefanten
  description: 'Der Amboseli Nationalpark in Kenia ist eines der letzten Naturparadiese der Erde. Schier endlose Savannen sind für etliche Wildtiere ein wichtiger Rückzugsraum. Ihrem Schutz hat sich die Naturschutzorganisation "Big Life" verschrieben. Deren Ranger führen einen erbitterten Kampf gegen Wilderer und Helfershelfer. Nur so können die letzten der großen afrikanischen Wildtiere in freier Wildbahn überleben. Zurzeit werden jedes Jahr in Afrika allein etwa 35.000 Elefanten abgeschlachtet. Meist haben es die Wilderer auf das Elfenbein abgesehen, das vor allem in China reißenden Absatz findet. Geht das Gemetzel weiter, so schätzen Fachleute, wird es innerhalb der nächsten 15 Jahre in Afrika keine freilebenden Elefanten mehr geben. Eine im Jahre 2011 gegründete Hundestaffel von sogenannten "Tracker Dogs" ist im Kampf gegen Wilderer eine scharfe Waffe der kenianischen Naturschutzorganisation "Big Life". Mit Hilfe von Spürhunden ziehen Kenias Tierschützer in den Kampf gegen Wilderei. Chef der Hundestaffel ist Mutinda Ndivo, der selbst einst ein gefürchteter Wilderer war, bevor er überzeugt werden konnte, die Seiten zu wechseln, um fortan als Ranger seinen Dienst zu tun. Mutinda Ndivo kennt viele Schliche und Fluchtwege der Wilderer. Doch das Einsatzgebiet ist riesig und umfasst Gebiete in Kenia und in Tansania. Es ist schlicht nicht möglich, überall Ranger zu postieren. Zumal der Druck steigt. Ursache aller Wilderei ist die explosionsartig gestiegene Nachfrage nach Elfenbein durch die neue chinesische Mittelschicht. Die Organisation "Big Life" hat eine klare Botschaft an alle Wilderer: "Es lohnt sich nicht. Wir fassen jeden, der den Wildtieren schadet!" Nur das kann Wilderer abschrecken. Mutinda Ndivo ist deshalb so oft es geht mit seiner erfahrenen Hündin Dede im Einsatz. Die Treffergenauigkeit der Spürhunde ist bei Wilderern gefürchtet, vor allem bei jenen Einheimischen, die sich an den Verbrechen beteiligen.  DE 2015'
- eventId: 735128
  start: 2026-10-29T14:10:00Z
  stop: 2026-10-29T15:02:00Z
  title: Planet Weltweit - In acht Meilen um die Welt
  subtitle: Planet Weltweit - In acht Meilen um die Welt
  description: 'Die Roosevelt Avenue führt mitten durch das New Yorker Einwandererviertel Queens. Menschen aus etwa 130 verschiedenen Nationen leben hier offiziell. Mit der Journalistin Elizabeth Mora-Mass tauchen wir in diesen Mikrokosmos ein und begleiten sie bei ihren Recherchen. Vor den Backsteinfassaden mit Ladenschildern in unterschiedlichsten Sprachen stehen Garküchen, aus denen Dampfwolken von Chilihuhn-Tamales und Curry-Reis quellen. Mariachi-Melodien, indische Filmmusik, thailändische Schlager hallen zu einer wilden Kakophonie zusammen. Aus den ewig hupenden schwarzen Limousinen-Taxen "La mexicana" steigen in Saris oder Kimonos gehüllte Frauen und federgeschmückte amazonische Heiler. Und in kleinen Gärten der Sehnsucht wachsen Bohnenpflanzen, Korianderbüsche, Mais und Bananen. Die Roosevelt Avenue wird auch Korridor genannt: Vorhof der USA, Asphaltufer, auf das neue Emigrantenwellen schwappen. Seit zwei Dekaden ist diese Straße der Spiegel lokaler Turbulenzen auf dem Globus, nach jeder Katastrophe kommen Geflohene im Korridor an und kapseln sich in dessen Nischen ein. Italiener, Griechen und Deutsche aus der ersten Einwanderungswelle haben das Viertel schon längst in Richtung Manhattan verlassen. Elizabeth Mora-Mass kam vor 17 Jahren aus Kolumbien hierher. Wegen eines brisanten Artikels wurde sie mit dem Tode bedroht worden und hatte Zeit ihr Land verlassen müssen. Doch sie beschreibt weiterhin in schonungslosen Reportagen das Leben der Einwanderer im Korridor und prangert Ungerechtigkeiten an. So stieß Elizabeth Mora-Mass etwa auf das Schicksal einer jungen Ecuadorianerin, die wie viele andere Einwanderer auf ihrer Suche nach dem amerikanischen Traum zum Opfer eines "Kojoten" wurde - eines Menschenschleppers, der sie mit falschen Versprechungen und für Tausende von Dollar illegal nach New York gebracht hat. Auf der Fährte des Kojoten durchquert die Journalistin die Welt der Roosevelt Avenue und stößt dabei auf immer neue Schicksale und Geschichten. DE 2004'
- eventId: 735135
  start: 2026-10-29T15:10:00Z
  stop: 2026-10-29T16:02:00Z
  title: Planet Weltweit - Ruanda - Land der Frauen
  subtitle: Planet Weltweit - Ruanda - Land der Frauen
  description: 'Ruanda war vor fünfzehn Jahren Schauplatz eines der furchtbarsten Verbrechen der Menschheitsgeschichte als die Mehrheit im Land, die Hutu, Jagd auf die Minderheit, die Tutsi machte. Ein Völkermord, bei dem über eine Million Menschen umgebracht wurden. Heute ist Ruanda Vorbild für ganz Afrika. Kein anderes Land auf dem Kontinent hat in den vergangenen Jahren eine vergleichbare Erfolgsgeschichte geschrieben und sich so dramatisch verändert. Und das unter derart schlechten Voraussetzungen. Ruanda ist nicht mehr das ärmste Land in Afrika, es hat sich politisch stabilisiert. Diese Entwicklung ist vor allem das Werk der Frauen Ruandas. Sie haben das Land wirtschaftlich vorangebracht und zur Versöhnung zwischen Tutsi und Hutu beigetragen. Wir haben die starken Frauen in Ruanda besucht. Epiphanie Mukashyaka ist eine erfolgreiche Geschäftsfrau. Sie setzt heute mit ihrer Firma "BUF-Kaffee" über eine Million US-Dollar um. Sie kauft Kaffeebohnen in der ganzen Region auf, verarbeitet sie weiter und exportiert die Ware in alle Welt. Dabei setzt sie auf Gourmetkaffee, der besonders sorgfältig geerntet werden muss. Einfach war das nicht. Epiphanie Mukashyaka ist seit dem Völkermord in Ruanda 1994 Witwe. Ihr Mann und eines ihrer Kinder wurden während des Genozids von Hutu-Truppen ermordet. Trotz jahrelanger Not und politischen Wirren in der Nachkriegszeit hat es die heute 52-jährige Tutsi geschafft, ihre verbliebenen Kinder gesund groß zu ziehen. Alle haben sogar studiert. Dass ein normales Geschäftsleben in Ruanda heute möglich ist, erscheint wie ein Wunder: Völker, die sich vor wenigen Jahren noch brutal bekämpften, finden Schritt für Schritt zurück zu einen friedlichen Miteinander, zu einem gemeinsamen Leben. Eine wesentliche Rolle spielen dabei Frauen wie Epiphanie Mukashyaka. Die meisten Leute, die für die Tutsi-Geschäftsfrau arbeiten, sind Hutu. Einen anderen Weg der Vergangenheitsbewältigung begeht die Theatermacherin und Autorin Hope Azeda. DE 2009'
- eventId: 735137
  start: 2026-10-29T16:15:00Z
  stop: 2026-10-29T17:07:00Z
  title: Planet Weltweit - Auf den Spuren der Wikinger
  subtitle: Planet Weltweit - Auf den Spuren der Wikinger
  description: |-
    Henryk Wolski ist begeisterter Seefahrer. Schon neun Mal ist er um den Erdball gesegelt. Zusammen  mit einer siebenköpfigen Mannschaft möchte er nun in die Vergangenheit reisen und eine alte  Wikingerroute neu erkunden. Ausgangspunkt der Expedition ist Polens Hafenstadt Danzig. Dort wird  die "Welet", der originalgetreue Nachbau eines Wikingerschiffs, ablegen und Kurs auf Odessa  nehmen. Insgesamt beträgt die Strecke zwischen Ostsee und Schwarzem Meer 2.500 Kilometer - eine  Strecke, für die die gefürchteten Seemänner aus dem Norden einst fast zwei Jahre brauchten. Wolski  hingegen will sein Ziel schon in drei Monaten erreichen.

    "Dass die Wikinger durch die Ozeane der Welt gesegelt sind, verdient Respekt." sagt Wolski. Aber  auch wie sie die Flüsse bezwangen, fasziniert ihn. Ihre Route zwischen Danzig und Odessa möchte er  unter möglichst ursprünglichen Bedingungen erkunden. Immer wieder muss die Mannschaft der "Welet"  ihre Muskelkraft einsetzen - jeden Tag wird mindestens fünf Stunden gerudert, allen Schwielen und  Blasen an den Händen zum Trotz. Beinahe täglich stößt die Mannschaft an ihre körperlichen Grenzen  - und auf Hindernisse. So setzt das Boot immer wieder auf flachem Grund auf. Gesprungene Planken  und gefährlich tief hängende Fährseile sind nur kleinere Probleme. Die erste große Herausforderung  wartet bereits an der Landesgrenze zur Ukraine: In Przemysl muss das Boot über Land auf den Fluss  Dnjestr übergesetzt werden. Statt nach Wikingerart Holzrollen und Zugvieh zu gebrauchen wird  hierfür allerdings ein Kran eingesetzt, der es vorsichtig aus dem Wasser hebt. Eine schwierige  Operation, da sich das Boot mit Wasser vollgesogen und enorm an Gewicht zugelegt hat. Doch damit  nicht genug - am Grenzübergang soll Wolski auch noch eine Kaution von mehreren tausend Dollar  hinterlegen, um einreisen zu dürfen. Kann er nicht zahlen, ist seine Reise hier zu Ende. DE 2007
- eventId: 735138
  start: 2026-10-29T17:15:00Z
  stop: 2026-10-29T18:07:00Z
  title: Planet Weltweit - Kanadas Buschpiloten im Einsatz
  subtitle: Planet Weltweit - Kanadas Buschpiloten im Einsatz
  description: 'Wind, Schnee und Kälte bis zu minus 40 Grad Celsius - und das fast neun Monate im Jahr. Nunavik, im hohen Norden Kanadas, ist eine unwirtliche Region. Doch auch hier leben Menschen. In kleinen Gemeinden, Hunderte Kilometer voneinander entfernt. Unter teilweise schwierigen Flugbedingungen sichern Piloten jeden Tag die Verbindung der Dörfer mit dem Rest der Welt. Die 34-jährige Anouk Alarie fliegt eine robuste kleine "Twin Otter" über die Weiten der arktischen Tundra. "Wir sind die Busse des Nordens", sagt Anouk, "überall steigen Leute ein und aus". Und die widerstandsfähigen Buschflugzeuge leisten noch mehr: Mit ihrer Hilfe gelangen Lebensmittel bis in die entlegensten Winkel des Landes, Kranke werden ausgeflogen oder einfach nur Baumaterialien transportiert.  Nunavik ist der nördlichste Teil der kanadischen Provinz Québec. 9.000 Einwohner vom Volk der Inuit leben hier in einem Gebiet, das so groß ist wie ganz Frankreich. Vor knapp 40 Jahren lebte die Mehrzahl von ihnen noch als Nomaden, doch in den 1970er Jahren drängte die kanadische Regierung die Inuit massiv dazu, sesshaft zu werden. Seitdem kämpfen sie darum, ihre Sprache, das Inuktit, und die alten Traditionen zu bewahren. Bis heute gehen die Männer mehrmals die Woche zum Eisfischen nach Lachsen und jagen Wölfe, Elche oder Robben - wenn auch nicht mehr mit Hunden- sondern mit Motorschlitten. Selbst Pilotin Anouk Alarie hat sich über die Jahre einige Sprachkenntnisse angeeignet. "Kangiqsualujjuaq", der Name des östlichsten Ortes Nunaviks, geht ihr inzwischen problemlos über die Lippen. Der entlegenste und mit 1.000 Einwohnern zugleich größte Ort auf Anouks Flugroute hat allerdings einen einfacheren Namen: Salluit. Hier lebt die Französischlehrerin Mélanie Legare. Eigentlich wollte sie nur ein Jahr bleiben, doch dann verliebte sie sich in ihren heutigen Ehemann Charlie und blieb. Das war vor vier Jahren. DE 2008'
- eventId: 735139
  start: 2026-10-29T18:15:00Z
  stop: 2026-10-29T19:07:00Z
  title: Planet Weltweit - Myanmar, ein Dorf braucht Strom
  subtitle: Planet Weltweit - Myanmar, ein Dorf braucht Strom
  description: |-
    Myanmar, ein Land im Aufbruch. Nach Jahrzehnte langem Dornröschenschlaf können den Burmesen Demokratie und Fortschritt nicht schnell genug kommen. Auch in dem kleinen Dorf Pompein warten die Einwohner ungeduldig auf die Zukunft. Doch mit dem Warten soll es jetzt ein Ende haben. Sie nehmen ihr Schicksal in die eigenen Hände. Angeleitet durch ihren Mönch U Pandita baut das Dorf sich sein eigenes Wasserkraftwerk und will Strom in alle Häuser bringen.
     DE 2012
- eventId: 735140
  start: 2026-10-29T19:15:00Z
  stop: 2026-10-29T20:07:00Z
  title: Wasser ist Zukunft - Der Jordan - Fluss des Friedens?
  subtitle: Wasser ist Zukunft - Der Jordan - Fluss des Friedens?
  description: 'Der Jordan ist die wichtigste Wasserquelle für Jordanier, Israelis und Palästinenser und sowohl eine Wiege der Kulturen als auch Grenzfluss. Immer wieder birgt sein Wasser Grund für Konflikte aber auch für Verhandlungen und Verträge zwischen Israelis und Arabern. Die Dokumentation taucht ein ins Jordantal, die Kornkammer und den Gemüsegarten Israels und Jordaniens, wo die intensive Landwirtschaft dem Fluss das Wasser abgräbt. Am Toten Meer kommt nur noch ein Rinnsal an. Doch in Israel, Jordanien und Palästina gibt es heute Menschen, die den Jordan retten wollen. Als Israel und Jordanien 1994 Frieden schließen, gründet der israelische Umweltschützer Gidon Bromberg gemeinsam mit jordanischen und palästinensischen Partnern die Umweltorganisation EcoPeace. Über alle Grenzen hinweg arbeiten ihre Aktivisten heute nicht nur für den Schutz der Natur, sondern auch daran, das Vertrauen zwischen den Menschen aufzubauen. In Jordanien reaktiviert EcoPeace einen Regenwasserspeicher, um in der Wüste einen Wald wachsen zu lassen. Im palästinensischen Jericho lernen Schüler, wie man mit einfachen Mitteln Haushaltswasser recycelt. In Israel beweisen Fischfarmer, dass sich mit neuen Technologien viele Millionen Liter wertvolles Jordanwasser sparen lassen. Zukunftsperspektiven in noch größeren Dimensionen eröffnen moderne israelische Meerwasserentsalzungsanlagen, die mehr Trinkwasser produzieren als zur Versorgung der Bevölkerung nötig ist. Je weniger Wasser dem heiligen Jordan entnommen werden muss, desto eher kann er wieder werden, was er früher war: die Lebensader des Nahen Ostens. DE 2017'
- eventId: 735147
  start: 2026-10-29T20:15:00Z
  stop: 2026-10-29T21:07:00Z
  title: Inseln der Zukunft - El Hierro - Visionäre am Ende der Welt
  subtitle: Inseln der Zukunft - El Hierro - Visionäre am Ende der Welt
  description: 'El Hierro galt früher als das Ende der Welt. Die kleinste und westlichste der Kanarischen Inseln ist auch eine der kargsten. Sie ist so abgelegen, dass kein Stromkabel dorthin führt. Stattdessen war die Insel auf Strom aus einem schmutzigen Dieselkraftwerk angewiesen. Das war nicht nur schlecht für das Klima, sondern auch teuer. Doch Mitte der 1990er kam der Ingenieur Javier Morales auf eine Idee, die aus dem verschlafenen Eiland einen einzigartigen Ort macht: die erste Insel der Welt, die ihren Strom komplett mit Windkraft erzeugt. Das funktioniert, ganz gleich ob der Wind gerade weht oder nicht. Denn El Hierro hat es geschafft, die Energie für Tage der Flaute zu speichern. Javier Morales ist es gelungen, die Bewohner El Hierros von seinen Plänen zu überzeugen, die Regierung der Kanaren für seine Pläne zu gewinnen und die notwendigen Gelder aufzutreiben. Am Ende wurde der Traum wahr: El Hierro bekam nicht nur leistungsstarke Windgeneratoren, sondern auch ein Pumpspeicherkraftwerk: Überschüssige Windenergie wird genutzt, um Wasser hoch in den Krater eines erloschenen Vulkans zu pumpen. Weht der Wind nicht, fließt das Wasser die Vulkanhänge hinunter und erzeugt dabei Strom in einem Wasserkraftwerk. Ganz nebenbei reicht der Ökostrom auch für eine Meerwasserentsalzungsanlage, ohne die das Leben auf der Insel nicht möglich wäre. El Hierro ist auch zu einem Versuchslabor für die anderen, viel größeren kanarischen Inseln geworden. Gran Canaria mit immerhin einer Million Einwohnern könnte dem Vorbild El Hierros bald folgen. Der Film erzählt aber nicht nur die spannende Geschichte eines Visionärs. Er nimmt den Zuschauer mit in eine atemberaubende Landschaft: karge Vulkane, Europas letzte Lorbeerwälder, die steil abfallenden Küsten, wo Taucher Walhaien und Mantarochen begegnen. Javier Morales'' Einsatz für eine komplett autarke ökologische Stromerzeugung wird dazu beitragen, das Naturparadies El Hierro zu erhalten. Eine Insel der Zukunft. DE 2015'
- eventId: 735149
  start: 2026-10-29T21:15:00Z
  stop: 2026-10-29T22:07:00Z
  title: Inseln der Zukunft - Orkney - Die blaue Revolution
  subtitle: Inseln der Zukunft - Orkney - Die blaue Revolution
  description: 'Nur 10 Kilometer nördlich vom schottischen Festland und doch irgendwie am Ende der Welt: Orkney. Eine karge Naturschönheit aus 70 Inseln, die den Besucher unweigerlich in den Bann zieht. Kaum ein anderer Ort auf der Welt ist dem Meer so ausgesetzt. Riesige Wellen und reißende Gezeiten nagen an der felsigen Küste. Gefährliche Strömungen von vier Metern die Sekunde treten hier auf und Wellen mit einer Höhe von bis zu 19 Metern. Wenn es gelänge, diese gewaltigen Kräfte zu nutzen, dann könnte das eine neue und klimafreundliche Stromquelle für alle Küstenländer der Welt sein. Eine Perspektive, die Ingenieure und Forscher aus aller Herren Länder in die faszinierende Abgeschiedenheit von Orkney lockt. Zu einer weltweit einmaligen Hightechschmiede, die man hier nicht erwartet. Zum Forschungszentrum EMEC: dem "Europäischen Zentrum für Meeresenergie". Hier wird seit zehn Jahren an neuartigen Gezeiten- und Wellenkraftwerken gearbeitet, die im Meer vor Orkney getestet werden. Die Vision: Nach Wind und Sonne endlich auch das Meer zur Stromgewinnung nutzen. Erste Berechnungen haben ergeben, dass sauberer Strom allein aus Orkney ein Drittel aller britischen Atomkraftwerke ersetzen könnte. Der Film zeigt Energie-Pioniere, deren Durchhaltewillen gefragt ist. Sie feiern ihre Erfolge und müssen Rückschläge ertragen. Wenn sie den Durchbruch schaffen, könnte Orkney, eine der schönsten Inselgruppen Europas, unsere globale Energieversorgung verändern. Vielleicht wird Orkney für die Wellen- und Gezeitenstromgewinnung einmal das sein, was das Silicon Valley für die Computerindustrie war: Der Ort, wo alles begann. Die Wiege der blauen Energierevolution. Eine Insel der Zukunft. DE 2015'
- eventId: 735150
  start: 2026-10-29T22:15:00Z
  stop: 2026-10-29T23:07:00Z
  title: Planet Weltweit - Die Samurai von Fukushima
  subtitle: Planet Weltweit - Die Samurai von Fukushima
  description: 'Die Samurai, Japans legendäre Ritter: Zu ihrem Ehrenkodex gehört es, jedem Gegner und dem Schicksal mit Disziplin die Stirn zu bieten - doch gegen die Katastrophe, die 2011 ihre Küsten verwüsteten, waren sie machtlos. Nur mühsam erholt sich das Land vom Tsunami und dem atomaren Gau. Doch in diesem Jahr feiern die Reiter erstmals wieder ihr legendäres Reiterfest.  DE 2013'
- eventId: 735152
  start: 2026-10-29T23:15:00Z
  stop: 2026-10-30T00:07:00Z
  title: Planet Weltweit - Kamelmilch, Kasachstans Wundermedizin
  subtitle: Planet Weltweit - Kamelmilch, Kasachstans Wundermedizin
  description: 'Im zentralasiatischen Kasachstan boomt ein neuer alter Ernährungs-Trend: Kamelmilch. Die Hirten schwören auf ihre heilende Kraft. Mehr und mehr Kasachen entdecken derzeit das Potential der Kamelzucht wieder, denn mit dem Fleisch und der Milch der Herdentiere lässt sich ordentlich Geld verdienen. So sichert eine uralte Tradition vielen Kasachen heute erneut das Überleben. Kasachstan ist der neuntgrößte Flächenstaat der Erde, der überwiegende Teil seines Territoriums besteht aus Steppen, Wüsten und Halbwüsten. Was viele Menschen selbst hier in Zentralasien als unwirtlichen Lebensraum empfinden, ist für Kamelhirten wie den 35-jährigen Berigbai und seine Frau Gulja angestammte Heimat. Die modernen Nomaden und ihre Tiere leben in und von der Wüste, wie einst Jahrhunderte lang ihre Vorfahren. Alles was sie brauchen, haben sie auf den Rücken ihrer Kamele und zwei Autos geladen, samt ihrem transportablen Haus - der Jurte. Der Kamelzüchter Sydyk wiederum macht ein Vermögen mit der Zucht von Kamelen. Die Taukum-Wüste erstreckt sich im Süden Kasachstans. Ihre Fläche entspricht fast der Größe der Schweiz. Sie ist ein idealer Lebensraum für allerlei Arten von Kamelen, deren Zucht langsam aber sicher wieder zu einem wichtigen Wirtschaftszweig im Lande wird. Im Zentrum steht dabei die Milch der Tiere. Seit jeher liefern die Kamele damit das Wichtigste, was Menschen zum Überleben in der Wüste brauchen: ausreichend Flüssigkeit, die außerdem einen hohen Nährwert besitzt. Die Nomaden haben eine Methode entwickelt, die Kamelmilch für lange Zeit haltbar zu machen. Durch Zugabe besonderer Milchsäurebakterien entsteht der so genannte "Kamelmilch-Schubat"; ein leicht säuerliches und sehr beliebtes Getränk, das nicht nur erfrischt und Durst löscht, sondern überdies auch als sehr gesund gilt. Nicht nur in Kasachstan hat sich der Schubat zum neuen Verkaufsschlager entwickelt - und wird sogar zur Behandlung von Kranken eingesetzt. DE 2014'
