- eventId: 766959
  start: 2026-10-29T07:35:00Z
  stop: 2026-10-29T07:55:00Z
  title: Máme hosty
  description: Hudba pomáhá, to je projekt, v jehož rámci se sejde parta přátel, se svým orchestrem vyrazí na koncertní šňůru a každou korunu ze vstupného věnuje vybrané rodině, jejíž člen žije s handicapem, na pomůcky a terapie. Dvacátou sezonu festivalu zahájí v neděli 1. listopadu nejen předprodej vstupenek, ale také premiéra nového dokumentu. Hudba pomáhá po deseti letech vydává druhý díl, který navazuje na snímek z první dekády a připomíná příběhy rodin z uplynulých deseti let. Moderuje Jakub Malý.
