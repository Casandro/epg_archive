  title: Radioporadna
  description: Slyšeli jste o terapii rázovou vlnou? Jedná se o neinvazivní, bezpečnou a účinnou metodu, která svými mechanickými a biologickými účinky na buňky podporuje a urychluje hojení. Stimuluje regeneraci a opravné procesy v kostech, vazivu a dalších měkkých tkáních. Je vhodná především při neakutních a chronických potížích. Jak funguje? To se dozvíme od lékařky Lenky Šuglové, která v Pardubicích vede Kliniku rázové vlny. Moderuje Jitka Slezáková.
