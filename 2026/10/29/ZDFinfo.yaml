  title: Entscheidung auf dem Schlachtfeld
  subtitle: Zülpich - Franken gegen Alemannen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    496 nach Christus: Das Weströmische Reich ist zerfallen. Während germanische Stämme um die Vorherrschaft ringen, spitzt sich der Konflikt zu. Die Entscheidung fällt bei Zülpich.

    Der Merowinger Chlodwig I. führt das fränkische Heer gegen die Alemannen. Er will seine Macht ausweiten und eine strategisch wichtige Region unter seine Kontrolle bringen. Ein Entschluss mitten im Kampf wird weitreichende Folgen für das Machtgefüge in Europa haben.
    HD-Produktion
