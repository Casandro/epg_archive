  title: Entscheidung auf dem Schlachtfeld
  subtitle: Hannibal gegen Rom
  genre:
  - '128'
  widescreen: true
  description: |-
    Frankreich 2023
    Die Schlacht von Cannae 216 vor Christus wird zum Trauma für die römische Armee. Das karthagische Heer unter Hannibal schlägt diese mittels einer List. Die Doku begibt sich auf Spurensuche.

    Obwohl zahlenmäßig überlegen, tappen die Römer in die Falle. Mit der Taktik einer Umfassungsschlacht fügt Hannibal ihnen eine vernichtende Niederlage zu. Sein Ruf als legendärer Stratege ist geboren. Mit Elefanten über die Alpen - das macht Hannibal bis heute berühmt.
    HD-Produktion
