  title: Entscheidung auf dem Schlachtfeld
  subtitle: Sparta gegen die Perser
  genre:
  - '128'
  widescreen: true
  description: |-
    Frankreich 2023
    Als sich Spartas König Leonidas mit 300 Mann der gigantischen persischen Armee entgegenstellt, wird ein Heldenmythos geboren - eine Spurensuche. Wie gelingt die Rettung der Griechen?

    Bei den Thermopylen, einem Engpass an der Ägäis, kommt es 480 vor Christus zum Kampf. Nach drei Tagen endet er in einem großen Opfer. Dank eines Verrats setzt sich die Übermacht des persischen Heers durch. Doch die Verzögerung hat die Kräfteverhältnisse verändert.
    HD-Produktion
