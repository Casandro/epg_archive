  title: Entscheidung auf dem Schlachtfeld
  subtitle: Nagashino - Schicksalstag der Samurai
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Japan 1575: Seit Langem ist das Land in zahllose Territorien zersplittert. Rivalisierende Clans kämpfen um die Vorherrschaft. Bei Nagashino kommt es zur Entscheidungsschlacht.

    Oda Nobunaga und Tokugawa Ieyasu stellen sich dem mächtigen Takeda-Clan. Dessen Reiter wollen die Belagerung der Burg von Nagashino brechen. Doch Nobunaga setzt auf eine neuartige Waffe aus Europa. Sie wird die Kriegsführung der Samurai für immer verändern.
    HD-Produktion
