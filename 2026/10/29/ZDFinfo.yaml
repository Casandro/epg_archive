  title: Entscheidung auf dem Schlachtfeld
  subtitle: Katalaunische Felder - Attila gegen die Römer
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    451 nach Christus stellt sich ein Bündnis unter dem römischen Heerführer Flavius Aëtius dem berüchtigten Hunnenkönig Attila entgegen - eine Schlacht entbrennt, die Geschichte schreibt.

    Die Hunnen, ein Reitervolk aus Zentralasien, versetzen seit Mitte des 4. Jahrhunderts Europa in Angst und Schrecken. Nach der Plünderung mehrerer großer Städte kommt es zur erbitterten Schlacht zwischen den beiden mächtigen Gegnern.
    HD-Produktion
