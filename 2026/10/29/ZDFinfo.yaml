  subtitle: Antiochia - Im Namen des Kreuzes
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Die Kreuzfahrer verfolgen ein klares Ziel: den Weg nach Jerusalem zu öffnen. Dafür müssen sie zunächst Antiochia einnehmen - eine strategisch wichtige Stadt.

    Sie verfolgen damit ein Vorhaben, das religiöse Motivation und europäische Machtinteressen miteinander verbindet. Doch kaum ist Antiochia erobert, stehen die Kreuzfahrer einem neuen, mächtigen Gegner gegenüber: dem Herrscher von Mossul.
    HD-Produktion
