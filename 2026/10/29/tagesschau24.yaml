  title: 'rbb24 Reportage: Waffen, Wedding, Widerstand'
  subtitle: Rheinmetall im Kiez
  description: |-
    Mitten im Wedding steht seit diesem Sommer eine Waffenfabrik. Wo bislang Autoteile vom Band liefen, baut Rheinmetall nun Vorprodukte für weltweit gefragte Artilleriemunition und Kamikazedrohnen. NATO-Draht, Überwachungskameras und Security-Personal sichern das Gelände. Gleich nebenan: Eine Grundschule, ein Schwimmbad und hunderte Anwohner.

    "Wie stehst du zur Aufrüstung, wenn sie ganz nah ist?" - dieser Frage können die Anwohner der Waffenfabrik nicht mehr aus dem Weg gehen.

    Ein intimer Blick in einen Kiez, der wie ein Brennglas ist für eine der drängendsten Fragen der Zeit, nämlich die nach Krieg und Frieden.
