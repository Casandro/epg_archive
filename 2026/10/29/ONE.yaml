  description: "Ausstrahlung auch im englischen Originalton \n\nCary erfährt, dass seine Mutter noch am Leben ist - der Schmerz seiner Kindheit basierte auf einer unerträglichen Lüge seines Vaters. Cary bringt die Mutter in einer komfortablen Wohnung in Bristol unter. Seine Beziehung zu Dyan gerät jedoch ins Wanken, da Cary mehr und mehr versucht, sie zu kontrollieren. Cary verliert sich in Drogen und äußert sich abfällig über Dyans Auftritte in einer Fernsehshow. Es kommt zum Streit und sie verlässt ihn. Das ist der Weckruf für Cary - er versucht, die Beziehung zu retten und macht ihr einen Heiratsantrag."
