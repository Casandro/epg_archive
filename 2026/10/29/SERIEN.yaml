  title: Borgia - Die Schlange erhebt sich
  subtitle: Borgia - Die Schlange erhebt sich
  description: 'Betrunken lauert Cesare Juan auf, es kommt zum Streit. Als tags darauf Juans Leichnam gefunden wird, fürchtet Cesare, den eigenen Bruder getötet zu haben. Rodrigo versinkt in Trauer und bricht mit Giulia. Lucrezia gesteht Cesare, gemeinsam mit ihrem Geliebten Pedro Juan ermordet zu haben. Vor aller Augen ersticht Cesare Pedro. Rodrigo fürchtet sich vor der Gewalt, die seinen Namen trägt: Borgia. FR 2011'
  ageRating: 16
- eventId: 732220
  start: 2026-10-29T22:05:00Z
  stop: 2026-10-29T23:02:00Z
  title: Borgia - Die Zeit des süßen Verlangens
  subtitle: Borgia - Die Zeit des süßen Verlangens
  description: In Neapel hat Cesare sich in Carlotta verliebt, deren Herz jedoch Guy de Leval gehört. Versteckt im Haus ihrer Mutter Vannozza, erwartet Lucrezia unterdessen Pedros Kind. Rodrigo lernt die geheimnisvolle Substanz Vitriolo kennen, die ihm helfen soll, seine Trauer nach Juans Tod zu überwinden. Mit einem machtvollen Zeichen beweist Rodrigo seinen Feinden, dass seine Zeit noch nicht vorbei ist. FR 2012
  ageRating: 16
- eventId: 732221
  start: 2026-10-29T23:10:00Z
  stop: 2026-10-30T00:05:00Z
  title: Borgia - Aschermittwoch
  subtitle: Borgia - Aschermittwoch
  description: Rodrigos Erzfeind Della Rovere erhebt böse Anschuldigungen gegen dessen Sekretär Gacet. Rodrigo bittet Alessandro Farnese, Giulia nach Rom zurückzuholen. Lucrezia willigt ein, ihren neugeborenen Sohn Giovanni Giulia zu überlassen, die ihn als ihr Kind mit Rodrigo ausgibt. Zugleich plant Rodrigo Lucrezias Vermählung mit Alfonso di Calabria, dem von Cesare verachteten Neffen des Königs von Neapel. FR 2012
  ageRating: 16
