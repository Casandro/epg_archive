  title: Borgia - Vorboten der Apokalypse
  subtitle: Borgia - Vorboten der Apokalypse
  description: Da Rodrigo Lucrezia die Scheidung vom impotenten Giovanni Sforza verweigert, will sie ihren Mann vergiften. Als die Colonna Ostia erobern und die französische Flagge hissen, lässt Rodrigo deren Anführer Marcantonio exkommunizieren. Um Frieden zu stiften, liefert Rodrigo Cesare den Colonna als Geisel aus. Aus Angst vor den Franzosen zieht Rodrigo sich mit seiner Familie in die Engelsburg zurück. FR 2011
  ageRating: 16
- eventId: 735113
  start: 2026-10-29T01:45:00Z
  stop: 2026-10-29T02:39:00Z
  title: Borgia - Die Invasion von Rom
  subtitle: Borgia - Die Invasion von Rom
  description: Lucrezia wird vom impotenten Giovanni Sforza geschieden. Als Rodrigo den Franzosen freies Geleit gewährt, kommt Cesare frei. Er vermittelt zwischen dem Papst und Karl VIII. Nach seiner Niederlage kehrt Juan heimlich zurück nach Rom, wo es zum Konflikt mit Cesare kommt. Während Cesare Karl zum König von Neapel krönt, schmiedet Rodrigo einen Heiligen Bund, der Frankreich aus Italien verbannen soll. FR 2011
  ageRating: 16
- eventId: 735114
  start: 2026-10-29T02:45:00Z
  stop: 2026-10-29T03:39:00Z
  title: Borgia - Wunder
  subtitle: Borgia - Wunder
  description: Auf dem Weg nach Neapel sitzt die französische Streitmacht fest. Der osmanische Prinz Cem, der gemeinsam mit Cesare die Reise angetreten hatte, erkrankt und stirbt im Feldlager. Juan will sich an Lucrezia rächen, die ihn aber verhöhnt. FR 2011
  ageRating: 16
- eventId: 735127
  start: 2026-10-29T03:45:00Z
  stop: 2026-10-29T07:25:00Z
  title: Borgia - Gottes Ungeheuer
  subtitle: Borgia - Gottes Ungeheuer
  description: Lucrezia will Nonne werden, doch der Soldat Pedro überzeugt sie in Rodrigos Auftrag, das weltliche Leben nicht aufzugeben. Als Juan beichtet, sitzt Cesare im Beichtstuhl und erfährt so von Juans Missetaten. Carafa überzeugt Rodrigo, anstelle von Juan Federigo D'Aragona zum König von Neapel zu krönen. Cesare begreift, dass sein tot geglaubter Sohn lebt, und bricht für immer mit Alessandro Farnese. FR 2011
  ageRating: 12
