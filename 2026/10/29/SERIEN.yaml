  title: Cedar Cove - Das Gesetz des Herzens - Alles auf Anfang
  subtitle: Cedar Cove - Das Gesetz des Herzens - Alles auf Anfang
  description: Grace geht gegen ihren Ex-Mann Dan vor Gericht und Olivia führt die Verhandlung. Sie entwickelt einen Plan, um ihrer Freundin zu helfen. Jack gerät in inneren Konflikt, als sein Boss ihn beauftragt,, einen lobenden Artikel über den Baulöwen Warren Saget schreiben. Justine ist dabei, sich selbst zu überfordern, als sie versucht, ihren neuen Freund Luke zu unterstützen, einen Neuanfang zu finden.  US 2013
  ageRating: 6
- eventId: 735130
  start: 2026-10-29T07:30:00Z
  stop: 2026-10-29T07:35:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Neue Perspektiven
  subtitle: Cedar Cove - Das Gesetz des Herzens - Neue Perspektiven
  description: Luke landet nach einem schweren Wutausbruch im Gefängnis und verliert all seine neuen Zukunftsaussichten. Noch immer will Justine dem kriegstraumatisierten Afghanistan Veteranen zur Seite stehen, doch der weist sie zurück. Olivia sorgt sich deshalb um ihre Tochter. Jack kann sich unterdessen nicht mit Erics neuem Job abfinden. Er arbeitet ausgerechnet auf einer von Warrens Baustellen. US 2013
- eventId: 735131
  start: 2026-10-29T07:35:00Z
  stop: 2026-10-29T07:40:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Irgendwann, eines Tages
  subtitle: Cedar Cove - Das Gesetz des Herzens - Irgendwann, eines Tages
  description: Jack, beobachtet besorgt, dass Eric sich immer stärker in Abhängigkeit zu Warren begibt, der ihm sogar anbietet, mietfrei in eines seiner Häuser zu ziehen. Während Olivia den schwierigen Prozess gegen Luke leitet, taucht die Reporterin Jeri auf, die offensichtlich eine wichtige Rolle in Jacks Vergangenheit gespielt hat. Jeri bringt Jacks Alkoholsucht wieder ins Spiel.  US 2013
