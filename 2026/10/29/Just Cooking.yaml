  title: Die besten Köche der Welt - Zu Gast im Ikarus - Hans Neuner
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Hans Neuner
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Arbeitet Sternekoch Hans Neuner nicht gerade in seiner Zwei-Sterne-Küche des Restaurants "Ocean", fährt er am liebsten auf seiner Harley über die Straßen der Algarve. Das passt zu dem Freigeist, der seine Kochkarriere im elterlichen Betrieb in Leutasch in Tirol begonnen hatte. Heute kocht er in Portugal. Aus dem kleinen Restaurant Ocean im Hotel Vila Vita Parc zwischen Faro und Sagres gelegen machte er eine Topadresse. Zwei Michelin-Sterne sprechen für sich - und reichen Hans Neuner natürlich auch noch nicht. Er bedient sich vor Ort, sämtliche Zutaten kommen aus dem Meer vor der Algarve oder aus inländischen Anbaugebieten. Dazu gehören auch Spezialitäten wie die Perceves, die Entenfußmuscheln oder Muränen, deren Zubereitung ganz besonderes Know How erfordert. AT 2014'
