  title: Mein wunderbarer Kochsalon - Gebratener Reis mit Gemüse und Ei
  subtitle: Mein wunderbarer Kochsalon - Gebratener Reis mit Gemüse und Ei
  description: Wenn ich meinen Kindern Gemüsereis anbiete, rümpfen sie angewidert die Nase und werfen den Toaster an. Gibt es Fried Rice, schaut die Situation komischerweise ganz anders aus. Mit Ei und Sojasauce jubel ich ihnen so gut wie jeden Gemüserest unter. Eines unserer Lieblingsrezepte, geht schnell und ist eine der besten Resteverwertungen, die ich auf Lager habe. AT 2020
