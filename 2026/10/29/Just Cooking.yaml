  title: Mein wunderbarer Kochsalon - Polentakuchen mit Orange und Rosmarin
  subtitle: Mein wunderbarer Kochsalon - Polentakuchen mit Orange und Rosmarin
  description: Normalerweise kommt mein Mann zum Essen in die Küche. Oder, um mir einen Cappuccino zu machen. Diesmal war er allerdings aktiv mit am Werk, seine Ambition machte mir etwas Angst, auch nach vielen Ehejahren ist der gemeinsame Auftritt am Herd etwas ganz Neues. Meine Sorge, das Ganze endet entweder in einem Riesenstreit oder in einem Kuchendesaster, war völlig unbegründet - voller Harmonie arbeiteten wir gemeinsam an diesem glutenfreien Polentakuchen. Vielleicht sollten wir das öfter machen, das Ergebnis spricht dafür. AT 2020
