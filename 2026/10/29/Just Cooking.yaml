  title: Mein wunderbarer Kochsalon - Malteser-Schokotorte ohne Backen
  subtitle: Mein wunderbarer Kochsalon - Malteser-Schokotorte ohne Backen
  description: Einmal im Jahr bekommen meine Kinder ein Tutorial in "How to please my mother". Da heißt es aufpassen und mitmachen, weil die Erwartungshaltungen sind groß - die Muttertagstorte wird traditionell alleine von den Kindern produziert, nach einer ausgiebigen Übungsstunde. Diesmal gibt es einen Schokoladen-Cheesecake mit Maltesers, da kann man nicht viel falsch machen. Außer, zu wenige Maltesters einkaufen, mindestens die Hälfte davon haben die Kinder während der Entstehungsphase gejausnet. AT 2020
