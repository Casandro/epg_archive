  description: 'Vlada sutra donosi uredbu o minimalnoj plaći za iduću godinu. Sindikati traže 1250 eura bruto, poslodavci predlažu 1086 eura bruto, uz daljnje porezno rasterećenje i povećanje osobnog odbitka. Kakva će biti odluka Vlade? Kako se danas u Hrvatskoj živi s minimalnom plaćom? Gosti su: Ivan Vidiš, državni tajnik u Ministarstvu rada, mirovinskog sustava, obitelji i socijalne politike, Hrvoje Stojić, glavni ekonomist Hrvatske udruge poslodavaca, Dražen Jović, predsjednik Nezavisnih hrvatskih sindikata, Viktor Viljevac, makroekonomist, Ekonomski fakultet u Zagrebu.'
