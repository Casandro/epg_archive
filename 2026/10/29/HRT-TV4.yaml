  description: 'U Drugoj strani govorimo o ruskom gospodarskom paradoksu. Međunarodne sankcije nisu bacile Rusiju na koljena nego potakle najveći zabilježeni rast gospodarstva još od raspada Sovjetskog Saveza. Kako je to moguće? Što je istina, a što ruska propaganda? Nakon raspada Sovjetskog Saveza, Rusija je bila odlično mjesto za stjecanje, ali ne i za čuvanje novca. Bogatstvo zgrnuto na nafti, plinu, rudama i bankama uvijek je našlo svoj put do londonskih nekretnina, švicarskih bankovnih računa i offshore kompanija. Imovina u inozemstvu pružala je bogatim Rusima ono što je kod kuće bilo upitno: sigurnost i vlasništvo. Zapadne sankcije to su potpuno preokrenule. Ruska imovina može biti zamrznuta, transakcije blokirane, a ulaganja u inozemstvo teška za upravljanje. Ekonomske posljedice neočekivane. Više nije trebalo uvjeravati domaće investitore da ulažu lokalno i ne iznose novac iz zemlje. Domaća ulaganja u dugotrajnu imovinu rasla su od 2022.-2024. po stopi od 9% godišnje! Poduzetnici su silom prilika gradili tvornice, gradove, ulagali u razvoj usluga i razvoj domaćeg tržišta i domaćih kupaca. Malo im je pomogla i državna vojna potrošnja, i statistički uspjeh nije izostao. Za vrijeme Putinove vlasti ruska ekonomija prosječno rasla je 6-7% godišnje, siromaštvo se smanjilo za 50%, a prosječna plaća je sa 80 skočila na 750 dolara. Ako je vjerovati podacima Svjetske banke, ruski BDP po glavi stanovnika nikad nije bio veći... još od raspada Sovjetskog Saveza. Rusko gospodarsko čudo analizira filozof, sociolog, političar i bivši hrvatski veleposlanik u Rusiji, Božo Kovačević. Urednik i voditelj:Željko Kardum'
