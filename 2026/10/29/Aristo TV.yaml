  title: ANIXE auf Reisen - Costa Rica mit Hannes Jaenicke
  description: 'Das mittelamerikanische Land zwischen karibischem Meer und pazifischem Ozean gilt als einzigartiges und extrem artenreiches Naturparadies. Von den Vulkanen im Zentralmassiv bis in den Regenwald der südlichen Landesteile an der Grenze zu Panama begleitet uns der Schauspieler Hannes Jaenicke. Er kennt Costa Rica mit seiner außergewöhnlichen Biodiversität bereits wie seine Westentasche. Ebenso wie sein TV-Kollege Daniel Rösner, der sich Jaenicke auf dessen Streifzügen anschließt. Ob Wildwasser-Rafting auf dem Pacuare River, eine Stippvisite beim indigenen Volk der Bribri oder Exkursionen tief in den immergrünen Regenwald: Die Reportage ist gespickt mit touristischen Highlights und somit ein Leckerbissen für alle Fans des nachhaltigen Reisens.'
