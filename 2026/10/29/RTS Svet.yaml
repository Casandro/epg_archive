  description: 'Narodni poslanik i državni savetnik, profesor i ministar prosvete, kraljev prijatelj i bibliotekar, Dobroslav Dobra Ružić pripada onim generacijama mladih, željnih znanja, a privrženih svojoj domovini, koji su krajem 19. veka odlazili u svet, školovali se i vraćali kao profesori, lekari, naučnici, književnici... Dobra je rođen 1854. godine u Čačku, gimnaziju je učio u Beogradu i Novom Sadu, a u Minhenu, Lajpcigu i Jeni studirao prirodne nauke. Bio je privržen dinastiji Karađorđevića i zbog svojih uverenja nekoliko puta robijao, a sasvim slučajno, na početku Prvog svetskog rata, pronašao zagubljeno Miroslavljevo jevanđelje. Ali, Dobrina biografija obiluje i drugim, važnim detaljima: on je bio pedagog izuzetnih dometa, kreator obrazovnih metoda, čvrsto uveren u moć nauke i pozitivističku filizofiju, deo onog sjajnog naraštaja školovanog u Cirihu, Minhenu i Jeni, a u političkom usmerenju dosledan i žestok u odbrani svojih stavova. I da ništa više i drugo nije uradio, Dobra bi bio u...'
