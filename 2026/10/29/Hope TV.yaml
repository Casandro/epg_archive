  title: Leben und Gesundheit
  subtitle: Wenn Schmerz dich lähmt
  description: |-
    "Ich würd ja gern, aber..." - Schmerzen sind für viele eine echte Hürde, wenn's ums Thema Bewegung geht. Manchmal ist der Schmerz real, manchmal eine bequeme Ausrede. In beiden Fällen gilt: Bewegung kann helfen. Nicht als Leistungssport, sondern als heilsamer Impuls - im Alltag, mit kleinen Schritten, angepasst an den Körper. In dieser Folge spreche ich mit Dr. Martin Matyk über Denkfehler, Schmerzvermeidung und warum es sich lohnt, trotzdem in Bewegung zu bleiben. Für mehr Lebensqualität, mehr Selbstwirksamkeit - und vielleicht sogar weniger Schmerz.

