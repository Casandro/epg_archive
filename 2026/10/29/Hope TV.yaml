  title: Bibelkompass
  subtitle: Warum jeder Vergebung braucht
  description: |-
    Sünde ist mehr als ein Fehlverhalten. Jesus macht deutlich, dass sie im Herzen beginnt: in Gedanken, Motiven, Wünschen und einer Entfremdung von Gott. Darum reicht es nicht, nur äußeres Verhalten zu verbessern. Jeder Mensch braucht Vergebung und ein neues Herz. Die Bibel zeigt: Sünde trennt von Gott, aber Jesus durchbricht diesen Kreislauf. Wer mit seiner Schuld zu ihm kommt, findet nicht nur Vergebung, sondern auch die Kraft zu echter Veränderung. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

