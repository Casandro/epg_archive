  title: ungeschminkt. family
  subtitle: Über den Tod spricht man nicht?
  description: |-
    Über den Tod spricht man nicht? Oder vielleicht gerade doch? In dieser Folge von "ungeschminkt family" geht es um ein Thema, das viele Familien gerne verdrängen: den eigenen Tod. Wie verändert sich der Blick darauf mit zunehmendem Alter? Warum fällt es uns so schwer, über Beerdigung, letzte Wünsche und das Lebensende zu sprechen? Und was möchten wir unseren Kindern und Angehörigen eigentlich hinterlassen? Ein ehrliches Gespräch über Abschied, Vorsorge, Erinnerungen und ein gutes Ende.

