  title: Clic
  subtitle: 200 Jahre Bergführerwesen - Wo sind die Frauen?
  description: |-
    Im Jahr 1826 wurde der Grundstein für den Beruf des Bergführers in der Schweiz gelegt. 30 Jahre später, 1856, wurden die ersten beiden Schweizer Führer diplomiert. Bis die Frauen diesen Beruf auch ausüben durften, dauerte es aber. Erst 1986 wurde Nicole Niquille die erste Bergführerin der Schweiz.
    Schweiz 2026
