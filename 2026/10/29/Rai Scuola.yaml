    Amarcord - Le Alpi di Messner - Isole: Lipari - Orizzonti di ghiaccio" Scritto e diretto da Carlo Alberto Pinelli.
    Il documentario ripercorre storia, morfologia ed epopea alpinistica del Monte Rosa, massim
  description: "o massiccio delle Alpi e più vasto acrocoro glaciale d'Europa, illustrandone dimensioni, bacini glaciali, vette oltre i 4.000 metri e la spettacolare parete Est, unica nelle Alpi per caratteristiche himalayane. La conclusione esalta la solitudine e la maestosità del Monte Rosa, richiamando la necessità di considerarlo non solo terreno di conquista sportiva, ma patrimonio culturale e naturale da rispettare e preservare nella sua integrità naturale.\nA seguire, un programma mai più trasmesso di Sandro Bolchi del 1983. A introdurre il mondo eoliano è il regista Folco Quilici, che sottolinea la posizione strategica e le ricchezze del territorio, per secoli crocevia e area contesa nel Mediterraneo. Lipari vanta una lunga storia, testimoniata dagli insediamenti preistorici e dalle necropoli greco-romane, tra le più antiche della Sicilia. \n\n - ,"
