  description: Die Pilgerstadt Lourdes liegt in den französischen Pyrenäen, nahe der spanischen Grenze. Mehr als 3,5 Millionen Menschen aus aller Welt besuchen jährlich die Wallfahrtskirche Notre-Dame de Lourdes. 1858 erschien die Jungfrau Maria der 14jährigen Bernadette Soubirous 18 Mal in der Grotte von Massabielle nahe Lourdes. Nachdem die katholische Kirche den Ort als Pilgerstätte anerkannt hatte, wurde dort einer der größten christlichen Komplexe errichtet.
