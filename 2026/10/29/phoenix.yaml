  title: SOS Karibik
  subtitle: Klimaalarm im Inselparadies
  description: "Die Karibik ist mit ihrem kristallklaren Wasser und den perfekten Puderzuckerstränden ein Sehnsuchtsort für Touristen aus aller Welt. Doch dieses Paradies voller Korallen und Meerestieren leidet besonders unter dem Klimawandel. \n\nDie Erwärmung der Meere feuert die Wirbelstürme an, die mit stärkster und vernichtender Kraft Tod und Zerstörung bringen, besonders für die kleinen Inseln, wie Dominica. Auch dichte Teppiche der Sargasso Algen sprießen durch die warmen Meere. Darunter leiden besonders Schildkröten, sie haben es schwer Auf- und Abzutauchen, ersticken so im Meer oder verenden in der Sonne."
