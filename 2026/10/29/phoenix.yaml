  title: Napoleons Erbe
  subtitle: Wunderwerke der Architektur
  widescreen: true
  hd: true
  description: Der französische Kaiser Napoleon I. gilt als großer Feldherr und Reformer. Dass er den Anstoß zur Errichtung wichtiger Gebäude gab, ist weniger bekannt. So haben ihm die Einwohner von Paris neben dem Arc de Triomphe, der Vendome-Säule, dem Palais de la Bourse, der Kirche La Madeleine auch den Bau mehrerer Brücken und Kanäle zu verdanken. Bei der Errichtung dieser imposanten Bauwerke verwendeten Architekten und Baumeister auch bis dahin unbekannte Materialien und neue Konstruktionsmethoden.
