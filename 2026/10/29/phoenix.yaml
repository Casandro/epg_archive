  title: Verlorene Schätze
  subtitle: Das Erbe des Assyrischen Reiches
  widescreen: true
  hd: true
  description: "2014 zerstören IS-Terroristen in Mossul große Teile des archäologischen Erbes aus assyrischer Zeit. Unter den Trümmern entdecken Forschende Überreste eines monumentalen Königspalastes. \n\nDie Artefakte stammen aus der Zeit König Sanheribs und zeugen von der weit entwickelten Kultur der Assyrer. Ausgeklügelte Bewässerungssysteme versorgten prachtvolle Gartenanlagen. Handelt es sich um die legendären Hängenden Gärten von Babylon?\n\nDavon zumindest ist die britische Assyriologin Stephanie Dalley überzeugt."
