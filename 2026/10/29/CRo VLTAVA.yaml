  title: Betonový lidi
  description: Nové vize. Poslední epizoda série Betonový lidi se zamýšlí nad transformací panelových sídlišť pro současnost a budoucnost. Epizoda s názvem "Nové vize" nás zavádí mimo jiné do Zlína na sídliště Jižní svahy. Historik Ondřej Ševeček vysvětluje, jak tamní sídliště navazují na baťovské principy industrializace a bydlení. V doprovodném rozhovoru rozebírá Vladimír 518 s architektem Michalem Burákem výjimečnou aktualizaci panelové ubytovny Kosmalt v Košicích.
