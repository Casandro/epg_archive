  stop: 2026-10-29T10:00:00Z
  title: Vizitka
  description: 'Eva Ješutová, archivářka, rozhlasačka. Dlouhá léta vedla Archivní a programové fondy Českého rozhlasu a letos byla na festivalu rozhlasové tvorby Prix Bohemia Radio uvedena do Síně slávy. Do rozhlasu nastoupila hned po studiích v roce 1981 a zůstala mu věrná až do odchodu do penze. Významně se podílela na digitalizaci archivních fondů, odborných rešerších, výročních projektech i publikacích mapujících historii rozhlasového vysílání. Jak se za uplynulá desetiletí proměnil rozhlas i práce s jeho pamětí? A dokáže si představit život, v němž by rádio nehrálo žádnou roli? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
