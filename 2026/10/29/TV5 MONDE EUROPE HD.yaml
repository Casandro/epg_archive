  title: 'Cécile Kohler / Manifestations des lycéens / Ventes de camping-cars '
  subtitle: 'Pendant 1 277 jours, Cécile Kohler et Jacques Paris ont été otages en Iran. Cécile Kohler témoigne. En France, durant la mobilisat '
  ageRating: 7
  description: "Au sommaire : \n\n1 277 jours dans l'enfer des geôles iraniennes\nPendant 1 277 jours, Cécile Kohler et Jacques Paris ont été retenus en otage en Iran. Arrêtés alors qu'ils terminaient un voyage touristique, ces deux professeurs français ont vécu près de quatre années d'enfermement, d'isolement et d'incertitude, au coeur d'un pays secoué par les manifestations, la répression et la guerre.\nReportage : Romain Boutilly, Mathieu Rénier, Mathieu Parmentier\nInvitée : Cécile Kohler\n\nÉlève mutilé, un lycée sous le choc\nLens, Pas-de-Calais, lundi 5 octobre 2026. Alors que la mobilisation des lycéens battait son plein en France, Evan, 15 ans, a été grièvement blessé. Il était scolarisé en seconde au lycée professionnel Auguste-Béhal. La main de l'adolescent sera finalement amputée après l'explosion d'une grenade assourdissante tirée par les forces de l'ordre. Une enquête de la police des polices, l'IGPN, est en cours. Le reporter Arnaud Muller s'est rendu au lycée Auguste-Béhal, où élèves et personnels éducatifs sont sous le choc. \nReportage : Arnaud Muller, Léo Lochman\n\nVacances, comme un van de liberté\nDepuis la crise du Covid, les ventes de camping-car ou van aménagé explosent. Aujourd'hui, ces maisons roulantes représentent plus de la moitié des véhicules de loisirs vendus en Europe. \nReportage : Laure Delalex, Florent Bardos, Grégoire Manoukian, Mikael Bozo\n\nPrésentation : Élise Lucet\n "
