  title: 'Piratage frigorifique / Guy Parmelin / Élections américaines / GTA '
  subtitle: 'Une cyberattaque frigorifique a fait perdre des tonnes de nourriture à deux cents supermarchés français. Qui remplacera le conseil '
  description: "Au sommaire : \n\nC'est que le début : piratage frigorifique\nUne cyberattaque frigorifique a fait perdre des tonnes de nourriture à deux cents supermarchés français. Une attaque qui pose des questions de sécurité alimentaire.\n\nWelsche Kandidatin\nQui remplacera le conseiller fédéral vaudois Guy Parmelin ? A l'UDC, les Romands se mobilisent et la genevoise Céline Amaudruz se prépare face aux candidatures alémaniques. Reste encore à prouver à l'échelle nationale que l'appartenance romande est vraiment d'importance.\n\nÉtat critique\nLes élections de mi-mandat pourraient faire basculer le congrès américain. A deux semaines d'un scrutin qui divise toujours plus les Américains et avec de nombreuses incidences à la clé pour le monde entier, nous irons dans le Colorado, ou certains républicains regrettent d'avoir voté Trump.\nInvité : Sébastien Faure, journaliste\n\nÇa joue ou bien ?\nC'est le premier jeu vidéo majeur qu'on ne pourra pas posséder physiquement sur Playstation. Derrière la sortie du poids lourd de l'industrie, le très attendu GTA, le spectre d'une dématérialisation à large échelle, dans tous les domaines culturels. La propriété numérique en question...\n\nPrésentation : Catherine Sommer\n "
  ageRating: 7
  genre:
