  title: Mayday - Der Stealthbomber-Crash
  subtitle: Mayday - Der Stealthbomber-Crash
  description: Der Nurflügler B-2 ist eines der modernsten Kampfflugzeuge der US Air Force. Im Februar 2008 kommt es bei einem Routinestart des Stealthbombers auf der Pazifikinsel Guam zur Katastrophe. Das Milliarden US-Dollar teure Fluggerät explodiert auf der Startbahn. In letzter Sekunde können sich die beiden Piloten per Schleudersitz aus dem Cockpit retten. So lange die Ermittler nicht herausfinden, wie es zu der unerklärlichen Havarie kam, muss die gesamte B-2-Flotte der Supermacht am Boden bleiben.
  widescreen: true
