  subtitle: Lost Places - Folge 97
  description: Wie ein Spinnennetz aus Stahl schweben die Seilbahnen über Tschiatura, Georgiens einst blühender Bergbaustadt. Ehemals pulsierende Adern, die Arbeiter zu den Minen brachten, sind sie heute stille Zeugen des Niedergangs. Viele Einwohner verließen die Stadt, und das "Venedig der Lüfte" verfiel zur Geisterstadt. Was geschah mit diesem einzigartigen Ort?
