  title: Held des Ackers - Ein Hightech-Traktor entsteht
  subtitle: Held des Ackers - Ein Hightech-Traktor entsteht
  description: 'Er gilt in Fachkreisen als ein Traktor-Modell mit besonders nachhaltiger Technologie: der Axion 960 CEMOS. Die Maschine benötigt bis zu 20 Prozent weniger Kraftstoff bei einer Leistung von maximal 445 PS. In Frankreich baut ein deutsches Landmaschinenunternehmen verschiedene Baureihen dieser nachhaltigen Traktoren. Die Ingenieure haben diese durch fortschrittliche Material- und Fertigungstechniken mit einer intelligenten Reifendruckregelanlage und einem selbstlernendes Dialogsystem ausgestattet.'
