  title: Mayday - Im Nebel
  subtitle: Mayday - Im Nebel
  description: Es ist ein nebliger Tag am 3. Dezember 1990 in Detroit. Die Crew einer DC-9-Maschine verliert im Nebel die Orientierung und landet auf einer Startbahn, auf der ihr ein anderes Flugzeug entgegenkommt. Beim Zusammenprall sterben acht Menschen. Die Ermittler untersuchen den Unfall und entdecken unglaubliche Details über die Piloten.
  widescreen: true
