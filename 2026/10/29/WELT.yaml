  title: Mayday - Gefährliches Handgepäck
  subtitle: Mayday - Gefährliches Handgepäck
  description: 'August 1999: Eine Passagiermaschine ist auf dem Weg zur kleinen, bei den Einheimischen beliebten Urlaubsinsel Hualien. Beim Landeanflug hat der Co-Pilot Probleme, sodass der Captain übernehmen muss. Er landet die Maschine, als plötzlich eine Explosion das Flugzeug erschüttert und ein großes Feuer aufflammt. Die Passagiere und Crew bangen um ihr Leben.'
  widescreen: true
