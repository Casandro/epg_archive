  title: Lost Places - Folge 98
  subtitle: Lost Places - Folge 98
  description: Die Burg Houska in Tschechien, erbaut im 13. Jahrhundert direkt über dem "Tor zur Hölle", ist bis heute ein mystischer Ort voller düsterer Legenden. Es heißt, die Nazis hätten hier bis 1945 geheime Experimente durchgeführt. Sind das bloß Gruselgeschichten? Zudem das einstige Prunkstück Liberias, das 5-Sterne-Hotel Ducor in Monrovia. Ehemals ein Symbol des afrikanischen Aufschwungs, ist es heute nur noch eine Ruine - ein stummes Zeugnis vergangener Glanzzeiten.
  widescreen: true
