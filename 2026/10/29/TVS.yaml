  title: Rosamunde Pilcher - Mgła nad zamkiem Kilrush
  subtitle: Po tragicznej śmierci narzeczonego Keira wycofuje się z życia i zamieszkuje w rodzinnej posiadłości na południu Irlandii. Jej ojciec zatrudnia tam amerykańskiego szepta koni Patricka O'Connella.
