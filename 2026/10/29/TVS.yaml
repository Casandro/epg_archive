    To opowieść o lecie. Lato w Freeport, malowniczej wiosce rybackiej na wybrzeżu południowo-zachodniej Anglii. Linda Hewitt mieszka z córką Vanessą i ojcem Jackiem w Lilac House, posiadłości na obrzeżach Freeport. Linda, odnosząca sukcesy fotografka, ma swoje życie pracującej kobiety i matki pod kontrolą, gdy do jej życia wkracza mężczyzna. Thomas Williams jest ornitologiem i przybywa do Freeport z zamiarem badania populacji rybitwy.
