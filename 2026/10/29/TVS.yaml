    DE
    Reżyseria: Peter Weissflog
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser
    Doktor Christian Kleist, główny bohater, po śmierci żony Susanne przenosi się z szesnastoletnią Lisą i dwunastoletnim Peterem do spokojnego Eisenach, by zacząć nowy etap życia. Na miejscu otwiera własny gabinet lekarski, a dzięki życzliwości i empatii szybko zdobywa sympatię mieszkańców oraz burmistrza. Poznaje nowych ludzi, a po latach odnawia też kontakty z dawnymi kolegami i przyjaciółmi.
