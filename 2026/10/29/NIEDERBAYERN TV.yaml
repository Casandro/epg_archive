  description: "In Zeiten der Digitalisierung: So bleiben Bibliotheken auch heute noch attraktiv\nDen neuen Roman bequem nach Hause liefern lassen, den Wunsch-Thriller als E-Book lesen oder die Tageszeitung in einer App durchblättern. In unserem digitalen Zeitalter sind viele Texte nur noch einen Klick entfernt. Meinen könnte man, dass da die Bibliotheken mehr und mehr an Relevanz verlieren würden. Dass das so gar nicht der Fall ist zeigte der Tag der Bibliotheken. In die Landshuter Stadtbücherei verschlägt es neuerdings nämlich auch Fans von Escape-Rooms.   \n\nGruselspaß in Wörth - Spooky Corner lädt zum Erschrecken ein\nWenn sich der Oktober dem Ende neigt, hält ein alter irischer Brauch längst auf der ganzen Welt Einzug: Halloween. Jedes Jahr am 31. Oktober ziehen Kinder und Jugendliche in fantasievollen, schaurigen Kostümen von Haus zu Haus, in der Hoffnung auf süße Leckereien - andernfalls droht ein kleiner Streich. Gefeiert wird Halloween traditionell am Abend vor Allerheiligen. Damit auch die Kinder aus der Nachbarschaft und der Region schon einen kleinen Vorgeschmack auf das bevorstehende Gruselfest bekommen, hat sich in Wörth an der Isar mittlerweile eine besondere Tradition etabliert: die Spooky Corner. Seit mehreren Jahren sorgt sie dort für schaurig-schöne Stimmung und jede Menge Halloween-Flair.\n\nBLSV-Ehrenamtspreisträger: Albert Schwarzberger, Rote Raben Vilsbiburg im Portrait\nWer in den letzten Tagen unser Journal verfolgt hat, hat bereits zwei Preisträger des Ehrenamtspreis kennengelernt, Alfred Huhn und Andrea Honauer. Der Preis wurde im Rahmen der niederbayerischen Sportlerehrung vom BLSV verliehen. Heute stellen wir einen weiteren Preisträger vor, Albert Schwarzberger. Seit 1980 ist der 70-Jährige als Schatzmeister bei den Roten Raben in Vilsbiburg aktiv. Damit ist er seit mehr als 4 Jahrzehnten ein wichtiger Bestandteil des Vereins.  Was Ihn über die Jahrzehnte hinweg motiviert hat und wie wichtig für Ihn ..."
