  description: '"Die Nordreportage" zeigt den Bau einer Windkraftanlage: vom massiven Betonturm bis zur finalen Montage der Rotorblätter und den Problemen, die auf dem Weg dorthin entstehen. Tonnenschwere Hightechteile in schwindelerregender Höhe: Der Bau von Windkrafträdern stellt Monteure und Bauleiter vor große Herausforderungen. Gerade in Zeiten der Energiewende. Und oft läuft es anders als geplant.'
