  title: Die Nordreportage
  subtitle: Elektro statt Diesel - Neue Energie für Hamburgs Alsterschiffe
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die "Eilbek" soll schnellstmöglich auf eine Werft nach Finkenwerder gebracht werden. Die Werft wird den alten Motor ausbauen und den neuen Batterieantrieb einbauen. Was sicher leichter klingt als getan. Denn häufig passieren unerwartete Dinge, wenn man so einen alten Kahn anpackt. Was sie jetzt schon wissen ist, dass es sehr eng wird im Bauch des Schiffes. Alle Komponenten unterzubringen, ist die größte Herausforderung. Die Passage auf der breiten Elbe zur Werft Cölln wird für den kleinen Alsterdampfer zur Reise in die Zukunft.
