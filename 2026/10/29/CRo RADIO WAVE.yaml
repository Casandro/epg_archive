  title: Čelisti
  description: Na nejvýznamnějším domácím doku festivalu se po roční pauze opět představí pořad, který dlouhodobě hlásá, že dokument není film. Čelisti znovu směřují do chladné náruče Vysočiny, aby tu buď obhájily, nebo přehodnotily své radikální názory. Jaké dokumenty z aktuálního ročníku nám udělaly radost - a byla to radost česká, nebo krátká? Natočí někdy Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal svůj dokumentární Opus Bonum? Fascinující večer na pomezí filmové kritiky a ryzí recese. Přijďte si pověsit svou duševní košili na věšák! Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal.
