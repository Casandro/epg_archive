  title: Chudáčci
  description: Ve čtvrtek uslyšíte Chudáčky Petra Uhlíka a Adama Trnku Ernesta a jejich kuriózní úrazy, což je další díl natočený na přání posluchačstva. Petr bude dlouze vyprávět, jak se z něj stala mumie, Adam však na konci takzvaně "zabije" historkou, která obsahuje třicet stehů, vanu, mdloby a - jako obvykle - i kadění. Co se všechno může člověku stát, když dělá rozhodčího ve hře Twister?
