  title: Hotspot
  description: Po celém světě probíhají protesty, které jsou iniciované především studenty a studentkami. Proč se právě mladí lidé snaží globálně upozorňovat na zhoršující se socioekonomické podmínky? A jak vlastně protesty vnímáme skrze tradiční média, ale i sociální sítě a algoritmy? Moderátorka Barbora Součková ve studiu přivítala vizuální socioložku Andreu Průchovou Hrůzovou. Společně rozebíraly i to, jak vlastně obecně vypadají protesty v Česku a proč je jejich povaha silně formovaná odkazem na minulou totalitu. Více v novém Hotspotu.
