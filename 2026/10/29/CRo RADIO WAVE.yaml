  title: Psycho
  description: Domy stojí dál, ulice se nezměnila. Přesto působí úplně jinak. Oranžové lampy vystřídalo bílé světlo a známé místo ztratilo svoje kouzlo. Je to jen nostalgie? Karolína a Pavel v novém Psychu zkoumají, jak se pod různými světly cítíme a proč by nás měla zajímat podoba nočního města. Poslechni si Psycho na Radiu Wave.
