  title: Špína
  description: Fight war, not wars! Nedílnou součástí punkových textů a aktivit samotných kapel byly od jeho počátku i silné anti-válečné postoje. V novém miniseriálu se ve Špíně ponoříme do obrazu války a odporu vůči ní u zahraničních kapel. Od anarchopunku přes hardcore až po současné DIY kapely - anti nukleární výkřiky, protesty proti imperialismu i osobní svědectví o násilí a jeho důsledcích. Moderují Jan Šamánek a Judita Císařová.
