  stop: 2026-10-29T00:50:00Z
  title: Entscheidung auf dem Schlachtfeld
  subtitle: Sparta gegen die Perser
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2023
    Als sich Spartas König Leonidas mit 300 Mann der gigantischen persischen Armee entgegenstellt, wird ein Heldenmythos geboren - eine Spurensuche. Wie gelingt die Rettung der Griechen?

    Bei den Thermopylen, einem Engpass an der Ägäis, kommt es 480 vor Christus zum Kampf. Nach drei Tagen endet er in einem großen Opfer. Dank eines Verrats setzt sich die Übermacht des persischen Heers durch. Doch die Verzögerung hat die Kräfteverhältnisse verändert.
    HD-Produktion
- eventId: 800721
  start: 2026-10-29T00:50:00Z
  stop: 2026-10-29T01:35:00Z
  title: Entscheidung auf dem Schlachtfeld
  subtitle: Hannibal gegen Rom
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2023
    Die Schlacht von Cannae 216 vor Christus wird zum Trauma für die römische Armee. Das karthagische Heer unter Hannibal schlägt diese mittels einer List. Die Doku begibt sich auf Spurensuche.

    Obwohl zahlenmäßig überlegen, tappen die Römer in die Falle. Mit der Taktik einer Umfassungsschlacht fügt Hannibal ihnen eine vernichtende Niederlage zu. Sein Ruf als legendärer Stratege ist geboren. Mit Elefanten über die Alpen - das macht Hannibal bis heute berühmt.
    HD-Produktion
- eventId: 800722
  start: 2026-10-29T01:35:00Z
  stop: 2026-10-29T02:20:00Z
  title: Entscheidung auf dem Schlachtfeld
  subtitle: Hastings - Wilhelm erobert England
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2025
    Im Jahr 1066 steht England am Scheideweg. Nach dem Tod des angelsächsischen Königs Edward entbrennt ein Machtkampf um die Krone. Mehrere Anwärter erheben Anspruch.

    Darunter auch Wilhelm, Herzog der Normandie. Sein Gegner ist der frisch gekrönte König Harold Godwinson. Die entscheidende Auseinandersetzung findet auf dem Schlachtfeld bei Hastings statt - ein Moment, der die Weichen für die Geschichte Englands neu stellt.
    HD-Produktion
- eventId: 801757
  start: 2026-10-29T02:20:00Z
  stop: 2026-10-29T03:05:00Z
  title: Entscheidung auf dem Schlachtfeld
  subtitle: Katalaunische Felder - Attila gegen die Römer
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2026
    451 nach Christus stellt sich ein Bündnis unter dem römischen Heerführer Flavius Aëtius dem berüchtigten Hunnenkönig Attila entgegen - eine Schlacht entbrennt, die Geschichte schreibt.

    Die Hunnen, ein Reitervolk aus Zentralasien, versetzen seit Mitte des 4. Jahrhunderts Europa in Angst und Schrecken. Nach der Plünderung mehrerer großer Städte kommt es zur erbitterten Schlacht zwischen den beiden mächtigen Gegnern.
    HD-Produktion
