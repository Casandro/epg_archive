  title: Přes Atlantik
  description: Ve Spojených státech zesiluje odpor proti výstavbě datových center, která jsou nezbytná pro rozvoj umělé inteligence. Jejich provoz vyžaduje značné množství elektřiny a vody, místní obyvatelé si navíc stěžují na hluk a další dopady na životní prostředí. Proč se datová centra stala jedním z témat listopadových voleb do Kongresu? A proč jejich výstavbu podporuje Donald Trump navzdory odporu části vlastních příznivců? V další epizodě podcastu Přes Atlantik to rozebírají Jana Ciglerová a Jan Kaliba.
