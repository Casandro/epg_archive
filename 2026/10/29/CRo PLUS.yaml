  title: Přes Atlantik
  description: Ve Spojených státech zesiluje odpor proti výstavbě datových center, která jsou nezbytná pro rozvoj umělé inteligence. Jejich provoz vyžaduje značné množství elektřiny a vody, místní obyvatelé si navíc stěžují na hluk a další dopady na životní prostředí. Proč se datová centra stala jedním z témat listopadových voleb do Kongresu? A proč jejich výstavbu podporuje Donald Trump navzdory odporu části vlastních příznivců? V další epizodě podcastu Přes Atlantik to rozebírají Jana Ciglerová a Jan Kaliba.
- eventId: 767813
  start: 2026-10-29T02:33:00Z
  stop: 2026-10-29T03:00:00Z
  title: Pro a proti
  description: Práce na živnost, nebo zaměstnání? Vláda chce novou definicí změnit posuzování toho, kdy ještě člověk pracuje pro společnost na živnostenský list. Podle kritiků ovšem otevírá cestu k legalizaci švarcsystému, zaměstnavatelé naopak mluví o potřebném zpřesnění pravidel.Přinese nová definice větší právní jistotu, nebo připraví část pracovníků o ochranu? A odpovídá vůbec dnešní zákoník práce tomu, jak se proměňuje pracovní trh? Hosty Pro a proti jsou předseda ČMKOS Josef Středula a viceprezidentka Hospodářské komory Jaroslava Rezlerová. Moderuje Lukáš Matoška. Pořad vysíláme v repríze!
