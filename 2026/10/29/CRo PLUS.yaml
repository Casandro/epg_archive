  title: Portréty
  description: 28. říjen na Plusu. Mořic Hruban, moravský právník, vstoupil do politiky v roce 1891 a setrval v ní padesát let. Zažil okamžiky slávy při vzniku samostatné republiky a trpké pocity na podzim roku 1938. Životnímu příběhu Mořice Hrubana se bude věnovat historik Michal Pehr a David Hertl..
