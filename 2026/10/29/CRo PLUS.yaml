  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (10/15) Část desátá: Revoluce pátek a sobota 27. a 28. října 1956. Revoluce byla válkou školáků. Oblíbený velitel bojovníků za svobodu János Szabó posílal běžně proti tankům dvanácti-třináctileté děti. V Americe si prezident Eisenhower udržoval od maďarských událostí odstup. Z mezinárodního hlediska bylo důležitější drama, které se začalo odehrávat v Egyptě. Boje se z hlavního města přelévají do celé země, v Mošoni masakrují tajné policisty a v nastalé bouři dochází Imre Nagy k rozhodnutí liberalizovat maďarskou vládu - opět pozdě. Na scéně se objevuje nová postava - János Kádár. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
