  title: Osobnost Plus
  description: Petr Pithart, bývalý premiér a předseda Senátu. "Možná jsme poslední generací, která ještě žila v demokracii," říká se zkušeností muže, který zažil válku, komunismus, listopadový převrat a který stál u klíčových okamžiků naší novodobé státnosti. Jak pevná je dnes naše demokracie a kdo ji nejvíc ohrožuje? A obstojí naše malá země ve světě, kde se globální politika vrací k právu silnějšího? Ptá se Barbora Tachecí.
