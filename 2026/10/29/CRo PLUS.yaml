- eventId: 767809
  start: 2026-10-29T01:05:00Z
  stop: 2026-10-29T01:33:00Z
  title: Hovory
  description: 'Vašek Krejčí je motion designér a art director v TV Prima: "Zkouším, co umělá inteligence dokáže, snažím se realitu ukázat jiným způsobem. Začínal jsem temnými obrazy zničené Prahy, ta realističnost je neuvěřitelná," říká a dodává: "Když vidíme místa, která dobře známe, tak nás to nejvíc zasáhne. A videa jsou silnější vzhledem k tomu, co se ve světě děje." Proč a jak vytváří postapokalyptické vize? Jak jeho současné přemýšlení o videích ovlivnilo to, že tančil rock and roll? Moderuje Lenka Buriánková.'
