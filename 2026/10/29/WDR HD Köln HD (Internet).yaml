  title: Glow (15)
  subtitle: Der erste Kuss
  description: 'Psycho-Roger überschüttet Jenny mit Drohungen, weil es Stella nicht gut geht. Jenny soll die Tierarztrechnung bezahlen. Aber sie hat das Geld nicht! Und dann ist da noch ein anderes Problem: Der Schulball rückt näher, und Jenny weiß gar nicht, wie man küsst. Ein Mensch zum Üben muss her!'
- eventId: 673189
  start: 2026-10-29T06:45:00Z
  stop: 2026-10-29T07:00:00Z
  title: Glow (16)
  subtitle: Das Klopapier-Team
  description: 'Jenny und Yasin sind sie ein unschlagbares Team beim Toilettenpapier-Verkaufen und verstehen sich bestens - bis sie auf Emilio treffen. Yasin ist genervt: Er hält Emilio für einen Angeber. Aber Jenny überlegt sogar, ein zweites Kleid zu kaufen, um Emilio zu gefallen. Leider hat Hilde inzwischen festgestellt, dass auf ihrem Konto 6000 Kronen fehlen und beginnt zu recherchieren.'
- eventId: 673251
  start: 2026-10-29T07:00:00Z
  stop: 2026-10-29T07:20:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (17/20)
  subtitle: Nordgriechenland
  description: 'Wie schön ist es doch, am Meer aufzuwachen. Die sechs Abenteurer sind total glücklich und stürzen sich in eine lustige Wasserschlacht. Nach einer kurzen Wanderetappe begrüßt sie Tobi mit einer Überraschung: Die sechs müssen selbst ein tragfähiges Floß bauen und mit Sack und Pack auf eine einsame Insel übersetzen. Eine schwierige Herausforderung.'
- eventId: 673368
  start: 2026-10-29T07:20:00Z
  stop: 2026-10-29T07:45:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (18/20)
  subtitle: Nordgriechenland
  description: Heute müssen die sechs Abenteurer mit Kajaks rund um ihre einsame Insel paddeln und ihren Mut dann bei einem unglaublichen Klippensprung beweisen. Felix, Melli und Tom können es kaum erwarten zu springen. Jannis, Sofie und Evelin schlottern vorher ganz schön die Knie. die Klippe ist wirklich extrem hoch. die anderen versuchen, ihnen Mut zuzusprechen. die Gruppe braucht den letzten Wildnisumschlag mit dem Winkerbuchstaben dringend. Ob das klappt?
