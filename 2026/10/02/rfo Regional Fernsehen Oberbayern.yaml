- eventId: 1059390
  start: 2026-10-02T01:00:00Z
  stop: 2026-10-02T01:10:00Z
  title: Süd Journal vom 1.10.2026 (Wh.)
  subtitle: Das Siegel Inklusive Region für Rosenheim +++ Spatenstich für ein neues Kinderhaus in Rosenheim +++ 2100 neue Studierende an der TH Rosenheim +++ Tourismuszahlen in Oberbayern +++ Bürgersprechstunden in Rosenheim
  description: 'Stadt und Landkreis Rosenheim sind jetzt offiziell "Inklusive Region". Das Kultusministerium in München hat den Titel vergangene Woche Donnerstag verliehen, zusammen mit dem Nürnberger Land und dem Oberallgäu. +++ Rosenheim baut an der Pürstlingstraße ein neues, klimafreundliches Kinderhaus in Massivholzbauweise für sechs Krippen- und Kindergartengruppen; die Stadt investiert 10,5 Millionen Euro, gefördert von Bund, Land und KfW, Eröffnung ist Anfang 2028. +++ An der TH Rosenheim sind 2100 Erstsemester ins Studium gestartet, am stärksten in Betriebswirtschaft, gefolgt von Holztechnik und Bau sowie Informatik; neu sind die Bachelor Energietechnik, Gebäudetechnik und Energieeffizienz sowie Smart Interactive Media. +++ Oberbayerns Tourismus legt zu: Von Januar bis Juli wurden 25,7 Millionen Übernachtungen gezählt, 1,1 Prozent mehr als im Vorjahr, bei 3,5 Prozent mehr Ankünften und 45,3 Prozent Bettenauslastung, wie Tourismus Oberbayern e.V. meldet. +++ Rosenheims OB Abuzar Erdogan lädt im Oktober zu fünf Bürgerversammlungen ein, bei denen Bürger ab 14 Jahren Anliegen direkt vorbringen können; der Auftakt für den Bereich Süd-Ost ist am Mittwoch, 8. Oktober, im Happinger Hof mit Stadt- und Stadtteilthemen.'
- eventId: 1059391
  start: 2026-10-02T01:10:00Z
  stop: 2026-10-02T01:20:00Z
  title: Süd Journal vom 1.10.2026 (Wh.)
  subtitle: Bahnstrecke Mühldorf +++ Neue Kunstwerke am Freilassinger Skulpturenweg +++ Bad Aiblinger Literaturtage starten - was das Programm bereithält
  description: 'Seit Mitte September ist auf der Bahnstrecke zwischen München und Mühldorf einiges anders: weniger Verbindungen, längere Fahrzeiten und veränderte Abfahrten sorgen bei Pendlern für Unmut. Mehrere Kommunen haben deshalb gemeinsam Druck gemacht - und zumindest eine erste Verbesserung erreicht. +++ Seit sechs Jahren verbindet der Freilassinger Skulpturenweg den Lobmayer-Parkplatz mit dem Badylon, nun bereichern fünf neue, hochwertige Werke aus verschiedenen Materialien die Strecke und laden ein Jahr lang zum Entdecken ein, bevor sie ausgetauscht werden. +++ Ab morgen stehen in Bad Aibling wieder Bücher, Geschichten und Autorengespräche im Mittelpunkt: Die 38. Literaturtage starten am 2. Oktober und bieten bis 27. November ein vielfältiges Programm mit Lesungen, Musik, Kinderangeboten und Veranstaltungen in der ganzen Stadt.'
- eventId: 1059392
  start: 2026-10-02T01:20:00Z
  stop: 2026-10-02T01:30:00Z
  title: Süd Journal vom 1.10.2026 (Wh.)
  subtitle: Jubiläum in Hintertux +++ Wetter für das Sendegebiet +++ PlenumTV - Neues aus dem Bayerischen Landtag
  description: Hintertux, heute fast Ganzjahresskigebiet, wurde 1926 nach Tux eingemeindet und feierte das Jubiläum beim Oktoberfest; einst führte der Weg ins Wipptal über das 2238 Meter hohe Tuxer Joch, später begann mit Quelle und Badehaus der Tourismusboom. +++ Das sommerliche Wetter verabschiedet sich. Am Freitag löst sich eine Kaltfront über dem Osten und Süden auf, am Wochenende folgen vom Atlantik her weitere Tiefausläufer. Am Samstag halten sich zunächst Nebelfelder, danach setzt sich häufig wieder die Sonne durch, am Sonntag nehmen die Wolken zu. +++ In der ersten Plenarsitzung nach der Sommerpause berät der Bayerische Landtag über das geplante Bauturbo-Gesetz zur schnelleren Wohnraumgenehmigung und weniger Bürokratie sowie über SPD-Vorschläge für besseren Hochwasser- und Starkregenschutz in Bayern.
- eventId: 1059393
  start: 2026-10-02T01:30:00Z
  stop: 2026-10-02T01:45:00Z
  title: Süd Wirtschaft vom 1.10.2026 (Wh.)
  subtitle: Berichte, Reportagen und Interviews über Unternehmen, Themen und Menschen, die die Region wirtschaftlich prägen.
  description: 'Im Skigebiet am Hintertuxer Gletscher transportieren Gondeln bis zu 40.000 Menschen pro Stunde über 270 Hektar Pisten, eine Erfolgsgeschichte seit rund 100 Jahren: Beim Hintertuxer Oktoberfest wurde gefeiert, dass Hintertux 1926 zu Tux kam.'
- eventId: 1059394
  start: 2026-10-02T01:45:00Z
  stop: 2026-10-02T02:00:00Z
  title: Süd Wirtschaft vom 1.10.2026 (Wh.)
  subtitle: Berichte, Reportagen und Interviews über Unternehmen, Themen und Menschen, die die Region wirtschaftlich prägen.
  description: 'Die Sägmühle Immobilienverwaltung aus Brannenburg (Landkreis Rosenheim) ist Immobilienverwaltung des Jahres 2026: Die Jury lobte ihr Quartierskonzept mit digitalem Portal, sozialer Integration und inklusiven Wohnformen, das klassische Hausverwaltung deutlich erweitert.'
