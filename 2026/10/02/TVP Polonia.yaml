  title: 'Makłowicz w podróży: Podróż 26. Włochy - Piemont - Asti'
  description: |-
    Tytuł oryginalny: Makłowicz w podróży
    PL, 2011
    Reżyseria: Piotr Mikucki
    Robert Makłowicz odwiedza Asti we Włoszech. W średniowieczu była to wolna republika miejska i najpotężniejszy ośrodek w całym Piemoncie. Z tamtych czasów została tylko imponująca katedra. Dzisiaj Asti to niewielkie centrum regionu Monferrato, słynące z czerwonych win barbera, białych muskatów i win musujących. W regionie Asti panowali i francuscy Walezjusze, i hiszpańscy Habsburgowie, a wreszcie dynastia sabaudzka, która zjednoczyła Włochy.
