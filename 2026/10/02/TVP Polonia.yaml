  title: Echo serca s.I - odc. 15
  description: |-
    Tytuł oryginalny: Echo serca
    PL, 2019
    Reżyseria: Tomasz Szafrański
    Występują: Kamilla Baar-Kochańska, Antoni Pawlicki, Przemysław Sadowski, Dorota Segda, Dorota Pomykała, Julia Pogrebińska
    Monika i Konrad są parą. Właśnie planują wspólne wynajęcie mieszkania, w przyszłości może i ślub. Zakochani po uszy pracują jako ratownicy wodni na jednym z basenów. To tam Monika podczas nauki nurkowania na tzw. bezdechu, traci przytomność pod wodą. Niezauważona przez nikogo spędza pod wodą ponad 20 minut. W szpitalu nie odzyskuje przytomności. Jan nie potrafi określić, jak bardzo mózg dziewczyny uległ uszkodzeniu. Thomas szuka pieniędzy na spłatę swoich długów. Prosi Staszka o pożyczkę.
  ageRating: 12
  genre:
  - '23'
  subtitle: Do szpitala trafia Monika, która straciła przytomność na basenie. Jan nie potrafi określić, w jakim stopniu jest uszkodzony jej mózg. Narzeczony Moniki popełnia samobójstwo. Magda czuje się winna.
- eventId: 1201446
  start: 2026-10-02T19:15:00Z
  stop: 2026-10-02T19:45:00Z
  title: Na sygnale - odc. 669 "Życie za życie"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Tomasz Szreniawa
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Znajoma policjantka - inspektor Urszula Krzaklewska - przesłuchuje Basię w sprawie zaginięcia Michała. Doktor Banach nie zgadza się na razie na powrót koleżanki do pracy - świadomy, że po urazie mózgu powinna się oszczędzać. Z kolei w domu Wiktor - zmuszony przez Annę - próbuje w końcu porozmawiać z Czarkiem o jego zachowaniu.
  ageRating: 12
  genre:
  - '23'
  subtitle: Basia jest przesłuchiwana w sprawie zaginięcia Michała. Banach nie zgadza się na jej powrót do pracy. Wiktor próbuje porozmawiać z Czarkiem. Alek ucieka przed paparazzimi. Niepokoi się o związek z Bereniką.
- eventId: 1201447
  start: 2026-10-02T19:45:00Z
