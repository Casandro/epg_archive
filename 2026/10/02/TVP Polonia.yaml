    Do Sandomierza przyjeżdża niezależny dziennikarz, Janek Żukowski (PIOTR GAWRON-JEDLIKOWSKI), aby sprawdzić, czy to sielsko wyglądające miasto nie ma żadnych ciemnych stron. I niemal od razu wpada na gorący temat - pobicie znanego sandomierskiego przedsiębiorcy i molestowanie w miejscowym szpitalu. W tym samym czasie aspirant Kobylicka znajduje niepokojący anonim za wycieraczką swojego samochodu, a jej narzeczony, doktor Wojciech Schiller, orientuje się, że jest śledzony.
