    Dominika bierze udział w licytacji i w finale kupuje lokal, w którym działa Feel Good - za ponad milion złotych. A Renata znów koleżankę zaskakuje, opuszcza ośrodek dla uzależnionych i gdy poznaje wynik aukcji, jest w szoku. Bruno przekonuje w końcu Karolinę, by wzięli w Vegas szalony, spontaniczny ślub. A między Olą i Justinem na nowo trwa sielanka aż do chwili, gdy dziewczyna dostaje nagle filmik, na którym widać, jak ukochany ją zdradza.
