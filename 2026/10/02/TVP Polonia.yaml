    By zapewnić sobie małżeński spokój, Marcin wmawia Kamie, że jego nowa szefowa - Domańska - jest dużo starsza i kompletnie nieatrakcyjna. A gdy Chodakowska odkrywa, że mąż ją oszukał, na nowo wybucha złością. Tymczasem pani prezes otwarcie wyznaje Marcinowi, że ma ochotę go uwieść. Kiedy Chodakowski pokusie nie ulega, Domańska wpada z nieoczekiwaną wizytą do salonu jego żony. Z kolei Aneta znów pomaga Wójcikowi, którego syn tym razem ma anginę.
  ageRating: 12
