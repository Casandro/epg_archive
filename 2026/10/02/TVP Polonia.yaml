  title: Szlakiem miejsc niezwykłych - Pomniki Historii - Trzebnica i Kołbacz
  description: |-
    Tytuł oryginalny: Szlakiem miejsc niezwykłych - pomniki historii
    PL, 2016
    Reżyseria: Tomasz Drozdowicz
    Idea założenia zakonu cysterskiego zrodziła się we Francji w XI wieku, kiedy to surowe zasady życia zakonnego znacznie się rozluźniły, a reguła św. Benedykta, z przewodnim mottem ora et labora, czyli módl się i pracuj, przestała być pociągająca. Cystersi, którzy przybyli do Polski w XII wieku, mieli odnowić ideał pracy, modlitwy i ubóstwa. Plan chyba się powiódł, bo na terenie dzisiejszej Polski powstało aż 26 klasztorów męskich i 14 żeńskich. Wśród nich opactwa w Trzebnicy i Kołbaczu.
  ageRating: 12
  genre:
  - '112'
  subtitle: Idea założenia zakonu cystersów narodziła się we Francji w XI wieku, gdy surowe reguły życia zakonnego zaczęły się rozluźniać.
