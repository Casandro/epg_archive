    W Sandomierzu ma się odbyć unikalny koncert muzyki poważnej, na którym widownia składać będzie się z. roślin. Jego organizatorem jest Miłka Wysocka, zagrać ma orkiestra pod kierownictwem skrzypka, Rajmunda Dąbkowskiego, a wśród entuzjastów przedsięwzięcia jest m.in. babcia Lucyna. Całe przedsięwzięcie zawisa jednak na włosku, kiedy kluczowa dla orkiestry skrzypaczka zostaje zamordowana we własnym domu.
