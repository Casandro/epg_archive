    Występują: Maciej Musiał, Adam Zdrójkowski, Emma Pokromska, Jacek Braciak, Mateusz Pawłowski, Olga Kalicka
    Natalia z przyjaciółkami wspominają młodość, relacja Ludwika z młodziutką Agatą budzi niepokój Marii i Violi. Tomek i Magda mierzą się z codziennymi problemami, zwłaszcza, że Majka jest nietuzinkowym dzieckiem. Tata przywozi Diankę do domu młodych Boskich, mężczyzna budzi zainteresowanie Magdy. Szczęśliwy Ludwik obserwuje wizytę Zosi u Kacpra. Zarówno Kuba jak i Kacper borykają się z problemami sercowymi. Kacper prosi starszego brata o porady.
