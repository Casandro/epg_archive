    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Zdzisio wciąż pragnie wyjść na scenę i zostać komikiem, choć Artur próbuje go do tego zniechęcić. A Bronek namawia przyjaciela, by nową karierę zaczął od występów w Internecie. Tymczasem na dyżurze zespół doktora Góry próbuje pomóc mężczyźnie, który miał wypadek samochodowy - tuż po tym, jak w dniu ślubu uciekła od niego ukochana. A w drodze do szpitala pechowy narzeczony wybucha agresją i brutalnie ratowników atakuje.
  ageRating: 12
  genre:
  - '23'
  subtitle: Zdzisio chce zostać komikiem. Zespół doktora Góry zajmuje się mężczyzną, którego narzeczona porzuciła w dniu ślubu. Niedoszła panna młoda przypadkiem zostaje pacjentką doktor Reiter.
