    Bogactwem lasu wykorzystywanym przez człowieka jest nie tylko drewno. Przez wieki las był niezastąpionym źródłem pożywienia dla ludzi i zwierząt. Dziś pochodzące z lasów zioła owoce, grzyby i dziczyzna jakością i wartością przewyższają produkty z upraw i hodowli. Ten odcinek programu dedykowany jest produktom żywnościowym i farmaceutykom, których dostarczają polskie lasy. O ich walorach i sposobach pozyskiwania opowiadają leśnicy, farmaceuci, kucharze i dietetycy.
