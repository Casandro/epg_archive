  title: Skarbiec sztuki Lubelszczyzny - Malowidła w kopule kaplicy św. Stanisława Kostki w lubelskiej katedrze
  description: |-
    Tytuł oryginalny: Skarbiec sztuki Lubelszczyzny
    PL, 2021
    Kaplica przy dawnym kościele Jezuitów w Lublinie powstała z fundacji Zofii z Mieleckich, która w 1593 r. rozpoczęła starania o budowę grobowej kaplicy dla zmarłego męża, księcia Symeona Olelkowicza. Wnętrze kaplicy, budowanej od 1604 r., ukończono w latach 1609-1615, lecz kopuła pozostała niezdobiona. Po śmierci fundatorki w 1618 r. znajdował się tam prowizoryczny ołtarz. Kaplicę ukończono w 1630 r., a rok później umieszczono w niej cudowny obraz bł. Stanisława Kostki.
  ageRating: 12
  genre:
  - '149'
  subtitle: Historia kaplicy przy dawnym kościele jezuitów w Lublinie była związana z fundacją kaplicy Zofii z Mieleckich.
