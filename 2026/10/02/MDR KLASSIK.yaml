  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Bedrich Smetana: "Die verkaufte Braut", Ouvertüre (SWR Rundfunkorchester Kaiserslautern: Peter Falk); Ludwig van Beethoven: Klavierkonzert Nr. 3 c-Moll (Francesco Piemontesi, Klavier; SWR Symphonieorchester: Roger Norrington) John Dowland: Six Songs (Duo Montes Kircher) Camille Saint-Saëns: Morceau de concert  op. 154 (Isabelle Moretti, Harfe; Rundfunkorchester des Südwestfunks Kaiserslautern: Klaus Arp)  Camille Saint-Saëns: Morceau de concert, op. 154 (Isabelle Moretti, Harfe); Robert Schumann: Romanzen, op.

    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Bedrich Smetana: "Die verkaufte Braut", Ouvertüre (SWR Rundfunkorchester Kaiserslautern: Peter Falk); Ludwig van Beethoven: Klavierkonzert Nr. 3 c-Moll (Francesco Piemontesi, Klavier; SWR Symphonieorchester: Roger Norrington) John Dowland: Six Songs (Duo Montes Kircher) Camille Saint-Saëns: Morceau de concert  op. 154 (Isabelle Moretti, Harfe; Rundfunkorchester des Südwestfunks Kaiserslautern: Klaus Arp)  Camille Saint-Saëns: Morceau de concert, op. 154 (Isabelle Moretti, Harfe); Robert Schumann: Romanzen, op. 69 (SWR Vokalensemble: Rupert Huber); Norbert Burgmüller: Sinfonie Nr. 1 c-Moll (Hofkapelle Stuttgart: Frieder Bernius)

    2.03  Das ARD-Nachtkonzert (II)

    Johann Friedrich Fasch: Suite g-Moll (Il Fondamento); Cécile Chaminade: Klaviertrio a-Moll, op. 34 (Atos Trio); Giovanni Punto: Hornkonzert Nr. 5 F-Dur (Peter Francomb, Horn; Northern Sinfonia: Howard Griffiths); Sergej Rachmaninow: Suite Nr. 2, op. 17 (Lucas und Arthur Jussen, Klavier); Arnold Bax: Variationen (Royal Scottish National Orchestra: Martin Yates)

    4.03  Das ARD-Nachtkonzert (III)

    Johann David Hermann: Harfenkonzert Nr. 1 F-Dur (Xavier de Maistre, Harfe; Les Arts Florissants: William Christie); Max Bruch: Streichquintett Es-Dur (The Nash Ensemble); Gabriel Fauré: "Dolly", op. 56 (Boston Symphony Orchestra: Seiji Ozawa)

    5.03  Das ARD-Nachtkonzert (IV)

    Henry Purcell: "The Fairy Queen", The Fourth Act Suite (Le Concert des Nations: Jordi Savall); Carl Czerny: Konzert C-Dur, Vivace, op. 153 (Klavierduo Tal & Groethuysen; Münchner Rundfunkorchester: Bruno Weil); Alexander Borodin: Streichquartett Nr. 2 D-Dur, Notturno (Borodin Quartet); Johan Helmich Roman: Sinfonia D-Dur (Drottningholm Barockensemble: Jaap Schröder); Thomas D. A. Tellefsen: Vier Mazurken, op. 1 (Einar Steen-Nøkleberg, Klavier); Antonín Dvorák: Bläserserenade d-Moll, Finale, op. 44 (Bläserensemble Sabine Meyer)
