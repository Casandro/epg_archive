  title: Entscheidung im Atlantik - Der U-Boot-Krieg 1939-45
  subtitle: Die Boote
  description: In der Dokumentation erzählt Friedrich Grade, während des Zweiten Weltkriegs leitender Ingenieur auf der "U 96", zum ersten Mal die wahre Geschichte des U-Boots, das durch das Buch "Das Boot" und dessen Verfilmung weltweit bekannt wurde.
  genre:
  - '129'
- eventId: 1197307
  start: 2026-10-02T01:25:00Z
  stop: 2026-10-02T02:10:00Z
  title: Entscheidung im Atlantik - Der U-Boot-Krieg 1939-45
  subtitle: Operation Paukenschlag
  description: Nach Hitlers Kriegserklärung an die USA im Dezember 1941 schickte die Seekriegsleitung U-Boote los, um die Nachschublinien zwischen den USA und Europa zu zerstören. Der Codename der geheimen Operation lautete "Paukenschlag".
  genre:
  - '129'
- eventId: 1212787
  start: 2026-10-02T02:10:00Z
  stop: 2026-10-02T02:50:00Z
  title: Entscheidung im Atlantik - Der U-Boot-Krieg 1939-45
  subtitle: Vom Jäger zum Gejagten
  description: Im Jahr 1942 bekamen die Alliierten die Möglichkeit, die deutschen Funkbefehl fast zeitgleich mitzulesen und fast jedes deutsche U-Boot zu umzingeln. Die Doku zeigt, wie die deutschen Soldaten so von Jägern zu Gejagten wurden.
  genre:
  - '129'
