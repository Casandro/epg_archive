  description: Záznam koncertu zpěvačky Alice Armstrong z festivalu Blues Alive 2025 v Šumperku. Její vystoupení patřilo k nejpůsobivějším vokálním koncertům ročníku. Armstrong předvedla set, který spojoval bluesovou tradici s moderním zvukem a silným emocionálním nábojem. Její kapela dokázala vytvořit prostor, ve kterém vynikl její hlas i osobitý projev. Připravuje Antonín Schindler.
