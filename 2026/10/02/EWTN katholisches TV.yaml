  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Eine abenteuerliche Reise
  description: |-
    Anna Diouf im Gespräch mit Joachim Rechholz

    Die erste Begegnung mit der evangelischen Landeskirche ist ernüchternd: Offenbar glaubt der Pfarrer selbst nicht, was er vermitteln soll. Ganz anders sieht das in der Freikirche aus. Aber vorerst führt Joachim Rechholz` Weg in eine andere Richtung. Bei den Zeugen Jehovas trifft er seine große Liebe. Doch sein Blick bleibt offen für die Welt um ihn herum, und schließlich zieht es ihn in eine evangelische Freikirche. Doch am Ziel ist er noch nicht! Erst in der Kirche, die auf den Felsen Petri gegründet ist, in inniger Gemeinschaft mit dem eucharistischen Herrn, findet er Heimat: Christus im Mittelpunkt.
  widescreen: true
