  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Feuerzungen auf dem Zion - Vom dritten Geheimnis des glorreichen Rosenkranzes
  description: Auf dem Gipfel des Zion verdichtet sich das Wirken Gottes. Hier hat Jesus Christus die Eucharistie eingesetzt. Hier ist fünfzig Tage nach der Auferstehung Christi der Heilige Geist in die Welt eingebrochen, der Beistand den Jesus angekündigt hatte. Hier war die Geburtsstunde der Kirche. Paul Badde folgt den Spuren Jesu und seines Wirkens im Heiligen Land.
