  title: Triebwerk - Das Automagazin mit Tim Schrick
  subtitle: Triebwerk - Das Automagazin mit Tim Schrick
  description: 'Im neuen Format "Triebwerk" mit Motorexperte und Rennfahrer Tim Schrick dreht sich alles rund ums Auto. Neben Beiträgen, News und kompakten Reportagen zu aktuellen Fahrzeugen hat das von der EVO 7 GmbH produzierte Automagazin auch spannende Youngtimer-Stories mit Alex Wesselsky zu bieten. "Petrolhead" Schrick begibt sich für die Sendung immer wieder auf verschiedene Roadtrips, vieles spielt sich aber auch am Bilster Berg ab: Die anspruchsvolle Rennstrecke ist seine Homebase und wie geschaffen für echte Härtetests. Mit der Sendung "Triebwerk", die von ClimAir präsentiert wird, feiert der Moderator sein Comeback auf SPORT1. Davor machte Tim sich mit jeder Menge Knowhow, Witz und Charme auf SPORT1 bzw. zuvor im DSF bereits unter anderem durch Kultformate wie "TURBO" und "DSF Motor" einen Namen beim TV-Publikum. Auch Alex Wesselsky war mit "Auftrag Auto" ebenfalls schon für SPORT1 im Einsatz.'
  widescreen: true
