  title: Dynamische Programmumschaltung (wieder aktiv seit 12.07.2023)
  subtitle: Testsender für Receiver-Hersteller, Fernseh-Händler, Kabelgesellschaften und interessierte Zuschauer:innen, um die PMT-Umschaltung der Endgeräte zu testen.
  description: Die PMT-Umschaltung, auch dynamische PMT genannt, ist bei der ARD einer der wichtigsten Mechanismen zur korrekten Funktionsweise der Regionalprogramme. Dazu wechselt der Service ARD-Test-R pro Minute die Video- und Audio-PIDs zwischen den Programmen tagesschau24 und ONE hin und her.
