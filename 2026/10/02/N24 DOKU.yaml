  title: Salami, Wiener & Co - Die Wurstmacher
  subtitle: Salami, Wiener & Co - Die Wurstmacher
  description: 'Mit einer Fleischproduktion von etwa acht Millionen Tonnen ist Deutschland der größte Fleischproduzent Europas und der drittgrößte der Welt. Im Durchschnitt verzehrt jeder Bundesbürger im Jahr rund 31 Kilogramm Fleischwaren. Schweinefleisch wird am häufigsten verarbeitet - und aus ihm besonders oft Wurst hergestellt. Allein die Brühwurst, also zum Beispiel die Lyoner Fleischwurst, macht ein Drittel des gesamten Fleischkonsums aus. Die beliebteste Wurst ist jedoch eine Rohwurst: die Salami.'
  widescreen: true
- eventId: 1338746
  start: 2026-10-02T13:00:00Z
  stop: 2026-10-02T13:55:00Z
  title: Der XXL-Mähdrescher - Erntefabrik auf Rädern
  subtitle: Der XXL-Mähdrescher - Erntefabrik auf Rädern
  description: 'In Zweibrücken in Rheinland-Pfalz befindet sich eines der größten Mähdrescher-Werke Europas. Weltweit werden die Nutzfahrzeuge ausgeliefert und eingesetzt. Der dort produzierte T670 ist eine komplette Erntefabrik auf Rädern: In einer Stunde kann der XXL-Mähdrescher bis zu 50 Tonnen Getreide ernten. Mit 4 Metern Höhe und 21 Tonnen Gewicht ist es zudem eines der größten landwirtschaftlichen Fahrzeuge der Welt. Die Reportage zeigt die Herstellung der Erntemaschine und begleitet sie im Einsatz.'
  widescreen: true
- eventId: 1338747
  start: 2026-10-02T13:55:00Z
  stop: 2026-10-02T14:50:00Z
  title: Der Nord-Ostsee-Kanal - Nadelöhr für Riesenschiffe
  subtitle: Der Nord-Ostsee-Kanal - Nadelöhr für Riesenschiffe
  description: Der Nord-Ostsee-Kanal gehört zu den meistbefahrenen künstlichen Wasserstraßen der Welt. Jährlich passieren bis zu 30.000 Schiffe den knapp 100 Kilometer langen Kanal. Für Kanalsteurer und Lotsen ist jede Überfahrt ein Wettlauf gegen die Zeit, die Lenkung erfordert größte Präzision. Die inzwischen über ein Jahrhundert alten Schleusen sorgen oft für technische Störungen, die lange Wartezeiten nach sich ziehen. Deshalb soll der Kanal nun für den Schiffsverkehr der Zukunft erneuert werden.
  widescreen: true
- eventId: 1338748
  start: 2026-10-02T14:50:00Z
  stop: 2026-10-02T15:44:00Z
  title: PS-Schnäppchen - Oldtimer aus den USA
  subtitle: PS-Schnäppchen - Oldtimer aus den USA
  description: 'In Dallas, im US-Bundesstaat Texas, findet eine große Fahrzeug-Auktion statt: Rund tausend Pkw werden hier in vier Tagen versteigert. Zu den bekanntesten Auto-Verkäufern in den Vereinigten Staaten gehört Alex Manos. Sein Geschäft in Los Angeles vertreibt Oldtimer rund um den Globus. Erfahren im Einkauf von US-amerikanischen Oldtimern ist Dieter Thiel aus Wuppertal, der die historischen Fahrzeuge für seine Kunden erwirbt. Die Reportage gibt einen Einblick in den Handel mit Oldtimern aus den USA.'
  widescreen: true
- eventId: 1338762
  start: 2026-10-02T15:44:00Z
  stop: 2026-10-02T16:33:00Z
  title: Ikonen des Motorsports - Mythos Porsche
  subtitle: Ikonen des Motorsports - Mythos Porsche
  description: Kaum ein Autobauer hat so viele legendäre Sportwagen hervorgebracht wie Porsche. Testfahrer Lars Kern fährt sechs der Originalmodelle über die Porsche-Rennstrecke Leipzig - und er zeigt, wozu sie in puncto Beschleunigung und Fahrspaß in der Lage sind. Bei der Rennstrecke wurden Kurven von weltberühmten Rennstrecken nachgebaut. Einerseits eine Hommage, andererseits auch ein sportlicher Vorteil, denn so kann getestet werden, wie sich neue Modelle in verschiedensten Situationen verhalten.
  widescreen: true
- eventId: 1338763
