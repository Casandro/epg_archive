  title: Airport Security USA - Folge 006
  subtitle: Airport Security USA - Folge 006
  description: 'Am Flughafen von San Francisco wird ein Mann verhaftet, der kiloweise Cannabis ins Vereinigte Königreich schmuggeln wollte, wo Marihuana, anders als in Kalifornien, illegal ist. Großeinsatz in Detroit: US-Zoll- und Grenzbeamte filzen in einer 100-Prozent Kontrolle ein Flugzeug aus Mexiko, samt Passagieren und Gepäck. In Honolulu entdeckt der Zoll raubkopierte Bagger. Und: Am Flughafen Newark scheitert ein Dominikaner, nach 29 Jahren in den USA, an der Wiedereinreise. Willkommen in den USA.'
