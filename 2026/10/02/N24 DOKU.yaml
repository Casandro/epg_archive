  subtitle: Airport Security USA - Folge 7
  description: Der Zoll am Flughafen Atlanta findet im Gepäck eines angeblichen Partyveranstalters fast zwei Kilo der Vergewaltigungsdroge GBL. Am San Francisco International Airport macht sich ein Besucher des Burning Man Festivals mit zahlreichen Pillen und verbotenen Tanzstöcken verdächtig. In Honolulu muss eine japanische Touristin mit Kontaktlinsen in drei Tönungen buchstäblich Farbe bekennen, und ein Spürhund entlarvt in einem Paket ein "Gleitgel" als Marihuana-Harz im Wert von über 10.000 Dollar.
