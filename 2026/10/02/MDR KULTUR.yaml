- eventId: 742988
  start: 2026-10-02T04:00:00Z
  stop: 2026-10-02T07:00:00Z
  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Annekathrin Bürger erhält den DEFA-Ehrenpreis\nAnnekathrin Bürger vorzustellen, sei ein ebenso überflüssiges Unterfangen wie Eulen nach Athen zu tragen, bemerkt 1970 ein Leipziger Journalist. Die Schauspielerin ist zu diesem Zeitpunkt in der DDR längst eine Ikone. Ob auf der Kinoleinwand, im Fernsehen, oder auf der Theaterbühne - Annekathrin Bürger ist präsent und tief im Herzen ihres Publikums verankert. Doch ihr Wirken erschöpft sich nie in der Kunst: Zeitlebens verbindet sie ihre kreative Strahlkraft mit starkem gesellschaftspolitischem Engagement. Heute erhält sie den Ehrenpreis der Defastiftung für ihr Lebenswerk. Wolfgang Schilling mit einem Potrait.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Vekehr\nVon Paula Kautz\n\n* 06:40 Uhr - Stichtag: 1901 Eisenacher Frauenkongreß\n1901 Deutscher Frauentag endetBeim Wort \"Frauentag\" denkt jede und jeder reflexhaft 8. März. Doch um 1900 dachte frau, zumindest der frauenbewegte Teil - an die großen Kongresse des \"Allgemeinen Deutschen Frauenvereins\", die dieser aller zwei Jahre abhält. 1901 in Eisenach. Nicht nur der erste im neuen Jahrhundert, dass die politische Gleichberechtigung der Frau dann bringen sollte, sondern ein Frauentag, der neue Akzente für die Frauenbewegung  setzte. Ein Stichtag von Hartmut Schade.\n\n* 06:50 Uhr - Kulturtipp Theater in Magdeburg\nVon Katrin Engelhardt\n\n* 07:10 Uhr - Weimars Stadtschloss wird zum Bürgerschloss\nAn manchen Orten konzentriert sich Geschichte. Und das Weimarer Stadtschloss ist ein solcher Ort. Wer ist dort nicht alles im Laufe der Jahrhunderte ein- und ausgegangen...\nBach hat im Schloss komponiert, Cranach hat dort gemalt, Goethe war Stammgast ... und dann wurde von dort aus natürlich regiert, dieses kleine, so kulturfreudige Herzogtum Sachsen-Weimar-Eisenach.\nIn den letzten Jahren ist das Weimarer Stadtschloss aus der öffentlichen Wahrnehmung verschwunden, denn es wird saniert.\nNun aber ist ein erster Meilenstein bei diesem Mammutprojekt erreicht - heute wird mit einem großen Fest der erste Flügel an die Öffentlichkeit übergeben, der Ostflügel. Unsere Landeskorrespondentin Mareike Wiemann durfte sich vorab schon umschauen.\n\n* 07:20 Uhr - Highlights in ARD Sounds: Die besten Hörspiele im Oktober\nIn diesem Jahr beging die Literaturwelt die 100. Geburtstage von Erich Loest und Siegfried Lenz. Aus diesem Anlass blicken wir in ARD-Sounds  auf das Werk der beiden Autoren unter dem Titel: \"Loest und Lenz 100 - Chronisten aus Ost und West\".\nAuch passend zum 3. Oktober: zwei Autoren, die ein Geburtsjahr teilen, aber unterschiedliche deutschen Staaten erlebten. Mit dabei Erich Loests  Erzählung Haare , gelesen von Gert Haucke.\nErzählt wird von einer Pubertät in der DDR der 1970er Jahre. Der junge Horst Burghausen rebelliert, indem er sich die Haare lang wachsen lässt, was seine Eltern auf die Palme treibt. Ein familiärer Machtkampf entbrennt. \n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Vekehr\nVon Paula Kautz\n\n* 07:40 Uhr - Feuilleton\nVon Jörg Schieke\n\n* 07:50 Uhr - Neue Musik von Rathmann: Über ihren Albumtitel\nWenn ein Album \"Die Goldenen Zwanziger\" heißt, denke ich automatisch ans letzte Jahrhundert, die 19hunder20er also. Die drei Musiker der Band Rathmann, die teilweise aus Leipzig kommen, meinen im Titel ihres heute erscheinenden Albums aber das aktuelle Jahrzehnt, also die 2tausende20er. Schließlich leben sie im hier und jetzt, wie sie uns im Interview erzählt haben."
- eventId: 742989
  start: 2026-10-02T07:00:00Z
  stop: 2026-10-02T07:35:00Z
  title: Jetzt, wo du ein Held bist (Folge 5 von 15)
  subtitle: von Thilo Krause
  description: "Dresden Sommer 1989: Toni versucht zu ergründen, warum er eine Schwester hat, die nur er sehen kann. Zwischen Familienschweigen und dem Stumpfsinn eines im Untergang begriffenen Systems schlägt er sich durch. Fahnenappelle, vom Tagebau verschlungene Dörfer, verschwundene Cousins, die Kriegsschwere der Eltern und Großeltern bilden ein dunkel flackerndes Kaleidoskop. Es bleibt Toni rätselhaft, bis er sich mit dem Sitzenbleiber Maik anfreundet. Als Toni ihn vor dem Zorn eines systemtreuen Lehrers rettet, beginnt ihre Flucht zu sich selbst. Mit Wärme und Witz erzählt Thilo Krause vom Aufwachsen in den letzten Monaten der DDR und dem Trost der Freundschaft.\n\n\"Es ist eine 'Erziehung des Herzens', die Thilo Krause in seinem zweiten Roman beschreibt, einige Sommerwochen im Jahr des Mauerfalls, in denen für die zwei Schüler Toni und Maik nicht viel zu geschehen scheint und sich doch alles verändert.\" (Peter Stamm)\n\nThilo Krause, geboren 1977 in Dresden, lebt in Zürich. Seit 2005 veröffentlicht er literarische Texte in Zeitschriften (u.a. Akzente, Sinn und Form), Zeitungen und Anthologien. 2012 erhielt er für sein Debüt \"Und das ist alles genug\" den Schweizer Literaturpreis; 2016 den Clemens-Brentano-Preis. 2020 erhielt er für seinen Roman \"Elbwärts\" den Robert-Walser-Preis und den Nicolas-Born-Debütpreis. MDR Kultur produzierte den Roman als Lesung mit Nico Holonics. Im August 2026 erschien sein zweiter Roman \"Jetzt, wo du ein Held bist\", den MDR Kultur zusammen mit NDR Kultur als Lesung mit dem Schauspieler Oscar Hoppe produziert hat.\n\nRegie: Judith Ruyters\nProduktion: MDR/NDR 2026\n\nMitwirkende: \nOscar Hoppe"
- eventId: 742990
  start: 2026-10-02T07:35:00Z
  stop: 2026-10-02T10:00:00Z
  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag\n\n * 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Stichtag: 1901 Eisenacher Frauenkongreß\n1901 Deutscher Frauentag endetBeim Wort \"Frauentag\" denkt jede und jeder reflexhaft 8. März. Doch um 1900 dachte frau, zumindest der frauenbewegte Teil - an die großen Kongresse des \"Allgemeinen Deutschen Frauenvereins\", die dieser aller zwei Jahre abhält. 1901 in Eisenach. Nicht nur der erste im neuen Jahrhundert, dass die politische Gleichberechtigung der Frau dann bringen sollte, sondern ein Frauentag, der neue Akzente für die Frauenbewegung  setzte. Ein Stichtag von Hartmut Schade.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Vekehr\nVon Paula Kautz\n\n* 10:40 Uhr - Neue Musik von Rhiannon Giddens\nAuf ihren neuen Album \"Hope is The Thing With Feathers\" legt die US-amerikanische Musikerin Rhiannon Giddens den Fokus auf das menschliche Miteinander - etwas, das mitunter nicht nur in den USA schmerzlich vermisst wird. Giddens feiert in den neuen Songs das Gemeinschaftliche und das, was daraus entstehen kann. Und genau darum war es ihr auch wichtig, bei der Entstehung der Songs selbst mit den Musikern in einem Raum zu sein. Was heute nicht mehr selbstverständlich ist. Viel eher nehmen Musiker an unterschiedlichen Orten auf und schicken sich dann Dateien zu oder treffen sich virtuell, um gemeinsam zu spielen. Für Rhiannon Gidden sist das nichts, wie sie uns erzählt hat.\n\n* 10:50 Uhr - Das Gedicht: \"In der Traumstadt ist ein Lächeln\" von Peter Paul Althaus\nLächeln - das bedeutet im physiologischen Sinne ein Gesichtsausdruck, der durch das Spannen der mimischen Muskulatur stets in der Nähe der Mundwinkel, beim \"echten\" Lächeln auch um die Augen erzeugt wird. Bei uns Menschen ist das Lächeln normalerweise ein Ausdruck der Freude, des guten Willens, und dient z. B. der Aufnahme von Kommunikation. Weshalb gerade heute eine gute Gelegenheit ist, an das \"Wunder\" des Lächelns zu erinnern? Der Kalender der kuriosen Feiertage aus aller Welt liefert den Anlass: Immer am ersten Freitag im Oktober feiern - seit 1999 - viele Länder dieses flexible Datum als World Smile Day, den internationalen Tag des Lächelns. \nUnd natürlich gibt es jetzt ein Gedicht zum Thema - und das ist um einiges älter als der \"Welttag des Lächelns\". Es stammt von Peter Paul Althaus - der Schriftsteller und Kabarettist schrieb Gedichte mit Anklängen an Morgenstern und Ringelnatz, aber dennoch von ganz eigener Prägung: zarte, filigranartige, gedanklich versponnene und verspielte Gebilde voll skurrilen Humors und von hohem poetischen Reiz. \nAus den \"Traumstadtgedichten\" von Peter Paul Althaus liest Sandra Hüller.\n\n* 11:15 Uhr - Feuilleton\nVon Jörg Schieke\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Vekehr\nVon Paula Kautz\n\n* 11:45 Uhr - Beginn Heinrich Schütz Musikfest\nDas Heinrich-Schütz-Musikfest geht heute in die nächste Runde: Von heute bis 11. Oktober erinnert das Festival an den großen mitteldeutschen Komponisten des beginnenden Barock - in diesem Jahr unter dem Motto \"Spurensuche. Anstoß und Aufbruch\". Rund 40 Veranstaltungen gibt es in Sachsen, Sachsen-Anhalt und Thüringen, unter anderem in Dresden, Gera, Weißenfels und Zeitz. Und los gehts heute in Dresden - mit einer Spurensuche, hinter der die Frage steht: wie hat die Musik von Heinrich Schütz zu seinen Lebzeiten wirklich geklungen?\nDas Berliner Vokalensemble THE PRESENT wagt als kühner Spurensucher ein Experiment und nimmt Kontakt zur Vergangenheit auf."
