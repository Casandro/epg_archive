  title: U klinču
  subtitle: Serija "U klinču" iskrena je priča o odrastanju, o trenucima u kojima mladi ljudi na prelasku iz srednjoškolskog perioda postaju studenti, zaposleni ljudi, koji počinju da ostvaruju ili se.
  description: Serija "U klinču" iskrena je priča o odrastanju, o trenucima u kojima mladi ljudi na prelasku iz srednjoškolskog perioda postaju studenti, zaposleni ljudi, koji počinju da ostvaruju ili se razočaravaju u svoje ambicije. Gledaoci će upoznati porodicu Kovač - bračni par Miru i Velju koji imaju dvoje tinejdžera. Kroz priče ovih i mnogih drugih junaka, pratićemo koji su izazovi sa kojima se danas suočavaju mladi i njihovi roditelji. Boksovaće se i sa prvim ljubavima, odlaskom iz porodičnog doma, ambicijama roditelja, u životnom, ali i pravom ringu, jer se skoro svi članovi porodice Kovač bave boksom.
- eventId: 1325382
  start: 2026-10-02T19:00:00Z
  stop: 2026-10-02T20:00:00Z
  title: Moja dedovina
  subtitle: Ovo je priča o vitezovima. Ne o onima koji su se u srednjem veku borili da spasu dedovinu za nas, već o onima koji to rade danas. Domaćin nove epizode je Darko iz Kruševca.
  description: Ovo je priča o vitezovima. Ne o onima koji su se u srednjem veku borili da spasu dedovinu za nas, već o onima koji to rade danas. Domaćin nove epizode je Darko iz Kruševca. On je takmičar u srednjevekovnim viteškim borbama. Naš domaćin i mnogi mladi ljudi širom Srbije godinama odlaze na turnire na koje dolaze ljudi iz celog sveta, kako bi pokazali veštine koje su nekada krasile njihove pretke. Darko je nedavno počeo na turnir da vodi i stariju ćerku, koja se sada takmiči u streličarstvu. Svi u familiji sada imaju razumevanja što dobar deo svog vremena posvećuje ovoj nesvakidašnjoj strasti. Svaki vitez ima svoju dedovinu. Tako i Darko ima selo Toljevac kod Varvarina. Mesto na kome je rođen njegov otac, na koje su ga vodili kao malog, mesto na kome je nekada porodica stvarala uspomene... Sada će se potruditi da okupi ljude kako bi se uspešno sproveo još jedan, važan megdan- još jedna borba da se spase dedovina... Serijal "Moja dedovina" donosi i vitezovima nešto više od tri hiljade...
- eventId: 1325383
  start: 2026-10-02T20:00:00Z
  stop: 2026-10-02T21:00:00Z
  title: Studio znanja
  subtitle: Tim predvođen Zoranom Živkovićem, autorom, urednikom i idejnim tvorcem emisije, vodiće gledaoce kroz svet nauke, obrazovanja i najrazličitijih ideja na originalan način.
  description: 'Krećemo još jednu sezonu Studija znanja! Pred nama je godina puna obrazovnih tema koje se tiču svih nas. Prva koju smo odabrali je - Moć. Moć obično zamišljamo kao nešto što pripada drugima: Onima koji imaju novac, položaj ili poslednju reč. Ipak, ona se svakodnevno pojavljuje i tamo gde je najmanje primećujemo: u tome čije odobravanje čekamo, kome ne umemo da kažemo "ne", ko raspolaže našim vremenom i ko donosi odluke u naše ime. A možda smo upravo i mi ti koji je imamo, a da toga nismo svesni. Zato ove nedelje u Studiju znanja ne govorimo samo o tome ko ima moć, već kako je svako od nas stiče, predaje, koristi, i ponekad zloupotrebljava. Naši sagovornici u prvom delu emisije su Jovan Mihojević, psiholog i Vladan Radović, teolog i sveštenik, dok su u drugom delu to Branislav Muškatirović, sociolog, Veljko Mijušković, ekonomista i Radovan Perović iz Centra za javni govor.'
