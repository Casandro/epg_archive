  title: Celnicy 3 (odc. 4)
  subtitle: 'Mężczyzna wracający z Dubaju wpada w szał. Prawdopodobnie gra i próbuje w ten sposób odciągnąć uwagę służb od swojego przyjaciela, który przewozi dużą ilość tytoniu. '
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2011
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Na lotnisku Gatwick odkryto, że pasażer przylatujący z Port of Spain ma w torbie 2,5 kg kokainy. Mężczyzna wracający z Dubaju wpada w szał, prawdopodobnie po to, by odciągnąć uwagę od swojego przyjaciela, który przewozi dużą ilość tytoniu. Wielokrotna recydywistka twierdzi, że nie wie, ile papierosów może przywieźć z Fuerteventury.
  ageRating: 12
  genre:
