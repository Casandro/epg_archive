  title: Celnicy 3 (odc. 5)
  subtitle: Kanadyjczyk jadący z Barbadosu może być pod wpływem narkotyków. Para wracająca z wakacji przewozi dużo tytoniu. Handlarz opowiada podejrzaną historię o celu swojej wizyty w Wielkiej Brytanii.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2011
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Kanadyjczyk przybywający z Barbadosu zachowuje się bardzo nerwowo podczas przesłuchania, a kontrola graniczna podejrzewa go o posiadanie narkotyków w organizmie. Mężczyzna i kobieta wracający z wakacji w Maladze twierdzą, że duża ilość tytoniu, którą przy sobie mają jest przeznaczona do użytku osobistego. Mężczyzna wracający do Birmingham z Maroka z trudem akceptuje fakt, że jego bagaż jest przeszukiwany.
  ageRating: 12
  genre:
  - '35'
