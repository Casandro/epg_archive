    Za zamkniętymi drzwiami w St. Petersburgu znajduje się Kodeks Leningradzki, najstarszy na świecie pełny tekst Biblii Hebrajskiej. Jest to najdokładniejsza wersja Biblii - zawierająca słowa i znaki zagubione w późniejszych tłumaczeniach. Timothy Smith, ekspert w dziedzinie antyków, uważa, że znalazł w jego tekście zawiły kod, który zanika w nowszych wersjach.
