  title: 24 Std. Raubfisch-Cup
  subtitle: 24 Std. Raubfisch-Cup
  description: |-
    John Chowns und Angelo Schmidt stellen sich einer besonderen Herausforderung: Sie treten in den Niederlanden bei einem 24-Stunden-Raubfischturnier an. Zusammen mit 48 anderen Teilnehmern kämpfen sie um den Sieg, indem sie versuchen, die größten Exemplare von Barsch, Zander und Hecht zu fangen. Die Zeit ist knapp, der Druck groß - können sie die Konkurrenten hinter sich lassen und die begehrten Trophäenfische landen? Ob ihnen das gelingt oder nicht, erfahrt ihr in diesem spannenden Film, der jede Menge Action am Wasser verspricht!

     NL 2024
