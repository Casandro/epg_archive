  description: |-
    Japan 2025
    11. März 2011: Japan wird vom stärksten jemals dort gemessenen Erdbeben heimgesucht. Ein gewaltiger Tsunami folgt und durchbricht die Schutzmauern des Atomkraftwerks Fukushima.

    Die dadurch ausgelöste Atomkatastrophe drohte weitaus schlimmer zu werden als Tschernobyl. Die Existenz Japans als Nation war bedroht. Der Dokumentarfilm "Fukushima" zeigt minutiös, fesselnd und schonungslos die Chronik dieser beispiellosen Katastrophe.
