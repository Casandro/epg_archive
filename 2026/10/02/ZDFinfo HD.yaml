  description: |-
    Deutschland 2026
    Sie stecken angeblich hinter dem Sturm auf die Bastille, dem Ersten Weltkrieg und der Coronapandemie: Geheime Mächte steuern die Welt, so denken viele Menschen.

    Ist der Glaube an diese angeblich geheimen Machenschaften wieder stärker geworden? "Terra X History" skizziert die Geschichte der modernen Verschwörungstheorien von der Französischen Revolution bis zu QAnon heute, um dieser Frage nachzugehen.
