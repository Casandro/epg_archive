    In Zeiten der Klimakrise wirkt die Atomkraft für viele wieder attraktiv. Doch allein die Frage nach einem Endlager scheint schwer lösbar: Einer neuen Studie zufolge könnte es in Deutschland noch rund 40 Jahre dauern, bis überhaupt ein Standort feststeht.
