  description: |-
    Dokumentation, Deutschland 2026
    Es gibt extreme Jobs, manche sind sogar lebensgefährlich: Minenräumer, Gladiatoren und Bergleute brauchen starke Nerven und sind oft nur einen falschen Schritt vom Tod entfernt.

    Was ist die Geschichte dieser gefährlichen Berufe, und wie fordern sie den Menschen? Das will MrWissen2go Geschichte Mirko Drotschmann erforschen und zugleich hautnah erleben. Dafür lässt er sich von Profis zum Minenräumer, Gladiator und Bergmann ausbilden.
    HD-Produktion
