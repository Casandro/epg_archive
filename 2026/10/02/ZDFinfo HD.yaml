  title: Die sieben geheimen Atompläne der DDR
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Nach dem Zweiten Weltkrieg liefern sich Ost und West einen Wettlauf um die Nukleartechnik. Welche geheimen Pläne verfolgt die DDR in der Atomforschung - und welche Folgen hat sie bis heute?

    30 Jahre nach dem Ende der DDR erzählt ZDFinfo die wahre Geschichte der Kernforschung im Osten. Es geht um Bomben und billigen Strom: In der DDR wird das erste deutsche Kernkraftwerk eröffnet. Und der ostdeutsche Staat liefert Uran für sowjetische Atomwaffen.
