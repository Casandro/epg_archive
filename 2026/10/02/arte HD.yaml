  title: Glanz und Pracht - Die Pariser Oper Garnier
  subtitle: Frankreich 2020
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Dokumentarfilm erzählt die Entstehungsgeschichte der Pariser Opéra Garnier. Das Gebäude und sein Grundriss brachen mit allen bisher bekannten künstlerischen, technischen und raumgestalterischen Konzepten eines Opernhauses. Veranschaulicht durch exklusive Archivbilder führt dieser Spaziergang hinter die Kulissen eines der berühmtesten Bauwerke von Paris, Symbol für den Stil des Zweiten Kaiserreichs unter Napoleon III. und der darauf folgenden frühen Dritten Republik.
