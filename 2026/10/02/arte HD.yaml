  title: Tonga, die Wucht des Unterseesvulkans
  subtitle: Großbritannien 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "15. Januar 2022: Beim Ausbruch des Vulkans Hunga Tonga-Hunga Ha'apai im Ostpazifik kommt es zur gewaltigsten Eruption, die jemals gemessen wurde. Die dabei freigesetzte Energie entspricht der von über 60 Megatonnen TNT. In wenigen Minuten wird der Inselstaat Tonga von Wellen überschwemmt, die so hoch sind wie ein sechsstöckiges Haus. \nForschende aus aller Welt versuchen, das Phänomen zu erklären: Was war die Ursache für die gewaltige Explosion? Wie kam es zu dem zerstörerischen Tsunami? Werden sich derartige Eruptionen woanders auf der Welt wiederholen?"
