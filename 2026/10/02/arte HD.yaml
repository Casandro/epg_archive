  audiodesc: true
  description: 'Nach Jahren des Krieges unter den Göttern wird der Waffenstillstand durch den Austausch von Geiseln besiegelt. Freya, die Wanengöttin der Liebe, geht nach Asgard; die Wanen fordern Hönir und Mimir. Schon bald aber wird der Frieden von dunklen Ereignissen überschattet: Ein geheimnisvoller Baumeister bietet Odin an, seinen Schutzwall zu reparieren; dann stiehlt der König der Riesen Thors magischen Hammer Mjöllnir. Beide verlangen als Pfand die Hand Freyas. Wieder gelingt es dank Lokis guten Einfällen, die schlimmsten Katastrophen zu verhindern. Odin aber wird misstrauisch: Kann er Loki wirklich trauen?'
