  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wenn finanzielle Krisen oder schwere Erkrankungen das Leben erschüttern, stehen Menschen vor der Frage, worauf sie noch hoffen und vertrauen sollen. Anne und die beiden Ehepaare Sanders und King erzählen, warum sie sich dazu entschlossen haben, auf Gott zu vertrauen und wie es ihnen damit erging. (Moderation: Marzia Plichta / Andreas Waldmann)'
