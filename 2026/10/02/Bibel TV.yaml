  title: Hautnah - Gott mitten im Leben
  subtitle: Vater, Vorbild, voll sympathisch
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jürgen Schulz ist Pastor, Gemeindegründer, Gastdozent am Theologischen Seminar Rheinland (TSR) und Doktorand (bis 2023). Darüber, wie wichtig es ist, Sinn und Halt zu haben losgelöst von den Umständen des Lebens, spricht er mit Detlef Eigenbrodt.'
