  title: Bibel TV Das Gespräch
  subtitle: 'Cornelius Beck: Ein Vaterherz lernt dazu'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Was bedeutet es, in der heutigen Zeit Vater zu sein? Mit der Geburt eines Kindes beginnt ein Abenteuer, das alles andere zunächst einmal in den Hintergrund rückt. Aber während der Nachwuchs im Kleinkindalter ist, sind viele Eltern noch auf der Suche nach Selbstverwirklichung oder Karriere. Der fünffache Vater Cornelius Beck spricht über Grenzerfahrungen, Lernprozesse und ein Vertrauen, das auf göttlicher Liebe gründet. Moderation: Bente Rathjen.'
