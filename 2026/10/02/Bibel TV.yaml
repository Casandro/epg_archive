  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die taube Claudia Baratti hat es nicht leicht. Sie ist in Lorenzo verliebt, traut sich aber nicht, ihm diese Liebe zu gestehen, da sie Angst hat, er könne sie aufgrund ihrer Behinderung abweisen. Das Gefhlschaos eskaliert, als ihr Chef Dr. Cardori ermordet aufgefunden wird. Sie selbst und die Polizei verdchtigen nmlich Lorenzo des Mordes, da dieser am Tag zuvor Streit mit dem Opfer hatte. In ihrer Verzweiflung bittet Claudia Don Matteo um Hilfe.'
