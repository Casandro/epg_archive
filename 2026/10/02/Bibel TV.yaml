  title: The Mercy Ships
  subtitle: Hochzeit und ein Notfall
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Ein besonderer Tag steht bevor: Joshua ist zur Hochzeit einer Patientin eingeladen. Während die Vorbereitungen laufen, ertönen an Bord plötzlich die Alarmsirenen. Ein medizinischer Notfall fordert die Crew heraus und zeigt, wie schnell sich der Alltag auf einem Hospitalschiff verndern kann. Und dann fehlt auch noch Blut fr eine bevorstehende Operation. Mit Spannung und bewegenden Begegnungen beginnt eine Reise mitten hinein in das Leben an Bord der Mercy Ships.'
  genre:
  - '115'
- eventId: 791555
  start: 2026-10-02T20:00:00Z
  stop: 2026-10-02T20:30:00Z
  title: The Mercy Ships
  subtitle: Hoffnung bis zuletzt
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nicht jede Behandlung endet mit einer Operation. Ein Palliativteam von Mercy Ships begleitet Menschen, bei denen keine körperliche Heilung mehr möglich ist - und schenkt ihnen dennoch etwas Kostbares: Zeit, Nhe und Wrde. Gleichzeitig entstehen an Bord Musik und handwerkliche Projekte, die Menschen miteinander verbinden. Diese Folge zeigt eine besondere Seite der medizinischen Arbeit: Hoffnung bedeutet nicht immer, gesund zu werden. Manchmal bedeutet sie, in schweren Momenten nicht allein zu sein.'
  genre:
  - '115'
