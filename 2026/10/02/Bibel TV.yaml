  title: The Mercy Ships
  subtitle: Hoffnung bis zuletzt
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nicht jede Behandlung endet mit einer Operation. Ein Palliativteam von Mercy Ships begleitet Menschen, bei denen keine körperliche Heilung mehr möglich ist - und schenkt ihnen dennoch etwas Kostbares: Zeit, Nhe und Wrde. Gleichzeitig entstehen an Bord Musik und handwerkliche Projekte, die Menschen miteinander verbinden. Diese Folge zeigt eine besondere Seite der medizinischen Arbeit: Hoffnung bedeutet nicht immer, gesund zu werden. Manchmal bedeutet sie, in schweren Momenten nicht allein zu sein.'
