  title: The Mercy Ships
  subtitle: Hochzeit und ein Notfall
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Ein besonderer Tag steht bevor: Joshua ist zur Hochzeit einer Patientin eingeladen. Während die Vorbereitungen laufen, ertönen an Bord plötzlich die Alarmsirenen. Ein medizinischer Notfall fordert die Crew heraus und zeigt, wie schnell sich der Alltag auf einem Hospitalschiff verändern kann. Und dann fehlt auch noch Blut für eine bevorstehende Operation. Mit Spannung und bewegenden Begegnungen beginnt eine Reise mitten hinein in das Leben an Bord der Mercy Ships.'
