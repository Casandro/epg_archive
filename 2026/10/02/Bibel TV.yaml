  title: Gottes Häuser
  subtitle: St. Michaeliskirche zu Hildesheim
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Bischof Bernward von Hildesheim hat den Grundstein der evangelisch-lutherischen Michaeliskirche im Jahre 1010 setzen lassen. Zunächst als ein Kloster für Benediktiner gegründet erlebte St. Michaelis eine sehr wechselvolle und bewegte Geschichte. Bis auf den heutigen Tag verfügt das 1000 Jahre alte Gotteshaus über einen katholischen und einen evangelischen Teil. Pastor Dirk Woltmann lädt auf eine Reise durch Zeit und Raum in das sechstürmige Gotteshaus des Heiligen Michael ein.'
