  title: 'Espagne : malgré la croissance, un gouvernement en pleine tempête ! '
  subtitle: 'Avec son plan de régularisation d''un million de migrants et sa croissance à 2,6 %, l''Espagne de Pedro Sánchez fait figure d''except '
  description: "Espagne : malgré la croissance, un gouvernement en pleine tempête !\n\nAvec son plan de régularisation d'un million de migrants, l'Espagne de Pedro Sánchez fait figure d'exception. Sa croissance à 2,6 %, en dépit d'une inflation de 3,2 %, confirme sa place d'économie la plus dynamique de la zone euro. Mais après trois années sans vote de budget, faute de majorité au Parlement, en raison aussi des scandales et des affaires judiciaires qui éclaboussent son épouse et le parti socialiste, le Premier ministre espagnol est en grande difficulté. La droite, le parti d'extrême droite Vox et plusieurs partis de gauche réclament des élections anticipées. Fort à l'étranger, affaibli en Espagne, Pedro Sánchez, qui a passé huit ans à la Moncloa, peut-il se maintenir au pouvoir ? \n\nInvités : Sébastien Farré, historien, spécialiste de l'Espagne contemporaine à la Maison de l'histoire UNIGE ; Benoît Pellistrandi, historien, spécialiste de l'Espagne ; Mélanie Gallard, journaliste à France Télévisions \n\nPrésentation : Dominique Laresche\n "
