  description: "Au sommaire : \n\nIA, la fabrique à arnaques\nL'image de personnalités publiques est détournée par l'IA pour promouvoir de faux investissements sur des plateformes de trading frauduleuses. À partir de témoignages de victimes, des journalistes ont remonté la filière d'un réseau tentaculaire, du Kazakhstan à la Lituanie, en passant par Chypre.\n\nIA, confident mortel\nChatGPT, peut-il vous tuer ? Les agents conversationnels s'immiscent progressivement dans le quotidien. Bluffants dans l'échange et pratiques, sont-ils aussi inoffensifs qu'ils paraissent ? Aux États-Unis, plus de 150 suicides et psychoses seraient directement liées à leur utilisation. Des procédures judiciaires ont été lancées contre leurs concepteurs pour encouragement au suicide et tromperie.\n\nPrésentation : Justine Katz\n "
