  title: Před kostelem
  description: 'Autor: Jacob Janek, Karolína Němcová; Interpret: Tomáš Holub; Premiéra: 15.9.2025 * Válka je dnes každodenní realitou ? slyšíme o ní ve zprávách, promítá se do politiky i do našich osobních obav. Jak se na ni ale dívat z křesťanského a etického hlediska? Existuje ?spravedlivá válka“? A co znamená víra tváří v tvář ozbrojenému konfliktu?O etice války, o tom, zda je někdy možné vzít do ruky zbraň, o úloze církve i o tom, jak se vyznat v současných konfliktech na Ukrajině či v Pásmu Gazy, mluví v této epizodě plzeňský biskup Tomáš Holub. Biskup Holub se problematice věnuje nejen akademicky na Teologické fakultě UK, ale také prakticky ? více než deset let působil jako hlavní vojenský kaplan Armády České republiky.'
