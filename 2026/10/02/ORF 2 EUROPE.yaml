  description: "- KFZ-Betrug: Ein Steirer verkauft sein Auto auf \"willhaben\". Das Fahrzeug wechselt den Besitzer, das Geld jedoch nie. Die Überweisungsbestätigung ist gefälscht und das Auto weg. Nur Stunden später verkaufen die Täter den Wagen weiter. Was ist passiert und wie kann man sich beim Autoverkauf vor Betrügern schützen?\n- Scheinfirmen: Wenn zu Hause plötzlich der Strom ausfällt, Wasser aus einer Leitung tritt oder die Heizung streikt, muss es meist schnell gehen. Genau diese Notlage nützen Scheinfirmen aus: Ihre Inserate erscheinen bei der Suche im Internet ganz oben, ihr Auftreten wirkt professionell, sie sind rasch zur Stelle. Doch ihre Arbeit ist meist unzulänglich, die Rechnung überhöht. \n- Jenseitskontakte: Herr K. aus Oberösterreich wollte mit seiner verstorbenen Schwiegermutter in Kontakt treten und ging zu einem Medium. Ein Jahr lang musste er auf den Termin warten.  Danach war er enttäuscht - es seien nur allgemeine Phrasen gedroschen worden, sagt er. Gibt es Menschen, die Nachrichten von Toten empfangen können, oder handelt es sich bei solchen Angeboten um Betrug?"
