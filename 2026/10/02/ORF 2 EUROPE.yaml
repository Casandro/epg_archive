  title: Daheim - das Volksgruppenmagazin
  description: "- Debatte über Sonntagsmesse auf Slowenisch: Im südkärntnerischen Zell/Sele ist Slowenisch nach wie vor stark verbreitet: In vielen Familien genauso wie in der Schule, am Fußballplatz und vor allem auch in der Kirche. Denn die traditionelle Sonntagsmesse wird ausschließlich auf Slowenisch gefeiert. \n- Porträt: Wer ist Paul Lendvai? 70 Jahre ist es heuer her, dass sich Ungarn im Oktober 1956 beim ungarischen Volksaufstand gegen die sowjetische Herrschaft erhob. Was mit der Hoffnung auf Freiheit begann, endete in Niederschlagung und Flucht. Auch bei Paul Lendvai. Der bekannte Journalist und Autor ist einer von fast 200.000 Ungarn, die damals nach Österreich geflüchtet sind. \n- Barga: Klein-Schottland in Italien: Dass es in Italien deutschsprachige wie auch slowenisch- oder kroatischsprachige Ortschaften gibt, ist vielen bekannt. Aber von einem schottischen Dorf in der Toskana wissen vermutlich die wenigsten. \n- In der Serie \"Wie sagt man ...?\" treffen einander sechs junge Menschen aus den sechs autochthonen Volksgruppen Österreichs und sind für den ORF gewissermaßen als lebende Wörterbücher, die sich miteinander austauschen, im Einsatz. Dieses Mal geht es um das Gesicht."
  genre:
  - '130'
- eventId: 1205646
