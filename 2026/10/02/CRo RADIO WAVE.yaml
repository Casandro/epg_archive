  description: Svobodně se pohybujeme po horách, ve vodách, ve vzduchu nebo i v podzemí, respektujeme cizí kultury. Inspirujeme k cestám po vlastní ose a proti xenofobní šedi a fyzické pasivitě. Moderuje Pavel Sladký.
