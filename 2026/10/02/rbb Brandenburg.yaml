  title: In aller Freundschaft (604)
  subtitle: Gefühlsschwankungen
  episodeUri: crid://onid-1/e/6a88cd628a863603524b841d
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: Gerald Hoffmann wird nach einem Sturz mit Schnittwunden und Prellungen in die Sachsenklinik eingeliefert. Gerald gibt an, dass ihm in letzter Zeit des Öfteren schwindlig war. Bei den Untersuchungen stellt Martin Stein einen Herzfehler fest. Eine Herzklappe funktioniert nicht mehr richtig und muss durch eine Prothese ersetzt werden. Während Gerald schwer geschockt ist, scheint seine Frau Sandra emotional völlig unbeteiligt zu sein. Seit einiger Zeit herrscht in der Ehe der Hoffmanns Eiszeit und Gerald leidet darunter, denn er liebt seine Frau. Sandra hat jedoch keine Veränderungen an ihrer Beziehung festgestellt.
