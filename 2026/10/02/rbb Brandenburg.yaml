  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: "Ein seltsamer Anblick: Gleich zwei Hochzeitspaare steuern eilig auf die Notaufnahme des Johannes-Thal-Klinikums zu. Ben und Leyla wurden auf dem Weg zum Standesamt Zeugen eines schweren Autounfalls. Während Isabel König nur leicht verletzt ist, wird ihr Verlobter Martin Schlosser mit schweren inneren Verletzungen ins Johannes-Thal-Klinikum eingeliefert. So haben sich beide Paare diesen besonderen Tag ganz und gar nicht vorgestellt. \nMatteo, der von all dem Trubel nichts mitbekommen hat, will nur eines: einen Patienten finden, der seinen Genius so sehr benötigt, dass er sich vor der Feier drücken kann."
