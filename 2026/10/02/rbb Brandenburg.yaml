  ageRating: 12
  description: Die 16-jährige Florentine Sommer ist beim Sprayen erwischt worden. Auf der Flucht stürzt sie und verletzt sich am Ellenbogen. In der Sachsenklinik stellt Dr. Martin Stein eine Prellung fest. Tessa Sommer ist ratlos und versteht ihre Schwester Florentine nicht mehr. Seit dem Tod ihrer Eltern bei einem Autounfall hat Tessa Florentines Vormundschaft übernommen und alles lief bisher reibungslos. Doch seit einigen Wochen scheint Florentine verändert zu sein. Sie rebelliert, treibt sich rum, schwänzt die Schule.
- eventId: 544153
