  title: Formel 1 - Gulf Air Grand Prix von Bahrain in Malaysia
  subtitle: 1. Freies Training
  description: |-
    Neue Teamkonstellationen, spektakuläre Fahrerwechsel und vielversprechende Nachwuchstalente versprechen eine der spannendsten Formel-1-Saisons der letzten Jahre. Max Verstappen geht als Titelverteidiger in das Jahr 2025, doch mit Lewis Hamiltons Wechsel zu Ferrari und der beeindruckenden Entwicklung von McLaren könnte sich das Kräfteverhältnis in der Königsklasse drastisch verschieben. Auch Mercedes mit George Russell sowie Aston Martin mit Fernando Alonso haben über den Winter intensiv gearbeitet und könnten eine Schlüsselrolle im Titelkampf spielen. Die Konkurrenz ist so stark wie lange nicht mehr - und mit möglichen Überraschungen von Alpine oder Williams könnte das Feld noch enger zusammenrücken.
    Bei sämtlichen Live-Übertragungen liefern Moderatoren Andrea Schlager und Patrick Laub und der Experte Christian Klien exklusive Stimmungsberichte, aktuelle News und spannende Interviews direkt aus den Boxengassen. Die Rennen werden von Andreas Gröbl und Daniel Goggi kommentiert, unterstützt von den Experten Mathias Lauda, Philipp Eng und Philipp Brändle. Zusätzlich gibt es ausführliche Vorschauen, detaillierte Nachbetrachtungen, tiefgehende Analysen und fesselnde Hintergrundgeschichten rund um die Formel 1. Die Saison 2025 verspricht Motorsport auf höchstem Niveau - mit packenden Duellen, taktischen Meisterleistungen und möglicherweise einem neuen Weltmeister am Ende des Jahres.Malaysia 2026
  genre:
  - '64'
