  title: Hubert und Staller
  subtitle: Geheimrezepte
  description: |-
    Sonja Wirth will gerade eine aufgebrachte Kundin zu einer Reklamation in den Hofladen "Lange leben" begleitet, als sie dort eine schreckliche Entdeckung macht: Für den Inhaber Thomas Lange hat sich das Motto seines Geschäfts ganz offensichtlich nicht erfüllt, er liegt tot auf dem Boden. Dr. Anja Licht kann keine unmittelbaren Hinweise auf äußere Gewalteinwirkung finden. Als Hubert und Staller am Tatort eintreffen, nimmt die Ermittlung Fahrt auf: Hubert kann offenbar als Einziger den Bittermandelgeruch von Zyankali wahrnehmen. Eine Tüte mit Biolebensmitteln, die beim Toten gefunden wird, lässt sich zum Geschäftskonkurrenten Markus Till zurückverfolgen. Jedoch ein Test am lebenden Objekt zeigt, dass die Waren nicht vergiftet sind. Gerade als Hubert und Staller dabei sind, einen weiteren Tatverdächtigen auszumachen, stoßen sie im Café Rattlinger auf weitere mit Zyankali versetzte Waren.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.
    Krimi, Deutschland 2016, R: Philipp Osthus
  widescreen: true
