  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Kosmische Grabstätten
  description: |-
    Eines der größten Rätsel Ägyptens ist das Serapeum von Sakkara. Diese unterirdische Kammer, die 1850 tief unter der Wüstenoberfläche entdeckt wurde, enthält einen 210 Meter langen Gang, der zu einer Reihe von Nischen führt, die sorgfältig in den Kalksteinfelsen gehauen wurden. In diesen Nischen befinden sich 24 gigantische Sarkophage, die aus massivem Stein gearbeitet sind und jeweils bis zu 62 Tonnen wiegen. Aber dienten diese riesigen Kästen wirklich dazu, die sterblichen Überreste heiliger Stiere aufzunehmen, wie die meisten Ägyptologen glauben? Oder hatten sie vielleicht einen anderen Zweck? Könnte es sogar möglich sein, dass das Serapeum von außerirdischen Besuchern entworfen wurde?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2024, R: Jonny Haug, Mitch Marcus
  widescreen: true
- eventId: 1365256
