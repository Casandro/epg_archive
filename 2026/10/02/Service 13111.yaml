  title: Heimatleuchten
  subtitle: So schmeckt Südtirol
  description: 'Zwischen Palmen und Gletschern, zwischen Apfelblüten und Bergkräutern: In Südtirol trifft Deftiges aus dem Alpenland auf leichte mediterrane Küche. Das Zusammenspiel der Kulturen prägt nicht nur die Kochtöpfe, sondern auch eine besondere Lebensart und Gastfreundlichkeit. Die regionalen Schätze - ob Schüttelbrot, Schwarzplentene Knödel oder Südtiroler Speck - genießt man in den zahlreichen Buschenschanken und Almhütten. Und nirgendwo sonst finden Obst und Wein so hervorragende klimatische Bedingungen, wie im Gourmetland an der Südseite der Alpen. Österreich 2018'
