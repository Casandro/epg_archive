  title: Winzerlegenden
  subtitle: Magie
  description: |-
    Das Weingut Prager ist ein Haus der starken Frauen; Seniorchef Toni Bodenstein war der fünfte Schwiegersohn in Folge. Er und Ilse haben die goldenen Jahrzehnte der Wachau mitgeprägt. Sohn Robert, gelernter Volkswirt und studierter Weinbauer, ist der erste männliche Nachfolger. Geheiratet hat er ein Wachauer Weib: Sophie. Never change a winning system, right?

    Im Weinbaugebiet Thermenregion, südwestlich von Wien, liegt das Weingut Reinisch, ein Haus, das alles kann: Weiß, Rot und Prickelndes - und ein Haubenlokal haben sie auch noch! Berühmt ist die Familie Reinisch aber für den sagenumwobenen Pinot Noir.

    An der Südsteirischen Weinstraße gibt es einen Berg, der zwei Stars der Naturweinbewegung beherbergt. Oben sitzt Andreas Tscheppe und unten der jüngere Bruder Ewald Tscheppe, der das Elternhaus mit dem Hofnamen Werlitsch übernommen hat. Ewald war gerade auf dem Sprung nach Frankreich, als einer seiner Brüder im Weingarten sein Leben verlor. So blieb Ewald, übernahm den Betrieb, keltert Naturwein und bedient sich der biodynamischen Wirtschaftsweise. Was das heißt? Gesunder Boden, gesunde Pflanze, gesundes Lebensmittel. Prost!Österreich 2026, R: Alexander Saran
