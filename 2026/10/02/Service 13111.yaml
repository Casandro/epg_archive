  title: TM Wissen Spezial
  subtitle: Zwischen Ohr und Unterwelt - Wie Forschung unseren Alltag verändert
  description: 'Von Ohrwürmern im Kopf über Wasser im Berg bis zu Käse aus Kernen. Warum bleibt uns ein Lied tagelang im Kopf? Musik-Wissenschaftler der Universität Wien erforschen das Phänomen "Ohrwurm" und erklären, welche Melodien sich besonders hartnäckig im Gehirn festsetzen. Produzent Lukas Hillebrand zeigt, welche musikalischen Zutaten ein Song braucht, um ein Ohrwurm zu werden - und wie man ihn auch wieder loswird. Tief unter dem Hochschwabmassiv erkunden Geologen den Steinbockschacht, die tiefste Höhle der Steiermark. Hier verfolgen sie den Weg des Wassers, das später Wiens Trinkwasser-Versorgung speist. Mit modernen Messmethoden analysieren die Forscher, wie sich Schadstoffe fernhalten lassen und wie sich Klima-Veränderungen auf Qualität und Menge des Wassers auswirken. Ziel: größtmögliche Sicherheit für eines der besten Trinkwasser der Welt. Auch in der Lebensmittel-Produktion bringt Forschung überraschende Lösungen hervor: Der Wiener Chemiker Leo Sulzmann stellt veganen Käse aus Marillenkernen her - einem bisher ungenutzten Abfallprodukt. Die enthaltene Blausäure wird neutralisiert, übrig bleibt ein hochwertiges, nachhaltiges Lebensmittel. Ob der rein pflanzliche Camembert auch geschmacklich überzeugt, zeigt ein innovatives Experiment zwischen Wissenschaft und Genuss.Österreich 2024'
  genre:
  - '144'
  widescreen: true
- eventId: 1365257
  start: 2026-10-02T10:02:32Z
  stop: 2026-10-02T11:00:00Z
  title: TM Wissen Spezial
  subtitle: Zwischen Ohr und Unterwelt - Wie Forschung unseren Alltag verändert
  description: 'Von Ohrwürmern im Kopf über Wasser im Berg bis zu Käse aus Kernen. Warum bleibt uns ein Lied tagelang im Kopf? Musik-Wissenschaftler der Universität Wien erforschen das Phänomen "Ohrwurm" und erklären, welche Melodien sich besonders hartnäckig im Gehirn festsetzen. Produzent Lukas Hillebrand zeigt, welche musikalischen Zutaten ein Song braucht, um ein Ohrwurm zu werden - und wie man ihn auch wieder loswird. Tief unter dem Hochschwabmassiv erkunden Geologen den Steinbockschacht, die tiefste Höhle der Steiermark. Hier verfolgen sie den Weg des Wassers, das später Wiens Trinkwasser-Versorgung speist. Mit modernen Messmethoden analysieren die Forscher, wie sich Schadstoffe fernhalten lassen und wie sich Klima-Veränderungen auf Qualität und Menge des Wassers auswirken. Ziel: größtmögliche Sicherheit für eines der besten Trinkwasser der Welt. Auch in der Lebensmittel-Produktion bringt Forschung überraschende Lösungen hervor: Der Wiener Chemiker Leo Sulzmann stellt veganen Käse aus Marillenkernen her - einem bisher ungenutzten Abfallprodukt. Die enthaltene Blausäure wird neutralisiert, übrig bleibt ein hochwertiges, nachhaltiges Lebensmittel. Ob der rein pflanzliche Camembert auch geschmacklich überzeugt, zeigt ein innovatives Experiment zwischen Wissenschaft und Genuss.Österreich 2024'
  genre:
  - '144'
  widescreen: true
