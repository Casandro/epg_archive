  title: Planet Weltweit - Die rasenden Engel der Linea 5
  subtitle: Planet Weltweit - Die rasenden Engel der Linea 5
  description: 'Ein paar Bretter und vier Räder aus Kugellagern bestimmen ihr Leben: Auf ihren selbstgebauten Karren stürzen sich die Balineros die höchste und gefährlichste Passstraße Kolumbiens hinunter, um überall dort mit anzupacken, wo sie gebraucht werden. Ohne diese Männer würden die Fernfahrer, die ihre Waren über den Pass transportieren, oftmals scheitern. Die Reportage zeigt das Leben der Balineros am Pass der Línea 5 und begleitet einen Fernfahrer nach Buenaventura, der wichtigsten Hafenstadt Kolumbiens am Pazifik. Kolumbien - ein Land, das ein über 50 Jahre dauernder Bürgerkrieg beinahe unregierbar gemacht hat, ein Land, in dem Bedrohungen zum Alltag gehören. Unter diesen Bedingungen ist es nicht einfach, die Menschen mit dem Lebensnotwendigen zu versorgen. Es sind die Fernfahrer mit ihren Schwertransportern, die die Verbindung zwischen den Städten und Regionen aufrecht halten. Auf ihrem Weg durch Kolumbien müssen sie die Anden überqueren. Über die mittlere und höchste Bergkette, die Zentralkordillere, führt nur eine einzige für Lastwagen befahrbare Passstraße - die Línea 5. In unendlichen Kurven und Windungen geht es bis auf 3200 Meter hinauf und auf der anderen Seite wieder hinunter. Steile Serpentinen, Wetterstürze und Nebelschwaden machen die Passüberquerung extrem gefährlich. An diesem Nadelöhr zwischen Ost und West leben die so genannten Balineros - die "Kugellagerer". Auf selbstgezimmerten Karren, die sie aus ein paar Brettern und den heiß begehrten Kugellagern zusammenbauen, rasen die Balineros überall hin, wo sie gebraucht werden und anpacken können. Loco kann sich ein Leben ohne die Línea 5 nicht vorstellen, sie ist sein Wohnort, sein Arbeitsplatz, sein Lebenssinn - trotz der täglichen Gefahr durch Verkehr und Guerilla. Seit über 30 Jahren ist er mit seinen Kollegen hier jeden Tag bergab- und bergaufwärts unterwegs. DE 2004'
  ageRating: 6
