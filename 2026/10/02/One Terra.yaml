  title: Planet Weltweit - Wilde Waterkant - Nordfriesland und seine Gänse
  subtitle: Planet Weltweit - Wilde Waterkant - Nordfriesland und seine Gänse
  description: 'Planet Weltweit: Die Gänse kommen! Für Naturschützer Martin Kühn ein Grund zum Jubeln. Riesige Schwärme lassen sich jeden April in Nordfriesland nieder, bevor es weitergeht in die arktischen Brutgebiete. Was Naturfreunde begeistert, ist für Bauern an der Küste eine Katastrophe: Die Gänse rasten nun auf ihren Feldern und fressen jeden Halm kurz. Noch vor 50 Jahren waren Nonnengänse vom Aussterben bedroht. Heute gibt es wieder Hunderttausende. Brüteten sie früher nur in den Polargebieten, sind sie inzwischen auch an der Ostsee und selbst an Norddeutschlands Westküste zu finden. Was Biologen und Naturschützer freut, alarmiert jedoch zunehmend viele Landwirte. Denn die Vögel richten erheblichen Schaden auf ihren Feldern an. Nicht nur das: Während die Tiere früher in Nordfriesland nur als Kurzzeitgäste zu Besuch waren, bleiben einige von ihnen inzwischen den ganzen Sommer hier. Und vermehren sich dank strikter Schutzmaßnahmen prächtig. In den Augen vieler Bauern sind die inzwischen nicht mehr gerechtfertigt. Sie fordern eine Bejagung und wollen notfalls selbst zum Gewehr greifen. Das wollen Naturschützer und Vogelliebhaber verhindern. Einer davon ist Martin Kühn, Ranger im Nationalpark Wattenmeer. Doch wie könnte schlussendlich ein Kompromiss für beide Seiten aussehen? DE 2021'
