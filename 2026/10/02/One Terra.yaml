  title: Planet Weltweit - Goldrausch in Sibirien
  subtitle: Planet Weltweit - Goldrausch in Sibirien
  description: |-
    Goldrausch in Sibirien"
    Ein Film von Wolfgang Mertin

    Die Reportage zeigt, wie Sibirien, die Schatzkammer Russlands, die Türen öffnet - Berge und Flüsse ihren Schatz freigeben: Gold.
    Konstantin Tzelidse hat diesen Wert erkannt und die Möglichkeiten, Gold im großen Stil industriell zu fördern. Einst war er ein einfacher Goldwäscher, heute nennt man ihn den "Goldkönig vom Sajan".

    In Sibirien und im fernen Osten ist sehr viel Gold zu finden, doch der Abbau ist schwierig. Das Gold liegt in fast unzugänglichen Gebieten ohne Straßen, fernab der Zivilisation, in Sümpfen und Dauerfrostböden. Die Förderung ist meist nur in den Sommermonaten möglich. Für die Goldgräber bedeutet das ein Leben im Dreck, umringt von Mückenschwärmen. Konstantin Tzelidse ist schon seit über 20 Jahren Goldgräber. Er hat als einfacher Goldwäscher angefangen, gründete 1992 seine eigene Goldminengesellschaft und ist mittlerweile mehrfacher Millionär. Seine vier Goldgruben liegen zwischen der weiten Jenissejsteppe und den Ausläufern des mächtigen Sajangebirges. Hier hat schon vor über 2.500 Jahren das Nomadenvolk der Skythen Gold gefunden und damit seine Königsgräber geschmückt. Der Job ist lukrativ aber hart: Mit einfachen Werkzeugen und Wasserkanonen spülen Tzelidses Männer in der Flusswäscherei das Gold aus Geröll und Gestein. Es wird in Zwölf-Stunden-Schichten gearbeitet, ohne einen einzigen Tag Pause, sechs Monate lang. Ein Goldgräberdorf bietet wenig Luxus: Es gibt einen Backofen, eine Sauna, eine Kantine und primitive Wohnhütten. Obwohl das Gold von einem schwer bewaffneten Sicherheitsdienst bewacht wird, sind brutale Überfälle keine Seltenheit. Tschasi Gol ist Tzelidses größte und modernste Goldmine - und sein ganzer Stolz. Hier gelang es ihm, ein noch effizienteres Verfahren der Goldgewinnung einzuführen. Doch Tzelidse will mehr: Ein Team von Geologen sucht tief in der Wildnis des Sajangebirges einen Standort für eine neue weit größere Goldmine.
     DE 2004
