  title: Planet Weltweit - Die Lowrider-Ladys von L. A.
  subtitle: Planet Weltweit - Die Lowrider-Ladys von L. A.
  description: 'Planet Weltweit: Auf Kaliforniens Straßen sind sie ein echter Hingucker: Lowrider - tiefer gelegte, alte Straßenkreuzer. Sie können auf drei Rädern fahren und krachend auf und ab springen. Am Steuer der kultigen Oldtimer sitzen inzwischen immer mehr Frauen. Dabei ist Lowriding traditionell eigentlich Männersache. Seit den 1960er-Jahren schrauben die Enthusiasten an ihren Chevrolets, Buicks oder Oldsmobiles herum und bauen jede Menge Batterien und Sprungmotoren in den Kofferraum. Von Schmieröl an den Händen lassen sich aber mittlerweile auch die Lowrider-Ladys nicht mehr abschrecken. Und selbst das gefährliche und illegale Springen, das spektakuläre Hoppen, übernehmen sie jetzt, die letzte Männerdomäne. Der kultige Motorsport ist vor allem Hobby der Chicanos, wie sich die Bevölkerung mit mexikanischen Wurzeln selbst nennt. Während andere Autos immer höher gelegt wurden, legten sie ihre Karosserien derart tief, dass sie den Asphalt zu berühren scheinen. Hydraulikmotoren von Müll-Lastern waren die Inspiration der ersten Lowrider, ihre Wagen auch in schiefe Lagen zu bringen oder sogar springen zu lassen. Die First Class Ladys gehören zu den ersten Frauenclubs in der Szene. Die sechs Mitglieder wollen das Image der Lowrider aufpolieren, denn die tätowierte Menge mit den schrägen Autos ist vielen suspekt. Der Club will Gutes tun und sammelt Spenden für die Obdachlosen von L.A. Gladys Ramos hingegen geht ihren ganz eigenen Weg. Die 43jährige hat es auch satt, sich von Männern Vorschriften machen zu lassen. Sie will das Hoppen unbedingt lernen, auch wenn das nicht einfach wird. Die 28jährige Jazmen Lopez ist noch viel provokanter: Die Mutter zweier Kinder lässt bereits ihren Wagen beachtlich hochspringen. Es kracht und knarzt dabei - nicht selten fliegen durch die Wucht des Hüpfens Teile durch die Luft. Ein schräger Freizeitspaß, bei dem immer wieder auch mal Batterien explodieren oder Autos brennen können.   DE 2021'
