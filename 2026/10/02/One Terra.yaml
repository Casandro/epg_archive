  title: Planet Weltweit - Die Bergführer von San Martino
  subtitle: Planet Weltweit - Die Bergführer von San Martino
  description: 'Planet Weltweit: Die Pale di San Martino ist eine spektakuläre Berggruppe in den Dolomiten. Gefürchtet und geachtet unter Bergsteigern. Am Fuße der Pale, im Dorf San Martino di Castrozza, gibt es seit mehr als einhundert Jahren eine hochangesehene Gruppe von Bergführern:  die Aquile di San Martino, die Adler von San Martino. Wer ein Adler werden will, muss nicht nur hier leben sondern auch jahrelange Erfahrung als Bergsteiger, Kletterer und Guide mitbringen. Über die Aufnahme in die Truppe entscheidet eine letzte große Prüfung. Wird sich Livio seinen Lebenstraum erfüllen können, Teil der legendären Truppe zu werden? Rocco Romagna ist der Chef der Adler von San Martino. Hauptaufgabe der Bergführer-Truppe ist es, die Sicherheit ihrer Kunden und der Bergsteiger in der Region im Allgemeinen zu gewährleisten. Die Sehnsucht vieler Kletterer, die steilen Felswände hoch zum Gipfel zu überwinden birgt viele Risiken und Gefahren. Es liegt in der Verantwortung der Bergführer, die Fähigkeiten der Kletterer zu beurteilen und entsprechende Vorkehrungen und Absicherungen zu treffen. Geschicklichkeit und sichere Navigation ist hier in den Bergen oberstes Gebot. Der Mittdreißiger Livio Pinese ist Bergsteiger mit viel Erfahrung, doch trotz jahrelangen Trainings und vieler Ausbildungsetappen fehlt ihm eines: die Prüfung, um endlich Bergführer der Aquile di San Martino zu werden. In diesem Sommer haben sich zwei junge Leute bei Rocco zu einer Expedition in die Pale di San Martino angemeldet. In einer zweitägigen, ziemlich riskanten Expedition wollen sie  hoch zum Gipfelkreuz der Rosetta, in 2700 Metern Höhe. Mit diesem Auftrag sieht Rocco die Zeit für Livios Prüfung gekommen: Er soll die kleine Gruppe führen. Wird es Livio schaffen, die kleine Gruppe, unter den strengen Augen seines Lehrers Rocco, hoch auf den Gipfel zu bringen? Um dann endlich ein Adler zu werden?  DE 2021'
