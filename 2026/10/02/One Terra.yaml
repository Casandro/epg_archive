  title: Planet Weltweit - Pelota, die baskische Leidenschaft
  subtitle: Planet Weltweit - Pelota, die baskische Leidenschaft
  description: Wohl kaum eine Sportart verbindet die Menschen im Baskenland so sehr wie Pelota. Gelegen auf der Grenze zwischen Frankreich und Spanien, sieht sich die Region bis heute als eigenständige Provinz mit einer gemeinsamen Kultur, Sprache und Identität. Über die Jahrhunderte gab es immer wieder Bestrebungen sich zu lösen und einen eigenen Staat zu errichten. Was mitunter gar in Gewalttätigkeiten mündete. Heute gilt die Region als friedlich, die eigene Identität wird dennoch betont und gepflegt. Das Pelota-Spiel ist ein wichtiger Teil davon. Man kann Pelota mit der Hand spielen oder mit einem Schläger, auch mit einem eigens angefertigten Handschuh. Wichtig ist, dass es eine gegenüberliegende Wand gibt, die den geworfenen Ball abfängt und zurückprallen lässt. Was sich einfach anhört, erfordert Kraft, Schnelligkeit und Beweglichkeit. Im Baskenland wurde dieser Sport erfunden, und noch heute spielen ihn bereits die Kinder auf öffentlichen Plätzen und Straßen. Pelota gilt als das Spiel der Basken. Und als eines der wichtigsten identitätsstiftenden Merkmale einer Provinz, welche eine bewegte Geschichte hinter sich hat, die aus sieben Provinzen besteht und auf der Grenze zweier Länder liegt. Ellande Alfaro spielte lange Zeit als Profi Pelota, heute produziert er die Bälle für das Spiel, die aus Gummi, Schafwolle und anderen einheimischen Materialien bestehen. In seiner Freizeit ist er als Schiedsrichter unterwegs, bewertet Spiele und unterrichtet junge Spieler. Die Brüder Jon und Paxti Tambour sind bis heute aktiv, spielen in der baskischen Liga. Für sie alle ist wichtig, dass Pelota lebendig bleibt. Denn auch wenn die Proteste nach mehr Eigenständigkeit heute nicht mehr gewaltsam ausgetragen werden, so ist es den Basken doch wichtig, ihre Gemeinsamkeiten gegenüber der Außenwelt zu betonen und zu pflegen. Mit friedlichen Mitteln. DE 2020
