  title: Planet Weltweit - Ring frei für Sambias Boxerinnen!
  subtitle: Planet Weltweit - Ring frei für Sambias Boxerinnen!
  description: 'Das Leben einer Frau in Sambia ist vorherbestimmt: Als Mädchen unterstützt sie ihre Mutter bei der Hausarbeit. Nach der Heirat zieht sie zu ihrem Mann und übernimmt dort Haushalt und Mutterrolle. Bildung erfahren die wenigsten Mädchen, eigene Wünsche zählen nicht. Doch es rumort im Land. Immer mehr junge Frauen fordern das Recht auf ein eigenes Leben. Und dafür wollen sie kämpfen, notfalls mit den Fäusten. Die Box-Ställe im Land verzeichnen einen Anstieg weiblicher Mitglieder, von denen einige in den letzten Jahren sogar der internationalen Box-Welt ihren Stempel aufdrücken konnten. GEO Reportage hat diese ungewöhnlichen Frauen besucht. Das Leben hat es lange nicht gut gemeint mit Margret, Lina oder Melody. In einem Land, wo Frauen noch immer wenig zählen, wo Bildung nur an wenige Privilegierte vergeben wird und die Armut bis heute einen Großteil der Menschen lähmt, lagen ihre Chancen auf ein eigenständiges und selbstbestimmtes Leben bei Null. Doch sie sind dabei, sich freizuboxen, und das im wörtlichen Sinne. Die jungen Frauen gehören zu der immer größer werdenden Anzahl weiblicher Boxerinnen in Sambia, die ihr Schicksal selber in die Hand nehmen. Motiviert durch ihre individuellen Schicksale sind sie doch unterschiedlich erfolgreich in ihren Bestrebungen. Während Lina bereits als internationale Profi-Boxerin kämpft und Margret zur Meisterin ihrer Gewichtsklasse aufgestiegen ist, gehören die meisten zum Heer der namenlosen Boxerinnen, die auf ihre Chance hoffen. Für Melody könnte sich dieser Traum demnächst sogar erfüllen. Sie darf gegen eine der erfolgreichsten Gegnerinnen ihres Viertels antreten, ausgerechnet gegen Margret. Wird sie, die junge, bisher von der Konkurrenz kaum wahrgenommene Kämpferin, erfolgreich sein? Sowohl für Melody als auch für ihren Boxclub wäre dieser Sieg Ehre und Triumph zugleich. DE 2020'
