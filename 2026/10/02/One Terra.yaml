  title: Planet Weltweit - Vietnams vermintes Paradies
  subtitle: Planet Weltweit - Vietnams vermintes Paradies
  description: |-
    Im Phong Nha-Ke Bang Nationalpark in Vietnam werden jedes Jahr neue Tiere und Pflanzen entdeckt, und das trotz Abholzung und Wilderei. Das Gebiet ist noch immer vom Krieg geprägt: Die Blindgänger aus dem Krieg werden bis heute von den Menschen gesammelt und zu Geld gemacht. Ein gefährliches Geschäft, das jedoch langsam zum Erliegen kommt. Die Einheimischen suchen deshalb nach Alternativen, zum Minensammeln und zur Wilderei. Der Nationalpark bietet sie. Es herrscht Aufbruchstimmung.

    Der Artenreichtum des Phong Nha-Ke Bang Nationalpark in Vietnam ist enorm. Im grünen Dickicht der schwer zugänglichen Region leben Tiere und Pflanzen, die es sonst nirgendwo mehr gibt. Alleine 150 Arten an Amphibien und Reptilien sind bislang im Phong Nha-Ke Bang Nationalpark nachgewiesen. In den letzten zehn Jahren wurden vierzehn neue Arten entdeckt. Was für die Wissenschaftler einem Garten Eden gleicht, war für die Einheimischen lange Zeit ein Selbstbedienungsladen. Es wurde gewildert, geplündert und illegaler Holzschlag betrieben. Seit die UNESCO den Park zum Weltkulturerbe erklärt und die Parkverwaltung gezeigt hat, dass sich mit Tourismus Geld verdienen lässt, wird auf Naturschutz gesetzt. Weil niemand den Park so gut kennt wie die Einheimischen, werden sie jetzt zu Parkrangern ausgebildet. Einer von ihnen ist der Bauer Nguyen Van Hoan. Jahrelang hat er gewildert, Affen und seltene Rinder geschossen. Seit er dafür jedoch mit einer hohen Strafe belegt wurde und gleichzeitig das Angebot bekam, für die Parkverwaltung zu arbeiten, sucht er selber nach illegalen Wildererfallen und führt Wissenschaftler durch das unwegsame Gebüsch. Hoan ist nur ein Beispiel für die Aufbruchstimmung, die die Menschen im Nationalpark Besitz ergriffen hat. Die Schrotthändlerin Ho Thi Hau, die jahrelang vom Verkauf alter und teilweise noch explosiver Minen gelebt hat, verdingt sich seit neuestem als Touristenfotografin.
     DE 2009
