  description: Ein Fischerdorf an der abgelegenen Südküste Neufundlands steht vor der letzten großen Entscheidung. Seine fünfundsiebzig Bewohner müssen wählen, ob sie bleiben oder alle zusammen ihre Sachen packen und ihre Heimat für immer verlassen sollen. Die Provinzverwaltung in St. John's unterstützt die Umsiedlung mit 270.000 Dollar pro Haushalt, denn die Aufrechterhaltung der öffentlichen Infrastruktur wäre noch teurer. Es kommt zur Spaltung der Gemeinde. Gegner und Befürworter der Umsiedlung stehen sich mitunter unversöhnlich gegenüber. Eine Wahl zwischen Umbruch, Verlust und Hoffnung. DE 2023
