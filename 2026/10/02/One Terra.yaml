  title: Planet Weltweit - Saint-Pierre und Miquelon - Archipel in der Isolation
  subtitle: Planet Weltweit - Saint-Pierre und Miquelon - Archipel in der Isolation
  description: 'Saint-Pierre und Miquelon - direkt vor der Küste Neufundlands liegt ein französischer Archipel, vom Mutterland beinahe vergessen. Der Kabeljau machte die Inselgruppe über Jahrhunderte lang reich, bis ein französisch-kanadisches Abkommen seinen Fang wegen Überfischung untersagte. Heute ist auch die raue Schönheit der Inselnatur bedroht - wenn Umweltschützer gegen die Gleichgültigkeit und Frustration der Inselbewohner nicht ankommen. Die Reportage zeigt die Menschen von St. Pierre und Miquelon in ihrem Konflikt zwischen Selbsterhalt und Verantwortung der Natur gegenüber. Der passionierte Naturforscher Roger Etcheberry lebt seit seiner Kindheit auf Saint-Pierre und Miquelon. Er weiß um die "Insel-Mentalität" der Menschen hier, die so knapp vor Kanada leben und doch im Herzen Franzosen sind: "Sie lieben die Freiheit. Sie glauben, weil sie isoliert auf einer Insel sind, können sie alles machen. Doch leider werden wir, wenn wir so weiter machen, nur schwer überleben." Es war ein reiches Leben, jahrzehntelang geprägt von der Kabeljaufischerei. Die rücksichtlose Überfischung und das darauf folgende Fischereiverbot in den 1990er Jahren haben die Wirtschaft auf dem Archipel zum Stillstand gebracht. Über Alternativen hat nie jemand nachgedacht - neben dem Fisch blieb nur der Reichtum der verletzlichen Natur zurück. Dass der Bestand vieler seltener Vogelarten, darunter der Gelbfußregenpfeifer, dramatisch eingebrochen ist und einige Pflanzenarten bereits ausgestorben sind, beunruhigt außer Roger Etcheberry nur wenige. Das soll sich nun ändern. Unterstützung kommt für Roger ausgerechnet aus der fernen französischen Metropole. Jean-Philippe Siblet vom Botanischen Garten in Paris erkundet, geführt von Robert, die wenigen, vom Menschen noch unberührten Orte des Archipels und erklärt diese als schützenswertes Naturdenkmal. Seevögel wie der Papageientaucher können hier noch ungestört nisten und haben sich dem rauen, windigen Inselklima bestens angepasst.  DE 2009'
