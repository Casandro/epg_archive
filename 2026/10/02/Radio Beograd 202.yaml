  title: Tu i tamo
  subtitle: U jesenji muzički maraton na Dvestadvojci uključuje se i emisija "Tu i tamo". U glavnim ulogama su muzičari i muzičarke koji slave rođendane u septembru i to je garancija za super muzički provod.
  description: U jesenji muzički maraton na Dvestadvojci uključuje se i emisija "Tu i tamo". U glavnim ulogama su muzičari i muzičarke koji slave rođendane u septembru i to je garancija za super muzički provod. Na spisku su Bijonse, Krisi Hajnd, Lijam Galager, Džoan Džet, Brajan Feri, Brus Springstin, Avril Lavin, Anastasija...imnogi drugi... Domaći septembarci su Aleksandra Kovač, Oliver Nektarijević, Bisera, a iz komšiluka Davor Lukas iz grupe"Fit"... I zato pojačajte Dvestadvojku!!! Autorka i voditeljka Ivana Pataković.
