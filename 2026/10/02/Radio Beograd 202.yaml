  title: Jesenji muzički maraton 202
  subtitle: Isti naslov, a potpuno drugačija priča - spremite se za muzičko jutro u kojem otkrivamo kako iste reči mogu ispričati sasvim različita iskustva.
  description: Isti naslov, a potpuno drugačija priča - spremite se za muzičko jutro u kojem otkrivamo kako iste reči mogu ispričati sasvim različita iskustva. U svim jezicima sveta ima mnogo reči koje inspirišu pesnike ali su neki naslovi toliko inspirativni, snažni i univerzalni da ih muzičari često, svesno ili sasvim slučajno, biraju za svoja potpuno različita autorska dela. Ovog jutra se igramo rečima i notama, jer na Dvestadvojci slušamo "pesme imenjakinje"!Pred vama su tri sata muzičkih iznenađenja u kojima spajamo numere koje dele apsolutno isti naziv, ali donose potpuno drugačiji ritam, energiju i životnu poruku. Dokazaćemo vam da ime jeste važno, ali da tek melodija daje pravu dušu. Bilo da su u pitanju domaći hitovi i njihovi strani "imenjaci", ili žanrovski potpuno suprotstavljene pesme skrivene iza istih slova, očekuje vas neverovatno zanimljivo i dinamično muzičko buđenje.Pišite nam - koji vam je omiljeni muzički naslov koji dele dve potpuno različite pesme i uz čiju "imenjakinju"...
