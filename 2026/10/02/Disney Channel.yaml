  title: Oben
  subtitle: Animationsfilm, USA 2009
  description: 'Regie: Pete Docter, Bob Peterson. Darsteller: Edward Asner, Christopher Plummer, Jordan Nagai. Nach dem Tod seiner Frau bleiben Carl nur noch sein kleines Häuschen und Erinnerungen an bessere Zeiten. Dabei wäre der Rentner so gerne wie sein großes Vorbild Charles Muntz ein weltbekannter Abenteurer geworden. Dazu bekommt Carl die Chance, als er per Gerichtsbeschluss aus seiner Behausung bugsiert wird, die einem moderneren Bau weichen soll. Doch Carl verspürt keinen Bock aufs Altersheim. Der frühere Ballonverkäufer bindet sich abertausende Heliumballons an sein Dach und hebt ab. Sein Ziel: Südamerika. Aber Carl hat die Rechnung ohne den blinden Passagier gemacht.'
