  title: TinkerBell und die Legende vom Nimmerbiest
  subtitle: Animationsfilm, USA/IND 2014
  description: 'Regie: Steve Loter. Darsteller: Ginnifer Goodwin, Mae Whitman, Rosario Dawson. Mit ihrem großen Herz für Tiere hat TinkerBells beste Freundin Emily das Feenland leider schon häufiger in Gefahr gebracht. Nach einem Zwischenfall mit einem jungen Habicht gelobt sie nun, besser aufzupassen und Verantwortung zu übernehmen. Aber als sie eines Tages in der Ferne ein markerschütterndes Jammern hört, muss Emily der Sache auf den Grund gehen. Kurz darauf findet sie ein monströses Geschöpf, das sie Grummel tauft. Sie ahnt nicht, dass sich hinter dem Wesen das Nimmerbiest verbirgt, das der Legende nach das Feenland zerstören wird!'
