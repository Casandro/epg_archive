  title: ANIXE auf Reisen - Malta mit Florian Fitz
  description: 'Das Ziel dieser "ANIXE auf Reisen" Reportage ist die im Mittelmeer liegende Inselrepublik Malta. Der beliebte Schauspieler Florian Fitz möchte das kleine und doch geschichtsträchtige Land erkunden. Er beginnt seine Rundreise in der Hauptstadt Valetta und lernt dort einen echten Malteserritter kennen. Außerdem auf dem Programm: Der Besuch des Manoel Theaters, der drittältesten Spielstätte der Welt. Die archäologischen Stätten geben dann dem Schauspieler einen Eindruck, welche Bedeutung die Insel bereits vor Jahrtausenden hatte. Aktiv geht es dann bei einer Mountainbike Tour die Küste entlang und mit dem Speedboot auf dem Meer weiter.  Besonders beeindruckt ist Florian Fitz von einem Spaziergang durch den pittoresken Fischerort Marsaxlokk.  Nach einem typischen maltesischen Abendessen stürzt er sich dann in das Nachtleben. Zum Abschluß geht es für Florian Fitz auf die kleine Schwesterinsel Gozo. Dort unternimmt er einen Tauchgang zum legendären "Blue Hole" und besichtigt die eindrucksvollen Salzfelder.'
  widescreen: true
