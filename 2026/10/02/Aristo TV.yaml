  title: Kraftvoll Leben - Die Zeichen der Zeit erkennen
  description: In dieser Predigt geht es darum, was für ein Lebensstil für uns als Christen in der aktuellen Zeit sehr wichtig sein wird. Möglicherweise ist dir auch aufgefallen, dass die Zeit, in der wir leben, immer hektischer und schneller wird. Ereignisse, die die Welt verändern, geschahen früher in Jahrzehnten. Heute passieren ganze Jahrzehnte in wenigen Wochen oder sogar Tagen. Aus diesem Grund ist es für uns wichtiger denn je, die Stimme Gottes selbst zu hören, ihm in den Momenten unseres Alltags zu begegnen und mit ihm ganz eng unterwegs zu sein.
