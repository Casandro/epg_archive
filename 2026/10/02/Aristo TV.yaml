  title: ERF Mensch Gott - Gott gibt _s echt! - Beinah ein Star
  description: Ein Star sein und mit eigenen Songs groß rauskommen. Für Laura rückt dieser Traum in greifbare Nähe. Sie erhält einen Major-Label-Vertrag bei Sony Music, arbeitet mit bekannten Produzenten und steht kurz vor dem musikalischen Durchbruch. Doch hinter dem Erfolg bleibt eine tiefe Sehnsucht nach Annahme und Frieden. Gefühle, die sie seit ihrer Kindheit in Liedern verarbeitet. Doch dann kommt der Tag, an dem ihr Leben auseinanderfällt und sie alle Lieder löscht, die sie jahrelang begleitet haben.
  widescreen: true
