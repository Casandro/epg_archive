  title: ERF Mensch Gott - Gott gibt _s echt! - Ich dachte, ich darf nicht leben!
  description: '"Du bist aus einer Vergewaltigung entstanden". Delia ist 13 Jahre, als sie das von ihrer Mutter erfährt. Nach dem ersten Schock erfüllen sie Wut und Hass auf den Mann, der ihr biologischer Vater ist. Und nach und nach spürt sie, wie das Wissen um diese Gewalttat ihr Innerstes vergiftet. Tiefe Verunsicherung breitet sich in ihr aus. Irgendwann ist sie überzeugt: Meine Mutter kann mich unmöglich lieben - und ich habe kein Recht, auf dieser Welt zu sein.'
  widescreen: true
