  title: ErlebtTV - Für mich zählte nur der Erfolg
  description: Erfolgreiche Menschen werden in unserer Gesellschaft oft bewundert und als Vorbilder angesehen. Mary Sanders ist eine erfolgreiche Sportlerin, deren großer Traum sich mit der Teilnahme an den Olympischen Spielen erfüllt. Markus Walther steigt schon in jungen Jahren in die Führungsetage eines Großunternehmens auf. Beide berichten von den Schattenseiten ihres Erfolgs und wie sie erkannten, was für sie viel wichtiger ist.
