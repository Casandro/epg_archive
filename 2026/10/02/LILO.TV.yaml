  description: Eine kulinarische und kulturelle Expedition durch die Champagne. Spricht man von der Champagne, denkt man sofort an den Champagner. Nur Schaumwein aus dieser Region darf sich Champagner nennen und sich letztlich als eines der exclusivsten und teuersten Getränke bezeichnen. Dese Exklusivität auf eine bestimmte Region war und ist der Schlüssel zum Erfolg. Aber was kaum jemand weis, in der Champagne wird auch Whiskey hergestellt. Und nicht irgendwie sondern völlig verrückt in einem Betonmischer.
