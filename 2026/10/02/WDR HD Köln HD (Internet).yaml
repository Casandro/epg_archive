  title: 'Expedition in die Heimat: Glamping auf der Alb'
  subtitle: mit Annette Krause
  description: Glamping und Camping auf der Schwäbischen Alb sind voll im Trend. Es wird für jeden Geschmack etwas geboten. SWR Moderatorin Annette Krause macht sich auf die Suche nach den ungewöhnlichsten und aufregendsten Übernachtungsmöglichkeiten.
