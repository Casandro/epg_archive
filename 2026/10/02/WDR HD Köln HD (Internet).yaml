  start: 2026-10-02T07:40:00Z
  stop: 2026-10-02T08:25:00Z
  title: Wer weiß denn sowas?
  subtitle: mit Kai Pflaume
  description: |-
    Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
    Beide Teams spielen um Bares für ihre Unterstützer. Zu Beginn des Wissensspiels müssen sich die Zuschauer im Studio entscheiden: Setzen sie sich auf die Seite von Superhirn Bernhard Hoëcker oder von Quizmaster Elton?

    Gäste: Jonas Hofmann und Laura Winter
- eventId: 1414517
  start: 2026-10-02T08:25:00Z
  stop: 2026-10-02T09:10:00Z
  title: Garten und lecker
  subtitle: Little Britain in der Eifel
  description: "Dreifach-Mama Kai Judith Wetzel lädt in die Nordeifel in ihren Staudengarten mit Laube, Feuerstelle und vielen selbst gemachten Keramiken. Ihre große Liebe gilt England und der dortigen Gartenkultur. \nAuch beim Fest möchte sie ihr Thema \"Little Britain in der Eifel\" einfließen lassen: so serviert sie Tee, Scones und Sandwiches, aber auch selbst gemachten rosa Holundersirup aus dem Garten, sowie bodenständige Eifeler Knudeln (eine Art Gnocchi aus Mehlnocken) als Vorspeise und zum Hauptgang einen Eifeler Rehrücken. Zum Dessert gibt es Eton Mess, Devil's Delight und Sticky Toffee Pudding."
  genre:
  - '144'
