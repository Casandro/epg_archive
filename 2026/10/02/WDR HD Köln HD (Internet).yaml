  title: Rentnercops (33)
  subtitle: Willkommen im Chaos
  description: |-
    Das Kommissariat muss umziehen - zum großen Leidwesen von Günter und Edwin. In den neuen Büros herrscht das pure Chaos, die Büroeinrichtung fehlt und die Computer funktionieren nicht. So kommt es, dass eine Akte über den tödlichen Autounfall einer Biotech-Unternehmerin versehentlich bei Günter und Edwin landet.

    Um der Unordnung zu entfliehen, kümmern sie sich um den Fall, der eigentlich nicht in ihren Bereich fällt. Auch Hui Ko beschäftigt sich mit einer Akte, die versehentlich bei ihm landet: Aus einem Zoogeschäft wurden giftige Spinnen gestohlen.
  ageRating: 6
  genre:
