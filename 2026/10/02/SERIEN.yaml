  description: Lucrezia will Nonne werden, doch der Soldat Pedro überzeugt sie in Rodrigos Auftrag, das weltliche Leben nicht aufzugeben. Als Juan beichtet, sitzt Cesare im Beichtstuhl und erfährt so von Juans Missetaten. Carafa überzeugt Rodrigo, anstelle von Juan Federigo D'Aragona zum König von Neapel zu krönen. Cesare begreift, dass sein tot geglaubter Sohn lebt, und bricht für immer mit Alessandro Farnese. FR 2011
