  title: Borgia - Christi Himmelfahrt
  subtitle: Borgia - Christi Himmelfahrt
  description: Rom bereitet Cesare einen triumphalen Empfang. Um Carlotta heiraten zu können, bringt Cesare das Kardinalskollegium dazu, gegen den Willen seines Vaters für seinen Ausschluss von allen kirchlichen Ämtern zu stimmen. Der König von Neapel jedoch stimmt der Verbindung jedoch nicht zu. Da ihr Liebhaber Alfonso D'Este nicht frei ist, heiratet Lucrezia trotz Cesares Warnung Alfonso Di Calabria. FR 2012
