  subtitle: 'Moderation: Janina Schreiber'
  description: "Der diesjährige Sommer hat gezeigt: Wasser wird knapp hierzulande. Wir erklären, warum immer weniger Grundwasser  gebildet wird. \nEin globales Problem übrigens, das sich an vielen Orten zeigt. Wir sprechen dazu auch mit dem Erdsystemmodellierer Prof. Dr. Robert Reinecke von der Uni Mainz. \nLandwirte passen sich an die häufiger werdende Dürre an: mit Hightech. Die Aussaat mit Drohnen kann helfen, dass die Ackerböden weniger schnell austrocknen. \nIm Prinzip könnte Trinkwasser auch zur Energiegewinnung für Wärmepumpen genutzt werden. Ein bundesweites Pilotprojekt dazu ist gerade in Lüneburg angelaufen."
