  title: Letzter Sommer DDR
  subtitle: Das Jahr, in dem die Einheit kam - Film von Dagmar Wittmers
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Die DDR im Sommer '90: ein Land zwischen zwei Gesellschaftssystemen, zwischen Nichtmehr und Nochnicht. Das Leben ist im Umbruch, die Welt steht offen. Alles scheint möglich - und nichts sicher. In Ost-Berlin wird die Einheit verhandelt und gegen die drohende Abwicklung demonstriert. \nDer Film erzählt vom Sommer der ungeahnten Möglichkeiten. Vom Aufbruch ins Ungewisse und Momenten der Anarchie. Von einer Zwischenzeit, in der das Alte nicht mehr galt und das Neue noch nicht da war: Voller Hoffnung und trotzigem Gründermut, ersten Enttäuschungen und ungekannter Euphorie. Von Menschen im Ausnahmezustand!"
