  title: SWR Aktuell Langstrecke
  description: "14:00\nSWR Kultur Das Wissen\nMagersucht therapieren - Wie wichtig Familie, Darm und Körperbilder sind\nZu Hause wohnen, anstatt stationär behandelt zu werden. Die Körperwahrnehmung durch Einsatz von VR-Brillen verändern. Gene und Darm berücksichtigen. Es tut sich viel in der Magersucht-Therapie.\nVon Elisa Buhrke (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n14:30\nSWR1 Leute mit Dr. Heike Niemeier | Ernährungsexpertin \nAbnehm-Spritze & Abnehm-Pille? Ja, aber richtig!\nGamechanger gegen Übergewicht? Dr. Heike Niemeier bewertet Chancen und Risiken von Abnehm-Spritze und Abnehm-Pille. Jahrzehntelang haben viele Menschen versucht, mit Diäten abzunehmen. Jetzt kommt mit der Abnehm-Spritze und - ganz neu - auch mit der Abnehm-Pille eine ganz neue Chance. Die Erfolge sind teilweise spektakulär, aber auch mit Risiken verbunden.\n\"Ja, aber richtig!\" lautet die Forderung der Autorin Dr. Heike Niemeier in ihrem Buch über Abnehm-Spritze und -Pille. \"Aber richtig\" bezieht sich vor allem auf die Ernährung, aber auch auf andere Aspekte des Lebensstils. Die Ernährungs-wissenschaftlerin erläutert detailliert, welche \"Gamechanger\"-Hoffnung in den neuen Medikamenten steckt. Gleichzeitig setzt sie sich ausführlich mit den Risiken auseinander, die entstehen können, wenn Mann/Frau sich ausschließlich auf die Wirkung des Medikaments verlässt. Entscheidend ist, wie Ernährung und Lebensstil damit zusammenspielen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
