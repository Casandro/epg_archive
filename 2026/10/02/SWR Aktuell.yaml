  title: Der Tag
  description: "19:00\nREICH - Das Geschäft mit dem Zweifel\nDas Herz der Bestie (5/5)\nWir sind zurück in Halle, auf der Klimaskeptiker-Konferenz vom Anfang. Wir hören genau hin. Auf der Bühne: Marc Morano, eingeflogen aus Washington. \"It's over, we won\", sagt er uns später auch ins Mikrofon. Europa nennen seine Mitstreiter \"the heart of the beast\" - hier schlage das Herz des Klima-Irrglaubens, hier gebe es noch etwas zu holen. Wir fahren nach Coswig in Sachsen-Anhalt, wo Menschen gegen Windräder protestieren. Einer von 322 Vereinen in Deutschland. \nGemeinsam mit Kolleg*innen von Correctiv haben wir uns das Netzwerk dieser Vereine genauer angeschaut und analysiert, wie das Thema Windkraft in aktuellen Wahlkämpfen genutzt wird. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/reich-das-geschaeft-mit-dem-zweifel/urn:ard:show:f5091cc57904afb9/ \n\n19:30\nKultur -\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/"
