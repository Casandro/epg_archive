  title: GRIPS Deutsch (12)
  subtitle: Rechtschreib-Strategien
  subtitled: true
  description: Die deutsche Rechtschreibung ist für viele ein schwieriges Thema. Ständig macht man Fehler. Hat man die Regeln gelernt und kennt sie, dann gibt es wieder Ausnahmen. Dennoch gibt es aber einige Tipps und Tricks - wir nennen sie Rechtschreibstrategien -, die dir mit etwas Übung dabei helfen, ein echter Rechtschreibprofi zu werden.
- eventId: 800683
  start: 2026-10-02T05:15:00Z
  stop: 2026-10-02T05:30:00Z
  title: GRIPS Deutsch (13)
  subtitle: Diktat-Training
  subtitled: true
  description: 'Rechtschreibung ist nicht einfach zu lernen - aber sie ist sinnvoll, denn sie erleichtert das Verstehen eines Textes. Um Rechtschreibung und auch Satzzeichen zu üben, werden Diktate geschrieben - auch in der Prüfung. Und die kann man üben. Das zeigt dir unser Video. Schau es dir an, lies dir die Texte durch und mach die Übungen - und du wirst sehen: Diktate können auch Spaß machen!'
- eventId: 800684
  start: 2026-10-02T05:30:00Z
  stop: 2026-10-02T05:55:00Z
  title: Willi wills wissen
  subtitle: Wie kommt der Ton ins Radio?
  subtitled: true
  description: |-
    Es ist noch gar nicht so lange her in Willis Leben, da zog der Reporter ganz ohne Kamera, dafür aber mit einem Mikrofon durch die Welt: Damals arbeitete er für den Hörfunk des Bayerischen Rundfunks und sammelte Töne und Stimmen für spannende Radio-Reportagen. Aber wie genau der Ton dann ins Radio kommt, das ist noch einmal eine ganz andere Sache und der will Willi in dieser Reportage auf den Grund gehen.
    Los geht's vor dem Fußballstadion in Unterhaching, wo Sportreporter André Siems gerade ein paar Fans interviewt. Klar, dass Willi sofort einen Job bekommt: Auch er soll mit dem Mikrofon ein paar O-Töne einfangen.
