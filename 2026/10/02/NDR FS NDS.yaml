    * Künstliches Hüftgelenk: Wenn die Schmerzen bleiben und erneut operiert werden muss
    Was tun, wenn sich das ausgetauschte Hüftgelenk lockert, die Pfanne einen Riss hat? Inzwischen werden viele Hüftgelenke minimalinvasiv und zementfrei eingesetzt. Das macht für jüngere Patienten Sinn, bei älteren oder Menschen mit Osteoporose ist das mit mehr Rückfällen und Komplikationen verbunden. Was tun, wenn das Hüftgelenk nicht sitzt? Wann ist eine zweite OP notwendig? Und kann man abschätzen, für wen welches Gelenk am besten ist? Auch hier geht der Trend zu individuellen Prothesen, im Extremfall ist das eine neue Hüfte per 3D-Drucker.
