  description: 'Potpisan je ugovor za najveći željeznički projekt! Rekonstruirat će se 83 kilometra pruge od Dugog Sela do Novske, a izgradnjom drugog kolosijeka ta će važna željeznička dionica dobiti veći kapacitet, veću propusnost i bolje uvjete za putnički i teretni promet. Ugovor je vrijedan gotovo 900 milijuna eura, a čak 90 posto financirat će se novcem Europske unije. Što ovaj projekt znači za hrvatsku željeznicu? Što će nova, modernizirana pruga značiti za gradove i općine uz njezinu trasu? Što je s ostalim dionicama željezničkih pruga? Gosti su: Žarko Tušek, državni tajnik u Ministarstvu mora, prometa i infrastrukture, Davor Perić, HŽ Infrastruktura, direktor Sektora za razvoj, pripremu i provedbu investicija i EU fondova, Marija Kušmiš, gradonačelnica Novske.'
