  title: MacGyver
  subtitle: |-
    Mattys Geheimnis
    Action-Serie, USA 2018
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 01.10.2026, 11:10 Uhr)
  description: |-
    Vor zwei Jahren sollte der Computer eines Senators zu einer Schrott-Deponie gebracht und recycelt werden. Stattdessen wurde er illegal nach Ghana verschifft und geriet dort in die Hände eines Erpressers. Der Clou: Auf dem Computer befand sich eine empfindliche Datei mit dem Namen "Dragonfly". Besonders Matty scheint daran interessiert, die Angelegenheit so schnell wie möglich zu klären. Ohne weitere Details zu nennen, schickt sie das Team umgehend nach Ghana ...

    Regie: Gabriel Beristain
