  description: |-
    Wochenfinale in der großen Jubiläumswoche in Berlin! Mitten in Kreuzberg betreibt Sanci das "Mardin". Die Konkurrenz darf sich unter anderem auf mesopotamische Küche freuen. Kann Sanci am letzten Tag den Sieg in dieser Jubiläumswoche mit orientalischer Küche nach Hause holen? Oder waren seine Mitstreiter aus den anderen vier Lokalen doch zu stark? Das entscheidet am Ende der Profi-Koch mit seinen "Jubiläums"-Punkten.

