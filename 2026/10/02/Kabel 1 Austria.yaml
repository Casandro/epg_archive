  title: 'FBI: Special Crime Unit'
  subtitle: |-
    Vergeltung
    Crime-Serie, USA 2021
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 01.10.2026, 12:05 Uhr)
  description: |-
    Eine Massenschießerei in einem New Yorker Trendlokal fordert fünf Menschenleben und bringt das Team des FBI zum Ermitteln. Nach und nach wird klar, dass ein der Polizei nicht unbekanntes Kartell hinter dem brutalen Mordanschlag steckt ...

