  description: |-
    In New York wird ein Profi-Skateboarder auf offener Straße erschossen. Die Vermutung liegt nahe, dass ein Mitglied der Extremsport-Szene der Täter ist - die Rivalität zwischen den Athleten dort ist groß. Ein erster Verdächtiger entpuppt sich allerdings als falsche Fährte. Ryan und Esposito tragen unterdessen ihren ganz eigenen Konkurrenzkampf aus: Beide wollen unbedingt Castles Trauzeuge sein und versuchen mit allen Mitteln, sich beim Bräutigam ins rechte Licht zu rücken.

