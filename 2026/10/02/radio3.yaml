  title: radio3 Konzert
  description: "l i v e: Kirill Petrenko dirigiert die Berliner Philharmoniker\nWerke von Johannes Brahms und Richard Strauss\n\nKirill Petrenko und Daniil Trifonov - zwei Ausnahmekünstler, die bereits mehrfach gemeinsam für Furore gesorgt haben - treffen in der Berliner Philharmonie erneut aufeinander. Im Zentrum des Abends steht Johannes Brahms' Erstes Klavierkonzert, ein Werk von monumentaler Wucht und zugleich kammermusikalischer Zartheit. Nach der Pause folgt Richard Strauss' Tondichtung \"Also sprach Zarathustra\", berühmt für ihren strahlenden Sonnenaufgang und ihre klangliche Opulenz. Die Berliner Philharmoniker unter der Leitung ihres Chefdirigenten Kirill Petrenko garantieren einen Abend, der höchste Virtuosität mit tiefgründiger Ausdruckskraft verbindet. \n\nDaniil Trifonov, Klavier\nBerliner Philharmoniker\nKirill Petrenko, Dirigent\n\nJohannes Brahms: \nKlavierkonzert Nr. 1 d-Moll op. 15\n***\nRichard Strauss: \n\"Also sprach Zarathustra\" op. 30 \n\nModeration: Anja Herzog\n\nLive-Übertragung in der Berliner Philharmonie\n\nModeration: Anja Herzog"
  subtitle: 'Moderation: Anja Herzog'
