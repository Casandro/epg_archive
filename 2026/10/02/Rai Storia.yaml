  title: Viaggio in Sicilia Siracusa e il mito gr
  subtitle: Viaggio in Sicilia Siracusa e il mito greco - L'ultima tappa del viaggio della scrittrice Simonetta Agnello Hornby e del suo amico illustratore e fumettista Massimo Fenati è Siracusa. L'emozione e la sorpr
  description: |+
    esa accompagnano Simonetta e Massimo nellarea archeologica di Siracusa, il parco archeologico della Neapolis, quando entrano nel famoso Orecchio di Dionisio e nel Teatro Greco vuoto, riempito da suoni e ricordi delle rappresentazioni a cui Simonetta aveva assistito in passato. Sulla via del ritorno verso Agrigento, Simonetta decide di mostrare a Massimo uno dei luoghi che hanno ispirato il suo romanzo 'Il veleno dell'oleandro': Pantalica. Un'antica necropoli, risalente al XIII secolo a.C., sito archeologico divenuto nel 2005 Patrimonio dell'Umanità. Simonetta e Massimo tornano finalmente a casa, a Mosè. Attorno alla tavola imbandita la famiglia si riunisce per condividere i ricordi di questo straordinario viaggio. - Con Simonetta Agnello Hornby e Massimo Fenati

