  title: De Bauers, een nieuwe fase
  subtitle: S01 E06. De 25e verjaardag van Chris wordt groots gevierd. Frans Jr. wacht vol spanning op de uitslag van zijn horecaopleiding. Frans heeft besloten dat hij opnieuw aan de gang wil gaan met zijn lijf.
  description: De 25e verjaardag van Chris wordt groots gevierd. Terwijl Rosalie hem meeneemt voor een dagje varen, organiseert de rest van het gezin thuis een surprise-bbq. Geen makkelijke klus tijdens een hittegolf! Ondertussen wacht Frans Jr. vol spanning op de uitslag van zijn horecaopleiding. Aangezien hij van nature geen enorme studiebol is, blijft dit tot het laatste moment spannend. Frans heeft besloten dat hij opnieuw serieus aan de gang wil gaan met zijn lijf en het bereiken van een gezond gewicht. Zijn nieuwste plan om fitter te worden? Racefietsen! Hij heeft een nieuwe fiets aangeschaft, maar dit is er wel een mét ondersteuning. (2026)
