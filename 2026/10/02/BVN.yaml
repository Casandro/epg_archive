  title: Noord-Zuid-Oost-West
  subtitle: Margreet - Op Pad - Route C S06 E157. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'In de fietsenwerkplaats van het azc in Leersum werken bewoners en mensen uit de omringende dorpen samen. Lamine uit Gambia is één van hen. De collega''s in de werkplaats voelen als zijn familie. In Op Pad is het een herfstdag als natuurliefhebber Roel Diepstraten via Annanina''s Rust naar De Gooren in Hilvarenbeek wandelt. Inktzwammen en aardsterren verwelkomen het nieuwe seizoen. De biologische boer vertelt trots over zijn Black Angus en Roel ontdekt een heilige muts. In Route C: Tian Teng woont in Utrecht, maar komt uit Shanghai. Ze studeerde eerst statistiek, maar gooide haar leven om voor de kunst. (2026)'
