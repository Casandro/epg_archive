  subtitle: S12 E128. Theo-Bert geeft de woonkamer van Olga weer kleur, Ramon ziet hoe Sil en Saar boeren zonder trekker en een oogsttuin waar de buurt van meegeniet.
  description: 'Theo-Bert Pot is in Den Haag om Olga te helpen met haar woonkamer waar één kleur overheerst: 9010, oftewel gebroken wit. En daar heeft Theo-Bert de perfecte oplossing voor: kleur. * In het Drentse Dwingeloo boeren Sil en Saar zonder trekker, maar mét paarden. Chef-kok Ramon wil zien of het nostalgie is, of dat er een andere drijfveer is. * In Oosterbeek runnen Erik en Marieke Henk''s pluktuin. Een tuin met een verhaal dat bijna veertig jaar terug gaat in de tijd. De tuin is vernoemd naar Eriks overleden vader Henk, in het dorp bekend als de gepassioneerde tuinman die zijn oogst graag deelde met anderen. En dat gebeurt er anno 2026 nog steeds. (2026)'
