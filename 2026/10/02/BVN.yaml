  description: In Singer Laren komt een schilderijtje van Willem Rip bij Emilie den Tonkelaar aan tafel. Het hangt bij een vriend van de eigenaresse op het toilet. Wat is de waarde van dit schilderij? De kunstenaar Willem Rip is niet heel bekend bij het grote publiek, maar hij was in zijn tijd net zo populair als Mesdag en Israëls. Samen met enkele tijdgenoten maakte hij aquarellen voor de kunstkast ter ere van het huwelijk van koningin Wilhelmina en prins Hendrik. (2024)
