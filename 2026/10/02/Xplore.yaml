  title: Sprintour - Der Camper passt nicht in den Container
  subtitle: Sprintour - Der Camper passt nicht in den Container
  description: |-
    Wir möchten unser Wohnmobil über das Darien Gap von Kolumbien nach Panama verschiffen. Allerdings ist unser Wohnmobil knapp drei Meter hoch und der Eingang vom Container ist gerade mal 2,57 Meter hoch. Wie bekommen wir einen VW Crafter in einen Container rein? Unser VW Crafter Camper hat ein Alu Cab Dachzelt mit Dachträger montiert. Und das alles muss ab damit unser Wohnmobil in einen Container für die Verschiffung nach Panama passt. Aber wohin mit dem Dachzelt?
    In Cartagena wartet viel Arbeit auf uns und wir starten damit den Camper niedriger zu machen. Die Hitze und extreme Luftfeuchtigkeit machen das Arbeiten in Kolumbien fast unmöglich. Nur irgendwie müssen wir an unser Ziel kommen. CO 2023
