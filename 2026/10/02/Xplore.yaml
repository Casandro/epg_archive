  title: VIP Trip - Prominente auf Reisen 2 - Ungarn mit Rike Schmid
  subtitle: VIP Trip - Prominente auf Reisen 2 - Ungarn mit Rike Schmid
  description: Begleiten Sie die Schauspielerin Rike Schmid auf einer Reise durch Ungarn, angefangen in der  Hauptstadt Budapest bis hin zu den Weinbergen im Süden des Landes. Von den Hügeln des Stadtteils Buda führt eine Eisenbahnstrecke durch kühle Wälder hinunter zur Donausmetropole. Der Zug wird übrigens von Kindern geführt, voller Stolz und Inbrunst übernehmen sie die Rolle der Schaffner. Budapest ist vor allem  für seine zahlreichen Bäder und heißen Quellen bekannt, viele von ihnen eingerahmt in prachtvoller Jugendstil-Architektur. Und in einem Bad wird Rike Schmid sogar noch zu einer Partie Schach im warmen Wasser eingeladen. Neben der ausgeprägten Badekultur verfügt Budapest auch über eine vielfältige Kaffeehaus-Kultur. Rike Schmid hat daher auch herausgefunden, wo es den besten ungarischen Strudel gibt, bevor sie sich in das Nachtleben im 7. Bezirk der Stadt stürzt. Von Budapest führt die Reise weiter zum Balaton, dem Plattensee. Ein Paradies für Segelfans und Biker, ganz gewiß.  Von hier aus ist es nicht mehr weit nach Pecs, dem früheren Fünfkirchen.  Hier trifft Rike Schmid auf Mitglieder der deutschen Gemeinde. Das multikulturelle Pecs ist ein städtebauliches Prunkstück, seine Geschichte führt bis in die Römerzeit zurück.  Reizvoll ist auch das umliegende Weinanbaugebiet, das zahlreiche edle Rotweine hervorbringt. Ein Ausritt durch die Weinberge und ein Besuch im Weinkeller rundet Rike Schmids Stippvisite in diesem Teil Ungarns ab. DE 2010
  ageRating: 6
