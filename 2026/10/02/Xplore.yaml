  title: VIP Trip - Prominente auf Reisen 2 - Malaysia mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 2 - Malaysia mit Johann Lafer
  description: |-
    VIP Trip - Prominente auf Reisen 2: Begleiten Sie den mehrfach ausgezeichneten Sterne Koch Johann Lafer auf seiner kulinarischen Reise durch Malaysia. Die Hauptstadt Kuala Lumpur ist ein Schmelztiegel zahlreicher Kulturen. Dementsprechend strotzt auch die Küche der Millionen Metropole nur so vor Vielfalt. Angefangen bei den zahlreichen Garküchen Chinatowns im Zentrum der Stadt, führt uns unsere Reise zum Jalan Petaling Markt. Dieser Markt ist besonders bei den Einheimischen beliebt und bringt  durch seine Vielzahl von frischen und exotischen Zutaten sogar einen Sternekoch ins Staunen. Man sagt zwar das Auge isst mit, doch natürlich bekommt man ein besseres Gefühl für die Küche eines Landes.  So zeigt uns Johann Lafer auch, wie man die traditionellen malaysischen Satéspieße zuhause einfach zubereiten kann.
    Neben den zahlreichen Märkten der Stadt hat auch die Spietzenküche ihren Platz in Kuala Lumpur . So verschlägt es Johann Lafer ins Feast Village, einem im JW Marriot Hotel ansässigen Restaurant Komplex.  Dieser verkörpert  nahezu alles, was die asiatische Küche zu bieten hat.  So entdecken wir dort mit Johann Lafer zahlreiche exotische und vor allem extravagante Köstlichkeiten. Doch nicht nur vom  kulinarischen Standpunkt aus ist Malaysia eine Reise wert.  Genau wie die Küche ist auch die Gesellschaft ein Mix allerlei Religionen und Traditionen. Daher darf für Johann Lafer ein Besuch im Sari Moha Tempel, einen hinduistischen Tempel im Zentrum der Stadt oder ein Abstecher in die eindrucksvollen Badu Caves nicht fehlen. DE 2006
