  title: VIP Trip - Prominente auf Reisen 2 - Russland mit Sigmar Solbach
  subtitle: VIP Trip - Prominente auf Reisen 2 - Russland mit Sigmar Solbach
  description: 'Eine Fahrt mit der transsibirischen Eisenbahn: Das war schon lange der Traum von Sigmar Solbach, den die deutschen TV-Zuschauer schon seit vielen Jahren kennen. Nach einer intensiven Stadtbegehung und einem Besuch des Kreml löst er in Moskau das Ticket bis zum Baikalsee. Am frühen Abend schließlich verläßt der Zug die russische Hauptstadt. Schnell werden an Bord Freundschaften geschlossen. Ein Russisch-Schnellkurs bietet dazu die richtige Gelegenheit, während draußen riesige Felder, Wälder und  kleinen russische Dörfer vorbeirauschen. Auf der Strecke liegt Kasan, das Zentrum des russischen Islam  mit seinen prachtvollen Moscheen. Der Zug nimmt dann die Strecke weiter ins Bergland des Ural, der die Grenze zwischen Europa und Asien bildet. Immer wieder hält der Zug an und gibt Sigmar Solbach und seinem Kamerateam die Möglichkeit, einen Eindruck vom traditionellen Landleben zu gewinnen. Das kleine Dorf Rechoti zum Beispiel bietet dazu die passende Gelegenheit.  Nach unendlich vielen Kilometern auf den Schienen und weiteren Erlebnissen entlang der Eisenbahntrasse erreichen Sigmar Solbach und seine Crew den Baikal, den tiefsten und ältesten Süßwassersee der Welt, um den sich zahlreiche Legenden ranken. Was jetzt noch fehlt, ist eine Bootstour.  Und die hat der Schauspieler auch schon gebucht. DE 2010'
