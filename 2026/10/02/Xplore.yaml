  title: Höhenflüge - Im Ballon über Kenia
  subtitle: Höhenflüge - Im Ballon über Kenia
  description: 'Abenteuer Heißluftballon-leichter als Luft schweben Ballonfahrer über die Erde hinweg. Nie wissen sie wohin der Wind sie weht und wo sie landen werden, denn ein Ballon lässt sich nicht lenken. Diese Reihe begleitet das deutsch-englische Ehepaar Phil und Allie Dunnington auf ihren Reisen in fünf verschiedene Länder. Mit ihnen erleben wir die Faszination des Ballonsports: atemberaubende Ausblicke, dramatische Landungen, fremde Kulturen und unerwartete Begegnungen. "Hakuna Matata" - alles kein Problem, sagen die Kenianer. Dieses Sprichwort wird auf der Reise zum Leitsatz für das Ballonteam. Auch wenn es nicht immer zutrifft, wie Phil und Allie am eigenen Leib erleben müssen. Neben vielen Höhenflügen müssen sie trotz aller Sicherheitsvorkehrungen auch einen Absturz meistern. Kenia steckt voller Herausforderungen, denn fast überall ist Ballonfahrer-Neuland. Gefahren müssen daher immer mit einkalkuliert werden. Zwar ist Ballonfahren in aller Regel sicher, doch wie bei jedem Luftsport gilt auch hier: ein Absturz könnte im schlimmsten aller Fälle tödlich enden. Deshalb steht vor jedem Start ein gründlicher Sicherheitscheck. Bevor es überhaupt in die Luft geht, müssen die Hürden der Bürokratie überwunden werden: Inspektoren der Kenianischen Luftfahrtbehörde prüfen zunächst genau, ob Papiere, Korb und Hülle allen Sicherheitsstandards genügen. DE 2012'
