  title: Schwarzwaldfahrt aus Liebeskummer
  subtitle: Schwarzwaldfahrt aus Liebeskummer
  description: Architekt Hannes Cremer (Roy Black) kündigt Job und Beziehung mit Breitners Tochter und flieht in den Schwarzwald. Dort trifft er auf Renate und ihre Freundinnen. Es entwickelt sich eine Romanze, die durch Missverständnisse und Janines Auftauchen getrübt wird. Nach Irrungen und Wirrungen, bei denen auch ein Hochzeitskleid und verschwundene Pferde eine Rolle spielen, klären sich alle Missverständnisse und Hannes und Renate finden zusammen.
