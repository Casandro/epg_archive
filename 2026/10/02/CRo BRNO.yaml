  start: 2026-10-02T09:04:00Z
  stop: 2026-10-02T10:00:00Z
  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Chovatelská poradna: Radek Baďura o podpoře volně žijících zahradních živočichů na počátku podzimu.Poznáte, jak velký a vykrmený by měl být ježek, aby úspěšně přezimoval? Co je dobré v tuto roční dobu nachystat na zahradě veverkám? Má smysl na podzim instalovat hmyzí domky? A co dalšího můžeme teď pro volně žijící zvířata udělat, na co a koho nezapomenout? Moderuje Sandra Silná.'
