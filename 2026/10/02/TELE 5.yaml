  description: "Fakt oder Fiktion? Auf der Tropeninsel Puerto Rico sorgt ein schreckliches Wesen für Furore. \"El Chupacabra\", der Ziegensauger, soll für bizarre Attacken auf Haustiere verantwortlich sein. Schweine, Hühner oder Rinder: Die Tierleichen sind bis auf den letzten Tropfen Blut ausgesaugt, sodass man von einer Art Vampir als Täter ausgeht. Auch skurrile Sichtungen gab es bereits. Augenzeugen beschreiben das Wesen als Monster mit Krallenfüßen und Stacheln auf dem Rücken. Was ist dran an diesem dämonischen Mythos? Gemeinsam mit einem Wildtierbiologen begibt sich Josh auf die Suche nach der Kreatur. \nUSA 2019"
