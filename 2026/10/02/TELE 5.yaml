  subtitle: Brushy-Mountain-Staatsgefängnis
  description: |-
    Die Gruppe trifft sich in Tennessee, wo sie ihr Wohnmobil abholen und sich auf ihren Horror-Roadtrip machen. Chelsea und Tanner sind völlig fassungslos, als sie erfahren, dass sie zum verlassenen Brushy State fahren, einem der brutalsten Gefängnisse Amerikas, das als "Alcatraz des Südens" bekannt ist. An diesem paranormalen Ort starben mehr 10.000 Menschen einen qualvollen Tod. Die meisten von ihnen waren Häftlinge, die entweder von Mitgefangenen oder Wärtern gefoltert oder ermordet wurden. Brushy State ist auch die Heimat eines Geistes, der als "The Creeper" bekannt ist. Wird das Team diesem abscheulichen Ort entkommen?
