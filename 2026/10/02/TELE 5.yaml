  title: Silent Hill
  description: |-
    Die kleine Sharon (Jodelle Ferland) quält sich arg, ihre Adoptiveltern Rose (Radha Mitchell) und Christopher (Sean Bean) leiden mit. Das Mädchen hat Albträume und schlafwandelt. Nichts und niemand scheint zu helfen. Immer wieder ruft Sharon dabei den Namen "Silent Hill". Als Rose herausfindet, dass dies eine Stadt ist, bricht sie mit Sharon - gegen den Willen des Vaters - dorthin auf. Eine desaströse Entscheidung. - Auch wenn sich die Handlung stark am ersten Teil der erfolgreichen Horror-Videospielreihe orientiert, gibt es doch eklatante Unterschiede: Im Spiel steuert man den Vater des Kindes, im Film begeben sich Mutter und Tochter nach Silent Hill. Auch die Namen wurden geändert.
    CAN, FRA 2006
