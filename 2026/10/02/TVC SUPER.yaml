    FR, 2017
    Reżyseria: Emmanuel Rigaut
    Kapitan Marie Jourdan prowadzi śledztwo w sprawie tajemniczego utonięcia kobiety w basenie luksusowego hotelu w malowniczym Saint-Paul-de-Vence. Romans, ukryte motywy i podejrzani - właściciel hotelu, handlarz sztuki oraz fotograf - tworzą sieć intryg. Za fasadą bogactwa i spokoju Lazurowego Wybrzeża kryją się niebezpieczne sekrety, które stopniowo wychodzą na jaw.
