  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 2)'
  subtitle: Candice prowadzi śledztwo w sprawie zamordowania kobiety, która została dźgnięta nożem w swoim domu, prawodpodobnie w afekcie, przez byłego kochanka ofiary, Rodolpha Beckera.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Kobieta została zadźgana nożem w swoim domu. Morderstwo przypuszczalnie zostało popełnione w afekcie, przez byłego kochanka ofiary, Rodolpha Beckera, który właśnie opuścił więzienie, w którym siedział za zabójstwo żony. Chociaż sam podejrzany twierdził, że jest niewinny, wszystko przemawiało za tym, że był mordercą. Candice ma te same wątpliwości wobec oskarżonego.
  ageRating: 12
