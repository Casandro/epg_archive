  title: Erklär's mir
  subtitle: 'Mensch oder Maschine: So erkennst du KI-Bilder'
  description: 'Ist dieses Bild von einem Menschen gemacht oder von einer KI? In diesem Video werden verschiedene Bilder angeschaut und man versucht zu erraten: Kunst oder KI? Manche Bilder wurden von Künstlerinnen und Künstlern erstellt, andere von einer künstlichen Intelligenz. Woran kann man erkennen, ob ein Bild von einem Menschen oder von einer Maschine "gemalt" wurde? Das Video zeigt, wie künstliche Intelligenz heute Bilder erstellen kann, die sich kaum von Kunst unterscheiden, die von Menschen erschaffen wurde. Es geht darum, genau hinzusehen und darüber nachzudenken, wie Menschen und KI heute Bilder machen können.'
