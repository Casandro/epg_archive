  subtitle: Der Aeroclub Bexbach
  description: |-
    Die grenzenlose Freiheit ist es, die die Flieger in Bexbach immer wieder in die Luft zieht. Den Aeroclub in Bexbach gibt es schon viele Jahrzehnte und er ist seit jeher eine echte Institution.
    Nach einer schwierigen Zeit, in der der Betrieb weitgehend stillstand, baut ein junges Team den Verein jetzt wieder auf. Jonas Schulz ist der Vorsitzende des Bexbacher Aeroclubs.
    Er widmet jede freie Minute seinem Verein. Sarah Neumann macht gerade ihren Flugschein. Die Reportage hat Jonas, Sarah und andere engagierte Mitglieder des Vereins begleitet.
