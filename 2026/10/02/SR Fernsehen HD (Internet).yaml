  title: Spickzettel
  subtitle: Wie die Nationalsozialisten 1933 eine Diktatur errichten
  description: 'Nach Hitlers Ernennung zum Reichskanzler im Januar 1933 beginnen die Nationalsozialist:innen, Deutschland systematisch "umzubauen". Am 1. Februar wird der Reichstag aufgelöst, Neuwahlen werden angesetzt. Mit Notverordnungen setzen die Nationalsozialist:innen die Grundrechte der Weimarer Verfassung außer Kraft. Sie nutzen Propaganda, um ihre Ideologie zu verbreiten und betreiben die Gleichschaltung der Gesellschaft: Sie besetzen staatliche und gesellschaftliche Institutionen mit ihren Anhängern.'
- eventId: 1409502
  start: 2026-10-02T03:40:00Z
  stop: 2026-10-02T03:45:00Z
  title: Spickzettel
  subtitle: Wie funktioniert eine Wettervorhersage?
  description: 'Um das Wetter von morgen in einem bestimmten Gebiet vorhersagen zu können, muss man erst mal wissen, wie das Wetter dort jetzt gerade ist. Im ersten Schritt sammeln Wetterstationen, Wetterballons und Satelliten deshalb Wetterdaten: Sie messen Temperatur, Luftdruck, Luftfeuchtigkeit, Windgeschwindigkeit und einiges mehr. Schritt zwei ist das Berechnen. Dafür braucht man leistungsstarke Computer, die mit Wettermodellen arbeiten, die zeigen, wie sich die Erdatmosphäre verändern wird. Im dritten Schritt vergleichen und interpretieren Fachleute verschiedene Modelle und Prognosen. Daraus erstellen sie dann die Wettervorhersage.'
- eventId: 1409584
  start: 2026-10-02T03:45:00Z
  stop: 2026-10-02T03:50:00Z
  title: Spickzettel
  subtitle: Warum schwitzen wir?
  description: Wann und warum schwitzt man? In diesem Video wird geklärt, wie Schweiß entsteht und wie er an heißen Tagen oder beim Sport abkühlend wirkt. Stinken muss jedoch nicht sein - frischer Schweiß ist geruchlos und fängt erst durch Bakterien an, zu müffeln. Warum schwitzt man auch, wenn man nervös oder gestresst ist? Die Antwort liegt in der Evolution - der Botenstoff Adrenalin spielt dabei eine wichtige Rolle.
