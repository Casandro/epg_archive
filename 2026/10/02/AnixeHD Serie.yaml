  title: Vier Frauen und ein Todesfall - Nebelsuppe
  subtitle: Vier Frauen und ein Todesfall - Nebelsuppe
  description: In einer Klamm wird die Leiche des örtlichen Bankdirektors (Peter Weiß) gefunden. Er ist bei einer Bergtour abgestürzt, seine Frau (Bettina Redlich) kann ihn nur an seinen neuen Sportschuhen identifizieren. Die vier Frauen mutmaßen gleich, dass Direktor Gruber keines natürlichen Todes gestorben sein kann, schließlich war er ein äußerst geübter Bergsteiger. Sie starten ihre Nachforschungen und sollen Recht behalten. Gruber war in dubiose Ostgeschäfte verwickelt und hat dabei viel Geld anderer verwirtschaftet, sein eigenes Vermögen aber rechtzeitig in Sicherheit gebracht. Es gibt also einige, die ganz froh sind, dass der Herr Direktor das Zeitliche gesegnet hat und das nicht nur im Ort, sondern offenbar weit über dessen Grenzen hinaus.
