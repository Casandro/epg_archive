  title: Richterin Barbara Salesch
  subtitle: |-
    Sexy Cecile
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Für die Liebe unters Messer? Nicola ist der festen Überzeugung, dass ihre 18-jährige Tochter Cecile von ihrem 29-jährigen Freund Sebastian zu einer Schönheitsoperation nach der anderen gedrängt wird und er diese auch finanziert. Hat die besorgte Mutter Sebastian 3.500 Euro gestohlen, um so zu verhindern, dass Cecile sich nach einer Brust-OP auch noch einer Nasenkorrektur unterzieht?
  widescreen: true
- eventId: 1272406
  start: 2026-10-02T04:29:43Z
  stop: 2026-10-02T05:22:42Z
  title: Richterin Barbara Salesch
  subtitle: |-
    Geld oder Liebe
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Seit über einem Jahr putzt die vorbestrafte Lisa bei Marion und kümmert sich liebevoll um deren Sohn Felix. Als Marions wertvoller Schmuck gestohlen wird, gerät Lisa sofort unter Verdacht. Die alleinerziehende Zwillingsmutter beteuert ihre Unschuld. Hat Marion den Diebstahl inszeniert, um Lisa vor Felix schlecht zu machen? Oder ist Lisa aus Geldnot tatsächlich wieder kriminell geworden?
  widescreen: true
- eventId: 1272407
  start: 2026-10-02T05:22:42Z
  stop: 2026-10-02T06:17:54Z
  title: Richter Alexander Hold
  subtitle: |-
    Mysteriöser Geldfund
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
    (WH vom Sonntag, 27.09.2026, 13:40 Uhr)
  description: Nico Schröder schwärmt schon länger für seine 19 Jahre ältere Nachbarin Beatrix Mehring. Doch dem Realschüler hat das Beobachten mit dem Fernglas wohl nicht mehr ausgereicht. Er soll in Frau Mehrings Wohnung eingestiegen sein. Doch die kam überraschend früher nach Hause. Hat der Angeklagte aus einem Kurzschluss heraus agiert und die attraktive Frau deshalb niedergeschlagen? Wäre der Verliebte zu so einer Tat überhaupt in der Lage gewesen?
  widescreen: true
- eventId: 1272412
  start: 2026-10-02T06:17:54Z
  stop: 2026-10-02T07:13:24Z
  title: Richter Alexander Hold
  subtitle: |-
    Schuh-Tick
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: Der hübschen jungen Angeklagten wird vorgeworfen, einen wohlhabenden Fotografen in seiner Wohnung betäubt und bestohlen zu haben. Sie soll seiner Einladung zu ihm nach Hause nachgekommen sein, obwohl sie ahnte, dass sie es mit einem Schuhfetischisten zu tun hat. Hielt sie ihn aufgrund seiner Neigung für ein leichtes Opfer und hat ihn geschickt mit ihren Füßen abgelenkt? Oder war das Betäubungsmittel ursprünglich für sie selbst bestimmt?
  widescreen: true
- eventId: 1272413
  start: 2026-10-02T07:13:24Z
  stop: 2026-10-02T08:08:28Z
  title: Richter Alexander Hold
  subtitle: |-
    Die weiße Massai
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: Die Angeklagte Lea Schlüter soll versucht haben, Salim Turay aus Eifersucht und Wut zu überfahren. Der Halbafrikaner hatte eine längere Internetbeziehung mit der jungen Frau und soll vorgetäuscht haben, dass er in Südafrika lebt und eine kranke Mutter zu versorgen hat. Ist die verliebte Lea durchgedreht, als sie erfahren hat, dass sie ihre Ersparnisse an einen Betrüger geschickt hat? Oder hatte vielleicht ihr cholerischer Ex-Mann etwas mit dem Unfall mit Fahrerflucht zu tun?
  widescreen: true
