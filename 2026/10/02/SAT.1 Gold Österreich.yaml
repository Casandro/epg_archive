  title: Dr. Quinn - Ärztin aus Leidenschaft
  subtitle: |-
    Väter und Söhne
    Western, USA 1994
    Altersfreigabe: ab 6
  description: |-
    Dr. Quinn erzieht ihren Adoptivsohn Brian nach bestem Gewissen. Sully, der sich "nur" als Brians Stiefvater betrachtet, hat sich bislang aus der Kindererziehung herausgehalten. Nach einem bösen und vor allem gefährlichen Streich, den Brian und sein Kumpel Anthony ausgeheckt haben, ist Dr. Quinn überfordert. Sully versteht, dass der Junge väterliche Führung braucht und beraumt ein Vater-Sohn-Gespräch an.

    Regie: Jerry Jameson
    Drehbuch: Josef Anderson
    Komponist: William Olvis

    Darsteller:
