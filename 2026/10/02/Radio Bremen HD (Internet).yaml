- eventId: 1415692
  start: 2026-10-02T11:10:00Z
  stop: 2026-10-02T12:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (260)
  subtitle: Freundschaftsehe
  description: 'Dr. Matteo Moreau wird von Annika Rösler verfrüht aus seiner Auszeit zurückgeholt, als die ihm eine Patientin zur Weiterbehandlung anvertraut. Dr. Ben Ahlbeck stößt dazu, um sein Können in diesem Fall unter Beweis zu stellen, aber Matteos schlechte Laune kommt ziemlich ungelegen: Die junge Dreifach-Mama Leonie Bender hat sich bei einem Arbeitsunfall einen Oberschenkelbruch zugezogen, der nicht heilt. Bei der Not-OP müssen die Ärzte feststellen, dass das Ausmaß der Verletzung weit größer ist als vermutet. Die verwitwete Leonie könnte auch noch ihr Bein verlieren!'
  ageRating: 12
