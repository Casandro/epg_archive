  subtitle: Gras säen, pflegen, rollen
  description: Der Familienbetrieb der Gebrüder Peiffer hat die perfekte Rollrasenzüchtung. Aus Alt Zachun liefern sie das Grün für Fußballclubs in aller Welt. Nun braucht das Hamburger Volksparkstadion einen neuen Rollrasen und auch der soll aus Mecklenburg-Vorpommern kommen. Hierfür wird der Rasen ein ganzes Jahr lang gehegt und gepflegt, bis er dann geschält und ins Fußballstadion verlegt werden kann. Aber auch private Gärten und Golfplätze werden beliefert.
