  description: Roland und Pia Heilmann wollen Leipzig verlassen. Als Grund nennen sie ihrer Familie die Trauer um Alina und Vladi, die sie durch einen Neuanfang hinter sich lassen wollen. Roland hat sich auf eine Chefarztstelle in Köln beworben. Die Prüfungskommission wird demnächst in der Klinik erscheinen, um ihn zu beurteilen. Sohn Jakob ist sauer, weil er wie immer vor vollendete Tatsachen gestellt wird.
