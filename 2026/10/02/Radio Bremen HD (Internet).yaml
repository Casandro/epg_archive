  title: 'Die Nordreportage: Umzug mit Milch und Muffins'
  subtitle: Neues Logistiklager für den Discounter
  description: "Das zentrale Logistikzentrum eines großen Discounters für die Region Hannover, Wolfsburg und Braunschweig zieht samt Lebensmitteln um. Und das im laufenden Betrieb. Die Kundschaft darf das nicht bemerken. Damit die Regale nicht leer werden, packen alle Mitarbeitenden mit an. \n\"Die Nordreportage\" begleitet den Umzug ins neue Warenlager und zeigt, was hinter den Kulissen passiert, damit Milch und Muffins nach dem Umzug in den Regalen liegen."
