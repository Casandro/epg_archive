  title: DAS! Rote Sofa
  subtitle: 'Gäste: Martin Brambach und Christine Sommer, Schauspieler-Paar'
  description: "Kaum ein Gefühl bewegt so sehr wie die Liebe. Der Dresdner \"Tatort\"-Ermittler Martin Brambach und seine Frau Christine Sommer feiern ihre 25-jährige Beziehung daher mit einem gemeinsamen Liebes-Buch. Ihre darin ausgewählten Briefe und Texte von Goethe, Tucholsky, Simone de Beauvoir, Charles Bukowski, Virginia Woolf und anderen erzählen von Sehnsucht, Verlangen, Kummer und Schmerz. \nAuf dem Roten Sofa verraten sie, wer zu Beginn der Beziehung mehr Liebesbriefe und SMS geschrieben hat und warum für das perfekte Glück getrennte Betten ideal sind."
- eventId: 1409356
  start: 2026-10-02T04:00:00Z
  stop: 2026-10-02T04:20:00Z
  title: Sesamstraße
  description: "Bert liest gerade ein Buch, als Ernie hineinplatzt und ihn auffordert, einen Helm aufzusetzen. Bert will nicht, aber Ernie besteht darauf. Wenig später erklärt sich, warum Ernie unbedingt wollte, dass Bert einen Helm trägt. \n\nSophia ist gerade fünf Jahre alt geworden. Auf dem Kirchplatz, da wo keine Autos fahren dürfen, hat sie Fahrrad fahren gelernt. Das Fahrrad hat sie von ihrer Großmutter geschenkt bekommen. Zuerst fand Sophia Stützräder klasse, aber jetzt braucht sie die nicht mehr. Sie kann auch schon prima bremsen!"
  genre:
