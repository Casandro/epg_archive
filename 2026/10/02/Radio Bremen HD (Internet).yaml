  description: 'Er ist Musiker, Extremsportler, Abenteurer und offenbar kaum müde zu bekommen: Joey Kelly sucht seit Jahrzehnten immer wieder neue Herausforderungen. Mit Michel Abdollahi spricht Joey Kelly über Disziplin und Ehrgeiz, seine Zeit mit der Kelly Family und die Frage, warum er selbst nach Ironmans, Wüstenläufen und Expeditionen noch immer nicht genug vom Grenzerlebnis hat.'
