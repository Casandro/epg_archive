    Das ist aber nur aus Versehen passiert. Das Schachtelmännchen möchte er eigentlich unbedingt selbst behalten. Er bittet Posy, ein Auge darauf zu haben, während er loszieht, um bei den anderen Freunden irgendein tolles neues Spielzeug für sich zu ergattern.

