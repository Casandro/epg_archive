  description: |-
    Der Tag der Prüfung

    Max möchte die Ausbildung zum Tierpfleger machen, für die er eine Aufnahmeprüfung bestehen muss. Geprüft wird er zu seiner Überraschung von Sonia und Ruth, und zwar direkt im Reservat.

    Die Prüfung, die Max bestehen muss, besteht aus drei Aufgaben: Er soll das frisch eingetroffene Baumkänguru Zooky medizinisch untersuchen, einen geeigneten Lebensraum finden und mit den anderen Tieren vertraut machen. Keine einfache Sache für den nervösen Max.
