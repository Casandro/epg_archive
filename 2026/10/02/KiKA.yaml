  description: |-
    Animationsfilm, Niederlande 2024
    Benjamin, die Fledermaus, hat Angst im Dunkeln. Deshalb fliegt er tagsüber los, um sich Futter zu suchen. Dabei trifft er auf das freche Vogelmädchen Sherida. Der Beginn eines Abenteuers...

    Seit Benjamins Mutter Opfer eines Raubvogels wurde, sind für seine Familie alle Vögel Feinde. Und Singen ist tabu. Aber Benjamin will den Kontakt zu Sherida nicht abbrechen. Er fühlt sich zu ihr hingezogen und er will mit ihr unbedingt den Gesangswettbewerb gewinnen.

    Benjamin ist anders als seine Brüder und sein Vater. Er ist besonnener und hinterfragt die Dinge des Lebens. Auch wenn der furchtbare Tod seiner Mutter durch einen Raubvogel dazu geführt hat, dass er Angst vor der Dunkelheit hat, findet er nicht, dass alle Vögel automatisch böse sind. Und, dass man deshalb auch nicht Singen darf, kann er ebenso wenig verstehen. Er jedenfalls singt für sein Leben gern. Aber mit seiner Familie darüber zu reden, ist zwecklos. ...
    HD-Produktion
