  description: |-
    Der gestohlene Adler

    Die Pfefferkörner stehen kurz davor, mit ihren Familien umzuziehen, da gerät Jasina mitten in eine Verfolgungsjagd und bekommt einen Mini-USB-Stick zugesteckt. Die darauf befindlichen Dateien führen die Pfefferkörner auf die Spur eines illegalen Wildtierhändlerringes. Gemeinsam gelingt es ihnen, einen aus dem Tierpark gestohlenen Adler zu retten. Hakim und Jasina nehmen Abschied von den Freunden und von Pepper, der nach vielen Jahren im Einsatz nun mit den Bruns nach München zieht. Amy übergibt das Staffelholz an die neuen Pfefferkörner.
