  title: Open Doors Magazin
  subtitle: Wenn der Glaube Leben kostet
  description: |-
    Wie leben Christen, wenn jede Nacht zur Gefahr wird? Im Norden Kameruns fliehen Familien bei Einbruch der Dunkelheit in die Berge - aus Angst vor den Angriffen von Boko Haram. Und doch gibt es Orte, an denen Hoffnung stärker ist als Hass: In Äthiopien baut Pastor Docho nach Jahren der Verfolgung eine Schule für christliche und muslimische Kinder, um Brücken des Friedens zu schlagen. Wie ist solch ein Glaube möglich? Was bewegt Menschen, trotz Bedrohung zu bleiben und zu lieben? Erleben Sie bewegende Geschichten von Mut, Versöhnung und gelebtem Glauben im Open Doors Magazin. Schauen Sie rein, teilen Sie die Sendung und setzen Sie ein Zeichen der Solidarität.

