  title: inBindung - Der Erziehungstalk
  subtitle: Kindergottesdienst bindungsorientiert gestalten
  description: "Wie sollte der Kindergottesdienst gestaltet werden, mit welcher Haltung sollten GemeindemitarbeiterInnen Kindern begegnen, sodass in Kindern der Glaube an einen guten Gott wachsen kann? Was sind die Stolpersteine bei der Glaubensvermittlung? Wie können Kinder durch sichere Bindung am Modell lernen? Gemeinsam schauen wir auf die Herausforderungen und Chancen. Der Podcast zur Sendung \"InBindung\" ist auf allen gängigen Streaming-Plattformen zu finden. Anna Born, Julia Wanitschek und  Junita Horch gehören zum Team von \"InBindung\" und sind Exptertinnen für bindungs- und bedürfnisorientierter Erziehung. \n\nMehr Informationen gibt es auf www.inbindung.de."
  widescreen: true
  hd: true
- eventId: 1197516
  start: 2026-10-02T01:15:00Z
  stop: 2026-10-02T01:40:00Z
  title: inBindung - Der Erziehungstalk
  subtitle: Wenn dein Kind nicht kooperiert - Eifersucht, Weglaufen & Verweigerung
  description: "Warum läuft mein Kind weg, hört nicht auf mich oder reagiert eifersüchtig auf andere Kinder? In dieser Folge beantworten wir drei Hörerfragen rund um Weglaufen im Kleinkindalter, schwierige Übergänge beim Abholen aus dem Kindergarten und starke Eifersucht unter Kindern. \nWir erklären, was im Nervensystem deines Kindes passiert, warum Impulskontrolle noch nicht ausgereift ist und weshalb Strafen langfristig nicht helfen. Du bekommst konkrete, bindungsorientierte Impulse für mehr Sicherheit, klare Führung und entspanntere Alltagssituationen.\n\nMehr Informationen gibt es auf www.inbindung.de."
  widescreen: true
  hd: true
