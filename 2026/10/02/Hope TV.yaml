  title: Beziehungskiste
  subtitle: Große Liebe, letzte Sendung
  description: |-
    In der letzten Ausgabe der »Beziehungskiste« blicken wir gemeinsam mit Anja Wildemann auf fast 210 Sendungen voller ehrlicher Gespräche, berührender Begegnungen und wertvoller Impulse zurück. Zum Finale ist auch Manuel - der Ehemann der Moderatorin - dabei, und Valerie Brünner begleitet das Gespräch durch den Abschied. Gleichzeitig macht die Sendung einen warmen Übergang in die Zukunft: Ab nächster Woche übernimmt Valerie diesen Sendeplatz montags um 20:15 Uhr mit der Neuauflage von »ungeschminkt family«. Ein rundes Finale und ein Neuanfang - für alle, die Beziehungen lieben, leben und weiterdenken.

