  description: "Wie sollte der Kindergottesdienst gestaltet werden, mit welcher Haltung sollten GemeindemitarbeiterInnen Kindern begegnen, sodass in Kindern der Glaube an einen guten Gott wachsen kann? Was sind die Stolpersteine bei der Glaubensvermittlung? Wie können Kinder durch sichere Bindung am Modell lernen? Gemeinsam schauen wir auf die Herausforderungen und Chancen. Der Podcast zur Sendung \"InBindung\" ist auf allen gängigen Streaming-Plattformen zu finden. Anna Born, Julia Wanitschek und  Junita Horch gehören zum Team von \"InBindung\" und sind Exptertinnen für bindungs- und bedürfnisorientierter Erziehung. \n\nMehr Informationen gibt es auf www.inbindung.de."
