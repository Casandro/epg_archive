  description: "In deprimierenden Zeiten zwischen Pandemie, Ukraine-Krieg, politischer Verunsicherung u.v.m. sind Mutmach-Geschichten für uns alle wichtiger denn je! Die Medien überschütten uns täglich mit negativen Meldungen, so dass wir uns nach Berichten sehnen, die uns inspirieren, berühren und zuversichtlich stimmen. Bei WIE MAN RIESEN BEKÄMPFT erzählen wahre Mutmacher ihre persönliche Geschichte mit Gott und was ihnen in Krisenzeiten Mut macht.  \nMehr Infos zu unserem Mutmach-Projekt \"WIE MAN RIESEN BEKÄMPFT?!\" findet Ihr hier:\nwww.wiemanriesenbekaempft.de"
