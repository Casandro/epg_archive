  title: WDR 3 Hörspiel - Krimi
  subtitle: Gruß aus der Küche
  description: |-
    Die angehende Köchin Gynni arbeitet im renommierten Sterne-Restaurant "Echtzeit". Jede Zutat, jeder Teller, jeder Gast werden hier mit Perfektion behandelt. Küchenchef und Inhaber Nils ist bekannt für seine <markup type="language.fr">Haute Cuisine</markup>. Hoch ist auch der Druck, den er an sein Team weitergibt. Als <markup type="language.fr">Sous</markup> Chefin Milena etwas erfährt, das den Ruf des Restaurants zerstören könnte, bekommt sie am eigenen Leib zu spüren, wie weit Nils für einen weiteren Stern gehen würde. Kann Gynni Milena dabei helfen aufzudecken, was der Chef des "Echtzeit" vertuscht?
    Regie: die Autorin<br/>Produktion: WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
    Ab dem <markup type="abbr" abbreviation="16." correspondent="sechzehnten">16.</markup> September <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
