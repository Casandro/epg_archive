  title: WDR 3 Konzert
  subtitle: 'Moderation: Claudia Belemann'
  description: |-
    "Beethovens Violinkonzert ist für mich ein wenig wie die Mona Lisa - man sieht das Lächeln, aber begreift es nicht wirklich: Lächelt sie mir zu oder lächelt sie über mich?" so Vilde Frang, die beim Beethovenfest Bonn mit dem London Symphony Orchestra unter der Leitung von Chefdirigent Antonio Pappano gastiert. Anschließend erklingt die hochemotionale Sinfonie Nr. 5 von Peter Tschaikowksy.
    <strong>Ludwig van Beethoven<br/></strong>Violinkonzert D-Dur, op. 61
    <strong>Peter Tschaikowsky<br/></strong>Sinfonie Nr. 5 e-Moll, op. 64
    <strong>Vilde Frang</strong>, Violine<br/><strong>London Symphony Orchestra</strong><br/>Leitung: <strong>Sir Antonio Pappano</strong>
    Aufnahme vom 5. September 2026 in der Beethovenhalle Bonn
    Moderation: Claudia Belemann<br/>Redaktion: Michael Breugst
