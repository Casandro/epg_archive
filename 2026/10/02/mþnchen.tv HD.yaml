  title: '#WirSindWiesn am 1. Oktober 2026 (Wh.)'
  subtitle: Tag 13 unserer täglichen Livesendung vom Oktoberfest 2026!
  description: 'Das größte Volksfest der Welt live im Wohnzimmer... mit München TV sind Sie dabei! Unsere Moderatoren Alexander Onken, Madalena Epp, Corinna Binzer und Nikals Schüle begrüßen Gäste in unserem Wiesnstudio im Paulaner Festzelt und freuen sich auf unsere Reporter, die die vielen bunten Seiten des Oktoberfests zeigen: wilde Bilder aus den Fahrgeschäften, leckere Schmankerl aus den Wirtsbuden, kecke Flirts unter beziehungswilligen Wiesnsingles, bestens aufgelegte Promis in Partylaune (egal ob im Fragenwagen auf dem Weg zur Wiesn oder im brodelnden Festzelt) und vieles mehr. Kurzum: Spiel, Spaß und... naja, nur für Schokolade müssen Sie selbst sorgen!'
