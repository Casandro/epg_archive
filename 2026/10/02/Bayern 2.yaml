  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: "Podcast\nWild Wild Web - Geschichten aus dem Internet\nInside Palantir: Burritos und Bin Laden (1/5)\nPalantir ist das vielleicht mysteriöseste Software-Unternehmen der Welt. In den ersten Jahren muss es um Investoren und Anerkennung kämpfen. Aber dann ändert ein Gerücht über den Tod von Osama Bin Laden alles.\n\"Wild Wild Web - Inside Palantir\" erzählt in fünf Folgen die ganze Geschichte hinter Palantir und ihrem CEO Alex Karp - ohne PR oder Panikmache. Der Podcast blickt hinter die Kulissen der verschwiegenen Firma und spricht exklusiv mit ehemaligen Mitarbeitern. \nVon André Dér Hörmeyer, Benedikt Dietsch, Moritz Matzner und Max Sippenauer\nBR 2026\n\nTeil 2 am Freitag, 16. Oktober, 20.03 Uhr\n\nHörspiel\nBabylon Berlin\nHaus Vaterland (1/5): Ein Toter im Aufzug\nBerlin 1932/33: Die Weimarer Republik steht am Abgrund. Politische Radikalisierung, wirtschaftliche Unsicherheit und Gewalt nehmen zu. Inmitten der aufgeheizten Atmosphäre ermittelt Gereon Rath weiter: Ein rätselhafter Todesfall im Vergnügungstempel \"Haus Vaterland\" führt den Kommissar von Berlin bis in die masurischen Moore - hinein in eine düstere Mordserie.\nAuch Charlotte Ritter muss sich neuen Herausforderungen stellen. Als Mitglied der weiblichen Kriminalpolizei kehrt sie nach Berlin zurück und wird dort als verdeckte Ermittlerin im \"Haus Vaterland\" eingesetzt. Sie gerät tief in die Verstrickungen des Falls, während die politische Lage eskaliert: Der Einfluss der Nationalsozialisten wächst, die staatliche Ordnung zerfällt, und die dringend benötigte Hilfe ihres (endlich) Verlobten Gereon Rath kratzt am Rande der Legalität.\nDas Hörspiel zur finalen TV-Staffel Babylon Berlin verbindet Volker Kutchers Romane \"Die Akte Vaterland\" und \"Märzgefallene\" zu einem mitreißenden Serien-Highlight.\n\nBerlin 1932/33. Im legendären Vergnügungstempel Haus Vaterland wird ein Mann tot im Lastenaufzug aufgefunden - obwohl alles darauf hindeutet, dass er ertrunken ist. Während Gereon Rath einer Spur bis nach Masuren folgt, kehrt Charlotte Ritter aus Paris zurück und beginnt als verdeckte Ermittlerin im Haus Vaterland. Zugleich gerät die Berliner Polizei in den Strudel der politischen Umbrüche.\n\nVon Volker Kutscher\nMit Ole Lagerpusch, Alice Dwyer, Peter Nottmeier, Fabian Busch, Denis Moschitto, Benito Bause, Sebastian Urzendowsky, Anna-Maria Arkona, Anna Böttcher, Magdalena Monatasser, Roman Knizka und anderen\nMusik: Verena Guido und das WDR Funkhausorchester\nBearbeitung: Thomas Böhm und Benjamin Quabeck\nRegie: Benjamin Quabeck\nWDR 2026\n \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
