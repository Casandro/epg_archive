  subtitle: '"Неизвестная Италия" 1 сезон -- №2 Авильяна'
  description: 'Увлекательнейший проект "Неизвестная Италия" с Анной Федоровой! Путешествие проходило на Севере Италии, регион Пьемонт. Неописуемая красота сопровождала нас на каждом шагу! Немного о местах, которые мы увидели сами и которые обязательно покажем вам! Мы посетили Борромейские острова - архипелаг на итальянском озере Лаго-Маджоре. Дворцы, парки и сады архипелага - излюбленное место пребывания правителей Савойской династии. Чудесные курортные городки Стреза и Вербания воспевали в своих произведениях художники и писатели. В них сосредоточены виллы и заповедные сады со множеством редких растений и животных. Священная гора в Варалло, где расположен Новый Иерусалим - комплекс часовен (капелл), каждая из которых прослеживает путь Христа от рождения до распятия - это уникальное рукотворное творение, которое создает эффект 3D кинотеатра XXI столетия! Вы увидите Аббатство Сакра ди Сан Микеле, и поймете, чем оно когда-то вдохновило Умберто Экко на написание романа-бестселлера "Имя розы". Что такое Орта Сан Джулио? Это коммуна в Италии: маленький остров Сан Джулио - был назван в честь греческого святого Юлия, который поселился здесь в IV веке и построил первую в Пьемонте христианскую церковь. Здесь же - чудесное альпийское озеро Орта. Новара - второй по величине город Пьемонта. В нем мы снимали базилику Сан Гауденцио, которая является самой высокой точкой города. Было интересно побывать на центральной площади, которая раньше была центром администрации города, а сегодня это - место проведения фестивалей современного искусства. Городок Авильяна, который богат природными парками, озерами и старинной архитектурой, подарил нам много приятных мгновений.'
