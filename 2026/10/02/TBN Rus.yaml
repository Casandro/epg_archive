  description: 'Выборгский "оазис" и миссия барона Николаи: история веры и служения В этом выпуске мы отправляемся в одно из самых живописных мест Ленинградской области - парк Монрепо. В переводе с французского название имения баронов Николаи означает "место покоя", но история жизни владельца этой усадьбы, барона Пауля Николаи, была наполнена не столько покоем, сколько неустанным духовным поиском и самоотверженным служением. Кто же такой Пауль Николаи и почему его фигура стала ключевой для евангельского движения в России? Мы проследим путь человека, который променял светскую жизнь на миссионерство: от десяти лет проповедей на собственной яхте до духовного наставничества в тюрьмах. Вместе с Джоном Моттом барон Николаи стоял у истоков Российского студенческого христианского союза, создавая интеллектуальную и духовную среду для молодежи, включая знаменитое общество "Маяк". Мы поговорим о том, как идеи Николаи меняли жизни студентов и какое наследие он оставил после себя. Однако история Монрепо - это не только просвещение. Мы затронем драматические страницы прошлого: как прекрасный парк стал убежищем для людей, спасавшихся от ужасов Гражданской войны, и как сложилась судьба самого барона после прихода новой власти. Присоединяйтесь к нашему путешествию в Выборг, чтобы увидеть историю через призму веры, стойкости и любви к ближнему.'
