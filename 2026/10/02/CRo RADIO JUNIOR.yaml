- eventId: 1377097
  start: 2026-10-02T17:50:00Z
  stop: 2026-10-02T18:00:00Z
  title: Hajaja
  description: Rézička a Čtvrtjadýrko 4/6 - Jak chystali houbové hody. Povídání o jedné veverce s kožíškem rezavým jako měď, která si říkala Rézička. Aby jí nebylo smutno, našla si kamaráda. Malého lískového skřítka jménem Čtvrtjadýrko. O tom, co všechno spolu zažili, vypráví seriál Jaroslavy Pechové Rézička a Čtvrtjadýrko. Natočeno v roce 1990. Režie Vladimír Gromov. Vypráví Dana Syslová.
