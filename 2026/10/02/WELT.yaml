  title: Lost Places - Folge 123
  subtitle: Lost Places - Folge 123
  description: 'Ein Märchenpalast im marokkanischen Atlas: Ort von Macht, Glanz und Verrat einer Dynastie, die sich mit der französischen Kolonialmacht verbündet - bis zum Ende. In der ehemaligen Tschechoslowakei rettet Oskar Schindler 1200 jüdische Frauen und Männer auf einem Fabrikgelände vor dem Holocaust - die Geschichte und der Ort hinter "Schindlers Liste". Ein Ökohotel im Amazonas scheitert am Reality-TV, in Brandenburg bringt ein Kalkwerk Aufschwung mit fatalen Folgen für Arbeiter.'
  widescreen: true
