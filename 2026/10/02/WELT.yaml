  title: Abgefahren - Die spektakulärsten Dashcam Clips (3.1)
  subtitle: Abgefahren - Die spektakulärsten Dashcam Clips (3.1)
  description: Der Siegeszug der Dashcams hält an. In Deutschland haben Aufzeichnungen solcher Windschutzscheiben-Kameras als Beweismittel sogar schon Einzug in die Gerichte gehalten. Die überall auf der Welt entstandenen Bilder dieser Reihe zeigen haarsträubende Unfälle, halsbrecherische Fahrmanöver, unfassbare Dummheiten und hemmungslose Ausraster von Verkehrsrowdys, denen man auf der Straße niemals begegnen möchte. Kaum zu glauben, dass keiner der Beteiligten dabei ernsthaft verletzt wurde.
