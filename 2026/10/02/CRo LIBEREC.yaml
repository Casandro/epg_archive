- eventId: 1377125
  start: 2026-10-02T09:05:00Z
  stop: 2026-10-02T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Sto let příběhů, emocí a potlesku. Jednatelka společnosti Kultura Nový Bor s.r.o. Ilona Rejholcová. V tomto roce slaví Městské divadlo a kino v Novém Boru sté výročí od svého vzniku. Historické milníky této impozantní budovy, která na začátku sloužila jako kino i divadlo zároveň, si připomeneme hodinu před polednem. Také se dozvíme více o projektu zaměřeném na hledání pokladů z historického archivu kina a divadla, a pozveme posluchače na koncert Ondřeje Havelky a Melody Makers.'
