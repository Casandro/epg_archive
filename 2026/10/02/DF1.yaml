  subtitle: Südschweden. Skåne und seine Aalküste
  description: Die historische Provinz Skåne an der südlichsten Spitze Schwedens ist einfach eine andere Art von schwedisch. Die Menschen, die hier leben, machen diesen Teil der Welt zu einem ganz besonderen Ort. Ob traditionell, wie beim beliebten jährlichen Aalfestival, oder total modern durch seltsame Unterwasserkunst - jeder kann sich in Skåne neu erfinden! Aaron ist Lehrer, Künstler, Geschäftsmann und Besitzer einer Bar am Wasser in Åhus. Ab Ende August werden alle Jugendlichen von der Aalküste damit beschäftigt sein, an Aarons Motorrädern zu basteln. Dieses Mal werden sie Halterungen für Surfbretter an ihre Maschinen anbringen - Easy Rider-Gefühl, Skåne-Stil. Ulf Stjernbo und Peter Frank veranstalten Konzerte auf einem historischen Fischerboot im charmanten Smygehuk, dem absolut südlichsten Punkt Schwedens.
