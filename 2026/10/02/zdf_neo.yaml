  description: |-
    Italien 2020
    Valerio übergibt Ettores vermissten Schuh vom Tiber-Ufer einem befreundeten Kriminaltechniker. Dieser kann ausschließen, dass der Schuh jemals mit dem Wasser des Tibers in Berührung kam.

    Allerdings weist der Laborbefund Spuren von schwefelhaltigem Wasser und Travertinstaub nach, was den Schluss zulässt, dass Ettore vor seinem Tod in den Tivoli-Steinbruch verschleppt wurde. Daraufhin fährt Valerio gemeinsam mit einem Suchhundeführer zu dem Ort.
