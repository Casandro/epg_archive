    Valerio und Sara finden das Autowrack, mit dem Ettore verunglückt ist. Weitere Erkundigungen führen sie zu einem Hotel, in dem Ettore sich mit einer afrikanischen Familie getroffen hat.

    Sara stellt im Datenabgleich fest, dass der Vater der Familie eine Aufenthaltserlaubnis hat und sogar eine Wohnung. Valerio begibt sich daraufhin zu dem Appartement. Als er sich dort umschaut, entdeckt er, dass die Wohnung als Drogendepot benutzt wird.
