    Kinderserie, Australien 2014
    Die Meerjungfrauen sind verzweifelt. Erik hat den Stein des Dreizacks gestohlen und Zac die magischen Kräfte genommen. In der Vollmondnacht will er die Kammer der Meermänner aktivieren.

    Ondina versucht ein letztes Mal, ihn umzustimmen, erfolglos. Erik macht sich auf den Weg zur Insel Mako, verfolgt von Zac und den Meerjungfrauen. Trotz der aussichtslosen Lage sind sie alle fest entschlossen, Erik aufzuhalten und die Insel Mako zu retten.
