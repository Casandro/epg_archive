    Sara berichtet von zwei Chinesen, die sich gegenseitig des Mordes an Ettore beschuldigen und untergetaucht sind. Valerio hält das für ein erneutes Ablenkungsmanöver. Er richtet in seinem Zimmer bei Lisa und Gianni eine Wand mit all seinen Erkenntnissen ein.
