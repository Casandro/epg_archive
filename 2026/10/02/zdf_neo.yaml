  description: |-
    Deutschland 2025
    Warum brauchen wir Humor, gibt es ein Zuviel davon, und warum kann Humor heilsam sein? Lisa Budzinski trifft Comedian Serdar, dessen Humor ihm half, mit Anfeindungen klarzukommen.

    Lisa trifft den ehemaligen Erzieher Serdar Karibik. Er macht ständig Witze, will andere zum Lachen bringen, kann nicht ernst sein. Heute ist er über Schmähungen hinweg, steht selbstbewusst, vornehmlich im "Ländle", mit seinem Comedyprogramm auf der Bühne.
