  description: |-
    Kinderserie, Australien 2014
    Meermann Erik erfährt von Cam, dass der Dreizack zwar zerbrochen ist, der darin enthaltene Stein aber die eigentliche Magie besitzt. Erik will Zac überreden, den Stein gemeinsam zu suchen.

    Er will unbedingt die Kammer der Meermänner aktivieren. Doch Zac will davon nichts wissen. Er fürchtet, dass die Kräfte der Kammer sich gegen die Meerjungfrauen richten könnten. Erik beginnt, auf eigene Faust zu suchen, und geht dabei sehr rücksichtslos vor.
