  title: Elefant, Tiger & Co. (423)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    * Aufs Krokodil gekommen: Pfleger Hubertus Schmuck ist besonders stolz auf den Nachwuchs bei den Stumpfkrokodilen. Sie entwickeln sich prächtig und fressen ihm schon die Haare vom Kopf.
    * Kleiner Unterschied: Kira und Kim, die 18 Monate alten Hyänenkinder, sind Mädchen. Da waren sich bisher alle sicher. Seit kurzem zweifelt Jörg Gräser jedoch daran.
    * Spielplatz mit Tücken: Auf die jungen Lippenbären wartet ein Abenteuer. Nachdem die ersten Ausflüge über die kleine Anlage problemlos verlaufen waren, dürfen die Bärengeschwister nun den ganz großen Spielplatz kennenlernen.
