- eventId: 556087
  start: 2026-10-02T12:45:00Z
  stop: 2026-10-02T13:15:00Z
  title: STATIONEN
  subtitle: Nichts haben. Alles geben - 800 Jahre Franz von Assisi
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Vor 800 Jahren starb Franz von Assisi. Bis heute gilt er als einer der einflussreichsten Heiligen der Kirchengeschichte - als radikaler Erneuerer, Friedensstifter und Patron der Schöpfung. Seine Botschaft von Einfachheit, Mitgefühl und einem Leben in Verbundenheit mit Mensch, Natur und Gott fasziniert.
    Die Dokumentation begibt sich auf Spurensuche - an die historischen Orte seines Lebens in Assisi und Umbrien ebenso wie zu Menschen in Bayern, die sich von seiner Spiritualität inspirieren lassen.
- eventId: 556088
  start: 2026-10-02T13:15:00Z
  stop: 2026-10-02T14:00:00Z
  title: Gemeinsam singen - Ein Weg zum Glück
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im Jahr 2025 wird ein besonderes Instrument gefeiert: die Stimme. Sie ist einzigartig und ausdrucksstark, und jeder besitzt sie. Im Ton und Klang spiegelt sich die Seele wider; je nach Gemütszustand klingt die Stimme anders. Im Gesang entfaltet sie mit Melodie und Rhythmus eine ganz besondere Magie, die Endorphine freisetzt, auch bekannt als Glückshormone. Selbst wenn sich nicht jeder musikalisch begabt fühlt, findet jede Stimme ihren Platz als Instrument beim gemeinsamen Singen im Chor.'
- eventId: 556089
  start: 2026-10-02T14:00:00Z
  stop: 2026-10-02T14:30:00Z
  title: Von Beatboxen bis Bauchreden - Was unsere Stimme alles kann
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Stimme ist ein unverwechselbares Merkmal von Menschen, sie trägt das Innerste nach außen. Doch es gibt Menschen, die ihre Stimme weit über die alltägliche Kommunikation hinaus nutzen und zur Spielwiese für kreative Höchstleistungen machen. Die SWR Dokumentation stellt Menschen aus dem Südwesten vor, die die Grenzen ihres Stimmapparats ausloten und Unglaubliches mit ihrer Stimme erschaffen - wie etwa die Geräusche von Reißverschlüssen, Drumcomputern oder den Sound von ganzen Orchestern zu imitieren.
- eventId: 556090
