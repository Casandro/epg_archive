  description: Lorenz ist 38 und arbeitet als Richter am Amtsgericht in Kempten. Er entscheidet über Freiheitsstrafen in Fällen wie Betrug und Widerstand gegen Vollstreckungsbeamte. Seine Karriere hat er aber als Anwalt in einer Wirtschaftskanzlei begonnen, mit der Perspektive auf ein sehr viel höheres Gehalt als Partner. Trotzdem möchte er seinen Beruf am Gericht nicht mehr tauschen.
- eventId: 556091
