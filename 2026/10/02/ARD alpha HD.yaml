  title: 'Die größten Flüsse der Erde: Der Mississippi (3/3)'
  subtitle: Großbritannien 2018
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Den Mississippi speist ein gewaltiges Netz an Quell- und Nebenflüssen. Die Flüsse durchziehen die USA von den Rocky Mountains im Westen bis zum Gebirgszug der Appalachen ganz im Osten. Aus fast der Hälfte der Fläche der Vereinigten Staaten fließt alles Wasser schließlich in den Mississippi und dann Richtung Süden in den Golf von Mexiko. Seinen Ursprung hat der Riese in schmalen, oft wenig bekannten Quellflüssen in den Ausläufern der Rockies. Hier dauert der Winter oft fünf Monate. Dann sind Milliarden Tonnen Wasser zu Eis und Schnee erstarrt und bis zum Frühling gefangen.
