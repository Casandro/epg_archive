- eventId: 1322663
  start: 2026-10-02T16:09:00Z
  stop: 2026-10-02T16:39:00Z
  title: Te kuće su imale svoju dušu, pučka i predajna kultura
  subtitle: ' '
  description: Kad puno toga znate i želite napraviti, a vremena pred vama je malo, život doživljavate intenzivnije, a svoju misiju na ovom svijetu pokušavate rezimirati baš kao Nikola Zrinšćak. On je majstor i umjetnik iz Lazine koji je cijeloga života spašavao drvene kuće, vrijedne primjerke hrvatske tradicijske arhitekture jer je uvijek osjećao da su "te kuće imale svoju dušu".
