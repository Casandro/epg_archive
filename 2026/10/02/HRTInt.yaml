  title: Dolina sunca, serija (19/210)
  subtitle: ' '
  description: 'Ivan je jako ljut zbog Evinog upada i svađe koja je nastala u njegovom domu. Julija i Eva se porječkaju oko toga tko će njegovati Andriju dok ne ozdravi. Kristijan uvjerava potištenu Irenu kako između njega i Eve nema ničega, samo joj je pomogao oko dozvole, ali njegovi se osjećaji nisu promijenili. Karlo je zabrinut zbog financijskog stanja i Augustinine želje da za vikend otputuju na Maltu. Sofija se ljuti na Andriju što se ne ponaša dovoljno ozbiljno, aludirajući na svađu između Eve i Julije. Adela napomene Kristijanu da bi trebao više pripaziti na Irenu i doda kako prisustvo Eve Kralj samo šteti svima. Julija je ljuta i nervozna što joj je Eva ponovno došla u ured jer nisu završile započeti razgovor. Kristijan izlaže svoje ideje za ekološke nasade, ali ga Juran prekine sa svojim, isplativijim idejama koje se i Ivanu više sviđaju. Pristaje na ekološku poljoprivredu samo ako će Kristijan uložiti svoja sredstva. Juliju je uzrujala Eva u trenutku kad ju je nazvao gradonačelnik Bistrice. Eva je kriva što se ove godine prvi put neće održati Dan prijateljstva dviju općina. Juran i Sonja likuju što će Kristijan potrošiti sve novce i ostati bez ičega... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
