  title: 'Studio 4: Kultura'
  subtitle: ' '
  description: Najnoviji informativni sadržaji iz zemlje i svijeta. Prijenosi, javljanja uživo, analize i razgovori s gostima iz svih područja javnog djelovanja. Politika, kultura, sport i aktualnosti iz društvenog života. Prvi, najbrži i najrelevantniji - Studio 4.
- eventId: 1322655
  start: 2026-10-02T12:51:00Z
  stop: 2026-10-02T13:35:00Z
  title: Dolina sunca, serija (19/210)
  subtitle: ' '
  description: 'Ivan je jako ljut zbog Evinog upada i svađe koja je nastala u njegovom domu. Julija i Eva se porječkaju oko toga tko će njegovati Andriju dok ne ozdravi. Kristijan uvjerava potištenu Irenu kako između njega i Eve nema ničega, samo joj je pomogao oko dozvole, ali njegovi se osjećaji nisu promijenili. Karlo je zabrinut zbog financijskog stanja i Augustinine želje da za vikend otputuju na Maltu. Sofija se ljuti na Andriju što se ne ponaša dovoljno ozbiljno, aludirajući na svađu između Eve i Julije. Adela napomene Kristijanu da bi trebao više pripaziti na Irenu i doda kako prisustvo Eve Kralj samo šteti svima. Julija je ljuta i nervozna što joj je Eva ponovno došla u ured jer nisu završile započeti razgovor. Kristijan izlaže svoje ideje za ekološke nasade, ali ga Juran prekine sa svojim, isplativijim idejama koje se i Ivanu više sviđaju. Pristaje na ekološku poljoprivredu samo ako će Kristijan uložiti svoja sredstva. Juliju je uzrujala Eva u trenutku kad ju je nazvao gradonačelnik Bistrice. Eva je kriva što se ove godine prvi put neće održati Dan prijateljstva dviju općina. Juran i Sonja likuju što će Kristijan potrošiti sve novce i ostati bez ičega... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1322656
  start: 2026-10-02T13:35:00Z
  stop: 2026-10-02T14:00:00Z
  title: Druga strana
  subtitle: ' '
  description: Tjedna emisija o gospodarstvu koja govori o onome što drugi prešućuju. Je li sve onakvo kakvim se na prvi pogled čini?
- eventId: 1322657
  start: 2026-10-02T14:00:00Z
  stop: 2026-10-02T14:25:00Z
  title: Prometej
  subtitle: ' '
  description: Tjedna emisija o znanosti, novim spoznajama i inovacijama koje praktično mijenjaju naš svijet poboljšavajući nam svakodnevicu, predstavlja stručna i znanstvena postignuća naših znanstvenika u svim znanstvenim područjima.
- eventId: 1322658
  start: 2026-10-02T14:25:00Z
  stop: 2026-10-02T14:55:00Z
  title: 'Labirint: Prvi red do otpada'
  subtitle: ' '
  description: 'Sve je počelo kao velika priča o inovativnoj investiciji. Pojavila se tvrtka koja je u starom gospićkom silosu trebala reciklirati plastiku u građevinske blokove, bukobrane i lukobrane. Mještani Gospića veselili su se novim radnim mjestima i najavljenom restoranu s pogledom na grad. No, vrlo su brzo shvatili da se u krugu silosa događa nešto čudno - umjesto ekološki osviještenoj inovaciji, svjedočili su čudnim radnjama... Godinama su, pred njihovim očima, brojni kamioni domaćih i stranih registracijskih oznaka dolazili danju i noću te istovarivali nepoznate, prašnjave smjese i materijale, koje su bageri potom zakopavali u zemlju. Građani su sve to dokumentirali, upozoravali i pisali institucijama, no one nisu odgovarale na njihove upite. Štoviše, lokalne su ih vlasti optuživale za širenje teorija zavjere i uvjeravali kako je sve u redu. Ignorirani i prestrašeni, mještani u međuvremenu su prestali piti vodu iz vlastitih slavina. U potrazi za istinom, sami su građani pokrenuli nezavisne analize u Hrvatskoj i Njemačkoj. Njihovi nalazi, a potom i službeni dokumenti Geotehničkog fakulteta objavljeni 6. kolovoza 2026. godine, potvrdili su njihove najgore strahove: tlo je kontaminirano teškim metalima i toksičnim antimonom, dok su u podzemnim vodama i privatnim bunarima izolirane iznimno opasne "vječne kemikalije" (PFAS) i mikroplastika. Gnjev mještana prerastao je u nacionalni bunt kada je građanska inicijativa "Gospić je naš dom" organizirala masovni prosvjed u Zagrebu pod sloganom "Hodaj za Liku, hodaj za Hrvatsku". Deseci tisuća građana preplavili su Trg bana Josipa Jelačića, zahtijevajući od Vlade hitno uklanjanje 37.000 tona opasnog otpada i hitnu sanaciju ličke prirode. Danas se oni koji žive u prvom redu do otpada s pravom pitaju: tko je dopustio da se dvije i pol godine skriva istina o opasnom otpadu? Tko je zakazao u sustavu koji je trebao zaštititi ljude? U Labirintu pod naslovom "Prvi red do otpada" donosimo potresnu priču o ekološkom zločinu, institucionalnoj šutnji i ljudima koji su svojom hrabrošću i upornošću razotkrili uvoznu ekološku bombu.'
- eventId: 1322659
  start: 2026-10-02T14:55:00Z
  stop: 2026-10-02T15:20:00Z
  title: '(Re)kreativac: Stolni tenis'
  subtitle: ' '
  description: Emisija za gledatelje od 7 do 77 koja potiče na bavljenje sportom te objašnjava gdje se, kako i zašto odlučiti za neku sportsku aktivnost. K tome poučava osnovama zdrave (i sportske) prehrane.
