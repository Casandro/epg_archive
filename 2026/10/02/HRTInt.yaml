  title: Izvan formata
  subtitle: ' '
  description: U prvoj emisiji "Izvan formata" nakon ljetne stanke razgovaramo s umjetnicom čije je radove upravo otkupio londonski Tate, a o čijoj se velikoj izložbi u berlinskom Gropius Bau još uvijek govori. Selma Selman, umjetnica rođena u Bihaću, danas živi između New Yorka, Amsterdama i Berlina, no uvijek se vraća svom rodnom gradu i mahali u kojoj je odrasla. Romska zajednica, obitelj i vlastito iskustvo polazišta su njezine umjetničke prakse. U Svetvinčentu smo sa Selmom Selman razgovarali o njezinu performansu za kameru "Prelazak Plavog mosta", ali i o umjetnosti koja nastaje iz života - i životu koji umjetnost može promijeniti. U nastavku emisije gošća nam je Maša Milovac iz udruge Avanti! Centar avangardi, koja je Selmu Selman, ali i brojne druge umjetnike, dovela u mali istarski gradić koji već osam godina pretvara u prostor suvremene umjetničke scene.
