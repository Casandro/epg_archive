  title: Osobnost Plus
  subtitle: Rozhovory s významnými lidmi české společnosti
  description: Darja Stomatová, zpravodajka, Ján Schrüger, kameraman. "Čím déle tam jsem, tím větší mám strach, víc vnímám i ostřelování a nebezpečí, které přichází společně s ním. Občas je těžké ukočírovat vlastní emoce," říká válečná zpravodajka České televize na Ukrajině. Spolu s kameramanem převzala stříbrnou medaili předsedy senátu za otevírání očí a boji proti lhostejnosti. Jak spolu vybírají místa, kam pojedou natáčet a jaký příběh jim zůstane v paměti už napořád? Moderuje Světlana Witowská.
