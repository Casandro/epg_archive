  title: Pro a proti
  description: Rozpočet ve sněmovně. Vláda Andreje Babiše při projednání státního rozpočtu na příští rok některé výdaje snížila, některé zvýšila. Schodek se ale nemění, měl by dosáhnout 386 miliard korun. Je takový dluh odůvodněný investicemi, které návrh obsahuje, jak říká vláda? Nebo jde o neodůvodněné zadlužení, jak tvrdí opozice? Zeptáme se náměstka ministryně financí Petra Macha a předsedy poslaneckého klubu TOP09 Jana Jakoba. Moderuje Lukáš Matoška.
