  description: Lingvistka Kateřina Šormová připravuje budoucí učitele češtiny a zkoumá, jak se český jazyk ve školách učí. Kriticky se dívá na přijímací zkoušky na střední školy, kvůli kterým se žáci učí i pokročilé gramatické znalosti, které pro své další studium nepotřebují. Hovory moderuje Tatiana Čabáková.
