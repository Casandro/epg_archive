  description: Jak se můžou obce bránit takzvané volební turistice, při níž si lidé účelově přehlašují místo trvalého pobytu? Na řadě míst spojí komunální volby příští týden také s lokálními referendy. O čem v nich lidé budou hlasovat? Monstrum z amerického snímku Resident Evil, které se stalo hitem sociálních sítí. Jak ho český choreograf vymyslel? Moderují Renata Kropáčková a Daniela Vrbová.
