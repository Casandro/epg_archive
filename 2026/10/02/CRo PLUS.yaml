  title: Portréty
  subtitle: Profily malých i velkých osobností 20. století
  description: 'Slavné únosy. V roce 1979 zmizel v New Yorku cestou do školy šestiletý Etan Patz. Případ chlapce, který nikdy nebyl nalezen, se stal mediálně proslulým: jeho fotka se jako jedna z prvních objevila v kampani na krabicích mléka. Ve speciálu Portrétů věnovaném slavným únosům příběh, který změnil svět, připomenou Jan Adamec a David Hertl.'
