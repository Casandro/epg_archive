  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (3/10). Po návratu z vězení byl František ještě víc nakloněný soucitu s chudými a vyděděnými. Přesto ještě neztrácí naději, že se stane rytířem. Chystá se na křížovou výpravu, která se nakonec neuskuteční. Františkova konverze se blíží. Podpoří ji pouť do Říma i setkání s malomocným. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
