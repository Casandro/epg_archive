  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Katholische Bischöfe positionieren sich zu Leihmutterschaft, KI und AfD
    Vier Tage lang hat die Deutsche Bischofskonferenz unter Leitung ihres neuen Vorsitzenden Heiner Wilmer über medizinethische Fragen und den Umgang mit Künstlicher Intelligenz beraten. Auf der Tagesordnung stand auch der Austausch über die politischen Folgen der jüngsten Landtagswahlen in Berlin, Mecklenburg-Vorpommern und Sachsen-Anhalt.

    Missbrauch in buddhistischen Gemeinschaften: Neue Anlaufstelle für Betroffene
    Meditationslehrer genießen im Buddhismus große Autorität. Doch wo Verehrung und Abhängigkeit aufeinandertreffen, kann es auch zu Grenzverletzungen kommen. Der Fall Sogyal Rinpoche sorgte 2017 international für Aufsehen; auch die Deutsche Buddhistische Union (DBU) geriet durch den Zen-Lehrer und verurteilten Missbrauchstäter Genpo Döring in den Fokus. Die DBU, der Dachverband vieler Gemeinden, hat nun eine Kommission eingerichtet. Sie soll Betroffenen von sexualisierter Gewalt und Machtmissbrauch eine erste Anlaufstelle bieten.

    NS-Raubgut: Prag zeigt hebräische Bücher aus ganz Europa
    Fast 700 hebräische Bücher lagerten jahrzehntelang vergessen in der Prager Nationalbibliothek - darunter viele aus Deutschland. ...
