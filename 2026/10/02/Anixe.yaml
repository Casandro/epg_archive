  title: ErlebtTV - Vom Glauben zur Heilung - Gott hat mein Vertrauen belohnt
  subtitle: ErlebtTV - Vom Glauben zur Heilung - Gott hat mein Vertrauen belohnt
  description: 'Rebekkah Staudinger erhält im Alter von sieben Jahren die Diagnose Morbus Crohn. Die Erkrankung nimmt einen dramatischen Verlauf und schließlich kann Rebekkah nur noch eine Stammzellenspende helfen. Aber die Entscheidung ist riskant. Martha Moore hat plötzlich starke Schmerzen in den Händen. Behandlungen zeigen kaum Wirkung, man empfiehlt eine OP: Doch Martha hat Angst, dass sie nicht mehr aus der Narkose erwacht. Was wird dann aus ihren Kindern? Todd Dunston möchte mehr Zeit mit seinem Sohn verbringen und gibt deshalb seine gutgehende Tischlerei auf. Diese Entscheidung bringt ihn an den Rand seiner Existenz.  (Moderation: Marzia Plichta / Andreas Waldmann)'
- eventId: 1354233
  start: 2026-10-02T00:29:00Z
  stop: 2026-10-02T00:59:00Z
  title: ERF Mensch Gott - Gott gibts echt! - Beinah ein Star
  subtitle: ERF Mensch Gott - Gott gibts echt! - Beinah ein Star
  description: Ein Star sein und mit eigenen Songs groß rauskommen. Für Laura rückt dieser Traum in greifbare Nähe. Sie erhält einen Major-Label-Vertrag bei Sony Music, arbeitet mit bekannten Produzenten und steht kurz vor dem musikalischen Durchbruch. Doch hinter dem Erfolg bleibt eine tiefe Sehnsucht nach Annahme und Frieden. Gefühle, die sie seit ihrer Kindheit in Liedern verarbeitet. Doch dann kommt der Tag, an dem ihr Leben auseinanderfällt und sie alle Lieder löscht, die sie jahrelang begleitet haben.
- eventId: 1354234
