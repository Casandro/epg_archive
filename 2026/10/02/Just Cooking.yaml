- eventId: 1338052
  start: 2026-10-02T13:45:00Z
  stop: 2026-10-02T13:53:00Z
  title: Mein wunderbarer Kochsalon - Gefüllte Paprika
  subtitle: Mein wunderbarer Kochsalon - Gefüllte Paprika
  description: 'Jetzt kann ich es ja sagen: Ich mag keine Paprika. Der Geschmack ist nicht meiner und er legt sich noch dazu über alles drüber. Als Christian Domschitz (Restaurant Vestibül) sich im Kochsalon ansagte und ankündigte, gefüllte Paprika zu kochen, verkniff ich mir ein Veto. Es ist und bleibt ein beliebter österreichischer Klassiker, der trotz meiner Aversion seine Berechtigung hat. Dann kam der Chef, füllte Faschiertes, Reis, weiße Bohnen, Zucchini, Melanzani und Kräuter in frische, dünnwandige Schoten und ich war bekehrt. Der gefüllte Paprika und ich, das wird noch etwas. AT 2020'
- eventId: 1338053
  start: 2026-10-02T13:55:00Z
  stop: 2026-10-02T14:00:00Z
  title: Mein wunderbarer Kochsalon - Zitronenlachs mit Pico de Gallo
  subtitle: Mein wunderbarer Kochsalon - Zitronenlachs mit Pico de Gallo
  description: 'Ehrlich gesagt dachte ich immer, der Airfryer ist nur für Pommes frites gut. Und dafür wollte ich kein eigenes Gerät haben. Ha! Blankes Vorurteil, diesmal habe ich Fisch darin ausprobiert, dieses Automatik-Programm mit dem Sensor, der die Zeit selbst festlegt, hat mich gereitzt. Zurecht, der Fisch war außen knusprig und innen zart und saftig. Was will ich mehr? Dafür muss natürlich die Basis passen. Ich habe mir online österreichischen Fisch bestellt: Michis frische Fische aus dem Mürztal, kommt per Post, superfrisch und in Top-Qualität. Es gibt da sogar Branzino und Gebirgsgarnelen. Die kommen das nächste Mal dran. AT 2020'
- eventId: 1338054
  start: 2026-10-02T14:00:00Z
  stop: 2026-10-02T14:08:00Z
  title: Mein wunderbarer Kochsalon - Zucchiniblüten mit Waldpilzen und Getreide
  subtitle: Mein wunderbarer Kochsalon - Zucchiniblüten mit Waldpilzen und Getreide
  description: Ich hatte schon ein bisschen Bedenken, oder nennen wir es Respekt, Heinz Reitbauer in den Kochsalon einzuladen. Der Mann trägt vier Hauben, ist "Koch des Jahrzehnts" und hat eine Entourage von 30 bis 40 best ausgebildeten Köchen in seiner Küche. Was passiert, wenn ich das übernehme? Gut ist's gegangen, nichts ist geschehen - im Gegenteil, wir kochten gemeinsam dieses fabelhafte Gemüsegericht. AT 2017
