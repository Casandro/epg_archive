  description: 'Brownies sind für meine Kinder der Inbegriff von einer süßen Belohnung. Dieser saftige, schokointensive Teig lässt sie bei jedem Bissen schwelgend die Augen schließen, bedächtig den Kopf schütteln und schweigend genießen. Und das passiert nicht oft. Genau genommen nie. Wenn ich also ein bisschen Ruhe brauche: Brownies backen. Ich habe sie diesmal im Airfryer gemacht, das Rezept funktioniert natürlich auch im normalen Ofen, im Airfryer werden sie nur außen knuspriger. AT 2020'
