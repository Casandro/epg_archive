  subtitle: Mein wunderbarer Kochsalon - Huhn à la Bier vom Grill
  description: Eigentlich wollte ich ja ein Brathuhn im Ofen machen. Aber nachdem das Wetter so schön war, eröffneten wir die Grillsaison schon Mitte April und ich kam endlich dazu, das längst fällige Bierhuhn zu probieren. Man stülpt das Huhn über eine Dose Bier und stellt es so in den Griller. Die Dose am Grill war mir unsympathisch, aber es gibt unbedenkliche Vorrichtungen als Alternative. Das Ergebnis war mehr als überzeugend. AT 2020
