  title: Die besten Köche der Welt - Zu Gast im Ikarus - David Klinch
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - David Klinch
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: David Kinch gilt als Erfinder der neuen zeitgenössischen Küche Kaliforniens. In seinem Restaurant Manresa, eine Stunde südlich von San Francisco, vereint er ein tiefes Verständnis der klassischen Küche mit der Offenheit, alles zu probieren. Er scheut es, sein Essen zu kategorisieren, räumt aber ein, dass die komplexe Einfachheit, fast kein Fett zu verwenden, einen gewissen japanischen Einfluss verrät. Das Wichtigste an einem Gericht ist für ihn das Gleichgewicht. Aus Kreativität und Technik bis hin zum Genuss beim Essen selbst. Erneut eine spannende Herausforderung für das gesamte Küchenteam des Restaurants Ikarus im Salzburger Hangar-7. AT 2018'
- eventId: 1338056
  start: 2026-10-02T14:40:00Z
  stop: 2026-10-02T15:05:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Niederlande
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Niederlande
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im November 2018 empfängt das Restaurant Ikarus ein renommiertes Koch-Quartett aus den Niederlanden und bringt mit 8 Michelin-Sternen eine außergewöhnliche Fülle an Erfahrung und Flair in den Hangar-7. Jeder hat seine eigene Nische in der niederländischen Küche geschaffen und entwickelt seinen eigenen, unnachahmlichen Stil mit den besten Zutaten, die die Niederlande zu bieten haben. Jannis Brevet verbindet gekonnt Delikatessen aus See und Land und schafft zwischen ihnen ein harmonisches Gleichgewicht. Jacob Jan Boerma, gebürtiger Vorarlberger, gilt als Meister der Aromen und eröffnet mit seinen Gerichten ganz neue Geschmackserlebnisse. Richard van Oostenbrugge hatte 2015 bereits einen Solo-Auftritt im Ikarus, er weiß die klassische französische Küche lebendig zu gestalten. Der Vierte von der Partie ist Michael van der Kroft, der ehemalige BMX-Profi hat sich unfassbar schnell an die Spitze der niederländischen Küche gekocht und schreckt nicht vor ungewöhnlichen Zutaten oder Kombinationen zurück. Um die Gerichte aller vier Starköche zu erlernen, reist Martin Klein, Executive Chef des Hangar-7, diesmal mit Team in die Niederlande. AT 2018'
- eventId: 1338057
  start: 2026-10-02T15:10:00Z
  stop: 2026-10-02T15:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Julien Royer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Julien Royer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: In Singapur isst man nicht, um zu überleben, man lebt um zu essen! Dieses genussfreudige Klima weiß Chef Julien Royer im Restaurant Odette zu nutzen. Benannt nach Royers Großmutter, steht das Odette für französische Küche mit Herz und Raffinesse. Doch auch die Einflüsse des Schmelztiegels Singapur sind allgegenwärtig: etwa in Gerichten wie Gänseleber á la Pho oder Steinbutt Esprit Thai. Um diese multikulturelle Küche im Restaurant Ikarus authentisch umsetzen zu können, taucht Martin Klein tief ein in die kulinarischen Verlockungen Singapurs: nicht nur die 2-Sterne-Küche des Odette wird genau erforscht, es geht auch hoch hinauf in die höchstgelegene Cocktailbar der Stadt und tief hinunter in ihre wuselnden Foodcourts.  AT 2018'
