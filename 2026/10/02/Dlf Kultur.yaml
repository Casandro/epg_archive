  description: "Kultur und Politik am Morgen\nMit Buchkritik und Neue Krimis\nModeration: Ramona Westhof\n05:50-05:54 Aus den Feuilletons\n\n06:00-06:05 Nachrichten\n\n06:20-06:23 Wort zum Tage\nDiakon Tobias Petzoldt, Berlin\nEvangelische Kirche\n\n06:30-06:33 Nachrichten\n\n07:00-07:05 Nachrichten\n\n07:20-07:24 Politisches Feuilleton\n\n07:30-07:33 Nachrichten\n\n07:40-07:45 Alltag anders\nVon Matthias Baxmann und Matthias Eckoldt\n\n07:50-07:58 Interview\n\n08:00-08:05 Nachrichten\n\n08:30-08:33 Nachrichten\n\n08:50-09:00 1001 Nacht\nNacht 109/121: Badr im Liebestaumel \n\nFür König Badr geht ein Traum in Erfüllung: 40 Tage und Nächte vergnügt er sich mit Königin Lab. Sie essen, trinken, lieben sich, und Badr vergisst den Kummer der Fremde. Nirgends sonst will er sein. Am nächsten Morgen ist die Königin fort.\n\nNach der Neuübersetzung von Claudia Ott\nAuswahl der Geschichten: Safiye Can\nHörspielbearbeitung und Storytelling: Judith Lorentz, Roxana Samadi\nMit Roxana Samadi, Jasmin Shakeri, Susana AbdulMajid\nBesetzung: Kathi Bonjour\nRegieassistenz: Vanessa Gräfingholt, Delia Lang\nExpertin für Arabisch: Heba Tebakhi\nÜbersetzung und philologische Beratung: Claudia Ott\nCopyright der Übersetzung: Verlag C. H. ..."
