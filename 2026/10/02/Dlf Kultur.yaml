  title: Lange Nacht
  description: |-
    Ein Land an der Küste
    Die Lange Nacht der tschechischen Literatur
    Moderation: Marianne Allweiss und Jörg Plath
    Regie: Hans Dieter Heimendahl
    Aufzeichnung vom 01.10.2026, Comedia Theater, Köln

    Stellvertretend für Gegenwartsliteratur aus Tschechien werden in der Langen Nacht im Comedia Theater in Köln zu erleben sein: Radka Denemarková ("Schokoladenblut"), Miroslav Hlauèo ("Pfingsten"), Alice Horáèková ("Geteiltes Haus"), Dora Kaprálová ("Die Mariborhypnose"), Jaroslav Rudis ("Wo die Toten sprechen") und Jáchym Topol ("Die Hölle gibt es nicht"). Es moderieren Marianne Allweiss und Jörg Plath. Die Gespräche werden simultan gedolmetscht von Nelly Nitra. Es lesen Christiane Nothofer und Jona Mues.
