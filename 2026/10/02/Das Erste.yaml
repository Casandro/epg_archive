  description: 'Dass ihr Kollege Borko ungewöhnlich früh das Büro verlässt und kurz darauf Zeuge eines Mordanschlags wird, ruft bei Chefermittlerin Stascha Novak zunächst wenig Beachtung hervor. Das Opfer, der zwielichtige Investmentbanker Rogur, wurde im Auto mit einer Handgranate in die Luft gesprengt. Während die Mordkommission Split ihre Arbeit aufnimmt, weiß Polizeichef Kovacic bereits, wo auf Rogurs Tod angestoßen wird: bei einem geheimen Stammtisch von Kriegsveteranen. Seine tiefere Kenntnis über das Opfer behält Kovacic allerdings für sich.'
