- eventId: 1379285
  start: 2026-10-02T19:00:00Z
  stop: 2026-10-02T19:49:00Z
  title: Muzikál expres
  description: Jak si vedou Cenami Tony ověnčené muzikály Broadwaye v divácké úspěšnosti? Na tuto otázku odpoví příští Muzikál expres. Zmínka bude úspěchu muzikálu Ďábel nosí Pradu v Londýně a o chystanému uvedení Fantoma Opery v Šanghaji. Druhá část bude věnována Jiřímu Suchému, který počátkem října oslavuje 95. narozeniny. Zazní přitom skladby ze Zlaté éry Semaforu. Mimo jiné melodie z inscenací Dobře oplacená procházka a Jonáš a tingl-tangl. Připravili Michael Prostějovský a Pavel Bár. Repríza z 27.9.
