- eventId: 1379287
  start: 2026-10-02T20:00:00Z
  stop: 2026-10-02T20:30:00Z
  title: Četba na pokračování
  description: 'Alena Mornštajnová: Čas vos (14/14). Bářin život se nevyvíjel podle jejích představ a směr, který nabral, si sama nevybrala. Minulost už se napravit nedá, staré křivdy stále bolí, ale je třeba bojovat, aby se člověk dobral spravedlnosti a nenechal si vše líbit. Ani s Ptáčníkem se život nemazlil, stal se z něho samotář a podivín, který miluje víc ptáky než lidi. Když se jejich osudy protnou, ani jeden z nich netuší, kolik toho mají ve skutečnosti společného a jak moc si můžou navzájem pomoci. Pro rozhlas připravila Anna Smrčková. Dramaturgie Marina Feltlová. Účinkují Andrea Elsnerová a Kamil Halbich. Režie Dimitrij Dudík. Premiéra.'
- eventId: 1379288
  start: 2026-10-02T20:30:00Z
  stop: 2026-10-02T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Alžběta Josefy, malířka a hudebnice. Jak se písek dovezený z Ománu dostal do jejího obrazu Zóna? Co ji po osmi letech intenzivní výtvarné práce přivedlo zpět ke zpěvu a etnickým perkusím? A proč se bude finální zvuk jejího debutového alba hledat právě ve Švýcarsku? Moderuje Vasil Fridrich.'
