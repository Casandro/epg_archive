  title: Hubert ohne Staller (147)
  subtitle: Die letzte Reise
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: 'Hubert und Girwidz machen bei der Kontrolle eines vollbesetzten Reisebusses einen grausamen Fund: Im Gepäckfach liegt der erschlagene Reiseleiter, der die Touristen nach Neuschwanstein hätte begleiten sollen. Als der Busfahrer Max Schmieder flüchtet, ist das für die beiden Polizisten ein eindeutiges Schuldeingeständnis und der Fall geklärt, doch dann liefert Schmieder nach seiner Festnahme ein einwandfreies Alibi. Die Suche nach dem Mörder beginnt von vorn und führt Hubert und Girwidz in das familiengeführte Busunternehmen. Unter der glänzenden Oberfläche der Firma kommt mafiös-kriminelles Verhalten zum Vorschein.'
