  title: Kommissar Freytag (1)
  subtitle: Indiz im Schulterblatt
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: "Heinz Rogatzky trägt seit Jahren eine Kugel in der Schulter. Der Röntgenarzt sieht die Kugel auf dem Schirm und empfiehlt, sie zu entfernen. \nRogatzky reagiert heftig. Der Arzt schöpft Verdacht und verständigt die Kriminalpolizei. Bei der Überprüfung stellt sich heraus, dass Rogatzky dringend verdächtig ist, an einem Sparkassenüberfall beteiligt gewesen zu sein. Die Überführung des Täters bereitet Kommissar Freytag einiges Kopfzerbrechen."
- eventId:
  - 543937
  - 801382
  start: 2026-10-02T01:45:00Z
  stop: 2026-10-02T02:05:00Z
  title: Kommissar Freytag (2)
  subtitle: Nur ein Verkehrsunfall
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Im Morgengrauen findet eine Zeitungsfrau im Vorgarten der Villa Strauch eine Leiche. Wenig später trifft Kommissar Freytag mit seinem Stab am Tatort ein, um Spuren zu sichern: Glassplitter, Reifenabdrücke, Gewebefetzen von der Hose des Toten, die Zierleiste eines Autos. Also: Verkehrsunfall mit tödlichem Ausgang. Der Fahrer ist geflüchtet. Ein weiteres Beweisstück wird völlig zerbeult aus einer Kiesgrube geschleppt: der Wagen des Täters. Er gehört einem Architekten, der behauptet, der Wagen sei ihm am Abend der Tat gestohlen worden - eine Behauptung, der Kommissar Freytag misstraut und die er zu erschüttern versucht.'
