  title: Firma Hesselbach (1)
  subtitle: Das Dokument
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: Vater Hesselbach ist Direktor einer Verlagsdruckerei und Herausgeber der "Weltschau am Sonntag". Das "Dokument" ist ein Druckauftrag über Reklamebroschüren, den Vater Hesselbach als einen geschäftlichen Erfolg betrachtet. Umso wütender ist der Herr Direktor, als das Schreiben, mit dem der Auftrag erteilt wurde, plötzlich verschwunden ist, gerade als er es für einen Kredit bei seiner Bank vorlegen will. Der Betrieb wird auf den Kopf gestellt, jeder Papierkorb durchwühlt, und selbst das Verhör aller Angestellten fördert das Dokument nicht zutage - bis schließlich Mutter Hesselbach die Angelegenheit sehr überraschend aufklären kann.
