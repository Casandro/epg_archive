  title: Podróże z historią 2 (odc. 32)
  subtitle: Radosław Kotarski jedzie na południe Polski, by przespacerować się po galicyjskich rynkach. Zagląda do warsztatów rzemieślniczych i zakładów usługowych, aby przyjrzeć się życiu w dawnej Małopolsce.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Dlaczego ludzie w Małopolsce wciąż odczuwają sentyment do czasów zaboru austriackiego? Skąd w ich domach pojawiały się portrety cesarza Franciszka Józefa? Galicja to sztucznie wymyślona kraina, w której odnajdziemy mnóstwo sprzeczności. Radosław Kotarski wyrusza na południe Polski, aby przespacerować się po galicyjskich rynkach. Zagląda do warsztatów rzemieślniczych i usługowych, aby przyjrzeć się życiu w dawnej Małopolsce. Sprawdza też, dlaczego o krakusach mówi się centusie.
  genre:
  - '149'
