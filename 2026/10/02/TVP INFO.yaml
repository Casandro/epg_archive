  title: Polskie parki narodowe
  description: |-
    serial dokumentalny (Polska, 2022), Park Narodowy Ujście Warty
    Dariusz Gross przedstawi parki narodowe w Polsce od zupełnie innej strony. Ukaże tajniki pracy naukowców, którzy badają nieodkryte dotąd tajemnice ekosystemów i starają się zachować je dla przyszłych pokoleń. Zaprezentuje także niecodzienne oblicze przyrody oraz wskaże wyjątkowość każdego z polskich parków narodowych.
