  title: 'Oasen - Inseln des Lebens: Ein Traum von 1001 Nacht'
  subtitle: Film von Daniela Pulverer
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Mitten in der endlosen Weite der ägyptischen Sahara liegt ein Ort wie aus einem Märchen: Siwa, eine grüne Oase, in der Leben gegen jede Wahrscheinlichkeit gedeiht.

    Aus Hunderten Quellen sprudelt Wasser aus dem Wüstenboden - ein Naturwunder, das seit Jahrtausenden Menschen, Pflanzen und Tiere nährt. Über 200.000 Dattelpalmen recken sich dort in den Himmel, gespeist von fossilem Wasser, das seit 40.000 Jahren unter der Erde ruht.
    HD-Produktion
- eventId:
  - 798635
  - 798814
  start: 2026-10-02T01:50:00Z
  stop: 2026-10-02T02:35:00Z
  title: 'Oasen - Inseln des Lebens: Die Perle des Pazifiks'
  subtitle: Film von Daniela Pulverer
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Moorea, die Nachbarinsel Tahitis, liegt wie ein grünes Juwel im Südpazifik: ein längst erloschener Vulkan mit von tropischem Regenwald bewachsenen Gipfeln, umringt von einem Korallenriff.

    Trotz der extremen Abgeschiedenheit von den nächsten Festlandküsten haben hier Pflanzen, Tiere und Menschen über Millionen von Jahren eine fragile, aber vielfältige Lebensgemeinschaft geschaffen. Schon unter Wasser beginnt das Wunder.
    HD-Produktion
