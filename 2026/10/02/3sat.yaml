  description: |-
    Deutschland 2026
    KI: Chance oder Kontrollverlust? - Humanoide Roboter erleichtern den Alltag, doch KI-Agenten könnten schon bald kritische Infrastruktur gefährden. Selbst führende Köpfe der KI-Branche warnen vor Missbrauch und Kontrollverlust. Gleichzeitig locken Milliarden und enorme wirtschaftliche Chancen. Ist KI ein Segen für die Menschheit oder ein unkalkulierbares Risiko?

    Gletscher: Eisverlust im Rekordtempo - Das Abschmelzen der Schweizer Gletscher war 2026 extrem: Mehr als fünf Prozent des Eises sind verschwunden. In den vergangenen fünf Jahren sank das Eisvolumen um fast 20 Prozent. Auf dem Rhône-Gletscher zeigt ein Gletscherforscher, was die aktuellen Ergebnisse des Schweizer Gletscherzustandsberichts bedeuten.

    Amazonas: Hightech gegen Abholzung - Satellitenüberwachung, künstliche Intelligenz und konsequente Kontrollen zeigen Wirkung: Die Abholzung im brasilianischen Amazonasgebiet ist in den vergangenen Jahren deutlich zurückgegangen. Fachleute überwachen täglich Millionen Quadratkilometer Regenwald. Ob der Kurs anhält, hängt entscheidend vom politischen Willen nach der Präsidentschaftswahl am kommenden Sonntag ab.

    Wie Bäume miteinander sprechen - Können Bäume miteinander "sprechen"? Das viel zitierte "Wood Wide Web" ist wissenschaftlich nicht belegt. Fest steht jedoch: Bäume tauschen Informationen aus, etwa über chemische Botenstoffe in der Luft. Forschende wollen entschlüsseln, wie Bäume auf Schädlinge reagieren, und warnen zugleich davor, das komplexe Ökosystem Wald zu vermenschlichen.

    Moderation: Yve Fehring
    HD-Produktion
