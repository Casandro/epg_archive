  description: |-
    m Süden Perus zieht sich eine ungewöhnliche Schlucht durch die karge Bergwelt der Hohen Anden: der Colca-Canyon. Über Jahrmillionen hat sich der Fluss in das Vulkangestein gefräst.

    Mit etwa 3200 Metern ist er heute fast doppelt so tief wie der Grand Canyon. Umrahmt von Vulkanen, die mehr als 6000 Meter in den Himmel ragen, ist das Tal von trockenen Hochebenen, steinigen Steilhängen und abweisenden Kakteen geprägt.
