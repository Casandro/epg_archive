    Darsteller:
    Sonja Wigert - Ingrid Bolsø Berdal
    Josef Terboven - Alexander Scheer
    Thorsten Akrell - Rolf Lassgård
    Andor Gellert - Damien Chapelle
    Joseph Goebbels - Stefan Sattler
    Regie: Jens Jonsson

