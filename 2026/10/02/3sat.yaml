  title: Eine Geschichte des heimlichen Widerstands
  subtitle: Film von Anita Lackenberger
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Verfolgung der Jesuiten in Tirol unter den Nationalsozialisten ist ein kaum beleuchtetes Kapitel der österreichischen Geschichte. Sie wurden enteignet und vertrieben.

    Die Dokumentation zeigt, wie sie ins Visier der Nazis gerieten. Sie beleuchtet aber auch den heimlichen Widerstand der Jesuiten und erzählt die Geschichte einer fast vergessenen Frau, die sich mit Zivilcourage mutig gegen die Verfolgung der Jesuiten stellte.
