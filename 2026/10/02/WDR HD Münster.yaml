- eventId: 561322
  start: 2026-10-02T12:20:00Z
  stop: 2026-10-02T13:10:00Z
  title: Rentnercops - 32. Bankgeheimnis
  subtitle: Deutschland 2018
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: |-
    Edwin und Günter stehen vor einem Rätsel: Im Kofferraum einer Supermarkteinkäuferin findet sich ein toter Banker, der eigentlich zur selben Zeit in einem Flugzeug sitzen sollte. Jedenfalls hat er für einen Flug nach Irland bereits eingecheckt, wie die Bordkarte zeigt, die man bei ihm findet. Wie ist er dann in diesen Kofferraum gekommen?

    Weitere Recherchen durch Hui bringen an den Tag, dass der Tote häufiger Gast in einem Domina-Studio war - für Günter eine sehr fremde Welt. Hat sein Tod mit dieser Vorliebe des Bankers zu tun? Oder doch eher mit seinen Bankgeschäften?
- eventId: 561323
  start: 2026-10-02T13:10:00Z
  stop: 2026-10-02T14:00:00Z
  title: Rentnercops - 33. Willkommen im Chaos
  subtitle: Willkommen im Chaos
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: |-
    Das Kommissariat muss umziehen - zum großen Leidwesen von Günter und Edwin. In den neuen Büros herrscht das pure Chaos, die Büroeinrichtung fehlt und die Computer funktionieren nicht. So kommt es, dass eine Akte über den tödlichen Autounfall einer Biotech-Unternehmerin versehentlich bei Günter und Edwin landet.

    Um der Unordnung zu entfliehen, kümmern sie sich um den Fall, der eigentlich nicht in ihren Bereich fällt. Auch Hui Ko beschäftigt sich mit einer Akte, die versehentlich bei ihm landet: Aus einem Zoogeschäft wurden giftige Spinnen gestohlen.
