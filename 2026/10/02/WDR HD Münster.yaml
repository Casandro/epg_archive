  subtitle: Little Britain in der Eifel
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: "Dreifach-Mama Kai Judith Wetzel lädt in die Nordeifel in ihren Staudengarten mit Laube, Feuerstelle und vielen selbst gemachten Keramiken. Ihre große Liebe gilt England und der dortigen Gartenkultur. \nAuch beim Fest möchte sie ihr Thema \"Little Britain in der Eifel\" einfließen lassen: so serviert sie Tee, Scones und Sandwiches, aber auch selbst gemachten rosa Holundersirup aus dem Garten, sowie bodenständige Eifeler Knudeln (eine Art Gnocchi aus Mehlnocken) als Vorspeise und zum Hauptgang einen Eifeler Rehrücken. Zum Dessert gibt es Eton Mess, Devil's Delight und Sticky Toffee Pudding."
