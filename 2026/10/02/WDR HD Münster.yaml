  title: Sabine Heinrich - Auf dem Wasser durch NRW (1/4)
  subtitle: Vom Rursee zum Rhein
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In der Auftaktfolge erlebt Sabine Heinrich die morgendliche Stille auf dem Rursee und kämpft mit ihrer Angst vor Fischen. Am Zülpicher See entdeckt sie einen echten Palmenstrand, paddelt mit Hund die Erft entlang und kreuzt schließlich mit einem Segelboot den Rhein.
    Die Sendung zeigt, wie abwechslungsreich die Wasserwege in der Region sind - vom Wassersportsee Zülpich bis zur Schifffahrtsroute auf dem Rhein. Gleichzeitig erzählt sie persönliche Geschichten von Menschen, die am und auf dem Wasser arbeiten, leben und träumen.
