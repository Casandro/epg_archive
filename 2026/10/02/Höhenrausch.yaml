  title: Faszination Heimat - Jagd - Die Steinbockjäger
  subtitle: Faszination Heimat - Jagd - Die Steinbockjäger
  description: Seit 70 Jahren erst gibt es Steinböcke in den Berchtesgadener Alpen. Seit einiger Zeit hält sich ein unglaubliches Gerücht - einige Steinböcke sollen sogar in der extrem steilen Watzmann Ostwand leben. Gesehen hat sie aber dort noch niemand. Die beiden Dokumentarfilmer und Extremkletterer Max Reichl und Franz Hinterbrandner wollen die Steinböcke in der Ostwand aufzuspüren. Damit hätten sie geschafft, was noch keinem vor ihnen gelungen ist...  AT 2013
- eventId: 1332602
  start: 2026-10-02T01:40:00Z
  stop: 2026-10-02T02:27:00Z
  title: Heimatleuchten - Das Kärntner Rosental - Bienen, Büchsen & Pohaca
  subtitle: Heimatleuchten - Das Kärntner Rosental - Bienen, Büchsen & Pohaca
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 1332603
  start: 2026-10-02T02:30:00Z
  stop: 2026-10-02T02:35:00Z
  title: Mit dem Motorrad durch Südvietnam - Teil 1
  subtitle: Mit dem Motorrad durch Südvietnam - Teil 1
  description: Wir schwingen uns auf unsere Motorräder und machen uns auf den Weg durch Vietnam. Vorbei an Reisefeldern, riesigen Staudämmen und einer unerwarteten Dorf-Party, fahren wir von Ho Chi Minh immer in Richtung Norden nach Hanoi.  DE 2019
