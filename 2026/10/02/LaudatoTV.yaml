  title: Superknjiga
  subtitle: Animirani
  description: Tijekom obiteljskog kampiranja Luka potpuno ignorira pravila i dovodi do toga da se on, Ela i Gizmo nađu zatočeni u mračnoj pećini. Superknjiga odvodi djecu u vrijeme kad se Mojsije popeo na planinu kako bi razgovarao sa Bogom. Izraelci, ostavljeni bez pravila, upadaju u moralni kaos koji prijeti uništenju sklada unutar kampa. Mojsije donosi deset zapovijedi a Luka uči lekciju važnosti poštivanja pravila. Superknjiga vraća djecu u pećinu, a Lukino tek zadobiveno razumijevanje o tome koliko je bitno slijediti pravila u šumi, pomaže da ipak dođe do sretnog završetka kampiranja obitelji Kvantum.
