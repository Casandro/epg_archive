  title: ArtCafé
  description: 'Jak to jenom říct? ArtCafé o inventuře osobních, rodinných i kolektivních historií. Novinářka Barbora Postránecká představuje svůj nový knižní rozhovor s psychoterapeutkou a disidentkou Věrou Roubalovou. Herečka Hana Krobotová Doulová mluví o nově vydané knížce Kuš, svině aneb Štika v letu, která vychází z korespodence jejích rodičů. Divadelník Roman Poliak popisuje sebeironický divadelní paradokument Inventura, který je pokusem o participativní zpracování historie skupiny Unkulunkulu. Moderuje Tereza Lišková. E-mail: artcafe@rozhlas.cz'
