  title: Vizitka
  description: 'Rostislav Koryčánek, architekt. "Panelové sídliště je největší československý experiment," říká teoretik a historik architektury Rostislav Koryčánek. V sérii Betonový lidi na Vltavě se dívá na panelová sídliště jako na mnohem víc než jen na soubor betonových domů. Snaha postavit co nejvíc bytů v co nejkratším čase a co nejúsporněji podle něj proměnila nejen stavebnictví, architekturu a urbanismus, ale také průmysl, který měl nové byty vybavit. Sídliště se navíc stala svébytným kulturním a společenským prostředím. Jaké vize se za jejich výstavbou skrývaly - a co z nich zůstalo dnes? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
