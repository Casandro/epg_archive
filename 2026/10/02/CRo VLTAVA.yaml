  description: Proměny oscarové hudby v letech 2011 - 2020. Ceny Akademie se letos předávaly už po sedmadevadesáté. Vkus akademiků vybírajících vítěze z pěti nominovaných se vyvíjí ve všech kategoriích včetně nejlepší původní hudby a nezřídka překvapí. Mezi oscarové skladatele druhé dekády nového tisíciletí patří třeba Mychael Danna, Atticus Ross a Trent Reznor, ale i třetí žena v oscarové historii skladatelek Hildur Gudnadóttir. Nejen ty v pořadu představí Kristýna Šrámková.
