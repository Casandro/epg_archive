  subtitle: Alltag, Drogen, Nightlife
  description: |-
    Das Frankfurter Bahnhofsviertel ist ein Ort der Gegensätze: Zwischen Drogenelend und Designer-Bars, Subkultur und Gentrifizierung, internationalem Flair und sozialem Brennpunkt.

    Rund 4000 Menschen leben hier. Das nur 0,5 Quadratkilometer große Gebiet schreckt manche Passanten ab, zieht aber viele auch magisch an.

    Die 19-jährige Anabelle hat ihr Hobby Tanzen zum Beruf gemacht und einen Job als Stripperin angenommen. Wie funktioniert das Geschäft mit dem Körper? Wie groß ist die Gefahr, auf die "schiefe Bahn" zu geraten? Angst hat sie im Bahnhofsviertel nicht. Sie sagt: "Klar muss man als Frau aufpassen, aber das muss man überall."
