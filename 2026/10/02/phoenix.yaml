  description: 'London 1939, über ein Jahrzehnt wird es noch dauern, bis der Brite Ian Fleming mit James Bond die bekannteste Agentenfigur der Welt erschafft. Lange gilt Fleming als das schwarze Schaf seiner Familie. Er ist dem Alkohol, Glücksspiel und den Frauen zugeneigt, bis er seine Bestimmung findet: als Spion im Geheimdienst Seiner Majestät im Krieg gegen die Nazis. Mit Hilfe von Interviews und animierten Spielsequenzen beleuchtet der Film die kaum bekannten wahren Ereignisse, gefährlichen Missionen und psychischen Abgründe, die sich hinter der Filmikone 007 und ihrem Schöpfer Ian Fleming verbergen.'
