  title: Die wilden Flüsse Afrikas
  subtitle: Sambesi
  widescreen: true
  hd: true
  description: |-
    Der Sambesi hat viel mehr zu bieten als die bekannten Viktoriafälle. Auf seinem rund 2600 Kilometer langen Weg durchströmt er Gebirge, Buschland und Sumpfgebiete.
    Hier lassen sich Elefanten, Wasserbüffel und Geparden beobachten. Auch bunte Bienenfresser und flinke Gibbons wohnen an den Ufern des wilden Sambesi. Afrikas Flüsse sind so unterschiedlich wie faszinierend.
