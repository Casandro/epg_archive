  title: Was die Welt besser macht
  subtitle: Alles neu. 00er  20er
  widescreen: true
  hd: true
  description: Seit fast 300 Jahren ist die Gleichheit vor dem Gesetz ein Menschenrecht. Selbstverständlich ist sie noch immer nicht. Der Wissenschaftsjournalist Mirko Drotschmann begibt sich auf eine Zeitreise und fragt, wie eine gerechte Welt funktionieren kann. Gerechtigkeit ist einer der wichtigsten Schlüssel für eine bessere Welt ohne sie kommt es fast unweigerlich zu Konflikten, die ein Leben in Frieden und Freiheit unmöglich machen.
