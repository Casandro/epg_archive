  title: Was die Welt besser macht
  subtitle: Ick steh auf Berlin. 80er/90er
  widescreen: true
  hd: true
  description: Die Vereinten Nationen wurden nach dem Zweiten Weltkrieg mit dem Ziel gegründet, den Weltfrieden zu wahren. Doch ist Frieden überhaupt möglich? Jahrhundertelang war Europa das größte Schlachtfeld der Erde. Nach dem Zweiten Weltkrieg schien sich endlich Frieden durchzusetzen doch spätestens der Krieg in der Ukraine beendete diese Phase. Mirko Drotschmann geht der Frage nach, wie sich die Vorstellung von Frieden im Lauf der Geschichte verändert hat. Wann begann sich die Gewaltspirale zu drehen und wie lässt sie sich stoppen? Sind Menschen von Natur eher kriegerisch oder friedlich gesinnt?
- eventId:
  - 1186072
  - 1186619
  start: 2026-10-02T01:00:00Z
  stop: 2026-10-02T01:45:00Z
  title: Was die Welt besser macht
  subtitle: Freiheit
  widescreen: true
  hd: true
  description: Freiheit kaum ein Begriff ist so allgegenwärtig und doch so schwer zu fassen. Es ist ein Gefühl, nach dem fast alle Menschen streben. Mit Freiheit bezeichnet man meist die Möglichkeit, das eigene Leben frei zu gestalten und sich ohne Einschränkungen bewegen zu können. Im Namen der Freiheit werden blutige Kriege geführt, Revolutionen bringen Massen auf die Straße. Es ist ein weiter Weg, bis Freiheit als Grundrecht aller Menschen gilt. Der Wissenschaftsjournalist Mirko Drotschmann reist durch Europa und nach New York, um den Weg der Freiheit von der Antike bis heute aufzuzeigen.
- eventId:
  - 635497
  - 798754
  start: 2026-10-02T01:45:00Z
  stop: 2026-10-02T02:30:00Z
  title: Was die Welt besser macht
  subtitle: Alles neu. 00er  20er
  widescreen: true
  hd: true
  description: Seit fast 300 Jahren ist die Gleichheit vor dem Gesetz ein Menschenrecht. Selbstverständlich ist sie noch immer nicht. Der Wissenschaftsjournalist Mirko Drotschmann begibt sich auf eine Zeitreise und fragt, wie eine gerechte Welt funktionieren kann. Gerechtigkeit ist einer der wichtigsten Schlüssel für eine bessere Welt ohne sie kommt es fast unweigerlich zu Konflikten, die ein Leben in Frieden und Freiheit unmöglich machen.
- eventId:
