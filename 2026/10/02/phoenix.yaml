  subtitle: Wo sich zwei Meere treffen
  description: |-
    Der Ort, wo zwei Meere zusammenfließen. Ein Film über einen Kite-Surfing-Geheimtipp in Lettland, Fischer und ihre Traditionen, kulinarisch Schräges und der Abschied vom Sommer

    Was den Ort besonders macht, ist das: vom Strand aus gesehen ist links die offene Ostsee, rechts die Rigaer Bucht. Hier fließen zwei Meere zusammen, sagen die Einheimischen. Am Kap Kolka, im Nordwesten Lettlands. Es gilt schon längst als ein Geheimtipp für Ruhesuchende. Aber Renars und seine Freunde suchen den Kick.
