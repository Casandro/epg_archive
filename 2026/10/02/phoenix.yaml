  start: 2026-10-02T01:00:00Z
  stop: 2026-10-02T01:45:00Z
  title: Was die Welt besser macht
  subtitle: Freiheit
  widescreen: true
  hd: true
  description: Freiheit kaum ein Begriff ist so allgegenwärtig und doch so schwer zu fassen. Es ist ein Gefühl, nach dem fast alle Menschen streben. Mit Freiheit bezeichnet man meist die Möglichkeit, das eigene Leben frei zu gestalten und sich ohne Einschränkungen bewegen zu können. Im Namen der Freiheit werden blutige Kriege geführt, Revolutionen bringen Massen auf die Straße. Es ist ein weiter Weg, bis Freiheit als Grundrecht aller Menschen gilt. Der Wissenschaftsjournalist Mirko Drotschmann reist durch Europa und nach New York, um den Weg der Freiheit von der Antike bis heute aufzuzeigen.
- eventId:
