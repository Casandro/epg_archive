  title: Kriminálka
  description: 'Klíčové důkazy - Dívka, která se rozhodla skočit z Karlova mostu a muž, který se oběsil v budově své firmy. Ale bylo to skutečně tak? Nedonutil mladou ženu někdo? A jak to, že muž měl svázané ruce za zády lepící páskou? Jak by si dokázal nasadit oprátku? Oba případy pražským kriminalistům pomohly vyřešit klíčové důkazy. Dramaturgie: Dana a Mirek Vaňurovi. Repríza.'
