  title: Noční Mikrofórum
  description: 'Host: Markéta Novotná, aromaterapeutka v hospicové péči. Jaké bylo odejít z kliniky prenatální medicíny a asistované reprodukce, kde život začíná, a zamířit do hospice, kde život většinou končí? Co jí přineslo osm let vedení týmu dobrovolníků? A proč mají klienti hospice nejraději oleje z kadidla, pomeranče a jedle sibiřské? Moderuje Monika Valentová. Repríza.'
