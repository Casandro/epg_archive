  title: Četba na pokračování
  description: 'Petr Sagitarius: Trujkunt - Kruhy (3/8). Telefonát do Londýna a vášnivá noc majora Sarana. Svérázný major Roman Saran vyšetřuje brutální vraždu. Nález zohaveného těla uprostřed podivných kruhů v obilném poli je jen začátkem temného příběhu, který dá ostravské kriminálce pořádně zabrat. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2022.'
