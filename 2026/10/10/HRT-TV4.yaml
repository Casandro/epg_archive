  - '160'
  description: Emisija govori o obilježavanju 35. obljetnice obrane grada Zadra. Dana 6. listopada 1991., zahvaljujući junaštvu hrvatskih branitelja, spriječen je prodor agresorskih snaga JNA i srpskih paravojnih postrojbi. Bitka za Zadar ima posebno važnu, pa i presudnu ulogu u Domovinskom ratu, poručio je ministar branitelja Tomo Medved.  U Veteranima mira pogledajte i obilježavanje 35. obljetnice osnutka i prvog postrojavanja osječke Prve hrvatske studentske bojne. Održana je sveta misa, položeni su vijenci i zapaljene svijeće kod kapelice Kraljice Mira na lijevoj obali Drave. Na Ekonomskom fakultetu, s kojega su nekada odlazili na bojišta, pripadnici Prve hrvatske studentske bojne prisjetili su se ratnih dana, poginulih i nestalih suboraca. U emisiji gostuju Slaven Zdilar, zapovjednik 3. bojne 4. brigade ZNG-a i Marko Čulina, zapovjednik 112. brigade ZNG-a.
