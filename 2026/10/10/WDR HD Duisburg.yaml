  subtitle: Zoogeschichten aus München
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ein frisches Fell mit einer weihnachtlichen Duftnote - ob da die Luchsfamilie wiederstehen kann? Eisplatten auf der Elefantenanlage - haben die Dickhäuter ein Problem? Sie sehen aus wie Pflanzen und sind doch Tiere - ein Wunder im Zoo. Ein Intelligenztest für Zebramangusten - wer kommt im Zoo auf solche Ideen? Wie versorgt eine Ärztin ein Zebra mit einem Wundverband? Warum ein Pinguin auf der Flucht ist und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".
