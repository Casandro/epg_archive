  title: Die Sendung mit dem Elefanten
  subtitle: Vom Krabbeln zum Laufen
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In den Lach- und Sachgeschichten dreht sich heute alles um die Größe. Hanna ist gerade ein Jahr alt, aber schon so groß, dass sie fast laufen kann. Lola möchte größer sein, so groß wie ihr Bruder Charlie. Ein kleines Rehkitz hat einen ungewöhnlichen Freund: einen riesengroßen Hund. Händchen sortiert seine Socken der Größe nach. Und zum Mitmachen gibt es das Hampelmannlied.
    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.
