- eventId: 1618215
  start: 2026-10-10T09:00:00Z
  stop: 2026-10-10T10:00:00Z
  title: Przygoda Europa
  description: '"Przygoda Europa" z Dusanem Radenkovićem to program, który pokrywa koszty podróży - samoloty, hotele, transport, bilety i zakwaterowanie. Uczestnicy mają za zadanie podróżować i dotrzeć jako pierwsi do celu, co oznacza wygraną 5000 euro. Cel podróży jest odkrywany poprzez zagadki. Czas na start przygody!'
