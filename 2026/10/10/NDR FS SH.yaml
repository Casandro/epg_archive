  title: Länder - Menschen - Abenteuer
  subtitle: Estrada Real - Auf dem Königsweg durch Brasilien
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Brasilien ist mehr als Sonne, Strand und Zuckerhut. Die Dokumentation folgt der Estrada Real, dem historischen Königsweg, der von der Küste Rios bis ins Hinterland führt. Die bis zu 800 Kilometer lange Route durchquert den Atlantikurwald Mata Atlântica, den Cerrado und historische Städte. Unterwegs begegnet das Team Menschen, die für den Schutz der Natur kämpfen, an die koloniale Vergangenheit erinnern, nach Schätzen suchen und von einer großen Fußballzukunft träumen.
