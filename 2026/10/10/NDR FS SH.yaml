  title: Mit Mut, Mörtel und Millionen Tipps
  subtitle: 'Ein Schloss: 60 Zimmer, 100 Fenster'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Seit mehr als 20 Jahren retten Knut Splett-Henning und seine dänische Ehefrau Christina von Ahlefeldt-Laurvig marode Gutshäuser in Mecklenburg-Vorpommern. Jetzt wagen sie sich an ein Haus der Superlative: Schloss Lüssow, 3.000 Quadratmeter, mehr als 100 marode Fenster, Deckenhöhen von fast sechs Metern. Sie wollen es scheibchenweise bewohnbar machen. Wie kaufe ich ein Gutshaus? Worauf muss ich achten? Welche der 1.000 Arbeitsschritte mache ich zuerst? Die Gutshausretter und ihre Experten wissen, wie der Traum vom eigenen Schloss nicht zum Albtraum wird.'
