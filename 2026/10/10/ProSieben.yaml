    Comedy, USA 2021
    Altersfreigabe: ab 12
  description: |-
    Die Simpsons sitten das Haus einer reichen Familie - bis sie feststellen müssen, dass ihre Vorgänger immer noch heimlich im Keller wohnen ... Homer beschließt, den Baum, auf dem das Baumhaus steht, zu fällen. Dieser erwacht jedoch zum Leben ... Ein mysteriöses TikTok-Video sorgt für Aufregung. Jedes Schulkind, das dieses Video gesehen hat, muss sieben Tage später sterben.

    Regie: Mike Braiiiiiins Anderson, The Mysterious Matthew Faughnan
    Drehbuch:  The Return of Frinkzilla
    Komponist: Alf Clausen,  Bleeding Fingers Music
