  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andreas Caminada
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andreas Caminada
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er gilt als der absolute Superstar der Schweizer Spitzenküche: Andreas Caminada hat mit seinem Hotelrestaurant Schloss Schauenstein Fine Dining-Geschichte geschrieben. Dort serviert er Spitzenküche auf allerhöchstem Niveau, die er schon 2009 erstmals als Gastkoch im Hangar-7 präsentiert. Jetzt kehrt Caminada mit seinem jüngsten Erfolgsprojekt zurück, dem Igniv - Sharing Konzept. In drei trendigen Restaurants von St. Moritz bis Zürich präsentiert Caminada Gourmetgerichte zum Teilen. Mit den Fingern zu essen ist explizit erlaubt, steifes Schickimicki-Getue streng verboten. Um dieses innovative Genusserlebnis im Hangar-7 zu präsentieren, startet Ikarus-Chef Martin Klein eine Rundreise durch die Schweiz. Aus jedem der drei Igniv-Restaurants bringt er vier Rezepte mit ins Ikarus. So entsteht ein Luxusmenü der anderen Art für entspannte Esser und lockere Leckermäuler! AT 2020'
