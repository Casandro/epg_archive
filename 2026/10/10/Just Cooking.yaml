  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Österreich
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Österreich
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Wozu in die Ferne schweifen, liegt der Genuss doch oft so nah! Im Oktober 2020 führt Martin Kleins kulinarische Mission zu Kollegen, die in Österreich für Furore sorgen. Drei Kapazunder der heimischen Sterne-Küche werden gemeinsam im Hangar-7 ein Menü präsentieren, das die Qualitäten Österreichs als Gourmet-Destination auf den Punkt bringt. Mit dabei: Alain Weissgerber, der im Burgenland Walter Eselböcks legendären Taubenkobel zu neuen Höhenflügen führt. Die Wiener Szene-Größe Konstantin Filippou wird seine mediterran-österreichischen Kreationen in die Ikarus-Küche mitbringen. Und mit der spanischstämmigen Fine-Dining-Legende Juan Amador wird auch jener Koch Gerichte zu Menü beisteuern, der Österreich  zu seinem ersten und bisher einzigen 3-Sterne-Restaurant verholfen hat. Best Of Österreich-  ein kultverdächtiges Heimspiel im Hangar-7! AT 2020'
- eventId: 1601111
