  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jean-George Klein & Paul Stradner
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein Heimspiel für Martin Klein: Seine kulinarischen Reise führt in dieses Mal zu seinen Ursprüngen in die elsässische Heimat. Im 1000-Seelen-Dorf Wingen-sur-Moder findet sich das zweifach besternte Restaurant Villa René Lalique. Namensgeber ist der legendäre Glaskünstler René Lalique, was sich auch in zahlreichen Kristallprodukten im Restaurant widerspiegelt. Das Restaurant wird von einer verdienten Fine-Dining-Doppelspitze geleitet:  Der legendäre französische Koch Jean-George Klein begeistert zusammen mit seinem jungen österreichischen Kollegen Paul Stradner die Fans der gehobenen Küche. Neben dem Genuß zahlloser Leckereien steht für den Gast aus Salzburg der Besuch einer Fischfarm und ein tiefer Einblick in den sensationellen Weinkeller der Villa auf den Programm. Außerderm gewährt die berühmte Glasproduktion Lalique einen  einmaligen Einblick in ihre Manufaktur. Ein berauschender und luxuriöser Trip ins Herz des Elsaß!  AT 2020'
