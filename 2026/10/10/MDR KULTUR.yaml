  title: MDR KULTUR Diskurs
  subtitle: Philosophie, Religion, Kulturgeschichte
  description: "Diskurs: Landesarchäologe Harald Meller: Graböffnung zeigt, wie Otto der Große wirklich war\nMit dem Museumsdirektor und Landesarchäologen von Sachsen-Anhalt sprach Geschichtsredakteur Stefan Nölke \n\nEs ist der Traum eines jeden Archäologen: Einmal ein Kaisergrab öffnen und mit den neusten Techniken der Archäogenetik und Mikrobiologie zu untersuchen. Für Harald Meller, Landesarchäologe von Sachsen-Anhalt und Direktor des Museums für Vorgeschichte in Halle, wurde er wahr. Unter seiner Leitung hat ein ganzes Team von Archäologen und Naturwissenschaftlern in den Jahren 2025 und 2026 das Grab Otto des Großen (936 - 973) im Magdeburger Dom geöffnet und akribisch erforscht. Eine wahnsinnig spannende Aktion. Und spektakulär sind auch die Ergebnisse, die Harald Meller nun zusammen mit dem Wissenschaftsjournalisten Kai Michel in seinem neusten Buch \"Im Herzen der Macht\" (erschienen bei DTV) beschreibt. Wobei es darin nicht nur um Kaiser Otto I., sondern generell um die Frage geht, was die Archäologen über die Epoche der Ottonischen Herrscher - die Rede ist von der Zeit zwischen 919 und 1024 - in den letzten Jahren herausgefunden haben. Über diese Spurensuche zu \"Deutschlands dunklen Anfängen\", wie es im Untertitel heißt, spricht Harald Meller mit MDR Kultur-Geschichtsredakteur Stefan Nölke.\n\nGespräche mit führenden deutschsprachigen Intellektuellen über die essentiellen Fragen unserer Zeit. Das Themenspektrum reicht von Geschichte und Gesellschaft, Philosophie und Religion, über Kulturgeschichte bis hin zu Naturwissenschaften und Lebenshilfe."
