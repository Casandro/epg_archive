  title: MDR KULTUR am Morgen
  description: "* 06:15 Uhr - Alte Apfelsorten bewahren und bestimmen\n Aktuell gibt es viele Apfelfeste, bei denen alte Sorten bestimmt werden können.\n\n* 06:30 Uhr - Wetter & Verkehr\n\n* 06:45 Uhr - Der Stichtag: 1766 Eröffnung des Neuen Theaters in Leipzig \nVor 260 Jahren entstand der erste Theaterbau der Stadt.\nAutor: Hartmut Schade\n\n* 07:15 Uhr - Die Geister berühren - Monografie zu Gabriele Stötzer\nHeute bekommt die Künstlerin Gabriele Stötzer den Kaiserring der Stadt Goslar. Der Leipziger Verlag Spector Books hat mit \"DIe Geister berühren\" eine Monografie zu Gabriele Stötzers Werk vorgelegt. \nEva Gaeding stellt sie vor.\n\n* 07:30 Uhr - Medienschau, Wetter & Verkehr\n\n* 07:45 Uhr - 20 Jahre Kindermuseum im Winckelmann-Museum Stendal\nIn Stendal ist ja Johann Joachim Winckelmann geboren worden vor mehr als 300 Jahren. In einem wirklich \nmodernen, schönen Museum kann man in die Welt des Begründers der klassischen Archäologie eintauchen. Auch \ndie Jüngsten. \nKatharina Häckl berichtet.\n\n* 07:50 Uhr - Teaser MDR KULTUR trifft ... Nadine Maria Schmidt\n\n* 08:10 Uhr - Dein musikalisches Denkmal: Nadine Maria Schmidt komponiert für Sterbende\nZum Welthospiztag: Nadine Maria Schmidt komponiert Lieder gemeinsam mit Sterbenden. Heute ist sie bei Kultur trifft zu Gast, Kristin Hendinger stellt sie vor.\n\n* 08:20 Uhr - Deutscher Verlagspreis: Hauptpreis geht nach Leipzig\nEiner der Hauptpreise des Deutschen Verlagspreises geht dieses Jahr nach Leipzig. Der Merve Verlag ist einer der drei Hauptgewinner in diesem Jahr. Das hat Kulturstaatsminister Wolfram Weimer am Freitag im Rahmen der Frankfurter Buchmesse bekannt gegeben. Der Verlagsinhaber des Merve-Verlags in Leipzig, Tom Lamberty, sagte MDR KULTUR: Die 50.000 Euro Preisgeld werden in neue Buchprojekte fließen.\n\n* 08:30 Uhr - Feuilleton, Wetter & Verkehr\n\n* 08:40 Uhr - Elisabeth-Schumann-Ehrung im Ständehaus Merseburg\nElisabeth Schumann war eine der berühmtesten Sopranistinnen ihrer Zeit. 1888 in Merseburg geboren, geriet sie jedoch in Vergessenheit. Eine ausgebildete Sängerin aus Merseburg hat es sich zur Mission gemacht, an diese Frau zu erinnern und hat ihr ein Programm gewidmet. Es wird am 10.10. um 16,.00 Uhr im Ständehaus in Merseburg in dem nach ihr benannten Saal (Elisabeth-Schumann-Saal) aufgeführt. \n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: André Sittner"
