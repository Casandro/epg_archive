  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Gespräch: Nora Bossongs neues Buch \"Welt mit anderen Mitteln\" \n\n* 10:30 Uhr - Wetter & Verkehr\n\n* 10:40 Uhr - Der Stichtag: 1766 Eröffnung des Neuen Theaters in Leipzig \nVor 260 Jahren entstand der erste Theaterbau der Stadt.\nAutor: Hartmut Schade\n\n* 10:50 Uhr - Das Gedicht: Hunde von Alfred Brendel\nEs liest: der Autor.\nDer Pianist als Dichter: Mit seinen komischen und grotesken Versen baute der im vergangenen Jahr verstorbene Alfred Brendel eine luftige Brücke zwischen Sinn und Unsinn. Und brachte dabei allerhand Bedenkenswertes zur Sprache - zum Beispiel den Blick auf des Deutschen liebsten Hausgenossen - den Hund. Nur nicht aus der Perspektive seiner Liebhaber ... Hören Sie noch einmal die Stimme von Alfred Brendel in einer öffentlichen Veranstaltung mit einem seiner Hunde-Gedichte\n\nWort zum Tag, aktuelle Empfehlungen für das Wochenende, Feuilleton und Stichtag. \n\nModeration: Julia Hemmerling"
