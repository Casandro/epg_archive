  title: MDR KULTUR trifft
  subtitle: MDR KULTUR trifft - Nadine Maria Schmidt / Liedermacherin, Sterbe- und Trauerbegleiterin, Leipzig
  description: "Der Welthospiztag am 10. Oktober steht unter dem Motto \"So bunt wie das Leben. Hospiz.\" Am 14. Oktober, dem Deutschen Hospiztag, wird der Arbeit von Hospiz- und Palliativdiensten gedacht. \"Ich gehe menschlich wie musikalisch ein Stück Weg mit denen, die gerade kein Licht mehr sehen können, weil sie einen Menschen, den sie liebten, verloren haben.\", formuliert die in Leipzig lebende Liedermacherin Nadine Maria Schmidt. 2022 schrieb sie zum ersten Mal ein Lied für eine Familie, die ihren kleinen Jungen verlor. Eine einschneidende Erfahrung. 2023 gründete Nadine Maria Schmidt \"Dein musikalisches Denkmal\", absolvierte eine Ausbildung in der Sterbe- und Trauerbegleitung und nahm ein Zweitstudium in der sozialen Arbeit auf. In ihrer Gründungsphase erhielt sie die Förderwürdigkeit des Landes Sachsen und FutureSAX mit dem Innostartbonus, stellte ihr Projekt auf der sächsischen Innovationskonferenz 2024 vor und gewann den 3. Platz. Zusammen mit der Leipziger Diakonie Hospizleiterin Silvia Beckert arbeitet Nadine Maria Schmidt jetzt an dem vom Europäischen Sozialfond geförderten Projekt \"Dein musikalisches Denkmal in der Hospizarbeit.\". \"Alles begann, als ich keine Worte mehr fand.\", sagt Nadine Maria Schmidt. Also schrieb sie ein Lied und erlebt seither, welche Kraft Musik gerade am Lebensende entfalten kann. Erste Untersuchungsergebnisse zeigen, die musikalische Arbeit hilft Hospizgästen, aber auch ihren Familien, Gefühle auszudrücken, Abschied zu gestalten und Trauer zu verarbeiten. Dieses Modell soll weiter getestet, evaluiert und entwickelt werden, hin zu einem übertragbaren Konzept mit dazugehöriger Ausbildung.\n\nNadine Maria Schmidt steht für Stimme und Poesie, schrieb einst ein Musikkritiker nach einem Konzert. 2007 stand Nadine Maria Schmidt das erste Mal auf der Bühne, englischsprachig. Heute kann sie auf 500 Konzerte, Solo und mit Band in ganz Deutschland und Polen verweisen, darunter auch Konzerte für Alin Coen, Sarah Lesch, Manfred Maurenbrecher oder Tino Eisbrenner. Mit ihrer Band \"Nadine Maria Schmidt & Frühmorgens am Meer\" veröffentlichte sie drei Alben. Alle wurden für den Preis der deutschen Schallplattenkritik nominiert. Zudem wurde sie 2016 mit dem renommierten Förderpreis der Liederbestenliste ausgezeichnet, den auch u.a. Dota und Felix Meyer erhielten. Die Liedtexte von Nadine Maria Schmidt gingen in verschiedenen Gedicht-Anthologien ein. Die Vertonung anderer Dichter, wie Rilkes \"Der Panther\", fanden an Universitäten in Deutschland und den USA Eingang in die Lehre. \n\nIn Greiz wurde Nadine Maria Schmidt 1980 geboren. In der Kleinstadt Elsterberg im Vogtland wuchs sie auf. Mit 23 Jahren erst fand Nadine Maria Schmidt zur Musik, als Autodidaktin, ohne musikalische Vorbildung und der ärztlichen Diagnose zum Trotz, anatomisch nicht für den Gesang prädestiniert zu sein. Das erste deutschsprachige Album \"Blaue Kanten\" erschien 2012. Zwei Jahre später folgten \"Lieder aus Herbst\", gleich zweimal für den Preis der deutschen Schallplattenkritik nominiert. Parallel dazu schloß Nadine Maria Schmidt ihr Studium Deutsch als Fremdsprache, Journalistik und vergleichende Literaturwissenschaft an der Universität Leipzig ab. Ein Arbeitsangebot in Kairo lehnte sie ab, entschied sich für die Musik. Nach einer Schreibblockade und dem tiefen Drang danach trotzdem Musik zu schreiben, vertonte sie 2016 auf dem Album \"Ich bin der Regen\" große Dichter und Dichterinnen. Nach einer Zeit des privaten Rückzugs arbeitete sie 2019"
