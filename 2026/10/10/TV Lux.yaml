  title: 12 podmienok dedičstva (1)
  subtitle: Jason Stevens (Drew Fuller) mal veľmi jednoduchý vzťah k svojmu neuveriteľne bohatému otcovi, Howardovi "Redovi" Stevensovi (James Garner) - nenávidel ho.
  description: 'Mladý naivný Jason si myslel, že zdedí hromadu peňazí, ale zažil veľké sklamanie. Podľa testamentu bude musieť prekonať ešte poriadne dlhú cestu, aby spoznal, aký je vzťah medzi bohatstvom a šťastím.Jason Stevens mal veľmi jednoduchý vzťah k svojmu bohatému otcovi, Howardovi "Redovi" Stevensovi - nenávidel ho. Takže Jason tak akosi predpokladal, že čítanie otcovho testamentu bude len ďalšou peňažnou transakciou, čo mu umožní nerušene žiť aj naďalej hýrivým životom, na ktorý bol zvyknutý. Red mu však namiesto toho zanechal niečo celkom iného. Pripravil pre neho plán, skutočnú skúšku životom. A síce dvanásť úloh, ktoré Red nazval "darčeky". Každý z nich arogantného, rozmaznaného a lenivého Jasona svojráznym spôsobom skúša a všetky dohromady ho zmenia navždy. Réžia: Michael O. Sajbel. Účinkujú: Drew Fuller (Jason Stevens), James Garner (Howard ''Red'' Stevens), Ali Hillisová (Alexia), Abigail Breslinová (Emily Rose), Bill Cobbs (Pán Theophilus Hamilton) (2006)'
