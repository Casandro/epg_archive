  title: Moja misia - magazín XXVI (14)
  subtitle: Španielska rehoľná sestra. Dokumentárny film zo života misionárov a následný rozhovor, aktualizujúci udalosti z filmu.
  description: Španielska rehoľná sestra Clara Mompó Vidal, ktorá už viac ako 30 rokov pôsobí na Slovensku. Počas svojho pôsobenia pomáhala ľuďom bez domova, rodinám v núdzi či ľuďom so zdravotným znevýhodnením. Dnes sa venuje včasnej intervencii a podpore rodín s deťmi so zdravotným znevýhodnením. Čo ju priviedlo zo Španielska na Slovensko a čo ju aj po rokoch motivuje pomáhať druhým? Dozviete sa v relácii Moja misia magazín. (2026)
