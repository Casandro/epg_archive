  description: 'Wenn Teddy Teclebrhan die Bühne betritt, ist eines garantiert: Stillstehen ist keine Option. In seinem Erfolgsprogramm "Halb Mensch, halb Disco" bringt der Ausnahme-Entertainer seine unverwechselbare Mischung aus Stand-up, Musik, Improvisation und pointierter Alltagsbeobachtung auf die große Stadion-Bühne. Mit seinen beliebten Figuren Ernst Riedler, Percy, Lohan Cohan und Antoine sorgt er für jede Menge Situationskomik und spontane Interaktionen mit dem Publikum.'
