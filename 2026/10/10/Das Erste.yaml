  description: Das winzige Fürstentum Saint-Toulipe ist ein Spielerparadies und finanziell am Ende. Ein Millionenkredit muss her - doch aus der Finanzspritze für den Monarchen Gustavo und seine Gattin Betsy wird nichts! Jetzt ruhen ihre ganzen Hoffnungen auf ihrer attraktiven Tochter Christina. Sie soll in Rom einen reichen Industriellen heiraten. Doch in Rom angekommen, lernt sie einen einfachen Busfahrer kennen und lieben. Der setzt alles daran, die hübsche Aristokratin zu ehelichen.
