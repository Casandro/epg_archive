  title: Svět zvířat
  description: 'Hostem Světa zvířat dnes bude Miluše Maskulanisová, zakladatelka a vedoucí známého útulku Psí domov Řepnice. Dozvíte se, jak probíhá náročný proces socializace psů s těžkým osudem a jak může pomoci psímu domovu každý nás a to materiálně, finančně a nebo třeba jen venčením. Ptejte se i vy na to, co vás zajímá. Telefon do studia je 475 212 212. Své dotazy můžete psát na email: host@sever.rozhlas.cz. Moderuje Slávka Brádlová.'
