  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die 17-jährige Chiara wird schwer verletzt im Wald von Gubbio gefunden. Der erste Verdacht fällt auf den Trinker Carmine, da er am Tag zuvor Streit mit dem Mädchen hatte und außerdem zur Tatzeit ebenfalls im Wald war. Carmines Sohn Luca, der gleichzeitig der Freund von Chiara ist, bittet Don Matteo um Hilfe. Zwischen dem Capitano und Patrizia herrscht noch immer die große Krise - so schlimm, dass Patrizia mit Fernando einen romatischen Abend verbringt und der Capitano mit Andrea Conti.'
