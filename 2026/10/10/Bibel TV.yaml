  title: Ein Hauch von Himmel
  subtitle: Gottes Werk
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Dr. Sarah Conover ist eine führende Wissenschaftlerin im Bereich der Genforschung. Mit ihrer Arbeit hat sie schon viele Menschenleben gerettet - doch nun will sie Leben erschaffen. Dem ersten Forscher, dem es gelingt, ein Menschenbaby zu klonen, ist der Nobelpreis gewiss und Sarah will die Erste sein. Während sie noch überlegt, welches Baby sie klonen soll, wird Monica als Bioethikerin ins Labor geschickt. Sie versucht, Sarah auf die unvorhersehbaren Probleme und Gefahren dieser medizinischen Grenzüberschreitung aufmerksam zu machen und ihr zu erklären, dass Leben aus dem Reagenzglas nicht das ist, was Gott sich vorstellt. Keine leichte Aufgabe, denn Sarahs eigentliches Anliegen ist es, einen Menschen zu schaffen, der ganz ihr gehört und dem sie ihre Liebe schenken kann. Wird Monica Sarahs Meinung ändern können, bevor sie diese Büchse der Pandora öffnet?'
