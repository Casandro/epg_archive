  title: Frei sein mit Wilkin van de Kamp
  subtitle: Wenn dir Unrecht angetan wurde
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wie kann man vergeben, wenn einem Unrecht angetan wurde? Wilkin van de Kamp erzählt die Geschichte von Grace, die einen Gottesdienst von "Frei sein" besuchte. In jungen Jahren wurde sie aus ihrer Heimat Nigeria nach Europa gelockt, mit dem Versprechen, dort Arbeit zu finden. Stattdessen wurde sie erpresst und zur Prostitution gezwungen. Im Gottesdienst erlebte sie die Liebe Jesu und erhielt dadurch neue Hoffnung. Mit Gottes Hilfe fand sie die Kraft, aus ihrem Schicksal auszubrechen - und konnte den Tätern schließlich vergeben.'
  genre:
  - '51'
  widescreen: true
  hd: true
