  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Egal in welchem Alter: Anne Schmidt bleibt offen für Gottes Berufung. Sie sprudelt vor Freude, wenn sie von Gott spricht - ob im Kindergottesdienst oder bei Elena Schulte auf dem Sofa. Und sie inspiriert und ermutigt, auf Gottes Versprechen zu vertrauen und sich mit der eigenen Berufung zu versöhnen.'
