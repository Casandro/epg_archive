  title: Ein Hauch von Himmel
  subtitle: Im Zeichen der Taube
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Andrew hat einen freien Tag und geht mit seinem Todesengel-Kollegen Adam in sein Stammlokal "Das Zeichen der Taube". Um die Inhaber-Familie Mason kümmert Andrew sich bereits seit vielen Generationen und nimmt regen Anteil an ihrem Schicksal. Er berichtet Adam, wie er Angehörige der Familie auf ihrem Weg ins Himmelreich begleitet hat, von der amerikanischen Kolonialzeit über den Bürgerkrieg bis ins zwanzigste Jahrhundert hinein. Daher ist Andrew auch sehr erschüttert, als er erfährt, dass Ben, der Letzte in der Mason-Linie, heute nicht wie geplant heiraten, sondern sterben wird. Zu allem Überfluss soll auch nicht Andrew ihn dabei begleiten, sondern Adam. Das ist zu viel für Andrew! Er protestiert verärgert gegen die Anweisung von oben. Was hat sich Gott dabei gedacht? In der Zwischenzeit versucht Monica, einen verzweifelten Mann im Geschäft nebenan davon abzuhalten, etwas zu tun, das schlimme Auswirkungen auf zahlreiche Menschenleben haben würde.'
  genre:
