  title: Land & lecker - Kulinarische Schätze aus Schwaben (3)
  subtitle: Räucherduft im Kuhstall und Omas Blätz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die dritte Reise geht nach Schwaben in Bayern zu Verena Krimbacher. Zusammen mit ihrem Mann Hubert hat sie den Hof ihrer Schwiegereltern übernommen - Biopioniere der ersten Stunde. Für das junge Paar gibt es eine neue Herausforderung: Die Kühe sollen an die frische Luft und müssen durch das Dorf bis zur Weide getrieben werden, die außerhalb liegt. Damit das klappt, müssen Verena und Hubert erstmal mit den Tieren üben. Zum Tierwohl gehört für die Allgäuer Wildkräuterführerin auch das Räuchern des Kuhstalls mit Wildkräutern und Harzen.'
