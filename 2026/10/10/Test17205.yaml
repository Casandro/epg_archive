  title: Documentaires
  description: '(Inédit) L''été de la Nati ''25 Doc Portrait  L''été de la Nati ''25 suit l''équipe nationale féminine suisse durant l''été 2025, alors que le pays accueille l''Euro de football féminin. Le documentaire plonge dans les coulisses de l''équipe jouant à domicile : les doutes, la pression, les moments intimes et les émotions qui unissent les joueuses. Au-delà du sport, le film capture comment cet événement a créé un lien unique entre l''équipe et tout un pays, marquant un tournant pour le football féminin suisse. (Suisse-2026)'
