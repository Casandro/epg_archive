  title: Le Miracle Suisse
  description: La bonne bouffe Miam. D'accord on n'est pas la France ni l'Italie, mais pour ce qui est de la bonne bouffe, on apprécie ! Evidemment, il y a pas mal de fromage, nos repas ne sont pas légers légers, mais il y a toujours de la convivialité ! Et vous savez quoi ? Nous consommons 160 millions de saucisses par année ! Il y en a plein de sortes différentes, dont le fameux cervelas. Et puis nous avons des tas de pâtisseries de fêtes, pleines de beurre et de crème ; savez-vous ce que sont les merveilles, les nonettes, les marmites de l'Escalade, les biscômes et les bricelets ? Enfin, il ne faut pas se mentir, il y a aussi de la malbouffe chez nous, comme partout mais cela ne nous empêche pas de garder un solide appétit ! Le Miracle Suisse, met les petits plats dans l'écran !   "Audio description"
  genre:
  - '128'
  widescreen: true
  subtitled: true
