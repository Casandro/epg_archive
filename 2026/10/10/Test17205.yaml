  title: Les suffragettes
  description: Au début du siècle dernier, en Angleterre, des femmes de toutes conditions décident de se battre pour obtenir le droit de vote. Face à leurs revendications, les réactions du gouvernement sont de plus en plus brutales et les obligent à entrer dans la clandestinité pour une lutte de plus en plus radicale. Puisque les manifestations pacifiques n'ont rien donné, celles que l'on appelle les suffragettes finissent par avoir recours à la violence pour se faire entendre. (Grande-Bretagne-2015)
