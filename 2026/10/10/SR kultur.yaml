  title: 'FeatureZeit: Unerkannte Tötungsdelikte'
  subtitle: Missstände bei der Leichenschau
  description: Rund 1000 Morde jährlich bleiben in Deutschland schätzungsweise unerkannt. Die Leichenschau könnte sie aufdecken helfen. Doch mancher Mediziner hat zuletzt im Studium eine Leiche gesehen. Hausärzte wollen Angehörigen Ermittlungen ersparen. Kriminalpolizei und Staatsanwaltschaft sind überlastet, die Obduktionsquote in Deutschland niedrig. Die zweite Leichenschau im Krematorium wird mitunter gut bezahlt, aber schlecht gemacht. Besonders heikel sind Tötungen in Kliniken und Heimen. Bei den 87 nachgewiesenen Morden des Krankenpflegers Niels Högel hatten Ärzte 87mal einen natürlichen Tod bescheinigt.
