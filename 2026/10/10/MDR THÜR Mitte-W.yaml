  stop: 2026-10-10T08:00:00Z
  title: Der Morgen
  subtitle: mit Romy Anders
  description: |-
    MDR THÜRINGEN - DAS RADIO ist auch am Wochenende Ihr Begleiter am Morgen.
    Beginnen Sie den Tag mit Ihrer Lieblingsmusik, aktuellen Informationen, Berichten und Interviews zu Themen aus Ihrer Region, aus dem Freistaat, Deutschland und der Welt.
    Nachrichten jeweils zur vollen Stunde, dazu um 6.30, 7.30, 8.30 und 9.30 Uhr Schlagzeilen und Regionalnachrichten, halbstündlich aktuelle Informationen zum Wetter und zur Verkehrslage. Zusätzlich sprechen wir um 7.50 Uhr mit dem MDR-Wetterstudio ausführlich über die Aussichten. "Die Kirche im Radio" hören Sie gegen 6.20 und 9.20 Uhr.


