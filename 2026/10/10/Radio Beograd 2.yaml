  title: Zlatno i plavo
  subtitle: Katalin Ladik (Novi Sad, 1942) je pesnikinja, izvođačica i glumica koja živi i radi u Budimpešti, Novom Sadu i na Hvaru.
  description: Katalin Ladik (Novi Sad, 1942) je pesnikinja, izvođačica i glumica koja živi i radi u Budimpešti, Novom Sadu i na Hvaru. Poeziju stvara u različitim žanrovima i formama, piše i izvodi performanse, eksperimentalnu muziku i radio-drame. Bila je jedan od simbola jugoslovenske avangarde šezdesetih, i ostala upamćena po svojoj erotičnoj pojavi i izjavama kojima je provocirala konzervativnu javnost. Ispituje jezik kroz vizuelne i vokalne izraze, kao i pokrete i gestove. Njeni radovi obuhvataju kolaže, fotografije, ploče, performanse i hepeninge u urbanim i prirodnim sredinama. Pesme Katalin Ladik objavljivane su širom sveta u raznim časopisima i antologijama, prevođene na španski, nemački, poljski, bugarski, slovački, hindi, kineski, indonežanski, rumunski, makedonski, ruski i slovenački jezik. Dobitnica je brojnih priznanja, uključujući nagradu Kassák Lajos, holandsku nagradu Mikes Kelemen Kör, nagradu Atila Jožef, nagradu za paralelnu kulturu Mediawave, Nagradu za mir LenonOno, Hazamovu...
