  title: Unvergessene Legenden - Ronny
  subtitle: Unvergessene Legenden - Ronny
  description: Ronny ist unsere unvergessene Legende. Noch als Wolfgang Roloff  hat diesen besonderen Klang seiner Stimme entdeckt, perferktioniert  und damit etwas Legendäres geschaffen. Dieser Klang war sein Streben. Weniger der Ruhm. Darum gibt es Ronny auch nur ganz selten auf Fotos oder mit Videos. Seine Zurückhaltung bei öffentlichen Auftritten ist sicher einer der Gründe dafür, dass ihn auch osthum ein geheimnisvoller Mythos umweht und  so den Sänger Ronny zu einer Legende werden ließ. Ge 2020
