  title: Barvínek
  subtitle: Mohyla míru ? památník s mírovým posláním
  description: 'Autor a interpret: Štěpánka Minárová; Premiéra: 15.11.2022 * S Barvínkem se tentokrát vydáme po stopách bitvy u Slavkova a přeneseme se tak do roku 1805. Bitva tří císařů, v zahraničí známá též jako bitva u Austerlitz, byla jedním z hlavních střetnutí napoleonských válek. My zamíříme k Památníku Mohyla míru ve Slavkova u Brna a navštívíme stejnojmennou expozici Bitva tří císařů Slavkov / Austerlitz 1805, která byla otevřena k 200. výročí bitvy a získala cenu v soutěži muzejních expozic GLORIA MUSAEALIS 2005.  Pojďme společně s Barvínkem poodhalit zákulisí bitvy, která ovlivnila evropské dějiny. '
