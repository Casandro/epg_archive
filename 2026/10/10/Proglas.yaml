  title: Jak se vám líbí
  subtitle: Sophie Lukács & Noel Mpiaza živě ze studia Proglas
  description: 'Autor: Jannis Moras; Interpret: Sophie Lukács, Noel Mpiaza; Premiéra: 29.9.2026 * V pořadu Jak se vám líbí budou našimi hosty maďarsko-kanadská hudebnice Sophie Lukács, která hraje na tradiční západoafrický nástroj kora, a její spoluhráči Noel Mpiaza a László Koós. Řeč bude o tom, jak se Sophie dostala ke koře, o jejím několikaletém studiu v Mali, o kulturních kořenech tohoto nástroje i o propojení afrických, maďarských a dalších hudebních tradic. Trio zahraje přímo v našem studiu své písně v několika jazycích a prozradí, co chystá na své první společné album.[sofi lukáč] [lásló kóš] '
