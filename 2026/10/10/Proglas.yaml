  description: 'Autor: Hana Scharffová; Interpret: Veronica a Pavel Šochmanovi, Hana Scharffová; Premiéra: 22.1.2022 * Skautský ostrov nebo skautské biřmování. I takové speciality mohou okusit skauti ve Švédsku, k nimž se hlásí i tamní král. Je skauting univerzální myšlenkou? A jak moc se liší jeho výchovné myšlenky u nás a v severských zemích? O tom nám povypráví Veronica a Pavel Šochmanovi, skautští vůdci ze Stockholmu. K poslechu zve Hana Scharffová.'
