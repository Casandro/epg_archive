- eventId: 1438406
  start: 2026-10-10T03:57:00Z
  stop: 2026-10-10T04:00:00Z
  title: Myšlenka na den
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Představte si, že jste se ke konci prázdnin setkali s přáteli. Sedíte spolu na zahradě, opékáte špekáčky, kousky sýra a krajíčky chleba. Oheň praská a voní. Popíjíte pivoate. Teď jsou na řadě zážitky z dovolených. Každý něco prožil, každý něco vypráví. Jeden z přátel dává k dobrému historky z exotické ciziny. Vypráví vtipně, dobře si všímal různých odlišností a kulturních zvláštností, člověk ho poslouchá rád. Jeho žena přidává popisy jídla. Je kuchařka, takže problematice rozumí. Všichni jí rádi naslouchám, i když je nesmělá. Ale její popisy jídla jsou tak šťavnaté, že máme pocit, jako bychom s ní seděli u stolu plného různých podivných barevných a voňavých lahůdek, že se nám sbíhají sliny. Potom vypráví Pepa. Dává k lepšímu příběh, který se mu stal na dovolené před třiceti lety. Příběh je to zajímavý a Pepa je dobrý vypravěč. S napětím čekáme na pointu. Ach, dobře to dopadlo a všichni si oddechujeme. Pepa povzbuzen úspěchem svého vyprávění přidá ještě jednu podobnou historku. Znovu je to dobře vystavěný příběh s troškou napětí a hezkým poučením na závěr. Ale znovu se odehrává v době před třiceti lety. A mě napadne, že Pepovy nejlepší historky, co si vzpomínám, pocházejí vždycky ze stejné doby ? před třiceti a více lety. Copak od té doby nebyl nikde na dovolené? Nikdy později nic zajímavého neprožil? Není to divné? Nevím, jestli jsem jediná, kdo si toho všiml a nechtěla bych jej nějak zahanbit. Ale pořád mi to vrtá hlavou. Jak to, že Pepa nemá nové příběhy?V noci jsem nemohla spát, možná za to mohly ty dva špekáčky, co jsem snědla, možná i ty dva Pepovy příběhy.  Strašně silně mi připomněly nedávný večer se sdílením svědectví o Božích zásazích v našem životě. Některá ta svědectví byla taky stará přes třicet let. Platí to ještě vůbec? Nemá být svědectví něco čerstvého, nového, co ještě voní životem? Sebelíp podané vyčichlé historky z dávných dob vlastně už ani za svědectví nepovažuju. Ne, že by nebyly platné, že by nemohly zvěstovat slávu Boží, ale pokud nemáte jiný důkaz kontaktu s Bohem, než příběh starý třicet let, pak ať je jakkoli dobře vystavěný, mám obavu, že máte problém. Bůh je přece Bohem dneška. Jasně je taky Bohem včerejška a zítřka. Ale o zítřku ještě nic nevíme a včerejšek už byl. Jestli si nemůžete vzpomenout na něco skvělého, zázračného, povzbuzujícího a povznášejícího, co se stalo včera nebo nejpozději před týdnem, znáte vůbec Boha? A kde teda je?Čerstvost je pro mne důležitým testem. Pokud si nemohu vzpomenout na nějaký svůj zážitek s Bohem starší maximálně týden, zdá se mi, že mám problém. Spojení se někde přerušilo. Kde je problém? Na jeho straně určitě potíže nejsou, takže já jako příjemce, musím zkontrolovat připojení. Kde jsem se minula cíle? Kde bude nutné změnit myšlení? Nutně potřebuju znovu navázat spojení s čerstvým životem. Být ?blíže“.'
  subtitle: Být blíž 1010 - O zítřku ještě nic nevíme a včerejšek už byl (284. díl)
