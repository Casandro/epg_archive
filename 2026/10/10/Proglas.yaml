  title: ChariTALK
  description: 'Autor: Charita ČR; Interpret: Tomáš Klus, Leona Gyöngyösi; Premiéra: 27.12.2025 * ?Občas jsem se vyjádřil k věcem, které mě stojí to, co je pro nás umělce nejdůležitější - přízeň publika.“ Pro oblíbeného písničkáře Tomáše Kluse je hudba způsobem, jak vyjádřit své životní postoje a jak reagovat na svět kolem sebe. V novém dílu podcastu ChariTALK mluví nejen o své tvorbě a vztahu k fanouškům, ale také o tom, proč považuje solidaritu a angažovanost umělců za součást jejich práce. Otevřeně sdílí, co ho trápí na české společnosti, proč máme čím dál menší ochotu si naslouchat a jak snadno dnes lidi rozdělujeme na ?dobré“ a ?špatné“.V rozhovoru s moderátorkou Leonou Gyöngyösi se ale dotýká i těžkých a citlivých témat, jakými jsou válka na Ukrajině, konflikt v Gaze či environmentální krize. Tomáš Klus o nich hovoří bez obalu a vysvětluje, proč se i přes možnou ztrátu podpory svých fanoušků stále vyjadřuje k problémům, které považuje za zásadní. Jak vnímá roli umělce v charitativní činnosti? Co ho nejvíc trápí na české společnosti? Měl by se písničkář ?plést“ do politiky? A co ho nejvíce děsí na situaci v Pásmu Gazy?'
  subtitle: 'Tomáš Klus: V žádné učebnici dějepisu jsem nenašel válku, která by přinesla něco lepšího'
