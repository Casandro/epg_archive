  subtitle: S Júlií Kozákovou o EP Flor Nueva
  description: 'Autor: Milan Tesař; Interpret: Júlia Kozáková; Premiéra: 16.9.2026 * Zpěvačka Júlia Kozáková se po roce stráveném studiem ve Španělsku vrací na Slovensko a v rozhovoru s Milanem Tesařem bilancuje své španělské zkušenosti. Mluví o nových kontaktech, hudební produkci, vztahu ke španělštině i o tom, jak pobyt ve Španělsku ovlivnil její další tvorbu. Pozornost věnuje také novému EP Flor Nueva, které vzniklo jako záznam koncertu na festivalu Viva Musica v Bratislavě a přináší jemnější a poetičtější polohu její hudby. Řeč je i o budoucnosti projektů Manuša a Sole a o jejích plánech po návratu do Bratislavy. [í pí] [sole] [viva muzika] '
