  title: Tip týdne
  description: 'Autor: Martin Weisbauer; Interpret: René Milfait, Pavel Šafr; Premiéra: 10.9.2026 * V poslední době jsme svědky výrazného rozvoje paliativní péče, zároveň však sílí také tlak na dekriminalizaci eutanazie. Téma závěru lidského života se tak stává stále naléhavější společenskou, medicínskou, etickou i právní otázkou. Právě těmto souvislostem se budeme věnovat v našem pořadu s názvem Iluze dobré smrti. K debatě jsme pozvali dva hosty s různými zkušenostmi a pohledy.Prvním z nich je ThLic. Ing. René Milfait, Th.D., spolupracovník a člen Klubu přátel Domácího hospice Emanuel v rámci Oblastní charity Chrudim, člen Rady Sekce pro etiku v paliativní péči České společnosti paliativní medicíny a Společnosti lékařské etiky České lékařské společnosti Jana Evangelisty Purkyně. Tématu etiky péče na konci života se dlouhodobě věnuje také jako přednášející a autor odborných publikací. Na konci srpna vyjde v Nadaci Hlávkových rozsáhlá studie, na níž je spoluautorem spolu s advokátkou Barborou Steinlauf. Její název zní Eticko-právní analýza rozhodovací praxe soudů v kontextu poskytování péče v závěru lidského života.Druhým hostem je žurnalista Pavel Šafr, vydavatel, komentátor a dlouholetý šéfredaktor řady novinových i časopiseckých titulů. V současnosti působí, mimo jiné, jako šéfredaktor měsíčníku Forum 24+. Je také spoluautorem a editorem sborníku Iluze dobré smrti, jehož název jsme zvolili i pro náš pořad. K tématu, kterému se budeme věnovat, je tento název více než příznačný.Společně se podíváme na etické, právní, legislativní, medicínské i psycholigické aspekty eutanazie. Zaměříme se na aktuální situaci v České republice, ale také na zkušenosti zemí, v nichž již byla eutanazie dekriminalizována. Budeme hledat odpovědi na otázky, které se netýkají pouze medicíny a práva, ale v samém základu také našeho chápání lidské důstojnosti, svobody, utrpení a hodnoty lidského života.Téma pořadu podoří také hudba. Uslyšíte dvě skladby britské skupiny Ultravox, jejichž texty s tématem pozoruhodně rezonují. První z nich, Hymn (Hymnus), je úvahou o víře, naději a lidské potřebě hledat něco, co nás přesahuje. Připomíná, že člověk hledá smysl a oporu i ve světě, který mu žádné jistoty nenabízí. Druhá skladba, Dancing with Tears in My Eyes, pracuje s představou blížícího se konce světa. Přesto člověk ještě naposledy touží žít obyčejný život, být se svými blízkými a prožít chvíle, které mají smysl. V pozadí zůstává naléhavá otázka: Co bych dělal já, kdybych věděl, že mi zbývá už jen několik hodin života?O eutanazii, paliativní péči a konci života tedy nebudeme mluvit jen jako o otázce zákonů či medicínských postupů. Pokusíme se otevřít především otázku, jak chceme jako společnost rozumět životu, jeho důstojnosti a jeho samotnému konci.'
  subtitle: Iluze dobré smrti
