  title: Aus den Archiven
  description: |-
    Glücksspiel als Passion
    Wer spielt, ist des Teufels
    Von Peter Dittmar
    Deutschlandfunk 1970
    Vorgestellt von Isabella Kolar

    Überall auf der Welt wird gespielt, ob im Sozialismus, oder im Kapitalismus, ob erlaubt oder verboten. Und es spielen nicht nur die kleinen Leute. Wer träumt nicht davon, einmal durch das große Los zu Glück und Reichtum zu kommen? Aber verdirbt Geld nicht den Charakter? Ist es mehr Spielleidenschaft oder doch der Spielteufel, der uns treibt? Und: Warum glauben die Menschen, ihr Glück mit Hilfe des Spiels zu erlangen?
