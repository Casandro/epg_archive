  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Musik besitzt eine immense Kraft: Sie kann uns tieftraurig stimmen, in Ekstase versetzen und uns die Welt vergessen lassen. Menschen auf der ganzen Welt musizieren und hören Musik. Kaum jemandem gelingt es, sich ihr zu entziehen. Selbst Babys zappeln zu rhythmischen Klängen. Doch worin besteht die Wirkkraft der Musik? Was bewegt uns eigentlich, wenn wir von Musik bewegt werden?'
- eventId: 832219
  start: 2026-10-10T03:30:00Z
  stop: 2026-10-10T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Cypress Swamp
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 832220
  start: 2026-10-10T04:00:00Z
  stop: 2026-10-10T04:30:00Z
  title: Englisch für Anfänger
  subtitle: The Inventor
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"What''s your name? Are you German?" Mit einfachen Fragen und Antworten führt dieser Klassiker unter den Fernsehsprachkursen in die englische Sprache ein. In 51 Lektionen werden die wichtigsten Grammatikstrukturen und der Grundwortschatz vermittelt. Wann sagt man "some" oder "any"? Wann  heißt es "he was" und wann "he has been"? Die Antworten auf diese und viele andere Fragen, die Sie im Englischunterricht nie zu stellen wagten, liefert "Englisch für Anfänger" in witzigen Spielszenen und fundierten Erklärteilen.'
- eventId: 832221
  start: 2026-10-10T04:30:00Z
  stop: 2026-10-10T05:00:00Z
  title: TELEKOLLEG Französisch
  subtitle: Esquisses de France
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ausgewählte Regionen Frankreichs werden in diesen musisch-akzentuierten Dokumentationen in ihrer geographischen, gesellschaftlichen und kulturellen Besonderheit dargestellt. Landschaftliche Schönheiten gehören ebenso dazu wie Zentren wirtschaftlicher Bedeutung, Stätten der bildenden Kunst oder Schauplätze der Literatur. Interviews mit Franzosen verschiedenster Lebensbereiche vermitteln zusätzlich ein authentisches Bild von "Frankreich heute". Die formale Gestalt der Sendereihe orientiert sich bewusst an der Skizze, deren Reiz gerade darin besteht, dem Betrachter eine Anregung zu eigenen weiterführenden Entdeckungen zu geben.
- eventId: 832222
  start: 2026-10-10T05:00:00Z
  stop: 2026-10-10T05:30:00Z
  title: 42 - Die Antwort auf fast alles
  subtitle: Braucht unsere Gesellschaft Alkohol?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein Gläschen hier, ein Schlückchen da - Alkohol ist allgegenwärtig: in Feiermomenten, als Angstlöser und als Milliardenindustrie. Doch die Grenze zwischen Genuss und Abhängigkeit ist schmal. Dieser Teil der Dokumentationsreihe erforscht die kulturelle, soziale und gesundheitliche Bedeutung von Alkohol in unserer Welt. Was macht Alkohol so unverzichtbar als "soziales Schmiermittel"? Warum trinken wir, obwohl wir die Risiken kennen? Und könnte die Gesellschaft ohne Alkohol überhaupt stabil existieren? Einblicke in einen Stoff, der verbindet - und zerstören kann.'
