  title: Xena
  subtitle: Diesseits von Eden
  description: |-
    Auf dem Weg nach Indien besuchen die Heldinnen einen heiligen Berg. Als sie in einer Höhle Schutz vor dem wütenden Unwetter suchen, passiert etwas Unglaubliches. Die Frauen stoßen auf eine verborgene Welt, die einem paradiesischen Garten Eden gleicht. Herrscher über dieses fantastische Reich ist der Einsiedler Aiden (Jeremy Roberts). Der Guru, der innere Einkehr predigt, zieht Gabrielle mühelos in seinen Bann. Xena ist skeptisch und wird prompt von bösen Träumen und heftigen Wutanfällen geplagt. Gerade noch rechtzeitig erkennt sie, dass die meditative Traumwelt nur Fassade ist, und der Guru finstere Absichten hat.
    USA 1999
