    Kritik:"Atemlose Spannung, extreme Brutalität und Überraschungen bis zum Schluss im neuen Horrorstreich von Adam Wingard." (kino.de) "Adam Wingard spielt in "You're Next" virtuos auf der Klaviatur des Slasher-Genres von blankem Terror bis schwarzhumorigem Splatter - und trifft dabei jeden Ton!" (fillmstarts.de) "Regisseur Adam Wingard (,A Horrible Way To Die') bringt mit ,You're Next' einen Home-Invasion-Schocker der Extraklasse auf die Leinwand. Gekonnt spielt er mit einer der größten Urängste und garniert das Ganze mit einer geballten Ladung Action, packender Dramatik und knochenmarkgefrierendem Realismus." (yourenext-film.de) Hintergrund:Regisseur Adam Wingard schoss den Film innerhalb von vier Wochen und immer nur nachts: Die Dreharbeiten dauerten jeweils von 7 Uhr abends bis 7 Uhr morgens.
    USA 2011
  widescreen: true
