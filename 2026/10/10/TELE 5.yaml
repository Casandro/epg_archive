  title: Hercules
  subtitle: Das Monsterbaby
  description: |-
    Bei den Monstern im mythologischen Reich hat Nachwuchs das Licht der Welt erblickt. Gemeint ist Obstetrius, das Baby von Echidna und dem Riesen Typhon. Auch Hercules und Iolaus hat die frohe Kunde erreicht, sodass sie den stolzen Eltern und ihrem Neugeborenen einen Besuch abstatten. Wenig später erfahren sie allerdings, dass Klepto (Grant Heslov) den grünen, gelbäugigen Wonneproppen gekidnappt hat! Die Männer tun sich mit Echidna und Typhon zusammen, um das geraubte Monsterbaby zurückzuholen. Denn falls der kleine "Obie" in falsche Hände gerät, könnte das schlimme Konsequenzen haben.
    USA 1996
