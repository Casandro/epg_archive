  subtitle: 'Border Patrol Neuseeland: Suspekte Pandabären'
  description: 'Gefälschte Papiere, versteckte Drogen, unverzollte Waren, eingeschleppte Pflanzen und verbotene Lebensmittel: Der Aufmerksamkeit von Neuseelands Grenzkontrolleuren und ihren vierbeinigen Spürnasen entgeht nichts. Sie kontrollieren Passagiere und Gepäck, Postsendungen und gewerbliche Fracht nach allem, was Mensch und Natur der abgelegenen Inselnation gefährlich werden könnte. Spannende Einblicke in ihre Arbeit an den Flughäfen, Zollstationen und Postzentren zwischen Auckland und Queenstown.'
