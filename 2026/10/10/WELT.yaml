  title: 300 Tonnen Stahl auf Reisen - Schwertransport im Doppelpack
  subtitle: 300 Tonnen Stahl auf Reisen - Schwertransport im Doppelpack
  description: 20 und 18 Meter lang sind die beiden Industrieöfen, die die österreichische Spedition Felbermayr von einem Schiffsanlegeplatz an der Donau zu einer Flugzeugkomponentenfirma transportieren soll. Das Gesamtgewicht beider Öfen von gut 300 Tonnen stellt dabei nur eins vieler Probleme dar. Die Stahl-Kolosse sind beinah sieben Meter hoch - zu hoch, um die meisten Brücken oder Tunnel zu durchfahren. Eine unlösbare Unternehmung?
