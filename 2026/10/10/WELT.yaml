  title: Harmony of the Seas - Freizeitspaß auf hoher See
  subtitle: Harmony of the Seas - Freizeitspaß auf hoher See
  description: Mit seinen 363 Metern Länge, 66 Metern Breite und 72 Metern Höhe gehört die Harmony Of The Seas zu den größten Kreuzfahrtschiffen der Welt. Der 120.000 Tonnen schwere Gigant bietet Platz für mehr als 6.300 Passagiere, die sich unter anderem auf der längsten Rutsche auf See oder in einem von zwei Surfpools vergnügen können. Die Reportage begleitet den Luxusliner auf seiner Jungfernfahrt.
