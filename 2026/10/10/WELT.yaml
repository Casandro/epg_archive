  title: Lost Places - Folge 101
  subtitle: Lost Places - Folge 101
  description: 'Längst sind die Folgen des Klimawandels weltweit zu spüren. Ein augenfälliges Beispiel dafür ist Chacaltaya. Der Berg in den bolivianischen Anden war einst das höchstgelegene Skiparadies der Welt. Heute ist der Gletscher verschwunden, und die ausbleibenden Wintersportler sind für die Metropole La Paz dabei noch die geringste Sorge. Außerdem: Wie der Ort Doel zum "gallischen Dorf" Belgiens wurde. Und: Was ein verfallener Wolkenkratzer in Liberia mit dem Ende der Sklaverei in den USA zu tun hat.'
