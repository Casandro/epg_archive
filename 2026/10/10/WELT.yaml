  title: Das Reich der Wikinger - Ivars Dynastie (2)
  subtitle: Das Reich der Wikinger - Ivars Dynastie (2)
  description: Vor mehr als tausend Jahren überfallen die Wikinger Britannien, Irland und weitere Länder. Sie prägen die eroberten Gebiete maßgeblich - so zum Beispiel im 10. Jahrhundert in Dublin. Die Invasoren beeinflussen die irische Kultur und Architektur. Durch ihre großen Häfen und Flotten ermöglichen sie den Sklavenhandel. Sitric Seidenbart ist der letzte große Wikingerkönig Dublins. Sein Tod im Jahr 1042 markiert das Ende einer rund 200-jährigen Geschichte, geprägt durch Ivarr und seine Nachfahren.
  widescreen: true
