  title: Lost Places - Folge 65
  subtitle: Lost Places - Folge 65
  description: 'In der Nähe des Loch Lomond ist ein historischer Bau kurz vor dem Einsturz: Buchanan Castle. Was diese Burg so besonders macht, ist, wie sie im Laufe der Jahre mit der Natur verschmolzen ist. Während des Zweiten Weltkriegs diente es als Militärkrankenhaus, das Gebäude ist jedoch noch sehr viel älter. Unweit der Küste des Toten Meeres liegt ein touristischer Ort, der durch das Sinken des Meeresspiegels in einem Krater von der Erde verschluckt wurde.'
