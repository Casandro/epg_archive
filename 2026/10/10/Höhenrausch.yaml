  title: Entstehung der Alpen - Race Around Austria
  subtitle: Entstehung der Alpen - Race Around Austria
  description: 'Entstehung der Alpen - Race Around Austria: Der 32jährige Grazer Fahrradbote Lukas Kienreich nimmt zum ersten Mal den Solo-Bewerb des "Race Around Austria" in Angriff. Dabei muss er eine Strecke von insgesamt 2.200 Kilometern zurücklegen und unglaubliche 30.000 Höhenmeter überwinden - entlang der grenznahen Straßen, einmal rund um Österreich, nonstop. 4 Tage Schlaflosigkeit, 4 Tage Schmerz, 4 Tage Siegeswille: Die TV-Doku "Bis an die Grenzen - Das härteste Radrennen Österreichs" ist hautnah dabei, wenn der Langstreckenradfahrer weit über sich hinaus wächst, um sein gestecktes Ziel zu erreichen: durchzukommen. AT 2015'
