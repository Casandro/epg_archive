  title: ANIXE auf Reisen - Jamaika mit Wolke Hegenbarth
  description: 'Sonne, Palmen, Reggae: Jamaika ist ein Sehnsuchtsziel mit unglaublich vielen Facetten. Allein schon die bewegte Geschichte der Karibikinsel fesselt, wie die Schauspielerin Wolke Hegenbarth bald herausfindet. Da sind einerseits die reichen Plantagenbesitzer und ihre aus Afrika verschleppten Sklaven, die über Jahrhunderte das Leben und die Sitten auf Jamaika prägten. Ihre Nachfahren bilden heute das Jamaika der Moderne, mit seiner vielfältigen Kultur, seiner Musik und  Weltanschauungen. Geradezu paradiesische Landschaften im Landesinneren wechseln mit weiten Sandstränden an den Küsten. Von all dem überzeugt sich Wolke Hegenbarth vor Ort. Sie streift durch den Regenwald zu entlegenen Wasserfällen, taucht zu neu angelegten Korallenbänken und zeigt zahllosen, frisch geschlüpften Schildkröten den Weg ins Meer. Außerdem besucht sie den Ort, an dem Ian Fleming  seine ''''James Bond''''-Romane geschrieben hat.'
  widescreen: true
