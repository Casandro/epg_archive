  description: René Pawlowitz, besser bekannt als Shed, zählt zu den Schwergewichten der Berliner Szene. Die Liste seiner Tracks, die zu Klassikern der modernen Techno-Geschichte geworden sind, ist genauso lang wie die seiner Pseudonyme und der Labels, auf denen er veröffentlicht hat. Die Wucht und die einzigartigen Grooves seiner Produktionen machen seine DJ- und Live-Sets zu besonderen Ereignissen.
