  description: Sophie staunt nicht schlecht, als der schrullige Ornithologe Professor Franzen auf der Wache erscheint und Dietmar und Bärbel Vogelstimmen imitieren lässt - offenbar ein Ritual mit Tradition, denn Prof. Franzen kommt einmal im Jahr vorbei, um zusammen mit einer Gruppe Studenten das außerordentlich seltene Blaukehlchen in seinem Hengascher Refugium beim Nisten zu beobachten. Leider ist der Spaß der Vogelkundler nur von kurzer Dauer, denn eine der Studentinnen wird erschlagen im Wald gefunden. Zunächst gerät Prof. Franzen ins Visier von Sophie, denn sehr kompromittierende Fotos zeigen ihn in einem Vogel-Kostüm zusammen mit der Toten.
