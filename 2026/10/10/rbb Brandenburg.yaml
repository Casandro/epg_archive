  description: 'Zu Sophies Überraschung ist die neue Pflegerin Danuta eine äußerst elegante Erscheinung und spricht zudem noch fließend Deutsch. Kein Wunder, dass sich Hannes auf Anhieb bestens mit ihr versteht und sogar ein wenig ins Schwärmen gerät. Als Schönheitschirurg Dr. Zörner bei einem Anschlag schwere Verletzungen an der Hand erleidet, ist man sich schnell sicher: Terror in Hengasch!'
