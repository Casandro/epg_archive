  subtitle: Film von Stefanie Köhne
  episodeUri: crid://onid-1/e/6a989f5c2d07852659fe0772
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Markus ist 13 Jahre alt und lebt gemeinsam mit seinen Eltern und den drei Geschwistern auf der Sunbow Ranch in Brandenburg. Als großer Mittelalterfan trainiert er täglich - neben dem Bogenschießen - vor allem verschiedene Ritterkampftechniken zu Pferde. Markus kennt sich aus in längst vergangener Zeit. Besonders stolz ist er auf sein eigenes Ritterkostüm. In diesem Jahr darf er zum ersten Mal an einem großen Ritterturnier an der Ostsee teilnehmen. Doch bis dahin muss er noch viel üben.
