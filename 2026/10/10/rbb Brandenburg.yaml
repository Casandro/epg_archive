  title: Schloss Einstein (740)
  subtitle: Deutschland 2011
  episodeUri: crid://onid-1/e/6a989f5c2d07852659fe0774
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Elias, verletzt über den bevorstehenden Wegzug seiner Mutter nach Kapstadt, redet sich schließlich seinen ganzen Frust von der Seele. Elias'' Stiefvater Jochen habe schon immer einen Keil zwischen Elias und seine Mutter treiben wollen und nun gewonnen. Schließlich stellt Elias seine Mutter vor die Wahl: Jochen oder er. Frau Leinhoff ist verzweifelt und entscheidet sich, bei Elias zu bleiben und die Beziehung zu Jochen aufzugeben. Da erscheint Jochen persönlich, um sich bei Elias zu entschuldigen.'
