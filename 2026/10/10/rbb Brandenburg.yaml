  audiodesc: true
  description: Beim Kapuzineräffchen Sina ist der Abnabelungsprozess von den Tierpflegern noch immer in vollem Gange. Täglich wird mit dem fünf Monate alten Flaschenkind das Alleinsein trainiert, denn das Loslassen fällt beiden Seiten schwer. Gleichzeitig versuchen die Tierpfleger, Sina schrittweise an den Kontakt mit ihren Artgenossen zu gewöhnen. Als Betthupferl gibt's für Sina zum ersten Mal auch etwas Lebendiges zum Fressen. Ob sie damit schon etwas anzufangen weiß?
