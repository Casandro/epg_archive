  description: 'Que serions-nous sans le mucus ? À quoi ressemblent les aliens ? Pourrions-nous traverser le globe terrestre de part en part ? Clin d''oeil au roman culte de Douglas Adams, Le guide du voyageur galactique, cher à la communauté geek et à l''origine de l''engouement pour le nombre 42, clef de ''''la grande question sur la vie, l''univers et le reste'''', cette nouvelle série documentaire répond à toutes les interrogations majeures de la science ou presque. Chacun des épisodes, porteurs d''un ADN commun mêlant animations graphiques, vidéos et interviews de scientifiques, explore un thème unique. Réalisateur: Max Lebsanft (2026)'
