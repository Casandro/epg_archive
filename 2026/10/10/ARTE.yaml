  title: Les délices de Ligurie
  subtitle: Des côtes rocheuses à la mer E01. Balade dans les Cinque Terre de Ligurie, où l'on pratique cultures en terrasse, cuisine monastique aux herbes sauvages et pêche durable.
  genre:
  - '144'
  description: 'Entre la côte escarpée et les vallées sauvages de l''arrière-pays ligure, la cuisine traditionnelle des Cinque Terre s''est développée à partir d''un petit nombre d''ingrédients. Berceau du pesto, de la focaccia et du cappon magro, cette région a vu émerger un art culinaire entre terre et mer. Le premier volet de la série explore la bande côtière, longue d''une quinzaine de kilomètres. Elle abrite quelque 7 000 kilomètres de murs en pierre sèche qui délimitent de précieuses terres agricoles cultivées en terrasses. Au Couvent des Capucins de Monterosso, le père Renato Brenz Verca cuisine les herbes sauvages dans la plus pure tradition monastique. À Vernazza, Margherita Ermirio perpétue la tradition des murs de pierre sèche. Avec des citrons cultivés sur ces paysages en forte pente, elle prépare une crostata. Lorenzo Galletti redonne vie à des terrasses abandonnées. Il y cultive des légumes qu''il utilise pour concocter des raviolis. Guido Galletti, l''un des derniers pêcheurs des Cinque Terre, cherche à concilier tourisme et tradition grâce à des techniques de pêche durable et à des plats simples. Réalisateur: Francesca D''Amicis (2026)'
