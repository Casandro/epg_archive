- eventId: 981033
  start: 2026-10-10T16:04:00Z
  stop: 2026-10-10T17:00:00Z
  title: WDR 3 Vesper II
  subtitle: Diana im Bade
  description: |-
    Schon die antike Göttin Diana ahndete Voyeurismus mit aller Strenge. Als der Jäger Aktaion sie und ihre Nymphen beim Baden beobachtet, fackelt sie nicht lange und verwandelt ihn in einen Hirsch - mit schwerwiegenden Folgen: Denn in dieser Gestalt wird der Jüngling von seinen eigenen Hunden getötet. So beschreibt es der antike Dichter Ovid. Illustrationen dieser ebenso tragischen wie berührenden Geschichte finden sich in nahezu jedem Museum mit Gemälden "Alter Meister". Marc-Antoine Charpentier hat darüber 1684 seinen "Actéon" geschrieben. Gedacht war diese "Pastorale en musique" wahrscheinlich für eine Aufführung im Pariser Palais seiner Gönnerin Mademoiselle de Guise. Und es ist naheliegend, dass Charpentier in dem facettenreichen, mal unterhaltsamen, mal tieftraurigen Werk selbst die Titelrolle übernahm. Auch Georg Friedrich Händel widmete Diana eine seiner expressiven Kantaten. Die zweite Stunde der Vesper lädt mit zwei barocken Glanzlichtern zum Kurztrip in die Antike ein.
    von Helga Heyder-Späth
    Die Musikstücke zur Sendung
    <strong>Georg Friedrich Händel</strong><br/>Diana cacciatrice. Kantate, HWV 79<br/>Rachel Redmond, Sopran<br/>Aisling Kenny, Sopran<br/>Irish Baroque Orchestra<br/>Leitung: Peter Whelan<br/>(07'42'')
    <strong>Marc-Antoine Charpentier</strong><br/>Actéon. Pastorale en musique in 6 Szenen, H 481, Teil 1 <br/>Scherzi Musicali<br/>Leitung: Nicolas Achten<br/>(16'50'')
    <strong>Marc-Antoine Charpentier</strong><br/>Actéon. Pastorale en musique in 6 Szenen, H 481, Teil 2 <br/>Scherzi Musicali<br/>Leitung: Nicolas Achten<br/>(23'40'')
