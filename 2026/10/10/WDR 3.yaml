  title: WDR 3 Vesper I
  subtitle: Susanna im Bade
  description: "Voyeurismus gibt es seit Menschengedenken. Schon das Alte Testament erzählt dazu eine eindringliche Geschichte, bei der das voyeuristische Gebaren zweier alter Männer eine vollkommen unschuldige Frau um ein Haar das Leben gekostet hätte: Die schöne und fromme Susanna wird im Park ihres Mannes beim Baden von zwei Richtern beobachtet und von ihnen bedrängt. Sie wollen Susanna zum Beischlaf zwingen, die aber bleibt standhaft. Daraufhin verbreiten die Richter das Gerücht, Susanna habe Ehebruch begangen - was bei Todesstrafe verboten ist. In der inszenierten Gerichtsverhandlung glaubt niemand Susannas Unschuldsbeteuerungen. Erst im letzten Moment kann der junge Prophet Daniel durch eine erneute Befragung der beiden Richter Susannas Unschuld beweisen. Eine dramatische Geschichte, die vor allem bildende Künstler immer wieder inspiriert hat. Aber auch in der Musik hat sie Spuren hinterlassen. Denen geht die erste Vesper-Stunde nach. \nVon Helga Heyder-Späth\nDie Musikstücke zur Sendung\n<strong>Eustache Du Caurroy</strong><br/>Susanne un jour<br/>Doulce Mémoire<br/>Leitung: Denis Raisin Dadre<br/>(6'22'')\n<strong>Adam Jarzebski</strong><br/>Susanna videns (in der Ausführung mit Viola da gamba und Basso continuo)<br/>Juliane Laake, Viola da gamba<br/>Maximilian Ehrhardt, Harfe<br/>(4'59'')\n<strong>Georg Friedrich Händel</strong><br/>Chrystal streams in murmurs flowing.<br/>Arie der Susanna, 2. Akt <br/>aus: Susanna, HWV 66<br/>Ruby Hughes, Sopran<br/>Orchestra of the Age of Enlightenment<br/>Leitung: Laurence Cummings<br/>(8'13'')\n<strong>Giovanni Pierluigi da Palestrina</strong><br/>Susanna ab improbis senibus<br/>The Sixteen<br/>Leitung: Harry Christophers<br/>(6'52'')\n<strong>Orlando di Lasso</strong><br/>Agnus Dei aus: Missa Susanne un jour<br/>Stimmwerck <br/>La Villanella Basel<br/>(4'41'')"
