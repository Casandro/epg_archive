  title: WDR 3 Lesung
  description: |-
    Ein dem Müßiggang zugeneigter Müllerssohn wird vom Hof seines Vaters gejagt. Mit einem sonnigen Gemüt gesegnet, nimmt sich der junge Mann seine Geige und zieht in die Welt hinaus. Auf seiner Reise, die einige amouröse Verwirrungen mit sich bringt und ihn bis nach Italien führt, findet Eichendorffs "Taugenichts" am Ende sein Glück jenseits der Konventionen in einer märchenhaften, freien Existenz.
    Von Joseph Freiherr von Eichendorff<br/>Mit: Dominik Freiberger<br/>WDR <markup type="abbr" abbreviation="2022" correspondent="zweitausendzweiundzwanzig">2022</markup>
    Zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
  subtitle: 'Joseph von Eichendorff: Aus dem Leben eines Taugenichts'
