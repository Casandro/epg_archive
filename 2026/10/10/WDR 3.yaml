  title: WDR 3 Hörspiel
  subtitle: Professor Kiesel. In Stahlgewittern
  description: |-
    Ist es böse und demagogisch? Eine Verherrlichung des Krieges? Oder am Ende in seiner Wirkung ein Antikriegsbuch? Ernst Jüngers Kriegstagebuch und Erlebnisbericht "In Stahlgewittern" ist inzwischen vor allem eines: ein Mythos. Helmuth Kiesel, Herausgeber der historisch-kritischen Ernst Jünger-Ausgabe, kommentiert und kontrapunktiert diesen schillernden Text, seine Entstehungsgeschichte und seine Rezeption. Dieses Hörspiel sammelt die Reflexionen eines Wissenschaftlers - zu den Texten eines Mannes, der als <markup type="abbr" abbreviation="19" correspondent="neunzehn">19</markup>-jähriger in den Krieg zog.
    Regie: Gerrit Booms<br/>Produktion: WDR <markup type="abbr" abbreviation="2014" correspondent="zweitausendvierzehn">2014</markup>
    Ab dem <markup type="abbr" abbreviation="3." correspondent="dritten">3.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
