  start: 2026-10-10T05:30:00Z
  stop: 2026-10-10T06:00:00Z
  title: Sehen statt Hören
  subtitle: 'Kunst trifft Gebärdensprache: ABC - Always be Communicating / Christine Sun Kim - CK'
  description: Was haben Gebärdensprache, Emojis und Kunst gemeinsam? Mehr, als man auf den ersten Blick denkt. Mitten in München zeigt die Ausstellung "ABC - Always Be Communicating" von Christine Sun Kim (CK) und ihrem Partner Tom, wie sich Sprache verändert, in der digitalen Welt weiterentwickelt und neue Verbindungen schafft. Für Sehen statt Hören macht sich Moderator Ace Mahbaz auf Entdeckungsreise - durch Kunst, Geschichte und die vielen Wege, miteinander zu kommunizieren.
- eventId: 602670
  start: 2026-10-10T06:00:00Z
  stop: 2026-10-10T06:30:00Z
  title: Die Ratgeber
  subtitle: Auto abgeschleppt - was tun?
  description: "Man kommt vom Einkauf zurück und das Auto ist weg. Nicht geklaut, sondern abgeschleppt. \"Die Ratgeber\" klären, was dann zu tun ist.\n \nWeitere Themen:\n* Serie: Spitzenkoch Ali Güngörmüs hat 15 Schülerinnen und Schüler zum gemeinsamen Kochen eingeladen.\n* Reporterin Kate Menzyk besucht ein Papiertheater in Buseck bei Gießen\n* Außerdem schauen sich \"Die Ratgeber\" an, was Camper beachten sollten, wenn man den Hund mit auf Tour nehmen will."
- eventId: 643482
  start: 2026-10-10T06:30:00Z
  stop: 2026-10-10T07:00:00Z
  title: Mit Mut, Mörtel und Millionen Tipps
  subtitle: 'Ein Schloss: 60 Zimmer, 100 Fenster'
  description: 'Seit mehr als 20 Jahren retten Knut Splett-Henning und seine dänische Ehefrau Christina von Ahlefeldt-Laurvig marode Gutshäuser in Mecklenburg-Vorpommern. Jetzt wagen sie sich an ein Haus der Superlative: Schloss Lüssow, 3.000 Quadratmeter, mehr als 100 marode Fenster, Deckenhöhen von fast sechs Metern. Sie wollen es scheibchenweise bewohnbar machen. Wie kaufe ich ein Gutshaus? Worauf muss ich achten? Welche der 1.000 Arbeitsschritte mache ich zuerst? Die Gutshausretter und ihre Experten wissen, wie der Traum vom eigenen Schloss nicht zum Albtraum wird.'
