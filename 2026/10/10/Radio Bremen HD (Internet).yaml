  title: DAS! Rote Sofa
  subtitle: 'Gäste: Heinz Galling, Moderator und Horst Hennings, Angelexperte'
  description: "\"Rute raus, der Spaß beginnt!\": Seit 15 Jahren ist diese\nAngelsendung ein festes und geliebtes Stück\nnorddeutscher Fernsehkultur im NDR. Und ohne sie ist das Erfolgsformat undenkbar: Heinz Galling und Horst\nHennings. Gemeinsam erkunden sie die schönsten\nAngelreviere Norddeutschlands und ganz Europas. \nAnlässlich dessen 80. Geburtstages widmet Heinz Galling seinem langjährigen Freund und Kollegen Horst Hennings nun ein ganz besonderes Geschenk: die Biografie \"Horst Hennings: Ein Leben zwischen Tür und Angel\"."
- eventId: 1635337
  start: 2026-10-10T04:00:00Z
  stop: 2026-10-10T04:30:00Z
  title: Alles für den Hund
  subtitle: Hamburg komplett wau wau
  description: Mehr als 100.000 Hunde leben in Hamburg. Die Freie und Hansestadt gilt als eine der hundefreundlichsten Städte Deutschlands. Und so fließen jährlich fünfeinhalb Millionen Euro Hundesteuer in die Stadtkasse. Auch Industrie und Dienstleister sind an der Elbe voll auf den Hund gekommen und auf ihre Kosten, denn den City-Dogs, ihren Frauchen und Herrchen soll es an nichts fehlen.
- eventId: 1636216
  start: 2026-10-10T04:30:00Z
  stop: 2026-10-10T05:00:00Z
  title: 'Die Nordreportage: Großes Herz für schwierige Hunde'
  subtitle: Tierheim-Chef im Dauereinsatz
  description: Dominic Köppens große Herausforderung ist Jahr für Jahr, die Finanzierung des Tierheim Oldenburg sicherzustellen, um so eine bestmögliche Aufnahme, Versorgung und Vermittlung der Tiere zu garantieren. Nicht erst seit der Corona-Pandemie eine große Aufgabe. Schlechter Schlaf ist für Dominic Köppen an der Tagesordnung. Die Schicksale seiner Tiere gehen ihm persönlich nahe, bei aller Professionalität.
  genre:
  - '112'
