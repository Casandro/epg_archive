  title: Kriminálka
  description: 'Závist - Nález mrtvé ženy v domě s pečovatelskou službou. Nešťastná náhoda se ale po soudní pitvě změní ve vraždu. Žena neupadla na hranu nábytku, jak se původně zdálo, ale někdo ji utloukl. Jaký měl vrah důvod stařenku napadnout, když z bytu nic cenného nezmizelo? A kdo ženu navštívil, když svědci neviděli nikoho cizího vcházet do domu? Jihlavská kriminálka v dlouhém pátrání po útočníkovi, na jehož konci detektivy čekalo nejedno překvapení. Autor, dramaturgie: Dana a Mirek Vaňurovi.'
