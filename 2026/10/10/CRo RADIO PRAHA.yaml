  title: Host Lenky Vahalové
  description: Do studia přijde herec JAN POLÍVKA. Původně hrál závodně basketbal, nakonec se ale rozhodl pro herectví. V současné době studuje fyzické divadlo na JAMU, rád by zrežíroval film a stejně jako jeho bratr Vladimír - rád maluje obrazy. Společně se svým otcem Bolkem Polívkou a bratry nazkoušel inscenaci Anděl v lihu. O čem je? Jaké bylo tvořit se svojí rodinou? A proč je pro něho přirozené vyjadřovat emoce skrze pohyb? Moderuje Lenka Vahalová
- eventId:
  - 1593173
  - 1597939
  start: 2026-10-10T22:00:00Z
  stop: 2026-10-10T23:00:00Z
  title: Kriminálka
  description: 'Závist - Nález mrtvé ženy v domě s pečovatelskou službou. Nešťastná náhoda se ale po soudní pitvě změní ve vraždu. Žena neupadla na hranu nábytku, jak se původně zdálo, ale někdo ji utloukl. Jaký měl vrah důvod stařenku napadnout, když z bytu nic cenného nezmizelo? A kdo ženu navštívil, když svědci neviděli nikoho cizího vcházet do domu? Jihlavská kriminálka v dlouhém pátrání po útočníkovi, na jehož konci detektivy čekalo nejedno překvapení. Autor, dramaturgie: Dana a Mirek Vaňurovi.'
