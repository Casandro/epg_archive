  description: Op sociale media gaan veel video's rond over het gebruik van AI als therapeut, adviseur en zelfs vriend. Deskundigen waarschuwen voor verslaving aan kunstmatige intelligentie. Het gebruik van chatbots voor emotionele steun kan leiden tot afhankelijkheid. Pim Haselager, hoogleraar Artificiële Intelligentie aan de Radboud Universiteit vertelt dat verslaving in de hand wordt gewerkt doordat bijvoorbeeld ChatGPT altijd opbeurend is, altijd geïnteresseerd en het altijd met je eens is. Doordat AI niet oordeelt en mensen wel lijkt de chatbot veilig, maar juist daardoor kunnen gebruikers eenzaam worden en in de put raken. (2026)
