  subtitle: Finland, Roadtrip Zuid-Finland S20 E06. Eva vervolgt haar reis door Finland en maakt een roadtrip door het Finse Merengebied.
  description: Eva vervolgt haar reis door Finland en maakt een roadtrip door het Finse Merengebied. Finland staat bekend om het noorderlicht, sneeuw en rendieren maar Eva laat zien dat het er in de zomer minstens zo mooi is. Op Lake Saimaa gaat ze op zoek naar de zeldzaamste zeehond ter wereld en in het Koli National Park maakt ze een hike naar het mooiste uitkijkpunt van Finland. In Tampere, de sauna-hoofdstad van het land, maakt ze kennis met de Finse saunacultuur en sluit ze haar reis af op de tribune bij een wedstrijd van pesäpallo-kampioen Manse PP. (2026)
