  title: Het klokhuis
  subtitle: Dialecten S37 E4672. Wist je dat veel mensen in Nederland elkaar vroeger helemaal niet konden verstaan? In iedere regio had je een andere streektaal, met eigen woorden en klanken. Dat noem je een dialect.
  description: 'Wist je dat veel mensen in Nederland elkaar vroeger helemaal niet konden verstaan? In iedere regio had je een andere streektaal, met eigen woorden en klanken. Dat noem je een dialect. Pas toen het reizen makkelijker werd en Nederland een onafhankelijk land werd, groeide de behoefte aan één taal: het Standaardnederlands. Maar, wat is er met die dialecten gebeurd? Serah gaat langs bij kinderen uit groep 8 in Limburg en bij de zussen Fenne en Imke uit Twente. Ridder William zoekt een nieuwe voice-over, het liefst eentje met een leuk dialect. (2023)'
  genre:
  - '16'
