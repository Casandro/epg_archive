  subtitle: S18 E136. Martine van Os en Sybrand Niessen ontvangen een keur aan gasten. Een aangename mix van nieuws, kunst, cultuur en entertainment.
  description: Een surfdrama in Scheveningen maakte een einde aan het leven van Sander Dikken. Nu, zes jaar later deelt zijn familie, waaronder zus Susanne Dikken, het verdriet in de film Schuim. Bart Grimbergen maakte de documentaire. * Dyantha Brooks presenteert een nieuwe kennisquiz waarbij het niet alleen om kennis draait, maar ook om vertrouwen. Wie houd je te vriend en wie schakel je uit? * Ramon Brugman staat in onze keuken om een lekker gerecht te maken uit zijn nieuwe kookboek. * Tijdens de Nacht van de Nederpop XXL wordt het publiek meegenomen langs de soundtracks van meerdere generaties. Mai Tai geeft bij ons een voorproefje van dit spektakel. (2026)
