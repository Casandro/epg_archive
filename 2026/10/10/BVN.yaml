  description: De Strabrechtse Heide in Brabant kleurt paars en zoemt van de insecten. Menno Bentveld gaat mee met een schaapsherder en haar kudde kempische heideschapen. Zij sturen dit landschap al duizenden jaren en werken hard om vergrassing van de heide tegen te gaan. De klokjesgentiaan en de rugstreeppad profiteren hiervan. Het is wel hard werken voor de schapen, in deze tijden van droogte en stikstofproblemen. Het hele ecosysteem, van wulp tot oeverkruid en van rupsendoder tot zwarte ooievaar, wordt daardoor beïnvloed. (2026)
