  description: 'Jazzzangeres Fay Claassen neemt plaats naast Jan. Met vier Edisons en een internationale carrière behoort ze tot de grote Nederlandse jazzstemmen. Zoë Livay vertolkt Is Dit Alles van Doe Maar, een van de Nederlandse liedjes die Fay omvormde tot jazz. Yves Berendse zingt Momenten, over de bijzondere band met haar vader, voor wie Fay tien jaar lang zorgde toen hij alzheimer had. Desray brengt Feel The Beat, Fays eerste volledig eigen compositie, over het vinden van je eigen tempo en de moed om je dromen na te jagen. Acteurs: Yves Berendse (Self), Fay Claassen (Self), Zoë Livay (Self), Jeangu Macrooy (Self), Désirée Manders (Self) (2026)'
