  description: Rutger ontmoet Alex, die na jaren van verslaving en dakloosheid opnieuw richting probeert te geven aan zijn leven met zijn tekeningen. Bij kapper Yahia hoort Rutger hoe diens succesvolle bestaan in Nederland samengaat met een kritische blik op nieuwe Syrische vluchtelingen. In Ter Apel spreekt Rutger met Ashe, een Amerikaanse transvluchteling die zich juist in Nederland veilig hoopt te voelen, terwijl het onzeker is of die hier mag blijven. (2026)
