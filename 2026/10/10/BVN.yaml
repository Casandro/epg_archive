  subtitle: S22 E24. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: Smartwatches en fitnesstrackers meten onder meer hartslag, slaap- en stressniveau en geven daarmee inzicht in de gezondheid. Maar bij sommige gebruikers leiden de metingen juist tot gezondheidsklachten. Hoe ontstaat dit en welke rol spelen techbedrijven bij het bepalen van de meetgegevens? Ook onderzoekt Radar misleidende mails uit naam van gemeenten, waarmee consumenten worden verleid hun gegevens achter te laten voor een energiepeiling. In werkelijkheid worden zij gebeld voor de verkoop van een energiecontract, soms met een opzegboete tot gevolg. Fons onderzoekt of energieleveranciers hiervan op de hoogte zijn. (2026)
