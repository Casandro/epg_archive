  description: 'We kijken uit over de wereldzeeën met Piet Hein, de beroemde zeeheld. Hij vertelt ons alles over de oorlog op zee, over handel met Amerika en Afrika en over de zilvervloot die hij buitmaakt op de Spanjaarden. In 1648 is het eindelijk vrede: de Tachtigjarige Oorlog is voorbij. Met onder andere De driehoekshandel, Kaapvaart en De zilvervloot. Regisseur: Niek Barendsen. Acteurs: Rogier in ''t Hout (Multiple roles), Ydwer Bosma (Multiple roles), Ruben Brinkman (Multiple roles), Hajo Bruins (Man Vrede van Munster), Guy Clemens (Kapitein) (2017)'
