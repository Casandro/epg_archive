  description: In het Cobra Museum komt een tazza, ondiepe schaal, aan bod. Men schonk hier vroeger wijn in en dan kwam er uit de middelste bol een figuurtje tevoorschijn. Dat wordt Hansje in de kelder genoemd. Dit soort tazza's met een verschijnend figuurtje in het midden zijn erg zeldzaam. Expert Emiel Aardewerk neemt een kijkje in het Zilvermuseum waar een "Hansje in de kelder" staat uit de 17e eeuw, en meer zilveren geboortegeschenken. (2024)
