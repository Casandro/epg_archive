  title: De Bauers, een nieuwe fase
  subtitle: S01 E07. Lucas, de jongste telg van de familie, droomt over zijn toekomst en ziet zichzelf wel als muziekproducer en wil het groots aanpakken. Ook ontdekt hij zijn rol als peetoom van baby Jantje.
  description: 'Lucas, de jongste telg van de familie, droomt over zijn toekomst en ziet zichzelf wel als muziekproducer. Tot verbazing van Frans en Mariska pakt hij het groots aan: hij wil pianoles en een speciaal programma aanschaffen om muziek te maken. Dit baart de rest van het gezin zorgen, want Lucas heeft een nét wat andere muzieksmaak. Ondertussen is Lucas gekozen tot peetoom van baby Jantje. Een rol die hij vooral vervult door veel cadeautjes te brengen en rond te hangen bij Jan en Danique. Tijdens de doop ontdekt hij dat er toch wat meer bij komt kijken. Voor deze bijzondere dag trekt de hele familie naar de Basiliek in Oudenbosch. (2026)'
  genre:
  - '32'
- eventId: 1613482
