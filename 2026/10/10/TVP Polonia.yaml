    PL, 1968
    Reżyseria: Janusz Morgenstern
    Występują: Stanisław Mikulski, Bronisław Pawlik, Władysław Hańcza, Gustaw Lutkiewicz, Ignacy Machowski, Seweryn Butrym
    Hrabia Edwin Wąsowski, członek polskiego ruchu oporu, uchodzi za Austriaka. Jest właścicielem wspaniałego majątku, wydaje przyjęcia i polowania, na których bywa wielu niemieckich generałów i dygnitarzy. Pewnego wieczoru Niemcy przypadkiem odkrywają u Wąsowskiego skrytkę z materiałami szpiegowskimi i dolarami. Hrabia zostaje aresztowany. Kloss daje mu do zrozumienia, że nie można go uratować, natomiast on może pogrążyć wielu Niemców.
  ageRating: 7
  genre:
  - '18'
  subtitle: Rok 1943. Podczas kolacji kończącej polowanie w majątku hrabiego Wąsowskiego, agenta polskiego wywiadu, Niemcy odkrywają skrytkę, w której znajdują się mikrofilmy. Hrabia zostaje aresztowany.
