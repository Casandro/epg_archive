  title: Przygody psa Cywila - odc. 1/7 Trudne dzieciństwo
  description: |-
    Tytuł oryginalny: Przygody psa Cywila
    PL, 1968
    Reżyseria: Krzysztof Szmagier
    Występują: Krzysztof Litwin, Wojciech Pokora, Henryk Bąk, Elżbieta Borkowska, Józef Pieracki, Zofia Czerwińska
    "Przygody psa Cywila", serial utrzymany w konwencji kina kryminalno-komediowego, w latach siedemdziesiątych wielokrotnie wznawiany, cieszył się sporą popularnością. Udany duet stworzyli w nim Krzysztof Litwin jako nieco flegmatyczny i nieporadny sierżant milicji Walczak oraz wilczur Bej w roli jego wiernego towarzysza i pomocnika. Reżyser zadbał, by filmowy Cywil nie cierpiał na brak niebezpiecznych przygód.
  genre:
  - '18'
  subtitle: Cywil przychodzi na świat w Zakładzie Tresury Psów Milicyjnych. Jako "nadliczbowy" zostaje przeznaczony do uśpienia. Sierżant milicji postanawia uratować szczeniaka.
