    Lucjan i Barbara Mostowiakowie wychowali czworo dzieci: Marię, Martę, Marka i Małgorzatę. Najstarsza, Maria, z zawodu pielęgniarka, wyjechała z Grabiny do Gródka i z mężem doczekała się synów Piotra i Pawła. Jej siostra, Marta, skończyła studia prawnicze i zamieszkała w Warszawie. Marek i Małgosia, przysparzający rodzicom więcej zmartwień niż starsze rodzeństwo, również podjęli starania o ułożenie sobie życia.
