  title: Echo serca s.I - odc. 16
  description: |-
    Tytuł oryginalny: Echo serca
    PL, 2019
    Reżyseria: Tomasz Szafrański
    Występują: Kamilla Baar-Kochańska, Antoni Pawlicki, Przemysław Sadowski, Dorota Segda, Dorota Pomykała, Julia Pogrebińska
    Pobity przez nieznanych sprawców Thomas trafia nocą na ostry dyżur. Opiekę nad nim roztacza Szymek z udziałem Anity i Bartka, którzy, korzystając z okazji, w jawny sposób manifestują swoją niechęć wobec nowego pacjenta. Przerażenie Thomasa narasta, a jego kulminacja następuje, gdy Szymek oznajmia, że w operacji nastawienia złamanej nogi doktora weźmie udział student - Bartek Winiarski. Policja próbuje ustalić okoliczności, w jakich doszło do samobójczej śmierci Konrada.
  ageRating: 12
