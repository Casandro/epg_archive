    Zuzia słabo sobie radzi z wyszukiwaniem akt poukładanych według tajemniczego systemu Mikosa. Niebawem w archiwum zjawia się policjant z teczką sprawy, którą śledczy próbowali rozwikłać przez ostatnie dwa lata. Wasiluk przegląda akta, a Mikos opowiada jej, że dyrygent chóru Zygmunt Mazur zginął od strzału w głowę z pistolety P - 38 Wanat, popularnej broni wojskowej. Mogłoby to wyglądać na samobójstwo, gdyby nie fakt, że broń zniknęła z miejsca zbrodni.
