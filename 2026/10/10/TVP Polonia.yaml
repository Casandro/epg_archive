  title: Ranczo s.IV - odc. 40 (seria IV, odc. 1) - Szok poporodowy
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2008
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Grzegorz Wons, Artur Barciś, Marta Lipińska
    Czwarta seria odcinków serialu komediowego, którego trzy pierwsze serie gromadziły przed telewizorami rekordową widownię sięgającą 7 mln osób. Śledzimy dalsze losy młodej Amerykanki Lucy Wilskiej, która osiedliła się w małej wsi Wilkowyje na Podlasiu. Zderzenie różnych mentalności - wielkomiejskiej, amerykańskiej, z wiejską (tzw. Polska B) przynosi nieoczekiwane, często bardzo zabawne efekty. Lucy rodzi córeczkę. Na wieść o tym Kusy mdleje. Boi się, że nie podoła roli ojca.
  ageRating: 12
  genre:
  - '23'
  subtitle: Lucy rodzi córeczkę. Na wieść o tym Kusy mdleje. Boi się, że nie podoła roli ojca. Wybiera dla córeczki imię Dorotka. W nocy czuwa w fotelu przy jej łóżeczku.
- eventId: 1442276
  start: 2026-10-10T01:10:00Z
