  subtitle: Thomas trafia na ostry dyżur po pobiciu przez nieznanych sprawców. Do szpitala trafia wyziębiony pięcioletni Łukasz, który w nocy zniknął z domu i został odnaleziony dopiero po kilku godzinach.
