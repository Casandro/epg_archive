  title: Tańcząca ze światem - Tunezja - Sahara
  description: |-
    Tytuł oryginalny: Tańcząca ze światem
    PL, 2023
    Reżyseria: Piotr Poraj-Poleski
    Program lifestylowo - podróżniczy, w którym prowadząca, Edyta Herbuś, pokazuje widzom piękno odwiedzanych miejsc. Podziwia malownicze krajobrazy, charakterystyczne rzemiosło, rozmawia z ludźmi o lokalnych tradycjach i obrzędach. Kosztuje regionalnych potraw, zwiedza najważniejsze zabytki, uczestniczy w lokalnych aktywnościach. Rozmawia o życiu i postrzeganiu kobiety w danym regionie.
  ageRating: 12
  subtitle: Sahara to największa piaszczysta pustynia. Na tej pozornie opuszczonej przestrzeni toczy się życie. Można tu spotkać Beduinów, oazy i wielbłądy.
  genre:
  - '35'
