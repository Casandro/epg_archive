    Sierżant Walczak podejmuje mozolne i pełne zabawnych nieraz perypetii szkolenie Cywila. Wspólna praca bardzo zbliża psa i jego opiekuna. W rezultacie obopólnych wysiłków Cywil zdaje egzaminy jako eksternista w Zakładzie Tresury Psów i otrzymuje dyplom. Odtąd może już brać udział w akcjach policyjnych.
