  title: Buchty
  description: Buchty o tom, k čemu je dobré zahradní jezírko, co se dělá na dětském puťáčku a jaké jsou momentálně trendy ve stříhání vlasů. Do Buchet dorazila kadeřnice Jana, které se Ivana a Zuzana mimo jiné vyptávaly, co teď v oblasti účesů takzvaně trendí a taky zda si lidé v krizi obvykle stříhají ofinu. Probraly ale společně i Janino zahradní jezírko a její volnočasovou aktivitu brouzdání s dětmi po lese. (repríza)
