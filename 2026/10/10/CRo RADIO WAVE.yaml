  description: Spojenými státy otřásla kauza údajného hromadného znásilnění na Cornellově univerzitě. Otevřela se znovu poté, co bývalá studentka zažalovala prestižní Ivy league školu s tím, že ji dostatečně neochránila. Mohlo by se něco podobného stát i v Česku? Poslouchejte Impakt s ombudsmankou Univerzity Karlovy Kateřinou Šamálovou a výzkumnicí Zuzanou Andreskou. (repríza)
