  title: Der Nazi-Clan (3/6)
  subtitle: 'Hitlers Hofstaat: Hess'
  widescreen: true
  hd: true
  description: "Rudolf Hess Hitlers Stellvertreter. Viele halten ihn für verrückt, als er 1941 nach Schottland fliegt und in britischer Haft landet. Neue Forschungen zeichnen ein verblüffend anderes Bild. \nRudolf Hess ist der fanatischste Komplize des Diktators. Als Strippenzieher in der NSDAP bildet er über Jahre eine entscheidende Säule von Hitlers Macht. Nach dem mysteriösen Schottlandflug spielt Hess psychische Probleme vor, in der Hoffnung, freigelassen zu werden. Seine bedingungslose Loyalität verschafft ihm schon in den Anfangsjahren der NSDAP als Privatsekretär eine wichtige Rolle an der Seite Hitlers."
