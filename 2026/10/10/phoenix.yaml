  title: Der Mississippi
  subtitle: Die größten Flüsse der Erde
  widescreen: true
  hd: true
  description: Aus fast der Hälfte der Fläche der Vereinigten Staaten fließt das Wasser des Mississippi Richtung Süden in den Golf von Mexiko. Seinen Ursprung hat der Strom in schmalen, oft wenig bekannten Quellflüssen in den Ausläufern der Rocky Mountains. Hier dauert der Winter nicht selten fünf Monate. Dann sind Milliarden Tonnen Wasser zu Eis und Schnee erstarrt und bis zum Frühling gefangen.
