  title: Der Nazi-Clan
  subtitle: 'Hitlers Hofstaat: Eva Braun'
  widescreen: true
  hd: true
  description: Eva Braun Hitlers heimliche Geliebte. Kurz vor Kriegsende heiratet sie den Diktator im Berliner Führerbunker und folgt ihm in den Tod. Wer ist die Frau im Schatten des Massenmörders? Was weiß sie über die verbrecherische Politik ihres Geliebten? Welchen Einfluss hat das Privatleben des Paares auf die Entscheidungen des Diktators? Eva Braun ist 17, als sie den 40-jährigen Hitler in München kennenlernt. Von da an steht sie ihm bedingungslos loyal zur Seite.
