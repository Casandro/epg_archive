  title: Auschwitz - Überleben in der Hölle (2/3)
  subtitle: Todesfabrik
  widescreen: true
  hd: true
  description: |-
    Im Frühjahr 1943 nimmt die SS vier neue Gaskammern in Betrieb. Das KZ Auschwitz-Birkenau wird zur Todesfabrik. Aufseherinnen wie Irma Grese terrorisieren die Häftlinge.

    In der zweiten Folge der Doku-Reihe kommen auch Anita Lasker, Gisella Perl und Eva Mozes in Auschwitz an. Für die Häftlinge beginnt der Kampf ums Überleben.

    Im Frühjahr 1943 richtet sich die SS Auschwitz darauf aus, das größte und effizienteste Vernichtungslager zu werden.

    Im Dezember wird Anita Lasker nach Auschwitz deportiert. Dass sie Cello spielen kann, erhöht die Überlebenschancen der 18-Jährigen: Sie wird Mitglied im Mädchenorchester des Lagers.
