  description: 'Sie war die Ikone der deutschen Friedens- und Umweltbewegung: Petra Kelly glaubte daran, dass ein einzelner Mensch die Welt verändern kann. In den 1980-er Jahren brachte sie hunderttausende Menschen gegen Atomkraft und Atomraketen auf die Straße. Die radikale Pazifistin, Menschenrechtsaktivistin und Feministin war eine Ausnahmeerscheinung. Ihr Leben war ein großer Wurf, ihr Ende eine Tragödie. Petra Kelly: Kämpferin gegen Atomkraft, Gründungsmitglied der Grünen, Ikone der Friedensbewegung. Unbeirrbar forderte sie die radikale Transformation der Gesellschaft, eine blockfreie Welt ohne Waffen und den Frieden mit der Natur.'
