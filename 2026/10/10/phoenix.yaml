  title: 'Terra X-History: Wilde Zeiten'
  subtitle: Das letzte Jahr der DDR
  widescreen: true
  hd: true
  description: |-
    Als 1989 die Mauer fällt, ist nichts mehr so wie vorher. Das Jahr bis zur Wiedervereinigung ist wild, verrückt und chaotisch. Keiner weiß, was die Zukunft bringt, alles scheint möglich.

    Nach 40 Jahren sozialistischer Diktatur bricht plötzlich die staatliche Kontrolle weg. Viele DDR-Bürger fühlen sich befreit, viele aber auch verunsichert und allein gelassen. Im ganzen Land herrscht eine Stimmung zwischen Aufbruch und Anarchie.

    Die Erstürmung der Stasi-Zentrale in Ostberlin geht um die Welt. Aber die Bürger der DDR räumen auch anderswo auf. Parteichefs, Bürgermeister, Schuldirektoren werden aus ihren Ämtern gefegt.
- eventId:
  - 1039706
  - 832839
  start: 2026-10-10T09:30:00Z
  stop: 2026-10-10T10:15:00Z
  title: Die Andersdenkenden
  subtitle: Was aus DDR-Bürgerrechtlern wurde
  widescreen: true
  hd: true
  description: "Der Mauerfall änderte die Perspektiven der Demokratiebewegung. Das Ziel einer reformierten DDR wich dem Wunsch nach Wiedervereinigung. Mit den Volkskammerwahlen 1990 war klar, dass der Weg zur Einheit führt. \n\nFür die meisten Bürgerrechtler endete die Revolution. Sie kehrten in Berufe zurück. Andere, wie Katrin Göring-Eckardt, Antje Hermenau und Matthias Platzeck, setzten ihre politische Laufbahn fort. \n\nSendehinweis: 04.10.2026, 01:30 Uhr."
