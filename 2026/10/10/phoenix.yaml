  title: Auschwitz - Überleben in der Hölle
  subtitle: Terror
  widescreen: true
  hd: true
  description: |-
    1940 errichtet die SS das erste KZ im besetzten Polen: Auschwitz. Wilhelm Brasse ist einer der ersten Gefangenen. Er muss Häftlinge fotografieren und erlebt von Anfang an Gewalt.

    Die erste Folge der Doku-Reihe erzählt, wie sich die Leben der späteren Auschwitz-Opfer und -Täter mit dem Aufstieg von Hitler und den Nationalsozialisten verändern. In Auschwitz kreuzen sich ihre Wege.

    Anita Lasker wächst in Breslau in einer jüdischen Familie auf. Dort erlebt sie die zunehmende Ausgrenzung von Juden. Anita spielt Cello, findet aber bald keinen Lehrer mehr, der sie unterrichtet.
- eventId:
  - 1039589
  - 832765
  start: 2026-10-10T03:45:00Z
  stop: 2026-10-10T04:30:00Z
  title: Auschwitz - Überleben in der Hölle
  subtitle: Todesfabrik
  widescreen: true
  hd: true
  description: |-
    Im Frühjahr 1943 nimmt die SS vier neue Gaskammern in Betrieb. Das KZ Auschwitz-Birkenau wird zur Todesfabrik. Aufseherinnen wie Irma Grese terrorisieren die Häftlinge.

    In der zweiten Folge der Doku-Reihe kommen auch Anita Lasker, Gisella Perl und Eva Mozes in Auschwitz an. Für die Häftlinge beginnt der Kampf ums Überleben.

    Im Frühjahr 1943 richtet sich die SS Auschwitz darauf aus, das größte und effizienteste Vernichtungslager zu werden.

    Im Dezember wird Anita Lasker nach Auschwitz deportiert. Dass sie Cello spielen kann, erhöht die Überlebenschancen der 18-Jährigen: Sie wird Mitglied im Mädchenorchester des Lagers.
- eventId:
  - 1039590
  - 832766
  start: 2026-10-10T04:30:00Z
  stop: 2026-10-10T05:15:00Z
  title: Auschwitz - Überleben in der Hölle
  subtitle: Befreiung
  widescreen: true
  hd: true
  description: |-
    Die Wehrmacht ist 1944 an allen Fronten auf dem Rückzug. Doch in Auschwitz wird weiter gemordet. Für das Liebespaar Helen Spitzer und David Wisnia beginnt ein Wettlauf mit der Zeit.

    In der dritten Folge der Doku-Reihe hoffen die Häftlinge in Auschwitz auf Befreiung. Als die Front näher rückt, werden die Gefangenen in KZs im Reich verlegt. Helen Spitzer und David Wisnia werden getrennt. Sie hoffen, sich nach dem Krieg wiederzusehen.

    Viele in Hitlers Regime glauben noch an den sogenannten Endsieg. Die SS schlägt im Oktober 1944 brutal einen Aufstand von Auschwitz-Häftlingen nieder.
