  title: Der Nazi-Clan
  subtitle: 'Hitlers Hofstaat: Hess'
  widescreen: true
  hd: true
  description: Rudolf Hess Hitlers Stellvertreter. Viele halten ihn für verrückt, als er 1941 nach Schottland fliegt und in britischer Haft landet. Neue Forschungen zeichnen ein verblüffend anderes Bild. Rudolf Hess ist der fanatischste Komplize des Diktators. Als Strippenzieher in der NSDAP bildet er über Jahre eine entscheidende Säule von Hitlers Macht. Nach dem mysteriösen Schottlandflug spielt Hess psychische Probleme vor, in der Hoffnung, freigelassen zu werden. Seine bedingungslose Loyalität verschafft ihm schon in den Anfangsjahren der NSDAP als Privatsekretär eine wichtige Rolle an der Seite Hitlers.
- eventId:
  - 1039478
  - 832736
  start: 2026-10-10T00:45:00Z
  stop: 2026-10-10T01:30:00Z
  title: Der Nazi-Clan
  subtitle: 'Hitlers Hofstaat: Speer'
  widescreen: true
  hd: true
  description: Albert Speer Hitlers Architekt und Rüstungsminister.1933 lernt er Hitler kennen. Dessen Gunst dient ihm als Karrieresprungbrett. Vom Baumeister des Diktators steigt er zum mächtigen Rüstungsminister auf. In seinen Fabriken sterben Millionen. Speers Ehrgeiz verlängert den Krieg. Hitler hält Speer für ein Organisationstalent, sieht in ihm einen ebenbürtigen Künstler, der seinen Größenwahn in Stein meißeln soll. Am Modelltisch planen beide die neue Reichshauptstadt Germania. Nach dem Krieg gibt sich Speer reumütig und unwissend. Ist er wirklich der gute Nazi oder einer der größten Lügner der NS-Zeit?
- eventId:
  - 1039479
  - 832737
  start: 2026-10-10T01:30:00Z
  stop: 2026-10-10T02:15:00Z
  title: Der Nazi-Clan
  subtitle: 'Hitlers Hofstaat: Martin Bormann'
  widescreen: true
  hd: true
  description: Martin Bormann Hitlers Privatsekretär. Im Hintergrund zieht er die Fäden, kontrolliert den Zugang zum Diktator. Der notorische Schürzenjäger wird nach dem Krieg zum meistgesuchten Deutschen. Bormann steigt vom kleinen Parteifunktionär zu Hitlers zeitweise mächtigstem Handlanger auf skrupellos, intrigant, brutal. Er kontrolliert die Finanzen der Partei und baut den Obersalzberg zur zweiten Machtzentrale aus. Mit absolutem Gehorsam und bedingungsloser Loyalität macht er im Machtapparat Karriere. Bormann bleibt Hitler bis zuletzt treu ergeben. Nach dem Suizid des Diktators verliert sich die Spur des stiernackigen Schattenmannes.
- eventId:
