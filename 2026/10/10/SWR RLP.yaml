  title: Hierzuland
  subtitle: Die Segbachstraße in Thür
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    * Die Segbachstraße in Thür
    Thür liegt am Rande eines Talkessels, inmitten weiter Felder. Hier leben etwa 1600 Menschen. In der Segbachstraße, in der es einen kleinen Dorfgarten gibt, erfahren Schulkinder, wie Gemüse oder Obst gepflanzt und geerntet wird. Am Dorfplatz in der Segbachstraße findet einmal im Jahr die Veranstaltung "Rock am Sumpf" statt. Dann treffen sich Nachwuchs-Bands und alle Generationen von Thür und Umgebung. Schwarze Basalt-Häuser prägen das Bild der Straße, ein Material, mit dem früher gebaut wurde. Ein kleines Highlight sind die Wasserbüffel in den Thürer Wiesen, über die unter anderem Manfred Berresheim wacht.
