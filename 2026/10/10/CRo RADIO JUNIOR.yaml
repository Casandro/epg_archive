- eventId:
  - 1592886
  - 1598132
  start: 2026-10-10T17:00:00Z
  stop: 2026-10-10T17:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: David Dobeš, mykolog. Je pravda, že když se podíváš na hříbek nebo křemenáč, už nevyroste? Jak vypadají houby pod zemí? Jaká další tajemství v nich lidé pořád objevují? A proč je spousta lidí nechce jíst, ale vstávají v pět ráno, aby jich našli co nejvíc? O tom všem se dozvíte od mykologa Davida Dobeše. Repríza pořadu.'
- eventId:
  - 1592887
  - 1598133
  start: 2026-10-10T17:50:00Z
  stop: 2026-10-10T18:00:00Z
  title: Hajaja
  description: O nejkrásnějším ostrově 6/7 - O ostrově draků. Poslouchat rady rodičů se dětem často nechce. Zvláště když si myslí, že poučení jsou už zastaralá a nepotřebná. Právě takové připadalo malému Fumiovi pravidlo, že se lidé k sobě mají chovat slušně a že si nikdo nemůže dělat jen to, co sám chce. Rozhodl se, že najde takové místo, kde si každý žije podle svého přání a nálady. Původní pohádkový seriál napsala Dagmar Langová. V roce 2013 natočil režisér Petr Mančal. Vypráví Luboš Veselý.
- eventId:
  - 1592988
  - 1598246
  start: 2026-10-10T18:00:00Z
  stop: 2026-10-10T18:55:00Z
  title: Velká pohádka
  description: 'Lucka, nebo Peška? Jindřich má těžký den. Nic mu nevychází a navíc pospíchá do školy na písemku z matiky. A najednou mu na hlavu z nebe spadne holčička. Může to být ještě podivnější? Napsal: Lukáš Csicsely. Režie: Jakub Doubrava. Hrají: Jonáš Holeček, Žofie Blechová, Ester Valtrová, Petr Konáš, Zuzana Ščerbová a další.'
