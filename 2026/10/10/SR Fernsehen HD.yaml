  description: "In der Seniorenresidenz Schönblick wird ein Mann bei einem Schusswechsel tödlich verletzt. Als letzte Handlung steckt er dem zufällig hinzukommenden Tierarzt Hauke Jacobs noch ein Stück Metall zu. Für Polizistin Lona Vogt verdichten sich die Hinweise, dass der Anschlag eigentlich ihrem Vater galt. Der war anscheinend nicht der harmlose Handlungsreisende, als der er sich ausgab, sondern arbeitete vermutlich für einen Nachrichtendienst. \nNicht weniger mysteriös geht es bei der Herkunft des Opfers zu. Der Mann hatte 1994 die Identität eines Toten angenommen. Die Ermittlungen führen in die Vergangenheit und zum Mörder von Lonas Mutter."
