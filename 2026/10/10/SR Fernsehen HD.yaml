  title: Unser Trinkwasser - Gefahr aus der Leitung?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Deutsches Leitungswasser gilt als gesundheitlich unbedenklich und hat einen guten Ruf. Doch die Aussage, Trinkwasser aus der Leitung sei das "bestkontrollierte Lebensmittel", ist laut Gerichtsbeschluss von 2020 irreführend. Wie sauber ist Trinkwasser aus der Leitung tatsächlich?
- eventId: 832188
