  title: Ein Blinder, ein Lahmer, ein Tauber
  subtitle: Die behinderte Job-Challenge
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Drei Comedians, drei Behinderungen, drei Challenges: Timur Turga, Tan Caglar und Okan Seese wollen herausfinden, wer am beschissensten dran ist. Timur ist blind und arbeitet in einer Autoreinigung, Tan sitzt im Rollstuhl und muss auf dem Bauernhof anpacken, Okan ist taub und übernimmt den Service in einem vollen Restaurant. "Ein Blinder, ein Lahmer, ein Tauber" ist Comedy-Reality mit Haltung: direkt, überraschend und respektlos gegenüber Vorurteilen.'
