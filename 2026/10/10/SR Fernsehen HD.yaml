  description: '"Die Züge stehen für die Träume, die Hoffnungen und die Zukunft der beiden koreanischen Staaten." Ein Zitat des südkoreanischen Wiedervereinigungsminister Lee Jae Joung im Dezember 2010 am Bahnhof von Munsan. Besser könnte man die Wichtigkeit der Eisenbahn in Korea nicht beschreiben. Die Verbindung zwischen den beiden asiatischen Staaten, die sich offiziell noch immer im Kriegszustand befinden, ist ein Meilenstein: Diktatur auf der einen, demokratisch gelebte Freiheit auf der anderen Seite. Die Schienen bilden die Lebensader zwischen beiden.'
