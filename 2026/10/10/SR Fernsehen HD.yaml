  description: Die Sendung soll Gesprächsstoff liefern, Anregungen geben, Staunen auslösen und ins Wochenende begleiten. Das Thema der Woche steht genauso auf dem Plan wie Porträts von Musikern, Ausflugstipps in der Großregion, "Kochen mit Köpfchen", das "Saar nur"-Kalenderblatt, Starinterviews, bunte Reportagen oder auch das Saarlandquiz. Uns interessieren vor allem die schönen Seiten des Saarlandes, und in "WimS - Saar nur!" darf gelacht werden.
