  title: Blagoslovljen tek
  subtitle: Religijski
  description: Dolazak u Zagreb zbog liječenja za mnoge znači neizvjesnost, strah i udaljenost od vlastitog doma. U tim trenucima pomoć nije samo smještaj, već i osjećaj sigurnosti i podrške. Upravo to pruža Udruga fra Mladen Hrkać, koja već godinama pomaže ljudima koji su zbog liječenja primorani živjeti u Zagrebu. Upoznajemo njihove predane djelatnike i volontere koji pružaju oslonac korisnicima dok prolaze kroz teške trenutke. U kulinarskom dijelu pripremaju se francuska salata, zeljanica te hercegovački uštipci.
