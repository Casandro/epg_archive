  description: Sestra Angela istražuje djevojku koja je spremna prodati sebe ne bi li spasila onoga koga voli. Nico se, s druge strane, želi ozbiljno pozabaviti Marijom. U međuvremenu, Ginevru proganja vlastita prošlost i plaši je. Nico je pokušava zaštititi, pa saznaje tajnu koju je čuvala od njega. Athos i Emma otkrivaju da oboje vole čitati, a Azzurra postaje pseudo intelektualka da ne bude izostavljena iz razgovora.
