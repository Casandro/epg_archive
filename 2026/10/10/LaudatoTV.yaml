  title: Novo srce - fra Ivan Matić
  subtitle: U emisiji gostuje fra Mario Berišić.
  description: U emisiji gostuje fra Mario Berišić. Ispričat će kako je odrastao u tradicionalnoj katoličkoj obitelji u kojoj su molitva i sveta Misa bile svakodnevne te priznaje da ga je to često znalo sputavati i odbijati. S nepunih 16 godina pao je u tešku depresiju iz koje tada nije vidio izlaza. U toj situaciji majka ga na koljenima moli da ode na jednu duhovnu obnovu govoreći mu kako je to ono što treba njegovoj duši. Nevoljko je pristao i odlučio otići na pet minuta, s ruksakom na leđima kako bi što prije mogao otići. A da naše vrijeme nije Božje vrijeme pokazalo se i u njegovom slučaju, jer se pet minuta pretvorilo u nekoliko sati. Duhovnu obnovu vodio je pokojni fra Zvjezdan Linić, a Mario je upravo tamo susreo živoga Boga i doživio mistično iskustvo. U emisiji svjedoči kako je osjetio i čuo da su se okovi i lanci s njegova srca slomili. Bio je to trenutak kada njegov život kreće u potpuno drugom smjeru, prema Bogu.
