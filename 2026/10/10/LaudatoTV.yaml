  description: 'U subotu, 10. listopada, s Gospina otoka u Solinu prenosimo središnje euharistijsko slavlje u povodu 1050. obljetnice smrti hrvatske kraljice Jelene i 950. obljetnice krunidbe kralja Dmitra Zvonimira. Svečanu svetu misu predslavit će splitsko-makarski nadbiskup i metropolit mons. Zdenko Križić, u zajedništvu s biskupima Hrvatske biskupske konferencije. Gospin otok, mjesto duboko povezano s počecima kršćanstva u hrvatskom narodu, bit će tako središte molitve i zahvalnosti za vjeru i kršćansku baštinu koja se kroz stoljeća prenosila s naraštaja na naraštaj. Upravo je ovdje sveti Ivan Pavao II. poručio: ,,Ovdje je vrelo vašega identiteta. Ovdje su vaši duboki kršćanski korijeni.'
