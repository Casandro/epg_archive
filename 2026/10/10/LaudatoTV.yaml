  description: Budite (hrabri i) spremni učiniti dobre stvari. Budite najbolji/najveći za dobrobit drugih. Ela je izazvana suprotstaviti se kolegici iz razreda koja dovodi u pitanje Elin izbor nove djevojke u školi koja bi se pridružila posebnom klubu. Ako Ela ostane uporna u izboru nove djevojke, mogla bi i sama izgubiti svoj položaj u klubu. Superknjiga odvodi djecu kako bi upoznala kraljicu Esteru, koja se i sama suočava s moralnom krizom. Ela se sprijateljuje s kraljicom i shvaća da je njezina dilema ništa u usporedbi s izborom života i smrti s kojim se kraljica Estera sada bori. U trenutku istine, Estera pokazuje svoje istinske osobine i zalaže se za ono što je ispravno, čak i ako bi to moglo značiti njezinu smrt. Biva nagrađena za svoju hrabrost, zaštićuje svoj narod i Ela se vraća kući puna odlučnosti i hrabrosti koja će joj biti potrebna da učini ispravnu stvar u njezinoj situaciji u školi.
