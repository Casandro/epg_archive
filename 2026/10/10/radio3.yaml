  stop: 2026-10-10T14:00:00Z
  title: Schrammek & Käther
  subtitle: 'Moderation: Bernhard Schrammek und Matthias Käther'
  description: |-
    Die beste Flötenmusik

    Travers- bzw. Querflöten dienen seit der Renaissancezeit in unterschiedlichsten Bauarten als fester Bestandteil des abendländischen Instrumentariums. Dementsprechend unüberschaubar ist die Anzahl der Flötensonaten und -konzerte sowie besonderer Flötensoli in Opern und Orchesterwerken. Unüberschaubar? Schrammek & Käther versuchen dennoch, einen Überblick über die beste Flötenliteratur der letzten fünf Jahrhunderte zu geben.

    Moderation: Bernhard Schrammek
    Matthias Käthe
