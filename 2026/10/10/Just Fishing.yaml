  subtitle: River Fighters - Episode 17
  description: "Wie der Name schon vermuten lässt, werden die Flüsse der Niederlande zum Austragungsort eines atemberaubenden Wettkampfes zwischen drei Teams. Jedes Team besteht aus zwei Mitgliedern, die niemandem den Sieg schenken wollen. Es wird in 3 Staffeln in drei verschiedenen Jahreszeiten (Winter, Sommer, Herbst) gefischt. \nStaffel 1 Winter Edition, Staffel 2 Sommer Edition und Staffel 3 Herbst Edition. \nDurch dieses außergewöhnliche Konzept, müssen die Teams ihr Können erst recht unter Beweis stellen. Es gehört einiges an Erfahrung, Wissen und ein Fünkchen Glück dazu, die jeweiligen Zielfische in den verschiedenen Jahreszeiten zu überlisten und sich unter den widrigsten Bedingungen an die Spitze der Tabelle zu angeln. \nEuch erwartet also eine spannendes von Taktik geprägtes Angelturnier der Superlative.  DE 2020"
