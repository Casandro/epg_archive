  description: 'Nabil Ibrahim sitzt wegen Polizistenmordes ein und erwartet nicht mehr viel vom Leben: Krebs im Endstadium. Aus humanitären Gründen bewirkt sein Pflichtverteidiger Stoffenburg eine vorzeitige Haftentlassung nach 15 Jahren. In der kurzen Zeit, die Nabil noch bleibt, möchte er wenigstens noch eine Sache in Ordnung bringen: Seinen Anteil an der Beute aus dem damaligen Raubüberfall soll seine Ex-Freundin Cora bekommen, die jetzt in einem abgehängten Provinzkaff und einer versifften Wohnung haust. Dort erlebt Nabil eine Überraschung: Cora hat eine 17-jährige Tochter namens Juju, die ihren leiblichen Vater nicht kennt.'
