  title: Die Macht der Natur - Asteroiden
  subtitle: Die Macht der Natur - Asteroiden
  description: Asteroiden sind Himmelskörper im All, die seit der Entstehung unseres Sonnensystems um unsere Sonne herumschwirren. Etwa alle 100 Jahre wird die Erde von einem Gesteinsbrocken getroffen. Bei eher kleinen Asteroiden sind die Auswirkungen zwar lokal begrenzt, größere hingegen können das Leben auf der Erde grundlegend verändern und hätten katastrophale Auswirkungen. Eine bahnbrechende Entwicklung soll unseren Planeten vor der Gefahr aus dem All retten.
  widescreen: true
