  title: Strangest Things - Folge 11
  subtitle: Strangest Things - Folge 11
  description: Ein fünftausend Jahre altes Steinobjekt ist in vier symmetrische Teile geformt und mit einzigartigen Markierungen versehen. Wer hat es hergestellt und wozu diente es? Die Untersuchung einer dreitausend Jahre alten Mumie in Gestalt einer Katze zeigt, dass sich kein Vierbeiner in dem Relikt befindet. Handelt es sich um eine moderne Fälschung? In dieser Episode versuchen Forschende mithilfe moderner Technologien, die Geheimnisse um mysteriöse Objekte aus den Archiven großer Museen zu entschlüsseln.
