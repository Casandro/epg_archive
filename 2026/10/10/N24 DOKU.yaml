  title: Die Macht der Natur - Eisschmelze
  subtitle: Die Macht der Natur - Eisschmelze
  description: 'Rund ein Zehntel der Erde ist noch mit Eis bedeckt, doch dieses schmilzt in einem rasanten Tempo. Schuld trägt vor allem der Mensch: Seit der Industrialisierung werden durch das Verbrennen von Fossilien große Mengen an CO2 und Methan freigesetzt, welche zunehmend das Klima beeinflussen. Gravierende Folgen könnten tödliche Flutwellen, urzeitliche Pandemien und eine neue Eiszeit sein. Nun steht die Wissenschaft vor der lebensverändernden Herausforderung, die Klimakatastrophe abzuwenden.'
