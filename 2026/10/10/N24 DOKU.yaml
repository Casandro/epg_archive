  title: Hoch hinaus - Der Bau des East Side Towers in Berlin
  subtitle: Hoch hinaus - Der Bau des East Side Towers in Berlin
  description: 'Zwischen Kreuzberg und Friedrichshain in Berlin entsteht mit dem EDGE East Side Tower das höchste Bürogebäude der Stadt: 142 Meter hoch, 35 Stockwerke und 65.000 Quadratmeter Mietfläche. Der Bau erfordert über viereinhalb Jahre und Tausende Arbeiter, die Millionen Kilogramm Material verbauen. Die Baufläche ist extrem klein, was logistische Herausforderungen birgt, wie nur eine Zufahrtsstraße und kaum Platz für Baukräne. Die Reportage begleitet den Bau bis zur Fertigstellung und Übergabe.'
