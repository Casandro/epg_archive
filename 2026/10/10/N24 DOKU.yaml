  title: Das Reich der Wikinger - Ivars Dynastie (1)
  subtitle: Das Reich der Wikinger - Ivars Dynastie (1)
  description: Im 8. Jahrhundert bricht das Zeitalter der Wikinger an. Die Skandinavier entwickeln damals besonders wendige Langschiffe mit Seitenruder - ideal für die Raubzüge der Wikinger. Jahrzehntelang überqueren sie von Norwegen aus die Nordsee, um zu wohlhabenden Klöstern Britanniens und Irlands zu gelangen. Ihre stolzen und unbarmherzige Anführer sind Olaf der Weiße und Ivarr. Die Dokumentation erklärt den Ursprung der Wikinger und beschreibt die Lebensweise der berüchtigten Nordmänner.
  widescreen: true
- eventId: 1579232
  start: 2026-10-10T23:41:00Z
  stop: 2026-10-11T00:29:00Z
  title: Das Reich der Wikinger - Ivars Dynastie (2)
  subtitle: Das Reich der Wikinger - Ivars Dynastie (2)
  description: Vor mehr als tausend Jahren überfallen die Wikinger Britannien, Irland und weitere Länder. Sie prägen die eroberten Gebiete maßgeblich - so zum Beispiel im 10. Jahrhundert in Dublin. Die Invasoren beeinflussen die irische Kultur und Architektur. Durch ihre großen Häfen und Flotten ermöglichen sie den Sklavenhandel. Sitric Seidenbart ist der letzte große Wikingerkönig Dublins. Sein Tod im Jahr 1042 markiert das Ende einer rund 200-jährigen Geschichte, geprägt durch Ivarr und seine Nachfahren.
  widescreen: true
- eventId: 1557276
