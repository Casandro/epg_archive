  title: Lost Places - Folge 64
  subtitle: Lost Places - Folge 64
  description: Im englischen Suffolk liegt eine Militäranlage, die ein Geheimnis birgt. Auf den Luftwaffenstützpunkt Bentwaters wurde die Öffentlichkeit im Jahr 1980 aufmerksam, als Anwohner seltsame rote Lichter am Himmel sahen, die sich der Erde näherten. Das Geheimnis der Lichter ist bis heute aufgrund hoher Sicherheitsvorkehrungen ungeklärt. Auch eine kleine Insel im Pazifik vor Taiwan erinnert aufgrund von Propaganda-Plakaten und Betonbauten an eine militärische Einrichtung, obwohl sie es nie war.
  widescreen: true
