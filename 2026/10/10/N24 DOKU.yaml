  title: Gegen Wind und Wellen - Auf Fangfahrt mit den deutschen Seelachsfischern
  subtitle: Gegen Wind und Wellen - Auf Fangfahrt mit den deutschen Seelachsfischern
  description: Der Job des Hochseefischers ist bis heute extrem gefährlich. Wellen, Stürme, körperliche Arbeit und kaum Schlaf - die Belastungen sind hoch, auch wenn die Schiffe inzwischen hochmodern sind. Die Fischerei weit draußen braucht Erfahrung und auch Glück. Das Wetter kann innerhalb von Minuten umschlagen und das gilt auch für die Fischpreise, die je nach Fangmenge stark variieren. Schnell entsteht ein Wettlauf gegen die Zeit und die Naturgewalten.
