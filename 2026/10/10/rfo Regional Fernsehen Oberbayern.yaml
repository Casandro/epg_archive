  stop: 2026-10-10T04:30:00Z
  title: Süd Journal vom 9.10.2026 (Wh.)
  subtitle: Bunker 29 noch im Oktober geöffnet +++ Angerer Bürgermeister verliert Gemeindewette +++ Wetter für das Sendegebiet
  description: 'Waldkraiburgs Wurzeln reichen in die 1930er-Jahre zurück, als im Wald unter dem Decknamen Schokoladenfabrik ein großer Rüstungsbetrieb entstand; Bunker 29 erinnert daran, das Industriemuseum ist am 11. und 25. Oktober geöffnet. +++ Angers Bürgermeister Markus Winkler verlor die Gemeindewette: Statt der bezweifelten 1.000 wurden in zehn Läden an einem Tag 2.073 Fair-Trade-Produkte verkauft, weshalb er 400 Euro an den Verein Fair Miteinander für ein Waisenhausprojekt in Bolivien spendet. +++ Am Samstag südlich der Donau sich langsam zurückziehende Regenfälle. Im Nordwesten und im Küstenumfeld im Verlauf wieder auflebende Schauertätigkeit, vereinzelt Gewitter. Stürmische Böen an den Küsten und im Bergland.'
- eventId: 1281468
  start: 2026-10-10T04:30:00Z
  stop: 2026-10-10T04:45:00Z
  title: Süd Kultur vom 9.10.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: Wie Künstler wie Thibaut Garcia oder Weltstar Bireli Lagrene zum Gitarrenfestival Saitensprünge nach Bad Aibling kommen und wie das Programm nach dem Jubiläumsjahr 2025 aussieht, klärt Norbert Haimerl in rfo-Süd-Kultur mit den Machern.
- eventId: 1281469
  start: 2026-10-10T04:45:00Z
  stop: 2026-10-10T05:00:00Z
  title: Süd Kultur vom 9.10.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: 'Rosenheim zeigt sich seit sieben Jahren als Street-Art-Stadt: Das Transit Art Festival hat 45 Murals über viele Viertel verteilt, und bei einer Radtour mit OB Abuzar Erdogan erkundeten Teilnehmer die Fassadenkunst, die Orte verändert und Fragen stellt.'
- eventId: 1281470
  start: 2026-10-10T05:00:00Z
  stop: 2026-10-10T05:10:00Z
  title: Süd Journal vom 9.10.2026 (Wh.)
  subtitle: Apfelmarkt 2026 in Bad Feilnbach eröffnet +++ 650 Jahre Leonhardiritt in Bad Feilnbach +++ Telefonbetrüger erbeuten 180.000 Euro  +++ Renaturierung der Moore
  description: 'Der 33. Apfelmarkt in Bad Feilnbach läuft seit 8. Oktober bis 11. Oktober 2026, öffnet freitags ab 10 Uhr mit Festzug von Bürgermeister und Apfelkönigin, bietet Spezialitäten, Handwerk und Musik, der Eintritt ist freitags frei und am Wochenende drei Euro. +++ Es ist eine Tradition. Es ist ein Fest. Und für viele in Bad Feilnbach ein Stück Heimat: der Leonhardiritt. Vor mehr als 650 Jahren wurde er erstmals erwähnt. Seit 2022 kümmert sich ein eigens gegründeter Verein darum, dass er erhalten bleibt. +++ Telefonbetrüger ergaunerten von Juli bis September 2026 in Südoberbayern rund 416.000 Euro, darunter 180.000 Euro von einer 85-Jährigen aus Bernau am Chiemsee; die Polizei zählt 15 Fälle, acht Festnahmen und warnt: Beamte verlangen nie Geld oder Wertsachen. +++ Im Rosenheimer Kreistag stand die Moorrenaturierung im Fokus: AfD und FREIE WÄHLER verlangten Berichte und eine Bilanz; 2025 wurden im Landkreis rund 640 Hektar renaturiert, meist gefördert, und über 160 Hektar Flächen angekauft.'
- eventId: 1281471
  start: 2026-10-10T05:10:00Z
  stop: 2026-10-10T05:20:00Z
  title: Süd Journal vom 9.10.2026 (Wh.)
  subtitle: Inklusives Wohnprojekt in Nußdorf am Inn gestoppt +++ Die Nachhaltigkeitswoche 2026 - Nachhaltige Medienbranche  +++ Krauthobeln und Kleinkunst in Maxlrain +++ Neue Feuerwehr-Drehleiter in Laufen eingeweiht
  description: 'Das seit Jahren leerstehende Haus am Steinbach in Nußdorf könnte mit konkreten Plänen wieder genutzt werden, doch der Weg ist kompliziert; nun hat der Gemeinderat eine wichtige Entscheidung getroffen, die die Zukunft des früheren Seniorenheims prägt. +++ Die European Sustainable Development Week (18. September bis 8. Oktober) wirbt europaweit für die UN-Agenda 2030; rfo unterstützt das als erster lokaler Sender Bayerns im Nachhaltigkeitspakt Medien Bayern und setzt auf unabhängigen, gründlich recherchierten Lokaljournalismus. +++ Während vielerorts bayerische Wirtshäuser schließen, hält Maxlrain dagegen: Ab 10. Oktober beginnt im Biergarten das fünftägige Krauthobeln, und am Samstagabend eröffnet die Kleinkunstbühne in der alten Füllerei mit Hundling, der ein Best-of aus zehn Jahren spielt. +++ In Laufen wurde die neue Drehleiter der Feuerwehr gesegnet: Das 320-PS-Fahrzeug ersetzt die 30 Jahre alte Leiter, die 750 Einsätze fuhr; zudem beschaffte die Stadt für den Löschzug Leobendorf einen Logistiktransporter und investierte insgesamt 1,2 Millionen Euro.'
