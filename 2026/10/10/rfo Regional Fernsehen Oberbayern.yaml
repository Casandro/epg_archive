- eventId: 1278891
  start: 2026-10-10T15:00:00Z
  stop: 2026-10-10T15:15:00Z
  title: Süd Journal vom 9.10.2026 (Wh.)
  subtitle: Apfelmarkt 2026 in Bad Feilnbach eröffnet +++ 650 Jahre Leonhardiritt in Bad Feilnbach +++ Telefonbetrüger erbeuten 180.000 Euro  +++ Renaturierung der Moore
  description: 'Der 33. Apfelmarkt in Bad Feilnbach läuft seit 8. Oktober bis 11. Oktober 2026, öffnet freitags ab 10 Uhr mit Festzug von Bürgermeister und Apfelkönigin, bietet Spezialitäten, Handwerk und Musik, der Eintritt ist freitags frei und am Wochenende drei Euro. +++ Es ist eine Tradition. Es ist ein Fest. Und für viele in Bad Feilnbach ein Stück Heimat: der Leonhardiritt. Vor mehr als 650 Jahren wurde er erstmals erwähnt. Seit 2022 kümmert sich ein eigens gegründeter Verein darum, dass er erhalten bleibt. +++ Telefonbetrüger ergaunerten von Juli bis September 2026 in Südoberbayern rund 416.000 Euro, darunter 180.000 Euro von einer 85-Jährigen aus Bernau am Chiemsee; die Polizei zählt 15 Fälle, acht Festnahmen und warnt: Beamte verlangen nie Geld oder Wertsachen. +++ Im Rosenheimer Kreistag stand die Moorrenaturierung im Fokus: AfD und FREIE WÄHLER verlangten Berichte und eine Bilanz; 2025 wurden im Landkreis rund 640 Hektar renaturiert, meist gefördert, und über 160 Hektar Flächen angekauft.'
