  description: |-
    Inmitten eines Schneesturms entdeckt Kriminalkommissarin Vera Stanhope ein verlassenes Fahrzeug mit einem Baby darin. Sie sucht Zuflucht in Brockburn House, dem altehrwürdigen Herrenhaus ihrer entfremdeten Familie, und entdeckt dort eine tote Frau. Um den Mord aufzuklären, muss sie tief vergrabene Familiengeheimnisse ans Licht bringen.

