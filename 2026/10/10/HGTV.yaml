  title: Home Rescue - Wohnen in der Wildnis
  subtitle: Der Evakuierungsplan
  description: |-
    Nordkalifornien, am Fuß der Sierra Nevada: Vor 8 Jahren haben Stephania Hayes und John Lytle ein 12 Hektar großes Grundstück inmitten traumhafter Natur erworben. Doch durch diverse Rückschläge ist das Selbstversorgungsprojekt ins Stocken geraten. Der Gartenbau gestaltet sich schwierig. Die andauernde Hitzewelle schadet den Hühnern. Außerdem bekommen es die Siedler:innen mit Wildtieren wie Pumas und Kojoten zu tun. Bedingt durch die Dürre steigt zudem die Waldbrandgefahr! Damit der Aussteigertraum des Paars nicht bis auf die Grundmauern niederbrennt, entwickeln die Raneys einen umfassenden Rettungsplan.
    USA 2024
