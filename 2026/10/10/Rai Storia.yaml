  description: ggi nello spazio, invenzioni e nuove frontiere della scienza. Così, da un'idea di Hugo Gernback, editore e inventore, nasce ufficialmente la fantascienza. Scienza e immaginazione, meraviglia e paura per raccontare il futuro e, attraverso il futuro, raccontare le speranze e le paure del presente. In realtà, la fantascienza affonda le sue origini nel romanzo scientifico della fine dell'800, periodo carico di fascinazione per il futuribile, genere nato dalla visione positivista del progresso e dal rapido susseguirsi di invenzioni in grado di alterare ogni aspetto della vita pubblica e privata. In questi romanzi, a differenza del racconto fantastico, il misterioso, l'assurdo, il meraviglioso, non è più da ricollegarsi al soprannaturale, ma a fatti scientificamente possibili. Con largo anticipo, nel 1818, l'aveva preannunciato la scrittrice inglese Mary Shelly con il suo Frankenstein, creatura generata assemblando e galvanizzando pezzi di cadavere, in un romanzo che getta il primo seme per un filone importante di prefigurazione del futuro. In studio con Paolo Mieli, il prof. Lorenzo Benadusi. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Lorenzo Benadusi Con la partecipazione di Samuel Boscarello
