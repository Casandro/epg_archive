  title: Passato e presente Pena di morte negli U
  subtitle: 'Passato e presente Pena di morte negli USA. Giustizia o vendetta? - La pena di morte negli Stati Uniti nasce dento l''impianto originario della Repubblica: il sistema penale americano la considera legittima'
  description: |-
    e normale. Le tappe fondamentali della pena capitale negli USA partono dalle radici costituzionali - che da un lato tutelano il diritto alla vita e dall'altro legittimano la possibilità di toglierla nel rispetto del giusto processo - passando per il Michigan, che nel 1846 abolisce la pena per i reati comuni, primo segnale abolizionista nell'America moderna; all'umanizzazione della pena di inizi novecento; alle implicazioni razziali degli anni 30; alla moratoria nazionale del 1972; alla Federal Death Penalty Act del 1994, che amplia i reati federali punibili con la morte; passando per i casi simbolo che hanno scosso l'opinione pubblica mondiale, come quello di Caryl Chessman. Una storia non lineare con fasi abolizioniste che si alternano a ritorni alla severità della pena. E, mentre gran parte dell'Occidente ha progressivamente abbandonato le esecuzioni capitali, gli Stati Uniti restano un'eccezione e oggi si presentano come un Paese spaccato, con alcuni Stati che hanno abolito la pena capitale, e altri che continuano ad applicarla, mentre il governo federale ha sospeso le esecuzioni. Sullo sfondo, restano aperti molti interrogativi: il rischio di errori giudiziari, le disparità razziali, il ruolo delle giurie popolari e l'efficacia reale della pena come deterrente. In studio con paolo Mieli il professor Mauro Canali. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

    Ospite in studio il prof. Mauro Canali Con la partecipazione di Matteo Marroni Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
