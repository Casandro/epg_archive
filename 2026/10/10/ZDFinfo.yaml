  description: |-
    Deutschland 2023
    Luft ist unsichtbar, aber in ihrer Wirkung nicht zu übersehen. Als Lebensspender oder als verheerender Wirbelsturm ist sie immer wieder Akteur in der Geschichte.

    Mit neuen Erkenntnissen über das Element gelingen der Menschheit bahnbrechende Innovationen. Segelschiffe nutzen die Zyklen der Winde und Flugzeuge die Gesetze der Aerodynamik. Die größten Imperien verdanken der Luft ihren Erfolg.
    HD-Produktion
