- eventId: 1230815
  start: 2026-10-10T00:40:00Z
  stop: 2026-10-10T01:25:00Z
  title: Natur macht Geschichte
  subtitle: Himmelskörper
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Die Faszination für die Gestirne ist wohl so alt wie die Menschheit selbst. Sie bestimmen den Rhythmus unseres Planeten und können ihn auf einen Schlag verändern.

    Die Menschen beobachten die Gestirne früh in ihrer Geschichte und richten ihr Handeln nach ihnen aus. Ihre gigantische Zerstörungsmacht erkennen Naturwissenschaftler erst in den vergangenen Jahrzehnten. Deshalb wird heute an einer Asteroidenabwehr geforscht.
    HD-Produktion
- eventId: 1230816
  start: 2026-10-10T01:25:00Z
  stop: 2026-10-10T02:10:00Z
  title: Natur macht Geschichte
  subtitle: Feuer
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Von prähistorischen Lagerfeuern bis zur Raumfahrt treibt Feuer die Menschheitsgeschichte voran. Gleichzeitig bedroht uns das Element durch Brände und Zerstörung.

    Das große Potenzial des Feuers nutzen Menschen seit Tausenden von Jahren nicht nur zum Kochen, sondern auch zur Umgestaltung ganzer Landschaften. Doch als die Menschen Feuer in Kriegen und zur Verbrennung fossiler Energieträger einsetzen, bahnen sich Katastrophen an.
    HD-Produktion
- eventId: 1235652
  start: 2026-10-10T02:10:00Z
  stop: 2026-10-10T02:55:00Z
  title: Natur macht Geschichte
  subtitle: Wasser
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Wasser - das flüchtige Element - macht Leben auf der Erde möglich und verhilft Hochkulturen wie Ägypten zum Aufstieg. Doch seine Fluten sind unaufhaltsam und bedrohen ganze Staaten.

    Die frühe Landwirtschaft ist abhängig von Wasser - genauso wie die Wikinger mit ihren clever konstruierten Langbooten. Dagegen kämpfen Länder wie die Niederlande mit Mammutprojekten gegen Sturmfluten und steigende Meeresspiegel ums Überleben.
    HD-Produktion
- eventId: 1235653
  start: 2026-10-10T02:55:00Z
  stop: 2026-10-10T03:40:00Z
  title: Natur macht Geschichte
  subtitle: Erde
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Die Erde unter unseren Füßen ist voller Energie und Leben. Früh nutzt der Mensch fruchtbare Böden und gräbt nach Ressourcen. Doch Vulkane und Erdbeben bedrohen die Städte.

    Denn tief unter der Erde bewegen gigantische Kräfte die Kontinente, pressen Kohlenstoff zu fossilen Brennstoffen und lassen Metalle entstehen. Unsere Geschichte ist geprägt von der Nutzung dieser Ressourcen. Die Zukunft wird zeigen, wie nachhaltig wir das tun.
    HD-Produktion
