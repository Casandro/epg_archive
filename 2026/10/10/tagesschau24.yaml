  subtitle: Nordkorea
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Weil die Menschen im antiken Korea an ein Leben nach dem Tod glaubten, bauten sie allen hochrangigen Persönlichkeiten Hügelgräber und statteten diese mit Wandmalereien aus. Die Fresken erzählen Geschichten über ein Reich, das von 37 vor bis 668 nach der Zeitenwende eines der mächtigsten Ostasiens war, es gilt als die Wiege der koreanischen Kultur: Koguryo. Die Grabfresken vergegenwärtigen die damaligen religiösen Vorstellungen und geben Einblicke in Alltag, Esskultur, Kleidung und Architektur des antiken Korea.'
