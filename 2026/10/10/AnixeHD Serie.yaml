  title: Das Waisenhaus für wilde Tiere - Folge 93
  subtitle: Das Waisenhaus für wilde Tiere - Folge 93
  description: 'Der Gepard Atheno soll lernen, einer beweglichen Beute nachzujagen. Dafür wird hinter einem Wagen ein Stück Fleisch befestigt. Natalia und Stephanie haben die Aufgabe, das Seil festzuhalten, Atheno jagt hinterher - aber nur für eine kurze Weile. Namibia ist ein mit Insekten gesegnetes Land. Die beiden Insektenkundler John aus Windhoek und André aus Sankt Gallen entdecken eine 25 Zentimeter große Stabschrecke. Sandra aus Wien und ihre Freundinnen schleppen stinkende Esel-Eingeweide, um den afrikanischen Wildhunden eine Freude zu machen. Sandra: "Du gewöhnst Dich dran. Du musst Dich dran gewöhnen. Das ist Afrika."'
