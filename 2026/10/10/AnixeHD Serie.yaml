  subtitle: Vier Frauen und ein Todesfall - Drachentöter
  description: 'Hochzeitsfest beim Dorfwirt: Sportausrüstungsfabrikant Urban Stainzer (Harald Posch) heiratet Francesca (Franziska Weisz), ein bildhübsches Mädchen aus dem Ort. Tommi Engel (Robert Reisinger), der weltberühmte Drachenflugmeister, soll aus der Luft den Brautstrauß zuwerfen. Der gewagte Anflug endet im Glockenturm - tödlich. Die Hochzeitsfeier wird zum Tribunal des Dorfgendarmen Paulmichl (Raimund Wallisch), der sich ganz sicher ist, dass Engel nicht von selbst vom Himmel gefallen ist. Alle Anwesenden sind verdächtig und den dilettantischen Verhörmethoden des Gendarmen ausgesetzt. Julie (Adele Neuhauser), Henriette (Gaby Dohm), Maria (Brigitte Kren) und Sabine (Martina Poel) können dem Treiben nicht lange zusehen und nehmen die Ermittlungen in die Hand. Rasch finden sie heraus, dass Tommi Engel einige Feinde hatte - und tatsächlich sind diese alle anwesend.'
