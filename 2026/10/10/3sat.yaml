  description: |-
    Deutschland 2026
    Was bedeutet "wehrhafte Demokratie" im Angesicht einer möglichen AfD-Landesregierung? Dieser Frage geht Sarah Bosetti mit Heike Klüver, Max Heckel und Bijan Moini auf den Grund.

    Wer müsste in Angst leben, wenn eine in Sachsen-Anhalt gesichert rechtsextremistische Partei an die Macht kommen könnte? Wie kann eine Gesellschaft Widerstand leisten? Und wie gewinnt man Wählerinnen und Wähler zurück?
