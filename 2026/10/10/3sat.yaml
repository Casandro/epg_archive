  title: 'Fabian Lampert: Einer dieser Abende'
  subtitle: 3satFestival Mainz, September 2026
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Die 3satFestival-Bühne heißt den neuen Stern am Comedy-Himmel willkommen. Fabian Lampert! In seinem ersten Soloprogramm kreiert er einen "dieser Abende", an die man lang und gern zurückdenkt.

    Seine Karriere begann mit einem Sprung ins Ungewisse - dem Umzug von Bayern nach Köln. Ein Traum wollte erfüllt werden: Menschen auf der Bühne zum Lachen zu bringen. Und das gelingt ihm hervorragend!
    HD-Produktion
