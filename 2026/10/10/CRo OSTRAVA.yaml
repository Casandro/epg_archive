  title: Mezi nebem a zemí
  description: Navštívíme Spolek Letokvět, který na Náchodsku mapuje kříže podél poutní cesty a bádá proto i v archivech. Uslyšíte také o zkušenostech ukrajinských psychoterapeutek, které už čtyři a půl roku zažívají válečné trauma na druhou. Představíme vám knihu Odpouštění a pravidelné zamyšlení je od Jakuba Pavlúse, faráře Českobratrské církve evangelické.
