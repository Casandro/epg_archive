  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2012
    Reżyseria: Peter Werner
    Występują: Poppy Montgomery, Dylan Walsh, Michael Gaston, Kevin Rankin, Daya Vaidya, Jane Curtin
    Serial opowiada o Carrie Wells, tajemniczej byłej detektyw o przedziwnej zdolności - w jej pamięci zapisuje się szczegółowo absolutnie wszystko, każde miejsce, każda rozmowa, każdy moment radości i rozpaczy. Nie dlatego, że wszystko pamięta, ale dlatego, że nie umie zapomnieć niczego, poza jedną rzeczą: szczegółami z dnia, kiedy zamordowano jej siostrę wiele lat temu.
