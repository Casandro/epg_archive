  description: |-
    Rückenschmerzen sind die Zivilisationskrankheit Nummer eins. Die beste Therapie besteht in der aktiven Vorbeugung durch gezieltes Training. Um den Rücken komplett zu trainieren, braucht man allerdings von Zeit zu Zeit neue Herausforderungen. Johanna Fellner zeigt effektive Trainingseinheiten für einen starken und gesunden Rücken.
    Beugende, streckende und rotierende Bewegungen sowie statische Ganzkörperpositionen und Balance-Übungen ergeben ein optimales Gesamtpaket. Die gesamte Rumpfmuskulatur, insbesondere der Rücken, wird gekräftigt, stabilisiert und mobilisiert.
