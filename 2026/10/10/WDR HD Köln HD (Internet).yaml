  title: Lecker an Bord - Ostfriesland von Emden nach Leer (2/6)
  subtitle: mit Björn Freitag und Frank Buchholz
  description: "Vom Emder Stadthafen aus macht sich Björn auf den Weg nach Neukamperfehn. Dort haben sich Tony Richter und Dennis Dorst den Traum von einer nachhaltigen Gemüsemanufaktur erfüllt. \nFranks Ziel ist das Uphuser Meer. Hier lebt und arbeitet Rudolf Endjer, der letzte Binnenfischer Ostfrieslands. Vor den Toren Emdens bewirtschaftet er rund 1.000 Hektar Wasserfläche und führt gemeinsam mit seiner Frau Karin einen kleinen Hofladen. \nZurück an Bord bereiten die Köche ein raffiniert-bodenständiges Sommergericht mit ostfriesischem Charme zu."
