  title: Quarks im Ersten
  subtitle: 'Die große Sonnen-Frage: gefährlich oder gesund?'
  description: Sonne macht nicht nur Sommerfeeling, sie ist für uns lebenswichtig. Die Sonne ist Taktgeber für unsere innere Uhr, macht uns wach und leistungsfähig. Aber gleichzeitig verursacht sie Sonnenbrand, lässt die Haut altern oder erzeugt Hautkrebs. Wann tut Sonne gut - und wann schadet sie?
- eventId: 657454
  start: 2026-10-10T08:35:00Z
  stop: 2026-10-10T09:15:00Z
  title: Raus aufs Land (29)
  subtitle: 'Dorf als Therapie: Landluft gegen Burnout'
  description: "Martina kümmert sich um ihren Garten und will ihren Traum von einem nachhaltigen Leben auf dem Land verwirklichen. Sie lässt den Boden untersuchen, um Gemüse und Wein anzubauen, und genießt die Zeit mit ihrem Freund und ihrer Mama beim Grillen. Sie fühlt sich endlich befreit und glücklich. \nJaquie hat sich eine neue Aufgabe auf dem Land gesucht: Sie trainiert Mädchen im Boxen und begeistert mit ihrer Energie. Auf dem Hof steht der Hausbau weiter im Fokus, denn die Familie baut gerade eine Treppe aus alten Eichenbalken. Doch der Mangel an Handwerkern erschwert den Fortschritt, es zerrt an den Nerven ..."
- eventId: 659993
  start: 2026-10-10T09:15:00Z
  stop: 2026-10-10T09:45:00Z
  title: Grillen mit Ali und Adnan
  subtitle: Geflügel und ein Straußenei
  description: 'Heute steht eigentlich Geflügel auf dem Plan. Doch auf dem Weg zu einer Hühnerfarm macht Adnan noch eine besondere Entdeckung: eine Straußenfarm. Hier darf er das Straußenei sogar selbst aus dem Gehege "fischen". Auf Gut Hartschimmel grillen Ali und Adnan dann nicht nur Hähnchen im Salzmantel und Tandoori-Chicken-Spieße mit allerlei Beilagen, sondern zu guter Letzt auch noch das Straußenei.'
  genre:
  - '144'
- eventId: 662668
  start: 2026-10-10T09:45:00Z
  stop: 2026-10-10T10:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: Walnüsse und Feigen - Ein süßes und herzhaftes Vergnügen!
  description: 'Walnüsse und frische Feigen, finden die WDR Fernsehköche Martina und Moritz, sind eine Super-Kombination - und zwar durchaus nicht nur eine süße. Die beiden zeigen das in ihrer heutigen Sendung und bereiten mit den beiden Zutaten ein ganzes Menü zu: zuerst einen eleganten Vorspeisensalat, dann eine feine Cremesuppe. Als Hauptgericht gibt es ein herzhaftes Schmorgericht mit Hähnchen. Und einen saftigen Kuchen als Dessert backen sie auch.'
  genre:
  - '144'
