  stop: 2026-10-10T10:45:00Z
  title: 'Meisterküche: Kulinarische Europareise (6)'
  subtitle: 'Moderation: Yvonne Willicks'
  description: Die Genussreise der Meisterküche durch NRW, Deutschland und Europa geht weiter! Yvonne Willicks präsentiert wieder kulinarische Highlights - diesmal aus verschiedenen Ländern. Die Balearen-Insel Mallorca lockt die WDR-Kultköche Martina Meuth und Bernd "Moritz" Neuner-Duttenhofer an. Viele leckere Rezepte haben die beiden von dort mitgebracht. Spitzenkoch Björn Freitag besucht die nördliche Region Frankreichs. Dann geht's in die Türkei. Die deutsch-türkische Food-Bloggerin Orkide Tançgil zeigt Björn, wie man dort Kuzu Mutancana zubereitet
  genre:
