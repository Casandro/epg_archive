  title: Erlebnisreisen
  description: Erlebnisreisen sind die Zusammenfassung von Magazinbeiträgen aus der Servicezeit oder kürzere exklusive Reportagen. Die Attraktivität der dargestellten Reiseziele steht im Vordergrund. Nachvollziehbar sind die beschriebenen Routen und Ziele. Deshalb werden praktische Tipps und konkrete Anregungen gegeben.
- eventId: 638463
  start: 2026-10-10T05:55:00Z
  stop: 2026-10-10T06:20:00Z
  title: Die Sendung mit dem Elefanten
  subtitle: Vom Krabbeln zum Laufen
  description: |-
    In den Lach- und Sachgeschichten dreht sich heute alles um die Größe. Hanna ist gerade ein Jahr alt, aber schon so groß, dass sie fast laufen kann. Lola möchte größer sein, so groß wie ihr Bruder Charlie. Ein kleines Rehkitz hat einen ungewöhnlichen Freund: einen riesengroßen Hund. Händchen sortiert seine Socken der Größe nach. Und zum Mitmachen gibt es das Hampelmannlied.
    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.
  genre:
  - '16'
- eventId: 641536
  start: 2026-10-10T06:20:00Z
  stop: 2026-10-10T06:50:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: Lach- und Sachgeschichten, heute mit dem Geheimnis des Helium-Ballons, Charlie, Lola und einem sehr geheimen Geheimnis, einem sehr kleinen Atom, Timmys großem Tag - und natürlich mit der Maus, dem Elefanten und der Ente.
