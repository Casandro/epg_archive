  title: Wir werden Camper
  subtitle: Camping, Kunst & Klumpen - Die Erbslöhs in den Niederlanden
  description: |-
    Kurz nach dem Ausbruch von Corona haben sich Rüdiger und Petra Erbslöh ihr Wohnmobil gekauft. Seit dem haben sie viel gesehen. In diesem Jahr zieht es sie in die Niederlande, insbesondere in einige alte Hansestädte.
    Campen ist für die beiden Rentner auch immer wieder ein Check, wie sich Campingplätze unterscheiden und welche Trends es gibt. Hier lernen die Erbslöhs auch wie Holländer mit ihren Familien feiern.
- eventId: 671572
  start: 2026-10-10T15:00:00Z
  stop: 2026-10-10T15:45:00Z
  title: Land & lecker - Kulinarische Schätze aus Schwaben (3)
  subtitle: Räucherduft im Kuhstall und Omas Blätz
  description: 'Die dritte Reise geht nach Schwaben in Bayern zu Verena Krimbacher. Zusammen mit ihrem Mann Hubert hat sie den Hof ihrer Schwiegereltern übernommen - Biopioniere der ersten Stunde. Für das junge Paar gibt es eine neue Herausforderung: Die Kühe sollen an die frische Luft und müssen durch das Dorf bis zur Weide getrieben werden, die außerhalb liegt. Damit das klappt, müssen Verena und Hubert erstmal mit den Tieren üben. Zum Tierwohl gehört für die Allgäuer Wildkräuterführerin auch das Räuchern des Kuhstalls mit Wildkräutern und Harzen.'
- eventId: 672106
  start: 2026-10-10T15:45:00Z
  stop: 2026-10-10T16:15:00Z
  title: Einfach und köstlich
  subtitle: 'Moussaka und Kartoffel-Dreierlei: Björn Freitag kocht mit Rico Birndt'
  description: "Lauch und Kartoffeln - diese einfachen Zutaten verwandelt der bayerische Spitzenkoch Rico Birndt zur Delikatesse. Gastgeber Björn Freitag setzt dem feinen Arrangement ein griechisches Soulfood entgegen: Würzig, schlotzig und mit Feta überbacken - ein köstliches Moussaka à la Björn.  \nAus den übrig gebliebenen Zutaten kreieren die beiden Kochprofis gefüllte Nudeln. Zu Tortelloni mit Auberginen-Füllung gibt es Kamillenschaum - spannend, weil mal ganz anders und wirklich ein kulinarischer Geheimtipp.\n* Gäste: Philipp Vogel, Clara Hunger, Michaela Stöberl, Timo Böckle und Rico Birndt"
