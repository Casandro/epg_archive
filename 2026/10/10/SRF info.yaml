  title: Sternstunde Philosophie
  subtitle: 'Carl Hart: Besser leben mit Heroin und Kokain?'
  description: |-
    Carl Hart forscht an der Columbia Universität in New York zu Drogen und konsumiert selbst regelmässig Substanzen wie Heroin oder Kokain. Olivia Röllin spricht mit ihm über Sucht und Abhängigkeit und das Recht des Einzelnen, sein Bewusstsein durch Drogen zu verändern.
