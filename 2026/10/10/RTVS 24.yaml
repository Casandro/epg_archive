  title: Šport :24 (30)
  subtitle: Jeden bod od postupu do béčka. Novinky zo sveta športu.
  description: Slovenskí futbalisti si dláždia cestu do B divízie Ligy národov. Po štyroch zápasoch síce nemajú na konte očakávaných dvanásť bodov, ale aj desať im dáva predpoklad pokojného spánku. Napĺňajú tým prirodzené očakávania futbalovej verejnosti. Iný ako postupový scenár, v konkurencii Moldavska, Kazachstanu a Faerských ostrovov by bol veľkým sklamaním. V utorok odohrali naši futbalisti zápas v Moldavsku, kde ukončili nekonečný šestnásťdňový reprezentačný zraz. V Kišiňove predviedli to, čo im v predchádzajúcich stretnutiach chýbalo - vysokú streleckú efektivitu, keď zo šiestich striel na bránu vyťažili štyri góly. Pred poslednými zápasmi majú po víťazstve 4:0 na čele tabuľky štvorbodový náskok a osud vo vlastných rukách. O výkonoch reprezentácie, ale aj iných témach sme sa rozprávali s našim expertom Petrom Ďurišom a bývalým reprezentačným trénerom Jánom Kocianom. (2026)
  genre:
  - '33'
