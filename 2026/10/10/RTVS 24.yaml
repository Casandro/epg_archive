  description: Lúky sú oveľa viac než len pestrý koberec rastlín. Pomáhajú zadržiavať vodu, chránia pôdu a poskytujú priestor množstvu rastlín a živočíchov. Ich stav preto ovplyvňuje krajinu, v ktorej žijeme. Prečo mnohé z našich najcennejších lúk potrebujú človeka a čo sa stane, keď sa o ne prestaneme starať? Dokážeme poškodeným lúkam vrátiť život a zároveň ich ďalej využívať? A prečo sa ochrana lúk v konečnom dôsledku týka každého z nás? (2026)
