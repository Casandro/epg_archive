  title: Ludzkość - historia nas wszystkich 1 (odc. 11)
  subtitle: Nadchodzi epoka innowacji, transformacji i masowej produkcji. Niestety, postęp ma też ciemną stronę - popyt na kauczuk doprowadza do dewastacji obszarów naturalnych w Afryce.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Virginia Quinn
    Występują: Richard Machowicz, George Wunderlich, Henry Louis Gates, Jim Rasenberger, Mike Loades, James Meigs
    Koniec wojny secesyjnej pozwala ludzkości wkroczyć na nowe tory siłą rozpędu. Nadchodzi epoka innowacji, transformacji i masowej produkcji. Ludzie zaczynają wierzyć, że nie ma dla nich rzeczy niemożliwych. Japonia w ciągu zaledwie 50 lat z kraju o stosunkach feudalnych zmienia się w przemysłowe supermocarstwo. Ale postęp ma też swoją ciemną stronę. Popyt na kauczuk doprowadza do dewastacji całych obszarów naturalnych w Afryce.
  ageRating: 12
