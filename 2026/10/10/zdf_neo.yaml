  description: |-
    Deutschland 2020
    Wer war dieses sagenumwobene Volk, das sich die Inka nannte und dessen Herrscher sich als "Söhne der Sonne" sahen? Der Film fragt nach den Hintergründen von Aufstieg und Fall des Imperiums.

    Wie aus dem Nichts tauchen sie auf, und innerhalb weniger Jahrzehnte entwickelt sich ihr Reich zum größten Imperium der damaligen Welt. Sie herrschen über mehr als 200 Völker mit gut zehn Millionen Menschen, 1532 ändert die Ankunft der spanischen Konquistadoren alles.
