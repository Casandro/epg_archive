  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Adipositas betrifft mehr als eine Milliarde Menschen weltweit - mit Folgen wie Diabetes, Bluthochdruck und psychischen Belastungen. Neue Medikamente wie GLP-1-Rezeptoragonisten und Hirnstimulationen eines Ärzte-Teams in Mailand zeigen erste Erfolge. Die Dokumentation begleitet Forschende und Betroffene in Deutschland, Frankreich, Italien sowie Dänemark, die mit innovativen Therapien und präziseren OPs helfen und Hilfe bekommen. Doch welche Risiken gibt sie?
