  title: Es war einmal in Nordirland (1/3)
  subtitle: Vom Protest zum Kampf
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Seit der Teilung Irlands 1921 schwelen die Spannungen zwischen katholischen Republikanern und protestantischen Unionisten. Die Mehrheit der Katholiken, die sich nach einem vereinten Irland sehnt, wird von einer protestantischen Minderheit regiert. \nAngespornt von der Bürgerrechtsbewegung in den USA gehen ab 1969 Tausende von Menschen auf die Straße, um gegen das ungerechte Wahlsystem zu demonstrieren. Doch die zunächst friedlichen Proteste nehmen eine unheilvolle Wendung und die neue \"provisorische IRA\" organisiert einen bewaffneten Widerstand gegen Polizei und Armee."
- eventId: 829398
  start: 2026-10-10T23:45:00Z
  stop: 2026-10-11T00:40:00Z
  title: Es war einmal in Nordirland (2/3)
  subtitle: Immer mehr Tote
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Der Konflikt begrenzt sich nun nicht mehr nur auf Belfast, sondern erfasst auch die ländlichen Regionen Nordirlands. Im Rahmen des intensiven Einsatzes von Militär und Polizei werden viele Republikaner und IRA-Mitglieder inhaftiert. Die verbliebenen Familienmitglieder müssen ohne Väter und Ehemänner, mit Ausgrenzung und Schikane zurechtkommen. In den Gefängnissen formiert sich eine Protestbewegung der Häftlinge, die 1981 in einen Hungerstreik mündet, in dessen Verlauf einige der Häftlinge sterben. Die britische Regierung gerät immer mehr unter Druck, eine Lösung für die Situation zu finden.
