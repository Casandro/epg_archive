- eventId: 1415455
  start: 2026-10-10T19:45:00Z
  stop: 2026-10-10T20:40:00Z
  title: Sulawesi - Am Anfang war die Höhlenmalerei
  subtitle: Frankreich 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Lange ging die Wissenschaft davon aus, dass die ersten Kunstwerke der Menschheitsgeschichte vor etwa 40.000 Jahren in Europa entstanden. Neuerdings stellen jedoch auf der indonesischen Insel Sulawesi entdeckte Höhlenmalereien diese Annahme infrage. Dank einer von einem australischen Forschungsteam entwickelten Methode konnten diese Felsbilder sehr genau datiert werden: Sie sind mindestens 62.700 Jahre alt und entstanden somit lange vor der ältesten in Europa bekannten figurativen Kunst.'
- eventId: 829387
  start: 2026-10-10T20:40:00Z
  stop: 2026-10-10T21:35:00Z
  title: Thorin - Der letzte Neandertaler
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Grotte Mandrin im Rhône-Tal ist eine faszinierende Ausgrabungsstätte. Der Archäologe Ludovic Slimak entdeckte hier Fossilien und Feuersteine, die beweisen, dass Neandertaler die Höhle über 80.000 Jahre lang bewohnten. Die Funde erlauben Rückschlüsse auf die Ankunft der ersten Vertreter des Homo sapiens im heutigen Westeuropa vor circa 54.000 Jahren und zeugen sogar von einem Zusammentreffen der beiden Menschenformen. Zudem wurde in der Höhle der erste Neandertaler in Frankreich seit einem halben Jahrhundert ausgegraben: Er gehörte einer der letzten Neandertaler-Linien an und bekam den Namen Thorin.'
