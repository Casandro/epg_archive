  title: Auf den Spuren prähistorischer Künstler - Die Chauvet-Höhle
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Chauvet-Höhle ist ein archäologisches Juwel, das erst vor rund dreißig Jahren entdeckt wurde. Ihre Wandmalereien sind vermutlich über 30.000 Jahre alt und gehören somit zu den ältesten in Europa. Anhand spektakulärer 3D-Rekonstruktionen gewährt der Dokumentarfilm faszinierende Einblicke in die Höhle, die nur einmal pro Jahr von einem Wissenschaftlerteam betreten werden darf. Sie gehört vielleicht zu den ersten Schauplätzen, an denen die Urahnen des modernen Menschen nicht nur zusammenlebten, sondern auch Mythen und Rituale pflegten. Eine Reise zu den Ursprüngen des künstlerischen Ausdrucks.
