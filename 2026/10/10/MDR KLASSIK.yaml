  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Carl Philipp Emanuel Bach: Orgelkonzert Es-Dur, Wq 35 (Rainer Oster, Orgel; Ensemble Parlando); Friedrich Kuhlau: Sonate f-Moll, op. 33 (Dora Bratchkova, Violine; Andreas Meyer-Hermann, Klavier); Nikolai Kapustin: Violoncellokonzert Nr. 2, op. 103 (Christine Rauh, Violoncello; Deutsche Radio Philharmonie Saarbrücken Kaiserslautern: Nicholas Collon); Dmitri Schostakowitsch: Streichquartett Des-Dur, op. 133 (Rasumowsky Quartett); Paul Hindemith: "Nobilissima Visione" (Deutsche Radio Philharmonie Saarbrücken Kaiserslautern: Julian Kuerti)

    2.03  Das ARD-Nachtkonzert (II)

    Louis Spohr: Große Konzertouvertüre F-Dur (Orchestra della Svizzera Italiana: Howard Shelley); Wolfgang Amadeus Mozart: Sinfonie A-Dur, KV 201 (Scottish Chamber Orchestra: Charles Mackerras); Robert Schumann: "Carnaval", op. 9 (Herbert Schuch, Klavier); Albert Heinrich Zabel: Harfenkonzert c-Moll, op. 35 (Emmanuel Ceysson, Harfe; Staatsphilharmonie Rheinland-Pfalz: Hannu Lintu); Percy Grainger: "Danish Folk-Music Suite" (The Melbourne Symphony Orchestra: Geoffrey Simon)

    4.03  Das ARD-Nachtkonzert (III)

    Joseph Bologne de Saint-Georges: Violinkonzert D-Dur, op. 2, Nr. 2 (Stéphanie-Marie Degand, Violine; Le Parlement de Musique: Martin Gester); Pauline Viardot-García: Sechs Stücke (Thomas Albertus Irnberger, Violine; Barbara Moser, Klavier); Jean Sibelius: "Karelia-Suite", op. 11 (Philadelphia Orchestra: Eugene Ormandy)

    5.03  Das ARD-Nachtkonzert (IV)

    Eduard Schütt: "G'schichten aus dem Wienerwald" (Konstantin Scherbakov, Klavier); Giovanni Mossi: Concerto grosso d-Moll, op. 3, Nr. 3 (Florian Deuter, Mónica Waisman, Violine; Harmonie Universelle: Florian Deuter); Johann Strauß: "Spiralen", op. 209 (Wiener Symphoniker: Václav Neumann); Charles Villiers Stanford: Serenade, Allegro comodo (Capricorn); Franz Clement: Violinkonzert Nr. 1 D-Dur, Rondo (Mirijam Contzen, Violine; WDR Sinfonieorchester Köln: Reinhard Goebel); Domenico Scarlatti: Sonate A-Dur, K 211 (Lucas Debargue, Klavier)
