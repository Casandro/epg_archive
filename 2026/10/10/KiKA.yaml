    Was passiert, wenn plötzlich jemand vor deiner Haustür steht, der dein ganzes Leben durcheinanderbringt?

    Für den 14-jährigen Elias beginnt ein ganz besonderer Sommer, als der gleichaltrige Alexander ins Haus gegenüber zieht. Die beiden verstehen sich sofort und werden schnell beste Freunde. Doch Elias merkt bald: Für ihn ist da mehr. Zum ersten Mal ist er verliebt - und weiß nicht, was er mit diesen neuen Gefühlen anfangen soll. Vielleicht könnte aus ihrer Freundschaft tatsächlich mehr werden. Doch gleichzeitig hat Elias Angst: Was werden seine Freunde sagen? Wie wird seine Familie reagieren? Und was passiert, wenn plötzlich alle wissen, wie er wirklich fühlt?

    Aus Unsicherheit beginnt Elias, seine Gefühle zu verstecken. Er erfindet Ausreden und erzählt nicht die Wahrheit. Je größer seine Angst wird, desto mehr gerät er unter Druck. Und ausgerechnet das, was ihm am wichtigsten ist, droht dabei verloren zu gehen: Alexander.
