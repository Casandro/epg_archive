    Als der kleine braune Hase an diesem Morgen aufwacht, sieht alles plötzlich ganz anders aus. Es ist Herbst geworden. Der große braune Hase erklärt ihm, dass die Natur sich verändert, wenn es kälter wird. Doch dem kleinen Hasen gefällt es nicht, dass die Blätter von den Bäumen fallen. Er mochte seine Blätter so, wie sie waren. Dann treffen sie die kleine Feldmaus. Sie findet Herbstlaub toll, weil es so schön raschelt und knistert und lustig von den Bäumen zu Boden trudelt. Aber ob die Bäume nicht frieren, so ganz ohne Blätter? Der große braune Hase beruhigt ihn. Die Bäume frieren nicht und im nächsten Frühling bekommen sie frische Blätter. Doch die Blätter sind nicht das ...
