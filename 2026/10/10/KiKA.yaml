    Der Club zum Mitmachen

    Akrobatik trifft Breakdance - Bühne frei für Breakin' Circus

    Zirkusartistik trifft Breakdance - Die Artistinnen und Artisten von Breakin' Circus sind zu Gast im Tigerenten Club und bringen jede Menge Action und atemberaubende Kunststücke mit auf die Bühne. Sie verbinden dynamische Hip-Hop Kultur mit traditionellen Zirkuselementen und verwandeln ihre Show in ein einzigartiges Erlebnis. Im Tigerenten Club zeigen Sie ihr Können und geben einen Einblick hinter die Kulissen.

    Die Artistinnen und Artisten verraten das ein oder andere Geheimnis und lassen das Publikum daran teilhaben, wie sie ihre Show zum Leben erwecken.

    In der Spielearena wird es ebenfalls spannend: Die Tigerenten der Hermann-Hesse-Realschule aus Göppingen kämpfen gegen die Frösche der Elisabethschule Marburg in actionreichen Challenges um Notbremsen für das große Finale auf der Rodeo-Ente. Für die Frösche an den Start gehen Selina, Omed und Levi und sie spielen gegen Chiara, Devin und Zara vom Team der Tigerenten.

    Die Teams spielen aber nicht nur um den begehrten goldenen Tigerenten-Pokal, sondern auch darum, die Kinderhilfsaktion "Herzenssache" des SWR und SR mit Spendengeldern zu unterstützen. Zuschauer können live mit der KiKA-Quiz App mitspielen und eine kleine Glückstigerente für zuhause gewinnen.
    Moderation: Johannes Zenglein, Laura Knöll, Joyce Stiernon

