    Issie und die anderen haben das Erdbeben mit Gabe im Haus überstanden und erfahren, dass Natasha zu ihnen wollte. Sie finden sie in der Höhle. Bei einem Nachbeben stürzt ein Balken herab.

    Issie und Natasha werden eingeklemmt. Während Stella Hilfe holt, versuchen Dan, Gabe, Caleb und Caroline die beiden Mädchen zu befreien. Doch die Höhle wird zunehmend instabiler. Und schaffen sie es, Toms Unschuld rechtzeitig - vor dem Stallverkauf - beweisen zu können?
