  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nSchwindende Schlüsselkompetenz - Wege aus der Lesekrise\n\nNach dem Vorbild des Hamburger Lesebands sind in vielen Bundesländern verbindliche Lesezeiten im Unterricht eingeführt worden. Wie erfolgreich ist dieses Konzept? Wie muss Leseförderung in Social-Media-Zeiten aussehen, damit sie an den Interessen und der Lebenswelt der Kinder andockt? Und welche Rolle spielen Bibliotheken, Eltern und Lesepatinnen und -paten? \n\nGäste:\nSteffen Gailberger, Professur für Literatur- und Mediendidaktik an der Universität Kiel\nDr. Jörg Maas, Hauptgeschäftsführer ?Stiftung Lesen?\nMilena Minic, Deutschlehrerin in Hamburg\nAm Mikrofon: Dörte Hinrichs\n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de\nWhatsApp 0173 - 535 8089"
