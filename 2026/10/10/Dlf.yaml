  title: Corso - Kunst & Pop
  description: |-
    Das Musikmagazin

    Kaputte Musik für kaputte Zeiten: Bilderbuch mit ??+1?
    Popmusik aus Österreich läuft seit Jahren ziemlich gut. Eine Band, die dabei wesentlich mitgeholfen hat, ist Bilderbuch. Nachdem die Gruppe um Sänger Maurice Ernst zuletzt kaum Autotune und Laptop genutzt hat, kommt beides in starker Ausprägung auf dem neuen Album zum Einsatz. Bilderbuch machen Digital Rock, der lasziv und kaputt klingt wie der Zeitgeist. Realitätsverlust, Optimierungswahn und Drohnen sind das Thema. Das ist großer Pop, der einen Nerv trifft.
     
    Gitarrenrock ohne Nostalgie: Wishy mit dem Album ?Nature?s Pill?
    Der Gitarrenrock der 90er Jahre und Nullerjahre hat zuletzt ein kleines Revival erlebt. Dafür sind viele kleinere Indierockbands verantwortlich, die den Sound ihrer Jugend  - oder möglicherweise ihre Eltern  - neu belebt haben. Eine dieser Bands ist Wishy aus Indianapolis. Auf ihrem zweiten Album ?Nature?s Pill?  klingt dieses Revival aber nicht nach nostalgischer Rückschau, sondern steht mit beiden Beinen fest im Hier und Jetzt.
     
    Das Leben als Party: Troye Sivan mit ?She's the Best?
    Das Leben als große Party - das ist der Entwurf von Troye Sivan auf seinem neuen Album. So viel Hedonismus muss man sich erst mal trauen. ...
