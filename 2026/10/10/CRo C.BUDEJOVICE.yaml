  title: Mezi nebem a zemí
  description: Spolek Letokvět mapuje na Náchodsku kříže podél poutní cesty a bádá proto i v archivech. Karel Sladký zjišťoval víc. Válečné trauma na druhou zažívají už čtyři a půl roku ukrajinské psychoterapeutky. Potýkají se totiž nejen s traumaty svými, ale i svých klientů. O jejich zkušenostech už za chvíli. Představíme knihu Odpouštění. Zamyšlení je od Jakuba Pavlúse, faráře Českobratrské církve evangelické.
