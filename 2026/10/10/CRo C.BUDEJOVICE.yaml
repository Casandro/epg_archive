  title: Písničky z cizí kapsy
  description: Vokální svéráz Ladislav Vodička se do paměti posluchačů zapsal vedle dalších skladeb s modernějším country zvukem i dvěma písničkami, jejichž refrén se nese ve znamení výčtu tuzemských míst, měst a lokalit (Já tu zemi znám) a motoristických povinností a propriet (Řidič má tvrdý chléb). Právě druhou jmenovanou skladbu, u které se ústřední slogan v poněkud toporném spisovném tvaru protlačil i do názvu, si porovnáme s originálem, podle něhož Vodička ušil verzi pro české publikum. Už koncem 60. let s původní skladbou There Ain't No Easy Run sklízel přízeň hlavních adresátů (tedy dálkových řidičů) americký zpěvák Dave Dudley, specialista na songy opěvující právě svět velkých trucků, dlouhých jízd a vytrvalých šoférů, kteří se na ně vydávají. K poslechu zve Martin Schuster.
