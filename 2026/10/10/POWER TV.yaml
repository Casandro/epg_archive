  title: 77 TV 5 (odc. 4)
  subtitle: Program prezentuje ranking wyselekcjonowanych przez zespół researcherów MWE Networks filmów pokazujących prawdziwe i niewiarygodne historie dotyczące różnych zagadnień.
  description: |-
    Tytuł oryginalny: 77 TV
    PL, 2025
    Reżyseria: Karol Warda
    Zespół researcherów MWE Networks przeszukuje najgłębsze zakamarki internetu i archiwów, by wyselekcjonować filmy pokazujące prawdziwe i niewiarygodne historie dotyczące różnych zagadnień. Program ukaże następstwa niebezpiecznych incydentów lotniczych, kolejowych, samochodowych oraz wodnych. Widzowie przekonają się także m.in. co kryje się za niewyjaśnionymi zjawiskami paranormalnymi oraz katastroficznymi przepowiedniami.
