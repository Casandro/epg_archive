  description: "Kinderserie, Frankreich / Belgien 2026\nWährend der Heiratsvertrag mit dem spanischen König auf ihre Unterschrift wartet, schreibt Queen Elizabeth heimlich Nachrichten mit Lord Dudley. Doch plötzlich bleibt seine Antwort aus.\n\nAls auch der Falke verschwindet, mit dem sie ihre Botschaften austauschen, befürchtet die Königin eine Intrige. Sie schickt Grace auf Spurensuche. Gemeinsam mit Ellie und Masou macht sie sich auf den Weg. Doch bisher wissen sie nicht, dass Grace eine Spionin ist.\nDarsteller:\nLady Grace Cavendish - Evie Coles\nEllie Bunting - Carys John\nMasou Fallaize - Rafael Alessandro\nMrs. Champernowne - Tracey Wilkinson\nLord Francis Walsingham - Gabeen Khan\nLord William Cecil - Toby Longworth\nRegie: Alexander Jacob\nBuch/Autor: Joe Williams \nKamera: Sacha Wiernik\nSchnitt: Lucas Mitschi, Louis Zabus\nMusik: Jeremy Warmsley\nHD-Produktion"
