  description: |-
    Krimiserie, Schweden / Deutschland 2023
    Die gefeuerte Staatsanwältin Tilda arbeitet in einer Flüchtlingsunterkunft der schwedischen Einwanderungsbehörde. Dort lernt sie Ibraahin kennen, der sich als genialer Ermittler entpuppt.

    Tilda nimmt die Ausführungen des Asylbewerbers aus Somalia zunächst nicht ernst. Doch als Ibraahin ihr exakt schildert, an welcher Stelle die 15-jährige Anna verschwunden ist, wird sie hellhörig. Es stellt sich heraus, dass Ibraahin richtig liegt.
