  description: |-
    Familienkomödie, Deutschland 2025
    Kristina Lurz ist seit kurzem Bürgermeisterin von Waldsee, einer kleinen Stadt irgendwo in Deutschland. Sie sieht das als Sprungbrett in die große Politik. Bundestag. Mindestens.

    Ihr Mann Lennart ist deutlich bescheidener. Ihm würde schon reichen, wenn er Leiter der IT beim größten örtlichen Arbeitgeber würde. Aber da haben sie ihm einen jüngeren Mann mit mehr Ellenbogen vor die Nase gesetzt: Rico.
