  description: "Kinderserie, Belgien / Großbritannien 2026\nEin prunkvolles Schloss, weitläufige Gärten, eine berühmte englische Königin des 16. Jahrhunderts. Doch bei Hof ist nicht alles, wie es scheint. Verschwörung und Intrige bahnen sich an.\n\nDie 14-jährige Lady Grace beweist einen feinen Instinkt, wenn es um die Sicherheit der Königin geht. Seit dem Verlust ihrer Mutter, die als Vorkosterin bei einem Giftanschlag starb, ist Grace hochsensibel und steht unter dem besonderen Schutz ihrer Patin, der Queen.\nDarsteller:\nLady Grace Cavendish - Evie Coles \nEllie Bunting - Carys John\nMasou Fallaize - Rafael Alessandro\nMrs. Champernowne - Tracey Wilkinson\nLord Francis Walsingham - Gabeen Khan\nLord William Cecil - Toby Longworth\nRegie: Alexander Jacob , Louise Ní Fhiannachta\nBuch/Autor: Anna McCleery\nKamera: Sacha Wiernik \nSchnitt: Lucas Mitschi, Louis Zabus \nMusik: Jeremy Warmsley\nHD-Produktion"
