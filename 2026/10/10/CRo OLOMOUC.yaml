  title: Hobby magazín
  description: Jak se postarat o jahodníky ve vyvýšeném záhonu, aby v pohodě přečkaly zimu? Odstranit plevel, ostříhat je, přikrýt, zalévat? Poradíme. Letošní parné a suché léto se podepíše i na výsledcích rybářské práce. Ne že by byla menší kvalita ryby, ale přírůstky nejsou takové, jak by se čekalo. Ryby ohrožoval zejména nedostatek kyslíku a provzdušňovat lze jen menší rybníky. Rybáři museli snížit množství krmení, aby se výrazně zpomalil rybí metabolismus. Více informací se dozvíte od Slávky Brádlové. Kolik prachu nám do domu přiletí při intenzivním větrání? To zjišťoval Tomáš Sysel z Institutu zdravého bydlení, zakoupil potřebnou techniku a začal měřit, více se dozvíte v reportáží Jirky Šobra.
