  title: Mezi nebem a zemí
  description: Spolek Letokvět mapuje na Náchodsku kříže podél poutní cesty a bádá proto i v archivech. Karel Sladký zjišťoval víc. Válečné trauma na druhou zažívají už čtyři a půl roku ukrajinské psychoterapeutky. Potýkají se totiž nejen s traumaty svými, ale i svých klientů. Jak přežít dobu plnou konfliktů? Kde hledat pevný bod v čase nejistoty? A může být odpuštění cestou, jak nezůstat uvězněni v nenávisti? Tím se zabývá kniha Odpouštění, kterou vám představíme. A čeká nás i pravidelné zamyšlení. Dnes je od Jakuba Pavlúse, faráře Českobratrské církve evangelické.
