  description: 'Ödön von Horváth: Povídky z Vídeňského lesa. Stříbropěnný Dunaj, vídeňský valčík. Láska a smrt ve stínu řeznictví. Ten život umí být ale banální. Lidová divadelní hra. Překlad Jiří Stach, překlad písní Pavel Kopta. Rozhlasová úprava Miroslav Stuchl. Scénická hudba Petr Mandel. Dramaturgie Jana Paterová. Režie Markéta Jahodová. Účinkují: Jaroslava Obermaierová, Martin Preiss, Vilma Cibulková, Jiří Štěpnička, Radoslav Brzobohatý, Bohumil Klepl, Miroslav Donutil, Lenka Krobotová, Radek Holub, Luba Skořepová, Eva Hrušková, Vlastimil Zavřel, Alfred Strejček, Zdeněk Maryška a další. Natočeno v roce 2002.'
