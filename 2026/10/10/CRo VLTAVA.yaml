  title: Znojmo v královském hávu 2/3
  description: Před 800 lety povýšil český král Přemysl Otakar I. město Znojmo na město královské. Významnou událost připomíná Jihomoravské muzeum mimořádnou výstavou Tváře města Znojma. Vzácné dokumenty jsou během výstavy na krátkou dobu postupně instalovány a těší se velké pozornosti návštěvníků. Od 13. října bude ve znojemském Domě umění představena unikátní Kniha městských práv s nádhernými iluminacemi. Nahlédneme do ní s archivářkou Irenou Sklenskou a historičkami umění Monikou Frecerovou a Klárou Benešovskou. Natáčela Eva Ocisková.
