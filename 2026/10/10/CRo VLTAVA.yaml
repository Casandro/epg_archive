  title: Zrcadlo křížlické
  description: Krkonoše se v těžkých pobělohorských dobách staly útulkem mnoha náboženských vysídlenců. Ihned po vydání Tolerančního patentu, 13. října 1781 na celém Jilemnicku přihlásilo na dvanáct set lidí k evangelické víře, z toho nejvíce v Křížlicích - 57. Splněna tak byla podmínka k založení první samostatné náboženské obce, která předepisovala alespoň 500 duší. Letos si křížličtí připomínají také 240. výročí otevření svého kostelíka. Ve studiu ČRo Hradec králové připravila Eliška Pilařová.
