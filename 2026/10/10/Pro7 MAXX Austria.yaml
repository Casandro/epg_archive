  title: 'Voltron: Legendärer Verteidiger'
  subtitle: |-
    Tränen des Balmera
    Fantasy, USA 2016
    Altersfreigabe: ab 12
    (WH vom Samstag, 03.10.2026, 12:50 Uhr)
  description: |-
    Um ihre Freunde zu befreien, kämpft sich Pidge durch Sendaks gefährliches Schiff. Dabei muss sie nicht nur furchtlose Roboterwachen überwinden, sondern sich auch Haxus in einem harten Kampf stellen. Indes landen Hunk und Coran auf dem Planeten Balmera, dessen Volk von Zarkon versklavt und zur Arbeit in den Minen gezwungen wird. Dort begegnet Hunk der mutigen Shay, die heimlich von einem Leben in Freiheit träumt. Hunk setzt alles daran, diesen Traum Wirklichkeit werden zu lassen.

    Komponist: Brad Breeck, Brian Parkhurst
  widescreen: true
