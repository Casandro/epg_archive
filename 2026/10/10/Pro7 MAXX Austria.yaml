    Aufbruch zur Rettung des Universums
    Fantasy, USA 2016
    Altersfreigabe: ab 12
  description: |-
    Als die Paladine mit ihrem Schloss-Raumschiff Kurs auf Balmera nehmen, empfangen sie das Notsignal eines gestrandeten Schiffes. Pflichtbewusst eilen sie zur Hilfe und treffen auf Rolo und Nyma, die sich als freundliche Verbündete ausgeben. Doch das scheinbar harmlose Duo verfolgt einen hinterhältigen Plan: Nyma erschleicht sich Lances Vertrauen, um den Blauen Löwen in ihre Gewalt zu bringen. Diesen wollen sie Zarkon im Austausch für eine Belohnung und Begnadigung übergeben.

    Komponist: Brad Breeck, Brian Parkhurst
  widescreen: true
