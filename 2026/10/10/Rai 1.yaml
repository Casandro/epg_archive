  subtitle: 'DOCUMENTARIO - In questa puntata:- Seguiamo un fotografo naturalista di fama internazionale: il tedesco Carsten Peter. I vulcani sono fra i soggetti preferiti dei suoi famosi reportage;- Visitiamo in Valle d''Aosta il Castel'
  description: |
