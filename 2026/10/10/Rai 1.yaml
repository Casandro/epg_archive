  description: |-
    o parenti, si sfidano sulla loro capacità di indovinare, formare, completare e ordinare parole e "catene" di vocaboli. Sarà, soprattutto, decisiva la loro capacità di capirsi al volo nel gioco "intesa vincente" che stabilisce i campioni della puntata. Solo loro avranno accesso al gioco finale e alla possibilità di aggiudicarsi il montepremi accumulato. - Conduce Pino Insegno
