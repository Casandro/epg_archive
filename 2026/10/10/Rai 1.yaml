  title: Linea Verde Italia - Pesaro
  subtitle: RUBRICA - In questa puntata facciamo tappa a Pesaro, una gemma incastonata sulla costa nord delle Marche. Raccontiamo di questa città e del suo territorio, tra mare, monti, musica e maioliche. Una Pesaro che, con la su
  description: "a Bicipolitana, permette di scoprire splendidi itinerari, insieme a tante altre curiosità tra natura, gastronomia, cultura e arte. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore Esecutivo Daniela Rainaldi\nRegia di Raffaele Cappelli"
