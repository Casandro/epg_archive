  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Operation Copra
  description: Durch ihre Landung in der Normandie haben die Alliierten einen ersten Brückenkopf errichtet. Der Weg zur Befreiung Frankreichs und ganz Europas von der Nazi-Herrschaft ist allerdings noch weit. Erst nach wochenlangem Stellungskrieg bringt im Juli die "Operation Cobra" bei Saint-Lô einen ersten entscheidenden Durchbruch. "Der Zweite Weltkrieg - Schlacht um Europa" lässt Veteranen beider Seiten zu Wort kommen und beleuchtet darüber hinaus die Folgen des Attentats auf Hitler am 20. Juli.
