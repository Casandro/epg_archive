  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - D-Day
  description: 'Im Frühjahr 1944 bilden die Alliierten unter der Führung der USA und Großbritanniens die mächtigste Streitmacht aller Zeiten. Ihr Ziel ist es, Europa von der deutschen Besatzung zu befreien. Zunächst soll an der nordfranzösischen Küste ein Brückenkopf errichtet werden. Am 6. Juni ist es soweit: Die Invasionstruppen stürmen die Strände der Normandie. Doch wie funktionierte damals ein Schwimmpanzer? Wie schwer war die Ausrüstung der Soldaten?'
  genre:
