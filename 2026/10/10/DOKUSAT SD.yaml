  description: Hitlers Popularität steigt dank des wirtschaftlichen Aufschwungs, auch bei Nicht-Parteimitgliedern. Er fördert den Autobahnbau und verspricht den Deutschen ein bezahlbares Auto, den Volkswagen, für dessen Produktion eine neue Stadt entsteht. Die Nürnberger Parteitage werden zu beeindruckenden Schauveranstaltungen für Hitlers Macht und das wiedererstarkte Deutschland. Sein Privatleben bleibt geheim, während er in Benito Mussolini einen Vertrauten findet.
