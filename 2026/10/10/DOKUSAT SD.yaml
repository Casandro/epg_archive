  title: Hitler - Eine deutsche Tragödie
  subtitle: Hitler - Eine deutsche Tragödie - Ein Eroberer
  description: Hitler überfällt Polen, was Großbritannien und Frankreich zum Krieg gegen Deutschland zwingt. Die schnelle Eroberung Polens stärkt sein Selbstvertrauen. Nach dem Überfall auf Dänemark und Norwegen marschiert Deutschland in die Niederlande, Belgien und Frankreich ein, während Großbritannien von Dünkirchen fliehen muss. Hitlers Selbstbewusstsein wächst enorm.
