  title: Ben Cropp - Geheimnisvolles Australien
  subtitle: Ben Cropp - Geheimnisvolles Australien - Südseeinseln des Feuers
  description: Der Abenteurer, Naturfilmer und Ethnologe Ben Cropp ist in diesem Dokumentarfilm in einer der aktivsten Vulkanzonen der Welt im Südwestpazifik unterwegs, die sich über die Inseln Indonesiens und Melanesiens bis in die Südsee hinein erstreckt. Er versucht zu ergründen, wie sich die Menschen dieser Region an die gefährlichen Lebensumstände so nahe an den Vulkanen angepasst haben und welche Auswirkungen der Mensch selbst auf diesen Lebensraum ausübt.
