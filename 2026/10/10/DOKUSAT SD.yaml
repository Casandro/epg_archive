  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Die Schlacht um Caen
  description: Anfang Juni 1944 gelingt den Alliierten zwar die Landung in der Normandie, doch dann gerät der Vormarsch zur Befreiung Frankreichs ins Stocken. Der Widerstand der deutschen Besatzer ist einfach zu heftig. Im Mittelpunkt dieser Folge von "Der Zweite Weltkrieg - Schlacht um Europa" steht die erbittert geführte Schlacht um die strategisch wichtige Stadt Caen. Dabei geht es auch um die Funktionsweise des deutschen Maschinengewehrs MG 42 und den gefürchteten SS-Panzerkommandanten Michael Wittmann.
