  title: Auftrag Auto Kurzversion
  subtitle: Auftrag Auto Kurzversion
  description: 'SPORT1-Zuschauerin Jessica will einen Kleinwagen für maximal 10.000 Euro. Viele Hersteller brüsten sich damit, dass ihre Einstiegsmodelle nur vierstellig kosten. Aber wie viel Neuwagen gibt es tatsächlich für 10.000 Euro? Das will die junge Mutter von Cyndie und Alex wissen. Alex geht es vor allem um Sicherheit und Alltagstauglichkeit, Cyndie um Fahrspaß. Aber: Gibt es in der Kategorie überhaupt sowas wie Fahrspaß? Ein Fall für "Auftrag Auto". Wie immer hat sich Alex etwas einfallen lassen und eine Überraschung für seine Lieblings-Rennfahrerin.'
  widescreen: true
