  title: Tuning TV - Classics
  subtitle: Tuning TV - Classics
  description: 'Breiter, tiefer, schneller: In den ''Tuning TV Classics'' blickt SPORT1 auf die Highlights des Kultformats zurück, das sich rund um die  Auto-Veredelung dreht. News über Messen und Club-Treffen, Fahrberichte und Testfahrten von der Rennstrecke, Tuning-Produkte aller Art oder Servicetipps direkt aus der Garage - hier wird das ganze Spektrum des Tunings präsentiert. Das Moderatoren-Trio bilden die ''Tuning-Engel'' Lina van de Mars, Katharina Kuhlmann und Rennfahrerin Christina Surer.'
