  title: Teleshopping
  subtitle: Teleshopping
  description: Beim unterhaltsamen TV-Einkaufserlebnis "Teleshopping" werden Produkte aus aller Welt präsentiert, die den Alltag erleichtern. Das umfassende Portfolio beinhaltet die neuesten Produkte aus den Bereichen Fitness, Freizeit, Wellness, Beauty, Küche und Haushalt.
  widescreen: true
