  title: Die Zwangsvollstrecker
  subtitle: Episode 2
  description: "Paul Bohill und sein Arbeitskollege Steve Pinner sind Gerichtsvollzieher des \"High Court of Justice\". Sie treiben Geld bei Menschen ein, die ihre Schulden nicht zahlen können oder wollen. Die Zwangsvollstrecker sind die letzte Instanz, wenn alle anderen Möglichkeiten ausgeschöpft sind. So auch in diesem folgenschweren Fall: Im Londoner East End zahlt eine Familie seit sechs Monaten keine Miete. Schriftliche Benachrichtigungen und Telefonanrufe werden hartnäckig ignoriert. Deshalb führen die Männer vor Ort eine Zwangsräumung durch. \nGBR 2014"
  widescreen: true
