  title: Die Zwangsvollstrecker
  subtitle: Episode 1
  description: "Mike Allonby und sein Arbeitskollege Terry Jones sollen in Liverpool einen Pkw beschlagnahmen. Die Gegend ist als sozialer Brennpunkt bekannt. Der Besitzer des Autos hat einen Kredit aufgenommen und seinen Wagen als Sicherheit eingesetzt. Auf diese Weise kommt man zwar schnell an Bargeld, doch der Zinssatz ist extrem hoch - in einigen Fällen bis zu 400 Prozent. Und wenn man die Raten nicht pünktlich zahlt, geht das Fahrzeug in den Besitz des Finanzunternehmens über. Aber damit will sich der Schuldner partout nicht abfinden. \nGBR 2014"
