  title: Die Zwangsvollstrecker
  subtitle: Episode 3
  description: "Steve Wood ist seit über zwanzig Jahren Gerichtsvollzieher in Bristol. Der Brite hat sich auf die Zwangsräumung von Gewerbeimmobilien spezialisiert und führt pro Woche bis zu fünfzig Aufträge aus. In dieser Folge trifft es den Pächter eines Eckladens in der Vorstadt Clifton. Der Mann hat beträchtliche Mietschulden in Höhe von umgerechnet 6000 Euro angehäuft, deshalb werden vor Ort die Schlösser ausgetauscht. Und sollte sich der säumige Kandidat anschließend gewaltsam Zugang zu dem Geschäft verschaffen, wäre dies eine Straftat. \nGBR 2014"
