  description: Patří trest smrti do civilizovaného světa? Nezdařená poprava americké vražedkyně Christy Pikeové vyvolala novou vlnu žádostí o milost a oživila debaty o trestu smrti. Je morálně přípustné popravovat těžké zločince, nebo je právo na život naprosto nezcizitelné? Chrání absolutní trest společnost, nebo ji naopak poškozuje? O těchto zásadních otázkách budeme diskutovat s publicistou Romanem Jochem a bioetikem a knězem Markem Orko Váchou. Moderuje Lucie Vopálenská.
