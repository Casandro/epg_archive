  title: Radiokniha
  description: 'Markéta Hejkalová: Dům pod náměstím (1/10). Dům pod náměstím v malém městě na Vysočině (první písemná zmínka o něm je z roku 1695) začíná vyprávět o svých obyvatelích. U některých se zastaví více, jiní se pouze mihnou. Roku 1887 začíná příběh rodiny Veselých, jejichž potomci postupně vybudují ve městě továrnu na výrobu ponožek - a pak dům prodají. Pro rozhlas připravila Blanka Kostřicová. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkuje Zdeněk Bureš.'
