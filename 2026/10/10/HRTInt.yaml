  title: Danijela Martinović "Otvoreno srce", snimka koncerta (1. dio) (KD V. Lisinski, 08.03.2022.)
  subtitle: ' '
  description: 'Spektakularan koncert Otvoreno srce, prepun emocija i atmosfere zbog koje se publika odmah podigla na noge, priredila je 8. ožujka 2022. diva hrvatske glazbene scene - Danijela Martinović u Koncertnoj dvorani Vatroslava Lisinskog. Već od prve pjesme publika je nadglasala glazbenicu koja obilježava 30 godina glazbene karijere. Do posljednjeg mjesta ispunjena i danima prije rasprodana koncertna dvorana, savršeno je opisala povezanost glazbenice i njezine publike. Danijela im se odužila na najbolji način i Dan žena pretvorila u glazbenu čaroliju. Na dvosatnom koncertu redali su se legendarni hitovi, ali i novi: Danima, godinama, satima, Pleši sa mnom, Neka mi ne svane, Ljubav ne odustaje... Skladbe su se nizale u savršenom ritmu, a publika je Danijeli uzvraćala čistom srećom, osmijesima i gromoglasnim pljeskom. Danijeli se na pozornici pridružila još jedna velika zvijezda, Vesna Pisarović, s kojom je otpjevala ''Da znaš'', što je publika nagradila ovacijama, baš kao i duet s drugim glazbenim gostom, Markom Toljom, s kojim je izvela skladbu ''Ti si princeza''. Poseban trenutak u Lisinskom svakako je bila i dodjela nagrade Hrvatske diskografske udruge, koju je Danijeli u povodu 30 godina iznimne karijere uručila direktorica Hrvatske diskografske udruge Maja Vidmar Klarić. Nakon tri desetljeća na sceni, brojnih nagrada, predivnih koncerata i međunarodnih nastupa, Danijela s ponosom kaže da je zakoračila u neopisivo razdoblje svoga života. Upravo takav je bio i Danijelin koncert.'
