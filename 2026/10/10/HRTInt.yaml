  title: 'Hrvatska moj izbor: Marija i Zdenko'
  subtitle: ' '
  description: Hrvatska je, znali su oboje, njihovo konačno odredište. Zdenko je put Njemačke krenuo kao tinejdžer, jer je majka morala trbuhom za kruhom. Ondje se odlično snašao, no cijelo je vrijeme gravitirao domovini. Iako još uvijek živi na relaciji Hrvatska - Njemačka zbog poslovnih kontakata, pozicija savjetnika premijera omogućuje mu da ostvari davnu želju - gospodarski prosperitetnu domovinu. Marija se nije vratila nego doselila. Rođena u Americi, od prvih je koraka upijala hrvatski jezik, kulturu i običaje. Oduvijek je znala da želi stvoriti obitelj u svojoj pravoj domovini. Danas, kao majka troje djece, počinje vlastiti biznis kroz koji će pomagati povratnicima u Hrvatsku da se lakše uklope u život.
