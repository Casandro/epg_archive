  title: Višnja na Tašmajdanu, film
  subtitle: Višnja na Tašmajdanu (1968) Ljubavni/Drama
  description: Film govori o rađanju ljubavi dvoje mladih, o njezinu trajanju, sa svim teškoćama i ljepotama koje sa sobom nosi, te o gašenju te ljubavi koja pada pod teretom dinamike i vrijednosti suvremenog života. Radnja filma prati živote nekoliko mladih ljudi iz jedene beogradske škole i njihove probleme, a posebno život Miloša Petrovića koji upoznaje Višnju. Višnja je prikazana kao vrlo lijepa djevojka koja voli koketirati i želi se svidjeti Milošu. No njemu, koji je zaljubljen, to ne odgovara jer uz sebe želi imati osobu koju voli. Na kraju se ispostavlja da je Višnja daleko od simpatične djevojke kakvom ju je zamišljao, pa je Miloš napušta.
