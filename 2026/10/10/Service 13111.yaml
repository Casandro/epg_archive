  title: Ocean's Twelve
  description: "160 Millionen Dollar plus Zinsen in nur zwei Wochen fordert der skrupellose Casinobesitzer Terry Benedict (Andy Garcia) von Danny Ocean (George Clooney) und seiner Bande. Diese Summe haben ihm \"Oceans Eleven\" vor drei Jahren gestohlen. Ein persönlicher Racheakt Benedicts, denn das Geld hat er schon längst von der Versicherung zurückbekommen. Nach dem spektakulären Raub führen Danny und seine Frau Tess (Julia Roberts) ein bürgerliches Leben. Rusty Ryan (Brad Pitt) arbeitet im Hotelgewerbe, die anderen Bandenmitglieder sind untergetaucht. Als Danny die alten Kompagnons einberuft, wird klar, dass niemand in der Lage ist, seinen Anteil des geforderten Geldes auftreiben zu können. Die Bande muss erneut auf Raubzug gehen, diesmal jedoch in Europa. Die Europol-Agentin Isabel Lahiri (Catherine Zeta-Jones) ist den Ganoven jedoch bereits auf den Fersen. Zudem zeigt sich mit dem cleveren Franzosen \"Night Fox\" (Vincent Cassel) ein unliebsamer Konkurrent. \n\nEin ganzes Haus anheben, um eine alte Aktie zu klauen, oder ein Fabergé-Ei durch ein Hologramm zu ersetzen, sind nur einige der Kunstgriffe, die der charismatische Danny Ocean und seine Diebesbande in der Gaunerkomödie \"Ocean's Twelve\" anwenden müssen. Die Fortsetzung des Kinohits \"Ocean's Eleven\" von Regisseur Steven Soderbergh besitzt den gleichen locker-leichten Inszenierungsstil wie sein Vorgänger. Angeführt von George Clooney (Danny Ocean), Brad Pitt (Rusty Ryan), Julia Roberts (Tess), Andy Garcia (Terry Benedict) und Matt Damon, stehen auch Catherine Zeta-Jones (die zwielichtige Agentin Isabel Lahiri), Vincent Cassel (\"Bösewicht\" Night Fox) und Bruce Willis (als er selbst) auf der Besetzungsliste.  \nThriller, Vereinigte Staaten Von Amerika 2004, R: Steven Soderbergh"
  widescreen: true
- eventId: 1459375
  start: 2026-10-10T20:35:00Z
  stop: 2026-10-10T22:35:00Z
  title: Gringo
  description: "Eine Geschäftsreise nach Mexiko! Auf Harold (David Oyelowo) wirkt das wie eine Belohnung seiner Dienste für das Pharmaunternehmen Promethium. Die Vizepräsidenten Richard Rusk (Joel Edgerton) und Elaine Markinson (Charlize Theron) haben einen wichtigen Termin mit Sanchez, dem Leiter des mexikanischen Firmensitzes. Promethium lässt dort neuartige Marihuana-Pillen herstellen. Aus Zufall bekommt Harold mit, dass das Unternehmen fusioniert werden soll und seine Entlassung bevorsteht. Damit gerät jedoch auch Sanchez in große Schwierigkeiten, da er das Promethium-Produkt an ein mexikanisches Drogenkartell verkauft hat. Als Kartellboss Villegas davon erfährt, lässt er Sanchez ermorden. In der Zwischenzeit plant Harold seine eigene Entführung. Die Motel-Besitzer Ronaldo und Ernesto sollen sich als Kidnapper ausgeben und ein hohes Lösegeld von Richard eintreiben. Dieser beauftragt daraufhin den Söldner Mitch, die Geisel zu befreien. Allerdings steckt Harold tatsächlich in Gefahr. Denn um an die Formel der Marihuana-Pille zu gelangen, beabsichtigt Villegas den Angestellten zu verschleppen. Auf einmal steckt \"Gringo\" Harold zwischen den Fronten von Drogenhändlern, Kleingaunern und Rauschgiftfahndern.\n\nDer Australier und Ex-Stuntman Regisseur Nash Edgerton (\"The Square - Ein tödlicher Plan\") inszenierte mit \"Gringo\" eine dunkelschwarze Actionkomödie. Joel Edgerton (der Bruder des Regisseurs) spielt den zynischen Pharmaunternehmer Richard, seine ebenso zynische Geliebten Elaine wird von Oscar-Preisträgerin Charlize Theron dargestellt. Als Opfer haben sich die beiden den gutmütigen Harold (David Oyelowo) ausgesucht. \nComedy, Vereinigte Staaten Von Amerika 2018, R: Nash Edgerton"
  widescreen: true
- eventId: 1459385
