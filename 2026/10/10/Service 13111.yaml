  subtitle: Vorbericht
  description: "Die DTM geht am Hockenheimring zum letzten Stop der Saison 2026. Motorsport-Fans dürfen sich auf viel Action und Spannung freuen. Mit am Start unter anderem die beiden Österreicher Lucas Auer im Mercedes-AMG Team und Thomas Preining im Manthey Racing Team. Da sich Titelverteidiger Ayhancan Güven nach der Saison 2025 aus der DTM verabschiedete, richten sich nun viele Augen auf Ex Champion Mirko Bortolotti, der nach 3 Jahren zurück zum Grasser-Racing-Team wechselt. Moderator Raphael Sampt liefert vor Ort Stimmungsberichte, News und Interviews, Kommentator Daniel Goggi wird in ausgewählten Rennen von Experte Philipp Eng begleitet. \nDeutschland 2026"
