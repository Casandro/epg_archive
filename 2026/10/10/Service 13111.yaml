  title: Heimatleuchten
  subtitle: Unsere Nationalparks - Die Kalkalpen
  description: |-
    Wilde Bachläufe, verzauberte Urwälder und geheimnisvolle Höhlen - all das zeichnet den Nationalpark Kalkalpen aus. Seltene Tier- und Pflanzenarten fühlen sich in den Urwaldteilen, den tiefen Schluchten und wilden Bachläufen sowie auf den zahlreichen sanften Almen des Sengsengebirges und im Reichraminger Hintergebirge heimisch. Der Nationalpark Kalkalpen ist nicht nur das größte zusammenhängende Waldschutzgebiet Österreichs, sondern auch bei den Menschen als Erholungs- und Lebensraum beliebt. Hier, im Südosten Oberösterreichs, zwischen Enns und Steyr, sind Menschen zuhause, die sich um Wald und rar gewordene Tierarten wie den Luchs kümmern. Oder Höhlenforscher, die in tiefe Schächte unter der Erde vordringen. Altes Handwerk wird ebenso noch hochgehalten, wie bei einem Messerschmied, der in seiner alten Werkstatt dem in der Region früher typischen Handwerk noch heute nachgeht. Ein Besuch auf der Gschwendtalm überrascht ein kleines bisschen, weil sich hier drei junge Leute einer alten Alm angenommen haben und diese auf durchaus neue Art führen.
    Volkskultur, Österreich 2018
  genre:
  - '116'
  widescreen: true
- eventId: 1441600
  start: 2026-10-10T00:45:00Z
  stop: 2026-10-10T01:33:47Z
  title: P.M. Wissen
  subtitle: Alles in Ordnung? - Wie uns Aufräumen glücklich machen kann
  description: 'Unordnung entsteht schnell - und dass sie uns stresst, ist sogar wissenschaftlich belegt. Unser Gehirn schüttet bei Unordnung vermehrt das Stresshormon Kortisol aus. Ein chaotisches Umfeld beeinflusst uns zudem negativ: In verschmutzten Küchen neigen wir zu schlechten Ernährungs-Gewohnheiten, in alter Bettwäsche schlafen wir schlecht und wichtige Entscheidungen schieben wir am unordentlichen Arbeitsplatz auf. Aber Aufräumen fällt oft schwer. "P.M. Wissen" begleitet einen Aufräum-Coach bei einem Einsatz in Wien und klärt, mit welchen Tipps und Tricks wir unser Chaos wieder in den Griff bekommen.Österreich 2023'
  genre:
  - '144'
  widescreen: true
- eventId: 1441601
  start: 2026-10-10T01:33:47Z
  stop: 2026-10-10T01:50:00Z
  title: BilderWelten
  description: Bilder aus der Vogelperspektive bilden den Kern von BilderWelten. In unterschiedlichen Specials finden Zeitlupen-Studien und Unterwasseraufnahmen ebenso Platz wie ein virtueller Flug über die Oberfläche des Mars. BilderWelten bietet Entspannung pur und ist rund um die Uhr als Online-Stream verfügbar.Österreich 2026
