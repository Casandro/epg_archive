  title: P.M. Wissen
  subtitle: LKW mit Fernsteuerung - Ist das die Zukunft des Warentransports?
  description: 'Auf der Testrecke Weindlau in Niederösterreich wird gerade ein autonomer, also selbstfahrender LKW getestet - doch der LKW fährt noch nicht komplett autonom. Am Steuer: ein sogenannter "Teleoperator". Das Steuer ist allerdings nicht wie üblich im Führerhaus des LKWs, sondern an einem Büroplatz mit vier Bildschirmen. Kameras am LKW übertragen die Front-, Rück- und Seitenansichten ins Büro. Mit LKW-Führerschein und einer extra Ausbildung soll der Teleoperator in Zukunft autonomen Fahrzeugen bei Problemen "aus der Ferne" helfen. "P.M. Wissen" Reporter Philipp McAllister geht in Niederösterreich der Frage nach, wie die Zukunft des LKW-Fahrens aussieht. // Milan von dem Bussche will mit seinen Schulkameraden eigentlich nur coole Handyhüllen herstellen. Handyhüllen aus dem 3D-Drucker. Doch das sogenannte Filament, die "Tinte" für den 3D-Drucker, ist teuer und das Taschengeld der drei Schüler knapp. Also muss es anders gehen. Die 15-Jährigen nisten sich in der Garage von Milans Eltern ein und bauen einen Extruder: ein Gerät, das Plastik einschmilzt und daraus das fadenartige Filament produziert. Fünf Jahre später haben sie eine eigene Firma in Darmstadt und produzieren Maschinen und recyceltes Filament für 3D-Drucker. // Ein Team der FH Salzburg möchte den Energiebedarf beim Heizen reduzieren. Und zwar indem sie Holz so behandeln, dass es tagsüber noch mehr Sonnenenergie speichern und diese nachts als Wärme wieder abgeben kann. Mit einer eigenentwickelten Imprägnierung soll so das Holz zur Passiv-Heizung werden. Außerdem: Wer hat den Ultraschall erfunden? Was macht ein Kea mit einem Schneeball? Wie unterstützt ein Roboter Feuerwehrleute? Und: Was ist Legasthenie?Österreich 2023'
  genre:
  - '144'
  widescreen: true
