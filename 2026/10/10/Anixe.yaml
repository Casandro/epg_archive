  title: Kraftvoll Leben - Die Zeichen der Zeit erkennen
  subtitle: Kraftvoll Leben - Die Zeichen der Zeit erkennen
  description: In dieser Predigt geht es darum, was für ein Lebensstil für uns als Christen in der aktuellen Zeit sehr wichtig sein wird. Möglicherweise ist dir auch aufgefallen, dass die Zeit, in der wir leben, immer hektischer und schneller wird. Ereignisse, die die Welt verändern, geschahen früher in Jahrzehnten. Heute passieren ganze Jahrzehnte in wenigen Wochen oder sogar Tagen. Aus diesem Grund ist es für uns wichtiger denn je, die Stimme Gottes selbst zu hören, ihm in den Momenten unseres Alltags zu begegnen und mit ihm ganz eng unterwegs zu sein.
- eventId: 1557142
  start: 2026-10-10T00:29:00Z
  stop: 2026-10-10T00:59:00Z
  title: ERF Mensch Gott - Gott gibts echt! - Lebenswende am Mount Everest
  subtitle: ERF Mensch Gott - Gott gibts echt! - Lebenswende am Mount Everest
  description: 'Steve sucht sein Glück auf den Gipfeln der Welt: Er will die sieben höchsten Berge aller Kontinente besteigen. Erfolg und Leistung sollen ihm geben, wonach er sich sehnt: Anerkennung und das Gefühl, angekommen zu sein. Sechs Berge hat er schon bezwungen. Doch am Fuße des Mount Everest hat er eine krasse Begegnung, die ihm das Leben rettet und ihm zeigt: Das, was er wirklich sucht, findet er nicht auf einem Berggipfel.'
