  stop: 2026-10-10T04:35:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Taiwan mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 2 - Taiwan mit Michael Roll
  description: 'VIP Trip - Prominente auf Reisen 2: Entdecken Sie zusammen mit dem bekannten Schauspieler Michael Roll die Schönheit des Inselstaates Taiwan. Das im Pazifik vor der chinesischen Festlandküste gelegene Taiwan ist in vielerlei Hinsicht ein beeindruckendes Reiseland. Unsere Reise beginnt in der Hauptstadt Taipeh. Rund drei Millionen Menschen leben hier. Traditionelle chinesische Tempel und riesige Wolkenkratzer prägen das Stadtbild. Chinesische Architektur bestimmt auch den "Platz der Freiheit". Darunter das im Stil der Ming-Dynastie erbaute Ehrentor und die Gedenkstätte für Taiwans Staatsgründer Chiang Kai-shek, errichtet aus weißem Marmor. Vor der nationalen Konzerthalle beobachtet Michael Roll am frühen Morgen eine Gruppe Taiwaner beim Tai Chi, dem beliebten Freizeitsport. Von ferne grüßt Taipei 101, einer der spektakulärsten Wolkenkratzer der Welt, dessen Form einem Bambusrohr ähnelt.  Bald lässt Michael Roll die Metropole Taipeh zurück und nimmt den Hochgeschwindigkeitszug in die mystischen Alishan-Berge. Diese Region bietet mit seinen nebelreichen, grünen Bergen und milden Temperaturen optimale Bedingungen für den Teeanbau. Deshalb entschließt sich Michael zum Besuch einer Teeplantage, wo er sich zudem noch die Einzelheiten der Tee-Zeremonie  erläutern lässt, bei einer Tasse feinstem Oolong-tee. Aber schon lockt die Taroko-Schlucht, eine Felsregion, in die das Flußwasser seit Urzeiten einen tiefen Canyon geformt hat.   DE 2013'
- eventId: 1601041
  start: 2026-10-10T04:35:00Z
  stop: 2026-10-10T04:56:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Alberta mit Susanne Fröhlich
  subtitle: VIP Trip - Prominente auf Reisen 3 - Alberta mit Susanne Fröhlich
  description: 'VIP Trip - Prominente auf Reisen 3: Die kanadische Provinz Alberta im Winter: Begleiten Sie die bekannte deutsche Bestseller-Autorin Susanne Fröhlich auf einer Reise durch die romantische Schneelandschaft der Rocky Mountains. Das Abenteuer beginnt am Lake Louise im Banff National Park. Ein lauffreudiges Schlittenhundgespann zieht Susanne tief in die nahezu menschenleere Waldlandschaft des Parks. Flüsse, Seen und Bergtäler bestimmen die grandiose Kulisse. Gleichgesinnte trifft sie auf den Trails eher selten -  die scheinbar unendliche Weite der kanadischen Provinz verhindert große Menschenansammlungen, wie man sie von anderen Destinationen kennt. Zurück am eingefrorenen See nimmt Susanne an einem ganz besonderen Festival teil. Beim Ice-Magic-Festival arbeiten internationale Künstler an ihren selbstgefertigten Eisskulpturen. Nach Ende des Festivals schmücken die Werke aus Eis die ohnehin eindrucksvolle Szenerie am Lake Luise, bis die ersten Sonnenstrahlen des Frühlings sie zum Schmelzen bringen. Im Banff Springs Hotel tauscht sich Susanne zudem mit einem Mitglied der Royal Canadian Mountain Police aus. Hier erfährt sie mehr über den besonderen Status der berühmten Polizeitruppe. Diese nehmen als Repräsentanten des kanadischen Ideals von Recht und Ordnung eine wichtige Stellung im öffentlichen Leben ein. Über den Icefields Parkway macht sich die Schauspielerin sodann auf den Weg nach Jasper, dem größten Ort im gleichnamigen Nationalpark, der auch zum UNESCO Weltnaturerbe gehört. Hier besucht Sie mit einem kanadischen Guide die Eis-Schluchten des Maligne River. Auf dem Eis erwandern sie die mit Eiskristallen geschmückten Höhlen und Becken, die der Fluss über Jahrtausende geformt hat. Bis zu 50 Meter ragen die Kalksteinwände auf beiden Seiten in die Höhe. Zurück in der Zivilisation erforscht Susanne die Provinzhauptstadt Edmonton. Nach mehreren Tagen in der Wildnis, bildet die Stadt mit viel Kunst- und Kultur eine angenehme Ergänzung. DE 2012'
- eventId: 1600684
  start: 2026-10-10T05:00:00Z
  stop: 2026-10-10T05:25:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Malaysia mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 3 - Malaysia mit Jürgen Heinrich
  description: 'Auf einer Reise abseits des Großstadtdschungels von Kuala Lumpur geht der TV-Schauspieler Jürgen Heinrich in Malaysia auf Entdeckungstour. Die Reise beginnt an der Ostküste des Archipels in einer pittoresken Bucht. Neben viel Entspannung am weißen Sandstrand und in der luxuriösen Hotelanlage ist ein Abenteuer im kristallklaren Wasser geboten. So schnorchelt Jürgen Heinrich durch die farbenfrohe Unterwasserwelt, die mit Rochen, bunten Fischen und Schildkröten einiges zu bieten hat. Auf einer Fahrradtour in der Region lernt der Schauspieler den Alltag der Einheimischen näher kennen, von der Herstellung von Zigaretten oder handgefertigten Palmdächern  bis hin zur Zucker- und Schnapsproduktion aus regionalen Naturprodukten. Angekommen auf Borneo besucht Jürgen Heinrich eine Pfefferfarm. Nicht nur für ihn ist es eine neue Erkenntnis,  dass verschieden-farbige Pfefferkörner sehr wohl von der gleichen Pflanze abstammen können. Das Wahrzeichen der Insel ist jedoch nicht der Pfeffer. Zwischen tosenden Wasserfällen und bis zu hundert Meter langen Kletterpflanzen führt die Reise durch den dichten Regenwald, um eines der faszinierendsten Lebewesen dieser Erde zu treffen: Orang Utans. Je mehr der Regenwald gerodet wird, desto schwieriger wird es für die Primaten zu überleben. Der Schauspieler hat das große Glück, die Tiere aus nächster Nähe beobachten zu können. Auf Borneo lebten ursprünglich 27 verschiedene Volksstämme. Im Ort Nanga Ukom leben die Iban, eine der großen ethnischen Gruppen auf Borneo. Hier wird Jürgen Heinrichs in den Gemächern des Häuptlings zum Essen eingeladen. Er erlebt lokale kulinarische Feinheiten und traditionelle Tänze, bevor um Mitternacht die Generatoren ausgehen und der Tag endet.     DE 2006'
