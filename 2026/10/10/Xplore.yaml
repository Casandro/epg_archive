  title: 'Bike Mike: Bodensee - Königssee  - Etappe 9: Von Traunstein zum Königssee'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 9: Von Traunstein zum Königssee'
  description: Hier seht ihr die neunte und letzte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der letzte Tag beginnt in Traunstein und führt über sensationell schöne kleine Sträßchen über die sanften Kuppen der Voralpenlandschaft. Unsere Reifen rollen sowohl über asphaltierte , als auch versickerungsfähige Untergründe. Vorbei am malerisch gelegenen Höglwörther See mit seiner uralten Klosteranlage geht es hinab bis zur Saalach, der wir nach Bad Reichenhall folgen. Nach einem Besuch des prachtvollen königlichen Kurgartens fahren wir nun mitten in die Alpen hinein. Der letzte nennenswerte Anstieg dieser Reise nach Berchtesgaden lässt uns ein bisschen wehmütig werden - zu ereignisreich waren die letzten 1 1/2 Wochen. Dementsprechend genießen wir auch die finalen Meter, bis wir am türkisfarbig schimmernden Königssee eintreffen. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
