  subtitle: 'Macho Man 2: Er ist ehemaliger Boxprofi. War 9-facher Deutscher Meister und zweifacher Europameister - Rene Weller. Sein Partner gilt als Frankens bekanntester Bodyguard. Er hat Bill Clinton, Michael Jackson und Muhammad Ali beschützt...'
  description: 'Macho Man 2: Er ist ehemaliger Boxprofi. War 9-facher Deutscher Meister und zweifacher Europameister - Rene Weller. Sein Partner gilt als Frankens bekanntester Bodyguard. Er hat Bill Clinton, Michael Jackson und Muhammad Ali beschützt. Peter Althof. Was haben beide gemeinsam? Eine bewegte Vergangenheit, jede Menge Erfahrung im Ring und 90 Minuten puren Trash. Macho Man hieß der in Nürnberg gedrehte Action Film von 1985. Das Budget war niedrig, die Schauspielleistungen so mittel und schrecklich nachsynchronisiert wurde das ganze auch noch. Trotzdem gilt der Film als Kult! Ob Althof, Weller oder Michael Messing - Karate Meister und dritter im Bunde der Schauspielriege. 30 Jahre später soll es jetzt eine Neuauflage geben. Mit altbekannter Besetzung!'
