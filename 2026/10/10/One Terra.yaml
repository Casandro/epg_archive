  title: Planet Weltweit - Vagabunden der Wüste Gobi
  subtitle: Planet Weltweit - Vagabunden der Wüste Gobi
  description: Die Eheleute Sarangerel und Badbold ziehen mit ihren 54 Kamelen, 26 Rindern und etwa 230 Schafen und Ziegen durch den Südwesten der Wüste Gobi. Die Bedürfnisse der Tiere bestimmen ihren Tagesablauf. Ihr Leben hat den Geschmack von Kamelmilch und Ziegenblut, den Geruch von Tierschweiß und Wollfett, das Gefühl von Eiswind und Sonnenbrand auf der Haut. Noch fühlen sich viele Kamelzüchter eins mit der Natur, die sie umgibt. Feiner, brauner Sand wirbelt durch die Luft, schemenhaft erkennt man riesige braune Leiber, die sich langsam vorwärtsbewegen. Es ist eine Gruppe zweihöckriger Kamele, die durch die Wüste Gobi zieht. Die Nüstern sind verschlossen, Sandkörner hängen in den dichten Wimpern. Die Tiere gehören den Eheleuten Sarangerel und Badbold, die als Nomaden mit ihrem Vieh immer dann weiterziehen, wenn das spärliche Gras der Weiden von den Tieren abgefressen wurde. Das Frühjahr ist für die Nomaden besonders arbeitsreich. In diesen Wochen werden Hunderte von Jungtieren geboren, bedroht von der enormen Kälte in der Nacht und hungrigen Wölfen. Die genügsamen und anpassungsfähigen Trampeltiere sind es vor allem, die den Viehzüchtern das Überleben in dieser lebensfeindlichen Umwelt ermöglichen. Immer wieder packen Sarangerel und Badbold ihren gesamten Hausstand, die Dachsparren und die Filzdecken ihrer Jurte auf die Rücken ihrer Kamele. Nur die 81 jungen Zicklein kommen in den Kofferraum eines alten Jeeps. Auf ihrer Reise zum Frühlingsquartier durchqueren die Nomaden die Südwest-Gobi - vor der Kulisse des Altaigebirges mit seinen schneebedeckten Kuppen und Gletschern. Nur ihr Sohn begleitet Sarangerel und Badbold, die Töchter leben in der Bezirkstadt Bayantoroi. Die jüngste Tochter geht dort auf ein Internat. Sie will Lehrerin werden oder Ärztin - nicht Kamelzüchterin wie ihre Eltern. Viele Nomaden haben nach der Einführung von Demokratie und Marktwirtschaft in der Mongolei ihre Tiere verkauft und sind in die Hauptstadt Ulan-Bator gezogen. DE 2005
