  title: Planet Weltweit - Sardinien, Stolz und Ehre hoch zu Ross
  subtitle: Planet Weltweit - Sardinien, Stolz und Ehre hoch zu Ross
  description: 'In einem sardischen Hirtendorf findet seit mehreren hundert Jahren ein ganz besonderes Schauspiel statt: Mit einem wilden Pferderennen ehren die Einwohner von Sedilo ihrem "Heiligen" Konstantin, der eigentlich römischer Kaiser war und ein Wegbereiter des frühen Christentums. Die sogenannte "Ardia" von Sedilo stellt die entscheidende Schlacht Konstantins nach. Für die streng gläubigen Dorfbewohner ist dieses Rennen Anfang Juli der religiöse und gesellschaftliche Höhepunkt des Jahres. Auch zehntausende Sarden und Touristen pilgern in das bergige Hinterland Sardiniens, um die einzigartige Atmosphäre der Ardia mitzuerleben. Es sind die letzten ruhigen Tage in Sedilo, einem Bergdorf in der Mitte Sardiniens, nahe dem Lago Omodeo. Viele der rund 2400 Einwohner sind Hirten. Ihr Leben wird vom Tagesrhythmus der Tiere bestimmt. Begriffe wie Ehre und Familie haben hier große Bedeutung, lange Zeit war das Leben im Dorf aber auch von Blutrache und Entführungen überschattet. Sedilo ist ein Dorf der Reiter und Austragungsort des größten Spektakels auf Sardinien - der Ardia. Bei diesem Pferderennen geht es nicht um Geld, sondern um Ruhm und religiöse Gelübde. Schon im frühen Jugendalter haben sich die Männer aus dem Dorf dafür in das Buch des Priesters eingetragen, der jedes Jahr den ersten Fahnenträger, den Anführer des Rennens, bestimmt. In diesem Jahr ist Don Agostinos Wahl auf Giovanni Mula, genannt "Su Bellu" - der Schöne - gefallen. Su Bellu hatte im letzten Jahr einen schweren Unfall. Eigentlich ist er noch nicht fit genug, mit Dutzenden wilden Reitern um die Kirche zu jagen. Doch er hat dem Heiligen Konstantin sein Versprechen gegeben und will es nun einhalten. Dabei ist noch nicht einmal klar, ob die Ardia in diesem Jahr überhaupt stattfinden wird. Im letzten Jahr gab es einen tödlichem Sturz, und nun haben sich Inspektoren aus Rom angekündigt, die neue Sicherheitsauflagen fordern, wie Unfallversicherungen, tierärztliche Kontrollen und Alkoholtests. DE 2011'
  ageRating: 6
- eventId: 1600826
  start: 2026-10-10T08:10:00Z
  stop: 2026-10-10T09:02:00Z
  title: Planet Weltweit - Sokotra, Schatzinsel in Gefahr
  subtitle: Planet Weltweit - Sokotra, Schatzinsel in Gefahr
  description: 'Auf der jemenitischen Insel Sokotra lebten die Menschen über Jahrtausende im Einklang mit einer einzigartigen Natur. So konnten in der Abgeschiedenheit des Indischen Ozeans nicht nur urzeitliche Drachenblut- und Weihrauchbäume überdauern, sondern auch eine eigene Sprache und Kultur entstehen. Seit 2008 ehrt die UNESCO Sokotra als Weltnaturerbe - gleichzeitig jedoch verlieren die strengen Regeln, mit denen die Beduinen-Stämme die Natur traditionell schützen, an Kraft. Wir begleiten einen Berghirten über die urtümliche Insel vor dem Horn von Afrika und zeigt seinen Überlebenswillen. Sokotra zählt rund 700 weltweit einzigartige Pflanzen- und Tierarten - nur auf Galapagos und Hawaii sind es noch mehr. Doch fortschreitende Überweidung bedroht viele der seltenen Gewächse und auch die Existenz der Hirten selbst. Mit seiner Ziegenherde kann der 55-jährige Berghirte Abdullah Ablihin seine Familie im Hinterland Sokotras heute kaum noch ernähren. So bleibt ihm nur die Tagelöhnerei in Hadibu, dem Hauptort an der Küste. Noch ist das enge soziale Netz der Einheimischen nicht gerissen: bei einem Fischer kann er unterwegs selbstgemachte Butter gegen Salz tauschen, ein alter Nachbar gewährt ihm Unterkunft in seinem modernen Haus in Hadibu. Doch die beiden sprechen kaum noch die selbe Sprache: an der Küste verdrängen arabische Einflüsse das einheimische Sokotri. Ein Freund des Berghirten versucht deshalb, die aussterbende Kultur zu bewahren, indem er Tonaufnahmen der schon fast verstummten sokotrischen Dichter und Schamanen macht. Nachdem Abdullah Ablihin auf einer Baustelle genug Geld verdient hat, fahren die beiden gemeinsam in die Berge zurück. Mit den dringend erwarteten Lebensmitteln - und einer Idee, wie Abdullah und seine Familie ihre bisherige Lebensweise bewahren könnten. DE 2009'
