  title: Planet Weltweit - Taipan, die gefährlichste Schlange der Welt
  subtitle: Planet Weltweit - Taipan, die gefährlichste Schlange der Welt
  description: |-
    In den Weiten des australischen Outbacks tummeln sich unzählige Gifttiere wie Schlangen und Spinnen - viele von ihnen zählen zu den giftigsten Tieren überhaupt. Wie etwa der Taipan. Er gilt als die gefährlichste Schlange der Welt: Die Giftmenge eines einzigen Bisses könnte bis zu hundert Menschen töten. Auf der anderen Seite kann das Gift Leben retten, wenn es als Medikament eingesetzt wird. Und wenn es jemanden gibt, der es wagt, dieses extrem gefährliche Tier zu fangen. Professor Bryan Grieg Fry gehört zu den wenigen, die sich dieser lebensbedrohlichen Aufgabe stellen. Für seine Forschungen reist er monatelang durch das Land, um Taipane zu fangen.

    Snake, also Schlange, nennen ihn seine Freunde - diesen Namen wird der 18-jährige Ryan Cole wohl für immer behalten. Er gehört zu den wenigen, die einen Taipanbiss überlebt haben. Dass es heute ein Gegenmittel zum Biss dieser gefährlichen Schlange gibt, ist Männern wie Bryan Fry zu verdanken, die es sich zur Aufgabe gemacht haben, das Gift zu sammeln und zu untersuchen. Regelmäßig durchstreift der Professor aus Melbourne das australische Outback, um die scheuen, aber auch gewandten Reptilien zu fangen. Trotz vorhandenen Antiserums könnte ein Biss verheerende Folgen haben. Das Gift des Taipans ist um ein Vielfaches stärker als das einer Kobra. Wen wundert es da, dass vielen Australiern beim Anblick dieser Schlange das Blut in den Adern gefriert. Vor allem wenn der Taipan, wie viele andere Schlangen auch, während der Regenzeit menschliche Siedlungen aufsucht. Ein lohnendes Geschäft für den Schlangenfänger Kristopher Foster. Bis zu fünf Mal am Tag rückt er aus, um verirrte Taipane, Braunschlangen oder auch harmlose Teppichpythons aus Wohnungen zu holen. Was treibt Menschen wie Foster oder Fry dazu, sich freiwillig einer solchen Gefahr auszusetzen? Bryan Fry hat bereits drei seiner Freunde durch Schlangenbisse verloren und litt selbst neun Monate unter den quälenden Folgen des Bisses einer giftigen Wasserschlange. DE 2010
  ageRating: 6
