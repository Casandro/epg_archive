  title: Planet Weltweit - Island, Leben auf dem Pulverfass
  subtitle: Planet Weltweit - Island, Leben auf dem Pulverfass
  description: Im Frühjahr 2010 legte der isländische Vulkan Eyjafjallajökull halb Europa lahm, als seine Aschewolken über Tage den Flugverkehr behinderten. Auf Island selbst war vor allem die Region um das Dorf Vik an der äußersten Südspitze der Insel betroffen. Beim Ausbruch des Eyjafjallajökull ist Vik - außer der überall sichtbaren Asche - noch glimpflich davon gekommen. Doch was passiert, wenn auch der wesentlich größere Nachbarvulkan Katla ausbricht, dessen Kegel von einem riesigen Gletscher bedeckt ist? Ein Szenario, das in Islands Geschichte schon mehrmals vorkam.  Island - geboren durch die unbändige Kraft der Vulkane und noch immer von ihr geprägt, auch im täglichen Leben der Inselbewohner. Nach dem letzten Vulkanausbruch ist vor dem nächsten Vulkanausbruch. Die Katla mit ihrem dicken Eispanzer ist rechnerisch als nächster Vulkan fällig. Ob und wann es genau passiert, weiß niemand, aber wenn es passiert, dann hat vor allem das Dorf Vik ein Problem - und den Einwohnern bleibt nicht viel Zeit, um sich in Sicherheit zu bringen. Zu ihnen gehört auch der Arzt Sigurgeir Jensson und seine Frau Helga Thorbergsdottir. Sie sind im 300-Seelen-Ort Vik eine Institution und die einzigen medizinischen Versorger im Umkreis von über hundert Kilometern - auch bei einem Vulkanausbruch, wie zuletzt im Frühjahr 2010. Den ganzen Tag fahren die beiden zwischen den weitverstreuten Farmen rund um die Katla umher - Hausbesuche bei Patienten. Besonders seit überall Asche auf Feldern, Straßen und in Gärten verstreut ist, gibt es viel zu tun. Die Asche gefährdet die Gesundheit der Bevölkerung und die ihrer Tiere. Die beiden machen Lungentests und klären über den richtigen Umgang mit der Asche auf. In ihren Gesprächen geht es aber nicht nur um körperliche Leiden. Die Menschen besprechen ihre Sorgen und Nöte mit dem Paar - reine Vertrauenssache. Ohne dieses Vertrauen zueinander würde das Zusammenleben zwischen den Vulkanen wohl kaum funktionieren. DE 2011
