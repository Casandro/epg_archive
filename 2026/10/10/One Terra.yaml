  title: Planet Weltweit - Escobars Erbe - Kolumbiens Kokain-Hippos
  subtitle: Planet Weltweit - Escobars Erbe - Kolumbiens Kokain-Hippos
  description: 'Planet Weltweit: Flusspferde gehören zu den gefährlichsten Tieren Afrikas - mittlerweile sind sie aber auch in Kolumbien zum Problem geworden, mehrere Tausend Kilometer von ihrem natürlichen Lebensraum entfernt. Als Kokain-Millionär Pablo Escobar in den 1980er-Jahren begann, afrikanische Flusspferde zu seinem privaten Vergnügen zu halten, konnte noch niemand in Kolumbien ahnen, dass die Tiere bald eine Gefahr für das Ökosystem des gesamten Landes werden würden. Denn aus den vier Hippos, die nach dem Tod Escobars in die Freiheit entkamen, wurden inzwischen mehrere Hundert. Die tonnenschweren Kolosse, die in Südamerika keine natürlichen Feinde haben, breiten sich aus und verschmutzen mit ihren sauren Exkrementen das Wasser - was zur Verdrängung einheimischer Tierarten führt. Außerdem bedrohen sie die Fischer an den Flüssen. Auf der anderen Seite entdecken gerade arme Familien die Flusspferde als Geldquelle, denn immer mehr zahlungskräftige Touristen buchen geführte Ausflüge inklusive Hippo-Watching. Isabel Romero etwa ernährt ihre Familie durch ihre Geschäftsidee als Naturführerin, sie ist immer wieder von der urwüchsigen Kraft der Flusspferde fasziniert. Ganz im Gegensatz zur Tierärztin Gina Serna, die ständig nach neuen Wegen sucht, die Zahl der Tiere einzudämmen. Da sie nicht erschossen werden dürfen, will Gina nun ein Tier fangen und kastrieren. Eine aufwändige Operation unter freiem Himmel - und eine Weltpremiere dazu, denn eine OP wie diese gab es noch nie. Gina will es trotzdem versuchen - auch wenn Landsleute wie Isabel ihr dabei skeptisch über die Schulter schauen werden. Denn möglicherweise ist dies die wirksamste Methode, um den riesigen Invasoren zu begegnen.  DE 2021'
- eventId: 1600938
  start: 2026-10-10T20:15:00Z
  stop: 2026-10-10T21:07:00Z
  title: Planet Weltweit - Das Elsass - Land der Orgeln
  subtitle: Planet Weltweit - Das Elsass - Land der Orgeln
  description: 'Planet Weltweit: In keiner Region Frankreichs gibt es mehr Orgeln als im Elsass, von fast 8000 im ganzen Land finden sich allein im Elsass 1250. Die Königin der Instrumente scheint mit ihren mächtigen Klängen Himmel und Erde miteinander zu verbinden. Sie zu bauen und zu restaurieren, ist seit Jahrhunderten eine Kunst. Patrick Armand ist Orgelbauer. Er betreibt eine der renommiertesten und ältesten Orgelbau-Manufakturen, die Firma Muhleisen im elsässischen Eschau. Die  Orgelmanufaktur befasst sich mit vier verschiedenen Aufgaben: Der Wartung bzw.  Pflege alter Orgeln, dem Neubau, der Restaurierung, bei der das Instrument komplett auseinandergebaut und in Einzelteilen in die Werkstatt gebracht wird und auch mit der sogenannten Ausreinigung, einer Generalüberholung, die hauptsächlich vor Ort stattfindet. Orgelbauer brauchen neben ihrer musikalischen Qualifikation -sie sind oft selbst Organisten- auch ein komplexes handwerkliches Können, sie müssen mit Holz, Eisen, Metalllegierungen, mit edlen und uralten Materialien umgehen können. Die Arbeiten an den einzelnen Projekten sind aufwändig und erstrecken sich meist über mehrere Jahre. In der Manufaktur Muhleisen ist für eine Kirche in Köln gerade der Neubau einer Orgel in der Planung, in Versailles kümmert sich das Team um die Ausreinigung eines Instruments und in Nordfrankreich, in Amiens, wird die Merklin-Orgel der Kirche Notre-Dame derzeit komplett überholt. Viele Spezialistinnen und Spezialisten braucht es, alle leisten ihren Beitrag zur Bewahrung der Instrumente vergangener Jahrhunderte. Eine Orgel stirbt nicht, sagen die Orgelbauer, sie ist für die Ewigkeit gedacht - und gerade deshalb ist sie für viele bis heute die Königin der Instrumente. DE 2021'
- eventId: 1600954
  start: 2026-10-10T21:15:00Z
  stop: 2026-10-10T22:07:00Z
  title: Planet Weltweit - Die Waldbahn der Karpaten
  subtitle: Planet Weltweit - Die Waldbahn der Karpaten
  description: 'Seit über 70 Jahren schnauft ein Relikt vergangener Zeiten fast täglich zuverlässig die Berge hinauf. Die Reportage zeigt, wie eine kleine, dampfbetriebene Waldbahn den Menschen des Örtchens Oberwischau bei ihrer beschwerlichen Arbeit hilft, Holz durch das enge Wassertal zu transportieren. Obwohl niemand weiß, wie lange es diese Bahn noch geben wird, hat der junge Feuermacher Gheorghe Andreica einen Traum: Er will Lokführer der Waldbahn werden. Oberwischau und das angrenzende Wassertal sind Orte lebendiger Geschichte. Umschlossen von den tiefen Wäldern der Karpaten fanden hier Rumänen, Juden, Ungarn und Deutsche eine gemeinsame Heimat. An diesem Ort märchenhafter Sagen und Geschichten überlebte eine vergessen geglaubte Verbindung aus Feuer, Wasser und Stahl - eine der letzten dampfbetriebenen Waldbahnen Europas. Der junge Feuermacher Gheorghe Andreica setzt die Dampflok Cozia-1 sechs Tage in der Woche unter Dampf. Immer schon war das Wassertal ein Zentrum des Holzeinschlags. Und auch heute noch transportiert die Schmalspurbahn Holzfäller hinauf in die tiefen Wäldern der Maramures und etwa 200 t Holz zurück ins Tal. Doch die Waldbahn ist bedroht - durch Überschwemmungen und die ökonomische Schwäche der Region. Gheorghe Andreica größter Wunsch ist es trotzdem, eines Tages ihr Lokführer zu werden. Doch dafür muss er sich in den Augen seines Chefs erst einmal bewähren. Und so ist jede Fahrt für Gheorghe Andreica eine Reise mit Emotionen, Ängsten und Hoffnungen. DE 2004'
