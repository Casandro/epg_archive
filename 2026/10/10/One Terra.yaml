  title: Planet Weltweit - Tasmanien - Wächterin im Paradies
  subtitle: Planet Weltweit - Tasmanien - Wächterin im Paradies
  description: |-
    Tasmanien ist ein einzigartiges Naturparadies: Wilde Strände, dichter Regenwald, zerklüftete Bergketten mit leuchtend blauen Seen und alpine Moorlandschaften vereinen sich auf engstem Raum. Auf der Insel leben Wombats, Schnabeligel und Tasmanische Teufel. Ein Drittel der gesamten Fläche steht unter Naturschutz. Die Rangerin Lalani Hyatt patrouilliert täglich in ihrem Jeep durch das Arthur-Pieman-Schutzgebiet, bekämpft Waldbrände, stellt Umweltsünder oder rettet verwaiste Jungtiere. Für die Vierzigjährige ein Traumjob in einer Traumlandschaft - der allerdings in Gefahr ist. Denn die Provinzregierung plant eine Neubesetzung ihrer Stelle.

    Tarkine, eine wilde, ursprüngliche Gegend im Nordwesten Tasmaniens, ist das Einsatzgebiet der Rangerin Lalani Hyatt. Hinter der zerklüfteten Küste erstreckt sich ein Meer aus Sanddünen, in deren Schutz Süßwasserlagunen liegen. Im Landesinneren wechseln sich weite Heidenlandschaften mit dichtem Wald ab, der von 90 Meter hohen Eukalyptusriesen dominiert wird. Lalani Hyatt ist täglich im Arthur-Piemann-Schutzgebiet unterwegs - im Jeep, zu Fuß, per Flugzeug und Boot. Nicht immer kann sie die Naturschönheiten nur genießen. Hin und wieder muss sie sich mit wilden Motorrad-Rockern auseinandersetzen, die das Gebiet zu ihrem Cross-Gelände auserkoren haben. Außerdem fühlen sich einheimische Fischer und Landwirte von der umtriebigen Beamtin in ihrer täglichen Arbeit gegängelt. Hyatts größte Herausforderung sind jedoch die Waldbrände, die jeden Sommer ganze Landstriche in Tarkine vernichten. Um ihr Aufflackern von vornherein zu verhindern, muss Lalani Hyatt oft weit draußen im Wald oder am Strand in einer Hütte übernachten. Zeiten, in denen der Job recht einsam sein kann. Viel Zeit für eine Familie bleibt da nicht. Von Freunden wird Lalani Hyatt daher auch die "einsame Rangerin" genannt. Sie selbst kann sich hingegen nicht vorstellen, jemals etwas anderes zu machen. DE 2006
