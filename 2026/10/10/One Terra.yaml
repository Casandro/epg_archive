  title: Planet Weltweit - Lamu, die Insel der Esel
  subtitle: Planet Weltweit - Lamu, die Insel der Esel
  description: 'Die Insel Lamu vor der kenianischen Küste hat eine der höchsten Esel-Dichten der Welt: Auf 24.000 Einwohner kommen 6.000 Esel. Grund dafür sind die engen Straßen und Gassen der Insel, durch die schlichtweg keine Autos passen. So gibt es auf Lamu auch nur zwei, wovon eines für das Esel-Hospital im Einsatz ist. Die Tiere wiederum sind überall in den Inselalltag integriert, als Lastenträger, Transport- oder Reittier. Einmal im Jahr, während des Lamu-Kulturfestivals, findet sogar ein weithin bekanntes Eselrennen statt. Der vierzehnjährige Shee Famao hat dieses Rennen bereits zweimal gewonnen. Nun will er wieder antreten.  Wohin man auf Lamu auch blickt: Überall traben mehr oder weniger gut erzogene Esel vorbei. Ob als Transport-, Lasten- oder Reittiere - sie ermöglichen den meisten Einwohner der kleinen Insel vor der kenianischen Küste ein regelmäßiges Einkommen. Das gilt auch für den vierzehnjährigen Shee Famao, der seit dem Weggang seines Vaters für die Familie sorgen muss. Allerdings muss Shee den Esel mieten, denn für ein eigenes Tier fehlt der Familie das Geld. Eine Chance, die Ersparnisse aufzustocken, wäre der Gewinn des jährlichen Eselrennens. Dieses Rennen hat Shee in der Vergangenheit schon zweimal gewonnen, für einen eigenen Esel hat es bisher aber nicht gereicht. Shee trainiert hart für den Sieg - aber sein Bewährungshelfer droht, ihm keinen Strich durch die Rechnung zu machen. Wie viele Jugendliche auf Lamu hat Shee mit den ihm anvertrauten Tieren in der Vergangenheit kleine Mengen Marihuana geschmuggelt. Und auch die Schule hat er in dieser Zeit häufig geschwänzt. Als Erziehungsmaßnahme haben ihm die Behörden daher das Reiten der Tiere untersagt. Andererseits attestiert Shees Lehrerin, dass er sich in der Schule stark verbessert hat. Und weil er später gern Tierarzt werden will, hilft er schon heute im Esel-Hospital mit. DE 2011'
