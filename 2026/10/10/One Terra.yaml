  title: Planet Weltweit - Das Kinderparlament von Rajasthan
  subtitle: Planet Weltweit - Das Kinderparlament von Rajasthan
  description: 'Tagsüber hütet die 13jährige Neraj Jath Ziegen in der dürren Felslandschaft am Rand der Wüste Thar, abends besucht sie die Abendschule ihres Dorfes. In ihrer knappen Freizeit ist sie Ministerin für Ackerbau und Viehzucht im Parlament der Kinder von Rajasthan. Wir zeigen das Leben einer ungewöhnlichen Parlamentarierin zwischen Ziegenstall und Politikbetrieb. Der Bundesstaat Rajasthan im Nordwesten Indiens gehört zu den unwirtlichsten Regionen des Landes, die Menschen gelten als rückständig und arm. Und doch hat sich hier ein Projekt entwickelt, das in ganz Indien einmalig ist: Damit die Kinder die Bedeutung von Demokratie und Rechtsstaatlichkeit erlernen, wurde das Parlament der Kinder gegründet. Die Idee entstand in den Abendschulen, die in den 1970er Jahren auf Initiative der nichtstaatlichen Organisation "Barefoot-College" mit Unterstützung der UNESCO eröffnet wurden. Heute, nach über 25 Jahren, gibt rund 150 Abendschulen mit über 3.000 Schülern. Eine davon ist die 13jährige Neraj Jath. In ihrem Amt kümmert sie sich um die Ausstattung der Schulen und die Wasserversorgung in den Dörfern. Gleichwohl muss Neraj zuhause alltägliche Pflichten erledigen. Als Ministerin überwacht sie die Abendschulen, prüft, ob die Lehrer zuverlässig unterrichten, kümmert sich um defekte Schullampen und Wasserpumpen. Das derzeitige Hauptproblem der Menschen der Region und damit auch von Ministerin Neraj ist die langanhaltende Dürre, die dazu geführt hat, dass die letzten Wasserreserven nicht gleichberechtigt verteilt werden. So hat Neraj den Einfall, das Puppentheater für ihre Ziele einzusetzen. Die Puppenspieler sollen Szenen aufführen, die zeigen, wie kostbares Wasser gespart werden könnte. Davor jedoch muss sie den Ältestenrat des Dorfes überzeugen. Eine Herausforderung, denn in der traditionsverhafteten Gesellschaft Rajasthan zählt das Wort einer Frau wenig. Wird es da ein dreizehnjähriges Hirtenmädchen schaffen, die alten Männer für ihre Idee zu gewinnen?  DE 2004'
