  title: Grundkurs Glaubenserneuerung (Folge 30)
  subtitle: Spiritualität
  description: Folge 30. Es geht in den Kursen der Glaubenserneuerung darum, Glaubenswissen zu vermitteln, um im Hinblick auf Glaubensfragen sicherer zu werden. Aber es geht auch darum, diese Glaubenswahrheiten in Beziehung zu setzen zum eigenen Leben, um sie praktisch umsetzen zu können, damit der Glaube zu Willensentscheidungen veranlasst und zum konkreten Handeln anregt. Schlussendlich geht es auch um die Vertiefung der persönlichen Beziehung zu Gott, um gelebte Spiritualität.
