  title: Echt Jetzt?! - Deine Fragen auf den Tisch
  subtitle: Gespräch
  description: Echt Jetzt?! - das neue Format für junge Menschen. Was Jugendliche und junge Erwachsene bewegt - genau das ist Thema bei Chorherr Dirk, Tini und Samuel. Er kennt die beste Perspektive - bisher hinter der Kamera. Jetzt ist er selbst im Bild.
- eventId: 1552463
  start: 2026-10-10T03:45:00Z
  stop: 2026-10-10T04:00:00Z
  title: Jesus Glauben
  subtitle: Spiritualität
  description: 'Folge 1. Diese 15-teilige Reihe handelt von Jesus von Nazaret. Es ist aber kein Portrait keine Beschreibung seiner Lehren kein Überblick über sein Wirken. Wir wollen in diesen Episoden grundlegender fragen: Was kann man von Jesus wissen? Was kann man von ihm glauben? Wie verlässlich sind die Evangelien? Und wie stellen sie jenen jüdischen Rabbi dar, in dem Billionen von Menschen ihren Erlöser sahen und sehen? Das sind die Fragen, um die es hier gehen soll. Durch die Reihe führt Kpl. Johannes Maria Schwarz. Folge 1 - Das "Problem". Über Skepsis und die Frage, ob Glaube vernünftig ist.'
