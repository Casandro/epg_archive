  title: Die Stimmen der Zollernalb - Teil 2
  subtitle: Teil 2 / Unterhaltung
  description: Die "Stimmen der Zollernalb", eine musikalische Reise durch den Zollernalbkreis und Sigmaringen entlang der Jahreszeiten. Der Film nimmt den Zuschauer mit auf eine Reise durch die Jahreszeiten und wird durch die Musik von 12 Mitgliedschören des Chorverbandes Zollernalb e.V. untermalt. Die Stimmen der Chöre liefern einen außergewöhnlichen Soundtrack zu imposanten Filmaufnahmen der herrlichen Alblandschaft in unserer Region. Entlang Ihrer Lieder leitet der Präsident des Chorverbandes, Michael A.C. Ashcroft, als Moderator den Zuschauer durch den Film. Zweiter von zwei Teilen.
