  title: 'Libanon: Licht über dem Chaos'
  subtitle: Licht über dem Chaos / Dokumentation
  description: '"Licht über dem Chaos" ist ein Film über den tiefen Glauben und die Hoffnung der Christen, die sich angesichts dieser unglücklichen Situation manifestieren. Es ist ein Zeugnis für die Weltkirche und gleichzeitig ein Aufruf zu brüderlicher Solidarität mit unseren libanesischen Brüdern und Schwestern.'
