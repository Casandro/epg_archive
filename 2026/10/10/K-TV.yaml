  title: Legt Zeugnis ab von der Hoffnung, die euch erfüllt!
  subtitle: Spiritualität
  description: 'Folge 1. Hoffnung ist die wichtigste Kraftquelle, um das Leben bewältigen zu können. In jeder Situation verleiht sie Sinn, Trost und Freude. Als Christen schöpfen wir unsere Hoffnung aus den Verheißungen des Evangeliums. Die göttliche Tugend der Hoffnung befähigt uns, voll positiver Erwartung in die Zukunft zu blicken und auf die Ewigkeit zuzugehen. Der Hl. Papst Johannes Paul II. war von einer Vision der Hoffnung erfüllt: Entgegen allem Anschein bereitet Gott einen neuen Frühling für die Menschheit vor! Und er rief den Christen zu, ihre vordringliche Aufgabe sei es heute, Baumeister dieser Hoffnung zu sein. Exerzitien mit Pfr. Erich Maria Fink. Aufgezeichnet im November 2025, Kloster Brandburg / Iller e.V..'
