  description: Serijal "Vreme ljudi", čiji je autor dugogodišnji novinar Dalibor Žarić, novi je format Radio-televizije Srbije, koji će od 10. oktobra biti emitovan subotom od 18.25 sati na kanalu RTS 1. Ovaj reportažno-dokumentarni serijal kroz snažne ljudske priče, društvene fenomene, prirodne predele i neobične sudbine otkriva gledaocima svet koji često ostaje nevidljiv ispod površine svakodnevnih vesti i brzih informacija. Novi format RTS-a vodi gledaoce u planinska sela, rečne doline, visoravni i krajeve u kojima priroda i dalje diktira tempo života. U središtu svake epizode su pojedinci koji čuvaju tradiciju i autentičan način života - stočari, ribari, stare zanatlije i usamljeni meštani zaboravljenih naselja. Svaku epizodu krasi snažna dramaturgija, intimni razgovori sa junacima, prirodni ambijentalni zvuci i vizuelno upečatljiv dokumentarni stil, koji gledaoca postepeno uvlači u priču i zadržava ga do poslednjeg kadra. Nastao iz više od dvadeset godina rada na terenu, serijal počiva na...
