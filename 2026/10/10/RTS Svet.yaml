  title: Šarenica
  subtitle: Subota prepodne, vreme je za najlepše priče iz Srbije i regiona. Slavimo velike uspehe Parastreljačke reprezentacije, sa Svetskog prvenstva u Južnoj Koreji.
  description: Subota prepodne, vreme je za najlepše priče iz Srbije i regiona. Slavimo velike uspehe Parastreljačke reprezentacije, sa Svetskog prvenstva u Južnoj Koreji. Najavićemo Makedonske večeri tokom oktobra, spajaju nas muzika, pesma, hrana, prijateljstvo. Osam decenija Rudarsko geološkog fakulteta, uz priču o važnosti ustanove i izložbama koje prate godinu jubileja. Božanstvena keramika u Bozidarcu, a "Vreme ljudi" na RTS-u, o novom serijalu sa kolegom Daliborom Žarićem. Kako Pećanci čuvaju zavičaj, o radu jednog udruženja i posebnoj misiji. Idemo u susret Saboru narodne muzike Srbije, a pevaju nam Snežana Kopunović, Aleksandra Ivanov Caka, Danilo Živković.
