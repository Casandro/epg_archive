  description: Serija "U klinču" iskrena je priča o odrastanju, o trenucima u kojima mladi ljudi na prelasku iz srednjoškolskog perioda postaju studenti, zaposleni ljudi, koji počinju da ostvaruju ili se razočaravaju u svoje ambicije. Gledaoci će upoznati porodicu Kovač - bračni par Miru i Velju koji imaju dvoje tinejdžera. Kroz priče ovih i mnogih drugih junaka, pratićemo koji su izazovi sa kojima se danas suočavaju mladi i njihovi roditelji. Boksovaće se i sa prvim ljubavima, odlaskom iz porodičnog doma, ambicijama roditelja, u životnom, ali i pravom ringu, jer se skoro svi članovi porodice Kovač bave boksom.
