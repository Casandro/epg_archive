  title: NTC kviz
  subtitle: '"NTC kviz" nastao je prema sistemu učenja osnivača Mense Jugoslavije - dr Ranka Rajovića.'
  description: U četvrtoj sezoni učestvuje 16 timova koje čine učenici četvrtog i petog razreda osnovnih škola iz cele Srbije. U kvizu će se, tako, pojaviti đaci iz Aleksandrovca, Sremske Mitrovice, Novog Kneževca, Novog Pazara, Beograda, Valjeva, Novog Sada, Kragujevca, Bajine Bašte, Lazarevca, Topole, Pančeva, Kraljeva i Stare Pazove. Timovi će se nadmetati idejama u pet stalnih igara i jednoj igri iznenađenja, koja je posebna u svakoj epizodi. "NTC kviz" i ovoga puta spaja zabavu i učenje, pokazujući da razmišljanje i učenje nisu igra, ali mogu ličiti na igru. Kao i prethodne, i četvrta sezona "NTC kviza" imaće 16 epizoda. Nakon osam kvalifikacionih epizoda sledi četvrtfinale, zatim polufinale, borba za treće mesto i finalni duel.
