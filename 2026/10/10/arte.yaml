- eventId: 1039592
  start: 2026-10-10T03:15:00Z
  stop: 2026-10-10T04:05:00Z
  title: Avus - Rennstrecke und Legende
  subtitle: Deutschland 2021
  ageRating: 6
  genre:
  - '71'
  subtitled: true
  description: 'Sie liegt vor den Toren Berlins und ist bis heute eine geliebte Legende: die AVUS, die ehemalige Rennstrecke in der deutschen Hauptstadt. Bei ihrer Eröffnung 1921 war sie die erste Straße der Welt, auf der nur Autos fahren durften. Einzigartig und gefährlic, sorgte sie mit ihrer gigantischen Steilkurve schon bald für Proteste. Für viele Berliner war sie dennoch ein Symbol der Freiheit. In diesem September wird die ehemalige Hochgeschwindigkeitsstrecke 100 Jahre alt.'
- eventId: 1039593
  start: 2026-10-10T04:05:00Z
  stop: 2026-10-10T04:50:00Z
  title: Paradiese aus Menschenhand
  subtitle: Hoffnung für den Regenwald?
  subtitled: true
  description: In den Tropen werden noch immer Regenwälder abgeholzt, um Holz oder Weide- und Ackerflächen zu gewinnen. Vor allem die Ölpalmplantagen zerstören riesige Gebiete, denn Palmöl ist ein weltweit begehrter Rohstoff. Die Insel Borneo hat auf diese Weise bereits die Hälfte ihres Regenwaldes verloren. Doch es findet ein Umdenken statt. Der malaysische Bundesstaat Sabah im Nordosten Borneos hat beschlossen, Palmöl nur noch umweltfreundlich und ohne weitere Abholzungen zu produzieren. Regenwald soll neu angepflanzt werden und Tieren den dringend benötigten Lebensraum zurückbringen. Kann das gelingen?
- eventId: 1039594
  start: 2026-10-10T04:50:00Z
  stop: 2026-10-10T05:45:00Z
  title: Volkskrankheit Adipositas - Neue Therapien, neue Risiken?
  subtitle: Deutschland 2025
  subtitled: true
  description: Adipositas betrifft mehr als eine Milliarde Menschen weltweit - mit Folgen wie Diabetes, Bluthochdruck und psychischen Belastungen. Neue Medikamente wie GLP-1-Rezeptoragonisten und Hirnstimulationen eines Ärzte-Teams in Mailand zeigen erste Erfolge. Die Dokumentation begleitet Forschende und Betroffene in Deutschland, Frankreich, Italien sowie Dänemark, die mit innovativen Therapien und präziseren OPs helfen und Hilfe bekommen. Doch welche Risiken gibt sie?
- eventId: 1039595
  start: 2026-10-10T05:45:00Z
  stop: 2026-10-10T06:20:00Z
  title: Macht Fertigessen krank?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: 'Schnell, praktisch, überall verfügbar: Fertigessen passt perfekt in den modernen Alltag. Je mehr Menschen in Städten leben, desto wichtiger könnte es werden. Doch Studien deuten an, dass hochverarbeitete Nahrung Übergewicht und Depressionen fördern könnte. Macht Fertigessen also krank - und wenn ja: Wie sieht dann die Ernährung der Zukunft aus?'
- eventId: 1039656
  start: 2026-10-10T06:20:00Z
  stop: 2026-10-10T06:50:00Z
  title: Köstliches Ligurien
  subtitle: Cinque Terre - Ein Leben zwischen Felsen und Meer
  subtitled: true
  description: '15 Kilometer Küste, aber rund 7.000 Kilometer Trockenmauern: In den Cinque Terre haben Menschen der Natur fruchtbares Land nur mit Mühe abgetrotzt. Landwirtschaft ist aufwendig, und der zunehmende Tourismus hat dazu geführt, dass viele Einheimische lieber Zimmer vermieten, als Ackerbau oder Fischerei zu betreiben. Doch es gibt eine Reihe junger Leute, die dagegenhalten.'
- eventId: 1039657
  start: 2026-10-10T06:50:00Z
  stop: 2026-10-10T07:45:00Z
  title: Tierische (R)Evolution
  subtitle: Unsere Erde
  subtitled: true
  description: 'Von den Buckelwalen bis zu den erfindungsreichen Savannen-Schimpansen: Zahlreiche Tierarten erleben aktuell, wie sich ihr Lebensraum ungeheuer schnell verändert. Die Dokumentationsreihe zeigt, wie einige Tierarten in den unwirtlichsten Gebieten der Welt ihr Verhalten und sogar ihre Physiologie an neue klimatische Gegebenheiten anpassen. Der Evolutionsbiologe Shane Campbell-Staton begibt sich auf eine Entdeckungsreise und erzählt Geschichten von Anpassungsfähigkeit und Hoffnung. Gemeinsam mit Forschenden aus aller Welt beobachtet er die neuen evolutionären Strategien der Tiere.'
- eventId: 1039658
  start: 2026-10-10T07:45:00Z
  stop: 2026-10-10T08:40:00Z
  title: Tierische (R)Evolution
  subtitle: Inseln
  subtitled: true
  description: 'Von Echsen über Pazifik-Feldgrillen bis hin zu Roten Stummelaffen: Die Inseln unserer Erde sind extrem vielfältige eigene Mikrokosmosse, die einen Lebensraum für einzigartige Tierarten bieten. Hier lassen sich die erstaunlichen Wege der Evolution von Flora und Fauna besonders gut beobachten. Wer die Anpassungsfähigkeit dieser Inseln versteht, kann leichter aktuelle Umweltveränderungen erkennen und auf sie reagieren. Der Evolutionsbiologe Shane Campbell-Staton beobachtet mit Forschenden auf der ganzen Welt  unterschiedliche Tiere auf entlegenen Inseln. Diese Arten haben sich mit erstaunlichen Mitteln an neue Gegebenheiten angepasst.'
- eventId: 1039659
  start: 2026-10-10T08:40:00Z
  stop: 2026-10-10T09:35:00Z
  title: Tierische (R)Evolution
  subtitle: Wüsten
  subtitled: true
  description: Von der Sahara bis ins australische Outback - der Evolutionsbiologe Shane Campbell-Staton reist in dieser Folge in einige der trockensten und entlegensten Wüsten der Erde. In diesen Extremregionen haben bestimmte Tierarten außergewöhnliche Überlebensstrategien entwickelt. Die Tiere geben wertvolle Hinweise zu aktuellen Klimaveränderungen - und zu einer Zukunft, die zunehmend von Hitze bestimmt sein wird. Schimpansen flüchten sich in Höhlen, Kamele trinken Salzwasser und der Zebrafink singt beim Brüten, um bei großer Hitze das Wachstum der Küken hinauszuzögern.
- eventId: 1039709
  start: 2026-10-10T09:35:00Z
  stop: 2026-10-10T10:30:00Z
  title: Tierische (R)Evolution
  subtitle: Eis
  subtitled: true
  description: Am Nord- und Südpol vollzieht sich der Klimawandel wie im Zeitraffer, und seine Auswirkungen sind hier noch deutlicher spürbar als in anderen Erdregionen. Diese Folge begleitet Forschende, die in den Polargebieten beheimatete Tiere wie Eisbären in der Arktis oder Wanderalbatrosse auf den subantarktischen Inseln aus nächster Nähe beobachten und selbst geringste Verhaltensänderungen genau auswerten. Der Schutz der Polgebiete und ihrer Fauna spielt für die Bewahrung der Erde eine entscheidende Rolle.
- eventId: 1039710
  start: 2026-10-10T10:30:00Z
  stop: 2026-10-10T11:25:00Z
  title: Tierische (R)Evolution
  subtitle: Steppen
  subtitled: true
  description: Die Steppen auf unserer Erde spielen eine große Rolle in unseren Ökosystemen. Verschiedene Tierarten können dazu beitragen, brachliegende Steppen wiederzubeleben und sie in CO2-Speicher zu verwandeln, die noch effizienter als Wälder zur Verlangsamung des Klimawandels beitragen könnten. Zu Gast in nordamerikanischen Prärien und afrikanischen Savannen.
