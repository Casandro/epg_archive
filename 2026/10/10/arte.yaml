  title: Mit offenen Karten
  subtitle: 'Medikamente: Ein globaler Markt'
  description: Angesichts des Risikos von Lieferengpässen und dem strategischen Aspekt der Gesundheitssouveränität wollen unter anderem viele europäische Länder die Herstellung der wichtigsten Medikamente wieder ins eigene Land zurückholen. Zwar belegen die USA nach wie vor einen zentralen Platz in der Pharmaforschung - nicht zuletzt zur Bekämpfung von Krebs, aber auch die chinesische Biotechnologie behauptet sich zunehmend. Diese Entwicklungen illustrieren das Aufkommen einer sowohl wirtschaftlichen, technologischen als auch geopolitischen Rivalität im globalen Gesundheitswesen.
