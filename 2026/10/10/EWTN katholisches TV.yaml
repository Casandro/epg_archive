  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Die Gemeinschaft der Heiligen und ich - die Heiligenverehrung
  description: |-
    In der letzten Folge des Kath-Kurses geht es noch einmal zur Sache: In zwölf Folgen ging es um Gottes Heilsplan, um die Rolle, die seine Kirche in diesem Plan spielt, um die Sakramente, in denen sich dieses Heil verwirklicht und um Maria, die die persönliche Beziehung zu Gott am vollkommensten gelebt hat. Nun schließt sich der Kreis, indem die Heiligen in den Blick genommen werden, die gemeinsam mit uns die Gemeinschaft der Kirche in Christus bilden: eine Gemeinschaft, aus der heraus Christen das Evangelium leben und verkünden.

    Dr. Pia Sommer erklärt anschaulich und lebendig, was Heiligkeit bedeutet, im Glauben der Kirche und im Glaubensleben jedes Einzelnen. Im letzten "Kath-Kurs konkret"-Interview lässt uns Pfarrer Florian Rapp an seinen Erfahrungen mit dem Kath-Kurs teilhaben: Ein Glaubenskurs, der nicht nur im Fernsehen und online gesendet und erlebt werden soll, sondern der vor allem das Leben vor Ort in der Pfarrei bereichern will.
  widescreen: true
