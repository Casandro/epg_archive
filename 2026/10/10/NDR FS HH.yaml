  title: 'Hofgeschichten: Leben auf dem Land'
  subtitle: Zwischen Kürbisernte, Klauenpflege und Herbstzauber
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Auf dem Thudtshof im Harzer Vorland ist Kürbisernte.\nGemüsegärtnerin Jessi Lange und Landwirt Steffen Thudt holen rund 1,5 Tonnen Kürbisse vom Feld.\nAuf Hof Hahnenkamp in Nordfriesland sorgen unterdessen Stare für Ärger. Die geschützten Vögel bedienen sich am Futter der Kühe und lassen sich nur schwer vertreiben. \nIn Neustrelitz steht Klauenpflege an. Fachmann Mirco\nEichmann kümmert sich auf dem Sophienhof zwei Tage\nlang um 130 Rinder und damit um insgesamt 520 Klauen. \nIn Hamburg-Moorburg läutet Landwirtin Isa Ecks den\nHerbst ein. Gemeinsam mit Familie und Freunden dekoriert sie den Platz vor ihrem Hofladen."
