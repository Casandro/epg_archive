  title: Merci, Udo
  subtitle: Songs für die Ewigkeit von Udo Jürgens
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Seine Hits sind legendär, im Bademantel hat er die Welt erobert. Über 50 Jahre lang begeisterte Udo Jürgens sein Publikum mit großen Schlagern, tollen Partyhits und nachdenklichen Chansons. Ob "Griechischer Wein", "Ein ehrenwertes Haus" oder "Merci Chérie", fast jeder kennt diese Lieder und kann sie mitsingen. 2024 wäre Udo Jürgens 90 Jahre alt geworden, er verstarb am 21. Dezember 2014. Gründe, diesen herausragenden Künstler noch einmal gebührend zu würdigen. Denn Udo Jürgens war einer der ganz Großen der Unterhaltungsmusik. Er war Komponist, Sänger, Entertainer. Er war ein Weltstar.
