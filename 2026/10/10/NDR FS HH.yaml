  description: Seit 2014 entsendet die griechische Stavros-Niarchos-Stiftung monatlich mobile medizinische Teams auf entlegene Inseln. Auf Serifos errichten Augenarzt Christos Christoulakis und der technische Leiter Tasos Stamatiadis ein Pop-up-Krankenhaus, das die rund 1.500 Einwohner vier Tage lang mit verschiedenen Fachärzten versorgt. Manche Fälle, wie die Lähmungserscheinungen von Susanna Diogou, können allerdings nur auf dem Festland behandelt werden. Für ihre Familie bedeutet das eine lange Trennung - ein Dilemma, das viele Inselbewohner fürchten.
