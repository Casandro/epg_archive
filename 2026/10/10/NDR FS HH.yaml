  description: Eugen und Roger Cicero waren nicht nur Vater und Sohn, vor allem waren sie außergewöhnliche Künstler. Während Eugen in den 1960er-Jahren als Klaviervirtuose Berühmtheit erlangte und mit Starsängerinnen wie Ella Fitzgerald oder Shirley Bassey auftrat, füllte Roger Jahre später als einer der begnadetsten Sänger Deutschlands riesige Konzerthallen. In diesem berührenden Dokumentarfilm offenbaren Kai Wessel, Katharina Rinderle und Tina Freitag die einzigartige Vater-Sohn-Beziehung zweier Ausnahmetalente.
