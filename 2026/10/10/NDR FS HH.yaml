  title: Unsere Geschichte - Mit Kartoffeln zum Weltmarktführer
  subtitle: Unsere Geschichte - Mit Kartoffeln zum Weltmarktführer - Die Landmaschinen von Grimme
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Eine kleine Schmiede im niedersächsischen Damme entwickelt sich zum Weltmarktführer in der Kartoffelerntetechnik. Angefangen hat es vor 152 Jahren: Der 26-jährige Franz Carl Grimme schmiedet Pflugscharen aus Eisen und beschlägt die Wagenräder. Als er 1861 seine Schmiede in Damme eröffnet, ist der kleine Ort umgeben von Feldern und Gehöften.
    Die spannende Geschichte vom rasanten Aufstieg des Familienunternehmens Grimme spielt in der Dümmerregion, einer der schönsten Landschaften Niedersachsens. Früher eine rückständige, arme Gegend.
