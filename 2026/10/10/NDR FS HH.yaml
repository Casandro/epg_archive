  audiodesc: true
  description: 'Sie liefern die Beats, schreiben die Hooks, zaubern aus einer Melodie einen Welthit. Und doch kennt sie kaum jemand: Deutschlands erfolgreichste Musikproduzenten! Von der ersten Idee bis zum letzten Ton: Sie geben den Künstler*innen eine Stimme. Und was wären all die berühmten Lieder ohne ohrwurmtaugliche Melodien und ohne eingängige Texte? Genau: nichts! Deshalb geht ohne Komponisten und Textdichter nichts im Musikbusiness. In einer unterhaltsamen Reise durch die Musikwelt rückt diese Sendung genau diese kreativen Köpfe ins Rampenlicht.'
