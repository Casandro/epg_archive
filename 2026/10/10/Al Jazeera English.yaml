  title: People & Power
  subtitle: The Unmaking of Palestine P2. Oppressed, dispossessed and expelled - how Palestinians resist the century-long effort to force them from their land.
  description: A current affairs documentary series from Al Jazeera, examining powerful presidents, prime ministers, governments, religious institutions, and businesses, investigating how they use, or abuse, their powerful positions. The series has been running since 2007, sending investigative journalists across the world to capture stories at their source, many of which are divisive, criminal, or discordant. Stories have included a high-profile, Italian euthanasia case, which instigated fiery debates across the predominantly Catholic country, a disturbing tale of child sex tourism in Madagascar, and the aftermath of the devastating 2011 earthquake in Japan. (2026)
