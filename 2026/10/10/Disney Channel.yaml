  title: Taffy
  subtitle: Die gnadenlose Gerda Zeichentrick-Serie, F 2019
  description: 'Folge 95, Weil es in Schnarchhausen viele streunende Hunde gibt, heuert die Stadt die ruchloseste und furchterregendste Hundefängerin von allen an: Gerda Grabscher. Sollte Bentley es je wagen, einen Schritt über die Grenze des Münzbergschen Anwesens hinaus zu machen, würde er von Gerda gnadenlos weggefangen. Selbstverständlich sieht Taffy darin eine Gelegenheit, Bentley ganz einfach für immer loszuwerden. Er muss ihn nur dazu bringen, eine Pfote auf städtischen Grund und Boden zu setzen. Tatsächlich gelingt Taffy ein ums andere Mal, den arglosen Bentley in verbotenes Gebiet zu befördern.'
