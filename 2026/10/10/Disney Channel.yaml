  subtitle: Zeichentrickfilm, USA 2011
  description: 'Regie: Stephen J. Anderson, Don Hall. Darsteller: Jim Cummings, Bud Luckey, Craig Ferguson. Eigentlich ist die Tatsache, dass I-Aah mal wieder seinen Schwanz verloren hat, schon aufregend genug. Bei der Suche nach einem neuen Schwanz bemerken Winnie Puuh und seine Freunde im Hundert-Morgen-Wald allerdings auch noch, dass Christopher Robin spurlos verschwunden ist. Schnell sind sich die Tiere sicher: Er muss entführt worden sein. Guter Rat ist teuer, bis die Eule die Lösung hat: Puuh und die Bande müssen selbst losziehen und ihren guten Freund finden und befreien.'
