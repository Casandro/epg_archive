  description: Folge 61, Als Hawk Moth und Mayura ein neues Sentimonster in Paris freilassen, ist Chloé davon überzeugt, dass Ladybug und Cat Noir sie als Queen Bee um Hilfe bitten werden. Sie wartet aber vergeblich auf ihr Miraculous. Sabrina versucht, Chloé aufzumuntern, aber diese lässt ihre Frustration an ihrer Freundin aus. Dadurch ist Sabrina ein leichtes Opfer für Hawk Moth, der sie in Miraculer verwandelt. Nun kann sie die Kräfte der Superhelden stehlen und will so Chloé beweisen, dass sie ihre Aufmerksamkeit genauso verdient hat wie Ladybug.
