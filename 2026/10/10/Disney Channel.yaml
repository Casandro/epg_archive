  title: Taffy
  subtitle: Bentley, der Tapfere/ Zank und Zauber/ Unsichtbar Zeichentrick-Serie, F 2021
  description: Folge 94, Taffy wird von zwei Männern entführt, die ihn für eine wertvolle Rassekatze halten und von Mrs. Münzberg ein saftiges Lösegeld für ihren kleinen Liebling verlangen. Bentley fängt die erste Lösegeldforderung im wahrsten Sinne des Wortes zufällig ab. Er behält die Nachricht der Entführer für sich, denn er hofft, dass Mrs. Münzberg ihre ganze Aufmerksamkeit nach Taffys Verschwinden ihm allein widmen wird. Doch soweit ist es noch lange nicht. Denn natürlich startet Mrs. Münzberg eine Suchplakat-Aktion, bei der Bentley Frowald auch noch helfen soll.
