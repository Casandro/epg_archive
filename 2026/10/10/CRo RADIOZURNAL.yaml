  start: 2026-10-10T21:05:00Z
  stop: 2026-10-10T21:30:00Z
  title: Host Radiožurnálu
  description: Ondřej Měšťák působí jako chirurg na klinice Esthé a kromě praxe v estetické a rekonstrukční chirurgii se věnuje výzkumu a výuce studentů na 1. lékařské fakultě Univerzity Karlovy, kde zastává funkci zástupce přednosty pro výuku. Podle čínské fyziognomie se dle tvaru nosu odvozuje bohatství či chytrost člověka. Co je pravdy na tom, že "velký nos velkého ducha značí"? Krásný nos je v různých kulturách vnímán různě. Moderuje Vladimír Kroc. (repríza)
