  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: |-
    17.05 Die Entscheidung. Momente, die alles verändern
    Gefangen in der DDR (1/3) I Vom Freibad ins Verhör
    Ein Sommerabend 1987, eine Band tritt im Freibad von Heiligenstadt in der DDR auf - was harmlos als Konzert beginnt, entwickelt sich zu einem spontanen Protest von Jugendlichen. Aber ohne  große Eskalation. Und zunächst auch ohne Festnahmen durch die Volkspolizei, die ins Freibad gerufen wird. Doch zwei Tage später holen Stasileute plötzlich Thomas Nolte von zu Hause ab. In die U-Haft. Er wird immer wieder verhört. Warum, ist dem 18-Jährigen völlig unklar: Geht es wirklich nur um die paar Parolen, die er im Freibad gegen die Unfreiheit in der DDR gerufen hat? Was ihm 1987 alles passierte, hat Thomas Nolte lange verdrängt. Aber dann will seine Tochter, die BR-Journalistin Marie Müller, endlich mehr wissen.
    Host: Jasmin Brock
    Reporterin: Marie Müller

    17.30 Bayern 2 Breitengrad
    ARD Auslandsreportage



    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar.
