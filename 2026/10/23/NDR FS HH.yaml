  description: |-
    Elmo, Pferd und Elin müssen lernen, zusammenzuarbeiten, um eine Lieferung Möhren vom Baumhaus zum Möhrenhaus zu bringen. Durch eine Verwechslung liefert Grobi Pferds riesigen Möhrenvorrat aber nicht vor dem Möhrenhaus ab, sondern vor Elmos Baumhaus. Doch was nun? Mit Elins Hilfe kommen sie auf die Idee, einen Anhänger zu bauen, mit dem sie die Möhren zu Pferds Zuhause ziehen können. Dabei lernen sie, wie wichtig es ist, miteinander zu kooperieren. Außerdem macht sich Bert auf die Suche nach seiner Büroklammer-Sammlung.
    Krümel und Keks diskutieren darüber, was "klug" und was "schlau" ist.
