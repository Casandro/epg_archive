  title: In aller Freundschaft (333)
  subtitle: Falsche Ziele
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: |-
    Die aufstrebende Boxerin Paula Hinrich knickt vor dem ersten großen Kampf um - Knöchelfraktur. Mit ihrem Vater Rolf, einem Ex-Boxer, der sie als Trainer betreut, entscheidet sich Paula für eine Operation, um schnell wieder trainieren zu können. Im Gegensatz zu Paulas Sparringspartner Axel, der dafür plädiert, den Kampf abzusagen, hält Rolf die verkürzte Vorbereitungszeit für genug. Eine Thrombose in Paulas Bein droht die Pläne endgültig scheitern zu lassen.
    Otto und Martin Stein wollen endlich bei einem Kanurennen gewinnen, an dem sie Jahr für Jahr teilnehmen. Pia Heilmann überredet ihren Mann Roland, ebenfalls mitzupaddeln.
