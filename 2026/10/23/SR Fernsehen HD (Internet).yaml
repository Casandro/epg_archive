  title: Koch ein!
  subtitle: Chili con Carne - eingekocht und griffbereit
  description: 'Einmachen, Einwecken, Fermentieren: "Koch ein!" heißt das Youtube-Format mit Küchenmeister Timo Böckle. Er steht für eine nachhaltige, saisonale und regionale Küche - klar, dass das Haltbarmachen von Lebensmitteln für ihn eine große Rolle spielt. In dieser Folge geht es um scharfe TexMex-Küche: Bei Timo Böckle kommt das Chili con Carne ins Glas. Mit verschiedenen Bohnen, Tomaten, Paprika und viel Chili. Ob als Abendessen oder für die Party - Chili con Carne ist ein beliebter Klassiker. Die Zutaten sind überall erhältlich.'
