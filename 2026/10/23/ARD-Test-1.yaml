  description: 'Kreuzberg ist im Umbruch - und auch Dr. Talia Jahnka muss lernen, loszulassen. Ein schmerzhafter Hexenschuss lässt ihr keine Wahl. Lisa Liebling übernimmt kurzfristig ihren Mandanten: Elektrikermeister Bernd Schulze, Erbe eines Kreuzberger Mietshauses. Er muss das undichte Dach sanieren und dafür Gewerbemietern kündigen. Für die Betroffenen klingt das nach unrechtmäßiger Luxussanierung. Lisa gerät in eine moralische Zwickmühle: Denn auch Nadim Demirs traditionsreicher Friseursalon, einst Ruheort ihres Großvaters, ist betroffen.'
