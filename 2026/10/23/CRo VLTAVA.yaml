  title: Vizitka
  description: 'Eva Lustigová. "Předáváme lidskost filmovým a literárním dílem Arnošta Lustiga i jeho humanismem," říká k multižánrovému FestiALu 100 uskutečňujícího se u příležitosti 100 let od narození legendárního spisovatele jeho dcera Eva Lustigová. Dokumentaristka, filmová režisérka a taky výkonná ředitelka Nadačního fondu Arnošta Lustiga zasvětila svůj život šíření humanistického odkazu svého otce. Jaké to bylo vyrůstat po boku literárního velikána, jak prožívala emigraci a proč je dnes důležitější než kdy dřív mluvit o odvaze a lidskosti? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
