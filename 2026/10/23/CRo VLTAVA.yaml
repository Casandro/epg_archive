  description: 'K větší slávě Boží. Mezinárodní varhanní festival Olomouc. Varhaník Karel Martínek a Akademický sbor Žerotín, dirigent Pavel Koňárek. Marcel Dupré: Pašijová symfonie op. 23. - David Briggs: Messe pour Notre Dame. - Karel Martínek: Improvizace na Tedeum laudamus.- Improvizace. Záznam koncertu ze dne 3. září 2026 z chrámu sv. Mořice v Olomouci. Mistr zvuku Zdeněk Slavotínek, hudební režie Antonín Schindler. Připravila a moderuje Renáta Spisarová.'
