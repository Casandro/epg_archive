  description: Beschichtete Pfannen, Regenjacken, Imprägniersprays - all diese Produkte sind praktisch, aber bei ihrer Herstellung entstehen PFAS - per- und polyfluorierte Alkylverbindungen. Und die sind ein Problem für uns und die gesamte Erde. Wieso wir einen genauen Blick auf "Ewigkeitschemikalien" werfen sollten, erklärt Eckart von Hirschhausen in "Wissen vor acht - Erde".
