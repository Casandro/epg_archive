  description: Die Doku-Reihe erkundet mit Madagaskar, Borneo und Hawaii drei der faszinierendsten Inseln der Erde, auf denen sich einzigartige Tier- und Pflanzenwelten entwickelt haben. Diese Folge begibt sich auf die abgelegenste Inselgruppe der Welt - Hawaii. Sie unterliegt einem ständigen Kreislauf, bei dem durch Vulkanismus über Jahrmillionen neue Inseln enstehen und wieder im Meer versinken. So entstehen Lebensräume für eine einzigartige Flora und Fauna mit einer Vielzahl nur hier vorkommender Arten.
