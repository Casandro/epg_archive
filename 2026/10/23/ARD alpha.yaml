  title: GRIPS Deutsch (19/36)
  subtitle: Argumentieren & Erörtern
  subtitled: true
  description: |-
    Du möchtest deine Eltern davon überzeugen, dass du mit deinen Freunden in den Urlaub fahren darfst? Da helfen nur starke Argumente, am besten gut vorgebracht. Wie du eine gelungene Argumentation aufbaust, erklären wir hier.
    Eigentlich muss man ständig argumentieren, sobald man eine Meinung hat, sich mit anderen Leuten austauscht, diskutiert oder jemanden von etwas überzeugen möchte. Bei vielen Leuten enden Diskussionen in Streitgesprächen - auch, weil sie nicht wirklich gut argumentieren können. Hier siehst du, worauf du beim Argumentieren und Erörtern achten solltest und kannst es auch gleich selbst ausprobieren.
