  title: 'alpha-retro: Verliebt, verlobt, verheiratet. (1979)'
  subtitle: Die Liebe unserer Kinder
  description: 'Im Pressetext von 1979 hieß es: Der Rückzug der Jugend aus den Gruppen-Protestbewegungen der fünfziger und sechziger Jahre in die unpolitisch-private Atmosphäre einer Zweierbeziehung ist unverkennbar. Man sieht sie überall, die Paare: auf dem Schulhof, beim Sport, in der Freizeit, an der Arbeitsstelle. Sie lernen sich oft mit 14 oder 15 Jahren kennen und bleiben dann viele Jahre zusammen. Fünf von ihnen geben Auskunft darüber, wie sie denken und fühlen.'
