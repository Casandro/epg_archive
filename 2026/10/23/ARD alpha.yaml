  title: GRIPS Deutsch (21/36)
  subtitle: Texte zusammenfassen
  subtitled: true
  description: |-
    Du hast eine Geschichte gelesen und sollst sie zusammenfassen. Dabei ist es wichtig, dass du das Wesentliche der Geschichte erkennst und knapp und verständlich wiedergibst. Worauf du dabei achten solltest, erfährst du hier.
    Stell dir vor, du hast etwas Tolles erlebt, aber deine Freundin oder dein Bruder waren nicht dabei. Du möchtest sie aber an dem Erlebnis teilhaben lassen. Da bleibt dir nur eines: Du musst ihnen das Erlebte erzählen und natürlich fasst du es dabei zusammen. Auch in der Schule musst du Texte oder den Inhalt einer Stunde zusammenfassen. Dabei können dir sicher unser Video und Übungen helfen.
