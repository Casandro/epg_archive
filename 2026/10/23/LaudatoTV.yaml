  title: Stopama Ivana Pavla II.
  subtitle: Dokumentarni
  description: |-
    In The Footsteps Of John Paul The Great
    Korak po korak, ovaj film otkriva detalje koji su činili i oblikovali život jedne od najutjecajnijih osoba 20. stoljeća. Obilazeći ulice kojima je hodao, mjesta u kojima je nalazio utjehu i snagu za radišnost, sredinu koja je obilježena njegovim djelovanjem i susrećući žive svjedoke njegove veličine, ovaj film pojašnjava kako se do pijedestala svetosti penje u svakodnevici. Hodočasnice Joanne Bogle i Clare Anderson prošle su svim bitnim mjestima i razgovarale s ljudima iz djetinjstva, mladosti i razdoblja svećeništva Ivana Pavla II.. Putujući Poljskom uzduž i poprijeko, prikupljale su intervjue na lokacijama koje oduzimaju dah te obišle spomenike, svjedoke hrabrosti i predanosti koje je Papa, čiji je moto: 'Sav Tvoj' (op. a. Marijin), potvrđivao cijelim svojim životom.
