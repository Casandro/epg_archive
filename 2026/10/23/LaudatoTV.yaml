  title: Duhovna ostavština Ivana Pavla II.
  subtitle: Dokumentarni
  description: |-
    Saint John Paul II: The Spiritual Legacy
    Joanna Bogle i Clare Anderson krenule su na hodočašće kako bi razmišljale o životu i nasljeđu svetog Ivana Pavla II. Njihov put u Poljsku ostat će zauvijek u sjećanju, zbog obilaska mjesta djetinjstva, odrastanja, obrazovanja i rada Karola Wojtyle, koja su pomogla oblikovati njegov život prije izbora za papu 1978. godine.
