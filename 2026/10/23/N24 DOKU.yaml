  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 3'
  description: Die Grenze zwischen den Vereinigten Staaten und Mexiko ist die verkehrsreichste der Welt. In dieser Folge werden die Beamten misstrauisch, als ein älteres Ehepaar aus Mexiko mit fünf Koffern, aber ohne Kleidung ankommt. Auf der World Trade Bridge zeigt das Röntgenbild eines Lastwagens mit Gartenmöbeln, dass sich in der Ladung noch etwas anderes befinden könnte. Und in Laredo helfen die Beamten einer Frau und ihrem Kind, die vor der Gewalt der Kartelle in Mittelamerika fliehen.
