  title: Die Küchenmacher - Von Maßarbeit bis Massenware
  subtitle: Die Küchenmacher - Von Maßarbeit bis Massenware
  description: 'Mittelpunkt jedes Eigenheims: die Küche. Kochen, Essen, Socializing - hier spielt sich das Familienleben ab. Die moderne Küche soll schick, modern und repräsentativ sein. Dabei sind die Grundzüge der verschiedenen im Handel erhältlichen Modelle gleichermaßen einander ähnlich wie simpel. Küchen werden nach einem Baukastenprinzip aus mehreren Schranktypen und E-Geräten zusammengestellt. Wie eins zum anderen findet - die Reportage begleitet Planung und Umsetzung unterschiedlicher Küchenkonzepte.'
  widescreen: true
