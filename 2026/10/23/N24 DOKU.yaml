  title: Der Mega-Kipper - 55 Tonnen auf einen Rutsch
  subtitle: Der Mega-Kipper - 55 Tonnen auf einen Rutsch
  description: Der Volvo A60 ist der größte knickgelenkte Muldenkipper der Welt. Er kann bis zu 55 Tonnen Material mühelos transportieren. Sein Gesamtgewicht beträgt bei voller Beladung fast 100 Tonnen. Gebaut wird der XXL-Dumper im südschwedischen Braås. Hier fertigen rund 550 Mitarbeiter sechs verschiedene Dumper-Modelle. Er ist das größte Fahrzeug, das in dem Werk gefertigt wird, und aufgrund ihres Gewichts können nur die wenigsten Teile ohne Kran verbaut werden.
  widescreen: true
