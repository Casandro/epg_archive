  description: Der Mythos der "Bestie von Gévaudan", die Aufzeichnungen zufolge rund hundert Menschen tötete, diente als Vorlage des ungewöhnlichen Mystery-Abenteuers im opulenten Gewand eines Historienfilms. Regisseur und Co-Autor Christophe Gans schuf eine ebenso packende wie vielschichtige Erzählung der bis heute ungeklärten Ereignisse im 18. Jahrhundert. Das Figurenensemble - unter anderem mit Samuel Le Bihan, Vincent Cassel und Monica Bellucci besetzt - lehnt sich an historische Personen an.
