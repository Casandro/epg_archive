  description: |-
    Der Bikepacker Ernesto Pastor führt durch die einsamen Montes Universales, wo aus der Stille Inspiration entsteht und eine neue Gemeinschaft von Reisenden, Wirten und Bewohnern wächst.

    Seine Routen sind weit mehr als sportliche Abenteuer - sie sind eine Einladung, eine entvölkerte Region wiederzuentdecken. In Matarraña besucht das Filmteam ein Architekturprojekt, das weltweit einzigartig ist: die Solo Houses.
