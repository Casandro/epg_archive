  title: Unbekanntes Spanien (4/4)
  subtitle: Von Cuenca nach Albacete
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    In La Mancha bewahrt Müller Juan Bautista das Wissen über historische Windmühlen - technische Meisterwerke, deren hölzerne Zahnräder seit 500 Jahren im Rhythmus des Windes arbeiten.

    Seine Arbeit ist keine Nostalgie, sondern die Bewahrung eines prägenden Erbes. In der Sierra de Andújar begleitet das Filmteam Biologen, die den Iberischen Luchs vor dem Aussterben retten - eine der beeindruckendsten Naturschutzgeschichten Europas.
