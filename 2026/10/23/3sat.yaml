  title: Magische Anden (3/5)
  subtitle: Argentinien und Chile - Der Norden
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Der nördliche Teil der Anden Argentiniens und Chiles beherbergt einige Superlative: So befindet sich in der argentinischen Provinz Mendoza die Mehrzahl der höchsten Andengipfel.

    Dort liegt auch der etwa 6960 Meter hohe Aconcagua, der höchste Berg der westlichen Hemisphäre. Auf sanften Hügeln der argentinischen Provinz Mendoza recken sich Millionen Weinreben gen Himmel. Die Inka legten dort schon vor Jahrhunderten Bewässerungssysteme an.
    HD-Produktion
