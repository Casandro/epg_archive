  title: Magische Anden (5/5)
  subtitle: Peru
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Inkastadt Machu Picchu hoch in den Anden, brodelnde Vulkane, eisbedeckte Bergriesen: So überwältigend ist in Peru die Natur, dass die Berge immer noch als Gottheiten verehrt werden.

    16 aktive Vulkane gibt es dort, sie sind Teil des Pazifischen Feuerrings. Der Kondor ist selten geworden in den Anden, doch im Süden Perus kann man ihn noch beobachten. Spektakulär ist der Titicacasee, der auf 4000 Metern Höhe höchstgelegene schiffbare See der Welt.
    HD-Produktion
