  title: Die Kanaren - Inselparadiese im Atlantik
  subtitle: Film von Franck Decluzet
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Kanarischen Inseln gelten als Inseln des ewigen Frühlings. Milde Temperaturen und lange Sommer machen die Inselgruppe vor der afrikanischen Küste zu einem beliebten Urlaubsziel.

    Vulkanische Aktivität hat die Kanaren geformt und prägt das Gesicht der Inseln. Schroffe Küsten, schwarze Strände und Kraterlandschaften treffen auf grüne Natur und das tiefe Blau des Atlantiks. Beim Inselhopping erkundet das Filmteam die Vielfalt der Kanaren.
    HD-Produktion
