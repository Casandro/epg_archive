  title: Deine Niere für unser Leben
  subtitle: Film von Mica Stobwasser
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Philipp ist schwer krank. Seine Nierenleistung liegt unter zehn Prozent, er überlebt nur durch die Dialyse. Die Chancen, ein Spenderorgan zu bekommen, sind in Deutschland nicht groß.

    Einzige Chance ist seine Frau. Gegen alle Ängste entscheidet sich Kirsten, ihrem Mann eine Niere zu spenden. Doch was, wenn bei der Transplantation etwas schiefgeht? Die Reportage "Deine Niere für unser Leben" begleitet das Paar vier Monate lang.
    HD-Produktion
