  title: Sinn & Seele
  subtitle: Was kommt nach dem Tod?
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Großmutter, der Vater, eine Freundin sterben. Und jetzt? Jeder Mensch trauert anders. Nur eines verbindet alle: Auf der anderen Seite war noch keiner.

    Niemand weiß, wie es nach dem Tod weitergeht. Gibt es einen Himmel? Bleiben wir mit den Verstorbenen in Verbindung? Oder ist es doch so, als hätte jemand den Schalter umgelegt - Schluss, aus, Amen?
    HD-Produktion
