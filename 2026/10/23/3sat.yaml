  description: |-
    Über 7500 Kilometer erstrecken sich die Anden entlang der Westküste Südamerikas. Trotz eisiger Kälte, dünner Luft und schroffer Felswände gibt es dort einen erstaunlichen Artenreichtum.

    Der Film zeigt unter anderem die Anpassungsstrategien der genügsamen Vicuñas, der letzten wilden Nachfahren der amerikanischen Ur-Kamele.
