  title: Magische Anden (2/5)
  subtitle: Bolivien
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Bolivien beeindruckt durch die Vielfalt seiner Landschaften. Schneebedeckte Pässe und staubtrockene Canyons führen an entlegene Orte, die die Magie der Anden spüren lassen.

    Über 10.000 Quadratkilometer groß ist der Salzsee von Uyuni - eine gleißend weiße Fläche bis zum Horizont. Lebensfeindlich sind auch die Bedingungen auf den Sechstausendern in der Umgebung von La Paz, Boliviens Regierungssitz und die höchstgelegene Metropole der Welt.
    HD-Produktion
