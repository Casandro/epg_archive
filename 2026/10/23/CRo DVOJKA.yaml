- eventId: 982557
  start: 2026-10-23T20:00:00Z
  stop: 2026-10-23T20:30:00Z
  title: Četba na pokračování
  description: 'Petr Sagitarius: Trujkunt - Čtverka (8/8). Major Roman Saran na stopě třineckému vrahovi. Ostravská kriminálka řeší případ dvou vražd, do kterých jsou zapleteni dávní spolužáci ze čtvrté základní školy v Třinci. Chodil do ní i major Sagan, přesto vyšetřování dlouho míří chybným směrem. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2023.'
- eventId: 982558
  start: 2026-10-23T20:30:00Z
  stop: 2026-10-23T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Lenka Vágnerová, choreografka, tanečnice a režisérka. Kdy pocítila, že tělo je nástroj, díky kterému dokáže vyslovit všechny své pocity a emoce? Jak ji proměnilo mateřství, na co všechno zůstala sama? A čím je ojedinělý taneční soubor Lenka Vágnerová&Company? Moderuje Zuzana Maléřová.'
