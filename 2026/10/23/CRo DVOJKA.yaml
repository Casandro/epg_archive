- eventId: 982555
  start: 2026-10-23T19:00:00Z
  stop: 2026-10-23T19:49:00Z
  title: Muzikál expres
  description: Muzikál expres pozve posluchače na úspěšnou inscenaci Jesus Christ Superstar do Londýna a připomene výročí premiér muzikálů Carousel a Američan v Paříži. Dále prozradí, že ve Vídni bude příští rok otevřeno zcela nové muzikálové divadlo v Prateru. První premiérou bude Lví král. Milovníky Fantoma Opery pak potěší informací, že záznam londýnského originálu bude brzy možno spatřit na filmovém záznamu. Ve druhé části pak zazní několik muzikálových melodií, která v produkci pořadu nahrál houslový virtuos Jaroslav Svěcený. Uvádějí Michael Prostějovský a Pavel Bár. Repríza z 18.10.
