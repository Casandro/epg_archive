  start: 2026-10-23T01:30:00Z
  stop: 2026-10-23T02:30:00Z
  title: 'Wydział kryminalny Kitzbühel: odc.2'
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2019) odc.2, Durchtauchen
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair, Simon Hatzl
    Instruktor pływania Norbert Scheicher zostaje znaleziony martwy. Najprawdopodobniej mężczyzna utonął w basenie. Dzień wcześniej udzielał lekcji dwóm zaciekle rywalizującym ze sobą dziewczynom. Policja bierze na cel ojca jednej z uczennic, Erika. Zawodowy pływak zrobiłby wszystko dla kariery swojej córki.
    Reżyser: Rainer Hackstock
    Od lat: 12
