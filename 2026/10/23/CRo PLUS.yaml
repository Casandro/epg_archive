  stop: 2026-10-23T03:00:00Z
  title: Návraty časem
  description: Jak bylo možné, že tak primitivní ideologie, jako byla ta nacistická, zaujala a nakonec i ovládla naprostou většinu německého národa? Nad tím se v repríze pořadu Politická literatura zamýšlí Libor Dvořák při listování knihou Svůdný klam Třetí říše.
