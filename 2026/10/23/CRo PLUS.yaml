  description: Bezprostředně zažil politické pronásledování, výslechy, sametovou revoluci i války na Balkáně. Byl přítelem Václava Havla. Novinář, pedagog a disident Jan Urban dnes sleduje svět, ve kterém slova politiků ztrácejí váhu a fakta ustupují provokacím. Má ještě poctivá žurnalistika šanci obstát v konkurenci sociálních sítí? A jak jeho zkušenost válečného reportéra ovlivnila jeho nekompromisní pohled na politiky? Moderuje Tatiana Čabáková.
