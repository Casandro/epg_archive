  title: Pro a proti
  description: Proč se Francie bouří? Protesty proti vysokým životním nákladům přerostly v násilné nepokoje a střety s policií. V některých částech Paříže platí noční zákaz vycházení. Co stojí za rostoucí nespokojeností Francouzů? Selhává stát, který nedokáže naplnit očekávání mladé generace, nebo lidé požadují víc, než jim může nabídnout? A jak současná krize ovlivní politický souboj před prezidentskými volbami? Hosty pořadu jsou redaktorka Deníku Alarm Sára Vidímová, která dlouhodobě sleduje situaci ve Francii, a student práva působící ve Francii Ondřej Černý. Moderuje Lukáš Matoška.
