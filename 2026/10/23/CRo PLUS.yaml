  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (4/15) Část čtvrtá: léta 1952 a 1953 ve Washingtonu, Budapešti, Moskvě. Program nastupujícího amerického prezidenta Eisenhowera počítal s tvrdším postupem a halasnější propagandou v sovětských satelitech. Byla to však především pouhá rétorika, která navíc ohrožovala případné odbojáře. V roce 1953 se v Maďarsku po stalinském vzoru schylovalo k antisemitským čistkám, když Stalin náhle zemřel. Nikomu nepřišlo divné, když si nový kremelský vládce Chruščov pozval Rákosiho do Moskvy a nařídil mu, ať odevzdá část moci Imremu Nagyovi, jehož nenáviděl. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
