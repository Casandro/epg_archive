  title: Tijd voor MAX
  subtitle: Passie voor koken S18 E145. Martine van Os en Sybrand Niessen ontvangen een keur aan gasten. Een aangename mix van nieuws, kunst, cultuur en entertainment.
  description: Linda Verstraten en Levi van Kempen spelen Anne Hathaway en William Shakespeare in de musical & Juliet en treden bij ons op. * Julius Jaspers blijft ook na zijn hersenbloeding zijn passie voor koken volgen. Bas Brouns laat zich inspireren door Julius' stoofgerechten en staat in onze keuken. * Francine Oomen is met Hoe overleef ik alles wat anders gaat dan gedacht genomineerd voor de NS Publieksprijs. * Patrick Bolder bespreekt de aanhoudende Russische aanvallen op Oekraïne, ondanks beloften over toenadering. (2026)
