  title: Quest
  description: Tentokrát si pustíme záznam z festivalu BRNO16, na kterém se v jeho herní části představil i Quest. Téma festivalu bylo jasné - maso. A proto jsme našli ty nejvíc nechutné herní záležitosti, na které jsme v průběhu našich herních životů narazili. Ale to skutečné maso pro posluchače přišlo až na samotném konci... Moderují Jaromír Möwald, Šárka Tmějová a Lukáš Grygar.
