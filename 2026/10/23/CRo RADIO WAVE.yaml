  description: Přinášíme vydatnou porci toho nejzajímavějšího, co se v herním průmyslu událo. Opíráme se do všech důležitých her a osobností z oboru, držíme lupu nad nezávislou scénou a máme nachystanou jízdenku do stanice retro. K tomu pouštíme pečlivý výběr té nejlepší herní muziky. Moderují Jaromír Möwald, Šárka Tmějová a Lukáš Grygar.
- eventId: 981942
  start: 2026-10-23T17:00:00Z
  stop: 2026-10-23T18:00:00Z
  title: Casablanca
  description: Klára Nováková, dabérka, knižní influencerka, cestovatelka a kolegyně z Radia Wave, vypráví o svých dálkových trasách. Kdysi jí šikana během tělocviku úplně znechutila sport a pohyb, dnes běhá půlmaratony a chodí trasy jako je Svatojakubská cesta do Santiaga de Compostela, West Highland Way anebo Tour de Mont Blanc. Co jí dálkové trasy dávají? Poslechněte si Klářino vyprávění v rozhovoru s Pavlem Sladkým v nové epizodě cestovatelského podcastu Radia Wave. (repríza)
