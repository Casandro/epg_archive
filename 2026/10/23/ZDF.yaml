    Die Teenie-Vampirin Sasha soll nach Ansicht ihrer Familie endlich selbst auf die Jagd gehen, jedoch hemmt sie ihr Empathievermögen. Doch dann lernt Sasha den suizidgefährdeten Paul kennen.

