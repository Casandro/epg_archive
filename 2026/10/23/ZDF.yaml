  description: |-
    Krimiserie, Deutschland 2023
    Bei einem Notfalleinsatz in einem Wohngebiet parkt Jürgen Bloch den Rettungswagen zu. Der Rettungssanitäter Dennis Köhnle konfrontiert den sturen Anwohner - schnell eskaliert die Situation.

    Kommissar Jo Stoll ist zufällig vor Ort und parkt das Auto kurzerhand um. Der Sanitäter hat die Situation gefilmt und veröffentlicht das Handyvideo im Netz. Als bekannt wird, dass die Patientin aus dem RTW gestorben ist, kennt man in den sozialen Netzwerken keine Gnade.
