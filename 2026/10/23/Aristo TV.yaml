  title: ANIXE auf Reisen - Nagasaki Teil 5
  description: In dieser Episode ist der Schauspieler Oliver Hörner wieder in Südjapan unterwegs. Ziel ist diesmal die Region um den Vulkan Unzen, der bis heute aktiv ist...auch wenn er gerade eine Ruhepause eingelegt hat. Der Unzen gehört trotzdem zu den gefährlichsten Vulkankomplexen in Japan. Bei seinen bisher letzten Eruptionen - zwischen 1991 und 1995 - kamen mehr als 40 Menschen ums Leben, die Zerstörungen waren riesig. Oliver Hörner erkundigt sich bei einem Seismologen über den aktuellen Status des Unzen und lässt sich erklären, welche Vorsichtsmaßnahmen zum Schutz der Bevölkerung getroffen worden sind. Dabei stellt er fest, dass die heißen Thermalquellen aus den Tiefen der Vulkane die japanische Badekultur maßgeblich beeinflusst haben.
  widescreen: true
