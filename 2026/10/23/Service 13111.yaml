  title: Terra Mater
  subtitle: Das Jahr des Schneeleoparden
  description: |-
    Der Schneeleopard ist der größte Schatz des chinesischen Sanj-iang-yuan Nationalparks. Im Schatten des Himalayamassivs ist das Leben extrem hart und fordert Spezialisten. In einer kleinen Felsnische kuscheln sich zwei winzige Kätzchen ins wohlig warme Fell ihrer Mutter. Mit blitzblauen Augen lugen sie neugierig in eine Welt, die es von nun an zu erobern gilt. Raues Wetter, steiles Terrain, knappe Nahrung - mit solchen Herausforderungen ist ein erfahrener Schneeleopard täglich konfrontiert. Der Nachwuchs muss erst lernen sie zu meistern.
    Natur, China 2020, R: Xi Zhinong, Zi Ding, Da Jie, Qu Peng
