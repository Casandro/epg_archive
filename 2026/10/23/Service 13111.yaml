  title: Bei mir daheim
  subtitle: Wohlfühloasen
  description: 'Eine 2.000 Jahre alte Mooreiche, aus der ein Esstisch wird, eine Keramik-Werkstatt inmitten der Montafoner Bergwelt oder ein Skater, der aus alten Boards Unikate fertigt. Wie kann man Ursprüngliches erhalten und ihm gleichzeitig neues Leben einhauchen? In "Bei mir daheim" öffnen Menschen die Tür zu ihrem Zuhause, um gemeinsam mit Handwerkern ihre Wohnträume zu verwirklichen.Österreich 2023, R: Simon Schennach'
