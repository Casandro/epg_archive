  title: TM Wissen
  subtitle: Schnüffler auf dem Acker - Wie Hunde unsere Lebensmittel sicherer machen und mehr
  description: 'Auf unseren Feldern wachsen oft unerwünschte, giftige Beikräuter - und ihre Rückstände können in Lebensmitteln landen. Besonders tückisch: Pyrrolizidinalkaloide aus Pflanzen wie dem Greiskraut, die in vielen Tees nachweisbar und gesundheitsschädlich sind. Doch eine verblüffende Lösung könnte Abhilfe schaffen: speziell trainierte Hunde. In einem Forschungsprojekt der Universität für Bodenkultur Wien testet Dr. Silvia Winter, wie Vierbeiner mit ihrem feinen Geruchssinn Giftpflanzen erschnüffeln - lange bevor sie geerntet werden. Erste Erfolge zeigen: Die tierischen Helfer könnten eine neue Ära in der Lebensmittelsicherheit einläuten.Österreich 2025'
