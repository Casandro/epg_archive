  title: MotoGP - Red Bull Grand Prix von Australien
  subtitle: 'MotoGP: Qualifying - Vorbericht'
  description: |-
    Spannung pur beim Großen Preis von Indonesien! Marco Bezzecchi meldet sich nach einer langen Durststrecke eindrucksvoll zurück und feiert in Mandalika seinen ersten Sieg seit Ende Mai. Mit einem historischen Vierfach-Triumph stellt Aprilia seine Stärke unter Beweis. Doch auch im Kampf um die Weltmeisterschaft bleibt es hochdramatisch: Jorge Martin erobert mit Platz drei die WM-Führung von Marc Marquez zurück. Gerade einmal zwei Punkte trennen die beiden Titelrivalen. Doch wer behält beim letzten MotoGP-Gastspiel auf Phillip Island beim Red Bull Grand Prix von Australien die Nerven und kann die WM-Führung im packenden Titelduell an sich reißen? Der Countdown zum Qualifying der MotoGP live und in Full HD bei ServusTV.
