  title: Heimatleuchten
  subtitle: Herbstland Waldviertel
  description: |-
    Über Jahrzehnte lag die Region im Schatten des Eisernen Vorhangs.  Das Waldviertel hat einen ganz besonderen Zauber bewahrt. Es ist die Heimat von Querdenkern wie Georg Schuh, Österreichs einzigem Fischlederer. Oder von Rainer Mattejka, dem letzten Verbliebenen seines Berufsstands: Mit seinen einzigartigen Knöpfen aus Perlmutt beliefert er die ganze Welt. Auf Ursprünglichkeit setzt Whiskybrenner Hermann Rogner, der für seinen weit über die Region hinaus bekannten Whisky nur Produkte aus dem Waldviertel verwendet. Der nördlichste Rand Österreichs hat sich als Naturschatz und Delikatessenkammer einen Namen gemacht. Nicht zuletzt dank einheimischer Spezialitäten wie Mohn oder den weltberühmten Weißweinen aus der Wachau. Herbstland Waldviertel ist eine Entdeckungsreise zu besonderen Menschen und überraschenden Geschichten, die nur entdeckt, wer ganz genau hinsieht.
    Volkskultur, Österreich 2017
