  title: Hubert ohne Staller
  subtitle: Schützenkönig
  description: "Ein Katzenmord in Wolfratshausen wird nach kurzer Bestandausaufnahme zu Riedls Fall. Denn Hubert und Girwidz müssen sich um Wichtigeres kümmern: um einen angeschossenen Pfarrer. Doch statt schockiert zu sein oder sich zu wundern, warum ihm sowas widerfährt, liefert der Pfarrer direkt einen Tatverdächtigen: den Vorstand des Schützenvereins, mit dem er schon seit Jahren im Streit liegt. Hubert und Girwidz gehen den Beschuldigungen nach und finden auch tatsächlich die Tatwaffe. Dass es sich dabei um das Kleinkalibergewehr des Vorstands handelt, nährt den Verdacht, dass er wirklich der Schütze war. Der Fall scheint gelöst zu sein, bis Dr. Fuchs den Polizisten einen Strich durch die Rechnung macht. Denn ihre Analyse hat ergeben, dass das Projektil, mit der die Katze erschossen wurde, ebenfalls aus dem Gewehr stammt. Der Vorstand des Schützenvereins fällt als Täter raus und die Ermittlungsarbeit geht von vorne los. Wer hat ein Motiv, eine Katze und einen Pfarrer zu erschießen? \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Matthias Steurer"
