  title: BEHIND THE GRID
  subtitle: Zwei Generationen, ein Ziel
  description: 'Folge 3 zeigt Nicki Thiim zwischen Familiengeschichte, eigener Leidenschaft und dem Anspruch, selbst Spuren in der DTM zu hinterlassen. Am Norisring, einem Ort mit besonderer Bedeutung für die Familie Thiim, wird aus Vergangenheit Gegenwart - und aus Erwartung sportlicher Druck. Mit Bastian Buus steht ein weiterer Däne für die nächste Generation bereit: Zwei Dänen, zwei Generationen, zwei unterschiedliche Wege - ein gemeinsames Ziel.  2026'
