  title: OMR Podcast - Moritz Fürste and Christian Toetzke, Hyrox
  description: 'Ausverkaufte Events von Arizona über Johannesburg bis nach Shenzhen, hunderttausende Teilnehmer*innen und eine starke Community: Die Fitness-Welt scheint auf die Erfindung der Hyrox-Gründer Christian Toetzke und Moritz Fürste gewartet zu haben. Im kommenden Jahr rechnen die beiden mit 1,8 Millionen Teilnehmenden weltweit und 200 Millionen Euro Umsatz. Im OMR Podcast verraten sie, wie sie das erreichen wollen, was ihr Gründerteam ausmacht und warum Hyrox kein Bucketlist-Event sein darf.'
