  title: Apokalypse Stalin
  subtitle: Der Dämon
  description: Joseph Stalin versetzte während seiner Regierungszeit die Menschen in der Sowjetunion in Angst und Schrecken. Er ließ Millionen Menschen töten, die er für seine politischen Gegner hielt. Wie wurde er zum grausamen Diktator?
