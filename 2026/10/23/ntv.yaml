  description: Schon zu seinen Lebzeiten gab es viele verschiedene Gerüchte darüber, was Adolf Hitler hinter verschlossenen Türen trieb. Anhand umfangreicher Archivrecherchen werden Geheimnisse offenbart, für die Hitler gelogen und getötet haben soll.
