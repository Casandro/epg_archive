  title: Svetske muzičke pozornice
  subtitle: Reprodukujemo snimak koncerta Estonskog nacionalnog simfonijskog orkestra održanog 17. oktobra prošle godine u Koncertnoj dvorani u Talinu.
  description: Srđan Šarović ispituje kategoriju svetlosti kao ključnu kategoriju ontološke estetike istočnih Otaca Crkve. Polazna postavka je da se estetsko iskustvo ne iscrpljuje u pojavnosti predmeta opažanja, već se tiče ontološke konstitucije bića i zato ima ontološko-epistemički karakter. U tom okviru estetska recepcija ne može biti svedena na odnos subjekta i estetskog predmeta, jer pojedinačno stvoreno biće jeste samo povod za istinsko estetsko iskustvo koje vodi ka celini stvarnosti i ka Bogu kao njenom ontološkom izvoru i osnovu.
- eventId: 935083
  start: 2026-10-23T19:40:00Z
  stop: 2026-10-23T20:50:00Z
  title: Svetske muzičke pozornice
  subtitle: Reprodukujemo snimak koncerta Estonskog nacionalnog simfonijskog orkestra održanog 17. oktobra prošle godine u Koncertnoj dvorani u Talinu.
  description: Reprodukujemo snimak koncerta Estonskog nacionalnog simfonijskog orkestra održanog 17. oktobra prošle godine u Koncertnoj dvorani u Talinu. Dirigovao je Metju Hols, a nastupili su i solisti Turi Dede, sopran i Endru Foster-Vilijams, bariton, kao i Estonski nacionalni muški hor. Snimak iz serijala Premijum koncerti Euroradija ustupljen nam je posredstvom međunarodne razmene.
