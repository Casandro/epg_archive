  description: Naučni skup "Simposion o ljubavi", koji je organizovala Sekcija za istoriju medicine Srpskog lekarskog društva u saradnji sa udruženjem "Paviljon-Eksedra", bio je zamišljen kao omaž poznatom Platonovom dijalogu Gozba, ili o ljubavi. Učesnici skupa razmatrali su pojam ljubavi u njegovim različitim manifestacijama (eros, filija, agape), iz perspektiva filozofije, antropologije, istorije književnosti, medicine i religije.
