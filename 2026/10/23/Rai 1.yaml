  subtitle: RUBRICA - Il programma con le grandi inchieste che hanno caratterizzato le scorse stagioni, le finestre aperte sull'attualità, casi di cronaca e tematiche sociali, seguite con grande minuzia e attenzione, nel rispetto dei valori d
  description: "el servizio pubblico. Si sviluppa in due parti principali: una legata alla stretta informazione, l'altra mirata all'approfonfimento di temi come la disabilità, l'emergenza abitativa, la lotta alle violenze sulle donne, il mondo dell'infanzia e la tutela dei più deboli. Sarà prevista infine una ulteriore pagina dedicata ad una intervista faccia a faccia con un protagonista di una storia di stretta attualità oppure con un personaggio noto dello spettacolo. - Conduce Eleonora Daniele \nProduttore esecutivo Antonella Stefanucci\nRegia di Valerio Fagioli"
