  title: Passato e presente 1956 La rivoluzione u
  subtitle: 'Passato e presente 1956 La rivoluzione ungherese - Ungheria. 5 e venti dell''alba del 4 novembre 1956. Radio Kossuth trasmette in diretta un drammatico appello del Primo ministro Imre Nagy: i carri armati s'
  description: sovietici stanno attaccando Budapest. "le truppe ungheresi stanno combattendo e il governo è al suo posto". Sono le ultime parole. Poi la radio tace. Nelle ore successive, dai microfoni di una stazione di provincia, un'ultima voce ripete un appello in inglese, in francese, in tedesco. Chiede aiuto all'Europa, alle Nazioni Unite, a chiunque ascolti. Nessun aiuto arriverà mai. Tutto era cominciato il 23 ottobre. 13 giorni in cui l'Ungheria osò sfidare l'impero sovietico. Studenti, operai e gente comune scesero nelle strade della capitale chiedendo libertà, indipendenza e la fine dello stalinismo. Abbatterono l'enorme statua di Stalin, respinsero i carri armati e sfidarono uno degli eserciti più potenti del pianeta. Per qualche giorno sembrò persino che avessero vinto. Poi, all'alba di quel 4 novembre i carri sovietici tornarono in forze. In studio con Paolo Mieli il professor Marcello Flores. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Marcello Flores Con la partecipazione di David Ognibene
