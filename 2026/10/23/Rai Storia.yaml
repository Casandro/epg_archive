  stop: 2026-10-23T05:30:00Z
  title: Soggetto Donna Donne e leadership p.2
  subtitle: Un estratto di Si dice Donna 1979 in cui le studentesse di scuole superiori lamentano le pressioni ricevute per proseguire studi classici a discapito di quelli scientifici, fa da premessa ad un ritratto di Ma
  description: |+
    ria Montessori, prima donna laureata in medicina dopo l'Unita' d'Italia. La donna che lavora 1959 racconta l'inserimento negli anni '60 delle donne in mondi professionali fin ad allora tradizionalmente preclusi: le prime donne giudici popolari, medici, chimici, ingegneri. - di Marta la Licata, con Brigida Gullo e Alessandra Conforti. Produttore esecutivo Sara Mariani.

