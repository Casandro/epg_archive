  title: 'Passato e presente Roma ''50. Crescita e '
  subtitle: Passato e presente Roma '50. Crescita e contraddizioni di una capitale - Anni '50 del 900. L'Italia è da poco uscita dalla guerra e la sua capitale attraversa il decennio cambiando volto. Sono gli anni del
  description: ni della Ricostruzione. Per Roma anni di trasformazioni decisive, epocali che la portano verso il futuro. Cresce la popolazione, aumentano i cantieri, nascono nuovi quartieri, le periferie si allargano, lo spazio urbano cambia. Una trasformazione impetuosa che, mattone dopo mattone, sta dando forma alla città che conosciamo oggi. Ma nella città persistono anche forti contraddizioni e difficoltà, specie per gli strati popolari, spesso costretti a vivere nelle borgate. I rapporti del Campidoglio coi costruttori privati sono forti e non sempre limpidi. Le giunte democristiane cercano equilibri politici. Roma diventa un laboratorio politico per l'intera nazione. Eppure, è nel complesso, un periodo di rinascita e speranza. In studio con Paolo Mieli, il professor Agostino Giovagnoli. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Agostino Govagnoli Con la partecipazione di Mari Sole Sanasi
