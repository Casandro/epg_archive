  title: Malta - Wüste oder Wasserlabor der Zukunft?
  subtitle: Film von Thomas Aders und Felix Gruber
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Malta - Europas trockenste Insel und zugleich trockenstes Land. Der Inselstaat kämpft ums Überleben. Während die Touristenströme unaufhörlich wachsen, versiegt das Wasser, das Land droht zu verdorren; nicht nur weil immer mehr Menschen sich immer weniger Wasser teilen müssen, sondern auch, weil der Klimawandel die Lage von Jahr zu Jahr verschärft. Landwirte wie Malcolm Borg versuchen, das Unmögliche möglich zu machen: Gemüseanbau in einem Land fast ohne Wasser. Verzweiflung und Erfindungsgeist: Re: zeigt ein Malta, das sich entscheiden muss - zwischen Ausverkauf und Aufbruch.'
