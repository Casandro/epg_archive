  title: Doppelkopf
  subtitle: '"Ich laufe erstmal los! Mal gucken, was mir da begegnet..." - der Kabarettist Bodo Wartke'
  description: 'Bodo Wartke liebt die Überraschung beim Kreativsein. Und er geht noch weiter: Experimentieren, Lösungen suchen und finden - diese Gabe hat die Menschheit in ihrer Geschichte schon öfter bewiesen, sagt er. Es gibt uns noch, trotz Weltuntergangsszenarien! Berufsoptimist Bodo Wartke ist der lebendige Beweis.'
