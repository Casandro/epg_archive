  title: Mittendrin - Flughafen Frankfurt
  subtitle: 87. 100 Jahre Lufthansa - Propeller, Piloten und Pillbox
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Von der offenen Fokker-Kabine 1926 bis zum Hightech-Jet. Lufthansa ist eine deutsche Jahrhundertgeschichte mit Höhen und Tiefen: Zweiter Weltkrieg, Nationalsozialismus, Entführung der Landshut, Vulkanausbruch in Island, Erstflug A380, Germanwings-Absturz, Corona-Pandemie, Streiks und vieles mehr. Heute steht sie zwischen Wettbewerb und Klimadruck. Ein packender Blick auf die Geschichte der größten Airline Deutschlands mit Zeitzeugen und beeindruckenden Flugzeugen von 1926 bis heute.'
