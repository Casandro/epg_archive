  title: Zmiennicy - odc. 8/15 - Fartowny dzień
  description: |-
    Tytuł oryginalny: Zmiennicy
    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Mieczysław Hryniewicz, Ewa Błaszczyk, Irena Kwiatkowska, Mieczysław Czechowicz, Kazimierz Kaczor, Krzysztof Kowalewski
    Podczas pogoni za ekspresem Krashan wyciąga broń. Korzystając z jego nieuwagi, Jacek ucieka. Krashan i Kuśmider jadą dalej, ale wkrótce zostają ujęci przez milicję. Nie wiadomo jednak, co zrobili z pieniędzmi. Taksówką jeździ teraz Kasia. Wiezie panią Koniuszkową, a później zapomina zabrać z wozu swój prawdziwy dowód. Jacek znajduje w skrytce dokumenty i odwozi do jej domu. Zostaje przyjęty przez rodziców dziewczyny jako kandydat na męża i umawia się z Kasią na randkę.
  ageRating: 12
