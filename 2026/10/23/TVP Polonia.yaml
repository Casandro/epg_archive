    Na SOR trafia znana wokalistka, która po wyczerpującym dniu w studiu mdleje i rozbija sobie głowę. Oliwia nie tylko opatruje uraz, ale też diagnozuje u niej poważną chorobę autoimmunologiczną i poznaje skrywany sekret artystki. Tymczasem Tomaszek i Borys walczą o zdrowie nastolatka pobitego przez kolegę.
