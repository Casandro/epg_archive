    Sowiński, po nocy spędzonej z Kasią, bierze na celownik kolejną lekarkę z kliniki i tym razem próbuje umówić się po pracy z nową rezydentką Klaudią, ale dziewczyna jego awanse odrzuca. Tymczasem Olek opowiada w końcu o swoim konflikcie z szefem Argasińskiemu. A gdy Chodakowski wpada przypadkiem w pracy na siostrę Sowińskiego, dyrektor wybucha nagle wściekłością i o mało nie rzuca się na chirurga z pięściami.
