  description: Kobiety świadomie podejmują decyzje dotyczące diety swojej i swojej rodziny, są otwarte na poszukiwania nowych pomysłów. Naprzeciw ich oczekiwaniom wychodzi Agnieszka Mielczarek, która pokazuje, jak gotować smacznie i zdrowo.
  genre:
