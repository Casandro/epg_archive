    Program prezentuje najciekawsze pomniki i zabytki polskiej kultury, w tym odcinku są to: Biskupin, Gniezno i Kórnik. Polskie Pompeje, największy ośrodek państwa Polan oraz pneumatofory i gruszki na wierzbie, czyli trzy obowiązkowe punkty dla każdego, kto przemierza Wielkopolskę. Biskupin - odkryta przez przypadek prawie kompletna konstrukcja drewniana wielkiej osady z odległej przeszłości. Tętniący życiem pomiędzy VII a IV wiekiem p.n.e.
