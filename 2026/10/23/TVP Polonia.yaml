    PL, 2008
    Reżyseria: Piotr Mikucki
    Drogą Via Julia Augusta, prowadzącą z Aquilei na północ, na tereny naddunajskiej Austrii, Robert Makłowicz przemierza prowincję Friuli Wenecja Julijska. Na odcinku 100 km, między nadmorskim Grado a górskim Sauris, krajobraz, klimat i kuchnia się zmieniają. Rozpocząwszy podróż wśród adriatyckich ryb i mięczaków, krakowski smakosz kończy ją w Alpach Karnijskich, pośród wędzonych serów, szynek i boczków. Korzystając z oferty drink and drive, po drodze zwiedza friulańskie winnice.
