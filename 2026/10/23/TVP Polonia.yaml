    Kryzys w relacji Marcina i Renaty ulega dalszemu pogłębieniu. Po kolejnej kłótni Kodur decyduje się na śledzenie partnerki, co skutkuje policyjnym zatrzymaniem jej dilera, a sama kobieta niemal trafia do aresztu. Tymczasem uczucie łączące Olę i Justina ponownie przybiera na sile. Niezależnie od tego Skotnicki spotyka się z Kępskim, zdeterminowany do wejścia w otwarty konflikt z Karoliną.
