    Projekt etiud filmowych przybliżających widzom sylwetki wybitnych polskich naukowców żyjących w różnych zakątkach świata, którzy swoją pracą i odkryciami dali podstawy do rozwoju nauki. W krótkich filmach poznamy niezwykłe historie wybitnych Polaków, którzy pomimo odległości, jaka ich dzieliła od Ojczyzny, sercem oddani byli Polsce, ale swoim umysłem i talentem służyli innym narodom.
