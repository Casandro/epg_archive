  subtitle: Majka odkrywa, że u dziadków nocowała ciocia Maria, jest nieco zaskoczona. Rodzice Magdy odwiedzają młodych Boskich, próbują zbliżyć się do wnuczki. Temat operacji plastycznych nie opuszcza Natalii i jej przyjaciółek.
