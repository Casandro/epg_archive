  title: Z Gliwic do Paryża - Wojtek Pszoniak
  description: |-
    Tytuł oryginalny: Z Gliwic do Paryża - Wojtek Pszoniak
    PL, 2010
    Reżyseria: Krzysztof Korwin-Piotrowski
    Film dokumentalny, Scenariusz i reżyseria: Krzysztof Korwin Piotrowski Fabularyzowany dokument o artystycznej drodze Wojciecha Pszoniaka. Podróż przez życie jednego z najwybitniejszych polskich aktorów rozpoczyna sam bohater filmu, stojąc przy wieży radiostacji w Gliwicach, w których się wychowywał i dorastał. Wysoka konstrukcja zawsze przypominała mu wieżę Eiffla, ale wówczas nie mógł jeszcze wiedzieć, że swoje dorosłe życie zwiąże właśnie z Paryżem.
  ageRating: 12
  genre:
