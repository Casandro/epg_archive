  title: Jak żyje las... - Materiał drewno
  description: |-
    Tytuł oryginalny: Jak żyje las...
    PL, 2023
    Drewno jest źródłem całej gamy rozmaitych produktów od papieru przez tkaniny po potężne elementy konstrukcyjne i dzieła sztuki. W tym odcinku opowiemy o różnych sposobach przetwarzania drewna jako surowca, o obróbce drewna i wykorzystaniu drewnianych odpadów. Dokumentalny cykl "Jak żyje las", realizowany wspólnie z Lasami Państwowymi przybliża widzom tajniki gospodarki leśnej, obala mity, tłumaczy pojęcia i definicje z nią związane.
  genre:
