  title: Polskie Parki Narodowe - Park Narodowy Ujście Warty
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '145'
  subtitle: Tematem programu będzie Park Narodowy Ujście Warty, znany z rozległych mokradeł, starorzeczy i łąk zalewowych oraz jako jedno z najważniejszych w Polsce miejsc ochrony i obserwacji ptaków.
