  title: Tiere vor der Kamera - Highway durch Australien - Auf nach Nordost
  subtitle: Tiere vor der Kamera - Highway durch Australien - Auf nach Nordost
  description: 'Ernst Arendt und Hans Schweiger nehmen uns heute mit durch Australien. Auf dem Stuart Highway nach Norden bis Darwin, ein kleiner Schlenker durch den Kakadu-Nationalpark und dann nach Osten ins Atherton Tableland, 4.000 km voller Tiererlebnisse. Am Wegrand: Wellensittiche, Zebrafinken, Babbler, Apostlebirds, nächtliche Flughunde, Krokodile, Papageienschwärme, Kraniche und Glücksschwalben. Die Kängurus mischen sich unter die Golfspieler und dann das Unmögliche, ein Känguru hoch oben im Baum.'
