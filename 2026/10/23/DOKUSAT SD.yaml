  subtitle: Tiere vor der Kamera - Highway durch Australien - Im heißen Herz
  description: Ernst Arendt und Hans Schweiger nehmen uns wieder mit, locker und unterhaltsam geht es durch Australien. Von Alice Springs stracks nach Osten durch die felsige Harts Range, dann immer weiter auf dem Plenty Highway bis nach Queensland und wieder zurück. Die 1.500 km sehen auf der Australienkarte nicht nach viel aus, sind aber voller Tier- und Landschaftserlebnisse. Ein Laubenvogel baut an seiner Renommier-Immobilie, Kakadus trinken im Flug.
