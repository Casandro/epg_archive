  subtitle: Wendepunkte des zweiten Weltkrieges - Kampf über England
  description: Nach der Niederlage Frankreichs 1940 scheint die nationalsozialistische Kriegsmaschinerie unaufhaltsam zu sein. In seinem Wahn versuchte Hitler, mit geplanten Luftangriffen die Kapitulation Großbritanniens zu erzwingen. Sein Ziel war es, durch die Vernichtung der Royal Air Force die Herrschaft über den britischen Luftraum zu erringen. Die Dokumentation blickt auf den Kampf der militärischen Giganten am Himmel über England.
