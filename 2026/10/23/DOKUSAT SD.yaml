  subtitle: Tiere vor der Kamera - Highway durch Australien - Bis zur Nordspitze
  description: Ernst Arendt und Hans Schweiger nehmen uns wieder mit, locker und unterhaltsam geht es durch Australien. Die Strecke zur Nordpitze, die Cape York Road ist Legende, jeder echte Australier muss sie einmal fahren und das Auto dabei ruinieren. Von Brisbane bis zum Cape stoppen wir für Koala, Helmkasuar, Waran, Riesenlaubfrosch, Riesenratte, Rotflügelsittich. Und das Schnabeltier zeigt Verhalten das Arendt/Schweiger noch nie zuvor im Freiland gesehen haben.
