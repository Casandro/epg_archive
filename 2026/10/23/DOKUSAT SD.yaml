  title: Wildes Überleben - Leben in Extremen
  subtitle: Wildes Überleben - Leben in Extremen
  description: '"Leben in Extremen" zeigt Überlebensstrategien, mit denen Tiere sich an Dürre, Hitze oder eisige Kälte anpassen. Von den Wüsten bis in die Hochgebirge unseres Planeten, tierische Überlebenskünstler haben sich in oft extremen Klimazonen angesiedelt. Dort müssen sie lernen, die unterschiedlichsten Herausforderungen zu meistern, um das Ende eines jeden Tages zu erleben. Und sie haben erstaunliche Methoden entwickelt, um nicht nur das eigene Überleben, sondern auch das ihrer Tiergemeinschaft zu sichern.'
