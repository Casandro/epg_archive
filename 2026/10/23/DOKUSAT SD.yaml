  description: 'Arendt und Schweiger zeigen uns hautnahe Tiererlebnisse: nächtliche Besuche von Opossums und Stinktieren, tagsüber Bisons am Straßenrand. Mit Humor führen sie uns die Welt der Truthähne vor und erleben selbst Überraschungen. Feuer in der Prärie beeindruckt, aber ein alter Bison bleibt gelassen. Kleine Stars wie Schwalben an Ölpumpen und Präriehähne begeistern. Übermütige Bisonkälber geben eine Extra-Vorstellung entlang des Highways durch die Prärie.'
