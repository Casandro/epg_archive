  description: Záznam koncertu King B's, jednoho z vítězů letošního Blues Aperitivu a zároveň jednu z kapel, kterou bude možné slyšet také na festivalu Blues Alive 2026. King B's patří mezi formace, které vycházejí z klasických bluesových základů, ale zároveň se nebojí současnějšího přístupu a vlastního hudebního rukopisu. Právě osobitost, přesvědčivý koncertní projev a práce s bluesovou tradicí patřily k důvodům, díky nimž kapela zaujala odbornou porotu. Připravuje Antonín Schindler.
