- eventId: 950814
  start: 2026-10-23T00:35:00Z
  stop: 2026-10-23T01:25:00Z
  title: Faszination Heimat - Vergessene Keller - Geheime Stollen
  subtitle: Faszination Heimat - Vergessene Keller - Geheime Stollen
  description: 'Robert Bouchal ist staatlich geprüfter Höhlenführer. Doch sein Herz schlägt nicht nur für Fledermäuse und Tropfsteine. Ganz besonders haben es ihm die menschengemachten Höhlen angetan: Alte Stollen, verfallene Zisternen, vergessene Kellergewölbe. Robert Bouchal wagt eine Expedition in die dunkle Unterwelt des Wienerwaldes. AT 2015'
- eventId: 950815
  start: 2026-10-23T01:25:00Z
  stop: 2026-10-23T02:12:00Z
  title: Heimatleuchten - Das Marchfeld - Gurkenflieger und Spargelstecher
  subtitle: Heimatleuchten - Das Marchfeld - Gurkenflieger und Spargelstecher
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 950816
  start: 2026-10-23T02:15:00Z
  stop: 2026-10-23T02:29:00Z
  title: Ruhe nach dem Sturm
  subtitle: Ruhe nach dem Sturm
  description: 'Die Ausrichtung auf Konsum ist in unserer Gesellschaft zum neuen Standard geworden. Die Spitze dieses irrationalen Konsummonsters ist die Zeit vor Weihnachten. Die Zeit, in der wir unseren Geliebten mit dem Wert der Geschenke zeigen, wie gern wir sie doch haben. Das ist der Punkt, an dem das Freeride Abenteuer beginnt: Um auf Abstand mit dem Konsumtaumel zu kommen, starten die Freerider ihren Simple Life Roadtrip mit nichts Weiterem im Kopf, außer jeden Tag aufs Neue, den schönsten Skitag der Saison zu genießen. In diesem Time-Out vom Leben bekommt Zeit einen anderen Stellenwert, 9 Uhr ist jetzt einfach hell und 19Uhr einfach dunkel, nichts weiter.  DE 2019'
- eventId: 950817
  start: 2026-10-23T02:30:00Z
  stop: 2026-10-23T02:33:00Z
  title: Escape to Ireland
  subtitle: Escape to Ireland
  description: Ein kurzes Drohnen Reisevideo mit den schönsten Spots Irlands. Trotz des durchwachsenden Wetters auf unserem Roadtrip, gab es immer mal wieder ein paar Minuten, in denen wir Yumi starten liessen um die beeindruckende irische Kulisse einzufangen.  DE 2020
