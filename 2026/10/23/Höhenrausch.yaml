  title: Verborgene Schätze - Stoasucher in den Alpen
  subtitle: Verborgene Schätze - Stoasucher in den Alpen
  description: In den Tiefen des Gesteins der Alpen sind kostbare Schätze verborgen. An den entlegensten Orten und in gefährlichem Terrain suchen erfahrene Männer nach Millionen Jahre alten Edelsteinen. Wie Andreas Steiner, der sein Leben der Suche verschrieben hat. AT 2016
- eventId: 950836
  start: 2026-10-23T05:05:00Z
  stop: 2026-10-23T05:52:00Z
  title: SOS in den Bergen
  subtitle: SOS in den Bergen
  description: 'Der Film begleitet ganz persönliche Abenteuer von Menschen in allen Regionen Österreichs - allein oder im Team, in der Natur, im Beruf oder als Berufung - und widmet sich den stillen Helden des Alltags: den Bergrettern. AT 2017'
- eventId: 950837
  start: 2026-10-23T05:55:00Z
  stop: 2026-10-23T06:45:00Z
  title: Winter Gold - Sacrifice
  subtitle: Winter Gold - Sacrifice
  description: Das Streben nach Exzellenz hat seinen Preis. In dieser Episode untersuchen wir die Kosten für Körper Geist und Seele dieser Sportler - denn der Weg zum Sieg ist selten einfach. Mit Jiawen Zhao und dem chinesischen Team der Nordischen Kombination. NL 2021
- eventId: 950849
  start: 2026-10-23T06:50:00Z
  stop: 2026-10-23T07:37:00Z
  title: Entstehung der Alpen - Mythos Alpen
  subtitle: Entstehung der Alpen - Mythos Alpen
  description: 'Entstehung der Alpen -  Mythos Alpen: Unsere Alpen. Eine beeindruckende und vielfältige Landschaft, die über Jahrmillionen entstanden ist. Prägende Epochen und historische Ereignisse spielten sich ab, umgeben von imposanten Berggipfeln der Alpen. Aber woher stammen die vielfältigen Namen unserer Berge und Gebirge? Und welche Geschichten führten zu ihrer Benennung? Wenn die Berge unserer Alpen selbst sprechen und erzählen könnten, würde es lange dauern bis sie etwas über uns zu berichten hätten. Denn als der Mensch hier irgendwann einmal hier auftauchte, standen die Gebirge selbst schon Millionen von Jahren AT 2015'
- eventId: 950850
  start: 2026-10-23T07:40:00Z
  stop: 2026-10-23T08:25:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  description: |-
    Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen: Seit tausenden Jahren trennen die imposanten Gipfel der Alpen Nord und Süd in Mitteleuropa - und scheinen dabei schier unüberwindlich. So bauten sich die Menschen Wege über die Alpen und perfektionierten die einfachen Pfade zu dem ausgeklügelten Verkehrsnetz das wir heute kennen. In den Pässen der Alpen sehen sie wichtigsten Routen, die die Geschichte Europas prägten und zum Aufstieg und Fall großer Persönlichkeiten führten.
     AT 2015
- eventId: 950851
  start: 2026-10-23T08:25:00Z
  stop: 2026-10-23T09:11:00Z
  title: Bergwelten - Das Kitzsteinhorn - Mehr als ein Berg
  subtitle: Bergwelten - Das Kitzsteinhorn - Mehr als ein Berg
  description: Das 3.203 Meter hohe Kitzsteinhorn wacht als einer der schönsten Gipfel Österreichs über eine einzigartige Landschaft. Bergführer, Sportler und Wissenschaftler nehmen uns mit auf eine spannende Reise auf, an und in den Berg. Von den Stauseen in Kaprun geht es hinauf bis zum Gipfel des mächtigen Kitzsteinhorns. Auf dem Weg dorthin erleben wir die vier Klimazonen, die sich vom Fuß des Berges bis zum Gipfel erstrecken - und begleiten Sommer- und Wintersportler bei ihren Abenteuern. AT 2021
