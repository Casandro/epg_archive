  title: Host Dopoledního expresu
  description: 'Citera: ztracený hlas Sudet. Hostem Dopoledního expresu dnes bude čerstvý držitel prestižního ocenění Zlatý džbánek 2026 hudebník a jediný učitel hry na citeru Michal Müller z Varnsdorfu, které získal právě za zachování lidových tradic. Na citeru hraje od třinácti let a studoval ji ve Vídni. Dnes koncertuje po celé Evropě, vyučuje a hudbu sám komponuje i aranžuje. Zdrojem jeho vlastní tvorby je pro něj kraj, kde se narodil a žije, českoněmecké pohraniční hory, které byly s citerou po staletí spjaté. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Milan Král.'
