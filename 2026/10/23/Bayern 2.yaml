  title: Bayern 2 Radiomikro
  subtitle: Für Kinder jeden Alters
  description: "Albrecht Dürer und die Jagd nach Ritter, Tod und Teufel\nEin mittelalterlicher Mitmachkrimi von Silke Wolfrum und Kilian Leypold\nMit Christian Baumann, Martha Couturier, Alexander Thiel, Mona Beichle, Thomas Loibl, Jeremias Rinnagl u.a. \nRegie: Frank Halbach\nModeratio: Katrin Waldenburg\nBR, hr, NDR, WDR 2026\n\nNürnberg 1513. In der Werkstatt des Künstlers Albrecht Dürer herrscht helle Aufregung: Die Kupferplatte für den berühmten Druck \"Ritter, Tod und Teufel\" wurde gestohlen. Meister Dürer ist verzweifelt, denn das Bild soll ein Geschenk für den Kaiser sein - und das schon am folgenden Morgen. Durch Zufall bekommen die sehr unterschiedlichen Kinder Martha, Appolonia und Eppo von dem Fall mit - und wollen den Dieb stellen. Doch welchen Lauf die Geschichte nimmt, bestimmen die Anruferkinder von Bayern 2 Radiomikro live vom 23. Oktober bis 25. Oktober 2026 jeweils um 18.05 Uhr. Gelingt es durch gemeinsames Hören und Kombinieren den Täter zu ermitteln?\nAb 8 Jahre\n\nKostenlose Nummer ins Studio: 0800 246 246 7\n\nDas Hörspiel ist auch als interaktive Version auf der www.abenteuer.ard.de verfügbar.\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2. \nAus urheberrechtlichen Gründen sind nur ausgewählte Sendungen und Beiträge als Podcast verfügbar."
