  title: Máme hosty
  description: Česká mužská kinballová reprezentace vyhrála nedávné mistrovství Evropy, ženy získaly stříbro. Většinu obou týmů tvoří pardubičtí a hradečtí hráči a hráčky. O neobvyklém sportu a českých úspěších v něm si budeme povídat s hlavním trenérem Klubu kinballu Pardubice Davidem Zárubou a hráčkou téhož klubu Barborou Zástěrovou. Moderuje Jakub Malý.
