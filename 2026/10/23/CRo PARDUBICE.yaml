  title: Východočeské výlety
  description: Kropenaté kuřice, slovenské sýry nebo domácí med, to vše se dá pořídit v Rosicích u Chrasti. Projdeme s vámi tradiční rosické trhy, navštívíme Muzeum života na vesnici v areálu bývalé cihelny a nahlédneme také do místního zemědělského družstva. Rosicemi na Chrudimsku vás provede redaktor Vilém Branda. (repríza)
