  title: Radioporadna
  description: Kulinářské výrobky cukrářky Regíny Gauglitz jsou v Chrudimi známé a žádané. Regína už několikrát získala titul Mls Pardubického kraje za svoje sladké zákusky. Letos uspěla opět, tentokrát ale porotu zaujal slaný pokrm v podobě pochoutkového salátu. Jak si jednoduše vyrobit chutný pochoutkový salát? Nejen o tom bude naše páteční Radioporadna. Moderuje Jitka Slezáková.
