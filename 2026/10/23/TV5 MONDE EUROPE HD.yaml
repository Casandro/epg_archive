  title: La grande galerie francophone
  subtitle: Sophie Calle, Olivia Ruiz E02. Chaque semaine et en public, Ali Baddou et sa bande de chroniqueurs reçoivent des artistes francophones qui sont au coeur de l'actualité et font bouger les lignes.
  description: 'C''est l''une des grandes artistes plasticiennes de l''époque, dont les oeuvres profondes et drôles s''exposent à travers le monde... La géniale Sophie Calle a fait entrer l''art dans la vie, à travers ses installations sur le sommeil, les ruptures, le deuil... Elle est notre invitée alors qu''elle publie \" Des histoires vraies \" : histoires parfois légères mais aussi sérieuses ou dramatiques. Olivia Ruiz fête ses 25 ans de carrière et s''apprête à se produire dans le prestigieux cadre du musée du Louvre, à l''occasion d''un spectacle en hommage au peintre espagnol Murillo. Elle sort également un livre, \" Vamos ! \". Mais qui était Berthe Brincour ? Alex Vizorek nous dit tout de la peintre luxembourgeoise. Invitées : Sophie Calle, artiste photographe et plasticienne ; Olivia Ruiz, autrice-compositrice-interprète, actrice et romancière (2026)'
