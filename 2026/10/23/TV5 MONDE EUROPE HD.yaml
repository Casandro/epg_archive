  subtitle: 'En dix ans, la Chine, puissance économique mais aussi militaire, est devenue la locomotive technologique de la planète. De Canton  '
  description: "Chine, une surpuissance fragile ?\n\nEn dix ans, la Chine est devenue la locomotive technologique de la planète. De Canton à Pékin, les voitures électriques du constructeur XPeng, désormais considéré comme le Tesla chinois, côtoient les taxis volants sans pilote ; les énergies renouvelables cohabitent avec les centrales à charbon. La puissance chinoise est économique mais aussi militaire. Elle possède la plus grande armée du monde et son économie dégage 1 200 milliards de dollars d'excédent commercial. Pourtant, derrière ces excellents chiffres, se dessine l'ombre d'un essoufflement : consommation en berne, chômage des jeunes, crise immobilière, déclin démographique... \n\nInvités : Lionel Fatton, professeur assistant en relations internationales à l'université Webster de Genève, spécialiste des questions militaires de l'Indo-Pacifique ; Guy Saint-Jacques, ancien ambassadeur du Canada à Pékin \n\nPrésentation : Dominique Laresche\n\n\n\n "
