  title: WDR 3 Konzert
  subtitle: 'Moderation: Claudia Belemann'
  description: "Die Augen der Besucher*innen in der Kölner Trinitatiskirche waren mit Schlafbrillen bedeckt. Komplette Konzentration auf den Klang: auf Chormusik des 19. Jahrhunderts von Robert Schumann z.B., die an die Sterne gerichtet ist; auf ein Werk der britische Komponistin Rebecca Dale aus dem Jahr 2022, das sanften Regenfall thematisiert; oder auf Klänge des Vibrafons. \n<strong>Alfred Schnittke</strong><br/>\"Stimmen der Natur\"\n<strong>Robert Schumann</strong><br/>\"An die Sterne\" <br/>aus: \"Vier doppelchörige Gesänge, op. 141\"\n<strong>Caroline Shaw</strong><br/>\"In the beginning\" <br/>aus: \"How to fold the wind\"\n<strong>Carlotta Ribbe<br/></strong>Vibrafonimprovisation\n<strong>Rebecca Dale </strong><br/>\"There will come soft rains\"\n<strong>Robert Schumann</strong><br/>\"Ungewisses Licht\" <br/>aus: \"Vier doppelchörige Gesänge op. 141\"\n<strong>Sven-David Sandström</strong><br/>\"A new heaven and a new earth\"\n<strong>Carlotta Ribbe<br/></strong>Vibrafonimprovisation\n<strong>Caroline Shaw</strong><br/>\"In creases\" <br/>aus: \"How to fold the wind\"\n<strong>Robert Schumann</strong><br/>\"Zuversicht\" <br/>aus: \"Vier doppelchörige Gesänge, op. 141\"\n<strong>Bent Sørensen </strong><br/>\"Und die Sonne geht unter\"\n<strong>Carlotta Ribbe<br/></strong>Vibrafonimprovisation\n<strong>Mirela Ivicevic</strong><br/>\"Innate heaven\"\n<strong>Robert Schumann</strong><br/>\"Talismane\" <br/>aus: \"Vier doppelchörige Gesänge, op. 141\"\n<strong>Carlotta Ribbe, </strong>Vibrafon<br/><strong>WDR Rundfunkchor</strong><br/>Leitung: <strong>Philipp Ahmann </strong>\nAufnahme vom 18. September in der Trinitatiskirche, Köln\nModeration: Claudia Belemann<br/>Redaktion: Michael Breugst"
