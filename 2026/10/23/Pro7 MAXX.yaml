    Dokumentation, USA 2018
    Altersfreigabe: ab 12
    (WH vom Freitag, 16.10.2026, 12:15 Uhr)
  description: 'Am Flughafen in New York halten die Beamten Ausschau nach Drogenschmugglern. Diesmal nehmen sie eine Frau aus der Karibik ins Visier. Aus ihrem Gepäck dringt ein seltsamer Geruch, dem die Ermittler nachgehen. Währenddessen bekommt es der Grenzschutz am Flughafen von Detroit mit einem Härtefall zu tun: Ein Mann aus Jamaika will offenbar für drei Monate in den USA bleiben. Doch dafür hat er lediglich 300 Dollar bei sich.'
  widescreen: true
