    Bittersüße Überraschung
    Doku-Serie, AUS/NZ 2022
    Altersfreigabe: ab 12
  description: |-
    In New South Wales ist ein vollbeladener Lkw umgekippt und blockiert je eine Spur in beide Fahrtrichtungen eines vielbefahrenen Highways. Das Team von Wagga Tow Trucking muss sich beeilen, um die Unfallstelle noch vor Einbruch der Dunkelheit zu räumen. In Neuseeland geht Bergungsveteran Rob seinem Sohn Stu zur Hand. Sie sollen ein gestohlenes Auto bergen, das gut 80 Meter in die Tiefe gestürzt ist.

    Schnitt: Sam Hutchinson, Afshin Jaafari
