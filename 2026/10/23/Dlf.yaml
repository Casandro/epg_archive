  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Wahlen in Brasilien: Evangelikale Kinderprediger werben für Bolsonaro
    Sie ist erst neun Jahre alt und erreicht mit ihren Predigten bereits Millionen Menschen: Ester Souza ist Brasiliens jüngste Kinderpastorin. Ester steht für eine Bewegung, die Brasilien tief verändert: Die Evangelikalen wachsen rasant und erreichen inzwischen fast 30 Prozent der Bevölkerung. Megakirchen, soziale Medien und das sogenannte Wohlstandsevangelium machen aus Glauben ein Milliardengeschäft. Gleichzeitig gewinnen evangelikale Pastoren immer mehr politischen Einfluss auch bei diesen Wahlen.

    Malteser-Praxis in Stuttgart behandelt Menschen ohne Krankenversicherung
    Rund 72.000 Menschen sind in Deutschland nicht krankenversichert. Die Dunkelziffer ist weit höher. Die Stuttgarter Praxis der Malteser-Medizin versorgt Menschen ohne Krankenversicherung kostenlos. Viele Patienten kommen aus der Europäischen Union oder Drittstaaten, es kommen aber auch Studenten, Rentner und viele Solo-Selbstständige.

    Am Mikrofon: Luisa Meyer
