  title: MDR KULTUR am Mittag
  description: "* 12:15 Uhr - Serientipp \"Wake Up\" im ZDF\nDas \"Near Future Drama\" erzählt von zwei Schwestern.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - MDR KULTUR Fragebogen an Michael Krebs\nIm letzten Jahr wurde sein künstlerisches Schaffen mit dem Leipziger Löwenzahn ausgezeichnet, dem  \ntraditionsreichen Preis für das beste Programm bei der Lachmesse. Dieses Jahr am 25.10. eröffnet der gebürtige \nSchwabe das größte Humorfestival des Ostens.\n\n* 13:15 Uhr - Studiosession mit Baba Yaga\nZu Gast bei Jan Kubon in der Studiosession die Band Baba Yaga aus Wien\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - Julia Koschitz über '\"Das Vergessen - Spurlos im Moor\"\nWas mit einem tragischen Vermisstenfall in der österreichischen Provinz beginnt, führt zu einer dramatischen \nKettenreaktion - und weiteren Opfern! Julia Koschitz als Ermittlerin gerät in einen doppelten Wettlauf mit der Zeit.\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Lydia Jacobi"
