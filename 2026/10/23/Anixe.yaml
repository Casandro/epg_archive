  description: 'Plötzlich ist nichts mehr, wie es war. Wenn das eigene Kind stirbt, gerät die Welt aus den Fugen. Und doch müssen Eltern einen Weg finden, mit diesem Verlust weiterzuleben. Jana Antl und Harold McDonald berichten, wie sie die Kraft für einen Neuanfang fanden. (Moderation: Marzia Plichta / Andreas Waldmann)'
