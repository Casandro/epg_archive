  title: ERF Mensch Gott - Gott gibts echt! - Auf spiritueller Suche
  subtitle: ERF Mensch Gott - Gott gibts echt! - Auf spiritueller Suche
  description: 'Plötzlich beginnt ein Bild an der Wand heftig zu wackeln. Seine Mutter schreit voller Panik: Es ist jemand gestorben. Und tatsächlich kommt wenige Minuten später der Anruf, dass ein Verwandter erschossen wurde. Matheo ist zu dem Zeitpunkt 12 Jahre alt und kann nicht einordnen, was da passiert. Auf seiner spirituellen Suche hört er dann plötzlich eine Stimme und weiß sofort, wer da spricht.'
