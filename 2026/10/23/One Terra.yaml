  title: Planet Weltweit - Die Holzfäller von British Columbia
  subtitle: Planet Weltweit - Die Holzfäller von British Columbia
  description: Lange galt British Columbia als El Dorado der Holzfäller. Schneise um Schneise schlugen sie in den Urwald, holten die edlen Hölzer heraus, um damit die Bauwirtschaft oder die Papierindustrie zu beliefern. Die einseitige Ausrichtung der Wirtschaft auf die Ausbeutung der Wälder bereitet jedoch gewaltige Probleme und das nicht erst seit der Wirtschaftskrise. Neue Lösungen müssen gefunden werden, um die Waldwirtschaft und die einmaligen Wälder zu erhalten. Auswirkungen hat dies auch für das Städtchen Revelstoke, in dem der Unternehmer Cal March sein kleines Unternehmen betreibt. Es ist eine der letzten verbliebenen Holzfirmen in der Gegend. Wir haben Cal March besucht und mit ihm die Veränderungen erlebt, mit denen die moderne Holzwirtschaft die Zukunft meistern will. British Columbia im Westen Kanadas hat den weltgrößten, unberührten "borealen Regenwald" mit mehreren hundert Jahre alten Bäumen und Regionen, die noch nie ein Mensch betreten hat. Ein Durchkommen auf dem Boden ist für Mensch und Maschine fast unmöglich. Unter dem Waldboden lagern Millionen Tonnen von Bodenschätzen wie Gold und Kohle. Eine Herausforderung für den Schutz dieser einmaligen Landschaft. Doch das Augenmerk der Wirtschaft liegt auf dem Waldbau - dem Betätigungsfeld von Carl March. Um vier Uhr dreißig beginnt für ihn der Tag. Holzfäller sind Frühaufsteher. Das müssen sie sein, denn während der Erntezeit klettern die Temperaturen in den Rocky Mountains schnell auf über 30 Grad. Eine Strapaze für die Arbeiter mit ihrer kiloschweren Ausrüstung. Hinzu kommt, dass sie auf Hängen arbeiten, deren Steigungen bis zu 40 Grad betragen. Dennoch konnten Cal March und seine Arbeiter lange Zeit gut von der Holzwirtschaft leben. Auch nachdem in den letzten Jahren Umweltschützer zusammen mit Regierungsvertretern und Forstvertretern Programme erarbeitet haben, die den Holzfirmen strenge Auflagen erteilen. DE 2009
