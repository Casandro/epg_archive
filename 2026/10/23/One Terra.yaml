  title: Planet Weltweit - Die Samurai von Fukushima
  subtitle: Planet Weltweit - Die Samurai von Fukushima
  description: 'Die Samurai, Japans legendäre Ritter: Zu ihrem Ehrenkodex gehört es, jedem Gegner und dem Schicksal mit Disziplin die Stirn zu bieten - doch gegen die Katastrophe, die 2011 ihre Küsten verwüsteten, waren sie machtlos. Nur mühsam erholt sich das Land vom Tsunami und dem atomaren Gau. Doch in diesem Jahr feiern die Reiter erstmals wieder ihr legendäres Reiterfest.  DE 2013'
