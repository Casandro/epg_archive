  title: Planet Weltweit - Die Schweizergarde - Ein Leben für den Papst
  subtitle: Planet Weltweit - Die Schweizergarde - Ein Leben für den Papst
  description: 'Planet Weltweit: Seit 1506 schützt die Schweizergarde, die kleinste Armee der Welt, den Papst und seine Residenz. Verändert haben sich jedoch die Methoden der Auftragserfüllung und das Umfeld, in dem sich die Gardisten bewegen. In der traditionellen Renaissance-Uniform steckt heute ein junger, moderner und gut ausgebildeter Schweizer, der bereit ist, sein Leben für die Sicherheit des Papstes zu geben. Viele junge Männer wollen in die Elitetruppe eintreten, dafür erhalten sie eine strenge Ausbildung, die mit der Vereidigung und damit Aufnahme in die pästliche Armee endet. Die Kaserne der Schweizergarde befindet sich auf einer Fläche von 500 Quadratmetern auf dem Territorium des Vatikanstaates. Seit mehr als 700 Jahren wird hier eine Gruppe junger Männer rekrutiert, deren Aufgabe es ist, den Heiligen Vater, seine Kardinäle und den Vatikan zu schützen. In der historischen Renaissance-Uniform sichern die jungen Männer die Eingänge zum Vatikan und dem   Apolstolischen Palast, in dem der Papst mit seinen Kardinälen lebt, sie sind immer präsent bei den Gottesdiensten und Audienzen auf dem Petersplatz. Tag und Nacht stehen sie auf ihren Posten, stundenlang harren sie in Uniform und Rüstung aus. Lukas und Dominique stammen, wie alle Gardisten, aus der Schweiz. Aus ihren kleinen Dörfern kommend, haben sie sich entschlossen, der kleinsten Armee beizutreten, eine strenge und anstrengende Ausbildung in Kauf zu nehmen, Sprache und Kultur Italiens zu verinnerlichen. Nach einem Jahr der Ausbildung fiebern alle dem großen Moment der Vereidigung entgegen - mit einem Schwur besiegeln sie, sich in den Dienst des Heiligen Vaters zu stellen. Und wenn die Situation es erfordert, auch ihr Leben für dessen Schutz zu geben. Was bewegt diese jungen Männer zu solch einem Schritt -  diesen und anderen Fragen folgen wir bei einem exklusiven Blick ins Herz des Vatikans. DE 2022'
- eventId: 950825
