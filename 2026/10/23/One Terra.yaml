  title: Planet Weltweit - Die Meerfrauen von Japan
  subtitle: Planet Weltweit - Die Meerfrauen von Japan
  description: '"Ama" nennen sie sich, Frauen des Meeres. Bis ins hohe Alter holen sie kostbare Meeresfrüchte vom Grund des Ozeans, trotzen der Tiefe nur mit der Kraft ihres Atems. Ihre Haut ist von Wind und Wasser gegerbt, ihre Stimme tief und laut. Seit Jahrzehnten teilen sich neun Frauen von der japanischen Halbinsel Shima ihr Schicksal auf einem Boot und sind dabei zu einer eigenen engen Meeres-Familie zusammengewachsen. Kazu Yamamoto ist mit ihren knapp 80 Jahren die Älteste der Gruppe, eine Ama in fünfter Generation. Ans Aufhören denkt sie längst noch nicht: "Im Meer kann ich meinen Körper besser fühlen und bewegen als an Land. Einmal im Wasser, verschwinden alle Schmerzen, auch der Rücken tut mir plötzlich nicht mehr weh", erzählt Kazu Yamamoto. Seit Jahrhunderten ist das Tauchen nach Meeresfrüchten in Japan die Arbeit der Frauen: Manchmal hat das Wasser nur zwölf Grad, wenn die Ama in die Wellen verschwinden, um Meeresschnecken, Muscheln, Seeigel, Algen und insbesondere "Awabi", die kostbaren Seeohren, aus der Tiefe zu holen. Awabi sind eine Delikatesse, für die Gourmets in den Großstädten Unsummen zahlen. Ohne Pressluftflaschen, mit primitiven Masken und Flossen sowie in traditionelle weiße Überanzüge mit Kopftuch gehüllt, stoßen die Meeresfrauen in die Tiefe hinab, um mit einem Meißel die Schnecken von den Felsen zu lösen. "Es ist ein tückischer Seeberuf," sagen sie, denn manch eine von ihnen läßt dabei ihr Leben. Nicht die technische Ausrüstung, sondern das eigene Geschick entscheidet über den Erfolg und das Überleben einer Ama. Lange galten die gut verdienenden Taucherinnen unter den Männern selbst als "guter Fang". Heute haben die Frauen entlang der Küsten bessere Berufschancen. Das Durchschnittsalter der Ama ist deswegen auf 60 Jahre gestiegen, viele von ihnen sind sogar über 70! DE 2009'
