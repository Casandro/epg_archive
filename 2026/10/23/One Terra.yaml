  title: Planet Weltweit - Albanien - Die Stimmen der Schäfer
  subtitle: Planet Weltweit - Albanien - Die Stimmen der Schäfer
  description: 'Planet Weltweit: Über viele Jahrhunderte wanderten albanische Hirten mit ihren Tieren über den ganzen Balkan. Eine Tradition, die mit der sozialistischen Diktatur ein jähes Ende fand. Nach deren Niedergang besannen sich viele der einstigen Schäfer wieder auf ihre alten Bräuche und versuchten auch ihre Kinder für den Hirtenberuf zu begeistern. Doch die haben sich längst der Moderne zugewandt, studieren in den Städten und sehen keine Perspektive in der althergebrachten Tradition. Haben die Schäfer dennoch eine Zukunft in dem Balkanland? Bastri Limoj ist Hirte im südalbanischen Bergdorf Vranisht und lebt mit seiner Familie, von dem, was er mit seinen Schafen und Ziegen erwirtschaftet. Während der sozialistischen Diktatur unter Enver Hodscha, zwischen 1944 und 1990, wurden die Herden jedoch zwangskollektiviert, den Hirten weggenommen und in Gemeinschaftseigentum umgewandelt. Nach dem Ende des Regimes waren es die Alten, die sich wieder auf diese Tradition besannen, um ihren Lebensunterhalt zu verdienen. Nachwuchs gab es kaum. Zu mühselig erschien vielen jungen Menschen der Beruf, zu rückwärtsgewandt, mit zu geringen Verdienstmöglichkeiten. Auch Bastris Sohn Lucjano suchte wie viele seiner Generation ein besseres Leben in der Stadt und studierte Maschinenbau. Ab und zu kommt er in sein Heimatdorf zurück, um seinem Vater zu helfen. Der möchte diesmal, dass er ihn auch beim Auftrieb der Herde zur Sommerweide in die Berge begleitet. Der Weg über die Geröll-Pfade ist gefährlich für Mensch und Tier. Und auch oben auf den Weiden nimmt die Sorge um das Vieh nur selten ein Ende. Kein Platz für Schäferromantik außer in den überlieferten Polyphongesängen. Diese mehrstimmigen Gesänge mit einem tiefen Halteton stammen aus der Hirtentradition der Region - "Labëria" genannt. Mittlerweile greifen sie auch junge Leute begeistert wieder auf. Liegt hierin auch eine Chance für den Schäferberuf?  DE 2022'
