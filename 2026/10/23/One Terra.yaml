  title: Planet Weltweit - China, Braut ohne Bräutigam
  subtitle: Planet Weltweit - China, Braut ohne Bräutigam
  description: Kunming, die Hauptstadt der chinesischen Provinz Yunnan, ist eine pulsierende Metropole mit sieben Millionen Einwohnern. Ein Schmelztiegel verschiedener Kulturen. Nirgendwo sonst im Land kommen so viele verschiedene Stämme und ethnische Minderheiten zusammen. Jahrhundertelang lebten sie verteilt in Chinas ursprünglichster, "wildester" Provinz - auf ihren bis zu 3.000 Meter hohen Bergen und in abgelegenen Tälern. Die junge Generation muss den Spagat zwischen den traditionellen und den modernen Welten meistern - was erstaunlich gut gelingt. Die 25jährige Meiyun lebt im pulsierenden Kunming. Sie ist eine moderne, hübsche Frau - und doch findet sie keinen passenden Partner. Im China des 21. Jahrhunderts ist dies ein generelles Problem. Keine Zeit, zu viel Stress, der Job hat Vorrang und frisst das Privatleben auf. Auf Meiyung lastet Druck. Denn sie entstammt dem Bergvolk der Hani, bei denen Mädchen traditionell früh verheiratet werden. Meiyuns Eltern erwarten von ihr, dass sie bald einen passenden Bräutigam findet. Die Mutter hat sogar schon das Brautkleid fertig genäht. Eine der wenigen Möglichkeiten, potentielle Partner kennenzulernen, bietet das jährliche Kuzhazha-Fest, zu dem Meiyun zurück in ihre traditionsbehaftete Heimatstadt reist. Diese Reportage hat Meiyun begleitet. Mehr und mehr zieht es die jungen Generationen in die große Stadt, weil dort mehr Geld zu verdienen ist. So auch die 25jährige Meiyun vom Stamm der Hani. Auf den Märkten der Hauptstadt kauft sie Silberschmuck verschiedener Stämme - um diesen später von Zuhause aus per Internet weiter zu verkaufen. Damit kann sie ihre Familie finanziell unterstützen und sich ein Apartment leisten, das sie sich allerdings mit zwei anderen jungen Frauen und deren Kindern teilt. Nur einen passenden Partner hat sie bislang nicht gefunden. Ein Makel in den Augen ihrer Eltern und ihres Stammes. DE 2015
