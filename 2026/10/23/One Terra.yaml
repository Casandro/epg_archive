  title: Planet Weltweit - Sardiniens wertvolle Muschelseide
  subtitle: Planet Weltweit - Sardiniens wertvolle Muschelseide
  description: 'Planet Weltweit: Jedes Frühjahr findet auf der italienischen Insel Sardinien eine Prozession zu Ehren des Heiligen Antiochus statt. Dafür putzen sich die Einwohner festlich heraus und legen Kostüme an, die zum Teil seit Generationen in Familienbesitz sind. In den Kirchen werden Altartücher ausgelegt, die noch mit Muschelseide verziert sind - jenen Fasern, die die Fischer seit Jahrhunderten dem Meer entnahmen. Inzwischen sind die Muscheln, von denen die Fasern stammen, streng geschützt. Die Inselbewohner behelfen sich mit verbliebenen Resten, was der Euphorie und Vorfreude auf die bevorstehende Prozession keinen Abbruch tut. Die Schwestern Assuntina und Guiseppina Pes stecken inmitten der Vorbereitungen für die große Prozession zu Ehren des Heiligen Antiochus. Er ist ein Schutzpatrons Sardiniens. Einmal im Jahr findet die große Parade statt, bei der Einwohner der gesamten Insel zusammenkommen, um zu feiern. Festa Manna wird diese größte, 15 Tage nach Ostern anberaumte Feier zu Ehren des Heiligen genannt. Für dieses Anlass fertigen die Schwestern Pes Altartücher an und bessern bereits verwendete Tücher aus. Noch können sie dabei auf einen kleinen Rest Muschelseide zurückgreifen, jenes Material, welches aus dem Byssus der Pinna nobilis gewonnen wird, einer Riesenmuschel, die lange in den Buchten vor der Insel lebte. Inzwischen gibt es diese Muscheln fast nicht mehr. Ein Parasit hat ihre Zahl so stark dezimiert, dass Forscher unsicher sind, ob es überhaupt noch Exemplare dieser kostbaren Art gibt. Was für die Wissenschaftler einem biologischen Desaster gleichkommt, bedeutet für die Einwohner vor allem ein Umdenken bei ihren Traditionen. Längst arbeiten sie auch mit alternativen Materialien, etwa Maulbeerseide. Aber hin und wieder finden sich noch Reste der alten Muschelseide, welche dann mit großer Vorsicht verarbeitet werden. So auch dieses Jahr. Ob Assuntina und Guiseppina mit ihrer Arbeit rechtzeitig fertig werden? DE 2022'
