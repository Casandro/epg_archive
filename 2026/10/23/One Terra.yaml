  title: Planet Weltweit - Auf dem Floß durch die Schluchten der Tara
  subtitle: Planet Weltweit - Auf dem Floß durch die Schluchten der Tara
  description: 'Am Fuße einer 1300 Meter tiefen Schlucht in Montenegro wagen sich seit Generationen mutige Flößer auf die Stromschnellen der wilden Tara - einen der letzten ungezähmten Wildflüsse Europas. Doch die Männer gehören zu den Letzten ihrer Art. Ihr Beruf ist fast ausgestorben. Unzugängliche Wälder, schroffe Canyons, abgelegene Hochplateaus: Wo im Norden Montenegros die Tara auf 140 Kilometern Länge das Durmitor-Gebirge durchschneidet, ist ein Floß oftmals das beste Transportmittel. Der 53jährige Fikret Pendek wagt regelmäßig den Ritt auf der wilden Tara. Der Flößer hat von seinem Vater gelernt, den Fluss zu "lesen" und weiß, wo die gefährlichsten Felsen unter Wasser lauern. Fikrets selbst gebautes tonnenschweres Gefährt ist zugleich seine Ware, denn er lebt vor allem vom Holzverkauf. Dieses Mal nimmt er seinen Neffen mit. Ob der sich für den gefährlichen Job eignet? Wir haben den Flößer auf einer seiner rasanten Fahrten durch die raue Landschaft Montenegros begleitet. Mehrfach im Jahr schlägt Fikret Pendek in den Wäldern des Durmitors ein Dutzend Bäume, deren Stämme er von Montenegro aus über den Tara-Fluss ins benachbarte Bosnien transportiert. Die Wälder entlang des Flusses liegen in einem Naturschutzgebiet, weshalb der Einsatz von Maschinen zum Holzeinschlag und Transport verboten ist. So bündeln Fikret und seine Helfer die Stämme zu einem Floß, das er anschließend die Tara hinabjagt. Einmal fertig gestellt, wiegt das Gefährt über zwei Tonnen. Ein Mann allein könnte es niemals bedienen, deshalb nimmt Fikret immer Freunde oder Familienangehörige mit auf das Floß, die ihn unterstützen. Bei dieser Fahrt kommt sein zwölfjähriger Neffe Ismet mit, der herausfinden möchte, ob ihm der Flößer-Beruf gefällt. Denn noch erfüllen Männer wie Fikret hier eine wichtige Rolle. Die Bewohner abgelegener Regionen sind auf gegenseitige Hilfe und Unterstützung angewiesen. DE 2012'
