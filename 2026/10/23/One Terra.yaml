  subtitle: Planet Weltweit - Arktis - ein Junge wird Jäger
  description: 'Sobald sie laufen können, bekommen Jungen am nordwestlichsten Zipfel Grönlands einen kleinen Hundeschlitten von ihren Vätern geschenkt. Ein Spielzeug, das dazu dient, früh mit dem vertraut zu werden, was für Polar-Inuit immer noch das Lebenswichtigste ist: dem Jagen. Doch immer weniger Jungen wollen Jäger werden. Der zwölfjährige Qaaqqukannguaq ist eine Ausnahme. Zusammen mit seinem Vater wird er sich während der Frühlingsferien zum ersten Mal auf eine mehrtägige Jagdreise mit dem Hundeschlitten durch die Eiswüste begeben - 70 Kilometer weit von ihrer winzigen Siedlung Savissivik bis zur Eiskante am Kap York. DE 2013'
