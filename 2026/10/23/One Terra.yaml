  title: Planet Weltweit - Traumberuf Schäfer
  subtitle: Planet Weltweit - Traumberuf Schäfer
  description: 'Seit etwa 7000 Jahren ziehen Schäfer mit ihren Herden hoch zu den Gipfeln der Pyrenäen. Wie sie die Tiere führen und wohlbehalten über den Sommer bringen, bekamen die meisten von ihren Vätern beigebracht, der Schäferberuf wurde von einer Generation an die nächste weitergegeben. Mit dem Niedergang der traditionellen Landwirtschaft im 20. Jahrhundert ist das Wissen der Schäfer mehr und mehr verschwunden. Fast schien es, ihr Beruf würde aussterben. Doch seit einigen Jahren kommen wieder junge Männer und Frauen in die Pyrenäen, viele aus großen Städten und der Hektik moderner Zivilisation überdrüssig, um an der Seite erfahrener Schäfer die Kunst des Herdenführens zu erlernen. Die Reportage zeigt den 24-jährigen Yann Amouret, seinen Lehrmeister und ihre Herde einen Sommer lang. Ein Schäfer hat viele Berufe: Er muss ein Regiment führen können, Krankheiten und Verletzungen heilen, Kräuter und Pflanzen identifizieren und das Wesen seiner Tiere verstehen. Ein halbes Jahr ist er der einzige Mensch in der Nähe der Herde. Solange die Schafe über die Wiesen ziehen und sich Winterspeck anfressen, ist er ihr Beschützer und Führer, verantwortlich für das Wohlergehen jedes einzelnen Tieres. Das sind meist weit über 1000 Stück, und kein einziges sollte dem Hirten verloren gehen. Trotz dieser hohen Anforderungen hat sich der 24-jährige Yann Amouret für eine Ausbildung zum Schäfer entschieden. Zusammen mit dem erfahrenen Hirten Yves Renaud zieht er im Frühjahr auf die fast 2000 Meter hohen Gipfel Cagire in den Zentralpyrenäen, um dort fünf Monate lang eine Herde von 1300 Schafen zu hüten. Yves Renaud wird in dieser Zeit ein wachsames Auge auf seinen Lehrling haben müssen, denn der Beruf des Schäfers ist nicht nur technisch, sondern auch körperlich anspruchsvoll. Die Männer müssen täglich 15 Stunden arbeiten und ihren Tieren auf steilen Hängen folgen können - in tiefster Abgeschiedenheit. DE 2005'
