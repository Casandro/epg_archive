  title: SWR Kultur - Das Wissen
  subtitle: Versorgungslücke in der Psychotherapie - Ist KI eine Lösung?
  description: |-
    Von Emma Lehmkuhl
    Wer psychisch leidet, wartet oft mehrere Monate auf Hilfe - besonders als gesetzlich Versicherter. Viele wenden sich dann an Chatbots wie ChatGPT & Co, die keine Therapie ersetzen und in Krisen sogar gefährlich sein können. Spezialisierte KI-Angebote wie Emotionslotse, Ello oder ElderBot sollen Betroffene schneller unterstützen und diese Lücke überbrücken; sie sind therapeutisch trainiert, wissenschaftlich begleitet und haben klare Einsatzgrenzen. Entsteht damit eine neue Zweiklassenmedizin - Therapie beim Menschen für Privatpatienten, KI-Betreuung für den Rest?
