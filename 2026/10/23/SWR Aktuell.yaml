  description: "14:00\nSerbien \"Stürzen die Studenten Vucic?\" \nvon Oliver Soos/Wien\n\n14:30\n\"Brasilien und der wachsende Einfluss der Evangelikalen\" \nvon Anne Herrberg/Rio de Janeiro\n\nDie Parlamentswahl in Serbien ist Thema in der SWR Aktuell Langstrecke\nSerbiens Studenten haben Pläne... für einen Machtwechsel. Am Sonntag wird ein neues Parlament gewählt, und Präsident Vuèiæ könnte in einer historischen Wahl seine Macht verlieren. Seine Partei wird von einer unabhängigen Liste herausgefordert, die von protestierenden Studenten ins Leben gerufen wurde. Sie wollen den politischen Wandel. Doch Vuèiæ hat eigene Pläne -  und die lauten: Regierungschef statt Präsident. \n\nAußerdem geht es dann um die Stichwahl ums Präsidentenamt in Brasilien - auch die ist diesen Sonntag - und um den wachsenden Einfluss radikaler Gruppen auf die brasilianische Politik."
