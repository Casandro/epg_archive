  title: Der Tag
  description: |-
    19:00
    Aus dem Leben - Bestsellerautorin Meike Winnemuth darüber, warum Lesen uns so glücklich macht
    Meike Winnemuth liebt Selbstversuche. So hat sie schon einmal ein Jahr lang täglich das gleiche blaue Kleid getragen. Ist, nachdem sie in Günther Jauchs Quizshow "Wer wird Millionär" eine halbe Million Euro gewonnen hat, ein Jahr durch 12 Städte um die Welt gereist. Über ihre Weltreise hat sie dann ihren Bestseller "Das große Los" geschrieben. Nach der Reise um die Welt beendete sie ihr Nomadentum und hat in einer kleinen Hütte mit Garten an der Ostsee danach ein neues Zuhause gefunden. Über das Ankommen dort und ihr Jahr mit den Händen in der Erde ihres Gartens schreibt sie in ihrem Bestseller "Bin im Garten".
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/

    19:30
    Kultur - "Ich singe um mein Leben" - Reinhard Mey im neuen Porträt
    Reinhard Mey ist DER deutsche Liedermacher, seit über 60 Jahren. Mit Hits wie "Über den Wolken", "Gute Nacht, Freunde" oder "Nein, meine Söhne geb' ich nicht". Vor kurzem ist Reinhard Meys 30. Studioalbum "Schatzhauser" erschienen und hat ihn aus dem Stand auf Platz 1 der Deutschen Albumcharts katapultiert. Fast zeitgleich ist ein neues Buch über den Berliner Musiker erschienen: >"Ich singe um mein Leben". Reinhard Mey - ein Porträt<. Dafür stand der Literaturwissenschaftler, Lektor und Autor Oliver Kobold über vier Jahre hinweg mit Reinhard im Austausch. Warm und berührend erzählt Kobold hier die Geschichten hinter den Liedern. So entsteht ein vielschichtiges Bild des Musikers und Menschen Reinhard Mey.
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/
