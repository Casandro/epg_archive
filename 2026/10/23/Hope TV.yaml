  title: Cliff!
  subtitle: Kunst ist für die Lebenden, nicht für die Sterbenden
  description: |-
    Cliff Goldstein beleuchtet das Leben und Denken des bekannten Intellektuellen Christopher Hitchens - vom scharfzüngigen Kritiker der Religion bis zu seinen letzten Tagen mit einer Krebsdiagnose. Er setzt sich kritisch mit Hitchens' Werk God Is Not Great auseinander und hinterfragt, ob Kunst, Literatur oder Wissenschaft wirklich Sinn geben können, wenn der Tod unausweichlich ist. Anhand von Zitaten aus Hitchens' letztem Buch Mortality zeigt Goldstein, dass diese Quellen in seinen letzten Stunden keinen Trost boten. Sein Fazit: Wahre Hoffnung findet sich nur im Wort Gottes.

    Weitere Infos unter: www.hopetv.de
