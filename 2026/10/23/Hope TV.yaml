  title: Beweg dich!
  subtitle: Cardio mit Rhythmus - Herz und Kreislauf aktiv in 15 Minuten
  description: |-
    Diese Cardioeinheit bringt den Kreislauf in Schwung - mit einfachen Schrittfolgen wie Side Steps, V-Steps, Kicks und Jumping Jacks, begleitet von Musik im 105er-Takt. Nach einer kurzen Gehpause folgt die Wiederholung der Übungen. Das gibt Sicherheit und verstärkt den Trainingseffekt. Die Bewegungsabfolge eignet sich hervorragend für alle, die regelmäßig etwas für Ausdauer und Beweglichkeit tun möchten - leicht umsetzbar, wohltuend und motivierend. 15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand".

    Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
