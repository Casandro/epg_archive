  title: Izvor
  subtitle: U malom šumadijskom selu Ramaća, postoji izvor koji se naziva Amidžinim. Glavno izvorište nalazi se na imanju domaćina Obrena Biorca, ali korišćenjem vode upravlja lokalna vodna zadruga "Izvor".
  description: U malom šumadijskom selu Ramaća, postoji izvor koji se naziva Amidžinim. Glavno izvorište nalazi se na imanju domaćina Obrena Biorca, ali korišćenjem vode upravlja lokalna vodna zadruga "Izvor". Svake godine obližnje kragujevačke opštine pokušavaju da se dogovore sa zadrugom iz Ramaće o zajedničkom korišćenju njenog vodnog potencijala; svake godine, svi članovi zadruge jednoglasno odbiju njihove ponude, zadržavajući Amidžin izvor isključivo za sebe i svoje porodice. Ali, situacija se menja kada u Ramaću dođe Goran Slavković, dobrostojeći poslovni čovek iz Beograda. Znajući da glavnu reč u vodnoj zadrugi "Izvor" vodi Obren Biorac, Goran sa njim ulazi u poslovne pregovore, nudeći "Izvoru" veliku investiciju koja bi kraj Amidžinog izvora napravila fabriku vode, ali i savremen, uređen i luksuzan banjski kompleks, od koje bi koristi imala i cela Ramaća, i njena šira okolina. Obren odlučuje da započne pregovore sa Slavkovićevem, čemu doprinose i neki sasvim lični razlozi. Naime, Obrenov...
