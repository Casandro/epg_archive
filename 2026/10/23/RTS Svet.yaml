  title: Koncert Dragice.
  subtitle: Neposredno nakon predstavljanja novog studijskog albuma (dupli CD, PGP RTS), pod nazivom "Koreni i cvetovi", renomirana estradna umetnica Dragica Radosavljević Cakana održala je i veliki solistički.
  description: Neposredno nakon predstavljanja novog studijskog albuma (dupli CD, PGP RTS), pod nazivom "Koreni i cvetovi", renomirana estradna umetnica Dragica Radosavljević Cakana održala je i veliki solistički koncert u MTS dvorani. "Dobro veče i dobro došli da zajedno zapevamo, pa i zaplačemo. Da slavimo što smo svoji, što imamo i korene i cvetove. Hvala vam još jednom i dobro mi došli.", obratila se Dragica Radosavljević Cakana publici na početku koncerta, odevena u narodnu nošnju koju je donela iz rodnog Leposavića. Tokom nesvakidašnjeg muzičkog spektakla koji je trajao duže od dva sata, uz pratnju vrhunskih muzičara Narodnog ansambla RTS-a pod vođstvom soliste na harmonici Siniše Vićentijevića, legendarna pevačica podsetila je na brojne hitove koji su obeležili njenu karijeru, koja kontinuirano i uspešno traje trideset tri godine.
- eventId: 934989
  start: 2026-10-23T12:30:00Z
  stop: 2026-10-23T13:00:00Z
  title: Sasvim prirodno
  subtitle: '"Sasvim prirodno" je dokumentarno putopisni serijal o prirodi, životinjama i ljudima koji žive sa prirodom.'
  description: Sasvim Prirodno je dokumentarno putopisni serijal o prirodi, životinjama i ljudima koji žive sa prirodom. Naš tim putuje Srbijom, Crnom Gorom, Balkanom i svetom. Bili smo na Islandu, Grenlandu, Svalbardu, u Sibiru, Laponiji, Norveškoj, Tadžikistanu, Kirgistanu, Kolskom poluostrvu, itd. Cilj nam je da kameru odnesemo na mesta na kojima je retko ili nikada pre bila, da damo glas onima koji se retko čuju, da zabeležimo predele koji se retko viđaju, ali pre svega da ispričamo priče o načinima života koji su u skladu sa prirodom. Kroz tradiciju i kulturu naroda najbolje se vidi neraskidiva veza između čoveka i sredine u kojoj živi. Naše priče su dokumentovane da vas podsećaju na tu vezu i da vam ne dozvole da se od prirode otuđite.
