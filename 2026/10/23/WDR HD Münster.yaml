  ageRating: 12
  description: 'Ein neuer Fall führt Bielefelder und Schmitz zu einer Aussteigersiedlung im Wald. Dort wurde die Leiche eines gewissen Robert Kohlmann gefunden. Er wurde erstochen, also besteht kein Zweifel daran, dass es sich um Mord handelt. Eine Sache ist aber höchst seltsam: Robert Kohlmann ist eigentlich bereits vor fünf Jahren verstorben. Laut der neuen Kollegin aus der Rechtsmedizin kann der Mord nicht länger als einen Tag her sein. Bei Familie Schmitz sorgen Diskussionen über Demokratie für Zündstoff. Klaus'' Enkelin Emiliana ist da mal so ganz anderer Ansicht als ihr Opa.'
