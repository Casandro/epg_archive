    * Wenn's drauf ankommt - Kronenmaki-Mädchen Amy, im Mai 2018 als erstes Kind von Amber und Clyde geboren, ist flügge.
    * Bereit für die Geburt? - Elefantenkuh Rani könnte täglich niederkommen, sich aber auch noch ein paar Wochen Zeit lassen. Bei Erstgebärenden weiß man das nie.
