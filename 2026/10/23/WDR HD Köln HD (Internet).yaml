  title: Neues aus dem Münchner Tierpark Hellabrunn (9/30)
  subtitle: Katta Niels braucht ganz viel Liebe
  description: 'Heute dreht es sich mehr als sonst ums Familienleben: In der einen Familie gibt es bald Nachwuchs, in der anderen hat der jüngste Spross Kummer und in der dritten herrscht nicht nur eitel Sonnenschein. Angefangen hat''s bei Katta Niels: Er wurde von seiner Gruppe verstoßen und lebt im Moment getrennt von ihr. Tierpflegerin Celina pflegt ihn voller Mitgefühl. Sie weiß auch, dass die Isolation Niels bedrückt und dass er in so einer Situation nicht gern allein sein will. Also sind Celinas Besuche bei dem kleinen Halbaffen besonders ausgiebig - und der weiß das sichtlich zu schätzen.'
- eventId: 1029719
  start: 2026-10-23T12:20:00Z
  stop: 2026-10-23T13:10:00Z
  title: Rentnercops (62)
  subtitle: Doppelt gestorben hält besser
  description: 'Ein neuer Fall führt Bielefelder und Schmitz zu einer Aussteigersiedlung im Wald. Dort wurde die Leiche eines gewissen Robert Kohlmann gefunden. Er wurde erstochen, also besteht kein Zweifel daran, dass es sich um Mord handelt. Eine Sache ist aber höchst seltsam: Robert Kohlmann ist eigentlich bereits vor fünf Jahren verstorben. Laut der neuen Kollegin aus der Rechtsmedizin kann der Mord nicht länger als einen Tag her sein. Bei Familie Schmitz sorgen Diskussionen über Demokratie für Zündstoff. Klaus'' Enkelin Emiliana ist da mal so ganz anderer Ansicht als ihr Opa.'
  ageRating: 12
  genre:
  - '16'
- eventId: 1029944
  start: 2026-10-23T13:10:00Z
  stop: 2026-10-23T14:00:00Z
  title: Rentnercops (63)
  subtitle: Am Haken
  description: 'Eine alte Frau wird mit einer Wunde am Hinterkopf tot in ihrer Wohnung aufgefunden. Das Sonderbare: Es wurde zum vermuteten Todeszeitpunkt ein Notruf von einer unbekannten Person zu der Adresse der Toten abgesetzt, außer der Leiche war aber niemand vor Ort. Währenddessen hat Polizeipräsident Plocher eine Teambuildingmaßnahme angeordnet, die nicht gerade auf Begeisterung bei der Belegschaft stößt: meditatives Angeln. Beim tatsächlichen Angelausflug ziehen die Rentnercops aber mehr als positive Energie an Land.'
  ageRating: 12
