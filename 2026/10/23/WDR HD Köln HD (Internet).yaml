  title: Durch die Wildnis - Das Abenteuer Deines Lebens (7/20)
  subtitle: Nordgriechenland
  description: Was für eine atemberaubende Aussicht! Die sechs sitzen nach dem Aufwachen am Eingang ihrer großen Höhle und sind ganz begeistert vom Ausblick auf Die umliegenden Berge und Täler. Daran werden sie sich noch lange erinnern. Leider können sie den Ausblick nicht lange genießen, denn Wildniscoach Tobi wartet schon. Um ihre Wanderetappe fortsetzen zu können, müssen sie heute ordentlich klettern. Es geht in schwindelerregende Höhe. Und zwei Abenteurer bekommen wackelige Knie.
- eventId: 1017926
  start: 2026-10-23T06:15:00Z
  stop: 2026-10-23T06:40:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (8/20)
  subtitle: Nordgriechenland
  description: Was tut man eigentlich, wenn sich ein Gruppenmitglied beim Klettern verletzt und nicht mehr selbständig absteigen kann? Genau das soll die Gruppe heute trainieren. Wildniscoach Tobi hat alles für die Rettungsmission vorbereitet, und die Abenteurer geben sich alle Mühe, die Situation so gut wie möglich zu bewältigen. Als dann ein Sturzregen über sie hereinbricht, wird die Aktion unvorhergesehen dramatisch.
