  title: Wer weiß denn sowas? (896)
  subtitle: 'Gäste: Christoph Maria Herbst und Annette Frier'
  description: 'Die Streitigkeiten zwischen dem Ex-Ehepaar Merz sind nach drei Staffeln der witzigen TV-Serie "Merz gegen Merz" erst mal beigelegt, doch auf der Theaterbühne lieferten sich die Schauspielerin Annette Frier und ihr kongenialer Gegenpart Christoph Maria Herbst in "Die Kunst, Recht zu behalten oder: Du mich auch!" gerade wieder schreiend komische Streitgespräche. Diese werden sie vermutlich gekonnt witzig fortsetzen, wenn sie am Donnerstag zum Ratewettstreit gegeneinander antreten.'
- eventId: 1021115
  start: 2026-10-23T08:25:00Z
  stop: 2026-10-23T09:10:00Z
  title: Mittendrin - Flughafen Frankfurt
  subtitle: 100 Jahre Lufthansa - Propeller, Piloten und Pillbox
  description: 'Von der offenen Fokker-Kabine 1926 bis zum Hightech-Jet. Lufthansa ist eine deutsche Jahrhundertgeschichte mit Höhen und Tiefen: Zweiter Weltkrieg, Nationalsozialismus, Entführung der Landshut, Vulkanausbruch in Island, Erstflug A380, Germanwings-Absturz, Corona-Pandemie, Streiks und vieles mehr. Heute steht sie zwischen Wettbewerb und Klimadruck. Ein packender Blick auf die Geschichte der größten Airline Deutschlands mit Zeitzeugen und beeindruckenden Flugzeugen von 1926 bis heute.'
- eventId: 1022274
  start: 2026-10-23T09:10:00Z
  stop: 2026-10-23T09:55:00Z
  title: Expedition in die Heimat
  subtitle: Schäferstündchen im Dreiländereck
  description: Sie sind süß und kuschelig und viele halten sie für dümmlich - oder essen sie. Was Schafe für die Menschen leisten, was sie für die Erhaltung der Landschaft und der Pflanzenwelt bedeuten, ist vielen leider nicht bewusst. Ganz genau wissen es nur die Schäfer*innen, doch von ihnen gibt es immer weniger. Vor allem die Berufs- und Wanderschäfer*innen verschwinden langsam. Ein paar von ihnen trifft SWR Moderatorin Anna Lena Dörr auf ihrer Reise ins Dreiländereck zwischen Luxemburg, Belgien und der Eifel. Als Wanderschäferin für einen Tag begleitet sie Florian Weber am Ufer der Our entlang.
- eventId: 1025867
  start: 2026-10-23T09:55:00Z
  stop: 2026-10-23T10:45:00Z
  title: Elefant, Tiger & Co. (858)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    * Die Löwen sind da! - Löwin Kigali hat fünf Jungtiere zur Welt gebracht.
    * Wenn's drauf ankommt - Kronenmaki-Mädchen Amy, im Mai 2018 als erstes Kind von Amber und Clyde geboren, ist flügge.
    * Bereit für die Geburt? - Elefantenkuh Rani könnte täglich niederkommen, sich aber auch noch ein paar Wochen Zeit lassen. Bei Erstgebärenden weiß man das nie.
    * Vor aller Augen - Schimpansen-Dame Kisha ist eine echte Überraschung geglückt: Mitten auf der Innenanlage hat sie einen kleinen Jungen zur Welt gebracht.
