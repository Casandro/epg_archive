  description: Hubert und Staller finden die Leiche von Leon Weißenbacher, einem offensichtlichen Tattoo-Liebhaber. Die letzte freie Stelle an seinem Körper ist mit einem großflächigen Pflaster abgeklebt, unter dem ein frisch tätowierter Drache prangt. Dr. Anja Licht fällt der erhöhte Blutzuckerspiegel des Toten auf. Für die Ärztin steht fest, dass er an einer Überdosis Insulin gestorben sein muss. Da an Leon Weißenbachers Körper keine Einstichstellen zu finden sind, fällt die Aufmerksamkeit schnell auf das neue Tattoo. Der Mörder muss ihm das Insulin mit der Farbe unter die Haut tätowiert haben.
