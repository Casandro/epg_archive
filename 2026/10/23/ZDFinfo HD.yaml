  title: Mysterien des Altertums - Im Reich der Toten
  subtitle: Portale ins Jenseits
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Geheimnisvolle Wächter-Sarkophage in Peru, unheimliche Hybride aus Menschen- und Tierknochen und ein rätselhafter Friedhof voller Kinderleichen. Wirklich nur ein Friedhof oder eine Opferstätte?

    Moderne Technik liefert Forscherinnen und Forschern Hinweise auf uralte Totenrituale. Ob im Kampf gefallen oder geopfert - die Verstorbenen dieser antiken Reiche wurden in Ehren gehalten. Heute geben uns ihre Gräber Aufschluss über den Glauben dieser alten Kulturen.
    HD-Produktion
