  description: |-
    Großbritannien 2023
    Ein Tempel des Todes oder der Durchgang zum Jenseits? Warum befinden sich unter der Maya-Pyramide "El Castillo" so viele Menschenopfer, und welche weiteren blutigen Geheimnisse birgt die Stätte?

    Die Forscher gehen auf Spurensuche: von den Cenoten, in denen die Maya den Göttern Menschen opferten, über eine geheimnisvolle Stätte in den Anden, wo Reliquien konserviert wurden, bis hin zu den aufwendigen Gräbern von Kriegern und Nomaden in der Steppe Asiens.
