  description: |-
    Großbritannien 2023
    Die Welt der Toten birgt erstaunliche Funde: das größte Grab der Geschichte und seine tödlichen Fallen, das Elixier des ewigen Lebens und das tragische Geheimnis der ältesten Mumien der Welt.

    Das Grab des chinesischen Herrschers Qin Shihuangdi ist bekannt für seine Wächterarmee aus Ton, doch es birgt gefährliche Hindernisse. Was haben der Ganges und ein verschollener Lebenstrank gemein? Und warum finden Forscher bei den Chinchorro Kinderleichen?
    HD-Produktion
