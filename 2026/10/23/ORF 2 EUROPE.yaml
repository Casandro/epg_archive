  title: Universum History
  subtitle: Der Untergang der Habsburger - Die Schlacht bei Königgrätz (1)
  description: |-
    Vor 160 Jahren erlitten die Habsburger eine ihrer schwersten Niederlagen: in der Schlacht bei Königgrätz, im heutigen Tschechien, stritten die Armeen von Österreich und Preußen um die Vorherrschaft in den deutschen Ländern. Der erste Teil der zweiteiligen "Universum History" Doku-Serie zeigt den Weg zum Konflikt, der zu einer Zeitenwende wurde. Preußen erklärt Österreich und seinen Verbündeten den Krieg. Aus weit entfernten Gebieten der Donaumonarchie eilen die Truppen zum Kriegsschauplatz in Böhmen zu einer Schlacht, die eine der größten des 19. Jahrhunderts werden sollte. Sie wird zu einer verheerenden Niederlage, die in der Folge zum Untergang der Habsburger führen wird.
    Buch & Regie: Fritz Kalties
    Koproduktion: Epofilm, ORF, ZDF/ARTE, CT
