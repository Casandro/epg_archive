  title: WeltWeit
  subtitle: Rechtsruck. Was, wenn die Mitte kippt?
  description: 'In immer mehr Ländern verlieren die Menschen das Vertrauen in die etablierte Politik. Das zeigt sich am deutlichsten an der Wahlurne. Ehemalige Großparteien schrumpfen zu politischen Randnotizen und meist sind es rechtspopulistische Parteien, die von dieser Entwicklung profitieren. Mit Verunsicherung und der Angst vor Migration, Kriminalität oder gesellschaftlichem Wandel wird Politik gemacht. Ihre Versprechen:  mehr Sicherheit und nationale Stärke. Die WeltWeit-Reporter:innen gehen den Fragen nach, warum rechte Botschaften so große Zustimmung finden, und welche Folgen das für das gesellschaftliche Zusammenleben hat? In Deutschland ist die AfD bei den Landtagswahlen zur stärksten politischen Kraft in drei Bundesländern aufgestiegen: Thüringen, Sachsen-Anhalt und Mecklenburg-Vorpommern. Mit ihrer migrationsfeindlichen Politik trifft sie auf breite Zustimmung ausgerechnet in einer Region, die wenig Zuwanderung hat und dringend Arbeitskräfte aus dem Ausland benötigt. Patrick A. Hafner trifft eine Familie, die aus dem Iran nach Deutschland gekommen ist, um sich hier ein Leben aufzubauen. Doch jetzt lässt sie der steigende Alltagsrassismus darüber nachdenken, erneut ihre Koffer zu packen. Bei einem AfD-Familienfest am "Tag der Deutschen Einheit" wird Hafner Zeuge davon, was passiert, wenn verbal versierte Influencer auf alkoholisierte Neonazis treffen. In Israel geht es bei den Wahlen am 27. Oktober um das politische Überleben von Langzeitpremier Benjamin Netanyahu. Der Terrorangriff der Hamas hat die politische Statik des Landes grundlegend erschüttert. Im traumatisierten Grenzgebiet zu Gaza dokumentiert David Kriegleder das Scheitern des einst linksliberalen Friedensversprechens und die Ernüchterung ehemaliger Brückenbauer. Gleichzeitig treibt eine junge Generation, die ohne Friedensprozess aufgewachsen ist und von permanentem Sicherheitsdruck geprägt wurde, den nationalreligiösen Diskurs voran, besonders in Jerusalem. Verstärkt wird diese Verhärtung durch Neu-Einwanderer, die vor dem wachsenden Antisemitismus nach Israel geflohen sind und die neue Kompromisslosigkeit aus Überzeugung mittragen: Eine Spurensuche nach den Treibern eines beispiellosen gesellschaftlichen Rechtsrucks. In Brasilien könnte die Stichwahl um das Präsidentenamt am 25. Oktober einen weiteren Rechtsruck in Südamerika bringen. Nach dem ersten Wahlgang liegt der rechtspopulistische Flávio Bolsonaro knapp vor dem linken Amtsinhaber Lula da Silva. Das Land ist tief gespalten. Lena Hager trifft in Rio de Janeiro Índio Magno, der nach einem Einbruch in sein Geschäft vor dem finanziellen Ruin steht. Seine Hoffnung liegt auf der von Bolsonaro angekündigten harten Law-and-Order-Politik. Gegen die steigende Kriminalität im Land vorzugehen, damit punktet der rechte Kandidat bei vielen. Anders als bei der Wahl von Jair Bolsonaro stehen die Evangelikalen nicht mehr geschlossen hinter seinem Sohn Flávio. Bei einem Gottesdienst spricht Hager mit Pastor Marco Davi de Oliveira, der sich aktiv'
