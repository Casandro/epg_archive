    (WH vom Donnerstag, 22.10.2026, 20:15 Uhr)
  description: |-
    In Kornburg bei Nürnberg steht das "Orgelstübchen" vor dem Aus. Inhaber Sascha ist trotz 20 Jahren Erfahrung am Herd völlig überfordert und die Kasse leer. Sternekoch Frank Rosin will helfen, doch seine ungeschönte Kritik trifft den verzweifelten Wirt hart. Als wäre der Druck nicht schon groß genug, überträgt Twitch-Star Zarbex das erste Testessen live an seine Community. Zerbricht Sascha an der Herausforderung oder kann Rosin ihn und sein Lokal noch retten?

    Koch: Frank Rosin
