  title: Złapać przemytnika 4 (odc. 4)
  subtitle: Służby z Denver rozpracowują sprawę ładunku MDMA, przemycanego do USA z Francji. Widzowie zobaczą, czy uda się przejąć narkotyki o wartości ośmiu milionów dolarów.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    Przemytnicy nigdy nie zwalniają obrotów, nawet podczas pandemii. Wybuch epidemii COVID-19 wymusił na służbach bezpieczeństwa zmianę strategii działania, ale Departament Bezpieczeństwa Krajowego nie może ignorować rosnącego napływu narkotyków, które docierają do USA przez południową granicę. Teraz, kiedy ruch turystyczny odzyskuje dawną dynamikę, agenci powracają na największe lotniska, porty i przejścia graniczne, żeby za wszelką cenę ukrócić działalność przestępczą.
