  title: II wojna światowa z kosmosu
  subtitle: Program specjalny poświęcony kluczowym momentom II wojny światowej. Dzięki grafice komputerowej widzowie będą mogli zobaczyć zdarzenia z wojny tak, jakby rejestrował je satelita.
  description: |-
    Tytuł oryginalny: WW2 from Space
    GB, 2012
    Reżyseria: Simon George
    Występują: Corey Johnson, Kevin Farrell, Geoffrey Wawro, Conrad Crane, Patrick W. Singer, Donald Stratton
    Ten dwugodzinny program odkrywa punkty zwrotne II wojny światowej z zupełnie nowej perspektywy. Dzięki nowoczesnej technologii widzowie przenoszą się ponad wydarzeniami, odkrywając nieznane aspekty historii. Ukazuje, jak naród, który w 1939 roku był daleko w tyle, sześć lat później stał się atomową superpotęgą. To opowieść o ukrytych tajemnicach, które zmieniały bieg świata.
