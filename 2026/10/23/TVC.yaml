  title: II wojna światowa z kosmosu
  subtitle: Program specjalny poświęcony kluczowym momentom II wojny światowej. Dzięki grafice komputerowej widzowie będą mogli zobaczyć zdarzenia z wojny tak, jakby rejestrował je satelita.
  description: |-
    Tytuł oryginalny: WW2 from Space
    GB, 2012
    Reżyseria: Simon George
    Występują: Corey Johnson, Kevin Farrell, Geoffrey Wawro, Conrad Crane, Patrick W. Singer, Donald Stratton
    Ten dwugodzinny program odkrywa punkty zwrotne II wojny światowej z zupełnie nowej perspektywy. Dzięki nowoczesnej technologii widzowie przenoszą się ponad wydarzeniami, odkrywając nieznane aspekty historii. Ukazuje, jak naród, który w 1939 roku był daleko w tyle, sześć lat później stał się atomową superpotęgą. To opowieść o ukrytych tajemnicach, które zmieniały bieg świata.
  genre:
  - '35'
- eventId: 855400
  start: 2026-10-23T10:10:00Z
  stop: 2026-10-23T12:05:00Z
  title: Historia świata w dwie godziny
  subtitle: Dokument przedstawia historię świata - od Wielkiego Wybuchu, aż do czasów współczesnych.
  description: |-
    Tytuł oryginalny: History of the World in 2 Hours
    US, 2011
    Reżyseria: Douglas Cohen
    Występują: Alex Filippenko, Peter Ward, Clifford V. Johnson, Jonathan Markley, Russell Shapiro, Glen MacDonald
    Program zabiera w podróż przez 14 miliardów lat historii planety, odkrywając kluczowe momenty, które łączą przeszłość z teraźniejszością. Z perspektywy naukowej ukazuje narodziny życia, rozwój cywilizacji oraz powiązania między różnymi dziedzinami wiedzy, tworząc spójną narrację o niezatartej historii Ziemi i ludzkości.
  ageRating: 12
  genre:
  - '35'
- eventId: 855401
