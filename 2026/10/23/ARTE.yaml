  title: Un opéra pour un empire
  subtitle: Le récit de la construction de l'opéra Garnier, oeuvre d'art édifiée par l'architecte qui lui donna son nom, au cours d'un tumultueux chantier de quinze ans.
  genre:
  - '116'
  description: 'Paris, 1858. Après avoir échappé à un attentat devant l''opéra Le Peletier, Napoléon III décide de doter sa capitale d''un écrin plus sûr et plus prestigieux. Contre toute attente, un jeune inconnu, l''architecte Charles Garnier, remporte le concours, damant le pion à des sommités comme Eugène Viollet-le-Duc. Garnier envisage son théâtre comme une oeuvre d''art total, convoquant peinture, sculpture et science des volumes. Novateur, l''architecte étaie ce gigantesque théâtre d''une armature de métal, matériau à l''époque peu utilisé. Ce chantier pharaonique va durer quinze ans. Après deux interruptions dues à la guerre de 1870 et à la Commune, la IIIe République décide de reprendre les travaux, afin de doter Paris d''un opéra et de se parer du faste impérial. Réalisateur: Patrick Cabouat. Des acteurs: Micky Sébastian (commentaire), Damien Roussineau (lui-même), Mathias Auclair (lui-même), Bertrand Lemoine (lui-même), Xavier Mauduit (lui-même) (2021)'
