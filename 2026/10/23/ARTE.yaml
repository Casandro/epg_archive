  title: Le rêve du Nouveau Monde
  subtitle: Partir S01 E01. De 1840 à la veille de la Seconde Guerre mondiale, de nombreuses vagues d'immigration ont touché l'Amérique ; les troubles en Europe en 1848 ont provoqué l'une d'entre elles.
  ageRating: 6
  genre:
  - '32'
  description: 'Carl Schurz a fait partie des nombreux Allemands qui ont émigré vers les États-Unis pour des raisons politiques. Il a fui son pays après l''échec de la révolution de 1848, au cours de laquelle les étudiants avaient exigé la tenue d''élections libres. Si son destin s''est révélé extraordinaire - il deviendra membre du cabinet du président américain Rutherford B. Hayes -, il est aussi unique. La plupart des migrants ayant tenté leur chance dans le Nouveau Monde connaîtront en effet une vie difficile, économisant pour acquérir des terres arables vendues par le gouvernement et mourant souvent sans le sou. La découverte d''or en Californie, qui attirera beaucoup de ces misérables, ne fera qu''empirer leur situation générale. Le rêve américain "L''homme est un animal migrateur", résume Drew Keeling, l''un des historiens interrogés dans cette ambitieuse fresque documentaire. Entre 1840 et 1939, 55 millions d''Européens quittent leurs patries d''origine pour gagner le continent américain, du nord au sud. Certains feront fortune, d''autres perdront tout ce qu''ils possèdent. Kai Christiansen raconte ce siècle fondateur en retraçant le destin d''une vingtaine de femmes et d''hommes partis à la poursuite du rêve américain, à travers des scènes de reconstitution soignées et d''émouvantes archives. Réalisateur: Kai Christiansen. Des acteurs: Isabelle Barth (Margarethe Schurz), Fabian Busch (Carl Schurz), Samia Muriel Chancrin (Victoire Lacasse), Nicola Chapman (Eliza P. Heaton), Francis Fulton-Smith (Richard Roberts) (2016)'
- eventId: 846761
  start: 2026-10-23T04:00:00Z
  stop: 2026-10-23T04:55:00Z
  title: Le rêve du Nouveau Monde
  subtitle: 'La traversée S01 E02. L''émigration vers l''Amérique : l''industrialisation provoque l''exode en prolétarisant les populations, et facilite la traversée, notamment après l''apparition des navires à vapeur.'
  ageRating: 6
  genre:
  - '32'
  description: 'En 1838, le navire anglais Sirius est le premier à franchir l''Atlantique à la vapeur, sans jamais utiliser ses voiles. La modernisation des bateaux accélère l''émigration vers les États-Unis, d''autant qu''en parallèle l''apparition du chemin de fer et l''industrialisation des villes provoquent dans un pays comme l''Allemagne d''importants mouvements de population, qui annoncent l''exode rural. Profitant de l''essor de l''industrie, les paysans deviennent ouvriers, sans pour autant jouir d''avancées sociales. Le rêve américain "L''homme est un animal migrateur", résume Drew Keeling, l''un des historiens interrogés dans cette ambitieuse fresque documentaire. Entre 1840 et 1939, 55 millions d''Européens quittent leurs patries d''origine pour gagner le continent américain, du nord au sud. Certains feront fortune, d''autres perdront tout ce qu''ils possèdent. Kai Christiansen raconte ce siècle fondateur en retraçant le destin d''une vingtaine de femmes et d''hommes partis à la poursuite du rêve américain, à travers des scènes de reconstitution soignées et d''émouvantes archives. Réalisateur: Kai Christiansen. Des acteurs: Isabelle Barth (Margarethe Schurz), Fabian Busch (Carl Schurz), Samia Muriel Chancrin (Victoire Lacasse), Nicola Chapman (Eliza P. Heaton), Francis Fulton-Smith (Richard Roberts) (2016)'
