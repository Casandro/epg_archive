  title: Leopard, Seebär & Co. (100)
  subtitle: Geschichten aus dem Tierpark Hagenbeck in Hamburg
  description: |-
    Fünf Löwen fünf Wochen lang unter einem Dach - da müffelt es langsam wie im Pumakäfig. Weil die vier Jungtiere dringend frisches "Bettzeug" brauchen, trennt Tony Kershaw die Mutter Tembesi das erste Mal von ihren Jungen. Dann heißt es: Saubermachen im Akkord. Unter fünffachem Gefauche ist das nichts für schwache Nerven.
    Tobias Taraba hat mehr mit einer Denksportaufgabe zu kämpfen: Wie misst man vier bis sechs Meter hohe Giraffen, wenn einem nur zwei Meter lange Zollstöcke zur Verfügung stehen?
    So richtig sportlich wird es aber erst für Dave Nelde bei den Tharziegen und für Martin Kersten bei den Mandrill-Affen.
