- eventId: 1026397
  start: 2026-10-23T10:25:00Z
  stop: 2026-10-23T11:10:00Z
  title: In aller Freundschaft (333)
  subtitle: Falsche Ziele
  description: |-
    Die aufstrebende Boxerin Paula Hinrich knickt vor dem ersten großen Kampf um - Knöchelfraktur. Mit ihrem Vater Rolf, einem Ex-Boxer, der sie als Trainer betreut, entscheidet sich Paula für eine Operation, um schnell wieder trainieren zu können. Im Gegensatz zu Paulas Sparringspartner Axel, der dafür plädiert, den Kampf abzusagen, hält Rolf die verkürzte Vorbereitungszeit für genug. Eine Thrombose in Paulas Bein droht die Pläne endgültig scheitern zu lassen.
    Otto und Martin Stein wollen endlich bei einem Kanurennen gewinnen, an dem sie Jahr für Jahr teilnehmen. Pia Heilmann überredet ihren Mann Roland, ebenfalls mitzupaddeln.
  ageRating: 6
- eventId: 1027194
  start: 2026-10-23T11:10:00Z
  stop: 2026-10-23T12:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (275)
  subtitle: Durchhalten
  description: "Assistenzärztin Rebecca Krieger und Oberarzt Dr. Marc Lindner kümmern sich um Jörn Klaußner, der von seiner Tochter überredet wurde, Gefühlsstörungen im Arm abklären zu lassen. Das Ergebnis ist eindeutig: ein Hirntumor. Jörn stimmt zu, den Tumor entfernen zu lassen, verweigert aber die postoperative Strahlentherapie.\nDr. Leyla Sherbaz' Plan, ihren Mann Dr. Ben Ahlbeck so gut es geht zu entlasten, wird zunichtegemacht, als Rayas Babysitterin eingeliefert wird. \nMatteo Moreau ist erstaunt, als ihm die Taxifahrerin Viktoria Stadler ihre Bewerbungsmappe in die Hand drückt, inklusive des gerade abgeholten Abschlusszeugnisses in Medizin."
  ageRating: 6
- eventId: 1029044
  start: 2026-10-23T12:00:00Z
  stop: 2026-10-23T12:30:00Z
  title: 'Die Nordreportage: Zoll - Einsatz an der Westküste'
  description: 'Sarah und Christoph arbeiten als Team beim Zoll. Ihr Einsatzgebiet: Die Westküste Schleswig-Holsteins, von Wedel bis zur dänischen Grenze. Das Besondere an dieser Zolleinheit: Sie kontrollieren alles - Pkw, Lkw, Schiffe und Flugzeuge. Dabei sind sie unterschiedlichen Schmuggelwaren auf der Spur: Zigaretten, Drogen, Alkohol und Gold. Wer beim Zoll arbeitet, sollte den richtigen Riecher haben und Verdächtiges in der Masse erkennen. Das ist keine einfache Aufgabe.'
- eventId: 1029755
  start: 2026-10-23T12:30:00Z
  stop: 2026-10-23T13:00:00Z
  title: 'Die Nordreportage: Den Schmugglern auf der Spur'
  subtitle: Unterwegs mit dem Zoll am Hamburg Airport
  description: Etwa 17 Millionen Reisende nutzen Hamburgs Flughafen jedes Jahr. Die rund 160 Zöllnerinnen und Zöllner sorgen dafür, dass nichts eingeschmuggelt wird. Dabei kommen Zollhunde und hochmoderne Technik zum Einsatz, mit deren Hilfe die Beamten zum Beispiel tierische Produkte oder Sprengstoff aufspüren können. Die Zöllner am sogenannten Grünen Kanal haben weder ein echtes noch ein elektronisches "Näschen" für nicht angemeldete Waren. Sie müssen sich auf ihre Erfahrung verlassen, wenn sie Reisende bitten, ihr Gepäck zu öffnen.
  genre:
  - '144'
