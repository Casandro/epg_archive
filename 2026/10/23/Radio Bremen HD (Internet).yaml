  title: WaPo Bodensee (33)
  subtitle: Auf Messers Schneide
  description: Feuer an Bord! Ausgerechnet da, wo der Bodensee am tiefsten ist, muss die Millionenerbin Marita Schiller ihre Jacht mit der Schwimmweste fluchtartig verlassen. Mit ihrem Boot versinkt auch ein teures Geschmeide, das die Frau in einem Tresor an Bord aufbewahrt hatte. Das gibt sie zumindest bei der Wasserpolizei zu Protokoll, die die hilflose Frau aus dem Bodensee fischt. Doch schon bald kommen Nele Fehrenbach und ihrem Kollegen Paul Schott Zweifel. Denn die angebliche Millionärin hatte Geldsorgen und den Schmuck erst kurz zuvor versichert.
