  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Ronja von Rönne, Schriftstellerin'
  description: 'Ronja von Rönne erzählt von der Liebe, wie sie wirklich sein kann: komisch, grausam und zärtlich, aber manchmal auch ziemlich manipulativ. All das kommt in ihrem neuen Roman "Alles Liebe" vor. Dass Liebe trotz allem funktionieren kann, weiß sie aus eigener Erfahrung: Sie hat den Mann aus ihrem einzigen Tinder-Date geheiratet. Geboren 1992 in Berlin und aufgewachsen in einem oberbayerischen Dorf, machte sich Ronja von Rönne zunächst mit dem Blog "Sudelheft" und provokanten Texten einen Namen.'
