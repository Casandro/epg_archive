  title: 'Die Nordreportage: Zoll - Einsatz an der Westküste'
  description: 'Sarah und Christoph arbeiten als Team beim Zoll. Ihr Einsatzgebiet: Die Westküste Schleswig-Holsteins, von Wedel bis zur dänischen Grenze. Das Besondere an dieser Zolleinheit: Sie kontrollieren alles - Pkw, Lkw, Schiffe und Flugzeuge. Dabei sind sie unterschiedlichen Schmuggelwaren auf der Spur: Zigaretten, Drogen, Alkohol und Gold. Wer beim Zoll arbeitet, sollte den richtigen Riecher haben und Verdächtiges in der Masse erkennen. Das ist keine einfache Aufgabe.'
- eventId: 1029755
  start: 2026-10-23T12:30:00Z
  stop: 2026-10-23T13:00:00Z
  title: 'Die Nordreportage: Den Schmugglern auf der Spur'
  subtitle: Unterwegs mit dem Zoll am Hamburg Airport
  description: Etwa 17 Millionen Reisende nutzen Hamburgs Flughafen jedes Jahr. Die rund 160 Zöllnerinnen und Zöllner sorgen dafür, dass nichts eingeschmuggelt wird. Dabei kommen Zollhunde und hochmoderne Technik zum Einsatz, mit deren Hilfe die Beamten zum Beispiel tierische Produkte oder Sprengstoff aufspüren können. Die Zöllner am sogenannten Grünen Kanal haben weder ein echtes noch ein elektronisches "Näschen" für nicht angemeldete Waren. Sie müssen sich auf ihre Erfahrung verlassen, wenn sie Reisende bitten, ihr Gepäck zu öffnen.
  genre:
  - '144'
