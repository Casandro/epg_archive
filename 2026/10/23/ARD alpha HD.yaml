  subtitle: Wartet eine zweite Erde im All?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Es gibt keinen Planet B! " - dieser Satz ist immer wieder auf Klimademos zu lesen. Doch was, wenn unser Heimatplanet eines Tages unbewohnbar wird? Gibt es wirklich keine zweite Erde im Universum, die uns Zuflucht bieten könnte? Die Astronomie ist dieser Frage auf der Spur - und näher an der Antwort als je zuvor.'
