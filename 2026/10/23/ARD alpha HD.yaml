  title: 'alpha-retro: Ich bin ein Typ (1969)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein Film von 1969 über die Jugend der späten 60er-Jahre in ihrer eigenen und dennoch manipulierten Welt. Der Film analysiert aus der Perspektive von 1969 diese Manipulation am Beispiel von drei damals sehr bekannten und umsatzstarken deutschen Jugendmagazinen: "Bravo", "Twen" und "Underground". Aus dem Bericht wird klar, dass es auch damals schon "die" Jugend nicht gab sondern ganz verschiedene Gruppierungen oder - aus marketingtechnischer Sicht -  völlig unterschiedliche Zielgruppen.'
