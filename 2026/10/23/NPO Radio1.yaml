  title: Nooit Meer Slapen
  subtitle: Femke van der Laan ontvangt een inspirerende gast uit de kunst, cultuur of actualiteit, die vertelt over werk & leven. Nooit Meer Slapen is hét nachtelijke cultuurprogramma van de VPRO.
  description: Andrea Vreede is journalist. Ze studeerde Klassieke Talen en Mediterrane Archeologie aan de Rijksuniversiteit Groningen. In 1994 vestigde ze zich in Rome. Tien jaar lang was ze voor het NOS Journaal correspondent voor Italië én het Vaticaan, tegenwoordig richt ze zich als correspondent alleen nog op het Vaticaan. Ze schreef de boeken "De magie van Rome. Wandelingen door de eeuwen heen" en 'Super Mario Monti, de professor die Italië en de euro moest redden'. In haar nieuwe boek "Onze vrouw in het Vaticaan" schrijft ze over de drie conclaven die ze voor de NOS mocht verslaan en de vier pausen die ze in die tijd heeft meegemaakt. Ellen Deckwitz gaat met Andrea Vreede in gesprek. (2026)
