  subtitle: Ben je op zoek naar luistertips? Heb je alle afleveringen van de "Deventer Mediazaak" en de "Brand in het Landhuis" al gehoord en ben je op zoek naar nieuwe parels op podcastgebied? De redding is nabij. VINK is dé podcastgids van Nederland!
  description: Ben je op zoek naar luistertips? Heb je alle afleveringen van de "Deventer Mediazaak" en de "Brand in het Landhuis" al gehoord en ben je op zoek naar nieuwe parels op podcastgebied? De redding is nabij. VINK is dé podcastgids van Nederland! NPO Radio 1-presentator Mischa Blok nodigt twee podcastmakers uit die een kijkje geven achter de schermen. Hoe maak je eigenlijk een podcast? Beide gasten tippen bovendien een serie waaraan zij helemaal verslingerd zijn, en ook Mischa komt met een aanbeveling. (2026)
