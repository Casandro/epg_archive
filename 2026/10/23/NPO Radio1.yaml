  description: Elke week duiken Maaike Timmerman en Noa van Oostrom in de rauwe realiteit van misdaad in Nederland. Vanuit de regio graven ze dieper naar de bredere patronen en trends die achter de headlines schuilgaan. "Het Misdaadbureau" presenteert niet alleen de resultaten van grondig onderzoek, maar brengt ook een persoonlijk verhaal van iemand die er middenin zit. Naast het programma verschijnt er ook wekelijk een podcast van Het Misdaadbureau in je favoriete podcast-app. (2026)
