  title: Kultur in NIEDERBAYERN vom 23.10.2026
  subtitle: Von allen Welten, die der Mensch erschaffen hat, ist die der Bücher die Gewaltigste. Diesem Zitat Heinrich Heines können auch Helmut Degenhart und Tina Bauer beim Blättern durch Neues der Bücherecke nur zustimmen.
