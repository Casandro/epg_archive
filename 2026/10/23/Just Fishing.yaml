  title: Meer-/Seeforellen
  subtitle: Meer-/Seeforellen
  description: Beim Meer- bzw. Seeforellenangeln spricht man bekanntlich ja vom Fisch der 1000 Würfe. Die Angelei auf diese Silberbarren gleicht sich stark. Lange Ruten, Weitwurfköder, und der glaube an den nächsten Biss machen die Faszination perfekt. Zunächst versuchen wir der Ostsee eine Meerforelle zu entlocken, aber aufgrund unerwarteter Umstände gestaltet sich dieses Unterfangen deutlich schwieriger als gedacht. Kurze Zeit später und 1000 Kilometer weiter südlich geht es jedoch sofort zur Sache und die Fische haben richtig Bock auf unsere sinkenden Stickbaits. DE 2022
- eventId: 951071
  start: 2026-10-23T01:10:00Z
  stop: 2026-10-23T01:26:00Z
  title: Big Bass Dreams Italy
  subtitle: Big Bass Dreams Italy
  description: Prespawn bezeichnet das angeln kurz vor der Laichzeit der Schwarzbarsche. Dies ist absolutes Neuland für uns und wir haben wirklich keinen Plan von dieser Materie! Wo stehen die Fische? Welche Köder funktionieren? Was sind die besten Strukturen? Diese und viele weitere Fragen schwirren in unseren Köpfen umher! Nach der ersten Ausfahrt mit dem Belly Boat kommt absolute Ernüchterung, keinen Fisch gesehen, keinen Biss, sprich eine absolute Nullrunde. Doch dann geschieht das scheinbar Unmögliche, auf dem Rückweg zum Camp machen wir einen kurzen Abstecher. Was dann passiert seht ihr im Film! DE 2022
- eventId: 951072
