- eventId: 951111
  start: 2026-10-23T17:50:00Z
  stop: 2026-10-23T18:10:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Bahrain mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Bahrain mit Eva Habermann
  description: Bahrain, das Königreich im Osten der Arabischen Halbinsel ist das Reiseziel der Schauspielerin Eva Habermann. Sie führt uns über die traditionellen  Märkte, die Souks von Manama und Muharraq. Bis heute sind Perlen ein begehrtes Handelsgut im Königreich. Die Perlen werden aus Muschelbänken vor der Küste geerntet, zu Manufakturen gebracht und zu hochpreisigen Schmuckstücken verarbeitet. Das schaut sich Eva Habermann genauer an und begleitet Perlentaucher dorthin, wo sie aus den Fluten des Arabischen Golfs gefischt werden. Bahrain hat sich auch einen Namen als Austragungsort in der Formel 1 gemacht. Beim Besuch des Parcours nutzt Eva Habermann die Gunst der Stunde und prüft Teile der Streckenführung im Go-Kart. Denn die Anlage lockt mit vielen zusätzlichen Rennsport-Veranstaltungen zahllose Automobilsport-Fans aus aller Welt an. Auf ihren Streifzügen lernt  die Schauspielerin auch noch eine Menge über Wesen und Zucht der Araber-Pferde.. DE 2013
