  title: VIP Trip - Prominente auf Reisen 6 - Kissimmee, Punta Gorda & Englewood Beach mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 6 - Kissimmee, Punta Gorda & Englewood Beach mit Richy Müller
  description: In dieser Reisereportage reisen wir nach Florida. Erstes Ziel unseres prominenten Reiseleiters Richy Müller ist Kissimmee. In der Region südlich von Orlando besucht der Stuttgarter Tatort-Kommissar das wunderschöne Celebration. Die kleine Stadt ist vor gut 50 Jahren als mögliche Erweiterung des nahegelegenen Walt Disney World Resorts erbaut und dann später privatisiert worden. Bei einer Kanutour können Richy und sein Team Alligatoren in freier Wildbahn beobachten. Mehr über die Tiere Floridas erfährt er dann im Naturpark "Wild Florida". Dort steht auch eine Fahrt mit einem sogenannten "Airboat" durch die Sumpflandschaften auf dem Programm. Zum Abschluss erklärt Richy Müller, warum Kissimmee auch Ferienhaus-Hauptstadt der Welt genannt wird und gewährt uns einen Blick in sein zeitweiliges Quartier. Der zweite Teil seiner Reise führt Richy Müller an die Golfküste nach Punta Gorda und Englewood Beach. Sein erster Programmpunkt ist ein Ausflug zum Hochseeangeln. Der umfangreiche Fang wird anschließend in einem der besten Fischrestaurants der Region fachmännisch zubereitet und serviert. Am nächsten Tag geht es auf die nahe gelegene Babcock-Ranch. Auf einer Tour durch das weitläufige Gelände lernt der Schauspieler viel über die einheimische Tier- und Pflanzenwelt. Danach erkundet er den historischen Teil Punta Gordas mit seinen schönen alten Gebäuden. Außerdem beobachtet Richy Müller bei einer Bootstour durch die Mangrovengebiete von Englewood Beach Alligatoren und Seekühe, die dort friedlich zusammenleben. US 2024
- eventId: 951050
  start: 2026-10-23T07:35:00Z
  stop: 2026-10-23T07:55:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Chile mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 4 - Chile mit Jürgen Heinrich
  description: 'VIP Trip - Prominente auf Reisen 4: Begeben Sie sich mit VIP Trip auf eine Reise in ein Land der Vielfalt. Chile mag zwar ein schmales Land sein, doch zieht es sich mit einer Länge von 4300 Kilometern durch verschiedene Klimazonen an der südamerikanischen Pazifikküste: Von den Gletschern der Anden zu fast unberührten Stränden, von Küstenstädten durch  Regenwälder bis hin zur Atacama-Wüste. In Chile ist für jeden was dabei. Begleiten Sie Jürgen Heinrich bei seiner Reise durch das "Preußen Südamerikas".  Der Schauspieler begibt sich auf Entdeckungstour und folgt dabei den Spuren deutscher Einwanderer. Es stellt sich heraus: Chile ist ein Land mit großer kultureller Vielfalt, was allein schon an der chilenischen Küche ablesbar ist. In der Steppe Patagoniens trifft Jürgen Heinrich auf die legendären Gauchos, die Rinderhirten Südamerikas. Sie weisen ihm den Weg durch eine grandiose Natur, zu kargen, aber pittoresken Landschaften sowie zu entlegenen Wasserfällen. Auf den Pfaden deutscher Einwanderer gelangt der Schauspieler schließlich nach Puntas Arenas, in die wohl südlichste Großstadt der Welt. Die Hafenstadt ist Ausgangspunkt für Expeditionen in die Weiten Patagoniens und in die Antarktis. DE 2013'
- eventId: 951075
  start: 2026-10-23T07:55:00Z
  stop: 2026-10-23T08:15:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Bahrain mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Bahrain mit Eva Habermann
  description: Bahrain, das Königreich im Osten der Arabischen Halbinsel ist das Reiseziel der Schauspielerin Eva Habermann. Sie führt uns über die traditionellen  Märkte, die Souks von Manama und Muharraq. Bis heute sind Perlen ein begehrtes Handelsgut im Königreich. Die Perlen werden aus Muschelbänken vor der Küste geerntet, zu Manufakturen gebracht und zu hochpreisigen Schmuckstücken verarbeitet. Das schaut sich Eva Habermann genauer an und begleitet Perlentaucher dorthin, wo sie aus den Fluten des Arabischen Golfs gefischt werden. Bahrain hat sich auch einen Namen als Austragungsort in der Formel 1 gemacht. Beim Besuch des Parcours nutzt Eva Habermann die Gunst der Stunde und prüft Teile der Streckenführung im Go-Kart. Denn die Anlage lockt mit vielen zusätzlichen Rennsport-Veranstaltungen zahllose Automobilsport-Fans aus aller Welt an. Auf ihren Streifzügen lernt  die Schauspielerin auch noch eine Menge über Wesen und Zucht der Araber-Pferde.. DE 2013
