  title: Der Südwesten von oben - Unsere Berge
  subtitle: Der Südwesten von oben - Unsere Berge
  description: 'Über die Hälfte des deutschen Südwestens formt sich aus Berg-Plateaus und Mittelgebirgen und zeigt dabei die unterschiedlichsten Gesichter. Der Entdeckungsflug beginnt in der Eifel, wo Vulkanausbrüche gewaltige Krater auftürmten. Der Regen der Jahrtausende hat sie in idyllische Seen verwandelt. Der Kraterrand eignet sich hervorragend für die Abflüge von Axel Kalenborn. Für den Trierer Gleitschirmflieger kann nichts entspannender sein als die Welt aus der Vogelperspektive zu erkunden. Die Reise führt entlang der Weinhänge der Mosel ins Mittelrheintal, wo der Hunsrück steil zum Rhein abfällt. Um die meistbefahrene Güter-Schienentrasse Europas vor Steinschlag zu schützen, werden Ziegen in die Hänge getrieben. Die Hirtin Myriam Dieterich schickt ihre Herde bei Oberwesel selbst in die steilsten Hänge. Über den Hunsrück geht die Reise ins Saarland. Hier gewinnen Bergleute wertvolles Quarzit. Saaraufwärts geht es in den Pfälzerwald, wo ein für die Wissenschaft errichteter Turm aus Holz das europaweit größte zusammenhängende Waldgebiet überragt. In der Höhe erforscht Alexandra Fischer-Pardow die wundersame Welt der Baumkronen. Einige Kilometer weiter, in Bad Dürkheim, wird Pfälzer Eiche zu Barriquefässern verarbeitet. Hinauf geht es auf die Schwäbische Alb mit ihrem verschlungenen Höhlensystem. Es ist das Reich von Hans-Martin Luz, der bewaffnet mit einer Stirnlampe 25.000 Jahre Erdgeschichte durchklettert. Währenddessen jagt Landwirt Willy Wolf 300 Wasserbüffel mit einem donnernden "Yeehaw" über die Alb. Der Schwarzwald ist das höchste Mittelgebirge Deutschlands und zieht tausende Touristen an. Ramona Straub trainiert zu jeder Jahreszeit: Die Hinterzartenerin gehört zu Deutschlands Skispringer-Nachwuchs. Ein Schwarzwälder Erfolgsmodell mit langer Tradition ist die Kuckucksuhr. Die Reise endet am Kaiserstuhl. Auch hier haben vulkanische Aktivitäten sanfte Mittelgebirge geschaffen - und zugleich den sonnigsten Flecken Deutschlands, ein Paradies für Winzer. DE 2014'
