  audiodesc: true
  description: 'Manche Tage streicht man besser aus dem Kalender. Ausgerechnet an einem solchen Tag muss Daniel seinen Vater zu Grabe tragen. Während er verkrampft an der Trauerrede feilt, muss er entsetzt feststellen, dass der Leichnam im Sarg der falsche ist. Diese "Panne" bleibt nicht der letzte peinliche Zwischenfall: Onkel Alfie, ein meckernder Greis im Rollstuhl, wartet stundenlang vor dem Altersheim auf seine Abholung. Und Daniels Bruder Robert, ein Starautor, von dem alle Anwesenden die Trauerrede erwarten, weigert sich, die Hälfte der Beerdigungskosten zu übernehmen.'
