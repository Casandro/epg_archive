  description: 'Klaas Hinrichsen, ein Kapitän a.D., bricht im Hausflur vor Schwester Yvonnes Wohnungstür zusammen. Er wird unter Lebensgefahr in die Sachsenklinik eingeliefert. Dass Klaas jeder Frage nach seinen persönlichen Lebensumständen ausweicht, erschwert seinem behandelnden Arzt Dr. Martin Stein eine genaue Diagnose. Erst nach und nach formt sich ein Bild und es wird klar, dass der harsche Seebär durch ein Erlebnis schwer traumatisiert zu sein scheint. Martin folgt einer außergewöhnlichen diagnostischen Spur: Hinrichsen könnte an einem "Gebrochenen-Herz-Syndrom" leiden. Als Martin ihm das unterbreitet, will Klaas entlassen werden.'
