  description: 'Die hochschwangere Lisa Kreuzer wird in Begleitung ihres Lebensgefährten Hans Kaiser ins Klinikum eingeliefert. Das Kind muss sofort per Not-Kaiserschnitt geholt werden. Dabei stellen Leyla und Ben eine Neugeborenengelbsucht fest. Doch weder von Lisa noch von Hans kann diese erblich bedingte Krankheit stammen. Allein der leibliche Vater kommt dafür infrage. - Dr. Theresa Koshka ist am Tag vor der Zwischenprüfung Dr. Moreau zugeteilt: Gemeinsam behandeln sie den chaotischen Tino Thölsen. - Dr. Philipp Brentano hat Wort gehalten: Er überrascht Ben Ahlbeck mit einer neuen Prothese! Bald wird er endlich wieder schmerzfrei laufen.'
