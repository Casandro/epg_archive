  title: Mise au point
  description: |-
    (Suisse Romande-2026)  - Guy Parmelin : Succession story Qui remplacera le conseiller fédéral vaudois ? À l'UDC, les Romands se mobilisent et la genevoise Céline Amaudruz se prépare, reste encore à prouver à l'échelle nationale que la question romande est vraiment d'importance, c'est le reportage de la semaine.
     - USA : point de bascule L'équilibrisme des élections de mi-mandat qui pourraient faire basculer le congrès, à 2 semaines d'un scrutin qui divise toujours plus les Américaines et Américains, avec de nombreuses incidences pour le monde entier, nous irons dans le Colorado où certains Républicains regrettent d'avoir voté Trump
     - GTA : le jeu vidéo qui change les règles C'est le poids lourd de l'industrie du jeu vidéo qui elle-même explose les économies du divertissement, GTA est aussi le premier jeu qu'on ne pourra pas posséder physiquement. Une dématérialisation qui fâche le public et risque de s'étendre à tous les domaines, reportage.
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
