  title: Objectif Monde L'hebdo
  description: |-
    Un animal sauvage dans son salon : le nouveau trafic illégal Le trafic des animaux sauvages de compagnie gagne du terrain, alimenté par des vidéos virales sur les réseaux sociaux qui banalisent la détention d'espèces exotiques. Le Sikypark, un refuge suisse, a recueilli plus de 600 animaux abandonnés : tigres, suricates, loups hybrides, perroquets rares... Derrière cette mode se cache un commerce illégal et florissant : élevages cruels et maltraitants, consanguinité chronique, chattes domestiques sacrifiées pour produire des hybrides de luxe, loups vendus avec de faux papiers, reptiles affamés dans des foires... Un reportage de Laurin Merz diffusé dans le magazine Temps Présent sur la RTS.
     (Suisse Romande-2026)
  genre:
