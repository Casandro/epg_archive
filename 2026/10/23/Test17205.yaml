  title: Passe-moi les jumelles
  description: "\"Audio description\"  - Le boisselier des Bois Dans son atelier centenaire des Franches-Montagnes, Philippe Boichat fait renaître les gestes oubliés des boisseliers, ces artisans qui façonnaient seilles, cuves et cercles à fromage. \n - Solex un jour, Solex toujours On l'appelait « le vélo qui roule tout seul»! 80 ans après sa création, le mythique Solex a toujours ses afficionados fidèles et enthousiastes. «Les K'Bolés du Solex » sont les véritables gardiens de ce patrimoine mécanique à la frontière franco-suisse."
