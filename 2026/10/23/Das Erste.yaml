  description: "Eine Serie von Raubüberfällen in Gotlands Hauptstadt, Gerüchte über \"fremdländische\" Täter und medial befeuerte Vorwürfe gegen die Polizei - Kommissarin Maria Wern steht im letzten Film der neuen Staffel massiv unter Druck. Hauptdarstellerin Eva Röse zeigt bei dem aktuellen Fall nicht nur die kriminalistische Brillanz der Titelheldin, sondern auch ihre moralisch gefestigte Haltung. Um die ganze Wahrheit ans Licht zu bringen, legt sie sich sogar mit dem Establishment an. \n\nGeschickt arbeitet das Drehbuch mit Täuschungen und falschen Fährten, die zu einem spannenden Finale führen."
