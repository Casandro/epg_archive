  description: |-
    Animationsserie, Großbritannien 2024
    Hufius singt schräg

    Die Helden sollen die ausgebliebene Lieferung Badeschwämme in Meerhallig selbst abholen. Dort ist die Meerkönigin mit einem Songwettbewerb beschäftigt. Darum gibt es keine Schwämme.

    Im Rahmen des Songwettbewerbs soll die goldene Muschel zum Strahlen gebracht werden. Doch Hufius' übereifriger und schräger Gesang führt dazu, dass eine uralte Seeschlange erwacht und Meerhallig bedroht. Erst das harmonische Zusammensingen führt zum Erfolg.
