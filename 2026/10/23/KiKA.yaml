    Taube im Haus

    Ernest pendelt als Bote zwischen Rebecca und Opa, der in der Natur zeltet. Dabei kommt es zu einem Flugunfall mit einer Taube. Rebecca kümmert sich um die verletzte Taube und nennt sie Leo.

    Ernest ist eifersüchtig und sinnt auf Rache. Um Leo wieder loszuwerden, verpasst er Coralie einen Kratzvirus und verwüstet die Küche. Natürlich denkt Mama, dass die Taube dies alles verursacht hat und ruft sogleich Dr. Fabert zu Hilfe.

    Dr. Fabert erscheint umgehend im Haus und nimmt Leo mit. Die Taube kommt in sein Labor in Quarantäne. Rebecca ist so traurig, dass Ernest endlich alles gesteht und gemeinsam befreien sie Leo aus dem Labor.
