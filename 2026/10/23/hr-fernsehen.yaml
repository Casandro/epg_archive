  description: '"Es ist ein Teil meiner Identität, dass es mir schlecht geht" - Ein Statement, das unter die Haut geht, Fans von Vega aber nicht überraschen dürfte. Immerhin ist der offene Umgang mit seinen Emotionen seit jeher ein absolutes Markenzeichen des Ur-Frankfurters, der sich aktuell laut eigener Aussage auf dem vorläufigen Höhepunkt seiner Karriere befindet. Im Rahmen des diesjährigen "World Club Dome" hat Vega mit Host Simon unter anderem über seinen Auftritt in der Frankfurter Festhalle als Meilenstein seiner Karriere, seine anstehende Tour und seine nächsten musikalischen Projekte gesprochen.'
