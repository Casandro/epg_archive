- eventId: 982737
  start: 2026-10-23T09:05:00Z
  stop: 2026-10-23T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Lesní hospodaření. Majitelka lesnické společnosti Foragra Naďa Pašková. Správné hospodaření v lese v Česku se řídí lesním zákonem a principy trvale udržitelného rozvoje. Vlastníci lesa tak musí respektovat závazné dokumenty, plánovat těžbu a také z důvodu klimatických změn přizpůsobovat výsadbu porostů. Jak zní desatero vlastníka lesa, to si připomeneme hodinu před polednem.'
