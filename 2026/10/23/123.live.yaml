  title: Die Trapp-Familie
  subtitle: Die Trapp-Familie
  description: Der österreichische Baron Trapp, verwitwet und Vater von sieben Kindern, heiratet die Novizin Maria, die sich als gute Mutter und Gesangslehrerin erweist. Als die Nationalsozialisten Österreich 1938 einverleiben, flieht die Familie in die USA. Dort gründet Maria mit den Kindern einen Chor, der als singende Trapp-Familie berühmt wird. Der verwitwete Baron sucht eine Gouvernante für seine Kinder und wendet sich an die Äbtissin eines Klosters. Ge 1956
