  title: Das große Daniela-Alfinito-und-Amigos-Wunschkonzert
  subtitle: Das große Daniela-Alfinito-und-Amigos-Wunschkonzert
  description: In dieser Sonderausgabe des Wunschkonzertes, präsentiert von Desiree Siyum, beleuchten wir erstmals das Familienleben von Daniela Alfinito und den Amigos. Ihre musikalische Geschichte ist einzigartig im deutschsprachigen Raum, denn was die Amigos über Jahrzehnte geschafft haben und den Staffelstab an die Tochter Daniela Alfinito weitergegeben haben, ist einzigartig. Erleben Sie mit uns in vielen, wunderbaren Musikvideos und Melodien dieser Ausnahmekünstler. Ge 2020
