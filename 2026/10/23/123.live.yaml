  title: Unvergessene Legenden - Roy Black
  subtitle: Unvergessene Legenden - Roy Black
  description: |-
    Unser Star in "Unvergessene Legenden"  ist heute Roy Black, der Sänger, der Filmschauspieler und Leinwandstar. Natürlich schenkte er dem Romantik-Schlager eine besondere Note. Aber auch in seinen Filmen setzte Roy Black den Genres "Mord und Totschlag" einfach eine besondere Herzlichkeit entgegen. Besonders in der Konstellation mit Uschi Glas war die Nation hin und weg. Geschichten, Anekdoten und Musik begleiten Sie durch diese Sendung der Erinnerungen.
    Roy Black   25.01.1943 - 09.10.1991 Ge 2020
