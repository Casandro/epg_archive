  title: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Gauthier in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Gauthier in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Alexandre Gauthier tritt absichtlich nicht in die Fußstapfen seinen Vaters, denn er bricht mit den Regeln dessen klassisch französischer Küche. Und damit hat er Erfolg: nachdem er das Restaurant seines Vaters im Norden Frankreichs übernommen hat, hat er sofort einen Michelin-Stern erkocht. Aus der klassischen französischen Küche seines Vaters machte er eine Contemporary Cuisine, die Regeln bricht und alte Formeln neu definiert. Wir dürfen dem selbstbewussten Franzosen aus La Madelaine-sous-Montreuil beim Kreieren seiner neuen französischen Küche über die Schulter schauen. Gemeinsam mit dem Küchenteam des Restaurant Ikarus im Salzburger Hangar-7 wird er das Menü des Monats kreieren. AT 2014'
