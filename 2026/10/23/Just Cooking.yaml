  title: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Gauthier
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Gauthier
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Aus der klassischen französischen Küche seines Vaters machte Alexandre Gauthier eine Contemporary Cuisine, die sogar mit einem Michelin-Stern ausgezeichnet ist. In die Fußstapfen seines Vaters zu treten, ist schwer genug. Wenn dieser auch noch Sternekoch war, umso schwieriger. Für Alexandre Gauthier war es daher vor allem eine Frage des Stils, als er das elterliche Restaurant La Grenouillère übernahm. Heute brichter selbstsicher die Regeln der französischen Küche und definiert Formeln neu . Der Executive Chef des Restaurant Ikarus im Hangar-7, Martin Klein, besucht den Sternekoch in La Madelaine-sous-Montreuil nahe Calais und entdeckt die kuliniarischen Spezialitäten der Region. AT 2014'
