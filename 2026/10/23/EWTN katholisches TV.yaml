  title: In persona Christi - Das sakramentale Priestertum in der Kirche
  subtitle: Jesus Christus als Hoherpriester und Guter Hirt
  description: Woher stammt der Priester? - Die Schriften des Neuen Testamentes bezeugen übereinstimmend, dass Jesus Christus der einzige Hohepriester und der Gute Hirt ist, der sein Leben für das Heil der Menschen hingibt. Leben und Dienst des Priesters finden von dort her ihre Bestimmung. Der Priester vergegenwärtigt auf personale Weise die Hingabe Christi an seine Kirche. Folglich gehört der Priester konstitutiv zur Kirche und zu ihrer Sendung. Ohne ihn kann die Kirche Jesu Christi auf Dauer nicht sein.
  widescreen: true
