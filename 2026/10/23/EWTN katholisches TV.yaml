  title: Katholizismus
  subtitle: Die Gemeinschaft der Heiligen
  description: Bischof Barron betrachtet einige der größten Helden der Kirche und zeigt, wie ihre außergewöhnlichen Beispiele sowohl die Leidenschaft als auch das kreative Potenzial des Katholizismus zeigen. Diese Folge erzählt die Geschichte der Kirche - sowohl auf Erden als auch im Himmel - als die einer riesige Schar von Zeugen, die von Christus berufen sind, eine Gemeinschaft von Heiligen zu sein.
