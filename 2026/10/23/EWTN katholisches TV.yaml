  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Die Sehnsucht nach mehr - Teil 1
  description: |-
    Anna Diouf im Gespräch mit Christina und Tabea Blischke
    Teil 1

    Nicht selten führt die Hinwendung eines Familienmitglieds zur katholischen Kirche zu Konflikten innerhalb der Familie. Nicht bei Christina und Tabea Blischke: Beide fanden gemeinsam, und doch auf unterschiedlichen Wegen, zur Katholischen Kirche. In der ersten Folge spricht Anna Diouf mit der Mutter, Christina Blischke, über ihren Konversionsweg von der überzeugten Protestantin zur engagierten Katholikin.
