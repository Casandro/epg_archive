  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Heute dreht es sich mehr als sonst ums Familienleben: In der einen Familie gibt es bald Nachwuchs, in der anderen hat der jüngste Spross Kummer und in der dritten herrscht nicht nur eitel Sonnenschein. Angefangen hat''s bei Katta Niels: Er wurde von seiner Gruppe verstoßen und lebt im Moment getrennt von ihr. Tierpflegerin Celina pflegt ihn voller Mitgefühl. Sie weiß auch, dass die Isolation Niels bedrückt und dass er in so einer Situation nicht gern allein sein will. Also sind Celinas Besuche bei dem kleinen Halbaffen besonders ausgiebig - und der weiß das sichtlich zu schätzen.'
