  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Sie sind süß und kuschelig, manche halten sie für dümmlich oder essen sie. Was Schafe leisten, ist Menschen oft nicht bewusst. Nur Schäfer wissen, wie wichtig die Tiere für die Landschaft sind. Doch der Beruf stirbt aus. Berufs- und Wanderschäfer verschwinden langsam von der Bildfläche. Ein paar von ihnen trifft Moderatorin Anna Lena Dörr auf ihrer Reise ins Dreiländereck zwischen Luxemburg, Belgien und der Eifel.
