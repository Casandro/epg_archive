  title: Astrid i Raphaëlle 5 (odc. 7)
  subtitle: Zabójcze wyścigi. Astrid i Raphaëlle badają tajemniczą śmierć nagradzanego konia wyścigowego z renomowanej stadniny, ale to nie koniec przestępstw związanych z końmi. (S5,Ep7)
  description: |-
    Tytuł oryginalny: Astrid et Raphaëlle
    FR,BE,CH, 2024
    Reżyseria: David Ferrier
    Występują: Sara Mortensen, Lola Dewaere, Benoît Michel, Husky Kihal, Jean-Louis Garçon, Dominique Engelhardt
    Astrid i Raphaëlle są zupełnie różne, ale ich umiejętności, wiedza i osobowości uzupełniają się w niezwykły sposób, tworząc z nich niezawodny duet śledczy. Cierpiąca na zespół Aspergera Astrid ma fenomenalną pamięć fotograficzną i jest w stanie zapamiętać i przeanalizować nawet najdrobniejsze szczegóły. Raphaëlle zawsze kieruje się wewnętrznym kompasem i ufa swojemu instynktowi podczas badania powierzonych jej spraw. Jest energiczna, bezpośrednia i nie boi się łamać zasad.
