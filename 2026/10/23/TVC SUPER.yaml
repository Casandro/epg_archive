  description: |-
    Tytuł oryginalny: Co Polak potrafi na drodze?
    PL, 2026
    "Co Polak potrafi na drodze?" to pełen adrenaliny program ukazujący najbardziej zaskakujące, absurdalne i niebezpieczne sytuacje z polskich dróg - od komicznych popisów po dramatyczne zdarzenia. Nagrania komentują m.in. Olga Borys, Paweł "Czadoman" Dudek, Grzegorz Stasiak i Maciej Wisławski, dzieląc się anegdotami, opiniami i praktycznymi wskazówkami, a nawet sprawdzając, czy dziś zdaliby ponownie egzamin na prawo jazdy. Emocje gwarantowane!
