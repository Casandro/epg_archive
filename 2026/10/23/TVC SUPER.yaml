  title: Winnice miłości 1 (odc. 35)
  subtitle: Eurydiki żąda od Meliny i Achilleasa podjęcia decyzji i przedstawia swoje finansowe oczekiwania, czym wprawia ich w osłupienie. Achilleas wraca z nią na Cypr, by rozpocząć procedurę rozwodową.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Eurydiki jest zdeterminowana, aby wyjaśnić całą sprawę. Mówi Melinie i Achilleasowi, że muszą podjąć stosowne decyzje i informuje o swoich wymaganiach finansowych, wprawiając ich w osłupienie. Achilleas postanawia wrócić z nią na Cypr, by skontaktować się ze swoim prawnikiem i rozpocząć postępowanie rozwodowe. Eurydiki ma jednak pewne sekretne plany. Potwierdzają się podejrzenia Mattheosa co do śmierci jego rodziców.
