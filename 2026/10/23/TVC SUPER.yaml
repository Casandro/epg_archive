  description: |-
    Tytuł oryginalny: Profilage
    FR, 2018
    Reżyseria: Vincent Jamain
    Występują: Juliette Roudet, Jean-Michel Martial, Philippe Bas, Raphaël Ferret, Diane Dassigny, Valérie Dashwood
    Chloé Saint-Laurent jest profilerką współpracującą z paryską policją w celu rozwiązywania spraw morderstw. Z pozoru wydaje się wręcz słodką dziewczynką, której brakuje jedynie lalki w dłoni, ale faktycznie jest świetna w swoim zawodzie. Krok po kroku Chloé wpasowuje się w zespół, a jej koledzy, początkowo bardzo zdystansowani, szybko stają się jej najlepszymi przyjaciółmi. Serial zwyciężył w plebiscycie na najlepszą telewizyjną serię podczas Festival de la Fiction TV w 2013 roku.
