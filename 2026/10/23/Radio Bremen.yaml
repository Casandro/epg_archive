  description: "Oliver Schmidt macht vieles anders, als man es von einem Hoteldirektor erwarten würde. Sein Dienstwagen ist ein schweres Motorrad, zur Arbeit kommt er in Jeans und Turnschuhen. Er ist ein Hoteldirektor \"ohne Schlips und Kragen\", dafür aber mit frischen Ideen. \nDer Film begleitet Oliver Schmidt in seinem ungewöhnlichen Alltag, vom morgendlichen Check in der Hotelküche, zur Käseverkostung, ins Tattoostudio und auf seine Heimatinsel Poel und zeichnet das Porträt eines \"Mecklenburger Jung\", der es ganz nach oben geschafft hat. Eben: typisch!"
