  subtitle: Durchhalten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: "Assistenzärztin Rebecca Krieger und Oberarzt Dr. Marc Lindner kümmern sich um Jörn Klaußner, der von seiner Tochter überredet wurde, Gefühlsstörungen im Arm abklären zu lassen. Das Ergebnis ist eindeutig: ein Hirntumor. Jörn stimmt zu, den Tumor entfernen zu lassen, verweigert aber die postoperative Strahlentherapie.\nDr. Leyla Sherbaz' Plan, ihren Mann Dr. Ben Ahlbeck so gut es geht zu entlasten, wird zunichtegemacht, als Rayas Babysitterin eingeliefert wird. \nMatteo Moreau ist erstaunt, als ihm die Taxifahrerin Viktoria Stadler ihre Bewerbungsmappe in die Hand drückt, inklusive des gerade abgeholten Abschlusszeugnisses in Medizin."
