  title: Désirée Nosbusch - Den Träumen folgen
  subtitle: 'Moderation: Michel Abdollahi'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Désirée Nosbusch ist ein vielseitiges Ausnahmetalent: Sie ist Schauspielerin, Produzentin, Moderatorin und Regisseurin. Ihre Karriere begann mit 12 im Radio, ihre erste Hauptrolle spielte sie mit 16, und mit 19 Jahren führte sie in fünf Sprachen durch den Eurovision Song Contest. Sie moderierte Shows und spielte in über 30 Filmen mit. 2018 brillierte die Luxemburgerin in der Serie "Bad Banks". Die Dokumentation begleitet Désirée Nosbusch bei Dreharbeiten und privat. Sie thematisiert auch das dunkle Kapitel, als Nosbusch als Jugendliche von einem älteren Mann missbraucht wurde und sich aus der Lage selbst befreite.'
