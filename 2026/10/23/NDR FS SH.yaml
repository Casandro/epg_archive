    Auf jeweils vier Höfen aus allen vier norddeutschen Bundesländern geht es um die alltäglichen Herausforderungen für die Landwirte. Rinder, Hühner, Schafe, Pferde und Schweine gehören auf dem Land genauso dazu wie der ständige Blick aufs Wetter. Das ist wichtig, damit die Ernte rechtzeitig eingebracht werden kann.
