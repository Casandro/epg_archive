  description: 'Carolin Kebekus ist zurück und mit ihr sieben neue Folgen der "Carolin Kebekus Show". Ab dem 22. Oktober 2026 gibt es wöchentlich frische Ausgaben in der ARD Mediathek und im Ersten. Das Publikum erwartet einen Genre-Mix aus Stand-up, Musik, Sketchen und humorvollen Aktionen - und prominente Gäste in allen Shows! Dazu gehören unter anderem Motsi Mabuse, Hazel Brugger, Esther Sedlaczek und Mai Thi Nguyen-Kim, die jeden Spaß mitmachen. Zum Comedy-Gipfeltreffen kommt es bei dem Besuch von Komiker-Legende Bastian Pastewka: Mehr lustig geht nicht!'
