  description: In den vergangenen tausend Jahren haben Menschen den Atlantik immer wieder überquert. Zwischen 1840 und 1939 träumen viele von der Neuen Welt, es ist ein Zeitalter der Rekorde. Die Mobilität und die Kommunikation verändern sich so rapide, dass die Erde zusammenrückt wie noch nie zuvor. Der Traum vom technischen Fortschritt wird immer mehr Wirklichkeit.
