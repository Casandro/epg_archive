  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Mexiko
  description: |-
    Nach zweiwöchiger Überfahrt von der US-amerikanischen Westküste steuert der Katamaran die Hafenstadt Puerto Vallarta im mexikanischen Bundesstaat Jalisco an. Zusammen mit Guénolé steht Corentin hoch zufrieden vor seinem Gewächshaus und pflückt Gemüse für das Mittagessen. In diesen warmen Gefilden gedeihen die Pflanzen an Bord besonders gut.
    Corentin würde gern neue Nahrungsmittel anbauen. In der Nähe von Chiapas besucht er eine Organisation, die sich bemüht, uralte landwirtschaftliche Verfahren wieder einzuführen - etwa die Mischkultur Milpa, bei der Mais, Bohnen und Kürbisse gemeinsam angebaut werden.
