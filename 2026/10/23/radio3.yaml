- eventId: 1380299
  start: 2026-10-23T17:00:00Z
  stop: 2026-10-23T21:00:00Z
  title: 'radio3 Konzert: GAME ON SYMPHONY'
  subtitle: 'Moderation: Fridl Achten und Nico Holonics'
  description: |-
    Live auf radio3. Live mit Orchester. Live auf Twitch. Live mit Publikum im Chat. Und live auf YouTube.

    Musik in Videospielen hat den gleichen Stellenwert, wie Musik im Film: Sie ist unerlässlich. Gaming ohne Soundtrack? Kaum vorstellbar. radio3 vom rbb bringt zusammen mit dem Deutschen Symphonie-Orchester Berlin und der ARD Klassik epische Musik aus Computerspielen in den Großen Sendesaal im Haus des Rundfunks. Das Orchester unter der Leitung von Michael Seal spielt Musik aus vielen bekannten Video-Games: "Tomb Raider", "Final Fantasy" oder "Age of Empires 4". Wir übertragen dieses Konzert mit einer Vorshow live auf radio3. Außerdem wird das Event als Video live auf der Gaming-Plattform "Twitch" übertragen und ist im ARD Klassik Youtube Kanal zu sehen. Eine weitere Besonderheit ist, dass die Twitch-Community das Geschehen im Chat kommentieren kann, wie auch das Publikum im Saal oder Sie zuhause am Radio! Als Host für Twitch wird Fridl Achten auch für den Saal moderativ durch den Abend führen und auf radio3 kommentiert Nico Holonics das Geschehen.

    Moderation: Fridl Achten
    Nico Holonics
