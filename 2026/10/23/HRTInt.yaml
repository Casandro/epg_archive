  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
- eventId: 995116
  start: 2026-10-23T10:09:00Z
  stop: 2026-10-23T10:53:00Z
  title: Kod nas doma
  subtitle: ' '
  description: 'U samo nekoliko godina postao je jedno od najprepoznatljivijih imena domaće glazbene scene. Prvi je hrvatski izvođač na vrhu Billboardove ljestvice Croatia Songs, za dva dana pred njim je Arena Zagreb, a danas je s nama u studiju - Grše! Od Disneyjevih princeza do popularnih filmova - kako priče i likovi uz koje odrastamo oblikuju naš pogled na ljubav, odnose, emocije, uspjeh i nas same. O tome razgovaramo s komunikologinjom i edukanticom psihoterapije Teom Bašić. Sport nas uči disciplini, upornosti i nadilaženju vlastitih granica. No u vremenu u kojem se izdržljivost slavi, a odustajanje često doživljava kao slabost, postavlja se pitanje znamo li prepoznati trenutak kada treba stati. Odgovor na pitanje gdje je granica između pomicanja vlastitih mogućnosti i ugrožavanja zdravlja potražit će u razgovoru sa stavom Bruno Šimleša i njegovi gosti - Ecija Ojdanić, glumica i strastvena trkačica i sportski psiholog Matej Tomazin.  Voditeljica: Barbara Kolar Redateljica: Sanja Corazza Urednica i scenaristica: Eli Lazarova Sladić'
