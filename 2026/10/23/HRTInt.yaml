  description: 'Spletom okolnosti Eva i Kristijan se nježno poljube. Ruža pita Nikolu zašto je odbio novac koji mu je Ivan nudio baš sada kad im je potreban. Adela je sretna zbog Nikolinog poklona. Kristijan odlazi po Evinu odjeću i susretne Andriju i Sofiju koji znatiželjno zapitkuju. Kristijan kaže Evi da bi trebali razgovarati o poljupcu koji im se dogodio, ali ga ona iznenadi pitanjem o zarukama s Irenom. Don Ante izlaže Ottu svoje planove oko nogometnog turnira. Kaže mu da bi bilo pametno u iste ekipe staviti upravo one koji se ne podnose. Sofija sumnjičavo ispituje Evu što se dogodilo između nje i Kristijana. Irena nagovara Kristijana da otputuju zajedno na more za vikend. Julija poziva Roberta na ručak u znak zahvale. Augustina je ljuta na Karla što stalno radi i nema vremena za nju. Irenini planovi za vikend su propali šefovim telefonskim pozivom. Razočarana je jer mora u Zagreb zamijeniti bolesnu kolegicu. Don Ante pomalo prikuplja potrebne podatke za sastav ekipa. Adela šalje Nikoli poruku da se sastanu. Robert za ručkom pokušava izvući iz Julije što više podataka o njoj i Andriji. Andrija sretne Kristijana kod Višnje u trgovini, te ga stane zapitkivati i zadirkivati u vezi Eve. Stela svojim dolaskom u Jablanovo iznenadi Evu. Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
