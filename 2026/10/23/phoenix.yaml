  title: 'Terra X History: Geheimnisse des BND'
  subtitle: Die Schattenwelt der Spione
  widescreen: true
  hd: true
  description: |-
    70 Jahre BND spiegeln die Geschichte Deutschlands mit Legenden, Skandalen und Geheimoperationen. "Terra X History" bringt Licht in die Schattenwelt der Spione.

    Immer wieder gerät der BND in die Schlagzeilen  liefern die "Schlapphüte" Stoff für die Titelseiten der Medien. Doch ist der Geheimdienst wirklich so schlecht wie sein Ruf?

    Die Geheimnisse des Bundesnachrichtendienstes beginnen mit der Flucht des ehemaligen Wehrmachtsgenerals Reinhard Gehlen in den Wirren der letzten Kriegstage 1945. Er bietet sein Wissen über die Sowjetunion den Amerikanern an. Die greifen gerne zu.
