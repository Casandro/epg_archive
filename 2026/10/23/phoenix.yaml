  title: Geheimsache!
  subtitle: Wenn Journalisten zu BND-Agenten werden
  description: |-
    Journalisten als Agenten? Was nach dem Plot eines Hollywood-Films klingt, war vor nicht allzu vielen Jahren in Deutschland Realität. In mehreren Fällen haben Journalisten mit dem Bundesnachrichtendienst zusammengearbeitet. 2006 wurde im sogenannten "Schäfer-Bericht" aufgedeckt, dass einige Journalisten sogar Kollegen bespitzelt hatten.
    Auch der BND selbst geriet ins Kreuzfeuer: der Nachrichtendienst hatte Journalisten in Deutschland umfangreich überwacht und ausgespäht. Für die Dokumentation hat Lea Eichhorn zentrale Akteure getroffen. Die zentrale Frage: Wie nah dürfen Journalisten und Geheimdienste einander kommen?
