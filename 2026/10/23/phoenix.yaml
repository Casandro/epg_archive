  title: Neue Deutsche Welle (3/3)
  subtitle: Der Overkill
  widescreen: true
  hd: true
  description: 'Nichts scheint die Welle aufhalten zu können: 1983 dominiert die NDW die deutschen Charts. Doch auf den Höhenflug in der Gunst des Publikums folgt schon bald der Überdruss. Manche, wie Nena, werden jetzt zu Superstars und produzieren Hits am Fließband. Auch sozialkritische Songs wie "Bruttosozialprodukt" von Geier Sturzflug begeistern die Fans. Doch die übermäßige Vermarktung der NDW durch die Plattenindustrie wird zum Bumerang. Die Pioniere wenden sich ab und versinken größtenteils wieder in der Nische. Künstler wie Joachim Witt müssen im Musikbusiness buchstäblich wieder ums Überleben kämpfen.'
