  title: Neue Deutsche Welle (2/3)
  subtitle: Der Hype
  widescreen: true
  hd: true
  description: "Die Neue Deutsche Welle nimmt an Fahrt auf und erobert nach der rebellischen Punk-Phase den Mainstream. Überall gründen sich neue Bands, entstehen Hits auf Deutsch. Die NDW ist voll im Trend. \nAb 1981 wird die Welle immer bunter, beliebter und schließlich zum Massenphänomen. Mit dem Abstand von 40 Jahren blicken die Macher von damals zurück auf das Phänomen. Mit dabei sind unter anderen Markus, Joachim Witt, Kai Havaii von Extrabreit, Peter Hein (Fehlfarben) und viele andere..."
