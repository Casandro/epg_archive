- eventId: 981928
  start: 2026-10-23T16:30:00Z
  stop: 2026-10-23T16:55:00Z
  title: Čtení na pokračování
  description: 'Strašidlácký příběh aneb Velká kniha děsů a běsů 2/10. Bojíte se tmy? Pavouků? Duchů? Jeník se bojí úplně všeho. Od té doby, co mu zemřel táta, ho strach provází na každém kroku. Jednoho dne se ocitne v tajemném rádiu, kde pracují a vysílají strašidla. Musí se postavit svým strachům, aby rádio zachránil před zánikem. Napsala: Lenka Králová. Dramaturgie: Vojtěch Bohuslav. Zvuk: Ondřej Franěk. Režie: Jakub Doubrava. Natočeno v roce 2026. Čte: Josef Jelínek. PREMIÉRA.'
- eventId: 982066
  start: 2026-10-23T16:55:00Z
  stop: 2026-10-23T17:50:00Z
  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Anna Zítová - když zrovna nepracuje v rozhlase, běhá, předcvičuje lekce Fitboxu nebo je na zápase basketbalu, kterému se věnuje už od školky. Lektorskou licenci má mimo fitboxu i na fitnessové lekce Jumpingu a Piloxingu. V minulosti se také věnovala crossmintonu, ve kterém byla i na mistrovství světa. Proč se crossminton dříve jmenoval Speed Badminton a musel se přejmenovat? Poslechněte si Klub Rádia Junior. Moderuje Jiří Kohout.
- eventId: 982067
  start: 2026-10-23T17:50:00Z
  stop: 2026-10-23T18:00:00Z
  title: Hajaja
  description: Ferda v mraveništi 5/7. Všeuměl Ferda se po ztroskotání své lodi vrací do rodného mraveniště a hned se vrhne do vymýšlení všelijakých zlepšováků, ať už při lovu divokých mšic nebo čištění chodeb mraveniště. Poslechněte si příhody chytrého mravence s červenou kravatou, který se ničeho nezalekne a je vždy ochoten pomoci přátelům i těm, s nimiž se setká poprvé. Podle stejnojmenné knihy Ondřeje Sekory pro rozhlas připravila Eva Linková. Dramaturgie Václava Ledvinková. V roce 1988 natočil režisér Miroslav Šváb. Vypráví Vlastimil Brodský.
