  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Anna Zítová - když zrovna nepracuje v rozhlase, běhá, předcvičuje lekce Fitboxu nebo je na zápase basketbalu, kterému se věnuje už od školky. Lektorskou licenci má mimo fitboxu i na fitnessové lekce Jumpingu a Piloxingu. V minulosti se také věnovala crossmintonu, ve kterém byla i na mistrovství světa. Proč se crossminton dříve jmenoval Speed Badminton a musel se přejmenovat? Poslechněte si Klub Rádia Junior. Moderuje Jiří Kohout.
