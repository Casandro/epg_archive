  subtitle: ATTUALITA' - Il documentario ripercorre la metamorfosi di Latina, fondata come Littoria il 30 giugno 1932 e divenuta il più giovane centro urbano d'Italia. Attraverso immagini d'epoca e testimonianze ricostru..
  description: "sce la nascita nell'Agro Pontino, allora segnato da paludi malsane e malaria, il risanamento idraulico e l'insediamento di famiglie contadine provenienti soprattutto dal Veneto, dall'Emilia-Romagna e da altre aree del Centro-Nord. La Seconda guerra mondiale provoca distruzioni e riporta il territorio alle condizioni pre-bonifica; nel dopoguerra, investimenti stranieri e industrializzazione favoriscono la fabbrica a scapito dell'agricoltura. Il mondo rurale, tuttavia, si modernizza con nuove tecnologie, coltura idroponica, allevamenti avicoli intensivi e trasformazione e conservazione dei prodotti della terra. Al mosaico demografico ed economico si aggiungono i profughi italiani rimpatriati dalla Tunisia, soprattutto siciliani colpiti dagli espropri, che scelgono l'Agro Pontino per rilanciare i vigneti.  - Programma di: Enrico Gras e Mario Craveri\nFotografia: Franco Castelli\nContenuto musicale: Franco Potenza \nVoce: Rolf Tasna\nConsulenza: Luca Pinna\n,"
