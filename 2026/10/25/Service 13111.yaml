  title: Die besten Köche der Welt - Zu Gast im Ikarus
  subtitle: Guillaume Galliot
  description: 'Für das außergewöhnliche Restaurantkonzept reist Executive Chef Martin Klein im Vorfeld zu den besten Köchen der Welt, blickt hinter die Kulissen der Haute Cuisine und taucht ein in ihre kulinarischen Geheimnisse. Die Sendung "Die besten Köche der Welt - Zu Gast im Ikarus" bietet exklusive Einblicke in die Welt der Spitzengastronomie und porträtiert eindrucksvoll die Philosophie, Persönlichkeit und Esskultur jedes Gastkochs.Österreich 2026, R: Sabine Anders, Isabella Scholda'
