  title: Servus Kinder
  subtitle: Wir bauen eine Burg
  description: 'Im Mittelalter gab es weder Presslufthammer noch Lastwägen. Und trotzdem haben die Menschen riesige Burgen gebaut, die teilweise heute noch stehen. Wie das damals funktionierte, versuchen Gerald Krenn und sein Team in Friesach nachzustellen, indem sie eine echte Burg bauen - nur mit den Techniken, die man im Mittelalter schon zur Verfügung hatte. Die Zeitlos-Kinder packen da natürlich wieder fleißig mit an.Österreich 2022, R: Matthäus Weißenbacher'
