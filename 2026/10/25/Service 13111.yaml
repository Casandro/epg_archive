  title: Heimatleuchten
  subtitle: Zwischen Tradition und Zukunft - durch die Südsteiermark mit Richard Deutinger
  description: 'Ein einheimischer Radsportler nimmt Richard Deutinger mit auf die Reise durch die Südsteiermark. In dieser wildromantischen Landschaft treffen wir auf Menschen, die es schaffen, Tradition zu bewahren und sich gleichzeitig den Herausforderungen der Zukunft zu stellen. Wir lernen eine junge Winzerin kennen, deren Herz für den Schilcher schlägt und die uns mitnimmt auf eine besondere Genuss-Wanderung. An der Südsteirischen Weinstraße treffen wir einen Bio-Winzer, der uns überraschende Einblicke gibt in seine naturnahen Weingärten. Ein junges wagemutiges Paar teilt mit uns die Leidenschaft fürs Steirische Kürbiskernöl. Außerdem besuchen wir das erste Zwei-Sterne-Restaurant der Steiermark. Österreich 2026, R: Brigitte Kornberger M: Richard Deutinger'
