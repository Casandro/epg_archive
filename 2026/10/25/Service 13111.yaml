  title: Gottesdienst am Sonntag LIVE
  subtitle: Eucharistiefeier aus der Pfarre Lackenbach
  description: Die Pfarrkirche Lackenbach ist den Heiligen Petrus und Paulus geweiht und gehört zum Dekanat Deutschkreutz. Bereits 1222 wurde Lackenbach erstmals urkundlich als "ville Sancte Marie" erwähnt, 1663 wurde der Ort schließlich zur eigenständigen Pfarre erhoben. Die heutige Pfarrkirche in der Bergstraße wurde 1962 errichtet. Der moderne Saalbau mit seinem markanten südlichen Frontturm ist schlicht und zeitgemäß gestaltet. Ein besonderes Zeugnis der älteren Kirchengeschichte ist das barocke Kruzifix über dem Hochaltar aus dem 18. Jahrhundert. Seit 2012 gehört die Pfarrgemeinde Lackenbach zum Pfarrverband Kobersdorf-Weppersdorf-Lackenbach. Seit 2019 wird die Pfarre von Pfarrer Mag. Shinto Varghese Michael, auch Dechant des Dekanates Deutschkreutz, geleitet. Musikalisch wird die Messe vom Kirchenchor Lackenbach unter der Leitung von Bernadette Friedl sowie den Volksschulkindern unter der Leitung von Religionslehrerin Christa Böhm gestaltet. An der Orgel spielt Bernadette Friedl. Österreich 2026
