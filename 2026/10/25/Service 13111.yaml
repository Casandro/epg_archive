  title: Servus Kinder
  subtitle: Das Leberkässemmel-Geheimnis
  description: Ein Leberkässemmerl - duftende Jause oder warmer Mittagssnack. Noah und David können sich ein Leben ohne Leberkässemmerl nicht vorstellen. Der Sohn einer Bäckersfamilie und der Bauernhofbub treffen einander am Bauernmarkt. Einen Tag lang helfen sie ihren Eltern beim Verkauf im Europark in Salzburg, kommen ins Gespräch und beschließen einen abenteuerlichen Betriebstausch. Diese Tage bringen müde Beine, aber vor allem unverblümte Einblicke in die Leberkäs-Produktion, hoffnungslose Handsemmel-Versuche in der Backstube und ganz viele Aha-Momente um den geheimnisvollen "Leberkäse-Kodex"!Österreich 2026
