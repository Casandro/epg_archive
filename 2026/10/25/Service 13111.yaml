  title: Game Night
  description: |-
    Annie (Rachel McAdams) und Max (Jason Bateman) sind leidenschaftliche Gesellschaftsspieler. Kennengelernt haben sie sich bei einem Wettbewerb, und schon bald waren sie ein Ehepaar. Häufig organisieren die beiden Spieleabende mit Freunden. Brooks, der Bruder von Max, macht den Vorschlag, es mit einer besonderen Spielevariante zu versuchen: Eine Art Real-Spiel mit Krimihandlung, in dem Schauspieler ein Verbrechen inszenieren. Das Spiel soll in Brooks' Wohnung stattfinden. Tatsächlich kommt es an besagtem Abend zu einem Überfall. Brooks wird angegriffen und entführt. Die Gäste halten die Tat für einen Teil des Spiels und müssen nun den Regeln gemäß das Opfer finden. Annie und Max können Brooks in einer Bar orten. Als Annie mit einer Spielzeugpistole den Entführten "befreien" möchte, schießt sie versehentlich Max in den Arm. Annie hält keine Attrappe in der Hand, sondern eine echte Waffe. Und was sie gerade erleben, ist kein Spiel. Brooks gesteht, sein Geld als Hehler und Schmuggler zu verdienen. Dabei muss er einen Kunden ziemlich verärgert haben. Mit Annies Hilfe versucht Max, seinem Bruder das Leben zu retten.

    Die Krimikomödie "Game Night" ist ein origineller Genre-Mix, der bis zum Ende zwischen Spiel und blutigem Ernst hin und her pendelt. Das Regie-Duo John Francis Daley und Jonathan Goldstein, später sehr erfolgreich mit dem Actionfilm "Dungeons & Dragons", zeigt erstaunlichen Einfallsreichtum und lässt den Schauspielern Raum, ihr komödiantisches Talent zu entfalten. Jason Bateman (Max) verkörpert perfekt den in Not geratenen harmlosen Bürger. Annie (dargestellt von Rachel McAdams) entwickelt dagegen ungeahnte Fähigkeiten als Actionheldin.
    Krimi, Vereinigte Staaten Von Amerika 2018, R: John Francis Daley, Jonathan Goldstein
