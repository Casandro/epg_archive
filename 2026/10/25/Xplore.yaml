  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Überall Elefanten am Kwando'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Überall Elefanten am Kwando'
  description: Wir verlassen die Ndhovu Lodge & Camp und fahren weiter gen Osten in den Caprivi-Zipfel hinein. Nur mit einem schmalen Streifen vom restlichen Namibia verbunden und von Botswana, Angola, Simbabwe und Sambia umgeben, befinden wir uns 200km weiter in einer Region einerseits voller Nationalparks, andererseits auch recht viel Bevölkerung und Tourismus. Umso mehr sind wir überrascht, dass wir auf unserer Fahrt in der Kwando Core Area, dem nächsten Nationalpark, völlig alleine sind. Auf der dreistündigen Pirschfahrt sehen wir kein anderes Fahrzeug. Die Pisten sind aber auch wesentlich herausfordernder als in den vorherigen Parks. Wir machen erstmals Erfahrung mit Tiefsand-Abschnitten. Belohnt werden wir mit großen Elefantenherden, die uns teilweise sehr nah kommen, aber auch kleinen Besonderheiten, wie der farbenfrohen Gabelracke, die ebenso alleine auf einem Ast sitzt, wie wir im Park sind. Kurz hinter dem Park liegt unsere Campsite im Bushcamp by Camp Kwando, wunderschön, ebenso recht einsam, mit Blick auf ein Sumpfgebiet voller Hippos, die wir allerdings nicht zu Gesicht bekommen, nur hören. NA 2023
- eventId:
  - 1000741
  - 673043
  start: 2026-10-25T19:45:00Z
  stop: 2026-10-25T20:06:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Einsamkeit im Mudumu Nationalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Einsamkeit im Mudumu Nationalpark'
  description: Am Vormittag besuchen wir das Dorf Kongola, das mit sehr gut sortiertem Supermarkt, Tankstelle und einem sehr schönen Geschäft mit Holzschnitzereien (Mashi Crafts) aufwarten kann. Am Mittag geht es dann in den Mudumu Nationalpark, den wir ab dem ersten Moment als nicht so schön empfinden. Landschaftlich verlaufen die Strecken durch sehr trockenes Gras und nur wenig am Ufer des Kwando. Die Elefantenherden wirken noch deutlich ungehaltener über unser Eindringen in ihr Territorium. Dafür sind die Straßen gut zu befahren, bis... ja, bis sie plötzlich alles andere als gut zu befahren sind. Mitten im Park treffen wir auf ein Fahrzeug, von dessen Insassen wir gefragt werden, ob uns ein im Sand steckendes Auto begegnet ist. Wir verneinen, nur um 20 Minuten später eben jenes Fahrzeug direkt vor uns liegen zu sehen. Das junge deutsche Paar wartet schon seit zwei Stunden darauf gefunden zu werden und sind froh uns zu sehen. Wir versuchen zwar mit Sandblechen, Schaufel und Winde sie rauszubekommen (alles Dinge, die sie nicht dabei haben), es gelingt uns aber nicht. Am Abend bekommen wir dann auch von den beiden die Rückmeldung, dass alles gut ausgegangen ist. Wir sind von der Situation, aber auch insgesamt, sehr angespannt und verlassen den Park dann schnellstmöglich, nur um 20km weiter wieder in Richtung unseres Camps am nächsten Nationalpark entgegengesetzt zur Zivilisation abzubiegen. Wir richten uns auf Campsite 1 des Livingstone's Camps ein und freuen uns auf eine ruhige Nacht. Nun in dieser Nacht sind wir allein, und eben doch nicht allein. Um 3 Uhr macht sich ein Elefant - so interpretieren wir die Geräusche und die Spuren am nächsten Morgen - in 20 bis 30m Entfernung ans Nachtmahl. Einerseits bekommen wir es jetzt schon mit der Angst zu tun, andererseits ist das noch ganz schön weit weg, für das, was in Botswana noch kommen wird. NA 2023
- eventId:
  - 1000749
  - 673071
  start: 2026-10-25T20:10:00Z
  stop: 2026-10-25T20:23:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Es geht nach Botswana!'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Es geht nach Botswana!'
  description: Nach den Erlebnissen der letzten Tage geht es heute deutlich ruhiger voran. Bereits um 13 Uhr erreichen wir die Chobe River Lodge, wo wir den Nachmittag am Pool und im klimatisierten Zelthaus verbringen. Kraft tanken, für das was da noch kommt. Der Chobe bildet die Grenze zwischen Namibia und Botswana und eine gleichzeitig sehr schön aber dennoch hinsichtlich Tiersichtungen heute unspektakuläre Kulisse für den Abend und die erstmal letzte Nacht in Namibia. Um 10 Uhr stehen wir am Ausreisecheckpoint Ngoma und verlassen 44 Minuten später den gleichnamigen Einreisecheckpoint auf botswanischer Seite. Die Prozedur ist zwar nicht ganz logisch nachvollziehbar, doch wir werden gut durch das System aus verschiedenen Häuschen, Stempeln und Ablaufschritten geleitet. Kuriosen Höhepunkt bildet das Desinfizieren aller mitgebrachten Schuh(sohlen) auf einer dafür vorgesehenen Matte. Kurios insbesondere deshalb, weil niemand in irgendeiner Form kontrolliert, ob jeder nun alle Schuhe desinfiziert hat, die er dabei hatte usw. Kaum in Botswana angekommen, wird uns die Wildtierdichte vor Augen geführt, in dem Giraffen, Elefanten und Kudus die 50km lange Hauptstraße zwischen Grenze und Hauptort Kasane queren. In Kasane selbst, einer Stadt, die wir in den nächsten Tagen immer wieder besuchen werden, machen wir einen Großeinkauf, besorgen uns SIM-Karten und heben Pula ab. Die botswanische Währung ist sehr schwierig außerhalb des Landes zu bekommen. Wir können den SPAR Markt sehr zum Eeinkaufen empfehlen und auch den Fast-Food-Laden "Nandos". Am Nachmittag fahren wir die 50km wieder zurück zur Grenze, denn unsere Campsite Muchenje, die wir für ganze drei Nächte nun belegen, liegt nahezu gegenüber der Chobe River Lodge, nur eben auf botswanischer Seite, und ist damit insbesondere der optimale Ausgangspunkt für Touren in den Chobe Nationalpark. BW 2023
- eventId:
  - 1000750
  - 673072
  start: 2026-10-25T20:25:00Z
  stop: 2026-10-25T20:45:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  description: 'VIP Trip - Prominente auf Reisen 5: Der aus "Die Bergretter" bekannte TV-Schauspieler Sebastian Ströbel nimmt die Zuschauer mit auf eine abenteuerliche Entdeckungsreise durch Israel. Eine der ältesten Städte der Welt darf bei dieser Tour natürlich nicht fehlen und so beginnt die Reise in Jerusalem. Grabeskirche, Felsendom und Klagemauer sind ein Muss für jeden Israel-Besucher und auch Sebastian Ströbel lässt sich von der besonderen Atmosphäre dieser Stadt verzaubern. Von diesem Zentrum und dem Ursprung dreier Weltreligionen führt ihn sodann der Weg knapp 300 Kilometer weiter südlich nach Eilat, einem beliebten Badeort mit einem 12 Kilometer langen Küstenabschnitt und gleichzeitig Israels einzigem Zugang zum Roten Meer. In der etwas weiter nördlich gelegenen Negev-Wüste kommt der im Alpinismus erfahrene Sebastian Ströbel dann voll auf seine Kosten. Beim Abseilen von einem Felsenturm im Ramon-Krater geht es ganze 30 Meter in die Tiefe: für den sportlichen Schauspieler absolut kein Problem. Überhaupt gibt es in der Wüste Negev eine Menge zu entdecken und so verbringt Sebastian Ströbel hier viel Zeit beim Mountain-Biking. Von besonderem Interesse sind für Ihn uralte Salzhöhlen und Minen, die schon in der Antike ausgebeutet wurden. Dabei genießt Sebastian bei süßem Tee die Gastfreundschaft der Beduinen. DE 2018'
- eventId:
  - 1000766
  - 673112
  start: 2026-10-25T20:45:00Z
  stop: 2026-10-25T21:05:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Taiwan mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 5 - Taiwan mit Eva Habermann
  description: Mit der Schauspielerin Eva Habermann begibt sich unser Team zunächst auf eine kurzweilige Tour durch Taipeh, das wirtschaftliche und politische Herz Taiwans. In der Hauptstadt der Republik - wie im ganzen Land - treffen jahrtausendealte chinesische Traditionen und japanische Kultur auf das moderne Hightech-Zeitalter. Zahlreiche Tempel, Klöster und Märkte prägen die Stadt, in Taipeh pulsiert das Leben. Anders als auf dem chinesischen Festland sind in Taiwan zahllose religiöse Bauten erhalten geblieben. Religion und Spiritualität gehören hier seit jeher zum Alltag, eine Kulturrevolution wie in der Volksrepublik hat es nicht gegeben. So ist es nicht verwunderlich, dass Eva Habermann ihre Reise mit einem Besuch in einem der ältesten Tempel des Landes beginnt. Die Insel besticht aber nicht nur durch kulturellen Reichtum, sondern auch durch landschaftliche und kulinarische Vielseitigkeit. Die Schauspielerin wandert auf einsamen Wegen über Hängebrücken durch die Taroko-Schlucht und unternimmt eine Fahrradtour am Sonne-Mond-See. Begleiten Sie Eva Habermann auf ihren Streifzügen über die bunten Straßen- und Nachtmärkte Taiwans. Tauchen Sie ein in die Welt der japanischen Badekultur und lassen Sie sich in die Jahrtausende alte chinesische Kunst der Kalligraphie einführen. DE 2015
- eventId:
  - 1000773
  - 673121
  start: 2026-10-25T21:10:00Z
  stop: 2026-10-25T21:39:00Z
  title: Foodwise - Shantou
  subtitle: Foodwise - Shantou
  description: Tianran und Hannah sind in Shantou in der südchinesischen Provinz Guangdong, wo sie mehr Tee trinken als irgendwo sonst im Land. Sie genießen das komplexe Aroma des Tees mit dem kuriosen Namen "Duck Poo Fragrance" und ein traditionelleres "Yum Cha"-Frühstück. Sie lernen traditionelles Kunsthandwerk kennen, vom Zerschlagen von Schalen für Porzellanintarsien bis zum Rollen von "Kueh"-Reiskuchen. Und sie genießen alles von süßen und herzhaften Straßensnacks bis hin zu feinsten Meeresfrüchten. CN 2023
- eventId:
  - 1000774
  - 673122
  start: 2026-10-25T21:45:00Z
  stop: 2026-10-25T22:14:00Z
  title: Foodwise - Shaoguan
  subtitle: Foodwise - Shaoguan
  description: Tianran und Hannah befinden sich in der malerischen Stadt Shaoguan in der Provinz Guangdong in Südchina. Sie probieren Tee aus der Danxia-Landschaft und genießen Bergprodukte, bevor sie in einem von einer Mauer umgebenen Hakka-Dorf selbst Reisnudeln zubereiten. Sie erfahren mehr über die Südwanderung der Hakka und ihre Auswirkungen auf den lokalen Tee und die lokale Küche. Ihre Reise endet in einem tausend Jahre alten buddhistischen Tempel. Dort erleben sie, wie die Mönche ihre Praxis in ihren Alltag integrieren und erfahren, warum Tee für Zen so wichtig ist. CN 2023
