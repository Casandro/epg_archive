  title: Die Alpen von oben - Vom Engadin zum Zürichsee
  subtitle: Die Alpen von oben - Vom Engadin zum Zürichsee
  description: 'Die Alpen von oben: Vom Engadin zum Zürichsee - Das Verhalten von Steinböcken wird im Schweizerischen Nationalpark erforscht, dem ältesten der Alpen. In Tarasp gibt es eine der letzten Zwergschulen der Schweiz. Im Nachbardorf braut Marc-Florian Geyer Bergbier, das inzwischen auch in St. Moritz Kultstatus erlangt hat. Eine Reise durch die Schweiz wäre undenkbar ohne das Postauto - Dorli Menn fährt seit mehr als 20 Jahren die Strecke nach Juf. Am Lago Maggiore interpretiert Koch Ivo Adam lokale Gerichte des Tessins. In den Flimser Bergen vollführt der Higliner Gian Sebregondi Kunststücke auf dem Seil - 200 Meter über dem Abgrund.  DE 2012'
