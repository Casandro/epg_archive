  title: VIP Trip - Prominente auf Reisen 4 - Chile mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 4 - Chile mit Jürgen Heinrich
  description: 'VIP Trip - Prominente auf Reisen 4: Begeben Sie sich mit VIP Trip auf eine Reise in ein Land der Vielfalt. Chile mag zwar ein schmales Land sein, doch zieht es sich mit einer Länge von 4300 Kilometern durch verschiedene Klimazonen an der südamerikanischen Pazifikküste: Von den Gletschern der Anden zu fast unberührten Stränden, von Küstenstädten durch  Regenwälder bis hin zur Atacama-Wüste. In Chile ist für jeden was dabei. Begleiten Sie Jürgen Heinrich bei seiner Reise durch das "Preußen Südamerikas".  Der Schauspieler begibt sich auf Entdeckungstour und folgt dabei den Spuren deutscher Einwanderer. Es stellt sich heraus: Chile ist ein Land mit großer kultureller Vielfalt, was allein schon an der chilenischen Küche ablesbar ist. In der Steppe Patagoniens trifft Jürgen Heinrich auf die legendären Gauchos, die Rinderhirten Südamerikas. Sie weisen ihm den Weg durch eine grandiose Natur, zu kargen, aber pittoresken Landschaften sowie zu entlegenen Wasserfällen. Auf den Pfaden deutscher Einwanderer gelangt der Schauspieler schließlich nach Puntas Arenas, in die wohl südlichste Großstadt der Welt. Die Hafenstadt ist Ausgangspunkt für Expeditionen in die Weiten Patagoniens und in die Antarktis. DE 2013'
