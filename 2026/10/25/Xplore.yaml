  title: VIP Trip - Prominente auf Reisen 6 - Kissimmee, Punta Gorda & Englewood Beach mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 6 - Kissimmee, Punta Gorda & Englewood Beach mit Richy Müller
  description: In dieser Reisereportage reisen wir nach Florida. Erstes Ziel unseres prominenten Reiseleiters Richy Müller ist Kissimmee. In der Region südlich von Orlando besucht der Stuttgarter Tatort-Kommissar das wunderschöne Celebration. Die kleine Stadt ist vor gut 50 Jahren als mögliche Erweiterung des nahegelegenen Walt Disney World Resorts erbaut und dann später privatisiert worden. Bei einer Kanutour können Richy und sein Team Alligatoren in freier Wildbahn beobachten. Mehr über die Tiere Floridas erfährt er dann im Naturpark "Wild Florida". Dort steht auch eine Fahrt mit einem sogenannten "Airboat" durch die Sumpflandschaften auf dem Programm. Zum Abschluss erklärt Richy Müller, warum Kissimmee auch Ferienhaus-Hauptstadt der Welt genannt wird und gewährt uns einen Blick in sein zeitweiliges Quartier. Der zweite Teil seiner Reise führt Richy Müller an die Golfküste nach Punta Gorda und Englewood Beach. Sein erster Programmpunkt ist ein Ausflug zum Hochseeangeln. Der umfangreiche Fang wird anschließend in einem der besten Fischrestaurants der Region fachmännisch zubereitet und serviert. Am nächsten Tag geht es auf die nahe gelegene Babcock-Ranch. Auf einer Tour durch das weitläufige Gelände lernt der Schauspieler viel über die einheimische Tier- und Pflanzenwelt. Danach erkundet er den historischen Teil Punta Gordas mit seinen schönen alten Gebäuden. Außerdem beobachtet Richy Müller bei einer Bootstour durch die Mangrovengebiete von Englewood Beach Alligatoren und Seekühe, die dort friedlich zusammenleben. US 2024
