  title: Bojs
  description: Jak se za poslední roky proměnila česká novinařina? Mají dnes novináři větší strach pouštět se do investigativy? A co o naší společnosti vypovídá současná politická kultura? Hostem nedělních Bojs byl novinář a fotograf David Macháček. Probrali jsme jeho novinářské začátky, proměnu médií i vztah politiků k novinářům. Dostali jsme se ale také k jeho černobílým fotografiím, autorské tvorbě a přátelství s kapelou Mňága a Žďorp.
