  description: Petr Wagner (kněz Církve československé husitské), Dominik Čejka ("progresivní něcista"), Klára Staňková (studentka filosofie a antropologie) a Fatima Rahimi (studentka oboru Dějiny a kultura islámských zemí) probírají události, ve kterých se společenská témata prolínají s náboženskými a naopak. Spolu s vybranými hosty z oboru religionistiky, teologie, sociologie či umění nabízí neortodoxní pohled na duchovní záležitosti v souvislosti s děním takzvaně světským.
