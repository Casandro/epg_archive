  title: Čelisti
  description: Čelisti tentokrát vysílají z fiktivní republiky Shadaloo a přinášejí pořádné Street Fighterské jokogeri keage. Vidí to Kluci z Čelistí jinak než holky? Je Clayface horší než blackface? Ovládá Aleše spíš Rozum, nebo cit? Chce být Vítek jako táta, nebo jako nepálský šerpský horolezec Tenzing Norgay? Funguje to ještě Tomákovi Tam dole? A hodlají Čelisti zůstat českém éteru Napořád? Šamšulka / cukříček / kuna. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal. (repríza)
