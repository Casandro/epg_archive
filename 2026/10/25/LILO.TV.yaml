  title: So schmeckt die Welt - Kitzbühel
  subtitle: So schmeckt die Welt - Kitzbühel
  description: Eine fesselnde Entdeckungsreise durch die trendige Stadt Kitzbühel, bei der kulinarische und kulturelle Genüsse im Mittelpunkt stehen. Die Legende dieser Stadt ist lebendig und ihre Bekanntheit weltweit anerkannt. Als einer der renommiertesten Skiorte zieht Kitzbühel auch zahlreiche Berühmtheiten an - sogar Arnold Schwarzenegger hat hier sein zweites Zuhause gefunden. In nur 45 Minuten erleben Sie den Zauber und die Faszination von Kitzbühel auf unterhaltsame Weise hautnah mit."
