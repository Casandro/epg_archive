  title: So schmeckt die Welt - Istanbul
  subtitle: So schmeckt die Welt - Istanbul
  description: 'Eine faszinierende und stylische Entdeckungsreise durch Istanbul offenbart eine beeindruckende Vielfalt. In dieser pulsierenden Stadt prallen unterschiedliche Welten aufeinander: streng konservative und zutiefst religiöse Menschen spazieren neben Hipstern und elegant gekleideten Frauen umher. Der Gegensatz der Kulturen und Lebensansichten ist in keiner anderen europäischen Metropole so deutlich wie hier, denn Istanbul ist gleichzeitig die größte Stadt Europas.'
  genre:
