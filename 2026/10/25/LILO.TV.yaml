  title: So schmeckt die Welt - Dresden
  subtitle: So schmeckt die Welt - Dresden
  description: Dresden wird nicht nur als Landeshauptstadt des Freistaates Sachsen betrachtet, sondern auch als Juwel an der Elbe bezeichnet. Diese Anerkennung verdankt die Stadt dem einstigen Herrscher August dem Starken, der ihr ein prächtiges Erscheinungsbild verlieh und somit einen Magnet schuf, dessen Anziehungskraft bis heute spürbar ist. Nach ihrer Entstehung aus den Trümmern hat sich die sächsische Metropole nach der Wende erneut im vollen Glanz präsentiert.
  genre:
  - '129'
  widescreen: true
