  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: 'Paul Krüger, 66, verwitwet, ehemaliger Profiringer, hat sich sein Leben klar eingerichtet: In seinem Berliner Bezirk soll alles so bleiben, wie es ist. Von Multi-Kulti hält er gar nichts. Seine Stammtischbrüder sehen das genauso. Und nun bekommt Paul auch noch eine ganz besondere Aufgabe: Er soll in die Türkei reisen, um seiner Enkelin Annie die Hochzeit mit Deniz aus Ankara auszureden. Gemeinsam mit Kneipenwirtin Karin macht sich Paul missmutig auf in die Fremde - und muss erkennen, dass seine Vorurteile einer dringenden Generalüberholung bedürfen.'
