  title: Klasika plus
  subtitle: Za sve ljubitelje klasike u najširem smislu, ovaj muzički sat mozaičnog tipa, sa podjednakim težištem na kompozitorima i izvođačima, nudi stilski i žanrovski najraznovrsniji sadržaj.
  description: Za sve ljubitelje klasike u najširem smislu, ovaj muzički sat mozaičnog tipa, sa podjednakim težištem na kompozitorima i izvođačima, nudi stilski i žanrovski najraznovrsniji sadržaj. Kvalitetni snimci, nova i arhivska izdanja domaćih i stranih umetnika, upotpunjeni su kratkim komentarima koji podsećaju na važne datume u istoriji muzike, osvetljavaju istorijski i socijalni kontekst perioda u kome je izabrana muzika nastala, kao i okolnosti koje su kompozitora podstakle na stvaranje. Zanimljivosti iz života umetnika, izjave i anegdote, neizostavni su segment emisije u čijem kreiranju imaju udela i slušaoci i pratioci emisija Klasiku, molim i Klasika plus na društvenim mrežama. Aktuelnosti ili teme koje privlače pažnju muzičke javnosti rezervisane su za rubriku "U fokusu".
