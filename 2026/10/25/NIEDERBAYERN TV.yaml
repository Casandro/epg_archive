  title: Mozartiade zu Mozarts 270. Geburtstag
  subtitle: Das erste Konzert der zweiteiligen Veranstaltungsreihe Mozartiade, die anlässlich des 270. Geburtstages von Wolfgang Amadeus Mozart im Landshuter Salzstadel stattfand.
  description: Die Aufzeichnung dokumentiert das erste Konzert der zweiteiligen Veranstaltungsreihe Mozartiade, die anlässlich des 270. Geburtstages von Wolfgang Amadeus Mozart im Landshuter Salzstadel stattfand. Das für diesen Spielort konzipierte Projekt des Musikwissenschaftlers und Violinisten Christoph Goldstein verband die Aufführung kammermusikalischer Werke mit einer biografischen und zeitgeschichtlichen Aufarbeitung von Mozarts Leben. Der Auftritt widmete sich thematisch dem spielerischen und geselligen Charakter von Mozarts Schaffensprozess.
