- eventId: 696462
  start: 2026-10-25T05:45:00Z
  stop: 2026-10-25T05:55:00Z
  title: Edgar, das Super-Karibu
  subtitle: Super-Edgar ist eifersüchtig
  description: 'Henry, der Röhrer und die Hirsch-Damen kommen nach Windhausen, um ihr neues Video zu drehen. Alle freuen sich, bis auf Super-Edgar: Seine kleine Freundin Gina spielt in dem Video mit, und sie spielt sogar die Geliebte von Henry, dem Röhrer! Super-Edgar ist ganz schön eifersüchtig, was sich allerdings als nicht sehr clever herausstellt.'
  genre:
  - '16'
- eventId: 696949
  start: 2026-10-25T05:55:00Z
  stop: 2026-10-25T06:10:00Z
  title: Edgar, das Super-Karibu
  subtitle: Der falsche Super-Edgar
  description: 'Vor dem Schlafengehen wäscht Super-Edgar seine Superheld-Kleidung. Aber als er am Morgen aufwacht, entdeckt er, dass seine Antriebsschläger und sein Anzug gestohlen wurden. Das ist zu peinlich: Super-Edgar im Pyjama! Schlimmer noch: Ein falscher Super-Edgar erscheint am Himmel und verursacht eine Katastrophe nach der anderen. Im Schlafanzug wird Super-Edgar diesen Hochstapler demaskieren müssen.'
  genre:
  - '16'
- eventId: 696976
  start: 2026-10-25T06:10:00Z
  stop: 2026-10-25T06:55:00Z
  title: Jane Austen - Literatur und Leidenschaft
  subtitle: Deutschland/Großbritannien 2025
  description: Die Karriere der britischen Schriftstellerin Jane Austen war beispielhaft. Die Hauptwerke der Autorin "Stolz und Vorurteil" und "Emma" zählen zu den Klassikern der englischen Literatur. Am 16. Dezember 2025 feiert Jane ihren 250. Geburtstag. Das mit leichter Hand erzählte Porträt zeigt sowohl die Welt der großartigen Schriftstellerin als auch die Welt ihrer Romane. Die Dokumentation lässt Historikerinnen und Historiker sowie Literaturwissenschaftlerinnen und Literaturwissenschaftler ebenso zu Wort kommen wie die begeisterte Leserschaft.
- eventId: 697037
  start: 2026-10-25T06:55:00Z
  stop: 2026-10-25T07:55:00Z
  title: Der Klang der Bücher
  subtitle: Literatur trifft Klassik
  description: Das wird tierisch! Das NDR Elbphilharmonie Orchester und der NDR Bücherpodcast "eat.READ.sleep" präsentieren im Kulturforum Lüneburg Geschichten von Tieren in Musik und Literatur. Eine Kammerbesetzung des Orchesters lässt bekannte Katzen, Vögel und Wölfe der Musikgeschichte zu Wort kommen. Die Podcast-Hosts Jan Ehlert und Daniel Kaiser berichten von Schweinen, Kaninchen und Hunden in der Weltliteratur. Musiker und Podcaster sind gemeinsam dem Klang der Bücher auf der Spur. Eine Aufzeichnung vom 4. April 2025.
- eventId: 697687
  start: 2026-10-25T07:55:00Z
  stop: 2026-10-25T08:00:00Z
  title: NDR Kultur - Das Konzert
