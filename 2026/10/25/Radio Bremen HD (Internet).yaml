- eventId: 678727
  start: 2026-10-25T00:15:00Z
  stop: 2026-10-25T00:45:00Z
  title: 'Die Nordreportage: Vom Kühlschiff zum Kulturschiff'
  subtitle: Die MS "Stubnitz" im Hamburger Hafen
  description: Die MS "Stubnitz", ein ehemaliges Kühlschiff der DDR-Fischfangflotte, Baujahr 1964, ist der einzige schwimmende Konzertsaal Hamburgs. Am Liegeplatz in der neuen Hafencity finden Konzerte statt, immer abseits vom Mainstream. Im ehemaligen Laderaum der "Stubnitz" finden bis zu 400 Konzertbesucher Platz. Etwa 20 freiwillige Helfer entrosten, malen und reparieren tagsüber, während schon der Soundcheck für das Abendprogramm läuft. Sorge bereitet ihnen allerdings, ob die MS "Stubnitz" in Hamburg auch dauerhaft einen Liegeplatz bekommt oder Opfer der Gentrifizierung wird.
  genre:
  - '112'
