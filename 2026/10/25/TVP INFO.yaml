    Tytuł oryginalny: Powstania śląskie... Muzyczne historie
    PL, 2020
    Reżyseria: Mirosław Basaj
    Występują: Stanisław Sojka, Grzegorz Płonka, Oberschlesien, Górnicza Orkiestra Dęta Bytom, Joanna Bartel, Józef Skrzek
    Powstania Śląskie to trzy konflikty zbrojne na Górnym Śląsku, które miały miejsce w latach 1919 - 1921 między ludnością polską i niemiecką. Odbyły się w okresie formowania się Państwa Polskiego po zakończeniu I wojny światowej. Pierwsze powstanie śląskie trwało od 16 sierpnia do 24 sierpnia 1919 r. Drugie powstanie śląskie od 19/20 sierpnia do 25 sierpnia 1920 r. Trzecie powstanie śląskie od 2/3 maja (już po plebiscycie) do 5 lipca 1921 r.
