    Stanisław Anioł dba o to, by zająć lokatorom każdą minutę. Przykładnie sprzątają klatkę schodową i teren wokół bloku, a wieczoryspędzają w suszarni, biorąc udział w próbach chóru. Dozorca przechodzisam siebie, mieszkańcy domu mają już dość jego tyranii. Majewski, Balcerek, Kołek, Kotek i prof. Dąb - Rozwadowski organizują spisek, w który wciągają prawie wszystkich. Pod pismem do prezesa spółdzielni o odwołanie Anioła podpisuje się mnóstwo osób, lecz prezes wita delegacjękpinami.
