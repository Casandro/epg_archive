  description: 'Im klaren, kalten Gebirgsbachwasser treibt die Forelle im Paradeis, heute treibt Zwei-Haubenkoch Josef Floh (Gasthaus Floh, Langenlebarn) sie ins Paradeis. Ein besonders einfaches Rezept, in dem das zarte Fleisch des wahrscheinlich bekanntesten heimischen Fischs besonders gut zur Geltung kommt. Besonders wichtig: die Forelle braucht ein gutes Gespür für Garzeit und Hitze. Wenn die beiden nicht passen, wird sie rasch trocken und der Spaß hat ein Ende. Eingelegt in heiße Paradeissauce kann so gut wie nichts passieren und sie bleibt saftig und zart. Tolle Technik aus der Haubenküche, einfach nachzumachen. AT 2019'
