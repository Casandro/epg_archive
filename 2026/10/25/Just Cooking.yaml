  title: Mein wunderbarer Kochsalon - Pasta mit Paradeisern, Melanzane und Ricotta
  subtitle: Mein wunderbarer Kochsalon - Pasta mit Paradeisern, Melanzane und Ricotta
  description: 'Die Sizilianer sind ein stolzes Volk. Das steht ihnen auch zu, vor allem, wenn es um diese Nudeln geht - Pasta alla Norma, ein echter Klassiker mit Paradeisern, Melanzane, Basilikum und Ricotta. Die Legende erzählt, dass diese Pasta zum ersten Mal am 26. Dezember 1831 in einem Gasthaus in Catania zubereitet wurde - zur Feier der Premiere von Vincenzo Bellinis Oper Norma. Das Werk des aus Catania stammenden Komponisten wurde an diesem Abend im Mailänder Teatro alla Scala zum ersten Mal aufgeführt und die ganze Stadt fieberte mit ihm mit. Völlig zurecht hat diese Komposition bis heute überlebt. Nicht nur ihr Geschmack ist ein starkes Argument, die Sizilianer fühlen sich von ihr in jeder Facette gut vertreten: Das frische Basilikum steht für das Grün des Landes, die Pasta für das Weiß der Gleichheit und die Tomaten für das Rot der Brüderlichkeit. Das Schwarz der Melanzane und das Weiß des Ricottas symbolisieren die von Lava oder von Schnee bedeckten Hänge des Ätna nahe der Stadt. AT 2019'
  ageRating: 6
- eventId: 1000739
  start: 2026-10-25T14:43:00Z
  stop: 2026-10-25T14:50:00Z
  title: Mein wunderbarer Kochsalon - BBQ-Sauce mit Kräuterbitter
  subtitle: Mein wunderbarer Kochsalon - BBQ-Sauce mit Kräuterbitter
  description: 'Fred Zehetner ist schwer zu beschreiben und schon gar nicht einzuordnen - ein unkonventioneller Mensch, der mit seiner Frau Daniela außerhalb von Laa an der Thaya Rinder nach den Richtlinien von Demeter züchtet. Sein Fleisch ist einzigartig und er versteht es auch, damit umzugehen. Wie zum Beispiel das Flank Steak, das wir in Wellen (jawohl) auf den Grill legen. Ich darf das Beiwerk beitragen: Underberg gibt es bei uns normalerweise immer nach dem Essen. Diesmal gibt es ihm dazu, und zwar im wahrsten Sinn: In einer BBQ-Sauce aus Speck und Chili schickt er das Ganze eine unvergleichliche Richtung. Unbedingt probieren! AT 2019'
