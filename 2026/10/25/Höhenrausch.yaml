  title: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  subtitle: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  description: 'Bergwelten: Es ist das einzige Land dieser Erde, in dem das Glück seiner Bewohner in der Verfassung verankert ist! BHUTAN: durch dieses kleine Königreich, eingebettet zwischen China und Indien, trekken die beiden Top-Alpinisten Heli Putz und Gerlinde Kaltenbrunner diesmal für BERGWELTEN und tauchen tief in dieses noch immer geheimnisvolle Land am Rande des Himalaya ein. Eine Reise von den Stromschnellen des Si Chhu, vorbei am Taktsang-Kloster, bis zum 7.326 Meter hohen Jomolhari. Mit jungen, einheimischen Abenteurern befährt Heli Putz die Stromschnellen des Si Chhu und mit lokalen Kletterfreaks gelingen ihm Erstbegehungen an den überhängenden Felsen von Thimphu. Wer nicht mit Pfeil und Bogen umzugehen vertsteht, ist kein echter Bhutaner. Bogenschießen ist Nationalsport in Bhutan, und Heli Putz darf außer Konkurrenz am Bogenturnier von Bhumtang teilnehmen. Mit Gerlinde Kaltenbrunner, die aus Nepal kommend auf das BERGWELTEN-Team trifft, trekkt Heli Putz schließlich zum 7.326 Meter hohen Jomolhari, dessen Gipfel - wie alle anderen Berggipfel in Bhutan auch - heilig ist und nicht bestiegen werden darf. Ein Verzicht, der diesem Abenteuer aber keinen Abbruch tut. Atemberaubende Bilder, auch aus dem Helikopter, zeigen eine Bergwelt von ausnehmender Schönheit und ein Land, dessen Menschen versuchen in Bescheidenheit glücklich zu sein. AT 2020'
- eventId: 1002607
  start: 2026-10-25T07:00:00Z
  stop: 2026-10-25T07:47:00Z
  title: Bergwelten - Serfaus - Fiss - Ladis
  subtitle: Bergwelten - Serfaus - Fiss - Ladis
  description: 'Bergwelten: Serfaus Fiss Ladis - Am Sonnenbalkon Tirols. Im Oberen Inntal, an der Grenze zum Schweizer Engadin, versteckt sich hoch über dem Fluss ein kleines Paradies. Das milde Hochplateau ist das Tor zu den Bergen der Samnaungruppe und ein Dorado für Bergsportler aller Disziplinen. Wanderwege führen bis zur Silvretta und über die Grenzberge in die Schweiz. Almböden, Moränenlandschaften, Bergseen - die Bergtouren rund um Serfaus, Fiss und Ladis bieten Gipfelglück und Entspannung, weit weg vom hektischen Alltag. Die Vielfalt des Hochplateau von Serfaus, Fiss und Ladis - Klettersteige, Wassersport, Alpakas, Fahrradtouren, Schmugglerrouten und vieles mehr. AT 2022'
- eventId: 1002608
  start: 2026-10-25T07:50:00Z
  stop: 2026-10-25T08:37:00Z
  title: Bergwelten - Trans Salzburgerland
  subtitle: Bergwelten - Trans Salzburgerland
  description: |-
    Bergwelten: Ski-Olympiasiegerin Viktoria Rebensburg und die Profi-Freeriderinnen Sabine Schipflinger und Sandra Lahnsteiner wagen eine hochwinterliche Ski-Durchquerung des Salzburgerlandes.
    Die Trans Salzburgerland ist ein Skitouren-Abenteuer von dem jeder träumt. Eine Olympiasiegerin und zwei Profi-Freeriderinnen wagen eine hochwinterliche Skidurchquerung von Sportgastein nach Hinterglemm. Viktoria Rebensburg, Sabine Schipflinger und die Freeride Pionierin Sandra Lahnsteiner kämpfen sich über Grate und Gletscher. Fünf Tage geht es durch die Berge ihrer Heimat. Nach den wildesten Abfahrten in aller Welt, entdecken sie jetzt die Berge ihrer Heimat auf der Trans-Salzburger Land. Und als Finale wartet der höchste Berg Österreichs. AT 2020
- eventId: 1002616
  start: 2026-10-25T08:40:00Z
  stop: 2026-10-25T09:25:00Z
  title: Bergwelten - Influencer - Vernetzt mit den Bergen
  subtitle: Bergwelten - Influencer - Vernetzt mit den Bergen
  description: |-
    Sie sind die Trendsetter unserer Zeit, verstehen sich als moderne Meinungsbildner: Influencer. Aus der digitalen Welt sind sie nicht mehr wegzudenken, ihre Erlebnisse unverhohlene und kaum bezahlbare Werbung. Auch für den Tourismus im Alpenraum. Wir begleiten sechs Influencer, die es es sich zur Aufgabe gemacht haben, ihr Leben in den Bergen mit der Welt zu teilen.
    Dabei stellt sich die Frage nach Authentizität. Sowohl, was die Erlebnisse an sich angeht, als auch die gestalterische Umsetzung: Wo liegt die Grenze zwischen Erleben und Inszenieren? Sind Soziale Medien nur ein Mittel zum Zweck - oder verhält es sich umgekehrt?
    Und was macht die Faszination überhaupt aus? Geht es um Inspiration, Stellvertreter-Erleben, während wir in unserer Komfortzone Latte-Macchiato schlürfen? Oder haben wir nur das Gefühl, ständig etwas zu verpassen?
    Im Film kommen wir so nah an die Influencer heran, wie sonst nie. Wir werfen einen Blick "hinter die Kulissen", sind mit dabei auf spektakulären Trips und bei der langwierigen Nachbearbeitung.
    Und erleben mit ihnen den täglichen Spagat zwischen Wunsch und Wirklichkeit. AT 2021
- eventId: 1000531
  start: 2026-10-25T09:25:00Z
  stop: 2026-10-25T10:11:00Z
  title: Bergwelten - Das Kitzsteinhorn - Mehr als ein Berg
  subtitle: Bergwelten - Das Kitzsteinhorn - Mehr als ein Berg
  description: Das 3.203 Meter hohe Kitzsteinhorn wacht als einer der schönsten Gipfel Österreichs über eine einzigartige Landschaft. Bergführer, Sportler und Wissenschaftler nehmen uns mit auf eine spannende Reise auf, an und in den Berg. Von den Stauseen in Kaprun geht es hinauf bis zum Gipfel des mächtigen Kitzsteinhorns. Auf dem Weg dorthin erleben wir die vier Klimazonen, die sich vom Fuß des Berges bis zum Gipfel erstrecken - und begleiten Sommer- und Wintersportler bei ihren Abenteuern. AT 2021
