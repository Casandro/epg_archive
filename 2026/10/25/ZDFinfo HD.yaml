  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2022
    La Merced de Buenos Aires in Ecuador liegt in den Anden, fast 3500 Meter über dem Meeresspiegel. In der abgelegenen Gegend wurden vor wenigen Jahren unglaubliche Goldvorkommen entdeckt.

    Doch die Arbeitsbedingungen sind extrem und die Angst vor dem Tod allgegenwärtig. Für ein paar Gramm Gold müssen die Bergleute immer wieder Leib und Leben riskieren. Die Schächte sind nicht gesichert, und starker Regen verursacht regelmäßig Erdrutsche am Berghang.
    HD-Produktion
