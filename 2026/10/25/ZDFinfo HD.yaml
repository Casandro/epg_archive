    Das Weltall ist unbegreiflich groß. Schwer zu glauben, dass sich das Leben auf die Erde beschränkt. Oscarpreisträger Morgan Freeman fragt: Sind wir die einzigen intelligenten Lebewesen?

    In diesem Mann leben Eindringlinge: Der Molekularbiologe Cedric Feschotte ist Spezialist für Genetik. Dass Viren und Bakterien seinen Körper bewohnen, ist für ihn eine triviale Erkenntnis. Aber es gibt da durchaus Fremdlinge, die auch ihm nicht geheuer sind.
