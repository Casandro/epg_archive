  subtitle: Boliviens berüchtigter Mega-Knast
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2022
    Palmasola ist das größte Gefängnis Boliviens. Doch obwohl dort die gefährlichsten Verbrecher des Landes eingesperrt sind, findet sich in der gesamten Haftanstalt kein einziger Wärter.

    Mehr als 5000 Gefangene leben in dieser Gefängnisstadt, die eigentlich nur für 800 Insassen gebaut wurde. Die Aufseher bewachen nur das Außengelände, innerhalb der Mauern sorgen die Disciplinas, eine Gruppe von Häftlingen, für Recht und Ordnung.
    HD-Produktion
