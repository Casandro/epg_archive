    Der Sinn des Lebens? Morgan Freeman fragt nach Geburt, Fortpflanzung und Tod. Führt dies - unendlich oft wiederholt - von den allerersten primitiven Lebensformen zu uns heute?

    Die theoretische Physikerin Sara Walker definiert die Funktion der Evolution anders: Immer noch mehr gesammelte und verarbeitete Daten führen durch immer schärfere Sinne und immer geschicktere Jagdwerkzeuge zu auch immer effektiverer Nahrungsverwertung.
