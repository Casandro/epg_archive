  description: Eine tief verwurzelte Rivalität, die seit über hundert Jahren andauert. Galatasaray, der stolze und große Club in Istanbul, der sich als Elite-Klub mit viel Sinn für Bildung versteht auf der europäischen Seite der Stadt - und Fenerbahce, der vermeintliche Underdog, der Galatasaray schon so oft ärgern und die Meisterschaft feiern konnte, beheimatet in Kadiköy, dem Stadtteil auf der asiatischen Seite des Bosporus. Aber woher kommt diese Rivalität? Ist sie tatsächlich nur in der Interkontinentalität begründet?
