  description: Das wird tierisch! Das NDR Elbphilharmonie Orchester und der NDR Bücherpodcast "eat.READ.sleep" präsentieren im Kulturforum Lüneburg Geschichten von Tieren in Musik und Literatur. Eine Kammerbesetzung des Orchesters lässt bekannte Katzen, Vögel und Wölfe der Musikgeschichte zu Wort kommen. Die Podcast-Hosts Jan Ehlert und Daniel Kaiser berichten von Schweinen, Kaninchen und Hunden in der Weltliteratur. Musiker und Podcaster sind gemeinsam dem Klang der Bücher auf der Spur. Eine Aufzeichnung vom 4. April 2025.
