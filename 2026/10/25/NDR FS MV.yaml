  description: Die Karriere der britischen Schriftstellerin Jane Austen war beispielhaft. Die Hauptwerke der Autorin "Stolz und Vorurteil" und "Emma" zählen zu den Klassikern der englischen Literatur. Am 16. Dezember 2025 feiert Jane ihren 250. Geburtstag. Das mit leichter Hand erzählte Porträt zeigt sowohl die Welt der großartigen Schriftstellerin als auch die Welt ihrer Romane. Die Dokumentation lässt Historikerinnen und Historiker sowie Literaturwissenschaftlerinnen und Literaturwissenschaftler ebenso zu Wort kommen wie die begeisterte Leserschaft.
