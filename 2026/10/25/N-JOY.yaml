  title: Flexikon
  description: |-
    Diese Laber-Sendung mit Bildungsauftrag versorgt Euch mit Klugscheißerwissen, mit dem Ihr ordentlich flexen könnt.
    Die Hosts Steffi Banowski und Anne Raddatz suchen für Euch nach Antworten auf Fragen, die Ihr Euch unbedingt mal stellen solltet: Wie lügt man glaubwürdig? Wie werde ich InfluencerIn? Wie mache ich Schluss, ohne gehasst zu werden? Und sind die Leute im Swingerclub wirklich so sexy wie auf den Werbetafeln? Steffi und Anne sprechen getrennt voneinander mit ExpertInnen und präsentieren sich und Euch die Ergebnisse. Ein Thema, verschiedene Sichtweisen. Hört Euch schlau!
