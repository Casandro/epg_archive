  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: Kad se dogodi vijest o prikrivanju seksualnog zlostavljanja od strane crkvenog službenika, kako ostati svećenik i imati povjerenje naroda? Kako dalje kada svi postanu ,,krivi zbog grijeha nekolicine? Zašto žrtve ponekad mijenjaju iskaz? Je li moguće prepoznati manipulacije zlostavljača? Kako spriječiti da netko tko je u djetinjstvu ili mladosti zlostavljan i sam postane zlostavljač? Gost emisije je izv. prof. dr. sc. Josip Bošnjaković, predsjednik Hrvatskog društva bračnih i obiteljskih savjetovatelja (HRD BiOS), svećenik i psihoterapeut.
