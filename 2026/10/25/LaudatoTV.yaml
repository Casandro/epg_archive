  title: odaziv
  subtitle: Magazin
  description: Ako je cijeli naš život sveden na ispit iz dvije zapovijedi - Ljubi Boga i bližnjega - prolazimo li ili padamo na tom ispitu? Kako se ljubi srcem, dušom i umom? Ima li ljubav veze s razumom? Je li dovoljno u vjeri samo se dobro osjećati? Kakav odnos imati prema sebi da ne upadnemu u zamku sebeljublja? Koga je najteže, a koga najlakše ljubiti? U ,,Odazivu 25. listopada govorimo o dva lica jedne ljubavi. Evanđelje 30. nedjelje kroz godinu tumači vlč. Marko Vuković.
