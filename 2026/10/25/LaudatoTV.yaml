  title: Neka nam Bog pomogne 5, serija
  subtitle: Komedija/Drama
  description: 'Teodora, majka blizanaca, vraća se u samostan sa šokantnim vijestima za Gabriele. Dok Marie nema u samostanu, Ginevra i Nico provode dosta vremena zajedno... U međuvremenu, Valentina je zauzeta pomaganjem Eugeniji da ispuni svoj san o susretu s Benjijem i Fedeom. Uz pomoć sestre Costanze, Azzurra čini sve što je u njenoj moći da izbjegne iskušenje: da ne koristi kreditnu karticu koju je Athos zaboravio u samostanu.'
