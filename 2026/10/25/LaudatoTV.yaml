- eventId: 917038
  start: 2026-10-25T02:00:00Z
  stop: 2026-10-25T03:00:00Z
  title: Blagoslovljen tek
  subtitle: Religijski
  description: Rafo odlazi u jednu posebnu kućicu u kojoj vrijeme kao da je stalo. U njoj se čuvaju stare stvari, priče, riječi i običaji jednog kraja. Tamo ga dočekuju Josip Kobasić Švrćo i gospođa Dragica Ljevar koji s posebnom ljubavlju čuvaju duh starog Markuševca. Članovi su Hrvatskog umjetničkog društva Prigorec, a s njima razgovaramo o životu nekad, obitelji, vjeri, tradiciji, starim jelima i svemu onome što jedan dom i jedan stol čini blagoslovljenim.
- eventId: 917041
  start: 2026-10-25T03:00:00Z
  stop: 2026-10-25T03:39:00Z
  title: Čovjek prije svega
  subtitle: Magazin
  description: Kao dječak želio je biti pilot. Kasnije je bio vojnik, stolar, svirao bas-gitaru, nastupao, razmišljao o glazbi kao mogućem životnom putu i zamišljao vlastitu obitelj. Svećeništvo je u njemu samo tinjalo. Do trenutka kada je moralo doći u prvi plan! U novoj epizodi serijala ''Čovjek prije svega  upoznajemo vlč. Tihomira Koseca - svećenika koji i danas svira, sklada, voli rock, zna se našaliti na vlastiti račun i otvoreno govori o putu koji nije uvijek bio jednostavan.
- eventId: 917042
  start: 2026-10-25T03:39:00Z
  stop: 2026-10-25T04:25:00Z
  title: Susret u riječi
  subtitle: Religijski
  description: U novoj emisiji ugošćujemo književnika Srećka Ilića, autora čiji su život i stvaralaštvo duboko povezani s dolinom Neretve. Rođen u Metkoviću, a odrastao u Vidu, Ilić u svojim djelima vjerno oživljava duh, tradiciju i humor rodnoga kraja. Široj publici predstavio se zbirkom "Smij naš svagdašnji" (2003.), a tri godine nakon toga objavljuje i knjigu "Zgode s kamena i vode" (2006.). Pridružite nam se u toplom razgovoru o njegovu životnom i književnom putu od neretvanskih obala, preko Splita, pa sve do Zagreba u kojem danas živi i stvara.
