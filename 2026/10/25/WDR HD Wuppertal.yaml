  description: Das Anwesen dient als Kulisse für eine Hochzeitsfeier. Weil Emma und Felix dringend auf das Geld angewiesen sind, geben sie alles, damit das Event ein Erfolg wird und unterstützen den Hochzeitsplaner Tim nach Kräften. Doch am großen Tag bekommt die Braut kalte Füße - die Hochzeit droht zu platzen. Und auch Emma und Felix stürzen in eine tiefe Beziehungskrise. Die Geister sind gefragt, ihre volle Unterstützung zu geben.
