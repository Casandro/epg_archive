  title: Planet Weltweit - Kambodscha - Die Seele der Seide
  subtitle: Planet Weltweit - Kambodscha - Die Seele der Seide
  description: 'Der Japaner Kikuo Morimoto fördert in Kambodscha die traditionelle Webkunst und verschafft mit der Anpflanzung von Maulbeerbäumen und der Herstellung hochwertiger Seidenstoffe Hunderten von Menschen ein Einkommen. Er geht wie jeden Morgen durch die Reihen der 300 Frauen, die in seiner Seiden-Weberei arbeiten. Der ehemalige Kimonomaler war vor 15 Jahren, bei seiner ersten Reise nach Phnom Penh, auf die Spur der fast ausgelöschten Tradition der Seidenweberei gestoßen. Ausgelöscht während der Diktatur der Roten Khmer und dem nachfolgenden Bürgerkrieg, unter dem Kambodscha jahrzehntelang gelitten hat.  Für ihr Ziel, den neuen Menschen zu schaffen, zertrümmerten die Roten Khmer im Namen eines Steinzeit-Kommunismus alles Geistige und Sinnliche im Lande. Damit verschwand beinahe auch die einmalige Kunst der Seidenherstellung. Morimoto grub die alten Rezepturen des Färbens wieder aus: rot aus dem Saft der Lackschildläuse, braun vom Sud der Kokosnussschalen, grau durch die ausgekochten Äste des Lychee-Baums. Und er studierte die in Vergessenheit geratenen, über 1200 Jahre alten Muster. 1996 gründete er schließlich eine Weberei. Im ganzen Land konnte er nur noch ein Dutzend Weberinnen aufspüren und für sein Projekt begeistern. Sie verließen ihre Dörfer und zogen mit ihm nach Siem Reap, die Touristenstadt vor den Toren Angkors, im Nordwesten Kambodschas. Heute sind sie die Seele der Weberei und vermitteln ihr Wissen an jüngere Frauen weiter. Obwohl seit 1999 Frieden herrscht, ist die schreckliche Zeit für viele dieser Frauen immer noch gegenwärtig, so wie für Phorn Loan. Sie versorgt vier Kinder und einen vom Krieg psychisch gezeichneten Ehemann. Vor drei Monaten hat Morimoto die schüchterne Phorn Loan angestellt. Mit 37 Jahren lernt sie nun zum ersten Mal einen Beruf und sieht für sich und ihre Familie eine Zukunft. DE 2005'
