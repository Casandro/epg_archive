  title: Rund um den Globus - Lamu - Die Insel der Esel
  subtitle: Rund um den Globus - Lamu - Die Insel der Esel
  description: Die nur zehn mal sechs Kilometer kleine Insel Lamu liegt im Osten Afrikas, direkt an der kenianischen Küste im Indischen Ozean. Dort sieht man Esel, wohin man schaut. 6.000 Tiere teilen sich die Insel mit 20.000 Menschen, und nur zwei Autos. Shee Famaos Familie besitzt als eine der wenigen keinen Esel. Der 14-Jährige lebt mit seiner Mutter und seinen Geschwistern in einem kleinen Dorf. Die Familie ist arm und lebt von dem, was sie auf dem eigenen Acker anbaut. Obwohl Shee erst 14 Jahre alt ist und noch zur Schule geht, muss er schon arbeiten wie ein Erwachsener. Shees größter Traum ist es, einen eigenen Esel zu besitzen. Denn mit einem eigenen Esel könnte er sich eine richtige Arbeit suchen und Geld für seine Familie verdienen. Beim großen Eselrennen von Lamu, das immer wieder auch Touristen anzieht, könnte Shee einen Esel gewinnen, wenn er den ersten Platz belegt ' DE 2013
- eventId: 1000745
