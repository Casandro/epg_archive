  description: "Eishockey in 3.500 Metern Höhe - in der indischen Provinz Ladakh wird seit Jahrzehnten in den Wintermonaten dem Puk hinterhergejagt. \nVor allem von Männern aus der Armee, die hier die Grenzen zu China und Pakistan sichern. Doch in diese Männerwelt drängen immer mehr Frauen \nund Mädchen.  \n\n DE 2011"
