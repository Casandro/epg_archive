- eventId: 1000767
  start: 2026-10-25T08:10:00Z
  stop: 2026-10-25T09:01:00Z
  title: Planet Weltweit - Kuba, der Dreh mit der Orgel
  subtitle: Planet Weltweit - Kuba, der Dreh mit der Orgel
  description: |-
    Kuba - berühmt für Rum, Zigarren und Musik. Einer der wichtigsten traditionellen Musikstile Kubas ist vielen Ausländern jedoch bis heute kaum bekannt: die sogenannte "Música molida", die gemahlene Musik. Erzeugt wird sie von Orgelspielern mit riesigen Lochstreifenorgeln im Zusammenspiel mit einer kompletten Begleitband. Regelmäßig treten sie im vergessen und rückständig wirkenden Südosten der Insel auf Dorffesten auf. Die Reportage hat sich unter die Fiesta-Gäste gemischt.
    Während an den kulturellen und landschaftlichen Hotspots - wie in Havanna, Santiago de Cuba oder Varadero - der Tourismus boomt, verschlägt es kaum jemanden in diese vergessene Region weitab der Touristenrouten. Die Provinz Granma ist zwar historisch bedeutend. Hier landete Fidel Castro aus dem mexikanischen Exil kommend mit dem Schiff "Granma" und startete die Revolution. Aber heute ist die Gegend zwischen den Bergen der Sierra Maestra und dem Golf von Guacanayabo wirtschaftlich nur noch bedeutend für den Anbau von Zuckerrohr und die Verarbeitung zu Rohrzucker sowie für Fischfang. Fast vergessen ist die Rolle der Region für die Musikkultur Kubas: Die Lochkartendrehorgeln, zunächst aus Frankreich importiert, heißen in ganz Kuba "órganos orientales", weil sie hier im Osten der Insel ihre Blüte erlebt haben und in einigen Orten die Straßen-Fiestas noch immer prägen. 1,5 Tonnen schwer ist die Orgel "El Mulato Oriental" - wenn das Ungetüm auf Reisen geht, bedeutet das für die Musiker um den Direktor Roberto Luis Ramos, genannt Luisito, harte körperliche Arbeit. Leichtfüßig wird es dann später, wenn die Musik erklingt, die die Menschen hier, fernab der Touristenzentren, so sehr lieben.
     DE 2017
- eventId: 1000772
  start: 2026-10-25T09:10:00Z
  stop: 2026-10-25T10:02:00Z
  title: Planet Weltweit - Marokko, die andere Seite des Paradieses
  subtitle: Planet Weltweit - Marokko, die andere Seite des Paradieses
  description: 'Früher Morgen in der Medina von Fés - der schönsten und größten Stadt von ganz Marokko. In einer kleinen Wohnung sitzt Simohamed El Ouzzani mit seiner Frau Nadja beim Frühstück. Zeit zum Essen wird der schmächtige Mann mit den lebhaften, dunklen Augen an diesem Tag nicht mehr haben. Simohamed ist einer der letzten traditionellen Gerber von Fés und der beste, wie er selbst sagt. Es ist ein Knochenjob, doch Simohamed liebt ihn, zumal das traditionelle Gerberhandwerk Marokkos vom Aussterben bedroht ist. Die Dokumentation ist in die Medina von Fés eingetaucht und hat sich an die Fersen eines bemerkenswerten Mannes geheftet. Ein Markt für Tierfelle vor den Toren der marokkanischen Stadt Fés. Seit Tausenden Jahren blüht hier das traditionelle Handwerk. Berge von Fellen liegen aufeinandergestapelt, ein bestialischer Gestank erfüllt die Luft. Simohamed verarbeitet nur Ziegenfelle - lange dreht und wendet er jedes einzelne Fell, ob es seinen Ansprüchen genügt. Denn nur aus einem einwandfreien Fell kann auch ein ganz besonderes Leder werden. Wenige Stunden später steht der schmächtige Mann mit den kräftigen Oberarmen in ätzender Lauge in den Gerberhallen von Fés. Er benutzt keine chemischen Gerbmittel - darauf ist er besonders stolz. In einer Lauge aus Gips müssen die Felle etliche Mal gewaschen werden, bis alle Haare sich gelöst haben. Danach muss es in einer speziellen Lauge aus Taubenmist erneut gewaschen und danach getrocknet werden. Bis zu drei Monate dauert die Herstellung seiner Felle. "Sie sind weich wie Pfannkuchen" strahlt der kleine Mann, wenn es endlich zum Verkauf seiner Leder geht. In nur zehn Minuten wird er alle Leder los - kaum jemand stellt noch solche hochwertigen Rohstoffe her. In einem Land, dessen Handwerk zunehmend vom Aussterben bedroht ist: Immer mehr Billigwaren aus China kommen über Schmugglerkanäle auch auf die traditionellen Märkte der Medina. DE 2010'
- eventId: 1000776
  start: 2026-10-25T10:10:00Z
  stop: 2026-10-25T11:02:00Z
  title: Planet Weltweit - Die Verwandlungskünstler von Dakar
  subtitle: Planet Weltweit - Die Verwandlungskünstler von Dakar
  description: 'Dakar, die Hauptstadt Senegals: Hier zu überleben, ist für viele Menschen eine Frage der Improvisation. In vielen Vierteln hat die Not einen ganz eigenen Boom hervorgebracht: Die Menschen sammeln, was andere weggeworfen haben - und wandeln diese Abfälle in "Neues" um. Wir zeigen, wie alte Konservendosen in Spielzeugautos, Lampen und Koffer verwandelt werden, Kronkorken in Körbe, Motoren in Kochtöpfe, Autoreifen in Eimer. So entstehen Gebrauchsgegenstände, aber auch Spielzeuge und Möbelstücke, die in Europa bereits als Kleinkunst gehandelt werden. Der 31-Jährige Malick Mbaye weiß zu schätzen, was andere Menschen wegwerfen: Büchsen, Dosen und Flaschendeckel - oder alte Paletten. Zusammen mit seinem Kompagnon Alassane Diop, 26, bastelt er daraus mit meist improvisierten Werkzeugen Kommoden, Koffer oder Gießkannen, aber auch Spielzeug. Sogar aus Europa erhalten die beiden inzwischen Aufträge. Mit ihrer kleinen Werkstatt "Soweto Village" können sie ihre Eltern und Geschwister ernähren, für eigene Familien allerdings reicht das bescheidene Einkommen nicht. Lebenstraum der beiden ist es, eines Tages alle Freunde und Verwandte beschäftigen zu können.Schon jetzt ist ihre Veranda sozialer Mittelpunkt der Nachbarschaft. Ganze Stadtteile Dakars leben von der Müll-Verwandlung. Aus Mangel an erschwinglichen Materialien ist selbst in der bildenden Kunst eine Recycling-Strömung entstanden, die längst international Beachtung findet. Die meisten Menschen jedoch können durch den Müll gerade ihr Überleben sichern, auf der benachbarten Müllkippe suchen Männer, Frauen und Kinder nach Wiederverwertbarem, das sie in einem angrenzenden Dorf an Händler verkaufen. Da die Verwandlungswirtschaft für viele Menschen die einzige Möglichkeit ist, ihre Existenz zu sichern, hat eine Entwicklungshilfeorganisation die Schule "Ecopole" gegründet, in der Kinder und Jugendliche in Recycling-Handwerken ausgebildet werden. DE 2004'
- eventId: 1000777
  start: 2026-10-25T11:10:00Z
  stop: 2026-10-25T12:02:00Z
  title: Planet Weltweit - Die Oldtimer von Curaçao
  subtitle: Planet Weltweit - Die Oldtimer von Curaçao
  description: |-
    Wer auf der Karibik-Insel Curaçao ein Auto besitzt, das mindestens 30 Jahre alt ist, kann ganz offiziell ein sogenannter 'Wabi-Boy' werden. Der Wabi-Club mit seinen über 100 Mitgliedern ist einer der ältesten Oldtimerclubs in der Karibik. Es gibt ihn schon seit 1965.
    Sonne, Sand, Hitze und jede Menge Wind - das karibische Klima auf Curaçao ist eigentlich nicht geeignet für die empfindlichen, in die Jahre gekommenen Autoklassiker. Doch ausgerechnet auf der Insel, die viele nur vom 'Blue Curacao'-Likör kennen, spielen Autos eine ganz große Rolle. Kein Wunder, dass es auf Curacao den wahrscheinlich ältesten Oldtimerclub der Karibik gibt - den Wabi-Club. Bei den Clubtreffen kommen alle Mitglieder zusammen und präsentieren ihre liebevoll restaurierten Wagen. Wir haben den Club und seine Mitglieder besucht.
     DE 2015
- eventId: 1000784
  start: 2026-10-25T12:10:00Z
  stop: 2026-10-25T13:02:00Z
  title: Planet Weltweit - Die Kämpferinnen von Mexiko
  subtitle: Planet Weltweit - Die Kämpferinnen von Mexiko
  description: Lady Warrior nennt sie sich, die Frau hinter der schwarz-silbernen Maske. Von ihren Fans wird sie verehrt als aufsteigender Stern des Lucha Libre, des mexikanischen Catchens. Doch kaum einer weiß, wer sie wirklich ist. Niemand kennt ihr Gesicht, niemand ihren wirklichen Namen. Und doch schafft sie es, ein immer größeres Publikum um sich zu scharen. Jetzt versucht die alleinerziehende Mutter von zwei Töchtern in die Oberliga der Lucha Libre zu gelangen. Wir begleiten sie zu ihren spektakulären Kämpfen vor kreischendem Publikum. In den mexikanischen Arenas des Lucha Libre kämpft immer das Gute gegen das Schlechte. "Lady Warrior" ist eine "Ruda", sie verkörpert das Böse und greift auch mal auf eigentlich verbotene Kampf-Tricks zurück, dann tobt ihr Publikum! Lucha Libre ist die populärste aller Sportarten in Mexiko, beliebter noch als Fußball. Fast ein Viertel aller Kämpfer sind Frauen. Es ist grelles Volkstheater, vor allem für die ärmeren Schichten. Ganze Familienclans strömen mindestens einmal pro Woche in die Arenen - vom Kind bis zu 80-jährigen Greisinnen. Zu den schrillen maskierten Kämpfern zählt sogar ein Priester. Beim Lucha Libre dürfen Kämpfer wie Zuschauer Grenzen überschreiten, fluchen und obszöne Gesten machen, die sonst im Alltag verpönt sind. "Schimpfworte sind für mich Komplimente", sagt die Lady, die eigentlich gar keine ist, "das bedeutet, dass meine Rolle als Böse, als "Ruda", funktioniert. Eigentlich heißt sie Enedina Molina. Der Weg der Verwandlung zu "Lady Warrior" war nicht leicht. Ihr ganzes Leben lang war Enedina von der Magie des Lucha Libre fasziniert. Als 17-Jährige fasste sie dann gegen den Willen ihres Vaters den Entschluss, selber Kämpferin zu werden. Heute verdient sie tagsüber als Obstschälerin das Geld für sich und ihre zwei Töchter, am Abend steht sie maskiert als "Lady Warrior" im Ring. DE 2008
- eventId: 1000792
  start: 2026-10-25T13:10:00Z
  stop: 2026-10-25T14:02:00Z
  title: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  subtitle: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  description: "Bachit ist ein cleverer Hirte. Längst hat der 40-jährige Kirgise begriffen, dass sich etwas  Entscheidendes verändert in seiner Heimat, dem an der Grenze zu China gelegenen Tien Shan Gebirge:  Die bis zu 7000 Meter hohen Gipfel tauen rasant im Vergleich zu früheren Jahrzehnten. Eine Folge  der Klimaerwärmung, mit noch ungeahnten globalen Auswirkungen. Bachit hat sich auf die neue  Situation eingestellt: Seit mehreren Jahren treibt er im Mai seine riesige Viehherde aus dem Dorf  auf eine 3000 Meter hohe Sommeralm - und ist dabei zunehmend Schwierigkeiten ausgesetzt. \n\nDer Kirgise Bachit lebt von der traditionellen Weidewirtschaft. Die Wiesen rund um die Dörfer sind  nach dem Winter abgefressen und die Tiere müssen auf neues Land geführt  werden. Darum treibt  Bachit jedes Jahr im Mai seine Herden aus Kühen, Schafen, Pferden und Yaks zusammen, und zieht auf  eine 3000 Meter hoch gelegene Sommerweide. Denn Dank der Klimaerwärmung sind heute auch die hoch  gelegenen Almen begrünt. Auf zwei uralten, voll beladenen LKW, die dem langsamer ziehenden  Viehtreck vorausfahren, ist der gesamte Hausrat verschnürt. Bachit und seine Männer geleiten die  Herde über 120 Kilometer   bergauf.  Viele der Jungtiere verletzen sich auf der Strecke und müssen  den Rest des Weges auf dem LKW transportiert werden. Besonders gefährlich ist die Überquerung der  reißenden Gebirgsströme, deren Wassermassen wegen der rasant schmelzenden Gletscher von Jahr zu  Jahr zunehmen. Vier Monate lang lässt der Hirte seine Herden auf den Hochalmen des Tien Shan  Gebirges weiden, bevor der ganze Treck wieder hinab ins Tal steigt, um im Dorf zu überwintern. Für  Bachit macht sich das Nomadenleben nach alter kirgisischer Tradition bezahlt.  Er hat die  klimatischen Veränderungen als Chance gesehen und ist darüber ein wohlhabender Mann geworden. Doch  auch er fragt sich: Wie wird sich das Fortschreiten der Gletscherschmelze zukünftig auswirken?  DE 2009"
