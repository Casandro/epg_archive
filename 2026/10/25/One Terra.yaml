  title: Planet Weltweit - New York - Die kleinste Oper der Welt
  subtitle: Planet Weltweit - New York - Die kleinste Oper der Welt
  description: New York - Sehnsuchtsort für Menschen aus der ganzen Welt. Wer es hier schafft, schafft es überall. Das dachte auch junge italienische Fleischersohn Tony Amato, als er in den 1940er Jahren hierher kam, um sich den Traum vom eigenen Opernhaus zu verwirklichen. Zusammen mit seiner Frau Sally kaufte er ein heruntergekommenes Haus in der Bowery Street, einer damals berüchtigten Straße in Lower Manhattan. Das Haus, drei Stockwerke hoch und drei Fenster breit, bekam eine Bühne, einen Orchestergraben, einen Kostümfundus, Werkstätten und Lagerräume für die Bühnendekorationen. Der Saal wirkt kaum größer als ein Wohnzimmer - seine 107 Plätze sind immer ausverkauft. Noch immer ist Tony Amato Dreh- und Angelpunkt dieser Miniaturoper - selbst nur knapp 1,50 groß, in Turnschuhen. Hosenträger halten den kleinen drahtigen Mann, so scheint es. Die Stimme ist fest, die Augen strahlen. Er dirigiert, singt, springt, lacht, schimpft. Maestro Tony Amato ist 88 Jahre alt. Er steckt mitten in den Proben zu "Così fan tutte", der letzten Produktion der Saison.  Feierabendverkehr in Manhattan. Am Steuer seines Wagens sitzt der Tenor Vincent Titone und singt sich warm. Er ist auf dem Weg in die Amato Oper - dem kleinsten Opernhaus der Welt. Nur diesen einen Tag wird er mit den Kollegen und Maestro Amato proben - dann ist schon Premiere von "Cosí fan tutte", der letzten Inszenierung in dieser Saison. Im Opernhaus herrscht Hochbetrieb. Gestern Abend lief noch die letzte Vorstellung von Verdis "Il Trovatore", heute muss die Kulisse für die Premiere der Mozartoper eingebaut werden. Und dann ist in zwei Tagen auch noch die Feier zum 60-jährigen Jubiläum der Oper. So lange ist sie schon ein Ort für Träumer und Talente, zukünftige Profis und ewige Amateure. Die Künstler, die hier singen und musizieren, sind im Alltag Büroangestellte, Informatiker, Ärzte. Am Abend verwandeln sie sich zu umjubelten Opernhelden. DE 2008
