  title: Rund um den Globus - Die Glücksvögel von Buthan
  subtitle: Rund um den Globus - Die Glücksvögel von Buthan
  description: Im Königreich Bhutan, mitten im Himalaya, gelten Kraniche als "Vögel des Glücks". Das Phobjikha-Tal, tief im Inneren des Landes, ist ihr Winterquartier. Seit Monaten war kein Ruf der Tiere zu hören. Der elfjährige Karma, der mit seiner Familie im Phobjikha-Tal lebt, wartet schon sehnsüchtig auf die Zugvögel. Er ist ein wahrer Kranich-Fan. Dann sind die beliebten Kraniche endlich da! Karma verbringt jede freie Minute mit dem Biologen Jigme und beobachtet die Tiere.  DE 2011
- eventId: 1000756
  start: 2026-10-25T05:30:00Z
  stop: 2026-10-25T06:10:00Z
  title: Planet Weltweit - Friaul, Benvenuti im Musiktal
  subtitle: Planet Weltweit - Friaul, Benvenuti im Musiktal
  description: 'Das Resiatal in den julischen Alpen ist die Heimat einer der kleinsten Minderheiten Europas. Bis heute haben die Resianer eine eigene Kultur bewahrt, die sich hauptsächlich in ihren Liedern und Tänzen ausdrückt. Doch der Fortschritt hält auch hier Einzug, Traditionen gehen verloren. Weil im Resiatal nichts verschriftlicht wurde, ist die Kultur massiv bedroht. Inzwischen haben das auch die Einwohner begriffen und den Kampf gegen das Vergessen aufgenommen. GEO Reportage hat das Tal und seine Menschen besucht. Federico Lonardi ist vor einem Jahr ins Resiatal gekommen, normalerweise geht der Trend den umgekehrten Weg: Menschen verlassen die Gegend auf der Suche nach Arbeit und Fortschritt. Damit sinkt auch die Zahl der Einwohner, welche die Sprache sprechen und die Gesänge und Tänze der Region beherrschen. Neuankömmlinge wie Federico sind deshalb gern gesehen. Noch dazu, wenn er sich für die Musik des Tales interessiert und zum erklärten Ziel hat, Geige spielen zu können wie die großen Musiker des Tales. Ein anspruchsvolles Unterfangen, denn die Musikanten konnten etwa tausend Tänze aus dem Kopf spielen, Federico bisher gerade mal fünf. Während an den Schulen die Sprache und Musik wieder gelehrt und gelebt werden, versucht der Musikwissenschaftler Roberto Frisano dem Ursprung der Musik auf den Grund zu kommen. Fündig wurde er in Ljubljana, der Hauptstadt der benachbarten Republik Slowenien. Nicht alle Resianer sind mit seiner Entdeckung glücklich, Sprachwissenschaftler vermuten seit einiger Zeit eine Verwandtschaft zwischen dem Resianischen und dem Slowenischen. Was bei vielen Einwohnern Angst vor einer Vereinnahmung durch den slowenischen Staat schürt. So droht dem Tal neben dem Verschwinden der Traditionen ein Kulturkampf. Federico indes hält weiter an seiner Vision der überdauernden Musik fest. Im August findet das Scherenschleiferfest, die bedeutendste Feierlichkeit der Region, statt. Dort will er seine Geigenkünste erstmals der Öffentlichkeit präsentieren. DE 2017'
- eventId: 1000758
  start: 2026-10-25T06:10:00Z
  stop: 2026-10-25T07:02:00Z
  title: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  subtitle: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  description: '"Der Erfolg steckt in guten Schuhen." Nirgendwo scheint diese alte chinesische Weisheit zutreffender als in Wenzhou. In der Hafenstadt werden fast alle in China hergestellten Brillen, Rasierer, Schlüssel, Schlösser und 80 Prozent aller weltweit verkauften Feuerzeuge produziert. Vor allem aber ist Wenzhou die Welthauptstadt der Schuhe. Nirgendwo werden mehr Schuhe hergestellt als hier. Doch die Branche gerät an ihre Grenzen. Schon längst werden in Wenzhou hergestellte Schuhe zu teuer. Unternehmer wie der Fabrikant Jian Ping Wang liebäugeln deshalb mit Niederlassungen in Afrika, wo die Produktion billiger ist.  Die Bewohner der ostchinesischen Küstenstadt Wenzhou stehen bei ihren Landsleuten im Ruf, ein besonderes Talent fürs Geldverdienen zu besitzen. "In Wenzhou reden selbst die alten Frauen übers Geschäft, statt zu tratschen", so eine Redensart. Schon im Kaiserreich um 200 v. Chr. existierten in der Stadt private Banken. Heute hat die Metropole eine imposante Skyline, eine Börse, Chinas modernste Bank, effiziente Behörden und einige der erfolgreichsten Unternehmen des Landes. Eine Musterstadt, auf die man auch heute noch stolz ist und die vom Ausland bestaunt wird - vor allem wegen der einzigartigen Schuhproduktion. Insgesamt werden pro Jahr geschätzte 1,5 Milliarden Paar Schuhe hergestellt; in Produktion und Verkauf sind fast 400.000 Menschen beschäftigt. Täglich kommen Menschen aus den Provinzen in die Millionenstadt, die Karriere, Geld und Anerkennung verheißt. Der Arbeiter Yi You Xu hat es geschafft - vor 16 Jahren kam er nach Wenzhou und hat sich seitdem mit Fleiß und Ausdauer nach oben gearbeitet. Der Lohn waren ein Haus in seinem Heimatdorf und eine Wohnung in der Stadt. Jetzt fehlt ihm nur noch ein Auto zu seinem Glück. Doch zu dessen Anschaffung wird er demnächst kaum Gelegenheit haben. Sein Arbeitgeber, der Fabrikant Jian Ping Wang, plant, ihn nach Nigeria zu schicken, wo er eine Niederlassung seines Unternehmens leiten soll. DE 2007'
