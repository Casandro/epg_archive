  description: "Koloniale Arten \nVon Maxi Obexer \nRegie: Christine Nagel \nMit: Inga Busch, Jenny Schily, Jens Harzer, Lisa Hagmeister, Lisa Hrdina, Josef Ostendorf, Maria Magdalena Wardzinska, Paul Behren, Jördis Trauer \nKomposition: Niko Meinhold \nMusik: Susanne Paul (Cello) \nTon und Technik: Corinna Gathmann, Philipp Neumann und Raphael Thorn \nNDR 2026\nLänge: 75'14\n\nSafari im Vorzeige-Reservat - doch die Tiere zeigen sich nur auf den Schildern, die auf sie hinweisen. Statt einer Jagd erleben die Schriftstellerin Jenny und die Kuratorin Conny ein Geflecht aus Geschichten von kolonialer Sammelwut, wissenschaftlicher Klassifikation und der Erfindung des ?Exotischen?. Zwischen Fieberträumen und Artefakten meldet sich das Naturkundemuseum zu Wort."
