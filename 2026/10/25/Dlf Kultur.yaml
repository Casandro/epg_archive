  description: |-
    Investigativ-Journalismus - Freundschaft mit Geheimnissen
    Jochen Dreier im Gespräch mit Christian Fuchs

    Christian Fuchs trifft Extremisten und Terroristen, schützt Informanten und erhält manchmal auch Morddrohungen. Wie verarbeitet er die Belastungen seiner Arbeit, und wie stützen ihn enge Freundschaften und das Verhältnis zu seinem Zwillingsbruder?

    Nahostkonflikt - "Wohin mit dieser Wut?"
    Jochen Dreier im Gespräch mit Sophie Rebmann

    Ahmad wächst in einem palästinensischen Flüchtlingslager in Syrien auf. Seit seiner Kindheit spürt er Wut in sich, weil er Ausgrenzung und Unrecht erfährt. 2012 flieht er nach Deutschland. In Stuttgart lernt er eine Israelin kennen; und entdeckt mit ihr einen Weg, wie er seine Wut in Friedensarbeit umwandeln kann.
