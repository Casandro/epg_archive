  description: Een tractor is voor een groot aantal boeren meer dan een werktuig. Een trekker is voor hen een voertuig om van te houden. Van generatie op generatie wordt de liefde voor de trekker doorgegeven. Je mag er al op rijden als je zestien jaar bent, dus veel van deze liefdes ontstaan al jong op het platteland. Roselie uit Zierikzee is zeventien en helemaal gek van tractoren; ze heeft haar eigen trekker Gerard genoemd. In Friesland kun je de Elfstedentocht niet alleen schaatsen, fietsen of wandelen, maar ook op de trekker afleggen. Reina reed jarenlang zelf mee, tot een ernstige hersenbloeding daar een einde aan maakte. (2026)
