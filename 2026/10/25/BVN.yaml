  subtitle: De beautytrend peptiden-injecties getest in lab S14 E07. Een onderzoeksjournalistiek programma dat mis- en desinformatie checkt die op sociale media wordt verspreid.
  description: 'De nieuwste gevaarlijke onlinetrend: jezelf injecteren met peptiden. Tientallen Nederlandse webshops verkopen deze middelen, zonder duidelijke herkomst en zonder controle. Gebruikers hopen op een strakkere huid, voller haar of meer spieren maar wat zit er écht in die spuit? Wij laten meerdere peptiden testen in een laboratorium en de uitslag is verontrustend. Volgens deskundigen is het gebruik nu vergelijkbaar met Russische roulette en zou de handel verboden moeten worden. (2026)'
