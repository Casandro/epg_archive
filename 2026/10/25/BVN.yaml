  title: Metropolis
  subtitle: Mens & machine S14 E19. Worden robots straks onze collega's, vrienden of vervangers? We reizen naar India, Kenia en Hongkong en ontdekken hoe AI ons werk en leven verandert.
  description: Kunstmatige intelligentie wordt steeds meer onderdeel van ons dagelijks leven. Maar wat betekent dat voor de toekomst? Worden robots straks onze collega's, vrienden of vervangers? In India werkt fabrieksarbeider Sunil met een camera op zijn hoofd, waarmee AI wordt getraind om zijn werk uiteindelijk door robots te laten overnemen. In Kenia geeft een robot scheikundeles in gebarentaal en in Hongkong werkt een jongen met een ernstige spierziekte aan een digitale dubbelganger. We onderzoeken hoe mensen wereldwijd omgaan met de kansen en uitdagingen van AI. (2026)
