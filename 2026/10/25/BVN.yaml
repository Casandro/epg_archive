  description: Expert Paul van Rosmalen bespreekt een document van de beroemde Belgische schilder James Ensor. De tekening met tekst kwam tevoorschijn uit een boek dat de eigenaar op de rommelmarkt had gekocht, maar blijkt meer waard dan het boek zelf. Verder een zilveren bijbelslot gebruikt als fotolijst en een zelfportret dat eruitziet als een lachspiegel. Ook komt er een art deco-beeldje van een danser op tafel, dat misschien vanwege de taxatie van expert Marcel Brouwer wel van de werkkamer naar de woonkamer van de eigenaar gaat verhuizen. (2026)
