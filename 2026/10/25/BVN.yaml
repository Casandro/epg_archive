  title: Tussen Kunst en Kitsch Extra
  subtitle: Luisteren naar de tijd E25. Menno Hoencamp vertelt vanuit museum Klok en Peel in Asten over een bijzonder gouden zakhorloge. Het horloge is een kwartierslagwerk, waarbij je ook in het donker kunt horen hoe laat het is.
  description: Menno Hoencamp vertelt vanuit museum Klok en Peel in Asten over een bijzonder gouden zakhorloge. Het horloge is een kwartierslagwerk, waarbij je ook in het donker kunt horen hoe laat het is. De expert vertelt dat men vroeger vooral luisterde naar de tijd. Kerkklokken waren daarbij heel belangrijk. Zo ook die van de oude Cumerakerk in Rhenen. Met de voorzitter van het Cuneragilde klimt Menno naar de klokkentoren, waar ook de beiaardier zit. De heren praten over het belang van de voorslag of het voordeuntje van het carillon. (2024)
