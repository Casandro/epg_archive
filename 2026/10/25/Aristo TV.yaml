  title: So schmeckt die Welt - Graz
  description: 'Graz: Die Genussstadt Europas. Hier lebt die Stadt Tag und Nacht und bietet so vieles an Kultur und Kreativität. Ja, diese Stadt lebt vom Genuss und das merkt man zum Beispiel beim Kaiser Josef Markt. Da wo alles frisch vom Händler selbst herkommt ohne Zwischenhändler. Oder auch ganz bekannt dafür ist der Anbau von Ölkürbissen und die Gewinnung des Öls aus den Kernen. Auch stadtbekannt, sind die Würstl und das soweit das Auge reicht. Sehen Sie auch den Besuch in einer Hutmanifaktur und bei der Herstellung von einzigartigen Kostümen für das Theater.'
