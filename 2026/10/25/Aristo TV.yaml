  title: ANIXE auf Reisen - Montafon
  description: 'Kommen Sie mit uns ins Montafon! Schauspielerin Eva Habermann erkundet die Region im Westen Österreichs. An dem grandiosen Panorama zahlreicher Gebirgsketten kann sich Eva einfach nicht sattsehen. Die Bergkulisse will erwandert werden. Zur Stärkung gibt es den Montafoner Surkas, einen Käsespezialität, die Eva später auch selbst unter sachkundiger Anleitung herstellen darf. Unsere Protagonistin will indessen hoch hinaus:  Klettern heißt die Devise! Aber nicht auf die normale Art. Es geht die Silvretta Staumauer hoch - 80 Meter Höhenunterschied! Mulmig wird es, als Eva in den Berg hineinsteigt, in das historische Bergwerk in Bartholomäberg. Wussten Sie eigentlich, dass das Montafon das einzige Tal in Österreich ist mit einer eigenen Schafrasse? Das Montafoner Steinschaf macht die Ausnahme. Evas Trip ins Montafon ist natürlich auch eine Kult(o)ur: Im Silbertal laufen die Sagenfestspiele auf einer der größten Freilichtbühnen Europas. Und in Schruns, der Hauptgemeinde des Montafon, lernt Eva einen ambitionierten Bildhauer kennen, der so gar nicht ins traditionelle Klischee passt...'
