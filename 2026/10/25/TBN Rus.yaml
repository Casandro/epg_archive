  title: '"Кто живет под водой" -- №9 Ракообразные 0+'
  subtitle: '"Кто живет под водой" -- №9 Ракообразные 0+'
  description: 'Есть ли жизнь в Мёртвом море? Чем питаются акулы? Как образовались океаны? Вам уже интересно? Тогда эта передача как раз для вас! Также в нашей программе мы ответим на самый главный вопрос: "Кто живёт под водой?". Да-да, в океане живёт целая подводная братва, и у вас появился уникальный шанс познакомиться с ними поближе. Вместе с сотрудниками петербургского Океанариума мы расскажем об интересных фактах и историях из жизни обитателей морских глубин - сам Синдбад-мореход позавидовал бы!'
