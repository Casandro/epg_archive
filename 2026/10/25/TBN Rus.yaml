  description: Хорошо, когда есть кому задать вопрос. Но есть такие вопросы, на которые не всякий человек находит ответ. Вопросы связанные с верой, с религией - на них грамотно могут ответить только те, кто связан с церковью - служители церкви. На земле идет битва между добром и злом. И никто из живущих на земле не остается в стороне от этой битвы. Почему был допущен грех? Почему страдают невиновные? Где искать правду и есть ли она на нашей земле? На эти и многие-многие другие вопросы отвечают служители церкви. В этой программе служители церкви отвечают на сложные бытовые вопросы, которые присылают наши радио и телезрители.
