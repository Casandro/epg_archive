  title: '"Мой питомец" -- 0+ №5 Попугаи'
  subtitle: '"Мой питомец" -- 0+ №5 Попугаи'
  description: 'Весёлый и трогательный фильм о девочке Ане и её необычных питомцах - говорливом жако по имени Ричард, романтичном попугае Малыше и озорной собаке Яське. Вместе они живут под одной крышей, шалят, обижаются, мирятся - и учат нас главному: любовь к животным - это не только радость, но и большая ответственность. В передаче - юмористическая озвучка от лица животных."Мой питомец" - программа о дружбе, характере и настоящей семье, в которой все - и люди, и звери - говорят на языке любви.'
