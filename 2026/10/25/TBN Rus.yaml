- eventId: 916867
  start: 2026-10-25T04:25:00Z
  stop: 2026-10-25T05:00:00Z
  title: '"Твой рецепт" -- 0+ №5 Кристина Чарм'
  subtitle: '"Твой рецепт" -- 0+ №5 Кристина Чарм'
  description: 'В гостях у Влады - Кристина Чарм, настоящая икона эстетики и одна из самых вдохновляющих блогерш для миллионов девочек по всей стране! Её образ, стиль и вкус вызывают восхищение, а подписчики мечтают быть такими же яркими, уютными и уверенными. Вместе с Владой Кристина готовит болоньезу - но не классическую, а в авторской версии ведущей! А ещё девочки делают сочные брускетты с томатами, украшая их так, будто это страница из самого уютного Pinterest-альбома. Пока соус томится, Кристина рассказывает, как всё начиналось: первый ролик на YouTube, первые подписчики, момент, когда она поняла, что стала популярной - и какие планы на будущее у неё сейчас. Это история о том, как превратить хобби в настоящее вдохновение для других. А ещё в выпуске - любимые рубрики: Угадай или съешь - угадаешь ингредиент или попробуешь на вкус? Алфавит-челлендж - ответы только по порядку букв, и это веселее, чем кажется! Вопросы от подписчиков - честно, тепло и без прикрас. Этот выпуск - про стиль, вкус, мечты и то, как важно оставаться собой, даже когда за тобой следят миллионы. Готовьтесь к эстетике, аромату болоньезы и хорошему настроению!'
- eventId: 916817
  start: 2026-10-25T05:00:00Z
  stop: 2026-10-25T05:30:00Z
  title: '"Джозеф Принц" -- W_043_26'
  subtitle: '"Джозеф Принц" -- W_043_26'
  description: 'Джозеф Принс имеет более чем двадцатилетний опыт в служении и является одним из ведущих ораторов, возвещающих Евангелие по всему миру с помощью обучающих ресурсов и телевизионного служения. Джозеф - весьма популярный спикер конференций, он повлиял на многих религиозных лидеров по всему миру с дерзновением проповедуя Евангелие Иисуса Христа. Принс преподносит Слово Божье практическим и познавательным методом, благодаря чему Иисус в полноте открывается слушателям. Юмористический, динамичный и зажигательный стиль проповеди Принса постоянно привлекает к себе зрителей различных возрастов: они с интересом смотрят его телепередачу "Предназначены царствовать". В настоящее время эту программу смотрят миллионы семей Северной Америки, Европы, Африки, Австралии и Израиля; она транслируется как в светских, так и в христианских телесетях. Джозеф является пастором церкви "Новое творение" (Сингапур); во время его служения община выросла в сто раз -от 150 до 22000 прихожан. Джозеф желает, чтобы христиане возрастали духовно и помогает им научиться царствовать в жизни через обилие Божьей благодати и дар праведности. Он желает помочь своим современникам-верующим постичь Новый Завет благодати и осознать, как щедро они одарены и любимы Небесным Отцом.'
- eventId: 916818
  start: 2026-10-25T05:30:00Z
  stop: 2026-10-25T06:00:00Z
  title: '"Узнавая еврейского Иисуса" с раввином Шнайдером -- №491'
  subtitle: '"Узнавая еврейского Иисуса" с раввином Шнайдером -- №491'
  description: Телевизионное шоу международного евангелиста и автора нескольких книг - раввина Шнайдера об Иисусе. Сегодня раввин Шнайдер является ведущим впечатляющей и влияющей на многих людей телевизионной программы "Узнавая Еврейского Иисуса", которую могут смотреть более ста миллионов телезрителей в Соединенных Штатах и двухстах странах мира. Зрители в постоянстве смотрят программу и узнают о том, как Ветхий и Новый Заветы друг с другом связаны. Раввин Шнайдер также учит применению Слова, что укрепляет веру, преображает жизнь и вселяет более глубокое осознание Божьей любви.
- eventId: 916854
