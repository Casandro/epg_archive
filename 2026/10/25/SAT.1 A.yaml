    Unglück im Glück
    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Die Beamten eilen einer Frau zu Hilfe, deren Portemonnaie geklaut wurde. Das Schlimmste daran ist der geklaute Lottoschein, den sie einlösen wollte. Wusste der Dieb vom fetten Lottogewinn? - Eine Radfahrerin wurde von einem Ehepaar angefahren. Der Fall scheint klar, doch dann entdecken die Polizisten immer mehr Widersprüche. - Vor einer Boutique werden Frauen von Tierschutzaktivistinnen mit Farbe beworfen und beschimpft, obwohl hier gar keine Pelze verkauft werden.
  widescreen: true
