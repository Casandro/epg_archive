  description: Die Polizisten werden gerufen, weil sich eine junge Frau mit einem Mann streitet, der Flyer für ein Erotikgeschäft verteilt. Auf den Flyern ist ein Foto der Frau, die allerdings nie ihr Einverständnis dazu gegeben hat. - Eine Frau glaubt, dass ihre Mutter auf einer Kaffeefahrt gegen ihren Willen festgehalten wird. Die Polizisten finden die Mutter der Frau allerdings allein und verzweifelt in der Nähe eines Geldautomaten. Was ist passiert?
