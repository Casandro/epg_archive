    Mädchen in Bordell verpfändet
    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Die Polizisten werden von einer Mutter gerufen, deren Tochter offenbar in einem Bordell als Pfand für eine unbezahlte Nummer zurückgelassen wurde. - Die Polizei stellt drei maskierte Männer, die einen Späti überfallen. Die Räuber entpuppen sich als Jugendliche, die ein Rapvideo drehen wollen. - Eine verängstige Mutter alarmiert die Polizei, da sie einen Einbrecher in ihrem Haus vermutet. Vor Ort gibt es einige Ungereimtheiten und im Garten finden die Beamten eine nackte Frau.
