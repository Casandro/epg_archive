  description: 'Eva ist nicht erfreut, als der junge Fotograf Jonathan in ein Nebengebäude des malerischen Bauernhofs zieht, auf dem sie mit ihrem erwachsenen Sohn und dessen Familie lebt. Für die Damenbesuche und die lautstarken Partys des neuen Mieters hat sie nur abfällige Bemerkungen übrig. Dann aber lernen die beiden sich besser kennen - und es passiert etwas, worauf weder Eva noch Jonathan vorbereitet waren: Sie verlieben sich ineinander. Ihre Beziehung stößt allerdings nicht überall auf Verständnis.'
