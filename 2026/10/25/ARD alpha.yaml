  description: 'Er zieht seine Skibrille auf und macht, was er will: Ski Aggu mischt Deutschrap mit Hardtekk, Europop, Trance und Techno. Dazu simple Texte mit Reimen zum Dummgehen. "Was soll das?", fragen seine Kritiker und sie beklagen: "Er macht das Genre kaputt". Pop Secret Stories schaut hinter die Fassade eines Künstlers, der immer noch eins draufsetzen will - und mit all den Möglichkeiten vielleicht einmal zu oft abgebogen ist. Welche Schattenseite birgt die Gier nach Aufmerksamkeit?'
