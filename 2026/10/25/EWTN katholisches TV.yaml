  title: Chorprojekt  "Jesu, meine Freude"
  description: "Aus ganz Deutschland haben sie sich auf den Weg gemacht - an die Côte d'Azur: Wo andere Luxusurlaub machen, wollen sie ihren Glauben stärken und weitergeben: Zu Gott\ndurch die Freude der Gemeinschaft, durch die Schönheit der Natur, die Schönheit der\nMusik: Gemeinsam mit Patres der Servi Jesu et Mariae (SJM) haben junge Musiker aus Deutschland ein Projekt aus dem Boden gestampft: Eine Woche lang wollen junge Menschen aus ganz Deutschland zusammenkommen, und getragen von der christlichen Gemeinschaft miteinander leben, beten, singen, und Spaß haben. Aber sie wollen auch anderen etwas mitgeben, und die Botschaft Jesu Christi in einer Straßenmission unter die Leute zu bringen - und das alles vor der atemberaubenden Kulisse Südfrankreichs, wo allein die Schönheit der Natur den Menschen zum Lob Gottes anregt.\nDas Programm ist anspruchsvoll: Im Zentrum steht die Bachmotette \"Jesu, meine Freude\". Das ist mehr als nur ein Musikstück - es ist der Puls, der Grundrhythmus, der das Leben eines Christen durchziehen soll. \nEWTN hat die jungen Menschen auf ihrer Reise begleitet, von der Ankunft in Frankreich bis zum Abschlusskonzert mit der Gemeinde St. Pie X in Toulon. Eine Dokumentation über die Kraft der Schönheit, Menschen in ihrem Glauben zu stärken und zu inspirieren."
  widescreen: true
- eventId: 922636
