  title: Kirche in Not - Thema
  subtitle: Selige Anna Katharina Emmerick - Leben und Spiritualität
  description: "Mit: P. Dr. habil. Wolfgang Buchmüller OCist, Forschungsdekan an der Phil.-Theol. Hochschule Benedikt XVI. in Heiligenkreuz\n \nAnna Katharina Emmerick (1774-1824) war eine Mystikerin, deren Leben und Visionen bis heute faszinieren. Ihre Wundmale, ihr tiefes geistliches Erleben und ihre Schauungen über das Leben Christi machten sie zu einer Herausforderung für Kirche und Wissenschaft. Trotz Anfeindungen wurde sie zur geistlichen Inspiration für viele, darunter der Dichter Clemens Brentano, der ihre Visionen aufzeichnete. Ihr verborgenes, aber kraftvolles Wirken prägt bis heute die christliche Spiritualität."
  widescreen: true
