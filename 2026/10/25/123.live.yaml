  title: Das Lustschloß im Spessart
  subtitle: Das Lustschloß im Spessart
  description: 'In einem abgelegenen Schloss im Spessart geht es turbulent zu: Adelige, Gäste und Bedienstete verstricken sich in amouröse Abenteuer, Verwechslungen und pikante Begegnungen. Die frivole Erotikkomödie verbindet ländliches Flair mit augenzwinkerndem Humor und frechen Szenen, wie sie typisch für die 70er-Jahre sind. Ein heiteres Lustspiel voller Charme, Übertreibung und erotischer Verwicklungen. 1978'
