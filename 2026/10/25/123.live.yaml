  title: Unvergessene Legenden - Summer of Love
  subtitle: Unvergessene Legenden - Summer of Love
  description: Der Ausdruck Summer of Love (Sommer der Liebe) bezeichnet eigentlich den Sommer des Jahres 1967, als die Hippiebewegung in Amerika auf ihrem Höhepunkt angelangt war. Aber auch der Sommer des Jahres 1969, in dem das Woodstock-Festival stattfand, wird als Summer of Live beszeichnet.  Die Hits des "Summer of love" bis hin zum Woodstockfestival wurden zusammengestellt von Manfred Sexauer ausgewählt. Die Musik  und die Geschichten einer verrückten Ära begleiten Sie durch  durch diese Sendung. Ge 2023
