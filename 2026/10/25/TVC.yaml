  title: Koszmarna wyprawa 4 (odc. 7)
  subtitle: Niedoszła piosenkarka Kahlilah Saleem została wrobiona w przemyt kokainy przez swojego producenta. Trafiła na sześć lat do kubańskiego więzienia.
  description: |-
    Tytuł oryginalny: Banged Up Abroad
    GB, 2009
    Reżyseria: Srik Narayanan
    Występują: Juan Reyes, Simone James, Claudia Perdomo, Corine Zehnder
    Po niedawnej decyzji amerykańskich władz o poluzowaniu ograniczeń w podróżach na Kubę, Amerykanie tam się udający powinni usłyszeć o koszmarze, jakiego doświadczyła pewna kobieta zamknięta za granicą. Kiedy Kahlilah Saleem spotkała ważnego producenta muzycznego, Roya, nie spodziewała się, że jej życie na zawsze się odmieni. Po kilku miesiącach związku, Roy umożliwia Kahlilah wyjazd do Panamy na karnawał, ale porzuca ją tam z ośmioma kilogramami kokainy.
