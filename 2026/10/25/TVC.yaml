  title: 'Winnetou III: Ostatnia walka'
  subtitle: Nastają ciężkie czasy dla wodza Apaczów, Winnetou, i jego ludzi. Tuż po zakończeniu wojny domowej w Ameryce następuje wielki przypływ osadników z Europy, którzy wypierają rdzennych mieszkańców z ich ziem.
  description: |-
    Tytuł oryginalny: Winnetou 3. Teil
    DE,FR,IT,YU,YU, 1965
    Reżyseria: Harald Reinl
    Występują: Lex Barker, Pierre Brice, Rik Battaglia, Ralf Wolter, Carl Lange, Ilija Ivezić
    Winnetou, dzielny wódz Apaczów, oraz jego przyjaciel Old Satterhand czekają na śmierć przywiązani do pala. Biali bandyci obarczyli Winnetou winą za śmierć syna wodza Indian z plamienia Jicarillo. Winnetou i Old Satterhand w ostatniej chwili uwolnieni przez trapera Sama Howkinsa uciekają w góry. Tam dochodzi do rozstrzygającej walki z Indianami Jicarillo i bandytami.
  ageRating: 12
  genre:
  - '18'
- eventId: 913871
  start: 2026-10-25T10:35:00Z
  stop: 2026-10-25T12:20:00Z
  title: Winnetou i Apanaczi
  subtitle: Apanaczi, córka białego osadnika i Indianki, zostaje porwana przez szefa sławnej w całym Teksasie bandy. Winnetou, Old Shatterhand oraz narzeczony dziewczyny, Jeff, wyruszają na ratunek.
  description: |-
    Tytuł oryginalny: Winnetou und das Halbblut Apanatschi
    DE,IT,YU, 1966
    Reżyseria: Harald Philipp
    Występują: Pierre Brice, Lex Barker, Götz George, Uschi Glas, Walter Barnes, Ralf Wolter
    Winnetou, dzielny Indianin z plemienia Apaczów i jego niepokonany w walce na pięści, białoskóry przyjaciel Old Shatterhand, wspólnie występują w obronie czci pięknej Metyski Apanaczi. Obaj bronią jej przed strasznymi desperados, którzy chcą ograbić ją z odziedziczonych bogactw. Wielu z nich zjednoczyło się pod wodzą siejącego grozę Curly Billa. Bandyci, jak zjawy, przemierzają prerię, szerząc strach i przerażenie.
  ageRating: 12
  genre:
  - '18'
