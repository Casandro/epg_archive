  title: W czepku urodzeni
  subtitle: Rosco i Doug poznają się, gdy w trakcie rutynowej kontroli policyjnej zostają mylnie rozpoznani jako poszukiwani rabusie. W czasie ucieczki przypadkowo trafiają na pokład samolotu.
  description: |-
    Tytuł oryginalny: Nati con la camicia
    IT,US, 1983
    Reżyseria: Enzo Barboni
    Występują: Terence Hill, Bud Spencer, Buffy Dee, David Huddleston, Riccardo Pizzuti, Harold Bergman
    Kierowca ciężarówki Doug i autostopowicz Rosco zostają niesłusznie wzięci przez policję za złodziei. Podczas ucieczki na lotnisko przypadkowo zdobywają darmowy lot do Miami oraz torbę z milionem dolarów. Na miejscu okazuje się, że tym razem wzięto ich za tajnych agentów, a gra staje się zbyt niebezpieczna, by się wycofać. Obsada: Terence Hill, Bud Spencer, Buffy Dee
