    Mattis lebt mit seinem älteren Bruder und seiner jüngeren Schwester und den Eltern in Kollmar bei Hamburg. Im Januar 2025 musste er wegen akutem Knochenmarksversagen ins Krankenhaus. Sein Körper hat keine Abwehrzellen mehr produziert. Eine seltene Krankheit, die behandelt wird wie Blutkrebs. Mattis brauchte eine Chemotherapie und eine Stammzellentransplantation. Dafür war er wochenlang in einem speziellen Isolierzimmer in einer Klinik. Niemand durfte den Raum ohne Schutzanzug betreten und kein Fenster durfte geöffnet werden. ...
