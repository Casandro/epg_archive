  description: |-
    Unsichtbar

    Die Quizshow für die ganze Familie. "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder.

    Wie macht man sich unsichtbar? Dieser Frage gehen Elton und Piet auf den Grund. Und wer kann ihnen das besser erklären als ihre Gäste, die Ehrlich Brothers?

    Die legendären Zauberkünstler sind zu Gast in der Sendung und haben einen ungewöhnlichen Zaubertrick vorbereitet. Aber auch im Tierreich gibt es Illusionisten, die es schaffen, sich wie von Geisterhand unsichtbar zu machen. Ob die Rateteams die Tricks durchschauen?

    Diese kommen aus Stollberg/Deutschland, Mallnitz/Österreich und Passeier/Italien.

