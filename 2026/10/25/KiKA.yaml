  description: |-
    Wie entstehen Trends und warum machen alle mit?

    Labubus, Jellycats, Six Seven und TikTok-Tänze. Sie alle haben eine Sache gemeinsam: Sie sind oder waren einmal ein Trend. Und davon bekommen wir vor allem dann viel mit, wenn wir Zeit in den sozialen Medien verbringen. Auf YouTube, Instagram und TikTok verbreiten sich Trends gefühlt in Lichtgeschwindigkeit. Aber wie sie entstehen, scheint fast wie Zauberei. Oder etwa nicht?

    Moderatorin Soraya versucht, dem Kreislauf der Trends auf die Spur zu kommen, und holt sich dabei Hilfe vom Trend Experten Simon Pycha und der TikTokerin Chiara Tews. Dabei wird schnell klar: Ob etwas zum Trend wird, lässt sich kaum vorhersagen. Aber können Chiara und Soraya einen TikTok-Tanz kreieren, der theoretisch das Zeug zum Trend hat? Findet es heraus! Am 25.10. bei Team Timster.
    Moderation: Soraya Farhat Mendoza
