  description: |-
    Gesellschaftspolitisches Reportagemagazin

    Jede Nacht hellwach · Was Schlafmangel mit dir macht

    42 Prozent der Schülerinnen und Schüler in Deutschland leiden laut aktueller Studie mindestens einmal pro Woche unter Schlafproblemen - auch Sophia (23) kennt das nicht erst seit gestern, sondern eigentlich schon ihr ganzes Leben. Was hält sie wach, obwohl sie am nächsten Tag funktionieren muss?

    POV-Host Noel begleitet Sophia bei einer schlaflosen Nacht und versucht dabei selbst, wach zu bleiben. In der neuen Folge "POV - Deine Geschichte zählt" gibt Sophia Einblick in ihren Alltag und versucht zu erklären, warum sie ihrer Meinung nach so wenig schläft. Dabei merkt sie selbst: Auch ihr fällt einiges im Alltag schwerer, als sie zugeben will.

    Außerdem ordnet Schlafmedizinerin Dr. Verena van Ginneken (Charité) ein, inwiefern sich der Körper wirklich an zu wenig Schlaf gewöhnen kann und wie ungesund das eigentlich ist.
