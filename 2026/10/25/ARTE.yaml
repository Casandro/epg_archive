  title: Cette femme-là
  subtitle: Josiane Balasko est épatante dans ce rôle de femme flic dépressive, évoluant dans une ambiance sombre. Dommage que la fin bascule dans le Grand-Guignol.
  ageRating: 15
  genre:
  - '17'
  description: 'Femme flic, Michèle Varin vit seule. Depuis longtemps, elle souffre de cauchemars et d''insomnies. En ce mois de février, le malaise s''accentue, chaque année bissextile ravivant des souvenirs douloureux. Elle est chargée d''enquêter sur le suicide étrange d''une femme en pleine forêt. L''une des chaussures de la défunte a disparu et l''autopsie révèle que son dos est zébré de rouge. Michèle entame une liaison avec Daniel, un entrepreneur qui prétend qu''on a mis le feu à ses locaux. Mais malgré sa tendresse, elle ne lui confie pas ses obsessions. Surtout que le cas de la suicidée la tracasse. Fêlures Guillaume Nicloux dit avoir écrit le rôle de Michèle Varin pour Josiane Balasko, qui l''avait impressionné dans Trop belle pour toi. Présente dans presque tous les plans, la comédienne, le ton cassant et le visage durci par de longs bandeaux noirs, prête ses fêlures cachées à ce personnage de flic brisée, laconique et déterminée. Les personnages qui gravitent autour d''elle se révèlent déroutants, voire ambivalents - excellents seconds rôles joués par Éric Caravaca, Aurélien Recoing, Frédéric Pierrot. et Thierry Lhermitte, qui réapparaît sous les traits du détective d''Une affaire privée -, renforçant une impression persistante de malaise. Entre thriller et drame intime, une série noire à la française où plane la musique d''Éric Demarsan, qui travailla notamment avec Jean-Pierre Melville. Réalisateur: Guillaume Nicloux. Des acteurs: Josiane Balasko (Michèle Varin), Eric Caravaca (Sylvain Bazinsky), Ange Rodot (Léo Kopmans), Frédéric Pierrot (Daniel), Aurélien Recoing (l''homme de l''identité judiciaire) (2003)'
