  title: 'Passato e presente La nascita dell''ONU, '
  subtitle: Passato e presente La nascita dell'ONU, la pace di vetro - Il 24 ottobre 1945, nasceva l'Organizzazione delle Nazioni Unite, sulle macerie materiali e morali della Seconda guerra mondiale. A differenza del
  description: |-
    la precedente Società delle Nazioni, l'ONU riesce a mettere radici; vede quasi quadruplicare il numero dei Suoi membri, ed è tuttora attiva. Ripercorrere l'entusiasmante avventura della sua nascita - tra Dumbarton Oaks, Yalta e San Francisco - significa rivivere la genesi di uno dei progetti politici più ambiziosi del Novecento ed evidenziare i suoi limiti e punti di forza: non un governo mondiale, ma un innovativo strumento per la pace e lo sviluppo. Un meccanismo la cui efficacia dipende però sempre dalla volontà dei suoi stessi membri di usarla. In studio, con Paolo Mieli, la prof.ssa Silvia Salvatici. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

