  title: Il segno delle donne Ave Ninchi
  subtitle: Autoironica, caratterista dalla risata contagiosa, attrice di teatro e di cinema, volto televisivo. La sua versatilità le permette di prendere parte, tra la fine degli anni '40 e i primi '50, a tanti spettacoli tea
  description: |-
    trali. Le sue caratteristiche, tanto fisiche quanto attoriali, le consentono di compiere il grande passo verso il cinema. Ma è con i programmi di cucina, condotti insieme al critico enogastronomico Luigi Veronelli, che Ave Ninchi porta sul piccolo schermo qualcosa che non si era mai visto prima, diventando indiscussa pioniera di un genere del tutto nuovo in Italia. `A tavola alle 7' diventa un grande successo, la gente ama il suo modo di fare, le sue ricette, la sua immutata autoironia. - Conduce Angela Rafanelli.

    Con Paola Minaccioni. Regia Marco Spagnoli
