  title: Passato e presente Primo Carnera il giga
  subtitle: 'Passato e presente Primo Carnera il gigante italiano - È alto oltre due metri e pesa 120 chili, le mani sono quelle di un ciclope: si chiama Primo Carnera, soprannominato "La montagna che cammina". Nel 193'
  description: |-
    3, al Madison Square Garden di New York, si aggiudica il titolo mondiale dei pesi massimi. Da quel momento diventa un'icona sportiva, un eroe nazionale e un'astuta operazione di propaganda per il regime fascista. È l'immagine dell'italiano vincente, forte e vigoroso, l'eccellenza di una razza che si prepara alla guerra. Nel 1935, alla vigilia della guerra d'Etiopia, dopo la sconfitta con il pugile nero Joe Louis, il flirt con il regime si interrompe e scatta la censura. Alla fine della Seconda guerra mondiale, chiusa la carriera pugilistica, Carnera entra nel mondo della lotta e diventa in poco tempo una stella di prima grandezza nel mondo del wrestling. In studio, con Paolo Mieli, il prof. Nicola Sbetti. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

