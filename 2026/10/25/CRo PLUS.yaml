  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (6/15) Část šestá: Předehra, březen 1955 až červenec 1956 v Budapešti, Moskvě a Washingtonu. Rákosi využil příležitosti a Nagye zbavil funkcí, ovšem otěže už pevně sevřít nedokázal. První se stranické kontrole vymkli spisovatelé, a tak "moudrý vůdce" nachystal seznamy k budoucím represím. V atmosféře destalinizace po Chruščovově odhalení kultu osobnosti už k nim nedošlo a v Maďarsku se probudila první opoziční platforma, intelektuální Petőfiho kroužek. Ve Washingtonu mezitím docházeli k přesvědčení, že projevovat příliš mnoho podpory svobodným proudům za železnou oponou není žádoucí. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
