  title: Za obzorem
  description: V polovině října oslavili hinduisté na východě Indie a také v Bangladéši Durgápúdžu - svůj největší svátek celého roku. Pětidenní oslavy bohyně Durgy ale nejsou jen náboženská událost. Podobně jako naše Vánoce s sebou nesou daleko víc. Rodiny se scházejí, dávají si dárky, děti nemají školu a dospělí nemusí do práce. Místo toho mohou obrážet nápaditě vystavěné dočasné chrámy, které po stovkách a tisících vyrostou ve veřejném prostoru. Dnes se podíváme na to, jak oslavy Durgápúdži vypadají a proč jsou na seznamu světového kulturního dědictví.
