  description: V českých nemocnicích přibývá specializovaných paliativních týmů, pomoc psychologů však stále není samozřejmostí a po propuštění domů často končí. Proč je psychická podpora při vážné nemoci tak důležitá? Je pro pacienty dostupná? A co by se mělo změnit, aby byla také bezplatná? Otázky pro pořad Vojtěcha Kovala.
