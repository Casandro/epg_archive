  title: Gradski lovac, film
  subtitle: SING SI LIP YAN (1993) Akcija/Komedija
  description: "Japanski izdavački tajkun angažira mondenog privatnog detektiva da pronađe njegovu odbjeglu kćer. Detektiv, ljubitelj privlačnih djevojaka i još više dobre hrane, kreće u potragu te zajedno sa svojom ljubomornom asistenticom igrom slučaja završi na velikom turističkom brodu - kruzeru, koji upravo otimaju beskrupulozni američki kriminalci... \nOvo je film jednog od najplodnijih i najuspješnijih hongkonških redatelja, scenarista i producenta Jinga Wonga, autora koji se okušao u nebrojenim žanrovima i čije su produkcije ostvarivale velike zarade na kino blagajnama. Wong se u ovom ostvarenju udružio s jednom od najvećih suvremenih komičarskih zvijezda Jackiejem Chanom, redovito sklonom povezivanju komedije s akcijsko-kriminalističkim elementima, što je slučaj i u ovom filmu temeljenom na stripu japanskog autora Tsukase Hojoa. Wong je to stripovsko zaleđe do krajnosti podcrtao u stilu pop-arta, a kao i uvijek kad je Jackie Chan u pitanju, posebno treba istaknuti bravurozne borilačko-komične prizore."
