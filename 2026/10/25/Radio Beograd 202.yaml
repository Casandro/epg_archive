- eventId: 987739
  start: 2026-10-25T21:00:00Z
  stop: 2026-10-25T23:00:00Z
  title: Nešin bluz kafe
  subtitle: Neša Zlatanović i priča i svira sa legendarnim gitaristom.
  description: Dušan Duda Bezuha, jedan od Nešinih gitarskih heroja, svraća večeras u Nešin bluz kafe. I to sa gitarom! Uz priču o karijeri, uzorima, saradnjama, najveća poslastica biće pesme koje uživo izvode Duda i Neša. Jedna od njih je "Moje vreme leti", čuvena pesma čiji je autor Ljuba Ninković, a drugu - pogledajte, odslušajte i pogodite na društvenim mrežama Dvestadvojke. Puštaće nam pesme grupe Zona B, upoznaće nas bolje sa britanskim bendom Jaylen, koji je ovog oktobra u beogradskoj Areni bio predgrupa legendarnom sastavu Deep Purple. Neša predstavlja i svoje omiljene bluz dame u rubrici "Bluz u suknji". Večeras je to Lou Ann Barton, za koju kaže da je jedna od najblistavijih pevačica teksaške scene u Ostinu. To je samo deo menija večerašnjeg Nešinog bluz kafea. Uživajte!
