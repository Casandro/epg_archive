  title: Podcast "Mission Artenvielfalt"
  subtitle: Folge 5 - Wenn die Natur übernimmt
  description: |-
    Zwei Drittel aller Ökosysteme haben sich in den letzten 50 Jahren verschlechtert. Die Welt wird heißer, Wasser wird knapp - und damit auch die Lebensräume von Tieren und Pflanzen. In "Mission Artenvielfalt" begleiten wir Menschen, die es anders machen wollen. Unsere Helden der Artenvielfalt erzählen von den Versuchen, bedrohte Arten zu retten, von den Bemühungen, die Biodiversität zu erhalten, vom Sinn, den auch ungeliebte Tiere für die Natur haben, und vom Versuch, invasive Arten einzudämmen.

    Als Podcast verfügbar in ARD Sounds

    Mission Artenvielfalt - Folge 5 - Wenn die Natur übernimmt

    Die Natur sich selbst überlassen oder eingreifen? Wir wollten wissen, was besser ist für den Artenschutz, und stellten fest: Gar nicht so leicht zu beantworten. Nicht immer ist das Naturbelassene das Beste.
    Autor: Michael Kraa
    Redaktion: Jeanne Turczynski und Simon Plentinger
