  title: BR24 Medien
  description: "Ist Ausgewogenheit im Journalismus messbar? \n\nDie Anfeindungen, denen sich die Medien generell und der Öffentlich-Rechtliche Rundfunk insbesondere seit Jahren ausgesetzt sehen, nehmen zu. Die Lügenpresse-Rufe aus der Corona-Zeit hallen noch nach und die Vorwürfe von Hörerinnen und Zuschauern werden mehr, die politische Einseitigkeit im Programm erkennen wollen. Wie aber lässt sich Ausgewogenheit im Programm darstellen? Lässt sie sich gar messen? Damit beschäftigt sich ein Gutachten mehrerer Kommunikationswissenschaftler der Johannes-Gutenberg-Universität Mainz und der Ludwig-Maximilians-Universität München. In Auftrag gegeben wurde es von der BR-Intendantin Katja Wildermuth, veröffentlich wurde es im Mai dieses Jahres. Und fast zeitgleich hat der neu geschaffene Medienrat seine Arbeit aufgenommen. Er wurde von den Bundesländern im Zuge des neuen Medienstaatsvertrags geschaffen mit der Aufgabe, zu überprüfen, ob ARD, ZDF und Deutschlandradio ihren gesetzlichen Auftrag erfüllen. Also auch zu prüfen, ob sie ausgewogen sind. \n\nAuf den Münchner Medientagen hat der BR zu diesem Thema eine Diskussion organisiert. Mit der Auftraggeberin der Studie, BR-Intendantin Katja Wildermuth, mit einer Autorin des Gutachtens, Prof. Birgit Stark, sie leitet den Lehrbereich Medienkonvergenz an der Johannes-Gutenberg-Universität Mainz, mit der Vorsitzenden des neuen Medienrats, Natalie Wappler und mit Stefan Niggemeier, der seit Jahrzehnten als Medienjournalist arbeitet. \n\nIn dieser Ausgabe von BR24Medien fassen wir diese Diskussion zusammen.  \n\nAls Podcast verfügbar in ARD Sounds"
  subtitle: Ist Ausgewogenheit im Journalismus messbar?
