- eventId: 1021911
  start: 2026-10-25T21:35:00Z
  stop: 2026-10-25T22:20:00Z
  title: Dolina sunca, serija (30/210)
  subtitle: ' '
  description: 'Očajni Karlo drznuo se posuditi nešto novca iz kase. Shvativši da je novac nestao, Ruža zahtijeva da odmah pozovu policiju. Juran pokuša od Eve dobiti Tomekovu dokumentaciju, ali ga ona pristojno odbije jer još nije uspjela napraviti reda među Vjekinim papirima. Primijećen kako izlazi iz Vjekine kancelarije, Juran pokrene lavinu tračeva i komentara. Nikola spasi Karla pred Ružom, ali zahtijeva od njega da mu kaže za što je točno trebao taj novac. Ivanu je sve teže pri samostalnim pokušajima da sjedne u invalidska kolica. Ogorčen je zbog neuspjeha te se otresa na Adelu. Loreta pokuša oraspoložiti ljutu Ružu tračem da je upravo vidjela Jurana kako izlazi iz Evine kancelarije. Ivan gleda kako sporo napreduju Kristijanovi eko-nasadi, kad naiđe Juran, koristi priliku i nudi mu bržu opciju s GMO sjemenom. Višnja natukne Kristijanu da uočava njegov problem s Juranom, te mu napomene kako ga je vidjela kod Eve. Karlo i Augustina ipak uspijevaju otići na vikend putovanje. Robert šarmantno nagovori Juliju na kasnu partiju tenisa. Kristijan odluči upitati Evu je li joj možda smetao njegov brat Juran, na što mu se ona ispriča za neki dan i pozove ga na kavu. Sonja je zabrinuta ugledavši Ivana kako pokušava vježbati hodanje jer to znači da Juran neće imati priliku tako skoro preuzeti firmu. Sofija ostane u čudu kad joj Nikola kaže za Karlove probleme. Ponukan Ivanovom odlukom o GMO nasadima, Kristijan odluči napustiti firmu. Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
