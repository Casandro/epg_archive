  title: 'Najbolji dan: Vilim - Odlazak logopedu'
  subtitle: ' '
  description: 'Vilim je nježan, nasmijan i znatiželjan dječak. Voli pecati, boksati i uživa u školi. Na žalost, u školi mu se dogodila jedna ružna epizoda. Djeca su mu se smijala dok je čitajući pjesmicu pogriješio u izgovoru nekih glasova. Iako Vilim odlazi logopedu i očito napreduje, ovaj ga je događaj rastužio i potresao. Mnogo je posla pred Digijem. Treba objasniti Vilimu da je normalno katkad biti i ljut i tužan. Mora ga ohrabriti da ustraje u odlascima u Suvag. Reći mu da je mnogo djece s istim problemom. A najvažniji Digijev zadatak je vratiti osmjeh na Vilimovo lice. DigiDigi nikad ne gubi vrijeme. Već putuje Vilimu u Zagorje. Redatelj: Andrija Tomić Urednica: Ida Tomić'
