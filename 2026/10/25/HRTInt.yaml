  stop: 2026-10-25T04:46:00Z
  title: Zabranjeno smijanje, hrvatski film
  subtitle: ' '
  description: TV film u produkciji HTV-a, prema uspješnici Mire Gavrana. Vrsni prodavač lovne i ribolovne opreme Boris, na pragu svoje pedesete godine, nema se na što potužiti. Žena, kći, sin i ljubavnica, mlađa, dakako. No, ljubavnička sreća iznenada okrene Borisu leđa i nagna ga da toplinu ponovno potraži u obiteljskom gnijezdu. Pokušavajući povratiti poljuljani sklad i ne primjećuje da je, kao u igri pokera, postao monetom koja prelazi iz ruke u ruku. Muž, žena, kći, ljubavnica i ljubavnik, bračna savjetnica i instruktor jahanja kreću u raspetljavanje zapetljanih muško-ženskih odnosa. Završnica ove obiteljske komedije ipak će biti nalik pomaknutom pasijansu - krive će karte pasti na pravo mjesto!
- eventId: 984184
  start: 2026-10-25T04:46:00Z
  stop: 2026-10-25T05:39:00Z
  title: Mayales - Katran Session 1 & 2
  subtitle: ' '
  description: Živopisan kompleks Katran, nekadašnji industrijski centar u središtu Zagreba, danas je na rubu propadanja. Ondje su svoja mjesta pronašla brojna imena zagrebačke umjetničke scene, klubovi, atelijeri, studija. Neka od njih postoje još i danas. Još od početka stvaranja albuma "Simbol za Sunce" (2015.), grupa Mayales neraskidivo je vezana uz Katran. Kao svojevrsni hommage ovom važnom mjestu za urbanu kulturu Zagreba grupa Mayales snima serijal pod imenom Katran Session. U njima uživo izvode svoju glazbu s aktualnih albuma. Ovaj glazbeni film objedinjuje dva sessiona snimljena u veljači 2018. (Simbol za sunce) te u listopadu 2022. (Domovina), oba u režiji Radislava Jovanova Gonze.
- eventId: 984185
  start: 2026-10-25T05:39:00Z
  stop: 2026-10-25T06:24:00Z
  title: Dolina sunca, serija (30/210)
  subtitle: ' '
  description: 'Očajni Karlo drznuo se posuditi nešto novca iz kase. Shvativši da je novac nestao, Ruža zahtijeva da odmah pozovu policiju. Juran pokuša od Eve dobiti Tomekovu dokumentaciju, ali ga ona pristojno odbije jer još nije uspjela napraviti reda među Vjekinim papirima. Primijećen kako izlazi iz Vjekine kancelarije, Juran pokrene lavinu tračeva i komentara. Nikola spasi Karla pred Ružom, ali zahtijeva od njega da mu kaže za što je točno trebao taj novac. Ivanu je sve teže pri samostalnim pokušajima da sjedne u invalidska kolica. Ogorčen je zbog neuspjeha te se otresa na Adelu. Loreta pokuša oraspoložiti ljutu Ružu tračem da je upravo vidjela Jurana kako izlazi iz Evine kancelarije. Ivan gleda kako sporo napreduju Kristijanovi eko-nasadi, kad naiđe Juran, koristi priliku i nudi mu bržu opciju s GMO sjemenom. Višnja natukne Kristijanu da uočava njegov problem s Juranom, te mu napomene kako ga je vidjela kod Eve. Karlo i Augustina ipak uspijevaju otići na vikend putovanje. Robert šarmantno nagovori Juliju na kasnu partiju tenisa. Kristijan odluči upitati Evu je li joj možda smetao njegov brat Juran, na što mu se ona ispriča za neki dan i pozove ga na kavu. Sonja je zabrinuta ugledavši Ivana kako pokušava vježbati hodanje jer to znači da Juran neće imati priliku tako skoro preuzeti firmu. Sofija ostane u čudu kad joj Nikola kaže za Karlove probleme. Ponukan Ivanovom odlukom o GMO nasadima, Kristijan odluči napustiti firmu. Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 984186
  start: 2026-10-25T06:24:00Z
  stop: 2026-10-25T07:14:00Z
  title: Stvar po sebi
  subtitle: ' '
  description: 'Zamislite ovu situaciju: stojite pored tračnica i vidite jureći tramvaj kojemu su otkazale kočnice. Njemu je na putu petero ljudi privezanih za tračnice. Pored vas je skretnica. Možete skrenuti tramvaj na druge tračnice, ali na njima se nalazi radnik. Što ćete učiniti: ubiti jednog da biste spasili petoro? Ovaj je problem 1967. postavila filozofkinja Philippa Foot. Problem jurećeg tramvaja ne počinje s njom. Deset godina prije nego što je ona postavila problem jurećeg tramvaja, francuski padobranci pod generalom Jacquesom Massuom mučili su tisuće ljudi ne bi li saznali tko podmeće bombe u kafiće i restorane u gradu Alžiru. I Philippa Foot i događaji u Alžiru 1957. postavljaju isto pitanje: možemo li žrtvovati živote ili prava manjeg broja ljudi kako bismo sačuvali živote i sigurnost većeg broja broj ljudi? O tome razgovaramo u emisiji Stvar po sebi. Sugovornici su dr. Tomislav Bracanović i prof. dr. Ozren Žunec.'
- eventId: 984187
  start: 2026-10-25T07:14:00Z
  stop: 2026-10-25T07:20:00Z
  title: 'Jojo i lijepe riječi: Osmijeh (9/10)'
  subtitle: ' '
  description: 'U svakoj od epizoda novoga serijala "Jojo i njegovi prijatelji" družeći se na farmi kroz svladavanje različitih situacija i "problema" uče i upoznaju značenje i važnost LIJEPIH RIJEČI i njihovo korištenje u svakodnevnom životu. Tako će naučiti zašto je važno pozdraviti i nekome poželjeti dobro jutro (dobar dan ili laku noć), koliko je vrijedan osmijeh ili zbog čega nikada ne smijemo zaboraviti reći - oprosti, hvala i molim! Jojo i njegovi prijatelji kroz igru i pjesmu najmlađe uče ljubaznosti, poštovanju (svakoga pojedinca), empatiji, brižnosti... Uče ih koliko je važno voljeti kako sebe, tako i sve oko sebe!  Producentica: Blanka Barlović Scenarist, autor pjesama i animacija: Bojan Jambrošić Dramaturginja: Ivana Gudelj Redateljica: Ivana Radovčić Urednica: Silva Skender'
- eventId: 984188
  start: 2026-10-25T07:20:00Z
  stop: 2026-10-25T07:29:00Z
  title: 'Najbolji dan: Vilim - Odlazak logopedu'
  subtitle: ' '
  description: 'Vilim je nježan, nasmijan i znatiželjan dječak. Voli pecati, boksati i uživa u školi. Na žalost, u školi mu se dogodila jedna ružna epizoda. Djeca su mu se smijala dok je čitajući pjesmicu pogriješio u izgovoru nekih glasova. Iako Vilim odlazi logopedu i očito napreduje, ovaj ga je događaj rastužio i potresao. Mnogo je posla pred Digijem. Treba objasniti Vilimu da je normalno katkad biti i ljut i tužan. Mora ga ohrabriti da ustraje u odlascima u Suvag. Reći mu da je mnogo djece s istim problemom. A najvažniji Digijev zadatak je vratiti osmjeh na Vilimovo lice. DigiDigi nikad ne gubi vrijeme. Već putuje Vilimu u Zagorje. Redatelj: Andrija Tomić Urednica: Ida Tomić'
- eventId: 984189
  start: 2026-10-25T07:29:00Z
  stop: 2026-10-25T07:39:00Z
  title: 'Tata i ja (2): Na jahanju (5/10)'
  subtitle: ' '
  description: U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu postati vrijedna uspomena na vrijeme koje su proveli zajedno. U ovoj epizodi Tristan i tata odlaze na jahanje.
