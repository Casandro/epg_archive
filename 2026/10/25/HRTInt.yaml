- eventId: 984175
  start: 2026-10-25T00:01:00Z
  stop: 2026-10-25T01:01:00Z
  title: Od Lećevice do Santiaga de Compostele, dokumentarni film
  subtitle: ' '
  description: 'Priča o poznatom poduzetniku Ivanu Kapetanoviću koji je pješačio gotovo 3000 kilometara i za 82 dana, od rodnih Kapetanovića, u općini Lećevica kod Splita, stigao do španjolskog grada Santiaga de Compostele. Hodočašće Camino de Santiago ima tradiciju dulju od tisuću godina. Prema legendi, nakon smrti apostola Jakova učenici su njegovo tijelo poslali brodom iz Jeruzalema u sjevernu Španjolsku ali je oluja potopila brod prije nego što je on dospio do cilja. Više od 200.000 ljudi godišnje pješači stazama prema Santiagu. Camino postaje poznat najviše zahvaljujući brojnim putopisima u tisku i na internetu a posebno nakon prikazivanja filma PUT u kojem poznati glumac Martin Sheen igra ulogu hodočasnika na Caminu. Tekst čita: Vedran Očašić Suradnici: Miro Jurinović, Ivo Matijević i Tone Košir  Proizvodnja: Caballus-net, 2017.'
