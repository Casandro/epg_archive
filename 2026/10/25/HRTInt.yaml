  title: Mayales - Katran Session 1 & 2
  subtitle: ' '
  description: Živopisan kompleks Katran, nekadašnji industrijski centar u središtu Zagreba, danas je na rubu propadanja. Ondje su svoja mjesta pronašla brojna imena zagrebačke umjetničke scene, klubovi, atelijeri, studija. Neka od njih postoje još i danas. Još od početka stvaranja albuma "Simbol za Sunce" (2015.), grupa Mayales neraskidivo je vezana uz Katran. Kao svojevrsni hommage ovom važnom mjestu za urbanu kulturu Zagreba grupa Mayales snima serijal pod imenom Katran Session. U njima uživo izvode svoju glazbu s aktualnih albuma. Ovaj glazbeni film objedinjuje dva sessiona snimljena u veljači 2018. (Simbol za sunce) te u listopadu 2022. (Domovina), oba u režiji Radislava Jovanova Gonze.
