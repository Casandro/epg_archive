  title: Zabranjeno smijanje, hrvatski film
  subtitle: ' '
  description: TV film u produkciji HTV-a, prema uspješnici Mire Gavrana. Vrsni prodavač lovne i ribolovne opreme Boris, na pragu svoje pedesete godine, nema se na što potužiti. Žena, kći, sin i ljubavnica, mlađa, dakako. No, ljubavnička sreća iznenada okrene Borisu leđa i nagna ga da toplinu ponovno potraži u obiteljskom gnijezdu. Pokušavajući povratiti poljuljani sklad i ne primjećuje da je, kao u igri pokera, postao monetom koja prelazi iz ruke u ruku. Muž, žena, kći, ljubavnica i ljubavnik, bračna savjetnica i instruktor jahanja kreću u raspetljavanje zapetljanih muško-ženskih odnosa. Završnica ove obiteljske komedije ipak će biti nalik pomaknutom pasijansu - krive će karte pasti na pravo mjesto!
