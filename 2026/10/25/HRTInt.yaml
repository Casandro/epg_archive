- eventId: 1021882
  start: 2026-10-25T06:20:00Z
  stop: 2026-10-25T07:03:00Z
  title: 'Stvar po sebi: Jureći tramvaj'
  subtitle: ' '
  description: 'Zamislite ovu situaciju: stojite pored tračnica i vidite jureći tramvaj kojemu su otkazale kočnice. Njemu je na putu petero ljudi privezanih za tračnice. Pored vas je skretnica. Možete skrenuti tramvaj na druge tračnice, ali na njima se nalazi radnik. Što ćete učiniti: ubiti jednog da biste spasili petoro? Ovaj je problem 1967. postavila filozofkinja Philippa Foot. Problem jurećeg tramvaja ne počinje s njom. Deset godina prije nego što je ona postavila problem jurećeg tramvaja, francuski padobranci pod generalom Jacquesom Massuom mučili su tisuće ljudi ne bi li saznali tko podmeće bombe u kafiće i restorane u gradu Alžiru. I Philippa Foot i događaji u Alžiru 1957. postavljaju isto pitanje: možemo li žrtvovati živote ili prava manjeg broja ljudi kako bismo sačuvali živote i sigurnost većeg broja broj ljudi? O tome razgovaramo u emisiji Stvar po sebi. Sugovornici su dr. Tomislav Bracanović i prof. dr. Ozren Žunec.'
