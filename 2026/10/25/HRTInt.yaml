  title: Veterani mira
  subtitle: ' '
  description: Kad govorimo o Domovinskom ratu, vrlo se često prisjećamo važnih bitaka i poginulih branitelja, a nerijetko zaboravljamo na one koji su u borbi za slobodu izgubili članove obitelji bez kojih su morali nastaviti živjeti. Potresno svjedočanstvo vremena, o boli za onima koji su dali život za Domovinu 92-godišnja Aleksandra-Alka Baal čuva kao trajnu uspomenu u knjizi Zapisi majke poginuloga branitelja. Upravo je izdano drugo, prošireno izdanje. U emisiji Veterani mira govorimo i o pripadnicima Odreda veze GSHV, odnosno 40. Pukovniji veze. Ulogu u Domovinskom ratu predstavili su u Monografiji koja obuhvaća razdoblje od 1991. do 1995. Predstavlja je umirovljeni brigadir Marko Perčinić, ratni zapovjednik Odreda veze GSHV, a koliko i kako se promijenio oblik potpore operacija u odnosu na ratno razdoblje govori brigadir Davor Stanković, Zapovjedništvo za kibernetički prostor.
