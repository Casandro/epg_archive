  title: Tony, kennste dat? - die NRW Ausflugs-Comedy
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Comedian Tony Bauer ist in Duisburg-Marxloh groß geworden - doch sein eigenes Bundesland kennt er bislang erstaunlich wenig. Das will Trinkhallenbesitzerin Verena ändern. In "Tony, kennste dat? - die NRW Ausflugs-Comedy" schickt sie Tony auf eine ebenso persönliche wie unterhaltsame Entdeckungsreise durch Nordrhein-Westfalen. Raus aus der vertrauten Nachbarschaft, rein ins Abenteuer vor der eigenen Haustür. Der Clou: Erst am jeweiligen Tag erfährt Tony, wohin es geht und welche Herausforderung dort auf ihn wartet. Keine Vorbereitung, kein doppelter Boden - dafür jede Menge Überraschungen und spontane Reaktionen.'
