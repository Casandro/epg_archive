  title: Historie českého zločinu
  description: 'Díl 16. Špatnej vrah. Přestože v 50. letech byli zločinci nazýváni i nevinní lidé, našli se v této době i ti skuteční. Správa o smrti hostinské v Hradišti se před Vánocemi roku 1953 roznesla během chvíle. Tak brutální útok v malé vesnici na západě Čech nikdo nečekal. Autor: Bronislava Janečková. Repríza.'
