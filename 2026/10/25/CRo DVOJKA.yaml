  title: Výjimeční
  description: Helena Illnerová - je naše přední fyzioložka a biochemička, která převážnou část svých výzkumů za-světila chronobiologii. Bývalá předsedkyně Akademie věd jako první na světě poodhalila tajemství našich vnitřních hodin - k jednomu z nejvýznamnějších objevů v tomto oboru ji dovedla náhoda a vědecká intuice. Kromě toho, paní profesorku Illnerovou představíme jako vášnivou badatelku a ženu s nesmírným přehledem i nadhledem, poznáme ji také jako maminku, babičku, milovnici jízdy na kole, vášnivou čtenářku a nemírně milého člověka, který nikdy neváhá pomoci lidem kolem.
