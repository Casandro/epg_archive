  start: 2026-10-25T18:00:00Z
  stop: 2026-10-25T18:50:00Z
  title: Muzikál expres
  description: Muzikál expres pozve posluchače do Brna na premiéru muzikálu Carmen, příběh z New Yorku. Britskému producentovi muzikálů Bídníci, Fantom Opery, či Kočky, tedy Cameronovi Mackintoshovi popřeje k jeho 80. narozením. Druhá část pak bude věnována muzikálu Šumař na střeše. Od premiéry jeho filmové verze totiž uplynulo celých 55 let. Více tedy v neděli 25. října v sedm večer nebo při repríze v pátek 30. října od 21. hodiny na vlnách na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
