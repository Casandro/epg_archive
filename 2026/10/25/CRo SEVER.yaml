  description: Hlenky nejsou živočichové, rostliny, ba ani houby. Co jsou hlenky zač prozrazuje knížka na níž se podílel chomutovský entomolog a fotograf Pavel Krásenský. Popíše nám také, jak se hlenky fotí. Slovanský zeměvid i další mapy slavisty Pavla Josefa Šafaříka, zapsané v registru Paměť světa UNESCO, vám představí Eva Novotná z Mapové sbírky Univerzity Karlovy.
