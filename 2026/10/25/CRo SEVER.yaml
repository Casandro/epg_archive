  title: Pochoutkový rok
  description: Za chvíli tu bude další díl narozeninového Pochoutkového roku. V něm vás čeká další podzimní posvícenské pečení s Vojtou Vrtiškou. Tentokrát budeme péct smetanové buchty a plnit je švestkami a mákem. Také si připomeneme, proč byste se měli zapojit do hlasování pro nejlepší recept desetiletí a popovídáme si o nové sváteční luxusní kuchařce "Vánoční pečení Josefa Maršálka a Patrika Rozehnala". Dál vás čeká reportáž o koňském masu, rada, jak přivolat číšníka a také soutěž. Víc se dozvíte na webu pochoutkovyrok.cz nebo dnes po 10. hodině v našem vysílání.
