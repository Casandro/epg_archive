  description: Opět pro vás máme pozvánky za kulturou. Nejdřív to bude pozvání na ústecký koncert Elišky Lüftnerové Šansonárium, pak se podíváme do Chomutovské knihovny, která letos bronzově zabodovala v celostátní soutěži a popovídáme si se Šimonem Spišákem, který v ústeckém Činoherním studiu režíroval Goldoniho komedii Sluha dvou pánů. Pozveme i na Dny české a německé kultury a na křest nového alba skupiny Monkey Business v Mostě. V závěru se opět zaposloucháme do jedné kapitoly z knihy Petra Karlíčka Průvodce po zaniklých obcích, osadách a samotách pod Bukovou horou. Těší se na vás Slávka Brádlová.
