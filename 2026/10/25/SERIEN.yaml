  start: 2026-10-25T06:10:00Z
  stop: 2026-10-25T07:05:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Bleiben oder gehen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Bleiben oder gehen
  description: Olivia Lockhart ist Amtsichterin in Cedar Cove, einer idyllischen Kleinstadt, in der jeder jeden kennt. Olivia lebt hier einen zufriedenen turbulenten Alltag mit ihren Freunden, ihrer erwachsenen Tochter Justine, und ihrer neuen Liebe Jack. Einzig der Bauunternehmer Warren bedroht immer wieder die Idylle. US 2012
- eventId: 1000763
  start: 2026-10-25T07:05:00Z
  stop: 2026-10-25T07:50:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Symbol der Hoffnung
  subtitle: Cedar Cove - Das Gesetz des Herzens - Symbol der Hoffnung
  description: In Cedar Cove herrscht große Aufregung. Warren plant, den alten Leuchtturm abzureißen. Ihm gehört das Grundstück. Eine von Bob angeführte Bürgerbewegung will eine einstweilige Verfügung gegen den Abriss durchsetzen, aber Amtsrichterin Olivia muss dies juristisch ablehnen. Davon lassen sich die Bürger jedoch nicht unterkriegen. Olivia versucht, mit Unterstützung des Senators eine Lösung zu finden. US 2012
- eventId: 1000764
  start: 2026-10-25T07:55:00Z
  stop: 2026-10-25T08:40:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Wieder vereint
  subtitle: Cedar Cove - Das Gesetz des Herzens - Wieder vereint
  description: 'Jack, der Herausgeber des Lokalzeitung, und Olivia sind sich einig, Berufliches und Privates zu trennen, und es als Paar miteinander zu versuchen. Da platzt ein Besucher mitten in einen romantischen Abend: Jacks Sohn Eric. Er braucht Hilfe und Jack will - diesmal - alles richtig machen mit ihm. Doch dies erweist sich als schwieriger als gedacht. US 2012'
- eventId: 1000765
  start: 2026-10-25T08:40:00Z
  stop: 2026-10-25T09:25:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Wiedergutmachungen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Wiedergutmachungen
  description: Eric nimmt Jack voll in Anspruch. Er manipuliert Jack und nutzt dessen Schuldgefühle schamlos aus. Darunter leidet die Beziehung zwischen Jack und Olivia, bis Olivias Freundin Grace Jack den Kopf zurechtrückt. Justine kann ihr Glück kaum fassen, als Maryellen ihr kurzfristig einen Stand auf dem jährlichen Kunstmarkt anbietet. Highschoolfreund Seth ist zur Stelle, um ihr beim Aufbau zu helfen. US 2012
