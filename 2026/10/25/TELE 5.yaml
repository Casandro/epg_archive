  title: Hercules
  subtitle: Wenn Götter lieben
  description: |-
    Hercules hat sich unsterblich in Serena verliebt. Nun macht der Halbgott dem Mischwesen, das zur Hälfte die goldene Hirschkuh ist, sogar einen Heiratsantrag. Iolaus teilt Hercules' Enthusiasmus zunächst nicht. Auch Ares, der die übernatürliche Hirschkuh für sein Eigentum hält, ist von der Liebesbekundung des Paars wenig begeistert. Auch als Hercules seine verstorbene Ehefrau Deianeira (Tawny Kitaen) in den Elysischen Feldern besucht, um ihr von seinen Plänen zu berichten, weht ihm aus dem Jenseits ein frostiger Wind entgegen. Schließlich schlägt Ares einen Deal vor: Wenn Hercules seine göttlichen Kräfte aufgibt, soll er Serena bekommen.
