  title: Xena
  subtitle: Auch du, mein Sohn Brutus?
  description: |-
    Die Amazonen befinden sich im Krieg gegen die Römer. Als Ephiny, die Königin der Amazonen, im Kampf getötet wird, übernimmt Gabrielle die Rolle der Anführerin. Xena hilft dabei, Ephinys Mörder zu stellen. Es ist Brutus (David Franklin), der nun in Gefangenschaft bei den Amazonen gerät. Gabrielle will die Gelegenheit nutzen, um einen Friedensvertrag mit Caesar auszuhandeln. Doch es gibt ein weiteres Problem: Der konkurrierende Feldherr Pompeius hat viele Amazonen verschleppt. Der Römer will die Frauen als Sklavinnen verkaufen, um seinen Kampf gegen Caesar zu finanzieren. Xena und Gabrielle führen die Amazonen in eine blutige Schlacht.
    USA 1999
