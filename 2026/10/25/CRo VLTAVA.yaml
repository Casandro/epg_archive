- eventId: 641762
  start: 2026-10-25T19:00:00Z
  stop: 2026-10-25T21:00:00Z
  title: Koncert bez hranic
  description: Rakouský festival Glatt und Verkehrt 2026. Koncert bez hranic představí dva účinkující z letošního festivalu Glatt und Verkehrt v rakouské Křemži. Bude to big band Omniversal Earkestra z Berlína, který si libuje v africké hudbě a vyhledává spolupráci s tamějšími muzikanty. Tentokrát vystoupí vokalisté Mariam Koné a Tom Diakite, hráč na balafon Aly Keita, perkusista Adama Bilorou a zpěvák a hráč na Hammondovy varhany Cheick Tidiane Seck. Poslední část pořadu nabídne vystoupení slovenské zpěvačky Júlie Kozákové a její gypsy sound s cimbálovou muzikou i kytaristou Zsoltem Váradym. Z nabídky EBU připravil Aleš Opekar.
- eventId: 641893
  start: 2026-10-25T21:00:00Z
  stop: 2026-10-25T22:00:00Z
  title: Futurissimo
  description: 'Petr Kotík: Dopisy Olze (na texty Václava Havla). Návrat do Divadla Archa na koncert 6. června 2010 u příležitosti letošního jubilea narození Václava Havla. O okolnostech vzniku skladby z konce 80. let a jejím poselství hovoří Petr Kotík. Narátoři Jan Tříska a Alexander Komlosi, hrají sólisté Ostravské bandy. Připravil Matěj Kratochvíl a Tvůrčí skupina Hudba.'
- eventId: 641894
  start: 2026-10-25T22:00:00Z
  stop: 2026-10-25T22:30:00Z
  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (8/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová, Pavel Soukup, Zlata Adamovská a Martin Velda. Režie Petr Adler. Natočeno v roce 1990 (29 min).'
- eventId: 641895
