- eventId: 643191
  start: 2026-10-25T15:30:00Z
  stop: 2026-10-25T16:00:00Z
  title: Klapka
  description: SOČR 100 - filmová hudba v repertoáru rozhlasových symfoniků. První díl série vysílané v rámci sté sezóny orchestru je věnovaný suitě z filmové hudby Luboše Fišera, kterou SOČR uvedl pod taktovkou Jana Kučery na koncertě Mistři filmové hudby. Připravila a uvádí Kristýna Šrámková. (repr. 30.10. ve 22.30)
- eventId: 643192
  start: 2026-10-25T16:00:00Z
  stop: 2026-10-25T17:00:00Z
  title: Vizitka
  description: Magdalena Borová. Svůj hlas propůjčila roli Anne v audioverzi zásadního díla dvacátého století Příběh Anne Frankové. "Moje soustředění na slovo a práce s hlasem je to pravé, cítím se v něm být svá a svobodná," popisuje ve Vizitce. Po dvaceti letech také odešla z angažmá v Národním divadle na volnou nohu. Jak se jako introvert pohybuje v hereckém prostředí? "Snažím se nebát se budoucnosti, protože si tím kazím přítomnost. Podstupuju vnitřní práci, aby mi bylo se sebou dobře." Jak se podle ní od dob covidu změnilo české divadlo? Které herecké výrazové prostředky upřednostňuje u filmu? A proč se chce přihlásit ho hlasového výcviku? V lednu tohoto roku se Magdalény Borové ptala Karolína Koubová. Repríza z 23. 1. 2026
- eventId: 643193
  start: 2026-10-25T17:00:00Z
