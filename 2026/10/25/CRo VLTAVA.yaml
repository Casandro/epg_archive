- eventId: 642911
  start: 2026-10-25T05:00:00Z
  stop: 2026-10-25T07:00:00Z
  title: Partitury
  description: 'V. J. Tomášek: Symfonie Es dur, Op. 19. Hraje Plzeňská filharmonie, diriguje Chuhei Iwasaki. - J. S. Bach: Koncert f moll pro trubku a klavír, BWV 1041 (Allegro moderato). - V. Kalabis: Koncert pro trubku a orchestr "Le Tambour de Villevieille", op. 36. - E. Bozza: Rustiques. - J. Haydn: Koncert pro trubku a orchestr Es dur, Hob. VIIe: 1 (Allegro). - V. Peskin: Poeme č. 1. - J. B. Arban: Variace na téma z opery Norma Vincenza Belliniho. Hrají Aleksandr Rublev (trubka), Maxim Averkiev (klavír). Záznam koncertu Concertina Praga ze dne 23. 09. 2021 z Kaple Sv. Maří Magdalény v Jindřichově Hradci. - I. Stravinskij: Ode (Elegical chant in three parts). - A. Copland: Billy the Kid (Ballet suite). Hraje Česká filharmonie, diriguje Aaron Copland. V roce 2022 natočil Petr Hanzlík.'
- eventId: 642960
  start: 2026-10-25T07:00:00Z
  stop: 2026-10-25T07:30:00Z
  title: Spirituála
  description: Chaucer, Viklef a Juliána z Norwiche. Duchovní Evropa s Martinem C. Putnou. S profesorem Martinem C. Putnou procházíme spletitými duchovními dějinami Evropy napříč národy i náboženskými konfesemi.
- eventId: 642961
  start: 2026-10-25T07:30:00Z
  stop: 2026-10-25T08:00:00Z
  title: Krédo
  description: Zářící obrazy a mediální revoluce. Spiritualita a náboženství v dialogu. O spiritualitě v nás i za horizontem, o hledání přesahů i spodních proudů, o tom, proč a v co věříme.
