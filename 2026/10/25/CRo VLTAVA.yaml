  title: Duchovní hudba
  description: Hudba ke Dni reformace. Chorály Lutherovy doby - od Johanna Waltera po Felixe Mendelssohna-Bartholdyho. Připravil Petr Veber.
- eventId: 643029
  start: 2026-10-25T10:00:00Z
  stop: 2026-10-25T11:00:00Z
  title: Radioseriál
  description: 'Pavel Molek: Smetana. 4. část - Ticho. Dramatická minisérie o životě v hudbě. Režie Lukáš Hlavica a Klára Novotná. Zvuk Jitka Špálová. Hudební a zvukový design Jakub Rataj. Dramaturgie Klára Novotná. Účinkují: Jaroslav Plesl, Klára Suchá, Anežka Šťastná, Kateřina Hrdinová, Marek Lambora, Ondřej Brousek, Eliška Zbranková, Václav Neužil a další. Natočeno v roce 2024.'
- eventId: 643030
  start: 2026-10-25T11:00:00Z
  stop: 2026-10-25T11:05:00Z
  title: Polední zvony
  description: Z věže evangelického kostela v Jimramově, zvon odlitý v r. 1888 Vojtěchem Hillerem v souzvuku se zvonem odlitým v r. 2001 ve Žďárských slévárnách. Připravil Radek Rejšek.
- eventId: 643031
  start: 2026-10-25T11:05:00Z
  stop: 2026-10-25T11:20:00Z
  title: Svět poezie
  description: Kaloty. Výběr básní tajné organizace Bude Konec Světa v autorské interpretaci jejích členů. Připravil Dominik Mačas. Recitují František Skála, Pavel Lev a Pavel Prášil. Režie Miroslav Buriánek Natočeno v roce 2009 (15 min).
- eventId: 643032
  start: 2026-10-25T11:20:00Z
  stop: 2026-10-25T12:30:00Z
  title: Polední koncert
  description: 'Diriguje Václav Smetáček 2/2. Na programu: Sláva Vorlová: Božena Němcová. Symfonická svita o osmi obrazech na motivy ze života slavné české spisovatelky a národní buditelky. Dílo zazní na koncertním snímku z pražské Smetanovy síně z roku 1952. Ze vzácných nahrávek dlouholetého šéfdirigenta Pražských symfoniků, jehož dvojí výročí si v roce 2026 připomínáme, vybírá Vojtěch Babka.'
- eventId: 643087
  start: 2026-10-25T12:30:00Z
  stop: 2026-10-25T13:00:00Z
  title: Povídka
  description: 'Rosa Liksom: Tátovy padesátiny. Dva příběhy v jednom celku, kterými autorka umně dokazuje, že jídlo a život patří nerozlučně k sobě. Z finštiny přeložil Vladimír Piskoř. Pro rozhlas připravila Vladimíra Bezdíčková. Účinkuje Eliška Vocelová. Režie Jakub Doubrava (23 min). Natočeno v roce 2024.'
- eventId: 643088
  start: 2026-10-25T13:00:00Z
  stop: 2026-10-25T14:00:00Z
  title: Krásné hlasy
  description: Hledám tě, kráso...Bella Adamova zpívá raritní písňové cykly Miloše Vacka a Iva Dědiny. Uvádíme nahrávky, které pěvkyně pořídila pro Český rozhlas. Na klavír hraje Ahmad Jafar Hedar. Připravil a s pěvkyní rozmlouvá Vojtěch Babka.
- eventId: 643089
  start: 2026-10-25T14:00:00Z
  stop: 2026-10-25T15:00:00Z
  title: Hra pro pamětníky
  description: 'Frederick Brown: Hvězdná myš. Sci-fi groteska o jednom experimentu, nedobrovolném kosmonautovi a překvapivém ohrožení naší civilizace. V rolích profesora Oberburgera, myšáka Mitkeye, a několika mimozemšťanů účinkuje Miloš Kopecký. Přeložil Jaroslav Kořán. Hudební improvizace Radim Hladík st. Režie Pavel Linhart. Účinkuje: Miloš Kopecký. Natočeno v roce 1989.'
- eventId: 643190
