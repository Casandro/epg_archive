  title: Jazzový podvečer
  description: Úhel poslechu přední osobnosti české hudby, trumpetistky a mezinárodně žádané jazzové umělkyně. Tuto neděli uvádí Štěpánka Balcarová.
- eventId: 643194
  start: 2026-10-25T17:30:00Z
  stop: 2026-10-25T18:00:00Z
  title: Četba na pokračování
  description: 'Markéta Pilátová: Tsunami blues (11/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkuje Dana Černá. Režie Vlado Rusko (25 min). Natočeno v roce 2015.'
