  description: Vzpomínka na skladatele Vladimíra Wernera. Arabesky pro klarinet a klavír. Hraje Duo con brio. - Milostné madrigaly na texty východní poezie. Zpívá Brněnský akademický sbor, sbormistr Lubomír Mátl. - Concerto da camera pro fagot a smyčcový orchestr. Hraje František Svoboda a Čeští komorní sólisté, řídí Jan Zbavitel. (Brno)
