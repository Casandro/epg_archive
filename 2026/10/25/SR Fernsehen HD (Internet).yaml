  description: 'Vor der französischen Südküste spielt sich unter Wasser ein Drama ab: Ein altes Tümmlerweibchen ist in ein Gewirr aus Fischernetzen geraten. Etwa 4.000 Kilometer weiter südöstlich, vor der wild zerklüfteten Küste Griechenlands, ist währenddessen Guillaume Néry auf der Suche nach einem der seltensten Säugetiere der Welt: Mönchsrobben. Die zweiteilige Dokumentation "Magisches Mittelmeer" zeigt das scheinbar so bekannte Meer aus der Perspektive seiner tierischen Bewohner.'
