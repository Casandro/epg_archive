  title: Das Almtal - Mächtige Berge, klares Wasser und faszinierende Wildtiere
  subtitle: Film von Erich Pröll
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das Almtal im Traunviertel zählt zu den imposantesten Landschaften Österreichs. Erich Pröll trifft zu Beginn "Märchen-Erzähler" Helmut Wittmann und entführt in die Mystik rund um den Almsee.

    Kühl, sauber und glasklar steigt Wasser aus unzähligen Quellen des Seebodens auf und nährt damit den Almsee. Forellen und Saiblinge entwickeln sich hier prächtig - zur Freude der Fischer. Mit der Unterwasserkamera gelingt ein Blick in den Fischkalter.
    Kamera: Erich Pröll

