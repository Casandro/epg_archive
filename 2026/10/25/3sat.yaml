  title: Arlberg - Wild und Weltberühmt
  subtitle: Film von Manfred Corinne
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Arlberg: weltbekanntes Skigebiet und Treffpunkt für den Jetset. Es sind die weitläufigen Kiefernwälder, die der Region den Namen gaben. Im Vorarlberger Volksmund heißen Kiefern nämlich Arlen.

    Schnee und Eis prägen die raue Landschaft, in der sich eine speziell angepasste Tierwelt entfaltet. Gämsen, Rehe, Hirsche, Murmeltiere, Schneehühner, Steinadler und viele mehr haben sich einen Lebensraum zwischen den Wäldern, Felsen und Gipfeln des Bergs erobert.
