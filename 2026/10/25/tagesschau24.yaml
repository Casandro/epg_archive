  audiodesc: true
  description: "Die Familiengeschichte der Kotanyis reflektiert den Zeitraum vor und nach dem Zweiten Weltkrieg in Ungarn und bezieht sich vor allem auf den Ungarn-Aufstand 1956. \nDie Eltern - als dissidente Intellektuelle bespitzelt und in die Isolation getrieben - entschieden sich, mit ihren drei Kindern nach Westeuropa zu emigrieren. Heute leben Mutter, Vater und Geschwister der Filmemacherin Sophie Kotanyi seit Jahrzehnten voneinander getrennt, unter anderem in Berlin, Brüssel, Düsseldorf und seit kurzem auch wieder in Budapest. \nFamiliengeschichte als Rekonstruktion von Zeitgeschichte."
