  description: 'Am 23. Oktober 1956 erhebt sich das Volk gegen das Regime in Ungarn. Doch der Traum von einem freien, demokratischen und neutralen Ungarn währt gerade einmal zwei Wochen. Zunächst können die Aufständischen die Rote Armee in Budapest bezwingen. Doch am 4. November müssen sich die Freiheitskämpfer der Übermacht der sowjetischen Panzer ergeben. Die Bilanz ist fürchterlich: 2.500 Tote; 12.000 Verletzte bei den Kämpfen; nach der Niederschlagung des Aufstands Zehntausende Häftlinge und 200.000 Flüchtlinge.'
