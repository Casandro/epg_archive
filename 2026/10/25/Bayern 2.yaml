  title: Bayern 2 Hörspiel
  subtitle: '"Die Sklaven der Arbeit (2/2)" von Karl May'
  description: "Der Kampf zwischen Arbeitern und Kaufleuten geht weiter: Fritz Seidelmann, Sohn eines reichen Kaufmanns, verdächtigt den Weberssohn Eduard, im Dienste des geheimnisvollen \"Fürsten des Elends\" zu stehen. Es kommt zu einem Racheplan, der alles eskalieren lässt.\n\nVon Karl May\nMit Michael Degen, Matthias Ponnier, Angelika Thomas, Grete Wurm, Helmut Stange, Wolfried Lier, Peter Fricke, Karl Maldek, Dieter Wieland, Franz Kutschera, Günter Mack, Wolfgang Büttner, Otto Stern, Michael Robert, Maria Singer, Alexander Malachovsky, Peter Brand, Burkhard Gaffron, Werner Singh und anderen\nKomposition: Peter Zwetkoff \nRegie: Walter Adler, Bernd Lau \nBR 1977\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
