  title: WDR 5 Hörspiel am Sonntag
  subtitle: Wellenreiter
  description: |-
    Ari ist <markup type="abbr" abbreviation="25" correspondent="fünfundzwanzig">25</markup> und CB-Funker. Die Station hat er von seinem Vater geerbt. Ari hockt im Keller, ist immer auf dem gleichen Kanal und erfindet sich in den Geschichten, die er erzählt, ein neues Leben. Und dann taucht auf einmal Lana auf Aris Welle auf und bringt seine Welt ins Wanken. Eine Geschichte über Liebe und Verlust, Vertrauen und Identität. Der einzige Ausweg für die Protagonisten scheint ein <markup type="language.en">Happy End</markup> zu sein. Doch dazu müssten sie ihre Welle verlassen, also die einzige Verbindung trennen, die sie am Leben erhält.
    Regie: Tim Staffel<br/>Produktion: WDR <markup type="abbr" abbreviation="2014" correspondent="zweitausendvierzehn">2014</markup>
    Ab dem <markup type="abbr" abbreviation="17." correspondent="siebzehnten">17.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
