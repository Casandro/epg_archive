  title: WDR 5 - Lies mir was vor
  subtitle: 'Kerstin Preiwuß: Dein Koffer + Judith Kuckart: Dann fahr doch mal weg, Maria Malkovich!'
  description: "<strong>Kerstin Preiwuß: Dein Koffer </strong>\nDie Autorin Kerstin Preiwuß macht sich Gedanken über das wichtigste Zubehör des Reisens: den Koffer. Was, wenn das ganze Leben eine Reise ist? Dann besitzt jeder von Geburt an seinen Koffer: Er ist ein Umriss, der sich füllt \"mit allen Dingen, die das Dasein hergibt\". Dieser Koffer kann nicht beliebig gepackt werden. Er ist leicht und schwer zugleich, ein Ursprungsmythos und ein Vermächtnis. \nVon Kerstin Preiwuß <br/>Mit: Kerstin Preiwuß <br/>Produktion: NDR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup> /<markup type=\"abbr\" abbreviation=\"23&apos;\" correspondent=\"23 Minuten\">23'</markup>\nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>.\n<strong>Judith Kuckart: Dann fahr doch mal weg, Maria Malkovich! </strong>\nMaria Malkovich schreibt in einem Schulaufsatz, dass sie schnell erwachsen werden will, damit in ihrem Leben endlich etwas passiert. <markup type=\"cite\">\"Dann fahr doch mal weg, Maria Malkovich!\"</markup>, gibt die Lehrerin ironisch zurück. Und das macht die junge Albanerin, auch wenn sie kein Geld hat und zunächst nur bis zum Friedhof kommt, wo sie übernachtet und auf den Gräbern Gemüse pflanzt.\nVon Judith Kuckart <br/>Mit: Judith Kuckart <br/>Produktion: SR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup> /<markup type=\"abbr\" abbreviation=\"24'\" correspondent=\"vierundzwanzig Minuten\">24'</markup>\nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
