  title: Zwei Seiten - Der Podcast über Bücher
  description: "Drei Jahre sind vergangen, seit wir offiziell Freundinnen geworden sind. In dieser Folge schauen wir zurück auf das, was seitdem zwischen uns passiert ist, aber wir sprechen auch ganz allgemein über Freundinnen. Kann man einer guten Freundin wirklich alles erzählen? Muss man ihr alles gönnen können? Wo verlaufen die Grenzen einer Freundschaft? Und wann hat eine Freundin eine zweite Chance verdient? Außerdem stellen wir euch diese beiden Romane vor: \nMona Ameziane empfiehlt: \"Alte Sorten\" von Ewald Arenz\nChristine Westermann empfiehlt: \"Ein unerhörter Wunsch\" von Ann Packer"
