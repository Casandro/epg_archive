  title: 'Rosamunde Pilcher: Duch z Cassley 1 (odc. 142)'
  subtitle: 'Riley Owen, osobisty ochroniarz, otrzymuje nietypowe zlecenie: ma strzec młodej wdowy, Lady Anjali Cassley, przed rzekomym duchem. Matka Anjali chce wydać córkę ponownie za mąż.'
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Das Gespenst von Cassley
    DE, 2017
    Reżyseria: Marco Serafini
    Występują: Patricia Meeden, Martin Gruber, André Eisermann, Michael Roll, Claudia Wenzel, Sima Bürgin
    Ochroniarz osobisty, Riley Owen dostaje dziwne zlecenie. Ma chronić młodą wdowę, Lady Anjali Cassley, przed duchem. Uważa, że zlecenie jest niepoważne, lecz mimo to decyduje się je przyjąć, ma bowiem spore długi do spłacenia. Matka Anjali chce wydać córkę ponownie za mąż. Ochroniarz szybko się domyśla, o co w tym wszystkim chodzi, i stara się pomóc pięknej Anjali, mieszkającej w zamku razem z rodzicami zmarłego męża - Susan i Duncanem Cassleyem.
