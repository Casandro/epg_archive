  title: RUF CTR Anniversary - Exklusiver als Porsche
  subtitle: RUF CTR Anniversary - Exklusiver als Porsche
  description: 'Im Jahr 1987 erschien der RUF CTR, der damals als schnellstes Serienfahrzeug der Welt bezeichnet wurde. Mit der Geschwindigkeit von 339 Kilometern pro Stunde übertraf der Supersportwagen mit dem Spitznamen "Yellowbird" Konkurrenzfahrzeuge namhafter Hersteller, darunter Ferrari, Lamborghini und Porsche. 30 Jahre später wurde der Nachfolger des Kultfahrzeugs präsentiert: der CTR Anniversary. Die Reportage erzählt die Geschichte des Oldtimers und zeigt die Entstehung des Kleinserien-Supersportlers.'
