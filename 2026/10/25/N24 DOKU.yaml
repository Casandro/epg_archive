  title: Geschichte in Farbe - Unternehmen Barbarossa
  subtitle: Geschichte in Farbe - Unternehmen Barbarossa
  description: Nach seinem erfolgreichen "Blitzkrieg" im Westen, wendet sich Hitler dem Osten zu. Er will im Sommer 1941 in die Sowjetunion einmarschieren. Für Hitler war die Sowjetunion eine Art Land der Verheißung, das die Expansion des Deutschen Reichs ermöglichen würde. Um die Bevölkerung der Sowjetunion zu vernichten, ordnet er eine gezielte Politik der Aushungerung an. Die geplante Invasion trägt den Decknamen "Unternehmen Barbarossa" - nach dem mittelalterlichen deutschen Kaiser Friedrich Barbarossa.
