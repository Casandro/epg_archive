  description: "12:00\nAktuelles & Sport\n\n12:30\nMariniæ's FREIHEIT\nKI-IIing me softly feat. Katharina Zweig\nIn dieser Woche möchte ich mit euch über ein Thema sprechen, über das gefühlt alle reden - und über das trotzdem viel zu wenig geredet wird: Künstliche Intelligenz.\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n13:00 \nCamino - Religionen auf dem Weg\nNachgefragt. Das aktuelle Gespräch mit Nora Bossong, Schriftstellerin: Warum brauchen wir mehr Glauben?\nAlle zwei Monate betrachtet die hr-Kirchenredaktion ein aktuelles Thema aus der Welt der Kirchen und Religionen. Im Gespräch mit Experten liefern wir Hintergründe, Einordnungen und Antworten auf Fragen, die hinter den Schlagzeilen oft offenbleiben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - Wieviel Hessisch steckt im Pop?\nHessisch kann vertraut klingen, eigenwillig und voller Witz. Doch wie viel davon steckt eigentlich in der Popmusik? Mal ist der Dialekt unüberhörbar, mal verraten nur einzelne Wörter oder die Aussprache, wo jemand herkommt. Und manchmal bleibt das Hessische ganz außen vor. Von den Rodgau Monotones bis zum regionalen Hip-Hop führt eine musikalische Spurensuche durch Hessen. Henni Nachtsheim, Rapper Mädness und zwei Sprachwissenschaftler erzählen vom Spiel mit Sprache und Rhythmus, von regionaler Identität und davon, wie sich der Klang des Hessischen verändert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~ \nBianca Schwarz im Gespräch mit Ines Schwerdtner, Parteivorsitzende Die Linke \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n  \n14:30  \nSWR Kultur Das Wissen\nAufmerksamkeit lernen - Wie wir uns besser konzentrieren können\nSmartphone, Social Media und Benachrichtigungen konkurrieren permanent um unsere Aufmerksamkeit. Doch verkümmert dadurch unsere Konzentrationsfähigkeit? Und wie können wir die sinnvoll trainieren? \nNadine Zeller spricht mit dem Neurobiologen Prof. Martin Korte von der TU Braunschweig (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
