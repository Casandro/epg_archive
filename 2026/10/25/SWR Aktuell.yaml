  description: "15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND \nDie Codes der Mafia 2 (4/8)\nWie funktioniert eigentlich das System 'Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: Tickt die EU noch richtig? - so steht's um die Zeitumstellung\nPünktlich zur Zeitumstellung gibts eine neue Initiative auf EU-Ebene: schafft sie endlich ab! Woran hängts eigentlich beim Dauerthema Zeitumstellung in Europa. Wird sie noch abgeschafft? Oder ist schon alles zu spät? Mit Kathrin Schmid, Thomas Spickhofen und Sabrina Fritz.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - Warum stoppt niemand den Krieg im Sudan?\nDer Krieg im Sudan wird immer schlimmer. Millionen Menschen sind auf der Flucht - erst recht seit dem brutalen Angriff auf El Fasher vor genau einem Jahr. Milizen haben damals die Stadt eingenommen und laut UN in nur drei Tagen 6.000 Menschen ermordet. Die Welt schaut bis heute kaum hin. Dabei droht in El Obeid schon die nächste Katastrophe.\nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nAltersvorsorgedepot - Muss ich da jetzt rein?\nAltersvorsorgedepot: Bis zu 540 Euro Staatsbonus für deine Altersvorsorge. Wie du Gebühren, Risiko und Rentenlücke im Griff behältst. \"Jetzt informieren\", \"Jetzt umschichten!\" - viele Finanzdienstleister werben momentan aggressiv für das neue Altersvorsorgedepot. Das Angebot soll Riester ablösen: mehr Aktien, ETFs und Renditechancen, aber keine Beitragsgarantie mehr.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
