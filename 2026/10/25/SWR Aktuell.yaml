  description: "6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nDer Wind, der Wind, das himmlische Kind\nHerbst ist Windzeit: Er fegt Blätter, fordert Radfahrer heraus, formt Charakter und schenkt neue Energie. Vom Drachensteigen bis zur alten Windmühle in Bad Nauheim - den Wind können wir nicht ändern, aber unsere Segel richtig setzen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen\nAufmerksamkeit lernen - Wie wir uns besser konzentrieren können\nSmartphone, Social Media und Benachrichtigungen konkurrieren permanent um unsere Aufmerksamkeit. Doch verkümmert dadurch unsere Konzentrationsfähigkeit? Und wie können wir die sinnvoll trainieren? \nNadine Zeller spricht mit dem Neurobiologen Prof. Martin Korte von der TU Braunschweig (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00\nARD Interview der Woche ~ \nBianca Schwarz im Gespräch mit Ines Schwerdtner, Parteivorsitzende Die Linke \nSeit Die Linke in Berlin die Abgeordnetenhauswahl gewonnen hat, vergeht kein Tag ohne neue Negativ-Schlagzeilen über die Partei. Es geht um Antisemitismus, um Kontakte zur Organisierten Kriminalität, um zu große Nähe zum Extremismus und um zu wenig Durchsetzungskraft der Parteispitze. Die Linke bezeichnet einiges davon als politische Kampagne mit dem Ziel, eine linke Bürgermeisterin namens Elif Eralp im Roten Rathaus zu verhindern. Doch an anderen Stellen übt Parteichefin Ines Schwerdtner Selbstkritik und vertritt im ARD Interview der Woche die Haltung: Es gibt Probleme, an welche Die Linke ran muss, um glaubwürdig und anschlussfähig zu bleiben. Das ARD Interview der Woche hat Bianca\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n  \n7:30  \nWeltspiegel - Warum stoppt niemand den Krieg im Sudan?\nDer Krieg im Sudan wird immer schlimmer. Millionen Menschen sind auf der Flucht - erst recht seit dem brutalen Angriff auf El Fasher vor genau einem Jahr. Milizen haben damals die Stadt eingenommen und laut UN in nur drei Tagen 6.000 Menschen ermordet. Die Welt schaut bis heute kaum hin. Dabei droht in El Obeid schon die nächste Katastrophe.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
