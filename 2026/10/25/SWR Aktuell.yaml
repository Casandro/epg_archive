  description: "9:00\npunktEU: Tickt die EU noch richtig? - so steht's um die Zeitumstellung\nPünktlich zur Zeitumstellung gibts eine neue Initiative auf EU-Ebene: schafft sie endlich ab! Woran hängts eigentlich beim Dauerthema Zeitumstellung in Europa. Wird sie noch abgeschafft? Oder ist schon alles zu spät? Mit Kathrin Schmid, Thomas Spickhofen und Sabrina Fritz. \nGibt es auch zum Nachhören in ARD-Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n9:30\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nAltersvorsorgedepot - Muss ich da jetzt rein?\nAltersvorsorgedepot: Bis zu 540 Euro Staatsbonus für deine Altersvorsorge. Wie du Gebühren, Risiko und Rentenlücke im Griff behältst. \"Jetzt informieren\", \"Jetzt umschichten!\" - viele Finanzdienstleister werben momentan aggressiv für das neue Altersvorsorgedepot. Das Angebot soll Riester ablösen: mehr Aktien, ETFs und Renditechancen, aber keine Beitragsgarantie mehr.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/ \n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - \"Ich singe um mein Leben\" - Reinhard Mey im neuen Porträt\nReinhard Mey ist DER deutsche Liedermacher, seit über 60 Jahren. Mit Hits wie \"Über den Wolken\", \"Gute Nacht, Freunde\" oder \"Nein, meine Söhne geb'  ich nicht\". Vor kurzem ist Reinhard Meys 30. Studioalbum \"Schatzhauser\" erschienen und hat ihn aus dem Stand auf Platz 1 der Deutschen Albumcharts katapultiert. Fast zeitgleich ist ein neues Buch über den Berliner Musiker erschienen: >\"Ich singe um mein Leben\". Reinhard Mey - ein Porträt<. Dafür stand der Literaturwissenschaftler, Lektor und Autor Oliver Kobold über vier Jahre hinweg mit Reinhard im Austausch. Warm und berührend erzählt Kobold hier die Geschichten hinter den Liedern. So entsteht ein vielschichtiges Bild des Musikers und Menschen Reinhard Mey.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nDer Wind, der Wind, das himmlische Kind\nHerbst ist Windzeit: Er fegt Blätter, fordert Radfahrer heraus, formt Charakter und schenkt neue Energie. Vom Drachensteigen bis zur alten Windmühle in Bad Nauheim - den Wind können wir nicht ändern, aber unsere Segel richtig setzen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nBestsellerautorin Meike Winnemuth darüber, warum Lesen uns so glücklich macht\nMeike Winnemuth liebt Selbstversuche. So hat sie schon einmal ein Jahr lang täglich das gleiche blaue Kleid getragen. Ist, nachdem sie in Günther Jauchs Quizshow \"Wer wird Millionär\" eine halbe Million Euro gewonnen hat, ein Jahr durch 12 Städte um die Welt gereist. Über ihre Weltreise hat sie dann ihren Bestseller \"Das große Los\" geschrieben. Nach der Reise um die Welt beendete sie ihr Nomadentum und hat in einer kleinen Hütte mit Garten an der Ostsee danach ein neues Zuhause gefunden. Über das Ankommen dort und ihr Jahr mit den Händen in der Erde ihres Gartens schreibt sie in ihrem Bestseller \"Bin im Garten\".\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
