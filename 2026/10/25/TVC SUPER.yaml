    Po udzieleniu ślubu mer miejscowości, Pauline Domergue, została znaleziona martwa w Parku Narodowym Mercantour. Kobieta miała na sobie suknię wieczorową i buty na obcasie. Kobieta została pożarta przez wilki. Sytuacja jest tym bardziej zadziwiająca, że walczyła ona o ochronę tych drapieżników, tak znienawidzonych przez hodowców i rolników z regionu. W pobliżu zwłok zostają znalezione także kawałki mięsa. Czy ktoś zwabił wilki? Czy chodziło o porachunki? A może to może sprytna inscenizacja?
