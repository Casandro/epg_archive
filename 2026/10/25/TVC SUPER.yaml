  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 10)'
  subtitle: W klubie tanecznym, do którego uczęszcza komendant Canovas, dochodzi do zbrodni. Znajomość środowiska pomaga w trakcie dochodzenia. Candice i jej zespół odkrywają pełen przemocy rodzinny dramat.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Delphine Rich, Samira Lachhab, Stéphane Blancafort
    Obcasy Candice stukają po nowym torze. Przyznajmy ? niezbyt lśniącym. W sali tanecznej znaleziono pocięte ciało. Klub, o którym mowa, to miejsce, gdzie od lat trenował komendant Canovas, dla przyjaciół, takich jak Candice, znany jako David. W pozornie efektownej scenerii salsy, brokatu i konkursów tańca Candice i jej zespół próbują odróżnić prawdę od fałszu. Pomoc Canovasa i jego unikalna wiedza na temat środowiska są nieocenione.
