  title: The Chosen
  subtitle: Grenzenloses Mitgefühl
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jesus macht sich auf den Weg nach Kapernaum. Simon erhält den Auftrag, nach Hause zu gehen und sich um eine wichtige Angelegenheit zu kümmern. Als er dort auf Matthäus trifft, bricht ihre alte Feindschaft wieder hervor. Nikodemus setzt sich für Johannes den Täufer ein, doch der Pharisäer Shmuel ist dagegen. Kann Nikodemus ihm die Augen für Gottes Handeln in der Gegenwart öffnen? Währenddessen kehrt Jesus bei den Brüdern Jakobus und Johannes ein. Immer mehr Menschen wollen Jesus sehen, was auch die Aufmerksamkeit der Römer auf sich zieht und sie in eine gefährliche Lage bringt ...'
