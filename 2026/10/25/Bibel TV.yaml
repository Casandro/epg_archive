  subtitle: Der Kronzeuge
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Lucia, die Tochter des Ehepaares Matteucci wird gemeinsam mit der jüngeren Tochter von Maresciallo Cecchini aus der Schule entführt. Der Grund für die Entführung ist schnell klar, denn Lucias Vater ist der Kronzeuge in einem wichtigen Prozess, weswegen er und seine Familie unter falschen Namen in Gubbio leben. Nun soll er mit der Tochter als Druckmittel zum Schweigen gebracht werden. Es beginnt eine fieberhafte Suche nach den beiden entführten Mädchen, bei der natürlich auch Don Matteo mit von der Partie ist.'
