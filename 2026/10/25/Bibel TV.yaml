  title: The Chosen
  subtitle: Einladungen
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Welche Verbindung besteht zwischen der Schlange aus Bronze, die Mose laut der Heiligen Schrift schmiedete, und den Heilungen, die Jesus vollbringt? Den Römern missfällt, dass Jesus immer mehr Aufmerksamkeit erhält und Quintus stattet Nikodemus einen Besuch ab. Dieser ist bereit, alles seiner Suche nach der Wahrheit unterzuordnen und drängt auf ein Treffen mit Jesus. Matthäus arbeitet mit dem Römer Gaius zusammen und hofft auf Schutz. Doch kann es einen Schutz vor dem Ruf des Messias geben?'
