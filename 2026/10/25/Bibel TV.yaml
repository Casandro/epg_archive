  title: Hour of Power
  subtitle: Warum Gott dich manchmal warten lässt
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Warten auf eine Gebetserhörung wirft oft die Frage auf, warum Gott sich manchmal Zeit lässt. Warten fällt schwer, besonders wenn sich eine erhoffte Veränderung lange nicht zeigt. Doch Gottes Zusagen verlieren ihre Gültigkeit nicht, nur weil ihre Erfüllung auf sich warten lässt. Diese Predigt macht Mut, an Gottes Treue festzuhalten, auch wenn die Umstände dagegenzusprechen scheinen. Sie zeigt auf, warum Hoffnung und Vertrauen selbst in langen Wartezeiten tragen können'
