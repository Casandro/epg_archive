- eventId: 1433529
  start: 2026-10-25T16:04:00Z
  stop: 2026-10-25T17:20:00Z
  title: 'Hörspielzeit: Choco Bé'
  subtitle: von Laura Tirandaz  (SR/DKultur 2015)
  description: "Choco Bé hat das Rotlichtviertel hinter sich gelassen, in dem er aufgewachsen ist. Er versucht, seinen Platz zu finden als Vater, Ehemann und Geliebter, Sohn und Bruder. Doch Choco fühlt sich zunehmend einsam, ruhelos, getrieben von all den familiären und gesellschaftlichen Ansprüchen. Zudem wird bald der Mann aus dem Gefängnis entlassen, der auf ihn geschossen hat. Wird mit dem Regen die Rache kommen? Und wird sein ach so moralischer Bruder ihn erneut im Stich lassen? Französisch Guyana ist bis heute geprägt vom Kolonialismus. Was heißt es hier, je nach Herkunft und Hautfarbe, ein Mann zu sein, eine Frau?  \nAlle Figuren tragen ihre eigene dunkle Seite in sich: illegale Geschäfte, Eifersucht, Rache, angestauter Frust. Das alles spielt in der schwülen Hitze des Regenwaldes und während eines Festes, das zum explosiven Ventil wird. Im Mittelpunkt steht auch Guyana selbst, ein Land zwischen drückender Hitze und Gewalt. Die Geschichte verzichtet bewusst auf Exotik und Folklore und erzählt von vielschichtigen, rätselhaften und zugleich faszinierenden Figuren."
