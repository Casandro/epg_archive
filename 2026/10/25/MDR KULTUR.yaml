  title: 'MDR KULTUR Café: Johanna Wokalek'
  description: "Brigitte setzt alle Hebel in Bewegung, sie kämpft gegen ihr Alter, gegen Falten, gegen die Müdigkeit ihres Körpers. Als Messe-Hostess bedeuten die Veränderungen ihres Aussehens auch Verlust ihres Marktwertes. Dann lernt Brigitte die junge, aufstrebende Schülerin Paula kennen, sie beginnt, sich zu vergleichen und will grundsätzlich ihr Leben verändern.\nJohanna Wokalek spielt Brigitte in dem Film \"Liebhaberinnen\" nach dem Erfolgsroman von Elfriede Jelinek aus dem Jahr 1975. Damals schaffte die Österreicherin ihren literarischen Durchbruch, provozierte, fiel auf mit ihrer krassen, obszönen Sprache, mit ihrer unbarmherzigen Analyse gesellschaftlicher Zwänge und patriarchaler Machtstrukturen.\nÜber die Kunst des Rollenspiels, über die Literaturnobelpreisträgerin Elfriede Jelinek, die jetzt ihren 80. Geburtstag gefeiert hat, spricht Johanna Wokalek. \nEine Sendung von Andrea Schwyzer (Übernahme NDR Kultur)\n\nRedaktion für MDR KULTUR: Gabriele Bischoff"
