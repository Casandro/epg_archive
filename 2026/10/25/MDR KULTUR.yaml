  title: MDR KULTUR am Sonntagnachmittag
  description: "* 13:45 Uhr - Der Stichtag: 1961 Konfrontation am Checkpoint Charlie\nDie  Konfrontation zwischen Sowjets und Amerikanern erreicht mit dem Aufmarsch der Panzer am Checkpoint Charlie einen neuen Höhepunkt.\nAutor: Thomas Hartmann\n\n* 15:05 Uhr - MDR KULTUR - Diskurs: Russland - eine deutsche Erfindung? \nGwendolyn Sasse, Direktorin des Zentrums für Osteuropa- und internationale Studien, im Gespräch mit Stefan Nölke \nWelche Meinung haben die Deutschen von Russland und seinem imperialistischen Autokraten Wladimir Putin? Und wie weit gehen die Meinungen darüber auseinander? Zu diesen Fragen hat die Politologin Gwendolyn Sasse von 2019 bis Ende 2025 drei große Umfragen durchgeführt. Die Ergebnisse sind zum Teil erstaunlich: Denn wenn die Deutschen über Russland sprechen, so das Fazit, dann sprechen sie weniger über die realen Verhältnisse dort als vielmehr über ihre eigenen Hoffnungen, Ängste und Befindlichkeiten. Sind die Bilder, die sich die Deutschen von Russland machen, also mehr oder weniger eine Erfindung? Das jüngste Buch der Direktorin des Zentrums für Osteuropa- und internationale Studien legt dies nahe. Mit Gwendolyn Sasse sprach MDR Kulturredakteur Stefan Nölke."
