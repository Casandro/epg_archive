  title: Gottesdienst der Evangelische Hochschule Dresden vom Campus Moritzburg
  description: |-
    Den Gottesdienst vom Campus Moritzburg der Evangelischen Hochschule Dresden (EHS) gestalten Lehrende und Studierende gemeinsam. Musikalisch wirkt unter anderem der Chor Moritzburger Klangschale mit. Auch die Kirchgemeinde Moritzburg lädt zum Mitfeiern ein.

    Im Mittelpunkt des Gottesdienstes steht Jeremia 29. Der Prophet ermutigte Menschen im Exil, sich nicht zurückzuziehen, sondern "der Stadt Bestes zu suchen" und hoffnungsvoll in die Zukunft zu schauen.

    Der Gottesdienst verbindet damit die biblische Verheißung mit dem Bildungsauftrag der EHS, junge Menschen zu reflektiertem und verantwortungsbewussten Handeln zu befähigen, als Beitrag zu einer solidarischen und gerechten Gesellschaft.
  subtitle: Predigt Prof. Johann Meylahn
