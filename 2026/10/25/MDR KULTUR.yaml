  title: MDR KULTUR am Sonntagmorgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:30 Uhr - Bach-Kantate (Folge 63) 21. So. nach Trinitatis\nJohann Sebastian Bach: Aus tiefer Not schrei ich zu dir BWV 38\nMarie-Sophie Pollak, Sopran, Mélodie Ruvio, Alt, Benjamin Bruns, Tenor, Thomas E. Bauer, Bass\nChorus Musicus Köln, Das Neue Orchester\nChristoph Spering\n\n* 07:00 Uhr - Nachrichten\n\n* 07:15 Uhr - Wort zum Tag\n\n* 08:00 Uhr - Nachrichten\n\n* 07:45 Uhr - Wortschätze: \"Ode an das Risiko\" von David van Reybrouck\nEr ist ein international berühmter und preisgekrönter Sachbuchautor und Romancier und - seit letztem Jahr - Träger der Goethe-Medaille: David Van Reybrouck. Geboren wurde er 1971 in Flandern, genauer in Brügge. In Kolumnen bedient er sich der jahrtausendealten Form der Ode. Auf den ersten Blick vielleicht erstaunlich. Van Reybrouck allerdings nutzt diese seit jeher für die rühmende Hinwendung zu Menschen und Dingen bestimmte Form auf seine eigene, sehr persönliche Weise. Matthias Matschke liest David van Reybroucks \"Ode an das Risiko\".\n\n* 08:15 Uhr - Erste Pilgerkirche Sachsens steht in Lößnitz \nPilgern liegt im Trend - doch dafür muss man nicht nach Spanien auf den Jakobsweg fahren. Auch in Sachsen führen alte und neue Pilgerwege durch die Landschaft. Im erzgebirgischen Lößnitz treffen gleich zwei von ihnen aufeinander. Und dort hat eine Kirche, deren Zukunft lange ungewiss war, als Pilgerkirche eine neue Aufgabe bekommen: Die Hospitalkirche in Lößnitz ist die erste Pilgerkirche in Sachsen. Und wie es dazu kam, erzählt uns Heike Schwarzer. \n\n* 08:30 Uhr - Wetter & Verkehr \n\n* 08:45 Uhr - Der Stichtag: 1961 Konfrontation am Checkpoint Charlie\nMit dem ehemaligen Ost-/Westberliner Grenzübergang Checkpoint Charlie hat man große Pläne vor. Eine Neugestaltung steht in den nächsten Jahren an, mit Informationspavillon, Aussichtsplattform etc., denn im jetzigen Zustand werde der Touristenmagnet seiner historischen Bedeutung nicht gerecht. So standen sich hier vor 65 Jahren amerikanische und sowjetische Panzer gegenüber, der Kalte Krieg drohte zu eskalieren. Der Stichtag. Mit Thomas Hartmann.\n\n* 08:50 Uhr - Hinweis: MDR Diskurs mit Gwendolyn Sasse\nWelche Meinung haben die Deutschen von Russland und seinem autokratischen Präsidenten Wladimir Putin? Und wie weit gehen die Meinungen darüber auseinander? Darum geht es heute Nachmittag im Diskurs mit der Politologin Gwendolyn Sasse, die zu diesen Fragen von 2019 bis Ende 2025 drei große Umfragen durchgeführt hat. Die Ergebnisse sind zum Teil erstaunlich: Denn wenn die Deutschen über Russland sprechen, so das Fazit, dann sprechen sie weniger über die realen Verhältnisse dort als vielmehr über ihre eigenen Hoffnungen, Ängste und Befindlichkeiten. Und noch etwas ist interessant: Weil es ja oft heißt, die Meinungen über Putin und seinen Krieg gegen die Ukraine gegen in Ost und West auseinander. Tatsächlich ist es aber so, dass sich in Deutschland kaum noch jemand Illusionen über den Charakter von Putins Herrschaft macht. Nur bei der Schlussfolgerung daraus gibt es wiederum Differenzen, meint die Politologin Gwendolyn Sasse.\n\n* 09:00 Uhr - Nachrichten\n\n* 09:15 Uhr - 40 Jahre Hospizarbeit im Wandel \nVor 40 Jahren, am 26. Oktober 1986, wurde in Aachen das erste Hospiz in Deutschland eröffnet: ein Haus des katholischen Oratorianerordens, in dem bis heute sterbende Menschen medizinisch, menschlich und seelsorgerisch begleitet werden. Heute sind Hospize aus der gesundheitlichen Versorgung nicht mehr wegzudenken."
