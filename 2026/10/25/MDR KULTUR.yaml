  description: "* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Ausstellung \"WismutWeiber\" in Pirna\n\n* 13:45 Uhr - Der Stichtag: 1961 Konfrontation am Checkpoint Charlie\nMit dem ehemaligen Ost-/Westberliner Grenzübergang Checkpoint Charlie hat man große Pläne vor. Eine Neugestaltung steht in den nächsten Jahren an, mit Informationspavillon, Aussichtsplattform etc., denn im jetzigen Zustand werde der Touristenmagnet seiner historischen Bedeutung nicht gerecht. So standen sich hier vor 65 Jahren amerikanische und sowjetische Panzer gegenüber, der Kalte Krieg drohte zu eskalieren. Der Stichtag. Mit Thomas Hartmann.\n\n* 14:00 Uhr - Nachrichten\n\n* 14:15 Uhr - So wird DOK Leipzig\nHeute Abend startet Dok Leipzig, in der langen Fassung: Internationales Leipziger Festival für Animations- und Dokumentarfilm - die 69. Ausgabe. Es ist aber die erste Ausgabe für die neue Festivalleiterin Ola Staszel. Die von der Neiße, vom dortigen Filmfestival, an die Pleiße gewechselt ist. Und neu sind außerdem zwei neue Programmreihen, die sie sich ausgedacht hat. Eine eine der beiden, \"Fokus Ost\", gehört auch der Eröffnungsfilm: \"Guten Abend, Du Schöne\" von Ina Borrmann. Der feiert heute Abend eine doppelte Weltpremiere, im Schauspielhaus und, für alle Leipziger, im Hauptbahnhof. Lars Meyer über das anstehende Festival. \n\n* 14:45 Uhr - Vorschau:  Tatort \"Gottesgarten\" am 25. Okt. 2026\nWieder ein neues Gesicht im Tatort, diesmal in Nürnberg: Schauspielerin Rosalie Thomass startet als Kommissarin Emmy Rathgeber im fränkischen Revier. Philipp Münscher berichtet.\n\n* 15:00 Uhr - Nachrichten\n\n* 15:05 Uhr - MDR KULTUR - Diskurs: Russland - eine deutsche Erfindung? \nGwendolyn Sasse, Direktorin des Zentrums für Osteuropa- und internationale Studien, im Gespräch mit Stefan Nölke \nWelche Meinung haben die Deutschen von Russland und seinem imperialistischen Autokraten Wladimir Putin? Und wie weit gehen die Meinungen darüber auseinander? Zu diesen Fragen hat die Politologin Gwendolyn Sasse von 2019 bis Ende 2025 drei große Umfragen durchgeführt. Die Ergebnisse sind zum Teil erstaunlich: Denn wenn die Deutschen über Russland sprechen, so das Fazit, dann sprechen sie weniger über die realen Verhältnisse dort als vielmehr über ihre eigenen Hoffnungen, Ängste und Befindlichkeiten. Sind die Bilder, die sich die Deutschen von Russland machen, also mehr oder weniger eine Erfindung? Das jüngste Buch der Direktorin des Zentrums für Osteuropa- und internationale Studien legt dies nahe. Mit Gwendolyn Sasse sprach MDR Kulturredakteur Stefan Nölke. \n\n* 15:45 Uhr - Kultur international: 40 Jahre Villa Vigoni\nAuf den ersten Blick ist die Villa Vigoni einfach ein Herrenhaus, wunderschön gelegen am Comer See. Aber in dieser Villa steckt mehr: Seit 40 Jahren befindet sich hier das deutsch-italienische Zentrum für den europäischen Dialog. Der dazugehörige Verein wird von der deutschen und der italienischen Regierung gemeinsam getragen, hier treffen sich Wissenschaftler und Kunst- und Kulturschaffende aus beiden und anderen Ländern, um über Politik, Staat, Gesellschaft zu diskutieren - und nicht nur das. Ein Jubiläumsbesuch in der Villa von Lisa Weiß.\n\n* 16:00 Uhr - Nachrichten\n\n* 16:15 Uhr - Buchsommer-Leserpreis Sachsen 2026\nWas Jugendliche lesen wollen, entscheiden sie am besten selbst. Das jedenfalls ist die Idee des Sächsischen Buchsommer-Leserpreises. Anders als bei vielen Literaturpreisen haben hier weder Kritiker noch Verlage das letzte Wort, sondern die Jugendlichen selbst."
