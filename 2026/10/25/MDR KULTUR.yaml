  title: MDR KULTUR Folk und Welt
  description: "Die irische Fiddlerin und Songwriterin Clare Sands steht im Fokus mit ihrem Album \"They tried to bury us\", dazu laufen Songs aus Großbritannien mit Shovel Dance Collective, aus Brasilien mit Bebel Gilberto und \"Tanto Tempo\", produziert von Suba. Dazu Bands aus Serbien/Polen und aus Ungarn ein Hit aus den dreißiger Jahren, Pál Kalmár singt \"Szomorú Vasárnap\". \n\nDie irische Fiddlerin und Sängerin Clare Sands beklagt in ihrem Song \"They Tried to Bury Us\" die zivilen Opfer in Gaza in den letzten drei Jahren. Sie singt dabei auch Worte eines palästinensischen Dichters: \"Wenn ich sterben muss, musst du leben, um meine Geschichte zu erzählen.\" Und er verlor sein Leben im Dezember 2023 bei einem israelischen Luftangriff auf Gaza, nur zwei Monate nach dem brutalen Überfall der Hamas auf Israel. Schon das Debütalbum der Künstlerin aus Cork wurde von der Irish Times in die Top 5 der Alben des Jahres gewählt. Clare Sands feiert seitdem ihre Traditionen und verbindet sie mit Texten über die Wunden dieser Welt, ihr neues Album entstand in Nordirland, Grit Friedrich stellt es vor und es gibt Konzerttipps mit Huun Huur Tu aus Tuva in Dresden, mit The Klezmatics in Plauen und Dresden und mit dem Oud-Meister Alaa Zouiten in Leipzig.\n\nTitelliste:\n\nClare Sands - Meet Me in the Garden\nShovel Dance Collective - Jowl, Jowl and Listen Lads\nClare Sands - Under Oak and Olive\nClare Sands - Li Ban feat. Barry Kerr & Piaras O Lorcain\nClare Sands - Curlew Song feat. Rioghnach Connolly\nClare Sands - Briongloid an Fhidleara \nClare Sands - Os Cionn na Scamaill\nShovel Dance Collective - The Foxhunter's Reel\nShovel Dance Collective - Who Killed Cock Robin Gilberts Jig\nGordan - Sara\nSlavyk - Kochamy sie muzyka\nSourdure - Le Pebre (avec Lisa Langlois)\nCuatro Piraguas - La Cumbia del Jardinero\nCuatro Piraguas - Arrullo de Mar\nBebel Gilberto - Mais Feliz\nBebel Gilberto - Tanto Tempo  \nPál Kalmár - Szomorú Vasárnap  \nBillie Holiday - Gloomy Sunday\nThe Klezmatics - Di tsukunft (El Futuro)\nYasmine Hamdan - The beautiful losers \nAlaa Zouiten - Purpur Kora (rumba)\nHuun Huur Tu - Orai-La Boldu-La\nClare Sands - They Tried to Bury Us\nClare Sands - Beidh Gra Ann (on this island)"
  subtitle: They Tried To Bury Us  / Eine Sendung von Grit Friedrich
