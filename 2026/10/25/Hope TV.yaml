  title: Leben und Gesundheit
  subtitle: Immer wieder Zucker
  description: |-
    Zucker ist überall - im Joghurt, in der Cola, sogar im vermeintlich gesunden Fruchtsaft. Doch wie viel ist eigentlich noch normal? In Deutschland konsumiert jeder im Schnitt 34 kg Zucker pro Jahr - doppelt so viel wie empfohlen. Gibt es guten und schlechten Zucker - oder ist das nur ein Mythos? Gemeinsam mit Ernährungsberaterin Blanka Kral sprechen wir über versteckte Zucker, gesundheitliche Folgen und den bewussten Umgang mit Süße.

