  description: |-
    1972 drehte François Truffaut "Die amerikanische Nacht" in den Studios de la Victorine in Nizza. In der Komödie bemerkt Alphonse, gespielt von Jean-Pierre Léaud, dass es in der Stadt 35 Kinos gibt. Heute sind davon nur 5 übrig. Zurück in seiner Geburtsstadt Nizza begibt sich ein Filmemacher auf die Suche nach den damaligen Kinos.
