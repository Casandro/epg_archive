  title: Paris - Liebe, Luxus, Likes
  widescreen: true
  hd: true
  description: |-
    Weltspiegel wirft einen exklusiven Blick hinter die Kulissen der Menschen, die mit dem Mythos "Stadt der Liebe ihr Geld verdienen.

    Hochzeit in Paris, ein Luxus-Antrag vor dem Eifelturm, oder auf den Spuren von "Emily in Paris" durch die französische Hauptstadt. Paris und Romantik das scheint irgendwie zusammen zu gehören. Diese Weltspiegel Doku zeigt, wie Instagram, Serien und Statusdenken unsere Vorstellung von Liebe und Romantik beeinflussen. Zwischen Traumkulisse, Luxus-Paketen und Like-Jagd wollen wir wissen: Ist Paris noch die Stadt der Liebe  oder längst nur noch die Stadt des perfekten Liebes-Contents?

    Sendehinweis: 12.10.
