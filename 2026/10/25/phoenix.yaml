  title: Wenn die Alpen glühen
  widescreen: true
  hd: true
  description: Das Alpenglühen, jenes Farbenspiel der Gipfel im Morgen- oder Abendlicht, hat heute eine weitere, gänzlich unromantische Bedeutung. Denn in den Alpen wird es durch die Klimaerwärmung immer wärmer. Am Sonnblick, in 3.000 Metern Höhe, wurde im August 2023 eine Rekordtemperatur von fast 15 Grad gemessen. Im Alpenraum wird es schneller wärmer als anderswo in Europa. Nicht nur die Gletscher, auch das Eis in den Höhlen der Alpen schmilzt dahin.
