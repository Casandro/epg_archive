  subtitle: Muhammad Ali
  widescreen: true
  hd: true
  description: Muhammad Ali war einer der meistfotografierten Männer der Geschichte. Aber kann eine Handvoll Fotos dennoch unbekannte Wahrheiten über jemanden offenbaren, den wir alle zu kennen glauben? Diese Doku wirft einen einzigartigen Blick auf ein außergewöhnliches Leben anhand von zehn charakteristischen Fotos von ikonischen Aufnahmen bis hin zu privaten Schnappschüssen. Deren Geschichte wird von Menschen, die Ali besonders nahestanden, erzählt.
