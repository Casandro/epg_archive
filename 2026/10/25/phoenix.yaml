  title: 'Terra X-History: Deutschland, Deine Schlager'
  subtitle: 1980 bis heute
  widescreen: true
  hd: true
  description: "In den 80er-Jahren wird die Schlagerwelt ordentlich aufgemischt: Die Neue Deutsche Welle bringt frische Töne in die Hitparaden. Auch Rock und Volksmusik mischen sich mit dem Schlager. \n\nProvokante Auftritte, sinnfreie Texte - nicht jeder kann sich mit den bunten Vögeln der Neuen Deutschen Welle anfreunden. In den 80ern rücken DDR und Bundesrepublik musikalisch wieder enger zusammen. \"Über sieben Brücken ...\" wird zum gesamtdeutschen Hit.\n\nPolitische Botschaften im Schlager"
