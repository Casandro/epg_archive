  title: Ready for Liftoff! Der Raumfahrt-Podcast
  description: "Immer mehr Raketen, immer abgefahrenere Missionen! In der Raumfahrt geht's gerade richtig ab. Das Wettrennen zum Mond und Mars hat längst begonnen. Bereit für den Start? Anne-Dorette Ziems, Fritz Espenlaub und David Beck nehmen euch alle zwei Wochen mit auf diese Reise. Wir sprechen über die neuesten Missionen, spannende Zukunftsvisionen und geben überraschende Einblicke in die Welt der Raumfahrt - ohne zu viel komplizierte Physik!\n \nEin Podcast vom SWR."
