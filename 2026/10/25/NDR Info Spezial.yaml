  title: Hamburger Hafenkonzert
  subtitle: Die älteste Radiosendung der Welt
  description: |-
    Spannende Reportagen und exklusive Berichte rund um den Hamburger Hafen, die Schifffahrt und die norddeutsche Geschichte.

    1929 ging die inzwischen älteste noch regelmäßig ausgestrahlte Sendung der Welt zum ersten Mal über den Äther. Seitdem ist sie - fast ohne Unterbrechung - jeden Sonntag ab 6 Uhr zu hören.
