  title: Velikán s gumenou raketou
  subtitle: V starej telocvični Saleziánskeho oratória na Miletičke sa opäť ozýva známy zvuk pingpongovej loptičky ...
  description: V starej telocvični Saleziánskeho oratória na Miletičke sa opäť ozýva známy zvuk pingpongovej loptičky ... Sme na mieste, kde sa takmer pred 100 rokmi začal písať príbeh chlapca, ktorý v dejinách slovenského stolného tenisu nemá obdobu. František Tokár - talent z oratória, ktorý sa vďaka svojej húževnatosti dostal až na svetové športové pódiá. Bolo to v čase, kedy tento šport začínal písať svoje veľké príbehy. A jeden z týchto príbehov napísal aj on. Ako člen reprezentácie sa v rokoch 1947-1951 stal 5-násobným majstrom sveta. K jeho úspechom sa nikomu v rámci slovenského stolného tenisu už nepodarilo priblížiť a tak stále zostáva najväčšou legendou tohto športu. Prostredníctvom autentických fotografií, archívnych záberov a spomienok žijúcich spoluhráčov a priateľov od zelených stolov sa dozvieme viac o tomto velikánovi s gumenou raketou a jeho ceste, ktorá viedla od Saleziánov až do siene slávy svetového stolného tenisu.
