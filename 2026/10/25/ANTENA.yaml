  title: 'Dzień zagłady: odliczanie 1 (odc. 10)'
  subtitle: Prądy oceaniczne determinują warunki klimatyczne na całym globie. Gdyby nagle zniknęły, wywołałoby to niekończącą się serię kataklizmów pogodowych, które mogłyby doprowadzić do zagłady cywilizacji.
  description: |-
    Tytuł oryginalny: Doomsday: 10 Ways the World Will End
    US, 2016
    Reżyseria: Laura Verklan
    Występują: Dan Nachtrab, Nathan Dean Snyder, Trevor S. Valle
    Twórcy cyklu zastanawiają się, co może spowodować zagładę naszego świata. Przedstawiają dziesięć potencjalnych przyczyn. Wśród nich znajdą się m.in. dziura w ziemskiej atmosferze, zakłócenia pola grawitacyjnego, pandemia nieuleczalnej choroby, kolizja z inną planetą, erupcja podziemnych złóż metanu czy wojna nuklearna. W każdym odcinku naukowcy szczegółowo omawiają zjawiska i kataklizmy, które mogą zmieść życie z powierzchni naszej planety.
