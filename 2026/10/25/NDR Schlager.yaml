  subtitle: Tommi Piper zu Gast bei Arne-Torben Voigts
  description: Erst vor wenigen Tagen hat Paul Panzer öffentlich gemacht, dass er vor kurzem seine Frau verloren hat - die Liebe seines Lebens, wie er sagt. Der gefeierte Comedian hat seine Tour unterbrochen. Es gab viel Trost und Zuspruch für ihn. Aber im Internet kursieren auch Falschmeldungen über Paul Panzer. In KI-generierten Videos werden ihm Worte in den Mund gelegt, die er nie gesagt hat. Das habe ihn sehr traurig gemacht, wie der 54-jährige in einem tiefgründigen Gespräch mit NDR Moderator Arne-Torben Voigts verrät. Trotzdem setzt Paul Panzer seine Tour jetzt fort.
