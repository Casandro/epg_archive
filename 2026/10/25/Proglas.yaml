- eventId: 899240
  start: 2026-10-25T04:57:00Z
  stop: 2026-10-25T05:00:00Z
  title: Myšlenka na den
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 31.10.2023 * Jaké je největší přikázání?"Dnes ještě nevidíme plné plody tohoto procesu, ale Hospodin nám pomůže, abychom byli synodálnější a misionářštější církví, která slouží ženám a mužům naší doby". Církev, o které sníme, je "církev, která přijímá, slouží, miluje a nikdy nevyžaduje vysvědčení "o dobrém chování''", poznamenává papež František a pokračuje:"Učitel Zákona oslovuje Ježíše, a to jen proto, aby ho podrobil zkoušce. Jeho otázka je však důležitá a stále aktuální: "Jaké je největší přikázání?" (Mt 22,36). I my si klademe otázku: Co je nejdůležitější? Co je hybným středobodem? Na čem záleží nejvíce, natolik, že je to vůdčí princip všeho? Ježíšova odpověď je jasná: "Miluj Hospodina, svého Boha, celým svým srdcem, celou svou duší a celou svou myslí. To je velké a první přikázání. Druhé je podobné: Miluj svého bližního jako sebe samého" (Mt 22,37-39).Takže nikoli naše strategie, ani lidské kalkulace, ani módní trendy světa, ale láska k Bohu a bližnímu: to je jádro všeho. Jak ale tento projev lásky přeložit? Navrhuji dvě slovesa, dvě hnutí srdce, nad kterými bych se rád zamyslel: klanět se a sloužit. Láska k Bohu se uskutečňuje prostřednictvím klanění a služby.První sloveso, klanět se. Milovat znamená uctívat, ctít. Údiv klanění je v církvi nezbytný, zvláště v této době, kdy jsme ztratili zvyk klanět se. Uctívání totiž znamená uznat ve víře, že jedině Bůh je Pán a že na laskavosti jeho lásky závisí náš život, cesta církve, osud dějin. On je smyslem života. Jeho uctíváním znovu objevujeme sami sebe jako svobodné. Ti, kdo uctívají Boha, odmítají modly, protože zatímco Bůh osvobozuje, modly zotročují. Na cestu modlářství vycházíme, když chceme, aby Hospodin jednal podle obrazu, který jsme si o něm vytvořili." A to je riziko, které nám hrozí vždy: myslet si, že "ovládáme Boha", uzavírat jeho lásku do svých plánů. Ne! Jeho jednání je vždy nepředvídatelné, překračuje hranice, a proto toto Boží jednání vyžaduje údiv a klanění. Úžas je tak důležitý!Druhým slovesem je sloužit. Milovat znamená sloužit. Ve velkém přikázání Kristus spojuje Boha a bližního, aby nikdy nebyli odděleni. Neexistuje opravdová náboženská zkušenost, která by byla hluchá k volání světa. Není lásky k Bohu bez angažovanosti v péči o bližního, jinak riskujeme farizejství. Můžeme mít skutečně mnoho krásných nápadů, jak reformovat církev, ale pamatujme: klanět se Bohu a milovat své bratry a sestry jeho láskou, to je velká a věčná reforma. Být církví uctívající a církví služby, která umývá nohy zraněnému lidstvu, doprovází na cestě křehké, slabé a zavržené, láskyplně vychází vstříc těm nejchudším. Bůh to přikázal, slyšeli jsme v prvním čtení.Bratři a sestry, za všechno, co jste v synodě vykonali a nadále konáte, vám děkuji! Děkuji vám za společnou cestu, za naslouchání a dialog. A v poděkování bych rád vyslovil přání pro nás všechny: abychom rostli v uctívání Boha a ve službě bližním. Uctívání a služba. Kéž nás Hospodin provází. A s radostí vpřed!"Homilii papeže Františka přeložila česká redakce Vatikánských médií, vybral Martin Holík. https://www.vaticannews.va/cs/papez/news/2023-10/papezova-homilie-na-zaver-synody.html'
  subtitle: Jaké je největší přikázání?
