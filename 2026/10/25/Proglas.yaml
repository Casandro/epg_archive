  title: Radioreport
  description: 'Autor: Monika Pustovková; Interpret: Jarmila Chorovská; Premiéra: 21.10.2026 * Salesiánka Jarmila Chorovská, rodačka z Hlučína, posledních osmnáct let působí jako misionářka v Amazonském pralese. S tříletou přestávkou žije mezi indiány kmene Yanomami ve Venezuele. Jak se ?holka z Prajzské“ dostala až do Venezuely? Jaký je život v pralese a jak ji indiáni přijali mezi sebe? Co znamená, že je ?matkou po mléce“ několika indiánským dětem? A v čem indiáni rozumí křesťanství víc než čeští věřící? Je něco, čím se od nich můžeme inspirovat? Poslechněte si v nejnovějším díle pOODcastu ostravsko-opavské diecéze.pOODcast ostravsko-opavské diecéze'
  subtitle: pOODcast ostravsko-opavské diecéze - sestra Jarmila Chorovská
