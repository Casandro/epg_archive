  title: Z archivu hudebních pořadů
  subtitle: Výlet do časů kazet ? hudební střípky z 90. let
  description: 'Autor a interpret: Milan Tesař; Premiéra: 12.9.2026 * Milan Tesař vám tentokrát v pořadu Slyšte, lidé! nabídne svůj osobní výlet za hudbou 90. let, zaměřený především na anglosaskou rockovou scénu ? od U2 a R.E.M. přes Midnight Oil a Manic Street Preachers až po méně známé nebo dnes pozapomenuté kapely. Nepůjde ale pouze o připomenutí kapel z doby, kdy si fanoušci hudbu nahrávali z rádia na magnetofonové kazety. Představíme konkrétní písně a příběhy, které se za nimi skrývají. [jú tú] [áríem] [midnajt ojl] [menyk strít príčrs] '
  genre:
  - '96'
- eventId: 899235
  start: 2026-10-25T02:01:00Z
  stop: 2026-10-25T02:45:00Z
  title: Z archivu hudebních pořadů
  subtitle: Učedníci 40 let
  description: 'Autor: Martin Weisbauer; Interpret: Vojtěch Šůstek, Alois Neruda, Václav Derner; Premiéra: 18.11.2025 * Křesťanská folková skupina Učedníci vznikla v roce 1985 ve východních Čechách. Nejprve na magnetofonových kazetách, později na CD vydávala pásma písní na biblická a jiná duchovní témata. Její písně jako Volám haleluja, Rájem nebo Maria se stále zpívají při bohoslužbách i na křesťanských setkáních mládeže. V současné době Učedníci opět intenzivně koncertují a připomínají tvorbu svého zakladatele a dlouholetého kapelníka Josefa Hrubého, který tragicky zahynul v roce 2024. Rozhovo s členy skupiny u příležitosti 40. výročí od jejího vzniku připravil Martin Weisbauer. '
