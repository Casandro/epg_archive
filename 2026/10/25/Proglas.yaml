- eventId: 899238
  start: 2026-10-25T04:30:00Z
  stop: 2026-10-25T04:45:00Z
  title: Knihovnička
  subtitle: Země česká, domov můj
  description: 'ižkou Země česká, domov můj si to rádi připomenou nejen děti každého věku.Co v knížce, jejímž autorem je David Karakevas, najdete: ?    ilustrovaný příběh Česka ?    klíčové události historie, osobnosti, unikáty ?    celkem přes 700 obrázků s texty ?    až 142 stránek plných zajímavostí.Vydalo Česko v obrazech v roce 2021 jako první vydání, vyšlo již 4. vydání.Další dílo, jež oslavuje českou zemi, nám  představí Jiří Martínek z Historického ústavu AV ČR. Rozhovor o 26. svazku Biografického slovníku českých zemí a o knize pro děti ke 100. výročí republiky, jsme s ním natočili na 33. knižním veletrhu v Havlíčkově Brodě na začátku října roku 2023.A také budeme soutěžit o výše zmíněnou hodnotnou knihu Země česká domov můj.'
