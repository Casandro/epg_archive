  title: Studna slova (Rádio 7)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková * Co se děje, když se křesťanské společenství schází? Apoštol Pavel v 11. kapitole 1. listu Korintským ukazuje, že způsob, jakým spolu stolujeme, slavíme Večeři Páně a prožíváme společné shromáždění, odhaluje mnohem hlubší skutečnosti. Nejde jen o jídlo a pití, ale o vztah k Božímu řádu, jednotě církve a k samotnému Kristu. Pořad Studna slova s historickými nahrávkami biblického výkladu kazatele Jiřího Hurty uslyšíte od tři čtvrtě na osm.'
