- eventId: 642362
  start: 2026-10-25T18:00:00Z
  stop: 2026-10-25T18:50:00Z
  title: Pohádkové poklady
  description: 'Pohádky z Rožnovska I. - O jednom krysařovi. O dobrodružství odvážného kyrysara a jedné namyšlené princezně, která ho chtěla oklamat. Napsal: Beneš Method Kulda, režie: Milan Friedl. Natočeno v roce 1964. Vypráví: František Hanus.'
- eventId: 642363
  start: 2026-10-25T18:50:00Z
  stop: 2026-10-25T19:00:00Z
  title: Hajaja
  description: Ferda v mraveništi 7/7. Všeuměl Ferda se po ztroskotání své lodi vrací do rodného mraveniště a hned se vrhne do vymýšlení všelijakých zlepšováků, ať už při lovu divokých mšic nebo čištění chodeb mraveniště. Poslechněte si příhody chytrého mravence s červenou kravatou, který se ničeho nezalekne a je vždy ochoten pomoci přátelům i těm, s nimiž se setká poprvé. Podle stejnojmenné knihy Ondřeje Sekory pro rozhlas připravila Eva Linková. Dramaturgie Václava Ledvinková. V roce 1988 natočil režisér Miroslav Šváb. Vypráví Vlastimil Brodský.
