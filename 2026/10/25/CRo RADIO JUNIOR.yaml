  title: Pohádkové poklady
  description: 'Pohádky z Rožnovska I. - O jednom krysařovi. O dobrodružství odvážného kyrysara a jedné namyšlené princezně, která ho chtěla oklamat. Napsal: Beneš Method Kulda, režie: Milan Friedl. Natočeno v roce 1964. Vypráví: František Hanus.'
