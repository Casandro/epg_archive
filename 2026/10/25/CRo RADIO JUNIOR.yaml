  start: 2026-10-25T11:00:30Z
  stop: 2026-10-25T12:00:00Z
  title: Velká pohádka
  description: 'O Šumínu šepotavém. Šumín šepotavý je drobounký vánek, který trochu šumí, trochu šepotá a taky trochu šišlá. I stalo se, že se jednoho dne zamotal do kominické štětky kominického mistra Arnošta a právě tehdy se narodila tahle pohádka. Napsala: Helena Sýkorová. Režie: Karel Weinlich. Hrají: Jitka Molavcová, Ivana Andrlová, Ivan Gübel, Jiří Langmajer ml., Josef Somr a další.'
- eventId:
  - 645258
  - 645364
  - 651107
  start: 2026-10-25T12:00:30Z
  stop: 2026-10-25T13:00:30Z
  title: Velká pohádka
  description: 'Stříbrná jehlička a režná nit. Švec se má držet svého kopyta a krejčí jehelníčku. Jenže krejčík Vendelín Jehlička častěji než jehlu svírá v ruce dřevěné kostky a spíše než svému řemeslu holduje hazardní hře. Vrhcáby jsou Vendelínovou vášní natolik, že postupně zapomene i na své blízké. Vrátí se ještě někdy zpět k šití?Napsala: Milena Mathausová. Režie: Vladimír Rusko. Účinkují: Jiří Lábus, Taťjana Medvecká, Matouš Ruml a další.'
