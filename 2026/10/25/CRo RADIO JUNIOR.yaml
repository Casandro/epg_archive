  title: Velká pohádka
  description: 'O Šumínu šepotavém. Šumín šepotavý je drobounký vánek, který trochu šumí, trochu šepotá a taky trochu šišlá. I stalo se, že se jednoho dne zamotal do kominické štětky kominického mistra Arnošta a právě tehdy se narodila tahle pohádka. Napsala: Helena Sýkorová. Režie: Karel Weinlich. Hrají: Jitka Molavcová, Ivana Andrlová, Ivan Gübel, Jiří Langmajer ml., Josef Somr a další.'
