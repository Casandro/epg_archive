  title: Velká pohádka
  description: 'Stříbrná jehlička a režná nit. Švec se má držet svého kopyta a krejčí jehelníčku. Jenže krejčík Vendelín Jehlička častěji než jehlu svírá v ruce dřevěné kostky a spíše než svému řemeslu holduje hazardní hře. Vrhcáby jsou Vendelínovou vášní natolik, že postupně zapomene i na své blízké. Vrátí se ještě někdy zpět k šití?Napsala: Milena Mathausová. Režie: Vladimír Rusko. Účinkují: Jiří Lábus, Taťjana Medvecká, Matouš Ruml a další.'
