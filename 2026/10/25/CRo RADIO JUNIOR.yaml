  title: Rozhlasová hra
  description: 'Vynález zkázy 1. Hlavního hrdinu profesora Rocha, vynálezce mimořádně výbušné látky, zastihneme ve chvíli, kdy je unesen pomocí ponorky z nervového sanatoria. Na podzemní základně, mu jeho únosce hrabě d''Artigas umožní pokračovat v práci na vynálezu. Profesor netuší, že jej chce tento muž využít k ovládnutí světa. Jeho ošetřovateli Simonu Hartovi se však podaří poslat podzemní chodbou v soudku dopis, v němž popíše místo, kde se s Rochem nacházejí, a nebezpečí, které světu hrozí. Jak vše dopadne? Napsal: Ondřej Neff na motivy románu Julesa Vernea Režie: Jiří Horčička. Účinkují: Martin Štěpánek, Ivan Trojan, Ilja Racek, Jiří Plachý a Antonín Molčík'
