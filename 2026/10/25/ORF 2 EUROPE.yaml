  title: kreuz & quer nah dran
  subtitle: David Steindl-Rast - Das Geschenk des Augenblicks
  description: 'Er gilt als Brückenbauer zwischen Religionen, Kulturen und Menschen: Bruder David Steindl-Rast feierte heuer seinen 100. Geburtstag. Der gebürtige Österreicher, der in den USA Benediktinermönch wurde, zählt zu den erfolgreichsten geistlichen Autoren unserer Zeit. Der Film von Robert Neumüller zeichnet das Porträt eines Denkers und spirituellen Mannes, dessen Botschaft heute aktueller ist denn je: Dialog, Achtsamkeit und Dankbarkeit als Schlüssel zu einem erfüllten Leben.'
  genre:
  - '115'
- eventId: 887688
  start: 2026-10-25T08:30:00Z
  stop: 2026-10-25T09:15:00Z
  title: Katholischer Gottesdienst
  subtitle: '"Menschheit erwache!"'
  description: "Pater Dominik Markl leitet den Gottesdienst. \nDie verbindende Kraft der alpenländischen Volksmusik und das Gebot der Nächstenliebe prägen die Messfeier. Sie lädt dazu ein, einander in der Hoffnung auf eine friedliche Zukunft zu stärken.\n\nMusikerinnen und Musiker aus unterschiedlichen Regionen und Ländern des Alpenraums gestalten die Feier: das Familienquartett \"Geschwister Prünster\" aus dem Südtiroler Passeiertal, die Instrumentalgruppe \"Steffiza\" aus Kärnten mit ihrem aus Slowenien stammenden Kontrabassisten, die \"Geschwister Plankensteiner\" aus Mils bei Hall in Tirol mit Hackbrett, Violine und Harfe sowie die Kärntner Gesangsgruppe \"Glanschl Zwüllinge\", die 2024 mit dem Herma Haselsteiner-Preis ausgezeichnet wurde. Für festlichen Bläserklang sorgen die \"Zillertaler Weisenbläser\" unter der Leitung von Stefan Neussl."
  genre:
  - '115'
