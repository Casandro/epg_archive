  title: Tierische Augenblicke
  description: '"Tierische Augenblicke" besucht das Bühnenpaar Monica Weinzettl und Gerold Rudle mit ihrer vierbeinigen Mitbewohnerin Piper. Außerdem schaut sich Maggie Entenfellner eine der ältesten Katzenrassen der Welt an, taucht ab zu den gefürchteten Räubern der Meere, zeigt wie Hunde lernen, entspannt auf Fahrradfahrer zu reagieren und entschlüsselt die geheime Sprache unserer geliebten Stubentiger.'
