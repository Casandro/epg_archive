  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Die Fee vom Höllental
  description: "Ein armer Hirte, eine geheimnisvolle Fee und ein sagenhafter Schatz im Berg: Im bayerischen Garmisch-Partenkirchen stößt Sagenjäger Max Müller auf eine Geschichte, die ebenso rätselhaft wie grausam ist. Eine Fee verspricht einem jungen Hirten großen Reichtum, stellt dafür aber zwei Bedingungen. Als er sein Versprechen bricht, nimmt das Schicksal seinen Lauf: Der Hirte wird von einem See verschluckt. Den es aber noch gar nicht gibt. \nWas steckt hinter dieser düsteren Überlieferung? Max Müller trifft in Garmisch-Partenkirchen Sagenschreiber Anton Jocher, Sagenforscherin Gisela Schinzel-Penth sowie Sagenerzählerin Henny Schübel, die ihm bei seinen Recherchen behilflich sind. Geologe Andreas P. Kaiser berichtet dem Sagenjäger danach von historischen Bergwerken im Höllental, bevor Peter Fink, Bürgermeister der Gemeinde Oberau, Max Müller zu jenem See, von dem die Sage erzählt, führt. Die Spurensuche endet für den Sagenjäger, als er jene geheimnisvolle Göttin, deren Geschichte weit über die Grenzen Bayerns hinausreicht, entdeckt. Und dabei auch eine überraschend aktuelle Botschaft über das Verhältnis zwischen Mensch und Natur."
  genre:
  - '34'
- eventId: 898030
  start: 2026-10-25T17:25:00Z
  stop: 2026-10-25T17:51:30Z
  title: Österreich-Bild aus dem Landesstudio Salzburg
  subtitle: Vom menschlichen Maß - Auf den Spuren von Tauriska
  description: "\"Der Mensch kann mit sich und seinesgleichen nur glücklich werden, wenn er in einem Raum lebt, den er überschauen kann. Nur dann, wenn er einen Begriff von der Größe, der Beschaffenheit und der Natur seiner Lebensumgebung hat.\" Das ist der Kern der Botschaft des Philosophen Leopold Kohr und von TAURISKA. \n\nTAURISKA - als Verein zur Förderung eigener Kultur- und Regionalentwicklung in der Region Nationalpark Hohe Tauern in Neukirchen am Großvenediger gegründet, hat den Pinzgau seit 1986 nachhaltig geprägt. Über Fragen wie \"Was braucht das Dorf der Zukunft?\", \"Was machen wir mit der Natur?\" und über \"Neue Arbeitsplätze im ländlichen Raum\" sowie vieles andere mehr wird ernsthaft und ideenreich seit 40 Jahren nachgedacht und umgesetzt, ganz im Sinne des Schirmherrn Kohr. \nEr hätte auch seine Freude am Erfolgsprojekt Bramberger Obstpresse gehabt, die seit 2005 das landschaftliche Gesicht des Pinzgaus prägt. Alte heimische Obstsorten wurden wiederentdeckt und sterbende Streuobstwiesen wiederbelebt. Die Wertschöpfungskette zwischen Landwirtschaft und Tourismus ist aufgebaut und wird weiter ausgebaut - und das unter der hohen Akzeptanz der Einheimischen und Gäste. Hier setzt man um, was der Alternativnobelpreisträger Kohr stets gefordert hatte: Nachhaltigkeit, regionale Identifikation, Heimat im besten Sinn. \n\nDazu braucht es Mutmacher, zähe Durchhalter, wie es die guten Geister des Vereins, Susanne Vötter-Dankl und Christian Vötter, sind. Regionale Kulturarbeit, wie es TAURISKA vorzeigt, ist heute alles andere als einfach. Wie es trotzdem gelingt, zeigt das Österreich-Bild aus Salzburg."
  genre:
  - '34'
