  title: kreuz & quer nah dran
  subtitle: Nepalesen auf der Alm
  description: |-
    Sie wurden in Nepal geboren und arbeiten dort als Tourguides. Doch jährlich zur Sommersaison zieht es sie nach Österreich - zum Arbeiten auf die Alm. Wie es dazu kam, wie sie mit Kulturunterschieden umgehen und welchen Herausforderungen sie sich täglich stellen, zeigt "kreuz & quer nah dran".
