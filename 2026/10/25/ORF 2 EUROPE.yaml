  title: Erlebnis Österreich
  subtitle: '"Gesunde Quellen - Heilender Stollen" - Vom Kurzentrum zum modernen Gesundheitstourismus'
  description: Begonnen hat die Geschichte im Jahr 1989, als Vincent Künig in Bad Häring in Tirol das erste "Kurzentrum" eröffnete. Seine Vision war, das reine Heilverfahren auf eine neue Basis zu stellen, womit er einen frühen Meilenstein für den Gesundheitstourismus in Österreich setzte. Heute betreibt das Familienunternehmen zehn Standorte mit 1.100 Mitarbeitenden. Das "Erlebnis Österreich" blickt hinter die Kulissen der Gesundheitshotels, wo natürliche Quellen ebenso genutzt werden wie auch der Heilstollen in Bad Bleiberg in Kärnten. Mitarbeitende kommen ebenso zu Wort wie Mitglieder der zweiten und dritten Generation der Unternehmerfamilie Künig.
  genre:
  - '34'
