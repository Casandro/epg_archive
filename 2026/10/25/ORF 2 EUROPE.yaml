  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Die Fee vom Höllental
  description: "Ein armer Hirte, eine geheimnisvolle Fee und ein sagenhafter Schatz im Berg: Im bayerischen Garmisch-Partenkirchen stößt Sagenjäger Max Müller auf eine Geschichte, die ebenso rätselhaft wie grausam ist. Eine Fee verspricht einem jungen Hirten großen Reichtum, stellt dafür aber zwei Bedingungen. Als er sein Versprechen bricht, nimmt das Schicksal seinen Lauf: Der Hirte wird von einem See verschluckt. Den es aber noch gar nicht gibt. \nWas steckt hinter dieser düsteren Überlieferung? Max Müller trifft in Garmisch-Partenkirchen Sagenschreiber Anton Jocher, Sagenforscherin Gisela Schinzel-Penth sowie Sagenerzählerin Henny Schübel, die ihm bei seinen Recherchen behilflich sind. Geologe Andreas P. Kaiser berichtet dem Sagenjäger danach von historischen Bergwerken im Höllental, bevor Peter Fink, Bürgermeister der Gemeinde Oberau, Max Müller zu jenem See, von dem die Sage erzählt, führt. Die Spurensuche endet für den Sagenjäger, als er jene geheimnisvolle Göttin, deren Geschichte weit über die Grenzen Bayerns hinausreicht, entdeckt. Und dabei auch eine überraschend aktuelle Botschaft über das Verhältnis zwischen Mensch und Natur."
