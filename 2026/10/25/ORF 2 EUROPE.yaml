  title: Universum
  subtitle: Zugvögel - Ein Jahr vergeht im Flug
  description: "Der Vogelzug ist eines der größten Naturwunder unseres Planeten. Milliarden von Vögeln ziehen nicht nur zu bestimmten Jahreszeiten über Ländergrenzen hinweg: An jedem Tag des Jahres sind Vogelpopulationen in Bewegung. \nDie Universum-Dokumentation stellt den Vogelzug aus einer völlig neuen Perspektive vor und macht klar, dass hinter der größten Migration der Erde viel mehr steckt als \"nur\" das Pendeln zwischen Norden und Süden. Der Film zeigt die unzähligen Spielarten des Phänomens Vogelzug anhand spektakulärer Protagonisten. Ein bedeutender Knotenpunkt ihrer Wanderungen ist das Vogelparadies Seewinkel in Österreich. In dieser vielfältigen Region kreuzen sich die Wege hunderter Vogelarten. Vergleichbar mit einem internationalen Flughafen ist der Seewinkel eine Drehscheibe für wandernde Vögel auf ihren unglaublichen Reisen zwischen Europa, Afrika und Asien. Hier finden sie nahrungsreiche Rastgebiete und sichere Brutplätze. Leistungsflieger wie der Kampfläufer begegnen auf ihrer Route den im Seewinkel ansässigen Graugänsen und Kiebitzen. Die Dokumentation begleitet Erpel, die sich aus ganz Europa hier zum Überwintern versammeln und erst im Frühling erfahren werden, wo sie ihre neue Liebe hinführt. Genauso wie den europäischen Rekordhalter im Non-Stop-Flug - eine Schnepfe - die 5500 Kilometer ohne Pause zurücklegt und die Nachtigall, die auf dem Zug nach Afrika ihr Körpergewicht halbiert. \nEin Film von Mario Kreuzer und Leander Khil"
  genre:
  - '144'
