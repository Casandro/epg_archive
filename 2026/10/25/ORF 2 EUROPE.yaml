  description: Karl Ploberger besucht einen ländlich-romantischen Naturgarten in der Oststeiermark, stellt Pflanzen mit besonderem Österreich-Bezug vor und widmet sich der Frage, warum Rosen im Herbst besser nicht geschnitten werden sollten. Kräuterhexe Uschi Zezelitsch entdeckt den außergewöhnlichen Marzipan-Salbei, während sich auf der Garten Tulln alles um Hecken als natürlichen Sichtschutz dreht.
