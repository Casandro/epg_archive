  subtitle: mit Holger Bonin, Direktor Institut für Höhere Studien (IHS)
  description: "Der Blick in die Wirtschaftszukunft: Er fällt unterschiedlich aus. Während einerseits von schwachem Aufschwung die Rede ist, bremsen Staatsschulden und Inflation eine positivere Entwicklung. Erst diese Woche hat der Fiskalrat der Regierung ein überschaubar gutes Zeugnis ausgestellt, und die Rohölpreise lassen Konsument:innen zittern. Wie steht es jetzt um Österreich? Was hat das Land selbst in der Hand, wo ist es Passagier? \n\nDie Fragen stellen: \n\nAnnette Gantner\n\"Oberösterreichische Nachrichten\"\n\nund \n\nChristoph Varga\nORF"
