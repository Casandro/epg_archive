  title: Viennale Spezial I
  description: |-
    Während der 64. Ausgabe der Viennale wird Wien wieder zum Mekka für Filmfans. Im ersten Teil unseres Viennale Spezial werfen wir einen Blick auf die spannendsten Filme des Festivals. Danach zeigen wir den preisgekrönten Dokumentarfilm "Noch lange keine Lipizzaner" der jungen österreichischen Regisseurin Olga Kosanovic. Im Anschluss widmen wir uns den bewährten Retrospektiven des Österreichischen Filmmuseums sowie des Filmarchiv Austria, sprechen mit den Stargästen der diesjährigen Ausgabe, darunter die französiche Schauspiellegende Isabell Huppert und holen uns wieder einige Festival-Tipps von Viennale-Direktorin Eva Sangiorgi.
    Gestaltung: Christian Konrad
