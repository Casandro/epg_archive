  title: Bayrische Landfrauen kochen auf...
  subtitle: 'Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps und ..'
