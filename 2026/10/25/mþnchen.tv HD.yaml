  title: Kirche in Bayern 25.10.2026
  subtitle: '"Kirche in Bayern - das ökumenische Fernsehmagazin" ist ein bunter Querschnitt durch das Leben der beiden großen Kirchen im Freistaat.'
  description: |-
    "Kirche in Bayern - das ökumenische Fernsehmagazin" ist ein bunter Querschnitt durch das Leben der beiden großen Kirchen im Freistaat. Die evangelische und katholische Kirche in Bayern haben sich zusammengeschlossen, um gemeinsam über kirchliche Themen zu berichten: Von der engagierten Gemeinde über die Bischofskonferenz bis hin zum diakonischen, karitativen Engagement - wir zeigen Ihnen, was Kirche in Bayern ausmacht und das seit 2001.

    Unser Ziel ist es, Information zu vermitteln, Modernität, Tradition, Diakonie und Spiritualität der Kirche deutlich zu machen und Position zu beziehen.
