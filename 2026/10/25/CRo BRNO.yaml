  title: Toulky Josefa Veselého
  description: Dalším dnes už dozajista zapomenutým jménem naší historie je Václav Krolmus - a on přitom věřil, že jako amatérský archeolog objevil hrob praotce Čecha. Jak to bylo doopravdy, odhalí úvodní vzpomínka i s ukázkou ze staršího pásma nazvaného Pero za motyku. Máte chuť objevovat podle indicií neznámé (ale jinak historicky vcelku známé) osobnosti? Dostanete další šanci v soutěži Kdotobyl, po které se vydáme na cesty. Bude to po stopách Oldřicha Prefáta z Vlkanova, který cestoval v polovině 16.století a jehož cesty i dílo zmapoval díl Toulek českou minulostí.
