- eventId: 920652
  start: 2026-10-25T13:00:00Z
  stop: 2026-10-25T17:00:00Z
  title: Т/с "Запретная любовь".
  description: 'Мелодрама. Катя ждёт появления первенца, но отец ребёнка не хочет брать на себя ответственность и разрывает отношения. На пешеходном переходе её сбивает дорогостоящий джип. За рулём сидела Кристина - любимая девушка состоятельного предпринимателя Виктора, которая также находится в положении. Катя приходит в себя уже на больничной койке. Заведующий отделением Аркадий с презрением относится к девушке, потому что у неё нет средств на "добровольное пожертвование" для эскулапа. После родов Кате сообщают ужасную новость - ребёнок появился на свет уже мёртвым. Однако она не верит словам врачей. Кристина, родившая малыша в тот же день, не может кормить отпрыска грудью. Аркадий предлагает Кате временно заняться этим за солидное вознаграждение. Как только младенец оказывается в её руках, она принимает его за родного. Девушка испытывает материнские чувства к маленькому человечку, но не может доказать свою правоту юридически. Виктор узнаёт о том, что Кристина изменила ему с заведующим отделением. Он забирает младенца из больницы вместе с Катей, которой предлагает стать няней для своего сына. Она соглашается, чтобы быть рядом с ребёнком. Катя попадает в огромный особняк. Вместе с Виктором в нём живёт его сестра Маргарита с двумя взрослыми сыновьями Виталием и Германом. Племянники бизнесмена начинают проявлять интерес к няне. Но если Виталий смотрит на девушку исключительно в качестве объекта плотских утех, то Герман по-настоящему влюбляется в неё. Впрочем, и сам Виктор с симпатией поглядывает на Катю, ведь из неё может получиться хорошая мать для наследника. Маргарита же видит в молодой няне конкурентку в борьбе за богатство её брата. Виктор и Герман начинают добиваться благосклонности Кати. Маргарита вступает в заговор с главным конкурентом своего брата, чтобы взять под контроль его бизнес... Украина, 2016. Режиcсер: Игорь Забара. В ролях: Ольга Гришина, Алика Смехова, Дмитрий Мухин.'
