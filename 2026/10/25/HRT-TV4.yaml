  title: 'Romano Bolković - 1 na 1: Ivica Lukšić, talk show'
  subtitle: Prof. dr. sc. Ivica Lukšić, dr. med., ravnatelj Kliničke bolnice Dubrava, maksilofacijalni je kirurg i stručnjak za onkološku kirurgiju glave i vrata.
  description: 'Prof. dr. sc. Ivica Lukšić, dr. med., ravnatelj Kliničke bolnice Dubrava, maksilofacijalni je kirurg i stručnjak za onkološku kirurgiju glave i vrata. Pročelnik je Katedre za maksilofacijalnu kirurgiju sa stomatologijom Medicinskog fakulteta Sveučilišta u Zagrebu te predstojnik Klinike za kirurgiju lica, čeljusti i usta KB-a Dubrava. Tijekom pandemije bolesti COVID-19 sudjelovao je u radu Kriznog stožera i Ekspertne skupine Ministarstva zdravstva te u koordinaciji bolničkog zbrinjavanja oboljelih u Zagrebu i osam županija sjeverozapadne Hrvatske. Bio je uključen i u koordinaciju rada respiracijsko-intenzivističkog centra u KB-u Dubrava, a ravnatelj bolnice postao je krajem 2020. godine. Aktivno djeluje u domaćim i međunarodnim stručnim udruženjima za kirurgiju glave i vrata, sudjeluje u radu europskih stručnih tijela te recenzira radove za međunarodne medicinske časopise. S profesorom Ivicom Lukšićem razgovaramo o obnovi i proširenju KB-a Dubrava, investiciji vrijednoj približno 361 milijun eura, sve većem interesu liječnika i drugih zdravstvenih djelatnika za rad u toj bolnici te razvoju centara izvrsnosti, medicinskog obrazovanja i znanstvenih istraživanja. Otvaramo i šira pitanja budućnosti hrvatskoga zdravstvenog sustava: kako unaprijediti organizaciju bolničke mreže i upravljanje velikim bolnicama, osigurati jednaku dostupnost suvremene dijagnostike i liječenja, skratiti liste čekanja te odgovoriti na izazove financiranja zdravstva, prevencije bolesti, tehnološkog razvoja i odnosa javnog i privatnog sektora.'
