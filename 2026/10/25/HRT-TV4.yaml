  title: Potrošački kod
  subtitle: U Ministarstvu gospodarstva održani su sastanci s obrtnicima, poduzetnicima i predstavnicima potrošačkih udruga o primjeni baznih cijena u svakodnevnom životu.
  description: 'U Ministarstvu gospodarstva održani su sastanci s obrtnicima, poduzetnicima i predstavnicima potrošačkih udruga o primjeni baznih cijena u svakodnevnom životu. Do 13. studenog u javnoj su raspravi Pravilnik o načinu isticanja bazne cijene proizvoda i Pravilnik o sadržaju i načinu objave cjenika proizvoda. Kako će pravilnici biti primljeni u praksi te mogu li utjecati na suzbijanje inflatornih pritisaka i stabilizaciju cijena usluga? Gosti: Branka Augustinović, ovlaštena za obavljanje poslova ravnatelja Uprave za trgovinu i unutarnje tržište pri Ministarstvu gospodarstva Igoro Vujović predsjednik udruge Potrošač Urednica i voditeljica: Sanja Smiljanić Grubišić'
