  subtitle: Da mi je netko rekao da ću živjeti u Lici i da ću imati tri konja i farmu, rekla bih mu da je poludio. Ali život se pobrinuo za to.
  description: Da mi je netko rekao da ću živjeti u Lici i da ću imati tri konja i farmu, rekla bih mu da je poludio. Ali život se pobrinuo za to. Tako govori Kristyna Rygolova koja je u Brnu završila studij hrvatskog jezika i književnosti. Danas živi na dvije adrese, u Zadru i u Lici. Na more ju je dovela studentska razmjena i odluka da Češku zamijeni za Jadransko more. Liku i selo Bilaj odabralo je srce. Po završetku Erasmus razmjene poželjela je još jednom otići na jahanje i tako se oprostiti od Hrvatske. Sudbina je htjela da ostane. Na farmi konja upoznala je Josipa. Rodila se ljubav, a zatim i kći. U osnovnoj školi u Bibinju kraj Zadra predaje češki, a na ličkoj zemlji s Josipom i kćeri Laurom uči o životu u prirodi i s prirodom.
