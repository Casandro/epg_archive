  stop: 2026-10-25T04:25:00Z
  title: Deutsche Panzer - Technik und Geschichte
  subtitle: Deutsche Panzer - Technik und Geschichte
  description: Die Geburtsstunde des modernen Panzers ist zur Zeit des Ersten Weltkriegs. Die Briten setzen die rollenden Kampffahrzeuge aus Stahl erstmals gegen deutsche Truppen ein. Daraufhin entwickeln die Deutschen den "A7V" - und im zweiten Weltkrieg "Panther" und "Tiger". Auch Ferdinand Porsche ist mit dem "Maus" am Bau von Panzern während des Nationalsozialismus beteiligt. Die Dokumentation gibt einen chronologischen Einblick in die Fertigung und Technik, bis zu den neuesten Modellen der Bundeswehr.
  widescreen: true
