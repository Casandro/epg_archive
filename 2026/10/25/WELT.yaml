  title: Lost Places - Folge 103
  subtitle: Lost Places - Folge 103
  description: 'Ein leerstehendes Haus in der kalifornischen Wüste hat im 20. Jahrhundert gleich zweimal Geschichte geschrieben: Als mondänes Kurhotel, in dem Hollywoodgrößen in der Prohibitionsära neben mineralischen Heilwassern ungestört Hochprozentiges genießen konnten. Und als Militärgefängnis, in dem japanische Kriegsgefangene auf subtile Weise dazu gebracht wurden, strategische Geheimnisse auszuplaudern. Außerdem: Das schottische Schloss, das Bram Stoker zu seinem Grusel-Klassiker "Dracula" inspirierte.'
  widescreen: true
- eventId: 992407
  start: 2026-10-25T16:33:00Z
  stop: 2026-10-25T17:27:00Z
  title: Lost Places - Folge 104
  subtitle: Lost Places - Folge 104
  description: 'Was machen kitschige Schlösschen à la Disney im Landesinneren der Türkei? Burj al Babas ist das ehrgeizige Projekt von Investoren: eine Luxus-Siedlung aus über 700 Mini-Schlösschen sollte Reiche aus dem Ausland in die Türkei locken. Doch Wirtschaftskrise und Pandemie zwingen die Unternehmer in die Knie. Zurück bleibt eine surreale Kulisse einer schier endlosen Reihe von verwaisten "Schlösschen".'
  widescreen: true
- eventId: 992408
  start: 2026-10-25T17:27:00Z
  stop: 2026-10-25T18:20:00Z
  title: Lost Places - Folge 105
  subtitle: Lost Places - Folge 105
  description: 'Ausgerechnet das tropische Inselparadies Montserrat ist der Entstehungsort einiger der erfolgreichsten Pop-Alben der 80er Jahre. Warum? Weil Produzentenlegende Sir George Martin nach dem Ende der Beatles hier sein mit modernster Technik ausgestattetes AIR Studio baute. Leider machten Naturkatastrophen dem Musik-Mekka ein jähes Ende. Außerdem: Ein luxuriöses Lichtspielhaus in Arkansas wartet auf das Ende seines Dornröschenschlafs. Und: Die Salpa-Linie, ein monumentaler Kraftakt Finnlands.'
  widescreen: true
- eventId: 992409
  start: 2026-10-25T18:20:00Z
  stop: 2026-10-25T19:15:00Z
  title: Lost Places - Folge 106
  subtitle: Lost Places - Folge 106
  description: 'Was haben der Kalte Krieg und das Erotikmagazin "Penthouse" miteinander zu tun? Spuren einer ruinösen Friedensmission finden sich im ehemaligen Haludovo Palace Hotel in Kroatien.  Und: Wie sieht es heute in Hitlers Führerhauptquartier "Wolfsschanze" in Nordost-Polen aus? Dazu: Ein Radioteleskop in den Bergen Armeniens, mit dessen Hilfe ein sowjetischer Wissenschaftler die Urknall-Theorie widerlegen wollte. Und: Das Tunnelsystem im englischen Ramsgate als Lebensretter gegen Bomben der Luftwaffe.'
  widescreen: true
- eventId: 992410
  start: 2026-10-25T19:15:00Z
  stop: 2026-10-25T20:10:00Z
  title: Lost Places - Folge 107
  subtitle: Lost Places - Folge 107
  description: 'Tief in den Klippen von Dover verborgen liegt eines der größten Verteidigungsbauwerke Großbritanniens. Welche streng geheimen Operationen wurden hier durchgeführt? Versteckt in der armenischen Felsenlandschaft liegt das Höhlendorf Chndsoresk. Doch warum wurde es plötzlich aufgegeben? Und: Der Schwerbelastungskörper in Berlin - Teil von Hitlers Plänen, eine monumentale "Welthauptstadt Germania" zu errichten.'
  widescreen: true
- eventId: 992411
  start: 2026-10-25T20:10:00Z
  stop: 2026-10-25T21:05:00Z
  title: Lost Places - Folge 108
  subtitle: Lost Places - Folge 108
  description: Verlassen, verfallen, vergessen - Wonderland Eurasia in der türkischen Hauptstadt Ankara sollte einst Europas größter Freizeitpark werden. Heute steht es als Sinnbild gescheiterter Visionen. Millionen flossen in das Prestigeprojekt, das nur wenige Monate nach der Eröffnung stillgelegt wurde.
  widescreen: true
- eventId: 992412
  start: 2026-10-25T21:05:00Z
  stop: 2026-10-25T22:05:00Z
  title: Geschichte in Farbe - Der Blitzkrieg
  subtitle: Geschichte in Farbe - Der Blitzkrieg
  description: Im März 1939 rücken deutsche Truppen in der Tschechoslowakei ein. Dies ist der Beginn des Zweiten Weltkriegs. Die deutsche Überrumpelungstaktik heißt "Blitzkrieg" - und funktioniert. Die westlichen Großmächte lassen Hitler zunächst gewähren. Erst als er Polen angreift und nach vier Wochen Warschau fällt, erklären Großbritannien und Frankreich Deutschland den Krieg. Hitler plant da schon die nächsten Feldzüge, um seine Idee eines nationalsozialistischen Weltreichs umzusetzen.
  widescreen: true
- eventId: 992413
  start: 2026-10-25T22:05:00Z
  stop: 2026-10-25T23:00:00Z
  title: Geschichte in Farbe - Unternehmen Barbarossa
  subtitle: Geschichte in Farbe - Unternehmen Barbarossa
  description: Nach seinem erfolgreichen "Blitzkrieg" im Westen, wendet sich Hitler dem Osten zu. Er will im Sommer 1941 in die Sowjetunion einmarschieren. Für Hitler war die Sowjetunion eine Art Land der Verheißung, das die Expansion des Deutschen Reichs ermöglichen würde. Um die Bevölkerung der Sowjetunion zu vernichten, ordnet er eine gezielte Politik der Aushungerung an. Die geplante Invasion trägt den Decknamen "Unternehmen Barbarossa" - nach dem mittelalterlichen deutschen Kaiser Friedrich Barbarossa.
  widescreen: true
- eventId: 992414
  start: 2026-10-25T23:00:00Z
  stop: 2026-10-25T23:54:00Z
  title: Lost Airships - Amerikas vergessene Luftschiffe
  subtitle: Lost Airships - Amerikas vergessene Luftschiffe
  description: 'Tief im Pazifik liegt ein außergewöhnliches Schiffswrack: die USS Macon. Es sind die Überreste eines Luftschiffs der US Navy - erbaut als fliegender Flugzeugträger, etwa so groß wie die Titanic. In den 1930er-Jahren wurde es eingesetzt, um bis zu fünf Kampfflugzeuge zu transportieren. Doch ihre Hochzeit hielt nicht lange an, Luftschiffe kosteten die US Navy dutzende Menschenleben und Millionen Dollar. Luftfahrt-Experten erzählen die Geschichten verschiedener US-amerikanischer Luftschiffe.'
