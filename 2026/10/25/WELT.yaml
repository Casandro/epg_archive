  title: 51 Tigers - Tornado-Piloten im Einsatz
  subtitle: 51 Tigers - Tornado-Piloten im Einsatz
  description: 'Im Norden trainieren Kampfjet-Crews für den Ernstfall - vom ersten Briefing über Tiefflug und Zielanflug bis zum Überleben auf See. Zwischen Hightech und Teamgeist zeigt sich, was es heißt, im Tornado zu fliegen: Präzision, Vertrauen, höchste Konzentration. Die Reportage begleitet Piloten und Waffensystemoffiziere im fordernden Alltag und zeigt, wie sie sich auf die Zukunft der Luftwaffe vorbereiten.'
  widescreen: true
