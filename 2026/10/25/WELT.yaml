  title: PS-Schnäppchen - Oldtimer aus den USA
  subtitle: PS-Schnäppchen - Oldtimer aus den USA
  description: 'In Dallas, im US-Bundesstaat Texas, findet eine große Fahrzeug-Auktion statt: Rund tausend Pkw werden hier in vier Tagen versteigert. Zu den bekanntesten Auto-Verkäufern in den Vereinigten Staaten gehört Alex Manos. Sein Geschäft in Los Angeles vertreibt Oldtimer rund um den Globus. Erfahren im Einkauf von US-amerikanischen Oldtimern ist Dieter Thiel aus Wuppertal, der die historischen Fahrzeuge für seine Kunden erwirbt. Die Reportage gibt einen Einblick in den Handel mit Oldtimern aus den USA.'
  widescreen: true
- eventId: 992370
  start: 2026-10-25T01:07:00Z
  stop: 2026-10-25T01:55:00Z
  title: 'Dreamcars: Bentley Continental GT W12'
  subtitle: 'Dreamcars: Bentley Continental GT W12'
  description: Das edelste Holz, das edelste Leder, die edelsten Furniere ­- Bentley, Hoflieferant der britischen Königsfamilie, setzt bei seinen Fahrzeugen auf höchste Qualität. Auch unter der Motorhaube geht es luxuriös zu. Den Continental GT W12 treibt ein 12-Zylinder-Biturbomotor mit 635 PS an. Die Reportage zeigt, wie das wuchtige Sportcoupé im Bentley-Werk im nordenglischen Crewe in einer innovativen Kombination aus traditioneller Handwerkskunst und computergesteuerter Präzision entsteht.
  widescreen: true
- eventId: 992371
