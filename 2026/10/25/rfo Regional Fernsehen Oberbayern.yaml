  title: rfo Regional Fernsehen Oberbayern
  subtitle: Sicherheit im Alpenraum - Tagung der Bayern-Südtirol-Gesellschaft in Kiefersfelden +++ Knott bei Eggstaett IG Metall will zurück zum Tarifvertrag +++ 260.000 Euro für bessere Straßen in Feldkirchen-Westerham
  description: 'Drogenkriminalität, Mafia und Drohnen: Bei einer Tagung in Kiefersfelden diskutierten Behörden und Experten die Sicherheit im Alpenraum. Bayerns Innenminister Herrmann betonte moderne Technik und grenzüberschreitende Zusammenarbeit, etwa beim neuen Drohnenabwehrzentrum. +++ Fast 30 Jahre lang galt beim Bremsen- und Achsenhersteller Knott in Eggstätt ein Tarifvertrag mit der IG Metall. Diesen Vertrag hat die Geschäftsführung gekündigt. Gewerkschaft und Betriebsrat kritisieren diese Entscheidung. +++ Feldkirchen-Westerham erweitert sein Straßensanierungsprogramm: Dank günstiger Ausschreibungen werden statt drei nun fünf Ortsstraßen erneuert. Für rund 260.000 Euro werden Asphalt, Bankette und Entwässerung verbessert. Start noch dieses Jahr, teils mit Vollsperrungen; Abschluss bis 2027.'
- eventId: 695148
  start: 2026-10-25T17:10:00Z
  stop: 2026-10-25T17:20:00Z
  title: Süd Blick vom 25.10.2026
  subtitle: Neuer Treffpunkt am Lokschuppen - Rosenheim gestaltet Vorplatz um +++ Grippeimpfungen auch in Apotheken möglich +++ Lkw-Unfall auf der A8 am Irschenberg
  description: 'Rosenheim hat den Vorplatz des Lokschuppens für 3,1 Mio. Euro neu gestaltet: mehr Grün, Sitzplätze, Radstellplätze und ein Wasserspiel auf der historischen Drehscheibe. Die Stadt wirbt mit Aufenthaltsqualität ohne Konsum, sichtbarer Geschichte und Fördermitteln von Bund und Land. +++ Grippesaison: Schutzimpfung gibt es neben Arztpraxen auch in vielen Apotheken. Erwachsene ab 18 können sich dort nach Voranfrage impfen lassen, Kinder nicht. Oktober/November sind ideal, Schutz nach 10-14 Tagen. Empfohlen für Ältere, Schwangere und chronisch Kranke. +++ Ein Lkw-Unfall hat die A8 bei Irschenberg in der Nacht auf Sonntag lahmgelegt: Ein polnischer Sattelzug schleuderte Richtung Salzburg, prallte in Leitplanken und blieb quer stehen. Die Fahrerin blieb unverletzt. Sperrung bis 5.45 Uhr, Schaden: 120.000 Euro.'
- eventId: 695149
  start: 2026-10-25T17:20:00Z
  stop: 2026-10-25T17:30:00Z
  title: Süd Blick vom 25.10.2026
  subtitle: Weintrauben mit Bergblick - zu Besuch bei Philipp Baumgärtner am Samerberg +++ Alpen Open Water Cup - Auf ein Gespräch mit Florian Wellbrock
  description: 'Philipp Baumgärtner erfüllt sich am Samerberg den Traum vom eigenen Weinberg: Rund 90 Rebstöcke pflegt er mit 50 bis 60 Arbeitsstunden pro Jahr und testet passende Sorten fürs Voralpenland. In Südmenschen berichtet er über Herausforderungen und Geschmack. +++ Am Chiemsee spricht Schwimm-Olympiasieger Florian Wellbrock über seinen Weg an die Weltspitze, den Umgang mit Niederlagen und die Emotionen nach Gold in Tokio 2021. Er verrät, was ihn im Training antreibt, und gibt Nachwuchsschwimmern Tipps.'
