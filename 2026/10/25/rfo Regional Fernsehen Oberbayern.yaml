  subtitle: Revision im Fall der ehemaligen Bundespolizistin +++ Brand in Rosenheim - Eine Person tot +++ Einsatzfahrzeug für Bischofswieser Spontanhelfer +++ Mehr Wohnraum in Feldkirchen-Westerham
  description: Der Fall schien nach Geständnis, Deal vor Gericht und mehr als drei Jahren Haft erledigt. Doch eine frühere Bundespolizistin aus dem Landkreis Rosenheim legt Revision gegen ihr Urteil wegen Vergewaltigung einer Jugendlichen und weiterer Taten ein. Das könnte Strafe und Beamtenstatus beeinflussen. +++ Bei einem Wohnungsbrand in der Münchener Straße in Rosenheim ist am späten Freitagabend ein 52-Jähriger gestorben. Rund 35 Bewohner mussten das Mehrfamilienhaus verlassen, das Feuer wurde auf eine Wohnung begrenzt. Ursache und Todesumstände sind unklar, die Kripo ermittelt. +++ STC Rescue aus Bischofswiesen kann bei Großschadenslagen und Katastrophen künftig mit eigenem Einsatzfahrzeug und Ausrüstung unterstützen. Der per Spenden finanzierte Nissan Navara wurde pünktlich zum zweijährigen Bestehen übergeben und kirchlich gesegnet. +++ Feldkirchen-Westerham will Wohnraum schaffen, ohne neue Baugebiete auszuweisen. Im Bereich Weidach West soll auf einem bisher nur für Nebenanlagen zugelassenen Grundstück ein Wohnhaus entstehen. Dafür wird der Bebauungsplan geändert, das Verfahren läuft noch.
- eventId: 879137
  start: 2026-10-25T15:10:00Z
  stop: 2026-10-25T15:20:00Z
  title: Süd Blick vom 24.10.2026 (Wh.)
  subtitle: Energiegipfel in Burghausen kommende Woche +++ Erricson Rosenheim verlaesst Arbeitgeberverband   +++ Bad Aibling - Insolvenz bei Wellnessanbieter in der Therme +++ Schechen plant Entlastungen bei Kita-Beiträgen
  description: "Beim dritten Burghauser Energiegipfel geht es kommende Woche um die Energieversorgung der Zukunft und die Wettbewerbsfähigkeit des Industriestandorts. Diskutiert werden neue Energieprojekte, der Ausbau der Stromnetze und die Herausforderungen für die Industrie. +++ Rund 530 Beschäftigte, ein Weltkonzern und eine Entscheidung, die in Rosenheim für Unruhe sorgt: Der Anbieter von Kommunikationstechnologien Ericsson hat den Arbeitgeberverband IG Metall verlassen. Damit endet am Standort Rosenheim die Tarifbindung zur Gewerkschaft. \n +++ Die Betreibergesellschaft der Beautykuppel in der Therme Bad Aibling ist insolvent, der Betrieb für Gäste läuft vorerst weiter. Eine vorläufige Verwalterin sucht mit den Stadtwerken einen neuen Betreiber. Als möglicher Grund gelten sinkende Besucherzahlen, womöglich auch wegen des Tageskurbeitrags. +++ Schechen senkt ab Januar 2027 die Kita-Gebühr für drei bis vier Stunden Betreuung von 192 auf 98 Euro. Weil der Freistaat den 100-Euro-Zuschuss streicht, zahlen Eltern unterm Strich mehr. Der Gemeinderat stimmte zu, Elternbeirat und Satzung folgen im November."
