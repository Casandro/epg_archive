  description: 'Rosenheim reißt das fast 40 Jahre alte Parkhaus P1 am Hammerweg ab und baut für rund 13 Millionen Euro neu. Grund sind hohe Belastungen durch Verkehr, Wasser und Streusalz, die Beton und Bewehrung schädigen. Fertigstellung 2029, dann 700 Stellplätze und neue Parkgebühren. +++ Mit der Zeitumstellung fällt mehr Feierabendverkehr in die Dämmerung, wenn Rehe und anderes Wild aktiv sind. An Wald- und Feldrändern steigt das Unfallrisiko, verstärkt durch Sonne, Regen und nasses Laub. Achtsam fahren, nicht ausweichen; Wildunfälle teils meldepflichtig. +++ In Traunreut hat die Kirta-Saison begonnen: Im Holzstadl am Marktplatz feierten Besucher aus der Stadt und den Nachbargemeinden bei Musik und frisch gezapftem Bier. Bürgermeister Hans-Peter Dangschat eröffnete das Fest traditionell mit dem Bieranstich.'
