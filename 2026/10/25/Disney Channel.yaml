  title: Disneys Leroy & Stitch
  subtitle: Zeichentrickfilm, USA/AUS 2006
  description: 'Regie: Tony Craig, Roberts Gannaway. Darsteller: Daveigh Chase, Chris Sanders, David Ogden Stiers. Nachdem Lilo und Stitch alle 625 Experimente bekehrt haben, werden sie für ihre Dienste geehrt und Stitch kehrt mit Pleakley und Jamba zurück ins All. Dort wird Jamba allerdings von Dr. van Hamsterdam gezwungen, ein neues Experiment zu schaffen, dass die Welt erobern soll: Leroy, der teuflische Zwillingsbruder von Stitch. Getarnt als Stitch macht sich Leroy auf den Weg nach Hawaii und verbreitet Chaos über die ganze Insel. Sofort eilen Stitch, Pleakly und Jamba zur Erde, um Lilo und ihren Freunden zu helfen. Wird es ihnen gemeinsam gelingen, Leroy zu besiegen und van Hamsterdam zu vernichten?'
