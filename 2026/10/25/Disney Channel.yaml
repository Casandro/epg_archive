  title: 'Onward: Keine halben Sachen'
  subtitle: Animationsfilm, USA 2020
  description: 'Regie: Dan Scanlon. Darsteller: Tom Holland, Chris Pratt, Julia Louis-Dreyfus. Die Elfenbrüder Ian und Barley erhalten die unerwartete Chance, einen Tag mit ihrem verstorbenen Vater zu verbringen und begeben sich in Barleys Wagen Krimhild auf eine abenteuerliche Reise. Wie jedes gute Abenteuer ist auch ihres voller Zaubersprüche, geheimnisvoller Karten, unmöglicher Hindernisse und unvorstellbarer Entdeckungen. Als ihre Mutter Laurel erkennt, dass Ian und Barley weg sind, tut sie sich mit dem Mantikor zusammen, um sie zu finden. Von gefährlichen Flüchen mal abgesehen, könnte dieser eine magische Tag mehr für sie bereithalten, als sich jeder von ihnen erträumt hätte.'
