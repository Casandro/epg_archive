  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Schlacht um die Midwayinseln
  description: 'Der Überraschungsangriff der Japaner auf den US-Marinestützpunkt Pearl Harbor war ein voller Erfolg: Die Pazifikflotte der Vereinigten Staaten liegt in Trümmern. Admiral Chester Nimitz der US Navy wird beauftragt, das Blatt der Amerikaner wieder zu wenden, da die Japaner es auf die für den Nachschub wichtigen Midwayinseln abgesehen haben. Schließlich kommt es dort zum entscheidenden Showdown der beiden Streitkräfte.'
