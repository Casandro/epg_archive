  title: Helden der Evolution - Vögel
  subtitle: Helden der Evolution - Vögel
  description: 'Sie sind hervorragende Sänger, tragen zum Teil umwerfend farbenfrohe Federkleider und die meisten von ihnen können auch noch fliegen: Vögel gehören ohne Frage zu den faszinierendsten Tieren der Erde. "Just Animals" begleitet sie in dem Moment, in dem sie aus dem Ei schlüpfen, und bei ihren ersten Abenteuern in der Luft. Die Palette der porträtierten Arten reicht vom riesigen Strauß bis zum winzigen Kolibri. Dabei geht es um verschiedenste Formen der Anpassung und einen überraschenden Stammbaum.'
  genre:
  - '129'
  widescreen: true
- eventId: 913554
  start: 2026-10-25T16:20:00Z
  stop: 2026-10-25T17:30:00Z
  title: Helden der Evolution - Meeressäuger
  subtitle: Helden der Evolution - Meeressäuger
  description: Die meisten Säugetiere leben an Land. Doch es gibt Arten, die sich im Laufe der Evolution perfekt an das Leben im Wasser angepasst haben. Wale und Delphine aber auch Robben, Otter und Seekühe haben ihr Zuhause im Ozean. Sogar der Eisbär, das größte lebende Landraubtier, gilt unter bestimmten Umständen als Meeressäuger. "Helden der Evolution" stürzt sich mit den tierischen Protagonisten in die Fluten und dokumentiert ihre unterschiedlichen Überlebenskonzepte über und unter der Wasseroberfläche.
  genre:
  - '129'
  widescreen: true
