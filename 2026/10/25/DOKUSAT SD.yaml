  title: Hitler abgehört
  subtitle: Hitler abgehört
  description: 1942 konnten Widerstandskämpfer in Paris Hitlers privates Telefon abzuhören. Während sie den Führer und andere NS-Größen belauschten, kämpften sie gegen die Zeit, um entscheidende Informationen zu sammeln, die den Kriegsverlauf verändern und das Dritte Reich zu Fall bringen sollten. Spannende und informative Doku über Hitlers Telefoniergewohnheiten.
