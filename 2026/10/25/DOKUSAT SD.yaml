  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Rettung aus der Ferne
  description: 'Eine hochschwangere Frau erleidet einen Herzinfarkt - ein Wettlauf gegen die Zeit beginnt. Wird die Coast Guard rechtzeitig eintreffen, um Leben zu retten? Gleichzeitig erreicht ein Notruf aus der eisigen Wildnis Alaskas die Rettungskräfte: Ein Jäger ist verletzt und kämpft ums Überleben. Zwei dramatische Einsätze, bei denen jede Sekunde zählt.'
