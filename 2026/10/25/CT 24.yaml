  description: "HDTV\nSkryté titulky\nČT1 a ČT24   12:00 - 12:20\n\nModeruje: Lukáš Dolanský  \n\nHost: Lenka Bradáčová, nejvyšší státní zástupkyně\n\n- je justice nezávislá? \n- zpochybňování důvěry v právní stát \n- selhává někde vymahatelnost práva?\n- nezávislost žalobců, důvěra v trestní řízení a schopnost státu vyšetřovat závažnou kriminalitu.\n- ovlivňuje ministr kauzy?\n- současné nastavení vztahu mezi ministerstvem a státním zastupitelstvím je dostatečně zabezpečené před politickými zásahy - mohou být lidé, kteří třeba nedůvěřují nynější politické moci v klidu?\n- stalo se někdy, že by politik (jakýkoli) zasahoval do vyšetřování?\n\nČT1 a ČT24   12:20 - 13:00\n\nModeruje: Lukáš Dolanský  \n\nHost: Jeroným Tejc  /nestr. za ANO/, ministr spravedlnosti\n\nHost: Eva Decroix  /ODS/, bývalá ministryně spravedlnosti, členka sněmovního ústavně-právního výboru\n\nHost: Renata Vesecká  /Motoristé/, bývalá nejvyšší státní zástupkyně, předsedkyně sněmovního ústavně-právního výboru\n\nHost: Libor Vávra, bývalý prezident Soudcovské unie ČR\n\n- nezávislost justice\n- plánované změny v trestním řádu (trestní odpovědnost dětí pod 15 let, dětský certifikát, atd)\n- efektivita legislativního procesu (přílepky, poslanecké návrhy, lex-y)\n- aktuální agenda: rozpočet (bude po 1. čtení)"
