  title: Archiv ČT24
  subtitle: Přináší střihové dokumenty k aktuálním i nadčasovým tématům. Vychází z Československých filmových týdeníků z let 1945-1989 a z archivu zpravodajství České televize.
  description: |-
    HDTV
    Skryté titulky
    V roce 1923 byly založeny Československé státní aerolinie, které s několika obměnami názvu i formy existence působily až do roku 2024. Po druhé světové válce se postupně obnovovaly letecké linky a ČSA nakoupily nová letadla. Ta přibývala i v dalších desetiletích, stejně jako destinace, kam ČSA létaly. Přestože se po změně režimu, a s tím souvisejícími ekonomickými dopady, podařilo společnost v 90. letech stabilizovat a dostat ji do zisku, vývoj po roce 2000 už tak pozitivní nebyl a snahy o záchranu jedněch z nejstarších aerolinií na světě nakonec zkrachovaly. Poválečné dění okolo ČSA zaznamenaly kamery filmových týdeníků a televizního zpravodajství.
