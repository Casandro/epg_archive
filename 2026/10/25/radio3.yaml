- eventId: 1435253
  start: 2026-10-25T22:00:00Z
  stop: 2026-10-25T23:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Arooj Aftab

    Diese Sängerin, Komponistin und Musikproduzentin ist die erste pakistanische Künstlerin, die einen Grammy Award gewonnen hat. Grammy-Nominierungen und der niederländische Edison Jazz Award folgten. Ihre innovativen Kompositionen entstehen meist in Brooklyn in New York - ihrem neuen Lebensmittelpunkt. Sie sind eine Mischung aus Jazz, Electronica, Minimal Music und traditioneller pakistanischer Musik. Für ihre poetischen Texte lässt sie sich aus der mystischen Dichtung der Sufi inspirieren. Zusammengehalten wird alles von ihrem warmen, gefühlvollen Gesang.

    Moderation: Ortrun Schütz
