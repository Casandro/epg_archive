  title: Lebenswelten
  description: |-
    Muslime in der Bundeswehr
    Auf dem Weg zur muslimischen Militärseelsorge
    Eine Sendung von Melahat Simsek

    Muslimische Soldatinnen und Soldaten gehören seit Jahren selbstverständlich zur Bundeswehr - doch eine islamische Militärseelsorge gibt es bislang nicht. Das soll sich nun ändern: Ein Pilotprojekt bereitet erstmals Imame auf den Einsatz als Militärseelsorger vor und schließt damit eine Lücke neben der christlichen und jüdischen Seelsorge. Zwei muslimische Soldatinnen setzen sich seit Langem für dieses Anliegen ein. Offizierin Nariman Hammouti berichtet von Auslandseinsätzen und dem Wunsch nach religiösem Beistand im Ernstfall. Und Oberleutnant Hülya Süzen macht deutlich, warum muslimische Seelsorge für viele Militärangehörige ein wichtiger Schritt zu mehr Gleichbehandlung und Anerkennung ist.
