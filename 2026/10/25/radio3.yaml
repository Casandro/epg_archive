  title: Die Hörbiografie
  description: |-
    Peter Tschaikowsky: Der Wille zum Glück (5/9)
    Das verflixte Jahr 77 (1877)
    Von Jörg Handstein

    Bei Peter Tschaikowsky ist es kaum möglich, Werk und Leben voneinander zu trennen. Zu dicht durchdringen beide einander. Im Fluss seiner Melodien bleibt der Mensch immer erkennbar, von den Balletten über die Sinfonien bis zu den großen Opern. Dabei steht er zwischen den Welten Russlands und Westeuropas. Seine Werke gehören zu den meistgespielten der Klassik, dennoch sind noch viele Rätsel mit seiner Person verbunden. Nicht zuletzt Tschaikowskys Homosexualität und sein Tod bieten immer wieder Anlässe für Spekulationen. In seiner Hörbiografie hält sich Jörg Handstein an die Fakten und findet in Briefen und Zeitzeugenberichten neue Blickwinkel für ein umfassendes Bild von Tschaikowsky.

    Udo Wachtveitl = Erzähler
    Stefan Wilkening = Tschaikowsky
    Moritz Zehner = Tschaikowsky als Kind
