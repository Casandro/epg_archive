  title: Písničky z cizí kapsy
  description: Nahrávka skladby Desperát je poměrně dokonalým otiskem písničky Highwayman. Oproti logickým předpokladům v ní neběží jen o popis otřepaného příběhu z Divokého Západu, podávaného na tisíc způsobů. Tak jako před nimi čtyřhvězdí amerických countryových hrdinů ve složení Johnny Cash, Willie Nelson, Kris Kristofferson a Waylon Jennings i čeští pěvci Leicht, Křesťan, Daněk a Bobek zůstali u textu, v němž jde spíš o reinkarnaci lidské duše. Rychlými příběhy ji kreslí na příkladu čtyř postav. Ta první, Desperát, dává celé písničce i jméno. V angličtině zní Highwayman, což je termín, který se používal už od 17. století pro lupiče na koních, kteří přepadávali pocestné. A stejný název si pro svůj společný projekt zvolili v prostředku 80. let zmínění američtí countryoví bombarďáci. Melodicky zajímavou skladbu se zvláštním napětím však už v roce 1977 napsal (i natočil) jiný Američan - Jimmy Webb, velmi úspěšný zpěvák a skladatel, pohybující se někde na půl cesty mezi country hudbou a popem pro dospělé. Inspiraci získal vskutku zajímavým způsobem, jak se dozvíte v rubrice Písničky z cizí kapsy. K poslechu zve Martin Schuster.
