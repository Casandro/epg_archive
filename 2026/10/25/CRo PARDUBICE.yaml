- eventId: 641846
  start: 2026-10-25T17:04:00Z
  stop: 2026-10-25T17:45:00Z
  title: Na nedělní vlně z Pardubic
  description: Většina činžovních domů v blízkosti třídy Míru, pardubická radnice nebo takzvané zahradní město s několika desítkami vil či dělnických domků na Bílém Předměstí. To je jen krátký výčet staveb, na kterých se podílela rodina Kašparových. Jde o několik stavitelů a architektů, kteří jsou spojeni nejen s Pardubicmi, ale i s okolím, třeba jako majitelé cihelny v Mikulovicích.
- eventId: 641847
  start: 2026-10-25T17:45:00Z
  stop: 2026-10-25T18:00:00Z
  title: Na nedělní vlně z Pardubic
  description: '"Někdo hraje šachy, někdo luští křížovky a někdo píše. Je to obrovský relax. Sednete, zapomenete, co je kolem vás, a píšete," řekl kdysi pro ČRo Pardubice Bohumil Kos. Dlouholetý provozně-ekonomický náměstek Východočeského divadla nás v pondělí ve věku 78 let bohužel navždy opustil. Pod pseudonymem Jarad Portský, inspirovaným jeho oblibou v portském víně, psal s nadsázkou a humorem o světě, který důvěrně znal - o divadelním zákulisí. Jeho tvorbu i osobitý vypravěčský styl si připomeneme zdramatizovanou povídkou Trhák.'
