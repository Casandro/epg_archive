  description: 'Dana Drábová podle Lenky Hatašové. Dana Drábová - jaderná inženýrka, předsedkyně Státního úřadu pro jadernou bezpečnost, lokální a regionální politička, místostarostka a patriotka Pyšel, ale především žena, která milovala svoji práci a lidi kolem sebe a uměla si získat jejich respekt, úctu i srdce. Fotografka Lenka Hatašová na ni zavzpomíná jako na blízkou přítelkyni, se kterou ji pojily nejen společné výlety a zážitky. Autor: Lada Krenková. Premiéra.'
