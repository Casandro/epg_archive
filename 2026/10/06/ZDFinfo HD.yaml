  title: Wer ist Kim Yo-jong?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2022
    Kim Yo-jong: Sie ist die Schwester von Nordkoreas Diktator Kim Jong-un und zugleich seine engste Beraterin. Längst gilt Kim Yo-jong als Nordkoreas geheime Nummer zwei.

    Doch man weiß fast nichts von ihr. Nicht einmal ihr Geburtsjahr ist bekannt. Wer ist die Frau, die öffentlich nicht sprechen darf, aber aus dem Hintergrund die Strippen zieht? Wer ist die Souffleuse des Diktators? Wer ist Kim Yo-jong?
