  description: |-
    Großbritannien 2025
    König Salomo - legendärer Herrscher im Goldenen Zeitalter Israels. Weiser König, Bauherr eines prächtigen Tempels, sagenhaft reich. Wie sieht die Welt aus, in der Salomo einst herrscht?

    Salomos Reich ist eng mit seinen Nachbarn verbunden, sowohl im Handel als auch in der Rivalität. Auch dort finden sich Spuren aus der Zeit des Königs. Es ist eine Welt zwischen Götterverehrung und Machtpolitik, in der Salomos sagenumwobener Ruhm wurzelt.
    HD-Produktion
