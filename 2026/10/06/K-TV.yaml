  title: Fatima - Unsere Hoffnung
  subtitle: Dokumentation
  description: Schon während des zweiten Weltkrieges sind zwei grosse Fatima Bewegungen entstanden. Der zweite Weltkrieg ging 1945 zuende. Bedrohliche Spannungen zwischen Ost und West blieben, ein Atomkrieg hätte jederzeit ausbrechen können. In der Zeit dieser Bedrohung ist der Film "Fatima - Unsere Hoffnung entstanden". Der Film ist aber heute aktueller den je, denn ohne intensives Gebet und Rückkehr der vielen abgefallenen Katholiken zur Kirche vermag die weitgehend atheistische Politik die derzeitige grosse Bedrohung des Friedens nicht abzuwenden.
