  title: Ist Gott eine Person?
  subtitle: Spiritualität
  description: "Univ.-Prof. em. DDr. Hanna-Barbara Gerl-Falkovitz ist Philosophin, Sprach- und Politikwissenschaftlerin. Nach ihrer Tätigkeit als Studienleiterin auf Burg Rothenfels/Main, akademische Oberrätin am Seminar für Christliche Weltanschauung, Religions- und Kulturtheorie der Universität München, sowie als Privatdozentin in Bayreuth, Tübingen und Eichstätt, folgte eine Professur für Philosophie an der Pädagogischen Hochschule in Weingarten/Bodensee. Von 1993 bis 2011 war sie Lehrstuhlinhaberin für Religionsphilosophie und vergleichende Religionswissenschaft an der Technischen Universität Dresden. Seit 2011 ist sie Leiterin des EUPHRat (Europäisches Institut für Philosophie und Religion) in Heiligenkreuz bei Wien. \nProf. Gerl-Falkovitz ist u.a. Trägerin des Joseph-Pieper Preises, des Edith-Stein-Preises, des Augustin-Bea-Preises sowie des Ratzinger Preises. Die Tagespost beschreibt Hanna-Barbara Gerl-Falkovitz passend als \"ein Leuchtfeuer im Nebel der postmodernen Landschaft\" und \"eine der wichtigsten katholischen Stimmen in Europa\"."
