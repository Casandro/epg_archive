  title: Ein Stückchen Himmel auf Erden - Ein Rundgang durch die Wieskirche
  subtitle: Dokumentation
  description: 'Eingebettet in das Alpenpanorama erhebt sich ein besonderer Gnadenort: die Wallfahrtskirche zum Gegeißelten Heiland auf der Wies. Farbenpracht, die Leichtigkeit des Rokokos und himmlisches Lichtspiel - zugleich eine tiefe Christozentrik, die alles auf den Gegeißelten Heiland fokussiert. Zufall? Keineswegs, wie Wieskurat Florian Geis Athinea Andryszczak bei einem faszinierenden Rundgang erklärt. Erfahren Sie mehr über das Wunder der weinenden Jesus-Statue, die Geschichte der Wallfahrt und das theologische Gesamtkonzept dieses UNESCO-Weltkulturerbes. "Der Geißelheiland wird zum Bruder für viele: Im Leiden, auf dem Glaubensweg, aber auch in der Perspektive des Ewigen Lebens", denn "zum Auferstandenen kommst Du nur über den Gekreuzigten" berichtet Bischof Bertram Meier, der unweit des Wallfahrtsortes aufwuchs: "Es hat tiefe Spuren hinterlassen, beim Wiesheiland zelebrieren zu dürfen". Ein Ort voller Wunder, bestätigt durch Berichte von damals und heute. Erleben auch Sie, was Himmel bedeuten kann!'
