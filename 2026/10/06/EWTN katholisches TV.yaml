  stop: 2026-10-06T16:00:00Z
  title: Zambia - DJ Baza
  subtitle: EWTN Galerie - Dokumentation
  description: |-
    In dieser Dokumentation begleiten wir DJ Baza - Michael Hamusa, der für Radio Musi-O-Tunya, einen katholischen Radiosender in Livingstone, Sambia, arbeitet.

    Das Radio als Stimme der Versöhnung, als Stimme derer, die sonst keine haben: Michael macht sich auf die Suche nach Geschichten fürs Radio. Der psychisch Kranke, der sich bekehrt hat und von seiner Rettung durch Jesus Christus singt, aber auch die Eltern, die in einer von einer Mine bleiverseuchten Gegend ihre Kinder kaum vor Vergiftung retten können. Michael erzählt diese Geschichten, bringt sie zu den Menschen. Zugleich lernt er, angeleitet von seiner Chefin Sr. Perpetua, seine Arbeit und seinen Dienst beim Radio immer besser auszuüben.

    Eine Dokumentation über das Leben und das Lernen, und über die Mission, die ein jeder Christ hat.
  widescreen: true
