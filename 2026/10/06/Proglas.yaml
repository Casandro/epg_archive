  title: Slyšte, lidé!
  subtitle: Sólo pro piano 15
  description: 'Autor a interpret: Milan Tesař; Premiéra: 3.10.2026 * V týdeníku Slyšte, lidé! se po dvou letech vracíme k seriálu Sólo pro piano, v němž představujeme výrazné pianisty z různých zemí a žánrů. Tentokrát uslyšíte hudbu italského pianisty Massima Buffettiho, Švéda Mathiase Landæuse, Nikol Bókové, Yeleny Eckemoff, Klaudia Kováče a Andreje Farkaše ze Slovenska, Kristjana Randalu z Estonska, Ramiho Khalifého z Libanonu a italské klavíristky Margherity Favy. Klavír bude pokaždé v centru pozornosti, ať už jako hlavní nástroj jazzového tria, součást většího ansámblu, nebo prostředek propojující komponovanou hudbu s improvizací.[masima bufetyho] [matyas landeuse] [jeleny ekemof] [kalifeho] [margerity fávy] '
  genre:
