  subtitle: Leyla McCalla a její Kapitalistické blues
  description: 'Autor: Milan Tesař; Interpret: Leyla McCalla; Premiéra: 26.7.2021 * Leyla McCalla je americká zpěvačka, hudebnice a skladatelka s haitskými kořeny. V pořadu Jak se vám líbí nám představí své nejnovější album The Capitalist Blues, promluví o spolupráci na albu haitské skupiny Lakou Mizik a také pohovoří o svých pocitech ze současného stavu společnosti ve Spojených státech a na Haiti. Rozhovor jsme v premiéře vysíláme v předvečer zpěvaččina vystoupení na Folkových prázdninách v Náměšti nad Oslavou v roce 2021. Nyní vám přinášíme reprízu. [lejla mek kala] [d kapitalist blús] [laku mizik]'
