  title: Cimbál a husle
  description: Jaké příběhy a melodie s sebou přináší podzimní vítr, ať už jen zlehka povívá dolinou, nebo naplno duní v horách a věstí změnu počasí? A jak dovede lidová píseň zachytit magický přerod léta v podzim, doprovázený vydatným deštěm, hromy i prvními mrazíky? Novou epizodou z cyklu Cimbál a husle nás budou provázet rozmanité přírodní živly. Zaposloucháme se do písní o větru, dešti a možná i blescích. Připravuje Honza Žůrek.
