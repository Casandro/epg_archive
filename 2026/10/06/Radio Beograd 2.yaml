  description: Persijska muzika u iranskoj dijaspori i dalje živi. Iran je zemlja izuzetno bogate kulture i viševekovnog muzičkog nasleđa, koje uživa veliko poštovanje širom sveta. Iranski umetnici koji danas žive i stvaraju u Evropi i Americi nastavljaju da neguju tu tradiciju, ali i da je razvijaju u susretu sa drugim muzičkim kulturama. U emisiji ćemo predstaviti nekoliko novih albuma istaknutih iranskih umetnika koji već decenijama deluju daleko od svoje domovine. Sestre Mahsa i Mardžan Vahdat višestruko su nagrađivane za svoja solistička, ali i zajednička izdanja. Kompozitor i muzičar Džavid Afsari Rad snimio je novi album sa svojim ansamblom, na kojem gostuje i pevač Vahid Tadž, dok je Kija Tabasijan, umetnički rukovodilac kanadskog ansambla Constantinople, ostvario novu saradnju sa korzikanskom vokalnom grupom A Filetta.
