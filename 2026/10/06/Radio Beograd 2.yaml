  title: Od zlata jabuka
  subtitle: U današnjoj emisiji Od zlata jabuka predstavljamo jedan od najvoljenijih dueta makedonske narodne muzike - Violetu Tomovsku i Kirila Mančveskog.
  description: U današnjoj emisiji Od zlata jabuka predstavljamo jedan od najvoljenijih dueta makedonske narodne muzike - Violetu Tomovsku i Kirila Mančveskog. Saradnja Tomovske i Mančevskog je započela u profesionalnom ansamblu "Tanec" iz Skoplja, gde su oboje bili istaknuti vokalni solisti. Tamo su kompozitor Jonče Hristovski i harmonikaš Kočo Petrovski prepoznali njihov potencijal i odlučili da od njih naprave duet. Koliko je njihova procena bila dobra, pokazalo se već na prvoj ploči koju su izdali 1964. godine za Radio-Televiziju Beograd. Ova ploča, na kojoj su pevali u pratnji ansambla "Tanec", već je proglašena zlatnom i nakon toga počinje njihova popularnost. Pesme "Makedonsko devojče", "Oj, ti momče, Ohriđanče", "Ajde, slušaj, slušaj, Kaleš bre Anđo" i mnoge druge ovaj duet je obeležio svojom jedinstvenom interpretacijom, zbog čega njihovi trajni snimci i dalje služe kao uzor mladim pevačima.
