  description: Najavljujemo početak jubilarnog, 20. PROZEFEST-a koji će u Kulturnom centru Novog Sada biti održan od večeras do 9. oktobra. U okviru svečanog otvaranja, Međunarodna književna nagrada "Milovan Vidaković" biće uručena Vladi Uroševiću, jednom od najistaknutijih savremenih makedonskih pisaca, pesniku, romansijeru, esejisti i prevodiocu, kao i članu Makedonske i Srpske akademije nauka i umetnosti. Festival će otvoriti prof. dr Aleksandar Jerkov. O programu, kao i značaju ove književne manifestacije, u današnjoj emisiji Kulturni krugovi govoriće Marijana Jelisavčić Karanović, jedna od urednica programa festivala i članica Organizacionog odbora.U Beogradu se obeležava Dan Filološkog fakulteta. Donosimo informacije sa konferencije za novinare koja je održana tim povodom.Izveštavamo i sa promocije esejističke knjige "Sve bilo je muzika" Đorđa Matića koja je održana u Dorćol Placu u Beogradu. Pored autora, o ovoj knjizi, muzici i književnosti govorio je i multidisciplinarni umetnik Uroš Đurić.
