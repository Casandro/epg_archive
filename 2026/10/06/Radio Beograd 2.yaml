  title: Umetnost interpretacije
  subtitle: Emisija će biti posvećena snimcima jednog od naših najuglednijih dirigenata i dugogodišnjem šefu dirigentu Hora Radio-televizije Beograd. Rođen 1920.
  description: Emisija će biti posvećena snimcima jednog od naših najuglednijih dirigenata i dugogodišnjem šefu dirigentu Hora Radio-televizije Beograd. Rođen 1920. godine, Borivoje Simić je kompoziciju studirao na Muzičkoj akademiji u Beogradu u klasi Stanojla Rajičića, a dirigovanje u klasi Mihajla Vukdragovića. Radio je isprva kao dirigent hora kulturno-umetničkog društva "Ivo Lola Ribar", a 1948. dolazi u Radio Beograd, gde postaje dirigent, a potom i šef Hora Radio Beograda. Tokom svoje dugogodišnje karijere snimio je oko 15000 minuta trajnih arhivskih snimaka najznačajnijih dela jugoslovenske i svetske muzičke literature, u rasponu od polifonih kompozicija 16. veka, preko vokalno-instrumentlanih dela baroka, klasike i romantizma, do savremene literature svih stilskih orijentacija, s posebnim akcentom na muziku srpskih i jugoslovenskih autora. Sa Horom Radio-televizije Beograd imao je uspešne turneje širom Jugoslavije, ali i u inostranstvu, čineći od ovog sastava jedan od najuigranijih...
