  description: U emisiji Naučni skupovi, od 5. do 10. oktobra, možete slušati snimke sa 33. Simpozijuma Srpskog filozofskog društva, koji je održan 19. i 20. septembra u Sremskim Karlovcima. U drugoj emisiji ovog ciklusa možete pratiti izlaganje Katarine Đurđević "Filozofko znanje i informatičko društvo". Ovogodišnji Simpozijum Srpskog filozofskog društva, koji se u kontinuitetu već 33 godine održava u Sremskim Karlovcima, imao je dve aktuelne i međusobno srodne teme "Filozofija o informatičkom društvu i komunikacije" i "Filozofija i veštačka inteligencija". Shodno tome, prvog dana se raspravljalo o položaju filozofije u današnjem svetu masovnih medija i informacionih tehnologija, koje svakako donose i nove mogućnosti razvoja i određene humanitarne rizike. Razmatrajući temu, pre svega, sa etičkog i ontološkog aspekta, učesnici skupa su nastojali da pruže realnu procenu mesta i značaja informatičkog društva i same komunikacije kroz istoriju, u sadašnjosti, ali i u budućim perspektivama. Drugi dan...
