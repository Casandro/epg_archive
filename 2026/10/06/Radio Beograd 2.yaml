  description: Pre Elvisa nije bilo ničega - izjaviće Bob Dilan i Džon Lenon. Div u američkoj popularnoj kulturi, božanstvo u istoriji rokenrola, Elvis Prisli je spojio gospel i tradicionalni crnački ritam i bluz sa kantrijem da bi stvorio potpuno nov muzički pravac i time uneo pometnju u puritansku Ameriku pedesetih godina XX veka. Elvis Prisli rođen je u januaru 1935. godine u gradiću Tupelo u državi Misisipi. Kada je imao 13 godina, porodica Prisli se preselila u Memfis, a tokom školovanja Elvis je počeo da neguje specifičan izgled i stil oblačenja koji je podrazumevao dugu kosu i izdužene zulufe po čemu se razlikovao od svojih vršnjaka. Nije imao formalno muzičko obrazovanje, bio je samouk, a često je posećivao prodavnice gramofonskih ploča i slušao mnogobrojne bluz nastupe širom Memfisa . 1954. godine u San studiju u Memfisu, studiju legendarnog Sema Filipsa, Elvis snima "That's All Right (Mama)" (obradu bluz pesme Artura Krudapa). Tri dana kasnije pesma je prvi put puštena na lokalnom radiju...
