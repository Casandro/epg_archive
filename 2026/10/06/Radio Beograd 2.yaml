  title: Čitač
  subtitle: Ako vas je prodrmao hispanoamerički bum (Borhes, Markes, Kortasar, Fuentes, Vargas Ljosa itd.) posle pola veka to će opet učiniti hispanoamerički beng (Šveblin, Netel, Portela, Oheda?).
  description: Ako vas je prodrmao hispanoamerički bum (Borhes, Markes, Kortasar, Fuentes, Vargas Ljosa itd.) posle pola veka to će opet učiniti hispanoamerički beng (Šveblin, Netel, Portela, Oheda?). To su spisateljice XXI veka, buntovnice koje pomeraju granice novog pisma. 24 autorke se nalaze sa svojim pričama između korica knjige koju su priredili Ksenija Bilbija i Branko Anđić. Gost emisije je Branko Anđić. Govorimo o knjizi koja je književni prvenac Olivera Lovrenskog "Kad smo bili mlađi" (2003) koji je napisao sa 19 godina i napravio ogroman uspeh u Norveškoj. Roman je inspirisan životom samog Lovrenskog. Oliver Lovrenski je hrvatsko-norveškog porekla,odrastao u Norveškoj i piše na norveškom. Za samo nekoliko meseci roman je imao tiraž u Norveškoj od 65.000 primeraka. Roman preporučuje za čitanje glavni urednik Geopoetike Vladislav Bajac.
