  description: U emisiji Imaginarna edicija, od ponedeljka 5. do petka 9. oktobra, možete slušati delove knjige francuske teoretičarke Sintije Fleri "Ovde počiva gorčina". Pojam resantimana u filozofiju je uveo Fridrih Niče. Reč se sastoji od prefiksa "re" koji upućuje na ponavljanje i imenice "sentiment", dakle osećaj. Resantiman bi, utoliko, bilo nekakvo ponavljanje osećanja, što, međutim, ne znači ništa. Ovde je potreban ničeanski kontekst. Kod Ničea, dakle, resantiman je negativna osobina koja ukazuje na slabost osobe obuzete resantimanom, te ono "re" u reči resantiman, koje, dakle, upućuje na ponavljanje, u niečanskom kontekstu znači odgovor na nekakvu akciju, te je resantiman uvek nekakva reakcija (re + akcija). Zbog čega bi to bilo loše? Zbog toga što čovek resantimana nije aktivan, ne ide događajima u susret, ne preduzima ništa dok na akciju nije prinuđen. Čovek resantimana čeka događaj na koji bi odgovorio, dakle reagovao. Utoliko je čovek resantimana pasivan i, dok čeka događaj, u njemu...
