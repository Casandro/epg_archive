  title: En quête de sens
  description: 'L''appel de la montagne 1 / 2 Après une opération aux deux pieds pour des tumeurs bénignes, la vie de Nathalie a été bouleversée. Ses douleurs chroniques ne lui permettent plus de se déplacer librement. Béquilles, orthèses et chaise roulante font partie de son quotidien. Pour accepter son handicap, elle s''est lancée un défi: gravir la Dent de Morcles, un sommet de près de 3000 mètres.'
