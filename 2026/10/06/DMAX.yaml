  title: Die Helgoländer
  subtitle: Alles auf Anfang
  description: |-
    Am Helgoländer Frachthafen herrscht bereits um fünf Uhr morgens Hochbetrieb. Von Bord der "Sandshörn" werden Getränke abgeladen, damit die Supermärkte und Restaurants auf der Hochseeinsel nicht auf dem Trockenen sitzen. Handwerker Nils beseitigt unterdessen Schäden, die Wind und Wellen im Winter verursacht haben. Denn in wenigen Tagen beginnt auf Helgoland die Tourismussaison, bis dahin muss alles wieder glänzen. Wenn die ersten Gäste eintreffen, hat auch Eileen wieder alle Hände voll zu tun - im Sommer nicht selten an sechs oder sogar sieben Tagen in der Woche.
