  title: Amerikas Geschlechterkampf
  subtitle: Frankreich 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wie lebt es sich in einem Land, in dem Frauen für die Verbrechen ihrer Ehemänner ins Gefängnis gehen? Einem Land, in dem ein Mann eine Zehnjährige zur Frau nehmen darf und in dem Abtreibungen - selbst in Fällen von Vergewaltigung und Inzest - illegal sind? Dieses Land ist das "Land of the Free", die USA. In einer der ältesten Demokratien der Welt führt der Aufstieg des christlichen Nationalismus und die Rückkehr von Donald Trump als US-Präsident zu einem historischen Rückgang der Frauenrechte. Der Dokumentarfilm beleuchtet die Mechanismen hinter dieser freiheitsbeschränkenden und rückwärtsgewandten Politik.
