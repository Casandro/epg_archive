  title: '"Blix Not Bombs" - Der Diplomat und der Krieg'
  subtitle: Deutschland/Schweden/Tschechische Republik 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Als Chefdiplomat im Auftrag der UNO war Hans Blix ein wichtiger Akteur in globalen Krisen. Regisseurin Greta Stocklassa blickt mit ihm auf die letzten 60 Jahre Weltpolitik zurück. Warum gibt es noch immer Kriege? Kann Diplomatie die Welt retten? Reicht es aus, in bestimmten Situationen die Wahrheit zu sagen? Wo liegt die persönliche Verantwortung für die Menschheit und die Welt? Der Film stellt Fragen über die Vergangenheit, um Perspektiven für die Zukunft zu entwickeln.
