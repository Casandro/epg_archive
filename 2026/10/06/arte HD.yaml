  title: Italiens unbekannter Norden
  subtitle: Das Aostatal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das Aostatal im Nordwesten Italiens ist von majestätischen Gipfeln umgeben: Gran Paradiso, Mont Blanc, Monte Rosa, Matterhorn. In den Alpen an der Grenze zu Frankreich und zur Schweiz gelegen, ist die Region die kleinste und am dünnsten besiedelte des Landes. Die beeindruckende Landschaft prägt die Menschen. Wer hier lebt, hat eine tiefe Verbindung mit der Bergwelt.

    Ob auf Gletschern, Almen oder unter den Sternen: Das Aostatal steht für wilde Schönheit und eine tiefe Verbundenheit der Menschen mit der Bergwelt.
