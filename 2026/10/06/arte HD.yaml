  title: Girls for Tomorrow
  subtitle: Schwesterlich und engagiert in den USA
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 2015 zieht Nora Philippe nach New York. Als junge Mutter macht sie sich auf die Suche nach Verbündeten, um Mutterschaft und Feminismus unter einen Hut zu bringen. Ihre Recherchen führen sie an das Barnard College, eine geschichtsträchtige Universität für Frauen. Nora trifft Evy, Lila, Anta und Talia - vier Studentinnen, die sich mit ihr auf eine intime und sehr politische Reise begeben. Die Regisseurin begleitet die Frauen über zehn Jahre, die geprägt sind von Donald Trumps erster Präsidentschaft, MeToo, Black Lives Matter und der Klimakrise.
