  title: Borgia - 1501
  subtitle: Borgia - 1501
  description: 'Als Dorotea Malatesta Cesare zusammen mit ihrer neugeborenen Tochter verlässt, nimmt er an ihr und ihrer Familie grausame Rache. Lucrezia schafft die Hindernisse für ihre Ehe mit Alfonso D''Este aus dem Weg. Über ihre Hochzeit fällt ein Schatten: Sie darf nur ihren jüngeren Sohn Rodrigo nach Ferrara mitnehmen. Ihren Verdacht, er habe ihren Ehemann Di Calabria getötet, zerstreut Alfonso D''Este. FR 2013'
  ageRating: 16
- eventId: 1446187
  start: 2026-10-06T20:55:00Z
  stop: 2026-10-06T21:49:00Z
  title: Borgia - 1502
  subtitle: Borgia - 1502
  description: Gacet kehrt als Gesandter des Osmanischen Reiches zurück. Während Lucrezias Hochzeit mit Alfonso D'Este in Rom brodeln die Feindseligkeiten zwischen ihren Familien unter der Oberfläche. Gacet und Alessandro verhindern die Veröffentlichung von Rodrigos vermeintlichen Tagebüchern und töten Della Roveres Verbündeten Alidosi. Die echten Tagebücher verwahrt jedoch der Zeremonienmeister Burkhardt. FR 2013
  ageRating: 16
- eventId: 1446208
  start: 2026-10-06T21:55:00Z
  stop: 2026-10-06T22:49:00Z
  title: Borgia - 1503 - Teil 1
  subtitle: Borgia - 1503 - Teil 1
  description: In Ferrara begegnen Alfonso D'Estes Geschwister Lucrezia mit Feindseligkeit,Alfonso verbietet der Einsamen den Umgang mit seinem unehelichen Halbbruder Giulio. Cesare überrumpelt die abtrünnigen Generäle und lässt sie töten. Seine Brutalität lässt Ludwig erschaudern. In Rom fällt Rodrigo der Malaria zum Opfer. Der syphiliskranke Cesare, Agapito und Goffredo verschanzen sich vor dem wütenden Mob. FR 2013
  ageRating: 16
- eventId: 1446209
  start: 2026-10-06T22:50:00Z
  stop: 2026-10-06T23:44:00Z
  title: Borgia - 1503 - Teil 2
  subtitle: Borgia - 1503 - Teil 2
  description: Der Tod ihres neugeborenen Sohnes schwächt Lucrezias Position, zumal ihre Freundschaft mit Giulio Alfonso D'Estes Zorn weckt. Vor dem Konklave ringt Cesare den widerstreitenden Parteien Zugeständnisse ab. Rodrigos Nachfolger wird sein Erzfeind, der greise Piccolomini, der jedoch nur einen Monat später stirbt. Auf den Stuhl Petri gelangt mit Della Rovere ein Gegner, den Cesare gut zu kennen meint. FR 2013
  ageRating: 16
