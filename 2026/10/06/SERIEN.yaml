  title: Borgia - 1498
  subtitle: Borgia - 1498
  description: 'Zu Rodrigos Ärger ist Cesare gezwungen, sich Ludwig zu unterwerfen und ihm freies Geleit durch den Kirchenstaat zu gewähren. Alfonso Di Calabrias Unachtsamkeit lässt Lucrezias jüngsten Sohn schwer erkranken. Alfonso sorgt für die Genesung des Kleinen, doch seine Position ist schwächer denn je. Cesares Glück wendet sich: Er erleidet eine schwere Niederlage und kehrt geschlagen nach Rom zurück. FR 2013'
