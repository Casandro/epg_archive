- eventId: 865013
  start: 2026-10-06T19:00:00Z
  stop: 2026-10-06T20:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Friederike Westerhaus'
  description: |-
    "Jost in Time" - Verbindende Welten

    Um die Geschichten hinter den Noten geht es in unserer Reihe "Jost in Time" mit dem namhaften Komponisten und Dirigenten Christian Jost. Was hat die Komponistinnen und Komponisten umgetrieben? Welche Überraschungen sind erst beim genauen Hören zu entdecken? Und was haben die ausgewählten Werke aus dem 20. und 21. Jahrhundert mit uns heute zu tun? Im Gespräch mit der Musikjournalistin Friederike Westerhaus ist Christian Jost am Puls der Zeit. Dabei kreist jede Folge um ein Thema.
    In Folge 8: Verbindende Welten
    Verschiedene Welten kommen im Schaffen von Qigang Chen zusammen, eines der führenden Komponisten Chinas, der im August 2026 seinen 75. Geburtstag feiert. Bei ihm treffen traditionelle chinesische Einflüsse auf westliche klassische Musik, wie in dem 1996 komponierten Cellokonzert "Reflet d'un temps disparu" ("Reflexion einer vergangenen Zeit").

    Moderation: Friederike Westerhaus
- eventId: 865014
  start: 2026-10-06T20:00:00Z
  stop: 2026-10-06T21:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Thomas Haak'
  description: |-
    Jazzkonzert Alma Naidu vom 27.06.2026 - Festival JazzBaltica, Timmendorfer Strand

    Für die Fachpresse ist Alma Naidu eines der größten Gesangstalente der Republik. Hervorgehoben wird dabei besonders ihre zartelegische, klare und intonationssichere Stimme. Was allerdings viele andere Seiten der 31-Jährigen unterschlägt, die sich ebenfalls überaus kraftvoll und souverän zwischen den Genres wandelnd präsentiert und zudem offen über Sexismus im Jazz spricht. Auf der JazzBaltica 2026 war jedenfalls eine fulminante, mitten im Leben stehende Alma Naidu samt kongenialer Band zu erleben, bei der weibliche Klischeezuschreibungen wie "engelsgleich" deutlich in die Irre führen.

    Moderation: Thomas Haak
