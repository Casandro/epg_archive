  subtitle: Freigeschwommen
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: Als die 25-jährige Diana Kessler in die Notaufnahme kommt, stehen die Fachärzte Dr. Ben Ahlbeck und Dr. Elias Bähr einer großen Herausforderung gegenüber, die sie unterschiedlich angehen wollen. Die Patientin ist vom 6. Halswirbel ab gelähmt und weist schwere Verbrennungen auf. Diana spürt zwar keinen Schmerz, aber ihr Zeigefinger - der einzige Finger, den sie noch bewegen kann - ist beeinträchtigt. Während Ben und Elias ihre Meinungsverschiedenheit nur schlecht beiseitelegen können, bangt Diana um das letzte bisschen ihrer Lebensqualität. Werden ihr die Ärzte gemeinsam helfen können?
