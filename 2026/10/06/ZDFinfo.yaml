  description: |-
    Deutschland 2024
    Vom Immobilien-Clan zur einflussreichen Politdynastie? Seit Generationen streben die Trumps nach Macht und Anerkennung. Allen Skandalen zum Trotz könnten sie bald mächtiger sein als je zuvor.

    Donald Trump könnte im Herbst 2024 zum zweiten Mal US-Präsident werden. Kritiker befürchten noch mehr Spaltung, Chaos und das Ende der Demokratie. Und selbst, wenn er nicht gewinnt, dürfte die Trump-Ära dank seiner Kinder noch lange nicht zu Ende sein.
