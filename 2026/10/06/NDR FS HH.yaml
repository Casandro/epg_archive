  description: "Was einst als harmonische Partnerschaft zwischen Mensch und Tier galt, steht heute unter massivem Rechtfertigungsdruck. Immer neue Tierschutzskandale erschüttern die Reitszene. Fragwürdige Trainingsmethoden wie die Rollkur bis hin zu sichtbaren Schmerzen der Tiere auf Turnieren, werfen kein gutes Licht auf die Branche. \nDiese \"Sportclub Story\" liefert eine kontroverse wie hochaktuelle Bestandsaufnahme einer Branche im radikalen Wandel und zeigt schonungslos, dass der Reitsport sein System von Grund auf hinterfragen muss, wenn er überleben will."
