  description: Die Kölner Hauptkommissare Max Ballauf und Freddy Schenk werden zu einem Mordfall gerufen. Das 19-jährige, drogenabhängige Opfer ging auf den Straßenstrich, um ihre Sucht zu finanzieren. Aufgrund der vielen infrage kommenden Täter sind die Kommissare stark von der Laborauswertung der DNA-Spuren abhängig. Aber ausgerechnet in dieser Situation, in der sie dringend auf die Hilfe ihrer Kollegin Natalie Förster von der Kriminaltechnik angewiesen sind, ist die nicht richtig bei der Sache. Warum wirkt Natalie plötzlich so fahrig und scheint Ermittlungsergebnisse zu verschleppen?
- eventId: 711202
  start: 2026-10-06T21:30:00Z
  stop: 2026-10-06T22:00:00Z
  title: Weltbilder
  subtitle: Die Ärzte der Ägäis
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Seit 2014 entsendet die griechische Stavros-Niarchos-Stiftung monatlich mobile medizinische Teams auf entlegene Inseln. Auf Serifos errichten Augenarzt Christos Christoulakis und der technische Leiter Tasos Stamatiadis ein Pop-up-Krankenhaus, das die rund 1.500 Einwohner vier Tage lang mit verschiedenen Fachärzten versorgt. Manche Fälle, wie die Lähmungserscheinungen von Susanna Diogou, können allerdings nur auf dem Festland behandelt werden. Für ihre Familie bedeutet das eine lange Trennung - ein Dilemma, das viele Inselbewohner fürchten.
- eventId: 711203
  start: 2026-10-06T22:00:00Z
  stop: 2026-10-06T23:30:00Z
  title: Born to Be Wild - Eine Band namens Steppenwolf
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Steppenwolf ist eine der legendärsten und zugleich rätselhaftesten Bands in der Geschichte der Rockmusik. An der Grenze zwischen Mainstream und psychedelischem Underground eröffnete ihr Song \"Born To Be Wild\" den Kultfilm \"Easy Rider\" und wurde zur Hymne einer ganzen Generation. Was aber nur wenige Menschen wissen: Die Band Steppenwolf hatte als Gravitationszentrum zwei deutsche Auswandererkinder. \nDurch den Film wird auch die Musik von Steppenwolf wieder entdeckt. Die Band, deren Ruhm durch einen Song zementiert wurde, wird bis heute auf wenige Songs reduziert."
