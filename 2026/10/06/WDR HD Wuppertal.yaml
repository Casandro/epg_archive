  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: Am Rande eines Waldgebietes fahren nachts zwei Autos über einen Feldweg. Darin befinden sich der Frankfurter Ermittler Brix und weitere Polizeibeamte. Außerdem ein Verdächtiger, Anton Schilling, der zuvor zur Polizei gekommen ist und berichtet hat, dass der Polizist Simon Laby erschossen und am Waldrand vergraben wurde. Die Suche verläuft schwierig. Als man das Waldhaus Labys durchsucht und dort große Mengen an Essensvorräten, Waffen, Munition und ein falsches Polizeiauto entdeckt, bekommt der Fall eine ganz neue Dimension. Janneke vermutet schon bald, dass es bei der Suche in dieser einen Nacht nicht nur um einen Toten geht.
