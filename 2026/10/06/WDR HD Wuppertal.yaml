  title: Entführt - Der Usedom-Krimi
  subtitle: Fernsehfilm Deutschland 2021
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der erste Arbeitstag von Ellen Norgaard nach der Babypause endet mit einer Katastrophe: Ihr einjähriger Sohn Jesper wird aus der Obhut seiner Tagesmutter entführt. Kommissar Rainer Witt und Ex-Staatsanwältin Karin Lossow setzen alles in Bewegung, um das Kind zu finden. Ein Ermittlungsdetail bringt Karin auf die richtige Spur: Die Entführerin ist Patrizia, Ellens Mutter, die vor mehr als 30 Jahren spurlos verschwand. Karin und Patrizia waren in Jugendjahren enge Freundinnen.
    Im Zuge der Ermittlungen wird klar, dass Ellens Mutter erst kürzlich in der Psychiatrie war.
- eventId: 713238
  start: 2026-10-06T21:45:00Z
  stop: 2026-10-06T23:15:00Z
  title: Ungebetene Gäste - Der Usedom-Krimi
  subtitle: Fernsehfilm Deutschland 2021
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Es brennt auf Usedom: Karin Lossows Reetdachhaus steht in Flammen. Im letzten Moment kann sie sich mit Ellen Norgaards Hilfe aus dem Haus retten. Karin hat eine Rauchvergiftung erlitten und wird sofort ins Krankenhaus gebracht. In der Klinik freundet sie sich mit der ehemaligen Krankenschwester Saskia Bernard an, die von einem Auto angefahren und schwer verletzt wurde. Saskia war auf dem Weg zur Physiotherapie, als der Wagen sie erfasste. Die junge Frau erholt sich zwar schnell, doch an den Unfall erinnern kann sie sich nicht. Wagen und Fahrer sind spurlos verschwunden.'
