  title: Aus dem Leben
  description: "Bis 2024 moderiete Max Moor 17 Jahre lang das ARD-Kulturmagazin \"Titel, Thesen, Temperamente\". Jetzt hat der Moderator, Schauspieler und Sänger seinen ersten Roman geschrieben: \"Schwestern. Trotz allem!\". Darin erzählt er die Geschichte der drei Schwestern Gerti, Rudi und Hansi, die als Kinder nach dem Krieg voneinander getrennt werden und doch ein Leben lang nie ganz loslassen. Die Idee zu dem Roman lieferte die Familiengeschichte seiner Frau. \n\nHeute ist Max Moor zu Gast in unserer Sendung. Mit Gastgeber Uwe Jäger unterhält sich der Moderator, Schauspieler und Autor darüber, wie aus der Familiengeschichte seiner Frau sein erster Roman entstand. Außerdem verrät Max Moor, wie er Landwirt in Brandenburg wurde und warum er bis heute gerne auf dem Land lebt. \n\nDas Gespräch gibt es danach als Podcast auf sr3.de und in der ARD-Sounds-App.\n\n18:30 - 18:31 SR info Nachrichten um halb\n\n19:00 - 19:04 SR info Nachrichten"
  subtitle: mit dem Moderator, Schauspieler und Autor Max Moor
