  title: Doppelkopf
  subtitle: Am Tisch mit Bernhard Pörksen, Medienwissenschaftler
  description: Er ist jemand, für den die Art und Weise, wie wir miteinander reden und uns gegenseitig zuhören, die Grundlage seiner wissenschaftlichen Arbeit ist. Dabei ist Kommunikation für den Medienforscher Bernhard Pörksen nicht nur reine Informationsübertragung, sondern sie prägt, was wir Menschen für wahr, wichtig und relevant halten.
