  title: Mittagskonzert mit dem hr-Sinfonieorchester
  subtitle: Am 3. Oktober ist Steve Reich stolze 90 Jahre alt geworden. Wir gratulieren mit seiner monumentalen "Desert Music".
  description: Bei der cresc-Biennale für aktuelle Musik, die alle zwei Jahre vom hr-Sinfonieorchester und dem Ensemble Modern ausgerichtet wird, stand das Werk für Chor und Orchester auf dem Programm. Eine akustische Metapher für das, was die Wissenschaft "Schwarmverhalten" nennt.
