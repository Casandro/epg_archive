- eventId: 713028
  start: 2026-10-06T08:25:00Z
  stop: 2026-10-06T09:10:00Z
  title: Garten & Lecker
  subtitle: Gemüselust im Barockgarten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Es wird wieder gebuddelt, geschmückt und gefeiert. Der charmante Gartenwettbewerb geht in die nächste Runde. In diesem Jahr dreht sich alles um das Motto "Tief verwurzelt" - eine Hommage an die Verbundenheit mit der Natur und den regionalen Wurzeln.
    Die erste Reise geht nach Rheinhessen in den modernen Barockgarten der Künstlerin Iris Leonhardt in Westhofen. Auf rund 1000 Quadratmetern blühen Pfingstrosen, Schwertlilien und Zierlauch um die Wette. Für die behutsame Gestaltung und Restaurierung des Winzerhauses von 1770 und des dazugehörigen Gartens haben Iris und ihr Mann Jürgen keine Mühe gescheut.
- eventId: 713074
  start: 2026-10-06T09:10:00Z
  stop: 2026-10-06T09:55:00Z
  title: 'Expedition in die Heimat: Verwunschene Orte im Hunsrück'
  subtitle: 'Moderation: Anna Lena Dörr'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Manche Orte strahlen besonderen Zauber aus, zwischen Erhabenheit und Melancholie. Sie liegen im Dornröschenschlaf, wurden vom Trubel der Zeit scheinbar vergessen und dem Verfall überlassen. Doch der Schein trügt, denn es sind Orte des Übergangs. In ihnen schlummert vergangenes und künftiges Leben. Solche Orte besucht SWR-Moderatorin Anna Lena Dörr auf ihrer Expedition durch den Hunsrück.
