  description: "In Zeiten angespannter Energiemärkte: Hinter den Kulissen der Windkraft \nNicht nur im Zuge des Klimawandels, sondern auch der ständig schwankenden Energie-, Gas und Ölpreise, werden Stimmen laut für den Umstieg auf erneuerbare Energien. Das ist derzeit bekanntlich vor allem durch Windräder und Solarenergie möglich. Doch auf der anderen Seite hagelt es Kritik. Der Bau von Windrädern zerstört in Teilen die Natur und zu laut seien sie zudem auch. Aufklärung hierzu bieten Windradbesichtigungen. Wir haben uns einer in Moosthann angeschlossen.\n\nVerstärkung für den Ernstfall: Neue Feuerwehrfahrzeuge für Ergolding und Piflas\nOb Brand, Unfall oder technische Hilfeleistung. Die Feuerwehr muss sich nicht nur auf die Kollegen verlassen können, sondern auch auf die Fahrzeuge. Für die Feuerwehren in Ergolding und Piflas gibt es deshalb jetzt moderne Unterstützung. Rund 1,6 Millionen Euro wurden in drei neue Einsatzfahrzeuge investiert und sind nach der Fahrzeugweihe vergangenen Sonntag bereit für ihren ersten Einsatz.  \n\nZu spät aufgewacht: EV Landshut unterliegt Dresden mit 2:5\nDas Wechselspielchen zwischen Sieg und Niederlage ging auch am dritten Spielwochenende der DEL2 weiter für den EV Landshut. Diesmal folgte einem Auswärtssieg in Freiburg eine Heimniederlage gegen DEL-Absteiger Dresden."
