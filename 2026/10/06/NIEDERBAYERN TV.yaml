  description: "Geheimnis gelüftet - Kanadischer Weltstar kommt nach Deggendorf \nGut vier Jahre ist es her, dass beim Deggendorfer Donaufestival Tausende Fans mit ihren Stars gefeiert haben. Jetzt steht fest: Im nächsten Sommer gibt es eine Neuauflage. Und dabei könnte ein Hauch vom Summer of 69 durch Niederbayern wehen. Wann genau gefeiert wird und welcher Weltstar auf der Bühne steht, haben die Veranstalter heute bei einer Pressekonferenz verraten.\n\nGenuss in vielerlei Hinsicht - Open your Mouth, Eyes & Ears in Straubing\nEs gibt Events, bei denen eindeutig klar ist, worum es geht. Bei einem Konzert genießt man die Musik, in der Galerie bestaunt man die Kunst und im Restaurant frönt man den Gaumenfreuden. Bei Open your Mouth, Eyes & Ears in der Karmeliten-Brauerie in Straubing kam alles zusammen. Genuss an allen Fronten. Dass dieses Prinzip ganz hervorragend funktioniert, davon überzeugten sich am Samstag zahlreiche vergnügungshungrige Besucher. Und wir wollten uns den Leckerbissen auch nicht entgehen lassen.\n\nVierter Sieg in Folge - Straubing gewinnt auch in Schwenningen\nDie Straubing Tigers haben ihr erstes 6-Punkte-Wochenende der noch jungen Saison gefeiert und ihre aufstrebende Form bestätigt. Auf den 4:3-Heimsieg am Freitag gegen Bremerhaven folgte am Sonntag ein 4:2 in Schwenningen. Den Grundstein für den Auswärtserfolg legten die Tigers bereits im ersten Drittel."
