  description: In diesem rührenden Film kämpft der junge Heintje für die Liebe und Hoffnung in schweren Zeiten. Als er erfährt, dass seine Familie in Not ist, setzt er alles daran, sie zu unterstützen. Mit seiner einzigartigen Stimme und seinem unerschütterlichen Glauben an eine bessere Zukunft bringt er Licht in die Dunkelheit. Ein bewegendes Musical voller Emotionen, das zeigt, dass nach jedem Sturm die Sonne wieder scheinen wird.
