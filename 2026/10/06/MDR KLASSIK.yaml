    Niels Wilhelm Gade: Sinfonie Nr. 4 B-Dur, Finale (Sinfonieorchester des Dänischen Rundfunks: Christopher Hogwood); Johann Franz Xaver Sterkel: Klavierkonzert D-Dur, Allegro, op. 26, Nr. 1 (Yorck Kronenberg, Klavier; Capriccio: Dominik Kiefer); Ethel Smyth: Suite, Allegro con moto, op. 1 a (Südwestdeutsches Kammerorchester Pforzheim: Douglas Bostock); Johann Strauss: "Morgenblätter", op. 279 (Wiener Philharmoniker: Willi Boskovsky); Trevor Duncan: "A Little Suite" (Radio-Sinfonieorchester Bratislava: Andrew Penny); Georg Friedrich Händel: Orgelkonzert A-Dur, Allegro, HWV 307 (Ragna Schirmer, Klavier; Ensemble Dacuore)
