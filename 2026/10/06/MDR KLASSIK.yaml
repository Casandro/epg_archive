    4.03  Das ARD-Nachtkonzert (III)

    Leopold Carl Wolf: Streicherserenade F-Dur, op. 30 (Südwestdeutsches Kammerorchester Pforzheim: Vladislav Czarnecki); Antonín Dvorák: Sonate G-Dur, op. 100 (Pavel Sporcl, Violine; Petr Jiríkovsk_, Klavier); Domenico Scarlatti: "Les femmes de bonne humeur" (Deutsche Radio Philharmonie Saarbrücken Kaiserslautern: Robert Reimer)

