  title: MDR KLASSIK - Neue Musik
  description: "Neue Musik aktuell\n\n\"Jost in Time\"\nUm die Geschichten hinter den Noten geht es in unserer Reihe  \"Jost in Time\" mit dem namhaften Komponisten und Dirigenten Christian Jost. \nWas hat die Komponistinnen und Komponisten umgetrieben? Welche Überraschungen sind erst beim genauen Hören zu entdecken? \nUnd was haben die ausgewählten Werke aus dem 20. und 21. Jahrhundert mit uns heute zu tun? \nIm Gespräch mit der Musikjournalistin Friederike Westerhaus ist Christian Jost am Puls der Zeit. Dabei kreist jede Folge um ein Thema.\n\nIn Folge 8:  Verbindende Welten\nVerschiedene Welten kommen im Schaffen von Qigang Chen zusammen, eines der führenden Komponisten Chinas, der im August 2026 seinen 75. Geburtstag feiert. \nBei ihm treffen traditionelle chinesische Einflüsse auf westliche klassische Musik, wie in dem 1996 komponierten Cellokonzert \"Reflet d'un temps disparu\" (Reflexion einer vergangenen Zeit)."
