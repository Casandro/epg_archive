  title: MDR KLASSIK - Kombo
  description: "Kombo mit Charlotte Oelschlegel / NDR\n\nDie Singer-Songwriterin und Bratschistin Nina Kazourian teilt ihr Rezept für ein französisches Gratin Dauphinois.\nWenn bei Nina Kazourian Heimweh nach Frankreich aufkommt, gibt es ein Gericht, das sie gedanklich sofort zurück nach Frankreich bringt: Gratin Dauphinois.\nDie Singer-Songwriterin und Bratschistin lebt seit über 10 Jahren in Deutschland. Aber gegen aufkommendes Heimweh hilft französische Musik von Yves Montand oder Claude Nougaro und etwas zu Essen aus der Kindheit. In dieser Ausgabe teil die Musikerin ihr Rezept. Das Gratin eignet sich als Beilage zu Fleisch oder Geflügel, aber auch als vegetarische Hauptspeise mit grünem Salat.\n\n\nGratin Dauphinois\nZutaten (Für 4-6 Portionen)\n\nca. 1,2 kg festkochende Kartoffeln\n2 Knoblauchzehen\nButter für die Form\nSalz\nSchwarzer Pfeffer\nFrisch geriebene Muskatnuss\nca. 300 ml Milch\nca. 300 ml Sahne (Rahm)\nZubereitung\nBackofen auf 150 °C vorheizen. Kartoffeln schälen, waschen und in sehr feine Scheiben schneiden. Wichtig: Die Kartoffelscheiben nach dem Schneiden nicht mehr waschen, sonst verliert das Gratin seine Cremigkeit.\n\nDie Knoblauchzehen halbieren und die Auflaufform großzügig damit ausreiben. Anschließend gut buttern.\n\nEine erste Schicht Kartoffeln flach in die Form legen. Mit Salz, Pfeffer und etwas Muskat würzen. Weitere Schichten genauso aufbauen, bis die Form ganz gefüllt ist.\n\nMilch und Sahne mischen und so viel angießen, dass die Kartoffeln gerade bedeckt sind.\n\nDas Gratin bei 150 °C für 21/2 bis 3 Stunden im Ofen garen. Die niedrige Temperatur ist entscheidend - nur so verbinden sich die Aromen vollständig.\n\nServieren\nBesonders gut passt Gratin Dauphinois zu Fleisch oder Geflügel. \nAls Hauptgericht empfiehlt Nina einen grünen Salat mit Walnussöl dazu. \nEin Glas Côtes du Rhône oder ein leichter Pinot Noir rundet das Essen ab.\n\nZum Abschluss dürfen französische Käse nicht fehlen - zum Beispiel Saint-Félicien oder Roquefort. \nEin Gericht wie ein Zuhause auf dem Teller. \nBon appétit."
