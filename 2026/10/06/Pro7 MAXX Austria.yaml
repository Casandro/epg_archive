  description: |-
    Da Peter und Lois auf keinen Fall noch einmal Nachwuchs erhalten möchten, unterzieht sich Peter einer Vasektomie. Doch der Eingriff schlägt sich negativ auf seinen Sexualtrieb nieder, was bei seiner Ehefrau zu Frustrationen führt. Und diese kompensiert Lois mit exzessivem Essen. Stewie befindet sich währenddessen im Krieg mit seinem Halbbruder Bertram - denn beide möchten unbedingt Herrscher über den Spielplatz sein.

