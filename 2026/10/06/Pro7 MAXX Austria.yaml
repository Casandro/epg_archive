    Drei uralte Geschichten
    Comedy, USA 2002
    Altersfreigabe: ab 12
    (WH vom Dienstag, 06.10.2026, 21:40 Uhr)
  description: |-
    Eines schönen Tages liest Homer seiner Familie aus einem Buch Geschichten vor, mit deren Hauptfiguren sich die Simpsons gut identifizieren können. In ihrer Fantasie nehmen sie den Platz der Protagonisten ein: So erlebt Homer zum Beispiel die spannenden Abenteuer des Odysseus, während Lisa in die Rolle der legendären französischen Nationalheldin Jeanne d'Arc schlüpft und Bart den Hamlet gibt.

    Regie: Mike B. Anderson
    Drehbuch: Matt Warburton, Don Payne, Josh Lieb, Andrew Kreisberg
    Komponist: Alf Clausen
    Animation: Reid Kramer, Eric Loudon
