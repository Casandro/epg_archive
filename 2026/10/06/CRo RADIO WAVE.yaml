  title: Podhoubí
  description: 'Co s námi udělá les sežraný kůrovcem? A proč nás ta mladá smrčina, která ho nahradila, také znepokojuje? Filosofka Eliška Fulínová a ilustrátorka Magdalena Gurská se v živé epizodě Podhoubí z Mezinárodního festivalu ilustrace a komiksu, setkaly nad otázkou, která spojuje estetiku, vědu i každodenní zkušenost: jak vlastně vnímáme krajinu, která se kolem nás mění? (repríza)'
- eventId:
  - 1485929
  - 1486988
  start: 2026-10-06T16:00:00Z
  stop: 2026-10-06T17:00:00Z
  title: Šatníky
  description: Šatníky přináší příběhy módy z českých skříní a ulic. Poslechněte si, co se skutečně nosí a proč. Hledáme odpovědi na to, co dnes móda pro lidi znamená, jakou má hodnotu a co o nás prozrazuje. Za poklady ze skříní zajímavých osobností vás každé úterý od 18:00 zavede Veronika Ruppert a Veronika Dušková.
- eventId:
  - 1485930
  - 1486989
  start: 2026-10-06T17:00:00Z
  stop: 2026-10-06T17:30:00Z
  title: Nádech
  description: Nudu? Raději elektrický šok. Podle známého výzkumu si spoustu lidí spíš dá elektrický šok, než aby byli 15 minut se svými myšlenkami. Proč je nuda tak nepříjemná? A nedá se na ni náhodou dívat nějak jinak? Na to odpovídá v novém Nádechu sociální psycholožka Iva Poláčková Šolcová. Podle ní je nuda mimořádně důležitá - mozek totiž začne vytvářet nové myšlenky a začne být kreativní. (repríza)
