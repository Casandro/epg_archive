  - '16'
  description: 'Gottfried Häberle schmückt den Weihnachtsbaum, als die Nachricht wie eine Bombe einschlägt: Maria kommt heim! Durch ihren schweren Autounfall hat sie ihren Sohn vergessen und soll keineswegs an ihn erinnert werden. Deshalb muss Christine Rossbauer, die inzwischen bei den Häberles wohnt, schleunigst eine neue Bleibe für das "Bobbele" Thadäus finden. Elisabeth Rossbauer und Sohn Karl brauchen derweil noch 20.000 Euro, damit sie ihren Hof in drei Tagen zurück ersteigern können. Die Lage wird für Elisabeth ganz verzweifelt, als Kommissarin Emma Erdmann sich beim Pfarrer einquartiert. Vorgeblich um Urlaub zu machen.'
