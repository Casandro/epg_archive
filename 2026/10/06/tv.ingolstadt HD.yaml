  title: TierZuLiebe vom 02.10.2026 (Wh.)
  subtitle: 1000 km für den Tierschutzverein Limes eV - Ben Geuernich läuft einmal quer durch Spanien
  description: 'TierZuLiebe trifft sich Manuela Müller in der aktuellen Folge unter anderem mit einem Ultra-Marathonläufer aus Pfaffenhofen. Ben Geuenich will einmal quer durch Spanien laufen und dabei Spenden für den Tierschutzverein Limes eV sammeln. Das Ziel: 10.000 _ für 1000 km. Damit soll das Leid der Straßenhunde in Rumänien weiter bekämpft werden. Ein solcher Hund aus Rumänien ist auch Betty. Die einjährige Hundedame sucht ein neues Zuhause.'
- eventId: 1278490
  start: 2026-10-06T12:00:00Z
  stop: 2026-10-06T12:45:00Z
  title: MITTENDRIN mit Corinna Binzer (Wh.)
  subtitle: Menschen - Miteinander - Meinungen
  description: Corinna Binzer - ganz nah dran an den bewegenden Geschichten von Menschen, die im Verborgenen ihrer Heimatstadt leben. Geschichten, die berühren, inspirieren und viel zu wertvoll sind, um unentdeckt zu bleiben. Sie gehören vor die Kamera - und erzählt.
- eventId: 1278491
  start: 2026-10-06T12:45:00Z
  stop: 2026-10-06T13:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 1278492
  start: 2026-10-06T13:00:00Z
  stop: 2026-10-06T13:45:00Z
