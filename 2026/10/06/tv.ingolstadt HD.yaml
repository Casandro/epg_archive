  title: Nachgefragt vom 05.10.2026 (Wh.)
  subtitle: Nachgefragt bei Marc Grandmontagne
  description: Die Ingolstädter Kulturlandschaft kämpft sich durch die Haushaltskrise der Stadt. Zugleich fordern die schlechten Pisa-Ergebnisse Reformen in der Bildung, auch auf kommunaler Ebene. All dies läuft in Ingolstadt bei Marc Grandmontagne zusammen, dem Referenten für Kultur und Bildung. Bei Nachgefragt spricht Michelle Milewski mit ihm über die Herausforderungen, aber auch über die Chancen, die daraus entstehen.
