  title: Halloweentown - Meine Oma ist 'ne Hexe
  subtitle: Fantasyabenteuer, USA 1998
  description: 'Regie: Duwayne Dunham. Darsteller: Debbie Reynolds, Kimberly J. Brown, Judith Hoag. Der 13. Geburtstag wird für Marnie ein ganz besonderer Tag. Denn per Zufall erfährt sie, dass sie magische Kräfte besitzt. Und damit nicht genug. Marnie findet obendrein heraus, dass sie einer uralten Familie von Hexen und Magiern entstammt. Das muss das Mädchen erst einmal verdauen. Um mehr über ihre Vorfahren herauszubekommen, will sie ihre Großmutter Aggie, die ebenfalls eine Hexe ist, besuchen. Natürlich ist Marnies Mutter ganz und gar dagegen. Doch das schert Marnie kein bisschen. Gegen Mamas Willen reist sie mit ihren Geschwistern nach Halloweentown, wo ihre Großmutter wohnt. In dem entzückenden kleinen Städtchen leben Hexen, Vampire, Zwerge und allerlei wunderliche Gestalten einträchtig nebeneinander. Dort beginnt für die Kinder ein Abenteuer voller Magie und Gefahren, denn ein böser Dämon bedroht die Stadt und ihre Bewohner ...'
  widescreen: true
