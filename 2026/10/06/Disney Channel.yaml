  title: Scrubs - Die Anfänger
  subtitle: Meine kniffligste Entscheidung Comedy-Serie, USA 2004
  description: Folge 65, Obwohl Elliot mit Sean zusammen ist, kommt J.D. nicht von ihr los. Nachdem er wieder einmal mit ihr geschlafen hat und ihr versprechen musste, Sean nichts zu verraten, tröstet er sich mit seiner Exfreundin Danni - obwohl die ihm immer stärker auf die Nerven geht. Sean jedoch merkt, dass etwas nicht stimmt und fragt J.D. direkt, ob etwas zwischen ihm und Elliot läuft... Währenddessen wird der Hausmeister zum Sicherheitsdienst befördert und geht mit Übereifer an die neue Arbeit.
- eventId: 1448091
  start: 2026-10-06T22:25:00Z
  stop: 2026-10-06T22:55:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine wahren Gefühle Comedy-Serie, USA 2004
  description: 'Folge 66, Dr. Cox kämpft gegen Kelsos Pläne, im "Sacred Heart" Ganzkörpertomographien anzubieten, und gegen einen Hypochonder, der sich dieser Untersuchung unbedingt unterziehen will. J.D. versucht sich inzwischen zu beweisen, dass Dannis Einschätzung, er wolle nur das Unerreichbare und sei sich über seine wahren Gefühle gar nicht im Klaren, falsch ist. Als Elliot und Sean zusammenziehen wollen, scheint J. D. endlich zu erkennen, was er will: Er gesteht Elliot seine Liebe.'
