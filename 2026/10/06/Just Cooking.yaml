  stop: 2026-10-06T14:04:00Z
  title: Mein wunderbarer Kochsalon - Chicken Nuggets
  subtitle: Mein wunderbarer Kochsalon - Chicken Nuggets
  description: Meine armen Kinder bekommen von mir immer ein Fast-Food-Veto serviert, dazu ihren Lieblingsjunk homemade. Von Burgern über Hotdogs bis zu Nuggets bekommen sie zumindest eine Idee von den Klassikern der amerikanischen Imbissküche. Anfangs waren die Zweifel groß - "Mami, ganz ehrlich, aber so gut wie McD bekommst du das nie im Leben hin." Bis ich kombiniert hatte, wer hinter McD steckt, hatte ich schon den Philips Airfryer angeworfen und Bio-Hühnerfiletstücke in Mehl, Ei und Pankobröseln gewälzt. Das Ergebnis war jedem Zweifel erhaben - saftiges Fleisch, knusprige Hülle. So geht Fast Food. AT 2021
- eventId: 1446417
  start: 2026-10-06T14:05:00Z
  stop: 2026-10-06T14:10:00Z
  title: Mein wunderbarer Kochsalon - Wolfsbarsch mit Pilzen und Miso-Sauce
  subtitle: Mein wunderbarer Kochsalon - Wolfsbarsch mit Pilzen und Miso-Sauce
  description: Immer wieder kaufe ich mir eine Packung Miso, die dann im hintersten Winkel meines Kühlschranks auf bessere Zeiten wartet. Die Ambition ist größer als das Know how, was man damit alles machen kann. Daher fragte ich Executive Chef Demir Babali vom Restaurant One of one (Seilerstätte 16, 1010 Wien) nach Ideen, die ich in meiner Hausfrauenküche leicht umsetzen kann. Als er mir schrieb, "wir können doch Wolfsbarsch mit gemischten Pilzen und Miso-Sauce kochen", dachte ich mir vorurteilsgebeutelt, dass man dafür einen Laufmeter Mise-en-place benötigt, an der ich eine Woche arbeite. Aber nicht die Spur, es war eines der einfachsten Gerichte, die ich je mit einem Koch im Kochsalon gekocht habe. Und eines der besten. AT 2021
- eventId: 1446418
  start: 2026-10-06T14:10:00Z
  stop: 2026-10-06T14:15:00Z
  title: Mein wunderbarer Kochsalon - Currynudeln mit gebratenem Schweinefilet
  subtitle: Mein wunderbarer Kochsalon - Currynudeln mit gebratenem Schweinefilet
  description: |-
    Meine Kinder lieben gebratene Nudeln mit Gemüse und Ei. Jawohl, richtig, mit Gemüse. Aber in Begleitung von Nudeln geht fast alles. Statt den Lieferservice erneut zu bemühen, haben wir kürzlich dieses Rezept aus dem Fundus der Thermomix-App Cookidoo ausprobiert. Es ist zwar vom Konzept etwas anders als die klassischen gebratenen Nudeln, weil diese hier in einer Currysauce und mit gebratenem Schweinefleisch gemacht werden, aber so waren sie uns noch viel lieber. Fazit: nie wieder Lieferservice, wenn es um asiatische Nudeln geht.

    PS: Ich habe mit den Asia-Nudeln aus dem Supermarkt immer ein gewisses al-dente-Problem, daher habe ich sie mit italienischen Tagliatelle gemacht. Sind mir lieber, aber das ist Geschmackssache. AT 2021
