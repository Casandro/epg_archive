  title: Faraway Village - Lavendelsirup
  subtitle: Faraway Village - Lavendelsirup
  description: Wilder Lavendel wird geerntet und zu Lavendelsirup verarbeitet, der so lange geköchelt wird, bis er aromatisch und cremig ist. Anschließend wird er abgekühlt und zum Aromatisieren von Getränken verwendet. So entsteht ein duftender, blumiger Sirup, der direkt serviert werden kann. AZ 2025
