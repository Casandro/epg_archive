  title: Die besten Köche der Welt - Zu Gast im Ikarus - Prin Polsuk Nahm aus Bangkok
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Prin Polsuk Nahm aus Bangkok
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Head Chef Prin Polsuk beweist, dass Ethno-Kuche und Haute Cuisine kein Widerspruch sein müssen. Direkt am Pool eines Bangkoker Luxushotels gelegen, begeistert Prin Polsuks in seinem Restaurant Nahm die Gäste mit unverfälschter Thai-Cuisine. Die komplexen Rezepte stammen aus uralten Kochbüchern oder auch direkt aus den Küchen des thailändischen Königshauses. Martin Klein, der Executive Chef des Restaurants Ikarus im Salzburger Hangar- 7, reist persönlich nach Bangkok, um dort die Welt der gestampften Currypasten und der exotischen Zutaten zu studieren. Gemeinsam mit Prin Polsuk will er einen Monat lang die Gäste des Ikarus in Salzburg mit einem thailändischen Menü begeistern. AT 2016'
- eventId: 1446105
  start: 2026-10-06T19:10:00Z
  stop: 2026-10-06T19:57:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Couillon aus Noirmoutier en ile
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Alexandre Couillon aus Noirmoutier en ile
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Mit gerade einmal 22 Jahren übernahm Alexandre Couillon mit seiner Frau Céline das elterliche Restaurant im französischen Île de Noirmoutier - und machte aus ihm einen mit zwei Sternen ausgezeichneten Gourmettempel. Die starke Verankerung zu seiner Region gepaart mit seiner unersättlichen Neugier sind seit Anbeginn Couillons Markenzeichen: Die Gäste im La Marine genießen den Fisch, Muscheln und Krustentiere á la minute auf dem Teller und somit in einer Frische, die ihresgleichen sucht. Genau darin besteht die Herausforderung für Ikarus Executive Chef Martin Klein und seiner Küchencrew: Die saisonal bedingten Meisterwerke Couillons so exakt und frisch wie möglich auf die Teller zu bringen. Zudem wird der französische Sternekoch zum kulinarischen Experiment herausgefordert: Beim Kirchenwirt in Leogang trifft er auf das Geschwisterpaar Barbara und Hans-Jörg Unterrainer und deren Küchenchef Harald Rindler. Dabei wird Alexandre Couillon sein Wissen über Wild aus eigener Jagd unter Beweis stellen müssen. Alexandre Couillon ist Zweisternekoch. Er lebt an der französischen Atlantikinsel Île de Noirmoutier - Irgendwo im Nirgendwo-und verwandelt diese zu einem Hotspot für die französische Haute Cuisine. Der ehemalige Schüler von Michel Guérard und Thierry Marx nimmt einen modernen, geradlinigen Kurs auf die französische Küche. Er serviert vorwiegend herrlich frischen Fisch und Meeresfrüchte. Das Kochen ist seine Art der Kunst- so sagt er.   AT 2016'
- eventId: 1446106
  start: 2026-10-06T20:00:00Z
  stop: 2026-10-06T20:47:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - 75 Jahre Eckart Witzigmann
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - 75 Jahre Eckart Witzigmann
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Kaum einer hat die Geschichte der Haute Cuisine in Deutschland und Österreich so geprägt wie der Jahrhundertkoch Eckart Witzigmann. Der gebürtige Bad Gasteiner ist der erste, der in Deutschland drei Michelin-Sterne erkocht hat, in seiner Küche lernt die heutige Elite des Fine Dining ihr Handwerk. Anlässlich seines Geburtstags bündeln die besten davon ihre Kräfte und stellen zu Ehren ihres Lehrmeisters das ultimative Menü zusammen. Sechs Sterneköche aus Deutschland, Österreich und Frankreich steuern jeweils ein Lieblingsgericht bei. Für Martin Klein bedeutet das alles: Roadtrip! Er besucht jeden einzelnen von ihnen in seinem Restaurant, um die perfekte Zubereitung der vielen Lieblingsgerichte zu erlernen - für das große Geburtstags-Menü im Hangar 7. AT 2016'
