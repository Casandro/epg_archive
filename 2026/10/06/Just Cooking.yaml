  title: Die besten Köche der Welt - Zu Gast im Ikarus - Christophe Hardiquest
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Christophe Hardiquest
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein besucht Christophe Hardiquest in Brüssel! In seinem Restaurant Bon Bon zelebriert der Starkoch regionale belgische Traditionen auf völlig neue Art, vom hauseigenen Bier bis zum Pony Entrecote. Brüssel - Hauptstadt, Handelsmetropole, Hotspot für Gastronomen! Die reiche belgische Genusskultur ist der Fundus aus dem sich Christophe Hardiquest bedient, um exquisite Menüs mit regionaler Identität zu kreieren. Der Chef des Zwei-Sterne-Restaurants Bon Bon lässt sich von allem inspirieren, was die Kapitale zu bieten hat, von der Pommesbude bis zur Bierbrauerei. Martin Klein, Executive Chef des Hangar-7, lädt den Belgier ein seine Küche in Salzburg zu präsentieren. Um diese Kooperation vorzubereiten, erkunden die beiden gemeinsam die Hauptstadt auf der Suche nach den besten Zutaten, Inspiration und einem guten Stück Pferdefleisch. AT 2019'
- eventId: 1446091
  start: 2026-10-06T14:45:00Z
  stop: 2026-10-06T15:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Hiroyasu Kawate
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Hiroyasu Kawate
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ikarus-Executive Chef Martin Klein besucht Zwei-Sterne-Koch Hiroyasu Kawate in Tokio, um dessen Rezepte zu studieren und sein kulinarisches Umfeld zu erforschen. Premiere für Martin Klein! Diese Gastkochreise führt ihn zum allerersten Mal nach Japan. In Tokio erwartet ihn Zwei-Sterne-Koch Hiroyasu Kawate in seinem Restaurant Florilège. Der französische Klang dieses Namens kommt nicht von ungefähr: Chef Kawate erweist sich als überaus frankophiler Koch. Aber Martin Klein stellt fest, dass die japanischen Einflüsse unübersehbar sind - und zeigt sich begeistert von Hiroyasu Kawates einfallsreichen Kreationen. Dabei lernt selbst der erfahrene Koch aus Salzburg noch Produkte kennen, die er noch nie im Leben gesehen oder geschmeckt hat. Neben diesem ereignisreichen Austausch zweier Küchenkulturen gibt es noch weitere Highlights zu sehen: Um sein französisches Konzept stimmig umzusetzen, lässt Chef Kawate sogar seine Weingläser in einer traditionsreichen Glasfabrik in Chiba maßfertigen. Und Martin Klein erfüllt sich mit einem Besuch der legendären Thunfischauktion am Toyosu Markt einen langgehegten Wunschtraum! Ikarus in Japan - eine Reise, die zu den kulinarischen Highlights des Jahres gezählt werden muß. AT 2019'
- eventId: 1446095
  start: 2026-10-06T15:15:00Z
  stop: 2026-10-06T15:40:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Georgianna Hliadaki & Nick Roussos
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Georgianna Hliadaki & Nick Roussos
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein besucht die Speerspitze der innovativen griechischen Küche. In Athen erforscht er, mit welchen Überraschungen und besonderen Zutaten die Mittelmeerküche aufwartet. Athen - Wiege von Demokratie, Philosphie, Theater und, wenn es nach dem Guide Michelin geht, auch von höchst innovativer Mittelmeerküche. Mit dem Funky Gourmet haben die Geschäfts- und Lebenspartner Giorgianna Hiliadakis und Nick Roussos einen neuen Zwei-Sterne-Tempel in der griechischen Hauptstadt erschaffen, in dem hellenische Klassiker dekonstruiert werden: der griechische Salat kommt als weißes Eisklümpchen daher, als Hauptgang wird die traditionelle griechische Zutat Lammhirn serviert. Martin Klein reist nach Athen, um die beiden Köche kennenzulernen, ihre von der Molekularküche inspirierten Rezepte zu studieren, und ungewöhnliche Zutaten zu erforschen, etwa Bottarga, gesalzenen und gehärteten Fischrogen. Wie wird der Ikarus-Executive Chef diese tief in Griechenland verwurzelte Küche einen Monat lang im Hangar-7 umsetzen? AT 2019'
