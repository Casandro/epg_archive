  title: Mimilicious - Pavlova
  subtitle: Mimilicious - Pavlova
  description: "Mimilicious: Heute zeige ich euch ein super erfrischendes Dessert, Pavlova. Perfekt um noch die letzten Sommertage auszukosten, einfach und schnell gemacht und eines meiner absoluten Lieblingstorten.  Ich liebe es Pavlova zu servieren, weil es immer wahnsinnig viel her macht und super cool ausschaut. Außerdem, wie könnte es anders sein, ist es kein Hexenwerk und ziemlich einfach zu machen. \nKurze Facts für die, die nicht wissen was diese Nachspeise eigentlich ist: ;) Pavlova ist ein Nationalgericht aus Australien und Neuseeland und besteht hauptsächlich aus einer Baisermasse, die einen weichen Kern und eine Knusprige Kruste hat. Getoppt wird das Ganze mit Sahne und Beeren und ist einfach köstlich!\n DE 2018"
