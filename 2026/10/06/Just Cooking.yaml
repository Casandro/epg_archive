  title: Mein wunderbarer Kochsalon - Gnocchi mitgemischten Pilzen
  subtitle: Mein wunderbarer Kochsalon - Gnocchi mitgemischten Pilzen
  description: In meiner Kindheit waren Pilze extrem saisonal, klein, gelb und selbst geklaubt. Jawohl, lange Zeit dachte ich, Pilze sind ein anderes Wort für Eierschwammerln und wurde erst Jahre später eines Besseren gelehrt. Heute gehören Schwammerln in allen Farben und Formen als fixer Bestandteil in meine Küche - klassisch als Ragout zum Naturschnitzel oder getrocknet als Umamibombe in meiner Linsen-Bolognese. Nun habe ich eine neue Quelle entdeckt, lustigerweise nicht auf einem wildromantischen Waldbauernhof mit einem knorrigen Pilzprofessor, sondern bei zwei coolen (halb)jungen Männern aus der Praterstraße in Wien. Die Pilzbrüder zu Gast im Kochsalon. AT 2020
- eventId: 1446365
  start: 2026-10-06T03:30:00Z
  stop: 2026-10-06T03:37:00Z
  title: Mein wunderbarer Kochsalon - Schweinsbratwürste Caprese
  subtitle: Mein wunderbarer Kochsalon - Schweinsbratwürste Caprese
  description: Was macht frau, wenn es regnet, die Kinder in der Schule sind und das Baby schläft? Maniküre, Buch lesen, Belege sortieren, die zu engen Jeans endlich rausschmeißen? Nein, frau macht Würste. Weil sie das schon immer einmal probieren wollte und weil beim neuen Kenwood-Fleischwolf ein kurzzeitig undefinierbares Teil dabei war, das sich als Wurstfüllstutzen herausstellte. Genau genommen wurden es Schweinsbratwürste Caprese, meine Art Käsekrainer mit Mozzarellawürfeln und getrockneten Tomaten. Noch nie hat mir eine Wurst so gut geschmeckt. Was sicher auch am Rezept lag, aber vor allem an der bezwungenen Hürde. Und dem Wurstfüllstutzen. Ich mag dieses Wort irgendwie. AT 2021
- eventId: 1446366
  start: 2026-10-06T03:40:00Z
  stop: 2026-10-06T03:49:00Z
  title: Mein wunderbarer Kochsalon - Maki mit Garnelen-Tempura
  subtitle: Mein wunderbarer Kochsalon - Maki mit Garnelen-Tempura
  description: 'Wenn ich meiner Tochter Lilly eine Freude machen möchte, mache ich Maki. "Mache ich" bedeutet in diesem Fall "bestelle ich". Bei aller Liebe zu den delikaten, gefüllten Reisrollen habe ich noch nie selbst Hand angelegt, ich fand immer, andere können das besser und sah keine Notwendigkeit darin, mir die Arbeit anzutun. Bis ich Demir Babali traf. Er ist Exekutive Chef der Dots-Gruppe und gewährte mir in der Küche des Restaurants One-of-one (Seilerstätte 16, 1010 Wien) wesentliche Einblicke in das Makiversum. Und ich muss zugeben: Ich bin bekehrt - man kann mehr oder weniger alles in die Rolle packen, was der Vorrat hergibt und es schmeckt immer sensationell. Solange man ein paar wichtige Tricks beherrscht.  AT 2021'
