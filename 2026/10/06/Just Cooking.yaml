  title: Mein wunderbarer Kochsalon - Halloumi-Karotten-Fritters
  subtitle: Mein wunderbarer Kochsalon - Halloumi-Karotten-Fritters
  description: Wenn sich die Familie im Sommer hemmungslos Würstel und Koteletts auf den Grill legt, werde ich mit Halloumi kreativ. Der würzige Quietschkäse wird dann mit Paradeiser-Avocado-Salsa oder im Burger mit Zwiebel-Chili-Relish zum Objekt der Begierde, aber ich weigere mich meistens, zu teilen. Die Halloumi-Frequenz sinkt mit den Temperaturen. Schade eigentlich, dachte ich kürzlich, und rieb ihn mit Karotten und formte sie zu kleinen Laibchen. Ab in den Airfryer und ich hatte das perfekte Upgrade für meinen Salat. Der Mann snackte die Fritters zum Fernsehen und Louis wollte Nudeln dazu. Aber das war klar. AT 2021
- eventId: 1446392
  start: 2026-10-06T06:40:00Z
  stop: 2026-10-06T06:45:00Z
  title: Mein wunderbarer Kochsalon - Chili con Carne
  subtitle: Mein wunderbarer Kochsalon - Chili con Carne
  description: Wenn ich meinem Sohn Louis eine Freude machen möchten (was natürlich eigentlich ständig der Fall ist), aber die Pasta wegen schwerer Wiederholungstat verweigere, landen wir mit dem Kompromiss meistens beim Cowboysklassiker, einem leicht scharfen Chili con carne. Ich schätze vor allem die große Unkompliziertheit, alles in den Topf und köcheln lassen. Louis das knusprige Weißbrot, das in die kleinste Rille des Tellers auch den letzten Rese der Sauce erwischt und den touch an Schärfe. Am einfachsten gelingt das Chili im Thermomix, er schneidet gleich alles zurecht, der Rest kommt hinein und zum Schluss ein bisschen dunkle Schokolade, was das ganze so besonders rund macht. Solche Gourmets, diese Cowboys. AT 2021
  ageRating: 6
