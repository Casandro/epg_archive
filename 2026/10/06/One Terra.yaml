  title: Planet Weltweit - Escobars Erbe - Kolumbiens Kokain-Hippos
  subtitle: Planet Weltweit - Escobars Erbe - Kolumbiens Kokain-Hippos
  description: 'Planet Weltweit: Flusspferde gehören zu den gefährlichsten Tieren Afrikas - mittlerweile sind sie aber auch in Kolumbien zum Problem geworden, mehrere Tausend Kilometer von ihrem natürlichen Lebensraum entfernt. Als Kokain-Millionär Pablo Escobar in den 1980er-Jahren begann, afrikanische Flusspferde zu seinem privaten Vergnügen zu halten, konnte noch niemand in Kolumbien ahnen, dass die Tiere bald eine Gefahr für das Ökosystem des gesamten Landes werden würden. Denn aus den vier Hippos, die nach dem Tod Escobars in die Freiheit entkamen, wurden inzwischen mehrere Hundert. Die tonnenschweren Kolosse, die in Südamerika keine natürlichen Feinde haben, breiten sich aus und verschmutzen mit ihren sauren Exkrementen das Wasser - was zur Verdrängung einheimischer Tierarten führt. Außerdem bedrohen sie die Fischer an den Flüssen. Auf der anderen Seite entdecken gerade arme Familien die Flusspferde als Geldquelle, denn immer mehr zahlungskräftige Touristen buchen geführte Ausflüge inklusive Hippo-Watching. Isabel Romero etwa ernährt ihre Familie durch ihre Geschäftsidee als Naturführerin, sie ist immer wieder von der urwüchsigen Kraft der Flusspferde fasziniert. Ganz im Gegensatz zur Tierärztin Gina Serna, die ständig nach neuen Wegen sucht, die Zahl der Tiere einzudämmen. Da sie nicht erschossen werden dürfen, will Gina nun ein Tier fangen und kastrieren. Eine aufwändige Operation unter freiem Himmel - und eine Weltpremiere dazu, denn eine OP wie diese gab es noch nie. Gina will es trotzdem versuchen - auch wenn Landsleute wie Isabel ihr dabei skeptisch über die Schulter schauen werden. Denn möglicherweise ist dies die wirksamste Methode, um den riesigen Invasoren zu begegnen.  DE 2021'
- eventId: 1446260
  start: 2026-10-06T11:15:00Z
  stop: 2026-10-06T12:07:00Z
  title: Planet Weltweit - Stromboli , zwischen Feuer und Meer
  subtitle: Planet Weltweit - Stromboli , zwischen Feuer und Meer
  description: 'Planet Weltweit: Warum wohnen Menschen freiwillig am Fuße eines aktiven Vulkans? Auf der Insel Stromboli, dem kleinen Eiland vor der Küste Süditaliens, leben gerade einmal rund 300 Menschen. Es sind Künstler, Bauern, Bergführer - aber vor allem Fischer. Bis heute wird auf Stromboli nachhaltig gefischt, nahezu ohne technische Hilfsmittel. Gewinn ist damit kaum zu machen, dafür genießen die Fischer hier ihr selbstbestimmtes Leben und sind der modernen Konsum-Welt anscheinend völlig entrückt.  Die meisten jungen Leute verlassen irgendwann ihre Heimat, sie wollen woanders ihr Glück suchen, Karriere machen. Doch noch immer gibt es auch junge Menschen, die sich von dem bescheidenen Leben auf der Insel angezogen fühlen, ganz wie in dem gleichnamigen Filmklassiker von Roberto Rossellini, mit Ingrid Bergman in der Hauptrolle. Liegt es an einer Art Magie, die von Strombolis Vulkan ausgeht?  Der 22-jährige Andrea Cusolito ist nach über zehn Jahren auf seine Geburtsinsel zurückgekehrt. Nach Jahren in Deutschland will er nun von seinem fast 70-jährigen Vater die Tricks und Kniffe der nachhaltigen Fischerei erlernen. Gaetano, ein Stromboli-Fischer durch und durch, hofft darauf, dass sich Andrea entschließt, dauerhaft auf Stromboli zu leben. Kann er seinem Sohn den Zauber der Insel vermitteln? Die Arbeit der Fischer ist hart, ihr Einkommen mäßig. Sie sind extrem abhängig vom Wetter, zudem grollt oben der Vulkan alle paar Minuten bedrohlich. Erst 2019 gab es eine gewaltige Eruption, bei der sogar ein Mensch ums Leben kam. Ist ein solches Dasein wirklich attraktiv? Während Andrea noch mit der Entscheidung hadert, beobachten Vulkanologen wie Giovanni Giuffrida die Aktivität des Feuerberges ganz genau. Wieviel Gefahr geht von ihm aktuell aus? Der Wissenschaftler steht vor einer gewagten Aufgabe: Er wird selbst den aktiven Vulkan besteigen und neue Messgeräte installieren - eine Mission, für die er nicht nur Mut, sondern das richtige Timing und viel Glück braucht. DE 2021'
- eventId: 1446266
  start: 2026-10-06T12:15:00Z
  stop: 2026-10-06T13:07:00Z
  title: Planet Weltweit - Namibias Geparden - Hoffnung für die Raubkatzen
  subtitle: Planet Weltweit - Namibias Geparden - Hoffnung für die Raubkatzen
  description: 'Planet Weltweit: Ob Kalahari, Namib oder Etoscha: Namibia verfügt über eine Fülle von Schutzgebieten und Tierreservaten. Fast 40 % der Landesfläche stehen ganz oder teilweise unter staatlichem Schutz. Davon profitieren auch die Raubkatzen hier im Südwesten Afrikas. Von den geschätzt 8.000 Geparden, die es noch gibt, lebt mehr als ein Drittel in Namibia. Einst war ihr Bestand um ein Vielfaches höher. Wachsende Trockenheit, Wilderer sowie der Wettbewerb mit den größeren und stärkeren Leoparden setzen ihrer Population zu. Engagierte Tierschützer und Veterinäre, ideenreiche Frauen und Fährtenleser kämpfen jeden Tag um das Überleben der Großkatzen. Selbst in einem der am spärlichsten besiedelten Länder der Welt ist nicht endlos Platz für wilde Tiere. Die Raubkatzen Nambias leben nämlich meist gar nicht in den eher trockenen Schutzgebieten und Tierreservaten, sondern auf dem fruchtbaren Farmland, auf dem Abertausende Rinder, Schafe und Ziegen gezüchtet werden, die für die schnellen Räuber eine leichte Beute darstellen. Das führt zu Konflikten mit den Farmern, die sich der tierischen Widersacher gern mit dem Gewehr entledigen. So schrumpft die Zahl der Geparden seit Jahrzehnten kontinuierlich. Auch deshalb, weil sie sich ihre Reviere mit den größeren Leoparden teilen müssen. Tierschutzorganisationen wie die Stiftung Naankuse, gegründet von der Farmerstochter Marlice van Vuuren, zeigen den Viehzüchtern Alternativen auf, um die Raubtiere nicht in jedem Fall gleich zu töten. So rücken mobile Eingreifteams aus, um Geparden und Leoparden, die zum Problem geworden sind oder es werden könnten, einzufangen und mit Sendern auszustatten, die den Tierschützern und Farmern die Positionen der Raubtiere melden. Doch wie spürt man diese Tiere am besten auf und fängt sie ein? Erfahrene Fährtenleser wie Buschmann Debe helfen den Gepardenrettern dabei. Das Gepardenweibchen Amber ist ihm besonders an Herz gewachsen.  DE 2021'
- eventId: 1446269
