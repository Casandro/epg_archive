  title: Planet Weltweit - Die Todesküste von Galicien
  subtitle: Planet Weltweit - Die Todesküste von Galicien
  description: "Entenmuscheln sind die begehrtesten Meeresfrüchte Spaniens. Für eine Portion dieser Spezialität zahlen Gourmets in guten Restaurants bis zu 250 Euro. Aber niemand kann die Gefahr bezahlen, der sich die Fischer Galiziens bei der Ernte aussetzen. Ihr Arbeitsrevier ist die Costa da Morte - die Todesküste, an der 2002 der Öltanker \"Prestige\" auseinanderbrach. Hier peitscht der Nordwestwind die Wellen des Atlantiks oft mit Stärke acht gegen die Felsen. Jeder Welle müssen die Männer ausweichen, wenn sie die Entenmuscheln ernten wollen. Für die Fischer sind die Klippen unumgänglich. Denn nur hier können sie dem Meer ihre Beute entreißen. Die Reportage begleitet die Entenmuschelfischer bis hinaus zu den lebensgefährlichen Klippen. Aber auch hier werden die Bestände der Entenmuscheln immer kleiner. \nDie Entenmuschelfischer kämpfen hart um die edlen Schalentiere: Um den Kampf zu gewinnen, brauchen sie viele Verbündete - das Wetter, die Gezeiten und den Rhythmus der Gestirne. Nur bei Neu- und Vollmond kommt es zur Springtide. In diesen zwei Tagen legt die Ebbe die wertvollsten der Entenmuscheln frei. Je näher die Tiere am unteren Rand der Gezeitenzone wachsen, desto länger saugen sie das Plankton aus dem Wasser, desto fleischiger werden sie. Eigentlich zählen Entenmuscheln zu den Krebstieren. Sie verbergen ihr Fleisch unter einer zähen Haut zwischen dem Stumpf, der am Felsen anwächst, und dem Kopf. Gourmets genießen die Delikatesse gekocht und kaum gewürzt. Trotz der hohen Qualität der Schalentiere verdienen die Entenmuschelfischer mit den geernteten Mengen heute aber nicht mehr genug. Oft fährt auch Manolo Vázquez mit seiner Besatzung erfolglos von einem Felsen zum nächsten. Sechs Kilogramm Muscheln dürfte jeder der Männer sammeln. Aber oft kehren sie mit deutlich weniger Ertrag zurück. Entweder sind die Entenmuscheln noch nicht groß genug oder aber die Felsen sind schon abgeerntet. Denn nicht nur das Wetter und die Wellen machen den Fischern das Leben schwer. DE 2009"
  ageRating: 12
