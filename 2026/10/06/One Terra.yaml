  title: Planet Weltweit - Panzer, Wölfe, Rothirsche - Bayerns wilder Übungsplatz
  subtitle: Planet Weltweit - Panzer, Wölfe, Rothirsche - Bayerns wilder Übungsplatz
  description: 'Planet Weltweit: Es wird fast rund um die Uhr scharf geschossen auf dem Truppenübungsplatz der US-Streitkräfte im oberpfälzischen Grafenwöhr in der Oberpfalz im Norden Bayerns. Kaum vorstellbar, dass sich in diesem riesigen, scheinbar lebensfeindlichen, Gebiet genau darum ein einzigartiges Naturrefugium gebildet hat. Unbehelligt von der ständigen Beschneidung ihres Lebensraums, von den Gefahren der Urbanität, leben hier zahlreiche Tierarten. Nun soll der Einfluss des Wolfes auf die großen Rotwild-Bestände des Areals wissenschaftlich untersucht werden. Mit einer Fläche von 234 km2 ist hier der größte Truppenübungsplatz der US-Armee außerhalb der USA. In diesem Gebiet sind Marcus Meißner und Maria Zetsche vom Wildbiologischen Institut Göttingen und Dresden e.V. mit einer Sondergenehmigung der US-Armee unterwegs. Der Diplomforstwirt und die Tierärztin koordinieren ein Projekt, das den Einfluss des Wolfs auf das Verhalten der Rothirsche herausfinden möchte. Marcus Meißner untersucht schon seit vielen Jahren in Zusammenarbeit mit dem Bundesforst das Verhalten der Rothirsche auf dem Übungsplatz. Mit Hilfe von GPS-Sendern wurden Verhalten und Bewegungsmuster des Rotwildes ohne den Wolf erforscht. Jetzt soll das gleiche nochmal gemacht werden, unter dem Einfluss der jetzt hier nachweislich lebenden Wölfe. Dazu müssen die scheuen Tiere wieder mühsam gefangen und mit einem Senderhalsband versehen werden. Gespannt sehen Marcus, Maria und ihre Kolleginnen dem Ergebnis entgegen. DE 2021'
- eventId: 1446233
  start: 2026-10-06T05:15:00Z
  stop: 2026-10-06T06:06:00Z
  title: Planet Weltweit - Die Odyssee der Mönchsrobbe
  subtitle: Planet Weltweit - Die Odyssee der Mönchsrobbe
  description: 'Planet Weltweit: Seit der Antike gehört die Mönchsrobbe zu den geheimnisvollsten Säugetieren des Mittelmeeres. Die letzten 500 leben in Griechenland und der Türkei, extrem zurückgezogen in schwer zugänglichen Unterwasser-Höhlen. Ein Team einer Schweizer Stiftung will mit Kamera-Installationen mehr über die Lebensgewohnheiten der Robben erfahren, um sie besser schützen zu können. Die scheuen Meeressäuger wurden lange Zeit gejagt, wegen ihrer Haut, ihres Fettes - oder weil sie den Fischern zu viel Fisch wegfressen. Inzwischen ist die Art so gefährdet, dass die letzten knapp 500 im Mittelmeer lebenden Exemplare dringend besser geschützt werden müssen. Doch ihr versteckter Lebensraum macht ihre Erforschung und damit ihren Schutz sehr schwierig. Das will ein Team der Octopus-Foundation ändern. Segler, Fotografen, Taucher, begleitet von Biologen und Einheimischen wollen gemeinsam autonome Kameras an ausgewählten Stellen positionieren, um zu erfahren, ob und wo es die Robben überhaupt noch gibt und um ihre Lebensgewohnheiten zu erforschen. Julien Pfyffer, der Leiter der Expedition, setzt zusammen mit seinen Mitstreiterinnen und Mitstreitern die Segel in Richtung der Insel Kefalonia: Wir sind extrem gespannt, was uns erwartet. Nach mehreren Wochen oder Monaten werden wir es vielleicht endlich schaffen, eine Robbe zu erspähen, die sich am Strand ausruht. Und sei es nur für einen kurzen Augenblick, so Pfyffer. Bis zum Ende ihrer Reise erwartet sie eine ganze Reihe erstaunlicher Entdeckungen.  DE 2021'
