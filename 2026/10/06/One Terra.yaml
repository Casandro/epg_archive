  title: 'Planet Weltweit - Puerto Rico: Ein Krankhaus für Seekühe'
  subtitle: 'Planet Weltweit - Puerto Rico: Ein Krankhaus für Seekühe'
  description: 'Sie sind der Inbegriff der Gemütlichkeit im Meer: Rundschwanzseekühe, auch Manatis genannt. Ruhig und behäbig lassen sie sich treiben und allzu gern laben sie sich genussvoll am Seegras der Karibik. Obwohl sie keine natürlichen Feinde haben, ist ihr Bestand massiv bedroht, und zwar durch Motorboote, die die Tiere immer wieder verletzen. Die letzte Chance für diese Seekühe ist das Auffangzentrum in Puerto Rico. Dort werden die Unfallopfer gepflegt und im besten Fall wieder in ihre natürliche Umgebung zurückgebracht. Die kleine Moana kam verwaist ins Seekuh-Krankenhaus zu Dr. Tony Mignucci. Das nur wenige Monate alte Seekalb wurde allein und hilflos an einem Strand gefunden, und es ist fraglich, ob es ohne Mutter überleben wird. Dr. Mignucci und sein Team vom "Manatee Conservation Center" in der Hauptstadt San Juan werden in jedem Fall alles tun, um Moana zu helfen. Seit über 30 Jahren kümmern sich haupt- und ehrenamtliche Retter hier um verletzte Meeresbewohner, die in der Regel Opfer von Motorbootunfällen geworden sind. Neben Seekühen gehören aber auch Pelikane und Schildkröten zu den Patienten. Einige von ihnen werden nie wieder in die Freiheit entlassen werden können, zu schwer und dauerhaft sind ihre Beeinträchtigungen. Aber wenn es dann doch gelingt nach all den Mühen, ist das für alle Helfer ein besonderer Moment. So wie bei Mabo und Tureygua, den beiden Seekühen, die in einer großangelegten Aktion wieder ausgewildert werden. Ob es dagegen Moana schaffen kann, ist noch ungewiss: Tag und Nacht wird das Jungtier beobachtet, in genauer Taktung mit Ersatzmilch versorgt. Dennoch verschlechtert sich ihr Zustand zusehends. Dr. Mignucci hat nun auch noch festgestellt, dass die kleine Seekuh an einer lebensgefährlichen Infektion leidet. Die nächsten Wochen werden zeigen, ob der Einsatz des Teams in der Auffangstation am Ende Erfolg hat. DE 2020'
