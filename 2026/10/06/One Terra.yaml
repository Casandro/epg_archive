  title: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  subtitle: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  description: 'Es ist die Geschichte eines unglaublichen Comebacks eines kleinen Flüsschens und einer ganzen Landschaft: Die Emscher fließt mitten durch das Ruhrgebiet, lange Zeit das industrielle Herz Deutschlands. Dem Fluss widerfuhr das traurige Schicksal, alle Abwässer der Region Richtung Rhein zu befördern. Er verkam zu einem in ein Betonbett gezwängten, stinkenden Kanal. Die Emscher war der dreckigste Fluss in ganz Europa. Ausgerechnet die Emscher wird heute zum Vorbild für Stadt- und Landschaftsplaner in Industrieregionen weltweit. Auf einer Strecke von insgesamt 350 Kilometern werden sie und ihre Nebenflüsse von ihrer schmutzigen Last befreit: Überall entstehen Kläranlagen und unterirdische Kanalsysteme. Die Flüsse und Bäche dürfen sich wieder einen natürlichen Lauf suchen, seltene Tiere und Pflanzen erobern das Ruhrgebiet zurück. Die Emschergenossenschaft, ein Zusammenschluss von Städten und Unternehmen, ist verantwortlich für diese Renaturierung. Das Wiedererblühen des Flüsschens ist nur ein Baustein des Wandels des gesamten Ruhrgebiets hin zu einer grünen, lebenswerten Gegend. Die Dokumentation zeigt auch die Menschen, die die Rückkehr der Natur ins Ruhrgebiet vorantrieben: Anwohner, Ingenieure und Biologen, die sich nicht damit abfinden wollten, am dreckigsten Fluss Europas zu leben. Als die Kohleförderung an der Ruhr zu Ende ging, war ihre Zeit gekommen. Wo früher die Schlote rauchten, gibt es heute Seen, Wälder und sogar Weinberge. Und die Menschen entdecken ihren wieder ergrünten "Pott" als einzigartige Naturregion mit einer ganz speziellen Industriegeschichte. DE 2017'
  ageRating: 6
- eventId: 1446298
  start: 2026-10-06T17:15:00Z
  stop: 2026-10-06T18:07:00Z
  title: Wasser ist Zukunft - Der Jordan - Fluss des Friedens?
  subtitle: Wasser ist Zukunft - Der Jordan - Fluss des Friedens?
  description: 'Der Jordan ist die wichtigste Wasserquelle für Jordanier, Israelis und Palästinenser und sowohl eine Wiege der Kulturen als auch Grenzfluss. Immer wieder birgt sein Wasser Grund für Konflikte aber auch für Verhandlungen und Verträge zwischen Israelis und Arabern. Die Dokumentation taucht ein ins Jordantal, die Kornkammer und den Gemüsegarten Israels und Jordaniens, wo die intensive Landwirtschaft dem Fluss das Wasser abgräbt. Am Toten Meer kommt nur noch ein Rinnsal an. Doch in Israel, Jordanien und Palästina gibt es heute Menschen, die den Jordan retten wollen. Als Israel und Jordanien 1994 Frieden schließen, gründet der israelische Umweltschützer Gidon Bromberg gemeinsam mit jordanischen und palästinensischen Partnern die Umweltorganisation EcoPeace. Über alle Grenzen hinweg arbeiten ihre Aktivisten heute nicht nur für den Schutz der Natur, sondern auch daran, das Vertrauen zwischen den Menschen aufzubauen. In Jordanien reaktiviert EcoPeace einen Regenwasserspeicher, um in der Wüste einen Wald wachsen zu lassen. Im palästinensischen Jericho lernen Schüler, wie man mit einfachen Mitteln Haushaltswasser recycelt. In Israel beweisen Fischfarmer, dass sich mit neuen Technologien viele Millionen Liter wertvolles Jordanwasser sparen lassen. Zukunftsperspektiven in noch größeren Dimensionen eröffnen moderne israelische Meerwasserentsalzungsanlagen, die mehr Trinkwasser produzieren als zur Versorgung der Bevölkerung nötig ist. Je weniger Wasser dem heiligen Jordan entnommen werden muss, desto eher kann er wieder werden, was er früher war: die Lebensader des Nahen Ostens. DE 2017'
