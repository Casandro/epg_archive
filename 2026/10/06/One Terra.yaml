  title: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  subtitle: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  description: 'Es ist ein Fluss der Superlative: Der Colorado entspringt in den Rocky Mountains und fließt durch den berühmten Grand Canyon. Doch in Mexiko, wo der Strom über Jahrtausende ins Meer mündete, kommt kaum noch ein Tropfen Wasser an. Die Mündung liegt seit Jahrzehnten trocken, eine Wüstenlandschaft. Zu groß ist der Wasserbedarf der Menschen im Einzugsgebiet des Colorados. Angesichts des Wassermangels erscheint verwegen, was mexikanische und amerikanische Naturschützer vorhaben: Die Mündung des Colorados soll wieder Wasser führen und ergrünen. Dabei sind die Herausforderungen groß. Seit 15 Jahren schneit und regnet es im Quellgebiet des Colorados in den Rocky Mountains weniger als zuvor. Der Wasserspiegel am Lake Mead, einem der größten Wasserreservoire der USA, sinkt. Dadurch muss ausgerechnet die Stadt Las Vegas Wasser sparen. Aus der verschwenderischen Wüstenmetropole ist eine Stadt mit Vorbildcharakter geworden: Sie verbraucht immer weniger Wasser, obwohl ihre Einwohnerzahl steigt. Anders in Arizona: Rund um die Stadt Yuma fließen weiterhin Milliarden Liter Coloradowasser in die Wüste, um die USA mit Salat und Gemüse zu versorgen. Die Dokumentation begleitet Menschen, deren Leben eng mit dem Wasser des berühmten Flusses verbunden sind. Sie zeigt Wasserpolizisten und Wüstengärtner in Las Vegas, die Bewohner zum bewussten Umgang mit dem kostbaren Nass bewegen. Das Kamerateam folgt Farmern in die Wüste Arizonas und kreativen Umweltschützern in das spektakuläre Coloradodelta. Ihre Geschichte zeigt, dass eine ausgedorrte Landschaft wieder erblühen kann, wenn der Mensch dem Fluss einen Teil seines Wassers zurückgibt. DE 2017'
  ageRating: 6
- eventId: 1446279
