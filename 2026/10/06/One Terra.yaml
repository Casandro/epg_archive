  title: Planet Weltweit - Majuli, ein Inselvolk trotzt den Fluten
  subtitle: Planet Weltweit - Majuli, ein Inselvolk trotzt den Fluten
  description: Majuli, die größte Flussinsel der Welt, ist bedroht. In den letzten 60 Jahren hat sie rund ein Drittel ihrer Fläche verloren. Kontinuierlich nagt der Brahmaputra an Majulis Ufern. Besonders während der alljährlichen Monsunregenfälle verwandelt sich der Fluss im Nordosten Indiens zu einem reißenden Strom, der Dörfer und Landstriche überflutet. Die Inselbevölkerung erhofft sich Hilfe von der Regierung - aber mehr noch von den Göttern. Es ist eine Ehre, wenn eines ihrer Kinder von einem der 22 Klöster Majulis aufgenommen wird. Auch die Eltern des 4-jährigen Lohit fühlen sich geehrt, und sind traurig zugleich. Die Dokumentation begleitet Lohits erste Schritte auf dem Weg zu einem angesehenen Kindermönch.  Nur schwer trennt sich Rupali Khatoniya von ihrem jüngsten Kind. Obwohl sie Lohits Mutter ist, wurde sie nicht gefragt. Auf dem Land ist es in Indien noch immer üblich, dass sich Frauen den Entscheidungen der Männer beugen. Die Mönche des Klosters Uttar Kamabalari wollen den 4-jährigen Jungen schon seit einiger Zeit in ihren Reihen aufnehmen. In einer Klosterwohnung, einem sogenannten "Boha", soll Lohit künftig mit ihnen leben, beten und arbeiten. Nun ist es soweit. Lohit wird sein Elternhaus für immer verlassen. Dass die Eltern ihren Sohn verlieren, ist auch ein Opfer an die Götter. Damit soll Unheil von den Menschen fern gehalten werden. Majuli darf nicht noch mehr Land an den Fluss verlieren. Der Brahmaputra zählt zu den mächtigsten Strömen der Welt. Er entspringt in Tibet und mündet in den Ganges. Bis zu 30 Kilometer ist er breit. 1950 hatte ein Erdbeben den Lauf des Flussbetts verändert. Seitdem tritt der Strom jeden Sommer während der Monsunmonate über die Ufer. Bei den letzten großen Überschwemmungen 1998 und 2008 riss er mehrere Ortschaften mit sich fort. Doch noch immer wohnen rund 150.000 Menschen auf Majuli und seinen zahlreichen Nebeninseln. Die meisten sind Selbstversorger und arbeiten als Bauern oder Fischer. DE 2011
