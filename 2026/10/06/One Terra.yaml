  title: Planet Weltweit - Boliviens junge Wilde
  subtitle: Planet Weltweit - Boliviens junge Wilde
  description: |-
    Affen, Papageien, Schlangen und sogar Jaguare - in der bolivianischen Hauptstadt La Paz findet man Tiere, die heute selbst im Dschungel selten sind: In Säcke und Kisten gepfercht, werden sie auf den Märkten der Stadt an private Halter, Zoos und Hotels verkauft. Dass Wilderei in Bolivien verboten ist, kümmert niemanden. Juan Carlos Antezama ist einer der wenigen, der sich für die Rechte dieser Tiere stark macht. Als Gründer der Organisation "INTI WARA YASSI" rettet er aber nicht nur Wildtiere aus der Gefangenschaft, sondern auch viele Straßen- und Waisenkinder aus dem Gewalt- und Drogensumpf der Metropole. Der Film beobachtet Juan Carlos Antezama, der mit seinem einmaligen Projekt verwahrlosten Kindern und Tieren zu neuem Lebensmut verhilft.
    Täglich kommen neue Tiere in den Machia - Park - die meisten in einem jämmerlichen Zustand: Papageien, denen die Federn ausgerissen wurden, Wildkatzen mit Brandwunden, verängstigte Kapuzineraffen, die als Haustiere Jahre lang in winzigen Käfigen ausharren mussten. Am Rande des bolivianischen Regenwaldes hat INTI WARA YASSI, zu deutsch "Sonne, Mond und Sterne", einen Rehabilitationspark für Tiere in Not errichtet - einen Ort, an dem sie Zuflucht finden und gepflegt werden bis sie in ihre eigentliche Heimat, den Regenwald, zurückkehren können. DE 2007
