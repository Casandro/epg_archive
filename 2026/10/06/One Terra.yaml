  title: Planet Weltweit - Jemens verschleierte Zukunft
  subtitle: Planet Weltweit - Jemens verschleierte Zukunft
  description: "Der Jemen gilt als eines der schönsten Länder im Vorderen Orient - und gleichzeitig als Land voller Probleme. Krummdolch und Kalaschnikow prägen die Männerwelt und deren Gewaltbereitschaft. Waffen, die Droge Khat und knappe Wasserressourcen sind die Hauptgeschäftsquellen auf dem Land und Anlass für blutige Rivalitäten zwischen den Stämmen. Die Zentralregierung hat jenseits der Hauptstadt Sanaa nichts zu melden - auch nicht gegen die vielerorts praktizierte Blutrache. Das Frauenbild ist mittelalterlich und jedes Ansinnen von weiblicher Selbstbestimmung wird im Keim erstickt. In der Atmosphäre von Armut, Gewalt und Korruption versucht ein Mann zwischen den Clans, Stämmen und Geschlechtern zu vermitteln. \nIm Auftrag der internationalen Hilfsorganisation CARE wagt sich der wortgewandte Streitschlichter Mohammed Saad zwischen die Fronten der Stammeskrieger. Sehr zum Missfallen machtbewusster Traditionalisten setzt CARE im Jemen auf die Mitarbeit von Frauen, um sie aus ihrer gesellschaftlichen Isolation heraus zu holen. In so manchem bis an die Zähne bewaffneten Bergdorf löst er damit einen handfesten Machtkampf aus. In Al Sabre etwa gab es bis vor kurzem weder Strom noch Wasser. CARE baute eine Strom- und Wasseranlage und übergab die Leitung einer Frauenkooperative. Ein Wagnis - denn traditionell haben die bis zu den Fingerspitzen unter dem Hidschab verschleierten Frauen wenig Rechte. Auch diesmal droht das Projekt am Starrsinn und Machtanspruch des lokalen Scheichs zu scheitern. Mohammed Saads ganzes Verhandlungsgeschick ist gefragt. Er zieht die Projektleiterin Sausan und ihre Mitstreiterinnen aus der Schusslinie und reist mit ihnen in das einstige Königreich Hadramaut. Hier gibt es schon ein funktionierendes und florierendes Frauenprojekt, an dem sich Sausan Anregung und Selbstvertrauen holen soll. Wird der Scheich in ihrem Dorf nachgeben? Eine nicht ungefährliche Mission für die Frauen - und für den Filmemacher.\n DE 2009"
