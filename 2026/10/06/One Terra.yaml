  title: Planet Weltweit - Der Traum vom Gold - Tirols Überfliegerinnen
  subtitle: Planet Weltweit - Der Traum vom Gold - Tirols Überfliegerinnen
  description: 'Planet Weltweit: Frauenpower auf der Schanze: Skispringen ist keine reine Männerdomäne mehr. Bei ihren Wettkämpfen, inzwischen auch bei den Olympischen Spielen, geben die nervenstarken Athletinnen alles und stehen ihren männlichen Kollegen in nichts nach. Die wohl renommierteste Talentschmiede in Europa ist das österreichische Skigymnasium Stams. Hier werden junge Nachwuchsspringerinnen ausgebildet. Ihr Ziel: Der Sprung in die Weltspitze! Die fliegende Gräfin Paula von Lamberg gilt als Pionierin des Damenskisprungs. 1911 stellte sie in Kitzbühel mit 22 Metern einen Weltrekord auf. Trotzdem sollte es noch fast hundert Jahre dauern, bis es für Damen 2009 die erste Weltmeisterschaft gab - und erst 2014 wurde Skispringen olympisch. Frauen stehen in dieser faszinierenden Sportart längst ihren Mann, auch wenn sie oft noch um mediale Aufmerksamkeit kämpfen müssen. Zu den größten Nachwuchshoffnungen gehört die 16-jährige Julia Mühlbacher, die bereits bei mehreren Wettkämpfen auf vorderen Plätzen landete. Nun soll es zur Junioren-WM nach Finnland gehen. Zusammen mit ihren Mitschülerinnen aus Stams will Julia hier nicht nur eine neue persönliche Bestweite erzielen, sondern das Frauen-Springen generell stärker in den Fokus rücken. Zu ihren Mitstreiterinnen gehört Martina Ambrosi. Die 19 Jahre alte Italienerin muss gerade eine besondere persönliche Bewährungsprobe überstehen: Vor zwei Jahren stürzte sie während eines Sprungs so unglücklich, dass sie mehrere Monate brauchte, bis sie sich wieder auf die Schanze wagte. Die Angst vor einem erneuten Sturz ist seitdem ihr ständiger Begleiter, dennoch arbeitet sie Tag für Tag an sich. Martina muss nicht nur ihre Technik verbessern, sondern auch die Barriere in ihrem Kopf überwinden. Die langersehnte Chance auf eine WM-Teilnahme jedenfalls will sie sich nicht nehmen lassen. Ein Schlüsselerlebnis für beide Athletinnen - wird ihnen der Sprung in die Weltspitze gelingen?   DE 2021'
