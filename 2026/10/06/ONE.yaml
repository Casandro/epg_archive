  description: "Marlene bringt es nicht übers Herz, Natascha vor der Reporterin auffliegen zu lassen. Michael gelingt es, Marlenes Frustration abzumildern. Konstantin riskiert ernsthaften Ärger mit Natascha, weil er es unerträglich findet, wie sie sich auf Kosten von Marlene produziert. In der Nacht hat er einen Traum, in dem er sich ungemein glücklich mit Marlene sieht. Fühlt Konstantin für Marlene etwa mehr, als er sich selbst eingesteht? \n\nKira und Martin versöhnen sich: Martin ist bereit, das Kind anzunehmen. Xaver jedoch lässt nicht locker. Er will weiterhin um seine große Liebe Kira kämpfen."
