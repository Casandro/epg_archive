  description: Konstantin kämpft gegen Werners Zweifel an der Beziehung zu Natascha. Er findet es jedoch weiterhin falsch von Natascha, sich als Schmuckdesignerin auszugeben. Da Konstantin es vorzieht, seine Freizeit mit Nils zu verbringen, hegt Natascha den Verdacht, dass ihr Freund sie betrügt. Auch Marlene bemerkt das seltsame Verhalten Konstantins. Der beneidet Marlene um ihr Liebesglück mit Michael. Später bekommt Marlene zufällig mit, wie Werner die Vermutung äußert, Konstantin sei in Marlene verliebt. Sie hält das für Unsinn, bis Natascha ihr anvertraut, dass sie glaubt, Konstantin hätte sich in eine andere verliebt ...
