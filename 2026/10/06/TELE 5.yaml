    London, im Viktorianischen Zeitalter: Während sich der neue Doktor im Unterschlupf der Paternoster-Gang von seiner Regeneration erholt, gehen an der Themse seltsame Dinge vor sich. Ein Dinosaurier wütet in der Stadt und mehrere Menschen kommen durch spontane Selbstentzündung ums Leben! Auch ein rätselhafter Mann (Peter Ferdinando), der sich als Cyborg entpuppt, ist in die Vorgänge verstrickt. Als die Mensch-Maschine vorgibt, einen Weg ins gelobte Land zu suchen, wird das Rätsel umso größer. Später erhält Clara einen Anruf, der sie davon überzeugt, weiterhin mit dem Timelord unterwegs zu sein.
