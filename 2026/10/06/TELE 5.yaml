  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Das Geheimnis unserer Existenz (Teil 1)
  description: "Wie viel Neandertaler steckt bis heute in jedem von uns? Wann genau trennte sich die Entwicklungsgeschichte von Affe und Mensch? Warum hat Homo sapiens als einzige menschliche Spezies überlebt? Um die Geheimnisse unserer Existenz zu entschlüsseln, unternimmt Abenteurer Josh Gates eine spannende Expedition zu den Ursprüngen der Menschheit. Die erste Etappe der Reise beginnt an der Universität von Wisconsin, wo Anthropologe Dr. John Hawks die komplexen Verzweigungen unseres evolutionären Familienstammbaums entwirrt, und führt weiter bis nach Afrika, die Wiege der Menschheit! \nUSA 2019"
