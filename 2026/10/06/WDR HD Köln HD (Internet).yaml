  title: In aller Freundschaft (1023)
  subtitle: Wenn die Pflicht ruft
  description: 'Maxima Dobenko, Kai Hoffmanns ehemalige Bundeswehr-Kameradin, kommt mit Fieber und anhaltenden Beschwerden zurück in die Sachsenklinik: Ist mit ihrer Mitralklappenprothese alles in Ordnung? Neben ihrer Gesundheit fehlt ihr zudem ein Oberfeldarzt für einen Einsatz im Krisengebiet. Sie versucht, Kai den Job schmackhaft zu machen.'
- eventId: 1522503
  start: 2026-10-06T06:25:00Z
  stop: 2026-10-06T07:10:00Z
  title: In aller Freundschaft (1024)
  subtitle: Kein Zurück mehr!
  description: 'Ole Nielsen ist gerade zur Behandlung bei Darren Macneill in der Physiotherapie, als sich sein Zustand plötzlich verschlechtert. Ausgerechnet jetzt hätte er einen wichtigen Termin: Mit Schwägerin Kaja ist Ole verabredet, um seiner Frau zu beichten, dass er und Kaja ein Liebespaar sind. Die dringende Operation macht diesen Plan zunichte. Zudem droht Ole eine Zukunft mit externem Urinbeutel und ständiger Dialyse. Er ist verzweifelt - ist das die Strafe für den Betrug an seiner Frau?'
