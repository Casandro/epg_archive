  title: Elefant, Tiger & Co. (425)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: "* Schwere Jungs\nVoi Nam ist zurück, aus dem Dreikäsehoch ist ein richtiger Kerl geworden. Über 2,70 m groß und sicher 4 Tonnen schwer, wird der Elefant dem Zuchtbullen Naing Thein bald Konkurrenz machen.\n* Schwierige Geburt \nDallschafmutter \"Lila - 0-10-29-26\" ist hochtragend. Die Geburt steht unmittelbar bevor. Christiane Jäpelt erwartet stündlich, dass ein kleines Lamm auf die Welt kommt. Doch dann läuft alles anders als erwartet!\n* Schwierige Aufgabe\nDie Forscher vom Max-Planck-Institut für evolutionäre Anthropologie forschen ja eigentlich mit Menschenaffen. Nun haben sie sich aber mal was Besonderes ausgedacht ..."
