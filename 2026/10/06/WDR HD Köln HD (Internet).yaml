  description: 'Ole Nielsen ist gerade zur Behandlung bei Darren Macneill in der Physiotherapie, als sich sein Zustand plötzlich verschlechtert. Ausgerechnet jetzt hätte er einen wichtigen Termin: Mit Schwägerin Kaja ist Ole verabredet, um seiner Frau zu beichten, dass er und Kaja ein Liebespaar sind. Die dringende Operation macht diesen Plan zunichte. Zudem droht Ole eine Zukunft mit externem Urinbeutel und ständiger Dialyse. Er ist verzweifelt - ist das die Strafe für den Betrug an seiner Frau?'
