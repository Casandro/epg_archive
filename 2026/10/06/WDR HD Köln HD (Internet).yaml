- eventId: 1526279
  start: 2026-10-06T12:20:00Z
  stop: 2026-10-06T13:10:00Z
  title: Rentnercops (36)
  subtitle: Mord im Dunkeln
  description: "Unter Edwins vehementen Protest ist das gesamte Kommissariat auf dem Weg zu einer Fortbildung in Verwaltungsfragen. Leider kommen sie nicht weit: Nachdem Edwin sich restlos verfahren hat, bleiben sie mitten in der Nacht auf einer Landstraße mit einem veritablen Motorschaden liegen. Und das mitten in einem Funkloch. Glücklicherweise liegt in der Nähe ein Landgasthaus, wo sie ein Telefon zu finden hoffen. \nDoch da hier gerade neue Leitungen verlegt wurden, funktioniert auch das nur sporadisch und jetzt eben gerade nicht, wie die Rezeptionistin mitteilt. Also beschließen sie erst einmal, sich im Restaurant zu stärken."
  ageRating: 6
  genre:
  - '16'
- eventId: 1526602
  start: 2026-10-06T13:10:00Z
  stop: 2026-10-06T14:00:00Z
  title: Rentnercops (37)
  subtitle: Ein Kind verschwindet
  description: "Bei einem Zoobesuch mit seinem Vater und seinem Großvater verschwindet der kleine Finn spurlos. Da das für Vermisstenfälle zuständige Kommissariat durch einen Virus lahmgelegt ist, müssen Edwin, Vicky und Hui Ko den Fall übernehmen - ohne Günter, denn der liegt mit einem Bandscheibenvorfall in Bratislava, wo er an Plochers Stelle einen Vortrag halten sollte. \n\nDa das Kind trotz intensiver Suche im Zoo und Umgebung nicht gefunden wird, steht schnell der Verdacht einer Entführung im Raum. Oder handelt es sich vielmehr um einen Sorgerechtsstreit?"
  ageRating: 6
  genre:
  - '16'
