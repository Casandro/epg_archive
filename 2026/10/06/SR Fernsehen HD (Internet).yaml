  description: 'Füße hochlegen und ein gutes Buch lesen - das haben Claire, Bernhard und Tochter Sophie sich für ihr neues Leben fest vorgenommen. Wirklich kürzertreten wollen die eingefleischten Workaholics aber nicht, und so gibt es in der Freizeit-Idylle glücklicherweise doch noch etwas zu tun: Claire liebäugelt mit einem Posten in der Politik, und in Bernhards Flugzeug-Firma gibt es ein Riesenproblem: Der neue Prototyp entspricht nicht den gesetzlichen Vorschriften. Obwohl Ingenieurin Sophie sich in den Flitterwochen mit Jugendliebe Hans befindet, muss sie sich darum kümmern - und ist darüber gar nicht unfroh.'
