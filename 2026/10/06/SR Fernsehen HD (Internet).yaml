- eventId: 1524417
  start: 2026-10-06T08:20:00Z
  stop: 2026-10-06T08:55:00Z
  title: Eisenbahn-Romantik (832)
  subtitle: Kaltes Herz und heißer Dampf - die Murgtalbahn
  description: Zwei Jahrhunderte nach den Murgflößen kam die Eisenbahn ins Murgtal und transportierte riesige Holzstämme aus dem Schwarzwald überallhin. Der Bau der 58 Kilometer langen Bahnstrecke zwischen Rastatt und Freudenstadt dauerte 59 Jahre lang. Grenzstreitigkeiten und Kleinstaaterei sorgten immer wieder für Verzögerungen. Der erste durchgehende Zug fuhr schließlich 1928. "Eisenbahn-Romantik" fährt auf den Spuren des Holländermichels durchs Murgtal, besucht die Glasmännlehütte, will "Das kalte Herz" finden.
