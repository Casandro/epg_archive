  description: Miranda en Micky groeien met hun drie kinderen letterlijk uit hun jaren 30-woning in Den Haag. Gelukkig zijn het echte aanpakkers en bouwen ze een huis achter hun huidige huis. * Chef-kok Sharon de Miranda maakt een lasagne met een oosterse twist. Ze gebruikt wontonvellen en de lagen vult ze met kipgehakt, paddenstoelen, paksoi en kokosmelk. * Op Texel kondigt de zilte vegetatie de nazomer aan. Boswachter Marieke is met haar collega Thomas in natuurgebied De Slufter om dit bijzondere proces van dichtbij te zien. * Kunsthistoricus Geert Pruiksma bezoekt in Nijmegen een opvallende muurschildering over het leven van een Byzantijnse prinses. (2026)
