  subtitle: Het Kantoor 350 S38 E4765. In het Klokhuis Kantoor krijgt Luuk ruzie in de kantine, want waarom spreekt niemand het woord "croissant" toch goed uit? Pascal gaat langs bij bakker Maarten die nog zelf croissants maakt.
  description: In het Klokhuis Kantoor krijgt Luuk ruzie in de kantine, want waarom spreekt niemand het woord "croissant" toch goed uit? Korrels die meedansen op de muziek in patronen, hoe kan dat? Dat zien we in Hoe dan? Veel croissants worden in grote fabrieken gemaakt, maar Pascal gaat langs bij bakker Maarten die ze nog zelf maakt. Hoe maakt hij al die laagjes erin en waardoor zijn ze zo luchtig? En hoe kan het eigenlijk dat we -oeps?- misselijk worden? (2024)
