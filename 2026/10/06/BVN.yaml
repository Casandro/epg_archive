  title: 'NPO Doc: Aan het hart'
  subtitle: Een jonge man en zijn vader sterven kort na elkaar aan een plotselinge hartstilstand. Zit er iets in de familie?
  description: 'Marian, het derde kind in een boerengezin in de Noordoostpolder, laat met haar broers onderzoek doen naar de oorzaak van het plotseling overlijden van haar jongste broer en dat van haar vader, twee dagen later. Zit er iets in de familie? In 2010 ontdekken twee Groningse genetici het PLN-gen, veroorzaker van een levensbedreigende hartziekte die vooral in Friesland, de Noordoostpolder en Noord-Holland voorkomt. Deze erfelijke eigenschap blijkt verantwoordelijk voor de hartziekte in de familie. Mirjam Bartelsman spreekt tientallen familieleden over de erfelijke last die zij (mogelijk) bij zich dragen en hun motivatie om daar op in te grijpen. Regisseur: Mirjam Bartelsman (2019)'
  genre:
  - '147'
