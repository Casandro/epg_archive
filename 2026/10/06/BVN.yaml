  description: In Rotterdam staat de bijzondere SAWA-toren; een duurzame houten woontoren. Buurvrouwen Nadine en Fiona laten zien hoe zij hun appartementen helemaal eigen hebben gemaakt en waarom ze zich hier zo thuis voelen. * Chef-kok Rosah maakt spanakopita; een traditioneel Grieks ovengerecht van filodeeg gevuld met spinazie. * In de moestuin van Loes in Boskoop groeien groenten, fruit en bloemen kriskras door elkaar. * De Molenviergang van Aarlanderveen is wereldwijd een uniek systeem van vier samenwerkende poldermolens die het water trapsgewijs omhoog malen om de polder droog te houden. Molenaars Willem en Jannick vormen daarin onmisbare schakels. (2026)
