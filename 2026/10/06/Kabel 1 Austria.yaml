    Nach sechs Jahren nimmt FBI-Agent Sean Archer seinen Erzfeind Castor Troy endlich fest. Bei einem Unfall wird dieser so stark verletzt, dass er ins Koma fällt. Dadurch kann er nicht verraten, wo er eine Zeitbombe in Los Angeles versteckt hat. Durch eine spektakuläre Operation leiht sich Archer buchstäblich den Körper Castors und will so das Versteck der Bombe herausbekommen. Doch Castor erwacht aus dem Koma, schlüpft in Archers Körper und nimmt eine atemberaubende Jagd auf.

