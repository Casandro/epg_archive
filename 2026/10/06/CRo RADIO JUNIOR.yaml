  title: Čtení na pokračování
  description: 'Můj táta duch 3/7. Rozhlasový seriál o tom, že některé věci se nedají dokázat, ale i tak můžou být skutečné. "Ahoj, já jsem Etel. Můj táta zmizel do nemocnice a už se nevrátil. Teda vrátil. Ale jako duch!" Etel miluje encyklopedie, chce být vědkyní a sní o Nobelově ceně. Jenže jednoho dne zjistí, že ne všechno se dá změřit, spočítat nebo vysvětlit. Její táta se totiž po smrti vrátí na Zem jako duch! A tak si Etel začne psát vlastní encyklopedii o duchách. Právě tenhle výzkum jí přivede do života nejen nejlepší kamarádku Bedřišku, ale i školní psycholožku Vilmu, která jí vysvětlí, že někdy je v pořádku být prostě smutná. Napsala: Daniela Samsonová. Režie: Bela Schenková. Natočeno v roce 2025. Čte: Berenika Anna Mikeschová.'
- eventId:
  - 1485827
  - 1486893
  start: 2026-10-06T16:55:00Z
  stop: 2026-10-06T17:50:00Z
  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Petra Hermelová, ředitelka NF Zlatý oříšek. Po roce si opět připomínáme skvělou soutěžní přehlídku nadaných dětí Zlatý oříšek. Probereme, jaké dovednosti se ve Zlatém oříšku objevily a kdo z vítězů se stal v dospělosti slavným. Moderuje Jana Rychterová.
- eventId:
  - 1486022
  - 1487075
  start: 2026-10-06T17:50:00Z
  stop: 2026-10-06T18:00:00Z
  title: Hajaja
  description: O nejkrásnějším ostrově 2/7 - O ostrově ohně a ledu. Poslouchat rady rodičů se dětem často nechce. Zvláště když si myslí, že poučení jsou už zastaralá a nepotřebná. Právě takové připadalo malému Fumiovi pravidlo, že se lidé k sobě mají chovat slušně a že si nikdo nemůže dělat jen to, co sám chce. Rozhodl se, že najde takové místo, kde si každý žije podle svého přání a nálady. Původní pohádkový seriál napsala Dagmar Langová. V roce 2013 natočil režisér Petr Mančal. Vypráví Luboš Veselý.
