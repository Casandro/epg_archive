  title: 'Diagnose: Mord'
  subtitle: |-
    Der Bombenleger
    Krimi, USA 1998
    Altersfreigabe: ab 12
  description: |-
    Trotz seiner Unschuldsbeteuerungen wird der mutmaßliche Bombenleger Lewis Sweeney hingerichtet. Doch wenige Wochen später explodiert erneut eine Bombe - offensichtlich war ein Nachahmungstäter am Werk. FBI-Agent Wagner, Amandas Freund, bezweifelt immer noch Sweeneys Schuld, ebenso dessen Sohn Carter, der über seinen Radiosender weiterhin gegen Mark Sloan hetzt. Nach erneuten Anschlägen führt die Spur zu Sweeneys Tochter Caitlin ...

