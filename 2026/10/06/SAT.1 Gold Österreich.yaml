  title: 'Uwe Ochsenknecht präsentiert: die 7 Todsünden'
  subtitle: |-
    Uwe Ochsenknecht präsentiert: die 7 Todsünden
    Kriminal-Reihe, D 2026
    Altersfreigabe: ab 12
    (WH vom Montag, 05.10.2026, 20:15 Uhr)
  description: |-
    Moderation: Uwe Ochsenknecht

    Vier Hilfsschwestern begehen zwischen 1982 und 1989 in einer Wiener Klinik entsetzliche Verbrechen. Über Jahre hinweg nehmen sie unerkannt Patienten mit überdosierten Beruhigungsmitteln und Insulin das Leben. Aus dem Weg geschafft wurden diejenigen, die den Schwestern Arbeit bereiteten. Ein Fall, der einem das Blut in den Adern gefrieren lässt. Außerdem bei "Die 7 Todsünden": Die blutige Rache eines Mannes, der durch ein Flugzeugunglück seine gesamte Familie verloren hat.
  widescreen: true
