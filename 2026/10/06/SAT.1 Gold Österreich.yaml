    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: 'Charlottes Vorwurf gegen ihre Schwiegertochter klingt ungeheuerlich: "Simone erzieht meine Enkel zu Dieben!" Die siebenfache Mutter verteidigt sich vehement: "Meine Kinder sind nicht kriminell!" Aber Vermieter Paul Jeske will die Zwillinge Isabelle und Kai beim Einbruch in seinen Kiosk erkannt haben. Zwingt Simone ihre Kinder zum Stehlen, damit sie ihre Schulden abzahlen kann? Oder will der Vermieter der Familie die Tat unterjubeln, um sie aus dem Haus zu jagen?'
  widescreen: true
