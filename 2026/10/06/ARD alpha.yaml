  title: Einfach genial
  subtitle: Das Erfindermagazin
  description: |-
    Erfindung:
    * Maßgefertigte Sneaker mit Sohlen aus dem 3D-Drucker
    Füße sind nicht selten individuell geformt. Das kann die Suche nach passenden und modischen Schuhen von der Stange kompliziert machen. Eine Alternative sind Maßanfertigungen vom Schuster, doch die sind relativ teuer. Ex-Modedesign-Student Kevin Zürn (Foto) aus Bayern kannte das Problem aus eigener Erfahrung - und hat eine Lösung entwickelt: maßgefertigte Sneaker mit Sohlen aus dem 3D-Drucker.
    "Einfach genial" hat den 22-jährigen Theo gebeten, das Angebot von Kevin Zürn zu testen. Außerdem beurteilt ein Orthopäde die medizinischen Parameter der Sneaker.
