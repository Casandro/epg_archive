  title: Willi wills wissen (127)
  subtitle: Wo macht es krawumm, dass es kracht?
  description: 'Heute lässt es Willi krachen! Und zwar im wahrsten Sinne des Wortes: Der Reporter will wissen, wie ein Haus gesprengt wird. Da ist er im nordrheinwestfälischen Weeze genau richtig. Doch bevor die Fetzen fliegen, macht Willi mit Sprengmeister Bernhard Lammert einen Rundgang durch das achtstöckige Gebäude. Gerade werden die letzten Löcher gebohrt und mit Sprengladungen bestückt. Aber nur auf einer Hausseite, damit es seitlich wegkippt, wie Bernhard erklärt. Ob das klappt? Willi ist skeptisch und geht mit Bernhard eine Wette ein.'
