  title: Die Frage
  subtitle: 'Adoptiert: Liebst du mich wie ein leibliches Kind?'
  description: 'Farinas Geschichte beginnt in einer Sporttasche auf einer Krankenhausbank - als Findelkind, ausgesetzt und ohne leibliche Eltern an ihrer Seite. Heute sitzt sie ihrer Adoptivmutter gegenüber und spricht zum ersten Mal so offen darüber, was diese Tasche in ihnen beiden auslöst: Dankbarkeit, Angst, Schuldgefühle und - ganz wichtig - unfassbar viel Liebe.'
