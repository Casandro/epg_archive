  title: Sea Patrol - Happy Birthday, Bomber
  subtitle: Sea Patrol - Happy Birthday, Bomber
  description: 'Zu ihrem 21. Geburtstag bekommt Bomber von ihrer Mutter ein silbernes Armband geschenkt. Spider begleitet sie an Deck. Ordnungsgemäß melden sie sich bei Buffer ab, der ans Telefon gerufen wird und nicht bemerkt, dass die beiden nicht mehr zurückkehren: Beim Entsorgen des Mülls verliert Buffer ihr Armband. Als sie und Spider danach hangeln, verlieren sie den Halt. AU 2008'
  ageRating: 12
- eventId: 1446360
  start: 2026-10-06T01:00:00Z
  stop: 2026-10-06T01:45:00Z
  title: Sea Patrol - Söldner
  subtitle: Sea Patrol - Söldner
  description: Die Hammersley geht dem Notruf eines Frachters nach, doch als sie dessen Position erreicht, ist das Schiff gesunken. Mit Ausnahme des Seemanns Pearson wurden alle Crewmitglieder getötet. Er berichtet, dass Osteuropäer das Schiff geentert und die Crew gezwungen hatten, ihre Ladung auf den Kabinenkreuzer der Kidnapper umzuladen. AU 2008
  ageRating: 12
- eventId: 1446361
  start: 2026-10-06T01:55:00Z
  stop: 2026-10-06T02:39:00Z
  title: Sea Patrol - Captain Kate
  subtitle: Sea Patrol - Captain Kate
  description: Die Crew der Hammersley leistet Aufbauhilfe auf den Samaru-Inseln, als plötzlich eine Mörsergranate einschlägt. Mike erhält Order, die Verletzen auf der Insel Tampu abzusetzen, als Jim um ein Schlauchboot für seine SAS-Einheit bittet. AU 2008
  ageRating: 12
- eventId: 1446362
  start: 2026-10-06T02:50:00Z
  stop: 2026-10-06T03:34:00Z
  title: Sea Patrol - Doppeltes Spiel
