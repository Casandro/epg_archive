    Der junge Jeff und sein Vater Chase ziehen nach dem Tod der Mutter nach Ludlow, Maine, um ein neues Leben zu beginnen. Schon bald kommt es zu grausamen, unerklärlichen Zwischenfällen.

    Jeff freundet sich mit seinem Mitschüler Drew an, der in ständiger Angst vor seinem Stiefvater Gus lebt. Als Gus Drews geliebten Hund tötet, begraben die Jungs das Tier auf einem alten Indianerfriedhof und ahnen nicht, welch tödliche Macht sie entfesseln.
