  title: MAITHINK X - Clip
  subtitle: Nahrungsergänzungsmittel - sinnlos bis gefährlich
  genre:
  - '48'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Nahrungsergänzungsmittel - manche sind sinnvoll oder sogar notwendig. Doch erschreckend viele sind es nicht und können der Gesundheit sogar schaden.

    Ob als Brausetabletten, kleine Pillen oder Pulver: Viele Deutsche nehmen zusätzlich zu ihren Mahlzeiten Vitamine oder Mineralstoffe ein. "MAITHINK X" erklärt, wie viel davon tatsächlich sinnvoll ist und wann es gefährlich für unsere Gesundheit wird.
    HD-Produktion
