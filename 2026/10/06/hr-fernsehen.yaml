  description: Lore war sechs Jahre alt, als ihre Mutter nach Auschwitz deportiert wurde. Was heißt es, die Tochter einer Frau zu sein, die vom Holocaust gezeichnet ist? Kim Seligsohn, Lores Tochter, ist Sängerin. Die Musik gibt ihrem Schmerz eine Form - und entwickelt eine Wucht und Direktheit, wie sie kein Geschichtswissen vermitteln kann. Ein Film über die Gegenwart der Vergangenheit.
