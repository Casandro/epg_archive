  title: Faszination Heimat - Macht der Erde
  subtitle: Faszination Heimat - Macht der Erde
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Geophysiker Norbert Span. Dank seiner sehr persönlichen Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Erde, das sich auf vielfältige Weise im Alpenraum zeigt. Als Fels, Almböden und saftige Wiesen.  AT 2013'
- eventId: 1446274
  start: 2026-10-06T01:50:00Z
