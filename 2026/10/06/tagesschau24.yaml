  subtitle: Schubert, Sträter und König retten die Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Blitzer-Warner Bros. App präsentiert: Das Gipfeltreffen über den Wolken. Olaf Schubert, Torsten Sträter und Johann König stehen mal wieder emotional komplett neben sich und liefern trotzdem geil ab. Da können sich KI-Witze direkt beerdigen. Diesmal gibt es Tipps für familienfreundliche Swinger-Partys in der Karstadt-Umkleide, geschmackvolle Ideen zur Gestaltung von haarfreien Kopfhautzonen und zum krönenden Abschluss die größten Hits unseres theatralischen Terzetts.
    Mit Fragen von Guido Maria Kretschmer, Louis Klamroth, Wincent Weiss, 2RaumWohnung, Alexandra Popp und Ruth Moschner.
