  subtitle: Hitler - Eine deutsche Tragödie - Ein Kriegsverbrecher
  description: 'Hitler - Ein Kriegsverbrecher (1943 bis 1944): Hitlers militärische Entscheidungen, oft gegen den Rat seiner Generäle, führen zu katastrophalen Folgen. Nach der Niederlage in Stalingrad wird klar, dass der Krieg verloren ist. Die Westalliierten besiegen Rommels Truppen in Afrika und landen in Italien, während die Russen die deutsche Armee im Osten zurückdrängen. Trotz dieser Entwicklungen weigert sich Hitler, eine Niederlage zu akzeptieren.'
