  title: Mad - Eine Heldin im Schatten
  description: Bekannt unter dem Codenamen "Source Mad", ist sie eine der diskretesten und wichtigsten Agentinnen des französischen Geheimdiensts im Zweiten Weltkrieg. Mit Erwin von Lahousen-Vivremont, einem österreichischen Offizier, der die deutsche Uniform trug, einem der Hauptzeugen der Anklage im Nürnberger Prozess, bildete sie ein besonders ungewöhnliches und effektives Paar gegenüber dem Nazi-Regime.
