  title: Kochen mit Anixe - Geschmorter Chicorée mit Orangenbutter und Skrei
  subtitle: Kochen mit Anixe - Geschmorter Chicorée mit Orangenbutter und Skrei
  description: Skrei ist ein außergewöhnlicher Kabeljau, der sich erheblich von seinen Brüdern aus der gleichen Fischfamilie unterscheidet. Der Norwegische Winterkabeljau ist kulinarisch ein Edelfisch. In Kombination mit Orangenbutter, zaubert unser TV Koch Jörg Guhmann etwas ganz besonderes daraus. Außerdem erfahren Sie zusammen mit unserer Moderatorin, wie man Chicoree schmort. Denn das aromatische Wintergemüse kann man sowohl kalt, als auch warm zubereiten.   Hier das komplette Rezept!
