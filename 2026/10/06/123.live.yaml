  title: Laß jucken, Kumpel
  subtitle: Laß jucken, Kumpel
  description: 'Hinter der Kulisse des grauen Waldes aus Schornsteinen und Fördertürmen blüht für die Kumpel mit ungeahnter Vehemenz eine üppige Blume: der Sex! Der harte Lebensrhythmus ihres grauen Alltags heißt: Arbeit, Bier und Bett. Doch eines Tages gerät der Kumpel Heiner Lenz zwischen zwei Förderwagen und wird schwer verletzt. Es sieht fast so aus, als wäre für ihn in Zukunft das Bett nur noch zum Schlafen da. Aber seine Frau hat keine Lust, so lange auf jeden Spaß zu verzichten. Ge 1972'
  ageRating: 18
