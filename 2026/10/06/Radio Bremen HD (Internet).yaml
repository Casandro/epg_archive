  title: In aller Freundschaft (319)
  subtitle: Zu zweit allein
  description: Die 38-jährige Unternehmergattin Sabrina Hellermann bricht auf einem Empfang des Gesundheitsdezernenten Steffen Frahm zusammen. Professor Simoni, der mit seiner Verwaltungschefin Sarah Marquardt an dem Empfang teilnimmt, lässt sie in die Sachsenklink bringen. Bei der Untersuchung stellen er und Dr. Globisch Schnittverletzungen und Narben an den Extremitäten und am Bauch der Patientin fest. Es sind typische Verletzungen, die sich Menschen mit selbstverletzendem Verhalten beibringen.
