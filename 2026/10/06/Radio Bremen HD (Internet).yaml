  description: |-
    Er steht für Zivilcourage, Unabhängigkeit und die Kraft des freien Wortes: Wolf Biermann. Seine Stimme, seine
    Liedtexte und Gedichte haben Generationen geprägt, sein Leben macht Brüche, Schwachstellen, Chancen und
