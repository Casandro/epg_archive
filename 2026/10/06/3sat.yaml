    Auf La Gomera verfangen sich die Passatwolken in den Bergen und spenden einem jahrtausendealten, immergrünen Nebelwald Feuchtigkeit. Die Felsen vulkanischen Ursprungs schichten sich zu bizarren Formationen auf. Massentourismus blieb der Insel bis heute erspart.
