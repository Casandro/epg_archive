  description: Jeder kennt die Rettungswagen vom BRK, die mit Blaulicht und Martinshorn ausrücken, um Menschen zu helfen. Aber das ist nur ein kleiner Teil der Aufgaben, denn die reichen vom Essen auf Rädern über die Wasser- und Bergwacht bis hin zur Katastrophenhilfe. Das Bayerische Rote Kreuz ist die größte Hilfsorganisation im Freistaat - mit 31.000 festangestellten und über 210.000 (!) ehrenamtlichen Mitgliedern. Welche Herausforderungen die Helfer sehen, was ihnen Kopfzerbrechen macht und welche Unterstützung sie sich wünschen, erklärt Präsident Hans-Michael Weisky im Gespräch mit Marion Gehlert in der Bayern Agenda.
