  description: Režisér a scénárista David Ondříček se se svým novým filmem vrací do současné Prahy a ke kořenům své tvorby. V komedii Kluci to vidí jinak než holky sleduje sedm lidí, kteří hledají lásku, směr i odvahu něco ve svém životě změnit. Proč měl potřebu vrátit se k příběhům lidí kolem sebe? A proč říká, že natočil možná svou nejsmutnější komedii? Moderuje Libor Bouček.
