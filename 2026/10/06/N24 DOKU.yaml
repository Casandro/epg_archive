  title: Spacetime
  subtitle: Das Licht - Einem Phänomen auf der Spur
  description: Welchen Einfluss hat Licht auf uns? Wo kommt es her? Der Astronaut Prof. Ulrich Walter geht der elektromagnetischen Strahlung auf den Grund und klärt auf, wie sich die übermäßige Helligkeit der Erde auf uns auswirkt. Speziell für Astronomen ist die Lichtverschmutzung ein echtes Problem - sie brauchen einen dunklen Nachthimmel, um mit Teleskopen die Galaxien zu erforschen. Wissenschaftler verschiedener Institute erläutern das Phänomen Licht und weshalb es mehr ist als nur Helligkeit.
  widescreen: true
