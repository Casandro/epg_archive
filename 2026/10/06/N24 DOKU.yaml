  title: 'Strip the Cosmos: Geheimnisvoller Jupiter'
  subtitle: 'Strip the Cosmos: Geheimnisvoller Jupiter'
  description: Wem unser Heimatplanet zu vertraut und der wüste, leblose Mars zu langweilig ist, der findet in Jupiter eine spannende Alternative. Auf dem Gasriesen wüten gigantische Stürme und monströse Magnetfelder, sein Kern ist heißer als die Oberfläche der Sonne. Und sein feuriger Mond Io hat die größte vulkanische Aktivität im gesamten Sonnensystem. Die NASA-Raumsonde Juno liefert seit 2016 faszinierende neue Erkenntnisse über den planetaren Platzhirsch mit dem berühmten "roten Fleck".
