  subtitle: Der neue Aufbruch ins All - Mit Superraketen zu fremden Welten
  description: Mit welchem Raumschiff wird die Menschheit den Mars erreichen? Welcher Antrieb ist nötig? Der Milliardär Elon Musk hat mit seinen Konstruktionen die Raumfahrt revolutioniert. Auch andere Unternehmer wittern im Weltraum-Tourismus ein rentables Geschäft. Das US-amerikanische Raumschiff Orion soll den Grundstein für zukünftige Reisen zu unseren planetaren Nachbarn legen. "Spacetime" geht mit einem NASA-Ingenieur an Bord der Orion und gibt einen spannenden Einblick in weitere ehrgeizige Projekte.
