- eventId: 709532
  start: 2026-10-06T13:10:00Z
  stop: 2026-10-06T14:00:00Z
  title: Hubert und Staller (67)
  subtitle: Der letzte Akkord
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kircheneinbruch mit Folgen: Hubert und Staller geht auf Streife ein dreister Einbrecher in die Fänge, der am helllichten Tag versucht, die Tür eines Gotteshauses aufzubrechen. Doch der vermeintliche Dieb entpuppt sich als Kantor Rainer Bentzer, der sich Sorgen um seinen Organisten macht. Denn seit Längerem dröhnt die Orgel unverändert auf einem Akkord aus der geschlossenen Kirche. Als Hubert und Staller schließlich die Tür aufbrechen und auf die Empore stürmen, bestätigt sich die schlimme Vorahnung des Kantors: Organist Wolfgang Otten liegt leblos auf den Tasten seines Instruments!'
