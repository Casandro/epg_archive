    Hans Gerzlich hat Wirtschaftswissenschaft studiert und war Vorstandsreferent bei einem großen Energiekonzern, bevor er 2001 ins Kabarett wechselte. Nahezu seit Anbeginn beschäftigte er sich in seinen Programmen daher mit der Arbeitswelt: Büro, Büro!
