  subtitle: W sieciach rybackich znalezione zostaje ciało kobiety. Dzięki cukierkom o smaku mango, które znaleziono w pobliżu, Candice udaje się wpaść na trop mordercy.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Samira Lachhab, Gaya Verneuil, Delphine Rich, Stéphane Blancafort
    W sieciach rybackich znaleziono ciało kobiety. Dzięki cukierkom o smaku mango, które znaleziono w pobliżu, Candice udaje się wpaść na trop mordercy. Dlaczego mężczyzna obrał za cel matkę pracującą na co dzień jako kasjerka w pobliskim supermarkecie, której ulubioną formą spędzania wolnego czasu był udział w konkursach publikowanych na łamach gazet? Candice odkrywa, że ofiara miała przygotowany bagaż. Może uciekała przed czymś lub przed kimś?
