  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nNach Missbrauchsstudie: Wilmer fordert, dass Geistlicher Missbrauch strafbar wird\nDer Vorsitzende der katholischen Deutschen Bischofskonferenz, Heiner Wilmer, fordert die Anerkennung von geistlichem Missbrauch als eigenständige Form von Gewalt im Kirchenrecht. Er wolle sich im Vatikan für eine Strafbarkeit von geistlichem Missbrauch einsetzen, sagte der Bischof von Münster am Montag in Münster. Forscher der dortigen Universität hatten Ende September eine Pilotstudie zu geistig-spirituellem Missbrauch in der katholischen Kirche vorgestellt.\n\nOppositionelle Kirche in der DDR: Vorbild für heutige Solidarität? \nIn der Endphase der DDR haben kirchliche Gruppen aktiv Widerstand gegen das SED-Regime geleistet. Unter anderem der ?Arbeitskreis Solidarische Kirche?, der im Oktober 1986 gegründet wurde. Zum 40. Jahrestag fragt eine Tagung in Potsdam: Welche Impulse können noch ausgehen von den damaligen kirchlichen Oppositionellen für ein solidarisches Miteinander heute? \n\nEvolutionärer Humanismus: Michael Schmidt-Salomon und der Glaube an den Menschen\nIn postmodernen Gesellschaften suchen nicht-religiöse Menschen nach Antworten auf existenzielle Fragen. ..."
