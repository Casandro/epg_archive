    Von Alexandra Bidian
    Regie: Giuseppe Maio
    Redaktion: Ulrike Toma
    NDR 2026

    Ihr Vater ist 2013 mit 83 Jahren gestorben. Da war Maria 24, Alexandra 21 Jahre alt. Sein Testament endete mit den Worten, dass seine Töchter in seinem Willen weiterleben sollen. Was heißt das? Wie sollen sie leben? Hütete der Vater ein Geheimnis?
