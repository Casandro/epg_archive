  title: Sprechstunde
  description: "Demenz\nWas Angehörige wissen sollten\n\nGäste:\nProf. Dr. Alexandra Wuttke, Professorin für Klinische Psychologie und Psychotherapie des höheren Lebensalters, Uniklinik Konstanz\nUwe Oster, Altenpfleger und Demenzexperte, LVR-Klinikum Düsseldorf\nAm Mikrofon: Christina Sartori\n\n?Ich kann mich kaum um mich selbst kümmern?\nOmid Hegran Djuya, ein Betroffener aus Beuel, berichtet\n\nAktuelle Informationen aus der Medizin:\nDer Nobelpreis für Medizin 2026: Was steckt dahinter? \nGespräch mit Martin Winkelheide, Wissenschaftsjournalist\n\nPDA-Spritze während der Geburt\nWarum lehnen viele Frauen sie ab?\n\nHörertel.: 00800 4464 4464\nsprechstunde@deutschlandfunk.de\n10:30-10:35 Nachrichten\n\n11:00-11:05 Nachrichten"
