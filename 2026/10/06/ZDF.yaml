    Krimiserie, Deutschland 2017
    Claudia und Tarik werden zu einem Wohnungseinbruch gerufen. Vor Ort finden sie jedoch statt der Einbrecher nur noch Paul vor, den verängstigten 14-jährigen Sohn des Hauses.

    Doch bald stellt sich heraus, dass der Junge in Wirklichkeit Dustin heißt, nicht zur Familie gehört und selbst der Einbrecher ist. Haller verdonnert Claudia und Tarik dazu, auf Dustin aufzupassen. Der geht den beiden mit immer neuen Lügengeschichten auf die Nerven.
