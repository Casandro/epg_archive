    Großbritannien 2022
    Nach Billys Tod ist Lana am Boden zerstört. Unter Auflagen erhält sie von ihrer Vorgesetzten die Erlaubnis, sofort wieder in den Dienst zurückzukehren - die nächste Bombe wird entdeckt.

