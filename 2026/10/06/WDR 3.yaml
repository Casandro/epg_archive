  title: WDR 3 Open
  description: "Am 10. Oktober hätte der US-amerikanischer Sänger, Songwriter und Bürgerrechtsaktivist Oscar Brown Jr. seinen 100. Geburtstag feiern. Seine poetischen Texte (zu Songs wie \"Chain Gang\" oder \"Work Song\") machten ihn zu einer Schlüsselfigur des politischen Jazz. Angefangen hat er als Radiomoderator mit der ersten Nachrichtensendung für Afroamerikaner*innen. Ende der 40er moderierte er die Serie \"Destination Freedom\" über wichtige Schwarze historische Schlüsselfiguren, wie Harriet Tubman oder George Washington Carver. Er war Mitglied in der Kommunistischen Partei und kandidierte (als Republikaner!) für den Kongress. \nAußerdem: Echos der Gegenwart im neuen Album Ebow.\n<strong>Echos </strong>| 7m 22s<br/>Erykah Badu\n<strong>Brother Where Are You (Matthew Herbert Remix)</strong> | 4m 04s<br/>Oscar Brown Jr.\n<strong>My Queen Is Harriet Tubman</strong> | 5m 41s<br/>Sons Of Kemet\n<strong>Brown Baby</strong> | 3m 07s<br/>Oscar Brown Jr.\n<strong>Chain Gang (The Work Song)</strong> | 2m 40s<br/>Nina Simone\n<strong>Assata's Daughters (Interlude)</strong> | 0m 24s<br/>Jamila Woods\n<strong>Blk Grl Soldier</strong> | 3m 23s<br/>Jamila Woods\n<strong>Independent (Cleo)</strong> | 3m 41s<br/>Ebow\n<strong>Gorilla</strong> | 4m 05s<br/>Little Simz\n<strong>Who Am I</strong> | 3m 16s<br/>Beenie Man\n<strong>Mein Name ist Ausländer (Skit)</strong> | 1m 11s<br/>Ebow\n<strong>Lauf der Dinge</strong> | 2m 38s<br/>Ebow\n<strong>Tryin' Times</strong> | 5m 07s<br/>Roberta Flack\n<strong>Konfusion II </strong>| 4m 03s<br/>Kinderzimmer Productions\n<strong>Enough </strong>| 3m 21s<br/>Dawn Richard"
  subtitle: Echos
