  title: WDR 3 Konzert
  description: |-
    Andreas Martin Hofmeir war der erste Tubist, der den Deutschen Musikwettbewerb gewann und einen ECHO Klassik bekam. Er lehrt am Mozarteum, spielte bei LaBrassBanda und gründete das erste Tuba-Harfen-Duo der Welt. Bei Jörg Duda führt die Tuba das Orchester immer wieder an. Hofmeir behält sie im Schoß, hebt sie immer wieder hoch, setzt an und spielt mit weichem Ton und sehr beweglich. Drumherum Musik zwischen Aufbruch und Exil.
    <strong>Erich Wolfgang Korngold</strong><br/>Sinfonische Ouvertüre "Sursum corda!" op. 13
    <strong>Jörg Duda</strong><br/>Tubakonzert Nr. 1, op. 67,1
    <strong>Richard Strauss</strong><br/>"Tanz der sieben Schleier" aus der Oper "Salome" op. 54
    <strong>Kurt Weill</strong><br/>Sinfonie Nr. 2
    <strong>Andreas Martin Hofmeir</strong>, Tuba<br/><strong>Bergische Symphoniker<br/></strong>Leitung: <strong>Daniel Huppert</strong>
    Aufnahme vom 7. Juli 2026 aus dem Theater und Konzerthaus Solingen
    Moderation: Philipp Quiring<br/>Redaktion: Frank Hilberg
  subtitle: 'Moderation: Philipp Quiring'
