  title: WDR 3 Jazz
  subtitle: Der Geheime Garten des Jazz
  description: |-
    Der Pianist Eugen Cicero wurde durch seine Mitwirkung in Paul Kuhns SFB Big Band für einige Jahre zu einer prominenten Fernsehfigur. Unter seinen vielen Alben gibt es eines mit Top-Solisten wie Benny Bailey und Don Menza. Selbst der alte Schlagzeug-Haudegen Freddie Brocksieper war dabei. Niemand hat sich diese Platte 1968 angehört. Götz Alsmann schon, aber das war es für ihren Erfolg zu spät!
