  title: In 80 Gärten um die Welt
  subtitle: Britische Gärten - Highlands und Northumberland
  description: "Der britische Gartenexperte Monty Don erkundet sein Heimatland, um der britischen Leidenschaft für Gärten auf den Grund zu gehen. Die erste Etappe führt ihn durch Schottland bis nach Northumberland: von der wilden Nordwestküste über Glasgow und Edinburgh bis an die englische Grenze. \nIn Inverewe zeigt sich, wie der Golfstrom selbst in den rauen Highlands eine erstaunliche Pflanzenvielfalt ermöglicht. Ganz in der Nähe haben Sue Pomeroy und Will Soos in Durnamuck einen persönlichen Traumgarten geschaffen, der Wind, Wetter und südafrikanische Pflanzen auf überraschende Weise verbindet. In Perthshire besucht Monty die imposanten Drummond Castle Gardens, ein selten erhaltenes Beispiel viktorianischer Gartenkunst. In Glasgow beeindruckt ihn der Kibble Palace, eines der großen historischen Gewächshäuser Großbritanniens. Ein besonderer Abstecher führt nach Birkhall, dem schottischen Rückzugsort von König Charles III. und Königin Camilla, wo Garten, Geschichte und persönliche Handschrift eng miteinander verwoben sind.\nIn Edinburgh entdeckt Monty Gärten als Orte der Gemeinschaft und Heilung: Dr Neil's Garden, Jock Tamson's Gairden und die privaten Regent Gardens. Mit Little Sparta und Crawick Multiverse begegnet er zwei Anlagen, die die Grenzen zwischen Garten, Kunst und Landschaft neu ausloten. Zum Abschluss führt die Reise nach Northumberland: zum exzentrisch restaurierten Chillingham Castle und zum modernen Alnwick Garden, der bewusst für die Menschen der Region geschaffen wurde. Eine Folge über Landschaft, Geschichte, Mut, Eigenwilligkeit und die Frage, was britische Gartenkultur im Kern ausmacht.\nDokumentarfilm, Vereinigtes Königreich 2025,  M: Monty Don"
  genre:
  - '145'
  widescreen: true
