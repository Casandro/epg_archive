  title: Hubert und Staller
  subtitle: Rauchen ist tödlich
  description: |-
    Eigentlich sollen Hubert und Staller in Girwidz' Auftrag nur eine Kiste kubanische Zigarren für den Geburtstag des Stadtrats Josef Sandinger abholen. Doch dann offenbart sich einmal mehr, warum Rauchen tödlich sein kann: Die beiden Ermittler stolpern über die Leiche des Inhabers der einzigen Wolfratshauser Zigarrenlounge, Franz Jäckl. Niedergestreckt mit einem schweren Aschenbecher, hat ihm sein Mörder noch zusätzlich eine seiner Lieblingszigarren in den Mund gesteckt. Für Staller ein unmissverständlicher Hinweis darauf, dass man hier einen redseligen Zeugen zum Schweigen bringen wollte. Sehr bald finden Hubert und Staller bei den Ermittlungen heraus, dass Zigarren durchaus eine lukrative Geldanlage sein können. Durch ihre Kollegin Sonja Wirth müssen die beiden Polizisten schließlich erkennen: Das Offensichtliche ist nicht immer das Motiv.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.
    Krimi, Deutschland 2016, R: Sebastian Sorger
