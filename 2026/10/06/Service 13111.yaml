  title: Heimatleuchten
  subtitle: Die geheilte Bergbäuerin und der studierte Messerschmied
  description: |-
    Angelina Pucher leidet an Bulimie, Magersucht und Depression. Doch die Kraft der Natur am Großglockner heilt sie. Als Bergbäuerin führt sie heute ein glückliches Leben mit vier Kindern. Albert Anglbergers Karriere scheint vorgezeichnet. Als Doktor der Philosophie erhält er die höchstdotiertesten Stipendien. Doch dann entscheidet er sich, seinen Kindertraum Kindheitstraum wahrzumachen und wird Messerschmied. In der vielleicht ungewöhnlichsten Schmiede Österreichs schafft er wahre Meisterwerke. Gegen den Strom schwimmern und im Anderssein Kraft finden, das verbindet Angelina Pucher und Albert Anglberger, die doch unterschiedlicher nicht sein könnten.
    Volkskultur, Österreich 2025, R: Florian Guthknecht
