  title: 'Terra Mater - Die Erde: Ein Planet im Portrait'
  subtitle: Land (2/3)
  description: |-
    Unsere Erde ist kein starrer Planet, sondern in ständigem Wandel begriffen, wie Vulkane und Geysire beweisen. Im Erdinneren brodelt es -  die tektonischen Platten sind immer in Bewegung. Wenn sie aneinander stoßen und reiben, können sie Erdbeben oder Tsunamis verursachen. Aber diese zerstörerischen Kräfte können auch Leben schaffen: Seit Urzeiten haben unterseeische Vulkane Inseln hervorgebracht. Und dieser neue Lebensraum wird mit der Zeit von den verschiedensten Wesen besiedelt. Den ersten Pflanzen, deren Samen vom Wind verfrachtet wurden, folgen Insekten, Vögel und schwimmfähige Tiere. Zahllose Lebewesen nutzen Boden, Land und Erde als Zufluchtsort, Lebensraum - und sogar als Baumaterial.
    Natur, Österreich 2018, R: Petra Lederhilge
  genre:
  - '145'
  widescreen: true
