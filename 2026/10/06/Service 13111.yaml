  description: In einer großen Dokumentation würdigt die Redaktion von "Bergwelten" den Historiker und Bergsteiger Herbert Tichy. Sport und Talk aus dem Hangar-7 lenkt im Anschluss daran den Blick auf weitere Pioniere am Berg. Peter Habeler, der Mann, der gemeinsam mit Reinhold Messner als erster Mensch den Mount Everest ohne die Hilfe von Flaschensauerstoff bezwang, blickt auf sein Lebenswerk zurück. Ein Lebenswerk, für das ihm im Oktober der Piolet d _Or, der Goldene Eispickel, besser bekannt als "Oscar des Alpinismus" verliehen wird. Ebenfalls zu Gast ist Simon Messner. Der Sohn der Alpinlegende steht für eine neue Generation von Kletterern, die ihre Ziele und Herangehensweisen neu definieren müssen. Seinen eigenen Zugang hat Hans Wenzl gefunden, der die 8000er der Erde vorzugsweise im Alleingang bezwingt.Österreich 2026
