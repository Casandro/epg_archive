  title: Bares für Rares
  subtitle: Ein Hauch von Paris
  description: |-
    Eine Büste aus Marmorstaub, ein zufälliger Fund der beiden Verkäufer, soll im Pulheimer Walzwerk einen neuen Besitzer finden! Doch sind die Händler und Händlerinnen interessiert an der Darstellung der jungen Bäuerin, die nach unten blickt und ein Amulett trägt? Kommt großes Interesse im Händlerraum auf? Oder gibt es gar Bietergefechte? Die Büste wurde ursprünglich vom Künstler Fernand Cian entworfen und war auf dem Pariser Salon von 1911 sehr erfolgreich. Das vorliegende Exemplar aus gepresstem Marmorstaub ist vermutlich zwischen 1911 und den 1920er Jahren entstanden, so die Expertin Dr. Bianca Berding. Doch wie taxiert die Fachfrau die dekorative Büste? Kann die junge Bäuerin in der Expertise und im Händlerraum überzeugen? Wird womöglich die preisliche Einschätzung der Expertin im Händlerraum sogar noch verdoppelt? Es bleibt spannend!
    Show, Deutschland 2024, R: Sheila Bär-Mertens, Peer Petrowski M: Horst Lichter
