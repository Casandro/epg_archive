  title: Hubert ohne Staller
  subtitle: Mord mit 1.600 Umdrehungen
  description: "Hubert verbringt einen freien Tag mit Angeln an der Loisach und zieht eine Leiche an Land, weshalb er kurz darauf den Kollegen Girwidz und Riedl Rede und Antwort stehen muss. Zunächst mal spricht alles dafür, dass das Opfer, ein alter Mann, ausgerutscht und in die Loisach gefallen ist. Girwidz hätte trotzdem gerne, dass Hubert und nicht Riedl ihn bei dem Fall unterstützt. Hubert lässt sich breitschlagen und tatsächlich, als die beiden der Witwe die Todesnachricht überbringen wollen, stellt sich nicht nur heraus, dass die bereits verstorben ist. Es finden sich im Haus des Toten auch deutliche Spuren eines Einbruchs! Auch der Befund aus der Pathologie gibt Rätsel auf - der alte Mann ist zwar ertrunken, dass Wasser in seiner Lunge enthält aber Reinigungsmittel und stammt nicht aus der Loisach. Die Ermittler stehen vor einem Rätsel. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
  widescreen: true
- eventId: 1441587
  start: 2026-10-06T19:14:33Z
  stop: 2026-10-06T20:15:28Z
  title: Hubert ohne Staller
  subtitle: Harte Landung
  description: |-
    Eine hupende Alarmanlage führt Hubert und Girwidz in den Hochseilgarten von Wolfratshausen. Erst vermuten sie einen Einbruch, dann einen Fehlalarm, bis sie den Besitzer des Kletterparks unter einer Plattform entdecken: tot. Dr. Fuchs findet schnell raus, dass es sich bei dem Absturz um keinen klassischen Arbeitsunfall handelt, denn die Spuren an der Leiche deuten auf einen vorangegangenen Zweikampf in zehn Meter Höhe hin. Als die Polizisten rausfinden, dass das Gelände des Parks verkauft werden sollte, führen alle Hinweise zum Bruder des Toten, der den Verkauf mit aller Macht verhindern wollte. Aber war es wirklich Brudermord? Und welche Rolle spielt dabei der Käufer des Geländes, von dem der Tote ein zerrissenes Foto in der Tasche hatte? Auf die Hilfe der Kollegen müssen Hubert und Girwidz dieses Mal fast komplett verzichten, denn die haben mit einem Findelkind aus der Bäckerei bereits alle Hände voll zu tun.

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Matthias Steurer
  widescreen: true
- eventId: 1365012
  start: 2026-10-06T19:15:00Z
  stop: 2026-10-06T20:15:00Z
  title: Hubert ohne Staller
  subtitle: Harte Landung
  description: |-
    Eine hupende Alarmanlage führt Hubert und Girwidz in den Hochseilgarten von Wolfratshausen. Erst vermuten sie einen Einbruch, dann einen Fehlalarm, bis sie den Besitzer des Kletterparks unter einer Plattform entdecken: tot. Dr. Fuchs findet schnell raus, dass es sich bei dem Absturz um keinen klassischen Arbeitsunfall handelt, denn die Spuren an der Leiche deuten auf einen vorangegangenen Zweikampf in zehn Meter Höhe hin. Als die Polizisten rausfinden, dass das Gelände des Parks verkauft werden sollte, führen alle Hinweise zum Bruder des Toten, der den Verkauf mit aller Macht verhindern wollte. Aber war es wirklich Brudermord? Und welche Rolle spielt dabei der Käufer des Geländes, von dem der Tote ein zerrissenes Foto in der Tasche hatte? Auf die Hilfe der Kollegen müssen Hubert und Girwidz dieses Mal fast komplett verzichten, denn die haben mit einem Findelkind aus der Bäckerei bereits alle Hände voll zu tun.

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Matthias Steurer
