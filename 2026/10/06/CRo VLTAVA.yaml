  title: ArtCafé
  description: 'Ponor do hlubin porevoluční pop music bez dýchacího přístroje a jištění. Karel Veselý se vydává do hájemství Lucie, Tublatanky nebo Viktora Sheena. Touhy a sny v podobě slalomu mezi hitparádami: uprostřed škádlivě laciných šlágrů nachází autor nečekané společenské vzorce nebo taktiky, na půdorysu chytlavých sloganů nabízí potenciální klíč k pochopení současnosti. Říkal tady někdo, že je to jenom pop? Karel Veselý představuje svou novou knihu, moderuje Michal Pařízek. E-mail: artcafe@rozhlas.cz'
