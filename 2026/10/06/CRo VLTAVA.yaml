  description: V pražské Galerii Magnus Art je teď k vidění část sbírky lékaře, diplomata a dlouholetého sběratele Oldřicha Uttendorfského. Jsou v ní i umělecká díla současných českých výtvarníků a sochařů. Po kterých tvůrcích sběratelé dnes nejvíce prahnou? Proč je sběratelství umění v Česku na vzestupu? Saša Michailidis se ptá Antonína Jiráta a poradce a Adama Hnojila.
