  title: Vizitka
  description: Šárka Rambousková, pedagožka, kulturní organizátorka. Vyučuje češtinu a základy společenských věd na Gymnáziu Broumov. Mimo to je také hybatelkou ve městě o zhruba sedmi tisících obyvatelích, které v posledních letech zažívá kulturní vzedmutí. Ve výuce využívá toho, že do Broumova přijíždějí čeští i zahraniční spisovatelé a překladatelé. Nejen je pravidelně zve na gymnázium a pořádá s nimi besedy. "Studenty chci rozhýbat, naplňuje mě, když vidím, že to má cenu," popisuje ve Vizitce. Co všechno se dá učit mimo osnovy? Nakolik se díky celé řadě kulturních akcí, kterými město žije, proměnili obyvatelé Broumova? A proč ji baví provázet v jednom z broumovských kostelů? Ptá se Ondřej Cihlář. Repríza z 10. 9. 2026
