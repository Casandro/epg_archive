  subtitle: Jeden Montag dreht sich bei HoamSpui live alles um den Sport mit Patrick Ehelechner und Benedikt Schnitzenbaumer.
  description: 'Slackline-Star Friedi Kühne hat auf fast allen Kontinenten spektakuläre Highlines gemeistert und Grenzen verschoben, zuletzt mit Lukas Irmler: In 2.500 Metern Höhe balancierten sie zwischen zwei Heißluftballons über 19 Meter und stellten nach monatelanger Vorbereitung einen Weltrekord auf.'
- eventId: 1278474
  start: 2026-10-06T14:00:00Z
  stop: 2026-10-06T14:10:00Z
  title: Süd Journal vom 5.10.2026 (Wh.)
  subtitle: Rosenheim - Wenn Hilfe vor der Haustür beginnt +++ Sterne des Sports - Rosenheimer Vereine für besonderes Engagement ausgezeichnet +++ Bauarbeiten an Bahnstrecke +++ Leistungsprüfung Feuerwehr +++ Sommerfestival mit weiter..
  description: 'In Rosenheim sucht das Projekt Sozialraumorientierte Hilfen im Alter nach Wegen, damit Seniorinnen und Senioren länger selbstbestimmt zu Hause leben können, und diskutierte im Bürgerhaus Miteinander mit Trägern, Caritas und Pflegebevollmächtigter Staffler über wohnortnahe Hilfe. +++ In Rosenheim verlieh die meine Volksbank Raiffeisenbank mit dem DOSB die Sterne des Sports an Vereine mit besonderem gesellschaftlichem Einsatz: Bronze-Sieger ist der RocknRoll Club Rosenheim 1977 für die Integration ukrainischer Jugendlicher, zweite Plätze gingen an TSV Babensham und TSV 1920. +++ In der Nacht vom 15. auf den 16. Oktober führen Bauarbeiten der DB InfraGo AG im BRB-Netz Chiemgau-Inntal zu Fahrplanänderungen: Auf der Strecke Holzkirchen-Rosenheim gibt es Abweichungen, zwischen Holzkirchen und Kreuzstraße fährt Ersatzverkehr mit Bussen. +++ Am Donnerstag stellten sich aktive Mitglieder der Freiwilligen Feuerwehr Atzig erneut der Leistungsprüfung, diesmal in zwei Gruppen mit Führungskräften, Maschinisten sowie Männern und Frauen; die Kreisbrandinspektion Rosenheim nahm ab und überreichte nach bestandener Praxis die Abzeichen. +++ Rockstar Bryan Adams spielt beim Sommerfestival Rosenheim 2027: Nach der ausverkauften Arena-Tour bringt er seine Show am 8. Juli als Open-Air auf die Bühne, der Vorverkauf startet Donnerstag um 10 Uhr, ab Freitag gibt es Karten auch am KU''Ko-Schalter.'
- eventId: 1278475
  start: 2026-10-06T14:10:00Z
  stop: 2026-10-06T14:20:00Z
  title: Süd Journal vom 5.10.2026 (Wh.)
  subtitle: 200 Jahre Sparkasse Wasserburg - Der Animationsfilm zum Jubiläum +++ Der stationäre Handel lebt +++ Basketball Highlights 1880 Wasserburg gegen MTV Stuttgart
  description: 'Josef Heiserer zeichnet die Entwicklung der 1826 als dritter Sparkasse Oberbayerns gegründeten Sparkasse Wasserburg nach, die von Spareinlagen zu Krediten wuchs, Inflation und Fusionen überstand, 1948 neu startete und heute dank Technik in mehreren Landkreisen regional verankert ist. +++ Die Rosige Nacht in Rosenheim zeigte die Stärke des stationären Handels: Mit Lichtern, Musik und Kleinkunst strömten viele Besucher auf Max-Josefs- und Ludwigsplatz, bummelten entspannt bis nach 22 Uhr, und die Händler zeigten sich zufrieden. +++ Zum Start der 2. Damen-Basketball-Bundesliga Süd siegte der TSV Wasserburg 71:62 gegen den MTV Stuttgart, lief in pinken Pinktober-Trikots zur Krebsvorsorge auf und überzeugte trotz zweier Ausfälle mit Tempo, angeführt von Abby Way und Larry McFarlane.'
- eventId: 1278476
  start: 2026-10-06T14:20:00Z
  stop: 2026-10-06T14:30:00Z
  title: Süd Journal vom 5.10.2026 (Wh.)
  subtitle: Regionalliga Bayern +++ Erster Auswärtssieg der Starbulls +++ Wasserburger Basketballerinnen holen Heimsieg  +++ Wetter für das Sendegebiet
  description: 'Tabellenführer TSV Buchbach kassierte nach elf Spielen ohne Pleite beim 0:2 gegen Aufsteiger SC Eltersdorf die erste Niederlage, bleibt aber mit nur noch drei Punkten vor Memmingen vorn; Burghausen verlor 0:1 in Eichstätt und sah Rot in der Nachspielzeit. +++ Die Starbulls Rosenheim feierten bei den Roten Teufeln Bad Nauheim mit einem 2:1 am Sonntag ihren ersten Auswärtssieg, drehten nach frühem Rückstand das Spiel und verschafften sich mit nun sechs Punkten Luft im Tabellenkeller. +++ Mit dem 71:62 gegen den MTV Stuttgart im heimischen Badria feierten die Basketballerinnen des TSV 1880 Wasserburg in der 2. DBBL Süd ihren ersten Saisonsieg, warben in Pink für Brustkrebsvorsorge und entschieden das Spiel mit einem 21:10 im dritten Viertel trotz Ausfalls einer Schlüsselspielerin. +++ Der Altweibersommer bleibt bis Mittwoch: Am Dienstag dominiert vielerorts Sonne, im Norden ziehen dichtere Wolken auf, und am Mittwochabend drohen im Westen erste Gewitter, bevor am Donnerstag eine Kaltfront mit Wind und Starkregen folgt und es herbstlich wird.'
