  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: Válka, hlad, epidemie. Pro nás jsou to zprávy. Pro Lékaře bez hranic každodenní realita. Jak se pracuje tam, kde se bojuje o život a někdy i o samotnou možnost otevřít nemocnici? A proč některé humanitární krize zůstávají téměř bez pozornosti? Hostem Hovorů je Tomáš Bendl, ředitel české kanceláře Lékařů bez hranic. Moderuje Naděžda Hávová.
