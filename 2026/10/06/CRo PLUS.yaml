  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (7/10). Uvnitř legendy o svatém Františkovi má své místo i legenda o svaté Kláře. Právě František jí ustřihl vlasy a odvedl ji do kláštera Benediktinek, který považoval za bezpečný. Před čím nebo kým ji chtěl chránit? A jaký vztah mezi sebou měli Klára a František? Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
