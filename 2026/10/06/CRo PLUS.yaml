  title: Jak to bylo doopravdy
  description: Stal se údajně amorální a vulgární básník jedním z pilířů naší literatury? Zamyšlení nad životem, dílem a odkazem ne-anarchisty a ne-buřiče, básníka Františka Gellnera, nabídnou Ivana Chmel Denčevová spolu s literárním a výtvarným kritikem a publicistou Radimem Kopáčem.
