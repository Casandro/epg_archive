  description: Nedožité devadesátiny Václava Havla a proč na něj myslí příslušníci starší generace. Někdy je lepší, když vlády své sliby neplní, předejde se katastrofám. Jak to dnes vypadá s bytem jako investicí. Předznamenávají zesílené útoky na Kyjev těžkou zimu? Pondělní vydání Názorů a argumentů moderuje Ondřej Konrád.
