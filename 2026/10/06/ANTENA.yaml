  title: Niezwykły dr Pol 5 (odc. 37)
  subtitle: Ekscentryczny Dr Pol prowadzi klinikę dla zwierząt w Michigan. Jego pacjentami są zarówno stworzenia hodowane przez człowieka jak i te żyjące na wolności. W codziennej pracy pomaga mu m.in. żona.
  description: |-
    Tytuł oryginalny: The Incredible Dr. Pol
    US
    Występują: Jan Pol, Charles Pol
    Spotkanie z weterynarzem Janem Polem, który prowadzi klinikę na farmie w Michigan. W pracy pomagają mu żona, Diane, oraz doktor Brendy. Po 31 latach spędzonych w branży, nic nie jest w stanie zdziwić doktora Pola i jego wyszkolonej kadry specjalistów. Klienci prawie 70-letniego weterynarza są pod wrażeniem jego niekończącej się energii. Z pomocą syna Charlesa i charakterystycznym dla siebie staromodnym podejściem, mężczyzna leczy małe i duże zwierzęta w klinice na farmie.
