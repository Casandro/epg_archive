    Załoga Posejdona uruchamia swój wart milion dolarów przesiewacz z nadzieją, że uda im się uratować drugi tydzień sezonu. Shane i Russell ponownie udają się na odludzie. Zakończone pierwszego dnia sukcesem poszukiwania motywują ich do wyznaczenia sobie nowego celu. Tymczasem ekipa Dust Devils odnosi klęskę, gdy w trakcie realizowania swojego największego i najdroższego do tej pory projektu, ich kruszarka nagle ulega poważnej awarii.
