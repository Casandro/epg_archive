  title: Host Dopoledne pod Ještědem
  description: 'Téma: Vše o pneumatikách. Majitel firmy Autoservis-Elektroservis Jiří Černý. Zimní pneumatiky mají smysl, jen když napadne sníh. Tlak v kolech stačí zkontrolovat pohledem. Mezi českými řidiči koluje o pneumatikách celá řada mýtů, z nichž některé mohou být pro řidiče auta nebezpečné. V čem děláme při výběru a používání pneumatik největší chyby, probereme hodinu před polednem.'
