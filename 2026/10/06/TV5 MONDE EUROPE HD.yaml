  title: 'Sans toits ni droits '
  subtitle: 'Égarés de la vie, sans-papiers, marginaux abîmés par des épreuves ou la maladie... Les sans-abris qui vivent dans une grande préca '
  description: "Sans toits ni droits\n\nOn ne les voit pas, ils vivent pourtant dans nos rues, particulièrement vulnérables aux températures extrêmes, grosses chaleurs ou grands froids : les sans-abris. Une population composée d'égarés de la vie, de sans-papiers, de marginaux abîmés par des épreuves ou la maladie. Ces sans-abris qui vivent dans une grande précarité recourent tant bien que mal aux dispositifs mis en place par les services d'urgence sociale et d'hébergement. Mais la précarité augmente plus vite que les infrastructures. Offrir un toit, un repas, des moments de répit et d'écoute, c'est le défi des équipes disparates de l'aide d'urgence.\n\nPrésentation : François Roulet\n "
