    Dokument o Marku Grechucie. Narratorem jest Danuta, żona i muza pieśniarza, malarza, architekta, poety i kompozytora, zakochanego w sporcie kibica. Była świadkiem zmagania się artysty z własną wrażliwością, jego walki o prawo do odrębności.
  genre:
