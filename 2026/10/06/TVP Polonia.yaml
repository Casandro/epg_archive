  title: Stulecie Winnych s.I - odc. 6
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Adam Ferency, Karolina Tomaszewska, Katarzyna Kwiatkowska
    Bliźniaczki rozpoczynają naukę w szkole powszechnej i szybko stają się wyróżniającymi uczennicami. W klasie zabiegają o zainteresowanie tego samego chłopca, Pawła. Anna Lilpop przedstawia ojcu swoją nową miłość, Jarosława Iwaszkiewicza. Na budowie willi Stawisko Jasiek Winny dostaje pracę elektryka, a Damian, młody zdun, zakochuje się w chłopaku z budowy. Łucja zachwyca w szkole talentem plastycznym, ale siostra przełożona nie zamierza go wspierać.
  ageRating: 12
  genre:
  - '23'
  subtitle: Ania i Mania rozpoczynają naukę w szkole powszechnej. Są dobrymi uczennicami, wyróżniają się wśród innych dzieci. Anna Lilpop przedstawia ojcu ukochanego - Jarosława Iwaszkiewicza.
- eventId: 1328833
  start: 2026-10-06T19:20:00Z
  stop: 2026-10-06T20:05:00Z
  title: Ojciec Mateusz - odc. 38 (Ojciec Mateusz III odc. 8) - Sprawa świętego Mikołaja
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Piotr Polk, Michał Piela, Artur Pontek, Kinga Preis, Paulina Chruściel
    W mieszkaniu państwa Jaskotów zostaje znaleziona martwa Maria Jaskot. Ktoś włamał się do domu i zabił kobietę. Poszlaki wskazują na Wiesława Pawlaka, który już ma na swoim koncie włamania. Wiesław zostaje aresztowany w trakcie swojego ślubu. Nie przyznaje się jednak do winy, mówi że prowadzi uczciwe życie. Chce być szczęśliwy i poślubić Helenę. Ojciec Mateusz nie wierzy w winę Wiesława i sprawdza inne tropy w tej sprawie.
  ageRating: 12
  genre:
  - '18'
  subtitle: Maria Jaskot zostaje znaleziona martwa w swoim mieszkaniu. Wygląda na to, że włamywacz ją zabił. Poszlaki wskazują na recydywistę Wiesława Pawlaka. Mężczyzna zostaje aresztowany.
- eventId: 1328834
  start: 2026-10-06T20:05:00Z
  stop: 2026-10-06T20:15:00Z
  title: Polacy Światu - Zygmunt Gorgolewski
  description: |-
    Tytuł oryginalny: Polacy światu
    PL, 2023
    ODC. 95_Zygmunt Gorgolewski urodził sie w Solcu na terenie Wielkopolskiego Księstwa Poznańskiego. W 1866 roku wstąpił do Królewskiej Akademii Budowlanej w Berlinie, którą ukończył dyplomem inżyniera architekta. W 1880 roku został architektem w biurze budowlanym cesarza Wilhelma I. Dwukrotnie brał udział w konkursie na siedzibę Reichstagu, a jego projekty zawsze zajmowały wysokie miejsca. Choć Gogolewski na stałe mieszkał w Berlinie, starał się być blisko polskich spraw.
  ageRating: 12
  genre:
