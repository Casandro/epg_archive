  title: Arka - dar zajedništva, Arka - dar zajedništva
  subtitle: Dokumentarni
  description: |-
    Kako su se stvari promijenile za Santosa i Pipea? Upoznali su Arku, a Arka im je pomogla izgraditi kuću, te naći posao. Kako je sve proteklo i zašto je sve bilo 'obično', a 'izvanredno', saznajte u novom nastavku.

    Dokumentarni filmovi 'Arka - dar zajedništva' predstavljaju osobe s poteškoćama iz cijelog svijeta na zabavan, nadahnjujući i duboko dirljiv način. Upoznajte njihove priče i kako su svoju radosnu luku pronašli u zajednici Arka.
