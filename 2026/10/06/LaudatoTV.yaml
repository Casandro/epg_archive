  description: "Tema: Pod plaštem Bezgrešne u Hrvatskoj - 90 godina\nGosti:\nFra Zdravko Tuba, nacionalni duhovni asistent udruge ,,Vojska Bezgrešne\nMargareta Begić, predsjednica Nacionalnog centra udruge ,,Vojska Bezgrešne\n \nNAJAVA: Kako današnjem čovjeku objasniti što je ,,Vojska Bezgrešne? Protiv kakvih se izazova i ,,neprijatelja današnji članovi bore u svojoj svakodnevici i koje je njihovo glavno oružje? Kako je ova udruga došla u Hrvatsku prije devet desetljeća? Po čemu je poseban 10. listopada, dan njihovog nacionalnog susreta i zašto će se on održati u Molvama, u ,,Oazi Bezgrešne? Opširnije o plodovima koji nastaju pod plaštem Bezgrešne u Hrvatskoj saznajte u ,,Izdvojenom. Naši gosti su fra Zdravko Tuba, nacionalni duhovni asistent udruge ,,Vojska Bezgrešne i Margareta Begić, predsjednica Nacionalnog centra udruge ,,Vojska Bezgrešne."
