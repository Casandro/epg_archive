  subtitle: Religijski
  description: 'U novoj epizodi u društvu smo istaknutih svjedokinja vjere. Primjeri života svetih žena: Edith Stein, majke Terezije iz Kalkute, Terezije iz Lisieuxa i Katharine Drexel pokazuju nam kako se kroz predanost Kristu i ljudima ispunjava sustvaralački potencijal Katoličke crkve u svijetu. Pogledajte priču o zajedništvu svetih, koja će vas nadahnuti na putu vjere.'
