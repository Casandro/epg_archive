  title: Svećenik, prorok, kralj, Priest, Prophet, King
  description: Svećenici su odgovorni za približavanje ljudi Bogu, obično kroz žrtvu. Prvi svećenik, Adam, bio je iznimno blizak Bogu i hodao je s njim po Edenskom vrtu. Pravilno integrirano jastvo zna da smo stvorenja koja trebaju slaviti svoga Stvoritelja, Boga. Ispravno slavljenje vodi do harmonije, dok neispravno dovodi do dezintegracije, što vidimo od Prvog grijeha nadalje.
