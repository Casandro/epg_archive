  title: Sternstunde Religion
  subtitle: Widerstand im Glauben
  description: |-
    Was bedeutet es wirklich, Widerstand zu leisten? Ein Zeuge Jehovas, eine evangelische Theologin und ein katholischer Pfarrer haben es erfahren. Sie weigerten sich, im Zweiten Weltkrieg mit den Nazis zusammenzuarbeiten und riskierten dabei ihr Leben. Eine beeindruckende Doku aus Österreich.
