  title: Sternstunde Religion
  subtitle: Assisi - Der Weg des Franziskus
  description: |-
    Überall in Umbrien ist der Geist des heiligen Franziskus spürbar. Vor allem in seiner Geburtsstadt Assisi, die von der ihm gewidmeten Basilika gekrönt wird. Aber auch im Umland knüpfen einige seiner Nachfolger treu an seine Lehre an, in einer Landschaft, die sich für einsame Meditationen eignet.
    Frankreich 2025
