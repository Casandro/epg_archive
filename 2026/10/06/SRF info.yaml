  title: Puls
  subtitle: Im Rausch der Muskeln - Ab wann wird es gefährlich?
  description: |-
    Der Muskelboom unter Jugendlichen hält an. Für schnelle Erfolge greifen deshalb immer mehr junge Männer zu Anabolika und riskieren ihre Gesundheit. Gleichzeitig wächst der psychische Druck: Wenn selbst exzessives Training nicht zum Traumkörper führt, dann werden Muskeln zur Obsession.
    Schweiz 2026
