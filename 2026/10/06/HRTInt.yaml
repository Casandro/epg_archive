  title: Kod nas doma
  subtitle: ' '
  description: U goste nam stiže Jadranka Ivaniš Yaya - pjevačica, slikarica i autorica koja već godinama uspješno izmiče jednoj ulozi. S Babom Yagom upravo priprema novi album, pa ćemo malo o glazbi, stvaranju i životu između svega toga. Koliko ste puta čuli savjete i primjedbe koje niste tražili? Često pod maskom brige, savjeta ili čak šale. Andrea Andrassy odlučila ih je sve staviti na papir - duhovito, britko i bez previše pristojnosti. O tome što žene čuju, ali i zašto se toliko toga i dalje smatra normalnim, razgovaramo s Andreom. Međunarodni je dan učitelja, imamo priču o čovjeku koji je cijeli svoj radni vijek proveo u učionici.
