  title: Djeca sunca, dokumentarna serija (4/7)
  subtitle: ' '
  description: 'U četvrtoj epizodi Djece sunca upoznat ćemo istraživanja Sunčeve svjetlosti kroz prizmu i dugine boje i saznati kako se od tih pionirskih početaka došlo do spoznaja o elementima na Suncu. Bit će predstavljena solarna joga Indijca Hira Ratan Maneke, kao i istraživanja Sunčevih pjega i njihova veza s malim ledenim dobom u 17. stoljeću. Upoznat ćemo solarni avion, prvi zrakoplov dizajniran da obleti svijet pokretan samo solarnom energijom i saznati kako se izvodi drevna vježba joge, Pozdrav suncu.  Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
