  title: Djeca sunca, dokumentarna serija (4/7)
  subtitle: ' '
  description: 'U četvrtoj epizodi Djece sunca upoznat ćemo istraživanja Sunčeve svjetlosti kroz prizmu i dugine boje i saznati kako se od tih pionirskih početaka došlo do spoznaja o elementima na Suncu. Bit će predstavljena solarna joga Indijca Hira Ratan Maneke, kao i istraživanja Sunčevih pjega i njihova veza s malim ledenim dobom u 17. stoljeću. Upoznat ćemo solarni avion, prvi zrakoplov dizajniran da obleti svijet pokretan samo solarnom energijom i saznati kako se izvodi drevna vježba joge, Pozdrav suncu.  Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
- eventId: 1431842
  start: 2026-10-06T06:16:00Z
  stop: 2026-10-06T07:07:00Z
  title: Djeca sunca, dokumentarna serija (4/7)
  subtitle: ' '
  description: 'U četvrtoj epizodi Djece sunca upoznat ćemo istraživanja Sunčeve svjetlosti kroz prizmu i dugine boje i saznati kako se od tih pionirskih početaka došlo do spoznaja o elementima na Suncu. Bit će predstavljena solarna joga Indijca Hira Ratan Maneke, kao i istraživanja Sunčevih pjega i njihova veza s malim ledenim dobom u 17. stoljeću. Upoznat ćemo solarni avion, prvi zrakoplov dizajniran da obleti svijet pokretan samo solarnom energijom i saznati kako se izvodi drevna vježba joge, Pozdrav suncu.  Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
- eventId: 1431843
  start: 2026-10-06T07:07:00Z
  stop: 2026-10-06T07:32:00Z
  title: Samo lagano
  subtitle: ' '
  description: Danas se bavimo činjenicama! I propitujemo vaše znanje, ali bez pritiska - samo lagano! Primjerice, jeste li znali da prosječan čovjek u životu provede oko dvije pune godine samo razmišljajući o tome što će jesti? Ili, znate li da su sportaši najveći hrvatski izvozni proizvod? Da je tai chi nekada bio smrtonosna borilačka vještina i da božuri imaju ljekovitu moć? Sve ćete to doznati u našoj "okrugloj", 200. emisiji do koje smo došli povezujući 1200 priloga s 1400 izgovorenih najava, koje - zbrojimo li sve rečenice u njima - pišu "omanju knjigu" od tritinjak stranica. I sve to - SAMO LAGANO!
