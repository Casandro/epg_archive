  title: Samo lagano
  subtitle: ' '
  description: Danas se bavimo činjenicama! I propitujemo vaše znanje, ali bez pritiska - samo lagano! Primjerice, jeste li znali da prosječan čovjek u životu provede oko dvije pune godine samo razmišljajući o tome što će jesti? Ili, znate li da su sportaši najveći hrvatski izvozni proizvod? Da je tai chi nekada bio smrtonosna borilačka vještina i da božuri imaju ljekovitu moć? Sve ćete to doznati u našoj "okrugloj", 200. emisiji do koje smo došli povezujući 1200 priloga s 1400 izgovorenih najava, koje - zbrojimo li sve rečenice u njima - pišu "omanju knjigu" od tritinjak stranica. I sve to - SAMO LAGANO!
