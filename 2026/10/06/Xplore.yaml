  title: Höhenflüge - Im Ballon über Venezuela
  subtitle: Höhenflüge - Im Ballon über Venezuela
  description: 'Majestätische Tafelberge, von den Indianern Tepuis genannt, sind die Wahrzeichen der von Palmenhainen und Flüssen durchzogenen Savanne. Hier mit dem Ballon aufzusteigen, oder gar die Berge zu überqueren, ist eine große Herausforderung. Plötzliche Wetterumschwünge, ungewöhnlich viel Regen und tückische Winde stellen die Balloncrew mit den Piloten Phil und Allie Dunnington vor unkalkulierbare Probleme. Diesmal mit dabei: Werner Herzog, der bekannte Regisseur. Eine Expedition in die unwirkliche Welt auf den Gipfeln der Tepuis reizt ihn schon lange und eine Heißluftballonfahrt lässt ihn die Gran Sabana aus neuer Perspektive erfahren. Die Erlebnisse um und auf den Bergen der "Lost World" sorgen auch diesmal für einmalige visuelle Eindrücke und großartige Abenteuer. DE 2012'
