- eventId: 1446171
  start: 2026-10-06T07:45:00Z
  stop: 2026-10-06T08:12:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 2: Oberstaufen - Oy'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 2: Oberstaufen - Oy'
  description: Hier seht ihr die zweite Etappe unserer ereignisreichen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der zweite Teilabschnitt beginnt im Allgäuer Oberstaufen und bringt uns zunächst durch das Konstanzer Tal über den großen Alpsee Richtung Immenstadt. Hier drehen wir südwärts ein und befahren bei zauberhaftem Sonnenschein für gute 10 km den Illerradweg. Direkt neben dem türkisfarbenen Bergfluss gehts entspannt bis nach Sonthofen. Hinter dieser südlichsten Stadt Deutschlands beginnen dann die Höhenmeter des heutigen Tages. Ab Burgberg zieht die Strasse an, so dass wir nun etwas langsamer die traumhafte Allgäuer Alpenlandschaft genießen. Über den riesigen Rottachspeichersee erreichen wir dann unser heutiges Ziel, Oy-Mittelberg. Kommt einfach mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1446172
  start: 2026-10-06T08:15:00Z
  stop: 2026-10-06T08:38:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 3: Oy - Halblech'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 3: Oy - Halblech'
  description: Hier seht ihr die dritte Etappe unserer ereignisreichen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der dritte Tag beginnt am höchsten Punkt der kompletten Reise, in Oy/Mittelberg. Von hier geht es über fantastische kleine Strässchen entlang der Allgäuer Alpen. Nachdem wir Nesselwang durchquert haben, erreichen wir den sagenhaft schön gelegenen Hopfensee. Nur einen Steinwurf entfernt liegt Füssen, das wir ausgiebig erkunden, bevor wir zu den Königsschlössern Hohenschwangau und Neuschwanstein aufbrechen. Zum Abschluss dieses ereignisreichen Tages bringt uns ein wunderschön angelegter Radweg vorbei am Bannwaldsee zu unserem heutigen Etappenziel Buching bei Halblech. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1446173
  start: 2026-10-06T08:45:00Z
  stop: 2026-10-06T09:53:00Z
  title: GlobalTrek - Die Kunst der inneren Reise - Teil 5
  subtitle: GlobalTrek - Die Kunst der inneren Reise - Teil 5
  description: "In dieser Folge besucht Lei von der indonesischen Insel Flores aus die Komodo Inselgruppe. Lei nimmt die letzte Fähre von Flores auf die Insel Timor. Hier bereitet er die Verschiffung des Zebras nach Australien vor. In Australien angekommen, erwartet Lei eine vollkommen andere Welt, die er sich mit dem Motorradreisendem Amos aus der Schweiz für eine Weile teilt. \n DE 2016"
- eventId: 1446178
  start: 2026-10-06T10:00:00Z
  stop: 2026-10-06T10:22:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Slowenien mit Daniel Rösner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Slowenien mit Daniel Rösner
  description: Klein, aber oho! Slowenien bietet das Beste aus vier Welten in einem Land. Begleiten Sie Schauspieler Daniel Rösner in die zentral gelegene Hauptstadt Ljubljana, von der aus der entfernteste Winkel des Landes in nur zwei Stunden zu erreichen ist! So genießt Daniel im Triglav Nationalpark und in den Julischen Alpen hochalpines Terrain. Den Wasser- und Waldreichtum des Landes lernt er beim actionreichen Ziplining, Mountainbiking und Canyoning kennen. Die malerische slowenische Adriaküste bei Piran und Izola ist ebenfalls einen Besuch wert, bevor die riesige Höhle von Postonja mit ihren berühmten Grottenolmen den Schauspieler mit kühlen 10 Grad Celsius begrüßt. Bei einem Glas Wein lässt Daniel Rösner abends schließlich einen ereignisreichen Tag im Weinanbaugebiet Primorska ausklingen. DE 2021
- eventId: 1446179
  start: 2026-10-06T10:30:00Z
  stop: 2026-10-06T10:54:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Cayman Islands mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 6 - Cayman Islands mit Hannes Jaenicke
  description: Die Cayman Islands in der Karibik mit ihren rund 65.000 Einwohnern sind als internationaler Finanzplatz weithin bekannt. Aber auch als Naturparadies? Als Zufluchtsort seltener Arten von Fauna und Flora? Der Schauspieler und Umweltschützer Hannes Jaenicke sucht in den Riffs und an den Stränden die Plätze auf, an denen sich seit undenklichen Zeiten Stachelrochen versammeln und Meeresschildkröten zur Eiablage einfinden. An Land gilt der Blaue Leguan längst als bedrohte Tierart, obwohl es den Insulanern und engagierten Tierschutzorganisationen gelungen ist, den Bestand zu stabilisieren. Auf den Cayman Islands verschafft sich der Schauspieler einen Überblick über den Umfang der Schutzmaßnahmen und stellt fest, dass eine intakte Natur und ihre Schönheiten auf Touristen höchst anziehend wirken können. Und eine attraktive Feriendestination mit erstklassigen Hotels, einer außergewöhnlichen Gastronomie und vielfältigen kulturellen Einflüssen sind die Cayman Islands allemal. DE 2022
- eventId: 1446180
  start: 2026-10-06T10:55:00Z
  stop: 2026-10-06T11:20:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  description: Sie wollen so schnell wie möglich durch Kroatien an die dalmatinische Küste fahren? Dann verpassen Sie allerdings eine spannende Region mit zahlreichen Sehenswürdigkeiten und Naturspektakeln. Schauspieler Oliver Hörner hat kurzerhand die Autobahn verlassen und stattdessen die historische Straße "Josephina" genommen. Sie beginnt in der historischen Festungsstadt Karlovac. Lernen Sie Ogulin kennen, die Stadt der Märchen, und die romantische Wassermühlen-Siedlung Rastoke. Tauchen Sie ein in die Welt der legendären Karl-May-Verfilmungen um Winnetou und Old Shatterhand, an den malerischen Plitvicer Seen. Über Senj an der Küste erreichen wir Novalja auf der Insel Pag, einem idealen Ort zum Sonnenbaden nach einem abwechslungsreichen Roadtrip durch das unbekannte Kroatien. DE 2022
