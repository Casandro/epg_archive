  description: Die Cayman Islands in der Karibik mit ihren rund 65.000 Einwohnern sind als internationaler Finanzplatz weithin bekannt. Aber auch als Naturparadies? Als Zufluchtsort seltener Arten von Fauna und Flora? Der Schauspieler und Umweltschützer Hannes Jaenicke sucht in den Riffs und an den Stränden die Plätze auf, an denen sich seit undenklichen Zeiten Stachelrochen versammeln und Meeresschildkröten zur Eiablage einfinden. An Land gilt der Blaue Leguan längst als bedrohte Tierart, obwohl es den Insulanern und engagierten Tierschutzorganisationen gelungen ist, den Bestand zu stabilisieren. Auf den Cayman Islands verschafft sich der Schauspieler einen Überblick über den Umfang der Schutzmaßnahmen und stellt fest, dass eine intakte Natur und ihre Schönheiten auf Touristen höchst anziehend wirken können. Und eine attraktive Feriendestination mit erstklassigen Hotels, einer außergewöhnlichen Gastronomie und vielfältigen kulturellen Einflüssen sind die Cayman Islands allemal. DE 2022
- eventId: 1446212
  start: 2026-10-06T17:45:00Z
  stop: 2026-10-06T18:10:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  description: Sie wollen so schnell wie möglich durch Kroatien an die dalmatinische Küste fahren? Dann verpassen Sie allerdings eine spannende Region mit zahlreichen Sehenswürdigkeiten und Naturspektakeln. Schauspieler Oliver Hörner hat kurzerhand die Autobahn verlassen und stattdessen die historische Straße "Josephina" genommen. Sie beginnt in der historischen Festungsstadt Karlovac. Lernen Sie Ogulin kennen, die Stadt der Märchen, und die romantische Wassermühlen-Siedlung Rastoke. Tauchen Sie ein in die Welt der legendären Karl-May-Verfilmungen um Winnetou und Old Shatterhand, an den malerischen Plitvicer Seen. Über Senj an der Küste erreichen wir Novalja auf der Insel Pag, einem idealen Ort zum Sonnenbaden nach einem abwechslungsreichen Roadtrip durch das unbekannte Kroatien. DE 2022
- eventId: 1446214
  start: 2026-10-06T18:15:00Z
  stop: 2026-10-06T18:48:00Z
  title: Eat. Sleep. Surf. - Folge 2
  subtitle: Eat. Sleep. Surf. - Folge 2
  description: Die Jungs werden von einem massiven Zyklon der Kategorie 5 getroffen und finden schließlich einen schützenden Punkt mit riesigen 6-Fuß-Barrels, die die Linie hinunterrauschen. Sie fahren zu den atemberaubenden Qingshui-Klippen, der Taroko-Schlucht und dem Wuling-Pass (3275m), die zu den bekanntesten touristischen Attraktionen Taiwans gehören und wirklich sehenswert sind. AU 2015
- eventId: 1446215
  start: 2026-10-06T18:50:00Z
  stop: 2026-10-06T19:10:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Costa Rica mit Wolke Hegenbarth
  subtitle: VIP Trip - Prominente auf Reisen 4 - Costa Rica mit Wolke Hegenbarth
  description: Das sehr ursprüngliche Land in Mittelamerika ist das Ziel von Wolke Hegenbarth. Die Schauspielerin erkundet zunächst die Hauptstadt San José. Von dort aus führt ihre Rundreise nach Toin den Nationalpark Tortuguero an der Küste des Atlantiks. Von dort aus informiert sie sich über den Bestand gefährdeter Meeresschildkröten, besucht eine Bananenplantage und unternimmt Ausflüge in den Regenwald Costa Ricas. Sportlich wird es dann bei einer "Begehung" an der Seilwinde in den Baumwipfeln. Weitere Station ist u. a. das Dorf Nosara an der Pazifik-Küste, in der Provinz Guanacaste. Dabei stehen für Wolke Hegenbarth ein Ausritt am Strand sowie eine Kayak-Tour durch die Mangrovenwälder auf dem Programm.  Letzte Etappe ist das Orisital im Landesinnern und eine Stippvisite auf einer Kaffeeplantage. DE 2018
- eventId: 1446216
  start: 2026-10-06T19:15:00Z
  stop: 2026-10-06T19:35:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  description: Dort wo heute Abu Dhabi liegt, war vor 50 Jahren praktisch nichts als Wüste. Mit dem Ölboom der Vereinigten Arabischen Emirate in den 60er Jahren des vergangenen Jahrhunderts jedoch entwickelte sich auch Abu Dhabi zu  einer Destination von Weltruf. Eva Habermann erkundet mit uns die vielfältige Metropole.   Eva lässt sich zunächst  von Scheich Suroor bin Mohammed Al Nahyan die Geschichte von Abu Dhabi erläutern. Der Scheich ist Mitglied der Herrscherfamilie und gehört zu den einflussreichsten Persönlichkeiten Abu Dhabis. Anschließend macht sich Eva auf den Weg zur drittgrößten Moschee der Welt. Die Scheich Zayid Moschee beeindruckt ihre Besucher mit weißem Marmor, unzähligen Dekorationen in Perlmutt und riesigen handgewebten Teppichen. Abu Dhabi verfügt neben imposanten religiösen Stätten und Wolkenkratzern auch über einzigartige Naturreservate. Eva Habermann entscheidet sich daher zu einem Abstecher zur Mangrovenküste. Zu Evas Glück fehlt dann nur noch ein Sonnenuntergang über der durchglühten Sandwüste. DE 2014
- eventId: 1446217
  start: 2026-10-06T19:40:00Z
  stop: 2026-10-06T20:10:00Z
  title: Foodwise - Huangshan Teil 1
  subtitle: Foodwise - Huangshan Teil 1
  description: Tianran und Hannah besteigen den Berg Huangshan, einen der berühmtesten Berge Chinas, probieren seinen delikaten grünen Tee und die reichen Aromen der Anhui-Küche und erkunden die alten Dörfer und üppigen Bambuswälder der Region, die im Blockbuster "Tiger and Dragon" zu sehen sind. CN 2023
- eventId: 1446218
  start: 2026-10-06T20:15:00Z
  stop: 2026-10-06T20:45:00Z
  title: Foodwise - Huangshan Teil 2
  subtitle: Foodwise - Huangshan Teil 2
  description: In Huangshan in der Provinz Anhui genießen die Gastgeber eine Tasse des Lieblingstees von Königin Elisabeth II. sowie den ältesten Tee, der je nach Europa exportiert wurde, und probieren ausgefallene lokale Köstlichkeiten, die von "Wortbonbons" und Tofu aus Blättern bis hin zu den ausgesprochen abgefahrenen Aromen von Haartofu und stinkendem Mandarinfisch reichen. CN 2023
