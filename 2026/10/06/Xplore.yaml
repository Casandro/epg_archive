- eventId: 1446145
  start: 2026-10-06T00:05:00Z
  stop: 2026-10-06T00:28:00Z
  title: Sprintour - Unser Leben auf 6m2 in Panama
  subtitle: Sprintour - Unser Leben auf 6m2 in Panama
  description: Wie lebt es sich auf 6 m² zu zweit? 14 Monate sind wir bereits auf der Panamericana mit unserem Wohnmobil unterwegs und haben es geschafft nach einer anstrengenden Wohnmobil Verschiffung in Panama anzukommen. Wir zeigen euch wie wir mit dem Vanlife auf engsten Raum klarkommen. In Panama erkunden wir das schöne Örtchen Santa Catalina und gehen auf die traumhafte Insel Coiba Schnorcheln. Wir sind dem Paradies ganz nahe! PA 2023
- eventId: 1446146
  start: 2026-10-06T00:35:00Z
  stop: 2026-10-06T00:57:00Z
  title: Sprintour - Vanlife in Costa Rica
  subtitle: Sprintour - Vanlife in Costa Rica
  description: Seit 15 Monaten sind wir mit unserem Wohnmobil auf der Panamericana unterwegs. Mittlerweile sind wir in Zentralamerika angekommen und bereisen das wunderschöne Land Costa Rica mit unserem Camper. Costa Rica ist als Reiseland für die vielen Nationalparks und ihre faszinierende Tier- und Pflanzenwelt bekannt. Aber wie ist das Leben in Costa Rica? Kann man es sich leisten? Wir freuen uns mit unserem VW Crafter Wohnmobil das schöne Land Costa Rica zu erkunden. CR 2023
- eventId: 1446147
  start: 2026-10-06T01:00:00Z
  stop: 2026-10-06T01:22:00Z
  title: Sprintour - Das teure Costa Rica mit dem Camper
  subtitle: Sprintour - Das teure Costa Rica mit dem Camper
  description: Diese Woche erkunden wir weiter Costa Rica mit dem Wohnmobil. Letzte Woche waren wir mit unserem Camper an der Pazifikküste von Costa Rica unterwegs und sind jetzt an die Karibik von Costa Rica gefahren um den Nationalpark Cahuita zu besichtigen. Dort soll man sehr viele Tiere, unter anderem auch Faultiere sehen können. Dort stauen wir auch über die Preise in Costa Rica. Das Leben dort ist nicht gerade günstig. Unser Costa Rica Urlaub mit dem Wohnmobil geht weiter in die Berge. Wir fahren mit dem Camper nach La Fortuna in der Nähe von Monteverde. Und es ist so schön kühl da oben, sodass wir Vanlife Costa Rica voll und ganz genießen können. CR 2023
