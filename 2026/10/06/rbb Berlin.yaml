  audiodesc: true
  description: 'Sechs Jahre nach der Schließung gibt es Bewegung in TXL: Der ehemalige Flughafen Tegel wird mit den ersten großen Bauprojekten zu einer Großbaustelle. Die Reportage begleitet Menschen, die den Ort gestalten, zeigt kreative Ideen, neue Perspektiven und sichtbare Fortschritte. Gleichzeitig wird deutlich, warum viele Vorhaben noch immer stocken und welche Herausforderungen auf dem Weg bleiben.'
