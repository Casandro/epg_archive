  episodeUri: crid://onid-8468/e/6a8f64df9bd507c5c45f3887
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Berlin gilt als Hauptstadt der Alleinerziehenden. Fast jede dritte Familie hier ist alleinerziehend - und etwa 80 Prozent davon sind Frauen. Wie auch Jacinta Nandi. Sie zog im Jahr 2000 vom Londoner Stadtteil Ilford nach Berlin. Denn was es dort nicht gab, waren Poetry Slams. Und Jacinta Nandi wollte immer schreiben, auf der Bühne stehen und lustig sein. 2011 veröffentlichte sie ihr erstes Buch mit dem Titel "Deutsch werden". Bei "Thadeusz lang & breit" spricht sie über ihre Situation als Alleinerziehende, britischen Humor und was sie sich von Friedrich Merz wünschen würde.
