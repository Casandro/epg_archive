  description: "Jaele Vanuls und Olaf Kosert gehen wieder auf kulinarische Entdeckungsreise durch die Region. Jaele Vanuls trifft auf ihrer Schlemmer-Tour durch die Restaurants auf Menschen, die ihre kulinarischen Wurzeln in die Hauptstadt gebracht haben - mit Leidenschaft und Kreativität. Währenddessen zieht es Olaf Kosert hinaus aufs Brandenburger Land. \nEr besucht Menschen, die mit handwerklichem Können und viel Herzblut regionale Produkte herstellen, aus denen er dann Gerichte zum Nachkochen zubereitet. Gemeinsam präsentieren sie ihre Erlebnisse vom Wochenmarkt auf dem Oberkirchplatz in Cottbus."
