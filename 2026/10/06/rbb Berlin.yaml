  episodeUri: crid://onid-8468/e/6a8f64df9bd507c5c45f388b
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: "Der ehemalige Flughafen Tegel wird zur Großbaustelle der Berliner Zukunft. Auf dem 500 Hektar großen Areal im Berliner Norden sollen Wohnungen gebaut und Forschung, Hochschule, Start-ups, Industrie untergebracht werden. Damit entsteht ein neues Stadtquartier, das fast halb so groß wie Kreuzberg und ein Sechstel von Tegel ist. Aber mit dem Fortschritt wachsen auch die Fragen: Was kostet diese Vision den Berliner Steuerzahler? Und kann die Stadt ein derartiges Großprojekt zuverlässig planen und finanzieren?\n\nVolker Wieprecht diskutiert mit:\n* Julia Neuhaus (Berliner Hochschule für Technik (BHT)) \n* Frank Wolters (Tegel Projekt GmbH)"
