  description: "Das Riesenflughund-Kind Oskar muss sich in dieser Folge von seiner Pflegefamilie verabschieden. Zumindest zeitweise, denn Jenny Ballentin fährt in den Urlaub. Ab jetzt übernimmt Diana Grögor den 24-Stundenpflegedienst.\nAuch den jungen Löwen Nathan und Miron steht bald die Trennung von ihren Zieheltern Nicole Marszalek und Mario Grüßer bevor. \nDie Jungtiere auf der Haustieranlage des Tierparks entwickeln sich ebenfalls prächtig: Wildeseljunge Carlos wird immer zutraulicher, Kaltblutfohlen Severin lässt sich mittlerweile das Halfter überstreifen und auch das Poitou-Eselmädchen Melanie ist gesund und munter."
