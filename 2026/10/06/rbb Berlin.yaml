  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Eine außergewöhnliche Perlenschnur der Natur zieht sich längs durch Deutschland. Von der Ostsee bis zum Vogtland verbindet sie auf 1.400 Kilometern Länge über 100 verschiedene Biotope mit seltenen Tier- und Pflanzenarten zum Grünen Band. Tierfilmer Uwe Müller beobachtete das Leben an der alten Grenze über ein Jahr lang mit modernster HD_Technik zu Lande, zu Wasser und in der Luft.
