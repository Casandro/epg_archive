  description: Die Vielfalt der Arten auf den Seychellen ist außergewöhnlich, vor allem unter Wasser. Ein Paradies für Meeresbiologen, Taucher und Fischer. Doch das Paradies ist bedroht. Um die Artenvielfalt und einzigartige Natur zu erhalten, übernahmen verschiedene Umweltschutzorganisationen rund um den Hollywoodstar Leonardo DiCaprio einen Teil der Staatsschulden. Mit den so frei gewordenen Geldern sollten die Seychellen im Gegenzug ein gewaltiges Meeresschutzgebiet finanzieren. Die Dokumentation berichtet über dieses einzigartige Projekt und schaut auf die Probleme und Lösungsansätze, die damit zusammen hängen.
