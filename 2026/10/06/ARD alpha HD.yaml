  start: 2026-10-06T13:15:00Z
  stop: 2026-10-06T14:00:00Z
  title: Unsere Flüsse - Wie retten wir Deutschlands Lebensadern?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Kinder und Erwachsene konnten in einer großen Crowd-Science-Aktion Bäche checken und ihre Fotos und Beobachtungen an die ARD schicken. So gingen mehr als 2.500 Bachbegutachtungen ein, die von einem Wissenschaftsteam untersucht und eingeordnet wurden. Diesen Beobachtungen aus dem Publikum gehen die Autorinnen nach und wollen herausfinden, warum so viele Fische sterben und so viele Tierarten bedroht sind. Was muss sich ändern, damit wieder Leben in die deutschen Bäche und Flüsse zurückkehrt? Die Doku zeigt, wie es gehen könnte.
- eventId: 709123
  start: 2026-10-06T14:00:00Z
  stop: 2026-10-06T14:30:00Z
  title: Noah - Unter Wasser sah ich nur noch Müll
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Noahs Leben hat sich verändert, seit er vor zwei Jahren in der Lahn schwimmen war: "Ich bin abgetaucht und dann war da alles voller Müll". Seitdem taucht der Biologie-Student regelmäßig. Mit Freunden holt er den umweltschädlichen Abfall aus dem Fluss. Über fünf Tonnen Schrott und viel Kurioses haben die jungen Umweltschützer vom Gewässergrund schon gesammelt und die Initiative "Lahntaucher" gegründet. Ihr nächstes Ziel: Mitstreiter finden und aufklären, welche erschreckende Welt sich unter der Wasseroberfläche verbirgt, und verhindern, dass die Flüsse zur Müllkippe werden. Jetzt wollen sie an die Öffentlichkeit.'
- eventId: 709124
  start: 2026-10-06T14:30:00Z
  stop: 2026-10-06T14:45:00Z
  title: Die 4 Elemente (15/16)
  subtitle: Die Geschichte der Kontinente
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Aus was besteht eigentlich die Welt? Dieser uralten Menschheitsfrage geht diese 16-teilige Sendereihe nach. Wie immer versteht es Harald Lesch, den Zuschauern auf unterhaltsame Weise auch die kompliziertesten Fragen zu beantworten. Die Sendereihe schlägt einen kultur- und naturwissenschaftlichen Bogen von den alten griechischen Philosophen, die mit ihrer Lehre von den vier Elementen und den Atomen den Grundstein für eine rationale Auseinandersetzung mit der Natur legten, bis zur modernen Lehre der Elementarteilchen und fundamentalen physikalischen Wechselwirkungen.
- eventId: 905094
  start: 2026-10-06T14:45:00Z
  stop: 2026-10-06T15:30:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Patagonien - Land der Pioniere
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Pioniergeschichten vom Ende der Welt in der wilden und ursprünglichen Landschaft von Chiles Patagonien: Es ist ein Naturparadies, das mehrere Klimazonen in sich vereint. Vom Valdivianischen Regenwald im gemäßigten Norden erstreckt es sich über die hochalpinen Andenkordilleren und weiten Steppen bis zur unberührten Insellandschaft von Feuerland im eisigen Süden. Ursprünglich noch als Farmland für das Vieh der einstigen Siedler genutzt, wird heute in Patagonien ein Nationalpark neben dem anderen eröffnet. Das Land ist im Begriff, Vorreiter für den internationalen Naturschutz zu werden.'
- eventId: 709142
