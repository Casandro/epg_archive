    Unsere Hände sind wahre Multifunktionswerkzeuge. Kein anderer Körperteil ist so beweglich, sensibel und gleichzeitig so belastbar. Aktuelle Studien zeigen, dass die Verbindung zwischen Hand und Gehirn entscheidend für unsere kognitive Gesundheit ist. Jede Berührung, jedes Anfassen erzeugt ein Feuerwerk im Gehirn. Feinmotorische Übungen und gezieltes Handtraining können helfen, neurodegenerativen Erkrankungen vorzubeugen oder sie abzumildern. Wie genau funktioniert das?
    Die Doku zeigt und erzählt, warum es so wichtig ist, dass wir unsere Hände ein Leben lang schulen. Wir sollten unsere Hände trainieren, um im Kopf fit zu bleiben.
