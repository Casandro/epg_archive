  subtitle: Frau Hackl muss weg
  widescreen: true
  subtitled: true
  hd: true
  description: 'In einem Kindergarten finden Hubert und Girwidz die Leiche von Erzieherin Simone Hackl vor. Deuten die Spuren zunächst auf Einbruch mit Todesfolge hin, stoßen Hubert und Girwidz im Umfeld des Kindergartens auf ein mögliches Mordmotiv. Laut einer schriftlichen Beschwerde war ein Großteil der Eltern mit den Erziehungsmethoden des Opfers nicht einverstanden. Obwohl die Kindergartenleitung der Erzieherin nicht kündigte, herrschte unter den besorgten Eltern die einhellige Meinung: Frau Hackl muss weg!'
