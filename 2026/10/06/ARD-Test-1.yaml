  description: |-
    Mietnomaden haben sich im Haus des polnischen Ehepaares Bielski eingenistet. Doch bis eine Räumungsklage greift, könnte ein Jahr vergehen. Isa von Brede sucht nach einer ungewöhnlichen Lösung und bittet den ehemaligen Safeknacker Wolfgang Hellmer, genannt Wolle, um Hilfe.
    Gleichzeitig übernimmt Markus Gellert den Fall von Meike Giering, die behauptet, von ihrem Arzt gestalkt zu werden. Doch je tiefer er recherchiert, desto mehr Zweifel kommen an ihrer Geschichte auf. Auch privat verschärft sich der Konflikt mit Barbara Geldermann, nachdem Gellert sie in inniger Vertrautheit mit Kommissar Tobias Geldermann beobachtet.
