  description: |-
    Mietnomaden haben sich im Haus des polnischen Ehepaares Bielski eingenistet. Doch bis eine Räumungsklage greift, könnte ein Jahr vergehen. Isa von Brede sucht nach einer ungewöhnlichen Lösung und bittet den ehemaligen Safeknacker Wolfgang Hellmer, genannt Wolle, um Hilfe.
