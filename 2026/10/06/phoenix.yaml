  title: Das war die DDR (3/3)
  subtitle: Hoffnung und Niedergang 1973 - 1990
  widescreen: true
  hd: true
  description: Der Machtantritt Erich Honeckers stimmt zunächst optimistisch. Besonders die DDR-Jugend hofft auf Lockerungen. Doch der neue Parteichef setzt zwar auf Sozialreformen, bleibt aber stets linientreu. Mit der Einheit von Wirtschafts- und Sozialpolitik will Honecker den Lebensstandard in der DDR verbessern. Die sozialen Reformen scheinen zu fruchten. Doch die Hoffnung auf eine neue Zeit schwindet schnell.
