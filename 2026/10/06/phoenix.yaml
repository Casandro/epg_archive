  title: Welten-Saga II
  subtitle: Die Schätze Nordafrikas
  widescreen: true
  hd: true
  description: Historiker und Presenter Christopher Clark reist in den Norden Afrikas und geht auf die Suche nach dem Zauber des Maghreb mit seiner einmaligen Mischung aus afrikanischen und arabischen Traditionen. Durch das Atlas-Gebirge mit den pittoresken Berbersiedlungen führt die Erkundungstour über die Altstadt von Fes zu den Ruinen von Karthago, weiter zu den Frauen von Sejnane, die eine 3000 Jahre alte Töpferkunst pflegen, bis ins märchenhafte UNESCO-Welterbe Marrakesch. Am Fuß des Hohen Atlas besucht Christopher Clark Aït-Ben-Haddou, ein architektonisches Juwel.
