  title: Das war die DDR
  subtitle: Aufbruchstimmung und Enttäuschung 1949 - 1961
  widescreen: true
  hd: true
  description: 'Die DDR will ein Gegenentwurf zur Bundesrepublik Deutschland sein. Ein besseres Deutschland ganz nach sowjetischem Vorbild. Am 7. Oktober 1949 wird die Deutsche Demokratische Republik gegründet. Mit großen Erwartungen: In der DDR soll ein gerechter sozialistischer Staat der Arbeiter und Bauern entstehen. Doch die Wirtschaft kommt schwer in Gang. Die Reparationsleistungen, die Einführung der Planwirtschaft und die Konzentration auf die Schwerindustrie führen schon bald in die Mangelwirtschaft. Aus zunehmendem Unmut kommt es am 17. Juni 1953 zu einem Volksaufstand.'
- eventId:
  - 710972
  - 918899
  start: 2026-10-06T01:00:00Z
  stop: 2026-10-06T01:45:00Z
  title: Das war die DDR
  subtitle: Abschottung und Entspannung 1961 - 1973
  widescreen: true
  hd: true
  description: Die 1960er-Jahre stehen nach dem Mauerbau im Zeichen der Erneuerung. Mit Reformen will die SED die DDR modernisieren und stabilisieren. Ambitionierte Wirtschaftsreformen sollen die DDR zu einer modernen Industriegesellschaft umbauen. Doch schnell regt sich Widerstand innerhalb der Partei. Der Beginn eines erbitterten Ringens um die ideologische Führung zwischen Konservativen und Reformern.
- eventId:
  - 710973
  - 918900
  start: 2026-10-06T01:45:00Z
  stop: 2026-10-06T02:30:00Z
  title: Das war die DDR
  subtitle: Hoffnung und Niedergang 1973 - 1990
  widescreen: true
  hd: true
  description: Der Machtantritt Erich Honeckers stimmt zunächst optimistisch. Besonders die DDR-Jugend hofft auf Lockerungen. Doch der neue Parteichef setzt zwar auf Sozialreformen, bleibt aber stets linientreu. Mit der Einheit von Wirtschafts- und Sozialpolitik will Honecker den Lebensstandard in der DDR verbessern. Die sozialen Reformen scheinen zu fruchten. Doch die Hoffnung auf eine neue Zeit schwindet schnell.
- eventId:
  - 710974
  - 918901
  start: 2026-10-06T02:30:00Z
  stop: 2026-10-06T03:15:00Z
  title: 'Terra X-History: Tabu'
  subtitle: Was es in der DDR nicht geben durfte
  widescreen: true
  hd: true
  description: Die DDR sei "ein sauberer Staat", so Staatschef Erich Honecker. Was nicht in dieses offizielle Bild passte, wurde totgeschwiegen - wie Prostitution, Alkoholismus und Drogenmißbrauch. So prangerte man Prostitution als Problem kapitalistischer Gesellschaften an, das im Sozialismus überwunden sei. Alkohol und Drogen galten ebenso als auszurottende "Überbleibsel des Kapitalismus". Tatsächlich aber wurde in der DDR ordentlich gesoffen.
