  title: Welten-Saga II
  subtitle: Die Schätze Japans
  widescreen: true
  hd: true
  description: Auf seiner Reise zum UNESCO-Welterbe Japans begegnet Christopher Clark einem faszinierenden Land zwischen uralten Traditionen und schriller Hypermoderne. Vom heiligen Berg Fuji und der Megacity Tokio führt die Reiseroute zur alten Kaiserstadt Kyoto mit ihren Schreinen und der rätselhaften Tradition der Geishas, weiter nach Himeji, wo die Geschichte der Samurai lebendig ist, und nach Sakai mit seinen Kaisergräbern.
