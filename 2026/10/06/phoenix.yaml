  title: Klicks um jeden Preis
  widescreen: true
  hd: true
  description: |-
    Was oft harmlos beginnt, kann schnell kippen. Eine Studie der Medienanstalt NRW zeigt: Etwa ein Drittel der Social-Media-Challenges gilt als riskant, einige sind lebensgefährlich. Warum sind solche Trends für viele so faszinierend? Wie gefährlich können sie sein?

    Hauptsache viral

    Der 16-jährige Ivan verbringt viele Stunden in sozialen Medien, sammelt Likes und Follower und macht bei Challenges mit. Er hält die Luft an, bis er fast ohnmächtig wird oder filmt sich dabei, wie er extrem scharfe Chips isst. Was ihn antreibt, ist nicht nur der Nervenkitzel, sondern auch der Wunsch, gesehen zu werden.
