  title: Das war die DDR (2/3)
  subtitle: Abschottung und Entspannung 1961 - 1973
  widescreen: true
  hd: true
  description: Die 1960er-Jahre stehen nach dem Mauerbau im Zeichen der Erneuerung. Mit Reformen will die SED die DDR modernisieren und stabilisieren. Ambitionierte Wirtschaftsreformen sollen die DDR zu einer modernen Industriegesellschaft umbauen. Doch schnell regt sich Widerstand innerhalb der Partei. Der Beginn eines erbitterten Ringens um die ideologische Führung zwischen Konservativen und Reformern.
