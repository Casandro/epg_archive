  title: Back to the System
  widescreen: true
  hd: true
  subtitle: Vier Jugendliche lernen arbeiten
  description: "Im Leben von Jenny (20), Nicola (18), Abdul (16) und Niklas (17) ist vieles gescheitert: Schule abgebrochen, von Mitschülern gemobbt, von Eltern und Lehrern nicht gesehen. Und jetzt kommt die größte Herausforderung für sie: Der Einstieg ins Berufsleben. \n\nBisher hat keiner der Vier einen Ausbildungsplatz gefunden. Ihre vielleicht letzte Chance ist die berufsvorbereitende Bildungsmaßnahme der Jugendberufshilfe Düsseldorf. Ein Jahr haben sie Zeit, um zu lernen, pünktlich zu sein, Verantwortung zu übernehmen, Rückschläge auszuhalten und vor allem wieder an sich selbst zu glauben.\n\nSendehinweis: 29.09.2026, 16:45 Uhr"
