  title: Weißt du eigentlich, wie lieb ich dich hab? - Die Abenteuer des kleinen Hasen
  subtitle: Das unbekannte Wesen
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das unbekannte Wesen

    An diesem Herbstmorgen erzählt die kleine Weißeule dem großen und dem kleinen braunen Hasen und der kleinen Feldmaus eine ihrer spannenden Geschichten. Sie handelt von einem gruseligen Wesen, das auf der Wiese auftaucht. Auch wenn der kleine Hase und die kleine Feldmaus die Geschichte nicht wirklich glauben - ein bisschen Angst vor dem unheimlichen Wesen haben sie doch. Als sie dann plötzlich unbekannte Geräusche hören, erschrecken sie sehr. Selbstverständlich gibt es für alles eine ganz normale und überhaupt nicht gruselige Erklärung, wie ihnen der große braune Hase beruhigend erklärt. Doch die beiden Freunde müssen es erst mit eigenen Augen sehen, bevor sie es glauben.
    Darsteller:
    Kleiner brauner Hase - Pablo Ribet Buse
    Großer brauner Hase - Michael Ott
    Kleine Feldmaus - Milena Rybiczka
    Kleines Grauhörnchen - Max Asmus
