  description: |-
    Was man mit einem Laubhaufen alles machen kann

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" wird es heute herbstlich. Bernd Kohlhepp zeigt das bekannte Fingerspiel "Das ist der Daumen", dabei werden seine Fingerabdrücke sogar lebendig. Kinder zeigen, wie viel Spaß sie mit einem riesigen Laubhaufen haben können. Anke Engelke hat ein Problem: Sie weiß einfach nicht, wie sie ihren Mantel zumachen soll. Ob ihr Denis Moschitto - alias Schlaumann - ihr wohl dabei helfen kann? Außerdem entdecken der Maulwurf und die Maus, was man mit einer Streichholzschachtel alles machen kann. Und zum Schluss verabschieden sich Tanja und André mit einem Fangspiel.
    Moderation: Tanja Mairhofer, André Gatzke
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

