- eventId: 863392
  start: 2026-10-06T04:00:00Z
  stop: 2026-10-06T07:00:00Z
  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Der Deutsche Buchpreis geht an ...\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 06:40 Der Stichtag: 1966 Springer Hochhaus in Berlin eingeweiht\n\"Springer enteignen\" - eine alte Parole der 68er macht in Berlin gerade wieder die Runde bei der Linken. Damals, vor rund 50 Jahren, blockierte die Außerparlamentarische Opposition, angeführt von Rudi Dutschke, auch die Berliner Springer-Zentrale, um die Auslieferung von Zeitungen zu verhindern. Diese Zentrale des Axel-Springer-Verlags lag und liegt im alten Zeitungsviertel Berlins - und: inzwischen wieder mitten in der Hauptstadt. Das war noch anders bei ihrer Einweihung heute vor 60 Jahren, am 6.Oktober 1966. Der Stichtag von Sven Hecker.\n\n* 06:50 Uhr - Theater \"Freiheit: Simson\" in Suhl \nJetzt gehts hier um Kleinkrafträder mit Kultstatus, egal ob Schwalbe, oder S51, Simson-Mopeds aus der DDR sind in den vergangenen Jahren immer beliebter geworden. In Garagen und Werkstätten wird an ihnen herumgeschraubt, und in Thüringen, wo die Simsons einst produziert wurden, da gehörte es im letzten Landtagswahlkampf zum guten Ton, dass Politiker sich nicht nur mit der Bratwurst in der Hand fotografieren ließen, sondern eben auch unterwegs auf der Simson.So ist es eigentlich alles andere als überraschend, dass die Simson es nun auf die Theaterbühne schafft. Und zwar genau dort, wo die Fahrzeuge einst gebaut wurden. Auf dem ehemaligen Werksgelände in Suhl. \n\n* 07:10 Uhr - Gegen Sachsens Kultur-Sparpläne: Demo vor dem Landtag in Dresden \nFür Demonstrationen an Montagen ist der Theaterplatz in Dresden ja weithin bekannt. Allerdings hatten gestern  die sächsischen Theater und Orchester dorthin eingeladen, um ihrem Unmut gegen die Kürzungen im aktuellen Haushaltsentwurf der Staatsregierung für 2027/28 Luft zu machen. Anlass war die Sitzung des Kulturausschusses in Sichtweite im Landtag, die gleichzeitig stattfand und bei der die Pläne des Kabinetts an diesem Tag auf der Tagesordnung standen. Unter die Kulturschaffenden hat sich auch Grit Krause gemischt und berichtet vom Geschehen dort.\n\n* 07:20 Uhr - Kulturtipp\nVon Katrin Engelhardt\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 07:40 Uhr - Feuilleton\nVon Jörg Schieke\n\n* 07:50 Uhr -  Kunstkritikerin Sarah Alberti zur Kunst von Gabriele Stötzer \nAm Wochenende bekommt die Künstlerin Gabriele Stötzer den Kaiserring der Stadt Goslar - ein weltweit renommierter Preis für Gegenwartskunst. Sie hat lange in Erfurt gelebt, dort ihr experimentelles, vielschichtiges Werk begründet - eine Werkschau im Gropiusbau Berlin zeigt gerade ihre Arbeiten. Und wir stellen Ihnen diese Ausstellungen und die Künstlerin heute im Spezial näher vor, die Kunstkritikerin Sarah Alberti sagte uns schon, warum sie vom Werk und der Person von Gabriele Stötzer so fasziniert ist. \n\n* 08:10 Uhr - Buch der Woche: Romy Fölck \"Die Regenschwimmerin\"\nLange Zeit arbeitete die studierte Juristin Romy Fölck in der freien Wirtschaft. Doch mit Ende dreißig beschloss sie, ihrem Leben eine neue Wendung zu geben. 2012 debütierte sie mit dem Krimi \"Duell im Schatten\". Seither veröffentlichte die gebürtige Meißnerin mehr als ein Dutzend Romane, von denen etliche auf der Spiegel-Bestsellerliste landeten, darunter die Familiengeschichte \"Die Rückkehr der Kraniche\" und der Psychothriller \"Fünf Fremde\". Jetzt hat die Erfolgsschriftstellerin ein neues Buch mit dem Titel \"Die Regenschwimmerin\" "
