  stop: 2026-10-06T07:35:00Z
  title: Jetzt, wo du ein Held bist (Folge 7 von 15)
  subtitle: von Thilo Krause
  description: "Dresden Sommer 1989: Toni versucht zu ergründen, warum er eine Schwester hat, die nur er sehen kann. Zwischen Familienschweigen und dem Stumpfsinn eines im Untergang begriffenen Systems schlägt er sich durch. Fahnenappelle, vom Tagebau verschlungene Dörfer, verschwundene Cousins, die Kriegsschwere der Eltern und Großeltern bilden ein dunkel flackerndes Kaleidoskop. Es bleibt Toni rätselhaft, bis er sich mit dem Sitzenbleiber Maik anfreundet. Als Toni ihn vor dem Zorn eines systemtreuen Lehrers rettet, beginnt ihre Flucht zu sich selbst. Mit Wärme und Witz erzählt Thilo Krause vom Aufwachsen in den letzten Monaten der DDR und dem Trost der Freundschaft.\n\n\"Es ist eine 'Erziehung des Herzens', die Thilo Krause in seinem zweiten Roman beschreibt, einige Sommerwochen im Jahr des Mauerfalls, in denen für die zwei Schüler Toni und Maik nicht viel zu geschehen scheint und sich doch alles verändert.\" (Peter Stamm)\n\nThilo Krause, geboren 1977 in Dresden, lebt in Zürich. Seit 2005 veröffentlicht er literarische Texte in Zeitschriften (u.a. Akzente, Sinn und Form), Zeitungen und Anthologien. 2012 erhielt er für sein Debüt \"Und das ist alles genug\" den Schweizer Literaturpreis; 2016 den Clemens-Brentano-Preis. 2020 erhielt er für seinen Roman \"Elbwärts\" den Robert-Walser-Preis und den Nicolas-Born-Debütpreis. MDR Kultur produzierte den Roman als Lesung mit Nico Holonics. Im August 2026 erschien sein zweiter Roman \"Jetzt, wo du ein Held bist\", den MDR Kultur zusammen mit NDR Kultur als Lesung mit dem Schauspieler Oscar Hoppe produziert hat.\n\nRegie: Judith Ruyters\nProduktion: MDR/NDR 2026\n\nMitwirkende: \nOscar Hoppe"
- eventId: 863395
  start: 2026-10-06T07:35:00Z
  stop: 2026-10-06T10:00:00Z
  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\nVon Katrin Engelhardt\n\n* 10:15 Der Stichtag: 1966 Springer Hochhaus in Berlin eingeweiht\n\"Springer enteignen\" - eine alte Parole der 68er macht in Berlin gerade wieder die Runde bei der Linken. Damals, vor rund 50 Jahren, blockierte die Außerparlamentarische Opposition, angeführt von Rudi Dutschke, auch die Berliner Springer-Zentrale, um die Auslieferung von Zeitungen zu verhindern. Diese Zentrale des Axel-Springer-Verlags lag und liegt im alten Zeitungsviertel Berlins - und: inzwischen wieder mitten in der Hauptstadt. Das war noch anders bei ihrer Einweihung heute vor 60 Jahren, am 6.Oktober 1966. Der Stichtag von Sven Hecker.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 10:40 Uhr - \"Jazzlabor\" mit Julia Hemmerling\nHeute Abend im Jazzlabor eine Sängerin, die Geschichte geschrieben hat. Norma Winstone, die erste Stimme, die einen festen Platz in einer Bläsersektion hatte - als Sängerin. SO hat sie den Sound des 70er Jahre Jazz aus Europa im Wesentlichen mitgeprägt. Etwa einmaliges, was man dem US-amerikanischen Markt entgegensetzen konnte. Sie hat damit einen Sound von einmaliger Schönheit erschaffen. Sie selbst allerdings ist keine große Diva. Vielmehr hat sie sich in Situationen hineingetraut, von der andere Sängerinnen die Finger gelassen hätten.\nSie wurde Anfang der 60er Jahre vom Chef des New Jazz Orchestra Neil Ardley einfach spontan aufgefordert, mit zu seiner Big Band auf die Bühne zu kommen und mitzusingen - improvisieren. Und nach dem ersten Stück wollten sie sie nicht mehr von der Bühne lassen. Später dann wurde sie in der Band von Kenny Wheeler das menschliche Saxophon - ein fester Platz als Instrumentenstimme in seiner Band. Die Natürlichkeit ihrer Stimme hat jeder der Formationen etwas Menschliches gegeben. \nSie ist 1941 geboren - Ende der 50er Anfang der 60er gab es noch kein Studium für Jazzgesang und klassischen Gesang wollte sie nicht studieren. Vielleicht auch ein Grund, weshalb sie immer sehr bescheiden blieb - trotz ihres großartigen Gehörs ihres Talents zur Improvisation. Mit ihrer Stimme allerdings war sie nie sonderlich zufrieden.\n\n 10:50 Uhr - Das Gedicht: \"Im Büro\" von Hertha Kräftner\nZu Lebzeiten erschienen lediglich einige Gedichte in Zeitungen und Zeitschriften von Hertha Kraeftner. Heute gilt sie als eine der bedeutendsten Lyrikerinnen der österreichischen Nachkriegszeit. Erst 23-jährig nahm sie sich im November 1951 das Leben. Es liest Marianne Mosa. \n\n* 11:15 Uhr - Feuilleton\nVon Jörg Schieke\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 11:45 Uhr - Mynolia über ihren Song \"Take the mountain by surprise\" \nDie Musikerin Mynolia singt in ihrem Song \"Take the mountain by surprise\" über Grenzen und Neuanfänge.\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
