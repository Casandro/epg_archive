- eventId: 863410
  start: 2026-10-06T16:00:00Z
  stop: 2026-10-06T17:00:00Z
  title: 'MDR KULTUR Spezial: Gesellschaft'
  description: "Der Kaiserring, den die Stadt Goslar alljährlich vergibt, ist ein weltweit renommierter Preis für Gegenwartskunst. Der erste Preisträger 1975 war Henry Moore, mit der Zeit folgten Joseph Beuys, Christo und Jeanne Claude, Gerhard Richter und Katharina Fritsch. 2026 wird damit die Künstlerin Gabriele Stötzer geehrt. \n\nGewürdigt - so die Jury - werden ihr experimentelles, vielschichtiges Werk sowie ihr mutiger, aktivistischer Widerstand und ihre Pionierarbeit als Mitgründerin der Künstlerinnengruppe Erfurt in der DDR. \n\nIm Spezial bei MDR KULTUR stellen wir die Künstlerin näher vor, sind im Gropiusbau Berlin bei ihrer Werkschau, sprechen mit ihrer Kuratorin Sarah Alberti über die Wiederentdeckung von Künstlerinnen der DDR-Zeit und stellen die Künstlerinnengruppe Erfurt vor, die die Stadt in den 80ern zu einem Ort kraftvoller weiblicher Kreativität machte.\n\nDer aktuelle, ausführliche Themenschwerpunkt aus Kultur, Gesellschaft und Politik.\n\nModeration: Thomas Bille\nRedaktion: Kristin Unverzagt"
  subtitle: Dabei sein und nicht schweigen.  / Die Künstlerin Gabriele Stötzer bekommt den Kaiserring der S
