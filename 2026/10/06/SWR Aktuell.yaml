  description: Am 6. Oktober 1683 gründeten eingewanderte Deutsche die Stadt Germantown im US-Bundesstaat Pennsylvania. Auf dieses Ereignis geht der "German-American-Day" zurück, ein alljährlicher Feiertag in den USA - und gerade in diesen Zeiten ein denkwürdiger Tag. Denn viele Deutsche, die damals in das sprichwörtliche "Land der unbegrenzten Möglichkeiten" kamen, suchten dort u. a. nach Demokratie. Würden sie heute finden, was sie damals suchten?
