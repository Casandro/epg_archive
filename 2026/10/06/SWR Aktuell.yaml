  description: "14:00 - 15:00\nMAFIA LAND - Koks und Küsschen: Passwort: Pecora - Die Codes der Mafia (2/4)\nWie funktioniert eigentlich das System  _Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\nGibt es auch zum NAchhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n14:50\nSWR1 Leute mit Gast: Alessandro Bellardita, Jurist\nStrafrichter, Dozent und Krimiautor. \nGeboren in Sizilien, aufgewachsen in Karlsruhe, studiert in Mannheim und Heidelberg. \nDie organisierte Kriminalität ist ein Thema, mit dem er sich intensiv beschäftigt."
