  title: SWR Kultur - Das Wissen
  subtitle: Neue Bäume fürs Stadtklima - Wie Kommunen auf den Engpass reagieren
  description: |-
    Von Richard Fuchs

    Laut, heiß und eng: Nicht nur an Hitzetagen sind Städte auf Kühlung durch Bäume und Grünflächen angewiesen. Stadtgrün hilft auch bei Starkregen und hohen Feinstaubwerten. Doch Hitze- und Wasserstress dünnen den Baumbestand aus. Dringend benötigter Nachschub stockt, denn der Baumschulsektor schrumpft. Einige Städte nehmen deshalb die Pflanzenaufzucht in die eigene Hand. Andernorts wird mit alternativen Baumarten, neuen Pflanzmethoden und Mini-Baumschulen in Innenstädten experimentiert.
