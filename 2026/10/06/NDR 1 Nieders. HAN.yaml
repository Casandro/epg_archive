  subtitle: Neuer Krimistoff von Margarete von Schwarzkopf - Mit Martina Gilica
  description: 'Ein geheimnisvoller Fund in einer sogenannten Geistervilla, ein Skelett und ein literarisches Geheimnis, das mehr als hundert Jahre zurückreicht: In ihrem neuen Kriminalroman "Die gestohlenen Worte" verbindet Margarete von Schwarzkopf Literaturgeschichte mit einem spannenden Mordfall. Warum alte Manuskripte plötzlich lebensgefährlich werden können und was hinter dem Geheimnis der Geistervilla steckt - darüber spricht die Autorin mit Moderatorin Martina Gilica.'
