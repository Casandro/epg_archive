  title: Podróże z historią 3 (odc. 8)
  subtitle: Radosław Kotarski rusza na połoniny, by poznać kulturę Hucułów. Podziwia tradycyjny układ domów i szuka hodowli koni huculskich. Opowiada o swobodnym podejściu Hucułów do spraw miłosnych.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Jak radzą sobie ludzie w wysokich pasmach gór? Żyjący tam Huculi zafascynowali naszych dziadków swoją naturalnością i wytrwałym opieraniu się nowoczesności. Radek Kotarski rusza na połoniny, aby na własne oczy zobaczyć kulturę Hucułów. Podziwia tradycyjny, choć wyjątkowo niepraktyczny układ domów i szuka hodowli dzielnych koni huculskich. Opowiada także o luźnym podejściu Hucułów do spraw miłosnych.
  genre:
  - '149'
- eventId: 1327917
  start: 2026-10-06T01:20:00Z
  stop: 2026-10-06T01:51:00Z
  title: Polskie parki narodowe 1 (odc. 13)
  subtitle: Tematem programu będzie Wielkopolski Park Narodowy, znany z malowniczych jezior polodowcowych oraz cennych ekosystemów leśnych stanowiących ostoję wielu gatunków roślin i zwierząt.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
