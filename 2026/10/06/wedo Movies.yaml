  title: An Egypt Affair
  subtitle: Adventure / Western / War 2023, FSK 12
  description: '2023 ● FSK: 12 Zwei Paare, die seit dem College beste Freunde sind, genießen gemeinsam eine romantische Nilkreuzfahrt. Auf dieser Reise hegen sie die Hoffnung, ihre scheiternden Ehen reparieren zu können. Als jedoch zwei weitere Gäste an Bord ihrer privat gecharterten Jacht kommen, drohen Täuschung, Verrat, Lust und Gier bald, ihr ganzes Leben zu zerstören und der Ägyptenurlaub entwickelt sich langsam zum Alptraum. Adventure / Western / War 2023, Regie: Marlin Darrah,  Mit: Yolanthe Cabau, Jarred Harper, Massi Furlan, FSK 12'
