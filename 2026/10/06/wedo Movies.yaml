  title: 'Harry & Meghan: Ein royales Happy-End'
  subtitle: Remarkable people 2018, FSK 12
  description: '2018 ● FSK: 12 Der Film zeigt die Geschichte von Prinz Harry und seiner Verlobten Meghan Markle, einer amerikanischen und geschiedenen Schauspielerin. Die erste Begegnung wurde von gemeinsamen Freunden eingefädelt, und obwohl sie schon lange vor der offiziellen Bekanntgabe ein Paar waren, konnten sie ihre Beziehung zunächst geheim halten und sie vor dem Medienrummel schützen. Das wurde nach der offiziellen Verkündung schnell anders. Remarkable people 2018, Regie: Menhaj Huda,  Mit: Parisa Fitz-Henley, Burgess Abernethy, Laura Mitchell, FSK 12'
