  title: So schmeckt die Welt - Kopenhagen
  subtitle: So schmeckt die Welt - Kopenhagen
  description: Ein kultureller Streifzug durch die stylische Metropole Kopenhagen mit Eva Habermann. Kopenhagen zählt zu den beliebtesten europäischen Städten mit dem höchsten Lebenswert. Und die Kopenhagener zählen zu den zufriedensten Menschen weltweit. Ob das nur am ad liegt. Gewiss nicht, die Dokumentation zeigt auf, warum und wie Kopenhagen glücklich macht. Wie das Leben in der Stadt auch auf die Besucher strahlt. Wer Kopenhagen besucht kommt gewiss glücklicher nach Hause.
