  title: So schmeckt die Welt - Italien
  subtitle: So schmeckt die Welt - Italien
  description: Eine kulturell und kulinarische Entdeckungsreise durch Italien. Wer an gutes Essen denkt, denkt gewiss zuerst an Italien. Kein Wunder also, dass der Italiener bei uns zu den beliebtesten Restaurants zählen. Es gibt daher viele Gründe dieses Land zu bereisen und die Leckerbissen zu entdecken und zu probieren. Und dabei treffen wir auch auf die Geschichte der Carbonara, die nicht von Italienern, sondern von Amerikanern erfunden wurde.
