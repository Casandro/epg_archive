  description: Ein kultureller Streifzug durch die innovative Metropole Helsinki. Die spinnen die Finnen, ja diesen Spruch kann man angesichts dieser Dokumentation an manchen Stellen bestätigen. Aber die Finnen spinnen positiv. Zum Beispiel beim Thema Hard Rock, hier rasten die Finnen völlig aus und trotz der sehr langen und dunklen Winter hat man bei den Rockkonzerte das Gefühl hier ist mehr Feuer und Wärme drin als in mancher italienischer Metropole.
