  title: Gdzie tu coś zjeść? 1 (odc. 9)
  description: |-
    Tytuł oryginalny: Gdzie tu coś zjeść?
    PL, 2026
    Agnieszka i Ewa w wielkiej trasie po Polsce sprawdzają lokale polecane przez mieszkańców, w internecie ale też sprawdzają miejsca "w ciemno". W odcinku z Leszna bliźniaczki przeżyją chwile rozkoszy na antresoli, spróbują pierogów jak u mamy, dostaną nie tylko figę z makiem ale tez niebiańską pizzę z kroplą oliwy!
