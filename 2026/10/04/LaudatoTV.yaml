  title: 'Sveta misa: Sinj, Sveta Misa: Sinj'
  subtitle: Religijski
  description: Pratimo zajedno izravan prijenos svečane svete mise iz Svetišta Gospe Sinjske u Sinju, na svetkovinu sv. Franje Asiškoga. Svečano euharistijsko slavlje predslavit će mons. Marko Medo, biskup gospićko-senjski. U zajedništvu proslavimo blagdan sveca koji nas svojim životom i danas poziva na poniznost, mir, ljubav prema Bogu i bližnjemu.
