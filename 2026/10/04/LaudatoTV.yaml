  title: Čujte i počujte
  subtitle: Religijski
  description: U novom izdanju emisije ,,Čujte i počujte govorimo o HosanaFestu, koji će se uskoro održati u Subotici. Naši gosti su vlč. Marniko Stantić i Miroslav Zelić, koji će predstaviti ovogodišnji festival, njegovu misiju, program i značaj za promicanje suvremene duhovne glazbe. Saznat ćemo kako teku pripreme, što očekuje posjetitelje te na koji način HosanaFest već godinama okuplja glazbenike, autore i ljubitelje duhovne pjesme.
