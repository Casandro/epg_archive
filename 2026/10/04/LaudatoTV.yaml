- eventId: 1305720
  start: 2026-10-04T14:45:00Z
  stop: 2026-10-04T16:00:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Eda i Marijan Šafarić već 42 godine grade svoju zajedničku priču, a posebno mjesto u njihovim srcima zauzima Srce Isusovo, kojemu su kroz život ostali duboko privrženi. Što im je u svim tim godinama bilo najteže, a što najljepše? Koji su trenuci ostali zauvijek urezani u njihova srca i što im je davalo snagu da zajedno prolaze kroz sve životne izazove? Upoznajte obitelj Šafarić i njihovu priču o ljubavi, vjeri i zajedništvu koje traje.
- eventId: 1305732
  start: 2026-10-04T16:00:00Z
