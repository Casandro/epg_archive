  subtitle: 'Erntedank: Mut zur Dankbarkeit - Ein Sichtwechsel'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die ''Stunde des Höchsten'' ist ein Fernsehgottesdienst, der wöchentlich von den Zieglerschen produziert wird. Er wird in der Kapelle auf dem Höchsten aufgezeichnet, 800 Meter oberhalb des Bodensees, mit Panoramablick auf die Schweizer Alpen. Auch Gehörlose oder Menschen mit Hörsprachbehinderung können den Gottesdienst miterleben, denn die Sendungen werden zusätzlich in Gebärdensprache ausgestrahlt. Dolmetscher bei den Gottesdiensten sind im Wechsel: Uta Benner, Jan Schaible, Lea Bierotte und Elisabeth Andersohn.'
