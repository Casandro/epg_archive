  title: Hour of Power
  subtitle: 'Folge dem Ruf Gottes(Gastprediger: Michael Mauldin)'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gott hat einen guten Plan für unser Leben. Doch oft halten uns Angst, Zweifel oder Unsicherheit davon ab, den nächsten Schritt zu gehen. Pastor Michael Mauldin zeigt, warum echter Glaube Mut bedeutet und wie Gott uns auch durch Herausforderungen sicher führt. Eine Einladung zu entdecken, was auf der anderen Seite der Ängste auf uns wartet und warum Gottes Berufung immer größer ist als die Zweifel. Eine Ermutigung, seinem Ruf zu folgen und voller Vertrauen voranzugehen.'
