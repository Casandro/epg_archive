  title: The Covenant - Der Bund
  description: Als Mose das Volk Israel aus der Sklaverei in Ägypten führt, tut Gott große Wunder. Doch die Ereignisse geraten in Vergessenheit. Bis der Prophet Esra ihnen ihre Geschichte ins Gedächtnis ruft. Er liest aus der Tora - der Heiligen Schrift der Juden. Es geht um Gottes Plan mit seinen Menschen von Adam über Noah, Abraham, Josef bis hin zu Mose. In eindrücklichen Szenen ist die Geschichte des Volkes Israel hautnah mitzuerleben. Esra ermahnt mit der Lesung nicht nur das Volk damals, sondern auch uns heute, an Gott festzuhalten und unser Leben mit ihm zu führen ...
