  title: ERF Jess - Talkwerk
  subtitle: Woraus ziehst du deinen Selbstwert?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Dero Goi war Frontmann der Band "Oomph!", die Band stand für "neue deutsche Härte". Nach über 30 Jahren hat er die Band verlassen. Sein Sohn war mit 3 Jahren an Krebs erkrankt und Dero suchte nach dem Sinn im Leben. Tina Tschage liebt die persönliche Arbeit mit ihren Klienten. Sie sollen sprachfähiger und sich selbst bewusster werden. Manuel Bühler wollte Profifußballer werden. Die Chancen dazu standen sehr gut, bis ihm in einem Testspiel ein fataler Fehler unterlief. Es kamen noch diverse Verletzungen hinzu und schließlich blieb nichts anderes übrig: Viel zu früh musste er seine Karriere an den Nagel hängen. Mittlerweile begleitet er Fußballprofis.'
