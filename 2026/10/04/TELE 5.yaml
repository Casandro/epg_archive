  title: 'Doctor Who Christmas Special 2013: The Time of the Doctor'
  description: |-
    Auf dem Planet Trenzalore spielen sich dramatische Szenen ab. Offenbar versuchen die Timelords aus dem Taschenuniversum zu entkommen. Parallel dazu wird der Planet von diversen Feinden des Doktors belagert, darunter Daleks und Cybermen! Die Aliens wollen die Rückkehr der Timelords um jeden Preis verhindern. Als die Belagerung viele Jahrhunderte überdauert, macht der 11. Doktor (Matt Smith) seiner treuen Zeitreise-Freundin Clara Oswald (Jenna Coleman) schließlich ein schockierendes Geständnis: Seine Regenerationszyklen sind aufgebraucht. Die Zeit des Doktors scheint gekommen... - In der Sonderausgabe inkarniert der 12. Doktor (Peter Capaldi) in der TARDIS.
    GBR 2013
