  description: Oparta na bestselerowej powieści Johna le Carré’a o tym samym tytule. "Mała doboszka" to namiętna opowieść o miłości i zarazem trzymający w napięciu thriller.Rozgrywająca się w późnych latach siedemdziesiątych, trzymająca w napięciu fabuła śledzi losy Charlie, młodej, niespełnionej aktorki o ognistym temperamencie i idealistycznych poglądach, której przekonania zostaną wystawione na próbę, kiedy na wakacjach w Grecji spotka tajemniczego Beckera.
