  title: Hängt ihn höher
  description: |-
    Kritik:"Spannend inszenierter, gut gespielter Western über den Konflikt zwischen Recht und Unrecht, Rache und Verzeihen in einem noch nicht zivilisierten Land." (Lexikon des internationalen Films) "Intelligente Racheballade." (cinema.de)Hintergrund:Clint Eastwood lehnte die Hauptrolle in der großen Produktion 'Mackenna's Gold' ab, um 'Hängt ihn höher' drehen zu können. Er produzierte den Film auch - erstmals mit seiner eigenen Produktionsfirma Malpaso Company. Als Regisseure waren John Sturges und Robert Aldrich im Gespräch. Doch Clint Eastwood wollte Ted Post, der zuvor viel fürs Fernsehen gearbeitet hatte und sehr gut im Filmen von Dialogen war.
    USA 1968
