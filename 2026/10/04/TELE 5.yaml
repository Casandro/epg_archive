  title: Xena
  subtitle: Drei Diebe und ein Baby
  description: |-
    Drei Halunken tun sich zusammen, um ein kostbares Artefakt zu stehlen: die Krone der Göttin Athene. Das räuberische Trio besteht aus Autolycus, dem König der Diebe, Joxer und Xenas Doppelgängerin, der Schankmaid Meg. Die Bande staunt nicht schlecht, als sie den sagenumwobenen Schlüssel zum Schatz aufspürt: Es handelt sich dabei um ein Baby! Aber wie kann das kleine Menschlein Athenes Krone offenbaren? Zwar gelingt es dem scharfsinnigen Autolycus trotz Intrigen, das Rätsel zu lösen, aber am Ende greift die echte Xena ein, um den Schatz der Göttin zu bewahren.
    USA 1999
  widescreen: true
