  start: 2026-10-04T01:50:00Z
  stop: 2026-10-04T02:30:00Z
  title: Hercules
  subtitle: Von den Toten Auferstanden
  description: |-
    Als Hercules und Iolaus ihre Heimatstadt Theben besuchen, kommt es zu einem tragischen Zwischenfall. Die bösartige Göttin Hera hat ein weiteres Monstrum erschaffen, um es auf die Menschheit loszulassen. Der Feuerdämon in weiblicher Gestalt (Cynthia Rothrock) tötet sogar Iolaus! Blind vor Wut schmiedet der Halbgott einen Pakt mit Hades: Wenn es ihm gelingt, Heras übernatürliche "Vollstreckerin" bis zum Sonnenuntergang zu bezwingen, entlässt der Gott der Unterwelt Iolaus zurück ins Reich der Lebenden. Beim Kampf gegen die Feuerbestie steht Hercules eine unerwartete Verbündete zur Seite.
    USA 1996
  widescreen: true
- eventId: 1402229
  start: 2026-10-04T02:30:00Z
  stop: 2026-10-04T03:10:00Z
  title: Xena
  subtitle: Tochter der Pomira
  description: |-
    Xena und Gabrielle stoßen zufällig auf Vanessa (Beth Allen), die vor vielen Jahren von der wilden Horde entführt worden ist. Aber als es den Heldinnen gelingt, das Mädchen zu befreien sowie zurück zu ihren leiblichen Eltern zu bringen, stellen sie fest, dass Vanessa weder als Sklavin gehalten noch misshandelt worden ist. Ganz im Gegenteil: Sie wurde vom Stammesanführer adoptiert, liebevoll großgezogen und sieht sich heute selbst als naturverbundene "Pomira". Nun müssen Xena und Gabrielle gemeinsam mit Pilee, wie das Mädchen heute heißt, eine blutige Schlacht zwischen den verfeindeten Gruppen verhindern.
    USA 1999
  widescreen: true
