- eventId: 1402226
  start: 2026-10-04T00:30:00Z
  stop: 2026-10-04T01:10:00Z
  title: Hercules
  subtitle: Ohne Liebe geht es nicht
  description: |-
    Die Liebesgöttin Aphrodite hat beschlossen, ihr Amt vorerst niederzulegen und etwas Neues auszuprobieren. Wie wäre beispielsweise eine Karriere als Göttin der Jagd? Durch Aphrodites unerwarteten Jobwechsel gerät die Welt ziemlich aus den Fugen. Parallel zum amourösen Defizit der Menschen wird ausgerechnet Iolaus' Oma Leandra (Sarah Smuts-Kennedy) entführt. Auch ein 50-jähriger Fluch, der auf ihrem Heimatdorf Syllabus lastet, ist in den Fall verwickelt. Da Hercules gerade in Korinth unterwegs ist, um Iphicles und dessen Frau zu besuchen, muss Iolaus bei seiner Rettungsmission diesmal alleine klarkommen.
    USA 1996
  widescreen: true
- eventId: 1402227
  start: 2026-10-04T01:10:00Z
  stop: 2026-10-04T01:50:00Z
  title: Hercules
  subtitle: Fluch der Mumie
  description: |-
    Die ägyptische Prinzessin Anuket (Galyn Görg) reist nach Griechenland, um Hercules um einen großen Gefallen zu bitten. Der Halbgott soll dabei helfen, eine geraubte Mumie wiederzufinden, die über dunkle Kräfte verfügt! Zunächst lehnt Hercules ab, da er die Sklaverei unter der Herrschaft der Pharaonen verachtet. Aber die hübsche Prinzessin wickelt ihn schließlich doch um den Finger. Andernorts hat der Geschäftsmann Salmoneus die verfluchte Mumie zum Schnäppchenpreis erworben. Sein Plan ist es, die grausige Kreatur in einem Horrorkabinett zur Schau zu stellen.
    USA 1996
  widescreen: true
