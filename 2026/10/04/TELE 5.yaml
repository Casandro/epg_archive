  title: 'Doctor Who Special: Der Tag des Doktors'
  description: |-
    Drei unterschiedliche Inkarnationen des Timelords und Clara Oswald (Jenna Coleman) arbeiten zusammen, um eine Verschwörung der außerirdischen Zygonen abzuwehren. Die feindseligen Gestaltwandler haben futuristische 3D-Gemälde genutzt, um auf die Erde im Jahr 2013 zu gelangen. Auch der bislang unbekannte Kriegsdoktor (John Hurt), die Militärorganisation UNIT und eine empfindungsfähige Superwaffe namens "The Moment" (Billie Piper) sind in die brandgefährliche Alien-Jagd verstrickt. Das Abenteuer führt vom Jahr 1562 über den Zeitkrieg gegen die Daleks bis in eine ungewisse Zukunft für den Planeten Gallifrey, die Heimatwelt der Timelords. - Special zum 50-jährigen Jubiläum der Kultserie.
    GBR 2013
