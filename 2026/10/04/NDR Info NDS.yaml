  title: vertikal - horizontal. Glaubens- und Gewissensfragen
  subtitle: Das Magazin aus Religion und Gesellschaft
  description: "Von Widerständen und guten Beispielen - Eine Sendung von Brigitte Lehnhoff und Florian Breitmeier\n \nBis 2035 wollen Landeskirchen und Bistümer im Norden einen entscheidenden Schritt zur Klimaneutralität schaffen. Damit stehen die Kirchen vor enormen Herausforderungen: Gebäude sind energetisch zu sanieren, Fuhrpark, Einkauf und Verbrauch müssen klimagerechter werden. Eine besonders komplizierte Aufgabe ist es, zu erreichen, dass auch verpachtetes Kirchenland klimagerechter bewirtschaftet wird."
