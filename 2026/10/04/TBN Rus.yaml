  description: '" "Твой рецепт" - технологичный выпуск с Андреем Ургантом! Ученик 4 класса становится настоящим шефом и учит актёра театра и кино - Андрея Урганта - готовить редкое и необычное блюдо! Сегодняшний рецепт будет напоминать настоящий конструктор. Собираем, соединяем, продумываем детали - почти как в инженерной лаборатории! А всё потому, что у Макара есть редкое хобби: он увлекается роботами. И не просто играет - он умеет ими управлять и даже программирует их! Чем же похожи роботы и кулинария? Почему рецепт можно "собрать" как механизм? И сможет ли опытный актёр точно следовать инструкциям юного наставника? В этом выпуске: Необычный рецепт, который собирается по шагам. Разговор о роботах, программировании и детских увлечениях. Много юмора, импровизации и неожиданных поворотов. Готовим, экспериментируем и разбираемся вместе - ведь кухня тоже может быть настоящей мастерской идей! Не пропустите самый технологичный и вдохновляющий выпуск "Твой рецепт"!"'
- eventId: 1333866
