  title: Campus Talks
  subtitle: Wie können wir Chemikalien sicher machen? / Wie Phantasien der Vergangenheit heutige Technikvisionen prägen
  description: "Dr. Anja Worrich vom Department für Umwelt- und Biotechnologie am Helmholtz-Zentrum für Umweltforschung (UFZ) in Leipzig geht der Frage nach, wie Chemikalien sicherer werden können. \nDipl.-Pol. Christopher Coenen vom Institut für Technikfolgenabschätzung und Systemanalyse am Karlsruher Institut für Technologie (KIT) erklärt, wie Phantasien der Vergangenheit heutige Technikvisionen prägen."
