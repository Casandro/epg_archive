  subtitle: 'Studium: Mathe, Forstwissenschaften, Bauingenieurwesen'
  genre:
  - '144'
  description: |-
    Julius studiert im 1. Mastersemester Mathematik an der TU München. In der Schule gehörte er zu den Besten - im Studium wurde ihm schnell klar, wie anspruchsvoll Mathematik wirklich ist.
    Johanna studiert im 3. Semester Forstwissenschaften an der TU Dresden in Tharandt. Als studentische Mitarbeiterin forscht sie im Projekt "Klimawandel in historischen Gärten" mit - ein wichtiger Schritt auf ihrem Weg in die Wissenschaft.
    Leander studiert im 5. Semester Bauingenieurwesen an der TU Dresden und arbeitet seit einem Jahr als Tutor. Jede Woche erklärt er seinen Kommiliton:innen knifflige Aufgaben aus Statik und Technischer Mechanik.
- eventId: 859195
  start: 2026-10-04T05:30:00Z
  stop: 2026-10-04T05:55:00Z
  title: Wissen macht Ah!
  subtitle: Wissen macht Mäh!
  description: |-
    Entfernte Geräusche und ein eindeutiger Geruch sorgen heute für Irritation im Studio. Bald stehen Clarissa und Ralph inmitten einer blökenden Schafherde. Wie kommen die Tiere ins Studio? Und was hat Lumpi damit zu tun? Während der Suche nach einer Erklärung bleibt genug Zeit für farbenfrohe Versuche mit Säuren und Basen und außerdem für die Antworten auf die fünf Fragen der Sendung:
    * Ist Nase hochziehen besser als putzen?
    * Kann Pipi wirklich zu Stein werden?
    * Wieso werden Gläser in der Spülmaschine irgendwann "blind"?
    * Warum sind Vogelnester nicht voller Kacke?
    * Warum schwimmt manchmal Schaum auf Flüssen?
