- eventId: 859253
  start: 2026-10-04T07:45:00Z
  stop: 2026-10-04T08:30:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Finnland - Sommer auf der Seenplatte
  genre:
  - '112'
  subtitled: true
  description: "Land der 1000 Seen mit dem saubersten Wasser der Welt. Finnland ist von imposanter Schönheit und Größe und eine der letzten wilden Regionen Europas. Nicht nur die Landschaft, auch die Menschen selbst machen es einzigartig. Laut dem World Happiness Report sind die Finnen sogar das glücklichste Volk der Welt. \nDie Dokumentation erzählt von einem Sommer auf den finnischen Seen und begleitet Menschen, die zwischen Tradition und Hightech in enger Verbindung zur Natur leben - typisch Finnisch eben."
- eventId: 859254
  start: 2026-10-04T08:30:00Z
  stop: 2026-10-04T09:15:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Namibia - Leben mit der Wüste
  subtitled: true
  description: Die Namib ist die älteste Wüste der Welt. Sie prägt Namibia, den jungen Nationalstaat im Südwesten Afrikas. Eine Region mit extremen Herausforderungen, die sich Menschen ausgesucht haben, um hier ihr Glück zu finden. Sie züchten die Nachfahren der berühmten Namib-Wildpferde, schürfen in Vulkankratern bei sengender Hitze nach Halbedelsteinen, versorgen Wissenschaftler in aller Welt mit Klimadaten aus der Namib. Sie schützen die letzten Wüstenelefanten vor den Menschen, denn die Tiere werden als Konkurrenten um das knappe Wasser betrachtet. Die Wüste ist voller Leben.
- eventId: 859333
  start: 2026-10-04T09:15:00Z
  stop: 2026-10-04T10:00:00Z
  title: Wunderschön! Quer durch die Wachau
  subtitle: 'Moderation: Daniel Aßmann'
  subtitled: true
  genre:
  - '144'
  description: Urlaub im Marillenland! Die Aprikosen aus der Wachau sind berühmt. Bei seiner Reise durch diesen Teil Österreichs kommt Daniel Aßmann weder an Marillenknödeln noch dem gleichnamigen Schnaps vorbei. Er radelt an sattgrünen Weinhängen an der Donau entlang und besucht die Ruine Burg Aggstein, das weltbekannte Benediktinerkloster Melk und den Touristen-Hotspot Dürnstein. Sportliche Urlauber können auf der Donau Wakesurfen oder eine gemütliche Kanutour durch die renaturierten Donau-Auen machen. Zum Ende seiner Reise besucht Daniel Aßmann ein Marillen-Stadtfest in Krems, wo der angeblich längste Marillenkuchen der Welt aufgestellt ist.
- eventId: 859334
  start: 2026-10-04T10:00:00Z
  stop: 2026-10-04T10:45:00Z
  title: Michael Martin - Mit der Kamera um die Welt (3/4)
  subtitle: Sibirien und Arktis
  description: Sibirien ist größer als die Volksrepublik China, durchzogen von rund 50.000 Flüssen und bedeckt von endlosen Wäldern. Im grimmigen Winter besucht Michael Martin Rentiernomaden in der Waldtundra, bestaunt das glasklare Eis des Baikalsees und fährt 2.000 Kilometer weit durch Jakutien. Im sogenannten "kalten Herz Sibiriens" besucht er Oimjakon, den kältesten bewohnten Ort der Erde. Das zweite Zielgebiet Michael Martins in dieser Sendung ist die Arktis. Zweimal reist er entlang der Westküste Spitzbergens Richtung Nordpol. Auf Foto-Jagd nach Eisbären, dem "König der Arktis", entdeckt er für uns atemberaubende Landschaften.
- eventId: 859335
  start: 2026-10-04T10:45:00Z
  stop: 2026-10-04T11:30:00Z
  title: Länder - Menschen - Abenteuer (2/2)
  subtitle: 'Mit dem Zug durch Neuseeland: Die Südinsel - Vom Pazifik in die Südalpen'
  subtitled: true
  description: Die Südinsel Neuseelands ist die rauere, wildere Schwester der Nordinsel, landschaftlich und klimatisch. Hier überwinden die Züge spektakuläre Strecken vom Pazifischen Ozean bis zu den Bergen der Südalpen Neuseelands. In Christchurch löst der TranzAlpine den Coastal Pacific-Train ab. Die Südinsel ist auch Erdbebengebiet. Immer wieder verbiegen Verwerfungen die Schienen. Der Zug durchquert die Südalpen, Gebirge und Gletscherflüsse, bis er die Westküste erreicht.
- eventId: 859336
  start: 2026-10-04T11:30:00Z
  stop: 2026-10-04T12:00:00Z
  title: Eisenbahn-Romantik (1002)
  subtitle: Kyushu - Auf schmaler Spur durch Japans Süden
  subtitled: true
  genre:
  - '144'
  description: Vorbei an heißen Quellen und rauchenden Vulkanen - der Süden Japans ist geprägt von durchaus bedrohlichen Naturschönheiten. Auf dem großen Schmalspurnetz der japanischen Eisenbahn geht es durch die Südinsel Kyushu. Im "Yufuin no Mori" werden die Fahrgäste schon durch das Ambiente auf den Kurort Yufuin mit seinen heißen Quellen eingestimmt. Alte japanische Wohnkultur bietet ein Edelgasthof mit privaten Bädern.
- eventId: 859373
  start: 2026-10-04T12:00:00Z
