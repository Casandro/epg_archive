  stop: 2026-10-04T14:00:00Z
  title: Jednostka do zadań specjalnych 8 (odc. 2)
  subtitle: Martin zajmuje się swoją pierwszą sprawą jako szef nicejskiego oddziału żandarmerii.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2014
    Reżyseria: Eric Le Roux
    Występują: Xavier Deluc, Franck Sémonin, Manon Azem, Chrystelle Labaude, Vincent Primault, James Gerard
    Martin zajmuje się swoją pierwszą sprawą jako szef nicejskiego oddziału żandarmerii. Uwięziona w samochodzie kobieta telefonuje po pomoc, jednak po dotarciu na miejsce zespół Berniera znajduje nie ją, a zwłoki starszej kobiety w bagażniku. Wkrótce w sprawie pojawiają się wątki romansów, szantażu i rodziny zastępczej. Test DNA dowodzi, że Lucas jest ojcem Elliota. Lucas nawiązuje z nim więź, ale obawia się, że nie jest gotowy na rodzicielstwo.
  ageRating: 16
