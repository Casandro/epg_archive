    Annette Granier, zwykła młoda kobieta, zostaje otruta rozpyloną na nią śmiertelną trucizną. Ofiara pracowała dla Maison Lacombe, znanego paryskiego producenta perfum. Candice odkrywa, że kobieta była pod stałym nadzorem pracodawców, podejrzewa więc, że w sprawie może chodzić o szpiegostwo przemysłowe.
