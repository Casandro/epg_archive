  title: Jednostka do zadań specjalnych 7 (odc. 16)
  subtitle: Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2013
    Reżyseria: Gérard Marx
    Występują: Xavier Deluc, Virginie Caliari, Chrystelle Labaude, Jean-Pascal Lacoste, Manon Azem, Vincent Primault
    Serial śledzi pracę specjalnej jednostki policji w Bordeaux, stawiającej czoła złożonym i niebezpiecznym sprawom kryminalnym. Równocześnie uwaga skupiona jest na skomplikowanych relacjach między członkami zespołu, gdzie lojalność, napięcia i przyjaźnie splatają się w codziennym życiu. Obsada: Xavier Deluc, Chrystelle Labaude, Franck Semonin
  ageRating: 12
- eventId: 1268820
  start: 2026-10-04T11:40:00Z
  stop: 2026-10-04T12:50:00Z
  title: Jednostka do zadań specjalnych 8 (odc. 1)
  subtitle: Martin Bernier staje się świadkiem śmiertelnej strzelaniny i ratuje dziecko. W następstwie tych wydarzeń spotyka porucznika Lucasa Auriola i rozważa objęcie szefostwa nad jego zespołem.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2014
    Reżyseria: Eric Le Roux
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Félicité Chaton, Julie Fournier, Stéphane Soo Mongo
    Minął rok od czasu rozwiązania zespołu detektywów z Bordeaux. Kapitan francuskich sił policyjnych - Martin Bernier - przebywa w uroczej nadmorskiej mieścinie na południu Francji. Jednak nie jest mu dane odpocząć, ponieważ mimowolnie staje się świadkiem śmiertelnej strzelaniny i ratuje dziecko z samochodu. W następstwie tych wydarzeń spotyka porucznika Lucasa Auriola i rozważa objęcie szefostwa nad jego zespołem. Sama sprawa strzelaniny zaskakuje: spadki, zdrady, rodzinne koneksje i kłótnie.
  ageRating: 16
