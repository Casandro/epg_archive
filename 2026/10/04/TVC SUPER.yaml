  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 7)'
  subtitle: Na plaży znaleziony zwłoki kobiety. Canovas nabiera podejrzeń, że morderstwa dokonał ów przestępca, natomiast Candice jest przekonana, że camping mógł być miejscem przerażającego przemytu.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab
    Na plaży znaleziony zwłoki kobiety. Trop prowadzi Candice na pobliski camping. Miejsce to znajduje się równocześnie pod stałą obserwacją zespołu komendanta Canovasa z brygady interwencyjnej, próbującego znaleźć zbiegłego bandytę. Canovas nabiera podejrzeń, że morderstwa dokonał ów przestępca, natomiast Candice jest przekonana, że camping mógł być miejscem przerażającego przemytu. Kto ma rację? Candice czy Canovas? A może każde z nich odkryło fragment tej samej układanki?
  ageRating: 16
