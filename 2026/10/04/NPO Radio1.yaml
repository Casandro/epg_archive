  title: Vroege vogels
  subtitle: 'Radioprogramma over natuur, milieu, klimaat en duurzaamheid. Presentatie: Menno Bentveld.'
  description: 'Onze taal is dieronvriendelijk, gewelddadig en niet duurzaam. Zo begint het boek Dierbare Taal, geschreven door Ingrid Visseren-Hamakers. Ruim 15 jaar gaan de libellensoorten van vennen achteruit. Voor een groot deel is dit te wijten is aan lage zuurstofgehaltes in het water. Een knorgel is een interactief muziekinstrument bedacht door kunstenaar Pinopotato om varkens extra afleiding en vermaak te bieden. Werkt het? En verder in de uitzending: palmolie in Papoea-Nieuw-Guinea, gat in een Texelse dijk, mossen van Paulien Cornelisse en droogte in de bossen. De columns zijn van Dolf Jansen. Vroege Vogels Radio op NPO Radio 1 wordt zondag gepresenteerd door Jan van Poppel vanuit de studio te Hilversum van 7.00 tot 10.00 uur. Lees meer over de gehele uitzending (2026)'
