  title: Wat blijft
  subtitle: Wat blijft als we er niet meer zijn? En welke inspiratie kunnen we halen uit de levensverhalen van anderen?
  description: 'Wat blijft als we er niet meer zijn? En welke inspiratie kunnen we halen uit de levensverhalen van anderen? Van voetballers, kunstenaars en politici tot lokale helden: Wat blijft belicht van bekende mensen een kant die je nog niet kent en diept verhalen op van nog onbekende en onderbelichte mensen die de moeite waard zijn om te leren kennen. (2026)'
