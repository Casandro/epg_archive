  description: |-
    Gerade wähnte sich die glückliche Braut Sandra noch im Himmel. Doch nun reißt sie ein kurzer Satz aus allen Träumen: "Tim ist tot." Nele und ihr Kollege Paul haben am Morgen die Leiche Tim Kreindels aus dem Bodensee gefischt. Auf dem begabten jungen Koch ruhten alle Hoffnungen, das einst renommierte Restaurant "Fischerhütte" wieder zu neuem Glanz zu führen.

