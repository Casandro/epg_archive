  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Filmmusik aus Zeichentrickklassikern: Christian Schumann dirigiert das Danish National Symphony Orchestra, begleitet von Chor und Big Band.

    Das Danish National Symphony Orchestra, der DR Concert Choir und die DR Big Band interpretieren unter der Leitung von Christian Schumann Musik aus bekannten Animationsfilmen. Das Programm vereint klassische Cartoon-Kompositionen mit moderner Filmmusik, von Carl Stalling bis Michael Giacchino. Der Konzertfilm von Karsten Andersen (2022) zeigt die stilistische Vielfalt und dramaturgische Kraft dieser Musik.
- eventId: 653076
