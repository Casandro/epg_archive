  description: ChrisTine Urspruch schlüpft für die neue Reihe "Einspruch, Schatz!" in die Anwaltsrobe. Für die Juristin mit Herz kommt das Menschliche stets vor den Paragrafen. Mit Dialogwitz und Feingefühl verkörpert die als "Tatort"-Rechtsmedizinerin bekannte Hauptdarstellerin eine unkonventionelle Titelheldin. Auf unterhaltsame Weise prallt das Lebenskonzept der selbstbewussten Singlefrau auf die Beziehungsmodelle ihrer Mandant:innen. Für ein unkontrollierbares Chaos-Element sorgt Publikumsliebling Wolfram Grandezka als undurchsichtiger Charmeur. In der Rolle von Evas Vater ist der Kabarettist Jochen Busse zu sehen.
