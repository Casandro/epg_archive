  title: 'Erlebnis Erde: Das Ende der Insekten? - Maria Furtwängler auf Spurensuche'
  subtitle: Ein Film von Anna Maria Behrends
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Insekten sind die unscheinbaren Helden des Planeten. Sie bestäuben Nutzpflanzen, recyceln Abfälle und dienen als Nahrungsquelle für unzählige andere Tiere. Damit sind sie auch unverzichtbar für den Menschen. Doch in den letzten Jahrzehnten hat sich ihre Zahl dramatisch verringert. Warum? Das möchte Maria Furtwängler auf ihrer Spurensuche herausfinden. Dafür trifft sie Menschen aus Forschung und Agrarindustrie, Hersteller von Pflanzen- und Insektenschutzmitteln, ökologisch und konventionell arbeitende Landwirte vom Alten Land in Norddeutschland bis zur Schwäbischen Alb.
- eventId: 653258
