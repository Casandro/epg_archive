  title: 'Erlebnis Erde: Geheimnisvoller Garten - Erntezeit (2/2)'
  subtitle: Ein Film von Jan Haft
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: Schon immer gilt der Garten als Abbild des Paradieses, das bezeichnenderweise auch Garten Eden genannt wird. Nicht allein die Natur führt hier Regie, sondern auch der Mensch. Wir schaffen uns unsere eigene Welt voller betörender Formen, Farben und Düfte. Im Paradies vor der Haustür siedeln sich aber auch jede Menge Pflanzen und teils seltene oder sogar bedrohte Tiere an. Der zweite Teil "Geheimnisvoller Garten" folgt den großen und kleinen Dramen vom Sommer über den Winter bis zum erneuten Frühlingserwachen und zeigt auf spannende Weise, wie die verschiedenen Arten vor unserer Haustür zusammenleben.
