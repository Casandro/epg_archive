  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Johann Friedrich Fasch: Ouvertüre A-Dur (Les Amis de Philippe: Ludger Rémy); Carl Maria von Weber: Concertino Es-Dur, op. 26 (Sharon Kam, Klarinette; MDR-Sinfonieorchester: Gregor Bühl); Tomás Luis de Victoria: "Officium defunctorum" (Alba Vilar-Juanola, Sopran; MDR-Rundfunkchor: Risto Joost); Georg Philipp Telemann: Suite G-Dur (La Stagione Frankfurt: Michael Schneider); Felix Mendelssohn Bartholdy: Sinfonie Nr. 2 B-Dur - "Lobgesang" (Ilse Eerens, Esther Dierkes, Sopran; Maximilian Schmitt, Tenor; MDR-Rundfunkchor und Sinfonieorchester: Risto Joost)

    2.

    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Johann Friedrich Fasch: Ouvertüre A-Dur (Les Amis de Philippe: Ludger Rémy); Carl Maria von Weber: Concertino Es-Dur, op. 26 (Sharon Kam, Klarinette; MDR-Sinfonieorchester: Gregor Bühl); Tomás Luis de Victoria: "Officium defunctorum" (Alba Vilar-Juanola, Sopran; MDR-Rundfunkchor: Risto Joost); Georg Philipp Telemann: Suite G-Dur (La Stagione Frankfurt: Michael Schneider); Felix Mendelssohn Bartholdy: Sinfonie Nr. 2 B-Dur - "Lobgesang" (Ilse Eerens, Esther Dierkes, Sopran; Maximilian Schmitt, Tenor; MDR-Rundfunkchor und Sinfonieorchester: Risto Joost)

    2.03  Das ARD-Nachtkonzert (II)

    Wolfgang Amadeus Mozart: Sinfonie D-Dur, KV 385 - "Haffner" (Symphonieorchester des Bayerischen Rundfunks: Ferdinand Leitner); Luigi Boccherini: Streichquintett B-Dur (Ensemble Concertant Frankfurt); Igor Strawinsky: Concerto (Nikita Magaloff, Klavier; NDR Sinfonieorchester: Günter Wand); Ludwig van Beethoven: Sonate G-Dur, op. 96 (Gidon Kremer, Violine; Oleg Maisenberg, Klavier); Joseph Haydn: Sinfonie Nr. 86 D-Dur (Handel and Haydn Society: Harry Christophers)

    4.03  Das ARD-Nachtkonzert (III)

    Georg Muffat: Chaconne G-Dur (Mitglieder der Musica Antiqua Köln); Johann Sebastian Bach: Partita B-Dur, BWV 825 (Andras Schiff, Klavier); Alexander von Zemlinsky: Sinfonietta, op. 23 (Sinfonieorchester des Dänischen Rundfunks: Thomas Dausgaard)

    5.03  Das ARD-Nachtkonzert (IV)

    Maurice Ravel: Streichquartett F-Dur, Assez vif (Emerson String Quartet); Luigi Boccherini: Sinfonie Nr. 6 A-Dur, Allegro assai (Akademie für Alte Musik Berlin); Ferdinand Hérold: Klavierkonzert Nr. 2 Es-Dur, Allegro maestoso (Jean-Frédéric Neuburger, Klavier; Orchestra Sinfonia Varsovia: Hervé Niquet); Ermanno Wolf-Ferrari: "La dama boba", Ouvertüre (BBC Philharmonic Orchestra: Gianandrea Noseda); Angelo Ragazzi: Sonata g-Moll, op. 1, Nr. 6 (Andrés Gabetta, Violine; Cappella Gabetta); Louise Farrenc: Klaviertrio d-Moll, Finale, op. 34 (Abegg Trio)
