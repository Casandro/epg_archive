    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Die Polizisten werden gerufen, weil ein Mann beim Verkauf seines Gebrauchtwagens niedergeschlagen und ausgeraubt wurde. Bald darauf gibt es einen neuerlichen Überfall! Doch es sind zwei Paare im Haus - wer ist Opfer und wer Täter? - Die Polizei wird alarmiert, weil ein Mann Möbel aus dem vierten Stock wirft. Was ist in der Familie bloß los? - Damenunterwäsche verschwindet aus einer gemeinschaftlichen Waschküche, woraufhin ein Streit zwischen Nachbarn entbrennt.
  widescreen: true
