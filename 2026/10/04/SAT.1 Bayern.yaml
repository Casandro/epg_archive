  description: 'Eine Mutter alarmiert die Polizei, weil ihrem Sohn Zigaretten verkauft wurden. Vor Ort stellt sich heraus, dass es sich um Schmuggelware handelt. Doch woher kommt diese? - Der Geschäftsführer eines Möbelhauses ruft die Polizei. Er hat beim Aufschließen seines Ladens einen unbekannten Mann in den Geschäftsräumen entdeckt, der dort zu ''wohnen'' scheint. - Die Polizei wird von einer entnervten Frau alarmiert: Ihre Nachbarn verursachen wahnsinnigen Lärm.'
