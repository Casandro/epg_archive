  title: Oblivion
  subtitle: |-
    Oblivion
    Science-Fiction, USA 2013
    Altersfreigabe: ab 12
  description: |-
    Tom Cruise geht im Jahr 2077 auf Mission Weltrettung: Die Menschen haben einen Krieg mit Aliens zwar gewonnen, die Erde ist seitdem jedoch zerstört und Überlebende wurden auf Raumstationen untergebracht. Der Techniker Jack ist einer der wenigen, die auf dem Planeten geblieben sind, um die letzten Ressourcen vor Außerirdischen zu schützen. Als auch er abgezogen werden soll, entdeckt er ein abgestürztes Raumschiff. Er bleibt auf der Erde und macht dort ungeheuerliche Entdeckungen.

    Regie: Joseph Kosinski
    Drehbuch: Karl Gajdusek, Michael Arndt
    Komponist: Anthony Gonzalez

    Darsteller:
    Tom Cruise (Jack)
    Olga Kurylenko (Julia)
    Morgan Freeman (Beech)
    Andrea Riseborough (Victoria)
    Nikolaj Coster-Waldau (Sykes)
    Melissa Leo (Sally)
    Zoe Bell (Kara)
  widescreen: true
