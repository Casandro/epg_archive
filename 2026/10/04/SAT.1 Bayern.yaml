    Dokutainment, D 2026
    Altersfreigabe: ab 6
    (WH vom Mittwoch, 30.09.2026, 20:15 Uhr)
  description: |-
    Moderation: Enie van de Meiklokjes

    Im großen Finale dreht sich alles um royale Eleganz im Stil von "Bridgerton". Kuppel-Törtchen, kunstvolle Blätterteig-Schnitten und eine spektakuläre zweistöckige Finaltorte verlangen höchste Präzision und Kreativität. Am Ende entscheidet sich, wer den Goldenen Cupcake und den Titel "Deutschlands bester Hobbybäcker 2026" gewinnt.

