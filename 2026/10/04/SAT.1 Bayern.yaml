  title: So gesehen - Talk am Sonntag
  subtitle: |-
    So gesehen - Talk am Sonntag
    Kirchenprogramm, D 2026
    Altersfreigabe: ab 12
  description: Bei "So gesehen - Talk am Sonntag" stehen die ethischen Grundfragen des Lebens im Mittelpunkt. Wie handele ich verantwortlich in der Welt? Welche Werte zählen für mich? In jeder Sendung spricht der Moderator mit einem Gast über Lebenseinstellungen und Werte. Gäste sind Schauspieler, Musiker, Politiker - Menschen, die eine Geschichte zu erzählen haben. Moderiert wird der Talk im Wechsel von Julian Sengelmann (evangelische Kirche) und Pater Max Cappabianca (katholische Kirche).
  widescreen: true
