  title: Na siehste! - Das TV Kult-Quiz mit Elton
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Das ultimative Spiel für alle Fernsehfans: Elton bringt mit seinem amüsanten Quiz die schönsten Erinnerungen aus 60 Jahren Fernsehen zurück. Bewegende Momente, unvergessene Helden, große Skandale, peinliche Pannen - zum Lachen, Staunen und natürlich zum Mitraten. \nVier Fernsehlegenden treten in einem unterhaltsamen Wettstreit gegeneinander an: Jürgen von der Lippe, einer der erfolgreichsten deutschen Showmaster, Caroline Peters, eine der größten deutschen Schauspielerinnen, Kurt Krömer, einer der lustigsten deutschen Komiker, und Wolfgang Lippert, einer der vielseitigsten deutschen Entertainer."
- eventId: 651440
  start: 2026-10-04T21:30:00Z
  stop: 2026-10-04T22:00:00Z
  title: Sportclub Story
  subtitle: Ware Pferd - Macht das Geld den Reitsport kaputt?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Was einst als harmonische Partnerschaft zwischen Mensch und Tier galt, steht heute unter massivem Rechtfertigungsdruck. Immer neue Tierschutzskandale erschüttern die Reitszene. Fragwürdige Trainingsmethoden wie die Rollkur bis hin zu sichtbaren Schmerzen der Tiere auf Turnieren, werfen kein gutes Licht auf die Branche. \nDiese \"Sportclub Story\" liefert eine kontroverse wie hochaktuelle Bestandsaufnahme einer Branche im radikalen Wandel und zeigt schonungslos, dass der Reitsport sein System von Grund auf hinterfragen muss, wenn er überleben will."
