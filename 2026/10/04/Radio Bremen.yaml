  title: 'Nordreportage Spezial: Heiß, fettig und mit ganz viel Herz'
  subtitle: Imbissgeschichten aus _m Norden
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dort wird man satt und Klönsnack gibt _s obendrauf: ob die Kantine Krüger in Groß Tessin in Mecklenburg- Vorpommern oder Mankes Krämerladen in Wintermoor in Niedersachsen. Hier trifft sich das Dorf. Schlange stehen gehört dazu, wie bei Calli Schaschlik im nordfriesischen Leck. In dritter Generation brutzeln die Paulsens hier für ihre Kundschaft. Die Veddeler Fischgaststätte ist in Hamburg die älteste ihrer Art. Jeder weiß, was auf die Teller kommt: hausgemachter Backfisch mit Kartoffelsalat nach Geheimrezept von 1932.
    Die schönsten vier Imbissgeschichten aus dem ganzen Norden im Jubiläumsfilm für "Die Nordreportage".
- eventId: 651416
  start: 2026-10-04T19:45:00Z
  stop: 2026-10-04T20:45:00Z
  title: Kaum zu glauben!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: 'Moderation: Kai Pflaume'
  description: |-
    Das Rateteam, bestehend aus Bernhard Hoëcker, Hubertus Meyer-Burckhardt, Stephanie Stumph und Wincent Weiss, brennt geradezu darauf, den Gästen der Sendung ihre verblüffenden Geheimnisse, überraschenden Fähigkeiten, spektakulären Rekorde oder emotionalen Erlebnisse zu entlocken. Denn vor diesen vieren ist kein Thema und kein Kandidat sicher: Welche unglaublichen Geschichten werden sie wohl diesmal erraten?

    Es bleibt spannend, wenn wieder die Möwentröte ertönt und die witzigen Ratehinweise manchmal mehr in die Irre als in die richtige Richtung führen, aber immer für reichlich Reaktionen im Publikum sorgen.
- eventId: 651417
