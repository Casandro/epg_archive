  title: Podcast "Mission Artenvielfalt"
  subtitle: Folge 2 - Unterwegs mit Artenspürhund Arni
  description: "Zwei Drittel aller Ökosysteme haben sich in den letzten 50 Jahren verschlechtert. Die Welt wird heißer, Wasser wird knapp - und damit auch die Lebensräume von Tieren und Pflanzen. In \"Mission Artenvielfalt\" begleiten wir Menschen, die es anders machen wollen. Unsere Helden der Artenvielfalt erzählen von den Versuchen, bedrohte Arten zu retten, von den Bemühungen, die Biodiversität zu erhalten, vom Sinn, den auch ungeliebte Tiere für die Natur haben, und vom Versuch, invasive Arten einzudämmen.\n\nAls Podcast verfügbar in ARD Sounds\n\nMission Artenvielfalt - Folge 2 - Unterwegs mit Artenspürhund Arni \n\nUm seltene Tierarten zu erfassen, ist es nötig, Tiere zu fangen und sie zu bestimmen. Ein schwieriges Unterfangen, bei dem Spürhunde helfen können. Artensuchhund Arnie erschnüffelt Tiere dort, wo Menschen sie übersehen hätten.\nAutor: Markus Schmidbauer\nRedaktion: Jeanne Turczynski und Simon Plentinger"
