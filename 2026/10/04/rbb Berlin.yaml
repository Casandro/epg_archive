  description: "Musik begleitet uns durch den Alltag, löst Erinnerungen aus, kann Menschen verbinden und Räume verändern. Zugleich ist die Art, wie wir Musik hören, heute eine andere: Wir streamen, tragen Kopfhörer, hören personalisierte Playlists und bekommen Musik von Algorithmen empfohlen. Was macht das mit unserem Hören - und mit uns? Der radio3 Ateliertalk bringt Kunst und Wissenschaft zusammen und fragt: Wie verändert uns Musik?\n\nGäste: \n* Annika Kahrs, Künstlerin\n* Julius Holtz, Klangforscher\n* Prof. Dr. Anna Schürmer, Ernst von Siemens-Musikstiftungsprofessorin für Neue Musik an der Freien Universität Berlin"
