  description: Die Hydrierwerke Pölitz dienen den Nazis als Treibstoffproduktionsstätte und sollen ihnen in Sachen Energieversorgung eine autarke Position ermöglichen. Die Alliierten bombardieren die Fabrik mehr als zehn Mal, bis sie schließlich in Schutt und Asche zerfällt. Der Treibstoff, mit dessen Hilfe Unheil und Tod über die Welt gebracht wurde, versiegt.
