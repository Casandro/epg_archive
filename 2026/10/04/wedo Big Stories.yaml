  title: The New Frontier
  subtitle: Orbit, Education / Science / Factual topics 2016, Season:2 Episode:3
  description: '2016 ● S2 E3 Die Internationale Raumstation ist zweifellos das Prunkstück im Erdorbit. Doch es gibt dort noch viele weitere Ressourcen: Satelliten für Kommunikation, Wetterbeobachtung, globale Positionsbestimmung - die Liste wächst stetig. Education / Science / Factual topics 2016, Season:2 Episode:3'
