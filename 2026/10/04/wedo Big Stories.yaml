  title: The New Frontier
  subtitle: Von Ufer zu Ufer, Education / Science / Factual topics 2016, Season:2 Episode:1
  description: '2016 ● S2 Unsere Seefahrernatur hat sich gut auf das Raumfahrtzeitalter übertragen: Wir wollen ins Unbekannte segeln, um nach Reichtümern der einen oder anderen Art zu suchen. Während Europa und Asien ihr Interesse am ressourcenreichen Mond fortsetzen, haben die Vereinigten Staaten und die NASA nichts Geringeres als bemannte Missionen zum Mars im Visier. Können sie es schaffen, auf dem gefährlichsten aller unbekannten Meere, dem tiefen Weltraum, von Land zu Land zu gehen? Education / Science / Factual topics 2016, Regie: Andrew Thomson,  Mit: Stuart Sykes, Season:2 Episode:1'
- eventId:
