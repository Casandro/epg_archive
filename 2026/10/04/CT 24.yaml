  title: Archiv ČT24
  subtitle: Na tom pražském mostě. Co zažily mosty v našem hlavním městě.
  description: |-
    HDTV
    Skryté titulky
    Nejstarším mostem přes Vltavu v Praze je kamenný Karlův most, dokončený v roce 1402. Vzhledem ke svém unikátnosti vyžaduje ohleduplnou údržbu. V 70. letech minulého století překlenul Nuselské údolí most, který se stal významnou dopravní tepnou. Zásadní význam pro dopravu v hlavním městě má i Barrandovský most, který se stavěl v 80. letech. Zajímavým architektonickým počinem je Trojský most, který byl dokončen v roce 2014. Stavby pražských mostů a dění na nich zaznamenaly kamery filmových týdeníků a televizního zpravodajství.
