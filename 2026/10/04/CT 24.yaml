  subtitle: Vítejte v pražské zoo! Daniel Stach vás v Hyde Parku Civilizace vezme přímo ke zvířatům. Začne ve výběhu u draků - varanů komodských - o kterých kurátor chovu plazů Petr Velenský tvrdí, že se "musíte se
