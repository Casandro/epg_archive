  title: ANIXE auf Reisen - Ein Leben ohne Aids & Armut - Hugo Tempelman und die Kinder Südafrikas
  description: Die AIDS-Rate in Südafrika ist anhaltend hoch. Jedes Jahr sterben mehr als 150.000 Menschen an der Erkrankung. Der Arzt Hugo Tempelman hat es sich zur Lebensaufgabe gemacht, dies zu ändern. Im Township Elandsdoorn im Nordosten Südafrikas hat er seinen Einsatz für diese Kinder aufgenommen. Begonnen hat er vor 1994 mit einer kleinen Arztpraxis. Inzwischen betreibt er ein Krankenhaus und eröffnet in Kürze die fünfte von ihm gebaute Schule. Doch nicht nur die medizinische Behandlung und Betreuung der Kranken sieht er als seine Aufgabe. Mit zahlreichen sozialen Programmen und Infrastruktur-Projekten hat er es mit seinen Mitarbeitern geschafft, das Leben der schwarzen Landbevölkerung maßgeblich zu verbessern. Zusammen mit dem Schauspieler Clemens Schick besuchen wir Hugo Tempelman und seine Projekte, begleiten ihn bei seiner Arbeit und sprechen mit AIDS-Waisen und ihren Sozialarbeitern.
  widescreen: true
