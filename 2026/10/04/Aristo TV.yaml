  title: So schmeckt die Welt - Dominikanische Republik
  description: Auf seinem Weg Indien zu finden und letztlich Amerika zu entdecken, streifte Christoph Columbus auch die Dominikanische Republik und steuerte am 05. Dezember 1492 auf den Norden der Insel zu.  Columbus hatte zu diesem Zeitpunkt unzählige Sonnenaufgänge und Untergänge hinter sich, doch von diesem muss er besonders beeindruckt, wenngleich geblendet worden sein.Im Mondscheinerstrahlte eine Bucht in einem faszinierenden Silberschimmer. Millionen von kleinen Silbersteine funkelten auf dem Meer und wandelten die Nacht zum Tage. Mit dem Aufgang der Sonne hatte der Entdecker Amerikas das Gefühl auf einen Silbermeer zu schwimmen. Der Name Puerto Plata -Silberner Hafen war geboren.
