  title: Planet Weltweit - Dem Wolf auf der Spur - Schnüffeln für den Artenschutz
  subtitle: Planet Weltweit - Dem Wolf auf der Spur - Schnüffeln für den Artenschutz
  description: 'Die Wildbiologin Lea Wirk und ihre Labrador-Hündin Molly sind ein eingespieltes Team: Molly ist dazu ausgebildet, Spuren von Wölfen zu finden. Lea arbeitet seit mehreren Jahren für ein Institut für Wolfsforschung in der Lausitz. Ihre Arbeit ist wichtig, um einen Überblick darüber zu bekommen, wie viele Wölfe es wirklich gibt. Der Wolf ist in den 1990er Jahren nach Deutschland zurückgekehrt, nachdem er beinahe 100 Jahre lang als ausgerottet galt. Naturschützer freuen sich über seine Rückkehr. Schafhalter hingegen sehen das Comeback des Wolfs sehr kritisch. Lea und ihre Kollegen sammeln Daten, aus denen sie abzulesen versuchen, wie viele Wölfe in den verschiedenen Territorien der Region unterwegs sind. Was fressen sie, wie bewegen sie sich, wie verschieben sich die Grenzen ihrer Reviere und wie sieht es mit Nachwuchs aus? Doch wie kommt man den scheuen und klugen Wildtieren auf die Spur? Spürhündin Molly ist darauf trainiert, Wolfskot zu suchen. Anhand dieser und weiterer Spuren wie Fellhaaren, Pfotenabdrücken oder Bildern aus Kamerafallen rekonstruiert Lea den aktuellen Zustand und die Entwicklung der lokalen Wolfspopulationen, das sogenannte Wolfsmonitoring. Leas und Mollys Einsatzgebiet ist die Lausitz, ein im Süden Brandenburgs und im östlichen Teil Sachsens gelegener Landstrich. Um die 30 Wolfsterritorien gibt es hier, es ist das dichteste Vorkommen in Deutschland. Wölfe leben in Rudeln. Solange die Welpen klein sind, werden sie vom Rudel mitversorgt. Nach spätestens zwei Jahren wandern sie ab, um selbst ein Rudel zu gründen. So hilft der Nachwuchs, neue Gebiete in Deutschland zu besiedeln und das Wolfsvorkommen weiter zu stabilisieren. Doch was den Wolf freut, sorgt bei anderen für Unbehagen: Schafhalter Rainer Fehrmann hat auf dem Acker vor seiner Weide verdächtige Spuren entdeckt. Ein Wolf auf der Suche nach leichter Beute?  DE 2020'
