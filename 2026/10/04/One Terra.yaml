  title: Planet Weltweit - Miyako, Insel des langen Lebens
  subtitle: Planet Weltweit - Miyako, Insel des langen Lebens
  description: 'Die zerklüftete Insel liegt blaugrau im ersten Morgenlicht. Kleine schaumgekrönte Wellen brechen an furchige Klippen. Eine Landschaft wie ein Gesicht - ein Gesicht, in dem Jahrhunderte ihre Spuren hinterlassen haben. So wie in den Gesichtern der vielen über hundertjährigen Menschen, die es auf der japanischen Insel Miyako gibt. Hier werden die Menschen am ältesten und bleiben dabei meist gesund. Der Film erzählt von diesen Menschen, die die Welt seit einem Jahrhundert kennen und immer noch mitten im Leben stehen. "Pin-pin" - gesund, dass sie wie Bälle springen, nennt man hier auf der Inselgruppe Okinawa liebevoll die hochbetagten Lebenskünstler. Ihre Lebenszeit ist vermeintlich abgelaufen, doch sie machen weiter als gäbe es keine Endlichkeit. Jeden weiteren Tag, den die Alten entschlossen und gesund bewältigen, trotzen sie dem Leben ab. Dabei hilft ihnen die gesunde, vielfältige und leichte Kost der Region, die oft aus dem eigenen Garten stammt. Wichtiger vielleicht ist noch ihr Lebenswille. Schon am frühen Morgen sieht man die Alten überall ihr Tagwerk beginnen. Der Viehzüchter Koso Kawamitsu steht täglich um sechs Uhr auf. Nach der Morgengymnastik wartet seine Arbeit auf ihn, auch im ersten Jahr nach seinem hundertsten Geburtstag. Mit seinen prächtigen Rindern bessert er seine spärliche Rente auf - die Tiere sind seine Lebensquelle, sein "Ikigai". Koso-San ist seit 75 Jahren mit seiner Frau Yuki-San verheiratet, und die beiden lieben sich noch immer. Auch Mitsu Shimoji hat sich mit ihren 92 Jahren noch nicht zur Ruhe gesetzt. Im Gegenteil: Noch vor zwei Jahren hat sie eine Lehrwerkstatt für die Herstellung des berühmten schwarz-blauen Miyako-Jofu eröffnet - eines der exquisitesten und kostbarsten Kimonostoffe Japans. Sie hat noch immer die Augen und das Lachen eines jungen Mädchens. Ihre Kraft ist nahezu ungebrochen, und sie hat weiterhin viel vor - auch ihrer kleinen Urenkelin möchte sie noch das Weben beibringen. DE 2007'
