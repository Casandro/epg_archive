  description: Sie gehören zu den bekanntesten Tieren Australiens und den skurrilsten Erscheinungen der Natur - die Schnabeltiere. Ausgestattet mit einem Schnabel und gleichzeitig einem dichten Pelz, eierlegend und trotzdem ihre Jungen säugend, wurden die Tiere einst von den ersten europäischen Entdeckern für eine Fälschung cleverer Geschäftsleute gehalten. Danach wurden sie wegen ihres Pelzes gejagt und fast ausgerottet. Zwischenzeitlich hatte sich ihr Bestand erholt. Doch die Bedrohungen der letzten Jahre - vorrangig Buschfeuer, Überschwemmungen, doch auch fortschreitende Landnahme durch die Menschen - setzen den eigentümlichen Tieren erneut zu. Nun sollen neue Schutz- und Umsiedlungsmaßnahmen für ihr Comeback sorgen. DE 2023
