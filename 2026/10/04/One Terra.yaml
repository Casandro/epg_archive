  title: Planet Weltweit - Wildererjagd am Mount Kenya
  subtitle: Planet Weltweit - Wildererjagd am Mount Kenya
  description: 'Ein 5.200 Meter hoher Riese thront am Äquator: der Mount Kenya. Den Berg umringt ein dichter, undurchdringlicher Regenwald, in dem rund 2.000 Elefanten leben. Die Natur hier ist nahezu unberührt. Doch dieses Paradies ist bedroht seit Wilderer ihr Unwesen treiben. Die Dokumentation beobachtet die Fallensteller und begleitet deren Jäger, die Wildhüter vom Mount Kenya, auf ihren gefährlichen Streifzügen durch den Tropenwald. Bereits in den frühen Morgenstunden ist der tropenfeuchte Wald höchst lebendig: In den Baumkronen, 50 Meter weit oben, zetern halbstarke Meerkatzenmännchen. Äste krachen, von Elefanten beim Frühstück gebrochen. Der Wildhüter Simon Gitau und seine Kollegen streifen durch das Dickicht des Bergregenwalds vom Mount Kenya, um Wilderer auf frischer Tat zu ertappen. Zur gleichen Zeit, nicht weit entfernt, machen drei Männer ihre Fallen scharf. Auf alles, was Beine hat, haben sie es abgesehen. Auch auf die fast ausgestorbene Bongo-Antilope. Simon Gitau will den Wilderern das Handwerk legen. Er ist einer der leitenden Wildhüter vom Kenya Wildlife Service - im Tierschutz hat er seine Berufung gefunden. Vor Jahren war Simon selbst Wilderer. Deshalb kennt er den Unterschied zwischen dem "kleinen" Wilderer, der es aus Armut und Bedrängnis für die Ernährung seiner Familie tut, und dem bewaffneten Großwilderer, der es auf das wertvolle Elfenbein abgesehen hat. Kriminell sind beide für ihn, denn sie bedrohen das Leben der Tiere Afrikas. Die Wildhüter haben allesamt eine militärische Ausbildung, denn die Konfrontation mit gewaltbereiten Wilderern kann sehr gefährlich werden. Dabei hat der Kenya Wildlife Service nicht nur den Schutz des einzigartigen Naturparadieses zum Ziel - auch die Bergrettung gehört zu den Aufgaben der Organisation. Der Mount Kenya ist mit knapp 5.200 Metern nach dem Kilimandscharo der zweithöchste Berg Afrikas und Sehnsuchtstort für Bergsteiger aus aller Welt. DE 2011'
