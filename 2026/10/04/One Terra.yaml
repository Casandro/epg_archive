  description: Dorfhelfer Janne Aikio ist für das Wohl alter Menschen in Lappland unentbehrlich. Täglich fährt er weite Strecken, um deren Leistungsfähigkeit zu erhalten, indem er sie bei alltäglichen Dingen unterstützt. Zum Alltag der überwiegend samischen Bewohner gehört auch das Holzhacken, die Versorgung der Rentiere und die Jagd. Die Samen sind ein Leben in der Natur gewohnt. Damit das auch im Alter möglich bleibt, ist ein erklärtes Ziel der finnischen Regierung, dass die Senioren so lange wie möglich in ihrem gewohnten Umfeld zuhause wohnen bleiben. Damit das gelingt, braucht es mehr Dorfhelfer wie Janne, denn davon gibt es zu wenige. Eine neue Ausbildung verspricht Hoffnung. Unter den angehenden Dorfhelfern sind erstmals auch Frauen dabei.  DE 2024
