  description: Bulgarien ist das EU-Land mit dem größten Bevölkerungsschwund. Das trifft besonders die ländlichen Gegenden sehr hart. So auch das kleine Dorf Dobralak im Rhodopengebirge, an der Südgrenze Bulgariens. Vor fünfzig Jahren hatte das Dorf noch rund 1000 Einwohner, nun sind die verbliebenen fünfzig, überwiegend alten Bewohner, in den langen Wintern unter sich. Sie feiern gegen die Einsamkeit die alten Rituale und Bräuche und auch im Sommer steht ein Fest an, zu dem die Kinder und Enkel sowie ehemalige Dorfbewohner geladen sind. Kann das Erneuern von Traditionen dem Dorf Dobralak wieder mehr Leben einhauchen?  DE 2024
