  subtitle: Planet Weltweit - Florida - Moderne Nixen schlagen Wellen
  description: 'Spätestens seit der Neuverfilmung von "Arielle, die kleine Meerjungfrau" in der Besetzung von Halle Bailey ist klar: das Bild von schlanken, weißen Nixen mit strahlend blauen Augen und wogendem blonden Haar ist überholt. Meerjungfrauen und Meermänner aller Hautfarben, mit Bauch und stolzem Afro gehören zur schnell wachsenden Gemeinschaft der amerikanischen Afro-Nixen, die mit althergebrachten Rollenklischees aufräumen wollen. "Im Wasser ist für alle Platz", sagen sie und tragen diese Botschaft auch an Land. Nun treffen sie sich zum vierten Mal zu einer großen Gala. Melanee Schneider organisiert das Treffen der Afro Mermaids in Miami. Grundlegende Voraussetzung für die Teilnahme ist Akzeptanz und Toleranz füreinander. Und natürlich die respektvolle Liebe zum Wasser. DE 2024'
