  description: Es gibt ihn noch, den Beruf des Säumers - Menschen, die Lasten auf dem Rücken von Saumtieren durchs Gebirge transportieren. Jahrhundertelang beförderten sie Waren über schwer zugängliche Alpenpässe. In den Seealpen, im italienischen Piemont, liegt auf 2.300 Metern die Schutzhütte Morelli Buzzi. Drei Monate im Jahr muss der Betreiber der Hütte Wanderern Kost und Logis anbieten. Doch Wege und Straßen hier hoch gibt es keine, und den Helikopter kann sich der Hüttenwirt nur einmal in der Saison leisten. Da kommen Luciano Ellena und seine Mulis ins Spiel. Er ist der letzte Säumer im Piemont und versorgt die Hütte in den kommenden drei Monaten mit Lebensmitteln. DE 2023
