  title: Land - Liebe - Luft
  subtitle: Mit Handicap zum Erfolg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Die Schweine hab'' ich besonders gern" - Mario (24) hat auf dem Kleinsägmühlerhof in Altleiningen eine Heimat gefunden. Der gehandicapte Ottfried versorgt mehr als 900 Hühner. Sein Geheimtipp, damit sie mehr Eier legen:  Streicheleinheiten. Richard Danner und Maria Burgmeier-Danner arbeiten auf dem Biobauernhof der Lebenshilfe Bad Dürkheim seit mehr als 40 Jahren mit behinderten Menschen.'
- eventId:
  - 651834
  - 859188
  start: 2026-10-04T03:15:00Z
  stop: 2026-10-04T04:00:00Z
  title: Land - Liebe - Luft
  subtitle: Neues vom Kleinsägmühlerhof
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Anders ist hier normal: Der Kleinsägmühlerhof in Altleiningen ist ein besonderer Biobauernhof. 40 Menschen mit Beeinträchtigung arbeiten in der Landwirtschaft, der Bäckerei oder im Hofladen.
    Doch jetzt stehen große Veränderungen an. Nach fast vierzig Jahren geht Betriebsleiter Richard Danner in Rente. Der Hof ist sein Herzensprojekt. Sohn Matthias will übernehmen und mitsamt Familie auf den Hof ziehen. Doch zunächst wartet eine erste große Bewährungsprobe auf ihn.
