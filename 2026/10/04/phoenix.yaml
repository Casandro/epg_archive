  description: |-
    Über dieses Thema berichtet phoenix in der Sendung "forum demokratie: Gescheiterte Demokratien - Chile 1973" am 04.10.2026 um 13:00 Uhr online und im TV.

    04.10.2026 | Demokratien sterben auf sehr unterschiedliche Weise - mit einem lauten, abrupten Knall oder langsam und leise. Im letzteren Fall schafft sich eine Demokratie praktisch systemkonform selbst ab, wenn nämlich aus Wahlen diejenigen als Sieger hervorgehen, die später den Systemwechsel vollziehen. Für uns Deutsche war das der Untergang der Weimarer Republik und die Machtergreifung der Nationalsozialisten.
