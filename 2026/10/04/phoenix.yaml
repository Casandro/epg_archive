  title: Hitlers Macht
  subtitle: Der Zerstörer
  widescreen: true
  hd: true
  description: Wie hat Hitler sein Volk in einen mörderischen Eroberungskrieg führen können? Warum funktionierte die Maschinerie des Vernichtungskrieges und des Judenmordes so reibungslos? Wie sicherte sich der NS-Führer die Gefolgschaft bis zum bitteren Ende? Hitler betonte nach außen den Friedenswillen, doch hinter den Kulissen schwor er die führenden Militärs seit seiner Machtübernahme auf einen Vernichtungskrieg ein, der dem Deutschen Reich die Vorherrschaft in Europa und Lebensraum im Osten sichern sollte. Das Sterben der Bevölkerung in den eroberten Gebieten war Teil des mörderischen Plans.
