  title: Deutschland in
  subtitle: den Goldenen Zwanzigern
  widescreen: true
  hd: true
  description: Goodbye Kaiser hello Party! In dieser Folge der Deutschland in -Reihe mit Mirko Drotschmann nimmt der Historiker die Goldenen Zwanziger unter die Lupe. Vor rund 100 Jahren erleben die Deutschen ein wildes Jahrzehnt. Der Erste Weltkrieg ist zu Ende, das prüde Kaiserreich Geschichte. Vergnügen, Rausch und Tempo bestimmen das neue Lebensgefühl. Es ist ein Aufbruch, aber es gibt auch Schattenseiten. Was ist Mythos, was Wahrheit an dem Bild von den Goldenen Zwanzigern?
- eventId:
