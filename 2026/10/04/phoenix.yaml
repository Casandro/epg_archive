  description: Die DDR sei "ein sauberer Staat", so Staatschef Erich Honecker. Was nicht in dieses offizielle Bild passte, wurde totgeschwiegen - wie Prostitution, Alkoholismus und Drogenmißbrauch. So prangerte man Prostitution als Problem kapitalistischer Gesellschaften an, das im Sozialismus __berwunden sei. Alkohol und Drogen galten ebenso als auszurottende "Überbleibsel des Kapitalismus". Tatsächlich aber wurde in der DDR ordentlich gesoffen.
