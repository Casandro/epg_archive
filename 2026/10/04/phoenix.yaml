  title: Attentat auf Hitler
  subtitle: Stauffenberg und der deutsche Widerstand
  widescreen: true
  hd: true
  description: "Am 20. Juli 1944 hängt Deutschlands Zukunft an seiner Tat: Oberst Stauffenbergs Attentat auf Hitler könnte den Krieg beenden und Millionen Menschenleben retten. Der entscheidende Versuch. \n\nStauffenberg ist nicht allein. Die 90-minütige Dokumentation erzählt den dramatischen Verlauf des Schicksalstages vor 80 Jahren. Und porträtiert todesmutige Menschen in einem weitverzweigten, wenig bekannten Netzwerk des Widerstands gegen die totalitäre Diktatur. \n\nDas Attentat des Verschwörerkreises um Claus Schenk Graf von Stauffenberg am 20. Juli 1944, das sich zum 80. Mal jährt, markiert eine historische Zäsur."
