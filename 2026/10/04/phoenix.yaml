  start: 2026-10-04T03:15:00Z
  stop: 2026-10-04T04:00:00Z
  title: Countdown zur Diktatur
  subtitle: 1925 - 1929 Illusion
  widescreen: true
  hd: true
  description: 'Deutschland Mitte der Goldenen Zwanziger Jahre: Adolf Hitler ist noch ein unbekannter Provinzpolitiker. Parteien der demokratischen Mitte bestimmen die Politik. Sechs Jahre nach Ausrufung der ersten deutschen Republik scheint die junge Demokratie endlich stabil zu sein. Doch der Tod von Reichspräsident Friedrich Ebert im Februar 1925 erschüttert das Land. Nur wenige Stunden zuvor gründet Hitler die verbotene NSDAP neu. Das Jahrzehnt nach dem Ersten Weltkrieg: Zum ersten Mal ist das deutsche Volk sein eigener Souverän.'
- eventId:
  - 651645
  - 859172
  start: 2026-10-04T04:00:00Z
  stop: 2026-10-04T04:45:00Z
  title: Countdown zur Diktatur
  subtitle: 1929 - 1931 Krise
  widescreen: true
  hd: true
  description: Der New Yorker Börsencrash 1929 stürzt die Welt in Arbeitslosigkeit, Armut und Inflation. Besonders hart trifft es Deutschland, das sich gerade erst von Krieg und Schulden zu erholen beginnt. Das Deutsche Reich ist jetzt seit zehn Jahren parlamentarische Demokratie. Aber die schwere Wirtschaftskrise nach dem Schwarzen Freitag lässt die Zustimmung zur Demokratie rapide sinken. Immer mehr Deutsche wenden sich Nationalsozialisten oder Kommunisten zu. Die Zeit der Goldenen Zwanziger gilt als modern, emanzipiert, glamourös. Bis in den USA der Schwarze Freitag an der New Yorker Börse die Weltwirtschaft in den Abgrund reißt.
- eventId:
  - 651646
  - 859173
  start: 2026-10-04T04:45:00Z
  stop: 2026-10-04T05:30:00Z
  title: Countdown zur Diktatur
  subtitle: 1931 - 1933 Abgrund
  widescreen: true
  hd: true
  description: Die Feinde der Demokratie nutzen die Krise, um das Parlament zu entmachten. Wird der Weg in eine nationalrevolutionäre Diktatur, zurück zur Monarchie oder in den Kommunismus führen? In ganz Europa sind Rechtsnationalisten auf dem Vormarsch. Zwei von drei europäischen Demokratien überstehen die zwei Jahrzehnte zwischen den Weltkriegen nicht. Bei den Wahlen zum Deutschen Reichstag im Juli 1932 wird Hitlers NSDAP stärkste Kraft. Ermutigt von steigenden Wahlergebnissen, kandidiert Adolf Hitler, der Parteichef der NSDAP, für das Amt des Reichspräsidenten.
- eventId:
  - 651647
  - 859174
  start: 2026-10-04T05:30:00Z
  stop: 2026-10-04T06:15:00Z
  title: Countdown zur Diktatur
  subtitle: 1933 - 1934 Zerstörung
  widescreen: true
  hd: true
  description: 30. Januar 1933. Deutschland hat einen neuen Kanzler. Konservative und Monarchisten haben Hitler ins Amt gehievt. Im Glauben, ihn und seine Anhänger zähmen zu können. Tatsächlich ist der neue Kanzler noch weit von einer Alleinherrschaft entfernt und Deutschland auf dem Papier noch eine Demokratie. Es dauert noch 18 Monate voller Willkür, Rechtsbruch, Mord und politischem Versagen, bis die Nazis die ganze Macht in Händen halten. Ein Zufall beschleunigt die Zerstörung der Demokratie. Am 27. Februar 1933 brennt der Reichstag. Marinus van der Lubbe, ein niederländischer Kommunist, wird als Brandstifter verhaftet.
