  description: |-
    Actionthriller, Deutschland 1998
    Manni arbeitet als Geldkurier und lässt auf dem Weg zur Übergabe versehentlich 100.000 Mark in der Bahn liegen. Aus Verzweiflung ruft er seine Freundin Lola an und bittet sie um Hilfe.

    Die Situation scheint aussichtslos. Doch um Manni vor kriminellen Einfällen zu bewahren, mit denen er das verlorene Geld auftreiben will, kommt Lola eine rettende Idee. Die Zeit drängt - also rennt sie los, um ihren Liebsten zu retten.
