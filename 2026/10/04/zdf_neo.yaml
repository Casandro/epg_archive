  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2020
    Vor dem Hintergrund aktueller Entdeckungen erzählt der Film "Die Maya" aus der "Terra X"-Reihe "Söhne der Sonne" die Geschichte dieser einzigartigen Hochkultur - vom Aufstieg bis zum Fall.

    Schon vor über 2000 Jahren bauten die Maya mitten im Dschungel von Mittelamerika gigantische Städte. Pyramiden und Tempel zeugen von ihren architektonischen Leistungen. Auch in Schrift, Mathematik und Astronomie setzten die Maya Maßstäbe.
    HD-Produktion
