  description: |-
    Deutschland 2023
    "Verschollenes" fasziniert die Menschen seit jeher. Harald Lesch macht sich auf die Suche nach Siedlungen, Flotten und ganzen Heeren, die im Laufe der Geschichte spurlos verschwanden.

    Im 16. Jahrhundert wird die erste englische Kolonie in Amerika gegründet. Doch nur wenige Jahre später fehlt von Roanoke und seinen Bewohnern jede Spur. Nun scheint das Rätsel gelöst. - Nur eine der Geschichten, die "Terra X" beleuchtet.
