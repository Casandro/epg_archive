  description: |-
    Deutschland 2020
    Weltweit gibt es immer wieder rätselhafte Funde. Auch in dieser Staffel von "Terra X - Ungelöste Fälle der Archäologie" sucht Harald Lesch nach neuen Antworten auf alte Fragen.

    Seit Jahrtausenden errichten Menschen verschiedenste Bauten. Sie dienen als Wohnungen, Gotteshäuser oder zu Zwecken, die bis heute unbekannt sind. Manche wurden bewusst versteckt errichtet, andere gerieten in Vergessenheit und wurden zufällig wiederentdeckt.
