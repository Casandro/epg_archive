  description: |-
    Deutschland 2021
    Weltweit stoßen Forscher immer wieder auf Mumien. In dieser Folge "Terra X - Ungelöste Fälle der Archäologie" beleuchtet Harald Lesch die Sehnsucht nach dem ewigen Leben.

    Seit Jahrtausenden versuchen Menschen, den Verfall des menschlichen Körpers nach dem Tode aufzuhalten. Dabei gehen sie die unterschiedlichsten Wege. Allen gemein scheint die Vorstellung, dass mit der Existenz des Körpers ein Weiterleben nach dem Tod gesichert wird.
