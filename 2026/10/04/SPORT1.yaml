  title: Die PS Profis - Im Einsatz Hardrocker unterm Messer
  subtitle: Die PS Profis - Im Einsatz Hardrocker unterm Messer
  description: 'Ein neuer Fall für die derbste Schrauber-Crew im Ruhrpott: Als Krystian aus Hamburg mit seinem alten, verrosteten Volvo-Kombi in die PS Profi-Werkstatt fährt, ahnt er nicht, dass die Kult-Tuner ihn unter einem Vorwand nach Dortmund gelockt haben. Erst hier erfährt der Binnenschiffer, dass sein Hardrocker unters Messer kommt. Die Kult-Tuner wollen dem Schweden-Auto einen Look verpassen, der sich gewaschen hat. Diesmal greifen sie zur Flex-Maschine und zum XXL-Bunsenbrenner.'
  widescreen: true
