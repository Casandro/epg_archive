  subtitle: Schauspieler Oliver Wnuk zu Gast bei Arne-Torben Voigts
  description: Viele kennen ihn als Ulf aus "Stromberg". Aber auch als verpeilter Kommissar Feldmann in der ZDF-Krimireihe "Nord Nord Mord" hat sich Oliver Wnuk in die Herzen des Fernsehpublikums gespielt. Er gehört heute zu den meistbeschäftigten Schauspielern Deutschland. Außerdem hat er sich als Autor von Drehbüchern, Romanen und Literatur für Kinder einen Namen gemacht. Vor der großen Lesereise ist er zu Gast in der Sendung.
