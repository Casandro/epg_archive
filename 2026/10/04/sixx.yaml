  title: Chocolat... ein kleiner Biss genügt
  subtitle: |-
    Chocolat... ein kleiner Biss genügt
    Drama, GB/USA 2000
    Altersfreigabe: ab 6
  description: |-
    Geheimnisvolles Drama nach einem Roman von Joanne Harris: Vianne will mit ihrer Tochter in einer kleinen französischen Provinz ein neues Leben beginnen. Als sie mitten in der Fastenzeit eine Chocolaterie eröffnet, zieht sie damit den Zorn des streng gläubigen Bürgermeisters auf sich. Viannes Liaison mit dem Vagabunden Roux ist ihm ebenfalls ein Dorn im Auge. Deshalb setzt er alles daran, die alleinerziehende Mutter so schnell wie möglich loszuwerden ...

