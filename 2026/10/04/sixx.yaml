  title: Book Club - Ein neues Kapitel
  subtitle: |-
    Book Club - Ein neues Kapitel
    Komödie, USA 2023
    Altersfreigabe: Ohne Altersbeschränkung
  description: |-
    Vier Freundinnen sorgen für das chaotischste Abenteuer ihres Lebens: Nach all den virtuellen Treffen mitten in der Pandemie beschließen Diane, Vivian, Sharon und Carol endlich ihre langersehnte Italien-Reise anzutreten. Doch der Trip gerät außer Kontrolle: Ihr Gepäck wird gestohlen, Dianes Urne mit der Asche ihres verstorbenen Mannes geht verloren und nach einem Missverständnis mit der Polizei landen alle im Gefängnis. Doch am Ende jagt eine romantische Überraschung die nächste.

    Regie: Bill Holderman
    Drehbuch: Bill Holderman, Erin Simms
    Komponist: Tom Howe
    Kamera: Andrew Dunn
    Schnitt: Doc Crotzer

    Darsteller:
    Diane Keaton (Diane)
    Jane Fonda (Vivian)
    Candice Bergen (Sharon)
    Mary Steenburgen (Carol)
    Andy Garcia (Mitchell)
    Don Johnson (Arthur)
    Craig T. Nelson (Bruce)
    Hugh Quarshie (Ousmane)
    Giovanni Esposito (Pasquale)
  widescreen: true
