  description: Der Wettkampf im vergangenen Jahr verlief für Amaury Pierron nicht nach Plan. Der Franzose musste sich schließlich mit Platz 22 in Lake Placid zufriedengeben. In diesem Jahr präsentiert sich Pierron in guter Form. Nach den ersten sieben Rennen belegte er den vierten Platz in der Gesamtwertung. (2026)
