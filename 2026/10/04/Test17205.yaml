  title: Mise au point
  description: "(Rediffusion) (Suisse Romande-2026)  - La Suisse qui s'appauvrit Primes maladie, loyers, essence : tout augmente en Suisse. Même la classe moyenne a de la peine à boucler ses fins de mois. Reportage dans un pays qui perd du pouvoir d'achat. \n - Le business des Barbers Shops Enquête sur le modèle d'affaires des \"Barber Shops\", qui se multiplient dans les villes suisses. Comment font-ils pour survivre économiquement, malgré une clientèle parfois peu nombreuse ? Les polices suisses les surveillent de près. \n - L'école des bergers La Suisse manque de bergers. Il n'y a plus assez de volontaires pour ce métier difficile, encore compliqué par la menace que fait peser le loup sur les troupeaux. Reportage dans les alpages et les salles de cours."
