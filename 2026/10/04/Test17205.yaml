  title: Caravane FM
  description: |-
    Caravane FM Bioparc Pas très loin de Genève, sous un ciel chargé de gros oiseaux volants et bruyants emmenant les gens vers des destinations exotiques, la Caravane s'installe au Bioparc, une institution zoologique au service de la biodiversité qui accueille plus de 250 animaux, recueillis à la suite de saisies et d'abandons. C'est dans le sillage de cette « arche de Noé » que Lionel et Jean-François vont donner la parole aux employés et bénévoles très engagés. De Tobias, le vétérinaire directeur, à la jeune Sati de 7 ans, les partages témoignent de ce qui nous lient aux animaux et plus largement à la nécessité et l'urgence de contribuer au bien-être de notre planète.
     (Suisse-2025)  "Audio description"
