  stop: 2026-10-04T15:00:00Z
  title: Bayern 2 Hörspiel
  subtitle: '"Der jüdische Gerichtsvollzieher" von Sigfried Lichtenstaedter'
  description: "\"Darf ein Jude Gerichtsvollzieher werden?\" so fragt sich ganz Anthropopolis, eine beschauliche Großstadt im Großherzogtum Anthropopolitanien. Vom offenbar fahrlässig handelnden Justizminister hat tatsächlich ein Jude diesen Beamtenposten zugeschanzt bekommen. Da es aber nur einen einzigen solchen Posten im ganzen Land gibt, ist vor allem die völkische Presse besorgt, denn das Judentum besetzt ja nunmehr tatsächlich 100 Prozent der Gerichtsvollzieherei. \nEin bairisch-anthropopolitanisches Hörspiel, nach einer Kurzgeschichte aus dem Jahre 1926 von Siegfried Lichtenstaedter. \n\nVon Sigfried Lichtenstaedter\nMit Christine Prayon, Georgia Stahl, Gerd Lohmeyer, Richard Oehmann, Ercan Karacayli, Heinz-Josef Braun, Wowo Habdank, Maria Hafner, Nikola Norgauer, Thomas Unger und Gerhard Wittmann\nKomposition: Maria Hafner \nRegie: Richard Oehmann \nBR 2020\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
