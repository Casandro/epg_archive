- eventId: 807392
  start: 2026-10-04T18:00:00Z
  stop: 2026-10-04T19:00:00Z
  title: SWR4 Mundarthörspiel
  subtitle: 'Der Schwarzwald-Ranger: Äpfelträume'
  description: "...\n\nJeden ersten Sonntag im Monat stellt Ihnen Pius Jauch in SWR4 ganz besondere Mundarthörspiele vor. Egal ob nagelneue Produktionen frisch aus unseren Hörspielstudios oder echte Klassiker aus den Tiefen unseres Archivs: Liebhaber von Mundart im Südwesten kommen hier voll auf ihre Kosten. \n\nFür Pius Jauch ist Mundart eine Herzensangelegenheit. Der Sänger und Schauspieler aus Bösingen bei Rottweil steht nicht nur mit seinen schwäbisch-alemannischen Liedern auf der Bühne, er engagiert sich z.B. auch aktiv in Vereinen zur Förderung der Mundart oder in der Organisation des landesweit durchgeführten Projektes \"Mundart in der Schule\". Für sein Schaffen wurde er u. a. mit der Heimatmedaille des Landes Baden-Württemberg ausgezeichnet."
- eventId: 807393
  start: 2026-10-04T19:00:00Z
  stop: 2026-10-04T21:00:00Z
  title: SWR Big Band & Gäste
  subtitle: mit Hans-Peter Zachary
  description: |-
    17 Musiker - ein Sound. Und der überzeugt. Die SWR Big Band wurde bisher vier Mal für den Grammy nominiert - den wichtigsten Musikpreis der Welt. Nicht nur für uns ist die SWR Big Band eine der besten Big Bands der Welt.
    Jeden Sonntag stellen wir Ihnen in SWR4 die neusten Produktionen vor - mal mit, mal ohne Gäste - und erinnern aber auch an die Zeiten unter dem Gründer und damaligen musikalischen Leiter Erwin Lehn.
