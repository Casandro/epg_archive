  title: Irischer Kompass - E02 Rauer Westen
  subtitle: Irischer Kompass - E02 Rauer Westen
  description: 'Irlands rauer Westen wurde vom Rückgang der letzten Eiszeit-Gletscher geprägt. Die "Burren"-Region war einst ein Korallenriff und ist heute ein einzigartiger Naturraum. Dort wird mit nachhaltiger Viehzucht die natürliche Artenvielfalt erhalten. Ebenso zu Wasser: In der Region Connemara gewinnen Forscher Wissen über das maritime Leben und stellen zerstörte Unterwasserkulturen wieder her.'
