  title: Irischer Kompass - E04 Blühender Osten
  subtitle: Irischer Kompass - E04 Blühender Osten
  description: 'Der östliche Teil der Insel ist ein Zentrum der Kultur, aber auch der Geschichte. Hier trifft das alte und neue Irland zusammen: zum einen die moderne Hauptstadt Dublin, eine IT- und Wirtschaftsmetropole. Daneben Newgrage und Knowth, riesigen keltischen Hügelgräbern aus prähistorischen Zeiten. Die uralte Geschichte mit ihren verschiedenen Einflüssen ist im Ostern der irischen Insel allgegenwärtig. Dort, wo das alte und das moderne Irland aufeinanderprallen, entsteht ein neuer Zeitgeist.'
