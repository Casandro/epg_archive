  title: Irischer Kompass - E01 Einsamer Norden
  subtitle: Irischer Kompass - E01 Einsamer Norden
  description: 'Von der idyllischen Insel Arranmore zu steilen Brandungspfeilern vor der Küste im Atlantik, über weitläufige Sandstrände bis hin zu Moor- und Grasland: Irlands Norden bietet eine besonders abwechslungsreiche Naturkulisse. Aufgrund der kühlen Wetterlange häufig vom Tourismus ausgespart. Während der Nordwesten der Insel Teil der Republik Irlands ist, gehört der Nordosten zu Großbritannien. Besiedelt ist Irlands geteilter Norden überwiegend an der Küste.'
