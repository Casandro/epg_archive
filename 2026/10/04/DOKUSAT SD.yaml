  description: Der berüchtigte SS-Arzt Josef Mengele gehörte zu den grausamsten Tätern der Nazidiktatur. 40 000 unschuldige Opfer schickte er ins Gas, benutzte Kinder für Menschenversuche. Nach dem Krieg gelang ihm die Flucht, er wurde weltweit verfolgt - aber nie gefasst. Die Dokumentation zeigt die Geschichte der NS-Verbrecher, die Todeslager und Deportationen organisierten, Kriegsverbrechen und Massenmorde begingen und niemals Reue zeigten.
