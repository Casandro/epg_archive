  title: Pedro Ballester. Nikdy som nebol šťastnejší
  subtitle: Ľudia si niekedy predstavujú svätca ako niekoho, kto sa zrieka radostí života, aby patril len Bohu.
  description: 'Ľudia si niekedy predstavujú svätca ako niekoho, kto sa zrieka radostí života, aby patril len Bohu. Pedro Ballester je príkladom toho, že svätosť je dosiahnuteľná pre všetkých, pre obyčajných ľudí. Miloval život, priateľov, dobrodružstvá a šport. Všetci ho považovali za svätého a on svoju svätosť dokázal tým, ako hrdinsky, pokojne a v dôvere v Boha znášal svoj údel nevyliečiteľnej choroby, ktorá ho pripravila o pozemský život vo veku 21 rokov. Réžia: Juan Martin Ezratty (2022)'
