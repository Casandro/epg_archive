  title: Expeditie Nederland
  subtitle: Weggeefkasten in de regio S05 E24. Onderwerpen die iedereen raken kunnen, hoe klein ons land ook is, een paar kilometer verderop een ander verhaal opleveren. Ze worden belicht door verslaggevers uit de regio's.
  description: Van een kastje aan de muur tot ontmoetingsplekken in de wijk. Kleine initiatieven die voor veel mensen een groot verschil maken. Met wat groenten die ze over had uit eigen tuin, begon Lara ooit een buurtkastje in Lelystad. Inmiddels helpt haar stichting iedere week tientallen gezinnen met voedsel en andere dagelijkse benodigdheden. In Den Haag ligt, verscholen tussen de huizen, de Jacobahof. Een buurttuin met bloemen, dieren en vooral veel betrokken bewoners. Hier staan weggeefkasten met boeken en menstruatieproducten en er is zelfs een weggeefboetiek. (2026)
