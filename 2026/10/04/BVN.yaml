  title: Podium Klassiek
  subtitle: S10 E16. Floris Kortie ontvangt tenor Ian Bostridge en pianist Julius Drake, FUSE, violist Emma van der Schalie en de sopranen Tania Kross en Naomi Amaranta. Huispianist is Sven Figee.
  description: Floris Kortie ontvangt tenor Ian Bostridge en pianist Julius Drake, FUSE, violist Emma van der Schalie en de sopranen Tania Kross en Naomi Amaranta. Huispianist is Sven Figee. Tenor Ian Bostridge en pianist Julius Drake werken al ruim dertig jaar samen als liedduo. Ze zijn gespecialiseerd in liederen van Franz Schubert en brengen deze ten gehore. Deze zomer heeft sopraan Tania Kross een NPO Cultuur Masterclass gegeven aan zes zangeressen. Een van hen, Naomi Amaranta, zingt de aria Senza Mamma uit de opera Suor Angelica van Puccini. Natuurlijk is huisband FUSE dit najaar ook weer van de partij. (2026)
