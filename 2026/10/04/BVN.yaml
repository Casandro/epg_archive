  title: 75 jaar TV
  subtitle: Een terugblik op driekwart eeuw televisie. Cornald Maas spreekt drie gasten die precies 75 jaar zijn. Ook vertellen vier contentmakers over de tv die hen vormde. Waarom houdt televisie zijn waarde?
  description: 'Een terugblik op driekwart eeuw televisie. Cornald Maas spreekt drie gasten die precies 75 jaar zijn: journalist Cees Grimbergen, acteur en theatermaker Jetty Mathurin en presentator Henny Huisman. Alle drie hebben deze geschiedenis elk op hun eigen manier meegemaakt. Ook vertellen vier jonge contentmakers over de tv die hen vormde. Voor hen is televisie niet verdwenen, maar de vorm is veranderd. Waarom houdt televisie zijn waarde? (2026)'
