  title: Het klokhuis
  subtitle: 'Rieten dak S39 E4961. Vroeger zag je het overal in Nederland: huizen, boerderijen en schuren met rieten daken. Want riet groeide op heel veel plekken en was goedkoop. In de winter houdt het je warm en in de zomer koel.'
  description: 'Vroeger zag je het overal in Nederland: huizen, boerderijen en schuren met rieten daken. Want riet groeide op heel veel plekken en was goedkoop. In de winter houdt het je warm en in de zomer koel. Maar ook nu zie je nog steeds veel boerderijen en ook nieuwe huizen met rieten daken. Wat is riet eigenlijk en waar komt het vandaan? En hoe bedek je daar daken mee? Pascal zoekt het uit. In de sketch probeert Uitvinder Jos de bijzondere eigenschappen van riet zo goed mogelijk te benutten. (2025)'
