  description: 'Het glamourpaar van de eeuw zit op de bank bij Dorine. Frederik Hendrik, de zoon van Willem, verjaagt de Spanjaarden uit de ene stad na de andere. Amalia is zijn charmante vrouw die de kunsten stimuleert, paleizen laat bouwen en grote feesten geeft. Samen zijn zij het rijkste paar van de Gouden Eeuw. Met onder andere De wapenhandelaar, Het sterfbed van prins Maurits en De veldslagschilder. Regisseur: Niek Barendsen. Acteurs: Rogier in''t Hout (Multiple roles), Ydwer Bosma (Multiple roles), Guy Clemens (Prins Frederik Hendrik), Gijs de Lange (Protestante Katholiek), Stefan de Walle (Soldaat) (2017)'
