  title: Focus
  subtitle: Overstroming voor de wetenschap S15 E09. Afgelopen augustus viel in Nederland de eerste dode door het westnijlvirus. Door klimaatverandering lijkt het virus zich hier steeds beter thuis te voelen. Hoe snel verspreidt het zich?
  description: Afgelopen augustus viel in Nederland de allereerste dode door het westnijlvirus. Een virus dat zich tot een paar jaar geleden in ons land niet thuis voelde. Maar door klimaatverandering is dat nu aan het veranderen. Hoe en hoe snel verspreidt dit virus zich in Nederland? Dat is een vraag waar virologen en biologen achter de schermen heel hard mee bezig zijn. En waarvoor ze een jaar geleden startten met een uniek experiment dat we op de voet volgde. (2026)
