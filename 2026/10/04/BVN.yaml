  title: Nu te Zien!
  subtitle: Museum Paul Tetar van Elven S10 E35. Directeur van Teylers Museum Marc de Beyer verkent het historische woonhuis van de 19e eeuwse schilder en tekenaar Paul Tetar van Elven in Delft.
  description: 'Directeur van Teylers Museum Marc de Beyer verkent het historische woonhuis van de 19e eeuwse schilder en tekenaar Paul Tetar van Elven in Delft. Hij hield ervan om 17e eeuwse meesters als Rembrandt en Potter na te schilderen maar was vooral een begenadigd tekenaar en tekenleraar. Daarnaast was Tetar van Elven een hartstochtelijk verzamelaar van kunst, antiek en Oosters porselein, een collectie die hij naliet om zijn woonhuis als museum in te richten. Regisseur: Iris van Reeuwijk (2026)'
