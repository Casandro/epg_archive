  title: Tussen Kunst en Kitsch
  subtitle: Mediamuseum Beeld & Geluid S17 E13. Vanuit diverse musea in Nederland bespreken Frits Sissing en de experts weer verrassende kitsch en veelzijdige kunst.
  description: Vanwege de viering van 75 jaar televisie, is Tussen Kunst en Kitsch neergestreken in het Mediamuseum Beeld & Geluid. Tot de grote variatie van voorwerpen die besproken en getaxeerd worden, behoren ook objecten die een bijzondere televisie-historische waarde hebben. Zo komen de Farce Majeur-heren Jan Fillekers en Henk van der Horst persoonlijk met hét vaandel van het lied Dit is uit het leven gegrepen. Ook het Sesamstraatpak van Aart Staartjes en de spiekborden van de oudejaarsconference van Wim Kan worden besproken. (2026)
