  title: Rutger en de buitenlanders
  subtitle: Tegen wil en dank-baarheid E02. Rutger ontmoet Raja, Firoza en Oliveira. Hun verhalen over afkomst, identiteit en thuis laten zien hoe verschillend Nederland door nieuwkomers én Nederlanders wordt beleefd.
  description: Rutger spreekt mensen die zich ieder op hun eigen manier afvragen waar ze echt thuishoren. Raja groeide op als dochter van gastarbeiders, maar voelt zich na haar terugkeer in Nederland niet langer welkom. In Amsterdam ontmoet hij Firoza, die zich als queer moslima vervreemd voelt in haar eigen buurt. Ook spreekt Rutger Oliveira, die na de burgeroorlog in Angola in Nederland terechtkwam en juist heilig gelooft in de kansen die dit land biedt. (2026)
