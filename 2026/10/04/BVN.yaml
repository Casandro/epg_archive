  title: Radar
  subtitle: Radar 2026 S22 E23. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: De longevity-hype, waarin gezond ouder worden of zelfs langer leven centraal staat, is vanuit de VS overgewaaid naar Nederland. Claims van supplementen hiervoor zijn niet wetenschappelijk bewezen en bovendien vaak in strijd met de Europese wet. Fons gaat bij de bedrijven achter de longevity-supplementen langs. En; mensen die met incontinentie te maken hebben, krijgen lang niet altijd voldoende producten geleverd of vergoed. Met alle gevolgen vandien. Hoe kan dit en wat is de rol van de zorgverzekeraars en leveranciers? De Nederlandse Zorgautoriteit (NZa) reageert in de studio. (2026)
