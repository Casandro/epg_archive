  title: Das große Nicole-Wunschkonzert
  subtitle: Das große Nicole-Wunschkonzert
  description: Nicole gewann 1982 den Eurovision Song Contest mit "Ein bißchen Frieden", einem internationalen Hit, der sie über Nacht zum Star machte. Als erste deutsche Sängerin, die den Wettbewerb gewann, wurde sie zu einem Symbol für Frieden im Kalten Krieg. Ihr Erfolg katapultierte sie in den Mittelpunkt der europäischen Musikszene und machte sie zu einer der bekanntesten und beliebtesten Schlagersängerinnen Deutschlands. Trotz ihres Ruhms hatte Nicole auch mit persönlichen Herausforderungen zu kämpfen. Ge 2020
