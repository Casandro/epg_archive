  title: Das große Peter-Orloff-Wunschkonzert
  subtitle: Das große Peter-Orloff-Wunschkonzert
  description: Peter Orloff hat Musikgeschichte geschrieben als Sänger sowie als Komponist und Texter, als Produzent und Verleger und natürlich als Leiter des Schwarzmeerkosaken-Chores. In diesem Wunschkonzert werden viele Ihrer Wünsche erfüllt, die sowohl Peter Orloffs Schlagererfolge als auch die schönsten Aufnahmen der russischen und internationalen Erfolge umfassen. Peters Vater, Nikolai von Orloff, ein Geistlicher mit einer großen Liebe zur Musik, weckte in seinem Sohn den Wunsch, dieses Erbe anzunehmen. Ge 2020
