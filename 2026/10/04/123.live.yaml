  subtitle: Graf Porno und seine Mädchen
  description: 'Harry Holst, tollpatschiger Privatdetektiv, ermittelt in einem jungen Mädchenpensionat und stößt auf düstere Geheimnisse: Gina hat heimlich Gift bei sich, und eine Diebesbande nutzt ausgelassene Sexpartys als Deckmantel, um Gäste zu bestählen. Zwischen Verführung, psychedelischem Trip und kriminalistischer Spurensuche kommt es zu riskanten Situationen - bis Harry in letzter Minute die Polizei ruft. Wilde Erotik, Komik und schräge Verwicklungen. 1969'
