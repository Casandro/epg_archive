  description: |-
    Eine der abgelegensten Angelregionen der Welt ist die Pazifikküste in Kolumbien. Dort finden Angler ein fantastisches Offshore-Angeln auf Tunfisch sowie eine produktive Küstenangelei bei der kapitale Cubera Snapper, Roosterfish, Jacks und Tarpon auf die Köder der Angler warten.
