  title: Kanu Carping
  subtitle: Kanu Carping
  description: Zwei Freunde, zwei Ruten, Zwei Kanus! Robin Illner und Nils Rentmeister fahren tief in die wilde Schlucht des Flusses, um die kraftvollen Flusskarpfen zu finden. Das die Kanus auf der Fahrt käntern, Ruten brechen und Brillen in die Fluten gespült werden, ahnen die beiden Vagabunden zum Beginn der Reise nicht. Schlaflose Nächte auf nacktem Sandboden und RUN auf RUN folgen. Kochen auf dem offenen Lagerfeuer, Schlafen unter den Sternen und am Tage fliegen die Gänsegeier hoch über den Köpfen der Abenteurer. Kanu Carping erzählt die Geschichte voller Freundschaft, Herzblut, Abenteuerlust und Wagemut Zweier die auszogen, um die Wildheit des Flusses zu spüren. FR 2024
