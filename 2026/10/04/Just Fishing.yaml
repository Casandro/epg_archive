- eventId: 1387199
  start: 2026-10-04T01:10:00Z
  stop: 2026-10-04T01:25:00Z
  title: Skrei - Wenn die Winterdorsche kommen
  subtitle: Skrei - Wenn die Winterdorsche kommen
  description: |-
    Skrei-Angeln ist ein ganz besonderes Erlebnis, das im frühen Frühjahr immer wieder viele Meeresangler nach Nordnorwegen lockt. Der Skrei, auch Wanderdorsch oder Winterdorsch genannt, zieht dann von der Barentsee zu den küstennahen Laichplätzen. Die beste Zeit zum Skrei-Angeln ist von Januar bis April. Das Wetter in Nordnorwegen kann dann durchaus herausfordernd sein. Gleichzeitig zeigt sich die Landschaft aber oft atemberaubend schön. Auf unserer Tour haben wir Station in Vinjesjoen gemacht. Ein Top-Revier und eine ganz besondere Angelei.

     DE 2023
