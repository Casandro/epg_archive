  stop: 2026-10-04T08:00:00Z
  title: Toulky Josefa Veselého
  description: Známá postava Viktorky z díla Boženy Němcové měla svůj reálný předobraz. A po opravdové Viktorce kdysi pátral Josef Veselý. Dozvíte se, co zjistil, a zazní kus té dávné reportáže. Následovat bude tradiční napovídání indicií ze života jedné známé osobnosti. Můžete si zkusit poznat, o koho by tak mohlo jít. Letošní rok přinesl i jedno výročí, kterého si Toulky českou minulostí rozhodně musí všimnout. Pět set let od nástupu Habsburků do českých zemí si připomeneme dílem cyklu nazvaným Habsburk na českém trůně.
