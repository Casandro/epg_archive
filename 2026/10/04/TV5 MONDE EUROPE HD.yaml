  description: "Destination Mexique\n\nPour les 200 ans de relations diplomatiques franco-mexicaines, Ivan Kabacoff vous fait découvrir cette histoire commune, méconnue, mais toujours bien vivante. Depuis les hauteurs de Quiahuiztlán, où Cortès débarqua en 1519, il choisit un autre chemin que la conquête, celui des rencontres, de la culture et de la langue française. De Puebla au Veracruz, du Chiapas au Yucatán, il sillonne une partie de cet immense pays à la rencontre de Mexicains francophones passionnés. Chacun raconte, à sa manière, un pan de cette relation unique entre les deux pays.\n\nPrésentation : Ivan Kabacoff\n "
