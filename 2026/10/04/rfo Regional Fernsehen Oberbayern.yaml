  description: 'Im Berchtesgadener Land, einem von sechs Alpenvorland-Kreisen, wird seit elf Jahren nach bedrohten Apfel- und Birnensorten gesucht; das Projekt Apfel.Birne.Berge brachte den Sortenerhaltungsgarten in Haberland hervor, der beim zweiten Apfelfest viele Besucher anzog. +++ Im TAM OST Rosenheim prallen in Wir sind die Neuen drei Ruheständler in einer WG auf drei Studenten, was viel Humor und Nachdenkliches über Lebensentwürfe und Zusammenleben der Generationen liefert; zu sehen ist das Stück bis 17.10. +++ Traunreut hat im Ortsteil Traunwalchen die neue Kita Mariä Geburt eingeweiht: Für 100 Kinder, darunter 13 Krippenplätze, wurden für sechs Millionen Euro Gebäude und Außenanlagen geschaffen, zur Eröffnung sangen die Kinder und die Einrichtung wurde gesegnet.'
