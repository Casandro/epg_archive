  title: Süd Blick vom 3.10.2026 (Wh.)
  subtitle: Tankrabatt startet - wann lohnt sich das Tanken? +++ Ehrenabend in Saaldorf-Surheim +++ Motocross-Fahrerin Alexandra Massury im Gesamtweltcup auf Platz 10 +++ Der erste Mind-Sport-Day in Rosenheim
  description: 'Ab morgen sinkt die Energiesteuer auf Benzin und Diesel für drei Monate, rechnerisch um bis zu 17 Cent je Liter, doch weil Restbestände und Konzerne die Preise bestimmen, lohnt sich statt Warten ein Vergleich per App und Uhrzeit. +++ Saaldorf-Surheim im Berchtesgadener Land ehrte zahlreiche erfolgreiche Sportlerinnen und Sportler von Rallye über Schützen, Fußball, Tennis und Stockschießen bis zu Ski und Langlauf, zudem die besten Stadtradeln-Kilometersammler sowie verdiente Funktionäre. +++ Motocross-Fahrerin Alexandra Massury aus Berchtesgaden beendete die Damen-WM in Darwin trotz Hitze, Zeitverschiebung und geliehener KTM mit zwei Top-10-Rängen und Platz 10 gesamt, gönnt sich nun Pause fürs Studium und plant die nächste Saison. +++ Beim ersten Mind Sport Day in Rosenheim stand im Aicherpark am Wochenende Denksport im Mittelpunkt: Interessierte konnten Schach, Bridge und Tabletop ausprobieren, egal ob Anfänger oder Fortgeschrittene, und wir haben verfolgt, wie das Angebot ankam und warum es entstand.'
