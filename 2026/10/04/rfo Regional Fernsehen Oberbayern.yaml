- eventId: 1058439
  start: 2026-10-04T00:00:00Z
  stop: 2026-10-04T00:10:00Z
  title: Süd Blick vom 3.10.2026 (Wh.)
  subtitle: 720000 Euro Förderung für Hans-Klepper-Hallenbad +++ Verkehrschaos auf der A93 - LKW-Unfall während Blockabfertigung +++ Schmankerlstraße Rosenheim
  description: Rosenheims Hans-Klepper-Hallenbad wird mit 720.000 Euro Bundesförderung schrittweise saniert, damit es trotz maroder Technik und undichter Decke möglichst weiter offen bleibt und als wichtiger Ort für Schwimmunterricht, Vereine und die Region erhalten wird. +++ Auf der A93 zwischen Raubling-Reischenhart und Brannenburg krachten am Montagmorgen drei Sattelzüge ineinander, als ein 26-Jähriger mit Milchprodukten das Stauende wegen der österreichischen Blockabfertigung zu spät sah und nahezu ungebremst auffuhr, worauf die Autobahn stundenlang gesperrt blieb. +++ Auf dem Rosenheimer Ludwigsplatz präsentierte die Schmankerlstraße regionale Lebensmittel an über 30 Ständen, bot Gespräche mit Erzeugern und Mitmachangebote für Kinder und warb für kurze Wege, mehr Wertschöpfung vor Ort und die Bedeutung von Bestäubern wie Bienen.
- eventId: 1058440
  start: 2026-10-04T00:10:00Z
  stop: 2026-10-04T00:20:00Z
  title: Süd Blick vom 3.10.2026 (Wh.)
  subtitle: Tankrabatt startet - wann lohnt sich das Tanken? +++ Ehrenabend in Saaldorf-Surheim +++ Motocross-Fahrerin Alexandra Massury im Gesamtweltcup auf Platz 10 +++ Der erste Mind-Sport-Day in Rosenheim
  description: 'Ab morgen sinkt die Energiesteuer auf Benzin und Diesel für drei Monate, rechnerisch um bis zu 17 Cent je Liter, doch weil Restbestände und Konzerne die Preise bestimmen, lohnt sich statt Warten ein Vergleich per App und Uhrzeit. +++ Saaldorf-Surheim im Berchtesgadener Land ehrte zahlreiche erfolgreiche Sportlerinnen und Sportler von Rallye über Schützen, Fußball, Tennis und Stockschießen bis zu Ski und Langlauf, zudem die besten Stadtradeln-Kilometersammler sowie verdiente Funktionäre. +++ Motocross-Fahrerin Alexandra Massury aus Berchtesgaden beendete die Damen-WM in Darwin trotz Hitze, Zeitverschiebung und geliehener KTM mit zwei Top-10-Rängen und Platz 10 gesamt, gönnt sich nun Pause fürs Studium und plant die nächste Saison. +++ Beim ersten Mind Sport Day in Rosenheim stand im Aicherpark am Wochenende Denksport im Mittelpunkt: Interessierte konnten Schach, Bridge und Tabletop ausprobieren, egal ob Anfänger oder Fortgeschrittene, und wir haben verfolgt, wie das Angebot ankam und warum es entstand.'
- eventId: 1058441
  start: 2026-10-04T00:20:00Z
  stop: 2026-10-04T00:30:00Z
  title: Süd Blick vom 3.10.2026 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: 'In der Alten Füllerei der Schlossbrauerei Maxlrain bei Rosenheim startete am Samstag eine neue Kleinkunstbühne: Jannemacher und das Strawanza Trio mischten Mundart und Dialekt mit modernen Popklängen, weitere Abende folgen bis Oktober. +++ Bei Obacht - Volksmusik in Neuötting (10. bis 18. Oktober) stehen am 10. Oktober im Stadtsaal das Bayerische tapfere Schneiderlein und das Live-Hörspiel Jennerwein mit Stefan Murr, Heinz-Josef Braun, Johanna Bittenbinder und dem Art Ensemble of Passau auf dem Programm.'
- eventId: 1058442
  start: 2026-10-04T00:30:00Z
  stop: 2026-10-04T00:45:00Z
