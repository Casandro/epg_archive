  title: Damen Basketball Bundeslige - TSV 1880 Wasserburg - LIVE
  subtitle: 'Damenbasketball live aus Wasserburg: Der TSV empfängt Stuttgart. Beide Teams stehen nach dem Auftakt noch ohne Sieg da und kämpfen um die ersten Punkte der Saison.'
  description: 'Damenbasketball live aus Wasserburg: Am Sonntag empfängt der TSV 1880 Wasserburg zum ersten Heimspiel der Saison Lous Foodtruck MTV Stuttgart in der Toyota 2. DBBL Süd. Beide Mannschaften sind mit einer Niederlage in die neue Spielzeit gestartet: Wasserburg unterlag zum Auftakt bei den Bender Baskets Grünberg mit 56:71, Stuttgart verlor zuhause gegen Würzburg mit 59:77. Damit stehen beide Teams nach dem ersten Spieltag noch ohne Punkte im unteren Bereich der Tabelle. Für Wasserburg geht es vor heimischem Publikum darum, die ersten Zähler der Saison einzufahren und den Anschluss an das Tabellenmittelfeld herzustellen. Spielbeginn in der Badria-Halle ist am Sonntag um 16:30 Uhr.'
