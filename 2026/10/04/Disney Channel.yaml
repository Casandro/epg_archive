  description: Folge 1, Yuna ist eine Karatemeisterin, die mit ihrer Großmutter zusammen in Japan lebt. Plötzlich wird sie von der Nachricht überrascht, dass ein blaues Monster in der Stadt für Unruhe sorgt und sie macht sich gleich auf den Weg, um den Störenfried zu finden. Sie spürt auch das blaue Monster im Wald auf, es handelt sich dabei aber um Stitch, einen Alien, der nach einem Abstecher nach Hawaii jetzt Japan unsicher macht. Nach anfänglichen Schwierigkeiten und einigen brenzligen Situationen finden die beiden aber Gefallen aneinander , vertragen sich und werden schließlich sogar zu den besten Freunden.
