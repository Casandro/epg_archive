  title: Die Addams Family und die lieben Verwandten
  subtitle: Gruselkomödie, USA 1998
  description: 'Regie: Dave Payne. Darsteller: Tim Curry, Daryl Hannah, Ed Begley Jr.. Gomez Addams entdeckt, dass der Addams-Clan viele Mitglieder hat, von denen er bislang nichts wusste. Eine Agentur soll diese nun aufspüren und anschließend plant Gomez ein Familienfest, bei dem die ganze Sippe zusammenkommt. Dabei sorgt jedoch ein Computerfehler für Irritationen, denn plötzlich taucht eine gutbürgerliche Familie bei den Addams auf, die von der Grusel-Familie zwar sehr freundlich aufgenommen wird, aber nicht zu ihr passt.'
