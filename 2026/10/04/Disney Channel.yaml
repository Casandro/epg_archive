  title: Duell der Magier
  subtitle: Fantasyabenteuer, USA 2010
  description: 'Regie: Jon Turteltaub. Darsteller: Jay Baruchel, Nicolas Cage, Alfred Molina. Dave Stutler ist auf den ersten Blick nur ein ganz gewöhnlicher Physikstudent mit all den alltäglichen Problemen eines jungen Heranwachsenden. Was er allerdings noch nicht weiß: In seinen Adern fließt das Blut eines großen Magiers vom Range Merlins. Dessen ehemaliger Zauberlehrling, Balthazar Blake, sucht gemäß einer Prophezeiung nach dem Mann, der das Duell der Magier für die Seite des Guten entscheiden kann. Beim letzten Duell der Magier wurde einst Merlin getötet und Blakes große Liebe Veronica verbannt...'
  widescreen: true
