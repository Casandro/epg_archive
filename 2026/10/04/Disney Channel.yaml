  title: Strange Magic
  subtitle: Animationsfilm, USA/SGP/PL/THA 2015
  description: 'Regie: Gary Rydstrom. Darsteller: Tara Hetharia, Sam Palladio, Kristin Chenoweth. Die bunte Welt der Feen und die düstere des Dunklen Waldes sind klar voneinander getrennt. An der Grenze der beiden magischen Reiche gedeihen Primeln, der Hauptbestandteil mächtiger Liebestränke. Da König Bog, der Herrscher des Dunklen Waldes, Liebe verabscheut, lässt er die Blumen vernichten. Über Umwege gelangt ein Liebestrank aber dennoch in das Feen-Reich. Bog ist außer sich vor Zorn und entführt die Feenprinzessin Dawn, um so das magische Gebräu herauszupressen. Doch da hat er die Rechnung ohne Dawns große Schwester Marianne gemacht, die sich in den Dunklen Wald begibt, um Dawn zu retten.'
  widescreen: true
