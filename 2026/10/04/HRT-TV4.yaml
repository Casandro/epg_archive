- eventId: 1405307
  start: 2026-10-04T16:01:00Z
  stop: 2026-10-04T16:52:00Z
  title: 'Romano Bolković - 1 na 1: Josip Brkić, talk show'
  subtitle: Josip Brkić zamjenik je ministra vanjskih poslova Bosne i Hercegovine od travnja 2015. godine.
  description: Josip Brkić zamjenik je ministra vanjskih poslova Bosne i Hercegovine od travnja 2015. godine. Predsjedava Povjerenstvom za suradnju s NATO-om BiH, međunarodni je tajnik HDZ-a BiH i član Glavnog vijeća Hrvatskog narodnog sabora Bosne i Hercegovine. Rođen je 1974. godine u Sarajevu, gdje je završio osnovnu i srednju školu. Diplomirao je na Pravnom fakultetu Sveučilišta u Mostaru, magistrirao na poslijediplomskom studiju Europske studije Sveučilišta u Sarajevu i Sveučilišta u Bolonji te je doktorand međunarodnog javnog prava na Pravnom fakultetu Sveučilišta u Mostaru. Od 2004. do 2008. bio je veleposlanik Bosne i Hercegovine u Španjolskoj i Maroku. Prethodno je obnašao rukovodeće dužnosti u Ministarstvu europskih integracija BiH, a od 2009. do 2015. radio je na rukovodećim položajima u poslovnom sektoru. Član je Upravnog odbora Europske organizacije javnog prava i Globalnog povjerenstva za vladavinu prava. S gospodinom Brkićem razgovaramo o predstojećim izborima u Bosni i Hercegovini, izboru hrvatskog člana Predsjedništva i legitimnom predstavljanju Hrvata. Govorimo i o tome kako se oblikuje vanjska politika BiH te kako unutarnje političke razlike utječu na odnose s Hrvatskom i međunarodnim partnerima. Razgovaramo o europskom putu BiH, preprekama u pristupnom procesu i ulozi Hrvatske u približavanju BiH Europskoj uniji. Otvaramo i temu suradnje s NATO-om, ostvarenih reformi i mogućnosti daljnjeg napretka. Govorimo o budućoj ulozi visokog predstavnika, američkoj politici prema BiH i odnosima domaćih političkih stranaka. Otvaramo pitanja državne imovine, Južne plinske konekcije i rezultata potpore Republike Hrvatske. Razgovor zaključujemo pitanjem dogovora o budućnosti BiH i kompromisa potrebnih za stabilno funkcioniranje države.
