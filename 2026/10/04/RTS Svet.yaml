  title: Znanje imanje
  subtitle: Mali proizvođač ume da proizvede i preradi i da dobije vrhunski proizvod ali kada dođe vreme za prodaju zbog neravnopravne igre na tržištu često je nemoćan.
  description: 'Mali proizvođač ume da proizvede i preradi i da dobije vrhunski proizvod ali kada dođe vreme za prodaju zbog neravnopravne igre na tržištu često je nemoćan. Pozitivna praksa kao rešenje za održivi razvoj nerazvijenih sredina je udruživanje i zajednički nastup. Kako to funkcioniše u praksi kroz zadruge i platforme u ovoj emisiji Znanja imanja govore: Zoran Krcić iz sela Zlot - kako je vlaškom siru dodao razne ukuse i razvio priču o Krcinom zlatu kao ekskluzivnom proizvodu. Milena Marković, direktorka Zadruge "Darovi Rtnja" kako se razvija model ekonomije opšte dobrobiti. Aleksa Batoćanin iz sela Lopaš - preko digitalne platforme kupcima iz grada obezbeđuju svežu domaću hranu a proizvođačima fer zaradu. Luka i Zorica Mutapović iz sela Gornje Košlje jedna od retkih porodica koja je opstala na obroncima Bobije - raduju se svakom gostu i lepoj reči.'
