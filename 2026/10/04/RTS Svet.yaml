  description: '"Maska" je već jednom snimljena za RTS, davne 1978, u režiji Mire Trailović. U ulozi Generalice Ade, Rimljanke u Beču sredinom devetnaestog veka, kada se radnja događa, na njenom balu, nastupila je nezaboravna Neda Spasojević...Danas, na početku 21. veka, "Maska" Crnjanskog nije nimalo izgubila na aktuelnosti. Srbi, tada "u modi", jer su pomogli austrijskom caru u borbi sa Mađarima, i dalje su čudan, strani svet svuda gde se pojave. Nemoral, razvrat, nedostatak istinitih, valjanih motiva karakteriše i početak 20. veka kada Crnjanski piše "Masku" (1918), i današnji trenutak. U novom čitanju "Maske" (2007), glavnu ulogu Generalice, igra harizmatična glumica srpskog teatra, Vladica Milosavljević. Osim nje, u TV filmu nastupa i Vanja Ejdus, kao Mimi, prijateljica i saučesnica u spletkama Generalice, Branislav Tomašević, kao Bebe, Generaličin nećak, Sergej Trifunović, kao mladi, tragični srpski pesnik Branko Radičević, Goran Jevtić, kao Žan, sluga koji ima značajnu ulogu u toj bečkoj...'
