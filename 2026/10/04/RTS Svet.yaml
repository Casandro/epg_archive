  description: '"Modni salon Karavan" je emotivni televizijski format u kojem mobilni modni salon obilazi različite krajeve Srbije i ženama koje su godinama brinule o drugima poklanja dan u kojem su one u centru pažnje. Na poziv porodice, prijatelja, komšija ili lokalne zajednice, ekipa emisije na čelu sa Suzanom Mančić, dolazi u sela, varošice, predgrađa i gradove kako bi iznenadila žene koje su svojim radom, dobrotom i brigom ostavile trag u životima drugih. U svakoj epizodi pratimo dve posebne priče i dve transformacije. Kroz razgovore sa najbližima upoznajemo glavne junakinje, njihovu svakodnevicu, uspomene i razloge zbog kojih zaslužuju poseban trenutak pažnje. Stručni tim frizera, šminkera i stiliste ne menja ženu do neprepoznatljivosti, već pažljivo ističe njenu prirodnu lepotu, karakter i dostojanstvo. Vrhunac svake priče je trenutak kada glavna junakinja prvi put vidi sebe u ogledalu, a zatim se pojavljuje pred porodicom i ljudima koji je vole. "Modni salon Karavan" nije samo emisija o...'
