  description: TV serija "Branilac" rađena je prema istinitim događajima opisanim u knjigama advokata Olivera Injca "Velike advokatske odbrane", advokata Filote File "Branio sam na smrt osuđene", kao i po originalnim predmetima advokata Veljka Guberine i advokata Tome File. Ovaj serijal, na filmski uzbudljiv način, elementima drame i trilera, obrađuje ozbiljna životna, pravna i filozofska pitanja koja su aktuelna i dan danas. To su vanvremenske priče o ljudskim sudbinama ali i profesiji koja se temelji na zakletvi da brani ne delo koje je počinjeno, već čoveka koji je vrlo često unapred osuđen od javnosti.
