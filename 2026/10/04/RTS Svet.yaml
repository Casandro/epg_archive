  description: Šesta sezona serijala "Moja dedovina" počinje 11. septembra na RTS1, a nove epizode (petkom u 21 čas, RTS1) donose zanimljive priče o ljudima koji obnavljaju porodična imanja i trude se da sačuvaju ono što su im preci ostavili. Tokom dosadašnjih pet TV sezona serijala, obnovljeno je 90 dedovina, dok je za učešće u ovom jedinstvenom televizijskom projektu stiglo više od 10.000 prijava. Obnove traju tri dana i oslanjaju se na tradicionalnu "mobu"- pomoć rodbine, prijatelja, komšija i kumova. Do sada je organizovano više od stotinu moba, a ideja serijala "Moja dedovina" proširila se i u nekoliko zemalja regiona. "Mi kao serijal donosimo tri hiljade evra da se kupi materijal, a domaćin ima obavezu da za tri dana obezbedi ispomoć najmilijih- mobu. A spasili smo, uveren sam, na hiljade porodičnih uspomena- da ne završe među oronulom fasadom, srušenim krovom, uparloženim njivama. Sloga, koja je u prošlosti neretko činila čuda, vraćena je ovim Tv serijalom pred TV gledaoce u savremeno doba....
