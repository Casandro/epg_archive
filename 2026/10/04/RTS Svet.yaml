  description: Šta se desi kada reflektori zamene operacionu lampu, a poznata lica obuku mantil i stanu pored veterinara usred prave intervencije? Dešava se "Veterinarska misija", televizijska emisija koja bez ulepšavanja, ali sa mnogo emocije i humora, otkriva kako izgleda stvarni život veterinara. Autor i voditelj emisije, dr Dragiša Jestrotić, veterinar, vodi gledaoce tamo gde kamere retko ulaze, u ambulante, štale, dvorišta, na farme i na teren, gde nema ponavljanja kadra, nema glume i nema pauze za tremu.
