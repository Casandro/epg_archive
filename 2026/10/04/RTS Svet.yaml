  description: Nedeljno jutro neka počne uz najlepše priče iz naše zemlje i regiona. O filmu "Milica Tomić" pričamo sa rediteljem Nikolom Spasićem i scenaristkinjom Milankom Gvoić. Kako je jedno devojačko pismo promenilo tok istorije? U čudesnom spletu boja, jedna dizajnerka stvara poput elegancije krila retkih ptica i dokazuje da visoka moda ne dolazi nužno iz velikih gradova. Sa nama Doroti, Limeni i Strašilo, a Okret teatar stiže pravo u Oz sa novim premijerama... Pevaju nam Danica Krstić, Ana Mašulović, a o predstavi "Pauza" priča nam Maja Kolundžija Zoroe.
