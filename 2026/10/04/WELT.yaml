  title: Lost Places - Folge 69
  subtitle: Lost Places - Folge 69
  description: Mitten in der indischen 30-Millionen-Metropole Delhi bietet sich ein unerwarteter Anblick. Ein riesiger Dschungel, von dem es heißt, die einzigen Bewohner seien Affen und heulende Schakale. Doch hinter all dem Laub versteckt sich eine Ruine wie aus einer anderen Welt. Noch vor wenigen Jahren lebt eine Familie in dem verlassenen Dschungelhaus. Legenden ranken sich um Sie, da kaum jemand sie je zu Gesicht bekam. Die einen sagen, es seien Riesen gewesen. Andere hielten sie für übernatürliche Wesen.
