  title: Lost Places - Folge 68
  subtitle: Lost Places - Folge 68
  description: Hoch oben im San-Juan-Gebirge im US-Bundesstaat Colorado liegt ein Ort der zerstörten Träume. Ein ungewöhnlich hoch gelegener Platz, um Häuser zu bauen, aber der Grund dafür war Gold. Ein weiterer verlassener Ort liegt vor der Südküste Englands. In der Meerenge Solent steht ein verfallenes Bauwerk aus einer Zeit der Angst. Die freie Sicht auf das umliegende Wasser ist ein Hinweis auf seinen Zweck. In Kriegszeiten war Horse Sand Fort ein wichtiger Teil der Verteidigung Großbritanniens.
