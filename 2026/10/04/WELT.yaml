  title: Der ICE - Highspeed auf Schienen
  subtitle: Der ICE - Highspeed auf Schienen
  description: 'Es ist mit 330 Kilometern pro Stunde Deutschlands schnellstes Schienenfahrzeug. Jährlich bringt der ICE Millionen Reisende in kürzester Zeit ans Ziel und ab Ende 2017 sogar noch schneller: Dann sollen die Highspeed-Züge auf der neugebauten Hochgeschwindigkeitsachse Berlin-München innerhalb von knapp vier Stunden von der Bundes- zur Landeshauptstadt rasen. Die Reportage begleitet einen ICE-Triebfahrzeugführer bei seiner täglichen Arbeit und zeigt die Ausbildung neuer Aspiranten im Simulator.'
  widescreen: true
