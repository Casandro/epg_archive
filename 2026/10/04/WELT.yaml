  title: Lost Places - Folge 67
  subtitle: Lost Places - Folge 67
  description: 'In der Demokratischen Republik Kongo befinden sich die Überreste einer wechselhaften Regentschaft. Heruntergekommene einst prachtvolle Gebäude, ein zerfallenes Stadion und ein herrschaftlicher Gebäudekomplex wurden von einem Mann erbaut, der 1965 die Macht übernahm: Mobutu Sese Seko. Mobutu war machtbesessen. Erste Anzeichen seines zunehmenden Größenwahns sind an diesem Ort zu finden. Die Zurschaustellung seiner Macht und seines Reichtums sollte jedoch von etwas viel Düstererem ablenken.'
