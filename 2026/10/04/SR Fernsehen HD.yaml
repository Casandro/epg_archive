  audiodesc: true
  description: 'Sie bringen immer ausgelassene Stimmung in die SWR "Comedy Scheune": Die Comedy-Duos "Hillu''s Herzdropfa" und "Elsbeth und Alois Gscheidle". Die besten "Scheunenknaller" der vergangenen Jahre in einer besonderen Ausgabe: eine unterhaltsame Mischung aus Alltagssituationen, schlagfertigen Dialogen und einer guten Prise Chaos. Ein Muss für alle Fans von schwäbischem Humor und volkstümlicher Comedy.'
