  title: Die Erntehelferin
  subtitle: Fernsehfilm Deutschland  2007
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Nach ihrer Flucht aus dem sudetendeutschen Marienbad wird Clara zusammen mit ihrem verwitweten Schwager Johann und dessen vier Kindern 1946 in einem kleinen fränkischen Dorf einquartiert. Neben Hunger und Armut belastet Clara die Tuberkulose ihrer sechsjährigen Nichte Heidi. Um Geld für lebensrettende Medikamente aufzutreiben, arbeitet sie als Erntehelferin auf Gut Braunfels. Hier trifft sie den Gutsverwalter Martin wieder, ihre große Liebe. Aber als Clara ihr schwer verdientes Geld gestohlen wird, macht der Gutsherr von Braunfels ihr ein Angebot, das Heidi retten könnte - doch der Preis ist hoch.
