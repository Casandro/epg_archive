  title: Die Tier-Docs vom Schwarzwald (3)
  subtitle: Zahnarztbesuch im Pferdestall
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Zahnpflege in XXL: Tierärztin Anna Walter kümmert sich um die Zähne von Hengst Nero. Lukas Bretzinger und Ronja Arnold, die auch privat ein Paar sind, behandeln gemeinsam Maulesel-Dame Frechi. Bei Hochlandrindern dagegen ist Vorsicht angesagt. "Die gewinnen gegen einen", sagt Lukas. Alle elf Tierärzt:innen der Großtierpraxis im Breisgau haben ihr Spezialwissen - kein Einsatz gleicht dem anderen.'
- eventId: 881628
