  description: |-
    Seit über 20 Jahren ist Clueso einer der erfolgreichsten und vielseitigsten deutschen Musiker. Für diese Show werden seine Hits in neuen Song-Versionen arrangiert - mit Trompeten, Saxofonen und der ganzen Big Band.
    Clueso live zu sehen, ist immer beeindruckend. Sogar in den riesigen Arenen hat man das Gefühl, er singt für jede einzelne Person im Publikum. Diese Nähe zeichnet Clueso aus. Und seine unglaublich große Liebe zur Musik.
