  title: Django Unchained
  subtitle: |-
    Django Unchained
    Western, USA 2012
    Altersfreigabe: ab 16
    (WH vom Freitag, 02.10.2026, 20:15 Uhr)
  description: |-
    Quentin Tarantinos oscarprämierte Hommage an den Spaghetti-Western mit Jamie Foxx, Christoph Waltz und Leonardo DiCaprio: Broomhilda, die Ehefrau des Sklaven Django, wurde von den Brittle-Brüdern verschleppt. Eines Tages wird Django vom Kopfgeldjäger Dr. Schultz unter seine Fittiche genommen. Er verspricht ihm Freiheit, wenn er ihm behilflich ist, die Bande zu finden - tot oder lebendig. Django willigt ein, nicht ahnend, dass vor ihnen ein langer Weg voller Blei und Blut liegt.

    Regie: Quentin Tarantino
    Drehbuch: Quentin Tarantino
    Kamera: Robert Richardson, Fred Raskin

    Darsteller:
    Jamie Foxx (Django)
    Christoph Waltz (Dr. King Schultz)
    Leonardo DiCaprio (Calvin Candie)
    Kerry Washington (Broomhilda von Shaft)
    Samuel L. Jackson (Stephen)
    Walton Goggins (Billy Crash)
    Dennis Christopher (Leonide Moguy)
    James Remar (Butch Pooch / Ace Speck)
    David Steen (Mr. Stonesipher)
