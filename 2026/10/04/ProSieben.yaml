  subtitle: |-
    Die Christoph Waltz Story
    Dokumentation, D 2026
  description: Christoph Waltz, der erfolgreichste deutschsprachige Schauspieler seiner Generation, wird 70. Nach Jahrzehnten im Filmgeschäft zählt der zweifache Oscar-Preisträger zu den absoluten Weltstars. Seine Paraderollen sind Bösewichte, die unberechenbar und charmant zugleich wirken. Wie kaum ein anderer versteht es Waltz, seinen tiefgründigen Figuren Leben einzuhauchen. Doch was ist sein Erfolgsgeheimnis? Und welcher Mensch steckt hinter dem Schauspieler Christoph Waltz?
  widescreen: true
