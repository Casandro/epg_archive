  title: Wie extrem wird das Wetter, Sven Plöger?
  subtitle: Klima-Hotspot Mittelmeer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Das Mittelmeer wird zum Brennpunkt des Klimawandels - mit Folgen für ganz Europa. Der Meteorologe Sven Plöger untersucht, wie sich die Region verändert und welche Zukunft unser Sehnsuchtsziel hat. \n\nStille Buchten, türkisblaues Wasser und antike Städte prägen das Bild des Mittelmeers. Gleichzeitig beeinflusst die Region unser Wetter. Doch mit dem Klimawandel gerät das mediterrane Wettersystem zunehmend aus dem Gleichgewicht. Waldbrände, Dürren und Überflutungen häufen sich. \n\nIn der dritten Folge der Reihe \"Wie extrem wird das Wetter, Sven Plöger?\" blickt der ARD-Meteorologe auf die Mittelmeerregion."
