  title: Im Schatten des Sterns - Wie Emil Jellinek den Mercedes erfand
  description: |-
    (Dokumentation, AUT/DEU/FRA 2025)
    Wäre nicht der Name seiner Tochter Mercedes, man hätte Emil Jellinek längst vergessen. Er war kein Ingenieur, sondern Unternehmer und begeisterter Autofahrer. Sein Geniestreich war der Mercedes, von Maybach nach seinen Vorgaben entwickelt: ein rasanter Rennwagen, den sich die Oberschicht mit nach Hause nehmen konnte. Technische Spitzenleistung, die Aura eines Champions und individuelle Freiheit waren erstmals in einem Produkt vereint. Der Mercedes schlug wie eine Bombe auf dem Markt ein und Jellinek wurde damit zu einem der entscheidenden Wegbereiter des modernen Autos. Der Dokumentarfilm schildert Emil Jellineks ungewöhnliche Geschichte als abenteuerliche Reise ins mobile Zeitalter. Seine Nachfahren in Frankreich und Österreich stellen zahlreiche Briefe und Fotos zur Verfügung, anhand derer Jellineks Lebensstationen erkundet werden.
    Regie: Lorenz Findeisen
  genre:
  - '112'
