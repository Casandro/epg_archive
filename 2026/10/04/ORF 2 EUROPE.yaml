  title: Erlebnis Österreich
  subtitle: Digitale Klöster und Kirchen - Tradition im Wandel
  description: 'Niederösterreich verfügt über eine einzigartige Klosterlandschaft und ein reiches sakrales Kulturerbe. Jahrhundertealte Handschriften, Bibliotheken und sakrale Bauwerke sind Zeugnisse europäischer Kulturgeschichte. Im Mittelpunkt der Dokumentation aus dem ORF Landesstudio Niederösterreich (Regie: Andi Leitner, Kamera: Franz Cee) steht die Digitalisierung dieser Schätze: Sie zeigt, wie innovative Technologien dazu beitragen dieses kulturelle Erbe zu sichern, wissenschaftlich zu erschließen und einer breiten Öffentlichkeit zugänglich zu machen.'
