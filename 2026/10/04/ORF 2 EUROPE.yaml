  title: Pressestunde
  genre:
  - '36'
  subtitle: mit Markus Wallner, Landeshauptmann Vorarlberg und Vorsitzender der Landeshauptleute-Konferenz, ÖVP
  description: "Seit Juli ist Markus Wallner nicht nur Vorarlberger Landeshauptmann, sondern auch der Vorsitzende der Landeshauptleutekonferenz. Und er äußert sich zu vielen Themen dezidiert: ob Tempoeinforderung bei der Wehrdienstreform, Appell für Dürrehilfen an den Finanzminister oder zuletzt die Forderung nach strengeren Sozialhilferegeln. Auch mit Kritik an Vorgängen in oder im Umfeld der ÖVP spart er selten - zuletzt etwa bei der Causa des Wiener Wirtschaftskammerpräsidenten, Walter Ruck. Wie bewertet Wallner die aktuelle Regierungsarbeit? Welche Schwerpunkte versucht er in der Landeshauptleutekonferenz zu setzen und welche noch in Vorarlberg?\n\nDie Fragen stellen: \n\nMichael Prock\n\"Vorarlberger Nachrichten\"\n\nund \n\nHelma Poschner\nORF"
- eventId: 1419464
  start: 2026-10-04T09:58:19Z
  stop: 2026-10-04T10:28:19Z
  title: Hohes Haus
  description: "-Unter Druck - Wer rettet die Finanzen der Gemeinden?\nIn einer Spezialausgabe widmet sich das \"Hohe Haus\" den 2.092 österreichischen Gemeinden, die zunehmend finanziell unter Druck stehen. Steigende Ausgaben, wachsende Aufgaben und weniger Spielraum stellen viele Gemeinden vor große Herausforderungen. Doch nicht nur die Finanzen sorgen für Diskussionen: Die NEOS kritisieren die Macht der Bürgermeister und fordern mehr Zusammenarbeit und auch Gemeindezusammenlegungen. Wie sollen die Gemeinden in Zukunft aussehen und gleichzeitig effizient sowie bürgernah sein? Welche Unterstützung brauchen sie - und wie lässt sich ihre finanzielle Handlungsfähigkeit sichern? \n\n-Zu Gast bei Rebekka Salzer ist Gemeindebundpräsident Johannes Pressl, ÖVP\n\nModeration: Rebekka Salzer"
  genre:
  - '128'
