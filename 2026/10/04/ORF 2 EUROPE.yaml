  title: Universum
  subtitle: Ein Jahr auf unserer Erde - Herbst
  description: |-
    Auf der Nordhalbkugel zieht der Herbst ein und in den Wäldern Nordamerikas sammelt ein junges Backenhörnchen eifrig Vorräte, während die Grizzlybärin angesichts bereits vereister Flüsse besonders kreativ sein muss, um sich und ihren Kleinen noch Nahrung vor der Winterruhe zu beschaffen. Auf der Südhalbkugel dagegen bedeutet die Jahreszeit mehr Helligkeit, Wärme, Erleichterung und Gefahr zu gleich. Junge Königspinguine werden mit angriffslustigen Schwertwalen konfrontiert, junge Elefanten erleben in Simbabwe die erste große Dürre, während wiederum in Mexiko Abermillionen Monarchfalter, nach einer 4000 Kilometer langen Flugreise gelandet sind, um zu überwintern.
    Ein Film von Martha Holmes
  genre:
  - '144'
