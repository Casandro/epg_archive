  title: Einfach. Gemeinsam. Franziskanisch - Leben im Shalomkloster Pupping
  description: 'Vor 800 Jahren starb Franz von Assisi. Seine radikale Einfachheit, seine Nähe zu Armen und seine Orientierung am Evangelium faszinieren bis heute. Doch wie lässt sich franziskanische Spiritualität im 21. Jahrhundert leben? Im Shalom-Franziskanerkloster Pupping in Oberösterreich versucht eine ungewöhnliche Gemeinschaft darauf eine Antwort zu geben: Franziskaner, eine Ordensschwester und Laien teilen Alltag, Gebet und Arbeit. Gäste leben zeitweise mit, manche Bewohnerinnen und Bewohner haben hier in schwierigen Lebensphasen Halt und einen Neuanfang gefunden. Ein Film von Marcus Marschalek'
  genre:
  - '115'
