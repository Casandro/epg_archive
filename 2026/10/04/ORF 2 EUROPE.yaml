  title: Barbara Karlich unterwegs
  subtitle: Begegnungen in Vorarlberg
  description: |-
    Barbara Karlich besucht diesmal Vorarlberg, um außergewöhnliche Menschen und ihre Geschichten kennenzulernen. Ihre erste Station ist Au im Bregenzerwald, wo die Moderatorin einen Tischlereibetrieb besichtigt, der in dritter und vierter Generation von der Familie Madlener geführt wird. Tischlermeister Peter und seine Frau Manuela Madlener sowie die Kinder Sandra und Marcel und Sandras Lebensgefährte Dominik Fetz sind aktiv im Unternehmen tätig und berichten von ihren unterschiedlichen Tätigkeitsbereichen im Betrieb.
    Anschließend reist Barbara Karlich nach Oberlech am Arlberg. Dort wird die Moderatorin von Thomas und Hannelore Lucian empfangen, die hier einen renommierten Hotelbetrieb führen. Den Grundstein dafür legte einst Seniorchef Fridolin Lucian. In den Gesprächen mit den Mitgliedern dieser Hoteliersfamilie - dazu zählen auch noch Christoph, Karina und Emilia Lucian - zeigt sich, dass in den Vorarlberger Bergen auf Gastfreundschaft viel Wert gelegt wird.
  genre:
  - '51'
