  title: Erntedank-Gottesdienst
  subtitle: '"Kraut und Rüben"'
  description: "Die Gemeinde feiert mit Pfarrer-Ehepaar Eva und Johannes Blüher. Ihre Kirche am Ortsrand von Thening nennen sie liebevoll \"Kirche im Feld\". Zum Erntedank-Fest schmückt die Kirche eine traditionelle, aus Getreideähren gebundene Erntekrone. Die Gemeindemitglieder tragen Korn, Obst und Gemüse zum Altar. \nMusikalisch gestalten den Gottesdienst der Chor und die Band der Pfarrgemeinde Thening. Die Band leitet Lukas Böhm, Chorleiter und Organist ist Andreas Hagmüller."
  genre:
