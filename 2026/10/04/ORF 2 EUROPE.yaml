  title: DAS GESPRÄCH mit Susanne Schnabl
  subtitle: 'Köpfe, Inhalte, Egos: Wer führt die SPÖ?'
  description: "Im Ringen um die SPÖ-Spitze könnte am Sonntag eine Entscheidung fallen. Die zentralen Akteure treffen aufeinander: Wer kann die Partei künftig führen? Susanne Schnabl diskutiert mit ihren Gästen am Abend über den Ausgang der Krisensitzungen und über die grundsätzliche Frage dahinter: Geht es in der Politik um Inhalte und Überzeugungen - oder zunehmend um Personen, Macht, Einfluss und mediale Wirksamkeit? Was steht für die SPÖ und in weitere Folgen für die Regierung auf dem Spiel? \n\nDarüber diskutieren bei Susanne Schnabl, aktuelle Änderungen vorbehalten:\n\nAnneliese Rohrer\n\"Die Presse\"\n\nChristian Nusser\n\"Kronenzeitung\"\n\nGerold Riedmann\n\"Der Standard\"\n\nJohanna Hager\n\"Kurier\""
  genre:
  - '36'
