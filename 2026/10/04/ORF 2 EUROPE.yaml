  title: Österreich Bild aus dem Landesstudio Steiermark
  subtitle: Das gibt mir Berge. 40 Jahre Mountainfilm-Festival Graz
  description: Seit 40 Jahren begeistert das Mountainfilm-Festival das Kinopublikum in Graz. Es zählt international zu den beliebtesten und renommiertesten Festivals für Berg- und Abenteuerfilme. Auch im Jubiläumsjahr werden die Preisträger aus 300 Einreichungen von Filmemachern aus aller Welt ermittelt. Das Festival wird seit 1986 von seinem Gründer und Leiter Robert Schauer geprägt, der selbst als Bergsteiger und Filmemacher an zahlreichen Expeditionen teilnahm und drei Mal den Mount bestieg. Ein Film von Günter Schilhan.
