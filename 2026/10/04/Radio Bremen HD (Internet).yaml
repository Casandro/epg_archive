  title: Edgar, das Super-Karibu
  subtitle: Die Elefantenjagd
  description: 'Rudi, der Hase hat schon wieder die Statue von Magnus, dem Elefanten und Bürgermeister von Windhausen, kaputt gemacht. Frank, der Ameisenbär produziert ganz viele neue: aus Gummi! Der Bürgermeister ist glücklich, aber die Statuen sind nicht leicht zu kontrollieren: Sie prallen überall herum wie Gummibälle. Super-Edgar wird sich den springenden Elefanten aus Gummi entgegenstellen müssen.'
