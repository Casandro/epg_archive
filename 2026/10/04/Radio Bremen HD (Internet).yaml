  description: Manchmal klingelt schon morgens um 7 Uhr das Notfalltelefon in der Einsatzzentrale der Organisation "Jung & Alt". Ein Kind hat sich den Magen verdorben. Die Mutter hat eine wichtige Besprechung, der Vater sitzt im Homeoffice. Jetzt schlägt die Stunde der "Oma- und Opa-Feuerwehr". Etwa 100 Opas und Omas sind ehrenamtlich für junge und alte Menschen im Einsatz. Die Organisation "Jung & Alt" organisiert ein Stück Solidarität und Nachbarschaftshilfe in der Großstadt Hamburg.
