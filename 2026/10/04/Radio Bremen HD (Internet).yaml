  description: Die Erträge aus Bingo! kommen Projekten im Bereich des Natur- und Umweltschutzes zugute. In der Umweltlotterie sind also Teilnehmer und Natur gleichermaßen die Gewinner.
- eventId: 1472073
  start: 2026-10-04T16:00:00Z
  stop: 2026-10-04T16:45:00Z
  title: Hanseblick - Sternenland Mecklenburg-Vorpommern
  subtitle: 'Moderation: Sibylle Rothe'
  description: 'In Mecklenburg-Vorpommern scheint das All zum Greifen nah: Die Sternwarte in Demmin lädt ein, eine partielle Sonnenfinsternis zu beobachten. Ein mobiles Planetarium bringt den Kosmos direkt in die Schule oder nach Hause. In Rostock gibt es eine nachgebaute Mondlandschaft, um Fahrzeuge für Mondmissionen zu testen. Und in Neustrelitz halten Wissenschaftler über riesige Antennen Kontakt zu Satelliten und beobachten das Weltraumwetter. Astronaut Reinhold Ewald erzählt hier über seine Erlebnisse im All.'
- eventId: 1475735
  start: 2026-10-04T16:45:00Z
  stop: 2026-10-04T17:30:00Z
  title: DAS! Rote Sofa
  subtitle: Christoph Kramer, TV-Experte, Podcaster und Autor
  description: 'Der Weltmeister von 2014 spricht über besondere Begegnungen mit Menschen und wie sie unser Leben berühren können. Und vielleicht werfen wir einen gemeinsamen Blick auf das aktuelle Nationalteam. Ehrlich, selbstironisch und lässig: Christoph Kramer auf dem Roten Sofa.'
