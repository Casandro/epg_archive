  title: Expeditionen ins Tierreich
  subtitle: Wildschweine - Dicke Schwarte, kluger Kopf
  description: Kaum ein heimisches Wildtier ist so intelligent und anpassungsfähig, hat eine so feine Nase, ein so gutes Gehör und einen so ausgeprägten Familiensinn wie das Wildschwein. Vor allem aber sind sie lernfähig und deshalb die heimlichen Herrscher des Waldes. Der Film begleitet die klugen Tiere durch das Jahr und gibt spannende und amüsante Einblicke in das tägliche Leben der kräftigen Borstentiere.
- eventId: 1470569
  start: 2026-10-04T14:00:00Z
  stop: 2026-10-04T14:30:00Z
  title: Björn Freitag kocht grenzenlos köstlich
  subtitle: Danzig und die polnische Ostseeküste
  description: 'Björn Freitag zieht es diesmal an die polnische Ostseeküste ins schöne Danzig - oder wie es hier heißt: "Gdansk". Eine Stadt mit einer bewegten Geschichte, urbanen Gegenwart und einem festen Platz in der Weltliteratur: Hier ließ schon Oskar Mazerath in der Blechtrommel die Fenster zerspringen. Neben Klassikern aus der polnischen Küche findet man hier auch Spezialitäten aus der Kaschubei, einem hügeligen und seenreichen Landstrich, der sich bis nach Danzig erstreckt.'
  genre:
  - '165'
- eventId: 1471503
  start: 2026-10-04T14:30:00Z
  stop: 2026-10-04T15:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: "Gesunde Mahlzeiten kochen, die auch noch schmecken. Spitzenkoch Tarik Rose und \"Ernährungs-Doc\" Matthias Riedl haben dafür Rezepte mit Zutaten, die ganzjährig angeboten werden. \nLos geht es mit einem raffinierten Möhren-Couscous mit Joghurt-Dip. Für die Kartoffelteig-Ravioli mit Fenchel sind Kartoffeln die Hauptdarsteller. Und dann der Klassiker: Zwiebelsuppe mit Käse-Croûtons."
