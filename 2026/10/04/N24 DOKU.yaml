  title: The Squaire - Deutschlands größtes Bürogebäude
  subtitle: The Squaire - Deutschlands größtes Bürogebäude
  description: In Frankfurt am Main erstreckt sich mit 660 Metern das größte Bürogebäude der Bundesrepublik. Optimal gelegen nahe Autobahn und Mega-Airport gilt das Squaire als einer der zentralsten Arbeitsplätze Europas. Highspeed-Internet, globale Vernetzung und ein Concierge-Service sollen hier den Berufsalltag der Mitarbeiter revolutionieren. In der Reportage werden Instandhaltung und Überwachung des Riesenkomplexes unter die Lupe genommen, um herauszufinden, was den Megabau so einzigartig macht.
