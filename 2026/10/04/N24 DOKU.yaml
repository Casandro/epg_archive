  title: Große Pötte und schwere Lasten - Malochen im Hamburger Hafen
  subtitle: Große Pötte und schwere Lasten - Malochen im Hamburger Hafen
  description: Rund 9.000 Mal legen jährlich unterschiedliche Schiffe an den insgesamt 43 Kilometer langen Kaimauern des drittgrößten europäischen Containerhafens an. Allein im Jahr 2015 wurden hier mehr als 137 Millionen Tonnen Frachtgut verladen. Doch wodurch zeichnet sich der Hamburger Hafen aus und wie hat er sich weiterentwickelt? Welche Schiffe legen hier an und was für Menschen arbeiten hier? Die Reportage bietet einen vielseitigen Einblick in das rege Geschehen im größten deutschen Seehafen.
