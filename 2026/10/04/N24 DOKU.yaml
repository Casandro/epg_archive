  title: 'Mega-Konstruktionen: Champlain Bridge'
  subtitle: 'Mega-Konstruktionen: Champlain Bridge'
  description: Als Ersatz für die ursprüngliche Champlain-Brücke wurde über dem Sankt-Lorenz-Strom in der kanadischen Provinz Québec eine Doppelschrägseilbrücke gebaut. Die gigantische Betonkonstruktion der neuen Samuel-De-Champlain-Brücke muss den harten kanadischen Wintern trotzen, in denen der Fluss gefriert. Außerdem passieren sie täglich tausende Fahrzeuge, denen die Mega-Konstruktion standhalten muss. Die Dokumentation zeigt, welche Eigenschaften dieses Bauwerk zu einer Brücke der Superlative machen.
