  title: Auf Manöverfahrt mit U36
  subtitle: Auf Manöverfahrt mit U36
  description: U36 ist Deutschlands modernstes U-Boot. Eine Kampfmaschine und gleichzeitig Arbeitsplatz und Wohnort der Besatzung. In einer stählernen Röhre leben sie oft isoliert, über oder unter Wasser. Diese Reportage gewährt einen exklusiven Einblick in ein seltenes Innenleben während des Großmanövers "Northern Coasts" vor Lettlands und Estlands Küste. Mehr als 3000 Soldaten üben hier den Ernstfall in Sichtweite russischer Kriegsschiffe. In dieser Militärübung spielt U36 eine einzigartige Rolle.
