  title: Der Freizeitpark - Schuften für den großen Spaß
  subtitle: Der Freizeitpark - Schuften für den großen Spaß
  description: 'Ursprünglich als Test-Park für Achterbahnen gegründet, tummeln sich heute auf dem Freizeitgelände in Rust bis zu 30.000 Gäste täglich. Und sie wollen nur eins: Spaß haben. Damit das auch unbehelligt klappt, läuft der Betrieb hinter den Kulissen auf Hochtouren. Ob Reinigungskräfte, Sternekoch oder die Techniker, die routinierte Wartungsarbeiten an Karussells und Achterbahnen durchführen - sie alle helfen, den Tagesausflug im Freizeitpark zu einem besonderen Erlebnis zu machen.'
