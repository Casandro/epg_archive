  stop: 2026-10-04T22:01:00Z
  title: Hitler und Stalin (1)
  subtitle: Hitler und Stalin (1)
  description: Hitler und Stalin waren zwei der schrecklichsten Diktatoren des 20. Jahrhunderts. Hinter der Fassade ihrer radikalen Gegnerschaft hatten die beiden Männer jedoch möglicherweise mehr gemeinsam, als zunächst vermutet. Obwohl sie sich nie begegneten, wurden ihre Komplizenschaft und ihre Zusammenarbeit jahrzehntelang geheim gehalten. Wie haben sie sich gegenseitig beeinflusst? Diese Dokumentation bringt die neuesten Enthüllungen über diese berüchtigte Beziehung ans Licht.
  widescreen: true
- eventId: 1407948
  start: 2026-10-04T22:01:00Z
  stop: 2026-10-04T23:00:00Z
  title: Hitler und Stalin (2)
  subtitle: Hitler und Stalin (2)
  description: Viele Jahrzehnte lang wurden Hitler und Stalin lediglich als unerbittliche Feinde dargestellt. Nun lassen neue Erkenntnisse darauf schließen, dass zwischen ihnen eine Mischung aus Misstrauen und gegenseitiger Faszination herrschte. Diese Dokumentation zeigt anhand von unveröffentlichten Archiven die geheime Beziehung zwischen Hitler und Stalin, wie sie zueinander standen und welche Vorteile sie vor Juni 1941 aus dem deutsch-sowjetischen Pakt zogen.
  widescreen: true
