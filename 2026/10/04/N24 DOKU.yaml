  title: Verbrechen. Versagen. Verfall. Deutschlands Brennpunkte
  subtitle: Verbrechen. Versagen. Verfall. Deutschlands Brennpunkte
  description: 'Ob Frankfurter Bahnhofsviertel, Drogeneinfallstor Hamburger Hafen oder Dealer-Hotspot Görlitzer Park: Sie alle zählen zu Deutschlands sozialen Brennpunkten. Orte, deren massive Probleme selbst Polizei und Justiz zu überfordern scheinen. Diese Dokumentation begleitet Landes-, Bundespolizei und den Zoll bei Razzien und Drogenfahndungen. Außerdem analysieren und bewerten Experten die unterschiedlichen Maßnahmen, die eingesetzt werden, um die kritische Lage in den Brennpunkten zu bewältigen.'
