  title: 'Mega-Konstruktionen: Las Vegas High Roller'
  subtitle: 'Mega-Konstruktionen: Las Vegas High Roller'
  description: Der Las Vegas High Roller ist mit 167 Metern das höchste Riesenrad Nordamerikas. Er bietet seinen Besuchern eine spektakuläre Aussicht über die Millionenmetropole im US-amerikanischen Bundesstaat Nevada. Die Kabinen des High Rollers sind winddicht und ermöglichen den Fahrgästen durch ihre Transparenz einen halbstündigen Ausflug in luftige Höhen mit Sicht in alle Richtungen. Die Dokumentation begleitet den Fahrbetrieb und zeigt, was diese Attraktion der Stadt des Glücksspiels einzigartig macht.
