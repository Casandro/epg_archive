  title: 'Traumzüge: Transcantabrico Clasico'
  subtitle: 'Traumzüge: Transcantabrico Clasico'
  description: Der spanische Luxuszug ist die längste Schmalspurbahn Westeuropas. Dabei beträgt die Gleisbreite mit nur einem Meter knapp zwei Drittel einer Normalspur. Auf der 1.000 Kilometer langen Strecke aus dem 19. Jahrhundert geht die Reise von San Feliz nach Bilbao, entlang der zerklüfteten Küste der Biskaya, durch die kantabrischen Berge bis zum Zielbahnhof Ferrol. Für die außergewöhnliche Fahrt mit dem Transcantabrico Clasico zahlen die Passagiere knapp 4.250 Euro.
