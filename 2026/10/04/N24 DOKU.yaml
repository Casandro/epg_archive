  title: 'Border Patrol Neuseeland: DJ Trickreich'
  subtitle: 'Border Patrol Neuseeland: DJ Trickreich'
  description: An den neuseeländischen Grenzen entscheidet sich täglich, wer passieren darf - und wer nicht. Die Beamten stehen unter hohem Druck, denn jeder Fehler kann Folgen haben. In dieser Folge geraten Beamte bei der Einreisekontrolle mit einem nigerianischen Staatsbürger an ihre Grenzen. Parallel nehmen Zollermittler ein verdächtiges Paket aus Afrika unter die Lupe. Außerdem versucht ein trickreicher DJ, ohne gültiges Visum im Land zu arbeiten.
