  title: Lost Places - Folge 64
  subtitle: Lost Places - Folge 64
  description: Im englischen Suffolk liegt eine Militäranlage, die ein Geheimnis birgt. Auf den Luftwaffenstützpunkt Bentwaters wurde die Öffentlichkeit im Jahr 1980 aufmerksam, als Anwohner seltsame rote Lichter am Himmel sahen, die sich der Erde näherten. Das Geheimnis der Lichter ist bis heute aufgrund hoher Sicherheitsvorkehrungen ungeklärt. Auch eine kleine Insel im Pazifik vor Taiwan erinnert aufgrund von Propaganda-Plakaten und Betonbauten an eine militärische Einrichtung, obwohl sie es nie war.
  widescreen: true
- eventId: 1407908
  start: 2026-10-04T16:33:00Z
  stop: 2026-10-04T17:27:00Z
  title: Lost Places - Folge 65
  subtitle: Lost Places - Folge 65
  description: 'In der Nähe des Loch Lomond ist ein historischer Bau kurz vor dem Einsturz: Buchanan Castle. Was diese Burg so besonders macht, ist, wie sie im Laufe der Jahre mit der Natur verschmolzen ist. Während des Zweiten Weltkriegs diente es als Militärkrankenhaus, das Gebäude ist jedoch noch sehr viel älter. Unweit der Küste des Toten Meeres liegt ein touristischer Ort, der durch das Sinken des Meeresspiegels in einem Krater von der Erde verschluckt wurde.'
  widescreen: true
- eventId: 1407909
  start: 2026-10-04T17:27:00Z
  stop: 2026-10-04T18:22:00Z
  title: Lost Places - Folge 66
  subtitle: Lost Places - Folge 66
  description: Hoch über dem Gedränge der legendären indischen Stadt Rishikesh liegen kleine, höhlenartige Kuppelbauten im Wald. Diese bröckelnden Bauten waren einst der Gipfel des spirituellen Luxus. Berühmt wurde dieser Ort durch die Beatles, die diese inzwischen vergessene Ashram zum gefragten Wallfahrtsort machten. Ein Ort, der ebenfalls durch eine Ikone berühmt wurde, ist eine Anlage in Brandenburg. Hier an der Sprunggrube trainierte Jesse Owens, einer der besten amerikanischen Athleten aller Zeiten.
  widescreen: true
- eventId: 1407926
  start: 2026-10-04T18:22:00Z
  stop: 2026-10-04T19:18:00Z
  title: Lost Places - Folge 67
  subtitle: Lost Places - Folge 67
  description: 'In der Demokratischen Republik Kongo befinden sich die Überreste einer wechselhaften Regentschaft. Heruntergekommene einst prachtvolle Gebäude, ein zerfallenes Stadion und ein herrschaftlicher Gebäudekomplex wurden von einem Mann erbaut, der 1965 die Macht übernahm: Mobutu Sese Seko. Mobutu war machtbesessen. Erste Anzeichen seines zunehmenden Größenwahns sind an diesem Ort zu finden. Die Zurschaustellung seiner Macht und seines Reichtums sollte jedoch von etwas viel Düstererem ablenken.'
  widescreen: true
- eventId: 1407927
  start: 2026-10-04T19:18:00Z
  stop: 2026-10-04T20:08:00Z
  title: Lost Places - Folge 68
  subtitle: Lost Places - Folge 68
  description: Hoch oben im San-Juan-Gebirge im US-Bundesstaat Colorado liegt ein Ort der zerstörten Träume. Ein ungewöhnlich hoch gelegener Platz, um Häuser zu bauen, aber der Grund dafür war Gold. Ein weiterer verlassener Ort liegt vor der Südküste Englands. In der Meerenge Solent steht ein verfallenes Bauwerk aus einer Zeit der Angst. Die freie Sicht auf das umliegende Wasser ist ein Hinweis auf seinen Zweck. In Kriegszeiten war Horse Sand Fort ein wichtiger Teil der Verteidigung Großbritanniens.
  widescreen: true
- eventId: 1407928
  start: 2026-10-04T20:08:00Z
  stop: 2026-10-04T21:04:00Z
  title: Lost Places - Folge 69
  subtitle: Lost Places - Folge 69
  description: Mitten in der indischen 30-Millionen-Metropole Delhi bietet sich ein unerwarteter Anblick. Ein riesiger Dschungel, von dem es heißt, die einzigen Bewohner seien Affen und heulende Schakale. Doch hinter all dem Laub versteckt sich eine Ruine wie aus einer anderen Welt. Noch vor wenigen Jahren lebt eine Familie in dem verlassenen Dschungelhaus. Legenden ranken sich um Sie, da kaum jemand sie je zu Gesicht bekam. Die einen sagen, es seien Riesen gewesen. Andere hielten sie für übernatürliche Wesen.
  widescreen: true
- eventId: 1407947
