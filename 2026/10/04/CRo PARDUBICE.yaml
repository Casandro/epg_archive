- eventId: 1431677
  start: 2026-10-04T16:04:00Z
  stop: 2026-10-04T17:00:00Z
  title: Na nedělní vlně z Pardubic
  description: Václav Otakar Medek pocházel z rodiny zedníka, ale svou neuvěřitelnou pílí se vypracoval v majitele jedné z nejvýznamnějších stavebních firem na východě Čech v první polovině 20. století. V Pardubicích postavil činžovní domy u Chrudimky nebo na rozhraní Sakařovy a Polské, a několik vil na Bílém Předměstí. Část z nich spolu se synem Otakarem. Ten zůstal vyhledávaným projektantem i poté, co přišel o rodinnou firmu po znárodnění v roce 1948. Připravila Šárka Rusnáková.
