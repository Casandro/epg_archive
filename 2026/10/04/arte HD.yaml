  description: Die Westberliner Elite um Bürgermeister Eberhard Diepgen und seinen Verbündeten, den Politiker Klaus-Rüdiger Landowsky, hat ihre Macht Mitte der 1990er Jahre zementiert und feiert sich selbst auf großen Festen in den Beton-Kathedralen der vielen Großbaustellen der Stadt. Doch der erhoffte Hauptstadt-Boom bleibt aus. Immobilienhaie und Großinvestoren haben sich verzockt.
