  title: Notre-Dame, die Jahrhundertbaustelle (2/3)
  subtitle: Harmonie der Kräfte
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Am 15. April 2019 stand eines der berühmtesten Wahrzeichen Frankreichs in Flammen: die Pariser Kathedrale Notre-Dame. Eineinhalb Jahre nach dem Brand beschäftigt die mit der Restaurierung beauftragten Architekten und Wissenschaftler vor allem eines: die Stabilität der Gewölbe von Notre-Dame. Durch intensive Erforschung der Kirchenstruktur entdecken sie die bewegte Baugeschichte der Kathedrale und verstehen, worin das Geheimnis der großen Widerstandskraft des Gebäudes liegt. Dieses Wissen wird ihnen beim Wiederaufbau helfen.'
