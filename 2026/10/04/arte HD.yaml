  title: Die Mythen der Wikinger (6/10)
  subtitle: Der Fluch des Rings
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In Asgard herrscht Zwietracht: Die Götter misstrauen Loki und Odin beschließt, mit ihm auf Wanderschaft zu gehen. Unterwegs töten die Götter unwissentlich den Sohn des Magiers Hreidmar, der zum Ausgleich eine riesige Menge Gold fordert. Loki stiehlt den Schatz und den magischen Ring des Zwerges Andvari, um den Göttervater zu befreien. Wütend belegt der Zwerg den Ring mit einem Fluch. Auf dem Rückweg treffen die Götter auf den Riesen Thiazi, der Loki zwingt, ihm Idunn auszuliefern, die Hüterin der Äpfel der Unsterblichkeit. Die Götter beginnen zu altern - und der Goldschatz entfaltet bald seine mörderische Wirkung.'
