  title: Nigel Kennedy & Die vier Jahreszeiten
  subtitle: Sternstunden der Musik
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Mit Punkfrisur und schrillem Outfit mischte er 1989 die Klassikwelt auf: Nigel Kennedys Version von Vivaldis "Vier Jahreszeiten" wurde zum bestverkauften Klassikalbum aller Zeiten. Der Film wirft einen Blick zurück auf die legendäre Aufnahme und bewertet sie neu. Mit dem Stargeiger Maxim Vengerov, der Modeschöpferin Esther Perbandt, dem Mandolinvirtuosen Avi Avital und vielen anderen.'
