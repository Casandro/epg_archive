  title: Concerto per Milano 2026
  subtitle: Sumino spielt Gershwin
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Concerto per Milano lädt auf der Piazza del Duomo vor der illuminierten Fassade des Mailänder Doms mit 5.000 Plätzen zum Verweilen ein. Riccardo Chailly dirigiert das Orchestra Filarmonica della Scala, am Klavier der Pianist Hayato Sumino. Sie präsentieren George Gershwins "Concerto in F" und Leonard Bernsteins symphonische Tänze aus der "West Side Story".
