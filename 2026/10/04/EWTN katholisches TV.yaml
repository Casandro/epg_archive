  description: "\"Worin besteht Familienfreundlichkeit, wenn die Mitglieder der Familie immer weniger Zeit miteinander verbringen, weil die Kinder möglichst früh und möglichst lang außer Haus betreut werden?\". Das fragt die Bestsellerautorin Birgit Kelle in ihrem Impulsvortrag zum Thema \"Für unsere Kinder nur das Beste - Wie sieht gute Kleinkinderbetreuung aus?\". Als vierfache Mutter und Publizistin kennt sie nur zu gut den Spagat zwischen Mutterschaft und Erwerbstätigkeit - und hat sich, als \"gut ausgebildete, emanzipierte Frau\" bewusst dafür entschieden, ihre Kinder selbst zu betreuen. Sie wirbt für eine Familienpolitik, die auch finanziell für Freiräume sorgt, so dass Frauen tatsächlich eine Wahl haben, und nicht dazu gezwungen sind, ihre Kinder fremdbetreuen zu lassen.\n \nEin Themenabend des Katholischen Familienverbands Kärnten."
