    Robotnicy z niedzielnej Ewangelii, z przypowieści o winnicy, przestali pamiętać, że pracę w niej otrzymali jako łaskę - winnica nie jest ich własnością. Łatwo przyzwyczaić się do łaski, trudniej pamiętać, że została nam ona powierzona i przyjdzie czas, by oddać plony. Jezus pokazuje także, że fałszywe poczucie własnej wartości może doprowadzić człowieka do absurdu: najpierw nie wystarcza mu denar, potem wyciąga rękę po całą winnicę. O łasce wiary i pokorze o. Mateusz Stachowski porozmawia z o.
