  title: Nad rozlewiskiem... - odc. 2/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Konrad coraz więcej czasu spędza z Małgosią nad rozlewiskiem. Zastanawia się nawet nad tym, czy nie przeprowadzić się do niej na stałe. Marysia robi karierę w agencji reklamowej. Przygotowuje projekt razem z Agatą (Orina Krajewska), od powodzenia którego zależy jej przyjęcie do pracy. Coraz częściej natomiast zaczyna wspominać Krzysztofa i ich wspólny wakacyjny romans. Sprawy z Kubą zaczynają się komplikować. Kuba rzadko telefonuje i bywa w Warszawie.
  ageRating: 12
  genre:
  - '23'
  subtitle: Marysia nie może zapomnieć o Krzysztofie. Konrad buduje w Ostródzie most, który łączy miejscowość. Otrzymuje honorowe obywatelstwo i klucze do bram miasta. Wypadek Małgosi przerywa radość świętowania.
- eventId: 1266542
  start: 2026-10-04T01:00:00Z
  stop: 2026-10-04T01:50:00Z
  title: Nad rozlewiskiem... - odc. 3/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Małgosia oraz Mirka leżą w szpitalu. Ich życiu nie zagraża na szczęście nic złego. W czasie pobytu w szpitalu Małgosia i Mirka szczerze rozmawiają i wybaczają sobie dawne urazy. Wszyscy przyjaciele odwiedzają Małgosię w szpitalu. Po zrobieniu prześwietlenia okazuje się, że Małgosia może wyjść do domu. Mirka jest w gorszym stanie, ma problemy z kręgosłupem. Odwiedza ją Maciej organista i zaczyna z nią rozmawiać. Teraz przychodzi już każdego dnia.
  ageRating: 12
  genre:
  - '23'
  subtitle: Małgosia i Mirka leżą w szpitalu. Ich życiu nie zagraża niebezpieczeństwo. W czasie rekonwalescencji kobiety szczerze rozmawiają i wybaczają sobie dawne urazy. Organista Maciej zbliża się do Mirki.
- eventId: 1266543
  start: 2026-10-04T01:50:00Z
  stop: 2026-10-04T02:55:00Z
  title: Alternatywy 4 - odc. 4/9 - Profesjonaliści
  description: |-
    Tytuł oryginalny: Alternatywy 4
    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Zofia Czerwińska, Bożena Dykiel, Kazimierz Kaczor, Wojciech Pokora, Mieczysław Voit, Roman Wilhelmi
    Jedną z lokatorek bloku przy Alternatywy 4 jest śpiewaczkaKubiak - Kolińska. Jej próby głosu stają się uciążliwe dla sąsiadów. Śpiewaczce z kolei przeszkadza każdy szmer, wysyła więc męża, byuciszał robotników używających wiertarek, młotów i innych narzędzi. Gdy interwencje nie skutkują, z zemsty każe wszelkie prace w swoimmieszkaniu wykonywać nocą. Cichocki nieustannie nachodzi prezesa, jego koledzy udają ekipętelewizyjną.
  ageRating: 12
  genre:
  - '20'
  subtitle: Codzienne ćwiczenia głosu sprawiają, że sąsiedzi śpiewaczki Kolińskiej mają jej dosyć. Cichocki może wkrótce dostać upragnione mieszkanie. Niestety, na drodze staje dygnitarz partyjny Winnicki.
