  title: Nad Niemnem - odc. 3/4
  description: |-
    Tytuł oryginalny: Nad Niemnem
    PL, 1986
    Reżyseria: Zbigniew Kuźmiński
    Występują: Janusz Zakrzeński, Marta Lipińska, Iwona Katarzyna Pawlak, Adam Marjański, Ewa Decówna, Bożena Rogalska
    Kirło i jego żona gorliwie swatają Różyca, ale Justyna patrzy na niego z obrzydzeniem. Pomaga Bohatyrowiczom w czasie żniw. Dowiaduje się, że matka Janka marzy o ślubie syna z bogatą sąsiadką, Jadwigą Dowmuntówną. Mimo to Justyna spędza coraz więcej czasu z Janem, a także Anzelmem. Ciotka Marta namawia ją na małżeństwo z Różycem, choć sama kiedyś popełniła błąd, odrzucając człowieka, którego kochała. Na wiadomość o zamiarach Różyca wobec Justyny Zygmunt Korczyński jedzie do Korczyna.
  ageRating: 12
  genre:
  - '23'
  subtitle: Justyna pomaga Bohatyrowiczom w czasie żniw. Dowiaduje się, że matka Janka marzy o ślubie syna z bogatą sąsiadką, Domuntówną. Mimo to spędza coraz więcej czasu z Janem.
- eventId: 1266401
  start: 2026-10-04T13:20:00Z
  stop: 2026-10-04T14:20:00Z
  title: Nad Niemnem - odc. 4/4
  description: |-
