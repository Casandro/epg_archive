    PL, 2011
    Reżyseria: Piotr Mikucki
    Robert Makłowicz kontynuuje podróż po Piemoncie w północnych Włoszech. Tym razem odwiedza miasto Alba i region Langhe. Alba słynie z biały trufli, a cały region z czerwonego wina barolo. Oficjalne otwarcie sezonu na trufle odbywa się w pierwszą niedzielę października. Tego wydarzenia smakosz z Krakowa nie mógł przegapić. Całe miasto zamienia się wtedy w wielki targ spożywczy.
  genre:
  - '165'
  subtitle: Robert Makłowicz odwiedza region Langhe oraz miasto Alba, słynące z białych trufli. W pierwszą niedzielę października odbywa się otwarcie sezonu na trufle.
