    Natalia spontanicznie zaprasza Paulę do domu, co wywołuje silne emocje u Kacpra. Ludwik próbuje ocieplić relacje z Adelą. Boscy wraz z przyjaciółmi wspominają zmarłego Staszka - są poruszeni nagłą śmiercią rówieśnika. Natalia bezskutecznie próbuje namówić Ludwika na zdrowszy styl życia. Ludwik najchętniej spędza czas z Markiem w lokalnym "Kogutku".
