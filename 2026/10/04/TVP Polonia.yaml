  subtitle: Jan i Justyna wyznają sobie miłość. Kiedy Kirłowie przyjeżdżają do Korczyna z oświadczynami w imieniu Różyca, dziewczyna odrzuca je, wyznając, że jest już zaręczona z Janem.
