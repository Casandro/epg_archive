    PL, 1986
    Reżyseria: Zbigniew Kuźmiński
    Występują: Janusz Zakrzeński, Marta Lipińska, Iwona Katarzyna Pawlak, Adam Marjański, Ewa Decówna, Bożena Rogalska
    Do Bohatyrowiczów wyrywa się nie tylko Justyna, ale i syn Benedykta, Witold. Rodzinny konflikt pogłębia się, zwłaszcza że pan Korczyński i jego żona mają różne zdania na temat ewentualnego małżeństwa Justyny z Różycem. Justyna i Witold są gośćmi na weselu jednej z Bohatyrowiczówien. Tej nocy Jan i Justyna wyznają sobie miłość, a Benedykt wreszcie odnajduje wspólny język z synem. Następnego dnia Kirłowie przyjeżdżają do Korczyna z oświadczynami w imieniu Różyca.
  ageRating: 12
  genre:
