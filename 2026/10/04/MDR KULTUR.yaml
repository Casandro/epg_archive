  title: 'MDR KULTUR Sonntagsraten: Dankbarkeit'
  subtitle: Radioquiz von und mit Axel Thielmann
  description: "Heute am Erntedankfest, geht es im Sonntagsraten um die Dankbarkeit, aber auch um die verschiedenen Formen des Dankens, der Danksagung und des Undanks - oder um das, was wir dafür halten.\n\nBei unseren Rätseln stehen keine wuchtigen Gewinnprämien im Vordergrund, sondern das Vergnügen zuzuhören und mitzumachen. Die Gewinnerin, der Gewinner wird aus all jenen MDR KULTUR-Hörern ermittelt, die die drei heute gestellten Fragen per E-Mail oder über den Postweg richtig beantworten. \n\nAußerdem gibt es ein kleines Rätsel-Extra in der Sendung: In einem der drei Rätsel ist ein Fehler versteckt. Wer den findet, kann noch während der Sendung direkt im MDR KULTUR-Studio unter der Tel.: 0800 55 99 88 4 anrufen und hat so die Chance auf einen Zusatzgewinn. \n\nWer für die Lösung der drei Rätselfragen ein Überraschungspaket gewinnen möchte, sollte online mitmachen unter: sonntagsraten@mdr.de oder per Post an untenstehende Adresse."
- eventId: 807834
  start: 2026-10-04T10:00:00Z
  stop: 2026-10-04T11:00:00Z
  title: 'MDR KULTUR Café: mit Rosalie Thomass'
  description: "\"Ich bin dazu übergegangen, mir mehr zuzutrauen als früher\", sagt Rosalie Thomass im MDR KULTUR Café. Nach großen Rollen in Filmen wie \"Grüße aus Fukushima\", \"Eine unerhörte Frau\" oder \"Die Känguru-Chroniken\" nimmt sie die Geschichten, die sie erzählen will, jetzt selbst in die Hand.\n\nFür \"Lügen über meine Mutter\" hat sie den Roman von Daniela Dröscher für das Kino adaptiert und sich die Hauptrolle selbst geschrieben. Sie spielt Cornelia, eine Frau, deren Ehemann ihren Körper zum Problem erklärt und damit Macht über sie ausübt. \"Es geht nicht darum, dass die Frau mehrgewichtig ist und dem Mann das nicht passt\", sagt Rosalie Thomass. \"Es geht darum, dass die Frau existiert und dass dem Mann das nicht passt.\"\n\nEine Frau, die ihren Platz mit großer Selbstverständlichkeit beansprucht, spielt Rosalie Thomass auch in ihrer neuen Rolle im Franken-\"Tatort\". Als Kriminalhauptkommissarin Emmi Rathgeber tritt sie an die Seite von Fabian Hinrichs. Schon bei ihrem ersten Auftritt im Nürnberger Großraumbüro verändern sich die Kräfteverhältnisse. Die Neue wartet nicht ab, bis ihr jemand einen Platz anbietet. Sie nimmt sich den Raum. \"Wir profitieren sehr davon, dass wir uns gegenseitig überraschen können und wollen\", sagt Thomass über die Zusammenarbeit mit Hinrichs.\n\n\"Lügen über meine Mutter\" erzählt von Bodyshaming, ungewollter Mutterschaft und finanzieller Abhängigkeit. Themen, die für Rosalie Thomass keineswegs erledigt sind. Sie ist selbst bei einer alleinerziehenden Mutter aufgewachsen: \"Strukturell ist das wirklich die komplette Arschkarte. Und daran hat sich gar nichts verbessert.\" Noch immer seien vor allem Mütter benachteiligt. Deshalb müsse auch darüber gesprochen werden dürfen, was Mutterschaft politisch, gesellschaftlich und wirtschaftlich für Frauen bedeutet.\n\nGefragt, ob der feministische Kampf inzwischen nicht an vielen Stellen gewonnen sei, verweist sie auf Femizide und Gewalt gegen Frauen. Hinzu kommen Schönheitsnormen und Körperbilder der Gegenwart, die Rosalie Thomass als Teil eines Systems versteht, in dem Frauen lernen, mit ihrem Körper unzufrieden zu sein. Dieses Spiel könne keine gewinnen. Andererseits, wenn jemand ihren Körper kommentieren wolle, sei das nicht ihr Problem. \"Dafür braucht man einen widerspenstigen Grundcharakter - und den habe ich zum Glück.\"\n \n\nGabriele Bischoff"
  subtitle: Eine Sendung von Carsten Tesch
