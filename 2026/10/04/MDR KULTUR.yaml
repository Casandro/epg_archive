    * 15.05 MDR KULTUR - Diskurs: Wo die Toten sprechen
    Er schreibt über Bier und Eisenbahnfahrten, schreibt Theaterstücke und Essays - aber die wahren Schätze sind die Romane von Jaroslav Rudis. Sein neuer Roman "Wo die Toten sprechen" ist eine große europäische Erzählung über das Sterben und das Reisen, die Vergangenheit und die Gegenwart, über Kunst und Erbe und die Schönheit des Unterwegsseins.
    Jaroslav Rudis im Gespräch mit Katrin Schumacher

    Mit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem "Das schöne Buch".
