  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: |-
    Was macht Musik mit uns, wenn sie plötzlich genau ins Herz trifft? Zum Auftakt von "WDR 3 - einfach glücklich!" beginnt eine musikalische Spurensuche nach den Klängen des Glücks. Bernstein eröffnet mit Hochspannung und Temperament, Fauré schenkt elegante Leichtigkeit, Bach lässt zwei Violinen im besten Einvernehmen miteinander glänzen. Dazwischen funkeln Saint-Saëns' Harfenklänge, Holsts feinsinnige Streicherfarben und Elgars unverwüstliches Salut d'amour. Die Wiederentdeckung von Luise Adolpha Le Beau sorgt für einen besonderen Glücksmoment, während das legendäre Miss Marple Theme ein Lächeln ins Programm schmuggelt. <br/>Mal mitreißend, mal innig, mal überraschend: Diese Lieblingsstücke lassen Glück höchst unterschiedlich klingen und vielleicht ist genau Ihr persönlicher Glücksmoment dabei.
    <strong>Die Musikstücke der Sendung</strong>
    <strong>Leonard Bernstein</strong><br/>Ouvertüre<br/>aus: Candide<br/>Royal Philharmonic Orchestra<br/>Leitung: Christian Lindberg<br/>(04'13'')
    <strong>Gabriel Fauré</strong><br/>Masques et Bergamasques op. 112<br/>Orchestre de Chambre de Lausanne<br/>Leitung: Renaud Capuçon<br/>(13'25'')
    <strong>Luise Adolpha Le Beau</strong><br/>Sonate D-Dur op. 17<br/>Raphaela Gromes, Violoncello<br/>Julian Riem, Klavier<br/>(15'32'')
    <strong>Camille Saint-Saëns</strong><br/>Konzertstück G-Dur op. 154<br/>Morceau de concert<br/>Emmanuel Ceysson, Harfe<br/>Orchestre Régional Avignon Provence<br/>Leitung: Samuel Jean<br/>(12'54'')
    <strong>Johann Sebastian Bach</strong><br/>Konzert d-Moll BWV 1043<br/>Amandine Beyer, Violine<br/>Alba Roca, Violine<br/>Gli Incogniti<br/>Leitung: Amandine Beyer<br/>(13'14'')
    <strong>Gustav Holst</strong><br/>St Paul's Suite op. 29 Nr. 2, H 118<br/>English Sinfonia<br/>Leitung: Howard Griffiths<br/>(12'18'')
    <strong>Ron Goodwin</strong><br/>Miss Marple Theme<br/>Orchester Ron Goodwin<br/>Leitung: Ron Goodwin<br/>(02'01'')
    <strong>Joachim Ringelnatz</strong><br/>Morgenwonne<br/>(0'38'')
