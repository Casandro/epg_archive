  stop: 2026-10-04T21:00:00Z
  title: WDR 3 Konzert
  description: |-
    Stefan Németh, Bernhard Breuer und Steven Hess brachten im Lokal Harmonie das Konzept des aktuellen INNODE-Albums "grain" auf die Bühne: Auf unregelmäßige rhythmische Strukturen von Schlagzeug oder Synthesizer schichten sich nach und nach weitere Sound-, Flächen- und Rhythmuselemente. Ihre Tracks wirken bratzig und ungeschliffen - bei gleichzeitiger Wärme. Und sind eben dadurch unfassbar greifbar.
    Aufnahmen vom Festival Blaues Rauschen 2026 aus dem Lokal Harmonie in Duisburg, dem ADA im Essener Grillo Theater und dem Domicil in Dortmund.
    Moderation: Ilka Geyer<br/>Redaktion: Markus Heuger
  subtitle: 'Finetuning im Ohrgebiet: Blaues Rauschen 2026'
