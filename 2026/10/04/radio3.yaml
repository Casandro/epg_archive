  title: Lebenswelten
  description: "Auf den Spuren von Franz von Assisi\nRevoluzzer, Einsiedler, Liebhaber des Friedens\nEine Sendung von Elisabeth Möst und Tilmann Kleinjung\n \nAuch 800 Jahre nach seinem Tod ist Franz von Assisi eine der prägendsten Figuren der Geschichte. Er hat mit seiner Lebenswende die Kirche seiner Zeit komplett umgekrempelt - lebte Armut, propagierte eine Beziehung zur Schöpfung, entwickelte eine Seelsorge an den Rändern der Gesellschaft und kam Gott in der Einsamkeit nah. Er war Revoluzzer und Visionär - und wollte dabei möglichst so leben, wie Jesus es seinen Jüngern vorgelebt hatte. Seine Biografie ist filmreif: vom reichen Kaufmannssohn und erfolgreichen Lebemann zum Aussteiger und radikalen Erneuerer. Wie lassen sich Menschen heute noch von Franz von Assisi inspirieren?"
