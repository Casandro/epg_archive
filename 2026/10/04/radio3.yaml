  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: "Ane Brun \n\nEine norwegische Liedermacherin, die zunächst in Barcelona und San Sebastian als Straßenmusikerin unterwegs war und im Laufe ihrer Karriere aber auch für die schwedische Königsfamilie aufgetreten ist. Sie hat einen sehr eigenen Stil, der zuweilen zerbrechlich wirkt, es aber nicht ist. Das Spannungsfeld dieser Zartheit und der gleichzeitigen Energie, die sie versprüht, macht ihre Musik besonders.\n\nModeration: Susanne Papawassiliu"
