  title: Wall, Bunker, Green Belt
  subtitle: The New Culture of Remembrance
  description: "So it's no wonder that almost everywhere along the 1,300-kilometer border between the Baltic Sea and the Vogtland region, people were eager to see this mark of division disappear.\nThe German state of Saxony-Anhalt was no exception. Between Altmark and Oberharz, border posts and metal fences, watchtowers and even the paths patrolled by the border guards disappeared. People on both sides of the dividing line resumed old relationships, or built new ties. \nNature was allowed to reclaim the border area. It became the \"Green Belt\", a unique natural area established on December 9, 1989. This natural paradise is also a place of remembrance.\nNow, something new is taking place along this \"Green Belt.\" The border, which people once wanted to forget, is coming into focus once again. People in the villages along the former inner-German border now consider the old barrier to be part of their local history. This is especially true of the generation born around the time that the Wall fell.\nOn a journey through the former border area, the film introduces viewers to people who want to remember, and the projects they are undertaking to achieve this. Where does this new interest in the old border come from?"
  widescreen: true
