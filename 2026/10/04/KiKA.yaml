    Lotus & das Drachenschlaflied

    Ein Feuerdrache landet in Tashis Dorf und bedroht die Bewohner. Lotus findet heraus, dass er Zahnweh hat. Zu ihrem eigenen Besten, müssen sie dem Drachen so schnell wie möglich helfen. Doch nur Drachenzahn ist hart genug, um einen Drachenzahn zu füllen. Und gemahlenen Drachen-zahn findet man nur beim Riesen Goli. In ihrer Eile haben Tashi und Jack aber keine Zeit zu kontrollieren, ob sie tatsächlich Drachenzahn gestohlen haben.
