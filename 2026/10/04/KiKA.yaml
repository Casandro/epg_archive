    Energie - Im Bann der Wundermaschine

    Fritz hat ein Energie-Problem: Kein Wind, keine Sonne, kein Strom. Da erzählt Freundin Marla von einer Wundermaschine. Sie soll von ganz allein Energie erzeugen. Funktioniert das?

    Gemeinsam mit Physikerin Emmy tüftelt Fritz an der Idee vom "Perpetuum Mobile": Einer Maschine, die, einmal in Bewegung gesetzt, ewig läuft - ganz ohne Zutun. Doch bald verlieren Fritz und Emmy sich in ihrem Werkel-Wahn. Nur Marla und Keks behalten den Überblick.
