  description: |-
    Superkräfte der Sonne

    Fast 150 Millionen Kilometer entfernt, entfalten ihre Strahlen trotzdem noch eine enorme Wirkung auf die Erde. Die Sonne ist der Stern, um den sich heute in der Sendung alles dreht.

    Reporterkind Alex besucht das Planetarium in Mannheim und lässt sich von Dr. Mathias Jäger erklären, warum die Forschungssonde "Parker Solar" trotz unvorstellbarer Hitze in die Sonnen-Atmosphäre hineinfliegen kann. Ob das auch die Rateteams wissen?

    Zu Gast im Studio ist Solarexperte Rolf Behringer. Er zeigt nicht nur ungewöhnliche Anwendungen mit Solarenergie, er erklärt auch, wie man die Energie der Sonne gut nutzen kann. Stonehenge ist den meisten ein Begriff. Doch was hat die Anordnung riesiger Steinquader mit der Sonne zu tun? Und was passiert eigentlich, wenn sich Sonnenblumen nach der Sonne ausrichten? Fragen über Fragen!

    Die Rateteams kommen heute aus Poing/Deutschland, Pressbaum/Österreich und Fontainebleau/Frankreich.

    Die Quizshow für die ganze Familie. "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder. Bei "1, 2 oder 3" können die Fans zu Hause über HbbTV live mitspielen, und bereits ausgestrahlte Sendungen lassen sich auch online über 12oder3.de oder die ZDFtivi-App beim Videoquiz nachspielen. Wer noch nicht genug hat, kann im Zockerquiz quizzen ohne Ende. Für Vorschulkinder gibt es auf zdftivi.de und in der ZDFtivi-App das Angebot "Moin Piet - Quiz mit Quatsch".
    Darsteller:
    Moderation - Elton
    Regie: Andreas Heller, Dirk Nabersberg
    Musik: Stefan Raab
    HD-Produktion
