  description: |-
    Jugendfilm, Deutschland / Österreich 2022
    Franz Fröstl ist neun Jahre alt, geht in Wien in die Schule und hat es nicht leicht. Erstens ist er kleiner als die anderen Kinder, zweitens halten ihn manche für ein Mädchen und drittens wird seine Stimme immer ganz piepsig, wenn er nervös ist. Zu den Coolen von der Schule gehört er so definitiv nicht. Das muss man auch gar nicht, sagen Mama und Papa. Aber haben Eltern eine Ahnung, wie es ist, gehänselt zu werden, wenn einem vor dem strengen Lehrer Zickzack die Stimme versagt? Immerhin: Gegen die strenge Nachbarin Frau Berger stehen sie geschlossen hinter ihm. Aber manchmal muss man sich eben auch selbst zu helfen wissen. Als Franz im Internet den Influencer Hank Haberer mit seinen Regeln für einen echten Mann entdeckt, glaubt er, endlich einen Ausweg aus seinem Dilemma gefunden zu haben. Da den Franz niemand ernst nimmt, will er eben lernen, wie man ein richtiger Kerl wird. ...
