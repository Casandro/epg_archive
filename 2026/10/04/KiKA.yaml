  description: |-
    Mein Schicksal - die Berliner Mauer

    Kaum zu glauben, aber mitten in Deutschland gab es mal eine Mauer. Sie teilte unser Land in zwei Teile, in zwei Deutschlands! Warum? "PUR+"-Moderator Eric Mayer findet es heraus.

    Eric geht auf Zeitreise. Für den Kinofilm "Zwischen uns die Mauer", der auf einer wahren Geschichte beruht, schlüpft er in die Rolle eines DDR-Grenzers. Bei den Dreharbeiten erlebt er, wie die Mauer das Paar Anna und Philipp trennt. Überlebt ihre Liebe?

    Was war in der einen Hälfte Deutschlands, der DDR, anders als in der anderen Hälfte, der BRD? Wie war das Leben der Menschen in der DDR? Was war die Rolle der Grenzbeamten? Dass in den Jahren der deutschen Teilung über 300 Menschen bei der Flucht aus der DDR ums Leben kamen, zeigt, mit welch brutalen Mitteln die deutsche Teilung aufrecht erhalten wurde.
