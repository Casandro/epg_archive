    Für Lenni (18) steht fest: Er will nicht zur Bundeswehr und setzt sich gegen eine Wehrpflicht ein. Für ihn geht es dabei vor allem um Selbstbestimmung und die Frage, wie stark der Staat in die Zukunft junger Menschen eingreifen darf. Gleichzeitig haben Freunde von Lenni einen anderen Weg gewählt und sind zur Bundeswehr gegangen.

    Im Reportageformat "POV - Deine Geschichte zählt" trifft Valentin Lenni und seine Freunde in Hamburg. Gemeinsam sprechen sie über Wehrdienst, persönliche Freiheit und gesellschaftliche Verantwortung. Dabei wird deutlich, wie unterschiedlich junge Menschen auf die Bundeswehr blicken - und wie Freundschaften mit gegensätzlichen Haltungen umgehen können.
