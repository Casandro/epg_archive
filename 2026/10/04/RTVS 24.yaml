  description: e tri minerály... Najviac vojnových cintorínov z prvej svetovej vojny je na severovýchode Slovenska. Navštívime dva z nich - v Stropkove a Veľkrope. Nesú v sebe odkaz, že tak, ako sa my staráme o vojakov cudzích národností, ktorí padli na našom území, tak niekto v zahraničí sa zasa stará o 70 tisíc našich chlapov, ktorí sa z vojny nevrátili... V lapášskych vinohradoch vďaka rezbárovi Petrovi Šrankovi odbíja poludnie unikátny vinohradnícky orloj a tak sa z takmerete Kysihýbeľ pri Banskej Štiavnici. (2026)
