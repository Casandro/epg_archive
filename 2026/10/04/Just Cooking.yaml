  title: Mein wunderbarer Kochsalon - Kohlrabi-Risotto mit gebeizter Lachsforelle, Ingwer und Mangold
  subtitle: Mein wunderbarer Kochsalon - Kohlrabi-Risotto mit gebeizter Lachsforelle, Ingwer und Mangold
  description: Immer, wenn jemand bei Gordon Ramsay's Master Chef ein Risotto kocht, tauchen diese kleinen Teufelshörner auf seinem Vorderkopf auf und er lächelt diabolisch. Man kann über ihn sagen, was man will, aber er kennt sich aus und und somit weiß er auch, dass beim Risotto der Hund im Detail sitzt. Auf den ersten Blick ist es einfaches Gericht - ein bisschen Zwiebel, Wein, Reis, Fond und etwas Parmesan zum Drüberstreuen und schon hat man sein Risotto. Stimmt nicht ganz, die Zutaten sind wirklich simpel, die Zubereitung nicht so ganz. Man braucht vor allem den richtigen Reis, einen kräftigen Fond und Zeit. Weitere Details erklärt uns Leo Doppler, seines Zeichens Risotto-Afficionado, aus dem Restaurant Hansen (1010 Wien). AT 2020
