  subtitle: Mein wunderbarer Kochsalon - Röstgemüse mit Salsa Verde
  description: Der Grill lief bei uns bisher quasi in Endlosschleife und auch, wenn ich mittlerweile einige vegetarische Alternativen im Repertoire habe, ist alles, was vom Rost kommt, doch eher fleischlastig. Ergo sind wir momentan verstärkt in Gemüsestimmung. Ich habe mir ein besonders schnelles und einfaches Gemüsegericht im Airfryer überlegt - kurze Zubereitungszeit, unkompliziert und während das Gemüse röstet, mache ich ein Pesto und räume die Küche auf. Der Reiz dieses Gerichts liegt im Einfachen, obwohl es viele Spielarten zulässt - mit Bratkartoffeln, Reis oder über Pasta, alles ist möglich. Ich esse es diesmal pur mit Basilikumpesto und gerösteten Haselnüssen. AT 2020
