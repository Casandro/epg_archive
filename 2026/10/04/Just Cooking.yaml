  title: Die besten Köche der Welt - Zu Gast im Ikarus - Joachim Wissler
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Joachim Wissler
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein besucht Joachim Wissler, den offiziell besten Koch Deutschlands in fürstlichem Ambiente! Dessen Drei-Sterne-Restaurant Vendome befindet sich auf Schloss Bensberg bei Köln, der passenden Bühne für Wisslers komplexe Luxusküche. Drei Sterne im Guide Michelin, mehrfache Wahl zum besten Koch Deutschlands und vier Hauben: Joachim Wissler gilt als einer der arriviertesten Spitzenköche Europas. In seinem Restaurant Vendome serviert er spektakuläre Gerichte, kreiert nur aus den besten Zutaten aus aller Welt. Aber auch ein Augenzwinkern erlaubt sich der gebürtige Schwabe mitunter, etwa wenn er seine legendäre Vorspeise ToffiVee kredenzt, eine Praline aus Gänseleber und Haselnuss, die optisch an eine beliebte Süßigkeit erinnert. Martin Klein wird die extrem aufwändigen Gerichte aus dem Vendome nach Salzburg holen. Er reist nach Bergisch-Gladbach, um gemeinsam mit Joachim Wissler ein Menü für das Ikarus im Salzburger Hangar-7 zu erarbeiten. AT 2019'
- eventId: 1387129
  start: 2026-10-04T14:25:00Z
  stop: 2026-10-04T14:50:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Olivier Nasti
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Olivier Nasti
  description: |-
    Die besten Köche der Welt - Zu Gast im Ikarus: Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein besucht den Sternekoch Olivier Nasti im Elsass. Nastis Kunst besteht darin, vertraute französische Gerichte und Zutaten so mutig zu veredeln, dass selbst kulinarisch versierte Landsleute wie Martin Klein überrascht sind! Das Elsass - mittelalterliche Städtchen, bester Wein und weltberühmte Küche. Im pittoresken Kaysersberg, einer Kleinstadt zwischen Weinbergen und Weiss-Tal, hat sich der 2-Sterne-Koch Olivier Nasti den Aromen der Region verschrieben. Vom Staub allzu großer Traditionsverbundenheit befreit, und mit mutigen Techniken und Kombinationen veredelt, bringt Nastis Küche das Elsass in zeitgemäßer Form auf den Teller. Für Martin Klein, den Executive Chef des Hangar-7 in Salzburg, ist die Studienreise nach Kaysersberg ein Heimspiel: er stammt selbst aus dem Elsass, und kennt Aromen und Zutaten seiner Heimat genau. Doch selbst der weitgereiste Ikarus-Chef gerät ins Staunen, wenn Olivier Nasti seine Interpretation von geräuchertem Rhein-Aal und Froschschenkeln in Riesling auftischt.
     AT 2019
