  title: Mein wunderbarer Kochsalon - Mango Frozen Joghurt
  subtitle: Mein wunderbarer Kochsalon - Mango Frozen Joghurt
  description: 'Vor dem Sommer reiße ich mich immer zusammen, lasse das Abendessen aus und quäle mich mit meiner Fitness-App in der Hoffnung auf ein akzeptables Bild im Badeanzug. Dann kommt der Sommer. Und täglich grüßt das BBQ, die warmen Rosmarin-Brote, der Sundowner und das Eis mit den Kindern am Nachmittag. Zurück zum Start, und jedes Jahr bin ich überrascht, wie zäh der Weg hin und wie schnell er wieder zurück geht. Wie auch immer: Es gibt kleine Kalorien-Schummeleien, eine davon liegt in diesem herrlichen Frozen Yoghurt verborgen. Statt fettes Eis am Stiel selbst gemachtes fruchtig-cremiges gefrorenes Joghurt. AT 2020'
