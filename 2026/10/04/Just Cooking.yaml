  title: Mein wunderbarer Kochsalon - Ferrero Rocher-Muffins
  subtitle: Mein wunderbarer Kochsalon - Ferrero Rocher-Muffins
  description: |-
    Britische Auswanderer brachten den Muffin nach Amerika, wobei die Briten eigentlich ein flaches Germteiggebäck damit meinten. In Amerika schuf man unter dem selben Namen einen kleinen runden Kuchen, der aus verschiedensten Zutaten besteht. Der einzig gemeinsame Nenner ist die Form im speziellen Muffinblech. Und dass man flüssiges Fett verwendet, also zerlassene Butter oder Öl. Oft wird Joghurt oder Buttermilch untergemischt, je höher der Anteil davon, desto mehr Natron sollte im Teig anstelle von Backpulver enthalten sein. Was mir auch nicht klar war: Natron ist nicht gleich Backpulver.

    Natron ist zwar ein Bestandteil von Backpulver, das enthält aber zusätzlich einen Säure- und Stärkeanteil. Gelangt die Mischung in Kontakt mit der Feuchtigkeit des Teiges, entstehen Gasbläschen, die das Gebäck locker werden lassen. In Rezepten mit Natron als alleinigem Triebmittel sind weitere, saure Zutaten nötig, damit dieser Effekt zustande kommt. Eben das Joghurt oder die Buttermilch. So, genug der Theorie. Hier unsere deklarierten Lieblingsmuffins. AT 2020
  ageRating: 6
