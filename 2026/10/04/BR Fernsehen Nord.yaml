  title: Siebenbürgen - Natur des Mittelalters
  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im Mittelalter kamen auch am Fuß der Karpaten erste Siedler an. Sie fällten den Urwald, schufen Kirchenburgen, Dörfer, Äcker. Viele wurden freie Bauern und nannten ihre neue Heimat Siebenbürgen. Sie drängten die Wildnis zurück - und die Natur wurde bunter und vielfältiger als je zuvor. Damals gab es solche Fülle fast überall in Europa. Aber heute finden wir sie nur noch in Rumänien.
