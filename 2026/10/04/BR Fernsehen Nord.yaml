  description: Nordic Walking wurde ursprünglich als Sommertraining für Skilangläufer entwickelt. Es ist das perfekte Ganzkörpertraining, da 90 Prozent aller Muskeln im Einsatz sind. Das Übungsprogramm ist in Zusammenarbeit mit dem Deutschen Skiverband aus dem Nordic-Walking-Sport heraus entwickelt worden. Die Übungen sind so aufgebaut, dass sie sowohl als eigenständiges Training durchgeführt, aber auch bestens zur Abwechslung ins Nordic-Walking-Training eingebaut werden können. Alle Übungen werden mit und ohne Stöcke demonstriert. Effektive Mitmach-Gymnastik, die Spaß macht.
