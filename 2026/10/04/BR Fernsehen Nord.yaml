  title: natur exclusiv
  subtitle: Südtirol - Das Land in der Mitte
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Imposante Gebirge, sonnenverwöhnte Hänge, smaragdgrüne Täler - Südtirols Landschaft ist ein Juwel der Alpen und prädestiniert, Naturliebhaber zu verzaubern. Diese Dokumentation enthüllt Geheimnisse und unterhält mit überraschenden Geschichten, die der renommierte Naturfilmer Rolando Menardi gekonnt in Szene zu setzen weiß. Südtirol, der Treffpunkt zweiter Welten, lädt ein zu einer abwechslungsreichen Reflexion über unser Verhältnis zur Natur.
