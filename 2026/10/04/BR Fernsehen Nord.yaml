  title: Gesundheit!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Soll ich mich sterilisieren lassen?
  description: |-
    Jascha und seine Frau Vanessa sind glücklich. Zusammen mit ihrer Tochter Joy leben sie in der Nähe von Nürnberg. Wie viele junge Eltern stellen auch sie sich die Frage: Soll Joy noch ein Geschwisterchen bekommen, oder ist die Familienplanung abgeschlossen? Das Paar hat sich viele Gedanken darüber gemacht und ist sich einig: Eigentlich ist ihre kleine Familie perfekt, so wie sie ist. Und damit sind die beiden beim Thema Verhütung.
    Der Film begleitet Jascha und seine Familie über Monate und ist in den wichtigsten Momenten seiner Entscheidungsfindung über eine mögliche Vasektomie dabei.
