  title: Hörspiel-Premiere | "Adlergestell" von Laura Laabs nach ihrem gleichnamigen Roman
  subtitle: Erwachsenwerden im Nachwende-Berlin | Mit Susanne Wolf, Hannah Ehrlichmann, Kathi Angerer u. v. m.
  description: Die Mauer ist gefallen. Chaline, Lenka und die Erzählerin wohnen am Stadtrand Berlins. Kaugummi mit extra saurem Brausekern auf der Zunge, abgerissener Mercedesstern um den Hals, die sechsspurige Ausfallstraße "Adlergestell" vor der Nase. Angeblich sind sie jetzt frei. Freier als ihre Mütter, die sich in den Wirren des Umbruchs verlieren. Freier als ihre Großmütter, die noch immer verfolgt werden von den Gespenstern der Vergangenheit. Die drei Mädchen wollen ihr Leben selbst in die Hand nehmen. Doch als sie merken, dass die neue Freiheit Grenzen hat, kommt es zum Knall.
