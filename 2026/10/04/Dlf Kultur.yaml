  title: Plus Eins
  description: |-
    Landlust und Lehmbau
    Eine Berlinerin erfindet sich neu

    Caro Korneli im Gespräch mit Britta Schwewe
     
    Medienunternehmerin Britta Schewe wünschte sich einen Ort, den sie ganz nach ihren eigenen Wünschen für sich gestalten kann. Sie erfüllte sich ihren Traum, kaufte ein altes Bahnwärterhaus und sanierte es. Das brauchte Zeit. Zwischen Abriss und Neugestaltung fand sie Erfüllung und ein neues Zuhause.

    Kuckuckskind Mirjana
    ?Dann hat der Mann gesagt: Ich bin dein Vater?

    Caro Korneli im Gespräch mit Astrid Probst
    (Wdh. v. 28.01.2024)

    Mirjana erlebt eine schwere Kindheit. Sie sehnt sich nach familiärem Halt. Mit 32 Jahren begegnet sie einem Fremden, der behauptet ihr Vater zu sein. Mirjana ist gleichzeitig schockiert und erleichtert.
