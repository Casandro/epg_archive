  title: Hörspiel
  description: "Tallhover (2/2)\nNach dem Roman von Hans Joachim Schädlich \nBearbeitung: Christoph Gahl \nRegie: Norbert Schaeffer \nMit: Werner Eichhorn, Lothar Blumhagen, Uta Hallant, Werner Rehm, Klaus Herm, Gert Haucke, Chajim Koenigshofen, Edith Hancke, Susanne Lüpertz, Gerd Wameling, Peter Fitz, Dirk Nawrocki, Eric Vaessen, Brigitte Mira, Fritz Eggert, Herbert Stass, Bernd Ludwig, Winfried Glatzeder \nTon und Technik: Hans Martin, Sabine Lindner \nRIAS Berlin 1989 \nLänge: 89?50\n\nIm zweiten Teil des Hörspiels verhandelt das imaginäre Gericht Tallhovers geheimdienstliche Tätigkeit im 20. Jahrhundert. Er durchlebt den Spartakusaufstand 1919 und die anschließende Verfolgung von Kommunisten ebenso wie die stalinistischen Schauprozesse, in denen er sein Ideal absoluter staatlicher Härte verwirklicht sieht."
