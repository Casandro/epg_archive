  description: "Musikfest Berlin \n\nKammermusiksaal der Philharmonie Berlin, Ausstellungsfoyer\nAufzeichnung vom 03.09.2026\n\nQuartett der Kritiker - zu Gast im Deutschlandfunk Kultur\n\nDas Werk eines Kranken?\nEine Diskussion über Robert Schumann und das Schicksal seines Violinkonzerts\n\nKai Luehrs-Kaiser, Freier Musikpublizist\nYvonne Petitpierre, Freie Musikpublizistin\nElisabeth Richter, Freie Musikpublizistin\nMichael Stegemann, Musikwissenschaftler\nModeration: Olaf Wilhelmer\n\nIn Zusammenarbeit mit dem Preis der deutschen Schallplattenkritik\n\nAcht Jahrzehnte wartete Schumanns Violinkonzert auf seine Uraufführung. Die Interpretation dieses Werkes ist von seiner Rezeptionsgeschichte nicht zu trennen.\n16:00-16:05 Nachrichten"
