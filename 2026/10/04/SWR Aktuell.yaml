- eventId: 800315
  start: 2026-10-04T04:00:00Z
  stop: 2026-10-04T07:00:00Z
  title: SWR Aktuell am Morgen
  description: "6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nZeitkapsel -  Folge 7\nEin Toter am Tunnel\nEine ganze Nacht lang schleusen Achim und die anderen Tunnelbauer Menschen von Ost nach West. Alles klappt perfekt. In der nächsten Nacht geht es weiter. Doch plötzlich tauchen zwei verdächtige Männer auf. Sind das wirklich Fluchtwillige oder Spitzel? Und dann fallen plötzlich Schüsse am Tunneleingang.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/\n\n7:00\nARD Interview der Woche ~\nJan Zimmermann im Gespräch mit Steffen Bilger (CDU), Bundesminister für Verkehr\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n7:30  \nWeltspiegel - Kann Netanjahu die Wahl in Israel velieren?\nAm 27. Oktober wählt Israel ein neues Parlament: Kann Premierminister Benjamin Netanjahu nach Jahren des Krieges, dem Terrorangriff der Hamas vom 7. Oktober und einer tiefen Spaltung des Landes tatsächlich abgewählt werden? Würde sich Israels Politik unter einer neuen Regierung grundlegend verändern? Und welche Rolle spielt die arabische Community in Israel und die Zukunft Gazas bei der Wahl? Darüber spricht Host Natalie Amiri mit ARD-Korrespondent Björn Dake in Tel Aviv und Ofer Waldman von der Heinrich-Böll-Stiftung in Israel in einer neuen Folge vom Weltspiegel Podcast.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
- eventId: 800341
  start: 2026-10-04T07:00:00Z
  stop: 2026-10-04T10:00:00Z
  title: SWR Aktuell am Vormittag
  description: "9:00  \nFREIHEIT DELUXE mit Jagoda Mariniæ\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - Zwischen Puls und Groove - Steve Reich zum 90.\nAls Mitte der 1960er Jahre einige Komponisten in den USA begannen, mit Tonbandschleifen, repetitiven Mustern und deren minimaler Verschiebung zu arbeiten, war schnell der passende Begriff dafür geboren: \"Minimal Music\". Dabei mag Steve Reich - neben Philip Glass der wichtigste Vertreter dieser Stilrichtung - den Begriff gar nicht. Seine Musik lebt von Patterns, die sich allmählich verändern, von rhythmischen Überlagerungen und einem Groove, der auch weit über die Neue Musik hinaus Wirkung entfaltet hat.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/ \n\n11:30\nREICH - Das Geschäft mit dem Zweifel\nDas Herz der Bestie (5/5)\nWir sind zurück in Halle, auf der Klimaskeptiker-Konferenz vom Anfang. Wir hören genau hin. Auf der Bühne: Marc Morano, eingeflogen aus Washington. \"It's over, we won\", sagt er uns später auch ins Mikrofon. Europa nennen seine Mitstreiter \"the heart of the beast\" - hier schlage das Herz des Klima-Irrglaubens, hier gebe es noch etwas zu holen. Wir fahren nach Coswig in Sachsen-Anhalt, wo Menschen gegen Windräder protestieren. Einer von 322 Vereinen in Deutschland. \nGemeinsam mit Kolleg*innen von Correctiv haben wir uns das Netzwerk dieser Vereine genauer angeschaut und analysiert, wie das Thema Windkraft in aktuellen Wahlkämpfen genutzt wird. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/reich-das-geschaeft-mit-dem-zweifel/urn:ard:show:f5091cc57904afb9/"
- eventId: 800371
  start: 2026-10-04T10:00:00Z
  stop: 2026-10-04T13:00:00Z
  title: SWR Aktuell am Mittag
  description: "12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nWie schlimm ist es wirklich?\nHitze, Stürme, Starkregen - wird wirklich alles schlimmer durch den Klimawandel, oder müssen wir differenzieren? Und wie können wir uns vor Extremwetter schützen? Auf dem Extremwetterkongress in Hamburg sprechen wir mit Organisator Frank Böttcher über Grundlagen des Klimawandels. Im Publikum saßen Schülerinnen und Schüler.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/\n\n13:00\nCamino - Religionen auf dem Weg\n800 Jahre Franziskus - Der Radikale aus Assisi\nVom reichen Kaufmannssohn zum radikalen Aussteiger: Franz von Assisi stellte mit seinem Leben die Kirche seiner Zeit auf den Kopf. Heute gilt er als eine der einflussreichsten Gestalten der Geschichte. An den Originalschauplätzen seines außergewöhnlichen Lebens zeigt sich, warum seine Botschaft so viele Menschen inspiriert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur  - Zum Tag der Deutschen Einheit: Was kommt vom Osten an?- Musik im gesamtdeutschen Popgedächtnis\nZum Tag der Deutschen Einheit 2026 fragt die Kultursendung: Welchen Platz hat Popmusik aus der DDR heute im gemeinsamen deutschen Musikgedächtnis? Welche Künstler und Songs sind geblieben - und wer entscheidet eigentlich darüber, was gehört und erinnert wird? Zu Wort kommen Menschen mit unterschiedlichen Ost- und West-Biografien. Die Musikerin Masha Qrella hat gemeinsam mit Schorsch Kamerun von der Hamburger Kult-Punk-Band Die Goldenen Zitronen aus einem Streitgespräch über ihre Erfahrungen ein Album entwickelt. Die Podcaster Marc Thomé und Lars Schmidt vergleichen, wie sie in den 80ern in der Bundesrepublik und der DDR Musik entdeckten. Und der Pophistoriker Tom Koltermann ordnet ein, welchen Platz DDR-Musik nach 1990 fand.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nJan Zimmermann im Gespräch mit Steffen Bilger (CDU), Bundesminister für Verkehr\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30\nZeitkapsel Folge 8\nDas Leben nach der Flucht\nMehr als 60 Jahre ist es jetzt her, dass Achim Menschen durch den Tunnel von Ost nach West geschleust hat. Lange Zeit hat er mit niemandem über seine Arbeit als Fluchthelfer gesprochen. Erst zehn Jahre nach der Wiedervereinigung wird sein Name bekannt. Und inzwischen ist es für Achim sehr wichtig, seine Geschichte zu erzählen, weil sie ein Teil der deutsch-deutschen Vergangenheit ist, der nicht vergessen werden darf.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/"
