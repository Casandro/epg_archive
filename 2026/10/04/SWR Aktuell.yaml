  description: "15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND\nGeschäfte mit Alpenblick (1/8)\nBacetto war ein kaltblütiger Krimineller, ein Mann, der der italienischen 'Ndrangheta zugerechnet wird. Er hat sich eine unauffällige Fassade aufgebaut: Als Pizzeria-Betreiber mit dem charmanten Spitznamen, der auch noch mit italienischen Lebensmitteln handelt und ganz bescheiden in einem kleinen Dorf lebt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: Trump bekämpft Europas Richter - Wie schützt die EU ihre Werte?\nDer Internationale Strafgerichtshof steht unter Beschuss von US-Präsident Trump: Er nennt Richter in Den Haag korrupt und lässt sie sanktionieren. Wie kann sich die EU wehren und demokratische Werte schützen? Mit Kathrin Schmid und Jean-Marie Magro.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - Kann Netanjahu die Wahl in Israel velieren?\nAm 27. Oktober wählt Israel ein neues Parlament: Kann Premierminister Benjamin Netanjahu nach Jahren des Krieges, dem Terrorangriff der Hamas vom 7. Oktober und einer tiefen Spaltung des Landes tatsächlich abgewählt werden? Würde sich Israels Politik unter einer neuen Regierung grundlegend verändern? Und welche Rolle spielt die arabische Community in Israel und die Zukunft Gazas bei der Wahl? Darüber spricht Host Natalie Amiri mit ARD-Korrespondent Björn Dake in Tel Aviv und Ofer Waldman von der Heinrich-Böll-Stiftung in Israel in einer neuen Folge vom Weltspiegel Podcast.\nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus - Gasspeicher - Panikmache oder echte Gefahr - wer profitiert?\n60 Prozent Füllstand, steigende Gaspreise: Wie sicher ist unsere Energieversorgung wirklich - und wer verdient an der Angst vorm Winter? Die Gasspeicher sind ungewöhnlich leer - und die Sorge vor Engpässen und steigenden Preisen wächst. Die Bundeswirtschaftsministerin Katherina Reiche (CDU) fängt an gegenzusteuern. Doch wie groß ist das tatsächliche Risiko für die Gasversorgung im kommenden Winter?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
