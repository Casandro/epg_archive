    Koch-Reality, USA 2023
    Altersfreigabe: ab 12
  description: |-
    Das "In the Drink" liegt direkt an einer beliebten Golfanlage in New Jersey, doch das kulinarische Angebot lässt zu wünschen übrig und dem Restaurant fehlt jegliches Flair. Gordon Ramsay muss sich mit dem beratungsresistenten Besitzer Jorge auseinandersetzen, um das Lokal wieder auf Kurs zu bringen. Wird die Wiedereröffnung im Country-Club-Stil mit einer neuen Speisekarte und einer veränderten Rollenverteilung gelingen?

