  title: In Teufels Küche mit Gordon Ramsay
  subtitle: |-
    Gastro-Therapeut Gordon
    Koch-Reality, USA 2023
    Altersfreigabe: ab 12
  description: |-
    Ein junges Paar hat ein Restaurant in einer Kleinstadt übernommen. Doch der gemeinsame Traum ist schnell zu einem Albtraum aus Stress und Streit geworden. Chefkoch Chris ist am Rande des Nervenzusammenbruchs und schreit seine Partnerin Tess nur noch an, während die beiden Schwiegermütter in spe mitarbeiten und mitleiden müssen. Gordon steht kopfschüttelnd vor dem Chaos und erkennt: Hier hilft nur eine Radikalkur - für die Beziehung, die Betriebsabläufe und das gesamte Restaurant.

