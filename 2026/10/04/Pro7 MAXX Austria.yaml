  title: In Teufels Küche mit Gordon Ramsay
  subtitle: |-
    Showdown mit dem Culinary Gangster
    Koch-Reality, USA 2023
    Altersfreigabe: ab 12
    (WH vom Sonntag, 27.09.2026, 10:35 Uhr)
  description: |-
    Das Bask46 in Woodland Park, New Jersey, hat erst vor sechs Monaten eröffnet, doch statt Gewinn einzufahren kostet das Restaurant seine Besitzer Steve und Sandi jeden Monat einen fünfstelligen Betrag. Steve bittet Gordon Ramsay um Hilfe, der schnell herausfindet, wo das Problem liegt: Chefkoch Bobby lässt sich fürstlich bezahlen und inszeniert sich gern als "Culinary Gangster", hat aber außer Fertig-Sauce und einer chaotischen Küche nicht viel auf dem Kasten.

    Gastgeber: Gordon Ramsay
    Regie: Paul Newton
    Komponist: Alex Shenkman
    Kamera: Michael Clevenger
    Schnitt: Chris Kirkpatrick
