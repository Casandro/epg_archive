  description: 'Legendär - Unsere Musikerinnen: Von Hildegard Knef bis Helene Fischer - 90 Minuten musikalische Extraklasse: Zusammen mit Ihnen lassen wir unsere legendären Musikerinnen und ihre Hits hochleben. Ohrwurm-Garantie inklusive.'
- eventId: 653005
  start: 2026-10-04T01:45:00Z
  stop: 2026-10-04T03:15:00Z
  title: Legendär! Unsere Helden der 70er - Eine Zeitreise mit Riccardo Simonetti
  subtitle: Ein Film von Melanie Didier
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Freizügig, wild, bunt - das sind die 70er! \nRiccardo Simonetti trifft einige Heldinnen und Helden der 70er, aber auch leidenschaftliche Fans dieses Jahrzehnts, und taucht tief ein in diese legendäre Zeit und findet heraus, weshalb wir die 70er immer noch so feiern.\n\nWo ginge das besser, als in Stockholm - im ABBA Museum - zusammen mit dem Kostümdesigner der legendären Band - Owe Sandström und der Vorsitzenden des ABBA Fanclubs - Regina Grafunder, feiert Riccardo ABBA und ihre unvergesslichen Hits und Outfits."
- eventId: 653028
