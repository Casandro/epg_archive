  title: Lecker an Bord - Ostfriesland von Emden nach Leer (1)
  subtitle: mit Björn Freitag und Frank Buchholz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die beliebte WDR-Reihe "Lecker an Bord" geht in die zehnte Staffel. Diesmal reisen die Spitzenköche Björn Freitag und Frank Buchholz in die nordwestlichste Ecke Deutschlands: nach Ostfriesland. Bei Matjesbrötchen und "Teetied", der traditionellen ostfriesischen Teezeremonie, erleben die beiden Kochfreunde eine ganz besondere Mischung aus ostfriesischer Gelassenheit, Entschleunigung und Gastfreundschaft.'
- eventId: 653029
  start: 2026-10-04T04:00:00Z
  stop: 2026-10-04T04:45:00Z
  title: Viel für wenig - Clever kochen mit Björn Freitag
  subtitle: 'Familie Führ: Schnelle Küche ohne Würztütchen'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Tüte auf und fertig: Familie Führ aus Köln greift beim Kochen gerne auf schnelle Würzhelfer zurück. Teenie-Tochter Lara liebt TK-Produkte aus der Heißluftfritteuse und Nesthäkchen Lea isst zu allem Pesto aus dem Glas - Gemüse verschmähen beide gleichermaßen. Das tägliche Kochen ist eine nervliche Zerreißprobe für Papa Herbert und Mama Sandra - doch Hilfe naht!'
