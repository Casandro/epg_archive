- eventId: 940043
  start: 2026-10-04T05:05:00Z
  stop: 2026-10-04T06:15:00Z
  title: Cartoons in Concert
  subtitle: Zeichentrickklassiker auf großer Bühne
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Filmmusik aus Zeichentrickklassikern: Christian Schumann dirigiert das Danish National Symphony Orchestra, begleitet von Chor und Big Band.

    Das Danish National Symphony Orchestra, der DR Concert Choir und die DR Big Band interpretieren unter der Leitung von Christian Schumann Musik aus bekannten Animationsfilmen. Das Programm vereint klassische Cartoon-Kompositionen mit moderner Filmmusik, von Carl Stalling bis Michael Giacchino. Der Konzertfilm von Karsten Andersen (2022) zeigt die stilistische Vielfalt und dramaturgische Kraft dieser Musik.
- eventId: 653061
  start: 2026-10-04T06:15:00Z
  stop: 2026-10-04T06:45:00Z
  title: Einfach und köstlich
  subtitle: 'Cordon-Bleu und Mangold-Knödel: Björn Freitag kocht mit Michaela Stöberl'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Zu Gast beim Dorstener Spitzenkoch Björn Freitag ist Wirtin, Bier- und Käse-Sommelière Michaela Stöberl aus Straubing in Niederbayern. Sie präsentiert ein Cordon Bleu mit Schwarzwälder Schinken, dreierlei Käse und Bierzwiebeln. Auch bei Björn wird es herzhaft: Zu Semmelknödeln gesellen sich Mangold und eine cremige Käsesoße.

    Als drittes Gericht kreieren die beiden eine bayrische Komposition - saftig, deftig lecker. In dieser Folge verbindet sich bayrische Gastronomie mit hochdeutscher Spitzenküche - mit Schmankerln, die sich sehen lassen können.
- eventId: 653062
  start: 2026-10-04T06:45:00Z
  stop: 2026-10-04T07:15:00Z
  title: Der Vorkoster
  subtitle: 'Aufbackbrötchen im Check: Fluffig, knusprig, lecker?'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ein Sonntagsfrühstück ohne frische Brötchen? Für viele undenkbar! In dieser neuen Folge der WDR-Sendung "Der Vorkoster" geht Sternekoch Björn Freitag den praktischen Aufbackbrötchen auf den Grund. Preislich liegen sie im Schnitt unter handwerklich gebackenen Brötchen. Aber können Aufbackbrötchen hier geschmacklich und qualitativ mithalten?
