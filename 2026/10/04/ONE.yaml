    Was passiert, wenn ein legendärer Rockstar aus dem Nichts auftaucht und das Leben einer Frau komplett auf den Kopf stellt? JULIET, NAKED ist die romantische Komödie, die beweist: Manchmal schreibt das Leben die besten Songs!

    Annie (Rose Byrne) steckt fest in einer Beziehung, die längst den Rhythmus verloren hat. Ihr Partner Duncan (Chris O'Dowd) ist besessen von Tucker Crowe (Ethan Hawke), einem Musiker, der vor 25 Jahren spurlos verschwand. Als Annie aus Frust einen bissigen Kommentar zu Crowes neuem Album postet, passiert das Undenkbare: Tucker Crowe meldet sich persönlich.
