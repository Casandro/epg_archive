  description: |-
    Anwältin Eva Schatz (ChrisTine Urspruch) bekommt es mit einer heiklen Familienangelegenheit zu tun: Der 17-jährige Fabian Scholz (Arthur Gropp) möchte seine Mutter Anke (Wolke Hegenbarth) verklagen. Er will die geschäftstüchtige Influencerin zwingen, peinliche Videos mit ihm aus ihrem "Mummy"-Channel zu löschen. Aber geht das nicht ohne juristische Schwerkaliber?

    Um den Familienfrieden zu retten, sucht Eva ein Gespräch mit der "Mumfluencerin". Doch der Schuss geht gewaltig nach hinten los: Während sich Anke zutiefst verletzt fühlt, plant der Teenager, zu Hause auszuziehen.
