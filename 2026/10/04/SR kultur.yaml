- eventId: 807361
  start: 2026-10-04T15:04:00Z
  stop: 2026-10-04T16:02:00Z
  title: 'Hörspielzeit: Die verbotene Welt'
  subtitle: von Frank Naumann  (SR/RBB 2012)
  description: "\"Ich war 1,68, der zweitkleinste der Klasse. Und in Sport der zweitletzte. Ich besaß als einziger kein Moped und bekam Klavierunterricht. Von meiner Mutter.\" Nicht die besten Voraussetzungen für den Mitte der Siebziger Jahre in einer DDR-Kleinstadt aufwachsenden René, der eigentlich nur das will, was alle Jungs seines Alters wollen: eine Freundin. Um den Mädchen besser zu gefallen, erlernt René autodidaktisch Französisch, die Sprache der Liebe - und \"die Sprache eines imperialistischen Kapitalistengebildes\".  \nFrank Naumann erzählt in \"Die verbotene Welt\" lakonisch und mit situationskomischer Leichtigkeit die Geschichte von René, der wider allen sozialistischen Argwohn Französisch lernt, um sein Glück und seine Freiheit zu finden."
