  title: 'Winnetou: Skarb w Srebrnym Jeziorze'
  subtitle: Wódz Apaczów Winnetou i jego biały druh Old Shatterhand wędrują przez prerię w poszukiwaniu Srebrnego Jeziora. Ich tropem podąża banda Brinkleya.
  description: |-
    Tytuł oryginalny: Der Schatz im Silbersee
    DE,FR,YU, 1962
    Reżyseria: Harald Reinl
    Występują: Pierre Brice, Lex Barker, Herbert Lom, Götz George, Karin Dor, Eddi Arent
    Cornel, przywódca bandy rewolwerowców, zabija farmera Engela, żeby zdobyć mapę, która doprowadzi go do Srebrnego Jeziora, gdzie na jednej z wysp ukryto indiański skarb. Gdy na miejsce zbrodni przybywają Winnetou i Old Shatterhand, postanawiają pomóc synowi zamordowanego, Fredowi, w odnalezieniu zbrodniarza. Okazuje się jednak, że Cornel zdobył na razie tylko połowę planu. Drugą ma przyjaciel zamordowanego Engela, Patterson. Patterson i jego córka Ellen wpadają w ręce Cornela.
  ageRating: 12
  genre:
  - '18'
- eventId: 1268816
  start: 2026-10-04T09:40:00Z
  stop: 2026-10-04T11:45:00Z
  title: 'Winnetou: Złoto Apaczów'
  subtitle: Geometra Old Shatterhand ma zmierzyć tereny należące do Apaczów. Wpada w kłopoty, gdy ci rozbijają bandę rabusiów. Ma zginąć razem z nimi. Z opresji ratuje go siostra Winnetou. Ten poddaje go próbie.
  description: |-
    Tytuł oryginalny: Winnetou
    DE,IT,YU, 1963
    Reżyseria: Harald Reinl
    Występują: Pierre Brice, Lex Barker, Marie Versini, Walter Barnes, Chris Howland, Ralf Wolter
    Santer przekonuje kierownika budowy kolei do poprowadzenia toru przez ziemie łowieckie Apaczów. Inwestycja ma przynieść duże zyski. Niemiecki geometra, Old Shatterhand, usiłuje udaremnić te plany. Podejmuje pertraktacje z Winnetou, synem wodza Apaczów. Narady zostają przerwane przez wtargnięcie Santera, który morduje wodza. Porywa też Winnetou i oddaje go w ręce Indian Kajoa, którzy prowadzą wojnę z Apaczami. Shatterhandowi udaje się oswobodzić więźnia.
  ageRating: 12
  genre:
  - '18'
- eventId: 1268817
  start: 2026-10-04T11:45:00Z
  stop: 2026-10-04T13:55:00Z
  title: 'Doc West: zemsta rewolwerowca'
  subtitle: Legendarny rewolwerowiec rusza tropem bandytów, którzy ukradli jego pokerową wygraną. Po awanturze trafia do aresztu, gdzie ujawniają się ślady jego mrocznej przeszłości.
  description: |-
    Tytuł oryginalny: Doc West
    IT,US, 2009
    Reżyseria: Terence Hill
    Występują: Terence Hill, Paul Sorvino, Boots Southerland, Clare Carey, Benjamin Petry, Adam Taylor
    Legendarny rewolwerowiec rusza w pościg za bandytami, którzy ukradli jego wygraną z pokera. W wyniku awantury trafia do aresztu, gdzie na jaw wychodzi jego mroczna przeszłość. Gdy w mieście wybucha krwawa wojna, Doc West musi zdecydować, czy stanie po stronie prawa. Obsada: Terence Hill, Clare Carey, Alessio Di Clemente
  ageRating: 16
  genre:
