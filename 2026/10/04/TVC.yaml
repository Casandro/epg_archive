  title: Złapać przemytnika 2 (odc. 7)
  subtitle: Celnicy z Miami znajdują cztery kilogramy kokainy ukrytej w dwóch ciastach. Trop prowadzi do Atlanty, gdzie udaje się rozbić sieć przemytników.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    W Miami celnicy znajdują cztery kilogramy kokainy ukrytej w dwóch ciastach. Agenci HSI kontynuują śledztwo w Atlancie i rozbijają zorganizowaną sieć przemytników. Podczas kontroli przesyłek tranzytowych dwie z nich budzą wątpliwości celników. W bębnie oraz części do jakiejś maszyny prawdopodobnie ukryto narkotyki. Nowojorscy celnicy rozpracowują sprawę nielegalnego wwozu do kraju brudnych pieniędzy. Na celowniku są osoby podejrzanie często wyjeżdżające za granicę.
  ageRating: 12
  genre:
  - '35'
- eventId: 1268908
  start: 2026-10-04T14:55:00Z
  stop: 2026-10-04T15:55:00Z
  title: Złapać przemytnika 2 (odc. 3)
  subtitle: Miami szykuje się do sportowego święta, jakim jest Super Bowl. Dla służb to czas walki z przemytem narkotyków, prostytucją i handlem podróbkami.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Wybuch pandemii nie tylko nie ukrócił działalności przemytników, ale wpłynął na zwiększenie napływu narkotyków do USA. Departament Bezpieczeństwa Wewnętrznego musi dostosować się do nowej rzeczywistości i zwiększyć kontrolę zarówno na naziemnych przejściach granicznych, jak i na lotniskach oraz w portach. Czujni funkcjonariusze są w stanie najwyższej gotowości, żeby powstrzymać napływ nielegalnych towarów i substancji.
  ageRating: 12
  genre:
  - '35'
- eventId: 1268990
  start: 2026-10-04T15:55:00Z
  stop: 2026-10-04T16:55:00Z
  title: Złapać przemytnika 2 (odc. 6)
  subtitle: Agenci konfiskują 21 kg metamfetaminy i rozbijają międzynarodową siatkę narkotykową. Z kolei celnicy przechwytują wielki ładunek rekinich płetw.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: Tom Mulhall
    Policja celna z Atlanty krzyżuje plany międzynarodowej siatki narkotykowej przemycającej metamfetaminę, aresztując licznych podejrzanych i przechwytując 2 pistolety, 67 000 $ w gotówce i 21 kilogramów metamfetaminy. Celnicy z Miami przechwytują jeden z największych ładunków nielegalnych płetw rekinów w historii lotniska - ponad 600 kilogramów płetw rekinów wartych prawie milion dolarów. W Nowym Jorku agenci zatrzymują kobietę przemycającą około kilograma kokainy w podszewce torebki.
  ageRating: 12
  genre:
  - '35'
- eventId: 1268991
  start: 2026-10-04T16:55:00Z
  stop: 2026-10-04T18:00:00Z
  title: Złapać przemytnika 2 (odc. 8)
  subtitle: Agenci zatrzymują osobę podejrzaną o handel bronią i kontakty z organizacją przestępczą. Tymczasem celnicy szukają narkotyków ukrytych w płynach.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Każdego roku 124 miliony ludzi przybywają do Stanów Zjednoczonych przez lotniska. To niekończąca się fala ludzi, pośród których ukrywają się przemytnicy ze swoją gigantyczną kontrabandą i złymi intencjami. Granic bronią czujni mężczyźni i kobiety Departamentu Bezpieczeństwa Krajowego, którego agencje tworzą trzypoziomową ochronę amerykańskich lotnisk. Departament Bezpieczeństwa zrobi wszystko, by złapać przemytnika.
  ageRating: 12
  genre:
  - '35'
