  title: Pochoutkový rok
  description: Dnes vás čeká začátek hlasování pro recept desetiletí, ale ještě před tím nám ten poslední soutěžní recept připomene a upeče šéfkuchař Roman Paulus. Půjde o kynuté rohlíčky máčené v másle. Pak začne boj o ceny v podobě poukázek na nákup kuchyňského vybavení.
- eventId: 1432113
  start: 2026-10-04T02:00:00Z
  stop: 2026-10-04T02:30:00Z
  title: Utajené poklady regionů
  description: Kačina a Kutná Hora - Kutná Hora je známá jako město stříbra a památka UNESCO. Nedaleko ní stojí zámek Kačina, jeden z nejvýznamnějších empírových areálů u nás. Jak se jeho historie promítla do života lidí i okolní krajiny? Zjišťovala Markéta Ševčíková.
- eventId: 1432114
  start: 2026-10-04T02:30:00Z
