  title: Hra na neděli
  description: 'Václav Havel: Žebrácká opera. Komedie o světě, který funguje na principu naprosté bezzásadovosti. Rozhlasová úprava a dramaturgie Renata Venclová. Hudba Matěj Kroupa. Režie Lukáš Hlavica. Účinkují: Jiří Dvořák, Viktor Preiss, Taťjana Medvecká, Klára Sedláčková-Oltová, Tomáš Töpfer, Jitka Smutná, Tereza Dočkalová, Jaromír Dulava, Jana Preissová, Magdaléna Borová, Dana Černá, Lada Jelínková, Lucie Polišenská, Zdeněk Velen, Jiří Suchý a Lubor Šplíchal. Natočeno v roce 2019 (104 minut). Repríza.'
