  title: Výjimeční
  description: Kristina Höschlová - Hudba, výtvarné umění, urgentní a také komplementární medicína - to vše neodmyslitelně patří do života lékařky Kristiny Höschlové. Jako záchranářka roky působila v ČR i v zahraničí, s Lékaři bez hranic vyjela jako anestezioložka do Afghanistánu a Jemenu. V posledních letech se věnuje především Institutu komplementární medicíny, který založila. Je také autorkou několika knih. Proč je podle ní důležité trávit čas v přírodě a jak v sobě pěstuje hravost? Nejen to se dozvíte v následujících minutách. Autorka - Kateřina Kubalová.
- eventId: 1434210
  start: 2026-10-04T16:30:00Z
  stop: 2026-10-04T17:00:00Z
  title: Historie českého zločinu
  description: 'Díl 13. Záhadný otisk. Porovnání otisků prstů se stalo důležitou kriminalistickou metodou až ve 20.letech minulého století. Záhadný otisk, který se 18. října roku 1925 objevil na místě činu ve Smolnici na Lounsku vedle vykradené pokladny však způsobil, že se věrohodnost daktyloskopie otřásla v základech. Autor: Bronislava Janečková. Repríza.'
- eventId: 1434211
  start: 2026-10-04T17:00:00Z
  stop: 2026-10-04T17:50:00Z
  title: Muzikál expres
  description: Muzikál expres pozve na premiéru muzikálu Obyčejná holka do Divadla Lucie Bílé v Praze a na nové nastudování muzikálu Rent do Londýna. Připomene 20. výročí světové premiéry krimi-muzikálu Rebecca a ve druhé části pogratuluje k životnímu jubileu Monice Absolonové. Samozřejmě zazní nejznámější melodie z inscenací, ve kterých bylo možné ji spatřit. Více tedy v neděli 4. října v sedm večer nebo při repríze v pátek 9. října od 21. hodiny na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
