  description: Angst bestimmt das Leben von Leonie Kaiser. Seit Monaten ist sie im Visier eines perversen Unbekannten. Die Attacken werden immer schlimmer - doch der Stalker hinterlässt keine brauchbaren Spuren. Isabella Schulien macht sich für das hilflose Opfer auf die Jagd nach dem kranken Verfolger.
