  description: 'Die Nachricht trifft Sophie Brückner wie ein Schlag: Ihr Mann Gabriel, der als Hotelmanager auf Mallorca arbeitete, ist bei einem Autounfall ums Leben gekommen. Um den Leichnam zu identifizieren, reist sie auf die Ferieninsel. Dort erfährt sie, dass ihr Mann nicht allein im Wagen saß - er war in Begleitung einer Frau. Sophie lernt Michael Gernold kennen, den Ehemann der Toten. Hin- und hergerissen zwischen dem Bedürfnis nach einer letzten Gewissheit und der Angst vor Verletzung, beginnen sie zu recherchieren - und decken das Doppelleben ihrer beider Partner auf.'
