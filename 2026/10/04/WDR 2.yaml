- eventId: 807294
  start: 2026-10-04T10:00:00Z
  stop: 2026-10-04T12:00:00Z
  title: WDR 2 Jörg Thadeusz
  description: "Hubertus Heil, ehemaliger Bundesminister für Arbeit und Soziales (SPD)\n16,4 Prozent bei der letzten Bundestagswahl 2025, einstellig bei den diesjährigen Landtagswahlen in Sachsen-Anhalt (9,2%) und BadenWürttemberg (5,5%). Die SPD befindet sich in einer Krise und wird schon längst nicht mehr als die große Volkspartei wahrgenommen, die sie einst war. Auch wenn Manuela Schwesig in Mecklenburg-Vorpommern noch als Hoffnungsschimmer gilt. \nDer ehemalige SPD-Bundesminister für Arbeit und Soziales, Hubertus Heil, ist seit seinem 15. Lebensjahr überzeugter Sozialdemokrat und möchte nicht nur seine Partei wieder auf Kurs bringen, sondern auch die politischen und gesellschaftlichen Probleme insgesamt angehen. Dafür hat er in der vergangenen Woche ein neues Buch veröffentlicht: \"Der Angriff der Autokraten - Die Verteidigung der Demokratie gegen innere und äußere Gegner\". Heil, der nicht nur SPD-Generalsekretär, sondern auch stellvertretender Parteichef war, plädiert darin u.a. für ein solidarisches Leistungsprinzip und einen langfristig angelegten Kompass für Deutschland bis 2050. Damit soll die Demokratie gestärkt und das Vertrauen der Bürger in die Politik zurückgewonnen werden. \nHubertus Heil, der in seiner Zeit als Bundesarbeitsminister die Grundrente und das Bürgergeld einführte, sitzt heute als SPD-Bundestagsabgeordneter im Auswärtigen Ausschuss und ist Religionsbeauftragter seiner Fraktion. Auf WDR 2 spricht Jörg Thadeusz mit ihm über seine Zukunftsvisionen, das neue geplante SPD-Grundsatzprogramm und darüber, was er besser könnte als die derzeitigen SPD-Chefs Bärbel Bas und Lars Klingbeil.\nDarin:<br/>zur vollen Stunde WDR aktuell"
  subtitle: 'Moderation: Jörg Thadeusz'
