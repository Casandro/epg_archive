  description: "arocco con il gusto neoclassico, Piranesi inventò anche carceri oscure e inquietanti, piene di anfratti e strumenti di tortura, cappi, levatoi e ruote dentate. Oltre a raccontare la vita del grande artista, grazie ad alcune appropriate rielaborazione grafiche, restituiremo al pubblico le inquietudini delle sue opere e ne approfondiremo i segreti. - Un programma di Massimiliano Griner e Davide Savelli Regia di Fedora Sasso Alessandro Nucci \nProduttore Esecutivo Sara Mariani \nA cura di Arianna Ciulla"
