  description: "ntali. Dai primi soggiorni romani del Santo di Assisi fino all'opera di accoglienza portata avanti ancora oggi dal Convento di San Francesco a Ripa, lo speciale mostra come il messaggio di Francesco continui a ispirare percorsi di fraternità e di rinascita. - \n\nAutore Emanuele Colarossi regia Antonio Carbone produttore esecutivo Valentina Tassini"
