  description: |-
    quasi 20 milioni di libri. Per la chiesa Cattolica e per gli stati di antico regime, si pone il problema di controllare la circolazione di una massa ingente di idee e cultura. Nel 1559 Papa Paolo IV introduce il primo Indice dei libri proibiti con il quale si vieta la stampa, la diffusione o la semplice detezione di libri considerati immorali o non corretti sul piano teologico e morale. E' il primo atto di una lungo scontro che vedrà la chiesa prima, e le autorità statali poi, cercare di arginare la libera circolazione del pensiero. In studio, con Paolo Mieli, il prof. Giorgio Caravale. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

