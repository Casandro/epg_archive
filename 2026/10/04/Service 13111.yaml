  title: Hoagascht
  subtitle: Scharfes Mühlviertel
  description: 'Alles begann mit einer einzigen, kleinen Chili-Pflanze. Sie ist ein Geschenk von Freunden, die das Leben von Ulrike und Christian völlig verändert hat. Die ersten Chilisoßen entstanden damals nur zum Spaß. Mittlerweile führen die beiden eine kleine, aber feine Chilisoßen Manufaktur, genannt: Mühlviertler FEUERzeug. Die Soßen selbst sind alle handgemacht. Die Zutaten dafür werden von Bauern aus der Region angebaut. Einer davon ist Manuel Stockinger vom Gemüsehof Voggeneder. Ein Biobauer aus dem Machland, in der dritten Generation. Er baut sogar Ingwer an und das Mitten im Mühlviertler. Und natürlich auch die verschiedenen Chilis. Sie sind schließlich die Grundlage für alle Saucen. Etwas weiter oben im Mühlviertel lebt und arbeitet Jakob Kiesenhofer. Der gelernte Tischlermeister zimmert wunderschöne Tische aus Altholz, wie den für die Firma FEUERzeug und zwar mit getrockneten Chilis im Tisch. Außerdem ist Jakob Kiesenhofer Rinderzüchter aus Leidenschaft. Die Drei sind eine wunderbare Kombination für einen herrlichen Grillabend.Österreich 2025, R: Barbara Meikl M: Christina Ömmer'
  genre:
  - '116'
  widescreen: true
