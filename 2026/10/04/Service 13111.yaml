  title: World Rally Championship 2026
  subtitle: 'Rally Italia Sardegna: Vorbericht'
  description: |-
    Anlässlich der 23. Ausgabe des Inselklassikers kehrt die Rallye nach einem Jahr in Olbia in die historische Stadt an der Korallenküste zurück. Es ist das zehnte Mal, dass Alghero als Austragungsort fungiert, seit es 2014 erstmals die WRC begrüßte.
    Der Servicepark wird erneut am Lungomare Barcellona eingerichtet, nur wenige Meter vom Mittelmeer entfernt, während die feierliche Zielankunft unter den alten Stadtmauern geplant ist - eine der markantesten Kulissen für Podiumszeremonien der Meisterschaft.
    Zum erst vierten Mal in ihrer Geschichte findet die Rallye auf Sardinien im Herbst statt. Frühere Auflagen in der Spätsaison gab es 2004, 2012 und in der von der Pandemie geprägten Saison 2020. Ein Termin im Oktober birgt das Potenzial für kühlere Temperaturen und wechselhafte Bedingungen, was die Herausforderung noch weiter erhöht.
    Der Reifenverschleiß ist enorm, die mechanischen Komponenten werden bis an ihre Grenzen belastet, und ein einziger Konzentrationsfehler kann das Ende des Rennwochenendes bedeuten. Sardinien verschenkt keine leichten Siege - und es läuft selten nach Plan.Italien 2026
  genre:
  - '64'
  widescreen: true
