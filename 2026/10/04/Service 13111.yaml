  title: Snow - Eisige Stille
  description: "Mitten im tiefsten Winter treibt ein Serienmörder in den verschneiten französischen Alpen sein Unwesen. Seine Opfer sind prominente Persönlichkeiten, die der Killer auf brutale Weise in ihren luxuriösen Wohnhäusern tötet. Hauptmann Thomas Delhaye (Frédéric Diefenthal) von der Gendarmerie steckt mit seinen Nachforschungen in einer Sackgasse. Da erinnert er sich an Juliette Hémon. Die junge Frau wurde vor einigen Jahren wegen eines ähnlichen Verbrechens inhaftiert. Mit einer Sondergenehmigung schafft es Thomas, Juliette für ein paar Tage aus dem Gefängnis zu holen. Das ungleiche Ermittler-Duo beginnt seine Jagd nach dem mysteriösen Mörder.  \n\nDer Einfluss von Meisterregisseur Roman Polanski in dem Thriller \"Snow - Eisige Stille\" von Laurent Tuel ist unverkennbar. Der französische Filmemacher realisierte zuvor unter anderem den Krimi \"Ein enger Kreis\" mit Jean Reno. Frédéric Diefenthal (\"Taxi\") spielt den Kriminalbeamten Thomas Delhaye. Gedreht wurde in der spektakulären Berglandschaft der französischen Region Auvergne-Rhône-Alpes.\nThriller, Belgien 2022, R: Laurent Tuel"
  widescreen: true
