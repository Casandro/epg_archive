  title: Ich, Bauer
  subtitle: Von der Liebe
  description: |-
    Einen Hof zu übernehmen, der zehn Jahre leer gestanden ist, erweist sich für ein junges Paar schwieriger als gedacht. Vier Jahre Probezeit, gemeinsames Wohnen mit den Altbauern unter einem Dach, nur ein Bad und eine Küche. Trotzdem packen sie überall an, bauen den Stall um und schaffen 140 Milchschafe an. "Wenn man so ein Anwesen kaufen müsste, müssten die Kinder von unseren Kindern und deren Kinder noch dafür zahlen", sagt Jim. Möglich wurde die Übernahme deshalb nur durch den Leibrentenvertrag. Nach acht Jahren Beziehung träumt Babsi von einem Heiratsantrag und einer großen Hochzeit - was sie nicht weiß: Ihr Jim plant bereits heimlich eine Überraschung.

    Im Kärntner Mölltal ist die Liebe bei Tina ebenfalls ein Thema. Die selbstbewusste Jungbäuerin lebt für ihren Bergbauernhof und ihre große Leidenschaft, die Jagd. Doch ein Jägerkollege hat offensichtlich mehr als nur die Jagd im Sinn - und ist der feschen Tina dicht auf den Fersen. "Es hat sich alles ergeben im Leben, es wird sich das auch noch ergeben, wenn's passen sollte", sagt Tina. Zwei Paare, zwei Höfe und zwei ganz unterschiedliche Wege zum Liebesglück.
    Österreich 2025, R: Helmut Manninger
  genre:
  - '116'
  widescreen: true
