  title: Rozhlasová hra
  description: 'Bílá velryba. Tajuplný příběh o kapitánovi, který chce v Tichém oceánu za každou cenu najít jednu bílou velrybu, obřího vorvaně, kterému námořníci přezdívají Moby Dick. Napsal: Petr Mandel na motivy stejnojmenného románu Hermana Melvilla. Režie: Vladimír Rusko. Natočeno v roce 2003. Účinkují: Aleš Procházka, Martin Štěpánek, Jiří Schwarz, Pavel Rímský, Petr Pelzner a další.'
