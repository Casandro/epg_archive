  - 1436351
  start: 2026-10-04T16:30:00Z
  stop: 2026-10-04T16:55:00Z
  title: Čtení na pokračování
  description: 'Můj táta duch 1/7. Rozhlasový seriál o tom, že některé věci se nedají dokázat, ale i tak můžou být skutečné. "Ahoj, já jsem Etel. Můj táta zmizel do nemocnice a už se nevrátil. Teda vrátil. Ale jako duch!" Etel miluje encyklopedie, chce být vědkyní a sní o Nobelově ceně. Jenže jednoho dne zjistí, že ne všechno se dá změřit, spočítat nebo vysvětlit. Její táta se totiž po smrti vrátí na Zem jako duch! A tak si Etel začne psát vlastní encyklopedii o duchách. Právě tenhle výzkum jí přivede do života nejen nejlepší kamarádku Bedřišku, ale i školní psycholožku Vilmu, která jí vysvětlí, že někdy je v pořádku být prostě smutná. Napsala: Daniela Samsonová. Režie: Bela Schenková. Natočeno v roce 2025. Čte: Berenika Anna Mikeschová.'
