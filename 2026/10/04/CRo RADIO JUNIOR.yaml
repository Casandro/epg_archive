  start: 2026-10-04T17:00:00Z
  stop: 2026-10-04T17:25:00Z
  title: Pohádkové poklady
  description: 'O bílém hadu. Pohádka Boženy Němcové o zakletém bílém hadovi, odvážné Běle a o lásce, která překoná kouzla zlé čarodějnice. Napsala: Božena Němcová, režie: Josef Svátek. Natočeno v roce 1967. Vypráví: Vlasta Fabiánová.'
- eventId:
  - 1432144
  - 1436354
  start: 2026-10-04T17:25:00Z
  stop: 2026-10-04T17:50:00Z
  title: Pohádkové poklady
  description: 'O Jozífkovi a krásné slunečničce. Syn dřevorubce Jozífek je vyhnán zlou macechou z domova. Útočiště najde u rodiny obra a jeho dcery, které se kvůli její kráse říkalo krásná slunečnička. Aby však mohl Jozífek v domě zůstat, musí splnit tři těžké úkoly. Francouzská lidová pohádka o odvaze a lásce. Napsal: Jan Vladislav, režie: Josef Svátek. Natočeno v roce 1967. Vypráví: Bohumil Bezouška.'
- eventId:
  - 1432145
  - 1436355
  start: 2026-10-04T17:50:00Z
  stop: 2026-10-04T18:00:00Z
  title: Hajaja
  description: Rézička a Čtvrtjadýrko 6/6 - Jak měli trápení s kunou. Povídání o jedné veverce s kožíškem rezavým jako měď, která si říkala Rézička. Aby jí nebylo smutno, našla si kamaráda. Malého lískového skřítka jménem Čtvrtjadýrko. O tom, co všechno spolu zažili, vypráví seriál Jaroslavy Pechové Rézička a Čtvrtjadýrko. Natočeno v roce 1990. Režie Vladimír Gromov. Vypráví Dana Syslová.
