  title: kinokino
  subtitle: Das Filmmagazin
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Tom Cruise als Retter der Menschheit? - Er will die Welt retten, obwohl er sie zuvor durch eine Umweltkatastrophe ausgelöst hat. In "Digger" spielt Hollywoods ewiger Superstar Tom Cruise - in Magnatenkluft und mit Altersmaske kaum wiederzuerkennen - den mächtigsten Mann des Planeten, der sich auf eine verzweifelte Mission begibt.

    Doris Dörrie und der Pflegeroboter - "Frau Winkler verlässt das Haus": Nach einem Sturz kommt Jutta Winkler (Angela Winkler) allein nicht mehr zurecht. Weil ihre Tochter Emi (Laura Tonke) beruflich eingespannt ist, soll sich ein Pflegeroboter um die Mutter kümmern. Frau Winkler ist wenig begeistert, aber langsam freundet sich die ehemalige Schauspielerin mit dem Roboter an, der mit ihr Tschechow rezitiert.

    "Bruno - Der junge Kreisky" - Bruno Kreisky war einer der einflussreichsten österreichischen Politiker des 20. Jahrhunderts. Alles beginnt in den späten 1920er-Jahren, als der junge und idealistische Bruno Mitglied der sozialistischen Arbeiterjugend werden will. Doch als Sohn reicher jüdischer Eltern nimmt diese ihn nur widerwillig auf. Kurze Zeit später, als die politische Stimmung im Land eskaliert, schlägt seine Stunde.

    Außerdem zwei Dokumentarfilme: - "Watching People Watching Birds" heftet sich Vogelbeobachtern in aller Welt an die Fersen. Und "Über Unterbiberger - Vom Woid in die Welt" begleitet die bayerische Musikerfamilie der "Unterbiberger Hofmusik" auf ihren Konzertreisen in die entferntesten Länder.
    HD-Produktion
