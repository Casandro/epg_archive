    Welche Rolle spielt dabei das Oktoberfest oder der Strandkorb von Philipp Amthor? Im politischen Deutschland wurde vieles durcheinandergewirbelt. Zeit, darüber zu lachen - mit Dieter Nuhr und seinen Gästen Lisa Eckhart, Hans Gerzlich und Andreas Rebers.
