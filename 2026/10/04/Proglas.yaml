  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková * Co nám dnes může říct Pavlovo učení o přikrývání hlavy při modlitbě a prorokování? Nejde jen o dávný zvyk, ale o to, co svým jednáním vyjadřujeme. O svobodu, respekt k druhému a schopnost rozlišovat podstatné od nepodstatného. V archivní nahrávce pokračuje kazatel Jiří Hurta ve výkladu 1. listu Korintským 11. kapitole. Pořad Studna slova uslyšíte od sedmi hodin 45 minut.'
