  title: Uši k duši (Rádio 7)
  subtitle: Vyhoření - Stres (1. díl)
  description: 'Autor: Marek Macák; Interpret: Lucie Endlicherová; Premiéra: 2.10.2026 * Dříve pomáhalo, že kdo uteče, vyhraje, případně kdo zabije nepřítele, má navrch. Současní nepřátelé jsou ale velmi často abstraktní, neuchopitelní, nepojmenovatelní. Bránit se pak tlaku a vyčerpání je náročnější, o to víc, že nějaká míra tlaku je motivační. Jak se v tom všem vyznat? Přemýšlíme společně s psychologem Markem Macákem v prvním zastavení série o vyhoření, které se zaměří na stres.'
