  title: Knihovnička
  subtitle: 'Autobiografie Papeže Františka: Naděje'
  description: 'Autor a interpret: Nikola Samcová; Premiéra: 12.7.2025 * Papež František se v knize Naděje ohlíží za svým pozoruhodným životem, přibližuje své dětství i dospívání a události, které ho přivedly k volbě životního poslání. S odvahou a upřímností se věnuje i zásadním tématům současnosti, jako je válka a mír, migrace, environmentální krize, postavení žen, sexualita, technologický rozvoj či budoucnost církve. Knihu doplňují vzácné fotografie, včetně soukromých a nepublikovaných materiálů. Jedná se o vůbec první autobiografii, jakou kdy papež sepsal v době svého úřadu. Česky vyšla v roce 2025 v nakladatelství Univerzum spadající pod Euromedia.'
