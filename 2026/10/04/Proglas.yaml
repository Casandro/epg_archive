  title: Z archivu hudebních pořadů
  subtitle: Steve Arvey živě z Koncertního studia
  description: 'Autor: Jannis Moras; Interpret: Steve Arvey, Tomáš Bobrovniczký, Taras Vološčuk; Premiéra: 11.8.2026 * Kytarista Steve Arvey, který působí na Floridě, patří k výrazným představitelům současného amerického blues. Do našeho studia přijel se svým mezinárodním triem, které dále tvoří ukrajinský kontrabasista Taras Vološčuk a slovenský bubeník Tomáš Bobrovniczký. Vedle toho, že vám zahrají několik skladeb v našem studiu, přiblíží Arvey svou autorskou tvorbu, bude hovořit o inspiraci tradičním blues i gospelem a představí několik netradičních nástrojů včetně takzvané cigar box guitar. Řeč je také o různých regionálních podobách blues, o improvizaci na koncertech i rozdílech mezi americkým a evropským publikem. [stýv árvi] [bobrovnický] [sigár boks gitár] '
  genre:
  - '96'
