- eventId: 1387242
  start: 2026-10-04T04:30:00Z
  stop: 2026-10-04T04:35:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Orlando mit Jasmin Tabatabai
  subtitle: VIP Trip - Prominente auf Reisen 3 - Orlando mit Jasmin Tabatabai
  description: |-
    Eine Erlebnisreise in den Vereinigten Staaten: Die Schauspielerin und Musikerin Jasmin Tabatabai nimmt Sie mit nach Orlando in den Bundesstaat Florida. In Begleitung ihrer Tochter geht sie auf die Suche nach unvergesslichen Abenteuern. Zum Glück sind diese in Orlando nicht schwer zu finden. Die Stadt ist bekannt für seine Erlebniswelten und Themenparks. Kein Wunder also, dass die Reise der Schauspielerin in der mystischen Welt des Harry Potter beginnt. Im nachgebildeten Hogwarts verschickt sie Postkarten mit der Eulenpost, kostet das aus den Büchern bekannte "Butterbeer" und fliegt mit der Hippogreif-Achterbahn um Hogwarts-Castle. Weitere Stopps auf ihrer Reise durch die Erlebnisparks sind die Themenwelt "Universal's Islands of Adventure" und Disney World: Hier trifft Jasmin Tabatabai mit ihrer Tochter auf den Superheld Spiderman und auf Micky Mouse. Außerhalb der vielen Freizeitparks warten jedoch viele weitere Abenteuer. In der Sumpflandschaft  von Boggy Creek gehen Mutter und Tochter auf die Suche nach Alligatoren. Ein besonderes Erlebnis für beide ist das Schwimmen mit Delphinen. Nach all den Attraktionen bildet das allabendliche Disney-Feuerwerk "Illuminations" einen gelungenen Abschluss der Reise.

     DE 2013
- eventId: 1387243
  start: 2026-10-04T04:35:00Z
  stop: 2026-10-04T04:50:00Z
  title: VIP Trip - Prominente auf Reisen 2 - La Reunion mit Steffen Henssler
  subtitle: VIP Trip - Prominente auf Reisen 2 - La Reunion mit Steffen Henssler
  description: |-
    VIP Trip - Prominente auf Reisen 2: La Reunion - ein kleines, aber sehenswertes Inselparadies westlich von Madagaskar. Begleiten Sie den bekannten Fernsehkoch Steffen Henssler auf seiner Reise durch die faszinierenden Landschaften des französischen Überseegebiets, eine der wenigen Vulkaninseln in dieser Region. So beginnt Steffen Henssler seine Reise am Fuße des Piton de la Fournaise, eines noch immer recht aktiven Vulkans. Der Piton de la Fournaise, der zuletzt im Januar 2017 ausbrach, hat über die Jahrtausende hinweg eine atemberaubende schroffe Landschaft erschaffen. An vielen Stellen der Vulkanflanken treten heiße Gase und Wasserdampf aus. Nicht weit von dieser unwirklichen Szenerie liegt das Örtchen Zilaos. Hier entdeckt Steffen Henssler den ie ersten kulturellen und kulinarischen Einflüsse Frankreichs: Französische Weine, die mit Euro bezahlt werden. Diese werden sogar auf der Insel selbst angebaut und können durchaus mit denen vom Festland mithalten. Wie es sich für eine Insel gehört, ist das Wasser der Mittelpunkt ihrer Bewohner. So ist La Reunion ein echtes Wassersport Eldorado und bietet dank des Indischen Ozeans auch eine faszinierende Unterwasserwelt. Diese kann sich auch Steffen Henssler nicht entgehen lassen und begibt sich auf eine tierreiche Bootstour. Doch nicht nur das Wasser rund um die Insel ist einen Besuch wert, so lohnt es sich auch die Insel mal von einer anderen Perspektive zu beobachten, nämlich von oben. Deshalb hebt Steffen Henssler per Flugzeug ab und  gewinnt ganz neue Eindrücke von der Insel der Tausend Gesichter, so wird sie liebevoll den Einheimischen genannt.
    Als Koch sind die regionalen Zutaten einer Insel interessant. So lässt es sich Steffen Hennsler natürlich nicht nehmen, die Märkte der Insel zu erkunden und ihnen zum Abschluss seiner Reise noch die schmackhafte kreolische Küche einmal näher zu bringen. DE 2009
- eventId: 1387247
  start: 2026-10-04T04:50:00Z
  stop: 2026-10-04T05:10:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 2: Die Antarktis, kaum ein Ort der Welt wirkt so unwirklich und zugleich faszinierend wie der sechste Kontinent. Kommen Sie mit und begleiten sie den beliebten Schauspieler Richy Müller auf seiner Reise in die unendlichen Weiten der Antarktis. Der sechste Kontinent ist wahrlich kein alltägliches Touristenziel, so ist sogar die Anreise schon ein echtes Abenteuer. Da es am Ende der Welt natürlich keinen Flughafen gibt , reist das Team rund um Richy Müller per Boot an. Alleine diese Bootsfahrt bietet unwirkliche Panoramen , vorbei an gigantischen Eisschollen und noch größeren Eisbergen führt uns unsere Reise zur Mond Bucht. In dieser sichelförmigen Bucht verbringen wir eine unvergessliche Nacht unter der besonderen Lichtstimmungen des polar Himmels. Obwohl die Antarktis vor allem durch ihre Unberührtheit und Ruhe zu beeindrucken weiß , besitzt sie auch zahlreiche Bewohner , primär tierischer Natur. So wagen wir einen Abstecher zum Pinguin Island . Wie ihr Name verrät ist ,diese von Menschen unberührte Insel ,die Heimat zahlreicher Pinguine. Besonders interessant ist dabei zu beobachten wie die noch jungen Pinguine beharrlich auf ihre Eltern warten , die tagsüber auf Beutefang sind. Da die Antarktis vordergründig aus Wasser besteht , lässt es sich Richy Müller natürlich nicht nehmen die Umgebung auch vom Kajak aus zu erkunden. Dabei entdeckt er neben den bereits bekannten Pinguinen auch Robben und sogar den ein oder anderen Wal DE 2015'
- eventId: 1387248
  start: 2026-10-04T05:15:00Z
  stop: 2026-10-04T06:07:00Z
  title: Der Rhein von oben - Der romantische Rhein
  subtitle: Der Rhein von oben - Der romantische Rhein
  description: 'Das Rheintal hinter Bingen gilt als Inbegriff der deutschen Seele. Über die Hälfte seines Weges bis zur Nordsee hat der Rhein jetzt hinter sich gebracht. Er ist ein stolzer Fluss geworden und liefert Stoff für Sagen, Opern und Kriege. Im Mittelrheintal gibt es Burgen im Kilometertakt und Wein, den vor 2000 Jahren die Römer in den Norden brachten. Vorbei an der sagenumwobenen Loreley zieht der Rhein zum Deutschen Eck nach Koblenz, vorbei am Siebengebirge bis nach Bonn. Am Eingang zum Rheintal thront oberhalb von Rüdesheim eine Abtei, die das Andenken an Hildegard von Bingen pflegt. Schwester Christophora Janssen lebt hier für Gott und die Kunst. Eine Flusswindung weiter steht die erste von vielen ehemaligen Zollburgen: Rheinstein, seit 1975 im Privatbesitz der Hechers, die dort auch wohnen. Als Jugendlicher war Markus Hecher wenig begeistert vom neuen Familiendomizil, einen Stromanschluss gab es nicht. Inzwischen weiß er das Erbe seines Vaters zu schätzen und investiert Kraft, Geld und Leidenschaft in die Erhaltung des alten Gemäuers. Die mineralhaltigen Schieferböden im Rheintal eignen sich hervorragend für den Weinbau. Auch Bacharach verdankt seinen Reichtum den Trauben. Cecilia Jost bewirtschaftet in siebter Generation eines der traditionsreichen Familien-Weingüter mit Steillagen. Im Gründelbachtal klapperten früher 12 Mühlen, heute ist Josef Philipps der letzte Müller im gesamten Mittelrheintal. Aber seine Mühle läuft nicht mehr rentabel, in wenigen Jahren wird das Gerumpel der Mahlwerke endgültig verstummen. Auf der Spur der Dichterfreunde Clemens Brentano und Achim von Arnim wandern jeden Sommer Tausende durch das Mittelrheintal und suchen die Romantik. Um die Pflege der Wandersteige kümmern sich Wegepaten wie Beatrix Ollig. Das Rheinhotel Dreesen war früher das Wohnzimmer der Bonner Politikprominenz. Hoteldirektor Fritz Dreesen kümmert sich noch heute persönlich um jedes Detail. Sohn Olaf soll das traditionsreiche Haus in neue Zeiten führen. DE 2013'
- eventId: 1386925
  start: 2026-10-04T06:10:00Z
  stop: 2026-10-04T07:02:00Z
  title: Der Rhein von oben - Der fleißige Rhein
  subtitle: Der Rhein von oben - Der fleißige Rhein
  description: 'Die Folge führt mitten durch das Herz der rheinischen Industrie. Im Abschnitt zwischen Köln und Duisburg ist der Rhein ein breiter Transportweg, eine fließende Autobahn für die Binnenschiffe. Die Region wurde geprägt von Kohle, Stahl und Chemieparks, die sich verkehrsgünstig direkt am Fluss angesiedelt haben. Neben gigantischen Industrieanlagen liegen die Rheinauen, scheinbar unberührte Naturidylle. Der Dom bestimmt das Stadtbild von Köln, kein Gebäude darf höher sein als seine Türme. Gegenüber, am rechten Rheinufer, steht eine Currywurstbude. Eva Vosen und Ralf Jäger führen den Imbiss, der die Würstchen als festes Requisit auch an die Kommissare im Kölner "Tatort" verkauft. Im nah gelegenen Ruhrgebiet pulsiert der Strom als wirtschaftliche Lebensader, trotz Zechensterben und Niedergang der Montanindustrie. Binnenschiffer ist hier ein Beruf mit Zukunft und für Sarah Rusbült ein Traumjob. In ihrem Betrieb ist sie die erste Frau in der Ausbildung zur Binnenschifferin. In der Rheinaue Ehingen züchtet Elisabeth Nieskens Lamas und Alpakas. Für die Rheingegend eher untypische Tiere: Die Kamelart stammt aus Südamerika und wird wegen ihrer feinen Wolle geschätzt. Im Hafen von Duisburg entdeckt Rolf Köppen Graffiti an den Kais. Der Fotograf dokumentiert die kleinen und die großen Geschichten im Hafen und kommt mit seinem Boot auch in entlegenste Winkel. Auf der so genannten Schrottinsel wird Metall im großen Stil recycled. Ein echter Männerspielplatz zwischen Presse und Schredder, und mittendrin die Auszubildende Linda Eisermann. Völlig entgegengesetzt präsentiert sich die Rheinaue Walsum, ein Rückzugsgebiet für bedrohte Vogelarten und gestresste Großstädter. Direkt unter der Aue liegt ein großes Mineralwasservorkommen. Bis zu zwei Millionen Flaschen Mineralwasser täglich werden hier abgefüllt. Markus Heuvel wacht darüber, dass das Quellwasser von konstanter Qualität bleibt. DE 2013'
- eventId: 1386926
  start: 2026-10-04T07:15:00Z
  stop: 2026-10-04T08:07:00Z
  title: Der Rhein von oben - Der Niederrhein
  subtitle: Der Rhein von oben - Der Niederrhein
  description: 'Der Niederrhein hat die Menschen gelehrt, im Einklang mit der Natur zu leben. Der Mensch gibt dem Fluss ein Stück von der Ursprünglichkeit zurück, die er ihm einst genommen hat. Nur noch wenige Industrieriesen sind hier am Ufer zu finden, das in Richtung Niederlande immer grüner wird. Jenseits der Grenze ist das Leben zwischen Deichen und Kanälen geprägt vom Kampf gegen das Wasser. Kurz vor seiner Mündung in die Nordsee breitet sich der Rhein aus und bildet ein faszinierendes Delta. Der Niederrhein hat an seinen Ufern einen wertvollen Schatz hinterlassen. Nirgendwo sonst am Rhein sind die Vorkommen an Kies so groß und der Sand so hochwertig wie hier. Zurück bleiben große Auskiesungsflächen, die nach und nach rekultiviert werden. Die ehemaligen Baggerseen werden als Ausgleichsfläche bei Hochwasser genutzt. Fischer Gerhard Steinling hilft Brassen, Lachs und Zander bei der Wiederansiedlung. Nebenan ist eine besondere Spezies sesshaft geworden: die Dauercamper. 2000 Wohnwagen stehen auf der Grav-Insel im Grünen. Am Rheinbogen von Rees drückt die Strömung auf die Stadtmauer. Daher wird nun ein künstlicher Flussarm geformt, der das Wasser des großen Bruders aufnimmt und dessen Fließgeschwindigkeit schmälert. Kurz hinter Emmerich wird der Rhein zum Niederländer. Der mächtige Strom teilt sich und heißt nun Waal und Pannerdenschkanal. Bis zur Nordsee wird er seinen Namen mehrfach ändern und sich auf unzählige Arme verteilen. Es ist der Beginn des Rheindeltas. Schäfer Huug Hagoort ist auf den Poldern zwischen den Rheinarmen groß geworden. Er weiß, wie wichtig der Deichschutz ist. Im Hafen von Rotterdam wird es an den Ufern des Rheins noch mal geschäftig. Mit 40 Kilometern Länge ist der Hafen das Drehkreuz für Waren und Güter nach Europa. Hinter der Maeslant-Sperre, einem der großen Sperrwerke entlang der Küste, ist der Rhein an seinem Ziel. Nach einer Reise von 1.233 Kilometern taucht er beinahe unmerklich ein in die Fluten der Nordsee. DE 2013'
- eventId: 1386940
  start: 2026-10-04T08:15:00Z
  stop: 2026-10-04T08:59:00Z
  title: Der Rhein von oben - Ruhrgebiet von oben
  subtitle: Der Rhein von oben - Ruhrgebiet von oben
  description: 'Das Ruhrgebiet, der größte Ballungsraum Deutschlands, ist eine einzigartige Kulturlandschaft: auf der einen Seite erschlossen und urban, auf der anderen Seite naturbelassenes Idyll. Die Vielfalt des Reviers erschließt sich am besten von oben. Das Team hat sich in die Luft begeben und atemberaubende Bilder mitgebracht. Der Film zeigt das Revier aus ungewohnten Perspektiven: mal aus großer Höhe für den Gesamtüberblick und dann wieder ganz nah dran an den Menschen. Halden, Zechen und Stahlwerke geben aus der Luft ihre bizarre Schönheit preis. Deutlich ist zu sehen, wie der Industriewald in Gelsenkirchen die Reste der Zeche RheinElbe überwuchert. Im Ruhrtal im Süden säumen uralte Ruinen und elegante Schlösser die Ufer, Wassersportler tummeln sich am und im Fluss. Die Menschen des Ruhrgebiets faszinieren. Zum Beispiel Britta Breitenstein: Sobald der Westwind durch das Revier pustet, startet sie mit ihrem Gleitschirm von der Halde Norddeutschland. Fischzüchter Adolf Braun kam in den 1950er Jahren aus Mecklenburg nach Duisburg. Direkt am Autobahnkreuz Kaiserberg, dem "Spaghettiknoten", hält er in selbst angelegten Teichen Aale und Forellen. Aus der Vogelperspektive scheint es, als hätte sich Adolf Braun hier seine ganz persönliche Seenplatte gebaut. Für ihn ist das Ruhrgebiet ""as Herz Deutschlands". Fotograf Hans Blossey hat den Blick von oben zu seinem Beruf gemacht, er spezialisierte sich auf Luftbilder. Hunderte Stunden verbringt er jedes Jahr in seiner Cessna über dem Revier, immer auf der Jagd nach neuen Perspektiven. Er weiß: Die Region hat sich in den letzten Jahren immens verändert. Das Ruhrgebiet: einst die Keimzelle der Industrialisierung, mächtiges Montanland. Später das Sorgenkind der Republik. Heute richtet man im Revier den Blick nach vorn. Erholung, Tourismus, Kultur, das sind die neuen Schlagworte. Das Nebeneinander der verschiedenen Epochen ist von oben gut zu entdecken. Der Wandel im Revier wird nirgends so deutlich wie aus der Luft. DE 2013'
- eventId: 1386942
  start: 2026-10-04T09:05:00Z
  stop: 2026-10-04T09:57:00Z
  title: Höhenflüge - Im Ballon über Kenia
  subtitle: Höhenflüge - Im Ballon über Kenia
  description: 'Abenteuer Heißluftballon-leichter als Luft schweben Ballonfahrer über die Erde hinweg. Nie wissen sie wohin der Wind sie weht und wo sie landen werden, denn ein Ballon lässt sich nicht lenken. Diese Reihe begleitet das deutsch-englische Ehepaar Phil und Allie Dunnington auf ihren Reisen in fünf verschiedene Länder. Mit ihnen erleben wir die Faszination des Ballonsports: atemberaubende Ausblicke, dramatische Landungen, fremde Kulturen und unerwartete Begegnungen. "Hakuna Matata" - alles kein Problem, sagen die Kenianer. Dieses Sprichwort wird auf der Reise zum Leitsatz für das Ballonteam. Auch wenn es nicht immer zutrifft, wie Phil und Allie am eigenen Leib erleben müssen. Neben vielen Höhenflügen müssen sie trotz aller Sicherheitsvorkehrungen auch einen Absturz meistern. Kenia steckt voller Herausforderungen, denn fast überall ist Ballonfahrer-Neuland. Gefahren müssen daher immer mit einkalkuliert werden. Zwar ist Ballonfahren in aller Regel sicher, doch wie bei jedem Luftsport gilt auch hier: ein Absturz könnte im schlimmsten aller Fälle tödlich enden. Deshalb steht vor jedem Start ein gründlicher Sicherheitscheck. Bevor es überhaupt in die Luft geht, müssen die Hürden der Bürokratie überwunden werden: Inspektoren der Kenianischen Luftfahrtbehörde prüfen zunächst genau, ob Papiere, Korb und Hülle allen Sicherheitsstandards genügen. DE 2012'
- eventId: 1386943
  start: 2026-10-04T10:05:00Z
  stop: 2026-10-04T10:17:00Z
  title: Sprintour - Deutscher Einfluss in Paraguay
  subtitle: Sprintour - Deutscher Einfluss in Paraguay
  description: 'Nach einem Unfall in Brasilien haben wir in Paraguay den Unfallschaden am Wohnmobil reparieren lassen. In Hohenau wurde der Schaden zu unserer Zufriedenheit behoben und wir können endlich Paraguay mit unserem Camper erkunden. In Hohenau haben wir bemerkt, dass dort viele Deutsche wohnen. In der letzten Zeit sind auch viele deutsche Auswanderer in Hohenau angekommen. Vor allem Familien. Das wirft viele Fragen auf: Warum finden Deutsche Paraguay als Auswanderungsland so interessant? Nach vielen Gesprächen mit Einheimischen haben wir einige Theorien dazu. Nach der Stadt Hohenau geht es für uns in die Hauptstadt von Paraguay, nach Asuncion. Da merken wir bereits den Unterschied von der großen Hauptstadt zu dem eher dörflichen Erscheinungsbild von Hohenau. Asuncion ist auf den ersten Blick stressig und voll. Als wir jedoch mitten in der Stadt angekommen sind, wundern wir uns was für eine Ruhe und Zufriedenheit diese Stadt ausstrahlt. Sie ist nicht so voll und stressig. Asuncion hat vielleicht nicht so viele Highlights wie andere Hauptstädte in Südamerika, allerdings ist Asuncion sehr angenehm. Zudem gibt es zahlreiche deutsche Schulen, Krankenhäuser und deutsche Geschäfte sowie Bäckereien. Für deutsche Auswanderer vielleicht sehr wichtig, da sie so ihre Gebräuche und Traditionen im fremden Land Paraguay nicht ganz aufgeben müssen. So finden auch wir eine deutsche Bäckerei in Paraguay! Nach so vielen Monaten mit dem Camper durch Südamerika haben wir das Weissbrot einfach nur satt. Deshalb freuen wir uns sehr über Sauerteigbrot und Brezeln. Nach einem sehr entspannten Tag in Asuncion geht es für uns zurück zu dem Wohnmobil Übernachtungsplatz mitten in der Stadt. Wir freuen uns auf die Weiterreise mit unserem Camper durch Paraguay und die Erkundung des Hinterlandes. PY 2023'
- eventId: 1386956
  start: 2026-10-04T10:20:00Z
  stop: 2026-10-04T10:41:00Z
  title: Sprintour - Deutsche Kolonien in Paraguay
  subtitle: Sprintour - Deutsche Kolonien in Paraguay
  description: Letzte Woche waren wir mit unserem Wohnmobil in der Hauptstadt von Paraguay, Asuncion, unterwegs. Jetzt geht es mit unserem Wohnmobil endlich in den Norden von Paraguay, durch den Chaco. Allerdings läuft dort nicht alles nach Plan und wir hängen wieder in der Werkstatt fest. Der westliche Chaco in Praguay besteht aus sumpfigen Palmensavannen, wohingegen der nördliche Teil des Chacos sehr trocken ist. Wir fahren auf der Ruta Transchaco mit unserem Wohnmobil in die Richtung von Filadelfia in Paraguay. Aber zuerst machen wir Halt in einem Naturschutzgebiet, in Campo Maria. Dort entfliehen wir der Hitze, machen uns einen schönen Vanlife Grillabend und können endlich mal ausschlafen. Auch wenn es teilweise sehr trocken ist, kann man dort viele unterschiedliche Vogelarten beobachten. Einmal die Hängematte aufspannen und voll und ganz das Vanlife genießen. Die Ruta Transchaco ist asphaltiert und gehört eher zu den guten Straßen in Paraguay. Die Hauptstraßen in Paraguay sind generell in einem guten Zustand. Wenn man allerdings nach links und rechts abbiegt, dann kann man sehr schnell auf einer schlechten Schotterpiste landen. So auch wir. Wir fahren durch zahlreiche Mennonitensiedlungen und staunen über den deutschen Einfluss in Paraguay. Damals sind viele (Ursprungs-) Deutsche nach Paraguay ausgewandert und haben im Norden deutsche Kolonien gegründet unter der Voraussetzung den Chaco urbar zu machen. Diesen deutschen Einfluss merkt man überall in der Region um Filadelfia und Loma Plata herum. Die deutsche Sprache ist dort weit verbreitet. Es sind auch einige Deutsche in diese Gegend ausgewandert. Zudem haben die Mennoniten dort zahlreiche Geschäfte, in denen wir endlich die Ersatzteile für unser Wohnmobil kaufen können, nach denen wir sehr lange in Südamerika gesucht haben. PY 2023
- eventId: 1386957
  start: 2026-10-04T10:45:00Z
  stop: 2026-10-04T11:02:00Z
  title: Sprintour - Vanlife auf 4100m in Bolivien
  subtitle: Sprintour - Vanlife auf 4100m in Bolivien
  description: 'Willkommen in der höchsten Stadt der Welt! Sie ist chaotisch, laut und faszinierend zugleich. Willkommen in La Paz in Bolivien! Wir mussten mit unserem Wohnmobil durch den verrücktesten Verkehr durch, den wir je erlebt haben um in La Paz in Bolivien auf den Campingplatz zu kommen. La Paz befindet sich auf knapp 3700 Meter und unser Campingplatz auf 4100 Meter in El Alto. Und diese Höhe merken wir! Sie schlaucht uns so sehr, dass wir zwei Tage lang im Wohnmobil verbringen und uns ausruhen müssen. Aber dann geht es endlich nach La Paz! Die drittgrößte Stadt und Regierungssitz in Bolivien. Um ins Zentrum zu kommen, nutzen wir Mi Teléferico. Das ist die Seilbahn in La Paz, die seit 2014 den schlimmen Verkehr in der Stadt entlasten soll. Allein deshalb lohnt es sich dorthin zu kommen. Die Aussicht aus der Seilbahn in La Paz ist grandios. In der Nähe von La Paz gibt es außerdem die bekannte Todesstraße in Bolivien: Deathroad oder auch Estrada de Morte genannt. Wir wagen uns auf die Deathroad und bezwingen Sie mit Fahrrädern. Die Deathroad galt bis 2007 als gefährlichste Straße der Welt. Unser Campingplatz in El Alto ist zwar super gelegen, allerdings auch sehr betroffen von Straßenblockaden, Paraden oder Märkten, die die Straßen unpassierbar machen. So können wir erst später als geplant los und nehmen zum Glück den größten Straßenmarkt der Welt in El Alto mit. Eine ganz tolle Erfahrung! Und am Abend geht es noch zur Cholita Wrestling Show in La Paz. Eine sehr interessante Wrestling Show, bei der Cholitas (indigene Frauen in Bolivien und Peru) gegeneinander kämpfen. Natürlich hat sich keiner dabei verletzt und die Erfahrung war mehr als interessant. BO 2023'
- eventId: 1386970
  start: 2026-10-04T11:05:00Z
  stop: 2026-10-04T11:24:00Z
  title: Sprintour - Offroad Peru mit dem Wohnmobil
  subtitle: Sprintour - Offroad Peru mit dem Wohnmobil
  description: 'Wir sind mit unserem Wohnmobil in Peru und wollen jetzt endlich die Andenregion in Peru erkunden. Offroad in den Anden in Peru: Ein Traum von uns beiden! Bevor es losgehen kann, landet unser Wohnmobil zuerst einmal in der Werkstatt. Ein Dämpfer von unserem VW Crafter Camper ist kaputt gegangen. Deshalb müssen wir wieder in Richtung Bolivien fahren um den Dämpfer auszutauschen. Zum Glück klappt es und unser VW Crafter Wohnmobil ist einsatzbereit für die Offroadstrecke in den Anden in Peru. Unser Ziel ist der Berg Pallay Punchu. Er ist im Gegensatz zu den Rainbow Mountains in Peru gar nicht touristisch erschlossen. Wir wagen das Offroad Abenteuer und begeben uns auf die spannende Strecke. Eine ewig lange Schotterpiste führt uns in den peruanischen Anden über wunderschöne Pässe, kleine Dörfer und eine atemberaubende Natur. Die Anden in Peru sehen sehr einzigartig aus. Es ist schwer Vergleiche zu finden. Die Strecke hoch zum Pallay Punchu erweist sich nach der ersten recht guten Passage als schwierig. Der Weg ist einspurig und auf 4500 m eine richtige Herausforderung für unseren VW Crafter Camper. Fürs Vanlife ist er perfekt, ist dieses Offroad Abenteuer aber zu viel für unser Camper? Unser Wohnmobil bekommt kaum Luft und das Anfahren wird immer schwieriger. Dazu werden die Kurven immer enger und der Weg immer steiler. Wendemöglichkeiten: Fehlanzeige! Manche Kurven sind so eng, dass wir für einen längeren Moment überhaupt nicht herauskommen. Auf über 4500 m ist das Anfahren eine richtige Qual. Wir schaffen es trotzdem diese Offroad Passage zu meistern und kommen oben am Berg an. Eine Stunde und 200 Hm später kommen wir ganz oben außer Puste an und können den Pallay Punchu in voller Pracht bestaunen. PE 2023'
- eventId: 1386971
  start: 2026-10-04T11:25:00Z
  stop: 2026-10-04T11:48:00Z
  title: Sprintour - Durch die Berge in Peru
  subtitle: Sprintour - Durch die Berge in Peru
  description: Wieder kommen wir und unser VW Crafter Camper an unsere Grenzen! Unsere Reise durch Südamerika führt uns und unseren VW Crafter Camper durch die Anden in Peru. Wir wollen die Rainbow Mountains (Vinicunca) in Peru erkunden. Von Cusco aus fahren zahlreiche Tourbusse hoch zu dem Regenbogenberg in Peru. Wir haben uns allerdings einen ganz anderen Weg für unser Wohnmobil hoch zu den Bergen ausgesucht. Es ist ein kleiner Rundweg durch die Anden in Peru. Und der Weg kann kaum schöner sein. Der Weg führt vorbei an kleinen Dörfern in einer malerischen Landschaft auf einer Schotterpiste immer weiter hinauf. Unser Wohnmobil kämpft sich immer weiter hoch und hat richtig Schwierigkeiten mit der Höhe klarzukommen. Der erste Gang geht zwar recht gut, allerdings ist das Anfahren in dieser Höhe recht problematisch. Peru zeigt sich wieder von seiner schönsten und wildesten Seite. Gelbe Grasbüschel, die von Alpakaherden genüsslich bei blauem Himmel verschlungen werden. Eine faszinierende Landschaft die uns Peru hier mal wieder in Südamerika zeigt. Wir sind hin und weg. Allerdings wird die Offroad Piste immer schlechter. Große Löcher in dem Boden sowie viele Passagen mit großen Steinen. Ausgetrocknete Flussbette sind hier unser Endgegner. Ständig müssen wir diese passieren und kommen nur sehr langsam voran. Die Anhängerkupplung setzt permanent auf. Für unseren Camper ist die Strecke nicht gemacht. Für ein 4x4 Fahrzeug eher. Wir kämpfen uns durch und kommen am Abend an den Rainbow Mountains in Peru an und beschließen hoch zu fahren. Eine schmale Straße führt den Weg hinauf. Eine sehr beängstigende Situation, da einem jederzeit jemand entgegenkommen kann auf der einen Spur nach oben. Wir schaffen es gut hoch und übernachten auf knapp 4600 m an einem Parkplatz. Am nächsten Morgen starten wir unsere Tour bei Sonnenaufgang und erklimmen den Regenbogenberg. 200 Höhenmeter, die es ganz schön in sich haben. PE 2023
- eventId: 1386978
  start: 2026-10-04T11:50:00Z
  stop: 2026-10-04T12:04:00Z
  title: Sprintour - Eine Reise zum Machu Picchu
  subtitle: Sprintour - Eine Reise zum Machu Picchu
  description: Machu Picchu, eine von den Inkas erbaute Stadt in den Anden in Peru, die man unbedingt auf der Bucket List haben sollte. Einen Monat im Voraus muss man die Tickets für den Machu Picchu in Peru buchen. Es ist die Touristenattraktion schlecht hin. Wir reisen normalerweise mit unserem Wohnmobil durch Peru. Für dieses Ziel in Peru haben wir allerdings einen Bus von Cusco nach Hidroelectrica genommen. Dort ausgestiegen kann man die Bahn nach Aguas Calientes nehmen, was wir aber nicht machen. Wir laufen den kompletten Weg von Hidroelectrica zum Campingplatz, welcher direkt am Eingang zum Machu Picchu ist. Der Weg ist wunderschön und führt durch den Wald immer an den Bahngleisen entlang.Wir haben circa drei Stunden dafür gebraucht. Am Camping Municipal angekommen, breiten wir zuerst unser Zelt aus und essen zu Abend. Am nächsten Morgen klingelt unser Wecker recht früh und wir laufen eine Stunde hoch durch ein im Nebel versunkenes Gebiet. Oben folgt eine sehr anstrengende Wanderung auf den Berg. Es führen gefühlt mehrere tausende Treppen hoch auf den Gipfel. Leider haben wir auch Pech mit dem Wetter und der Berg versinkt in Wolken und Nebel. Normalerweise kann man von dem Waynapicchu eine wunderbare Aussicht auf den Machu Picchu genießen. Leider nicht an diesem Morgen. Danach folgt der zweite Rundgang an dem Tag. So besuchen wir Terrassen, von den man den besten Blick auf den Machu Picchu hat. Danach folgt die Inka-Brücke und wir machen uns nach dem anstrengenden Tag auf den Weg nach unten. Wieder ganz schön viele Treppen! Es folgt eine weitere Übernachtung auf dem Campingplatz bevor wir dann zurück nach Hidroelectrica entlang der Bahngleise laufen und von dort aus den Bus zurück nach Cusco nehmen. PE 2024
- eventId: 1386986
  start: 2026-10-04T12:10:00Z
  stop: 2026-10-04T12:41:00Z
  title: Sprintour - Härteste Offroadpiste in Peru
  subtitle: Sprintour - Härteste Offroadpiste in Peru
  description: Wir sind mit unserem Wohnmobil in Peru unterwegs und planen zu dem Huascarán Nationalpark zu fahren. Die Fahrt dorthin wird ganz schnell zum Albtraum! Das Navi schickt uns einen Weg hoch, den wir ohne Allrad und genug Bodenfreiheit einfach nicht fahren können. Die Straße wird immer enger und steiler. Zudem kommen uns permanent Fahrzeuge entgegen. An einer Stelle kommen wir mit unserem VW Crafter Wohnmobil gar nicht mehr weiter und müssen umdrehen. Leichter gesagt als getan. Wendemöglichkeiten sind bei dieser Offroadstrecke eher Fehlanzeige! So wird diese Strecke zu einer richtigen Herausforderung! Irgendwann kommen wir in dem Huascarán Nationalpark an und können die wunderschöne Wanderung zu der Laguna 69 machen. Wir sind umgeben von schneebedeckten 6000ern und können die Schönheit der Natur nicht in Worte fassen. Weiter geht es für uns auf der Panamericana in Peru in Richtung Ecuador. Wir folgen mit unserem Camper allerdings nicht dem typischen Weg der Panamericana. Wir fahren lieber den Weg durch die Berge in Peru und Ecuador. Es ist ein Traum! Die Straßen sind zum größten Teil asphaltiert und Ecuador verzaubert uns mit den wunderschönen, grünen Bergen. Nachts kommen wir im Podocarpus Nationalpark an und müssen uns zuerst einmal nach der langen Fahrt im Wohnmobil ausruhen. Was für eine Natur! Ecuador, wir kommen! PE 2023
- eventId: 1386987
  start: 2026-10-04T12:45:00Z
  stop: 2026-10-04T13:06:00Z
  title: Sprintour - Ist Ecuador das schönste Land der Welt?
  subtitle: Sprintour - Ist Ecuador das schönste Land der Welt?
  description: Nach Peru sind wir mit unserem Wohnmobil nach Ecuador eingereist. Bereits an der Grenze waren wir sehr überrascht von der wunderschönen Natur und den guten Straßen in Ecuador. Wir starten dieses Vanlife Video in Banos und fahren mit unserem Camper zu einem wunderschönen Wasserfall auf der sogenannten Wasserfall-Route. Das ist eine Straße die mitten durch das Amazonasgebiet führt und einige Wasserfälle auf dem Weg ausgewiesen sind. Hier ist die Natur in Ecuador grün und saftig und die Weite des Amazonas beeindruckt uns sehr. Das ist eindeutig eine der schönsten Straßen, die wir mit unserem Wohnmobil überhaupt gefahren sind. Wir machen Halt auf einem Campingplatz mitten im Dschungel und haben leider keine so gute Nacht, weil es die ganze Nacht gewittert. Das Baden im Naturpool im Amazonas entschädigt uns für die unruhige Nacht und wir genießen den Regenwald in Ecuador. Danach geht es für uns zu einer Kakaoplantage, die nicht weit weg von dem Campingplatz ist. Dort stellen sie biologisch angebauten Kakao her. Hier machen wir eine tolle Führung durch Kakaoplantagen und gehen den Prozess der Schokoladenherstellung von der Pflanze bis zur fertigen Schokolade durch. Und dann können wir die leckere und selbst gemachte Schokolade aus Ecuador probieren. Ein Traum! Am selben Tag dürfen wir eine Höhle im Amazonasgebiet besuchen, was zu einer großartigen Erfahrung wird und genießen noch das Vanlife auf dem wunderschönen Campingplatz in Ecuador. So haben wir Ecuador nicht erwartet und sind sehr positiv überrascht. Vor allem mit dem Camper war es eine tolle Erfahrung! EC 2024
- eventId: 1387002
  start: 2026-10-04T13:10:00Z
  stop: 2026-10-04T13:25:00Z
  title: Sprintour - Ist Vanlife in Ecuador gefährlich?
  subtitle: Sprintour - Ist Vanlife in Ecuador gefährlich?
  description: Wir reisen mit unserem Wohnmobil durch Ecuador und erkunden zuerst einen typischen Markt in Ecuador in Otavalo. Dieser Ort befindet sich nicht weit weg von dem Äquator in Ecuador. Und es ist so ein typischer Markt in Ecuador, auf dem man alles findet, nur keine Touristen. So kaufen wir uns einen Pullover aus Schafwolle und probieren endlich gegrillte Bananen aus. Super lecker und sättigend! Weiter geht es mit unserem Wohnmobil zu einer Hängemattenmanufaktur, die tatsächlich aus einem Ein-Mann-Betrieb besteht. Er macht alles selber, weshalb wir uns auf alle Fälle eine Hängematte aus Ecuador gönnen. Unser Wohnmobil kämpft sich dann schlechte Straßen bis zu einem Campingplatz hoch. Am nächsten Morgen wandern wir entlang der Laguna de Cuicocha. Ein wunderschöner Wanderweg um die Lagune herum. In der Nähe gab es allerdings einen bewaffneten Überfall auf einen Camper. Das liest man leider nicht so selten in Ecuador. In dem Lang kommt es vor allem an wilden Stellplätzen zu Überfällen. Das ist auch der Grund warum wir mit unserem Wohnmobil auf einen Campingplatz gegangen sind. Wir haben uns immer sehr sicher gefühlt in Ecuador, allerdings ist es nur unsere Momentaufnahme. Man muss alles in allem sehr vorsichtig sein, vor allem bei Übernachtungen im Wohnmobil! EC 2023
- eventId: 1387003
  start: 2026-10-04T13:25:00Z
  stop: 2026-10-04T13:43:00Z
  title: Sprintour - Vanlife in Kolumbien
  subtitle: Sprintour - Vanlife in Kolumbien
  description: Nach so vielen Monaten Vanlife in Süadamerika sind wir endlich in Kolumbien angekommen. Ein Land, das viele für gefährlich halten und deshalb vielleicht nie bereisen. Wir wagen uns in das Abenteuer Kolumbien und reisen von Ecuador nach Kolumbien ein. In Medellin holen wir einen Freund am Flughafen ab und bereisen zu dritt im Camper Kolumbien. Angekommen an der Karibikküse können wir es kaum glauben an so einem schönen Ort in Kolumbien zu sein. Was für ein Traum! Hier kann man das Vanlife voll und ganz genießen! Direkt an der schönsten Küste in Kolumbien in der Nähe von Santa Marta. Wir packen unsere Sachen und fahren zu einem wunderschönen Wasserfall. Dem Quebrada Valencia. Eine halbe Stunde wandern wir bis zu den Felsen und genießen das kühle Nass am Wasserfall. Was für eine Abkühlung, denn das Meer an der Karibik bietet bei den warmen Temperaturen keine Abkühlung. Und bei 33 Grad im Wohnmobil ist das Vanlife sehr herausfordernd. Danach geht es für uns weiter in das kleine Örtchen Palomino. Es befindet sich ebenfalls an dem wunderschönen Strand und wir erkunden den schönen Ort. Das Klima in der Karibik macht uns zu schaffen. Es ist heiß, schwül und es gibt viele Moskitos. Die Karibik in Kolumbien ist wunderschön, aber auch sehr herausfordernd! CO 2023
- eventId: 1387005
  start: 2026-10-04T13:50:00Z
  stop: 2026-10-04T14:08:00Z
  title: Sprintour - Können wir nach Panama verschiffen?
  subtitle: Sprintour - Können wir nach Panama verschiffen?
  description: Wir planen unser Wohnmobil von Kolumbien nach Panama zu verschiffen. Zwischen Kolumbien und Panama befindet sich das Darien Gap. Das ist ein Naturschutzgebiet, indem es keine Straße gibt. Um den Camper von Kolumbien nach Panama zu schaffen, müssen wir unser Wohnmobil verschiffen. Allerdings ist das einfacher gesagt, als getan. Eigentlich hatten wir von unserer Verschiffungs Agentin die Zusage, dass der Camper in einer Woche verschifft werden kann. Und plötzlich kommt nichts mehr, keine Antwort mehr und Funkstille! Langsam machen wir uns sorgen und wissen nicht, was wir tun können. Wir möchten noch etwas an der Karibikküste in Kolumbien bleiben, allerdings auch unseren Camper verschiffen, damit as Vanlife auf der Panamericana weitergehen kann. So beschließen wir in den Tayrona Nationalpark in der Nähe von Santa Marta Halt zu machen und den Park anzuschauen. Der Tayrona Nationalpark ist ein Naturschutzgebiet in dem viele Tiere zu sehen sind. Es gibt dort einen Wanderweg entlang der Küste, der zu wunderschönen Sandstränden in der Karibik führt. Einer ist schöner als der andere. Aber es ist heiß und Vanlife bei dieser Hitze ist kaum möglich! Trotzdem haben wir den Aufenthalt sehr genossen und fahren mit dem Campervan weiter. Wir beschließen mit unserem Wohnmobil nach Cartagena zu fahren um herauszufinden was Sache ist und wann unsere Südamerikareise auf der Panamericana weitergehen kann. Cartagena ist zu der Zeit leicht überschwemmt und die Straßen sind sehr eng. Wir kommen mit unserem Kastenwagen kaum zurecht. Allerdings ist die Agentur so nett und schickt jemanden, der uns abholt und zur Verschiffungs Agentur bringt. Und es stellt sich heraus, dass unsere Verschiffungs Agentin super nett ist und bemüht ist allen Gerecht zu werden. Leider klappt unser Verschiffungsdatum für das Wohnmobil nicht und wir müssen knapp einen Monat warten. PA 2023
- eventId: 1387009
  start: 2026-10-04T14:10:00Z
  stop: 2026-10-04T14:26:00Z
  title: Sprintour - Wir fliehen aus Kolumbien
  subtitle: Sprintour - Wir fliehen aus Kolumbien
  description: Wir befinden uns momentan mit dem Wohnmobil in Kolumbien in Cartagena und wir halten es bei 33°C im Camper nicht aus. Wir können kaum schlafen und finden bei der extremen Hitze in Kolumbien keine Ruhe! Hier ist Vanlife einfach nicht möglich. Deshalb beschließen wir vor der Hitze zu fliehen. Wir fliegen auf die Insel San Andres. Sie befindet sich in der Karibik und gehört zu Kolumbien, obwohl sie tausende von Kilometer weit weg von Kolumbien ist. Und es ist angenehm. Es weht immer ein frischer Wind auf der Insel und man kann die Hitze hier gut ertragen. Angekommen in San Andres schauen wir uns dort den Hauptstrand an. Der ist schön, aber auch sehr voll. Vor allem weil viele kolumbianische Touristen dort Urlaub machen. Für drei Tage haben wir uns auf der karibischen Insel ein Moped gemietet und genießen es auf der 12 Kilometer langen Insel herumzudüsen. Leider fegt ein Zyklon über die Nachbarinseln und wir bekommen Starkregen und Überflutungen ab. Zum Glück können wir hier auf der Insel in der Karibik gut online arbeiten und sitzen den Regen aus. Am nächsten Tag können wir sogar eine Tour zu Rose Cay, Acuario machen. Es ist eine wunderschöne kleine Insel, die umgeben ist von Sandbänken und vielen Fischen. Das ist ein Traum in der Karibik, wäre da nicht der Massentourismus. Auf Rose Cay Acuario sind so viele kolumbianische Touristen, dass man kaum einen Platz für sich auf der so kleinen Insel findet. Noch einmal würden wir es nicht machen. Deshalb genießen wir lieber die Zeit an einem der schönen Strände auf San Andres, dem Playas de San Luis. SO kann man die Karibik auf jeden Fall genießen. Der Ausflug zum Big Pond, der Lagune mitten auf der Insel, hat sich gar nicht gelohnt. Jetzt geht es für uns zurück nach Cartagena, in die stehende Hitze und wir freuen uns gar nicht. Es erwartet uns viel Arbeit am Camper. Denn wir müssen den Camper kleiner kriegen, damit er in den Container für die Verschiffung von Kolumbien nach Panama passt. CO 2023
- eventId: 1387010
  start: 2026-10-04T14:30:00Z
  stop: 2026-10-04T15:07:00Z
  title: Sprintour - Der Camper passt nicht in den Container
  subtitle: Sprintour - Der Camper passt nicht in den Container
  description: |-
    Wir möchten unser Wohnmobil über das Darien Gap von Kolumbien nach Panama verschiffen. Allerdings ist unser Wohnmobil knapp drei Meter hoch und der Eingang vom Container ist gerade mal 2,57 Meter hoch. Wie bekommen wir einen VW Crafter in einen Container rein? Unser VW Crafter Camper hat ein Alu Cab Dachzelt mit Dachträger montiert. Und das alles muss ab damit unser Wohnmobil in einen Container für die Verschiffung nach Panama passt. Aber wohin mit dem Dachzelt?
    In Cartagena wartet viel Arbeit auf uns und wir starten damit den Camper niedriger zu machen. Die Hitze und extreme Luftfeuchtigkeit machen das Arbeiten in Kolumbien fast unmöglich. Nur irgendwie müssen wir an unser Ziel kommen. CO 2023
- eventId: 1387018
  start: 2026-10-04T15:10:00Z
  stop: 2026-10-04T15:43:00Z
  title: Sprintour - Unser 1000 Euro Fehler bei der Verschiffung
  subtitle: Sprintour - Unser 1000 Euro Fehler bei der Verschiffung
  description: |-
    Nach 14 Monaten Südamerika haben wir für 2200 $ unser Wohnmobil von Kolumbien nach Panama verschifft. Wir haben unseren VW Crafter, der eigentlich 3 Meter hoch ist, in einen 2,57 Meter hohen Container bekommen. Jetzt müssen wir nur noch unser Wohnmobil am Hafen in Panama abholen und dann kann die Reise nach Alaska auf der Panamericana eigentlich weitergehen. Die Abholung des Campers gestaltet sich allerdings schwieriger als gedacht.
    Nichts klappt wie es soll. Weder Flug, noch Abholung in Panama. PA 2023
- eventId: 1387019
  start: 2026-10-04T15:50:00Z
  stop: 2026-10-04T16:15:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Malaysia mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 2 - Malaysia mit Johann Lafer
  description: |-
    VIP Trip - Prominente auf Reisen 2: Begleiten Sie den mehrfach ausgezeichneten Sterne Koch Johann Lafer auf seiner kulinarischen Reise durch Malaysia. Die Hauptstadt Kuala Lumpur ist ein Schmelztiegel zahlreicher Kulturen. Dementsprechend strotzt auch die Küche der Millionen Metropole nur so vor Vielfalt. Angefangen bei den zahlreichen Garküchen Chinatowns im Zentrum der Stadt, führt uns unsere Reise zum Jalan Petaling Markt. Dieser Markt ist besonders bei den Einheimischen beliebt und bringt  durch seine Vielzahl von frischen und exotischen Zutaten sogar einen Sternekoch ins Staunen. Man sagt zwar das Auge isst mit, doch natürlich bekommt man ein besseres Gefühl für die Küche eines Landes.  So zeigt uns Johann Lafer auch, wie man die traditionellen malaysischen Satéspieße zuhause einfach zubereiten kann.
    Neben den zahlreichen Märkten der Stadt hat auch die Spietzenküche ihren Platz in Kuala Lumpur . So verschlägt es Johann Lafer ins Feast Village, einem im JW Marriot Hotel ansässigen Restaurant Komplex.  Dieser verkörpert  nahezu alles, was die asiatische Küche zu bieten hat.  So entdecken wir dort mit Johann Lafer zahlreiche exotische und vor allem extravagante Köstlichkeiten. Doch nicht nur vom  kulinarischen Standpunkt aus ist Malaysia eine Reise wert.  Genau wie die Küche ist auch die Gesellschaft ein Mix allerlei Religionen und Traditionen. Daher darf für Johann Lafer ein Besuch im Sari Moha Tempel, einen hinduistischen Tempel im Zentrum der Stadt oder ein Abstecher in die eindrucksvollen Badu Caves nicht fehlen. DE 2006
- eventId: 1387020
  start: 2026-10-04T16:20:00Z
  stop: 2026-10-04T16:39:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Ungarn mit Rike Schmid
  subtitle: VIP Trip - Prominente auf Reisen 2 - Ungarn mit Rike Schmid
  description: Begleiten Sie die Schauspielerin Rike Schmid auf einer Reise durch Ungarn, angefangen in der  Hauptstadt Budapest bis hin zu den Weinbergen im Süden des Landes. Von den Hügeln des Stadtteils Buda führt eine Eisenbahnstrecke durch kühle Wälder hinunter zur Donausmetropole. Der Zug wird übrigens von Kindern geführt, voller Stolz und Inbrunst übernehmen sie die Rolle der Schaffner. Budapest ist vor allem  für seine zahlreichen Bäder und heißen Quellen bekannt, viele von ihnen eingerahmt in prachtvoller Jugendstil-Architektur. Und in einem Bad wird Rike Schmid sogar noch zu einer Partie Schach im warmen Wasser eingeladen. Neben der ausgeprägten Badekultur verfügt Budapest auch über eine vielfältige Kaffeehaus-Kultur. Rike Schmid hat daher auch herausgefunden, wo es den besten ungarischen Strudel gibt, bevor sie sich in das Nachtleben im 7. Bezirk der Stadt stürzt. Von Budapest führt die Reise weiter zum Balaton, dem Plattensee. Ein Paradies für Segelfans und Biker, ganz gewiß.  Von hier aus ist es nicht mehr weit nach Pecs, dem früheren Fünfkirchen.  Hier trifft Rike Schmid auf Mitglieder der deutschen Gemeinde. Das multikulturelle Pecs ist ein städtebauliches Prunkstück, seine Geschichte führt bis in die Römerzeit zurück.  Reizvoll ist auch das umliegende Weinanbaugebiet, das zahlreiche edle Rotweine hervorbringt. Ein Ausritt durch die Weinberge und ein Besuch im Weinkeller rundet Rike Schmids Stippvisite in diesem Teil Ungarns ab. DE 2010
- eventId: 1387021
  start: 2026-10-04T16:40:00Z
  stop: 2026-10-04T16:59:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Russland mit Sigmar Solbach
  subtitle: VIP Trip - Prominente auf Reisen 2 - Russland mit Sigmar Solbach
  description: 'Eine Fahrt mit der transsibirischen Eisenbahn: Das war schon lange der Traum von Sigmar Solbach, den die deutschen TV-Zuschauer schon seit vielen Jahren kennen. Nach einer intensiven Stadtbegehung und einem Besuch des Kreml löst er in Moskau das Ticket bis zum Baikalsee. Am frühen Abend schließlich verläßt der Zug die russische Hauptstadt. Schnell werden an Bord Freundschaften geschlossen. Ein Russisch-Schnellkurs bietet dazu die richtige Gelegenheit, während draußen riesige Felder, Wälder und  kleinen russische Dörfer vorbeirauschen. Auf der Strecke liegt Kasan, das Zentrum des russischen Islam  mit seinen prachtvollen Moscheen. Der Zug nimmt dann die Strecke weiter ins Bergland des Ural, der die Grenze zwischen Europa und Asien bildet. Immer wieder hält der Zug an und gibt Sigmar Solbach und seinem Kamerateam die Möglichkeit, einen Eindruck vom traditionellen Landleben zu gewinnen. Das kleine Dorf Rechoti zum Beispiel bietet dazu die passende Gelegenheit.  Nach unendlich vielen Kilometern auf den Schienen und weiteren Erlebnissen entlang der Eisenbahntrasse erreichen Sigmar Solbach und seine Crew den Baikal, den tiefsten und ältesten Süßwassersee der Welt, um den sich zahlreiche Legenden ranken. Was jetzt noch fehlt, ist eine Bootstour.  Und die hat der Schauspieler auch schon gebucht. DE 2010'
- eventId: 1387032
  start: 2026-10-04T17:05:00Z
  stop: 2026-10-04T17:25:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  description: Begleiten Sie den beliebten Schauspieler Jürgen Heinrich in den tropischen Teil Australiens, nach Queensland. Dieser Teil des 5. Kontinents ist besonders für seine vielfältige Flora und Fauna bekannt. Die  Reise beginnt im kleinen Städtchen Noosa Heads. Mit seinen rund 4.000 Einwohnern ist Noosa Heads ein wahres Surferparadies und lädt mit seiner belebten Innenstadt und seinen herrlichen Stränden zum Verweilen ein. Per Schiff gelangt Jürgen Heinrich schließlich in die Noosa Everglades. Ein Wasser- und Sumpfgebiet in das sich Tausende von Vögeln und Reptilien wie Warane zurückgezogen haben. Das Great Barrier Reef mit seiner einzigartigen, aber auch höchst gefährdeten  Unterwasserwelt ist das nächste größere Ziel. Ein Helikopter setzt Jürgen Heinrich und sein Team auf Hayman Island ab.  Schon beim Flug dorthin werden die ersten Ausläufer des rund 2300 km langen Riffs deutlich.  Schon allein die Korallenformationen, welche sich durch das türkisblaue Wasser schlängeln, zeichnen ein aus der Luft erkennbares, atemberaubendes Bild. Am nächsten Tag geht es per Boot endlich ins Zentrum des Great Barrier Reefs und hier kann Jürgen Heinrich endlich in die weltberühmte Unterwasserwelt abtauchen. DE 2014
- eventId: 1387033
  start: 2026-10-04T17:25:00Z
  stop: 2026-10-04T17:44:00Z
  title: VIP Trip - Prominente auf Reisen 3 - South Australia mit Sigmar Solbach
  subtitle: VIP Trip - Prominente auf Reisen 3 - South Australia mit Sigmar Solbach
  description: Seien Sie dabei, wenn Sigmar Solbach durch South Australia streift. Begeistert von allerlei Kuriositäten und einer einzigartigen Tierwelt, erzählt der beliebte Schauspieler viele Geschichten rund um den kleinen Bundesstaat im Süden Australiens. Neben interessanten Erfahrungen in der freien Natur - wie etwa bei der Austernernte - begibt er sich auf die Spuren der ersten australischen Siedler. DE 2014
- eventId: 1387034
  start: 2026-10-04T17:50:00Z
  stop: 2026-10-04T18:10:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  subtitle: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  description: Dieses Mal präsentiert die TV-Moderatorin Andrea Kiewel das Land Israel. Auf ihrer Reise erforscht sie eine facettenreiche Reisedestination, die neben einer jahrtausendealten Kultur und vielen religiösen Heiligtümern zahlreiche weitere Attraktionen aufweisen kann. Erstes Ziel der Reise ist die Altstadt Jerusalems. Hier leben 45000 Muslime, Juden und Christen auf engstem Raum zusammen. Um diesen besonderen Lebensraum besser kennenzulernen, besucht Andrea Kiewel die wichtigsten Stätten der drei Weltreligionen. Dazu gehören unter anderen die Klagemauer und die Grabeskirche. Einer der bedeutendsten und eindrücklichsten Orte israelischer Erinnerungskultur ist die Gedenkstätte Yad Vashem. Sie erinnert an die Judenvernichtung im Holocaust. Zurück auf den gepflasterten Wegen der historischen Altstadt kann die Moderatorin den kleinen Geschäften und Souvenirständen kaum entkommen. Nach mehreren gescheiterten Versuchen, ein Andenken für zuhause zu 'erhandeln', verlässt sie schließlich die Stadt und macht sich auf den Weg zum Toten Meer. Eine lange Reise ist dies jedoch nicht. Nach eineinhalb Stunden Fahrzeit gönnt sich Andrea Kiewel ihr erstes Bad im stark salzhaltigen Gewässer ' natürlich ohne im Wasser unterzugehen. Das nächste Reiseziel ist die Weltstadt Tel Aviv. Die größte Stadt des Landes ist das Zentrum modernen israelischen Lebens. Zusammen mit dem deutschen Starkoch Tom Franz, der seit 2004 in der Stadt lebt, entdeckt sie die mediterrane Küche auf den vielen Märkten der Stadt. Zum Abschluss unternimmt sie einen Abstecher zu einem der vielen Strände, bevor sie in das Nachtleben der jungen und lebensfrohen Metropole eintaucht. DE 2016
- eventId: 1387050
  start: 2026-10-04T18:15:00Z
  stop: 2026-10-04T18:37:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Auf ins Erongo-Gebirge'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Auf ins Erongo-Gebirge'
  description: 'Nach unseren 10-stündigen Flug folgen Immigration, Kofferausgabe, Abholung durch das Camper-Unternehmen von Flughafen, Camper-Übergabe & Einweisung in das Fahrzeug, SIM-Karten-Kauf und großer Basic-Einkauf in Windhoek. Es folgen 1,5 Stunden Fahrtweg zum Omatozu-Camp nördlich der Hauptstadt. Auf den 4 Kilometern Sandweg von Hauptstraße zum Camp sehen wir immerhin direkt Kudus und Oryx-Antilopen. Pünktlich zum Sonnenuntergang ist unser Camper aufgebaut, ein erstes schnelles Abendessen zubereitet und darauf angestoßen, dass wir nun wirklich angekommen sind. Die erste Nacht im Camper schlafen wir ausgesprochen gut und fühlen uns am nächsten Morgen sehr fit. Also machen wir uns an das ordentliche, strukturierte Einräumen des Campers, nachdem wir am Anreisetag einfach alles erstmal reingeschmissen hatten. Nach zwei Stunden hat alles - von Bananen über die Badehose bis zum Besen - einen sinnvollen Platz für die nächsten Wochen gefunden. Ein erster Stopp ist nach 2 Stunden Fahrt an der Ameib-Ranch am Erongo Gebirge eingeplant, wo man nach Erwerb eines Permits auf einem kleinen Offroad-Trail und auf Wanderwegen unterschiedliche Felsformationen, wie den Elephant''s Head oder die Bulls Party, bestaunen kann. Es sind wahnsinnig schöne Felsformationen und es lohnt sich, hier etwas Zeit einzuplanen. In dem Gebiet gibt es zudem auch einige wilde Tiere, von denen wir jedoch nur Antilopen zu Gesicht bekommen. Was aber bestimmt daran liegt, dass wir zur Mittagshitze dort sind. Dann geht es zu einem absoluten Sehnsuchtsort, den wir bereits 2018 besuchten: Die Spitzkoppe. Unter einem der höchsten Berge Namibias kann man mitten in der Felslandschaft campen. Schon auf der direkt darauf zulaufenden Schotterstraße kommen viele Erinnerungen hoch. Spätestens bei der Stellplatzsuche vor Ort - wir stehen letztlich nur 30m entfernt vom damaligen Platz - , dem Sonnenuntergang und dem ersten Lagerfeuer dieser Reise sind wir wieder voll im Namibia-Fieber. NA 2023'
- eventId: 1387051
  start: 2026-10-04T18:40:00Z
  stop: 2026-10-04T18:57:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Durchs Ugab-Tal'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Durchs Ugab-Tal'
  description: Den Vormittag verbringen wir am Rock Arch mit Blick auf die Spitzkoppe. Auch hier an der Spitzkoppe lohnt es sich Spaziergänge zu machen und die Felsformationen zu erkunden. Dann geht es weiter Richtung Norden. Zwischenstopp im bereits bekannten Café Cactus & Coffee in Uis, dann noch weitere zwei Stunden Fahrt bis zur Gästefarm Bambatsi. Den Abend beschließen wir auf unserer Campsite mit unserem ersten Braai (afrikanisches Grillen) dieser Reise. Auf dem Weg zur Hauptstraße sehen wir auf dem Gelände der Gästefarm drei wunderschöne Giraffen! Das Programm für heute besteht aus der Besichtigung der Ugab Terrassen, riesiger Felsabbrüche in für zentralnamibische Verhältnisse recht grüner Landschaft. In Urzeiten floss der riesige Ugab River hier. Ein weiterer Stopp hier ist die Vingerklip (gegen eine kleine Eintrittsgebühr!) - eine 35m hohe Felsnadel. Interessant ist auch der Einblick in zwei Luxuslodges in der Region. Außerdem kann man von der Ugab Terrace Lodge eine Zipline fahren. Diese startet immer morgens um 08:00 Uhr und dauert insgesamt 1,5h bis 2h. Heute geht es aber weiter über den Ort Kamanjab (kleiner Supermarkt, Tankstelle und ATM) und wir übernachten erstmals in einer Safarilodge. Den Nachmittag verbringen wir mit Ausruhen am Pool und warten auf Tiere am Wasserloch (Zebras, Impalas). Nach einem sehr leckeren drei Gänge Menü geht es zum schlafen in ein typisch afrikanisches Rundhaus. Umso mehr freuen wir uns nun nach den ersten Großwildtieren auf den kommenden Tag im Etosha. NA 2023
- eventId: 1387058
  start: 2026-10-04T19:00:00Z
  stop: 2026-10-04T19:23:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Erste Tierbegegnungen im Etosha Nationalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Erste Tierbegegnungen im Etosha Nationalpark'
  description: Bevor wir das Galton Gate zum Etosha passieren, begrüßen uns beim Frühstück in der Lodge noch ein Kauz und ein Chamäleon. Es sollten natürlich nicht die einzigen Tiere des Tages bleiben. Im Etosha selbst sind wir heute etwa 150km unterwegs. Dabei begegnen uns insbesondere viele Zebras und Elefanten, am Wasserloch Jakkalwater ist es genau ein Elefant und ca. 200 Zebras um ihn herum. An einem anderen Wasserloch wiederum eine Herde von 25 Elefanten. Darüber hinaus noch einige Giraffen, Gnus, Kudus, Oryx, viele Springböcke, Strauße, ein Waran und ein Löwe, der in der Mittagshitze (ca. 35°C) döste. Am Spätnachmittag kommen wir an unserer Campsite mitten im Nationalpark an. Dieser und das dortige Wasserloch machen dem Namen Olifantsrus (Elefantenrast) alle Ehre, denn als wir zum Sonnenuntergang auf den Aussichtsturm sitzen, kommen gerade zwei Elefanten zum Spielen im Schlamm vorbei. In der Dunkelheit schleicht noch eine Hyäne vorbei. Ein ereignisreicher Tag geht zu Ende. NA 2023
- eventId: 1387059
  start: 2026-10-04T19:25:00Z
  stop: 2026-10-04T19:57:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  description: 'Hongkong einmal anders! Das ist das Motto der heutigen Folge. Begleiten Sie den umtriebigen Schauspieler Hannes Jaenicke quer durch ein Hongkong abseits der Touristenpfade.  Der Schauspieler beginnt seine Reise auf dem höchsten Punkt auf Hongkong Island und wagt von dort aus den Abstieg zu einem langen Sandstrand, der sich ideal zum Stehpaddeln eignet. Anschließend lässt er sich zu einer Radtour einladen. An Felsen klettern, vorbei an spektakulären Wasserfällen und tropischen Pflanzen: auch das ist in Hongkong möglich. Zu den beliebtesten Freizeitaktivitäten in der Weltmetropole gehört der Pferdesport, insbesondere Pferderennen locken jede Woche Tausende von Zuschauern an. Pferdewetten inklusive. Ein Spektakel, das sich Hannes Jaenicke nicht entgehen lässt.  Auch eine eindrucksvolle Kayaktour gehört zu Hannes Jaenickes Programm, vorbei an den zahlreichen kleinen Inseln Hongkongs, teilweise von Mangroven gesäumt. DE 2005'
- eventId: 1387060
  start: 2026-10-04T20:00:00Z
  stop: 2026-10-04T20:20:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Trentino mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 4 - Trentino mit Falk-Willy Wild
  description: 'VIP Trip - Prominente auf Reisen 4: Heute nimmt Sie Schauspieler Falk-Willy Wild mit nach Trentino. Ein ersten tiefen Eindruck hinterlassen die Gassen und Straßen der Stadt Trient. Was könnte dazu besser passen als ein frischer Aperol Spritz und ein Eis aus einer typisch italienischen Gelateria? Anschließend begiebt sich Willy in die spektakuläre Bergwildnis des Trentino. Die norditalienische Provinz gilt nicht von ungefähr als Wanderparadies, vor allem die Dolomiten im Norden und der Gardasee im Süden. Im Sommer verwandeln sich manche Bergregionen in Freilichtbühnen für Konzerte und andere musikalische Darbietungen. Philharmonische Konzert auf einer Almwiese oder unter Bergspitzen? Genau das! "I Suoni delle Dolomiti" lockt jährlich Künstler aus aller Welt an. Falk-Willy Wild genießt zudem die spannende Landschaft Trentinos auf dem Rad und auf auf dem Wildwasser. Bei einem Milchfest kauft der Schauspieler frischen Käse, den er später zur Pasta verarbeitet. Doch zu einem guten italienischen Essen gehört auch ein guter Grappa. Und so macht sich Falk-Willy Wild auf den Weg in eine lokale Destillerie, um sich über den Herstellungsprozess zu informieren. DE 2019'
- eventId: 1387061
  start: 2026-10-04T20:25:00Z
  stop: 2026-10-04T20:54:00Z
  title: Foodwise - Haikou
  subtitle: Foodwise - Haikou
  description: Willkommen in Haikou, auch bekannt als die Kokosnussstadt! Erleben Sie mit Tianran die kulinarische Kultur und den urbanen Charakter dieses tropischen Paradieses. Vom leichten und süßen Kokos-Hühnchen-Eintopf über erfrischende Kräuterdesserts bis hin zur würzigen Reissuppe. CN 2023
- eventId: 1387073
  start: 2026-10-04T21:00:00Z
  stop: 2026-10-04T21:29:00Z
  title: Foodwise - Hainan's Four Famous Dishes
  subtitle: Foodwise - Hainan's Four Famous Dishes
  description: Die atemberaubende Ostküste von Hainan im Südosten Chinas zieht zahlreiche Besucher an. Die vier berühmten Gerichte Hainans sind Huhn, Ente, Ziege und Krabbe. CN 2023
- eventId: 1387074
  start: 2026-10-04T21:35:00Z
  stop: 2026-10-04T21:57:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Auf ins Erongo-Gebirge'
