  title: Kultura na severu
  description: Dnešní Kultura na severu je přímo nabitá pozvánkami a to na koncert skupiny Laura a její tygři v Mostě, Dobrohraní Petra Lüftnera a spol. v Ústí nad Labem, vzpomínka na Karla Kryla v Roudnici nad Labem, oživlý středověk v Archeoskanzenu Březno u Loun a další tipy. Dnes také uzavřeme četbu z knihy Miloslava Nevrlého Chvála Zadní země aneb oslavné i zasněné toulání krajinou Labských pískovců.
