  title: Pochoutkový rok
  description: Za chvíli tu bude další díl narozeninového Pochoutkového roku. V něm vás čeká začátek hlasování pro recept desetiletí, ale ještě před tím nám ten poslední soutěžní recept připomene a upeče šéfkuchař Roman Paulus. Půjde o kynuté rohlíčky máčené v másle. Pak začne boj o ceny v podobě poukázek na nákup kuchyňského vybavení. Také vám dnes prozradíme něco o nové vánoční publikaci nazvané Vánoční pečení Josefa Maršálka a Patrika Rozehnala a představíme vám cukráře, který se postará o podzimní recepty v našem pořadu. Víc se dozvíte na webu pochoutkovyrok.cz nebo dnes po 10. hodině v našem vysílání.
