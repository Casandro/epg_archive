  title: Hvězdné návraty
  description: Nedělní odpoledne bude patřit jako každý den touto dobou zábavě, scénkám a českému humoru. To vše naplní další díl pořadu Hvězdné návraty, ve kterém bude Patrik Rozehnal vzpomínat na herecké začátky komika ze slavné herecké dynastie. Bavit vás totiž bude Václav Vydra. Uslyšíte jeho osobní vzpomínky, filmové ukázky, scénky a řadu anekdot, v jejichž vyprávění je mistr. Tak se s námi bavte po 16. hodině.
