  title: Terra X History
  subtitle: Mord und Totschlag. Kriminalität unterm Hakenkreuz
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentation, Deutschland 2024
    "Unter Hitler hat man sich immerhin sicher gefühlt." Die Kriminalgeschichte widerlegt diese bis heute verbreitete Mär: Serienmorde und Vergewaltigungen wurden damals nur oft totgeschwiegen.

    Unter den Nationalsozialisten haben Kriminelle oft freie Bahn. Ihre Taten werden mitunter vertuscht, um das angeblich lupenreine Bild nicht zu beflecken. Der Film zeigt das wahre Bild der Verbrechen unterm Hakenkreuz.
    HD-Produktion
- eventId: 1055154
  start: 2026-10-04T08:30:00Z
  stop: 2026-10-04T09:15:00Z
  title: Pakt der Diktatoren
  subtitle: Wie Hitler und Stalin den Weg in den Krieg planten
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2020
    Nazideutschland und die Sowjetunion sind ideologische Gegner und politische Rivalen. Dennoch kommt es im August 1939 zum Hitler-Stalin-Pakt. Was treibt die beiden Diktatoren zum Handschlag?

    Mit dem Abschluss des Nichtangriffspaktes klären die beiden Staaten ihr Verhältnis - und stecken Interessensphären ab. Ein geheimes Zusatzprotokoll regelt die Aufteilung Osteuropas. Es ist der letzte große Schachzug, bevor der Zweite Weltkrieg beginnen kann.
    HD-Produktion
- eventId: 1055156
  start: 2026-10-04T09:15:00Z
  stop: 2026-10-04T10:05:00Z
  title: Terra X History
  subtitle: SS - Macht und Mythos
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Sie war die Elitetruppe des Naziregimes - zugleich aber auch Inbegriff des Terrors. Als Vollstreckerin des Holocaust verantwortlich für millionenfachen Mord: die SS.

    Keine andere Organisation in Hitlers Reich steht so sehr für den tödlichen Rassenwahn des Regimes. Gleichzeitig war die sogenannte Schutzstaffel aber auch ein gefährliches und effektives Machtinstrument innerhalb der NS-Diktatur und Hitler bedingungslos ergeben.
    HD-Produktion
