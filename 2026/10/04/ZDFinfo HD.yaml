  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2016
    Das Zeichen steht für Terror und Mord. Unter Nazis gelten die beiden Runen als germanisch, dabei sind sie semitischen Ursprungs. Die Dokumentation erzählt die Geschichte der SS-Runen.

    Was fasziniert Menschen an den zackigen Blitzen? Stehen sie doch für beispiellose Brutalität - die Zeichen der Täter. Die Dokumentation zeigt ihre Bedeutung damals wie heute, enthüllt ihre Wirkung, ihre Träger und Erfinder - und zeigt, wie sie bis heute fortleben.
    HD-Produktion
