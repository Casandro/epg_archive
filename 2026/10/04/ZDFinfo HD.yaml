  title: Terra X History
  subtitle: Hitlers Hauptquartiere. Kommandozentralen des Bösen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Die Führerhauptquartiere waren die Schaltzentralen der NS-Diktatur. Hitler plante dort seine Feldzüge. Neben der Wolfsschanze standen ihm rund 20 weitere Bunkeranlagen zur Verfügung.

    Hitlers Hauptquartiere waren Täterorte, von denen beispiellose Verbrechen ausgingen. Vom Diktator als Denkmale für die Nachwelt gedacht, wurden die meisten bei Kriegsende gesprengt. Noch immer zeugen die Überreste der Bunker vom Wahn, Europa beherrschen zu wollen.
    HD-Produktion
- eventId: 1053981
  start: 2026-10-04T06:15:00Z
