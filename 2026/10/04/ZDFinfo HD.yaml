  description: "Deutschland 2022\nDas Klima unseres Planeten ändert sich rasant. Forschende warnen vor einer lebensfeindlichen Zukunft. Was auf Pflanzen und Tiere zukommen könnte, zeigen neue Einblicke in die Erdgeschichte.\n\nAuf der Erde herrschten bereits früher extreme Klimaphasen. Besonders für \neine sogenannte Superheißzeit vor 56 Millionen Jahren interessiert sich die Wissenschaft: Fossilienfunde aus dieser Epoche zeigen, wie tiefgreifend sich Ökosysteme damals verändert haben.\nHD-Produktion"
