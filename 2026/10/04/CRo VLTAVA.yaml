- eventId: 1431972
  start: 2026-10-04T15:00:00Z
  stop: 2026-10-04T16:00:00Z
  title: Vizitka
  description: Ondřej Veverka, režisér. Do kin vstoupil jeho první hraný film Osamělý vlk o špičkovém letci RAF Josefu Františkovi. Naší nedávné historie se týkal i jeho dokumentární debut Kuratorium a série My, občané Protektorátu a My, budovatelé republiky. Vztah k historii u něj zažehla jeho prababička, která mu vyprávěla o tom, jak se žilo během Druhé světové války. "Ve filmové tvorbě je zlo někdy zbytečně zjednodušováno až karikováno, přitom často bývá velmi složité a sofistikované. A pokud ho nebudeme vykreslovat tímto způsobem, pak nebudeme schopni rozeznávat jeho jemné počáteční fáze," konstatuje ve Vizitce. S jakými prameny pracoval? Odkud shromažďoval informace o Josefu Františkovi, který zahynul jen krátce po svých šestadvacátých narozeninách? A jak se točily záběry ve vzduchu? Na začátku září se Ondřeje Veverky ptala Karolína Koubová. Repríza ze 7. 9. 2026
