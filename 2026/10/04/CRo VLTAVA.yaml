  title: Krásné hlasy
  description: Pěli za Havla 2/2. Které světové hvězdy se představily v Praze za časů prezidentování Václava Havla? Jak bohatá epocha to byla na koncerty pěveckých celebrit? Napoví Felicity Lott, Agnes Baltsa, Matthias Goerne, Deborah Voigt, The King's Singers a další. V rámci projektu Slyšet Havla připravil a uvádí Vojtěch Babka.
