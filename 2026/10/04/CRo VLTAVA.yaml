  description: 'Maxim Gorkij: Stařík. Příběh starce posedlého touhou po pomstě. Přeložil František Hrdlička a Ludmila Hustolesová.Pro rozhlas upravila Vlasta Krautmanová. Hudbu složil Alois Palouček. Dramaturg Vladimír Gromov. Režie Olga Valentová. Hrají Ladislav Pešek, Karel Höger, Vítězslav Jandák, Daniela Kolářová, Jarmila Krulišová, Jiří Suk, Vlasta Matulová, Miloš Willig a další. Natočeno v roce 1974.'
