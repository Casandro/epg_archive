  title: Klassikwelt
  subtitle: mit Sophia Fischer
  description: Was ist los in der Welt der klassischen Musik? Wir stellen aktuelle Alben vor und sondieren das Konzertgeschehen in der Region und auf den Bühnen der Welt. Mit pointierten Moderationen und einem neugierigen Blick auf den Klassikmarkt. Musik vom intimen Kammerensemble bis zum großen Operngeschehen.
- eventId: 807389
  start: 2026-10-04T20:00:00Z
  stop: 2026-10-04T22:00:00Z
  title: Klassikwelt in concert
  subtitle: mit Sophia Fischer
  description: Das renommierte Vokalensemble Vox Luminis und das Freiburger BarockConsort erzählten bei diesem Musikfestkonzert im Jahr 2025 von Glaube, Vergänglichkeit und Abschied. Unter dem Motto "Von Trauer und Hoffnung" leitete Lionel Meunier durch einen Abend voll von strahlender und besinnlicher Barockmusik. In dieser Klassikwelt in concert schauen wir auf diesen besonderen Abend in der Bremer Kulturkirche St. Stephani zurück.
