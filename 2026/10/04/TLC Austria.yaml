  title: Tierisch verschluckt - Rettung für Fellnasen
  subtitle: Folgenschwerer Gaumenschmaus
  description: |-
    Terrier Norman wird ein vermeintlicher Leckerbissen zum Verhängnis: Ein riesiges Stück Ochsenziemer steckt in seiner Speiseröhre fest und muss dringend entfernt werden. Doch Dr. G entdeckt noch weitere Fremdkörper in seinem Magen. Bei Katzendame Daisy gibt dagegen ein aufgeblähter Bauch Rätsel auf - die Endoskopie soll Klarheit bringen. Und Rüde Baxter hat sich ein besonders kreatives Menü zusammengestellt: Gras, Holz und ein Stück Schnur haben sich in seinem Magen zu einem übelriechenden Knäuel verbunden. Dr. G muss wieder einmal viel Geduld und noch mehr Fingerspitzengefühl aufbringen.
    CAN 2024
