  title: My Strange Addiction
  subtitle: Butter-König und Katzen-Queen
  description: |-
    Abigail liebt Katzen über alles - und ihr Futter fast noch mehr. Seit 20 Jahren greift sie selbst zur Dose und verputzt täglich bis zu sieben Portionen Whiskas & Co. James dagegen hat Butter zum Lebenselixier erkoren: Rund neun Kilo verdrückt er im Monat, pur, flüssig oder als üppige Beilage. Für ihn gilt eindeutig: Je mehr Fett, desto besser. Tierra wiederum hat eine gefährliche Leidenschaft für Reinigungspulver entwickelt. Sie schnupft fast eine Dose täglich und schwebt danach kurz "auf Wolken". Doch Ärzte und Angehörige sind alarmiert: Alle drei riskieren mit ihren seltsamen Gewohnheiten ihre Gesundheit.
    USA 2025
  widescreen: true
