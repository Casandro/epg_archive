  description: |-
    Seit Brittany wieder in Jordanien ist, versucht sie herauszufinden, was Yazan bedrückt. Da seine Englischkenntnisse nicht so gut sind, hat er einen Übersetzer beauftragt, damit es keine Missverständnisse gibt. Doch als klar wird, dass Yazan riskiert, seine Familie zu verlieren, wenn er Brittany heiratet, zögert die Amerikanerin: Eine Ehe sollte nicht mit einem Zerwürfnis zu den Eltern beginnen. Auch in Südkorea steht die Hochzeit vor der Tür, und alles wird für die Ankunft von Deavans Eltern vorbereitet. Doch Jihoon ist besorgt, dass er es seiner Schwiegermutter in spe wieder nicht rechtmachen kann.
    USA 2020
