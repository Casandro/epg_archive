  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Jeanne und Brandon
  description: |-
    Jeanne hasst ihr Leben. Die 40-Jährige wiegt 319 Kilo, kann sich kaum bewegen und ist ganz auf die Hilfe ihrer Mutter angewiesen. Außerdem hat sie eine stark entzündete Wunde am Bein, die wegen mangelnder Hygiene immer schlimmer wird. Dr. Now sieht ihren Zustand als sehr kritisch an und verordnet einen Klinik-Aufenthalt mit überwachter Diät. Jeanne ist zunächst motiviert, denn sie wünscht sich nichts mehr als eine Magen-OP, doch dann wird ihre Mutter ins Krankenhaus eingewiesen, kurz darauf stirbt ihr Vater. So entscheidet sie sich, aus dem Abnehm-Programm auszusteigen und auf die OP zu verzichten.
    USA 2021
  widescreen: true
- eventId: 1412336
  start: 2026-10-04T16:20:00Z
  stop: 2026-10-04T18:15:00Z
  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Cillas und Tiffany
  description: |-
    Cillas ist so dick, dass er nur noch im Bett dahinvegetiert. Deshalb beschließt der Familienvater nach Houston zu fahren, um sich von Dr. Now behandeln zu lassen. Der 330-Kilo-Mann wird in die Adipositas-Klinik eingewiesen und unter strenge Diät gestellt. Nach einer deutlichen Gewichtsreduktion soll er in die Reha, um wieder laufen zu lernen. Und Cillas strengt sich extrem an, verliert über 100 Kilo und wird zu einer Magen-OP zugelassen. Danach purzeln weitere Pfunde, und Cillas hat bereits sein Zielgewicht von 98 Kilo im Visier. Cillas' größter Wunsch: Endlich für seine Familie sorgen zu können.
    USA 2021
  widescreen: true
- eventId: 1412348
  start: 2026-10-04T18:15:00Z
  stop: 2026-10-04T19:10:00Z
  title: 'Die Pfund-Schwestern: Unser Leben mit 500 kg'
  subtitle: Happy End für Amy und Brian
  description: |-
    Für Amy und Brian ist der große Tag gekommen: Doch bevor Amy vor den Altar tritt, gibt es reichlich Chaos. Das Brautkleid geht nicht zu, die Trauung verzögert sich und Brian kämpft mit seiner Fliege. Doch dann sorgt Tammy für eine Überraschung: Trotz des heftigen Streits mit ihrer Schwester taucht sie auf und entschuldigt sich. Die beiden wagen einen versöhnlichen Neuanfang. Nach einer emotionalen Trauung wird ausgelassen gefeiert, Brian versucht sich bei der ersten gemeinsamen Runde auf dem Parkett sogar im Breakdance. Dann starten sie per Pferdekutsche ins Eheleben - obwohl Amy vor Pferden Todesangst hat.
    USA 2025
  widescreen: true
- eventId: 1412349
  start: 2026-10-04T19:10:00Z
  stop: 2026-10-04T20:05:00Z
  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Christina und Paula
  description: |-
    Von allen Kandidaten hat Christina aus Houston, Texas, am meisten Gewicht verloren. Sie startete mit 320 Kilo und wog nach gut zwei Jahren nur noch 83 Kilo. Doch das war noch lange nicht genug für die frisch geschiedene Frau. Inzwischen geht es Christina gesundheitlich nicht mehr gut: Ihre frühere Esssucht hat sich in Magersucht verwandelt. Dr. Now muss seine Patientin nun dazu bringen, wieder Gewicht zuzulegen, aber das ist das Letzte, was Christina im Sinn hat. Doch was sie momentan noch mehr beschäftigt, ist der enorme Hautüberschuss, den sie sich operativ entfernen lässt, um endlich ihrem eigenen Schönheitsideal zu entsprechen.
    USA 2015
  widescreen: true
