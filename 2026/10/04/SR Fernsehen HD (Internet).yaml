  title: Nachtcafé
  subtitle: Die SWR Talkshow - Gäste bei Michael Steinbrecher
  description: "* Wahnsinn, Familie! \nDie heile Familie - eine schöne Vorstellung. Doch vielerorts mehr Schein als Sein. Vom Alltag im Ausnahmezustand bis zur emotionalen Belastungsprobe: Familie hat das Potenzial, das Leben so schön oder so schlimm wie möglich zu machen. \n\nGäste bei Michael Steinbrecher sind:\n* Schlagersänger Heino und sein Manager Helmut Werner verstehen sich als Familie\n* Hedwig Konz und Ursula Wilbois, sind die ältesten von drei Zwillingsgeschwister-Paaren\n* Daniel Haas, war als Einzelkind reicher, aber distanzierter Eltern sehr einsam\n* Jasmin Böhm, radelte als Alleinerziehende mit kleinem Sohn um die Welt"
- eventId: 1463809
  start: 2026-10-04T05:30:00Z
  stop: 2026-10-04T06:55:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
