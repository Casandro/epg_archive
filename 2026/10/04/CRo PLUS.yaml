  title: Téma Plus
  description: K největšímu únosu Čechoslováků došlo v březnu 1983 v africké Angole. Pracovníky místní papírny a jejich rodiny unesla protivládní organizace UNITA. Šestašedesát mužů, žen a dětí čekal náročný, více než dvouměsíční pochod napříč africkou divočinou. Na jeho konci byla propuštěna jen část z nich. Dvacítka mužů zůstala v zajetí ještě celý další rok. Jak na tuto událost po více než čtyřiceti letech někteří z nich vzpomínají? Co poradit těm, kteří by se dnes ocitli v podobné situaci? A jak jejich zkušenosti komentuje historik, psycholožka, diplomat či novinář? Dozvíte se v prvním dílu série Tématu Plus Unesení, uvěznění, zajatí - příběhy Čechů zadržených v zahraničí, který připravila Naďa Reviláková.
