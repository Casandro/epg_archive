- eventId: 1434214
  start: 2026-10-04T06:05:00Z
  stop: 2026-10-04T06:34:00Z
  title: Vertikála
  description: Papež Lev XIV. je na návštěvě Francie. V Německu církve hledají způsob, jak mluvit s voliči AfD. V Rusku se na frontu vracejí náboženské symboly a v Argentině lidé uctívají vlastní, církví neuznané světce. Kde dnes končí víra a začíná politika? Co chce papež říct Evropě, která řeší válku, rozdělení společnosti i krizi důvěry? A co nám náboženství sděluje o světě kolem nás? Také to jsou otázky, na které hledá odpovědi dnešní Vertikála. Moderuje Naděžda Hávová.
- eventId: 1434215
  start: 2026-10-04T06:34:00Z
  stop: 2026-10-04T07:00:00Z
  title: Vertikála
  description: Václav Havel z pohledu lidí, kteří ho osobně znali. Jaký byl člověk a jaký byl jeho vztah k víře? O tom je dnešní debata Vertikály. Své vzpomínky na prvního českého prezidenta připojí boromejka Angelika Pintířová a evangelický farář Miloš Rejchrt. Ptá se Eva Hůlková.
