  stop: 2026-10-04T05:33:00Z
  title: Online Plus
  description: Halucinace či nesrozumitelnost, aneb jak je na tom AI v oblasti řešení vědeckých témat? Online Plus v dnešním vydání věnuje pozornost tomu, jak umělá inteligence hledá odpovědi na otázky vědy a jaké jsou limity využívání nástrojů velkých jazykových a strojových modelů v oblasti výzkumu. Jaké téma nejvíc řeší vědecká komunita v tomto kontextu? Může AI zrychlit vývoj léků, nebo ve kterých oblastech lze očekávat raketový posun díky těmto technologiím? Moderuje David Slížek.
- eventId: 1434205
  start: 2026-10-04T05:33:00Z
  stop: 2026-10-04T06:00:00Z
  title: Stopy, fakta, tajemství...
  description: František Fajtl, válečný stíhač, generál a už za svého života legenda. I když stál mnohokrát tváří v tvář smrti, za hrdinu se ale nepovažoval. Do válečných dějin se zapsal také jedním mimořádně odvážným útěkem. V cyklu Stopy, fakta, tajemství o něm vypráví Stanislav Motl.
