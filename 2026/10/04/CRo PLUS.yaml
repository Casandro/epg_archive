  title: Historie Plus
  description: V socialistickém Československu téměř nebylo možné si za československé koruny koupit západní džíny, kosmetiku, elektroniku nebo dokonce auto. A přece je lidé měli. Umožňoval to černý trh a jeho obchodníci - veksláci. Poslouchejte sérii Fenomény socialistického Československa.
