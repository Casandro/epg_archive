  title: Mezi námi
  description: Jaká je aktuální společensko-politická situace v Řecku, a jak situaci vnímají Řekové žijící v Česku - o tom je speciál magazínu Mezi námi. Debatují Konstantinos Tsivos, historik a profesor na FF UK, který se věnuje novořecké historií a Alena Lídlová Georgiu, zastupitelka řecké menšiny v Radě vlády pro národnostní menšiny. Moderuje Libor Kukal.
