  title: Kultura Plus
  description: Pozvání na výstavu do Národní galerie Praha, kde si můžete nově prohlédnout obraz Egona Schieleho Sedící žena s pokračenými koleny má pro vás kulturní týdeník. Zavede vás také na výstavu v olomoucké Pevnosti poznání, kde je expozice 3D modelů ametystových umělých jeskyní. Pozvánky na výstavy i do Ostravy či Brna vám nabídne Michaela Vetešková.
