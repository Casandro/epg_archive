  description: |-
    Concert (Allemagne, 2021, 44mn) Avec sa coiffure punk et sa tenue excentrique, il a bouleversé le monde de la musique classique en 1989 : la version de Nigel Kennedy des Quatre Saisons d'Antonio Vivaldi est devenue l'album de musique classique le plus vendu de tous les temps. Ce documentaire jette un regard neuf sur cet enregistrement légendaire. Parmi les intervenants figurent notamment le violoniste vedette Maxim Vengerov, la créatrice de mode Esther Perbandt et le virtuose de la mandoline Avi Avital.

