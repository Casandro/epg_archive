  title: 'AC/DC : Forever Young'
  subtitle: 'AC/DC, ou trois frères au service de la musique. L''histoire d''un son unique qui a traversé cinquante ans de rock''n''roll : coupant, électrique, survolté.'
  genre:
  - '96'
  description: 'AC/DC ne réfère plus depuis bien longtemps au courant alternatif et au courant continu. Le groupe australien (bien que les frères Young soient tous nés en Écosse), actif depuis 1973, a conquis génération après génération dans le sillage d''un son unique, coupant, survolté, pensé par l''aîné, George, producteur et leader informel, et transmis à ses cadets, les deux guitaristes Malcolm et Angus. Repéré sur les scènes de Melbourne, épicentre du rock''n''roll australien à la fin des années 1960, volontiers provocateur dans ses tenues (dont l''uniforme culte d''écolier d''Angus Young, génial guitariste et véritable lapin Duracell sur scène), le groupe se forge une réputation de formation "énergique, vivante, drôle : rock''n''roll", selon les mots de Mark Evans, bassiste de la formation de 1975 à 1977. Après avoir sorti quatre albums en moins de deux ans, AC/DC entame des tournées marathon, leur recette secrète pour agréger les fans. Le Royaume-Uni tombe sous leur charme, suivi de près par les États-Unis. Angus Young, concentré sur son objectif (devenir l''un des meilleurs guitaristes du monde), proscrit toute drogue et tout alcool. Il sera bien le seul... Après la mort du chanteur Bon Scott en 1980, probablement décédé d''un coma éthylique, son remplaçant Brian Johnson propulse le groupe au sommet avec Back in Black, deuxième album le plus vendu de tous les temps. Concentré de hard rock Les documentaristes Dominique Mesmin et Marie-Claire Javoy orchestrent un hommage sur mesure au groupe, toujours debout : Power up, leur dernier album, date de 2020, malgré le décès de George et Malcolm en 2017. "C''est un atavisme écossais", s''en amuse l''un des musiciens : "Ils vont jusqu''au bout." Émaillé d''archives d''Angus Young en entretien et des témoignages de proches et d''anciens musiciens de la formation, un concentré de hard rock pur jus qui a fait l''histoire. Réalisateur: Marie-Claire Javoy (2022)'
