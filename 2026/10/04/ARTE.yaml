  title: 'L''ancien fait peau neuve : Une nouvelle vie pour des bâtiments historiques'
  subtitle: Des musées S01 E01. L'architecture des musées repose très souvent sur un dialogue entre l'ancien et le moderne.
  genre:
  - '32'
  description: 'L''architecture des musées repose très souvent sur un dialogue entre l''ancien et le moderne. Ainsi, de nombreux projets de rénovation et d''agrandissement apportent un contrepoint formel aux structures existantes par le choix des matériaux, des formes ou des teintes. Ce jeu de contrastes est pensé comme un dialogue avec la structure originelle, qui demeure généralement un élément central du bâti. Dans le 13e arrondissement de Paris, la Fondation Pathé se distingue par une gigantesque coque recouverte de volets en aluminium qui s''intercale entre deux immeubles haussmanniens. Dans la ville allemande de Halle-sur-Saale, lors de la rénovation et de l''extension du château de Moritzburg, toutes les structures d''origine encore existantes ont été sauvées, permettant à un nouveau musée d''être construit à l''intérieur même des vestiges. Réalisateur: Sabine Reeh (2023)'
