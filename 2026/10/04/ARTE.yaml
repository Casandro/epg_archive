  title: Tracks East
  subtitle: E24. "Tracks East" se penche sur le nouveau cap pris par la République tchèque, un pays qui apparaît plus que jamais divisé.
  genre:
  - '32'
  description: 'Lutte contre le réchauffement climatique, aide à l''Ukraine, respect des engagements européens : sur presque toutes ces questions, la République tchèque opère un tournant radical depuis le retour au pouvoir du premier ministre Andrej Babis en décembre 2025. Car avec sa coalition de partis populistes et nationalistes, c''est désormais une ligne résolument eurosceptique qui s''impose. Tout juste fondé en 2022, une formation défendant la "voix des automobilistes" (Motoristé sobe) a même fait son entrée au gouvernement. Le coeur de son électorat : de jeunes hommes. Pour tenter de comprendre cette ascension, le journaliste d''investigation Dávid Pásztor a rencontré Adam Sejna. À 19 ans, cet influenceur de la droite conservatrice fait un véritable tabac sur les réseaux sociaux. Cette "droitisation" des esprits inquiète les citoyens tchèques comme la chanteuse Amelie Siba, qui craint pour l''avenir de la scène culturelle. Pourtant, s''il y a un point sur lequel beaucoup de Tchèques s''accordent, c''est la fierté que leur inspire "La petite taupe". Cette série télévisée d''animation est un produit d''exportation phare qui est même devenu un symbole culturel fédérateur par excellence. Son personnage principal joue d''ailleurs un rôle central dans le projet imaginé par l''artiste Jakub Jansa pour le pavillon tchèque de la Biennale de Venise. (2026)'
