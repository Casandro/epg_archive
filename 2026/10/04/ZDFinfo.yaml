  stop: 2026-10-04T19:00:00Z
  title: Der Zweite Weltkrieg
  subtitle: Der Überfall
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Am 1. September 1939 eröffnet das Kriegsschiff "Schleswig-Holstein" das Feuer auf die Halbinsel Westerplatte bei Danzig. Es ist der Auftakt zu einem Krieg, der Europa ins Chaos stürzt.

    Nach dem Abschluss des deutsch-sowjetischen Nichtangriffspakts fühlt sich Hitler stark genug, loszuschlagen. Die Wehrmacht überfällt Polen. Von Anfang an wird der Krieg mit hoher Brutalität geführt und kostet Zehntausende Zivilisten das Leben.
    HD-Produktion
- eventId: 1067451
  start: 2026-10-04T19:00:00Z
  stop: 2026-10-04T19:40:00Z
  title: Der Zweite Weltkrieg
  subtitle: Angriff auf Europa
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Nach dem Überfall der Wehrmacht auf Polen im Herbst 1939 nimmt Hitler Dänemark und Norwegen ins Visier. An der Westfront hingegen herrscht eine seltsame Phase der Ruhe - noch.

    Obwohl sich die nationalsozialistische Diktatur mit England und Frankreich im Krieg befindet, gibt es im sogenannten Sitzkrieg kaum militärische Auseinandersetzungen. Das ändert sich im Frühjahr 1940 mit dem Beginn des deutschen Westfeldzuges.
    HD-Produktion
- eventId: 1206402
  start: 2026-10-04T19:40:00Z
