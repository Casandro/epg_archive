  description: |-
    Deutschland 2018
    Nach dem Sieg über Frankreich ist Hitler auf dem Höhepunkt seiner Macht. Er und seine Verbündeten in Italien und Japan wollen die Welt unter sich aufteilen.

    Doch es gibt Rückschläge. Im August 1940 werfen britische Fliegerverbände als Vergeltung für die vorangegangenen deutschen Luftangriffe auf England die ersten Bomben über Berlin ab.
