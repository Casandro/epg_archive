  title: Terra X History
  subtitle: Hitlers Hauptquartiere. Kommandozentralen des Bösen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Die Führerhauptquartiere waren die Schaltzentralen der NS-Diktatur. Hitler plante dort seine Feldzüge. Neben der Wolfsschanze standen ihm rund 20 weitere Bunkeranlagen zur Verfügung.

    Hitlers Hauptquartiere waren Täterorte, von denen beispiellose Verbrechen ausgingen. Vom Diktator als Denkmale für die Nachwelt gedacht, wurden die meisten bei Kriegsende gesprengt. Noch immer zeugen die Überreste der Bunker vom Wahn, Europa beherrschen zu wollen.
    HD-Produktion
- eventId: 1053990
  start: 2026-10-04T06:15:00Z
  stop: 2026-10-04T07:43:00Z
  title: Attentat auf Hitler
  subtitle: Stauffenberg und der deutsche Widerstand
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Am 20. Juli 1944 hängt Deutschlands Zukunft an seiner Tat: Oberst Stauffenbergs Attentat auf Hitler könnte den Krieg beenden und Millionen Menschenleben retten. Der entscheidende Versuch.

    Stauffenberg ist nicht allein. Die 90-minütige Dokumentation erzählt den dramatischen Verlauf des Schicksalstages vor 80 Jahren. Und porträtiert todesmutige Menschen in einem weitverzweigten, wenig bekannten Netzwerk des Widerstands gegen die totalitäre Diktatur.
    HD-Produktion
