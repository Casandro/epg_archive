    Am 6. Juni 1944 landeten alliierte Truppen an der Küste der Normandie. Der D-Day war der Auftakt für blutige Schlachten.

    Die Kämpfe in der Normandie hielten die Welt wochenlang in Atem. Die Wehrmacht wehrte sich verbissen gegen die Angriffe der Amerikaner, Briten und Kanadier. Doch die Materialüberlegenheit der Alliierten wurde immer erdrückender.
