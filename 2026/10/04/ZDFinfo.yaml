  title: Der Zweite Weltkrieg
  subtitle: Die Welt am Abgrund
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Im Morgengrauen des 22. Juni 1941 greifen Wehrmachtsverbände die Sowjetunion an. Damit beginnt ein fast vier Jahre andauernder verbrecherischer Krieg, der Millionen Opfer kosten wird.

    Den Generälen der Wehrmacht hat Hitler bereits Monate zuvor klargemacht, was er vom Krieg gegen die Sowjetunion erwartet. Ein "Vernichtungsfeldzug" soll es werden, zur völligen Zerschlagung des sowjetischen Staates und Ausbeutung seiner Bevölkerung.
    HD-Produktion
