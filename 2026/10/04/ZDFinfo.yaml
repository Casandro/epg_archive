  title: Der Zweite Weltkrieg
  subtitle: Vernichtungskrieg
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Im Winter 1941/42 wird klar: Der erhoffte schnelle Sieg gegen die Sowjetunion bleibt eine Illusion. Hitlers Regime setzt jetzt alles daran, wenigstens das zweite Ziel zu erreichen.

    Hitlers ideologisches Hauptziel: die "Endlösung der Judenfrage". Anfang 1942 nehmen die ersten Vernichtungslager ihren Betrieb auf, der monströse Massenmord an Europas Juden nimmt seinen Lauf. Zugleich schlagen die Alliierten erstmals auf deutschem Boden zurück.
    HD-Produktion
