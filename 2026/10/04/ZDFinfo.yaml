  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Sie waren Väter, Brüder, Söhne - und zogen als Soldaten der Wehrmacht in den Zweiten Weltkrieg. "ZDF-History" erzählt, wie normale Männer den Alltag zwischen Leben und Tod erlebten.

    Die Kriegserfahrung prägte das Leben von Millionen deutscher Männer. Manche erzählten davon, viele schwiegen. Diese "Erlebnisgeneration" ist nicht mehr unter uns - doch bieten Tagebücher und Briefe Einsichten in ihren Kriegsalltag, in ihr Denken und Fühlen.
    HD-Produktion
