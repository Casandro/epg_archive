  description: 'Kristijan teško skriva svoje osjećaje prema Evi, a to primjećuje i sama Eva, ali i Sofija. Andrija ljubomorno zabrani Juliji da se viđa s Matoševićem iz Zagreba, na što mu Julija bijesno odbrusi kako će se viđati s kime ona želi. Sofija napomene Evi kako je očito da se nešto događa između nje i Kristijana, ali Eva je uvjerava u suprotno. Ruža je sretna što je Nikola dobre volje zbog zajedničkog ručka s Adelom i Ivanom. Augustina smišlja plan kako pomiriti Ladu i Natašu. Adela se nesvjesno trzne i odmakne na Ivanov dodir, te shvati da je pogriješila. Nikola je ponovno grub prema Ruži koja više ne može susprezati bijes. Kristijan dolazi k Evi vratiti joj naušnicu, te ostane malo zatečen kad tamo ugleda Andriju. Augustinin plan pomirbe između Lade i Nataše pada u vodu. Nikola i Adela se dogovaraju za susret pokraj rijeke Sivke gdje će najlakše izbjeći tuđe poglede. Julija vodi malog Petra na pregled k doktoru Ottu koji joj savjetuje da i dalje izbjegava konfliktne situacije kako se Petar ne bi uzrujavao. Zabrinuta Lada dolazi pitati Sofiju da li zna što se događa s Natašom, što samo potvrdi Sofijine sumnje da nešto ne štima. Adela kaže Nikoli da je čvrsto odlučila spasiti svoj brak. Eva je zatečena kad otvori vrata i ugleda Juliju s malim Petrom. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
