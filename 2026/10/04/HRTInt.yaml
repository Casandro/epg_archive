  title: Parni valjak feat. Igor Drvenkar, Tvornica Kulture 10.10.2023. - 2. dio
  subtitle: ' '
  description: '"Naš Zagreb, srce ste nam ispunili. Kada se ovako nešto dogodi, poželimo vam pojedinačno svakome zahvaliti i čvrsto vas zagrliti." Nakon što su u posljednjih nekoliko mjeseci održali više od 15 koncerata diljem regije, Parni Valjak je 10. listopada 2023. stigao i pred zagrebačku publiku. U prepunoj Tvornici kulture održali su prvi nastup u Zagrebu u svom novom poglavlju s Igorom Drvenkarom te su zajedno sa svojom publikom priredili vrhunsku koncertnu atmosferu i, prema reakcijama, nadmašili sva očekivanja. Riječ je ujedno i o prvom snimljenom koncertu Parnog valjka s Igorom.  Drugi dio počinje s "Uhvati ritam". Slijedile su pjesme "Bogati će pobjeći na Mars", "Prokleta nedjelja", "Vrijeme", "Molitva", "Dođi", "Otkud ti pravo", "Opet se smijem", "Lutka za bal", "Ugasi me", "U prolazu" i "Sve još miriše na nju". Parni Valjak je ovom prilikom uživo predstavio svoj izniman koncertni spektakl koji su od svibnja 2023. izvodili diljem regije - od klupskih prostora i proljetne turneje u Zadru, Rijeci, Ljubljani i Mariboru pa sve do open-air pozornica i nastupa u ljetnim mjesecima pred desecima tisuća ljudi.'
