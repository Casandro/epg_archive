  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Kurz vor seinem 90. Geburtstag arbeitet Giora Feidman an seinem neuen Album \"For A Better World\" - während im Nahen Osten erneut Krieg herrscht. \nDie Dokumentation begleitet ihn zwischen Tel Aviv, Hamburg und Zürich und zeigt einen Künstler, der persönliche Verluste, politische Realität und künstlerische Verantwortung zusammendenkt."
