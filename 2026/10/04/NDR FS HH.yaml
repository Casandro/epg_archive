  subtitle: Fernsehfilm Deutschland 2007
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: Juliane Kostner, eine modebewusste und weltgewandte Dame im besten Alter, arbeitet als Chefeinkäuferin eines Berliner Nobelkaufhauses. Als ihre hochschwangere Tochter Henrike, zu der sie kein sonderlich gutes Verhältnis hat, nach einem Schwächeanfall ins Krankenhaus eingeliefert wird, muss Juliane für einige Wochen auf ihre beiden Enkel aufpassen - für die dynamische Powerfrau kein Problem. Allerdings ist Henrike von "Oma Julianes" lockeren Erziehungsmethoden alles andere als begeistert.
