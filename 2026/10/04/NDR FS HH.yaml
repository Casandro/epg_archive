  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wenn die Tage wieder kürzer werden und draußen die ersten Blätter fallen, darf es beim Essen auf dem Teller gerne etwas herzhafter werden. In einer neuen Ausgabe von "DAS! Kochstudio" laden Fernsehköchin Zora Klipp und NDR Moderatorin Inka Schneider zu einem Drei-Gänge-Menü, das herbstliche Aromen mit alpenländischen Küchentraditionen verbindet.
- eventId: 651655
  start: 2026-10-04T04:00:00Z
  stop: 2026-10-04T04:45:00Z
  title: Nordtour
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Landschaften und Sehnsuchtsorte, originelle Typen, Lifestyle, Kultur und kulinarische Köstlichkeiten: Mit der "Nordtour" entdecken Sie die schönen Seiten von Norddeutschland. Und das in ihrer ganzen Vielfalt in Niedersachsen, Schleswig-Holstein, Hamburg und Mecklenburg-Vorpommern. Das wöchentliche Magazin bietet einen unterhaltsamen Mix aus Service und Inspiration für die abwechslungsreiche Freizeitgestaltung. Nadja Babalola und Thilo Tautz moderieren die Sendung im wöchentlichen Wechsel.

