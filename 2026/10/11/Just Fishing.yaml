  title: Graskarpfen - Eskalation im Kescher
  subtitle: Graskarpfen - Eskalation im Kescher
  description: Was wir auf dieser Tour erlebten war der Hammer! Heiße Tage, 26 Grad Wassertemperatur, brutales Angeln im Schilf und Eskalationen im Kescher. Die Grasfische sind voll eingestiegen und haben uns ordentlich auf Trapp gehalten. Vorallem der Sommer mit hohen Wassertemperaturen ist die Topzeit um die vorsichtigen Asiaten zu übelisten. Graskarpfen drehen bei hohen Wassertemperaturen richtig auf und fressen die Futterplätze leer. An welchen Spots und mit welchem Futter wir die Torpedos gefangen haben, zeigen ich euch im Video. Viel Spaß und gute Unterhaltung! DE 2018
