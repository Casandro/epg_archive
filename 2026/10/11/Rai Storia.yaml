  title: 'La Grande Storia - Anniversari Due papi '
  subtitle: La Grande Storia - Anniversari Due papi e 2.500 vescovi. Il Concilio Vaticano II - L 11 ottobre 1962 papa Giovanni Paolo XXIII, al secolo Angelo Giuseppe Roncalli, dichiarava aperto il Concilio Vaticano II
  description: |-
    . Era stato lo stesso pontefice a indirlo, nel gennaio 1959, a soli tre mesi dalla sua elezione al soglio di Pietro. La scelta avveniva in un momento in cui la Chiesa era percorsa da tendenze teologiche innovatrici che rispecchiavano lo spirito dei tempi, lo spirito di un mondo che rifletteva il conflitto tra modernità e conservazione. L importanza del Concilio Vaticano II, che raccoglieva da tutto il mondo quasi 2.500 cardinali, patriarchi e vescovi, è ancora oggi al centro del dibattito storico e dottrinale. Papa Giovanni XXIII moriva pochi mesi dopo l apertura del Concilio, il 3 giugno 1963. La scomparsa del pontefice non provocava tuttavia la sospensione del sinodo, che continuava sotto la guida del nuovo papa Paolo VI. Il Concilio si sarebbe concluso tre anni dopo, l 8 dicembre 1965. A sessant anni dall evento La Grande Storia Anniversari ne racconta i momenti principali. La puntata, che si avvale di avvale di importanti materiali di repertorio e delle interviste agli storici Enrico Galavotti e Federico Ruozzi. - Con Paolo Mieli. Un programma di Peter Freeman, Andrea Orbicciani

    regia di Paola Lasi
