- eventId: 1279975
  start: 2026-10-11T19:00:00Z
  stop: 2026-10-11T19:10:00Z
  title: Süd Blick vom 11.10.2026 (Wh.)
  subtitle: Das Urteil - Ex-Bundespolizistin für Vergewaltigung verurteilt +++ 13,4 Millionen Euro Investition - Rosenheim will Parkhaus P1 erneuern +++ Stadtratsfraktion stellt Antrag bezüglich Mittagsverpflegung
  description: 'Wegen schwerer Vorwürfe gegen eine frühere Bundespolizistin hat das Landgericht Traunstein heute das Urteil gesprochen: Die Angeklagte stand unter anderem wegen der Vergewaltigung einer 14-Jährigen und wegen Besitzes von Kinderpornografie vor Gericht. +++ Rosenheim plant den 13,45-Millionen-Euro-Neubau des fast 40 Jahre alten Parkhauses P1 am Hammerweg mit 700 statt 450 Stellplätzen, Baubeginn 2028 und Fertigstellung 2029, doch neue Gebühren und fehlendes Verkehrskonzept sorgen im Stadtrat für Streit. +++ In Rosenheim sollen Familien fürs Schulmittagessen nicht länger je nach Schule und Caterer unterschiedlich zahlen: Die Grünen fordern eine einheitliche Gebühr mit sachlich begründeten Ausnahmen, sozial gestaffelten Rabatten über den Grünen Pass und wenig Bürokratie, doch die Finanzierung ist offen.'
- eventId: 1279976
  start: 2026-10-11T19:10:00Z
  stop: 2026-10-11T19:20:00Z
  title: Süd Blick vom 11.10.2026 (Wh.)
  subtitle: Urteil zur Kampenwandbahn gefallen +++ 30 Jahre Stadtmuseum Neuötting +++ Weidefasswagen für durstige Tiere in Mühldorf
  description: Der Bayerische Verwaltungsgerichtshof erlaubt den Neubau der Kampenwandseilbahn in Aschau, verlangt aber eine erneute Prüfung von bis zu 79 Sonderfahrten jährlich wegen möglicher Störungen streng geschützter Birkhühner. +++ Neuötting blickt auf 1000 Jahre Geschichte zurück und feiert 30 Jahre Stadtmuseum, das seit 1996 als Erlebnisort, Galerie und Kulturzentrum wirkt und zum Jubiläum neue Attraktionen wie ein Stadtmodell und eine Brand-Erlebnisstation zeigt, während die Politik mehr Geld für klamme Kommunen fordert. +++ Im Landkreis Mühldorf sichern Bund Naturschutz und Landwirte mit Wilden Weiden die Artenvielfalt, doch Dürre und Hitze lassen Wasser knapp werden, weshalb zwei Stiftungen 15.000 Euro für einen mobilen 2000-Liter-Weidefasswagen spendeten, der Tiere rechtzeitig versorgt.
- eventId: 1279977
  start: 2026-10-11T19:20:00Z
  stop: 2026-10-11T19:30:00Z
  title: Süd Blick vom 11.10.2026 (Wh.)
  subtitle: Glasausstellung feiert Leistung der Vertriebenen in Waldkraiburg +++ Ecologies of Time in der Studienkirche Burghausen
  description: Eine Ausstellung im Foyer des Waldkraiburger Rathauses verbindet 15 Jahre neu gestaltetes Glasmuseum mit 80 Jahren Ankunft der Vertriebenen im Landkreis Mühldorf, die ihr Glas-Handwerk mitbrachten, Firmen gründeten und so den wirtschaftlichen Aufschwung der Region prägten. +++ Zeit ist mehr als das, was unsere Uhren anzeigen. In der Studienkirche St. Josef in Burghausen beschäftigt sich die Ausstellung Ecologies of Time mit der natürlichen Zeit - und damit, was passiert, wenn wir unseren Blick auf die Zeit verändern. Im Mittelpunkt steht dabei die Salzach.
