  description: "* 13:45 Der Stichtag: 1971 \"Imagine\" erscheint\nDer Traum von einer besseren Welt wird John Lennons erfolgreichstes Sololied.\nAutor: Thomas Hartmann\n\n* 15:05 Uhr - MDR KULTUR - Diskurs: Landesarchäologe Harald Meller: Graböffnung zeigt, wie Otto der Große wirklich war\nMit dem Museumsdirektor und Landesarchäologen von Sachsen-Anhalt sprach Geschichtsredakteur Stefan Nölke \nEs ist der Traum eines jeden Archäologen: Einmal ein Kaisergrab öffnen und mit den neusten Techniken der Archäogenetik und Mikrobiologie zu untersuchen. Für Harald Meller, Landesarchäologe von Sachsen-Anhalt und Direktor des Museums für Vorgeschichte in Halle, wurde er wahr. Unter seiner Leitung hat ein ganzes Team von Archäologen und Naturwissenschaftlern in den Jahren 2025 und 2026 das Grab Otto des Großen (936 - 973) im Magdeburger Dom geöffnet und akribisch erforscht. Eine wahnsinnig spannende Aktion. Und spektakulär sind auch die Ergebnisse, die Harald Meller nun zusammen mit dem Wissenschaftsjournalisten Kai Michel in seinem neusten Buch \"Im Herzen der Macht\" (erschienen bei DTV) beschreibt. Wobei es darin nicht nur um Kaiser Otto I., sondern generell um die Frage geht, was die Archäologen über die Epoche der Ottonischen Herrscher - die Rede ist von der Zeit zwischen 919 und 1024 - in den letzten Jahren herausgefunden haben. Über diese Spurensuche zu \"Deutschlands dunklen Anfängen\", wie es im Untertitel heißt, spricht Harald Meller mit MDR Kultur-Geschichtsredakteur Stefan Nölke.\n\n\nMit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem \"Das schöne Buch\".\nMit den Sendungen: Diskurs um 15:05 Uhr, um 17:05 Uhr MDR KULTUR Folk und Welt \nund um 18:05 Uhr MDR KULTUR trifft."
