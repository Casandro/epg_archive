  title: MDR KULTUR Café
  description: |-
    Den Chanson in Deutschland hat sie revolutioniert. Ihre Texte sind voller Poesie, voller Doppeldeutigkeiten und voll mit trockenem Humor. Musik, die verführt, gleichzeitig aber auch provoziert, und das schon seit ihrem allerersten Lied "Das Spiel". 2004 war das und ihr Markenzeichen damals wie heute ist ihre einzigartige, unverwechselbare Stimme. Zu hören gibt es diese Stimme auf ihrem neuen Album "Sehnsucht" und bei ihrer Deutschlandtour, die sie auch nach Mitteldeutschland bringt. Wie aus dem Mädchen aus Sachsen-Anhalt die Frau wurde, die heute ein Synonym für deutsche Chansons ist, ob so eine markante, aber auch polarisierende Stimme eher Fluch oder Segen ist, und warum es gar nicht so schlimm ist, älter zu werden, das erzählt Annett Louisan im MDR KULTUR Café.

    Eine Sendung von Kerstin Poppendieck

    Gespräche in entspannter Atmosphäre mit  prominenten Gästen, die persönliche Einblicke in ihr Leben geben und über aktuelle Projekte berichten.

    Redaktion: Gabriele Bischoff
  subtitle: mit Musikerin Annett Louisan
