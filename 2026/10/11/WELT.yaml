  stop: 2026-10-11T16:28:00Z
  title: Lost Places - Folge 84
  subtitle: Lost Places - Folge 84
  description: 'Die St. Catherine''s Island ist eine winzige walisische Insel mit einer verfallenen Festung, die zu einer tierischen Sensation wurde, als dort in den 60er-Jahren ein Zoo errichtet wurde. Außerdem in dieser Folge: Ein bedeutendes Wasserwerk, welches den in New York verbreiteten Seuchen Einhalt gebot, eine Parteihochschule im kroatischen Grenzgebiet, die elitären Studierenden die Bedeutung des Sozialismus vermitteln sollte und die Ruinen der wohl mächtigsten Maya-Städte im mexikanischen Dschungel.'
  widescreen: true
