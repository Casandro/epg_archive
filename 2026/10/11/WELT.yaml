  title: Lost Places - Folge 85
  subtitle: Lost Places - Folge 85
  description: 'Ein argentinisches Luxushotel mit dem Namen Edén wurde in den 1920er und 30er Jahren zum Paradies für Nazi-Sympathisanten. Welche Verbindung hatten die Hoteliers Walter und Ida Eichhorn zu Adolf Hitler? Außerdem: Der sündhaft teure Lust-Tempel des korrupten Polizeichefs von Mexiko-Stadt. Die unglaubliche Geschichte der Eroberung einer französischen Festungsanlage im Ersten Weltkrieg. Und: Elvis forever - die Hollywood-Connection eines Urlaubsresorts auf der hawaiianischen Insel Kauai.'
  widescreen: true
