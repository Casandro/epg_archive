  title: Lost Places - Folge 77
  subtitle: Lost Places - Folge 77
  description: 'Die Insel Peleliu ist gezeichnet von seiner Vergangenheit: Überwucherte militärische Relikte erinnern an eine grausame Schlacht. Die Festung Fort Alexander vor der Küste von St. Petersburg wurde zur Verteidigung erbaut, im Jahr 1897 wurde dort ein Labor zur Untersuchung der Pest errichtet. Eine abgelegene, hufeisenförmige Ruine in Rumänien hielt einst hunderte Verbrecher gefangen. Und die Ruinen in der Geisterstadt Puerto Cristal im Süden Chiles erinnern an längst vergangenen Wohlstand.'
