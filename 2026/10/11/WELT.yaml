  title: Lost Places - Folge 87
  subtitle: Lost Places - Folge 87
  description: 'Eine märchenhafte Architektur inmitten eines Sees beeindruckt bis heute die Besucher des französischen Schlosses De La Mothe-Chandeniers in Les Trois-Moutiers. Hinter den Mauern verbirgt sich eine dramatische Geschichte jahrelanger Vernachlässigung und eines tragischen Brandes, von welchem sich das Schloss nie vollständig erholen konnte. Ebenfalls in dieser Folge: eine unterirdische Stadt im Herzen der Türkei und ein Krankenhaus in Kansas City, welches für soziale Gleichberechtigung kämpfte.'
  widescreen: true
