  title: Lost Places - Folge 83
  subtitle: Lost Places - Folge 83
  description: 'Die Burg Frankenstein im Odenwald ist heute ein Touristenhotspot. 1814 wurde dort die Autorin Mary Shelly durch eine verstörende, wahre Begebenheit zu ihrem weltberühmten Roman "Frankenstein" inspiriert. Außerdem in dieser Folge: Ponte City, ein Luxuskomplex in Johannesburg, welcher zu einer Hochburg der Kriminalität wurde, Bonanza, die berühmte Western-Stadt in Idaho, in der sich eine tödliche Liebesgeschichte ereignete, und eine recycelte Fantasiewelt in Buenos Aires, Argentinien.'
  widescreen: true
