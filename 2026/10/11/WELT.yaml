  title: Geheimakte Atombombe - Lügen und Verrat
  subtitle: Geheimakte Atombombe - Lügen und Verrat
  description: Bei der Spaltung von Uran-Atomen wird unglaublich viel Energie freigesetzt. Dieses Wissen sollte in den ersten Jahrzehnten des 20. Jahrhunderts Verkehr, Stromerzeugung und Medizin revolutionieren - doch ebenso die Kriegsführung. Im Juni 1942 gab der US-amerikanische Präsident Franklin D. Roosevelt das Sofortprogramm zum Bau einer Atombombe frei, das später als Manhattan-Projekt in die Geschichtsbücher einging. Nach zwei Jahren Entwicklung war die erste Kernwaffe der Welt zum Abschuss bereit.
