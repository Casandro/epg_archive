  start: 2026-10-11T01:47:00Z
  stop: 2026-10-11T02:34:00Z
  title: Geheimnisvoller Bodensee - Auf der Jagd nach Schiffen und Schätzen
  subtitle: Geheimnisvoller Bodensee - Auf der Jagd nach Schiffen und Schätzen
  description: Der Bodensee, an der Oberfläche ein idyllisches Urlaubsparadies, birgt in der Tiefe verborgene Schätze wie Schiffswracks und versunkene Flugzeuge. Ein Abenteurerteam unter der Leitung des Schweizers Silvan Paganini hat es sich zur Aufgabe gemacht, mit einer neuartigen Bergetechnik das Dampfschiff Säntis aus mehr als 200 Metern Tiefe zu bergen. WELT taucht in die geheimnisvolle Unterwasserwelt ein und erlebt, wie das Team versucht, eines der lang gehüteten Geheimnisse des Sees zu lüften.
  widescreen: true
- eventId: 1573383
  start: 2026-10-11T02:34:00Z
  stop: 2026-10-11T03:20:00Z
  title: Das Reich der Wikinger - Ivars Dynastie (1)
  subtitle: Das Reich der Wikinger - Ivars Dynastie (1)
  description: Im 8. Jahrhundert bricht das Zeitalter der Wikinger an. Die Skandinavier entwickeln damals besonders wendige Langschiffe mit Seitenruder - ideal für die Raubzüge der Wikinger. Jahrzehntelang überqueren sie von Norwegen aus die Nordsee, um zu wohlhabenden Klöstern Britanniens und Irlands zu gelangen. Ihre stolzen und unbarmherzige Anführer sind Olaf der Weiße und Ivarr. Die Dokumentation erklärt den Ursprung der Wikinger und beschreibt die Lebensweise der berüchtigten Nordmänner.
  widescreen: true
- eventId: 1573384
  start: 2026-10-11T03:20:00Z
  stop: 2026-10-11T03:59:00Z
  title: Das Reich der Wikinger - Ivars Dynastie (2)
  subtitle: Das Reich der Wikinger - Ivars Dynastie (2)
  description: Vor mehr als tausend Jahren überfallen die Wikinger Britannien, Irland und weitere Länder. Sie prägen die eroberten Gebiete maßgeblich - so zum Beispiel im 10. Jahrhundert in Dublin. Die Invasoren beeinflussen die irische Kultur und Architektur. Durch ihre großen Häfen und Flotten ermöglichen sie den Sklavenhandel. Sitric Seidenbart ist der letzte große Wikingerkönig Dublins. Sein Tod im Jahr 1042 markiert das Ende einer rund 200-jährigen Geschichte, geprägt durch Ivarr und seine Nachfahren.
  widescreen: true
- eventId: 1573385
  start: 2026-10-11T03:59:00Z
  stop: 2026-10-11T04:59:00Z
  title: Rapa Nui - Geheimnisse der Osterinsel
  subtitle: Rapa Nui - Geheimnisse der Osterinsel
  description: Bekannt ist die Osterinsel für ihre Moai. Rund 1000 dieser imposanten Steinstatuen prägen das Landschaftsbild. Woher kamen die Statuen, welche Bedeutung hatten sie für die Inselbewohner - und wie transportierten diese die tonnenschweren Skulpturen aus Vulkanstein? Warum ist die einst bewaldete Insel heute so karg? Viele lang gehegte Annahmen über die Rapa Nui erwiesen sich als falsch. Mit modernsten Forschungsmethoden entdecken Archäologen die wahre Geschichte des abgelegenen Südsee-Eilands.
  widescreen: true
- eventId: 1596579
  start: 2026-10-11T04:02:00Z
  stop: 2026-10-11T04:59:00Z
