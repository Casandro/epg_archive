  title: 'Geheime Nazi-Expeditionen: Himalaya'
  subtitle: 'Geheime Nazi-Expeditionen: Himalaya'
  description: Um die vermeintliche Überlegenheit der arischen Rasse wissenschaftlich zu belegen, unternahmen die Nazis Reisen in die entlegensten Winkel der Welt. Ihre aufwendigste Expedition verschlug sie bis in die obersten Gipfel des Himalaya-Gebirges. Die von Heinrich Himmler ausgewählten Wissenschaftler setzten alles daran, den hochrangigen SS-Mann zufriedenzustellen. Dieser war fest davon überzeugt, dass in Tibet einst gottähnliche Arier mit magischen Fähigkeiten gelebt hätten.
  widescreen: true
