  description: "Seit ihrer Gründung 2014 haben sich Giant Rooks zu einer der erfolgreichsten deutschen Bands entwickelt. Die fünf Musiker aus Hamm begeistern mit ihrem unverwechselbaren Mix aus Indie-Pop, Rock, Folk und Alternative ein internationales Publikum und schafften es mit der Cover-Version von \"Tom's Diner\" 2019 sogar in die US-Charts. \nSpätestens mit ihrem Debütalbum \"Rookery\" gelang ihnen 2020 der Durchbruch, es folgten ausverkaufte Tourneen in Europa und Nordamerika sowie Auftritte auf renommierten Festivals wie Lollapalooza, Reading & Leeds oder Corona Capital. Ihr zweites Album \"How Have You Been?\" erreichte 2024 Platz 1 der deutschen Albumcharts. \nMit Hunderten Millionen Streams und einer energiegeladenen Live-Show zählen Giant Rooks heute zu den spannendsten deutschen Bands ihrer Generation. Nach ihrem Newcomer-Auftritt 2021 kehren sie jetzt für ein Homecoming-Konzert zurück auf die große New Pop Bühne."
