  title: Kultura na severu
  description: Dnes pro vás máme dvojí zastavení u festivalu Hudební setkání Michala Maška.Jednou jako pozvánku na nový koncert a jednou jako ohlédnutí za koncertem minulým. Dále si popovídáme s tvůrci televizního filmu Gerta Schnirch a přidáme i pozvánku na zámecký ples na Novém Hradě v Jimlíně, taky na talkshow s novinářem Tomášem Etzlerem v Zubrnicích a na koncert melodií Karla Svobody v Žatci. Nabídneme novou četbu. Tentokrát se zaposloucháme do kapitol z knihy Petra Karlíčka Průvodce po zaniklých obcích, osadách a samotách po Bukovou horou.
