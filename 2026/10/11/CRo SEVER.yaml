  title: Hvězdné návraty
  description: Dnes bude ve Hvězdných návratech znít čeština i slovenština. Oba jazyky ovládal herec, na kterého se bude vzpomínat. Říkali mu Julo, byl polovinou slavné dvojice a předčasně odešel v 61 letech. Jmenoval se Julius Satinský. Zavzpomínáme na jeho začátky, soukromé tragédie i herecké úspěchy. To vše okoření ukázky z filmů, rozhlasových i televizních estrád. Patrik Rozehnal se už na vás těší jako průvodce dalším dílem seriálu o dobrém humoru. Začínáme krátce po 16. hodině.
