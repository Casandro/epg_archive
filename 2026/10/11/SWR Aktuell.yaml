  description: "15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND\nKoks und Küsschen: Geschäfte mit Alpenblick (1/4)\nBacetto war ein kaltblütiger Krimineller, ein Mann, der der italienischen 'Ndrangheta zugerechnet wird. Er hat sich eine unauffällige Fassade aufgebaut: Als Pizzeria-Betreiber mit dem charmanten Spitznamen, der auch noch mit italienischen Lebensmitteln handelt und ganz bescheiden in einem kleinen Dorf lebt. Wir reisen an den Bodensee und erfahren dort, wie Bacetto es so lange unentdeckt geschafft hat, den Kokainschmuggel voranzutreiben und wie ihm die Polizei mit Undercover-Ermittlungen irgendwann doch auf die Spur gekommen ist.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: \nNach der Ceuta-Krise - kommt jetzt der große Abschiebe-Deal?\nDer Migrationsansturm auf Ceuta setzt die EU unter Druck. Die Antwort: ein neuer Krisenmechanismus und Return Hubs außerhalb der EU. Werden Abschiebungen jetzt nach Afrika ausgelagert? Mit Kathrin Schmid, Stephan Stuchlik und Sebastian Kisters.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - \nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nArbeitskosten in Deutschland - Ist mein Job zu teuer?\n45,70 Euro Stundenlohn: Deutschland gehört zu den teuersten Standorten Europas. Gefährdet das unseren Wohlstand? Während die IG Metall 5 Prozent mehr Lohn fordert, klagen Unternehmen über hohe Kosten. Wir schauen, ob Deutschlands Jobs tatsächlich zu teuer sind - oder ob Produktivität, Energiepreise und Bürokratie die größere Rolle spielen. Plus: Konkrete Tipps für deine nächste Gehaltsverhandlung.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
