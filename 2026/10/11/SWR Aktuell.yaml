  title: SWR Aktuell am Vormittag
  description: "9:00\npunktEU: \nNach der Ceuta-Krise - kommt jetzt der große Abschiebe-Deal?\nDer Migrationsansturm auf Ceuta setzt die EU unter Druck. Die Antwort: ein neuer Krisenmechanismus und Return Hubs außerhalb der EU. Werden Abschiebungen jetzt nach Afrika ausgelagert? Mit Kathrin Schmid, Stephan Stuchlik und Sebastian Kisters.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n9:30\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nArbeitskosten in Deutschland - Ist mein Job zu teuer?\n45,70 Euro Stundenlohn: Deutschland gehört zu den teuersten Standorten Europas. Gefährdet das unseren Wohlstand? Während die IG Metall 5 Prozent mehr Lohn fordert, klagen Unternehmen über hohe Kosten. Wir schauen, ob Deutschlands Jobs tatsächlich zu teuer sind - oder ob Produktivität, Energiepreise und Bürokratie die größere Rolle spielen. Plus: Konkrete Tipps für deine nächste Gehaltsverhandlung.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/ \n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - Gemeinsames Singen - was ist der Reiz von Chören?\nEs gibt in Deutschland etwa 60.000 Chöre. In manchen wird es jazzig, andere singen Pop, Gospel oder auch klassische WErke. Manche sind hochprofessionell, im Verband organisiert, es gibt Chöre mit einem Anliegen, einer Botschaft, welche, die sich ganz spontan zusammentun und wieder andere wollen vor allem ihren Verein unterstützen. Über 3 Millionen Menschen singen in Deutschland regelmäßig zusammen. Aber warum? Was ist der Reiz von Chören? Das finden wir heute raus!\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nEin Menschheitstraum - die Sehnsucht nach einer gerechten Welt\nGerechtigkeit ist ein uralter Menschheitstraum. Und ein Thema leidenschaftlicher Kämpfe: sowohl in der großen Politik wie am heimischen Küchentisch, wenn die Kinder um die Größe ihres Puddings streiten. Studien zeigen, dass das Gerechtigkeitsgefühl in der Gesellschaft zurückgeht. Die Waage, mit der Justitia die Gerechtigkeit symbolisiert, neigt sich bedenklich auf eine Seite.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nAus dem Leben\nBuchautorin Nele Neuhaus\nNele Neuhaus ist eine der erfolgreichsten Krimiautorinnen Deutschlands. Auch ihr 12. Taunuskrimi \"Alles wird Asche\" landete direkt wieder auf Platz 1.\nDarüber und über ihren Weg zur Bestsellerautorin plaudert sie in Aus dem Leben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
- eventId: 1012060
  start: 2026-10-11T10:00:00Z
  stop: 2026-10-11T13:00:00Z
  title: SWR Aktuell am Mittag
  description: "12:00\nAktuelles & Sport\n\n12:30\nMariniæ' sFREIHEIT\nLese-Hype, Autorinnen changing everything, \"Die Lücken\" und \"Anton und Alma\"\nDiskussionen sind die Tage hier ein Fenster zur Welt. Überhaupt bewegt sich einiges, und zwar auch mal zum Guten. Nicht nur, dass Bücher und das Lesen wieder trendet, ich beobachte auch, wie sich Autorinnen verändern, wie sie diesen Betrieb öffnen und sich das Licht erobern: Auf der diesjährigen Shortlist für den Deutschen Buchpreis waren von sechs Nominierten fünf Frauen und mit Shida Bazyar für \"Die Lücken\" hat auch eine großartige Autorin gewonnen. Das Besondere ist aber nicht nur die Präsenz der Autorinnen, sondern auch, wie sie von ihren Verlagen betreut werden, wie sie mit ihren KonkurrentInnen umgehen und wie bewusst sie sich sind, was da insgesamt geschieht. Ich will euch erzählen von dieser inspirierenden Bewegung in dem einst hart umkämpften Literaturbetrieb. \nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n13:00 \nCamino - Religionen auf dem Weg\nÜber Durchhalten und Resilienz - Juden in Deutschland unter Druck\nSeit dem Terroranschlag der Hamas auf Israel am 7. Oktober 2023 hat sich der Alltag vieler jüdischer Menschen in Deutschland spürbar verändert. Das zeigen die Erfahrungen aus verschiedenen jüdischen Gemeinden. Die Reaktionen darauf sind unterschiedlich: Manche zeigen ihre jüdische Identität bewusst sichtbar, andere suchen das Gespräch über politische Gräben hinweg, wieder andere schaffen Orte der Gemeinschaft und des Rückhalts\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \"Maifliegen\" von Andrew O'Hagen - Musik, Freundschaft und die letzten Dinge\n\"Maifliegen\" (auf Englisch \"Mayflies\") ist der zuletzt auf Deutsch erschienene Roman des schottischen Schriftstellers und Journalisten Andrew O' Hagan. Vor dem Hintergrund der Thatcher-Ära in Großbritannien zeichnet O' Hagan das zeitlose Porträt euphorischer Jugend und taucht tief ein in die englische Musik- und Indie-Szene der 1980er, mit Bands wie The Smiths, The Fall und Joy Division.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nNicole Markwald im Gespräch mit Wolfram Weimer, Kulturstaatsminister\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nPsychologe Richard Rau - Menschenkenntnis - Kann man sie lernen?\nDie meisten Menschen glauben, dass sie sehr gut darin sind, andere Menschen richtig einzuschätzen. Doch Studien zeigen, dass wir unsere Menschenkenntnis oft überschätzen. Richard Rau, Psychologe an der Health and Medical University in Potsdam versucht, das Phänomen wissenschaftlich zu erfassen. Kann man Menschenkenntnis \"messen\"? Wovon hängt sie ab? Kann man sie lernen? Er leitet auch das Projekt \"Who Knows\" - eine App, die testet, wie gut unsere Menschenkenntnis ist.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
