  description: "18:00 -19:00\nAktuelles & Sport\n\n19:00  \nDemokratie Forum \nEnttäuschung, Wut, Extremismus - Verlieren wir den Glauben an die Demokratie?\nWarum fühlen sich so viele Menschen der Politik nicht mehr vertreten? Viele Menschen haben den Eindruck, dass ihre Stimme kaum noch etwas verändert. Die Debatten in ganz Deutschland wirken festgefahren, Kompromisse wie faule Deals und Parteien weit entfernt vom Alltag. Besonders in Ostdeutschland ist das Vertrauen in die parlamentarische Demokratie erschreckend niedrig."
