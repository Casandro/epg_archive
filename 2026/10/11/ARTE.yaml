  title: 'L''ancien fait peau neuve : Une nouvelle vie pour des bâtiments historiques'
  subtitle: Des bâtiments industriels S01 E02.
  genre:
  - '32'
  description: 'Depuis la fin de l''ère industrielle, de nombreux entrepôts, usines et centrales électriques ont été laissés à l''abandon. Hormis les coûts élevés que représente leur démantèlement, ils sont aujourd''hui considérés comme des éléments à part entière du patrimoine historique, témoignant d''un âge d''or révolu. Partout dans le monde, des projets de réhabilitation créatifs et audacieux fleurissent pour offrir une deuxième vie à ces vastes espaces. À Paris, la Cité de la mode et du design est installée dans un ancien entrepôt dont la structure d''origine, en béton armé, est recouverte d''une double peau en verre. Le musée d''Art contemporain du Cap, en Afrique du Sud, est quant à lui construit dans un ancien silo à grains qui a conservé son emblématique silhouette alvéolaire. Réalisateur: Sabine Reeh (2023)'
