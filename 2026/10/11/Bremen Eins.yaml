  title: Beat-Club
  description: Bremen Eins feiert die wilde Zeit des legendären Beat-Clubs. Tauchen Sie ein in Hits und Stories mit Musik von Bands wie den Beatles, The Who oder Roxy Music. Erinnern Sie sich mit uns an die Zeit, in der das Farbfernsehen eingeführt wurde und lange Haare sowie Batikblusen angesagt waren. Genießen Sie zwei Stunden geballte Musikkompetenz rund um das Jahrzehnt des berühmten "Bed In" - die 1960er.
