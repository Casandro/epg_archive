  description: Im SWR Quizduell geht es um Galas, rote Teppiche, berühmte Hotels und Prominente. In Iffezheim, Baden-Württemberg, wurde 1858 eine Galopprennbahn für das Vergnügen der Kurgäste in Baden-Baden errichtet. Bad Neuenahr-Ahrweiler, Rheinland-Pfalz, wurde mit der Entdeckung der Apollinaris-Quelle 1856 zur bedeutenden Kurstadt mit mondänem Spielcasino. Wo kennt man sich mit Glanz und Glamour besser aus?
