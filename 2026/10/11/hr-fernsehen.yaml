  description: Inmitten eines kriegerischen Staates schuf sich Friedrich der Große mit den Schlössern von Sanssouci ein intellektuelles Zentrum, in dem er Europas geistige Elite um sich versammeln konnte. Die Schlösser in den eindrucksvollen Gartenanlagen sind Refugium in all den Kriegsgeschehnissen und Musentempel. Hier musizierte er, hier musste er nicht regieren, hier konnte er einfach nur Mensch sein. Und so sind die Gebäude nicht prunkvoll und majestätisch, ihre Schönheit liegt vielmehr im Detail.
