  description: 'Dr. Marc Lindners Beziehung zu Alexandra Jansson entwickelt sich immer besser - doch dann durchzuckt sie ein stechender Schmerz im Bauch, als sie auf der Gokart-Rennbahn einen Werkzeugkasten anhebt. Bei dem Ultraschall, den Dr. Julia Berger zusammen mit Assistenzarzt Ivo Maric macht, kann Marc nicht aus seiner Arzt-Rolle: Er entdeckt etwas und mischt sich in die Untersuchung ein. Anschließend ist auch er es, der Alexandra eine erschütternde Diagnose überbringen muss. Für Alex bricht eine Welt zusammen. Sie kann und will die Kontrolle über ihr Leben nicht abgeben und erst recht nicht an Marc.'
