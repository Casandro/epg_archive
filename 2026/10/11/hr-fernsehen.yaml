  title: Mit Herz am Herd
  subtitle: Dorade auf Orange-Fenchelgemüse & Petersilien-Mandel-Kruste
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Unser sympathisches Koch-Trio hat es wieder an ganz besonders schöne Orte im Saarland gezogen: Gekocht wurde diesmal auf dem Schlossplatz in St. Wendel, im Biotop Beden, vor dem Dillinger Schloss, in Saarwellingen und vor Schloss Buseck bei Eppelborn. Auf dem historischen Schlossplatz in St. Wendel mit seinen zahlreichen Cafés und Restaurants brät Sternekoch Cliff Hämmerle diesmal eine Dorade. Für die Petersilien-Mandel-Kruste benötigt man Schalotten, Knoblauch, Semmelbrösel, Mandeln, Pinienkerne und Zitronenabrieb. So bleibt auch für die Kochlehrlinge Verena Sierra und Michel Koch an der Kochinsel der SR Freiluftküche genug zu tun.'
