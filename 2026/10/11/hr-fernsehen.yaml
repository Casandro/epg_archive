  subtitle: Von der Frankfurter Börse zum veganen Restaurant
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sein Hobby verändert das Leben von Dirk Schritt. Als leidenschaftlicher Langstreckenläufer ist ihm eine gesunde und leistungssteigernde Ernährung sehr wichtig. Dabei entdeckt er für sich die vegane Küche. Damit tut er nicht nur seinem Körper etwas Gutes, sondern schont auch Umwelt und Klima. Diese Erkenntnis führt schließlich zu einer großen Entscheidung: Dirk Schritt kündigt seinen sicheren Job an der Frankfurter Börse und macht seine vegane Leidenschaft zum Beruf. In Geisenheim geht er eine neue Herausforderung an und eröffnet sein eigenes veganes Restaurant. Ein mutiger Schritt für den Hobby-Koch.'
