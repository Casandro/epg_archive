  title: Länder - Menschen - Abenteuer
  subtitle: Patagonien - Land der Pioniere
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Pioniergeschichten vom Ende der Welt in der wilden und ursprünglichen Landschaft von Chiles Patagonien: Es ist ein Naturparadies, das mehrere Klimazonen in sich vereint. Vom Valdivianischen Regenwald im gemäßigten Norden erstreckt es sich über die hochalpinen Andenkordilleren und weiten Steppen bis zur unberührten Insellandschaft von Feuerland im eisigen Süden. Ursprünglich noch als Farmland für das Vieh der einstigen Siedler genutzt, wird heute in Patagonien ein Nationalpark neben dem anderen eröffnet. Das Land ist im Begriff, Vorreiter für den internationalen Naturschutz zu werden.'
- eventId: 859570
  start: 2026-10-11T08:30:00Z
  stop: 2026-10-11T09:15:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Puerto Rico - Wo Salsa den Rhythmus bestimmt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sandstrand vor der Tür, abenteuerlicher Regenwald, überraschende Leckerbissen und über allem Salsa: das ist Puerto Rico. Salsa hat auf der Karibikinsel das ganze Jahr Saison, der Rhythmus ist so etwas wie die Nationalhymne des Landes. Kaum zu glauben, aber auch das sind die Vereinigten Staaten von Amerika. In einem sogenannten Außengebiet der USA leben knapp drei Millionen Menschen auf der kleinsten Insel der Großen Antillen.'
