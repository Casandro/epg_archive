  title: alpha Uni
  subtitle: 'Job: Zahnmedizin, Meteorologie'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Johannes ist als angestellter Zahnarzt in einer Praxis im bayerischen Bad Endorf tätig. Bis zu 15 Patient:innen behandelt er dort täglich. Neben Routineuntersuchungen gehören auch Schmerzpatient:innen zu seinem Arbeitsalltag.
    Katharina ist Meteorologin beim Deutschen Wetterdienst am Flughafen München, dem zweitgrößten Flughafen Deutschlands. Hier starten und landen täglich mehr als tausend Flugzeuge. Katharina ist für das Flugwetter in Süddeutschland zuständig. Sie beurteilt die aktuelle Wetterlage und liefert damit eine wichtige Entscheidungsgrundlage für den Flugbetrieb.
- eventId: 859538
