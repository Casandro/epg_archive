  title: 'Sheryl Crow: Live at the Franklin Theatre'
  subtitle: Franklin, Tennessee, USA, 2024
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Konzert, USA 2024
    Am 23. März 2024 präsentiert Sheryl Crow ihr neues Album "Evolution" in einem Clubkonzert in einem Vorort von Nashville. Sie wollte kein Album mehr machen und "endlich ihren Mund halten".

    "Was in der Welt passiert, die politischen Führer, die wir wählen, und das Gift, das wir versprühen, wenn wir anderer Meinung sind, ist furchteinflößend. Ich hoffe, dass wir wieder zu Vernunft kommen", kommentiert die neunfache Grammy-Gewinnerin ihre Rückkehr.
    Regie: Skip Masters

    HD-Produktion
