  title: Die schönsten Bergseen der Steiermark
  subtitle: Film von Holger Bruckschweiger
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Hohe Berge und klare Wasser prägen die als "Grüne Mark" bekannte Steiermark: Fast 10.000 Seen und Teiche gibt es dort. Der Film stellt die schönsten zehn Bergseen vor.

    Darunter bekannte Gewässer wie der Grundlsee, der Steirische Bodensee und die idyllische Sechs-Seen-Landschaft auf der Tauplitz. Am Spiegelsee auf der Reiteralm spiegelt sich eindrucksvoll der Dachsteingipfel wider.
