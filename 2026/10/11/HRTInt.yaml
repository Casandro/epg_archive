  title: 'Najbolji dan: Edita'
  subtitle: ' '
  description: Edita i njezini roditelji žive u Petrinji u lijepoj kući. Edita ima svoju sobu koju su joj roditelji uredili baš kako je željela. Ali Edita ne spava u svojoj sobi. Još spava s mamom i tatom. Htjela bi pokušati i kao i njezina prijateljica Tena spavati sama. No nikako da se odvaži. Pozvala je Digidigija da joj pomogne suočiti se sa strahom i da uz njegovu podršku u tome uspije. Digidigi ima plan jer zna da je strah nekad kao maglica zbog koje slabije vidimo pa često ne vidimo da možemo mnogo više nego što mislimo.
