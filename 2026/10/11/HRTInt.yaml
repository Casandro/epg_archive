  description: 'Ako više cijene goriva potraju tijekom jeseni i zime, njihov će se učinak sve snažnije osjećati u kućnim proračunima. Jer ogrjevna sezona upravo je počela. Najpovoljniji su i dalje ogrjevno drvo i peleti, a najskuplje je grijanje na električnu energiju. Ogrjev je u prosjeku poskupio od 10 do 30 posto. Možemo li se ove sezone "isplativo" grijati? U emisiji gostuju  Dalibor Pudić, predsjednik Hrvatske stručne udruge za plin i Daniel Srb, energetski stručnjak. Urednica i voditeljica: Sanja Smiljanić Grubišić'
