- eventId: 1607584
  start: 2026-10-11T12:32:00Z
  stop: 2026-10-11T13:18:00Z
  title: Dolina sunca, serija (24/210)
  subtitle: ' '
  description: 'Nataša skupi dovoljno hrabrosti za suprotstaviti se Juranu. Ivan se uporno inati Adeli odbijajući njezinu pomoć. Ruža potajno ispunjava formular za namjenski kredit kojim namjerava proširiti posao. Juran izluđuje Kristijana trošeći novac od firme bez prethodnog dogovora s njim. Lada je tužna što se prenaglila i odbila Lovru. Augustina se žali Karlu što ne provode dovoljno vremena zajedno jer on radi u gostionici. Zbog svađe između Jurana i Kristijana Ivan odluči da će odsad sve poslovne odluke donositi on. Don Ante predloži doktoru Ottu da bi bilo pametno organizirati dobrotvorni nogometni turnir kako bi prikupili novac za opremanje doma za maloljetne delinkvente. Juran je iznerviran zbog Ivanove odluke, te se lukavo na Natašine prigovore stavlja u položaj žrtve. Karlo nagovara Lovru da ga pusti da još malo radi kao konobar jer mu treba novac. Irena je zatečena Kristijanovom izjavom da više ne želi preuzeti firmu od oca. Nataša napokon povjerava Sofiji svoje osjećaje i svoje nezadovoljstvo brakom. Juran se pokušava dodvoriti Ivanu. Robert traži način da se osveti Andriji, te se raspituje o njemu kod Višnje. Sonja traži od Adele novu uslugu. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1594517
  start: 2026-10-11T12:35:00Z
  stop: 2026-10-11T13:21:00Z
  title: Dolina sunca, serija (24/210)
  subtitle: ' '
  description: 'Nataša skupi dovoljno hrabrosti za suprotstaviti se Juranu. Ivan se uporno inati Adeli odbijajući njezinu pomoć. Ruža potajno ispunjava formular za namjenski kredit kojim namjerava proširiti posao. Juran izluđuje Kristijana trošeći novac od firme bez prethodnog dogovora s njim. Lada je tužna što se prenaglila i odbila Lovru. Augustina se žali Karlu što ne provode dovoljno vremena zajedno jer on radi u gostionici. Zbog svađe između Jurana i Kristijana Ivan odluči da će odsad sve poslovne odluke donositi on. Don Ante predloži doktoru Ottu da bi bilo pametno organizirati dobrotvorni nogometni turnir kako bi prikupili novac za opremanje doma za maloljetne delinkvente. Juran je iznerviran zbog Ivanove odluke, te se lukavo na Natašine prigovore stavlja u položaj žrtve. Karlo nagovara Lovru da ga pusti da još malo radi kao konobar jer mu treba novac. Irena je zatečena Kristijanovom izjavom da više ne želi preuzeti firmu od oca. Nataša napokon povjerava Sofiji svoje osjećaje i svoje nezadovoljstvo brakom. Juran se pokušava dodvoriti Ivanu. Robert traži način da se osveti Andriji, te se raspituje o njemu kod Višnje. Sonja traži od Adele novu uslugu. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1607585
  start: 2026-10-11T13:18:00Z
  stop: 2026-10-11T14:05:00Z
  title: 'Klub čitatelja: Maša Kolanović - Materina'
  subtitle: ' '
  description: Jedna knjiga. Četvero čitatelja. Bezbroj interpretacija. U "Klubu čitatelja" Trećeg programa Hrvatske televizije od ove sezone s vama je sveučilišna profesorica i književnica Đurđica Čilić. Ona i Dražen Ilinčić razgovarat će s četvero gostiju različitih generacija, profesija, znanja i životnih priča. Što ih je u istoj knjizi osvojilo, što ih je iznenadilo, oko čega će se složiti, a oko čega neće? Sezonu otvaramo romanom "Materina" autorice Maše Kolanović, djelom koje kroz odnos majke i kćeri progovara o strahu, odgovornosti i pokušaju da razumijemo svijet koji postaje sve nesigurniji. U studiju su psihologinja dr. sc. Gordana Kuterovac Jagodić, književni kritičar dr. sc. Luka Ostojić, glumica, redateljica i scenaristica Lana Barić te glumica i voditeljica Doris Pinčić. "Klub čitatelja" je razgovor koji počinje nakon posljednje stranice. Emisiju možete pratiti i preko multimedijske usluge HRTi.
