  stop: 2026-10-11T19:42:00Z
  title: Tu, hrvatski film
  subtitle: ' '
  description: 'Drama. Film "Tu" djelo je s radnjom iz suvremenoga života, što sugerira i naslov. Metodom koja podsjeća na isprepletene kriške života, film stvara panoramski prikaz ovdašnje sredine. Desetak likova prati se izdvojeno, na prvi pogled čak i nasumično, da bi se ponovno pojavili, ponekad i susreli. Likovi tvore galeriju marginalaca (umirovljenik, narkomanka, bivši ratnici...), ljudi mahom bez perspektive, pa je i sveukupna slika ovdašnje stvarnosti poprilično tmurna.  Nagrade: Kristalni globus, Posebna nagrada žirija, 39. međunarodni filmski festival u Karlovym Varyma, 2004.; Grand prix, 9. međunarodni filmski festival u Milanu, 2004.; 27. međunarodni filmski festival u Denveru, 2004. (Nagrada "Krzysztof Kieslowski"); 11. međunarodni filmski festival u Paliću, 2004.; 50. filmski festival u Puli, 2003.; Nagrada međunarodnog žirija kritike, 26. mediteranski filmski festival u Montpelliereu, 2004.; Godišnja nagrada "Vladimir Nazor", 2004. U glavnim ulogama nastupaju Zlatko Crnković, dobitnik Zlatne arene za glavnu mušku ulogu na 50. filmskom festivalu u Puli, zatim Ivo Gregurević, Jasmin Telalović, Marija Tadić, Ivan Herceg, Nikola Ivošević te niz glumaca u izvrsno ostvarenim epizodnim ulogama. Direktor fotografije je Davorin Gecl, čiji je snimateljski rad osobito hvaljen u američkom "Varietyju", montažer Josip Podvorac, dobitnik Zlatne arene za montažu na festivalu u Puli.  Suradnik na scenariju: Josip Mlakić Majstorica maske: Slavica Živaljić Majstori zvuka: Zbynek Mikulik i Tomislav Fogec'
- eventId: 1594537
  start: 2026-10-11T19:42:00Z
  stop: 2026-10-11T20:35:00Z
  title: Danijela Martinović "Otvoreno srce", snimka koncerta (2. dio) (KD V. Lisinski, 08.03.2022.)
  subtitle: ' '
  description: 'Spektakularan koncert Otvoreno srce, prepun emocija i atmosfere zbog koje se publika odmah podigla na noge, priredila je 8. ožujka 2022. diva hrvatske glazbene scene - Danijela Martinović u Koncertnoj dvorani Vatroslava Lisinskog. Već od prve pjesme publika je nadglasala glazbenicu koja obilježava 30 godina glazbene karijere. Do posljednjeg mjesta ispunjena i danima prije rasprodana koncertna dvorana, savršeno je opisala povezanost glazbenice i njezine publike. Danijela im se odužila na najbolji način i Dan žena pretvorila u glazbenu čaroliju. Na dvosatnom koncertu redali su se legendarni hitovi, ali i novi: Danima, godinama, satima, Pleši sa mnom, Neka mi ne svane, Ljubav ne odustaje... Skladbe su se nizale u savršenom ritmu, a publika je Danijeli uzvraćala čistom srećom, osmijesima i gromoglasnim pljeskom. Danijeli se na pozornici pridružila još jedna velika zvijezda, Vesna Pisarović, s kojom je otpjevala ''Da znaš'', što je publika nagradila ovacijama, baš kao i duet s drugim glazbenim gostom, Markom Toljom, s kojim je izvela skladbu ''Ti si princeza''. Poseban trenutak u Lisinskom svakako je bila i dodjela nagrade Hrvatske diskografske udruge, koju je Danijeli u povodu 30 godina iznimne karijere uručila direktorica Hrvatske diskografske udruge Maja Vidmar Klarić. Nakon tri desetljeća na sceni, brojnih nagrada, predivnih koncerata i međunarodnih nastupa, Danijela s ponosom kaže da je zakoračila u neopisivo razdoblje svoga života. Upravo takav je bio i Danijelin koncert.'
- eventId: 1594538
  start: 2026-10-11T20:35:00Z
  stop: 2026-10-11T21:21:00Z
  title: Dolina sunca, serija (24/210)
  subtitle: ' '
  description: 'Nataša skupi dovoljno hrabrosti za suprotstaviti se Juranu. Ivan se uporno inati Adeli odbijajući njezinu pomoć. Ruža potajno ispunjava formular za namjenski kredit kojim namjerava proširiti posao. Juran izluđuje Kristijana trošeći novac od firme bez prethodnog dogovora s njim. Lada je tužna što se prenaglila i odbila Lovru. Augustina se žali Karlu što ne provode dovoljno vremena zajedno jer on radi u gostionici. Zbog svađe između Jurana i Kristijana Ivan odluči da će odsad sve poslovne odluke donositi on. Don Ante predloži doktoru Ottu da bi bilo pametno organizirati dobrotvorni nogometni turnir kako bi prikupili novac za opremanje doma za maloljetne delinkvente. Juran je iznerviran zbog Ivanove odluke, te se lukavo na Natašine prigovore stavlja u položaj žrtve. Karlo nagovara Lovru da ga pusti da još malo radi kao konobar jer mu treba novac. Irena je zatečena Kristijanovom izjavom da više ne želi preuzeti firmu od oca. Nataša napokon povjerava Sofiji svoje osjećaje i svoje nezadovoljstvo brakom. Juran se pokušava dodvoriti Ivanu. Robert traži način da se osveti Andriji, te se raspituje o njemu kod Višnje. Sonja traži od Adele novu uslugu. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
