  title: Vom Türsteher zum Herbergsvater
  subtitle: Ein bewegtes Leben auf St. Pauli
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Er ist ein echtes Kiez-Urgestein. Olli Zeriadke (57) war Hausmeister und Barkeeper, Türsteher, Koberer und Inkasso-Dienstleister im Rotlichtmilieu. Doch sein Herzblut fließt seit drei Jahren in ein soziales Projekt: Ollis Regenbogenhaus, eine Unterkunft für ehemals obdachlose Menschen auf der Reeperbahn. \nOllis Regenbogenhaus ist ein echtes Familienunternehmen. Ollis Frau Antje ist Krankenschwester und kümmert sich um das Haus und seine Bewohner. Und auch Ollis Tochter Laura, die als Tischlerin bei der Polizei arbeitet, springt immer wieder ein, wenn es handwerkliche Probleme gibt."
