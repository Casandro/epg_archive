  title: Die Landärztinnen - Vier Frauen retten eine Praxis
  subtitle: Vier Frauen retten eine Praxis
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ärztin Sylvia Tschötschel war lange Einzelkämpferin in ihrer Dorfpraxis in Borrentin (Landkreis Mecklenburgische Seenplatte). Die Belastung war enorm. Heute sichern mehrere Ärztinnen gemeinsam die medizinische Versorgung, aus der kleinen Praxis ist ein Team gewachsen. Gemeinsam mit jungen Kolleginnen und zusätzlichem Fachpersonal entsteht eine neue Arbeitsatmosphäre, die den Alltag spürbar verändert. "Die Nordreportage" begleitet vier Ärztinnen zwischen Sprechstunde, Hausbesuchen und Familienleben und zeigt, wie eine Praxisgemeinschaft zum Hoffnungsträger für das Land wird.
