  title: Jeder Tag ein Kampf?
  subtitle: Queere Menschen in Deutschland - Film von Klaas-Wilhelm Brandenburg und Alex Grantl
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Sommer 2021: Die Allianz-Arena in München sollte zum Spiel Deutschland gegen Ungarn in Regenbogenfarben leuchten. Die UEFA verbietet das - und Deutschland ist aus Protest im Regenbogen-Rausch: Wahrzeichen werden bunt angestrahlt, Regenbogenfahnen werden gehisst, die eigene Toleranz wird gefeiert. Deutschland, ein Paradies für queere Menschen? \n\"Die Story im Ersten\" trifft queere Menschen in den verschiedensten Phasen ihres Lebens. Wie gleichgestellt sind queere Menschen in Deutschland? Wie tolerant ist unsere Gesellschaft tatsächlich? Müssen queere Menschen noch um Akzeptanz kämpfen?"
- eventId:
