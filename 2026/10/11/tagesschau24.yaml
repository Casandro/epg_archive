  stop: 2026-10-11T20:20:00Z
  title: CSD under attack - queere Menschen wehren sich
  subtitle: Film von Mona Ruzicka und Florian Prokop
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Queerfeindliche Angriffe im Alltag nehmen zu. Auf der Straße, gegen queere Treffpunkte und Christopher Street Days. Die Bedrohung kommt von allen Seiten: Rechtsextremismus und Islamismus - und manchmal auch aus der Mitte der Gesellschaft. \nWährend der Dreharbeiten erschüttert der tödliche Anschlag auf den Berliner CSD die queere Community und plötzlich bekommt die Frage nach Sichtbarkeit und Sicherheit noch eine aktuellere, brutalere Dimension. \nDrei Geschichten über Menschen, die unterschiedlich mit der Gefahr umgehen - zwischen Angst und Trotz, Rückzug und Zusammenhalt. Und die sich nicht nehmen lassen wollen, sichtbar zu sein."
