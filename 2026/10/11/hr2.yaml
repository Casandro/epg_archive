  title: Podcast-Reihe | "Kein Mucks!" mit Bastian Pastewka Staffel 7, Folge 27
  subtitle: 'Hörspiel-Klassiker von Walter Gerteis | Regie: Heinz Otto Müller | Mit Heinz Schimmelpfennig als Kriminalrat Obermoos.'
  description: 'In der Podcast-Reihe "Kein Mucks!" präsentiert Bastian Pastewka, Kenner und Liebhaber der anspruchsvollen Krimi-Unterhaltung, zwei Folgen der Kult-Mitrateserie vom Hessischen Rundfunk rund um Kommissar Obermoos. In dem beliebten Dauerbrenner hieß es zwischen 1959 und 1970 regelmäßig: "Wer wars, wie geschahs, was war los? Das Wort hat Kriminalrat Obermoos." Der Clou: Bei den in rund 25 Minuten erzählten Fällen darf selbst herausgefunden werden, wer der Täter war und was ihn verriet.'
