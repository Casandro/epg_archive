  title: Svět ve 20 minutách
  description: Světové velmoci rozjíždějí nový vesmírný závod o jaderný reaktor na Měsíci. - Indie se začíná aktivněji zapojovat do snah o ukončení války na Ukrajin. - AI hledá extremisty mezi uchazeči o službu v Bundeswehru. - Nové boje v Etiopii zapadají do mozaiky vzájemně propojených krizí v regionu. - Ekonomická nespokojenost latinskoamerických voličů může zamíchat blížícími se volbami do amerického Kongresu. Dnešní výběr z komentářů, analýz a reportáží zahraničních médií připravil Ondřej Čížek.
