  start: 2026-10-11T05:07:00Z
  stop: 2026-10-11T05:33:00Z
  title: Online Plus
  description: Nezávislí matematičtí experti začínají radit korporacím, které vyvíjejí velké jazykové modely - pokračuje totiž rychlá cesta AI při řešení dosud považovaných za obtížně řešitelné matematické rébusy. Překoná hrubá výpočetní síla logické uvažování, na kterém se lidstvo dosud shodovalo stran řešení? Moderuje David Slížek.
