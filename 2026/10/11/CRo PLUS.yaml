  description: Od teroristických útoků Hamásu na Izrael uplynuly tři roky. Jak se od té doby změnil pohled lidí v Česku na Izraelce a Palestince? Co dominuje české debatě? A proč si tuzemská politická reprezentace, bez ohledu na to, kdo je zrovna u vlády, zachovává proizraelský postoj? Názory z obou stran nabízí Zaostřeno Víta Pohanky.
- eventId: 1626923
  start: 2026-10-11T20:32:00Z
