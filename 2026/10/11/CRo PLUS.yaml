  title: Za obzorem
  description: K nepokojům na arabském poloostrově přispívá i konflikt v Jemenu. Postalečtí rebelové Húsíové ovládají sice menší, zato výrazně osídlenější část země. Balistickými raketami ohrožují obchodní lodě a tankery proplouvající Rudým mořem. Kde se vzali, jak probíhá konflikt v Jemenu a jak se v zemi žije? Na jihozápad arabského poloostrova vyrazíme v dnešním pořadu.
