  description: 'Než doteče k ústí: Co si pamatuje voda v Ústeckém kraji? Autorka dokumentu Alena Harciníková se vrací k paměti vody v krajině, která se během dvou století proměnila k nepoznání. Podél řeky Bíliny hledá, co všechno jsme s vodou ztratili a co se ještě dá obnovit.'
