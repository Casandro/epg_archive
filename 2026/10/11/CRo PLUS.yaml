  description: Smetanův pozdrav z nebe - o tajemných okolnostech, za kterých se zrodila dodnes velmi populární Louisina polka od Bedřicha Smetany. Vypráví Stanislav Motl.
- eventId: 1626361
  start: 2026-10-11T06:00:00Z
