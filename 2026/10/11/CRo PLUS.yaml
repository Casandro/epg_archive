- eventId: 1626369
  start: 2026-10-11T08:07:00Z
  stop: 2026-10-11T08:33:00Z
  title: Leonardo Plus
  description: Česko zažívá výrazný pokles počtu narozených dětí. Zároveň se rodičovství posouvá do vyššího věku - první dítě ženy mívají v průměru až v 29 letech. Do jaké míry ovlivňují rozhodování o rodičovství životní podmínky a kdy už začíná rozhodovat věk a biologie? A jaká je v ČR situace s mužskou plodností? Hostem pořadu Leonardo Plus bude lékař Pavel Otevřel, specialista na reprodukční medicínu a vědecký sekretář Sekce asistované reprodukce České gynekologické a porodnické společnosti České lékařské společnosti Jana Evangelisty Purkyně.
- eventId: 1626370
  start: 2026-10-11T08:33:00Z
  stop: 2026-10-11T09:00:00Z
  title: Žárovky
  description: Mladí vědci a vědkyně mění svět: Přes den zkoumá molekuly, které umějí nasávat skleníkové plyny. Večer Daniel Kortus napravuje omyly o klimatu na sociálních sítích.
