  title: Radiokniha
  description: 'Markéta Hejkalová: Dům pod náměstím (2/10). Továrna Veselých za první světové války velmi ztratila. Objeví se však nový, schopný ředitel? Dům kupuje Josef Vlkovský. Provozuje v něm velmi úspěšné a oblíbené lahůdkářství. Říká se mu "U Vlků" - i podle vlka s Karkulkou, který zdobí výlohu. Pro rozhlas připravila Blanka Kostřicová. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkuje Zdeněk Bureš.'
