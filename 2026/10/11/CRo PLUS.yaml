- eventId: 1626175
  start: 2026-10-11T01:05:00Z
  stop: 2026-10-11T01:33:00Z
  title: Portréty
  description: Slavné únosy. V březnu 1932 byl unesen syn slavného amerického pilota Charlese Lindbergha. Přestože rodiče zaplatili vysoké výkupné, dítě bylo objeveno po dvou měsících mrtvé. Po třech letech byl za únos a vraždu odsouzen muž, o jehož vině dodnes někteří pochybují. Ve speciálu Portrétů věnovaném slavným únosům příběh připomenou Jan Adamec a David Hertl.
- eventId: 1626176
  start: 2026-10-11T01:33:00Z
  stop: 2026-10-11T02:00:00Z
  title: Kultura Plus
  description: Česko jako čestný host na veletrhu knih ve Frankfurtu nad Mohanem. Švejk je český Forest Gump. A také přehlídka Deisgnblok v Praze. To je kulturní týdeník Michaely Veteškové.
- eventId: 1626177
  start: 2026-10-11T02:00:00Z
  stop: 2026-10-11T02:05:00Z
  title: Zprávy
