- eventId: 1626362
  start: 2026-10-11T06:05:00Z
  stop: 2026-10-11T06:34:00Z
  title: Vertikála
  description: 'Rok od příměří v Gaze: Život bez domova, vody a bezpečí. Jak vypadá každodenní realita místních obyvatel a jak pomáhají čeští dárci? Zeptáme se. Ve věku 99 let zemřel evangelický farář, teolog a signatář Charty 77 Jakub S. Trojan. Pohřbíval Jana Palacha. Válečné trauma na druhou zažívají už čtyři a půl roku ukrajinské psychoterapeutky. Mluvit budeme o tom, jak se vyrovnávají nejen s traumaty svými, ale i svých klientů.'
- eventId: 1626363
  start: 2026-10-11T06:34:00Z
  stop: 2026-10-11T07:00:00Z
  title: Vertikála
  description: Role kněží ve společnosti - taková je debata Vertikály. Co je na kněžství podstatné? A může v budoucnu kněžská služba vypadat úplně jinak než dnes? I na to se ptá debata Vertikály s katolickými kněžími Michalem Martinkem a Vojtěchem Razimou. Moderuje Karolina Antlová.
