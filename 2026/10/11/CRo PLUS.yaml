- eventId: 1626178
  start: 2026-10-11T02:05:00Z
  stop: 2026-10-11T03:00:00Z
  title: Téma Plus
  description: Ocitnout se v cizí zemi ve vězení třeba i na řadu let, to se může snadno stát, i když nejste zločinci. Alespoň podle domácích měřítek. Své o tom vědí bývalý poslanec Ivan Pilip a někdejší studentský aktivista Jan Bubeník, kteří se v roce 2001 ocitli v kubánském vězení. Tamní úřady je podezíraly z podvratné činnosti proti režimu Fidela Castra. České diplomacii dalo hodně práce dostat oba občany zpět domů. Jak na tuto událost po pětadvaceti letech vzpomínají její hlavní aktéři? A jak může český stát pomoci svým občanům uvězněným v cizině? Dozvíte se ve druhém dílu série Tématu Plus Unesení, uvěznění, zajatí - příběhy Čechů zadržených v zahraničí, který připravila Naďa Reviláková.
- eventId: 1626249
  start: 2026-10-11T03:00:00Z
  stop: 2026-10-11T03:05:00Z
  title: Zprávy
  subtitle: Aktuální události doma i ve světě
- eventId: 1626250
  start: 2026-10-11T03:05:00Z
  stop: 2026-10-11T03:30:00Z
  title: Peníze a vliv Jany Klímové
  description: Vezmou nám už za pár let práci roboti, kteří vypadají jako my? Humanoidi už začínají opouštět laboratoře a přichází do firem. Na jaké profese si brousí zuby a jak ovlivní trh práce? O tom je nový díl pořadu.
- eventId: 1626251
  start: 2026-10-11T03:30:00Z
  stop: 2026-10-11T04:00:00Z
  title: Zaostřeno
  description: Od teroristických útoků Hamásu na Izrael uplynuly tři roky. Jak se od té doby změnil pohled lidí v Česku na Izraelce a Palestince? Co dominuje české debatě? A proč si tuzemská politická reprezentace, bez ohledu na to, kdo je zrovna u vlády, zachovává proizraelský postoj? Názory z obou stran nabízí Zaostřeno Víta Pohanky.
- eventId: 1626252
  start: 2026-10-11T04:00:00Z
  stop: 2026-10-11T04:05:00Z
  title: Zprávy
  subtitle: Aktuální události doma i ve světě
- eventId: 1626253
  start: 2026-10-11T04:05:00Z
  stop: 2026-10-11T04:34:00Z
  title: Reportáže zahraničních zpravodajů
  description: Nadechnout se, uvolnit a pak už se jen potopit. Kypr hostil mistrovství světa ve freedivingu. Jak si vedla česká soutěžící? Jordánsko oživuje biblická místa koncerty vážné hudby. Sedm hrnců, sedm různých chilli a od Texasu po Miami. Soutěž o to nejlepší sbližuje ve Washingtonu sousedy. Jak si s vařečkou vedla naše zpravodajka? I o tom budou Reportáže zahraničních zpravodajů s Lubicou Bergmanovou.
