  description: Entlang des Äquators erstrecken sich zahlreiche Korallenriffe im Pazifik - die artenreichsten der Erde. Komplexe Lebensgemeinschaften, in denen viele Arten aufeinander angewiesen sind. Die winzigen Korallentierchen erschaffen den Lebensraum für alle anderen - von bunten Fischen aller Art bis zu Meeresschildkröten, Mantarochen und Walhaien. Die Vielfalt der Riffe gerät jedoch durch Klimawandel und Meeresverschmutzung zunehmend in Gefahr. Einige besonders artenreiche Naturräume der Erde finden sich entlang des Äquators. Diese Reihe stellt Fauna, Flora und die unterschiedlichen Landschaften der spektakulärsten Regionen vor.
