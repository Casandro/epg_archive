  title: Naturparadiese am Äquator
  subtitle: Pazifische Korallengärten
  widescreen: true
  hd: true
  description: Entlang des Äquators erstrecken sich zahlreiche Korallenriffe im Pazifik - die artenreichsten der Erde. Komplexe Lebensgemeinschaften, in denen viele Arten aufeinander angewiesen sind. Die winzigen Korallentierchen erschaffen den Lebensraum für alle anderen von bunten Fischen aller Formen und Größen bis zu Meeresschildkröten, Mantarochen und Walhaien. Die Vielfalt der Riffe gerät jedoch durch Klimawandel und die Meeresverschmutzung zunehmend in Gefahr.
