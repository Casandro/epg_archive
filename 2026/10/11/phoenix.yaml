  title: Wenn die Alpen glühen
  subtitle: Meine letzte Herausforderung
  widescreen: true
  hd: true
  description: Reinhold Messners materieller Nachlass ist bereits geregelt. Doch viel wichtiger ist ihm der Erhalt und die Weitergabe seines geistigen Erbes an seine über 35 Jahre jüngere Ehefrau Diane. Mehrere Tage verbrachte das Filmteam mit Reinhold und Diane Messner in Sexten und auf Schloss Juval. Jede Ecke dieses Refugiums steckt voller Erinnerungsstücke an ein ausgefülltes, aber auch verlustreiches Leben. Mit Hilfe selten gezeigter Filmausschnitte aus dem Archiv des BR und der ARD porträtiert der Film Reinhold Messner als privat wie beruflich kompromisslosen Menschen.
