  title: Die Killer des Kremls
  subtitle: Moskaus mysteriöse Morde
  widescreen: true
  hd: true
  description: "Abweichler, Journalisten und Oppositionelle leben in Russland gefährlich. Sie sterben durch Gift, auf offener Straße durch Schüsse oder unter mysteriösen Umständen im Arbeitslager. Es scheint fast so, als ob das Regime immer wieder unliebsame Kritiker einfach ausschaltet. Und das zur Abschreckung meist öffentlich. Beweise gibt es kaum. Dabei liegt die Täterschaft russischer Geheimdienste nah: Sind sie die Killer des Kremls?\n\n \n\nSeit Jahren bestehen im Grunde nur wenige Zweifel daran, wie Putins Apparat mit Kritikern oder sogenannten Landesverrätern umgeht."
