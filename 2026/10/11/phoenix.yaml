  title: Afrikas Berge (1/4)
  subtitle: 'Südafrika: Drakensberge'
  widescreen: true
  hd: true
  description: Die Felsen der Drakensberge, die an Drachenzacken erinnern, gaben dem größten Gebirge Südafrikas seinen Namen. Bergführerin Zee Ndaba, eine der ersten schwarzen Südafrikanerinnen in ihrem Beruf, inspiriert junge Menschen aus den umliegenden Dörfern zum Wandern und zeigt ihnen die Schönheit ihrer Heimat. Der Geologe Digby Gold erklärt die Entstehung dieses Gebirges durch vulkanische Eruptionen. Doch der Klimawandel bedroht das Gleichgewicht der Ökosysteme. Biologen der südafrikanischen University of the Free State erforschen seine Auswirkungen auf die Drakensberge.
- eventId:
