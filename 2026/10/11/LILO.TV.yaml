  title: So schmeckt die Welt - Toronto
  subtitle: So schmeckt die Welt - Toronto
  description: Eine aufregende und trendige Erkundungstour durch Toronto, die kanadische Metropole. Hier dreht sich alles um Kunst, Musik und Architektur - genau wie in dieser 45-minütigen Dokumentation. Als Herzschlag des Landes ist diese Millionenstadt so kreativ, innovativ und impulsiv wie keine andere. Wir werden Zeugen von Menschen, die bewegen, verändern, provozieren und polarisieren. In diesen 45 Minuten erlebst du das wahre Toronto! Ein Lifestyle-Erlebnis der Extraklasse!
