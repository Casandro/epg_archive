- eventId: 1501685
  start: 2026-10-11T01:23:00Z
  stop: 2026-10-11T02:43:00Z
  title: Novi život
  subtitle: Magazin
  description: Nova sezona ,,Novog života donosi i nova lica! U voditeljskoj ulozi od ove sezone izmjenjuju se Ivana Marić i Nika Antolos, a prvu emisiju otvara Ivana uz glumca Marka Cindrića. Publika ga poznaje s kazališnih dasaka, filma i televizije, no iza uloga krije se priča koju dosad možda nismo poznavali. Kako su ga odbijanja odvela sve do Oxforda? Kada je vjera prestala biti samo nešto naslijeđeno i postala njegov osobni izbor? Je li za čovjeka veći test neuspjeh ili upravo uspjeh? I gdje završava zdrava ambicija, a počinje ego? Uz Marka je i fra Ivan Bradarić, njegov dugogodišnji prijatelj i važan suputnik na putu vjere. Govorit će o odnosu koji se mijenjao i sazrijevao kroz godine, ali i o tome kako je Marko svoju vjeru pretvorio u nešto vrlo konkretno - kilometre koje trči kako bi pomogao drugima. Može li se pomagati bez stavljanja sebe u središte? Što čovjeka nosi kada dođe do granice snage? I što ostaje kada se utišaju aplauzi, uspjesi i sve ono po čemu nas drugi poznaju? Novi život - nova sezona, nove voditeljice i iskreni razgovori o vjeri koja se živi.
