  title: Zlatni savjeti
  subtitle: Religijski
  description: Amarant ili šćir poznat je po svom bogatom nutritivnom sastavu, bogat je željezom, magnezijem, kalcijem, folnom kiselinom, a ne sadrži gluten. On je vrijedna prehrambena namirnica, a njegovo sjeme može se pripremati kao kaša za doručak, prilog umjesto riže ili krumpira te dodavati juhama, povrću i salatama. Od kuhanog amaranta mogu se napraviti popečci i deserti, od njegovih zrnaca kokice, a od brašna palačinke, kruh, peciva i kolači.
