  description: |-
    "Čipka od okova i milosrđa" - Bl. Alojzije Stepinac i Lepoglava
    U povodu 80. obljetnice osude blaženoga Alojzija Stepinca, u nedjelju 11. listopada ponovno donosimo reportažu iz Lepoglave - mjesta njegova zatočeništva i svjedočanstva vjere, čiji se tragovi osjećaju i danas. Upravo je 11. listopada 1946. blaženi Alojzije Stepinac osuđen na 16 godina zatvora s prisilnim radom, nakon montiranog sudskog procesa pred kojim je izgovorio svoje poznate riječi obrane: ,,Moja je savjest čista.
