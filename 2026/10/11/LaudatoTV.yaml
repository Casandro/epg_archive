- eventId: 1501684
  start: 2026-10-11T00:55:00Z
  stop: 2026-10-11T01:23:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Wild Goose (2018) Dokumentarni
  description: Najveći dar Duha Svetoga je Duh Sveti. Živi Bog daje dar samog sebe onima koji su kršteni. Od Duha teku drugi darovi, od kojih su neki za naše osobno zadovoljstvo dok su drugi za izgradnju i podršku tijela Kristova. Mnogi od darova su nam vrlo bliski (mudrost, savjet, ljubav) dok su nam drugi nešto strano (ozdravljenje, proroštvo, jezici). Ma kakvo bilo naše iskustvo, darovi Duha Svetoga su za sve kršćane, i nitko ne bi trebao misliti da ih nije zaslužio.
