  title: Čovjek prije svega
  subtitle: Magazin
  description: U novom serijalu Laudato televizije ,,Čovjek prije svega svećenike upoznajemo iz druge perspektive - kroz njihove osobnosti, talente, interese i svakodnevicu. U prvoj epizodi upoznajemo vlč. Anđelka Katanca, župnika Župe sv. Blaža u Zagrebu i povjerenika za pastoral migranata i turista. Otkrivamo njegovu veliku ljubav prema Južnoj Koreji i korejskom jeziku, koji je počeo učiti čitajući Bibliju, njegova putovanja u Koreju te susrete s drukčijom kulturom i ljudima. Upoznajemo i njegovu osobniju stranu - ljubav prema filmu, jezicima i učenju - te čovjeka iza svećeničkog poziva.
