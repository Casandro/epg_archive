  description: U emisiji gostuje predsjednik humanitarne udruge "Savao" Zvonko Jambrešić. Nakon stradanja u ratu, patnje i lutanja došlo je do promjene u njegovom životu. Na poticaj drage osobe krenuo je na susret karizmatske molitvene zajednice "Maranatha". Kroz molitvu, zajedništvo i mnoga hodočašća osjetio je Božje djelovanje i prisutnost. Posebno ističe hodočašće u Međugorje gdje je fizički osjetio Božju blizinu i ljubav. Na hodočašću u Francuskoj imao je priliku volontirati u menzi što je na njega ostavilo snažan dojam, te je po povratku u Hrvatsku počeo humanitarno djelovati kod Misionarki ljubavi. Nedugo nakon toga dobio je nadahnuće i potvrdu da je to njegov poziv, te pokrenuo humanitarnu udrugu "Savao".
