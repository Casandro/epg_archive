  description: Von KI-basierter Fallanalyse lässt sich Thomas Borchert wenig beeindrucken. Als Hauptmann Furrer ihn und seine Chefin Dominique Kuster bei der Jagd nach einem unheimlichen Serienmörder um Hilfe bittet, vertraut der 'Anwalt ohne Lizenz' lieber auf seine Menschenkenntnis und Intuition. Zwischen den Opfern - einem Studenten, einem Koch, einer Polizistin und einer Politikerin - gibt es keine erkennbaren Verbindungen. Bei den perfekt ausgeführten Morden geht der 'Zürich-Killer' unterschiedlich vor, hinterlässt aber jedes Mal eine Pappschablone mit der Darstellung von Sonne und Mond.
