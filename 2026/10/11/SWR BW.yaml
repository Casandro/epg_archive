  description: Im zweiten Teil der Doppelfolge kommt Christian Kohlund als Titelheld einer tragischen Kette von Ereignissen als Auslöser für die Morde auf die Spur und gerät dabei selbst in Lebensgefahr. Regisseur Roland Suso Richter und sein Kameramann Andrés Marder finden auch im zweiten Teil für die von Wolf Jakoby erdachte Story um die Ereignisse am Tag einer Sonnenfinsternis starke und einprägsame, teils mystische Bilder. David und Anne Bennent spielen eindringlich ein verschworenes Geschwisterpaar, dessen Geschichte immer weiter aufgeblättert wird.
