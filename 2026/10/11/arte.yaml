  stop: 2026-10-11T09:30:00Z
  title: Wilde Kunst
  subtitle: Deutschland 2026
  subtitled: true
  description: Es gibt Tiere, die singen, einige tanzen, manche vollbringen architektonische Spitzenleistungen. Aber entwickeln sie dabei auch Fantasie und Gestaltungskraft? Oder spulen sie nur angeborene Verhaltensmuster ab? Könnte es sein, dass die Wurzeln menschlicher Kunst weit zurück ins Reich der Tiere reichen? Und wenn ja, was haben diese davon?
