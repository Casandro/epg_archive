- eventId: 1073053
  start: 2026-10-11T03:20:00Z
  stop: 2026-10-11T04:05:00Z
  title: Beachtliche Bauten und ihre wilden Nachbarn
  subtitle: Am Wasser
  subtitled: true
  description: Die wenigsten wissen, dass Europas größte Sehenswürdigkeiten zugleich Refugien für Wildtiere sind. Die Dokumentation führt vom Mont-Saint-Michel bis zur Alhambra und zeigt, wie Gezeiten, Flüsse und ausgeklügelte Wassersysteme Rückzugsorte für Seehunde, Adler, Fledermäuse und Salamander geschaffen haben. Ein spektakulärer Ausflug zu beachtlichen Bauten und ihren wilden Nachbarn.
- eventId: 1073054
  start: 2026-10-11T04:05:00Z
  stop: 2026-10-11T04:35:00Z
  title: Die Mythen der Wikinger (7/10)
  subtitle: Sigurd und die Walküre
  description: 'Die Reihe erzählt die Geschichte der nordischen Götter, von Odins Visionen bis zur Götterdämmerung Ragnarök. In dieser Folge: Der Fluch des Rings lastet erneut auf dem Menschenreich. Regin, der Sohn des getöteten Zauberers, will sich an seinem Bruder Fafnir rächen, der im Besitz des väterlichen Schatzes und eines magischen Rings ist. Er überredet Sigurd, den Drachen zu besiegen.'
- eventId: 1073055
  start: 2026-10-11T04:35:00Z
  stop: 2026-10-11T05:30:00Z
  title: Bauen im Kreislauf
  subtitle: Deutschland 2025
  subtitled: true
  description: 'Klimaneutrales Bauen braucht radikale Ideen. Zirkuläres Bauen heißt: Jedes Gebäude wird so konstruiert, dass es später zur Materialquelle für neue Häuser wird. Statt Abriss und Abfall entsteht ein geschlossener Kreislauf. Forschende, Architektinnen und kommunale Entscheider - sie alle haben eine Vision: Die Stadt der Zukunft wird zur Mine - und damit ein Lager wertvoller Baustoffe.'
- eventId: 1073056
  start: 2026-10-11T05:30:00Z
  stop: 2026-10-11T06:25:00Z
  title: Auf den Spuren der Cheops-Pyramide
  subtitle: Wunder der Architektur
  subtitled: true
  description: Die Cheops-Pyramide gehört zu den Pyramiden von Gizeh, dem einzigen noch erhaltenen Weltwunder der Antike. Sie wird auch als "Große Pyramide" bezeichnet und wurde vor über 4.500 Jahren im westlichen Niltal, etwa 25 Kilometer von Kairo entfernt, als Grabmal des Königs Cheops erbaut. Mit einer Höhe von ursprünglich 146 Metern ist sie die höchste Pyramide des Landes. Wie konnten die Ägypter ohne moderne Werkzeuge ein so monumentales Bauwerk errichten? Die Dokumentation stellt innovative archäologische Forschungen vor, die dabei helfen, das ehrgeizige Bauvorhaben besser zu verstehen.
- eventId: 1073086
  start: 2026-10-11T06:25:00Z
  stop: 2026-10-11T07:15:00Z
  title: Legendäre Liebespaare des Kinos
  subtitle: Steve McQueen und Ali MacGraw
  description: Ali MacGraw und Steve McQueen waren zwei Schauspielgrößen, die das Kino der 1970er Jahre prägten. MacGraw wurde durch "Love Story" zur Symbolfigur einer neuen Weiblichkeit. McQueen wurde durch Produktionen wie "Bullitt" und "Le Mans" zum Inbegriff des Action-Helden. Ihre Begegnung beim Dreh zu "Getaway" (1972) war der Beginn einer leidenschaftlichen, aber komplizierten Beziehung.
- eventId: 1073087
  start: 2026-10-11T07:15:00Z
  stop: 2026-10-11T07:45:00Z
  title: Alt wird Neu - Neues Leben für historische Gebäude (2/4)
  subtitle: Industriebauten
  genre:
  - '112'
  description: 'Gebäude sparen Energie: jedoch nicht nur bei energetisch effizienten Neubauten. Deutlich umweltfreundlicher ist es, bestehende Gebäude zu sanieren. Gebäude erzählen Geschichten: Nachhaltiges Bauen bedeutet jedoch viel mehr als nur Energiesparen. Der historische Gebäudebestand ist Stein gewordene Geschichte. Gebäude müssen sich verändern: Eine Stadt ist ein lebendiger Organismus, der sich ständig verändert - wie die Gesellschaft auch. Bauen im Bestand bedeutet daher nicht nur Sanierung. Es ist vor allem das kreative Weiterbauen, das seine Qualität ausmacht - wie die Beispiele aus dieser Reihe zeigen.'
- eventId: 1073088
  start: 2026-10-11T07:45:00Z
  stop: 2026-10-11T08:20:00Z
  title: Twist
  subtitle: 'Digital Detox: Macht offline glücklich?'
  subtitled: true
  description: Kein googeln, doomscrollen oder Mails checken - das Handy wegzulegen, fällt oft schwer. Dabei löst die ständige Bilder- und Nachrichtenflut, die Aggression im Netz, das Posten auf Social Media doch Stress aus und lässt die Sehnsucht nach Innehalten, Langsamkeit und dem Analogen wachsen. Handy aus! Aber können wir das überhaupt noch? Wie geht Offline-Sein?
- eventId: 1073089
  start: 2026-10-11T08:20:00Z
  stop: 2026-10-11T08:45:00Z
  title: Zu Tisch
  subtitle: Rhön
  genre:
  - '144'
  subtitled: true
  description: 'Die Rhön erstreckt sich über das Dreiländereck Hessen, Thüringen und Bayern und wird wegen seiner weiten Ausblicke auch das "Land der offenen Fernen" genannt. Im Naturschutzgebiet Lange Rhön hält Julia Djabalameli eine der ältesten Schafrassen der Welt: das Rhönschaf. Gemeinsam mit der Hofgemeinschaft nebenan feiert die Schäferin das Erntedankfest - mit Lammkeule und dem Rhöner Blechkuchen Ploatz.'
- eventId: 1073090
