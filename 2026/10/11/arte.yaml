  title: Mary Cassatt, Malerin des Impressionismus
  subtitle: Großbritannien 2023
  description: Die amerikanische Malerin Mary Cassatt (1844-1926) schuf mit ihren unkonventionellen Werken im ausgehenden 19. Jahrhundert zur Zeit des Impressionismus eine neue Darstellungsweise der Frau in der Kunst. Indem sie vor allem Mütter mit Kindern zeichnete, gelang es Cassatt das bis dahin männlich dominierte Frauenbild in der Kunst sowie im gesellschaftlichen Leben in ein emanzipatorisches und modernes Licht zu rücken. Sie selbst blieb bis zu ihrem Tod im Jahr 1926 unverheiratet und kinderlos. Der Film ist der außergewöhnlichen, doch lange Zeit wenig beachteten Künstlerin gewidmet.
