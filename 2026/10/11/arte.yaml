  description: "Trotz weiterer Anschläge von beiden Seiten beginnen Friedensverhandlungen zwischen den Konfliktparteien. 1994 wird ein erster Waffenstillstand geschlossen, aber bald darauf gebrochen. Erst mit dem Karfreitagsabkommen von 1998 wird ein dauerhafter Frieden möglich. \nNordirland bleibt Teil Großbritanniens, die Gefangenen werden entlassen und die Kampfhandlungen hören auf. Es wird ein Versöhnungsprozess notwendig, der bis heute andauert."
- eventId: 1073016
