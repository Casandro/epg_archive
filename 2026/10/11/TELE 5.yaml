  description: |-
    Göttliches Wunder oder dämonische Besessenheit? Als Xena und Gabrielle in Indien einer mystischen Zeremonie beiwohnen, kommt es zu einem übernatürlichen Zwischenfall. Die Dämonin Tataka ergreift Besitz von Gabrielle! Zunächst bleibt der Vorfall unbemerkt. Aber als Gabrielle plötzlich damit beginnt, Menschen auf wundersame Weise zu heilen sowie eine vermeintlich göttliche Aura zu versprühen, wird Xena klar, dass hier etwas Seltsames im Gange ist. Gemeinsam mit dem echten Heiler Eli (Timothy Omundson) muss die Kriegerprinzessin einen Weg finden, Tataka zu bezwingen, ohne Gabrielle dabei zu töten.
