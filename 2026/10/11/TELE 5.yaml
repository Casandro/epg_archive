  title: Hercules
  subtitle: Das grünäugige Monster
  description: |-
    Diesmal hängt der Haussegen über den Wolken schief. Als sich Aphrodites Sohn Eros (Karl Urban) in die bildhübsche Psyche (Susan Ward) verliebt, gehen mit der eifersüchtigen Schönheitsgöttin die Pferde durch. Hinzu kommt, dass Eros mit seinem fehlgeleiteten Pfeil der Verführung ausgerechnet Hercules trifft! Nun ist auch der Halbgott unsterblich in Psyche verliebt, die dessen Zuneigung geschmeichelt erwidert. Allerdings entsteht dadurch ein neues Problem: Aufgrund eines himmlischen Fluchs verwandelt sich der verschmähte Eros in ein geflügeltes Monster...
    USA 1996
  widescreen: true
- eventId: 1578535
  start: 2026-10-11T01:10:00Z
  stop: 2026-10-11T01:55:00Z
  title: Hercules
  subtitle: Prinz Hercules
  description: |-
    Nachdem Hercules von einem Blitz der Göttin Hera niedergestreckt worden ist, leidet er unter akutem Gedächtnisverlust. Der Halbgott hat schlichtweg vergessen, wer er ist. Königin Parnassa (Jane Thomas), die mit Hera unter einer Decke steckt, nutzt die Situation für ihre Zwecke. Sie manipuliert Hercules und gaukelt ihm vor, er wäre der Prinz in ihrem Reich. Während ein ziemlich verwirrter Hercules Schwierigkeiten hat, sich mit der royalen Rolle als Prinz anzufreunden, verbündet sich Iolaus mit Prinzessin Kirin (Sam Jenkins), um die Amnesie seines Freundes zu heilen, bevor es zu spät ist.
    USA 1996
