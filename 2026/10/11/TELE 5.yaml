  description: |-
    Heather Millam hält an einer Tankstelle bei Salt Lake City und geht schnell zur Kasse, als ein Mann in ihr Auto steigt und davonfährt. Doch im Wagen sitzen ihre Töchter, die 13-jährige Josslyn und ihre sechs Monate alte Schwester Ivy. Heather gerät in Panik: Will der Kerl nur das Auto stehlen, oder hat er es auf die Kinder abgesehen? Wenn es sich um eine Entführung handelt, sind die Mädchen in Lebensgefahr und jede Sekunde zählt. Polizei und Spezialeinheiten werden sofort alarmiert und mobilisieren alle Kräfte, um das Gebiet zu durchkämmen. Währenddessen bangt Josslyn um ihr und Ivys Leben.
