  title: Na nedělní vlně z Pardubic
  description: 'Pardubičtí architekti a stavitelé: Richard Goldreich Práci talentovaného Richarda Goldreicha vyhledávali na řadě míst Česka. V Pardubicích postavil především ikonu průmyslové architektury - budovu továrny Telegrafia, později Tesla. Ale také řadu obytných domů a vil, které stavěl na svou dobu velmi inovativní metodou. Jeho tvorbu přerušila 2. světová válka, byl židovského původu a skončil v koncentračním táboře. Připravila reportérka Šárka Rusnáková.'
