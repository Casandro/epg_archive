  title: Východočeské výlety
  description: Bělá u Luže je půvabná obec v údolí Anenského potoka, která bývala dlouho samostatná, dnes je součástí Luže. Stojí za to poznat ji při příjemné procházce, která začíná třeba u židovského hřbitova v sousedních Hroubovicích a končí na rozhledně Jahůdka. Pokud budete mít štěstí, potkáte přímo u rozhledny jejího tvůrce, který vám o stavbě rád povypráví. Je totiž soukromá, její majitel ji ale postavil pro veřejnost a vybudoval k ní dokonce i lanovku. Připravila reportérka Šárka Rusnáková.
