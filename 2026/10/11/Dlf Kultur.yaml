  title: Plus Eins
  description: "Abschied und neue Liebe mit Mitte 40\nUtz Dräger im Gespräch mit Brenda Strohmaier\n\nBrenda Strohmaeier verlor ihren Mann als sie Mitte 40 war. Die Journalistin erzählt, wie sie mit Trauer, Humor und der Hilfe von Freunden weiterlebte und auch wieder datete. Heute lebt sie in Marseille, Berlin und Brüssel und fragt sich, wo sie eigentlich zu Hause ist - und wie man mit Freude alt werden kann. \n\nGewalt in der Ehe - ?Ich hab' mich geniert? \nUtz Dräger im Gespräch mit Annika Mayer\n\nRose wird in den 50er-Jahren als junge Frau in eine Ehe mit dem deutlich älteren Rolf gedrängt. Nach der Eheschließung stellt sich schnell heraus, dass Rolf gewalttätig ist. Wie Rose damit umgeht und welche Spuren die Gewalt bei ihr und ihrer Familie hinterlässt, das erzählt Roses Enkelin, die Filmemacherin Annika Mayer, in ihrem Film ?Home Sweet Home?.\n11:00-11:05 Nachrichten"
