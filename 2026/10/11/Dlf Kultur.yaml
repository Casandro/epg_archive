- eventId: 1481498
  start: 2026-10-11T01:05:00Z
  stop: 2026-10-11T04:55:00Z
  title: Tonart
  subtitle: Urban
  description: |-
    Urban
    Moderation: Carsten Rochow

    Drei Acts bekommen in der Tonart Urban etwas mehr Aufmerksamkeit. Zum Beispiel Emily A. Sprague und ihr wunderschönes neues Album Cyano. Die Ambient-Künstlerin, Sounddesignerin und Modular-Synthesizer-Spezialistin verbindet darauf ihre schwebenden elektronischen Klangwelten stärker mit ihrer Stimme und dem Songwriting, das wir von ihrer Band Florist kennen.
    Vanishing Twin haben ebenfalls ein neues Album veröffentlicht: Archives. Das nehmen wir zum Anlass, nicht nur da reinzuhören, sondern auch mal quer durch die eigenwillige Diskografie dieses britischen Experimental-Pop-Trios.
    Und wir müssen uns wieder mit pdqb beschäftigen. Das Projekt des Medienkünstlers Sascha Dornhöfer hat allein in diesem Jahr schon eine ganze Handvoll Alben und EPs mit teils herrlich skurriler Elektronik veröffentlicht. Ich gebe zu: Ich bin Fan. Und Sie können es werden - an einem dieser Sonntagmorgen voller Musik mit Synthesizern.
    04:00-04:05 Nachrichten

    05:00-05:05 Nachrichten

    06:00-06:05 Nachrichten
