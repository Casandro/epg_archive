  title: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  description: 'Kennen Sie Mitteldalmatien? Haben Sie schon mal etwas von den Städten Trogir, Marina, Seget, Okrug oder Kastella gehört? Schauspieler Falk-Willy Wild nimmt Sie mit auf seine ganz persönliche Entdeckungsreise durch die Region. So lernt er die Altstadt von Trogir kennen mit ihren wunderschönen Palästen und Kirchen aus verschiedenen Jahrhunderten. Auf dem Rad geht es über die Straße der Kastelle am Meer entlang und Falk-Willy Wild erfährt so manche Geschichte über die historischen Befestigungsanlagen. Im hügeligen Hinterland wandert er auf historischen Pfaden zu Aussichtspunkten, von wo er die traumhaften Ausblicke zur Küste hin genießt. Ein Museum der anderen Art erkundet er mit Schnorchel in der Adria: Das einzigartige Unterwassermuseum mit seinen großen Statuen ist ein beliebter Tauch-Hotspot sowohl für Anfänger als auch erfahrene Taucher. An einer abgelegenen Badebucht genießt Falk-Willy anschließend die mediterrane Küche mit ihrer tollen Vielfalt aus frischem Fisch, Fleisch und Gemüse aus der Region. DE 2022'
- eventId: 1600780
  start: 2026-10-11T04:55:00Z
  stop: 2026-10-11T05:00:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  description: 'Schauspieler Oliver Hörner begibt sich auf Entdeckungsreise auf die kroatischen Inseln Krk, Cres, Losinj und Rab in der Adria: Römische Spuren, Altstädte mit engen Gassen, pittoreske Fischerdörfer, Wein, der 30 Jahre lang im Meer gereift ist, eine Tropfsteinhöhle. Wo befinden sich traumhafte Sandstrände und abgelegene Badebuchten? Mit dem Fahrrad lassen sich die Inseln am besten erschließen. Oliver Hörner wandert über Karstplateaus und genießt den herrlichen Rundumblick über die Inselwelt Kroatiens, fährt durch einen der letzten Eichenwälder des Mittelmeerraums, entdeckt die weltweit einzigartigen Gänsegeier in freier Wildbahn und beobachtet Delfine vom Boot aus. Zudem genießt der Schauspieler die kroatische Kulinarik mit Lammspezialitäten, Kvarner Scampi, traditionellem Oktopus-Eintopf und Raber Torte. DE 2021'
- eventId: 1600791
  start: 2026-10-11T05:00:00Z
  stop: 2026-10-11T05:05:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Novalja auf der Insel Pag mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Novalja auf der Insel Pag mit Oliver Hörner
  description: 'Die Insel Pag mit ihrem Hauptort Novalja war schon zu Zeiten der Römer eine beliebte  Adresse. Das Imperium legte den Hafen der Stadt an und baute vor rund 2000 Jahren ein geradezu unglaubliches, unterirdisches Aquädukt, das Touristen bestaunen können. Viele Jahrhunderte alt sind auch die unzähligen Olivenbäume, die die Landschaft von Pag prägen und die - neben dem vorzüglichen Schafskäse - mit ihren Ölen maßgeblich die Kulinarik beeinflussen. Pag: Das ist ein touristisches Nahziel in Europa und ein Geheimtipp für Aktivurlauber, die saubere Strände, das klare Wasser und viele Ausflugsangebote schätzen. Der Schauspieler Oliver Hörner und sein Kamerateam haben die Insel mit dem Fahrrad, dem Motorrad und zu Fuß erforscht und präsentieren mit ihrer Reportage eine Destination, die noch immer als Geheimtipp bezeichnet werden kann. DE 2021'
- eventId: 1600792
  start: 2026-10-11T05:05:00Z
  stop: 2026-10-11T05:57:00Z
  title: Höhenflüge - Im Ballon über Sri Lanka
  subtitle: Höhenflüge - Im Ballon über Sri Lanka
  description: Perle des Indischen Ozeans wird Sri Lanka genannt. Die Insel vor der Südostküste Indiens war lange Zeit ein weißer Fleck auf der Weltkarte der Ballonfahrer. Erst 2002 brachte der Flugzeugpilot Anil Jayasinghe den ersten Heißluftballon auf die Insel. Sri Lanka galt als ungeeignet für den Heißluftballonsport, denn die dicht besiedelte Insel bietet kaum freie Flächen für die Landung. Inzwischen ist das von Anil organisierte "Sri Lanka Ballon Festival" ein beliebtes Treffen der Szene. Vierzehn Ballon-Teams aus Europa, Asien und Amerika kommen dieses Mal zum exotischen "Ballon-Meet" - auch Phil und Allie Dunnington. Die Ballons treiben über kleine, unter Bäumen versteckte Ortschaften, große exotische Märkte, und verkehrsreiche städtische Hauptstraßen. Und wenn die Ballons über der Schule schweben, wird sogar der Unterricht ausgesetzt. Sportlich gesehen ist die größte Herausforderung die Suche nach einem Landeplatz. Zwischen Stromleitungen, Reisfeldern, Kokospalmen und Urwäldern fällt die Wahl oft schwer. Am besten bewähren sich trockene, abgeerntete Reisfelder, doch die sind rar und so muss auch mal eine Tempelbaustelle auf einem Felsplateau als Zielpunkt herhalten. Die Ballonfahrer betrachten Sri Lanka jedoch nicht nur von oben. Sie erleben eine nostalgische Zugfahrt mit der historischen Eisenbahn und beobachten wilde Elefanten, sie besuchen die geheimnisvollen Tempelruinen der alten Königsstadt Polonnaruwa, erholen sich an den traumhaften Stränden im Nordosten und durchqueren das Hochland mit seinen berühmten Teeplantagen. DE 2012
- eventId: 1600804
  start: 2026-10-11T06:05:00Z
  stop: 2026-10-11T06:57:00Z
  title: Höhenflüge - Im Ballon über Venezuela
  subtitle: Höhenflüge - Im Ballon über Venezuela
  description: 'Majestätische Tafelberge, von den Indianern Tepuis genannt, sind die Wahrzeichen der von Palmenhainen und Flüssen durchzogenen Savanne. Hier mit dem Ballon aufzusteigen, oder gar die Berge zu überqueren, ist eine große Herausforderung. Plötzliche Wetterumschwünge, ungewöhnlich viel Regen und tückische Winde stellen die Balloncrew mit den Piloten Phil und Allie Dunnington vor unkalkulierbare Probleme. Diesmal mit dabei: Werner Herzog, der bekannte Regisseur. Eine Expedition in die unwirkliche Welt auf den Gipfeln der Tepuis reizt ihn schon lange und eine Heißluftballonfahrt lässt ihn die Gran Sabana aus neuer Perspektive erfahren. Die Erlebnisse um und auf den Bergen der "Lost World" sorgen auch diesmal für einmalige visuelle Eindrücke und großartige Abenteuer. DE 2012'
- eventId: 1600805
  start: 2026-10-11T07:10:00Z
  stop: 2026-10-11T08:03:00Z
  title: Höhenflüge - Im Ballon über die Mongolei
  subtitle: Höhenflüge - Im Ballon über die Mongolei
  description: Internationale Ballonfahrer-Teams treffen sich in Ulan Bator, um die Mongolei mit Heißluftballons zu erkunden. Dazu gehören nicht nur Wettfahrten über den Sanddünen der Wüste Gobi, über spektakulären Berg- und Steppenlandschaften und über malerischen Orten, sondern auch Begegnungen mit den Einheimischen, die in der Einsamkeit der Steppe wohnen. Straßen gibt es selten und so werden die Bergungsmanöver oft abenteuerlich und sind nur mit Hilfe der Steppenbewohner möglich. Abenteuer pur. Die Ballonstarts werden noch vor dem ersten Sonnenlicht vorbereitet. Nur an den kühlen Vormittagen, wenn der Unterschied von Außenluft zum heißen Balloninneren groß ist, kann ein Ballon Piloten und Passagiere in die Höhe tragen. Heißluftballons lassen sich nicht lenken - der Wind allein bestimmt ihre Richtung und so können die Ballonfahrer unversehens über unzugängliche Schluchten und Felsen getrieben werden. Eine Herausforderung für die Piloten und ihr Team, das sie am Boden begleitet. Und manche Landung endet gefährlicher als geplant. Ebenso unvergesslich wie die Fahrten mit dem Ballon sind auch die Begegnungen mit den Menschen der Mongolei. Nirgendwo sonst in der Welt gibt es Reiter, die einen nahe am Boden schwebenden Ballon begleiten, denn Pferde haben normalerweise panische Angst vor den fauchenden Ungetümen. Die Riesenballons sind weithin sichtbar und so strömen alle, die in der Nähe sind, herbei. Auf Pferden, Kamelen, mit Mopeds und Geländewagen verfolgen sie die Ballons am Boden und beobachten mit Spannung ihre Landung. Kinder stürmen den Ballonkorb, vor allem wenn die Aussicht besteht, mal kurzzeitig nach oben zu schweben.  DE 2012
- eventId: 1600806
  start: 2026-10-11T08:10:00Z
  stop: 2026-10-11T09:02:00Z
  title: Höhenflüge - Im Ballon über die Alpen
  subtitle: Höhenflüge - Im Ballon über die Alpen
  description: Die winterlichen Alpen besitzen für Ballon-Abenteurer schon immer eine besondere Anziehungskraft. Sich hoch über die verschneiten Berge zu erheben und das majestätische Alpenpanorama in seiner vollen Pracht zu genießen, das ist nur im Ballon möglich. Doch eine Heißluftballonfahrt in den Alpen ist kein ungefährliches Abenteuer. Schroffe Gipfel, Bergseen, Wälder, Stromleitungen und Dörfer zerteilen die Landschaft in ein kleinteiliges Puzzle. Landeplätze sind rar und Notlandungen vorprogrammiert. Bei internationalen Heißluftballon-Festivals zaubern oft dutzende bunter Ballons ein gigantisches Spektakel in den Himmel und in der Nacht präsentieren beleuchtete Ballons ein phantastisches Lichtspektakel. DE 2012
- eventId: 1600810
  start: 2026-10-11T09:10:00Z
  stop: 2026-10-11T10:02:00Z
  title: Die Alpen von oben - Von Karawanken nach Graz
  subtitle: Die Alpen von oben - Von Karawanken nach Graz
  description: 'Die Alpen von oben: Von Karawanken nach Graz - Der slowenische Pilot Matev¸ Lenari ist in seinem Motorsegler unzählige Male über die Alpenkette geflogen - 100.000 Fotos sind so in luftiger Höhe entstanden. In Radenthein betreibt Hans-Jörg Aschbacher das letzte Bauernbad Europas und Peter Lizzi bietet einer der größten Fledermauskolonien Europas Quartier. In Ferlach erlernt Pamela Mozeti die Kunst der Büchsenmacherei, die hier bis ins 16. Jahrhundert zurückreicht. In den Fischteichen von Heinrich Holler auf Gut Hornegg in Preding darf ein 40-jähriger Wels auf Lebenszeit wohnen.  DE 2012'
- eventId: 1600811
