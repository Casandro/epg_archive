  title: VIP Trip - Prominente auf Reisen 6 - Campingtour Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Campingtour Kroatien mit Oliver Hörner
  description: 'Die Halbinsel Istrien und die dalmatinische Küste - Kroatien ist stets eine Reise wert. Umso mehr, wenn Sie mit einem Wohnmobil unterwegs sind. Schauspieler und Synchronsprecher Oliver Hörner hat für Sie einige der schönsten Campingplätze des Landes angesteuert: direkt am Meer, mit schattigen Stellplätzen und einem üppigem Freizeitangebot. Begleiten Sie uns auf die exklusive Insel Brijuni und das facettenreiche Eiland Pag mit seinen berühmten Pager Spitzen, dem würzigen Schafskäse und natürlich: seinem Salz. Doch Kroatien hat noch mehr zu bieten: ausgedehnte und unberührte Waldlandschaften. Streifen Sie mit uns durch den Nationalpark Risnjak in Gorski kotar mit seinen glasklaren, türkis-schimmernden Bächen. Kommen Sie mit aufunserer Fahrt im Wohnmobil durch Kroatien - der Natur ganz nah. DE 2022'
- eventId: 1600838
  start: 2026-10-11T16:45:00Z
  stop: 2026-10-11T17:13:00Z
  title: VIP Trip - Prominente auf Reisen 6 - San Antonio mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - San Antonio mit Oliver Hörner
  description: 'In dieser Reisereportage reisen wir in die Stadt San Antonio im US-Bundesstaat Texas. Texas mag für viele nach Cowboys und Westernidylle klingen, doch San Antonio steckt vielmehr voller Geschichte und Geschichten. Moderator und "Tourguide" Oliver Hörner besucht das berühmte "Alamo", ein nationales Monument, das mitten in der Innenstadt von San Antonio steht und dessen markante Ruine auf den Beginn der texanischen Unabhängigkeit erinnert. Natürlich taucht Oliver Hörner ein in diese bewegten Zeiten anfangs des 19. Jahrhunderts und stellt fest, wie stark heutzutage der Einfluss der spanisch-sprechenden Bevölkerungsgruppe ist. In der mexikanisch geprägten Gastronomie ist dieser Einfluss deutlich zu schmecken. Weit weniger bekannt ist, dass sich in San Antonio in den vergangenen rund 175 Jahren eine äußerst aktive und einflussreiche deutsche Gemeinschaft gebildet hat. Das alljährliche Oktoberfest des Beethoven-Chores ist nur ein Beispiel dafür. So lässt es sich Oliver Hörner auch nicht nehmen, den traditionellen Fassbieranstich vorzunehmen. Tägliche Streifzüge auf der Promenade entlang des San Antonio Rivers bieten eine willkommene Abwechslung: Der "Riverwalk" ist eine echte Attraktion: Zahllose Restaurants, Shops, Cafés, Kneipen mit Tanz- und Musikunterhaltung locken bis in die späten Abendstunden ein buntes Gemisch von Touristen und Einheimischen an. Aber auch das Umland von San Antonio ist sehenswert. So besucht Oliver Hörner ein klassisches Rodeo und die grandiosen Tropfsteinhöhlen der "Natural Bridge Caverns". Und die Reportage über San Antonio bietet noch mehr: Viel Atmosphäre, fetzige Musik und sogar eine Spukgeschichte. Viel Spaß! US 2023'
- eventId: 1600852
  start: 2026-10-11T17:15:00Z
  stop: 2026-10-11T17:40:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  description: 'Breslau (Wroclaw) gilt heute als eine der schönsten Städte Polens. Vor allem der historische Marktplatz rund um das mittelalterliche Rathaus erstrahlt wieder in altem Glanz, trotz der schweren Schäden infolge des 2. Weltkriegs. Die Altstadt Breslaus ist eine wahre Augenweide: Das empfand auch Schauspieler Michael Roll bei seinen Streifzügen durch die belebten Straßen und Gassen, stets auf der Suche nach den "Breslauer Zwergen", die als bronzene kleine "Mitbewohner" die Stadt bevölkern. Die Geschichte des Breslauer Zwergenvolks wird der Schauspieler natürlich erzählen. Breslau ist eine Stadt, die Kunst, Kultur und Kulinarik liebt. In etlichen Restaurants leben alte Rezepte aus Großmutters Zeiten auf, während viele Kneipen und Clubs mit allen denkbaren Musikstilen das junge Publikum anlocken. Unterwegs auf der Oder wird Michael Roll klar, warum Breslau auch als "Venedig des Ostens" bezeichnet wird. Denn zahlreiche Brücken über dem Fluss verbinden die Stadtteile und führen so etwa zur historischen Dominsel. Breslau ist auch der ideale Startpunkt für Michael Rolls Ausflüge in die alte Kulturlandschaft Niederschlesien mit ihren Schlössern, Landgütern und Kirchen. Kommen Sie doch mit! DE 2021'
- eventId: 1600853
  start: 2026-10-11T17:45:00Z
  stop: 2026-10-11T18:09:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  description: 'Das Fürstentum Liechtenstein, zwischen Österreich und der Schweiz gelegen: Klein an Fläche zwar, aber großartig was seine Geschichte, seine Kultur und seine landschaftlichen Schönheiten betrifft. Das jedenfalls ist die Erkenntnis von Schauspieler Sebastian Ströbel, die er nun auch seinen Zuschauern vermitteln möchte. Dabei begibt er sich auf den Liechtenstein-Weg. Eine Wanderstrecke, die das gesamte Fürstentum durchzieht und ihn zu den interessantesten Spots des Landes am Alpenrhein führt. Dabei ist er keineswegs alleine! Immer wieder begleiten ihn Prominente des Mikrostaates und erzählen ihm allerlei Geschichten, so etwa die berühmten Ski-Asse Tina Weirather und Marco Büchel. Auf seinen Wandertouren erkundet er die Siedlungen der Walser und lässt sich von einem Spitzenkoch erklären, wie eines der Liechtensteiner Nationalgerichte, die "Käsknöpfli", zubereitet werden. Alles in allem dürfen sich die Zuschauer auf eine Reportage freuen, die unter anderem noch anschaulich darstellt, wie ein Kleinstaat von rund 38.000 Einwohnern funktioniert... ohne eigene Währung, ohne Armee und ohne einen einzigen Kilometer Autobahn. DE 2021'
- eventId: 1600874
  start: 2026-10-11T18:15:00Z
  stop: 2026-10-11T18:35:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Offroad in der Palmwag Concession'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Offroad in der Palmwag Concession'
  description: Vom touristischen Etosha geht es zurück zum sehr lokalen Kamanjab. Wir tanken, stehen am ATM an und gehen in zwei kleinen Supermärkten einkaufen. Dabei finden wir den SPAR Markt in Kamanjab weniger gut ausgestattet als den "Oase" Supermarket, in den die Einheimischen einkaufen gegen. Nachdem wir den Grootbergpass erreicht haben, biegen wir links ab. Wir stehen an einer Lodgeauffahrt, steiler als nahezu alles, was Nico bisher gesehen hat. Auf Geröll und dann schmierseifenglattgefahrenen Asphaltsteinen geht es auf den Grootberg. Wir scheitern im ersten Versuch trotz Allrad. Die Power reicht nicht für das schwere Fahrzeug. Dann im Low-4×4 geht es langsam bergauf krabbelnd voran. Während die meisten Gäste ihr Fahrzeug unten stehen lassen und sich von den Lodgearbeitern hinaufkutschiereren lassen, haben wir es dann aber doch noch geschafft. Uns erwartet eine traumhafte Aussicht. Dort übernachten wir in einem liebevoll eingerichteten Steinhäuschen. Sowohl vom Pool als auch von der eigenen Terrasse aus hat man einen atemberaubenden Blick in den Canyon. Nachdem wir auch die Abfahrt von der Lodge meistern, geht es weiter auf die Strecke. Nun für zwei Tage immer gen Norden. Erster Stopp ist die Palmwag Lodge. Das Eintrittsgeld, welches wir in der Lodge bezahlt hatten, ist gültig für einen Tagesbesuch in der Palmwag Concession Area, einem riesigen Naturpark, in dem wir zwar nur Giraffen sehen, aber über mehrere Stunden die unterschiedlichsten Offroad-Strecken fahren und sehr viel ausprobieren, was uns in den nächsten Wochen noch in - dann nicht gesichertem Gebiet - erwartet. Uns gefällt es hier sehr gut, man kann hier sogar mehrere Tage an Strecken zurücklegen und wild campen. NA 2023
- eventId: 1600875
  start: 2026-10-11T18:35:00Z
  stop: 2026-10-11T18:52:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Baden unter dem Ongongo Wasserfall'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Baden unter dem Ongongo Wasserfall'
  description: Für uns geht es weiter auf der Hauptstrecke vorbei an der Khowarib-Schlucht, an der wir vor 5 Jahren bereits campten bis zum Ort Warmquelle. 6 km von hier Offroad geht es zur namensgebenden warmen Quelle, dem Ongongo Waterfall. Im Becken des Wasserfalls baden wir und direkt hier liegt auch unsere Campsite für die Nacht. Heute geht es durch Kaokoveld. Von unserer schönen Campsite am Ongongo-Wasserfall starten wir am Vormittag auf die Piste, die von Stunde zu Stunde schlechter wird, während es von Stunde zu Stunde immer heißer wird - auf bis zu 38°C klettert das Thermometer heute. Genau in der Hälfe der Strecke sind wir am "Ende". Denn Opuwo, die Hauptstadt der Region Kunene, bedeutet in Herero-Sprache eben genau das. Uns beeindruckt der wilde Mix aus Menschen in traditioneller Stammeskleidung und gleichzeitigem Entwicklungsprozess in der Gesellschaft. In den letzten 5 Jahren wurden aus einer Tankstelle drei und aus einem Supermarkt mindestens vier. Uns reicht der SPAR-Markt und die SHELL-Tankstelle. Danach verlassen wir den Ort wieder, und begeben uns über das Ende hinaus. NA 2023
- eventId: 1600906
  start: 2026-10-11T18:55:00Z
  stop: 2026-10-11T19:11:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Epupa Falls: An Angolas Grenze'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Epupa Falls: An Angolas Grenze'
  description: Hier im äußersten Nordwesten in Epupa stürzt der Kunene River die Epupa Falls hinab. Für zwei Nächte bleiben wir hier auf der wunderschönen Epupa Falls Lodge & Campsite - unser Camper steht unter hohen Palmen direkt am Fluss. Die Räder des Landcruisers stehen erstmals ganztägig still, so häufig wird das nicht vorkommen. Dafür sind wir zu Fuß unterwegs und erkunden die Epupa Falls auf einem kleinen Spaziergang. Diese sind doch deutlich monumentaler als der Ongongo Fall und doch schwer zu fassen, da wir uns stets an der oberen Abbruchkante befinden und die Perspektive von unten nur erahnen können. Bedeutsam ist aber auch, dass die Epupa Falls, oder besser der gesamte Kunene River die Grenze zwischen Namibia & Angola bildet. Unser Blick geht vom Camp aus also steht's in ein anderes Land. Auf dem Spaziergang und während der Zeit am Pool oder der Suche mit dem Fernglas nach Krokodilen im Fluss gelingt es sehr gut in einen Entspannungsmodus zu kommen und das obwohl wir einige Krokodile in nächster Nähe erspähen können. Um 9 Uhr geht's los auf den bisher anspruchsvollsten Streckenabschnitt. Von Epupa bis Swartbooisdrift führt eine schmale Straße in stetigem bergauf, bergab und vielen Kurven, auf fragwürdigem Untergrund. Eine Wasserdurchfahrt darf dabei natürlich auch nicht fehlen, hier definitiv aber eine der harmlosen Art. Den nächsten Streckenabschnitt bis Ruacana haben wir aus 2018 ähnlich in Erinnerung, jetzt ist alles anders. Nun führt eine breite, gut ausgebaute, geglättete Piste durch das Hinterland, nicht mehr am Kunene River entlang. Wir können uns nicht entscheiden ob wir das gut oder traurig finden sollen. NA 2023
- eventId: 1600907
  start: 2026-10-11T19:15:00Z
  stop: 2026-10-11T19:35:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  description: Der bekannte Tatort-Schauspieler Richy Müller reist mit Ihnen nach "Down under", nach Australien. Dabei begibt er sich auf spannende Entdeckungstour quer durch die Bundesstaaten Victoria und South Australia. In Victoria lockt zunächst die Fahrt entlang der Küste, vorbei an der berühmten Felsformation der "Zwölf Apostel". Eine Koala-Auffangstation bietet einen passenden Zwischenstopp, um sich über die Lebensumstände der possierlichen Baumbewohner zu informieren. In Melbourne lernt Richy Müller von einem der berühmtesten Köche des Landes,  Mark Olive, das Kochen ohne Salz. Wer hätte gedacht, dass mitunter einfache Kräuter als Würze ausreichen. Richys Känguruh-Steak schmeckt jedenfalls köstlich. Von Victoria geht es weiter nach South Australia, u.a. in die Kleinstadt Parachilna, sofern man diesen Ort überhaupt Stadt nennen kann. Hier lebt nämlich kaum mehr als ein Dutzend Menschen. Ein Kuriosum! Doch Richy zieht es bald weiter zur Küste South Australias und zu einem gemeinsamen Bad mit Delphinen. DE 2012
- eventId: 1600923
  start: 2026-10-11T19:40:00Z
  stop: 2026-10-11T20:23:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Nagasaki 1 mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 4 - Nagasaki 1 mit Michael Roll
  description: Japan ist ein Staat mit circa 6500 Inseln. Der Schauspieler Michael Roll interessiert sich für die Insel Kyushu, ganz im Süden des Archipels. Nach einem Zwischenstopp in Tokio, Hauptstadt und Wirtschaftszentrum Japans, führt die Reise nach Nagasaki. Die Stadt mit heute etwa 420.000 Einwohnern ist nach den Zerstörungen durch die Atombombe 1945 wieder aufgebaut worden. Zahlreiche Sehenswürdigkeiten wurden weitgehend so wieder hergestellt wie vor dem 2. Weltkrieg.  Dabei ist Nagasaki eine freundliche und weltoffene Stadt geblieben. Schon im 16. Jahrhundert kamen Portugiesen, Chinesen und Niederländer und trieben Handel mit der japanischen Bevölkerung. Besonderen Einfluss übten die portugiesischen und spanischen Missionare aus. Ihre Missionstätigkeit war so erfolgreich, dass selbst viele japanische Fürsten konvertierten. Allerdings löste diese Entwicklung aber bald eine Christenverfolgung aus, die mehr als 200 Jahre andauerte. Michael Roll geht bei seinen Streifzügen dieser dramatischen Geschichte nach und entdeckt dabei noch Inseln, auf denen die Zeit offenbar stehen geblieben ist.  In Nagasaki trifft Michael Roll einen Überlebenden des Atombombenabwurfs 1945 und lässt sich dessen Erlebnisse schildern.      DE 2019
- eventId: 1600924
  start: 2026-10-11T20:25:00Z
  stop: 2026-10-11T20:52:00Z
  title: Foodwise - Changsha
  subtitle: Foodwise - Changsha
  description: In dieser Folge begeben sich unsere Moderatoren Tianran He und Eva May auf eine Reise nach Changsha in der Provinz Hunan. Sie probieren sich durch die lokale Küche, entdecken die neuesten Kunst- und Modetrends der Stadt und finden heraus, warum sie immer wieder Touristen anzieht. CN 2022
- eventId: 1600934
  start: 2026-10-11T21:00:00Z
  stop: 2026-10-11T21:27:00Z
  title: Foodwise - Qingdao
  subtitle: Foodwise - Qingdao
  description: In dieser Folge reisen Tianran He und Eva May nach Qingdao, Chinas Biermekka am Meer. Mit roten Ziegeln und grünen Bäumen, die die atemberaubende Landschaft der Stadt prägen, begeben sich unsere Gastgeber auf eine weitere kulinarische Reise mit lokalen Köstlichkeiten und besonderen Gästen. CN 2022
- eventId: 1600935
  start: 2026-10-11T21:30:00Z
  stop: 2026-10-11T21:50:00Z
