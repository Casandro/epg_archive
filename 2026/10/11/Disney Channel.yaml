  description: 'Regie: Dan Scanlon. Darsteller: Billy Crystal, John Goodman, Steve Buscemi. Aller Anfang ist schwer... Und das gilt auch für Monster wie Sulley und Mike. Denn als die beiden sich an der Monster Universität kennenlernen, können sie sich auf den Tod nicht ausstehen. Kein Wunder, schließlich haben beide dasselbe Ziel: Sie wollen die größten Erschrecker von ganz Monstropolis werden. Die Monster Uni zeigt, wie sich die beiden unterschiedlichen Monster doch noch zusammenraufen und nicht nur das Dreamteam unter den Erschreckern, sondern auch die besten Freunde werden.'
