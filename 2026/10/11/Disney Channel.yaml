  title: Muppets Haunted Mansion
  subtitle: Familienfilm, USA 2021
  description: 'Regie: Kirk R. Thatcher. Darsteller: Will Arnett, Taraji P. Henson, Darren Criss. Der große Gonzo - weltberühmt und waghalsig- hat alles getan, alles gesehen und alles nur knapp überlebt. Aber in der Halloween-Nacht nimmt der furchtlose Gonzo die größte Herausforderung seines Lebens an, indem er die Nacht mit seinem Freund Pepé am gruseligsten Ort der Welt verbringt - der Haunted Mansion. Diese musikalische Komödie vereint Kermit und die gesamte Muppets-Gang, die in diesem schrecklich lustigen, mit Stars besetztem Muppets-Abenteuer die grimmig grinsenden Geister des Haunted Mansion darstellen.'
