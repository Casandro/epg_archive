  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Bakerix Animationsserie, F/COR/J/USA 2019
  description: Folge 55, Marinette sucht ihren Großvater Roland auf, der seit über 20 Jahren sein Haus nicht verlassen und sie demzufolge nie kennengelernt hat. Sie möchte ihn überreden, zum 40. Geburtstag seines Sohnes zu kommen, traut sich aber vor ihm nicht, sich als seine Enkeltochter zu erkennen zu geben. Da Roland sich von Marinette hintergangen fühlt, kann Hawk Moth ihn in Bakerix verwandeln. Mit seinen Superkräften will er alles zerstören, was in seinen Augen zu modern ist. Wird Ladybug sich trauen, sich ihrem eigenen Großvater in den Weg zu stellen?
  widescreen: true
