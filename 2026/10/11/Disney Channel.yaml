  description: Folge 58, Als Cat Noir beinahe herausfindet, dass sich hinter Ladybug eigentlich Marinette verbirgt, erzählt sie ihm, dass sie in ihn verliebt sei, um ihn abzulenken. Dummerweise bekommen das auch ihre Eltern mit und laden Cat Noir zum Essen ein. Cat Noir muss der Familie daraufhin gestehen, dass er nicht in Marinette verliebt ist. Tom fühlt mit seiner vermeintlich verschmähten Tochter und wird so wütend, dass er von Hawk Moth akumatisiert werden kann. Als Weredad steckt er Marinette in ein magisches Dornengefängnis, um sie vor der Welt zu beschützen. Wird Cat Noir es schaffen, Weredad umzustimmen?
