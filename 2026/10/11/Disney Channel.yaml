  title: Die Geistervilla
  subtitle: Gruselkomödie, USA 2003
  description: 'Regie: Rob Minkoff. Darsteller: Eddie Murphy, Jennifer Tilly, Terence Stamp. Als Immobilienmakler Jim Evers mit seiner Familie in einem mysteriösen alten Haus landet, bekommet er es mit einer ganzen Kompanie unheimlicher Bewohner zu tun. Doch Bangemachen gilt nicht: Gemeinsam mit der spirituell begabten Madame Leota und drei freundlichen Geistern müssen es die Evers mit verschwindenden Räumen, bewegten Gemälden, fürchterlichen Gespenstern und mehr aufnehmen. Ein im wahrsten Sinn des Wortes haarsträubend rasanter Wettlauf mit der Zeit beginnt - denn der Fluch, der auf dem Haus liegt, muss gebrochen werden, bevor die Uhr dreizehn schlägt...'
  widescreen: true
