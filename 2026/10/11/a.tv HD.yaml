  subtitle: Der Allgäuer Sporttalk mit dem Tischfußballclub Allgäu
  description: Tischkicker haben wohl die meisten Menschen schon irgendwann einmal gespielt. Doch mit dem was beim Tischfußballclub Allgäu passiert hat das nur entfernt etwas zu tun. Dort wurde kürzlich eines der größten internationalen Tischfußballturniere Süddeutschlands veranstaltet, samt Länderspiel der deutschen gegen die österreichische Nationalmannschaft. Bis aus den USA kamen die 250 Teilnehmer, um bei dem Event in Ottobeuren dabei zu sein. Für den Verein eine ganz besondere Veranstaltung, die einen Sport in den Fokus gerückt hat, der ansonsten eher etwas unter dem Radar fliegt. In der neuen Ausgabe des Allgäuer Sporttalks erzählt Turnierorganisator Jonas Möll über einen Sport, der von Taktik, Tempo und Detailverliebtheit geprägt ist.
