  description: Joe ist 13. Als seine Mutter verkündet, dass sie in Urlaub fahren, ist er total begeistert. Es gibt Stress in der Schule und zu Hause und eine Pause davon kann er dringend brauchen. Dummerweise haben seine Mutter und ihr mieser Freund Dean nicht vor, Joe mitzunehmen. Sie fliegen ohne ihn nach Spanien und Joe bleibt allein in der Wohnung. Er spielt Videospiele die ganze Nacht und lernt Asha kennen, die ihren Großvater nebenan besucht. Aber als die Woche um ist, kommen seine Mutter und Dean einfach nicht wieder. Zum Glück weiß Asha einen Ausweg - sie entscheidet, dass die beiden zu Joes Großmutter ans Meer fahren.
