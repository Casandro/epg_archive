  description: "New York 1962: Der berühmte Pianist Dr. Don Shirley plant eine nicht ungefährliche Konzertreise durch die US-Südstaaten. Als Afroamerikaner muss er sich nicht nur auf die dort vorherrschende Rassentrennung einstellen, sondern auch gegen unliebsame Überraschungen wappnen. Mit dem Nachtklub-Türsteher Tony \"Lip\" Vallelonga verpflichtet er nicht nur einen erfahrenen Chauffeur, sondern auch einen bewährten Mann fürs Grobe. \nWährend sein Fahrer nach den Konzerten in guten Hotels schläft, muss der weltgewandte Pianist oft in heruntergekommenen Unterkünften übernachten, die ein Reiseführer für Afroamerikaner empfiehlt: das \"Green Book\"."
