- eventId: 1626153
  start: 2026-10-11T21:05:00Z
  stop: 2026-10-11T21:30:00Z
  title: Host Radiožurnálu
  description: Odpovídá Michaela Čeřovská, ředitelka hospicové organizace Sdílení. Co mají společného pohodlné papuče a život v domově pro seniory? Papučový den má upozornit na důležitost důstojného a kvalitního stáří a také na to, že o blízkých, kteří potřebují péči, nemusíme rozhodovat jen za ně. Proč má smysl obout si 14.října papuče? A co může změnit způsob, jak o péči a stárnutí přemýšlíme? Hostem bude Michaela Čeřovská. Moderuje Patricie Strouhalová. (repríza)
