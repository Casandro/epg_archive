  title: Crni biseri s Vanjom Bulićem
  subtitle: Magazin
  description: Iza svakog čovjeka krije se priča koju ne znaju svi. Neke su teške, neke nevjerojatne, neke bolne, a neke toliko neobične da zvuče poput filmskog scenarija. U emisiji ,,Crni biseri sa Vanjom Bulićem, Vanja Bulić razgovara s ljudima čiji su životi obilježeni nesvakidašnjim iskustvima, velikim prekretnicama, padovima i usponima. To su ljudi koji su prošli kroz ono što bi mnogi teško mogli zamisliti i upravo zato imaju što reći. Bez maski, bez uljepšavanja i bez unaprijed pripremljenih odgovora, Vanja otvara teme o kojima se često šuti. Osobne ispovijesti, životne lekcije, neočekivani obrati i priče koje ostavljaju trag. Tko su ljudi koje nazivamo ,,crnim biserima?To su oni koji su, unatoč svemu, ostali svoji. Ljudi čije se priče možda nisu našle na naslovnicama, ali su vrijedne toga da budu ispričane. Crni biseri sa Vanjom Bulićem - teške životne priče, iskreni razgovori i ljudi koji imaju što reći.
