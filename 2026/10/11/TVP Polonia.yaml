  title: '"Św. Jan Paweł II - w górę serca" - koncert z okazji XXVI Dnia Papieskiego'
  description: |-
    Tytuł oryginalny: Św. Jan Paweł II - W górę serca - koncert z okazji XXVI Dnia Papieskiego
    PL, 2026
    Reżyseria: Grzegorz Sadurski
    Tegoroczny koncert z okazji XXVI Dnia Papieskiego będzie wyjątkową muzyczną i duchową podróżą śladami św. Jana Pawła II po miejscach szczególnie związanych z jego życiem, posługą i osobistą duchowością. W roku, którego hasło brzmi "Św. Jan Paweł II, uczeń - misjonarz.", nie chcemy opowiadać o Papieżu wyłącznie poprzez fakty i daty.
  genre:
  - '115'
  subtitle: Koncert z okazji XXVI Dnia Papieskiego będzie muzyczną opowieścią o św. Janie Pawle II, inspirowaną miejscami szczególnie związanymi z jego życiem, posługą i duchowością.
- eventId: 1459565
