    W swojej kolejnej podróży Robert Makłowicz zawitał do północnych Włoch. W symbolicznym początku i końcu Morza Śródziemnego Robert Makłowicz odnajduje liczne ślady Austro - Węgier, swojej ulubionej epoki i jej kuchni, łączącej w sobie tradycje wielu krajów i ludów. Kosmopolityczny Triest, przez wieki wolny port, urzeka swoimi kawiarniami i wiedeńską architekturą. W miasteczku Muggia po drugiej stronie zatoki podróżnik z Krakowa odkrywa ittiturismo agroturystykę w wydaniu rybnym, wręcz rybackim!
  genre:
