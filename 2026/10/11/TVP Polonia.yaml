    Święty Jan Paweł II to człowiek przeprowadzający Kościół w nowe milenium. W czasach, kiedy potrzeba było kogoś autentycznego. Prawdziwego. Papież, który na oczach milionów ludzi zmieniał losy świata. Jaki ślad po 20 latach od śmierci Ojca Świętego zostawił jego pontyfikat? Czy dziś kolejne pokolenia inspirują się nauczaniem wielkiego Polaka?
  genre:
