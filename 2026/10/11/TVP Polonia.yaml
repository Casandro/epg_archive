    PL, 2026
    W niedzielę poprzedzającą wybór Karola Wojtyły na Stolicę Piotrową w całej Polsce i środowiskach polonijnych obchodzony jest Dzień Papieski, podczas którego łączymy się w modlitwie z obecnym papieżem oraz zagłębiamy się w nauczanie św. Jana Pawła II. Hasło tegorocznego Dnia Papieskiego, do którego w swoim orędziu odniesie się Kard. Grzegorz Ryś, brzmi: ŚW. JAN PAWEŁ II. UCZEŃ - MISJONARZ.
  genre:
  - '115'
  subtitle: Orędzie kard. Grzegorza Rysia z okazji rocznicy wyboru Karola Wojtyły na papieża. Wspólna modlitwa z obecnym papieżem i zagłębienie się w nauki Jana Pawła II.
