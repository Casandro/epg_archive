    Ludwik z Markiem robią bilans sukcesów i porażek. Niezapowiedziana wizyta Soni podczas nieobecności Kuby, wprawia Tomka w zakłopotanie. Natalia i Ludwik obawiają się, że w wyniku ich błędów wychowawczych synowie są niesamodzielni. Majka zaprasza wszystkich na domowej roboty ciasto. Kuba czuje się przygnębiony i lekceważony. Filip stara się podnieść przyjaciela na duchu.
