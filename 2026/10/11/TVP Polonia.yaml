  title: Nad rozlewiskiem... - odc. 4/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Drozda, Antoni Królikowski, Maciej Wierzbicki, Joanna Fertacz, Irena Telesz, Joanna Brodzik
    Małgosia jest już w domu po wyjściu że szpitala. W czasie pracy w ogrodzie dostaje krwotoku z nosa. Basia i Tomasz chcą z tego powodu odwołać podróż do Peru, jednak Małgosia nalega na ich wyjazd, utrzymując że nic jej nie jest. Również Konrad i Marysia są zaniepokojeni stanem Gosi. Konrad próbuje przełożyć termin oddania projektu, jednak jego szef się nie zgadza.
  ageRating: 12
  genre:
  - '23'
  subtitle: Kuba spotyka dawnego kolegę. On opowiada historię dziewczyny z Warszawy, która zdradzała męża. Kuba ustala, kto jest kochankiem żony. Pijany wpada do leśniczówki. Dochodzi do strzelaniny.
- eventId: 1459444
  start: 2026-10-11T01:05:00Z
  stop: 2026-10-11T01:55:00Z
  title: Nad rozlewiskiem... - odc. 5/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Joanna Drozda, Antoni Królikowski, Olga Frycz, Piotr Grabowski, Małgorzata Braunek
    Róża i ksiądz Karol postanawiają powierzyć wyrzeźbiene Drogi Krzyżowej Wrońskiemu. Kuba i Marysia nie potrafią się porozumieć, Kuba chce wyjaśnić sprawę, Marysia nie chce rozmawiać z nikim na ten temat. Konrad dostał propozycję wejścia do zarządu w swojej firmie. Orest przeżywa kryzys twórczy na wieść o tym, że Wroński ma rzeźbić Drogę Krzyżową. Wroński odnosi wielki sukces w Paryżu, ale pieniędzy z tego nie ma. Ordon wpada ma nowy pomysł biznesu, krasnale ogrodowe.
  ageRating: 12
  genre:
  - '23'
  subtitle: Konrad dostaje propozycję wejścia w skład zarządu firmy. Marysia odwiedza adwokata, aby zapytać o możliwości rozwodu. Podczas przygotowywania obiadu Małgosia słabnie. Konrad decyduje się rzucić pracę.
- eventId: 1459445
  start: 2026-10-11T01:55:00Z
  stop: 2026-10-11T02:55:00Z
  title: Alternatywy 4 - odc. 5/9 - Dwudziesty stopień zasilania
  description: |-
    Tytuł oryginalny: Alternatywy 4
    PL, 1983
    Reżyseria: Stanisław Bareja
    Występują: Zofia Czerwińska, Bożena Dykiel, Kazimierz Kaczor, Wojciech Pokora, Mieczysław Voit, Roman Wilhelmi
    Przychodzi zima. W bloku wyłączają ogrzewanie, ciepłą wodę, często i światło. Towarzysz Winnicki namawia lokatorów, by trzymać się solidarnie, razem, po czym przenosi się do willi byłej żony. Pozostali mieszkańcy nie załamują rąk. Manc znajduje na wysypisku starą lokomotywę kolejki wąskotorowej, Kotek dźwigiem przenosi ją pod blok. W kolejce pali się węglem, a rura doprowadza ciepło do węzła w piwnicy. Do bloku wprowadza się nowy lokator, Murzyn, który wynajmuje mieszkanie od inżyniera.
  ageRating: 12
  genre:
  - '20'
  subtitle: Przychodzi zima. W bloku zostają wyłączone ogrzewanie, ciepła woda, światło. W niedogrzanych mieszkaniach lokatorzy próbują radzić sobie sami. Narasta bunt przeciw terrorowi dozorcy domu.
