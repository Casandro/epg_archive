  title: Komisarz Alex s.XXIV - odc. 298 (seria XXIV odc. 4) "Bez winy"
  description: |-
    Tytuł oryginalny: Komisarz Alex
    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Janusz Chabior, Adrian Brząkała, Dariusz Kowalski, Filip Leszega, Marcin Rogacewicz, Olaf Lubaszenko
    Policja znajduje ciało profesora historii, który zdaniem przybyłego na miejsce prokuratora zmarł w sposób naturalny. Dzięki wytrwałości w dążeniu do poznania prawdy komisarz Alex i jego współpracownicy krok po kroku odkrywają, że profesor Maciej Biały został zamordowany, a jego morderca jest leworęczny. Wybitny talent Alexa w tropieniu ułatwia poznanie zabójcy i to mimo tego, że poza normalnymi obowiązkami, komisarz wspiera młodych mieszkańców Warszawy w odnajdywaniu zagubionych przedmiotów.
  ageRating: 12
  genre:
  - '18'
  subtitle: Mimo orzeczenia prokuratora o naturalnej śmierci profesora historii komisarz Alex i jego zespół podejmują śledztwo. Krok po kroku odkrywają, że mężczyzna padł ofiarą zabójstwa.
