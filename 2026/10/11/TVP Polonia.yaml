  title: Uwaga - Premiera! - Dom pod Dwoma Orłami. Kłamstwa Zofii
  description: |-
    Tytuł oryginalny: Dom pod Dwoma Orłami. Kłamstwa Zofii
    PL, 2023
    Reżyseria: Waldemar Krzystek
    Występują: Karolina Gruszka, Andrzej Konopka, Mirosław Baka, Małgorzata Zajączkowska, Adam Ferency, Grzegorz Małecki
    Rok 1945. Do dawnego Breslau, obecnie Wrocławia, przybywa repatriantka ze Wschodu Zofia Szablewska. Zamieszkuje w poniemieckiej willi - Domu pod Dwoma Orłami. Współlokatorem Zofii jest Jan Liski, oficer Urzędu Bezpieczeństwa, który samotnie wychowuje pasierba, Kazia. Zofia przez Czerwony Krzyż poszukuje swego męża Antoniego oraz syna Zbyszka, z którymi straciła kontakt podczas wojny.
  ageRating: 16
  genre:
  - '23'
  subtitle: Rok 1945. Do Wrocławia, dawniej Breslau, przybywa repatriantka ze Wschodu, Zofia. Kobieta zamieszkuje w poniemieckiej willi. Pamiątkowy zegar przywołuje wspomnienia rodzinnych Kresów.
