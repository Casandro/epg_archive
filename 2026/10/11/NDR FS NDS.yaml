  description: 'Norwegen unterhält entlang der langen Küste ein sehr dichtes System aus Leuchttürmen und anderen Navigationszeichen. Tausende Kilometer Küste, Schären, Fjorde und vorgelagerte Inseln. Die Seefahrt war dort auf rauer See immer ein Abenteuer. Mehr als 150 Leuchttürme sind an der Küste verteilt: einst unverzichtbare Wegweiser für die Seefahrt, jetzt vielfach automatisiert, verlassen und unbemannt. Aber auch seit Jahrzehnten touristische Magneten und Sehnsuchtssorte, die Salzwasser, Sturm und Regen trotzen: stille Wächter in Sturm, Gischt und Dunkelheit.'
