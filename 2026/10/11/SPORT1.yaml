  title: Die PS Profis - Im Einsatz Berlingo á la Carte
  subtitle: Die PS Profis - Im Einsatz Berlingo á la Carte
  description: Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann. Im heutigen Fall überraschen Sidney und seine Crew Brigitte. Auch ihr Citroen Berlingo sieht stinklangweilig aus. Ein Kastenwagen, den eigentlich keiner fahren will. Doch Brigitte hat kaum Geld, um sich über Wasser zu halten. Für den Wagen bleibt erst recht nichts übrig. Dennoch ist sie auf den Berlingo angewiesen. Mit ihm transportiert die Gartencenter-Mitarbeiterin regelmäßig Pflanzen. Ein Grund, warum Sidney seinen Augen nicht traut, als er den Innenraum erspäht. Er hat ja schon vieles gesehen, aber das? Auf seine Crew wartet ein Haufen Arbeit. Und erst recht auf Folierer Daniel. Er soll aus dem tristen Entlein einen Schwan zaubern. Aber geht Sidneys Rechnung diesmal wirklich auf?
  widescreen: true
