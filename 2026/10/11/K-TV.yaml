  description: |-
    Pfarrer Tobias Brantl, geistlicher Berater des Vereins "Freunde von Carlo Acutis"
    Moderation: Volker Niggewöhner, 538b


    Zum 20. Todestag des heiligen Carlo Acutis im Oktober 2026 greift der Beitrag dessen Verbindung von Glauben und digitaler Welt auf, die weit über kirchliche Grenzen hinaus Menschen berührt. Im Gespräch mit Volker Niggewöhner erläutert Pfarrer Tobias Brantl, warum der junge Italiener als Hoffnungsträger in Krisenzeiten und Vorbild für die Jugend gilt. Ein Einblick in das Leben eines Heiligen, dessen Wirken das Wort von Papst Benedikt XVI., "Die Kirche lebt - und sie ist jung", verkörpert.
