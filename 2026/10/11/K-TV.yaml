  title: 'grenzenlos: Das Hexendorf'
  subtitle: Das Hexendorf / Dokumentation
  description: 'Was für uns wie Geschichten aus finsteren vergangenen Zeiten anmutet, ist in Teilen Afrikas bis heute Realität: unvermittelt sehen sich Frauen als Hexen beschuldigt. Häufig verlieren diese Frauen alles und können froh sein, wenn sie ihr Leben retten können. Im Gushiegu-Hexendorf in Ghana finden Frauen Zuflucht, die als Hexen angeklagt wurden. Mitten im Buschland, haben zurzeit 70 von ihnen ein neues Zuhause. Es gibt keine Straßen, keinen Strom, kaum Trinkwasser. Nur Staub, Lehmhütten und sengende Hitze. Pater Phanuel Myers Agudu setzt sich für die Frauen ein und versucht die Position der Frauen in der Gesellschaft zu stärken.'
