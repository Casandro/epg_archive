  title: Die besten Köche der Welt - Zu Gast im Ikarus - Angel Leon
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Angel Leon
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im andalusischen El Puerto de Santa Maria hat sich einer der spannendsten Köche Spaniens niedergelassen. In einer 200 Jahre alten Gezeitenmühle führt Angel Leon sein mit drei Sternen gekröntes Restaurant Aponiente. Der Chef del Mar, wie der Koch hier genannt wird, ist komplett auf Fisch und Meeresfrüchte spezialisiert. Fleisch sucht man auf seiner Karte vergeblich, dafür findet sich Verblüffendes wie Wurst und Speck aus Fisch oder purer Plankton, den der Gast vom eigenen Handrücken leckt. Plankton, das ist der pure Geschmack des Meeres ist Leon überzeugt. Für Martin Klein wird es kein Leichtes sein, diese maritime Kulinarik in den Salzburger Hangar-7 zu übertragen. Er erforscht deshalb sehr genau die Quellen des Geschmacks dieser einzigartigen Meeresküche: in den schneeweißen Salzfelder von Andalusien, bei den alteingesessenen Fischern in der Bucht von Cadiz und selbst im Gezeiten-Schwemmland rund ums Aponiente. AT 2020'
