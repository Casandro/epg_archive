- eventId: 1626373
  start: 2026-10-11T10:00:30Z
  stop: 2026-10-11T11:00:00Z
  title: Velká pohádka
  description: 'Chytrá princezna. V královském zámku se mísí radost a štěstí s obavami. Jiřík totiž kdysi upsal svou duši peklu a teď mu zbývají poslední tři dny a tři úkoly, kterými se může vykoupit. Naštěstí má chytrou ženu, která dokáže přelstít i čerta. Na motivy pohádky Boženy Němcové napsal: František Pavlíček. Režie: Karel Weinlich. Hrají: Sylva Sequensová, David Schneider, Luděk Munzar, Jana Hlaváčová a Josef Vinklář.'
- eventId: 1626375
  start: 2026-10-11T11:00:30Z
  stop: 2026-10-11T12:00:30Z
  title: Velká pohádka
  description: 'Kouzelná známka. Humorné dobrodružství o vzácných poštovních známkách a vzácných lidech z království Nová Filatelie. Zájem krále Nové Filatelie je zaměřený jen na sbírání poštovních známek a panovnické povinnosti řeší ti, kteří moc dobře vědí, jak je využít ve svůj prospěch. V království proto například vlaky jezdí pozpátku a navíc jen tehdy, když je dobré počasí. Podle pohádky Jany Kašové pro rozhlas napsala: Šárka Kosková. Režie: Lukáš Hlavica. Účinkují: Jaroslav Plesl, Taťjana Medvecká, Andrea Elsnerová a další.'
- eventId: 1626493
  start: 2026-10-11T12:00:30Z
  stop: 2026-10-11T13:00:00Z
  title: Rozhlasová hra
  description: 'Pod slupkou. Třináctiletý Jakub není nadšený cyklista, ani moc nechodí ven s kamarády. Kromě počítače ho baví šachy. Mistrem v šachu byl svého času taky Pavel, muž, který už několik let trpí Parkinsonovou chorobou. Hra, u níž je potřeba umět přemýšlet, soustředit se a taktizovat, svede oba dohromady. Skrze šachy vyjeví jeden druhému svá trápení a vzájemně se dokáží podpořit, třebaže to není jednoduché. Napsala: Iva Tajovská. Režie: Dimitrij Dudík. Účinkují: Antonín Kracík, Miroslav Táborský, Martin Zahálka, Martina Hudečková a další.'
- eventId: 1626494
  start: 2026-10-11T13:00:00Z
  stop: 2026-10-11T13:30:00Z
  title: Ušounova pohádková školka
