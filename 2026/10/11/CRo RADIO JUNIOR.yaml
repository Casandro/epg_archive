  title: Pohádkové poklady
  description: 'Loupežnická pohádka. O loupežníku Lotrandovi, který chtěl mít ze svého syna Lojzíka vzdělaného pána, a tak mu dopřeje prvotřídního studia za zdmi kláštera. Když starý Lotrando umírá, nechá si syna zavolat, aby po jeho smrti převzal jeho řemeslo. Jak se zdvořilému a milému Lojzíkovi v nové roli povede? Klasický příběh Karla Čapka plný laskavosti i humoru. Napsal: Karel Čapek, režie:Josef Svátek. Natočeno v roce 1967. Vypráví: Eduard Kohout.'
- eventId:
  - 1626652
  - 1632104
  - 622771
  - 643239
  start: 2026-10-11T17:24:00Z
  stop: 2026-10-11T17:50:00Z
  title: Pohádkové poklady
  description: 'O žabce královně. Tři princové dostanou od otce nařízení najít si nevěstu. Dle krále mají vystřelit z luku, a kam se jim zapíchne jejich šíp, tam si najít manželku. Třetímu bratrovi vletí šíp do bahna, kde objeví žabku, která je však zakletá princezna. Podaří se princi zlomit kletbu a osvobodit svou vyvolenou? Klasická pohádka Karla Jaromíra Erbena o tom, že pravá krása se neskrývá na povrchu, ale uvnitř. Napsal: Karel Jaromír Erben, režie: Vladimír Kovářík. Natočeno v roce 1952. Vypráví: Růžena Nasková.'
- eventId:
