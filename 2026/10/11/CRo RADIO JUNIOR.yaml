  title: Rozhlasová hra
  description: 'Hostina Barona Prášila. Zveme vás na poněkud netradiční hostinu. Pořádá ji neúnavný mluvka a fantasta baron Prášil a hlavním menu jsou jeho hrdinské historky a zábavná hra s fantazií. Společnost bude vybraná: Baron Prášil, hraběnka, dáma a další. Napsal: Michal Lázňovský. Režie: Aleš Vrzák. Účinkují: Ladislav Frej, Květa Fialová, Dana Černá, Jiří Lábus a další.'
