    In Merenptahs nur rund zehnjähriger Regierungszeit endet die friedliche Blütephase des ägyptischen Königreichs. Der neue Pharao muss Rebellionen im Norden und Süden des Reiches niederschlagen und eine Allianz aus Libyern und Seevölkern im Westen abwehren.
