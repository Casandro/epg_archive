  description: |-
    Frankreich 2024
    Die Maya zählen zu den faszinierendsten Kulturen der Menschheit. Doch ihre Ursprünge geben bis heute Rätsel auf: Wie alt sind die Maya wirklich? Ein Fund könnte nun Licht ins Dunkel bringen.

    Aguada Fénix ist das größte und älteste bisher bekannte Monument der frühen Maya. Die Riesenplattform wurde ab 1000 vor Christus, lange vor dem goldenen Zeitalter der Maya, gemeinschaftlich errichtet. Was sagt das Bauwerk über die Wurzeln der Maya aus?
