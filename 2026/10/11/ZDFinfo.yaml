    Ramses feiert zum 30-jährigen Regierungsjubiläum das Sed-Fest. Dabei vollzieht der über 50-jährige Pharao magische und sportliche Rituale, um sich zu verjüngen, seine Macht zu erneuern und dem Land seine geistige wie körperliche Leistungsfähigkeit zu beweisen.
