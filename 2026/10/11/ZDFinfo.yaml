  description: |-
    Frankreich 2026
    Nach dem unerwarteten Tod von Pharao Sethos I. im Jahr 1279 vor Christus folgt ihm sein Sohn Ramses II. auf den Thron. Was damals niemand ahnt: Er wird Ägypten für nahezu 67 Jahre regieren.

    Ramses der Große führt das Land in ein goldenes Zeitalter und wird zu einem der berühmtesten Pharaonen Ägyptens. Er lässt monumentale Bauwerke errichten, darunter den beeindruckenden Hathor-Tempel für seine Große königliche Gemahlin Nefertari in Abu Simbel.
