  title: Hra na neděli
  description: 'Josef Mareš: Vražda za bílého dne. Jak došlo k úmrtí seniorky v pražských Košířích? Poslechněte si detektivku inspirovanou skutečným případem. Dramaturgie Kateřina Rathouská. Režie Martina Schlegelová. Účinkují: Ondřej Vetchý, David Novotný, Miroslav Hanuš, Pavel Oubram, Pavla Beretová, Taťjana Medvecká, Daniela Kolářová, Tomáš Havlínek, Natália Drabiščáková, Milada Vyhnálková, Matěj Převrátil, Richard Fiala, Jakub Koudela, Jan Staněk, Marek Frňka, Prokop Košař a Barbora Kvapilová. Premiéra.'
