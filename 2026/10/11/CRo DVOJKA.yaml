  title: Výjimeční
  description: Patrik Kotas je nepřehlédnutelnou osobností české architektury a designu posledních třiceti let. Jeho rukopis mají pražské tramvaje, několik stanic metra, ale také dopravní terminály v dalších městech nebo řada mostů. Získal několikrát ocenění Stavba roku, současně však čelí kritice, že jeho díla jsou příliš robustní a předimenzovaná. Jak se s kritikou vyrovnává? A proč má v ateliéru mnoho zmenšených modelů staveb i vozidel? I to prozradí další díl cyklu Výjimeční. S Patrikem Kotasem natáčel Jan Herget.
