  title: Muzikál expres
  description: Muzikál expres pozve na premiéru muzikálu Biograf Láska 2 do pražského Divadla Kalich a na Malého prince do Hudebního divadla Karlín. Druhá část bude věnována oslavám 40. výročí světové londýnské premiéry muzikálu skladatele Andrewa Lloyda Webbera Fantom Opery. Na ten se mohou v příštím roce opět těšit i naši diváci. Více tedy v neděli 11. října v sedm večer nebo při repríze v pátek 16. října od 21. hodiny na vlnách na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
