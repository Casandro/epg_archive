  title: Historie českého zločinu
  description: 'Díl 14. Pád. K tomu, aby člověk zemřel násilnou smrtí, stačí někdy málo. Jen nepatrný pohyb. Pro pachatele, který je v afektu, může být taková vražda lákavá tím spíš, že vše může vypadat jako nešťastná náhoda. Autor: Tereza Vojtová. Repríza.'
- eventId: 1626169
  start: 2026-10-11T17:00:00Z
  stop: 2026-10-11T17:50:00Z
  title: Muzikál expres
  description: Muzikál expres pozve na premiéru muzikálu Biograf Láska 2 do pražského Divadla Kalich a na Malého prince do Hudebního divadla Karlín. Druhá část bude věnována oslavám 40. výročí světové londýnské premiéry muzikálu skladatele Andrewa Lloyda Webbera Fantom Opery. Na ten se mohou v příštím roce opět těšit i naši diváci. Více tedy v neděli 11. října v sedm večer nebo při repríze v pátek 16. října od 21. hodiny na vlnách na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
- eventId: 1626170
  start: 2026-10-11T17:50:00Z
  stop: 2026-10-11T18:00:00Z
  title: Hajaja
  description: O nejkrásnějším ostrově (7/7). O ostrově květin. Původní pohádkový seriál Dagmar Langové o malém klukovi Fumiovi, který chtěl dělat jen to, na co má náladu. Vypráví Luboš Veselý. Dramaturgie Zuzana Vojtíšková. Režie Petr Mančal. Natočeno v roce 2013 (9 minut). Repríza.
- eventId: 1626244
