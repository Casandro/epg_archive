  title: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  subtitle: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  description: 'Bergwelten: Alaska: - seit 1867 der 49. US-Bundesstaat - war schon immer ein Land für Abenteurer. Waren es früher Trapper, Pelztierjäger und Goldschürfer, sind es heute Bergsteiger und Extremskifahrer, die hier ihr Glück suchen.Sie sind auf der Suche nach steilen Flanken, unberührten Bergen und dem einzigartigen Pulverschnee, den es nur hier gibt. AT 2016'
- eventId: 1600827
