  title: Heimatleuchten - Glocken, Glück und Grauvieh - Ein Leben mit Kühen
  subtitle: Heimatleuchten - Glocken, Glück und Grauvieh - Ein Leben mit Kühen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2018'
- eventId: 1600797
  start: 2026-10-11T03:10:00Z
  stop: 2026-10-11T03:28:00Z
  title: Kanutour in den Femundsmarka Nationalpark
  subtitle: Kanutour in den Femundsmarka Nationalpark
  description: Ruhe, Natur, Abgeschiedenheit - all das und noch viel mehr fanden wir auf unserer 16-tägigen Kanutour im Femundsmarka-Nationalpark in Norwegen. Ohne Dusche, Klo oder sonstigen Luxus - dafür mit Zelt, Axt und Proviant ausgestattet, erlebten wir ein echtes Outdoor-Abenteuer. AU 2024
- eventId: 1600798
  start: 2026-10-11T03:30:00Z
  stop: 2026-10-11T03:44:00Z
  title: Ruhe nach dem Sturm
  subtitle: Ruhe nach dem Sturm
  description: 'Die Ausrichtung auf Konsum ist in unserer Gesellschaft zum neuen Standard geworden. Die Spitze dieses irrationalen Konsummonsters ist die Zeit vor Weihnachten. Die Zeit, in der wir unseren Geliebten mit dem Wert der Geschenke zeigen, wie gern wir sie doch haben. Das ist der Punkt, an dem das Freeride Abenteuer beginnt: Um auf Abstand mit dem Konsumtaumel zu kommen, starten die Freerider ihren Simple Life Roadtrip mit nichts Weiterem im Kopf, außer jeden Tag aufs Neue, den schönsten Skitag der Saison zu genießen. In diesem Time-Out vom Leben bekommt Zeit einen anderen Stellenwert, 9 Uhr ist jetzt einfach hell und 19Uhr einfach dunkel, nichts weiter.  DE 2019'
- eventId: 1600799
  start: 2026-10-11T03:45:00Z
