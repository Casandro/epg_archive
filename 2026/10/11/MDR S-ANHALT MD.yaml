  title: AM WOCHENENDE
  description: "Darin 12 Uhr \"Der Tag in Sachsen-Anhalt\"- alle Nachrichten und alle Themen die heute im Land wichtig sind.\nMit Berichten vom Sportgeschehen und Themen, über die man spricht, ist \"MDR Sachsen-Anhalt\" Ihr perfekter Begleiter durch den Sonntagnachmittag. Unsere Moderatoren sorgen für gute Laune und präsentieren Ihnen die Hits unseres Lebens. In den Nachrichten zur vollen Stunde halten wir Sie über alles Wichtige in Sachsen-Anhalt, Deutschland und der Welt auf dem Laufenden. Dann erhalten Sie auch Wetter- und Verkehrsinformationen.\n\nDarin 12 Uhr \"Der Tag in Sachsen-Anhalt\"- alle Nachrichten und alle Themen die heute im Land wichtig sind.\nMit Berichten vom Sportgeschehen und Themen, über die man spricht, ist \"MDR Sachsen-Anhalt\" Ihr perfekter Begleiter durch den Sonntagnachmittag. Unsere Moderatoren sorgen für gute Laune und präsentieren Ihnen die Hits unseres Lebens. In den Nachrichten zur vollen Stunde halten wir Sie über alles Wichtige in Sachsen-Anhalt, Deutschland und der Welt auf dem Laufenden. Dann erhalten Sie auch Wetter- und Verkehrsinformationen. \n\n\"Der Tag in Sachsen-Anhalt\": Unsere Nachrichtenredakteure und Reporter fassen für Sie die Ereignisse des Tages kompakt zusammen. Egal, ob in Sachsen-Anhalt, in Deutschland oder in der Welt etwas Wichtiges passiert ist, bei MDR Sachsen-Anhalt hören Sie es. In Interviews, Statements, Berichten und Reportagen erfahren Sie alles, was Sie wissen müssen. Die Redakteure erläutern Ihnen Zusammenhänge, Hintergründe und Entwicklungen. Außerdem bekommen Sie die neuesten Wetter- und Verkehrsinformationen."
