  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 1)'
  subtitle: Joachim Brisset zostaje otruty strychniną podczas pobytu w Sete, choć jego rodzina twierdzi, że powinien być na Kubie, gdzie znalazł pracę. Candice zastanawia, dlaczego ofiara okłamała bliskich.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Joachim Brisset, zostaje otruty strychniną podczas pobytu w Sete, choć jego rodzina twierdzi, że powinien być na Kubie, gdzie znalazł pracę. Candice zastanawia, dlaczego ofiara okłamała bliskich. Podczas dochodzenia policjantka trafia na wspólnotę, zamieszkującą stary budynek, w którym schronił się wcześniej Joachim. Jej członkowie prowadzą opierający się na wymianie tryb życia. Candice podejrzewa, że mogą oni skrywać jakąś mroczną tajemnicę.
  ageRating: 16
- eventId: 1491935
  start: 2026-10-11T19:15:00Z
  stop: 2026-10-11T20:35:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 2)'
  subtitle: Candice prowadzi śledztwo w sprawie zamordowania kobiety, która została dźgnięta nożem w swoim domu, prawodpodobnie w afekcie, przez byłego kochanka ofiary, Rodolpha Beckera.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Kobieta została zadźgana nożem w swoim domu. Morderstwo przypuszczalnie zostało popełnione w afekcie, przez byłego kochanka ofiary, Rodolpha Beckera, który właśnie opuścił więzienie, w którym siedział za zabójstwo żony. Chociaż sam podejrzany twierdził, że jest niewinny, wszystko przemawiało za tym, że był mordercą. Candice ma te same wątpliwości wobec oskarżonego.
  ageRating: 12
- eventId: 1491936
