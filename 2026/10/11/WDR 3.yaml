  title: WDR 3 Konzert
  description: "Passend zum diesjährigen Festivalmotto \"Märchen\" lieferte die sechsfach Grammy nominierte Lakecia Benjamin in Moers einen sagenhaften Auftritt. Als eine der spannendsten Entdeckungen der US-amerikanischen Jazz-Szene feierte die 20-jährige Skylar Tang mit ihrem Quartett dazu eine märchenhafte Europa Premiere. Der etwaige Soundtrack zu 1001 Nacht kam von Gordon Grdina's RU'YA feat. Ghalia Benali. \n<strong>Lakecia Benjamin </strong><br/>Lakecia Benjamin - Altsaxophon, Gesang <br/>Oscar Perez - Piano <br/>Elias Bailey - Bass <br/>Dorian Phelps - Schlagzeug \n<strong>Skylar Tang Quartet </strong><br/>Skylar Tang - Trompete <br/>William Schwartzman - Piano <br/>John Murray - Bass <br/>Ethan Oliver - Schlagzeug \n<strong>Gordon Grdina's RU'YA feat. Ghalia Benali </strong><br/>Gordon Grdina - Gitarre, Oud <br/>Ghalia Benali - Gesang <br/>Eylem Basaldi - Violine <br/>Elias Stemeseder - Piano, Synthesizer <br/>Hamin Honari - Perkussion <br/>Christian Lillinger - Schlagzeug \n<strong>Bonbon Flamme</strong> <br/>Valentin Ceccaldi - Violoncello<br/>Luis Lopes - Gitarre <br/>Fulco Ottervanger - Keyboards, Gesang <br/>Etienne Ziemniak - Schlagzeug \nMit Aufnahmen vom 23. und 25. Mai 2025 vom Kastellplatz Moers \nModeration: Antje Hollunder<br/>Redaktion: Jörg Heyd"
  subtitle: Märchenhaftes vom Moers Festival 2026
