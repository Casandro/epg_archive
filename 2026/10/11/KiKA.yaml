  audiodesc: true
  subtitle: Der Roblox-Check
  description: |-
    Der Roblox-Check

    Wer ist besser in Roblox: Team Timster oder Roblox-Star IsyCheesy? Genau das will Tim herausfinden und tritt gemeinsam mit den Hamburger SchülerInnen Emilia, Nils und Berke gegen die YouTuberin an. Drei Roblox-Games, drei Challenges. Doch beim Zocken fallen Tim immer wieder Dinge auf, bei denen er genauer hinschauen will. Warum werden Spieler dafür belohnt, möglichst lange in einem Game zu bleiben? Und was ist die Roblox-Währung "Robux" wirklich wert? Tim macht den Real-Life-Test und versucht, seine Robux auf einer Shopping-Tour in Erfurt auszugeben. Auch bei den Spielen selbst gibt es Überraschungen: Manche enthalten Gewalt oder gruselige Szenen und sind trotzdem für ziemlich junge Kinder zugänglich. Auf der Gamescom fragt Tim deshalb bei der USK nach, die für die Altersfreigabe von Computerspielen zuständig ist. Zwischen Gaming-Battle, Robux und Spielemesse zeigt Team Timster, was an Roblox richtig Spaß macht - und wo es sich lohnt, genauer hinzuschauen.
    Moderation: Tim Gailus, Soraya Jamal

