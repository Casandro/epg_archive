    Wasserrutschen sind die Sensation in Spaßbädern. Immer länger, steiler und verrückter werden die Anlagen. Der neueste Trend: Looping-Rutschen. Noch gibt es davon wenige.

    Eine ist gerade fertiggebaut, und Eric darf sie einweihen. Nach einem Jahr Bauzeit ist der große Moment gekommen. Die TÜV-Prüfer kontrollieren jede Fuge, jeden Millimeter.

    Dann ist es soweit: Unter Moderator Eric Mayers Füßen klappt die Falltür auf, er stürzt 14 Meter in die Tiefe, rast durch das Looping und schließlich ins Zielbecken. Was müssen Ingenieure beachten, wenn sie solche Extremrutschen erfinden?

    Rutschenbauer Mario Gabelica erklärt Eric, wie er Steilstücke und Kurven berechnet, damit einerseits jeder Spaß hat und sich andererseits niemand verletzt.

    Wie rutscht man am schnellsten? Das testen drei Kinder im "pur+"-Experiment. ...
