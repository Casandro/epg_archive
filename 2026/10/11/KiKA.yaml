    Suizidgedanken · Was tun, wenn ein Freund nicht mehr kann?

    Während ihrer Schulzeit kämpft Elisa mit Depressionen und Suizidgedanken. Heute geht es ihr besser - und sie nutzt ihre Erfahrungen, um an Schulen über psychische Krisen und Suizidprävention aufzuklären. Sie erzählt, warum es so schwer sein kann, sich anderen anzuvertrauen und was ihr damals geholfen hätte.

    POV-Host Kiara begleitet Elisa bei "POV - Deine Geschichte zählt" bei ihrer Präventionsarbeit und zu einer Podcast-Aufnahme. Gemeinsam mit einem Therapeuten sprechen sie darüber, was Freundinnen und Freunde tun können, wenn sich ihnen jemand mit Suizidgedanken anvertraut: Wie fragt man nach? Gibt es Warnsignale? Und wann ist professionelle Hilfe nötig?
