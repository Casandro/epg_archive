  title: Antikoteka
  subtitle: Antikoteka vodi slušaoce u svet rane muzike i prati delatnost umetnika specijalizovanih za ovu oblast koji sviraju na instrumentima iz epohe ili njihovim kopijama.
  description: Antikoteka vodi slušaoce u svet rane muzike i prati delatnost umetnika specijalizovanih za ovu oblast koji sviraju na instrumentima iz epohe ili njihovim kopijama. U potrazi za muzičkim antikvitetima, mnogi savremeni pripadnici pokreta za ranu muziku svoja umetnička putovanja u prošlost proširuju i na oblasti izvan Evrope i tragaju za zvučnim ostacima predsrednjovekovnog doba. Ove, šire granice čine okvir Antikoteke u čijoj je rubrici Antikoskop fokus usmeren na zanimljivosti, kuriozitete i novitete u svetu rane muzike.
