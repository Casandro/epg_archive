  title: Reportéri (24)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: 'KEĎ ZABÍJA DIEŤA: Miesto, kde by mali byť deti v bezpečí, sa opäť stalo dejiskom tragédie. Na základnej škole v Staškove útočil nožom len 13-ročný žiak. Pokojný začiatok vyučovania sa zmenil na boj o život. Náš štáb zisťoval priamo na mieste, ako k incidentu došlo a čo mu predchádzalo. Prípad z Kysúc opäť otvára vážne otázky. Kde sa berie agresia u mladistvých? Aká má byť ich trestná zodpovednosť a ako podobným útokom na školách zabrániť?XXXMILIÓNOVÉ OČAKÁVANIA: Dlhopisy, kryptomeny, zmluvy o tichom spoločenstve, medicínske aj nemedicínske projekty. Investície, ktoré sľubujú vysoké výnosy. Čo sa však za týmito ponukami skrýva a ako vyzerajú v praxi? Pozreli sme sa na fungovanie firmy, na ktorú nás upozornili nespokojní klienti. (2026)'
  genre:
  - '32'
