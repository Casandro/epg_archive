  title: Peniaze (19)
  subtitle: Všetko, čo potrebujete vedieť o (svojich) peniazoch.
  description: Devätnásta časť relácie Peniaze sa venuje investovaniu a tomu, ako dnes Slováci zhodnocujú svoje úspory. Pozrie sa na rastúci záujem mladých ľudí o investovanie, základné možnosti, ale aj riziká, ktoré treba pri rozhodovaní zohľadniť. Odborníci vysvetlia význam času, inflácie a investičného horizontu a relácia sa dotkne aj investovania do nehnuteľností či využitia nových technológií. Praktické skúsenosti a konkrétne príklady ponúknu divákom základnú orientáciu vo svete investovania. (2026)
