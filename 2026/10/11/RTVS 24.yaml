  title: Občan za dverami (25)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Spravodlivo rozpočítať náklady na prevádzku bytového domu medzi desiatky či stovky ľudí nie je vždy jednoduché. Napríklad aj preto, že mnohí vlastníci bytov nenahlasujú či zatajujú skutočný počet osôb, ktoré v byte bývajú. Náklady za čierne duše sa tak rozpočítajú medzi ostatných susedov, ktorí platia viac, ako by mali... Oklamaní ľudia zo Záhoria dostali do ruky iba bezcenný projekt. Aby mohli stavať, museli zaplatiť druhýkrát iným projektantom. Žeby bola spravodlivosť - na projektantku bez pečiatky - naozaj prikrátka?... Stalo sa to v jednej sekunde a ďaleko od domova. Pán Lukáš z Chorvátskeho Grobu zostal po dopravnej nehode v nemeckom Hamburgu bez auta, aj bez pomoci. Prišlo iba polročné ticho, narastajúce účty a obrovská neistota... (2026)
  genre:
  - '34'
