  title: Zeiglers wunderbare Welt des Fußballs
  description: Fußball ist die schönste Nebensache der Welt und ein Spiel dauert 90 Minuten? Falsch, ganz falsch. Nicht die schönste Nebensache, sondern die schönsten Nebensächlichkeiten sind es, woraus Arnd Zeigler Fußballträume strickt. Witzig, traurig, skurril und immer auch ein bisschen böse. Aber wer kann ihm das schon übel nehmen, wenn es am Ende was zu lachen gibt? Und irgendwie ist jeder mal dran. Die Guten ebenso wie die Bösen und die Bayern genauso wie die Bremer. Sympathie und Antipathie, schön gleichmäßig verteilt. Ob auf dem Platz oder hinter den Kulissen, passt auf, was ihr sagt liebe Fußballgötter, Zeigler findet alles.
