  description: Für den arbeitslosen Freizeit-Ornithologen Sam Birkner endet das Vögelbeobachten tödlich auf einer illegalen Müllentsorgung am Ufer des Bodensees. Die WaPo findet heraus, dass der Mann aus seinem Kanadier nicht nur Vögel, sondern auch Menschen beobachtet hat. Zum Beispiel die Richterin Marla Kohnen. Oder die renommierte Ornithologin Kati Hendricks. Sam Birkner unterstellte ihr Fehler in der Doktorarbeit und wollte das öffentlich machen. Schließlich fragen sich Jakob und Julia, warum ausgerechnet die resolute Frau Nökel ein gutes Verhältnis zu dem Toten gehabt haben will. Der Fall wird immer undurchsichtiger.
