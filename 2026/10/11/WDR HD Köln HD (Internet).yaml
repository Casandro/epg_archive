  title: Vier Hände für Mendelssohn
  subtitle: Lucas & Arthur Jussen mit Andris Nelsons
  description: Lucas und Arthur Jussen sind derzeit das erfolgreichste jüngere Klavierduo. Wenn die Brüder an den Tasten Platz nehmen, darf man sich auf vollendete Synchronität und blindes Verstehen freuen. Begleitet vom ehrwürdigen Gewandhausorchester unter der Leitung von Andris Nelsons wandeln sie mit Felix Mendelssohn Bartholdys erstem "Konzert für zwei Klaviere und Orchester" auf den Spuren des Komponisten und seiner Schwester Fanny. Dabei denken sie auch darüber nach, wie sich die Klassikwelt und geschwisterliche Beziehungen damals und heute unterscheiden.
