  title: WaPo Bodensee (42)
  subtitle: Hasardeure
  description: Nur mit knapper Not können Nele und Paul Helmut Pohl aus dem Wasser fischen. Er hat den Segler Lorenz Haller auf dessen Boot angegriffen. Haller konnte den Angriff abwehren. Pohl landet im Wasser und stürzt dabei so unglücklich, dass er im Krankenhaus ins Koma fällt. Der Verunglückte - das stellt sich bald heraus - ist der wahre Besitzer des Bootes. Haller hatte es im Internet gesehen und gutgläubig gekauft - von einem Betrüger. Julia und Jakob finden heraus, dass die Bezahlung auf das Konto der 19-jährigen Mila Simic lief. Doch diese Spur versandet. Denn Mila ist auch Opfer. Sie hatte sich in Jonas verliebt, der sie nur benutzte.
