  title: Dramski program
  subtitle: Grupa dečaka odlučuje da napusti školu zbog epidemije gripa, i da se, po ugledu na junake starih priča o kojima su slušali, okupe u šumi u hajdučku četu.
  description: 'Grupa dečaka odlučuje da napusti školu zbog epidemije gripa, i da se, po ugledu na junake starih priča o kojima su slušali, okupe u šumi u hajdučku četu. Dečaci su oduševljeni pozivom svog vođe Čede Brbe da na grobu nekog starog hajduka polože zakletvu. Svi su oni deca i nemaju realnu predstavu šta znači biti i živeti kao hajduk. Sa sobom u šumu donose hranu od kuće. Kada u prirodi počnu da se smrzavaju, ostanu bez hrane i počnu da se plaše svega što može da im se desi u šumi, daleko od kuće, odlučuju da se vrate. Nušić je napisao roman koji je posveta dečjoj mašti, želji za avanturom i idealizmu svojstvenom samo mladim godinama. Radio-adaptaciju Nušićevog romana uradila je Dušica Manojlović. U drami igraju: Milan Puzić, Stanko Buhanac, članovi Narodnog pozorišta u Beogradu i članovi dečje radio-grupe "Nikola Tesla" Reditelj verzije iz 1953. godine je Bratislav Bata Miladinović.'
