  description: 'Nach einer richtungsweisenden Begegnung mit einem Fischer im Norwegen-Urlaub, bei dem Moritz Klein zum ersten Mal einen selbst geräucherten Fisch auf offenem Feuer gegessen hat, beschließt er, sein Leben komplett umzukrempeln: Der leidenschaftliche Angler gibt seinen sicheren Job als Lehrer auf und macht sein Hobby zum Beruf. Unter dem Namen "Lachs und Moritz" eröffnet er in Frankfurt seine eigene, kleine Fischräucherei mit Abverkauf und beliefert zudem auch ortsansässige Gastronomiebetriebe.'
- eventId: 864618
