  title: Echt jetzt? Demokratie unter Druck
  subtitle: Auftakt zur Hamburger Woche der Pressefreiheit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Fakt oder Fake? Desinformationskampagnen, Deepfakes und KI-generierte Inhalte stellen Demokratien weltweit vor neue Herausforderungen. Welche Informationen stimmen, welche sind falsch? Echte und gefälschte Informationen sind auf den ersten Blick nicht mehr auseinanderzuhalten. \n\nZum Auftakt der 4. Hamburger Woche der Pressefreiheit diskutiert Ingo Zamperoni live mit Wikipedia-Gründer Jimmy Wales, Journalismus-Professorin Christina Elmer, Niedersachsens Innenministerin Daniela Behrens (SPD) und Journalistin Victoria Reichelt: Wie schützen wir uns - und unsere Demokratie - vor Desinformation?"
