  audiodesc: true
  description: 'Seit Jahrhunderten schon ziehen Menschen mit ihren Tieren übers Gebirge, auf gefährlichen Pfaden. Zwei junge Menschen aus Südtirol treten das Erbe der Vorfahren an: Ein Hirt, der mit 1.500 Schafen vom Schnalstal ins österreichische Ötztal geht und eine Sennerin, die mit ihren Rindern und ihrem sechs Monate alten Sohn den Sommer auf einer 1.800 Meter hoch gelegenen Alm verbringt, im salzburgischen Pinzgau. Einblicke in die archaische Welt der spektakulärsten Viehtriebe der Alpen.'
