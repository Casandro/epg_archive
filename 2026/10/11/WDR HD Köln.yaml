  title: Wunderschön! Brabant - unterwegs im Süden der Niederlande
  subtitle: mit Tamina Kallert
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Dichte Wälder, weite Dünenlandschaften und der Dschungel des Nationalparks De Biesbosch in Nord-Brabant überrascht mit unberührter Natur und sprühender Kreativität. Dank des dicht geknüpften und perfekt ausgeschilderten Radwegenetzes lässt sich die Region ideal auf zwei Rädern erkunden. Tamina Kallert radelt durch die beliebte Provinz im Süden der Niederlande, wo das Leben typisch "brabantisch" verläuft: gemütlich, entschleunigt, mit viel gutem Essen und ganz ohne Hektik. Neben idyllischen Orten entdeckt die Moderatorin zukunftsorientierte Designmetropolen wie Eindhoven und taucht ein in eine Region voller lebendiger Geschichte.'
