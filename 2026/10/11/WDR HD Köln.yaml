  title: 'Klavierfestival Ruhr 2025: Marc-André Hamelin'
  subtitle: Musik von Haydn bis Zappa
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Marc-André Hamelin zeigt in diesem Konzert, dass er sich als technischer Virtuose an jede Art von Klaviermusik herantraut.\n\nDer sympathische und stets ruhig wirkende Pianist glänzt mit einem Programm quer durch die Klaviergeschichte: von Haydn bis Rachmaninoff, von John Oswald bis Frank Zappa. \nAls Zugabe gibt er die \"Spieluhr\", eine Eigenkomposition des Künstlers aus Studienzeiten."
