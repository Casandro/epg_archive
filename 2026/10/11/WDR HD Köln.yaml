  genre:
  - '16'
  description: "Veit versucht, Karla näher zu kommen, wieder spielt er dabei seine Machtposition aus. Luise beobachtet die beiden und sieht sich darin bestätigt, dass Veit als Mann alles bekommen kann, was er will, während ihr - als Frau - nahezu sämtliche Türen verschlossen bleiben. \nAuf Veits Geburtstagsfeier mimt Luise zunächst die brave Schwester. Eigentlich jedoch will sie ihren Bruder vor den Gästen blamieren und somit dort packen, wo es ihn am meisten schmerzt, bei seiner Ehre. Doch Luise muss feststellen, dass es gar nicht so einfach ist, als Frau einen Mann bloßzustellen."
- eventId: 861095
  start: 2026-10-11T00:30:00Z
