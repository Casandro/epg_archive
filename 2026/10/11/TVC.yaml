  title: Winnetou i Old Surehand
  subtitle: W drodze do Mason City Old Surehand, który poszukuje mordercy brata, jest świadkiem napadu bandytów na pociąg. Nie udaje mu się przeszkodzić w rabunku wielkiego transportu złota.
  description: |-
    Tytuł oryginalny: Old Surehand
    DE,YU, 1965
    Reżyseria: Alfred Vohrer
    Występują: Stewart Granger, Pierre Brice, Larry Pennell, Letícia Román, Terence Hill, Wolfgang Lukschy
    "Winnetou i Old Surehand" to kolejna część przygód dzielnego wodza Winnetou. Old Surehand wyrusza do miasta Manson, aby znaleźć mordercę swojego brata. Jego wyprawa zostaje zakłócona śmiercią czerownoskórego Tu-Wana, syna wodza Maki-Mote, który padł ofiarą białych bandytów. Śmierć Indianina staje się natychmiast powodem walk. Za tym wszystkim stoi podstępny Generał, który próbuje przejąć ziemie Indian, na których ukryte jest złoto.
  ageRating: 12
  genre:
  - '18'
- eventId: 1491956
  start: 2026-10-11T09:20:00Z
  stop: 2026-10-11T11:25:00Z
  title: 'Winnetou II: Ostatni renegaci'
  subtitle: Po śmierci ojca Winnetou zostaje wodzem Apaczów. Stara się, wraz z Old Shatterhandem, szerzyć przyjaźń między białymi i czerwonoskórymi. Pewnego dnia ratuje córkę Leśnego Niedźwiedzia.
  description: |-
    Tytuł oryginalny: Winnetou - 2. Teil
    DE,FR,IT,YU, 1964
    Reżyseria: Harald Reinl
    Występują: Lex Barker, Pierre Brice, Karin Dor, Klaus Kinski, Anthony Steel, Terence Hill
    Film "Winnetou II: ostatni renegaci" to kontynuacja przygód Winnetou. Śmierć ojca stała się punktem zwrotnym w jego życiu. Młody wódz uznał, że jego zadaniem jest zapobiec nieszczęściu, które mogłoby oznaczać zagładę wszystkich Indian. Pewnego dnia, Winnetou ratuje córkę Leśnego Niedźwiedzia. Młodzi zakochują się w sobie. Przyjaciel Winnetou, Old Shatterhand dowiaduje się od porucznika, że bandyci razem z Forresterem, napadli na plemię Ponków.
  ageRating: 12
  genre:
  - '18'
