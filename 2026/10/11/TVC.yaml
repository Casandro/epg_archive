  title: 'Doc West: Triggerman'
  subtitle: Hazardzista trafia w sam środek potyczki z bandytami podczas turnieju pokera. Gdy przestępcy próbują oszustwem zapewnić sobie miejsce w finale, rewolwerowiec zrobi wszystko, by ochronić swoją wygraną.
  description: |-
    Tytuł oryginalny: Doc West: La sfida
    IT,US, 2009
    Reżyseria: Giulio Base
    Występują: Terence Hill, Paul Sorvino, Ornella Muti, Boots Southerland, Adam Taylor, Clare Carey
    Legendarny hazardzista wpada w środek krwawego starcia z bandytami podczas wielkiego turnieju pokera. Gdy przestępcy próbują oszustwem utorować sobie drogę do finału, rewolwerowiec nie cofnie się przed niczym, by ochronić swoją wygraną i krwawo wymierzyć sprawiedliwość. Obsada: Terence Hill, Clare Carey, Maria P. Petruolo
  ageRating: 12
  genre:
