  title: Złapać przemytnika 4 (odc. 2)
  subtitle: Funkcjonariusze CBP z San Diego znajdują wartą 14,5 tys. dolarów metamfetaminę.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    Funkcjonariusze CBP z San Diego znajdują wartą 14,5 tysiąca dolarów metamfetaminę, ukrytą w prostowniku, a następnie zatrzymują pojazd wypełniony narkotykami o wartości 589 tysięcy dolarów. Celnicy na nowojorskim lotnisku JFK przechwytują kolekcję starożytnych złotych paciorków, stanowiących część zrabowanego z Afganistanu skarbu. Agenci HSI w Miami przeprowadzają dostawę kontrolowaną wartej 37,5 tysiąca dolarów ketaminy, którą próbowano przeszmuglować w butelkach po szamponie.
  ageRating: 12
  genre:
