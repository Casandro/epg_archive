- eventId: 1010931
  start: 2026-10-11T13:05:00Z
  stop: 2026-10-11T15:00:00Z
  title: Bayern 2 Hörspiel
  subtitle: '"Blitzlichter" von Ilse Aichinger'
  description: "Blitzlichter, Filmbilder, Worte. Ilse Aichinger erzählt auf eigenwillige Art eine Autobiographie, die sich im Wesentlichen über Kinobesuche definiert. Bei Kriegsausbruch 1939 war Ilse Aichinger im Kino, bei Kriegsende übermittelte ihr eine Kinokassiererin eine Nachricht über deportierte Verwandte: Film und Verhängnis. Filme sind für sie mehr als nur Filme: So denkt sie anlässlich von Stan Laurel und Oliver Hardy über die Absurdität der Existenz nach - oder sie spürt der Bedeutung und Wichtigkeit dessen nach, was John Huston bei seiner Verfilmung von \"Der Malteser Falke\" weggelassen hat.\n\nVon Ilse Aichinger\nMit Martina Gedeck, Ilse Aichinger und Philipp Moog\nRegie: Ulrich Lampen \nBR 2002\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
