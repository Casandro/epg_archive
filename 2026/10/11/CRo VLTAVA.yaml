  title: Vizitka
  description: Kateřina Císařová, herečka. Poslední dny je možnost si buď na webu Vltavy nebo v aplikaci mujRozhlas poslechnout audioverzi knihy Deník Laury Palmerové od Jennifer Lynchové. Dílo, který posluchače vede pod povrch příběhu jedné z nejzáhadnějších postav kultovního seriálu Twin Peaks, pro vltavskou Četbu s hvězdičkou načetla Kateřina Císařová. "Laura Palmerová se mi promítla do podvědomí, její touha vypsat se mi přišla osvobozující," říká ve Vizitce členka souboru Divadla Na Zábradlí. Tam také uvádí své autorské monodrama Jolene, v němž se zabývá ženskou žárlivostí. Dotýká se v něm i sexuálního násilí a ve Vizitce mluví o narušování komfortní zóny a reakcích na obtěžování. V čem ji fascinuje tvorba rakouské performerky a režisérky Florentiny Holzinger? Jak se vyrovnává s náročnými rolemi a má své vlastní čistící mechanismy? A jak to má sama se žárlivostí? Zkraje září se Kateřiny Císařové ptal Ondřej Cihlář. Repríza ze 3. 9. 2026
