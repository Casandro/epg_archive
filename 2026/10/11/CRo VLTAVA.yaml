  description: Duch můj kráčel vždy cestou světla... Marcela Machotková zpívá Pucciniho Tosku a Cio-Cio San, Dvořákovu Rusalku, Smetanovu Anežku, Kalašovu Fraskitu a další partie. Česká sopranistka by v těchto dnech slavila půlkulaté jubileum. Přes dvacet let byla oporou ansámblu opery Národního divadla v Praze a svým uměním si podmanila také obecenstvo v Itálii, Rakousku, Nizozemsku, Velké Británii i jinde. Marcela Machotková promluví též z archivních záznamů. Připravil a uvádí Vojtěch Babka.
