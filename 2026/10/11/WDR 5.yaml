  title: MausLive
  subtitle: Leinen Los & Die falsche Vermieterin
  description: |-
    <strong>Leinen Los</strong>
    Jasina verbringt die Ferien in Hamburg und gerät dabei in eine gefährliche Lage. Sie reagiert schnell und verhindert damit eine große Katastrophe. Wer hat einen Grund dafür, einen so großen Schaden anzurichten? Auf ihr Detektiv-Team kann Jasina dieses Mal leider nicht zählen.
    <strong>Die falsche Vermieterin</strong>
    Endlich ist Leo's Mutter Kim wieder da und eine passende Wohnung ist auch schon gefunden. Aber irgendetwas stimmt nicht: warum ist Leo's Sparschwein geplündert? Und warum tut Kim so geheimnisvoll?
    Regie: Sebastian Stuertz und Sandra Thormählen<br/>Produktion: NDR <markup type="abbr" abbreviation="2025" correspondent="zweitausendfünfundzwanzig">2025</markup>
