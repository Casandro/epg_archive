  title: WDR 5 Hörspiel am Sonntag
  subtitle: Schön, oder?
  description: |-
    Ein altes Bauernhaus, eine kaputte Haustür, ein löchriges Dach - und mittendrin ein buntes Wohnprojekt: In "Schön, oder?!" ziehen die schwangere Farina, ihr bester Freund Jannik, ihre große Liebe Charli, das Paar Gitta und Onur sowie Party-Rentner Wolle gemeinsam aufs Land. Das Hörspiel erzählt komisch und berührend von modernen Familienmodellen, Freundschaft, Eifersucht und der Frage, wie viel Chaos eine Gemeinschaft aushält - bis aus einer Bruchbude ein Zuhause wird.
    Regie: Petra Feldhoff<br/>Produktion: WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
