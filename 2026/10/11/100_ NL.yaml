  title: Stephan Jacobs
  subtitle: Als je het over een échte muziekkenner hebt. kan dat alleen maar over Stephan Jacobs gaan! Stephan is al-tijd bezig met muziek en het ontdekken van bijzondere Nederlandse artiesten!
  description: '''''Mijn guilty pleasure? I Want It That Way van The Backstreet Boys!''''Als je het over een échte muziekkenner hebt. kan dat alleen maar over Stephan Jacobs gaan! Of het nu tijdens werktijd of in zijn vrije tijd is, Stephan is al-tijd bezig met muziek en het ontdekken van bijzondere Nederlandse artiesten!Alles over. Stephan!Wat wilde je vroeger worden?Archeoloog of Paleontoloog, omdat ik altijd een fascinatie heb gehad voor geschiedenis, verhalen en oude beschavingen. Ik was ook helemaal gek van Jurassic Park vroeger, dus dat hielp ook mee!Favoriete Nederlandstalig nummer allertijden?Dit vind ik een hele moeilijke vraag, dat wisselt namelijk per week. Er zijn zo ontzettend veel mooie liedjes gemaakt. Ik vind "Avond" van Boudewijn de groot prachtig, maar "zwerver Met een wekker" van Acda en De Munnik ook, André Hazes en "Kleine Jongen" vind ik ook fantastisch, om nog maar te zwijgen over "Jeroen" van Guus Meeuwis. Dus kies maar wat, of luister ze allemaal!Hoe ziet jouw ideale weekend eruit?Mijn ideale weekend is zo lui mogelijk zijn, langzaam wakker worden, broodjes afbakken, koffie zetten, muziek aan en uitgebreid ontbijten. Of lekker de hele dag op de bank hangen en series kijken of een spel spelen!Wat is jouw guilty pleasure? Op muzikaal vlak? I Want It That Way van The Backstreet Boys. Het is een heerlijke meezinger, jeugdsentiment.Wat weet Nederland nog niet van jou?Ik weet véél te veel van de serie Friends, heb er zelfs ooit een pubquiz over gewonnen met 1 fout over 75 vragen.Waar mogen wij jou voor wakker maken?Een goede biefstuk.Krijg je geen genoeg van Stephan?Stuur Stephan een berichtje via de 100% NL app of volg Stephan via Instagram, Twitter, of Facebook. (2026)'
