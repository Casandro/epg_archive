  title: Timo Kamst
  subtitle: Met een flinke dosis enthousiasme, humor en energie hoor je Timo op 100% NL! Natuurlijk met de allerbeste Nederlandse hits en verrassende verhalen. Met Timo aan de microfoon is het altijd gezellig!
  description: 'Wat mijn favoriete Nederlandstalige nummer is? Dat is vragen of je wilt kiezen tussen je kinderen! Naar zijn ouders wilde hij nooit luisteren, maar naar de radio wel! En met dat laatste is hij nooit meer gestopt. Zet Timo in de studio van 100% NL en het is één en al energie! Hij presenteert vol vuur De Beste Muziek Van Nederland en verteld de mooiste verhalen die er in deze wereld te vinden zijn.Alles over. Timo!Wat wilde je vroeger worden?Erik de Zwart! Hem vond ik écht de allerbeste radio-dj. Wat is jouw favoriete Nederlandstalige nummer áller tijden?Dat is vragen of je wilt kiezen tussen je kinderen. Maar "Over de Muur" van Klein Orkest komt wel dicht in de buurt, of natuurlijk "De Echte Vent" van Racoon.Wat is jouw ultieme guilty pleasure?Muzikaal gezien: Boybands als "New Kids On The Block" en ''''n Sync''. Wat zat dat geweldig in elkaar! Algemeen: Oude radioprogramma''s terugluisteren. Niemand mag mij dan storen.Hoe ziet jouw ideale ochtend eruit?Zullen we de ochtend gewoon lekker overslaan? Waar mogen wij jou voor wakker maken?Om in te vallen bij 100%NL, dat is verslavend mooi om te doen.Wat weet Nederland nog niet van jou?Dat ik 6-7 dagen per week in de sportschool sta. Dat doe ik omdat het een passie is, niet om er interessant mee te doen op social media.Krijg je geen genoeg van Timo?Stuur een berichtje via de 100% NL app of volg Timo via Instagram of Facebook. (2026)'
