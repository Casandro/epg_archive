  title: In Concert - Konzerte großer Meister
  subtitle: Der Hamburger Knabenchor mit der Päpstlichen Musikkapelle "Sistina"
  description: "Das XXIV. Internationale Festival für sakrale Musik und Kunst steht im Zeichen der Begegnung: einer Begegnung zwischen Nord und Süd - vom Mittelalter bis zur Moderne -, zwischen unterschiedlichen Traditionen, Klangsprachen und geistigen Räumen. \n\nKomponisten treten über Jahrhunderte hinweg in einen Dialog: Vivaldi und Mozart begegnen Thomas Tallis, Mendelssohn trifft auf _riks Ešenvalds. Hildegard von Bingen steht im Dialog mit Palestrina, Palestrina mit Bach. Auch die Ausführenden verkörpern diesen Gedanken der Begegnung: Der Hamburger Knabenchor trifft auf die Kantoren der Päpstlichen Musikkapelle \"Sistina\". \n\nDer 500. Geburtstag Giovanni Pierluigi da Palestrinas bildet den zentralen Moment dieses internationalen Musikfestivals. Er wird zu einem Moment der Begegnung - zu einer Harmonie der Unterschiede, die zu innerer, kontemplativer Teilnahme einlädt: Einheit in der Vielfalt, im Klang erfahrbar."
  widescreen: true
