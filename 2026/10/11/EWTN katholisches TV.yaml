  title: Die kleinen Wunder von Lourdes - Eine besondere Krankenwallfahrt
  subtitle: Ankunft in Lourdes und 'Ankommen' und Entdecken
  description: 'Ankunft in Lourdes und Einzug in ein komfortables und helles Hospital. Dann erster Abmarsch zur feierlichen ersten Messe in Lourdes. Und Eisessen mit den Behinderten. Ein zweiter Tag in Lourdes: Das Krankenhaus wird vorgestellt und die Dienste der Pfleger. Und jetzt geht es das erste Mal in den Heiligen Bezirk. Zur Heiligen Messe unter freiem Himmel. Nach einem Fotoshooting vor der Rosenkranzbasilika wird dann gemeinsam ganz in der Nähe der Grotte mit Pfarrer Haas gemeinsam der Rosenkranz gebetet. Das heißt: Leiden verstehen lernen und den liebenden Blick auf die Kranken gewinnen.'
  widescreen: true
