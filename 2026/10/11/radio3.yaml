  stop: 2026-10-11T07:30:00Z
  title: Lebenswelten
  description: |-
    Krieg im Sudan
    Alltag im Leid
    Von Moritz Behrendt

    Seit April 2023 ist im Sudan Krieg. Die sudanesischen Streitkräfte und die RSF-Miliz liefern sich erbitterte Gefechte. Durch den Krieg im drittgrößten Land Afrikas wurden bereits zehntausende Menschen getötet, mehr als zwölf Millionen Menschen sind laut UNHCR auf der Flucht. Hilfsorganisationen beklagen schon lange, dass die verheerende Lage im Sudan immer weniger Beachtung findet. Doch ein Ende ist nicht in Sicht. Berichte über Massaker aus dem nordostafrikanischen Land sind inzwischen fast zur Normalität geworden. Leid und Tod gehören für fast alle Menschen im Land zum Alltag. Sie nutzen aber auch immer wieder Kampfpausen, um sich im täglichen Leben ihre Würde zu bewahren.
