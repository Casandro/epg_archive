  title: radio3 Konzert
  description: |-
    Opus Klassik Preisträgerkonzert

    Der Opus Klassik ist der wichtigste deutsche Preis für klassische Musik. Neben der großen Gala im Konzerthaus findet in der Fotografiska ein intimes Konzert statt, bei dem Preisträgerinnen und Preisträger ihr außerordentliches Können präsentieren. Hier geht es um solistische und kammermusikalische Exzellenz in kleinem, aber festlichen Rahmen.
- eventId: 1018883
  start: 2026-10-11T21:00:00Z
  stop: 2026-10-11T22:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Jonathan Jeremiah

    Der britische Singer-Songwriter mit der seidenen Bariton-Stimme hat einen Hang zu pompösen orchestralen Backgrounds und cineastischem Klang. Er hat für seine Alben und Touren schon mit so renommierten Orchestern wie dem Metropole Orkest, dem Heritage Orchestra und der Amsterdam Sinfonietta zusammengearbeitet. Sein akustisches Folk-Storytelling orientiert sich an Scott Walker und Serge Gainsbourg, während sein Motown-verliebter Klang-Mix auch Soul-, Pop- und R&B-Elemente enthält. Damit ist er unter anderem schon beim legendären North Sea Jazz Festival aufgetreten.

    Moderation: Ortrun Schütz
