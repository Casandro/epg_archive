  description: 'Jesus rief am Kreuz: "Mein Gott, warum hast du mich verlassen?" Er zitierte nicht einfach Psalm 22, sondern nahm tatsächlich unsere Gottverlassenheit auf sich. Weil er von Gott verlassen wurde, werden wir nie von Gott verlassen sein. Das zu wissen ist wichtig, denn wir werden uns immer mal wieder verlassen vorkommen. Paulus ging das so, und David und Joseph auch. Doch sie alle erlebten den Einbruch des Übernatürlichen in ihr Leben als Gott ihnen schließlich entgegenkam. Das gleiche gilt für dich.'
