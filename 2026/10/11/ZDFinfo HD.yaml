    Forscherinnen und Forscher erkunden die spannende Geschichte dieser geheimnisvollen Zivilisation im mexikanischen Dschungel. Beeindruckende Lichtschauspiele am El Castillo, Sternenbeobachtungen am Caracol und grausam endende Ballspiele auf dem Juego de Pelota.
