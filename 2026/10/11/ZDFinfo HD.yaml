    Die Inka nutzen die Ressourcen ihres Reiches umfassend. Natürliche Vorkommen wie Gold und Silber, aber auch die Fähigkeiten der von ihnen eroberten Völker. Die Herausforderungen ihres Territoriums für die Landwirtschaft meistern sie mit innovativen Techniken.
