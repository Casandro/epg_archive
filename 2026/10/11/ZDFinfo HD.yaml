    Teotihuacán ist eine der bedeutendsten Ruinenstätten Amerikas, gelegen im mexikanischen Hochland. Als die Azteken sie im 14. Jahrhundert entdeckten, war die Stadt schon lange verlassen.

    Doch wer hat sie einst erbaut? Forschende erkunden die weltberühmte Sonnenpyramide und den mysteriösen Tempel der Gefiederten Schlange. Lange war kaum etwas über ihre Erbauer bekannt, doch neue Ausgrabungen könnten dieses Rätsel jetzt lösen.
