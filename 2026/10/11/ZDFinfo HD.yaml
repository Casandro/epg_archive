    Als Ramses I. stirbt, wird Sethos I. sein Nachfolger. Gelingt es dem neuen Pharao, die Herrschaft auf ein stabiles Fundament zu stellen und seinem Sohn den Weg zur Macht zu ebnen?

    Als Sethos I. den Thron besteigt, ist Ramses II. noch ein Kind. Sethos setzt alles daran, seine Herkunft abzuschütteln, seine Macht auszubauen und seinen Sohn, den künftigen Pharao, auf seine Aufgaben vorzubereiten.
