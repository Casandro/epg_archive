    Dafür erbauen sie ein beeindruckendes Straßennetz, das die großen Verwaltungszentren verbindet. Sie nutzen standardisierte Maßeinheiten, die auf dem menschlichen Körper basieren, und entwickeln eine Knotenschrift, um Nachrichten und Zahlen zu übermitteln.
