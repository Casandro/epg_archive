    Die Ursprünge des Inka-Reichs liegen um das Jahr 1200, als der erste Herrscher, Manco Cápac, die Hauptstadt Cusco gründet. Archäologische Untersuchungen versuchen, ihre Anfänge zu datieren.

    Die Inka entwickeln ein organisiertes Staatswesen. Sie erzielen technische und architektonische Meisterleistungen beim Bau ihrer Städte, wie dem legendären Machu Picchu. Ihre religiösen Vorstellungen folgen einem Sonnenkult, und sie bringen auch Menschenopfer dar.
