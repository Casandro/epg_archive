    Ramses der Große - legendärer Pharao. Er ist der Spross einer neuen Dynastie, die weder dem ehemaligen Königshaus noch dem Adel angehört. Sein Mythos überdauert bis heute.

    Als Tutanchamun im Jahr 1323 vor Christus stirbt, endet die 18. Dynastie mangels Thronfolger. Zwei hohe Würdenträger nehmen daraufhin die Geschicke des Landes in die Hand. Doch der erste stirbt kinderlos, und auch der zweite, Pharao Haremhab, hat keinen Erben.
    HD-Produktion
