    Im Dschungel Guatemalas erkunden Forschende die Maya-Stadt Tikal. Mit moderner Technologie rekonstruieren sie die antike Millionenstadt samt ihrer riesigen Tempelpyramiden.

    Tikal bildete jahrhundertelang ein Machtzentrum der Maya-Zivilisation. Durch Eroberungen und Allianzen mit anderen Völkern wuchs die Stadt auf über drei Millionen Einwohner an. Doch warum wurde sie abrupt verlassen? Und kann das Rätsel nun gelöst werden?
