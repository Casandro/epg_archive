  description: 'Henni kann es kaum fassen: Kanada ist wirklich so schön, wie es sich die Münchnerin erträumt hat! Ihr Ticket zur Welt ist erneut ein ermogelter Auftrag als Premium-Nanny. Der deutschstämmige Unternehmer Christopher hat sie als Betreuerin für seine Tochter Bristol engagiert, um in Ruhe seine zweite Hochzeit vorbereiten zu können, denn die 13-Jährige tut sich nicht nur mit ihrer künftigen Stiefmutter schwer. Henni ist rundum gefordert - doch mit ihrer Mischung aus Geradlinigkeit, Pragmatismus und Loyalität gewinnt sie Bristols Vertrauen und findet heraus, was in der wohlsituierten Familie fehlt: menschliche Nähe!'
