  title: Metropolis
  subtitle: De puntentellers S14 E17. Wedstrijden zijn er in alle soorten en maten. Maar wie bepaalt eigenlijk wie er wint? We duiken in de wereld van juryleden, van zeemeerminnen en maaiers tot car spinners.
  description: 'Wat is dat toch met mensen en wedstrijdjes? We lijken er geen genoeg van te krijgen. Maar waar wedstrijden zijn, zijn juryleden. En jureren is een serieuze zaak: waar let je op en waarom zou je het willen doen? We bezoeken opvallende wedstrijden over de hele wereld. In China ontmoeten we jurylid Alan Lam, bijgenaamd de Mermaid Godfather, die zich bezighoudt met de serieuze sport van mermaiding. In Servië let de jury bij een maaiwedstrijd op stijl en charme. In Estland bepaalt de jury wie de beste hansa brouwt, een loeisterke drank. En in Zuid-Afrika gaan we het asfalt op voor car spinning. Riemen vast! (2026)'
