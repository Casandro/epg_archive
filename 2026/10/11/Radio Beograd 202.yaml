  title: Ustanak
  subtitle: Ovog jutra slavimo naše učitelje, pričamo o hrabroj borbi za potomstvo i vodimo vas na inspirativna poetska, ali i prava svetska putovanja. Nedelja je dan stvoren za opuštanje i lepe priče.
  description: Ovog jutra slavimo naše učitelje, pričamo o hrabroj borbi za potomstvo i vodimo vas na inspirativna poetska, ali i prava svetska putovanja. Nedelja je dan stvoren za opuštanje i lepe priče. Nedavno smo obeležili Međunarodni dan učitelja, pa ovog jutra pričamo o njihovoj neprocenjivoj ulozi u odrastanju naše dece. Otkrivamo šta su najveći izazovi u obrazovanju danas i kako izgleda jedan radni dan novosadske učiteljice Tamare Ostojić Gregus, dobitnice prestižne nagrade Prosvetitelj. Iz Novog Sada idemo na jug, gde vas upoznajemo sa neverovatnom Marijom Lazarević iz Brestovca. Iako se bori sa teškom bolešću, ova hrabra žena ne prestaje da pomera granice svojim književnim stvaralaštvom, a njena nova zbirka pesama za odrasle "Reči na gram" već uveliko osvaja srca čitalaca i ruši sve barijere. Govorimo i o jednoj od najvažnijih životnih bitaka - borbi za potomstvo. Udruženje "Šansa za roditeljstvo" obeležava punu deceniju nesebične podrške svima koji prolaze kroz proces vantelesne...
