  description: S glavnim državnim odvjetnikom Ivanom Turudićem razgovaramo o tajmingu postupanja Državnog odvjetništva, odnosu DORH-a prema politici i politike prema DORH-u, aktualnim predmetima vezanim uz nezakonito odlaganje otpada, medijima i curenju informacija, postupanju vezanom uz sportske udruge i saveze te odnosu DORH-a i Ureda europskog javnog tužitelja - EPPO-a. Razgovaramo i o rezultatima prve dvije godine njegova mandata, o tome kako mjeriti učinkovitost i kvalitetu rada DORH-a, koje su najveće slabosti sustava, što bi trebalo mijenjati te o pogreškama i uspjesima mandata i o tome kakvo bi državno odvjetništvo Ivan Turudić želio ostaviti svome nasljedniku. Ivan Turudić rođen je 1962. godine. Osnovnu i srednju školu završio je u Virovitici. Diplomirao je na Pravnom fakultetu Sveučilišta u Zagrebu kod mentora Zvonimira Šeparovića na temu međunarodnog terorizma, a dvije godine poslije položio je pravosudni ispit. Vježbenički staž odradio je na Općinskom sudu u Virovitici, na kojem je 1991. postao sudac, a poslije i njegov predsjednik. Bio je dragovoljac Domovinskog rata, a nakon što je Zvonimir Šeparović 1999. postao ministar pravosuđa, Turudić je postao njegov pomoćnik. Nakon službovanja na Županijskom sudu u Virovitici prešao je 2000. na Županijski sud u Zagrebu, gdje je dvije godine radio kao istražni sudac, a idućih sedam kao sudac kaznenog odjela prvog stupnja. Od ožujka 2009. do kraja 2010. bio je predsjednik i sudac Odjela za USKOK zagrebačkog Županijskog suda, a potom je izabran za predsjednika Županijskog suda u Zagrebu. Na toj je dužnosti ostao do 1. siječnja 2021., kada je postao sudac Visokog kaznenog suda Republike Hrvatske. Od 2009. do 2011. bio je predsjednik Državnog sudbenog vijeća. Od svibnja 2024. glavni je državni odvjetnik Republike Hrvatske. Tijekom rada na Županijskom sudu u Zagrebu donio je nepravomoćne osuđujuće presude protiv bivšeg premijera Ive Sanadera zbog primanja mita i zlouporabe položaja i ovlasti, a nepravomoćno je osudio i bivšeg potpredsjednika Vlade Damira Polančeca te bivšeg veleposlanika Nevena Juricu. Sudio je i poduzetniku Hrvoju Petraču zbog otmice sina generala Vladimira Zagorca, kao i Mladenu Šlogaru zbog ubojstva Ivane Hodak, kćeri nekadašnje ministrice Ljerke Mintas Hodak i odvjetnika Zvonimira Hodaka.
