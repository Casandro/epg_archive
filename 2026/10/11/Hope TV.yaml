  title: Cliff!
  subtitle: Die Logik der Existenz
  description: |-
    Cliff Goldstein geht der Frage nach, warum das Universum überhaupt existiert. Mit einfachen Analogien - von einer Rübe bis zu einem Stein - zeigt er, dass nichts in der geschaffenen Welt seine eigene Existenz erklärt. Materialistische Erklärungen wie Urknall oder Quantenfluktuationen greifen für ihn zu kurz, da sie selbst wieder auf etwas Physisches angewiesen sind. Die einzig logische Option sei ein "notwendig existierendes Wesen": Gott, der ewig ist, keiner Erklärung bedarf und die Quelle allen Seins ist. Ein kraftvoller Gedankengang über Ursprung, Sinn und die einzig tragfähige Erklärung für die Existenz des Universums.

