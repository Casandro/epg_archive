  title: Leben und Gesundheit
  subtitle: Wenn das Gesundheitsbild uns trügt
  description: |-
    Sind wir wirklich gesund - oder reden wir uns das nur ein? Viele Menschen leben mit kleinen Beschwerden, Müdigkeit oder Schmerzen und halten das längst für normal. Doch was, wenn unser Bild von Gesundheit verzerrt ist? Wenn wir vergessen haben, wie sich echte Vitalität anfühlt? In dieser Sendung hinterfragen wir unser Gesundheitsbild - und fragen uns: Haben wir uns an ein Leben gewöhnt, das gar nicht mehr gesund ist?

