  title: ADRA direkt
  subtitle: Ernte des Friedens - Mosambik im Aufbruch
  description: |-
    Die Auswirkungen des jahrelangen Bürgerkriegs in Mosambik sind bis heute zu spüren. Dazu kommen extreme Wetterereignisse wie Überschwemmungen, Dürren oder heftige Wirbelstürme. ADRA begleitet Familien auf dem Weg zu angepassten und verbesserten Anbaumethoden und entwickelt mit ihnen kreative Möglichkeiten, die Ernte vor Wildtieren zu schützen.

