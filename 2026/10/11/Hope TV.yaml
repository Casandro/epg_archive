  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Nora Oelkers: Wie Jesus ein Esoterikhotel veränderte'
  description: |-
    Eigentlich wollte Nora Oelkers Menschen helfen - und machte ihr Hotel immer mehr zu einem Zentrum für Esoterik, Selbstoptimierung und positives Denken. Aufgewachsen in einer Unternehmerfamilie und getrieben von Perfektionismus baut sie das Familienhotel immer weiter aus - bis ihr Leben im Burnout zusammenbricht.
    In einer Klinik erlebt sie eine Begegnung mit Jesus Christus, die alles verändert. Danach stellt sie ihr gesamtes Hotel auf den Kopf: Konzepte, Angebote, Mitarbeitende und Werte. Heute führen Nora Oelkers und ihr Mann zwei Hotels mit rund 200 Mitarbeitenden. Ihr Ziel: Menschen sollen dort nicht nur entspannen, sondern Gott begegnen und "Einfach. Glücklich. Sein." können.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
