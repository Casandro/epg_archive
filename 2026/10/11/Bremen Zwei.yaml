  title: Niederdeutsches Hörspiel
  description: 'Eigentlich sollen Hannes und Daniel nur einige Möbel aus Frau Pawlaks ehemaliger Wohnung in ihr Seniorenheim bringen. Doch vor Ort erwartet sie eine unerwartete Überraschung: Frau Pawlak ist immer noch in ihrer Wohnung und weigert sich, sie zu verlassen. Die Umstände, die die verzweifelte Seniorin in ihre Situation gebracht haben, verschlagen selbst dem erfahrenen Team von "Smiet Rin" die Sprache.'
- eventId: 1010958
  start: 2026-10-11T17:00:00Z
  stop: 2026-10-11T20:00:00Z
  title: Klassikwelt
  subtitle: mit Wilfried Schäper
  description: Im Zentrum der Sendung steht heute die neue Aufnahme der charismatischen dänischen Blockflötistin Clara Guldberg Ravn. Das Album mit dem schönen Titel "You Made Me Laugh" präsentiert Stücke von Georg Philipp Telemann. Außerdem gibt es Musik von Schubert, Rachmaninoff, Sergej Prokofiev und Mieczyslaw Weinberg sowie einen kleinen Finnland-Schwerpunkt mit Werken von Jean Sibelius und Ilmari Hannikainen. Der ist bei uns kaum bekannt, hat aber ein spektakuläres Klavierkonzert im Stil von Rachmaninoff geschrieben.
- eventId: 1010963
  start: 2026-10-11T20:00:00Z
  stop: 2026-10-11T22:00:00Z
  title: Klassikwelt in concert
  subtitle: mit Wilfried Schäper
  description: Das neue "Liedfest Bremen" im Sendesaal Bremen hat am 22. Februar dieses Jahres mit einer Sternstunde der Liedinterpretation begonnen. Zu Gast im Sendesaal waren der isländische Startenor Benedikt Kristjánsson und sein israelischer Klavierpartner Ammiel Bushakevitz.
