- eventId: 1627337
  start: 2026-10-11T13:30:00Z
  stop: 2026-10-11T14:00:00Z
  title: Rozhlasové listování
  description: 'Ludwik se mračí. Cítí silnou nespokojenost a roste v něm odhodlání ke změně. Rozmíšky mezi Čechy a Poláky neustávají a komunisté slaví vítězství ve volbách pod heslem: Republice více práce, to je naše agitace. Jediný Wojtek má z měnící se atmosféry upřímnou radost. Premiéra 7. části četby ze závěrečného dílu trilogie Karin Lednické Šikmý kostel.'
