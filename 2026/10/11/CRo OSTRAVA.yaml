  title: Hvězdné návraty
  description: Říkali mu Julo, byl polovinou slavné dvojice a předčasně odešel v 61 letech. Jmenoval se Julius Satinský. Zavzpomínáme na jeho začátky, soukromé tragédie i herecké úspěchy. To vše okoření ukázky z filmů, rozhlasových i televizních estrád. K poslechu zve Patrik Rozehnal.
