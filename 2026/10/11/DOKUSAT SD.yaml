  title: Geheime Helden - Kämpfer für den Frieden
  subtitle: Geheime Helden - Kämpfer für den Frieden
  description: 'Im Herbst 1962 steht die Sowjetunion kurz davor, Nuklearraketen auf Kuba zu stationieren. Die USA halten dagegen. Eine direkte Konfrontation der beiden Atommächte scheint unausweichlich. Dass aus dem kalten Krieg dann doch kein heißer Krieg wird, ist nicht zuletzt einem Mann zu verdanken, dessen Rolle lange im Dunkeln blieb: Oleg Penkowski. "Geheime Helden" erzählt seine unglaubliche Geschichte. Fest steht: Penkowski rettete die Welt, indem er als Doppelagent den Dritten Weltkrieg verhinderte.'
  genre:
  - '129'
  widescreen: true
