  stop: 2026-10-11T23:25:00Z
  title: Geheime Helden - Der falsche Soldat
  subtitle: Geheime Helden - Der falsche Soldat
  description: Durch ein legendäres Täuschungsmanöver des britischen Geheimdienstes unter dem Codenamen "Operation Mincemeat" gelingt den Alliierten 1943 die Befreiung Siziliens. Eine Schlüsselrolle spielt dabei die Leiche eines britischen Offiziers. Die bei ihr gefundenen "geheimen" Pläne gaukeln den Deutschen vor, eine alliierte Landung in Sardinien und auf dem Balkan stehe unmittelbar bevor. Hitler ordnet eine entsprechende Truppenverlegung an - und begeht damit einen schweren strategischen Fehler.
