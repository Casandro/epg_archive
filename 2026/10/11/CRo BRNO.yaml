  start: 2026-10-11T15:04:00Z
  stop: 2026-10-11T16:00:00Z
  title: Zelný rynk
  description: 'Kulturní magazín Zelný rynk, který se tentokrát vysílá výjimečně v neděli v 17 hodin, přinese fejeton Lucie Hlavinkové Spisovatelka mezi dětmi. Autorka jej také přečte. Dále zazní reportáž z Městské knihovny T. G. Masaryka v Šumperku, kde proběhla konference Ludvík Vaculík 100: Další tisíce slov. V reportáži Aleny Blažejovské hovoří Kamila Šeligová, Ondřej Vaculík, Petr Kotyk a Daniela Iwashita. Četba z knihy Jany Soukupové Brněnské mordy pokračuje devátou částí. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Spisovatelce Ludmile Klukanové popřejeme k 90. narozeninám.'
