  title: Toulky Josefa Veselého
  description: Autor pořadu vzpomene na svou historii natáčení z různých možných dolů a pak zazní úryvek pásma Dokud Osel bude řváti. Osel bylo jméno nejznámějšího dolu v Kutné Hoře, takže je jasné, že padne leccos zajímavého z historie města. Neznámá osobnost ze soutěže Kdotobyl byla hned dvakrát korunovaná. Pokud seberete i další stopy z jejího života, tentokrát zcela jistě objevíte její jméno. Toulky českou minulostí předloží díl nazvaný Ferdinand a Anna o nepříliš oblíbeném králi na našem trůně. No, však takových bylo?
