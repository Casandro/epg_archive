  title: Myšlenka na den
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 17.10.2023 * Drazí bratři a sestry, dobrý den!Matoušovo evangelium nám vypráví o králi, který připravuje svatební hostinu pro svého syna Je to mocný muž, ale především velkorysý otec, chce, abychom se podíleli na jeho radosti. Dobrotu srdce odhaluje zejména v tom, že nikoho nenutí, ale zve na svatbu všechny, i když se tímto způsobem vystavuje možnosti odmítnutí. To je to, co Bůh připravuje pro nás: hostinu, abychom byli ve společenství s ním i mezi sebou navzájem. A my jsme pak Božími hosty. Svatební hostina však vyžaduje z naší strany čas a účast, vyžaduje jisté "ano": jít, jít na Boží pozvání, On zve, ale nechává nám svobodu. Svatý Augustin používá krásný výraz: "Bůh, který tě stvořil bez tebe, tě nemůže zachránit bez tebe". A rozhodně ne proto, že by na to neměl kapacitu - je všemohoucí! - ale proto, že jako láska maximálně respektuje naši svobodu. Navrhuje, nevnucuje.Vraťme se tedy k podobenství: král "poslal služebníky, aby svolali hosty na svatbu, ale pozvaní nechtěli přijít". Zde je drama příběhu: "ne" Bohu. Proč však lidé odmítají jeho pozvání? Bylo to snad nepříjemné pozvání? Ne, a přesto - říká evangelium - "nedbali a odešli jedni na své pole, druzí za svými záležitostmi". A ten král, Bůh, co dělá? Nevzdává se, dál zve, ba rozšiřuje pozvání, dokud mezi chudými nenajde ty, kteří ho přijmou. Mezi těmi, kteří vědí, že jim mnoho jiného nezbývá, přicházejí mnozí, až zaplní sál.Bratři a sestry, jak často nedbáme na Boží pozvání, protože se věnujeme svým vlastním záležitostem! Často bojujeme o vlastní volný čas, ale dnes nás Ježíš zve, abychom našli čas, který nás osvobozuje: čas, který věnujeme Bohu, který rozjasňuje a uzdravuje naše srdce, který v nás posiluje pokoj, důvěru a radost, který nás zachraňuje před zlem, osamělostí a ztrátou smyslu. Je dobré být s Bohem. Kde? Při mši, při naslouchání Slovu, v modlitbě a také v charitě: Pomoci slabým, chudým, dělat společnost opuštěným, naslouchat těm, kdo prosí o pozornost, utěšovat trpící, být s Bohem, který je přítomen v těch, kdo to potřebují. Mnozí si však myslí, že tyto věci jsou "ztrátou času", a tak se uzavírají do svého soukromého světa; a to je smutné. To pak plodí smutek. Kolik smutných srdcí! Pceská redakce vatikánských médií, krátil Martin Holík.'
  subtitle: Bůh zve, nenutí
