  title: Nedělní pohádka
  subtitle: Pohádky o potrestaném zlu a odměněné dobrotě - Jak si nakonec Matěj s Terezkou přece jen zatancoval a o tom, Jak se světýlko předělalo na
  description: 'Autor: Milan Kynčl; Interpret: Magda Hauserová, Dušan Baur; Vladimír Kintr; Jana Prokešová;; Premiéra: 18.9.2011 * Jak si nakonec Matěj s Terezkou přece zatancoval - tohle je trochu strašidelná a trochu legrační pohádka. Objeví se v ní statečný mládenec Matěj, hloupý strašidelný kostihnát a tuze hezká Terezka. Naštěstí si Matěj s kostihnátem poradí a Terezka bude jeho! O světýlku, co bývalo ohnivým mužem - nemyslete si, že strašidla mají lehký život. Jedno z nich mělo štěstí, že potkalo kováře Vobořila, který je dobrák od kosti, a tak mohlo najít nový domov.'
