  title: Der Südsteirische Winzerzug aus Gamlitz
  description: "Die südsteirische Weinbaugemeinde Gamlitz veranstaltet auch im heurigen Jahr das berühmte Herbstfest. Höhepunkt ist ein großer Brauchtumsumzug - der Winzerzug. Von 1. bis 4. Oktober 2026 findet das Traditionsfest mit einem vielfältigen Programm statt. Das Moderatorenteam Sigrid Maurer und Thomas Seidl präsentiert die Höhepunkte der Feierlichkeiten, eindrucksvolle Bilder der bunten und kunstvoll geschmückten Umzugswägen und Geschichten aus der Region Südsteiermark. \nRegie führt Elisabeth Eisner."
