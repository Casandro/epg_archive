  title: Kafka
  subtitle: MAX
  description: "(Serie, AUT 2024)\nKafkas Freund Max Brod ist ein anerkannter Schriftsteller, voller Energie und Ideen, aber sein größtes Projekt ist es, Ruhm für seinen Freund Franz zu erlangen. Mit aller Macht versucht Brod, seinem schwierigen Freund zu helfen.\nMit Joel Basman (Franz Kafka), David Kross (Max Brod), Nicholas Ofczarek (Hermann Kafka), Marie-Lou Sellem (Julie Kafka), Maresi Riegner (Ottla Kafka), Robert Stadlober (Felix Weltsch), Tobias Bamborschke (Oskar Baum), Christian Friedel (Franz Werfel), Michael Maertens (Erzähler), Gerhard Liebmann (Ledermann), Raimund Wallisch (Ledermann), Daniel Kehlmann (Arthur Schnitzler), Charly Hübner (Rowohlt), Robert Palfrader (Pachinger), Laurence Rupp (Kurt Wolff) u.a.\nDrehbuch: Daniel Kehlmann mit David Schalko basierend auf den Biografien von Reiner Stach\nerschienen im S. Fischer Verlag \nRegie: David Schalko"
