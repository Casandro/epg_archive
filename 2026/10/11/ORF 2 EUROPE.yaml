  title: Österreich-Bild aus dem Landesstudio Tirol
  subtitle: Barocker Marathon - 50 Jahre Innsbrucker Festwochen
  description: "Die legendäre Barockoper \"Der Goldene Apfel\" gilt als \"unaufführbar\": zu lang, zu teuer, zu aufwendig. Dieses Mega-Spektakel bietet acht Stunden Musik, 47 Rollen, 23 Bühnenbilder und mehr als 100 Kostüme.\nDie Innsbrucker Festwochen der Alten Musik wagen sich dennoch an den \"Wahnsinn\", wie sie selbst sagen. Zum 50-jährigen Jubiläum bringen sie \"Il Pomo d _Oro\" von Pietro Antonio Cesti erstmals nach 358 Jahren wieder komplett auf die Bühne: eine Premiere der Superlative. \nEin ORF-Team begleitet das ehrgeizige Projekt von Beginn an und blickt hinter die Kulissen. Zwei Akte der barocken Musik sind verschollen und müssen rekonstruiert werden. Wie geht das?  20 Sängerinnen und Sänger übernehmen die 47 Rollen. Das bedeutet Stress hinter der Bühne und Umziehen in Windeseile. Die achtstündige Oper wird auf zwei Premierenabende aufgeteilt. Eva Maria Sens, die künstlerische Leiterin der Innsbrucker Festwochen will beweisen, dass \"Der Goldene Apfel\" heute aufführbar ist."
  genre:
  - '34'
