  title: Traumschlösser und Ritterburgen - Von Steyr nach Schärding
  description: |-
    (Dokumentation, AUT 2024)
    Ein Zentrum für musische Bildung hier, ein Krankenhaus für Pferde da - die Burgen und Schlösser von Steyr bis Schärding werden heute vielfältig genutzt, und bieten den Menschen, die sie mit Leben erfüllen, und deren Ideen ein mehr als nur passendes Ambiente. Über dem Zusammenfluss von Steyr und Enns erhebt sich Schloss Lamberg in Steyr, das aus der historischen "Styraburg" hervorgegangen ist. Diese Burg gab der Stadt Steyr ihren Namen. Versteckt am südlichen Rand von Linz liegt das prachtvolle Schloss Tillysburg, dessen heutige Erscheinung auf das 17. Jahrhundert zurückgeht. Alljährlich im Sommer wird es zur Festspiel-Kulisse. Schloss Parz in Grieskirchen zählt zu den beeindruckendsten Renaissanceschlössern Österreichs. Es wurde zu Beginn des 16. Jahrhunderts von Sigmund Ludwig von Polheim errichtet. Ende der 1980er Jahre entdeckte man auf der Südfassade den größten erhaltenen Zyklus von Renaissancefresken nördlich der Alpen. Schloss Zell an der Pram im Bezirk Schärding wurde im 13. Jahrhundert von den "Herren von Celle" errichtet, heute wird es vom Land Oberösterreich als Zentrum für musische Erwachsenenbildung genutzt. Von der ursprünglichen Anlage der Burg Schärding wiederum sind heute nur noch markante Mauerzüge, der Burggraben mit der Zwingermauer und ein äußerer Torturm erhalten.
    Regie: Fritz Aigner
  genre:
  - '116'
