  start: 2026-10-11T20:14:04Z
  stop: 2026-10-11T21:04:04Z
  title: DAS GESPRÄCH mit Susanne Schnabl
  subtitle: Wohin steuert Österreichs Politik?
  description: "Stellt sich die Regierung neu auf oder droht ihr neue politische Konkurrenz?  Die Turbulenzen in der SPÖ setzen die gesamte Regierung unter Druck, einen \"Herbst der Ergebnisse\" zu liefern. Kann das mit einer SPÖ-Zwischenlösung an der Spitze bis Jahresende gelingen? Droht Stillstand oder braucht es neben einem personellen Neustart mit Markus Marterbauer als Vizekanzler auch eine Kurs-Korrektur? Was muss sich in den Parteien verändern, was in der Regierung? Oder formieren sich für den Fall von Neuwahlen bereits neue Kräfte, Bewegungen? \n\nDarüber spricht Susanne Schnabl mit: \n\nMatthias Strolz\nGründer NEOS\n\nSilvia Grünberger\nPR-Beraterin, ehem. ÖVP-Abgeordnete \n\nRobert Misik\nSPÖ-naher Publizist \n\nStephan Zöchling\nIndustrieller"
  genre:
  - '36'
