  subtitle: mit Johannes Kopf, Vorstandsvorsitzender Arbeitsmarktservice (AMS)
  description: "Die Lage am heimischen Arbeitsmarkt bleibt angespannt und volatil - während die Arbeitslosenquote bei Männern leicht gesunken ist, ist sie bei Frauen deutlich gestiegen. Warum der AMS-Chef von der Notwendigkeit des Sparpakets überzeugt ist, welche Gruppen es wohl weiterhin schwer haben werden, am Arbeitsmarkt Fuß zu fassen und welche Strategien es dagegen gibt, warum die Diskussion darüber, länger arbeiten zu müssen, nicht verstummt und wie der Einsatz von KI die Arbeitswelt verändern wird.\n\nDie Fragen stellen: \n\nJeannine Hierländer\n\"Die Presse\"\n\nund \n\nKlaus Webhofer\nORF"
