  title: kreuz & quer nah dran
  subtitle: Starke Kinder - große Träume
  description: |-
    Auf die Gesundheit von Kindern zu achten, ist eine Investition in die Zukunft, so der Appell von zahlreichen Organisationen, die sich mit Fragen der Gesundheit von Kindern beschäftigen. Dass die Lösung bestehender Probleme in ihrer Versorgung vor allem eine Frage der Gerechtigkeit ist, zeigt etwa ein Blick auf die konkrete Situation chronisch kranker Kinder. Andrea Eder hat für "keuz & quer nah dran" Kinder mit bleibenden Krankheiten und ihre Familien getroffen und mit ihnen über Gesundheit, Krankheit und Gerechtigkeit gesprochen.
    Danach im "kreuz & quer plus": Iconic - Schlüsselmomente: Das Attentat auf Papst Johannes Paul II.
