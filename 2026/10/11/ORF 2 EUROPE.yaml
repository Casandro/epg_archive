  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Der Teufel und die Moserin
  description: |-
    Vor fast 300 Jahren fühlt die reiche Bäuerin am Moserhof im Kärntner Althofen, dass es mit ihr zu Ende geht. Der sehnlichste Wunsch der Moserin ist es, noch die Beichte abzulegen, denn sie hat sich mit dem Teufel eingelassen. Der Pfarrer steht bereit, doch der Leibhaftige kämpft mit aller Macht um die Seele der Sterbenden.
    Weshalb hat sich die Moserin an den Teufel verkauft? Max Müller beginnt seine Spurensuche in Guttaring. Von Brunhilde und Daniela Plassnegger erfährt der Sagenjäger, welches Geheimnis sich hinter der Zubereitung von 'teuflisch guten' Kärntner Kasnudeln verbirgt. Danach reist Max Müller nach Kappel am Krappfeld und trifft dort die ehemalige Lehrerin Maria Groß. Die Sagenexpertin berichtet, dass Unwissenheit und Aberglauben einst weitverbreitet waren und Neid auf jemanden schnell zur Nachrede führte, mit dem Teufel im Bunde zu stehen. In der Kirche von Klein St. Paul bestätigt Dechant Lawrence Pinto im Anschluss, dass der Satan in einem Haus Gottes keine Macht besitzt. Zum Abschluss seiner Spurensuche hat der Sagenjäger in Althofen noch eine Verabredung mit Stadtarchivar Günther Jannach, der diese fast in Vergessenheit geratene Sage, die vermutlich aus der Zeit Maria Theresias stammt, wiederentdeckt hat.
  genre:
  - '34'
- eventId: 1477983
