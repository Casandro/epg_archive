  title: Hohes Haus
  description: |-
    -Langes Warten auf die Gesundheitsreform
    Lange Wartezeiten, Kassenärztemangel und überfüllte Ambulanzen: Österreichs Gesundheitssystem steht unter Druck. 2025 wurden dafür mehr als 64 Milliarden Euro ausgegeben. Ein von den Grünen veröffentlichtes Papier der ÖGK-Dienstgeberseite schlägt unter anderem Selbstbehalte beim Arzt vor. Wie kommen die Vorschläge an? Wie lassen sich die Versorgung verbessern und die angekündigte Gesundheitsreform umsetzen? Astrid Wibmer und Claus Bruckmann haben nachgefragt.

    -Zu Gast im Studio sind die Gesundheitssprecher und Nationalratsabgeordneten Rudolf Silvan (SPÖ) und Ralph Schallmeiner (Die Grünen)

    -U-Ausschuss: Pilnaceks Nähe zur ÖVP
    Im Pilnacek-Untersuchungsausschuss ging es diese Woche unter anderem um umstrittene Vorbereitungsschulungen für Auskunftspersonen und einen 440 Seiten starken WKStA-Bericht zu Pilnaceks Laptop. Dieser legt jahrelange informelle Beratungen des suspendierten Sektionschefs für ÖVP-Spitzenpolitiker nahe. Claudia Dannhauser war dabei.

    -Rechnungshof backstage
    Wie entstehen Rechnungshofberichte? Wer entscheidet über Prüfungen, wie tief reichen die Kontrollen und was passiert bei Widerspruch? Rechnungshofpräsidentin Margit Kraker gibt im Beitrag von Rebekka Salzer Einblicke in die Arbeit der Kontrolleure.

    Moderation: Rebekka Salzer
