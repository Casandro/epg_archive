- eventId: 1012795
  start: 2026-10-11T15:04:00Z
  stop: 2026-10-11T16:11:00Z
  title: 'Hörspielzeit: Das Lied vom Sag-Sager'
  subtitle: von Daniel Danis  (SR/DLF 2001)
  description: |-
    Irgendwo im dünnbesiedelten Québec in einem windschiefen Holzhaus leben die Brüder Rock, William und Fred-Gilles Durant - ohne Eltern und ohne ihre Schwester Noéma,  die ausgezogen ist, um als Akkordeonspielerin Karriere zu machen. Die vier teilen eine wunderlichen Familiengeschichte: Als Kinder wollten sie nicht sprechen, bis ihre Mutter ein geheimnisvolles Kupfergerät erfand, den "Sag-Sager", der ihnen die Worte aus dem Mund locken sollte.
    Eines Tages kehrt Noéma zurück - gebrochen, ohne Stimme, der Körper wie erstarrt, nur die Augen wach. Gegen den Rat der Ärzte beschließen die Brüder, sie mit ihren eigenen, ungewöhnlichen Methoden zu heilen. Sie gründen die "Gesellschaft der dauerhaften Liebe" und stellen sich ihrer Verantwortung und alten Konflikten. Doch kann diese radikale Form der Liebe Noéma wirklich ins Leben zurückholen?
    "Ich glaube", sagt Daniel Danis über sein Stück, "dass es eine große Sehnsucht gibt, den Riss zwischen der technischen Welt und dem archaischen Gefühlsleben der Menschen zu heilen. Deswegen haben meine Figuren eine Sprache, die der kleiner Kinder ähnelt. Sie sprechen nicht Techno wie der Rest der Welt. Das ist ihre Freiheit."
