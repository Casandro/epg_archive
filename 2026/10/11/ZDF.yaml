  description: |-
    Kinderserie, Deutschland 2026
    Karlchen spielt laut im Wohnzimmer Fußball und stört alle beim Mittagsschlaf. Gekränkt zieht er aus! Er will ab jetzt im Baumhaus wohnen - dort kann er endlich toben, so laut er will.

