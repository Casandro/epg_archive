  title: Pochoutkový rok
  description: Je tu další díl narozeninového Pochoutkového roku. V něm vás čeká začátek podzimního posvícenského pečení s Vojtou Vrtiškou, ale také připomínka toho, že byste se měli zapojit do hlasování pro nejlepší recept desetiletí naší soutěže domácích receptů. Můžete vyhrát poukázku na nákup kuchyňského elektrovybavení a také budeme rozdávat naše úplně nové vánoční kuchařky Vánoční pečení Josefa Maršálka a Patrika Rozehnala. Víc se dozvíte na webu pochoutkovyrok.cz nebo v našem vysílání.
