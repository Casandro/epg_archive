- eventId: 1626473
  start: 2026-10-11T07:10:00Z
  stop: 2026-10-11T07:35:00Z
  title: Přímo z místa
  description: Lakros je stará indiánská hra pocházející z Kanady. Ve třicátých letech ji poprvé zkoušeli na našem území skauti a postupně se z ní vyvinul sport, jehož česká podoba se hraje dodnes. Právě před čtyřiceti lety vznikla z hecu první oficiální lakrosová soutěž mezi družstvy tehdejších tábornických oddílů v Zábřeze. Byla první soutěží na Moravě a druhou v celém ČSR. Ve vzpomínkách někdejších účastníků si dřevní doby lakrosu v Zábřeze připomeneme a podíváme se také na to, jak to tam vypadá z lakrosem dnes. Připravil Miroslav Kobza.
