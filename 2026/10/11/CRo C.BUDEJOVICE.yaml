  title: Písničky z cizí kapsy
  description: Petr Rezek, ač jej známe z žánrově jinak ukotvených písniček, nikdy neskrýval svou náklonnost k rockové hudbě a dokonce i k její ostřejší podobě zvané heavy metal. Skupina Cheap Trick, od níž si v prostředku 80. let půjčil písničku Moje díky patří vám (v originálu If You Want My Love), se během kariéry dotkla obou těchto stylových škatulek. Přesto zazářila hlavně se skladbami, kterým vládly spíše klenuté melodie a zvuk označovaný jako power pop. Jak to dopadlo s jeho převodem do českých měřítek? To můžete posoudit v Písničkách z cizí kapsy, které nabízí k poslechu původní skladbu i do naší mateřštiny zabalenou coververzi. K poslechu zve Martin Schuster.
