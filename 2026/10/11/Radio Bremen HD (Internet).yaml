  start: 2026-10-11T13:15:00Z
  stop: 2026-10-11T14:00:00Z
  title: Expeditionen ins Tierreich
  subtitle: Transsilvanien - Draculas Wildnis
  description: 'Transsilvanien, die Heimat Graf Draculas, gibt es wirklich: Sie liegt in einem noch ursprünglichen Winkel Südosteuropas, abgeschirmt von der Gebirgskette der Karpaten im Zentrum Rumäniens. Eine Wildnis, wie es sie woanders in Europa längst nicht mehr gibt. In spektakulären Bildern hat der vielfach preisgekrönte Naturfilmer John Murray Transsilvanien als Zeitreise in die Vergangenheit in Szene gesetzt.'
