  subtitle: Wie kommt die Regierung aus der Krise, Herr Söder?
  description: |-
    Nach den Landtagswahlen im Osten und in Berlin steht die Bundesregierung unter erheblichem Druck. Der Koalitionsausschuss beteuerte diese Woche, an den Reformplänen festhalten zu wollen, neue Beschlüsse brachte er allerdings nicht. Ist die Wirtschaftspolitik der Bundesregierung auf dem richtigen Kurs? Wie bekommt der Standort Deutschland wieder mehr Luft unter die Flügel?

