  title: Edgar, das Super-Karibu
  subtitle: Ein Lied für Windhausen
  description: 'Der Gemeinderat von Windhausen muss ein offizielles Stadtlied auswählen. Für Magnus soll das "Es lebe der Winterwind" von Henry, dem Röhrer sein. Aber Henrietta findet das Lied gar nicht gut, da es ja auch im Sommer gesungen werden soll. Für Katja ist es ganz klar: "Guter Wind, schöner Wind" soll es heißen. Der Rat ist gespalten und die Entscheidung liegt bei Super-Edgar. Doch der kann sich so gar nicht entscheiden.'
  genre:
  - '16'
- eventId: 688076
  start: 2026-10-11T04:55:00Z
  stop: 2026-10-11T05:10:00Z
  title: Edgar, das Super-Karibu
  subtitle: Die Maske
  description: Gina, die Kameldame macht ihrem Super-Edgar eine schöne Liebeserklärung. Super-Edgar ist bewegt und glücklich. Aber Gina gibt ihm zu verstehen, dass sie auch den ganz normalen Edgar, der sich hinter seiner Superheldenmaske versteckt, liebt. Und ja, sie hätte gerne, dass er seine Maske ablegt. Seine Maske ablegen? Aber dafür ist Super-Edgar doch viel zu schüchtern!
  genre:
  - '16'
- eventId: 688475
  start: 2026-10-11T05:10:00Z
  stop: 2026-10-11T05:55:00Z
  title: Martynas Levickis und das Akkordeon
  subtitle: Deutschland 2024
  description: Es ist, als könne man ein ganzes Orchester in einen kompakten Kasten stecken, um es immer bei sich zu haben, sagt der Akkordeonist Martynas Levickis über sein Instrument. Und der versierte litauische Musiker spielt es hoch virtuos. Charismatisch, mutig, humorvoll und neugierig bereitet er seinem Instrument glanzvolle Auftritte mit großem Repertoire. George Gershwins "Rhapsody in Blue" aus der Konzertkirche Neubrandenburg, ist das musikalische Herzstück des Films "Martynas Levickis und das Akkordeon".
