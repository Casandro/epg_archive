  title: Unser Kindermädchen ist ein Millionär
  subtitle: Fernsehfilm Deutschland 2006
  description: Der charmante Industriellensohn Max Helmer ist ein Lebemann wie er im Buche steht. Umso größer ist sein Entsetzen, als er von seinem traditionsbewussten Vater dazu verdonnert wird, zwei Wochen lang als Haushaltshilfe bei der allein erziehenden Mutter Elena Gruber seinen Mann zu stehen. Durch diese Lektion, so hofft sein Vater, soll er endlich Disziplin und Verantwortungsbewusstsein lernen. Zunächst versucht der Faulenzer Max, sich nach allen Regeln der Kunst durchzumogeln. Aber schon nach kurzer Zeit findet er überraschend viel Gefallen an seinem Job - und vor allem an der selbstbewussten Elena.
