- eventId: 690704
  start: 2026-10-11T09:00:00Z
  stop: 2026-10-11T10:05:00Z
  title: Echt jetzt? Demokratie unter Druck
  subtitle: Auftakt zur Hamburger Woche der Pressefreiheit
  description: "Fakt oder Fake? Desinformationskampagnen, Deepfakes und KI-generierte Inhalte stellen Demokratien weltweit vor neue Herausforderungen. Welche Informationen stimmen, welche sind falsch? Echte und gefälschte Informationen sind auf den ersten Blick nicht mehr auseinanderzuhalten. \n\nZum Auftakt der 4. Hamburger Woche der Pressefreiheit diskutiert Ingo Zamperoni live mit Wikipedia-Gründer Jimmy Wales, Journalismus-Professorin Christina Elmer, Niedersachsens Innenministerin Daniela Behrens (SPD) und Journalistin Victoria Reichelt: Wie schützen wir uns - und unsere Demokratie - vor Desinformation?"
- eventId: 690799
  start: 2026-10-11T10:05:00Z
  stop: 2026-10-11T11:35:00Z
  title: Unser Kindermädchen ist ein Millionär
  subtitle: Fernsehfilm Deutschland 2006
  description: Der charmante Industriellensohn Max Helmer ist ein Lebemann wie er im Buche steht. Umso größer ist sein Entsetzen, als er von seinem traditionsbewussten Vater dazu verdonnert wird, zwei Wochen lang als Haushaltshilfe bei der allein erziehenden Mutter Elena Gruber seinen Mann zu stehen. Durch diese Lektion, so hofft sein Vater, soll er endlich Disziplin und Verantwortungsbewusstsein lernen. Zunächst versucht der Faulenzer Max, sich nach allen Regeln der Kunst durchzumogeln. Aber schon nach kurzer Zeit findet er überraschend viel Gefallen an seinem Job - und vor allem an der selbstbewussten Elena.
  ageRating: 6
  genre:
  - '16'
