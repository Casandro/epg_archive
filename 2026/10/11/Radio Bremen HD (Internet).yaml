  title: DAS! Rote Sofa
  subtitle: 'Gast: Johann Lafer, TV-Koch'
  description: |-
    Ende Mai machte Johann Lafer seine Krebserkrankung
    öffentlich. Der TV-Star-Koch kämpft und kommt zurück:
    Knapp drei Monate später wird er bei der Kochshow "Grill den Henssler" vom Publikum mit Standing Ovations willkommen geheißen. Und er moderiert auch wieder die erfolgreiche Sendung "Die Küchenschlacht". Gemeinsam mit dem Ernährungsmediziner Dr. Matthias Riedl widmet sich Johann Lafer besonders der gesunden Küche und zeigt in seinem aktuellen Buch, dass gesundes Essen nicht nur gut für den Körper, sondern auch für die Seele ist.
