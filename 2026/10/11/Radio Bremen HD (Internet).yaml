  title: Kochstories
  subtitle: Der Räuchermeister
  description: 'Nach einer richtungsweisenden Begegnung mit einem Fischer im Norwegen-Urlaub, bei dem Moritz Klein zum ersten Mal einen selbst geräucherten Fisch auf offenem Feuer gegessen hat, beschließt er, sein Leben komplett umzukrempeln: Der leidenschaftliche Angler gibt seinen sicheren Job als Lehrer auf und macht sein Hobby zum Beruf. Unter dem Namen "Lachs und Moritz" eröffnet er in Frankfurt seine eigene, kleine Fischräucherei mit Abverkauf und beliefert zudem auch ortsansässige Gastronomiebetriebe.'
- eventId: 697836
  start: 2026-10-11T14:30:00Z
  stop: 2026-10-11T15:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: 'Mit kühleren Temperaturen kommt der Appetit auf herbstliche Gerichte wie wärmende Suppen, nahrhafte Eintöpfe oder deftige Ofengerichte. Die beste Zeit für Kohl- und Kürbisgerichte. Beide Gemüse kommen aus der Region und haben Hochsaison, sind besonders geschmackvoll, zudem prall gefüllt mit Vitaminen und anderen gesunden Inhaltsstoffen. Ein weiterer Vorteil: Die regionalen Produkte sind zur Erntezeit preiswerter als importierte Ware. So lässt sich beim Einkauf Geld sparen.'
