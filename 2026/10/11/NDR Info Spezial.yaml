  title: Zwischen Hamburg und Haiti
  description: |-
    In Porto drücken Klangpoeten der Stadt ihren akustischen Stempel auf. Einer davon: Rapper Ruca Semente Negra. Er sammelt die kleinen Geschichten seiner Heimat und strickt daraus poetische Texte auf flowenden Beats.
    Dabei klingt der Beat der rauen Arbeiter-Stadt ganz anders als in Lissabon, wo sich der portugiesische "Hip-Hop Tuga" in den migrantisch geprägten Vororten entwickelt hat. Hier mischen sich amerikanische Beats mit Melodien aus den Kapverden und Rhythmen aus Angola.
    Reporter Michael Richmann hat sich die Geschichten von Beat-Poeten und tanzenden Kämpfern erzählen lassen.
  subtitle: Was Hip-Hop über Portugal verrät
