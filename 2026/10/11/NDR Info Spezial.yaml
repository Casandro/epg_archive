  description: |-
    Zweifel sind längst zu einer einflussreichen Währung geworden und für manche sogar zu einem lukrativen Geschäftsmodell. Im investigativen Podcast REICH folgt ein Journalistenteam einem Netzwerk aus Lobbyisten und Firmengeflechten, das schon seit Jahrzehnten beeinflusst, woran wir glauben. Zunächst im Auftrag der Tabakindustrie, dann für Alkoholunternehmen und schließlich für die Öl- und Gasbranche. Die wirksamsten Werkzeuge: Zweifel säen, Fakten relativieren und Debatten lenken.

    Dieser Podcast ist eine Produktion der ARD Klimaredaktion (HR, MDR, SWR).
