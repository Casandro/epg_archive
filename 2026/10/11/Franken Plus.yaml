  description: In der neuen Folge von Hä? Das Straßenquiz sind wir auf der Fürther Michaeliskirchweih unterwegs und testen das Kärwa-Wissen der Besucherinnen und Besucher. Wer war der heilige Michael, was stellt das Maskottchen Betzala dar und seit wann haben städtische Angestellte am Kärwa-Dienstag ab 12 Uhr frei? Außerdem geht es um den Billigen Jakob, das Brunzkärtla und die Besonderheit der Fürther Michaeliskirchweih. Wie viele der Fragen unsere Kandidatinnen und Kandidaten richtig beantworten, sehen Sie in der neuen Folge von Hä? Das Straßenquiz.
