  subtitle: Leben am Sonnblick
  description: Das Sonnblick Observatorium ist nur per Seilbahn oder zu Fuß zu erreichen. Auf dieser spektakulär gelegenen Wetterstation am Gipfel des Hohen Sonnblicks ist Ludwig Rasser seit über 40 Jahren Wetterwart und Observatoriums-Techniker. Zwei Wochen im Monat lebt und arbeitet er auf 3.106 Meter Seehöhe und erfüllt dabei eine Vielzahl an Aufgaben, die ihn auch bei widrigsten Wetterbedingungen ins Freie führen. Ein Leben in luftiger Höhe.Österreich 2025
