  title: Der letzte Tag von Pompeji
  description: "Mehr als 100 Archäologen, Vulkanologen, Anthropologen, Historiker und Architekten arbeiteten während der Grabungskampagne 2019 an bislang unberührten Teilen der weltberühmten römischen Stadt Pompeji, die 79 nach Christus unter den Aschewolken des Vesuv versank. 1.500 Quadratmeter Stadtfläche wurden während der neuen Ausgrabung freigelegt, darunter vor allem die \"Gasse der Balkone\", eine kleine Straße, die ganz besondere Einblicke in das Alltagsleben der Römer erlaubt. Die Archäologen förderten täglich neue, erstaunliche Funde aus den bislang unberührten Grabungsabschnitten zutage, darunter auch Skelette von einzelnen Bewohnern. Diese Funde sind deshalb so außergewöhnlich, weil man in Pompeji zumeist keine Überreste der Bewohner gefunden hat, sondern nur Hohlräume im vulkanischen Material. Die Skelette bieten erstmals die Möglichkeit, mehr über Pompejis Bewohner selbst zu erfahren. Durch DNA-Untersuchungen sind Wissenschaftler dazu in der Lage, aus Knochenproben Alter, Geschlecht, Verwandtschaftsbeziehungen und ethnische Zugehörigkeit zu ermitteln. Insgesamt hat sich seit den letzten größeren Ausgrabungen in den 1950er- und 60er-Jahren der Charakter einer archäologischen Untersuchung stark verändert. Neue Messtechniken ermöglichen 3-D-Grafiken der Fundsituation, bevor die Grabung selbst den Fundort verändert. All diese Informationen und viele neu entdeckte wunderbare Mosaiken und Objekte erlauben einen frischen Blick auf das städtische Leben in der Antike. \nDokumentarfilm, Deutschland 2019, R: Pierre Stine"
