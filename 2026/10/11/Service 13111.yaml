  title: Ich, Bauer
  subtitle: Mein Hof darf nicht sterben!
  description: "Auf dem Hof der Familie Nuart in Kärnten steht die Übergabe an die nächste Generation bevor. Tochter Eva übernimmt die Käserei, ihr Mann Daniel Tiere und Ackerbau. \"Mein Lebenswerk ist ein kleiner Betrieb, der über Generationen Bestand hat und von dem alle leben können\", sagt Vater Seppi. Doch wird er, der das Gesicht des Betriebes ist, wirklich loslassen können? \n\n\"Ich möchte im Leben eigentlich nichts mehr erreichen, als ein Bauer zu sein\", sagt Franz Rodlauer aus Spital am Pyhrn. Er und seine Resi suchen deshalb einen eigenen Hof. Der Traum vom Vollerwerbsbetrieb führt sie zu Jakob Schabernig, der seinen 600 Jahre alten Hof gerne an eine junge Familie übergeben möchte. Für Jakob wären die beiden die idealen Nachfolger - doch Resi und Franz wollen in ihrer Heimat in Oberösterreich bleiben. Zwei Hofübergaben, zwei Generationen und die Frage: Wie viel darf sich verändern, damit etwas bestehen bleiben kann?\nÖsterreich 2025, R: Barbara Weber, Stefan Aglassinger"
  genre:
  - '116'
  widescreen: true
