  title: WDR 2 Jörg Thadeusz
  description: |-
    Rüdiger Lange, Herzchirurg
    Er hat rund 15.000 Menschen am Herzen operiert und 40 Jahre am OP-Tisch gestanden: Rüdiger Lange zählt zu den erfahrensten und renommiertesten Herzchirurgen der Welt. Bis 2023 leitete er die Klinik für Herz- und Gefäßchirurgie am Deutschen Herzzentrum in München.
    In seinem Buch "Herzblut. Spitzenchirurgie zwischen Leben und Tod" erzählt er auch von der Angst des Chirurgen und von der Last der Verantwortung.
