  title: WDR 2 Sonntagsfragen
  description: |-
    Katja Domschky "Bauen und Wohnen"
    Wer bei uns im Westen eine bezahlbare Wohnung sucht, steht jede Woche in einer endlosen Bewerberschlange.  In NRW fehlen 364.000 Wohnungen. Warum wird nicht schneller neu- oder umgebaut?
    Warum verlieren wir uns in 4.000 Baunormen, während die Niederländer mit wenigen Bauvorschriften auskommen, ohne dass ihre Häuser  zusammenfallen? Wie müssen Architekten und Planer umdenken? Antworten gibt Katja Domschky, Präsidentin der Architektenkammer von NRW.
    Darin:<br/>zur vollen Stunde WDR aktuell
  subtitle: 'Moderation: Gisela Steinhauer'
