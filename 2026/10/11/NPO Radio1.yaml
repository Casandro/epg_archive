  title: Vroege vogels
  subtitle: 'Radioprogramma over natuur, milieu, klimaat en duurzaamheid. Presentatie: Menno Bentveld.'
  description: 'Veel vogelaars vragen zich af of we dit jaar weer eens een invasie van notenkrakers krijgen. Onder bepaalde omstandigheden kunnen deze zeldzame vogels ons land namelijk massaal aandoen. Regelmatig komen ze in het nieuws: dieren die de schuld krijgen van vertraging bij bouw- of infraprojecten. Dit soort situaties kunnen echter vrij eenvoudig worden voorkomen wanneer beter rekening wordt gehouden met de natuur. Het grootste deel van de jeneverbesstruiken ging verloren tijdens de brand die afgelopen augustus bij Oostrum woedde. Hoe ziet het herstel van deze soort en de rest van het natuurgebied eruit? En verder in de uitzending: Rechten voor de natuur, Explosie van veldmuizen, Appels en peren, Otters, Maaien met een zeis en Boeken met Alexander Reeuwijk. De column is van Nikki Dekker. Vroege Vogels Radio op NPO Radio 1 wordt zondag gepresenteerd door Menno Bentveld van 7.00 tot 10.00 uur vanuit het Groene Huis in Amersfoort. Lees hier meer over de hele uitzending. (2026)'
