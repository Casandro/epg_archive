  description: 'Граф Алексей Бобринский: от министерского кресла к духовному призванию Эта программа посвящена судьбе одного из самых неординарных представителей российской аристократии XIX века - графа Алексея Павловича Бобринского. Человек, занимавший пост министра путей сообщения Российской империи, в зените своей карьеры совершил поступок, который современники называли и "чудачеством", и "духовным прозрением". Встреча с британским проповедником лордом Редстоком в 1870-х годах стала поворотным моментом в жизни графа. Оставив государственную службу, Бобринский посвятил себя делу, которое шло вразрез с устоями высшего света: он стал одним из лидеров евангельского движения в России. В программе мы проследим путь графа Бобринского: ? От скепсиса к вере: как личное переосмысление Библии изменило мировоззрение государственного деятеля. ? Просвещение и меценатство: как в петербургских салонах и в родовом имении в Богородицке рождались кружки по изучению Писания, объединявшие аристократов и простых рабочих. ? Социальное служение: история строительства школ и больниц, ставших примером гуманного отношения к труду и человеку. ? Конфликт с системой: почему активная проповедь "пашковцев" вызвала гнев официальной церкви. ? Изгнание: драматический финал жизни графа, вынужденного покинуть Россию и завершить свой путь вдали от родины, в Каннах. Это история о поиске истины, личной свободе и цене, которую приходится платить за верность своим убеждениям в эпоху жестких идеологических рамок. Приглашаем вас взглянуть на личность Алексея Бобринского не как на исторический параграф, а как на человека, искавшего ответы на вечные вопросы в переломный момент российской истории.'
