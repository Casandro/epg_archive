  title: Wunderschön!
  subtitle: Salzkammergut - Prächtige Berge und glasklare Seen
  subtitled: true
  genre:
  - '144'
  description: 'Abenteuerlich und filmreif: Das Salzkammergut zählt mit mehr als 70 Badeseen zu den schönsten Naturlandschaften Österreichs. Tamina Kallert lernt auf ihrer Reise durch die Region Land und Leute kennen und erlebt so manches Abenteuer. Sie wandert, fliegt und taucht: Mit dem Paraglider geht es über den türkisblauen Wolfgangsee. Im Weißenbachtal stürzt sich Tamina Kallert bei einer Wanderung mit Taucherbrille in das eiskalte Gebirgswasser des Gimbachs.'
- eventId: 1071351
  start: 2026-10-11T10:00:00Z
  stop: 2026-10-11T10:45:00Z
  title: Michael Martin - Mit der Kamera um die Welt (4/4)
  subtitle: Himalaya und Mongolei
  description: |-
    Die beiden Himalaya-Regionen Spiti und Zansakar sind von der tibetischen Kultur geprägt. In der kargen Hochgebirgswüste Spitis begegnet Michael Martin halbnomadischen Viehhirten. Danach zieht er mit Pferden auf einer einsamen Trekkingroute durch das alte Königreich Zanskar.
    Zum wiederholten Mal ist der Naturfotograf unterwegs in dem Land, das wie kein anderes für Steppe steht: die Mongolei. Noch ist sie weitgehend unberührte Natur und Heimat Hunderttausender Nomaden. Mit dem Motorrad erkundet Michael Martin "off-road" die schier endlose Steppe von Ost nach West - eine abenteuerliche Fotoexpedition auf zwei Rädern.
