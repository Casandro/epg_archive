  title: RESPEKT - Demokratische Grundwerte für alle!
  subtitle: 'Gesunde Ernährung: Kochen für ein Menschenrecht'
  subtitled: true
  genre:
  - '128'
  description: Laut Statistik ist jeder siebte Todesfall in Deutschland auf ungesunde Ernährung zurückzuführen. Sie erhöht das Risiko für Herzinfarkte, aber auch für Depressionen, für Schlaganfälle, für Krebs, Alzheimer, Diabetes, Gelenkprobleme ... Sich gesund oder ungesund zu ernähren, ist aber nicht einfach eine individuelle Entscheidung. Gesundes Essen ist auch im reichen Deutschland für eine wachsende Zahl von Menschen schlicht zu teuer. Vielen fehlt zudem das Wissen, was gesundes Essen ist und wie man es zubereitet.
