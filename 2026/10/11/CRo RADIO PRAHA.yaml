  title: Až na dřeň
  description: Je autorkou kuchařek, hraje v divadle, působí jako koučka. Martina Dvořák Venigerová je žena mnoha profesí a také žena, ktezá od základů proměnila svůj život po té, co překonala rakovinu. Proč nemoc přirovnává s pošťákovi se zprávou a proč se rozhodla s nemocí nebojovat, ale spolupracovat? I o tom promluví v pořadu Až na dřeň. Moderuje Kateřina Kubalová
