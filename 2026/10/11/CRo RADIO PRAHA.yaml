- eventId: 1626955
  start: 2026-10-11T23:00:00Z
  stop: 2026-10-12T00:00:00Z
  title: Host Lenky Vahalové
  description: Do studia přijde herec JAN POLÍVKA. Původně hrál závodně basketbal, nakonec se ale rozhodl pro herectví. V současné době studuje fyzické divadlo na JAMU, rád by zrežíroval film a stejně jako jeho bratr Vladimír - rád maluje obrazy. Společně se svým otcem Bolkem Polívkou a bratry nazkoušel inscenaci Anděl v lihu. O čem je? Jaké bylo tvořit se svojí rodinou? A proč je pro něho přirozené vyjadřovat emoce skrze pohyb? Moderuje Lenka Vahalová
