  genre:
  - '16'
  description: "Mit dem neu erlernten Radfahren gewinnt Luise ein Stück Freiheit zurück und sorgt - wieder einmal - für Empörung, nicht zuletzt beim Bruder Veit. Karla ist verunsichert durch Luises Interesse an ihrem Leben und bittet diese, nicht mehr über sie zu schreiben. Außerdem hat Karla plötzlich mit Morgenübelkeit zu kämpfen. \nDer Konflikt zwischen den Geschwistern spitzt sich weiter zu und mündet in einer neuen Mutprobe, zu der Veit auffordert. Diese hat mit einem Feld, Gewitter und der Vergangenheit zu tun. - Wird es Luise ergehen wie damals ihrer Schwester Ida?"
