  subtitle: Rund um den Globus - Die Rattenfänger von Kambodscha
  description: "Der Tonle Sap in Kambodscha ist der größte See Südostasiens. Familie Krouy lebt von der Fischerei. Doch jetzt, Anfang September, hat der See seinen Wasserhöchststand erreicht. Die Netze reichen nicht mehr bis zum Grund. Es wird immer schwieriger, Fische zu fangen. Deshalb gehen Sey Ha und seine Freunde auf Ratten-Jagd. Mit dem Verkauf der Ratten können sie in der Regenzeit Geld verdienen. \n DE 2011"
