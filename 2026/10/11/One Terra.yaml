  title: Planet Weltweit - Namibias Geparden - Hoffnung für die Raubkatzen
  subtitle: Planet Weltweit - Namibias Geparden - Hoffnung für die Raubkatzen
  description: 'Planet Weltweit: Ob Kalahari, Namib oder Etoscha: Namibia verfügt über eine Fülle von Schutzgebieten und Tierreservaten. Fast 40 % der Landesfläche stehen ganz oder teilweise unter staatlichem Schutz. Davon profitieren auch die Raubkatzen hier im Südwesten Afrikas. Von den geschätzt 8.000 Geparden, die es noch gibt, lebt mehr als ein Drittel in Namibia. Einst war ihr Bestand um ein Vielfaches höher. Wachsende Trockenheit, Wilderer sowie der Wettbewerb mit den größeren und stärkeren Leoparden setzen ihrer Population zu. Engagierte Tierschützer und Veterinäre, ideenreiche Frauen und Fährtenleser kämpfen jeden Tag um das Überleben der Großkatzen. Selbst in einem der am spärlichsten besiedelten Länder der Welt ist nicht endlos Platz für wilde Tiere. Die Raubkatzen Nambias leben nämlich meist gar nicht in den eher trockenen Schutzgebieten und Tierreservaten, sondern auf dem fruchtbaren Farmland, auf dem Abertausende Rinder, Schafe und Ziegen gezüchtet werden, die für die schnellen Räuber eine leichte Beute darstellen. Das führt zu Konflikten mit den Farmern, die sich der tierischen Widersacher gern mit dem Gewehr entledigen. So schrumpft die Zahl der Geparden seit Jahrzehnten kontinuierlich. Auch deshalb, weil sie sich ihre Reviere mit den größeren Leoparden teilen müssen. Tierschutzorganisationen wie die Stiftung Naankuse, gegründet von der Farmerstochter Marlice van Vuuren, zeigen den Viehzüchtern Alternativen auf, um die Raubtiere nicht in jedem Fall gleich zu töten. So rücken mobile Eingreifteams aus, um Geparden und Leoparden, die zum Problem geworden sind oder es werden könnten, einzufangen und mit Sendern auszustatten, die den Tierschützern und Farmern die Positionen der Raubtiere melden. Doch wie spürt man diese Tiere am besten auf und fängt sie ein? Erfahrene Fährtenleser wie Buschmann Debe helfen den Gepardenrettern dabei. Das Gepardenweibchen Amber ist ihm besonders an Herz gewachsen.  DE 2021'
