  title: Planet Weltweit - Hamburg, die Stadt der Schwäne
  subtitle: Planet Weltweit - Hamburg, die Stadt der Schwäne
  description: 'Hamburg - die stolze Hansestadt im Norden Deutschlands - geprägt von der Elbe und dem Hafen und von der Alster mit ihren berühmten weißen Alsterschwänen. Seit Jahrhunderten sind die majestätischen Vögel eng mit der Tradition Hamburgs verbunden. Zum Schutz der Schwäne gibt es seit über 400 Jahren sogar ein eigenes städtisches Amt: Den Schwanenvater von Hamburg. Bereits seit1674 existiert in der Hansestadt eine behördliche Planstelle zum Schutz der Schwäne der Stadt - die des Schwanenvaters. Sie ist wohl auch die älteste Tierschutzbehörde Europas. Olaf Nieß hat das Amt vor 19 Jahren von seinem Vater Harald übernommen und ist rund ums Jahr mit der Hege und dem Schutz der Tiere beschäftigt. Das Verhältnis der Hamburger zur ihren wilden Stadtschwänen ist innig - werden sie im November eingefangen, gilt das in Hamburg als offizieller Winterbeginn. Und erst, wenn sie im Frühjahr wieder aus dem Winterquartier getrieben werden, beginnt in der Hansestadt der Frühling.  Alle in Hamburg kennen ihn, den hochgewachsenen, charismatischen Endvierziger, der fast täglich mit seinem Boot und dem quirligen Terrier auf Hamburgs Wasserstraßen unterwegs ist: Olaf Nieß ist der sogenannte Schwanenvater von Hamburg, er übernahm das Amt von seinem Vater, der es 46 Jahre lang innehatte. Seit seiner Kindheit ist Olaf Nieß mit der Rettung von Schwänen und anderen Wildtieren beschäftigt - und so wie er das Wasser liebt, liebt er "seine" Schwäne: "Die Legende sagt, solange stolze Schwäne auf der Alster ihre Runden ziehen, ist Hamburg eine freie und wirtschaftlich erfolgreiche Stadt. Ich werde alles dafür tun, dass das so bleibt." Einen Bestand um die 150 Tiere ist in der Stadt aufrecht zu halten - laut jahrhundertealter Gesetzgebung. DE 2014'
