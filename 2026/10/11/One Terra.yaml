  title: Planet Weltweit - Die Verwandlungskünstler von Dakar
  subtitle: Planet Weltweit - Die Verwandlungskünstler von Dakar
  description: 'Dakar, die Hauptstadt Senegals: Hier zu überleben, ist für viele Menschen eine Frage der Improvisation. In vielen Vierteln hat die Not einen ganz eigenen Boom hervorgebracht: Die Menschen sammeln, was andere weggeworfen haben - und wandeln diese Abfälle in "Neues" um. Wir zeigen, wie alte Konservendosen in Spielzeugautos, Lampen und Koffer verwandelt werden, Kronkorken in Körbe, Motoren in Kochtöpfe, Autoreifen in Eimer. So entstehen Gebrauchsgegenstände, aber auch Spielzeuge und Möbelstücke, die in Europa bereits als Kleinkunst gehandelt werden. Der 31-Jährige Malick Mbaye weiß zu schätzen, was andere Menschen wegwerfen: Büchsen, Dosen und Flaschendeckel - oder alte Paletten. Zusammen mit seinem Kompagnon Alassane Diop, 26, bastelt er daraus mit meist improvisierten Werkzeugen Kommoden, Koffer oder Gießkannen, aber auch Spielzeug. Sogar aus Europa erhalten die beiden inzwischen Aufträge. Mit ihrer kleinen Werkstatt "Soweto Village" können sie ihre Eltern und Geschwister ernähren, für eigene Familien allerdings reicht das bescheidene Einkommen nicht. Lebenstraum der beiden ist es, eines Tages alle Freunde und Verwandte beschäftigen zu können.Schon jetzt ist ihre Veranda sozialer Mittelpunkt der Nachbarschaft. Ganze Stadtteile Dakars leben von der Müll-Verwandlung. Aus Mangel an erschwinglichen Materialien ist selbst in der bildenden Kunst eine Recycling-Strömung entstanden, die längst international Beachtung findet. Die meisten Menschen jedoch können durch den Müll gerade ihr Überleben sichern, auf der benachbarten Müllkippe suchen Männer, Frauen und Kinder nach Wiederverwertbarem, das sie in einem angrenzenden Dorf an Händler verkaufen. Da die Verwandlungswirtschaft für viele Menschen die einzige Möglichkeit ist, ihre Existenz zu sichern, hat eine Entwicklungshilfeorganisation die Schule "Ecopole" gegründet, in der Kinder und Jugendliche in Recycling-Handwerken ausgebildet werden. DE 2004'
