  title: Planet Weltweit - Estland, Krötenretter im Einsatz
  subtitle: Planet Weltweit - Estland, Krötenretter im Einsatz
  description: 'Planet Weltweit: Wenn in Estland der Frühling einzieht, erwachen tausende Amphibien aus der Winterstarre und ziehen zu ihren Laichgebieten. Umweltaktivistinnen sorgen alljährlich dafür, dass möglichst viele Tiere die Massenwanderung unbeschadet überstehen. Auch in der Hauptstadt Tallin, wo Kröten und Frösche durch den Autoverkehr bedroht sind. Die Biologin Katerina Pesocki vom Städtischen Museum für Naturkunde in Tallinn kämpft für den Naturschutz. Mit Helfern und Aktivisten vom Estnischen Naturfonds organisiert sie Rettungsaktionen, speziell zur alljährlichen Massenwanderung der Kröten im Frühjahr. Wenn die Tiere ihren Instinkt-geleiteten Marsch antreten, befördern freiwillige Helfer*innen in wenigen Tagen und Nächten tausende Kröten und Frösche sicher über die Straßen. Doch wo und wann genau werden die Tiere wandern? Katerinas Fachkenntnisse sind für die Einsatzplanung unabdingbar. Mit Beginn der warmen Frühlingstage kriechen zunächst nur vereinzelt die ersten Frösche und Kröten aus ihrem Erd-Unterschlupf an die Oberfläche. Alle versuchen, zu ihrem jeweils individuellen Heimatteich zurückzukehren - egal, wie weit entfernt der liegt - um sich dort fortzupflanzen. Zur Laichablage und Befruchtung herrscht dann ein großes Gewimmel unter der Wasseroberfläche. Die Männchen klammern sich meist rücklings an ihre Auserwählte, oft schon auf der Wanderung zum Wasser. Die eigentliche Herausforderung aber ist der Autoverkehr, gerade in und um Tallinn. Viele Frosch- und Krötenwanderwege führen über Straßen, wo viele Tiere überfahren werden. Katerina und die vielen Helfer werden also dringend gebraucht. Und auch die Polizei ist mit im Einsatz - damit Estlands Kröten und Frösche ihren Platz in der Natur des Landes behalten können. DE 2022'
