  stop: 2026-10-11T07:02:00Z
  title: Planet Weltweit - Die goldenen Schildkröten von Madagaskar
  subtitle: Planet Weltweit - Die goldenen Schildkröten von Madagaskar
  description: Die Angonoka, so nennen die Madagassen die Goldene Schnabelbrust-Schildkröte, ist eine besonders edle Landschildkröte mit einem golden glänzenden Panzer. Sie ist nicht nur schön, sondern auch selten - und deshalb sehr begehrt bei Reptiliensammlern weltweit. Für die Angonoka auf Madagaskar ist das fatal. Neben den gut betuchten Sammlern, vornehmlich aus der westlichen Welt, haben immer mehr Asiaten Interesse an den Tieren. Jedoch nur am Panzer, der bei vielen dort als Aphrodisiakum gilt. Inzwischen ist der madagassische Nationalpark Baly Bay die letzte natürliche Zuflucht der Goldenen Schnabelbrustschildkröte, die weit über 100 Jahre alt werden kann. Aber ist der Tierbestand in dieser abgelegenen Region wirklich stabil oder droht der Art das Ende? Planet suchte auf Madagaskar nach Antworten und nach Spuren des Schmuggels. Der Biologe und ausgewiesene Angonoka-Experte Miguel Pedrono begibt sich zusammen mit dem Veterinär Ranto Rany-Ratiarison auf Spurensuche. Mit nur noch etwa 250 wildlebenden Exemplaren ist die Angonoka die seltenste Schildkrötenart der Welt. Die Preise, die für Angonoka-Babies auf dem Schwarzmarkt erzielt werden, sind abenteuerlich, bis zu US$ 50.000. Ihre lange Lebensdauer und dazu ihre Seltenheit machen die Tiere inzwischen unter skrupellosen Sammlern auch zur begehrten Geldanlage. Trotz internationaler Kampagnen, Hilfsgelder und Schutzprogramme werden so immer wieder Schildkröten außer Landes geschmuggelt - illegaler Tierhandel, und ein Raubzug mitten im Naturparadies Madagaskar. Die tropische Insel liegt rund 500 km östlich von Mozambique im Indischen Ozean. Es ist der Ort mit der größten Vielfalt an endemischen Arten weltweit. Doch der Lebensraum für die so einzigartige Tier- und Pflanzenwelt ist immer stärker bedroht. Von den rund 22 Millionen Menschen auf Madagaskar leben über 80% in ländlichen Regionen, Armut ist gerade hier weit verbreitet. DE 2014
  ageRating: 6
- eventId: 1601122
  start: 2026-10-11T07:10:00Z
  stop: 2026-10-11T08:02:00Z
  title: Planet Weltweit - Bird Island - Allein unter Pinguinen
  subtitle: Planet Weltweit - Bird Island - Allein unter Pinguinen
  description: 'Kaum ein Ort ist dichter besiedelt als Bird Island - zumindest was Pinguine, Seevögel und Robben betrifft. Menschen dürfen dieses subantarktische Tierreich nur wenige betreten. Und wenn, dann müssen sie viel Zeit mitbringen: Eineinhalb Jahre verbringen sie in der kleinsten Forschungsstation des British Antarctic Survey, 1400 Kilometer vom nächsten Hafen entfernt. Acht junge Briten leben als Einsiedler auf Bird Island: eineinhalb Jahre ohne schnelles Internet, ohne Arzt oder Bäcker, ganz auf sich gestellt. Nur zweimal jährlich kommt ein Versorgungsschiff vorbei. Als erstes deutsches Filmteam durfte diese Reportage ihren Alltag begleiten: auf einer nur vier Quadratkilometer kleinen Vogelinsel vor der Küste Südgeorgiens - einem der stürmischsten und tierreichsten Plätze der Erde. Bird Islands Natur ist tatsächlich noch unberührt. Hunderttausende Pinguine und Albatrosse nisten auf dem subantarktischen Eiland, unbeeindruckt von den neugierigen Blicken der - wenigen - Menschen. Für die acht Frauen und Männer, die hier für den British Antarctic Survey forschen, geht ein Lebenstraum in Erfüllung: Es gibt kaum einen besseren Ort auf der Erde, um Seevögel zu beobachten. Dafür nehmen sie Arbeit bei Schnee und Sturm in Kauf, und monatelange Isolation. Selbst ihre Kollegen auf der 1000mal größeren Nachbarinsel Südgeorgien bleiben für sie unerreichbar. Nur 500 Meter Südpolarmeer trennen beide Inseln. Doch für Vögel und Menschen liegen Welten dazwischen. Robben- und Walfänger haben nicht nur Südgeorgiens Tierwelt geplündert, sondern auch Ratten eingeschleppt. Die Nager bedrohen die Vogelwelt. Ohne sie würden hier vermutlich 90 Millionen mehr Tiere nisten als heute. Mit der bisher größten Rattenausrottung aller Zeiten versucht daher ein Biologen-Team, Südgeorgiens Natur in ihren "Urzustand" zu versetzen: in ein Bird Island in Mega-Format und damit in den wichtigsten Vogelbrutplatz der Südhalbkugel. DE 2015'
  ageRating: 6
- eventId: 1601130
  start: 2026-10-11T08:10:00Z
  stop: 2026-10-11T09:02:00Z
  title: Planet Weltweit - Peru - Delfine in Gefahr
  subtitle: Planet Weltweit - Peru - Delfine in Gefahr
  description: Perus Delfine sind gefährdet! Das gilt nicht nur für die Meeresdelfine, sondern auch für die äußerst seltenen rosa Flussdelfine der Regenwaldregionen. Trotz offiziellem Fangverbot werden in Peru nach Schätzungen der peruanischen Umweltorganisation "Mundo Azul" jährlich mindestens 20.000 Meeresdelfine getötet - zum menschlichen Verzehr als auch als Fischköder. Für die Fischer eine dringend benötigte Einnahmequelle. Dass lebende Delfine allerdings noch viel mehr Geld einbringen könnten, wollen der deutsche Biologe Stefan Austermühle und seine peruanische Frau Nina Pardo beweisen. Sie propagieren Delfin-Tourismus statt Delfin-Fang. Von der Pazifik-Küste bis in das wenig bekannte peruanische Amazonas-Becken begleitet die Reportage das Ehepaar bei diesem schwierigen Unterfangen. Nach wochenlanger Recherche mit versteckter Kamera gelingt endlich die Razzia auf dem Fischmarkt von Callao, einer Hafenstadt nahe Lima - geleitet von Major Juan Torres. Ein gefährlicher Einsatz für die Polizei-Beamten, wie auch für die Mitarbeiter von "Mundo Azul". Dass die Polizei beim Aufspüren von illegalem Tierhandel mit der NGO zusammenarbeitet, ist nicht selbstverständlich. Angesichts der extremen Armut und der latenten Gewaltbereitschaft in Peru war für die meisten Verantwortlichen der Polizei billiges Delfinfleisch auf dem Schwarzmarkt in der Vergangenheit kein ernstzunehmendes Verbrechen. Bei der Razzia finden die Polizei-Beamten kiloweise illegales Delfinfleisch. Doch Mundo Azul macht noch mehr - regelmäßig forscht Stefan Austermühle auch an Delfinen in freier Natur. Er fotografiert sie, um ihren Bestand zahlenmäßig erfassen zu können. Er will beweisen, dass es einen Zusammenhang zwischen der Überfischung der Meere, der Umweltverschmutzung und dem Rückgang der Delfinbestände gibt. Gleiches hat er auch im Amazonasgebiet vor, in das er zusammen mit seiner Frau Nina und der vierjährigen Tochter Aysha reist. DE 2007
  ageRating: 6
- eventId: 1601136
  start: 2026-10-11T09:10:00Z
  stop: 2026-10-11T10:02:00Z
  title: Planet Weltweit - Tasmanien, Sympathie für den Teufel
  subtitle: Planet Weltweit - Tasmanien, Sympathie für den Teufel
  description: Die australische Insel Tasmanien ist die Heimat einer einzigartigen Tierwelt. Ein Paradies auf Erden, das für seinen Teufel zur Hölle wurde. Unbarmherzig wird der Beutelteufel von einer heimtückischen Krankheit dahingerafft. Wenn nicht bald etwas geschieht, wird es die legendären Tasmanischen Teufel bald nicht mehr geben. Über 90 Prozent des Bestandes wurden bereits von einem heimtückischen Krebs dahingerafft, der nur die Tiere angreift. Biologen, Immunologen und Tiermediziner arbeiten mit Hochdruck daran, ein Gegenmittel zu finden. Private Initiativen kümmern sich um kranke, verletzte und verwaiste Teufel. Ein Wettlauf gegen die Zeit, der die einstmals gegen den Teufel eingestellte tasmanische Öffentlichkeit wieder eint. Greg Irons, der Besitzer des Bonorong Wildlife Sanctuary, will nicht akzeptieren, dass der Tasmanische Teufel demnächst aussterben soll. Dass der Gesichtskrebs, der die Tiere seit Jahren unaufhörlich dahinrafft, ihr Ende sein soll. Nun, da die tasmanische Öffentlichkeit endlich zu begreifen beginnt, wie wertvoll die Teufel für das Ökosystem und das Image der australischen Insel sind. Jahrhunderte lang wurden die Tiere gejagt und ausgerottet, woran hauptsächlich ihre für das menschliche Ohr unangenehm schrill klingende Stimme schuld war. Die ersten Siedler glaubten sogar, den Teufel persönlich zu vernehmen, wenn sie ihn nachts im Wald rufen hörten. Daher auch ihr Name. Inzwischen weiß man, dass die Teufel als Aasfresser einen wertvollen Dienst im Ökosystem erfüllen. Auch sind sie weder aggressiv noch gefährlich. Deshalb hat Greg Irons ein Rettungsprogramm ins Leben gerufen, das alle erdenklichen Seiten des Problems mit einbezieht. Er koordiniert die Bergung kleiner Teufel aus den Beuteln ihrer todkranken oder überfahrenen Mütter und sorgt dafür, dass sie von speziell dafür ausgebildeten Menschen großgezogen werden. In seinem Wildtierpark leben Teufel, die er zum Teil selbst aufgezogen hat. DE 2014
  ageRating: 6
- eventId: 1601145
  start: 2026-10-11T10:15:00Z
  stop: 2026-10-11T11:07:00Z
  title: Planet Weltweit - Cook Islands - Welcome to paradise!
  subtitle: Planet Weltweit - Cook Islands - Welcome to paradise!
  description: 'Die Cook Islands im pazifischen Ozean gelten für viele als die schönsten Inseln der Welt. Blumenkränze, Lebensfreude, türkisblaues Meer und eine Tanzbegeisterung, die ansteckt. Die meisten der rund 14.000 Cook Islands-Bewohner leben auf der Hauptinsel Rarotonga und der Nachbarinsel Aitutaki, an einer der wunderbarsten Lagunen der Welt. Doch auch dieses Paradies auf Erden ist bedroht. Ein Inselstaat mitten im Pazifik. Ein Paradies aus Wasser, Bergen, dichten Wäldern, Atollen und einer atemberaubenden Unterwasserwelt. Frauen mit Blumenkränzen, der Klang der Ukulelen und die unglaublich schönen Blau- und Türkistöne zwischen Himmel und Wasser - das sind die Cook Islands. "Glück" ist ein Wort, das man hier öfter als anderswo auf der Welt hört -."Kia Orana - mögest du lang leben!" oder einfach nur: "Welcome to paradise!" - so wird jeder auf Rarotonga begrüßt.  Auf Rarotonga, der dicht bewaldeten Vulkaninsel der Cook Islands steht Te Mire Ura - das alljährliche Tanzfestival - vor der Tür. Wer hier gewinnt, darf sich ein Jahr lang "Dancer of the year" nennen. Pirtou Nga hat früher sämtliche Titel abgeräumt. Jetzt sollen seine Söhne Edward und Piri es ihm gleich tun. Zum Üben braucht man auf den Cook Islands weder einen Saal noch Musik - getanzt wird im Freien, und den Rhythmus der Trommeln haben ohnehin alle im Blut. Später beim Wettbewerb zählen präziser Ausdruck und die Darbietung insgesamt. So verbringen alle Teilnehmer die Wochen vor dem Festival mit Üben und mit dem Nähen ihrer Kostüme, die ausschließlich aus Materialien bestehen dürfen, die aus der Natur der Cook Islands kommen - Muscheln, Blüten, Palmenblätter, Hühnerfedern - all das findet sich am Ende in den kunterbunten Fantasiekostümen wieder. Das Leben auf den Cook Islands hat auch schattige Seiten: Junge Leute wandern ab, die Tsunamis nehmen zu und der Wasserspiegel steigt... DE 2016'
  ageRating: 6
- eventId: 1601146
