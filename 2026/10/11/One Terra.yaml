  title: Planet Weltweit - Schweiz, das Verschwinden der Gletscher
  subtitle: Planet Weltweit - Schweiz, das Verschwinden der Gletscher
  description: "Die Schweiz - Land der Berge, der Gletscher, Bergbäche und Seen. Die Alpen zeigen hier ihre schönsten Seiten. Doch die Natur verändert sich: die Gletscher schrumpfen, Felsmassive werden brüchig. Immer häufiger kommt es zu Überschwemmungen und Bergstürzen. Die Menschen hier müssen sich den Veränderungen stellen. Die Berge geraten in Bewegung.\nDie Schweizer, ein Bergvolk. Früher herrschte Armut, heute gehört es zu den reichsten der Welt. Weniger als ein Zehntel der schweizerischen Landesfläche ist besiedelt, mehr als die Hälfte ist Alpen- und Voralpenraum. Über 3300 Gipfel sind höher als 2000 Meter. 1800 Gletscher bedecken etwa 3% der Landesfläche. Sie sind wichtige Wasserspeicher. Doch die Erderwärmung setzt ihnen zu: Pro Jahr verlieren die Schweizer Gletscher heute einen Kubikkilometer an Volumen.\n\nDas Berner Oberland im Herzen der Schweiz. Die Simmenfälle oberhalb des Dorfes Lenk bieten im Sommer 2013 einen ungewohnten Anblick. Der Faverges-See des Plaine Morte-Gletschers ist ausgebrochen und verwandelt den Fluss schlagartig in einen reißenden Strom. Ein imposantes aber auch gefährliches Naturspektakel. Das neue Phänomen hält nicht nur die Bevölkerung im Tal in Atem, sondern auch Wissenschaftler. Gemeinsam mit dem Geologen Daniel Tobler untersucht die Geomorphologin Isabelle Kull den Ausbruch im Auftrag der örtlichen Behörden. Die beiden haben das Alarmsystem im See installiert und wollen verschiedene Szenarien der künftigen Entwicklung im Plaine-Morte-Gebiet erforschen. Denn Wasserstürze wie diese können im Tal schnell Hochwasserlagen erzeugen und damit das komplette Gemeindewesen bedrohen. \nDie Veränderungen in den Schweizer Alpen sind massiv. Immer wieder rutschen auch ganze Bergflanken zu Tal, weil der Permafrost, der die Felsen normalerweise auch im Sommer fest zusammenhält, vielerorts schmilzt. Der Klimawandel ist längst in den Hochalpen angekommen. Wie gehen die Schweizer damit um? DE 2013"
  ageRating: 6
- eventId: 1601112
  start: 2026-10-11T05:10:00Z
  stop: 2026-10-11T06:02:00Z
  title: Planet Weltweit - Spreewald - Kähne, Köche, Klapperstörche
  subtitle: Planet Weltweit - Spreewald - Kähne, Köche, Klapperstörche
  description: 'Der Spreewald, eine knappe Autostunde von Berlin, ist die Heimat der Sorben und Wenden. Nicht nur, dass die Volksminderheit eine eigene Sprache spricht, sie pflegt auch ihr Brauchtum hingebungsvoll. Die Landschaft, in der die Menschen hier leben, ist etwas ganz Besonderes: Unzählige Kanäle und natürliche Wasserarme, so genannte Fließe, durchziehen die Wälder, manche Orte sind noch immer nur per Kahn erreichbar. Eine entrückte und verwunschene Landschaft, zu jeder Jahreszeit. Die GEO Reportrage hat den Spreewald ein Jahr lang von seiner weniger bekannten Seite portraitiert. Anfang Januar wird auch im Spreewald die Fastnacht gefeiert. Auffallend im kleinen Örtchen Burg sind die vielen jungen Leute in ihren Trachten. Es ist die Tracht der Wenden und Sorben, jener Slawenvölker, die seit dem 6.Jahrhundert durch Völkerwanderungen in den Spreewald kamen. Bräuche werden hier akribisch gepflegt. So tragen zum Beispiel die Mädchen und Frauen  kunstvoll gesteckte und handbestickte Hauben. Ein Handwerk, dass nur noch ganz wenige Spreewälderinnen beherrschen. Zu ihnen gehört Christa Dziumbla, die ihr Wissen an die 18-jährige Cindy weitergibt. Und jedes Jahr im Frühjahr kehrt Adebar, wie der Volksmund den Weißstorch nennt, zurück in den Spreewald, um hier zu brüten und seinen Nachwuchs groß zu ziehen. Vielfältig ist auch die Küche der Region. Junge und innovative Köche interpretieren typische Spreewaldgerichte neu, zum Beispiel Sternekoch Oliver Heilmeyer im feinen Hotel Bleiche. Aber auch der gebürtige Brandenburger Marco Giedow zaubert mit den ökologisch hochwertigen Rohstoffen eine moderne und leichte Küche mit vielen Referenzen an den Spreewald. Bio-Gemüse, selbstgebackenes Brot, kalt gepresstes Leinöl und Fleisch von Tieren, denen es auf den Weiden und Wiesen gut geht. Das, was die Region ausmacht findet man hier überall: gutes Essen, altes Handwerk und eine verzauberte Landschaft. So nah und doch so fern von der Hauptstadt. DE 2015'
  ageRating: 6
- eventId: 1601115
