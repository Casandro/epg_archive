  title: Planet Weltweit - Unter Haien - Riffpatrouille in der Sulusee
  subtitle: Planet Weltweit - Unter Haien - Riffpatrouille in der Sulusee
  description: "Wie ein gestrandetes Raumschiff steht inmitten der philippinischen Sulu-See eine kleine weiße Kapsel auf Stelzen: die entlegendste Ranger-Station der Welt. 150 Kilometer vom Festland entfernt, bewachen hier neun Männer eines der artenreichsten Riffe, das Tubbataha Atoll. Haie sind ihre einzigen Besucher in der Einsamkeit. Bis sich Nationalparkchefin Angelique Songco zur Inspektion anmeldet. \nEs ist eine ungewöhnliche Männer-WG, die zwei Monate auf einer 90 Quadratmeter kleinen Station verbringt, aufgebockt im Meer und von Haien umkreist. Fast ohne Kontakt zur Außenwelt gehen die neun Ranger fischen, ziehen Kräuter, vertreiben sich die Zeit bei Schach - und patroullieren mit Schnellbooten ein 100.000 Hektar großes Weltnaturerbe: den Tubbataha Reefs Natural Park. Denn der Artenreichtum des Atolls in der philippinischen Sulu-See lockt illegale Fischer in das geschützte Gebiet. Wenn sich im April die rauhe See legt, kündigt sich eine Abwechslung an: Parkchefin Angelique Songco kommt per Fischerboot aus der 150 Kilometer entfernten Hafenstadt Puerto Princesa auf der Insel Palawan zur Visite vorbei. Eine charismatische Frau, der es gelingt, die Männer zu ihrem entlegenen Einsatz zu motivieren - und die resolut jede Invasion des Naturparadieses bekämpft. \nTubbataha gilt als eines der spektakulärsten Tauchgebiete der Welt und als Kinderstube für viele Arten inmitten der weitgehend leer gefischten Gewässer der Philippinen. Mehr als 600 Fischspezies kommen hier vor, dazu die Hälfte aller Korallenarten. Auf zwei winzigen Inseln finden außerdem Seevögel ein wichtiges Brutgebiet. Ein Refugium, das permanent verteidigt werden muss: Immer wieder nehmen die Ranger illegale Fischer fest oder werden Zeuge, wie große Schiffe auf das Riff auflaufen und es unwiederbringlich zerstören. Einmal am Tag nehmen sie Kontakt zur Basis auf: dem 150 Kilometer entfernten Nationalparkamt in Puerto Princesa. Dort leistet ihre Chefin Angelique Songco Aufklärungsarbeit. DE 2014"
