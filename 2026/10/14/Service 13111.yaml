  title: Hotels zum Staunen - Ein Blick hinter die Kulissen
  subtitle: Gangtey Lodge, Bhutan
  description: |-
    Die britische Chefköchin Monica Galetti und ihr Kollege Rob Rinder arbeiten in 3.000 Metern Höhe in der Gangtey Lodge in Bhutan, einer abgelegenen Region, die erst vor elf Jahren an das Stromnetz angeschlossen wurde. In dem Luxushotel stehen Sauerstoffflaschen jederzeit bereit, und die Küchenchefs bereiten Mahlzeiten zu, die den Gästen die Anpassung an die Höhe erleichtern sollen. Während ihres Aufenthalts lernt Monica das Bogenschießen kennen, eine beliebte lokale Freizeitbeschäftigung, und erfährt, wie die Einheimischen Butter und Käse für die Hotelküche herstellen. Auf ihrer Erkundungsreise der Gangtey Lodge  besuchen Monica Galetti und Rob Rinder auch das benachbarte buddhistische Kloster.
