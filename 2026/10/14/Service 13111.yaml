  title: Fahrt ins Risiko
  subtitle: Türkei - Die Todesstraße D915
  description: "Von der Schwarzmeerküste der Türkei führt der \"Highway D915\" durch steile Täler und hochalpine Pässe in das anatolische Hochland. Dabei überquert der \"Highway\" den 1000 Kilometer langen Pontischen Gebirgszug, der von Istanbul bis an die Grenze zu Georgien reicht. \nIm Herbst bereiten sich die Menschen für den Winter vor, sechs Monate im Jahr ist die Straße gesperrt. An den Derebasi-Kurven, dem gefährlichsten Teil des \"Highways D915\", müssen die Fahrerinnen und Fahrer 29 Haarnadelkurven bezwingen und am Ende das Eiserne Tor passieren, eine Felspassage in senkrechten Steilwänden, hunderte von Metern über dem Tal. \nAuch risikobereite Besucher zieht der Highway an, so zum Beispiel die junge Motorradfahrerin Merve, die ihr Fahrkönnen auf die Probe stellt und anschließend noch eine Pilgerfahrt der besonderen Art an der weiter südlich gelegenen \"Stoneroad\" gelingt. \nAhmet und Burhan nutzen die Straße seit vielen Jahren für die Schafszucht und Landwirtschaft, sie haben eine emotionale Beziehung zu diesen Bergen. Selma baut auf der Nordseite des Gebirges Tee an, den sie selbst mit ihrem Transporter zur Verladung fährt. \nIm Gebirge kreuzen sich fast alle Wege am Imbiss der Straße: Turguts Place. Wenige Kilometer weiter ist die abgelegene Gegend ein wichtiger Rückzugsort für Tiere und besondere Pflanzen, die Fotograf Murat seit Jahren dokumentiert. Als Aktivist setzt er sich dafür ein, dass die Straße nicht weiter ausgebaut wird. \nSo unvollkommen, gefährlich und unbequem die Straße sein mag, sie ist genau deshalb heute von Anwohnern und Besuchern gleichermaßen beliebt und geschätzt.\nDokumentarfilm, Deutschland 2024, R: Alexander Hick"
  genre:
  - '112'
  widescreen: true
