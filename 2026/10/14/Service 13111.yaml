  title: Terra Mater
  subtitle: Die süßesten Tierbabys
  description: Das erste Jahr im Leben eines Tieres ist oft das Entscheidendste! Ob ein junges Tier mit ausreichend Nahrung versorgt wird, sich gegen seine Geschwister durchsetzen und schließlich für sich selbst sorgen kann, hängt von vielen Faktoren ab. Dieser Film zeigt in rührenden Geschichten, welchen Gefahren der Nachwuchs auf diesem Weg trotzen muss. Zwischen den Wäldern und Wiesen, den Seen und Küsten Norddeutschlands und Skandinaviens leben die verschiedensten Tiere, die sich beherzt dem Leben stellen. 2018
