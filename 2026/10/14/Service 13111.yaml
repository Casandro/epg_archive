  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Hüter der Badlands
  description: |-
    In den Badlands im Südosten von Alberta, Kanada, liegt eine geographische Besonderheit. Aus dem Weltall betrachtet zeigt sich der Umriss eines Gesichts, das aufgrund seines Kopfschmucks der indigenen Bevölkerung Amerikas gleicht. Bekannt geworden ist dieses Gesicht als Hüter der Badlands. Die Ähnlichkeit zu einem menschlichen Gesicht ist frappierend und wirft Fragen auf, ob diese geografische Gegebenheit nicht vor Jahrtausenden künstlich erschaffen worden ist. Erstaunlich ist auch, dass dieses Antlitz sich auf der Oberfläche des Planeten Mars gespiegelt wiederfindet. Könnten beide Umrisse des gleichen Gesichts, auf der Erde und auf dem Mars, außerirdischer Herkunft sein? Die Theoretiker der Prä-Astronautik sind überzeugt, dass dies Codes eines kosmischen Kommunikationssystems sind und dass damit die außerirdische Herkunft der Menschheit bewiesen werden könnte.
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2019
