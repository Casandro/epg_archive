  title: P.M. Wissen
  subtitle: u.a. Schlank mit alten Kartoffeln? - Ernährungstrend "Resistente Stärke" auf dem Prüfstand
  description: 'Wer abnehmen will, kann versuchen, den Effekt von Stärke in Lebensmitteln zu reduzieren. Einem Ernährungstrend zufolge soll das sogar ohne Verzicht funktionieren: Mit Kartoffeln oder Nudeln vom Vortag. Denn die enthalten die sogenannte "Resistente Stärke", die schlank halten und gesund sein soll. Ernährungsexpertin Iris Pohl findet heraus, was dahinter steckt. // Ein Wald aus Bäumen, den man nicht mit Wanderschuhen durchquert, sondern mit Taucherbrille und Flossen - so etwas gibt es tatsächlich: Im Salzkammergut auf dem Grund des Altausseer Sees. Forscher wollen herausfinden, wie dieser Unterwasserwald entstanden ist. // Professionelle Mess-Methoden und digitales Dauer-Monitoring können Patienten besser schützen. Das gilt auch für das Messen der Körpertemperatur. Ein neuartiges, intelligentes Pflaster könnte bald das gute, alte Fieberthermometer ablösen. // Wer genau hinschaut, entdeckt auf Zahnpastatuben kleine, aufgedruckte Quadrate. Liefern deren Farben etwa Hinweise auf die chemische Zusammensetzung der Zahnpasta  - oder sind es Zeichen einer fremden Macht? Wir lösen das Rätsel auf. // P.M. Wissen" erklärt Phänomene des Alltags, schaut in Labore und Werkstätten und zeigt, wo und wie die Zukunft entsteht. Gemeinsam mit Astro-Physiker Gernot Grömer begibt sich das Team von "P.M. Wissen" jede Woche auf eine Reise zu Ideen, die vor kurzem noch Science-Fiction waren.Österreich 2023'
