  title: Überirdisch
  subtitle: Die Welt aus der Luft
  widescreen: true
  hd: true
  description: Unsere Erde ist geprägt von einzigartigen, faszinierenden Landschaften, doch bleiben große Teile davon unzugänglich und verborgen. Erst der Blick aus der Vogelperspektive ermöglicht es, riesige Gebirgsketten, unbesiedelte Wälder oder endlose Wüsten nicht nur im großen Überblick zu erfassen, sondern ausgewählte Regionen auch verblüffend genau zu betrachten. Mal aus unglaublicher Nähe, mal aus großer Entfernung und mit enormem Weitblick eröffnen sich spektakuläre Ansichten.
- eventId:
  - 1166701
  - 959156
  start: 2026-10-14T17:15:00Z
  stop: 2026-10-14T18:00:00Z
  title: Island von oben
  widescreen: true
  hd: true
  description: 'Island: eine Insel knapp unterhalb des Polarkreises. Gewaltige Naturkräfte, imposante Wasserfälle, feuerspeiende Vulkane und schier endlose Gletscher ein Land aus Feuer und Eis. Der Inselstaat blickt auf eine lange Geschichte zurück, geprägt von mutigen Siedlern und extremen Naturbedingungen. Die Mythologie spielt in Island eine wichtige Rolle. Gleichwohl zeigt sich die Insel zukunftsorientiert und setzt schon lange auf erneuerbare Energien. Aus der Luft betrachtet, präsentieren sich Naturräume, Städte und Kulturdenkmäler in ihrer ganzen Schönheit.'
