  title: Petra Kelly
  subtitle: Act Now!
  widescreen: true
  hd: true
  description: 'Sie war die Ikone der deutschen Friedens- und Umweltbewegung: Petra Kelly glaubte daran, dass ein einzelner Mensch die Welt verändern kann. In den 1980-er Jahren brachte sie hunderttausende Menschen gegen Atomkraft und Atomraketen auf die Straße. Die radikale Pazifistin, Menschenrechtsaktivistin und Feministin war eine Ausnahmeerscheinung. Ihr Leben war ein großer Wurf, ihr Ende eine Tragödie. Petra Kelly: Kämpferin gegen Atomkraft, Gründungsmitglied der Grünen, Ikone der Friedensbewegung. Unbeirrbar forderte sie die radikale Transformation der Gesellschaft, eine blockfreie Welt ohne Waffen und den Frieden mit der Natur.'
- eventId:
  - 1166772
  - 959141
  start: 2026-10-14T01:45:00Z
  stop: 2026-10-14T02:15:00Z
  title: Protest! Songs! Frieden
  widescreen: true
  hd: true
  description: 'Kriegsangst und die Sehnsucht nach Frieden: Beides prägt viele große Protestsongs der letzten 100 Jahre. Und so manch ikonischer Song von einst ist aktueller denn je. Welche Kraft haben die großen Friedenshymnen von Joan Baez, Bob Dylan, John Lennon und Yoko Ono heute noch? Und findet sich die Zeitenwende auch in der neueren Musik wieder? Im Schützengraben sind wir alle Bros, rappen die Berliner Jungs von K.I.Z in ihrem 2024er-Song Frieden in gewohnt ironischer Manier. Sind die Friedenshymnen von einst für Musiker heute noch Inspiration?'
