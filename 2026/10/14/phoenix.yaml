  title: Inseln im Nordmeer
  subtitle: Die Vesterålen
  widescreen: true
  hd: true
  description: 'Die Inselgruppe der Vesterålen liegt 300 km nördlich des Polarkreises vor der norwegischen Küste. Ihre Berge, Strände und Hochmoore bilden eine Landschaft, die den extremen Bedingungen des Nordens ausgesetzt ist: Monatelange Dunkelheit im Winter und die Mitternachtssonne im Sommer machen jede Jahreszeit zu etwas ganz Besonderem. Menschen und Tiere müssen sich der Witterung anpassen: Rentiere sind perfekt auf das raue Inselklima vorbereitet, Elche streifen über die weiten Hochebenen, Pottwale tauchen vor der Küste und Seeadler finden im Vestfjord reiche Beute.'
- eventId:
  - 1166722
  - 959159
  start: 2026-10-14T19:00:00Z
  stop: 2026-10-14T19:45:00Z
  title: Inseln im Nordmeer
  subtitle: Die Lofoten
  widescreen: true
  hd: true
  description: |-
    In direkter Nachbarschaft zu den Vesteralen liegt die Region Lofoten vor der Küste Norwegens. Die Kraft der Natur, das extreme Wetter und die vielen Kontraste aus Klippen, Fjorden und Stränden prägen diese Welt. Nach dem langen dunklen Winter scheint im Sommer die Mitternachtssonne rund um die Uhr - und aktiviert das Leben der Tiere, Pflanzen und Menschen.

    Eine schroffe Inselwelt ragt vor der Küste Norwegens aus dem Polarmeer - die Lofoten. Die Kraft der Natur, das extreme Wetter und die vielen Kontraste aus Klippen, Fjorden und Stränden prägen das Leben hier.
