  title: 'Unsere wilde Schweiz: Das Vanil Noir'
  subtitle: Film von Anja Glücklich
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Nahe der Heimat des berühmten Gruyère-Käses thront das Juwel der Voralpen: das Vanil Noir. Der Gipfel zählt nicht zu den höchsten Bergen der Schweiz, besticht aber durch die wilde Schönheit.

    Mit seiner außergewöhnlich vielfältigen Flora und der reichhaltigen Fauna formt der 2389 Meter hohe Gipfel an der Grenze zwischen den Kantonen Freiburg und Waadt das Herz eines Naturschutzgebietes - ein Geheimtipp für Wanderer und Naturliebhaber.
    HD-Produktion
