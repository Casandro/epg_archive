  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Wenn uns das Gesetz weder rechtfertigen noch heiligen kann und wir dem Gesetz sogar gestorben sind - welchen Wert hat es dann noch?", fragt Christian Wegert. Ausgehend vom Römerbrief beleuchtet er logisch und verständlich Sinn und Bedeutung der Zehn Gebote und des Gesetzes. Dabei erklärt er, warum das Gesetz uns nicht vor Gott gerecht macht - und worauf unsere Rechtfertigung stattdessen gründet.'
