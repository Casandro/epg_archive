  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sie wollte sich einen gemütlichen Abend zu Hause machen, als um sie herum plötzlich alles schwarz wurde. Das Herz von Maria Lonsdorfer blieb stehen, sie verlor das Bewusstsein. Nicht viele Patienten überleben einen solchen Notfall. Doch Maria Lonsdorfer hatte Glück. Ihre Nachbarn leisteten sofort Erste Hilfe. Warum bei einem Notfall jede Sekunde zählt - aber dennoch viele Menschen mit Erster Hilfe zögern. Und: Welche Auswirkungen kann eine Wiederbelebung auf das Leben haben? Darüber spricht Juliane Eberwein mit den Gästen Dr. Robert Wunderlich und Maria Lonsdorfer.'
