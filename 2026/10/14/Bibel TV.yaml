  title: 'Studio A: Wissenschaft und die Frage nach Gott'
  subtitle: Woher kommt Leben?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND In dieser spannenden Talk-Sendung spricht der Biologe, Prof. Siegfried Scherer, über den Ursprung allen Lebens. Er erklärt, wie ihn gerade seine naturwissenschaftliche Forschung zum christlichen Glauben geführt hat - und warum für ihn Glaube und Wissenschaft kein Widerspruch sind. Ein tiefgründiges Gespräch über das Leben, die Wissenschaft und die großen Fragen der Menschheit.'
