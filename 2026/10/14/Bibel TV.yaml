  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND In einer Nacht im November 2011 wäre Henok Worku fast an einer Speiseröhrenentzündung gestorben. Da hörte er Gottes Stimme mit einer klaren Berufung. Am nächsten Morgen war er vollständig geheilt. Henok Worku war auf eine Weise dennoch "jung gestorben". Im Gespräch mit Moderator Daniel Deman erklärt der Missionar und Autor, was es bedeutet, wenn Gott "Ich will Dich!" sagt und warum auch wir "jung sterben" sollten.'
