  title: Superfromm
  subtitle: Es bricht nicht langsam. Es bricht auf einmal.(2/3)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Ehe scheitert, sie steht mit fünf Kindern allein da - ohne Geld, ohne Perspektive, ohne zu wissen, wie es weitergehen soll. Und dann wird auch noch ihre kleine Tochter schwer krank. Tumor im Kopf. Operation, Koma, Beatmung, Klinik. Ein Ausnahmezustand, der kein Ende kennt. Grace muss funktionieren, obwohl sie längst am Limit ist. In dieser Folge erzählt sie von einer Not, die kaum auszuhalten ist - und von einem Gott, der bleibt, wenn alles andere zerbricht. Teil 2 von 3.'
