  title: ARD Konzert
  description: |-
    <a name="_Hlk176260359">Claudio Monteverdis Marienvesper markiert den Übergang von der Renaissance zum Barock und zeigt ihn als Wegbereiter einer neuen, expressiven Musiksprache. Zwischen schlichter Psalmenrezitation, virtuosen Soli und prachtvoller Mehrchörigkeit entfaltet sich geistliche Musik, die oft wie Bühnendrama wirkt - nicht umsonst gilt Monteverdi vielen als Erfinder der Oper. Zum 70. Geburtstag der Musica Antiqua-Reihe des Bayerischen Rundfunks macht die Capella de la Torre daraus ein barockes Fest.</a>
    <strong>Claudio Monteverdi</strong><br/>Vespro della beata vergine
    <strong>Capella de la Torre</strong><br/>Leitung: <strong>Katharina Bäuml</strong>
    Aufnahme vom 16. September 2026 im Aufseßsaal der Germanischen Nationalmuseums Nürnberg
