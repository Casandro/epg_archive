  title: SWR Kultur - Das Wissen
  subtitle: Wer arm ist, stirbt früher - Wege aus dem ungleichen Gesundheitsrisiko
  description: |-
    Von Sonja Ernst
    Armut macht nicht nur krank, sondern verkürzt auch die Lebenserwartung. Bei Frauen in Deutschland um rund vier Jahre, bei Männern um etwa sieben. Fitness und ausgewogene Ernährung können sich nicht alle leisten: Armut bedingt oft ein riskanteres Gesundheitsverhalten, auch weil Wissen fehlt und wenig Geld meist Stress bedeutet. Prävention wiederum hilft oft den Besserverdienenden. Die Politik lehnt bislang eine Zuckersteuer ab. Zugleich möchte sie die Gesundheitskompetenz fördern. So sollen Gesundheitslotsen helfen, gesünder zu leben. In einzelnen Stadtvierteln gibt es bereits Gesundheitszentren für ärmere Menschen, getragen durch Vereine. (SWR 2025)
