  description: |-
    14:00
    SWR Kultur Das Wissen
    Magersucht therapieren - Wie wichtig Familie, Darm und Körperbilder sind
    Zu Hause wohnen, anstatt stationär behandelt zu werden. Die Körperwahrnehmung durch Einsatz von VR-Brillen verändern. Gene und Darm berücksichtigen. Es tut sich viel in der Magersucht-Therapie.
    Von Elisa Buhrke (SWR 2026)
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/

    14:30
    SWR1 Leute mit Ernährungsexpertin Dr. Heike Niemeier: Abnehmspritze und Abnehmpille? Ja, aber richtig!
    Sie gelten als mögliche "Gamechanger" im Kampf gegen Übergewicht - Dr. Heike Niemeier bewertet Chancen und Risiken von Abnehmspritze und Abnehmpille.
