  subtitle: Dans l'ouest de l'Inde, des amphibiens ont trouvé un véritable paradis. Ils y développent d'étonnantes stratégies d'adaptation face aux dangers qui pèsent sur leur habitat.
  genre:
  - '146'
  description: 'Les forêts luxuriantes du Kerala et du Karnataka, le long de la chaîne des Ghâts occidentaux, abritent une étonnante diversité de grenouilles, dont beaucoup ne vivent qu''ici. Dans ces massifs, les amphibiens profitent de la chaleur, des pluies et de la profusion de ruisseaux pour se reproduire et chasser. La nuit, leurs chants forment une véritable bande-son de la forêt, mêlant coassements graves et trilles plus aigües qui résonnent entre les troncs détrempés. Le naturaliste et cinéaste Suhas Premkumar a bravé la mousson pendant neuf saisons pour nous révéler ce monde inconnu, mettant en lumière ces créatures énigmatiques parmi lesquelles la grenouille planante de Malabar, la grenouille jaune, la grenouille à main, la grenouille-taureau indienne, le crapaud arboricole de Malabar, la grenouille d''Amboli, la grenouille nocturne de Kumbara, la grenouille nocturne de Jog, les rainettes occidentales, les grenouilles à dos doré, les grenouilles danseuses, le crapaud indien commun, la petite rainette grillon et la grenouille à bouche étroite. Réalisateur: Suhas Premkumar (2025)'
- eventId: 768048
  start: 2026-10-14T14:41:01Z
  stop: 2026-10-14T15:24:57Z
  title: Inde - Le monde merveilleux des grenouilles
