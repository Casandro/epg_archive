  title: Погнали!
  description: Мир автомобилей и средств передвижения. Новое мышление и технологии меняют наши авто, наши города, наш образ жизни. Тесты автомобилей и климатически безопасные технологии, необычные идеи и видение будущего - "Погнали!" держит руку на пульсе и следит за развитием событий.
- eventId: 703962
  start: 2026-10-14T11:00:00Z
