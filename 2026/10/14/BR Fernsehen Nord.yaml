  title: Abenteuer Wildnis
  subtitle: Tierische Heimkehrer - Zurück in der Natur
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sie waren schon weg, jetzt kehren sie zurück: Luchse, Europäische Nerze, Sumpfschildkröten und Ziesel. Durch den Einsatz engagierter Tierschützer werden sie wieder in Deutschland heimisch. Die Dokumentation begleitet vier Wiederansiedlungsprojekte am Steinhuder Meer, in den Rheinauen, im Osterzgebirge und im Pfälzer Wald. Für die Tiere, die ihren alten Lebensraum zurückerobern, ist es ein langer und gefährlicher Weg. Einmal in der Natur, sind die tierischen Heimkehrer kaum noch zu sehen. Das Drehteam spürt ihnen mit modernsten Kamerafallen nach und zeigt dramatische Rückschläge und ermutigende Erfolge.'
