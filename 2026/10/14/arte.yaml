  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Brasilien, Rio de Janeiro
  genre:
  - '144'
  description: Nachdem der Katamaran "Nomade des Mers" die Küste Brasiliens entlanggesegelt ist, legt die Besatzung einen kurzen Halt in Rio de Janeiro ein. Die Stadt ist bekannt für Copacabana und Zuckerhut, aber auch für ihre Favelas. Über Missstände bei der Müllentsorgung wird dagegen wenig gesprochen. Wie aber soll man der Unmengen an Plastik Herr werden, die täglich an einem der schönsten Strände der Welt landen? Der Designer Bruno Temer zeigt Corentin seine selbst erfundene Maschine, mit der er Plastikmüll in Souvenirs verwandelt. Aus lästigem Abfall entstehen so kleine Figuren.
