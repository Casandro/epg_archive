- eventId: 1166793
  start: 2026-10-14T03:00:00Z
  stop: 2026-10-14T03:55:00Z
  title: 'Globalisierung der Natur: Invasive Arten'
  subtitle: Fluch oder Segen?
  subtitled: true
  description: Mit dem Menschen, der mehr und mehr in andere Regionen einreiste, siedelten auch viele Pflanzen und Tiere um. Manche Arten haben die Fähigkeit auch in ihnen fremden Lebensräumen zu überleben und sich zu vermehren. Doch können die gebietsfremden Tiere und Pflanzen auch ein Segen für die verschiedenen Regionen sein? Oder muss die Verbreitung dieser Arten gestoppt werden?
- eventId: 1166794
