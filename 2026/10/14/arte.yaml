  title: Reichsbürger - Innenansichten einer extremistischen Bewegung
  subtitle: Deutschland 2023
  subtitled: true
  description: Sie bekämpfen den Staat, möchten alte Reiche neu entstehen lassen oder fordern Autonomie. Reichsbürger sind eine stark wachsende, verfassungsfeindliche Bewegung mit Schwerpunkt in Deutschland. ARTE dokumentiert ihre Organisationsform und Aktivitäten. Sie gründen eigene Betriebe und machen sich auf, Gegengesellschaften zu etablieren, in denen eigene Gesetze gelten.
