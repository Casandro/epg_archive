  title: In aller Freundschaft - Die jungen Ärzte (268)
  subtitle: Kampfgeist
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Assistenzärztin Rebecca Krieger trifft im Johannes-Thal-Klinikum überraschend auf ihren ehemaligen Oberarzt Dr. Carl Fischer. Sie hat ausgesprochen schlechte Erinnerungen an die Zusammenarbeit mit ihm. Dr. Fischer sucht Dr. Marc Lindner auf, um eine Zweitmeinung zu einem Krebspatienten einzuholen. Die Chancen für den Patienten sind nicht gut, wie das Ärzteteam feststellt. Was Rebecca zunächst nicht weiß: Es handelt sich bei diesem neuen Fall um niemand anderen als Dr. Fischer persönlich. Kann sie ihr Zerwürfnis beiseitelegen und ihn behandeln? Und vor allem: Lässt Carl Fischer es zu?'
