  title: Rund um den Globus - Basketball - Deysis großer Traum
  subtitle: Rund um den Globus - Basketball - Deysis großer Traum
  description: Die Kinder aus den Bergen von Oaxaca, einer der ärmsten Regionen Mexikos, zählen zu den besten Nachwuchs-Basketballern des Landes. Die 13-jährige Deysi ist eines der größten Talente. Gemeinsam mit ihren Mitspielern tritt sie bei einem großen Turnier an. Gewinnt das Team, darf es sich sogar mit Mannschaften in den USA messen. Das will Deysi unbedingt schaffen - denn in den USA lebt ihr Vater als Tagelöhner.  DE 2011
