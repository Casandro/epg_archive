  title: Planet Weltweit - Schwerelos im Windkanal
  subtitle: Planet Weltweit - Schwerelos im Windkanal
  description: 'Planet Weltweit: Der Traum vom Fliegen - im größten Indoor-Windtunnel Europas bei Mailand wird er Realität. Freifallsimulatoren wurden ursprünglich für die Luft- und Raumfahrt entwickelt. Inzwischen sind sie Freizeitspaß und dazu eine spektakuläre Bühne für Leistungssportler wie Laurie Lubbe. Sie ist Freestylerin und trainiert gerade hart für die französischen Meisterschaften. Fliegen ist viel mehr als nur ein Teil meines Lebens. Es gehört zu mir, bedingungslos. Alle Tränen und alle Stürze haben sich gelohnt. Ich fliege, weil es für mich wie Atmen ist. Die 25-jährige Laurie Lubbe gehört zur französischen Nationalmannschaft. Die Athletin und Trainerin fliegt im Windkanal in der künstlerischen Disziplin Freestyle. Die Herausforderung liegt darin, in einem Luftstrom von 200 Stundenkilometern den eigenen Körper zu kontrollieren. Die kleinste Bewegung hat enorme Folgen - eine Bewegung der Hände zum Beispiel kann eine plötzliche Drehung bewirken, für das Auf- und Absteigen reicht es, den Oberkörper zu strecken oder zu entspannen. Enorm viel Erfahrung und Training braucht es erst recht dann, wenn es um ganze Choreografien geht. Der Windtunnel wird überwiegend von Fallschirmspringern genutzt, sie trainieren hier Übungen, die sie sonst am freien Himmel machen. Laurie ist eine Ausnahmeathletin - nicht nur, weil sie eine der wenigen Frauen in diesem Sport ist. Ihre Anmut und Eleganz beim Flug soll nun auch die Preisrichter der französischen Meisterschaften in Lyon überzeugen.  DE 2021'
- eventId: 695993
  start: 2026-10-14T21:15:00Z
