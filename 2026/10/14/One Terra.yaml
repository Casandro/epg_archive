  title: Planet Weltweit - Gnadenhof "Gut Aiderbichl"
  subtitle: Planet Weltweit - Gnadenhof "Gut Aiderbichl"
  description: Sie müssen 50 Liter Milch am Tag produzieren, Preise im Turnierreiten gewinnen oder möglichst schnell Fleisch ansetzen. Erfüllen sie ihr Soll nicht, werden Nutztiere "aussortiert". Anders weiter leben dürfen 5.600 Tiere auf den Gnadenhöfen der Organisation "Gut Aiderbichl" in Österreich, Deutschland, Frankreich und der Schweiz. Der ehemalige Schauspieler Michael Aufhauser wollte dem Leid und dem Elend ungewollter Haus- und Nutztiere nicht mehr länger zusehen und gründete 2001 den ersten Gnadenhof "Gut Aiderbichl", heute ein Unternehmen mit 25 Höfen. Weitere sollen hinzukommen, denn es gibt zu viele dringende Anfragen neue Tiere aufzunehmen. Vom einzelnen Huhn, das auf schnelles Schlachtgewicht gezüchtet wurde und nicht mehr laufen kann, bis zu ganzen Rinderherden. Eine logistische Herausforderung, der sich das Non-Profit-Unternehmen täglich stellt. GEO Reportage hat es besucht. Der Mutterkuh ist die Kette, die sie ein Leben lang im feuchten Stall hält, bereits ins Fleisch gewachsen. Das Stroh ist durchweicht und wurde seit Wochen nicht mehr gewechselt, durchaus kein Einzelschicksal. Steigende Tierschutzanforderungen, sinkende Milchpreise, Konkurrenzdruck, über ein Drittel der deutschen Bauernhöfe mussten in den letzten 15 Jahren Konkurs anmelden. So ist das Schicksal von Mensch und Tier enger miteinander verknüpft, als mancher Tierfreund es wahrhaben möchte. Michael Aufhauser hat das erkannt und sucht mit seinem Unternehmen "Gut Aiderbichl" nach Lösungen, die Menschen und Tieren gleichermaßen zugutekommen. Neben der Aufnahme verwahrloster, alter und kranker Tiere übernimmt seine Organisation ganze Höfe, richtet sie her und ermöglichst Besitzern und Bewohnern ein respektables Leben. Voraussetzung ist, dass die Tiere von jedem Leistungsdruck befreit werden und ihr Leben bis zum natürlichen Ende führen können. DE 2014
