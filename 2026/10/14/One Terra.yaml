  stop: 2026-10-14T07:02:00Z
  title: Planet Weltweit - Harpyien, die größten Greifvögel des Regenwaldes
  subtitle: Planet Weltweit - Harpyien, die größten Greifvögel des Regenwaldes
  description: Bei den Ureinwohnern Südamerikas genossen die Harpyien einen besonderen Ruf, wurden gleichermaßen verehrt wir gefürchtet. Kein Wunder, sind sie doch die größten Greifvögel des Regenwaldes und erlegen selbst große Affen und Faultiere. Mit ihrem mächtigen Klauen, die etwa die Kraft einer Bärentatze haben, gehören sie dazu zu den stärksten Vögeln der Welt. Heute steht es schlecht um die Harpyie. Die zunehmende Rodung des Regenwaldes und ein langsamer Fortpflanzungszyklus verdrängen die Vögel aus ihren angestammten Revieren. Forscher und Naturschützer möchten gern helfen, wissen aber kaum etwas über den scheuen und seltenen Vogel. Beobachtungskameras sollen helfen, Informationen über die Harpyien zu sammeln. Dafür müssen jedoch erst einmal passende Nester gefunden werden. Um hier voranzukommen, will ein Forscherteam aus Wissenschaftlern, Architekten und Umweltschützern im Süden Perus, in der Region La Madre de Dios ein künstliches Nest bauen, das mit weiteren Beobachtungskameras ausgestattet wird. Kein leichtes Unterfangen, denn Harpyien sind sehr wählerisch bei der Auswahl ihres Nistplatzes. Nicht nur, dass das Nest mindestens sieben Kilometer vom nächsten Nachbarn entfernt sein muss. Sie brütet ausschließlich in den Kronen der riesigen brasilianischen Kastanie, auch Paranusbaum genannt, oder der Shihuahuaco-Bäume. Nur von diesen Giganten, die bis zu 40 Meter hochreichen und weit über das Blätterdach des Waldes hinausreichen, haben sie einen guten Überblick. Die Arbeit des Teams muss also in schwindelerregender Höhe stattfinden.  DE 2011
- eventId: 695944
  start: 2026-10-14T07:10:00Z
