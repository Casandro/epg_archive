  title: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  subtitle: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  description: 'Die Strände der Kapverdischen Inseln zählen zu den wichtigsten Nistplätzen für Meeresschildkröten weltweit. Tausende Weibchen legen hier jedes Jahr ihre Eier ab, aus denen Millionen von Schildkrötenbabys schlüpfen. Brutale Wilderei gefährdet dieses Idyll. Zwei extra in der Schweiz ausgebildete Spürhunde sollen helfen, den Wilderern jetzt das Handwerk zu legen. GEO Reportage war bei der Ankunft der beiden Labradore Kelo und Karetta auf den Kapverden dabei. Die zweijährigen Hundegeschwister verdanken ihre Namen Kelo und Karetta den wissenschaftlichen Bezeichnungen der Unechten Karettschildkröte und der Grünen Meeresschildkröte Chelodina. Marlene Zähner hat sie in der Schweiz ausgebildet. Nun sollen sie auf den Kapverden Wilderer überführen. Ivan und Valdir, zwei Kapverdier und Mitglieder der Schutzorganisation "Turtle Foundation" werden sie übernehmen, die Befehle von Marlene erlernen und auf dem Archipel weiter mit ihnen arbeiten. Die Jagd Einheimischer auf die Schildkröte ist eine brutal: Um an das Fleisch zu kommen, schlitzen sie die Tiere bei lebendigem Leib auf. Seit ca. einem Jahr fliegt auch ein Drohnenteam der Organisation nachts die Niststrände mit Infrarotdrohnen ab, um die Wilderer in flagranti zu erwischen. Mit beeindruckendem Erfolg, die Fälle von Wilderei gingen massiv zurück. Doch fassen konnte man die Täter nicht. Das sollen nun die beiden Hunde übernehmen. Sie sollen die Täter am Geruch der am Strand zurückgelassenen Werkzeuge und Gegenstände überführen. Wie werden Kelo und Karetta die ersten Wochen auf den Kapverden meistern? Kommen sie mit ihren neuen Hundeführer klar und werden es in diesem Jahr genügend Babyschildkröten schaffen, das Meer zu erreichen? DE 2019'
