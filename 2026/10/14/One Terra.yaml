  title: Planet Weltweit - Das Elsass, Heimat der Störche
  subtitle: Planet Weltweit - Das Elsass, Heimat der Störche
  description: Der Storch ist im Elsass allgegenwärtig, für viele die Ikone, das Wahrzeichen der Region. Ob in der Metropole Straßburg oder den romantischen Dörfern, überall hocken die schwarz-weiß gefiederten Vögel im Frühjahr in ihren Nestern, brüten, klappern mit den Schnäbeln und versorgen ihren Nachwuchs. Dabei kehrten vor wenigen Jahrzehnten kaum noch Störche aus ihren Winterquartieren im Süden zurück ins Elsass. Erst ein umfassendes Rettungsprogramm brachte die Klappervögel wieder in die Region. Heute gilt die Population nicht nur als stabil, einige Tiere verlassen inzwischen selbst nach der Brutzeit das Elsass gar nicht mehr, sie sind heimisch geworden. Hat der Mensch den Bogen überspannt? Denn es gibt immer mehr Elsässer, die die Zahl der kraftvollen Zugvögel als zu hoch empfinden. Bis Mitte der 1970er-Jahre war die Population der Weißstörche auf neun Brutpaare zurückgegangen. Im Südelsass gab es nur noch ein einziges Storchenpaar. Viele Tiere verendeten an Starkstromleitungen. Mehrere Jahre mit viel Nässe und kalten Frühjahrstagen setzten besonders den Jungstörchen zu. Gérard Wey gilt als einer der Initiatoren des darauf folgenden Wiederansiedlungsprogramms. Bis heute nennen ihn manche den "Storchen-Papa". Überall in der Region hat er an Lösungen mitgearbeitet, etwa zwanzig Zuchtstationen wurden aufgebaut, bestückt mit Störchen aus anderen Ländern, darunter fast 200 aus dem Maghreb. Sie sollten eine ganz neue Elsass-Population bilden, die sich über Jahre fest ansiedelt. Nach drei Jahrzehnten intensiver Arbeit für den Weißstorch fühlt sich das Tier heute wieder wohl im Elsass. Die Straßburger Orangerie mit unzähligen Nestern ist eines der bekanntesten Beispiele für die erfolgreiche Rettung der Spezies. Manch einem aber sind es inzwischen schon zu viele Störche. Die Wiederansiedlung bleibt in der Region umstritten.  DE 2020
