  title: Planet Weltweit - Vietnam, das Schicksal der Mondbären
  subtitle: Planet Weltweit - Vietnam, das Schicksal der Mondbären
  description: |-
    Mondbär wird der bedrohte Kragenbär wegen seiner hellen Fellsichel mitten auf der Brust genannt. Die Galle dieser Bären ist in der traditionellen asiatischen Medizin ein beliebtes Heilmittel. So wurden in Vietnam viele Bären gefangen und über Jahre in enge Käfige gepfercht, wo ihnen unter Qualen der Körpersaft entnommen wurde. Nun sollen diese sogenannten Bärenfarmen geschlossen werden.
    In Asien erfreuen sich Heilmittel, gewonnen aus Körperteilen wilder Tiere, nach wie vor großer Beliebtheit. Viele Wirkstoffe finden sich zwar nachweislich auch in pflanzlichen Substanzen, aber diese Erkenntnis setzt sich erst sehr langsam durch. So findet Bärengalle, die den Tieren auf sogenannten Bärenfarmen qualvoll abgezapft wird, weiterhin reißenden Absatz. Die Tierschutzorganisation Animals Asia versucht seit Jahren diese Farmen zu schließen. Inzwischen wird sie dabei sogar von der Regierung unterstützt. Diese Reportage hat sie bei der Rettung eines Kragenbären begleitet.
    Zehn Jahre lebte die Bärin Chau in einem engen Käfig auf dem Gelände einer Baustofffirma. Ihr Besitzer, ein reicher Geschäftsmann, hielt das Tier aus Prestigegründen und um der Bärin die Galle abzuzapfen - bis vor wenigen Jahren ein völlig legitimes Vorgehen. Bärengalle gilt als beliebte Medizin, mit der man Verdauungsstörungen und andere Beschwerden lindern kann. Dass dem Tier damit unvorstellbare Qualen zugefügt wurden, interessierte niemanden. Chaus Schicksal soll nun ein Ende haben. Die Tierschutzorganisation Animals Asia befreit sie aus ihrem Käfig, um ihr in einer ihrer Auffangstationen ein artgerechtes Leben zu ermöglichen -  soweit das dem traumatisierten und verhaltensauffälligen Tier noch möglich ist. Inzwischen ist das Halten der Bären zur Galle - Gewinnung verboten, als sogenannte Haustiere fristen bis heute aber immer noch über 1200 Bären in Käfigen ihr Dasein. Animals Asia, einst gegründet von der Engländerin Jill Robinson, arbeitet daran, auch diese Tiere von ihrem Schicksal zu erlösen. DE 2016
  ageRating: 6
