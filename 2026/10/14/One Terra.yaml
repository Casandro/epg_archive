  title: Planet Weltweit - Vietnam, die letzten Pangoline
  subtitle: Planet Weltweit - Vietnam, die letzten Pangoline
  description: Kaum ein Säugetier wird weltweit so häufig gewildert wie das Pangolin, es ist akut vom Aussterben bedroht. Zum einen wegen der verstärkten Nachfrage in Restaurants nach Pangolinfleisch, zum anderen durch die Verwendung der Schuppen in der traditionellen chinesischen Medizin. GEO Reportage hat ein Schutzzentren in Vietnam besucht, in dem beschlagnahmte Tiere mit großem Aufwand auf ihre Auswilderung vorbereitet werden. Um das Schuppentier, Pangolin, steht es schlecht. Mit diesem Säugetier wird weltweit illegaler Handel getrieben. Das Geschäft ist lukrativ, die Gewinnspanne enorm. Ihren Schuppen, die so wie unsere Fingernägel aus Keratin bestehen, werden Heilkräfte nachgesagt. Sie sollen den Milchfluß stillender Mütter stimulieren, Asthma und Schuppenflechte heilen. Das Fleisch gilt für viele Asiaten als Delikatesse und der Verzehr als Statussymbol. Pangoline haben nichts, was den Beschützerinstinkt im Menschen weckt - keine großen Augen und auch kein kuscheliges Fell. Sie lassen sich schwer züchten und sterben schnell in Gefangenschaft. Kaum jemand kennt sie, kaum jemand schützt sie. Seit Ende der 1990er Jahre ist in Vietnam zwar die Jagd auf die Tiere verboten, gewildert werden sie trotzdem. Allein in den letzten zehn Jahren wurden weltweit über eine Million Pangoline illegal gehandelt. Lange Zeit wussten die vietnamesischen Behörden nicht, wie sie mit konfiszierten Tieren, von denen die meisten krank und geschwächt sind, umgehen sollten. Das Rettungszentrum im Cuc Phuong Nationalpark, 140 Kilometer südwestlich von Hanoi, entstand aus dieser Notlage. 20 Mitarbeiter arbeiten heute hier, nehmen beschlagnahmte Tiere auf und pflegen sie gesund. Der Tierarzt Lam Kim Hai gehört zu ihnen. Seine Arbeit im Zentrum ist ein Vollzeitjob. Ständig kommen neue Tiere hinzu. Nun endlich sollen 25 von ihnen ausgewildert werden. Ein großer Moment für das Zentrum und Lam Kim Hai. Und eine kleine Chance für das Pangolin, dass die Art vielleicht doch überlebt. DE 2017
  ageRating: 6
- eventId: 695964
  start: 2026-10-14T08:10:00Z
  stop: 2026-10-14T09:02:00Z
  title: Planet Weltweit - Virunga, Kampf für die Berggorillas
  subtitle: Planet Weltweit - Virunga, Kampf für die Berggorillas
  description: Ein Nationalpark im Ostkongo, in einer der krisenreichsten Regionen der Erde, wo fünfhundert Berggorillas mehr Aufmerksamkeit erfahren als die Menschen, die in seinem Umfeld leben? Das weckt Neid und Begehrlichkeiten und auch Gewalt. Die Verteidigung des Virunga Nationalparks und seiner Bewohner, der letzten Berggorillas auf der Welt, ist eine tägliche Herausforderung. GEO Reportage porträtiert Ranger, die täglich ihr Leben riskieren, und Menschen, die sich durch den Nationalpark um ihr Eigentum gebracht sehen. Nur noch knapp neunhundert Berggorillas gibt es weltweit, fünfhundert davon im Virunga Nationalpark im Osten des Kongos, an der Grenze zu Ruanda. In der von immer­währenden Spannungen belasteten Region besteht für die Verteidiger des Nationalparks ständig Lebensgefahr. Über 170 Ranger fielen in den letzten zwanzig Jahren im Kampf gegen Wilderer und Rebellen. Kurz nach den Dreharbeiten starben bei Angriffen sieben Ranger, darunter eine Frau. Der Nationalpark ist derzeit für Touristen gesperrt. Christian Shamavu ist einer der erfahrensten Ranger im Nationalpark, motiviert durch seine Liebe zu Tieren. "Ich war erst 15, als ich zum ersten Mal einen Gorilla gesehen habe. Ich war beeindruckt, sie sind so menschen­ähnlich. Menschen aus aller Welt kamen, um diese Tiere zu sehen. Das hat mich so begeistert, dass ich die Tiere beschützen wollte." Christians Arbeit ist ein Einsatz zwischen Leben und Tod. Denn die Bauern rund um den Park können die Fürsorge für den Park und seine Bewohner nur schwer nach­voll­ziehen. Sie erheben Anspruch auf den Park, liefert er ihnen doch das überlebens­wichtige Holz, das sie zur Herstellung von Holzkohle benötigen. Seit das Wildern und Abholzen verfolgt wird, kommt es immer wieder zu blutigen Auseinandersetzungen zwischen Rangern und Banditen, die die Konflikte brutal für ihre Zwecke nutzen. Wird es gelingen, den Nationalpark und seine Berggorillas dauerhaft zu sichern? DE 2011
- eventId: 695965
  start: 2026-10-14T09:10:00Z
  stop: 2026-10-14T10:02:00Z
  title: Planet Weltweit - Huskies am Start!
  subtitle: Planet Weltweit - Huskies am Start!
  description: Die 37jährige Norwegerin Marit Beate Kasin träumt seit ihrer Kindheit davon, Huskies zu züchten und an großen Hundeschlittenrennen teilzunehmen. Mit Mitte 20 gründete sie ihre Hundezucht "Winterdans" (Wintertanz). Fünfmal schon nahm sie am "Finnmarksløpet" in Norwegen teil, dem längsten und härtesten Rennen Europas. Zweimal wurde sie bereits Zweite, jetzt tritt sie mit einem neuen Hundeteam an. Das Rennen geht über 1.200 km quer durch die Finnmark, von Alta über Kautokeino nach Kirkenes und zurück. GEO Reportage war mit unterwegs. Mit dabei auf Marits Wegen ist seit 14 Jahren ihre Partnerin Susana, als gute Seele, Organisationstalent und beste Freundin. Die beiden haben sich auf der Uni in Bergen kennengelernt und Marit konnte die gebürtige Kolumbianerin für ihren Traum begeistern. Mit 14 Hunden und Marit als "Musher(in)", so nennt man die Hundeschlittenführer in der Fachsprache, treten sie jetzt beim nördlichsten Hundeschlittenrennen der Welt an, das zugleich das längste Europas ist. Marit kämpft sich mit ihren Alaskan Huskies über 12 Etappen durch Schnee und Eis, über Berge und zugefrorene Flüsse. Susana lenkt währenddessen mit Freunden den Begleittross aus Camper und Hundetrailer von Checkpoint zu Checkpoint, um mit frischem Material zur Stelle zu sein und verletzte oder erschöpfte Hunde in Empfang zu nehmen. Über die Gesundheit der Tiere wacht ein internationales Team von Tierärzten. Beim geringsten Anzeichen von Erschöpfung oder muskulären Problemen wird das Tier aus dem Rennen genommen. Tiere auswechseln ist verboten. Mit mindestens sechs der ursprünglich 14 Hunde müssen die Musher ins Ziel kommen, sonst droht die Disqualifikation. Wie weit werden es Marit und Susana bringen?   DE 2020
- eventId: 695966
