  title: Planet Weltweit - Die Sandmenschen von Schoina
  subtitle: Planet Weltweit - Die Sandmenschen von Schoina
  description: 'Die wenigen Menschen, die auf der Halbinsel Kanin, in der nordrussischen Tundra ausharren, müssen nicht nur den Elementen trotzen, sondern auch dem Sand, der wüstengleich vom Weißen Meer her über das Land zieht. Immer, wenn der Wind weht, verschwinden die Holzhäuser der kleinen Stadt Schoina ein Stück weiter unter den Dünen. Wer nicht zur Schaufel greift, dessen Haus versinkt. Es gab eine Zeit, da bot sich den Bürgern des kleinen Ortes Schoina eine rosige Zukunft: In den 1930er Jahren blühte hier die sowjetische Fischindustrie - zeitweise zählte Schoina über tausend Einwohner. Heute ist das Meer überfischt. Längst reichen die Vorkommen nicht einmal mehr für die Versorgung der verbliebenen 300 Menschen. Statt Tonnen von Fisch gibt es im heutigen Schoina nur noch Tonnen von Sand, der sich vom Wind getragen über die alten Schiffwracks, Häuser und Straßen des Dorfes legt. Der Staat interessiert sich schon lange nicht mehr für die frühere Vorzeigekolchose. Und die nächste Stadt ist 400 Kilometer entfernt. Schoina wäre schon lange im Sand verschwunden, gäbe es nicht doch noch ein paar Einwohner, die bereit sind, es mit dem Sand aufzunehmen. Einer von ihnen ist Alexej Schischelov, der Leuchtturmwärter. Seit 38 Jahren lebt er in Schoina, kam als Kind hierher, ist aber niemals wirklich angekommen. Schon oft wollte seine Familie aufgeben und wegziehen. Aber die Hoffnung, dass es wieder aufwärts gehen könnte, ließ Schischelov ausharren. Im Gegensatz zu ihm glaubt Nadja Korjakina fest daran, dass es für Schoina wieder bessere Zeiten geben wird. Zu sehr liebt sie die Eigenarten ihrer Heimat. Und wirklich scheint alle Hoffnung noch nicht verloren. Geologen haben in den Böden rund um Schoina Marmor entdeckt. Gesteinsproben werden zeigen, ob sich der Abbau lohnt. Gespannt warten Nadja Korjakina und Alexej Schischelov auf das Probenergebnis. Vielleicht gibt es sie ja doch noch: eine Zukunft für die Gemeinschaft der Versandeten. DE 2006'
- eventId: 695911
  start: 2026-10-14T01:15:00Z
