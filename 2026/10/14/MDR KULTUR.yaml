    * 07:50 Uhr - Vorschau Folk und Welt: Jack Johnson / Hermanos Gutierrez / Drink the water
    Es ist etwas still geworden um den Singer Songwriter Jack Johnson in den letzten Jahren. Der Grund ist einfach: er hat an einem Film gearbeitet und sich um seine Umwelt Projekte gekümmert. Im Juli hat Jack Johnson den Film jetzt herausgebracht. Es geht darin um seine Liebe zum Surfen, seine Musik und vor allem seine besten Freunde ohne nichts davon möglich gewesen wäre. "Surfilmusic" heißt der Film und dazu gibt es auch ganz wunderbare Musik: z.B. den Song Drink the water, den er mit den Brüdern Hermanos Guttierrez eingespielt hat: Mehr Kammerpop, Exotic Moods und KI heute in Folk und Welt hier in den ARD Late Nite Sounds von MDR Kultur Radio Bremen 2 und Bayern 2. Heute Abend mit Jay Rutledge.

    * 08:10 Uhr - Sachbuch der Woche: Didier Eribon "Foucault. Eine Biografie"
    Am 15. Oktober 1926 wurde in Frankreich der Philosoph Michel Foucault geboren. Seine Bücher tragen Titel wie: "Wahnsinn und Gesellschaft", "Die Ordnung der Dinge", "Der Gebrauch der Lüste" oder "Die Geständnisse des Fleisches".
    Mit diesen Büchern und neuen Methoden des philosophischen Denkens wurde Foucault seit den 1950er Jahren bis zu seinem Tod im Sommer 1984 zum intellektuellen Weltstar.
    Auf dem Wag da hin - zum Weltstar - ist Didier Eribon, erfolgreicher Sachbuchautor inzwischen, der 2011 eine Biografie über Foucault vorlegte, die nun neu und überarbeitet erschienen ist und von Hans Horst Henschen und Michael Bischoff ins Deutsche übersetzt wurde. Für uns gelesen von Jörg Schieke.
