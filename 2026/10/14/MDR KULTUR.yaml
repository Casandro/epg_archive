  description: "* 12:15 Uhr - Premiere Theater Freiberg/D. \nAuf dem Spielfilm  stehen Der Kaiser von Atlantis oder die Tod-Verweigerung & Der zerbrochene Krug. Musikkritiker Michael Ernst mit einem Urteil.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - Europas größte Felsenbrücke: Wie sicher ist das Prebischtor?\nEs ist die längste Felsenbrücke Europas: Das Prebischtor im Nationalpark Böhmische Schweiz. Die Felsformation liegt in Tschechien gleich hinter der deutschen Grenze. Rund 200.000 Touristen besuchen sie jedes Jahr. Nun wurde der Sandsteinbogen gründlich untersucht. Das Ziel ist, herauszubekommen, wie sicher und wie lange das Prebischtor noch steht. Denn das Wetter und die Touristen-Ströme der letzten Jahrzehnte haben Spuren hinterlassen. Marianne Allweiss hat sich das angesehen.\n\n* 13:15 Uhr - Wie der Zoo Leipzig zum Artenschutz in Chile beiträgt kurz\nMehr als 200.000 Besucher hat die neue Attraktion bereits in den ersten vier Wochen ich den Zoo Leipzig gelockt: Das Feuerland. Die neue Küsten- und Meereslandschaft für ist laut dem Zoo auch ein Beleg für ein über 20-jähriges Engagement beim Artenschutz weltweit. Konkret geht es um drei bedrohte Arten in drei unterschiedlichen Landschaften in Chile. Alea Rentmeister hat mit Artenschützern in Leipzig und Santiago de Chile gesprochen.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - Vorschau Folk und Welt: AO / Sofrimento \nAus Belgien mit Wurzeln in Portugal und Mozambique kommt die Band Ao - mit ihrem letzten Album Malandra konnte die Band gerade schon außerhalb Belgiens ein Ausrufezeichen setzen, jetzt legen sie ein neue Single nach - super einfühlsamer Pop gesungen überwiegend auf Portugiesisch.\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
