  title: Verschollene Fürstenstadt Zerbst-Dessau-Wörlitz (Folge 10 von 12)
  subtitle: Reise- und Kulturbilder / von Karl Emil Franzos
  description: "Von Karl Emil Franzos\n(Erstsendung)\n\n\"Nächst der Arbeit ist das Reisen der beste Erquicker und Sorgenbrecher auf Erden; es bietet, wenn man es recht versteht, alles Köstlichste auf einen Schluck: Natur- und Kunstgenuss, Freude an den Menschen und Loslösung vom Alltag.\" Im August 1901 packt der Berliner Schriftsteller und Journalist Karl Emil Franzos seinen Koffer, um Richtung Frankfurt am Main über Land zu fahren. Ein Ziel? Das hat er nicht. Eine Route? Die bestimmt der Zufall. Nach Zerbst führt Franzos das Lob von Brägenwurst und Bitterbier, nach Dessau die Regie des Fahrplans und nach Wörlitz Goethes berühmter Brief an Frau von Stein: \"Hier ist's jetzt unendlich schön.es ist, wie ein Märchen.und hat ganz den Charakter der elysäischen Felder.\" Die Reisebilder, die Karl Emil Franzos auf seinem Ausflug im August 1901 festhielt, liefern einzigartige Erinnerungen an das Leben in diesen damals bedeutsamen Städten, Erinnerungen an Bauten und Orte, die nach den Bombenangriffen auf Dessau und Zerbst 1945 nicht mehr auffindbar waren. Die Gebäude des spätmittelalterlichen Stadtkerns von Zerbst und der dortigen Residenz sind unwiederbringlich verschwunden; ebenso das herzogliche Schloss von Dessau, die Schlosskirche und die von Franzos so ausführlich dargestellte Kaiser-Friedrich-Kavalierstraße. \nFranzos` \"Reise- und Kulturbilder\" sind 1903 in Berlin erschienen. So geistreich und entspannt, so voll von Hingabe und Witz hat allein Karl Emil Franzos über Anhalt geschrieben. Im Vorwort der Buchausgabe heißt es: \"Lieb ist mir dies Buch, weil es mich an sonnige Tage erinnert, aber auch, weil ich es mit gutem Gewissen in die Welt hinaus senden darf. Denn es ist, bei aller warmen Neigung für Land und Leute, ein ehrliches und fleißig gearbeitetes Buch. Im Übrigen muss es nun selber zusehen, wie es durch die Welt kommt.\"\n\nKarl Emil Franzos wird 1848 als Sohn eines österreichischen Arztes in Czortkow, Galizien, geboren; der Geburtsort liegt im ehemaligen russischen Gouvernement Podolien, Ukraine. Gymnasium in Czernowitz, Studium der Rechte, Philosophie und Geschichte in Wien und Graz. Als Jude ist Franzos in Österreich eine Laufbahn als Universitäts- und Verwaltungsbeamter verschlossen, so wählt er die Schriftstellerei. Von 1872 bis 1877 ausgedehnte Reisen als Journalist durch Europa, Kleinasien und Ägypten. Von 1877 bis 1886 Redakteur in Wien, ab 1887 in Berlin, dort Begründung der Halbmonatsschrift »Deutsche Dichtung«. Der erfolgreiche Journalist macht als Prosaautor und erster Herausgeber der Werke Georg Büchners von sich reden. Er veröffentlicht Bücher wie die Prosasammlung »Aus Halbasien« (1877), die Novelle »Die Juden von Barnow« (1877) und den Bildungsroman »Der Pojaz« (1905). Karl Emil Franzos stirbt 1904 im Alter von 55 Jahren in Berlin, wo er auf dem Jüdischen Friedhof in Weißensee beigesetzt ist.\n\nRegie: Volker Insel\nBearbeitung: Matthias Thalheim\nProduktion: MDR 2013\n\nMitwirkende: \nIlja Richter\n\n(11 Min.)"
