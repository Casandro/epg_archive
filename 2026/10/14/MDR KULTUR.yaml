    * 10:40 Uhr - 5 Gründe, sich die Doku über die No Angels anzuschauen
    Die dreiteilige ARD-Dokumentation "NO ANGELS - DAS SIND WIR" beleuchtet pünktlich zum 25-jährigen Bandjubiläum die bewegende Geschichte der erfolgreichsten deutschen Girlgroup. Hier sind fünf Gründe, warum sich das Anschauen der Musikdoku lohnt:
    1. Schonungslose Ehrlichkeit statt Pop-Märchen: Die Bandmitglieder Nadja Benaissa, Lucy Diakovska, Sandy Mölling und Jessica Wahls rechnen offen mit einer damals "toxischen Maschinerie" aus Musikindustrie und Medien aus. Sie sprechen ungeschönt über Ausbeutung, enormen Leistungsdruck und die psychischen wie physischen Folgen des rasanten Ruhms.
    2. Die bittere Wahrheit hinter Krisen und Rauswürfen: Die Doku bricht das Schweigen über dunkle Kapitel der Bandgeschichte. So wird unter anderem thematisiert, dass die angebliche "Babypause" von Jessica Wahls im Jahr 2003 in Wahrheit ein knallharter Rauswurf war, was die Musikerinnen heute rückblickend als großen Fehler und "rückgratlose Entscheidung" bereuen.
    3. Intime Einblicke in dramatische Einzelschicksale: Neben der Bandhistorie zeigt die Reihe auch die tiefen persönlichen Krisen der vier Frauen. Zur Sprache kommen unter anderem Nadjas Drogenvergangenheit und ihr medienwirksames Gerichtsverfahren wegen ihrer HIV-Infektion, Jessicas damalige Geldsorgen sowie Sandys Rassismus-Ängste um ihren Sohn in den USA.
    4. Nostalgie und ein Blick hinter die "Popstars"-Kulissen: Die Dokumentation nimmt die Zuschauer mit auf eine emotionale Zeitreise ins Jahr 2000. Mit viel Archivmaterial und Kommentaren von Wegbegleitern wie Choreograf Detlef D! Soost wird beleuchtet, wie das wegweisende TV-Casting-Experiment ablief und wie die Band im Rekordtempo geformt wurde.
    5. Eine Geschichte über wahre Frauenfreundschaft: Trotz Trennungen, Fehltritten und jahrelangem Kontaktabbruch steht am Ende der Doku die emotionale Reunion und die über die Jahre gereifte, tiefere Verbindung der Frauen im Fokus. Es wird gezeigt, wie aus den einstigen Teenie-Idolen selbstbestimmte Frauen wurden, die sich heute gegenseitig Halt geben.

    * 10:50 Uhr - Das Gedicht: "Quitten einkochen" von Annette Hagemann
    Quitten haben gerade Saison. Und das steinharte Obst gilt als Symbol für Liebe und Fruchtbarkeit, für Glück, Klugheit, Schönheit, Beständigkeit und Unvergänglichkeit. Und, so scheint es zumindest, die Quitten haben es den Dichtern der Gegenwart besonders angetan - Monika Rinck hat über sie geschrieben und Jan Wagner. Auch Max Goldt beschäftigt sich in seinem Buch "Quitten für die Menschen zwischen Emden und Zittau" mit dem von ihm kreierten raren Genre des Quitten-Witzes.
    Die 1967 in Münster geborene Lyrikerin Annette Hagemann beschreibt die Metamorphose der Quitten. "Die fünfte Jahreszeit" heißt der Gedichtband, aus dem der folgende Text stammt. Es liest die Autorin.

