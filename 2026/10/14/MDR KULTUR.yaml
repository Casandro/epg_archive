    * 07:10 Uhr - Gourmetküche - Tourismusfaktor in Sachsen?
    Sachsen ist ein Reiseland. Kunst, Kultur und historische Städte locken jedes Jahr Millionen Besucher an. Doch zunehmend soll auch die Kulinarik zum Reiseanlass werden. Mit der Initiative "So schmeckt Sachsen" will der Freistaat die heimische Gastronomie stärker als touristisches Aushängeschild vermarkten. Eine besondere Rolle spielen dabei die acht sächsischen Restaurants, die in diesem Jahr ihren Michelin-Stern verteidigen konnten. In der historischen Hofküche von Schloss Pillnitz unweit von Dresden wurden ihre Küchenchefs jetzt dafür geehrt. Doch wie viel Strahlkraft hat die sächsische Spitzengastronomie für Reisende? Und wie Sächsisch muss sie sein? Heike Schwarzer hat nachgefragt.

    * 07:20 Uhr - Nora Bossong mit neuem Buch  bei Sounds
    Nora Bossongs neues Buch "Welt mit anderen Mitteln" heisst ihr neues Buch. Es geht um Missbrauch, Macht, Frauenrechte: Nora Bossong kritisiert darin die katholische Kirche scharf. Trotzdem hält sie an ihrem Glauben fest und sieht die Kirche vor einer überraschenden Zukunft.
    Das komplette Gespräch mit Nora Bossong können Sie nachhören - in den ARD Sounds - unter "MDR Kultur/ Aktuelle Gespräche".

