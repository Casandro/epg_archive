  title: Schnittgut. Alles aus dem Garten
  subtitle: Rasenpflege im Herbst - Alte Apfelsorten und ihre Vorteile - Herbstlicher Balkongarten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Rasenpflege im Herbst \nIm Herbst ist Rasenpflege wichtig. Mähen und Vertikutieren helfen Schimmel und Unkraut zu vermeiden. Der Oktober eignet sich für Saat und Kaliumdünger, der bei Frost schützt. Fallobst sollte entfernt werden, um Pilzkrankheiten vorzubeugen. \n\nAlte Apfelsorten und ihre Vorteile \nAuf der Streuobstwiese des BUND in Lemgo wachsen alte Apfelsorten, die für ihren vielfältigen Geschmack und allergiefreundliche Eigenschaften geschätzt werden. Experten empfehlen, diese ungespritzten Äpfel mit Schale zu essen. Alte Sorten sind oft gesünder und weniger allergen im Vergleich zu neueren Züchtungen."
