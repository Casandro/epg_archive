  title: In aller Freundschaft - 1031. Eine schwere Geburt
  subtitle: Eine schwere Geburt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Kai Hoffmann will nicht wahrhaben, dass er am ersten Arbeitstag nach seiner Reha zunächst nur mit halber Kraft arbeiten kann. Er opponiert von Anfang an dagegen und muss sich auch mit grundsätzlichen Fragen seiner beruflichen Zukunft auseinandersetzen. Solange er seine Schmerzen mit der Einnahme von Analgetika bekämpft, sind seine Perspektiven düster. Das macht ihm Kathrin Globisch deutlich klar.
- eventId: 951855
  start: 2026-10-14T06:25:00Z
  stop: 2026-10-14T07:10:00Z
  title: In aller Freundschaft - 1032. Prinzip Hoffnung
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Marcus Kraftic, Mukoviszidose-Patient, musste seine Hochzeitsreise vorzeitig abbrechen und wird wegen einer drohenden schweren Lungenentzündung auf die Intensivstation verlegt. Roland Heilmann muss seiner frischgebackenen Ehefrau Elsa mitteilen, dass es Marcus für eine Spenderlunge noch nicht schlecht genug geht. Miriam Schneider nimmt besonderen Anteil an dem Fall.
    Kris Haas bekommt Besuch von seiner völlig betrunkenen Mutter Sylvia. Kris lässt sie auf dem Sofa ausnüchtern, doch sie stürzt schwer. Kris und Ilay Demir lassen sie umgehend in die Klinik bringen.
