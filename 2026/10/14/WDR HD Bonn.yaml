  ageRating: 12
  description: "Als eine Försterin eine Leiche im Wald entdeckt, wird schnell klar, dass es sich nicht um einen natürlichen Tod handelt. \nAuf der Suche nach dem Mörder sehen sich die Rentnercops mit sogenannten Preppern, Mitgliedern einer Bewegung für die Vorbereitung auf den Weltuntergang, konfrontiert. Damit können Günter und Edwin leider so gar nichts anfangen."
