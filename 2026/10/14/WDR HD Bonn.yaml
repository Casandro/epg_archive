  title: Rentnercops - 48. Ich bring dich um
  subtitle: Spielfilm Deutschland 2020
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: 'Weil Heidrun androht, ihn nie wieder zum Abendessen bei den Hoffmanns einzuladen, wenn er nicht netter zu Hannah ist, gibt sich Edwin redlich Mühe, freundlich zu sein - wenn auch nicht aus Überzeugung. Und zu seiner Überraschung funktioniert die Zusammenarbeit mit Hannah bei ihrem nächsten Fall erstaunlich gut: Martin Turm wird vor seiner Garage in einer Mülltonne erschlagen aufgefunden. Verdächtig scheint sein ehemaliger Mitarbeiter Sascha Kesko, den er am Tag zuvor nach einer Auseinandersetzung über Teichs Affäre mit Keskos Frau entlassen hatte. Kesko drohte vor allen Kollegen, ihn umzubringen.'
- eventId: 951955
  start: 2026-10-14T13:10:00Z
  stop: 2026-10-14T14:00:00Z
  title: Rentnercops - 49. Auf alles vorbereitet
  subtitle: Spielfilm Deutschland 2020
  genre:
