  title: Klavíristé na Dvořákově Olomouci
  description: 'Wolfgang Amadeus Mozart: Sonáta pro klavír D dur k 576. - Alexandr Skrjabin: Fantazie h moll op. 28. Hraje Eliška Tkadlčíková. - Fryderyk Chopin: Scherzo č. 3 cis moll op. 39. - Ferenc Liszt: Nokturno č. 3 As dur "Sen lásky". - Fryderyk Chopin: Scherzo č. 2 b moll op. 31. Hraje Ivo Kahánek. - Antonín Dvořák: Slovanský tanec pro klavír na čtyři ruce e moll op. 72 č. 2 a g moll op. 46 č. 8. - Bedřich Smetana: Vltava, verze pro klavír na čtyři ruce. Hraje Eliška Tkadlčíková a Ivo Kahánek. Záznam klavírního recitálu Souhra generací ze Slavnostní dvorany Arcibiskupského paláce v Olomouci 19. 5. 2026. - Antonín Dvořák: Koncert pro klavír a orchestr g moll op. 33. Hraje Ivo Kahánek a Bamberští symfonikové, řídí Jakub Hrůša. - Trio č. 3 pro klavír, housle a violoncello f moll op. 65. Hraje Guarneri trio Praha. - Smyčcový kvintet Es dur op. 97. Hraje Josef Suk a Smetanovo kvarteto. - Legendy op. 59. Hraje Pražská komorní filharmonie, řídí Jiří Bělohlávek. Připravil a uvádí Jindřich Bálek.'
