  description: Vidí tělo jako systém, který lze hacknout a optimalizovat. Kupují technologie sledující spánek, pohyb, glykemii, okysličení krve a mnoho dalšího. Na jejich touze po dlouhověkosti a optimalizaci výkonu roste velký byznys. Poslechněte si, kdy se zdravá sebepéče mění v posedlost kontrolou.
