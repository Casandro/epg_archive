  title: Buchty
  description: Buchty o knihách a účetnictví. Do podcastu o všem a o ničem tentokrát přišla Hanka, která je účetní, a proto jsme s ní probíraly, zda je tato profese nudná, nebo není. Hanka se navíc definuje taky jako knihomolka, a proto nám doporučila čtivo, které jí v poslední době zaujalo. Probraly se ale i ruční práce jako například vyšívání obrazů a hrabání se v písku. Užijete si tedy velice dobrodružný díl.
