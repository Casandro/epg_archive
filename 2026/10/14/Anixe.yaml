  title: Kochen mit Anixe - Mediterrane Paprika mit Heidelbeeren
  subtitle: Kochen mit Anixe - Mediterrane Paprika mit Heidelbeeren
  description: Gefüllte Paprika kennt eigentlich jeder. Diese gibt es in vielen verschiedenen Variationen für "Allesesser" und Vegetarier. Unser TV Koch möchte das Gericht jedoch ein bisschen ausgefallener Zubereiten und fügt einfach ein paar Heidelbeeren hinzu. Unsere Moderatorin liebt die Kombination aus Obst und Gemüse und ist ganz besonders neugierig auf dieses Rezept, denn alles was mediterran ist, ist ein Garant für Genuss. Hier das komplette Rezept!
