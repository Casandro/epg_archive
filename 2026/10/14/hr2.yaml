  title: LIVE - 57. Deutsches Jazzfestival Frankfurt
  subtitle: Andrés Coll "Odyssey" feat. Majid Bekkas | Louis Sclavis Quartet "India" | Ali Neander meets hr-Bigband - "Guitar Unlimited"
  description: Mit dem jungen Heißsporn Andrés Coll eröffnet ein aufgehender Stern der europäischen Szene diesen Abend und bewegt sich mit seiner hochkarätig besetzten Band virtuos und temperamentvoll zwischen Ibiza und Afrika, Folklore und Jazz. Anschließend entführt Altmeister Louis Sclavis mit langen Melodie- und Spannungsbögen in seine Imagination des indischen Subkontinents, bevor die hr-Bigband den hessischen Gitarrenhelden Ali Neander als Jazzrockvirtuosen von internationalem Format präsentiert.
