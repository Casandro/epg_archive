  title: Kaisers Klänge - Musikalische Entdeckungsreisen
  subtitle: Ihr letzter Flug - Musik für Amelia Earhart
  description: |-
    Als erste Frau überquerte sie 1932 im Alleinflug den Atlantik. Ihr spurloses Verschwinden beim Versuch, die Erde am Äquator zu umfliegen, ist bis heute eines der größten Rätsel der Luftfahrtgeschichte. Von Amelia Earharts letztem Flug erzählen Country- und Popsongs, Chorkantaten und Violinkonzerte.

    Wird wiederholt am 18.10.2026.
