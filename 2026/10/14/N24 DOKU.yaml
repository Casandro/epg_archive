  description: Mit seiner charismatischen Persönlichkeit, rhetorischer Brillanz und einem von Gandhi inspirierten Konzept des gewaltfreien Protests ermöglicht Martin Luther King in den 1950er und 60er Jahren politische Meilensteine wie den Voting Rights Act. Doch zeitgleich führt FBI-Chef J. Edgar Hoover einen geheimen Kreuzzug gegen King, den er als Kommunisten verdächtigt. Drei Jahre nach der Ermordung Kings kommen durch einen Einbruch in ein FBI-Büro die illegalen Machenschaften der Behörde ans Licht.
