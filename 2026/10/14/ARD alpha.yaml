  description: 'Geschichtenerzählen und Astrophysik - das sind seine beiden großen Leidenschaften: Harald Lesch ist Professor für theoretische Astrophysik an der Ludwig-Maximilians-Universität München und unterrichtet Naturphilosophie an der Hochschule für Philosophie S.J. in München. Außerdem ist er Mitglied der Kommission "Astronomie in Unterricht und Lehramt". Seine Hauptforschungsgebiete sind kosmische Plasmaphysik, Schwarze Löcher und Neutronensterne. In der Sendereihe "alpha-Centauri" erklärt Professor Lesch die Grundzüge des Universums, untersucht ferne Galaxien und bringt uns unser Sonnensystem näher.'
- eventId: 1163311
  start: 2026-10-14T03:00:00Z
  stop: 2026-10-14T03:30:00Z
  title: nano
  description: 'nano - das ist täglich 30 Minuten Wissenschaft: faszinierende Bilder aus der Welt der Natur- und Geisteswissenschaften, der Technik und der Medizin, spannende Berichte über Fortschritte in der Forschung, den Wandel in der Gesellschaft und über Veränderungen der Umwelt.'
- eventId: 1163312
  start: 2026-10-14T03:30:00Z
  stop: 2026-10-14T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Desert Hues
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 1163313
  start: 2026-10-14T04:00:00Z
  stop: 2026-10-14T04:30:00Z
  title: C'est ça, la vie (5/26)
  subtitle: Marie-Paule, ingénieur
  description: '"C''est ça, la vie" so ist das Leben von Philippe, dem Pariser Architekten, Martine, der Polizistin in Caen oder von Anne, Rechtsanwältin in Genf.  "C''est ça, la vie" zeigt 26 Porträts von Menschen, die in Frankreich, Belgien, Luxemburg und der Schweiz leben und in den verschiedensten Berufen tätig sind.  Sie zeigen uns ihre Stadt und ihren Arbeitsplatz, stellen ihre Familien vor und erzählen von ihren Hobbies. Natürlich wird in "C''est ça, la vie" nur Französisch gesprochen. Anouk Charlier führt durch die Sendereihe und hilft mit ihren Erläuterungen, Land und Leute besser zu verstehen.'
- eventId: 1163314
  start: 2026-10-14T04:30:00Z
  stop: 2026-10-14T05:00:00Z
  title: TELEKOLLEG Französisch (14/39)
  subtitle: Bon Courage
  description: Der 39-teilige Französischkurs "Bon Courage" richtet sich an Anfänger oder dient zur Auffrischung von Sprachkenntnissen. Der Kurs bringt nicht nur die französische Sprache, sondern auch die Lebensart der Franzosen näher.
- eventId: 1163315
  start: 2026-10-14T05:00:00Z
  stop: 2026-10-14T05:15:00Z
  title: GRIPS Englisch (20)
  subtitle: Wortstellung & Satzbau
  subtitled: true
  description: |-
    Wie war das nochmal: Ort vor Zeit oder Zeit vor Ort? Und was ist mit dem ganzen Rest an Wörtern? Keine Panik! Der Satzbau funktioniert im Englischen immer gleich. Wir zeigen dir, wie.
    Einen englischen Satz zu bauen kann ganz schön vertrackt sein. Ganz so wie im Deutschen funktioniert's nämlich nicht. Unser Team nimmt dich mit ins Europäische Industriemuseum für Porzellan in Selb. Dort zeigen dir Michael Meisenzahl und Camilla nicht nur, wie man Geschirr herstellt, sondern auch, in welcher Reihenfolge du die Wörter in einem englischen Satz verwendest.
- eventId: 1163316
  start: 2026-10-14T05:15:00Z
  stop: 2026-10-14T05:30:00Z
  title: GRIPS Englisch (21)
  subtitle: Wegbeschreibung
  subtitled: true
  description: 'Hast du dich schon mal verlaufen? Praktisch, wenn dann jemand in der Nähe ist, der sich auskennt und den man fragen kann. Damit du auch auf Englisch nach dem Weg fragen kannst, nimmt dich das GRIPS-Team mit nach Hof und Bamberg. Im Video erlebst du eine englische Wegbeschreibung hautnah mit: Camilla will den Wurstverkäufer in Hof finden - hoffnungslos ohne Elisas und Julias Hilfe. Du trainierst dabei vor allem dein Hörverstehen.'
- eventId: 1163317
  start: 2026-10-14T05:30:00Z
  stop: 2026-10-14T05:55:00Z
  title: Willi wills wissen
  subtitle: Wie kommt der Zucker aus der Rübe?
  subtitled: true
  description: 'Hmmm, Zuckerwatte! Die meisten Menschen lieben Zucker und können bei Süßem kaum widerstehen. Doch wo kommt der Zucker eigentlich her? Um eine Methode der Zuckergewinnung genauer unter die Lupe zu nehmen, ist Willi heute in Aiterhofen bei Straubing unterwegs. Dort trifft er Alfons, auf dessen Acker richtig süße Pflanzen wachsen: die Zuckerrüben. Nur mit viel Mühe schafft es Willi, eine der Knollen aus dem Boden zu stechen. Was der Reporter noch nicht wusste: Die Rübe ist eine verdickte Wurzel. Drin ist, unter anderem: Zucker!'
- eventId: 1163318
