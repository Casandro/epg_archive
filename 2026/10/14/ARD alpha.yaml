  subtitle: Mikronährstoffe und Vitamine
  subtitled: true
  description: 'Vitamine sind lebenswichtig, doch nicht jeder braucht Nahrungsergänzungsmittel. Eine ausgewogene Ernährung liefert in der Regel alle nötigen Nährstoffe. Fettlösliche Vitamine können sich im Körper anreichern und schaden, während hohe Dosen wasserlöslicher Vitamine Nebenwirkungen haben können. Viele Annahmen über Vitamine sind weit verbreitet: Braucht jeder täglich eine Extraportion? Hilft Vitamin C gegen Erkältungen? Und sind natürliche Vitamine besser als künstliche? "treffpunkt medizin" untersucht neue wissenschaftliche Erkenntnisse und zeigt: mehr ist nicht immer besser!'
