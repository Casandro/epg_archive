  title: Doma je doma
  subtitle: Popoludňajšie stretnutie sa "doma v obývačke".
  description: 'as sprevádza celým naším životom, tak bude spájať aj témy dnešnej relácie. S biblistom Petrom Olasom si predstavíme jesenné biblické webináre z dielne Katolíckeho biblického diela. S biblistom Blažejom Štrbom Vás pozveme do Badína na biblicko-duchovné sústredenie plné prednášok, diskusií a modlitieb s témou: Keď sa modlí matka: Biblická cesta od Hagar k Márii. A na záver spolu s Ivanom Petrom navštívime evanjelizačný projekt Godzone tour, kde biblické pravdy dodávajú silu a oheň naprieč generáciami. (2026)'
