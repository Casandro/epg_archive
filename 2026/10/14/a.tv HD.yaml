- eventId: 1469162
  start: 2026-10-14T00:45:00Z
  stop: 2026-10-14T01:00:00Z
  title: Lug ins Land (Wh.)
  subtitle: Freizeittipps aus Bayerisch-Schwaben
  description: Unsere Reporter sind unterwegs im Allgäu, in der Region Neu-Ulm und rund um Augsburg, und probieren aus, was man in seiner Freizeit so alles machen kann. Unter anderem sind wir diesmal mit dem Steckenpferd unterwegs im Allgäu und testen Hobbyhorsing - und in Augsburg schwingen wir den Kochlöffel und machen bei einem Kochkurs mit.
- eventId: 1469163
  start: 2026-10-14T01:00:00Z
  stop: 2026-10-14T01:15:00Z
  title: Aus dem Oberallgäu und Kempten (Wh.)
  subtitle: Neuer ÖPNV - Wie "Mobil 365" den Landkreis verändern soll
  description: Das lange Warten auf den nächsten Bus - Im Oberallgäu könnte das in Zukunft Geschichte sein. Mit dem Projekt Mobil 365, das 2024 erstmals öffentlich vorgestellt wurde, will der Landkreis den ÖPNV im großen Stil umbauen. Engere Taktungen, einfachere Fahrpläne und Linien, die an die Zeiten der deutschen Bahn angepasst sind. Nach schier endlosen Diskussionen ist mittlerweile klar, dass das Projekt zum Jahresbeginn 2029 in die Tat umgesetzt wird.
- eventId: 1469164
  start: 2026-10-14T01:15:00Z
  stop: 2026-10-14T01:30:00Z
  title: Aus dem Ostallgäu und Kaufbeuren (Wh.)
  subtitle: Vom Profifußball bis zum Schiedsrichterwesen - zwei Seiten des Fußballs im Allgäu
  description: 'Wir treffen den ehemaligen Profi Uwe Wegmann und blicken gemeinsam auf seine Karriere in den 80er- und 90er-Jahren zurück. Mit alten Trikots und Fotos erinnert er sich an seine Zeit unter anderem beim VfL Bochum und beim 1. FC Kaiserslautern. Anschließend geht es nach Rettenberg auf den Fußballplatz: Mit dem Allgäuer Schiedsrichterobmann Kevin Mitchell sprechen wir über die Entwicklung des Schiedsrichterwesens und die Herausforderungen für die Unparteiischen.'
- eventId: 1469165
  start: 2026-10-14T01:30:00Z
  stop: 2026-10-14T02:00:00Z
  title: allgäu.tv Nachrichten (Wh.)
  subtitle: Regionalnachrichten aus dem Allgäu
  description: Was bewegt das Allgäu? Diese Frage beantworten wir Ihnen täglich in den allgäu.tv Nachrichten. In einer halben Stunde berichten wir Ihnen von politischen Entscheidungen, geben Ihnen Einblicke in die Allgäuer Kulturlandschaft, nehmen Sie mit zu faszinierenden Menschen und zeigen Ihnen die schönen Seiten des Allgäus. (Eine Sendung von allgäu.tv)
