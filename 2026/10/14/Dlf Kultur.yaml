  title: Tonart
  subtitle: Rock
  description: |-
    Rock
    Moderation: Carsten Rochow

    "Mathrock - diese vertrackte Spielart zwischen Indie, Prog, Postrock und Jazz - erlebt gerade einen erstaunlichen Popularitätsschub. Einen gehörigen Anteil daran dürften Angine de Poitrine haben: Zwei schwer kostümierte Kanadier, mikrotonale Doppelhalsgitarre, Schlagzeug, krumme Takte und inzwischen Millionen Klicks und ausverkaufte Konzerte. Ende Oktober kommen sie nach Deutschland, und sämtliche Shows sind bereits voll.
    Und irgendwie scheint gerade noch mehr Bewegung in diesem Genre zu sein. Die Mathrock-Pioniere Don Caballero aus Pittsburgh haben ihre Reunion angekündigt, mit Damon Che am Schlagzeug und Ian Williams an der Gitarre. Dazzling Killmen sind nach rund 30 Jahren ebenfalls wieder unterwegs und spielen ausgerechnet am Abend vor dieser Sendung in Berlin. Und aus Brighton ist in diesem Jahr mit Flare von Plantoid ein schwindelerregendes wie packendes Album zwischen Prog, Jazz und Mathrock gekommen.Grund genug also, in der Tonart für Indie, Alternative und Nischenrock ein bisschen tiefer in die Welt der krummen Takte und verknoteten Gitarren zu steigen.?
