  title: Dobre strony - Margaret, Tomasz Kot
  description: |-
    Tytuł oryginalny: Dobre strony
    PL, 2024
    Cykl programów zrealizowany przez Narodowe Centrum Kultury dotyczący promocji czytelnictwa. Dobrze jest używać literatury aby lepiej czuć, lepiej myśleć i w konsekwencji lepiej żyć. Dwójka artystów rozmawia o inspiracjach literackich, które wykorzystali w swoich utworach, piosenkach, hitach. Bez czytania nie napisaliby przeboju, nie osiągnęliby sukcesu, nie byliby tymi osobami, którymi są. O książkach, które ich ukształtowały oraz zainspirowały nie tylko w pracy, ale i w życiu.
  ageRating: 12
  genre:
  - '112'
  subtitle: Margaret i Tomasz Kot przyznają, że choć nie czytają tyle, ile by chcieli, literatura pozostaje dla nich bramą do wyobraźni, dającą wolność kreowania własnych światów.
