    Broda nieustannie rozmyśla o Jance, na którą niespodziewanie natrafia w sklepie Grzelaków. Na wieść o wieczornej zabawie ostatkowej w remizie, mężczyzna wyrusza do Brzezin, aby zdobyć jej względy własnymi wypiekami. Sytuacja przybiera dramatyczny obrót, gdy w miejscowości wybucha pożar, a zdeterminowany mężczyzna - chcąc zaimponować wybrance - dołącza do akcji gaśniczej u boku strażaków.
