  title: Przyrodnik na tropie - Pszczoła miodna
  description: |-
    Tytuł oryginalny: Przyrodnik na tropie
    PL, 2020
    Reżyseria: Małgorzata Kosturkiewicz
    "Przyrodnik na tropie" to program przyrodniczy, w którym prowadzący - Łukasz Bożycki - porusza różne aspekty życia zwierząt w kontekście ich wzajemnych powiązań i oddziaływań. Młody biolog, jednocześnie uznany międzynarodowy fotograf przyrody, podpatruje z kamerą w naturalnym środowisku wybrane gatunki rodzimej fauny i swoje spostrzeżenia oprawia lekkim i przystępnym komentarzem.
  ageRating: 12
  genre:
  - '145'
  subtitle: Są pracowite, pożyteczne i podobno niesamowicie zorganizowane. O tym czy pszczoły są nam potrzebne, jak je rozpoznawać i czy to prawda, że nie gryzą, opowiada niestrudzony badacz fauny i flory Łukasz Bożycki.
