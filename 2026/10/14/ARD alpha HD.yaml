  title: nano
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'nano - das ist täglich 30 Minuten Wissenschaft: faszinierende Bilder aus der Welt der Natur- und Geisteswissenschaften, der Technik und der Medizin, spannende Berichte über Fortschritte in der Forschung, den Wandel in der Gesellschaft und über Veränderungen der Umwelt.'
- eventId: 950131
  start: 2026-10-14T03:30:00Z
  stop: 2026-10-14T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Desert Hues
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 950132
  start: 2026-10-14T04:00:00Z
  stop: 2026-10-14T04:30:00Z
  title: C'est ça, la vie (5/26)
  subtitle: Marie-Paule, ingénieur
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"C''est ça, la vie" so ist das Leben von Philippe, dem Pariser Architekten, Martine, der Polizistin in Caen oder von Anne, Rechtsanwältin in Genf.  "C''est ça, la vie" zeigt 26 Porträts von Menschen, die in Frankreich, Belgien, Luxemburg und der Schweiz leben und in den verschiedensten Berufen tätig sind.  Sie zeigen uns ihre Stadt und ihren Arbeitsplatz, stellen ihre Familien vor und erzählen von ihren Hobbies. Natürlich wird in "C''est ça, la vie" nur Französisch gesprochen. Anouk Charlier führt durch die Sendereihe und hilft mit ihren Erläuterungen, Land und Leute besser zu verstehen.'
- eventId: 950133
  start: 2026-10-14T04:30:00Z
