  audiodesc: true
  description: Als der Farmer abends in sein Bett steigen will, steht da nur ein Möbelbausatz im Zimmer. Bitzer und er brauchen die ganze Nacht, um das neue Bett zusammenzubauen. Dann will der Farmer endlich schlafen. Aber der Hahn möchte krähen, die Schafe spielen Fußball, und die Schweine feuern die Mannschaft an. Bitzer hat alle Hände voll zu tun, für Ruhe zu sorgen. Und dann ist da noch die schwebende Wärmflasche.
- eventId: 950175
  start: 2026-10-14T06:00:00Z
  stop: 2026-10-14T06:15:00Z
  title: Alkohole und ihre Derivate
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Alkohole sind eine umfangreiche Gruppe chemischer Verbindungen, die viele Ähnlichkeiten aber auch große Unterschiede aufweisen. Der bekannteste Alkohol entsteht, wenn die Weinhefe den Zucker im Traubensaft vergärt. Der Film geht aus von der Weinherstellung beim Winzer. Im Labor experimentieren Schüler, sie setzen einen Gärversuch an und testen die chemischen und physikalischen Eigenschaften verschiedener Alkohole. Trickfilmabschnitte veranschaulichen  die homologe Reihe dieser Verbindungen. In Experimenten  und Realfilmabschnitten wird gezeigt, wie aus Alkoholen ihre Derivate entstehen, wie Ethanol zu Ethanal oder Essigsäure wird.
