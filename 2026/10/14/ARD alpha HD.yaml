- eventId: 950134
  start: 2026-10-14T05:00:00Z
  stop: 2026-10-14T05:15:00Z
  title: GRIPS Englisch (20)
  subtitle: Wortstellung & Satzbau
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie war das nochmal: Ort vor Zeit oder Zeit vor Ort? Und was ist mit dem ganzen Rest an Wörtern? Keine Panik! Der Satzbau funktioniert im Englischen immer gleich. Wir zeigen dir, wie.
    Einen englischen Satz zu bauen kann ganz schön vertrackt sein. Ganz so wie im Deutschen funktioniert's nämlich nicht. Unser Team nimmt dich mit ins Europäische Industriemuseum für Porzellan in Selb. Dort zeigen dir Michael Meisenzahl und Camilla nicht nur, wie man Geschirr herstellt, sondern auch, in welcher Reihenfolge du die Wörter in einem englischen Satz verwendest.
- eventId: 950135
  start: 2026-10-14T05:15:00Z
  stop: 2026-10-14T05:30:00Z
  title: GRIPS Englisch (21)
  subtitle: Wegbeschreibung
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hast du dich schon mal verlaufen? Praktisch, wenn dann jemand in der Nähe ist, der sich auskennt und den man fragen kann. Damit du auch auf Englisch nach dem Weg fragen kannst, nimmt dich das GRIPS-Team mit nach Hof und Bamberg. Im Video erlebst du eine englische Wegbeschreibung hautnah mit: Camilla will den Wurstverkäufer in Hof finden - hoffnungslos ohne Elisas und Julias Hilfe. Du trainierst dabei vor allem dein Hörverstehen.'
- eventId: 950136
  start: 2026-10-14T05:30:00Z
  stop: 2026-10-14T05:55:00Z
  title: Willi wills wissen
  subtitle: Wie kommt der Zucker aus der Rübe?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hmmm, Zuckerwatte! Die meisten Menschen lieben Zucker und können bei Süßem kaum widerstehen. Doch wo kommt der Zucker eigentlich her? Um eine Methode der Zuckergewinnung genauer unter die Lupe zu nehmen, ist Willi heute in Aiterhofen bei Straubing unterwegs. Dort trifft er Alfons, auf dessen Acker richtig süße Pflanzen wachsen: die Zuckerrüben. Nur mit viel Mühe schafft es Willi, eine der Knollen aus dem Boden zu stechen. Was der Reporter noch nicht wusste: Die Rübe ist eine verdickte Wurzel. Drin ist, unter anderem: Zucker!'
- eventId: 950137
