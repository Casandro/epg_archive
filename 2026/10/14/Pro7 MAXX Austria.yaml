    Benders große Leidenschaft ist das Kochen - auch wenn alle anderen aus der Crew seine Gerichte für schlichtweg ungenießbar halten. Als der Roboter den ehemaligen Meisterkoch Spargel kennenlernt, sieht er seine Chance gekommen, einiges in der Kunst der Speisenzubereitung dazuzulernen. Dummerweise stirbt Spargel noch vor dem Unterricht - wie sollte es auch anders sein - an einem von Benders Gerichten. In den letzten Atemzügen bittet der Koch Bender um einen großen Gefallen ...

