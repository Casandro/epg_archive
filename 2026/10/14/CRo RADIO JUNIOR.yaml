  title: Hajaja
  description: 'Sladké a slané cestování 3/7 - Zmrzlina. Jsou dvě věci, které Emilka miluje ze všeho na světě nejvíc: jídlo a cestování. Kromě téhle veliké lásky má navíc obrovskou představivost, která ji dokáže přenést do dávných dob a dalekých krajů, kde vznikly její oblíbené recepty. Sedm sladkých a slaných příběhů o cestách za jídlem a dobrodružstvím napsala Antonie Rašilovová. Dramaturg Vojtěch Bohuslav. Režie Bela Schenková. Natočeno v roce 2026. Vypráví Eva Hacurová. PREMIÉRA.'
