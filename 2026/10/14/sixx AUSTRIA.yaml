  description: |-
    Verhexter Fall für House' Bewerbergruppe: Der Magier Flynn erleidet in seiner Show während einer Entfesselungsnummer einen Herzstillstand. Auch in der Klinik erleidet er lebensbedrohliche Blutungen - er scheint todkrank zu sein. Als wäre der Fall noch nicht aufreibend genug für das Team, stellt House den fünf verbleibenden Kandidaten eine weitere, schier unlösbare Aufgabe: Wer ihm Cuddys Höschen besorgt, genießt Immunität und darf zwei Konkurrenten zum Abschuss freigeben.

