  title: SK Dejiny (8)
  subtitle: Dualizmus a Slovensko - Priestorová mobilita. Populárno-náučná diskusia o objavovaní zlomových okamihov našich dejín.
  description: Človek v období dualizmu zažíval veľa zmien. Okrem iného aj preto, lebo mohol cestovať po krajine ako nikdy predtým. Budapešť bola pre Slovákov jedno z miest, kde mohli nájsť prácu aj nové životné skúsenosti. Bicykle, letecké cirkusy, metro aj šikovní Slováci v hlavnom meste. Na týchto témach si ukážeme veľkú dynamiku života v Uhorsku. V druhej časti štvordielnej série SK_Dejiny o období dualizmu v našich dejinách. (2026)
