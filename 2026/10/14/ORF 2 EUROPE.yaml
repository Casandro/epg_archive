  title: Stöckl live
  subtitle: 'Bewusst gesund: Unter Druck - Wie Stress uns krank macht'
  description: |-
    Dauerstress und chronischer Schlafmangel sind in unserer Leistungsgesellschaft längst zu einer stillen Epidemie geworden: Immer mehr Menschen leiden unter den massiven körperlichen und psychischen Folgen von ständiger Belastung, Burnout und schlaflosen Nächten. Doch wie gelingt der Ausstieg aus dem Hamsterrad, wenn ständige Erreichbarkeit, Zukunftsängste und Arbeitsdruck den Rhythmus bestimmen?
    In "Stöckl live" beleuchtet Barbara Stöckl die Ursachen von Stress und Schlafstörungen - von körperlichen Zusammenbrüchen über Suchtmittel als Flucht vor dem Alltagsdruck und stressbedingten Libidoverlust, bis hin zu den Chancen einer digitalen Auszeit zur Entlastung. Zu Wort kommen Betroffene mit ihren persönlichen Geschichten sowie hochkarätige ExpertInnen aus Stress- und Schlafforschung. Vor und während der Sendung haben die ZuseherInnen die Möglichkeit, ihre Fragen, Meinungen und Erfahrungen zu teilen.
