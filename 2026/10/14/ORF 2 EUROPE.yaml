  title: Kafka
  subtitle: BUREAU
  description: "(Serie, AUT 2024)\nKafka wird als namhafter Versicherungsanwalt von seinen Vorgesetzten hochgeschätzt. Für ihn ist der komfortable Arbeitsplatz eine lebende Hölle, aus der er nur entkommen möchte. Auf dem Höhepunkt des Ersten Weltkriegs retten seine Vorgesetzten Kafkas Leben, indem sie ihn vor einer Einberufung bewahren.\nMit Joel Basman (Franz Kafka), David Kross (Max Brod), Nicholas Ofczarek (Hermann Kafka), Marie-Lou Sellem (Julie Kafka), Maresi Riegner (Ottla Kafka), Robert Stadlober (Felix Weltsch), Tobias Bamborschke (Oskar Baum), Christian Friedel (Franz Werfel), Michael Maertens (Erzähler), Verena Altenberger (Robert Musil), Thomas Maurer (Dr. Mühlstein), André Pohl (Eugen Pfohl), Johannes Silberschneider (Robert Marschner), Ben Bradshaw (Otto Pribram) u.a.\nDrehbuch: Daniel Kehlmann mit David Schalko basierend auf den Biografien von Reiner Stach\nerschienen im S. Fischer Verlag \nRegie: David Schalko"
  genre:
  - '17'
- eventId: 1561247
  start: 2026-10-14T22:35:00Z
  stop: 2026-10-14T23:17:42Z
  title: Kafka
  subtitle: MILENA
  description: "(Serie, AUT 2024)\nKafka beginnt eine kurze, aber intensive Beziehung zu der Schriftstellerin Milena Jesenská, die\nsein Genie auf eine Weise erkennt, wie bisher nur Max Brod. Während eines langen Nachmittags in den Wiener Wäldern durchleben sie alle Phasen einer leidenschaftlichen Liebesaffäre.  \nMit Joel Basman (Franz Kafka), Liv Lisa Fries (Milena Jesenská), Gerhard Liebmann (Ledermann), Raimund Wallisch (Ledermann), Christoph Krutzler (Wirt), David Oberkogler, Markus Hamele u.a.\nDrehbuch: Daniel Kehlmann mit David Schalko basierend auf den Biografien von Reiner Stach\nerschienen im S. Fischer Verlag \nRegie: David Schalko"
  genre:
  - '17'
- eventId: 1561537
  start: 2026-10-14T23:20:00Z
  stop: 2026-10-15T00:05:00Z
  title: Kafka
  subtitle: DORA
  description: "(Serie, AUT 2024)\nDer Urlaubsort des bereits von Tuberkulose gezeichneten Kafka verwandelt sich in seiner Vorstellung in das dunkle und mythische Dorf seines letzten und berühmtesten Romans \"Das Schloss\". Doch er trifft auch seine letzte große Liebe, Dora Diamant. Die Beiden leben einige Monate in Berlin und verbringen seine letzten Tage gemeinsam im Sanatorium Kierling außerhalb von Wien.\nMit Joel Basman (Franz Kafka), David Kross (Max Brod), Nicholas Ofczarek (Hermann Kafka), Marie-Lou Sellem (Julie Kafka), Maresi Riegner (Ottla Kafka), Liv Lisa Fries (Milena Jesenská), Tamara Romera Ginés (Dora Diamant), Robert Stadlober (Felix Weltsch), Tobias Bamborschke (Oskar Baum), Christian Friedel (Franz Werfel), Gerhard Liebmann (Ledermann), Raimund Wallisch (Ledermann), Michael Maertens (Erzähler), Katharina Thalbach (Vermieterin Berlin) u.a.\nDrehbuch: Daniel Kehlmann mit David Schalko basierend auf den Biografien von Reiner Stach\nerschienen im S. Fischer Verlag \nRegie: David Schalk"
  genre:
  - '17'
