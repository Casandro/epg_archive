  title: WELTjournal
  subtitle: Gaza - 3 Jahre Krieg
  description: '"Israels Angriffe auf die Palästinenser haben ein Ausmaß an Tötung und Zerstörung wie ich es in all meinen Jahren bei der UNO noch nie erlebt habe", sagt UNO-Generalsekretär Antonio Guterres bei der Generalversammlung der Vereinten Nationen Ende September. Mehr als 70.000 Menschen wurden bisher bei israelischen Angriffen getötet. Tausende sind nach wie vor vermisst. Das WELTjournal begleitet Menschen im Gazastreifen, die inmitten der Zerstörungen ihre vermissten Angehörigen suchen. Ibrahim hat seine Frau und vier seiner Kinder bei dem israelischen Luftangriff auf das Flüchtlingsviertel Al Maghazi verloren. Zwei Jahre nach ihrem Tod können sie endlich aus den Trümmern geborgen und in Würde bestattet werden. Andere suchen vergeblich und fürchten, niemals eine Antwort über das Schicksal ihrer Angehörigen zu erhalten. Da Israel Journalisten den Zutritt zum Gazastreifen verwehrt, leiteten die Filmemacher die Dreharbeiten von Europa aus - in Zusammenarbeit mit palästinensischen Reportern vorort, die dabei tagtäglich ihr Leben riskieren.'
  genre:
  - '129'
- eventId: 1560537
  start: 2026-10-14T21:00:00Z
  stop: 2026-10-14T21:50:00Z
  title: WELTjournal +
  subtitle: Geboren in Gaza
  description: 'Was wurde aus den Kindern von Gaza, die Filmemacher Hernan Zin während des Krieges 2014 begleitete? Seine Reportage von damals zählt zu den meistgesehenen Dokumentarfilmen auf Netflix und viele Zuschauer wollten mehr über das Schicksal der Kinder erfahren. Mehr als 10 Jahre später findet das Team des Filmemachers in den jetzigen Kriegswirren tatsächlich einige seiner Protagonisten von damals wieder. Mohamed, der als Kind den Unterhalt der Familie bestreiten musste, hat heute selbst Frau und drei Kinder. Wie mehr als 90% der Gaza-Bevölkerung mussten auch sie vor den israelischen Angriffen fliehen. Ihr Haus ist zerbombt, bei der Beschaffung von Nahrung für seine Familie riskiert Mohamed täglich sein Leben. Bisan wurde 2014 als kleines Mädchen bei einem israelischen Bombenangriff verschüttet. Nahezu die gesamte Familie wurde getötet, sie selbst überlebte schwer verletzt und muss sich im heutigen Krieg alleine durchschlagen. Udai hat gerade einen weiteren Bruder verloren, wie schon 2014: er war 11 Jahre alt, als sein Bruder vor seinen Augen bei einem israelischen Angriff getötet wurde. Die Dreharbeiten für den Film gestalteten sich äußerst schwierig: Zwei palästinensische Kameramänner wurden von israelischen Kommandos beschossen und schwer verletzt. Internationalen Journalisten verwehrt Israel den Zutritt zum Gazastreifen.'
  genre:
  - '129'
