  title: Plenarsitzung des Nationalrates
  description: |-
    Der Nationalrat kommt am 14. und 15. Oktober zu zwei Plenarsitzungen zusammen. Auf der Tagesordnung stehen unter anderem eine Reform des Strafvollzugs, schärfere Regeln bei Menschen- und Organhandel sowie neue Vorgaben zur Geldwäschebekämpfung. Die Strafvollzugsnovelle soll unter anderem die Rückkehr ausländischer Straftäter in ihre Heimat nach Verbüßung der halben Haftstrafe erleichtern. Geplant sind außerdem Erleichterungen für Unternehmen, etwa bei Photovoltaikanlagen, sowie neue Maßnahmen zur Krisenvorsorge. Die Themen für die Aktuelle Stunde am Mittwoch bestimmen die NEOS.
    Am Donnerstag stehen eine Fragestunde mit Innenminister Gerhard Karner (ÖVP), der Grüne Bericht 2026 und der Tourismusbericht 2025 auf dem Programm. Zudem beraten die Abgeordneten über Änderungen im Gesundheitsbereich und eine neue Schadensdatenbank für Naturereignisse.

    Kommentar: Astrid Wibmer
  genre:
  - '128'
