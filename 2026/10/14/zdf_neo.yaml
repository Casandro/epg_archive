    Deutschland 2014
    Heute weiß jeder etwas mit dem Begriff Nerd anzufangen: Es sind die Sonderlinge, die ein ausgeprägtes Spezialwissen haben und ein - sagen wir mal - besonderes Sozialverhalten an den Tag legen.

