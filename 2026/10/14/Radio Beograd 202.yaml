  description: Ovog jutra spajamo opojni miris tradicionalne homoljske šljivovice i sećanje na glumačke legende kroz novu pozorišnu scenu u Kruševcu. Da li ste znali da u Homolju pečenje rakije odavno nije samo muški posao? Ovog jutra vas vodimo u Osanicu, gde se širi miris tek ispečene šljivovice, a oko kazana ravnopravno stoje i žene. Otkrivamo vam tajne ovog tradicionalnog zanata i zašto vredne Homoljke kažu da najbolja rakija ne dolazi samo iz dobrog kazana, već iz čiste duše i porodične sloge.Iz Homolja putujemo u Kruševac, grad sa specifičnim duhom koji je iznedrio neka od najvećih imena našeg glumišta. Povodom osam decenija rada tamošnjeg pozorišta, podsećamo se velikana poput Ljubinke Bobić, ali i sa ponosom najavljujemo otvaranje nove, male pozorišne scene koja nosi ime po neverovatnom Marku Živiću. Saznajte šta ovaj intimni prostor znači za njegove prijatelje, kolege i neke nove mlade umetnike.Pišite nam - ko je u vašoj porodici glavni majstor za tradicionalne jesenje obaveze oko...
