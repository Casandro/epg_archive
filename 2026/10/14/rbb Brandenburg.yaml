  title: Auf Achse (2/13)
  subtitle: Nur eine kleine Verwechslung
  episodeUri: crid://onid-1/e/6a989f5f2d07852659fe07c1
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Dem Transportunternehmer Reimers wird ein Lastwagen gestohlen und vermutlich auf der Route quer durch Jugoslawien nach Griechenland gebracht, um dort per Schiff in den Nahen Osten verladen zu werden. Reimers und Sohn nehmen die Verfolgung selbst in die Hand. Über den Rundfunk lassen sie eine Prämie ausloben für jeden, der sachdienliche Hinweise zur Ergreifung des Täters gibt. Die Beschreibung, die aus dem Radio kommt, passt aber auch genau auf Meersdonks Wagen, der daraufhin mehrfach "gestellt" wird. Bis er selbst mit Willers Hilfe dafür sorgt, dass das gesuchte Fahrzeug gefunden wird, damit er endlich wieder ungestört fahren kann.
- eventId: 949636
