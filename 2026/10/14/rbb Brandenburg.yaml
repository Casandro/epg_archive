  title: Die Leopardin (1/2)
  subtitle: Königin der Schatten - Film von Reinhard Radke
  episodeUri: crid://onid-1/e/6a989f5f2d07852659fe07bf
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Nur wenige Tiere können es mit der Eleganz von Leoparden aufnehmen. Nur selten sieht man die vorsichtigen und extrem scheuen Raubkatzen länger als ein paar Sekunden in freier Wildbahn. Ausgiebiger kann man sie höchstens beobachten, wenn sie schlafend auf einem Baum rasten und sich von der meist nächtlichen Jagd erholen. In der nördlichen Serengeti ist es jedoch gelungen, erstaunliche Einblicke in das Leben und die Jagdtaktik der Raubkatzen mit der Kamera festzuhalten. Ein intimes Porträt einer außergewöhnlichen Leopardin, deren Schicksal über zwei Jahre mit der Kamera verfolgt werden konnte.
- eventId: 949637
  start: 2026-10-14T01:40:00Z
  stop: 2026-10-14T02:25:00Z
  title: Die Leopardin (2/2)
  subtitle: Gejagte Jägerin - Film von Reinhard Radke
  episodeUri: crid://onid-1/e/6a989f5f2d07852659fe07bd
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im zweiten Teil von "Die Leopardin" bleibt Naturfilmer Reinhard Radke der Leopardenmutter auf den Fersen, die ihren kleinen Sohn erfolgreich durch die gefährlichsten Wochen seines Lebens gebracht hat. Das ist ihr gelungen, weil sie am Rande eines Bachbettes ausreichend Möglichkeiten findet, sich unbemerkt an ihre Beute heranzuschleichen. Das sind dort vor allem Warzenschweine, die es in großer Zahl gibt. Hat die Leopardin ein Ferkel gepackt, muss sie sich schnellstmöglich auf einen Baum retten, um den Angriffen der wütenden Warzenschweinmütter zu entkommen, die mit ihren scharfen Hauern keine ungefährlichen Gegner sind.
