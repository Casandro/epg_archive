  description: Erstaunlich wenig Protest erntet Tierpflegerin Marina Fanke, als sie Poitou-Eselfohlen Melanie mit Kamm und Schere zu Leibe rückt. Das Fell dieser französischen Eselrasse ist besonders lang und dicht und bedarf deshalb einer intensiven Haarpflege. Bei einem weiteren französischen Import - den Rotbauchmakis - ist dem Tierpark erstmals Nachwuchs gelungen. Dr. Andreas Pauly ist deshalb mächtig stolz auf Lemuren-Kind Shari. Nicht ganz so erfreulich ist das ständige Bedürfnis der Makis, ihre Umgebung zu markieren. Beim Besuch wird dem Tierarzt dieser Hang zum Markieren leider auf unangenehme Weise zuteil.
