  description: Andreas Hartwich bricht sich bei einer Mutprobe die Hand. Er wollte seinen Kumpels Nervenstärke beweisen und sprang erst im allerletzten Moment vor einer herannahenden Straßenbahn vom Gleis. In der Sachsenklinik gesteht Andreas seinem Freund Lars, dass er nicht krankenversichert ist. Als die beiden sehen, dass auch der Straßenbahnfahrer Günther Bornemann eingeliefert wird, kommt Lars die Idee, eine Anzeige gegen Unbekannt zu erstatten. Andreas solle einfach behaupten, Bornemann hätte ihn an einem Fußgängerüberweg übersehen. In der Zwischenzeit wird bei Günther Bornemann aufgrund des Schocks ein Herzanfall diagnostiziert.
