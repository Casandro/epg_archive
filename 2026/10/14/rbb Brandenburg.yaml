  title: Guck mal Retro - Schönes Wetter heute ...
  episodeUri: crid://onid-1/e/6a989f5f2d07852659fe07b9
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Das Wetter, es war schon immer da, und auch schon immer ein dankbares Thema im Deutschen Fernsehen.\nAm Deuten und Erklären meteorologischer Sonderbar- und Eigenartigkeiten versuchten sich viele, mit mehr oder minder Erfolg. Der eine lag richtig, der andere, na ja, im besten Fall ein klein wenig daneben. Eigentlich ganz wie heute, wo die technischen Möglichkeiten über Radarschirm, Blitzpeilgeräte, Wetterballons und \"Nase in den Wind\"-Halten hinaus gehen. \nKurzweilig, amüsant und unterhaltsam aber war es auch damals, als die Bilder noch schwarz-weiß waren."
