  title: Gott erlebt (Staffel 2)
  subtitle: 'Hubert Liebherr - Teil 1: Mit dem Privatjet zur Muttergottes'
  description: 'Zu Weihnachten ging Carina Faust mit ihren Geschwistern regelmässig in die Messe und empfand die Krippe als anschauliche anrührende Darstellung eines Märchens. Erst als sie später in eine berufliche Krise geriet und begann, ernsthaft nach dem Sinn ihres Lebens zu fragen, veränderte sich ihr Blick. Nichts vermochte ihre innere Leere aufzufüllen. Eine Einladung zu einem Alphakurs wurde schließlich zum Wendepunkt und Schritt für Schritt näherte sie sich Christus an. Als ihr Mann eines Tages begann, in der Bibel zu lesen, dämmerte es ihr: Dass all diese Entwicklungen zusammenkamen, konnte kein Zufall sein - es musste ein Wunder sein.'
