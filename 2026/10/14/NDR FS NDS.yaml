  description: Kathrin Globisch ist in den homöopathischen Arzt Paul Andermatt verliebt. Paul, der sie fest an sich binden möchte, bietet ihr eine Mitarbeit in seiner Praxis an. Kathrin ist unsicher, was sie machen soll. Roland Heilmann bekommt ihr Zögern mit und glaubt, dass Kathrin einen Fehler macht. Seiner Meinung nach ist Paul nicht der richtige Mann für Kathrin. In der Klinik muss sich unterdessen die Marathonläuferin Iris Andermatt einer Knieoperation bei Dr. Heilmann unterziehen. Wegen ihres seltenen Nachnamens erkundigt sich Kathrin bei Paul nach ihr.
