- eventId: 695985
  start: 2026-10-14T04:40:00Z
  stop: 2026-10-14T04:50:00Z
  title: Topwater am Bach
  subtitle: Topwater am Bach
  description: 'Raubfisch-Angeln: Angeln in kleinen Bächen ist ein besonderes Highlight. Weg von allem, eintauchen in ein eigenes Biotop. Gerade Forellen und Döbel fühlen sich hier sehr wohl und während der warmen Jahreszeit besteht ihr Futter oft aus Mücken, Käfern und Kleinfischen an der Wasseroberfläche. Daher liegt es nahe sie auch genau dort zu beangeln. Hierfür nutzen wir kleine Popper, Stickbaits und Crawler, welche die natürliche Beute sehr genau imitieren. Hemmungslose Attacken der Räuber sind die Folge und bringen uns als Anglern sehr viel Spass und Erfolg. Das Angeln auf die Bachbewohner mit Oberflächenködern ist sehr spektakulär und Spannend gleichermaßen.    DE 2015'
- eventId: 695986
  start: 2026-10-14T04:50:00Z
  stop: 2026-10-14T05:02:00Z
  title: Unmöglicher Musky
  subtitle: Unmöglicher Musky
  description: Muskys, die größeren Verwandten unseres heimischen Hechtes, stehen ganz oben an der Nahrungskette in nordamerikanischen Gewässern. Sie gelten als besonders aggressiv und beißen hervorragend auf Oberflächenköder. Klare Sache, diese Fische stehen ganz oben auf der Bucket List. Einfach zu fangen sind sie aber trotzdem keineswegs. Wenn aber der erste Biss erfolgt, lässt es einem das Blut in den Adern gefrieren. Klar denken, richtig handeln und cool bleiben - unmöglich. Aber dann passiert das Unfassbare und ein heißer Tanz am Barschgerät beginnt. Kein Stahlvorfach, ca. 50 Meter alte Monofile Schnur auf der Rolle und ein wilder Tiger - Musky am anderen Ende. Mehr Glück als Verstand war am Ende entscheidend für uns. We came, we conquered and we took. Beflügelt von diesen Ereignissen begaben wir uns auf einen Road Trip ins nördliche Michigan, UP, Upper Pennisula, die Obere Halbinsel. Umrandet von drei der Great Lakes, Lake Michigan im Süd-Westen, Lake Huron im Süd-Osten und Lake Superior im Norden bildet sie den menschenleersten Teil Michigans. Endlose Weiten, Natur pur und Wasser ohne Ende. Unsere Recherchen im Vorfeld führten immer wieder auf ein ganz besonderes Gewässer. Dollarville Flooding, ein Staubereich des Taquamenon Rivers, welcher einen sehr guten Bestand an Muskys aufweisen sollte. Leider lief uns die Zeit davon und wir konnten nur wenige Stunden angeln, als auf einmal Hektik auf dem Boot ausbrach. DE 2017
- eventId: 695990
  start: 2026-10-14T05:05:00Z
  stop: 2026-10-14T05:17:00Z
  title: Fliegende Schwarzbarsche und Topwater Hechte
  subtitle: Fliegende Schwarzbarsche und Topwater Hechte
  description: The Hidden Lake, der schönste Angelplatz, jeder Angler hat seinen eigenen favourite fishing spot.Klar, dass wir diesen Platz nicht nur gesucht, sondern auch gefunden haben. Unser Wegführte uns fernab der Straßen auf einem kleinen Trail zuerst an den unfassbar großen Lake Superior, bis wir letztendlich am Chappel Lake angekommen sind. Ein kleiner See der nur durch einen längeren Fußmarsch von ca. 3 Stunden zu erreichen ist. Als wir endlich am Ziel unserer Reise waren hatten wir die beste Zeit unseres Lebens. Trotz alledem waren wir immer auf der Suche nach neuen Ufern. Nach einem Temperatursturz und einigen zähen Angeltagen war der Entschluss klar, wir mussten uns etwas anderes überlegen. Also rein ins Auto und los gehts. Eine ungefähr Route im Kopf und die Prämisse, immer wenn Wasser in Sicht ist, anhalten und einige Würfe machen. In einem kleinen Graben neben der Straße wimmelte es nur so von kleinen Hechten, die sich wie wild auf unsere Oberflächenköder stürzten, aber von den Schwarzbarschen fehlte jede Spur. Am letzten Zielort, dem Dead Stream Flooding angekommen, war zwar das Pech auf unserer Seite aber ein neues Gewässer mit dicken Schwarzbarschen und enorm viel Potential gefunden. Die perfekte Gewässerstruktur. Überall wo das Auge hinfällt Wasserpflanzen, tote Bäume, ein Traumrevier zum Topwater-angeln auf Schwarzbarsch. Nach einem sehr guten Start und den ersten Fischen war die Motivation enorm hoch. Aber irgendwie sollte es an diesem Tag nicht so recht klappen. Die Fische explodierten an der Wasseroberfläche, waren zum Teil komplett in der Luft und lieferten spannende Attacken. Nur bei der Bissverwertung hatten wir enorme Probleme. Gegen Abend wurden sie immer noch hemmungsloser, aber nahezu jede der gegebenen Chancen ließen wir links liegen. Richtig fette Bisse, im Drill verlorene Fische und Moskitos in riesigen Mengen machten diesen Tag zum Alptraum für uns. DE 2017
- eventId: 695991
  start: 2026-10-14T05:20:00Z
  stop: 2026-10-14T05:31:00Z
  title: Massenfänge am Detroit River
  subtitle: Massenfänge am Detroit River
  description: Zwei verrückte Angler fliegen in die USA, um sich dort mit Schwarzbarschen, Smallies, Muskys und Co. anzulegen. Im Vorfeld der Reise wird das Tackle fürs Topwaterfischen zusammengestellt, die Route geplant und Gewässer gescoutet. Endlich angekommen - die Angellizenz in der Tasche - geht es für die letzten Besorgungen noch zum Bass Pro Shop und danach ab ans Wasser. Und die ersten Largemouth lassen nicht lange auf sich warten. Aber auch scheinbar fischleere Gewässer und Niederschläge kommen schneller als gedacht. Doch das Ende des ersten Tages klingt versöhnlich bei einer Catfish Session aus.  Bereits am zweiten Tag erwartet uns ein absolutes Highlight. Mit dem Speedboat mitten durch Detroit, auf der Suche nach Walleyes. Der Amerikanische  Zander zieht jeden Frühling in wahnsinnigen Massen zwischen Lake St. Clari und Lake Erie durch den Detroit River. Diesem Spektakel folgen jährlich tausende von Anglern aus ganz USA. Schade nur, dass der Reisezeitraum, Mitte Mai, etwas zu spät dafür war. Ortsansässige Fischer hatten es bereits bestätigt, dass die Zander durch sind. Nichtsdestotrotz besteht die ganze Saison die Möglichkeit, Fische zu fangen. Im gleichen Atemzug folgte jedoch der Bericht über den Silverbass Run, welcher voll im Gange sein sollte. Doppeldrills, Bisse beim Jiggen, Aufkurbeln und Durchsacken, Action ohne Ende. Eine sehr spannende, lustige und kurzweilige Fischerei in riesigen Fischschwärmen und die Chance vor Augen, doch noch einen Walleye unter den ganzen Silverbass zu fangen. DE 2017
- eventId: 695994
  start: 2026-10-14T05:35:00Z
  stop: 2026-10-14T05:57:00Z
  title: Gib Gummi an der Talsperre
  subtitle: Gib Gummi an der Talsperre
  description: In den Sommermonaten ist es oft nicht so einfach, erfolgreich den Räubern einer Talsperre auf den Zahn zu fühlen. Welche Montagen Sinn machen und welche Angelstellen zuverlässig liefern bekommt man am besten durch ständiges wechseln und versuchen heraus. Oftmals macht der Pflanzenbewuchs in den Gewässern die Sache deutlich komplizierter als in den kalten Monaten des Jahres. Um trotzdem Fische zu überlisten und den Angeltag erfolgreich zu gestalten, gibt es hierzu jede Menge Tipps und Tricks. DE 2022
- eventId: 695996
  start: 2026-10-14T06:00:00Z
  stop: 2026-10-14T06:22:00Z
  title: Topwaterangeln im Juli - 12 Monats Challenge
  subtitle: Topwaterangeln im Juli - 12 Monats Challenge
  description: Der eigentliche Plan, Hechte und Barsche in einem sehr flachen, verkrauteten Gewässer zu fangen, hat anfänglich auch sehr gut funktioniert. Da aber in der Mittagszeit bei 35 Grad die Bisse ausgeblieben sind, ging es nach einer Pause spontan an ein großes Fließgewässer in der Nähe. Schnell war der Hotspot ausgemacht und die erste Fehlattacke zu verbuchen. Dann passierte lange nichts, auch andere Stellen führten nicht zum Erfolg. Das Vertrauen in den richtigen Köder und die beste Angelstelle zahlte sich jedoch am Ende aus und es gab einen brachialen Biss, gefolgt von einem heftigen Drill in der Strömung. Das ist Topwater Angeln! DE 2022
