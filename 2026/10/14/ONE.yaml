  description: "Dass Sebastian bald in die USA verschwinden will, hebt Maurices Laune erheblich. Sebastian bemerkt das und fängt an zu grübeln: Hat Maurice Einfluss darauf genommen, dass man ihn nach Texas zum Vorstellungsgespräch am meteorologischen Institut geladen hat?\n \nThomas steht als OB weiter unter großem Druck, kann sich aber wenigstens wieder mit Merle versöhnen. Als Marlies ein gelungenes Konzept für ein ökologisches Sozialwohnprojekt vorlegt, müssen beide einsehen, dass dies die beste Nutzung für das Flughafengelände wäre.\n \nInge versucht, Udos Geständnis, sich in Marlies verguckt zu haben, zunächst mit Gelassenheit zu begegnen."
