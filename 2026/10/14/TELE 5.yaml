  subtitle: Die Invasion, Teil 1
  description: |-
    Dr. Daniel Jackson landet in einem Paralleluniversum, in dem die Goa'uld mit der Invasion der Erde begonnen haben. Teile Europas und die Ostküste der USA wurden bereits ausradiert! Nun gerät in der alternativen Realität auch die Militärbasis in den Cheyenne Mountains ins Visier der Aliens. Allerdings hat Jackson dort keinerlei Befugnisse, da ihn niemand kennt. Da der Archäologe überzeugt davon ist, dass auch in "seiner" Dimension ein Angriff der Goa'uld bevorsteht, muss er schleunigst einen Weg zurück finden, um die Menschheit vor der tödlichen Invasion zu warnen.
