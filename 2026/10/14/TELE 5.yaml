  title: Windtalkers
  description: "Zweiter Weltkrieg, die US-Marine hat ein Problem: Die feindlichen Japaner entschlüsseln permanent ihre Funksprüche und verschaffen sich dadurch Vorteile im Kampf im Pazifik. Die rettende Idee ist der Navajo-Code. Angehörige des Indianervolkes wie Ben (Adam Beach) werden als Funker verdingt. Aufgabe des Soldaten Joe (Nicolas Cage) ist es, um jeden Preis Bens Leben zu schützen.  Um für möglichst viel Authentizität zu sorgen, nahmen die meisten Hauptdarsteller an einem Bootcamp teil - zwei Wochen hartes Militärtraining ähnlich wie für Marines im Zweiten Weltkrieg, das sogar mit Hilfe des Verteidigungsministeriums organisiert wurde. \nUSA 2002"
  widescreen: true
