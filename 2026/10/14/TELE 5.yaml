  title: Stargate
  subtitle: Enigma
  description: |-
    Die Tollaner sind eine extrem hochentwickelte Zivilisation. Allerdings drohen Supervulkane den Heimatplaneten der Humanoiden zu zerstören. Daher beschließt die Stargate-Spezialeinheit, angeführt von Colonel Jack O'Neill, eine Handvoll Überlebender auf die Erde zu evakuieren. Bei den primitiven Erdlingen in der Stargate-Basis wollen die Aliens jedoch keinesfalls bleiben. Daher schlägt Dr. Jackson die Welt der Nox als ebenbürtiges Ersatzzuhause vor. Sehr zum Ärger des Geheimdienstes NID - denn dieser will die futuristische Technik der Tollaner falls nötig mit Waffengewalt erbeuten.
