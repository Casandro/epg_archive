  title: Stargate
  subtitle: Übermenschen
  description: |-
    Auf dem Planeten PX-3989 findet sich das Stargate-Spezialkommando in einer Art Forschungslabor wieder. Geleitet wird die Station von einem verrückten Professor namens Harlan, der angeblich 11.000 Jahre alt ist. Doch als Colonel Jack O'Neill, Teal'c und die anderen aus dem Koma erwachen, machen sie eine verstörende Entdeckung: Der außerirdische Ingenieur hat das Bewusstsein der Vier in täuschend echte Roboter verpflanzt! Das SG-1-Team besteht nun also aus Replikanten. Wird es der geschockten Gruppe gelingen, ihre biologischen Körper zurückzuerlangen?
