  title: Stargate
  subtitle: Im ewigen Eis
  description: |-
    Ausgelöst durch eine technische Fehlfunktion am Stargate wird das SG-1-Team unsanft auseinandergerissen. Teal'c und Dr. Jackson schaffen es zum Bunkersystem der U.S. Air Force. Aber derweil sind Captain Carter und Colonel O'Neill an einem unbekannten Ort im ewigen Eis gefangen! Während der Colonel schwerverletzt in einer Gletscherspalte steckt, suchen General Hammond und der Rest der Truppe fieberhaft nach einem Weg, die Vermissten nachhause zu holen. Als es gelingt, die beiden zu lokalisieren, sorgen die Koordinaten für eine Riesenüberraschung: Carter und O'Neill sind an einem bislang unbekannten Sternentor in der Antarktis gelandet.
    USA 1997
