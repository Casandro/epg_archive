  title: Vizitka
  description: 'Jakub Rataj, hudební skladatel a umělecký ředitel Contempuls. Po pěti letech obnovil festival soudobé hudby Contempuls, který se chystá na přelomu října a listopadu. Sám taky komponuje a ve své tvorbě zkoumá možnosti současné orchestrální, komorní i elektroakustické hudby a zajímá ho také vztah organizovaného zvuku a lidského těla. "Často se setkávám s tím, že lidé, kteří jdou jednou na koncert soudobé hudby, jsou natolik zmatení, že pak musí jít znovu," popisuje ve Vizitce. Jak otevírat pole současné vážné muziky širšímu publiku? Do jaké míry promlouvají do uměleckého oboru jako je hudební kompozice nové technologie? A co vybádal z básní Vladimíra Kokolii? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
