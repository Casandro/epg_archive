  description: '4. díl: Neoficiální kultura. Neoficiální kultura na pražském Jižním městě v devadesátkách. To je téma nové epizody ze série Vladimíra 518. Vladimír se v ní se svým souputníkem Orionem vrací na Jižní město, do míst, ve kterých vznikaly jejich první nahrávky, tagy a graffiti. Na procházku v ulicích navazuje bonusový studiový rozhovor obou protagonistů.'
