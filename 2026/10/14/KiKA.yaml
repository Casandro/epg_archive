  description: |-
    Das Versprechen

    Der kleine braune Hase hat es eilig mit dem Essen fertig zu werden, denn die kleine Feldmaus möchte ihm dringend die allerschönste Blume aller Zeiten zeigen, die sie auf einer Wiese entdeckt hat. Also isst er schnell auf und die beiden laufen zur Blume. Und die ist wirklich wunderschön. Die Feldmaus beschließt sie zu ihrem allerliebsten Lieblingsding zu erklären und mit nach Hause zu nehmen. Der kleine braune Hase möchte die Blume zu gerne dem großen braunen Hasen zeigen und fragt, ob er sie nicht für einen Tag ausborgen könnte. Die kleine Feldmaus ist nicht sehr begeistert. Aber der kleine Hase verspricht ihr sehr gut darauf aufzupassen und leistet einen besonderen Schwur. Und so ein besonderer Feldmaus-Schwur darf nie im Leben gebrochen werden. Doch in der Nacht fegt der Wind die Blume unbemerkt fort. Der kleine braune Hase hat keine Wahl. Er muss seiner Freundin erzählen, was passiert ist. ...
