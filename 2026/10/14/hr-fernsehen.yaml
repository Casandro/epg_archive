  description: Im schmalsten Haus Frankfurts kocht der Küchenchef vom "Seven Swans" vegan und radikal regional. Sein Restaurant bietet nur 18 Plätze, doch auf einen Tisch warten tausende Gäste. Ricky Saward ist Deutschlands erster veganer Sternekoch und hat den Stern bis heute gehalten. Er will im Fine Dining beweisen, dass pflanzenbasierte Küche luxuriös sein kann und heimische Produkte alles dafür bieten. Für die Weinbegleitung sorgen Winzer wie Yvette Wohlfahrt und Florian Franke. Sie führen ein öko-zertifiziertes Weingut im Rheingau und haben sich auf hochwertige Naturweine spezialisiert.
