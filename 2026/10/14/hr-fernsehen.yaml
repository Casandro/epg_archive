  hd: true
  audiodesc: true
  subtitle: 'Moderation: Tobias Kämmerer'
  description: "Moderator Tobi Kämmerer erkundet den jungen Naturpark Knüll und entdeckt bei seiner Reise beeindruckende Landschaften, spannende Freizeitangebote und außergewöhnliche Menschen. Von einer interaktiven Schatzsuche am Christeröder Wasserfall über Offroad-Abenteuer und den Silbersee bis zum Mountainbike-Training am Eisenberg erlebt er die Region von ihrer abwechslungsreichsten Seite. \n\n\"Tobis Urlaubstrip: Naturpark Knüll\" zeigt Natur, Action und Geheimtipps für einen Urlaub direkt vor der Haustür."
