  start: 2026-10-14T06:55:00Z
  stop: 2026-10-14T07:35:00Z
  title: 'Bike Mike: Durch die Toskana - Teil 4: Von Pisa über Cecina Mare und Volterra zurück nach San Gimignano'
  subtitle: 'Bike Mike: Durch die Toskana - Teil 4: Von Pisa über Cecina Mare und Volterra zurück nach San Gimignano'
  description: Spielball der Naturgewalten und Toskana at its best zum Abschluss!! Hier seht ihr die fünfte und sechste Etappe unserer Toskana Rundfahrt von Pisa über das Mittelmeer bei Cecina und die atemberaubende Stadt Volterra zurück nach San Gimignano. Wir haben Rad-Saisoneröffnung dieses Jahr mitten nach Italien gelegt. In 6 Etappen sind wir insgesamt 380 km mit jeder Menge Höhenmeter in einer Rundreise durch die traumhafte Toskana gefahren. Dabei haben wir neben der malerischen Landschaft mit ihren Zypressen, Olivenhainen und Weinreben übersäten Hügeln u.a. die kulturhistorischen Städte San Gimignano, Siena, Florenz, Lucca, Pisa und Volterra genossen. Auch dem Mittelmeer haben wir einen Besuch abgestattet und das leibliche Wohl kam natürlich auch nicht zu kurz. Alles in allem ein traumhafter Einstieg in die ereignisreiche Radsaison. Kommt einfach mit und begleitet uns auf dieser wunderschönen Reise! DE 2022
