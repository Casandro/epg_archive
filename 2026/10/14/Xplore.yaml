- eventId: 695730
  start: 2026-10-14T09:35:00Z
  stop: 2026-10-14T09:59:00Z
  title: VIP Trip - Prominente auf Reisen 7 - Umag mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 7 - Umag mit Oliver Hörner
  description: 'Urlaub in der Nebensaison und nicht zu weit weg von zu Hause? Mit allen Annehmlichkeiten wie Wellness, Sport, Kultur und Kulinarik? Dann begleiten Sie in dieser Folge Oliver Hörner nach Kroatien und zwar den nördlichen Teil der Halbinsel Istrien. Rund um Umag taucht er in die Geschichte ein, schlendert durch Olivenhaine und besucht Weingüter. Die mediterrane Küche Nordistriens wird bestimmt von regionalen Produkten. Schwärmen Sie auch von weißem oder schwarzem Trüffel? Vielseitige Sportmöglichkeiten mit Radfahren, Tennis, Padel und Golf und attraktive Wellness-Angebote runden das Programm ab. So lässt Oliver Hörner auf seiner Reise  einfach die Seele baumeln: in Nordistrien rund um Umag. HR 2024'
- eventId: 695731
  start: 2026-10-14T10:05:00Z
  stop: 2026-10-14T10:30:00Z
  title: VIP Trip - Prominente auf Reisen 7 - Hongkong mit Florian Fitz
  subtitle: VIP Trip - Prominente auf Reisen 7 - Hongkong mit Florian Fitz
  description: 'Die Reise von Florian Fitz nach Hongkong ist ein Wiedersehen mit der chinesischen Metropole am Perlfluss-Delta - bereits in den 1990er Jahren hat er dort Theater gespielt. Zusammen mit seiner Lebensgefährtin Nicole will er nun herausfinden, ob und wie sich die Großstadt seitdem verändert hat. Florians Reisekalender führt ihn daher zunächst in die Straßenschluchten von Hong Kong Island sowie Kowloon und zu deren Sehenswürdigkeiten, darunter auf den Victoria Peak und zum Pferderennen im modernen Hippodrom von Happy Valley. Beim Besuch des Hafens von Aberdeen lernen der Schauspieler und seine Begleitung das Leben der Fischerfamilien kennen, die seit vielen Jahren auf ihren Booten leben und arbeiten. Auch wenn mehr und mehr von ihnen aufs Land ziehen: Die Traditionen dieser "boat people" sind noch immer lebendig und das Geschäft mit fangfrischem Fisch hat noch immer Konjunktur. Der West Kowloon Cultural District ist eine der feinsten Adressen für Kunst- und Kulturliebhaber. Grund genug für Florian Fitz sich die Sammlungen des hier ansässigen "Hong Kong Palace Museums" anzusehen. Darunter befinden sich Exponate aus der Verbotenen Stadt in Peking, die bisher noch nie öffentlich ausgestellt waren. Das Interesse an chinesischer Geschichte und Kultur führen Florian und Nicole auch zu einem Meister des Wing Tsun, einer Form der Kampfkunst. Die Streifzüge des Berliner Pärchens bringen viele neue und unbekannte Facetten der Metropole ans Licht. Die vielleicht überraschendste Erkenntnis: Hongkong besteht keineswegs nur aus Wolkenkratzern und Shopping-Palästen, sondern ist auch vielerorts auffallend grün. Wer weiß schon, dass es in Hongkong 263 teilweise unbewohnte Inseln gibt? HK 2025'
