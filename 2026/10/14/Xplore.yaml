  start: 2026-10-14T18:45:00Z
  stop: 2026-10-14T19:11:00Z
  title: Andy & Ben eat Australia - Folge 14
  subtitle: Andy & Ben eat Australia - Folge 14
  description: 'Frazer Island ist nicht nur die größte Sandinsel der Welt und einer der schönsten Orte Australiens - sondern auch das heutige Reiseziel auf Andys kulinarischem Roadtrip! Andy tischt auf: viele coole Sprüche und einen fangfrischer Snapper mt Fingerlimetten-Dressing. AU 2016'
- eventId: 695764
  start: 2026-10-14T19:15:00Z
  stop: 2026-10-14T19:59:00Z
  title: Pures Leben
  subtitle: Pures Leben
  description: 'Der Film zeigt die unglaubliche Reise von den Anden zum Atlantik: Hervé Neukomm legte innerhalb von 20 Monaten über 7.500 Kilometer in 26 verschiedenen Gewässern zurück. Im Jahr 2004 bricht Hervé mit dem Fahrrad aus der Schweiz auf, um nach Tibet zu fahren - doch seine Reise nimmt eine plötzliche Wendung. Nachdem er sieben Wüsten durchquert hat und in Namibia ankommt, hat er ein großes Verlangen nach Schatten und Wasser. Da kommt ihm eine verrückte Idee: Er will ein Holzboot mit einem Strohdach bauen und sein Fahrrad als Motor benutzen, indem er Propeller daran befestigt. Nach 40.000 Kilometern auf Straßen und unebenen Wegen kommt er in Tena, Ecuador, an, wo für ihn das spannendste Abenteuer seines Lebens beginnt. Mit seinem Boot ''Pura Vida'' ("Pures Leben") gelingt es ihm, die Kräfte der Natur zu ertragen und unvergessliche Momente mit den Indianern, den Tieren - besonders mit Delfinen - aber auch mit Piraten und Drogendealern zu erleben. Hervé Neukomm ist die erste Person, die durch den Amazonas mit dem Fahrrad fährt, ausschließlich mit der Kraft der Beine. Er wollte keinen Rekord brechen, sondern hatte das Verlangen, mit einer umweltfreundlichen Transportmethode so nah wie möglich in der Natur zu leben und einige ihrer Geheimnisse zu entdecken.  DE 2016'
- eventId: 695765
  start: 2026-10-14T20:10:00Z
  stop: 2026-10-14T20:38:00Z
  title: Foodwise - Datong
  subtitle: Foodwise - Datong
  description: Tianran He und Angela Fu befinden sich im historischen Datong. Datong liegt in der nordchinesischen Provinz Shanxi und war vor etwa 1500 Jahren die Hauptstadt der Nördlichen Wei-Dynastie, in der Nomaden Nordchina vereinten und sich der Buddhismus im ganzen Land verbreitete. CN 2022
- eventId: 695766
  start: 2026-10-14T20:40:00Z
  stop: 2026-10-14T21:09:00Z
  title: Foodwise - Chaozhou
  subtitle: Foodwise - Chaozhou
  description: Die Gastgeber Tianran He und Angela Fu sind in Chaozhou in Südchina. Sie wollen die Geheimnisse des Erfolgs der Stadt lüften, denn Chaozhou ist berühmt für seine wohlhabenden Kaufmannsgilden und seine einheimische Teochew-Küche, die weltweit Anerkennung genießt. CN 2022
