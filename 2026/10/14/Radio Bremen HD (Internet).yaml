  subtitle: Film von Dörte Petsch
  description: Ungewöhnliche, noch nie im Fernsehen gezeigte Bilder erzählen die Geschichte von Hans Jalaß, einem alten Förster und seiner Liebe zur Natur und zu den Tieren. Fast 20 Jahre besucht er immer wieder eine Wildschweinrotte, kommuniziert mit ihnen und darf sie sogar streicheln. Genauso gelingt es ihm, den Wolf in außergewöhnlichen Situationen aufzunehmen. Der 72-Jährige hat ein besonderes Gespür für die Natur und die Tiere. Immer wieder geht er mit seiner Kamera auf die Pirsch, um einmalige Aufnahmen zu "schießen".
