  title: DAS! Rote Sofa
  subtitle: 'Gast: Biologe und Zoologe Dr. Tim Lüddecke'
  description: Spinnenalarm auf dem Roten Sofa! Denn diese Sendung widmet sich einem Tier, das viele Menschen hochschrecken lässt und dem sie tunlichst aus dem Weg gehen. Dr. Tim Lüddecke möchte das ändern, er selbst ist seit seiner Jugend fasziniert von den Achtbeinern. Der Biochemiker lehrt an der Justus-Liebig-Universität in Gießen und ist Gruppenleiter am Gießener Fraunhofer Institut für Molekularbiologie und Angewandte Ökologie, er beschäftigt sich auch mit Amphibien und Schlangen. Es wird spannend, zu erfahren, wie viele Spinnen und anderes Getier er selbst zu Hause hält. Und vielleicht kann er dem ein oder anderen die Spinnenangst nehmen.
