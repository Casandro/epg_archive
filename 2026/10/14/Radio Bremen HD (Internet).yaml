  title: Die Ernährungs-Docs (92)
  subtitle: Adipositas, PMOS und Endometriose, Knie-Arthrose
  description: |-
    In dieser Folge kommt ein Mann an Bord, der kurz vor einem radikalen Schritt steht. Sven K. denkt über eine Magenverkleinerungs-OP nach.

    Sahra M. bringt ein Problem mit, das viele Frauen kennen: Zyklusbeschwerden. Bei ihr sind sie besonders heftig. Durch eine Hormonstoffwechselstörung, das polyendokrine metabolische Ovarialsyndrom (PMOS, früher: PCOS) spielt ihr ganzer Körper verrückt.

    Sylke R. kann nur unter starken Schmerzen die Hausbootpraxis betreten: Sie hat Kniearthrose und Sorge, dass sie bald gar nicht mehr laufen kann. Dabei ist die Lehrerin aus Rerik eigentlich sehr aktiv.
