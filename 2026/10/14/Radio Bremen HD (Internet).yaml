  title: DAS! Rote Sofa
  subtitle: 'Gäste: Jessica Wahls und Lucy Diakovska von den No Angels'
  description: Was im Jahr 2000 mit einer Castingshow im kommerziellen TV begann, ist ein Vierteljahrhundert später noch nicht beendet. Im Laufe der Jahre erlebte die Popgruppe No Angels einen ungeahnten Aufstieg, persönliche Rückschläge, aber auch immer wieder Comebacks. Auf dem Roten Sofa werden Lucy Diakovska und Jessica Wahls von wilden Zeiten berichten, die sie gemeinsam mit ihren Mitstreiterinnen Nadja Benaissa und Sandy Mölling durchlebten. Anlass des Besuchs ist die dreiteilige Dokumentation "No Angels - Das sind wir", die ab dem 14. Oktober in der ARD Mediathek abrufbar ist.
