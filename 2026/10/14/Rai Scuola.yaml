  title: Ciclo Amarcord - Ritratti di città - Anc
  subtitle: Ciclo Amarcord - Ritratti di città - Ancona - ATTUALITA' - La puntata presenta Ancona come una nave protesa sull'Adriatico, valorizzandone la vocazione marinara e la funzione di cerniera tra la costa e l'..
  description: "ntroterra. Il percorso esplora lo scalo dorico e la modernizzazione della pesca, sebbene frenata dalle carenze nella catena del freddo. Dal litorale lo sguardo si protende verso la campagna circostante, dove le nuove generazioni aprono la strada all'innovazione colturale e al florido mercato delle sementi. Questo dinamismo giovanile si specchia nei fermenti sociali di fine decennio e trova eco nelle colline leopardiane, culla della rivoluzione beat che alimenta l'industria degli strumenti elettronici accanto alla storica e rinnovata tradizione della fisarmonica. L'itinerario prosegue celebrando i grandi pilastri produttivi e culturali della regione: dai prestigiosi cantieri navali dorici all'eccellenza artigianale delle secolari cartiere di Fabriano, fino alle vette artistiche dell'Arco di Traiano e del Duomo di San Ciriaco. Il viaggio si conclude tra la produzione artigianale e industriale dei rosari a Loreto, suggellando il ritratto di una comunità definita nel filmato come fatta di italiani tranquilli, ma animata da un grande spirito e da una straordinaria tempra imprenditoriale. \n - Programma di Enrico Gras e Mario Craveri \nFotografia: Franco Castelli \nContenuto musicale: Franco Potenza  \nVoce: Rolf Tasna \nConsulenza: Luca Pinna \ndel 1968,"
