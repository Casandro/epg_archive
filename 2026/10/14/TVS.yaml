  title: 'Rosamunde Pilcher: Niania pilnie potrzebna 14 (odc. 8)'
  subtitle: Amy Truman, absolwentka słynnej Nanny School w Boldham, traci w okresie próbnym już drugą pracę za atak na natrętnego fotografa. Została jej jedna jedyna szansa na dokończenie stażu.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Nanny verzweifelt gesucht
    DE, 2018
    Reżyseria: Heidi Kranz
    Występują: Ruby O. Fee, Marc Schöttner, Jonathan Beck, Rufus Beck, Anja Nejarri, Vijessna Ferkic
    Amy Truman, absolwentka słynnej Nanny School w Boldham, straciła w okresie próbnym już drugą pracę za atak karate na natrętnego paparazzo. Została jej jedna jedyna szansa na dokończenie stażu. Ląduje u Ryana Rushtona, który po skończeniu enologii na Uniwersytecie w Kapsztadzie wrócił do Kornwalii, ponieważ jego ojciec, Andrew, miał wylew.
  genre:
  - '22'
- eventId: 1570955
  start: 2026-10-14T19:50:00Z
  stop: 2026-10-14T21:35:00Z
  title: 'Rosamunde Pilcher: Odziedziczone szczęście 1 (odc. 144)'
  subtitle: Nelly jest świadkową na ślubie swojej siostry Eve i jej narzeczonego Billa. Świadkiem Billa jest jego najlepszy przyjaciel Leo.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Geerbtes Glück
    DE, 2018
    Reżyseria: Stefan Bartmann
    Występują: Maxi Warwel, Florian Odendahl, Roman Knižka, Götz Schubert, Carin C. Tietze, Kim Sarah Brandts
    Nelly jest świadkową na ślubie swojej siostry, Eve, i jej narzeczonego, Billa. Świadkiem jest najlepszy przyjaciel Billa, Leo. Młodzi chętnie by zeswatali tę dwójkę. Ci jednak spotkali się już wcześniej i czują wzajemną antypatię. Eve ma niespodziankę dla Nelly i swojego ojca, Tony'ego. Zaprosiła na ślub i wesele kolumbijską matkę obu dziewcząt, Sofię, która przed laty zostawiła swojego męża z dwiema córkami. Wszyscy biorą się jednak w garść, ponieważ nie chcą psuć ślubu ciężarnej Eve.
  ageRating: 12
  genre:
  - '22'
