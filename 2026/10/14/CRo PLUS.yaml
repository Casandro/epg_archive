  description: Bohumil Pečinka, politický komentátor, spoluautor podcastu Kecy a politika. Poražení se tentokrát najdou skoro na všech stranách, snad vyjma Starostů a nezávislých. ANO zjišťuje, že samotné vítězství k vládnutí nestačí. ODS sčítá ztráty tam, kde dřív měla bašty. A Pirátům se rozplynul sen, že znovu ovládnou pražský magistrát. Pro koho byly volby jasnou nevýhrou? Byly referendem o vládě? A co výsledky komunálních voleb a současná vyjednávání říkají o kondici občanských demokratů? Ptá se Barbora Tachecí.
