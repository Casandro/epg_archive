  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Jana Jelínková je zpěvačka kapely Sto zvířat, která vydává desku Žádná poezie, a učitelka na základní škole: "Hlavní pocit z naší hudby je pro mě radost a baví mě taškařice v našich textech," říká a dodává: "V textech teď víc bilancujeme o tom, co nás v životě potkalo." Jak prožila se spoluhráči obchod kapelníka Jana Kaliny? Jak se stárne s rock''n''rollem? Co si myslí o politice? A dá se srovnat působení před třídou dětí s vystoupením zpěvačky na pódiu? Moderuje Petr Vizina.'
