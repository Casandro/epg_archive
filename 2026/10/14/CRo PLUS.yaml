  title: Kniha dne
  description: 'Jan Štifter: Vltavice (Vyšehrad). V novém románu, doprovázeném ilustracemi Jaromíra 99, se autor obrací k místu, které smetly dějiny 20. století - k Dolní Vltavici, vesnici, která skončila na dně vodní nádrže Lipno. Ve dvou propletených časových rovinách sledujeme osudy desetiletého Dora ze starých časů a šedesátileté Emy v současnosti, kteří se každý po svém vyrovnávají se ztrátou domova, paměti a rodinných pout. Připravila Michaela Vetešková.'
