  title: Eisenbahn-Romantik (828)
  subtitle: KuK-Monarchie-Dampf-Express
  description: Diese Sonderfahrt erinnert an die Dampflok-Zeiten der k.u.k.-Monarchie. Die zehntägige Reise führt über Wien nach Tschechien, in die Slowakei und wieder zurück nach Österreich. Insgesamt sind elf verschiedene Dampflokomotiven vor dem Sonderzug im Einsatz. Teil 1 beschäftigt sich hauptsächlich mit der großen Jubiläumsausstellung "175 Jahre Eisenbahn in Tschechien", die in der österreichisch-tschechischen Grenzstadt Breclav (Lundenburg) stattfindet. Das Motto der Veranstaltung lautet "Vom Dampf zum Railjet".
