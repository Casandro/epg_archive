  title: Die besten Köche der Welt - Zu Gast im Ikarus - Das Ikarus Team und Roland Trettl
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Das Ikarus Team und Roland Trettl
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Diesmal im Hangar 7- das Ikarus Team kocht selbst. Kein Gastkoch gibt diesen Monat den Ton an - das Menü ist "hausgemacht". Auf den Tisch kommt nur was den strengen Augen des Chefs genügt.  AT 2012'
