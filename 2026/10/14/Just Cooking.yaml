  title: Faraway Village - Frittierter Fisch
  subtitle: Faraway Village - Frittierter Fisch
  description: Ein riesiger Fisch wird ausgenommen und gewürzt, dann frittiert, bis er goldbraun und knusprig ist. Beim Herausnehmen aus dem Öl kommt eine knusprige Kruste und ein zartes Inneres zum Vorschein. AZ 2025
- eventId: 695916
  start: 2026-10-14T15:55:00Z
  stop: 2026-10-14T16:24:00Z
  title: Faraway Village - Mozzarella
  subtitle: Faraway Village - Mozzarella
  description: Frische Milch wird schonend erhitzt und fermentiert, dann wird der Käsebruch geschnitten, gedehnt und zu traditionellem Mozzarella-Käse geknetet, von Hand geformt und in Salzlake abgekühlt, um eine glatte, elastische Textur zu erhalten. AZ 2025
- eventId: 695917
  start: 2026-10-14T16:25:00Z
  stop: 2026-10-14T16:53:00Z
  title: Faraway Village - Steaks und Burger aus dem Smoker
  subtitle: Faraway Village - Steaks und Burger aus dem Smoker
  description: Steaks und Burger werden gewürzt und in einen selbstgebauten Fassräucherofen gegeben, dann langsam geräuchert und gegart, bis sie braun und saftig sind. Vor dem Servieren werden sie dann bei höherer Hitze für eine knusprige Kruste fertiggestellt. AZ 2025
- eventId: 695918
  start: 2026-10-14T17:00:00Z
  stop: 2026-10-14T17:31:00Z
  title: Faraway Village - Süße Erdbeer-Marmelade
  subtitle: Faraway Village - Süße Erdbeer-Marmelade
  description: Erdbeeren werden in einer Steinpresse zerdrückt und anschließend zu Erdbeermarmelade eingekocht, bis sie dickflüssig und glänzend ist. Danach wird sie abgeschöpft und zum Festwerden und Abkühlen in Gläser gefüllt. AZ 2025
- eventId: 695919
  start: 2026-10-14T17:35:00Z
  stop: 2026-10-14T18:08:00Z
  title: Faraway Village - Kuchen mit Brennessel-Füllung
  subtitle: Faraway Village - Kuchen mit Brennessel-Füllung
  description: Wilde Brennnesseln werden geputzt und gehackt, um eine herzhafte Füllung zu erhalten. Anschließend werden sie in Teig gewickelt und zu rustikalen Brennnesselpasteten gebacken, bis der Teig goldbraun und das Grün weich ist. Dann können sie in Scheiben geschnitten und warm serviert werden. AZ 2025
