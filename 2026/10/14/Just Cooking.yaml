  title: Die besten Köche der Welt - Zu Gast im Ikarus - Jacob Jan Boerma in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jacob Jan Boerma in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er ist der Shootingstar der Niederländischen Haute Cuisine. Zwei-Sterne-Koch Jacob Jan Boerma aus Vaassen ist der Gastkoch des Monats im Hangar-7. Leicht und bekömmlich, dabei aber trotzdem intensiv aromatisch - so wird diesmal in der Küche des Restaurant Ikarus gekocht. AT 2012'
