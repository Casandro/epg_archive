  title: 1985. Allarme nel Mediterraneo
  subtitle: Tutto accade tra il 7 e il 12 ottobre del 1985. Prima il sequestro della nave da crociera Achille Lauro da parte di un gruppo di terroristi palestinesi, poi la scoperta dell'omicidio del passeggero americano di orig
  description: |+
    ini israeliane Leon Klinghoffer, infine la notte di Sigonella, la base Nato in Sicilia dove si attua il braccio di ferro tra il Governo italiano e la Delta Force statunitense relativo alla consegna dei terroristi agli americani. La tensione cresce enormemente e si corre il rischio di una crisi internazionale che potrebbe mettere in difficoltà l'equilibrio tra Est e Ovest. Alla fine l'Italia fa valere la sua giurisdizione, sul suo suolo. Ma non è finita. Perché se i sequestratori vengono arrestati, l'aereo dell'Egypt Air con i mediatori a bordo parte e atterra all'Aeroporto di Ciampino a Roma. Uno dei mediatori è Abu Abbas, un alto esponente del Fronte Nazionale della Palestina, organizzazione che fa parte dell'ala estremista dell'OLP. E i caccia americani lo seguono fino sulla pista romana. Vogliono catturarlo. Il governo italiano, non avendo in quel momento le prove del coinvolgimento di Abu Abbas nel sequestro della nave, lo lascia partire per Belgrado. Nella storia dei rapporti fra l'Italia e gli Stati Uniti è il più grave incidente diplomatico che sia capitato. L'operazione politica e militare viene condotta in prima persona da Bettino Craxi e da Giulio Andreotti, in quel momento rispettivamente Primo Ministro e Ministro degli Esteri. In questa occasione l'Italia risponde con fermezza all'ingerenza degli alleati, ribadendo la ragione di poter decidere in piena autonomia sul proprio territorio e rifiutando le intromissioni di ogni tipo da qualsiasi Stato straniero. Un gesto di indipendenza e autonomia, una pagina importante e appassionante nella sua dinamica, della Storia del nostro paese. - Scritto e diretto da Giovanni Filippetto

