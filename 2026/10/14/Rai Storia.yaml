  title: Passato e presente Hannah Arendt, libert
  subtitle: Passato e presente Hannah Arendt, libertà politica e responsabilità - Autrice di importanti opere di riflessione storica, filosofica e politica, Hannah Arendt è stata un'intellettuale sempre pronta a parte
  description: "tecipare al dibattito pubblico del suo tempo, rivendicando la propria autonomia da ogni legame di appartenenza personale o politica. Così, mentre il sionismo mondiale si preparava a festeggiare la nascita di Israele, Arendt, che pure a quel movimento aveva aderito in gioventù, metteva in guardia dai pericoli della partizione della Palestina e promuoveva l'idea di uno stato bi-nazionale arabo-ebraico. Altrettanto controcorrente saranno le sue posizioni su temi come la desegregazione delle scuole nel sud degli Stati Uniti, la pubblica istruzione, il significato da attribuire al processo ad Adolf Eichmann. In questi, come in altri casi, i contrasti, le controversie, la fine di vecchie amicizie saranno il prezzo che Arendt sarà disposta a pagare pur di difendere la propria ricerca della verità e il dovere di esporsi in prima persona nella vita pubblica con le azioni e con le parole. In studio, con Paolo Mieli, il prof. David Bidussa. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio David Bidussa \nCon la partecipazione di Pietro Sorace \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
