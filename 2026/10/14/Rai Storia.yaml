  title: Passato e presente Gertrude Bell la regi
  subtitle: 'Passato e presente Gertrude Bell la regina del deserto - Esploratrice, archeologa, diplomatica, poliglotta, agente britannica: Gertrude Bell è stata una delle figure più interessanti dell''Impero coloniale '
  description: "e britannico appena prima e all'indomani della Prima guerra mondiale. Tra tutti i luoghi visitati in giro per il mondo, il Medio Oriente è quello che più la conquista: per anni attraversa la Persia, la Siria e la Mesopotamia a dorso di cammello, approfondendone la geografia, la cultura e le tradizioni. Le conoscenze che Gertrude Bell acquisisce del mondo arabo durante i suoi viaggi si trasformano in un prezioso strumento per la politica imperialista britannica, fino a farle assumere un ruolo decisivo nella nascita del moderno Stato iracheno nel 1921. In studio con Paolo Mieli, la prof.ssa Giuseppa Di Gregorio. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio la prof.ssa Giuseppa Di Gregorio \nCon la partecipazione di Emanuela Lucchetti"
