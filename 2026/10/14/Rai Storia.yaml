  title: 'Passato e presente Frida Kahlo le molte '
  subtitle: 'Passato e presente Frida Kahlo le molte vite di una rivoluzionaria - Frida Kahlo: icona pop e leggenda. Le folte sopracciglia, il volto incorniciato da fiori e animali. I coloratissimi abiti tradizionali d'
  description: "da tehuana. Ma chi si cela dietro una delle pittrici più amate e celebrate del Novecento? Costretta a una lunga immobilità dopo il terribile incidente che segna la sua giovinezza, Frida trova nello specchio posto sopra il letto il primo soggetto da dipingere: sé stessa. Comincia così un corpo a corpo con la propria immagine destinato a durare tutta la vita. Sulle tele riversa il dolore fisico, l'amore tormentato per Diego Rivera e il desiderio mai sopito di maternità, ma anche il profondo legame con il suo Messico, in fermento e trasformazione dopo la Rivoluzione. Frida Kahlo non è soltanto la più celebre tra le artiste messicane: conquista anche la scena artistica europea. C'è chi riconosce nelle sue opere una forza surrealista, ma lei rifiuta ogni etichetta. Non dipinge sogni d'evasione, bensì la propria realtà: turbolenta, libera e vitale. Ferita, ma tenacemente legata alla vita, ne seguiamo le tracce mentre trasforma sé stessa nella sua opera più radicale. In studio con Paolo Mieli, il prof. Mauro Canali. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Mauro Canali \nCon la partecipazione di Charlotte Marincola"
