  title: Beweg dich!
  subtitle: 'Bauch, Beine, Po: Kräftigung für eine starke Körpermitte'
  description: |-
    Diese Folge von Beweg dich! widmet sich gezielt den Muskelgruppen, die für Haltung, Stabilität und Mobilität besonders wichtig sind: Bauch, Beine und Po. Mit einer ausgewogenen Mischung aus Übungen im Stand, auf der Matte und im Stütz wird die Körpermitte gestärkt, die Beinmuskulatur gekräftigt und die Gesäßmuskulatur aktiviert. Ein ideales Training zur Verbesserung von Haltung, Rumpfstabilität und funktioneller Kraft im Alltag. 15 Minuten sanfte Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Eka Ninow-Woysch ist Sportlehrerin im "Ruhestand".
    Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
