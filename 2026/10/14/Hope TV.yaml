- eventId: 1538715
  start: 2026-10-14T00:15:00Z
  stop: 2026-10-14T00:45:00Z
  title: Bibelkompass
  subtitle: Wenn Gott dich begnadigt
  description: |-
    Gnade bedeutet: Gott gibt nicht, was verdient wäre, sondern was rettet. In der Begegnung Jesu mit der beim Ehebruch ertappten Frau wird sichtbar, wie tief diese Gnade geht. Jesus verharmlost Schuld nicht, aber er verurteilt die Frau nicht. Er schenkt ihr einen neuen Anfang. Die Bibel zeigt: Jeder Mensch ist auf Gnade angewiesen, weil niemand aus eigener Leistung vor Gott bestehen kann. Erlösung ist ein Geschenk, das im Glauben angenommen wird - und das Leben nachhaltig verändert. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

