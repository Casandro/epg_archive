  title: Superknjiga
  subtitle: Animirani
  description: Kada Gizmo uhvati Luku i Elu u markiranju s nastave kako bi se družili s lošim uzorom (Markom, vođom ekstremnog skejtbord kluba), Superknjiga ih vraća u vrijeme kada je svijet bio ispunjen zlom. Zapravo, takvim zlom da se Bog zavjetuje uništiti svijet, a spasiti samo Nou ("Jedinog pravedanog čovjeka na zemlji"), njegovu obitelj i zvjerinjak životinjskih vrsta. Dok oni svjedoče poplavi - i Noinoj nepokolebljivoj vjeri u Boga - naši junaci vide kako je njihovo loše ponašanje jednako s padom svijeta u grijeh. Ohrabreni Noinim primjerom i Božjim savezom s čovječanstvom (da više nikada ne uništi svijet poplavom), oni se vraćaju u sadašnjost i odbacuju Markov opasan utjecaj.
