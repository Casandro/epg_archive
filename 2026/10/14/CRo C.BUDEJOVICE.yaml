  title: Melodie podvečera
  description: 'Pořad písničkových gratulací, přání a pozdravů, v němž zní nejoblíbenější melodie české populární hudby posledních 50 let. Do pořadu můžete telefonovat na číslo 221 55 44 11, posílat SMS na telefonní číslo 9001103 (ve tvaru: CB MP text) či psát prostřednictvím webového formuláře, který se zobrazí, když kliknete na název pořadu, anebo posílat poštou na adresu: Český rozhlas, U Tří lvů 1, 370 01 České Budějovice'
- eventId:
  - 738737
  - 743348
  start: 2026-10-14T16:30:00Z
  stop: 2026-10-14T17:00:00Z
  title: Kulatá muzika
  description: Strhující, emotivní, vždycky zpívající nadoraz. To jsou jen některé postřehy k dneska už čelní vokální představitelce blues-rocku, americké zpěvačce Beth Hart. Během let, kdy ji dlouho znali hlavně fanoušci zmíněného hudebního žánru, se postupně vypracovala do pozice všeobecně nezpochybnitelné interpretky, která umí zaujmout nejširší publikum. Přitom nijak neslevila ze svého expresivního projevu a nenadbíhá většinovému vkusu. Ale i méně cvičené ucho rychle rozezná, že má tu čest s unikátní zpěvačkou, jež umí procítit jak niterné balady, tak i v energických skladbách doslova rozčísnout vzduch hlasem, co umí skály lámat. Kromě toho, že mnohokrát spolupracovala s velkými jmény bluesové a rockové scény (zmiňme třeba výtečné kytaristy Jeffa Becka či Joe Bonamassu), nebo nazpívala celé album písniček legendární kapely Led Zeppelin, je i nápaditou autorkou vydávající vlastní tvorbu. Právě do posledního zmíněného šuplíku patří i album War In My Mind, které nás čeká v Kulaté muzice. K poslechu zve Martin Schuster.
