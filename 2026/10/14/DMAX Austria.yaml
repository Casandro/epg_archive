- eventId: 698418
  start: 2026-10-14T15:15:00Z
  stop: 2026-10-14T16:15:00Z
  title: Steel Buddies - Stahlharte Geschäfte
  subtitle: Abgewrackt
  description: |-
    Die Beute liegt auf dem Meeresgrund: Michael Manousakis startet in der Nordsee ein neues Projekt. Dort findet man weder Gold noch Edelsteine. Stattdessen nimmt der Ober-"Steel Buddy" - wie es sich für einen Schrotthändler gehört - ein rustikaleres Element ins Visier. Der ehemalige Bergungstaucher hat es auf 160 Tonnen Kupfer im Wert von rund 700 000 Euro abgesehen. Michael Manousakis investiert Geld in ein Wasserfahrzeug, um den Schatz zu heben. Eine Kaufentscheidung, die der Firmenboss sehr bald bereut, denn das ausrangierte Lotsenboot hat mehr als nur eine Macke.
    DEU 2020
  widescreen: true
- eventId: 698419
  start: 2026-10-14T16:15:00Z
  stop: 2026-10-14T17:15:00Z
  title: Kings Of Cash - Die Pfandleiher
  subtitle: Liebe geht - Gold bleibt!
  description: |-
    Feines Gespür: In Berlin schlägt in dieser Folge Franzis Instinkt Alarm. Die Pfandleiherin feilt an einem Wertgegenstand - und dabei bestätigt sich ihr Verdacht. In Karlsruhe möchte ein Paar zahlreiche Schmuckstücke zu Geld machen, darunter auch die Eheringe. Die beiden rechnen mit 9000 Euro, doch die Auszahlung fällt am Ende deutlich höher aus. Deshalb bleibt die Küche an diesem Tag kalt, stattdessen wird im Restaurant gefeiert. Und in Nürnberg war Rick offenbar zu gutgläubig. Der vereinbarte Preis für einen Mini One wird aufgrund technischer Mängel nachverhandelt.
    DEU 2026
  widescreen: true
- eventId: 698420
  start: 2026-10-14T17:15:00Z
  stop: 2026-10-14T18:15:00Z
  title: Kings Of Cash - Die Pfandleiher
  subtitle: Verarsche im Karton
  description: |-
    Antik oder minderwertiger Plunder? Axel Zoor und Daniel Lieser nehmen in Offenburg eine Steinschlosspistole unter die Lupe. Das Ergebnis fällt ernüchternd aus. Die Erwartungen werden nicht erfüllt. Niklas Bode verlässt sich in Siegburg bei der Begutachtung eines Gemäldes auf die Fachkenntnis einer Expertin. Denn auch ältere Kunstwerke erzielen nicht zwangsläufig hohe Preise. Und Franzi Weinberg prüft in Berlin-Tempelhof sorgfältig ein Notebook in Originalverpackung. Bei einem ähnlichen Geschäft wurde die Pfandleiherin vor Jahren bereits einmal getäuscht.
    DEU 2025
  widescreen: true
- eventId: 698433
  start: 2026-10-14T18:15:00Z
  stop: 2026-10-14T19:15:00Z
  title: Goldrausch in Alaska
  subtitle: Ness-Crew am Limit
  description: |-
    Früher tourte Rick Ness als Bassist um die Welt, doch das liegt schon viele Jahre zurück. Heute sieht sein Leben ganz anders aus. Als Minenboss leitet er im Yukon die Geschicke eines Goldgräberteams. Rick will sich neues Land sichern, seine Mitarbeiter kämpfen sich in 14-Stunden-Schichten Meter für Meter ins Erdreich vor, und sie verbessern eine Straße, um den Betrieb effizienter zu machen. Noch ist ungewiss, ob sich all das am Ende auszahlen wird. Doch eines ist definitiv klar: Ihre Pläne können die Schatzsucher nur umsetzen, wenn alle an einem Strang ziehen.
    GBR 2025
  widescreen: true
- eventId: 698434
  start: 2026-10-14T19:15:00Z
  stop: 2026-10-14T20:15:00Z
  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Der Büffelflüsterer
  description: |-
    In Österreich kämpfen Tobi und Benni gemeinsam mit ihrem Vater Andreas darum, ein ehrgeiziges Projekt vor dem Aus zu bewahren. Lohnt sich in einem Kieswerk an der Donau die Förderung von Feingold? Der entscheidende Tauchgang im eisigen Baggersee wird zur Belastungsprobe. Und am anderen Ende der Welt bietet sich den Machereys eine einmalige Gelegenheit. Das Trio möchte sich im australischen Outback den Traum von einer eigenen Goldmine erfüllen. Doch wilde Büffel, sengende Hitze und marode Maschinen könnten die Pläne der Abenteurer zunichtemachen.
    DEU 2026
  widescreen: true
- eventId: 698435
  start: 2026-10-14T20:15:00Z
  stop: 2026-10-14T21:15:00Z
  title: Goldfieber Down Under
  subtitle: Episode 3
  description: |-
    Wenn in Queensland die Regenzeit beginnt, geraten Straßen und Maschinen durch Dauerregen und Stürme in Gefahr. Deshalb treffen Jacob, Norman und Sebastian in Down Under Vorkehrungen: Die Männer wollen ihr Camp absichern und zusätzliche Pfosten in den Boden rammen. Dazu benötigen sie Holz. Die Schatzsucher ziehen mit der Kettensäge los, um Bäume zu fällen. 20 Kilometer weiter südlich füttern James und sein Team ihre Waschanlage Marke Eigenbau mit Schürfmaterial. Doch der Wasserdruck ist zu hoch - dadurch könnte den Goldgräbern wertvolles Edelmetall verloren gehen.
    DEU 2026
  widescreen: true
