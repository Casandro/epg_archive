  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Der Büffelflüsterer
  description: |-
    In Österreich kämpfen Tobi und Benni gemeinsam mit ihrem Vater Andreas darum, ein ehrgeiziges Projekt vor dem Aus zu bewahren. Lohnt sich in einem Kieswerk an der Donau die Förderung von Feingold? Der entscheidende Tauchgang im eisigen Baggersee wird zur Belastungsprobe. Und am anderen Ende der Welt bietet sich den Machereys eine einmalige Gelegenheit. Das Trio möchte sich im australischen Outback den Traum von einer eigenen Goldmine erfüllen. Doch wilde Büffel, sengende Hitze und marode Maschinen könnten die Pläne der Abenteurer zunichtemachen.
    DEU 2026
  widescreen: true
