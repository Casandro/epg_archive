  title: 'Goldrausch: Dave Turin''s Lost Mine'
  subtitle: Anfängerfehler
  description: "Die Entscheidung ist gefallen: Dave Turin und sein Team werden ihr Glück am Lynx Creek versuchen. Dort wurde 1853 Gold entdeckt. Präsident Lincoln sandte damals Truppen in die Region, um den kostbaren Schatz zu heben. Und bis in die 1940er-Jahre wurde auf dem Areal Edelmetall im Wert von 20 Millionen Dollar abgebaut. Aber dann kam der Zweite Weltkrieg und die Arbeiter mussten im Pazifik und in Europa ihren Militärdienst ableisten. Seither liegen die Minen brach. Mit modernem Equipment dürfte auf dem geschichtsträchtigen Schürfgrund noch einiges zu holen sein. \nGBR 2019"
  widescreen: true
- eventId: 699448
  start: 2026-10-14T11:15:00Z
  stop: 2026-10-14T12:15:00Z
  title: 'Goldrausch: Dave Turin''s Lost Mine'
  subtitle: Detektivarbeit
  description: |-
    Ist die Waschanlage defekt oder schürfen die Abenteurer an der falschen Stelle? Bis dato hat sich die Plackerei am Lynx Creek für Dave Turin und seine Gefährten nicht ausgezahlt. Im Gegenteil: Wenn die Männer in den nächsten Wochen nicht wesentlich mehr Edelmetall zutage fördern, droht ihnen der finanzielle Ruin. Deshalb betreibt das Team in Arizona Ursachenforschung. Maschinenführer Casey Morgan untersucht das Equipment und Dave Turin entnimmt weitere Bodenproben. Denn der kostbare Schatz könnte in einer anderen Erdschicht versteckt sein.
    GBR 2019
  widescreen: true
