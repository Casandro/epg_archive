  title: Rišpet u Lisinskom, 16. ožujka 2025., 2.dio
  subtitle: ' '
  description: Pjesma koja ostaje u srcu i koja nas grli, glazbeno oslikava popularni Rišpet. Poznato je kako nije prvi put da su do posljednjeg mjesta uspunili prestižnu dvoranu Lisinski, što je već osmi put u posljednjih šest godina. Splitski skladatelj Pero Kozomara., 2011.godine osniva Rišpet i ispisuje glazbenu priču pjesmama koje pronalaze put do srca publike, jos od njihove prve snimljene skladbe, duet s legendarnim Matom Mišom Kovačem Sunce mi od tebe dolazi. Tome je svakako pridonio Ivo Amulić, pjevač koji je ovim koncertom proslavio 40 godina umjetničkog rada, uz gošće Ziricu Kondžu i Doris Dragović. Uživajte u 1.dijelu ovog sjajnog koncerta.
