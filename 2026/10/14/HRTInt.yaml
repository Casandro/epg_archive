- eventId: 751072
  start: 2026-10-14T06:28:00Z
  stop: 2026-10-14T06:58:00Z
  title: 'Brodovi hranitelji: Posljednji pjeskari i kamenari, dokumentarna serija (1/5)'
  subtitle: ' '
  description: 'Dokumentarna serija Darka Dovranića približava mlađim naraštajima komadić ne tako davne prošlosti, kada je život uz more ovisio o drvenim brodovima koji lagano izumiru. Ujedno, to je i epopeja brodu te poticaj da se spasi ono što je gotovo osuđeno na propast, a dio je naše baštine i naše prepoznatljivosti na Mediteranu.  U pet epizoda sa zajedničkim naslovom "Posljednji...", uz korištenje arhivskog materijala, put nas vodi diljem Jadrana, od Savudrije do Cavtata, pa čak i "preko mora" u Cesenatico, gdje itekako paze na svoju baštinu.  U seriji se promoviraju dvije pjesme pisane za ovu prigodu: "Ako zaspem - probudi me more" autora Ante Sikirića, u izvedbi Davora Pekote, i "Sveto blago" velolučkog autora Marija Prižmića, u izvedbi grupe Portun. ----- Prva je epizoda posvećena posljednjim pjeskarima i kamenarima. Snimljena je u okolici Zadra, u Privlaci te na otoku Krku. U glavnoj su ulozi tri broda za koja možemo reći da su posljednji vadili pijesak uz našu obalu. Korištene su i sekvence iz filma "Posljednji" Aleksandra Stasenka te "Prijetvor sokolara" Zdravka Mustaća.'
- eventId: 680582
  start: 2026-10-14T06:29:00Z
  stop: 2026-10-14T06:59:00Z
