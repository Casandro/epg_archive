  title: ART
  subtitle: ' '
  description: 'Na adresi Kačićeva 7a u Zagrebu 10. rujna službeno je otvorena Knjižara Sandorf, višejezična knjižara i prvi zagrebački antikvarijat specijaliziran za knjige na engleskom jeziku, na čijim se policama, uz tisuće rabljenih naslova, nalazi izbor novih domaćih izdanja. Knjižara Sandorf koncipirana je ujedno i kao novi gradski prostor za književna predstavljanja, predavanja, radionice, filmske projekcije i druga događanja. Donosimo prilog s otvorenja ovogodišnjeg festivala Lit Link, promocije romana "Permafrost: čudnovato i vjerodostojno svjedočanstvo" nizozemskog književnika Donalda Niedekkera, a u studiju razgovaramo s osnivačem Sandorfa, Ivanom Sršenom.'
