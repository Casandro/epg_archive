  title: 'Die Wechseljahre: Zu heiß für Deutschland?'
  subtitle: Eine WDR Story von Antonia Coenen mit Sabine Heinrich
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "\"Bin ich schon in den Wechseljahren - und wenn ja, was heißt das eigentlich?\" Moderatorin Sabine Heinrich ist 49 und merkt: Da verändert sich etwas. Körperlich, emotional, hormonell. Und sie ist damit nicht allein. Neun bis elf Millionen Frauen in Deutschland befinden sich derzeit in den Wechseljahren - oft einhergehend mit Hitzewallungen, Schlafproblemen, Erschöpfung oder Konzentrationsstörungen. Trotzdem wird über die Wechseljahre noch immer nicht genug gesprochen. \nWarum bleiben die Bedürfnisse von Frauen in dieser Lebensphase so oft unsichtbar - im Job, in der Medizin und in der Gesellschaft generell?"
- eventId:
  - 1415043
  - 588406
  start: 2026-10-14T20:55:00Z
  stop: 2026-10-14T21:40:00Z
  title: 'Frau tv: Midlife Magic - Unsere wilden Wechseljahre'
  subtitle: 'Moderation: Sabine Heinrich'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hitzewallungen, kaum Schlaf, trockene Haut. Das ist nur die Spitze des Eisbergs. Was heißt es, in die Wechseljahre zu kommen? Wie fühlt sich das an? Wie ist das bei mir? Wie bei anderen Frauen? Wir versuchen gemeinsam, Antworten zu finden, und begrüßen in dieser Sendung die "Wechseljahre" als eine Zeit der Veränderung - im allerbesten Sinne. Frau tv-Moderatorin Sabine Heinrich stellt sich mit Ende 40 gerade selbst diese Fragen und klärt sie gemeinsam mit ihren Gästinnen: mit Gynäkologin und Chefärztin Mandy Mangler sowie der TV-Moderatorin und Podcasterin Marlene Lufen.'
