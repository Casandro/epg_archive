    Robert Oppenheimer gilt als Vater der Atombombe. Unter seiner Leitung lassen die USA von 1943 bis 1945 die erste Nuklearwaffe entwickeln. Der brillante Physiker ist politisch sehr umstritten.

    Aus einer jüdischen Familie stammend, besucht Oppenheimer in New York eine liberale Schule. Sein Umfeld im Berkeley der 1930er-Jahre ist kommunistisch geprägt. Trotz großer Vorbehalte übertragen ihm die USA die Leitung des "Manhattan-Projekts".
