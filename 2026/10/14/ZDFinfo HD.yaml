    Zusammen mit Diggern, Hobbyarchäologen und einem Architekten erkundet die Dokumentation die geheimnisvollen Untergrundbauten Kaliningrads. Forscher Sergey hofft auf den großen Schatz: das Bernsteinzimmer. Digger Jevgenij findet einen Torpedobunker am alten Hafen.
