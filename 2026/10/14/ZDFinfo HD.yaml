    Die militärischen Bauwerke kamen nie zum Einsatz. Heute droht der Verfall. Doch die Geheimnisse im Untergrund sind noch immer interessant: Junge Leute aus der Stadt und engagierte Hobbyforscher erkunden auf eigene Faust die Geschichte ihrer Verteidigungsanlagen.
