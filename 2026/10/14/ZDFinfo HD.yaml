    Deutschland 2018
    Unter einem Wald in Nordfrankreich, den Eismassen Islands und dem Londoner Finanzdistrikt tun sich geheime Welten auf und gewähren faszinierende Einblicke in Vergangenheit und Zukunft.

    In der Picardie bauten die Menschen eine riesige Höhlenanlage als Schutzbunker in den Kalkstein. In Island formt die Natur magisch anmutende Eishöhlen in Gletscher, und in der City of London strömt klimaschonende Energie durch vier Stockwerke tiefe Tunnel.
