  description: |-
    Großbritannien 2022
    Ein Höhlensystem am Grand Canyon gibt Forschern Rätsel auf. Verlassene Bunker in Großbritannien dienen einst der Luftaufklärung. Und eine Felsenstadt in Georgien ist in ständiger Gefahr.

    In den Trockenhöhlen nahe des Grand Canyons muss es noch unentdeckte Gänge geben. In der Frühzeit des Kalten Krieges nutzen die Briten ein Bunkernetzwerk, das nun in der Tiefe schlummert. Die Höhlenstadt Wardsia ringen die Georgier vor Jahrhunderten dem Fels ab.
