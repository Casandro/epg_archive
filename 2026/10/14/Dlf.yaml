  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nZehn Jahre nach Amoris Laetitia - Was bleibt vom Aufbruch bei der kirchlichen Sexualmoral?\nIn diesen Tagen haben sich in Rom die Vorsitzenden der Bischofskonferenzen der römisch-katholischen Kirche getroffen, um über das Thema Ehe, Familie und Sexualmoral in der kirchlichen Lehre zu beraten - zehn Jahre nachdem Papst Franziskus mit dem Schreiben ?Amoris Laetitia? erstmals Bewegung in das Thema gebracht hat. Was hat Franziskus? Initiative bewirkt und was nicht? Dazu ein Gespräch mit Jochen Sautermeister, Professor für Moraltheologie an der Katholisch-Theologischen Fakultät der Universität Bonn.\n\nDie Omikuji-Tradition in Japan: Wahrsageschnipsel für unter einen Euro\nIn Japan kämpfen viele Schreine und Tempel ums finanzielle Überleben. Dabei verdienen zumindest einige von ihnen an Orakelsprüchen, vor allem in Tourismushochburgen. Für rund 100 Yen - weniger als ein Euro - kann man sich kleine Zettel kaufen mit Wahrsagereien für die eigene Zukunft. \n\nAm Mikrofon: Benedikt Schulz"
