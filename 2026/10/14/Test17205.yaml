  description: '(Rediffusion) TARDOC : comment certains médecins gonflent la facture Au mois de janvier, le système TARDOC succédait à TARMED pour régir la facturation des prestations médicales ambulatoires. Neuf mois plus tard le système provoque des effets secondaires. Alors que les primes maladie continuent de grimper, certains spécialistes profitent du nouveau système tarifaire pour augmenter leurs revenus, au détriment du confort des patients et des coûts de la santé. (Suisse Romande-2026)'
