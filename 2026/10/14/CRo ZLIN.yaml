  title: Dobré dopoledne s ČRo Zlín
  description: Poradna pro zdraví s Jiřím Šimkem, primářem oddělení ústní, čelistní a obličejové chirurgie zlínské Baťovy nemocnice. Jaké jsou dnes nejčastější důvody, proč pacienti končí na tomto oddělení? Jak předcházet nádorům v ústní dutině? A jak složité je vrátit pacientovi nejen funkčnost, ale také přirozený vzhled obličeje? Moderuje Silvie Pospíšilová.
