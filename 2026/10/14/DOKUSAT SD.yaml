  subtitle: Tiere vor der Kamera - Das lustige Treiben der Little Corellas
  description: Arendt und Schweiger verbringen vier Monate im Outback Australiens, um die Little Corellas in ungewöhnlichen Verhaltensweisen zu filmen. Trotz widriger Bedingungen entsteht ein unterhaltsamer Film voller Action und Spaß, der dennoch biologisch fundiert ist. Die Corellas zeigen Akrobatik und Spielszenen, während auch die Aufzucht ihrer Jungen ein Highlight ist. Arendt und Schweiger zeigen, dass Tierfilme lehrreich und wissenschaftlich korrekt sein können, ohne dabei den Spaß zu vernachlässigen.
