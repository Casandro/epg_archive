  audiodesc: true
  description: '"Wir im Saarland - Service" ist das Wirtschafts- und Verbrauchermagazin im SR Fernsehen. Wir bieten jede Woche 30 Minuten Tipps und Infos rund um das tägliche Leben. Im Fokus: Ideen und Geschichten, Trends und Tests sowie Themen, die auf Anregungen unserer Zuschauerinnen und Zuschauer zurückgehen - immer am Dienstag um 18.50 Uhr. Schwerpunktthemen u.a.: Geld, Gesundheit, Soziales, Recht, Wohnen, Energie, Ernährung, Umwelt, Verkehr und Technik - immer aus der Perspektive des Kunden betrachtet. Außerdem: unser Quiz, das sich in unterhaltsamer Form mit Streit- und Wissensfragen befasst.'
