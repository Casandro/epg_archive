  title: Saar Natur
  subtitle: Wunderbare Welt der Permakultur
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die Permakultur ist seit Ende der 70er Jahre auf dem Vormarsch. Sie gilt als ganzheitliches Konzept innerhalb des Bioanbaus, das sich an eine Welt mit schwindenden Ressourcen anpasst. Permakultur setzt auf Mischkulturen, die sich nicht an hohem Ertrag orientieren, sondern stabile Systeme hervorbringen. \nAndrea Lipp und Oliver Werner führen die Zuschauer heran. Außerdem führen sie uns durch die nach dem Prinzip der Permakultur angelegten Gärten der ersten und einzigen \"Essbaren Klinik\" Deutschlands. Das ist das Thema in der \"Saar Natur\"."
