  title: Legendy
  description: Komerčně nejúspěšnějším albem skupiny Cure bylo až to 9. z roku 1992 s názvem "Wish". Hned tři výborné singly na čele s "Friday I'm In Love" znamenaly čelo hitparády v Británii a druhou příčku v Americe, kde navíc deska získala platinu za milion prodaných nosičů. Pro anglickou kytarovku na začátku 90. let minulého století fantastický úspěch. Připravuje Jiří Matějů.
