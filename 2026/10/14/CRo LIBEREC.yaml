  title: Setkání u mikrofonu
  description: Jak se žije a co se děje v Trojzemí? Tedy nejen u nás, ale i v polském a německém příhraničí? I o tom informuje 3mag, trojjazyčný internetový magazín a kalendář akcí pro celý Euroregion Nisa, který sídlí v Žitavě. Co všechno v něm najdete i jak se do něj mohou zapojit pořadatelé akcí, se dozvíte v Setkání u mikrofonu. Pozvání do pořadu přijal jednatel magazínu Thomas Kluttig a redaktorka Barbora Bock. Ptá se jich Petr Kumpfe.
