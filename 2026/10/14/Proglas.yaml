  title: Na stole je téma
  subtitle: Pětibojař Matěj Lukeš
  description: 'Autor: Zdislava Horníková; Interpret: Matěj Lukeš; Premiéra: 14.10.2026 * Vítězství na mistrovství světa může trvat pár okamžiků. Za ním ale stojí roky tréninku a přípravy v pěti různých disciplínách. Matěj Lukeš letos získal titul mistra světa v moderním pětiboji. Jak se mladý sportovec připravuje na závod, ve kterém musí během jediného dne zvládnout plavání, šerm, překážkovou dráhu, střelbu a běh? Která disciplína mu nejvíc sedí a se kterou naopak nejvíc bojuje? A jak se člověku změní život, když najednou získá titul mistra světa? O tom bude v rozhovoru vyprávět Matěj Lukeš.'
