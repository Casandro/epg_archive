  description: 'Autor: Marcela Kopecká; Interpret: Iva Bartošková, Marcela Kopecká * Iva Bartošková společně s rodinou provozuje ve Strážnici dílnu na výrobu modrotisku. Řemeslo zdědila po svém pradědečkovi Cyrilu Jochovi a jeho ženě. Jakým způsobem tradiční potisk vzniká? Kam se jezdí pro indigo a jak staré jsou formy, kterými se dodnes ručně tiskne na textil? Co je kipa a pop? A jak dlouho trvá, než se vyučí barvíř a tiskař ? Zákulisí řemesla, které rodina provozuje už 120 let odhalíme s Marcelou Kopeckou v pořadu Radioreport.  '
