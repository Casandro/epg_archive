  description: 'Autor a interpret: Petr Húšť * Klimatické podmínky se zjevně mění, sucho bylo v létě opravdu extrémní. Hodnocení nechme odborníkům, ale sucho může být i určitým obrazem našeho duchovního života: sucho nevzniká v okamžiku, je to důsledek. Ale taky se dá změnit. O travnatých nivách bude řeč v další relaci Klika patnáct minut po desáté.'
