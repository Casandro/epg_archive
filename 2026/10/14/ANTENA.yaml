    Jak połączyć dowodzenie policyjnym wydziałem zabójstw na południu Francji z wychowaniem czwórki dzieci przez samotną matkę? Candice Renoir udowadnia, że urok osobisty, różowy notes i matczyna intuicja bywają skuteczniejsze niż rygorystyczne procedury. Ten nieszablonowy serial kryminalny z zaskakującą lekkością miksuje krwawe zbrodnie z chaosem rodzinnego życia, udowadniający, że najtrudniejsze śledztwa czasem rozwiązuje się między praniem a zakupami.
