  title: 'grenzenlos: Das Hexendorf'
  subtitle: Dokumentation
  description: 'Was für uns wie Geschichten aus finsteren vergangenen Zeiten anmutet, ist in Teilen Afrikas bis heute Realität: unvermittelt sehen sich Frauen als Hexen beschuldigt. Häufig verlieren diese Frauen alles und können froh sein, wenn sie ihr Leben retten können. Im Gushiegu-Hexendorf in Ghana finden Frauen Zuflucht, die als Hexen angeklagt wurden. Mitten im Buschland, haben zurzeit 70 von ihnen ein neues Zuhause. Es gibt keine Straßen, keinen Strom, kaum Trinkwasser. Nur Staub, Lehmhütten und sengende Hitze. Pater Phanuel Myers Agudu setzt sich für die Frauen ein und versucht die Position der Frauen in der Gesellschaft zu stärken.'
- eventId: 697535
  start: 2026-10-14T15:30:00Z
  stop: 2026-10-14T16:30:00Z
  title: Wer's glaubt, wird selig (Teil 2)
  subtitle: Spiritualität
  description: 'Was deutet das Thema ''Wer''s glaubt, wird selig'' an? Glaubt ein Christ an irgendwas oder auf naive Weise? Der Glaube an den dreifaltigen Gott verändert grundsätzlich das Leben, kann letztlich selig bzw. glücklich machen. Wer an IHN glaubt, wer IHM vertraut, ist und wird selig! Das Thema hat schließlich seinen Ursprung im Markusevangelium: "Wer glaubt, wird gerettet." Zweiter von zwei Teilen. Vortrag von Prof. DDr. Hanna-Barbara Gerl-Falkovitz. Aufgezeichnet im Rahmen des Studientages der Diözese Augsburg, am 25. Januar 2025.'
