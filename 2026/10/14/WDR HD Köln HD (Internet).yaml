  title: Mittendrin - Flughafen Frankfurt (80)
  subtitle: Mein letzter Flug
  description: 'Er flog Jumbo, Airbus und Tante Ju. 24.060 Stunden saß er im Cockpit. 330 Mal hat er die Welt umrundet. Axel Graumann aus Wiesbaden war 41 Jahre Pilot. Nun tritt er an zu seiner letzten Dienstreise vor der Rente: "Noch einmal Hongkong!" Mit an Bord Familie und Freunde. Ein Abschied voller Emotionen, Überraschungen und einem spektakulären Geschenk der Frankfurter Fluglotsen.'
