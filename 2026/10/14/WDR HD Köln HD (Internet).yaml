  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Pinguinnachwuchs
  description: Es gibt so viel, was sich hinter den Kulissen des Tierparks Hellabrunn tut! Die Reporter Felix Heidinger und Jens-Uwe Heins gehen jede Woche auf Erkundungstour und berichten top-aktuell über die Geschehnisse. Tag für Tag sind sie im Tierpark unterwegs und zeigen, was sich dort abspielt. Sie begleiten die Pfleger bei ihren Begegnungen und besonderen Erlebnissen mit den Tieren.
- eventId: 778630
  start: 2026-10-14T12:20:00Z
