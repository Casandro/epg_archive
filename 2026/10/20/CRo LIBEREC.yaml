  title: Host Dopoledne pod Ještědem
  description: 'Téma: Když studium baví učitele i studenty. Pedagog Pavel Valenta, Střední odborná škola v Liberci. Cenu Albertus 2026, která oceňuje učitele fyziky a informatiky z celé České republiky získal učitel Pavel Valenta ze Střední odborné školy Liberec. V čem je výjimečné jeho vyučování informatiky zaměřené na řemeslné obory a digitální technologie, jak si dokáže vytvořit autoritu i přátelský přístup ke studentům, nejen to se dozvíme hodinu před polednem.'
