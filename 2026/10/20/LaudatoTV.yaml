  title: Izdvojeno
  subtitle: Religijski
  description: Sveti Franjo je prije 800 godina promijenio svijet, a to je mogao zato što je dopustio da Bog njega promijeni. Od tada do danas franjevaštvo se ne čuva unutar samostanskih zidina, već se živi kao znak mira i bratstva za cijeli svijet. S kojim se izazovima velika franjevačka obitelj susreće u današnjem svijetu? Kako se Franjevački jubilej slavi u Hrvatskom narodu? I koja se pitanja pritom postavljaju? Što zapravo govori geslo jubileja ,,Gospodin nam dade brata Franju? Najavljujemo i veliku franjevačku proslavu 24. listopada na Svetom Duhu. Naši su gosti fra Ivica Jagodić, provincijal Hrvatske franjevačke provincije sv. Ćirila i Metoda i fra Miljenko Hontić, provincijal Hrvatske franjevačke provincije sv. Jeronima franjevaca konventualaca.
