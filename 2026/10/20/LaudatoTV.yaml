  description: Luka je u nedoumici treba li poći na jezero s Elinom obitelji kako bi uživali na suncu ili ostati kući i pomoći svojoj luckastoj pra-teti Beli oko ljetnih poslova oko kuće i dvorišta.  Kada Superknjiga odvede djecu da upoznaju Rutu, Naomi i Boaza, Luka polako počinje poštivati trud, vrijeme i brigu koji su potrebni za održavanje međusobnih odnosa - posebno onih obiteljskih. Uviđa koliko se Ruta dala na raspolaganje Naomi, putujući s njom, živeći s njom i pomažući joj financijski nakon što joj je umro muž. Na kraju se Ruta udaje za Boaza i Luka shvaća da joj se tako dobra stvar i radost ne bi dogodili da je zanemarila svoj odnos s Naomi. Luka se vraća kući i preskače odlazak na jezero kako bi proveo vrijeme s tetom Belom te uči kako biti ljubazan i odan u obiteljskim odnosima.
