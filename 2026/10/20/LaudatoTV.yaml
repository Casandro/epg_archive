    U ovoj epizodi majka Angelica govoriti će o više tema. Vrlo ozbiljno majka Angelica govori o tome kako se često igramo Boga. Kaže: "Odlučujete za druge ljude i pokušavate shvatiti što Bog želi da učinite u ovom trenutku. I potpuno ste sigurni da je upravo to ono što On želi da učinite". A je li to Njegova ili naša volja? Činimo li tako? Nadalje govori o osuđivanju i o tome kako brzopleto osuđujemo. Također će govoriti o neobičnom pojmu 'miješanom milosrđu'. To je, kako majka Angelica objašnjava, kada znamo za Božju pravednost, a zatim znamo i za Njegovo milosrđe. A te primjere milosrđa ne povezujemo uvijek zajedno. Nadalje govori o jedinstvu te o odlukama, o tome kako ih donosimo i o sposobnosti koju imamo kada treba donijeti ispravnu odluku.
