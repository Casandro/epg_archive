  subtitle: Religijski
  description: Putujemo s biskupom Robertom Barronom do tajanstvenih i svetih mjesta Svete zemlje. Prolazimo od Cezareje Fillipove, do Galilejskog mora, Jeruzalema i do vječnog grada Rima. Biskup Barron rasvjetljava uvjerenje katoličke vjere da je Isus iz Nazareta obećani Mesija i da je Božje otkrivenje postalo čovjek u Kristu.
