    Ania i Mania szykują się do matury. Po egzaminach Mania jest zdecydowana wrócić do Brwinowa, Anię bardziej niż stabilizacja, pociąga dalsza edukacja. Ty zawsze byłaś ta zdolniejsza, więcej chciałaś, mówi jej w szczerej rozmowie Mania. - Zostaniesz w Warszawie, będziesz kimś. Ja chcę zostać tu, mieć dom, rodzinę, dzieci. Paweł po raz kolejny próbuje zawalczyć o Anię i wpłynąć na zmianę jej planów. Odwiedza ją w Warszawie, ale niewiele udaje mu się ugrać. Ania pilnie przygotowuje się do matury.
