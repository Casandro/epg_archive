  title: Stulecie Winnych s.I - odc. 8
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Katarzyna Kwiatkowska, Arkadiusz Janiczek, Katarzyna Wajda
    Ania i Mania szykują się do matury. Po egzaminach Mania jest zdecydowana wrócić do Brwinowa, Anię bardziej niż stabilizacja, pociąga dalsza edukacja. Ty zawsze byłaś ta zdolniejsza, więcej chciałaś, mówi jej w szczerej rozmowie Mania. - Zostaniesz w Warszawie, będziesz kimś. Ja chcę zostać tu, mieć dom, rodzinę, dzieci. Paweł po raz kolejny próbuje zawalczyć o Anię i wpłynąć na zmianę jej planów. Odwiedza ją w Warszawie, ale niewiele udaje mu się ugrać. Ania pilnie przygotowuje się do matury.
  ageRating: 12
  genre:
  - '23'
  subtitle: Ania i Mania przygotowują się do matury. Mania chce wrócić po egzaminach do Brwinowa. Ania zamierza dalej się kształcić. Paweł próbuje nakłonić ukochaną do zmiany planów.
- eventId: 744650
  start: 2026-10-20T19:20:00Z
  stop: 2026-10-20T20:05:00Z
  title: Ojciec Mateusz - odc. 40 (Ojciec Mateusz III odc. 10) - Wybory
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Tamara Arciuch, Aleksander Bednarz
    Zostaje zamordowany Jakub Gold, jeden z kandydatów na burmistrza w trwającej kampanii wyborczej. Gold był przedstawicielem mniejszości żydowskiej, w programie swojej kampanii wyborczej stawiał na ekologię. Możejko poszukuje partnerki dla swojego psa. Na jednym z forów internetowych poznaje właścicielkę pięknej suki wilczura. Do miasteczka powraca z zagranicy Justyna. To ona ma wejść na miejsce Jakuba w kampanii wyborczej.
  ageRating: 12
  genre:
  - '18'
  subtitle: Zostaje zamordowany Jakub Gold, jeden z kandydatów na burmistrza w trwającej kampanii wyborczej. Gold był przedstawicielem mniejszości żydowskiej, jako działacz stawiał na ekologię.
- eventId: 744651
  start: 2026-10-20T20:05:00Z
