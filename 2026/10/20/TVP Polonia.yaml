  title: Polacy Światu - Stanisław Michał Jankowski
  description: |-
    Tytuł oryginalny: Polacy światu
    PL, 2023
    ODC. 97 Stanisław Michał Jankowski pseudonim "Agaton" urodził się 29 września 1911 roku w Warszawie. Wybitny architekt, uczestnik kampanii wrześniowej 1939 roku, cichociemny, powstaniec warszawski, adiutant generała Tadeusza "Bora" Komorowskiego. Po wojnie pracował w Biurze Odbudowy Stolicy. Był współautorem planu podniesienia miasta z ruin.
  ageRating: 12
  genre:
