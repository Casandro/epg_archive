- eventId: 904062
  start: 2026-10-20T20:05:00Z
  stop: 2026-10-20T20:41:25Z
  title: Host Radiožurnálu
  description: 'Příběh ženy, která připravila sokoly o miliony. Druhý díl: Důvěra Dokázala nepozorovaně vysát z účtů Sokola desítky milionů korun. Falšovala přitom dokumenty a zneužívala cizí identitu. Jak se ale Elišce Colding podařilo získat neomezenou důvěru šéfky Sokola, která přitom byla vyhlášená pro svoji nesmlouvavou povahu? Proč jí starostka tolik věřila? Jaký měly vztah? Druhý díl popisuje, jak se nenápadná asistentka dostala k cizím milionům.'
