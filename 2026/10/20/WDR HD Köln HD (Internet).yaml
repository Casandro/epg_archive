  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Winterzauber im Tierpark
  description: Wickelbären sind normalerweise Bewohner des tropischen Urwalds. Seit einiger Zeit gehören sie aber auch zu den Bewohnern des Münchner Tierparks Hellabrunn. Dort bekommen sie regelmäßig Besuch von unseren beiden Reportern Felix Heidinger und Jens-Uwe Heins. Die beiden Tierfilmer berichten jede Woche top-aktuell aus dem Tierpark und beobachten, was sich bei Kletterkünstlern tut. Außerdem zeigen sie, wie das Urwaldhaus umgebaut wird.
