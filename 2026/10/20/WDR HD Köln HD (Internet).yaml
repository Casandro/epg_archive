- eventId: 942279
  start: 2026-10-20T05:30:00Z
  stop: 2026-10-20T05:40:00Z
  title: Glow (1)
  subtitle: Das Picknick
  description: 'Alles ist bestens für Kim: Sie lebt mit ihrer Mutter Hilde zusammen und hat Zeit und Ruhe, um Musik zu hören und Texte für ihre Songs zu schreiben. Aber dann möchte Hilde mit ihrem Freund Lars zusammenziehen, der seit dem Tod seiner Frau die Kinder August und Jenny allein großzieht. Hilde und Lars organisieren ein großes Picknick, bei dem sich alle kennenlernen sollen. Aber sofort geht Jenny Kim schrecklich auf die Nerven.'
- eventId: 942340
  start: 2026-10-20T05:40:00Z
  stop: 2026-10-20T05:50:00Z
  title: Glow (2)
  subtitle: Banana Split!
  description: Kim und Hilde ziehen bei Lars, August und Jenny ein. Ein Alptraum für Kim! Jenny weicht nicht von ihrer Seite und löchert Kim mit Fragen, um sie besser kennenzulernen. Kim wird der Trubel in der unerwünschten Familie schnell zu viel und sie zieht sich in ihr Zimmer zurück. Jenny ist enttäuscht. Da entdeckt sie Kims Rucksack, aus dem eine Mappe mit selbstgeschriebenen Songtexten gefallen ist.
- eventId: 942503
  start: 2026-10-20T05:50:00Z
  stop: 2026-10-20T06:15:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (1)
  subtitle: Nordgriechenland
  description: |-
    Für drei Mädchen und drei Jungs im Alter von 15 bis 17 Jahren beginnt heute das Abenteuer ihres Lebens. Melanie (17), Evelin (15), Sofie (16), Tom (17), Jannis (17) und Felix (17) werden vier Wochen lang allein in der Wildnis Nordgriechenlands verbringen.
    Heute kommen die sechs Abenteurer in Nordgriechenland an und treffen sich zum ersten Mal. Auf dem Weg in die Wildnis gibt ihnen Wildniscoach Tobi gleich eine Aufgabe, für die die sechs allen Mut zusammennehmen müssen: einen Sprung in ein mehrere Meter tiefes Flussbett mit eiskaltem Wasser. Werden sich alle trauen?
- eventId: 942573
  start: 2026-10-20T06:15:00Z
  stop: 2026-10-20T06:40:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (2)
  subtitle: Nordgriechenland
  description: 'Der erste Morgen in der Wildnis: Bei einer Weckaktion wollen die Jungs die Mädchen eigentlich auf die lustige Art wecken. Leider geht dabei das Mädchenzelt zu Bruch. Was nun? Wildniscoach Tobi will der Gruppe heute mit einem Orientierungslauf das Navigieren mit Kompass und Karte beibringen. Das ist schwerer als gedacht.'
- eventId: 942782
  start: 2026-10-20T06:40:00Z
  stop: 2026-10-20T06:55:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (1/6)
  subtitle: Da war 'ne Mauer zwischen uns!
  description: Auf in die Achtziger! Anna und Julian wollen herausfinden, wie sich das Leben in der DDR angefühlt hat, und starten mithilfe von Avataren eine Zeitreise ins Jahr 1989. Auf den Spuren von Fritzi ("Fritzi - Eine Wendewundergeschichte", "Fritzi und Sophie - Grenzenlose Freundschaft") treffen sie Zeitzeugin Felicia, die als Schülerin in die Leipziger Montagsdemos gerät und Informationen dazu heimlich an die ganze Welt weitergibt.
- eventId: 942848
  start: 2026-10-20T06:55:00Z
  stop: 2026-10-20T07:10:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (2/6)
  subtitle: Die gemeine Stasi
  description: Anna und Julian sind fassungslos! In der DDR gibt es eine Geheimpolizei, die die eigenen Bürger bespitzelt, verhaftet oder sogar umbringt. Selbst Kinder und Jugendliche werden von der Stasi unter Druck gesetzt. Als der Breakdancer Gabor ein Graffiti an ein verfallenes Haus sprüht, gerät auch er ins Visier der Stasi.
