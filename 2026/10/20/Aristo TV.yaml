  title: ANIXE auf Reisen - Nagasaki Teil 2
  description: Zwar ist shoppen in Nagasaki wirklich kein Problem, aber Michael Roll ist auf der      Suche nach einem besonders typischen Mitbringsel. Schließlich wird er fündig. In den Tagen darauf fährt er auf zwei vorgelagerte Inseln, auf denen die Zeit stehen geblieben scheint. Es sind Inseln, auf denen früher noch Kohle aus den Flözen unter der See gefördert worden ist. Eine der Inseln ist sogar noch bewohnt, aber beide sind ein Eldorado für Fotografen, die einen Faible für Industrieruinen haben. Michael Roll verschafft sich auch einen Eindruck von den Zerstörungen, die 1945 in Nagasaki der zweite Abwurf einer Atombombe hinterlassen hat. Einzelheiten erfährt er beim Gespräch mit einem Mann, der die Katastrophe seinerzeit überlebt hat.
  widescreen: true
