    (WH vom Montag, 19.10.2026, 23:30 Uhr)
  description: |-
    Moderation: Jule Gölsdorf, Karolin Kandler

    In einer Schlucht in Tirol wird eine Leiche entdeckt. Die Identifikation des Toten führt nach Deutschland, wo der Mann als vermisst gilt. Widersprüchliche Aussagen lenken den Verdacht auf die Ehefrau des Opfers. In Hessen gesteht eine Frau in einem Brief an die Polizei, ihren Partner getötet zu haben. Die Beamten finden die Leiche in der Wohnung der vermeintlichen Täterin. War es Notwehr, wie sie behauptet, oder steckt ein kaltblütiger Mord dahinter?
