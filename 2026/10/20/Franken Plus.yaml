  title: Franken Plus  Das Magazin am Montag, 19. Oktober 2026 (Wh.)
  subtitle: 'Apothekensterben in Oberfranken: In Fichtelberg schließt die einzige Apotheke im Ort. Dazu: Wie eine neue Stromleitung die Energiewende voranbringt und warum Puma trotz wirtschaftlicher H..'
  description: 'Das Apothekensterben macht sich in Oberfranken zunehmend bemerkbar. In Fichtelberg hat die Berg-Apotheke aus Altersgründen geschlossen, während sich auch in Kulmbach ein Negativtrend abzeichnet. Welche Lösungen braucht es, um die Versorgung mit Medikamenten langfristig zu sichern? In Unterfranken zeigt die Höchstspannungsleitung zwischen Schweinfurt und Heilbronn, wie sich das bestehende Stromnetz für die Anforderungen der Energiewende stärken lässt. Und in Mittelfranken setzt Puma ein Zeichen für den Wirtschaftsstandort: Der Sportartikelhersteller erweitert seinen Standort in Herzogenaurach und kündigt zugleich eine Beteiligung der chinesischen Anta-Gruppe an.'
