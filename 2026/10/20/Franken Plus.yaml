  subtitle: 'Unsere Themen heute in Franken Plus - Das Magazin u.a: Bundespräsident feiert Erntedank in Kulmbach, Nobelpreis für Neutrino-Forschung: Auch die FAU ist beteiligt, Würzburg bekommt eine Stadtwerkstatt'
