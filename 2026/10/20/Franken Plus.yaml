  title: TVO - Der Bezirk
  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen Sie Ein..
  description: Der Bezirk Oberfranken - Das Magazin ist eine monatliche Sendereihe, in der die Aufgaben des Bezirks Oberfranken und die Menschen, die dafür stehen, vorgestellt werden. Dass der Bezirk Oberfranken wichtige Aufgaben zu erledigen hat, liegt auf der Hand. Über 300 Millionen Millionen Euro fließen jährlich allein in die Sozialarbeit. Aber auch Fischerei und Gewässerschutz, Kultur- und Brauchtumspflege, der Unterhalt der Bezirkskliniken und die Landwirtschaftlichen Lehranstalten sind Facetten der täglichen Arbeit der Bezirksverwaltung.
