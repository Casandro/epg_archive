  title: TOTO-Sportkabine vom 19.10.2026 (Wh.)
  subtitle: 'Unsere Themen heute in der Toto-Sportkabine: Club mit Punkteteilung in Cottbus, Fürth feiert ersten Heimsieg gegen Braunschweig, Club-Damen weiter sieglos, Ice Tigers mit Drei-Punkte-Wochenende, Nürnberg Falco..'
  description: Der 1. FC Nürnberg bleibt in der zweiten Fußballbundesliga weiter ungeschlagen und vorne dran. Die Klose-Elf holt beim starken Aufsteiger Cottbus ein 1:1. Die SpVgg feiert endlich den ersten Heimsieg der Saison. Matchwinner beim 2:0 gegen Braunschweig ist Felix Klaus mit Doppelpack. Die Club-Damen verlieren 1:2 bei Union Berlin und sind weiter immer noch sieglos in der ersten Bundesliga. Die Nürnberg Ice Tigers kassieren am Freitag eine 1:2 Niederlagen in Bremerhaven und am Sonntag feiern die Tiger einen 6:2 Derbysieg gegen München. Wieder keine Punkte gab es für die Nürnberg Falcons. In Götting steht es am Ende 74:95 aus Nürnberger Sicht. Und wir schauen noch zum Sportschießen bei der SSG RWS Fürth. Moderator Philipp Waldmann begrüßt heute Alyssa Ott, Schützin SSG RWS Fürth e.V.  und Manfred Kutt, 1. Schützenmeister & 1. Vorstand SSG RWS Fürth e.V. im Studio.
