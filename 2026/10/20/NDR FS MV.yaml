  description: Carsten Michaelis, 34 Jahre alt, kommt in die Sachsenklinik. Dr. Globisch diagnostiziert eine Lungenentzündung bei ihm. Er teilt ihr lapidar mit, dass er HIV-positiv ist. Weitere Untersuchungen ergeben, dass bei ihm mittlerweile Aids ausgebrochen ist. Sein Immunsystem ist stark angegriffen. Diese Mitteilung stellt ihn vor eine schwere Aufgabe. Er muss seiner Mutter Erika, zu der er seit dem Tod seines Vaters ein fast freundschaftliches Verhältnis hat, mitteilen, dass er an Aids erkrankt ist. Sie weiß zwar, dass er homosexuell ist, aber nicht, dass er den Virus in sich hat. Damit wollte er sie verschonen.
