  title: die nordstory - Trotz Baustopp und Datenklau
  subtitle: Comeback fürs Meeresmuseum Stralsund
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nach fünfjähriger Umbauzeit ist das Deutsche Meeresmuseum im Stralsunder Katharinenkloster wiedereröffnet worden und hat eine große Verwandlung erlebt: vom "Aschenputtel" neben dem glänzenden OZEANEUM am Hafen ist es zur neuen Prinzessin in der Innenstadt geworden. Mit einem 50-Millionen-Euro-Umbau wird das historische Kloster zur Bühne der Meereswelten des Pazifischen und Indischen Ozeans und der Karibik. Herzstück ist der Rundgang vom neuen Großaquarium, dem karibischen Riff, durch den modernisierten Aquarienkeller, bis zum neuen Schildkrötenbecken.'
