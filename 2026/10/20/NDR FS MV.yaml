  description: 'Der Stress und wir Menschen, das ist offensichtlich keine Liebesbeziehung: Genau genommen wollen 85 Prozent von uns am liebsten gar nichts mit ihm zu tun haben. Aus gutem Grund, denn die WHO nennt ihn eines der größten Gesundheitsrisiken des 21. Jahrhunderts. Doch jetzt sagen Forschende: Nicht der Stress macht uns krank, sondern wie wir mit ihm umgehen. Wir bräuchten sogar viel mehr Stress, es müsste nur der richtige sein! Und schon würde der Krankmacher Superkräfte in uns wecken.'
