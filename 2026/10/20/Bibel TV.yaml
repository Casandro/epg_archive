  title: Lebensweisen
  subtitle: Lustlos und ausgebrannt. Warum auch Priester und Ordensleute Hilfe brauchen
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Tag und Nacht für jeden Menschen in Not ein offenes Ohr haben, eigene Beziehungen zurückstellen für den Dienst an den Menschen? Ist das das Bild eines perfekten Seelsorgers? Nicht wenige Priester und Ordensleute erleben im Laufe ihres Lebens eine Überforderung durch dieses Ideal. Das Kloster Münsterschwarzach bietet Ordensleuten und Priestern im "Recollectio-Haus" Hilfe, die eigene Berufung und das eigene Priesterbild zu hinterfragen und einen Neuanfang zu wagen.'
