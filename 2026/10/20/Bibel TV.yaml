  title: Drive Thru History - Unterwegs ...
  subtitle: 'im Heiligen Land: Tempel, Kreuz und das leere Grab (11/12)'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jesus heilte am Teich von Bethesda. Doch gab es Bethesda wirklich? Können archäologische Funde die biblischen Überlieferungen bestätigen? Dave Stotts braust durch das Heilige Land. Auf den Spuren der Geschichten in der Bibel besucht er historische Orte und archäologische Ausgrabungsstätten. In der heutigen Folge erforscht Dave unter anderem die historische Davidsstadt, den ältesten besiedelten Teil Jerusalems. Eine spannende Zeitreise durch die Geschehnisse der Bibel.'
