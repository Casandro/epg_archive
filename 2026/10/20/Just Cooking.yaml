  title: Die besten Köche der Welt - Zu Gast im Ikarus - Christian Bau aus Perl-Nenning
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Christian Bau aus Perl-Nenning
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Drei Sterne, eine Vision! Christian Bau spielt in der obersten Liga des raffinierten Genusses. Weltoffen, leicht und zeitgemäß nimmt seine Küche die Gäste mit auf eine luxuriöse Reise von Paris bis Tokio. Heuer werden Christian Baus preisgekrönte Kreationen erstmals in ihrer ganzen Fülle in Österreich präsentiert. Im Salzburger Restaurant Ikarus wird die Luft brennen, denn die extrem aufwändigen Gerichte werden hier für doppelt so viele Gäste wie im Victor''s Fine Dining By Christian Bau serviert. AT 2016'
