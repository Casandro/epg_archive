  title: Die besten Köche der Welt - Zu Gast im Ikarus - Soren Selin aus Kopenhagen
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Soren Selin aus Kopenhagen
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Mit Zwei-Sternekoch Søren Selin betritt im Dezember der dritte dänische Spitzenkoch das kulinarische Parkett im Salzburger Hangar-7. Selin hat das geschafft, wovon viele junge Küchenchefs träumen - nämlich in die Top 3 der neuen nordischen Küche aufzusteigen und das noch dazu in der Geburts- und Pilgerstätte der New Nordic Cuisine schlecht hin - Kopenhagen. Die Lage von Selins Restaurants AOC ist nicht minder exklusiv, befindet es sich doch im Gewölbe eines 300 Jahre alten Palastes unweit des königlichen Schlosses Amalienborg. Die Philosophie des Restaurants ist tief verwurzelt in der Natur Skandinaviens mit deren ursprünglichen Produkten sowie der Kombination alter überlieferter Verarbeitungstechniken mit innovativen Formen der Produktveredelung. So etwa in der Vorspeise mit Jakobsmuschel und fermentiertem dänischem Spargel. Eine Herausforderung für Hangar-7-Executive Chef Martin Klein, der das Frühlingsgemüse in ausreichender Zahl im Dezember in Salzburg bereitstellen will. Hier muss sich das Ikarus Team auf neu geknüpfte Kontakte mit dänischen Gemüsespezialisten verlassen. Zudem spielt Gemüse auch eine Hauptrolle in Søren Selins Dessert Klassiker: Topinambur mit gerösteten Kartoffeln und brauner Butter. Gemüsige, süße, feine Würze, Karamellnoten und leichte Erdigkeit verschmelzen dabei zu einem Abenteuer für alle Sinne. Ein süßes Erlebnis anderer Art erwartet den dänischen Spitzenkoch Søren Selin am Salzburger Christkindlmarkt, wo er zum gemeinsamen Kochen auf das Team der traditionellen Kaiserschmarrnhütte am Residenzplatz trifft. AT 2016'
- eventId: 869443
  start: 2026-10-20T20:05:00Z
  stop: 2026-10-20T20:51:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Christophe Muller
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Christophe Muller
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Christophe Muller, Nachfolger von Jahrhundertkoch Paul Bocuse, zu Gast im Salzburger Restaurtant Ikarus. Der gebürtige Elsasser führt in Lyon das Bocuse-Imperium, bestehend aus sieben Brasserien und einem klassischen Gourmetrestaurant, der Auberge du Pont de Collonges. Seit 1965 wird dieses Epizentrum der französischen Hochküche jedes Jahr aufs Neue mit drei Michelin-Sternen ausgezeichnet - ein absoluter Rekord. Martin Klein, Executive Chef des Restaurants Ikarus, und sein Team wollen die Küche des Paul Bocuse und seines Statthalters Muller nach Österreich holen. Die Mission beginnt mit einer Reise nach Lyon, wo ein einmaliges Zusammentreffen wartet: Kochpapst Bocuse persönlich begrüßt Martin Klein in seiner Küche! Unter der Ägide von Christophe Muller studiert der Ikarus-Executive Chef jene Gerichte mit denen Bocuse Gourmet-Geschichte geschrieben hat: Hechtnocke, Rotbarbe mit Kartoffelschuppen und eine Vorspeise, die allen Luxus der französischen Haute Cuisine in sich vereint. Trüffelsuppe mit Gänseleber und Blätterteighaube, eine Aromenbombe die bei Bocuse stolze 90 Euro kostet. Außerdem erkundet Martin Klein die kulinarische Vielfalt von Lyon, der heimlichen Hauptstadt der französischen Küche: auf einer Tour durch die Lyonaisser Brasserien entdeckt er gemeinsam mit Gastkoch Muller, was man im Mutterland der guten Küche unter Genuss versteht. Im Salzburger Hangar-7 werden dann im Jänner die Töpfe und Köpfe rauchen. Es gilt Bocuse französische Klassiker perfekt umzusetzen, darunter natürlich auch die berühmteste Vorspeise aller Zeiten: die herrlich dekadente Trüffelsuppe! AT 2017'
- eventId: 869444
