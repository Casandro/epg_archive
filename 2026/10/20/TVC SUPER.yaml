  title: Profil 8 (odc. 10)
  subtitle: Rocher znajduje Adele stojącą nad ciałem adwokata Argosa. Mimo że kobieta zapewnia o swojej niewinności, każdy element dochodzenia wydaje się ją pogrążać.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2017
    Reżyseria: Julien Despaux
    Występują: Philippe Bas, Juliette Roudet, Jean-Michel Martial, Raphaël Ferret, Diane Dassigny, Valérie Dashwood
    Rocher znajduje Adele stojącą nad ciałem adwokata Argosa. Mimo że kobieta zapewnia o swojej niewinności, każdy element dochodzenia wydaje się ją pogrążać. Szybko pojawia się kolejna hipoteza - ktoś miałby zabić prawnika, by ukryć sekrety z przeszłości. Bohaterowie zdają sobie zbyt późno sprawę z tego, jak niebezpieczna pułapka została na nich zastawiona i jak zaciska się ona wokół Adele.
