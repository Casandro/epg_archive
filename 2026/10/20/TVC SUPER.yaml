  title: Winnice miłości 1 (odc. 32)
  subtitle: Sifis postanawia zbliżyć się do swojej małej córki, choć jej entuzjazm wprawia go w zakłopotanie. Diamantis, mając dowód na kłamstwo Daphni, domaga się wyjaśnień dotyczących jej wyjazdu do Aten.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Sifis postanawia bliżej poznać swoją małą córeczkę. Podekscytowanie, radość i uwielbienie, które widzi na jej twarzy, sprawią, że poczuje się naprawdę niezręcznie. Diamantis jest wściekły na Daphni i mając dowód na to, że go okłamała, żąda, by powiedziała mu, dlaczego pojechała do Aten. Vasiliki zdaje sobie sprawę z obecności dwóch mężczyzn przed domem, podczas gdy para śpi. To ci sami ludzie, którzy w przeszłości zaatakowali Melinę i Achilleasa.
