  title: Předpověď počasí
  subtitle: Ve středu bude zataženo až oblačno, zejména ve východní polovině území čekáme místy i polojasno. V jihozápadní polovině Čech ráno místy i mlhy. Během odpoledne a večera se od jihozápadu postupně zatáhne
  description: |-
    na celém území a v Čechách se místy vyskytne déšť, večer už bude pršet na většině území s výjimkou krajního východu. Nejvyšší teploty 16 až 21 °C, v západní polovině Čech většinou kolem 13 °C. Maxima v 1000 m na horách kolem 14 °C, v Krušných horách 10 °C. V západní polovině Čech vítr slabý proměnlivý, později mírný západní
    až severozápadní 11 až 25 km/h, jinak většinou čerstvý jihovýchodní až jižní vítr 14 až 32 km/h, místy s nárazy 55 až 70 km/h. Večer bude částečně slábnout.
