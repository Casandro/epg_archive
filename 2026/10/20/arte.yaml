  title: Namibias Naturwunder (1/2)
  subtitle: Leben am Limit
  subtitled: true
  description: 'Der Film von Jens Westphalen und Thoralf Grospitz zeigt Namibias einzigartige Landschaften und Geschichten, einschließlich der ältesten und trockensten Wüste der Welt: der Namib. Nur etwa 150 Wüstenelefanten leben hier und müssen täglich weite Strecken zurücklegen, um Nahrung und Wasser zu finden. Die Sandwüste der Namib ist ein dynamischer Lebensraum, die Küste hingegen bietet ganz andere Bedingungen. Die Dokumentation zeigt, wie Tiere in Namibia in einer extremen Umgebung überleben und bietet Einblicke in die vielfältige Tier- und Pflanzenwelt des Landes.'
