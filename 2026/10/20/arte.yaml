  subtitle: Kleine Helden, große Jäger
  subtitled: true
  description: '"Namibias Naturwunder - Kleine Helden, große Jäger" erzählt die Geschichten der Tierwelt Namibias und beleuchtet dabei auch die Herausforderungen, mit denen die Tiere zu kämpfen haben. Von den trockenen Savannen bis zu den weiten Flusslandschaften: Namibia ist das Land der tausend Gesichter, Wunder und Geschichten. Es ist eine Welt der kleinen Helden und großen Jäger.'
