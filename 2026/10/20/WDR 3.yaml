  title: WDR 3 Open
  description: Darin erzählt Fanny Opitz unter anderem über ihre Reise zum Sohn von Josephine Baker, der sie mitnahm auf die Bühne, auf der seine Mutter berühmt wurde. Vina Yun erinnert daran, wie die britische Rapperin Betty Boo in einem Londoner McDonalds auf Public Enemy traf und kurz darauf zur unabhängigen Künstlerin wurde. Nikta Vahid ehrt die iranische Ikone Googoosh; Juliane Streich die Ostberliner Musikerin Katharina Kollmann alias Nichtseattle. Und Sarah Ulrich schreibt nicht unkritisch über den katalanischen Superstar Rosalía.
  subtitle: These Girls Forever!
