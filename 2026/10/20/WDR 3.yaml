  title: WDR 3 Konzert
  subtitle: WDR 3 Klassikpreis der Stadt Münster
  description: |-
    Der WDR 3 Klassikpreis der Stadt Münster regt junge Musikerinnen und Musiker dazu an, sich einige Wochen nach dem Bundeswettbewerb "Jugend musiziert" dem hohen Anspruch der klassisch-romantischen Musiktradition zu stellen. Die besondere Herausforderung besteht in der künstlerischen Durchdringung eines mehrsätzigen Originalwerkes. Igor Levit zum Beispiel ist als 13jähriger mit diesem Preis ausgezeichnet worden.
    <strong>Robert Schumann</strong><br/>Dichterliebe op. 48 (Auswahl)
    <strong>Jamie Freeman</strong>, Tenor<br/><strong>Smilla Theresia Rose</strong>, Klavier
