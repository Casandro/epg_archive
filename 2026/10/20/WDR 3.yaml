  title: WDR 3 Jazz
  subtitle: Exciting Rhythms Of Piano Pasha
  description: |-
    Der Pianist Erdogan Çapli, Künstlername "Piano Pasha", kam 1957 aus der Türkei in die USA und beschloss zu bleiben. Sein Exotica-Sound, gewürzt mit orientalischem Flair, traditionellen türkischen Rhythmen und einem Repertoire zwischen "Uska Dara" und "Caravan", eingespielt mit Piano Pashas 14-jährigem Sohn Kerim am Schlagzeug, war ein völlig eigenständiger Klang im Piano-Jazz der damaligen Epoche.
