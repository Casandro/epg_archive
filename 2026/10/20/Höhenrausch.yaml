  description: 'Ultimate Rush: Wir begleiten einige begnadete Freeskier an Orte, die zu den bestgehüteten Geheimnissen der Welt zählen: Kashmir, Indien und Hokkaido, Japan. Die Extremsportler Mark Abma und Mike Wilson begeben sich zum Himalaya, während Sean Pettit, Jacob Wester und Henrik Windstedt in Japan scheinbar endlosen Tiefschnee erleben. AT 2012'
