- eventId: 869291
  start: 2026-10-20T01:10:00Z
  stop: 2026-10-20T02:00:00Z
  title: Faszination Heimat - Robert Schneider - Meine Heimat Vorarlberg
  subtitle: Faszination Heimat - Robert Schneider - Meine Heimat Vorarlberg
  description: Erstmals zeigt der Erfolgsschriftsteller Robert Schneider sein Bergdorf Meschach, die 60 Seelen Gemeinde, in der er als Bauernjunge den Weltbestseller "Schlafes Bruder" schrieb und in dem er noch heute mit seiner Familie lebt. Von Meschach aus reist er für seine Porträtreihe "Silent Faces" (stille Gesichter) durch ganz Vorarlberg und erzählt seine eigene Geschichte von besonderen Orten und Menschen. Durch den Sucher seiner Filmkamera entdeckt Robert Schneider seine Heimat. AT 2014
- eventId: 869292
  start: 2026-10-20T02:05:00Z
  stop: 2026-10-20T02:52:00Z
  title: Heimatleuchten - Entlang der Ybbs - Von schwarzen Fürsten & hellen Köpfen
  subtitle: Heimatleuchten - Entlang der Ybbs - Von schwarzen Fürsten & hellen Köpfen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 869293
  start: 2026-10-20T02:55:00Z
  stop: 2026-10-20T03:15:00Z
  title: Altai - Ein unverhofftes Glück
  subtitle: Altai - Ein unverhofftes Glück
  description: Im Frühjahr 2014 brechen die deutschen und österreichischen Ski-Alpinisten David Pitschmann, Fabian Lentsch, Joi Hoffmann, Michael Trojer und Jakob Schweighofer zu den entfernten russischen Altai-Bergen auf - voller Hoffnung, dort ein Ski-Paradies zu entdecken. Nach einer langen Reise kommen die Sportler an einem kleinen Holzschuppen an, der sich in Kurai, einem russischen Bauerndorf, befindet. Als die ersten Sonnenstrahlen in ihr Zimmer scheinen, öffnen sie die Vorhänge und sehen das gesamte Altai-Massiv vor sich - unberührt und unglaublich schön. Würden sich die dortigen Bedingungen zum Skifahren eignen? Was sie schließlich im Herzen dieser himmelhohen Berge finden, übertrifft all ihre Vorstellungen - ein wahrhaft unverhofftes Glück!  DE 2015
