  stop: 2026-10-20T06:42:00Z
  title: White Wedding
  subtitle: White Wedding
  description: 'In JACKSON HOLE, WYOMING, war der unerbittliche Winter 2017 einer für die Rekordbücher. Erleben Sie diese epische 600-Zoll-Saison noch einmal in Storm Shows neuestem Ski-/Fahr-/Adrenalinfilm WHITE WEDDING. Zu den Highlights gehören: NECK DEEP POWDER, MASSIVE AIRS & WAHRSCHEINLICHE ERSTE ABSTIEGE, das atemberaubende SNOWPOCALYPSE-Event und eine 40-Meilen-EXPEDITION in das Herz der WIND RIVER RANGE. Begleitet von einem boomenden Soundtrack von GAMBLE, SID FLY & SIX O''CLOCK, KOOL KARLO und QUEEN OF NOISE wird Sie der 18. jährliche Skifilm der Storm Show mit Sicherheit in winterlicher Ehe zurücklassen, bis der Sommer Sie trennt US 2017'
- eventId: 869327
  start: 2026-10-20T06:45:00Z
  stop: 2026-10-20T07:32:00Z
  title: Über alle Berge - Mit Lamas über die Alpen
  subtitle: Über alle Berge - Mit Lamas über die Alpen
  description: |-
    Die Alpen - trotz ihrer Größe und Erhabenheit versuchen die Menschen es immer wieder mit eigener Kraft zu bezwingen.
    Zwei Männer aus Tirol machen sich auf den Weg, den schon der große karthagische Feldherr Hannibal vor mehr als 2000 Jahren gewagt hat: den Traumpfad. Über die Alpen von München bis nach Venedig. Ein einzigartiges Abenteuer über 550 km (Wegstrecke) und über 20.000 Höhenmeter. Ihre Weggefährten sind jedoch keine Elefanten - es sind zwei Lamas. Für Mensch und Tier. eine unglaubliche Anstrengung. AT 2017
- eventId: 869328
  start: 2026-10-20T07:35:00Z
  stop: 2026-10-20T08:22:00Z
  title: Winterdienst auf Schienen - Stahlkolosse auf eisigen Gleisen
  subtitle: Winterdienst auf Schienen - Stahlkolosse auf eisigen Gleisen
  description: Meterhoher Neuschnee am schweizerischen Gornergrat. Oben auf fast 3200 Meter Höhe sind die Menschen abgeschnitten. Der Räumtrupp der Gornergratbahn versucht sich durch die Naturgewalten zu kämpfen. Ständiger Begleiter, die Angst vor Lawinen. Auch an der österrreichischen Schafbergbahn kämpfen tapfere Männer mit dem Schneepflug gegen Eis und Schnee. Doch ausgerechnet am steilsten Stück wird das Risiko unkalkulierbar.  AT 2017
- eventId: 869329
  start: 2026-10-20T08:25:00Z
  stop: 2026-10-20T09:12:00Z
  title: Bergwelten - Serfaus - Fiss - Ladis
  subtitle: Bergwelten - Serfaus - Fiss - Ladis
  description: 'Bergwelten: Serfaus Fiss Ladis - Am Sonnenbalkon Tirols. Im Oberen Inntal, an der Grenze zum Schweizer Engadin, versteckt sich hoch über dem Fluss ein kleines Paradies. Das milde Hochplateau ist das Tor zu den Bergen der Samnaungruppe und ein Dorado für Bergsportler aller Disziplinen. Wanderwege führen bis zur Silvretta und über die Grenzberge in die Schweiz. Almböden, Moränenlandschaften, Bergseen - die Bergtouren rund um Serfaus, Fiss und Ladis bieten Gipfelglück und Entspannung, weit weg vom hektischen Alltag. Die Vielfalt des Hochplateau von Serfaus, Fiss und Ladis - Klettersteige, Wassersport, Alpakas, Fahrradtouren, Schmugglerrouten und vieles mehr. AT 2022'
- eventId: 869337
  start: 2026-10-20T09:15:00Z
