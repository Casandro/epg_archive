  description: "Die Eisheiligen\nNach dem Roman Helga M. Novak\nRegie: Gabriele Bigott\nMit: Winnie Böwe, Eva Weißenborn, Martin Seifert, Bärbel Röhl, Jens-Uwe Bogadtke \nMusik: Falk Breitkreuz (Bassklarinette), Ulf Burkwardt (Violoncello), Tobias Morgenstern (Akkordeon, Klavier), Winnie Böwe (Singstimme)\nTon und Technik: Peter Avar, Venke Decker\nRBB 2006\nLänge: 54?22\n\nKurz vor dem Zweiten Weltkrieg beginnt Sophies Geschichte. Gedächtnissplitter zeigen eine Kindheit, die von Kälte und Lieblosigkeit geprägt ist. Ein Hörspiel über das Verschwinden von Nähe und die Macht der Erinnerung."
