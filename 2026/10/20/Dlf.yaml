  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nProteste in Frankreich - Reaktion der katholischen Kirche \nDie Eskalation von Protesten in Frankreich gegen hohe Lebenshaltungskosten und Missstände im Bildungssystem hat viele Franzosen fassungslos gemacht. Jetzt hat auch die katholische Kirche in Frankreich darauf reagiert. \n\nEhre für die Göttin - Das hinduistische Fest Durga Puja \nDie Gläubigen bauen an dem mehrtägigen Fest Altäre und Statuen zu Ehren der Göttin Durga in den Höfen und auf den Straßen auf. Doch die Verehrung der Göttin steht im krassen Widerspruch zum Umgang mit Frauen in der indischen Gesellschaft. So ist Vergewaltigung in der Ehe in Indien bis heute keine Straftat. Das Verfahren gegen Straffreiheit bei Vergewaltigung in der Ehe vor dem Supreme Court geht jetzt in die letzte Runde. \n\nModerne am heiligen Feuer: Verbrennungsghat 2.0 in Varanasi\nDie indische Stadt Varanasi gilt als die heiligste Stadt des Hinduismus. Jedes Jahr pilgern Millionen von Hindus nach Varanasi, um dort zu sterben oder am Ufer des Ganges einen toten Angehörigen zu verbrennen. Jetzt soll eine der ältesten Einäscherungsstätte aufwendig saniert werden. ..."
