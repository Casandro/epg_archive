  description: "Arthrose\nGelenkschmerzen im Alter\n\nGast:\nDr. Wolfgang Böker, Co-Kongresspräsident, Deutscher Kongress für Orthopädie und Unfallchirurgie, Gemeinschaftspraxis für Orthopädie und Unfallchirurgie, Lüneburg\nAm Mikrofon: Martin Winkelheide\n\nReportage: \nEin Komponist erzählt von seiner Fingerarthrose\n \nAktuelle Informationen aus der Medizin: \nMigräne\nNeue Therapien verbessern die Behandlung\nInterview mit PD Dr. Robert Fleischmann, Kongresspräsident der Deutschen Migräne- und Kopfschmerzgesellschaft, Leiter des Kopfschmerzzentrums, Universitätsmedizin Greifswald\n \nKrebsprävention\nPersönliches Krebsrisiko häufig unterschätzt\nInterview mit Dr. Ursula Will, Medizinische Leitung Präventionsambulanz, Deutsches Krebsforschungszentrum, DKFZ, Heidelberg\n\nHörertel.: 00800 4464 4464\nsprechstunde@deutschlandfunk.de\n10:30-10:35 Nachrichten\n\n11:00-11:05 Nachrichten"
