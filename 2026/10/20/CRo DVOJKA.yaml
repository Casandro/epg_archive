  title: Úžasné životy
  description: 'Pavel Dostál podle Richarda Pogody. Richard Pogoda a Pavel Dostál byli nerozlučnou dvojicí. Jako malí kluci spolu prováděli lotroviny, později spolu tvořili nezapomenutelné kabarety a písně. Nerozdělila je ani náročná doba normalizačních zákazů, ani pozdější politické angažmá Pavla Dostála. Na divadelníka, režiséra, textaře, politika, ale především na svého kamaráda bude Richard Pogoda vzpomínat v Úžasných životech. Autor: Kateřina Kubalová. Premiéra.'
