  description: 'Host: MUDr. Kateřina Fialová, odbornice na ženské zdraví. Proč je v oblasti primární prevence tolik slepých míst? Co říkají nejnovější vědecké poznatky o fungování ženského těla? A na které otázky Kateřině odpověděla její vlastní chronická nemoc? Moderuje Monika Valentová.'
