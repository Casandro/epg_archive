  title: Hubert und Staller
  subtitle: Der letzte Tango
  description: "Sonja Wirth macht undercover Jagd auf einen Taschendieb in der Tanzschule Ritter. Doch statt den Langfinger zu fassen, wird sie im Unterricht Zeuge, wie Tanzschulbesitzer Jonas Ritter von einem Deckenlautsprecher erschlagen wird. Für Hubert und Staller sieht alles nach einem tragischen Unfall aus. Pikanterweise stellt sich heraus, dass Yazid die Lautsprecher installiert hat. Hat er gepfuscht? Yazid weist das empört von sich und tatsächlich ergeben die Untersuchungen, dass die Boxen-Halterung manipuliert wurde. Während Hubert nun nach Verdächtigen sucht, entdeckt Staller plötzlich den Tango-Tänzer in sich - was nicht zuletzt an der feurigen Tanzlehrerein liegt. \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.\nKrimi, Deutschland 2016, R: Holger Gimpel"
