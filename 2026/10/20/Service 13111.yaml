  title: Terra Mater
  subtitle: Wildnis Oslo
  description: 'In Oslo, der Hauptstadt Norwegens, leben wilde Tiere mitten unter uns: Wölfe streifen durch die Wälder am Stadtrand, Elche naschen Äpfel in Gärten, Biber bauen Dämme entlang städtischer Flussläufe. In dieser besonderen Dokumentation begegnen wir der Natur nicht in weiter Ferne, sondern in direkter Nachbarschaft - als Teil unseres Alltags. Der Film zeigt eine unerwartete Wildnis im Herzen der modernen Stadt: Raubvögel jagen zwischen Hochhäusern, Füchse ziehen ihre Jungen unter Parkbänken groß, und mitten hindurch fließt ein Fluss, der all diese Geschichten verbindet. Oslo wird so zur Bühne für ein eindrucksvolles Zusammenspiel zwischen urbanem Leben und ungezähmter Natur.     Vereinigtes Königreich 2025'
  genre:
