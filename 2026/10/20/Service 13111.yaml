  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Geheimnisse der Maya
  description: |-
    Im 16. Jahrhundert zerstörten die spanischen Eroberer das Vermächtnis einer der fortschrittlichsten Zivilisationen auf unserem Planeten. Die historischen Zeugnisse der Maya verschwanden größtenteils. Bei diesem Versuch, alle bisherigen Erkenntnisse der Maya zu vernichten, könnten auch jegliche Hinweise auf außerirdisches Leben ausgelöscht worden sein. Die Maya sollen Aufzeichnungen über die Besuche von Außerirdischen in Südamerika geführt haben. So haben etwa Forscher Beweise entdeckt, dass sich im archäologischen Park von San Augustin in Kolumbien verschiedene Völker aus der ganzen Welt versammelten. Das ist aber einige Jahrhunderte früher, als bisher von Wissenschaftlern angenommen wurde. Hinduistische Zeichen wurden hier auf einigen steinernen Skulpturen hinterlassen. Auch in Mexiko gibt es erstaunliche Artefakte, die auf Völker rund um den Globus verweisen. Könnte all das ein Beweis für Besuche von Außerirdischen auf der Erde sein?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2019
  genre:
  - '144'
