  title: In 80 Gärten um die Welt
  subtitle: Britische Gärten - Wales bis Norfolk
  description: |-
    Der britische Gartenfachmann Monty Don reist quer durch das Herz Großbritanniens: von Nordwales über die Midlands bis nach East Anglia und an die Küste von Norfolk. Auf seinem Weg besucht er große historische Anlagen wie Bodnant Garden, Biddulph Grange und Houghton Hall, aber auch sehr persönliche Gärten, die von der Kreativität und Hingabe ihrer Besitzer leben. Die Reise führt ihn zu ganz unterschiedlichen Anlagen: zu den Küstengärten von Plas yn Rhiw, den raffiniert komponierten Gartenräumen von Wollerton Old Hall, den traditionsreichen Kleingärten von Nottingham und dem ungewöhnlichen Garten der Cambridge-Moschee. Hinzu kommen prägende Gartenpersönlichkeiten wie Beth Chatto und Adrian Bloom, deren Ideen das Gärtnern in Großbritannien nachhaltig verändert haben.
    Immer wieder stellt sich dabei dieselbe Frage: Was macht einen britischen Garten aus? Die Antwort liegt wohl nicht in einem einzigen Stil, sondern in der Vielfalt - in der Liebe zu Pflanzen, im Sinn für Atmosphäre, in der Offenheit für Einflüsse aus aller Welt und im Wunsch, mit Gärten persönliche Träume Wirklichkeit werden zu lassen.
    Dokumentarfilm, Vereinigtes Königreich 2025,  M: Monty Don
  genre:
