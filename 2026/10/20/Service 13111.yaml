  title: TM Wissen
  subtitle: Kalt, kälter, gesund? - Kann Eisschwimmen auch gefährlich sein?
  description: 'Ab ins kühle Nass: Wie kalt ist zu kalt? Kälte kann abschrecken, ist aber für manche der Schlüssel zu Gesundheit und Stärke. Der österreichische Extremsportler Josef Köberl zeigt am Augstsee, wie man eisige Temperaturen meistert. Prof. Dr. Michael Fischer von der MedUni Wien erforscht, wie unser Nervensystem auf Kälte reagiert und welche Vorteile kurze Kältereize bieten können. Spannende Einblicke in die Belastbarkeit und Anpassungsfähigkeit des Körpers! // Kann man die Essenz eines Menschen in einem Edelstein festhalten? Daniela Reiter und Biochemiker Stefan Friedl von der Mevisto GmbH verwandeln die Asche Verstorbener in funkelnde Saphire und Rubine. Elemente wie Kalzium und Phosphor werden extrahiert und zu Rohkristallen verarbeitet, deren Farbe bis zum Ende ein Geheimnis bleibt. Der präzise Schliff enthüllt schließlich die einzigartige Pracht und Geschichte des Edelsteins. // Blockchain als Brennstoff? Mitten in der Heizperiode, wo Energiekosten steigen, bietet ein Tiroler Startup eine revolutionäre Lösung: einen Bitcoin-Heizstrahler, der Wohnräume beheizt und digitale Währung generiert. Die Gründer von 21energy, Maximilian Obwexer und Lukas Waldner, entwickelten einen Hochleistungsrechner, der beim Bitcoin-Mining Wärme produziert und effizient zum Heizen nutzt. Reporter Phillip McAllister testet, ob diese innovative Kombination aus Mining und Heizenergie alltagstauglich ist. // Außerdem gehen wir den Fragen nach: Welche Kleidung schützt vor Kälte? Wie sieht Neptuns größter Mond Triton aus? Und: Wie überleben Affen im Eis? Österreich 2025'
