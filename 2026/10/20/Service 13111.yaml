- eventId: 748120
  start: 2026-10-20T01:30:00Z
  stop: 2026-10-20T02:17:47Z
  title: Die Bewegungskrise
  description: |-
    Bewegungsmangel ist die neue Pandemie unseres digitalen Zeitalters und gilt als Hochrisikofaktor für zahlreiche Krankheiten - darin sind sich alle Experten einig. Die WHO schlägt Alarm: Über 50 Prozent der Menschen aus einkommensstarken Ländern bewegen sich zu wenig und unter den Jugendlichen sind es bereits 80 Prozent - Tendenz steigend. Durch immer neue digitale wie technologische Erfindungen fällt zunehmend die Notwendigkeit weg, sich zu bewegen. Darum gilt es, Bewegung und die Lust daran neu zu finden. Wie das gelingt und wie wir unsere Trägheit besiegen können, legt der Dokumentarfilm dar. Bewegungsmangel ist nicht nur das Problem jedes einzelnen, auch auf politischer Ebene sind Lösungen gefragt. Filmemacherin Kirsten Esch trifft Politiker, Anthropologen und Gesundheits-Experten in Deutschland, Frankreich und den USA. Ihr Film räumt auf mit dem Mythos der Faulheit und begibt sich weltweit auf die Suche nach Ursachen für den Bewegungsmangel und nach innovativen Ideen im Kampf dagegen. In Dänemark gibt es Beispiele eines gelungenen Zusammenspiels zwischen Architektur und Stadtplanung, in der Schweiz arbeiten Entwickler an einem vielfach einsetzbaren Bewegungsspiels, und in Finnland ist ein ganzes Land dank eines bestens koordinierten Programms "in Bewegung". Denn Bewegung ist lebenswichtig. Ob Rückenleiden oder Krebs: Bewegung setzt in unserem Körper vielfältige Mechanismen in Gang - wirkt wie Medizin und kann dabei helfen, selbst schwere Krankheiten zu heilen.
    Dokumentarfilm, Deutschland 2022, R: Kirsten Esch
  genre:
  - '144'
  widescreen: true
