  title: Bares für Rares
  subtitle: Ein Stück TV-Geschichte
  description: |-
    Im Pulheimer Walzwerk wartet ein außergewöhnliches Stück TV-Geschichte auf einen neuen Besitzer: Die Gitarre von Hans Beimer aus der Kultserie "Lindenstraße" steht zum Verkauf! Dieses besondere Instrument, das 2006 für einen guten Zweck versteigert wurde, ist mit den Autogrammen von 30 Schauspielern und dem Produzenten der Serie versehen. Doch welchen Wert misst der Experte Sven Deutschmanek dieser Rarität bei? Obwohl die Gitarre selbst keinen hohen materiellen Wert hat, verleiht ihre Verbindung zur legendären Serie und die Vielzahl der Unterschriften ihr einen unvergleichlichen Sammlerwert. Wird Horst Lichters Händlerkarte gezogen und sind die Händler bereit, tief in die Tasche zu greifen? Die Spannung steigt!
    Show, Deutschland 2024, R: Ingo Monitor, Michaela Hülkenberg M: Horst Lichter
