  title: Dobrá rada
  description: Podvodníci na internetu připravili letos v Olomouckém kraji lidi o víc než 280 milionů korun. Jak kyberšmejdy prokouknout? Poradí chytrý Pan Prokoukl a s ním kapitánka Zuzana Slabá a podpraporčice Kateřina Rychnovská z Krajkého ředitelství policie Olomouckého kraje. A u toho můžete být s námi. V živém vysílání z atria budovy Českého rozhlasu Olomouc v Pavelčákově 19. A kdo přijde, může vyhrát i hodnotné dárkové tašky! Těšíme se na vás. Moderuje Zora Ježková.
