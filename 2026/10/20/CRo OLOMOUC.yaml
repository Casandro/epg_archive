  description: Jaké melodie zněly na valašských kopci ve chvíli, kdy se stáda ovcí vracela z pastvin do tepla zimovišť? A jakými tóny uctívali horalé svatého Vendelína, patrona všech pastýřů a chovatelů dobytka? Nová epizoda z cyklu Cimbál a husle vás tentokrát zve na podmanivou hudební exkurzi mezi zvuk halekaček, bučení krav a nelehký život bačů i fojtů. Svátek pastýřů oslavíme hezky po valašsku. Připravuje Honza Žůrek.
