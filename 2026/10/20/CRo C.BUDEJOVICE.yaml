  subtitle: Odpolední živě moderovaný radioproud plný hudby a informací z regionu.
  description: V táborských Čekanicích vzniklo místo, které spojuje malé cyklisty i zkušené bikery. Adam Kubík a Ondřej Skala půl roku budovali v prostoru bývalé cihelny nový bikepark. Podíváme se také na návrh, který měl lidem umožnit očkování proti chřipce nebo covidu-19 přímo v lékárnách. Proč vláda možnost očkování v lékárnách odmítla? Ve fotbalové Slavii se znovu řeší budoucnost útočníka Tomáše Chorého. Trenér Jindřich Trpišovský po jeho vyloučení v utkání proti Hradci Králové prohlásil, že Chorý už za Slavii nenastoupí. V Pochoutkovém roce se vrátíme k nedělnímu Posvícenskému pečení s cukrářem Vojtou Vrtiškou, vítězem jedné z řad soutěže Peče celá země. Podvody, při kterých hrají hlavní roli moderní technologie. Jak poznat takzvaný deepfake a na co si dát na internetu pozor?
