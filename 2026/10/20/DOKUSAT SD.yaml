  title: 'Hitlers Geldgeber: Die Arbeitssklaven des Krieges'
  subtitle: 'Hitlers Geldgeber: Die Arbeitssklaven des Krieges'
  description: Mithilfe großer Unternehmen inner- und außerhalb Deutschlands besetzte Adolf Hitler in weniger als vier Jahren halb Europa. Scheinbar neutrale Nationen standen tatenlos daneben und machten sich zu Komplizen des Verbrechens. Zum Auf- und Ausbau des Kriegsapparats der Nationalsozialisten wurden Millionen Menschen versklavt. Sogar mit den sterblichen Überresten und den gestohlenen Habseligkeiten der Opfer wurde noch skrupellos Profit gemacht.
  genre:
  - '129'
  widescreen: true
