  title: Tiere vor der Kamera - Der Zauber des Kranichs
  subtitle: Tiere vor der Kamera - Der Zauber des Kranichs
  description: Arendt und Schweiger fangen die Faszination des Kranichs ein. Ihre Aufnahmen zeigen den Zauber dieser Vögel in Steineichenwäldern, beim Flug, Tanz und in den Sumpfwäldern Nordostdeutschlands. Die Magie des Kranichs lässt sich nicht in Worte fassen, sondern muss erlebt werden. Genießen Sie den Zauber durch aufregend schöne Bilder.
