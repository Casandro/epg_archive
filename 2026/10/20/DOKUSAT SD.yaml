  title: 'Hitlers Geldgeber: Die Akteure hinter Hitler und der NSDAP'
  subtitle: 'Hitlers Geldgeber: Die Akteure hinter Hitler und der NSDAP'
  description: 'München, 12. September 1919. Ein mittelloser und von Rache getriebener Soldat schreibt an diesem Tag Geschichte. 13 Jahre später feiert man ihn als Retter der deutschen Nation. Sein Name: Adolf Hitler. Wie war es möglich, dass eine kleine nationalistische Partei zur stärksten politischen Kraft Deutschlands aufstieg und ihr Anführer zum Kanzler ernannt wurde? Wer waren die mächtigen und einflussreichen Akteure hinter Hitler und der NSDAP?'
  genre:
  - '129'
  widescreen: true
