  description: Ernst Arendt und Hans Schweiger präsentieren eine faszinierende Mischung aus Vogelwelt und Showbusiness. Mit einem Augenzwinkern vergleichen sie schillernde Vögel mit Sängern und Popstars, während sie auf ihrer Castingtour durch Europa einige der berühmtesten gefiederten Stars vorstellen. Von der majestätischen Nachtigall bis zum schrägen Kuckuck bieten sie einen amüsanten Einblick in das Unterhaltungsgeschäft der Natur.
