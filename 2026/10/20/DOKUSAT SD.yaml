  title: Malcolm Douglas - Über die Sandbank
  subtitle: Malcolm Douglas - Über die Sandbank
  description: In diesem Dokumentarfilm erkundet Malcolm Douglas auf einer Reise entlang der Ostküste Australiens die "Barren", unberechenbare und gefährliche Sandbänke vor den Küsten des Landes, und welche Rolle sie in den Leben der Menschen, die entlang der Küstenlinie leben und arbeiten, spielen. Seine Reise beginnt in Lakes Entance im Bundesstaat Viktoria im äußersten Süden des australischen Festlands und führt ihn nördlich nach Moreton Bay in Süd Queensland.
