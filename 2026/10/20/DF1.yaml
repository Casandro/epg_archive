  title: MareTV
  subtitle: Sri Lanka - Tropen, Tempel, Teeplantagen
  description: 'Sri Lanka steht in jeder Hinsicht für bunte Vielfalt. Wenn Sie Spiritualität oder Ayurveda suchen, hier ist es. Abenteurer und Naturliebhaber können hier auch ihre Bedürfnisse befriedigen. Niemand muss weit reisen, um exotische Welten auf dieser tropfenförmigen Tropeninsel zu entdecken. MareTV taucht in das tägliche Leben der Inselbewohner ein, von denen einige die ungewöhnlichsten Berufe ausüben: Uditha Lakmaal ist ein Palmenbaumkletterer. Er erntet den Saft der Bäume, bekannt als Palmwein, indem er auf ihre Spitze klettert. Sri-lankische Stelzenfischer haben heute tatsächlich sehr wenig mit Fischen zu tun und fungieren eher als Modelle, die von Touristen für das Schauspiel bezahlt werden. Anulawathie betreibt ein kleines schwimmendes Reifengeschäft und bietet Autoreifen für Erwachsene und Tuk-Tuk-Reifen für Kinder an.'
  genre:
  - '161'
  widescreen: true
  hd: true
- eventId: 753992
  start: 2026-10-20T13:25:00Z
  stop: 2026-10-20T14:20:00Z
  title: MareTV
  subtitle: Die Hansestadt Stralsund. Welterbe an der Meerenge
  description: 'Stralsund war einst eine der mächtigsten Städte der Hanse. Seine Lage am Strelasund, einem Seitenarm der Ostsee, brachte Reichtum: Die imposanten Gebäude aus der Backsteingotik und dem Barock sind heute UNESCO-Weltkulturerbe. Das OZEANEUM Stralsund ist eine der führenden Institutionen Europas für Ozeanografie. Die Architektur des Gebäudes im Stadthafen ist spektakulär. Auf dem Dach befindet sich eine Felslandschaft, die an südamerikanische erinnert und speziell für Pinguine gebaut wurde. Hier laufen Untersuchungen darüber, wie sensibel die Seevögel auf Unterwasserlärm reagieren. Einmal im Jahr überqueren mutige Bürger den Strelasund in einem der ältesten Langstreckenschwimmwettbewerbe Deutschlands. Mehr als 600 Menschen trotzen den kalten Gewässern und Strömungen auf der 2 km langen Strecke zwischen der Insel Rügen und Stralsund.'
  genre:
  - '161'
  widescreen: true
  hd: true
