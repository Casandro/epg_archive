  title: Die Helgoländer
  subtitle: Der Pinkelbooster
  description: |-
    Die "Rock 'n' Roll Butterfahrt": Auf der Düne vor Helgoland steht das größte, kleinste Punk-Festival Deutschlands in den Startlöchern. Zu diesem Zweck bauen die Veranstalter am Strand etwa 50 Tonnen Equipment auf. Sven kämpft unterdessen mit einem ganz anderen Problem. Der Hummerfischer soll in einigen Wochen eine Großbestellung abliefern, doch der Motor seines Bootes streikt. Und Nils erneuert gemeinsam mit seinem Handwerkerkollegen Katschi auf der Hochseeinsel ein Holzpodest, von dem offenbar niemand genau weiß, was daraus einmal werden soll.
