  description: |-
    In den späten 1970er Jahren werden in Michigan mehrere Frauen in den frühen Morgenstunden und ohne ein erkennbares Motiv brutal ermordet. Alle Spuren führen zu einem Mann, der allerdings kurz vor seiner Verhaftung fliehen kann, woraufhin sich kurze Zeit später in Texas erneut mysteriöse Todesfälle häufen. Als zwei Frauen nur knapp seinem Angriff entkommen, steht der Täter endlich vor Gericht - mit einer Vereinbarung, die ihn schon bald wieder auf freien Fuß setzen könnte.

