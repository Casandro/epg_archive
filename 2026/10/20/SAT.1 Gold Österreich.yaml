    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
  description: Am 29. November 1987 findet ein junges Paar in Newark am Straßenrand der Route 40 die Leiche einer Frau. Sie wird als Shirley Ellis identifiziert. Am 29. Juni 1988 entdecken Bauarbeiter auf einer unbefestigten Straße nahe der Route 40 die Leiche von Catherine Dimauro. Ihre Verletzungen sind identisch mit denen von Shirley Ellis. Die Polizei vermutet einen Serienmörder und wagt einen riskanten Undercover-Einsatz, um ihm auf die Spur zu kommen.
