    Krimi, USA 1998
    Altersfreigabe: ab 12
  description: |-
    Als TV-Produzent Jackson Burley eine Krankenhausserie namens "Dr. Danger", die auf der Tätigkeit des Arztes und Hobbydetektivs Dr. Mark Sloan basiert, wieder ins Programm nimmt, wird kurz darauf "Dr. Dangers" Konkurrent ermordet. Dabei handelt es sich um einen maskierten Magier, der Geheimnisse ausplauderte. Mark Sloan und dessen Sohn Steve recherchieren, dass zwischen den verschiedenen Sendern der Kampf um die Einschaltquoten bereits tödliche Ausmaße angenommen hat.

