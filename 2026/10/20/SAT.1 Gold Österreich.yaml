  description: In der Nacht auf den 13. Juni 1977 werden im Pfadfinderlager Camp Scott in Oklahoma drei Mädchen zwischen acht und zehn Jahren brutal ermordet. Die Spur führt zu dem flüchtigen Vorbestraften Gene Leroy Hart - doch seine Verhaftung und sein Freispruch hinterlassen mehr Fragen als Antworten. Jahrzehntelange Ermittlungen, Verschwörungstheorien und DNA-Analysen bringen keine eindeutige Gewissheit. Der Fall bleibt bis heute offen.
