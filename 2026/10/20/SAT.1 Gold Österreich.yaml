  title: Richterin Barbara Salesch
  subtitle: |-
    Für das Leben meiner Tochter
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: 'Nach einem Familienurlaub wird die 18-jährige Zoe am Flughafen wegen Drogenschmuggels verhaftet. Ihre Mutter Simone ist davon überzeugt, dass ihr Stiefsohn Marlon Zoe die Drogen untergeschoben hat, schließlich war er sieben Jahre lang drogenabhängig. Plötzlich wird Marlon angeschossen. Alles deutet auf Selbstjustiz einer verzweifelten Mutter hin - die Anklage: Versuchter Mord!'
  widescreen: true
- eventId: 837007
  start: 2026-10-20T04:24:17Z
