    Schüsse in Berryville
    Krimi-Doku, USA 2023
    Altersfreigabe: ab 12
    (WH vom Montag, 19.10.2026, 22:10 Uhr)
  description: In Berryville, Virginia, wird eine Gemeinderätin erschossen, und die kleine Stadt steht unter Schock. Wer unter den Einwohnern ist ein kaltblütiger Täter? Während die Polizei in das Leben des Opfers eintaucht, offenbaren sich alte Konflikte und verborgene Spannungen, denn nicht jeder schien mit den verabschiedeten Gesetze der Getöteten einverstanden gewesen zu sein. Die Ermittler gehen jeder noch so kleinen Spur nach und kommen der Wahrheit immer näher.
  widescreen: true
