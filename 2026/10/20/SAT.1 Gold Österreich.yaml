  description: Im Sommer 1977 werden in einem Pfadfinderlager in Oklahoma drei Mädchen im Alter von acht bis zehn Jahren brutal ermordet aufgefunden. Die Ermittler stoßen auf sorgfältig hinterlassene Spuren - eine präparierte Taschenlampe, gestohlenes Werkzeug und Fotos in einer Höhle. Die Hinweise führen zu einem stadtbekannten Flüchtigen, doch nicht alle glauben an seine Schuld.
