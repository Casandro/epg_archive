  title: Dr. Quinn - Ärztin aus Leidenschaft
  subtitle: |-
    Für das Leben der Cheyenne
    Western, USA 1994
    Altersfreigabe: ab 6
  description: |-
    Sully wurde zum Indianerbeauftragten von Colorado ernannt und soll dafür sorgen, dass die Cheyenne in ihren Reservaten bleiben und nicht mehr den Büffelherden hinterherziehen. Im Gegenzug sichert die Regierung zu, die Ureinwohner mit genügend Nahrungsmitteln zu versorgen. Doch der Beamte Mr. Hazen hält sich nicht an die Abmachung und den Indianern geht es mangels Lebensmitteln immer schlechter. Schließlich deckt Sully gemeine Machenschaften auf.

    Regie: Jerry Jameson
    Drehbuch: William Schmidt
    Komponist: William Olvis
    Kamera: Roland "Ozzie" Smith
    Schnitt: Conrad M. Gonzalez

    Darsteller:
    Jane Seymour (Dr. Michaela "Mike" Quinn)
    Joe Lando (Byron Sully)
    Chad Allen (Matthew Cooper)
    Shawn Toovey (Brian Cooper)
    Erika Flores (Colleen Cooper)
    Barbara Babcock (Dorothy Jennings)
    William Shockley (Hank Lawson)
    Jim Knobeloch (Jake Slicker)
    Geoffrey Lower (Rev. Timothy Johnson)
