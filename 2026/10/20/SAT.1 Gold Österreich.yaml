    Mietnomaden à la Flodders
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: 'Jan Talgott ist bestürzt: Er ist auf eine Messie-Familie hereingefallen. Die macht es sich in seinem Elternhaus auf ihre Weise "gemütlich" und denkt nicht daran, Miete zu zahlen. Jans Frau steht aufgrund der finanziellen Belastung schon kurz vor der Depression. Ist dem Immobilienkaufmann der Kragen geplatzt? Hat er sich tatsächlich illegal Zutritt zur Wohnung von Familie Schütz verschafft und Mutter Ursula unter einem zwei Meter hohen Regal begraben?'
  widescreen: true
