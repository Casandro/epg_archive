  title: 'Leben mit einem Serienkiller: Liebe, Lügen, Mord'
  subtitle: |-
    Anthony Shore
    Dokumentation, USA 2022
    Altersfreigabe: ab 16
  description: Jahrelang waren die Ermittler in Houston einem Serienkiller auf der Spur, der wegen seines Modus operandi auch als "Tourniquet Mörder" traurige Berühmtheit erlangte. Er lauerte meist minderjährigen Mädchen auf, vergewaltigte sie und erdrosselte sie mit einem selbstgebauten Tourniquet. Erst 2003 kam es zum Durchbruch, als eine DNA-Spur von einem Opfer Anthony Shore entlarvte - einen Familienvater, der von seinen eigenen Töchtern des sexuellen Missbrauchs bezichtigt wurde.
  widescreen: true
