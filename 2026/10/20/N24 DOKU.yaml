  title: Landen, Löschen, Laden - Cargo-Drehkreuz Leipzig
  subtitle: Landen, Löschen, Laden - Cargo-Drehkreuz Leipzig
  description: Bereits 1927 ging der Flughafen Leipzig/Halle in Betrieb, 81 Jahre später eröffnete DHL hier ein Drehkreuz. Mit 1,4 Millionen Tonnen Luftfracht im Jahr 2020 ist der Airport Leipzig/Halle der zweitgrößte Frachtflughafen Deutschlands. Im DHL-Hub sorgen rund 6000 Mitarbeiter dafür, dass 150.000 Sendungen pro Stunde ihre Ziele erreichen. Die Reportage blickt hinter die Kulissen des Logistikknotenpunkts, begleitet Mitarbeiter der Fluggesellschaft Antonow Airlines und zeigt Zollbeamte bei Kontrollen.
  widescreen: true
