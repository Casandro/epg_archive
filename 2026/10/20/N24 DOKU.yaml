  description: 'Eine junge Kolumbianerin wirkt nervös - unter ihrer Kleidung verbirgt sich mehr, als sie preisgeben will. Währenddessen gerät eine britische Passagierin ins Visier der Beamten: Ihr Ausweis wirft Fragen auf, und ein zweiter Pass sorgt für noch mehr Rätsel. Auch ein Paar auf Inlandsreise gerät unter Verdacht - die Spürhunde wittern etwas Unerlaubtes.'
