  title: Lost Places - Folge 72
  subtitle: Lost Places - Folge 72
  description: In den Wäldern Kroatiens befindet sich ein ominöser Turm. Ein Gebäude am Rande des New Yorker Hafens wurde von der US-Regierung seit dem zweiten Weltkrieg bis in die 1960er Jahre für Transporte nach Europa eingesetzt. Im ländlichen Kolumbien liegen verborgen im Unterholz die Überreste einer Stadt. Eine prächtige Anlage am Ufer der Londoner Themse scheint nicht zur tristen Umgebung des Stadtviertels zu passen. Sie spielte eine wichtige Rolle für die Entwicklung der einst größten Stadt der Welt.
  widescreen: true
- eventId: 866839
  start: 2026-10-20T12:58:00Z
  stop: 2026-10-20T13:47:00Z
  title: Lost Places - Folge 73
  subtitle: Lost Places - Folge 73
  description: 'Auf der australischen Cockatoo-Insel befinden sich die Überreste eines einst berüchtigten Gefängnisses. Verborgen auf einer Insel im Golf von Mexico liegt eine rätselhafte Ruine, die zum Schutz gegen Piraterie errichtet wurde. Im bulgarischen Ljulin-Gebirge versteckt sich ein verlassener Gebäudekomplex: Die Bankja-Residenz wurde vom kommunistischen Parteichef Schiwkow in Auftrag gegeben. Im Norden Deutschlands ragen noch heute die Gemäuer einer einst streng geheimen U-Boot-Fertigungsanlage auf.'
  widescreen: true
- eventId: 866840
  start: 2026-10-20T13:47:00Z
  stop: 2026-10-20T14:45:00Z
  title: PS-Riesen im Einsatz - Landmaschinen
  subtitle: PS-Riesen im Einsatz - Landmaschinen
  description: 'Moderne Landwirtschaft ist ohne sie undenkbar: Riesige Erntemaschinen wie Rüben- und Kartoffelroder, tonnenschwere Traktoren und PS-starke Häcksler. Agrartechnik made in Germany spielt auf dem Weltmarkt ganz vorne mit. Wie funktionieren die leistungsstarken Ernteriesen? Wo werden sie hergestellt? Die Reportage sieht sich auf der Landtechnikmesse Agritechnica in Hannover um, ist bei einem Ernteeinsatz in Vorpommern dabei und zeigt, mit welchem Aufwand die XXL-Maschinen transportiert werden.'
  widescreen: true
- eventId: 866841
  start: 2026-10-20T14:45:00Z
  stop: 2026-10-20T15:45:00Z
  title: Vom Passagierjet zum Cargo-Flieger
  subtitle: Vom Passagierjet zum Cargo-Flieger
  description: Das Passagieraufkommen steigt und immer modernere Flugzeuge werden in kurzer Zeit in Dienst gestellt. Gleichzeitig wächst der Bedarf, Waren per Luftfracht zu verschicken. Und so werden Passagierflugzeuge in Cargoflieger umgebaut. Diese "Passenger to Freighter"-Umwandlungen sind mittlerweile ein wichtiges Mittel zur Bewältigung der Nachfrage an Frachtmaschinen. Die 24h-Lieferangebote diverser Onlinehändler benötigen eigene größere Flotten an Flugzeugen und kurbeln damit den Umbaumarkt an.
  widescreen: true
