  description: 'Zenica in Bosnien ist mit einhundertfünfzehntausend Einwohnern die viertgrößte Stadt des Landes. Sie ist ein Ort, geprägt durch Armut und hohe Arbeitslosigkeit. In Zenica leben fünfzehn Prozent Katholiken, dreißig Prozent Orthodoxe und fünfzig Prozent Muslime. Seit vielen Jahren konkurrieren die drei religiösen Gruppen um die Macht:  Zenica gleicht einem Pulverfass. Mittendrin, in einem eigenen Stadtteil, liegt das größte und härteste Gefängnis Bosniens.'
