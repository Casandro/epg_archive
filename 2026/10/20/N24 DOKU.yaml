  subtitle: 'Border Patrol Südamerika: Zwischen Duty-Free und Drogendeal'
  description: 'Am Flughafen von Santiago de Chile arbeitet die Anti-Drogenbrigade an einer sensiblen Route des internationalen Schmuggels: von Brasilien nach Ozeanien. Ein Paar, das nach Neuseeland reisen will, gerät ins Visier der Ermittler - und ein Körperscan bringt Erschreckendes ans Licht. Zeitgleich sorgt eine ausgelassene Freundesgruppe, die zu einem Junggesellenabschied aufbricht, für Aufsehen - mit Folgen, die ihre Pläne abrupt verändern.'
