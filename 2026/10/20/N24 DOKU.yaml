  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  description: 'An der Grenze taucht ein schwer verletzter Mann auf und bittet verzweifelt um Hilfe. Er erzählt, wie ihn ein Kartell misshandelte, um ihn zur Mitarbeit zu zwingen. Währenddessen gerät ein leerer Tourbus ins Visier der Beamten - der verdächtige Tank wirft Fragen auf. Auch eine Routinekontrolle endet brisant: In den Sitzen eines Familienwagens stoßen die Einsatzkräfte auf eine große Menge Drogen.'
  widescreen: true
- eventId: 866867
  start: 2026-10-20T17:19:00Z
  stop: 2026-10-20T18:18:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 18'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 18'
  description: Eine Frau aus Venezuela berichtet Grenzbeamten von ihrer gefährlichen Flucht aus Venezuela und den hohen Summen, die sie an Schleuser zahlte. Währenddessen geraten in Laredo zwei US-Bürger unter Druck, nachdem ihr Versuch Drogen in Gemüsedosen zu schmuggeln aufflog und sie Hinweise auf ein illegales Netzwerk geben. In Hidalgo zeigt ein kurioser Fund, dass Polizeiarbeit nicht immer todernst ist.
  widescreen: true
- eventId: 866660
  start: 2026-10-20T18:18:00Z
