  title: Spacetime
  subtitle: Der schwerelose Mensch - Leben und Lieben im All
  description: Seit vierzig Jahren leben Menschen im Weltraum - zuerst auf den Raumstationen Saljut und Skylab, heute auf der ISS, und vielleicht schon bald in einem Raumschiff auf dem Weg zum Mars. Wie sieht der Alltag der Astronauten heute und in Zukunft aus? Welche Schwierigkeiten bereiten alltägliche Dinge wie die Morgendusche, das Essen und auch das Schlafen? Astronaut Prof. Dr. Ulrich Walter erklärt in "Spacetime", wie es funktioniert, das alltägliche Leben, Arbeiten und sogar Lieben im All.
  widescreen: true
- eventId: 866661
  start: 2026-10-20T19:10:00Z
  stop: 2026-10-20T20:04:00Z
  title: Spacetime
  subtitle: Die dunkle Seite - Schwarze Löcher und unsichtbare Materie
  description: 'Die Erde ist umgeben von Dunkler Materie und Dunkler Energie - mysteriösen Kräften, die das gesamte All durchziehen und so die Entwicklung unseres Universums maßgeblich bestimmen. Wissenschaftler sehen die Auswirkungen dieser kosmischen Rätsel, doch ihren Ursprung kennen sie nicht. Auch Schwarze Löcher gehören dazu: Gravitationsmonster, die alles in sich hineinziehen. In dieser Folge Spacetime versucht der Wissenschaftler Ulrich Walter, Licht in die dunklen Teile des Weltraums zu bringen.'
  widescreen: true
- eventId: 866662
  start: 2026-10-20T20:04:00Z
  stop: 2026-10-20T21:08:00Z
  title: Spacetime
  subtitle: Gravitation - Kraft, die alles zusammenhält
  description: Am 14. September 2015 messen zwei Detektoren in den USA zum allerersten Mal Gravitationswellen. Das bestätigte einmal mehr Einsteins Allgemeine Relativitätstheorie, die besagt, dass das Raum-Zeit-Gefüge nicht statisch ist. Doch was ist Gravitation? Warum ziehen sich Massen an? Wieso schwebt der Mensch im All und ist Schwerelosigkeit auch auf der Erde möglich? Wissenschaftler und Astronaut Ulrich Walter erklärt, was es mit der unsichtbaren Kraft auf sich hat.
  widescreen: true
- eventId: 866680
  start: 2026-10-20T21:08:00Z
  stop: 2026-10-20T22:02:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: SETI-Institut'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: SETI-Institut'
  description: Das SETI-Institut widmet sich der Erforschung des Universums und der Frage, ob es außerirdisches Leben gibt. Doch im Oktober 2017 wurden die renommierten Wissenschaftler vor ein Rätsel gestellt. Ein seltsames Objekt, genannt Oumuamua, rauschte auf die Erde zu. Es war stolze 800 Meter lang, aber nur 80 Meter breit. Die Oberfläche des unbekannten Himmelsobjekts reflektierte zehnmal stärker als die eines gewöhnlichen Kometen. Handelte es sich um ein Raumschiff?
  widescreen: true
- eventId: 866681
  start: 2026-10-20T22:02:00Z
  stop: 2026-10-20T22:55:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Wales'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Wales'
  description: In den frühen Morgenstunden des 27. Februar 2016 erleben die Einwohner von Pentyrch etwas, das ihr Leben verändert und UFO-Interessierte weltweit erschüttert. Zeugen beschreiben ein riesiges pyramidenförmiges Objekt über einer Baumgruppe. Eine Armada von Militär-Flugzeugen und Hubschraubern greift das Flugobjekt an und liefert sich eine Schlacht mit ihm. Es sind Szenen wie aus einer Mystery-Serie, nur spielen sie sich in einem beschaulichen Dorf im Süden von Wales ab.
  widescreen: true
- eventId: 866682
  start: 2026-10-20T22:55:00Z
  stop: 2026-10-20T23:43:00Z
  title: 'Strip the Cosmos: Die Große Mauer'
  subtitle: 'Strip the Cosmos: Die Große Mauer'
  description: Die Große Mauer ist eine Ansammlung tausender von Galaxien, die typischerweise eine abgeflachte Form haben. Sie ist die größte zusammenhängende Struktur, die bisher im Universum entdeckt wurde. Warum und wie entstand diese dichte Anordnung von Galaxien, die sich zu dem sie umgebenden Raum abgrenzt? Die Dokumentation widmet sich den neuesten wissenschaftlichen Erkenntnissen über die Große Mauer und untersucht hierbei einen Zeitraum von sechs Milliarden Lichtjahren.
  widescreen: true
- eventId: 866683
  start: 2026-10-20T23:43:00Z
  stop: 2026-10-21T00:32:00Z
  title: 'Strip the Cosmos: Die Eisriesen'
  subtitle: 'Strip the Cosmos: Die Eisriesen'
  description: Am Rande des Sonnensystems ziehen die frostigen Planeten Uranus und Neptun einsam ihre Kreise. Beide tanzen im Vergleich mit den inneren Planeten ziemlich aus der Reihe. Uranus liegt auf der Seite und "rollt" quasi um die Sonne. Neptun hat einen riesigen Mond, der ihn in der falschen Richtung umrundet. Die beiden Eisriesen sind bislang noch wenig erforscht. Nur die Sonde Voyager 2 passierte sie in den 1980er Jahren. Doch die Giganten aus Eis, Methan und Ammoniak lohnen einen genaueren Blick.
  widescreen: true
