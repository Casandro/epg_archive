  title: Planet Weltweit - Alligatorjagd in Florida
  subtitle: Planet Weltweit - Alligatorjagd in Florida
  description: Blauer Himmel über Florida, die Sonne scheint. Im Teich neben dem Haus springen die Fische. Ein Idyll - säße nicht versteckt im Schilf ein Alligator. Die Hausbesitzerin ist aufgebracht. Sie hat einen kleinen Terrier auf dem Arm und erzählt, wie ihr letzter Hund von einem Alligator gefressen wurde. Also muss ihr ungebetener Badegast weg. Eine Aufgabe für Scot Barbon. Er ist einer von Floridas vierzig staatlich zugelassenen Alligator-Trappern. Sie sind die Bürgerwehr, die immer dann ausrückt, wenn sich Menschen durch Panzerechsen gestört fühlen. Eigentlich ist Scot Barbon hauptberuflich Rasenpfleger, doch seit die Menschen mit ihren Häusern immer tiefer in die Natur Floridas vordringen, kann er sich vor Alligator-Notrufen kaum mehr retten. Wir begleiten Scot Barbon auf seiner Jagd nach den Alligatoren im Vorgarten. Ein Alligator im Gartenteich. Das ist in Polk County West, im Zentrum Floridas, keine Seltenheit. Auf einem Gebiet um die 2.000 Quadratkilometer gibt es mehrere hundert Seen und unzählige Kanäle. Seit Millionen von Jahren lebten die Alligatoren ungestört, bis der Mensch kam. Täglich ziehen Hunderte Neubürger aus dem Rest der USA in den Sunshine State. Der Lebensraum der Echsen wird knapper. Immer häufiger kommt es deshalb zum "Nachbarschaftsstreit" zwischen Mensch und Tier. Besorgte Bürger rufen den Alligator-Trapper Scot Barbon, damit er ein mutmaßliches Problemtier aus der Zivilisation entfernt. Doch Scot Barbon hat nicht für jede Beschwerde über Alligatoren Verständnis, z.B. bei Tieren, die gerade mal einen Meter zwanzig kurz sind. "Die schaden niemandem und müssten nicht entfernt werden", sagt er, obwohl er sein Geld damit verdient. Denn jedes gefangene Tier bringt er zu einem Verarbeitungsbetrieb, der Fleisch und Häute verwertet und weiterverkauft. Ungefährlich sind Alligatoren allerdings nicht. Auf der Insel Sanibel im Golf von Mexiko vor Florida verursachten ausgewachsene Exemplare innerhalb von drei Jahren zwei Todesfälle. DE 2007
