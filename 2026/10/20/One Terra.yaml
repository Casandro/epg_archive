  title: Planet Weltweit - Fort McMurray, Kanada im Ölfieber
  subtitle: Planet Weltweit - Fort McMurray, Kanada im Ölfieber
  description: 'Noch vor zehn Jahren war das kanadische Fort McMurray ein verschlafenes Trapperdorf. Heute drängen sich hier 100.000 Menschen. Das Milliardengeschäft mit dem Öl hat sie hergelockt: Der Boden unter der Region Alberta birgt das zweitgrößte Ölvorkommen der Welt. Jeder will hier sein Glück machen, keiner mehr als Elektriker oder Kellner arbeiten.  DE 2013'
