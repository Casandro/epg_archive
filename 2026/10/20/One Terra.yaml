  title: Planet Weltweit - Sucevita - Rumäniens schönste Klosterfresken
  subtitle: Planet Weltweit - Sucevita - Rumäniens schönste Klosterfresken
  description: 'Das Kloster Sucevia liegt in der Bukowina, ganz im Norden Rumäniens. Das Kloster ist eines der schönsten Moldauklöster und das einzige, dessen Innen- und Außenwände vollständig mit Wandmalereien und Fresken versehen sind. Im Winter leben die Nonnen ein stilles, weltentrücktes Leben, doch wenn der Frühling kommt, erwachen Kloster und Dorf. Der Alltag der 80 Nonnen im Kloster Sucevita ist unverrückbar geregelt. Jeder Tag beginnt mit dem Klang der Toaca, einem Holzbrett, das von einer Schwester geschlagen wird und zum Gebet ruft. Drei Stunden dauert der morgendliche Gottesdienst in der kleinen Winterkapelle. Es ist die Zeit der Stille und Einkehr. Im Klosteralltag hat jede Nonne eigene Aufgaben zu erledigen, in den Klosterwerkstätten werden jetzt kunstvolle Arbeiten erledigt, wie das Besticken religiöser Gewänder und die Restaurierung wertvollster Ikonen, für beides sind die Nonnen des Klosters weit über die Grenzen des Landes hinaus bekannt. Doch mit der Schneeschmelze erwacht das Leben im Kloster und in den umliegenden Dörfern, denn es steht das höchste Fest der Orthodoxie an: das Osterfest. Jetzt ist das Kloster wie ein Bienenstock, es wird gebacken und geputzt, Tausende Eier werden gefärbt. Und auch in dem kleinen Bauernhaus der Bäuerin Lacrimiora herrscht emsiges Treiben: Neben ihrem harten Alltag auf dem Hof nutzt sie jede freie Minute für die Ostervorbereitungen, ganz in der uralten Tradition ihrer Familie. Und dann endlich ist es soweit: Karsamstag im Kloster von Sucevita, es beginnt die Feier um die Auferstehung Christi. Und endlich öffnen sich die Tore der großen Kirche des Klosters, in die Vorfreude der Menschen auf das Fest mischt sich immer wieder das große Staunen über die unermessliche Schönheit der Fresken und Gemälde. Die ganze Nacht dauert das Fest, bis es mit dem Läuten der Glocken am Ostersonntag endgültig den Frühling in der Bukowina einläutet. DE 2018'
