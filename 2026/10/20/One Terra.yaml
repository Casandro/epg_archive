  title: Planet Weltweit - Äthiopien - Heimat des Kaffees
  subtitle: Planet Weltweit - Äthiopien - Heimat des Kaffees
  description: 'Die dreißigjährige Orit Mohammed ist im Hochland von Äthiopien aufgewachsen, der Wiege des Kaffees, der nach der hiesigen, ehemaligen Provinz "Kaffa" benannt wurde. Das anregende Aufgussgetränk lag Orit im Blut, als sie in die Arabischen Emirate zog, um dort ein Import/Export-Geschäft für Kaffee zu eröffnen. Jetzt fiebert sie wie jedes Jahr der Erntezeit entgegen, denn dann kehrt sie zurück in ihre Heimat, um ihre weit verzweigte Familie zu besuchen, aber auch um die Ernte in Augenschein zu nehmen und neue, frische Ware einzukaufen. Dafür besucht Orit kleine Farmer und dörfliche Kooperativen in einem Gebiet, das dreimal so groß ist wie Deutschland. GEO Reportage war mit unterwegs. Begleitet wird Orit von ihrer Schwester Sozit, die zwei Jahre jünger und zugleich Orits beste Freundin ist. Die beiden Frauen sind stark von dem Land geprägt, in dem sie geboren wurden: dem östlichen Hochland von Äthiopien, dem zehntgrößten Staat Afrikas und bevölkerungsreichstem Binnenstaat der Welt. Äthiopien gilt als (eine) Wiege der Menschheit, mit zahlreichen Spuren der menschlichen Entwicklungsgeschichte, und als Ursprungsheimat des Kaffees. Als eine der ersten Frauen in Äthiopien überhaupt, traute sich Orit, als eigenverantwortliche Händlerin in das Kaffeegeschäft einzusteigen, das bis heute überwiegend von Männern dominiert wird. Doch weil nicht jeder Kaffee-Farmer eine Frau als Geschäftspartnerin ernst nimmt, geht ihr Kampf um Gleichberechtigung der Frauen weiter. DE 2019'
