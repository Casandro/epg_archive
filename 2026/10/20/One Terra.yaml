  title: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  subtitle: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  description: 'Planet Weltweit: Bergkristall gehört zur Gruppe der Quarze, genauer genommen ist es Quarz in seiner reinsten und transparentesten Form. Nicht überall in den Schweizer Alpen ist der Abbau von Bergkristallen erlaubt, man braucht dafür meist ein "Strahlerpatent". Mineralien- und Kristallsucher werden in der Schweiz "Strahler" genannt. Technische Hilfsmittel sind nicht erlaubt, nur mit Spitzhacke, Hammer, Meißel und einem sogenannten Strahlstock bewaffnet, ziehen die abenteuerlustigen Frauen und Männer hoch in die Berge. Auf Schatzsuche in tiefen Felsspalten und Hohlräumen, den sogenannten Klüften, riskieren manche Kristallsucher ihr Leben, denn Sammler bezahlen für Bergkristalle oft mehrere Tausend Euro. Amateure und Berufsstrahler sind in den Schweizer Alpen unterwegs, aus ganz unterschiedlicher Motivation: Jelena Brkic ist Schmuckdesignerin und hat ihr eigenes Schmucklabel gegründet, außerdem ist es ihr wichtig, ein traditionelles Handwerk ihrer Heimat weiterleben zu lassen. Oder Thomas Steinbrugger, Berufsstrahler und ehemaliger Extremkletterer, der ausschließlich vom Abbau der wertvollen Bergkristalle lebt. In 3500 Metern Höhe schlägt er, zusammen mit seinem Bruder, jeden Sommer sein Basislager auf. Hier oben wird das Steinesuchen zur nicht ganz risikofreien Expedition. Die Veränderung des Klimas ist Fluch und Segen zugleich:  Einerseits legt das Schmelzen der Gletscher neue Klüfte frei, andererseits birgt das Tauen des Eises auch eine erhebliche Gefahr für die Schatzsucher, Unfälle gibt es fast jedes Jahr. Faszination Bergkristall, ob kleinste Kristallsplitter oder große, außergewöhnliche Funde. Nach Millionen von Jahren im Dunkeln, erstrahlen sie das erste Mal im Licht.  DE 2022'
