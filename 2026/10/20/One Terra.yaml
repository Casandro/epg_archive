  title: Planet Weltweit - Sri Lanka - Eine legendäre Eisenbahnstrecke
  subtitle: Planet Weltweit - Sri Lanka - Eine legendäre Eisenbahnstrecke
  description: Als die britische Kolonialmacht ab Mitte des 19. Jahrhunderts die Bahnstrecke durch das Hochland von Sri Lanka errichtete, diente diese vorrangig dem Transport von Waren. Zimt, Pfeffer, Tee und Kaffee wurden zur Verschiffung nach Europa von den hochgelegenen Plantagen in die Hauptstadt Colombo gebracht. Heute dient die Strecke primär dem Passagierverkehr auf der Insel. Auch Mitarbeiter neu entstandener Bio-Farmen befinden sich unter den Reisenden, denn sie wollen ihre Waren auf dem Wochenmarkt verkaufen. Auch wenn die Biobranche noch in der Testphase ist, boomt sie. Ohne die Diesellok, die sie sich über die Hänge windet, wäre ein Transport allerdings undenkbar. Das Gelände ist zu unwegsam, zu steil und abschüssig. Die Strecke mitten in den bis zu 1.900 Meter hohen Bergen. Die anspruchsvolle Strecke darf deshalb nur von erfahrenen Fahrern, die sich bereits bewärt haben, gefahren werden. Einer von ihnen ist Rodrigo Piyarathne, der seit 26 Jahren andere Strecken befährt. Er begibt sich zusammen mit einem Kollegen auf Testfahrt - über die Spirale von Demodara, bis zur Endstation hoch in den Bergen und am Ende wieder zurück ins Tal. Bewältigt Rodrigo diese Route, wird er sie zukünftig auch allein fahren dürfen. DE 2017
