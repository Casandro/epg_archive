  title: Planet Weltweit - Indien, das größte Schulessen der Welt
  subtitle: Planet Weltweit - Indien, das größte Schulessen der Welt
  description: |-
    An Indiens Schulen bekommen täglich Millionen Schüler ein kostenloses Mittagessen. Die Mahlzeiten müssen in wenigen Stunden zubereitet und an die öffentlichen Schulen der Umgebung ausgeliefert werden - trotz HighTech- Küchen und ausgeklügelter Logistik eine große Herausforderung.

    Neun Tonnen Gemüse, 15 Tonnen Reis und Gewürze, die nicht in Gramm sondern in Kilogramm den Gerichten  beigefügt werden - das ist Alltag in der hochmodernen Großküche von Hubli im Südwesten Indiens, wo jeden  Morgen 50 Mitarbeiter Mittagessen für 180.000 Schüler der Region zubereiten. Insgesamt versorgt die  Freiwilligen-Organisation mehrere Millionen Schüler im ganzen Land. Wir haben den indischen Köchen in die Töpfe und ihren kleinen Kunden auf den Teller geschaut.

    Es ist noch tiefschwarze Nacht, wenn für den 38jährigen Lingaraj Angadi der Arbeitstag beginnt. Wie seine  Arbeitskollegen steht er an sechs Tagen in der Woche um halb vier Uhr auf, um das größte Schulessen der Welt  zuzubereiten. Nur ein paar Meter von ihrem Schlafsaal entfernt arbeiten die Männer für die gemeinnützige  Stiftung Akshaya Patra, die von Hubli aus die größte Küche der Welt betreibt. Die Männer schlafen neben der  Großküche - anders wäre der frühe Arbeitsbeginn für die meisten nicht zu bewältigen. Akshaya Patra nimmt an  einem Regierungsprojekt teil, das in den 1960er Jahren entwickelt wurde und darauf abzielt, Schülern an  öffentlichen Schulen kostenlose Mahlzeiten anzubieten. Heute bekommen 120 Millionen Schulkinder zur  Mittagszeit Reis, Gemüse, Linsenbrei und Masala-Soße - eine ausgewoge und gesunde Mahlzeit. Um das gewaltige  Pensum zu bewältigen, herrscht in der Großküche strikte Arbeitsteilung: Während schon am Vorabend  Arbeiterinnen das Gemüse waschen, sortieren und schneiden, wird es am frühen Morgen von Lingaraj Angadi und  seinen Kollegen zubereitet, bevor die Portionen auf LKW geladen und bis zur Mittagszeit an die Schulen  verteilt werden. DE 2012
