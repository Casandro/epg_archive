  subtitle: Rund um den Globus - Polarschule der Nomadenkinder
  description: Jedes Jahr im August warten die Kinder der Rentierhirten auf der russischen Polarhalbinsel Jamal auf den Hubschrauber, der sie zum Ende der Sommerferien in die Schule bringt. 600 Nomadenkinder vom Volk der Nenzen leben und lernen den größten Teil des Jahres getrennt von ihren Familien. Auch die fünfjährige Katja wird für viele Monate ohne ihre Eltern sein ' zum ersten Mal im Leben. Für sie beginnt mit der Vorschule und dem Leben im Internat ein neuer Abschnitt. Der zwölfjährige Pawel kennt das Leben außerhalb seiner Familie schon, er kommt bereits in die sechste Klasse und möchte später einmal Pilot werden. Die Reportage begleitet die Kinder, wenn sie nach den großen Ferien ihr Nomadenleben gegen das Internat in der Stadt tauschen.  DE 2013
