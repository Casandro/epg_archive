  title: Planet Weltweit - Japan, Leben am Fuß des Vulkans
  subtitle: Planet Weltweit - Japan, Leben am Fuß des Vulkans
  description: Der Vulkan Iodake nimmt mehr als die Hälfte der Insel Satsuma Iojima ein. Die Menschen hier im Südwesten Japans haben vom Schwefelabbau gelebt, der sich heute nicht mehr rentiert. Immer mehr Menschen verlassen das Eiland. Die verbliebenen Einwohner wollen ihre Insel jedoch nicht aufgeben. Gleichzeitig erforschen Wissenschaftler den Supervulkan vom Meer aus, um einen eventuellen Mega-Ausbruch vorhersagen zu können. GEO Reportage hat Einwohner und Wissenschaftler getroffen. Satsuma Iojima liegt im Südwesten Japans, rund 50 km vom nächsten Festland entfernt. Auf der gerade einmal zwölf Quadratkilometer großen Insel leben heute noch 114 Menschen. In den Hochzeiten, als der Iodake für den Schwefel- und Kieselabbau genutzt wurde, waren es drei Mal so viele. Seit dem Niedergang dieser Industrien haben viele Bewohner ihrer Heimat den Rücken gekehrt. Zurück bleiben hauptsächlich alte Menschen. Es fehlt an lukrativen Arbeitsplätzen. Doch es gibt auch eine Gegenbewegung. Ein gutes Dutzend junger Großstadt-Japaner ist in den letzten zehn Jahren nach Iojima ausgewandert. Zu ihnen gehört der Geologe Hisashi Oiwane. Der Auswanderer sucht nicht nur das einfache Leben auf der Insel, er will auch deren Überleben sichern. Nachdem er durchgesetzt hat, dass die Insel zu einem schützenswerten Geopark ernannt wurde, will er nun mit einem ersten Start-up-Unternehmen Arbeitsplätze schaffen. Touren auf den Vulkan sollen sowohl Urlauber als auch gestresste Geschäftsleute begeistern. Doch werden sich Besucher darauf einlassen? Oder überwiegt die Angst vor einem neuerlichen Mega-Ausbruch des Vulkans, wie es zum letzten Mal vor 7.300 Jahren passiert ist. Damals wurden große Teile Japans von einer Aschewolke bedeckt. Und die Gefahr ist nicht gebannt. Wissenschaftler haben gerade erst Gasblasen entdeckt, die unter Wasser von dem Vulkan aufsteigen. Mit Hilfe neuer Forschungen hoffen sie hier, bald genaue Vorhersagen treffen zu können. DE 2018
