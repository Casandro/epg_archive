  title: Planet Weltweit - Finnland, die rasenden Schrottkisten
  subtitle: Planet Weltweit - Finnland, die rasenden Schrottkisten
  description: Mitten im Sommer findet im nordfinnischen Örtchen Pello ein ganz besonderes Autorennen statt. Vier Tage lang dröhnen dann die Motoren in der sonst eher stillen und friedlichen Landschaft. Mit hoch motorisierten, farbenfrohen Blechkisten voller Beulen und Schrammen geht es wieder und wieder an den Start. 750 Rennfahrer wetteifern um die Gunst des Publikums und Siegerpokale. Jeder kann teilnehmen, unabhängig von seiner Erfahrung und seinen Möglichkeiten. Das Spektakel zieht massenhaft Besucher an. Es ist eine Instanz in Skandinavien. GEO Reportage war vor Ort. Timo ist einer dieser Rennbegeisterten, der sogenannten "Jokkis". Getreu den Idealen des Landes bedeutet der Begriff wörtlich "jedermanns Welt", denn jeder ist willkommen auf dem Renn-Fest. Die Form des nicht-exklusiven Rallycross stammt aus Finnland und ist heute in allen nordischen Ländern sehr beliebt. Und Pello ist das Mekka für alle Rallyfans. Die Rennen finden auf einer Strecke im Wald statt. Jeden Sommer versammeln sich dort Tausende von Enthusiasten, um diese spektakulären Rennen zu verfolgen. Die vielen Kurven und unterschiedlichen Bodenbeläge werden sorgfältig vorbereitet, um den Autofahrern das Leben schwer und das Rennen spannend zu machen. Gemeinsam mit seinem Freund Mika hat Timo im vergangenen Herbst einen alten Volvo gekauft, der jetzt für die große Rally aufgemotzt werden soll. Timo ist auch Mitglied im "Pello Motor Sports Club", der die Veranstaltung seit über dreißig Jahren organisiert. Mit an den Start gehen aber auch andere Einwohner von Pello. Vor allem auf Anne-Mari freuen sich viele. Sie ist ein ehemals sehr erfolgreicher Star in der Rally-Szene. Viele Jahre ließ sie alle Konkurrentinnen hinter sich. Nach längerer Pause will sie es nun wieder einmal wissen. Hoch motiviert geht auch sie an den Start.  DE 2019
