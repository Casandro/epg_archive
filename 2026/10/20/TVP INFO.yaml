  title: Podróże z historią 2 (odc. 10)
  subtitle: Radosław Kotarski wyrusza w polskie Tatry. Widzowie dowiedzą się, czy górale pielęgnują dawne tradycje, m.in. przy wypasaniu owiec i wytwarzaniu oscypków.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Radosław Kotarski tym razem rusza w polskie Tatry, aby zbadać, czy tamtejsi górale nadal pielęgnują historyczne tradycje wypasania owiec. Czy naprawdę codziennie wyprowadza się je w wysokie góry? Jak dawniej wyrabiano oscypki i czy dzisiaj również używa się pierwotnych metod? Odpowiedzi na te wszystkie pytania znajdą się w programie.
  genre:
  - '149'
- eventId: 769661
  start: 2026-10-20T01:20:00Z
  stop: 2026-10-20T01:56:00Z
  title: Polskie parki narodowe 1 (odc. 7)
  subtitle: Tematem programu będzie Białowieski Park Narodowy, jeden z najcenniejszych przyrodniczo obszarów Europy, słynący z pierwotnej puszczy, żubrów i unikalnych ekosystemów.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
