    FBI-Agentin Dana Scully untersucht den Selbstmord von Roberta Sim. Dabei lernt sie Robertas kleine Tochter Emily kennen - und macht eine verblüffende Entdeckung: Die Ähnlichkeit zwischen Emily und Scullys Schwester Melissa ist geradezu unheimlich. Eine genetische Untersuchung ergibt tatsächlich eine große Übereinstimmung. Als Emilys Vater sich ebenfalls umbringt, ist Scully fest entschlossen, die vermeintliche Tochter ihrer verstorbenen Schwester zu adoptieren.

