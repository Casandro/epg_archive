  title: Charkiw - International
  subtitle: Von Lorenz Hoffmann
  description: "Charkiw, die zweitgrößte Stadt der Ukraine, 40 Kilometer bis zur russischen Grenze. 17 Sekunden Vorwarnzeit bei einem Raketenangriff. Zehntausende Einwohner haben Charkiw seit Februar 2022 Richtung Westen verlassen, viele neue sind aus den umkämpften Gebieten im Osten gekommen, wie die junge Ärztin Sofiia aus Kupjansk. Im Jeep einer Hilfsorganisation ist sie unterwegs, um Alte und Kranke in frontnahen Dörfern medizinisch zu versorgen. Über die Straßen hier sind Netze gespannt. Fahrer Chris hat dennoch den Drohnendetektor immer im Blick. Vor drei Jahren kam er als Volunteer aus den USA, ursprünglich für drei Wochen, dann blieb er. So wie Fuminori Tsuchiko, 77 Jahre alt, aus Tokio. Anfangs verteilt er Lebensmittelspenden in der Metro, inzwischen hat er im Problembezirk Saltywka eine Bibliothek für Kinder aufgemacht. Im legendären \"Hell's Kitchen\" kochen ukrainische Frauen seit Beginn der Vollinvasion täglich 1300 Portionen frisches Essen für Soldaten. Unterstützt von freiwilligen Helfern aus der ganzen Welt. Charkiw ist längst ein Symbol für ukrainische Widerstandskraft und internationale Solidarität. \n\nLorenz Hoffmann, geboren 1974 in Salzwedel in der Altmark, studierte Germanistik und Ostslawistik in Leipzig. Er arbeitet seit 2001 als freier Feature- und Ho _rspielautor fu _r den öffentlich-rechtlichen Rundfunk, Ho _rbuch- und Buchverlage und als Podcaster für die Hessische Landeszentrale für Politische Bildung. 2016 unternahm er erste journalistische Erkundungen in der Ukraine, seither entstanden mehrere Sendungen zu ukrainischen Themen, darunter eine \"Lange Nacht über den ukrainischen Nationaldichter Taras Schewtschenko\" (DLF 2024, zusammen mit Lars Meyer). Für MDR Kultur schrieb er zuletzt das Feature \"Der Brocken ist ein Deutscher - Harry Heines Reise durch den Harz\" (MDR 2024).\n\nProduktion: MDR 2026"
