  title: Die Kanzlei (82/89)
  subtitle: Kein zweites Mal
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  description: 'Nach der traumatischen Geiselnahme zieht sich Isa von Brede zurück und beginnt, ihr Leben neu zu hinterfragen. Währenddessen landet ein außergewöhnlicher Fall in der Kanzlei: Jahre nach einem vermeintlich gescheiterten Mordprozess wird die Leiche des Opfers gefunden - und mit ihr neue Beweise, die alles verändern könnten. Charlie hilft parallel einer älteren Dame, der regelmäßig Gegenstände aus dem Treppenhaus gestohlen werden, und erlebt dabei eine überraschende Wendung. Für Markus Gellert spitzt sich derweil die Lage dramatisch zu: Wegen des Verdachts auf Parteiverrat steht seine berufliche Zukunft auf dem Spiel.'
