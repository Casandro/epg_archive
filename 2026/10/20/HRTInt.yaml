  title: Kod nas doma
  subtitle: ' '
  description: Danas ćemo uživati u književnosti, glazbi i sportu, upoznati mlade robotičare, ali i otkriti nova imena koja će zaplesati pred televizijskim kamerama. Nastavljamo predstavljati kandidate Plesa sa zvijezdama pa su danas s nama televizijska voditeljica Antonija Stupar Jurkin i modni dizajner Ivica Skoko. Koliko su spremni za plesni podij, kakvi su učenici i tko će im biti plesni partneri, doznat ćemo Kod nas doma. Uz ples ide i glazba, a glazbenik Marko Vukes priprema svoj prvi veliki samostalni koncert u Zagrebu. Što nam sprema, koliko mu se život promijenio posljednjih godina i kako nastaju njegove pjesme, otkrit će nam u razgovoru ugodnom na našem kauču.
- eventId: 879058
  start: 2026-10-20T18:15:00Z
  stop: 2026-10-20T19:00:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
