  title: Samo lagano
  subtitle: ' '
  description: Danas ćemo govoriti o hrabrosti da u svijetu koji se silno trudi sve nas učiniti jednakima ostanemo drukčiji - svoji. Govorit ćemo o onima koji su se usudili promijeniti perspektivu i odmaknuti se od uobičajenih životnih pravila. "Da bi netko bio nezamjenjiv, uvijek mora biti drukčiji", ustvrdila je jedinstvena i nezamjenjiva Coco Chanel. Slagali se s njom ili ne, priznat ćete da je barem s vremena na vrijeme dobro učiniti nešto drukčije od drugih, ali i od onoga na što smo naviknuli. Krenuti neočekivanim putem može biti izazovno, ali i zabavno i inspirativno. Zato pokušajte...
