  description: S nama je dr. Beck, liječnik kojeg volite i kojem vjerujete. Na sva pitanja i nedoumice kada je o zdravlju riječ odgovore će nam dati naš doktor i njegovi sugovornici. Čekaju vas na konzultacijama od ponedjeljka do četvrtka, na HTV1. Budite uz dr. Becka i doznajte više o zdravstvenim problemima, kako se nositi s njima, kako ih liječiti i spriječiti...
