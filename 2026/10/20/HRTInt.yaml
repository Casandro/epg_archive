- eventId: 852656
  start: 2026-10-20T03:35:00Z
  stop: 2026-10-20T04:49:00Z
  title: 'Lijepom našom: Slavonski Brod (2. dio) - skraćeni'
  subtitle: ' '
  description: Glazbeno putovanje hrvatskim županijama, gradovima i općinama. Uz nastupe KUD-ova promiče tradicijsku kulturu i običaje, a domaćinima omogućuje susret s najpoznatijim pjevačima i sastavima hrvatske tamburaške glazbe.
- eventId: 852657
  start: 2026-10-20T04:49:00Z
  stop: 2026-10-20T04:57:00Z
  title: 'Studio 4: Kultura'
  subtitle: ' '
  description: Najnoviji informativni sadržaji iz zemlje i svijeta. Prijenosi, javljanja uživo, analize i razgovori s gostima iz svih područja javnog djelovanja. Politika, kultura, sport i aktualnosti iz društvenog života. Prvi, najbrži i najrelevantniji - Studio 4.
- eventId: 852658
  start: 2026-10-20T04:57:00Z
  stop: 2026-10-20T05:32:00Z
  title: Stipe u gostima (5), humoristična serija (14/20)
  subtitle: ' '
  description: Ivi u goste dolazi nekoliko njegovih kolega iz EU. Đivo je previše lijen, Stanka ne zna engleski, pa je Ive taj koji bi im trebao pokazati znamenitosti glavnog grada te ih upoznati s tisućljetnom hrvatskom kulturom. No uoči dolaska stranaca Ive se razboli pa brigu oko uvaženih gostiju preuzima Stipe koji ih vodi u obilazak zagrebačkih znamenitosti.
- eventId: 852659
  start: 2026-10-20T05:32:00Z
  stop: 2026-10-20T06:21:00Z
  title: 'Na rubu znanosti: Radiestezija'
  subtitle: ' '
  description: Tjedna emisija koja se na zanimljiv način bavi neobičnim i neobjašnjivim, analizira paranormalne pojave i misterije.
- eventId: 852660
  start: 2026-10-20T06:21:00Z
  stop: 2026-10-20T07:12:00Z
  title: Djeca sunca, dokumentarna serija (6/7)
  subtitle: ' '
  description: 'U šestoj epizodi upoznat ćemo rad njemačkog optičara Josepha Fraunhofera, koji je zaslužan za otkriće helija i drugih elemenata na Suncu. Dr. Jacob Liberman nastavlja šetnju kroz povijest heliterapije kroz rad indijskog znanstvenika dr. Dinsha Ghadialija. Saznat ćemo kako će funkcionirati svemirske solarne elektrane koje će predstaviti John Mankins i Neville Marzwell iz kalifornijskog JPL-a. Acharya S. predstavit će neke solarne tradicije diljem svijeta, a istarski astronom Korado Korlević megalitske ostatke u Istri, drevne solarne kalendare. Astronom Bojan Vršnak upoznat će nas s načinima promatranja Sunca raznim vrstama teleskopa. Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
- eventId: 852661
  start: 2026-10-20T07:12:00Z
  stop: 2026-10-20T07:39:00Z
  title: Samo lagano
  subtitle: ' '
  description: Družimo se SAMO LAGANO uz zabavne, zanimljive, motivirajuće priče, koje će vas sigurno potaknuti da zastanete, duboko udahnete i razmislite prije nego što učinite sljedeći korak.
- eventId: 852662
  start: 2026-10-20T07:39:00Z
  stop: 2026-10-20T07:59:00Z
  title: 'Studio 4: Dijagnoza'
  subtitle: ' '
  description: U razgovoru s liječnicima i reportažama otkrivaju se istine i zablude vezane za određenu dijagnozu, potiče na aktivnosti koje preveniraju bolest te na pravodobnu terapiju nakon postavljanja dijagnoze
