  start: 2026-10-20T01:00:00Z
  stop: 2026-10-20T01:54:00Z
  title: Borgia - Wunder
  subtitle: Borgia - Wunder
  description: Auf dem Weg nach Neapel sitzt die französische Streitmacht fest. Der osmanische Prinz Cem, der gemeinsam mit Cesare die Reise angetreten hatte, erkrankt und stirbt im Feldlager. Juan will sich an Lucrezia rächen, die ihn aber verhöhnt. FR 2011
  ageRating: 16
