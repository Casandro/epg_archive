  title: Borgia - Palmsonntag
  subtitle: Borgia - Palmsonntag
  description: Als Cesare nach Rom zurückkehrt, beruhigt er mit einem simplen Trick die aufrührerischen Massen. Lucrezias Cousin, der junge Kardinal Lanzol, überzeugt sie, Giovanni in die Obhut der verhassten Adriana de Mila zu geben. Rodrigo schickt Cesare und Alessandro Farnese nach Florenz, wo sie den charismatischen Mönch Savonarola zur Raison bringen sollen. Dieser entpuppt sich als schwerer Gegner. FR 2012
  ageRating: 16
- eventId: 869503
  start: 2026-10-20T22:55:00Z
  stop: 2026-10-20T23:49:00Z
  title: Borgia - Pax Vobiscum
  subtitle: Borgia - Pax Vobiscum
  description: Als Lucrezia ihrem früheren Geliebten Alfonso D'Este begegnet, flammt ihre Leidenschaft erneut auf. Unterdessen weiß sie ihren mutmaßlich entführten Sohn Giovanni in guten Händen. Obgleich er von Savonarola fasziniert ist, lässt Cesare den Mönch festnehmen und foltern, bis dieser alle Vorwürfe gesteht. Zugleich nimmt Cesare die Florentiner für sich ein, die schließlich Savonarolas Tod verlangen. FR 2012
