  start: 2026-10-20T11:00:00Z
  stop: 2026-10-20T11:55:00Z
  title: Sternstunde Kunst
  subtitle: Andreas Gursky - Fotografien wie gemalt
  description: |-
    «Rhein II» von Andreas Gursky war lange Zeit die teuerste Fotografie der Welt. Das Bild wurde im November 2011 bei einer Auktion für genau 4'338'500 US-Dollar verkauft. Der Regisseur Ralph Goertz hat Gursky acht Jahre mit der Kamera begleitet. Eine Fernsehpremiere.
    Deutschland 2025
