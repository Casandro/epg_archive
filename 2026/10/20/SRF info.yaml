  title: Sternstunde Religion
  subtitle: Unser kleiner Camper
  description: |-
    Hans und Wil sind seit ihrer Jugend ein Paar und mittlerweile 47 Jahre verheiratet. Als Wil an Demenz erkrankt, beschliesst Hans, gegen den Willen ihrer gemeinsamen Kinder einen Camper zu kaufen und mit seiner Frau, die ihn nicht mehr erkennt, durch Europa zu fahren.
    Niederlande 2025
  genre:
