  widescreen: true
  hd: true
- eventId: 758397
  start: 2026-10-20T10:00:00Z
  stop: 2026-10-20T11:00:00Z
  title: Sternstunde Philosophie
  subtitle: 'Bequeme neue Welt: Verlernen wir das Menschsein?'
  description: |-
    Apps organisieren unseren Alltag, Algorithmen treffen eine Vorauswahl, KI übernimmt das Denken. Das spart Zeit und Mühe. Philosophin und Astrophysikerin Sibylle Anderl fragt, was wir verlieren, wenn wir uns immer mehr abnehmen lassen, und was es braucht für ein gutes, selbstbestimmtes Leben.
    Schweiz 2026
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
