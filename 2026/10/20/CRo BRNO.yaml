  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: majitel Muzea RAF Jan Dašovský o lásce k letectví a modelařině. Má letiště i muzeum. Jan Dašovský byl původně letecký modelář, jeho vztah k letadlům přerostl ve vybudování Muzea RAF v Ivančicích. Popíše svou životní dráhu i plány do budoucna. A dozvíte se mnoho zajímavého o letectví druhé světové války. Moderuje Zdeněk Truhlář.'
