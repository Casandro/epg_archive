  title: Tele-Gym (8/8)
  subtitle: Schlank, Fit & Gesund
  subtitled: true
  description: |-
    Zu einer Traumfigur, drüber sind sich alle einig, gehören auf jeden Fall ein flacher Bauch, ein knackiger Po und straffe Beine.
    Die Fitness-Expertin Nina Winkler hat dafür nach neuen sportwissenschaftlichen Erkenntnissen die besten Übungen zusammengestellt. Das Trainingsprogramm funktioniert nach dem Prinzip "2 in 1": Fettverbrennung und Training finden in einer einzigen Trainingseinheit zusammen statt! Die Muskeln werden außerdem funktionell vernetzt trainiert. Dadurch sieht der Körper nicht nur gut aus, sondern die Muskulatur ist und leistungsfähig. Sogar Rückenschmerzen können mit dem Programm gelindert werden!
