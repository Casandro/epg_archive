  title: Willi wills wissen
  subtitle: Wie wild waren Wikinger wirklich?
  subtitled: true
  description: Die Wikinger waren wilde Krieger. Sie hatten Helme mit Hörnern, schnelle Schiffe und verbreiteten Angst und Schrecken in ganz Europa. So ist es in vielen Büchern zu lesen. Um herauszufinden, ob das wirklich stimmt, hat sich Willi auf den Weg nach Schleswig gemacht. Denn auch hier, im Norden Deutschlands, waren vor über 1.000 Jahren viele Wikinger zu Hause.
