  subtitle: Darina Moravcová. Každý z nás má svoj svet, ktorý si stráži a chráni. Pre niekoho je to iba koníček, pre iného práca. A v niektorých prípadoch je to ešte oveľa viac.
  description: Každý z nás má svoj svet, ktorý si stráži a chráni. Pre niekoho je to iba koníček, pre iného práca. A v niektorých prípadoch je to ešte oveľa viac. Relácia Moja Bublina s Ivanom Jankom predstavuje príbehy ľudí, ktorých bublina pomáha celej komunite. (2026)
