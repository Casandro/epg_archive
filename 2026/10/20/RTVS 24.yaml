  title: SK Dejiny (17)
  subtitle: Predseda vlády v ére koruny a trikolóry. Populárno-náučná diskusia o objavovaní zlomových okamihov našich dejín.
  description: Kto bude predsedom vlády? Na to boli v našich dejinách mnohí zvedaví. Dvakrát ním bol napríklad István Tisza. Obľuboval duely, prežil tri atentáty, no štvrtý už nie. Prvý Slovák na tomto poste Milan Hodža bol novinársky workoholik a články vraj písal doslova na kolene. Jeden z premiérov "slovakštátu" Vojtech Tuka bol kedysi vychovávateľom syna bulharského cára. Máme pred sebou veľa ďalších mien a veľký kus našej politickej histórie. V prvom diely SK_Dejiny venovanom predsedom vlády od éry Uhorskej koruny po obdobie trikolóry Slovenského štátu. (2026)
  genre:
  - '35'
