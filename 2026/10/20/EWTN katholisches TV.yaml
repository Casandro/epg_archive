  title: Gott erlebt (Staffel 5)
  subtitle: Brückenbauer & Botschafter - als Diakon am Flughafen
  description: Georg Fischer, ständiger Diakon im Zivilberuf, erzählt von seinem Weg der Berufung und davon, wie er für Menschen am Flughafen Frankfurt und in seinem Unternehmen als Brückenbauer und Botschafter "Gesicht der Kirche im Alltag der Menschen" ist. Zu seinem Engagement gehört auch ein Projekt in Uganda, das von der Hilfsorganisation seines Arbeitgebers, der Lufthansa Group help alliance, unterstützt wird. Ein persönliches Zeugnis darüber, wie Glaube im säkularen Umfeld gelebt und weitergegeben werden kann.
