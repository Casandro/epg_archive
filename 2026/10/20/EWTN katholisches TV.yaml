  title: 'Franz von Assisi: Mit den Augen eines Verliebten sehen'
  subtitle: Die Kirche
  description: Franziskus liebt die Kirche, weil er Christus liebt. Selbst den sündigen Priestern begegnet er in großer Ehrfurcht. Hier findet er die Sakramentalität der Schöpfung in besonders dichter Weise verwirklicht. Die Augen eines Verliebten sehen in der sündigen irdischen Kirche zuerst die Heiligkeit Christi, die vieltausendmal stärker ist als das augenscheinliche Böse.
