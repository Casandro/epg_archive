  title: Himmel, Herz & Hirn
  subtitle: Wie erkenne ich meine Berufung?
  description: |-
    Wie erkenne ich meine Berufung? Ehe, Priestertum, Ordensleben - oder doch ein Leben als Single? In dieser Folge des EWTN-Podcasts "Himmel, Herz & Hirn" gehen wir einer der großen Lebensfragen nach: Wozu ruft Gott mich persönlich?

    Viele Menschen stellen sich irgendwann die entscheidende Frage: Wohin soll mein Leben gehen? Heiraten, Priester werden, im Orden leben - oder bewusst allein bleiben? Diese Episode hilft dir, Klarheit zu gewinnen und Gottes Stimme im Alltag besser zu erkennen.

    Wir sprechen über die Kennzeichen einer echten Berufung und darüber, wie man sie auch unbewusst gefährden oder sogar zerstören kann. Dabei wird deutlich: Berufung ist nicht nur ein einmaliger Moment, sondern oft ein Weg, der Schritt für Schritt wächst - und zugleich eine Entscheidung, die Mut erfordert.

    Ein zentraler Punkt ist das persönliche Gespräch mit Gott im Gebet: Wie kann ich lernen, ehrlich zu fragen und offen zu hören? Außerdem gehen wir der spannenden Frage nach, ob man schon für den zukünftigen Ehepartner beten sollte.

    Auch die Gemeinsamkeiten von Ehe und zölibatärem Leben werden beleuchtet - und wir sprechen darüber, ob auch das Single-Sein eine Berufung sein kann.
  widescreen: true
