  title: Russlands Kriege
  subtitle: Das Zarenreich
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Die Romanows schreiben Geschichte. Mit Strategie und Härte hieven sie das russische Reich auf die Bühne der Weltpolitik. Bis der Erste Weltkrieg dem Zarenreich ein blutiges Ende bereitet.

    Zar Peter der Große und später Katharina die Große erobern im 17. und 18. Jahrhundert mit einer gewaltigen Armee auch Teile des europäischen Südens: die Krim und den Kaukasus. Spätere Nachfolger verteidigen das Reich der Romanows gegen Napoleon.
    HD-Produktion
