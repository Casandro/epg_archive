  title: Die sieben großen Rätsel der Menschheit
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2023
    Es sind Spuren vergangener Kulturen, um die sich geheimnisvolle Mythen ranken: Wer erschuf die Nazca-Linien? Wo liegt Atlantis? Und was hat es mit der Himmelsscheibe von Nebra auf sich?

    All das sind Relikte, die von Menschenhand geschaffen wurden. Aber wie konnte das den Menschen von damals gelingen? ZDFinfo zeigt sieben große Rätsel der Menschheit. Und begleitet Wissenschaftler, die es sich zur Aufgabe gemacht haben, die Geheimnisse aufzuklären.
    HD-Produktion
