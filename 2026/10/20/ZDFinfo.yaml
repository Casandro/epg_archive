  title: Lost Places - Geheime Welten
  subtitle: Francos Spanien
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Drei verlassene Orte in Spanien erzählen von Francos Diktatur: ein Gefängnis des Grauens, ein geräumtes Dorf und eine vergiftete Küste. Schicksale von Unterdrückung, Widerstand und Zerstörung.

    Francisco Franco regiert Spanien fast 40 Jahre mit eiserner Hand, Oppositionelle werden brutal verfolgt: In Ourense werden politische Gefangene gefoltert, Granadilla wird für ein Staudammprojekt geräumt, und in Portmán vergiftet der Bergbau eine Küstenregion.
    HD-Produktion
