  title: Lost Places - Geheime Welten
  subtitle: Pinochets Chile
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Drei verlassene Orte erzählen vom Terror der Pinochet-Diktatur in Chile: ein Gefangenenlager in der Wüste, eine zwangsgeräumte Textilfabrik und ein Krankenhaus voller dunkler Geheimnisse.

    General Pinochet reißt 1973 die Macht an sich, verfolgt Gegner brutal. In der Wüste entsteht ein Gefangenenlager, in einer Fabrik werden Arbeiter entrechtet, in einem Krankenhaus Neugeborene gestohlen. Noch heute kämpfen Betroffene um Aufklärung und Gerechtigkeit.
    HD-Produktion
