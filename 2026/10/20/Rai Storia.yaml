  description: i un lungo dramma identitario iniziato nel 1797 con la caduta della Serenissima. Dopo decenni di sottomissione e il fallimento della Repubblica di San Marco del 1848, la svolta arriva con la Terza guerra d'indipendenza. Nonostante le sconfitte italiane a Custoza e Lissa, la vittoria prussiana e la pressione diplomatica costringono Vienna a cedere il Veneto. Il plebiscito del 21 e 22 ottobre conferma formalmente l'annessione con una maggioranza schiacciante. Sebbene il voto sia avvenuto in un clima di entusiasmo popolare, il passaggio all'Italia rivela presto le fragilità di un'unificazione incompleta, tra povertà diffusa e il difficile confronto tra la memoria repubblicana e il nuovo assetto monarchico. In studio con Paolo Mieli, il professor Gilles Pécout. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  Ospite in studio il prof. Gilles Pecout Con la partecipazione di Ada Nardacchione Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
