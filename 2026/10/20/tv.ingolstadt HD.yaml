  title: nachgefragt vom 19.10.2026 (Wh.)
  subtitle: Das Talkmagazin - Gäste sagen ihre Meinung!
  description: Die älteste noch gültige Lebensmittelverordnung kommt aus Bayern. Gerste, Hopfen und Wasser sind die einzigen Zutaten, mit denen Bier gebraut werden darf. Das ist im Bayerischen Reinheitsgebot festgelegt, das im Jahr 1516 erlassen wurde. Bei Nachgefragt spricht Michelle Milewski mit dem ehemaligen Geschäftsführer der Brauerei Herrnbräu, Gerhard Bonschab, über die Gründungszeit der Ingolstädter Brauereien und darüber, wie seine Vorfahren mit der Ingolstädter Biergeschichte verbunden sind.
