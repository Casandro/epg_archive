  subtitle: Rainer Pariasek zu "Vom Abstellgleis zur Weltmeisterschaft"
  description: |-
    Er ist seit Jahrzehnten eines der bekanntesten Gesichter der ORF-Sportberichterstattung. Am kommenden Wochenende startet Rainer Pariasek in die neue Ski-Weltcup-Saison in Sölden.
    Bei Patrick Budgen erzählt der 62-jährige Wiener, warum er einige Zeit weniger am Bildschirm zu sehen war, wie er seine Ehefrau durch einen großen Zufall kennengelernt hat und wieso seine Töchter ihm erfolglos Englisch-Nachhilfe gegeben haben.
