  title: Universum
  subtitle: Hermann Maier - Meine Heimat - Das Thayatal
  description: "Für Universum begibt sich Hermann Maier diesmal in den Nationalpark Thayatal an der österreichisch-tschechischen Grenze - den mit rund 13 Quadratkilometern kleinsten und zugleich einen der vielfältigsten Nationalparks Österreichs. Über Jahrmillionen hat sich die Thaya tief in das uralte Gestein gegraben und eine einzigartige Landschaft geformt. Gemeinsam mit Rangern und Wissenschaftlern erkundet Hermann Maier diese faszinierende Wildnis aus dichten Wäldern, schroffen Felsen, stillen Flussläufen und seltenen Bewohnern.\nDabei stößt der Skiweltmeister und Olympiasieger auf so manche Überraschung. Denn gerade das vermeintlich Kleine birgt im Thayatal oft die größten Wunder: verborgene Wildkatzenspuren im Wald, Smaragdeidechsen auf sonnenwarmen Felsen, faszinierende Einblicke in die Welt der Fledermäuse in den geheimnisvollen Eisleiten oder Edelkrebse in den klaren Zuflüssen der Thaya. \nDoch das Thayatal erzählt nicht nur von der Kraft der Natur. Es ist auch eine Landschaft, die von der europäischen Geschichte geprägt wurde. \nDort, wo einst der Eiserne Vorhang Europa trennte, konnte sich über Jahrzehnte eine einzigartige Natur entwickeln. Heute arbeiten österreichische und tschechische Nationalparks eng zusammen, um diese außergewöhnliche Grenzlandschaft gemeinsam zu schützen.\nDie Universum-Dokumentation \"Hermann Maier - Meine Heimat: Das Thayatal\" ist eine atmosphärische Entdeckungsreise durch eine der faszinierendsten und zugleich unbekanntesten Naturlandschaften Österreichs.\nEin Film von Andrea Albrecht"
  genre:
  - '144'
