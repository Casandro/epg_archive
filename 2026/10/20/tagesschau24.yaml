  title: Hart aber fair
  widescreen: true
  hd: true
  audiodesc: true
  subtitle: 'Lehrer, Polizisten, Verwaltung: Wozu brauchen wir noch Beamte?'
  description: "* Lehrer, Polizisten, Verwaltung: Wozu brauchen wir noch Beamte? \nDirekt nach der Beamten-Doku, ein ARD-Themenabend: Vergleichsweise hohe Gehälter, saftige Pensionen, private Krankenversicherung, keine Angst vor Job-Verlust - Beamte genießen viele Privilegien. Deutschland leistet sich auch im internationalen Vergleich viele Staatsdiener. Wie zeitgemäß ist das noch? \nSollten Beamte auch Beiträge für die Sozialversicherung zahlen müssen? Welche Staatsdiener können und wollen wir uns noch leisten? Und in welchen Bereichen sind sie ganz verzichtbar?"
- eventId:
