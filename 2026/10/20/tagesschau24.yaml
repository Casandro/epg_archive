  stop: 2026-10-20T20:15:00Z
  title: Das Gipfeltreffen
  subtitle: Schubert, Sträter und König retten die Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Liebesbriefe vom Gipfel der Menschheit: Olaf Schubert, Torsten Sträter und Johann König sind zurück und lassen es neben verbalem Durchfall diesmal auch Erdbeeren auf euch regnen. Und überhaupt ist diese Folge eine einzige süße Naturkatastrophe: Es geht um schweren Liebesschnupfen, das Leben als Frau und den ewigen Kampf gegen Superschurke Morbus Scheuermann. \nDas \"Gipfeltreffen\"-Glotzen ist übrigens die einzige Tradition, die niemals abgeschafft werden darf, denn: Das haben wir schon immer so gemacht! Mit Fragen von Palina Rojinski, Felix Lobrecht, Linda Zervakis, Eva Padberg, Bettina Lamprecht und Tatortreiniger Thomas Kundt."
