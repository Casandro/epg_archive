  title: Vizitka
  description: 'Katarzia, hudebnice. Pozvi ma, neprídem - tak se jmenuje nové album hudebnice, songwriterky a producentky Katarzie. Základními ingrediencemi nové várky songů zůstávají hlubinný ponor do vlastních pochyb a analýza romantických vztahů. V Praze dlouhodobě žijící tvůrkyně zpívá poprvé ve větší míře česky a rozšiřuje paletu výrazů o hlasy zpěvaček, hereček a skladatelek. Co se stane s hudbou, když člověk přestane přemýšlet o tom, komu se má zalíbit a začne dělat přesně to, co zajímá jeho samotného? A z čeho vychází scéničnost ba až cinematičnost její nové desky? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
