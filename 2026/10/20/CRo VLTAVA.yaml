  title: Četba na pokračování
  description: 'Markéta Pilátová: Tsunami blues (6/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkuje Dana Černá. Režie Vlado Rusko (26 min). Natočeno v roce 2015.'
