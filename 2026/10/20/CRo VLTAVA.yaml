  title: ArtCafé
  description: 'Elfriede Jelinek slaví osmdesátiny. Rakouská spisovatelka a nositelka Nobelovy ceny za literaturu Elfriede Jelinek oslaví 20. října osmdesáté narozeniny. ArtCafé věnované její tvorbě se zaměří na její mnohovrstevnaté literární a dramatické dílo, politický aktivismus i schopnost zasahovat do veřejné debaty. O tom, jak její texty rezonují u českého publika a jaké výzvy přináší jejich inscenování, budou hovořit teatroložka a překladatelka Zuzana Augustová, která nově přeložila hru Chráněnci, a divadelní režisérka Lucie Ferenzová, jedna z těch, které Jelinek pravidelně uvádějí na českých scénách. Pořad připravila Anita Krausová. E-mail: artcafe@rozhlas.cz'
