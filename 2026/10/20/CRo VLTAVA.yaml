  title: Večerní drama
  description: 'Ingmar Bergman: Scény z manželského života. Nesmlouvavý ponor do manželského vztahu nahlédnutý především z perspektivy ženské hrdinky. V hlavních rolích Magdaléna Borová a Jaroslav Plesl. Přeložila Dagmar Hartlová. Rozhlasová úprava a režie Beata Parkanová. Dramaturgie Renata Venclová. Hudba a zvukový design Kryštof Blabla. Dále účinkují: Gabriela Míčová a Taťjana Medvecká. Natočeno v roce 2025.'
- eventId:
