  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (3/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová, Pavel Soukup a Zlata Adamovská. Režie Petr Adler. Natočeno v roce 1990 (27 min).'
