  title: Akademie
  description: Rané písně divokého Antonína Dvořáka a bílá místa obrozeneckého období. Akademie se sopranistkou Martinou Jankovou, klavíristkou Barbarou Marií Willi a muzikologem Jonášem Hájkem. O hledání originální písňové řeči jednoho z největších melodiků 19. století. O objevech hudebních pokladů z doby německo-české kulturní symbiózy. O genezi dvořákovského alba Early Songs, které získává světovou pozornost. Jedinečnou sondu do experimentálního období Dvořákovy tvorby podnikne se svými hosty Renáta Spisarová.
