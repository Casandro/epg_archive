  description: Blackfacing - sich das Gesicht schwärzen - gilt heute als rassistische Diskriminierung. Doch es gibt Menschen, die an solchen Bräuchen festhalten, wie z. B. auf dem Fest "Grenzgang", das im hessischen Biedenkopf stattfindet. Der Schriftsteller Dr. Stephan Thome nimmt sich in seinem aktuellen Roman "Besser als nie" dieses Konflikts zwischen Tradition und Moderne an. Er hat seit seinem 5. Lebensjahr fast alle Grenzgänge - und das, obwohl er seit rund 20 Jahren in Taiwan lebt. In "Thadeusz lang & breit" spricht Jörg Thadeusz mit Stephan Thome über die großen Streitfragen unserer Zeit und warum der Taiwan-Konflikt uns alle angeht.
