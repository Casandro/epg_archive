  description: "Kalifornien ist der Superstar unter den Bundesstaaten der USA: Großartige Kulissen an Land und im Ozean sind Bühne vielfältiger Stars und Sternchen. Der Landstrich bietet mehr als 2000 Kilometer Küste, über 4000 Meter hohe Berge, die größten Tiere, die höchsten und die ältesten Bäume der Welt. \n\nIm Zweiteiler \"Wildes Kalifornien\" stellt der renommierte Naturfilmer und Meeresbiologe Rick Rosenthal seine Heimat Kalifornien vor, wie man sie bislang kaum gesehen hat - über und unter Wasser. Der erste Teil \"Ströme des Lebens\" zeigt die Bedeutung des Lebenselixiers Wasser für den drittgrößten Bundesstaat der USA."
