  title: Live aus der Staatsoper Unter den Linden
  description: |-
    Richard Strauss
    Vier letzte Lieder
    Eine Alpensinfonie op. 64

    Diana Damrau, Sopran
    Staatskapelle Berlin
    Christian Thielemann, Leitung

    Mit einem reinen Strauss-Programm setzt die Staatskapelle Berlin ihren Zyklus aller Orchesterlieder von Richard Strauss fort. Die 1948 vollendeten "Vier letzten Lieder" sind ein berührendes Abschiedswerk des Komponisten von unerreichter Symbolkraft. Mit der "Alpensymphonie" beschloss Strauss seine Reihe der Tondichtungen. Er schuf damit ein wahrhaftiges Gipfelwerk der Gattung.

    Live-Übertragung in der Staatsoper Unter den Linden
