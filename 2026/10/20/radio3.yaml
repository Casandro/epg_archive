    Jazzpreis Berlin 2026 an Julia Hülsmann

    Die Pianistin Julia Hülsmann spricht in einer sanften Art ihr Publikum auch jenseits der Jazz-Bubble an. So die Begründung der Jury für die Verleihung des Jazzpreises Berlin 2026 an Julia Hülsmann. Das Preisträgerkonzert des Jazzpreises Berlin (vergeben von radio3 und der Berliner Senatsverwaltung für Kultur und Gesellschaftlichen Zusammenhalt) fand am 16. Juni 2026 im Kleinen Sendesaal des rbb statt. Ein Abend der Würdigung, mit einer fein eingespielten Band.

