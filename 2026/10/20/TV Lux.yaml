  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Obsah prikázania ("Siedme prikázanie zakazuje neprávom brať alebo si ponechať majetok blížneho a akýmkoľvek spôsobom spôsobovať blížnemu škodu na majetku. Prikazuje spravodlivosť a lásku pri spravovaní pozemských dobier a plodov ľudskej práce. Vzhľadom na spoločné dobro vyžaduje, aby sa rešpektovalo všeobecné určenie dobier a právo na súkromné vlastníctvo." (KKC 2401) (2018)'
