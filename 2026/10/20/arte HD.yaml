  title: 'Kibbuz Nir Oz: Leben am Gazastreifen'
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Kibbuz Nir Oz wurde am 7. Oktober 2023 durch die Hamas-Angriffe schwer getroffen: Fast ein Viertel der Bewohner wurde ermordet, verschleppt oder vertrieben. Gründer Chaïm Peri, Friedensaktivist und Chronist des Kibbuz, starb in Geiselhaft. Unveröffentlichtes Archivmaterial und Aussagen von Bewohnerinnen und Bewohnern dokumentieren das Ende einer Utopie.
    Der Dokumentarfilm erzählt nicht nur die Geschichte dieses Ortes, sondern wirft grundlegende Fragen auf: Was bedeutet das Scheitern von Nir Oz für das Selbstverständnis Israels - und für die Zukunft zweier Völker, die seit Jahrzehnten um dasselbe Land kämpfen?
