  title: FYI - Unsere Recherche, Dein Vorteil
  subtitle: Oldtimer als Geldanlage
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Auto als Geldanlage: lohnt sich das? Ein VW Käfer als Investment? Klingt verlockend, aber die Rechnung geht meist nicht auf. Das Serviceteam hat den Check gemacht und zeigt, welche Autos wirklich Geld bringen. Sportwagen aus den 1990er-Jahren wie der Audi TT gelten als heißeste Klassiker-Kandidaten. Ein Ferrari F50 wurde zuletzt für 12,5 Millionen Euro versteigert. Ein Käfer? Legte nur 35 % zu, nach Abzug der Kosten kaum rentabel. Fazit: Oldtimer lohnen sich vor allem im Luxussegment. Für alle anderen gilt: fahren statt rechnen.'
