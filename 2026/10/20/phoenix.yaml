  title: Lady Sapiens
  subtitle: Auf den Spuren eines Steinzeit-Mythos
  widescreen: true
  hd: true
  description: 'Beeren sammeln, Kinder hüten lange Zeit wurden diese Aufgaben den Frauen der Steinzeit zugeschrieben. Neue Erkenntnisse aber zeigen: Die Frauen gingen jagen und führten ihre Clans an. Die Arbeitsteilung der Steinzeitmenschen war keineswegs streng getrennt. Welche aus heutiger Sicht modernen Rollen spielten die starken Frauen des Jungpaläolithikums noch? Eine archäologische Spurensuche, die neues Licht auf die prähistorischen Geschlechterrollen sowie ihr differenziertes gesellschaftliches Gefüge wirft.'
