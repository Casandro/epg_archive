  description: "Der Staat verspricht gerechte Lastenverteilung. Nur: Warum finden Reiche dann Steuerschlupflöcher - völlig legal? Und warum zahlen wir ausgerechnet auf Arbeit so hohe Steuern? \n\nDie Vermögensteuer ist seit fast 30 Jahren ausgesetzt. Auch die Erbschaftsteuer bringt nicht viel ein, weil ein großer Teil gar nicht besteuert wird dafür sorgen jede Menge Ausnahmen. Steuern auf Alltagskonsum dagegen sind immer weiter gestiegen.\n\nWahrnehmung der Steuerlast\n\nWie nehmen Personen mit unterschiedlich hohem Einkommen ihre Situation selbst wahr, und wie ordnen Expertinnen und Experten sie ein? Wer zahlt wie viel Steuern?"
