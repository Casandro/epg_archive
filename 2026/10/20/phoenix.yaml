  subtitle: Wer für die Energiewende zahlt
  description: "Wir stecken mitten in der Energiewende. Lange ging es nur um den Ausbau erneuerbarer Energien. Jetzt schiebt sich eine andere Frage in den Vordergrund: Wer zahlt den Preis dafür? \n\nDaten zeigen: Die Zustimmung zur Transformation sinkt besonders bei Haushalten, die unter Kostendruck stehen. Viele spüren es an ihrer Strom- und Heizrechnung: Der Umbau zur Klimaneutralität wird maßgeblich durch private Haushalte finanziert. Die Energiewende ist die Hauptursache, warum Deutschland aktuell den höchsten Strompreis in Europa hat ein Problem für Unternehmen und Verbraucher. \n\nFür viele ist das inzwischen sogar die neue soziale Frage."
