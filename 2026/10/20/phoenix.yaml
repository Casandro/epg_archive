  title: Gefährliche Natur (3/3)
  subtitle: Feuer
  widescreen: true
  hd: true
  description: |-
    Vulkane und Blitze sind zwei der gefährlichsten Naturphänomene der Welt. Vom Ontake in Japan über den Nyiragongo in der Demokratischen Republik Kongo bis zum Puyehue-Cordón Caulle in Chile halten aktive Vulkane weltweit noch viele Geheimnisse bereit, die ihnen Wissenschaftler erst dank moderner Kameratechnik nach und nach entlocken.
    Auch von Blitzen geht nach wie vor eine tödliche Gefahr aus. Immerhin blitzt es auf unserem Planeten bis zu 30 Mal pro Sekunde. Hochgeschwindigkeitskameras zeigen, was genau bei einem Einschlag passiert.
