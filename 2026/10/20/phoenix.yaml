  title: Gefährliche Natur (2/3)
  subtitle: Eis
  widescreen: true
  hd: true
  description: "In der zweiten Folge steht das Eis im Mittelpunkt. Eisberge und Lawinen sind zwei der gefährlichsten Naturphänomene der Welt. Durch Lawinen sterben jedes Jahr hunderte Menschen. Wer unter betonhartem Schnee begraben liegt, hat nur geringe Chancen zu überleben. Wie aus den zarten Flocken eine tödliche Urgewalt entstehen kann, untersuchen Wissenschaftler. \nDurch die Erderwärmung lösen sich immer mehr Eisberge von den Gletschern. Die Folge ist, dass diese schwimmenden Hindernisse eine Gefahr für Schiffe darstellen. Umso wichtiger ist es, die Entstehung von Eisbergen zu verstehen."
