  title: Neue Deutsche Welle (1/3)
  subtitle: Die Pioniere
  widescreen: true
  hd: true
  description: "Ohne Punk hätte es die Neue Deutsche Welle nicht gegeben. In Düsseldorf und anderen Städten gründen sich Ende der 1970er zahlreiche Bands. Sie sind provokant und gesellschaftskritisch. Als 1978 auch Nina Hagen ein Punk-Album mit deutschen Texten veröffentlicht, ist das eine Sensation. Die Jugend hört damals vor allem englischsprachige Pop- und Rockmusik. Deutsch wird bis auf wenige Ausnahmen nur beim Schlager gesungen. \nSie gilt als kreativste Phase in der Geschichte der deutschen Popmusik - die Neue Deutsche Welle. Warum stieg die NDW Anfang der 1980er-Jahre so kometenhaft auf, um dann bald wieder zu verglühen?"
