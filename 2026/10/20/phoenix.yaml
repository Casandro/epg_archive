  title: Gefährliche Natur (1/3)
  subtitle: Wind
  widescreen: true
  hd: true
  description: 'Tornados und Sonnenwinde sind zwei der gefährlichsten Naturphänomene der Welt. Naturwissenschaftlerin Helen Czerski begibt sich mit Hilfe moderner Kameratechnologie auf deren Spur. Der erste Teil schaut ins Auge des Sturms: Seltene Filmaufnahmen und neue technische Hilfsmittel verändern das Verständnis von Tornados, den schnellsten Winden auf der Erde, und Sonnenwinde führen zu einem faszinierenden Naturereignis: dem Polarlicht. Die tanzenden Lichter am Nachthimmel begeistern uns Menschen, aber sie stellen auch eine ernste Gefahr dar, denn sie beeinflussen die Technik.'
