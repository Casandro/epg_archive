  title: Gefährliche Natur
  subtitle: Eis
  widescreen: true
  hd: true
  description: In der zweiten Folge steht das Eis im Mittelpunkt. Durch Lawinen sterben jedes Jahr hunderte Menschen. Wer unter betonhartem Schnee begraben liegt, hat nur geringe Chancen zu überleben. Wie aus den zarten Flocken eine tödliche Urgewalt entstehen kann, untersuchen Wissenschaftler. Dabei machen sie die Veränderungen in der Struktur des Schnees sichtbar und damit auch den Auslöser von Lawinen.
