  title: auserlesen
  subtitle: 'Ulrich Parzany: Jesus ist unser Schicksal'
  description: |-
    Humorvoll auf der Kanzel, unerschrocken im Glauben, mehrfach inhaftiert während der NS-Zeit: Pfarrer Wilhelm Busch prägte unzählige Menschen. Einer von ihnen ist Ulrich Parzany, Evangelist, Buchautor und ehemaliger Generalsekretär des christlichen Jugendverbandes CVJM.

    "Jesus unser Schicksal", erst nach Buschs Tod veröffentlicht, wurde zu einem der bekanntesten christlichen Bestseller, erreichte weltweit über zwei Millionen Menschen und wurde in 36 Sprachen übersetzt. Für Parzany wurde Wilhelm Busch zum prägenden Vorbild und weckte in ihm die Leidenschaft für Evangelisation. In dieser Sendung erzählt Ulrich Parzany, was ihn an Buschs klarer Botschaft bis heute fasziniert und warum er überzeugt ist, dass Jesus das Leben jedes Menschen entscheidend betrifft.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
