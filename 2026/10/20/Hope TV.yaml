  title: Sabbat - Das Gebot der Freiheit
  subtitle: Der Sabbat als ewiges Zeichen
  description: |-
    Ein Ring, eine Flagge oder ein Fest können sichtbar machen, was Menschen verbindet. Auch die Bibel nennt den Sabbat ein Zeichen zwischen Gott und seinem Volk. Paulin Giurgi fragt, worauf dieses Zeichen hinweist und warum es als dauerhaft beschrieben wird. Dabei wird deutlich: Der Sabbat ist kein religiöses Abzeichen und kein Passwort zum Himmel. Er erinnert an Schöpfung, Vertrauen, Zugehörigkeit und die Beziehung, die Gott zu Menschen sucht.

