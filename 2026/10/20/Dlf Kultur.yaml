    BBC Proms
    Royal Albert Hall, London
    Aufzeichnung vom 11.09.2026

    Gustav Mahler
    Sinfonie Nr. 9 D-Dur

    Mahler Academy Orchestra
    Leitung: Philipp von Steinaecker

    Längst beschäftigt sich die Alte-Musik-Szene auch mit dem um 1900 entstandenen Schaffen Gustav Mahlers. Die wegweisenden Interpretationen Philipp von Steinaeckers führen ein Projekt des Kunsthistorischen Museums Wien fort, das Instrumente aus den von Mahler selbst dirigierten Orchestern gesammelt hat.
