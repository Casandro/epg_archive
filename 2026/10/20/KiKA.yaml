  title: Felix macht Ferien
  subtitle: Badetag
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Serie, Deutschland 2017
    Badetag

    Felix will partout nicht in die Wanne. Da muss Opa Karl wieder mit einer Wolle-Geschichte locken: Mutig hätte er früher mit seinem Freund im winterlichen See gebadet. Das will Felix nun auch und wettet darauf, dass er draußen baden wird. Die Kälte des Sees schreckt ihn allerdings ab. Gemeinsam mit dem Nachbarsmädchen Samina kommt Felix auf eine Idee. Während Opa im Haus verschwindet, holen sie eine alte Zinkwanne und befüllen sie mit warmem Wasser. Mit seiner Pudelmütze auf dem Kopf genießt Felix das Bad im Freien und hat schließlich die Wette gewonnen.
    Regie: Markus F. Adrian
