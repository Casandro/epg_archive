  description: |-
    Verlieren und wiederfinden

    In der "Sendung mit dem Elefanten" geht es heute ums Suchen. Knolle ist auf der Suche nach seinem Kuscheltier Katze, aber er kann es einfach nicht finden. Ob ihm die Dame im Fundbüro vielleicht weiterhelfen kann? Anke Engelke möchte ich den Park gehen, findet aber ihre andere Sandale nicht. Zum Glück kann Denis Moschitto ihr einen zweiten Schuh leihen. Ob der passt? Lola findet ein Kuscheltier und sucht gemeinsam mit Charlie nach dem Besitzer. Zum Schluss spielen André und Knolle ein Spiel, bei dem André viel Fingerspitzengefühl beweisen muss.

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.
