  title: SWR Kultur - Das Wissen
  subtitle: Serbien im Umbruch - Was bringen die Proteste für Demokratie?
  description: |-
    Von Lucia Steinwender und Bartholomäus Laffert

    Im November 2024 stürzte in Novi Sad das Bahnhofsdach ein, 16 Menschen starben. Seitdem gehen Menschen in Serbien auf die Straße. Was als Studentenprotest gegen Korruption begann, ist längst zu einer Massenbewegung für Demokratie und gegen das autokratische Regime angewachsen. Im Sommer 2026 hat Präsident Aleksandar Vucic vorgezogene Neuwahlen für den 25. Oktober angekündigt. Im September ist er als Präsident zurückgetreten, auch um bei der Wahl als  Premierminister-Kandidat antreten zu können. Die Studierenden wollen Vucic mit einer eigenen Liste herausfordern. (SWR 2025/2026)
