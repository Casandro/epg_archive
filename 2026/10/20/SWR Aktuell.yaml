  title: SWR Aktuell Langstrecke
  description: |-
    14:00
    Sprechen wir über Mord!?
    Die Gier des Apothekers - True Crime | Millionenbetrug auf Kosten Krebskranker
    Um sich selbst ein Leben in Luxus zu finanzieren, bereitet ein Bottroper Apotheker über Jahre Arzneimittel für Krebskranke mit zu wenig oder gar keinem Wirkstoff zu. Von den Krankenkassen kassiert er trotzdem voll ab. Es geht um mehr als 13 Millionen Euro.
    Holger Schmidt und Mr. Strafrecht Thomas Fischer diskutieren den Fall und das Urteil.
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/sprechen-wir-ueber-mord/urn:ard:show:d6b35750a40244e1/

    1430
    SWR1 Leute mit Katrin Siemens | Physiotherapeutin
    So wichtig ist psychische Gesundheit am Arbeitsplatz für das Unternehmen
    Es sind Menschen, die eine Organisation wirklich stark machen. Doch wird allzu häufig in neue Systeme und Technik investiert und zu wenig in gute Führung. Denn viele gehen immer noch davon aus, Führung müsse sich zwischen harten Zahlen oder weichen Themen entscheiden. Entweder Leistung oder Empathie. Dabei bedingen sie sich gegenseitig.
    Katrin Siemens weiß, wie psychische Gesundheit und Leistungsfähigkeit miteinander einhergehen. Sie ist psychologische Psychotherapeutin, Wirtschaftspsychologin und Ex-Executive. Das heißt, sie war als leitende Angestellte im Top-Management deutscher Konzerne tätig. Bei Zalando leitete sie u.a. die Abteilung für Gesundheitsmanagement und bei der Deutschen Telekom war sie Ressortleiterin für Diversitätsthemen. In SWR1 Leute schildert sie, welche Maßnahmen dazu führen, dass ein Team mental zu hundert Prozent fit und arbeitsfähig ist.
    Moderation: Nicole Köster
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/
