  title: Dnevnik 2
  subtitle: Centralna informativna emisija Radio-televizije Srbije, Dnevnik 2, svakog dana u 19.30 časova donosi najvažnije i najaktuelnije vesti iz zemlje i sveta.
  description: Centralna informativna emisija Radio-televizije Srbije, Dnevnik 2, svakog dana u 19.30 časova donosi najvažnije i najaktuelnije vesti iz zemlje i sveta. Kroz objektivne izveštaje, analize i uključenja sa terena, prepoznatljiv voditeljski tim gledaocima pruža kompletan pregled političkih, ekonomskih i društvenih događaja dana. Kao najgledaniji informativni program sa višedecenijskom tradicijom, Dnevnik 2 ostaje ključni izvor proverenih informacija i prvi izbor miliona građana širom Srbije.
- eventId: 852708
  start: 2026-10-20T18:05:00Z
  stop: 2026-10-20T18:55:00Z
  title: Pravo na sutra
  subtitle: Imovina nije pitanje politike, već prava. Bar bi tako trebalo da bude.
  description: Imovina nije pitanje politike, već prava. Bar bi tako trebalo da bude. Ali da je taj pravni put dug i krivudav svedoče desetine hiljada raseljenih koji do svojih poseda na Kosovu i Metohiji ne mogu da dođu godinama. Imanja su morali da napuste, a ko ih i šta sprečava da ponovo njima raspolažu, mnogi od njih svedoče u novom serijalu Radio-televizije Srbije "Pravo na sutra". Kancelarija za Kosovo i Metohiju i kancelarije pravnih timova projekta "Besplatna pravna pomoć", koji se sprovodi uz podršku Evropske unije, adrese su na kojima zainteresovani građani mogu da potraže pomoć. U kojim slučajevima, pod kojim okolnostima? Kako ti procesi izgledaju i šta vlasnici zatiču kada konačno dođu do svoje imovine? Svedočenja, problemi, nada u pravdu i rešenja, sve to u 6 emisija serijala "Pravo na sutra", realizovanim u saradnji sa Projektom Evropske unije "Besplatna pravna pomoć" i Kancelarijom za Kosovo i Metohiju.
- eventId: 852709
  start: 2026-10-20T18:55:00Z
  stop: 2026-10-20T19:25:00Z
  title: Radio Mileva
  subtitle: Komedija "Radio Mileva" prati svakodnevicu Mileve, Natalije i Sonje, tri generacije porodice Majstorović koje žive pod istim krovom. Mileva je glava kuće, sve zna, sve ume i u sve se razume.
  description: Komedija "Radio Mileva" prati svakodnevicu Mileve, Natalije i Sonje, tri generacije porodice Majstorović koje žive pod istim krovom. Mileva je glava kuće, sve zna, sve ume i u sve se razume. Penzionerka koja je radni vek provela u ulozi sekretarice predsednika Opštine na šta je izuzetno ponosna. Samouverena, energična, namazana, žena koja ima sve informacije, žena za sve vremena, snalažljiva i oštroumna. Ćerka Natalija je njen antipod. Profesor Srpskog jezika i književnosti u Matematičkoj gimnaziji. Odmerena, uravnotežena, racionalna, a po mišljenju njene majke, pre svega, jedna neuspešna žena, jer nema emotivnog partnera, radi za male pare u školi gde nema ni pun fond časova.
