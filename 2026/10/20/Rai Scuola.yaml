  title: Amarcord - Ritratti di città - Oristano
  subtitle: ATTUALITA' - Il documentario su Oristano intreccia indagine etnografica e paesaggistica, collegando la fondazione della città allo stagno d'oro e alla piana del Campidano. Esplora tradizioni agro-pastorali..
  description: "e riti identitari, tra cui la Sartiglia, corsa equestre in cui i cavalieri tentano di infilzare con la spada una stella pendente, quindi il dramma della malaria, debellata con i risanamenti e il DDT. Dopo la crisi agricola del 1963, affrontata dalla comunità grazie a nuove infrastrutture e cooperazione, il racconto si sposta nel centro urbano, tra architetture, la statua di Eleonora d'Arborea, fermenti giovanili e rivendicazioni autonomistiche. La conclusione affronta la controversa proprietà degli stagni, divisa tra pubblico e privato, con quello di Cabras come caso emblematico, difeso dalla pesca di frodo mediante guardie armate. - Programma di: Enrico Gras e Mario Craveri\nFotografia: Franco Castelli\nContenuto musicale: Peppino De Luca \nVoce: Riccardo Cucciolla\nConsulenza: Luca Pinna\n,"
