  title: Ein Luftikus zum Verlieben
  subtitle: Fernsehfilm Deutschland 2005
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Unternehmensberater Max Tanner ist ein Luftikus, wie er im Buche steht. Diese leidvolle Erfahrung muss auch seine neue Freundin Anna machen, als sie ihn ausgerechnet an ihrem Geburtstag mit einer anderen ertappt. In ihrem Zorn verflucht Anna den Hallodri mit den Worten "Von nun an bist du Luft!" Und tatsächlich: Von diesem Moment an ist Max für alle Welt unsichtbar! Für Max, der es gewohnt war, dass sich alles nur um ihn dreht, eine ebenso unangenehme wie lehrreiche Situation. Nach dem ersten Schreck setzt der arg gebeutelte Casanova alles daran, wieder sichtbar zu werden und Annas Herz zurückzuerobern.'
