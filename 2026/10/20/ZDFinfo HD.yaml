    Die Mumifizierung mit Salben und Tinkturen sollte den Verstorbenen das Weiterleben im Jenseits sichern. Grabbeigaben und kunstvolle Malereien auf Sarkophagen und in den Grabkammern sollten sie schützen auf der Reise ins Reich des Gottes Osiris.
