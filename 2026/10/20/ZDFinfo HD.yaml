    Im 1. Jahrhundert vor Christus ist die Römische Republik zu einem Großreich herangewachsen. Doch im Inneren herrschen Krisen. Das politische Rom ringt um seine Ordnung. Der junge Cäsar erkennt seine Chance und steigt in das riskante Spiel um die Macht ein.
