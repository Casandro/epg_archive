  title: Klub Rádia Junior
  description: 'Speciální živé vysílání ze 42. ročníku Mezinárodního festivalu rozhlasové tvorby Prix Bohemia Radio 2026 Olomouc. 19.00 - 19.50 Hosté: Barbora Dočkalová, spisovatelka a trenér s hráči basballového týmů Skokani Olomouc. Co všechno se může odehrát na baseballovém hřišti? Napínavé zápasy, velké sny, pořádná rivalita, ale i přátelství, bez kterého se žádný tým neobejde! Přesně o tom je nový rozhlasový seriál Rádia Junior Bitva o diamant od spisovatelky Báry Dočkalové, který si právě teď můžete poslechnout na webu radiojunior.cz. A my vyzpovídáme nejen autorku Bitvy o diamant, ale také děti z místního baseballového týmu. Poznávají mladí baseballisté v příběhu vlastní zážitky? Co je na jejich sportu nejvíc baví a co by Báře poradili, kdyby psala další pokračování? O baseballu tentokrát uslyšíte od těch nejpovolanějších, od člověka, který o něm napsal napínavý příběh, i od těch, kteří ho sami úspěšně hrají. Moderuje Klára Nováková.'
