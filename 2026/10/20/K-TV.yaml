  title: 'Medizin mit Tiefgang: Ein Zuhause in Würde - Leben mit Demenz in Gemeinschaft'
  subtitle: Gespräch
  description: Pflege, Ernährung, Mobilisierung - Millionen pflegender Angehöriger ermöglichen es, dass ihre Familienmitglieder zu Hause leben können. Doch diese unverzichtbare Arbeit braucht mehr Unterstützung. Im Gespräch mit Dr. Claudia Kaminski erläutert Gerhard Eiselen, Mitglied der Geschäftsführung Caritas München, die Herausforderungen der Pflegeversicherung, das Spardiktat im Gesundheitssystem und die Frage, ob die finanziellen Mittel künftig noch ausreichen werden.Welche Voraussetzungen müssen erfüllt sein, um offizielle Hilfen zu erhalten? Und welche Chancen bietet die Digitalisierung, um die häusliche Pflege zu erleichtern und zu verbessern?
- eventId: 866352
  start: 2026-10-20T00:30:00Z
  stop: 2026-10-20T01:00:00Z
  title: 'Medizin mit Tiefgang: Felicitias Demenz- WG I Ein Zuhause in Würde - begleitet von Caritas in München'
  subtitle: Gespräch
  description: 'Mitten in München entsteht ein Raum echter Gemeinschaft: In den Demenz-Wohngemeinschaften der Caritas erfahren Menschen Geborgenheit, Teilhabe und Nähe. Kein Heim, sondern ein Zuhause - getragen von Angehörigen, begleitet von der ambulanten Pflege der Caritas München, im Geist christlicher Nächstenliebe. Im Studio berichtet Gerhard Eiselen im Gespräch mit Dr. Claudia Kaminski über das einmalige Projekt und im Anschluss sehen Sie in einer Reportage das leben dort Hautnah.'
