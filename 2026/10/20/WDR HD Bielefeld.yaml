  title: Mittendrin - Flughafen Frankfurt (84)
  subtitle: 84. Abschiebung am Flughafen - Was passiert hinter den Kulissen?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Am Frankfurter Flughafen werden jedes Jahr tausende Menschen abgeschoben. Unauffällig werden die Betroffenen in einen gesicherten, abgegrenzten Bereich im Terminal gebracht, abseits der Öffentlichkeit. Dort warten sie, bis ihr Charterflieger abflugbereit am Gate steht. Die Bundespolizei ist für die Rückführung verantwortlich, die von mehreren Organisationen und Ärzten begleitet wird. Ein Einsatz, der oft für alle Beteiligten physisch wie psychisch an die Grenzen geht. Mittendrin darf exklusiv die Abfertigung eines Rückführungsfluges begleiten.
