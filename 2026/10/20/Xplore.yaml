  description: 'Auf ihrer Reise durch Taiwan fahren die beiden Männer mit ihren Rädern stets an der Küste entlang, um die besten Orte zum Surfen zu finden. Doch es gibt einige Gefahren: Sie wissen nie, wie tief das Wasser ist und ob sich darunter Felsen und Steine verstecken. Das Surfen wird zu einem Riskio!  AU 2015'
- eventId: 869388
  start: 2026-10-20T19:25:00Z
  stop: 2026-10-20T19:45:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Mekong mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen 5 - Mekong mit Michaela May
  description: Die Schauspielerin Michaela May nimmt die Zuschauer mit auf eine achttägige luxuriöse Flussreise auf dem Mekong, einem der 12 längsten Flüsse der Erde. Diese Reise auf dem südostasiatischen Strom beginnt in Laos, dem "Land der 1000 Elefanten". In der Königsstadt Luang Prabang besucht die Schauspielerin nicht nur das Kloster Wat Xieng Thong, sondern auch einen Markt, auf dem  frische Fische aus dem Mekong verkauft werden. Während der entspannten Fahrt auf der "Mekong Explorer" durch die üppige Vegetation sieht sie viele interessante Orte, wie zum Beispiel die "Pak Ou Höhle" mit über 4000 kleinen hölzernen Buddha-Figuren. Auf diese Weise bietet jeder Tag auf dem Schiff ganz besondere, berührende Erlebnisse. Bei ihren Landgängen trifft Michaela unter anderem auf gastfreundliche, liebenswürdige Menschen und lernt in einem traditionellen Dorf den Alltag der Menschen hautnah kennen. Und immer wieder kann sie die vielfältige Tierwelt entlang des Stromes bestaunen. Das Goldene Dreieck in Thailand ist das Endziel der Flussfahrt. Dort verbringt Michaela May ihren letzten Reisetag mit dem Besuch eines SOS-Kinderdorfs, in dem unzählige benachteiligte Kinder ein liebevolles Zuhause gefunden haben. DE 2014
- eventId: 869389
  start: 2026-10-20T19:45:00Z
  stop: 2026-10-20T20:06:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Montafon mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 5 - Montafon mit Eva Habermann
  description: 'VIP Trip - Prominente auf Reisen 5: Kommen Sie mit uns ins Montafon! Schauspielerin Eva Habermann erforscht die Region im Westen der Republik Österreich. An dem grandiosen Panorama der Gebirgsketten kann sich Eva nicht sattsehen. Diese Bergkulisse will natürlich bewandert werden. Zur Stärkung gibt es dann den Montafoner Sura Käs, eine Käsespezialität, die Eva Habermann später auch selbst unter sachkundiger Anleitung herstellen darf. Unsere Protagonistin will indessen hoch hinaus:  Klettern heißt die Devise! Aber nicht auf die normale Art. Es geht die Silvretta Staumauer hoch - 80 Meter Höhenunterschied! Mulmig wird es, als Eva in das Berginnere eindringt, in das historische Bergwerk in Bartholomäberg. Wussten Sie eigentlich, dass das Montafon das einzige Tal in Österreich mit einer eigenen Schafrasse ist? Das Montafoner Steinschaf nämlich macht die Ausnahme. Evas Trip ins Montafon ist natürlich auch eine Kult(o)ur: Im Silbertal laufen die Sagenfestspiele auf einer der größten Freilichtbühnen Europas. Und in Schruns, der Hauptgemeinde des Montafon, lernt Eva einen ambitionierten Bildhauer kennen, der so gar nicht ins traditionelle Klischee passt. DE 2019'
- eventId: 869390
  start: 2026-10-20T20:10:00Z
  stop: 2026-10-20T20:39:00Z
  title: Foodwise - Haikou
  subtitle: Foodwise - Haikou
  description: Willkommen in Haikou, auch bekannt als die Kokosnussstadt! Erleben Sie mit Tianran die kulinarische Kultur und den urbanen Charakter dieses tropischen Paradieses. Vom leichten und süßen Kokos-Hühnchen-Eintopf über erfrischende Kräuterdesserts bis hin zur würzigen Reissuppe. CN 2023
- eventId: 869403
