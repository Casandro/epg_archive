  title: Foodwise - Hainan's Four Famous Dishes
  subtitle: Foodwise - Hainan's Four Famous Dishes
  description: Die atemberaubende Ostküste von Hainan im Südosten Chinas zieht zahlreiche Besucher an. Die vier berühmten Gerichte Hainans sind Huhn, Ente, Ziege und Krabbe. CN 2023
- eventId: 869404
  start: 2026-10-20T21:20:00Z
  stop: 2026-10-20T21:47:00Z
  title: Essen. Schlafen. Surfen. - Folge 1
  subtitle: Essen. Schlafen. Surfen. - Folge 1
  description: Zwei Männer machen sich auf den Weg nach Taiwan, um dort zu surfen. Dieses Ziel ist zwar nicht gerade für das beste Surfen bekannt, doch die Insel birgt zahlreiche Überraschungen. Nach der Landung in Taipeh geht es mit den Rädern nach Süden bis zu der Stadt Kenting.  AU 2015
