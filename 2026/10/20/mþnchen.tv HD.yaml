  title: Record 089 mit Versus Goliath und young hoffi (Wh.)
  subtitle: Der Musik-Talk mit Alexander Onken
  description: "Der Kampf David gegen Goliath ist eine biblische Geschichte aus dem Alten Testament, in der es um einen Hirtenjungen namens David geht, der den riesigen Krieger Goliath besiegt. Sie zeigt, dass manche Kämpfe oft nur aussichtslos erscheinen, aber nicht immer sind. Mit ihrer Musik nimmt die Münchner Band \"Versus Goliath\" den Kampf gegen innere Dämonen auf, die oftmals auch übermächtig erscheinen. Sie stellen sich ihnen in ihren Texten - für sich, vor allem aber auch für andere, die sich gerade zu schwach fühlen... oder zu viel Angst haben. Und um lähmende Angst geht es in dem Song \"Dein Gott\", über den Florian Mäteling, der Sänger von Versus Goliath, mit Alexander Onken im Gloria Palast spricht.\n \nNiklas Hoffmann setzt sich auch für andere ein - bei seiner täglichen Arbeit als Gesundheits- und Krankenpfleger in der Notaufnahme. Während er dort anderen hilft, hat für ihn selbst die Musik eine heilsame Wirkung. Und das nicht obwohl, sondern weil sie traurig ist. Das macht den Münchner aber noch lange nicht zu einem Sad Boy. young hoffi berührt uns mit \"touch\" und bläst uns mit \"1000 Stürme\" weg.\n\nUnd im Record Update, wo wir aktuelle Musikvideos von früheren Record-Gästen vorstellen, geht es mit Helga Brenninger und dem jannemacher ins \"Lavendelmeer\"."
