  title: Radioreport
  subtitle: Nově objevený byt manželů Herdanových
  description: 'Autor: Marcela Kopecká; Interpret: Michal Doležel; Premiéra: 15.10.2026 * Jen souhrou šťastných náhod byl v roce 2020 objeven skrytý funkcionalistický klenot - byt židovských manželů Herdanových, kteří v roce 1938 odešli z republiky. Interiér disponuje zachovaným modernistickým zařízením a po letech náročné rekonstrukce se letos otevřel veřejnosti. Jak je možné, že se dochoval v původní kráse? Nejenom o osudu Herdanových, ale především o dispozici a účelnosti jejich někdejšího domova budeme v Radioreportu mluvit s archeologem a etnologem Michalem Doleželem.'
