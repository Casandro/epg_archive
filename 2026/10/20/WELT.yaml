  title: Die Bundespolizei - Zu Wasser, zu Lande und in der Luft
  subtitle: Die Bundespolizei - Zu Wasser, zu Lande und in der Luft
  description: Wir sind Sicherheit - das ist der Leitspruch, an dem sich rund 38.000 Bundespolizistinnen und Bundespolizisten messen lassen wollen. Die dreiteilige Reportageserie beleuchtet unterschiedliche Aufgabenbereiche und Einsatzgebiete der Bundespolizei, zum Beispiel den Grenz- und Küstenschutz mit dem Einsatzschiff BP82 Bamberg, den Einsatz von Spezialkräften der BFEplus sowie die Aufgaben und Fähigkeiten der Bundesbereitschaftspolizei und der Bundespolizeidirektion Flughafen Frankfurt am Main.
  widescreen: true
- eventId: 863949
  start: 2026-10-20T01:09:00Z
  stop: 2026-10-20T01:49:00Z
  title: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  subtitle: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  description: In der größten Haftanstalt Rheinland-Pfalzes in Wittlich sind 600 männliche Strafgefangene inhaftiert. Der Komplex aus JVA, Jugendstrafanstalt, Krankenhaus und Bildungszentrum misst die Größe von 25 Fußballfeldern. Mit seiner Vielzahl an Einrichtungen ist die Gefängnisanlage Wittlich einmalig in Deutschland. Wie sehen Alltag und Zukunftspläne der Inhaftierten aus, wie die Ausbildung der Justizvollzugsbeamten? Die Reportage gewährt Einblicke hinter "schwedische Gardinen" in der deutschen Eifel.
  widescreen: true
- eventId: 863950
  start: 2026-10-20T01:49:00Z
  stop: 2026-10-20T02:34:00Z
  title: 'Gefängnisse: Zenica, Bosnien'
  subtitle: 'Gefängnisse: Zenica, Bosnien'
  description: 'Zenica in Bosnien ist mit einhundertfünfzehntausend Einwohnern die viertgrößte Stadt des Landes. Sie ist ein Ort, geprägt durch Armut und hohe Arbeitslosigkeit. In Zenica leben fünfzehn Prozent Katholiken, dreißig Prozent Orthodoxe und fünfzig Prozent Muslime. Seit vielen Jahren konkurrieren die drei religiösen Gruppen um die Macht:  Zenica gleicht einem Pulverfass. Mittendrin, in einem eigenen Stadtteil, liegt das größte und härteste Gefängnis Bosniens.'
  widescreen: true
- eventId: 863951
  start: 2026-10-20T02:34:00Z
  stop: 2026-10-20T03:17:00Z
  title: 'Gefängnisse: Urso Branco, Brasilien'
  subtitle: 'Gefängnisse: Urso Branco, Brasilien'
  description: Porto Velho liegt im Nord-Westen Brasiliens. An den nahegelegenen Grenzen zu Bolivien und Peru hat die Polizei allein in den letzten zwei Jahren Kokain im Wert von zwei Komma fünf Millionen Dollar beschlagnahmt. Viele Schmuggler werden nach ihrer Festnahme in den Gefängnis-Komplex von Porto Velho gebracht, welcher aus sieben Gefängnissen besteht. Das berüchtigtste von ihnen ist das Untersuchungsgefängnis Urso Branco. Es zählt zu den schlimmsten Haftanstalten in ganz Brasilien.
  widescreen: true
- eventId: 863952
  start: 2026-10-20T03:17:00Z
  stop: 2026-10-20T03:59:00Z
  title: 'Gefängnisse: Mandaluyong City, Philippinen'
  subtitle: 'Gefängnisse: Mandaluyong City, Philippinen'
  description: Mandaluyong City liegt im Großraum Manila. Rund fünfundzwanzig Prozent der Einwohner der Philippinen leben in Armut. Viele Schicksale führen in die Kriminalität. Die häufigsten Straftaten sind Betrug, Prostitution und Drogen. Weibliche Straftäterinnen, die erwischt werden, landen oft in der Correctional Institution for Women, dem ältesten und größten Frauengefängnis der Philippinen. Die Bandbreite der Häftlinge reicht von Kleinkriminellen bis hin zu Mörderinnen und Gangmitgliedern.
  widescreen: true
