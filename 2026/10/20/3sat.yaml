  description: |-
    Deutschland 2026
    Proteste in Frankreich eskalieren - Gespräch mit Politikwissenschaftlerin Hélène Miard-Delacroix über die Ausschreitungen in Frankreich.

    Ausstellung "Die Erde von oben" - Weltbekannte Fotokunst in bayerischer Landschaft. Die Stiftung Nantesbuch in Bad Heilbrunn zeigt die sensationellen Fotos der Serie "Die Erde von oben" des Fotografen Yann Arthus-Bertrand.

    Buch: "Arctic Meltdown" - Die Arktis wird zum Schauplatz geopolitischer Machtkämpfe. Robert Habeck erklärt in seinem Buch, wie Klimawandel, Rohstoffe und neue Handelsrouten die Interessen von USA, Russland und China befeuern und welche Risiken das für die internationale Friedensordnung birgt.

    Roberto Burle Marx - Der brasilianische Künstler Roberto Burle Marx verband Kunst, Landschaft und Naturschutz und wurde damit zum Pionier moderner Landschaftsarchitektur. Das Zentrum Paul Klee zeigt sein vielseitiges Werk in einer Ausstellung.

    Film: "Moscas" - Das Sozialdrama erzählt von einer älteren Frau, die in einem maroden Wohnblock in Mexiko-Stadt ein abgeschottetes Dasein führt. Als sie ein Zimmer untervermietet, zieht ein Familienvater ein, der nachts heimlich seinen Sohn in die Wohnung schmuggelt.

    Moderation: Vivian Perkovic
    HD-Produktion
