  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Brienzer Rothorn" - Die Charmante - Film von Donat Hofer'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schweizer Bergbahnen fahren durch majestätische Landschaften und winden sich auf spektakuläre Gipfel. Sie beeindrucken mit einer einzigartigen Mischung aus Tradition, Technik und Natur.

    Und ziehen Menschen in ihren Bann. Mit Dampf, Schweiß und Fingerspitzengefühl befahren auch heute noch historische Loks und Triebwagen aus dem 19. Jahrhundert die Strecken. Wie ihre modernen Nachfolger, die mit dem neuesten Stand der Technik glänzen.
    HD-Produktion
