  title: 'Spektakuläre Bergbahnen der Schweiz:'
  subtitle: '"Rigi" - Die Königliche - Film von Katharina Deuber'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mit Bedacht geht es auf dem Schienennetz der Rigi-Bahnen zu. Dort verkehrt der imposanteste historische Fuhrpark der Schweizer Bergbahnen. Die Rigi-Bahn war die erste Zahnradbahn Europas.

    Damals wie heute schlängeln sich die Schienen von Art-Goldau über die Ostflanke des Bergs auf den Gipfel der Rigi-Kulm. Die Bergfahrt im legendären Triebwagen "Sächsi" mit der Lokführerin Selina Gehrig bietet den Passagieren eine unvergessliche Reise.
    HD-Produktion
