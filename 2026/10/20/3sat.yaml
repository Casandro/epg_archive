  title: nano
  subtitle: Die Welt von morgen
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    COP17: Artenschutz unter Druck - Auf der Weltbiodiversitätskonferenz COP17 in Jerewan zieht die Staatengemeinschaft eine Halbzeitbilanz des Kunming-Montreal-Abkommens. Vier Jahre nach dem Beschluss bestehen beim Schutz der biologischen Vielfalt weiterhin große Lücken. Um das Artensterben bis 2030 zu stoppen und das 30x30-Ziel zu erreichen, sind deutlich größere Anstrengungen nötig.

    Armeniens Kampf für den Leoparden - Ingolf Baur reist nach Armenien und begibt sich auf die Spur des seltenen persischen Leoparden. Im Arpa-Schutzgebiet zeigt sich, wie erfolgreicher Naturschutz die Rückkehr einer bedrohten Art ermöglichen kann. Doch eine geplante Goldmine gefährdet wichtige Wanderkorridore sowie Böden und Gewässer. Umweltaktivistin Ani Khachatryan kämpft gegen das Vorhaben.

    Wildlife Photographer of the year - Die Ausstellung "Wildlife Photographer of the Year" zeigt 100 herausragende Natur- und Tierfotografien. Zu sehen sind Schuhschnäbel beim Nestbau, eine fliegende Biene, geheimnisvolle Pilze und das Gesamtgewinnerbild eines Elefanten mit seinem toten Kalb. Auch die Dokumentation eines bedrohten Feuchtgebiets in Utah beeindruckt.

    Moderation: Ingolf Baur
    HD-Produktion
