  description: 'Beim Loop One Festival im Münchner Olympiapark erlebten die in Ruhpolding trainierenden deutschen Biathleten einen schwierigen Sonntag: Martin Ponsiluoma siegte erneut, Horn und Nawrath patzten am Schießstand, bei den Frauen gewann Lisa Vittozzi, Puff, Tannheimer und Voigt wurden Sechste, Siebte. +++ Der TSV Mühldorf holte in der 2. Volleyball-Bundesliga beim VC Dresden einen Punkt, verlor gegen den Vorjahresdritten nach fünf Sätzen 2:3 und den Tie-Break 11:15; Tom Schlösser wurde bester Mühldorfer, am Samstag folgt das Auswärtsspiel in Dachau. +++ Der Spontanhilfeverein STC Rescue aus Bischofswiesen kann bei Großschadenslagen und Katastrophen nun mit eigenem Einsatzfahrzeug samt Ausrüstung unterstützen: Der per Spenden finanzierte Nissan Navara wurde pünktlich zum zweijährigen Bestehen gesegnet und ergänzt die Blaulichtkräfte. +++ Ruhig, aber spannend: Unten startet der Tag kalt und neblig, auf den Bergen scheint schon die Sonne; später setzt sich Föhn durch und mildert die Temperaturen, doch zur Wochenmitte bringt ein Tief Regen, bevor es am Wochenende wieder kalt und nass wird.'
