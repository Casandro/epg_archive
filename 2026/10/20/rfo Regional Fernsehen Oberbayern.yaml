  title: Süd Journal vom 19.10.2026 (Wh.)
  subtitle: Revision im Fall der ehemaligen Bundespolizistin +++ Erricson Rosenheim verlaesst Arbeitgeberverband   +++ Grippeimpfungen auch in Apotheken möglich
  description: "Trotz Geständnis, Deal vor Gericht und mehr als drei Jahren Haft gilt der Fall nicht als beendet: Eine frühere Bundespolizistin aus dem Landkreis Rosenheim hat gegen ihr Urteil wegen der Vergewaltigung einer Jugendlichen und weiterer Taten Revision eingelegt. +++ Rund 530 Beschäftigte, ein Weltkonzern und eine Entscheidung, die in Rosenheim für Unruhe sorgt: Der Anbieter von Kommunikationstechnologien Ericsson hat den Arbeitgeberverband IG Metall verlassen. Damit endet am Standort Rosenheim die Tarifbindung zur Gewerkschaft. \n +++ Zum Start der Grippesaison können sich Erwachsene ab 18 nicht nur beim Hausarzt, sondern teils auch in geschulten Apotheken impfen lassen; am besten im Oktober oder November, da der Schutz nach 10 bis 14 Tagen wirkt und schwere Verläufe besonders bei Risikogruppen senken kann."
- eventId: 695444
  start: 2026-10-20T13:10:00Z
  stop: 2026-10-20T13:20:00Z
  title: Süd Journal vom 19.10.2026 (Wh.)
  subtitle: Bahn-Infomobil gestartet +++ Landgericht Traunstein verhandelt Messerangriff +++ Brand in Rosenheim - Eine Person tot +++ Lkw-Unfall auf der A8 am Irschenberg +++ BASKETBALL - Highlihgts Wasserburg +++ FUSSBALL - Buchbach ..
  description: 'Mit einer Infotour in Rosenheim hat die Bahn die Sanierung der Strecke Rosenheim-Salzburg angekündigt: Von Anfang Februar bis Anfang Juli ist der Abschnitt Rosenheim-Freilassing komplett gesperrt, Ersatz bieten über 70 Busse auf neun Linien. +++ Vor dem Landgericht Traunstein beginnt heute der Prozess gegen einen 33-Jährigen, der im Dezember in einer Rosenheimer Obdachlosenunterkunft auf einen Mann eingestochen und ihn lebensgefährlich verletzt haben soll; die Anklage lautet auf versuchten Totschlag und gefährliche Körperverletzung. +++ Bei einem Wohnungsbrand in der Münchener Straße in Rosenheim starb am späten Freitagabend ein 52-Jähriger; rund 35 Bewohner mussten das Mehrfamilienhaus verlassen, die Flammen wurden gelöscht, ein Übergreifen verhindert, Ursache und Todesumstände sind noch unklar. +++ Ein polnischer Sattelzug geriet in der Nacht zum Sonntag auf der A8 bei Irschenberg Richtung Salzburg ins Schleudern, prallte mehrfach in Leitplanken und blockierte quer die Fahrbahn, wodurch die Strecke bis kurz vor 6 Uhr gesperrt blieb; die ukrainische Fahrerin blieb unverletzt, der Schaden liegt. +++ Basketball-Highlight aus der Badria-Halle: Der TSV 1880 Wasserburg trifft am dritten Spieltag der 2. Damen-Basketball-Bundesliga Süd auf den ASC Theresianum Mainz.  +++ Am 15. Spieltag der Regionalliga Bayern kassierte Buchbach beim 0:4 in Illertissen nach frühem 0:2 die nächste Pleite, Memmingen verlor 1:2 und bleibt dennoch Erster vor Buchbach, Unterhaching spielte 0:0, Bayern II siegte 4:2 bei 1860, Aubstadt und Landsberg bleiben unten.'
