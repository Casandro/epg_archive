  title: Land & Leute (Wh.)
  subtitle: Leidenschaft kennt kein Rentenalter - drei Marktoberdorfer, die weitermachen, weil es ihnen Freude macht
  description: 'Wir besuchen Bio-Landwirt Markus Kleinschmidt, der neben der Landwirtschaft auch Shiitake-Pilze anbaut - eine Besonderheit im Allgäu. Im Benediktinerkloster Ottobeuren werfen wir einen Blick auf die aufwendige Sanierung des Kaisersaals und sprechen darüber, wie die Arbeiten vorankommen. Außerdem geht es um einen neuen Trend: In Ottobeuren hat sich ein Running Club gegründet, der immer mehr Menschen zum gemeinsamen Laufen zusammenbringt. Zum Abschluss besuchen wir den Schützenverein Eldern und schauen auf das Zusammenspiel von Tischfußball- und Bogenschützenabteilung.'
