  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Sestra Benedicta je kontemplativní řeholnice, která od 90. let žije v klášteře: "Šlechtična Anežka se rozhodla pro radikální chudobu a to byla politická rozbuška," vypráví o odvaze Svaté Anežky České ve středověku a dodává: "Anežka znala svoji dobu jak shora, tak zdola a šla cestou solidarity, nepovyšovala se nad slabé, jako to dnes někdy dělají mocní." Proč dnes přemýšlet o odkazu Svaté Anežky České? Proč řeholní službu vnímá jako poodstoupení od světa a kdy si připadá slabá? Jak se dostala k víře, když v rodině měli s církví špatné zkušenosti? Proč každý život přináší nějakou míru askeze? A jak chápe vztah k Bohu? Moderuje Renata Kalenská.'
