  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (1/15) Část první: Předehra - 9. říjen 1944. "Maďarsko zažilo tři velké tragédie - ve 13. století ho dobyli Tataři, sto padesát let okupovali Turci a pak ho osvobodili Sověti." Vtip z období komunismu, tolik blízký českému sarkasmu, vystihuje tehdejší realitu přesně. Kruté bylo už osvobození, spojené s rabováním a znásilňováním žen. Především se ale do Maďarska vrátili z Moskvy "Moskali", sovětští občané maďarské národnosti s jednoznačným zadáním: přetvořit zemi v sovětskou kolonii. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
