  title: Hovory
  description: Co všechno je člověk ochotný riskovat pro něco, čemu věří? A kde se z odhodlání stává fanatismus? Právě na téhle hranici se pohybuje nový komiksový román spisovatele a diplomata Marka Tomana. Inspiroval se osudem českého interbrigadisty Jaroslava Klecana, který odjel bojovat do španělské občanské války. S Markem Tomanem budeme mluvit o idealismu, osobní odpovědnosti i o tom, co nám příběh z konce třicátých let může říct o dnešku. Moderuje Naděžda Hávová.
