- eventId: 929730
  start: 2026-10-20T00:20:00Z
  stop: 2026-10-20T00:35:00Z
  title: ARD Room Tour
  subtitle: 'My Home is my Tower: Wohnen im höchsten Tiny House'
  description: Seit 27 Jahren ist Blanca Knodel Türmerin des Blauen Turms in Bad Wimpfen. 1996 zieht sie als erste Türmerin Deutschlands gemeinsam mit ihren drei Kindern in den Turm ein - von einer Sechs-Zimmer-Wohnung in eine Ein-Zimmer-Wohnung auf 53 Quadratmeter. Früher mussten Türmer Glocken läuten und nach Feinden und Feuern Ausschau halten, heute lässt Blanca vor allem Tourist:innen auf den Turm.
