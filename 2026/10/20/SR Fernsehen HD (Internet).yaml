  title: Eisenbahn-Romantik (829)
  subtitle: Auf kleiner Spur durch Baden-Württemberg
  description: |-
    Baden-Württemberg im Modellformat, das war das Motto des Modell Eisenbahn-Clubs Rottenburg, der dazu ein Dutzend Modellbauer aus dem ganzen Land in die Bischofsstadt eingeladen hatte.
    Während die allermeisten Modellbahnanlagen der Fantasie ihres Erbauers entspringen, war hier die Wirklichkeit Vorbild und so finden sich Firmengebäude, Dörfer, Brücken und Schluchten aus dem Südwesten in den Modellen wieder. Eine Modellbahn-Reise mit Vergleichen zur Wirklichkeit und mit alten Filmausschnitten von Eisenbahn-Romantik.
