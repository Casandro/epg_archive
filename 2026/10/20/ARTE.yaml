  title: Cuisines des terroirs
  subtitle: Le Mühlviertel, Autriche E04. Dans la région du Mühlviertel, en Haute-Autriche, on produit du houblon qui, parfois, délaisse les cuves des brasseries pour s'inviter à table de mille manières.
  genre:
  - '32'
  description: 'Dans le Mühlviertel, région d''Autriche réputée pour sa tradition brassicole, la culture du houblon est ancestrale. Si Edeltraud Jungwirth et son amie Janina Wegscheider vivent à deux pas des houblonnières, elles n''avaient encore jamais songé à cuisiner cette liane qui parfume la bière. Cette année, elles se lancent ! À partir des cônes fraîchement cueillis, elles préparent des mets aussi originaux que raffinés : bruschetta, feuilles farcies, beignets de fleurs de houblon. À leur table figurent aussi des spécialités de Haute-Autriche, comme les "Wespennester" garnis d''épinards ou de pommes, ou encore les"Bauernkrapfen" à la confiture d''abricot. Le festin se déroule dans un écrin historique : le fort de Reichenstein, ensemble patrimonial avec musée et corps d''habitation, où vit Edeltraud. Réalisateur: Wilma Pradetto (2025)'
