  title: Voyage en eaux calmes
  subtitle: Le lac de Van en Turquie S01 E03. Dans l'est de la Turquie s'étend, à plus de 1600 mètres d'altitude, le lac de Van. Il est, avec ses eaux alcalines, le plus grand lac de soude du monde.
  genre:
  - '146'
  description: 'Dans l''est de la Turquie, à la frontière avec l''Iran, s''étend, à plus de 1 600 mètres d''altitude, le lac de Van. Long d''une centaine de kilomètres, il est, avec ses eaux alcalines, le plus grand lac de soude du monde. Malgré le froid glacial en hiver, sa profondeur - jusqu''à 450 mètres - empêche ce géant de geler. Mais dans une région qui s''assèche, la "mer de Van", comme on l''appelle aussi en Turquie, recule par endroits de plusieurs centaines de mètres. Ce phénomène menace non seulement la survie du rouget qui y habite, mais aussi les monumentales microbialites sous-marines, des formations rocheuses préhistoriques ressemblant à des coraux, qui peuvent atteindre 50 mètres de haut. Avec des experts en climatologie, des ingénieurs en environnement, des vétérinaires et des apicultrices, une plongée dans le monde fascinant du lac de Van. Réalisateur: Sebastian Saam (2024)'
- eventId: 940661
  start: 2026-10-20T13:52:52Z
  stop: 2026-10-20T14:35:00Z
