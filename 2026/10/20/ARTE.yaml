  title: 'Désirée Nosbusch : Rêves et désillusions d''une actrice'
  subtitle: Artiste luxembourgeoise et actrice connue dans le monde entier, Désirée Nosbusch revient sur son parcours, de ses grands succès aux douloureuses épreuves qui l'ont façonnée.
  genre:
  - '112'
  description: 'Présentatrice, réalisatrice, productrice et actrice luxembourgeoise, Désirée Nosbusch, née en 1965, est une femme aux multiples talents. Après des débuts à la radio à 12 ans, elle décroche son premier rôle sur grand écran quatre ans plus tard, puis présente le concours Eurovision de la chanson en cinq langues à seulement 19 ans. Au fil des années, elle anime des émissions plébiscitées par le public et joue dans plus de trente films et fictions TV, s''imposant comme une figure majeure du cinéma européen. En 2018, elle se distingue dans la série Bad Banks, coproduite par ARTE, en endossant le rôle de Christelle Leblanc, une banquière impitoyable. Retour sur ses succès, mais aussi sur un chapitre sombre de son adolescence, marqué par une relation d''emprise dont elle parvint, seule, à se libérer. Réalisateur: Inga Wolfram (2024)'
