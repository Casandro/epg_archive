  description: 'Nicht Elisabeth findet das Geld, das Sohn Peter in ihrer Jacke versteckt hat, sondern Oma Anni. Und die hat überhaupt keine Skrupel, die 15.000 Euro an sich zu nehmen. Gottfried Häberle muss sich indes Sorgen um Thaddäus und Kai-Uwe machen: Der Pfarrer will nicht mehr den Babysitter geben. Und zwingt Gottfried zu einem leichtsinnigen Versprechen: Er erklärt sich sowohl für den Kirchen-Christbaum als auch für ein stimmungsvolles Krippenspiel verantwortlich. Für Predigt und Weihnachtsbrötle will Kai-Uwe dagegen selbst sorgen. Allerdings hat ihm niemand gesagt, dass mit letzterem im Schwäbischen Kekse gemeint sind.'
