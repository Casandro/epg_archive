  title: Dobré dopoledne
  subtitle: Vlídná nálada, pohoda, zajímavosti z celých východních Čech. Moderuje Jitka Slezáková.
  description: Vraclav na Vysokomýtsku je Vesnicí roku Pardubického kraje. A nejen to! Vraclav získala druhé místo v celorepublikovém měřítku. To je dobrý důvod pro to, abychom navštívili tuto obec a věnovali jí celé tři hodiny úterního dopoledne. Navštívíme všechny tři místní části. Vraclav, Svatý Mikuláš s barokním areálem i Sedlec. Zeptáme se na bohatou historii a neméně bohatou současnost. Moderuje Jitka Slezáková a Miroslav Hruban.
