  description: Konstantin ist entsetzt, als Natascha ihm offenbart, ihr gemeinsames Kind abgetrieben zu haben. Er glaubt aber, dass Natascha die Geschichte aus Rache erfunden hat, um ihn zu verletzen. Marlene gelingt es schließlich, ein neues Treffen zwischen Konstantin und Natascha zu arrangieren. Doch bevor es zu einem klärenden Gespräch kommen kann, hört Konstantin eine Unterhaltung zwischen Natascha und Sabrina und muss einsehen, dass Natascha die Wahrheit gesagt hat. Als Konstantin daraufhin nicht zum vereinbarten Gespräch erscheint, entlädt sich Nataschas Zorn unter Alkoholeinfluss impulsiv.
