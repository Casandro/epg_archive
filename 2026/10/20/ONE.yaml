  description: 'Alfons ahnt nicht, dass Hildegard mit Eberhard nach Norddeutschland gereist ist. Aber ein Telefonat mit Gustl lässt ihn vermuten, dass Hildegard gar nicht bei ihrer Schwester ist. Durch ein Gespräch mit der von der Liebe enttäuschten Natascha wird sein Verdacht erhärtet: Alfons kann sich zwar nicht vorstellen, dass Hildegard einen Liebhaber hat, doch ganz sicher ist er sich nicht. Besorgt ruft er nochmals bei Gustl an, der ihm vorlügt, alles sei in Ordnung. Alfons glaubt seinem Halbbruder und bereitet sich gebührend auf die Rückkehr von Hildegard vor.'
