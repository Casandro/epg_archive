  description: Dank Michaels Warnung wird Konstantin durch Nataschas Messerangriff nur leicht verletzt. Unter Schock über ihr eigenes Verhalten entflieht Natascha der Situation. Konstantin, Nils und Marlene machen sich auf die Suche. Als ein verzweifelter Anruf von Natascha Marlene erreicht, atmen die drei auf. Da Konstantin sie nicht anzeigen will, ist Natascha bereit, an den 'Fürstenhof' zurückzukehren und irrt - wie auch Pauline Jentzsch und Coco Conradi, die auf dem Weg zum Hotel sind - durch den Wald. Da geschieht Natascha ein folgenschweres Missgeschick.
