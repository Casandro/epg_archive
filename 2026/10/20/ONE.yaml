  description: |-
    Martha Kunze wird von ihrer Tochter Bettina mit Verdacht auf Bauchspeicheldrüsenentzündung in die Klinik gebracht. Martha wehrt sich gegen eine Einlieferung, weil sie heute mit ihrer alten Liebe, Georg Mildenstein, das erste Mal nach über 30 Jahren verabredet ist. Aber als sie erfährt, dass Dr. Martin Stein in der Sachsenklinik arbeitet, lässt sie sich überreden. Schon früher hatte sie eine Pankreatitis und wurde von Martin behandelt. Leider bestätigt sich auch diesmal die Diagnose. Eine zweite Pankreatitis ist lebensbedrohlich.

    Angesichts dieser neuen Situation vertraut sie sich ihrem Arzt an.
