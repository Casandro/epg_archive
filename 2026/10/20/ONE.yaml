  description: Natascha scheint durch ihr Missgeschick ihre Stimme verloren zu haben! Pauline bringt sie mitfühlend in den 'Fürstenhof', während Coco zu ihrem Vorstellungsgespräch um den vakanten Posten der Restaurantleiterin geht. Marlene ist höchst besorgt, als sie merkt, dass ihre Mutter keinen Ton mehr herausbringt. Michael diagnostiziert eine Kehlkopfprellung und verordnet ihr Ruhe. Damit Natascha ihre Stimme schont, bringt Marlene sie zur Almhütte, wo sie sich vom Stress der vergangenen Tage erholen soll. Als Konstantin Natascha besucht, kann er ihr die quälenden Fragen nach dem Grund für ihre Trennung nicht beantworten.
