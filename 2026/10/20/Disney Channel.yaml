  title: Halloweentown 2
  subtitle: Gruselkomödie, USA 2001
  description: 'Regie: Mary Lambert. Darsteller: Kimberly J. Brown, Wren Roberts, Daniel Kountz. Der Piper Clan lebt in der realen Welt. Nur die Großmutter lebt in Halloweentown, einem Ort, an den sich Geister zurückziehen, um vor der Realität zu fliehen. Der Sohn von Pipers Erzfeind Kalabar kommt nun auf die Idee, mit Hilfe von Großmutters Buch Halloweentown in eine graue und trostlose Version der realen Welt und deren Bewohner wiederum in Monster zu verwandeln. Nur die junge Hexe Marnie kann Kalabar noch einen Strich durch die Rechnung machen.'
