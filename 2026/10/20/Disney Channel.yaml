  title: Halloweentown High School
  subtitle: Gruselkomödie, USA 2004
  description: 'Regie: Mark A.Z. Dippé. Darsteller: Debbie Reynolds, Kimberly J. Brown, Judith Hoag. Einflussreiche Kräfte auf der magischen Seite wollen ein Portal zwischen der Welt der Menschen und Halloweentown schließen, weil sie den Menschen böse Absichten unterstellen. Insbesondere die "eisernen Ritter" sollen der Zauberwelt gefährlich werden können. Marnie Cromwells will jugendliche Hexen, Werwölfe und Kobolde von "drüben" zu einem Schüleraustausch in die Welt der Sterblichen holen, um die Verständigung zwischen den Welten zu fördern. Um den Rat von Halloweentown für ihr Vorhaben zu gewinnen, setzt sie leichtsinnigerweise sämtliche Zauberkräfte des Cromwell-Hexenclans als Pfand ein...'
  widescreen: true
