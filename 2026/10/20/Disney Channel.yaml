  title: Scrubs - Die Anfänger
  subtitle: Meine Schmach Comedy-Serie, USA 2004
  description: Folge 71, Die Freude über seine Beförderung währt nur kurz, denn bald kommt heraus, dass wegen einer internen Regelung nur Elliot diesen Titel tragen kann. J.D. hingegen darf sich nur "Co-Chefassistenzarzt" nennen. Ein schwerer Schlag für ihn, wurden doch gerade erst die 10.000 Visitenkarten mit seinem neuen Titel geliefert. Doch weder bei Dr. Cox noch bei Dr. Kelso fruchten seine Beschwerden, und so muss er ausgerechnet Elliot um Hilfe bitten. Nur ist die immer noch stinksauer auf ihn.
