  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Franca Lehfeldt, Unternehmerin und Journalistin'
  description: Was ist eigentlich eine gute Mutter, was erleben Frauen mit Kindern in der Arbeitswelt und Frauen ohne Kinder in der Gesellschaft und wie ist es in deutschen Familien heute eigentlich um die Aufgabenverteilung bestellt? Antworten und daraus abgeleitete Forderungen hat die Unternehmerin und Autorin Franca Lehfeldt jetzt im Buch "Gute Mütter, schlechte Mütter" zusammengefasst, das sich auch als Streitschrift versteht. Über alte Rollenmuster, übergriffige Erwartungen und wie sie das Bild von Müttern neu definieren will, spricht Franca Lehfeldt bei uns auf dem Roten Sofa.
