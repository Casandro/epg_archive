  description: Grain exports have also been hit by Russia's full-scale invasion of Ukraine and the US-Israeli war on Iran is stalling fertilizer shipments. Meanwhile, US President Donald Trump's trade war and tariffs also hit food prices. But Chinese President Xi Jinping and Chinese Communist Party (CCP) officials are ahead of the game on food security. After all, a history of famines marked the collective conscious in the country. Mao Zedong's "Great Leap Forward" caused what is thought to be the worst man-made famine in history.  And in the "Cultural Revolution" Xi Jinping reportedly spent many hungry days in rural China. So food security is personal for China's president and he has a focus on food policy. And he has a plan. Xi and the CCP have been pushing to grow staples like rice at home, increase China's food reserves and also secure imports from abroad. Brazil has replaced the US as China's biggest soybean supplier, as China expands in Latin America. And Xi's infrastructure megaproject, the Belt and Road Initiative (BRI), serves as a "Food Silk Road" to help imports reach China without the risk of getting stuck in chokepoints.
