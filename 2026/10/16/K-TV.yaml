  title: 'Gesichter der Weltkirche: Der Erste seiner Art'
  subtitle: Gespräch
  description: 'Gesichter der Weltkirche: Der Erste seiner ArtGerald Mamman Musa aus Nigeria ist der erste Bischof des Landes aus der Volksgruppe Hausa und trägt eine beeindruckende Familiengeschichte mit sich, denn sein Vater konvertierte vom Islam zum Christentum. Ausgestattet mit dieser Biografie setzt sich Bischof Musa in einem von religiösen Spannungen geprägten Nigeria als Brückenbauer und Friedensstifter ein. Im Interview spricht Volker Niggewöhner mit ihm über seinen Lebensweg und sein Engagement für interreligiöse Verständigung und soziale Gerechtigkeit.'
