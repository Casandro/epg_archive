- eventId: 752279
  start: 2026-10-16T00:00:00Z
  stop: 2026-10-16T01:00:00Z
  title: Awaken - Erwachen (Kirchenkonzert Teil 1)
  subtitle: Unterhaltung
  description: Unter der Leitung des Dirigenten Thomas Wolf spielt das Sinfonische Blasorchester Leutkirch mit Solist KMD Franz Günthner an der großen Orgel in der Kirche St. Marin in Leutkirch im Allgäu. Neben bereits bekannten Werken wie dem "Benedictus" des englischen Komponisten Karl Jenkins, der "Interstellarsuite" von Hans Zimmer oder der "Star Wars Suite" von John Williams kommen auch das "Concertino" von Thomas Trachsel oder die Symphony Nr. 3 "Planet Earth" des niederländischen Meisters Johan de Meij zur Aufführung. Unter dem Motto "Awaken - Erwachen" werden christliche Themen wie Dunkelheit, Hoffnung, Auferstehung, Leben" von Pastoralreferent Benjamin Sigg inhaltlich mit der symphonischen Musik verknüpft. Erster von zwei Teilen.
- eventId: 752280
