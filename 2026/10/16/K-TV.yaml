  title: Kardinal Leo Scheffczyk - einer der großen Theologen unserer Zeit
  subtitle: Dokumentation
  description: 'Am 8. Dezember feiert die Kirche das Hochfest der ohne Erbsünde empfangenen Jungfrau und Gottesmutter Maria - eines der schönsten Marienfeste des Jahres.Für die geistliche Familie Das Werk in Bregenz ist dieses Datum doppelt bedeutsam. Am 8. Dezember 2005, starb hier im Kloster Thalbach Kardinal Leo Scheffczyk - einer der großen Theologen des 20. Jahrhunderts, Dogmatiker, Priester und leidenschaftlicher Marienverehrer. Sein Grab, seine Bücher und seine Gedanken sind bis heute lebendig - im Kardinal-Leo-Scheffczyk-Zentrum, das Pater Johannes Nebel leitet. Wir haben Pater Nebel in Bregenz besucht - und ihn gebeten, uns auf eine kleine Spurensuche mitzunehmen: Wer war Leo Scheffczyk? Was bleibt von seinem Denken? Und warum war Maria für ihn der Schlüssel zur Theologie?'
