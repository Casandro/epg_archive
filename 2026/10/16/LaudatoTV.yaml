  title: Nova misija
  subtitle: Dokumentarni
  description: 'Našu ,,Novu misiju počinjemo na Pašmanu. Središnja tema emisije su hrvatski branitelji, ljudi srca i duše - za Hrvatsku: lijepu i snažnu poput plavog Jadrana, zelenu i razigranu poput kontinentalnog dijela, a iznad svega ponosnu domovinu kojoj ljepotu daju i znoj i suze, i osmijeh i nada naših heroja. Branili su Lijepu našu u ratu, a danas svoju ljubav prema domovini žive kroz obitelj, rad, vjeru i služenje zajednici. Pratili smo ih u duhovnoj obnovi, bitkama i pobjedama koje vode u miru, zajedno pod geslom ,,Pruži ruku, ratniče.'
