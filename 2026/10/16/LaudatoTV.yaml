  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: 'Pismo jedne majke koje je stiglo na našu adresu, ogolilo je tešku i bolnu stvarnost. Odrasla u udomiteljskim obiteljima, zlostavljana od najranije dobi od strane vlastite majke, proživjela je nasilje i stigla do točke u kojoj si je, kao djevojčica, planirala oduzeti život. No, sve se promijenilo ulaskom u zajednicu Cenacolo. Danas je ona majka brojne djece i u braku je sa suprugom koji je i sam prošao pakao ovisnosti o heroinu. Iako svjedoči o dubokoj vjeri i oprostu, gledateljica nam iskreno priznaje: rane iz djetinjstva i dalje krvare. Borba s osjećajem manje vrijednosti, blokade u bračnoj intimnosti, strah da zbog proživljenog nema dovoljno nježnosti za svoju djecu, pa sve do bolnog odnosa s biološkom majkom koja je i danas odbacuje - sve su to njezine svakodnevne bitke. Ona ne traži sažaljenje, već vapi za odgovorom na pitanje Kako dalje? Odgovara p. Mijo Nikić, svećenik i psiholog u emisiji ,,Kako dalje?.'
- eventId:
