  title: Dudo i prijatelji, talk-show
  subtitle: Zabava
  description: U novom izdanju emisije Dudo i prijatelji ugostili smo Stipu Čačiju, bivšeg karataša, magistra kineziologije i doktora znanosti iz područja međunarodnih odnosa na Sveučilištu u Zadru. Sa Stipom smo razgovarali i o važnoj temi - sportskoj diplomaciji, ulozi sporta u međunarodnim odnosima, ali i o tome kako mladi danas doživljavaju sport, trening i vrijednosti koje on nosi.
