  title: odaziv
  subtitle: Magazin
  description: '"Mnogo je zvanih, malo izabranih." Ovo je priča o našim prioritetima. Poziv na Božju gozbu je besplatan, ali zahtijeva unutarnju promjenu, ljubav i istinsko obraćenje. Kako sačuvati dostojanstvo, prepoznati da smo pozvani i pokazati da smo se doista odazvali? Jesmo li uzvanici "radi reda" ili uistinu odabrani? I što je naše svadbeno ruho? Tema emisije "Odaziv" je evanđelje 28. Nedjelje kroz godinu o kojemu govori vlč. Ivan Grbešić.'
