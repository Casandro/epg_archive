  description: 'In starken Bildern und spannenden Geschichten berichtet "Euromaxx" über Europa: Architektur und Abenteuer, Kunst, Kultur und Kulinarik, Länder und Lifestyle, Mode und Musik, Promis und Passionen. Diese Vielfalt präsentiert das TV-Magazin einmal wöchentlich : 26 Minuten mit interessanten Reportagen, Berichten und Porträts. Denn "Euromaxx" entdeckt überall in Europa ungewöhnliche Themen und überrascht die Zuschauer immer wieder mit starken Geschichten. "Euromaxx" ist Fernsehen für Genießer!'
