  description: 'Mit Anfang 20 noch einmal die Ausbildung zum Schwimmlehrer anfangen? Für Johannes (25) definitiv die richtige Entscheidung. Denn dass sein Job als Bundespolizist nicht so gut zu ihm passt, war ihm schnell klar. Sein Quereinstieg zum Schwimmlehrer war für ihn genau der richtige Karriere-Weg. Und vielleicht übernimmt er sogar die Schwimmschule: Das ist auf jeden Fall sein Ziel. Sein Job als Schwimmlehrer macht Johannes richtig viel Spaß.'
