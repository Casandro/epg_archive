  title: St. Martin am Grimming
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Grimming, der höchste freistehende Berg Europas, bildet die beeindruckende Kulisse der steirischen Gemeinde Sankt Martin. Wie ein steinerner Riese liegt der Grimming zwischen dem Ennstal und dem Hinterberger Tal in der Obersteiermark. An seinen steilen Hängen hat sich das traditionelle alpine Leben über die Generationen erhalten - nicht nur die Arbeitstechniken der Alten, sondern auch ihre tradierte Wertewelt, die Liebe und das Verständnis der Natur sowie der Sinn für die Gemeinschaft.
