  description: "Die Stimmung im Land ist angespannt, viele Menschen fühlen sich von Politik und Gesellschaft zunehmend abgehängt. \n\"STATIONEN\" stellt deshalb die Frage: Was hält unsere Gesellschaft eigentlich noch zusammen? \nIn Kleinostheim zeigt das Projekt \"Unbezahlbar\", wie aus nachbarschaftlicher Hilfe gelebte Gemeinschaft wird. Auch der Fußball kann Menschen über Herkunft, Sprache und soziale Unterschiede hinweg verbinden. Welche politische Dimension der Sport haben kann, hat der neue Bundestrainer Jürgen Klopp erst unter Beweis gestellt."
