  description: Die Doku-Reihe entführt uns auf Entdeckungsreisen nach Madagaskar, Borneo und Hawaii. Auf diesen drei faszinierenden Inseln konnten sich in Jahrmillionen der Isolation einzigartige Tier- und Pflanzenwelten entwickeln. Diesmal geht es nach Borneo, die drittgrößte Insel der Erde im Herzen Südostasiens, die mehr als 60.000 Tier- und Pflanzenarten wie Nasenaffen und fleischfressende Pflanzen beherbergt. Aber auch die hier lebenden Menschen haben sich den besonderen Bedingungen angepasst.
- eventId: 1010505
