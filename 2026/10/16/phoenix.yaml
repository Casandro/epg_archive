  subtitle: Wenn der Staat zum Täter wird
  description: "Immer wieder geschehen schwerste Kriegsverbrechen, sei es im Irankrieg, im Nahostkonflikt oder im Kampf um die Ukraine. Meist bleiben die Taten straflos. Ist das Völkerrecht eine Illusion?  \n\nDie Nürnberger Prozesse versprachen die juristische Verfolgung von Verbrechen gegen die Menschlichkeit. Doch Exekutionen von Zivilisten, die Verschleppung von Kindern, Vergewaltigungen, den Einsatz verbotener Waffen gibt es noch immer. Viele Täter kommen davon.\n\n1945 schafft die Welt eine Revolution: In Nürnberg stellten die Sieger deutsche NS-Größen und Militärs wegen der Führung eines Angriffskrieges und Menschheitsverbrechen vor Gericht."
