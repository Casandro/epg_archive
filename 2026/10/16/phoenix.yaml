  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Schlacht im Atlantik
  widescreen: true
  hd: true
  description: 'Im September 1939 feuert ein deutsches U-Boot seinen ersten Torpedo ab. Damit beginnt die längste Schlacht des Zweiten Weltkriegs: die Atlantikschlacht. Hitlers Admiral Karl Dönitz hatte zuvor die Entwicklung völlig neuer Technologien und strategischer Konzepte vorangetrieben und damit die Schlagkraft der deutschen Unterseeflotte maßgeblich erhöht. Sein Ziel ist es, die alliierten Nachschublinien im Nordatlantik in einem brutalen Abnutzungskrieg nachhaltig zu zerstören.'
