  title: Über den Wolken - Leben in den Bergen (2/3)
  subtitle: Himalaya
  widescreen: true
  hd: true
  description: Der Himalaja, das höchste Gebirge der Erde, ist die Heimat von faszinierenden Tieren und außergewöhnlichen alten Kulturen. Im zweiten Teil der Dokumentarreihe werden wir Zeugen, wie sich Schneeleoparden auf der Suche nach Nahrung in einsame Bergdörfer schleichen. Bizarr aussehende Affen drängen sich in einem frostigen Wald zusammen, um einander zu wärmen. Buddhistische Klöster zelebrieren ihre uralten Rituale, und ambitionierte Bergsteiger wetteifern am mörderischen Hang des Mount Everest.
