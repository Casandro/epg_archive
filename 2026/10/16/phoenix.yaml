  title: Über den Wolken - Leben in den Bergen (3/3)
  subtitle: Anden
  widescreen: true
  hd: true
  description: |-
    Die Anden durchziehen den südamerikanischen Kontinent von der Karibik bis nach Feuerland. Auf rund 7500 Kilometern finden sich windumtoste Sechstausender, brodelnde Vulkane, karge Hochebenen und menschenleere Wüsten. Und neben dem landschaftlichen Reichtum besitzt die gesamte Andenregion riesige Vorkommen an Bodenschätzen.
    Diese Folge gewährt Einblicke in die extremen Gegensätze der Anden. In der grandiosen Kulisse zwischen den trockensten Wüsten und artenreichsten Nebelwäldern zeigt die Episode Inka-Nachfahren beim Bau einer Seilbrücke, Brillenbären beim Bad in einer Wüsten-Oase und exotische Kreaturen wie Salzfliegen-Echsen.
