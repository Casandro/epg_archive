  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Dünkirchen
  widescreen: true
  hd: true
  description: Im Frühjahr 1940 ist eine ganze britische Armee in Dünkirchen an der französischen Kanalküste eingeschlossen. Mit einem Schlag könnten Hitlers Truppen das nahezu wehrlose Expeditionskorps vernichten. Doch Hitler entscheidet anders. Zugleich lässt Churchill seine Soldaten nach England evakuieren. Dabei kommt alles, was schwimmen kann, zum Einsatz. Für Hunderttausende geht es an Nordfrankreichs Stränden und auf dem Meer nur noch ums nackte Überleben. Aus Sicht der Briten geht diese Schlacht verloren. Doch Dünkirchen festigt die Entschlossenheit, den Krieg gegen Nazi-Deutschland zu gewinnen.
