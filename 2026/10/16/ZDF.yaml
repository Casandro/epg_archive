  description: |-
    Großbritannien / Tschechoslowakei 2016
    Im London der 40er-Jahre verlieben sich der afrikanische Thronfolger Seretse Khama und die britische Büroangestellte Ruth Williams. Ihre Liebe stößt auf massiven Widerstand auf vielen Ebenen.

    Das Paar wird von beiden Familien abgelehnt und sogar die Regierung von Großbritannien schaltet sich ein. Obwohl sie die Probleme absehen können, heiraten sie und kehren gemeinsam in Seretses Heimat zurück. Das bewegende Drama beruht auf wahren Begebenheiten.
