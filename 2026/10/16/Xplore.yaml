  title: VIP Trip - Prominente auf Reisen 4 - Nagasaki 2 mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 4 - Nagasaki 2 mit Oliver Hörner
  description: Die Goto-Inseln sind wegen ihrer Abgeschiedenheit bis heute sehr ursprünglich geblieben. Rinder- und Gemüsefarmen sowie die Fischerei bestimmen dort den Alltag der Einwohner. Der Hamburger Schauspieler, der diese Folge präsentiert, unternimmt mehre Wander- und Radtouren, um die Inseln kennen zu lernen. An vielen Orten stößt Oliver auf kleine Kirchen, die von japanischen Christen gegründet worden waren. Denn auf dem Land, in der Region Nagasaki, waren sie mehr als 200 Jahre einer massiven Verfolgung durch lokale japanische Fürsten ausgesetzt. Die Goto-Inseln wurden so zu einem Zufluchtsort, für eine religiöse Minderheit. Der Besuch bei einem Fischer zeigt auch, dass das traditionelle Leben der Einwohner nicht immer einfach war. Entweder ziehen Taifune über die Inseln oder die Fischschwärme ziehen weiter, bei sinkenden Erträgen. Olivers Film ist ein bunter Streifzug zu den schönsten und interessantesten Stellen der Goto-Inseln.      DE 2019
