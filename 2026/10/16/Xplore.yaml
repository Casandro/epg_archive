  description: '4 BMW-Motorräder, 8 Räder, 16 Ventile. "Mission Manx" ist eine Dokumentation über eine Reise von vier Freunden, die ihren Traum verwirklichen: Sie fahren von Berlin zu der legendären "Isle of Man" in Irland. Werden Sie ein Teil dieses authentischen Motorradfilms. Der Film gehört zu der offiziellen Auswahl des "Motorcycle Film Festival 2014". US 2014'
- eventId: 774594
  start: 2026-10-16T20:00:00Z
  stop: 2026-10-16T20:13:00Z
  title: Mit dem Motorrad durch Nordvietnam - Teil 1
  subtitle: Mit dem Motorrad durch Nordvietnam - Teil 1
  description: Auf unserem Roadtrip durch den wunderschönen Norden erlebten wir das Vietnam, das wir uns zuvor in unserer Fantasie ausgemalt haben. Abgeschiedene authentische Dörfer, Offroad-Pisten, die Nguom Ngao Höhle, die Ban Gioc Wasserfälle, Homestays, Natur pur, Serpentinen, freundliche Einheimische und gaaaanz viel Happy Water.  DE 2019
- eventId: 774595
  start: 2026-10-16T20:15:00Z
  stop: 2026-10-16T20:29:00Z
  title: Mit dem Motorrad durch Nordvietnam - Teil 2
  subtitle: Mit dem Motorrad durch Nordvietnam - Teil 2
  description: Im letzten Teil unseres Motorrad-Roadtrips durch den Norden Vietnams begeben wir uns auf die wohl schönste Motorradstrecke des Landes. Den Ha Giang Loop. Wir machen einen kurzen Abstecher nach Sapa und finden dann in Mu Cang Chai das, was Sapa vor zehn Jahren gewesen sein muss. DE 2019
