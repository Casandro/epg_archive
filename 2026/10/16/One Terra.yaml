  title: Planet Weltweit - Freiheit auf Pferderücken - Der lange Weg der Nez Perce
  subtitle: Planet Weltweit - Freiheit auf Pferderücken - Der lange Weg der Nez Perce
  description: 'Planet Weltweit: 1877 weigerten sich rund 750 Angehörige des Stammes der Nez Perce, im Nordwesten der USA, ihre Freiheit aufzugeben und sich in ein Reservat zu begeben, das ihnen nur noch wenig Land zugestand. Stattdessen begaben sie sich mit 2.000 Pferden, überwiegend Appaloosas, einer Rasse, die die Nez Perce selbst entwickelt und gezüchtet hatten, auf eine abenteuerliche und verlustreiche Flucht über gut 2.000 km quer durch die Rocky Mountains. Auf diesen Moment haben Jon, Rosa und Jack Yearout, Häuptling Emmit Taylor, Abigail und DavieJoe Whitman sowie gut 20 andere Mitglieder des Stammes der Nez Perce lange gewartet: Sie lenken ihre Pferde in die Fluten des Yellowstone Rivers, an der "Nez Perce Furt", also genau dort, wo 145 Jahre zuvor ihre Vorfahren den geschichtsträchtigen Fluss durchquerten. Dabei kreuzen sie auch den Yellowstone Nationalpark, den sie für eine von Geistern bewohnte Wunderwelt hielten, wehrten sich hartnäckig gegen fünf Kavallerie-Einheiten der US-Armee oder wichen ihnen aus. Nur um am Ende, kurz vor der rettenden kanadischen Grenze, doch kapitulieren zu müssen. Mit den Worten "I will fight no more forever", legte Ihr letzter Häuptling Joseph damals die Waffen nieder. Um eine spannende Passage des langen Fluchtweges und den Freiheitsdrang ihrer Ahnen, die "Freiheit auf Pferderücken", am eigenen Leibe nachzuerleben, begeben sich über zwei Dutzend Nez Perce von heute auf einen denkwürdigen Ritt durch den Yellowstone Park, auf den Spuren ihrer Vorfahren. Auf dieser Zeitreise zu ihren Wurzeln, begegnen ihnen imposante Wildtiere wie Bisons und Grizzlybären und sie kommen an Orte, die heute noch Namen und Spuren ihrer Ahnen tragen. Ein Team der Arte 360°Reportage hat die Nez Perce mit der Kamera begleitet.  DE 2022'
