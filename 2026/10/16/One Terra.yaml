  title: Planet Weltweit - Die Marmorberge von Italien
  subtitle: Planet Weltweit - Die Marmorberge von Italien
  description: "Die Apuanischen Alpen im Nordwesten der Toskana beherbergen eines der größten Marmorvorkommen der Welt. Seit der Römerzeit wird hier der weltberühmte Carrara-Marmor abgebaut. Mit allen Mitteln der Technik ringt der Mensch dem Berg das wertvolle Gestein ab und transportiert es auf halsbrecherischen Wegen ins Tal, von wo aus seine Reise in die ganze Welt beginnt. \nAm frühen Morgen fährt der Bildhauer Renzo Maggi zum 1.300 Meter hoch gelegenen Marmorbruch von Monte Cervaiole. Bereits Michelangelo hat sich hier im 16. Jahrhundert seine gigantischen Marmorblöcke ausgesucht. Trotz moderner Technik wird die Marmorgewinnung größtenteils noch auf traditionelle Weise betrieben. Teilweise unter lebensgefährlichen Bedingungen: Extreme Wetterschwankungen und Nebel erschweren den Einsatz von schwerem Gerät. Auf halsbrecherischen Serpentinen wird die tonnenschwere Last dann hinab zum Hafen von Carrara gebracht, von wo aus der Marmor seine Reise in die ganze Welt antritt. \n\n\"Man sagt, dass der Marmor ewig lebt. Nachdem er den Berg verlassen hat, kann er vielleicht eine Treppe werden, die sich mit dem Vergehen der Zeit abnutzt, oder ein Waschbecken. Er wird mit der Patina der Zeit immer schöner werden...\" Der Bildhauer Renzo Maggi ist dem Marmor verfallen - oft fährt er schon am frühen Morgen in den Marmorbruch von Monte Cervaiole - weil er sich einerseits mit den Marmorarbeitern eng verbunden fühlt, andererseits um sich wieder einmal ein Filetstückchen unter den Marmorbrocken für seine Arbeiten auszusuchen. Er ist einer der wenigen Bildhauer, die ihre Arbeiten selbst anfertigen. Berühmte Bildhauer wie Louise Burgeois, Fernando Botero oder Jeff Koons kamen in das weltberühmte Dörfchen Pietrasanta und überließen die Ausführung ihrer Entwürfe meist anderen Bildhauern. Der Marmor aus dieser Gegend wird weltweit wegen seiner weißen Reinheit geschätzt. Rund 190 Millionen Jahre alt sind die Felsmassive der Apuanischen Alpen. DE 2013"
