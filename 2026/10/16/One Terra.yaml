  title: Planet Weltweit - Der Kräutergarten von Java
  subtitle: Planet Weltweit - Der Kräutergarten von Java
  description: |-
    Die hügelige Landschaft um Bogor ist der Garten Eden Indonesiens: Bekannt für seine artenreiche Vegetation und eine farbenprächtige Gärten. Hier praktizieren die Menschen eine Jahrtausende alte Pflanzenmedizin, genannt JAMU. Einst wurde das Wissen um die Wirkung der Kräuter nur innerhalb von bestimmten Heilerfamilien weitergegeben, doch heute ist es die Alltagsmedizin eines ganzen Volkes. Die Herbalistin Endah Lasmadivati hat sich mit ihrem eigenen Kräutergarten einen Traum erfüllt. Zusammen mit ihrem Ehemann Putu Oka Sukanta, einem angesehenen Schriftsteller und Akupunkteur, wendet sie ihre JAMU-Heilbehandlungen bei Kranken an, die sich die teure Schulmedizin der modernen Ärzte nicht leisten können. In der ständig wachsenden, von Schmutz und Abgasen verpesteten Großstadt Jakarta gesund zu bleiben, ist für jedes Immunsystem eine Herausforderung - erst recht für das der vielen Armen am Rande der Gesellschaft. Genau hier wollen Endah und ihr Mann Putu helfen. Wir zeigen eine Woche aus dem Leben des Heilerpaares.

    Montagmorgen in Jakarta: Die Megacity erwacht bei 31 Grad mit chronischem Fieber. Wer hier gesund bleiben will, muss ein intaktes Immunsystem haben. Doch medizinische Behandlungen können sich nur Wenige leisten. Eine Alternative und mittlerweile die Alltagsmedizin des ganzen Volkes ist JAMU - eine Jahrtausende alte Kräuterheilkunde. Ihr hat sich ein Heilerpaar aus Jakarta ganz verschrieben: Die Herbalistin Endah Lasmadivati baut in ihrem Kräutergarten fast 400 seltene Kräuter an und verarbeitet sie in einer kleinen Manufaktur zu Jamu-Medizin. Ihr Ehemann Putu Oka Sukanta ist einer der angesehensten Schriftsteller Indonesiens und arbeitet zugleich als Akupunkteur. Während der Militärdiktatur verbrachte er zehn Jahre in politischer Haft. Dort erlernte er die Kunst der Akupunktur von einem Mitgefangenen -  heute gibt er sie weiter an HIV positive Häftlinge im Gefängnis von Jakarta, die er einmal pro Woche besucht. DE 2008
  ageRating: 6
