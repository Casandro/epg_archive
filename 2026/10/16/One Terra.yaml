  description: Gerade mal 22.000 Einwohner teilen sich auf den Shetland-Inseln eine reiche Tierwelt, beeindruckende Landschaften und schroffe, von der wilden Meeresbrandung gepeitschte Felsen. Wohl bekanntester Export der 16 Inseln sind die kleinen robusten Ponys. Auch die zwölfjährige Hannah Anderson ist vernarrt in die Tiere. Sie will sich für Großbritanniens bedeutendstes Ponyrennen in London qualifizieren. Dafür muss sie verschiedene Shows und Rennen erfolgreich bestehen. Eine große Herausforderung, denn die Ponys haben ihren ganz eigenen Dickkopf ... Geht Hannahs Traum in Erfüllung?  DE 2011
