  title: Planet Weltweit - Die Magellan-Lotsen
  subtitle: Planet Weltweit - Die Magellan-Lotsen
  description: "Der Chilene Erich Guital hat einen der ungemütlichsten Jobs, die Seeleute auf der Welt haben können: Er ist Lotse auf der Magellanstraße - jener Meerenge, die Feuerland vom südamerikanischen Festland trennt. Die Gegend ist berüchtigt für das unbarmherzige Wetter mit plötzlichen Umschwüngen und tosenden Stürmen. Milde Tage gibt es so gut wie nie. Seeleute fürchten die Passage: Starke Strömung, unberechenbare Orkane, tückische Fallwinde, lauter Untiefen und ein Labyrinth aus Hunderten kleiner Inseln machen jede Fahrt zu einer Herausforderung - es sei denn, man hat einen Lotsen an Bord. In der Reportage wird der Lotse Erich Guital eine Woche auf der Magellanstrasse begleitet. \n\nDie Legende besagt, dass Ferdinand Magellan, als er im Jahr 1520 erstmals die Meerenge durchquerte, die heute seinen Namen trägt, Ona-Indianer an Bord nahm, die ihm den Weg weisen sollten. Die Indianer kannten sich in der Gegend aus, wussten um der berüchtigten Untiefen und Klippen, die es zu umfahren galt. Auch konnten sie das Wetter deuten und den Kapitän so vor anstehenden Unwettern warnen. Erich Guital sieht sich in der Tradition dieser Männer, auch wenn er weder ein direkter Nachkomme ist, noch hier geboren wurde. Er stammt aus dem chilenischen Norden und wurde vor einigen Jahren nach Punta Arenas versetzt, der einzigen Stadt in dieser kargen und unwirtlichen Gegend. Fast ununterbrochen weht ein kalter Wind, Bäume und Buschwerk gibt es kaum. Das Land zieht sich über endlose Strecken durch Hügelland. Dennoch bevorzugen die großen Schiffe die Magellanstraße, da sie damit die noch gefährlichere Passage über das berüchtigte Kap Hoorn vermeiden. Erich Guital, früher selbst Kapitän, kennt die Gegend und weiß die Schiffe durch die etwa 670 Kilometer lange Passage zu leiten. DE 2009"
  ageRating: 6
