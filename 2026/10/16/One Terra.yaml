  description: Einst arbeiteten 4.000 Elefanten und ihre Mahouts in der Forstwirtschaft Thailands. Doch als die Regierung den Kahlschlag der Wälder Ende der 1980er Jahre stoppte, zogen viele Elefantenführer mit ihren Tieren in die großen Städte. So auch Non Yamdee. Er lebt mit seiner 35 Jahre alten Elefantendame Poon Thap in den Außenbezirken von Bangkok. Doch er hat von einem neuen Elefantencamp im Süden Thailands gehört, das Mahouts und ihren Tieren eine neue Existenz ermöglicht. Dort will er hin. "GEOlino Reportage" hat ihn und Poon Thap auf ihrer abenteuerlichen Reise begleitet.  DE 2011
