  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im UKE liegen Patienten, die dringend auf ein neues Herz warten. Ein Transplantationskoordinator ist dafür zuständig, in acht europäischen Ländern ein passendes Organ zu finden. Ein weiterer Arzt hat Explantationsbereitschaft. Sobald ein Anruf eingeht, macht er sich auf den Weg, wohin auch immer. Die Anonymität des Spenders muss gewahrt werden. Das ist gesetzlich vorgeschrieben. Ein Rückschluss auf den Ort seines Todes und seine Herkunft darf nicht möglich sein. Das Spenderherz muss dann in einer Kühlbox so schnell wie möglich nach Hamburg transportiert werden.
