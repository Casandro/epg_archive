  title: Pierwsza apokalipsa
  description: |-
    Tytuł oryginalny: First Apocalypse
    US, 2009
    Reżyseria: Rachel Buchanan
    Występują: David Brin, Michio Kaku, James Lurie, David Archibald, Robert Bakker, Luis Chiappe
    65 milionów lat temu dinozaury zniknęły z powierzchni Ziemi, a przyczyny ich wyginięcia pozostają tajemnicą. Nowe teorie wskazują na wulkan w Indiach oraz inne czynniki środowiskowe jako przyczynę katastrofy. Program analizuje, jak skomplikowane zdarzenia mogły wpłynąć na los tych stworzeń i czy ludzkość może uniknąć ich losu.
