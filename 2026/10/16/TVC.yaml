  title: Celnicy 2 (odc. 2)
  subtitle: Pies Barney trafia na trop kokainy. Funkcjonariusze z Manchesteru zatrzymują pasażera z Bangladeszu, który może okazać się terrorystą. W Dover w samochodzie pies Miller znajduje trzech Polaków.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2010
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Pies Barney wykrywa kokainę po raz drugi w ciągu trzech dni. Zostaje ona znaleziona u kobiety, która przybywa z Trynidadu i Tobago. Funkcjonariusze z Manchesteru konfrontują się z mężczyznami, którzy nie zadeklarowali nadwyżki dozwolonej ilości przewożonych papierosów. Przechwytują też pasażera z Bangladeszu. Gdy Gary znajduje w jego bagażu podręczniki lotnicze i informacje dotyczące szkolenia pilotów, zespół podejrzewa, że może on być częścią spisku terrorystycznego.
  ageRating: 12
  genre:
