  title: Celnicy 3 (odc. 3)
  subtitle: W Dover mężczyzna jadący pożyczonym samochodem zostaje dokładnie przeszukany przez brytyjską agencję graniczną. Ubrania i trampki innego pasażera noszą ślady kokainy i amfetaminy.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2011
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    W Dover mężczyzna jadący samochodem najlepszego przyjaciela swojego ojca został dokładnie przeszukany przez brytyjską agencję graniczną, która znalazła w nim 1400 funtów. Para przylatująca z Malagi twierdzi, że tysiące papierosów, które przywieźli, są przeznaczone do użytku osobistego. Ubrania i trampki młodego mężczyzny przybywającego z Ibizy zawierają ślady kokainy i amfetaminy. Grupa przyjaciół w drodze z Birmingham do Pakistanu przewozi podejrzanie dużo pieniędzy.
