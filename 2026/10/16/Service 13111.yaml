  title: Der Pragmaticus
  description: 'Diagnose-Boom: Werden wir kränker oder nur empfindlicher? Ärztliche Diagnosen haben früher aufs Gemüt gedrückt, doch seit kurzem hat sich das radikal gewandelt. Manche Diagnosen sind mittlerweile so etwas wie ein Identitätsbaustein. Braucht jeder ungezähmte Erstklässler schon das Etikett "Aufmerksamkeitsstörung"? Verstärken soziale Medien diesen Zeitgeist? Und warum finden es manche hip, Nahrungsmittelunverträglichkeiten oder autistische Züge auszuweisen? Zu Gast bei Roger Köppel ist diesmal der Gesundheitsökonom Thomas Czypionka. Er weiß um die Kosten, die dem Gesundheitssystem aus zu leichtfertig erteilten Diagnosen erwachsen. "Nicht jedes Wehwehchen ist gleich eine Krankheit!", sagt Psychotherapeut Holger Richter. Und Kinder- und Jugendpsychologin Brigitte Hackenberg sieht die Schulen als Treiber: "Jedes Kind, das lebhaft ist, bekommt heute gleich ein Etikett!"Österreich 2026,  M: Roger Köppel'
