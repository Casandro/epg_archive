  title: Winzerlegenden
  subtitle: Chaos
  description: |-
    Diese Winzer zeigen, wie Haltung, Natur und Konsequenz große Weine prägen. In der dritten Folge der neuen Staffel von "Winzerlegenden" trifft ServusTV auf drei Weingüter, die konsequent ihren eigenen Weg gehen: Im Seewinkel setzt Heinz Velich auf Chardonnay und die Suche nach großen Weinen mit bestmöglichem Preis-Leistungs-Verhältnis. Im Kremstal führen Niki Moser und Tochter Kathi die Tradition der Lenz-Moser-Kultur biodynamisch weiter. In der Südsteiermark bleiben Maria und Sepp Muster ihrer naturverbundenen Linie treu - auch als ihre Natur- und Orange-Weine anfangs kaum jemand trinken wollte. Drei Geschichten über Haltung, Wandel und den Mut, den eigenen Weg zu gehen.
    Dokumentarfilm, Österreich 2025, R: Alexander Saran
