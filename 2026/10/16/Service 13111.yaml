  title: Bares für Rares
  subtitle: Romantische Radierung
  description: |-
    Im Pulheimer Walzwerk steht ein besonderes Kunstwerk zum Verkauf: Eine Radierung des renommierten deutschen Jugendstilkünstlers Heinrich Vogeler! Das Motiv "Die Liebe" zeigt ein junges verliebtes Paar, das in Rückenansicht auf einer Steinbank sitzt, während im Vordergrund eine junge Frau Harfe spielt. Ursprünglich entworfen im Jahr 1896 und vermutlich in den frühen 1920er Jahren gefertigt, wartet dieses wunderbare Kunstwerk nun auf seine Expertise durch Dr. Bianca Berding. Doch welche Bewertung wird die Expertin abgeben und wird der Schätzpreis im Händlerraum erreicht? Die Spannung steigt! Ob es zum erfolgreichen Verkauf kommt?
    Show, Deutschland 2024, R: Ingo Monitor, Michaela Hülkenberg M: Horst Lichter
