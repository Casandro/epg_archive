  title: WDR 3 Konzert
  subtitle: 'Moderation: Susanne Herzog'
  description: "Marie Jacquot, die neue Chefdirigentin des WDR Sinfonieorchesters, bringt große Werke aus ihrer französischen Heimat nach Köln: über seine monumentale Orgelsinfonie schreibt Saint-Saëns selbst: \"Es wird mir ein Fest sein, diese Symphonie zu dirigieren. Ob es für die anderen ein Fest sein wird, sie zu hören?\" Ganz bestimmt! Genauso wie das Bratschenkonzert \"La Nuit des Chants\" von Thierry Escaich, inspiriert von archaischen Liedern der amerikanischen Navajo.  \n<strong>Richard Wagner<br/></strong>Ouvertüre zu \"Tannhäuser\" (Dresdner Fassung)\n<strong>Thierry Escaich<br/>\"</strong>La Nuit des Chants\" - Konzert für Viola und Orchester\n<strong>Camille Saint-Saëns<br/></strong>Sinfonie Nr. 3 c-Moll op. 78 \"Orgelsinfonie\"\n<strong>Antoine Tamestit</strong>, Viola<br/><strong>Iveta Apkalna</strong>, Orgel<br/><strong>WDR Sinfonieorchester</strong><br/>Leitung:<strong> Marie Jacquot</strong>\nLive aus der Kölner Philharmonie\nModeration: Susanne Herzog<br/>Redaktion: Dr. Michael Breugst"
