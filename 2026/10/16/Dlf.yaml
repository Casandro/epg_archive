  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nNach Krebsdiagnose - Wie geht es Papst Leo XIV.?\nDer Papst ist weiterhin im Krankenhaus, in der Gemelli-Klinik in Rom erholt er sich von seiner Operation an der Lunge. Nachdem am Dienstag bekannt wurde, dass Leo XIV. an Krebs erkrankt ist, fragen sich viele: Was bedeutet diese Diagnose für den Vatikan und die katholische Kirche?\n\nBeten am Smartphone - Forschungsprojekt zur Gebets-App ?Hallow?\nDie Gebets-App ?Hallow? richtet sich an Katholikinnen und Katholiken und hat nach eigenen Angaben weltweit Millionen Nutzerinnen und Nutzer. Finanziert wurde ?Hallow? von Tech-Milliardär Peter Thiel und US-Vizepräsident JD Vance. Ein Forschungsteam der Universität Passau nimmt die App nun kritisch unter die Lupe. Ein Interview mit dem Theologen Markus Weißer, der das Forschungsprojekt leitet. \n\nSpiritueller Missbrauch in Zen-Gruppe? Recherche des BR-Podcasts ?Seelenfänger?\nEin Zen-Meister aus Hessen soll seine Schülerinnen und Schüler massiv unter Druck gesetzt haben - das werfen ihm ehemalige Mitglieder seiner Gemeinschaft vor. Sie sprechen von psychischer und finanzieller Ausbeutung. Der Zen-Meister selbst weist alle Vorwürfe zurück. Der Podcast ?Seelenfänger? ..."
