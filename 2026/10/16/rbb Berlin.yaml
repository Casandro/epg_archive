    Die 20-jährige Monika Backhaus hat nach dem Tod der Eltern die Fahrradwerkstatt ihres Vaters übernommen. Nun ist sie auch für ihren 16-jährigen Bruder Anton verantwortlich. Als Dr. Kathrin Globisch ihr Fahrrad abholen will, bricht Monika zusammen. Aus Angst vor einer schlimmen Diagnose und den Folgen geht Anton zum Grab seiner Eltern und rastet völlig aus. Dr. Rolf Kaminski überrascht ihn.
    Pfleger Hans Peter Brenner ist einmal mehr derjenige, der Kaminskis Reizbarkeit zu spüren bekommt. Doch Brenner absolviert im Rahmen seines Medizinstudiums gerade einen Psychologiekurs und wendet seine neuen Erkenntnisse gleich in der Praxis an.
