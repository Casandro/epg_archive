    Ein großer Tag für Assistenzarzt Dr. Elias Bähr. Er begleitet seine kleine Schwester Suse für eine letzte Untersuchung zur OP-Vorbereitung ins JTK. Dort jedoch häufen sich unerklärliche Ausfälle und Suse hyperventiliert. Der OP-Termin, der Höhepunkt jahrelanger Forschungen, mit Herzspezialist Markus Brosmann gerät zunehmend in Gefahr.
