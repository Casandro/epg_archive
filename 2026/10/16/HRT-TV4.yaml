  title: Potrošački kod
  subtitle: Tjedna emisija namijenjena potrošačima. Otkriva probleme s kojima se svakodnevno susreću pri kupnji robe i usluga, donosi savjete i upute.
  ageRating: 4
  genre:
  - '160'
  description: 'Digitalne prijetnje sve su raznovrsnije i učestalije - njihov je broj gotovo 36 posto veći nego lani. Kibernetički napadači sve su uvjerljiviji, a među najčešćim oblicima prijevara ističu se lažno predstavljanje u ime državnih institucija i poznatih tvrtki, preuzimanje korisničkih računa te zlouporaba osobnih podataka u ciljanim prijevarama.Na meti se može naći svatko, a posljednjih su mjeseci posebno pogođeni umirovljenici. Kako prepoznati prijevaru, zaštititi osobne podatke i sigurno se koristiti digitalnim uslugama? Gosti emisije su: Vlatka Jajetić, voditeljica Službe za obradu kibernetičkih incidenata i upravljanje sigurnošću u CARNET-ovu Nacionalnom CERT-u, i Marko Gulan, stručnjak za kibernetičku sigurnost. Urednica: Sanja Smiljanić Grubišić'
- eventId: 765312
  start: 2026-10-16T18:30:00Z
  stop: 2026-10-16T18:55:00Z
  title: Eko zona
  subtitle: Već smo se nekoliko puta u Eko zoni bavili problematikom opasnog otpada u jami Sovjak u općini Viškovo.
  ageRating: 4
  genre:
  - '160'
  description: Već smo se nekoliko puta u Eko zoni bavili problematikom opasnog otpada u jami Sovjak u općini Viškovo. Desetljećima se u bivšoj državi u nju bacao različit industrijski otpad iznimno opasan za okoliš i zdravlje ljudi. Premda je Fond za zaštitu okoliša još krajem 2021. s izvođačem sklopio ugovor za njezinu konačnu sanaciju u veljači ove godine je raskinut zbog velikih kašnjenja radova i zahvaćenosti projekta sumnjom na korupciju.  Premda industrijska konoplja nije uobičajena biljka za uzgoj u Slavoniji, obitelj Kalić prije desetak godina odlučila se baš za njezin uzgoj, i to na ekološki način u Vrpolju, selu u blizini Đakova. Tako su osigurali posao i drugim mještanima u selu.  Strane vijesti o iskorištavanju svih dijelova rajčice u Australiji za kreme i hranu za kućne ljubimce te o pronalasku novih morskih vrsta.
