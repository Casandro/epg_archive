  title: Gordon Ramsay's Secret Service
  subtitle: Rettet die Tradition
  description: |-
    Tradition statt Tiefkühlkost: Seit über 40 Jahren steht das Dahlak für köstliche eritreische Küche - doch hinter den Kulissen herrschen Chaos, Schmutz und Kakerlaken-Alarm. Während Inhaberin Neghisti unermüdlich für ihr Lebenswerk kämpft, versucht Sohn Ephream mit Chicken Wings, Pasta und Cheesesteaks frischen Wind ins Lokal zu bringen - sehr zum Entsetzen von Gordon Ramsay. Für ihn ist klar: Nicht amerikanisches Fast Food, sondern Neghistis außergewöhnliche Familienrezepte sind die größte Stärke des Restaurants. Doch damit das Dahlak eine Zukunft hat, muss die ganze Familie endlich an einem Strang ziehen.
