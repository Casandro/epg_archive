  subtitle: En juillet 2000 à Londres, la diva de la soul et du rock livrait l'un de ses shows les plus spectaculaires dans l'enceinte surchauffée du stade de Wembley. Simply the best!
  genre:
  - '97'
  description: 'La voix de Tina Turner s''est définitivement éteinte le 24 mai 2023. Mais ses tubes inoubliables, son énergie ahurissante et son tempérament de battante n''ont pas fini de fasciner le public ni d''inspirer les artistes. La preuve avec cette performance londonienne, qui compte parmi les plus impressionnantes de la chanteuse. Filmé par dix-huit caméras pilotées par l''un des meilleurs réalisateurs de concerts au monde - le Britannique David Mallet -, ce show renversant a été capté en juillet 2000 lors de la tournée "Twenty Four Seven", suivant la sortie de son dixième et ultime album solo. Dans le temple du football national, face à une foule enflammée par ses pas de danse et sa voix rauque, la "Lionne" - qui vient alors de fêter ses 60 ans - balaie quatre décennies de carrière, en enchaînant les hits avec une fougue inépuisable : "Acid Queen", "River Deep - Mountain High", "Let''s Stay Together", "Better Be Good to Me", "Private Dancer", "What''s Love Got to Do with It", sans oublier l''inaugural "I Want to Take You Higher". Au terme de deux heures explosives, la reine du rock nous a définitivement emmenés très haut ! Filmé les 15 et 16 juillet 2000, au Wembley Stadium, Londres. Réalisateur: David Mallet (2000)'
