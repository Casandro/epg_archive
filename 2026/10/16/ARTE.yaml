  title: 'Mondialisation : Les nouvelles règles du jeu'
  subtitle: Josiane Balasko est épatante dans ce rôle de femme flic dépressive, évoluant dans une ambiance sombre. Dommage que la fin bascule dans le Grand-Guignol.
  ageRating: 15
  genre:
  - '17'
  description: 'La pandémie de Covid, la guerre en Ukraine et les multiples crises ont rebattu les cartes de la mondialisation. Alors que la Chine ne cesse d''investir dans le secteur des hautes technologies, les États-Unis craignent de perdre leur suprématie : les deux superpuissances se livrent ainsi une guerre froide d''un nouveau genre, qui se joue entre autres sur l''île de Taïwan, épicentre mondial des puces électroniques. Longtemps portée par la compétitivité de son modèle économique, l''Allemagne voit aujourd''hui sa prospérité menacée, tandis que l''Inde, site de production à moindre coût, et Singapour, troisième place financière en Asie, rattrapent peu à peu leur retard. Recelant la plus importante réserve de cobalt de la planète, le Congo peine quant à lui à tirer son épingle du jeu. Interdépendance économique À travers notamment l''exemple de la chaîne de production du smartphone, ce documentaire offre un voyage dans sept régions d''Europe, d''Asie, d''Amérique et d''Afrique liées par une interdépendance économique autant qu''une concurrence technologique. Avec nuance et finesse, le documentaire démontre que la mondialisation ne se limite pas à une intensification de la production et des échanges à l''échelle mondiale, mais constitue aujourd''hui une véritable lutte géopolitique entre des puissances qui se disputent sans concession l''accès aux technologies et aux matières premières. De la Silicon Valley californienne aux mines de cobalt au Congo, voyage en sept temps à travers les arcanes de la mondialisation. Réalisateur: Kersten Schüßler (2025)'
