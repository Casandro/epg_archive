  title: Host Dopoledne pod Ještědem
  description: 'Téma: Pereme správně a hospodárně? Zakladatelka EcoHaus Petra Doubková. Správné a hospodárné praní nám může ušetřit peníze za energii a vodu, prodlouží životnost oblečení a navíc šetří životní prostředí. Jak zvolit správný program, jak rozumět symbolům údržby a proč se vyplatí přizpůsobit dávkování konkrétnímu praní, to vše probereme hodinu před polednem.'
