  description: 'Die Leiche des Bauingenieurs Sören Möller wird in seinem ausgebrannten Dienstwagen gefunden. Es ist der Tag seiner Silberhochzeit. Seine krebskranke Ehefrau sagt unter Tränen aus, dass ihr Mann am Abend nicht vom Sondeln, der Schatzsuche mit Metalldetektoren, heimgekehrt ist. Der passionierte Hobbyhistoriker war überzeugt davon, dass die sagenhafte, im Mittelalter versunkene Stadt Vineta vor den Türen Lübecks gelegen haben muss. In Sören Möllers Computer entdeckt Ida den Entwurf einer Anzeige: Wollte Möller seinen Arbeitsgeber bei der Denkmalschutzbehörde anzeigen, weil dessen Bagger auf historische Bausubstanz gestoßen waren?'
