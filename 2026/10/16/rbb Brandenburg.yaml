  hd: true
  audiodesc: true
  ageRating: 12
  description: |-
    Ein großer Tag für Assistenzarzt Dr. Elias Bähr. Er begleitet seine kleine Schwester Suse für eine letzte Untersuchung zur OP-Vorbereitung ins JTK. Dort jedoch häufen sich unerklärliche Ausfälle und Suse hyperventiliert. Der OP-Termin, der Höhepunkt jahrelanger Forschungen, mit Herzspezialist Markus Brosmann gerät zunehmend in Gefahr.
    Andrea Kirchner kommt mit mit einer gebrochenen Hand in die Notaufnahme. Als Andrea kurz darauf operiert wird, bricht ein mysteriöses Fieber aus, das die Ärzte vor einige Fragen stellt.
    Derweil belasten die Vorbereitungen auf die von Niklas angesetzte Zwischenprüfung seine Schützlinge über die Maßen.
