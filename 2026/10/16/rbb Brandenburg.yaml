  description: |-
    Ein Fest, ein Laden und viele Gerichte drehen sich um das Teltower Rübchen. Und wer durch die Altstadt schlendert, spürt noch den Charme des einstigen Ackerbürgerstädtchens südlich von Berlin. Mit der Eröffnung des Teltow-Kanals 1906 wandelte sich der Ort auch zur Industriestadt.

