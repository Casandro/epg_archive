  description: In einem Waldstück bei Lübeck stoßen Arbeiter auf Knochen einer jungen Frau. Sie wurde erschlagen und im Wald verscharrt. Die Tote wird als Jule Röder identifiziert, das Mädchen verschwand vor neun Jahren spurlos. Laut Polizeiakten hat sich die damals 18-Jährige gelegentlich prostituiert. Ihre Mutter Gabi Röder ist erschüttert über die Nachricht und bittet die Kommissare um Klarheit zu schaffen.
