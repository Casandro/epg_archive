  description: 'Lange hat der Opel-Zoo gewartet, heute ist es endlich so weit: Ein drittes Zebra kommt an und soll die kleine Herde vervollständigen. Doch geht der Transport des nervösen Zebras wirklich gut? Im Frankfurter Zoo muss Revierleiter Thomas Tikatsch Großputz machen. Doch das ist schwieriger als gedacht. Denn Krake Mausi will lieber mit ihm spielen, als ihn putzen lassen.'
