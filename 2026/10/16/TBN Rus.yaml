  description: 'Герои веры: история Василия Пашкова и Модеста Корфа В этом выпуске мы расскажем историю двух людей, чей жизненный путь напоминает захватывающий роман о поиске истины. Василий Пашков и Модест Корф были представителями высшей петербургской аристократии: блестящее будущее, богатство и положение в обществе казались предопределенными. Однако встреча с английским проповедником лордом Редстоком в 1870-х годах навсегда изменила их судьбы. Оставив привычный светский уклад, вчерашние дворяне посвятили себя делу, которое стало для них важнее карьеры и комфорта - проповеди Евангелия. Мы поговорим о том, как они создали "Общество поощрения духовно-нравственного чтения" и сделали Библию доступной для тысяч людей, бесплатно распространяя её по всей стране. Вы узнаете о драматическом съезде 1884 года, ставшем попыткой объединить христианских проповедников со всей империи, и о том, почему эта инициатива привела к конфликту с властями. Почему государство увидело угрозу в их деятельности? Как сложилась жизнь этих людей после того, как им поставили жесткий ультиматум: отречение или изгнание? Присоединяйтесь к нам, чтобы узнать историю двух аристократов, которые предпочли изгнание предательству своих убеждений, и понять, какой след они оставили в духовной жизни России XIX века.'
