  title: SWR Aktuell Langstrecke
  description: "14:00 - 15:00\nDemokratieforum \"Enttäuschung, Wut, Extremismus - Verlieren wir den Glauben an die Demokratie?\"\nDie deutsche Demokratie erlebt einen Stresstest: Sie muss Grundrechte schützen, Wohlstand sichern, Vertrauen erhalten und zugleich mit fundamentaler Kritik umgehen, die immer stärker wird. \nEs scheint, die Politik könne zentrale Probleme unserer Zeit nicht mehr lösen. Die Liste der Herausforderungen ist lang: Armut, ungleiche Lebenschancen, eine kriselnde Wirtschaft und ein überlastetes Gesundheitswesen sind nur Teile des Problems. Immer weniger Menschen trauen den demokratischen Parteien noch zu, dieser Lage Herr zu werden. Besonders unter Druck stehen dabei auch eigentlich überzeugten Demokratinnen und Demokraten. \n\nIn dieser Situation werden Stimmen lauter und mächtiger, die das demokratische System Deutschlands in Frage stellen. Populisten von rechts und links versprechen einer gefrusteten Bevölkerung einfache Lösungen und präsentieren Sündenböcke.\n\nWie kann Demokratie dieser Krise begegnen? \nModeration: Michel Friedmann\n\nGäste: \n- Reiner Haseloff, ehemaliger Ministerpräsident von Sachsen-Anhalt \n- Paula Fürstenberg, Schriftstellerin \n- Benjamin Höhne, Parteienforscher"
