  title: Der Tag
  description: "19:00\nAus dem Leben - Förster und Naturschützer Peter Wohlleben\nPeter Wohlleben hat mit seinen Büchern unseren Blick auf unseren Wald verändert. Genauso will er jetzt mit seinem aktuellen Buch \"Bakterien - Die heimlichen Helden\" unseren Blick auf die kleinsten Lebewesen verändern, die für ihn die Erfinder des Lebens sind. Bei den Recherchen für das Buch haben Bakterien ihn im positiven Sinn vom Stuhl gehauen. Denn Bakterien seien oft unterschätzte Wunderwesen, ohne die wir nicht leben können, sagt Peter Wohlleben. Seine Begeisterung für Biologie, die Natur und deren Schutz wurde bereits in seiner Kindheit geweckt. 1964 in Bonn geboren, später in Sinzig am Rhein mit mehreren Geschwistern als Sohn eines Finanzbeamten und einer medizinisch-technischen Assistentin aufgewachsen, ist er bereits als Kind viel draußen in der Natur, sammelt Spinnen im Glas, hält Wasserschildkröten im Aquarium auf seinem Schreibtisch, brütet auf dem Heizkissen seiner Oma ein Küken aus und beobachtet schon damals unter dem Mikroskop seiner Mutter Bakterien. Als \"grünes Schaf\" der Familie studiert Peter Wohlleben nach dem Abitur Forstwissenschaft und arbeitet danach 30 Jahre als Förster. Dabei setzt er schon früh statt auf konventionelle Forstwirtschaft auf naturnahe Waldwirtschaft, was nicht allen Kollegen gefällt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/\n\n19:30\nKultur - \n\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/"
