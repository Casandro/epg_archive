  description: 'Ist Schule ungerecht? Die neue PISA-Studie sagt: Ja. Schulerfolg hängt in Deutschland oft zu sehr vom Elternhaus ab. Y-History-Reporter Adrian Oeser trifft Grundschüler, die mit der frühen Trennung im Schulsystem zu kämpfen haben und besucht den PISA-Europameister Estland, wo Kinder viel länger gemeinsam lernen als in Deutschland.'
