  title: 1968 - Ostberlin
  subtitle: Film von Lutz Rentner und Frank Otto Sperlich
  widescreen: true
  hd: true
  audiodesc: true
  description: '''1968'' - Eigentlich rankt sich der Mythos dieser Jahreszahl um das rebellische Aufbegehren der jungen Generation in den westlichen Gesellschaften. Gegen Vietnamkrieg, Kapitalismus und überkommene Konventionen. Aber auch den Osten ließ dieses kulturelle und politische Erdbeben nicht unerschüttert. Was geschah 1968 in Ostberlin? Auch hier wurden neue Lebensmodelle diskutiert und probiert. Die ungemeine Kraft von Rock ''n'' Roll, Flowerpower, Marcuse und Jim Morrison ließ sich an der Berliner Mauer nicht stoppen.'
