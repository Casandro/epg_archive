    Das Vogel Klavier

    Eine Vogelfamilie hat ein Problem: Sie bekommt ein Klavier nicht in ihr Nest hinein. Ein Fall für Super Grobi 2.0!

    Hundegebell von draußen weckt Ernie in der Nacht aus dem Schlaf. Das Gebell erinnert Ernie an ein Lied, das er dann beginnt zu singen - sehr zu Berts Leidwesen, denn der möchte einfach nur schlafen.

    In dieser Folge klaut der Kekser den Beißkeks eines Babys. Krümelmonster und die "Cleveren Kekse" müssen wieder ihr Bestes geben, um dem Baby seinen Beißkeks wieder zurück zu bringen.

    In den "Unheimlich heimelige Begegnungen" treffen die drei Musiker auf die "Lauten", die ziemlich laute und schräge Musik machen. Das gemeinsame Konzert klingt dann aber ziemlich gut.
