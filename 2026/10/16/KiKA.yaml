  description: |-
    Dschungelsafari

    In einer Talentshow in Zoés Kinderzimmer zeigen Zoé und Tanja, wie gut sie Witze erzählen und Purzelbäume schlagen können. Nur Finn ist geknickt, denn er glaubt, für nichts begabt zu sein. Er kann nicht singen, kein Instrument spielen und vor allen Dingen: Er kann nicht tanzen! Da meldet sich der Zauberschrank und schon sind die Kinder unterwegs im Dschungel auf Safari. Dort begegnen ihnen viele lustige Tiere, Papageien, Elefanten und drei quirlige Affen, die ihnen die Tropenhelme klauen und sie zum Tanzen auffordern. Doch wie kann Finn dazu ermutigt werden mitzutanzen.
