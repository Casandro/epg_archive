  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Groß und klein

    Zum Abendessen backt Pettersson Pfannkuchen und Findus bedauert, dass er keinen größeren Magen hat. Dann geht es ins Bett und Findus beklagt sich, dass er mit einem kleinen Bett Vorlieb nehmen muss. Bei einer Sternschnuppe wünscht sich Findus groß zu sein und wacht tatsächlich groß auf, während Pettersson auf die ursprüngliche Findus-Größe geschrumpft ist.

    Weil der kleine Pettersson nun keinen Kuchen für die Gäste backen kann, soll Findus das machen. Außerdem muss dringend das Stalldach repariert werden, denn es regnet stark. Während Findus vergeblich versucht, das Dach zu flicken, brennt der Kuchen an. Und die Gäste stehen vor der Tür. Sie werden weggeschickt und Petterson und Findus fallen erschöpft ins Bett. Aber war da nicht wieder eine Sternschnuppe?
    Regie: Albert Hanan Kaminski
    Buch/Autor: Pernilla Oljelund

