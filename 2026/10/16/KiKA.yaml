  description: |-
    Das große Autorennen

    Gerade führt Zoé im Puppentheater das Märchen vom Pustewolf und den drei kleinen Schweinchen auf, da kommen Finn und Tanja zu Besuch. Tanja möchte gleich die Rolle einer Feenprinzessin übernehmen, da ruft der Zauberschrank. Statt des erhofften Feenkostüms präsentiert er den Kindern allerdings Rennfahreranzüge. Und schon geht in Zoés Zauberwelt das wilde Autorennen los. Jedes Kind hat einen Rennwagen, einen Beifahrer und, ganz wichtig, eine Karte, auf der die Rennstrecke verzeichnet ist. Während sich Zoé und Finn an die Weisungen der Karte halten und mitten durch den Wald fahren, meint Tanja es besser zu wissen und wählt eine andere Strecke. Wer wird als Erster das Ziel erreichen?
