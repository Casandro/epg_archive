  title: Cedar Cove - Das Gesetz des Herzens - Symbol der Hoffnung
  subtitle: Cedar Cove - Das Gesetz des Herzens - Symbol der Hoffnung
  description: In Cedar Cove herrscht große Aufregung. Warren plant, den alten Leuchtturm abzureißen. Ihm gehört das Grundstück. Eine von Bob angeführte Bürgerbewegung will eine einstweilige Verfügung gegen den Abriss durchsetzen, aber Amtsrichterin Olivia muss dies juristisch ablehnen. Davon lassen sich die Bürger jedoch nicht unterkriegen. Olivia versucht, mit Unterstützung des Senators eine Lösung zu finden. US 2012
