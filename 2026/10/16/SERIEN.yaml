  subtitle: Cedar Cove - Das Gesetz des Herzens - Bleiben oder gehen
  description: Olivia Lockhart ist Amtsichterin in Cedar Cove, einer idyllischen Kleinstadt, in der jeder jeden kennt. Olivia lebt hier einen zufriedenen turbulenten Alltag mit ihren Freunden, ihrer erwachsenen Tochter Justine, und ihrer neuen Liebe Jack. Einzig der Bauunternehmer Warren bedroht immer wieder die Idylle. US 2012
