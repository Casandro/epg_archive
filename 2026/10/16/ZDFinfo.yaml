    Die erste Königin Englands galt als "Bloody Mary". Dabei war sie durchaus nicht blutrünstig. Seit Langem steht Maria Tudor im Schatten ihrer Verwandten Heinrich VIII. und Elizabeth I.

    Maria I. wollte eine gottgefällige Königin und gute Ehefrau sein. Ihr katholischer Glaube ließ sie schmerzvolle strategische Fehlentscheidungen treffen. So wählte sie entgegen aller Empfehlungen einen katholischen Ehemann: Spaniens Kronprinzen Philipp II.
