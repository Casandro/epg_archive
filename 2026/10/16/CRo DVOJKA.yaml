  stop: 2026-10-16T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Ondřej Veverka, režisér a scenárista. Čím ho natolik zaujal osud stíhače RAF Josefa Františka, že mu věnoval film Osamělý vlk? Jak jeho zájem o bolestivé kapitoly českých dějin probudilo vyprávění vlastní prababičky? A daří se v seriálu České televize Energomise vysvětlovat dětem energetickou soběstačnost, aniž by se ztrácel dobrodružný příběh? Moderuje Vasil Fridrich.'
