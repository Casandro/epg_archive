  description: Dnešní díl pozve na premiéru muzikálu Biograf Láska 2 do pražského Divadla Kalich a na Malého prince do Hudebního divadla Karlín. Druhá část bude věnována oslavám 40. výročí světové londýnské premiéry muzikálu skladatele Andrewa Lloyda Webbera Fantom Opery. Na ten se mohou v příštím roce opět těšit i naši diváci. Připravili Michael Prostějovský a Pavel Bár. Repríza z 11.10.
