  title: Adolf Hitler - Die letzten Geheimnisse des Diktators
  description: Wenige Tage vor seinem Selbstmord am 30. April 1945 versteckte sich Hitler zusammen mit Eva Braun und seinen engsten Vertrauten in seinem Bunker in Berlin. Einzigartige Dokumente werfen ein neues Licht auf die letzten Tage des Führers.
