  stop: 2026-10-16T02:50:00Z
  title: Die Konferenz - Wie der Holocaust organisiert wurde
  description: Als führende NS-Vertreter am 20. Januar 1942 die sogenannte "Endlösung der Judenfrage" besprachen, hatte das Morden längst begonnen. Dennoch gilt die Wannseekonferenz bis heute als Zäsur in der Geschichte des Holocaust.
