  title: Nordhausen - Hitlers Raketenbunker
  description: Mit den streng geheimen sogenannten Vergeltungswaffen wollte Hitler den Zweiten Weltkrieg gewinnen. Unter unmenschlichen Bedingungen mussten KZ-Häftlinge dafür in einem Tunnelsystem nahe der Stadt Nordhausen schuften.
  genre:
  - '129'
