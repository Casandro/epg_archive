  title: Adolf Hitler - Die letzten Geheimnisse des Diktators
  description: Wenige Tage vor seinem Selbstmord am 30. April 1945 versteckte sich Hitler zusammen mit Eva Braun und seinen engsten Vertrauten in seinem Bunker in Berlin. Einzigartige Dokumente werfen ein neues Licht auf die letzten Tage des Führers.
  genre:
  - '129'
- eventId: 1596571
  start: 2026-10-16T01:25:00Z
  stop: 2026-10-16T02:10:00Z
  title: Nordhausen - Hitlers Raketenbunker
  description: Mit den streng geheimen sogenannten Vergeltungswaffen wollte Hitler den Zweiten Weltkrieg gewinnen. Unter unmenschlichen Bedingungen mussten KZ-Häftlinge dafür in einem Tunnelsystem nahe der Stadt Nordhausen schuften.
  genre:
  - '129'
- eventId: 1599194
  start: 2026-10-16T02:10:00Z
  stop: 2026-10-16T02:50:00Z
  title: Die Konferenz - Wie der Holocaust organisiert wurde
  description: Als führende NS-Vertreter am 20. Januar 1942 die sogenannte "Endlösung der Judenfrage" besprachen, hatte das Morden längst begonnen. Dennoch gilt die Wannseekonferenz bis heute als Zäsur in der Geschichte des Holocaust.
  genre:
  - '129'
