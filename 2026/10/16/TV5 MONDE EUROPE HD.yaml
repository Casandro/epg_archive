  description: "Hindouisme, cuisine, traditions... Qu'est-ce que vivre en Inde au quotidien ?\n\nL'Inde connaît l'une des croissances les plus fortes au monde et se classe troisième pôle mondial de milliardaires. Mais cette richesse n'est pas partagée : derrière les chiffres, la société se polarise et les économistes parlent d'une trajectoire en K. Des routes de l'Himalaya à Haridwar, découverte de l'Inde d'aujourd'hui. \nUn reportage d'Angélique Forget pour « Le journal de France 2 ».\n\nInvitées : Angélique Forget, ex- correspondante de France Télévisions en Inde ; Christine Lutringer, chercheuse à l'Institut de hautes études internationales et du développement, spécialiste de l'action publique en Inde\n\nPrésentation : Dominique Laresche\n "
