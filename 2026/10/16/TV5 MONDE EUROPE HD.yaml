  title: 'Philippe Katerine / Chourouk Hriech '
  subtitle: 'Artiste inclassable, tour à tour chanteur, acteur, réalisateur, dessinateur, sculpteur, plasticien, Philippe Katerine est notre in '
  description: "Artiste inclassable, tour à tour chanteur, acteur, réalisateur, dessinateur, sculpteur, plasticien, Philippe Katerine est notre invité et le parrain de la saison 2 de « La Grande Galerie Francophone ». L'occasion d'évoquer le mignonisme, courant artistique dont il est le chef de file, et l'exposition carte blanche qui lui est consacrée au musée Bernard d'Agesci de Niort (jusqu'au 31 décembre 2026). À ses côtés, l'artiste franco-marocaine Chourouk Hriech imagine des villes symboles, en multipliant les jeux d'échelle et les perspectives. Son travail est présenté dans les galeries du monde entier et son exposition « Le Chant des seuils » est à voir au musée Paul-Valéry de Sète (du 6 décembre 2026 au 18 avril 2027). Alex Vizorek pose son regard d'expert sur Man Ray, figure majeure du surréalisme et de la photographie du XXe siècle.\n\nInvités : Philippe Katerine, auteur-compositeur-interprète, acteur, réalisateur, plasticien ; Chourouk Hriech, artiste\n\nPrésentation : Ali Baddou. Avec la participation d'Alex Vizorek, Nathalie Lesage, Fabrice Bousteau, Margaux Beytout, Joëlle Rebetez, Charly Voodoo\n "
