  title: Deutschlands Millionäre - Dem Reichtum auf der Spur
  subtitle: Deutschlands Millionäre - Dem Reichtum auf der Spur
  description: 'Reich, reicher, superreich - das Streben nach Geld und Luxus prägt viele. In Deutschland konzentriert sich ein Großteil des Vermögens auf wenige. Diese Reportage zeigt die Welt der Reichen: Ein Schlossbesitzer teilt seine Visionen, deutsche Multimillionäre zahlen in Monaco hohe Preise für Wohnungen, und eine Ex-Staatsanwältin erklärt illegale Steuertricks. Ein Club von Lotteriegewinner bleibt entspannt, während ein Ex-Fußballprofi erkennt: Geld ist nicht alles.'
  widescreen: true
- eventId: 779112
  start: 2026-10-16T13:52:00Z
  stop: 2026-10-16T14:47:00Z
  title: Die Edelmanufakturen - Unikate aus Handarbeit
  subtitle: Die Edelmanufakturen - Unikate aus Handarbeit
  description: 'Auch in Zeiten von Massenproduktion und Fließbandarbeit gibt es sie noch, die privaten Werkstätten und Betriebe, die in aufwendiger Handarbeit und nach traditionellen Verfahren einmalige Qualitätsprodukte herstellen. Die liebevolle Fertigung zahlt sich sogar aus: Stars der Gastro-Szene schwören auf handgeschmiedete Damaszenermesser aus dem Chiemgau oder individuell gefertigte Molteni-Herde aus Frankreich. Denn eines ist gewiss - Fingerspitzengefühl und Leidenschaft können Roboter nicht ersetzen.'
  widescreen: true
- eventId: 779113
  start: 2026-10-16T14:47:00Z
  stop: 2026-10-16T15:41:00Z
  title: Meisterwerke am Handgelenk - Kunst und Kult der Luxusuhren
  subtitle: Meisterwerke am Handgelenk - Kunst und Kult der Luxusuhren
  description: 'Wenn aus Zeit Kunst wird: Diese Reportage taucht ein in die faszinierende Welt der Luxusuhren. In der traditionsreichsten Manufaktur Patek Philippe spricht CEO Thierry Stern über den besonderen Herstellungsprozess. Bei Wempe in Glashütte wirft WELT einen Blick hinter die Kulissen der anspruchsvollen Ausbildung zum Uhrenmacher. Und: Ein leidenschaftlicher Sammler zeigt seine exklusivsten Stücke. Ein Uhrenmacher sein Labyrinth aus filigranen Mechanismen und ikonischen Modellen.'
  widescreen: true
- eventId: 779136
  start: 2026-10-16T15:41:00Z
  stop: 2026-10-16T16:30:00Z
  title: Luxuslimousinen aus der Hightech-Fabrik
  subtitle: Luxuslimousinen aus der Hightech-Fabrik
  description: Die S-Klasse gehört zu den beliebtesten Edellimousinen. Im Jahr 2020 kam die 11. Generation auf den Markt, ausgestattet mit moderner Technologie und 435 PS. Auch im Komfort- und Sicherheitsbereich kann das neue Oberklasse-Fahrzeug mit Innovationen aufwarten. Ausgerechnet dieses generationsträchtige Modell ist der erste Fahrzeugtyp, der in der Factory56 in Sindelfingen produziert wird. Die Reportage wirft einen Blick hinter die Kulissen des Werks und begleitet die Produktion der S-Klasse.
  widescreen: true
- eventId: 779137
  start: 2026-10-16T16:30:00Z
  stop: 2026-10-16T17:18:00Z
  title: 'Dreamcars: Rimac CTwo'
  subtitle: 'Dreamcars: Rimac CTwo'
  description: 'Dass Supercars keinen Verbrennungsmotor brauchen, um zu Hochform aufzulaufen, hat Tesla bereits demonstriert. Auch der Rimac C Two ist rein elektrisch unterwegs, und er überzeugt mit beeindruckenden Werten: 97 km/h erreicht er in nur 1,85 Sekunden, seine offizielle Spitzengeschwindigkeit beträgt 415 Kilometer pro Stunde. Der kroatische Autobauer Rimac hat mit dem eleganten C Two ein erstaunliches Stück Technik vorgelegt, das obendrein mit modernsten Fahrerassistenzsystemen ausgestattet ist.'
  widescreen: true
- eventId: 779138
  start: 2026-10-16T17:18:00Z
  stop: 2026-10-16T18:15:00Z
  title: 'Dreamcars: Bugatti Chiron'
  subtitle: 'Dreamcars: Bugatti Chiron'
  description: 'Er vereint die Ambivalenz von Schönheit und Biest: Der Bugatti Chiron zählt zu den schnellsten und edelsten Sportwagen, die in Serie gefertigt werden. Das französische Coupé begeistert mit innovativem Design, hochwertigsten Materialien und 1.500 PS, die ein Tempo von 420 Kilometern pro Stunde ermöglichen. Die Reportage bietet einen detaillierten Einblick in die Produktion der Luxuskarosse. Bugatti-Präsident Stephan Winkelmann und beteiligte Ingenieure erzählen, was den Chiron besonders macht.'
  widescreen: true
- eventId: 779165
  start: 2026-10-16T18:15:00Z
  stop: 2026-10-16T19:10:00Z
  title: Der neue Zeppelin - Rückkehr einer Legende
  subtitle: Der neue Zeppelin - Rückkehr einer Legende
  description: 'Ein Luftschiff schreibt Geschichte neu: Die Reportage zeigt den Bau des modernen Zeppelin NT und erzählt, wie Hightech, Handwerk und Tradition eine Legende zurück in die Lüfte bringen. er Zeppelin ist zurück - moderner, leiser und präziser als je zuvor. In Friedrichshafen entsteht ein neues Luftschiff, das über 120 Jahre Ingenieurskunst mit neuester Luftfahrttechnik verbindet. Die Reportage begleitet Konstrukteure, Piloten und Techniker beim Bau des Zeppelin NT und erzählt von einer Legende, die nie verschwunden ist. Zwischen Handarbeit, Hightech und großen Emotionen hebt ein einzigartiges Fluggerät ab.'
  widescreen: true
