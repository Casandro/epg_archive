  title: 'Border Patrol Neuseeland: Liebesgrüße aus Litauen'
  subtitle: 'Border Patrol Neuseeland: Liebesgrüße aus Litauen'
  description: 'Rund um die Uhr überwachen Zoll, Biosecurity und Immigration Neuseelands sensible Grenzen. Diese Folge zeigt, wie unterschiedlich Einsätze verlaufen können: Ein verliebter Reisender aus Litauen hofft auf Milde, während Beamte am Flughafen Christchurch eine große Menge geschmuggelter Zigaretten sicherstellen. Gleichzeitig entdeckt die Biosecurity einen versteckten Schädling, der unbemerkt ins Land gelangen wollte.'
  widescreen: true
- eventId: 779035
  start: 2026-10-16T05:31:00Z
  stop: 2026-10-16T06:00:00Z
  title: 'Border Patrol Neuseeland: DJ Trickreich'
  subtitle: 'Border Patrol Neuseeland: DJ Trickreich'
  description: An den neuseeländischen Grenzen entscheidet sich täglich, wer passieren darf - und wer nicht. Die Beamten stehen unter hohem Druck, denn jeder Fehler kann Folgen haben. In dieser Folge geraten Beamte bei der Einreisekontrolle mit einem nigerianischen Staatsbürger an ihre Grenzen. Parallel nehmen Zollermittler ein verdächtiges Paket aus Afrika unter die Lupe. Außerdem versucht ein trickreicher DJ, ohne gültiges Visum im Land zu arbeiten.
  widescreen: true
- eventId: 779060
  start: 2026-10-16T06:00:00Z
  stop: 2026-10-16T06:28:00Z
  title: 'Border Patrol Neuseeland: Brexit mal anders'
  subtitle: 'Border Patrol Neuseeland: Brexit mal anders'
  description: 'Nicht jeder, der nach Neuseeland will, hält sich an die Regeln - manchmal nur an seine eigenen.   An der Grenze treffen Beamte auf einen Briten, der seinen ganz persönlichen Brexit plant. Im Mailzentrum sorgt ein auffälliges Paket für Aufmerksamkeit - Glückstreffer oder Fehlalarm? Und: Eine angespannte Verfolgungsjagd in der Bay of Islands erfordert polizeiliche Verstärkung.'
  widescreen: true
- eventId: 779061
  start: 2026-10-16T06:28:00Z
  stop: 2026-10-16T06:56:00Z
  title: 'Border Patrol Neuseeland: Katzenjammer'
  subtitle: 'Border Patrol Neuseeland: Katzenjammer'
  description: 'Unerwartete Vorfälle halten die Grenzbehörden in Atem: Eine US-Amerikanerin sorgt mit einem ungewöhnlichen Schmuggelversuch für Aufsehen, während der Zoll in einem Stofftier eine brisante Entdeckung macht. Auf See eskaliert die Situation, als Einheimische die Regeln ignorieren und die Beamten vor eine heikle Entscheidung stellen. Eine Episode voller Spannung, überraschender Wendungen und konsequenter Grenzarbeit.'
  widescreen: true
