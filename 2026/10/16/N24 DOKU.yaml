  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 4'
  description: In dieser Folge begleitet die Serie die US-Grenzschutzbeamten an der belebtesten Grenze der Welt. Nachts kontrollieren sie Reisende, darunter einen Mann, der seit 20 Jahren nicht zurückgekehrt ist, einen Fahrer, der 15kg Kokain schmuggelt, und einen Truck mit auffälliger, modifizierter Kabine. Spannende Einsätze, überraschende Geschichten und riskante Kontrollen zeigen, wie Grenzschutz täglich für Sicherheit sorgt.
  widescreen: true
