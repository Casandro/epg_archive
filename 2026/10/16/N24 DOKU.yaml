  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 5'
  description: 'An der US-mexikanischen Grenze ist Wachsamkeit Alltag. In dieser Folge kontrollieren Beamte einen Geschäftsmann aus Mexiko in einem fabrikneuen Wagen - schnell entsteht Verdacht. Auf der Juarez-Lincoln-Brücke schlägt ein Spürhund an, doch die Drogenmenge ist ungewöhnlich gering. Geht es um ein Ablenkungsmanöver eines Kartells? Und: Ein Passant erlebt einen Schreckmoment, als er mit einem bewaffneten Gesuchten verwechselt wird.'
