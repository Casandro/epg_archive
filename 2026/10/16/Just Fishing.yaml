- eventId: 775339
  start: 2026-10-16T02:55:00Z
  stop: 2026-10-16T03:03:00Z
  title: Schleienangeln - Schönheiten gezielt gefangen
  subtitle: Schleienangeln - Schönheiten gezielt gefangen
  description: Schleien gehören zu den geheimnisvollsten Fischen unserer Gewässer. Oft schwierig zu fangen und dennoch von vielen Anglern hochgeschätzt. In diesem Film gehen wir auf verschiedene Faktoren ein. Wo und wie werden dicke Schleien gefangen? Was sind die besten Montagen und welches Futter kommt zum Einsatz. Eine Kurzanleitung um beim nächsten Angelausflug auf Erfolgskurs zu sein. DE 2018
- eventId: 775341
  start: 2026-10-16T03:05:00Z
  stop: 2026-10-16T03:14:00Z
  title: Arapaima - King of the Jungle!
  subtitle: Arapaima - King of the Jungle!
  description: Dieser Film führt Sie in den tiefen Amazonas auf der Suche nach den letzten, wilden Arapaimas. Tief im Urwald erleben die Angler ein grandioses Fischen auf die urtümlichen Fische mit kapitalen Fängen weit über der zwei Meter Marke. Ein absolutes Angelabenteuer in das wohl beste Arapaimarevier der Welt! PE 2018
