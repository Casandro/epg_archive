- eventId: 775316
  start: 2026-10-16T00:30:00Z
  stop: 2026-10-16T00:40:00Z
  title: Smallfish Competition und Nascar Party
  subtitle: Smallfish Competition und Nascar Party
  description: 'In den Vereinigten Staaten angekommen, gab es erstmal Geschenke. Ungefähr 20 alte Angelruten und Rollen, Angelkoffer mit Bobbern usw. Die Aufgabe stand schnell fest: wir müssen uns eine Rute und Rolle herauspicken und damit versuchen, den ein oder anderen Fisch ans Band zu bekommen. Das einzige was wir von unserem mitgebrachtem Material verwenden dürfen ist der Köder. Gesagt, getan und los geht''s zum Pond hinter dem Haus. Ein harter Kampf, wer fängt die meisten Sunfish und Bluegill. Das war der perfekte Zeitvertreib bevor es für uns zum Nascar Race ging. Man kann es als ein Stück Kultur bezeichnen und wir waren mittendrin, im Innfield der Rennstrecke. Nach anfänglichen Schwierigkeiten und etwas Verspätung war die Party schon voll im Gange. Überall feiernde Menschen, riesige Camper, eigens für diese Veranstaltungen ausgebaut. Beobachtungsplattformen auf den Dächern und dieser wahnsinnige, ohrenbetäubende Lärm der 725 PS starken Boliden, ein Erlebnis der ganz besonderen Art. Und immer wieder rückte das Angeln in den Vordergrund. Interessante Gespräche, sofern möglich, total verrückte Leute und die Fish-On Geschichte, welche in den nächsten folgen immer wieder aufgelöst wird. DE 2017'
- eventId: 775317
  start: 2026-10-16T00:40:00Z
  stop: 2026-10-16T00:59:00Z
  title: Smallmouth Bass - Wilde Kämpfer vom Belly-Boat
  subtitle: Smallmouth Bass - Wilde Kämpfer vom Belly-Boat
  description: Belly - Boat Action auf dem Huron River. Nur 5 Kilometer vom Detroit Metropolitan Wayne County Airport entfernt liegt der Einstieg zur ersten Driftsession. Direkt unter dem Damm vom Belleville Lake, durch den der Huron fliesst. Nach vorherigen Recherchen und ersten Tests vom Ufer aus war klar, hier gibt es eine große Zahl von Smallmouth Bass - irrsinnige Kämpfer, welche bestens auf Stickbaits, Splashbaits und Popper beißen. Auch die Fließgeschwindigkeit und die Beschaffenheit des Flusslaufes passen perfekt, um kilometerweit mit dem Belly - Boat zu driften. Unverbaute Ufer mitten inDetroit, keine Wehranlagen, große Rauschen oder ähnliches, die das Vorhaben einschränken. Zusammen mit dem Plan, etwas über 10 Meilen an einem Tag zurückzulegen, klingt das nach Abenteuer pur. Bereits am Anfang beißen die ersten Smallys aggressiv und verrückt. Als wäre das nicht schon genug, gibt es eine fette Überraschung als sich ein Largemouth den Popstick an einer Brücke voll von der Oberfläche wegzimmert. Spektakuläre Aufnahmen und Spannung bis zum Schluss sind garantiert. Neben Zahlreichen unglaublich adrenalingeladenen Attacken und Drills auf dem Fluss kommt der vereinbarte Ausstieg am Friedhof gefühlt immer näher. Der Tag neigt sich dem Ende. Als jedoch auf Nachfrage ein Anwohner die Auskunft gibt, dass es wahrscheinlich noch 3 bis 4 Stunden zum Friedhof zu fahren sind, kommt das erste mulmige Gefühl, da es schon sehr spät geworden ist. Es ist nicht klar ob wir es rechtzeitig bis zum Einbruch der Dunkelheit schaffen. Das Handy versagt, das GPS und die Kopflampen liegen im Auto. Es wird immer dunkler und dunkler und wir sind immer noch auf dem Fluss. Wo vorher noch Straßen, Brücken und Häuser waren ist auf einmal nur Wald und Natur. Keine Spur von Zivilisation und dass mitten in Detroit. Kilometer um Kilometer schlängelt sich der Fluss durch die Pampa und das letzte Licht ist angebrochen. Eine Möglichkeit zum Ausstieg besteht nicht. DE 2017
- eventId: 775324
  start: 2026-10-16T01:05:00Z
  stop: 2026-10-16T01:25:00Z
  title: The American Dream - Schwarzbarschangeln der Extraklasse
  subtitle: The American Dream - Schwarzbarschangeln der Extraklasse
  description: Unser Anglerstützpunkt für die nächste Woche, die Cabin, liegt am Cranberry Lake. Ein kleiner See in der Mitte von Michigan, der einen sehr guten Schwarzbarsch-Bestand aufweist. Bereits am ersten Angeltag ging es voll zur Sache. Die Bass waren richtig gierig und mit vier Anglern auf dem Bassboat gab es natürlich jede Menge geile Bisse, tolle Fische und nonstop Action. Gute Laune ist vorprogrammiert und gemeinsames Angeln und Erleben ist immer das Beste beim schönsten Hobby der Welt. Angeln verbindet und in den Vereinigten Staaten gehört es schon fast zum guten Ton. Wie einfach es sein kann, angeln zu gehen, machen uns die Amerikaner vor. Jahreslizenzen liegen für alle Fischarten und Gewässer in Michigan für Einwohner bei 26 Dollar, für Ausländer bei 76 Dollar. Kinder zahlen sogar nichts bzw. 1 Dollar. Für alle, denen das noch zu teuer ist oder die mit diesem Sport anfangen wollen, gibt es sogar zwei "Free Fishing Weekends" an denen jeder von Freitag bis Sonntag ohne Lizenz angeln darf. Die Lobby ist riesig, angeln ein Volkssport und ganz einfach auch für Kinder zugänglich. Es gehört für die Bewohner genauso zum Leben wie Fast Food. DE 2018
- eventId: 775325
  start: 2026-10-16T01:25:00Z
  stop: 2026-10-16T01:38:00Z
  title: Traumrevier Seter Brygge - In Mittelnorwegen auf Heilbutt, Pollack und Co
  subtitle: Traumrevier Seter Brygge - In Mittelnorwegen auf Heilbutt, Pollack und Co
  description: 'Seter Brygge liegt in Mittelnorwegen zwischen Bessaker und Flatanger - eingebettet in eine wunderschöne Landschaft. In nur wenigen Bootsminuten seid ihr hier direkt am Fisch. Beliebt ist das Revier vor allem bei Anglern, die es auf kampfstarke Pollacks und Heilbutte abgesehen haben. Aber auch kräftige Dorsche und schöne Köhler gehen hier selbstverständlich ans Band. Großes Plus: Die Ferienhäuser und Apartments bieten sich prima auch für größere Gruppen an.    DE 2018'
- eventId: 775326
  start: 2026-10-16T01:40:00Z
  stop: 2026-10-16T02:02:00Z
  title: Fliegende Bachforellen im September - 12 Monate Topwater Challenge
  subtitle: Fliegende Bachforellen im September - 12 Monate Topwater Challenge
  description: Die Forellensaison neigt sich dem Ende und das große Fressen geht los. Wer jetzt mit Oberflächenködern am Bach angelt, kann wahre Sternstunden erleben. Aggressive Bisse und fliegende Bachforellen sind nun an der Tagesordnung. Zusammen mit Kumpel Marko ging es auf die Pirsch und wir konnten jede Menge Action verbuchen und einen Traumhaften Angel Tag inmitten einer wunderschönen Natur erleben. DE 2022
- eventId: 775327
  start: 2026-10-16T02:05:00Z
  stop: 2026-10-16T02:32:00Z
  title: Pleiten, Pech und Pannen - Struggle am 1000ha See
  subtitle: Pleiten, Pech und Pannen - Struggle am 1000ha See
  description: Die französischen Riesenseen zu beangeln bringt mir eine Menge Fun! Oft sind diese Gewässer aber technisch herausfordernd. Gute Vorbereitung ist alles. Was machen, wenn auf einmal ein Schlauchboot kaputtgeht und der beste Spot von einer gigantischen Kolonie roter Waldameisen überfallen wird. Klar, wir machen weiter! Ob wir es am Ende schaffen die Session zu einem gelungenen Abschluss zu bringen und ob es mir sogar gelingt, einen der dicken Fische der großen Seen zu überlisten? Du erfährst es im Film! FR 2022
- eventId: 775328
  start: 2026-10-16T02:40:00Z
  stop: 2026-10-16T02:47:00Z
  title: Topwaterangeln im August - 12 Monats Challenge
  subtitle: Topwaterangeln im August - 12 Monats Challenge
  description: Hitze und extrem niedrige Wasserstände sind normal nicht unbedingt die besten Voraussetzungen zum Spinnfischen. Rapfen und Döbel sind jedoch trotzdem sehr aktiv und gerade vom driftenden Belly super zu beangeln. Jeder Baum, jeder Busch und jede Strömungskanten ist ein potentieller Hotspot an dem der Stickbait brachial attackiert werden kann. Eine geniale Fischerei mit Suchtpotential! DE 2022
