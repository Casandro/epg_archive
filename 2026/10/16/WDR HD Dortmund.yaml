  title: 'Expedition in die Heimat: Genusstour durch den Schwarzwald'
  subtitle: Genusstour durch den Schwarzwald
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Kaum eine Region bietet mehr kulinarischen Hochgenuss und Naturidylle als der Nordschwarzwald. Der Ort Baiersbronn wurde von der New York Times zur "ungewöhnlichsten Gourmethauptstadt der Welt" gekürt. Nirgends ist die Michelin-Sterne-Dichte höher. SWR_Moderatorin Annette Krause stellt berühmte Feinschmeckertempel vor und kleine, gemütliche Örtlichkeiten für Urlauber:innen und Genussmenschen.
- eventId: 1011210
  start: 2026-10-16T09:55:00Z
  stop: 2026-10-16T10:45:00Z
  title: Elefant, Tiger & Co. (433)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Schimpansen genießen das gute Wetter. Bis die innere Uhr ihnen verrät, dass die Essenszeit naht und das Bett ruft. Viel zu früh versammelt sich die ganze Affengesellschaft vor dem Schieber und wartet darauf, wieder reingelassen zu werden. Unter großem Geschrei fallen sie über ihr Abendbrot her. Doch keine halbe Stunde später sind sie im Reich der Träume. Affen sind eben auch Gewohnheitstiere.
