  title: Passe-moi les jumelles
  description: |-
    - Les ailes de la nuit Entre peur et fascination, la chauve-souris souffre de croyances populaires qui nuisent à sa survie. Alors que 23 des 30 espèces de chauves-souris en Suisse sont menacées d'extinction, la biologiste Anouk Lettmann se mobilise pour leur préservation.
     - A l'échelle de la passion Dans l'ancienne droguerie de son quartier, Jean-Michel, maquettiste, a monté un atelier où chaque pièce se fabrique à la main. Autour de lui : Lydie la fidèle employée, Léo l'apprenti, Greg au plâtre et Antoine pour la 3D. Ici, on ajuste au dixième et on transmet un savoir-faire bien vivant.
