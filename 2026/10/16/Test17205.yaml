  title: Temps présent
  description: |-
    Crack, comment en sortir À Genève, la consommation de crack prend de l'ampleur depuis l'arrivée de cette drogue, à large échelle, en 2021. Une crise qui a touché Katia, Brice et Thomas, qui ont accepté de raconter, à visage découvert, comment ils tentent de surmonter leur addiction. Un calvaire face à cette substance très addictive pour laquelle, contrairement à d'autres drogues, il n'existe pas de traitement de substitution. Des solutions existent toutefois grâce à l'accompagnement social des consommateurs, qui permet de les sortir de l'extrême précarité. Une première étape.

