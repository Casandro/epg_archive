  title: Ramdam
  description: Plouf Aujourd'hui, nous avons tous piscine. Dès qu'on prononce le mot "piscine", on pense maillot de bain, bleu , farniente, maître-nageur musclé. Et lui. David Hockney. Nous sommes au Musée des beaux arts du Locle dans le cadre de l'exposition "La piscine dans l'imaginaire". Sous cette piscine idéalisée, il y a aujourd'hui des aspects plus sombres qui sont évoqués, symbole d'éco anxiété, lieux de toutes nos peurs. Alors la piscine, rêve ou angoisse?
