  title: Kingdom Manifesto - Manifest des Himmelreichs
  subtitle: Ich aber sage - Teil 1
  description: |-
    Nach den Seligpreisungen in der letzten Folge betrachten heute David Asscherick und Ty Gibson die Verse 17 bis 30 aus dem Kapitel 5 des Matthäusevangeliums. Jesus spricht hier zum jüdischen Volk über das Gesetz und seine Erfüllung und macht klar, dass Jesus nicht gekommen ist, um das Gesetz aufzulösen, sondern diese Lehren zu erfüllen. In Jesus ist die Gesamtheit der alttestamentlichen Schriften zusammengefasst. In seinem Geist, in seiner Liebe zu  Gott und den Menschen. Wer gerecht und mit Gott im Frieden leben will, muss auch mit seinen Mitmenschen in Frieden leben. Gerechtigkeit zeigt sich nicht nur in äußeren Handlungen sondern muss das Herz erreichen. Jesus hat viel mehr gefordert als das äußerliche, formale Einhalten des Gesetzes. Es muss in mein Herz eindringen, dorthin, wo es niemand sehen kann und mein grundsätzliches Handeln erreichen.

    Weitere Infos unter: hopetv.de
  widescreen: true
  hd: true
