  title: Immanuel - Jesus folgen
  subtitle: Leben feiern
  description: |-
    Unsere Gesellschaft kennt kaum noch echte Pausen. Leistungsdruck, Termine und ständige Erreichbarkeit prägen den Alltag vieler Menschen.
    Der Sabbat begegnet uns in dieser Folge als Gottes Geschenk an den Menschen. Dabei wird deutlich, warum dieser Ruhetag bis heute überraschend aktuell ist. Anhand der Worte und des Handelns Jesu zeigt sich, dass der Sabbat nicht in erster Linie Regeln vermittelt, sondern Freiheit, Vertrauen und neue Kraft schenken möchte.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

