  title: PASSATO E PRESENTE 2021-2022 Passato e P
  subtitle: PASSATO E PRESENTE 2021-2022 Passato e Presente Roma 1943 La razzia delle biblioteche ebraiche - Tra ottobre e dicembre 1943, nella Roma occupata dopo l'Armistizio, i tedeschi sequestrano lintero patrimon
  description: "io librario della Comunità ebraica romana. Si tratta di due biblioteche con circa 25.000 volumi, molti dei quali rari e pregiati, di grande valore sul piano materiale, culturale e storico. I nazisti hanno un grande interesse per i beni culturali ebraici e ne fanno razzia in tutta Europa. Nella loro ossessione antisemita vogliono studiare quelli che considerano i peggiori nemici del popolo tedesco, al punto da progettare un ''museo della razza estinta''. I fascisti non sono da meno. La persecuzione degli ebrei italiani inizia con le leggi razziali del 1938. Oltre alla perdita di libertà e diritti civili, gli ebrei vengono sottoposti a una progressiva spoliazione dei loro averi, comprese opere d'arte e beni culturali di grande valore. La situazione peggiora dopo l'armistizio del 1943, quando la Repubblica Sociale Italiana confisca agli ebrei tutti i beni, mobili e immobili. Dopo la guerra, parte dei libri razziati alla Comunità ebraica di Roma viene recuperata e restituita. Il resto, comprendente i volumi più pregiati, è oggetto di un'accanita ricerca, che dal dopoguerra non si è ancora fermata e continua tutt'oggi. In studio, con Paolo Mieli, la prof.ssa Bianca Gaudenzi. - \n\nConduce Paolo Mieli Ospite in studio la prof.ssa Bianca Gaudenzi Con la partecipazione di Maria Sole Sanasi Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno Produttore esecutivo Valentina Tassini Regia Davide Frasnelli"
