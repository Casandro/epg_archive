  title: Passato e presente Il Duce e Margherita
  subtitle: My fault, è colpa mia'' è il titolo con cui Margherita Sarfatti torna a raccontare Benito Mussolini, l'uomo che aveva accompagnato nella conquista del potere, che aveva amato e contribuito a trasformare i
  description: |-
    n un mito politico. Margherita Sarfatti, ebrea, socialista e protagonista della cultura italiana, incontra Benito Mussolini quando il futuro Duce è ancora un rivoluzionario inquieto e ambizioso. Tra loro nasce un legame sentimentale, politico e intellettuale destinato a intrecciarsi con l'ascesa del fascismo. Sarfatti è vicina a Mussolini, ne sostiene l'immagine nella crisi seguita al delitto Matteotti e nel 1926 pubblica Dux, la biografia che presenta il Duce al mondo. Attraverso l'arte e il movimento del Novecento Italiano, Margherita Sarfatti tenta di dare al fascismo un volto moderno e una propria identità culturale. Ma il regime che ha contribuito a celebrare finirà per respingerla: nel 1938 le leggi razziali la costringono all'esilio. Anni dopo, Sarfatti rivolge lo sguardo al passato e nel memoriale ''My fault, è colpa mia'', la biografa del Duce torna sul rapporto con Mussolini e sulle proprie responsabilità. Ma è davvero stata sua la colpa? Quanto c'è di ammissione, di disincanto, si autoassoluzione? E quale responsabilità ebbe davvero Margherita Sarfatti nella costruzione dell'immagine di Mussolini? In studio con Paolo Mieli, il prof. Ernesto Galli della Loggia. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Ernesto Galli della Loggia Con la partecipazione di Gregorio Staglianò
