  title: 'Die Nordreportage: Pannenhilfe für Traktoren'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wenn bei Klaus Osters im Sommer das Telefon klingelt, ist es meist ein Trecker-Notfall. Osters ist so etwas wie ein Pannendienst für Landmaschinen. Während der Erntezeit ist er rund um Osnabrück im Dauereinsatz. Für die Bauern zählt dann jede Minute. Denn jede Minute, die eine Maschine still steht, kostet Geld. Klaus Osters und seine Kollegen machen deshalb während der Erntezeit 24-Stunden-Notdienst. Wenn gar nichts mehr geht, fährt Osters auch zu den Bauern aufs Feld. "Die Nordreportage" begleitet den Pannenhelfer.
