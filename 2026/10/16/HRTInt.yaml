  title: Eko zona
  subtitle: ' '
  description: Već smo se nekoliko puta u Eko zoni bavili problematikom opasnog otpada u jami Sovjak u općini Viškovo. Desetljećima se u bivšoj državi u nju bacao različit industrijski otpad iznimno opasan za okoliš i zdravlje ljudi. Premda je Fond za zaštitu okoliša još krajem 2021. s izvođačem sklopio ugovor za njezinu konačnu sanaciju u veljači ove godine je raskinut zbog velikih kašnjenja radova i zahvaćenosti projekta sumnjom na korupciju.  Premda industrijska konoplja nije uobičajena biljka za uzgoj u Slavoniji, obitelj Kalić prije desetak godina odlučila se baš za njezin uzgoj, i to na ekološki način u Vrpolju, selu u blizini Đakova. Tako su osigurali posao i drugim mještanima u selu.  Strane vijesti o iskorištavanju svih dijelova rajčice u Australiji za kreme i hranu za kućne ljubimce te o pronalasku novih morskih vrsta.
