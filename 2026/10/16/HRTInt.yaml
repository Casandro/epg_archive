  description: Kada je prije 24 godine hrvatska umjetnica i aktivistica Kristina Leko projektom "Sir i vrhnje" pokrenula inicijativu za zaštitu zagrebačkih mljekarica, na zagrebačkim ih je tržnicama bilo čak 550. Prije dva desetljeća predstavljena je i Deklaracija o mljekaricama, koju je tada potpisalo više od pet tisuća ljudi. Danas, 2026., na zagrebačkim je tržnicama registrirano njih samo 130. Ovih je dana objavljena "Knjiga o mljekaricama" - knjiga koja nema jednu, nego čak 130 naslovnica. Na svakoj je portret jedne od žena koje desetljećima, iz dana u dan, na zagrebačke tržnice donose sir i vrhnje koje same proizvode. Mljekarice nisu samo dio zagrebačke tradicije i identiteta. One su i svjedočanstvo jednog načina života koji polako nestaje. Kristina Leko gotovo četvrt stoljeća prati njihov život, rad i položaj. I zajedno s njima pokušava učiniti ono najvažnije - da mljekarice ne nestanu ni s naših tržnica ni iz našeg života. Gošća emisije je Kristina Leko, a s kamerom smo bili i u Velikom Potočecu kod mljekarice Renate.
