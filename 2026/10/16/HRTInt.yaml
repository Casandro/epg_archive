- eventId: 778082
  start: 2026-10-16T21:35:00Z
  stop: 2026-10-16T22:00:00Z
  title: Druga strana
  subtitle: ' '
  description: 'Tržište stanova i građevinarstvo su, načelno, dvije spojene posude. Kad jednom omrkne, drugom ne osvane. I obrnuto. A gdje smo sada? Isplati li se po ovim cijenama uopće promišljati o kupnji? Ili je na djelu balon koji će se brzo ispuhati pa je trenutačni trend samo klopka za lakovjerne? Cijene stanova rastu dvoznamenkasto četvrtu godinu zaredom, a građevinarstvo je udjelom u gospodarstvu na razini vrha iz 2008. Rekli bismo da prodavači i graditelji zadovoljno trljaju ruke, a po nekoj tržišnoj logici stvari stoje ovako: cijene stanova financiraju gradnju, gradnja stvara ponudu koja bi trebala hladiti cijene stanova, a obje strane dijele isti ciklus i iste rizike. Je li tome baš tako? Zašto Hrvati imaju najniže kamate na stambene kredite u EU i zašto se mladim ljudima isplati kupovati stan na kredit, bez obzira na trenutačne cijene? Priuštivost stana se počela blago pogoršavati jer cijene stanova rastu brže od rasta plaća. Dokle taj rast može ići? Zašto trenutačna situacija nije identična onoj iz 2008? I, jeste li znali da rast kamata od 1% u prosjeku podiže ukupnu cijenu stana za 13%? Koliki je to rizik za financijski sustav, a koliki za građane? I zadnje, ali ne manje važno: turistička sezona je završila, rentijeri kreću u shopping? Umjesto nagađanja, upravo objavljenu znanstvenu analizu nudi gost Nenad Bakić, ovlašteni financijski analitičar, CFA.'
