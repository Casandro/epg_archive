  title: Priča o stvarnosti i fantaziji, pučka i predajna kultura
  subtitle: ' '
  description: U povijesti Hrvatske radiotelevizije neki ljudi su dali svoje lice malom ekranu, pa ih svi pamtimo. A neki su, iza kamere, kao autori stvarali našu kulturnu baštinu. O njima, obično, ne znamo mnogo.  Kad čovjek siđe s pozornice svoga života, njegova priča nestaje u zaboravu. Kažu kako su neke priče postojale da bi bile zaboravljene.  Zahvaljujući fragmentima sjećanja kolega i prijatelja, sačuvanim snimkama i ulomcima literarnog stvaralaštva, ova, barem zasad, nije. U arhivu HRT-a sačuvano je više od četiri stotine djela svih televizijskih formata i žanrova koje potpisuje redatelj Dražen Piškorić. Ovo je priča o "stvarnosti i fantaziji" njegova života.
