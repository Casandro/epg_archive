  title: Dolina sunca, serija (25/210)
  subtitle: ' '
  description: 'Ruža se razbjesni saznavši da njezin vlastiti sin planira otvoriti pansion i biti joj izravna konkurencija. Nataša sretno govori Ladi da je uspjela riješiti problem s Juranom i da se mogu nesmetano družiti. Robert testira Juliju i pokušava od nje saznati njezinu i Andrijinu prošlost. Nikola, Andrija i Lovro su šokirani zbog Ružinih tajnih planova i akcija koje je već poduzela. Ivan nehotice u svađi kaže Kristijanu da prestane biti slabić, što slučajno čuje Adela. Sofija je tužna zbog Ruže i razvoja događaja, ali misli da se sada ništa više ne može promijeniti jer su ona i Eva već započele s radovima. Lovro je uzrujan jer shvaća da se Nataša neće tako skoro promijeniti u vezi Jurana. Adela je zabrinuta za Kristijana i pokušava s njim otvoreno razgovarati o Ivanu i o Juranu. Eva potvrdi Andriji da ona i Sofija ne namjeravaju odustati od pansiona. Lada se odluči pohvaliti Nataši Lovrinim pozivom na spoj. Ruža se uspije žustro posvađati s Evom i Sofijom. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
