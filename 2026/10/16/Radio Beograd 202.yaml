  description: Da li biste voleli da provedete jedan ovakav dan? Prvo pogledate lutkarsku predstavu "Snežanine muke sa patuljcima" i saznate kakva je Snežana kuvarica a kako se u stvari hrane Pospanko, Ljutko, Radiša, Štediša, Smeško, Ljubiša i Dobrica. Onda se prisetite one stare dobre pesmice u kojoj se javlja šargarepa, koja je rumena, zdrava, lepa al' je tresu strašne krize nema nikog da je grize. Posle pređete u salu punu najlepših boja, mirisa i ukusa, da probate domaći hleb, kruške, jabuke, šipak, ajvar i raznorazne domaće proizvode koje su donela i u njihovoj pripremi učestvovala deca. Na kraju prisustvujete takmičenju u brzom jedenju zdrave hrane.
