  description: "Bombenalarm am Bodensee. Ein Blindgänger aus dem Zweiten Weltkrieg wurde angespült und muss unschädlich gemacht werden. Unter der Einsatzleitung von Matthias Krämer beginnt die Entschärfung der gefährlichen Ankertaumine. Auch Paul ist vor Ort. Er und sein Kumpel Matthias kennen sich aus der gemeinsamen Zeit in Afghanistan. \nDer junge Sprengmeister Sven Sailer soll die Mine entschärfen. Matthias, Paul sowie Svens Kollegen Alexandra Schulz und Hadi Bozkurt bleiben über Funk und Gopro-Videoübertragung mit dem jungen Mann verbunden. Als Sven sich die Mine näher anschaut, passiert das Unfassbare: Sie zündet. Sven hat keine Chance."
