  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - 50. Leipziger Jazztage beginnen\nDie Leipziger Jazztage feiern ihr 50. Jubiläum. Eröffnet wird mit einer krachgewaltigen Großbesetzung rund um den Pianisten Alexander von Schlippenbach, Free Jazzer der ersten Stunde. Er sitzt mit seiner Frau Aki Takase am Piano der Oper Leipzig. Um die beiden herum das Globe Unity Orchestra. \n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1846 Erste \"Äthernarkose\"\nEs ist eine medizinische Revolution: die Entdeckung, dass Menschen unter Äther keinen Schmerz spüren. Vor 180 Jahren wurde die erste Äthernarkose durchgeführt.\n\n* 06:50 Uhr - Anja-Nürnberg-Ausstellung in der Kunsthalle Naumburg\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Gespräch: \"Nach der Sonne schauen\" von Martina Hefter\nIn Leipzig läuft der Literarische Herbst - und einer der Höhepunkte dabei sicher die Buchpremiere am 16.10.2026 mit Martina Hefter und ihrem neuen Roman \"Nach der Sonne schauen\", erschienen beim Verlag Klett-Cotta. Ein Gespräch mit der Autorin.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Konzerte des Landesjugendorchesters Sachsen\nDas Landesjugendorchester Sachsen spielt im Oktober 2026 im Rahmen seiner Herbst-Projektreihe drei Konzerte mit dem Programm \"Stille - Träume - Aufbruch\".\n\n* 08:10 Uhr - Peter Zudeicks satirischer Wochenrückblick\n\n* 08:20 Uhr - Neue Musik von Cat Burns\nDie britische Singer/Songwriterin Cat Burns veröffentlicht ihre neue Single \"Is It That Deep?\"\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Gespräch: Das Blaue Haus am Theaterhaus Jena\n\n* 08:50 Uhr - Tatort \"Unter Feinden\"\nAm Sonntag Abend 20.15 Uhr gibts im Ersten Teil zwei des spannenden Tatorts aus Kiel . \"Unter Feinden\" erzählt die Geschichte um Korruption und Geschäften mit der Mafia weiter. \nEs ist auch der erste Fall für ein neues Team, Mila Sahin, bislang an der Seite von Axel Milberg, der seinen letzten Fall als Borowksi gelöst hat, ermittelt den Mord an ihrer Kollegin. Die Neue in Kiel ist Polizeipsychologin Elli Krieger, gespielt von Karoline Schuch. Und die ersten Begegnungen zwischen ihr und Mila sind eher schwierig."
