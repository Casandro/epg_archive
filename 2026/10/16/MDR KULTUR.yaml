  description: |-
    * 12:15 Uhr - Ausstellung: "VERTIGO" David Schnell
    Mit VERTIGO zeigt die G2 Kunsthalle eine Einzelausstellung des Künstlers David Schnell (*1971). Neben neuen Malereien umfasst sie eine ortsspezifische Arbeit, die an den Fensterscheiben des Glaskubus der G2 Kunsthalle angebracht wird und sowohl von der Kunsthalle als auch von der Stadt aus zu sehen sein wird.
    David Schnells Malerei ist geprägt von einer intensiven Auseinandersetzung mit Raum, Form, Farbe und Licht sowie deren Konstruktion und Zusammenhalt.

