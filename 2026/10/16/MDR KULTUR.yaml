  description: "* 09:00 Uhr - Nachrichten\n\n* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Stichtag: \nEs ist eine medizinische Revolution: die Entdeckung, dass Menschen unter Äther keinen Schmerz spüren. Vor 180 Jahren wurde die erste Äthernarkose durchgeführt.\n\n* 10:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 10:40 Uhr - Neue Musik von Sebastian Schub\nDer in Berlin geborene und in Großbritannien lebende Singer/Songwriter veröffentlicht die neue Single \"Before You Hit The Water\".\n\n* 10:50 Uhr - Das Gedicht: \"Hälfte des Lebens\" von Friedrich Hölderlin\nEs liest Ulrich Matthes\n\n* 11:15 Uhr - Feuilleton\n\n* 11:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 11:45 Uhr - Zum Geburtstag von Corinna Harfouch"
