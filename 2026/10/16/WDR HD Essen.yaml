  title: Mittendrin - Flughafen Frankfurt (82)
  subtitle: 82. Das große Krabbeln - Insektenalarm beim Zoll
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Einsatz für den Zoll und Pflanzenschutz: Im Gepäck von Fluggästen verstecken sich verbotene Obst- und Gemüsesorten mit Pflanzenschädlingen und Krankheiten. Fluggäste, die erwischt werden, müssen eine Strafe zahlen. \nEr schleppt Privatjets: Christopher Reifschneider steuert den kleinsten Pushbacktruck am größten Flughafen Deutschlands. Er trifft Promis, seine Hauptkundschaft sind Millionäre mit ihren Luxusmaschinen. \nJulien Backhaus reist regelmäßig im Privatjet: Der Unternehmer liebt Luxus und Unabhängigkeit. Wir dürfen den Geschäftsmann auf einem seiner Flüge nach Frankfurt begleiten."
