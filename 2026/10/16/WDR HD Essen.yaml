  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wirklich preiswert? Wirklich praktisch? Wirklich lecker? Die Servicezeit macht Ihren Alltag leichter! Mit unseren Tipps sind Sie in allen Lebenslagen gut beraten! Ob Gesundheit oder Geld, Wohnen oder Ernährung, Multimedia oder Verkehr - das Verbrauchermagazin Servicezeit beleuchtet Hintergründe, schafft Orientierung und gibt praktische Ratschläge - und zwar unabhängig und neutral.
- eventId: 1011117
  start: 2026-10-16T05:55:00Z
  stop: 2026-10-16T06:40:00Z
  title: Wer kann das bezahlen? (1)
  subtitle: Zahlen bitte! Alltag mit Aufpreis
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Es ist fast überall spürbar: In Deutschland steigen die Preise und damit auch unsere Lebenshaltungskosten. 2025 bekommen viele Haushalte außerdem weniger Netto vom Brutto im Vergleich zum Vorjahr. Anna Planken trifft Menschen in NRW und spricht mit ihnen über Geld. Mit denen, die mit wenig auskommen müssen, und denen, die Wohlstand genießen.'
- eventId: 1011535
  start: 2026-10-16T06:40:00Z
  stop: 2026-10-16T07:10:00Z
  title: Monitor
  subtitle: Berichte zur Zeit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'MONITOR, Markenzeichen und Reizwort zugleich, ist das zweitälteste politische Magazin im deutschen Fernsehen. Wir fragen nach, zeigen, was hinter Schlagworten steckt. Unser Ehrgeiz ist es, unbequem zu sein für die Mächtigen aus Politik, Wirtschaft und Gesellschaft - und uns stark zu machen für die Schwachen. Unsere Handschrift: seriöse Information, gepaart mit einer sorgfältigen Analyse. Kritischer, investigativer Journalismus wird in der Redaktion großgeschrieben. MONITOR will Hintergrund liefern, Diskussionen anstoßen, Themen setzen.'
