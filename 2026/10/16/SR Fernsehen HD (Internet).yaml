  title: Einfach & köstlich
  subtitle: Sören Anders kocht mit Theresa Knipschild
  description: |-
    * Zupfkuchen-Dessert mit Pflaumen und Kürbis-Kartoffel-Puffer mit Apfelmus
    Der Lieblingskuchen als Dessert: Konditorin Theresa Knipschild verwandelt einen Klassiker in einen aufregenden Nachtisch mit karamellisierten Pflaumen und crunchigen Schokostreuseln. Der Karlsruher Spitzenkoch Sören Anders kontert mit einer Kindheitserinnerung: Kürbis-Kartoffel-Puffer mit Apfelmus. Für die übrig gebliebenen Zutaten vereinen sich Theresa Knipschilds Konditorhandwerk mit der Spitzenkoch-Erfahrung von Sören Anders zu einer leckeren Kürbis-Apfel-Quiche mit krossem Boden und saftiger Füllung.
