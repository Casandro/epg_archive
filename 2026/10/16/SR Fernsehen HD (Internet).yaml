  description: Von der Abbildung der Welt im Kleinen geht schon seit Menschengedenken eine große Faszination aus. Hinzu kommen die gestalterischen Möglichkeiten, sich seine kleine Welt so zu gestalten, dass Freude und Begeisterung aufkommen. Immer häufiger werden in den Welten im Miniaturmaßstab Bahnstrecken abgebildet, wo der letzte Zug schon lange abgefahren ist. Gegenden, weitab vom hektischen Treiben der Metropolen, wie die Linie Dahme - Uckro in Brandenburg, die Station Portisend in England, Anno 1908, oder der Güterbahnhof Birnbaum-Ost in der Region Posen.
