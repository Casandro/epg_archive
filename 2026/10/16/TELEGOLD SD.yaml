  description: Das erfolgreichste Schweizer Schlagertrio, das sind Roland Eberhardt, Andy Rynert und Andy Steiner. Gegründet haben sich die Calimeros auf einem legendären Vereinsabend des Sportclubs von Uetendorf, 1976. Auf der Vereinsfeier zu musizieren war eher eine Schnapsidee. Die Musik kam bei den Kumpels aber so gut an, dass sie gleich im nchsten Jahr wieder auf der Vereinsfeier spielten. Benannt haben sich die Calimeros brigens nach dem griechischem Wort Calimera - was so viel wie Guten Tag heit!
