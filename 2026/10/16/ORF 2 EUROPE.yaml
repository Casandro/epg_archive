  title: Mentale Gesundheit - die NÖ Landesausstellung im Mostviertel
  description: 'Mentale Gesundheit geht uns alle an - im Mostviertel in Niederösterreich steht sie derzeit mehr im Fokus als je zuvor. Die niederösterreichische Landesausstellung trägt den Titel "Wenn die Welt Kopf steht - Mensch. Psyche. Gesundheit." und beleuchtet das Thema aus künstlerischer, medizinscher und menschlicher Sicht. Das "Erlebnis Österreich" aus dem ORF Landesstudio NÖ (Gestaltung: Jasmin Daurer, Kamera: Helmut Muttenthaler) begibt sich auf eine Reise zur mentalen Gesundheit in der außerordentlichen Kulisse des frühlingshaften Mostviertels.'
  genre:
  - '34'
