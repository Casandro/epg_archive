  title: Ciclo Amarcord - Ritratti di città - Cat
  subtitle: Ciclo Amarcord - Ritratti di città - Catania - ATTUALITA' - Il documentario si apre sull'Etna e su Catania, distrutta nove volte dalle eruzioni e risorta ogni volta più grande come metropoli di lava e cem..
  description: "nto, dalle cui ceneri emerge il barocco del 1693 in pietra lavica e materiali chiari. Su questo sfondo Giuseppe Fava descrive i catanesi come ironici, vitali e instancabili fenici del commercio, capaci di trasformare l'improvvisazione in profitto; la narrazione prosegue così esplorando il centro storico e le piazze, il risanamento dell'ex quartiere malavitoso di San Birillo, la sistemazione del lungomare e i mercati storici, fulcro della socialità e della cultura mercantile. Passando al tessuto produttivo, spicca la stalla più efficiente d'Europa, mentre nella Piana di Catania occorre difendere gli agrumeti dalla concorrenza estera migliorando la qualità, l'export e l'industria conserviera. In questo contesto, il porto traina la trasformazione della città, favorita dagli incentivi della Cassa per il Mezzogiorno, dall'adozione dei cervelli elettronici nella gestione degli affari e da industrie avanzate che, impiegando le donne, ne favoriscono l'emancipazione superando il patriarcato. L'intera metropoli resta infine sospesa tra il boom economico e le ultime sacche di povertà, imponendosi quale vivida espressione del Sud in movimento.  - Programma di Enrico Gras e Mario Craveri \nFotografia: Franco Castelli \nContenuto musicale: Franco Potenza  \nVoce: Mario Erpichini \nConsulenza: Luca Pinna \ndel 1968,"
