  title: ANIXE auf Reisen - Taiwan mit Valerie Niehaus
  description: 'Sprudelnde heiße Quellen, Palmen gesäumte Strände, geheimnisvolle Berglandschaften. Flächenmäßig ist Taiwan zwar gerade einmal so groß wie Baden-Württemberg, aber die Insel im Pazifik beherbergt mehr Berggipfel über dreitausend Meter als Österreich. Mit anderen Worten: Taiwan ist ein Land, das überrascht und das zahlreiche Facetten kennt. Viele taoistische und buddhistische Tempel belegen, dass die Bevölkerung tief in Traditionen verhaftet ist, während sie längst im digitalen Zeitalter angekommen ist und es tatkräftig gestaltet. Kunst und Kultur stehen auf der Insel hoch im Kurs. Das beweist allein schon die große und vitale internationale Kunstszene. Die Doku mit der Schauspielerin Valerie Niehaus zeigt, wie vielfältig und abenteuerlich Taiwan ist und welche Regionen auf jeden Fall einen Besuch lohnen.'
  widescreen: true
