  title: De Bauers, een nieuwe fase
  subtitle: S01 E08. Frans organiseert een weekend in Drenthe waarmee de familie teruggaat naar hun roots. Ook baby Jantje gaat mee. Het verblijf in authentieke woonwagens, met minder comfort dan verwacht, is even wennen.
  description: 'Nu de kinderen groter worden en steeds meer hun eigen weg gaan, zijn momenten met de hele familie minder vanzelfsprekend. Daarom organiseert Frans een familieweekend in Drenthe, waar de Bauers teruggaan naar hun roots. Ook baby Jantje gaat mee op zijn eerste vakantie. De familie verblijft in authentieke woonwagens, zoals die waarin Frans'' ouders vroeger woonden. Voor de jongens, inmiddels gewend aan meer comfort, is een nacht zonder toilet, badkamer en verwarming een flinke beproeving. Toch wordt het een ervaring om nooit te vergeten. En nóg belangrijker: een ervaring die ze met zijn allen delen. (2026)'
