  title: Binnenstebuiten
  subtitle: S12 E137. Een voormalige kerk is nu een kleurrijk interieur met originele details, chef-kok Leon bezoekt de Belgische topsommelier Pieter Verheyde en imker Petra gaat de strijd aan met de Aziatische hoornaar.
  description: 'Huibert en Reina kozen voor het avontuur en kochten de voormalige Petrakerk in Rijnsburg. Ze transformeerde dit imposante gebouw tot indrukwekkende woning. * Chef-kok Leon keert voor Leon bij de Zuiderburen terug naar West-Vlaanderen. Hier runt topsommelier Pieter Verheyde op de Belgisch-Franse grens een familiebedrijf waar gastronomie, streekproducten en traditie samenkomen. * De Aziatische hoornaar is bezig aan een enorme opmars in Nederland. En dat is niet zonder gevaar: ze eten bijen en andere insecten en planten zich razendsnel voort. Zo komt de biodiversiteit onder druk te staan. Imker Petra gaat met andere vrijwilligers de strijd aan. (2026)'
