  title: Stratospheric
  subtitle: Stratospheric
  description: Dieser Film zeigt extremes Skifahren in verschiedenen Disziplinen und von seiner besten Seite. Ein Skifilm, der Kreativität, Sensation und Vergnügen vereint. Aber es handelt sich hauptsächlich um einen Freestyle-Skifilm, der aufgrund seiner Schönheit und Praktikabilität in sorgfältig ausgewählten Ländern spielt. Probieren Sie Freeride-Skifahren an abgelegenen und unberührten Orten, Straßen-Sessions und Skifahren in Snowparks. Gefilmt in den Alpen, aber auch in Japan und Neuseeland. AT 2008
