- eventId: 774577
  start: 2026-10-16T11:05:00Z
  stop: 2026-10-16T11:30:00Z
  title: Entdecker der Welt - Das Kristall-Labyrinth
  subtitle: Entdecker der Welt - Das Kristall-Labyrinth
  description: |-
    Die karibische Inselkette der Bahamas beherbergt einige der atemberaubendsten und umfangreichsten Unterwasserhöhlen der Welt. In dieser spektakulären Kulisse beherbergen die Abaco-Inseln ein riesiges Unterwasser-Kristallhöhlennetzwerk, das noch nicht vollständig erforscht ist. Tauchlegende Brian Kakuk versucht seit vielen Jahren, eine Verbindung zwischen zwei der größten Höhlensysteme zu finden. Im Juni 2014 wird er den letzten Vorstoß unternehmen, um Dan's Cave und Ralph's Cave miteinander zu verbinden. Gelingt ihnen das, erforschen sie das weltweit größte Höhlensystem dieser Art. Wenn sie scheitern - nun, denken Sie nicht einmal darüber nach...
     BS 2018
