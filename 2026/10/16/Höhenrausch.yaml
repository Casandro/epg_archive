- eventId: 775456
  start: 2026-10-16T00:20:00Z
  stop: 2026-10-16T01:10:00Z
  title: Faszination Heimat - Die Honigmacher - Kein Leben ohne die Biene
  subtitle: Faszination Heimat - Die Honigmacher - Kein Leben ohne die Biene
  description: |-
    Sie ist ein faszinierendes Tier und für unser aller Überleben entscheidender, als die meisten von uns denken. Die Biene produziert nicht nur Honig, sie bestäubt auch fast 80 Prozent unserer Nutzpflanzen, die für eine gesunde Ernährung unverzichtbar sind.
    Stefan Mandl hat sein Leben diesen kleinen, erstaunlichen Insekten verschrieben. Der studierte Bienenforscher und Imker hat seinen ersten Bienenstock vor 15 Jahren übernommen. Damals war er völlig ahnungslos, inzwischen besitzt der Österreicher rund 7.000 Völker und damit den größten Bio-Betrieb weltweit. AT 2014
- eventId: 775457
  start: 2026-10-16T01:15:00Z
  stop: 2026-10-16T02:02:00Z
  title: Heimatleuchten - Mehr als schifoan - Winter im Stubaital
  subtitle: Heimatleuchten - Mehr als schifoan - Winter im Stubaital
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2021'
- eventId: 775458
  start: 2026-10-16T02:05:00Z
  stop: 2026-10-16T02:38:00Z
  title: The List
  subtitle: The List
  description: Jeder hat es. Eine Taschenliste voller Dinge, die er oder sie einmal im Leben tun oder erreichen möchte. Die Athleten von The List haben in ihrem Leben definitiv Dinge erreicht, von denen andere nur träumen können, aber dennoch haben diese Jungs auch unerledigte Dinge auf ihren individuellen Listen. Die Bandbreite reicht von seltsam bis wirklich herausfordernd. Zumindest immer unterhaltsam. The List ist ein auf mehrere Jahre angelegtes Projekt. Nach dem ersten Jahr erscheint der erste abendfüllende Film. Dieser erste Teil führt das Publikum in den Hinterhof der Fahrer. In Alaska zu sein bedeutet nicht, dass man zu Hause schon die steilsten Strecken gefahren ist. Manche Projekte versuchen sie schon seit vielen Jahren zu verwirklichen, aber die Umstände gaben ihnen nie die Chance, dies zu erreichen. Und Sie werden sehen, dass es nicht bedeutet, nur einen Film darüber zu machen, dass alles so funktioniert, wie es sollte. CH 2014
