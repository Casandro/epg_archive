  title: Mit Mut und Motorsäge - Baumkletterer im Extrem-Einsatz
  subtitle: Mit Mut und Motorsäge - Baumkletterer im Extrem-Einsatz
  description: Tagtäglich trotzen österreichische Forstarbeiter voller Leidenschaft den Naturgewalten, um unter schwersten Bedingungen unsere Wälder zu pflegen. Der Wald ist ihr Zuhause, ihr Leben, ihr Schicksal. Tagtäglich trotzen österreichische Forstarbeiter voller Leidenschaft den Naturgewalten, um unter schwersten Bedingungen unsere Wälder zu pflegen. Der Wald ist ihr Zuhause, ihr Leben, ihr Schicksal.  AT 2016
