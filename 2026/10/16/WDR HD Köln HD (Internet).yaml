  title: Wer kann das bezahlen? (1)
  subtitle: Zahlen bitte! Alltag mit Aufpreis
  description: 'Es ist fast überall spürbar: In Deutschland steigen die Preise und damit auch unsere Lebenshaltungskosten. 2025 bekommen viele Haushalte außerdem weniger Netto vom Brutto im Vergleich zum Vorjahr. Anna Planken trifft Menschen in NRW und spricht mit ihnen über Geld. Mit denen, die mit wenig auskommen müssen, und denen, die Wohlstand genießen.'
