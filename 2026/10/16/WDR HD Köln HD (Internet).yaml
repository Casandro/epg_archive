  description: |-
    Während Edwin sich von seiner Operation erholt, führt ein neuer Fall die Ermittler in die High Society der Kunstsammlerszene.
    Günters Enkelin Lotta hat eigene Kunst-Probleme. Sonst eine Einserschülerin stößt sie schulisch zum ersten Mal an ihre Grenzen und das ausgerechnet im Kunstunterricht.
    Für Polizeichefin Vicky ergeben sich neue Karrierechancen, die wesentlich familienfreundlicher wären. Doch ob Vicky bereit dazu ist, die Verbrecherjagd dafür an den Nagel zu hängen, ist eine andere Frage.
