  title: Wer weiß denn sowas?
  subtitle: 'Moderation: Kai Pflaume'
  description: Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
- eventId: 833648
  start: 2026-10-16T08:25:00Z
  stop: 2026-10-16T09:10:00Z
  title: Mittendrin - Flughafen Frankfurt (82)
  subtitle: Das große Krabbeln - Insektenalarm beim Zoll
  description: "Einsatz für den Zoll und Pflanzenschutz: Im Gepäck von Fluggästen verstecken sich verbotene Obst- und Gemüsesorten mit Pflanzenschädlingen und Krankheiten. Fluggäste, die erwischt werden, müssen eine Strafe zahlen. \nEr schleppt Privatjets: Christopher Reifschneider steuert den kleinsten Pushbacktruck am größten Flughafen Deutschlands. Er trifft Promis, seine Hauptkundschaft sind Millionäre mit ihren Luxusmaschinen. \nJulien Backhaus reist regelmäßig im Privatjet: Der Unternehmer liebt Luxus und Unabhängigkeit. Wir dürfen den Geschäftsmann auf einem seiner Flüge nach Frankfurt begleiten."
- eventId: 834035
  start: 2026-10-16T09:10:00Z
  stop: 2026-10-16T09:55:00Z
  title: Expedition in die Heimat
  subtitle: Genusstour durch den Schwarzwald
  description: Kaum eine Region bietet mehr kulinarischen Hochgenuss und Naturidylle als der Nordschwarzwald. Der Ort Baiersbronn wurde von der New York Times zur "ungewöhnlichsten Gourmethauptstadt der Welt" gekürt. Nirgends ist die Michelin-Sterne-Dichte höher. SWR_Moderatorin Annette Krause stellt berühmte Feinschmeckertempel vor und kleine, gemütliche Örtlichkeiten für Urlauber:innen und Genussmenschen.
- eventId: 834474
  start: 2026-10-16T09:55:00Z
  stop: 2026-10-16T10:45:00Z
  title: Elefant, Tiger & Co. (433)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: Die Schimpansen genießen das gute Wetter. Bis die innere Uhr ihnen verrät, dass die Essenszeit naht und das Bett ruft. Viel zu früh versammelt sich die ganze Affengesellschaft vor dem Schieber und wartet darauf, wieder reingelassen zu werden. Unter großem Geschrei fallen sie über ihr Abendbrot her. Doch keine halbe Stunde später sind sie im Reich der Träume. Affen sind eben auch Gewohnheitstiere.
