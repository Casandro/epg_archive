  title: Rentnercops (53)
  subtitle: Aus Liebe
  description: "Eine ältere Dame hat mit Vollgas einen Mitte 60-jährigen Mann überfahren. Der Unfall scheint definitiv kein Versehen gewesen zu sein und die Dame gesteht recht schnell, dass sie den Mann in der Tat aus Rache überfahren hat, da er sie um eine Menge Geld erleichtert habe - handelt es sich um einen Heiratsschwindler? Damit ist der Fall für die Rentnercops abgeschlossen. \nAls Günter jedoch seiner Gattin Heidrun davon erzählt, beschließt diese kurzerhand, dem Fall zusammen mit Günters Kollegin Hannah weiter auf den Grund zu gehen. Davon weiß Günter natürlich nichts."
