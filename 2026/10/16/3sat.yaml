  title: Eine Frage des Gewissens
  subtitle: Film von Susanne Böhm
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Viele Menschen überdenken gerade ihre Einstellung zur Aufrüstung und Wehrpflicht. Frieden schaffen ohne Waffen? Oder ist der Einsatz von Gewalt als Ultima Ratio gerade heute sogar geboten?

    Und wo beginnt die Verantwortung des Einzelnen? Die Reportage begleitet vier Menschen, die auf diese Fragen ganz unterschiedliche Antworten gefunden haben - und zeigt, wie sehr persönliche Biografien, Zweifel und Erfahrungen die Haltung zu Krieg und Frieden prägen.
    HD-Produktion
