  title: 'Die Nordreportage: Der Türsteher und die Türsteherin'
  subtitle: Zwischen Feiern und Gefahr
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schützenfest Hannover: Gabriel ist Türsteher und entscheidet, wer ins Festzelt darf und wer nicht. Ein angetrunkener Gast kann die Abweisung nicht akzeptieren. Er taucht immer wieder auf.

    Holger Kossack ist Gabriels Chef. Er leitet eine Sicherheitsfirma in Hannover und sorgt mit seinem Team in zwei Festzelten für Sicherheit. Plötzlich ein Notfall: Die Mitarbeitenden müssen alles absperren, damit Krankenwagen und Sanitäter schnell zum Patienten kommen.
    HD-Produktion
- eventId:
  - 1223691
  - 1225743
  start: 2026-10-16T00:30:00Z
  stop: 2026-10-16T01:15:00Z
  title: 'Legendäre Zugabenteuer: Der Schweizer "Glacier Express"'
  subtitle: Film von Claudio Planta
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Schweiz 2024
    Der "Glacier Express" verkehrt zwischen St. Moritz und Zermatt. Spektakuläre Aufnahmen der Hochgebirgsstrecke wechseln sich ab mit Einblicken in die Technik dieser Schmalspurbahn.

    Der "Glacier Express" überwindet große Höhendifferenzen, streckenweise mit Zahnradbetrieb. Während die Reisenden die spektakuläre Strecke genießen, sorgt ein Team im Hintergrund für ihre sichere und reibungslose Fahrt.
    HD-Produktion
- eventId:
  - 1223692
  - 1225744
  start: 2026-10-16T01:15:00Z
  stop: 2026-10-16T01:55:00Z
  title: 'Legendäre Zugabenteuer: Kanadas "VIA Rail"'
  subtitle: Film von David McIlvride
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2024
    Die Strecke von Winnipeg nach Churchill ist eine lebenswichtige Verbindung zu den abgelegenen Gemeinden im hohen Norden Kanadas. Doch Schnee und Eis sind eine ständige Herausforderung.

    Mit einem Zug der "VIA Rail" geht es durch karge Schneelandschaften, Nadelwald und über zugefrorene Seen auf die zweitägige Reise bis zum nördlichen Polarkreis. Unermüdliche Wartungscrews sorgen mit teils ungewöhnlichen Mitteln für eine stets befahrbare Strecke.
    HD-Produktion
- eventId:
  - 1223693
  - 1225745
  start: 2026-10-16T01:55:00Z
  stop: 2026-10-16T02:40:00Z
  title: 'Legendäre Zugabenteuer: Mexikos "Copper Canyon Railway"'
  subtitle: Film von Martin O'Toole
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Mexiko 2024
    Im mexikanischen Chihuahua verbindet eine einzigartige Bahnstrecke die Berge mit dem Meer: "El Chepe" überwindet auf seiner Fahrt entlang wilder Schluchten über 2400 Meter an Höhendifferenz.

    Der "Ferrocarril Chihuahua al Pacífico", kurz "Chepe", wurde einst für den Güterverkehr gebaut, um Kupfer und Getreide aus den Bergen an die Küste zu bringen. Heute verkehren dort bequeme Personenzüge, die bei Einheimischen und Touristen gleichermaßen beliebt sind.
    HD-Produktion
- eventId:
  - 1223694
  - 1225746
  start: 2026-10-16T02:40:00Z
  stop: 2026-10-16T03:25:00Z
  title: 'Legendäre Zugabenteuer: Indiens "Darjeeling'
  subtitle: Himalayan Railway" - Film von Sajeed Aziz
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Indien 2024
    Im Nordosten Indiens machen sich eine Dampf- und eine Diesellokomotive der "Darjeeling Himalayan Railway" auf atemberaubende Reise. Besonders der bergige Teil der Strecke ist aufregend.

    Während die Dampflokomotive von Darjeeling aus mit zwei Personenwagen mehrmals am Tag eine kurze Fahrt nach Ghum unternimmt, muss die Diesellok auf ihrer siebenstündigen Reise 2000 Höhenmeter überwinden. Das geht nur dank eines ausgeklügelten Streckendesigns.
    HD-Produktion
- eventId:
  - 1223699
  - 1225747
  start: 2026-10-16T03:25:00Z
  stop: 2026-10-16T04:20:00Z
  title: Armenien - Die Rückkehr des Leoparden
  subtitle: Film von Petra Dorrmann
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Arus Nersisian leitet das 3000 Hektar große Arpa-Naturschutzgebiet im Südwesten Armeniens, direkt an der Grenze zur Exklave Nachitschewan. Typisch für das Gebiet sind seine rostroten Felsen.

    Wilderer hatten die Artenvielfalt in der Region stark dezimiert. Doch nun feiert Arus mit ihrem Team endlich Erfolge: Die Bezoarziegen haben sich deutlich vermehrt, einige Braunbären bevölkern das Gebiet, und selbst der Persische Leopard ist zurück.
    HD-Produktion
