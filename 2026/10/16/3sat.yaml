  title: Zwischen Fels und Fluss - Das Lafnitztal
  subtitle: Film von Alfred Ninaus
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Schön, mythisch, geheimnisvoll - wie ein Relikt aus längst vergangenen Tagen. Labonca, "die Weißglänzende", wird ehrfürchtig jener Fluss auf altslawisch genannt: die Lafnitz.

    Von den rauen Höhen des Steirischen Jogllands bis zu den Auen im Süden des Burgenlands fließt die Lafnitz durch Landschaften, die zugleich lebendig und zeitlos wirken. Wer diesem Fluss folgt, entdeckt ein verborgenes Stück Mitteleuropa - still und voller Geheimnisse.
    HD-Produktion
