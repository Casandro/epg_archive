  title: Zwischen Fels und Fluss - Das Steyrtal
  subtitle: Film von Alfred Ninaus
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Dort, wo das Tote Gebirge schroff in den Himmel ragt und tosendes Wasser auf alpine Stille trifft, beginnt das Steyrtal - eine der eindrucksvollsten Naturlandschaften Oberösterreichs.

    Die Steyr ist Kraftquelle, Naturwunder und das Herz einer Region - kristallklar, ungestüm und voller Geschichten. Als Transportweg, Arbeitsstätte und Lebensraum war sie einst unverzichtbar. Heute ist der Fluss ein Paradies für Erholungssuchende und Wassersportler.
    HD-Produktion
