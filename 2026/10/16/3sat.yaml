  title: Zwischen Fels und Fluss - Das Stubaital
  subtitle: Film von Fritz Aigner
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Alpine Natur, gelebte Tradition und Menschen mit Leidenschaft: Das Stubaital vereint auf einer Länge von 35 Kilometern - umrahmt von Dreitausendern - all das, was Tirol ausmacht.

    Im Winter wie im Sommer ist das Leben der Menschen im Stubaital geprägt vom Bergtourismus. Ihre Heimat zum Erlebnis für Gäste zu machen, ist für viele mehr als nur ein Beruf - ob für den Ski- und Bergführer, den Almgastronomen oder für die Gleitschirm-Fluglehrerin.
