  title: Izvor
  subtitle: 'Obren i Dragan se sukobljavaju oko izbora kuma: Obren je za starog kuma Erića, dok Dragan želi Žareta. Na mladinoj strani takvih dilema nema - Una se odlučila za svoju drugaricu Lidiju.'
  description: 'Obren i Dragan se sukobljavaju oko izbora kuma: Obren je za starog kuma Erića, dok Dragan želi Žareta. Na mladinoj strani takvih dilema nema - Una se odlučila za svoju drugaricu Lidiju. Iako Goranu njen izbor ne odgovara, u njega se ne meša jer je suviše zauzet svojim planovima povezanim sa Ramaćom. Lola je protiv svega toga: i Bioraca, i kumova, i Ramaće, i Gorana, a najviše je protiv Uninog braka kome će se suprotstaviti kako zna i ume.'
