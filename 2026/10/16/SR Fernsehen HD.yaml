  description: 'Janik und Samuel sind beste Freunde und machen gerade Abi. Während sich Janik an seinen liberalen Vorzeige-Eltern abarbeitet, kommt Samuel aus zerrütteten Verhältnissen und hütet seine alkoholkranke Mutter wie ein Geheimnis. Janik sehnt sich nach Chaos, Samuel nach Ordnung. In ihrer gemeinsamen Gartenlaube schmieden die Jungs Zukunftspläne: Nach dem Abi wollen sie einen Roadtrip nach Istanbul machen, wo Samuels unbekannter Vater leben soll. Doch als Janik etwas macht, das Samuel für unverzeihlich hält, scheint alles, was die beiden zuvor verbunden hat, schlagartig in Frage gestellt.'
