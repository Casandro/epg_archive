  audiodesc: true
  description: 'Moderator Hugo Egon Balder aus Hamburg möchte wissen: "Was bedeutet verwarzt?" - "Hat es mit Lederjacken zu tun?" - "Richtige Antwort, Hella von Sinnen: 500 Euro!" ... Ach ne, das ist ja gar nicht "Genial Daneben!". In dieser Folge wird Salz auf Burger und die offenen Wunden des Humors in Deutschland gestreut. Außerdem verrät Hugo Egon Balder das perfekte Lebensalter, das merkwürdigerweise genau mit dem Zeitpunkt korreliert, an dem er schwimmen gelernt hat.'
