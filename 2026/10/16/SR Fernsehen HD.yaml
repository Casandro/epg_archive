  subtitle: Die Dudes drehen am Rad
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ei Dude, wie? Danke, sehr gut sogar! Denn SWR Moderator Pierre M. Krause ist in der neuen SWR "Kurzstrecke" in Köln mit den "Dudes", dem bekannten Entertainer- und Podcaster-Duo Niklas van Lipzig und David Martin unterwegs. Das soll nicht unter den Teppich gekehrt werden, denn den muss Niklas dringend zur Reinigung bringen. Flor- statt Fallhöhe lautet hier das Motto. Im Anschluss muss David noch schnell ins Fahrradfachgeschäft und gemeinsam mit den anderen so enge Sachen anprobieren, dass für Trinkgelder gar kein Platz mehr bleibt.
