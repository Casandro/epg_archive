  description: Hiker Jakub "Kuboj" Šolc zjistil, že bavorskými Alpami nevede žádná souvislá dálková trasa. A tak si ji naplánoval. Proč se nemohl dočkat a proč ho Německo tak moc překvapilo? Jak zpracovává intenzivní zážitky z trailů? Poslechněte si ho v nové epizodě cestovatelského podcastu Casablanca s Pavlem Sladkým. (repríza)
