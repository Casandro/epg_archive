  subtitle: neues Schulkonzept ULI auch an Grundschule in Neuburg an der Donau
  description: ULI, das neue Schulkonzept des Schulwerks Augsburg, gibt es jetzt seit einem Jahr an der Bischof-Ulrich-Realschule in Augsburg. Zum neuen Schuljahr setzen auch weitere Schulen dieses Konzept des selbstorganisierten Lernens um. Wie zum Beispiel die St.-Franziskus-Grundschule in Neuburg an der Donau. Wir zeigen in dieser Folge, wie ULI hier an der Grundschule funktioniert, wie das Fazit nach dem ersten Jahr ULI ausfällt und was in der Zukunft geplant ist.
