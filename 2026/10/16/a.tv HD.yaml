  title: Zeit zu Reden
  subtitle: 'Ehrenamtlich im Einsatz für Brustkrebs-Patientinnen: Michaela Hansmann'
  description: 'Der Oktober ist Brustkrebsmonat. Er macht auf die Situation von Erkrankten aufmerksam; weltweit rücken Prävention, Früherkennung und Erforschung von Brustkrebs in den Fokus. Wir sprechen mit einer Frau, die sich ehrenamtlich engagiert: Seit über 20 Jahren unterstützt die Friedbergerin Michaela Hansmann an Brustkrebs erkrankte Frauen. Sie bietet in Zusammenarbeit mit DKMS LIFE Online-Seminare an, in denen sie mit den Frauen über Wohlbefinden, Schminktechniken und hilfreiche Tools wie Magnet-Wimpern spricht. Außerdem werden diese Seminare zu Orten des Austauschs, an dem die Frauen sich Tipps geben, wie sie beispielsweise ihren Kindern den Verlust der Haare und Wimpern erklären. Bei jedem Seminar lernt auch Michaela Hansmann dazu und erzählt im Gespräch mit Angie Stifter, warum sie diesen ehrenamtlichen Einsatz so liebt.'
