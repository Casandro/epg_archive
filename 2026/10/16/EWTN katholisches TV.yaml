  title: Kirche in Not - Spirit
  subtitle: Wie Carlo Acutis die Herzen für den Glauben öffnet
  description: |-
    Mit Pfarrer Tobias Brantl, geistlicher Berater des Vereins "Freunde von Carlo Acutis"

    "Die Kirche lebt - und sie ist jung." Dieses Wort von Papst Benedikt XVI. scheint im Leben des heiligen Carlo Acutis Wirklichkeit geworden zu sein.
    Der italienische Teenager verband Glauben, Alltag und digitale Welt auf eine Weise, die bis heute Menschen berührt, weit über kirchliche Grenzen hinaus.
    Was macht Carlo Acutis zu einem Hoffnungsträger in Zeiten kirchlicher Krisen? Und warum spricht sein Zeugnis gerade junge Menschen an?
    Darüber spricht Volker Niggewöhner mit Pfarrer Tobias Brantl.
