  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Der Ernstfall des ewigen Lebens - Vom fünften Geheimnis des glorreichen Rosenkranzes
  description: Mit dem Geheimnis der Krönung Mariens verlässt der Rosenkranz das Heilige Land, wo wir nur die Orte der Entschlafung Mariens und ihrer Grablegung vorfinden. Denn in diesem Rosenkranzgeheimnis wird vom Himmel selbst erzählt, wie durch die Krönung Mariens im Himmel die ganze Menschheit zur Augenhöhe Gottes berufen wird. Paul Badde geht den Spuren der Verehrung der Muttergottes als Königin nach, die im mittelalterlichen Apsis-Mosaik der Basilika Santa Maria in Trastevere in Rom einen ganz besonderen Ausdruck findet.
  widescreen: true
- eventId: 1600496
  start: 2026-10-16T02:00:00Z
  stop: 2026-10-16T02:30:00Z
  title: Maria - Zwischen Himmel und Erde
  subtitle: Einführung in das marianische Thema
  description: 'In der 1. Episode führt Robert Rauhut im Gespräch mit Prof. Dieter Hattrup in das Marianische Thema ein. Es gibt vier marianische Dogmen: Gottesgebärerin und Jungfrau in der Antike, Unbefleckte Empfängnis und Aufnahme in den Himmel in der Neuzeit. Ein fünftes wäre die Miterlöserschaft, es könnte in der Nachneuzeit kommen. Das Alte Testament kennt wohl nur eine junge Frau, die eine neue menschliche Dynastie begründet. Erst das Evangelium kennt die Jungfrau, die einen Dynastiewechsel bringt von Mensch zu Gott.'
  widescreen: true
