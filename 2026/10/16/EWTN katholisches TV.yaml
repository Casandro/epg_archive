  title: Alle sollen eins sein - 6. Staffel
  subtitle: Drei Päpste im Leben von Pater Federico Lombardi SJ - Teil 2
  description: Drei Pontifikate, drei Persönlichkeiten - und ein Mann im Zentrum der vatikanischen Kommunikation. Im Gespräch mit Moderator Nick Gorjachkin blickt Jesuitenpater Federico Lombardi auf seine Jahre als Pressesprecher von Johannes Paul II., Benedikt XVI. und Franziskus zurück. Als langjähriger Generaldirektor von Radio Vatikan erlebte er Kirchengeschichte aus nächster Nähe. Er spricht über prägende Begegnungen und beschreibt die geistliche Prägung und menschlichen Züge der drei Päpste - aus der Perspektive eines Priesters , der ihnen in verantwortlicher Position diente.
