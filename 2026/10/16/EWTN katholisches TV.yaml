  title: Katholizismus
  subtitle: Das Geheimnis der Liturgie und die Eucharistie
  description: Die Eucharistie ist 'Quelle und Höhepunkt des christlichen Glaubens' und verkörpert die Identität und Mission der Kirche. Bischof Barron geht dem Gedanken nach, dass 'die Liturgie der höchsten Akt, durch den wir mit Gott kommunizieren.' Die Messe ist die zentrale Handlung der Kirche, um Gott das 'rechte Lob' zu bringen.
  widescreen: true
- eventId: 1600495
