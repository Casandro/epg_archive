  title: 'Detektyw Candice: Niezawodny instynkt 4 (odc. 2)'
  subtitle: Candice zostaje wezwana do złożenia zeznań w trakcie rozprawy w sprawie śledztwa, które doprowadziło do zatrzymania seryjnego gwałciciela.
