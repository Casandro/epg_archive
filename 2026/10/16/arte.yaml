  title: 'Re: Solo-Mama! Kein Partner, kein Problem?'
  subtitle: Deutschland 2026
  subtitled: true
  description: Der Pegel der Donau steht im August 2026 auf historischem Tiefstand - und bringt Ungarns einziges Atomkraftwerk an den Rand des Stillstands. Das AKW Paks braucht das Flusswasser zur Kühlung. Sinkt der Pegel weiter, muss das Kraftwerk abgeschaltet werden. Der Bau einer gewaltigen Sohlschwelle soll das verhindern. Ein Wettlauf gegen die Zeit - und gegen den Klimawandel.
- eventId: 1224536
