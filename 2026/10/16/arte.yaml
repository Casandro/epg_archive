  title: 360° Reportage
  subtitle: Kukeri, die Geisterjäger von Bulgarien
  subtitled: true
  description: '"Kukeri" heißt das heidnische Ritual, das Bulgaren im Winter zelebrieren. Es soll böse Geister vertreiben und Glück beschwören. Jahrhundertelange Fremdherrschaften hat Kukeri überlebt und ist tief in der bulgarischen Seele verankert geblieben. Und in letzter Zeit erlebt Kukeri sogar eine Renaissance. Auch immer mehr Frauen zieht das ursprünglich männerdominierte Ritual an.'
