  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Cranberry
  subtitled: true
  description: 'Was einst Seefahrer vor Skorbut bewahrte, ist heute ein geschätztes Superfood: Cranberries verbinden jahrhundertealte Heilkunde mit zeitgenössischer Kulinarik. Lucie Fischer-Chapalain entdeckt das kulinarische Potenzial der Beere: Sie komponiert proteinreiche Energieriegel, pikante Cranberry-Mole für Tortilla Chips und würzige Cranberry Crackers.'
