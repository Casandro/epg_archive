  description: |-
    Kommissarin Michèle Varin wird seit dem Tod ihres Sohnes von Alpträumen verfolgt. Gleichzeitig muss sie den Suizid einer psychisch kranken Frau untersuchen. Als ihr Kollege sich während der Ermittlungen erschießt, verschwimmen Realität und Wahn für Varin völlig.

