  title: Vietnams geheimnisvoller Norden
  subtitle: Österreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Vietnam ist eines der artenreichsten Länder der Erde, doch viele Tiere sind weitgehend unbekannt. Der Doku-Zweiteiler zeichnet ein faszinierendes Bild dieses südostasiatischen Landes mit einzigartigen Aufnahmen vom scheuen Fleckenroller oder der vom Aussterben bedrohten Krokodilschwanzechse. Ein besonderes Augenmerk liegt auf dem Schuppentier. Das Pangolin ist das meistgewilderte Tier der Welt. Welche Abenteuer es erlebt, was ein Fleckenroller mit Kaffee zu tun hat und warum Cat-Ba-Languren nur auf einer einzigen Insel leben, zeigt diese neue Dokumentation über die Bergwälder Vietnams.
