- eventId: 1011406
  start: 2026-10-16T13:45:00Z
  stop: 2026-10-16T14:20:00Z
  title: 360° Reportage
  subtitle: 'Vietnam: Brücken bauen für bedrohte Affen'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Rotschenkligen Kleideraffen gelten als die schönsten Primaten der Welt. Doch Wilderei und illegaler Tierhandel haben fast zu ihrer Ausrottung geführt. Nur wenige Tiere konnten in Vietnam überleben. Engagierte Tierschutzaktivisten versuchen nun zu retten, was noch zu retten ist. Vor allem Kletterbrücken, die ein Wechseln in etwas entferntere Waldparzellen gefahrlos ermöglichen, benötigen die wilden Kleideraffen im Dschungel, um ungestört ihre Nahrungsgebiete aufsuchen zu können.
- eventId: 1011407
  start: 2026-10-16T14:20:00Z
  stop: 2026-10-16T15:05:00Z
  title: Vietnams geheimnisvoller Norden
  subtitle: Österreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Vietnam ist eines der artenreichsten Länder der Erde, doch viele Tiere sind weitgehend unbekannt. Der Doku-Zweiteiler zeichnet ein faszinierendes Bild dieses südostasiatischen Landes mit einzigartigen Aufnahmen vom scheuen Fleckenroller oder der vom Aussterben bedrohten Krokodilschwanzechse. Ein besonderes Augenmerk liegt auf dem Schuppentier. Das Pangolin ist das meistgewilderte Tier der Welt. Welche Abenteuer es erlebt, was ein Fleckenroller mit Kaffee zu tun hat und warum Cat-Ba-Languren nur auf einer einzigen Insel leben, zeigt diese neue Dokumentation über die Bergwälder Vietnams.
- eventId: 1011477
  start: 2026-10-16T15:05:00Z
  stop: 2026-10-16T15:50:00Z
  title: Vietnams tropischer Süden (2/2)
  subtitle: Österreich/Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im Vietnamkrieg wurde ein Großteil der Natur im Süden zerstört, doch Pflanzen und Tiere haben sich ihr Reich zurückerobert. Nahe der Millionenmetropole Ho-Chi-Minh-Stadt liegt ein kleines Paradies. Mitten im Kulturland liegt im Nationalpark Cat Tien der letzte intakte Flachlandregenwald Vietnams. Hier fand das Filmteam eine der letzten Familien der Südlichen Gelbwangengibbons im Land. Einst eine endlose Wasserwildnis, gibt es im Mekongdelta kaum noch natürliche Gebiete. Hier trifft das Filmteam auf Zwergotter, die im Wald unerwartete Beute jagen, und Siamkrokodile, die als ausgestorben galten.
- eventId: 1011478
  start: 2026-10-16T15:50:00Z
  stop: 2026-10-16T16:35:00Z
  title: Insekten - Die Meister der Anpassung
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Vor über 400 Millionen Jahren begann der Siegeszug der Insekten, und seitdem haben die Krabbeltiere mit ihren sechs Beine und meist vier Flügeln so gut wie jeden Lebensraum unseres Planeten erobert. Ein Musterbeispiel dafür, wie die Evolution aus einem einfachen Bauplan unzählige Varianten entstehen lässt - mit zum Teil unglaublichen Fähigkeiten. \nVon der Stärke der Nashornkäfer bis zur außergewöhnlichen Flugkunst der Hummeln, von der ausgefeilten Tanzsprache der Bienen bis zur beeindruckenden Tarnung winziger Grillen in räuberischen Ameisenkolonien - Insekten sind wahre Wunder der Natur."
- eventId: 1011479
  start: 2026-10-16T16:35:00Z
  stop: 2026-10-16T17:20:00Z
  title: Mikroben - Die wahren Herrscher der Erde
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Lange haben wir Bakterien und andere Mikroorganismen ausschließlich als Bedrohung angesehen - und zweifellos zählen viele von ihnen als Krankheitserreger zu unseren tödlichsten Feinden. Doch inzwischen hat uns die moderne Mikrobiom-Forschung auch die andere Seite der Bakterien gezeigt: Ohne die milliardenfachen Helfer aus dem Reich der Mikroben könnte die Menschheit nicht überleben. Fazit: Es gibt eben solche und solche. Und die einmalige Fähigkeit zum direkten Genaustausch mit Artgenossen und anderen Organismen macht Mikroben zu wahren Masterminds der Evolution - auch der von Pflanzen und Tieren.'
