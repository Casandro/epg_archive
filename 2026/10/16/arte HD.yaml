  title: 'Re: Urlaub am Polarkreis - Norwegens Lofoten am Limit'
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    15 Grad statt Hitzewelle: Die Lofoten in Nordnorwegen werden zum Reiseziel von immer mehr Urlaubern, denen der Süden Europas mittlerweile zu heiß ist. Doch der Ansturm der Touristen bringt Natur und Einwohner an ihre Grenzen.

    Wie viel Andrang verträgt die empfindliche Natur und wer entscheidet, wann es zu viel ist? Das ist eine Frage, die auch die Gemüter der Bevölkerung der Lofoten erhitzt. Ranger Peter Andresen vom Lofoten Friluftsråd versucht zwischen Naturschutz, Tourismuswirtschaft und Einheimischen zu vermitteln.
