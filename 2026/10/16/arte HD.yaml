  title: 'Tina Turner: One Last Time'
  subtitle: Live at Wembley Stadium, 2000
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    _One Last Time_ ist ein mitreißendes Konzert, das Tina Turner auf dem Höhepunkt ihrer Karriere zeigt. Aufgezeichnet im Juli 2000 im Wembley-Stadion während ihrer _Twenty Four Seven_-Tour, präsentiert sie ihre Songs aus vier Jahrzehnten - von _River Deep, Mountain High_ bis _What's Love Got to Do with It_.
    Regie führte David Mallet, 18 Kameras fingen die spektakuläre Energie und die Emotionen dieser einzigartigen Performance ein. Tina Turner verstarb im vergangenen Jahr am 24. Mai 2023.
