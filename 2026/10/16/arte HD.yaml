  description: 'Als am 24. Mai 2023 die Nachricht von Tina Turners Tod durch die Medien geht, steht die Welt gefühlt für einen Moment still. Bereits zu Lebzeiten zur unsterblichen Legende geadelt, macht erst ihr Ableben so richtig deutlich: Kaum ein Weltstar hat eine so tiefgreifende Spur in den Herzen der Menschen und in der Musikgeschichte hinterlassen. Die Dokumentation spürt dem Einfluss einer Ausnahmekünstlerin nach und folgt den Pfaden, die sie einer neuen Generation von Black Artists geebnet hat.'
