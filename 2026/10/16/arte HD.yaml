  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Schon immer wollten Menschen nicht nur den Horizont erreichen, sie wollten auch darüber hinaus. Dabei ging und geht es nicht nur um das Entdecken um des Entdeckens willen. Exotische Güter, Reichtum, Macht waren Triebfedern dieser Menschen. Das Dampfschiff brachte endgültig den Durchbruch für weltweite Mobilität und weltweiten Handel. Gestern wie heute ist die Schifffahrt der Motor der Globalisierung.
