  title: 'Steel Buddies: Flug über den Atlantik'
  description: |-
    Ein tollkühner Mann in seiner fliegenden Kiste: Jeder Pilot träumt davon, einmal in der eigenen Maschine den Atlantik zu überqueren. Doch nicht alle haben die Courage, solche Pläne auch in die Tat umzusetzen. Dazu braucht es Draufgänger wie Michael Manousakis. Der Ober-"Steel Buddy" hebt in diesem Special nicht mit irgendeinem Flugzeug in die Luft ab, sondern mit einer Antonov AN-2, dem größten einmotorigen Doppeldecker der Welt. Von Mendig in Rheinland-Pfalz geht es im 41 Jahre alten russischen Mehrzweckflieger über Schottland, Grönland und Kanada Richtung USA: ein unglaublicher Belastungstest für Mensch und Fluggerät. Auf solchen Touren werden Helden geboren. Den Chef von "Morlock Motors" erwartet ein unvergesslicher Abenteuer-Trip voller Höhen und Tiefen. Wird die Reise seines Lebens für Michael Manousakis zum Albtraum oder zum Triumph?
    DEU 2015
