  title: DAS! Rote Sofa
  subtitle: 'Gast: Jonas Hummels, Sportkommentator und ehemaliger Fußballspieler'
  description: Jonas Hummels spielt wie sein älterer Bruder Mats gerne Fußball, musste aber verletzungsbedingt vor zehn Jahren seine aktive Profilaufbahn beenden. Im Anschluss startete er eine zweite Karriere als Sportjournalist, beschäftigt sich auf diesem Feld vor allem mit investigativen Recherchen. Hier widmet er sich intensiv dem Kampf gegen sexualisierte Gewalt und Machtmissbrauch im Jugendsport. In seiner aktuellen Dokumentation "Tatort Jugendfußball" deckt er gravierende Missbrauchsfälle im Nachwuchsfußball auf und gibt den betroffenen Jugendlichen eine Stimme. Auf dem Roten Sofa wird Jonas Hummels Einblicke in seine Arbeit geben.
- eventId: 829168
  start: 2026-10-16T04:00:00Z
  stop: 2026-10-16T04:20:00Z
  title: Sesamstraße
  description: Auf ihrem abendlichen Heimweg begegnen Elin und Elmo einem Maulwurf, einer Eule und einem Fuchs, allesamt nachtaktive Tiere. In einem gemeinsamen Song "Wir sind die Tiere der Nacht" erklären die drei, dass auch sie in der "Sesamstraße" zu Hause sind. Da sie jedoch ausschließlich nachts unterwegs sind, werden sie von den anderen Bewohnern kaum wahrgenommen. Ernie imitiert Tierlaute, die Bert erraten muss, obwohl der eigentlich lieber sein Buch lesen würde.
  genre:
  - '16'
