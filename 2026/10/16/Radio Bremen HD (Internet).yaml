- eventId: 817055
  start: 2026-10-16T00:00:00Z
  stop: 2026-10-16T00:30:00Z
  title: 'Die Nordreportage: Warten auf ein neues Herz'
  subtitle: Der lange Weg zur Transplantation
  description: Im UKE liegen Patienten, die dringend auf ein neues Herz warten. Ein Transplantationskoordinator ist dafür zuständig, in acht europäischen Ländern ein passendes Organ zu finden. Ein weiterer Arzt hat Explantationsbereitschaft. Sobald ein Anruf eingeht, macht er sich auf den Weg, wohin auch immer. Die Anonymität des Spenders muss gewahrt werden. Das ist gesetzlich vorgeschrieben. Ein Rückschluss auf den Ort seines Todes und seine Herkunft darf nicht möglich sein. Das Spenderherz muss dann in einer Kühlbox so schnell wie möglich nach Hamburg transportiert werden.
- eventId: 818591
  start: 2026-10-16T00:30:00Z
  stop: 2026-10-16T00:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
