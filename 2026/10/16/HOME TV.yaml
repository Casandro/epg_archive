  title: 'Charlie Luxton: domy nad morzem 3 (odc. 3)'
  subtitle: Domy nad morzem to marzenie każdego. Niektórzy Brytyjczycy je spełnili i właśnie ich odwiedzi Charlie Luxton - brytyjski architekt i projektant. Odwiedza domy Brytyjczyków mieszkających nad morzem.
  description: |-
    Tytuł oryginalny: Charlie Luxton's Homes By the Sea
    GB, 2016
    Domy nad morzem to marzenie każdego. Niektórzy Brytyjczycy je spełnili i właśnie ich odwiedzi Charlie Luxton - znany brytyjski architekt i projektant. Odwiedza domy Brytyjczyków mieszkających nad morzem. W każdym odcinku odwiedza cztery posiadłości i stara się odpowiedzieć na pytanie, co czyni posiadłość nad morzem idealną.
  ageRating: 12
  genre:
  - '35'
- eventId: 1633837
  start: 2026-10-16T14:00:00Z
  stop: 2026-10-16T15:00:00Z
  title: 'Charlie Luxton: domy nad morzem 3 (odc. 4)'
  subtitle: Trzecia odsłona serii, w której Charlie Luxton pokazuje najciekawsze brytyjskie domy zbudowane nad morzem.
  description: |-
    Tytuł oryginalny: Charlie Luxton's Homes By the Sea
    GB, 2016
    Reżyseria: Darrell Brown
    Trzecia odsłona serii, w której Charlie Luxton pokazuje najciekawsze brytyjskie domy zbudowane nad morzem. Charlie Luxton po raz kolejny zabiera nas w podróż wzdłuż wybrzeży Wielkiej Brytanii. Można tu znaleźć bardzo atrakcyjne nieruchomości, zarówno historyczne, jak i nowoczesne. Aby się o tym przekonać, Charlie odwiedza Szkocję, Sussex, Anglesey, Devon, Suffolk i Merseyside.
  ageRating: 12
  genre:
  - '35'
