  title: Živě z Holic!
  description: Kdo má dlouhé uši a už tento pátek zamíří právě do Holic? Miroslav a Zdeněk? Ano. A také králíci. A k tomu i holubi a drůbež. Už po dvacáté se v Holicích koná Krajská výstava králíků, holubů a drůbeže Pardubického kraje. V pátek nás poslouchejte a v sobotu se přijeďte podívat! Moderují Miroslav Hruban a Zdeněk Novák.
