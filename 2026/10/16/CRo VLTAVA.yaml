  title: Vizitka
  description: 'Markéta Pilátová, spisovatelka. "Lidé si často pamatují hlavně to, co se nestalo. Došlo mi, že mi vlastně vyprávějí romány," říká spisovatelka Markéta Pilátová o letech, kdy působila jako novinářka a učitelka češtiny v Argentině a Brazílii. Dvanáct let strávených v Latinské Americe zásadně ovlivnilo její literární tvorbu - skutečné osudy a události v ní často proměňuje v beletrii metodou, které říká "live writing". Jak se z reálného příběhu stává literatura a co všechno se při tom může změnit? A proč ji při psaní knihy Kouřové signály duše, která se zaměřuje na duševní zdraví dětí a dospívajících zajímaly především zdánlivě nenápadné situace z dětského světa, které ale mohou být pro někoho neúnosné? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
