  title: Tiere vor der Kamera - Die Kraniche der russischen Steppe
  subtitle: Tiere vor der Kamera - Die Kraniche der russischen Steppe
  description: 'Arendt und Schweiger dokumentieren den Wilden Osten in der Kalmückensteppe, südöstlich von Stalingrad. Der Jungfernkranich ist der Hauptdarsteller, dessen Lebensweise bisher wenig bekannt ist. Der Film zeigt einzigartige Aufnahmen von Balztanz, Brüten und Aufzucht der Jungen sowie von anderen Steppentieren. Ästhetischer Höhepunkt: balzende Jungfernkraniche im Federgras, eingebettet in die endlose Landschaft. Der Film vereint Ästhetik mit spannenden Tierbeobachtungen.'
  genre:
  - '129'
  widescreen: true
