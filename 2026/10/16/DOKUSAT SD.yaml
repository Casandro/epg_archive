  title: Hitler privat - Der Künstler
  subtitle: Hitler privat - Der Künstler
  description: Der Name Hitler steht als Synonym für Gewalt und Unmenschlichkeit, fanatischen Antisemitismus und pervertierten Nationalismus, für Krieg und Völkermord. Die Inkarnation des Bösen sei er gewesen, ein Monster der Geschichte, meinen viele Experten. Die Darstellung Hitlers als Mensch ist immer noch ein Tabu. Die Dokumentation bricht damit und versucht so die politischen Handlungen zu erklären.
  genre:
  - '129'
  widescreen: true
