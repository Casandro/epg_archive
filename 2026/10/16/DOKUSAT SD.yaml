  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Der Wettlauf nach Berlin'
  description: Der Wettlauf nach Berlin war ein entscheidender Schritt im Zweiten Weltkrieg. Nach der Landung in der Normandie im Juni 1944 kämpften die Alliierten erbittert, um die deutschen Verteidigungslinien zu durchbrechen. Im April 1945 begann der finale Angriff auf Berlin. Trotz des Widerstands der Wehrmacht erreichten die sowjetischen Truppen die Stadtgrenzen zuerst. Am 2. Mai 1945 kapitulierte Berlin, und der Weg zum Sieg im Wettlauf nach Berlin war geebnet.
  genre:
  - '129'
  widescreen: true
- eventId: 1637538
