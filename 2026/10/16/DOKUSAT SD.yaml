  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Okinawa'
  description: Die Schlacht um Okinawa im Frühjahr 1945 war eine der blutigsten des Pazifikkriegs. Die USA kämpften gegen die gut verteidigte japanische Garnison. Trotz heftigen Widerstands gelang es den Amerikanern, die Insel zu erobern. Die Schlacht markierte einen bedeutenden Wendepunkt, da sie den Alliierten einen strategischen Vorteil im Vormarsch auf das japanische Festland verschaffte und die Bereitschaft Japans zur Kapitulation zeigte.
  genre:
