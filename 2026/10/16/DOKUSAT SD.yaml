  title: Hitler privat - Der Soldat
  subtitle: Hitler privat - Der Soldat
  description: Das Persönliche spielte in Hitlers Leben nur eine untergeordnete Rolle. Manche Experten sind überzeugt, dass aber gerade die Erkundung der privaten Seite wichtige Aufschlüsse über die politischen Handlungen des Despoten geben können. Die Dokumentation wagt diesen Versuch. Führende Historiker geben eine Einschätzung.
