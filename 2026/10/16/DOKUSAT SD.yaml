  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Iwjima'
  description: Die Schlacht um Iwojima im Februar 1945 war ein entscheidender Wendepunkt im Pazifikkrieg. Die US-Marineinfanterie landete auf der kleinen Insel, um die japanischen Verteidiger zu bekämpfen. Trotz des extremen Geländes und des erbitterten Widerstands gelang es den Amerikanern, die Insel zu erobern. Die Einnahme von Iwojima stellte einen wichtigen strategischen Erfolg dar, da sie als Luftstützpunkt für die geplante Invasion Japans dienen sollte.
  genre:
  - '129'
  widescreen: true
- eventId: 1637537
