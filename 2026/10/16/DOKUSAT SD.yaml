  subtitle: Wildes Überleben - Tödliches Gift
  description: '"Tödliches Gift" - Die gefährlichsten Tiere unserer Erde sind oft ganz klein. Im Lauf der Evolution haben sie tödliche Waffen entwickelt, die sie zu gefährlichen Jägern und Gegnern machen. Um sich gegen weitaus mächtigere Feinde zu verteidigen oder erfolgreiche Jäger zu sein, nutzen sie Gift. Manche töten ihre Gegner sofort, andere lähmen ihre Opfer nur.  Auch Giftpflanzen nutzen diese Waffe zum Schutz oder zur Beutejagd. Und - es gibt Lebewesen, die immun sind gegen all diese Gifte.'
