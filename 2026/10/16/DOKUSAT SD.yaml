  title: Hitler privat - Der Kriegsherr
  subtitle: Hitler privat - Der Kriegsherr
  description: Wie war der Privatmensch Hitler? Heike Görtemaker hat die erste wissenschaftliche Biografie Eva Brauns geschrieben und analysiert das Privatleben des 'Führers'. In dieser Dokumentation gibt sie sowie eine Reihe anderer Wissenschaftler eine Einschätzung. Seltene und unveröffentlichte Dokumente, Fotos und Filmaufnahmen zeichnen ein Bild Adolf Hitlers jenseits der Propaganda, Aufnahmen von Schauplätzen illustrieren den Werdegang des Diktators.
