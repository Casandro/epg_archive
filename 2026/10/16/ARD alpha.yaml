- eventId: 1223490
  start: 2026-10-16T03:30:00Z
  stop: 2026-10-16T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Twilight Beauty
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 1223491
  start: 2026-10-16T04:00:00Z
  stop: 2026-10-16T04:30:00Z
  title: Hablamos Español (1/39)
  subtitle: Auf dem Flughafen
  description: Spanien ist für viele Deutsche eines der beliebtesten Urlaubsziele. Schon deshalb lohnt es sich, die Sprache zu erlernen. Aber nicht nur Touristen haben Vorteile, wenn sie Spanisch sprechen können, sondern auch Geschäftsreisende. Lernen Sie deshalb Carmen, Jose Luis und Paco kennen, die als Hauptpersonen dieses Sprachkurses neununddreißig Folgen lang Ihre Lehrer spielen werden.
- eventId: 1223492
  start: 2026-10-16T04:30:00Z
  stop: 2026-10-16T05:00:00Z
  title: TELEKOLLEG Französisch (16/39)
  subtitle: Bon Courage
  description: Der 39-teilige Französischkurs "Bon Courage" richtet sich an Anfänger oder dient zur Auffrischung von Sprachkenntnissen. Der Kurs bringt nicht nur die französische Sprache, sondern auch die Lebensart der Franzosen näher.
- eventId: 1223493
  start: 2026-10-16T05:00:00Z
  stop: 2026-10-16T05:15:00Z
  title: GRIPS Deutsch (17/36)
  subtitle: Praktikumsbericht
  subtitled: true
  description: 'Sicher machst du auch ein Praktikum und dann wird er verlangt: der Praktikumsbericht. Doch worauf muss man beim Verfassen achten? Was muss man erwähnen und was nicht? Wie fällt es dir leichter, ihn zu schreiben? Wir zeigen es dir!'
- eventId: 1223494
  start: 2026-10-16T05:15:00Z
  stop: 2026-10-16T05:30:00Z
  title: GRIPS Deutsch (18/36)
  subtitle: Berichten
  subtitled: true
  description: |-
    Sicher hast du schon oft etwas erlebt und willst anderen davon berichten. Doch worauf kommt es dabei an? Wie gelingt ein Praktikumsbericht, ein Bericht für die Schülerzeitung oder über dein Fußballspiel? Tipps findest du hier.

    Gerade Berichte benötigst du nicht nur für die Prüfung oder den Quali, sondern auch oft in der Lehre und Ausbildung. Wichtig dabei ist, dass du der Reihe nach erzählst. Aber am besten, du schaust dir unser Video an und gehst das Thema der Reihe nach an - das hilft auch hier!
- eventId: 1223495
  start: 2026-10-16T05:30:00Z
  stop: 2026-10-16T05:55:00Z
  title: Willi wills wissen
  subtitle: Wer ist reif für die Insel?
  subtitled: true
  description: "Wer ist reif für die Insel? Das will Willi heute auf der einzigen Hochseeinsel Deutschlands herausfinden: auf Helgoland. Nicht nur Willi besucht Helgoland - jedes Jahr kommen über eine halbe Million Touristen mit der Fähre auf die Insel. Weil die dicken Pötte nicht in den Hafen einlaufen können, müssen die Besucher ausgebootet werden. Von Börtebootkapitän Detlef. Und Willi! \nDas Alfred-Wegener-Institut ist eine Forschungsstation für Hummer. Dort lernt Willi ein Hummerweibchen näher kennen."
- eventId: 1223496
