  title: Der eisige Weg zum Extrembergsteiger
  subtitle: Deutschland 2024
  description: Klettern an riesigen Eiszapfen oder Übernachtungen in hohen Steilwänden - all das lernen junge Alpinist*innen im Expeditionskader des Deutschen Alpenvereins. Eine Ausbildung für angehende Extrembergsteiger*innen, die über gefrorene Wasserfälle in Südtirol, senkrechte Felswände im Tessin hin zu grimmigen Nordwänden in den italienischen Alpen führt.
