  title: Heidi und die Kraft der Berge
  genre:
  - '112'
  description: 'Ein Traum, der lange in Heidi Sand geschlummert hat, wurde in den dunkelsten Stunden ihrer Krebserkrankung konkret. Sie will auf den Mount Everest. Die Extrembergsteigerin bezwingt weitere zwei Achttausender. Nach einem Lawinenunglück, bei dem ihr Bruder stirbt, gibt Heidi ihren Sport auf. Nun eine neue Herausforderung: Einer der drei Viertausender der Alpen, die ihr noch fehlen, ist ihr Ziel.'
