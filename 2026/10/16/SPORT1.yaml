  description: Steffi und Markus sind seit Kurzem verheiratet. Zwecks Familienplanung und ihren Hobbys Tauchen und Wakeboarden wollen sich die beiden einen Kompakt-SUV zulegen. Die Klasse der kompakten SUVs boomt derart, dass mittlerweile fast jeder Hersteller ein solches Modell auf dem Markt hat. Platz, Komfort, hohes Sitzen - aber trotzdem cool. Wie überzeugend sind die etablierten Hersteller und was können die Lifestyle-Newcomer? Cyndie und Alex gehen das Thema gewohnt kompetent an. Ein kleines Augenzwinkern darf aber auch dieses Mal nicht fehlen...
