  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: "Podcast\nWild Wild Web - Geschichten aus dem Internet\nInside Palantir: ICE Cold (2/5)\nPalantir hilft der Trump-Regierung bei Massen-Festnahmen - mit einer App zum Migranten-Finden. Woher wir das wissen? Weil eine mutige Frau namens Juanita gegen ICE klagt. \nVon André Dér Hörmeyer, Benedikt Dietsch, Moritz Matzner und Max Sippenauer\nBR 2026\n\nTeil 3 am Freitag, 30. Oktober, 20.03 Uhr\n\nHörspiel\nBabylon Berlin\nHaus Vaterland (2/5): Spuren in Masuren\nDie rätselhafte Mordserie fordert ein weiteres Opfer. Während Gereon Rath in Masuren nach den Wurzeln des Falls sucht und dabei auf dunkle Geheimnisse aus der Vergangenheit stößt, ermittelt Charlotte Ritter weiter verdeckt im Haus Vaterland. Doch mit jeder neuen Erkenntnis wächst die Zahl der Verdächtigen.\n\nVon Volker Kutscher\nMit Ole Lagerpusch, Alice Dwyer, Peter Nottmeier, Fabian Busch, Denis Moschitto, Benito Bause, Sebastian Urzendowsky, Anna-Maria Arkona, Anna Böttcher, Magdalena Monatasser, Roman Knizka und anderen\nMusik: Verena Guido und das WDR Funkhausorchester\nBearbeitung: Thomas Böhm und Benjamin Quabeck\nRegie: Benjamin Quabeck\nWDR 2026\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
