  title: Free Rainer - Dein Fernseher lügt
  subtitle: Movie / Drama 2007, FSK 12
  description: '2007 ● FSK: 12 ● TMS Rating: ★★★☆☆ Der TV-Produzent Rainer wird für die stumpfsinnigen Shows, die er entwickelt, mit Preisen und Geld überhäuft. Trotz allem hat der Quotenkönig das hirnlose Programm, das er verantwortet, langsam satt. Doch erst als die junge Pegah mit Vollgas und Absicht frontal seinen Wagen rammt, erwacht er aus seiner Lethargie und erkennt, dass er für Einschaltquoten über Leichen gegangen ist. Er beginnt seinen eigenen Feldzug gegen die quotenbesessene Unterhaltungsindustrie. Movie / Drama 2007, Regie: Hans Weingartner,  Mit: Moritz Bleibtreu, Elsa Sophie Gambard, Milan Peschel, FSK 12'
