  title: Der arme Teufel und das Glück
  subtitle: Comedy 2017
  description: '2017 ● FSK: 0 Der Teufel Matej wurde aus der Hölle geworfen, und muss als Strafe nun außerdem die Wünsche von Ondra erfüllen, einem jungen Mann, der in Armut lebt. Matejs Aufgabe ist es, ihn ausnahmslos glücklich zu machen. Als Ondra sich in die junge Gräfin Rézinka verliebt, beginnen die Proben für Matej. Denn auch ein perfider Baron buhlt um die Hand der Gräfin, und Ondra verspricht schließlich, Rézinka ein prächtiges Schloss zu bauen - über Nacht. Comedy 2017, Regie: Karel Janák,  Mit: Zdenek Piskula, Kristína Svarinská, Hana Vagnerová'
