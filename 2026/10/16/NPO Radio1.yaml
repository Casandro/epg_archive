  title: Dit is de dag
  subtitle: Dit is de Dag is een stevig opiniërend programma van de EO met Tijs van den Brink. Op dinsdag en vrijdag hoor je Margje Fikse of Hans van der Steeg.
  description: Dit is de Dag is een stevig journalistiek, opiniërend en verdiepend radioprogramma van de EO. Hier hoor je iedere werkdag hét debat van de dag met zoveel mogelijk verschillende stemmen en perspectieven. Na de discussie van de dag interviewt Margje Fikse of Jan-Willem Wesselink een belangrijke of interessante nieuwsgast. Ook gaan we op zoek naar onderwerpen waar actualiteit raakt aan samenleving en geloof. Luisteraars worden aangemoedigd mee te doen via de NPO Luister-app, sociale media en het platform dit.eo.nl. Op vrijdag kunnen luisteraars fysiek vragen stellen tijdens het DIDD politiek café. (2026)
