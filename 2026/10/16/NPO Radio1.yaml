  title: Nooit Meer Slapen
  subtitle: Femke van der Laan ontvangt een inspirerende gast uit de kunst, cultuur of actualiteit, die vertelt over werk & leven. Nooit Meer Slapen is hét nachtelijke cultuurprogramma van de VPRO.
  description: Maike Meijer is actrice en scenarioschrijver. Ze studeerde af aan de Toneelacademie Maastricht en kreeg als veelbelovende studente de Henriëtte Hustinxprijs. Vervolgens speelde ze rollen bij onder meer Het Nationale Toneel en de Paardenkathedraal. Ze werd vooral bekend door de komedieserie 'Toren C', die ze samen met Margôt Ros bedacht en waarin ze verschillende typetjes speelde. Daarnaast had ze rollen in films als 'De jurk', "Kleine Teun" en 'De gelukkige huisvrouw'. Verder schreef ze verschillende toneelvoorstellingen, waaronder "Braak" en 'Bermudadriehoek'. In 2020 maakte ze haar romandebuut met 'Wen er maar aan', een tragikomedie over de overgang. Inmiddels is het boek verfilmd. In de verfilming speelt Meijer een actrice die haar vaste tv-rol verliest, omdat men haar te oud vindt. Ellen Deckwitz gaat met Maike Meijer in gesprek. (2026)
