  title: Stand van Nederland
  subtitle: Jill Bleiksloot onderzoekt de kwetsbaarheid van onze economie en ons welzijn voor ontwikkelingen rond handel, veiligheid en conflict. Hoe groot is de invloed van verandering in de wereld op ons leven?
  genre:
  - '34'
  description: 'Wat is de invloed van economische ontwikkelingen op ons huishouden, ons werk, onze portemonnee en onze manier van leven? En welke rol speelt het Haagse beleid daarin? Elke vrijdagavond neemt Sam Hagens met zijn studiogasten de stand van onze economie door. Ze bespreken het opvallendste nieuws. Eén economische kwestie komt uitgebreider aan bod, aan de hand van vragen van luisteraars. Ook krijgt de luisteraar een blik op de beurs in de vaste rubriek: De Aandeelhouder Wint. (2026)'
