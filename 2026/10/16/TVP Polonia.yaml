    Iwona i Konrad Kostrzewscy planują pierwsze własne dziecko, choć wychowują już dwie córeczki wcześnie owdowiałego Konrada. Iwona ma też dobry kontakt z dorosłym synem męża, Michałem, który ma za sobą trudną przeszłość nałogowca, ale z powodzeniem od lat pozostaje w trzeźwości. Jest bardzo oddany ojcu. Kiedy w rodzinie Kostrzewskich dochodzi do kolejnej tragedii, policjanci zaczynają zastanawiać się, czy taka czarna seria jest możliwa, czy jest częścią czyjegoś makabrycznego planu.
