    16-letni Olek Wichrowski to sportowa nadzieja Sandomierza ? o tego zdolnego sprintera stara się klub z warszawy, ale chłopak wiernie trenuje pod okiem lokalnego trenera, Marka Turskiego. Trener ingeruje w życie swojego wychowanka, kontroluje jego dietę i nawyki, ale wszystko dla jeszcze lepszych wyników. Kiedy serce Turskiego odmawia posłuszeństwa, a Olek musi przerwać treningi w kluczowym momencie, policja podejrzewa ingerencję osób trzecich.
