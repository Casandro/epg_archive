  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Chris und Joy verbringen Zeit mit Schulkameraden, die sich an keine Regeln halten und schwänzen dafür den Unterricht. Ein Grund für das Superbuch, Joy, Chris und Gizmo in eine Zeit zurückzuversetzen, in der viele schlechte Menschen lebten. Noah ist als Einziger Gott treu und kommt deshalb mit seiner Familie und vielen Tieren während der Sintflut in einer Arche unter. Joy, Chris und Roboter Gizmo sind mit an Bord und lernen, wie wichtig es ist, das Richtige zu tun.'
