  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Felsenkirche Temppeliaukio kirkko in Helsinki gehört zu den meist besuchten Sehenswürdigkeiten der finnischen Hauptstadt. Nach langen Diskussionen und Protesten innerhalb der evangelischen Kirche Finnlands wurde 1968 mit dem spektakulären Bau begonnen: Das Gotteshaus wurde in einen Granitfelsen gesprengt - und steht seitdem mitten in der Innenstadt. Temppeliaukio überzeugte mit der Zeit die Skeptiker. Die Atmosphäre der lichtdurchfluteten Felsenkirche lässt niemanden unberührt.'
