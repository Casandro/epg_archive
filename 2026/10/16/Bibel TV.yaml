  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Hip-Hop und Rap-Musik sind oft nicht die Musikrichtungen, die man mit Gott und Jesus verbindet. Die Texte im populären Hip-Hop lassen sich teilweise nur schwer mit dem christlichen Glauben vereinbaren. Doch Lobpreis geht mit jeder Art von Musik. Im Gespräch mit Moderatorin Bente Rathjen spricht Rapper Kevin Neumann über seinen Weg zum Glauben und darüber, wie er seine Beziehung zu Gott auch in seiner Musik verarbeitet.'
