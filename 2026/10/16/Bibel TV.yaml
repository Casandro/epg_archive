  title: The Mercy Ships
  subtitle: Nur Gott kann es tun
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Plötzlich geht der Alarm los: Captain O''Shea bringt das Feuerwehrteam in Stellung. Während die Crew auf ihren Einsatz vorbereitet ist, wartet an Bord gleichzeitig ein ganz besonderer Moment. Kinder einer Blindenschule sind eingeladen, ihren gemeinsam entstandenen Song für die Patienten zu präsentieren. Zwischen Anspannung und Freude wird deutlich, was die Mercy Ships ausmacht: Menschen mit ganz unterschiedlichen Geschichten kommen zusammen, um einander Mut zu machen und Hoffnung weiterzugeben.'
