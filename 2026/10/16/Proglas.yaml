  title: Jak se vám líbí
  subtitle: Koncert portugalského souboru Danças Ocultas ze studia Proglasu
  description: 'Autor: Hana Slívová * Portugalská skupina Danças Ocultas, která vznikla v roce 1989, staví svou hudbu na zvuku čtyř diatonických akordeonů. Jejich instrumentální tvorba je ovlivněna portugalskou hudební tradicí, ale zároveň zůstává otevřená současné hudbě, spolupráci s tanečníky i dalším žánrům. Skupina v pořadu Jak se vám líbí představí své poslední album Inspirar a bude hovořit také o téměř čtyřiceti letech společného muzicírování, významných milnících své kariéry a vztahu k portugalskému fadu. V rámci festivalu Maraton hudby Brno 2026 skupina zahrála přímo v našem Koncertním studiu a záznam pořadu vám nyní přinášíme. Moderuje Hana Slívová. [dansas okultaš] [inšpirar] '
  genre:
  - '96'
