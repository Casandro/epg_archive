  title: Před kostelem
  subtitle: Knířov slaví 800 let
  description: 'Autor: Josef Javůrek; Interpret: Josef Javůrek, Stanislav Tomšíček, Vladimír Černý, Soňa Krátká; Premiéra: 12.10.2026 * Josef Javůrek s mikrofonem navštívil svoji skororodnou vesničku Knířov, která slaví 800 let od první písemné zmínky. U této příležitosti místní osadní výbor pod vedením Jaromíra Holuba připravil výstavu fotografií a obrazů v místní faře a základní škole. Zájemci se na místě mohli začíst do podrobně zmapované historie obce a jejího okolí, nebo zakoupit pohlednice, vydané jen k této příležitosti. Odpoledne se v místním kostele zvěstování panny Marie konal varhanní koncert, jehož nahrávka v tomto pořadu zazní. Vrcholem celé akce byla přednáška Soňi Krátké z krajského technického Muzea ve Vysokém mýtě, kterou uslyšíte v plném rozsahu.'
