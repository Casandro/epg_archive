  title: Portréty
  description: Slavné únosy. V listopadu 1983 byli v Amsterdamu uneseni pivní magnát a šéf pivovaru Freddy Heineken i se svým řidičem. Za jejich vydání bylo zaplaceno rekordní výkupné kolem 15 milionů dolarů, vůbec nejvyšší výkupné, vyplacené kdy v Evropě. Ve speciálu Portrétů věnovaném slavným únosům tento příběh připomenou Jan Adamec a David Hertl.
- eventId: 792112
  start: 2026-10-16T01:33:00Z
  stop: 2026-10-16T02:00:00Z
  title: Klub 40
  description: Spisovatelka Michelle Losekoot (39) se na čtyřicítku těší. Přirovnává ji k začátku léta a velkých prázdnin - období, kdy už člověk nemusí tolik plnit očekávání druhých. Po dvaceti letech dospělosti má pocit, že konečně dokáže rozeznat, podle kterých pravidel chce žít a která může bez výčitek odložit. Svěřila se s tím Ivaně Veselkové v rozhovoru ze série Klub 40.
