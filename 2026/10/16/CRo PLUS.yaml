  title: Ranní Plus
  subtitle: Politika, společnost, byznys, věda. Moderují Šárka Fenyková a Martin Matějka.
  description: Soudcovská unie si dnes zvolí nové vedení. Po šesti letech končí její prezident Libor Vávra a o jeho místo se ucházejí soudce Nejvyššího správního soudu Tomáš Rychlý a předsedkyně Krajského soudu v Českých Budějovicích Martina Flanderová. V kohoutkové vodě v novojičínské nemocnice se objevilo olovo. Lidé si budou dnes a zítra ve 22 volebních obvodech vybírat své senátory. Čím je druhé kolo voleb do senátu jiné než to první a na co je třeba myslet? Saúdská Arábie čelí nejsilnějším úderům na svém území za posledních víc než deset let. Kvůli útokům jemenských povstalců Húsijů se ruší a odkládají lety do země. Přesouvají se taky dlouho očekávané mezinárodní akce, které měli do saúdskoarabských měst přilákat turisty. Tisíce hodin vzpomínek, stovky lidských příběhů. Nový AI asistent Paměti národa pomáhá snadno najít příběhy lidí, kteří zažili dějiny na vlastní kůži. V Bruselu druhým dnem pokračuje summit Evropské rady. Lídři států sedmadvacítky projednají situaci na Ukrajině a další pomoc napadené zemi. Schůzky se osobně zúčastní taky ukrajinský prezident Volodymyr Zelenskyj. Náročný film, důležité téma, skvělý herecký výkon hlavního protagonisty i stvrzení, že snímek není pro každého takové jsou první divácké reakce na včerejší premiéru nového celovečerního filmu Doznání Václava Marhoula. Pardubická radnice pořizuje pro městskou policii dvě elektroauta značky Tesla v prémiové výbavě. Knihovníci jako experti přes AI? Tak by se dal ve zkratce popsat nový projekt, který spouští Česká asociace umělé inteligence. Společně s Microsoftem a Národní knihovnou chce knihovníky proškolit, aby do budoucna mohli lidem pomáhat právě s nástroji AI. Proč? Letošní ročník Signal Festivalu, který už počtrnácté rozsvítil ulice Prahy. Moderují Šárka Fenyková a Martin Matějka.
