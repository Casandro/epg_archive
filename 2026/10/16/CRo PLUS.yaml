  title: Portréty
  description: Slavné únosy. V listopadu 1983 byli v Amsterdamu uneseni pivní magnát a šéf pivovaru Freddy Heineken i se svým řidičem. Za jejich vydání bylo zaplaceno rekordní výkupné kolem 15 milionů dolarů, vůbec nejvyšší výkupné, vyplacené kdy v Evropě. Ve speciálu Portrétů věnovaném slavným únosům tento příběh připomenou Jan Adamec a David Hertl.
