  description: Spisovatelka Michelle Losekoot (39) se na čtyřicítku těší. Přirovnává ji k začátku léta a velkých prázdnin - období, kdy už člověk nemusí tolik plnit očekávání druhých. Po dvaceti letech dospělosti má pocit, že konečně dokáže rozeznat, podle kterých pravidel chce žít a která může bez výčitek odložit. Svěřila se s tím Ivaně Veselkové v rozhovoru ze série Klub 40.
