  title: Ranní Plus
  subtitle: Politika, společnost, byznys, věda. Moderují Šárka Fenyková a Martin Matějka.
  description: Ukrajina opět začala útočit na ruské rafinerie a nově také na datová centra. Prezident Volodymyr Zelenskyj to zdůvodnil tím, že energetické příměří, které vyhlásil před týdnem americký prezident Donald Trump, Moskva nedodržovala. V některých volebních obvodech bude o nových senátorech zítra jasno už brzy odpoledne, jiné slibují těsné souboje. Děti ode dneška svádějí bitvu o diamant tedy baseballové hřiště, které má ustoupit zástavbě. Premiéru má nová série Rádia Junior, která představí dětské herce i známá jména z řad dospělých. Jihlava, Hodonín, Teplice. Na mapě Česka přibyla další města, která už znají svoje vedení na další 4 roky. Někde ale stále jasno není. Proč se povolební vyjednávání protahuje třeba v Praze nebo ve Zlíně? Přes 70 let byly ukryté pod vodou. Teď se na Slapech znovu objevují pozůstatky zatopené vesnice Zvírotice. Klesající hladina přehrady odhaluje základy domů, staré sklepy i vojenské bunkr. Jak urychlit cestu onkologického pacienta zdravotnickým systémem i to budou řešit programátoři a vývojáři na největším AI hackatonu proti rakovině na světě. Začíná dnes současně v Praze, Brně a Ostravě. Drtivá většina rodičů s dětmi do 4 let má zájem pracovat. Úvazek, který jim vyhovuje, ale dostala jen zhruba polovina z nich. Ukázal to letošní průzkum platformy Mumdoo, ve kterém odpovídalo skoro 18 tisíc rodičů. Co jsou hlavní překážky, proč rodiče předškolních dětí nemůžou pracovat? Moderují Šárka Fenyková a Martin Matějka.
