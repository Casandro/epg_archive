  title: Podróże z historią 3 (odc. 1)
  subtitle: Radosław Kotarski odkrywa kulturę Łemków. Sprawdza, jak wielu przedstawicieli tej grupy etnicznej wciąż mieszka w Polsce, czym tradycyjnie się zajmowali i co dawniej jedli.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Dlaczego podróżując po polskim Beskidzie Niskim, możemy natrafić na samotne drzwi, które stoją w środku pola? Kto je tam zostawił? Co symbolizują? Radek Kotarski rusza ich śladem i odkrywa barwną kulturę Łemków. Sprawdza, jak wielu zostało ich w Polsce, czym tradycyjnie się zajmowali i co dawniej jedli. Zapraszamy na magiczną podróż do świata tajemniczych górali.
