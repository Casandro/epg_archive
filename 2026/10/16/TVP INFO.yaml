  title: Podróże z historią 3 (odc. 1)
  subtitle: Radosław Kotarski odkrywa kulturę Łemków. Sprawdza, jak wielu przedstawicieli tej grupy etnicznej wciąż mieszka w Polsce, czym tradycyjnie się zajmowali i co dawniej jedli.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Dlaczego podróżując po polskim Beskidzie Niskim, możemy natrafić na samotne drzwi, które stoją w środku pola? Kto je tam zostawił? Co symbolizują? Radek Kotarski rusza ich śladem i odkrywa barwną kulturę Łemków. Sprawdza, jak wielu zostało ich w Polsce, czym tradycyjnie się zajmowali i co dawniej jedli. Zapraszamy na magiczną podróż do świata tajemniczych górali.
  genre:
  - '149'
- eventId: 1633732
  start: 2026-10-16T01:23:00Z
  stop: 2026-10-16T01:57:00Z
  title: Polskie parki narodowe 1 (odc. 6)
  subtitle: Tematem programu będzie Park Narodowy Gór Stołowych, słynący z niezwykłych formacji skalnych, malowniczych krajobrazów oraz unikatowej przyrody chronionej na obszarze Sudetów.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Prowadzący program Dariusz Gross, dziennikarz, zafascynowany przyrodą poszukiwacz - odkrywca pokazuje parki narodowe znane turystom, z innej zaskakującej strony przez pryzmat pracy naukowców zgłębiających sekrety ekosystemów i pracujących nad ich zachowaniem dla przyszłych pokoleń. To program przybliżający osobliwości przyrody i ukazujący wyjątkowość poszczególnych parków narodowych w Polsce, w którym spotykają się nowoczesne technologie badawcze z odwiecznym dziełem natury.
  genre:
  - '35'
