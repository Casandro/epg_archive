  title: OMR Podcast - André Schürrle, Extreme Athlete
  description: André Schürrle galt als einer der vielversprechendsten jungen Spieler seiner Generation. Seine Flanke führte zum Siegtreffer im Finale der Fußball-Weltmeisterschaft 2014. Doch dann beendete er überraschend bereits mit 29 Jahren seine Karriere. Im OMR Podcast erzählt er, warum er sich gegen weitere Jahre im Fußball mit Millionen-Gehältern entschieden hat, wie es nach dem Karriereende weiterging, worin die krassesten Unterschiede zu seinem heutigen Leben als Extremsportler liegen und was hinter seinem neuen Getränke-Projekt Dryll steckt.
