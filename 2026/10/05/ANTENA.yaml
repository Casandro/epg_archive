  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 1)'
  subtitle: Candice promienieje, w jej życiu zagościła stabilizacja - smutki odeszły. Bohaterka nie zgodziła się na przeniesienie, a na dodatek zaprzyjaźniła się z szefową. Jules rozpoczyna naukę w szkole.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2018
    Reżyseria: Raphaël Lenglet
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, François-Dominique Blin, Yeelem Jappain
    Candice promienieje: smutki odeszły w niepamięć, ostatecznie nie zgodziła się na przeniesienie, a na dodatek zaprzyjaźniła się z szefową. Przynajmniej tak jej się wydaje. Jules rozpoczął naukę w szkole hotelarskiej, a Emma od niedawna spotyka się z kimś i daje jej święty spokój. Dzięki prowadzonemu śledztwu, które daje jej możliwość zanurzenia się w świecie sportu 2.0, poznaje świetne sposoby na poprawę formy. Wszystko zdaje się iść w jak najlepszym kierunku, gdyby nie kwestia Antoina.
  ageRating: 12
