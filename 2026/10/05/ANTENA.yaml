  description: |-
    Tytuł oryginalny: Polska. Największe tajemnice
    PL, 2026
    Program wraca do katastrofy promu Heweliusz, analizując jej przebieg, ładunek przewożony na pokładzie oraz działania podjęte podczas akcji ratunkowej. Przygląda się także skutkom epidemii koronawirusa i wydatkowaniu środków przeznaczonych na walkę z nią. W odcinku pojawiają się również tajemnice opuszczonego szpitala w Mokrzeszowie, sprawa zabójstwa dziennikarza Jarosława Zientary oraz głośny proces dotyczący śmierci studentki w Krakowie.
