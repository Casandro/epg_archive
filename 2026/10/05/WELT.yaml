  title: Die JVA Aachen - Das Hochsicherheitsgefängnis
  subtitle: Die JVA Aachen - Das Hochsicherheitsgefängnis
  description: Die Justizvollzugsanstalt im nordrhein-westfälischen Aachen feierte 1995 ihre Einweihung und bietet Platz für über 700 Straf- und Untersuchungsgefangene. Wer arbeitet hier, wer sitzt wofür seine Strafe ab? Und wie gehen Angehörige mit dem Arrest eines Familienmitgliedes um?
  widescreen: true
- eventId: 1414182
  start: 2026-10-05T20:04:00Z
  stop: 2026-10-05T21:05:00Z
  title: Blackout - Wenn es in Deutschland dunkel wird
  subtitle: Blackout - Wenn es in Deutschland dunkel wird
  description: 'Wie wahrscheinlich ist ein flächendeckender Stromausfall in Deutschland? Und wie verwundbar ist unser Energienetz durch Angriffe, Sabotageakte oder Extremwetter? Die Dokumentation beleuchtet die Herausforderungen eines Stromnetzes im Umbruch: Der Ausbau erneuerbarer Energien bringt neue Chancen, aber auch neue Instabilitäten mit sich. Experten aus Energiewirtschaft, Katastrophenschutz und Sicherheit zeigen, was im Ernstfall tatsächlich passiert.'
  widescreen: true
