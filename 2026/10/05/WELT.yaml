  start: 2026-10-05T00:12:00Z
  stop: 2026-10-05T00:57:00Z
  title: Lost Places - Folge 69
  subtitle: Lost Places - Folge 69
  description: Mitten in der indischen 30-Millionen-Metropole Delhi bietet sich ein unerwarteter Anblick. Ein riesiger Dschungel, von dem es heißt, die einzigen Bewohner seien Affen und heulende Schakale. Doch hinter all dem Laub versteckt sich eine Ruine wie aus einer anderen Welt. Noch vor wenigen Jahren lebt eine Familie in dem verlassenen Dschungelhaus. Legenden ranken sich um Sie, da kaum jemand sie je zu Gesicht bekam. Die einen sagen, es seien Riesen gewesen. Andere hielten sie für übernatürliche Wesen.
  widescreen: true
- eventId: 1414067
  start: 2026-10-05T00:57:00Z
  stop: 2026-10-05T01:48:00Z
  title: Hitler und Stalin (1)
  subtitle: Hitler und Stalin (1)
  description: Hitler und Stalin waren zwei der schrecklichsten Diktatoren des 20. Jahrhunderts. Hinter der Fassade ihrer radikalen Gegnerschaft hatten die beiden Männer jedoch möglicherweise mehr gemeinsam, als zunächst vermutet. Obwohl sie sich nie begegneten, wurden ihre Komplizenschaft und ihre Zusammenarbeit jahrzehntelang geheim gehalten. Wie haben sie sich gegenseitig beeinflusst? Diese Dokumentation bringt die neuesten Enthüllungen über diese berüchtigte Beziehung ans Licht.
  widescreen: true
- eventId: 1414068
  start: 2026-10-05T01:48:00Z
  stop: 2026-10-05T02:35:00Z
  title: Hitler und Stalin (2)
  subtitle: Hitler und Stalin (2)
  description: Viele Jahrzehnte lang wurden Hitler und Stalin lediglich als unerbittliche Feinde dargestellt. Nun lassen neue Erkenntnisse darauf schließen, dass zwischen ihnen eine Mischung aus Misstrauen und gegenseitiger Faszination herrschte. Diese Dokumentation zeigt anhand von unveröffentlichten Archiven die geheime Beziehung zwischen Hitler und Stalin, wie sie zueinander standen und welche Vorteile sie vor Juni 1941 aus dem deutsch-sowjetischen Pakt zogen.
  widescreen: true
- eventId: 1414069
  start: 2026-10-05T02:35:00Z
  stop: 2026-10-05T03:19:00Z
  title: 'Geheime Nazi-Expeditionen: Atlantis'
  subtitle: 'Geheime Nazi-Expeditionen: Atlantis'
  description: Die Nazis waren besessen von der Idee einer deutschen Herrenrasse. Um ihre Ideologie zu festigen, suchten sie krampfhaft nach Anhaltspunkten in der Vergangenheit. Der Mythos der Stadt Atlantis und ihrer einst mächtigen Bewohner passte perfekt in dieses Muster. Dem Nationalsozialismus nahestehende Forscher wurden damit beauftragt, eine Verbindung zwischen der verschollenen Hochkultur und dem deutschen Volk herzustellen.
  widescreen: true
- eventId: 1414070
  start: 2026-10-05T03:19:00Z
  stop: 2026-10-05T03:59:00Z
  title: 'Geheime Nazi-Expeditionen: Hexenkult'
  subtitle: 'Geheime Nazi-Expeditionen: Hexenkult'
  description: Heinrich Himmler, eine der einflussreichsten Persönlichkeiten des Nationalsozialismus, war fasziniert vom Okkultismus des Altertums. Er war überzeugt von der Existenz einer mystischen, arisch-magischen Kraft deutscher Vorfahren. Himmler entsandte Wissenschaftler, um Rituale nordischer Schamanen zu erforschen und häufte Lektüre über die Hexenverfolgungen an, hinter denen er eine jüdische Verschwörung gegen die arische Rasse vermutete. Seine Ideen fanden auch bei Hitler großen Anklang.
  widescreen: true
