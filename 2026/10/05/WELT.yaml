  title: 'Gefängnisse: Wärterinnen ohne Waffen'
  subtitle: 'Gefängnisse: Wärterinnen ohne Waffen'
  description: 'In der Philippinischen Hauptstadt Manila befindet sich das größte Frauengefängnis der Philippinen. Die Großstadt ist von Armut gezeichnet, und viele Schicksale enden in der Kriminalität. Die häufigsten Vergehen: Betrug, Prostitution und Drogen. Doch in dem 1931 gegründetem Correctional Institution for Women leben auch Frauen, die sich durch Mord oder ähnlich schwere Verbrechen strafbar gemacht haben. Der Alltag an diesem Ort ist ein täglicher Kampf ums Überleben und geprägt von Gewalt.'
  widescreen: true
