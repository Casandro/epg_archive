  title: Mein Lokal, Dein Lokal - Der Profi kommt
  subtitle: |-
    "FUX Restaurant", Köln
    Koch-Doku, D 2026
    Altersfreigabe: ab 6
  description: |-
    Zum Wochenstart geht es ans Rheinufer ins "FUX Restaurant" in Köln. Betriebsleiter Nurdin setzt hier auf internationale Küche mit mediterranem Einfluss. In direkter Lage am Rhein, nahe Zoo und Skulpturenpark, will das Restaurant mit stilvollem Ambiente überzeugen. Küchenchef Orlando serviert edle Fisch- und Fleischgerichte. Kann Nurdin damit den Grundstein für eine erfolgreiche Woche legen?

    Gastgeber: Christian Henze
  widescreen: true
- eventId: 1371275
  start: 2026-10-05T16:57:15Z
