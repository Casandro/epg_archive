  title: Hot Shots! Die Mutter aller Filme
  subtitle: |-
    Hot Shots! Die Mutter aller Filme
    Komödie, USA 1991
    Altersfreigabe: ab 6
  description: |-
    Ex-Pilot Topper Harley lebt zurückgezogen bei seinem Indianerstamm - bis er von der Navy reaktiviert wird: Mit der Elitetruppe "Müdes Wiesel", einem Haufen durchgeknallter Typen, soll er eine Mission gegen einen wahnsinnigen Diktator durchführen. Topper hat aber ein Problem: seine Psychose. Die Army-Psychiaterin Ramada soll Topper heilen - und prompt verliebt er sich in sie. Doch nicht nur der Diktator, auch ein intriganter Rüstungsfabrikant macht den "müden Wieseln" zu schaffen.

    Regie: Jim Abrahams
    Drehbuch: Jim Abrahams, Pat Proft
    Komponist: Sylvester Levay
    Kamera: Bill Butler
    Schnitt: Jane Kurson, Eric Sears

    Darsteller:
    Charlie Sheen (Sean "Topper" Harley)
    Cary Elwes (Kent Gregory)
    Valeria Golino (Ramanda Thompson)
    Lloyd Bridges (Admiral Benson)
    Kevin Dunn (Lt. Commander Block)
    Jon Cryer (Jim "Wash Out" Pfaffenbach)
    William O'Leary (Pete "Dead Meat" Thompson)
    Kristy Swanson (Kowalski)
    Efrem Zimbalist jr. (Wilson)
  widescreen: true
