  description: |-
    Bertie ist Manta-Fan und liebt die blonde Friseuse Uschi. Um ihr zu imponieren, will er gegen den Benz-Fahrer Axel ein Rennen bestreiten - natürlich als glorreicher Sieger! Doch kaum gilt die Wette, schon ist Bertie scheinbar vom Pech verfolgt: Uschi hat plötzlich nur noch Augen für den Disco-Besitzer und Ferrari-Fahrer Helmut, und Berties bester Freund begeht Hochverrat, indem er das Abitur besteht. Zum Glück gibt's ja noch den etwas unterbelichteten Klausi aus der Manta-Clique.

