  title: Achtung Kontrolle! Wir kümmern uns drum
  subtitle: |-
    Thema u.a.: Food-Expertin Missy - Auf der Suche nach dem besten Senfrostbraten
    Reportagereihe, D 2026
    Altersfreigabe: ab 12
  description: 'Food-Testerin Mirjam von der Mark, Missy genannt, ist unterwegs in Düsseldorf. Sie will ein kulinarisches Stück Stadtgeschichte entdecken - den Senfrostbraten. Ein Steak, das mit einer dicken Senfkruste überzogen ist. Nach drei verschiedenen Lokalen stellt sie sich die Frage: Wo schmeckt es am besten?'
  widescreen: true
- eventId: 1371283
