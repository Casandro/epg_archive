- eventId: 833675
  start: 2026-10-05T18:00:00Z
  stop: 2026-10-05T19:00:00Z
  title: Am Rand (Teil 1 von 2)
  subtitle: Von Philipp Löhle
  description: "\"Es ist doch noch nie was passiert. - Ja, aber weil noch nie was passiert ist, heißt das ja noch nicht, dass auch jetzt nichts passieren wird. Ganz im Gegenteil. - Ganz im Gegenteil was? - Na die Wahrscheinlichkeit, dass jetzt etwas passiert, die wird doch immer größer. Weil ja noch nichts passiert ist.\"\n\nIn Randhausen, einem kleinen Ort an der Grenze zu Tschechien, wird die lange vakante Stelle des Dorfpolizisten wieder besetzt. Hier, am Rand der Republik, scheint die Welt zunächst noch in Ordnung. Der neu eingestellte Beamte Frederick Kaufmann erlebt eine ländliche Idylle: Niemand schließt sein Fahrrad ab, Eier, Schraubenzieher und Verlängerungskabel werden ohne Gegenleistung verliehen, teilweise monatelang. Paketlieferungen werden einfach vor Haustüren abgelegt. Es gelingt dem Polizisten sogar, sich mehrfach unbemerkt Zugang zu fremden Wohnungen zu verschaffen. Die Vertrauensseligkeit der Randhausener lässt bei dem jungen Polizisten die Alarmglocken läuten. Als er die Bewohner auf die möglichen Gefahren aufmerksam macht, die jenseits der nahegelegenen deutsch-tschechischen Landesgrenze lauern könnten, werden Maßnahmen zur eigenen Verteidigung ergriffen: Türen schließen sich, Zäune werden gezogen, ein Schlagbaum wird aufgestellt, eine Bürgerwehr gebildet...\n\nGeografisch, gesellschaftlich, moralisch - die Setzung von Grenzen ist eine Konstante menschlichen Denkens und Handelns. Der Autor Philipp Löhle macht das zum Grundmotiv seines Hörspiels. Darin wird das fiktive Dorf Randhausen zum Brennglas Europas und der Welt. Und die Grenze zwischen Komik und Tragik wird genau so oft überschritten wie die zwischen Fantasie und Alltag.\n\nPhilipp Löhle wurde 1978 in Ravensburg geboren. Er studierte Geschichte, Theater- und Medienwissenschaft sowie Deutsche Literatur in Erlangen und Rom. Seine ersten Theaterstücke entstanden noch während des Studiums. Für \"Genannt Gospodin\" wurde er mit dem Förderpreis des Bundesverbandes der Deutschen Industrie ausgezeichnet. 2007 gewann er den Werkauftrag des Theatertreffen-Stückemarktes, gestiftet von der Bundeszentrale für politische Bildung. \"Lilly Link\" wurde 2008 mit den Jurypreis des Heidelberger Stückemarkts ausgezeichnet. Löhle war mehrfach für den Mülheimer Dramatikerpreis nominiert: 2008 für \"Genannt Gospodin\", 2012 für \"Das Ding\", das mit dem Publikumspreis ausgezeichnet wurde, und 2014 für \"Du (Normen)\". Philipp Löhle ist seit der Spielzeit 2018/19 Hausautor am Staatstheater Nürnberg.\n\nRegie: Leonhard Koppelmann\nBearbeitung: Steffen Moratz\nProduktion: MDR 2019\n\nMitwirkende: \nRafael Stachowiak - Zensor\nFinja Skarabis - Zähler, Jana\nGisa Flake - Fussnote\nCharlotte Weise - Lusia\nJanek Splitter - Paul\nNele Rosetz - Hannah\nSönke Möhring - Fred\nFalk Rockstroh - Fabian\nPeter Trabner - Martin\nHilmar Eichhorn - Puffke\nBarbara Trommer - Inge\nTeresa Weißbach - Anne\nStephan Grossmann - Robert\nJulischka Eichel - Kati\nOle Lagerpusch - Stefan, Oberst\nKarina Plachetka - Daniela\nFranziska Troegner - Melinda\nPatrick Güldenberg - Marc\nManfred Möck - Färber\nCorinna Waldbauer - Karoline\nHenning Nöhren - Konstantin\nAndré Szymanski - Rudolf\nAndreas Keller - Jakob\nBrian  Völkner - Jonathan"
