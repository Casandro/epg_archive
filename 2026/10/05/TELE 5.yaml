  title: Expedition Unknown - Mythen auf der Spur
  subtitle: 'The Secret: Die Schatzsuche geht weiter'
  description: "Vergrabene Schätze und verwirrende Rätsel: \"The Secret\" ist eine legendäre Schatzsuche in Nordamerika, die bereits seit fast 40 Jahren andauert. 1982 vergrub der Verleger Byron Preiss 12 Schatzkästchen in 12 Städten. Dann veröffentlichte er ein Buch mit Bildern, kryptischen Versen und Hinweisen auf die Verstecke. Jedes Kästchen enthält einen Schlüssel, der wiederum gegen einen kostbaren Edelstein eingetauscht werden kann. Der Clou an der Sache? Bis heute wurden erst zwei dieser Kästchen gefunden! Abenteurer Josh Gates hat vielversprechende Informationen erhalten, die nun zum dritten Fund führen könnten. \nUSA 2019"
