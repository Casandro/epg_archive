  title: Stargate
  subtitle: Die Seuche
  description: |-
    Das SG-1-Kommando besucht einen besiedelten Planeten mit der Kennung P3X-797. Die Humanoiden, die dort leben, befinden sich in einem bronzezeitlichen Entwicklungsstadium, das Ähnlichkeiten zur Hochkultur der Minoer aufweist. Allerdings fängt sich Colonel Jack O'Neill auf der dunklen Seite des Planeten eine ansteckende Krankheit ein, die Infizierte in brutale Bestien verwandelt. Während die Stargate-Basis zur hermetisch abgeriegelten Quarantänestation wird, helfen Dr. Daniel Jackson und Teal'c bei der Suche nach einem Heilmittel gegen die außerirdische Seuche.
    USA 1997
