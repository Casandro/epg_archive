  title: Leise weht der Wind des Todes
  description: |-
    Als Melissa Ruger (Candice Bergen) eines Tages von Gangsterboss Frank Calder (Oliver Reed) entführt wird, damit sie ihm das Lesen beibringt, entwickelt sich bald eine gewisse Beziehung zwischen den beiden. Schließlich wurde Melissa auch auf der heimischen Ranch von ihrem gewalttätigen Ehemann Brandt Ruger (Gene Hackman) brutal misshandelt. Allerdings fühlt sich der narzisstisch veranlagte Brandt durch die Entführung seiner Ehre beraubt. Mit einem bewaffneten Trupp nimmt er die Verfolgung auf, um die Gesetzlosen zu stellen. - Brutalo-Western mit Starbesetzung aus britischer Produktion. Das Drehbuch stammt vom "Vater der glorreichen Sieben": Lou Morheim.
    USA 1971
  widescreen: true
