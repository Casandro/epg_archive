  title: Stargate
  subtitle: Verraten und verkauft
  description: |-
    Als Colonel Jack O'Neill und sein Team zum Planeten Simarka reisen, machen sie Bekanntschaft mit einem kriegerischen Nomadenvolk. Die Shavadai stammen von den Mongolen auf der Erde ab und sind Meister der berittenen Kampfkunst. Allerdings hat die Kultur in puncto Rollenverteilung ein völlig veraltetes Konzept. So gelten Frauen als rechtlose Besitztümer, die von den herrschenden Clanchefs gnadenlos unterdrückt werden. Captain Samantha Carter legt harte Bandagen an, um ihre eigene Haut zu retten sowie für die Frauenrechte auf dem entfernten Planeten einzustehen.
    USA 1997
  widescreen: true
