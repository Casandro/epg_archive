  title: Torchwood
  subtitle: In der Höhle des Löwen
  description: |-
    Das neu formierte Torchwood-Team reist nach Los Angeles, um das Hauptquartier des Pharmariesen "PhiCorp" zu infiltrieren. Allerdings ist der Gruppe ein Auftragskiller auf den Fersen, der später selbst ausgeschaltet wird. Jack und seine Leute finden Hinweise darauf, dass weltweit Internierungslager für kranke Menschen entstehen. Gwen ist schockiert, als sie erfährt, dass ihr Vater in Großbritannien offenbar auch in eins der Camps gebracht worden ist. Unterdessen sorgt die Kampagne "Dead is dead" für Furore, die von der Politikerin Ellis Hartley Monroe (Mare Winningham) angeführt wird.
    GBR, USA, CAN 2011
  widescreen: true
- eventId: 1422018
  start: 2026-10-05T21:55:00Z
  stop: 2026-10-05T23:00:00Z
  title: Torchwood
  subtitle: Kategorien des Lebens
  description: |-
    Die Regierungen der Erde machen Nägel mit Köpfen. Das Leben der Menschen wird ab sofort in Kategorien eingeteilt! Die Kategorien 1 und 2 sind schwer krank, hätten bereits sterben sollen oder stellen ein Risiko für die gesunde Gruppe 3 dar. Gwen versucht verzweifelt, ihren Vater Geraint (William Thomas) aus einem Internierungslager in Wales zu befreien. In den USA starten Rex, Vera und Esther eine verdeckte Ermittlung, um die Missstände in den Camps aufzudecken. Vera wird dabei getötet, was Rex auf Video aufnimmt. Derweil versucht Jack, den "PhiCorp"-Botschafter Oswald Danes davon zu überzeugen, sein Insiderwissen über den "Miracle Day" öffentlich zu machen.
    GBR, USA, CAN 2011
  widescreen: true
