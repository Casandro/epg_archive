  title: Stargate
  subtitle: Der Feind in seinem Körper
  description: |-
    Die Spezialeinheit SG-1 begrüßt einen neuen Kameraden in ihren Reihen. Nachdem sich Jaffa Teal'c (Christopher Judge) gegen die Goa'uld gewendet hat, soll der Außerirdische nun Teil der Truppe werden. Allerdings gibt es auch Verluste zu verzeichnen: Im Körper von Major Charles Kawalsky hat sich nämlich ein Symbiont der Aliens eingenistet! Das parasitäre Mitbringsel aus einem fernen Winkel der Galaxis ist nur schwer zu entfernen und erfordert drastische Maßnahmen. Parallel dazu muss das Stargate im Untergrund der Militärbasis besser vor Angriffen geschützt werden.
    USA 1997
