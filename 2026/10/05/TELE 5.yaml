  title: Doctor Who
  subtitle: Tief durchatmen
  description: |-
    London, im Viktorianischen Zeitalter: Während sich der neue Doktor im Unterschlupf der Paternoster-Gang von seiner Regeneration erholt, gehen an der Themse seltsame Dinge vor sich. Ein Dinosaurier wütet in der Stadt und mehrere Menschen kommen durch spontane Selbstentzündung ums Leben! Auch ein rätselhafter Mann (Peter Ferdinando), der sich als Cyborg entpuppt, ist in die Vorgänge verstrickt. Als die Mensch-Maschine vorgibt, einen Weg ins gelobte Land zu suchen, wird das Rätsel umso größer. Später erhält Clara einen Anruf, der sie davon überzeugt, weiterhin mit dem Timelord unterwegs zu sein.
    GBR 2014
  widescreen: true
- eventId: 1421975
  start: 2026-10-05T19:50:00Z
  stop: 2026-10-05T20:55:00Z
  title: Doctor Who
  subtitle: Mission Dalek
  description: |-
    Der Doktor und Clara eilen dem Rebellenraumschiff "Aristoteles" zur Hilfe. Gretchen Carlisle (Laura Dos Santos) und weiter tapfere Soldat:innen an Bord gehören dem "Vereinten Galaktischen Widerstand" an, der gegen die Daleks kämpft. Da sich an Bord auch ein freundlich gesinnter Dalek namens Rusty sowie ein futuristisches Molekulolnanoskalargerät befinden, entscheiden sich der Timelord und seine Verbündeten für einen riskanten medizinischen Eingriff. Auf mikroskopische Größe geschrumpft, reisen sie ins Innere von Rusty, um dort die neuronalen Schaltkreise des Außerirdischen zu erforschen.
    GBR 2014
  widescreen: true
