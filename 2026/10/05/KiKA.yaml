    Kimia, ein Berggorillajunges, wird im Reservat aufgenommen. Taylor und Tommy sind begeistert. Zum ersten Mal hat Jack Kontakt zu einem Artgenossen. Aber Jack reagiert anders als erwartet.

    Jack hat kein Interesse an Kimia. Er verhält sich sogar abweisend gegenüber dem süßen, kleinen Wesen. Das braucht wohl einfach ein wenig Zeit, denkt Taylor. Aber da tauchen zwei Mitarbeiter einer Tierschutzorganisation auf. Sie wollen Kimia wieder mitnehmen.

    Taylor ist entsetzt. Sie hat sich so darauf gefreut, Jack und Kimia aneinander zu gewöhnen. Aber die Mitarbeiter der Tierschutzorganisation sagen, dass Kimia ihnen von Schwarzhändlern gestohlen wurde. Sie wollen das Tier nun wieder in seine Heimat zurückbringen. Taylors Eltern Hector und Sonia bedauern das ebenso wie Taylor, sagen aber, dass sie kein Recht haben, Kimia zu behalten.

    Es hilft alles nichts, Taylor muss sich fügen. ...
