    Die Trollbrücke

    Pip spielt den fiesen Troll, der niemandem gestattet, seine Brücke zu überqueren. Aber das lassen sich Posy und Frankie natürlich nicht gefallen und tricksen ihn kurzerhand aus.

    Als freche Pinguine verwandeln sie sich mal eben in mächtige Adler, die die Trollbrücke einfach überfliegen. Und danach suchen sie sich gemeinsam ein Pinguinhaus und haben sehr viel Spaß bei ihrem Spiel. Pip findet das überhaupt nicht witzig.

    Er fühlt sich von Posy und Frankie im Stich gelassen, weil sie nicht mit ihm zusammen spielen. Blitzschnell denkt Posy sich etwas aus, damit ihr bester Freund nicht länger traurig ist: Sie bietet ihm die Rutsche als neue Trollbrücke an - die steht nämlich direkt neben dem neuen Pinguinhaus - somit sind sie alle drei Nachbarn. Nachbar Troll lässt seine Nachbarinnen jetzt mit Vergnügen seine Brücke benutzen und lädt sie sogar zu einem ganz besonderen Abendessen ein.
