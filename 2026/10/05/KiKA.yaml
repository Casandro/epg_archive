    Elmo hat sich mit Motsi Mabuse in der Sesamstraße zum Tanzen verabredet. Da kommt Abby dazu und möchte mitmachen.

    Die Verabredung nimmt eine unerwartete Wendung. Motsi lädt sie herzlich ein - ohne zu ahnen, dass Elmo davon zunächst gar nicht begeistert ist, schließlich hatte er die Zeit ganz für sich und Motsi geplant.

    Außerdem möchte Bert Ernie einen Tanz zeigen, den er seiner Taube beigebracht hat. Dumm nur, dass die Taube sich partout nicht an das hält, was Bert ihr angeblich beigebracht hat. Erst als Ernie der Taube gut zuredet und ihr Mut macht, ändert sich das - und sie beginnt tatsächlich zu tanzen.

    Grobi erklärt derweil den Beruf des Tanzlehrers und gibt dem Blauen zur Veranschaulichung eine unvergessliche Tanzstunde.
