    Lionel und Estelle, die Mitarbeiter der Tierschutzorganisation, entpuppen sich als Betrüger. Nachdem sie Taylors Eltern zu einem erfundenen Treffpunkt gelockt haben, wollen sie Kimia stehlen.

    Auch Ruth, Max und Jonas werden von ihnen überwältigt und in einen Schuppen gesperrt. Nun sind nur noch Taylor und Tommy im Reservat. Leichte Beute, glauben Lionel und Estelle. Aber sie irren sich. Taylor und Tommy kennen sich im Dschungel aus und können entkommen.

    Taylor und Tommy wollen unbedingt verhindern, dass das Gorillababy Kimia in die Hände der beiden Betrüger fällt. Sie denken sich einen ausgeklügelten Plan aus und schaffen es, Lionel und Estelle an der Nase herumzuführen. Doch dann verletzt sich Tommy und kann nicht mehr fliehen.
