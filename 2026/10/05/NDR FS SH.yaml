- eventId: 685666
  start: 2026-10-05T01:40:00Z
  stop: 2026-10-05T02:10:00Z
  title: 'Die Nordreportage: Ackern für die Süßkartoffel'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Drei Landwirte wagen ein Experiment: Ernst Lütje, Jochen Gaus und Ulrich Behrens aus Niedersachsen bauen auf ihren Feldern bei Gifhorn als eine der ersten Bauern Süßkartoffeln an. Die Ernte steht im Oktober an. Das Besondere: Die Süßkartoffeln, die bei Konsumenten gerade im Trend liegen, können nur per Hand aus der Erde geholt werden, da die Schale empfindlich ist und es keine passenden Kartoffelroder gibt. Die Nordreportage begleitet die Süßkartoffelanbauer in der spannendsten Zeit im Jahr und ist dabei, wenn sich bei der Ernte herausstellt, ob sie mit ihrem Projekt tatsächlich Erfolg haben.'
- eventId: 685667
  start: 2026-10-05T02:10:00Z
  stop: 2026-10-05T02:40:00Z
  title: 'Die Nordreportage: Nachhaltig ackern in der Landwirtschaft'
  subtitle: Die Agrarrebellen vom Haidehof
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Gute Ernten einfahren und dabei die Böden stärken, das ist die Grundidee der regenerativen Landwirtschaft. Hannes Höhne will beweisen, dass das funktioniert. Er ist der Chef des Haidehofs im schleswig-holsteinischen Wedel bei Hamburg und hat die nachhaltige Art der Landnutzung während eines Auslandsjahres kennengelernt. In Deutschland ist diese spezielle Form von Ackerbau und Viehzucht noch nicht weit verbreitet. Der Aufwand ist deutlich höher als in der konventionellen Landwirtschaft.
- eventId: 685668
  start: 2026-10-05T02:40:00Z
  stop: 2026-10-05T03:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im niedersächsischen Kölau müssen alle Jungtiere den Aufzuchtstall räumen und zur Hühnerwiese umziehen. Denn auf dem Geflügelhof von Christine Bremer soll endlich die Modernisierung des Aufzuchtstalles starten. Aber Christine Bremer hat noch einige frisch geschlüpfte Küken im Brutraum. Die kann sie ohne technisch funktionsfähigen Stall aber nicht aufziehen. Im Vorharz will Landwirt Steffen Thudt Grassilage mähen. Aber vorher hat er organisiert, dass eine Drohne die Fläche abfliegt. Sie soll mithilfe einer Wärmebildkamera Rehkitze aufspüren.
- eventId: 685703
  start: 2026-10-05T03:10:00Z
  stop: 2026-10-05T03:55:00Z
  title: DAS! Rote Sofa
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Christoph Kramer, TV-Experte, Podcaster und Autor
  description: 'Der Weltmeister von 2014 spricht über besondere Begegnungen mit Menschen und wie sie unser Leben berühren können. Und vielleicht werfen wir einen gemeinsamen Blick auf das aktuelle Nationalteam. Ehrlich, selbstironisch und lässig: Christoph Kramer auf dem Roten Sofa.'
- eventId: 685704
  start: 2026-10-05T03:55:00Z
  stop: 2026-10-05T04:20:00Z
  title: Elefant, Tiger & Co. (962)
  subtitle: Wa(a)gemütig?!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Schneeleopardenzwillinge Suri und Mira sollen zum ersten Mal ohne ihre Mutter Chandra auf die Waage steigen. Eigentlich ist das Wiegen schon zur Routine geworden. Tigerin Yushka ist neu im Zoo Leipzig und soll ihre ersten Schritte auf der Außenanlage machen. Denis Hochgreve zieht den Schieber auf und hofft, dass die Neugierde die Großkatze hinauslocken wird. Gute Nachrichten aus dem Pongoland. Schimpansen-Dame Corri hat ein Jungtier zur Welt gebracht.
- eventId: 685705
  start: 2026-10-05T04:20:00Z
  stop: 2026-10-05T04:50:00Z
  title: Wie geht das? Pilze - Genuss und Gefahr
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Pilze bilden ein eigenes, geheimnisvolles Reich: Sie können Delikatesse oder tödliche Gefahr sein. Biologe Torsten Jonas züchtet auf seiner Pilzfarm im niedersächsischen Helvesiek Kräuterseitlinge, Shiitake und weitere Arten. Bis zu 400 Tonnen Frischpilze liefert sein Betrieb jährlich. Wer Pilze selbst sammelt, riskiert gefährliche Verwechslungen. Harry Andersson zeigt bei Exkursionen, wie sich essbare Pilze von giftigen Doppelgängern unterscheiden lassen. Bei Verdacht auf eine Pilzvergiftung muss der geprüfte Sachverständige schnell klären, ob eine gefährliche Art gegessen wurde.'
- eventId: 685706
  start: 2026-10-05T04:50:00Z
  stop: 2026-10-05T05:20:00Z
  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Ungemach
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Bei der aktuellen Auftragslage in der Fallersäge braucht Sophie unbedingt Verstärkung. Spontan engagiert sie Maximilian, mit dem sie im Sägewerk Schwär bereits zusammengearbeitet hat. Maximilian ist auf der Walz - und Toni alarmiert. Er hat nämlich den Eindruck, dass dieser Maximilian seine Chefin anbaggert. Er kann sich gut vorstellen, wie Constantin auf diesen Typen reagieren wird. Im Rathaus häufen sich die Beschwerden wegen des Mountainbike-Trails. Ständige Manipulationen der Strecke machen das Befahren unmöglich. Bernhard glaubt, den Übeltäter zu kennen.
- eventId: 685707
