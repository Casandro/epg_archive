  description: Wo immer wir uns bewegen, überall begegnet uns die Farbe Blau. Im Alltag genauso wie in der Kunst. Blau ist die Lieblingsfarbe der meisten Menschen weltweit. Warum? Immer wieder, in unterschiedlichen Epochen, spielt Blau eine führende Rolle in der Malerei. Zu den "Meisterwerken in Blau" zählen Giottos legendärer Freskenzyklus in der Scrovegni-Kapelle von Padua, die Glasmalereien von Chartres, Claude Monets blaue Seerosen, Franz Marcs Pferde oder Yves Kleins radikale Werke. Was fasziniert Künstlerinnen und Künstler an der "Königin der Farben"? Wofür steht Blau und was macht seinen Reiz aus?
