    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Mimo nieustających wysiłków Nektariosa, który stara się przekonać Mattheosa do zmiany chłodnego stosunku do Achilleasa i nawiązania z nim kontaktu, Mattheos trwa przy swoim. Sifis odmawia podpisania dokumentów rozwodowych, dopóki nie porozmawia z Meliną, aby dowiedzieć się, dlaczego go zostawiła. Mimo że wydaje się być spokojny, zranione ego nie pozwala mu jasno myśleć. Właśnie z tego powodu prosi Minasa, aby pomógł mu znaleźć broń, gdy tylko dotrze do Londynu.
