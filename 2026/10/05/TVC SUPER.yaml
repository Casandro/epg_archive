    Pewnej nocy kobieta ubrana w policyjny mundur spada na dach samochodu. W tym samym czasie widziano nastolatkę pospiesznie opuszczającą miejsce zbrodni. Wkrótce o zdarzeniu zostaje poinformowany mąż ofiary. Mężczyzna jest w szoku, bowiem jego żona właśnie siedzi obok niego. Członkowie wydziału dochodzeniowego muszą dołożyć wszelkich starań, by zidentyfikować osobę, która przywłaszczyła sobie tożsamość policjantki. Muszą też znaleźć świadka.
