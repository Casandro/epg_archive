  title: Profil 7 (odc. 9)
  subtitle: Adele zostaje zamknięta w szpitalu psychiatrycznym w miejsce swojej siostry. Nie udaje się jej przekonać personelu, że padła ofiarą spisku.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2016
    Reżyseria: Vincent Jamain
    Występują: Philippe Bas, Jean-Michel Martial, Raphaël Ferret, Sophie De Fürst, Valérie Dashwood, Juliette Roudet
    Adele zostaje zamknięta w szpitalu psychiatrycznym w miejsce swojej siostry. Nie udaje się jej przekonać personelu, że padła ofiarą spisku. Camille w tym czasie przejmuje tożsamość bliźniaczki i beztrosko niszczy jej dotychczasowe życie. Zespół prowadzi dochodzenie dotyczące brutalnej śmierci pewnego prawnika.
