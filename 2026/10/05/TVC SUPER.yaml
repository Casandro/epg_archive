    W odludnym miejscu znaleziono porzucony autobus. Aziz, kierowca, został zamordowany. Według śledczych wszystko wskazuje na próbę kradzieży, która potoczyła się nie tak, jak planowano. Przypuszczenie potwierdza zarejestrowany obraz z kamer monitorujących teren. Candice i jej zespół szybko identyfikują dwóch młodych sprawców zbrodni, którzy jednak utrzymują, że są niewinni. Co więcej, twierdzą, że wszystko zostało zainscenizowane na prośbę samego Aziza.
