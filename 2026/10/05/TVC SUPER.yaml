  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 9)'
  subtitle: W porcie Sete płonie statek. Znalezione na moście ciało należy do porucznika Daniela Langlois. Ofiara niedawno wróciła z misji w Mali i miała problemy z przystosowaniem się do normalnego życia.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Olivier Barma
    Występują: Cécile Bois, Raphaël Lenglet, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab
    W porcie Sete spłonął statek. Podejrzewa się, że znalezione na moście ciało należy do porucznika Daniela Langlois. Ofiara niedawno wróciła z misji w Mali i miała problemy z przystosowaniem się do normalnego życia. Żona wojskowego, Sandrine, uważała, że od powrotu mąż bardzo się zmienił i niepokoiła się jego stanem. Twierdziła, że mężczyzna stał się obcy. Candice Renoir przejmuje śledztwo i wkrótce dokonuje nieoczekiwanego odkrycia. Przed śmiercią Langlois zainstalował wokół domu kamery.
