  subtitle: Comedy-Reportage mit Tahsim Durgun
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Tahsim Durgun, preisgekrönter Content-Creator und Bestsellerautor, zählt zu den spannendsten jungen Stimmen Deutschlands. In einer neuen Comedy-Reportage tritt Tahsim Durgun gemeinsam mit einer kurdischen Tante, die stellvertretend für die Generation von Tahsims Mutter steht, eine ultimative Deutschlandreise an - ein Roadtrip zwischen Hochkultur und Hobby Horsing, Bauernhof und Ballermann, bei dem er feststellt: Deutschland ist ein vielseitiges Land, aber auch ein Land voller Widersprüche.

    Zwischen Kleingarten-Paragrafen und Fußballstadien versucht Tahsim, seiner Tante Zeynep Deutschland näherzubringen.
