  title: 'Passato e presente - Francesco d''Assisi '
  subtitle: Passato e presente - Francesco d'Assisi uno sguardo sul mondo - La sera del 3 ottobre, alla Porziuncola di Assisi, Francesco muore. Ha circa 44 anni. La chiesa cattolica celebra il giorno successivo, il 4,
  description: il suo dies natalis, la nascita al cielo. Papa Gregorio IX, a soli due anni dalla sua morte, il 16 luglio 1228, lo proclama Santo. Ma chi era Francesco d'Assisi prima di diventare Santo? Qual è stata la sua autentica impronta terrena prima che le epoche successive si appropriassero della sua memoria? Nell'ottavo centenario della morte di San Francesco, ''Passato e Presente'' tenta di rispondere a queste domande attraverso i luoghi che ne hanno ospitato le azioni e gli scritti - regole, ammonizioni, preghiere lodi, lettere e, soprattutto, il Testamentum - su cui ha impresso il suo sguardo sul mondo. Un percorso umano che si sviluppa nel cuore del XIII secolo, in una società pulsante di traffici, mercati e tensioni politiche di Francesco cui ribalta valori e ideali per approdare a una forma di vita modellata sul Vangelo. E sulla radicalità della parola di Cristo prende forma la sua fraternità. Una scelta consapevole di minoritas come pratica quotidiana di umiltà, povertà, obbedienza e sottomissione alla Chiesa. In studio con Paolo Mieli, il professor Antonio Musarra. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Antonio Musarra Con la partecipazione di Pietro Sorace
