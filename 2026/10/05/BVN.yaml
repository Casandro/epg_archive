  subtitle: S18 E132. Martine van Os en Sybrand Niessen ontvangen elke werkdag een keur aan gasten. Een aangename mix van nieuws, kunst, cultuur en entertainment.
  description: De presentatie van de Nederlandse MICHELIN-sterren vindt plaats. Hoofdredacteur van Food Inspiration Maaike de Reuver is erbij in Maastricht en praat ons bij. * Hoe ga je om met ongemotiveerde leerlingen? Hoe leer je elkaar begrijpen in een wereld vol meningen? Nouhaila El Guebli geeft een inkijkje in haar theatervoorstelling Gun Gewoon. * Hoe staat het ervoor met het Nederlands elftal? We bespreken het met Joep Schreuder. * Sven Ratzke neemt ons mee op een muzikale reis door 130 jaar filmgeschiedenis en vertelt welke films hém hebben gevormd. Hij geeft een voorproefje uit zijn voorstelling Kopfkino. (2026)
