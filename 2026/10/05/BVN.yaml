  title: Dwars door de Pyreneeën
  subtitle: De ziel van Baskenland S01 E01. Arnout Hauben waagt zich aan een nieuw wandelavontuur en portretteert de Pyreneeën in al zijn ruwe schoonheid, van de woeste Atlantische kust tot aan de glinsterende Middellandse Zee.
  description: 'Arnout Hauben start zijn wandeltocht aan de woeste Atlantische kust. Hij ontmoet er roeiers van wie de sport onlosmakelijk verbonden is met de historische walvisvaart, en voelt meteen het vurige Baskische verlangen naar onafhankelijkheid. Samen met zijn trouwe vrienden Philippe en Ruben beklimt hij de Larrun, de heilige berg van de Basken. Niet veel later stuit het drietal in de bergen op een verrassend stukje Belgische geschiedenis: de Komeetlijn uit de Tweede Wereldoorlog. (2026)'
  genre:
  - '144'
