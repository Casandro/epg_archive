- eventId: 834406
  start: 2026-10-05T21:00:00Z
  stop: 2026-10-05T22:00:00Z
  title: 1LIVE Soundstories
  subtitle: Erdsee (2/4, Staffel 1)
  description: |-
    Ursula K. Le Guins weltweit berühmte Fantasy-Saga als 3D-Audio-Serie: Weit entfernt, in einer anderen Zeit, liegt eine Welt, in der Magie alles durchdringt. Ein Reich, einst durch Frieden verbunden, nun durch Krieg und Hass geprägt. Aber es gibt Hoffnung. Das Schicksal von Erdsee liegt in den Händen zweier junger Menschen: Ged, ein Magier aus dem Inselreich - und Tenar, eine Hohepriesterin aus dem tristen Reich Kargad, tragen den Ring mit sich, der Frieden bringen soll. Doch die Gefahren, denen sie sich stellen müssen, lauern nicht nur auf dem Weg, sondern auch in ihrer Vergangenheit. In der ersten Staffel nehmen Tenar und Ged die Geschicke der Welt gemeinsam in die Hand und stellen sich Beben und Stürmen, dunkler Magie, Drachen, und nicht zuletzt ihren eigenen Dämonen.
    Regie: Jörg Schlüter<br/>Produktion: WDR <markup type="abbr" abbreviation="2022" correspondent="zweitausendzweiundzwanzig">2022</markup>
    Ab dem <markup type="abbr" abbreviation="6." correspondent="sechsten">6.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
