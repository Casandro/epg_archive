  title: Mein wunderbarer Kochsalon - Süßkartoffel Wedges aus dem Airfryer
  subtitle: Mein wunderbarer Kochsalon - Süßkartoffel Wedges aus dem Airfryer
  description: Ich gebe zu, ich war am Anfang skeptisch, was ich mit dem Airfryer anfangen soll. Mittlerweile sind wir beste Freunde. Pommes frites sind natürlich naheliegend, aber ich habe auch schon Brownies und Quiche darin gebacken, Fisch gebraten und Maroni geröstet. Aber bleiben wir bei den Pommes frites, oder zumindest Verwandten davon. Diesmal habe ich Wedges aus Süßkartoffeln gemacht, in einer kräftigen Gewürzmischung gewälzt und mit Knoblauch-Petersilien-Öl beträufelt. Noch Fragen? AT 2020
