  description: 'Weihnachten ist für mich immer DAS Highlight des Jahres, die Rührung überkommt mich jedes Mal, wenn die Kinder mit großen Augen vor dem Christbaum stehen und wir eine ruhige Familienzeit verbringen können. Das ist die Idee, die Realität sieht meistens etwas anders aus. Kurz nach dem Stille Nacht schleiche ich in die Küche, um den Braten zu übergießen, mitten in der Bescherung schiebe ich die Tarte Tatin an seine Stelle. Ja, ich weiß, ich könnte es mir leichter machen, aber so bin ich eben. Ein kleiner Schritt in Richtung Vernunft: Heuer bereite ich das Dessert tuttocompleto vor, und zwar nicht irgendeines, sondern die weltbesten Profiterols, von Anfang bis Ende selbst gemacht und nicht zu übertreffen. AT 2020'
