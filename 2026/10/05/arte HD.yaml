  title: 'Der Billionen-Prozess: Wer bezahlt die Klimakatastrophe?'
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Alles begann 2019 in einem Klassenzimmer auf Vanuatu. Jurastudierende fragten sich: Wer bezahlt die Klimakatastrophe? Sie schmiedeten einen Plan: den Klimawandel vor das höchste Gericht der Welt zu bringen. Sechs Jahre lang kämpften sie gegen Widerstände, um das Völkerrecht zu revolutionieren und die Industriestaaten finanziell haftbar zu machen.'
