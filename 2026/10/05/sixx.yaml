  title: Detective Laura Diamond
  subtitle: |-
    Laura und die Familiengruft
    Crime-Serie, USA 2015
    Altersfreigabe: ab 12
  description: |-
    Isabel Van Doren, die Ehefrau von Terrence Van Doren, stirbt bei einem Autounfall. Der Fall ist brisant, denn Van Doren ist der Herausgeber der umstrittenen Zeitschrift "The New York Ledger" und hat einige Feinde. Einer von ihnen ist der Bruder seiner ersten Frau Claire, der Van Doren vorwirft, sie getötet zu haben. Laura glaubt dem Trinker - und entdeckt schon bald einige dunkle Flecken auf Van Dorens weißer Weste.

    Regie: Guy Norman Bee
    Drehbuch: Amanda Green
    Komponist: Joey Newman
    Kamera: Tim Norman

    Darsteller:
    Debra Messing (Laura Diamond)
    Josh Lucas (Jake Broderick)
    Laz Alonso (Billy Soto)
    Janina Gavankar (Meredith Bose)
    Max Jenkins (Max Carnegie)
    Jeffrey Pierce (Terrence Van Doren)
    Betty Gilpin (Isabel Van Doren)
    Callie Thorne (Captain Nancy Santiani)
    Anastasia Barzee (Beth Evans)
  widescreen: true
- eventId: 1371292
  start: 2026-10-05T21:06:22Z
  stop: 2026-10-05T22:01:16Z
  title: Detective Laura Diamond
  subtitle: |-
    Laura und der Hitzetod
    Crime-Serie, USA 2015
    Altersfreigabe: ab 12
  description: |-
    Matthew Burke wird tot in der Sauna seines Fitnessstudios gefunden. Jemand hat ihn zuerst niedergeschlagen und dann in der heißen Kabine eingesperrt. Zunächst gerät Archibald Vale ins Visier von Lauras Ermittlungen. Eine Kundin des Studios hat sich darüber beschwert, dass er sie ständig anstarrt. Doch Vale hatte keinen Grund, Burke zu ermorden - im Gegenteil: Burke half ihm, wo er konnte, denn Vale ist obdachlos. Durch Burkes Frau Celia hat Laura schließlich eine Idee ...

    Regie: Norman Buckley
    Drehbuch: Marc Dube
    Komponist: Joey Newman
    Kamera: Tim Norman
    Schnitt: Lawrence A. Maddox

    Darsteller:
    Debra Messing (Laura Diamond)
    Josh Lucas (Jake Broderick)
    Laz Alonso (Billy Soto)
    Janina Gavankar (Meredith Bose)
    Max Jenkins (Max Carnegie)
    Sherri Saum (Cecilia Burke)
    Isaac Caldiero (Connor McKenna)
    Callie Thorne (Captain Nancy Santiani)
    Malachy Cleary (Chief D'Angelo)
  widescreen: true
