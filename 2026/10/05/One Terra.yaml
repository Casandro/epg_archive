  title: Planet Weltweit - Gorgona - Gefangen im Paradies
  subtitle: Planet Weltweit - Gorgona - Gefangen im Paradies
  description: Gorgona, die kleinste Insel des toskanischen Archipels, ist die letzte Strafkolonie Europas. Hier leben die Gefangenen unter freiem Himmel inmitten der mediterranen Macchia, umgeben von Weinhügeln, Olivenhainen und steilen Klippen, die von den Wellen des Tyrrenischen Meers umspült werden. Ein Paradies, aus dem man nicht entfliehen kann. Doch Mauern gibt es in diesem Gefängnis nicht und die Zellentüren stehen offen. Nur nachts werden sie abgeschlossen. Am Tag bewegen sich die meisten der 85 männlichen Gefangenen frei auf dem 2,23 Quadratkilometer großen Eiland. Das Meer, mit seinen 34 Kilometern bis zum Festland, ist die eigentliche Mauer. Vom höchsten Gipfel der Insel blickt man in allen Himmelsrichtungen nur auf Wasser. DE 2024
