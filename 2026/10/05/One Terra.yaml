  title: Planet Weltweit - Indiens Dschungelbuchklinik
  subtitle: Planet Weltweit - Indiens Dschungelbuchklinik
  description: 'Ein Brüllen erschallt im Wald, laut und kreischend, dann bricht der junge Elefant durch die Blätter,. Er gehört zu einer Herde von verwaisten Jungtieren, die in Indiens einzigem wissenschaftlich geführten Rehabilitationszentrum für Wildtiere auf ihre Auswilderung vorbereitet werden. Ein Tierarztehepaar kümmert sich hier um Tiger, Panther, Nashörner und all die anderen Tiere, die wir aus dem Dschungelbuch kennen. Immer häufiger geraten die Wildtiere mit der Zivilisation in Konflikt. Die Dokumentation begleitet die Tierretter bei ihren Einsätzen in der Wildnis und in den Dörfern am Brahmaputra. Die Tierärztin Phulmoni Gogoi greift ihren Arztkoffer und springt in den Wagen. Sie hat einen Anruf bekommen. Ein Nashorn wurde gewildert und liegt schwer verletzt im Nationalpark. Es lebt noch, obwohl das Horn abgesägt wurde. Doch die Rettungsversuche der Tierärztin kommen zu spät - das Tier verblutet. Ihr nächster Fall an diesem Tag könnte glimpflicher enden: Ein Sambar-Hirsch ist auf den Reisfeldern aufgetaucht. Dorfbewohner haben ihn eingefangen. Gogoi muss nachschauen, wie es dem Tier geht und es an einen Ort bringen, an dem es sicher ist, sicher vor den Menschen. Im dicht besiedelten Indien ist nur wenig Lebensraum für die Tiere übrig geblieben. Überall säumen Hütten die Straßen, wird Reis und Tee angebaut. Der Kaziranga Nationalpark ist mit etwa 430 Quadratkilometern eine Insel inmitten der Zivilisation, wenn auch nur halb so groß wie Hamburg. Jedes Wildtier, das sich aus dem Park herauswagt, fällt auf und stört. Elefanten und Nashörner können auf den Äckern große Schäden anrichten, Tiger und Leoparden machen den Menschen Angst. Phulmoni Gogoi, ihr Mann Dr. Prasanta Boro und der Wildlife Trust, für den sie arbeiten, wollen die Landbevölkerung aufklären und als Unterstützer gewinnen. Mittlerweile ist der Verlust an wilden Tieren so groß, dass jedes einzelne für den Bestand Bedeutung hat. Die Ärzte wollen jedes Exemplar retten. DE 2010'
