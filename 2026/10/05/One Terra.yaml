  description: Bis zu 150-mal am Tag taucht Marie Velakutshi in die Tiefen des Kongo-Flusses, um Muscheln heraufzuholen. Eine anstrengende und gefährliche Arbeit. Denn die Strömung im Fluss ist stark und droht Marie immer wieder hinauszuziehen. Doch etwas anderes bleibt der jungen Frau nicht übrig. Es ist die einzige Arbeit, die sie kennt und mit der sie Geld verdienen kann. Die Muschelsuche ist hier traditionell Frauensache. Doch wie lange können Marie und ihre Kolleginnen diese kräftezehrende Arbeit noch ausführen? Die Muscheln werden weniger, Umweltschutzauflagen drohen. Auch möchte Marie, dass ihre Kinder eines Tages eine leichtere Arbeit finden. Möglicherweise gehört sie damit zu den letzten Muscheltaucherinnen im Kongo-Delta. DE 2024
