  title: Planet Weltweit - Mit der Lok durch Angola
  subtitle: Planet Weltweit - Mit der Lok durch Angola
  description: |-
    Angola, Land im Umbruch. Gebeutelt durch den jahrzehntelangen Bürgerkrieg, erlebt der afrikanische Staat am Atlantischen Ozean heute einen Wirtschaftsboom - allerdings nur für ausgewählte Kreise: Während in der Hauptstadt Luanda durch massive Ölförderung die Preise in exorbitante Höhen steigen und eine wirtschaftliche Entwicklung nie gekannten Ausmaßes ankurbeln, bleiben die ländlichen Regionen isoliert. Doch das soll nun anders werden: Mit dem Wiederaufbau der alten Benguela-Bahnlinie, so hoffen die Menschen jenseits der Hauptstadt, sollen auch sie vom Handel profitieren und ein besseres Leben bekommen. Die Dokumentation hat den Mechaniker Joaquim Mohebe und seine instandgesetzte Dampflok auf ihrem Weg durch Angola begleitet.
    Seit über 50 Jahren ist Joaquim Mohebe bei der angolanischen Benguela-Bahn als Inspektor angestellt, mit Haut und Haaren hat er sich der alten Linie verschrieben. Doch seit in den 1980er Jahren alle Lokomotiven im Bürgerkrieg verbrannt wurden, ist der Bahnbetrieb unterbrochen. Verfallene Züge und Waggons, ein völlig verwildertes Schienennetz, permanenter Mangel an Ersatzteilen - das soll nun endlich der Vergangenheit angehören: Der einst größte Arbeitsgeber und das wichtigste Transportmittel im Hochland von Huambo wird wieder zum Leben erweckt. 1903 war mit dem Bau der Bahnlinie begonnen worden. Sie führte von der Atlantikküste 1300 Kilometer bis zur Grenze der Demokratischen Republik Kongo. Von dort gab es Zugverbindungen bis an die Küste des Indischen Ozeans - nach Dar es Salam in Tansania. Angolas Hochland gehört zu den fruchtbarsten Regionen Afrikas. Doch während des Krieges wurden die Bauern vertrieben und ihre Dörfer verwüstet. Die Menschen erlitten eine grausame Hungersnot. Bis heute müssen zwischen 60 und 70 Prozent der benötigten Lebensmittel aus dem Ausland importiert werden. DE 2009
