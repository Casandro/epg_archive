  title: Planet Weltweit - Biber, die Baumeister an der Elbe
  subtitle: Planet Weltweit - Biber, die Baumeister an der Elbe
  description: Über viele Jahrzehnte war der Biber in Deutschland beinahe ausgestorben. Nur knapp 200 Tiere hatten entlang der Elbe überlebt. Dem Einsatz engagierter Tierschützer ist es zu verdanken, dass sich ihr Bestand bis heute erholt hat. Tausende Tiere bevölkern wieder die Flüsse und Seen Deutschlands. Es gibt sogar so viele Biber, dass sie mancherorts für Konflikte sorgen, etwa durch von den "Baumeistern" verursachte Überschwemmungen. Doch was ist der richtige Umgang mit jungen Bibern, die auf der Suche nach einem eigenen Revier Bäche und Flüsse stauen und dazu noch Schäden in der Landwirtschaft anrichten? Peter Ibe ist Biberschützer aus Leidenschaft. Schon in den 1970er Jahren engagierte sich der Biologe an der Elbe und half bei Umsiedlungsprojekten mit, um die letzten heimischen Biber zu retten. Hunderte Tiere fing er damals. Und seine Bemühungen haben sich ausgezahlt, denn bis heute hat sich die Zahl der Biber auf mehrere Tausend erhöht. Ein großer Erfolg. Doch bei aller Freude über das geglückte Comeback gibt es inzwischen auch kritische Stimmen, die eine Bestandsregulierung und den Abschuss von "Problem-Tieren" fordern, wenn sie Flüsse anstauen oder Schäden in der Landwirtschaft anrichten. Auch der zunehmende Straßenverkehr und die Rückkehr der Wölfe bedrohen den Biber. Peter Ibe und seine Mitstreiter beobachten diese Entwicklungen sehr genau und hoffen, dass sich das Gleichgewicht in der Natur von allein regeln wird. Bis dahin setzen sie weiter auf die Rettung der Biber und sind zur Stelle, wenn einer von ihnen zum Beispiel mal wieder in einen Garten eingedrungen ist. Ibes Kollegin, die Biberberaterin Annett Schumacher, hat gerade einen verletzten Jungbiber gefangen, den sie nun gesundpflegen und wieder aussetzen möchte. DE 2020
