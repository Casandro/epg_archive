  subtitle: Planet Weltweit - Brasiliens Regenwald - Zurück in die Zukunft
  description: 'Die Amazonasregion gilt als der größte tropische Regenwald der Welt. Er ist Heimat Tausender Tier- und Pflanzenarten - und mehrerer indigener Völker, die in den letzten Jahren zunehmend die Lebensweise der westlichen Moderne annahmen. Doch die Hoffnung auf Wohlstand wurde vielerorts enttäuscht - dagegen griffen Krankheiten, Armut und Verwahrlosung um sich. Inzwischen hat ein Umdenken eingesetzt. In immer mehr Indigenen-Dörfern besinnen sich die Menschen auf ihre alte Lebensweise, bauen Maniok und Kakao an und forsten gerodete Flächen mit einheimischen Pflanzenarten auf. Das wiederum verspricht einen wichtigen Nebeneffekt zu haben: Ist die alte Lebensweise ein Weg, um dem drohenden Verschwinden des Regenwaldes entgegenzuwirken? DE 2023'
