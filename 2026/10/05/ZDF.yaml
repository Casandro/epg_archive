  description: |-
    Actionserie, Deutschland / Österreich 2023
    Nach einem Streit mit seiner Mutter Mona wird Karl von einer Unbekannten auf der Skipiste verfolgt. Mona versucht, ihren Sohn einzuholen, wird aber von der Frau von der Piste gedrängt.

    Kurze Zeit später geht bei den Bergrettern ein anonymer Notruf ein. Während Markus vermutet, dass die Zeugin keine Unbekannte ist, machen sich Karls Eltern zunehmend Sorgen, weil ihr Sohn nicht ans Telefon geht.
