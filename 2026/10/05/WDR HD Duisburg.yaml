  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Viele haben in der Kindheit verlassene Gärten und Häuser erkundet, um darin versteckte Schätze zu suchen oder sich vorzustellen, welche abenteuerlichen Geschichten sich hinter einsamen, efeubewachsenen Mauern zugetragen haben könnten? Nach solchen Orten sucht SWR-Moderatorin Anna Lena Dörr in der Eifel. Auf ihrer Expedition entdeckt sie schlafende Dornröschen und solche, die bereits wachgeküsst wurden. Ein Geisterdorf, eine verlassene Mühle, eine Künstler:innen-Siedlung mitten im Wald, Orte der Stille, Klöster, karge Burgruinen und ein mittelalterlicher Stollen zwischen zwei Maaren liegen auf ihrem Weg durch diese herbe Landschaft.
