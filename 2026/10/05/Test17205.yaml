  title: La culture en films
  description: 2025 (2/5) L'encre ne sera jamais sèche ! Classique du théâtre, Le Tartuffe crée par Molière en 1664 est une pièce follement contemporaine. Tartuffe est une pièce sur l'emprise, la manipulation. Comment des individus ont soudain de l'ascendant sur d'autres ? Ont-ils un système ? Quel est le mécanisme, le dispositif qui permet à un "Monsieur tout le monde" de prendre le pouvoir ? Comment des gens perdent la tête tout à coup et se livrent corps et âme à une personnalité destructrice ? Autant de questions auxquelles Jean Liermier et Romain Girard tenteront de répondre. (Suisse-2025)
