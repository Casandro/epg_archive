  description: 'Ein Unbekannter wird nachts im Wald tot aufgefunden. Die beiden Hauptkommissare Herbert Schmücke und Herbert Schneider werden zum Tatort gerufen. Alles deutet zunächst auf einen Unglücksfall hin: Autounfall mit Fahrerflucht. Erst aufgrund einer Vermisstenanzeige sind Schmücke und Schneider in der Lage, den Toten zu identifizieren. Es handelt sich um den berühmten Läufer Andrej Naumow. Er und seine Schwester Olga waren Mitte der 1980er-Jahre ein Aushängeschild der sowjetischen Leichtathletik. Jetzt sollten sie in Halle als Favoriten an einem City-Lauf teilnehmen.'
