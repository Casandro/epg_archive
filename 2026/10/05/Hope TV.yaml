- eventId: 1296016
  start: 2026-10-05T01:00:00Z
  stop: 2026-10-05T01:30:00Z
  title: Bibelkompass
  subtitle: Gottes Liebe meint auch dich
  description: |-
    Viele Menschen kennen Liebe als etwas Bedingtes: Wer Erwartungen erfüllt, wird angenommen. Gottes Liebe ist anders. Sie ist nicht abhängig von Leistung, Vergangenheit oder Versagen. An der Geschichte von Maria Magdalena wird sichtbar, wie Jesu Liebe befreit, Schuld vergibt und ein verletztes Herz heilt. Die Bibel zeigt: Gott liebt zuerst. Diese Liebe nimmt Angst, schenkt Würde und verändert das Leben von innen heraus. Wer sie annimmt, entdeckt: Gottes Liebe gilt nicht nur anderen - sie meint ganz persönlich jeden Menschen. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
