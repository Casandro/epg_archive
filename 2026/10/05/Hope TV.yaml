  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Joachim Loh: Die Hälfte für Unternehmen. Die Hälfte für Gott.'
  description: |-
    Mit 28 Jahren übernimmt Joachim Loh die Leitung der Unternehmensgruppe seines Vaters - darunter die bekannte Marke HAILO. Früh entscheidet er sich, unternehmerischen Erfolg und gelebten Glauben bewusst miteinander zu verbinden. Der Wirtschaftsingenieur sammelt internationale Erfahrungen in den USA, reist um die Welt und steht nach der schweren Erkrankung seines Vaters plötzlich vor großer Verantwortung. Neben dem Ausbau der Unternehmen engagiert er sich über Jahrzehnte ehrenamtlich in Gemeinde und christlichen Werken. Seine persönliche Regel: Die Hälfte der Zeit für Unternehmen, die andere für Familie, Gemeinde und Glauben. Heute umfasst die Joachim Loh Unternehmensgruppe sieben Unternehmen mit rund 1.500 Mitarbeitenden und etwa einer halben Milliarde Euro Umsatz. Mit über 80 coacht Joachim Loh noch immer junge Unternehmer, entwickelt 10-Jahres-Pläne - und erzählt, wie er Gott im Berufsleben erlebt hat.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
