  title: Charakterwerkstatt
  subtitle: Vor IHM nichts verbergen | Authentizität und Ehrlichkeit
  description: |-
    Wie ehrlich darf man vor Gott sein, wenn das Leben schwer wird? Hiob spricht offen aus, was ihn quält, und zeigt damit, dass Glaube nicht bedeutet, Schmerz oder Zweifel zu verstecken.

