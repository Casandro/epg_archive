  title: Cliff!
  subtitle: Bekenntnisse eines Wissenschaftsleugners
  description: |-
    In diesem Video hinterfragt Goldstein offen bestimmte wissenschaftliche Theorien über den Ursprung und Sinn des Lebens - und provoziert dabei bewusst. Er spricht darüber, warum er die Vorstellung ablehnt, dass Leben rein zufällig ohne göttliche Beteiligung entstanden ist, und warum er es nicht als Widerspruch sieht, Wissenschaft kritisch zu betrachten. Mit Beispielen von Stephen Hawking bis hin zu kosmologischen Endzeitszenarien zeigt er, dass Ablehnung ein fester Bestandteil wissenschaftlichen Fortschritts ist - und dass fast jeder "einen Teil der Wissenschaft" leugnet. Am Ende stellt er die Frage: Wenn er ein Wissenschaftsleugner ist - sind wir es dann nicht alle ein Stück weit?

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
