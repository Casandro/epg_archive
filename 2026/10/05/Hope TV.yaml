- eventId: 1296016
  start: 2026-10-05T01:00:00Z
  stop: 2026-10-05T01:30:00Z
  title: Bibelkompass
  subtitle: Gottes Liebe meint auch dich
  description: |-
    Viele Menschen kennen Liebe als etwas Bedingtes: Wer Erwartungen erfüllt, wird angenommen. Gottes Liebe ist anders. Sie ist nicht abhängig von Leistung, Vergangenheit oder Versagen. An der Geschichte von Maria Magdalena wird sichtbar, wie Jesu Liebe befreit, Schuld vergibt und ein verletztes Herz heilt. Die Bibel zeigt: Gott liebt zuerst. Diese Liebe nimmt Angst, schenkt Würde und verändert das Leben von innen heraus. Wer sie annimmt, entdeckt: Gottes Liebe gilt nicht nur anderen - sie meint ganz persönlich jeden Menschen. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1296074
  start: 2026-10-05T01:30:00Z
  stop: 2026-10-05T02:00:00Z
  title: Songs of Hope
  subtitle: Was uns verbindet
  description: "Was hält uns zusammen, wenn wir unterschiedlich sind, verschiedene Wege gehen oder aus ganz unterschiedlichen Kulturen kommen? \nDiese Folge von Songs of Hope lädt dazu ein, über Gemeinschaft, Liebe und unseren Glauben nachzudenken. Wir entdecken: Liebe kann Brücken bauen. In seiner Liebe kommt Gott uns nahe und verbindet uns mit sich und miteinander. Aus dieser Verbundenheit wächst schließlich eine gemeinsame Mission: die Hoffnung und Liebe Gottes weiterzugeben.\n\nWeitere Infos unter: www.hopetv.de"
  widescreen: true
  hd: true
- eventId: 1296871
  start: 2026-10-05T02:00:00Z
  stop: 2026-10-05T02:40:00Z
  title: Wie man Riesen bekämpft
  subtitle: Krisztian Madarasz - Abenteuer Kirche gründen mit 500 ±
  description: |-
    Krisztian Madarasz ist leidenschaftlicher Gründer. Mit einem anfänglichen Budget von nur 500 EUR. Für ein Jahr gründete er mit Freunden die City Church Frankfurt. Christian ist Vollblutmusiker, schreibt berührende Lieder und möchte Menschen mit modernen Gottesdiensten berühren, um sie wieder zum Staunen zu bringen. "Durch die Musik können wir Gott in einer ganz anderen Tiefe begegnen", so Krisztian. Und so wird der gebürtige Ungar nicht müde immer wieder neu Lieder, die ins Herz gehen, für unsere Generation zu schreiben.

    Mehr Infos zu unserem Mutmach-Projekt "WIE MAN RIESEN BEKÄMPFT?!" findet Ihr hier:
    www.wiemanriesenbekaempft.de
  widescreen: true
  hd: true
