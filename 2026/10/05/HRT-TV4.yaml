  description: Na području Ivanić-Grada i dijela općine Kloštar Ivanić provodi se projekt rekonstrukcije i izgradnje sustava odvodnje otpadnih voda. Radove je naručila Vodoopskrba i odvodnja Zagrebačke županije.  Odransko polje zaštićeno kao značajni krajobraz još 2006. smjestilo se u Posavini, naravno, uz rijeku Odru. Pripada Sisačko-moslavačkoj županiji. Oblikovano je međusobno isprepletenim ekosustavima poplavnih nizinskih šuma, pašnjaka i livada te rijeke Odre i stajaćih voda.  Donosimo strane vijesti o reciklaži plastike u Kazahstanu, zapaljivosti eukaliptusa u Portugalu i projektu vraćanja kamenica u estuarij Humber na istočnoj obali sjeverne Engleske.
