  description: |-
    Deutschland 2018
    Auf und ab, hoch und runter - Aufzüge, Rolltreppen, Seilbahnen und Co. Ihre Erfinder hatten ein Ziel: Höhenunterschiede ohne Anstrengung zu überwinden - oft ein wahrer Drahtseilakt.

    Was hoch hinausging, wurde zunächst mit Argwohn betrachtet. Schließlich war die Höhe Gott vorbehalten, das höchste Gebäude war die Kirche. Heute wächst die Welt nach oben. 2018 kamen weltweit 155 Wolkenkratzer, also Türme ab 150 Meter, dazu.
