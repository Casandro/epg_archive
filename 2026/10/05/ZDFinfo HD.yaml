  title: Der Zweite Weltkrieg
  subtitle: Schlachtfeld Deutschland
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2018
    Im März 1945 haben sich die Alliierten im Osten und Westen tief ins Reich vorgekämpft. Die NS-Diktatur schickt ihr letztes Aufgebot in den aussichtslosen Kampf: Jugendliche und alte Männer.

    Im Pazifik tobt die Schlacht um Iwojima. Die Japaner verteidigen die kleine, aber strategisch wichtige Insel bis zum letzten Mann. Noch vor dem Ende der Kämpfe entsteht eines der bekanntesten Fotos des Zweiten Weltkrieges.
    HD-Produktion
