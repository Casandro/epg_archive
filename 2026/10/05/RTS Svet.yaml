  description: Da li nas veštačka inteligencija zadivljuje ili uznemirava? Da li u budućnost gledamo otvorenih očiju ili strepimo od nje ispunjeni strahovima i nedoumicama? U trenutku kada se svet oko nas menja brzinom svetlosti, na mnogo načina a pre svega tehnološki, novi serijal Obrazovno ? naučnog programa RTS "Kliker za?" ukazuje na to koliko je i dalje moćna ljudska priroda, ali i Priroda uopšte. Kroz dokumentarne emisije predstavljamo pojedince koji zahvaljujući sopstvenom duhu i pameti žive kreativne, ispunjene živote ? pronalazači, profesori, slikari, etnolozi, matematičari, lekari, farmaceuti? Reč je o ljudima koji sopstvenim talentima, interesovanjima i radom čine svet boljim. Pričajući o svojim stvaralačkim strastima, o tome šta ih pokreće, kako hrane duh i mentalnu snagu, podsetiće nas na to šta je suština života i bit opstanka ? ljudskost, kreacija, radoznalost, vitalnost, vredni rad, posvećenost...
