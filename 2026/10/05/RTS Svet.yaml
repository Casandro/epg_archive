  description: Serija prati život prosečne srpske porodice tokom prve polovine devedesetih godina prošlog veka. Nakon što Vukašin ostane bez posla, porodica Golubović je prinuđena da se preseli u kuću njegovih roditelja, Riske i Aranđela. Dok pokušavaju da pronađu sreću u teškim vremenima, Golubovići upadaju u brojne komične situacije i susreću se sa živopisnim likovima koji savršeno oslikavaju ovaj mračan period u istoriji naše zemlje.
