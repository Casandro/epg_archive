    Bangkok, das politische, wirtschaftliche und kulturelle Zentrum Thailands, gehört zu den meistbesuchten Traumstädten der Welt. Es ist eine moderne Großstadt, die niemals schläft.

    Durch Bangkok schlängelt sich der Fluss Chao Phraya. Wer dem Fluss folgt, entdeckt ein weites Netzwerk an Kanälen - die berühmten Khlongs. Sie führen vorbei an Holzhütten, Wolkenkratzern, Tempelanlagen und Parks zu den schönsten Sehenswürdigkeiten der Metropole.
