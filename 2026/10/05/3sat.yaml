  title: Atlantik - Ozean der Extreme (3/3)
  subtitle: Berge der Tiefsee
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mitten im Atlantik, weitab von jeder Küste, erstreckt sich eine Wasserwüste. Dort wachsen keine Pflanzen, bilden sich keine Korallen - es gibt weit und breit kein Lebenszeichen.

    Doch dann tauchen mancherorts wie aus dem Nichts riesige Fischschwärme auf - und mit ihnen ihre Räuber: zum Beispiel Delfine. Geht man Hochseeoasen wie dieser auf den Grund, stößt man fast immer auf Unterwasserberge. Ihre Geschichte beginnt vor 16 Millionen Jahren.
    HD-Produktion
