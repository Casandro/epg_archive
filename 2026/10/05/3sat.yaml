  title: Die Azoren - Grünes Paradies im Atlantik
  subtitle: Film von Claudius Gehr
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mitten im Atlantik schlummert ein grünes Paradies: die Azoren. Neun Inseln vulkanischen Ursprungs zwischen Europa und Amerika. Eine vielseitige Pflanzen- und Tierwelt über und unter Wasser.

    Ein Garten Eden mit exotischer Blütenpracht, der immer noch ein Geheimtipp unter Reisenden und bislang vom Massentourismus verschont geblieben ist. Auf dem zu Portugal gehörenden Archipel befindet sich der höchste Berg des Landes, der Pico, ein erloschener Vulkan.
    HD-Produktion
