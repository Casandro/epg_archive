    Urlaub wird immer teurer. An der Ostsee zeigt sich, wer sich das Paradies noch leisten kann. Auf dem Darß prallen Boom im Camping und Luxus auf unsichere Jobs im Hintergrund.

    Während Stellplätze ausgebucht sind, halbieren sich anderswo die Aufträge. Beschäftigte kämpfen mit hohen Mieten und langen Wegen. Eine Ferienregion zwischen touristischem Erfolg und sozialer Schieflage.
