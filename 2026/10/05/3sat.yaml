  title: Atlantik - Ozean der Extreme (1/3)
  subtitle: Strom des Lebens
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    An Westeuropa grenzt ein Meer, das von Extremen beherrscht wird: der Atlantik. Dort brauen sich starke Stürme zusammen und leben seltene Tierarten. Die Reihe stellt den "Ozean der Extreme" vor.

    Der Golfstrom ist einer der wärmsten und mächtigsten Ströme der Weltmeere. Teil eins zeigt, welche enorme Wirkung der Golfstrom auf den gesamten Nordatlantik hat. Ohne ihn wäre er nicht das, was er ist: das nährstoffreichste und zugleich wildeste Meer der Welt.
    HD-Produktion
- eventId:
  - 889671
  - 893502
  start: 2026-10-05T12:05:00Z
  stop: 2026-10-05T12:50:00Z
  title: Atlantik - Ozean der Extreme (2/3)
  subtitle: Hitze und Hurrikans
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In der Karibik liegt das Sonnenparadies des Atlantiks. In Korallenriffen, Seegraswiesen und Mangrovenwäldern entwickelt sich üppiges Leben.

    Unzählige Fische haben dort ihre Kinderstuben, seltene Kolosse wie die Manatis finden alles, was sie zum Leben brauchen, und Atlantische Fleckendelfine bringen ihre Jungen zur Welt.
    HD-Produktion
- eventId:
