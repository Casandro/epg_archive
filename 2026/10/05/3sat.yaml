  title: La Gomera - Wild, grün, kanarisch
  subtitle: Film von Claudius Gehr
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Eine Insel des ewigen Frühlings: La Gomera ist das zweitkleinste Eiland der Kanaren, grüner, natürlicher und wilder als die großen Inseln des spanischen Archipels im Atlantik.

    Auf La Gomera verfangen sich die Passatwolken in den Bergen und spenden einem jahrtausendealten, immergrünen Nebelwald Feuchtigkeit. Die Felsen vulkanischen Ursprungs schichten sich zu bizarren Formationen auf. Massentourismus blieb der Insel bis heute erspart.
    HD-Produktion
