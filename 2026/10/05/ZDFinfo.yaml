- eventId: 1085604
  start: 2026-10-05T06:15:00Z
  stop: 2026-10-05T07:00:00Z
  title: Hightech für den Alltag
  subtitle: Heizung, Kühlschrank & Co.
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Die menschliche Wohlfühltemperatur liegt um die 20 Grad Celsius - egal, ob unser natürlicher Lebensraum, in dem wir leben, kalt ist oder eher warm. Dabei hilft Hightech im Alltag.

    Wir drehen die Heizung auf, wenn es zu kalt ist, und die Klimaanlage, wenn uns zu warm ist. Wir haben Kühlschränke, um unsere Nahrungsmittel haltbar zu machen. Ohne diesen Kasten würde unsere Ernährung heute anders aussehen. Statt saftigem Steak gäbe es Dörrfleisch.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
