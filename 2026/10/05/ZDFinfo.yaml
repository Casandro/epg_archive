  widescreen: true
  description: |-
    Großbritannien 2021
    Am Anfang war das Feuer. Vor über 400.000 Jahren lernte die Menschheit, das Feuer zu beherrschen, und legte damit den wesentlichen Grundstein für die Entwicklung unserer Zivilisation.

    Vom Feuerzeug des Urmenschen über Eisenverhüttung, die Erfindung von Hochöfen und Dampfmaschinen bis zur Weltraumrakete - die faszinierende Geschichte der Beherrschung des Feuers ist eine Geschichte technologischen Fortschritts.
