  title: Der Zweite Weltkrieg
  subtitle: Verbrannte Erde
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Mitte 1944 nimmt der Krieg auf all seinen Schauplätzen apokalyptische Ausmaße an. Im Pazifik stürzen sich japanische Piloten bei verzweifelten Kamikaze-Angriffen in den Tod.

    An der Ostfront hinterlässt die Wehrmacht auf ihrem Rückzug verbrannte Erde und verwüstet ganze Landstriche. Als sich die polnische Widerstands-Armee erhebt, kennen Hitlers Truppen keine Gnade: Warschau wird völlig zerstört, Hunderttausende Zivilisten ermordet.
    HD-Produktion
