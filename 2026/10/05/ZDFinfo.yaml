  title: Der Zweite Weltkrieg
  subtitle: Apokalypse
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Als Hitler seinem Leben am 30. April 1945 ein Ende setzt, hinterlässt er einen Kontinent im Chaos. Eine Woche später kapituliert die Wehrmacht, und das "Dritte Reich" ist Geschichte.

    Während der Krieg in Europa zu Ende geht, tobt er auf dem pazifischen Kriegsschauplatz mit voller Härte weiter. Bis der Einsatz einer neuen Waffe alles ändert.
    HD-Produktion
