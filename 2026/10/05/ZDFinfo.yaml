    Die Stimmung ist mehr und mehr getrübt. Die Treuhand steuert die Anpassung der ehemals planwirtschaftlich arbeitenden volkseigenen Betriebe der DDR an die neuen Bedingungen der Marktwirtschaft. Im Transformationsprozess bleiben etliche Unternehmen auf der Strecke.
