  subtitle: Die Suche nach Atlantis
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2019
    Atlantis - eine versunkene Zivilisation am Anfang der Zeit. So beschreibt es Platon vor fast 2500 Jahren: ein Inselreich mit prächtiger Natur, faszinierenden Bauten und sagenhaftem Luxus.

    Doch dann soll Atlantis in nur einer Nacht durch ein verheerendes Unglück untergegangen sein. Auf der ganzen Welt suchen Wissenschaftler nach der versunkenen Stadt. Sollte es sie je gegeben haben, dann müssten Hinterlassenschaften der Zivilisation noch existieren.
