  title: Terra X History
  subtitle: Die Jagd nach Hitlers Wunderwaffen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Vor und nach Kriegsende 1945 schwärmen Spezialeinheiten der vier Siegermächte aus, um nach neuesten deutschen Waffenentwicklungen und ihren Wissensträgern zu suchen.

    Es ist die Jagd nach Hitlers sogenannten Wunderwaffen, die eigentlich die Kriegswende hätten herbeiführen sollen - und in geheimen unterirdischen Rüstungsfabriken im Deutschen Reich und besetzten Gebieten entwickelt oder gefertigt wurden.
    HD-Produktion
