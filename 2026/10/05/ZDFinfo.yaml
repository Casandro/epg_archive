    An der Ostfront hinterlässt die Wehrmacht auf ihrem Rückzug verbrannte Erde und verwüstet ganze Landstriche. Als sich die polnische Widerstands-Armee erhebt, kennen Hitlers Truppen keine Gnade: Warschau wird völlig zerstört, Hunderttausende Zivilisten ermordet.
