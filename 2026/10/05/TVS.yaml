  title: 'Doktor z alpejskiej wioski - nowy rozdział: odc.5'
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007) odc.5
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    W wyniku zapalenia opon mózgowo-rdzeniowych zachowanie pacjentki Martina, Leny Aumüller, uległo ogromnej zmianie. Od kilku miesięcy kobieta żyje jako Kim z mężem Leny i jego córką. Nieoczekiwanie Kim znowu staje się Leną, która nie pamięta ostatnich wydarzeń. Wkrótce jej stan się pogarsza.
    Reżyser: Jorgo Papavassiliou
    Od lat: 12
  ageRating: 12
