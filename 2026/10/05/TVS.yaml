  title: 'Wydział kryminalny Kitzbühel: odc.109'
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2017) odc.109
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Christine Klein, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair
    Podczas wędrówki Hannes i hrabina znajdują zdezorientowanego mężczyznę. Okazuje się nim adwokat, który przeszedł niedawno operację przeszczepu serca. W jej następstwie zaczął mieć problemy psychiczne i doświadcza częstych zaników pamięci. Twierdzi, że wszczepiono mu serce, które należało do mordercy.
    Reżyser: Rainer Hackstock
    Od lat: 12
  ageRating: 12
