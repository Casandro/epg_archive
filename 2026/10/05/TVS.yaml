    Biolog morska Christine przyjeżdża do Kornwalii, by odwiedzić ciotkę Holly, która mieszka samotnie w pięknej rodzinnej posiadłości. Na miejscu spotyka tajemniczego Jonathana, podającego się za dziennikarza. Mężczyzna ją fascynuje, lecz ze względu na wcześniejsze przeżycia obawia się ona ponownie zaangażować.
