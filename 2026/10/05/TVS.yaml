  title: 'Doktor Kleist - lekarz rodzinny: odc.16'
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    serial obyczajowy (Niemcy, 2004) odc.16
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser, David Bode, Teresa Weissbach, Martin Goeres, Aline Hochscheid, Alexandra Scheidt
    Anke dostaje przedwczesnych skurczy. Przyjmuje leki, by opóźnić rozwiązanie. Christian wścieka się na von Hatzfelda, który, jak się okazało, wcale nie posiada licencji radiologa dziecięcego. Ten fakt stawia pracę przychodni pod znakiem zapytania. Michael, choć nie pała do radiologa sympatią, postanawia mu pomóc.
