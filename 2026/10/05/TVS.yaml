  title: 'Doktor z alpejskiej wioski - nowy rozdział: odc.6'
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007) odc.6
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Lisbeth Gruber jedzie do szwagra, by porozmawiać o spadku. Kiedy dociera na miejsce, znajduje Ludwiga nieprzytomnego przed chatą. Mimo braku sympatii wobec niego towarzyszy mężczyźnie w szpitalu i niecierpliwie wyczekuje wyników badań. Okazuje się, że może on stracić prawo do korzystania z programu medycznego.
