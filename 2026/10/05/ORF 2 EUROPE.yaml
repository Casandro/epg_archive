  title: kulturMONTAG
  description: "Meilensteine, Moneten & Machthaber\nVor mehr als 20 Jahren haben sie mit ihrer wilden Mischung aus Funk und Disco, Pop und HipHop, Dekadenz und Style im Flug das Publikum erobert. Stillstehen ist ihre Sache nicht und so legt die österreichische Art-Pop-Band Bilderbuch mit \"?+1\" (Unendlich + 1 ) ihr neues Album vor. \n\"Ich bin nicht Künstler, weil es sich rechnet. Ich bin Künstler, weil ich ansonsten sterbe\", sagt Starpianist Igor Levit, der zu Beethovens 200. Todestag alle Sonaten interpretieren wird und mit \"No Silence\" sein eignes Musiklabel gegründet hat. Anlässlich seines Wien-Besuchs trifft Clarissa Stadler den Starpianisten zum Interview. \nSeit dem Machtwechsel im April erlebt Ungarn einen rasanten Umbau - auch in der Kulturszene. Nach 16 Jahren der staatlichen Kontrolle und (Selbst-)Zensur unter der Orbán-Regierung verspüren viele Kulturschaffende in unserem Nachbarland einen neuen Optimismus. Wie schwierig ist es, die Vergangenheit aufzuarbeiten und Freiheit und Selbstbestimmung in den Kulturbereich zurückzubringen?\nModeration: Clarissa Stadler"
  genre:
  - '122'
