  title: Universum History
  subtitle: Der Aufstieg der Habsburger - Schlacht am Marchfeld
  description: "Sie war eine der größten Ritterschlachten der Geschichte und veränderte die Zukunft Europas für immer: die Schlacht am Marchfeld. Am 26. August 1278 standen einander zwei Dynastien gegenüber - der römisch-deutsche König Rudolf I. aus dem Hause Habsburg und Ottokar II. der böhmischen P?emysliden. Der Sieg Rudolfs über Ottokar legte den Grundstein für den beispiellosen Aufstieg des Habsburgerreichs, das in Europa mehr als 6 Jahrhunderte die Fäden ziehen sollte. Die Universum History-Dokumentation folgt in einer großangelegten internationalen Ko-Produktion den Spuren der beiden Widersacher Ottokar und Rudolf (verkörpert von Max Moor) an Originalschauplätze und analysiert den Tag der Entscheidungsschlacht. Der renommierte Prospektions-Archäologe Wolfgang Neubauer vom Ludwig Boltzmann-Institut Wien sucht mit High-Tech-Methoden nach verborgenen Zeugen der Schlacht im Erdreich des Marchfelds. Aktuelle Forschungsergebnisse und aufwändige Spielszenen der dramatischen Schlacht werfen ein neues Licht auf diesen Schicksalstag für ganz Europa. \nBuch und Regie: Fritz Kalteis"
  genre:
