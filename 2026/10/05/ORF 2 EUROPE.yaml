  title: Schurli - Der Liedermacher & Poet Georg Danzer
  description: |-
    (Dokumentation, AUT 2026)
    Für viele seiner Freunde, Fans und Wegbegleiter war er der Schurli, für ein breites Publikum Georg Danzer: Liedermacher, Poet und feinsinniger Intellektueller. Mit seinem Wiener Schmäh und Liedern wie "Jö Schau" oder "Hupf in Gatsch" wurde er bekannt. Doch hinter dem Augenzwinkern steckt weit mehr als Jux und Schlager: politische und poetische, oft melancholische Texte, scharfe Beobachtungen und eine tiefe Nähe zu Menschen am Rand der Gesellschaft. Anlässlich seines 80. Geburtstages erzählt die ORF-Doku Georg Danzers Leben aus seinen Liedern und Texten heraus - mit seltenen Archivaufnahmen, Erinnerungen von Weggefährten und Familie und bislang unveröffentlichten Notizen. Ein persönlicher Blick auf "Schurli Danzer", auf Wien und das Wienerische.
    Regie: Tatjana Berlakovich
