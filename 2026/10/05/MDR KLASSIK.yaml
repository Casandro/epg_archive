  title: MDR KLASSIK - Konzert
  description: "ARD-Konzert\n\nDas Quartett am Ende der Zeit in Lohmar\n\nMichael Nyman: \"Song for Tony\"\nAndrea Falconieri:  Ciaccona aus \"Componimenti Diversi\"\nGero Körner:  Klavierimprovisation\nJohn Surman: \"Caithness to Kerry\"\nRoger Hanschel: \"Was weite Herzen füllt\"\nEtienne Crausaz:\n 1. Allegro\n 2. Adagio malinconico\n 3.\n\nARD-Konzert\n\nDas Quartett am Ende der Zeit in Lohmar\n\nMichael Nyman: \"Song for Tony\"\nAndrea Falconieri:  Ciaccona aus \"Componimenti Diversi\"\nGero Körner:  Klavierimprovisation\nJohn Surman: \"Caithness to Kerry\"\nRoger Hanschel: \"Was weite Herzen füllt\"\nEtienne Crausaz:\n 1. Allegro\n 2. Adagio malinconico\n 3. Cadenza/Vivace\n aus \"Eastern Folk Dances\"\nJonce Hristovski: \"Macedonsko divojce\"\nRoger Hanschel: Interlude \nJohann Sebastian Bach:  Choral \"Ich ruf zu Dir, Herr Jesu Christ\" BWV 639\nGero Körner: \"Shall we be loved\"\nAstor Piazzolla: Suite aus \"María de Buenos Aires\"\n\nNaomi Binder, Violine\nRoger Hanschel, Saxofon\nGero Körner, Piano\nAttila Benkö, Tuba\n\n(Aufnahme v. 19.04.2026, Honrath,  Ev. Kirche)\n\nDie vielseitige Naomi Binder, österreichische Geigerin mit japanischen Wurzeln, trifft auf Roger Hanschel \nmit virtuosen Saxofonklängen und reichhaltigenen Kompositionen. Gero Körners feinsinnige Klangkultur \nam Klavier zwischen Klassik und Jazz ist das Brückenglied zu den kammermusikalischen Wurzeln des \naus Ungarn stammenden Tubisten Attila Benkö, der mit seinem Instrument neue Wege im Konzert beschreitet. \"Was weite Herzen füllt\" hat das Quartett diesen Abend überschrieben und baut damit eine Brücke zwischen\nBarock, Klassik, osteuropäischen Tänzen, Minimal Music und Jazzimprovisation."
