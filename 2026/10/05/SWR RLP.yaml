  audiodesc: true
  description: 'Die Ludwigshafener Gartenstadt ist ein besonderes Viertel: Der erfolgreiche Sänger "Apache 207" ist hier aufgewachsen, zwei Fußballnationalspieler haben hier das Kicken gelernt. Auch architektonisch ist das Viertel gut für Überraschungen. Die auffälligste Siedlung "Der Rote Hof" wurde um 1920 für Kriegsheimkehrende gebaut. Noch immer ist die Siedlung mit den roten Häusern ein echter Hingucker.'
