  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nInterview mit Christoph Maier, Evangelische Akademie Sachsen-Anhalt\nSachsen-Anhalt: Kann die Zivilgesellschaft die AfD überleben?\nDie AfD will der Evangelischen Akademie Sachsen-Anhalt die Fördermittel streichen. Akademie-Direktor Christoph Maier berichtet im Live-Interview, dass viele zivilgesellschaftliche Vereine im Bundesland derzeit damit beschäftigt sind, ihr Überleben zu sichern. Und spricht darüber, was es heißt, mit AfD-Wählern im Gespräch zu bleiben und Menschen zu ermutigen, sich zur Demokratie zu bekennen.\n \n\nKünstler und Diakon: Warum Ralf Knoblauch ?Würdekönige? schnitzt und verschenkt\nWie kann man einen abstrakten Begriff wie Würde sichtbar machen? Der Bonner Diakon und Holzbildhauer Ralf Knoblauch hat dafür seinen eigenen Weg gefunden. In seiner Werkstatt entstehen Figuren aus Eichenholz. Er nennt sie Würdekönige. Und sie symbolisieren: Die Würde des Menschen ist unantastbar. Etwa 1.600 dieser Holzfiguren hat er in den vergangenen 20 Jahren gebaut und sie an Orte in aller Welt verschenkt. Eine Königsfigur steht auf dem Straßenstrich in Essen, eine ist mit Obdachlosen im Bonner Norden unterwegs. Andere sorgen in Kurkliniken oder in Pfarreien für Anregungen.\n\nAm Mikrofon: Luisa Meyer"
