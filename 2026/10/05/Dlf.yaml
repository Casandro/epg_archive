  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Interview mit Christian Maier, Evangelische Akademie Sachsen-Anhalt
    Sachsen-Anhalt: Kann die Zivilgesellschaft die AfD überleben?
    Am Dienstag könnte der Landtag in Sachsen-Anhalt den ersten AfD-Ministerpräsidenten Deutschlands wählen. Das hätte auch Konsequenzen für die Evangelische Akademie Sachsen-Anhalt, denn die AfD will ihr die Fördermittel streichen. Akademie-Direktor Christian Maier berichtet im Live-Interview, dass viele zivilgesellschaftliche Vereine im Bundesland derzeit damit beschäftigt sind, ihr Überleben zu sichern. Und spricht darüber, was es heißt, mit AfD-Wählern im Gespräch zu bleiben und Menschen zu ermutigen, sich zur Demokratie zu bekennen.

    Künstler und Diakon: Warum Ralf Knoblauch ?Würdekönige? schnitzt und verschenkt
    Wie kann man einen abstrakten Begriff wie Würde sichtbar machen? Der Bonner Diakon und Holzbildhauer Ralf Knoblauch hat dafür seinen eigenen Weg gefunden. In seiner Werkstatt entstehen Figuren aus Eichenholz. Er nennt sie Würdekönige. Und sie symbolisieren: Die Würde des Menschen ist unantastbar. Etwa 1.600 dieser Holzfiguren hat er in den vergangenen 20 Jahren gebaut und sie an Orte in aller Welt verschenkt. ...
