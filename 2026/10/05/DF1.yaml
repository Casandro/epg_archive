  title: MareTV
  subtitle: Die griechischen Sporaden - Verstreute Inseln der Ägäis
  description: 'Übersetzt bedeutet Sporaden wörtlich "die, die verstreut sind". Dies beschreibt den griechischen Archipel gut. Zum größten Teil sind die 135 Inseln und Inselchen im Norden nicht vom Massentourismus verwöhnt worden. Stattdessen wurde ein wahres Paradies mit grünen Wäldern, türkisfarbenem Wasser und gemütlichen Buchten bewahrt. Die Landebahn auf der Insel Skiathos ist gefährlich kurz. Flugzeuge sind gezwungen, die Bucht in sehr geringer Höhe anzufliegen, um so schnell wie möglich zu landen. Ein fabelhafter Ort für Flugzeugbeobachter. Der Hollywood-Kultfilm "Mamma Mia" von Abba wurde 2008 auf Skopelos gedreht. Die Drehorte sind jetzt weltberühmt, einschließlich der Kapelle auf dem Felsen: "Agios Ioannis sto kastri".'
