  description: |-
    Die indische Langohrziege Malenki kümmert sich immer noch nur um Tochter Melina. Die Pfleger vermuten, dass sie zu wenig Milch hat und deshalb Sohn Marc nicht trinken lässt. Mit lauten Schreien macht er auf seinen Zustand aufmerksam. Da der Kleine schon sehr viel Gewicht verloren hat, sucht Tierpfleger René Walter nach einer Lösung: Nicht ganz freiwillig wird Ziege Tussi zur Amme erklärt!
    Außerdem in dieser Folge: Training mit Elefantenmädchen Thuza, Futterstress am Gemsen-Buffet, neue Kraken, die so schlau wie Ratten sind und Schnepfenmesserfische, die lebenslang Kopf stehen.
