  description: Der 20-jährige Benjamin Helbig wird nach einer Ohnmacht in die Sachsenklinik eingeliefert. Oberschwester Ingrid erkennt in ihm sofort den Sohn einer verstorbenen Freundin. Vor fünf Jahren wurde bei Benjamin eine Rheumatoide Arthritis diagnostiziert. Prof. Simoni stellt bei Benjamin als Ursache der Ohnmacht eine Herzbeutelentzündung fest. Daraufhin verliert Benjamin nun endgültig den Glauben, jemals wieder ein normales Leben führen zu können. Um ihm wieder neuen Lebensmut zu geben, macht Ingrid ihm die Hoffnung, dass Prof. Simoni eine bessere Therapie als alle bisherigen Ärzte finden wird.
