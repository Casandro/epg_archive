  description: Die Gesangssolistin Marta Kuleva leidet an Heiserkeit, wegen der sie bereits einen Arzt konsultiert hat. Dieser attestierte Marta psychische Ursachen und empfahl ihr eine Auszeit. Mit dem bevorstehenden Konzert im Gewandhaus Leipzig hofft sie, nun wieder richtig durchstarten zu können. Doch zwei Tage vor der Premiere versagt ihre Stimme erneut. Ihr Kollege, der Pauker Tom Kremer, empfiehlt Marta die Sachsenklinik. Dr. Roland Heilmann kann zunächst auch keine körperliche Ursache finden - außer dass die Heiserkeit unmittelbar an Anspannungszustände und damit steigenden Blutdruck gekoppelt ist.
