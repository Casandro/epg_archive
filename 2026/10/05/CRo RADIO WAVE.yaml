  title: Startér
  description: Nový soutěžní ročník hitparády neobjevených je tady. Seznamte se s novou porotou ve složení Idea, Tokyo Drift, Mat213 a hlavně s první sedmičkou nasazených tracků. Kdo bude kat a kdo bude spíš plácat po zádech? Kdo bude arbitrem coolness a swagu? Premiérový díl Startéru 2026/2027 s Martinem Šolcem, Filipem Černým a porotou za mikrofony laďte v pondělí ve 20:00.
- eventId: 1454490
  start: 2026-10-05T19:00:00Z
  stop: 2026-10-05T20:00:00Z
  title: Stage
  description: Na Stagi si dnes poslechneme koncert slovenské kapely Noční jazdci, který odehráli na Radiu FM v rámci koncertní série Pohoda_FM. Noční jazdci je projekt trojice hudebníků, který ve své tvorbě propojuje žánry, jako jsou dub, trance, funk a temnou elektroniku s hlubokými dubovými texturami a groovujícími rytmy. Širší pozornost si získali nominací na Radio Head Awards v kategorii Objev roku v roce 2021, od té doby vystoupili například na festivalech Uprising nebo také Sharpe. V dubnu 2025 vydali debutové album Toto sú Noční jazdci, kterým se etablovali na slovenské alternativní scéně. Stage laďte v pondělí ve 21:00. (repríza)
