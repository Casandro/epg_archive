  subtitle: 'Damaris Kofmehl: Kämpferseele - Wie Gott Geschichten schreibt'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Das Leben schreibt die besten Geschichten und ich muss sie aufschreiben." Damaris Kofmehl hat viel in ihrem Leben erlebt und diese Erfahrungen in zahlreichen Büchern verarbeitet. Dabei hat sie immer wieder das Wirken Gottes gespürt. Im Gespräch mit Moderatorin Bente Rathjen erzählt sie von Verletzungen, Enttäuschungen und Zweifeln - und von einer Berufung, die sie trotz aller Krisen zu einer starken, lebensfrohen Persönlichkeit gemacht hat.'
