  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Elena Schulte ist Evangelistin, Buchautorin, Influencerin, Ehefrau und Mutter von drei Kindern. In ihrer Arbeit als Evangelistin möchte sie bei Frauen, die sich in ihrer Rolle mit kleinen Kindern oder pflegebedürftigen Eltern eingeengt und unbedeutend fühlen, das Bewusstsein dafür wecken, dass sie auch in dieser Phase ein relevanter Teil der Geschichte Gottes mit dieser Welt sind. Im Gespräch mit Detlef Eigenbrodt.'
