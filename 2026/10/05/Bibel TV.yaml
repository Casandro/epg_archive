  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Bauarbeiter Jim Sullivan verliert seinen Job, weil er sich in einem Brief an die Firmenleitung gegen gefährlichen Pfusch am Bau ausgesprochen hat. Nun steht der Familienvater ohne Arbeit da und die Rechnungen wachsen ihm bald über den Kopf. In seinem neuen Job als Leihwagen-Chauffeur bietet sich ihm die Gelegenheit, etwas Geld am Rande zu verdienen, indem er Fahrten für zwielichtige Klientel übernimmt. Als Jim dabei Zeuge eines Mafia-Mordes wird, droht sein Leben gänzlich aus den Fugen zu geraten. Die Polizei will, dass er gegen den Killer vor Gericht aussagt, doch dieser versucht ihn mit Drohungen gegen Jims Familie zum Schweigen zu bringen. Die Bundesmarshalls Monica und Tess organisieren für die Familie ein Zeugenschutzprogramm, was aber bedeutet, dass die Sullivans ihr ganzes Leben, ihre alte Identität und alle Menschen, die ihnen wichtig waren, zurücklassen müssen. Ein hoher Preis, an dem die Familie zu zerbrechen droht. Wird Jim den Mut aufbringen, trotz der Konsequenzen das Richtige zu tun, und werden seine Frau und Töchter dabei zu ihm stehen?'
