  description: 'Für die besonderen Einsätze rund um die Hamburger Reeperbahn hat die Davidwache eine eigene Einheit: 25 Beamte der Dienstgruppe "Operative Aufgaben". Unter der Leitung von René Fernolendt und Thomas Behrendt geht es oft um handfeste Konflikte mit Drogendealern oder betrunkenen Partygängern und um gefährliche Gegenstände wie Messer und Schlagstöcke. Zugleich bleiben die Polizisten bürgernah, machen Selfies bei Junggesellenabschieden und helfen Touristen. Jeden Freitag- und Samstagabend passen sie sich dem Puls des Kiezes an. Die Schichten sind abwechslungsreich, lang und anstrengend.'
