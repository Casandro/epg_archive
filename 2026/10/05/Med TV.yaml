  title: 'Made in Med: Craft of Wood Sculpture'
  subtitle: ' '
  description: Stepping into Manuel's home feels like entering a living museum, filled with original furniture and handcrafted pieces created throughout his career. For more than 50 years, Manuel has dedicated himself to woodcraft, learning his trade from his mentor Paul Calleja, who studied woodworking in England and passed on his passion for the craft. In more recent years, Manuel also discovered the value of discarded timber, giving old wood a new purpose and transforming forgotten materials into unique works of art. Fadi explores his remarkable joumey and the craftsmanship behind a lifetime spent working with wood.
