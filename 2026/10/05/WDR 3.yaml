  stop: 2026-10-05T20:00:00Z
  title: ARD Konzert
  subtitle: 'Moderation: Johannes Zink'
  description: "Die vielseitige Naomi Binder, österreichische Geigerin mit japanischen Wurzeln, trifft auf Roger Hanschel mit virtuosen Saxofonklängen und reichhaltigenen Kompositionen. Gero Körners feinsinnige Klangkultur am Klavier zwischen Klassik und Jazz ist das Brückenglied zu den kammermusikalischen Wurzeln des aus Ungarn stammenden Tubisten Attila Benkö, der mit seinem Instrument neue Wege im Konzert beschreitet. \"Was weite Herzen füllt\" hat das Quartett diesen Abend überschrieben und baut damit eine Brücke zwischen Barock, Klassik, osteuropäischen Tänzen, Minimal Music und Jazzimprovisation.\n<strong>Michael Nyman<br/></strong><em>\"</em>Song for Tony<em>\"</em><br/>(Bearbeitung von Roger Hanschel)\n<strong>Andrea Falconieri<br/></strong>Ciaccona aus \"Componimenti Diversi\"\n<strong>Gero Körner</strong><br/>Klavierimprovisation\n<strong>John Surman<br/></strong>\"Caithness to Kerry\"<br/>(Bearbeitung von Roger Hanschel)\n<strong>Roger Hanschel<br/></strong>\"Was weite Herzen füllt\"\n<strong>Etienne Crausaz<br/></strong>1. Allegro<br/>2. Adagio malinconico<br/>3. Cadenza/Vivace<br/>aus \"Eastern Folk Dances\"<br/>(Bearbeitung von Roger Hanschel)\n<strong>Jonce Hristovski<br/></strong>\"Macedonsko divojce\"<br/>(Bearbeitung von Roger Hanschel) \n<strong>Roger Hanschel<br/></strong>Interlude \n<strong>Johann Sebastian Bach<br/></strong>Choral \"Ich ruf zu Dir, Herr Jesu Christ\" BWV 639<br/>(Bearbeitung von Roger Hanschel)\n<strong>Gero Körner<br/></strong>\"Shall we be loved\"\n<strong>Astor Piazzolla<br/></strong>Suite aus \"María de Buenos Aires\"<br/>(Bearbeitung von Steven Verhelst)\n<strong>Quartett am Ende der Zeit<br/></strong>Naomi Binder, Violine<br/>Roger Hanschel, Alt- und Sopransaxofon<br/>Gero Körner, Klavier<br/>Attila Benkö, Tuba\n<a name=\"_Hlk176260359\">Aufnahme vom 19. April 2026 in der </a>Evangelischen Kirche in Lohmar-Honrath\nModeration: Johannes Zink<br/>Redaktion: Martin Bürkl"
