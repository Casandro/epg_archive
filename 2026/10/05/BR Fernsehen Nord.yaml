  title: Nashorn, Zebra & Co (323)
  subtitle: Zoogeschichten aus München
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Tierärzte kontrollieren beim Stumpfkrokodil, wie sich das verletzte Auge entwickelt hat. Aus dem Afrikarevier gibt es gute Nachrichten: Bei den Elen-Antilopen wurde das erste Kitz geboren. Celina weiß, warum die Schildkröten total sauer sind, die Kraftprotze schieben sich schon wieder gegenseitig durchs Gehege. Auf der Südamerika-Anlage entpuppt sich der weiße Nandu-Hahn als stürmischer Liebhaber.
    Warum die Hellabrunner Wölfe den Rasenmäher da haben, ob Aras bei ihren Nachbarn einen schlechten Ruf haben - diese und noch viele andere Geschichten gibt es in "Nashorn, Zebra & Co" aus dem Münchner Tierpark Hellabrunn.
