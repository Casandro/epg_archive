  title: Bergwelten - Der Erzberg
  subtitle: Bergwelten - Der Erzberg
  description: 'Bergwelten: Tief im Herzen der Steiermark steht ein besonderer Berg. Scheinbar nackt, gerade einmal 1.500 Meter hoch, aber unendlich wertvoll. Ein Berg von ökonomischer und kultureller Größe, eingebettet in eine wildromantische Gebirgswelt. AT 2019'
- eventId: 1423605
  start: 2026-10-05T00:50:00Z
  stop: 2026-10-05T01:40:00Z
  title: Faszination Heimat - Kraft des Feuers
  subtitle: Faszination Heimat - Kraft des Feuers
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Meteorologen und Geophysiker Norbert Span. Dank seiner sehr persönlichen und mitreißenden Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Feuer - furchteinflößend, anziehend und gewaltig...     AT 2013'
- eventId: 1423606
  start: 2026-10-05T01:40:00Z
  stop: 2026-10-05T02:27:00Z
  title: Heimatleuchten - Innsbruck im Winter - Hauptstadt der Alpen
  subtitle: Heimatleuchten - Innsbruck im Winter - Hauptstadt der Alpen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2019'
- eventId: 1423607
  start: 2026-10-05T02:30:00Z
  stop: 2026-10-05T02:50:00Z
  title: Altai - Ein unverhofftes Glück
  subtitle: Altai - Ein unverhofftes Glück
  description: Im Frühjahr 2014 brechen die deutschen und österreichischen Ski-Alpinisten David Pitschmann, Fabian Lentsch, Joi Hoffmann, Michael Trojer und Jakob Schweighofer zu den entfernten russischen Altai-Bergen auf - voller Hoffnung, dort ein Ski-Paradies zu entdecken. Nach einer langen Reise kommen die Sportler an einem kleinen Holzschuppen an, der sich in Kurai, einem russischen Bauerndorf, befindet. Als die ersten Sonnenstrahlen in ihr Zimmer scheinen, öffnen sie die Vorhänge und sehen das gesamte Altai-Massiv vor sich - unberührt und unglaublich schön. Würden sich die dortigen Bedingungen zum Skifahren eignen? Was sie schließlich im Herzen dieser himmelhohen Berge finden, übertrifft all ihre Vorstellungen - ein wahrhaft unverhofftes Glück!  DE 2015
