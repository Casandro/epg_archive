  title: White Wedding
  subtitle: White Wedding
  description: 'In JACKSON HOLE, WYOMING, war der unerbittliche Winter 2017 einer für die Rekordbücher. Erleben Sie diese epische 600-Zoll-Saison noch einmal in Storm Shows neuestem Ski-/Fahr-/Adrenalinfilm WHITE WEDDING. Zu den Highlights gehören: NECK DEEP POWDER, MASSIVE AIRS & WAHRSCHEINLICHE ERSTE ABSTIEGE, das atemberaubende SNOWPOCALYPSE-Event und eine 40-Meilen-EXPEDITION in das Herz der WIND RIVER RANGE. Begleitet von einem boomenden Soundtrack von GAMBLE, SID FLY & SIX O''CLOCK, KOOL KARLO und QUEEN OF NOISE wird Sie der 18. jährliche Skifilm der Storm Show mit Sicherheit in winterlicher Ehe zurücklassen, bis der Sommer Sie trennt US 2017'
- eventId: 1423621
  start: 2026-10-05T05:45:00Z
  stop: 2026-10-05T06:41:00Z
  title: After Dark
  subtitle: After Dark
  description: |-
    Die Erde dreht sich und die Sonne verschwindet hinter dem Horizont. Leg den Schalter um und die Lichter gehen aus. Der Schlaf beginnt und der Geist erwacht, entführt uns an Orte, an denen wir noch nie waren, und wir werden Zeuge von Dingen, die wir noch nicht gesehen oder uns vorgestellt haben.Von den verzauberten Pulverwäldern Japans, den historischen Straßen Moskaus bis zu den aufgetauten Bergen Westamerikas und überall dazwischen - Level 1 lädt Sie in unser Spektrum der Realität ein, um eine Abfolge von Bildern, Visionen, Geräuschen und Empfindungen zu sehen im Gegensatz zu denen der bewussten Welt. Erleben Sie es selbst - unseren Traum, unsere Vision vom Skifahren. Nach Einbruch der Dunkelheit.
     US 2011
- eventId: 1423645
