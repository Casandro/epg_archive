- eventId: 834705
  start: 2026-10-05T18:00:00Z
  stop: 2026-10-05T20:00:00Z
  title: ARD Konzert
  description: "Michael Nyman:\n\"Song for Tony\" (Bearbeitung von Roger Hanschel)\n\nAndrea Falconieri:\nCiaccona aus \"Componimenti Diversi\"\n\nGero Körner:\nKlavierimprovisation\n\nJohn Surman:\n\"Caithness to Kerry\" (Bearbeitung von Roger Hanschel)\n\nRoger Hanschel:\n\"Was weite Herzen füllt\"\n\nEtienne Crausaz:\n1. Allegro\n2. Adagio malinconico\n3. Cadenza/Vivace aus \"Eastern Folk Dances\" (Bearbeitung von Roger Hanschel)\n\nJonce Hristovski:\n\"Macedonsko divojce\" (Bearbeitung von Roger Hanschel) \n\nRoger Hanschel:\nInterlude \n\nJohann Sebastian Bach:\nChoral \"Ich ruf zu Dir, Herr Jesu Christ\" BWV 639 (Bearbeitung von Roger Hanschel)\n\nGero Körner:\n\"Shall we be loved\"\n\nAstor Piazzolla:\nSuite aus \"María de Buenos Aires\" (Bearbeitung von Steven Verhelst)\n\nQuartett am Ende der Zeit:\nNaomi Binder, Violine\nRoger Hanschel, Alt- und Sopransaxofon\nGero Körner, Klavier\nAttila Benkö, Tuba\n\nKonzertaufnahme vom 19. April 2026 in der Evangelischen Kirche in Lohmar-Honrath\n\nDas Quartett am Ende der Zeit ist eine einmalige Spezialbesetzung mit Geige, Saxofon, Klavier und Tuba und verschmilzt Barock, Klassik, Balkanklänge und Minimal Music zu verblüffendem \"Sinfonischen Kammerjazz\".\nDie vielseitige Naomi Binder, österreichische Geigerin mit japanischen Wurzeln, trifft auf Roger Hanschel mit virtuosen Saxofonklängen und reichhaltigen Kompositionen. Gero Körners feinsinnige Klangkultur am Klavier zwischen Klassik und Jazz ist das Brückenglied zu den kammermusikalischen Wurzeln des aus Ungarn stammenden Tubisten Attila Benkö, der mit seinem Instrument neue Wege im Konzert beschreitet. \"Was weite Herzen füllt\" hat das Quartett diesen Abend überschrieben und baut damit eine Brücke zwischen Barock, Klassik, osteuropäischen Tänzen, Minimal Music und Jazzimprovisation."
- eventId: 834706
  start: 2026-10-05T20:00:00Z
  stop: 2026-10-05T21:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Konrad Bott'
  description: |-
    Die Ruhe im Sturm - Camila Nebbia und ihr Saxofon

    Ein Fluss fragt nicht, ob er fließen darf. Ein Vulkan bricht nicht aus, weil er bösartig ist. So stoisch und doch gleichzeitig dringlich wie Naturgewalten, zeigt sich auch Camila Nebbia mit ihrem Saxofon. Woher kommt es, dass sie einen so chaotisch komplexen Klang entwickelt hat? Warum sind Reibung im Klang und Zerstörung von Sicherheiten beim Hören so wichtig für die Saxofonistin, die so umgänglich und sanftmütig scheint? Lassen Sie sich überraschen und lernen sie Camila Nebbia kennen, die 2026 beim traditionsreichen NEWJazz Meeting den Ton angeben wird.

    Moderation: Konrad Bott
