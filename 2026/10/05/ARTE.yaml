  title: 'B comme Berlin : une capitale se réunifie'
  subtitle: Pauvre, mais sexy ! S01 E04.
  genre:
  - '144'
  description: 'Mais ce dernier a laissé derrière lui une ville criblée de dettes : Thilo Sarrazin, qui tient les cordons de la bourse, impose une politique d''austérité qui le rend vite impopulaire, faite de privatisations et de vente de terrains communaux à des promoteurs immobiliers. Wowereit mise également gros sur le tourisme. Pour redynamiser Berlin à peu de frais, il lui invente une devise qui fera mouche : "pauvre mais sexy". Forte de cette aura de métropole alternative et décontractée, la ville connaît un véritable boom touristique, et devient, dans les années 2000, l''une des grandes capitales européennes de la fête - loin, pourtant, des préoccupations de ses habitants. Capitale ingouvernable À qui appartient Berlin ? À ses élites ou à ses marges ? C''est le fil rouge de cette foisonnante série documentaire qui balaie, en cinq épisodes, plus de trois décennies d''une histoire politique, économique, culturelle et contre-culturelle d''une richesse exceptionnelle. Plus que toute autre métropole européenne, la capitale allemande, traversée depuis 1989 par des mouvements contraires, objet d''utopies populaires, de rêves de grandeur ou d''appétits financiers, semble parfois ingouvernable. Depuis leur point de vue singulier, une multitude d''acteurs - des maires successifs de Berlin au banquier, du promoteur immobilier au squatteur, du sociologue au rappeur ou à l''exploitant de club techno - racontent comment la ville autrefois divisée est devenue ce qu''elle est aujourd''hui : une métropole multiculturelle profondément originale. Réalisateur: Florian Opitz (2023)'
