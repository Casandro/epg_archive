  title: 'B comme Berlin : une capitale se réunifie'
  subtitle: Main basse sur la ville S01 E05.
  genre:
  - '144'
  description: 'Quand la crise financière de 2008 atteint Berlin, c''est avec une conséquence paradoxale : avec leurs loyers encore modiques, ses immeubles à rénover attirent les spéculateurs de tout poil. Nouvel eldorado immobilier, la ville connaît un processus de gentrification fulgurant, dont les habitants paient chèrement le prix. Comme un symbole de cette folie spéculative qui menace de changer le visage de la ville, l''emblématique squat d''artistes Tacheles est racheté en 2014 par une banque d''affaires new-yorkaise, qui y installe bureaux et appartements de haut standing. Malgré un gel provisoire, les loyers ont explosé en dix ans, suscitant une fronde populaire contre l''appétit sans fin des promoteurs immobiliers. Entre organisations de quartier et référendums citoyens, les Berlinois n''ont pas dit leur dernier mot. Capitale ingouvernable À qui appartient Berlin ? À ses élites ou à ses marges ? C''est le fil rouge de cette foisonnante série documentaire qui balaye, en cinq épisodes, plus de trois décennies d''une histoire politique, économique, culturelle et contre-culturelle d''une richesse exceptionnelle. Plus que toute autre métropole européenne, la capitale allemande, traversée depuis 1989 par des mouvements contraires, objet d''utopies populaires, de rêves de grandeur ou d''appétits financiers, semble parfois ingouvernable. Depuis leur point de vue singulier, une multitude d''acteurs - des maires successifs de Berlin au banquier, du promoteur immobilier au squatteur, du sociologue au rappeur ou à l''exploitant de club techno - racontent comment la ville autrefois divisée est devenue ce qu''elle est aujourd''hui : une métropole multiculturelle profondément originale. Réalisateur: Florian Opitz (2023)'
