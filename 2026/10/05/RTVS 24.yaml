  title: Občan za dverami (24)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Dnešný svet je rýchly a uponáhľaný. Na chyby neexistuje priestor. Zákony či predpisy totiž zľutovanie nemajú. Presvedčil sa o tom aj pán Jozef. Pri kúpe diaľničnej známky si v evidenčnom čísle pomýlil jedno písmeno. Prišiel na to až po takmer dvoch rokoch, keď celkový sumár pokút narástol na 1800 eur... Kúpil budovu v areáli bývalého družstva. Pôvodná príjazdová cesta sa však medzičasom stala minulosťou. Skratku nahradila dlhšia cesta cez celý areál, no čo je horšie - po cudzích pozemkoch. Pán Marko sa obáva, že sa jedného dňa nebude môcť k svojej nehnuteľnosti dostať... Pani Elvíra zo Zohora má za suseda železničnú stanicu. Na vlaky a čulý staničný ruch si za tie roky zvykla. Tento rok sa ale čosi zmenilo. Hlásenia staničného rozhlasu sú, podľa nej, oveľa hlasnejšie ako predtým... (2026)
  genre:
  - '34'
