  title: Laboratoř
  description: Jak různorodé jsou potravní strategie půdních živočichů? Co ohrožuje opylovače zemědělských plodin? Jak klimatické extrémy působí na škůdce? Debatují půdní biolog Ladislav Miko, molekulární genetik Jan Pačes a student Dalibor Libus. Moderuje Martina Mašková.
