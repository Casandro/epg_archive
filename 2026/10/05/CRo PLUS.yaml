- eventId: 1454209
  start: 2026-10-05T01:05:00Z
  stop: 2026-10-05T01:33:00Z
  title: Leonardo Plus
  description: 'Párový terapeut Honza Vojtko říká: "Sourozenci jsou naše první vrstevnická laboratoř" Jak se díky nim učíme řešit konflikty? Definuje nás nějak pořadí, ve kterém se narodíme? Jsou jedináčci větší sobci? A jak nás mohou sourozenci ovlivňovat, když si hledáme intimního partnera? Ptá se Šárka Fenyková.'
- eventId: 1454210
  start: 2026-10-05T01:33:00Z
  stop: 2026-10-05T02:00:00Z
  title: Žárovky
  description: Mladí vědci a vědkyně mění svět: Kardiovaskulární onemocnění jsou nejčastější příčinou úmrtí v Česku. Nina Kadášová nás provede obřím interaktivním modelem srdce.
- eventId: 1454211
  start: 2026-10-05T02:00:00Z
  stop: 2026-10-05T02:05:00Z
  title: Zprávy
