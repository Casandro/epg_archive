  title: Reportáže zahraničních zpravodajů
  description: V německém Loburgu léčí zraněné čápy a sirotkům hledají rodiče. Lidem bez domova pomáhá v argentinské metropoli časopis Hecho en Buenos Aires. Přísná škola, stará řemesla i svatby. Stockholmský Skansen ukazuje, jak se kdysi žilo ve Švédsku. I to uslyšíte v Reportážích zahraničních zpravodajů s Lubicou Bergmanovou.
