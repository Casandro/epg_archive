  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Migranti do Rwandy a Ugandy? Evropská unie zvažuje zásadní zpřísnění azylových pravidel, která by zabránila opakování migrační krize ve španělské exklávě Ceutě. Nově umožní zřizovat návratová centra v zemích mimo EU pro lidi bez práva na pobyt. Zvažuje se i dočasné zastavení přijímání žádostí o azyl a deportace neúspěšných žadatelů do třetích zemí jako Rwanda nebo Uganda. Odradí taková opatření migranty a zabrání krizím? Nebo realita na hranicích zůstane stejná? A nebudou zvažované kroky v rozporu s mezinárodními principy ochrany azylantů? Zeptáme se europoslance z Evropské lidové strany Tomáš Zdechovského a ředitele Organizace pro pomoc uprchlíkům Martina Rozumka. Moderuje Lukáš Matoška.
