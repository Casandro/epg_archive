- eventId: 1454212
  start: 2026-10-05T02:05:00Z
  stop: 2026-10-05T02:33:00Z
  title: Laboratoř
  description: Jak různorodé jsou potravní strategie půdních živočichů? Co ohrožuje opylovače zemědělských plodin? Jak klimatické extrémy působí na škůdce? Debatují půdní biolog Ladislav Miko, molekulární genetik Jan Pačes a student Dalibor Libus. Moderuje Martina Mašková.
- eventId: 1454213
  start: 2026-10-05T02:33:00Z
  stop: 2026-10-05T03:00:00Z
  title: Osobnost Plus
  description: Iva Hadj Moussa, spisovatelka a terapeutka. Inspiraci hledá i v městské hromadné dopravě. "Jsem pozorovatelský typ, hrozně ráda poslouchám cizí rozhovory," říká. Její román Krávy bude jako jeden ze tří vítězných románů vzešlý z literární soutěže Román pro Frankfurt reprezentovat českou literaturu na mezinárodním knižním veletrhu ve Frankfurtu nad Mohanem. Jak se připravuje na prezentaci své nové knihy? A jak vážný problém je zhoršující se duševní zdraví českých dětí? Moderuje Světlana Witowská.
- eventId: 1454274
  start: 2026-10-05T03:00:00Z
  stop: 2026-10-05T03:05:00Z
  title: Zprávy
