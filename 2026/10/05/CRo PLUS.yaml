- eventId: 1454275
  start: 2026-10-05T03:05:00Z
  stop: 2026-10-05T03:30:00Z
  title: Chyba systému
  description: AI, hrozba pro lidsto? Lídři největších AI firem varují před riziky umělé inteligence a volají po zpomalení jejího vývoje a regulaci. Je to ale v situaci, kdy o prvenství v AI závodí Spojené státy a Čína, vůbec možné? A co by mohl překotný vývoj umělé inteligence znamenat pro dosavadní podobu demokracie? Speciálním hostem je vědec Jan Kulveit z Centra teoretických studií.
