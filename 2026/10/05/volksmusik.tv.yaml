  description: Viele Treffen mit Gott finden sich wieder in vielen Liedern der Kastelruther Spatzen. Es sind besondere  Momente der Erkenntnis und Geschichten des Lebens, die Herzen berühren und die in der Tradition Südtirols von Mensch zu Mensch seit Generationen berliefert wurden. Diese Geschichten waren zum Teil schon den Eltern unserer Eltern Hilfe und Trost. Wie sehr diese Musik uns bis heute berhrt und bewegt, erfahren Sie in zahlreichen Geschichten dieser Ausgabe der ÐChristlichen HitparadeÐ.
