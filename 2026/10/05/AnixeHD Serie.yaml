  title: Kochen mit Anixe - Süßkartoffeln und Avocado auf Mexikanisch
  subtitle: Kochen mit Anixe - Süßkartoffeln und Avocado auf Mexikanisch
  description: In Deutschland ist der Bekanntheitsgrad der Süßkartoffel in den letzten Jahren gestiegen. Doch ist sie wirklich eine Kartoffel im herkömmlichen Sinne? Sie zählt botanisch zur Familie der Windengewächse. Sie gehört also nicht wie die Kartoffel zu den Nachtschattengewächsen. Trotzdem ist die Süßkartoffel mittlerweile sehr beliebt. Ebenso die Avocado.  Deshalb übertrifft sich unser TV Koch mal wieder mit seinem Rezept, denn er zaubert "Mexikanisch gefüllte Süßkartoffeln mit Avocadocreme". Unsere Moderatorin kommt als Vegetarierin voll auf Ihre Kosten. Allerdings ist dieses pikante, sehr gesunde Gericht auch etwas für Freunde der südamerikanischen Küche, egal ob mit oder ohne Fleisch.  Hier das komplette Rezept!
