  title: Vier Frauen und ein Todesfall - Vatermord
  subtitle: Vier Frauen und ein Todesfall - Vatermord
  description: Auf einer Kinderparty im Garten von Sandra (Claudia Ziegler) und Thomas Mader kommt es zu einem schrecklichen Zwischenfall. Der kleine Lukas spielt mit seinem Vater Räuber und Gendarm fuchtelt dabei mit einer Pistole herum, die alle für eine Spielzeugwaffe halten - bis sich ein Schuss löst. Thomas Mader wird tödlich getroffen. Das Entsetzen ist entsprechend groß und die vier Frauen stecken mitten im nächsten Fall. Unter Verdacht, dem Kind die Pistole unterschoben zu haben, gerät vorerst das hübsche Au-pair-Mädchen Jeanne (Katharina Solzbacher), die in ein Eifersuchtsdrama verwickelt scheint. Zwar soll sich Eifersucht als Motiv herausstellen, aber ganz anders als erwartet und ohne Frauen im Spiel. Thomas Mader war Geschäftsführer der Firma Raffeiner-Wasser, die gewaltige Umsätze mit belebtem Wasser geschafft und offenbar ein böses Geheimnis hat.
