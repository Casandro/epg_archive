  description: 'Haribo macht Kinder froh - und Erwachsene ebenso." Diesen Satz kennen wir alle. Und tatsächlich: Ein Gummibärchen kann ein Lächeln zaubern, für einen Moment Leichtigkeit schenken, für einen Augenblick Freude. Aber wir alle wissen auch: Diese Freude hält nicht lange. Sie klebt kurz auf der Zunge - und ist dann wieder weg. Heute begrüßen wir eine Frau, deren Leben voller Herausforderungen ist - und voller Ho?nung. Sabine Langenbach nennt sich "Dankbarkeitsbotschafterin".'
