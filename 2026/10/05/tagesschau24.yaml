  title: Warum die Karpaten neu vermessen werden
  subtitle: Film von Katrin Molnár, Janine Grün und Paul Tutsek
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Seit Jahren versuchen Topografen die Grundstücke Rumäniens zu vermessen. Doch bis heute ist das Kataster eines der unvollständigsten der EU. Besonders in den abgelegenen Bergregionen, wo Eigentum seit Jahrhunderten per Handschlag geregelt wird, herrscht Misstrauen gegenüber den Landvermessern. Nur die alten Bergbauern kennen die überlieferten Grundstücksgrenzen. \nEU-Vermessung trifft Bergtradition: Der Film zeigt, warum Rumäniens Bergland bis heute kaum auf der Karte existiert."
