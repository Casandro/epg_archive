  description: Der Kanzler weiß inzwischen über das "Gespinst von blühender Fantasie und Halbwahrheiten", das sich um ihn zusammenzieht. Dunkle Ahnungen, Depressionen, sogar Selbstmordgedanken wechseln abrupt mit Zuversicht und Kampfeswillen. Brandt entschließt sich zum Rücktritt. Aber niemand kann den zurückgetretenen Willy Brandt daran hindern, Führungsfigur der europäischen Sozialdemokratie zu werden. In der Nacht, nachdem erste Rücktrittsmeldungen über die Ticker laufen, zieht ein Fackelzug von 100 jungen Menschen zur Dienstvilla des Kanzlers. Willy Brandt zeigt sich nicht.
