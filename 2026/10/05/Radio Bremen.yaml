  description: Frühjahr 1974. Bundeskanzler Willy Brandt ist im Sonderzug auf Wahlreise durch Norddeutschland. Begleitet wird der Kanzler unter anderem von seinem Partei-Referenten Günter Guillaume, Brandts "Mädchen für alles". Dabei steht er seit einem knappen Jahr unter dem Verdacht, Stasiagent zu sein, und der Kanzler weiß das. Als Guillaume schließlich festgenommen wird, geraten Details aus Brandts Privatleben in den Blickpunkt. Der Kanzler wird erpressbar und muss zurücktreten.
