  title: GESUNDHEITHEUTE - Die Gesundheitssendung mit Dr. Jeanne Fürst
  subtitle: 'Rückenschmerzen: Moderne Therapien statt Versteifung'
  description: |-
    Die dritte Folge der Serie mit der Universitätsklinik Balgrist Zürich zeigt, wann konservative Behandlungen nicht ausreichen und welche schonenden operativen Verfahren helfen können - ohne dass eine Versteifung der Wirbelsäule notwendig ist.
    Schweiz 2026
  widescreen: true
  subtitled: true
  hd: true
