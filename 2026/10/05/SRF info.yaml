  title: Südostschweiz Standpunkte
  subtitle: Wie nah lassen wir künstliche Intelligenz an uns heran?
  description: |-
    Kaum eine Technologie verbreitet sich so rasant wie künstliche Intelligenz. Auch in der Schweiz ist sie längst im Alltag angekommen. Wir arbeiten mit ihr, lassen sie Ferien planen und fragen sie bei Krankheiten oder Liebeskummer um Rat - und manche bauen bereits eine emotionale Bindung zu ihr auf.
    Schweiz 2026
  widescreen: true
  hd: true
