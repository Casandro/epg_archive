  title: SRFglobal
  subtitle: Das grosse Geschäft mit dem Balkan
  description: |-
    Der Westbalkan gleicht einem Marktplatz, auf dem Interessensgruppen aus den USA, China, dem Nahen Osten oder Russland Einfluss zu kaufen versuchen. Im Angebot stehen Häfen, Minen, Küstenstreifen und ganze Inseln. Wer sichert sich wo, was - und was erhält er im Gegenzug?
    Schweiz 2026
