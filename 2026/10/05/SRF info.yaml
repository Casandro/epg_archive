  title: Mona mittendrin
  subtitle: Am Flughafen Zürich - Präzision hinter den Kulissen
  description: |-
    Der Flughafen Zürich funktioniert wie ein Uhrwerk. Vieles ist für die Passagiere selbstverständlich und nicht sichtbar. Hinter den Kulissen leisten Menschen Präzisionsarbeit, damit das komplexe Ganze funktioniert. Mona Vetsch lernt Mitarbeitende kennen, die Verantwortung tragen.
    Deutsche Schweiz 2026
