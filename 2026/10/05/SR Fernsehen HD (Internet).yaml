  description: 'Um der Vorbildfunktion der Polizei gerecht zu werden, nimmt Girwidz das gesamte Revier mit zur Blutspende. Währenddessen entdeckt Staller, dass eine ältere Spenderin dabei offenbar so viel Blut verloren hat, dass sie verstorben ist. Bald stellt sich heraus, dass es sich um Erna Rattlinger handelt, die Tante von Sabrina Rattlinger - und die steht als Alleinerbin bald unter Mordverdacht. Doch von ihrem Erbe hat Sabrina zunächst nichts: Das Konto ihrer Tante ist leer und das Haus wurde offenbar kurz vor dem Tod verkauft - ausgerechnet an Girwidz, der aus allen Wolken fällt.'
