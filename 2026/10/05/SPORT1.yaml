  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann. Diesmal überrascht der Dortmunder PS Profi Eventköchin Bianca. Als er vor ihrer Tür steht, glaubt sie erst an einen Scherz. Wer ist der bärtige Mann? Was will er von ihr? Langsam dämmert es Bianca, die mit ihrem schwedischen "Kochmobil" Volvo V 70 ständig auf Tour ist. Sie bekocht jeden, der sie engagiert. Doch der Kombi hat bereits 240.000 Kilometer auf dem Buckel und sieht obendrein stinklangweilig aus. Sidney kommt also gerade rechtzeitig vorbei. In Sidneys klopft das Tuner-Herz. Legt er Biancas Wagen tiefer? Verpasst er ihrem Volvo eine knallige Farbe? Sidney hat eine Idee: Bianca soll seine Crew bekochen. Fällt ihr Menü außergewöhnlich aus, wird auch ihr Wagen außergewöhnlich.'
