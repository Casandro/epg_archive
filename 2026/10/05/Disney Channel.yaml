  title: How I Met Your Mother
  subtitle: Kennen wir uns? Comedy-Serie, USA 2008
  description: Folge 65, Ted weiß noch nicht alles über seine zukünftige Ehefrau Stella, aber er ist sich sicher, dass sie auf jeden Fall die Richtige ist. Als er ihr eine Menge Fragen stellt, um sie besser kennenzulernen, stellt sich heraus, dass sie noch nie ,Star Wars' gesehen hat. Marshall ist der Meinung, dass sie das unbedingt nachholen muss, damit Ted erfährt, ob Stella wirklich zu ihm passt. Falls sie ,Star Wars' nämlich furchtbar findet, gibt Marshall ihrer gemeinsamen Zukunft keine Chance.
