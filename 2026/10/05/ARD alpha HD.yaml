  title: POV - Deine Geschichte zählt
  subtitle: Bundeswehr (2) - Wehrdienst? Nein danke!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Für Lenni (18) steht fest: Er will nicht zur Bundeswehr und setzt sich gegen eine Wehrpflicht ein. Für ihn geht es dabei vor allem um Selbstbestimmung und die Frage, wie stark der Staat in die Zukunft junger Menschen eingreifen darf. Gleichzeitig haben Freunde von Lenni einen anderen Weg gewählt und sind zur Bundeswehr gegangen.'
- eventId: 682687
  start: 2026-10-05T05:35:00Z
  stop: 2026-10-05T06:00:00Z
  title: Willi wills wissen
  subtitle: Wer wirft ein Auge aufs Auge?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Diesmal verschafft sich Reporter Willi zum Thema Augen den Durchblick. Los geht''s mit Augenarzt Dr. Tobias Neuhann, der ihm einen Grundkurs über Aufbau und Funktion des menschlichen Auges gibt: Pupille, Regenbogenhaut, Linse, Netzhaut, blinder Fleck, wofür die Hornhaut wichtig ist und wie es zu Sehfehlern kommen kann. Viele Menschen benötigen früher oder später eine Brille. Bei einer Firma in München erfährt Willi, wie man eine Brille herstellt. Designer Peter entwirft extra für ihn ein Spezialmodell in W-Form. Und wie kommen die Gläser in die Brille?'
