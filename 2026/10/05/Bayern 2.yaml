  title: Bayern 2 Kulturleben
  subtitle: Büchermagazin
  description: "14.04 \nJeden Montag das wöchentliche, einstündige Bayern 2 Büchermagazin im Gespräch mit Schriftstellerinnen und Schriftstellern, Kritikerinnen und Kritikern und anderen Büchermenschen. Mit Rezensionen aktueller Literatur und vielen Entdeckungen aus Roman, Lyrik und Sachbuch.\n\nGespräch mit Markus Krajewski über sein Buch \"Pedanten. Die ungeliebten Meister der Akribie\" (zu Klampen)\nModeration\n\n\"Das tickende Herz\": Der neue Roman von Lutz Seiler (Suhrkamp)\nVon Niels Beintker\n\nAsne Seierstad: \"Der Krieg ist anderswo. Russland von innen\" (Hanser. ET 18.08.)\nVon Katja Engelhardt\n\nLIVE-Gespräch mit Jochen Rack über das Buch von Evan Gershkovich: \"Dieses verfluchte wunderschöne Land - 491 Tage in russischer Haft: Meine Geschichte\" (Penguin), ET 30.09.\nModeration / Kollegengespräch\n\nDas literarische Rätsel\nVon Thomas Kastura\n\n15.00 Nachrichten, Wetter, Verkehr\n\n15.10 Bayern 2 Radiowissen\n\nStörtebeker und Co. - Eine wahre Piratengeschichte?\nVon Georg Florian Ulrich\n\n15.30 Kultur-Update\nWas passiert gerade in der Welt der Kultur? Die Antwort liefert das Kultur-Update. Aus Bayern und der ganzen Welt: Wir berichten von Ausstellungen, Büchern, Filmen oder Serien, aber auch vom neuesten TikTok-Trend.\n\nHanns Huber: Der unbekannte Retter der NSDAP-Akten\nVon Simon Emmerlich\n\nComputerspiel \"Nivalis Nights\": Blade Runner meets Cozy Ästhetik\nVon Christian Schiffer\n\nFBM Literarische Erwartungen an die Buchmesse 2026\nVon Antje Bonhage / ARD\n\n\nModeration: Knut Cordsen\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
