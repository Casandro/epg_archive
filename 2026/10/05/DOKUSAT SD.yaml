  title: Lise Meitner - Die Mutter der Atombombe
  description: Lise Meitner, oft als "Die Mutter der Atombombe" bezeichnet, war eine bahnbrechende Physikerin des 20. Jahrhunderts. Trotz vieler Hindernisse in einer von Männern dominierten Welt machte sie entscheidende Beiträge zur Kernphysik. Ihr Name wird oft übersehen, aber ihre Arbeit war entscheidend für das Verständnis der Kernspaltung und legte den Grundstein für die Entwicklung von Atomwaffen und die friedliche Nutzung der Kernenergie.
