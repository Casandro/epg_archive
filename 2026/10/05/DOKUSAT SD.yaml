  title: Tiere vor der Kamera - Die Felsen der Papageitaucher
  description: Lustig buntes Aussehen, liebenswert tolpatschiges Verhalten, Papageitaucher sind die perfekten Filmstars. Jedes Jahr treffen sie sich an traditionellen Brutplätzen an den Küsten des Nordmeeres. Karge Felsklippen füllen sie für kurze Zeit mit Farbe und Leben. Da gibt es viel zu beobachten zB. "Schnabelfechten". Arendt/Schweiger waren mit dabei, vom Schlüpfen aus dem Ei, dem Heranwachsen der Kücken bis zum Flüggewerden, dem Sprung ganz allein ins kalte Meer.
