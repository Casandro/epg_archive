  title: Na pěknú notečku
  description: Valašsko-kopanické vyhrávání. Do údolí řeky Vsetínské Bečvy nás zavedou písně v podání ženského sboru Karlovjanky, pěvecké skupiny Blaženky i cimbálové muziky Jasénka a Ensemblu Flair. Ochutnávku rozverných melodií z Moravských Kopanic zase zajistí kapela Metošé s primášem Tomášem Beníčkem. Pořad připravil Jaroslav Kneisl a slovem provází Markéta Ševčíková.
