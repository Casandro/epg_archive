  title: Hörbar - Musik grenzenlos
  description: |-
    Über den Krimkrieg von 1853 bis 1856 - der vor allem von Russland ausging, in den auch Großbritannien verstrickt war - wurde seinerzeit eine große Zahl von Gedichten geschrieben und teils anonym an Verlage von Provinzzeitschriften geschickt und gedruckt. Ein spannendes CD-Projekt hat sich nun dieser Poeme angenommen und englische Folkmusiker und -musikerinnen von heute gebeten, diese Texte zu vertonen.

    Fatoumata Diawara - Tcheba

    Granny's Attic - Departure of the troops

    Dr. Macaroni Brass Band - Cantaloupe Island

    Manfred Maurenbrecher - Komisch

    Trilok Gurtu - Don't follow your shadow

    Lila Downs - Nueve viento

    Hannah & Kateryna Pyshnuik - The english woman's prayer

    Vicente Amigo - oma

    Pitiot, Thomas; Batlik - Les moutons de poussière

    London Symphony Orchestra - L'Arlésienne Suite / Minuetto

    Barbatuques - Baião destemperado

    Jackie Oates - Mamhead

    Joe Sample - Miles of blue (blue Miles)
  subtitle: Lieder über den Krim-Krieg & mehr Musik grenzenlos
