    W archiwum zirytowana Zuza czyta na głos artykuł o tym, jak o zastępca komendanta, Strączek, rozwikłał sprawę Jana Gołki. W tym czasie Henryk porządkuje teczki, które mają trafić na przemiał. Nagle sięga po jedną z nich i kładzie przed Wasiluk. Akta dotyczą morderstwa prokuratora Dariusza Zwolińskiego. Co ciekawe, z jego mieszkania pełnego biżuterii i antyków, zginął jedynie klaser ze starymimonetami.
  ageRating: 16
  genre:
