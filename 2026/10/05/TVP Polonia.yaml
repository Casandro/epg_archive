    Rozwiązała się zagadka chorych kur i strusia. Źródłem kłopotów była zagrzybiona pasza sprzedawana przez firmę Pasza Jeleń, której właścicielem jest Cezary Żyro. Istnieje podejrzenie, że Żyro wiedział, iż pasza może być zatruta, a mimo to ją sprzedawał. Sylwia, zamierza go zdemaskować i zdobyć dowody oszustwa. Podczas wizyty u biskupa potwierdzają się obawy księdza Błażejczyka. Andrzej miał rację, obchody święta parafii muszą odbyć się jeszcze w tym roku i to jak najszybciej.
  ageRating: 12
