  title: Wojenne dziewczyny s.I - odc. 8
  subtitle: Witek martwi się brakiem wieści od siostry. Wraz z Ewką udaje się do Tomaszowa. Okazuje się, że Knyst przechwycił raport Irki. Kleim żąda od Marysi, by zdawała mu relacje ze spotkań Dietricha.
  description: |-
    Tytuł oryginalny: Wojenne dziewczyny
    PL, 2016
    Reżyseria: Michał Rogalski
    Występują: Marta Mazurek, Vanessa Aleksander, Aleksandra Pisula, Michał Czernecki, Danuta Stenka, Weronika Asińska
    odc. 8 Witka niepokoi brak wieści od siostry. Do spółdzielni, w której od niedawna pracuje Ewka, wpadają gestapowcy. Alfons w pośpiechu przekazuje Ewce broń, którą ona ukrywa pod spódnicą. Knyst wzywa Irkę, okazuje się, że przechwycił jej raport. Kiedy wychodzi na jaw, że kurier nie ma żadnych meldunków z Tomaszowa, Ewka i Witek jadą sprawdzić sytuację. Zawiadowca stacji wyznaje, że oddał list Knystowi. Marysia wsiada do czarnego samochodu, w którym czeka Kleim.
  ageRating: 12
  genre:
  - '23'
- eventId: 1300501
  start: 2026-10-05T19:15:00Z
  stop: 2026-10-05T20:50:00Z
  title: Dom - odc. 4/25 - A jeszcze wczoraj było wesele
  subtitle: Andrzej, widząc depresję Basi, przyznaje się do winy. Doznaje wielu upokorzeń z jej strony. Pojawia się Wiktor, jego dawny dowódca z lasu. W rodzinie Bawolików dochodzi do pojednania.
  description: |-
    Tytuł oryginalny: Dom
    PL, 1980
    Reżyseria: Jan Łomnicki
    Występują: Tomasz Borkowy, Wacław Kowalski, Stefania Iwińska, Jolanta Żółkowska, Anna Ciepielewska, Bożena Dykiel
    Basia Talarówna nadal jest w depresji. Andrzej czuje się winny. Jego dawny dowódca odnajduje go i odwiedza w Warszawie. Stwarza to nowe i groźne kłopoty. W rodzinie Bawolików następuje pojednanie. Inwalida wojenny Tolek walczy ze swą ułomnością pod wpływem sympatii do Lidki. Pomaga mu w tym syn starosty, który właśnie wrócił do domu i zamieszkał w swoim mieszkaniu zajętym przez Jasińskich. Tolek osiąga pełny sukces, odrzuca kule.
  ageRating: 12
  genre:
  - '23'
