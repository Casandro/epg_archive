    Występują: Andrzej Kaczmarczyk
    Praczka, świniopas, śledziarz, handlarz skupujący starzyznę i kurze łapki, czy wędrowny ostrzyciel noży, odeszli w zapomnienie, choć tego ostatniego widziano jeszcze na warszawskich podwórkach na początku lat 90. Podobny los może czekać wikliniarzy, bednarzy, kołodziejów czy garncarzy (ta ostatnia umiejętność przeżywa jednak swój renesans). Miejmy nadzieję, że nie krótkotrwały.
  genre:
  - '149'
  subtitle: Tematem odcinka będzie praca kołodzieja, czyli osoby zajmującej się wyrabianiem i naprawą drewnianych kół do wozów, bryczek, furmanek i innych pojazdów konnych.
