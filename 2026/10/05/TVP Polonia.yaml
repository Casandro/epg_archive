  subtitle: Henryk i Zuza interesują się sprawą zabójstwa prokuratora Dariusza Zwolińskiego. Z mieszkania zginął jedynie klaser ze starymi monetami. Może być to trop umożliwiający wykrycie sprawcy zbrodni.
