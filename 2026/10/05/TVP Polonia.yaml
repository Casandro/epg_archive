    Sylwia budzi się w szpitalu. Jest przy niej Dawid, który na wieść o wypadku przerwał tournee. Obrażenia pani doktor nie są poważne. Nieco dłużej potrwa leczenie magistra Żyro. Tymczasem w Majakach trwają przygotowania do obchodów 300 - lecia parafii. Ksiądz dwoi się i troi, żeby sprostać wszystkim obowiązkom związanym z jubileuszem. Dlatego nie ma ochoty jechać na otwarcie wystawy portretów proboszczów, przygotowanej przez Jagnę i Andrzeja w siedzibie kurii w Białymstoku.
  ageRating: 12
