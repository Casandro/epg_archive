  title: Za 5 pět
  description: '  Za 5 pět ? publicistických 45 minut přináší každou sobotu od 16.55 blízká setkání s výjimečnými hosty a rozhovory na relevantní a aktuální témata, která často mohou být vnímána jako morálně problematická nebo zatížená stereotypy. Pořad vychází vstříc náročnému a kritickému posluchači, čerpá přitom z kompetencí zkušené autorské dvojice jako dramaturgů a průvodců pořadem ? Hany Scharffové a Petra Viziny.'
