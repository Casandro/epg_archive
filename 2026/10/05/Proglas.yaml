  start: 2026-10-05T03:57:00Z
  stop: 2026-10-05T04:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1005 - Kdo je velká holka (279. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Na jednu stranu jsem byla malinko otrávená ze svého nového poznání, co to znamená být ?blíže“, ale na druhou stranu jsem se cítila poctěná. Když Bůh někoho uzná za velkou hoijemné rozhovory jsem zvládla vlastně s nadhledem, jen jsem se necítila dobře. Co k tomu říká bible?Nemohla jsem přijít na nic konkrétního, ale pomohlo mi trochu si promyslet klasická biblická stádia zralosti ? děti, mládenci a otcové, jak je Jan popsal ve svém prvním dopisu. Připadlo mi, že děti jsou samozřejmě plné emocí, protože poznaly, že jsou jim odpuštěny hříchy. Radují se, jásají a emoce jsou pro ně moc důležité. Mládenci se učí bojovat, krmí se Božím slovem a učí se je používat. Jim už emoce nevládnou, možná se učí to zvládnout tak, aby emoce až následovaly za jejich rozhodnutími. A otcové? S těmi emoce nehýbou, stojí pevně plni vědomí toho, kdo jsou a kdo je Bůh, že emocím sami vládnou. Prostě poznali otce.Aha, to by ledacos vysvětlovalo. Dítko už nejsem a mládenčí věk mi zřejmě právě končí. Možná také začínám chápat, co to znamená být Bohu ?blíže“. Zralé ?blíže“ s sebou nese nejen to příjemné spočinutí v jistotě Boží náruče, v bezpečí Boží záštity a v nepřemožitelné zranitelnosti Boží lásky. Znamená také snášet některé nepohodlí, některé bolesti, některé starosti, které nese on.'
