  title: Studna slova (Rádio 7)
  subtitle: 1. Korintským - O moudrosti rozlišování (92. díl)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková; Premiéra: 4.10.2026 * Co nám dnes může říct Pavlovo učení o přikrývání hlavy při modlitbě a prorokování? Nejde jen o dávný zvyk, ale o to, co svým jednáním vyjadřujeme. O svobodu, respekt k druhému a schopnost rozlišovat podstatné od nepodstatného. V archivní nahrávce pokračuje kazatel Jiří Hurta ve výkladu 1. listu Korintským 11. kapitole. Pořad Studna slova uslyšíte od sedmi hodin 45 minut.'
