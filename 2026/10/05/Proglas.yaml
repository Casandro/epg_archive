  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Ze zpěvníku Jiřího Suchého 2 (zpívají kolegové) (2. díl)
  description: 'Autor a interpret: Helena Bretfeldová * 1. října 2026 se dožívá pětadevadesáti let zpěvák, skladatel, básník, kabaretiér,  herec, hudebník, textař, spisovatel, filmař, grafik, výtvarník, divadelní režisér, komik a sběratel Jiří Suchý (*1931). Spoluzakládal Divadlo Na zábradlí a později autorské divadlo Semafor (zkratka pro sedm malých forem). Původně propagační grafik a amatérský kontrabasista hrával v kabaretu Reduta; mezníkem jeho života byl rok 1959, kdy spolu s Jiřím Šlitrem založil semafor (existuje dodnes). Za život napsal několik set písní, mnohé takřka zlidověly. Dvojdílný průřez jeho tvorbou připravila Helena Bretfeldová.'
  genre:
  - '99'
