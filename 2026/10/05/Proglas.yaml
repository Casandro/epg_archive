  title: Před kostelem
  subtitle: Před kostelem s arcibiskupem Nuzíkem
  description: 'Autor: Adéla Šimoníková, Martin Weisbauer; Interpret: olomoucký arcibiskup Josef Nuzík; Premiéra: 2.6.2025 * Josef Nuzík, rodák ze Strání a jedno z jedenácti dětí, začínal jako soustružník, než se v roce 1989 vydal na kněžskou dráhu. Po službě v mnoha farnostech a vedoucích církevních funkcích byl v roce 2017 jmenován pomocným biskupem olomouckým a později, v roce 2024, olomouckým arcibiskupem. Před nedávnem se stal také předsedou České biskupské konference. Tak arcibiskupa Nuzíka zná asi většina z nás. Ale možná už nevíme, co rád dělá ve volném čase, jak vypadá jeho klasicky den nebo co mu v životě dělá radost. Na to vše i mnohem víc se zeptáme v pořadu Před kostelem.'
