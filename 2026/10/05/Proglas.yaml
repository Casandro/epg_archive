  title: Radioreport
  subtitle: 10. výročí založení Nadačního fondu Františka Podstatzky Lichtensteina
  description: 'Autor: Iva Horká; Interpret: Johann Podstatzky Lichtenstein, Hana Sklenářová, Helena Severová, Marek Vácha, Sylwester Jurczak, Jiří Kaňa a další; Premiéra: 30.9.2026 * V sobotu 12. 9. 2026 proběhly oslavy 10. výročí založení Nadačního fondu Františka Podstatzky Lichtensteina (NFPL), který zemřel v roce 2016 a krátce před svou smrtí tento NF založil. Akce se konala v poutním areálu kostela Nanebevzetí Panny Marie v Netíně. Nadační fond připravil pestrobarevný hudební i doprovodný program pro všechny věkové generace.   Výtěžek z dobrovolného vstupného putoval na chod ROSY - denního stacionáře Oblastní charity Žďár nad Sázavou z Bystřice nad Pernštejnem.Přímo na místě po celý den natáčela a radioreport připravila Iva Horká.'
