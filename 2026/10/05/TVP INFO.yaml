    Tytuł oryginalny: Szczyńść Boże, Polsko!
    PL, 2021
    Reżyseria: Mirosław Basaj
    Występują: Jakub Wróblewski
    Dwa filmy o historii Śląska pod wspólnym tytułem: "Szczyńść Boże, Polsko!". Oba są w konwencji dziennikarskiej debaty radiowej, prowadzonej przez Jakuba Wróblewskiego. W debacie udział wzięli wybitni znawcy tematu i mieszkańcy regionu, tacy jak: prof. Zygmunt Woźniczka, prof. Ryszard Kaczmarek, prof. Stanisław Nicieja, dr Angelika Blina i dr Karol Makles. Opowieść zaczyna próba zdefiniowania nazwy i genezy Śląska, a kończy 20 czerwca 1922 r.
