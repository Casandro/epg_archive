  title: Ludzkość - historia nas wszystkich 1 (odc. 12)
  subtitle: 'Ludzkość sięga po wyzwania, które do tej pory były jedynie w boskiej mocy: szuka sposobów zapewnienia pożywienia miliardom ludzi, przeobraża krajobraz, ingeruje w procesy zachodzące w ludzkim ciele.'
