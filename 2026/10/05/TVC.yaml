    US, 2012
    Reżyseria: Dan Clifton
    Występują: Josh Brolin, Thaddeus Russell, Anthony Bourdain, James Meigs, Dan McNichol, Sylvester James Gates Jr.
    Koniec wojny secesyjnej w USA pozwala ludzkości przyspieszyć rozwój. W ciągu 50 lat Japonia z feudalnego społeczeństwa staje się przemysłową potęgą. Popyt na gumę prowadzi do dewastacji Afryki. Ludzkość uzurpuje sobie prawo do nadludzkich mocy; uważa, że jest w stanie wykarmić miliardy osób, przekształcić krajobraz, zmienić zasady funkcjonowania ludzkiego organizmu. Od chwili wejścia w wiek atomowy ludzkość żyje w zawieszeniu pomiędzy wiecznością a otchłanią.
