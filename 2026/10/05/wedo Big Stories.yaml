  start: 2026-10-05T00:41:00Z
  stop: 2026-10-05T01:10:59Z
  title: The New Frontier
  subtitle: 'Mars: Adapt or Leave, Education / Science / Factual topics 2016, Season:2 Episode:1'
  description: '2016 ● S2 Während die neuesten Erfolge und Misserfolge kommen und gehen, gibt der Mars weiterhin seine Geheimnisse preis. Unsichtbare Wolken werden mit ultraviolettem Licht enthüllt und die Suche nach der Quelle von Methan geht mit ExoMars weiter. Während wir uns darauf vorbereiten, Menschen auf dem roten Planeten zu landen, ist es eine Sache, dorthin zu gelangen. Langfristig dort zu bleiben ist eine andere: Können wir diesen Planeten wirklich erobern? Education / Science / Factual topics 2016, Regie: Andrew Thomson,  Mit: Stuart Sykes, Season:2 Episode:1'
