  title: Presseclub
  subtitle: 'Wer regiert die Hauptstadt: Kommt die "Brandmauer" nach links?'
  description: |-
    Werden die politischen Geschicke in Berlin bald von einem rot-rot-grünen Bündnis bestimmt? Alle drei Parteien verfügen nach der Wahl zum Abgeordnetenhaus über eine deutliche Mehrheit, weshalb sie diese Woche damit begonnen haben, Gemeinsamkeiten auszulosten. Doch Antisemitismus-Vorwürfe und Verbindungen der Linkspartei ins kriminelle Milieu belasten die Verhandlungen erheblich. Die Linke spricht davon, dass es sich dabei nur um Einzelfälle handeln würde. Stimmt das oder wird das Problem damit heruntergespielt?

    Gäste:
    * Christine Dankbar, Frankfurter Rundschau
    * Sascha Chaimowicz, ZEITmagazin
    * Anke Myrrhe, Der Tagesspiegel
