  title: We Came As Romans - Vainstream 2026
  subtitle: Aufzeichnung vom 27. Juni 2026 aus Münster
  description: We Came As Romans (WCAR) kommen aus der Einkaufsstadt Troy, die nördlich von Detroit im US-Bundesstaat Michigan liegt - Clubs und spannende Musik-Venues sucht man hier vergeblich. Doch WCAR haben es seit ihrer Gründung im Jahr 2005 mit ihrem melodischen und gleichzeitig harten Metalcore-Sound von Troy in die große, weite Welt hinaus geschafft.
