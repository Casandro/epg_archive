  title: Wissen macht Ah! - Ganz kleines Kino
  description: "Film ab! Ralph und Clarissa haben es sich heute im Kinosessel gemütlich gemacht. Während die beiden gespannt auf den Anfang des Films warten, erklären sie unter anderem, was es mit dem \"Phi-Phänomen\" auf sich hat, ohne dass es Kino gar nicht gäbe. Es sorgt nämlich dafür, dass wir bewegte Bilder sehen, obwohl es eigentlich gar keine gibt! Außerdem beantworten sie wie immer bestens informiert die fünf Fragen der Sendung. \n* Warum passiert etwas \"hinter den Kulissen\"?\n* Wie kommen die Geräusche in den Film?\n* Wieso stinkt Schweiß?\n* Warum tratschen Menschen so gerne? \n* Warum wird beim Film eine Klappe geschlagen?"
