  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Ed Gein
  description: Ed Gein ist das reale Vorbild für Hollywood-Schocker wie "Psycho" oder "Das Schweigen der Lämmer". Er war ein Leichenschänder und Mörder, der auf seiner Farm in Wisconsin Dinge tat, die sich bis dahin niemand vorzustellen wagte.
