  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Fritz Honka
  description: Fritz Honka lockte über viele Jahre Prostituierte zu sich, um sie dann zu misshandeln und zu ermorden. Feuerwehrleute stießen eher durch Zufall auf die Verbrechen, als sie bei einem Einsatz den Verwesungsgeruch bemerkten.
