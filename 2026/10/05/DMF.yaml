  title: Ja, ja, die Liebe in Tirol
  subtitle: Komödie, Deutschland 1955
  description: 'Darsteller: Gerhard Riedmann, Hans Moser, Susi Nicoletti. Hans Bondy, ein erfolgloser Vertreter, entscheidet sich für einen Urlaub in Tirol, um seinen Misserfolg bei Frauen zu vergessen. Begleitet wird er von seinem Freund Peter Lenz. Im Gasthof "Almenrausch" verliebt sich Hans in Gretel, die Tochter des Witwers Ignaz Musbauer. Um sie zu heiraten, muss jedoch zuerst ihre Schwester Liesel unter die Haube gebracht werden. Hans plant, Liesel zu heiraten und sich sofort wieder scheiden zu lassen, um dann Gretel zu ehelichen.'
