  description: 'Darsteller: Jutta Speidel, Roy Black, Monika Lundi. Norbert, Bernie und Möps wollen einen gemeinsamen Urlaub zum psychischen und physischen Kehraus (ohne Fusel, Fluppen und Frauen) machen und sich "nebenbei" Norberts geerbten Hof sanieren. Alles kommt anders als geplant, nur das Happy End kommt mit Sicherheit! Freuen Sie sich auf tolle Landschaftsaufnahmen aus der Lüneburger Heide, Stadtbilder aus dem Berlin der frühen Siebziger-Jahre und viele bunte Schlager von und mit Roy Black.'
