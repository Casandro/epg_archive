  title: Unvergessene Legenden
  subtitle: Bianca / Unterhaltung, Deutschland 2021
  description: 'Darsteller: Bianca. Die Sängerin und Komponistin BIANCA zog sich selbstbestimmt aus dem Rampenlicht zurück. Ihre Lieder aber sind längst unsterblich. Der Mensch hinter der Künstlerin, hinter dem Star BIANCA, die Sängerin und Autorin Herlinde Grobe genießt sie ihren "Ruhestand". Ihre Songs aber erleben eine Renaissance der besonderen Art. Diese Hits und die Story ihres Lebens sind der der rote Faden dieser Sendung. Ihre eigentliche Karriere als Bianca begann erst in der zweiten Hälfte der 80er Jahre. Mit der Veröffentlichung ihres Albums "Im Namen des Vaters" (2004) beendete Bianca leise ihre Karriere.'
