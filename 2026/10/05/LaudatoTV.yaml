  title: Moja katolička obitelj
  subtitle: Animirani
  description: U novoj epizodi 'Moja katolička obitelj' najmanje upoznajemo sa svetom Faustinom Kowalskom, naglašavajući njezinu privrženost Božjem milosrđu. Saznajemo i kako je izgledao njezin susret s Isusom i zašto je isticala važnost ispovjednika u životu vjernika.
- eventId: 1333545
