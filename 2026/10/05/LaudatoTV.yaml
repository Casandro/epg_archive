  title: Izdvojeno
  subtitle: Religijski
  description: 'Ove 2026. godine karmelićani obilježavaju Jubilarnu godinu svetoga Ivana od Križa: 300. obljetnicu njegove kanonizacije i 100. obljetnicu proglašenja naučiteljem Crkve. Istodobno se obilježava i 150. obljetnica rođenja sluge Božjega o. Gerarda Tome Stantića. Kako su povezani sveti Ivan od Križa i o. Gerard Tomo Stantić? Što im je zajedničko i kako nam njihov život i duhovnost mogu pomoći u produbljivanju našega odnosa s Bogom? O tim temama u emisiji govori o. Mato Miloš, prethodni vicepostulator kauze za proglašenje blaženim sluge Božjega o. Gerarda Tome Stantića.'
