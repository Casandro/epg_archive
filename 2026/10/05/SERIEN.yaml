  title: Borgia - 1495
  subtitle: Borgia - 1495
  description: Lucrezia führt Rodrigos Geschäfte mit großem Geschick, bis dieser nach Rom zurückkehrt und sie zu seiner Beraterin macht. Cesare führt einen Feldzug gegen abtrünnige Provinzen des Kirchenstaats. Zugleich soll er Rodrigos ehemalige Geliebte Giulia ausspionieren. Von seiner Frau Lucrezia und Cesare gedemütigt, wird Alfonso Di Calabria zum Spitzel von Rodrigos Feinden im Vatikan.  FR 2013
  ageRating: 16
