  description: Die XXL-Länderspielpause ist vorbei. Und es war ein durchwachsener Einstand für Neu-Bundestrainer Jürgen Klopp. Zu Abschluss spielte das DFB-Team 0:0 in Griechenland. Jetzt heißt es wieder voller Fokus auf den Zweitliga-Alltag. Der 1. FC Nürnberg startet mit einem Topspiel gegen Wolfsburg nach der Pause. Die SpVgg muss auswärts ran. Fürth will den noch ungeschlagenen Tabellenführer Berlin ärgern. Und wir schauen noch zum Eishockey. Für die Ice Tigers gab es ein drei Punkte Wochenende. Am Freitag holten die Tiger einen souveränen 5:0 Heimsieg gegen Schwenningen und am Sonntag kassierte Nürnberg eine 1:4 Niederlagen beim Spitzenspiel in Berlin. Moderator Philipp Waldmann begrüßt heute Stefan Ustorf im Studio. Der bisherige Sportdirektor ist vor kurzem zum Geschäftsführer Sport aufgestiegen.
