  title: Countdown zur Diktatur
  subtitle: 1929 - 1931 Krise
  widescreen: true
  hd: true
  description: Der New Yorker Börsencrash 1929 stürzt die Welt in Arbeitslosigkeit, Armut und Inflation. Besonders hart trifft es Deutschland, das sich gerade erst von Krieg und Schulden zu erholen beginnt. Das Deutsche Reich ist jetzt seit zehn Jahren parlamentarische Demokratie. Aber die schwere Wirtschaftskrise nach dem Schwarzen Freitag lässt die Zustimmung zur Demokratie rapide sinken. Immer mehr Deutsche wenden sich Nationalsozialisten oder Kommunisten zu. Die Zeit der Goldenen Zwanziger gilt als modern, emanzipiert, glamourös. Bis in den USA der Schwarze Freitag an der New Yorker Börse die Weltwirtschaft in den Abgrund reißt.
