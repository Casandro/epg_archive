  title: Welten-Saga II
  subtitle: Die Schätze Südeuropas
  widescreen: true
  hd: true
  description: 'Ein Best of Europe mit seinen Städten, Burgen und Kathedralen - Historiker Christopher Clark reist zu herausragenden Zeugnissen des UNESCO-Weltkulturerbes auf europäischem Boden. Zuerst geht es nach Venedig. Tausend Jahre lang eine mächtige Handelsstadt, Ziel der Seidenstraße und immer schon Europas Verbindung zum Orient. In Paris erkundet Clark dann die historischen Bauten am Seine-Ufer und entdeckt ein immaterielles Kulturerbe: den Orgelbau. Das Obere Mittelrheintal mit seinen Burgen und Schlössern zählt auch zum Weltkulturerbe als Zeugnis kulturellen Austauschs.'
