  title: Die wilden Flüsse Afrikas (3/3)
  subtitle: Hoanib
  widescreen: true
  hd: true
  description: |-
    Kaum jemand außerhalb von Namibia kennt den geheimnisvollen Hoanib: ein Fluss, der nur während der Regenzeit für rund zwei Wochen im Jahr Wasser führt.

    Dann erweckt seine Flut die Wüste zum Leben und zieht zahlreiche Tiere an. Vor allem die seltenen Wüstenelefanten. Diesen bietet der Fluss einen der letzten Lebensräume.

    Afrikas Flüsse sind so unterschiedlich wie faszinierend. Vom Nil über den Sambesi bis zum Hoanib: Jedes der Gewässer bildet die Lebensader für eine eigene Gemeinschaft aus Tieren und Pflanzen. Die dreiteilige Reihe "Die wilden Flüsse Afrikas" führt zum Nil, zum Sambesi und zum Hoanib.

    Sendehinweis: 11.07.
