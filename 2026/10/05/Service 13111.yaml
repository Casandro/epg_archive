  title: 'Terra Mater - Die Erde: Ein Planet im Portrait'
  subtitle: Luft (1/3)
  description: |-
    Ohne Sauerstoff gäbe es kein Leben, wie wir es kennen. Ohne Atmosphäre kein Wetter und keine halbwegs gemäßigten Temperaturen. Ohne Lufthülle keinen Schutz vor der gefährlichen UV-Strahlung der Sonne oder vor Felsbrocken aus dem All. Die dünne Schicht aus Gas, die die Erde umgibt, ist entscheidend für das Leben auf unserem Planeten. Die Atmosphäre wirkt leer, doch sie ist ein eigener Lebensraum. Manche Meeresvögel verbringen Monate in der Luft: sie trinken, fressen, schlafen im Flug und landen nur, um zu brüten. Myriaden von Insekten bevölkern die Luft, manche Wesen segeln passiv durch die Lüfte und auch einige Säugetiere haben gelernt, sogar aktiv flatternd zu fliegen. In der Luft pflanzen sich zudem Schallwellen fort - viele Tiere nutzen Rufe und Geräusche als Signale, um sich zu verständigen oder zu orientieren, um Feinde abzuschrecken oder Hilfe herbeizuholen.
    Natur, Österreich 2018, R: Ivo Filatsch
