  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: |-
    Ein Tisch, verschiedene Meinungen. Dazu ein Moderator, der mit den Gästen die relevanten Themen der Woche bespricht und ausdiskutiert. Im Mittelpunkt steht ein pointierter und lebendiger Austausch an Argumenten und Meinungen, der dem Zuseher beide Seiten einer Medaille erklärt. Bei "Links. Rechts. Mitte" kommen Gäste zu Wort, die tatsächlich etwas zu sagen haben und nicht nur die bekannten Phrasen austauschen. 60 Minuten Talkshow, die das Zeitgeschehen auf den Punkt bringt und dem Zuschauer Orientierung auch in turbulenten Zeiten spendet.
    Diskussion, Österreich 2026,  M: Katrin Prähauser
  genre:
  - '33'
  widescreen: true
- eventId: 1424009
  start: 2026-10-05T21:24:13Z
  stop: 2026-10-05T22:24:13Z
  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Schicksalsstunden für die SPÖ: Babler vor dem Sturz? \nAm Sonntag schlägt der SPÖ die Stunde: Andreas Babler hat die Landeschefs geladen, es geht um nichts weniger als seine Zukunft als Parteichef. Herausforderer Gerhard Zeiler steht bereit, doch auf wessen Seite sich die Genossen schlagen, ist völlig offen. Babler oder Zeiler: Wer kann sich durchsetzen? Wird gar noch ein dritter Kandidat aus dem Hut gezaubert? Geht es nur um den Chefsessel oder um die Zukunft der Sozialdemokratie? Was bedeutet der Machtkampf für Koalition und Republik? Ist diese Regierung längst stehend k.o.? Kann sie sich noch über die Runden retten - oder drohen Neuwahlen?\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
