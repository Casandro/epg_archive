  title: Bares für Rares
  subtitle: Geometrische Druckgrafik
  description: |-
    Eine faszinierende geometrische Druckgrafik des renommierten Architekten und Bildhauers Erwin Heerich soll im Pulheimer Walzwerk verkauft werden! Dieser limitierte Druck, nummeriert als 12 von 60, präsentiert eine technische Zeichnung oder einen Entwurf für eine seiner Skulpturen im Maßstab 1:3. Die Komposition aus klaren, geometrischen Formen könnte als Schnittmuster für eine Kartonplastik dienen - eine Technik, die Heerich in den späten 1950er Jahren berühmt machte.
    Die Druckgrafik ist handschriftlich signiert und stammt vermutlich aus den späten 1960er Jahren. Sie zeigt die meisterhafte Präzision und das innovative Denken des Künstlers. Trotz des altersentsprechend guten Zustands des Blattes sind leichte Bräunung und ein kleiner brauner Fleck zu erkennen, wie die Expertin Dr. Bianca Berding vermerkt. Eine dezente Faltung, die laut der Expertin möglicherweise repariert werden kann, mindert jedoch nicht den künstlerischen Wert dieser Grafik.
    Für Sammler und Kunstliebhaber bietet sich hier eine seltene Gelegenheit, ein Stück Kunstgeschichte zu erwerben, das nicht nur die Handschrift eines bedeutenden Künstlers trägt, sondern auch einen Einblick in seine kreative Schaffensweise gewährt. Wird dieses einzigartige Werk im Händlerraum für Aufsehen sorgen und einen neuen Besitzer finden? Es bleibt spannend!
    Show, Deutschland 2024, R: Sheila Bär-Mertens, Andre Spauke  M: Horst Lichter
  widescreen: true
