  title: Hubert und Staller
  subtitle: Hoch versichert, tief gefallen
  description: "Hubert und Staller sind wegen \"Operation Reifenwechsel\" im Einsatz. Deswegen ist Polizeimeister Riedl mit dem Rad als Erster am Tatort eines Einbruchs mit Todesfolge. Der maskierte Einbrecher, der es offensichtlich auf einen sehr wertvollen Oldtimer abgesehen hatte, wurde von der Hausbesitzerin Linda Weynfels überrascht und in Notwehr erschossen. Ihrem verreisten Mann, Max Weynfels, gehören sowohl die Schusswaffe als auch das edle Auto. Er handelt nämlich beruflich mit wertvollen Oldtimern und Linda Weynfels selbst ist, zu Stallers Begeisterung, ehemalige Rallye-Fahrerin. Die Ermittlungen ergeben, dass der Tote ein treuer Mitarbeiter im Autohaus von Max Weynfels war. Doch wieso wird aus einem braven Angestellten plötzlich ein Krimineller? \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2016, R: Erik Haffner"
