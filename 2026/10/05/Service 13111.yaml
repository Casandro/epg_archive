  description: "Nie zuvor wurde eine Achttausender-Gipfel in kleiner Gruppe, mit wenig Ausrüstung und ohne Sherpa- bzw. Träger-Unterstützung bestiegen. Die vierköpfige Alpinisten-Gruppe mit einem durch erfrorene Finger schwer gehandicapten Herbert Tichy an der Spitze. Es sind jene Maßstäbe, die Reinhold Messner Jahrzehnte später postulieren und umsetzen wird - und die das Höhenbergsteigen von den 1970ern bis zur Jahrtausendwende bestimmen. \nDoch Herbert Tichy verschwendet am Gipfel des Cho Oyu keinen Gedanken an alpinistische Superlative. Zum ersten - und vielleicht einzigen Mal in seinem Leben - scheint die größte Sehnsucht in ihm gestillt zu sein: die Sehnsucht, angekommen zu sein. \nAnzukommen mit allen Sinnen im Hier und Jetzt, an einem Punkt, an dem alle Wünsche und Begierden verstummen und selbst der Tod seinen Schrecken verliert. \"Die Welt ist von einer nie erlebten, wohlwollenden Güte. Die Wand, die mich sonst von den anderen Dingen trennt, ist niedergebrochen\", notiert Tichy später. In diesem einen Moment, in dem Tichy eine Ahnung vom Glück der Wunschlosigkeit bekommt, verdichtet sich sein Leben. Es ist nicht das Leben eines grimmigen Bergsteigers, sondern das eines ratslosen Wanderers und ewig Suchenden nach einem \"Hauch des Jenseitigen\".Österreich 2026, R: Fritz Kalteis"
  widescreen: true
