  title: Akcent
  description: Vltava uvádí sérii Vladimira 518 s názvem Betonový lidi. Ta přináší nový pohled na paneláková sídliště. Jak ale o moderních sídlištích přemýšlí současní architekti, urbanisté a odborníci na veřejný prostor? Lze se z panelové výstavby nějak poučit? Saša Michailidis se ptá Filipa Tittla a Laury Doležalové.
- eventId: 1454005
  start: 2026-10-05T15:02:00Z
  stop: 2026-10-05T16:00:00Z
  title: ArtCafé
  description: 'Návrat k sobě skrze ztrátu, smíření a odvahu. Hudebnice a zpěvačka Tereza Hrabini vydává své druhé album Dceremonie. Název spojuje slova dcera a ceremonie a odkazuje k rodinné historii, dětským tématům i částem osobnosti, které jsme se možná naučili skrývat. O tom, co pro Terezu Hrabini znamená opustit staré vzorce, znovu hledat vlastní identitu a přijmout i ty části sebe, které dlouho skrývala, bude řeč v ArtCafé. Moderuje David Pomahač. E-mail: artcafe@rozhlas.cz'
- eventId: 1454006
  start: 2026-10-05T16:00:00Z
  stop: 2026-10-05T16:30:00Z
  title: Jazzový podvečer
  description: O všem novém v jazzu s Davidem Bradou. Pro každého, kdo nepřestává hledat a chce zůstat "up to date", stejně jako autor pořadu, jenž flámoval s Quincym Jonesem. Každé pondělí uvádí David Brada.
- eventId: 1454007
  start: 2026-10-05T16:30:00Z
  stop: 2026-10-05T17:00:00Z
  title: Četba na pokračování
  description: 'Julien Green: Bratr František (6/15). Biografický román francouzského prozaika líčí životní dráhu asi největší postavy středověkého mnišství od jeho zrození v rodině soukeníka z umbrijského městečka Assisi, přes bezstarostné mládí a zlomový okamžik, kdy se rozhodl opustit kariéru obchodníka a založit bratrstvo, které se vydalo cestou naprosté chudoby. Z překladu Anděly Janouškové připravila Alena Heroutová. Účinkuje Jan Hartl. Režie Hana Kofránková (26 min). Natočeno v roce 2003'
- eventId: 1454008
