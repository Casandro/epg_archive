  title: Vizitka
  description: 'Anna Freimanová, editorka Havlových děl. S editorkou Havlových textů a později popularizátorkou jeho děl a také jeho přítelkyní Annou Freimanovou uzavřeme ve Vizitce měsíc věnovaný Václavu Havlovi, který by se právě dnes dožil devadesáti let. Jak vnímal své dílo, když ho začali po revoluci divadla hrát? A nakolik zažíval po pádu režimu svobodu, když byl najednou tolik na očích? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
