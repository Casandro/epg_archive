- eventId: 1454009
  start: 2026-10-05T17:30:00Z
  stop: 2026-10-05T20:00:00Z
  title: Koncert SOČR
  description: Na programu přímého přenosu koncertu SOČR z Dvořákovy síně pražského Rudolfina bude skladba Charlese Ivese The Unanswered Question, dále první veřejné provedení Houslového koncertu Jana Kučery se sólistou Davidem Pokorným (přímo pro něj byla skladba zkomponována) a poté ve druhé půli večera sedmidílná suita Gustava Holsta Planety, op 32. Jan Kučera se zároveň ujme dirigování. Spolu s Rozhlasovými symfoniky vystoupí také komorní ženský sbor Carmina Bohemica a Dětský pěvecký sbor Českého rozhlasu pod vedením sbormistryně Věry Hrdinkové. Moderátorským slovem provází Jitka Novotná. Koncert bude vysílán v přímém přenosu na ČRo Vltava, v záznamu pak následující středu na ČRo D-dur.
