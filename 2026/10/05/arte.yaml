- eventId: 889814
  start: 2026-10-05T00:40:00Z
  stop: 2026-10-05T01:35:00Z
  title: Capital B - Wem gehört Berlin? (4/5)
  subtitle: Arm, aber sexy!
  subtitled: true
  description: '"Ich bin schwul und das ist auch gut so!" Nachdem der Berliner Bankenskandal das etwas verstaubte Machtduo Eberhard Diepgen und Klaus-Rüdiger Landowsky im Jahr 2001 hinweggefegt und die Käseglocke von Berlin genommen hat, zieht mit dem charmanten und auch machtbewussten Klaus Wowereit ein neuer Stil in die Politik ein: Locker nach außen, aber knallhart in der Sache. Die verlorenen Wetten der 90er Jahre und die unseriösen Geschäfte seiner Vorgänger und der Berliner Bankgesellschaft haben die Stadt in eine tiefe finanzielle Krise gestürzt. Berlin muss "Sparen bis es quietscht!".'
- eventId: 889815
  start: 2026-10-05T01:35:00Z
  stop: 2026-10-05T03:10:00Z
  title: Capital B - Wem gehört Berlin? (5/5)
  subtitle: Die Stadt als Beute
  subtitled: true
  description: Im letzten Jahrzehnt erobert das Kapital die Stadt. Während von New York aus eine Finanzkrise die Welt in Atem hält, passiert in Berlin zur Überraschung Vieler das Gegenteil. Die Stadt boomt. Endlich. Berlin zieht zur Freude des Regierenden Bürgermeisters Klaus Wowereit, der Berlin eben noch als "arm, aber sexy" beworben hat, nicht nur Touristen, sondern auch Investoren aus aller Welt an und wird zum milliardenschweren Immobilieneldorado.
- eventId: 889944
  start: 2026-10-05T03:10:00Z
  stop: 2026-10-05T03:55:00Z
  title: Japans tätowierte Helden
  subtitle: Deutschland 2023
  genre:
  - '112'
  subtitled: true
  description: 'Japan wird weltweit für seine Traditionen und Künste bewundert. Von opulenten Stoffen über imposante Holzschnitzereien und filigrane Kalligraphie. Doch eine Kunstform ist fast in Vergessenheit geraten: die traditionelle Tätowierung - das Horimono. Einst höchst populär, ist es heute zum Zeichen der kriminellen Yakuza geworden, die wahre Geschichte ist kaum bekannt.'
- eventId: 889945
  start: 2026-10-05T03:55:00Z
  stop: 2026-10-05T04:50:00Z
  title: 360° Reportage
  subtitle: Australien - Mission Schnabeltier
  subtitled: true
  description: 'Sie gehören zu den bekanntesten Tieren Australiens und den skurrilsten Erscheinungen der Natur: die Schnabeltiere. Ausgestattet mit einem Schnabel und gleichzeitig einem dichten Pelz, eierlegend und trotzdem ihre Jungen säugend, wurden die Tiere einst von den ersten europäischen Entdeckern für eine Fälschung cleverer Geschäftsleute gehalten. Danach wurden sie wegen ihres Pelzes gejagt und fast ausgerottet. Zwischenzeitlich hatte sich ihr Bestand erholt. Doch die Bedrohungen der letzten Jahre - vorrangig Buschfeuer, Überschwemmungen, doch auch fortschreitende Landnahme durch die Menschen - setzen den eigentümlichen Tieren erneut zu.'
- eventId: 889946
  start: 2026-10-05T04:50:00Z
  stop: 2026-10-05T05:20:00Z
  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Hafer
  subtitled: true
  description: 'Hafer ist die Frühstückszutat. Aber was hat Porridge mit Gefängnis zu tun? Und was ist das Besondere am walisischen, schwarzen Hafer? Experten erklären, warum Getreide eine Rolle bei der Domestizierung der Katze spielte. Und in der Küche zeigt Lucie, wie vielseitig Hafer sich in der Küche verwenden lässt: von Hafermilch und Granola über Overnight Oats bis zu Energiebällchen.'
