  title: Tax me (if you can!) (1/2)
  subtitle: Die Steuertricks der Superreichen
  subtitled: true
  description: Der erste Teil der Dokumentation zeigt, wie die Ungleichheiten im Steuersystem im vergangenen halben Jahrhundert langsam, aber stetig zunahm. Einige Vermögende entwickelten unter US-Präsident Ronald Reagan die "Trickle-down-Theorie" und ließen die Welt glauben, dass ihre Steuererleichterungen im Laufe der Zeit auch dem Allgemeinwohl zugutekämen.
- eventId: 890015
  start: 2026-10-05T07:40:00Z
  stop: 2026-10-05T08:30:00Z
  title: Tax me (if you can!) (2/2)
  subtitle: Millionäre kämpfen für Gerechtigkeit
  subtitled: true
  description: Wer kämpft für mehr Steuergerechtigkeit? Der Wirtschaftswissenschaftler Gabriel Zucman ist der Held einer Bewegung, die in den USA ihren Anfang nahm. Einige Millionäre schlossen sich ihm an, um Staaten und Institutionen von der Notwendigkeit einer Reform für die Besteuerung der Superreichen zu überzeugen. Davon erzählt der zweite Teil der Dokumentation "Tax me (if you can!)".
