  description: Humorna drama. Možeš biti dobar pisac jedino ako imaš kvalitetan seks. To je mišljenje Sašina urednika, nezadovoljnog njegovim posljednjim pričama koje su ujedno i bijeg od nezadovoljavajućeg posla gastrokritičara. Istina je - Sašin intimni život poznaje i bolje dane. No, sve se mijenja kad upozna Ines, maserku i trenericu u fitness centru. Spretna i praktična, ona predstavlja suštu suprotnost njegovom karakteru. Kad, nakon zajedničke večere, Saša konačno napiše poražavajuću recenziju za skorojevićevski restoran, pokrenut će lavinu događaja koji će ga natjerati da se konačno suoči sa samim sobom i barem pokuša zaštititi ono do čega mu je najviše stalo...
