  description: 'Der Weltmeister von 2014 spricht über besondere Begegnungen mit Menschen und wie sie unser Leben berühren können. Und vielleicht werfen wir einen gemeinsamen Blick auf das aktuelle Nationalteam. Ehrlich, selbstironisch und lässig: Christoph Kramer auf dem Roten Sofa.'
- eventId: 1490459
