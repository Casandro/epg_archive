  title: die nordstory - Land unter auf Hallig Hooge
  description: Die Bewohner von der Hallig Hooge sind einiges gewohnt, was Wind und Wetter angeht. Mindestens zehn Mal im Jahr versinkt ihre Hallig in der Nordsee. "Land unter" nennen das die Halligbewohner und lächeln über die Aufgeregtheiten, die dieses Naturereignis regelmäßig bei Gästen und Festländern verursacht. Doch als der Wetterbericht einen Orkan ankündigt, sind die Halligbewohner besorgt. Kommt es so schlimm, wie die Wetterexperten prognostizieren?
