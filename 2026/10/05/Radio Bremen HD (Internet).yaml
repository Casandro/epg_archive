  subtitle: Kampf ohne Sieger
  description: Frisch aus dem Ring wird die Boxerin Linn Strandberg in die Notaufnahme eingeliefert und von Dr. Annika Rösler und Dr. Emma Jahn erstversorgt. Linn hat einen Schlag auf die Leber einstecken müssen. Diese bereitet ihr große Schmerzen. Linns Trainer und älterer Bruder Per Strandberg begleitet sie während ihres Klinikaufenthalts. Er ist selbst ehemaliger Boxer und sorgt sich um seine Schwester. Während er ihr Beistand leistet, gesteht er den Ärzten, dass es ihm in letzter Zeit selbst nicht so gut geht. Die weiteren Untersuchungen haben für das Geschwisterpaar schwerwiegende Folgen.
