  title: TELEKOLLEG Politik und Gesellschaft (3)
  subtitle: 'Gemeinsam stark: Auf dem Weg zur Bürgergesellschaft'
  description: 'Für gemeinsames Engagement gibt es viele Organisationsformen, zum Beispiel Vereine, Gewerkschaften oder NGOs. Eines ist ihnen allen gemein: Der Einsatz für gemeinsame Ziele bringt die Beteiligten weiter - im Leben und auf dem Weg zu einer Bürgergesellschaft.'
- eventId: 890100
  start: 2026-10-05T05:00:00Z
  stop: 2026-10-05T05:25:00Z
  title: Wissen macht Ah!
  subtitle: Wissen macht Mäh!
  description: |-
    Entfernte Geräusche und ein eindeutiger Geruch sorgen heute für Irritation im Studio. Bald stehen Clarissa und Ralph inmitten einer blökenden Schafherde. Wie kommen die Tiere ins Studio? Und was hat Lumpi damit zu tun? Während der Suche nach einer Erklärung bleibt genug Zeit für farbenfrohe Versuche mit Säuren und Basen und außerdem für die Antworten auf die fünf Fragen der Sendung:
    * Ist Nase hochziehen besser als putzen?
    * Kann Pipi wirklich zu Stein werden?
    * Wieso werden Gläser in der Spülmaschine irgendwann "blind"?
    * Warum sind Vogelnester nicht voller Kacke?
    * Warum schwimmt manchmal Schaum auf Flüssen?
- eventId: 890101
  start: 2026-10-05T05:25:00Z
  stop: 2026-10-05T05:35:00Z
  title: POV - Deine Geschichte zählt
  subtitle: Bundeswehr (2) - Wehrdienst? Nein danke!
  description: 'Für Lenni (18) steht fest: Er will nicht zur Bundeswehr und setzt sich gegen eine Wehrpflicht ein. Für ihn geht es dabei vor allem um Selbstbestimmung und die Frage, wie stark der Staat in die Zukunft junger Menschen eingreifen darf. Gleichzeitig haben Freunde von Lenni einen anderen Weg gewählt und sind zur Bundeswehr gegangen.'
- eventId: 890102
  start: 2026-10-05T05:35:00Z
  stop: 2026-10-05T06:00:00Z
  title: Willi wills wissen
  subtitle: Wer wirft ein Auge aufs Auge?
  subtitled: true
  description: 'Diesmal verschafft sich Reporter Willi zum Thema Augen den Durchblick. Los geht''s mit Augenarzt Dr. Tobias Neuhann, der ihm einen Grundkurs über Aufbau und Funktion des menschlichen Auges gibt: Pupille, Regenbogenhaut, Linse, Netzhaut, blinder Fleck, wofür die Hornhaut wichtig ist und wie es zu Sehfehlern kommen kann. Viele Menschen benötigen früher oder später eine Brille. Bei einer Firma in München erfährt Willi, wie man eine Brille herstellt. Designer Peter entwirft extra für ihn ein Spezialmodell in W-Form. Und wie kommen die Gläser in die Brille?'
