  title: Tele-Gym (2/8)
  subtitle: Starker Rücken
  subtitled: true
  description: Die beste Therapie gegen Rückenschmerzen besteht in der aktiven Vorbeugung durch gezieltes Training. Johanna Fellner zeigt effektive Trainingseinheiten für einen starken und gesunden Rücken. Beugende, streckende und rotierende Bewegungen sowie statische Ganzkörperpositionen und Balance-Übungen ergeben ein optimales Gesamtpaket. Die gesamte Rumpfmuskulatur, insbesondere der Rücken, wird gekräftigt, stabilisiert und mobilisiert. Dadurch wird der Körper ideal auf die Anforderungen des Alltags vorbereitet und Rückenschmerzen bzw. Verletzungen vorgebeugt.
