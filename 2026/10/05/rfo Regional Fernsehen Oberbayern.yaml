- eventId: 1280383
  start: 2026-10-05T00:00:00Z
  stop: 2026-10-05T00:10:00Z
  title: Süd Blick vom 4.10.2026 (Wh.)
  subtitle: Weltkriegsbombe in Rosenheim entdeckt - Entschärfung erfolgreich +++ Fernwärmeprojekt für Obing gestoppt +++ Veränderung der Arbeitslosenzahlen in der Region
  description: 'Nach dem Fund einer 250-Kilo-Weltkriegsbombe bei Bahnarbeiten in Rosenheim wurden 1500 Menschen evakuiert, Straßen und Bahnstrecke gesperrt und ein 500-Meter-Radius eingerichtet, bevor der Kampfmittelräumdienst den Blindgänger abends entschärfte und abtransportierte. +++ Obing stoppt das geplante Fernwärmeprojekt: Trotz Förderchancen lehnte der Gemeinderat wegen hoher Kosten und Risiken ab, Proteste blieben aus, und geheizt wird vorerst wieder privat, während ein späteres, tragfähiges Konzept weiter möglich bleibt. +++ Der Arbeitsmarkt im Agenturbezirk Rosenheim bleibt im September träge: 10.500 Menschen sind arbeitslos, 54 weniger als im August, aber 250 mehr als vor einem Jahr; die Quote liegt bei 3,3 Prozent, in der Stadt bei 5,2, während Firmen weiter Stellen melden, jedoch vorsichtiger einstellen.'
- eventId: 1280384
  start: 2026-10-05T00:10:00Z
  stop: 2026-10-05T00:20:00Z
  title: Süd Blick vom 4.10.2026 (Wh.)
  subtitle: Großer Parkinson-Tag in Traunstein  +++ Thermentipp Herbstzeit ist Saunazeit +++ Das Siegel Inklusive Region für Rosenheim +++ Festgottesdienst 100 Jahre Rupertuskirche Freilassing
  description: 'Parkinson ist mehr als Zittern: Beim Großen Parkinson-Tag in Traunstein informiert das Parkinson Netz Südostbayern am 17. Oktober im Landratsamt mit Vorträgen und Erfahrungsberichten über Herausforderungen der Krankheit und Hilfen für Betroffene und Angehörige. +++ Wenn die Tage kürzer werden und die Temperaturen fallen, steigt das Erkältungsrisiko, doch Saunieren kann das Immunsystem stärken, wie die Rupertustherme in Bad Reichenhall betont: Im Herbst ist Saunazeit. +++ Stadt und Landkreis Rosenheim sind jetzt offiziell "Inklusive Region". Das Kultusministerium in München hat den Titel vergangene Woche Donnerstag verliehen, zusammen mit dem Nürnberger Land und dem Oberallgäu. +++ Am 24. Mai 1926 weihte Erzbischof Michael von Faulhaber die neu errichtete Rupertuskirche in Freilassing, die heuer ihr 100-jähriges Bestehen feiert, und beim Patroziniums-Festgottesdienst nannte Weihbischof Rupert Graf zu Stolberg sie ein steinernes Glaubenszeugnis.'
- eventId: 1280385
  start: 2026-10-05T00:20:00Z
  stop: 2026-10-05T00:30:00Z
  title: Süd Blick vom 4.10.2026 (Wh.)
  subtitle: Apfelfest im Sortenerhaltungsgarten Haberland +++ Das TAM Ost präsentiert - Wir sind die Neuen +++ Neue Kita für Traunreut-Traunwalchen
  description: 'Im Berchtesgadener Land, einem von sechs Alpenvorland-Kreisen, wird seit elf Jahren nach bedrohten Apfel- und Birnensorten gesucht; das Projekt Apfel.Birne.Berge brachte den Sortenerhaltungsgarten in Haberland hervor, der beim zweiten Apfelfest viele Besucher anzog. +++ Im TAM OST Rosenheim prallen in Wir sind die Neuen drei Ruheständler in einer WG auf drei Studenten, was viel Humor und Nachdenkliches über Lebensentwürfe und Zusammenleben der Generationen liefert; zu sehen ist das Stück bis 17.10. +++ Traunreut hat im Ortsteil Traunwalchen die neue Kita Mariä Geburt eingeweiht: Für 100 Kinder, darunter 13 Krippenplätze, wurden für sechs Millionen Euro Gebäude und Außenanlagen geschaffen, zur Eröffnung sangen die Kinder und die Einrichtung wurde gesegnet.'
