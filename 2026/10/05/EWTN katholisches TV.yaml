  description: Alles begann mit einem Projekt für die Uni - doch Meike Kocholl konnte nach ihrem Studienabschluss nicht zulassen, dass ihre Ideen in der Schublade verschwinden. Deshalb arbeitet sie mit finanzieller Unterstützung der reformierten Kirche St. Gallen daran, ihre App "Resilyou" auf den Markt zu bringen. Wieso die Welt auf "Resilyou" gewartet hat, erklärt Meike Kocholl in einem exklusiven Interview mit GRANDIOS.
