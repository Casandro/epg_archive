  title: Velká pohádka
  description: 'Spící město. Jaké by to bylo, kdyby na světě usnuli všichni rodiče a vzhůru zůstali jen bezdětní? To na vlastní kůži zažijí čtyři sourozenci, kteří musí bojovat o přežití a spolehnout se především sami na sebe. Na motivy stejnojmenné knihy Martina Vopěnky napsal a režíroval: Josef Kačmarčík. Účinkují: Lukáš Vejšický, Viktor Krčmář, Luisa Jirsová, Magdaléna Müller, Lucie Pernetová a další.'
