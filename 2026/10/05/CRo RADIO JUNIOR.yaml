  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Silvie Ulrichová, psychoterapeutka ve výcviku. Linka důvěry - Batoh z dětství. Co nám rodiče dávají na cestu do dospělosti? Pochvala, objetí, útěcha, když se nedaří, a jasná pravidla. Proč je láska rodičů pro celý život důležitější než přísnost? Terapeutka Silvie Ulrichová se zeptala téměř 500 dospělých na jejich dětství a výsledky vás možná překvapí. Poradíme dětem i rodičům a zavolat můžete i vy. Moderuje Klára Nováková.
