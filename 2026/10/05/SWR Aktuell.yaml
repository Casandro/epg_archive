- eventId: 832363
  start: 2026-10-05T16:30:00Z
  stop: 2026-10-05T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Václav Havel - Vom Bürgerrechtler zum tschechischen Präsidenten
  description: |-
    Von Lukas Meyer-Blankenburg
    Václav Havels Lebenslauf ist einzigartig. Vor 90 Jahren, am 5. Oktober 1936 in Prag geboren, machte er sich zunächst einen Namen als Lyriker. Als Bürgerrechtler und Initiator der Charta 77 steckten ihn die Kommunisten mehrmals ins Gefängnis. Nach der Samtenen Revolution wurde er der letzte Präsident der Tschechoslowakei und anschließend der erste Präsident Tschechiens. Er galt als integer und als moralische Instanz in Europa. Heute sorgt ein Streit an der renommierten Václav Havel-Bibliothek in Prag für eine nationale Debatte über den richtigen Umgang mit Havels politischem Erbe.
- eventId: 832364
  start: 2026-10-05T17:00:00Z
  stop: 2026-10-05T18:00:00Z
  title: Der Tag
  description: "Es ist ein stilles Gefühl, das doch ohrenbetäubend laut sein kann: \nEinsamkeit. Obwohl wir in einer hypervernetzten Welt leben, fühlen sich immer mehr Menschen isoliert. Wir blicken hinter die Fassade eines Tabus. Was passiert im menschlichen Gehirn, wenn soziale Kontakte fehlen? Warum wirkt sich Einsamkeit messbar auf die physische Gesundheit aus, und welche gesellschaftlichen Entwicklungen verstärken die Isolation? Warum sehen wir Einsamkeit immer noch als persönliches Versagen statt als biologisches Warnsignal und gesellschaftliche Herausforderung?"
  subtitle: Die Vermessung der Stille - Wenn aus Alleinsein Einsamkeit wird
