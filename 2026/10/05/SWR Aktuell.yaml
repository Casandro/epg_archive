    14:00 - 15:00
    MAFIA LAND
    Koks und Küsschen: Geschäfte mit Alpenblick (1/4)
    Bacetto war ein kaltblütiger Krimineller, ein Mann, der der italienischen 'Ndrangheta zugerechnet wird. Er hat sich eine unauffällige Fassade aufgebaut: Als Pizzeria-Betreiber mit dem charmanten Spitznamen, der auch noch mit italienischen Lebensmitteln handelt und ganz bescheiden in einem kleinen Dorf lebt. Wir reisen an den Bodensee und erfahren dort, wie Bacetto es so lange unentdeckt geschafft hat, den Kokainschmuggel voranzutreiben und wie ihm die Polizei mit Undercover-Ermittlungen irgendwann doch auf die Spur gekommen ist.
    Von Karin Senz
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/
