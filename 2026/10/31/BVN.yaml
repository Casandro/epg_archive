  title: Vroege vogels
  subtitle: Landgoed Junne S23 E20. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: Op Landgoed Junne aan de Overijsselse Vecht wisselen stuifzandvlaktes, uiterwaarden en bossen elkaar af. In de rivier zwemt de kleine modderkruiper tussen larven van de weidebeekjuffer en aan de oevers tussen grazende koeien, groeit de steenanjer. In het stuifzand zien we donkere gootschildwantsen en zandoorwormen. De filmploeg overnacht in een oude zagerij, waar 's avonds konijnen rondhuppelen. De bomen in het nabijgelegen productiebos zijn al jaren een belangrijke inkomstenbron, maar daarin is ook veel oog voor de ecologie. Boommarterholen, korstmossen en nesten van zeldzame mieren worden uitstekend beschermd. (2026)
