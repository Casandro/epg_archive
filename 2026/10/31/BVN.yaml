  title: Radar
  subtitle: S22 E27. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: De tabaksindustrie blijft nieuwe manieren bedenken om mensen verslaafd te maken aan nicotine. Na vapes en nicotinezakjes verschijnen er nu namelijk ook nicotinesnoepjes- en strips op de markt, die vooral aantrekkelijk zijn voor de jeugd. Hoe kan het dat de industrie telkens nieuwe nicotineproducten op de markt kan brengen en dat de Europese wetgeving gevoelsmatig achter de feiten aanloopt? We duiken in de machtige nicotinelobby in Brussel en vraagt minister van Volksgezondheid, Welzijn en Sport, Sophie Hermans, of we wel genoeg doen om deze industrie een halt toe te roepen. (2026)
