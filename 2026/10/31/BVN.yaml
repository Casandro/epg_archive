  title: Binnenstebuiten
  subtitle: S12 E148. Een creatieve broedplaats waar achttien grotendeels zelfgebouwde huizen staan, kok Jetske ontdekt hoe je vegetarische vis maakt en bioloog Casper laat de wilde natuur zien naast een industriegebied.
  description: 'Vlakbij de stad Groningen ligt een plek die zich nauwelijks in een hokje laat stoppen: de Paradijsvogeltuin. Een creatieve broedplaats waar achttien bewoners in hun grotendeels zelfgebouwde huizen wonen. Het ene huis heeft een zeecontainer als basis, de andere een gevel vol kozijnen en ook staat er een circuswagen. * Vegetarische vis, dat bestaat. Kok Jetske is in Bergen op Zoom om uit te zoeken hoe dat wordt gemaakt en hoe het smaakt. Natuurlijk maakt ze er ook een heerlijk gerecht mee. * Naast het industriegebied van de Maasvlakte ligt Oostvoorne; een uniek stukje natuur. Bioloog Casper laat deze verborgen parel van wilde natuur zien. (2026)'
