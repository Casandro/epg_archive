  title: Expeditie Nederland
  subtitle: Regionale sporthelden S05 E28. Onderwerpen die iedereen raken kunnen, hoe klein ons land ook is, een paar kilometer verderop een ander verhaal opleveren. Ze worden belicht door verslaggevers uit de regio's.
  description: Voor een land met relatief weinig inwoners doet ons land het internationaal gezien heel goed op topsportgebied. Nederland heeft heel wat sporthelden voortgebracht. Ze wonnen medailles en titels, braken records en kwamen uit alle delen van het land. Voor Arnold Vanderlyde uit Sittard begon het allemaal voor de spiegel. Hij sprak zichzelf moed in en schopte het uiteindelijk via de nationale tot internationale bokstop. Enith Brigitha hoorde in de jaren zeventig bij de beste zwemmers ter wereld. Op de Olympische Spelen van 1976 won ze twee bronzen medailles en schreef ze geschiedenis als eerste zwarte vrouw met een olympische medaille. (2026)
