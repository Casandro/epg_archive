    Südkalifornien: In den späten 1990er-Jahren ereignet sich ein bizarrer Zwischenfall. Annie Day (Lucy Lawless), ein eingefleischter Xena-Fan, ist felsenfest davon überzeugt, die Reinkarnation der Kriegerprinzessin zu sein. Eine gewisse Ähnlichkeit ist durchaus vorhanden. Um mehr über ihre altertümlichen Visionen herauszufinden, zieht die Frau eine Spezialistin (Renée O'Connor) zurate. Die Rückführung in frühere Leben bringt verblüffende Details ans Licht. Annie ist in Wahrheit eine Wiedergeburt von Joxer, ihr Freund Harry (Ted Raimi) wandelte vor langer Zeit als Xena über die Welt und die Therapeutin Mattie Merrill hörte einst auf den Namen Gabrielle.
