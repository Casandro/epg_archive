  title: 'Die Reportage: Wald des Jahres - Wald der Zukunft?'
  subtitle: Ein Spaziergang auf dem Holzweg
  description: |-
    von Dagmar Scholle
    Wer sich im Saarland umschaut, sieht fast immer irgendwo Wald. Ein gutes Drittel der Landesfläche ist damit bedeckt. Vor allem mit Laubwäldern. Eintönige Fichtenforste: eher selten. Auch die Art der Waldbewirtschaftung hierzulande gilt bundesweit als vorbildlich. Schon seit Ende der 1980er Jahre wird "naturnah" gewirtschaftet. Keine Kahlschläge mehr, zum Beispiel. Und gleich zwei Waldgebiete erhielten in diesem Jahr eine Auszeichnung. Der Saarkohlenwald als "Waldgebiet des Jahres", und Blieskastel trägt jetzt den schönen Titel "Waldhauptstadt".
    Klingt alles vorbildlich, aber: wieso geht es unseren Wäldern trotzdem erkennbar nicht gut? Überall ist zu sehen, dass die Bäume leiden - braunes Laub, dürre Äste, sogar Waldbrände; hierzulande eigentlich die absolute Ausnahme. Wenn das so weitergeht mit den trockenen und heißen Sommern, was wird dann aus unserem Wald? Ein Besuch bei Förstern und Waldbesitzern, Schreinern, Holzhändlern und vielen anderen - immer auf der Suche nach Antworten, die eigentlich noch keiner kennt. Umso drängender sind die Fragen.
