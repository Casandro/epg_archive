  title: Planet Weltweit - Kanada, Indianer schreiben Geschichte
  subtitle: Planet Weltweit - Kanada, Indianer schreiben Geschichte
  description: Viele Indianerstämme Kanadas versuchen bis heute, ihre Traditionen und Bräuche zu bewahren. Die Xeni Gwet'in vom Stamm der Chilcotin sind nun in einem historischen Gerichtsurteil zu Besitzern des Reservats erklärt worden, auf dem sie seit Jahrzehnten leben. Doch hilft ihnen ihr Sieg auch im Kampf gegen ein Minenprojekt, das neben einem ihrer heiligen Seen geplant wird? DE 2014
- eventId: 784598
  start: 2026-10-31T07:10:00Z
  stop: 2026-10-31T08:01:00Z
  title: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  subtitle: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  description: 'In der indischen Himalaja-Provinz Ladakh auf 3500 Metern Höhe wird seit Jahrzehnten Eishockey gespielt - vor allem von Männern aus der Armee, die die Grenzen zu China und Pakistan sichern. Seit einigen Jahren trainieren in dieser abgelegenen Bergregion auch immer mehr Frauen und Mädchen Eishockey. Mit Erfolg: Die 20-jährige Tsewang Chuskit ist eine der besten Spielerinnen in Ladakh.  Ladakh im Nordwesten Indiens ist ein Gebiet der Extreme. Auf einer Höhe zwischen 2500 und fast 7700 Metern herrscht monatelang klirrende Kälte, es gibt kaum Niederschläge. So ist Ladakh eine Gebirgswüste mit wenig Vegetation, aber strategisch wichtig durch die Lage an der Grenze zu Pakistan und China. Neue Entwicklungen oder gar moderne Umbrüche halten nur sehr zögerlich Einzug. Umso verwunderlicher, dass es seit einiger Zeit in Ladakh sogar Frauen- und Mädcheneishockey gibt. Diese Reportage hat das aussichtsreichste Frauenteam besucht, mitten im Himalaja. Übersetzt bedeutet Ladakh: Land der hohen Pässe. Direkt hinter der Hauptstadt Leh windet sich die Straße die Gebirgskette hoch bis auf 5600 Meter, und führt in ein Tal an der Grenze zu China. 20 Kilometer außerhalb der Stadt, am Ufer des Indus, liegt das Secmol-Internat, in dem Tsewang Chuskit lebt und lernt. SECMOL steht für: Students Educational and Cultural Movement of Ladakh - übersetzt: Studenten- und Schülerbewegung von Ladakh. Eine private Schulinitiative, die Kindern und Jugendlichen aus armen Dorffamilien den Zugang zu Bildung ermöglichen will. Eishockey ist wichtiger Teil des Erziehungsprogramms. Chuskit wohnt seit zwei Jahren hier und trainiert, wie die anderen Mädchen, jeden Morgen auf dem schuleigenen, selbst gebauten Eishockeyfeld. Von Mitte Dezember bis Ende Februar sind Schul- und Universitätsferien. Dann wird jeden Morgen und jeden Abend Eishockey trainiert und gespielt. Nach dem gewonnen Halbfinale bereitet sich das Team jetzt auf das kommende Endspiel vor. DE 2014'
- eventId: 784599
  start: 2026-10-31T08:10:00Z
  stop: 2026-10-31T09:02:00Z
  title: Planet Weltweit - Die Baumkletterer von Kalifornien
  subtitle: Planet Weltweit - Die Baumkletterer von Kalifornien
  description: 'Rick Dirks gehört zu den besten Baumkletterern Kaliforniens: Mit Geschicklichkeit und Wagemut klettert er in atemberaubendem Tempo auf die über 100 Meter hohen Redwoods, übernachtet auch schon mal im angeseilten Schlafsack in den Kronen der Riesen. Zu kompliziert und zeitaufwändig ist ein Ab- und wieder Aufseilen für den nächsten Tag.  DE 2014'
- eventId: 784600
  start: 2026-10-31T09:10:00Z
  stop: 2026-10-31T10:02:00Z
  title: Planet Weltweit - SOS in den Rocky Mountains
  subtitle: Planet Weltweit - SOS in den Rocky Mountains
  description: "Wenn der Notruf eingeht, sitzen George Field und seine Männer nach wenigen Minuten im Hubschrauber. Die Bergretter in den kanadischen Rocky Mountains müssen Wunden versorgen, Schmerzen lindern und Menschen aus großer Gefahr befreien. Häufig blicken die Kollegen dabei auch dem Tod in die Augen. \n\nEin Wochenanfang im August. In den letzten Tagen ist in den Bergen der Kananaskis-Naturparks viel Regen gefallen. Doch jetzt herrscht wieder das spätsommerliche Wetter, das Tausende Menschen her lockt. Das bedeutet für die Bergretter aus Canmore wieder mehr Einsätze. Seit 1982 hat der Chef der Bergretter George Field sein dreiköpfiges Profiteam zum berühmtesten in den Rocky Mountains gemacht. Zusammen mit 25 Rangern kämpft es fast jeden Tag in den Bergen Kanadas um Menschenleben. George Field bekommt eben den ersten Funkspruch des Tages. Wenig später sitzen er und seine Kollegen Mike Koppang und Burke Duncan im Hubschrauber. Aus der Luft betrachten sie die Kette der vereisten Bergspitzen und die weitenläufigen grün bewaldeten Täler. Obwohl Georg diesen Blick schon Hunderte Male genießen durfte, gibt es für ihn nichts Schöneres als über das Bow Valley zu fliegen, über die smaragdgrünen Seen und schroffen Gipfel. Es ist zugleich die Ruhe vor dem Sturm. Denn sein Job erfordert höchste Konzentration und Flexibilität. Nach einer Rettung, die glücklich endet, folgt häufig gleich danach das pure Entsetzen: ein tödlicher Absturz bei einem Spaziergang in den Bergen oder ein vermisster Jungendlicher, vermutlich ertrunken. Mit viel Hubschraubergetöse erreichen sie schließlich ihr Zielgebiet. In einer Steilwand sehen sie Freizeitsportler, die Hilfezeichen geben. Gibt es Verletzte oder haben sich die Männer nur verirrt? Was wird die Retter erwarten? \n DE 2010"
- eventId: 784604
  start: 2026-10-31T10:10:00Z
  stop: 2026-10-31T11:02:00Z
  title: Planet Weltweit - Sumatra - Ettis Schönheitssalon
  subtitle: Planet Weltweit - Sumatra - Ettis Schönheitssalon
  description: 'Seit mehr als 20 Jahren führt Elitha Suarti Heirunas ihren Schönheitssalon in Bukittinggi auf Westsumatra. Ettis Salon ist eine Institution. Plakate mit asiatischen Schönheiten verraten die neuesten Trends, auch wenn bei den meisten Frauen der wichtigste Haarschmuck das Kopftuch bleibt. Denn auf Westsumatra ist der Islam Hauptreligion. Obwohl Westsumatra zwischen dem 13. und 15. Jahrhundert islamisiert wurde, hat sich ein Großteil der Einwohner, die Volksgruppe der Minangkabau, Teile ihrer früheren Tradition bewahrt. Neben den islamischen Regeln folgen sie dem Adat - einem matrilinear organisierten Gesellschaftssystem. Bis heute sind es nur die Frauen der Minangkabau, die erben - ihnen gehört sämtlicher Besitz. Aber der Einfluss des patriarchalisch geprägten Islam ist dennoch deutlich zu spüren. Friseur- und Kosmetiksalons wie der von Etti hatten lange einen zweifelhaften Ruf: Sie seien nicht "haram", nicht rein. Aber Etti ist über 20 Jahre beharrlich ihren Weg gegangen und überzeugt durch ihre Seriosität. Auch bei der Organisation von Hochzeiten verlässt man sich gerne auf Ettis jahrzehntelange Erfahrung bei der Verschönerung von Haus und Braut. In wenigen Stunden verwandelt sie mit ihrem Team das Haus der Brauteltern in einen prunkvollen Palast aus Gold, feinen Stoffen und aufwendig verzierten Holzbauten. Früher war die Organisation der Hochzeiten ausschließlich Angelegenheit der Familie. Aber auch auf Westsumatra läuft die Zeit immer schneller. Heute überlässt man die aufwendige Arbeit lieber erfahrenen und routinierten Spezialisten wie Etti. Auch Epi hat sich für eine Hochzeit vom Profi entschieden - seit Tagen schon kümmert sich Etti um die Organisation, verziert die Torte, sorgt für die Schönheit der Braut und die Verpflegung der Gäste. Doch ein Restrisiko bliebt immer, denn Etti weiß "Bei der ganzen Aufregung kann immer etwas schief gehen. Eine Hochzeit bleibt eben von Anfang bis Ende etwas, was man nicht genau berechnen kann."  DE 2006'
- eventId: 784612
  start: 2026-10-31T11:10:00Z
  stop: 2026-10-31T12:02:00Z
  title: Planet Weltweit - Rom - Das Leben der Komparsen
  subtitle: Planet Weltweit - Rom - Das Leben der Komparsen
  description: '"Drehen Sie bitte Ihren Kopf nach links, dann nach rechts. Einmal lachen und einmal ernst schauen. Danke, wir melden uns bei Ihnen" So schnell endet ein Bewerbungsgespräch im Leben von Angelo Amoretti. Er arbeitet als Komparse, seit er in Rente ist, und hat sein Gesicht schon im Hintergrund vieler berühmter Filme gezeigt, wie z.B. "Gangs of New York" von Martin Scorsese. Am nächsten Tag muss Angelo eine Kostümprobe absolvieren - der letzte Schritt, bevor er bei einem Film angenommen wird. Denn der Kostümfundus ist begrenzt, und wenn der Komparse nicht zur Kleidung passt, wird er eben wieder ausgetauscht - bei schätzungsweise 10.000 Komparsen in Rom ist das Angebot groß genug.  Komparsen - das sind die Menschen im Hintergrund, ohne die kein Kino- oder Fernsehfilm auskommen würde. Kaum jemand nimmt die Nonnen wahr, die in einem Film wie zufällig über den Klosterhof gehen, oder den Landstreicher, der an einer Ecke sitzt, während die Hauptakteure durch die Straßen spazieren. Viele der Komparsen in Rom sind Rentner und verdienen sich zu ihrem mageren Einkommen etwas dazu. So auch Angelo Amoretti und Paola Carboni. Paola muss mit einer monatlichen Rente von 200 Euro auskommen - nahezu unmöglich ohne ihre Komparsen-Jobs. Angelo arbeitete ehemals als Postangestellter, seine Leidenschaft fürs Kino begleitete ihn durchs Leben. Nun, als Rentner, hat er es endlich geschafft, selber in Filmen aufzutreten. Als Mönch, Kleinkrimineller oder auch mal als Leiche. Dass er auf seinen Einsatz oft über Stunden warten muss, und dann womöglich nur für Sekunden im Bild erscheint, stört ihn wenig. Im Gegenteil: Die Stunden am Set, mit laufenden Kameras, hektischen Regisseuren, Stars und befreundeten Komparsen sind die Höhepunkte seines Rentnerdaseins. DE 2009'
- eventId: 784613
  start: 2026-10-31T12:10:00Z
  stop: 2026-10-31T13:02:00Z
  title: Planet Weltweit - Das Kinderparlament von Rajasthan
  subtitle: Planet Weltweit - Das Kinderparlament von Rajasthan
  description: 'Tagsüber hütet die 13jährige Neraj Jath Ziegen in der dürren Felslandschaft am Rand der Wüste Thar, abends besucht sie die Abendschule ihres Dorfes. In ihrer knappen Freizeit ist sie Ministerin für Ackerbau und Viehzucht im Parlament der Kinder von Rajasthan. Wir zeigen das Leben einer ungewöhnlichen Parlamentarierin zwischen Ziegenstall und Politikbetrieb. Der Bundesstaat Rajasthan im Nordwesten Indiens gehört zu den unwirtlichsten Regionen des Landes, die Menschen gelten als rückständig und arm. Und doch hat sich hier ein Projekt entwickelt, das in ganz Indien einmalig ist: Damit die Kinder die Bedeutung von Demokratie und Rechtsstaatlichkeit erlernen, wurde das Parlament der Kinder gegründet. Die Idee entstand in den Abendschulen, die in den 1970er Jahren auf Initiative der nichtstaatlichen Organisation "Barefoot-College" mit Unterstützung der UNESCO eröffnet wurden. Heute, nach über 25 Jahren, gibt rund 150 Abendschulen mit über 3.000 Schülern. Eine davon ist die 13jährige Neraj Jath. In ihrem Amt kümmert sie sich um die Ausstattung der Schulen und die Wasserversorgung in den Dörfern. Gleichwohl muss Neraj zuhause alltägliche Pflichten erledigen. Als Ministerin überwacht sie die Abendschulen, prüft, ob die Lehrer zuverlässig unterrichten, kümmert sich um defekte Schullampen und Wasserpumpen. Das derzeitige Hauptproblem der Menschen der Region und damit auch von Ministerin Neraj ist die langanhaltende Dürre, die dazu geführt hat, dass die letzten Wasserreserven nicht gleichberechtigt verteilt werden. So hat Neraj den Einfall, das Puppentheater für ihre Ziele einzusetzen. Die Puppenspieler sollen Szenen aufführen, die zeigen, wie kostbares Wasser gespart werden könnte. Davor jedoch muss sie den Ältestenrat des Dorfes überzeugen. Eine Herausforderung, denn in der traditionsverhafteten Gesellschaft Rajasthan zählt das Wort einer Frau wenig. Wird es da ein dreizehnjähriges Hirtenmädchen schaffen, die alten Männer für ihre Idee zu gewinnen?  DE 2004'
- eventId: 784626
  start: 2026-10-31T13:15:00Z
  stop: 2026-10-31T14:07:00Z
  title: Planet Weltweit - Nepal - Die Krieger vom Dach der Welt
  subtitle: Planet Weltweit - Nepal - Die Krieger vom Dach der Welt
  description: 'Das Himalaja-Massiv von Nepal ist die Heimat der wohl gefürchtetsten Krieger der Welt: der Gurkhas. Ihr hartes Leben auf dem Dach der Welt macht sie zu zähen und mutigen Persönlichkeiten. Seit Generationen stehen sie im Dienst der britischen Armee. Für die heranwachsende Jugend aus den abgelegenen Bergdörfern ist ein Leben als Soldat auch heute noch ein heiß begehrtes Lebensziel. Der Sold auf europäischem Niveau ermöglicht es den Gurkhas, ihre Familien finanziell zu unterstützen und damit auch deren Ansehen zu erhöhen. Die Reportage begleitet einen so genannten Galla Wallah - einen Gurkha-Scout - auf seiner Suche nach neuen Gurkha-Kämpfern. Der pensionierte Ex-Gurkha ist mit der Auswahl der aussichtsreichsten Bewerber betraut. Sein Weg führt ihn in entlegene Bergdörfer, quer durch die atemberaubende Landschaft des Himalajas.  Der junge Santosh aus dem Bergdorf Tangting hat einen Traum: Er möchte als Gurkha in den Militärdienst der britischen Armee aufgenommen werden. Ein solcher Posten ist für die in Armut lebenden Nepalis in den entlegenen Provinzen wie ein Lottogewinn: Ca. 1.500 Euro Monatssold bedeuten hier ein sorgenfreies Leben für die ganze Familie. Außerdem huldigen Gurkhas mit ihrem Dienst an der Waffe auch ihren Ahnen. Die Krieger aus dem Himalaja sind gefürchtete Gegner und werden schon seit Generationen von der englischen Krone rekrutiert. Gurkhas in britischen Uniformen gewannen unter schweren Verlusten entscheidende Schlachten in beiden Weltkriegen und sind auch weiterhin für die Briten weltweit in vorderster Front im Einsatz. Um selbst Gurkha zu werden, muss Santosh mehrere Auswahlstufen durchlaufen. Die erste wird von einem Galla Wallah veranstaltet - einem Gurkha-Scout. In einem benachbarten Bergdorf müssen die Bewerber unter seinen Augen optimale körperliche Leistungen und beste Gesundheit vorweisen können. Nur dann geht es zur nächst höheren Auswahlstufe: nach Pokarah in das Camp der britischen Armee. DE 2008'
- eventId: 784627
  start: 2026-10-31T14:15:00Z
  stop: 2026-10-31T15:07:00Z
  title: Planet Weltweit - Johannesburg - Eine Stadt macht dicht
  subtitle: Planet Weltweit - Johannesburg - Eine Stadt macht dicht
  description: 'Wer es sich leisten kann, zieht sich hinter Mauern und Elektrozäune zurück: In Johannesburg hat die Angst vor Kriminalität in den letzten Jahren bizarre Formen angenommen und ein neues Stadtbild entstehen lassen - abgeschottete Hochsicherheitsburgen vornehmlich weißer Afrikaner existieren neben den Townships der Armen. "360° - Die GEO-Reportage" begleitet in der geteilten Stadt zwei Bewohner, die täglich von einer Seite auf die andere wechseln. Lil de Freitas lebt mit seiner Familie in Sandton, dem reichsten Stadtteil Johannesburgs. Seine Kinder haben das Grundstück noch nie allein verlassen, denn jeder Schritt nach draußen ist gefährlich. De Freitas Frau legt fast 400 km pro Woche mit dem Auto zurück, nur um die Kinder zur Schule zu fahren oder zum Spiel mit den Nachbarskindern. Lil de Freitas ist der einzige in der Familie, der regelmäßig die behütete Welt Sandtons verlässt. Er ist Manager eines Gemüsemarktes am Rande des ausschließlich von Schwarzen bewohnten Townships Alexandra. Jeden Morgen erreicht er sein Geschäft durch den bewachten Hintereingang. Seine Kundin Christinah Nkwe geht jeden Morgen den umgekehrten Weg: Die allein erziehende Mutter von sechs Kindern arbeitet - wie viele ihrer Nachbarinnen - als Putzfrau in den Villen der reichen Einwohner Sandtons. Sie ist eine von ca. 850.000 Bewohnern Alexandras, des ältesten Townships Johannesburgs. Auch hier herrscht Angst vor der allgegenwärtigen Kriminalität. Deshalb hat sich Christinah Nkwe jetzt einer Bürgerwehr angeschlossen, die versucht, das Chaos zwischen den Wellblechhütten zu bekämpfen. Christinah Nkwe weiß: "Solange Alexandra Hunger hat, kann Sandton nicht ruhig schlafen." Nur eine Schnellstraße trennt die beiden Stadtteile. Die Brücke, die über sie hinweg führt, überquert nur, wer es unbedingt muss - wie Lil de Freitas und Christinah Nkwe. DE 2004'
- eventId: 784628
  start: 2026-10-31T15:15:00Z
  stop: 2026-10-31T16:07:00Z
  title: Planet Weltweit - Russlands Zirkusschule auf Tour
  subtitle: Planet Weltweit - Russlands Zirkusschule auf Tour
  description: 'Am sonst so stillen Ufer des Seligersees zwischen Moskau und Sankt Petersburg ist einiges los. Hier bringen die jungen Studenten der Moskauer Zirkusschule Trubel in das Leben der Dorfbewohner. Laut schallt die Musik, während Jelena im weißen Tüllrock auf acht übereinanderliegenden Rollen schwankt. Groß ist auch das Staunen bei der Vorführung der biegsamen Schlangenfrau Alessa, die keine Knochen zu haben scheint, oder wenn Pawel seine zehn Jongleur-Ringe durch die Luft wirbelt. "Ich glaube, wenn wir dem Publikum mit offenem Herzen begegnen, werden sie uns auch so empfangen", sagt Jelena. Trainer Igor Teplov lacht zufrieden. Er will den Jugendlichen zeigen, was den Kern des Artistenlebens ausmacht: Trainieren und Auftreten, ob bei Sonne oder Wind, auf der Wiese oder auf einem Boot. Diese Reportage begleitet die junge Artistentruppe auf ihrer Sommerreise. DE 2013'
- eventId: 784629
  start: 2026-10-31T16:15:00Z
  stop: 2026-10-31T17:06:00Z
  title: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  subtitle: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  description: Im Städtchen Torre Annunziata, kurz vor den Toren von Neapel, betreibt Lucio Zurlo seit über 50 Jahren ein erfolgreiches Boxstudio. Der 77-jährige ist in der Boxszene eine Legende. Etliche Meistertitel konnten seine Zöglinge einfahren, nationale wie internationale. Und doch hat Zurlos Studio seinen privaten Charme nie verloren. Für viele Boxsportler ist es das zweite Wohnzimmer. Profis und Laien gehen hier ein und aus. So manchen gar hat Zurlos Zuwendung aus dem kriminellen Milieu gerettet. Lucio Zurlos Studio namens "Boxe Vesuviana" liegt im Stadtviertel "Provolera", was in neapolitanischen Dialekt so viel bedeutet wie "Pulverfass". Es ist eine Anspielung auf den Vulkan gleich nebenan, auch darauf dass sich hier einst eine Militärstation befand - der Name könnte aber auch die soziale Sprengkraft des armen Viertels bezeichnen. Der Boxsport hat hier eine riesige Anhängerschaft. Es ist schlicht für viele der Weg heraus aus Tristesse, Straßengewalt und sinnlosem Dasein. Zurlo engagiert sich daher nicht nur für Sport und Titelkämpfe. Er ist vor allem ein sozialer Anlaufpunkt. Diese Dokumentation taucht ein in die Welt des neapolitanischen Box-Zirkus. Im Boxstudio trainieren Sportler unterschiedlichen Alters. Von Anfängern bis hin zu Profis, so wie zum Beispiel Salvatore Annunziata. Nach einem Jahr Pause bereitet sich der 30-jährige auf einen wichtigen Kampf vor, der ihm die Möglichkeit geben könnte, um den nationalen Titel zu boxen. Salvatore besucht Lucios Boxtraining schon seit dem 12. Lebensjahr. Einst war er ein eher schüchternes Kind. Doch mit den Jahren ist aus Salvatore ein professioneller Boxer geworden, der auch schon den Welttitel IBF sowie den Mittelmeer-Boxtitel gewonnen hat. Und doch reicht sein Verdienst aus dem Sport nicht aus, um damit seine Familie zu ernähren. So arbeitet er zusätzlich vier Tage pro Woche auf dem Markt von Ischia als Verkäufer von Bekleidung. Sobald er Feierabend hat, trainiert er auch dort, am Strand unter freiem Himmel. DE 2014
- eventId: 784634
  start: 2026-10-31T17:15:00Z
  stop: 2026-10-31T18:07:00Z
  title: Planet Weltweit - Venezuela - Die alte Frau und das Meer
  subtitle: Planet Weltweit - Venezuela - Die alte Frau und das Meer
  description: 'In El Morro, an der Nordostküste Venezuelas, leben die Menschen seit Jahrtausenden von der Sardinenfischerei. "Wenn es keinen Fisch gibt, sind wir erledigt, es gibt kaum andere Arbeit", sagt die 78-jährige Luisa Vargas. Sieben Kinder hat sie mit Sardinen großgezogen, und auch die Familien ihrer 52 Enkel leben vom Meer. Doch in den letzten Jahren haben die Erträge massiv abgenommen, die Überlebensbedingungen sind härter geworden. Seit acht Monaten werden die Sardinen in El Morro sogar komplett vermisst - mit jedem Tag ohne großen Fang spitzt sich die Lage zu. Die Reportage begleitet Luisa Vargas und ihre Familie bei ihrem täglichen Ringen mit der Natur.  Wenn es Sardinen gibt, arbeitet Luisa Vargas trotz ihrer 78 Jahre Tag und Nacht ohne Pause: Sie hilft beim Ausladen der Boote, Ausnehmen der Sardinen oder dem Weitertransport in die Fabrik von El Morro. Doch im Moment kann sie nur, ab und zu beim Tragen einer Kiste Fisch anpacken. Lediglich kleine Haie, Makrelen oder Anchovis gehen den Fischern bei ihren Fangzügen vor der venezolanischen Küste ins Netz. Doch die bringen auf den lokalen Märkten nur das Nötigste zum Überleben ein - im Gegensatz zu den Sardinen, die für den Export bestimmt sind. Solange keine Sardinen in der Nähe von El Morro auftauchen, müssen die Männer des Dorfes weit hinaus aufs Meer ziehen - teilweise sogar in die Nachbarländer Surinam oder Guyana. Wochenlang sind sie dann von ihren Familien getrennt. Und leben immer mit der Gefahr verhaftet zu werden, weil sie illegal in fremden Hoheitsgewässern fischen. Während der Abwesenheit ihrer Männer versuchen die Frauen, ein wenig Geld zu verdienen: Luisas Enkelin Naile vermietet ihre Waschmaschine an die Nachbarinnen, zusammen mit zwei ihrer Schwestern teilt sie sich einen Job in einer Suppenküche. Naile sieht immer weniger Zukunft in der Sardinenfischerei, und auch ihre Kinder wollen lieber Ärzte, Lehrer oder Anwälte werden, statt sich auf die Launen der Natur zu verlassen. DE 2007'
- eventId: 784638
  start: 2026-10-31T18:15:00Z
  stop: 2026-10-31T19:07:00Z
  title: Planet Weltweit - Bolivien - Der Kampf um die kleinen Herzen
  subtitle: Planet Weltweit - Bolivien - Der Kampf um die kleinen Herzen
  description: |-
    In Bolivien kommen jährlich rund 5000 Kinder mit einem Herzfehler zur Welt. Doch Aberglaube und ein problematisches Gesundheitssystem verhindern fast immer die eigentlich guten Heilungschancen. Dr. Alexandra Heath Freudenthals engagierter Einsatz für eine moderne Kinderkardiologie ist eine anhaltende Herausforderung zwischen Euphorie und Enttäuschung.
     DE 2017
- eventId: 784639
  start: 2026-10-31T19:15:00Z
  stop: 2026-10-31T20:07:00Z
  title: Planet Weltweit - Vietnam - Brücken bauen für bedrohte Affen
  subtitle: Planet Weltweit - Vietnam - Brücken bauen für bedrohte Affen
  description: "Die \"Rotschenkligen Kleideraffen\" gelten als die schönsten Primaten der Welt. Doch Wilderei und illegaler Tierhandel haben fast zu ihrer Ausrottung geführt. Nur wenige Tiere konnten in Vietnam überleben. Engagierte Tierschutz-Aktivisten versuchen nun zu retten, was noch zu retten ist. Vor allem Kletterbrücken, die ein Wechseln in etwas entferntere Waldparzellen gefahrlos ermöglichen, benötigen die wilden Kleideraffen im Dschungel, um ungestört ihre Nahrungsgebiete aufsuchen zu können. \n DE 2023"
- eventId: 784640
  start: 2026-10-31T20:15:00Z
  stop: 2026-10-31T21:07:00Z
  title: Planet Weltweit - Piemont - Mit Mulis über Stock und Stein
  subtitle: Planet Weltweit - Piemont - Mit Mulis über Stock und Stein
  description: Es gibt ihn noch, den Beruf des Säumers - Menschen, die Lasten auf dem Rücken von Saumtieren durchs Gebirge transportieren. Jahrhundertelang beförderten sie Waren über schwer zugängliche Alpenpässe. In den Seealpen, im italienischen Piemont, liegt auf 2.300 Metern die Schutzhütte Morelli Buzzi. Drei Monate im Jahr muss der Betreiber der Hütte Wanderern Kost und Logis anbieten. Doch Wege und Straßen hier hoch gibt es keine, und den Helikopter kann sich der Hüttenwirt nur einmal in der Saison leisten. Da kommen Luciano Ellena und seine Mulis ins Spiel. Er ist der letzte Säumer im Piemont und versorgt die Hütte in den kommenden drei Monaten mit Lebensmitteln. DE 2023
- eventId: 784641
  start: 2026-10-31T21:15:00Z
  stop: 2026-10-31T22:07:00Z
  title: Planet Weltweit - Istanbul, Stadt der Katzen
  subtitle: Planet Weltweit - Istanbul, Stadt der Katzen
  description: '15 Millionen Einwohnern hat Istanbul, die größte Stadt der Türkei. Durch den Bosporus in zwei Hälften geteilt, steht Istanbul mit einem Bein auf dem europäischen Kontinent und mit dem anderen in Asien. Und noch etwas macht die Stadt so besonders: Die geschätzt mehrere Hunderttausend Katzen, die hier streunend leben. Man sieht sie vor den Wahrzeichen der Stadt herumstolzieren, am Ufer des Bosporus entlangschlendern oder friedlich auf den Tischen und Stühlen der Cafés sitzen. Dass die meisten Katzen gesund und satt erscheinen, ist jedoch vor allem den Einwohnern zu verdanken, die sich um sie kümmern. Eine alte Tradition, die auf das Osmanische Reich zurückgeht. DE 2023'
