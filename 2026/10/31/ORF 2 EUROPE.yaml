  title: Bürgeranwalt
  genre:
  - '130'
  description: "- Versorgungsnotstand bei Kindern mit Autismus: Tobias P. ist vier Jahre alt und leidet an frühkindlichem Autismus. Seine Eltern kämpfen um einen entsprechenden kassenfinanzierten Therapieplatz - bislang jedoch ohne Erfolg. Das Angebot ist gering, die Wartelisten viel zu lange oder erst gar nicht vorhanden, in bestehenden Einrichtungen wird ob der enormen Nachfrage sogar triagiert.\nNachgefragt: Keine Mindestsicherung. Frau N. ist nach langer Krankheit arbeitslos geworden. Seither bezieht sie Arbeitslosengeld und die Mindestsicherung. Ende letzten Jahres hat sie dann kurz eine Nebenbeschäftigung ausgeübt und das auch dem Sozialamt - der MA 40 - bekanntgegeben. Danach musste sie fast vier Monate warten, bis sie die monatlichen 480 Euro erhalten hat. \n- Vernachlässigt verstorben - Haben die Behörden die Situation falsch eingeschätzt? Im März 2026 ist Barbara P. im Alter von 69 Jahren verstorben. Die pensionierte Krankenschwester war körperlich und psychisch krank und hatte in den letzten Lebensjahren verwahrlost und zurückgezogen gelebt. Obwohl ein Gerichtsverfahren zur Bestellung eines Erwachsenenvertreters anhängig und der kritische Gesundheitszustand bekannt war, hätten die Behörden zu lange weggeschaut, kritisieren die Angehörigen."
