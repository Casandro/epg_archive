  title: 'Recht konkret: Vorsorge & Erben'
  description: Was passiert rechtlich, wenn ein Mensch stirbt - und was kann man bereits zu Lebzeiten regeln? Moderatorin Larissa Rausch zeigt, worauf es bei Testament und Verlassenschaft ankommt und welche Entscheidungen Angehörige nach einem Todesfall treffen müssen. Außerdem geht es darum, wie man mit einer Patientenverfügung oder Vorsorgevollmacht für den Ernstfall vorsorgen kann. Die wichtigsten rechtlichen Fragen rund um Vorsorge, Tod und Erben kompakt zusammengefasst.
