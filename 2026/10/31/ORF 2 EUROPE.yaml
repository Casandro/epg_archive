  title: Land und Leute
  description: |-
    Forschen zu Wassermangel in Landwirtschaft

    Lösungsstrategien für die Landwirtschaft in Dürrezeiten werden in der Höheren Bundeslehr- und Forschungsanstalt Raumberg-Gumpenstein in der Steiermark entwickelt, zeigt die "Land und Leute"-Reportage. Gerade in der Grünlandwirtschaft drohen durch Hitze- und Dürreperioden massive Einkommensverluste. Das "Land und Leute"-Team hat sich dazu das Forschungsprojekt "DryGrass" angeschaut. Mithilfe von ausfahrbaren Regendächern und Infrarotstrahlern werden auf speziellen Kleinparzellen extreme Wetterszenarien der Zukunft simuliert. Die Forscher untersuchen nicht nur das Pflanzenwachstum, sondern erfassen auch die Futterqualität im Grünland, die Artenzusammensetzung sowie das Bodenleben. Ziel dieser Forschungsarbeit ist die Entwicklung konkreter Bewirtschaftungsstrategien, um Wiesen und Weiden langfristig widerstandsfähiger zu machen. Dazu setzt man auch auf die Anpassung der Saatgut-Mischungen mit Tiefwurzlern.

    Weitere Themen von "Land und Leute" am 31. Oktober:

    Wahl zum "Land und Leute Favoriten 2026"
    Junger Müller mit Courage
    Gedenken im Beinhaus
