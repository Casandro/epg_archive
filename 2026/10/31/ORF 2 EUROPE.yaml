  subtitle: Bei Familie Habsburg-Lothringen in der Kaiservilla Bad Ischl
  description: In dieser Ausgabe von Johann-Philipps Schlossbesuchen geht es in die Kaiservilla von Bad Ischl, die nicht nur eine Touristenattraktion ist, sondern auch die Wohnstätte der Familie Habsburg-Lothringen. Wie ticken die Nachfahren des Kaisers und welche unbekannten Seiten der historischen Villa werden sie Johann-Philipp präsentieren? Der wissbegierige Gast erfährt viele Geschichten rund um den Sommersitz von Franz Joseph und Sisi, nächtigt in einem ganz besonderen Bett und schaut sich auch die Umgebung der Kaiservilla ganz genau an.
