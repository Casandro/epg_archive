  title: Immanuel - Jesus folgen
  subtitle: Gaben entdecken
  description: |-
    Viele Menschen fragen sich, welche Begabungen in ihnen stecken und welchen Unterschied sie im Leben anderer machen können.
    Die Bibel beschreibt geistliche Gaben als Geschenk Gottes an jeden Menschen. Diese Folge zeigt, wie der Heilige Geist Menschen begleitet und befähigt, sich zum Wohl anderer einzusetzen. So entsteht eine Gemeinschaft, in der jeder Einzelne einen wertvollen Beitrag leisten kann.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

