  title: Immanuel - Jesus folgen
  subtitle: Gaben entdecken
  description: |-
    Viele Menschen fragen sich, welche Begabungen in ihnen stecken und welchen Unterschied sie im Leben anderer machen können.
    Die Bibel beschreibt geistliche Gaben als Geschenk Gottes an jeden Menschen. Diese Folge zeigt, wie der Heilige Geist Menschen begleitet und befähigt, sich zum Wohl anderer einzusetzen. So entsteht eine Gemeinschaft, in der jeder Einzelne einen wertvollen Beitrag leisten kann.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 639895
  start: 2026-10-31T00:20:00Z
  stop: 2026-10-31T00:50:00Z
  title: auserlesen
  subtitle: 'Erna Hüls: Was dich wirklich stark macht'
  description: |-
    "Das schaffst du nicht." Solche inneren Stimmen kennt fast jeder. Erna Hüls erlebt seit vielen Jahren, wie Zweifel, Sorgen und alte Denkmuster Menschen ausbremsen und was ihnen hilft, sich davon zu lösen. Die Diplom Sozialpädagogin arbeitet seit 1999 als Coach, wurde mit dem European Speaker Award ausgezeichnet und ist Autorin von "Ein Coach für alle Fälle". In dieser Sendung spricht sie darüber, was Menschen wirklich stark macht, wie Selbstzweifel überwunden werden und wie jeder seine ganz persönliche Bestimmung finden kann.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 643500
  start: 2026-10-31T00:50:00Z
  stop: 2026-10-31T01:05:00Z
  title: Sabbat - Das Gebot der Freiheit
  subtitle: Freiheit in drei Variationen
  description: |-
    Die Bibel kennt den Sabbat nicht nur als wöchentlichen Ruhetag. Auch das Sabbatjahr und das Jubeljahr folgen demselben Rhythmus. Paulin Giurgi zeigt, wie diese drei Ordnungen Menschen, Tiere, Land und Gesellschaft vor dauerhafter Ausbeutung und Abhängigkeit schützen sollten. Zusammen entfalten sie Gottes weitreichende Idee von Freiheit, Gerechtigkeit und Neuanfang - für den Einzelnen und für die ganze Schöpfung.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
