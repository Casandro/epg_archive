  title: Hope Gottesdienst
  subtitle: Christen sind Spinner - und das ist gut - Manuel Füllgrabe
  description: |-
    Ein "Spinner" denkt gegen den Strich: weg von der negativ gefühlten Realität - hin zu einer besseren Zukunft. Jesus zeigt in den Seligpreisungen die doppelte Bedeutung: "Spinnen" wirkt zunächst wie eine unerhörte Idee für Übersehene und Benachteiligte. Doch sie wird zur Wirklichkeit, wenn Menschen die Fäden aufnehmen und aktiv am Reich Gottes mitwirken. Deshalb gilt: Christen sind genau diese Lichtträger - Menschen, die von Hoffnung ausgehen und sie gestalten.

