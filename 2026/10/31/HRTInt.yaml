  title: 'Naši ljudi, njihova mjesta: Buenos Aires'
  subtitle: ' '
  description: Buenos Aires je desetljećima bio prvo odredište tisuća hrvatskih iseljenika koji su stizali u Argentinu. Njih su pratili hrvatski svećenici i redovnice, pomažući im da sačuvaju vjeru, ali i da se snađu u novoj zemlji. Gotovo stoljeće poslije mnogo se toga promijenilo, ali tragove povezanosti s Hrvatskom i dalje je moguće pronaći. Vidljivi su u sačuvanim spomenicima, ali i u živom djelovanju pojedinaca hrvatskog podrijetla unutar Katoličke Crkve. S velečasnim Máximom Jurcinovicem, glasnogovornikom Argentinske biskupske konferencije, ulazimo u njezino sjedište i razgovaramo o papi Franji te izazovima suvremene Crkve. U Dock Sudu upoznajemo sestre Editu i Samuelu te otkrivamo kako je neumorno djelovanje Družbe sestara milosrdnica pridonijelo razvoju ove četvrti.
