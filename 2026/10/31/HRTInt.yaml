  title: Dolina sunca, serija (32/210)
  subtitle: ' '
  description: 'Nakon nespretnog susreta s pripitim Kristijanom, Eva se ponudi odvesti ga kući. Adela poželi vidjeti Nikolu, te mu pošalje poruku. Juran je nervozan što gubi borbu za firmu, a nije se uspio ni dočepati dokumenata iz Vjekine kancelarije. Pritisnut Andrijinom prijetnjom, Robert popušta pri osvajanju Julije. Kristijan se ponudi pokazati Evi kako napreduje njegovo organsko bilje, a ona pokaže neočekivano zanimanje. Potaknuta neobičnom promjenom Robertovog ponašanja, Julija odluči pitati Kronija je li Andrija prijetio Robertu. Nikola pokušava razgovarati s Ružom koja je ljuta što nije uspio probati kolač koji je ispekla. Ona ga uspije nagovoriti da zajedno prođu kroz izračun troškova za adaptaciju pivnice. Julija spomene Nataši kako je neobično to što ju je Robert danima šarmirao, a sada odjednom nema vremena za nju ni sekunde. Ljutita odlazi Andriji i žestoko ga napadne zbog prijetnji Robertu. Doktor Otto pohvali Ivana što pokušava s hodanjem i zamoli ga da bude sudac sutra na turniru. Kristijan sretne Evu i pozove je na turnir. Iako joj nije lagodno zbog činjenice da će tamo biti i Julija, Eva ipak pristane. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId:
  - 663468
  - 765312
  start: 2026-10-31T06:33:00Z
  stop: 2026-10-31T07:46:00Z
  title: Latino u ozračju tambure - TO HRT-a i R.Luque
  subtitle: ' '
  description: 'Zahvaljujući bliskoj suradnji Ricarda Luquea s Tamburaškim orkestrom HRT-a, u studiju HR "Zvonimir Bajsić", 22. studenog 2009., predstavljen je program latino glazbe s posebnim naglaskom na tradicijsku glazbu Venezuele. Uz glazbenika i pjevača Ricarda Luquea, koji je svoj dom u Hrvatskoj našao 1990. godine, poseban gost iz Venezuele bio je Silfredo Perez Roman, koji svira na tradicionalnom instrumentu - cuatru, vrlo sličnom našoj tamburi, te solisti iz Hrvatske: Ivana Kindl, Hrvoje Rupčić, Dani Bošnjak, Mario Igrec i Tomica Rukljić.'
