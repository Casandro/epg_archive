  title: 'GEO Reportage: Indien'
  subtitle: 'Indien: Ein Himmel voller bunter Drachen'
  subtitled: true
  genre:
  - '112'
  description: Einmal im Jahr verwandelt sich die westindische Stadt Ahmadabad in die Hauptstadt der Drachen. Dann nämlich findet das Neujahrsfest statt, an dem der Winter in den Frühling verabschiedet wird. Tausende Papierdrachen steigen in die Luft, begleitet von Feuerwerk und guten Wünschen. Wie die meisten Einwohner fiebert auch der 14-jährige Mojit monatelang auf dieses Fest hin. Einen ganzen Stapel neuer Drachen hat er dafür gekauft, die länger in der Luft bleiben sollen als die der Konkurrenz. Dafür präpariert Mojit sie auf ganz besondere Weise. "GEO Reportage" hat ihn bei seinen Vorbereitungen begleitet.
