  title: Wie klingt der Urknall?
  subtitle: Botschaften vom Anfang des Universums
  subtitled: true
  description: 'Es war eine Sensation: 2015 gelingt es Forschern erstmals, die Existenz von Gravitationswellen nachzuweisen. Ein Meilenstein, für den sie später den Nobelpreis bekamen. Die Dokumentation erzählt die Geschichte dieses Erfolgs. Sie unternimmt nicht nur eine Entdeckungsreise in eines der aktuell spannendsten Forschungsfelder der Astrophysik, sie berichtet auch von der Leidenschaft und dem unermüdlichen Forschergeist der Pioniere auf diesem Gebiet.'
