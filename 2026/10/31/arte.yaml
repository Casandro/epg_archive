  title: 360° Reportage
  subtitle: Die Vogelliebhaber von Louisiana
  subtitled: true
  description: "In Louisiana ist das Leben der Menschen schon immer eng mit der Natur verbunden, besonders mit den Vögeln der Region, was sich unter anderem in der beliebten Kunst des Holzvogelschnitzens zeigt. In den Sümpfen und Wäldern des US-Staates leben über 470 Vogelarten, darunter Pelikane, Kraniche und Reiher. \nIn den letzten Jahren sind viele jedoch verschwunden, was nicht nur ein Verlust für die Menschen, sondern auch für die Ökosysteme darstellt. Umweltschützer bemühen sich daher um eine Rückkehr der Arten. Ihre größte Hoffnung ist das Gebiet Acadiana, das als eines der größten Vogelparadiese der USA gilt."
