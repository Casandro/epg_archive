  description: 'Fitzgerald Kusz hat sein Stück in fränkischer Mundart geschrieben und Fritz Schneider hat das Volksstück ins Schwäbische übertragen. Die Geschichte des Konfirmanden Fritz. Die Eltern haben eingeladen und es kamen: Onkel, Tante, Cousine und Bekannte. Es wird viel gegessen und getrunken, es werden Spiele gespielt und Witze erzählt. Der obligatorische Spaziergang nach dem Essen fehlt auch nicht. Danach braucht man Kaffee und nicht nur einen Schnaps. Die Stimmung ist gehoben. Es wird gelacht und geweint, gescholten und beschuldigt, gefrotzelt und beleidigt, dass es eine Wonne ist.'
