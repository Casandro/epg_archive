  title: Linea Verde Discovery - Made in Italy ne
  subtitle: 'Linea Verde Discovery - Made in Italy nel mondo - RUBRICA - Attraversiamo la Costa d''Avorio, dalla foresta del Banco, straordinario polmone verde sopravvissuto nel cuore di Abidjan, ai villaggi dove nuove '
  description: |-
    tecnologie rendono più sostenibile la cucina quotidiana; dai safari nei parchi nazionali ai grandi progetti di riforestazione; fino alle piantagioni di caucciù, dove un prodotto considerato di scarto diventa una nuova fonte di biocarburante. Il viaggio arriva poi sulla costa di Assinie, dove la bellezza di oceano, laguna e foresta tropicale mostra il potenziale turistico del Paese, ma anche la fragilità dei suoi ecosistemi. Scoprendo che anche in un Paese così lontano c'è molto del nostro Made in Italy. - Conduce Livio Beshir
    Scritto da Federica Petruccioli
    Una produzione TVCOM
    Produttore esecutivo TVCOM Elisa Masiero
    Delegato Rai Milvia Licari
    Regia di Giuseppe Carucci
