  title: Passaggio a Nord-Ovest
  subtitle: 'DOCUMENTARIO - In questa puntata:- Facciamo un insolito viaggio in Spagna e precisamente a Siviglia per scoprire la preziosa arte sartoriale degli abiti da flamenco, simbolo della cultura spagnola;- Raggiungiamo il Deserto '
  description: |
    del Kalahari in Namibia per conoscere i San, meglio conosciuti come Boscimani;- Ammiriamo la recente scoperta della Kore di Vulci, la testa di una fanciulla rinvenuta nel sottosuolo del centro etrusco di Vulci, nel territorio di Montalto di Castro;- Andiamo a Firenze, presso il Palazzo Strozzi dove intraprendiamo un viaggio tra luoghi ed epoche diverse attraverso la mostra "BROKEN Il potere del frammento". - Un programma di Alberto Angela
