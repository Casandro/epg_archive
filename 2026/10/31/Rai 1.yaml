  title: Linea verde Start - Mantova
  subtitle: RUBRICA - Per conoscere e raccontare l'Italia nella sua essenza, occorre seguire due percorsi che si affiancano. Da un lato, le immagini di una natura potente, tra paesaggi e scenari fiabeschi, espressione di una belle
  description: "zza e di una biodiversità uniche e irripetibili. Dall'altro, la sapienza degli artigiani, nelle cui botteghe si custodisce il genio italiano: uno dei tratti identitari più profondi e radicati del Paese. Qui il passato nutre il presente e guarda al futuro; mani, mente e cuore trovano la loro sintesi in un mondo antico e moderno al tempo stesso, che attende di essere raccontato e valorizzato. - Un programma di Gian Marco Mori\nCondotto da Federico Quaranta \nScritto con Fabiana Ruggiero e Marco Ghighi\nUna produzione Raccontami \nProduttore esecutivo Raccontami Jolanda De Palma\nDelegato RAI Milvia Licari\nRegia di Gian Marco Mori\n"
- eventId: 672929
  start: 2026-10-31T11:30:00Z
  stop: 2026-10-31T12:30:00Z
  title: Linea Verde Italia - Firenze
  subtitle: RUBRICA - Approdiamo a Firenze per raccontare una città da osservare con occhi nuovi. Anche una delle capitali del turismo internazionale sa sorprendere con luoghi inattesi, storie da riscoprire e bellezze capaci di r
  description: "egalare emozioni sempre diverse. Andiamo alla scoperta di angoli nascosti e poco conosciuti, attraverso le testimonianze di chi ogni giorno si impegna a custodire e valorizzare lo straordinario patrimonio della città. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Andrea Pasquini, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore esecutivo Daniela Rainaldi\nRegia di Giuseppe Govino\n"
