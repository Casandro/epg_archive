  title: WDR 3 Konzert
  subtitle: Federleicht ins Glück!
  description: "Kaum ein Jahrzehnt hat so viel an aufregender Unterhaltungsmusik hervorgebracht, wie die Zwanziger Jahre. Aus den USA bahnten sich verlockende, unbekannte Klänge den Weg nach Europa: Der Jazz elektrisierte das Publikum in den zahllosen Cabarets und Clubs der \"Roaring Twenties\", die in den Großstädten wie Pilze aus dem Boden schossen. Aber auch die Komponisten der Konzertsäle und Operettenbühnen machten sich ihren Reim auf die transatlantischen Impulse, die ein ganz neues Musikgefühl mit sich brachten. Die Schlager und Modetänze dieser Zeit waren natürlich auch in Deutschland angesagt, und was andernorts \"swingte\", wurde hierzulande eben zum \"schwingen\" gebracht. Das WDR Funkhausorchester schwelgt einen Abend lang in den federleichten Melodien einer glamourösen Ära und setzt einen weiteren Akzent im großen Schwerpunkt von WDR 3: \"Einfach glücklich!\" \n<strong>Mit Musik von Kurt Weill, Paul Abraham, Eduard Künneke und anderen</strong>\n<strong>WDR Funkhausorchester</strong><br/>Leitung: <strong>Patrick Lange</strong>\nAufnahme vom 10. Januar 2025 aus dem Funkhaus Wallrafplatz, Köln \nModeration: Daniel Finkernagel <br/>Redaktion: Michael Breugst"
