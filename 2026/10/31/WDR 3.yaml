  title: 'ARD Jazz: Live vom Jazzfest Berlin 2026'
  description: "WDR 3 sendet ausgewählte Konzertaufnahmen und bietet Einblicke in eines der renommiertesten Jazzfestivals. In einer vierstündigen Live-Übertragung präsentiert Nabil Atassi Musik u,a, von der Cellistin Tomeka Reid und ihrem aktuellen Quartett, vom Chicago Underground Duo und von der Trompeterin Laura Jurd. Eine Sendung voller spannender Entdeckungen aus einer der kreativsten Jazzmetropolen Europas. \nModeration: Nabil Atassi<br/>Redaktion: Jörg Heyd"
