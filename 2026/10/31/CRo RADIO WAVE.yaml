  title: Pot
  description: Jaká antikoncepce je nejlepší? S gynekoložkou Viktorií Reklovou o trendech, mýtech i diagnózách z TikToku. Lékařka Viktoria Reklová se věnuje gynekologii, porodnictví i reprodukčnímu zdraví. Moderátorská dvojka hotcastu Pot Eliška Soukupová a Karel Vladyka si ji pozvali, aby probrali antikoncepční trendy i mýty, samozvané doktory z TikToku i to, jak vytvořit bezpečné prostředí v ordinaci. A taky otázku, kolik "prášků po" už je moc. (repríza)
