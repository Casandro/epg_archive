  description: Stimmt es, dass ...?, der neue History-Podcast von ARTE und Radio Bremen, hinterfragt in zwölf Folgen bekannte Erzählungen der Geschichte und räumt mit Irrtümern auf. In jeder Episode nimmt sich Host Sophia Wetzke ein historisches Thema vor. Ausgehend von einer scheinbar simplen Frage entführt der History-Podcast seine Hörerinnen und Hörer an fremde Orte und in vergangene Zeiten, über die sie so sonst wohl nie nachgedacht hätten.
