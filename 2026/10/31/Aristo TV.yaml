  title: Entdecke die Welt - Klagenfurt
  description: Klagenfurt ist mit rund 100.000 Einwohnern eine der kleineren Landeshauptstädte Österreichs, aber dank ihrer direkten Lage am Wörthersee gewiss die reizvollste in der Alpenrepublik. Diese Mischung aus Berg und See, sowie die Nähe zu Italien und Slowenien verleihen der Stadt fast schon ein mediterranes Flair. Dieses Lebensgefühl überträgt sich gleichermaßen auf Bewohner wie Gäste. Flaniert man durch die Straßen Klagenfurts überkommt einen das Gefühl "Willkommen im Urlaub". Im Sommer findet das Leben fast ausnahmslos im Freien statt, am liebsten auf und um den berühmten Wörthersee.
  widescreen: true
- eventId: 673584
  start: 2026-10-31T13:14:27Z
  stop: 2026-10-31T13:59:11Z
  title: So schmeckt die Welt - Livigno
  description: Livigno in der Lombardei gelegen pflegt einen ganz besonderen Status. Nun das ist zum Einen auf der geographischen Lage, aber auch auf den Einflüßen unterschiedlichster Kulturen begründet. Schweizer Tugenden ziehen sich hier ebenso durch die Geschichte wie Rätoromanische und natürlich auch Italienische. Diese Wurzeln spiegeln sich nicht nur in der Sprache, sondern auch in der Architektur, Kulinarik und Traditionen wider. Und das weiß keiner besser als das örtliche UrgsteinEpiBormolini. Der Historiker und Bergführer kennt praktisch jeden Stein in seiner Heimat und erzählt dem Gast in seiner unverwechselbaren Art die Geschichte Livignos.
  widescreen: true
- eventId: 673585
