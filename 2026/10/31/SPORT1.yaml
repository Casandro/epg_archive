  title: Hamburger Autoperlen
  subtitle: Hamburger Autoperlen
  description: 'Bentley, Ferrari, Lamborghini, Porsche - In der neuen Auto-Dokusoap auf SPORT1 dreht sich alles um die pfeilschnellen Sportwagen des Hamburger Luxusautohändler Hamid Mossadegh. Nur namhafte und PS-starke Schlitten stehen bei Mossadegh im Showroom. Zu seinen prominenten Kunden gehören unter anderem die Fußballstars Mesut Özil und Jerome Boateng. In "Hamburger Autoperlen" wird Hamid Mossadegh beim Kauf und Verkauf von neuen Luxuskarossen begleitet. Bei ausgefallenen Kundenwünschen müssen auch Autos von "außerhalb" eingekauft werden. Ein Fall für den Hamburger Autoexperten Karsten Peters, der die Garagen, Hinterhöfe und Scheunen von Privatbesitzern nach potentiellen Auto-Schätzen durchforstet.  Ein "Pampers-Flitzer" für Diekmeier: Hamid muss in der zweiten Folge gleich zwei große Herausforderungen stemmen. HSV-Abwehrprofi Dennis Diekmeier braucht einen neuen Sportwagen mit viel Schmackes unter der Haube, mit dem er seinen Sohnemann in Zukunft zur Kita bringen kann. Außerdem wünscht sich ein 18-jähriger Schüler eine pfeilschnelle Corvette. Viel Arbeit und deshalb ist auch wieder Karsten "Kasi" Peters im Einsatz. Der Hamburger mit Wurzeln in Ostfriesland legt sich mächtig für den Kunden ins Zeug, während sich Hamid um die Fußballelite der Hansestadt kümmert.'
  widescreen: true
- eventId:
