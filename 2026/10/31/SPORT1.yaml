  - 781713
  start: 2026-10-31T01:00:00Z
  stop: 2026-10-31T01:55:00Z
  title: Hamburger Autoperlen
  subtitle: Hamburger Autoperlen
  description: 'Die Autoperlen gehen in die vierte Runde und dieses Mal bekommen Autohändler Hamid und sein Kollege Karsten "Kasi" Peters hohen Besuch. Eine amerikanische Filmproduktionsfirma will passend zum neuen "Fast and Furious 7" ein Auto, das als Deutschland-Promo genutzt werden kann. Später soll es dann verlost werden. Hamid und Kasi machen sich auf die Suche nach einem passenden Geschoss. Wird es eher ein Dodge Challenger oder eine Chevy Chevelle? Und damit nicht genug: Der Wagen muss nicht nur gekauft, sondern auch im "Fast and Furious"-Stil gepimpt werden. Zwischendurch muss sich Hamid auch noch mit einem Stammkunden treffen. Es handelt sich dabei um keinen geringeren als Dennis Aogo vom FC Schalke 04.'
  widescreen: true
