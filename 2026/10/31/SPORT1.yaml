  title: Die PS Profis - Mehr Power aus dem Pott Ein Camper für die Seglerin, Kurzversion
  subtitle: Die PS Profis - Mehr Power aus dem Pott Ein Camper für die Seglerin, Kurzversion
  description: '"PS Profis - Mehr Power aus dem Pott" ist eine Gebrauchtwagen-Doku mit den Ruhrpott-Originalen Sidney Hoffmann und Jean Pierre, die im Auftrag von SPORT1-Zuschauern ab sofort wieder gemeinsam auf Autosuche gehen. In jeder Sendung erhalten Sid & JP den Auftrag, einen passenden Gebrauchten für einen Zuschauer zu finden. Dabei geben sie Tipps und Tricks, nennen die spezifischen Schwachstellen einzelner Modelle, verraten die Kniffe der Verkäufer und zeigen, dass man für wenig Geld gute gebrauchte Autos kaufen kann. Ab sofort sind beide PS Profis wieder gemeinsam am Start und machen gute Laune beim Autocheck.'
