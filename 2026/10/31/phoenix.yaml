  description: Sie sollen zaubern und auf Besen fliegen können. Einige von ihnen würden sogar mit dem Teufel im Bunde stehen, so der Aberglaube. Doch wie viel Wahrheit steckt in dem Glauben an Hexen? Uralte Geschichten und archäologische Funde erzählen von geheimnisvollen Frauen und ihren magischen Gaben. Tatsächlich prägt die Angst vor den Hexen die Geschichte. Doch was hat es mit ihrer mysteriösen Macht auf sich?
