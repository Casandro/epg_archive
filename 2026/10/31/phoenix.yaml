  description: 'Filmstar Romy Schneider: Neu entdeckte Privatfilme, Briefe und Tagebücher geben spannende Einblicke in ihr Leben, vor allem in die schwierige Beziehung zu Mutter Magda. Zu Beginn von Romy Schneiders Karriere galt Magda als omnipräsente Helikoptermutter, als "Wachhund", der den Jungstar keine Sekunde aus den Augen ließ. Und nicht nur das: Magda soll rigoros alle anspruchsvollen Rollenangebote für die junge Romy vom Tisch gefegt haben. Die Tochter sollte lieber weiterhin in Schmonzetten spielen, in denen Magda gleich mit gebucht wurde. 1958 zog Romy Schneider Hals über Kopf nach Paris, zu ihrer großen Liebe Alain Delon.'
