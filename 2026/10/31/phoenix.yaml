  description: Die Südinsel Neuseelands ist die rauere, wildere Schwester der Nordinsel, landschaftlich und klimatisch. Hier überwinden die Züge spektakuläre Strecken vom Pazifischen Ozean bis zu den Bergen der Südalpen Neuseelands. In Christchurch löst der TranzAlpine den Coastal Pacific-Train ab. Die Südinsel ist auch Erdbebengebiet. Immer wieder verbiegen Verwerfungen die Schienen. Der Zug durchquert die Südalpen, Gebirge und Gletscherflüsse, bis er die Westküste erreicht.
