  title: Mit dem Zug durch Transsilvanien
  widescreen: true
  hd: true
  description: Das sagenumwobene Transsilvanien, bekannt durch die Romanfigur des blutdürstigen Grafen Dracula, gehört mit seinen eindrucksvollen Bergen, Urwäldern und Schlössern zu den schönsten Flecken ganz Europas. Transsilvanien, inmitten der bis zu 2.000 Meter hohen Gipfel der rumänischen Karpaten, heißt wortwörtlich übersetzt hinter den Bergen. Hier in der rumänischen Bergwelt leben die Menschen traditionell in kleinen Dörfern. Die über 600 Kilometer lange Bahnstrecke von Arad über Sibiu, Sighisoara und Brasov bis nach Bran im Süden Siebenbürgens - wie diese Gegend ebenfalls genannt wird - zieht sich quer durch die rumänischen Karpaten.
