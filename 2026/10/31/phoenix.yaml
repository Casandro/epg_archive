  description: |-
    Monster beflügeln seit jeher die Fantasie der Menschen. Doch wie viel Wahrheit steckt hinter den Mythen? "Terra X" begibt sich auf die Spur von Drachen, Einhörnern und "Ziegensaugern".

    So manches Unwesen lässt sich auf ein naturwissenschaftliches Phänomen zurückführen. Andere sind kulturell bedingt. Doch warum tauchen bestimmte Kreaturen überall auf der Welt auf? Die Angst vor dem Unbekannten ist jedenfalls uralt und universell.

    Von Drachen, Einhörnern und Chupacabras

