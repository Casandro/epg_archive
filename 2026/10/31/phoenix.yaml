  title: Mythos - die größten Rätsel der Geschichte
  subtitle: Das Geheimnis der Werwölfe
  widescreen: true
  hd: true
  description: Werwölfe, Horrorwesen aus Wolf und Mensch. Gibt es sie tatsächlich? Wissenschaftler entdecken, woher der Glaube an diesen Mythos kommt, erforschen neue Werwolf-Begegnungen und eine uralte Mordserie. Gerichtsakten und Zeichnungen aus dem 18. Jahrhundert beschreiben einen Fall, der noch immer unglaublich klingt. Drei Jahre lang zieht ein unbekanntes Wesen mordend durchs ländliche Frankreich. Die Bestie tötet wie ein Tier, verhält sich aber wie ein Mensch. Ein Werwolf?
