  description: 'Lina Baumann hat einen ungewöhnlichen Job: ihre Aufgabe besteht darin zugezogenen Menschen den Start in der neuen Stadt so glücklich und reibungslos wie möglich zu gestalten. Doch an dem schroffen Herzspezialisten Prof. Markus Gärtner droht selbst Lina sich die Zähne auszubeißen. Unglücklicherweise verprellt Markus mit seiner taktlosen Art auch den steinreichen Herrn Hofmeister, wichtigster Sponsor des Herzforschungszentrums. Um den grantig-humorvollen Millionär zu besänftigen, lädt er ihn zu einem luxuriösen Wellnesswochenende ein. Hofmeister besteht jedoch darauf, dass auch Lina mitkommt, die er für Gärtners Lebensgefährtin hält.'
