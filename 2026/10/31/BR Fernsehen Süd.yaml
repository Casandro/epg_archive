  description: 'So etwas ist dem Boandlkramer ja noch nie passiert: Zum ersten Mal, seit tausenden von Jahren, wird er von Amors Pfeil getroffen. Als er die Gefi, die Mutter vom Maxl, erblickt, ist es um ihn geschehen - der Tod hat sich unsterblich verliebt! Der liebestrunkene Boandlkramer lässt sich auf einen mehr oder weniger klugen Deal mit dem Teufel ein und bringt dadurch nicht nur den göttlichen Plan durcheinander - es droht sogar das absolute Chaos! "Der Boandlkramer und die ewige Liebe" vereint zum ersten Mal Deutschlands Top-Entertainer Michael Bully Herbig und Hape Kerkeling auf der großen Leinwand. Ein echtes Kinoereignis.'
