  title: Spezialagenten gegen Hitler
  subtitle: Spezialagenten gegen Hitler
  description: Die Doku "Spezialagenten gegen Hitler" beleuchtet die spannenden Missionen von Geheimagenten, die während des Zweiten Weltkriegs gegen das nationalsozialistische Regime kämpften. Sie zeigt ihre Informationssammlung, Sabotageakte und den Einfluss dieser Geheimoperationen auf den Kriegsverlauf. Historische Aufnahmen und Experteninterviews verdeutlichen die Bedeutung ihrer mutigen Einsätze.
