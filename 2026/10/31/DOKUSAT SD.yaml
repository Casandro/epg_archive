  title: 'Unternehmen Merkur - Die Schlacht um Kreta: Invasion'
  subtitle: 'Unternehmen Merkur - Die Schlacht um Kreta: Invasion'
  description: '"Unternehmen Merkur - Die Schlacht um Kreta: Invasion" beleuchtet die deutsche Luftlandung auf Kreta im Mai 1941, die als erste große Luftinvasion der Geschichte gilt. Sie zeigt die strategische Bedeutung Kretas im Zweiten Weltkrieg und die Planung der Operation unter General Kurt Student. Trotz heftigen Widerstands durch britische, griechische und kretische Kräfte gelang den Deutschen die Eroberung, doch die hohen Verluste warfen Zweifel an der Effektivität solcher Luftlandeoperationen auf.'
  genre:
  - '129'
  widescreen: true
