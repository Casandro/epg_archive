  title: Was blieb von Hitlers Schätzen
  subtitle: Was blieb von Hitlers Schätzen
  description: Mit dem Ende des Zweiten Weltkrieges kam auch der Raubzug der Nationalsozialisten durch Europa zum Erliegen. Schon in den letzten Tagen des Krieges stießen die Alliierten in unterirdischen Verstecken auf Gold, Schmuck und Kunstschätze. Das berühmteste Beispiel ist das seit 1945 verschollene Bernsteinzimmer. 70 Jahre nach Kriegsende erzählt die Reportage die bis heute andauernde Suche nach den letzten Schätzen der Nazis.
