  subtitle: 'Reisen mit Kreta.de - Doku: Das arch. Museum Heraklions'
  description: Das Archäologisches Museum Heraklion zählt zu den wichtigsten Museen Griechenlands. Hier werden einzigartige Funde der minoischen Kultur aus ganz Kreta gezeigt - darunter Fresken, Keramik, Schmuck und der berühmte Diskos von Phaistos. Die Ausstellung gibt einen faszinierenden Einblick in eine über 4.000 Jahre alte Hochkultur.
