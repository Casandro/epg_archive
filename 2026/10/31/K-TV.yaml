  title: 'Spirit: Ganzheitliche Heilung von Körper und Seele'
  subtitle: Gespräch
  description: "Spirit: Ganzheitliche Heilung von Körper und Seele \nPater Hans Buob SAC, Leiter des Exerzitienhauses St. Ulrich in Hochaltingen\n\nKörperliche und seelische Verwundungen prägen das Leben vieler Menschen. Doch was bedeutet Heilung aus christlicher Sicht? Pater Hans Buob zeigt auf, dass Gottes Heil oft tiefer reicht als die bloße Beseitigung von Beschwerden. Er spricht über die Bedeutung von Gebet, Vergebung und der persönlichen Beziehung zu Christus und macht deutlich: Wahre Heilung umfasst den ganzen Menschen - Leib, Seele und Geist."
