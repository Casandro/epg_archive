  title: OMR Podcast - Isabell Werth, Olympic Legend
  description: Sie ist die beste Dressurreiterin der Welt und mit acht Gold-Medaillen Deutschlands erfolgreichste Olympionikin. Doch Isabell Werth ist nicht nur auf dem Dressurplatz aktiv. Rund um den Hof ihrer Eltern hat die studierte Juristin ein riesiges Business aufgebaut, inklusive eines Fonds, um in Pferde zu investieren. Im Podcast erklärt sie, wie man die hohen Preise für Hengste durch den Verkauf von Sperma zurückholen kann, warum die Ausbildung eines Pferdes risikoreich ist und ob sie 2028 bei den Olympischen Spielen in Los Angeles nochmal mitmacht.
