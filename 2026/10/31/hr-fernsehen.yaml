  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Das kleine Mädchen
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Während das Dorf schläft, erwacht eine düstere Energie. Im Schatten der Nacht versammeln sich die Werwölfe zum ersten geheimen Rat. - ihre Stimmen sind verfremdet, ihre Identitäten bleiben verborgen - nur eine ist klar zu hören. Gemeinsam wählen sie ihr erstes Opfer. Doch was die Werwölfe nicht wissen: Ein Dorfbewohner ist das kleine Mädchen, eine Sonderrolle, und besitzt deshalb eine geheime Fähigkeit: Es kann durch den Briefkastenschlitz in seiner Tür das Treffen der Werwölfe beobachten. Weiß das kleine Mädchen etwa, wer die Werwölfe sind?'
- eventId:
