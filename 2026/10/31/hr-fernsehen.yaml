  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Ich bin ein Dorfbewohner
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Tief im Herzen eines geheimnisvollen Waldes beginnt ein außergewöhnliches Experiment: In der Reality-Show "Werwölfe - Das Spiel von List und Täuschung" ziehen 13 Spielende in ein abgelegenes Dorf, doch mitten unter ihnen lauert die Gefahr. Jeder erhält per Zufallsprinzip eine geheime Rolle. Drei der Spielenden werden zu Werwölfen, die sich als harmlose Dorfbewohner tarnen, doch nur ein Ziel haben: die anderen nach und nach zu eliminieren - ohne selbst enttarnt zu werden.'
- eventId:
