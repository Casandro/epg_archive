  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Vertrauenssache
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Ein Dorf im Ausnahmezustand. Die Nacht war düster, die Enthüllung am Morgen überwältigend: Ein Dorfbewohner ist das Kleine Mädchen - eine Sonderrolle, die alles verändern kann. Doch wer ist es? Und was hat es gesehen? Das bleibt vorerst ein Mysterium, nur eines ist klar:
    Die Rolle ist mächtig - und für die Werwölfe lebensbedrohlich.
    Außerdem steht die erste Quest an, eine Mission, bei der Vertrauen über allem steht. Schaffen es die Dorfbewohner, als Gruppe zu funktionieren? Oder gelingt es den Werwölfen, das Spiel zu sabotieren?
