  description: Nach einem Bankraub in der Nachbargemeinde wird der Räuber gefaßt, die Beute bleibt aber verschwunden. Bauer Brakelmann macht sich in aller Frühe auf die Suche im Wald und trifft dort Adsche und die Dorfgemeinschaft. Der Dorffriede ist dahin, denn jeder unterstellt dem anderen, die Beute unterschlagen zu haben.
