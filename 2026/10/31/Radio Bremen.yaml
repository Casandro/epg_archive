  description: 'Julia, Jonas und Niklas studieren in Niedersachsen. Aber bezahlbarer Wohnraum ist begrenzt. Auf ein Zimmer kommen 200 Bewerber, sagt ein Vermieter. Eine Alternative sind komfortable Apartmenthäuser. Die Miete können sich aber nur die wenigsten leisten. Andere wiederum nehmen teil am Wohnprojekt "Wohnen gegen Hilfe". Der Deal: Ein Zimmer gegen Unterstützung im Haushalt. Die Nordreportage begleitet die jungen Leute bei ihrer manchmal verzweifelten Suche.'
