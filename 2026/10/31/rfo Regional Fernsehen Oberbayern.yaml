  description: Beim Gitarrenfestival Saitensprünge in Bad Aibling gastiert am 18. November Star-Gitarrist Eliott Fisk, letzter Segovia-Schüler und Festivalgründer. Er bringt virtuose, innovative Transkriptionen von Bach bis Paganini auf die Konzertgitarre und verspricht Überraschungen. +++ Briada, das Mundart-Pop-Projekt der Brüder Chris und Male Scheitzeneder aus Wasserburg, verbindet bayerische Texte mit großen Melodien, Beats und Humor. Im Duo mit Loopstation spielen sie Jasager und erzählen vom Leben als Geschwister, Musiker und Lehrer. +++ Stefan Weger veröffentlicht am 30. Oktober 2026 seine neue Single Wie es sein soll. Die Deutschpop-Pop-Rock-Ballade mit 60er-Retroklang und starkem Refrain fragt, ob man das eigene Leben lebt oder sich fremdbestimmt fühlt. Es ist seine achte Single.
