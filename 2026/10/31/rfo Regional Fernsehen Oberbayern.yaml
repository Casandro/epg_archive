  title: Plenum TV Magazin
  subtitle: Der Bayerische Landtag debattiert neue Abwasserregeln und präsentiert das Jugendprojekt Deine Minute für Demokratie zur Förderung politischer Beteiligung junger Menschen.
  description: |-
    Im Bayerischen Landtag standen im Oktober verschiedene Themen im Mittelpunkt der politischen Debatten.

    Alexander Hold kehrt nach 13 Jahren mit neuen Folgen seiner Fernsehsendung Richter Alexander Hold zurück. Sat.1 produziert derzeit 50 Episoden und einen Film, die während der sitzungsfreien Zeit gedreht wurden. Hold sieht darin eine Möglichkeit, das Rechtssystem verständlich zu vermitteln.

    Ein weiteres Thema war die Beteiligung der Industrie an der Abwasserreinigung. Der Landtag setzt auf eine ausgewogene Lösung, die Umweltschutz, Versorgungssicherheit und kommunale Interessen berücksichtigt. Dabei soll die Umsetzung rechtssicher und bürokratiearm erfolgen.

    Die Förderung junger Menschen in der Politik wurde durch das Projekt Deine Minute für Demokratie vorangetrieben. 25 Jugendliche konnten im Landtag ihre Anliegen vortragen und forderten unter anderem mehr Empathie und eine neue Diskussionskultur. Die Initiative wird vom Münchner Zentrum für Politikforschung und dem Wertebündnis Bayern unterstützt.

    Diese Schwerpunkte zeigen das Bestreben, Tradition und neue Impulse in der bayerischen Politik zu vereinen und die demokratische Beteiligung zu stärken.
