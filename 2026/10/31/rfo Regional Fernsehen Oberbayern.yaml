  title: Süd Kultur vom 30.10.2026 (Wh.)
  subtitle: Ein Casagrande in Südfrankreich +++ Endless Wellness +++ Die Bayerische Hymne gespielt von der Blaskapelle Rott am Inn
  description: 'Die Retrospektive von Peter Casagrande ist noch bis 8. November in der Städtischen Galerie Rosenheim zu sehen. Unsere Reportage führt zudem nach Anglet bei Biarritz, wo vor dem Bürgermeisteramt ebenfalls ein Werk des Künstlers steht. +++ Endless Wellness kommen am 4. November ins Rockhouse Salzburg zurück. Seit fünf Jahren verwandelt die Band kollektive Erschöpfung in tanzbares Aufbegehren: harmonisch, humorig, mit Verzerrung und Texten gegen Depressionen. Nach dem Ausstieg des Keyboarders spielen sie nun zu dritt. +++ Die Bayernhymne Für Bayern ist seit 1964 offizielle, verfassungsrechtlich geschützte Hymne des Freistaats. Melodie: Max Kunz (1860), Text: Michael Öchsner. Bei Anlässen erklingen meist die ersten zwei Strophen. Hier gespielt von der Blaskapelle Rott am Inn.'
