  title: Süd Journal vom 30.10.2026 (Wh.)
  subtitle: Zukunftsagenda Kliniken Südostbayern +++  Freilassinger Verkehrsader bleibt im Bau +++ Kunsteisbahn Königssee vor der Wiedereröffnung
  description: 'Traunstein und Berchtesgadener Land halten an der kommunalen Trägerschaft der Kliniken Südostbayern fest. Nach Auslaufen des Hilfsprogramms Ende 2027 fließen 2028 bis 2035 jährlich 12 Millionen Euro Investitionszuschüsse, inklusive Neubau in Bad Reichenhall und Sanierungen. +++ Freilassing saniert seit dem Frühjahr die Münchener Straße, die wichtigste Durchgangsstraße der Stadt. Die Baustelle belastet Anwohner und Betriebe, weil die Straße zur Einbahnstraße wurde, Zufahrten bleiben aber möglich. Jetzt startet der Endspurt vor der Winterpause. +++ Nach fünf Jahren Pause öffnet der Eiskanal am Königssee wieder: Am 11. November wird die älteste Kunsteisbahn der Welt mit der Deutschen Rodel-Meisterschaft eröffnet. Nach Unwetterschäden von 2021 laufen noch Vereisung und letzte Arbeiten im oberen Bereich.'
- eventId:
  - 567566
  - 609348
  - 893904
  start: 2026-10-31T00:10:00Z
  stop: 2026-10-31T00:20:00Z
  title: Süd Journal vom 30.10.2026 (Wh.)
  subtitle: Radweg wird Saniert +++ Engpass bei der Mittagsbetreuung +++ Der fünfte Tag der Forschung an der TH Rosenheim
  description: 'Der Innradweg in Rosenheim wird ab Montag saniert: Der 2,5 Kilometer lange Abschnitt zwischen Innspitz und Klärwerk ist betroffen. Radfahrer werden über Schönfeldstraße und Pettenkoferstraße umgeleitet. Die Arbeiten dauern voraussichtlich zwei Wochen. +++ An der Grundschule Erlenau in Rosenheim fehlen in der Mittagsbetreuung Plätze: 19 Familien gingen leer aus, 16 trotz Vorjahresplatz. 96 Kinder werden in mehreren, teils ungeeigneten Gebäuden betreut. Ein Umzug scheiterte an fehlender Förderung, Container werden geprüft. +++ Beim 5. Tag der Forschung an der TH Rosenheim standen humanoide Roboter im Fokus: Systeme wie Lumo laufen, springen und verstehen Sprache, KI soll sie alltagstauglich machen. Gezeigt wurden auch effiziente, sichere Industrieroboter sowie Projekte zu Nachhaltigkeit, Materialien und Mobilität.'
- eventId:
  - 567567
  - 609349
  - 893905
  start: 2026-10-31T00:20:00Z
  stop: 2026-10-31T00:30:00Z
  title: Süd Journal vom 30.10.2026 (Wh.)
  subtitle: Valentin Rapp gewinnt Filmpreis +++ Wetter für das Sendegebiet
  description: 'Der Raublinger Filmemacher Valentin Rapp gewinnt beim Bergfilmfestival Tegernsee den Publikumspreis. Sein Film Six Days to the Edge begleitet ein Slackline-Team am Salto Ángel in Venezuela und überzeugt mit authentischer, emotionaler Extremsport-Doku. +++ Trübes Wochenende in vielen Teilen Deutschlands: Wolken, Nebel und zeitweise Regen prägen das Wetter, besonders im Norden und Osten. Im Südwesten gibt es am Samstag bessere Aussichten mit längeren sonnigen Abschnitten.'
- eventId:
