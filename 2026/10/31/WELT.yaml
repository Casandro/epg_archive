  title: Die deutsche Marine - Technik, Einsatz, Geschichte
  subtitle: Die deutsche Marine - Technik, Einsatz, Geschichte
  description: Mit der Wiederbewaffnung nach dem Zweiten Weltkrieg erhält die Bundesrepublik Deutschland im Jahr 1956 auch wieder Seestreitkräfte. Wie die gesamte Bundeswehr ist die Bundesmarine fest in NATO-Kommandostrukturen eingebettet. Inzwischen operiert sie weltweit und ist jederzeit für den Ernstfall vorbereitet. Die Dokumentation gibt einen Überblick über die Geschichte der deutschen Marine, besucht einen Stützpunkt in Warnemünde und begleitet Gefechtsübungen auf der Ostsee.
