  subtitle: 'Border Patrol Südamerika: Gestohlene Identität'
  description: 'Am Flughafen von Santiago de Chile gerät die Anti-Drogen-Brigade in Alarmbereitschaft: Drei Touristen ohne Gepäck entpuppen sich nach einer Röntgenuntersuchung als Teil einer riskanten Schmuggeloperation. Zeitgleich sorgt eine Familie aus Hongkong für Aufsehen, als Unstimmigkeiten in ihren Pässen entdeckt werden. Und ein aus den USA abgeschobener Chilene gibt den Behörden Rätsel auf - was wird die Kontrolle ans Licht bringen?'
