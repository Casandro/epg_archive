  title: Ján XXIII. - Posol mieru (1)
  subtitle: 1. časť. Dramatický príbeh zachytávajúci úsek zo života jedného z pápežov, ktorý sa zapísal do dejín prívlastkom liberálny.
  description: 'Dramatický príbeh zachytávajúci úsek zo života jedného z pápežov, ktorý sa zapísal do dejín prívlastkom liberálny. Počas druhej svetovej vojny pôsobil ako vatikánsky diplomat v Turecku, kde tajne vyjednával s nacistami, aby zabránil transportu Židov. Napriek tomu, že chcel byť radovým kňazom, stal sa Angelo Roncalli po mnohých opakovaných voľbách roku 1958 pápežom a možno naveky zmenil tvár sveta. Inicioval druhý Vatikánsky koncil, významný pre modernizáciu cirkvi. Svojou vážnosťou a vplyvom na politikov najväčších svetových mocností - Kennedyho a Chruščova - prispel k zvráteniu svetovej vojny. Celý svoj život však musel bojovať s konzervatívnym krídlom katolíckej cirkvi. Umiera roku 1963 s pocitom, že cirkev je modernejšia a svetový mier pevnejší. Vatikán blahorečil Jána XXIII. v roku 2000. Film je zaujímavou drámou z nezvyčajného zákulisia Vatikánu. Réžia: Giorgio Capitani. Účinkujú: Edward Asner (Angelo Roncalli), Massimo Ghini (Angelo Roncalli giovane), Claude Rich (Cardinal Ottaviani), Michael Mendl (Tardini), Franco Interlenghi (Radini Tedeschi) (2002)'
  ageRating: 12
  genre:
  - '16'
- eventId: 652970
  start: 2026-10-31T21:15:00Z
  stop: 2026-10-31T22:10:00Z
  title: Vatikánske múzeá I (3)
  subtitle: Zlatý vek renesancie, Rafaelove miestnosti. Talianský dokumentárny seriál o dejinách, architektúre a rôznych artefaktoch Vatikánskych múzeii.
  description: 'Talianský dokumentárny seriál o dejinách, architektúre a rôznych artefaktoch Vatikánskych múzeii. V tretej časti série o Vatikánskych múzeách sa dozvieme viac o zlatom veku talianskeho umenia - renesancii. Hoci jeho srdcom bola spočiatku Florencia, vďaka záujmu a finančnej podpore zo strany pápežov sa jej stredisko čoskoro presunulo do Ríma. Dnes budeme vo Vatikánskych múzeách obdivovať prekrásne tapisérie v Raffaelovej sále a Pinturicchiove maľby a fresky. Réžia: Maria Amata Calo (2015)'
  genre:
  - '35'
