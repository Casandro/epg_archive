  title: Vatikánske múzeá I (3)
  subtitle: Zlatý vek renesancie, Rafaelove miestnosti. Talianský dokumentárny seriál o dejinách, architektúre a rôznych artefaktoch Vatikánskych múzeii.
  description: 'Talianský dokumentárny seriál o dejinách, architektúre a rôznych artefaktoch Vatikánskych múzeii. V tretej časti série o Vatikánskych múzeách sa dozvieme viac o zlatom veku talianskeho umenia - renesancii. Hoci jeho srdcom bola spočiatku Florencia, vďaka záujmu a finančnej podpore zo strany pápežov sa jej stredisko čoskoro presunulo do Ríma. Dnes budeme vo Vatikánskych múzeách obdivovať prekrásne tapisérie v Raffaelovej sále a Pinturicchiove maľby a fresky. Réžia: Maria Amata Calo (2015)'
