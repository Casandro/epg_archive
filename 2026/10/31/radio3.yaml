  title: Holzapfels Klassik
  subtitle: 'Moderation: Stephan Holzapfel'
  description: |-
    Musik zum Kennenlernen, Staunen und Genießen bietet Stephan Holzapfel zur Mittagsstunde. Er sendet originelle, handverlesene Klassik, gewohnt eigensinnig präsentiert. Mal wird es informativ, mal stimmungsvoll und oft beides. Hören Sie die beste Musik in den besten Aufnahmen, oder zumindest das, was Stephan Holzapfel dafür hält.

