  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: |-
    CANADA - WE HEAR YOU
    Die Singer-Songwriter-Szene in Kanada hat sich in den letzten Jahren auch bei uns mehr Gehör verschafft. Zurecht. Die Vielfalt und Kreativität der Musikerinnen und Musiker ist wirklich hörenswert. Wir begegnen heute Abend zum Beispiel Jordan Klassen, Adam Cohen, Daniela Andrade und natürlich auch die "alten Hasen" wie Joni Mitchell oder Gordon Lightfoot.

    Moderation: Susanne Papawassiliu
