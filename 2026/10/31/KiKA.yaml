  description: |-
    Ein Boot mit Tönen kippen?!

    Heute muss Tobi für sein Chexperiment ins Schwimmbad. Hier trifft er Akustikexperte Andreas. Und der stellt ihm eine verrückte Aufgabe. Der Checker muss ein Spielzeugboot zum kentern bringen. Allerdings darf Tobi weder das Wasser noch das Boot direkt berühren oder etwas ins Wasser werfen, das Wellen erzeugt. Tobi fasst den Plan, das Boot umzupusten, doch der scheitert. Erst als Tobi sich Verstärkung holt und die Kinder im Hort nebenan fragt, ob sie ihm helfen können, haben sie gemeinsam eine Idee: Schallwellen sollen das Boot umkippen. Aber wie bekommt man die ins Wasser?
    Moderation: Tobias Krell
    Regie: Mathias Hagn
    Musik: Dieter Holesch
