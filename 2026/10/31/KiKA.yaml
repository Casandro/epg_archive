  description: |-
    Die hexische Pflanze

    Bibi macht ein Praktikum bei Karla Kolumna. Sie will den Bürgermeister von mehr Grün in Neustadt überzeugen, was er ablehnt. Bibi vertraut auf eine besondere Hexenpflanze von Tante Mania.

    Die Pflanze sorgt eigentlich für gute Laune und soll den Bürgermeister umstimmen. Doch der Plan geht nicht auf: Seine schlechte Laune lässt sie als Unkraut wuchern, Ranken greifen um sich. Selbst der Bügermeister wird eingewickelt. Bibi muss helfend eingreifen.

    Bibi fordert den Bürgermeister auf, der Pflanze freundlich zu begegnen - und tatsächlich, langsam zieht sie sich zurück, und wunderschöne Blüten sprießen überall. Auch das entlaufene Fröschli freut sich über das neue Grün. Als Mania eintrifft, bleibt sie gelassen, aber bestimmt und nimmt ihre Leihgabe wieder zurück. Eine hexische Pflanze gehört nicht ins Rathaus, doch Begrünung schon. Der Bürgermeister zeigt Einsicht und verspricht: Neustadt wird grüner.
    Regie: Karsten Kiilerich, Aina Järvine, Ulrike Klein
    Musik: Martin de Vries
