  title: Tigerenten Club
  subtitle: Gruselige Experimente zu Halloween
  genre:
  - '80'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Der Club zum Mitmachen

    Gruselige Experimente zu Halloween

    Krach, Bumm, Bang! Zu Halloween experimentieren der Entertainer Jack Pop und Johannes im Tigerenten-Grusellabor. Ob Geisterschrift, buntes Hexenfeuer oder ein kotzender Kürbis - Jack erklärt die Wissenschaft hinter den lustigen und gruseligen Effekten. Denn was wie Magie wirkt, hat oft eine superspannende Erklärung!

    Und natürlich heißt es auch diesmal wieder: Tigerenten gegen Frösche! In der Spielearena wird eine Halloween-Party gefeiert und um den goldenen Tigerenten-Pokal gekämpft. Für die Tigerenten treten Emilie, Hanna und Leo an. Für die Frösche gehen Hannah, Eliana und Moritz an den Start. Beide Teams kommen vom Ernst-Abbe-Gymnasium in Oberkochen. Die Teams messen sich unerschrocken in gruseligen Spielen. Ob Horror-Quiz oder Kürbis-Challenge - nichts kann sie schocken!

    Dabei geht es nicht nur um Ruhm und Ehre: Die Teams unterstützen mit Spendengeldern die Kinderhilfsaktion "Herzenssache" des SWR und SR. Die Erstplatzierten gewinnen 600 ? und die Zweitplatzierten 400 ? für den guten Zweck. Zuschauer können live in der KiKA-Quiz App mitspielen und eine kleine Glückstigerente gewinnen.

    Der Tigerenten Club ist eine Produktion des Südwestrundfunks für KiKA und Das Erste. Seit mehr als 30 Jahren steht die Sendung für Action, Spaß und kunterbunte Themen.
    Moderation: Laura Knöll, Joyce Stiernon, Johannes Zeng

