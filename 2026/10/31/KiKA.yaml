    Mit vereinten Kräften gelingt es Bibi, Barbara und Oma Grete, Malicia zu stellen. Doch Flip weigert sich, die ersehnten Runzelwurzeln zu suchen. Erst als sie den Zwilling Flop herbeihext, kann die Wurzelsuche beginnen. Im letzten Moment erreichen sie den Blocksberg, der Trank wird inklusive der besonderen Zutat gebraut, und das Runzelwurzel-Fest kann beginnen.
