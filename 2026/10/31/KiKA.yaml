  title: Tigerenten Club
  subtitle: Gruselige Experimente zu Halloween
  genre:
  - '80'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Erwischt!

    In zwei Wochen ist ein wichtiger Wettkampf auf dem Wendy unbedingt dabei sein will. Doch als Wendy eine schlechte Note im Mathetest nach Hause bringt, sind ihre Eltern entsetzt. Sie machen ihr zur Auflage, dass sie nur mitreiten darf, wenn sie im nächsten Mathetest eine gute Note schreibt. Christian bietet sich an, ihr zu helfen und überraschenderweise haben die beiden sehr viel Spaß beim Lernen.

    Obwohl der nächste Test ganz gut läuft, schreibt Wendy bei einer Aufgabe von Christian ab. Ihre Freude über die Eins im Test wird etwas getrübt, als Jerry sie aufs Schummeln anspricht. Es ist ihr unangenehm und sie weiß selbst nicht, wieso sie das gemacht hat. Als noch weitere Situationen kommen, in denen andere nicht aufrichtig handeln, macht sich Wendy immer mehr Gedanken über Ehrlichkeit und ihren Wert. Schließlich trifft sie eine bedeutungsvolle Entscheidung.
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

