  description: |-
    Das Junghexen-Zeltlager

    Bibi, Schubia und Xenia planen ein Junghexen-Zeltlager. Während die Mädchen sich auf Schwimmen und Pilzesammeln freuen, träumen Bibis Eltern von einem nostalgischen Wochenende.

    Unterwegs treffen sie auf zwei Jungs, die mit Bikes durch den Wald rasen. Ein Wettrennen zum Lagerplatz beginnt. Während Bibi und Schubia sich anfreunden, ist Xenia zunehmend genervt. Ihre Hexstreiche nehmen zu, sie hext nachts sogar ein Gespenst ins Zelt der Jungs.

    Am nächsten Tag wollen Malik und Yaris abreisen. Als Bibi Xenia entlarvt, reagiert sie wütend und verhext die Jungs in Esel. Die Rückhexung gelingt erst mithilfe von Barbaras Hexbuch, allerdings sind da die Esel schon zur Hütte von Barbara und Bernhard ausgebüxt. Nach einigen Turbulenzen gelingt die Rückverwandlung. Malik und Yaris decken Xenia vor Barbara, die die Junghexen zur Rede stellt. Sie sprechen von einer verlorenen Wette. Am Ende bleibt Xenia doch noch, und alle sammeln gemeinsam Pilze, sodass das Junghexenzeltlager glücklich endet.
    Regie: Karsten Kiilerich, Aina Järvine, Ulrike Klein
    Musik: Martin de Vries
