  title: Corso - Kunst & Pop
  description: |-
    Editors-Sänger Tom Smith: ?Nichts tut so weh wie das Leben.?
    Auf ihren letzten drei Alben geriet der Sound der Editors zunehmend elektronisch. Die neuen Songs über die Zumutungen der Welt sollten aber wieder handgemachter klingen - durchaus geprägt vom akustischen Soloalbum von Sänger Tom Smith, der damit zuletzt eine Tournee ohne seine Band gespielt hatte. ?Es war wunderbar, wieder bei meinen Brüdern zu sein?, sagt Smith im Corsogespräch.

    Hyperpop goes Rock - Die Band DIIV
    Das Rockquartett aus Brooklyn protestiert auf dem neuen Album ?Zirp!? in Anzug und Krawatte und täuschend munter gegen eine inhumane Weltwirtschaft, unterstützt von Hyperpop-Vordenker und Charli-XCX-Produzent A.G. Cook. Markante Songzeile? ?Schmeißt die Milliardäre in eine Grube voller Krokodile!?

    Sehnsucht nach einem sicheren Zuhause: Das neue Album von Tränen
    Ihr Alltag in Chemnitz sei von einem Gefühl der Fremdheit geprägt, berichten Gwen Dolyn und Steffen Israel angesichts des gesellschaftlichen Rechtsrucks. Auf ihrem neuen Album ?Leben in einer Katze? verpacken sie das Thema aber in ein surrealistisches Konzept, in dem Aliens in Gestalt von Katzen die Welt der Menschen erkunden. ...
