  description: |-
    Das Bildungsmagazin

    Gekommen, um zu bleiben? Was internationale Fachkräfte hält

    Neben der Bezahlung, beruflichen Einstiegs- und Aufstiegsmöglichkeiten entscheiden auch bezahlbarer Wohnraum und das soziale Umfeld, ob Fachkräfte langfristig bleiben. Wie schaffen Unternehmen eine nachhaltige Willkommenskultur? Was macht einen Ort lebenswert für Menschen, die neu nach Deutschland kommen? Wer oder was kann das Ankommen erleichtert? Welche Verantwortung haben Führungskräfte und ihre Teams, aber auch Hochschulen und Kommunen?

    Gäste:
    Katharina Pfister, Leiterin Amt für Migration und Flüchtlinge, Landratsamt Böblingen
    Dr. Julian Jäger, Deutsches Zentrum für Integrations- und Migrationsforschung (DeZIM) e.V.
    Am Mikrofon: Dörte Hinrichs

    Hörertelefon: 00800 - 4464 4464
    campus@deutschlandfunk.de
    WhatsApp 0173 - 535 8089
