  description: Toni macht sich wenig aus Politik, aber viel aus Freundschaft. Als ihn die bayrische Familienministerin Sissi Hopf, seine Jugendliebe aus Schultagen, um Unterstützung bittet, kann er schwerlich Nein sagen. Nun merkt der "Babyflüsterer" aus nächster Nähe, welchen Belastungen die hochschwangere Politikerin ausgesetzt ist. Dass ihr Lebensgefährte Konstantin von ihren Karriereplänen wenig begeistert ist, versucht die Multitaskerin auszublenden. Als sich Beziehungsprobleme anbahnen, weiß Toni, dass er jetzt vor allem als Freund gefragt ist. Alte Gefühle, die bei ihm und Sissi zeitgleich erwachen, machen es beiden nicht einfacher.
