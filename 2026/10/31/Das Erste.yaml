  description: Die Bremers sind eine ganz normale Familie. Mutter Anja regelt das Leben ihrer beiden heranwachsenden Kinder, und ihr Mann Ulli sitzt nach getaner Arbeit vor dem Fernseher. Das behagt der patenten Kindergärtnerin nicht, denn sie hat noch Pläne. Nach dem segensreichen Gewinn einer Lottomillion könnte sie nun ihre Träume endlich verwirklichen. Leider muss sie jedoch befürchten, dass ihr Mann aufgrund des unerwarteten Reichtums den Hintern gar nicht mehr hochbekommt. Um ihn zu motivieren, entwickelt Anja einen kühnen Plan. Damit löst sie mehr Wirbel aus, als ihr lieb ist.
