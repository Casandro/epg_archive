- eventId: 690367
  start: 2026-10-31T07:10:00Z
  stop: 2026-10-31T07:20:00Z
  title: Písničky z cizí kapsy
  description: Za Pavlem Lohonkou, kterému nikdo už desítky let neřekne jinak než Žalman, jsou stovky písniček, jimiž na české hudební mapě pomáhal zviditelnit jihočeskou folkovou stopu. Nejprve s Minnesengry a pak i se svým spolem, který ho v proměnlivých sestavách doprovázel sólovou kariérou. Vedle vlastních autorských skladeb si Žalman uměl vybírat i hezké melodie od zahraničních písničkářských kolegů. Přenášel je k našincově uchu s českými texty a mnohdy tak pomáhal publiku objevovat jména hudebníků, které do té doby neznalo. Jedním z takových příkladů je i Píseň malých pěšáků, působivě opsaná od originálu amerického kolegy Johna Prinea, který stejnou skladbu (nazvanou Hello In There) zařadil na své debutové album vydané v roce 1971. Prine tak trochu v tichosti vyrostl mezi nejlepší zpěváky/skladatele své generace. Byl ceněn jako mistrovský vypravěč, jemuž nechybí smysl pro humor, ale ani vzácné vcítění do života obyčejných lidí. Konečně, i tahle písnička je toho dokladem.K poslechu zve Martin Schuster.
