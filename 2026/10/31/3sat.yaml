  title: Almen in Österreich - Vom Leben mit der Natur
  subtitle: Film von Holger Bruckschweiger
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Almen sind nicht nur ein idyllischer Lebensraum für Mensch und Tier, sondern wichtiger Bestandteil der Landwirtschaft. Die Dokumentation porträtiert Almen quer durch Österreich.

    Almen avancieren zu immer beliebteren Wanderzielen bei Touristen. Diese beeinflussen das sensible Gleichgewicht von Natur und ihrer Nutzung jedoch. Gerade der Umgang mit Kuhherden, die ihre Weideflächen auch auf Wanderrouten haben, will gelernt sein.
    HD-Produktion
