  title: Ehe gut, alles gut Staffel III
  subtitle: Das Ehrenamt mit Ehe und Familie vereinbaren
  description: |-
    Viele Menschen in unserer Gesellschaft engagieren sich ehrenamtlich. Sie leisten einen freiwilligen und unentgeltlichen Dienst für das Gemeinwesen. Auch in der Kirche ist die Bereitschaft zum Ehrenamt groß. Wie aber lässt sich diese zusätzliche Arbeit mit Ehe und Familie vereinbaren, und wo und wie kann man Grenzen setzen, wenn es zuviel wird?
    Darüber diskutieren Pater Elmar Busse von der Schönstattfamilienbewegung und Christina Link-Blumrath mit dem Ehepaar Dr. Holger und Anna Weigand.
