  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Was finde ich in der katholischen Kirche? Gottes Heilswirken in den Sakramenten
  description: |-
    Im dritten Teil des Glaubenskurses der Bistümer Augsburg, Regensburg, Passau und Eichstätt kommen wir dem Geheimnis der katholischen Kirche noch ein Stückchen näher. Regina Steinhardt, Theologin aus dem Bistum Augsburg, erklärt, was ein Sakrament ist - und das nicht nur für "Neulinge" im Glauben, sondern auch für Menschen, die am sakramentalen Leben der Kirche bereits teilnehmen.

    Im "Kath-Kurs konkret"-Interview erfahren wir von Dr. Pia Sommer, was Gemeinschaft für den Kath-Kurs bedeutet.
