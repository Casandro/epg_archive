  title: Gott erlebt (Staffel 5)
  subtitle: '"Die Eucharistie muss das Herz auch trotz Pfarreistrukturreformen bleiben"'
  description: Mit 15 Jahren machte Simon Schmidbauer eine besondere persönliche Erfahrung in der Eucharistie. Seither ist eine innere Klarheit und Gewissheit von Gottes Präsenz tief in seinem Innern verankert. Zuerst schien es, dass der Weg als Priester für ihn vorher bestimmt sei. Doch sein Weg ging nach dem Theologiestudium in eine Strategieberatung und zur Erzdiözese Wien bevor er an seiner jetzigen Wirkungsstätte angekommen ist. Als Leiter Strategie und Evangelisierung im Erzbistum Köln verantwortet er unter anderem die Pfarreistrukturreform und legt dabei großen Wert auf ein vertieftes Verständnis der Eucharistie und der eucharistischen Anbetung.
  widescreen: true
