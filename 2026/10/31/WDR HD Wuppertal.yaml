  title: Aufbruch ins Wirtschaftswunderland (2/4)
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der zweiten Folge stehen die Jahre 1951 bis Anfang 1954 im Fokus. Politisch gab Adenauer eine klare Richtung vor: Integration und Anerkennung in der westlichen Welt. In Bonn wurden nach Abschluss des Deutschlandvertrages im Jahr 1952 wieder ausländische Staatsgäste empfangen und Adenauer reiste hinaus in die Welt. \nEs brummte im jungen Bundesland Nordrhein-Westfalen. 1952 wurde in Dortmund die neu erbaute Westfalenhalle eröffnet und der NWDR sendete von Köln aus das erste deutsche Nachkriegsfernsehprogramm aus dem gerade neu erbauten Funkhaus."
- eventId:
