  description: "Ausstrahlung auch im englischen Originalton\n\nAls sich die Pest in der Pye Street weiter ausbreitet, wird Marlott vom Schicksal der Armen zutiefst bewegt, die ohne Hilfe von Kirche oder Staat in erbärmlicher Armut dem Tod überlassen werden. Gemeinsam mit Spence trägt er die Leichen zum Gemeinschaftsgrab und zeichnet die Türen der Verstorbenen mit einem Kreuz.\nMarlott trifft auf einen alten Feind: den Kinderfänger Billy Oates (Robbie Gee), der gerade nach London zurückgekehrt ist und nun für einen Wanderzirkus arbeitet. \n\nMarlott begibt sich auf das Gelände des Jahrmarkts und bedroht Oates."
