  description: "Susanne Mertens hat zwar die erhoffte Festanstellung nicht bekommen, wird aber in Zukunft für den Zoo als freie Tierärztin arbeiten. Die Familie hofft mit ihr, dass die vielen anfallenden Kosten, auch für das renovierungsbedürftige Wochenendhaus, zu bewältigen sind. Susanne muss endlich ihre Außenstände einfordern, denn die Bank drängt. Als sie von Hof zu Hof fährt, um offene Rechnungen anzumahnen, trifft sie auf Mike Redmann, den Betreiber einer Alpaka-Farm. Die beiden sind sich sofort sympathisch - nicht mehr, aber auch nicht weniger. \n\nAußerdem muss sich Susanne auf andere Dinge konzentrieren."
