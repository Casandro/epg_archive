  description: Endlich ein lukrativer Auftrag für die Kanzlei Brede und Gellert. Der schüchterne Computer-Nerd Daniel Bienert bittet Markus Gellert um Hilfe. Er gibt an, dass sein Ex-Mitbewohner Benedict Vollmer ihm die Idee und den Quellcode zu einer neuartigen App geklaut und diesen für viel Geld an den Softwareriesen TEDCOM verkauft hat. In einigen Tagen will die TEDCOM die neue App der Öffentlichkeit präsentieren. Einziger Beweis, dass Daniel Bienert tatsächlich die App entwickelt hat, sind handschriftliche Notizen des Computer-Nerds.
