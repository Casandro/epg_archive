    Ausstrahlung auch im englischen Originalton

    In dieser Folge bestätigt der Journalist Boz das, was Marlott die ganze Zeit vermutet hat: Daniel Hervey lebt und ist wohlauf - und hält sich in London auf. Gemeinsam stellen sie Renquist zur Rede, der jedoch jede Auskunft verweigert. Sein Handlanger Blackwood hingegen verrät Marlott den Standort eines verlassenen Knochenhauses, in dem Marlott vermutet, dass Hervey seinen üblen Machenschaften nachgeht. Das Knochenhaus gehört Frederick Dipple, der es zur Lagerung eines modischen Luxusguts nutzt: Eisblöcke. Esther besucht am Tag nach dem Fest Frederick Dipple.
