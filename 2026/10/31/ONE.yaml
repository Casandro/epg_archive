  description: Muss ein Sohn, der von seinem Vater verstoßen wurde und ihn seit dem 16. Lebensjahr nicht mehr gesehen hat, für die Pflege des dementen Vaters aufkommen? Laut Gesetz schon, aber Isa von Brede findet das eine himmelschreiende Ungerechtigkeit. Sie übernimmt die Vertretung von Felix Bartels. Ein Ansatzpunkt, um ihren Klienten vor dem finanziellen Ruin durch die Pflegekosten zu bewahren, ist dessen Bruder Gerald. Der arbeitet als Straßenmusiker und behauptet, kein Einkommen zu haben. Merkwürdig nur, dass Gerald auf einer sehr teuren Les-Paul-Gitarre spielt, wie Markus Gellert auf einem Foto des Straßenmusikers entdeckt.
