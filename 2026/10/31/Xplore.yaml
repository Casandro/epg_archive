  title: Deutschlands Küsten - Von Rostock nach Rügen
  subtitle: Deutschlands Küsten - Von Rostock nach Rügen
  description: Die neunte Etappe entlang "Deutschlands Küsten" führt von Rostock über die Halbinsel Darß-Fischland-Zingst auf die Insel Rügen. Aus der Luft mutet die Boddenlandschaft recht bizarr an, die die letzte Eiszeit hinterlassen hat. An der Steilküste von Wustrow sucht Jürgen Gründling seit seiner Kindheit nach Bernstein. Über die Jahrzehnte hat er ein gutes Gespür entwickelt, wo das Gold der Ostsee zu finden ist. Im Dörfchen Ahrenshoop treffen bis heute Tradition und Kunst aufeinander. Hier gibt es noch den alten Brauch des Tonnenschlagens. Die Dorfbewohner treten zu Pferd gegeneinander an, um ein Heringsfass zu zerschlagen. Das geht auf die Zeit zurück, als die Pommern Heringe als Steuern an die schwedischen Besatzer zahlen mussten. Die Hubschrauberreise entlang der Küsten führt weiter nach Prerow. Hier schnitzen die Brüder Roloff die traditionellen Darßer Türen. Die bunten Haustüren prägen das Bild der Dörfer auf dem Darß. Früher waren sie Statussymbole reicher Kapitäne. Am Abend sammeln sich in den Boddengewässern die Kraniche. Sie rasten hier auf dem Weg nach Süden. Im September, wenn Tausende von Kranichen den Himmel verdunkeln, zieht es die Ornithologin Silke Fregin nach Groß-Mohrdorf, um die großen und anmutigen Vögel zu beobachten. Weiter geht es zum Leuchtturm von Hiddensee, der den Schiffen auf der Ostsee von weitem den Weg weist. Und im Ozeaneum Stralsund stellt Kuratorin Nicole Kube ihr Lieblings-Exponat vor, den Mondfisch. Diese seltene Fischart wird weltweit nur in zehn Aquarien ausgestellt. Rügen, die Insel der endlosen Sandstrände und berühmten Kreidefelsen ist die letzte Etappe. Vom Fährhafen Sassnitz geht es auf der ältesten Fährverbindung nach Schweden. Sie verknüpft auch die Eisenbahnnetze zwischen Skandinavien und Zentraleuropa. Kapitän Volkmar Milzow befährt seit 20 Jahren die Strecke über die Ostsee nach Trelleborg. DE 2010
