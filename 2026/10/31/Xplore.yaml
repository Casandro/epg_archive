  title: Foodwise - Veggie Beijing
  subtitle: Foodwise - Veggie Beijing
  description: Peking ist eine 3000 Jahre alte Metropole mit einer schwindelerregenden Vielfalt an kulinarischen Traditionen, darunter auch die vegetarische Küche. Für die Pekinger ist vegetarisches Essen die beste Art, den Frühling zu begrüßen. Heute nehmen Tianran und Angela die Herausforderung an. CN 2023
