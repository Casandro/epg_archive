  start: 2026-10-31T18:25:00Z
  stop: 2026-10-31T18:45:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Wolfsburg mit Katharina Schubert
  subtitle: VIP Trip - Prominente auf Reisen 4 - Wolfsburg mit Katharina Schubert
  description: 'Wolfsburg ist die Heimat von Schauspielerin Katharina Schubert. Nun will sie einer größeren Zuschauergemeinde "ihre" Stadt vorstellen und näher bringen. So besteht der Stadtteil Fallersleben aus vielen hübschen, renovierten  Fachwerkhäusern. Übrigens, auch die Heimat von Hoffmann von Fallersleben. Dieser entwarf vor mehr als 175 Jahren den Text der deutschen Nationalhymne. Ein  faszinierender Kontrast dazu: das Phaeno. In dem hochmodernen Gebäude von Renzo Piano können Kinder und Erwachsene Naturphänomene auf den Grund gehen. Weiterer Programmpunkt: ein Besuch der mobilen Erlebniswelt "Autostadt" und mit seiner einzigartigen Sammlung von Oldtimern. Auch eine Visite im städtischen Kunstmuseum und im Allerpark lässt sich Katharina Schubert nicht entgehen. DE 2017'
- eventId:
