  start: 2026-10-31T18:50:00Z
  stop: 2026-10-31T19:09:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Taiwan mit Valerie Niehaus
  subtitle: VIP Trip - Prominente auf Reisen 4 - Taiwan mit Valerie Niehaus
  description: 'Sprudelnde heiße Quellen, von Palmen gesäumte Strände, geheimnisvolle Berglandschaften. Flächenmäßig ist Taiwan gerade mal so groß wie Baden-Württemberg, aber die Insel im Pazifik zählt mehr Berge über 3000 Meter als Österreich. Mit anderen Worten: Taiwan ist ein Land, das überrascht.  Viele taoistische und buddhistische Tempel belegen, dass die Bevölkerung tief in Traditionen verhaftet ist und doch längst im digitalen Zeitalter angekommen ist. Auch Kunst und Kultur stehen auf der Insel hoch im Kurs. Taiwans Kulturszene ist eine der markantesten in ganz Asien. Die Doku mit der Schauspielerin Valerie Niehaus zeigt, wie vielfältig und abenteuerlich Taiwan ist und welche Regionen auf jeden Fall einen Besuch lohnen. DE 2019'
