  title: Foodwise - Chongqing
  subtitle: Foodwise - Chongqing
  description: Willkommen in Chongqing, der größten Stadt Chinas. Sie liegt im Südwesten des Landes, erstreckt sich über zwei mächtige Flüsse und ist berühmt für ihre außergewöhnliche Skyline mit ihren aus den Hügeln emporschießenden Hochhäusern und schwindelerregenden Brücken. CN 2023
- eventId: 785433
  start: 2026-10-31T21:50:00Z
