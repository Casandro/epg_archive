- eventId: 784602
  start: 2026-10-31T23:20:00Z
  stop: 2026-11-01T00:12:00Z
  title: Deutschlands Küsten - Von Rügen nach Usedom
  subtitle: Deutschlands Küsten - Von Rügen nach Usedom
  description: Die zehnte und letzte Folge der Dokumentationsreihe "Deutschlands Küsten" führt von der Insel Rügen nach Ahlbeck, ein Grenzort zwischen Deutschland und Polen auf der Ostseeinsel Usedom. Die letzte Etappe der Reise beginnt in Prora auf Rügen. Hier wirft eine fünf Kilometer lange Ruine aus der NS-Zeit ihre Schatten auf den Strand. Geplant war sie für 20.000 Urlauber als größte Ferienanlage der Welt. Doch aus dem staatlich geförderten Massenurlaub wurde nichts. Bei Ausbruch des Zweiten Weltkriegs wurden die Bauarbeiten gestoppt. Heute stehen die Gebäude unter Denkmalschutz und dürfen nicht abgerissen werden. Aus der Luft strahlen die weißen Häuser der Bäderarchitektur von Binz besonders hell. Hier versorgt ein schwäbischer Sternekoch seine Gäste mit fangfrischem Ostseefisch. Das hat ihm, seinem Strandrestaurant "niXe" in Binz und der Insel Rügen den ersten Michelin-Stern eingebracht. Die Reiseroute führt weiter nach Süden. Ein Wasserlauf trennt Moritzdorf vom Nachbarort Baabe. Wer ans andere Ufer möchte, ist auf eine Fähre angewiesen. Der Dampfzug "Rasender Roland", ein nicht nur bei Touristen beliebtes Verkehrsmittel, lässt eine andere Dimension des Reisens entdecken. Nur wenige Menschen kommen auf die Insel Vilm, die seit 1990 eine der Kernzonen des Biosphärenreservates Südost-Rügen bildet. Über den Greifswalder Bodden geht es weiter nach Lubmin, vorbei am einstigen Stolz der DDR-Energiewirtschaft, dem Kernkraftwerk Greifswald. Vor dem Kraftwerk wird ein schwedisches Wrack gehoben, das hier 1715 versenkt wurde und nun der Ostseepipeline zwischen Russland und Deutschland im Weg liegt. In Zinnowitz auf Usedom trainieren Katrin Holtwick und Ilka Semmler Beachvolleyball. Die beiden Profis erlebten kürzlich ihren größten Triumph, den Sieg bei den Deutschen Meisterschaften. Mit dem majestätischen Flug der Seeadler, die auf der Insel Usedom überlebt haben, endet die letzte Etappe entlang "Deutschlands Küsten". DE 2010
