  title: VIP Trip - Prominente auf Reisen 4 - Teneriffa mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Teneriffa mit Eva Habermann
  description: 'VIP Trip - Prominente auf Reisen 4: Begleiten Sie Eva Habermann auf ihrer spannenden Reise quer durch Teneriffa. Die deutsche Schauspielerin erkundet die vielfältige, vom Vulkanismus geprägte Natur Teneriffas. Die Rundreise führt sie über Steinwüsten zum höchsten Berg Spaniens, den Teide, und tief in die Erde durch riesige, begehbare Lavakanäle. Im Kayak erforscht Eva Habermann zudem die wilde Küstenregion Im Süden Teneriffas. Übrigens: Teneriffa ist weltweit einer der besten Hot Spots zur Beobachtung von Walen und Delphinen. Doch auch der Besuch der schönen Küstenstädte Teneriffas lohnt. Gerade Santa Cruz de Tenerife lockt mit wunderschöner Architektur, romantischen Cafes und Restaurants. Ein wunderbarer Ausgangsort außerdem für einen Streifzug durch die Küche der Kanarischen Inseln. Genießen Sie es! DE 2017'
- eventId:
