  subtitle: San Giuliano di Puglia, ore 11.32 il crollo Prima Visione - DOCUMENTARIO - La scuola di San Giuliano di Puglia è un monumento di dolore e un messaggio di speranza. Il 31 ottobre 2002 un terremoto ha sbrici
  description: |-
    olato le aule uccidendo 27 bambini e un'insegnante. "Noi adulti, noi genitori, sentiamo la responsabilità di non essere stati capaci di proteggere i nostri figli", ha detto l'allora presidente Carlo Azeglio Ciampi davanti alla distesa di bare bianche. - Scritto da Floriana Bulfon
