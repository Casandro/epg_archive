  subtitle: 'Was hat Franken diese Woche bewegt? Wir blicken zurück auf die wichtigsten Geschichten aus der Region: Protest gegen eine geplante Mülldeponie, ein besonderer Blick in die Kirche von Mühlhausen und die Erö..'
  description: In unserem Wochenrückblick schauen wir auf die Themen, die Franken in den vergangenen Tagen beschäftigt haben. In Kalchreuth formiert sich Widerstand gegen eine geplante Abfalldeponie am Mistelberg. In Mühlhausen entdecken wir mit Maria Kilian die Besonderheiten der örtlichen Kirche. In Nürnberg dreht sich bei der it-sa alles um Cybersicherheit und den Schutz vor digitalen Angriffen. Außerdem begleiten wir die Wahl von Miss und Mister Nürnberg, schauen beim Infomobil des Bundestages in Erlangen vorbei und reisen in Langenaltheim rund 150 Millionen Jahre zurück in die Vergangenheit - auf den Spuren des Archaeopteryx.
