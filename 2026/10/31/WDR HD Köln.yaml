  description: In der "Einfach und köstlich"-Küche steht heute Björns langjähriger Freund Frank Buchholz mit am Herd. Er kochte in den besten Restaurants, erhielt zahlreiche Auszeichnungen und ist kulinarisch schon immer auch der italienischen Küche verfallen. Diesmal füllt Frank Buchholz selbstgemachte Ravioli mit Kürbis und reicht dazu ein schnelles Hirschragout. Björn Freitag backt einen Zwiebelkuchen und serviert ihn mit gebratenem Radicchio und einem Kräuterdip aus eingekochter Sahne.
