  description: |-
    In den Lach- und Sachgeschichten geht es heute um Musik und mehr. André zeigt eine lustige Klatschübung zum Mitmachen. Händchen versucht, Trompete zu spielen. Ob das mit einer Hand gelingt? Auch die Grille Zirrrp hat es heute mit einem Instrument zu tun: Mit einer Tuba. Emil baut sich selbst ein Bett. Und auch die fleißigen Heinzels arbeiten an etwas. Was sie zusammenbauen, wird aber noch nicht verraten.

