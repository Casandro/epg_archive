  title: Car Trackers - Autodieben auf der Spur
  subtitle: Der richtige Riecher
  description: |-
    Ein Kunde einer Mietwagenfirma könnte Verbindungen zu einer organisierten Bande haben, die Fahrzeuge illegal nach Rumänien exportiert. Deshalb hat das Unternehmen die Rückholexperten von "W4G" aus Exeter um Unterstützung gebeten. Die Zeit drängt, da die gestohlenen Autos meist binnen 48 Stunden außer Landes gebracht werden. Und Richard Taylor macht in dieser Folge Jagd auf einen 25.000 Pfund teuren Bagger. Der Tracker sendet kein Signal, deshalb versucht Richard sein Glück am letzten bekannten Standort der Baumaschine am Rand eines Golfplatzes in Guildford.
    GBR 2025
  widescreen: true
