    Manche Kriminelle stehlen Autos, um sie für ihre Machenschaften zu nutzen. Andere mieten die Fahrzeuge einfach an. Häufig wechseln die Täter ihre Wagen, damit die Polizei ihre Verbrechen nicht so leicht zurückverfolgen kann. Alan, Mike und Neil suchen in dieser Folge einen Land Rover Discovery, der mit mehreren Straftaten in Manchester in Verbindung steht. Das SUV wurde unter anderem bei einem Überfall auf offener Straße gesehen. Die Spur führt nach London. Und in der Nähe von Nottingham wurde einem Baumaschinenverleih ein drei Tonnen schwerer Bagger gestohlen.
