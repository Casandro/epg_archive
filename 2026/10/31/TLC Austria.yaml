  subtitle: Episode 10
  description: "Paul Bohill und Steve Pinner sind Gerichtsvollzieher mit jahrelanger Berufserfahrung. Allein in den letzten zwölf Monaten haben die Briten über 400 Zwangsräumungen durchgeführt. Und in dieser Folge soll das Duo im Auftrag des \"High Court of Justice\" ein rechtskräftiges Urteil vollstrecken. Doch der Härtefall geht nicht spurlos an den hart gesottenen \"Sheriffs\" vorbei. Denn eine Familie mit zwei Kindern vor die Tür zu setzen, ist nicht leicht. Trotzdem haben die Beamten keine andere Wahl. Die Rechtslage lässt ihnen wenig Spielraum. \nGBR 2015"
