  description: "Paul Bohill und Steve Pinner sollen in London eine groß angelegte Zwangsräumung durchführen. Dort haben junge Leute ein verlassenes Bürogebäude in Beschlag genommen. Dabei handelt es sich nicht um einen Einzelfall, denn in Großbritannien leben rund 40 Prozent der Obdachlosen in besetzten Häusern. Die Stimmung vor Ort ist aufgeheizt: In dem Komplex befinden sich offenbar bis zu 70 Personen und die Nachbarn beschweren sich über Lärm und Krawall. Deshalb haben die Gerichtsvollzieher zur Sicherheit die Polizei zu Hilfe gerufen. \nGBR 2015"
