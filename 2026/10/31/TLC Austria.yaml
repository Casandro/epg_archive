  stop: 2026-10-31T17:20:00Z
  title: Abgründe - Unfassbare Verbrechen
  subtitle: Rätselhafte Spuren
  description: "Als Sandy Maloney aus Green Bay, Wisconsin, an einem Februarabend mit ihrer Mutter Lola telefoniert, deutet nichts darauf hin, dass es das letzte Gespräch der beiden ist. Am nächsten Morgen fährt Lola zum Haus ihrer Tochter und fällt vor Schreck fast in Ohnmacht: Es hat ein Feuer gegeben, alles ist zerstört, und Lola findet Sandys Körper in die Couch eingebrannt. Die Polizei versucht, irgendwelche Spuren zu finden, und zwei Ermittler machen sich auf den Weg, um Sandys Noch-Ehemann zu informieren. Sie kennen ihn gut, denn John Maloney ist ebenfalls Polizist. Hat der allgemein geschätzte John, der sich alleine um die drei Söhne kümmert, etwas mit Sandys Tod zu tun? \nDEU 2019"
  widescreen: true
- eventId: 784055
  start: 2026-10-31T17:20:00Z
  stop: 2026-10-31T18:15:00Z
  title: Abgründe - Unfassbare Verbrechen
  subtitle: Tödlicher Neid
  description: |-
    Für Krankenpflegeschülerin Michelle Le aus San Francisco ist es der letzte Tag ihrer Ausbildung. Die 26-Jährige hat sich immer gern um andere gekümmert und kann sich keinen schöneren Beruf vorstellen, doch sie erscheint nicht zur Abschlussfeier. Als eine Ausbilderin auf der Suche nach ihr ins Parkhaus geht, kommt ihr ein Van, der aussieht wie Michelles Auto, entgegengerast. Tage später gibt es immer noch kein Lebenszeichen, und Michelles Familie macht sich große Sorgen: Wurde sie entführt oder nimmt sie sich nur eine Auszeit? Dann gibt es endlich eine Nachricht - die alle in Panik versetzt.
    DEU 2019
  widescreen: true
- eventId: 784067
