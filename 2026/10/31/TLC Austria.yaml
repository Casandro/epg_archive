  title: Abgründe - Unfassbare Verbrechen
  subtitle: Blutiger Valentinstag
  description: "Gynäkologe Dr. John Hamilton ist ein hervorragender Arzt in Oklahoma City und hat es zu großem Ansehen und Reichtum gebracht. Als er an einem sonnigen Valentinstag von seiner Privatklinik nachhause kommt, findet er seine Frau Susan tot im Badezimmer. Sie wurde ermordet und liegt in einer Blutlache. Der Grad an Gewalt legt nahe, dass es sich hier nicht um einen missglückten Raubüberfall handelt, sondern dass Susan Hamilton gezielt umgebracht werden sollte. Doch wer wollte diese warmherzige, schöne und allgemein beliebte Frau töten? Die Ermittler tippen zunächst auf einen Mord aus Rache, da die Hamiltons auch eine umstrittene Abtreibungsklinik führten. \nDEU 2019"
  widescreen: true
- eventId: 784054
