  title: Car Trackers - Autodieben auf der Spur
  subtitle: Hinter dicken Mauern
  description: |-
    Von einem Baustoffhof wurde eine teure Maschine entwendet. Der Teleskoplader kostet rund 40.000 britische Pfund und kann tonnenschwere Lasten bewegen. Der Tracker sendet kein GPS-Signal, deshalb kommt im Südosten von London ein Hochfrequenz-Empfänger zum Einsatz. Damit muss Richard Taylor bis auf wenige hundert Meter an den Lader herankommen, um ihn exakt zu orten. Und das Rückholunternehmen "BackPedal" hat sich auf Fahrräder spezialisiert. Die Vollprofis suchen in dieser Folge mit einer Drohne Gärten und Balkone nach einem gestohlenen E-Bike ab.
    GBR 2025
