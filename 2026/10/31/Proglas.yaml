  start: 2026-10-31T04:57:00Z
  stop: 2026-10-31T05:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1031 - Přehodnocování (305. díl)
  description: ozněla. Strašně nerada chodím pozdě a strašně nerada nedodržuju termíny. Dokonce i ty, které jsem si stanovila sama. Každý další úkol jsem vnímala jako nežádoucí vyrušení, všechno, co nebylo bezprostředně nutné udělat ihned, jsem odkládala na později, až dokončím svou důležitou práci. Jenže život kolem mne nepřestával tepat.Bylo potřeba vařit, přijímat návštěvy, chodit na koncerty, setkávat se s lidmi. Minulý týden jsem odložila jednu schůzku, protože jsem myslela, že svou práci do pátku dokončím a pak budu mít kapacitu na jiné věci. Jenže jsem se zadrhla. Práci jsem nedokončila, a ještě mi kus zbývalo. Ovšem kamarádka, jejíž schůzku jsem minulý čtvrtek odložila na inu. Neměla jsem nejmenší chuť se s někým setkávat. Co mám dělat? Celá nesvá jsem chodila bytem, věci mi padaly z rukou a neměla jsem žádný nápad. S takovou náladou tu práci beztak dnes už nedokončím, dumala jsem. Když jsem nervózní, nemůžu nic dobrého napsat. Já na tu schůzku jít musím, vždyť jsem to slíbila. Ještě chvíli jsem váhala. Když jsem se shýbala pro šňůru nabíječky, která mi vyklouzla z ruky, praštila jsem se do hlavy o dřevěnou skříňku, jíž jsem si nevšimla. Tak dost.Kamarádce jsem napsala zprávu, že přijdu. Pak jsem se šla podívat do zrcadla, jestli budu mít na čele bouli. A potom mě napadlo, že je psáno, abychom měli druhého za přednějšího než sebe. Ulevilo se mi. A hned mě taky napadlo, jak v práci pokračovat. Přehodnocování je moc dobrým příkladem pokání, tedy změny myšlení.
