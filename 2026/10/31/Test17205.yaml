  title: Documentaires
  description: "Mangas, une révolution française Doc Portrait  Depuis l'avènement des westerns américains, aucune culture étrangère ne s'était à ce point imposée au pays d'Astérix. Alors que les jeunes de 18 ans consacrent les trois quart de leur Pass Culture aux mangas, ce film raconte comment la société française est passée en quatre décennies d'un rejet en bloc à une idylle totale. Et surtout, ce que cette fulgurante ascension dépeint de la France et de son rapport à sa jeunesse. \n (France-2023)"
