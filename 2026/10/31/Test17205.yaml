  title: Le Miracle Suisse
  description: Les révoltés On dit toujours que les Suisses sont sages, obéissants, respectueux des règlements, mais nous avons nos révoltés. Notre mythe fondateur est d'ailleurs celui de Guillaume Tell, un citoyen qui se révolte contre l'autorité ! Nous irons à la rencontre des personnes qui s'indignent et font dans la provocation, célèbres ou anonymes. Nous retrouverons Paolo Gilardi, qui était porte-parole du mouvement pour une Suisse sans armée et qui se souviendra de la votation historique de 1989, 37 ans après. Nous évoquerons des manifestations dans le Jura ou à Lausanne et nous écouterons nos chanteurs révolutionnaires. Le Miracle Suisse c'est ça, le poing levé, mais avec le sourire.  "Audio description"
  genre:
