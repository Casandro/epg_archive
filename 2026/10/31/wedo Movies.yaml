  title: Rapid Eye Movement
  subtitle: Detective / Thriller 2019, FSK 12
  description: '2019 ● FSK: 12 Der ziemlich bekannte Radiomoderator Rick Weider möchte seine Präsenz vergrößern und aus diesem Grund versucht er, einen neuen Weltrekord aufzustellen. Während des Versuchs wird er fast in den Wahnsinn getrieben, denn er will den Weltrekord im Wachbleiben brechen. Sein Ziel ist es, mindestens elf Tage wach zu bleiben, allerdings bekommt er überraschend einen mysteriösen Anruf, in dem ein Mann ihm droht, ihn zu töten, falls er einschlafen sollte. Detective / Thriller 2019, Regie: Peter Bishai,  Mit: François Arnaud, Reiko Aylesworth, Danny Ramirez, FSK 12'
