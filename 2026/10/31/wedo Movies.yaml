  title: Terror Birds
  subtitle: Science fiction / Fantasy / Horror 2016, FSK 16
  description: '2016 ● FSK: 16 Maddys Vater ist Ornithologe und daher oft allein in der Natur unterwegs. Als er von einem Ausflug im Wald nicht zurückkehrt, befürchtet Maddy, dass ihm etwas Schlimmes passiert ist. Gemeinsam mit ihren Freunden macht sie sich auf die Suche. Dabei geraten sie zufällig auf das Gelände eines Milliardärs, der riesige Urzeitvogel züchtet. Die Tiere sind blutrünstig und machen Jagd auf Maddy und ihre Freunde. Science fiction / Fantasy / Horror 2016, Regie: Sean Cain,  Mit: Jessica Lee Keller, Lindsey Sporrer, Greg Evigan, FSK 16'
