  title: Mezi námi
  description: 'Magazín o národnostních menšinách v Česku. Poslechněte si rozhovor Libora Kukala s Alesjou Marochovskou, šéfredaktorkou nezávislého ruského investigativního webu Važnyje istorii, který sídlí v Praze. Jana Šustová mluvila s novinářem a reportérem Viet Tranem o jeho rodině, o druhé generaci Vietnamců v Česku a také o vietnamské menšině na Slovensku. Lidija Stevanović si povídala se světoznámou srbskou operní pěvkyní Jadrankou Jovanović, která nedávno vystoupila v Praze. Moderuje: Tatiana Čabáková. Připravila: Tajana Mančalová.'
