  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (12/15) Část dvanáctá: Revoluce, úterý a středa 30. a 31. října 1956. V úterý 30. října se sovětská vojska začala stahovat a z Moskvy přišla deklarace uznávající principy rovnosti mezi socialistickými státy. Možná byla upřímná, z Budapešti ale přicházely do Moskvy znepokojivé zprávy: Nagyova vláda ukončila mocenský monopol komunistické strany a před budovou budapešťského ústředí strany se odehrál masakr třiadvaceti důstojníků tajné policie. Ve středu Moskva definitivně rozhodla: maďarskou revoluci je třeba rozdrtit silou. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
