  subtitle: Mein wunderbarer Kochsalon - Wiener Waller mit geräucherter Melanzani
  description: Loslassen ist nicht gerade meine Stärke, vor allem von meinen über die Jahre gepflegten Vorurteilen nehme ich nur schwer Abschied. So zum Beispiel der Waller. Die Aversion aufgrund einer mächtigen Erdigkeit im Geschmack wurde mir quasi in die Wiege gelegt, auch im elterlichen Haushalt kam der Waller nie auf den Tisch. Dank sorgsamer Züchter bekommt man nun Waller von außergewöhnlicher Qualität und selten habe ich so leicht mein Vorurteil versenkt. Bissen für Bissen sozusagen. Aber nicht nur auf das Produkt kommt es an, wenn man ein paar Tricks in der Zubereitung beachtet, wird der Waller zur echten Delikatesse. AT 2020
