  title: Mein wunderbarer Kochsalon - Geschnetzeltes vom Wildschwein mit Eierschwammerln
  subtitle: Mein wunderbarer Kochsalon - Geschnetzeltes vom Wildschwein mit Eierschwammerln
  description: Das Schöne an Wild ist, dass es nicht alltäglich ist. Das ist aber auch zugleich für viele der Stolperstein - der Respekt vor dem Ungewohnten übersteigt oft die Ambition, etwas Neues zu probieren. Dabei ist das Fleisch von Reh, Hirsch, Hase und Wildschwein mindestens so vielseitig wie jenes, das wir aus Zuchtbetrieben kennen. Auch in der Zubereitung gibt es nicht viele Unterschiede. Ich setze Wild gerne in klassischen Rezepten ein und bin jedesmal erstaunt, welchen erfreulichen Twist es geben kann. Wie zum Beispiel das Wildschwein im Geschnetzelten. Der Weg von einem vergleichsweise banalen Gericht zu einer echten Delikatesse. AT 2020
