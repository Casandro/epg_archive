  subtitle: Mein wunderbarer Kochsalon - Eierschwammerl-Omelett mit Thai-Basilikum
  description: Wenn der Stiegl Max aus Purbach in den Kochsalon kommt, wird es ungewöhnlich. Das war mir von Anfang an klar - Gespräche über Politik, Steuerreform und Herzinfarkt. Und dazu ein Omelett mit Currysauce. Hm, eigenwillig. Wenn man es dann probiert, fragt man sich, warum man es nicht immer so gegessen hat. Absolut empfehlenswert, das gilt auch für die Gespräche. Ein bisschen davon wurde dem Schnitt geopfert, aber es ist noch sehr viel da. Viel Spaß. AT 2017
