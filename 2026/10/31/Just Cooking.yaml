  title: Mein wunderbarer Kochsalon - Das ultimative Partybrot
  subtitle: Mein wunderbarer Kochsalon - Das ultimative Partybrot
  description: "Kürzlich lud Lilly zum TV-Dinner. Sie erzählte mir 30 Minuten vor Ankunft ihrer Gäste davon. \n\n\"Na, super. Und was willst du ihnen anbieten?\" \n\"Ganz egal, Mami, was auch immer dir einfällt.\"\n\"Ich glaube, du hast mich falsch verstanden. Ich sagte: Was willst DU ihnen anbieten?\"\n\"Mami, ganz ehrlich, ich komme gerade vom Reitstall, muss mir noch die Haare waschen und Vokabeln lernen. Ich habe jetzt wirklich keine Zeit zum Kochen.\"\nMir fehlten wieder einmal die Worte und ich fand mich resigniert vor meinem Kühlschrank stehen. Das Weißbrot war eigentlich fürs Frühstück gedacht, der Schinken und der Frischkäse auch, aber dann essen wir halt Cornflakes. Lilly stand mit wallendem Haar und roten Backen zwischen ihren Freundinnen und servierte mein Brot, als hätte sie (und nicht ich) in der letzten halben Stunde alles dafür gegeben. Soll sein. Der Fernseher fand übrigens kaum Beachtung. AT 2020"
