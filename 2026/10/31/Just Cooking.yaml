  title: Mein wunderbarer Kochsalon - Mini-Madeleines
  subtitle: Mein wunderbarer Kochsalon - Mini-Madeleines
  description: Als ich zum ersten Mal zum Tee bei meiner Schwiegermutter eingeladen war, gab es Madeleines. Gott, was war ich aufgeregt. Diese süßen, kleinen, ofenwarmen Köstlichkeiten halfen mir über die erste Unbeholfenheit, meine Schwiegermutter hat sich wahrscheinlich etwas gewundert, dass ich den halben Kuchenteller aufgegessen habe. Einerseits aus Nervosität, andererseits aber aus blanker Gier, so gut waren sie. Das Gebäck wurde angeblich im 18. Jahrhundert von der Köchin Madeleine am Hof des Herzogs von Lothringen gebacken, ich bin dankbar für ihr Vermächtnis. AT 2020
