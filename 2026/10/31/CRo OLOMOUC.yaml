  title: Hobby magazín
  description: Není vřes jako vřes, některý je vřesovec. Objasní nám to zahradnice Kateřina Baďurová. Také poradí, jak tyto rostliny úspěšně pěstovat a dokonce i to, jak vypěstovat vřes modrý. Vybrat pro svého psa správný obojek nebo postroj je velmi důležité. Jiný určitě potřebuje čivava a jiný retrívr nebo vlčák. Jaký zvolit materiál? Jsou i postroje na míru? Budeme se ptát zkušených cvičitelů psů z Polné na Vysočině. Zajímat nás bude výroba rámečků na fotky a obrázky, více informací pro vás připravil Zdeněk Truhlář.
