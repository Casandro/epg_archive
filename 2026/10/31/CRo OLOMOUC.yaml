  title: Mezi nebem a zemí
  description: Odkaz svatého Huberta je aktuální i v dnešní době. Tohoto patrona zbloudilých si připomeneme s Karlem Sladkým. Dvacet let sama bojovala se závislostí - dnes Nikola Kovářová z Charity Tábor pomáhá druhým jako peer konzultantka. Za svou záslužnou práci nyní získala prestižní Cenu Charity ČR. A čeká nás i pravidelné zamyšlení. Dnes je od Ivany Procházkové, superintedentky Evangelické církve metodistické.
