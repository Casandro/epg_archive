  description: |-
    Jona studiert im 5. Semester Tiermedizin an der LMU und steht kurz vor der OSCE-Prüfung - einer anspruchsvollen praktischen Prüfung. Besonders bei der Tierart Schwein fühlt sie sich noch nicht optimal vorbereitet. Im Skills Lab übt sie deshalb mit ihren Kommiliton:innen realistische Prüfungssituationen.
    Matthis studiert im 4. Semester Soziale Arbeit an der Evangelischen Hochschule Dresden. Bevor er an die Hochschule wechselte, studierte er zwei Semester an einer Universität und absolvierte ein Freiwilliges Soziales Jahr (FSJ) in der Jugendarbeit. Aktuell sammelt er im Praxissemester Erfahrungen in der mobilen Jugendarbeit.
