  title: Expedition in die Heimat
  subtitle: Die heile Welt am Appelbach
  description: 'Zwischen Nordpfälzer Bergland und rheinhessischer Schweiz liegt das Appelbachtal: so idyllisch, als wäre die Zeit dort stehen geblieben. Kleine Dörfer mit malerischen alten Höfen liegen zwischen Wiesen und Wäldern, Radfahrer und Wanderer erholen sich hier vom hektischen Getriebe der Städte, Kinder spielen noch auf der Straße. Von der Quelle bei Marienthal am Donnersberg bis zur Mündung in die Nahe bei Bad Kreuznach folgt Anna Lena Dörr dem Lauf des Baches, begegnet besonderen Menschen und Orten und forscht dabei nach der schmalen Grenze zwischen Schein und Wirklichkeit, zwischen der bloßen Fassade und der wahren heilen Welt.'
