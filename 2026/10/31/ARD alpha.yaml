  title: 'alpha-retro: Die Playboys kommen erst um Acht (1962)'
  subtitle: Gunter Sachs und Saint-Tropez
  description: Das kleine französische Fischerdorf Saint-Tropez war in den 60er- und 70er-Jahren der Nabel der reichen und schönen Welt in Europa. Corinne Pulver drehte 1962 für den BR diese Dokumentation über Männer, die dort in ihren Sportwagen und Cabrios flanierten - neben sich die dafür unverzichtbaren schönen Frauen. Hauptprotagonist ist, wie könnte es anders sein, Gunter Sachs, schon damals eine Berühmtheit in der Regenbogenpresse, lange vor seiner kurzen Ehe mit Brigitte Bardot.
