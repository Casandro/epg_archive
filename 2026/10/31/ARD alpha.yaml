  title: Die Sachsen - Piraten. Heiden. Kaiser
  subtitle: Deutschland 2024
  description: Die Geschichte der Sachsen ist ein Mysterium. Die Römer bezeichneten sie als Piratenvolk, das ihre Siedlungen mit Booten überfiel. Für Karl den Großen waren sie vor allem Heiden, Ungläubige, die er im achten Jahrhundert "mit dem Schwert missioniert". Aber dann gelingt den Sachsen das Erstaunliche - 160 Jahre nach Karl sitzt einer von ihnen, Otto der Große, auf dem Kaiserthron. Wie haben die Sachsen diesen Aufstieg geschafft? Und was ist überhaupt wahr an den Mythen über das "wilde Sachsenvolk"?
