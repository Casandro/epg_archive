  subtitled: true
  description: "Im Mittelpunkt der ersten Folge der zweiten Staffel \"Akutstation Psychiatrie\" steht ein junger Mann, der sich für eine Comic Figur hält. Tatsächlich leidet er unter einer schweren Psychose. Weil er in seinem Wahn eine Gefahr für sich selbst ist, wird er in ein Überwachungszimmer eingeschlossen. Auch, um ihn von den Reizen der Umwelt abzuschirmen, die ihn überfordern. Er selbst aber ist mit der Unterbringung nicht einverstanden.   \nAuch die magersüchtige Patientin aus der ersten Staffel taucht wieder in der Klink auf, weil ihre Erkrankung sie noch immer am Essen hindert."
