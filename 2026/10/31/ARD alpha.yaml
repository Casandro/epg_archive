  title: Mit dem Zug zu den Victoriafällen
  subtitled: true
  subtitle: Deutschland 2025
  description: 'Von der Küste Tansanias über Sambia bis zu den tosenden Victoriafällen in Simbabwe: eine Zugreise, die der Natur Südostafrikas ganz nahekommt - mit Einblicken in empfindliche Ökosysteme, auch abseits der Gleise. Durch weite Savannen, tropische Regenwälder und trockene Gebirgslandschaften - zu den Lebensräumen bedrohter Tier- und Pflanzenarten. Und zu Menschen, die mit Hingabe versuchen, ihr Naturerbe zu schützen und ihre Zukunft zu sichern.'
