  title: Mehr Frieden in Kopf und Kalender - Gregor Maria Hanke über Gebet, Gedankenchaos und kleine Rituale, die den Tag spürbar verändern
  description: 'Immer mehr Menschen suchen nach Routinen, die den Tag ordnen - und nach einem Halt, der tiefer reicht als reine Selbstoptimierung. In Eichstätt trifft Matthias Brender Bischof em. Gregor Maria Hanke (OSB), Benediktiner und erfahrener geistlicher Begleiter. Gemeinsam gehen sie einer Frage nach, die Christen seit Jahrhunderten bewegt und heute aktueller ist denn je: Wie lässt sich Glaube so leben, dass er den Alltag nicht überfordert, sondern trägt? Hanke nimmt mit in die Praxis eines geistlichen Rhythmus: Arbeit und Gebet werden nicht getrennt, sondern miteinander verbunden. Konkrete, sofort umsetzbare Impulse zeigen, wie das gelingt - Leerzeiten bewusst nutzen, ein Bibelwort "atmen", vor Aufgaben ein kurzes Gebet setzen, mit zerstreuten Gedanken freundlich umgehen und immer wieder zurückfinden. Dabei wird klar: Gott ist nicht nur im Kloster zu finden, sondern mitten im ganz normalen Leben. Eine Doku mit dem langjährigen Bischof über sein Leben, voller lebensnaher Tipps für alle, die Gott im Alltag entdecken wollen.'
  genre:
  - '35'
  widescreen: true
  hd: true
