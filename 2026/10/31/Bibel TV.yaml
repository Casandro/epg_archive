  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Ist es vorstellbar, sein bisheriges Leben aufzugeben, um als Familie im Kloster zu leben? Wie vereinbar sind Arbeit und Ruhe? Was haben ein Pfarrer und ein Gärtner gemeinsam? Und wie wirkt sich unsere Berufung auf die Welt aus? Würde ohne uns etwas fehlen? Pastor Johannes Ehrismann gibt Impulse dazu, ob und inwieweit Arbeit unseren Wert bestimmt.'
