  title: Luther heute
  subtitle: Annette Schavan - "Mit Luther zum Papst"
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als Botschafterin beim Heiligen Stuhl in Rom (2014-2018) hat Annette Schavan im Vorfeld des Reformations-Jubiläums 2017 die Schirmherrschaft der ökumenischen Pilger-Initiative "Mit Luther zum Papst" übernommen. Mit dem Auftakt auf dem Leipziger Katholikentag bereiten sich über 1000 Pilger, vor allem aus Ostdeutschland, auf eine Romreise vor, die ganz im Zeichen des ökumenischen Dialogs stehen wird. Der Film begleitet Annette Schavan und zeigt, wie engagiert sie mit ihren Impulsen zu Luther und dem Papst für die Gemeinschaft der Christen wirbt und welche große Chance sie für die Zukunft der Ökumene sieht.'
