  title: Moja bublina (43)
  subtitle: Tomáš Melich. Každý z nás má svoj svet, ktorý si stráži a chráni. Pre niekoho je to iba koníček, pre iného práca. A v niektorých prípadoch je to ešte oveľa viac.
  description: Primáš Tomáš Melich sa dostal k ľudovej hudbe a k súboru Hont ako pätnásťročný a v jeho prípade to bola láska na prvý pohľad. Bolo to v čase, keď sa tento súbor v Krupine ešte iba rozbiehal a zrejme aj vďaka tomu ho táto bublina naplno vtiahla. A drží ho dodnes. (2026)
