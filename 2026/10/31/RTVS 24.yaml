  title: Téma :24 (1000)
  subtitle: Dušičkový čas s Matejom Baránkom a hosťami. Špeciálne vydanie rozhlasovej relácie Dušičkový čas s Matejom Baránkom a hosťami o epidémii samoty, smútku a fenoméne života a smrti počas "Dušičiek".
  description: 'Téma: Epidémia samoty, smútku a fenomén života a smrti počas "Dušičiek". Hostia v štúdiu: prof. PaedDr. ThDr. MUDr. et MUDr. Jaroslav Maxmilián Kašparů, Ph.D., dr.h.c., uznávaný odborník v oblastiach psychiatrie, teológie a pedagogiky MUDr. Mária Jasenková, detská onkologička a priekopníčka detskej paliatívnej medicíny na Slovensku; spoluzakladateľka a riaditeľka neziskovej organizácie Plamienok Nahratý rozhovor: Prof. Ladislav Timuľák, PhD., celosvetovo uznávaný psychológ; odborník na spracovanie hlbokého smútku, uviaznutých emócií a tráum Moderátorom relácie je Matej Baránek. (2026)'
  genre:
  - '33'
