  title: Archiwista - odc. 11 (seria I, odc. 11) Dwa razy śmierć
  subtitle: Komendant zleca Zuzi zajęcie się drobnymi sprawami, w tym sprawą otrucia psa. Policjantka prosi o pomoc Henryka. Archiwista trafia do wsi, w której od wielu lat trwa konflikt między dwiema rodzinami.
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
    Występują: Henryk Talar, Paulina Gałązka, Mirosław Zbrojewicz, Rafał Mohr, Maria Gładkowska, Mateusz Kmiecik
    Zuza oświadcza Henrykowi, że komendant chce poprawić statystyki wykrywalności przestępstw i w związku z tym kazał jej zająć się nierozwiązanymi sprawami z ostatnich trzech miesięcy. Wśród nich jest dochodzenie w sprawie otrucia psa. Mikospostanawia pomóc koleżance i jedzie do wsi Wiskitki, w której mieszka Karol Lenartowicz, właściciel zabitego czworonoga. Od niego dowiaduje się, że wiele wskazuje, iż bestialskiego czynu dopuścił się jego sąsiad, Janusz Szostak.
