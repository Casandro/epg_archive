  title: Archiwista - odc. 12 (seria I, odc. 12) Zniknięcie starszej pani
  subtitle: Henryk i Zuza rozmawiają o sprawie notariuszki Hanny Boguckiej, która zaginęła pięć lat temu. Po zniknięciu kobiety przysłano żądanie okupu. Po pieniądze nikt nie przyszedł.
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
