  subtitle: Ojciec Lisickiego jest zachwycony Basią. Katia próbuje wyciągnąć od Góry pieniądze. Lekarz zaprasza ją do domu. Na dyżurze zespół Artura jedzie do starszej kobiety, która twierdzi, że źle się poczuła.
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Milena Dutkowska
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Lisicki po urodzinach ojca wpada z deszczu pod rynnę, bo senior okazuje się Basią zachwycony - i niemal gotów szykować synowi ślub. Katia znów próbuje wyciągnąć od Góry pieniądze - i to aż 30 tysięcy złotych, na studia w Hiszpanii. A lekarz "córkę" zaskakuje i zaprasza do swojego domu - nieświadomy, że ma do czynienia z niebezpieczną oszustką. Z kolei na dyżurze zespół Artura odpowiada na wezwanie do starszej kobiety, która twierdzi, że źle się poczuła, w co ratownicy jednak nie wierzą.
