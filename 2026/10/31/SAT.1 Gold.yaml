    Krimi, USA 1999
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 29.10.2026, 17:05 Uhr)
  description: |-
    Claude sollte im Krankenhaus den Weihnachtsmann spielen, und nun muss ihm Dr. Mark Sloan mitteilen, dass er Krebs und nur noch ein halbes Jahr zu leben hat. Kurz darauf erhält Steve Sloan den Hinweis, dass Claude in Wirklichkeit Andrew Bacevitch heißt und vor zehn Jahren aus dem Gefängnis ausgebrochen ist, wo er wegen Mordes an seiner Frau saß. Claude beteuert seine Unschuld: Er habe die Leiche nur gefunden. Vater und Sohn Sloan rollen den Mordfall noch einmal auf.

    Regie: Nancy Malone
    Drehbuch: Steve Brown, Burt Prelutsky
    Komponist: Lou Forestieri, Dick DeBenedictis
    Kamera: Frank Thackery

    Darsteller:
    Dick Van Dyke (Dr. Mark Sloan)
    Barry Van Dyke (Lt. Steve Sloan)
    Victoria Rowell (Amanda Bentley-Livingston)
    Charlie Schlatter (Dr. Jesse Travis)
    Joanna Cassidy (Madison Wesley)
    Joyce Brothers (Dr. Hazeltine)
    Scarlett Pomers (Judy)
    Marty Fortney (Bobby Joe Falwell)
    Evelyn Iocolano (Charlene)
