    Mark, Jesse und Amanda wirken bei einem Fernsehspot mit, in dem berühmte Fernsehköche ihre Lieblingsgerichte zubereiten. Obwohl die Starköche ein ausgeprägtes Ego pflegen, kann Fernsehboss Keith sie alle zur Teilnahme bewegen. Dann stirbt René, einer der Köche. Die Ermittlungen ergeben, dass seine geheime Gewürzmischung mit Jod versetzt war, das bei ihm eine tödliche allergische Reaktion hervorgerufen hat. Alles deutet auf einen der teilnehmenden Köche als Mörder hin.

