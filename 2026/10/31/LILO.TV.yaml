  title: So schmeckt die Welt - Andalusien
  subtitle: So schmeckt die Welt - Andalusien
  description: Eine kulinarische und kulturelle Expedition durch das Andalusien. Wer das pure, echte und reine Spanien erleben will ist in Andalusien genau richtig. Hier spürt man den Stolz, die Haltung, den Charakter und die Geschichte einer ganzen Nation. Nichts ist spanischer als Andalusien. Vom Schinken über den Sherry, den Brandy, die Hofreitschule und natürlich das typische spanische Essen. 45 Minuten Andalusien pur und man spürt die spanische Seele.
