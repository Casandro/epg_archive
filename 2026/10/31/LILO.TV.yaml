  description: Eine kulinarische und kulturelle Expedition durch das Allgäu. Das Allgäu ist mehr als Kühe, Almen und Käse, wenngleich diese Bilder und Themen alleine schon einen Ausflug wert sind. Das Allgäu ist aber vor allem Landschaft, Landschaft, Landschaft. Müsste man eine perfekte Bilderbuchlandschaft zeichnen müsste man nur die im Allgäu kopieren. Fertig ist das Postkartenmotiv. Alleine dieser Anblick befreit die Sinne.
