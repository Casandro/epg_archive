  title: Velká pohádka
  description: Janek z hory. Dobrácký pasák ovcí Janek z hory by se chtěl oženit, ale děvčatům ze vsi se nezdá být dost dobrý a tropí si z něj leda žerty. Nechá si však poradit, aby se vydal hledat nevěstu do světa. Podaří se mu získat takovou, která ho bude mít opravdu ráda? Napsal Jan Tůma, režie Zdeněk Kozák, natočeno v roce 1994. Účinkují David Kaloč, Filip Richtermoc, Andrea Traganová a další.
