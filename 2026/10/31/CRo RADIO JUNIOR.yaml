  title: Rozhlasová hra
  description: 'Návrat ztraceného syna aneb Korálky z dětství Julese Vernea. Návrat ztraceného syna aneb Korálky z dětství Julese Vernea: Jaké bylo mládí jednoho z nejvýznamnějších francouzských spisovatelů dobrodružné literatury? Příběh se odehrává v okolí francouzského přístavu Nantes v roce 1839. Dvanáctiletý Jules je normální chlapec, který sní o dobrodružstvích a dálkách. Jednoho dne si dodá odvahy, své sestřence slíbí hrst pravých korálů a v přestrojení nastoupí na loď, která právě odplouvá do Indie. Napsala: Jiří Bednář. Režie: Karel Weinlich. Natočeno v roce 2001. Účinkují: Hana Maciuchová, František Němec, Petr Pulc a další.'
