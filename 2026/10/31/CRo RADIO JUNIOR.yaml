  stop: 2026-10-31T18:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Lucie Lehká, veterinářka. Proč se v poslední době rodí více ježků na sklonku léta? Jak jim můžeme pomoci přežít? Nejen to si řekneme s paní doktorkou veterinářkou Lucií Lehkou, ale představíme i organizaci Naděje pro ježky, která pečuje o nemocné nebo zraněné ježky a dozvíme se, jak poznat kdy ježek odbornou pomoc opravdu potřebuje. Repríza pořadu.'
- eventId:
  - 690151
  - 693051
  start: 2026-10-31T18:50:00Z
  stop: 2026-10-31T19:00:00Z
  title: Hajaja
  description: Báchrobky 6/7 - Braunka. Báchrobky to jsou báchorky a povídačky ze hřbitovů a z popravišť. A taky první dušičkový Hajaja! Poslechněte si příběhy z tajuplných míst, na která vás zavede havran Krasomil. Potkáte tu první katyni, neposednou bludičku nebo příliš roztomilé strašidlo? Možná se chvílemi budete trochu bát, ale uvidíte, že všechny příběhy nakonec dobře dopadnou. Tak žádný strach! Sedm strašidelných pohádek napsal Lukáš Csicsely, dramaturgie Renata Venclová. Natočeno v roce 2023. Režie Bela Schenková. Vypráví Vasil Fridrich.
