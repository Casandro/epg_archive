  title: Velká pohádka
  description: Lesní babka. Chamtivý pan Holubička z Kounova se rozhádá s tkalcem Slukou o dva metry látky. Tkadlec si po nespravedlivém nařčení vzpomene na lesní babku. Ta vždycky trestala křivdy, které se dějí slušným lidem. Pomůže mu? Napsali Hana a Miloň Čepelkovi, režie Hana Kofránková, natočeno v roce 1990. Účinkují Ilona Svobodová, Ivanka Devátá, Jan Teplý a další.
