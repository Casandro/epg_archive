  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese fejeton Aleny Mornštajnové Když se Mars mine s Venuší. Čte Šárka Šildová. Studentka Divadelní fakulty JAMU Monika Ostrovská natočila dokument Příběh cihly. V pořadu o vášni pro sběratelství historických cihel hovoří i Ondřej Anton ze Stavební fakulty VUT, zakladatel Databáze historických cihel. Dvanáctou částí pokračuje četba z knihy Jany Soukupové Brněnské mordy. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Připomeneme si také 100. výročí narození klasického filologa Antonína Bartoňka.
