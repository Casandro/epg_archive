  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Sommer 1979. Fliegt der Fluchtplan der Familie Strelzyk auf? Mitten im Sperrgebiet stürzt ihr Ballon an der innerdeutschen Grenze ab. Gelingt es ihnen, von der Stasi unentdeckt zu bleiben?

    In panischer Angst erreichen sie ihr Auto und fahren nach Hause. Dort versuchen sie, ihren Alltag wieder aufzunehmen, als sei nichts geschehen. Doch längst hat die Stasi den abgestürzten Ballon im Wald gefunden. Die Lage spitzt sich zu.
    HD-Produktion
