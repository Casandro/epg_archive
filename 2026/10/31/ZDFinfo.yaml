  title: Ballonflucht aus der DDR
  subtitle: Der Plan
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    DDR, 1978. Zwei Familien halten die Repressionen des SED-Regimes nicht länger aus. Ihr waghalsiger Plan: Sie wollen mit einem selbst gebauten Heißluftballon in den Westen fliehen.

    Doch keiner von ihnen hat Erfahrung mit Luftfahrt. Und wie sollen sie unbemerkt an rund 800 Quadratmeter Stoff gelangen? In einem Staat, in dem die Stasi jeden Schritt der Bürger überwacht. Trotz aller Risiken wollen es die befreundeten Familien versuchen.
    HD-Produktion
