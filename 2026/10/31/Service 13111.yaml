  title: Geostorm
  description: "Europa ist extremen Wetterphänomenen ausgesetzt. Das weltumspannende Satellitensystem \"Dutch Boy\" könnte Abhilfe schaffen. Entworfen wurde es von dem US-Konstrukteur Jake Lawson (Gerard Butler). Die Satelliten können das Klima manipulieren und weitere Katastrophen vermeiden. Aber dem eigensinnigen Jake wird die Leitung entzogen. Seinen Posten übernimmt Jakes Bruder Max, der über ausgezeichnete Beziehungen in Politikerkreisen verfügt. Als die US-Regierung das System der internationalen Gemeinschaft zur Verfügung stellen möchte, kommt es zu Fehlfunktionen. Am gravierendsten sind die Folgen in Afghanistan, wo ein Dorf zu Eis gefriert. Max kontaktiert seinen Bruder, um das defekte Satellitennetzwerk zu prüfen. Jake reist zur Raumstation, von wo das System gesteuert wird. Gemeinsam mit der Kommandantin Ute Fassbinder (Alexandra Maria Lara) beginnt er die Fehlersuche. Doch die Zeit läuft davon. Denn neue Wetterkatastrophen könnten eine Kettenreaktion auslösen und einen verheerenden Geostorm verursachen.      \n\nNach seinen Drehbüchern für die \"Independence Day\"-Filme von Roland Emmerich schien niemand besser geeignet als Dave Devlin auf dem Regiestuhl des Katastrophenthrillers \"Geostorm\". Spannung erzeugt sein Kinodebüt durch spektakuläre Spezialeffekte (so wird Hongkong komplett zerstört und Rio de Janeiro zum Teil eingefroren), aber auch wegen der vielschichtigen Handlung. Der Protagonist Jake Lawson (dargestellt von Actionstar Gerard Butler) muss als genialer Wissenschaftler nicht nur die Welt retten, sondern auch eine Politik-Verschwörung auf höchster Ebene entlarven. Alexandra Maria Lara interpretiert die Kommandantin Ute Fassbinder. In Nebenrollen Ed Harris und Andy Garcia.\nThriller, Vereinigte Staaten Von Amerika 2017, R: Dean Devlin"
  widescreen: true
- eventId:
  - 656141
  - 714541
  start: 2026-10-31T21:10:00Z
  stop: 2026-10-31T23:30:00Z
  title: 'Terminator: Dark Fate'
  description: |-
    Buchstäblich in letzter Sekunde konnte Sarah Connor (Linda Hamilton) verhindern, dass die Menschheit durch einen Atomkrieg ausgelöscht wurde. Der Sieg über das Computersystem Skynet mit seinen Cyborg-Killermaschinen hatte jedoch einen hohen Preis. Ihr Sohn John wird wenig später von einem Terminator getötet. Der brutale Mord hat aus Sarah eine erbarmungslose Terminator-Jägerin gemacht. Im Jahre 2020 ist erneut eine dieser Killermaschinen aus der Zukunft auf die Erde geschickt worden. Terminator Rev-9 hat den Auftrag, Dani Ramos zu eliminieren. Die junge Mexikanerin ist dazu bestimmt, die neue Anführerin im Kampf gegen die Maschinen zu sein. Für ihren Schutz soll die durch Implantate hochgezüchtete Soldatin Grace sorgen. Grace kann aber nicht verhindern, dass Rev-9 Danis Familie ermordet. Bevor er auch Dani tötet, gelingt es jedoch Sarah, Rev-9 teilweise kampfunfähig zu machen. Sarah bekam zuvor einen Hinweis auf die Ankunft des Terminators. Das kämpferische Frauentrio Dani, Grace und Sarah ist von nun an einer erbarmungslosen Verfolgungsjag ausgesetzt.

    "Terminator: Dark Fate" von Tim Miller ("Deadpool") ist der sechste Film der höchst erfolgreichen Terminator-Reihe, für den Erfolgsregisseur James Cameron als Produzent zu seinen Wurzeln zurückkehrte. Wie bereits in den Vorgängerfilmen bilden die Kämpfe zwischen Menschen und Maschinen die Höhepunkte des spannenden Zukunfts-Thrillers. Mit dabei ist erneut Linda Hamilton, die schon beim ersten "Terminator" als Sarah Connor zu sehen war. Einen - wenn auch späten - Auftritt hat Arnold Schwarzenegger in der Rolle des Terminators Carl.
    Thriller, Vereinigte Staaten Von Amerika 2019, R: Tim Miller
