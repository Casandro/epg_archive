  title: Geniale Technik
  subtitle: Das größte Löschflugzeug der Welt
  description: |-
    Waldbrände gehören zu den größten Bedrohungen der Menschheit. Sie zerstören Häuser und gefährden die Bevölkerung. In den letzten Jahren haben Waldbrände auf allen Kontinenten ein Ausmaß erreicht, dem Feuerwehren vom Boden aus machtlos gegenüberstehen. Doch eine Gruppe Luftfahrtingenieure unter der Leitung des ehemaligen Feuerwehrmanns Dan Reese hat Waldbränden den Kampf angesagt: mit dem größten Löschflugzeug der Welt! Der einzigartige Jumbojet ist für die Bekämpfung von Großflächenbrände bestens ausgerüstet. Innerhalb von dreizehn Sekunden kann er über 400 Ladungen Lösch-Mittel abwerfen, was einer Füllmenge von 400 Badewannen entsprechen würde. So entstehen Barrieren, die die weitere Ausbreitung der Brände verhindern. Die Flügelspannweite des Flugzeugs ist größer als ein Fußballfeld breit ist. Die vier Turbinen entwickeln jeweils eine Schubkraft von 290 Kilo-Newton. In voller Geschwindigkeit erreicht die Maschine bis zu 965 Kilometer pro Stunde. Sie gelangt zu jedem Einsatzort der Erde innerhalb von 20 Stunden. Für die Feuerwehr-Kräfte am Boden ist das Löschflugzeug eine wichtige Unterstützung.
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Tom Weller
  genre:
  - '144'
  widescreen: true
