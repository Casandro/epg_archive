  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Wie im Himmel so auf Erden
  description: "Glastonbury in England ist an einem besonderen Ort erbaut worden. Denn unter den Stadtstrukturen erstreckt sich eine Sternenkarte, die gigantischen Ausmaßes ist. Bekannt geworden ist diese Formation als Glastonbury Zodiac: Antike Erdhügel und Aufschüttungen, Flüsse, und Erdbauten stellen astrologische Bilder dar. Haben frühere Zivilisationen mit diesen Bauten Botschaften an ihre Nachfahren hinterlassen? \nEinst sollten diese Bauten der Kommunikation mit den Göttern dienen, aber waren es nicht eher gut sichtbare Zeichen für Außerirdische? Oder könnten diese Bauten womöglich von Außerirdischen für die Menschen der Gegenwart hinterlassen worden sein?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2019"
  genre:
  - '144'
  widescreen: true
- eventId: 667713
  start: 2026-10-31T08:50:00Z
  stop: 2026-10-31T09:48:00Z
  title: Faszination Weltall
  subtitle: Die Sonne
  description: "Eine Reise durch das Zeitalter der Sterne: von den Blauen Riesen, die das Universum zum ersten Mal erleuchteten, bis zu den Roten Zwergen, die noch Billionen von Jahren nach dem Erlöschen unserer eigenen Sonne leuchten werden! Jahrzehntelang stellten Sterne die Wissenschaft vor Rätsel. So können etwa lang gehegte Fragen zur Sonne erst jetzt dank neuer Technologien beantwortet werden. \nDie Raumsonde Parker Solar Probe stellt eines der kühnsten Vehikel der NASA dar. Sie hat die Erde verlassen, um zur Sonne zu reisen und deren gewaltige Atmosphäre zu erleben. Dank modernster Computertechnik können Wissenschaftler nun visualisieren, wie sich das kosmische Netz bildete, das an großen Knotenpunkten so dicht wurde, dass die ersten Sterne im Universum geboren wurden. Diese brachten neues Licht in ein Universum, das seit seiner Entstehung im Dunkeln existiert hatte. \nDie Menschheit kann ihren Ursprung bis zu diesen ersten Sternen zurückverfolgen. Denn in diesen Sternen wurden die Atome geschmiedet, aus denen wir Menschen bestehen: vom Eisen in unserem Blut bis zum Sauerstoff, den wir atmen. Doch die Sterne sind nicht unsterblich. In ferner Zukunft wird eine Zeit kommen, in der das Universum wieder in Dunkelheit versinken wird.\nDokumentarfilm, Vereinigtes Königreich 2021, R: Poppy Pinnock"
  genre:
  - '144'
  widescreen: true
