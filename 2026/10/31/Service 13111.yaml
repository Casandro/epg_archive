  title: Sternstunde der Mörder
  subtitle: Teil 2
  description: "Um den gesuchten Serienmörder zu schnappen, wollten die Ermittler Jan Morava (Jonas Nay) und Erwin Buback (Nicholas Ofczarek) ihm eine Falle stellen. Doch die Lockvogelaktion missglückte, der Täter konnte entkommen. Dennoch ist es gelungen, seine Identität festzustellen. In der Wohnung des Killers finden die Beamten aber nur Hinweise auf seine Flucht. Als die tschechische Polizei durch die Gestapo entwaffnet wird, scheint die Jagd nach dem Mörder fast unmöglich. Doch Morava und Buback geben nicht auf und scheinen ihm dicht auf den Fersen, als der Prager Aufstand ausgerufen wird. Im Chaos der Unruhen eilt Morava zum belagerten Stadtfunk, um der tschechischen Polizei gegen die NS-Besatzer beizustehen. Während dort ein Feuergefecht ausbricht, versucht Buback Marleen Baumann (Jeanette Hain) aus der Stadt zu bringen. Doch dafür muss er sich auf eine riskante Mission einlassen. \n\n\"Sternstunde der Mörder\" ist die packende Verfilmung des hochgelobten Romans vom tschechischen Altmeister Pavel Kohout, der mit seinem Werk nicht nur einen fesselnden Kriminalroman, sondern auch eine hintergründige Parabel über die Mechanismen von Gewalt, Mord und Hass schuf. Unter der Regie von Christopher Schier (\"Die Ibiza-Affäre\", \"Der Pass\") brillieren Österreichs Schauspielstar Nicholas Ofczarek in der Rolle des undurchsichtigen Erwin Buback und Jonas Nay als Jan Morava, an ihrer Seite agieren u.a. Jeanette Hain, Devid Striesow und Gerhard Liebmann. Die hochkarätigen Bilder lieferte der mit dem Grimme-Preis ausgezeichnete Kameramann Philip Peschlow (\"Der Pass\", \"Hagen - Im Tal der Nibelungen\").\nKrimi, Österreich 2025, R: Christopher Schier"
  widescreen: true
