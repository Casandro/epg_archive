  description: "* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Horrorliteratur aus Grimma\nSie haben es sicherlich schon gesehen: Die Schaufenster der Geschäfte und Supermärkte hängen voller Spinnweben und überall schweben Gespenster herum. Es ist die Zeit des Gruselns, des Horrors, kurz: Es ist Halloween. Es soll die Zeit im Jahr sein, in der der Vorhang zur Anderswelt besonders dünn ist und Monster könnten in unsere Welt kommen. Es gibt zahllose Geschichten über Werwölfe, Vampire, Dämonen und so weiter. Solche Geschichten erscheinen auch im Buchheim Verlag. Obwohl der kleine Verlag vor gerade mal gut 10 Jahren in Grimma gegründet wurde, erscheinen dort internationale Stars. Thilo Sauer war zu Besuch und stellt uns die Geschichte vor.\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 1926 Harry Houdini gestorben\nHarry Houdini gilt bis heute als der berühmteste Zauber- und Entfesselungskünstler der Welt. Mit spektakulären Kunststücken und lebensgefährlichen Auftritten begeisterte er Millionen Menschen und wurde schon zu Lebzeiten zur Legende. Ironischerweise war es kein waghalsiger Stunt, sondern die Folgen eines Blinddarmdurchbruchs, die ihn das Leben kosteten. Heute vor 100 Jahren starb Harry Houdini. Dirk Böhling erinnert an ein außergewöhnliches Leben.\n\n* 14:00 Uhr - Nachrichten\n\n* 14:15 Uhr - Große Fragen: Wie ist unser Immunsystem entstanden?\nEs geht wieder los. Es ist Grippezeit. Keine Angst, es gibt ja die Grippeschutzimpfung, die nicht immer auf den Punkt ist, die aber uns auf das Gröbste vorbereitet. Und dann ist da ja noch unser Immunsystem. Das kennt zwar den aktuellen Erreger noch nicht, aber Grippeviren sind grundsätzlich keine Unbekannten. Die meisten von uns können  darauf vertrauen, dass die Kombi Impfung und Immunsystem uns einigermaßen durch  die infektiöse Rush-Hour bringen wird. Und mit der einen oder anderen Erkältung wird unser Schutzschild ja locker fertig, auch wenns manchmal nervt: Fieber, Husten, laufende Nase. Wissenschaftsjournalist Karsten Möbius findet, das ist jetzt eigentlich mal ne gute Gelegenheit zu fragen, was unser Immunsystem so eigentlich alles drauf hat und wie es zu dem geworden ist, was es heute ist. \n \n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Silbersalz-Festival: Mythos Schlaf\nSchrittzähler, Kalorien-Apps und jetzt auch noch die minutengenaue Überwachung im Bett: Der Optimierungswahn macht vor unserer Nachtruhe nicht halt. Aber schlafen wir wirklich besser, wenn wir uns per App kontrollieren, morgens um fünf aus den Federn quälen und abends Melatonin-Gummibärchen naschen? Oder schlaffen wir dadurch eher ab? Beim Silbersalzfestival in Halle, bei dem es noch bis zum Sonntag rund um das Thema Gesundheit geht, wird natürlich auch von Experten über den Schlaf geredet. Mehr zum \"Mythos vom perfekten Schlaf\" nun von Anne Sailer.\n\n* 15:00 Uhr - Nachrichten\n\n* 15:15 Uhr - Tagung: \"Leerstellen\" an der MdbK Leipzig\nIm Leipziger Museum der bildenden Künste MdbK ist derzeit eine Ausstellung zu sehen die die jüdischen Kunstmäzene von einst in den Blick nimmt - wer waren sie? Was haben sie gesammelt und was wurde aus den Sammlungen?  Denn ohne diese Menschen würde heute auch im Leipziger Museum manch eine kostbare Grafik, Bilder von Kirchner, Schmidt-Rottluff, Max Klinger, Skulpturen von Rodin - nicht zu sehen sein. Eine Tagung hat sich nun mit der Frage beschäftigt: Wo sind die Leerstellen? Ob in der Forschung oder in den Sammlungen.\n\n* 15:30 Uhr - Wetter & Verkehr"
