  title: MDR KULTUR am Vormittag
  description: |-
    * 09:40 Uhr - Wort zum Tag mit Andrea Wilke

    * 09:50 Uhr - Kulturtipps

    * 10:00 Uhr - Nachrichten

    * 10:15 Uhr - Der Stichtag: 1901 Margarete Buber-Neumann geboren
    Sie wurde als Opfer der stalinistischen Säuberungsaktionen in der UdSSR in einem sowjetischen Straflager interniert, ab 1940 sperrten sie die Nazis in das Konzentrationslager Ravensbrück. Eine leidvolle, jahrelange Erfahrung, die die ehemalige Kommunistin bewog, nach dem Zweiten Weltkrieg vehement gegen jede Form von Diktatur einzutreten. Die Publizistin Margarete Buber-Neumann wurde heute vor 125 Jahren geboren. Der Stichtag. Von Thomas Hartmann.

    * 10:30 Uhr - Kultur Kompakt mit Wetter & Verkehr

    * 10:40 Uhr - Zum 10. Todestag von Manfred Krug
    Am 21. Oktober, jährt sich der  Todestag von Manfred Krug  zum zehnten Mal. Und noch ein weiteres Datum in diesem Herbst ist eng mit seinem Namen verbunden - nämlich die Ausbürgerung Biermanns. Im November ist das 50 Jahre her. Und wie für so viele andere auch, war sie auch für Manfred Krug eine Zäsur. Mit seinem zum Bestseller gewordenen Tagebuch "Abgehauen" erzählt Krug diese Geschichte, deren Ende Krugs Übersiedlung in den Westen Deutschlands bedeutet. Kein ganz fremdes Terrain für Manfred Krug.

    * 10:50 Uhr - Das Gedicht: "Vergessene Stadt" von Heinz Czechowski
    Unter Lyrik-Lesern war Heinz Czechowski immer viel mehr als ein Geheimtipp. Seine in den DDR-70igern erschienenen Gedichtbände fielen bereits durch ihre Titel auf: "Ich und die Folgen" oder "Ich, beispielsweise". Dass einer hemmungslos von sich selbst spricht, war im "real existierenden Sozialismus" eigentlich vollkommen ungewöhnlich. Doch der subjektive Blick blieb das Markenzeichen des 1935 in Dresden geborenen Dichters - bis zu seinem stillen, fast unbemerkten Tod am 21. Oktober 2009 in Frankfurt am Main. Aus seinen Gedichten liest Thomas Thieme.

    * 11:00 Uhr - Nachrichten

    * 11:15 Uhr - Feuilleton
    Von Wolfgang Schilling

    * 11:30 Uhr - Kultur Kompakt mit Wetter & Verkehr

    * 11:45 Uhr - Vorschau Folk und Welt: Bebel Gilberto - "Tanto Tempo"
    "Tanto Tempo" ist ein legendäres Album der brasilianischen Bossa-Nova-Sängerin Bebel Gilberto. Produziert wurde es von Suba, der 1990 aus Jugoslawien nach Brasilien emigriert war. Vorher war er in Novi Sad ein innovativer Soundtüftler und Produzent erfolgreicher New Wave Bands. Suba ist aber leider nach dem Versuch, das gerade fertiggestellte Album beim Brand seines Studios in Sao Paulo zu retten, an einer Rauchgasvergiftung gestorben. Das war 1999. Letztes Jahr erschien eine remasterte Ausgabe zum 25-jährigen Jubiläum von "Tanto Tempo" - sie enthält einen bisher unveröffentlichten Titel sowie Texte und Fotos. Ein Meisterwerk, das in keiner Plattensammlung fehlen darf, sagt Grit Friedrich. Vor wenigen Tagen erschien das Werk zum ersten Mal auf Vinyl. Mehr davon heute Abend bei Folk und Welt, ab 21:00 Uhr.
  subtitle: Philosophie, Religion, Kulturgeschichte
