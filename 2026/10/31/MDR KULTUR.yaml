  description: "* 06:00 Uhr - Nachrichten\n\n* 06:15 Uhr - PODCAST Bachkantate\n\n* 06:30 Uhr - Bach-Kantate (Folge 64)\nReformationsfest: Johann Sebastian Bach: Ein feste Burg ist unser Gott BWV 80\nJoanne Lunn, Sopran, William Towers, Alt, James Gilchrist, Tenor, Peter Harvey, Bass\nMonteverdi Choir, The English Baroque Soloists\nJohn Eliot Gardiner\n\n* 07:00 Uhr - Nachrichten\n\n* 07:15 Uhr - Wort zum Tag\n\n* 07:45 Uhr - Wortschätze: \"Können Ideen die Welt verändern?\" von Charles Pépin\nKann ich das Verhalten anderer Menschen ändern? Muss ich ab und zu die Ellenbogen einsetzen, um erfolgreich zu sein? Wie treffe ich bessere Entscheidungen? Und muss ich vergessen können, um glücklich zu werden? Leben bedeutet Fragen stellen. Indem wir uns selbst befragen, prüfen wir unser Verhalten und unser Verhältnis zur Welt. Charles Pépin stellt solche Lebensfragen. Seine Antworten sind lebensnah und schöpfen aus der Geschichte der Philosophie - nachzulesen in dem im Hanser Verlag erschienen Band \"Wie also glücklich sein?\"\nCharles Pépin, geboren 1973, ist Schriftsteller und Philosoph. In einer wöchentlichen Sendung bei Radio France beantwortet er die existenziellen Fragen seiner Zuhörerschaft. Seine Bücher wurden in mehr als zwanzig Sprachen übersetzt. \nAus seinen philosophischen Anregungen für ein besseres Leben liest Oscar Hoppe.\n\n* 08:00 Uhr - Nachrichten\n\n* 08:05 Uhr - Weltgeschichte zum Reformationstag\n\"Herr Käthe\", \"hochgelahrte Doktorin\" oder \"hohe Frau von Zöllsdorf\": Das waren die Spitznamen des Herrn Gemahls, Martin Luther, für seine außergewöhnliche Ehefrau, die schon einiges darüber aussagen, wer zuhause in Wittenberg das Regiment inne hatte. Tatsächlich war es Katharina von Bora, die das \"protestantische Pfarrhaus\" als kulturgeschichtliche Institution in gewisser Weise begründete. Aber sie war so viel mehr als das. Was Martin Luther seiner Käthe alles zu verdanken hat, erzählt MDR Kultur-Autor Hartmut Schade in unserem Podcast \"Weltgeschichte vor der Haustür\". Es spricht Conny Wolter. \n\n* 08:30 Uhr - Wetter & Verkehr\n\n* 08:45 Uhr - Der Stichtag: 1926 Harry Houdini gestorben\nHarry Houdini gilt bis heute als der berühmteste Zauber- und Entfesselungskünstler der Welt. Mit spektakulären Kunststücken und lebensgefährlichen Auftritten begeisterte er Millionen Menschen und wurde schon zu Lebzeiten zur Legende. Ironischerweise war es kein waghalsiger Stunt, sondern die Folgen eines Blinddarmdurchbruchs, die ihn das Leben kosteten. Heute vor 100 Jahren starb Harry Houdini. Dirk Böhling erinnert an ein außergewöhnliches Leben.\n\n* 09:00 Uhr - Nachrichten\n\n* 09:15 Uhr - Pfarrer mit Reichweite: Justus Geilhufe\nAm Reformationstag erinnert die evangelische Kirche an eine Bewegung, die auch eine Mediengeschichte war: Flugschriften und Buchdruck trugen Luthers Ideen und damit den Protestantismus weit über Wittenberg hinaus. Gut 500 Jahre später nutzt der sächsische Pfarrer Justus Geilhufe die Medien seiner - also unserer - Zeit: Instagram (33.000 Menschen folgen ihm dort derzeit), Podcasts und digitale Glaubensangebote. Justus Geilhufe ist Pfarrer in Großschirma bei Freiberg - und erreicht dadurch Menschen weit über seine Gemeinde hinaus. Vor allem seine Kindheit in einem Dresdner Pfarrhaus hat ihn stark geprägt, und seine Professoren: erst beim Studium in Jena und Princeton, später in München. Wenn Justus Geilhufe über Ostdeutschland spricht, dann fällt sein Urteil deutlich, für manche sogar hart, aus."
