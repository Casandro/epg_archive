  title: Evangelischer Gottesdienst aus St. Nicolai in Quedlinburg
  description: "Wir übertragen nun einen evangelischen Gottesdienst zum Reformationstag aus der St. Nikolaikirche in Quedlinburg.\n\nPredigt und Liturgie liegen in den Händen von: Pfarrerin Franziska Junge und Pfarrer Dr. Tobias Gruber. \nAls Sprecher wirken mit: Daniela Jank, Andreas Götz und Marwen Sewerin.\n\nSie hören den Harzer Gospelchor \"Hearts wide open\" und Band, unter der Leitung von Kirchenkreiskantor Olaf Engel. \n\nDie kirchliche Leitung hat die Rundfunkbeauftragte der Evangelischen Kirche in Mitteldeutschland: Pfarrerin Juliane Baumann."
