  description: "* 11:00 Uhr - Nachrichten\n\n* 11:15 Uhr - Die Etrusker - im smac\nSeit Jahrhunderten versuchen Archäologen aus aller Welt, die Rätsel der Etrusker zu entschlüsseln. Woher kam dieses Volk, das lange vor dem Aufstieg Roms eine hochentwickelte Kultur und ganz eigene Religion entwickelte und in der Frauen ungewöhnlich sichtbar waren. Noch immer bringen Ausgrabungen in Italien neue Erkenntnisse ans Licht. Wer sich auf den neuesten Stand der Forschung bringen und seine Italienlust wecken oder stillen möchte, kann das jetzt im smac, im Sächsischen Museum für Archäologie in Chemnitz tun. Dort begegnet man jetzt  - nach der erfolgreichen Pompeij-Ausstellung - den Etruskern. \"Götter, Gräber und Gelage\" nennt sich die neue Ausstellung im Untertitel. Rund 250 Originalobjekte aus italienischen Museen sind dafür nach Sachsen gereist. Und nicht nur Heike Schwarzer war begeistert. \n\n* 11:25 Uhr - Lachmesse Andreas Rebers \nEs ist ernsthaft lustig diese Woche in Leipzig! Noch bis morgen läuft die 36. Lachmesse - mit rund 70 Künstlern und Acts an etwa einem Dutzend Spielstätten. Die Mischung ist bunt: bissiges Politkabarett, schräge Comedy, musikalische Einfälle, literarischer Humor und spektakuläres Varieté. Dazu kommen neue Gesichter, ungewöhnliche Formate und natürlich die eine oder andere Überraschung. Da kann man sich schon mal verzetteln zwischen all den Programmen und Spielorten. Aber keine Sorge: Satireredakteurin Ilka Hein übernimmt die Vorauswahl und präsentiert die ganze Woche lang jeden Tag einen Geheimtipp. Für alle, die gern lachen, gern Neues entdecken und sich auch mal überraschen lassen - heute mal  von Kammermusik mit Humorfaktor.\n\n* 11:30 Uhr - Wetter & Verkehr\n\n* 11:45 Uhr - MDR Kulturtipps\nVon Jörg Schieke\n\n* 11:50 Uhr - Vorschau: DISKURS Günter de Bruyn\nJetzt der Blick aufs Programm, das heute Abend an den Geburtstag des Schriftstellers Günter de Bruyn erinnert. Morgen jährt er sich zum 100. Mal. Und es gibt durchaus Neuigkeiten zu berichten. Dass Günter de Bruyn am liebsten ganz für sich war, das wusste man aus seinen autobiografischen Büchern - in seinem Refugium an der Blabber, in der Nähe von Beeskow. Dorthin zog sich der einstige Neulehrer und Bibliothekar seit Ende der 1960er Jahre zurück, um sich ganz seiner eigentlichen Profession zu widmen: dem Schreiben. In der Abgeschiedenheit der \"Alten Schäferei\" entstanden die \"Märkischen Forschungen\", die Romane \"Preisverleihung\" und \"Neue Herrlichkeit\" sowie Essays zu Kunst- und Kulturgeschichte Preußens und Brandenburgs. Neben seinem veröffentlichten Werk aber hinterließ Günter de Bruyn etwa 100 Aktenordner mit Manuskripten, Typoskripten und Materialsammlungen. Bearbeitet wird dieser Nachlass von der Literaturwissenschaftlerin und Herausgeberin Carola Wiemers.\n\n\nAktuelle Empfehlungen für das Wochenende. \n\nModeration: Ben Garit Hernandez"
