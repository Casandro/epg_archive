  title: MDR KULTUR Café mit Sven Regener
  description: "Neben seiner Arbeit als Schriftsteller ist Sven Regener auch Frontmann der Band Element of Crime. Mit seinen Büchern und seiner Musik zählt der geborene Bremer zu den bekanntesten deutschen Künstlern der Gegenwart. Besonders populär ist sein Roman \"Herr Lehmann\", in dem er humorvoll das Leben eines jungen Mannes im Berlin der 80er-Jahre beschreibt. \n\nAuch sein neuer Roman \"Frankie und Freddie\" spielt in den 80ern, in West-Berlin. Zwei Brüder versuchen, in der Großstadt ihren eigenen Weg zu finden. Gleichzeitig rücken die Weihnachtstage bedrohlich näher - und damit womöglich die Rückkehr zu den Eltern in die Provinz. \n\nRedaktion für MDR KULTUR Gabriele Bischoff"
