  title: Zur Feier des Tages - Reformation
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kommissar Sörensen, endgültig in die friesische Provinz gezogen, leidet unter Einsamkeit, Schlaflosigkeit und innerer Unruhe - und will dennoch nichts mehr, als die Medikamente gegen seine Angststörung abzusetzen. Da überfährt er des Nachts auf der Landstraße beinahe eine junge, verstörte Frau: unterernährt, im Nachthemd und blind. Als sie Sörensen endlich ihre Identität verrät, eröffnet sich ihm ein Geflecht aus Mord, religiösem Wahn und gut gehüteten Geheimnissen. Sörensen ist überfordert, von der Situation, von sich selbst. Der Ort lehnt ihn ab, die Angst kehrt zurück - und bei einer Leiche wird es nicht bleiben.'
