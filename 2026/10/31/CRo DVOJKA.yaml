  title: Hra na sobotu
  description: 'Nikolaj Vasiljevič Gogol: Ženitba. Slavná komedie o jedněch námluvách aneb Historka zcela neuvěřitelná. Přeložil Bohumil Mathesius. Rozhlasová úprava a dramaturgie Dalibor Chalupa. Režie Jiří Vasmut. Účinkují: Dana Medřická, Jaroslava Vacková, Ilona Hodačová, František Filipovský, František Kreuzmann, Jaroslav Seník, Miroslav Horníček, Jaroslav Seník, Miroslav Horníček, Emil Bolek, Václav Trégl, Jana Vasmutová a Bohumil Semerák. Natočeno v roce 1950 (65 minut). Repríza.'
