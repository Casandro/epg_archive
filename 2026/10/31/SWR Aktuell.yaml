  description: "12:00\nAktuelles & Sport\n\n12:30     \nSWR Kultur Das Wissen\nBürger beteiligen - Was für eine Demokratie wollen die Bürger?\nBürgerbeteiligung stärkt die Zufriedenheit mit der Demokratie - das zumindest legen Studien nahe. Wieviel direkte Demokratie wünschen sich die Menschen? Wann akzeptieren sie Großprojekte, wann nicht? Und wie kann der Zielkonflikt gelöst werden: Wenn Bürgerbeteiligung für die Demokratie so wichtig ist - wie passt das zusammen mit dem Ziel, Verfahren zu beschleunigen und zu entbürokratisieren? Professor Frank Brettschneider erforscht an der Universität Hohenheim politische Kommunikationsprozesse und ihre Wirkung. Gábor Paál spricht mit dem Kommunikationswissenschaftler Frank Brettschneider.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n13:00 \nARD Interview der Woche ~ \nLissy Kaufmann im Gespräch  mit Josef Schuster, Präsident des Zentralrats der Juden in Deutschland\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nMAFIA LAND\nKoks und Küsschen: Narco Traffico - Das Kokain-Netzwerk \nEr war einer der meistgesuchten Kriminellen der Welt: Der Kokainbroker Maluferru. Er hat jahrelang mit Bacetto zusammengearbeitet. In dieser Folge erzählen wir, wie die italienische ' Ndrangheta ihren Kokainhandel aufbaut, wie komplex und skrupellos das Geschäft abläuft, mit welchen Tricks das Kokain über die europäischen Grenzen geschmuggelt wird und warum es ein mafiöses System unterstützt, wenn man sich auf der Party eine \"Line\" zieht.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n14:30 \nARD Klima Update \nE-Auto-Boom -  was Du vor dem Kauf wissen solltest\nE-Autos werden immer beliebter. Im September war bereits jede dritte Neuzulassung ein reiner Stromer. Doch was muss ich wissen, bevor ich mir ein E-Auto anschaffe? Und wie kann ich mit diesem mobilen Batteriespeicher seit Neuestem auch noch Geld verdienen? Stichwort: ARD Klima Update.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/"
