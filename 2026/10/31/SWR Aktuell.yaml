  description: "Seit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nAus dem Leben - \nmit dem Wissenschaftsjournalisten Dirk Steffens\nGerade in Krisen gibt es für Dirk Steffens zum Optimismus keine Alternative. Daher zeigt der Wissenschaftsjournalist in seinem Buch \"Hoffnungslos optimistisch\", wie wir die Zukunft wieder stärker als Chance sehen können. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/\n\n10:30 \nKultur - Trends und Hintergründe aus der Kulturszene\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nOh, wie schön ist Kanada?\nDie EU sucht neue Partner für Handel, Energie und Rohstoffe. Dabei rückt Kanada stärker in den Fokus. Doch was hätte eine engere Zusammenarbeit konkret für Verbraucherinnen und Verbraucher zur Folge? Wir schauen auf die Bereiche, in denen mehr Kanada für Europa spürbar werden könnte: bei Energie und kritischen Rohstoffen, beim Arbeiten und Studieren im Ausland sowie bei Investitionen und Handel. Könnten Unternehmen und Verbraucher davon profitieren? Und kann Kanada dazu beitragen, Europas Abhängigkeit von den USA und anderen Wirtschaftsmächten zu verringern?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
