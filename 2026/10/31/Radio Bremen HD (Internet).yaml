  title: Ostseestädte, die Sie kennen sollten
  description: Stockholm oder Kopenhagen, Visby, Riga oder vielleicht doch Tallinn? Welches ist die beliebteste Stadt an der Ostsee? In dieser Sendung werden 20 besonders attraktive von ihnen vorgestellt. Im Rahmen einer Kreuz- und Querfahrt über die Ostsee geht es unter anderen nach Odense, der märchenhaften Heimat von Hans Christian Andersen, sowie nach Ystad, Drehort für düstere Wallander-Krimis, und zum feuchtfröhlichen Sekt trinken nach Wismar. NDR Autorin Ariane Peters zeigt während dieser Rundreise die schönsten Ecken der Ostseestädte.
