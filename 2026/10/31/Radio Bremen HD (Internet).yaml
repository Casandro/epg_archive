  title: 'Die Nordreportage: Rundum-Service für Luxuswohnungen'
  description: 'Marcus Haacke, 53, bietet für schwerreiche Immobilienbesitzer einen 360-Grad-Rundum-Service, betreut Luxuswohnungen in Hamburg. Er behebt technische Probleme, repariert Heizungen, besorgt Handwerker, kümmert sich um das Design und die Inneneinrichtung. Er erfüllt Spezialwünsche der Kunden: feines Backwerk aus Winterhude, Eintrittskarten für ein Konzert oder beauftragt eine Cateringfirma für einen schicken Empfang im Elphi-Apartment.'
  genre:
  - '112'
- eventId: 728391
  start: 2026-10-31T05:30:00Z
  stop: 2026-10-31T06:00:00Z
  title: 'Die Nordreportage: Zwischen Notbett und Nobelwohnheim'
  subtitle: Studentenbude verzweifelt gesucht
  description: 'Julia, Jonas und Niklas studieren in Niedersachsen. Aber bezahlbarer Wohnraum ist begrenzt. Auf ein Zimmer kommen 200 Bewerber, sagt ein Vermieter. Eine Alternative sind komfortable Apartmenthäuser. Die Miete können sich aber nur die wenigsten leisten. Andere wiederum nehmen teil am Wohnprojekt "Wohnen gegen Hilfe". Der Deal: Ein Zimmer gegen Unterstützung im Haushalt. Die Nordreportage begleitet die jungen Leute bei ihrer manchmal verzweifelten Suche.'
  genre:
  - '112'
