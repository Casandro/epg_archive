  title: 'Die Nordreportage: Hofgeschichten'
  description: Auf dem Sophienhof im mecklenburgischen Neustrelitz hat Karsten Dudziak nach drei Jahren endlich wieder einen Termin für seine Tiere beim Klauenschneider bekommen. Auch in diesem Bereich fehlen Fachkräfte, die die anstrengende Arbeit beherrschen. Auf dem Geflügelhof im niedersächsischen Kölau ist das Stallgebäude immer noch eine Baustelle, aber es ziehen endlich die ersten Bewohner in die renovierten Mobilställe. Die holt Christine Bremer bei ihrem Berufskollegen Hendrik Ahlers.
- eventId: 737610
  start: 2026-10-31T16:15:00Z
  stop: 2026-10-31T17:00:00Z
  title: Hofgeschichten - Unsere Lieblinge
  description: 'Sie haben die Sendereihe "Hofgeschichten" im NDR Fernsehen geprägt und sind inzwischen Kult: Die Geflügellandwirtin Christine Bremer aus dem niedersächsischen Kölau. Ebenfalls in Niedersachsen lebt und arbeitet Steffen Thudt auf seinem Hof mit seiner Mutterkuhherde. Dazu kommen der Blumengärtner Jens Wöbb aus Hamburg-Altengamme, Landwirt Karsten Dudziak mit seinem Sophienhof in Mecklenburg-Vorpommern und Lisa und Marko Ladewig in Schleswig-Holstein. Jeder der fünf Höfe in der Sendung hat seinen ganz eigenen Alltag.'
