  title: Flucht im Namen Gottes - Die Hugenotten
  description: 'Im Jahr 1685 tobt zwischen Katholiken und Protestanten ein Krieg im Namen Gottes. Der französische König Ludwig XIV. sieht in den Hugenotten eine Bedrohung seiner Macht und löst mit einem Federstrich ihre Verfolgung aus. Das Leben von Suzanne Loyal und ihrer Familie ändert sich von Grund auf. Freunde und Nachbarn werden zu Verrätern und Feinden. Ludwig XIV. bleibt seiner harten Linie treu: Wer dem protestantischen Glauben nicht abschwört und zum Katholizismus konvertiert, erfährt Gewalt und Willkür. Männern droht die Galeere, Frauen die Umerziehung im Kloster.'
  genre:
  - '112'
- eventId: 733713
  start: 2026-10-31T11:15:00Z
  stop: 2026-10-31T11:45:00Z
  title: Zur Feier des Tages - Reformation
  description: Der Reformationstag wird im Gedenken an die von Martin Luther angestoßene Reformation gefeiert. Der Überlieferung nach nagelte Luther 1517 seine 95 Thesen, in denen er den Ablasshandel der Katholischen Kirche anprangert, an eine Kirchentür. Seine Kritik führte zu einer Spaltung in eine evangelische und eine katholische Kirche - der Reformation. Das Format "Zur Feier des Tages" erzählt in der Ausgabe zum Reformationstag die Geschichten von drei Menschen, die an Erneuerung glauben, die sich selbst mehrfach neu erfunden haben oder ihr Umfeld zu verändern versuchen.
- eventId: 733948
  start: 2026-10-31T11:45:00Z
  stop: 2026-10-31T12:10:00Z
  title: Neues aus Büttenwarder (2)
  subtitle: Fette Beute
  description: Nach einem Bankraub in der Nachbargemeinde wird der Räuber gefaßt, die Beute bleibt aber verschwunden. Bauer Brakelmann macht sich in aller Frühe auf die Suche im Wald und trifft dort Adsche und die Dorfgemeinschaft. Der Dorffriede ist dahin, denn jeder unterstellt dem anderen, die Beute unterschlagen zu haben.
  genre:
  - '16'
- eventId: 734751
  start: 2026-10-31T12:10:00Z
  stop: 2026-10-31T12:35:00Z
  title: Neues aus Büttenwarder (62/98)
  subtitle: Haggnschuss
  description: So richtig wohl fühlt sich Adsche in seinem Zuhause schon lange nicht mehr. Warum kriecht er nicht bei Brakelmann unter? In dem gemütlichen Ambiente seines alten Freundfeindes hält er sich ja ohnehin ständig auf. Warum also nicht zusammenfügen, was zusammengehört?  Doch diese Idee weckt nur Brakelmanns Zorn und Hohn. Er braucht niemanden in seiner Nähe. Und Adsche schon gar nicht. In dieser Nacht begeben sich Brakelmann und der von ihm tief gekränkte Adsche gemeinsam mit Stallknecht Kuno in die Boddenbeeker Brache, um dort ein Reh zu schießen. Dabei erwischt es jedoch nicht nur das Wild.
- eventId: 735194
  start: 2026-10-31T12:35:00Z
  stop: 2026-10-31T13:00:00Z
  title: Neues aus Büttenwarder (51)
  subtitle: Donnerschlach
  description: Eigentlich wollte Adsche nur Brakelmann wie gewohnt auf dessen Hof abholen, um mit ihm im Dorfkrug zum Frühschoppen einzukehren. Doch das Wetter macht ihnen einen Strich durch die Rechnung. Der Sturm ist so heftig, dass die beiden beschließen, zunächst in Brakelmanns Bauernküche zu bleiben. Bald schon dringen die Katastrophenmeldungen nur noch bruchstückhaft aus dem Radio, dann sind die beiden Männer vollends von der Außenwelt abgeschnitten. Als auch der Proviant und insbesondere der Köm knapp werden, liegen die Nerven der beiden Männer zusehends blank.
  genre:
  - '16'
