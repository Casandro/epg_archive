    Reżyseria: Eric Le Roux
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Manon Azem, Félicité Chaton, Stéphane Soo Mongo
    Dwie drużyny graczy rywalizują ze sobą w pełnowymiarowej grze fabularnej. Georgesowi Martelowi, szefowi niebieskich hełmów, udaje się dotrzeć do celu. Kiedy już ma schwytać flagę, zamaskowany gracz podchodzi do niego i strzela. Martel pada martwy. Sekcja zwłok ujawnia, że mężczyzna od kilku miesięcy był torturowany. Czy jego śmierć to finał tortur? Komu mogło zależeć na jego zniknięciu?
