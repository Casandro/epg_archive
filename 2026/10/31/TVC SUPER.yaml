    FR, 2015
    Reżyseria: Didier Delaître
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Manon Azem, Félicité Chaton, Stéphane Soo Mongo
    Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu. Skomplikowane sprawy, takie jak uprowadzenia dzieci, zaginięcia, przestępstwa na tle seksualnym są codziennym udziałem śledczych z tej jednostki. W poszukiwaniu świadków zespół jest upoważniony do rozszerzenia dochodzeń poza granice Francji.
