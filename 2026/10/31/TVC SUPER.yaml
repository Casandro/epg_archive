  title: Morderstwo na masywie Sancy
  subtitle: W masywie Sancy, w sercu Owernii, pasterz Patrick zostaje zamordowany. Marceline postanawia samodzielnie wymierzyć sprawiedliwość zabójcy syna.
  description: |-
    Tytuł oryginalny: Mort d'un berger
    FR, 2024
    Reżyseria: Christian Bonnet
    Występują: Anny Duperey, Guillaume Arnault, Daphné Girard, Edouard Montoute, Hélie-Rose Dalmay, Sören Prévost
    Masyw Sancy, Owernia. Pasterz Patrick ponosi śmierć w tajemniczych okolicznościach. Jego matka, Marceline, jest przekonana, że syn zginął w wyniku ataku wilków. Wkrótce jednak wychodzi na jaw, że to nie dzikie zwierzęta doprowadziły do zgonu Patricka. Okazuje się bowiem, że chłopak został zamordowany. Śledztwa w tej sprawie podejmuje się kapitan Pascal Durinteau, który próbuje nie tylko rozwiązać zagadkę, ale i powstrzymać Marceline przed dokonaniem zemsty.
