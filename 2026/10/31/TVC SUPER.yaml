  title: Jednostka do zadań specjalnych 9 (odc. 10)
  subtitle: Dwie drużyny graczy rywalizują ze sobą w pełnowymiarowej grze fabularnej. Gdy Georgesowi Martelowi, szefowi niebieskich hełmów, udaje się dotrzeć do celu, zamaskowany gracz zabija go.
  description: |-
    Tytuł oryginalny: Section de recherches
