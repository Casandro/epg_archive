    Candice wprowadza się do nowego, pięknego domu nad wodą. Dzieci, pies ? wszyscy są zachwyceni. To powinien być raj? Nie licząc postawy Antoine'a przeniesionego na własną prośbę do policji kryminalnej w Montpellier. Według niego Candice zdradziła go, więc nie przestaje on ingerować w prowadzone przez nią dochodzenia. Swoimi działaniami tak uprzykrza Candice życie, że można by pomyśleć, iż straciła ona swoje blond moce.
