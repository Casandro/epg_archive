  title: 'Rêve agricole / André Comeau '
  subtitle: 'Au sommaire : E04. Avec son équipe de correspondants répartie d''un bout à l''autre du Canada et aux quatre coins du monde, le magazine d''actualité et de société "Le point" offre un contact direct avec l''événement.'
  description: "Au sommaire :\n\nLe rêve agricole\nSuite du reportage « La relève agricole » et consacré à cinq jeunes agriculteurs québécois passionnés qui débutent leur parcours. Un chemin bien souvent semé d'embûches où ils font face à des défis financiers, administratifs et climatiques. \n\nL'homme qui plantait des blés : le généticien André Comeau\nPour en arriver aux variétés de blé que l'on cultive aujourd'hui, il a fallu un long travail de sélection fait d'abord par des agriculteurs, puis par des scientifiques. Le généticien André Comeau, 80 ans, continue de travailler sans relâche sur l'amélioration de cette céréale. Son objectif est de développer des blés adaptés aux changements climatiques : les blés de demain !\n\nPrésentation : Catherine Gauthier\n "
