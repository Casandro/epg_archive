  title: 'Pompes funèbres / Crise du logement '
  subtitle: 'Au sommaire : l''omniprésence des grands groupes de pompes funèbres belges et leurs pratiques commerciales douteuses ; l''envers du  '
  description: "Au sommaire : \n\nPompes funèbres, quand la mort rapporte gros\nÀ quoi ressemblera votre enterrement ? À votre mort, vos proches feront certainement appel à une entreprise de pompes funèbres. Ces dernières années, de grands groupes se sont développés en Belgique, rachetant les petits funérariums familiaux et rationalisant les coûts. Mais leurs méthodes sont pointées du doigt.\n\nCrise du logement, un toit à tout prix\nDepuis vingt ans, la Belgique est frappée par une crise du logement. Des milliers de Belges ont abandonné le rêve de l'appartement ou de la maison traditionnelle pour se tourner vers des alternatives comme la colocation ou l'habitat léger. Violence, marchands de sommeil, insalubrité, notre enquête révèle l'envers du décor.\n\nPrésentation : Justine Katz\n "
  ageRating: 7
