  title: 'Hiam Abbas, Malek Bensmaïl, Karim Kattan, Rafael Yaghobzadeh '
  subtitle: '« L''Arabe », avec Hiam Abbas, est une adaptation du texte de Kamel Daoud « Meursault, contre-enquête ». Malek Bensmaïl redonne nom '
  ageRating: 7
  description: "Hiam Abbas, Malek Bensmaïl, Karim Kattan, Rafael Yaghobzadeh \n\nTous les films de Malek Bensmaïl sont liés à l'histoire de son pays, l'Algérie. Dans « L'Arabe », le réalisateur adapte librement le texte de Kamel Daoud « Meursault, contre-enquête » et redonne nom et visage à l'Arabe assassiné dans « L'Étranger », d'Albert Camus. Moussa est mort depuis cinquante ans, Haroun, son frère, confie à un journaliste le récit du jour du meurtre. Hiam Abbass incarne M'ma, leur mère.\n \n« Septentrionale » (éditions Elyzad), de Karim Kattan, est à la frontière du réalisme et du fantastique, du réel et de l'imaginaire. Dans ce nouveau roman, l'écrivain nous embarque dans un roadtrip intime et apocalyptique, avec Joseph et Maryam. C'est la nuit, deux inconnus roulent vers le nord pour rejoindre leurs proches. Autour d'eux, des villages en ruine, la mer qui absorbe, des rencontres mystérieuses, l'étoile du Nord...\n \nDès 2011, Rafael Yaghobzadeh documente les Printemps arabes et couvre depuis les conflits de l'Ukraine au Liban. Ses travaux au long cours questionnent la mémoire, l'exil, l'identité, l'héritage, dans des territoires sinistrés ou en post-conflit. Le photographe participe au forum « Impact Kyiv 2026 », avec l'Institut français en Ukraine, et a été le lauréat 2026 du Visa d'or Online pour « Liban - Guerre(s) perpétuelle(s) », réalisé pour « Le Monde ». \n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Hiam Abbas, actrice ; Malek Bensmaïl, réalisateur ; Karim Kattan, écrivain ; Rafael Yaghobzadeh, photographe documentaire et photojournaliste \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
