  title: Zur Feier des Tages - Reformation
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Reformationstag wird im Gedenken an die von Martin Luther angestoßene Reformation gefeiert. Der Überlieferung nach nagelte Luther 1517 seine 95 Thesen, in denen er den Ablasshandel der Katholischen Kirche anprangert, an eine Kirchentür. Seine Kritik führte zu einer Spaltung in eine evangelische und eine katholische Kirche - der Reformation. Das Format "Zur Feier des Tages" erzählt in der Ausgabe zum Reformationstag die Geschichten von drei Menschen, die an Erneuerung glauben, die sich selbst mehrfach neu erfunden haben oder ihr Umfeld zu verändern versuchen.
