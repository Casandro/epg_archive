  description: 'Marcus Haacke, 53, bietet für schwerreiche Immobilienbesitzer einen 360-Grad-Rundum-Service, betreut Luxuswohnungen in Hamburg. Er behebt technische Probleme, repariert Heizungen, besorgt Handwerker, kümmert sich um das Design und die Inneneinrichtung. Er erfüllt Spezialwünsche der Kunden: feines Backwerk aus Winterhude, Eintrittskarten für ein Konzert oder beauftragt eine Cateringfirma für einen schicken Empfang im Elphi-Apartment.'
