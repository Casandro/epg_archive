  description: |-
    Großbritannien 2024
    Bruce Lindahl wird bis Anfang der 1980er-Jahre mehrfach wegen Vergewaltigung angezeigt. Ohne Konsequenzen. Ein Verdacht keimt auf: Wird er von einem Freund bei der Polizei geschützt?

    Die Beamten stoßen auf haarsträubende Ermittlungspannen. Lindahl treibt sein Unwesen in einer Zeit, als Vergewaltigungen häufig verharmlost werden. Doch die Polizisten kämpfen für späte Gerechtigkeit. Gelingt es ihnen, Bruce Lindahl zweifelsfrei zu überführen?
