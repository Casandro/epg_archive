  description: |-
    Großbritannien 2024
    1978 reist das abenteuerlustige Pärchen Chris Farmer und Peta Frampton durch Mittelamerika. Die beiden genießen das Leben, bis sie nach einer Feier plötzlich und ohne Erklärung verschwinden.

    Nach Wochen ohne Nachricht machen sich die Familien zu Hause in Manchester allmählich Sorgen und kontaktieren die Behörden - ohne Ergebnis. Zuletzt waren die beiden mit einem US-Amerikaner und dessen zwei Söhnen auf einem Segelboot unterwegs. Was ist auf See passiert?
    HD-Produktion
