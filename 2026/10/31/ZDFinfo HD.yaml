  title: Ballonflucht aus der DDR
  subtitle: Der Plan
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2026
    DDR, 1978. Zwei Familien halten die Repressionen des SED-Regimes nicht länger aus. Ihr waghalsiger Plan: Sie wollen mit einem selbst gebauten Heißluftballon in den Westen fliehen.

    Doch keiner von ihnen hat Erfahrung mit Luftfahrt. Und wie sollen sie unbemerkt an rund 800 Quadratmeter Stoff gelangen? In einem Staat, in dem die Stasi jeden Schritt der Bürger überwacht. Trotz aller Risiken wollen es die befreundeten Familien versuchen.
    HD-Produktion
- eventId:
  - 585122
  - 856842
  start: 2026-10-31T01:00:00Z
  stop: 2026-10-31T01:45:00Z
  title: Ballonflucht aus der DDR
  subtitle: Aufbruch in die Freiheit
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2026
    Sommer 1979. Fliegt der Fluchtplan der Familie Strelzyk auf? Mitten im Sperrgebiet stürzt ihr Ballon an der innerdeutschen Grenze ab. Gelingt es ihnen, von der Stasi unentdeckt zu bleiben?

    In panischer Angst erreichen sie ihr Auto und fahren nach Hause. Dort versuchen sie, ihren Alltag wieder aufzunehmen, als sei nichts geschehen. Doch längst hat die Stasi den abgestürzten Ballon im Wald gefunden. Die Lage spitzt sich zu.
    HD-Produktion
