  description: |-
    Großbritannien 2024
    Im Mordfall Pamela Maurer kommen die Ermittler einem Verdächtigen auf die Spur: Bruce Lindahl hat strahlend blaue Augen, ein gewinnendes Lächeln und einen Berg dunkler Geheimnisse.

    Lindahl ist passionierter Fallschirmspringer, Liebhaber von Raubvögeln und macht gerne Fotos - vor allem von jungen Mädchen. Die Polizisten finden bei ihm eine Box voller Bilder von nackten, jungen Frauen. Wie vielen hat er etwas angetan?
    HD-Produktion
