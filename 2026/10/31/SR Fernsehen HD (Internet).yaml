  title: Reisetipp Südwest
  subtitle: Südschwarzwald - Die Wutachschlucht
  description: 'Sie gilt als der größte Canyon Deutschlands: die Wutachschlucht. Ihre steilen Felswände, bemoosten Steine, kleinen Wasserfälle und unzähligen Tierarten faszinieren jedes Jahr tausende Besucher. Die Schlucht erstreckt sich zwischen Bonndorf und Grimmelshofen im Landkreis Waldshut. Wir begleiten eine Wandergruppe auf der wildesten und bekanntesten Route - zwischen der Wutachmühle und der Schattenmühle.'
