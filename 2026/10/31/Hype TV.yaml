    Bui Doi, što znači 'manje od prašine', žargonski je naziv za vijetnamsku djecu američkih očeva, koja su poslije rata imala još teže djetinjstvo od ostalih vršnjaka. Binh (Damien Nguyen) je jedan od njih, sramežljiv i povučen mladić, koji živi sa svojom obitelji na selu, bez majke. Jedina uspomena na oca stara je fotografija iz djetinjstva, sve dok jednog dana Binh ne odluči potražiti svoju majku u Saigonu i saznati nešto više. Informacije do kojih dođe natjerat će Binha na opasno putovanje, a prva će mu stanica biti zatvor za ilegalne useljenike u Singaporu, u kojem će završiti zajedno sa svojim mlađim polubratom. U zatvoru Binh upozna Ling (Ling Bai), prekrasnu Kineskinju koja se prostituira u zamjenu za usluge čuvara, što će oboje kasnije iskoristiti za izlazak iz zatvora. Binh vjeruje kako njegov otac živi u Houstonu, i napravit će sve kako bi stigao u Ameriku. Jedna od najtužnijih posljedica američke upletenosti u Vijetnam djeca su američkih vojnika, koji najčešće nikada nisu ni saznali kako imaju kćeri i sinove u toj ratom poharanoj zemlji. Redatelj Hans Petter Moland od jedne takve sudbine snimio je odličnu, dirljivu dramu 'Predivna zemlja', koja pokazuje kako obitelj doista jest najvažnija stvar u životu. Damien Nguyen naprosto je fantastičan kao osoba kojoj je život na put stavljao samo ogromne prepreke, ali koja je iz svih katastrofa izašla jača i odlučnija. Manje uloge odradili su slavni Tim Roth i Nick Nolte, kompletirajući tako ekipu sastavljenu od glumaca iz dviju različitih kultura.
