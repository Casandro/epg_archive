  description: Jackie Chan mora spasiti stvar...ali hoće li mu to poći za rukom prazna želuca? Akcijska adaptacija popularne japanske mange i animirane serije, obogaćena vještinama međunarodne akcijske zvijezde Jackieja Chana. Ryu Saeba, šarmantni privatni detektiv, dobiva zadatak pronaći odbjeglu kćer bogatog poslovnog čovjeka. Potraga ga dovodi na veliki brod. Stjecajem okolnosti, a uz zaplet nadahnut filmom "Umri muški", brod je otet pa Ryu mora pobijediti kriminalce, spasiti taoce i pronaći poslovnjakovu kćer. Poseban užitak predstavlja scena u kojoj se na ekranu u pozadini prikazuje borba između Brucea Leeja i Kareema Abdul - Jabbara iz filma "Igra smrti", dok Chan i njegovi protivnici u prvom planu oponašaju tu borbu.
