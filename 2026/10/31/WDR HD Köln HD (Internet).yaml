  title: 'Expedition in die Heimat: Sommergefühle am Bodensee'
  subtitle: 'Moderation: Johannes Zenglein'
  description: Sommergefühle satt. Der Bodensee ist eine der beliebtesten Urlaubsregionen. Wenn das Glück Ferien machen würde, dann wohl hier. Denn es gibt alles, was den Sommer noch schöner macht. SWR Moderator Johannes Zenglein feiert das Mittsommer-Fest auf der Insel Mainau, besucht die magische Marienschlucht, bummelt durch Bregenz und blickt hinter die Kulissen der weltberühmten "Bregenzer Festspiele".
- eventId: 731920
  start: 2026-10-31T10:15:00Z
  stop: 2026-10-31T10:45:00Z
  title: Raus aufs Land (33)
  subtitle: Neubeginn im alten Pfarrhaus - Leben und leben lassen auf'm Land
  description: |-
    Bei Victoria hat sich viel getan: Sie ist Mutter geworden und lebt mit Daniel den Traum vom eigenen Lebenshof - auf dem die beiden geretteten Tieren einen Ort zum Leben geben. Doch Dorfbewohner beschweren sich. Kann sie ihr Herzensprojekt auf dem Land retten?
    NDW-Sänger Markus Mörl startet mit seiner Patchworkfamilie ein neues Projekt im Rheingau: ein eigenes Hotel auf dem Land. Während Yvonne Ordnung will, sorgen Markus und Sohn Hannes für Chaos.
    Alina und Pascal haben das alte Haus ihres verstorbenen Opas geerbt. Nun muss sich herausstellen, ob diese junge Beziehung den Strapazen der Renovierungsarbeiten aushält.
- eventId: 733629
  start: 2026-10-31T10:45:00Z
  stop: 2026-10-31T11:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: mit Martina Meuth und Bernd Neuner-Duttenhofer
  description: Im Herbst ist Muschelzeit - für die WDR-Fernsehköche Martina und Moritz ein kulinarischer Lichtblick in dieser dunklen Jahreszeit. Martina und Moritz zeigen das klassische Grundrezept für Miesmuscheln, die ja ganz und gar nicht mies sind, aber auch eine asiatische Variante mit Thai-Düften. Sie verwenden Muscheln für ein delikates Fenchelsüppchen und gratinieren sie wie in Italien. Von dort stammen auch die Ideen für Vongole, die vielleicht noch köstlicheren Venus- oder Teppichmuscheln. Und für zarte Jakobsmuscheln wissen sie ein spannendes, raffiniertes Rezept.
  genre:
  - '144'
