  title: Die Hexe und der Zauberer
  subtitle: Zeichentrickfilm, USA 1963
  description: 'Regie: Wolfgang Reitherman. Darsteller: Karl Swenson, Rickie Sorensen, Junius Matthews. Ein Land ohne König, ein ungewöhnliches Schwert und eine geheimnisvolle Vorsehung - in diesen Zeiten lebt der junge, unbeschwerte Ritterknecht Floh auf der Burg seines Stiefvaters Sir Ector. Allein der gute Zauberer Merlin erkennt, dass Floh zu Höherem bestimmt ist, und weiht ihn auf äusserst ungewöhnliche Weise in die Geheimnisse des Lebens ein. Zusammen erleben sie die tollsten und spannendsten Abenteuer, deren Höhepunkt ein Zauberwettstreit mit der bösen Hexe Madame Mim ist. Sieg oder Niederlage entscheidet über das Schicksal des Jungen und damit über das des ganzen Landes. Das zwölfjährige Waisenkind Arthur, genannt Floh, ahnt nicht von seiner Bestimmung - bis der Zauberer Merlin auf ihn aufmerksam wird und sich der Erziehung des Jungen annimmt. Als Fisch, Eichhörnchen und Vogel verwandelt lässt er Floh lehrreiche Abenteuer erleben, daunter einen Zauberwettstreit mit der bösen Hexe Madame Mim. Und als Arthur in den Besitz eines besonderen Schwertes kommt, steht er plötzlich vor einer schwierigen Wahl. Disneys zauberhafte Interpretation der berühmten Artus-Sage.'
  widescreen: true
- eventId: 708658
