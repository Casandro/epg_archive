  title: Novo srce
  subtitle: Religijski
  description: '''Dat ću vam novo srce, nov duh udahnut ću u vas!'' (Ez 36; 26) Emisija ''Novo srce'' gledateljima želi približiti iskustvo vjere različitih osoba koje su u svom životu otkrile ljepotu i radost susreta sa živim Bogom. Svaki istinski susret s Bogom mijenja ljudska srca, i u tom se susretu otkriva i jedna važna istina: naš Bog ima srce i to nas srce ljubi neizrecivom i vječnom ljubavlju. Urednik i voditelj emisije: fra Ivan Matić, OFM.'
