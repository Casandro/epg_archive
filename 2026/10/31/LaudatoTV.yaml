  title: Superknjiga
  subtitle: Kada Ela postane preopterećena s previše obaveza koje ima i ne zna kako se nositi s njima, Superknjiga odvodi djecu u Babilon u 6. st. pr. Kr. kako bi naučila riješiti njen problem.
  ageRating: 4
  genre:
  - '128'
  description: 'Kada Ela postane preopterećena s previše obaveza koje ima i ne zna kako se nositi s njima, Superknjiga odvodi djecu u Babilon u 6. st. pr. Kr. kako bi naučila riješiti njen problem. Upoznaju mladog Daniela koji radi u palači kao jedan od ,,mudraca kralja Nabukodonozora: grupe koja se sastoji od različitih astrologa, vidovnjaka, pismoznanaca i učenih muškaraca. Prestravljen zbog ponovljene noćne more, kralj naređuje svim svojim mudracima da mu ispričaju njegov san i otkriju značenje - ili će izgubiti život. Svi mudraci inzistiraju na tome da nitko ne može znati tuđi san, ali Daniel intervenira kako bi zaustavio ubojstva mudraca, tražeći dodatno vrijeme za otkrivanje tajne. Djeca traže Daniela da pobjegne, plašeći se da će u slučaju neuspjeha, izgubiti život. Umjesto bijega, Daniel i njegova tri prijatelja mole Boga za pomoć. Bog otkriva san Danielu, a on onda tumači san kralju: san proriče pad Nabukodonozorova kraljevstva, kojeg će naslijediti druga kraljevstva, dok jednog dana te prolazne vladavine ne budu zamijenjene Božjom trajnom crkvom. Kada zahvalni kralj Nabukodonozor nagradi Daniela, djeca se vraćaju u suvremeni svijet. Ela i dalje ne zna rješenje za svoj problem, ali zna kako ga pronaći. Luka joj se pridružuje u molitvi za Božju pomoć, dok scena odmiče.'
