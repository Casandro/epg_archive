  title: Gotland, Gotland - an Opening to the Sacred
  subtitle: Dokumentarni
  description: Švedski otok Gotland poznat je turistima po dugim plažama i gradu Visbyju s drevnim ruševinama i zidinama. No manje je poznato kako ovaj baltički otok čuva izuzetno dobro očuvane 92 srednjovjekovne crkve. Tragom njihove prošlosti otkriva se kako je ovaj otok postao mjesto susreta kršćana iz mnogih dijelova svijeta. Ovo je samo mali prozor u doba puno ljepote, misterija i vjere. Gotland krije tajnu dubokih nordijskih kršćanskih korijena, tajnu koju ovaj film nastoji razotkriti i proširiti.
