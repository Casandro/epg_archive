  title: Čovjek prije svega
  subtitle: Magazin
  description: Uz svećeništvo, u njegovo djelovanje ''uvukla  se i televizijska kamera. No prije oltara bila je tu profesionalna kuhinja. Zato se pred kamerama ranije zamišljao tek u pričama o istaknutim chefovima. Nikako kao netko tko se putem televizije obraća i publici prenosi riječ Božju gotovo svakodnevno. Pater Ivan Raljušić danas je svećenik, duhovnik Laudato televizije i čovjek kojem kolege dolaze kada trebaju razgovor, savjet ili samo nekoga tko će ih saslušati. Kako je kuhar postao svećenik? Smišlja li još uvijek nove recepte? Priprema li još uvijek jela i kome? Što je naučio pred kamerama? Kak biti dobar duhovnik? Te kakva je vjera čovjeka od kojeg drugi često očekuju odgovor? Naizgled nekoliko različitih priča, a zapravo jedan životni put. Upoznajte p. Ivana Raljušića u novoj epizodi serijala  Čovjek prije svega .
- eventId: 701817
