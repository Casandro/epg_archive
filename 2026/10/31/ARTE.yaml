  title: Shutter Island
  subtitle: En 1954, deux policiers enquêtent sur la mystérieuse disparition d'une femme, internée dans un centre de détention psychiatrique, sur l'île de Shutter Island.
  ageRating: 15
  genre:
  - '17'
  description: '1954. Après une traversée mouvementée, le marshal Teddy Daniels et son coéquipier Chuck Aule accostent sur l''énigmatique Shutter Island, au large de Boston. Enveloppée d''une brume inquiétante, l''île abrite l''un des plus grands asiles pénitentiaires de la région, d''où a disparu Rachel Solando, internée après avoir noyé ses trois enfants. Pour résoudre ce mystère, les deux marshals ont un seul indice : une feuille de papier pliée en quatre, sur laquelle on distingue une suite de chiffres entrecoupés de lettres. Cauchemar éveillé Portée par un formidable tandem - Leonardo DiCaprio dans le rôle de l''agité Teddy Daniels, hanté par son expérience de GI durant la Seconde Guerre mondiale, et Mark Ruffalo dans celui de l''inébranlable acolyte Chuck Aule -, Shutter Island mêle habilement les codes du film noir et ceux du polar psychologique. Dans une atmosphère inspirée des films fantastiques des années 1940, Martin Scorsese installe un sentiment de malaise qui va grandissant, sur une île coupée du monde où l''on peine à distinguer le vrai du faux, la réalité du rêve, le personnel soignant des malades. Qui est Teddy Daniels ? Et que cache vraiment cette prison-hôpital ? Réalisateur: Martin Scorsese. Des acteurs: Leonardo DiCaprio (Teddy Daniels), Mark Ruffalo (Chuck Aule), Ben Kingsley (le docteur Cawley), Michelle Williams (Dolores Chanal), Emily Mortimer (Rachel Solando) (2010)'
- eventId: 721639
