  title: WNL In de Kantine
  subtitle: Presentatoren Fidan Ekiz en Wieger Hemmer nemen met hun gasten de week door en diepen actuele kwesties uit die het nieuws bepalen en de samenleving bezighouden. Persoonlijke verhalen blijken daarbij vaak verrassend universeel.
  description: 'Met WNL In de Kantine glijdt u de zaterdagavond in, elke week live vanuit De Doelen in Rotterdam. Gastvrouw Fidan Ekiz en gastheer Wieger Hemmer ontvangen iedere zaterdag een keur aan bekende en boeiende gasten om de week mee door te nemen. Voor politieke debatten op het scherpst van de snede, maar ook voor sport, cultuur en humor stemt u op zaterdag af op NPO Radio 1. Radio om naar te kijken Of komt u gezellig eens langs, in De Doelen. Met een biertje en een bitterbal, radio om naar te kijken! De toegang is gratis, de sfeer is goed, de deuren gaan om 16 uur open. In de Kantine is een programma van WNL. Iedere zaterdag van 17:00 - 19:00 uur LIVE vanuit De Doelen in Rotterdam met Wieger Hemmer en Fidan Ekiz. De Doelen: Schouwburgplein 50, 3012 CL, Rotterdam. Toegang gratis, kom langs! Wilt u het laatste nieuws over het programma? Of weten wie er te gast is? Volg WNL In de Kantine op Twitter (2026)'
