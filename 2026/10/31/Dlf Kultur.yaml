  title: Aus den Archiven
  description: |-
    Frida Kahlo
    Wie die Ikone Mexikos zur Kultfigur wurde
    Von Hans-Jürgen Schmitt
    Deutschlandradio 1996
    Vorgestellt von Isabella Kolar

    Frida Kahlo (1907 - 1954) ist in Mexiko - und nicht nur dort - allgegenwärtig. Auf Geldscheinen, in Museen, auf Taschen und T-Shirts. Die berühmte Künstlerin ist überall - und nahezu immer eine Schlagzeile wert. Warum fasziniert sie bis heute mehr denn je? Weil die Menschen die Erfahrung ihres leidvollen Lebens, die Frida mit so radikaler Ehrlichkeit darstellt und damit erlebbar macht, voller Mitgefühl nachvollziehen können: die universelle Schilderung von Schmerz, Liebe und Identitätssuche.
