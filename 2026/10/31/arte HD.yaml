  description: Diese Folge unternimmt eine Reise zu den großen Errungenschaften, die der Menschheit die Möglichkeit geschenkt haben, die Welt der Viren und Bakterien zu erforschen. Im Fokus stehen Wissenschaftler wie Semmelweis, Leeuwenhoek, Spallanzani, Pasteur und Fleming.
