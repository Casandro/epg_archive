  title: Auf den Spuren der Bären
  subtitle: Frankreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Für seine Dokumentation hat der Tierfilmer Pierre Mann fünf Bärenarten aus aller Welt ein Jahr lang mit der Kamera begleitet: In Rumänien beobachtet er Europäische Braunbären, die in den dichten Wäldern der Karpaten ein Refugium gefunden haben. In Kamtschatka im äußersten Osten Sibiriens spürt er Grizzlybären nach. Am Rande der Arktis dokumentiert Pierre Mann das Leben der Eisbären in ihrem vom Klimawandel bedrohten Jagdgebiet, dem Packeis. Und im gemäßigten Regenwald British Columbias begegnet er nicht nur Amerikanischen Schwarzbären, sondern auch dem äußerst seltenen Kermodebär, auch "Spirit Bear" (Geisterbär) genannt.'
