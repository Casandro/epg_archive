  description: Nachdem er 20 Jahre unschuldig in Haft gesessen hat, ist Edmond Dantès endlich die Flucht geglückt, und jetzt ist er dank eines geheimen Schatzes der reichste Mann Europas. Von nun an nennt er sich "Graf von Monte Christo" - den Adelstitel hat er sich erkauft - und reist nach Paris, um mit denen abzurechnen, die ihn damals verraten und in die Falle gelockt haben. Außerdem will er vor allem seine Geliebte von einst, Mércèdes, die jetzt mit seinem Widersacher Fernand de Morcerf verheiratet ist, zurückgewinnen. Doch Mércèdes hat sich mit ihrem Leben abgefunden.
