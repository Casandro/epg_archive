  title: Parasiten packen aus
  subtitle: 'Moderation: Renaud Dély'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In der Dokumentation "Parasiten packen aus" beleuchtet ARTE eine wenig beachtete Facette der Natur: die Welt der Parasiten. Während klassische Naturdokumentationen meist die Schönheit und Ordnung der Biodiversität in den Vordergrund stellen, zeigt diese Dokumentation die Realität hinter der Fassade - und die ist überraschend komplex und oft erschreckend: Drei Viertel aller Tierarten sind Schmarotzer, rechtschaffene Spezies sind die Ausnahme. Gleichzeitig humorvoll und spannend wie ein Mafiaepos: Erzählt wird aus der Perspektive der Parasiten selbst.'
