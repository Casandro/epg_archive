  title: NTC kviz
  subtitle: Lopta može da se hvata kad je neko baci. Lopta može da se šutira. Loptom se daju koševi i golovi.
  description: Lopta može da se hvata kad je neko baci. Lopta može da se šutira. Loptom se daju koševi i golovi. Ali, šta se desi kada lopta izađe iz sveta sporta i ploveći na kašici uđe u svet razmišljanja? To će nam otkriti neko ko o tome više zna, a to je... Ognjen Mićović! Nova epizoda "NTC kviza" je u subotu, 31. oktobra 2026. godine u 11:00 č na Prvom programu Televizije Srbije. Sa jedne strane su učenici Osnovne škole "Sveti Sava" iz Kraljeva, dok drugi tim čine učenici Osnovne škole "Ivo Lola Ribar" iz Aleksandrovca. Stanovnicima Kraljeva je poznato, ali eto prilike da i svi gledaoci "NTC kviza" saznaju da je Kraljevo kroz istoriju menjalo svoje ime; nekada se zvalo Rudo Polje, Karanovac, Kraljevo, Rankovićevo, da bi mu se vratilo ime Kraljevo, koje i danas nosi. U blizini Kraljeva nalazi se manastir Žiča, u kome je krunisan naš prvi kralj, Stefan Prvovenčani. Priča kaže da je u Žiči krunisano ukupno sedam kraljeva i da su za svakog kralja otvarana po jedna nova vrata kako bi kralj prošao...
