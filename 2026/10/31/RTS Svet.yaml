  description: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku - u razgovorima, porukama, raspravama i druženjima. Glavni junaci su buntovna i nepoverljiva Una, koja ne prihvata lako tuđa objašnjenja, zatim njena najbolja drugarica Anastazija, romantična i uvek spremna da vidi nešto više od običnog razgovora, Bogdan, pomalo misteriozan poznavalac jezika koji se bavi različitim poslovima, i Unina mlađa sestra Sonja, koja ih posmatra sa dozom ironije jer i sama odlično poznaje gramatiku i pravopis.'
- eventId: 708558
  start: 2026-10-31T13:15:00Z
  stop: 2026-10-31T13:42:00Z
  title: 44/20
  subtitle: Kako se čuva filmsko nasleđe i šta je sve potrebno da bi filmovi i serije snimljeni pre nekoliko decenija ponovo zablistali na velikom i malom ekranu? O tome govori nova epizoda dokumentarnog.
  description: Kako se čuva filmsko nasleđe i šta je sve potrebno da bi filmovi i serije snimljeni pre nekoliko decenija ponovo zablistali na velikom i malom ekranu? O tome govori nova epizoda dokumentarnog serijala "44/20", "Restauracija", koja je na programu u subotu, 31. oktobra, na Prvom programu RTS-a. Filmske trake vremenom propadaju, boje blede, slika se oštećuje, a zvuk gubi kvalitet. Zahvaljujući savremenim tehnologijama, dragocena ostvarenja domaće kinematografije i televizijske produkcije dobijaju novi život. Od najstarijih filmskih zapisa, poput "Karađorđa" iz 1911. godine, do kultnih ostvarenja kao što su "Ko to tamo peva", "Maratonci trče počasni krug" i brojnih televizijskih serija, digitalna restauracija omogućava da filmska i televizijska baština bude sačuvana za buduće generacije. "44/20" istražuje kako izgleda proces restauracije, sa kakvim se izazovima suočavaju stručnjaci i zašto je očuvanje filmskog nasleđa važno za naše kolektivno pamćenje.
