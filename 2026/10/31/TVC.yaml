  subtitle: Starsza kobieta zaczyna się denerwować, gdy w jej laptopie zostaje znaleziona podejrzana paczka. Funkcjonariusze w Birmingham niszczą plany pary, która liczyła na szybki zarobek.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2011
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Pewna starsza kobieta traci zimną krew po tym, jak w jej laptopie zostaje znaleziona podejrzana paczka. Funkcjonariusze w Birmingham udaremniają plan pary mający na celu szybki zarobek. Na lotnisku Gatwick znalezione zostają duże ilości kokainy.
