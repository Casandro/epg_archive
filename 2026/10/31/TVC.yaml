  description: |-
    Tytuł oryginalny: Storage Wars: Miami
    US, 2015
    Na Florydzie, gdy czynsz za magazyn jest niepłacony przez trzy miesiące, licytator może sprzedać jego zawartość na licytacji. Aukcje prowadzą dwaj licytatorzy: Bob Nichols i Jerry Mahaffey. W programie uczestniczą: sprytny i doświadczony Kevin Pew, para Kubańczyków, Jorge Gomez i Maydel Garcia, którzy uwielbiają dobrą zabawę, Greg i Lindsey, którzy nie lubią ze sobą pracować, a kuzyni Yorgen Ugalde i Christian Fernandez zawsze szukają ciekawych przedmiotów do swojego sklepu.
