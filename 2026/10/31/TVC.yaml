  title: Celnicy 3 (odc. 1)
  subtitle: 'Wracająca z Lanzarote grupa Polaków wwozi do Wielkiej Brytanii 37 tys. papierosów. Zostaje złapana na lotniskowym parkingu. Podejrzenia kontroli granicznej wzbudza młoda para przybywająca z Karaibów. '
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2011
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Przylatująca z Malagi do Bristolu para ma bagaż wypchany marihuaną. Mieszkaniec Holandii przybywający z Dominikany połknął prezerwatywy z kokainą. Dwóch bezrobotnych próbuje zarobić po 200 funtów przemycając 40 tys. papierosów. Kobieta z Niemiec zostaje aresztowana za przemyt 18,2 kg marihuany.
  ageRating: 12
