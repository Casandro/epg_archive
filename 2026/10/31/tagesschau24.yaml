  description: '"Bosch", der größte Automobilzulieferer der Welt, steckt tief in der Krise. Tausende werden in den kommenden Jahren ihren Job verlieren. Gelingt die Wende? Die SWR Doku begleitet die Entwicklung fast ein Jahr lang und berichtet über Krise und Hoffnung beim Stuttgarter Traditionsunternehmen. Der Zulieferer steht sinnbildlich für das, was aktuell die gesamte deutsche Autoindustrie erschüttert.'
