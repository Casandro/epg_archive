  description: '"Der absurdeste Bahnhof Berlins", "Das Labyrinth des Kalten Krieges", "Der Bahnhof der Tränen", "Die Höllenpassage" - Millionen Deutsche, Ostdeutsche und Westdeutsche, haben hier, am berühmtesten Bahnhof der deutschen Teilung, ihre persönlichen und direkten Grenzerfahrungen gemacht. Zwischen Trauer und Freude, Hoffnung und Verzweiflung, zwischen Sehnsucht und Wut. Die unterschiedlichsten Emotionen ereilten die Menschen, die vom Bahnhof Friedrichstraße abfuhren, hier ankamen oder warten mussten. Einige protestierten vor dem "Tränenpalast" für ihre Ausreise, andere versuchten sogar vom Bahnhof direkt in den Westen zu flüchten.'
