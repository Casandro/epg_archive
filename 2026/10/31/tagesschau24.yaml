  title: Speicherstadt und Chilehaus in Hamburg
  subtitle: Die Hochburg des Freihandels, Deutschland
  widescreen: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Seit Juni 2015 trägt die 1888 als größtes Lagerhausensemble der Welt erbaute Speicherstadt mit benachbartem "Chile Haus" das Etikett UNESCO-Weltkulturerbe. Den Freihafenstatus ringt die Hansestadt 1881 Reichskanzler Bismarck ab. In nur sechs Jahren stampfen die Hamburger das größte Lagerhausensemble der Welt aus dem Boden. Dafür muss ein ganzer Stadtteil weichen, knapp 20.000 Menschen werden vertrieben. Im Schutz des Kaiserreichs blüht der Handel auf. Die Hansestadt steigt bis zu Beginn des Ersten Weltkrieges nach London, New York und Rotterdam in die Liga der bedeutendsten Häfen der Welt auf.
