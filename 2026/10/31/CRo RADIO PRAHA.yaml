  title: Host Lenky Vahalové
  description: Zpěvačka LENNY vydala novou desku s názvem Good Omens. Podle jejich slov je to album o převzetí kontroly, o svobodě a odvaze vytvořit si vlastní scénář. Jak moc se nová deska vzdaluje od její předchozí tvorby, proč ke spolupráci přizvala hudebního producenta Filipa Vlčka a jak budou vypadat křty v Praze a v Londýně? Moderuje Lenka Vahalová
- eventId:
  - 691488
  - 692958
  start: 2026-10-31T23:00:00Z
  stop: 2026-11-01T00:00:00Z
  title: Kriminálka
  description: 'Smrt ve službě - Malá potyčka dvou mužů v pražské ulici. Útočník odjel tramvají. Když se ho přivolaná policejní hlídka rozhodla zkontrolovat, okamžitě začal střílet. Po přestřelce zůstali dva vážně zranění policisté. Pachatel zákrok nepřežil. Po pár týdnech umírá i jeden z policistů. Při vyšetřování se ukázalo, že pachatelem byl nebezpečný dlouho hledaný muž podezřelý z vraždy. Proč na sebe takto upozornil? A proč se rozhodl znovu zabíjet? Autor, dramaturgie: Dana a Mirek Vaňurovi. Premiéra.'
