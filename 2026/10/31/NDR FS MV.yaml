  audiodesc: true
  description: So richtig wohl fühlt sich Adsche in seinem Zuhause schon lange nicht mehr. Warum kriecht er nicht bei Brakelmann unter? In dem gemütlichen Ambiente seines alten Freundfeindes hält er sich ja ohnehin ständig auf. Warum also nicht zusammenfügen, was zusammengehört?  Doch diese Idee weckt nur Brakelmanns Zorn und Hohn. Er braucht niemanden in seiner Nähe. Und Adsche schon gar nicht. In dieser Nacht begeben sich Brakelmann und der von ihm tief gekränkte Adsche gemeinsam mit Stallknecht Kuno in die Boddenbeeker Brache, um dort ein Reh zu schießen. Dabei erwischt es jedoch nicht nur das Wild.
