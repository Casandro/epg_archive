  title: 'Polacy w kosmosie: Księżycowy samochód'
  subtitle: Lunar Roving Vehicle to jedna z największych ikon programu Apollo. Księżycowy samochód pozwolił astronautom udać się dalej, zbadać więcej niż byli w stanie wcześniej.
  description: |-
    Tytuł oryginalny: Polacy w kosmosie
    PL, 2023
    Reżyseria: Bogumił Radajewski
    Lunar Roving Vehicle to jedna z największych ikon programu Apollo. Księżycowy pojazd umożliwił astronautom dotarcie dalej i zbadanie więcej niż kiedykolwiek wcześniej. Jego powstanie nie byłoby możliwe bez polskiego naukowca Mieczysława Bekkera, ojca terramechaniki - nauki o ruchu pojazdów w terenie. Bekker był jednym z głównych twórców pojazdu używanego podczas misji Apollo 15, 16 i 17.
  ageRating: 7
  genre:
  - '35'
- eventId: 694275
  start: 2026-10-31T02:40:00Z
  stop: 2026-10-31T03:14:00Z
  title: 'Polacy w kosmosie: Polskie rakiety'
  subtitle: Granica kosmosu to tak zwana linia Karmana, przebiegająca na wysokości stu kilometrów. Pół wieku temu Polacy zdołali się o nią otrzeć - na przełomie lat 60. i 70.
  description: |-
    Tytuł oryginalny: Polacy w kosmosie
    PL, 2023
    Reżyseria: Bogumił Radajewski
    Umowna granica kosmosu to tak zwana linia Karmana, przebiegająca na wysokości stu kilometrów. Co ciekawe, już pół wieku temu Polacy zdołali się o nią otrzeć. Na przełomie lat 60. i 70. polskie rakiety programu Meteor osiągnęły pułap graniczący z linią Karmana. Było to niezwykłe jak na tamte czasy osiągnięcie. Niestety, polski program rakietowy zarzucono. Dziś są jednak szanse, by powtórzyć tamten sukces.
  ageRating: 7
  genre:
  - '35'
