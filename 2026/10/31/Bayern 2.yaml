  description: "17.05 Die Entscheidung. Momente, die alles verändern\nTrump nahm ihr den Job weg. Jetzt kämpft sie gegen ihn | Extra\nFast 30 Jahre lang hat Anne in der US-Entwicklungshilfe gearbeitet. Dann verliert sie wegen Trump ihren Job. Dieser Moment verändert alles: Sie wird zur Aktivistin. Sie ist bei den \"NoKings\"-Demos gegen Trump dabei, kämpft gegen ICE-Razzien und macht Haustürwahlkampf für die Demokraten. Ihre Hoffnung sind die Midterm-Wahlen Anfang November.\nHost Christine Auerbach und ARD-Washington Korrespondent Ralf Borchard fragen sie und sich: Können wütende Menschen wie Anne Trump gefährlich werden? \n\n17.30 Bayern 2 Breitengrad\nARD Auslandsreportage\n\n\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
