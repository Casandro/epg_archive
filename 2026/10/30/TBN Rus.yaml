  title: '"Евангельский Петербург" 2 сезон -- 16+ №2 Аннекирхе'
  subtitle: '"Евангельский Петербург" 2 сезон -- 16+ №2 Аннекирхе'
  description: 'Анненкирхе: между рок-н-роллом и вечностью Санкт-Петербург полон парадоксов, но Анненкирхе - пожалуй, самый яркий из них. Как здание, где когда-то гремели рок-концерты, шумели ночные клубы и работало казино, превратилось в одно из самых притягательных арт-пространств города, сохранив при этом статус действующего храма? История этого места напоминает захватывающий сериал: здесь крестили Карла Фаберже, венчались великие мастера, а в советские годы стены "Спартака" видели всё - от кинопоказов до андеграундных тусовок. Сегодня Анненкирхе - это пространство, где обгоревшие после пожара своды соседствуют с современным искусством, а органная музыка звучит для тех, кто привык к ритмам мегаполиса. В этом выпуске мы исследуем феномен "церкви без барьеров". Настоятель Евгений Раскатов расскажет, как команде храма удалось разрушить стереотипы и сделать порог церкви "ниже", чтобы каждый - от туриста до скептика - чувствовал себя здесь своим. Как удается балансировать на грани светского перформанса и духовного поиска? Почему именно здесь, во дворике из фильма "Брат", сегодня ищут ответы на главные вопросы бытия? Приглашаем вас заглянуть за кулисы места, которое доказало: дух храма сильнее любых исторических потрясений.'
