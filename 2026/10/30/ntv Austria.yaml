  subtitle: Auf der Flucht
  description: Josef Mengele wird nach dem Krieg von den Alliierten freigelassen und lebt unerkannt in Südamerika. Nach der Verhaftung Eichmanns durch den Mossad taucht er in Brasilien unter und bleibt bis zu seinem Tod 1979 unentdeckt.
