  title: Josef Mengele - Der Todesarzt von Auschwitz
  subtitle: Wie alles begann
  description: Eine Untersuchung von Mengeles Jugend zeigt die Verbindung zwischen medizinischer Wissenschaft, akademischen Kreisen und den Grundlagen des Nazismus, insbesondere der Eugenik. Mengele setzt diese Ideologien skrupellos in Auschwitz um.
  genre:
  - '129'
- eventId: 1011931
  start: 2026-10-30T00:55:00Z
  stop: 2026-10-30T01:40:00Z
  title: Josef Mengele - Der Todesarzt von Auschwitz
  subtitle: Dunkle Verbrechen
  description: Josef Mengele, bekannt als der Todesengel von Auschwitz, führte schreckliche Experimente durch. Historische Forschung und Überlebendenberichte decken seine täglichen Aufgaben und die Verbindungen zum deutschen akademischen System auf.
  genre:
  - '129'
- eventId: 1013171
  start: 2026-10-30T01:40:00Z
  stop: 2026-10-30T02:25:00Z
  title: Josef Mengele - Der Todesarzt von Auschwitz
  subtitle: Auf der Flucht
  description: Josef Mengele wird nach dem Krieg von den Alliierten freigelassen und lebt unerkannt in Südamerika. Nach der Verhaftung Eichmanns durch den Mossad taucht er in Brasilien unter und bleibt bis zu seinem Tod 1979 unentdeckt.
  genre:
  - '129'
- eventId: 1015247
  start: 2026-10-30T02:25:00Z
  stop: 2026-10-30T03:10:00Z
  title: Nachkriegsjahre
  subtitle: Berlin nach dem Zweiten Weltkrieg
  description: Im Sommer 1945 liegt Berlin in Trümmern. Wie in ganz Deutschland leben hier viele Jugendliche, die ihre Eltern verloren haben. Verwahrlost und gewaltbereit haben sie gelernt, um jeden Preis zu überleben, schließen sich zu Banden zusammen.
  genre:
  - '129'
- eventId: 1016195
  start: 2026-10-30T03:10:00Z
  stop: 2026-10-30T03:55:00Z
  title: Nachkriegsjahre
  subtitle: Hamburg nach dem Zweiten Weltkrieg
  description: 'Hamburg im Januar 1947: Es ist der kälteste Winter des Jahrhunderts. Die Menschen sind Hunger und Frost schutzlos ausgeliefert. Alles dreht sich nur ums Überleben. Die deutsche Nachkriegsgesellschaft ist von Gewalt geprägt.'
  genre:
  - '129'
