  title: Stunde Null - Berlin im Sommer 1945
  subtitle: Stunde Null - Berlin im Sommer 1945
  description: Am 8. Mai 1945 unterzeichnete Generalfeldmarschall Wilhelm Keitel in Berlin-Karlshorst die deutsche Kapitulation. Das Ende des "totalen Krieges" und des "Dritten Reiches" brachte gemischte Gefühle - Niederlage oder Befreiung? Die "Stunde null" brachte Erleichterung, doch Trauer und die Aussicht auf Jahre der Not prägten die Zeit nach dem Krieg.
