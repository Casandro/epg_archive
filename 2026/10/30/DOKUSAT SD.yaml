  title: Wildes Überleben - Tierische Kommunikation
  subtitle: Wildes Überleben - Tierische Kommunikation
  description: '"Tierische Kommunikation": Geräusche, Gesten, Farben und sogar Gerüche - die Sprache der Wildnis ist facettenreich. Im Lauf der Evolution haben manche Tiere und Pflanzen unseres Planeten faszinierende Methoden entwickelt, um Signale zu versenden und miteinander in Kontakt zu treten. Ob es darum geht, Feinde in die Flucht zu schlagen oder Beute anzulocken, ob bei der gemeinsamen Jagd oder der Koordination ganzer Völker - die Signale der Wildnis zu verstehen, ist für viele Arten existenziell.'
