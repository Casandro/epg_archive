  title: Helden der Evolution - Pinguine
  subtitle: Helden der Evolution - Pinguine
  description: Ob watschelnd, hüpfend oder schwimmend, die 18 Vertreter der allseits beliebten Pinguinfamilie sind skurril und doch vornehm anzusehen. Die torpedoförmigen, flugunfähigen Seevögel im schwarz-weißen Frack sind treu ergebene Partner, aufopfernde Eltern und schlaue Jäger. Es ist ein spektakulärer Anblick, wenn sie sich zu Hunderttausenden in Kolonien zusammenfinden.
