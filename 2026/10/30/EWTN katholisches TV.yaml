  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Die Sehnsucht nach mehr - Teil 2
  description: |-
    Anna Diouf im Gespräch mit Christina und Tabea Blischke
    Teil 2

    Mutter und Tochter finden gemeinsam zur Katholischen Kirche: Im zweiten Teil über den Konversionsweg von Christina und Tabea Blischke spricht Anna Diouf mit der Tochter über ihren Weg: Während des Studiums in Frankreich wird sie auf den kürzlich gewählten "deutschen Papst" Benedikt XVI. angesprochen, und stellt fest, dass sie nichts über ihn weiß - also beginnt sie, zu lesen. Mit der theologischen Welt, die er ihr eröffnet, schließt sich ein Kreis: Die Suche nach einem Mehr, die schon in ihren Kindertagen begonnen hatte
  widescreen: true
