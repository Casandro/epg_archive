  title: Katholizismus
  subtitle: Gebet und das Leben des Geistes
  description: 'In dieser Folge erforscht Bischof Barron die katholische Spiritualität und Praxis, deren Kern das Gebet ist. Wie der Katechismus der Katholischen Kirche sagt: ''Das Gebet ist das Erheben des Geistes und des Herzens zu Gott.'''
  widescreen: true
