  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Das Heilige Grab - Vom ersten Geheimnis des glorreichen Rosenkranzes
  description: 'Kaum ein Ort im Leben Jesu ist so gut belegt wie die Grabanlage, in die man Jesus hineingelegt hatte: es ist der Ort der Auferstehung Jesu Christi. Das leere Grab in Jerusalem ist  der Ort, an dem Christus ein für allemal den Tod besiegt hat. Deswegen dürfen wir Menschen auf ein ewiges Leben in Fülle  hoffen. Paul Badde folgt den Spuren Jesu im Heiligen Land.'
  widescreen: true
