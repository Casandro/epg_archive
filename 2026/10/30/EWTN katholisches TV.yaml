  title: Bericht aus Genf - mit Christian Peschken
  subtitle: '"Migration zwischen Grenzen und Menschenwürde: Wo steht die Kirche?"'
  description: |-
    Migration gehört zu den großen politischen und gesellschaftlichen Herausforderungen unserer Zeit. Dabei beginnt die Debatte bereits bei den Begriffen: Flüchtlinge, Migranten und Asylsuchende werden im öffentlichen Diskurs häufig miteinander gleichgesetzt - obwohl es sich um unterschiedliche Kategorien mit unterschiedlichen rechtlichen Voraussetzungen handelt.
    Gleichzeitig stellt sich eine grundsätzliche Frage: Wie kann Migration so gestaltet werden, dass sie sicher, legal und geordnet erfolgt? Welche Verantwortung tragen die Herkunfts- und Aufnahmeländer - und wie lässt sich dabei die Würde jedes einzelnen Menschen schützen?
  widescreen: true
- eventId:
  - 1034938
  - 667483
  start: 2026-10-30T16:15:00Z
  stop: 2026-10-30T16:30:00Z
  title: Kirche in Not - Spirit
  subtitle: Wie betet man richtig?
  description: |-
    Mit: Pater Dr. Anton Lässer CP, Internationaler Kirchlicher Assistent von KIRCHE IN NOT (ACN)
    Moderation: Volker Niggewöhner

    Viele Menschen sehnen sich nach einer echten Verbindung mit Gott, erleben das Gebet jedoch oft als frustrierende Einbahnstraße oder wissen schlicht nicht, wie es geht. Gibt es ein Geheimnis für ein erfülltes Gebetsleben, das den Alltag verändert? Pater Anton Lässer CP bricht das vermeintlich verstaubte Thema radikal auf und zeigt, warum das tägliche Gespräch mit Gott die ultimative Kraftquelle ist.
  widescreen: true
