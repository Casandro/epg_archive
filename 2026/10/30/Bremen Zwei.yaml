  title: Gesprächszeit
  description: Axel Brill hat Gedächtnislücken, was seine Kindheit voller Gewalt betrifft. Sein Zuhause war für ihn nur ein Ort zum Essen, Schlafen und Überleben. In der Jugend ist er auf die schiefe Bahn geraten, doch sein erster eigener Hund Voodoo, ein Pitbull, hat ihn auf den rechten Weg zurückgeholt. Er hat seine Schulabschlüsse nachgeholt und mehrere Ausbildungen gemacht - bis er seine Leidenschaft zum Hundetraining entdeckt hat. Heute betreibt der 53-Jährige eine Hundeschule in Weyhe.
