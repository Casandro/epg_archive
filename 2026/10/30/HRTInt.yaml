  title: Izvan formata
  subtitle: ' '
  description: Kako izgleda grad kada ga ne promatramo kroz znamenitosti, nego kroz mjesta na kojima ljudi žive, rade i čuvaju osjećaj pripadnosti? U novom ciklusu Café Vienna slikar Stipan Tadić ispisuje drukčiju, migrantsku kartu Beča. Umjesto turističkih razglednica, slika kafiće balkanske dijaspore, pekarnice, grill-restorane i autobusne terminale - mjesta susreta različitih kultura, očuvanja identiteta i isprepletanja osobnih i kolektivnih priča. Nakon Zagreba i New Yorka, s Tadićem razgovaramo o umjetnosti, migracijama, identitetu i gradovima koji nas oblikuju. Otkrivamo i zašto su underground strip i sloboda izvan klasičnih slikarskih konvencija obilježili njegov umjetnički put. O ciklusu Café Vienna i sudjelovanju na međunarodnom sajmu suvremene umjetnosti Parallel Vienna, govore kustosica Vanja Žanko te novinarka i publicistica Ivana Dragičević.
