- eventId: 742787
  start: 2026-10-30T05:49:00Z
  stop: 2026-10-30T06:30:00Z
  title: Dolina sunca, serija (31/210)
  subtitle: ' '
  description: 'Ivan i Adela iznenađeni su Kristijanovom odlukom o napuštanju firme, i dok ga Adela moli da razmisli, Ivan je sretan što je njegov sin napokon pokazao zube. Sonja zabrinuto govori Juranu da je vidjela Ivana kako pokušava stati na noge. Eva spomene utučenom Andriji kako Robert koketira ne samo s Julijom, već i s njezinom sestrom. Juran teško skriva zadovoljstvo zbog Kristijanovog odlaska iz firme, ali mu to zadovoljstvo splasne kad čuje Ivanov i Kristijanov razgovor. Izazvan Robertovim komentarima, Andrija ga ljubomorno napadne i zaprijeti mu. Iako joj je Loreta rekla da pripremaju dobrotvorni nogometni turnir, Višnji je sumnjivo što fra Ante i Lada petljaju zajedno po cijele dane. Adela moli Kristijana da se vrati jer mu je ovo prilika da izbori svoje uvjete, ali Kristijan joj kaže da ni sam ne zna koji bi to uvjeti bili. Stela ne skriva pred drugima da joj se sviđa Robert i otvoreno ga zavodi. Ivan se iznenadi kad čuje da Kristijan želi udio u firmi s kojim će poslovati po svome. Sofija se zahvali Nikoli što zbog krađe nije otpustio Karla, a to dodatno razljuti Ružu. Nakon napetog razgovora s Ivanom Kristijan se opusti u pivnici, te na izlasku nespretno naleti na Evu. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
