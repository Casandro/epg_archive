  stop: 2026-10-30T17:39:00Z
  title: U Ražancu, za Gospu Luzaricu, pučka i predajna kultura
  subtitle: ' '
  description: Gospa od Ružarija ili Luzarija slavi se na spomen Lepantske bitke, koja se odigrala 7. listopada 1571. U Ražancu je to važan dan, jer je Gospa Luzar'ca, kako je ondje zovu, zaštitnica njihovog mjesta, pa je to ondje velika mjesna, ali i lokalna svetkovina. Obilježavaju je prve nedjelje u listopadu, tj. uoči 7. X. No, nadolazeći se blagdan već tjedan dana ranije najavljuje loncijanjem, posebnim načinom ručnog zvonjenja, izravno s batovima zvona, bez uporabe konopaca, a samog dana svetkovine, unutar svečanog misnog slavlja održava se i procesija po mjestu, pri čemu se okite kuće pored kojih prolazi. Na tom se putu naprave, tj. ukrase i četiri vanđelišta, mjesta na kojima procesija stane, da bi se pročitalo nešto iz evanđelja. Tog dana Ražančancima dolaze i mnogi gosti, pa valja i urediti kuće, kao i pripremiti svečani ručak, na koji će, nakon igranja kola poslije mise i procesije, svi rado prionuti...
