  title: Beziehungskiste
  subtitle: Hochsensible Mütter
  description: "Für hochsensible Mütter kann der Familienalltag mit Kind eine Herausforderung sein. \nMit Brigitte Küster, Gründerin des Instituts Hochsensibilität.\n\nEin Kind zu haben, sorgt für eine Flut von Wahrnehmungen und Gefühlen. Wie man den Alltag stressfreier gestalten kann und was hochsensible Mütter brauchen, um aufzublühen, erklärt Brigitte Küster. Der Weg dahin führt über das Verstehen dieser hochkomplexen Veranlagung. \nBuchtipp: Hochsensible Mütter. Von Brigitte Schorr. SCM Verlag, 2013. (8. Auflage 2019)\n\nWeitere Informationen: www.hopetv.de"
