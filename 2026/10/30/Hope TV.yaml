- eventId: 1026782
  start: 2026-10-30T01:25:00Z
  stop: 2026-10-30T01:55:00Z
  title: ERF Mensch Gott
  subtitle: Wenn Vertrauen zerbricht
  description: |-
    Meine Mama hat mich im Stich gelassen - dieser Schmerz brennt sich als Kind in ihr Herz ein. In einer für Melanie furchtbaren Notlage stellt sich die Mutter zu ihrem Partner und nicht zu ihr. Melanie lernt: Ich kann mich auf niemanden verlassen. Gleichzeitig sehnt sie sich nach Liebe. Als eine langjährige Freundschaft zu Ende geht, stürzt sie das in eine tiefe Krise. Sie will Vertrauen ins Leben zurückgewinnen, doch hat keine Idee, wie das gehen kann. Bis sie in einem Buch einen Hinweis findet.

    Weitere Infos: www.hopetv.de
  widescreen: true
  hd: true
