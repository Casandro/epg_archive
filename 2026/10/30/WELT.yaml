  title: Lost Places - Folge 102
  subtitle: Lost Places - Folge 102
  description: 'Das Dew Drop Inn in New Orleans, in dem R&B-Größen wie Ray Charles, Little Richard und Ella Fitzgerald auf der Bühne standen, ist nicht nur ein wichtiger Fixpunkt der US-amerikanischen Musikgeschichte. Sein Gründer Frank G. Painia schuf mit dem legendären Hotel und Club in den 1950er Jahren auch einen sicheren Ort für reisende Afroamerikaner in den Südstaaten und einen Treffpunkt der frühen LGBT+-Szene. Außerdem: Eine Reise in eine Zeit, in der Gewürze wie Muskatnuss wertvoller waren als Gold.'
