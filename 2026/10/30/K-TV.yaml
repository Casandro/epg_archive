  title: Das Himmlische Jerusalem (Folge 1)
  subtitle: Spiritualität
  description: Der Weg der Heiligkeit führt uns in das Himmlische Jerusalem, die große Gemeinschaft der Engel und Heiligen. Verschiedene Heilige durften schon einen Blick in den Himmel werfen. Wir wollen in dem Seminar diese Einblicke tiefer betrachten und auch den Weg, der dorthin führt. Wenn wir unser Lebensziel, den Himmel, kennen, dann werden wir unser Leben auch anders gestalten. Uns erwartet nur Freude und Glück. Dafür lohnt es sich, zu leben. Exerzitien mit DDr. Gottfried Prenner. Aufgezeichnet im November 2025, Haus St. Ulrich in Hochaltingen.
