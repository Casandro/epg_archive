  title: 'Über Gott und die Welt: Das Fest Allerheiligen'
  subtitle: Gespräch
  description: 'Eine Erinnerung, dass unser Lebensziel der Himmel ist: Martin Leitner, Direktor des Priesterseminars Leopoldinum Heiligenkreuz, erzählt im Gespräch an der Phil.-Theol. Hochschule Benedikt XVI. Heiligenkreuz über die Ursprünge und die Bedeutung des Festes Allerheiligen.'
- eventId: 757986
  start: 2026-10-30T16:30:00Z
  stop: 2026-10-30T17:00:00Z
  title: 'Thema: Märtyrer, Glaubenszeugen ... und ich? Hingabe - Der Weg zur Heiligkeit im Alltag (2)'
  subtitle: Spiritualität
  description: 'Pater Dr. Anton Lässer CP, Internationaler Kirchlicher Assistent von KIRCHE IN NOT (ACN)Was macht einen Märtyrer aus? Für Pater Anton Lässer beginnt das Martyrium nicht erst mit dem Tod, sondern mit der Entscheidung, Christus nachzufolgen. An Beispielen aus der Weltkirche zeigt er, wie Menschen ihren Glauben unter schwierigen Bedingungen leben und bezeugen. Im Mittelpunkt steht dabei die christliche Hingabe: die Bereitschaft, sich Gott und den Mitmenschen zu schenken. Ein Vortrag über Jüngerschaft, Heiligkeit und die Frage, wie jeder Christ zum Glaubenszeugen werden kann.'
- eventId: 757987
  start: 2026-10-30T17:00:00Z
  stop: 2026-10-30T17:30:00Z
  title: 'Medizin mit Tiefgang: Komplementärmedizin'
  subtitle: Gespräch
  description: 'Komplementäre Heilmethoden haben heute nicht nur in der Onkologie einen festen Platz. Im Gespräch mit Dr. Claudia Kaminski erläutert Prof. Dr. Christoph von Ritter, warum Ernährungsmedizin ein Schlüssel zur Komplementärmedizin ist - etwa bei entzündlichen Darmerkrankungen oder zur Reduktion von Durchfällen. Er plädiert für eine sinnvolle Verbindung von Schulmedizin und alternativen Ansätzen, stets in enger Abstimmung mit dem behandelnden Arzt. Auch die Hildegard-Medizin kommt zur Sprache: eine spannende Brücke zwischen praktischem medizinischem Handeln und spiritueller Tiefe.'
