  title: 'Gesichter der Weltkirche: "Russland, mein Kindertraum" - Als Seelsorger in der östlichsten katholischen Pfarrei Europas'
  subtitle: Gespräch
  description: Seit fast 25 Jahren lebt und wirkt der aus dem Allgäu stammende katholische Priester Erich Maria Fink in Beresniki, einer Stadt am Ural, im äußersten Osten Europas. Wie er dort hingelangte, was ihn antreibt, welche Hoffnungen, Sorgen und Pläne er in Russland hat, berichtet er im Gespräch mit Volker Niggewöhner.
