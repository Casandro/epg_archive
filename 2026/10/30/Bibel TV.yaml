  title: Antworten mit Bayless Conley
  subtitle: Menschliche Maßstäbe und großer Glaube
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wie erhält man einen beharrlichen Glauben, der auch dann dranbleibt, wenn eine Situation aussichtslos erscheint? Auf seine seelsorgerliche Art zeigt Bayless Conley anhand von Markus 7, wie leicht menschliche Maßstäbe den Blick auf Gottes Wahrheit verstellen und den Glauben schwächen können. Gleichzeitig wird das Beispiel einer Frau beleuchtet, deren fester Glaube sämtliche Hindernisse überwindet, und erklärt, was einen großen Glauben ausmacht und wie dieser im Leben wachsen kann.'
