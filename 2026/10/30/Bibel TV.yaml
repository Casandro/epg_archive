  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wie erhält man einen beharrlichen Glauben, der auch dann dranbleibt, wenn eine Situation aussichtslos erscheint? Auf seine seelsorgerliche Art zeigt Bayless Conley anhand von Markus 7, wie leicht menschliche Mastbe den Blick auf Gottes Wahrheit verstellen und den Glauben schwchen knnen. Gleichzeitig wird das Beispiel einer Frau beleuchtet, deren fester Glaube smtliche Hindernisse berwindet, und erklrt, was einen groen Glauben ausmacht und wie dieser im Leben wachsen kann.'
