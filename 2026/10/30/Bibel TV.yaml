  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Wort Gottes zu verbreiten sieht Martin Dreyer als seine Berufung. Mit den Jesus-Freaks und der Volxbibel hat er dabei bereits Erfolg gehabt. Auch auf Bühnen ist er ein gefragter Prediger. Doch seine Arbeit wird zur Qual, als Panikattacken ihn immer strker beim Predigen behindern. Im Gesprch mit Wolfgang Severin spricht Martin Dreyer ber die Erkenntnis, Gott seine Panik anzuvertrauen und nicht vor ihr wegzulaufen und wie ihm dies dabei geholfen hat, die Angst in den Griff zu bekommen.'
