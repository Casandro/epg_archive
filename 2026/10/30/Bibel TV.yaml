  title: Bibel TV Das Gespräch
  subtitle: 'Martin Dreyer: Der Panik-Pastor'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Wort Gottes zu verbreiten sieht Martin Dreyer als seine Berufung. Mit den Jesus-Freaks und der Volxbibel hat er dabei bereits Erfolg gehabt. Auch auf Bühnen ist er ein gefragter Prediger. Doch seine Arbeit wird zur Qual, als Panikattacken ihn immer stärker beim Predigen behindern. Im Gespräch mit Wolfgang Severin spricht Martin Dreyer über die Erkenntnis, Gott seine Panik anzuvertrauen und nicht vor ihr wegzulaufen und wie ihm dies dabei geholfen hat, die Angst in den Griff zu bekommen.'
