  description: 'Das französische Burgund: ein ideales Reiseziel für Naturliebhaber und Genießer. Es locken Weine von den bekanntesten Lagen der Welt und zum Beispiel die hoch geschätzten Burgundertrüffel.  Hier verbinden sich Genuss, Geschichte und "Savoir Vivre" auf einzigartige Weise. Für Wunderschön macht Judith Rakers eine kulinarische Entdeckungstour inmitten malerischer Landschaft mit charmanten Dörfern und mittelalterlichen Städten. Auf Judith warten die weltbekannten Weinbaugebiete von Côte-d''Or, romantische Städte und Dörfer, ein riesiger Naturpark und zahlreiche kulinarische Highlights.'
