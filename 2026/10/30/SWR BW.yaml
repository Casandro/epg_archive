  description: |-
    Julia pfeift darauf, wie ihre Altersgenossinnen in der tristen Banlieu, in der sie lebt, vor allem den Jungs gefallen zu wollen. Sie interessiert sich für Bikes - schwere, schnelle Motorräder. Natürlich hat Julia nicht die Kohle für eine solche Maschine, dafür kennt sie alle Tricks, um sich eine zu besorgen.

    Wie besessen kämpft sie in der männerdominierten Welt der Bikergangs um Anerkennung. Dafür setzt sie nicht nur bei illegalen Rennen ihr Leben aufs Spiel, sondern dient einer kriminellen Gruppe sogar ihre Unterstützung als Fahrerin an. Doch dann verliebt sie sich ausgerechnet in Ophélie, die Frau von Gangboss Domino.
