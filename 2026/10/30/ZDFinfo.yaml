  title: Kim Yo-jong - Nordkoreas heimliche Herrscherin
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2023
    Kaum jemand kennt Kim Yo-jong, die Schwester von Kim Jong-un, dem Diktator Nordkoreas. Doch seit den Olympischen Spielen in Südkorea 2018 ist sie zur Nummer zwei des Regimes aufgestiegen.

    Sie beeindruckte bei offiziellen Empfängen durch sicheres, freundliches Auftreten an der Seite ihres Bruders. Ihre inzwischen jedoch unerbittlichen Propagandamaßnahmen machten die vorübergehende Entspannung zwischen Nord- und Südkorea wieder zunichte.
    HD-Produktion
