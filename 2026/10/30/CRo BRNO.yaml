  description: 'Host: veterinář Milan Štourač o tom, když mazlíčci navždy odcházejí. Odchod domácího mazlíčka na věčnost je těžkou chvílí pro každého chovatele. Veterinář Milan Štourač se zaměří na situace, kdy už není zvířatům pomoci. Poradí, jak situaci zvládnout, jaká rozhodnutí přijmout a kdy, a také co udělat s ostatky. Moderuje Zdeněk Truhlář.'
