  title: Na pěknú notečku
  description: Nové nahrávky BROLNu. Na jaře tohoto roku vznikly v brněnském studiu Českého rozhlasu zbrusu nové nahrávky Brněnského rozhlasového orchestru lidových nástrojů a jeho sólistů. Orchestr řídil Petr Varmuža a snímky vznikly v dramaturgii Pavla Trkana, v hudební režii Martina Zemana a s technickou spoluprací Michala Zelinky. S orchestrem si zazpívali například Kamila Tomšejová, Alexandra Pokorná, Aleš Smutný, Michal Janošek, Eva Třasoňová či Ondřej Kocourek. Pořad připravil Jaroslav Kneisl.
