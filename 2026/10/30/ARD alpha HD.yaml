  audiodesc: true
  description: Dagobert Lindlau interviewt Professor Max Horkheimer und fragt ihn zunächst, ob man im Kampf für die Freiheit wirklich mit allen Mitteln kämpfen darf. Eine weitere Frage ist, ob es nach Meinung von Horkheimer in Deutschland immer noch eine faschistische Gefahr gebe. Im Zuge dieser Antwort warnt Horkheimer vor einem neu auftauchenden totalitären Zeitalter. Er plädiert dafür, die Lehrer besser auszubilden, um die Schülerinnen und Schüler besser darin unterrichten zu können, was Demagogie bedeutet.
