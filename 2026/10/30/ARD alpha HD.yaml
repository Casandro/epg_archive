  title: 'Back on Stage: Keziah Jones'
  subtitle: BR Retro - Alabama in Concert
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Perkussives Gitarrenspiel, zum Teil auf einer Akustikgitarre mit nur zwei Saiten, ist das Markenzeichen von Keziah Jones. Aus Blues und Funk entwickelt der nigerianische Musiker seinen eigenen Stil, den er 'Blufunk' nennt. Mit seinem zweiten Album "African Space Craft" tritt er 1995 in der Münchner Alabamahalle auf.

    Jahrzehntelang lagerten die Mitschnitte von Kultsendungen wie "Alabama in Concert", "Schlachthof in Concert" oder "Nachtwerk in Concert" in den Archiven des Bayerischen Rundfunks - sie waren der Soundtrack einer ganzen Generation. "Back on Stage" hebt diese musikalischen Schätze und holt sie zurück ins Fernsehen.
