  title: In Familia Dei
  subtitle: Religijski
  description: Što čini brak snažnim i kako ljubav, vjera i međusobno povjerenje pomažu u prevladavanju životnih izazova? U novoj emisiji In familia upoznajemo Marinu i Olivera Kneževića, koji iza sebe imaju 31 godinu bračnog života i troje djece. S nama će podijeliti priču o svojoj mladosti, iskustvu vjere i duhovnom putu, prisjetiti se mjesta na kojem su se prvi put susreli te otkriti kako su prepoznali da su jedno za drugo. Govorit će i o tome kako je Oliverov život s invaliditetom utjecao na njihov odnos i zajednički put. Kroz njihovo svjedočanstvo otkrivamo kako se ljubav gradi i čuva kroz godine te kako vjera može biti čvrst oslonac u svim životnim okolnostima.
