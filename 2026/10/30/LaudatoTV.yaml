  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Na dan kad je Isus kršten, Duh Sveti ga je pomazao. Odmah nakon tog događaja, Duh Sveti vodi Isusa u pustinju. Pustinja je bila mjesto izolacije, smrti i poraza, ali Isus je bio vođen u pustinju kako bi se to zauvijek promijenilo. Tako da to postane mjesto milosti. Duh je vodio Isusa u pustinju i štitio ga i brinuo za njega dok je bio tamo. Pustinja je dio života svakog kršćanina, ali ne treba biti mjesto očaja i izolacije. Duh Sveti je prisutan u pustinjama života i kada doživljavamo njegovu prisutnost ona mijenja naš duhovni život. Pustinja nije više mjesto kojeg se treba bojati već može postati mjesto dubokog susreta s Isusom.
