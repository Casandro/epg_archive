  title: Hausmeister Krause - Ordnung muss sein Dackel kross süß-sauer
  subtitle: Hausmeister Krause - Ordnung muss sein Dackel kross süß-sauer
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. Bei den Krauses fehlt es  in dieser Episode hinten und vorne: Mutter Lisbeth wird das Haushaltsgeld knapp, den Kindern das Taschengeld. Nur einer lebt in Saus und Braus, wird verwöhnt mit Leckereien und Vergünstigungen: Bodo, Hausmeister Krauses Lieblings-Dackel. Der Zorn der Familie steigert sich zum Wahnsinn: Bodo muss weg! Ein Glück, dass ein Chinese auftaucht, um für seinen Imbiss "Shanghai" zu werben. Er liebt nämlich Hunde ...'
  widescreen: true
