  title: WDR 3 Konzert
  subtitle: Game on Symphony
  description: |-
    Schon seit vielen Jahren bringt das WDR Funkhausorchester mit großer Leidenschaft Videospiel-Musik live zum Klingen. Passend zur Gamescom hob das Orchester diesmal Klangwelten zwischen düsteren Fantasy-Reichen und Open Worlds auf die Konzertbühne. Von "Baldur's Gate 3" bis "Starfield", von "Anno 117" bis "Zelda": Mal wuchtig und spannungsgeladen, mal leise und berührend, machen sinfonische Epen große Abenteuer hörbar.
    <strong>WDR Funkhausorchester</strong><br/>Moderation: <strong>Theres "Sissor" Modl</strong><br/>Moderation: <strong>Fridl Achten</strong><br/>Leitung: <strong>Ben Palmer</strong>
    Aufnahme vom 29. August 2026 aus dem WDR Funkhaus, Köln
    Moderation: Johannes Zink<br/>Redaktion: Michael Breugst
