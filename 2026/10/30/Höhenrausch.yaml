  title: Bergwelten - Die Karawanken - unterwegs im wilden Süden
  subtitle: Bergwelten - Die Karawanken - unterwegs im wilden Süden
  description: Die Karawanken sind ein wildes, naturbelassenes 100km langes Grenzgebirge, welches touristisch kaum erschlossen ist. Wer die Abgeschiedenheit der Natur sucht findet hier jeden Tag neue Abenteuer. Ein Eldorado für Kletterer wie Thomas Brandauer und Gerald Sagmeister, welche 35 Jahre später eine Wiederholung ihrer Erstbegehung am Koschutaturm wagen. Niki Sagmeister und Mona Salmina kehren nach ihrem Studium in Innsbruck nach Kärnten zurück und begeben sich auf Entdeckungsreise durch die heimatlichen Berge. Bergwandern, alpine Mehrseillängen Touren, Trail Running von Slowenien nach Kärnten, Mountain Bike Fahren unter Tage in den ehemaligen Bergwerks Stollen der Petzen, Canyoning in der Tscheppaschlucht und vor allem die unberührte und landschaftliche Vielfalt zeigen was für ein alpines Juwel im Süden von Kärnten existiert.  AT 2022
