- eventId: 770037
  start: 2026-10-30T00:20:00Z
  stop: 2026-10-30T00:45:00Z
  title: Entdecker der Welt - Onekotan
  subtitle: Entdecker der Welt - Onekotan
  description: 'Entdecker der Welt: Onekotan ist eine abgelegene Insel mit einem eingestürzten Vulkan in ihrer Mitte, an der Küste von Kamtschatka, Russland. Es ist einer der abgeschiedensten Orte auf der Welt. Das Wetter ist grimmig und unvorhersehbar. Die Lebensbedingungen sind so schwierig, dass die Insel unbewohnbar ist. Für die Freerider Matthias Haunholder, Phil Meier und Matthias Mayr ist es die ultimative Skitour-Expedition. RU 2015'
- eventId: 770038
  start: 2026-10-30T00:45:00Z
  stop: 2026-10-30T01:45:00Z
  title: Symphonie auf Skiern
  subtitle: Symphonie auf Skiern
  description: Eine abenteuerliche Skitour von zwei Schwestern, die den Spuren ihres Vaters über die unberührte Naur von Neuseeland folgen. Vor 30 Jahren machte sich Gottlieb Braun-Elwert zu einer unglaublichen Expedition auf. Er durchquerte die gewaltigen Gletscher der Südalpen, die sich über eine Länge von 40 Kilometern und eine Höhe von 4000 Metern erstrecken, vom Herzen der Südinsel bis zu der Westküste in nur 18 Stunden. Eine Reise voll atemberaubender Schönheit, grenzenloser Freiheit, wunderschönen Ausblicken und der Herausforderung, sich mit der ungebändigten Wildnis auseinanderzusetzen. Er nannte die Reise "Symphonie auf Skiern". Jetzt beginnen seine Töchter Carla, Elke und ein kleines Team von Abenteurern die gleiche Tour. Dieser Film ist eine Hommage an ihren Vater, der das Gefühl von Liebe und ein Zuhause in den Südalpen von Neuseeland fand.  DE 2017
- eventId: 770039
  start: 2026-10-30T01:50:00Z
  stop: 2026-10-30T02:40:00Z
  title: Faszination Heimat - Der Arche-Bauer und sein Vieh
  subtitle: Faszination Heimat - Der Arche-Bauer und sein Vieh
  description: Thomas Strubreiter ist Arche-Bauer. Er hat sich und sein Leben der Erhaltung heimischer Nutztierrassen verschrieben, die vom Aussterben bedroht sind. Tiere, die seit Jahrhunderten den Menschen das Überleben im Alpenraum gesichert haben. Für den Bauern sind die bedrohten Rassen ein Stück österreichisches Kulturgut. Der Film begleitet einen Sommer auf der Alm und portraitiert einen Mann, dessen größte Leidenschaft seine Tiere sind. AT 2013
- eventId: 770040
  start: 2026-10-30T02:40:00Z
  stop: 2026-10-30T03:27:00Z
  title: Heimatleuchten - Käse, Kühe und ein Klavier - Almsommer in Tirol
  subtitle: Heimatleuchten - Käse, Kühe und ein Klavier - Almsommer in Tirol
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
