  title: ANIXE auf Reisen - Slawonien 1 mit Oliver Hörner
  description: Mit der Region Slawonien im Nordosten Kroatiens hat sich der beliebte Schauspieler Oliver Hörner diesmal eine weitgehend unbekannte Region Europas als Reiseziel ausgesucht. Doch der langjährige Hauptdarsteller der Fernsehserie "Die Rettungsflieger" fühlt sich sofort wie zuhause. Das liegt erstens an der - historisch bedingten - weiten Verbreitung der deutschen Sprache und zweitens an der unglaublichen Gastfreundschaft. Oliver Hörner beginnt seine Rundreise in der Stadt Osijek mit ihrer beeindruckenden Altstadt. Von dort aus erkundet er mit dem Naturpark "Kopacki rit" eines der größten Sumpfgebiete Europas. In der Region Baranja begeistert sich der Schauspieler an den mühevoll restaurierten Bauernhöfen. Und er begleitet den erfolgreichsten Paprika-Bauern bei seiner Arbeit.
