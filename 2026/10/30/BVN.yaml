  subtitle: S12 E147. Van betonnen doos naar kleurrijk geheel dankzij Theo-Bert, Sharon maakt een ovenschotel met gehakt en pompoenpuree, na een lange zomer op paddenstoelentocht en Lot schildert fijne lijnen op motoren.
  description: Interieurstylist Theo-Bert Pot is in Harmelen waar hij de woonkamer van Lia en Theo opvrolijkt met veel kleur. En dat is hoognodig ook, want volgens zoon Wiljan is het net een 'betonnen doos'. * Sharon bouwt een ovenschotel op; onderin gehakt met kerrie en kaneel, daarover pompoenpuree en kaas. * Na een droge zomer is het spannend welke paddenstoelen in de herfst omhoog gaan komen. Paddenstoelenonderzoeker Ronald gaat op ontdekkingstocht. * Pinstriper Lot schildert met haar linkerhand fijne lijnen. Ze beoefent met precisie het ambacht van pinstriping op bijvoorbeeld motoren en helmen. In de jaren 50 en 60 is dit overgewaaid uit Amerika. (2026)
