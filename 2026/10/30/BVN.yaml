  subtitle: 'Handjes uit de mouwen: Jolisa op de kermis S28 E32. We zien kleuters tijdens één van hun favoriete bezigheden en ze laten zien wat zij leuk en belangrijk vinden.'
  description: In de serie In het ziekenhuis volgen we kinderen die ons meenemen in hun behandelingen. We zien Evi die nieuw gips om haar arm krijgt en Sophie die suikerziekte heeft. Ook Gloria is in het ziekenhuis, zij heeft buisjes in haar oren gekregen. De jongste van het stel is Jill van 5 jaar, Jill heeft kanker, maar gelukkig gaat het weer een stukje beter. Haar bloed wordt gecontroleerd en ze mag het zelf naar het laboratorium brengen. De vrolijke Vince krijgt bezoek van de CliniClowns en ten slotte zien we Amaysa. Zij komt heel vaak in het ziekenhuis en weet overal de weg. (2026)
