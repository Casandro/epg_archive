  title: Shaun das Schaf
  subtitle: Die neue Trillerpfeife
  description: 'Als Bitzer seine alte Trillerpfeife gegen einen digitalen High-Tech Triller ersetzt, beginnen neue Zeiten: Die Hühner picken brav Körner und legen Eier. Die Schweine räumen ihren Stall auf. Die Schafe fressen ohne Umschweife ihr Trockenfutter. Aber dann fällt Bitzer die neue Pfeife auf den Boden, und ab jetzt läuft alles rückwärts.'
