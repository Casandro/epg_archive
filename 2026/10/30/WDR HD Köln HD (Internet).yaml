  stop: 2026-10-30T09:25:00Z
  title: Wer weiß denn sowas?
  subtitle: 'Gäste: Caro Cult und Aylin Tezel'
  description: |-
    Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
    Beide Teams spielen um Bares für ihre Unterstützer. Zu Beginn des Wissensspiels müssen sich die Zuschauer im Studio entscheiden: Setzen sie sich auf die Seite von Superhirn Bernhard Hoëcker oder von Quizmaster Elton?
- eventId: 703661
  start: 2026-10-30T09:25:00Z
  stop: 2026-10-30T10:10:00Z
  title: Mittendrin - Flughafen Frankfurt (58)
  subtitle: '"Ich fliege mit nur einem Bein"'
  description: "Alex Böhmer ist Anfang 20 und arbeitet als Flugbegleiter. Sein Traumjob! Dann plötzlich die Diagnose: Knochenkrebs, Tumor im Knie. Sein Bein muss amputiert werden. Er kämpft drei lange harte Jahre gegen den Krebs, mit einem klaren Ziel vor Augen: Er will zurück ins Flugzeug. Heute arbeitet er wieder als Flugbegleiter. \"Mittendrin\" hat Alex auf einem seiner Flüge begleitet. \n\nEin Film über einen starken jungen Mann, einen Kämpfer gegen den Krebs und für seinen Traum, wieder ganz oben zu sein."
  genre:
  - '112'
- eventId: 704126
  start: 2026-10-30T10:10:00Z
  stop: 2026-10-30T10:55:00Z
  title: WILDER WILDER WESTEN (2/15)
  subtitle: Die besten Zoogeschichten aus NRW
  description: "In der Zoom Erlebniswelt Gelsenkirchen muss Rentierdame Hope heute in Narkose gelegt werden. Ihre Vorderklaue wächst schief und bereitet ihr ständig Schmerzen. Die Zootierärzte wollen sie deshalb kürzen, doch Hope verträgt die Betäubung nicht. Sie wacht nicht auf. Das Zooteam ist sehr besorgt.\nIn der Großfluganlage des Allwetterzoos Münster gedeihen die Gänsegeier prächtig. Alleine in diesem Jahr sind zwei Vögel geschlüpft. Nun müssen die jungen Tiere den Zoo verlassen. Sie sollen in Bulgarien ausgewildert werden. \nIm Aquarium in Münster ist heute Putztag. Darüber freut sich vor allem ein Kuhkofferfisch mit Namen Erbse."
- eventId: 704519
  start: 2026-10-30T10:55:00Z
  stop: 2026-10-30T11:45:00Z
  title: Elefant, Tiger & Co. (443)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    * Ausgang: Bei den Bonobos machen die Männer gerade richtig Alarm.
    * Futterneid im Kindergarten: Seit kurzem sind Andrea und Florian nun im Flamingo Kindergarten. Das Konzept trägt erste Früchte. Die Gruppe aus halbwüchsigen Naturburschen und den jungen Handaufzuchten versteht sich gut.
    * Jeder nur einen: Bei den Pinguinen sollen alle Tiere einen präparierten Fisch mit einer Tablette gegen Vogelmalaria bekommen. Damit Azubi Anne Luise Sänger den Überblick behält, wer schon hat und wer noch nicht, hat sie sich was ausgedacht!
    * Kater in Stimmung: Rascal, der Fischkater, hat es auf Lotte, frisch aus England zugezogen, abgesehen.
