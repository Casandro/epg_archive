  title: Durch die Wildnis - Das Abenteuer Deines Lebens (20/20)
  subtitle: Nordgriechenland
  description: 'Das Abenteuer ist fast zu Ende: Heute dürfen die sechs Abenteurer als Belohnung für ihren Teamgeist, ihren Mut und ihre Durchhaltefähigkeit einen Tag lang Luxus pur genießen. Im Sternehotel werden sie nach allen Regeln der Kunst verwöhnt und mit leckerem Essen versorgt. Sie schwelgen in Erinnerungen an ihren aufregenden Wildnistrip und sind sich sicher, dass die letzten vier Wochen tatsächlich das Abenteuer ihres Lebens sind.'
