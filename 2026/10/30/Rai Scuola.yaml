  title: 'Amarcord- Le Alpi di Messner. Badile: I'
  subtitle: |-
    Amarcord- Le Alpi di Messner. Badile: Il regno di granito - Isole: San Domino - ATTUALITA' - Badile, Il regno di granito" Scritto e diretto da Carlo Alberto Pinelli.
    Il documentario esplora i paesaggi del
  description: |-
    le Alpi Centrali, dalla Bregaglia alla Val Masino, analizzando il granito locale, unico per compattezza, rugosità e verticalità, ideale per l'arrampicata pura. Mostra quindi i rilevamenti del Comitato Glaciologico Italiano e i relativi risultati, per poi documentare i riti festosi dei bambini di marzo, che con corse rumorose nei prati e nei campi celebrano il risveglio della natura dopo l'inverno. A seguire, un programma mai più trasmesso di Sandro Bolchi del 1983. La narrazione è introdotta da Lucio Dalla, frequentatore delle Tremiti fin dall'infanzia. Lo scrittore Pio Fumo illustra quindi la lunga storia medievale e gli insediamenti monastici: ai Benedettini, presenti dall'XI secolo, seguirono Cistercensi e Canonici Lateranensi. San Nicola conserva la millenaria Abbazia di Santa Maria a Mare, con un grandioso polittico ligneo d'altare, una pregevole croce medievale dipinta con il Cristo dagli occhi aperti e preziosi frammenti musivi, accanto alle testimonianze e ai resti di epoca romana. Lucio Dalla ricorda poi il rapporto tra le Tremiti e la propria ispirazione musicale: mare e cielo dell'arcipelago ricorrono nelle sue canzoni, insieme all'incanto e alla magia dei luoghi.
     - ,
