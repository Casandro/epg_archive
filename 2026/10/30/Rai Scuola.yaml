  title: 'Amarcord - Le Alpi di Messner - Isole: F'
  subtitle: |-
    Amarcord - Le Alpi di Messner - Isole: Favignana - Gran Paradiso" Scritto e diretto da Carlo Alberto Pinelli.
    La puntata esplora il massiccio del Gran Paradiso e le sue valli, soffermandosi inizialmente su
  description: "l Castello di Sarre, in Valle d'Aosta, con le macabre decorazioni di corna animali, espressione del gusto e della mentalità provinciale dell'epoca. Ripercorre poi la svolta del 1922, con l'istituzione del Parco Nazionale del Gran Paradiso, primo parco nazionale italiano, concepito come laboratorio per proteggere la fauna alpina minacciata dall'estinzione, in particolare lo stambecco, \nA seguire, un programma mai più trasmesso di Sandro Bolchi del 1983. Ad aprire il racconto è il pittore Salvatore Fiume, che parla della straordinaria luce dell'isola, fonte d'ispirazione della sua pittura, e ne descrive il fascino: il mare, le architetture, le antiche cave di pietra e il caratteristico paesaggio mediterraneo. Un breve richiamo è dedicato alla famiglia Florio, protagonista della grande stagione economica legata alla pesca e alla lavorazione del tonno, e al Palazzo Florio, significativa testimonianza della sua presenza e del suo ruolo nella storia di Favignana.\n - ,"
