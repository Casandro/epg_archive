  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Co můžou školy dělat s agresivními žáky? Ministerstvo školství sestavuje manuál, podle kterého by měli učitelé reagovat na násilné chování žáka. Ve hře je i dočasné vyloučení žáka za školy. Kde je ale hranice mezi bezpečím pro školáky a učitele a právem agresivního žáka na vzdělání? A kde hledat příčiny rostoucí agresivity dětí? Debatovat budou předsedkyně neziskové organizace Society for All Lenka Felcmanová a ředitel odboru předškolního a školního vzdělávání Michal Černý. Moderuje Lucie Vopálenská.
