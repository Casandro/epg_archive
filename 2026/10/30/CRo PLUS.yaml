  description: Izraelské parlamentní volby přinesly nejistotu ohledně budoucí vlády. Většinu křesel v Knesetu podle dosavadních výsledků nezískal ani blok kolem Likudu Benjamina Netanjahua, ani opozice. Podaří se sestavit stabilní vládu, nebo Izraeli hrozí další politický pat a opakování voleb? Jak důležitou roli sehrají arabské strany, které ve volbách výrazně posílily? A znamenal by případný odchod Netanjahua také změnu izraelské politiky vůči Palestincům? Hosty Pro a proti budou dokumentaristka Nataša Dudínská a diplomat a zahraničně politický poradce prezidenta Michael Žantovský. Moderuje Lukáš Matoška.
