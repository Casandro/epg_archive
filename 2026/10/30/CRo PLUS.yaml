  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (11/15) Část jedenáctá: Revoluce 28. a 29. října 1956. V neděli odpoledne bylo oznámeno příměří. Dosud zemřelo kolem 1000 Maďarů a 500 Sovětů a Chruščov už litoval, že k vojenské intervenci došlo. Nagy se konečně pokusil revoluci vést a manévrovat umírněným směrem. Velitel budapešťské policie Sándor Kopácsi se snažil splnit nevděčný úkol spojit bezpečnostní síly státu s rebely a vytvořit Národní gardu, která udrží veřejný pořádek. Maďaři nabývali dojmu vítězství. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
