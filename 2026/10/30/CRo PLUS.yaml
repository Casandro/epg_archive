  description: Petra Verdis,poradkyně rané péče. Při návštěvách rodin s dětmi se sluchovým postižením se setkává i s tím, že o chodu celé domácnosti rozhoduje tříleté dítě. Rodiče totiž někdy ve snaze dítě chránit ustupují natolik, že ztrácejí vlastní autoritu. Jak nastavit hranice, nezapomínat na sourozence a zachovat rovnováhu v rodině, když se do ní narodí dítě s hendikepem? I o tom budou Hovory, moderuje Tatiana Čabáková.
