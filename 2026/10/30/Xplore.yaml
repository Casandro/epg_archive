  title: GlobalTrek - Die Kunst der inneren Reise - Teil 3
  subtitle: GlobalTrek - Die Kunst der inneren Reise - Teil 3
  description: |-
    Nach dem Gipfel des Mount Kinabalu auf Borneo steht ein abenteuerlicher Transport des Zebras auf die indonesische Insel Sumatra an. Dann ergibt sich eine einzigartige Gelegenheit: ein Besuch der Mentawai Indianer auf der vorgelagerten Insel Palau Siberuth. Fern der Zivilisation stößt er auf ein Urzeitvolk mit universellen, menschlichen Werten - ein tiefer Einblick in die Vergangenheit.
     DE 2016
- eventId: 770189
  start: 2026-10-30T12:00:00Z
  stop: 2026-10-30T12:19:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  description: Schauspieler und Tatort-Kommissar Richy Müller hat sich für diese Sendung die australische Ostküste als Ziel gesetzt. In Queensland begibt er sich in einem Wohnmobil auf eine Reise entlang der Nature Coast. Eine Art der Fortbewegung, wie sie viele Deutsche in Australien schätzen, insbesondere  auf den Straßen im Süden des australischen Bundesstaates Queensland. Der Trip führt ihn zunächst durch das Hinterland der Sunshine Coast, den Glasshouse Mountains. In Noosa steht dann eine Bootsfahrt auf dem Programm. Im nördlichen Teil der Nature Coast, der Fraser Coast, geht es zunächst per Flugzeug auf die kleine Insel Lady Elliott Island. Beim Tauchen möchte Richy den Meeresschildkröten nahe kommen. Und wie geplant erkundet er per Geländewagen Fraser Island, die größte Sandinsel der Welt, mit ihrer faszinierenden Natur. DE 2014
- eventId: 770190
  start: 2026-10-30T12:20:00Z
  stop: 2026-10-30T12:39:00Z
  title: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  description: Die bekannte Schauspielerin Eva Habermann nimmt Sie mit nach Las Vegas. Neben den allseits bekannten Casinos und Varietéshows, zeigt sie uns Las Vegas, wie es wahrscheinlich noch nicht jeder kennt. Sie nimmt uns mit, in ein interaktives Museum, das vor allem für die Kinder und Jugendlichen der Stadt eine schöne Abwechslung bietet und gleichzeitig die einzigartige Lage der Stadt und ihre Geschichte thematisiert. Danach geht es für Eva Habermann zum Shoppen in die Town Square Mall und dann, nach einem Abstecher zum Grand Canyon Nationalpark, rein in das pulsierende Nachtleben Las Vegas. DE 2008
- eventId: 770191
  start: 2026-10-30T12:40:00Z
  stop: 2026-10-30T13:00:00Z
  title: VIP Trip - Prominente auf Reisen - Malta mit Florian Fitz
  subtitle: VIP Trip - Prominente auf Reisen - Malta mit Florian Fitz
  description: Das Ziel der heutigen Reportage ist die im Mittelmeer liegende Inselrepublik Malta. Der beliebte Schauspieler Florian Fitz möchte das kleine und doch geschichtsträchtige Land erkunden. Er beginnt seine Rundreise in der Hauptstadt Valletta und lernt dort einen echten Malteserritter kennen. Die archäologischen Stätten geben dann dem Schauspieler einen Eindruck, welche Bedeutung die Insel bereits vor Jahrtausenden hatte. Aktiv geht es dann bei einer Mountainbike Tour die Küste entlang und mit dem Speedboot auf dem Meer weiter.  Besonders beeindruckt ist Florian Fitz von einem Spaziergang durch den pittoresken Fischerort Marsaxlokk.  Nach einem typischen maltesischen Abendessen stürzt er sich dann in das Nachtleben. Zum Abschluss geht es für Florian Fitz auf die kleine Schwesterinsel Gozo. Dort unternimmt er einen Tauchgang zum legendären Blue Hole und besichtigt die eindrucksvollen Salzfelder. DE 2016
