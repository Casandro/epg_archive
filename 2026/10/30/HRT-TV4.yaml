  title: Eko zona
  subtitle: Poznato je da je u Topuskom u Sisačko-moslavačkoj županiji planirana gradnja podatkovnog centra kapaciteta 1 gigavata.
  ageRating: 4
  genre:
  - '160'
  description: Poznato je da je u Topuskom u Sisačko-moslavačkoj županiji planirana gradnja podatkovnog centra kapaciteta 1 gigavata. Međutim, već je više od 15 tisuća ljudi iz cijele Hrvatske potpisalo peticiju protiv njegove izgradnje jer smatraju da će negativno utjecati na prirodu i kvalitetu života tamošnjeg stanovništva. Jedna od najatraktivnijih europskih ptica, zlatovrana, bori se za opstanak zbog nestanka travnjaka, pašnjaka i pretjerane uporabe pesticida. Važna mjera njezine zaštite je postavljanje kućica za gniježđenje. Premda trenutačno ne nastanjuje područje Međimurske županije, stručnjaci JU Međimurska priroda dosad su postavili 50-tak kućica kako bi se stvorila pogodna gnjezdilišta za te ptice.  USKOK je objavio nove dokumente o ilegalno odlaganom otpadu u Benkovcu, odnosno na lokaciji bivšeg kamenoloma u Benkovačkom Selu u kojem je zakopano najmanje 6400 tona plastike i drugog opasnog otpada. Donosimo i strane vijesti o mikroplastici u Dunavu.
