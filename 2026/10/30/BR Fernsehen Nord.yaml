  title: Abenteuer Wildnis
  subtitle: Die Fuchsflüsterin
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nirgendwo leben mehr Polarfüchse pro Quadratkilometer als auf der Halbinsel Horn im Nordwesten Islands. Die Füchse auf Horn sind ein Gradmesser für Islands Bestände: Wenn selbst hier, unter optimalen Lebensbedingungen, etwas schieflaufen sollte, könnte es schlimm werden für alle Füchse auf Island. Im März vor sieben Jahren war die Bilanz nach Esters Winterexpedition niederschmetternd: Damals hatten sehr viele Füchse den Winter nicht überlebt. Vielleicht liegt die Ursache dafür im Meer, das die Füchse ernährt. Denn die Ozeane sind mit einer Unzahl von Chemikalien verschmutzt. Tiere nehmen viele davon mit der Nahrung auf.'
