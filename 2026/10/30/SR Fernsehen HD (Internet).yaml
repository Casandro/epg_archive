  description: 'Stimpel will nicht länger wegsehen und Direktor Leibrandt endlich aus den Fängen des Alkohols befreien. Doch leider hat das ungeahnte Folgen: Nüchtern ist Leibrandt ein Tyrann, und Stimpel muss zusehen, wie er den Geist wieder zurück in die Flasche bekommt. Yunus entdeckt, dass Stimpel und Sahra eine Affäre begonnen haben, und weil er nun auch eine Freundin finden will, beginnt er eine Dating-Offensive.'
