  title: ARD Room Tour
  subtitle: Thomas wohnt in einem selbstgebauten Märchenhaus
  description: 'Seit rund 20 Jahren lebt Thomas im Allgäu und hat sein Zuhause Stück für Stück in ein Märchenhaus verwandelt. Mit Illusionsmalerei, Skulpturen und ungewöhnlichen Details macht der gelernte Grafikdesigner und Künstler aus Räumen, Möbeln und Fassaden echte Kunstwerke. Schon im Garten beginnt seine märchenhafte Fantasiewelt: ein Brunnen mit Froschkönig, ein Erker mit Rapunzel-Figur.'
