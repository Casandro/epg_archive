- eventId: 689096
  start: 2026-10-30T00:25:00Z
  stop: 2026-10-30T00:55:00Z
  title: Treffpunkt
  subtitle: 'Alles Apfel: Altes Kelterhandwerk, Apfelleder und Kuchengenuss'
  description: Es ist schon erstaunlich, was alles aus einem Apfel werden kann. Most, Wein, Mus, Tee oder sogar Leder. Im Herbst widmet sich der Treffpunkt dem Lieblingsobst der Deutschen. Wir lernen einen Apfelkelterer kennen, eine Bäckerin und ihren holländischen Apfelkuchen, einen Mann, der aus Apfelleder Taschen herstellt und eine Fahrrad-Apfelroute. Und besuchen das Moschtfescht im Freilichtmuseum Beuren.
- eventId: 693915
  start: 2026-10-30T00:55:00Z
  stop: 2026-10-30T01:25:00Z
  title: Einfach & köstlich
  subtitle: Anchovis-Carbonara mit Salbei  & Mailänder Hähnchenschnitzel mit Zucchini-Tagliatelle und cremigen Perlgraupen
  description: 'La Dolce Vita bei "Einfach & köstlich": Spitzenköchin Clara Hunger interpretiert die Carbonara neu - mit Anchovis statt Speck. Spitzenkoch Björn Freitag serviert ein knuspriges Mailänder Hähnchenschnitzel in Parmesan-Marinade, begleitet von Graupen-Risotto und Zucchini-Tagliatelle. Gemeinsam zeigen die beiden, wie sich italienische Lebensfreude und moderne Alltagsküche genussvoll verbinden lassen: in einem dritten, besonderen Gericht mit Zucchini und Zitrone - fruchtig und herzhaft.'
- eventId: 695306
