  subtitle: Klassenfotos
  description: "Das jährliche Klassenfoto steht an. Stimpel ist schockiert vom Schönheitswahn seiner Schülerinnen, doch plötzlich erwischt ihn selbst der Optimierungswahn. Sehr zum Vergnügen von Sahra, Yunus und der kompletten Klasse.   \nOsman und Kira wollen endlich ihr erstes Mal hinter sich bringen und scheitern dabei grandios.  Yunus Dating-Offensive droht auch zu scheitern, doch er beschließt das Naheliegende. Schließlich seine Schüler Mütter ..."
