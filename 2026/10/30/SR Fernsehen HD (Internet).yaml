  title: Treffpunkt
  subtitle: 'Alles Apfel: Altes Kelterhandwerk, Apfelleder und Kuchengenuss'
  description: Es ist schon erstaunlich, was alles aus einem Apfel werden kann. Most, Wein, Mus, Tee oder sogar Leder. Im Herbst widmet sich der Treffpunkt dem Lieblingsobst der Deutschen. Wir lernen einen Apfelkelterer kennen, eine Bäckerin und ihren holländischen Apfelkuchen, einen Mann, der aus Apfelleder Taschen herstellt und eine Fahrrad-Apfelroute. Und besuchen das Moschtfescht im Freilichtmuseum Beuren.
