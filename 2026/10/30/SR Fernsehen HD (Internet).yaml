  subtitle: Annikas Erzeuger
  description: Annikas Vater, Bestsellerautor für Lebensfragen, kommt für eine Lesung an die Schule. Für Annika ist die Sache mit einem Fünf-Punkte-Fragenkatalog abgearbeitet. Sahra dagegen hat mit ihrem Ex noch ein paar Rechnungen offen und Stimpel gerät mitten in den Rosenkrieg. Yunus hat sich inzwischen durch den halben Elternbeirat gedatet und nicht nur eine der Frauen taucht bei der Lesung auf ... Osman will endlich seine Jungfräulichkeit verlieren und ein Pro-Tipp führt ihn in die Schulmensa.
