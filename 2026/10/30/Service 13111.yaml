  title: Hoagascht
  subtitle: Die Wiener Hofburg - Weinkeller, Glanz und Feuerwehr
  description: "Die Hofburg Wien zählt zu den größten Gebäudekomplexen der Welt und wird von der Burghauptmannschaft Österreich verwaltet und erhalten. Der \"Burgherr\" Reinhold Sahl persönlich führt uns an Plätze, die nicht für die Öffentlichkeit bestimmt sind: So geht es in die Tiefen des kaiserlichen Weinkellers und hoch hinauf in die Kuppel des Prunksaals der Nationalbibliothek. Die betriebseigene Feuerwehr hingegen zeigt uns, was es bedeutet das über 300.000 m2 große Areal hinsichtlich Brandschutzes zu überwachen: Von Kontrollgängen, über erste Hilfe bis hin zum regelmäßigen Ausrücken bei Fehl- und Täuschungsalarmen. Neben der Feuerwache haben aber auch himmlische Klänge in der Hofburg seit Jahrhunderten Tradition: So lauschen wir der berühmten Kirchenmusik in der Augustinerkirche und erfahren, warum hier 54 Habsburgerherzen in Urnen aufbewahrt werden. \nVolkskultur, Österreich 2025, R: Matthias Gugler M: Richard Deutinger"
  genre:
  - '116'
  widescreen: true
