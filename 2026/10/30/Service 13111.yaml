  title: Sternstunde der Mörder
  subtitle: Teil 1
  description: "Prag im März 1945: Während alliierte und russische Truppen immer näher rücken, herrschen die deutschen Besatzer mit aller Härte über die Stadt. Nach dem Mord an einer deutschen Offizierswitwe übernimmt der tschechische Beamte Jan Morava (Jonas Nay) die heiklen Ermittlungen. Dabei wird er vom österreichischen Gestapo-Beamten Erwin Buback (Nicholas Ofczarek) überwacht, der insgeheim im Auftrag des NS-Regimes Widerstandskämpfer innerhalb der Prager Polizei ausfindig machen soll. Als ein weiterer Mord nach dem gleichen ritualisierten Muster geschieht, erkennt das ungleiche Duo, dass es sich um einen Serienmörder handelt. Auch beim zweiten Opfer, einer Tschechin, wurde das Herz entfernt. Während Buback die charismatische Schauspielerin Marleen Baumann (Jeanette Hain) kennenlernt, kommen sich Morava und seine Kollegin Jitka näher. Jitka ist es auch, die den entscheidenden Hinweis erkennt: beide Opfer wurden vom Täter am selben Ort ausgewählt. Um den Mörder in die Falle zu locken, starten die Beamten eine gefährliche Lockvogelaktion - mit Marleen und Jitka in den Hauptrollen. \n\n\"Sternstunde der Mörder\" ist die packende Verfilmung des hochgelobten Romans vom tschechischen Altmeister Pavel Kohout, der mit seinem Werk nicht nur einen fesselnden Kriminalroman, sondern auch eine hintergründige Parabel über die Mechanismen von Gewalt, Mord und Hass schuf. Unter der Regie von Christopher Schier (\"Die Ibiza-Affäre\", \"Der Pass\") brillieren Österreichs Schauspielstar Nicholas Ofczarek in der Rolle des undurchsichtigen Erwin Buback und Jonas Nay als Jan Morava, an ihrer Seite agieren u.a. Jeanette Hain, Devid Striesow und Gerhard Liebmann. Die hochkarätigen Bilder lieferte der mit dem Grimme-Preis ausgezeichnete Kameramann Philip Peschlow (\"Der Pass\", \"Hagen - Im Tal der Nibelungen\").\nKrimi, Österreich 2025, R: Christopher Schier"
  widescreen: true
- eventId: 637706
