    Nach der Schicksalswahl in Israel zeichnet sich eine schwierige Regierungsbildung ab. Noch ist unklar, ob Ministerpräsident Benjamin Netanjahu weiter an der Macht bleibt. Doch die hohe Wahlbeteiligung spricht eine deutliche Sprache: Viele sehnen sich nach Veränderung. Denn der Nahost-Konflikt scheint festgefahren wie nie und hat längst auch Europa in zwei Lager geteilt. Wird Netanjahu für sein Vorgehen im Gazastreifen und Westjordanland abgestraft? Was tun gegen den massiven Judenhass auf Europas Straßen? Und wie bringt man Bewegung in die unversöhnliche Debatte?
