  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: "Trumps Amerika: Macht er's besser als sein Vorgänger? \n\"Make America Great Again\" war Donald Trumps Versprechen an die Amerikaner, als er vor zwei Jahren zum Präsidenten gewählt wurde. Hat er es eingelöst? BLICKWECHSEL erkundet die Lage vor Ort: Hat Trump seine Wähler weiter hinter sich oder droht den Republikanern bei den Midterms eine Wahlschlappe? Dazu: Schaltgespräch mit ServusTV-Reporterin Stephanie Hüttner in Virginia. \n\nNach Pariser Gewalt-Demos: Springt Funke zu uns über? \nSeit Wochen eskaliert in Frankreichs Großstädten abends die Gewalt. Am Wochenende sind in mehreren deutschen Großstädten Demonstrationen angesagt. Und in Österreich beobachten die Behörden, dass die Ausschreitungen in Paris gewaltbereite Gruppen dazu inspiriert haben, für das anstehende Helloweenfest zu mobilisieren. \n\nBotox, Lifting und Filler: Das - oftmals dubiose - Geschäft mit der Schönheit. \n\"Einmal aufspritzen, bitte\" ist bei vielen so normal wie zum Friseur zu gehen. Snezana Antic-Zivkovic hat es fast ihre Nase gekostet. Die Nachfrage nach Beauty-Dienstleistungen lockt auch fragwürdige Anbieter auf den Plan. BLICKWCHSEL stößt bei der Recherche auf eine Werbeagentur, die \"Russian Lips\" anbietet. Wir machen die Behörden darauf aufmerksam - kurz danach schließt das Angebot. \n\nReichsbürger-Prozess in Deutschland: Misst Justiz mit zweierlei Maß? \nDen Umsturz sollen sie geplant haben. Angeblich. Seit bald vier Jahren sitzt Heinrich XIII. Prinz Reuß nun in U-Haft. Doch beim laufenden Prozess stellt sich heraus: Es gibt keine Geschädigten durch die Pläne. Sitzen Reuß und seine Unterstützer nur deshalb so lange in U-Haft, weil sie aus der rechten Reichsbürger-Szene kommen? Immer mehr Experten kritisieren, dass der Rechtsstaat hier ein Exempel statuiert. Aber wäre er dann noch ein Rechtsstaat?Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
- eventId: 637776
