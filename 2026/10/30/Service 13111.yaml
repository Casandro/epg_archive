  title: TM Wissen
  subtitle: Flirtkiller "Ick-Moment"? - Wie kleine Macken große Gefühle abwürgen und mehr
  description: 'In der letzten regulären Ausgabe vom TM Wissen geht es unter anderem um den einen Moment, der den Zauber einer vielversprechenden Verabredung kippen lassen kann - und das ohne Vorwarnung. Oft sind es winzige Gesten oder unscheinbare Details, die plötzlich jede Anziehung verschwinden lassen. Dahinter steckt der sogenannte "Ick"-Moment, der zeigt, wie rasch sich unsere Wahrnehmung beim Flirten verschieben kann // Außerdem: Ein Tiroler Biologe stellt sich der wachsenden Gefahr durch Krankenhauskeime, deren Resistenz gegenüber gängigen Medikamenten herkömmliche Therapien ins Leere laufen lässt. In den Mittelpunkt rücken bei ihm Mikroorganismen, die im Verborgenen erstaunliche Überlebensstrategien entwickelt haben. Die findet er an einem ungewöhnlichen Ort - im ewigen Eis // Nicht dort, sondern im Sternenhimmel erweitert ein TI-Techniker aus Oberösterreich seinen Horizont. Schon seit der Kindheit trägt der Hobby-Astronom die unbändige Sehnsucht nach dem Nachthimmel und fernen Galaxien in sich. Aus diesem Traum entstand schließlich eine selbstgebaute Sternwarte hoch über der Hohen Dirn, die selbst Profi-Astronomen staunen lässt // Lässt sich das gesamte Universum samt irdischem Leben vielleicht mit einer geheimnisvollen Zahlenreihe erklären? Ein Kaninchenpaar, eine Sonnenblume und das Auge eines Wirbelsturms - Phänomene, die alle einem gemeinsamen Muster folgen. Aus dem Vermehren von Kaninchen hat italienischer Mathematiker vor rund 800 Jahren eine Zahlenreihe abgeleitet, die sich später in Blüten, Wirbeln und sogar galaktischen Strukturen wiederfindet. So entfaltet sich ein Prinzip, das manche als tiefen Hinweis auf die Ordnung unseres Universums deuten.Österreich 2025'
  genre:
  - '144'
  widescreen: true
