  title: Heimatleuchten
  subtitle: Ghörig oder gar net - Im Vorarlberger Oberland
  description: "Egal wie hoch die Berge oder wie knifflig die Herausforderungen sind - mit der richtigen Einstellung und einem \"Nit lugg lo!\" (nicht aufgeben) lässt sich in der Region zwischen Großem Walsertal, Klostertal, Bludenz und Montafon beinahe jedes Problem lösen. Wo Beharrlichkeit auf Bodenhaftung mit Innovationsgeist treffen, warte die Menschen nicht darauf, dass es leichter wird. Zwischen Amboss, Alpe, Wald und Höhenfeuer erzählen sie davon, kompromisslos den eigenen Weg zu gehen - und davon, was möglich wird, wenn Aufgeben keine Alternative ist. \nDa ist Johannes Neumayer, der seinen sicheren Job gegen die jahrhundertealte Schmiede der Schattenburg bei Feldkirch eingetauscht hat. Der Walgauer Drechsler Peter Andres, der aus seiner Liebe zum Holz Kunst macht und es mit der größten gedrechselten Holzschale der Welt sogar ins Guinnessbuch geschafft hat. Daniela Kräutler, die sich als Hufschmiedin in einer Männerdomäne durchgesetzt hat und Pferde annimmt, an die sich andere nicht heranwagen. Und dann die 13-jährige Leonie, die in den Sommerferien als Kleinhirtin arbeitet. Im Klostertal hat Hauben-Koch Tobias Schöpf die Wirtschaft Traube wiederbelebt und sucht immer neue Geschmäcker aus der Natur. Diese gesund zu halten und für Nachwuchs im Wald zu sorgen, das ist für Günter Dünser in Schnifis eine Aufgabe, die mit hohem Risiko verbunden ist. Er der Mann für \"steile Fälle\".\nIm Großen Walsertal zeigt die Bergrettung Damüls beim Höhenfeuer, wie wichtig Zusammenhalt ist: Was spektakulär aussieht, schweißt ein Team zusammen, das sich im Ernstfall blind vertrauen muss. Auf der Alpe Hutla wiederum bereitet Floristin Petra Rinderer kunstvolle Gestecke für den Alpabtrieb vor, während ihr Mann Lothar die Tiere auf den Weg ins Tal einstimmt - unterstützt von der ganzen Familie.\nDokumentarfilm, Österreich 2026, R: Yvonne Rüchel"
  genre:
  - '116'
  widescreen: true
- eventId: 667547
  start: 2026-10-30T19:15:00Z
  stop: 2026-10-30T20:15:00Z
