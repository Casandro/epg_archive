  stop: 2026-10-30T21:14:58Z
  title: Hallstatt im Höhenflug - Im Salzkristall zum Hochtal
  description: "Die Arbeiten in der Flanke des Salzberges stellen alle Beteiligten vor große Herausforderungen: Sprengungen und Sicherungsarbeiten im bis zu 42 Grad steilen Gelände sind notwendig. Große Bauteile für die bis zu 28 Meter hohen Stützen können nur mit einem Schwerlast-Helikopter eingeflogen werden. Zudem müssen Lkw über eine schmale Forststraße, vorbei an schwindelerregenden Abgründen, zur Baustelle der neuen Bergstation gelangen. \nIm Winter machen Schnee, Kälte und die dadurch verschärften Arbeitsbedingungen der Mannschaft zu schaffen. Auch der Transport der 15,5 Tonnen schweren neuen Kabinen erfordert millimetergenaue Maßarbeit bei der Fahrt entlang des Hallstättersees.\n\nGleichzeitig finden unmittelbar neben der Baustelle archäologische Grabungen statt, die Zeugnisse einer jahrtausendealten Geschichte ans Licht bringen. Dies bringt allerdings auch zusätzliche logistische Herausforderungen für den Baufortschritt mit sich.\n\nIm Mittelpunkt dieser Dokumentation stehen die Menschen hinter dem gigantischen Projekt: Bauarbeiter, Bergretter, Architekten, Archäologen und Seilbahntechniker - und nicht zuletzt die Hallstätter selbst, die dem Salzberg seit jeher persönlich verbunden sind. \nEin einmaliges Bauvorhaben auf einem Berg, der seit Jahrhunderten das Leben eines ganzen Ortes prägt.Österreich 2025, R: Stefan Aglassinger"
  widescreen: true
