  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Nuklearer Plan
  description: |-
    Könnte es sein, dass Außerirdische die Nuklearbedrohung auf der Erde genau beobachten, um die Menschheit vor einer selbstzerstörerischen Handlung zu retten? Was ist ihr Motiv? Stellen die Außerirdischen eine Bedrohung für die Menschheit dar? Oder wollen sie gar das Schicksal der Menschheit retten?
    Kurz, nachdem es zur ersten Explosion einer Atombombe im August 1945 kam, wurden immer wieder grüne Feuerballen am Nachthimmel auf diesem Gebiet gesichtet. Zwei Jahre später hat Kenneth Arnold eine fliegende Untertasse in Washington State am Nachthimmel beobachtet und es kam zu dem berüchtigten UFO-Absturz bei Roswell. Was nur wenigen bisher aufgefallen ist, ist die Tatsache, dass sich diese Sichtungen und der UFO-Absturz in der Nähe von Atomkraftwerken ereigneten. Seither stellt es keine Seltenheit dar, dass UFOs in der Nähe von Atomkraftwerken gesichtet wurden.
