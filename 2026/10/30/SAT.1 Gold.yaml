    (WH vom Mittwoch, 21.10.2026, 09:05 Uhr)
  description: 'André Weidner kann es kaum fassen: Vor wenigen Tagen dachte er noch, er müsse an einem Hirntumor sterben, und nun stellt sich heraus, dass die Patientenakten vertauscht wurden. Er kann unbesorgt weiterleben! Doch dann wird die Leiche des schwerkriminellen "Kalle" gefunden. Hat André in seiner Panik nach der Diagnose versucht, einen Killer auf sich selbst anzusetzen? Und konnte er danach den Auftrag nicht mehr rückgängig machen? War André gezwungen, seinen Killer zu ermorden?'
  widescreen: true
