    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: 'Der alleinerziehende Vater Julian Berger konkurriert mit der hübschen Anuschka Rapp bei einem Praktikum um den festen Job in einer Werbeagentur. Eines Tages taucht Anuschka nicht mehr bei der Arbeit auf. Als sie Tage später vollkommen verwahrlost in einem abbruchreifen Haus gefunden wird, behauptet Anuschka: Julian wollte sie aus dem Weg räumen! Hat der junge Vater zu solchen Mitteln gegriffen?'
  widescreen: true
