  description: 'Giulia di Filippo ist strikt gegen die Beziehung ihrer Tochter Beatrice mit dem DJ Sebastian Goeßling. Für die italienische Mama steht fest: Der Typ muss weg! Ist sie tatsächlich so weit gegangen, einen Schläger auf den ungeliebten Schwiegersohn in spe anzusetzen, damit der DJ in seiner dunklen Wohnung verprügelt wird? Seltsam ist allerdings, dass Sebastians Bruder nach dem Angriff spurlos verschwunden ist - und mit ihm 1.250 Euro aus Sebastians Besitz.'
