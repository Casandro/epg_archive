  title: Dr. Quinn - Ärztin aus Leidenschaft
  subtitle: |-
    Die Ruhe der Toten
    Western, USA 1994
    Altersfreigabe: ab 6
  description: |-
    Die Bewohner von Colorado Springs sind in Aufruhr, denn ein gewisser Dr. Porter lockt mit dem großen Geld: Er bietet jedem, der ihm ein vollständiges Dinosaurierskelett bringt, 500 Dollar. Fast die gesamte Bevölkerung ist rund um den Ort am buddeln, als Loren fündig wird. Zwar fördert er nur einen Knochen zu Tage, doch das genügt Porter, um eine großangelegte Grabung zu starten. Sully und Dr. Quinn haben wegen des Vorhabens allerdings erhebliche Bedenken.

    Regie: Victor Lobl
    Drehbuch: Danna Doyle
    Komponist: William Olvis
    Kamera: Roland "Ozzie" Smith
    Schnitt: Heidi Scharfe

    Darsteller:
