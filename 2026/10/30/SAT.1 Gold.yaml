    Der Nebenkläger
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Schon lange hat Robert König eine komplette Wohnanlage fest im Griff! Wer dort wohnt, der zahlt - und wenn das nicht freiwillig geschieht, dann mit Gewalt. Nachweisen konnte die Polizei dem Banden-Boss bisher nichts. Doch jetzt ist Robert selbst zum Opfer geworden. Angeblich hat seine Nachbarin versucht, ihren Peiniger zu ermorden. Die Alleinerziehende soll aus Rache - und vor allem aus Angst um ihre Tochter - zur Waffe gegriffen haben.
