  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 15'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 15'
  description: 'An der Grenze spitzt sich die Lage zu: In Hidalgo wird eine Brücke geschlossen, nachdem Dutzende Asylsuchende versuchen, die Warteschlange zu umgehen. An der Columbia-Solidarity-Brücke wecken zwei scheinbar harmlose Süßigkeitentüten in einer Plane den Verdacht der Beamten. Dazu ein ungewöhnlicher Asylantrag aus Kuba, der selbst erfahrene Grenzschützer kurz schmunzeln lässt - und dennoch klare Grenzen aufzeigt.'
  widescreen: true
- eventId: 757532
  start: 2026-10-30T21:05:00Z
  stop: 2026-10-30T22:05:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 16'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 16'
  description: In Progreso haben Grenzbeamte Reisende im Blick, die günstig erworbene Medikamente illegal über die Grenze bringen wollen. Am Juárez-Lincoln-Übergang wartet eine junge Beamtin auf ihren ersten großen Fund - und wird bei der Kontrolle eines SUVs fündig. In Brownsville geraten nachts Geldströme ins Visier, als eine mutmaßliche Kurierin mit einer hohen Bargeldsumme gestoppt wird.
  widescreen: true
- eventId: 757533
  start: 2026-10-30T22:05:00Z
  stop: 2026-10-30T23:05:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  description: 'An der Grenze taucht ein schwer verletzter Mann auf und bittet verzweifelt um Hilfe. Er erzählt, wie ihn ein Kartell misshandelte, um ihn zur Mitarbeit zu zwingen. Währenddessen gerät ein leerer Tourbus ins Visier der Beamten - der verdächtige Tank wirft Fragen auf. Auch eine Routinekontrolle endet brisant: In den Sitzen eines Familienwagens stoßen die Einsatzkräfte auf eine große Menge Drogen.'
  widescreen: true
