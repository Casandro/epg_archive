  title: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  subtitle: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  description: Am 23. März 2021 bohrt sich eines der größten Containerschiffe der Welt ins sandige Ufer des Suezkanals. Fast eine Woche lang blockiert die Ever Given die vielbefahrene Handelsroute in Ägypten. Nie zuvor ist ein Frachter dieser Größe so auf Grund gelaufen, dass es zu einer vergleichbaren, globalen Lieferkrise gekommen gekommen wäre. War es eine Verkettung unglücklicher Umstände? Oder zeigt der Megastau auf See einen gefährlichen Schwachpunkt in der weltweiten Versorgungskette auf?
  widescreen: true
