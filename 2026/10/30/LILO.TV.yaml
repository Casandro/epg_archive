  description: Streuobstwiesen sind traditionelle landwirtschaftliche Flächen, die eine Vielzahl von Obstbäumen beherbergen, darunter Äpfel, Birnen, Kirschen und Zwetschgen. Sie sind charakterisiert durch ihre hohe Artenvielfalt und dienen als wichtiger Lebensraum für zahlreiche Tier- und Pflanzenarten. Streuobstwiesen fördern die Biodiversität, den Naturschutz und die Erhaltung alter Obstsorten. Sie sind auch ein kulturelles Erbe und prägen das Landschaftsbild vieler Regionen.
