  title: So schmeckt die Welt - Schokolade
  subtitle: So schmeckt die Welt - Schokolade
  description: 'Schokolade ist eine der beliebtesten Süßigkeiten weltweit. Sie wird aus Kakaobohnen hergestellt, die geröstet und gemahlen werden, um eine zarte Kakaomasse zu bilden. Durch Zugabe von Zucker und Milch entstehen verschiedene Sorten: von dunkler über Milchschokolade bis hin zu weißer Schokolade. Schokolade ist nicht nur köstlich, sondern enthält auch Antioxidantien und kann die Stimmung verbessern. Sie wird in vielen Formen genossen und ist ein universelles Vergnügen für Jung und Alt.'
  genre:
  - '129'
  widescreen: true
- eventId: 1037924
  start: 2026-10-30T20:40:00Z
  stop: 2026-10-30T21:35:00Z
  title: So schmeckt die Welt - Streuobstwiesen
  subtitle: So schmeckt die Welt - Streuobstwiesen
  description: Streuobstwiesen sind traditionelle landwirtschaftliche Flächen, die eine Vielzahl von Obstbäumen beherbergen, darunter Äpfel, Birnen, Kirschen und Zwetschgen. Sie sind charakterisiert durch ihre hohe Artenvielfalt und dienen als wichtiger Lebensraum für zahlreiche Tier- und Pflanzenarten. Streuobstwiesen fördern die Biodiversität, den Naturschutz und die Erhaltung alter Obstsorten. Sie sind auch ein kulturelles Erbe und prägen das Landschaftsbild vieler Regionen.
  genre:
  - '129'
  widescreen: true
