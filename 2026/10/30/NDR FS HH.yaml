  title: In aller Freundschaft - Die jungen Ärzte (280)
  subtitle: Verantwortung
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: Eine junge Frau, die nicht weiß, wer sie ist, wird ins Johannes-Thal-Klinikum eingeliefert. Nach einem plötzlichen Krampfanfall ist sie eine Treppe heruntergestürzt und hat dabei ihr Zungenpiercing verschluckt. Mit einer Not-OP können die Ärzte sie gerade noch vor dem Ersticken retten. Doch ihre Blutwerte irritieren Dr. Ben Ahlbeck, Dr. Leyla Sherbaz und Prof. Karin Patzelt fortan.
