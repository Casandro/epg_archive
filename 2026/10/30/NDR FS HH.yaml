  title: 'Die Nordreportage: Härtetest für die Panzercrew'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Am Schießübungszentrum der Bundeswehr in Munster (Niedersachsen) trainieren deutsche Panzerbesatzungen den Ernstfall. "Die Nordreportage" begleitet eine junge Panzercrew bei ihrer anspruchsvollen Schießausbildung und bietet einen außergewöhnlichen und seltenen Blick hinter die Kulissen des ansonsten streng abgeriegelten Manövergebiets in der Lüneburger Heide. Dort führen die Vorgesetzten und Ausbilder die jungen Soldatinnen und Soldaten an ihre geistigen und körperlichen Grenzen.
