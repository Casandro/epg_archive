  title: Nooit Meer Slapen
  subtitle: Robert Vuijsje is journalist en schrijver. Hij schreef voor Nieuwe Revu en De Pers. Hij staat bekend om zijn scherpe observaties over identiteit, afkomst en maatschappelijke tegenstellingen.
  description: Robert Vuijsje is journalist en schrijver. Hij schreef voor Nieuwe Revu en De Pers. Hij staat bekend om zijn scherpe observaties over identiteit, afkomst en maatschappelijke tegenstellingen. In 2008 debuteerde hij met 'Alleen maar nette mensen', waarvoor hij de Gouden Uil en een Inktaap won. Later werd het boek verfilmd. Daarnaast schreef hij de boeken 'Beste vriend', "Kaaskoppen" en 'Salomons oordeel'. Naast romans schreef hij non-fictie, zoals "Maar waar kom je écht vandaan" en 'Maak de wereld beter'. Zijn nieuwe roman "Jagger Plaza" gaat over de enige makelaar van Amsterdam-Zuid die geen miljonair werd. Het is een boek over de illusie van de maakbare wereld. Ellen Deckwitz gaat met Robert Vuijsje in gesprek. (2026)
