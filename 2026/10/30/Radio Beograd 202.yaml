  description: I u ovom izdanju emisije "Tu i tamo" super muzički provod, od Džona Mejera do Džonija Mara... Oni su oktobarski ljudi, a to je tema ove emisije. Na spisku su i Sting, Midž Jur, Fil Ouki, Eros Ramacoti, braća Kemp iz grupe "Spandau Balej" i naravno prijatelj naše emisije Sajmon le Bon... Plus Gven Stefani, Kejti Peri, Dodža Ket, i mnogi drugi...Sa domaće scene muzički oktobarci su Roman iz "Plejboja", Bebi Dol, Konstrakta...I zato pojačajte Dvestadvojku!!!
