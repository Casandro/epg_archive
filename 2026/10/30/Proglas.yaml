  description: 'Autor: Milan Kynčl; Interpret: Dana Pilchová, Dušan Baur, Magda Hauserová, Milan Kynčl; Premiéra: 20.3.2003 * Když se skřítek Melichárek přistěhoval na hrad Roštejn, bylo mu smutno. Naštěstí potkává nové přátele. Ten dnešní na něj bude čekat u rybníka.'
