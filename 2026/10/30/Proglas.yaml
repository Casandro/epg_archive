  title: Hudební tip týdne
  subtitle: Rozhovor se slovenským pianistou Milošem Bihárym
  description: 'Autor: Milan Tesař; Interpret: Miloš Biháry; Premiéra: 25.8.2026 * V pořadu Jak se vám líbí budeme hovořit se slovenským pianistou Milošem Bihárym o albu Čavoros de Django, které natočil se svým Django Gypsy Jazz Triem. Přiblížíme si, jak se dostal od klasické hudby přes jazz až k gypsy jazzu a jak jeho hudební kořeny souvisejí s maďarskou a romskou lidovou hudbou. Biháry vysvětlí také specifické obsazení tria s houslemi a bicími a způsob, jakým na klavíru supluje funkci kytary i cimbálu. Řeč bude o skladbách alba, v nichž se propojují gypsy jazz, klasická hudba, maďarský folklor, rumunská hora i španělský swing, a také o improvizaci a aranžérské práci. Rozhovor jsme natočili na festivalu Czech Music Crossroads v Ostravě.[džango] [džango džipsy džez triem] [džipsy džezu] [ček mjúzik krosroudz]'
