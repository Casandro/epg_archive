  title: Jak se vám líbí
  subtitle: Koncert dua Hmlisto ze studia Proglasu
  description: 'Autor: Jannis Moras; Interpret: Veronika Kicková, Ján Kicko * Duo Hmlisto tvoří Veronika Kicková a její syn Ján, kteří ve své tvorbě vycházejí z lidové hudby středního Slovenska a osobní zkušenosti se životem na venkově. Hmlisto ve svých písních propojuje výrazný ženský zpěv s akustickými nástroji a současným písničkářským přístupem. Jejich album Samoty přináší písně inspirované krajinou, tradicemi a životem v odlehlých horských oblastech, ale také tématy vztahů, rodiny a proměn současného venkova. Poté, co dvojice album představila v našem pořadu Jak se vám líbí, přijíždí do studia znovu. Tentokrát bude hrát své písně živě. '
  genre:
  - '96'
