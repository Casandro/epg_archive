  description: Koje je boje boja? Zašto je jaje važno u slikarstvu? Koja boja se dobija od puževa? Šta je sozercanje? Da li je Njutn bio potpuno u pravu? Kada nauka i umetnost idu ruku pod ruku? Možda ne očekujemo da nauka i umetnost idu ruku pod ruku i da se prepliću, ali se upravo u neočekivanim detaljima kriju uzbudljiva otkrića. I upravo serijal "Od pigmenta do koncepta", koji je zamišljen kao kratka forma u trajanju od 13 minuta (9 epizoda) predstavlja taj spoj nauke i umetnosti.
