  title: Universum History
  subtitle: Der Untergang der Habsburger - Die Schlacht bei Königgrätz (2)
  description: |-
    1866: im heutigen Tschechien findet die Schlacht bei Königgrätz statt. Im Kampf zwischen Österreich und Preußen um die Vorherrschaft in den deutschen Ländern wird sie zur verheerenden Niederlage für die Habsburger. Der finale Teil der zweiteiligen "Universum History"-Dokumentation zeigt den Verlauf einer der ersten Schlachten nach dem Einzug der Moderne ins Kriegswesen. Mit fatalen Folgen bis in das 20. Jahrhundert hinein: für die Habsburger bedeutet die schwere Niederlage den Beginn einer Entwicklung, die zu ihrem Ende führen wird. Auch hat das ambivalente Verhältnis der Österreicher zu den "Piefke" ihren Ursprung in dieser Schlacht.
    Buch & Regie: Fritz Kalties
    Koproduktion: Epofilm, ORF, ZDF/ARTE, CT
