  title: Hinter den Schlagzeilen
  subtitle: 'Franz Viehböck zu: "Vor 35 Jahren flog Viehböck ins All"'
  description: "Im Oktober 1991 hat Franz Viehböck Geschichte geschrieben: damals ist er als erster und bisher auch einziger Österreicher ins All geflogen. Und das, obwohl das eigentlich nie sein Lebenstraum war.  \nBei Mariella Gittler erzählt der ehemalige Raumfahrer, wie sich Schwerelosigkeit anfühlt, warum er vier Tage vor dem Start Panik hatte und wie es ist, wenn man Vater wird, während man in einer Raumkapsel im Weltall schwebt."
