- eventId: 1037733
  start: 2026-10-30T20:20:00Z
  stop: 2026-10-30T20:50:00Z
  title: WeltWeit
  subtitle: Zeitenwende.  Wie sehr hat Trump die Welt verändert?
  description: 'Bei den Midterms werden die innenpolitischen Weichen gestellt für das Amerika der Zukunft. Sollten die Demokraten das Repräsentantenhaus zurückgewinnen, wird das Trumps Handlungsspielraum ab Jänner 2027 deutlich einschränken. Außenpolitisch werden die Wahlen wenig verändern, weil sie Trumps präsidiale Macht nicht verringern. Er kann weiterhin per Dekret regieren. Die WeltWeit-Reporter:innen schauen sich an, wie stark Trumps zweite Amtszeit inzwischen im Sinne des "Butterfly Effects" als Flügelschlag einen Tornado in der gesamten Welt ausgelöst hat.  In Brasilien wird Amerikas neuer Kolonialismus deutlich. Anstelle von Bodenschätzen geht es jetzt um grüne Energie. Ein Wasserkraftwerk an der Grenze zu Paraguay liefert enorme Mengen Strom, der den Menschen billig zur Verfügung steht. Nun läuft der Vertrag über die Stromnutzung zwischen den beiden Ländern aus. Ein amerikanischer Tech-Konzern will die Karten neu mischen und in Paraguay ein Mega-Rechenzentrum errichten, das mit billigem Strom aus dem Kraftwerk betrieben werden soll. Lena Hager ist in der Grenzregion unterwegs und fragt nach, welche Folgen das für Mensch und Natur hat. Donald Trump hat klar gemacht, dass er an guten Beziehungen zu China und dessen Staatschef Xi Jinping interessiert ist. Den US-Verbündeten in der Region - allen voran Japan - fühlt sich Trump dagegen nicht mehr so stark verpflichtet. Und das hat Folgen für die Geopolitik: Im Schatten der amerikanischen Abwesenheit hat China ein neues Selbstbewusstsein erlangt und will seinen Machtanspruch in Ostasien ausbauen. Parallel will Japan militärisch aufrüsten, um wieder mehr Gewicht auf der internationalen Politbühne zu haben. Alexandra Siebenhofer schaut sich an, welche Rolle Taiwan in diesem Konflikt spielt und welche Gefahren diese neue Weltordnung birgt. Dass die jahrzehntelangen guten transatlantischen Beziehungen mit Trumps zweiter Präsidentschaft in die Brüche gegangen sind, hat Europa eine - wenn auch unfreiwillige - Emanzipation beschert. Allem voran in Sachen Verteidigungspolitik. Estland gilt als Vorzeigeland bei der Vorbereitung auf den Ernstfall: an der russischen Grenze entsteht derzeit die "Baltic Defense Line", eine koordinierte Verteidigungslinie der baltischen Staaten mit Panzergräben und Bunkerkomplexen. Doch auch beim Schutz der zivilen Infrastruktur spielt Estland eine Schlüsselrolle: Levira, der größte Betreiber der nationalen Rundfunk- und Telekommunikationsinfrastruktur, entwickelt neuartige Warnsysteme, die selbst dann verlässlich funktionieren, wenn reguläre Mobilfunk- und Internetverbindungen zusammenbrechen. Benedict Feichtner erhält einen exklusiven Zugang zum 314 Meter hohen Fernsehturm von Tallinn, in dessen Untergrund ein Hochsicherheitsrechenzentrum liegt - geschützt von meterdickem Stahlbeton. Hier bereitet man sich auf Cyberattacken, langanhaltende Stromausfälle und kinetische Angriffe vor.'
  genre:
  - '129'
