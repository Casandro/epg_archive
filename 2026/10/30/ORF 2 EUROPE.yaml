  description: 'Mieten oder pachten - wo liegt eigentlich der rechtliche Unterschied? Und was kann man tun, wenn der Partner plötzlich das Schloss austauscht und man vor der eigenen Wohnungstür steht? Moderatorin Larissa Rausch geht wichtigen Rechtsfragen rund ums Wohnen und den Alltag nach: Wie schnell kann ungewollt ein Vertrag entstehen und wann greift eigentlich die Produkthaftung? Rechtliche Fragen, die schneller relevant werden können, als man denkt.'
