  subtitle: 'Franz Viehböck zu: "Vor 35 Jahren flog Viehböck ins All"'
  description: |-
    Die ehemalige Fußball-Nationalteamkapitänin ist erstmals selbst schwanger, nachdem ihre Ehefrau Anna vor zwei Jahren die gemeinsame Tochter zur Welt gebracht hat.
    Bei Mariella Gittler spricht die Steirerin, wie sie sich in ihrer Fußballkarriere nach zahlreichen schweren Verletzungen immer wieder zurückgekämpft hat, wie sie mit den körperlichen Veränderungen während ihrer Schwangerschaft umgeht und über die seltene genetische Erkrankung ihrer ersten Tochter.
