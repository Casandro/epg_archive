  title: Daheim - das Volksgruppenmagazin
  genre:
  - '130'
  description: "- Was Volksschulkinder über Volksgruppen lernen: Ab Herbst 2027 soll in Wien in den Räumlichkeiten der Komenský-Schule erstmals eine kroatisch-deutsche Volksschulklasse starten. Die Initiative dazu ergriffen hat der neu gegründete kroatische Schulverein Rešetari?. Vor allem für Angehörige der burgenländisch-kroatischen Volksgruppe ist das ein lange ersehnter Schritt. \n- Kornisch, die letzte keltische Sprache: Das Kornische, die keltische Sprache Cornwalls, erhielt im Januar 2026 den höchsten offiziellen Schutzstatus der Europäischen Union. Nach ihrer Anerkennung als Minderheitensprache im Jahr 2002 markiert dieser jüngste rechtliche Meilenstein einen historischen Sieg gegen das Aussterben einer jahrtausendealten Sprache.  \n- In der Serie \"Wie sagt man ...?\" treffen einander sechs junge Menschen aus den sechs autochthonen Volksgruppen Österreichs und sind für den ORF gewissermaßen als lebende Wörterbücher, die sich miteinander austauschen, im Einsatz. Dieses Mal geht es um Haustiere. Ein Beitrag von Samuel Mago."
