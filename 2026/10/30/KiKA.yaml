  description: |-
    Wir kriegen ein Baby

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Heute begleitet die "Sendung mit dem Elefanten" eine Familie, die ein Baby bekommt. Das Besondere dabei: das Baby wird zuhause auf die Welt kommen. Deshalb bereiten sich die Schwestern Ella und Lina gemeinsam mit ihren Eltern besonders gründlich auf die Geburt ihres kleinen Bruders vor. In einem Geschwisterkurs lernen die beiden, was bei einer Entbindung passiert und wie man ein Baby richtig hält und wickelt. Zusammen mit der Hebamme hören Ella und Lina bei einer Untersuchung die Herztöne des ungeborenen Babys ab. Auch bei der Geburt dürfen sie dabei sein und Mama Britta - zusammen mit Papa Alessandro und der Hebamme - unterstützen. Dann ist der kleine Tonino endlich da! Wie die Familie die ersten Wochen zu fünft wohl meistern wird?
    Moderation: Tanja Mairhofer, André Gatzke
    Regie: Renate Bleichenbach, Leona Frommelt
