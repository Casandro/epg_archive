  hd: true
  audiodesc: true
  description: |-
    Domenik ist Cheerdancer

    Domenik ist Cheerdancer. Das Besondere: Er ist der einzige Junge im Team. Seit knapp zwei Jahren trainiert er einmal pro Woche gemeinsam mit rund 15 Mädchen Tanzschritte, Akrobatik und das typische Shaken der Pompons. Früher war Domenik sein Hobby ein bisschen peinlich. Mittlerweile steht er selbstbewusst dazu und zeigt zu Hause sogar seinem großen Bruder Constantin die neuesten Schritte.

    Für den Teamspirit hat sich Domenik ein auffälliges Markenzeichen zugelegt: Vor den Auftritten färbt er sich mit Hilfe von Mama Sandra die Haare knallpink - passend zu den Schleifen seiner Teamkolleginnen.

    Besonders kniffelig sind bei den Choreographien die Pyramiden. Weil Domenik der Kleinste im Team ist, steht er dabei ganz oben. Die Pyramide darf auf keinen Fall wackeln, sonst fällt Domenik herunter.
    Regie: Isabel Bublitz
    Kamera: Alexander Gruber

