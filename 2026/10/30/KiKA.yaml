    Piet wird von seiner Vergangenheit eingeholt. Lasse, der Ex-Freund seiner Mutter, taucht auf und verspricht ihm das langersehnte Treffen. Im Gegenzug soll Piet ihm einen kleinen "Gefallen" tun. Bald findet das jüngste Pfefferkorn sich in einer Zwickmühle wieder, aus der es offenbar keinen Ausweg gibt. Als er sich seinen Freunden offenbart, machen die eine überraschende Ansage: Piet soll genau das tun, was Lasse verlangt! Kofi trifft seinen neugefundenen Vater, der ihm anbietet, mit ihm nach Berlin zu ziehen. Er muss sich entscheiden...
    Darsteller:
    Taara - Josefine Maxima
    Jules - Tibet Held
    Malin - Ida Carlo
    Kofi - Mathieu Noël
    Piet - Noah Lusander
    Regie: Hannah-Lisa Paul
    Buch/Autor: Silja Clemens

