  title: WDR 5 - Lies mir was vor
  subtitle: 'Alexander von Humboldt: Ansichten der Natur (1/2)'
  description: "Es war die zweite, die eigentliche Entdeckung Amerikas: Kaum <markup type=\"abbr\" abbreviation=\"30\" correspondent=\"dreißig\">30</markup> Jahre alt, brach der deutsche Naturforscher Alexander von Humboldt <markup type=\"abbr\" abbreviation=\"1799\" correspondent=\"siebzehnhundertneunundneunzig\">1799</markup> zusammen mit dem jungen Botaniker Aimé Bonpland zu einer mehrjährigen Südamerika-Reise auf. Eine Reise, die die beiden nach Venezuela, Kuba, Mexiko, Kolumbien, Ecuador und Peru führte - und eine der ertragreichsten Forschungsreisen der Geschichte, die einen halben Kontinent für die wissenschaftliche Forschung erschloss. \nVon Alexander von Humboldt <br/>Mit Wolfgang Büttner <br/>NDR <markup type=\"abbr\" abbreviation=\"1963\" correspondent=\"neunzehnhundertdreiundsechzig\">1963</markup> / 2 Teile\nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
