  description: Kommt ein Komiker ins U-Boot ... Was wie der Anfang eines Witzes klingt, ist beim "Käpt'ns Dinner" über die Jahre ziemlich oft passiert. Für das "Best of Comedy" versammelt Michel Abdollahi die lustigsten, schrägsten und überraschendsten Momente aus seinen Gesprächen mit Deutschlands Comedy- und Satiregrößen. Mit dabei sind unter anderem Anke Engelke, Kurt Krömer, Maren Kroymann, Kaya Yanar, Sarah Bosetti, Abdelkarim und Meltem Kaptan.
