  title: In Erinnerung an Elke Sommer
  subtitle: Best of Comedy mit Michel Abdollahi
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der NDR erinnert an die Schauspielerin, Sängerin und Malerin Elke Sommer mit ihren schönsten Auftritten in NDR Talkformaten.
    Als Elke Schletz 1940 in Berlin geboren, wurde sie 1958 als "Miss Viareggio" entdeckt und eroberte als Elke Sommer erst Rom, dann Deutschland und schließlich Hollywood. Dort drehte sie mit Legenden wie Paul Newman, Peter Sellers und Dean Martin und galt damals als das deutsche Sexsymbol schlechthin. Sie lebte in Los Angeles und in Franken und widmete sie sich hier ihrer zweiten Leidenschaft, der Malerei.
    Nun ist die Schauspielerin kurz vor ihrem 86. Geburtstag in Bel Air, Los Angeles, Kalifornien gestorben.
