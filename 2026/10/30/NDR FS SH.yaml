  title: die nordstory - MV von oben
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: die nordstory - MV von oben - Krasse Landschaft, coole Leute
  description: 'Mecklenburg-Vorpommern: flaches Land, weiter Blick, beeindruckende Natur, Idylle, Ruhe und fast 2000 Kilometer zum Teil schroffe Küstenlinie. Im Landesinneren erstrecken sich weite, grüne Felder und sanfte Hügel und immer wieder auch Landschaften, die man hier im Norden nicht erwarten würde. Menschen, die hier gern leben und arbeiten zeigen das Land aus einer völlig ungewöhnlichen Perspektive: Mecklenburg-Vorpommern von oben.'
