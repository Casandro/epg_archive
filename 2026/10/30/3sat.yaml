  description: |-
    In Deutschland hat rund ein Viertel der Bevölkerung hat einen Migrationshintergrund und damit eine andere Kultur. Für eine eigene Kultur braucht es aber nicht unbedingt eine andere Herkunft.

    Auch Gehörlose haben ihre eigene Sprache, Kultur und Identität. "Sehen statt Hören" trifft auf drei Menschen, die mit der Herausforderung umgehen, trotz unterschiedlicher kultureller Hintergründe, Werte und Traditionen offen und tolerant zu sein - oder zu werden.
