  description: |-
    Mitten zwischen zwei der schönsten Nationalparks Rumäniens windet sich eine einzigartige Gebirgsbahn an steilen Abhängen entlang und offenbart die unberührte Natur des Banater Gebirges.

    Wo einst der Mensch die Landschaft formte und Bergwerke in die Karststeine schlug, kann sich heute die Wildnis ungestört entwickeln. Das Filmteam fährt mit 17 Stundenkilometern durch die südwestrumänischen Karpaten und erzählt Geschichten entlang der Bergbahnlinie.
