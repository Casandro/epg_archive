  audiodesc: true
  description: |-
    Deutschland 2026
    Der Fall Block - In Hamburg steht Christina Block vor Gericht. Ihr wird vorgeworfen, die Entführung ihrer beiden jüngsten Kinder aus Dänemark in der Silvesternacht 2023/24 in Auftrag gegeben zu haben. Etwa zwei Wochen nach der Entführung führt ZEIT-Reporterin Anne Kunze Interviews mit der Familie des Vaters. Am 12. Oktober verlangen Staatsanwaltschaft und Landeskriminalamt die Herausgabe der Aufnahmen.

    Erosion der Nachkriegsordnung - Die nach 1945 entstandene internationale Ordnung zerfällt zunehmend. Sind die Lehren aus dem Zweiten Weltkrieg obsolet? Wie können sie neu gedacht werden, um angesichts aktueller Krisen weiterhin Orientierung zu bieten?

    Buch: "Europa in 7 1/2 Kapiteln" - Gespräch mit Autor Timothy Garton Ash

    Oper "Siegfried" in München - An der Bayerischen Staatsoper in München wird die Partie des Waldvogels in Richard Wagners Oper Siegfried in der aktuellen Inszenierung von Tobias Kratzer unter anderem von jungen Sängern des Tölzer Knabenchors übernommen.

    Siovo - Der 24-jährige Sänger Siovo hätte seinen großen Auftritt auf der Bühne des CSDs in Berlin haben sollen - der Anschlag machte diesen Moment zunichte. Am 30. Oktober erscheint sein neues Album, das dazugehörige Konzert im Berliner Lido ist bereits ausverkauft

    Moderation: Lilian Moschen
    HD-Produktion
