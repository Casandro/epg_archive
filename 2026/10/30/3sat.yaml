  title: Andalusien - Spaniens maurischer Süden
  subtitle: Film von Julien Bur
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Umgeben vom Atlantischen Ozean und dem Mittelmeer, bildet Andalusien mit dem Felsen von Gibraltar die südlichste Region der Iberischen Halbinsel und des europäischen Festlands.

    Seine vielfältigen Landschaften, die reiche Kultur und die schönen Städte, in denen lebendige Geschichte und altes Handwerk blühen, machen Andalusien zu einem der attraktivsten Reiseziele Europas.
