  description: |-
    Durch die Rhodopen, ein abgelegenes Gebirge südlich der bulgarischen Hauptstadt Sofia, führt die höchstgelegene Personenzugstrecke des Balkans und letzte bulgarische Schmalspurbahn.

    In 2000 Metern Höhe schlängelt sie sich durch Europas bedeutendste Vogelschutzgebiete, weite Naturräume und den Pirin-Nationalpark. Die Regierung wollte die Strecke schon oft stilllegen - nur einigen Bewohnern ist es zu verdanken, dass sie noch immer täglich fährt.
