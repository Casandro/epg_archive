  title: SPIEGEL TV - Reportage
  subtitle: |-
    SPIEGEL TV Verbrechen - Spurlos verschwunden
    Information, D 2024
    Altersfreigabe: ab 12
  description: Immer wieder missbraucht und entführt ein maskierter Unbekannter in den 90ern Kinder aus Jugendheimen und Zeltlagern. Erfolglos jagt die Polizei einem Phantom hinterher - bis sich 2011 ein ehemaliges Missbrauchsopfer an seinen Betreuer erinnert ... Im Juli 1996 verschwindet eine Frau aus Rheinsbach. Ihr Ehemann behauptet, sie hätte ihn verlassen. Die Polizei glaubt ihm und stellt die Suche nach ihr ein. 16 Jahre später werden die Ermittler erneut mit dem Fall konfrontiert.
