- eventId: 659906
  start: 2026-10-30T17:04:00Z
  stop: 2026-10-30T18:00:00Z
  title: Východočeské výlety
  description: Tam, kde dnes stojí v Pardubicích Paramo, bývala kdysi vesnice Přerov. Na počátku 16. století to bylo 16 statků a hospoda. Když byly v jejich blízkosti objeveny léčivé prameny, postavili tamní podnikatelé budovu lázní a kapličku svaté Trojice. Obě stavby bohužel v roce 1860 vyhořely. Během následné rekonstrukce byl dostaven hostinec, který nesl dlouhá léta jméno svého majitele pana Kasala. Jaký byl další osud Přerova u Pardubic, hospody u Kasalů a kapličky sv. Trojice vám řekne Šárka Kuchtová v pořadu Východočeské výlety. (repríza)
