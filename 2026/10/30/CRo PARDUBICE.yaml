  title: Radioporadna
  description: Víte, k čemu je dobrá vakuovačka? Tentokrát se v Radioporadně s bylinkářkou Radkou Svatošovou zaměříme na praktické pomocníky v domácnosti, kteří pomohou jednoduše zpracovat podzimní úrodu. A protože začíná dušičkové období, popovídáme si také o tom, jak naši předkové prožívali tuto dobu a jakou roli v jejich životě hrály léčivé rostliny. Moderuje Jitka Slezáková.
