  start: 2026-10-30T07:35:00Z
  stop: 2026-10-30T07:55:00Z
  title: Máme hosty
  description: Zpěv patří na základních uměleckých školách tradičně mezi nejžádanější obory. Pardubická Základní umělecká škola Havlíčkova není výjimkou. O výuce zpěvu si budeme povídat s učitelkou zmíněné zušky Zdeňkou Grossovou. Přijdou s ní také její svěřenkyně Adéla Gottvaldová a Alice Vacková, které nám představí svůj projekt Divoce! a pozvou na koncert. Moderuje Jakub Malý.
