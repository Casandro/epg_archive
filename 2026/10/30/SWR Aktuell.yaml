  title: SWR Aktuell Langstrecke
  description: "14:00 - 15:00\nTwilight forever - Love Generation \"Twilight\"\n\"Die schlechtesten Bücher aller Zeiten\": Ausgerechnet die vier \"Twilight\"-Romane von Stephenie Meyer führen dieses Ranking auf der Leseplattform Goodreads an. \nGleichzeitig wurden über 160 Millionen Exemplare verkauft, TikTok ist voll mit \"Twilight\"-Content, Netflix plant eine \"Midnight Sun\"-Serie. Nina Wolf, SWR Kultur Literaturredakteurin und 2006 selbst eine dreizehnjährige Leserin mit ICQ-Nummer im Kopf und Bruno-Banani-Duftwolke, kehrt in der ersten Folge vom Podcast \"Twilight forever\" zu Bella, Edward und der Love Generation der Nullerjahre zurück:\nWarum hat die Vampir-Liebesgeschichte so viele junge Leserinnen verzaubert und wurde gleichzeitig so gehasst? Und warum können wir bis heute nicht aufhören, über sie zu reden?\nAutorin:  Nina Wolf\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/twilight-forever/urn:ard:show:365fdfb5a3299aab/\n\nTwilight forever  - Vampir im Internet\nDracula hat kein TikTok, dafür gibt es unzählige Reels, Memes und Parodien zu \"Twilight\" im Netz.\nVon \"Twilight forever\" klicken wir uns mit Bella und Edward durchs Netz: Ist der hübsche Blutsauger nicht doch eher eine totale \"Red Flag\"? Die Fans zeigen sich online als gewitzt und produktiv: Fanfiction repariert die Story, schreibt Sex und neue Figuren hinein - bis hin zu \"Fifty Shades of Grey\" als Twilight-Fanfic, die zum Weltbestseller wird.\nAus jugendlicher Schwärmerei wird eine weibliche Online-Fankultur, die ihren Lieblingsstoff liebt, umbaut und kritisiert. Memes als kleine Vampire: Sie saugen \"Twilight\" aus und machen es unsterblich.\nAutorin:  Nina Wolf\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/twilight-forever/urn:ard:show:365fdfb5a3299aab/"
