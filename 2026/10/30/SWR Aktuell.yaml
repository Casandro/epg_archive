  title: Der Tag
  description: "19:00\nAus dem Leben - \nmit dem Wissenschaftsjournalisten Dirk Steffens\nGerade in Krisen gibt es für Dirk Steffens zum Optimismus keine Alternative. Daher zeigt der Wissenschaftsjournalist in seinem Buch \"Hoffnungslos optimistisch\", wie wir die Zukunft wieder stärker als Chance sehen können. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/\n\n19:30\nKultur - Der Dalai Lama-Fotograf. Manuel Bauer erzählt von seinem Job als Fotojournalist\nManuel Bauer begleitet seit 35 Jahren den Dalai Lama. Als Fotograf ist er dem spirituellen Oberhaupt des tibetischen Buddhismus wohl näher gekommen als jeder andere. Beim \"Weitsicht\"-Festival in Darmstadt berichtet er jetzt mit einem Bildervortrag davon. Im Gespräch mit uns erzählt Bauer, wie er als junger Fotoreporter in Tibet die ersten Kontakte geknüpft hat und was er an der Persönlichkeit des Dalai Lama so schätzt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/"
