  title: SWR Kultur - Das Wissen
  subtitle: Problemkind - Wie Jungs ein positives Männerbild entwickeln können
  description: |-
    Von Lukas Meyer-Blankenburg
    Viele angehende Eltern hätten lieber ein Mädchen als einen Jungen. Jungs gelten als laut, aggressiv und anstrengend. In der Schule schneiden sie schlechter ab als Mädchen. In Kriminalitätsstatistiken sind junge Männer besonders auffällig. Studien zeigen, dass viele männliche Jugendliche Orientierung bei frauenfeindlichen und rechten Influencern suchen. Positive Gegen-Vorbilder auf Social Media, aber auch Männer als Erzieher und Lehrer gibt es kaum. Die bräuchte es, ebenso wie gendersensiblere Eltern, die mit ihren Söhnen mehr über Gefühle sprechen. Fachleute sagen: unserer Gesellschaft fehlt eine Definition von Männlichkeit.
