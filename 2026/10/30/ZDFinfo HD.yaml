  description: |-
    Frankreich 2023
    Seit drei Generationen regiert die Kim-Dynastie Nordkorea mit eiserner Faust. Es ist eine Familiendiktatur im Deckmantel eines kommunistischen Systems. Wie kann das funktionieren?

    Propaganda, Einschüchterung und Überwachung bilden die inneren Säulen der nordkoreanischen Gesellschaft. Es sind streng geheime Strukturen, in die kaum jemand Einblick bekommt. Denn nach außen ist das Land hermetisch abgeschlossen.
