  subtitle: |-
    Meth and the City
    Doku-Serie, USA 2022
    Altersfreigabe: ab 12
    (WH vom Freitag, 23.10.2026, 12:40 Uhr)
  description: In San Diego wird Methamphetamin in einem Fahrzeug entdeckt - versteckt in den Türen, dem Reserverad und sogar im Tank. Am JFK-Flughafen werden unscheinbare Pakete als Drogenverstecke enttarnt. In Miami und Fort Lauderdale geraten auffällig nervöse Reisende ins Visier der Ermittler, darunter ein Verdächtiger, der versucht, Ketamin als Augentropfen auszugeben.
  widescreen: true
- eventId: 698794
