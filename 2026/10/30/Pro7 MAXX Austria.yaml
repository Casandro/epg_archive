    Gefälschte Tests
    Doku-Serie, USA 2022
    Altersfreigabe: ab 12
    (WH vom Freitag, 23.10.2026, 11:50 Uhr)
  description: Am JFK-Flughafen gerät ein Reisender mit einer ungewöhnlich großen Anzahl an Turnschuhen ins Visier, während eine Frau mit unverzolltem Bargeld gestoppt wird. In El Paso werden versteckte Drogenpäckchen und ein Fahrzeug mit einem Geheimfach entdeckt. Währenddessen prüfen die Beamten in Detroit gefälschte Testkits sowie nicht zugelassene Babynahrung, und in Chicago führt ein abgefangenes Drogenpaket zu einer Undercover-Operation.
  widescreen: true
- eventId: 698793
  start: 2026-10-30T06:45:57Z
