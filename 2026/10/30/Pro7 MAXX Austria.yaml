    Altersfreigabe: ab 12
    (WH vom Freitag, 23.10.2026, 13:20 Uhr)
  description: 'Zollbeamte am Port Everglades machen einen spektakulären Fund: In zwei als Avocados deklarierten Containern aus der Dominikanischen Republik entdecken sie rund 140 Kilogramm Kokain. In El Paso kämpfen die Behörden täglich gegen den Menschenschmuggel - Luftpatrouillen und Razzien in sogenannten Stash-Häusern fördern erschreckende Zustände zutage.'
  widescreen: true
