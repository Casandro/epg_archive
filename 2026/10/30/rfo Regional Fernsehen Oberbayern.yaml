  description: 'Wie bleibt Burghausen ein starker Industriestandort? Beim dritten Energiegipfel diskutierten Experten und Industrie über den wachsenden Strombedarf, neue Kraftwerksprojekte und den Ausbau der Stromnetze als Schlüssel für die künftige Energieversorgung. +++ Bahnreisende in Rosenheim müssen sich 2026 auf massive Einschränkungen einstellen: Die DB saniert die Strecke Rosenheim-Freilassing, vom 7. Februar bis 9. Juli fahren keine Personenzüge. Ersatzbusse sollen übernehmen, Autobahnen werden auf Mehrverkehr vorbereitet. +++ Der Landkreis Altötting bricht die Verhandlungen mit 3M über die Folgekosten der jahrzehntelangen PFAS-Produktion im Chemiepark Gendorf ab. Landratsamt und bayerische Ministerien sehen keine Chance mehr auf eine außergerichtliche Einigung; es geht um mögliche Milliarden. +++ In Kolbermoor hat ein Schulbus beim Rechtsabbiegen einen vorfahrtsberechtigten Radfahrer erfasst. Der Mann wurde leicht verletzt und ins Krankenhaus gebracht. Die Polizei ermittelt, ob der Busfahrer den Radler übersah, möglicherweise wegen Sonnenblendung. +++ Nach einem Geldbörsendiebstahl im Rosenheimer Aicherpark sucht die Polizei zwei etwa 18-jährige Frauen. Sie sollen mit einer aus einem vergessenen Rucksack entwendeten EC- und Kreditkarte in einem Drogeriemarkt bezahlt haben. Ermittlungen wegen Diebstahls und Betrugs.'
