  title: Süd Journal vom 29.10.2026 (Wh.)
  subtitle: Demo am Samstag - Rosenheim stellt sich auf Protest ein +++ Gespenstermacher in Rosenheim +++ Schulwiedereröffnung in Burghausen
  description: 'In Rosenheim folgt auf die Demo Merz muss weg am Samstag der nächste Protest: Unter dem Motto Gen Z regelt wird erneut in der Innenstadt demonstriert. Im Fokus stehen neben politischen Forderungen auch mögliche Gewaltausbrüche. Luca Fischer unterstützt die Veranstalter. +++ In Rosenheim feiert die Volksbühne St. Nikolaus morgen die Premiere der bayerischen Komödie Gespenstermacher: Wirtshaus-Situationskomik mit Dialekt, derbem und makabrem Humor. Bis Ende November im Künstlerhof am Ludwigsplatz, Tickets im Ticketzentrum und an der Abendkasse. +++ Nach zwei Jahren Bauzeit ist die Hans-Stethaimer-Grundschule in Burghausen an ihren Standort zurückgekehrt. Die Stadt investierte rund 15 Millionen Euro in die Generalsanierung des denkmalgeschützten Gebäudes. Entstanden ist eine moderne Schule mit erhaltener historischer Substanz.'
