  description: |-
    Diskussion über kostenlose Solarstrom-Mittagsangebote, Netzstabilität, Ausfälle bei Bahnaufzügen und Forderungen nach besseren Mobilitätsgarantien.
     *** Zum grauen Monatswechsel sorgt Hoch JURIJ vielerorts für Nebel und trübes Wetter mit schlechter Sicht, im Westen und Süden gibt es zeitweise Auflockerungen. Am Samstag fällt etwas Regen, später auch in Bayern. Zu Allerheiligen bleibt es meist wolkig, oberhalb 1.000 Meter schneit es in Bayern.
