  description: 'Seit 2020 verwandelt Street Art Rosenheim: 40 frei zugängliche Fassaden zeigen Kunst für alle. Die Städtische Galerie Rosenheim und die meine Volksbank Raiffeisenbank eG bringen 2026 beim Festival Transit Art fünf neue Werke von Video Skre, Nean, Hera, Amazonas und ATE in die Stadt. +++ In Haiming feiert der Kulturverein Feinherb e.V. sein 20-jähriges Bestehen und holt Bluegrass zurück an den Innspitz. Am 31. Oktober spielt Johnny & The Yooahoos im Bürgerhaus Unterer Wirt. Im November folgen Konzerte mit Hauser und 6teen Strings sowie dem Onkel Bazi Orchester. +++ Kommunen können bis 1. Februar 2027 Bundesmittel für die Sanierung und Modernisierung von Sportstätten beantragen: 333 Mio. Euro aus SKS II. Gefördert werden kommunale Anlagen aller Art mit 250.000 bis 8 Mio. Euro, auch zur Weitergabe an Vereine. Daniela Ludwig wirbt für schnelle Anträge.'
