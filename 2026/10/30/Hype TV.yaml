  title: 'Emisija: Dobro jutro, mama'
  description: ',,Dobro jutro, mama emisija je posvećena mamama, bebama, roditeljstvu i svemu što donosi svakodnevni život s djecom.Od trudnoće i pripreme za dolazak bebe, preko prvih dana u rodilištu i kod kuće, do prehrane, dojenja, njege, razvoja djeteta, tjelesne aktivnosti i brige o zdravlju! Otvaramo pitanja koja si svaka mama postavlja, a često nema koga pitati.U svakoj epizodi razgovarat ćemo s relevantnim stručnjacima, pedijatrima, liječnicima, nutricionistima i trenerima kako bi mame dobile korisne, provjerene i praktične informacije.Posebnu pozornost posvetit ćemo i samoj mami. Njezinoj prehrani, oporavku, tjelesnoj aktivnosti, energiji, ali i izazovima koje donosi nova životna uloga.Prva epizoda donosi teme poput hranjenja bebe, žutice kod novorođenčadi, presvlačenja i njege bebe, šetnje s bebom, boravka u rodilištu, prvog dana s bebom i dojenja.Kada stigne beba, stiže i milijun pitanja.,,Dobro jutro, mama tu je da zajedno pronađemo odgovore na njih.'
  subtitle: Magazin
