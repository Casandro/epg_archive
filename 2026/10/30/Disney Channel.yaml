  description: 'Regie: John Musker, Ron Clements, Brett Ratner. Darsteller: Tate Donovan, Susan Egan, James Woods. Hercules ist der Sohn der Götter Zeus und Hera und hat übermenschliche Kräfte. Als Säugling wird er von Hades, dem Gott der Unterwelt, entführt und ausgesetzt. Glücklicherweise wird er gefunden und verbringt seine Kindheit bei "irdischen" Adoptiveltern. Eines Tages wird das Findelkind jedoch über seine wahre Herkunft aufgeklärt. Um aber in den Olymp zurückzukehren, wird ihm eine Aufgabe gestellt: Er muss sich unter den Sterblichen als wahrer Held erweisen.'
