  title: Host Dopoledne pod Ještědem
  description: 'Téma: Symboly Dušiček. Farář: Antoni Wasil. Dušičky, které si připomínáme jako Památku zesnulých, nesou hlubokou symboliku spojenou se světlem, vzpomínkou, koloběhem života a křesťanskou vírou ve věčný život. O historií Dušiček, o známých i méně známých symbolech tohoto období, si budeme povídat hodinu před polednem.'
