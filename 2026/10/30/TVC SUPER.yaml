  title: Sprawa Iwony Wieczorek 1 (odc. 2)
  subtitle: Drugi odcinek poświęcony jest początkom śledztwa dotyczącego zaginięcia Iwony Wieczorek. Jak wyglądały działania policji, a jak prywatnego detektywa. Sprawa staje się bardzo medialna.
  description: |-
    Tytuł oryginalny: The Case of Iwona Wieczorek
    PL, 2023
    Reżyseria: Piotr Bernaś
    Serial dokumentalny przybliżający tajemniczą sprawę Iwony Wieczorek. Jej zaginięcie jest jedną z najgłośniejszych i najbardziej zagadkowych spraw tego typu w ostatnich latach. W nocy z 16 na 17 lipca 2010 roku dziewiętnastoletnia wówczas dziewczyna wracała z sopockiego klubu. Nigdy nie dotarła do domu, a ostatni raz została uchwycona przez kamery monitoringu nieopodal parku im. Ronalda Reagana w Gdańsku. Gigantyczna akcja poszukiwawcza nie przyniosła rezultatu.
