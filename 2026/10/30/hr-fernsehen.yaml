  description: Große Kunden muss man wie ein rohes Ei behandeln - das A und O im Geschäftsleben. Leider zeigt Direktor Hesselbachs großer Kunde, Herr Dengler vom "Warenhaus der großen Neuigkeiten", nicht nur alle Merkmale eines rohen Eis. Er zeigt ihm auch einen rohen Patron, was wiederum dem Prokuristen Willi Hesselbach auf die Nerven geht. Vater und Sohn geraten sich über diesen merkwürdigen Kunden in die Haare. Willi ist drauf und dran, der Firma den Rücken zu kehren. Doch seine Geschäftspraktiken erweisen sich am Ende als erfolgreicher.
