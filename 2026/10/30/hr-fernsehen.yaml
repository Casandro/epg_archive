  title: Eisbär, Affe & Co. (190)
  subtitle: Zoogeschichten aus Stuttgart
  description: |-
    Eine weibliche Chimäre kommt nach 37 Stunden Flug und Fahrt aus Kanada nachts in der Stuttgarter Wilhelma an. Der seltene Tiefsee-Fisch braucht die Dunkelheit und darf auf keinen Fall zu warm werden.
    Im Amazonien-Haus nutzt Thomas die nächtliche Ruhe, um junge Kröten auszusetzen. Jetzt schlafen ihre Fressfeinde, und die Jungtiere haben Zeit, sich in ihrem neuen Zuhause zurecht zu finden.
    Nachtwächter Christian und Schäferhund Cäsar sind das Team, das die tierischen Bewohner der Wilhelma nachts bewacht. Der größte Feind für Flamingo, Pinguin und Co.: der heimische Fuchs aus der Umgebung des Zoos.
