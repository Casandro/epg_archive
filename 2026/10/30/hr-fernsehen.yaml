  title: Giraffe, Erdmännchen & Co. (24)
  subtitle: Zoogeschichten aus Frankfurt und Kronberg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mord im Frankfurter Zoo. Ein Privatdetektiv arbeitet verdeckt. Als Tierpfleger getarnt versucht er zwischen Seebären-Becken und Affenhaus das Verbrechen aufzuklären.
    Die Dreharbeiten für eine Krimiserie halten nicht nur die Schauspieler, sondern auch die echten Tierpfleger ganz schön auf Trab.
    Aber auch im Kronberger Opel-Zoo wird ermittelt: In einem Terrarium ist ein kleineres Halsbandleguanweibchen spurlos verschwunden. Pfleger Peter Schramm befürchtet eine Bluttat und verdächtigt die Krustenechsen.
