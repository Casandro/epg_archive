  description: 'Es sollte eine denkwürdige Geburtstagsfeier werden: Ex-Musikerin und Wäschereibesitzerin Dagmar Hagemeister trifft zu ihrem 70. auf ihre ehemalige Duo-Partnerin Trudy Stritter, mit der sie als "Blues-Duo-Buchholz" in der DDR und auch danach große Erfolge gefeiert hat. Ein Streit beendete das. Und jetzt hat Dagmars Tochter Anja Hagemeister ein Wiedersehen organisiert ... welches damit endet, dass Dagmar tot im Wasser treibt. Am Ende muss die WaPo schließlich feststellen, wie groß Hass und Wunden auch über den Tod hinaus sein können.'
