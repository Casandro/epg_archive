  genre:
  - '16'
  description: 'Hubert und Girwidz erreicht ein Notruf aus der Pathologie: Eine Leiche ist verschwunden! Der Tote ist ausgerechnet der Vater der Landtagsabgeordneten Elke Schwiers. Sie treibt seit Jahren die Privatisierung der Klinik und damit auch die Schließung der Pathologie voran. Die Politikerin könnte also das Verschwinden der Leiche ihres Vaters nutzen, um die Klinik in ein schlechtes Licht zu rücken. Mehr aus Freundschaft zu Kollegin Fuchs, denn aus kriminalistischer Überzeugung machen sich Hubert und Girwidz auf die Suche nach der Leiche.'
