  title: Zeit zu Reden
  subtitle: mit Gersthofens Bürgermeisterin Susanne Olita
  description: Seit Mai ist Susanne Olita Bürgermeisterin der Stadt Gersthofen und damit auch die erste Frau auf dem Bürgermeistersessel in Augsburgs Nachbarstadt und nach der Kommunalwahl auch eine der wenigen verbliebenen Frauen in diesem hohen Amt. Die Gersthoferin kennt ihre Heimatstadt von Klein auf, seit ihrer Kindheit ist sie in vielen Vereinen aktiv. Aber auch die unterschiedlichen Bereiche der Stadtverwaltung sind ihr bestens vertraut, denn seit 26 Jahren ist Susanne Olita bei der Stadt Gersthofen beschäftigt, zuletzt als Büroleiterin ihres Vorgängers und als Standesbeamtin. Welche Pläne sie für Gersthofen hat und welche Themen ihr besonders wichtig sind, erzählt sie im Gespräch mit Moderatorin Andrea Horn.
