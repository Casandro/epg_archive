  title: Passato e Presente Luigi Einaudi l'econo
  subtitle: Passato e Presente Luigi Einaudi l'economista liberale - Nato in Piemonte da famiglia di origini borghesi, Luigi Einaudi dedica tutta la sua vita allo studio e alla ricerca in campo economico. Numerosi son
  description: |-
    o i suoi contributi, tutti tesi alla promozione del libero mercato, contro i monopoli e l'intervento dello Stato che egli, da liberale e liberista, considera estremamente dannosi per il Paese. Accanto a tale attività prevalente, non fa mancare il suo impegno diretto nelle istituzioni. L'iniziale entusiasmo verso il fascismo si attenua via via che il regime manifesta la sua reale natura. Dopo il crollo del regime, Einaudi riprende il suo impegno pubblico da rettore dell'Università di Torino ma, dopo l'8 settembre, ricercato dalle autorità fasciste, è costretto a rifugiarsi in Svizzera. Fa rientro in Italia a guerra ancora in corso per assumere l'incarico di governatore della Banca d'Italia, poi nel 1946, da convinto monarchico, viene eletto all'Assemblea costituente nelle file del partito liberale. Dopo una breve parentesi al governo, come Vicepresidente del consiglio con De Gasperi, l'11 maggio 1948 è eletto Presidente della Repubblica. Durante tutto il settennato mantiene il suo profilo accademico, rimanendo uno studioso al servizio delle istituzioni democratiche. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno Produttore esecutivo Valentina Tassini Regia Davide Frasnelli

