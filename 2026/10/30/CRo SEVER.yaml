  title: Host Dopoledního expresu
  description: Podzimní měsíce s sebou na silnicích přinášejí jedno velké riziko a to zvýšenou aktivitu lesní zvěře a s ní spojené dopravní nehody. Co dělat, když vám srna nebo divočák skočí přímo pod kola? Jak správně postupovat na místě nehody a co je klíčové pro hladké vyřízení škody u pojišťovny? Hostem Dopoledního expresu dnes bude Jan Marek, tiskový mluvčí Generali České pojišťovny, který se zaměří na praktické řešení škod při srážce se zvěří. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Milan Král.
