  title: Rocky 5
  subtitle: |-
    Rocky 5
    Action, USA 1990
    Altersfreigabe: ab 12
  description: |-
    Nach seinem letzten Kampf ist Boxweltmeister Rocky Balboa schwer angeschlagen. Er erklärt seinen Rücktritt - und erlebt wenig später eine böse Überraschung: Er ist pleite. Ein Comeback im Ring kommt für ihn nicht infrage. Doch Rocky bekommt eine neue Chance - als Trainer des jungen Tommy, der sich als Fighter der Extraklasse erweist. Tommy steht bald im Scheinwerferlicht. Presse und Fans aber sehen immer noch in Rocky den wahren Weltmeister - sie fordern seine Rückkehr ...

    Regie: John G. Avildsen
    Drehbuch: Sylvester Stallone
