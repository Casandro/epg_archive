    British Bulldog
    Doku-Reihe, USA 2024
    Altersfreigabe: ab 12
  description: |-
    David Smith alias "The British Bulldog" zählt zu den bekanntesten Wrestlern Großbritanniens. Bereits mit vierzehn Jahren steht er das erste Mal im Ring und erlangt schon bald weltweiten Ruhm. Sein Erfolg wird jedoch von seiner Sucht überschattet, die schließlich zu seinem viel zu frühen Tod führt. In exklusiven Interviews blicken Daveys Freunde und Familie auf sein turbulentes Leben zurück.

    Regie: Kieran Bent
    Schnitt: Sean Kincade, Nick Mark
