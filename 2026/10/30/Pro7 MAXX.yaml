  title: Rocky Balboa
  subtitle: |-
    Rocky Balboa
    Drama, USA 2006
    Altersfreigabe: ab 12
  description: |-
    Sylvester Stallone steigt ein letztes Mal als Rocky in den Ring: Box-Champion Rocky Balboa hat seine Karriere beendet und führt inzwischen ein Restaurant. Die Erinnerungen an die ruhmreichen Tage sind jedoch immer noch frisch - genauso wie der Schmerz über den Tod seiner geliebten Frau Adrian. Eines Tages erhält Rocky die Chance, gegen den aktuellen Schwergewichts-Champion Mason Dixon anzutreten und sich noch einmal im Kampf zu beweisen.

