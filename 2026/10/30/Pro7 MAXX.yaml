  title: Highway Heroes Down Under
  subtitle: |-
    Ein Highway steht still
    Doku-Serie, AUS/NZ 2022
    Altersfreigabe: ab 12
  description: |-
    Drei Bergungsteams stehen vor gewaltigen Herausforderungen: Clayton's Towing muss auf dem berüchtigten Bruce Highway in Queensland einen havarierten Milchlaster aus einer steilen Böschung bergen - unter Zeitdruck und bei drohenden Regenwolken. In New South Wales kämpft Wagga Truck Towing mit einem querliegenden Sattelschlepper, dessen Getreideladung eine ganze Straße unter sich begräbt. Und Truckworks rückt einem ausgebrannten Forstgiganten zu Leibe, der am Hang festsitzt.

    Schnitt: Lukasz Termer, Andrew Campiutti
  widescreen: true
