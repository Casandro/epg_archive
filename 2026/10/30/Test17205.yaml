  title: Objectif Monde L'hebdo
  description: 'Indonésie : les aventuriers d''un monde perdu En Indonésie, sur l''île de Sulawesi, s''élève le Tangkelemboke, un massif calcaire oublié des cartes, couvert de brume et de forêts primaires. De novembre à décembre 2025, une cinquantaine de personnes, conduites par l''explorateur français Evrard Wendenbaum, s''y sont aventurées pour la première fois. Objectifs de cette mission inédite : découvrir de nouvelles espèces animales et végétales, et mettre au jour des vestiges archéologiques précieux dans ce sanctuaire encore vierge. Evrard, explorateur militant, finance ses expéditions grâce à des fondations, des organismes d''État et, depuis quelques années, aux écovolontaires - des jeunes prêts à payer des milliers d''euros pour participer à l''aventure. Un reportage de Laurent Orluc et Thomas Parnet (FTV Presse) pour Envoyé Spécial sur France 2. (Suisse Romande-2026)'
