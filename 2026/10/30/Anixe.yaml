  title: Kochen mit Anixe - Wien-Spezial
  subtitle: Kochen mit Anixe - Wien-Spezial
  description: Diese Kochshow ist Wien gewidmet. Deshalb haben wir zusätzlich zu unserem Koch einen waschechten Wiener eingeladen. Der österreichische Koch Jürgen Knittl zeigt Ihnen wie man echte Serviettenknödel in einer Stoffserviette zubereitet und zaubert zum Dessert noch geschwind leckere "Hollerstrauben". Unser TV Koch Jörg Guhmann rundet das Ganze mit einem leckeren und frischen "Pflanzerlgulasch" aus frischen Pfifferlingen ab. Und eine echten österreichischen Wein gibt es auch zu entdecken.  Hier das komplette Rezept!
