  title: In aller Freundschaft (853)
  subtitle: Zu gut für diese Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Verkäuferin Cornelia Friese bricht während der Arbeit zusammen. Ihr Freund und Kollege Fritz Kemper alarmiert den Notarzt. Bei einer früheren Operation im Rahmen einer Brustkrebsbehandlung wurden Conny alle Lymphknoten in der linken Achsel entfernt. Seitdem hat sie immer wieder Probleme mit ihrem linken Arm und kein Vertrauen mehr zu Ärzten. Dr. Kathrin Globisch schlägt eine Lymphknoten-Transplantation vor, doch davon will Conny nichts wissen. Als sie nach einem weiteren Zusammenbruch noch immer die OP verweigert, stellt Fritz Kemper sie schweren Herzens vor die Wahl: Entweder sie lässt sich helfen oder er verlässt sie.'
