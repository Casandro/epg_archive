  title: ArtCafé
  description: 'LAU - Vyprávění u jídla: spojení chutí, paměti i generací. Performativní projekt tří umělkyň s vietnamskými kořeny, které sdílejí s diváky své životní příběhy u vietnamského hot potu. Nabízí možnost ocitnout se uprostřed gastronomického rituálu a poznat zkušenosti tří žen, které dospívaly v 90. letech a nesou v sobě více než jeden jazyk, více než jednu kulturu a více než jeden domov. Moderuje Dominika Mithofer. E-mail: artcafe@rozhlas.cz'
