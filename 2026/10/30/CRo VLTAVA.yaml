  title: Vizitka
  description: 'Marek Vrabec. Hudba, která překračuje hranice žánrů i očekávání. Festival Prague Sounds letos slaví třicet let a jeho zakladatel a ředitel Marek Vrabec zve na jedenáct listopadových večerů, během nichž se Praha rozezní současnou vážnou hudbou, jazzem, hip-hopem i elektronikou. Od smyčcového kvarteta Brooklyn Rider po hvězdnou sitáristku a skladatelku Anoushku Shankar. Jjubilejní ročník nabídne nečekaná hudební spojení a také rezidenci v Rudolfinu. Festival, který začínal v roce 1996 na Pražském hradě ještě pod názvem Struny podzimu, patří k nejvýraznějším hudebním přehlídkám u nás. Jak se za tři desetiletí proměnil a co pro něj znamená hledat stále nové cesty mezi hudebními světy? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
