  description: "Um Wörter wie \"Rangdewuh\", \"Wissawieh\" oder auch \"Triddewahr\", Wörter aus seiner Kindheit in Zwickau, geht es mit Bernd-Lutz Langes Blick zurück in die 50er Jahre - einem Auszug aus seinen Erinnerungen \"Magermilch und lange Strümpfe\". Die Sachsen haben sich manch französische Vokabel mundgerecht gemacht - zum Beispiel heißt es: \"Morr muß de Konndennangs bewahrn\". Und \"Contenance\" heißt im Französischen Haltung oder Fassung.\n\nLive-Mitschnitt in Döbeln vom 28.06.2006.\n\nProduktion: MDR 2006\n\nMitwirkende: \nBernd-Lutz Lange"
