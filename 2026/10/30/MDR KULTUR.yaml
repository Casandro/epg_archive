  title: 'MDR KULTUR Spezial: ZUM WOCHENENDE'
  description: "* Gespräch Mendelssohn-Festtage vor dem Start\n\n* Goethehaus vor langer Schließung\nEs handelt sich um nicht weniger als Weimars wichtigsten Touristenmagneten: Das Goethe-Wohnhaus.\nDoch ab kommenden Montag wird es schließen - für drei Jahre - und wird umfassend saniert. Die Klassik Stiftung hat sich deshalb viele Gedanken gemacht, wie diese Zeit mit alternativen Angeboten überbrückt werden kann.  MDR KULTUR Reporterin Samira Wischerhoff berichtet, was in den drei Jahren Sanierung passiert und wie Besucher trotzdem noch Goethes Wohnhaus entdecken können.\n\n* Yello - Time Lab\nBoris Blank von den Schweizer Elektro-Pop-Pionieren Yello verfügt über eine der größten Klang-Bibliotheken der Welt. Seit über 50 Jahren sammelt der ehemalige LKW-Fahrer Samples und Sounds, die er dann in seine eigenen Kompositionen einfließen lässt. So auch auf dem neuen Album der Eidgenossen, das den Titel \"Time Lab\" - Zeitlabor - trägt. Marcel Anders hat reingehört und Blank in Zürich besucht.  \n\n* Horrorliteratur aus Grimma\nIn Grimma sitzt der Buchheim Verlag, der sich auf Horror und Fantasy spezialisiert hat. Im Programm finden sich auch große Namen aus den USA wie Owen King, den Sohn von Stephen King. Thilo Sauer mit einem Verlagsportrait. \n\n* Serie \"Breitscheidplatz 19/12\" \nDie Miniserie beleuchtet die Ereignisse vor dem islamistischen Terroranschlag auf den Berliner Weihnachtsmarkt am Breitscheidplatz am 19. Dezember 2016 und geht der Frage nach, wie Behördenversagen, fehlende Ressourcen und übersehene Warnsignale die Tat ermöglichten. \n\n\nZwei freie Tage wollen gut erlebt werden. Hier kommen Inspirationen für den Ausflug ins Grüne, den Besuch in Museen und in Galerien, für Konzerte, Theater, Oper und darüber hinaus, was Sachsen, Sachsen-Anhalt und Thüringen zu bieten haben."
