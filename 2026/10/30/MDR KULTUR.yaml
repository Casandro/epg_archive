  description: "* 14:00 Uhr - Nachrichten\n\n* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 14:45 Uhr - Kulturtipps\n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - Ausstellung Lob der Linie - Gerhard Altenbourg zum 100. Geburtstag\nDer in Schnepfenthal geborene Zeichner, Grafiker und Dichter Gerhard Ströch gab sich den Künstlernamen Altenbourg, nach der Stadt Altenburg, in der er den größten Teil seines Lebens verbrachte.\nDie \"Schnepfenthaler Suite\" ist Altenbourgs umfangreichste und eindringlichste Arbeit, ein Spät- und Hauptwerk, das über vier Jahre in enger Zusammenarbeit mit Altenbourg von dem Chemnitzer Künstler und Drucker Thomas Ranft gedruckt wurde. \"Aus den 100 Blättern wurde ein großangelegtes erotisch-anzügliches und zugleich ironisches Welttheater en miniature, ein scheinbar heiteres und heikles Spiel der Liebe und der großen Gefühle im intimen Format.\" (Lindenau-Museum)\n Wir zeigen alle 100 Radierungen der Suite, die in Dresden letztmals vor 27 Jahren als Sonderausstellung auf dem Dresdner Kunstmarkt im Schloss zu sehen war.  Zusätzlich werden frühe Lithographien, Holzschnitte sowie Zeichnungen gezeigt.\nEröffnet wird die Ausstellung von der langjährigen Direktorin des Lindenau-Museums Altenburg und Altenbourg-Expertin Jutta Penndorf. Von Ulrike Thielmann.\n\n* 15:20 Uhr - Vorschau: Lachmesse Chin Meyer\nDie Leipziger Lachmesse lockt: bis zum Sonntag bringt das europäische Humor- und Satirefestival zum 36. Mal die unterschiedlichsten Spielarten der Kleinkunst in die Pleißestadt. Rund 70 Künstler und Acts stehen an etwa einem Dutzend Spielstätten auf dem Programm. Politisches Kabarett gehört ebenso dazu wie Musik-Comedy, Stand-up, Lesungen, Varieté und moderne Clownerie. Mit dabei sind etablierte Künstler und vielversprechende Nachwuchstalente - doch welche Veranstaltungen sollte man sich besonders vormerken? Wir haben für jeden Lachmessetag einen Geheimtips, der ihre Aufmerksamkeit verdient, findet Satireredakteurin Ilka Hein.\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 15:45 Uhr - Schabbat Schalom \nDie jüdische Wochensendung mit dem Kantor der Thüringer Landesgemeinde, Milan Andics.\n\n* 16:00 Uhr - Nachrichten\n\n* 16:10 Uhr - Sachbuch: Julia Ebner \"Von Fitness zu Faschismus. Gefahren extremer Männlichkeit\"\nFleisch, Geld, Muskeln - diesen drei Mythen der Männlichkeit folgt Julia Ebner in die Kämpfe unserer Gegenwart. Vorgestellt von Bastian Wierzioch. \n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 16:40 Uhr - \"Der große Stasi-Leak - Helden oder Verräter\"\n1992 sorgt eine anonym erstellte Liste mit den Klar- und Decknamen von 4.500 mutmaßlichen Inoffiziellen Mitarbeitern der Stasi in Halle für einen der größten Datenskandale im wiedervereinigten Deutschland. Doch wer sie erstellt und veröffentlicht hat, bleibt mehr als drei Jahrzehnte ein Geheimnis. In \"Der große Stasi-Leak - Helden oder Verräter?\" treten die Urheber der Liste erstmals vor die Kamera und erzählen von geschmuggelten Mikrofilmen, konspirativen Aktionen und einer Tat, die Freundschaften, Biografien und die Öffentlichkeit erschüttert. \nDie Dokumentation rekonstruiert einen beispiellosen Akt zivilen Ungehorsams und stellt die bis heute aktuelle Frage: Wie weit darf man für die Wahrheit und seine Überzeugungen gehen? Der Film wird heute im halleschen Puschkino gezeigt und ab 2.11. in der Mediathek. Dörte Hanisch hat ihn schon gesehen.\n\n* 16:50 Uhr - Vorschau: Sven Regener über das Schr"
