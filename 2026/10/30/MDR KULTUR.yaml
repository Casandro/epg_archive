  description: "* 12:15 Uhr - Theater zeigt \"Anleitung zur Zerstörung einer Demokratie\"\nDas Mitteldeutsche Theater Dessau von Dieter Hallervorden zeigt ein Stück, in dem es u gehtm die Frage: Was passiert, wenn Satire zur Macht wird? Ein Interview mit dem Hauptdarsteller Max Tidof.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher \n\n* 12:45 Uhr - Peter Zudeicks satirischer Wochenrückblick\n\n* 13:15 Uhr - Studiosession mit Celine Cairo \nDas dritte Album der Musikerin Celine Cairo heißt \"Panacea\" -  und das steht für das mythologische Allheilmittel Panakeia,  nach dem  Alchimisten Jahrhunderte gesucht haben . Es soll alle Krankheiten heilen, Menschen von ihren Sorgen befreien und unendliches Leben schenken. Während der Arbeit an dem Album fand die Musikerin ihre Art von Heilung und Selbstfindung im Studio und auf einer langen Reise. Darüber spricht sie mit MDR Kultur Musikredakteur Jan Kubon und spielt akustische Versionen ihrer aktuellen Songs.\n \n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher \n\n* 13:45 Uhr - Portrait: neue Ballettchefin Nordhausen\nSie hat ihre künstlerische Karriere in Deutschland begonnen, war dann lange Zeit in ihrer kroatischen Heimat tätig und ist nun wieder zurück. Masa Kolar, ehemalige Tänzerin und nun Choreografin und neue Ballettdirektorin am Theater Nordhausen in Thüringen. Wolfgang Schilling hat sie dort kurz vor der Premiere ihrer ersten Produktion \"Prelude-Bolero-Sacre\" getroffen. \n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
