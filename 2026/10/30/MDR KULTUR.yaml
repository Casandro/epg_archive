  description: "* 09:40 Uhr - Wort zum Tag \n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10:15 Uhr - Der Stichtag: 1741 Angelika Kauffmann geboren\nKaiser, Könige oder Künstler aus ganz Europa wollten sich von ihr porträtieren lassen - denn sie galt schlicht als die beste Malerin von allen und schon zu Lebzeiten wurde sie zur Legende. Angelika Kauffmann wurde heute vor 285 Jahren geboren. Der Stichtag. Von Thomas Hartmann.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher \n\n* 10:40 Uhr - Teaser: Sven Regener über das Schreiben\nNeben seiner Arbeit als Schriftsteller ist Regener auch Frontmann der Band Element of Crime. Mit seinen Büchern und seiner Musik zählt der geborene Bremer zu den bekanntesten deutschen Künstlern der Gegenwart. Besonders populär ist sein Roman \"Herr Lehmann\", in dem er humorvoll das Leben eines jungen Mannes im Berlin der 80er-Jahre beschreibt. Auch sein neuer Roman \"Frankie und Freddie\" spielt in den 80ern, in West-Berlin. Zwei Brüder versuchen, in der Großstadt ihren eigenen Weg zu finden. Gleichzeitig rücken die Weihnachtstage bedrohlich näher - und damit womöglich die Rückkehr zu den Eltern in die Provinz. \nAm 31.10. ist der gebürtige Bremer Gast im MDR KULTUR Café.\n\n* 10:50 Uhr - Das Gedicht: \"Beim Schnitzen der Halloweenkürbisse\" von Margret Atwood\n\"Lyrik handelt vom Kern der menschlichen Existenz: Leben, Tode, Erneuerung, Wandel; in aller Fairness und Unfairness, in aller Ungerechtigkeit und - manchmal - Gerechtigkeit.\" Das sagt die kanadische Schriftstellerin Margaret Atwood. Mit \"Dearly\", zu Deutsch \"Innigst\", veröffentlichte sie nach zehn Jahren, 2020, erstmals wieder einen Lyrikband. Es geht darin um all das, womit sie sich, berühmtermaßen, auseinandersetzt: ob hinreißend genaue Naturbeschreibungen oder witzige Begegnungen mit Außerirdischen, ob drängende politische Fragen oder Mythen und Legenden.\nAtwoods Gedichte sprechen von Neubeginn und Glück. Aber auch von Abwesenheit, Altern und Rückschau. Und anderen, wenig erfreulichen Tatbeständen.\nIn der Übersetzung von Jan Wagner liest Chris Pichler.\n\n* 11:00 Uhr - Nachrichten\n\n* 11:15 Uhr - Feuilleton\nVon Ulrike Thielmann\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher \n\n* 11:45 Uhr - Michael Wollny: \"eine winterreise\"\nAuf seinem neuen Album widmet sich der Leipziger Jazzpianist einem klassisch-romantischen Komponisten: nämlich Franz Schubert. Und wer jetzt an die Moments musicaux denkt, an seine Impromptus oder die wunderbaren Klaviersonaten - nein, die sind es nicht, die Wollny in den Blick genommen hat.\nEr hat sich die Winterreise vorgenommen, Schuberts weltberühmten, viel interpretierten Liederzyklus, diese Lieder, die voller Einsamkeit und Melancholie, voller Tiefe - und damit der Inbegriff der Romantik sind.\nWollny hat seinen ganz eigenen Zugang gewählt, keine Neu-Interpretation, sondern eine Re-Imagination, wie er es nennt. Dabei geht er auf die Suche nach seinem eigenen Weg, begibt sich ins Ungewisse. Michael Wollnys Album \"eine winterreise\" erscheint heute - und ausführlich mit ihm dazu im Gespräch ist am kommenden Dienstag meine Kollegin Julia Hemmerling in ihrem Jazzlabor.\nWer so lange nicht mehr warten möchte, kann jetzt schon mal reinhören ins neue Album. Den Lindenbaum werden Sie mit Sicherheit sofort erkennen. Und das hat Michael Wollny jetzt daraus gemacht...\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit"
