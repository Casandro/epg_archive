  title: Die Verdächtige (4/4)
  subtitle: Serie Tschechische Republik, Frankreich, Deutschland 2022
  subtitled: true
  genre:
  - '16'
  description: Freiheit oder lebenslange Haft - für die Krankenschwester Hana entscheidet darüber nun das Gerichtsverfahren. Hana hat 19 Jahre auf der gleichen Krankenstation gearbeitet, bis nach einem ungewöhnlichen Todesfall ein Ermittlungsverfahren eingeleitet worden ist. Als Hana zur Hauptverdächtigen wird und in ihrer Vergangenheit noch weitere Todesfälle mit Ungereimtheiten ermittelt werden, sieht die ganze Stadt sie auch aufgrund der einseitigen Berichterstattung schnell als Serienmörderin. Durch ihre kalte, direkte Art hat sie auf ihre Umwelt schon immer abweisend gewirkt. Auch vor Gericht sorgen ihre taktlosen Aussagen für Empörung.
