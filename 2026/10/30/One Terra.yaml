  title: Planet Weltweit - Die Bergführer vom Mont Blanc
  subtitle: Planet Weltweit - Die Bergführer vom Mont Blanc
  description: Majestätisch überragt Europas Gipfel die felsigen Bergspitzen der Savoyer Alpen. Der Mont Blanc - seit seiner Erstbesteigung vor 230 Jahren ein Magnet für Alpinisten. Aber der weiße Gigant ist tückisch. Nicht jeder kehrt vom Aufstieg zurück.  Im kleinen Ort Chamonix am Fuße des Mont Blanc treffen sich leidenschaftliche Alpinisten, Familien, die Hautevolee und Einheimische. In der Hochsaison dreht sich alles um den Gebirgssport - und um den mit 4810 Metern höchsten Berg der Alpen. Rund 1000 Menschen versuchen jedes Jahr den Aufstieg - zehn davon bezahlen ihn mit dem Leben, darunter auch erfahrene Bergsteiger. Viele von ihnen unterschätzen den als weniger schwierig geltenden "Normalweg" von der Goûter-Hütte aus. Aber Gletscherspalten, Wetterstürze und Lawinen bedeuten oft tödliche Gefahr. Wir haben neben der Compagnie de Guides, der legendären Bergführertruppe, Menschen besucht, deren Leben eng mit dem Mont Blanc verbunden ist. François Pallandre ist Bergführer und hat die höchsten Gipfel der Welt erklommen. Ein Skiunfall ließ ihn sein Leben überdenken und jetzt hat sein alter Mentor ihn überzeugen können, der Gilde der ältesten Bergführertruppe von Chamonix beizutreten. Diese wurde nach einem Unglück am Mont Blanc 1821 zur sozialen Absicherung der Bergführer und ihrer Angehörigen ins Leben gerufen. François führt seine Klienten auf anstrengenden und gefährlichen Skirouten, gesäumt von verwehten Gletscherspalten, mehrere Meter hohen Türmen aus Gletschereis und schwierigen Schneeverhältnissen. Der Schwierigkeitsgrad der Route wird immer an die Fähigkeiten der Skifahrer und Klienten angepasst - für seine Arbeit braucht er daher nicht nur beste technische und körperliche Voraussetzungen sondern auch viel Menschenkenntnis.  DE 2015
