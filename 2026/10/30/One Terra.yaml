  title: Planet Weltweit - Buddhas Kinder im Goldenen Dreieck
  subtitle: Planet Weltweit - Buddhas Kinder im Goldenen Dreieck
  description: Im wilden Norden Thailands liegt das Kloster "Zum Goldenen Pferd". Abt Phra Khru Ba Neau Chai lebt dort mit 15 Novizen, die er nach den Lehren Buddhas erzieht und in der Kampfkunst Muay Thai ausbildet. Die Region ist seit Jahren Schauplatz für Drogenhandel und Kriminalität. Das bringt für die Bewohner viele Probleme mit sich. Der Abt bietet Mönchen und Bewohnern der umliegenden Bergdörfer eine Perspektive fernab von Drogen und Missbrauch. In Windeseile galoppieren die Mönche und der Abt durch das Bergland im Norden von Thailand, dicht an der Grenze zu Burma und Laos in das Dorf Hua Mae Kham. Sucht und Kriminalität beherrschen hier das Leben vieler Menschen. Die Mönche treffen auf den verwahrlosten siebenjährigen Pumbui, der im Dorf als Dieb und Lügner bekannt ist. Pumbuis Eltern können sich als Tagelöhner nicht um das Kind kümmern. Deshalb möchte der Abt den Jungen mit ins Kloster nehmen, um ihn zu einem Novizen auszubilden und damit eine Chance auf eine bessere Zukunft geben zu können. Pumbui soll lernen, Disziplin und Verantwortung zu übernehmen. Nicht nur durch die Betreuung seines eigenen Pferdes, sondern auch durch tägliche Kraftübungen in der Kampfkunst Muay Thai. Phra Khru Ba Neau Chai war selber Nordthailands Meister in Muay Thai, bevor er sich zum Mönch weihen ließ. Ein Titel, der ihm bis in die heutige Zeit Achtung und Respekt einbringt, von seinen Novizen ebenso wie von den Dorfbewohnern der Umgebung. Neuling Pumbui fällt es zunächst schwer, sich an die strengen Rituale im Kloster zu gewöhnen. Wie viele andere Kinder plagt ihn das Heimweih. An die eiserne Disziplin und die strikte Hygiene, die der Abt seinen Novizen abverlangt, ist er nicht gewohnt. Doch dann kommt sein großer Tag, und er soll zu einem Nag, zum Anwärter auf den Novizen, geweiht werden. Dafür muss Pumbui aber bereit sein, sich dem Klosterleben unterordnen und acht Gebote befolgen, die sein Leben fortan bestimmen werden.  DE 2006
