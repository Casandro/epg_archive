  title: 'Planet Weltweit - China: Die Eisfischer vom Chagan-See'
  subtitle: 'Planet Weltweit - China: Die Eisfischer vom Chagan-See'
  description: Seit über 1.000 Jahren leben Mongolen im Nordosten Chinas. Am Chagan-See in der Provinz Jilin sind sie Fischer geworden - Eisfischer. Von Dezember bis März, wenn es klirrend kalt ist, wagen sie sich jeden Morgen hinaus auf den zugefrorenen See und lassen ein zwei Kilometer langes Netz zu Wasser. Der althergebrachte Brauch ist heute ein einträgliches Geschäft. Fische aus dem noch sauberen Chagan-See erzielen Liebhaberpreise - bis zu 110.000 Euro für einen Großkopfkarpfen! Mit Werkzeugen, die schon ihre Vorväter benutzten und mit der Zugkraft ihrer stämmigen Pferde entfalten und bewegen die Eisfischer ihr riesiges Netz unter der Eisdecke des Chagan-Sees. Auf diese Weise fangen Zhang Wen und seine Männer zwischen 80 und 100 Tonnen Fisch pro Tag. Aber immer häufiger macht ihnen der Klimawandel zu schaffen. Außerdem gibt es Generationskonflikte, denn die Söhne der Fischer haben keine Lust in die Fußstapfen der Väter zu treten. Der knochenharte Job bleibt nämlich schlecht bezahlt, obwohl die Preise für die Fische in die Höhe schießen. Diese Reportage durfte die Eisfischer vom Chagan-See aufs Eis begleiten. Am Tag der Eröffnung der Eisfischsaison bricht Fischer Qi Yashen mit seinen Kollegen schon um kurz nach vier Uhr morgens auf. Stundenlang fahren sie mit Pferdekutschen auf der über einen Meter dicken Eisdecke bis zu einer Stelle, von der sich ihr Boss heute einen guten Fang verspricht. "Youbatous" (Cäpt"ns) wie Zhang Wen hüten ihr Geheimnis, wo zu welchen Zeiten die besten Fischgründe im riesigen Chagan-See sind. Er ist eines der wenigen noch sauberen Gewässer Chinas und berühmt für seinen Fischreichtum. Damit das so bleibt, achten die Eisfischer darauf, dass die Maschen ihrer Netze weit genug sind, damit nur große, erwachsene Fische hängen bleiben. Vor allem auf die großen Karpfen haben es Zhang Wen, sein "Vize" Bing Hailong und ihre Männer abgesehen. Mit drei anderen Teams wetteifern sie heute um den größten Fang. DE 2016
