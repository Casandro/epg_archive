  title: Planet Weltweit - Sibirien, Der Kapitän und die Lena
  subtitle: Planet Weltweit - Sibirien, Der Kapitän und die Lena
  description: 'Seit 35 Jahren ist Kapitän Wassili Wassiljewitsch in den Sommermonaten auf dem mächtigsten Strom Sibiriens unterwegs, der Lena. Sein Schiff namens "Magdeburg" dient als Versorgungs- und Transportschiff. Einsatzgebiet ist der Nordabschnitt des Flusses, am sibirischen Eismeer. Nur drei Monate ist es hier in der Regel eisfrei. Heimathafen der "Magdeburg" ist Jakutsk, die größte Stadt an der Lena. Hier beginnt alljährlich die Reise in den Norden. Jakutsk ist die Hauptstadt der fern im nördlichen Asien liegenden größten föderalen Republik Russlands - Sacha, die Republik der Jakuten. Ihre Fläche ist so groß wie die der Europäischen Union. Im kurzen Sommer zeigt sich die Stadt Jakutsk offen und modern. Im Winter ist sie dick eingepackt, bei Temperaturen bis zu minus 45° C. Diese Reportage war dabei, als es für die "Magdeburg" wie jedes Jahr hieß: "Leinen los! Auf nach Norden!" Kapitän Wassili Wassiljewitsch lebt mit seiner Familie an der Ostsee in Kaliningrad, dem einstigen Königsberg. Aber von April bis Oktober kehrt er auf sein Schiff, die "Magdeburg" zurück, und auf die Lena. Der Strom fließt durch die autonome jakutische Republik Sacha, weit im asiatischen Teil Russlands. Von der Hauptstadt Jakutsk aus führt die Reise der "Magdeburg" 1600 km weit nach Norden. Es geht über den Polarkreis die Lena hinunter, bis zur Landspitze Mys Bykow am Eismeer. Seit 24 Jahren ist die "Magdeburg" für Wassili Wassiljewitsch zur zweiten Heimat geworden. Das Schiff ist beladen mit all dem, was man zum Überleben jenseits der Zivilisation braucht: Lebensmittel, Mehl, Konserven, frisches Obst und Gemüse - und vor allem Baumaterial und Holz. Denn im Norden gibt es nur die baumlose Tundra. Die "Magdeburg" fährt im Auftrag der Regierung zur Unterstützung Bewohner des russischen Nordens. Der Staat trägt zwei Drittel der Kosten. DE 2015'
