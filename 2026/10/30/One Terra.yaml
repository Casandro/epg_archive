  title: Planet Weltweit - Die Oldtimer von Curaçao
  subtitle: Planet Weltweit - Die Oldtimer von Curaçao
  description: |-
    Wer auf der Karibik-Insel Curaçao ein Auto besitzt, das mindestens 30 Jahre alt ist, kann ganz offiziell ein sogenannter 'Wabi-Boy' werden. Der Wabi-Club mit seinen über 100 Mitgliedern ist einer der ältesten Oldtimerclubs in der Karibik. Es gibt ihn schon seit 1965.
    Sonne, Sand, Hitze und jede Menge Wind - das karibische Klima auf Curaçao ist eigentlich nicht geeignet für die empfindlichen, in die Jahre gekommenen Autoklassiker. Doch ausgerechnet auf der Insel, die viele nur vom 'Blue Curacao'-Likör kennen, spielen Autos eine ganz große Rolle. Kein Wunder, dass es auf Curacao den wahrscheinlich ältesten Oldtimerclub der Karibik gibt - den Wabi-Club. Bei den Clubtreffen kommen alle Mitglieder zusammen und präsentieren ihre liebevoll restaurierten Wagen. Wir haben den Club und seine Mitglieder besucht.
     DE 2015
