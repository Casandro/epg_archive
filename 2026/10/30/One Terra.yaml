  title: Planet Weltweit - Thailand - Kinder im Ring
  subtitle: Planet Weltweit - Thailand - Kinder im Ring
  description: 'Ob Kniestöße, Schläge mit den Ellenbogen oder hohe Kicks mit dem Schienbein an die Rippen des Gegners - im Muay Thai- Kampfsport ist fast alles erlaubt. Selbst im Training werden die Techniken und Tritte in voller Stärke ausgeführt und ziehen oft Knochenbrüche, Knockouts und bleibende Verletzungsspuren nach sich. Muay Thai, der Nationalsport Thailands, ist eine der härtesten Kampfsportarten der Welt. Doch es ist noch mehr: Für viele Sportler ist es ein Weg aus der Armut, denn mit dem Kampfsport kann man Ruhm, Ehre und viel Geld verdienen. In einem einzigen Kampf verdienen selbst die jüngsten Kämpfer das Monatsgehalt eines Landarbeiters. Doch wer den Sprung zum Profi schaffen will, muss von Kindesbeinen an trainieren und stößt dabei täglich an seine physischen und psychischen Grenzen. Muay Thai, auf deutsch Thaiboxen, ist tief in der Geschichte Thailands verwurzelt - schon vor Jahrhunderten diente die waffenlose Kampfkunst dem Erhalt der Unabhängigkeit und gab dem Land seinen Namen: Thailand - "Land der freien Menschen". Die Brüder Chai (20) und Sak Iyarakom (16) stehen sich täglich im Ring gegenüber und trainieren Muay Thai. Ihr inniges Verhältnis zueinander müssen sie im Ring ausblenden, denn hier geht es nur darum, den Gegner schnell und hart zu attackieren. Jeder von ihnen hat mehr Kämpfe hinter sich als Lebensjahre. Sie trainieren acht Stunden am Tag, oft in der gleißenden Mittagshitze. Wochenlang ernähren sie sich von Salat und Wasser, um das optimale Kampfgewicht zu erreichen. Schon bald steht ihnen der nächste große Kampf bevor. Er wird im Siam Boxing Stadion in Bangkok stattfinden - wer es bis hierher geschafft hat, gehört zu den Stars der Szene. In Bangkok trainiert auch die 16-jährige Taew. Sie gilt als großes Talent, denn sie hat einen harten Tritt und ein Kämpferherz - zwei unverzichtbare Eigenschaften für den Kampfsport. DE 2007'
