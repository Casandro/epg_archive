  title: Planet Weltweit - Kenia - Das Dorf der Frauen
  subtitle: Planet Weltweit - Kenia - Das Dorf der Frauen
  description: 'Am Rande des Samburu-Nationalparks in Kenia liegt Umoja - auf den ersten Blick ein ganz normales Dorf in der afrikanischen Savanne: Einfache Lehmhütten auf trockener roter Erde, Kinder spielen, Ziegen meckern. Und doch ist hier alles anders: In Umoja leben ausschließlich Frauen! Seit 1990 finden sie hier Zuflucht vor Zwangsehe, Männergewalt oder Genitalverstümmelung. Gemeinsam haben sich die Frauen hier eine neue Existenz aufgebaut und übernehmen ganz selbstverständlich auch traditionell männliche Aufgaben wie Viehzucht oder Schlachten. Eine Provokation für die patriarchal geprägte Gesellschaft der Samburu! Naporas Geschichte ist beispielhaft für das Schicksal vieler Frauen im Umoja. Bei der Suche nach Feuerholz wurde sie von einem Fremden vergewaltigt. Als sie ihrem Ehemann davon erzählte, schlug und verjagte er sie. Verstoßen und gedemütigt fand sie schließlich in Umoja Zuflucht. Heute bietet ihr die Frauengemeinschaft Sicherheit, doch Naporas seelische wie körperliche Wunden heilen nur langsam. Umoja bedeutet "Einheit" auf Suaheli und das ist es auch, was die Frauen hier finden. Im Gemeinschaftshaus oder unter der großen Akazie im Zentrum des Dorfes kommen sie regelmäßig zusammen, um sich auszutauschen. Gemeinsam versuchen sie, das Schreckliche, was jede einzelne von ihnen erlebt hat, zu verarbeiten. "Wir wollen, miteinander Spaß haben, so vergessen wir den Ärger", sagt Rebecca Lolosoli, die Gründerin des Dorfes. "Keine Demütigung mehr für diese Frauen. Nur noch Respekt!" Niemals wieder sollen Frauen missachtet oder misshandelt werden - so ihre Forderung. Das Zusammenleben im Dorf verläuft nach selbst definierten Regeln: Sämtliche Güter werden geteilt. Außerdem besitzen die Frauen in Umoja Haus und Land, züchten Vieh und schlachten es auch selbst - alles Rechte und Aufgaben, die ihnen außerhalb der Grenzen ihres Dorfes verwehrt bleiben. DE 2007'
