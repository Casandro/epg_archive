  start: 2026-10-30T21:15:00Z
  stop: 2026-10-30T22:07:00Z
  title: Inseln der Zukunft - Island - Grünes Paradies am Scheideweg
  subtitle: Inseln der Zukunft - Island - Grünes Paradies am Scheideweg
  description: 'Nirgends auf der Welt ist man den vier Elementen Feuer, Wasser, Luft und Erde näher als auf Island. Es ist das Land der Geysire und Gletscher, der Wasserfälle und Vulkane. Jahrhundertelang haben die Isländer gegen diese Kräfte der Natur gekämpft, um zu überleben. Heute nutzen sie die Wärme des vulkanisch aktiven Erdreichs, die Kraft der reißenden Flüsse und das gestaute Wasser vieler Seen und haben damit Island zu einer der wohlhabendsten Nationen der Welt gemacht. Island hat die gesamte Strom- und Wärmeproduktion zu 100 Prozent auf Wasserkraft und Geothermie umgestellt. In geothermischen Kraftwerken wird heißer Dampf und heißes Wasser aus vulkanischen Erdschichten genutzt, um damit Strom zu erzeugen oder die Häuser zu heizen. Doch das geschah nicht der Umwelt oder des Klimas wegen, sondern weil es billiger ist und die Insel von Energieimporten unabhängig macht. Die billige Öko-Energie ermöglichte eine industrielle Revolution: Rund 70 Prozent des Stroms werden heute von Fabriken der Schwerindustrie verbraucht, vor allem zur stromintensiven Herstellung von Aluminium. Das brachte Arbeitsplätze und Wohlstand. Doch inzwischen stellt sich heraus, dass der Erfolg auch Schattenseiten hat. Denn für jede neue Aluminiumschmelze muss ein neues Wasserkraftwerk gebaut werden. Die Folge: Unter dem gestauten Gletscherwasser verschwindet ein Teil von Islands einmaliger Natur. Der Film erzählt die Geschichte der Isländer, die von der Natur mit erneuerbaren Energien überreich beschenkt sind und beweisen, dass ein ganzes Land damit versorgt werden kann - und zwar so günstig, dass es zum Problem werden kann. Die Dokumentation begleitet Ingenieure und Naturschützer, besucht Gewächshäuser und Thermalquellen und zeigt Menschen, die mit Einfallsreichtum und Geschäftssinn Natur und Energieindustrie in Einklang bringen wollen. Eine Insel der Zukunft. DE 2015'
