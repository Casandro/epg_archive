  title: Asiens wilde Überlebenskünstler (3/3)
  subtitle: Auf fernen Inseln
  widescreen: true
  hd: true
  description: |-
    Auf zahlreichen asiatischen Inseln entwickelten sich einzigartige Tiere. Der Film stellt einige bemerkenswerte, wilde Insulaner vor - von riesigen Komodowaranen bis zu skurrilen Nasenaffen.
    Ob auf Sri Lanka, Indonesien oder Japan: Tiere besiedelten die Inseln auf unterschiedliche Weise. Oft wanderten sie über Landbrücken ein, die später im Meer versanken. Wer sich an die Isolation dieser Inseln anpassen konnte, fand hier einen perfekten Lebensraum.
