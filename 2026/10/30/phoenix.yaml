  title: 100 Kilo Kampfgewicht
  subtitle: Sumo-Kinder in Japan
  widescreen: true
  hd: true
  description: "Sie stampfen mit Wucht auf den Boden. Grimmig starren sie sich an. Im nächsten Moment stürzen die massigen Körper krachend aufeinander. Uralte Rituale und eiserne Disziplin gehören zum Sumo-Ringen dazu. Auch die Kleinen werden schon trainiert. \n\nUnd richtiggehend gemästet. Sumo ist nicht einfach nur ein Sport. Die besten Ringer werden in Japan immer noch gefeiert wie Helden. Obwohl es viele Japaner mittlerweile bei der Vorstellung schaudert, fast nackt in einen Ring zu steigen. Auch die Körpermaße und das Gewicht - größer könnte der Widerspruch zur modernen Welt in Japan kaum sein.\n\nSendehinweis: \n\n30.10.2026, 20:15 Uhr,\n\n31.10."
