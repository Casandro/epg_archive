  start: 2026-10-30T17:30:00Z
  stop: 2026-10-30T17:55:00Z
  title: Čtení na pokračování
  description: 'Strašidlácký příběh aneb Velká kniha děsů a běsů 9/10. Bojíte se tmy? Pavouků? Duchů? Jeník se bojí úplně všeho. Od té doby, co mu zemřel táta, ho strach provází na každém kroku. Jednoho dne se ocitne v tajemném rádiu, kde pracují a vysílají strašidla. Musí se postavit svým strachům, aby rádio zachránil před zánikem. Napsala: Lenka Králová. Dramaturgie: Vojtěch Bohuslav. Zvuk: Ondřej Franěk. Režie: Jakub Doubrava. Natočeno v roce 2026. Čte: Josef Jelínek. PREMIÉRA.'
