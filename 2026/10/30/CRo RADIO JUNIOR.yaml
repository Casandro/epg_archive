  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Dvanáctá sezóna Běhej lesy přinesla spoustu sportovních zážitků nejen dospělým běžcům, ale také těm nejmenším členům lesní smečky. Jak vypadaly jednotlivé zastávky? Kdo si vyběhal titul lesů paní, lesů pán? A jaké jsou novinky pro třináctou sezónu prozradíme v pátečním Klubu Rádia Junior. Moderuje Jirka Kohout.
