  title: Doppelkopf
  subtitle: '"Gute Kunst bietet die Möglichkeit zur Reflexion" - der Perkussionist Christoph Sietzen'
  description: Schon allein deshalb habe Kunst die Fähigkeit, politisch zu sein, findet Christoph Sietzen. Vielschichtig sei sie - und das kann man auch von seinem Instrumentarium behaupten. Trommeln, Pauken, Stabspiele wie Marimba-, Vibra- oder Xylophon - als Multi-Perkussionist bewegt er sich permanent in einem Kosmos aus Rhythmus und Melodie. Geerdet, aber mit Explosionskraft.
