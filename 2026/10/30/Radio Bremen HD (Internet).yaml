  start: 2026-10-30T11:25:00Z
  stop: 2026-10-30T12:10:00Z
  title: In aller Freundschaft (338)
  subtitle: Unter Verdacht
  description: 'In der Sachsenklinik nimmt Dr. Rolf Kaminski, ein von Sarah Marquardt engagierter Belegarzt, die Arbeit auf. Der Urologe sorgt für frischen Wind und Irritationen bei der Belegschaft: durch sein forsches Auftreten, seinen Sarkasmus und seinen manchmal recht eigenartigen Humor. Kaminskis erster Patient ist Gregor Machan. Der Bundeswehroffizier a. D. hat sich wegen eines Blasenkarzinoms zur Operation entschlossen, weil er nicht zum Pflegefall werden will. Seine Tochter Miriana ist damit nicht einverstanden. Doch Gregor beharrt auf seiner Entscheidung und spricht Kaminski das Vertrauen aus.'
- eventId: 705039
  start: 2026-10-30T12:10:00Z
  stop: 2026-10-30T13:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (280)
  subtitle: Verantwortung
  description: Eine junge Frau, die nicht weiß, wer sie ist, wird ins Johannes-Thal-Klinikum eingeliefert. Nach einem plötzlichen Krampfanfall ist sie eine Treppe heruntergestürzt und hat dabei ihr Zungenpiercing verschluckt. Mit einer Not-OP können die Ärzte sie gerade noch vor dem Ersticken retten. Doch ihre Blutwerte irritieren Dr. Ben Ahlbeck, Dr. Leyla Sherbaz und Prof. Karin Patzelt fortan.
