    Als Elke Schletz 1940 in Berlin geboren, wurde sie 1958 als "Miss Viareggio" entdeckt und eroberte als Elke Sommer erst Rom, dann Deutschland und schließlich Hollywood. Dort drehte sie mit Legenden wie Paul Newman, Peter Sellers und Dean Martin und galt als das deutsche Sexsymbol schlechthin. Sie lebte in Los Angeles und in Franken und widmete sie sich hier ihrer zweiten Leidenschaft, der Malerei.
