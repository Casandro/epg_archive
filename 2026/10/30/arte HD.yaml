  description: 'Marshal Teddy Daniels setzt mit seinem neuen Kollegen Chuck Aule von Boston aus nach Shutter Island über. Aus dem dortigen Ashecliffe Hospital für psychisch kranke Straftäter ist eine extrem gefährliche Mörderin verschwunden. Gegen die Widerstände des zwielichtigen Anstaltsleiters Dr. Cawley kommt der Polizist bald einem sorgsam gehüteten Geheimnis auf die Spur: Die Patienten sind offenbar Versuchskaninchen für grausame medizinische Experimente. Je näher Daniels der Wahrheit kommt, desto mehr wird er von Migräneanfällen und beunruhigenden Halluzinationen heimgesucht. Wird auch er manipuliert?'
