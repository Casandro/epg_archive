  description: Aus einer Vorladung bei der Polizei wird eine Mordanklage! Die Krankenschwester Hana wird verdächtigt, eine Patientin umgebracht zu haben, und findet sich plötzlich mit Handschellen in U-Haft wieder. Da sie sich keinen eigenen Anwalt leisten kann, wird ihr ein Pflichtverteidiger zugewiesen. Hart trifft die Situation auch Hanas Tochter Tereza, die statt wie geplant mit ihrem Freund Filip ins Ausland auszuwandern, sich nun mit sensationsgierigen Journalisten und sich türmenden Rechnungen auseinandersetzen muss. Dann ermitteln die Polizisten, dass es vor sechs Jahren schon einmal einen ungewöhnlichen Todesfall auf Hanas Station gab.
