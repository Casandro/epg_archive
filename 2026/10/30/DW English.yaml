  title: Searching for Clues
  subtitle: Donations for Islamist Terrorism?
  description: "Money from Germany repeatedly finds its way into structures that support Islamist terror. This occurs via bank transfers, donation associations, online payment services, and even cryptocurrencies. Many small amounts can add up to large sums. Such cash flows often go unnoticed because investigations in Germany - unlike in some other countries - often fail due to legal hurdles. \nThe documentary follows the money trail from Germany to Syria. It tells the story of a young German woman who returns home after a time spent with the Islamic State terror group. She provides insights into how money is collected, transferred, and used. The film reconstructs how money is collected via middlemen in Germany and Austria - including funding for Hamas.\nAt the same time, the team of authors explores why German authorities are so oblivious to this, and why investigators in other countries are apparently more successful when it comes to putting a stop to the flow of finances to extremists. \nAn investigative search with exclusive discoveries and impressive interviews, this film makes clear how close the issue of terrorist financing is to our everyday lives - and that even small donations can have deadly consequences."
  widescreen: true
