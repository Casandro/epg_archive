  title: 'Die Nordreportage: Hofgeschichten'
  subtitle: '"Die Neuen" von Gut Wulfsdorf'
  description: |-
    Auf Gut Wulfsdorf im schleswig-holsteinischen Ahrensburg leben "Die Neuen" in den "Hofgeschichten". Familie Lutz bearbeitet einen 360 Hektar großen Demeter-Gemischtbetrieb mit Milchkühen, Mastschweinen und Ackerbau. Noch ist der Senior, Georg Lutz, formal der Chef, aber bis Jahresende will er die Verantwortung mit seinen Kindern, Helene und Simon, teilen.
    Im Harzer Vorland fährt Steffen Thudt zu einem befreundeten Jungbauern. Johannes Bercht hat Steffen ein Angebot gemacht, das er nicht ausschlagen konnte. Es geht um eine Kuh namens Jolanthe.
    In Hamburg-Moorburg bei Isa und Jürgen Ecks startet der Bau der neuen modernen Rinderhalle.
