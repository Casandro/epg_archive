  title: Zora schmeckt's!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Für die Fernsehköchin geht es in der ersten Folge der neuen Sendereihe "Zora schmeckt''s" nach Lüneburg, gerade einmal 50 Kilometer von ihrer Wahlheimat Hamburg entfernt. Und doch ist es Zoras erster Besuch in der schönen Hansestadt. Ihre Tour beginnt sie direkt mit einer lokalen Spezialität: der Pralüne, einer Praline, die die Salzgeschichte der Stadt mit süßer Schokolade vereint. Begeistert von der hohen Dichte an Restaurants und Cafés, macht sie sich auf, die kulinarische Seele der Stadt zu entdecken.'
