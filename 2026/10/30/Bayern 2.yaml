    Babylon Berlin
    Haus Vaterland (3/5): Der Mann mit den Narben
    Ein toter Kriegsveteran, eine junge Patientin in einer Nervenheilanstalt und ein rätselhafter Brandanschlag verbinden sich zu einem neuen Fall. Während Gereon Rath nach dem Reichstagsbrand nach Berlin zurückkehrt, stoßen Kommissar Böhm und Charlotte Ritter auf eine Spur, die zu weiteren Verbrechen führen könnte.

    Von Volker Kutscher
    Mit Ole Lagerpusch, Alice Dwyer, Peter Nottmeier, Fabian Busch, Denis Moschitto, Benito Bause, Sebastian Urzendowsky, Anna-Maria Arkona, Anna Böttcher, Magdalena Monatasser, Roman Knizka und anderen
