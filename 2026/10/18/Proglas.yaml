  title: Knihovnička
  subtitle: 'Michaela Malá: Cestou necestou aneb Příběhy psychotických duší'
  description: 'Autor: Nikola Samcová; Interpret: Michaela Malá, Dana Mičolová, Nikola Samcová; Premiéra: 8.3.2025 * Přestože duševní nemoci pomalu přestávají být tabuizovány, stále přetrvává řada předsudků. A to jak o těchto onemocněních, tak o lidech, kteří s nimi mají zkušenost. A právě s nimi jsou sepsané rozhovory v knize Cestou necestou aneb Příběhy psychotických duší. Publikaci vydalo v únoru 2024 nakladatelství Triton a sepsal ji kolektiv autorů: Malá Michaela, Možný Petr, Bankovská Motlová Lucie a Mičolová Dana. V Knihovničce Proglasu hovoří s autorkou Malou a Mičolovou redaktorka Nikola Samcová, zvuk obstaral Roman Kabelka.'
