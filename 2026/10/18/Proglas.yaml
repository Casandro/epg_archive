- eventId: 682990
  start: 2026-10-18T15:55:00Z
  stop: 2026-10-18T16:00:00Z
  title: Myšlenka na den
  subtitle: Past vedle pasti. Člověk patří Bohu.
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 24.10.2023 * Past vedle pasti. Člověk patří BohuPAPEŽ FRANTIŠEK Drazí bratři a sestry, dobrý den!Evangelium nám říká, že někteří farizeové se připojili k herodiánům a nastražili na Ježíše past. Přicházejí za ním a ptají se: "Je dovoleno, nebo není dovoleno platit daň císaři?". Jde o léčku: pokud Ježíš daň legitimizuje, staví se na stranu politické moci, zatímco pokud řekne, že se platit nemá, může být obviněn ze vzpoury proti císařství. Z této pasti Ježíš uniká. Požádá je, aby mu ukázali minci, na níž je vyobrazen císař, a říká: "Odevzdejte tedy, co je císařovo, císaři, a co je Boží, Bohu". Co to znamecnosti nám Ježíš chce pomoci, abychom "císaře" a "Boha" postavili každého na jejich místo. Císaři - tedy politice, občanským institucím, společenským a ekonomickým procesům - náleží péče o pozemský řád; a my, kteří jsme ponořeni do této reality, musíme společnosti - vracet to, co nám nabízí, a to svým přispěním jako odpovědní občané, - starat se o to, co nám bylo svěřeno, - prosazovat právo a spravedlnost ve světě práce, - poctivě platit daněri", který je zrovna u moci. Patříme Hospodinu a nesmíme být otroky žádné pozemské moci. Na minci je tedy obraz císaře, ale Ježíš nám připomíná, že v našem životě je otisknut obraz Boží, který nic a nikdo nemůže zastřít.eláme modly, kterým se klaníme?Kéž nám Nejsvětější Panna pomůže rozpoznat a ctít důstojnost naši i každé lidské bytosti.Přeložila česká redakce vatikánských médií, krátil Martin Holík'
