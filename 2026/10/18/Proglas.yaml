  title: Z archivu hudebních pořadů
  subtitle: Stefano Saletti ? rozhovor o albu Mediterranima
  description: 'Autor: Milan Tesař; Interpret: Stefano Saletti; Premiéra: 16.1.2026 * V pořadu Jak se vám líbí nabízí Milan Tesař rozhovor s italským hudebníkem a skladatelem Stefanem Salettim. Ten na svém albu Mediterranima hledá ?duši Středomoří“ napříč kulturami, jazyky a tradicemi. Saletti hovoří o své práci s jazykem sabir, který po staletí sloužil jako komunikační prostředek ve Středomoří. Nastiňuje spolupráci s řadou výrazných zpěvaček  a mluví o hudbě jako prostoru dialogu, svobody a kulturního odporu. [saletym] [medyteranyma] '
  genre:
  - '96'
