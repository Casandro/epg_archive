- eventId: 1225630
  start: 2026-10-18T15:04:00Z
  stop: 2026-10-18T16:00:00Z
  title: 'Hörspielzeit: ARD Radio Tatort - Mit dem Rücken zur Wand'
  subtitle: von Madeleine Giese  (SR 2026)
  description: |-
    "Halten Sie mich nicht für verrückt, aber ich weiß, dass etwas Bösartiges passieren wird." Mit dieser unheilvollen Vorahnung steht die betagte Elisabeth Stein im Büro von Michel Paquet, noch Leiter der Mordkommission Saarlouis. Ihr Wohnblock wird gerade aufwendig modernisiert, doch durch den vielen Dreck und Lärm vergrault Vermieter Alexander Junghans die Bewohner. Wenige Tage später liegt er tot im Straßengraben. Kein Unfall - hat sich Elisabeth Steins Vorahnung doch bewahrheitet?
    Michel Paquet, Amelie Gentner und Tim Waller von der Mordkommission Saarlouis treffen bei ihren Ermittlungen auf Menschen, die gefühlt mit dem Rücken zur Wand stehen und einen Groll gegen den Vermieter gehegt haben: Neben Elisabeth Stein auch ihre Nachbarn, die Familie Sohl: Alleinverdiener Jan fürchtet den drohenden Stellenabbau in der saarländischen Autoindustrie, seine lothringische "Tradwife" Camille ist mit dem vierten Kind schwanger. Elias Junghans, Sohn des Toten und Freund der Sohls, profitiert ebenfalls von der veränderten Situation.
    Zum ersten Mal leitet Amelie Gentner den Fall, nicht ganz ohne Schadenfreude ihres Chefs Michel Paquets, weil er endlich den ungeliebten Papierkram abgeben kann. Kollege Waller poliert während der Ermittlungen sein Saarländisch mit Hilfe von Rostwurstbuden-Besitzerin Inge weiter auf und die weiß ganz genau: Angscht macht die Leit geggisch ("Angst lässt die Leute durchdrehen").
