  start: 2026-10-18T00:30:00Z
  stop: 2026-10-18T01:10:00Z
  title: Hercules
  subtitle: Die Lady und der Drache
  description: |-
    Die schöne Cynea (Catherine Bell) spielt ein tödliches Spiel. Für ihren Liebhaber, den Kriegsfürsten Adamis (Rene Naufahu), lockt sie reihenweise Männer in die Falle. Als Hercules und Iolaus dem spurlosen Verschwinden einiger Freunde nachgehen, führt sie die Fährte zum Dorf Laurentia. Dort soll der Drache Braxus für den Tod vieler Menschen verantwortlich sein. Iolaus ist wild entschlossen, die Bestie besser jetzt als gleich zur Strecke zu bringen! Aber Hercules mahnt zur Zurückhaltung: Seinem Scharfsinn ist nicht entgangen, dass der Drache möglicherweise selbst ein Opfer ist.
    USA 1997
  widescreen: true
- eventId: 807850
  start: 2026-10-18T01:10:00Z
  stop: 2026-10-18T01:50:00Z
  title: Hercules
  subtitle: Lang lebe der König
  description: |-
    Iolaus erhält Nachricht von seinem Cousin, König Orestes. Der gutherzige Regent will ein Friedensabkommen mit mehreren benachbarten Königreichen schließen, wobei er Iolaus' Unterstützung benötigt. Es steht jedoch die Befürchtung im Raum, dass dunkle Mächte einen Mordanschlag auf Orestes planen. Im Zuge eines Jagdausflugs findet das Attentat wenig später tatsächlich statt: Orestes wird von einem Pfeil getroffen und stirbt in den Armen seines Cousins! Iolaus schlüpft kurzerhand in die Rolle des Königs, damit der Friedensschluss trotz der mörderischen Intrige stattfinden kann.
    USA 1997
  widescreen: true
