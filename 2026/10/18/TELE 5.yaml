  title: Doctor Who
  subtitle: Hör zu
  description: |-
    Nach einem gescheiterten Date mit Danny ist Clara frustriert. Aber für Ablenkung ist schnell gesorgt, als der Doktor ihre Unterstützung bei einem grausigen Rätsel benötigt. Der Timelord ist nämlich einer uralten Angst auf der Spur. Gemeint ist eine geheimnisvolle Kreatur, die offenbar seit Jahrhunderten unter Kinderbetten lauert! Von einer rätselhaften Begegnung mit dem Zeitreise-Pionier Colonel Orson Pink, der Danny zum Verwechseln ähnlich sieht, über einen Abstecher ans Ende des Universums bis hin zu einem verängstigen Jungen, der sich als kleiner Doktor herauskristallisiert: Auf Clara wartet diesmal eine besonders spannende Exkursion mit der TARDIS.
    GBR 2014
