  description: Dwaj młodzi przyjaciele Jason i Kyle odkrywają tajemniczy samolot na lokalnym lotnisku w małym miasteczku. Chłopcy zakradają się na pokład aby obejrzeć wnętrze. Gdy pojawia się dwóch dziwnych mężczyzn, chowają się w luku, a samolot startuje. Po kilku godzinach w powietrzu chłopcy nieświadomie odkrywają bombę. Kiedy wpadają do kabiny, aby zgłosić swoje odkrycie, okazuje się, że wszyscy na pokładzie wyskoczyli. Chłopcy muszą przejąć stery i sami wylądować samolotem. Ale ich kłopoty dopiero się zaczynają, gdy Jason i Kyle zdają sobie sprawę, że udaremnili napad.
