  title: Die Abenteuer von Maid Marian
  description: |-
    Britannien, im 12. Jahrhundert: Als der König bei den Kreuzzügen den Heldentod stirbt, kehrt auch Robin Hood (Dominic Andersen) wieder in seine Heimat zurück. Dort hat Lady Marian (Sophie Craig) drei Jahre unter falschem Namen in einem Kloster gelebt und die Rückkehr ihres geliebten Mannes bereits sehnsüchtig erwartet. Aber das Wiedersehen wird von brutalen Scharmützeln und gefährlichen Hinterhalten überschattet! Denn auch der rachsüchtige Sheriff von Nottingham (Bob Cryer) ist wieder da, um die holde Maid und ihren Begleiter zu töten. - Bei dem britischen Abenteuerfilm führte Bill Thomas Regie, der u.a. bei "Guardians of the Galaxy" und "Lost in Space" mitgewirkt hat.
