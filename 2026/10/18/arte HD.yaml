  audiodesc: true
  description: 'In Asgard wird Baldr, der Sohn Odins und Gott der Schönheit und Gerechtigkeit, von Alpträumen heimgesucht, die seinen Tod voraussagen. Skadi, Tochter des getöteten Riesen Thiazi, betritt Asgard, um Rache zu fordern. Odin bietet ihr Wiedergutmachung an und sie stellt drei Forderungen: die Wahl eines göttlichen Gatten, das Geschenk der Heiterkeit und die ewige Erinnerung an ihren Vater. Eine Völva prophezeit Odin den nahenden Tod seines Sohnes Baldr. Frigg reist durch die neun Welten, um alle Geschöpfe zu bitten, ihrem Sohn nicht zu schaden. Zur Sicherheit muss auch der Wolf Fenrir gebändigt werden.'
