  title: Wildkatzen und Wildhunde
  subtitle: 'Afrikas Wildkatzen: Anmutig, aber bedroht'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Löwen, Geparden, Karakale und Servale: vier charakteristische Raubkatzen Afrikas, vier bedrohte Tierarten. Angesichts bedrohlich schwindender Populationen und der Zerstörung ihrer Lebensräume organisiert sich zunehmend weltweiter Widerstand. Eine Fülle von Tierschutzinitiativen ermöglicht es heute, die Artenvielfalt dank raffinierter Methoden und in zuweilen unerwarteten Umgebungen zu bewahren.'
- eventId:
  - 1072086
  - 573473
  start: 2026-10-18T04:40:00Z
  stop: 2026-10-18T05:35:00Z
  title: Wildkatzen und Wildhunde
  subtitle: 'Europas Wildkatzen: Rückkehr auf leisen Pfoten'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wildkatzen in Europa: Ein Exemplar ihrer Gattung zu sichten war im vergangenen Jahrhundert eine wahrliche Seltenheit. Doch dank origineller Erhaltungsmaßnahmen sieht man wieder mitten in Europa Wildkatzen, die zuvor vom Aussterben bedroht waren. Aber nicht nur der Pardelluchs und die Waldkatze profitieren davon: Bei Vulkanausbrüchen werden auch Hauskatzen geschützt!'
