  title: Die Inquisition (1/2)
  subtitle: Die Methode
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im 13. Jahrhundert schuf die katholische Kirche die Inquisition: eine mächtige Maschinerie, um Andersdenkende zu unterdrücken. Denunziationen, Verhaftungen und Hinrichtungen waren Teil eines perfiden Systems. Dieser Apparat professionalisierte sich durch Ermittlungen, Zeugenbefragungen und erzwungene Geständnisse. Ein Überwachungssystem, dessen Methoden bis heute nachwirken.'
- eventId:
