  title: Alt wird Neu - Neues Leben für historische Gebäude
  subtitle: Sakralbauten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    Gebäude sparen Energie: jedoch nicht nur bei energetisch effizienten Neubauten. Deutlich umweltfreundlicher ist es, bestehende Gebäude zu sanieren. Gebäude erzählen Geschichten: Nachhaltiges Bauen bedeutet jedoch viel mehr als nur Energiesparen. Der historische Gebäudebestand ist Stein gewordene Geschichte. G
    ebäude müssen sich verändern: Eine Stadt ist ein lebendiger Organismus, der sich ständig verändert - wie die Gesellschaft auch. Bauen im Bestand bedeutet daher nicht nur Sanierung. Es ist vor allem das kreative Weiterbauen, das seine Qualität ausmacht - wie die Beispiele aus dieser Reihe zeigen.
