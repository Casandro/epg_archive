  description: "Die \x86Kirmesmusikanten\x86 war DAS holländische Star-Ehepaar, das die Geschichte von Leidenschaft, Tradition und Verbundenheit mit seiner Heimatregion geprägt war. Ursprünglich als Amateurband in einem ländlichen Dorf gegründet, wurden sie im Laufe der Jahre weit seine Heimat hinaus bekannt. In den 1970er-Jahren begannen die Kirmesmusikanten, ihre Liebe zur traditionellen Volksmusik zu teilen und gemeinsam zu musizieren."
