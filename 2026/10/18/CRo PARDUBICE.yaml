- eventId: 850626
  start: 2026-10-18T16:04:00Z
  stop: 2026-10-18T17:00:00Z
  title: Na nedělní vlně z Pardubic
  description: 'Pardubičtí architekti a stavitelé: Ferdinand Potůček starší a mladší Otec a syn Potůčkovi zanechali v Pardubicích množství staveb, i když některé z nich nejen jako architekti, ale jako stavitelé. Patří k nim například budovy nemocnice, Sokola a část letního fotbalového stadionu. Navrhli a vystavěli pak například také množství vil Na Olšinkách nebo Husův sbor. Připravila reportérka Šárka Rusnáková.'
