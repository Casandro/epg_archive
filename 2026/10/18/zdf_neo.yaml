  title: Terra X
  subtitle: 'Faszination Erde - mit Dirk Steffens - Extreme Welten: Das unsichtbare Netzwerk'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Die Lebensräume auf der Erde könnten unterschiedlicher kaum sein. Auf den ersten Blick scheinen sie wie verschiedene Welten. Doch es gibt Verbindungen: Keine existiert ohne die anderen.

    Dirk Steffens zeigt überraschende Abhängigkeiten zwischen extremen Welten und entdeckt, dass ein unscheinbarer Organismus auf seiner Reise um den Globus Einfluss auf das Schicksal des ganzen Planeten nimmt. Ohne ihn sähe unsere Welt völlig anders aus.
