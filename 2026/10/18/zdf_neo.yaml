    USA 2008
    Hancock hat übermenschliche Kräfte. In Los Angeles rettet er Leben und richtet zugleich massive Schäden an. Die Bevölkerung verliert die Geduld mit dem rücksichtlosen Helfer.

    Erst der PR-Berater Ray Embrey bringt Hancock dazu, sein Verhalten zu hinterfragen. Doch kann ein Mann, der sich jeder Verantwortung entzieht, sein Image ändern? Und welche Rolle spielt Rays Frau Mary, die mehr über Hancock zu wissen scheint, als sie zeigt?
