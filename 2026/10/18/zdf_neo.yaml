  title: Terra Xplore
  subtitle: Gen Z unter Druck - Das Sozialexperiment -
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Junge Menschen stehen unter massivem Druck - durch Krisen, Erwartungen und Selbstoptimierung. Das Sozialexperiment zeigt ihre Realität: Warum sind sie heute die unglücklichste Generation?

    Neue Studien zeigen: Junge Menschen sind heute die unglücklichste Altersgruppe in Deutschland. Der Film begleitet Psychologe Dr. Leon Windscheid bei Gesprächen mit Betroffenen, die offen über den Druck sprechen, unter dem sie stehen - und wie sie damit umgehen.
    Moderation: Leon Windscheid

