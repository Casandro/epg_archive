  audiodesc: true
  description: |-
    Der Steinzeit-Check

    Heute reist Tobi mehr als 5.000 Jahren in die Vergangenheit, mitten hinein in die Steinzeit. Wie das Leben ohne Autos, große Städte und Strom aussah, checkt Tobi mit Forscher Wulf im Steinzeitdorf Bad Buchau. Aber nicht in T-Shirt und Hemd, sondern in coolen Steinzeitklamotten. Dazu hat Tobi gleich seine erste Checkerfrage: Trugen Steinzeitmenschen Unterhosen?

    Weil es noch kein Metall gab, war Stein das wichtigste Material für Werkzeuge. Daher auch der Name Steinzeit. Mit Pfeil und Bogen und großen Speerschleudern versuchten die Steinzeitmenschen, Mammute zu erlegen. Die Mammute waren so eine Art Riesenvorläufer der Elefanten, sind aber heute ausgestorben. Warum sie von der Erde verschwanden, checkt Tobi in seiner Checker-Bude.

    Das wichtigste für die Steinzeitmenschen war das Feuer: Das brauchten sie zum Kochen, um sich zu wärmen und um wilde Tiere zu vertreiben. Aber wie haben die Steinzeitmenschen überhaupt Feuer gemacht, so ganz ohne Feuerzeug? ...
