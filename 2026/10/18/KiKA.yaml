  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Animationsserie, Frankreich / Deutschland / Italien 2018
    Wesleys Comeback

    Emilia hat für sich und ihre Freunde VIP-Tickets inklusive Backstagezugang für ein Konzert der Hiphop-Größe MC Qualle organisiert. Doch zur selben Zeit spielt auch Max' Vater seine Comeback-Show, und bringt Max so in ein Dilemma. Bei Maestro Barenboim stehen unterdes gerade zwei Flügel im Saal, denn er möchte sich einen neuen zulegen, kann sich allerdings nicht entscheiden. Max plädiert unbedingt für den imposanteren, auf dem alle Pianisten spielen, die man so im Fernsehen sieht. Als der Maestro ihn vor die Wahl Beethoven oder Edward Elgar stellt, entscheidet sich Max für Beethoven, denn ein Musiker, von dem man noch nichts gehört hat, kann nichts taugen. Oder etwa doch?
    Darsteller:
