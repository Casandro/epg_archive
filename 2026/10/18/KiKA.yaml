    Wesley - Samy Deluxe
    Regie: Christophe Pinto
    Buch/Autor: Anna Fregonese, Héloise Capoccia
    Musik: Daniel Barenboim, Johann Sebastian Bach, Joseph Haydn, Frédéric Chopin, Franz Liszt
