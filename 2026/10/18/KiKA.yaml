  description: |-
    Die Ritter von Greenville

    Blinky und Jacko spielen Ritter. Während Blinky in der Rolle als edler Beschützer völlig aufgeht, verfällt Jacko ständig in die Rolle eines raubeinigen Cowboys, da er mit der Ritterwelt nicht vertraut ist. In Blinkys Fantasie werden aus zwei Vögeln im Wald wilde Bestien. Zu seiner großen Überraschung greifen die Vögel ihn und Jacko wirklich an. In panischer Angst fliehen sie zurück nach Greenville. Dort stürzen sich die Vögel plötzlich auf Katie, die ausgerechnet in Crankys Haus Schutz sucht. Blinky befürchtet, dass Cranky diese Gelegenheit nutzen wird und Katie gefangen hält. Er beschließt, Katie gemeinsam mit Spike und Jacko aus Crankys Klauen zu befreien. Beim Versuch, die Lage zu checken, wird Spike in Crankys Haus gezogen und taucht ebenfalls nicht wieder auf. ...
