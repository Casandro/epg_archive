  title: Das U-Boot (1/2)
  subtitle: Mythos unter Wasser
  subtitled: true
  description: 'Sie operieren aus dem Verborgenen und lauern in den Tiefen der Ozeane: U-Boote. Innerhalb der letzten 100 Jahre entwickelte sich das U-Boot von einem einfachen Tauchboot zu einer multifunktionalen Hochleistungsmaschine mit atomarer Sprengkraft. Der erste Teil der Dokumentation beschreibt die Anfänge der U-Boot-Entwicklung Ende des 19. Jahrhunderts bis zum Ausbruch des Zweiten Weltkriegs.'
