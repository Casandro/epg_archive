  stop: 2026-10-18T07:30:00Z
  title: Lebenswelten
  description: "Dating mit Gottes Segen\nReligiöse Singles auf Partnersuche\nEine Sendung von Sebastian Schade\n\nReligiöse Singles stehen bei der Partnersuche vor besonderen Herausforderungen. Denn für viele geht es nicht nur darum, ob die Chemie stimmt. Eine wichtige Rolle spielen auch gemeinsame Werte, die religiöse Praxis und gleiche Vorstellungen von Familie und Ehe. \nFrüher lief für Gläubige viel über die eigene Gemeinde oder persönliche Kontakte. Heute gibt es spezielle Dating-Apps, die dabei helfen, Menschen zu finden, die die religiöse Einstellung teilen, aber auch Online-Partnerbörsen und Speed-Dating-Veranstaltungen für jüdische, christliche und muslimische Singles.\nMenschen aus den drei großen monotheistischen Religionen erzählen, wie ihr Glaube die Partnersuche prägt. Welche Chancen, aber auch Probleme, bringen Angebote wie religiöse Dating-Apps mit sich? Welcher Wandel zeigt sich in den religiösen Gemeinschaften?"
