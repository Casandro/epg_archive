  description: 'Zu Fuß lässt sich die südliche Eifel am besten erobern: Daniel Aßmann wandert durch herbstlich leuchtende Wälder, vorbei an Streuobstwiesen und in der engen Teufelsschlucht nah der luxemburgischen Grenze sogar über den Grund eines Millionen Jahre alten Meeres. Ein Rundwanderweg führt zum Fuß des 40 Meter hohen Basaltlava-Steinbruchs Ettringer Lay bei Mayen-Koblenz. In Gerolstein trinkt Daniel Aßmann an einer berühmten Mineralwasserquelle, bevor er sich auf dem Felsenpfad in die dortigen "Dolomiten" begibt. In Prüm und Adenau wird''s historisch. Danach warten entlang der Wanderwege kleine und große Abenteuer ...'
