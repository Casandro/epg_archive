  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Gleich drei Seen sehen - die dritte Folge der neuen WDR_Reihe führt Sabine Heinrich an drei Ruhr-Seen entlang - Hengsteysee, Harkortsee und Kemnader See. Am Kemnader See trifft Sabine dann auf eine ungewöhnliche Sportart: Yoga auf dem Stand-Up-Paddle-Board. Sie schippert über den Baldeneysee und lernt am Rhein-Herne-Kanal eine junge Wasserbauerin kennen. Außerdem ist sie das Team eines Bunkerschiffs am größten Kanalknotenpunkt der Welt - dem Dattelner Meer - unterwegs und kann schließlich auf dem Dortmund-Ems-Kanal das Team des legendären Deutschland-Achters beim Training begleiten.'
