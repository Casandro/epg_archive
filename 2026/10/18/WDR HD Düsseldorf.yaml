  description: NS-Zeit, Krieg und seine Gefährdung als Homosexueller machten Hans Werner Henze, geboren 1926 in Gütersloh, zum politischsten Komponisten Deutschlands. Mit weltmännischem Auftreten sprengte er alle Vorstellungen von einem Komponisten der "E-Musik". Die Dokumentation zeigt bisher unbekanntes Archivmaterial und bringt so auch Henzes persönliche Seite zur Geltung.
