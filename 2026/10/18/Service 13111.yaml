  title: Bergwelten
  subtitle: Buchenstein - Das verborgene Tal in den Dolomiten
  description: 'Die Kletter-Community im Buchenstein-Tal ist jung und hat sich erst in den vergangenen Jahren entwickelt. Andrea Dorigo ist einer aus dieser kleinen Gruppe, er hat sich ganz dem Alpinismus verschrieben. Oberhalb der Ortschaft Arabba am Campolongopass ist Andrea Dorigo dabei, eine neue Kletterroute auszubauen. Die Wand eignet sich im Winter gut zum Eisklettern - und so hält sich die Überraschung in Grenzen als er beim Einbohren der Hake auf einen verrosteten Eispickel stößt. Der Pickel muss aufgrund seines Zustandes schon gut dreißig Jahre dort gelegen haben. Doch Andrea hat eine Vermutung, wem der Pickel einst gehört haben könnte. Die Ortschaft Pieve di Livinallongo ist der Verwaltungssitz von Buchenstein und fällt durch die hohen Gebäude auf. Der Grund dafür ist die Steilheit des Hanges: die Gebäude konnten nur in die Vertikale wachsen. Aus Pieve stammt der Paralympionik Luca Palla. Im Alter von 19 Jahren hatte er einen schweren Unfall, bei welchem er sein linkes Bein verlor. Seine Sportbegeisterung, so sagt er, hat ihm nach einem schweren Unfall, bei dem er sein linkes Bein verlor, die Kraft gegeben, wieder aufzustehen. Seine paralympischen Disziplinen: Ski-Alpin und der Radsport. Die Kraft dafür holt er sich auch beim Trail-Running am Col di Lana. Auf einem Berg, der im Ersten Weltkrieg von den Österreichern wie den Italiener belagert wurde und der aufgrund der vielen Granaten-Treffern und massiven Sprengungen sein Aussehen massiv veränderte. Mirko Crepaz wandert regelmäßig auf dem Col di Lana - und zwar mit einem Metalldetektor. So ist er bestens ausgerüstet, um Gegenstände aus den Kriegsjahren zu finden. Am meisten interessieren ihn persönliche Gegenstände der Soldaten. Nicht alles wird vom Metalldetektor erfasst, und vieles bedarf eines Zufalls, um es zu finden.Österreich 2026, R: Lukas Pitscheider'
  widescreen: true
