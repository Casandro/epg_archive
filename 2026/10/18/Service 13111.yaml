  title: Servus Kinder
  subtitle: Mit dem Bauerngarten durch den Winter
  description: 'Sabine Reiter hat einen großen Traum. Und zwar sich rund um selbst zu versorgen. Diesem Traum ist die 42-jährige schon sehr nahe. Mit Obst und Gemüse kann sie ihre Familie das ganze Jahr über bereits zu 95 Prozent versorgen. Von ihren Schafen verarbeitet die Vegetarierin Wolle und ihre Ziegen liefern wertvollen Mist als Dünger. Mit eigenem Wasser, Holz, Photovoltaikanlage und Energiespeicher sind sie und ihr Mann Harald auf dem Weg zur Energieautarkie. Sich selbst zu versorgen sieht Sabine Reiter als die einzige Möglichkeit wirklich gesund zu essen. Ihr Wissen gibt die 42-jährige gerne weiter. Wie auch in dieser Folge, in der die "Zeitlos Kinder" Ernten, Einkochen, Schafe füttern und ganz viel Spannendes erleben.Österreich 2023, R: Elisabeth Kotschy'
