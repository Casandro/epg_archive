  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Der Turmbau zu Babel
  description: "Der Turmbau zu Babel aus dem berühmten Buch Genesis ist eine der bekanntesten Geschichten der Bibel. Könnte dieses darin beschriebene, schwindelerregende Bauwerk, welches den Zorn Gottes auf sich gezogen hat und Symbol für das berüchtigte babylonische Sprachengewirr war, wirklich existiert haben? Gab es diesen sagenumwobenen Wolkenkratzer tatsächlich, lange bevor dieses phantastische Kuriosum geschrieben wurde? Seit Jahren arbeitet ein Team von Archäologen im heutigen Irak an Ausgrabungen und versucht in den Resten der legendären, verfallenen Stadt Babylon diesem Rätsel der Geschichte auf den Grund zu gehen. Auf einer spektakulären Spurensuche in den überfluteten Fundamenten eines 2500 Jahre alten Bauwerks, welches König Nebukadnezar II als Denkmal seiner glorreichen Herrschaft erbauen ließ, werden mit Hilfe neuester Technologie Inschriften entschlüsselt, die unglaubliche Details zu dem größten verschwundenen Gebäude der Antike verraten - dem Turm zu Babel. \nDokumentarfilm, Vereinigtes Königreich 2017, R: Elliott Kew"
