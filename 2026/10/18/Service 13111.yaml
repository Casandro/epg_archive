  title: Fleischeslust - Die Kunst der Feuerköche
  description: |-
    Fleisch ist heute so umstritten wie kaum ein anderes Lebensmittel. Massentierhaltung, Billigpreise und industrieller Konsum haben seinen Ruf beschädigt. Doch es gibt Menschen, die zeigen, dass Fleisch auch anders geht - mit Respekt vor dem Tier, handwerklichem Können und echter Leidenschaft.
    Bio-Fleisch von Tieren, die artgerecht leben und sich von Gräsern und Kräutern ernähren, oder Wild aus heimischen Wäldern: Wer regional, naturbelassen und nachhaltig genießen möchte, findet hier die vielleicht ursprünglichste Form des Fleischgenusses. Grillprofi Tom Heinzle und Edelmetzger Johannes "Jogi" Bischof verbindet eine gemeinsame Überzeugung: Weniger Fleisch essen - dafür besseres. Sie arbeiten mit hochwertigen Zutaten, kennen deren Herkunft und begleiten den Weg vom Tier bis auf den Teller mit größtem Respekt. Tom Heinzle veränderte ein Besuch in einem Tiermastbetrieb nachhaltig - der Schock war so groß, dass er jahrelang selbst kein Fleisch mehr aß. Heute vermittelt der Grillmeister, wie bewusster Fleischgenuss gelingen kann. Johannes "Jogi" Bischof, Delikatessenmetzger aus dem Bregenzerwald, gibt seinen Kunden nur einen Rat: "Esst weniger Fleisch - aber hochwertiges." Sie leben die Nose-to-Tail-Philosophie nicht als Modeerscheinung, sondern aus Überzeugung. Über offenem Feuer, in der Glut oder im Smoker entstehen aus edlen Cuts ebenso wie aus oft vergessenen Stücken wahre Delikatessen. Rib Eye, Flat Iron oder Kronfleisch - entscheidend ist nicht der Trend, sondern das Verständnis für das Produkt. Diese Experten können ein Stück Fleisch lesen: Farbe, Marmorierung und Struktur erzählen seine Geschichte. Sie erklären, worauf es beim Einkauf ankommt, wie der perfekte Garpunkt gelingt und warum auch Innereien oder weniger bekannte Teilstücke auf den Grill gehören. Österreich 2026, R: Claus U. Eckert
  genre:
  - '116'
  widescreen: true
