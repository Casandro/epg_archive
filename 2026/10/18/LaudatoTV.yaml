  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj epizodi majka Angelice govori o dvije stvari: radost, trpljenje i siromaštvo.
    "Trpljenje nije omiljena tema a kao ljudi ne razumijemo što znači biti radostan u patnji. Poanta radosti je u tome što Bog zna da trpimo, ali to ne pokazujete drugima. Bog nam nije ovdje obećao raj. Obećao nam je raj u nama samima."
    Nadalje majka Angelica govori o siromaštvu duha. Prvo blaženstvo govori upravo o tome: siromaštvo duha. "Tek kad znam da ne mogu ništa učiniti, Bog može sve učiniti kroz mene. Samo kad sam svjestan svoje slabosti, Njegova je moć u svom najboljem izdanju. Kada priznamo da bez Boga ne možemo ništa, tada nas Božja moć doslovno obuzme. I tako imate kombinaciju svoje ništavnosti i Njegove svemoći", kaže majka Angelica.
