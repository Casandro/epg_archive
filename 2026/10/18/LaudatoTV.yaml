  description: Kako čovjek želi nadmudriti Boga i kojim se metodama pritom služi? Poznat Isusov odgovor ,,Podajte caru carevo, a Bogu Božje tema je našeg ,,Odaziva 18. listopada. Što je carevo, a što Božje u našem zemaljskom životu? Govori li ovo evanđelje o odvojenosti Crkve i države? Kako je s ovim povezana i naša građanska odgovornost, ali i život u vjeri - zakon države i zakon savjesti? Evanđelje nas uči i kako prepoznati zamke koje počinju laskanjem. Riječ Božju 29. nedjelje kroz godinu, ujedno i Misijske nedjelje, tumači vlč. Odilon Singbo.
