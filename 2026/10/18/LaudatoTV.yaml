  title: Novi život
  subtitle: Magazin
  description: Poznajemo je kroz brojne kazališne, filmske i televizijske uloge. No što ostaje kada se ugase reflektori i kada više ne treba igrati nijednu ulogu? U novoj epizodi ,,Novog života Nika Antolos ugostit će Matiju Prskalo. Kako vjera utječe na posao u kojem morate razumjeti i likove čiji su postupci potpuno suprotni vašim vrijednostima? Postoji li uloga koju vjernica ne bi trebala prihvatiti? I boli li, nakon svih godina iskustva, loša kritika još uvijek jednako? Uz Matiju je i vlč. Ivica Tolla, duhovni pratitelj Laudato televizije, urednik i voditelj emisije ,,Totus Tuus te voditelj duhovnih obnova. Matija ga poznaje upravo s jedne takve duhovne obnove. Zato razgovor neće ostati samo na pozornici i glumačkom poslu. Je li Matija danas u miru sa sobom? Koliko joj je još važno što drugi misle? Je li lakše oprostiti drugome - ili sebi? I što radi kada moli, a odgovor ne dolazi? Možemo li Bogu reći da Ga ne razumijemo - i svejedno Mu vjerovati? Matija Prskalo u ,,Novom životu govori o glumi, vjeri, sumnjama i miru koji ne dolazi uvijek s gotovim odgovorima.
