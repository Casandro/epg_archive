  title: Borba se nastavlja, priča o don Danku Litriću
  subtitle: Dokumentarni
  description: |-
    Borba se nastavlja, priča o don Danku Litriću
    Ususret Misijskoj nedjelji pogledajte film Jakova Sedlara snimljen u Ruandi i Hrvatskoj koji govori o životu i djelovanju najstarijeg hrvatskog misionara u svijetu, don Danka Litrića koji u Ruandi djeluje od 1981. godine. Priča prati njegov ukupan život: od djetinjstva u Žeževici kraj Omiša, preko školovanja, djelovanja u Lijepoj našoj te na kraju o radu u Ruandi gdje postaje legendarnom osobom. Mnogi u toj zemlji smatraju ga živim svecem, jer se radi o osobi koja je ostavila neizbrisiv trag u toj siromašnoj afričkoj zemlji.
