    Familienmitglieder), die innerhalb von zwei Stunden s...
  description: |-
    Wenn Barry was zu verschenken hat, sollte man besser nicht lange fackeln. Ob Urlaub oder Einkaufsgutschein, wer von ihm angesprochen wird, hat schon fast gewonnen.
    Was ihr dafür tun müsst? Eigentlich nicht viel: ein kleines bisschen Mut zusammenkratzt, sich halbwegs organisieren und im besten Fall schon mal den Reisepass vom Staub befreien.
