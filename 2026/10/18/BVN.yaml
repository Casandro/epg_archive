  description: 'Op 10 oktober vindt de finale van het Internationaal Vocalisten Concours plaats in ''s-Hertogenbosch. De kersverse winnaar is te gast in Podium Klassiek. Huispianist Cor Bakker neemt twee bevriende musici mee: bariton Thomas Oliemans en jazzpianist Bert van den Brink. De Oekraïense dirigent Olha Dondyk is pas 22 jaar en is nu al de vaste gastdirigent van symfonieorkest Phion. Aan de Hoge Tafel staat componist Anne-Maartje Lemereis. (2026)'
