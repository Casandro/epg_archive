  title: Expeditie Nederland
  subtitle: Sporen uit het slavernijverleden S05 E26. Onderwerpen die iedereen raken kunnen, hoe klein ons land ook is, een paar kilometer verderop een ander verhaal opleveren. Ze worden belicht door verslaggevers uit de regio's.
  description: Het slavernijverleden van Nederland is niet voor iedereen zichtbaar, maar het is wel degelijk overal nog aanwezig. In Rotterdam zet Peggy Wijntuin zich al jaren in om ons slavernijverleden onder de aandacht te brengen en te houden. Zo zorgde ze ook voor de komst van een slavernijmonument in haar stad. Op Curaçao leeft het slavernijverleden ook voort in cultuur en tradities. Zoals in tambú; een muziek- en dansvorm die is ontstaan onder tot slaaf gemaakten. (2026)
