  title: Metropolis
  subtitle: Papadag S14 E18. Vaders zijn allang niet meer alleen de kostwinners die op zondag het vlees aansnijden. In Servië, Zweden, Argentinië en Burkina Faso zien we hoe het vaderschap verandert.
  description: De traditionele vader die op zondag thuiskomt om het vlees aan te snijden maakt steeds vaker plaats voor een vader die zorgt, opvoedt en luiers verschoont. In Servië leren vaders tijdens een vader-kindkamp meer tijd met hun kinderen door te brengen. In Zweden nemen vaders als Matias volop ouderschapsverlof op. In Argentinië voedt Frankie zijn kinderen op in zijn boksschool, met discipline en een vaderlijke hand en in Burkina Faso runt Amadou als alleenstaande vader het hele huishouden. (2026)
