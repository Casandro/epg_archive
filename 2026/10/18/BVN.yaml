  subtitle: Scheepvaartmuseum S17 E14. In het Scheepvaartmuseum is expert Laurens Hesselink enthousiast over het schetsboek van een Britse marineofficier, die rond 1860 op een schip zat dat een verkenningstocht naar Amerika ondernam.
  description: In het Scheepvaartmuseum is expert Laurens Hesselink enthousiast over het schetsboek van een Britse marineofficier, die rond 1860 op een schip zat dat een verkenningstocht naar Amerika ondernam. Het boek staat vol met unieke schetsen van indianen en geografische kaarten. Verder in het museum onder andere handelskralen die in de 18e eeuw door Europeanen werden meegenomen naar Afrika als betaalmiddel en een eikenhouten Christusbeeld dat na de Tweede Wereldoorlog is gered uit het puin van een gebombardeerde kerk in Polen. Ook blijkt een glas met de afbeelding van een schip, gevonden op de rommelmarkt voor 25 euro, fors meer waard. (2026)
