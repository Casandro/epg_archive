  title: Pointer Checkt
  subtitle: Wanneer word je ziek van PFAS? S14 E06. Uit recent RIVM-onderzoek blijkt dat we allemaal PFAS in ons bloed hebben, van pasgeboren baby's tot volwassenen. Wat doen deze chemicaliën met je gezondheid en kun je er zelf iets tegen doen?
  description: Uit recent RIVM-onderzoek blijkt dat we allemaal PFAS in ons bloed hebben, van pasgeboren baby's tot volwassenen. PFAS staat voor poly- en perfluoralkylstoffen. Dit zijn chemische stoffen die niet op natuurlijke wijze in de natuur voorkomen en vaak vetafstotend, vuilafstotend en waterafstotend zijn. Dat zijn handige eigenschappen voor veel industrieën en voor producten die wij gebruiken, van regenjassen tot antiaanbakpannen. Problematisch is dat PFAS niet wordt afgebroken en zich overal nestelt. Wat doet dat met onze gezondheid? Moeten we ons zorgen maken en is er een remedie? (2026)
