  title: Dwars door de Pyreneeën
  subtitle: Van een vergeten taal naar de top van de Tourmalet S01 E03.
  description: 'We starten fluitend. In het Pyrenese dorpje Aas ontdekken Arnout en zijn vrienden een mysterieuze traditie: herders communiceerden er eeuwenlang via een unieke fluittaal. Hun tocht voert hen vervolgens naar het pelgrimsoord Lourdes, waar Arnout hartelijk wordt ontvangen door de nakomelingen van de heilige Bernadette. Na deze spirituele stop wacht de beklimming van de legendarische Tourmalet, met als ultieme beloning een magistrale sterrenhemel bij het observatorium op de Pic du Midi. (2026)'
