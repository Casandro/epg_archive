  description: 'Ingeklemd tussen Den Haag, het Westland en de zee ligt Solleveld: een uniek duingebied waar ook drinkwater wordt gewonnen. Het team gaat snorkelend door de infiltratiekanalen en tellend door de duizenden jaren oude duinen van het waterwingebied. Dit stukje kust wordt beschermd door de Zandmotor. Daar kruipt het team over de grond op zoek naar fossielen en turen ze over de opgespoten zandvlaktes naar kustvogels. Tussen de wilde golven zijn kustvissen te zien die allemaal tussen de benen van nietsvermoedende badgasten zwemmen. (2026)'
