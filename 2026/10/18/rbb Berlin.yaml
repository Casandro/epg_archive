  subtitle: Warum die Wohnungssuche in Cottbus zur Geduldsprobe wird
  description: |-
    Cottbus gilt als dynamischste Stadt Deutschlands. Keine andere Region hat in den letzten Jahren so große wirtschaftliche Fortschritte gemacht. Mit dem Strukturwandel ziehen Großprojekte in die Stadt, neue Unternehmen schaffen Arbeitsplätze. Gleichzeitig berichten viele Wohnungssuchende von großen Problemen: wenig Auswahl, teure Mieten. Wie groß ist der Wohnungsmangel wirklich?
    Zu Gast: Doreen Mohaupt (Bürgermeisterin der Stadt Cottbus), Thomas Schulz (Mieterbund), Dr. Sebastian Herke (Geschäftsführer der Gebäudewirtschaft Cottbus), Prof.Dr. Caroline Genz (Zentrum für Strukturwandel und Regionalentwicklung/ BTU Cottbus Senftenberg)
