  description: 'Hanko, zachraň štěně. Městem chodí Mikuláš, anděl a zatím nezkušená čertice Berta. Tak se snadno stane, že je omylem zavřena do komory v jednom z bytů, a neví, jak se vrátit zpět do pekla. Napsal: Jiří Jelínek. Režie: Radim Nejedlý. Natočeno v roce 2015. Účinkují: Anna Zapletalová, Denisa Čepická, Miloslav Maršálek, Petra Bučková a další.'
