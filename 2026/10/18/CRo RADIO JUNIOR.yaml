  title: Pohádkové poklady
  description: 'Dlouhý, Široký a Bystrozraký. Slavná pohádka Karla Jaromíra Erbena o princi, který za pomoci svých tří služebníků vysvobodí krásnou princeznu ze zajetí zlého černokněžníka. Napsal: Karel Jaromír Erben, režie: Jan Berger. Natočeno v roce 1966. Vypráví: František Smolík.'
- eventId:
  - 849785
  - 858524
  start: 2026-10-18T17:50:00Z
  stop: 2026-10-18T18:00:00Z
  title: Hajaja
  description: 'Sladké a slané cestování 7/7 - Banh cuon a znojemská. Jsou dvě věci, které Emilka miluje ze všeho na světě nejvíc: jídlo a cestování. Kromě téhle veliké lásky má navíc obrovskou představivost, která ji dokáže přenést do dávných dob a dalekých krajů, kde vznikly její oblíbené recepty. Sedm sladkých a slaných příběhů o cestách za jídlem a dobrodružstvím napsala Antonie Rašilovová. Dramaturg Vojtěch Bohuslav. Režie Bela Schenková. Natočeno v roce 2026. Vypráví Eva Hacurová. PREMIÉRA.'
