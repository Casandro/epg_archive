  title: '"Твой рецепт" -- 0+ №4 Стефания Давыдова'
  subtitle: '"Твой рецепт" -- 0+ №4 Стефания Давыдова'
  description: '"В гостях у Влады - настоящая звезда и участница популярного реалити-шоу "Чадо из Ада", любимая миллионами подписчиков SteshOK (Стешок) Вместе они готовят онигири - но не простые, а с самыми неожиданными начинками: каждая придумывает для другой такой вкус, который ни одна из них раньше никогда не пробовала! А потом - главный кулинарный сюрприз выпуска: блюдо под названием "Кулинарный Оскар". Что это? Секрет, который раскроется только тем, кто досмотрит до конца! Пока рис остывает, Стефания делится откровенными историями: каково было сниматься в реалити-шоу "Чадо из Ада", как справляться с буллингом в школе, почему так важно иметь рядом настоящих друзей и какую роль в её жизни играет семья. И да - в студии появляется мама Стеши! Она помогает разобраться, чьи онигири получились смелее... и страннее! А ещё в выпуске - весёлые рубрики, которые обожают зрители: Жёсткое пение - Стешок и Влада поют хиты Стеши на гелии ДаНетка - ответы только "да" или "нет". Вопросы от подписчиков - честные, трогательные и иногда очень неожиданные. Этот выпуск - про дружбу, смелость быть собой и то, как даже самые странные онигири могут стать вкусными, если делать их вместе. Не пропустите! "'
- eventId: 714912
  start: 2026-10-18T05:00:00Z
  stop: 2026-10-18T05:30:00Z
  title: '"Джозеф Принц" -- W_042_26'
  subtitle: '"Джозеф Принц" -- W_042_26'
  description: 'Джозеф Принс имеет более чем двадцатилетний опыт в служении и является одним из ведущих ораторов, возвещающих Евангелие по всему миру с помощью обучающих ресурсов и телевизионного служения. Джозеф - весьма популярный спикер конференций, он повлиял на многих религиозных лидеров по всему миру с дерзновением проповедуя Евангелие Иисуса Христа. Принс преподносит Слово Божье практическим и познавательным методом, благодаря чему Иисус в полноте открывается слушателям. Юмористический, динамичный и зажигательный стиль проповеди Принса постоянно привлекает к себе зрителей различных возрастов: они с интересом смотрят его телепередачу "Предназначены царствовать". В настоящее время эту программу смотрят миллионы семей Северной Америки, Европы, Африки, Австралии и Израиля; она транслируется как в светских, так и в христианских телесетях. Джозеф является пастором церкви "Новое творение" (Сингапур); во время его служения община выросла в сто раз -от 150 до 22000 прихожан. Джозеф желает, чтобы христиане возрастали духовно и помогает им научиться царствовать в жизни через обилие Божьей благодати и дар праведности. Он желает помочь своим современникам-верующим постичь Новый Завет благодати и осознать, как щедро они одарены и любимы Небесным Отцом.'
