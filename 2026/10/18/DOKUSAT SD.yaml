  title: Tiere vor der Kamera - Eistaucher - Die Stimme der Wildnis
  subtitle: Tiere vor der Kamera - Eistaucher - Die Stimme der Wildnis
  description: Arendt und Schweiger fangen den Zauber des Eistauchers ein, dessen Ruf als "Stimme der Wildnis" unvergesslich bleibt. Im Film brechen die eleganten Vögel durch den Morgennebel auf den Seen und markieren ihre Brutreviere. Kämpfe und Verfolgungsjagden sind spektakulär, ebenso wie ihre Startabbrüche und Notlandungen. An Land brüten sie und kümmern sich liebevoll um ihre Küken, die bald ins Wasser hüpfen.
