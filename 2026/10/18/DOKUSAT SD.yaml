  title: Tiere vor der Kamera - Elche in Alaskas Wildnis
  subtitle: Tiere vor der Kamera - Elche in Alaskas Wildnis
  description: 'Die Eckdaten hören sich beeindruckend an: Schulterhöhe und Geweihausladung beides über 2m, Gewicht bis 800 Kg. Doch die größte Hirschart unserer Erde hat mehr zu bieten als nur Superlativen. Arendt/Schweiger haben sich in Alaska die Elche genauer angeschaut: Liebevolle Mütter, posende Machos und streitbare Haremsbesitzer. Höhepunkt im Jahr der Elche, die Brunft bei klirrender Kälte. Das Aufbrechen der Flüsse, singende Vögel, Sommerblumen, Beeren, Eiswürmer und vieles mehr runden das Alaska-Erlebnis ab.'
  genre:
  - '129'
  widescreen: true
