  title: Tiere vor der Kamera - Highway in die Eiszeit - Sommer auf Eis
  subtitle: Tiere vor der Kamera - Highway in die Eiszeit - Sommer auf Eis
  description: Der Dalton Highway ist im Sommer eine Herausforderung. Über 670 km führt die raue Schotterstraße von Fairbanks in die hohe Arktis zu den Ölfeldern von Prudhoe Bay. Ernst Arendt und Hans Schweiger nehmen uns mit auf eine erlebnisreiche Reise über das Brooksgebirge im kurzen arktischen Sommer. Die Tundra wird zum Blumengarten, während Arendt/Schweiger Moschusochsen, Caribou, Grizzlybären und Erdhörnchen filmen. Erleben Sie mit ihnen die Schönheit dieser einzigartigen Landschaft.
  genre:
