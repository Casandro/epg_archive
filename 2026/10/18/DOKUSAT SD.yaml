  title: Tiere vor der Kamera - Kleine liebenswerte Alaskaner
  subtitle: Tiere vor der Kamera - Kleine liebenswerte Alaskaner
  description: In Alaska, wo Größe dominierend ist, haben Ernst Arendt und Hans Schweiger die oft übersehenen Alaska-Pfeifhasen ins Rampenlicht gerückt. Diese liebenswerten, knuddeligen Tiere legen im Sommer eifrig Vorräte für den langen Winter an und flitzen mit unhandlichen Heuladungen über die Steine. Während Arendt und Schweiger Frühling, Sommer und Herbst in den Bergen Alaskas verbrachten, inspizierten Erdhörnchen regelmäßig ihr Lager, und die Pfeifhasen begutachteten ihre Ausrüstung.
