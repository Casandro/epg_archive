  title: Toulky Josefa Veselého
  description: V úvodu vám autor pořadu udělá pořádek ve jménech Presl, Ressel a Roezl, což byli dva kandidáti na pomník a jeden ten, kterému ten pomník skutečně postavili - tak jaksi omylem. Další známou neznámou osobnost představíme pouze indiciemi ze života a díla, na vás bude určit jí jméno. Toulky českou minulostí pak uvedou díl Konec polského hospodářství, který se bude věnovat samozřejmě českým zemím. Konkrétně českým zemím v 16.století pod králem Ferdinandem I.
