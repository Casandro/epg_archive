  title: Welsangeln mit Kunstköder im Freiwasser
  subtitle: Welsangeln mit Kunstköder im Freiwasser
  description: |-
    In diesem Video zeigen euch  John Chowns und Bernd Kapust das pelagische Angeln auf Welse in Belgien. Geangelt wird über die neueste Technik (Livescope). Die Fische werden gezielt gesucht und mit der Live-Technik gezielt angefahren und angeangelt.

     BE 2023
- eventId: 814788
  start: 2026-10-18T00:45:00Z
  stop: 2026-10-18T00:55:00Z
  title: Hechtangeln mit Oberflächenködern im kleinen Bach
  subtitle: Hechtangeln mit Oberflächenködern im kleinen Bach
  description: Kleinste Bäche halten oft die ein oder andere dicke Überraschung für uns Angler bereit. Neben Forellen und Döbeln sind es vor allem Hechte die hier ihr unwesen Treiben. Selbst der kleinste Unterstand kann von einem dicken Esox genutzt werden um auf Jagt zu gehen und Beute zu machen. Gerade diese Gewässer sind prädestiniert um sie mit Oberflächenködern zu befischen. Egal ob Flachwasser, Pflanzenfelder oder Totholz, diese Stellen sind die absoluten Hotspots. Die Attacken der Hechte sind Brachial, sie haben in diesen kleinstgewässern gelernt ihre Nahrung direkt an der Oberfläche zu schlagen. Wie aus dem nichts schiessen sie mit voller Gewalt auf die Stickbaits welche durch ihren verführerischen links - rechts lauf die druckwellen im ganzen Gewässer verteilen. Das macht gerade diese Fischerei unfassbar spannend und effektiv. DE 2019
- eventId: 814789
  start: 2026-10-18T00:55:00Z
  stop: 2026-10-18T01:09:00Z
  title: The Drift - mit dem Belly Boat auf Rapfen und Döbel im Fluss
  subtitle: The Drift - mit dem Belly Boat auf Rapfen und Döbel im Fluss
  description: Es ist ein unfassbares Abenteuer mit dem Belly Boat auf einem großen Fliessgewässer hinab zu treiben. Kilometer um Kilometer, immer mit der Srömung unterwegs. Jeder Wurf an eine neue Stelle kann ein Treffer sein. Umso abwechslungsreicher die Uferbereiche sind, umso interesanter ist auch die Fischerei. Buhnenfelder mit Strömungskanten sin absolute Hotspots für Rapfen, dicke Döbel lieben Steinfelder an den Uferkanten. Wenn hier der Oberflächenköder landet gibt es oft direkt nach dem Einwerfen einen heftigen Biss und ein spannender Drill beginnt. Die "friedlichen" Räuber sind sehr kampfstark und verlangen den Anglern und dem Gerät alles ab. DE 2019
- eventId: 814790
  start: 2026-10-18T01:10:00Z
  stop: 2026-10-18T01:21:00Z
  title: Karpfenangeln - Small Lake - coole Carp
  subtitle: Karpfenangeln - Small Lake - coole Carp
  description: Im zeitigen Frühjahr sind die Wassertemperaturen oft noch tief im Keller, die Karpfen wenig aktiv und der Angelplatz und der Futtereinsatz muss wohl überlegt sein. Wie ich mit meinem Team in diesen Situationen an kleinen Gewässer vorgehe und wie es uns gelingt auch zu diesen unkomfortablen Situationen zielsicher die Karpfen zu fangen, zeige ich in diesem Video. Neben Spots beleuchten wir die Angeltiefe, Umweltfaktoren, das Finden der Angelstelle und die Futtermengen. DE 2019
- eventId: 814791
  start: 2026-10-18T01:25:00Z
  stop: 2026-10-18T01:38:00Z
  title: Spinnfischen Hot - Das Update!
  subtitle: Spinnfischen Hot - Das Update!
  description: Ein Abriss des Balzerteam Österreich über das Spinnfischen mit kleinen Kunstködern im Sommer. In den frühen Morgenstunden sind während der Hitzeperioden kleinere Hechte, Barsche, Zander und auch Rapfen zu fangen. Spinnangeln voll von Überraschungen. AT 2019
- eventId: 814792
  start: 2026-10-18T01:40:00Z
  stop: 2026-10-18T02:06:00Z
  title: Flussgeflüster - Kapitale Karpfen aus dem Strom
  subtitle: Flussgeflüster - Kapitale Karpfen aus dem Strom
  description: Sie sind mystisch und oft schwierig zu befischen. Deutsche Flüsse können launisch sein. Flüsse sind oft durch geringe Fischdichten geprägt. Befolgt man jedoch ein paar einfache Regeln, wird man am Fluss regelmäßig und nachhaltig erfolgreich sein. Wie es mir gelungen ist, auf einer Session von nur einer Nacht einen Fisch mit weit über 20kg am Fluss zu fangen? Das zeige ich dir in meinem Film Flussgeflüster.  NL 2022
- eventId: 814797
  start: 2026-10-18T02:10:00Z
  stop: 2026-10-18T02:36:00Z
  title: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  subtitle: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  description: Schwarzbarsche sind zum einen sehr neugierig, können aber auch extrem zickig und vorsichtig sein. Darum ist es wichtig zu wissen, wie sie gerade ticken, um den maximalen Fangerfolg zu erzielen. Je nach Tagesform beißen sie sehr gut auf geleierte Köder wie z. B. einen Propbait. Manchmal jedoch ist ein unregelmäßiger Lauf wie der des Poppers unschlagbar. Um dies herauszufinden, versuchen wir alle gängigen Modelle der Topwaterköder und stellen uns die frage, welcher wird die meisten und größten Fische bringen? DE 2022
- eventId: 814798
  start: 2026-10-18T02:40:00Z
  stop: 2026-10-18T02:45:00Z
  title: Topwaterangeln im Juni - 12 Monats Challenge
  subtitle: Topwaterangeln im Juni - 12 Monats Challenge
  description: Der Sommer hält Einzug im Land und mit ihm sind die Bachbewohner sehr aktiv und finden jede Menge Nahrung an der Wasseroberfläche. Raupen, Libellen, Falter, Käfer, Spinnen und andere Insekten sind in Massen vorhanden und alle Räuber schlagen sich gerade jetzt mit ihnen ihre Mägen voll. Wer jetzt an der Oberfläche angelt, kann wahre Sternstunden erleben, atemberaubende Bisse und eine fantastische Fischerei sind vorprogrammiert. DE 2022
