  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Die verschwundenen Quellen der Liechtensteinklamm
  description: "Alles beginnt mit einem satanischen Pakt. Hoch über dem Pongauer Salzachtal hat ein Schmied, der sein mühevolles Leben satt hat und endlich reich sein möchte, den Teufel um ein Treffen ersucht. Er bietet dem Satan seine beeinträchtigte Tochter an, wenn dieser die Heilquellen aus dem benachbarten Gasteinertal vor sein Haus umleitet. Denn mit Kurgästen lässt sich zu jener Zeit viel Geld verdienen. \nDie Spurensuche führt Max Müller in die Liechtensteinklamm. Eveline Huber, die Bürgermeisterin von St. Johann im Pongau, berichtet ihm dort von warmen Quellen, die der Teufel verwunschen haben soll. Das bestätigt auch Hans Schwaiger. Der Unternehmer war in den 1980er-Jahren am letzten Versuch beteiligt, die Heilquellen zu fassen. Wie viele vor ihm ist auch er daran gescheitert. Bei seinen weiteren Nachforschungen trifft der Sagenjäger Hans Strobl. Der Einheimische zeigt ihm den Platz, wo sich das Drama um die gehbehinderte Tochter des Schmieds abgespielt haben soll. Zuletzt reist Max Müller noch nach Schwarzach im Pongau, wo er Bettina Schörgenhofer trifft. Die Geschäftsführerin von Provinzenz, einer gemeinnützigen Betreuungseinrichtung für Menschen mit Beeinträchtigungen, sieht die positiven Seiten der Sage. Sie hat nämlich ein Happy End."
  genre:
  - '34'
