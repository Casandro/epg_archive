  title: On Broadway - Die Erfolgsstory einer Theatermeile
  description: |-
    (Dokumentation, USA 2019)
    Seit Generationen ist er das Zentrum der amerikanischen Popkultur und ein wahrer Magnet für Theaterliebhaber und Musicalfans aus aller Welt: der Broadway. In seiner Dokumentation wirft der Academy Award nominierte Filmemacher Oren Jacoby einen Blick auf die lange Tradition des Broadway und seine kulturelle Relevanz. Der Film beleuchtet die Entwicklung des Theaters von seinen Anfängen im 18. Jahrhundert bis zur Gegenwart und zeigt, wie der Broadway zu einem Synonym für erstklassige Bühnenproduktionen und Live-Unterhaltung wurde. Eine hochkarätige Besetzung erzählt die turbulente Geschichte des bekanntesten Theaterviertels in New York City. Bühnen- und Leinwandstars wie Hugh Jackman, Helen Mirren, Alec Baldwin, Christine Baranski, James Corden, John Lithgow und Ian McKellen führen hinter die Kulissen der bahnbrechendsten und beliebtesten Broadway-Shows, von "A Chorus Line" über "Cats" bis "Hamilton".
    Regie: Oren Jacoby
  genre:
  - '112'
