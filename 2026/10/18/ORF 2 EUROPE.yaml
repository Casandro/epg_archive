  title: Österreich-Bild aus dem Landesstudio Burgenland
  subtitle: 50 Jahre Volksgruppengesetz. Nur ein leeres Versprechen?
  description: Erst vor kurzem wurde das österreichische Volksgruppengesetz anlässlich des 50-jährigen Jubiläums novelliert - unter anderem sind die sechs autochthonen Volksgruppen nun im Gesetz verankert. Während der letzten Jahrzehnte hat sich vieles getan, für manche war das aber zu wenig. Immer wieder gab es Konflikte und Streitthemen, wie etwa den Spracherhalt, die zweisprachigen Ortstafeln oder das Minderheitenschulgesetz. Katharina Graf-Janoska blickt in ihrer Dokumentation "50 Jahre Volksgruppengesetz. Nur ein leeres Versprechen?" gemeinsam mit Volksgruppenvertreterinnen und -vertretern zurück und versucht herauszufinden, welche Probleme tatsächlich gelöst werden konnten.
  genre:
  - '34'
