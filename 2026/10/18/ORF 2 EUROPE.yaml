  title: Erlebnis Österreich
  subtitle: Frauen. Forschen. Sammeln - 150 Jahre Naturhistorisches Museum
  description: "Die Doku erzählt von den Gaben, die noch heute der mehr als 29.000 Jahre alten Venus von Willendorf dargebracht werden, obwohl diese längst hinter Sicherheitsglas in einer Vitrine steckt.  \nÜber die ersten Sammlerinnen, die noch heute existierende Exemplare von ihren Weltreisen mitgebracht haben.\nVon jenen Frauen die sich dem Erhalt der DNA, der Präparate, der unzähligen konservierten Pflanzen verschrieben haben. Von einer Kämpferin, die unter Pseudonym in einer Männerdomäne mitmischen konnte.\n150 Jahre nach der Gründung des k.k. Naturhistorischen Hofmuseums steht heute eine Frau an der Spitze des NHM und mit ihr Wegbereiterinnen und Wegbegleiterinnen, die alle eine Geschichte haben, die erzählt werden muss. \nEin Film von Ulrike Dobes für das Landesstudio Wien"
