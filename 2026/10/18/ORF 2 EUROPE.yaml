  title: On Broadway - Die Erfolgsstory einer Theatermeile
  description: |-
    (Dokumentation, USA 2019)
    Seit Generationen ist er das Zentrum der amerikanischen Popkultur und ein wahrer Magnet für Theaterliebhaber und Musicalfans aus aller Welt: der Broadway. In seiner Dokumentation wirft der Academy Award nominierte Filmemacher Oren Jacoby einen Blick auf die lange Tradition des Broadway und seine kulturelle Relevanz. Der Film beleuchtet die Entwicklung des Theaters von seinen Anfängen im 18. Jahrhundert bis zur Gegenwart und zeigt, wie der Broadway zu einem Synonym für erstklassige Bühnenproduktionen und Live-Unterhaltung wurde. Eine hochkarätige Besetzung erzählt die turbulente Geschichte des bekanntesten Theaterviertels in New York City. Bühnen- und Leinwandstars wie Hugh Jackman, Helen Mirren, Alec Baldwin, Christine Baranski, James Corden, John Lithgow und Ian McKellen führen hinter die Kulissen der bahnbrechendsten und beliebtesten Broadway-Shows, von "A Chorus Line" über "Cats" bis "Hamilton".
    Regie: Oren Jacoby
  genre:
  - '112'
- eventId: 690538
  start: 2026-10-18T08:00:00Z
  stop: 2026-10-18T08:44:04Z
  title: Die Dirigentin Marin Alsop - Botschafterin der Musik
  description: |-
    (Dokumentation, AUT 2018)
    Die Dokumentation zeigt ein ganz persönliches Porträt der US-amerikanischen Dirigentin Marin Alsop, die am 16. Oktober ihren 70. Geburtstag feiert. Als erste Frau stand sie dem ORF Radio-Symphonieorchester Wien als Chefdirigentin und musikalische Leiterin vor. Regisseurin Bernadette Wegenstein begleitete die Ausnahmekünstlerin während zahlreicher musikalischer Aufführungen rund um den Globus. Um Marin Alsops beruflichen Werdegang zu skizzieren, zeigt die Filmemacherin noch nie veröffentlichtes, privates Videomaterial von Marin Alsop als junge Dirigentin mit ihrem Mentor und Lehrer Leonard Bernstein, dessen Assistentin sie später wurde. Ebenso kommen Musikerinnen und Musiker diverser Orchester, wie etwa dem ORF-RSO Wien zu Wort sowie die Dirigentin Sylvia Caduff, ohne deren Vorbild die "Frau am Pult" wohl noch länger nicht den Weg in die Köpfe der Veranstalterinnen und Veranstalter gefunden hätte.
  genre:
  - '112'
