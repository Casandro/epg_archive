  title: kreuz & quer reportage
  subtitle: Die Reise der Götter - Das indische Wagenfest Ratha Yatra
  description: |-
    Das Ratha-Yatra-Fest mit der großen Wagenprozession gehört zu den ältesten und kraftvollsten Ritualen des Hinduismus. Es ehrt die Gottheiten Jagannath, Balabhadra und Subhadra. Einmal im Jahr verlassen die Statuen, die die Gottheiten repräsentieren, ihre Tempel: Auf monumentalen Wagen begegnen die Götter den Menschen auf der Straße, wobei alle Unterschiede der Kasten und gesellschaftlichen Stände keine Rolle mehr spielen. Regisseur Klaus Steindl begleitet das aufwendige Schmücken der Wagen und taucht ein in den Trubel des bunten und für Europäer höchst exotischen Festes in der indischen Megacity Delhi.
    Danach "kreuz & quer plus": Iconic - Schlüsselmomente: Gandhis Salzmarsch.
