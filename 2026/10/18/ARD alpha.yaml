  description: Das Reisen mit dem Nachtzug gilt als umweltfreundlich, ist jedoch für die Bahngesellschaften eher unrentabel. Mathematiker Anton Dubrau und Produktdesigner Hendrik Lucka aus Berlin wollen die Effizienz der Nachtzugreisen erhöhen. Sie haben mit neuen Ideen Abteile designt, die die Zahl der Reisenden pro Waggon erhöht und gleichzeitig mehr Komfort und Privatsphäre für die Gäste bietet. Bislang existiert nur ein Prototyp. Den testen drei Zugfahr-Fans. Zudem zeigt ein Wissenschaftler der TU Berlin, welche Zertifizierungen und Crash-Tests die Abteile durchlaufen müssen, um in Serie zu gehen.
