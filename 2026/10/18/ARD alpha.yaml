  title: 'Chanticleer: Sing Joyfully'
  subtitle: Große Nürnberger Musiknacht von BR Klassik und Musikfest ION
  description: |-
    Chanticleers Ideal ist der reine, bis in die feinsten Nuancen austarierte Ensembleklang. Zwölf Sänger - Countertenöre, Tenöre, Baritone und Bässe - lassen ihre Stimmen zu einem homogenen, schwebenden Klangkörper verschmelzen.
    Besonders eindrucksvoll zeigt sich diese Kunst in der Musik des Mittelalters und der Renaissance: Werke von Guillaume de Machaut, Orlando di Lasso oder William Byrd interpretiert Chanticleer mit unglaublicher Transparenz und Farbreichtum in den Stimmen. Dieses Kernrepertoire erweiterte das Ensemble durch traditionelle Folk Songs, Spirituals oder atemberaubende Stimmexperimente wie in dem Lied "Hee-oo-oom-ha".
