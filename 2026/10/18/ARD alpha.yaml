  subtitle: 'Die große Sonnen-Frage: zu wenig, zu viel? Genau richtig!'
  subtitled: true
  description: |-
    Mit einer speziellen Kamera macht "Quarks" ein Experiment und testet, ob Fenster- oder Autoscheiben vor UV-Strahlung schützen. Wie viel Strahlung bekommen wir an einem Sommertag überhaupt ab? Und auch das macht die Spezial-Kamera sichtbar: Was bringt Sonnencreme?
    Weil ihr Nutzen umstritten ist, steht das Hautkrebs-Screening für Menschen ab 35 Jahren auf der Streichliste der Gesundheitsreform. "Quarks" erklärt, wie wir auch selbst nach der ABCDE-Regel unsere Haut checken und im besten Fall Leben retten können.
    Und wenn die Tage demnächst wieder kürzer werden - dann fehlt uns das Sonnenlicht.
