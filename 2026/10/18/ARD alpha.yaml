  title: alpha Uni
  subtitle: 'Studium: Sportmanagement, Ergotherapie'
  description: "Henriette (Henni) studiert Sportmanagement im 4. Semester an der Universität Potsdam. Ihr Studium ist ein Spagat zwischen BWL und Sport: Neben Fächern wie Statistik spielt auch die Sportpraxis eine große Rolle. Zum Pflichtprogramm gehören unter anderem Schwimmen, Leichtathletik, Kampfsport und verschiedene Ballsportarten. \n\nAlissa studiert im 3. Semester dual Ergotherapie an der Hochschule Osnabrück und hat ein klares Ziel: Später möchte sie mit Kindern arbeiten. Doch zunächst steht eine wichtige Prüfung an. Alissa muss ein realistisches Erstgespräch zwischen Therapeutin und Klientin führen."
