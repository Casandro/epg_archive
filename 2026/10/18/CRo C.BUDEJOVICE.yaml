  title: Písničky z cizí kapsy
  description: Českokrumlovský rodák Petr Muk je jedním z nemnoha hudebníků, kteří to z jižních Čech dotáhli až k celorepublikovému uznání. A to nejen v pozici zpěváka, který byl známý, ale skutečně masově populární. Zásadní roli v tom bezpochyby sehrálo jeho účinkování ve skupině Oceán, která ve své době strhla lavinu přízně blížící se až statusu kultovní kapely. Muk ale uspěl i jako sólista, žánrově orientovaný na pop-rock a pop. Jeho nahrávka někdejšího hitu britské skupiny Erasure je vzpomínkou na časy, kdy takzvaně "letěl" synth-pop. Ale také dalším z mnoha důkazů, že hlasový fond tohoto Jihočecha snesl smělé srovnání se stylově spřízněnou evropskou špičkou. Bohužel, právě už jen v čase minulém. K poslechu zve Martin Schuster.
