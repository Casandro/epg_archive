  description: '"Najbolje s brodveja" je zanimljiva priča o trojici muškaraca iz New Yorka koji se suočavaju s osobnim i profesionalnim problemima. Oni izigravaju policajce u civilu i jure ozloglašenog dilera droge kako bi dobili materijal za scenarij vrhunske policijske drame. Očajni da postignu uspjeh, ulaze u opasan svijet tajnog policijskog rada kako bi stekli što autentičnije iskustvo, koje smatraju neophodnim za uspjeh svog projekta. Kako im ograničenja kao loše pripremljenih detektiva sve više zakompliciraju situaciju i uvlače ih dublje u slučaj, shvaćaju da izbora više nema...'
