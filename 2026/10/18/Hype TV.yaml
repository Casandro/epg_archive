  subtitle: Klan Triler
  description: Ubojstvo Tigra, najvećeg mafijaškog bossa ovog dijela Europe iz temelja je uzdrmalo srpsko podzemlje. Mnogi žele zauzeti njegovo mjesto, karte se ponovno dijele, svi žele svoj dio kolača i spremni su napraviti sve da bi ga i osvojili. Na marginama tog svijeta, Šok (Aleksandar Dimitrijević) i Paša (Nedim Nezirović), provincijalci i ne pretjerano uspješni sitni lopovi, tek počinju svoju karijeru koja će ih dovesti do neslućenih visina.
