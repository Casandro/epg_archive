  title: Damals im Kurbad
  subtitle: Ein Film von Sybille Krafft
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wer es sich leisten konnte, reiste in den 1920er Jahren mit großem Gepäck ins Kurbad. Dort gab sich die vornehme Gesellschaft im Grandhotel ein Stelldichein. Diener trugen Gamaschen, Kellner servierten im Frack. Die Kur, früher ein Privileg begüterter Stände, wurde inzwischen demokratisiert und ist eine soziale Errungenschaft der Nachkriegsgesellschaft. Heute können sich viele Menschen eine Kur leisten, auch wenn der Beitrag der Krankenkassen immer weniger wird. Sybille Krafft ist in der Reihe "Damals" wieder auf eine Zeitreise gegangen und in die Welt der Kurkonzerte und Kurschatten, der Wärmewickel und Wassergüsse eingetaucht.
