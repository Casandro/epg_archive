  description: Edgar, das Super-Karibu fliegt durch die Luft, als er Gina, die schöne Kameldame sieht. Sie ist so schön! Das bringt ihn etwas durcheinander. So sehr, dass er mit einem Vogel zusammenstößt. Hoppla! Super-Edgar bringt den kleinen, verletzten Vogel ins Krankenhaus. Es ist nicht so schlimm, aber dem Karibu macht das so sehr zu schaffen, dass er mit einem zweiten Vogel zusammenstößt. Jetzt wird er es nie mehr wagen, nochmal zu fliegen.
