  description: Bernhard, das Eichhörnchen hat Geburtstag. Alle seine Freunde haben beschlossen, ihm eine gigantische Nuss aus Beton zu schenken. Was für ein schönes Geschenk! Bernhard ist davon völlig hin und weg. Aber er ist davon überzeugt, dass es sich um eine echte Nuss handelt! Und niemand traut sich, ihm die Wahrheit offen zu sagen, damit ihm nicht das Herz bricht.
