  title: Druckfrisch
  subtitle: Neue Bücher mit Denis Scheck
  widescreen: true
  subtitled: true
  hd: true
  description: Allein in Deutschland erscheinen jedes Jahr 90.000 neue Bücher. Ganz schön schwer, hier den Überblick zu behalten. "Druckfrisch", das Büchermagazin im Ersten, hilft bei der Orientierung im Bücherdschungel. Moderator Denis Scheck besucht Schriftsteller und stellt Neuerscheinungen vor. Er lobt und lästert über die aktuellen Bestseller, spricht Empfehlungen aus, sagt aber auch, welche Bücher reine Zeitverschwendung sind. Belletristik, Krimis, Sachbücher, Biographien oder Kochbücher - nichts ist vor ihm sicher.
