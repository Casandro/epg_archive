  widescreen: true
  subtitled: true
  hd: true
  description: "Die Ermordung der Jungunternehmer Philip Bergman und Thomas Bonetti führt Irene Huss in den Bereich der Wirtschaftskriminalität. Mit dem Börsengang ihrer Computerfirma ergaunerten die beiden ein Vermögen. Das Nachsehen hatten Anleger, die wertlos gewordene Aktien nicht rechtzeitig verkauften. Ob einer der Geschädigten tatsächlich ein ausreichendes Mordmotiv hatte, scheint zweifelhaft. \nNähere Auskünfte erhofft Irene sich von Bergmans Exfreundin Sanna Kaegler und deren Freund Stefan Wermling, der in dem dubiosen Unternehmen die Bücher führte. Als Sanna auf offener Straße niedergeschossen wird, nimmt der Fall eine unerwartete Wendung."
