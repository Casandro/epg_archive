  title: Halvdan, der Wikinger
  subtitle: Spielfilm Schweden 2017
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  description: "Halvdan lebt in einem Wikingerdorf auf der Ostseite des großen Flusses. Weil er eher klein ist und humpelt, wird er von den anderen Kindern des Dorfes gehänselt und hat keine richtigen Freunde. Als er die mutige Meia kennenlernt, ist er erst skeptisch. Schließlich kommt sie aus dem anderen Dorf von der Westseite des Flusses. \nAber Halvdan ist schnell hingerissen von Meia und die beiden freunden sich an. Als die Wikinger vom Ostufer dann immer stärker unter einer Hungersnot leiden, hecken die beiden Kinder einen Plan aus, wie sie heimlich Lebensmittel stehlen können. Als das auffliegt, kommt es fast zum Krieg zwischen den Dörfern."
