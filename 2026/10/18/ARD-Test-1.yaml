  description: Buster ist ein ganz besonderer Spürhund, der in Kriegsgebieten zum Erschnüffeln von Explosionsstoffen und Waffen eingesetzt wird. Im Irak führt Buster die Soldaten zu einem versteckten Waffenarsenal und rettet so vermutlich vielen Menschen das Leben. Wie konnte Buster die Waffen hinter einer Wand aufspüren? Wieso hat er sich den Befehlen seines Herrchens widersetzt und darauf beharrt, dass die Soldaten weitersuchen? Boris und Milan wollen es wissen und besuchen eine Polizeihundeschule. Layla findet im Internet vergleichbare Geschichten und Beweise. Und Jamey und Lina stellen die Bindung zwischen Menschen und Hunden auf die Probe.
