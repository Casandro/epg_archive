    Tina, Tschernobyl und der Piratensender
    Caro Korneli im Gespräch mit Mandy Schielke

    Tina Krone lebt in Ost-Berlin, als sich 1986 die Reaktor-Unglück in Tschernobyl ereignet. Weil die DDR-Medien die Bevölkerung nicht ausreichend informieren, gründet Tina mit einer geheimen Gruppe einen Piratensender - ein gefährlicher Akt der Rebellion und Selbstermächtigung.
