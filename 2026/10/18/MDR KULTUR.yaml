  title: 'MDR KULTUR Sonntagsraten: Der Sonntag'
  subtitle: Radioquiz von und mit Axel Thielmann
  description: "Ganz klar, der Sonntag ist ein ganz besonderer Tag in der Woche. Er ist der Ruhe gewidmet, der Erholung, dem Sammeln neuer Kräfte. In den Kirchen wird der Gottesdienst gefeiert, die Straßen sind früh zur Zeit des Berufsverkehrs leer und die meisten Menschen können ausschlafen, ausgenommen Schichtarbeiter, Krankenhauspersonal, Pfarrer und Radiomenschen, um nur mal ein paar Berufsgruppen zu nennen, die das nicht betrifft.\n\nIn Deutschland ist die Sonntagsruhe gesetzlich geregelt und verfassungsrechtlich besonders geschützt.\nDie Christen begreifen den Sonntagsgottesdienst als Feier von Tod und Auferstehung Christi. Und egal, ob sie früh in den Gottesdienst gehen, oder am Sonntag einfach nur die Beine hoch legen, einen Ausflug mit der Familie machen oder im Garten graben, wir brauchen ihn, diesen Tag. Und sei es nur, um einen Moment innezuhalten. Denn wie schrieb schon der alte Goethe? \"Der Mensch ist ein beschränktes Wesen; unsere Beschränkung zu überdenken, ist der Sonntag gewidmet.\"\n\nBei unseren Rätseln stehen keine wuchtigen Gewinnprämien im Vordergrund, sondern das Vergnügen zuzuhören und mitzumachen. Die Gewinnerin, der Gewinner wird aus all jenen MDR KULTUR-Hörern ermittelt, die die drei heute gestellten Fragen per E-Mail oder über den Postweg richtig beantworten. \n\nAußerdem gibt es ein kleines Rätsel-Extra in der Sendung: In einem der drei Rätsel ist ein Fehler versteckt. Wer den findet, kann noch während der Sendung direkt im MDR KULTUR-Studio unter der Tel.: 0800 55 99 88 4 anrufen und hat so die Chance auf einen Zusatzgewinn. Wer für die Lösung der drei Rätselfragen ein Überraschungspaket gewinnen möchte, sollte online mitmachen unter: sonntagsraten@mdr.de oder per Post an unten stehende Adresse."
- eventId: 1228744
  start: 2026-10-18T10:00:00Z
  stop: 2026-10-18T11:00:00Z
  title: 'MDR KULTUR Café: mit Michael Krebs'
  description: |-
    Er ist Kabarettist, Musiker, Entertainer - und ein genauer Beobachter seiner Zeit: Michael Krebs tritt meistens auf Kleinkunstbühnen auf, manchmal aber auch auf Metal-Festivals und wo er spielt, verbindet er politischen Witz mit Musik, Alltagsbeobachtungen und einer gehörigen Portion Selbstironie. Im letzten Jahr wurde sein künstlerisches Schaffen mit dem Leipziger Löwenzahn ausgezeichnet, dem  traditionsreichen Preis für das beste Programm bei der Lachmesse. Dieses Jahr am 25.10. eröffnet der gebürtige Schwabe das größte Humorfestival des Ostens und wird dann auch mit dem Löwenzahn geehrt werden.

    Im MDR KULTUR Café geht es um den Menschen und Künstler hinter den Pointen: um die Lust am musikalischen Kabarett, um gesellschaftliche Themen, die auf der Bühne plötzlich komisch werden, und um die Frage, was Kabarett in Zeiten sich überbietender realsatirischer Ereignisse eigentlich leisten kann. Er erzählt von seinem künstlerischen Weg, von der Arbeit an seinen Programmen und davon, was es bedeutet, vor einem Publikum zu stehen, das nicht nur lachen, sondern manchmal auch genauer hinschauen soll.

    Im MDR KULTUR Gespräch der Klavierkabarettist Miachael Krebs über Humor und Meinung, Musik und Bühne - und über die Kunst, den Finger in die Wunde zu legen, ohne dabei den Spaß zu verlieren.

    Eine Sendung von Ilka Hein
    Redaktion: Gabriele Bischoff
