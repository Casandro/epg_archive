  title: Výjimeční
  description: Petr Pithart - Politik, polistopadový předseda české vlády i Senátu Parlamentu České republiky - tím vším byl Petr Pithart. My si ale muže, který bývá považovaný za jednoho z "otců zakladatelů" české politiky a ústavnosti, představíme také jako spisovatele, disidenta, tátu od rodiny nebo čerpače vody z maringotky. Za svůj život napsal Petr Pithart, nepřehlédnutelná postava našeho polistopadového dění, dlouhou řadu esejistických textů, ve kterých se věnoval českým dějinám, současnosti, česko - německým vztahům nebo politice. Co pro něj bylo v životě nejdůležitější a jaká zažil zklamání? Další díl z cyklu Výjimeční připravila Tamara Kocourková.
