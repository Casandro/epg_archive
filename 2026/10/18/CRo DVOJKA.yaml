  title: Historie českého zločinu
  description: 'Díl 15. Král padělatelů. "Tak perfektní padělky jsem ještě neviděl" prohlásil odborník na falešné bankovky. Nelze se tedy divit, že padělané peníze přijali obchodníci a bankéři bez zaváhání. Do toho se začaly ve 20. a 30. letech v Československu šířit i falešné poštovní známky, které byly od pravých téměř k nerozeznání. Autor: Bronislava Janečková. Repríza.'
- eventId:
