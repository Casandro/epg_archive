  stop: 2026-10-18T17:50:00Z
  title: Muzikál expres
  description: Další díl pořadu vás pozva na úspěšnou inscenaci Jesus Christ Superstar do Londýna a připomene výročí premiér muzikálů Carousel a Američan v Paříži. Dále prozradí, že ve Vídni bude příští rok otevřeno zcela nové muzikálové divadlo v Prateru. První premiérou bude Lví král. Milovníky Fantoma Opery pak potěší informací, že záznam londýnského originálu bude brzy možno spatřit na filmovém záznamu. Ve druhé části pak zazní několik muzikálových melodií, která v produkci pořadu nahrál houslový virtuos Jaroslav Svěcený. Reprízu pořadu vysíláme v pátek 23. října od 21. hodiny. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
