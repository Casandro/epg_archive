  title: Planetárium
  description: O rostlinách a jejich opylovačích si budeme povídat s entomologem Robertem Tropkem. Mezi některými panují naprosto speciální vztahy, které může ohrozit i malá změna klimatu. Obrozenec a slavista Pavel Josef Šafařík byl mimo jiné i zručným kartografem. O jeho životě a díle bude hovořit Eva Novotná z Mapové sbírky Univerzity Karlovy. Moderuje Frederik Velinský.
