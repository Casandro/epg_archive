  title: WDR 5 Hörspiel am Sonntag
  subtitle: Die Kinski-Bänder
  description: |-
    San Francisco <markup type="abbr" abbreviation="1991" correspondent="Neunzehnhunderteinundneunzig">1991</markup>. Ein Journalist sitzt in seinem Hotelzimmer und telefoniert. Mit Klaus Kinski. Da kann er nur zuhören und sich ergeben in die Windungen des Kinski-Mikrokosmos. Bei dem Telefonat erkältete sich Klaus Kinski, kurz darauf starb er. Die Bänder von diesem letzten Interview, zeigen einen Weltstar, der hustend und frierend stundenlang erklärt, dass er nicht mit sich reden lässt.
    Regie: Thomas Wolfertz<br/>Produktion: WDR <markup type="abbr" abbreviation="2006" correspondent="zweitausendsechs">2006</markup>
    Ab dem <markup type="abbr" abbreviation="10." correspondent="zehnten">10.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
