  title: WDR 5 - Lies mir was vor
  subtitle: 'Robert Louis Stevenson: Der Flaschenteufel'
  description: "Der junge Hawaiianer Keawe erwirbt eine mysteriöse Flasche, die ihrem Besitzer jeden Wunsch erfüllt, ein Leben lang. Wer sie jedoch noch im Augenblick seines Todes besitzt, wird im ewigen Höllenfeuer schmoren. Deshalb muss sich Keawe rechtzeitig wieder von ihr trennen. Sie ist jedoch unzerstörbar. Um sie wieder loszuwerden, muss man die Flasche verkaufen, und zwar billiger, als man sie gekauft hat, sonst kehrt sie zu einem zurück. Und man muss dem Käufer vorher alle Bedingungen offenbaren... \nVon <markup type=\"language.en\">Robert Louis Stevenson</markup> <br/>Mit: Achim Gertz <br/>Produktion: NDR <markup type=\"abbr\" abbreviation=\"1966\" correspondent=\"neunzehnhundertsechsundsechzig\">1966</markup>/ 2 Teile\nZum Nachhören in ARD <markup type=\"language.en\">Sounds</markup>."
