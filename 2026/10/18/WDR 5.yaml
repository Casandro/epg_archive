  title: MausLive
  subtitle: 'Die Pfefferkörner: Muskeln um jeden Preis / Leos Vater (11/13)'
  description: |-
    <strong>Muskeln um jeden Preis</strong>
    Kann es sein, dass Fitness-Training so richtig gut tut und so richtig stark macht? Hakim findet schon. Außerdem lernt er dabei auch noch neue coole Leute kennen. Warum nörgeln seine Freunde aus dem Detektiv-Team denn nur an allem so herum?
    <strong>Leos Vater</strong>
    Mit Leo's Vater gibt es immer Ärger. Was wohl dieses Mal wieder passiert? Und prompt verschafft er den Pfefferkörnern einen neuen Fall: Dabei wird es in einem Hinterhof so richtig brenzlig.
    Regie: Sebastian Stuertz und Sandra Thormählen<br/>Produktion: NDR <markup type="abbr" abbreviation="2025" correspondent="zweitausendfünfundzwanzig">2025</markup>
