  title: Nad rozlewiskiem... - odc. 6/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Konrad zamieszkał z Małgosią nad rozlewiskiem. Pomaga jej w prowadzeniu pensjonatu. Marysia składa pozew o rozwód. Potem przyjeżdża nad rozlewisko, żeby zorganizować wyjazd integracyjny. Spotyka Krzysztofa. Wszystko zaczyna do niej wracać, wakacyjne uczucie wciąż jest żywe. Maciej chce spłacić za Mirkę dług zaciągnięty u Róży, ale ona ma pieniądze, które dostała w spadku po zmarłej babci. Mirka oddaje dług, a zaskoczona Róża przyznaje, że źle ją oceniła.
  ageRating: 12
  genre:
  - '23'
  subtitle: Marysia składa pozew o rozwód. Przyjeżdża nad rozlewisko, żeby zorganizować wyjazd integracyjny. Spotyka Krzysztofa. Okazuje się, że wakacyjne uczucie wciąż jest żywe. Mirka planuje założyć zespół.
- eventId: 688196
  start: 2026-10-18T01:00:00Z
  stop: 2026-10-18T01:50:00Z
  title: Nad rozlewiskiem... - odc. 7/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Umiera babcia Romana. Sławek przylatuje z Kanady na jej pogrzeb. Wkrótce wyjeżdża jednak z powrotem, ku niezadowoleniu Pauli, która chciałaby mieć chłopaka przy sobie. Piernacki rozmawia z Ewą o ślubie. Choć kobieta wygląda na szczęśliwą, zachowuje się dziwnie. Jest jakby nieobecna, skrywa jakąś tajemnicę. Piernacki jest tym mocno zaniepokojony. Pewnego razu Ewa wymyka się rankiem z domu i nie mówiąc nic Henrykowi, wyjeżdża do Warszawy. Chce pozałatwiać swoje sprawy. W drodze łapie gumę.
  ageRating: 12
  genre:
  - '23'
  subtitle: Biologiczny ojciec Broni pojawia się nad rozlewiskiem. Zamierza odebrać Pauli dziecko. Marysia radzi zmartwionej przyjaciółce, żeby uciekła się do szantażu. Małgosia martwi się rozwodem Marysi i Kuby.
