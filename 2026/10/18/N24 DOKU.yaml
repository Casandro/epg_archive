  title: PS-Riesen im Einsatz - Landmaschinen
  subtitle: PS-Riesen im Einsatz - Landmaschinen
  description: 'Moderne Landwirtschaft ist ohne sie undenkbar: Riesige Erntemaschinen wie Rüben- und Kartoffelroder, tonnenschwere Traktoren und PS-starke Häcksler. Agrartechnik made in Germany spielt auf dem Weltmarkt ganz vorne mit. Wie funktionieren die leistungsstarken Ernteriesen? Wo werden sie hergestellt? Die Reportage sieht sich auf der Landtechnikmesse Agritechnica in Hannover um, ist bei einem Ernteeinsatz in Vorpommern dabei und zeigt, mit welchem Aufwand die XXL-Maschinen transportiert werden.'
