  description: 'Techno-Skeptiker warnen vor den Risiken einer von Computern dominierten Zukunft, doch unser Alltag ist schon heute nur noch schwer ohne künstliche Intelligenz vorstellbar. Wie KI uns in naher Zukunft noch besser unterstützen kann, zeigt diese Folge: Humanoide Roboter, mit denen man sich unterhalten kann. Unermüdliche Transporteinheiten, die Über-Nacht-Lieferungen möglich machen. Fahrerlose Lkw, die den reibungslosen Warenfluss der Zukunft sichern sollen. Und eine Mini-Drohne namens "Crazyflie".'
  widescreen: true
