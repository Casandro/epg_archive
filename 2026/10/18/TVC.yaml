  title: Winnetou i król nafty
  subtitle: Winnetou i Old Surehand przekonują Indian, że biali osadnicy są nie są dla nich groźni. Ich wysiłki krzyżują knowania magnata naftowego, na którego zlecenie zostaje zamordowany syn wodza.
  description: |-
    Tytuł oryginalny: Der Ölprinz
    DE,YU, 1965
    Reżyseria: Harald Philipp
    Występują: Stewart Granger, Pierre Brice, Harald Leipnitz, Heinz Erhardt, Macha Méril, Terence Hill
    "Winnetou i król nafty" to kolejna część przygód dzielnego wodza Winnetou. Król Nafty, podstępny i rządny władzy człowiek, niszczy i oszukuje innych ludzi w celu wzbogacenia się. Najbardziej zależy mu na złożach ropy, które znajdują sie nad samym jeziorem, przy którym osiedli nowi osadnicy. By nie doszło do rozlania krwi, z pomocą nadchodzą Old Surehand i jego czerwony brat Winnetou. Razem stawią czoło bandycie.
