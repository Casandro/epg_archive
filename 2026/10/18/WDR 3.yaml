    1935 wagt Goodman eine ungewöhnliche Instrumentierung: Klarinette, Piano, Schlagzeug. Da das Trio großen Anklang findet entschließt er sich, es in sein Orchester-Programm zu integrieren. Die Tour endet mit einem umjubelten Konzert, das als Geburtsstunde des Swing gilt. Kurz darauf formiert er sein legendäres Quartett. Der Auftritt des "King of Swing" in der Carnegie Hall geht in die Annalen ein.
