  title: WDR 3 Studio Neue Musik
  description: |-
    Was bewegt junge Komponist*innen in Korea? Wie klingt ihre Musik? Die teilnehmende Beobachtung vor Ort zeigt eine Szene im Wandel: Neue Orte und Kollektive entstehen jenseits etablierter Strukturen. Junge Musikschaffende suchen im Nebeneinander von lokalen Traditionen, europäischen Einflüssen und globaler Popkultur ihre individuelle Stimme.
