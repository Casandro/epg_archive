  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: |-
    Manchmal braucht das Glück keine große Erklärung, sondern einfach die richtigen Töne. Graeme Koehne legt mit seiner Festfanfare einen schwungvollen Start hin, Mozart strahlt und jubiliert in seinem berühmten Exsultate, jubilate, und Johann Strauss zeigt, warum ein Walzer Menschen seit Generationen mitreißt. Auf der "Glücksinsel" treffen Gedichte auf charmante schottische Melodien und laden zum Innehalten ein. Dann öffnet Saint-Saëns mit seiner Orgelsinfonie die große Klangbühne: kraftvoll, farbenreich und überwältigend. Beethovens "Waldstein-Sonate" bringt Energie und Vorwärtsdrang ins Spiel, während Pandolfi Mealli und Schmittbaur mit Spielfreude und Leichtigkeit überraschen. Die Lieblingsstücke zeigen, wie unterschiedlich Glück klingen kann.
    <strong>Die Musikstücke der Sendung</strong>
    <strong>Graeme Koehne</strong><br/>Forty Reasons To Be Cheerful (Festive Fanfare)<br/>Tasmanian Symphony Orchestra<br/>Leitung: Richard Mills<br/>(06'34'')
    <strong>Wolfgang Amadeus Mozart</strong><br/>Exsultate, jubilate KV 165<br/>für Sopran, Orchester und Orgel<br/>Julia Lezhneva, Sopran<br/>Il Giardino Armonico<br/>Leitung: Giovanni Antonini<br/>(14'08'')
    "Glücksinsel"<br/>Drei Glückgedichte, eingebettet in James Oswald:<strong><br/><br/>Rose Ausländer<br/></strong>Nicht fertig werden<strong><br/><br/>Elisabeth Borchers<br/></strong>Was alles braucht's zum Paradies<strong><br/><br/>Robert Gernhardt<br/></strong>Rede vom Glück<br/><br/><strong>James Oswald</strong><br/>A sonata of Scots Tunes D-Dur<br/>aus: A Curious Collection of Scots Tunes<br/>La Rêveuse<br/><br/>(12'06'')
    <strong>Johann Strauss</strong><br/>Seid umschlungen, Millionen, op. 443<br/>Wiener Philharmoniker<br/>Leitung: Andris Nelsons<br/>(10'17'')
    <strong>Erich Wolfgang Korngold</strong><br/>Mariettas Lied "Glück, das mir verblieb"<br/>aus: Die tote Stadt, op. 12<br/>Julia Kleiter, Sopran<br/>Jonas Kaufmann, Tenor<br/>Leitung: Jochen Rieder<br/>(06'11'')
    <strong>Camille Saint-Saëns</strong><br/>Sinfonie Nr. 3 c-Moll, op. 78<br/>Peter Hurford, Orgel<br/>Orchestre Symphonique de Montréal<br/>Leitung: Charles Dutoit<br/>(34'24'')
