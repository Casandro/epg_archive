  title: Ritorno al presente Le gemelle sole/L'uo
  subtitle: Ritorno al presente Le gemelle sole/L'uomo sul tetto - In questa puntata di 'Ritorno al presente', la nostra auto storica va a Milano a trovare due gemelle italo-francesi, Isabelle e Antoinette. Nel 1966 a
  description: "vevano partecipato a un nuovo programma della RAI dedicato ai giovani e ai loro problemi. Avevano raccontato la loro difficoltà di ambientarsi a Milano. Si erano trasferite da poco all'ombra del Duomo, dopo essere nate ed aver vissuto per 17 anni a Lione, in Francia, dove i loro genitori, entrambi pugliesi, erano emigrati nel 1947. Il loro racconto, però, non era mai stato trasmesso dalla RAI. E così, più di 30 anni dopo, la nostra auto è tornata dalle gemelle, dopo aver recuperato il filmato negli archivi RAI. Un'intera famiglia può finalmente rivedersi in TV e raccontare la loro storia. Insieme a Isabelle e Antoinette, c'è anche la mamma Rosa di 90 anni, e i figli di Isabelle, Daniele e Roberta. Tre generazioni a confronto! - \n\ndi Giuseppe Giannotti (2011)"
