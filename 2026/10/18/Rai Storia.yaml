  title: Il segno delle donne Titina De Filippo
  subtitle: Titina De Filippo, figlia naturale del commediografo Eduardo Scarpetta, nasce a Napoli nel 1898 e calca il palcoscenico fin da piccola insieme ai suoi fratelli minori Eduardo e Peppino. È un'attrice moderna,
  description: |-
    intensa, naturale, eclettica, a cui piace cimentarsi in ogni genere teatrale, dalla rivista alla sceneggiata fino alla commedia. Nel 1929/1930 al Teatro Nuovo è al fianco di Totò. I due formano una coppia comica straordinaria, ma il grande attore lascia la compagnia prima del termine della stagione teatrale. Titina così propone al suo impresario di rimpiazzare Totò non con uno, ma con tre attori: il trio De Filippo. Titina De Filippo è un'artista a tutto tondo, profonda e curiosa. Si dedicherà anche al cinema, alla drammaturgia, alla poesia e alla pittura, soprattutto negli ultimi anni della sua vita. - Conduce Angela Rafanelli.

    Con Tosca D'Aquino. Regia Michele Imperio
