  title: Die kleinen Wunder von Lourdes - Eine besondere Krankenwallfahrt
  subtitle: Im Heiligen Bezirk
  description: Ein Ausflug ins Gebirge mit den Kranken ist ein besonderes Highlight. Denn am Abend folgt der Malteser-Team-Abend mit Auszeichnungen für jahrelangen Pflegeeinsatz auf dieser Wallfahrt. Spät abends geht es mit Bischof Theising noch mal in den Heiligen Bezirk - zum Segen, zum gemeinsamen Gebet. Peter bleibt länger - er gibt einen Einblick in seine Erfahrung mit Lourdes und Beziehung zur Mutter Gottes.
  widescreen: true
