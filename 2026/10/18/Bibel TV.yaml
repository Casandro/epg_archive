  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Für Marlies ist der regelmäßige Kirchgang schon seit der Kindheit wichtig. In der Gemeinschaft mit anderen, im Singen, Beten und Zuhören und besonders in der heiligen Kommunion stärkt sie ihren Glauben und freut sich, bei Jesus sein zu dürfen. Doch dann kommt die Corona-Pandemie und auf einmal bricht alles weg. Die Gottesdienstübertragungen auf Bibel TV werden für Marlies in dieser besonderen Zeit ein täglicher Strohhalm und auch eine Möglichkeit, mit anderen Menschen in Verbindung zu sein.'
