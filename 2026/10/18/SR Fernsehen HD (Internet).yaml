  description: 'Guido Braun ist Pfarrer mit Leib und Seele - äußerst beliebt, ebenso gottesfürchtig wie geistreich und modernen Entwicklungen gegenüber aufgeschlossen. Seine einzige Schwäche: ein übermäßiges Faible für Kriminalfälle. Damit treibt er Verbrecher in die Arme des Gesetzes und den Bischof in den Wahnsinn. Dieser schickt sein schwarzes Schäfchen schließlich ins norddeutsche Exil auf die kleine Insel Nordersand; eine echte Strafe für den Urbayern! Doch auch hier dauert es nicht lange, bis Pfarrer Braun wieder "rückfällig" wird, denn die reiche Witwe Helene Groenewold stirbt unter mysteriösen Umständen.'
