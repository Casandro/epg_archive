  title: Bayern 2 Hörspiel
  subtitle: '"Die Sklaven der Arbeit (1/2)" von Karl May'
  description: "Große Armut im Erzgebirge. Ehrfürchtig wird \"Der Fürst des Elends\" erwartet, der Rettung bringen soll - wenn es ihn gibt. Real dagegen sind die Bedrohungen des \"Waldkönigs\", hinter dessen Maske sich reiche Kaufleute verbergen, die die Arbeiter bösartig ausbeuten. Der Kampf zwischen Arbeitern und Kaufleuten spitzt sich zu, als die Liebe mit hineinspielt.\nDieser 1885 geschriebene Kolportageroman von Karl May ist autobiographisch geprägt: May stammte selbst aus ärmlichen Verhältnissen und musste wegen wiederholter Eigentumsdelikte mehrere Jahre ins Gefängnis, wo seine ersten schriftstellerischen Arbeiten entstanden. \n\nVon Karl May\nMit Michael Degen, Matthias Ponnier, Angelika Thomas, Grete Wurm, Helmut Stange, Wolfried Lier, Peter Fricke, Karl Maldek, Dieter Wieland, Franz Kutschera, Günter Mack, Wolfgang Büttner, Otto Stern, Michael Robert, Maria Singer, Alexander Malachovsky, Peter Brand, Burkhard Gaffron, Werner Singh und anderen\nKomposition: Peter Zwetkoff \nRegie: Walter Adler, Bernd Lau \nBR 1977\n\nTeil 2 am Sonntag, 25. Oktober 2026, 15.05 Uhr\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
