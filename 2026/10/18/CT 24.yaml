    Skryté titulky
    V říjnu 1946 stanul před Mimořádným lidovým soudem v Praze nacistický zločinec Kurt Daluege. V říjnu 1996 dala Česká národní banka do oběhu dvoutisícovou bankovku. O deset let později přijal prezident Václav Klaus demisi vlády Mirka Topolánka. Události v měsících říjnech roků, končících šestkou, zaznamenaly kamery filmových týdeníků i televizního zpravodajství.
