- eventId: 849489
  start: 2026-10-18T02:05:00Z
  stop: 2026-10-18T03:00:00Z
  title: Téma Plus
  description: Stát se obětí únosu v zahraničí je výjimečná situace. Riziko však roste, pokud cestujete do oblastí, kde k únosům prokazatelně dochází. Vyhnout se takovým místům je rada logická, ne každý se jí ale může nebo chce řídit. Novináři či pozorovatelé OSN do rizikových oblastí míří, aby odtud podali svědectví. Ocitnout se v nich však mohou i turisté, kteří nebezpečí podcení. Jak snížit riziko, že se staneme obětí únosu? A pokud už k němu dojde, co může pomoci takovou situaci přežít? Co máme v podobném případě očekávat od české diplomacie? Dozvíte se ve třetím dílu série Tématu Plus Unesení, uvěznění, zajatí - příběhy Čechů zadržených v zahraničí, který připravila Naďa Reviláková.
