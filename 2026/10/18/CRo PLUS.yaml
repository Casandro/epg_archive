  title: Online Plus
  description: Sprintující dějiny umělé inteligence. Jak probíhá debata o hranicích pro práci autonomních AI agentů? Co ukázaly incidenty z posledních týdnů o bezpečnosti využití samostatně pracujících nástrojů? Je zárukou a dostatečným snížením rizika oddělení autonomních systémů od konkrétních operací? Jak pro ně nastavit pravidla a nastavit bezpečné využívání? Moderuje David Slížek.
- eventId: 849536
  start: 2026-10-18T05:33:00Z
  stop: 2026-10-18T06:00:00Z
  title: Stopy, fakta, tajemství...
  description: Hned sedm Oscarů získal v roce 1985 film režiséra Sidney Pollacka Vzpomínky na Afriku. Snímek s Meryl Streepovou a Robertem Redfordem. Je považovaný za jednu z největších filmových romancí dvacátého století. Příběh velké lásky a velkého žalu majitelky farmy v Africe Karen Blixenové má reálný základ. Kdo ale vlastně tato žena opravdu byla? Na to odpoví další díl cyklu Stopy, fakta, tajemství a Stanislav Motl.
