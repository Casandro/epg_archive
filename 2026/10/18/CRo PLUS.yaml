  description: Indové žádají hlavu předsedy volební komise Gjánéše Kumára. Opozice a lidé protestující v ulicích ho obviňují, že milionům lidí upřel právo hlasovat ve volbách a navíc, že tím pomáhal současné vládě vedené Indickou lidovou stranou (BJP) premiéra Naréndry Módího. Při potlačování protestů skončily v celách tisíce lidí, včetně předních představitelů politické opozice. V centru sporu je plošná revize volebních seznamů, ze kterých Kumárova volební komise vyškrtala ohromujících 130 milionů jmen - údajných duplicit a lidí, kteří zemřeli nebo se odstěhovali. Jenže postupně vychází najevo stále víc nesrovnalostí.
