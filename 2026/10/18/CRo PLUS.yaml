- eventId: 849529
  start: 2026-10-18T03:05:00Z
  stop: 2026-10-18T03:30:00Z
  title: Nic osobního. Prostě byznys
  description: Český průmysl odhalil svou výkladní skříň v minulých dnech v Praze na Designbloku a v Brně na strojírenském veletrhu.Téma pro hlavní ekonomickou analytičku Českého rozhlasu Janu Klímovou a publicistu Petra Šimůnka. Ti se pozastaví i nad tím, že čeští miliardáři investují v Polsku a že premiér Andrej Babiš z hnutí ANO chce rozšířit těžbu plynu a ropy v Evropě.
- eventId: 849530
  start: 2026-10-18T03:30:00Z
  stop: 2026-10-18T04:00:00Z
  title: Zaostřeno
  description: Maďarsko má půl roku po přelomových volbách. Premiér Peter Magyar sliboval po dlouholeté vládě straně Fidesz velkou změnu a demokratizaci země. Jak svoje sliby mění v činy? Nepostupuje obdobně, jako jeho předchůdce Viktor Orbán, jehož praktiky kritizoval? S občany Maďarska, ale i odborníky na právo a politologii natáčel Ladislav Novák.
- eventId: 849531
