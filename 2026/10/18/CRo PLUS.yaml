  title: Vertikála
  description: Trest smrti - téma diskutované napříč státy, politiky, ale také mezi církevními představiteli. Jak lidské uvažování ovlivňuje touha po pomstě? Existuje něco, co může pozůstalým po obětech přinést hlubokou vnitřní úlevu? Jak se dá vysvětlit, že pomsta to není? Hosty ve studiu jsou Gabriela Kabátová, výkonná ředitelka ve společnosti Mezinárodní vězeňské společenství a evangelický kazatel Joel Ruml, dobrovolník vězeňské duchovenské péče. Moderuje Eva Hůlková.
