  description: V nedávných komunálních volbách volili Češi své zastupitele ve více než šesti tisících obcí - podle řady odborníků jich je příliš a měly by se rušit či spojovat do větších celků. "Slučování obcí je nesmysl. Nejsem si jistý, že bychom tím něco ušetřili, spíš by se náklady přesunuly jinam," namítá Jan Jiskra, dosavadní starosta obce Starkoč, který ale tentokrát už nekandidoval.
