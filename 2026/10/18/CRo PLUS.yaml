  description: 'Dnešní pořad je věnován osudům Mariky Arban, která pochází ze slovenské rodiny přeživších holocaustu a dnes žije v Torontu. Její osud je pozoruhodný mimo jiné tím, že do Kanady emigrovala z komunistického Československa hned dvakrát: v roce 1968 a v roce 1982. Příběhy, které připravil Adam Drda, jsou tentokrát dvoudílné - teď uslyšíte druhou část.'
