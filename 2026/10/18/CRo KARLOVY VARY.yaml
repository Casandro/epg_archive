- eventId: 849647
  start: 2026-10-18T01:00:00Z
  stop: 2026-10-18T02:00:00Z
  title: Pochoutkový rok
  description: Dnes vás čeká další podzimní posvícenské pečení s Vojtou Vrtiškou. Budeme tentokrát péct kynutý pletenec s čokoládou a kaštany zvaný babka. Taky vám připomeneme, že byste se měli zapojit do hlasování pro nejlepší recept desetiletí naší soutěže domácích receptů.
- eventId: 849648
  start: 2026-10-18T02:00:00Z
  stop: 2026-10-18T02:30:00Z
  title: Utajené poklady regionů
  description: Masopustní tradice - barevné průvody masek, staré rituály a obchůzky, které měly zajistit úrodu a plodnost. Na Hlinecku se masopustní tradice zachovaly v jedinečné autentické podobě a jsou součástí UNESCO. Jak se slaví masopust na Hlinecku a na Slovácku? Vypravila se tam Markéta Ševčíková.
