  title: Die Gier nach Gold
  subtitle: Gefährliche Jagd
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2022
    Gier nach Gold - das ist der Kern vieler Märchen, Mythen und Sagen. Das glänzende Metall steht für Schönheit, Reichtum und Macht. Und stets behält es seinen Glanz.

    Getrieben vom Traum nach schnellem Reichtum, schürfen Abenteurer seit jeher selbst nach winzigen Goldkrümeln. So betörend seine Schönheit, so zerstörerisch ist die Jagd nach dem Edelmetall. Die Dokumentation zeigt, warum Gold bis heute die Menschen fasziniert.
    HD-Produktion
