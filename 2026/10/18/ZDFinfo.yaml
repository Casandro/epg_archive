    Giftig, flüchtig oder explosiv: Wissenschaftler experimentieren mit Substanzen und nehmen dabei tödliche Gefahren in Kauf. Von ihren bahnbrechenden Erfindungen profitieren wir bis heute.

    Die Chemie bestimmt die fundamentalen Bausteine der Welt. Carl Wilhelm Scheele, Rosalind Franklin und Alice Ball stellen die Theorien infrage. Sie prägen die Wissenschaft - ohne dafür Anerkennung zu erhalten. Denn die Früchte ihrer Arbeit ernten zunächst andere.
