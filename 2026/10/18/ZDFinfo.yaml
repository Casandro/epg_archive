    Im 19. Jahrhundert entdeckt Ignaz Semmelweis die lebensrettende Wirkung der Desinfektion und stirbt unter ungeklärten Umständen. Der Medizinstudent Daniel Carrión jagt einer tödlichen Infektionskrankheit nach, Erfinder Sieur Fréminet geht auf tödlichen Tauchgang.
