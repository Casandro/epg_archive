  description: |-
    Bergwelten: Zwei Bergführer-Kandidaten meistern die letzten Prüfungen, bevor sie das Bergführer-Diplom in den Händen halten dürfen. Ihr Berufsalltag bringt ihnen angenehme ebenso wie lebensgefährliche Erlebnisse.
    Die zweiteilige ServusTV-Dokumentation TRAUMBERUF BERGFÜHRER zeichnet ein umfangreiches Bild der österreichischen Bergführer-Ausbildung. In der zweiten Folge schließen zwei Bergführer-Anwärter ihre Ausbildung ab, wobei sie schwierige Prüfungssituationen meistern müssen. Ihr Berufsalltag erweist sich tatsächlich als Traumberuf - auch wenn einer von ihnen nur knapp eine lebensgefährliche Situation übersteht. AT 2020
- eventId: 814559
  start: 2026-10-18T08:35:00Z
  stop: 2026-10-18T09:22:00Z
  title: Bergwelten - Die Nordkette - von der Stadt ins Gebirge
  subtitle: Bergwelten - Die Nordkette - von der Stadt ins Gebirge
  description: |-
    Bergwelten: Die Bühne der Träume liegt für Innsbrucker Wintersportler direkt vor ihrer Haustür: Die Nordkette. Mitten aus der Stadt gelangt man mit der Nordkettenbahn innerhalb von nur 20 Minuten in hochalpines Gelände und ermöglicht so einen "alpinurbanen Lifestyle", welcher weltweit einzigartig ist.
    Es gibt wohl keinen Innsbrucker, dessen erster Blick frühmorgens nicht der Nordkette gelten würde. Wenn die Morgensonne die Hafelekarspitze in ein zartes Orange färbt und die mächtige Gebirgskette kurz darauf in einem unwiderstehlichem Weiß über der Stadt zu leuchten beginnt, breitet sich auf dem Gesicht des typischen Innsbrucker Wintersportlers ein Lächeln aus. Im Hochwinter bei Neuschnee ein Freeride Eldorado, das Tor zum Naturpark Karwendel für ausgedehnte und spektakuläre Skitouren, im Frühjahr ein kreativer Slope Style Park für Ski und Snowboard Freestyler, ein 360 Grad Bergpanorama für Touristen aus aller Welt, ein mit Südwinden verwöhnte Rampe für spektakuläre Flüge von Speedridern, sommerlich letzte Schneereste zum Figln, die Nordkette bietet für jeden etwas. Städtische "hippe" Alpenmetropole und wilde Natur, von urbanen 589 auf hochalpine 2334 Höhenmeter in nur wenigen Minuten. AT 2021
