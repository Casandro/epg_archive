  title: Wild Ones - Junge Helden - Episode 7
  subtitle: Wild Ones - Junge Helden - Episode 7
  description: 'Kitesurferin Susi Mai ist nach Monaten des Unterwegsseins zurück nach Hause gekehrt. In ihrer Heimat Cabarete an der Nordküste der Dominikanischen Republik kitet sie an einem der schönsten Spots der Welt. Ken Roczen hat immer noch Besuch von seinem besten Kumpel Tim Koch. Gemeinsam mit Vater Heiko und Hund Rocky unternehmen die Drei einen Ausflug zu den Universal Studios in Los Angeles. Freerunner Jason Paul und seine Kumpels von Team Farang drehen ein Freerun-Video in Bangkok. Wakeboarder Dominik Gührs hat vor dem Finale der Wakeboard-WM auf den Philippinen noch mal einen Tag Zeit zum Ausspannen. Mit einem Tuk Tuk erkunden er und sein Teamkollege Freddy von Osten die Vergnügungsmeile Angeles City. Und Bene fliegt nach Colorado: er trainiert für seinen ersten Weltcup nach zwei Jahren Verletzungspause. DE 2013'
- eventId: 814546
  start: 2026-10-18T04:40:00Z
  stop: 2026-10-18T05:10:00Z
  title: Wild Ones - Junge Helden - Episode 8
  subtitle: Wild Ones - Junge Helden - Episode 8
  description: Freerunner Jason Paul und seine Kollegen von Team Farang schneiden in Bangkok ihr neues Freerun-Video. Für Motocross-Star Ken Roczen startet in Kalifornien in drei Wochen die neue Supercross-Saison. Letztes Jahr wurde er nur Dritter in der Gesamtwertung. In dieser Saison hat er den Sieg fest im Blick. Heute steht der Test eines neuen Motors auf dem Plan. Susi Mai hat ein paar Tage Heimaturlaub und zeigt uns ihr Zuhause in der Karibik. Ihr Vater stellt eigene Kiteboards her, auf denen Susi das Kitesurfen vor 10 Jahren gelernt hat. Für Freeskier Bene Mayr wird es ernst. Sechs Wochen lang hat er in Colorado hart trainiert und heute startet er bei seinem ersten Weltcup seit zwei Jahren. Bene muss sich gegen 130 andere Fahrer durchsetzen. Aber ausgerechnet jetzt ist er krank. Auch auf den Philippinen wächst die Anspannung. Dominik Gührs und Freddy von Osten sind die Top-Favoriten auf den WM-Titel. Doch der erste Run läuft anders als geplant. Wer wird Wakeboard-Weltmeister? DE 2013
- eventId: 814547
  start: 2026-10-18T05:15:00Z
  stop: 2026-10-18T06:02:00Z
  title: Bergwelten - Das Tote Gebirge - Abenteuer im Karst
  subtitle: Bergwelten - Das Tote Gebirge - Abenteuer im Karst
  description: 'Bergwelten: Das "Tote Gebirge" liegt in der nördlichen Steiermark und dem südlichen Oberösterreich und ist mit einer Fläche von über 1000 Quadratkilometern das größte Karstgebiet Europas. Es besticht durch seine Weitläufigkeit und Kargheit und durch die Abgeschiedenheit, die sich dort finden lässt. Aber "tot" ist es auf keinen Fall. Denn für Bergbegeisterte hat diese Landschaft eine Menge zu bieten. Das "Tote Gebirge" liegt in der nördlichen Steiermark und dem südlichen Oberösterreich und ist mit einer Fläche von über 1000 Quadratkilometern der größte Plateaustock der Alpen und das größte Karstgebiet Europas. Es besticht durch seine Weitläufigkeit, seine bizarre Mondlandschaft und durch die Einsamkeit und Stille, die sich dort finden lässt. Aber "tot" ist es auf keinen Fall. Denn für Bergbegeisterte hat diese Landschaft eine Menge zu bieten. Wir entdecken und erleben das Tote Gebirge bei der Besteigung seines höchsten Gipfels, des Großen Priel, bei spannenden Touren in die Karstlandschaft und in die geheimnisvolle Höhlenwelt, bei einer Ski-Durchquerung im Winter, mit den Augen eines Profi-Fotografen und bei der Begehung einer schweren Kletterroute an der Spitzmauer. Das Tote Gebirge wirklich zu verstehen, fordert lange Wege, genaues Hinschauen, sich einlassen - aber dann ist die Faszination für diese besondere Berglandschaft umso größer. AT 2021'
- eventId: 814556
  start: 2026-10-18T06:05:00Z
  stop: 2026-10-18T06:52:00Z
  title: Bergwelten - Die Karawanken - Eine Überschreitung in Eis und Schnee
  subtitle: Bergwelten - Die Karawanken - Eine Überschreitung in Eis und Schnee
  description: 'Bergwelten: Eine 100 km lange Ost -West Skiüberschreitung des Grenzgebirges Karawanken, von der Koschuta bis zum Mittagskogel. Die vier Kärntner Skibergsteiger Gerald und Dominik Sagmeister, Andrej Olip und Michael Mautz wagen das Abenteuer einer 100 km langen Ost-West Überschreitung der Karawanken. Das südlichste Gebirge Österreichs ist geprägt durch senkrecht abfallende Nordhänge und steile Südhänge, welche beide völlig unterschiedliche Schneebedingungen bieten. Wind, Sonne, Niederschlag und Temperaturen verändern eine völlig naturbelassene Winterlandschaft in ein Abenteuer mit ungewissem Ausgang. Die Tour fordert den Skibergsteigern über sieben Tage mit Wetterkapriolen und extremen Minustemperaturen, sowie einer permanenten Lawinengefahr auf der Südseite alles ab. Die absolute Härteprobe wird Ihnen auf der Nordseite der Karawanken gestellt. Nach kräfteraubendem Aufstieg über die Ostschlucht und einer riskanten überwächteten Gratüberquerung der Breitwand wartet in der Koschuta Nordwand eine 55 Grad steile Abfahrt durch die 300 Meter lange Pik Schlucht. Ein Sturz hat in dieser extrem schmalen und zum Teil vereisten Rinne fatale Konsequenzen. AT 2021'
- eventId: 814557
  start: 2026-10-18T06:55:00Z
  stop: 2026-10-18T07:42:00Z
