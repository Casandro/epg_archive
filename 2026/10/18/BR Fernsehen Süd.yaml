  description: "Die Kreut-Alm liegt malerisch auf einem Höhenrücken über dem Kochelsee und dem Kochler Moos. Hier, vom Fuße des Heimgartens und Herzogstands aus, blickt man auf die Berge des oberbayerischen Voralpenlandes und auf das schöne Loisachtal. Auf der Kreut-Alm treffen sich gerne Musik- und Gesangsgruppen aus der näheren und weiteren Umgebung. \nMit dabei sind bei diesem \"Musikantentreffen\", das mit dieser Folge sein 20-jähriges Jubiläum feiern darf, sind die Wildenauer Blos, das Gitarrenduo Pössinger, die Oberboarische Soatnmusi, die Sunnseitn Tanzlmusi, die Tanzgrobn Ziachmusi, die Bolzwanger Geigenmusi und der Werdenfelser Dreigsang."
