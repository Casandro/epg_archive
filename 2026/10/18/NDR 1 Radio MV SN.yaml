  title: NDR 1 Radio MV - Kunstkaten
  subtitle: Künstler aus MV in Aktion und im Gespräch
  description: Der Kunstkaten ist Treffpunkt für Künstler in Aktion und im Gespräch. Hier ist der Platz für das NDR Literaturcafé und seine Gäste. Im Kunstkaten wird nachgedacht über Bildung und Wissenschaft, hier wird Geschichte nacherzählt und Zeitzeugen befragt. Im Kunstkaten sind Mecklenburg-Vorpommerns Musikfestivals nachzuerleben, sind die Veränderungen in der Theaterlandschaft im Nordosten Thema oder es werden Bücher und CDs zum Lesen und Hören empfohlen.
- eventId: 1228542
  start: 2026-10-18T18:00:00Z
  stop: 2026-10-18T19:00:00Z
  title: NDR 1 Radio MV - Dat Beste ut de Plappermoehl / Hürspäl
  subtitle: Lütt Stunn' Lüdsnack, Musik un süst noch wat
  description: Die "Plappermoehl" ist die älteste plattdeutsche Radiosendung im Nordosten. Angefangen hat alles in Dabel, als 1983 die erste "Plappermoehl" auf dem Kornboden der alten Holländerwindmühle aufgezeichnet wurde. Mittlerweile ist die Sendung unterwegs in ganz Mecklenburg-Vorpommern und meldet sich regelmäßig aus einem anderen Ort des Landes mit "ne lütt Stunn Lüdsnack, Musik un süst noch wat". Mit Humor und guter Laune moderieren Susanne Bliemel und Thomas Lenz ihren Klönsnack mit interessanten Gästen.
