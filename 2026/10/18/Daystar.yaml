  description: Religious programming hosted by Dr Charles Stanley, the founder of In Touch Ministries; an American Christian ministry. Dr Stanley incorporates his belief in evangelical and dispensationalist theology into the teachings that he shares with his audience. His sermons are often based on his interpretation of the bible. He also explains how biblical principles can be applied to real-life situations. Dr Stanley is the senior pastor of First Baptist Church in Atlanta, Georgia, the former president of the Southern Baptist Convention. He has been broadcasting spiritual messages on television since 1972 and his words have reached millions of people all over the world. As well as TV, "In Touch with Dr Charles Stanley" can be heard internationally on radio, the internet and podcasts. The show is broadcast in more than 50 languages. (1997)
