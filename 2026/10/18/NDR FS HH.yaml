  title: Lucienne Renaudin Vary und die Trompete
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Deutschland 2025
  description: '"Ein Tag ohne Trompete ist wie ein Tag ohne Gefühle", sagt die französische Trompeterin Lucienne Renaudin Vary. Bereits als Kind verliebte sie sich in den Klang ihres Instruments - heute gehört sie zur internationalen Spitze. Das NDR/ARTE-Konzertporträt "Lucienne Renaudin Vary und die Trompete" zeigt sie bei einem mitreißenden Auftritt in der Hamburger Hauptkirche St. Michaelis, wo sie unter anderem Werke von Antonio Vivaldi, Alessandro Marcello und Astor Piazzolla mit technischer Brillanz und klanglichem Feingefühl interpretiert.'
