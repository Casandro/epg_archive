  description: Till Brönner gehört definitiv zu den deutschen Musikern, die internationale Bekanntheit und Beachtung erlangt haben. Hierzulande ist er ohnehin ein Star, auch jenseits der Jazzszene. Sein Name steht als Garant für exquisites Trompetenspiel, gepaart mit charismatischer Bühnenpräsenz. Mit der hr-Bigband gibt er bekannten italienischen Melodien ein neues Gesicht. Aufzeichung vom 23. Januar 2024 in der Alten Oper Frankfurt.
