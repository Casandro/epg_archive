  description: 'Im Nordwesten Frankreichs, wo Bretagne und Normandie aufeinandertreffen, erhebt sich ein weltberühmtes Wahrzeichen: die Abtei Mont-Saint-Michel. Das imposante Kloster auf dem Berg mitten im Watt gehört zu den meistbesuchten Sehenswürdigkeiten Europas. Doch nicht nur Touristen fühlen sich angezogen. Die Bucht bietet eine Vielzahl an Lebensräumen und beherbergt eine vielfältige Tierwelt. Hier bestimmt der Takt der Gezeiten das Leben mit dem höchsten Tidenhub Europas von bis zu 14 Metern.'
