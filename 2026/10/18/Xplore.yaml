  description: 'Die Alpen von oben: Vom Isartal ins Inntal - Hundeschlittenführer Martin Eigentler, Chef von 24 Huskies, trainiert im Sommer mit einem Rollschlitten. In den Tuxer Alpen werden Sherpas aus dem Himalaya als Hüttenwirte ausgebildet, und im Schiefer des Karwendelgebirges bohren Hermann Albrecht und Sohn Bernhard nach kostbarem Steinöl. In Innsbruck stellt die Gießerei Grassmayr seit 1599 Glocken her.   DE 2012'
