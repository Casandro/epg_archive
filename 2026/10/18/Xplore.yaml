  title: Wanderlust! - Durch Kretas Schluchten, Griechenland
  subtitle: Wanderlust! - Durch Kretas Schluchten, Griechenland
  description: 'Ein Geheimtipp in der Wanderszene ist der E4 auf Kreta. Der Fernwanderweg quert die größte Insel Griechenlands von West nach Ost. Am schönsten im Südwesten, wo das Bergmassiv der "Levka Ori" 2.500 Meter hoch aufragt und steil ins Meer stürzt. Bradley Mayhew ist mit der kretischen Wanderführerin Penelope unterwegs. Denn der "Europäische Fernwanderweg Nr. 4" ist auf Kreta nicht überall gut markiert. Bradley hat sich 230 Kilometer vorgenommen. Der Pfad beginnt auf den Höhen der Westküste. Weit reicht der Blick aufs tiefblaue Meer, bevor Bradley und Penelope absteigen und im Kloster Chrissoskalitissa vorbeischauen. Zwei Stunden später sieht es aus wie in der Karibik. Türkis leuchtet das Meer in der Lagune Elafonissi. Die beiden hängen die Bergschuhe übern Rucksack und wandern knietief durchs Wasser. Dann ist die Südküste erreicht. So steil fallen die Bergflanken ins Meer, dass für Straßen kein Platz ist. Nur per Schiff oder wandernd kommt man voran. Charakteristisch für Kreta sind die tief eingeschnittenen Schluchten, die Berge und Küste verbinden. Penelope führt Bradley die Samaria-Schlucht hoch, 1.200 Meter Anstieg auf 18 Kilometer Länge. Abends in den Bergen werden die Wanderer zu Lamm und Rotwein eingeladen und lauschen den Rizitika-Gesängen der Männer. Bradley muss alleine weiter. Er steigt auf zur Berghütte Kallergie, und quert in zwei Tagen die Levka Ori, die Weißen Berge. Beim Dorf Aradena trifft er Marianna, die ihn durch den Canyon von Aradena begleitet. Die Schlucht wurde von Rebellen als Versteck genutzt. Sfakia heißt die Region. Die vielen Eroberer Kretas, Byzantiner, Sarazenen, Osmanen haben sie nie völlig kontrolliert. Das Schöne an Kretas Schluchten: sie führen direkt zum Meer. So endet der Tag für Bradley an der klitzekleinen Marmara-Bucht, mit bestem Essen und einem Sprung ins Meer. Genusswandern! In Bradleys Hitliste der schönsten Wanderwege Europas steht Kreta ganz weit oben. DE 2014'
