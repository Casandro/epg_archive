  description: 'Die Alpen von oben: Vom Königssee ins Isartal - Am Untersberg bei Berchtesgaden trainiert die mehrfache Weltmeisterin im Eisklettern, Ines Papert. In den Stollen eines Bergwerks wird seit 500 Jahren Salz abgebaut wird. Am wilden Oberlauf der Isar geht Andreas Pfirstinger seiner Passion nach: dem Fliegenfischen. DE 2012'
