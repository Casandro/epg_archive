  title: Die Alpen von oben - Von Graz ins Ausseerland
  subtitle: Die Alpen von oben - Von Graz ins Ausseerland
  description: 'Die Alpen von oben: Von Graz nach Ausseerland - Dachdeckermeisterin Barbara Rockenbauer hält die historischen Dächer von Graz in Schuss.. Mit seinem Flugzeug fliegt der Hagelbomber Walter Golob direkt in Gewitterwolken und versprüht Silberjodid. So schützt er die Ernte der steirischen Obst- und Weinbauern. Auf den Almen von Schloss Piber verbringen die Lipizzaner der Wiener Hofreitschule ihre Jugendjahre. Canyoning-Sportler durchwandern hier die tiefen Schluchten des Salzkammerguts, seilen sich an Wasserfällen ab und durchtauchen Gebirgsseen.  DE 2012'
