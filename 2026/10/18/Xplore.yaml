  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Das Ovamboland - Hier lebt Namibia!'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Das Ovamboland - Hier lebt Namibia!'
  description: 'Es geht durchs Ovamboland mit den Regionen Ohangwena, Omusati, Oshana und Oshikoto (Four-O genannt) und den Hauptstädten Otawi, Ondangwa und Oshakati. Das Ovamboland ist so ziemlich das Gegenteil der Kunene-Region: sehr viel Zivilisation, sehr wenige Touristen. Eine Ortschaft reiht sich an die nächste, viel Viehzucht, Fischfarmen, Bewässerungskanäle. Aber ein Gebiet, dass in keinem Reiseführer besprochen wird. Wir finden es total spannend, auch wenn Oshakati eigentlich nur Zwischenstopp auf unserem Transit Richtung Osten ist. Wir starten etwas zu spät von Oshakati aus in den Tag. Das Bett ist zu gemütlich, das WLAN zu gut und so erledigen wir noch dies und das, was auf der To-do-Liste steht. Dieses zu späte Loskommen rächt sich am frühen Abend an der nächsten Campsite der Hakusembe River Lodge, wo wir nach 6 Stunden Fahrt ankommen. Leider schaffen wir es hier nicht Sonnenuntergangsstimmung und Essenszubereitung zeitlich gut aufeinander abzustimmen. Mehr Zeit hier wäre schön gewesen, ist die Lage direkt am Okavango doch schön, aber zumindest nicht atemberaubend. Auf der Fahrt dazwischen gibt es einerseits wenig zu sehen, andererseits doch Neuerungen wie einige Polizeikontrollen, viel Landwirtschaft und viel, viel Grün! So viele Bäume und Büsche in sattem Grün haben wir noch nirgends in Namibia gesehen, und wir hoffen dies ist nur ein Vorbote auf die nächsten Tage. Dennoch sind wir froh, dass die beiden Fahrtage von Nordwesten in den Nordosten nun geschafft sind. NA 2023'
- eventId: 814672
  start: 2026-10-18T18:30:00Z
  stop: 2026-10-18T18:46:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Am Okavango'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Am Okavango'
  description: Im Laufe des Tages lernen wir den Okavango auf ganz unterschiedliche Arten kennen. So könnte er auf den ersten Kilometern von Breite, Flusslauf und umgebender Landschaft auch gut ein x-beliebiger deutscher Fluss sein, wird der Bewuchs im Lauf der nächsten 200km immer wilder. Zwischenzeitlich sagt Nico dennoch, dass es aussieht wie am Altrhein. Spätestens die Hippos am Ortsausgang von Divundu beweisen das Gegenteil. Zuvor ging es noch in Rundu einkaufen, wir benötigen mehrere Supermärkte und sind diesmal etwas überfordert mit dem dortigen Stadtleben. Kurz hinter Divundu verlassen wir wieder den Asphalt zur Ndhovu ("Elefant") -Lodge. Eigentlich wollten wir noch einen Game Drive machen, sind aber ziemlich geschafft und schließen uns daher einer Bootstour an. Dann ist das Bild des deutschen Flusses ganz passé. Krokodile, Hippos, Elefanten, viele Vogelarten bevölkern das Wasser. Mit einem Sundowner und netten Gesprächen geht die Tour zu Ende und leitet in ein Lagerfeuer auf der Lodgeterasse über. Die Bootstour können wir auf alle Fälle empfehlen! NA 2023
- eventId: 814681
  start: 2026-10-18T18:50:00Z
  stop: 2026-10-18T19:05:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Endlich Nilpferde im Bwabwata Nationalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Endlich Nilpferde im Bwabwata Nationalpark'
  description: Gemeinsam mit den beiden Reisenden, die wir auf der Bootstour gestern kennenlernten geht es am Morgen auf den Selbstfahrer Game Drive in die Mahango Core Area, nur wenige Kilometer nördlich unseres Camps. Die gut befahrbare Strecke wird dann besonders schön, wenn sich die Büsche zum Okavango hin öffnen und den Blick auf die am Ufer befindlichen Tiere freigeben. Ein zweiter Loop in Richtung Savanne ist wegen Tiefsandabschnitten leider nur teilweise befahrbar, gerne hätten wir dort fahren geübt. Dennoch ein schöner Ausflug mit einigen Elefanten, Antilopen, Krokodilen. Nach einer kurzen Pause am Camp geht es auch schon weiter. Erstmals nehmen wir an einem geführten Game Drive in einem Safari-Auto Teil. Einfach um die Erfahrung mal gemacht zu haben und vielleicht auch etwas für unsere eigenen Pirschfahrten zu lernen. Es geht auf die andere Flussseite in die Buffalo Core Area. Wir sehen neben den namensgebenden Büffeln viele Elefanten, Hippos, Krokodile und vier Löwen, die wir niemals gesehen hätten, wenn wir selbst gefahren wären. Ein Wermutstropfen ist, dass Silvester bei der Sichtung der Löwen ohne Rücksicht auf Verluste die vorgegebene Piste verlässt und mit dem Fahrzeug und uns sechs Gästen durchs "Unterholz" möglichst nah an die Löwen heranfährt. Durchs Fernglas hätte auch gereicht und wäre tierfreundlicher gewesen. Einige Zeit nach Einbruch der Dunkelheit kommen wir wieder zurück an die Campsite. Es war unsere erste und wohl auch letzte geführte Safari, an sich schön, aber auch sehr sehr teuer, dafür dass wir eigentlich ein Fahrzeug dabei haben, was genau dafür gemacht ist. NA 2023
- eventId: 814682
  start: 2026-10-18T19:05:00Z
  stop: 2026-10-18T19:25:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  description: 'Der TV-Schauspieler Michael Roll macht sich auf in den US-Sonnenstaat Florida. Dort erkundet er zwei benachbarte Regionen: Die Stadt Tampa und Anna Maria Island. In der Metropole an der Golfküste startet er am Morgen nach der Ankunft zu einer Tour auf einem Wasserfahrrad. Die historische Straßenbahn bringt ihn schließlich in das alte  Einwandererviertel Ybor City, wo er in einer Manufaktur lernt, wie Zigarren gedreht werden. Anschließend folgt ein Besuch der ,Busch Gardens''. Der Freizeitpark ist weltweit das "El Dorado" für Achterbahn-Freaks. Auch eine Visite in einem Hospital für verletzte ,Manatees'' lässt sich der Schauspieler nicht entgehen. Von Tampa aus reist Michael Roll auf die vorgelagerte Insel Anna Maria Island im Golf von Mexiko. Diese ist wegen ihrer Architektur im traditionellen karibischen Stil und ihrer vielfältigen Tier- und Pflanzenwelt gerade unter Deutschen noch immer ein Geheimtipp. Neben einem ausgiebigen Inselstreifzug stehen eine Kanutour sowie ein Bootsausflug auf dem Programm des Schauspielers. Dabei macht sich Michael Roll auf die Suche nach einem versunkenen Frachter und erforscht schnorchelnd die bunte Unterwasserwelt. Im Gespräch mit Fischern  erfährt der Schauspieler, wie entspannt es auf Anna Maria Island zugeht. Wenn da nur nicht immer diese Delfine wären, die den Anglern bisweilen ihren Fang streitig machen. DE 2015'
- eventId: 814692
  start: 2026-10-18T19:30:00Z
  stop: 2026-10-18T19:49:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  description: Schauspieler und Tatort-Kommissar Richy Müller hat sich für diese Sendung die australische Ostküste als Ziel gesetzt. In Queensland begibt er sich in einem Wohnmobil auf eine Reise entlang der Nature Coast. Eine Art der Fortbewegung, wie sie viele Deutsche in Australien schätzen, insbesondere  auf den Straßen im Süden des australischen Bundesstaates Queensland. Der Trip führt ihn zunächst durch das Hinterland der Sunshine Coast, den Glasshouse Mountains. In Noosa steht dann eine Bootsfahrt auf dem Programm. Im nördlichen Teil der Nature Coast, der Fraser Coast, geht es zunächst per Flugzeug auf die kleine Insel Lady Elliott Island. Beim Tauchen möchte Richy den Meeresschildkröten nahe kommen. Und wie geplant erkundet er per Geländewagen Fraser Island, die größte Sandinsel der Welt, mit ihrer faszinierenden Natur. DE 2014
- eventId: 814693
  start: 2026-10-18T19:55:00Z
  stop: 2026-10-18T20:25:00Z
  title: Foodwise - Xilingol
  subtitle: Foodwise - Xilingol
  description: In Xilin Gol ist die lokale Küche für Touristen sehr attraktiv. Gebratenes Lamm ist beispielsweise ein traditionelles lokales Gericht. Und gebratenes Lamm ist außerhalb der Inneren Mongolei schwer zu finden. Nehmen Sie einfach an dieser visuellen Reise teil! CN 2023
- eventId: 814694
  start: 2026-10-18T20:30:00Z
  stop: 2026-10-18T20:59:00Z
  title: Foodwise - Kunming
  subtitle: Foodwise - Kunming
  description: Treffen Sie Gastgeber Tianran He in Kunming, der Hauptstadt der Provinz Yunnan im Südwesten Chinas. Kunming, wegen seines stets guten Wetters auch als "Stadt des Frühlings" bezeichnet, ist eine der ethnisch vielfältigsten Städte Chinas, was sich auch in der Küche widerspiegelt. CN 2023
- eventId: 814705
  start: 2026-10-18T21:00:00Z
  stop: 2026-10-18T21:16:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Endlich Nilpferde im Bwabwata Nationalpark'
