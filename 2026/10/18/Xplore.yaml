  title: Eat. Sleep. Surf. - Folge 3
  subtitle: Eat. Sleep. Surf. - Folge 3
  description: In dieser Episode beginnen Rian und Dylan, den Rhythmus Taiwans zu finden. Nach zwei Tagen Klettern zum Wuling-Pass erreichen sie schließlich den Gipfel auf 3275m. Die Jungs fahren dann zurück an die Küste, um nach Wellen zu suchen - und sie finden großartige Wellen. Sie überqueren den Wendekreis des Krebses und surfen perfekte A-Frame Flussmündungswellen sowie eine 200m lange linke Welle, die an ihrem besten Tag wie Noosa in Australien wäre. Genau darum geht es bei dieser Reise - Wellen mit dem Fahrrad zu finden, zusammen mit deinen Kumpels. AU 2015
