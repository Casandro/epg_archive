  description: Klára Nováková, dabérka, knižní influencerka, cestovatelka a kolegyně z Radia Wave, vypráví o svých dálkových trasách. Kdysi jí šikana během tělocviku úplně znechutila sport a pohyb, dnes běhá půlmaratony a chodí trasy jako je Svatojakubská cesta do Santiaga de Compostela, West Highland Way anebo Tour de Mont Blanc. Co jí dálkové trasy dávají? Poslechněte si Klářino vyprávění v rozhovoru s Pavlem Sladkým v nové epizodě cestovatelského podcastu Radia Wave.
