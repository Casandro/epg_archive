  title: Hergot!
  description: Jak je to s paganismem na Slovensku? O konverzích k novopohanství u našich sousedů se budeme bavit s religionistou Michalem Puchovským. Díl pro všechny, kdo zatím jen tuší, kdo jsou karpatští pecúchovia a Žiarislav, v čem spočívá ideologie "vedomectva" nebo jak velký je ruský vliv u příznivců rodnověří.
- eventId: 850559
  start: 2026-10-18T17:00:00Z
  stop: 2026-10-18T18:00:00Z
  title: Čelisti
  description: Čelisti se tentokrát zaměří na vzdělávání. Jak se Alešovi, Vítkovi a Martinovi pozdávalo Mungiovo pokračování Troškovy komediální série Fjord, seno a pár facek? Schvalují výchovné metody matky hlavní hrdinky seriálu Carrie? Stali by se pilnými žáky "školy přežití", kterou si v Divočině otevřela Klára Issová? A patří Minotaur do světa Zvířat, nebo do světa lidí, případně je odmocninou / protlačeninou skutečného světa? Dědeček / Trenér / Výrazný strýc / Vdovec / Kuna. (repríza)
- eventId: 850709
