  description: Tentokrát nabídneme rozhovor s novinářem a šéfredaktorem Respektu Erikem Taberym. Ten přišel zavzpomínat na vyrůstání v prostředí umělecké rodiny a na své novinářské začátky. Zároveň přiznal, že patří ke generaci mužů, která moc neumí sdílet svoje pocity. Podařilo se Kryštofovi Erika otevřít? Poslouchejte v neděli ve 20:00. (repríza)
