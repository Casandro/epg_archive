  title: Gdzie tu coś zjeść? 1 (odc. 8)
  description: |-
    Tytuł oryginalny: Gdzie tu coś zjeść?
    PL, 2026
    Agnieszka i Ewa w wielkiej trasie po Polsce sprawdzają lokale polecane przez mieszkańców, w internecie ale też sprawdzają miejsca "w ciemno". W odcinku z Kórnika bliźniaczki przeżyją pianie koguta o 12.00, spróbują rybki, sprawdzą czy w Białej Damie starszy, zachwycą się prawdziwą azjatycką kuchnią oraz wywołają awanturę stulecia, która zakończy się potężną interwencją na planie!
