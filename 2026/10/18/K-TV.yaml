  title: Ihrer Zeit voraus - Franz Michel Felder, seine Nanni und Kaspar Moosbrugger
  subtitle: Dokumentation
  description: 'Das Doku-Drama "Ihrer Zeit voraus - Franz Michel Felder, seine Nanni und Kaspar Moosbrugger" beleuchtet das außergewöhnliche Leben des Bregenzerwälder Bauern, Schriftstellers und Sozialreformers Franz Michael Felder (1839-1865) aus einem neuen Blickwinkel. Der Film zeigt einen weitsichtigen Geist im 19. Jahrhundert, der die sozialen Ungerechtigkeiten in seinem Dorf scharf beobachtete und seine fortschrittlichen Gedanken niederschrieb. Im Zentrum stehen dabei auch die Menschen, ohne die sein Wirken kaum denkbar gewesen wäre: Seine geliebte Frau Nanni, die als Einzige von Beginn an seine Talente verstand, und sein Schwager Kaspar Moosbrugger, mit dem er schließlich eine tiefgehende sozialpolitische Partnerschaft einging. Regisseur Tone Bechter inszeniert diese Geschichte über Mut, gesellschaftlichen Wandel und Zusammenhalt mit Laiendarstellern an historischen Original-Schauplätzen.'
