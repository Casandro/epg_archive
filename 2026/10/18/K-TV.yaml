  title: 'Mosambik: Ich bin ein IDP'
  subtitle: Dokumentation
  description: Das sind die schmerzvollen Erzählungen von einem von tausenden IDPs (Vertriebenen im eigenen Land) in Mosambik. Cabo Delgado - die nördlichste Provinz des Landes wurde schwer von der Gewalt getroffen, die 2017 begann, als Terroristen einen Großangriff gegen die Bevölkerung starteten, der 4 000 Menschen das Leben kostete und 850 000 sind jetzt auf der Flucht. Das Drama dieser Menschen scheint endlos zu sein. Sie haben alles verloren, viele sogar ihre Familien. Zu Beginn der Flucht sind die meisten von ihnen Tage unterwegs gewesen, bis sie Hilfe und Schutz im Süden fanden. Mit einem Schlag war die Kirche mit einer humanitären Krise konfrontiert, auf die sie nicht vorbereitet war. Die Großzügigkeit der Menschen, die die Opfer des Terrorismus aufnahmen, war überwältigend. Die Kirche versucht, soweit es ihr möglich ist, das Leid der Kinder, Frauen und alten Menschen zu lindern. Zu Beginn wurden Lebensmittel verteilt. Jetzt konzentriert sich die Kirche auf die psychische und spirituelle Heilung der Opfer. "Ich bin ein Vertriebener im eigenen Land" ist ein Film, präsentiert die traurigen Erzählungen der Vertriebenen und die entschlossene Arbeit der Kirche in Mosambik.
