- eventId: 702465
  start: 2026-10-18T20:45:00Z
  stop: 2026-10-18T21:15:00Z
  title: auserlesen
  subtitle: 'Uwe Birnstein: Spirituelle Spuren in Rock und Pop'
  description: |-
    Welche spirituelle Botschaft steckt in Songs von AC/DC, Led Zeppelin oder Johnny Cash? Uwe Birnstein, Theologe, Journalist und Autor, beschäftigt sich seit Jahren mit genau dieser Frage. Eigentlich wollte er Pastor werden, doch während seines Theologiestudiums entdeckte er den Journalismus. Er arbeitete für Hörfunk und Fernsehen und veröffentlichte rund 30 Bücher. In vielen seiner Biografien geht es um Rock und Pop und darum, wie Glaube, Zweifel und die Suche nach Gott das Schaffen großer Künstler geprägt haben. In dieser Sendung erzählt er, welche "Hits from Heaven" man sich genauer anschauen sollte und was diese Musik mit seinem eigenen Glauben gemacht hat.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 702469
