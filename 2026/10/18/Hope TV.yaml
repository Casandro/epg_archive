  stop: 2026-10-18T21:45:00Z
  title: Leben und Gesundheit
  subtitle: Wie Gruppendruck uns beeinflusst
  description: |-
    Alle machen mit - und du? Gruppendruck kann subtil sein oder laut. Er begegnet uns in der Schule, im Job, in der Kirche und auf Social Media. Wer sich nicht anpasst, fällt auf. Doch wann lohnt es sich, stehenzubleiben - und was braucht es dafür? In dieser Folge sprechen wir über Mut zur eigenen Haltung, über Integrität und die Stärke, auch mal "Nein" zu sagen.

