  title: Die Kriege der USA
  subtitle: Öl, Macht, Terror
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Nach 9/11 beginnt der "War on Terror" - Afghanistan und Irak sind Schauplätze eines globalen Feldzugs. Donald Trump definiert die Rolle der USA neu: Macht ersetzt Bündnisse, Kriege brechen aus.

    Terroristen-Jagd, Folterskandale und Drohnenkrieg prägen nach dem Terror von Al-Kaida die US-Außenpolitik. Doch in der Heimat herrscht zunehmend Kriegsmüdigkeit. Donald Trump propagiert "America first" und führt sein Land dennoch in einen Krieg mit dem Iran.
    HD-Produktion
