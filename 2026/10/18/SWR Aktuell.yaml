  description: "12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nDas Weltrekord-Windrad - Chancen und Risiken\nHöher? Schneller? Effizienter? Das höchste Windrad der Welt ist fertig und steht in Schipkau in der Lausitz. Mit seinen 365 Metern Höhe übertrifft es alle bisher installierten Windkraft-Anlagen. Perspektivisch soll es vergleichbar viel Windkraft liefern wie Offshore Windkraft Anlagen auf dem Wasser. Warum es bis dahin noch ein weiter Weg ist, dieses Forschungsprojekt aber trotzdem wichtig ist, darum gehts in diese Ausgabe vom ARD Klima Update mit Theresa Brenner.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/ \n\n13:00 \nCamino - Religionen auf dem Weg\nErfindung der Basisdemokratie in Hessen ? - Erinnerung an die Homberger Synode von 1526\nEs ist ein epochales Ereignis: Vor 500 Jahren, zum 21. Oktober 1526 hatte Landgraf Philipp I. von Hessen ('der Großmütige') eine Versammlung einberufen von Vertretern der Stände, der Ritterschaft und des Klerus. Die so genannte Homberger Synode sollte erheblichen Einfluss ausüben auf die Geschichte der Reformation in Deutschland ausüben sollte. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - Erschreckend bis heute\" - Das Adorno-Experiment\nWie antisemitisch sind die Deutschen? Und wie sehr sind ihre Haltungen noch vom Nationalsozialismus geprägt? Diesen Fragen ging 1950/51 das Frankfurter Institut für Sozialforschung nach. Unter der Leitung von Theodor W. Adorno, der gerade erst aus dem Exil nach Frankfurt zurückgekehrt war, wurde ein \"Gruppenexperiment\" durchgeführt. Tausende Befragte sollten sich in Diskussionsrunden äußern zu NS-Diktatur und Holocaust, zu Judenfeindlichkeit und zur Verantwortung der Deutschen. Die Ergebnisse waren so erschreckend, dass Adorno sie nicht veröffentlichen wollte. Jetzt macht sich eine Gruppe von jungen Forscherinnen darin, die Protokolle auszuwerten und zu veröffentlichen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nJan Zimmermann im Gespräch mit Katherina Reiche (CDU), Bundesministerin für Wirtschaft und Energie\nBundeswirtschaftsministerin Reiche warnt vor anhaltenden Engpässen bei Diesel, Kerosin und Benzin aus dem Nahen Osten. Nach dem Auslaufen des Tankrabatts sollten Menschen mit geringen Einkommen mit Direktzahlungen unterstützt werden, sagt die CDU-Politikerin im ARD Interview der Woche. In der Reformdebatte mahnt sie Änderungen auf dem Arbeitsmarkt an. Arbeitgeber sollten die Möglichkeit haben, die Zahl der Arbeitsstunden zu erhöhen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30\nDie Schule brennt - der Bildungspodcast mit Bob Blume \nDeutscher Schulpreis - Was machen die Gewinner-Schulen richtig? | Armin & Bob über aktuelle Debatten\nGute Schulen sehen von außen aus wie andere Schulen auch, erzählt Table-Bildung-Redakteur Armin Himmelrath - aber schon wenn man reinkommt, spüre er gleich eine besondere Atmosphäre. Armin kennt auch die Schule, die beim Deutschen Schulpreis jetzt mit dem Hauptpreis ausgezeichnet wurde: die Bertha-von-Suttner-Schule in Mörfelden-Walldorf. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-schule-brennt-der-bil"
