  description: "15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND\nKoks und Küsschen - Passwort: Pecora - Die Codes der Mafia\nWie funktioniert eigentlich das System  _Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: Schlachtfeld EU-Haushalt - Wohin gehen Europas Billionen?\nCrunchtime für den neuen EU-Haushalt: die EU-Kommission will zwei Billionen Euro für die nächsten sieben Jahre. Deutschland ist strikt dagegen. Droht ein Konflikt, der Europas Zukunft entscheidet? Und wohin geht das Geld konkret? Mit Kathrin Schmid und Jean-Marie Magro.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel -  Was können die Schülerproteste in Frankreich ändern?\nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus - Bin ich zu teuer?\nDie IG Metall will mehr Lohn, Unternehmen klagen über zu hohe Kosten. Ist Arbeit in Deutschland wirklich zu teuer? Beschreibung: Deutschlands Wirtschaft schwächelt, viele Unternehmen müssen sparen. Aber muss es am Gehalt sein? Wir prüfen, ob hohe Löhne wirklich das Problem sind, welche Rolle Produktivität und Standortkosten spielen und warum ihr trotz Krise nicht automatisch ein schlechtes Gewissen haben müsst, wenn ihr mehr Geld fordert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
