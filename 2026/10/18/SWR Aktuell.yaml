  description: "6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/ \n\n6:30\nDie Schule brennt - der Bildungspodcast mit Bob Blume \nDeutscher Schulpreis - Was machen die Gewinner-Schulen richtig? | Armin & Bob über aktuelle Debatten\nGute Schulen sehen von außen aus wie andere Schulen auch, erzählt Table-Bildung-Redakteur Armin Himmelrath - aber schon wenn man reinkommt, spüre er gleich eine besondere Atmosphäre. Armin kennt auch die Schule, die beim Deutschen Schulpreis jetzt mit dem Hauptpreis ausgezeichnet wurde: die Bertha-von-Suttner-Schule in Mörfelden-Walldorf. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-schule-brennt-der-bildungspodcast-mit-bob-blume/urn:ard:show:0798e0e66b576457/\n\n7:00\nARD Interview der Woche ~\nJan Zimmermann im Gespräch mit Katherina Reiche (CDU), Bundesministerin für Wirtschaft und Energie\nBundeswirtschaftsministerin Reiche warnt vor anhaltenden Engpässen bei Diesel, Kerosin und Benzin aus dem Nahen Osten. Nach dem Auslaufen des Tankrabatts sollten Menschen mit geringen Einkommen mit Direktzahlungen unterstützt werden, sagt die CDU-Politikerin im ARD Interview der Woche. In der Reformdebatte mahnt sie Änderungen auf dem Arbeitsmarkt an. Arbeitgeber sollten die Möglichkeit haben, die Zahl der Arbeitsstunden zu erhöhen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n7:30  \nWeltspiegel - Was können die Schülerproteste in Frankreich ändern?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
