  description: "9:00  \nFREIHEIT DELUXE mit Jagoda Mariniæ\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n10:00\nAktuelles & Sport\n\n10:30\nKultur \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nAus dem Leben - Förster und Naturschützer Peter Wohlleben\nPeter Wohlleben hat mit seinen Büchern unseren Blick auf unseren Wald verändert. Genauso will er jetzt mit seinem aktuellen Buch \"Bakterien - Die heimlichen Helden\" unseren Blick auf die kleinsten Lebewesen verändern, die für ihn die Erfinder des Lebens sind. Bei den Recherchen für das Buch haben Bakterien ihn im positiven Sinn vom Stuhl gehauen. Denn Bakterien seien oft unterschätzte Wunderwesen, ohne die wir nicht leben können, sagt Peter Wohlleben. Seine Begeisterung für Biologie, die Natur und deren Schutz wurde bereits in seiner Kindheit geweckt. 1964 in Bonn geboren, später in Sinzig am Rhein mit mehreren Geschwistern als Sohn eines Finanzbeamten und einer medizinisch-technischen Assistentin aufgewachsen, ist er bereits als Kind viel draußen in der Natur, sammelt Spinnen im Glas, hält Wasserschildkröten im Aquarium auf seinem Schreibtisch, brütet auf dem Heizkissen seiner Oma ein Küken aus und beobachtet schon damals unter dem Mikroskop seiner Mutter Bakterien. Als \"grünes Schaf\" der Familie studiert Peter Wohlleben nach dem Abitur Forstwissenschaft und arbeitet danach 30 Jahre als Förster. Dabei setzt er schon früh statt auf konventionelle Forstwirtschaft auf naturnahe Waldwirtschaft, was nicht allen Kollegen gefällt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
