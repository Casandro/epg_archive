  title: Hörspiel
  description: '"Halten Sie mich nicht für verrückt, aber ich weiß, dass etwas Bösartiges passieren wird." Mit dieser unheilvollen Vorahnung steht die betagte Elisabeth Stein im Büro von Michel Paquet, noch Leiter der Mordkommission Saarlouis. Ihr Wohnblock wird gerade aufwendig modernisiert, doch durch den vielen Dreck und Lärm vergrault Vermieter Alexander Junghans die Bewohner. Wenige Tage später liegt er tot im Straßengraben.'
