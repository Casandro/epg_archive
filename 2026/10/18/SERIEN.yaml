  stop: 2026-10-18T02:00:00Z
  title: Borgia - 1492
  subtitle: Borgia - 1492
  description: 'Um einmal Papst werden zu können, laviert Kardinal Rodrigo Borgia geschickt zwischen verfeindeten Königreichen und einflussreichen Familien. Er sammelt seine illegitimen Kinder um sich: Juan, Cesare und Lucrezia. Wie Juan will auch Cesare eine militärische Laufbahn einsteigen, doch Rodrigo hat ihn für ein kirchliches Amt vorgesehen. Für Lucrezia sucht er einen Ehemann aus einflussreicher Familie. FR 2011'
  ageRating: 16
- eventId: 814532
  start: 2026-10-18T02:05:00Z
  stop: 2026-10-18T02:59:00Z
  title: Borgia - Ein heiliger Schwur
  subtitle: Borgia - Ein heiliger Schwur
  description: Rodrigo schickt Juan nach Spanien und Cesare zum Studium nach Pisa. Lucrezia, die schwer am Fieber erkrankt, wird von ihrer Mutter Vannozza gepflegt. Während im Konklave gestritten wird, bringt Cesares Geliebte einen Sohn zur Welt. Um Gottes Segen für Rodrigo zu erwirken und sein eigenes Leben nach Rodrigos Willen der Kirche weihen zu können, setzt Cesare den Neugeborenen auf einem Berggipfel aus. FR 2011
  ageRating: 16
- eventId: 814533
  start: 2026-10-18T03:00:00Z
  stop: 2026-10-18T06:15:00Z
  title: Borgia - Die Weisheit des heiligen Geistes
  subtitle: Borgia - Die Weisheit des heiligen Geistes
  description: 'Als Lucrezia das Fieber überstanden hat, steht ihr Entschluss fest: Sie will Nonne werden. Um seine Wahl zu sichern, verspricht Rodrigo den anderen Kardinälen Grundbesitz und Ämter. Sforza soll Vizekanzler werden, dessen Sohn soll Lucrezia heiraten. Rodrigo wird gewählt und nennt sich Alexander VI. Reumütig kehrt Cesare auf den Berggipfel zurück. Doch der Felsen ist leer: Sein Sohn wurde gerettet. FR 2011'
  ageRating: 12
