  title: Borgia - Vorboten der Apokalypse
  subtitle: Borgia - Vorboten der Apokalypse
  description: Da Rodrigo Lucrezia die Scheidung vom impotenten Giovanni Sforza verweigert, will sie ihren Mann vergiften. Als die Colonna Ostia erobern und die französische Flagge hissen, lässt Rodrigo deren Anführer Marcantonio exkommunizieren. Um Frieden zu stiften, liefert Rodrigo Cesare den Colonna als Geisel aus. Aus Angst vor den Franzosen zieht Rodrigo sich mit seiner Familie in die Engelsburg zurück. FR 2011
