  title: Planet Weltweit - Razzia im Regenwald
  subtitle: Planet Weltweit - Razzia im Regenwald
  description: 'José de Souza schlendert über einen Straßenmarkt in Rio de Janeiro. Vor ihm preisen die Händler ihre Waren an - exotische Früchte, Haushaltsgegenstände oder Geflügel. Doch Souza interessiert sich für die Waren, die versteckt unter den Ständen auf ihre Käufer warten - Affen, Papageien oder Schlangen, die illegal in den Wäldern Brasiliens gefangen wurden und hier unter der Hand weiter verkauft werden. Diesen Händlern will Souza das Handwerk legen. Der Film beobachtet den brasilianischen Naturschützer bei seinem Kampf gegen den verbotenen Tierhandel. Seit 25 Jahren ist er Kontrolleur der Naturschutzbehörde Ibama im bergigen Hinterland von Rio de Janeiro. Jetzt soll er mit seinem Wissen und seiner Erfahrung sogar der Bundespolizei helfen. Diese plant eine große Razzia im Amazonas-Gebiet. Gerade die Regenwälder des Amazonas sind besonders artenreich, ein begehrtes Jagdgebiet für Wilderer. Von ihren Booten aus entern die Kontrolleure Kanus und sogar größere Passagierschiffe, um nach gewilderten Tieren zu suchen. Ein nicht ungefährliches Unterfangen: Denn nicht immer geben die Wilddiebe ihre Beute freiwillig heraus. Kaum einer von ihnen ist heute noch ohne Waffe unterwegs, einige arbeiten im Auftrag größerer illegaler Organisationen. Gejagt wird alles, was Profit verspricht: Jaguare wegen ihres Felles, Kaimane und Schlangen wegen ihrer Haut, und Affen, weil sie besonders possierliche Hausgenossen abgeben. Und für einen Ara aus der Wildnis Brasiliens zahlt manch ein ausländischer Sammler sogar ein halbes Vermögen. Durch Aktivitäten wie diese macht José de Souza sich natürlich nicht nur Freunde, nicht selten wurde er bedroht. Doch die Ibama plant bereits weitere Aktivitäten.  DE 2004'
