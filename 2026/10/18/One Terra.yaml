  title: Planet Weltweit - Indien - Das Geschäft mit dem Tempelhaar
  subtitle: Planet Weltweit - Indien - Das Geschäft mit dem Tempelhaar
  description: 'Unser Haar -Spiegel und Aushängeschild der Persönlichkeit. Kräftig, voll und glänzend soll es sein. Oft fehlt es jedoch an der Menge oder der Länge. Deshalb helfen immer mehr Menschen nach - mit fremdem Haar. Die künstliche Haarpracht stammt größtenteils aus Indien, gefertigt aus Haaren, die in den Tempeln von Gläubigen geopfert werden. Wir haben eine Inderin und ihren Sohn begleitet, die ihr Haar in einem Tempel opfern. Sie verfolgte, was weiter mit diesem Haar passiert - und hat so erfahren, wie es wirklich funktioniert: Das Geschäft mit dem Tempelhaar.  Die Rasiermesser schaben ununterbrochen, legen Stück für Stück die darunter liegende Kopfhaut frei. Die Friseure arbeiten im Akkord, die Wartenden werden im Minutentakt auf die flachen Bretter bugsiert, die als provisorische Schemel dienen. Unter ihnen sind heute Sumati Jayapathi und ihr zehnjähriger Sohn Balaji. Sie sind den weiten Weg in die Tempelanlage von Palani gegangen, um ihr Haar zu opfern. Im Gegenzug dafür erhoffen sie sich von ihrem Gott die Zustimmung zum Bau eines eigenen kleinen Häuschens. Vor zehn Jahren war Sumati zum letzten Mal in Palani. Seitdem hat sich vieles verändert, das Geschäft mit dem Haar hat den Ort wachsen und gedeihen lassen. Mehrere Millionen Pilger kommen inzwischen jedes Jahr nach Palani. Zurück lassen sie Tonnen von geopfertem Haar. Es ist ein einvernehmliches Geben und Nehmen - und ein offenes Geheimnis, dass der Tempel die Haare weiter verkauft. Schließlich muss er sich finanzieren. Seit sich Haarverlängerungen und Echthaarperücken weltweit zunehmender Beliebtheit erfreuen, boomt das Geschäft. Weit über 50 indische Firmen konkurrieren um das Haar, welches als das weltweit schönste und strapazierfähigste gilt. Abnehmer gibt es in der ganzen Welt, und es ist durchaus möglich, dass das Haar welches Sumati Jayapathi heute opfert, demnächst auf dem Kopf einer europäischen Kundin landet, in Form von Verlängerungen oder als Perücke. DE 2008'
  ageRating: 6
- eventId: 814786
