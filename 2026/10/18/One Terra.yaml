  title: Planet Weltweit - Paco Pacos - Die Knatterkisten vom Amazonas
  subtitle: Planet Weltweit - Paco Pacos - Die Knatterkisten vom Amazonas
  description: "Das Fahrwerk stammt von einem alten Toyota, die Sitze aus einem VW-Bus, der Motor aus einer  Wasserpumpe, die früher einmal bei der Goldsuche verwendet wurde. Zusammengebaut ergeben diese  Einzelteile einen Paco-Paco. Der Klang des Motors hat der einzigen brasilianischen Automarke ihren  Namen gegeben. \n\nDer raue Nordwesten Brasiliens ist die Heimat einzigartiger Gefährte: der Paco Pacos. Ende der  achtziger Jahre waren viele Glückssucher und Abenteurer in das verschlafene Peixoto gekommen. Sie  wollten hier in der Umgebung nach Gold suchen. Doch der Boom dauerte nur kurz. Als die Goldsucher  wieder gingen, ließen sie jede Menge Schrottteile und Wasserpumpen zurück. Jair Graff war der  erste, der entdeckte, dass man mit den Drei-Zylinder-Dieselmotoren der Pumpen auch sehr effektiv  ein Fahrzeug antreiben kann. Seitdem hat er über 460 Paco Pacos gebaut. Ihre robuste Karosserie  ist aus den Einzelteilen diverser Autotypen zusammengesetzt. Diese Unikate erfreuen sich großer  Beliebtheit - eignen sie sich doch hervorragend für Feld- und Transportarbeiten in unwegsamem  Gelände und sind meist mit ein paar Hammerschlägen zu reparieren. Aber die Existenz der Paco Pacos  ist gefährdet. Der Grund: Auch in dieser entlegenen Dschungel-Region soll nun eine  Straßenverkehrsordnung eingeführt werden. Und dafür sind Autos, deren Böden mitunter aus  Holzplatten sind und die auch schon mal ohne Bremsen fahren, eine Gefahr. Jair Graff sieht seine  Existenz bedroht und sucht deshalb nach Wegen, die Behörden von der Notwendigkeit der Pacos Pacos  zu überzeugen. Seine neueste Idee: zusammen mit seinen Kollegen organisiert er eine Demonstration  in Form eines Paco Paco-Gelände-Rennens.\nbedeutet. DE 2004"
