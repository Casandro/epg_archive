  title: Planet Weltweit - Sark, die Kanalinsel der Queen
  subtitle: Planet Weltweit - Sark, die Kanalinsel der Queen
  description: |-
    Mitten im Ärmelkanal, 20 Seemeilen von Frankreich und 80 von England entfernt, existierte bis vor  kurzem die letzte feudalistische Gesellschaft in Europa: die Insel Sark, regiert von einem  "Seigneur". Die kleinste der drei Kanalinseln ist bis heute nur per Fähre erreichbar, rund 600  Menschen leben hier einen ruhigen, naturnahen Alltag ohne Autos, ohne Straßenbeleuchtung. Doch die  im Jahr 2008 eingeführte Demokratie bringt den Rhythmus auf Sark durcheinander. Viele Insulaner sind besorgt, dass die in 500 Jahren gewachsene Inselgemeinschaft auseinander zu brechen droht.

    Sark liegt zwischen Jersey und Guernsey und ist mit 5,5 Quadratkilometer kaum größer als der Englische Garten in München. Die Insel besteht aus zwei Felseninseln, Great und Little Sark, die  durch einen etwa 100 Meter hohen Grat verbunden werden. Das Leben auf Sark ist wie ein Schritt  zurück in die Vergangenheit. Es gibt keine Autos, keinen Asphalt, keine Straßenbeleuchtung und  keine Einkommenssteuer. Die Kanalinsel war der letzte feudalistische Staat Europas, regiert von  einem Seigneur, der die Insel als Lehen der britischen Krone führte. Das hat sich im Dezember 2008  geändert, und Sark kann sich nun die jüngste Demokratie Europas nennen. Doch gleichzeitig existiert hier immer noch das Lehnswesen, denn die Insel gehört nicht zum Vereinigten Königreich oder zu den Kronkolonien, sondern ist direkt der Königin unterstellt. Die isolierte Lage aber macht das Überleben für die rund 600 Insulaner nicht leicht. Die meisten arbeiten in der Fischerei, der Landwirtschaft, im Tourismusgeschäft - oder sie haben eine gute Geschäftsidee. Wie Familie Couldridge, die Sarks einziges Exportprodukt herstellt: Pralinen. In der Schokoladen-Manufaktur, die nur aus einem kleinen Raum besteht, geht es hoch her. Besonders in der Hochsaison, im Sommer. Jedes der 450 Hotelbetten auf der Insel ist dann ausgebucht. DE 2011
