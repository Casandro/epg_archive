  title: Planet Weltweit - Bishnoi, Tierliebe bis in den Tod
  subtitle: Planet Weltweit - Bishnoi, Tierliebe bis in den Tod
  description: Vor über 500 Jahren gründete ein indischer Guru die Gemeinschaft der Bishnoi, einem Volk, das sich dem Schutz allen Lebens verschrieben hat - und in enger Verbindung mit Pflanzen und Tieren lebt. Die Heimat ihrer Nachkommen ist noch immer die Wüste Rajasthans. Dort verteidigen die Bishnoi bis heute ihre traditionellen Regeln gegen die Einflüsse der modernen Welt, notfalls unter Einsatz ihres Lebens.  Die Wüste Thar im Nordwesten Indiens. Schon früh am Morgen geht Ramniwas Budhnagar hinaus, um Wasser und Futter für die wilden Tiere bereitzustellen. Sein Sohn Mahaver begleitet ihn. Eines Tages soll er dieses Ritual fortführen. Ramniswas Familie gehört zum Volk der Bishnoi. Bishnoi bedeutet "29", abgeleitet von den 29 Geboten, die Lord Jambeshwar vor etwa 500 Jahren für seine Gemeinde aufstellte. Zu jener Zeit drohte das Land durch Konflikte zwischen Muslimen und Hindus und Rivalitäten innerhalb verschiedener Kasten auseinander zu brechen. Jambeshwar glaubte, dass der einzige Weg aus dieser Situation ein absoluter Respekt gegenüber jedem Lebewesen sei. Dafür stellte er die 29 Regeln auf. Sie betreffen die tägliche Hygiene ebenso wie die Art zu sprechen, die Ernährung, das Mitgefühl und das Vergeben gegenüber anderen. Sie reichen von "Töte niemals ein Tier", "Schütze die wilden Tiere, denn auch sie spielen eine Rolle im Gleichgewicht der Natur" über "Lüge nicht" bis hin zu "Fälle keine Bäume". Mit ihrem strengen Regelwerk gehören die Bishnoi zu den ersten Umweltschützern der Welt. Bis heute versuchen sie, ihren Idealen treu zu bleiben, auch in der globalisierten Welt, in der wenig Platz für Individuen und Lebensformen jenseits der Moderne bleibt. Viele junge Bishnoi wandern ab in die Städte. Diejenigen, die bleiben, kämpfen weiter für die Rechte der Tiere und Bäume, verarzten verwundete Gazellen, pflegen sie in den eigenen Tempeln gesund. DE 2010
  ageRating: 6
