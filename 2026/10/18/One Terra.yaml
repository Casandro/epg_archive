  title: Planet Weltweit - Tonga, Paradies der Südsee?
  subtitle: Planet Weltweit - Tonga, Paradies der Südsee?
  description: "Tonga, ein Paradies in der Südsee und auf den ersten Blick eine traumhafte Idylle. Mildes Klima und üppige Vegetation versprechen ideale Lebensbedingungen im ältesten Königreich Polynesiens. Doch abseits von Hofstaat und Palästen sind viele Menschen verzweifelt: Es herrschen Arbeitslosigkeit und Armut. \n\n92 Prozent der  Bevölkerung Tongas leiden an Übergewicht. Mehr als die Hälfte stirbt an Diabetes und ihren Folgen. Armut, Hoffnungslosigkeit und mangelnde medizinische Versorgung veranlassen seit vielen Jahren immer mehr Bewohner zur Auswanderung. Sie suchen Heil in Neuseeland, in Australien oder in den USA. Wer zurück bleibt, versucht sich einzurichten - auch wenn es kaum reguläre Arbeitsplätze gibt. Die einen leben von Fischfang und Ackerbau, andere bauen vor allem auf die Geldüberweisungen von Familienangehörigen aus dem Ausland. Planet fragt nach: Gibt es eine Zukunft für Tongas Kinder im eigenen Land?\n\nFipe Paea ist Diabetikerin. Sie hat bereits ein Bein verloren und leidet an chronischem Nierenversagen. Auf Tonga ein Todesurteil. Nur im Ausland gibt es die rettende Dialysebehandlung. Auswandern oder sterben - wie Fipe Paea stellt sich jährlich etwa 200 weiteren Nierenpatienten in Tonga diese Frage. Doch nur wenige haben die Chance auszuwandern. Fipes Sohn Timote, der seit fast 15 Jahren in San Francisco lebt, startet jetzt den vierten Anlauf, um seine todkranke Mutter und deren Nichte Laukau in die USA nachzuholen. Doch zum Auswandern braucht man Visa und Geld. Umgerechnet 4000.- Euro fehlen noch. Ein Vermögen in Tonga. Die Zeit drängt, die Flugtickets sind nur noch bis morgen reserviert. Wird es Timote diesmal schaffen, die Mutter außer Landes zu bringen? DE 2013"
