  title: Planet Weltweit - Svanetien - Von Lebenden und Toten
  subtitle: Planet Weltweit - Svanetien - Von Lebenden und Toten
  description: "Im Kaukasus-Hochland von Georgien pflegt ein Volk seine urtümlichen Rituale aus vorchristlicher Zeit. Die Svanetier sind überzeugt, dass ihre Ahnen direkt neben ihnen weiter existieren. In eisiger Winterkälte decken sie den Tisch auf ihren Gräbern und laden die verstorbenen Familienmitgleider sogar zu sich nach Hause ein.\nJeder Winter bringt meterhohen Schnee in das entlegene Obersvanetien an der georgisch-russischen Grenze. In der entbehrungsreichen Zeit mit ihren langen, dunklen Nächten werfen die Svanetier einen intensiven Blick in ihr Totenreich. Sie laden in alten Ritualen die Verstorbenen an ihren Tisch und hoffen, dass sie sich hier mal so richtig satt essen und am Bollerofen aufwärmen. Und damit nicht genug: zum Lichterfest \"Lamproba\" wird nur kurz danach gleich nochmal richtig geschmaust, diesmal aber direkt dort, wo die Toten sind: auf dem Friedhof. Mit Fackeln marschieren die Einheimischen nachts zum tief verschneiten Kirchhof und decken auch hier noch einmal auf Brettern und mitgebrachten Tischen festlich auf. \nÜber Jahrtausende hinweg blieben die Svanetier unabhängige Bauern. Damals wie heute leben mehrere Generationen unter einem Dach. Lewan Jajvani hat sein Heimatdorf nur ein einziges Mal, zum Studium, verlassen. Auch heute wollen die meisten Bewohner hier nicht weg - es könnte die Ahnen verstimmen. Die Verstorbenen sind in den Familien immer präsent: \"Wir sind überzeugt von der Gegenwart unserer Vorfahren. Deswegen müssen wir hier auf diesem Stück Erde bleiben. Wir können sie nicht allein lassen\". Darum werden die Tage im Winter genutzt, um der Toten zu gedenken: für das \"Lipanali-Fest\" wird nur das Feinste gekocht und Schnaps gebrannt, um die Toten würdig zu bewirten. Mehrere Tage werden die Seelen in den Häusern der Familien \"beherbergt\" und beraten über das Wohl der Familie.  Am Ende des Winters werden sie noch ein letztes Mal beim Lichterfest \"Lamproba\" auf den Friedhöfen festlich bewirtet.\n DE 2017"
  ageRating: 6
