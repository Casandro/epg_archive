  title: Planet Weltweit - Slab City, Wildes Leben in der Wüste
  subtitle: Planet Weltweit - Slab City, Wildes Leben in der Wüste
  description: "Slab City ist wahrscheinlich der ungewöhnlichste Ort in Nordamerika. Hier leben Aussteiger, Künstler, Hippies und Anarchisten in ihren Wohnmobilen - mietfrei und von gesellschaftlichen Zwängen unbehelligt. Es gibt in Slab City keinen Bürgermeister, keine Polizeistation, keinen Arzt, keinen Shop. Auch auf Strom, Gas und fließendes Wasser muss man hier verzichten. Dafür darf jeder so leben wie er will. Die abenteuerlustige Seniorin, die jeden Winter in ihrem Luxuswohnmobil anreist ebenso wie der Althippie Wayne oder der verarmte Musiker Airracket oder gar die achtköpfige Familie Neill, die es durch Obdachlosigkeit hierher verschlagen hat. Die unterschiedlichen Bewohner von Slab City achten auf ein sorgsames Miteinander, wie man es andernorts kaum erlebt. \n\nDas Leben in Slab City ist hart. Wasser gibt es nur an der Tankstelle, Elektrogeräte müssen mit Solarenergie betrieben werden. Eine heiße Mineralquelle in der Nähe dient als Bad. \"Slabs\" nennt man die Betonfundamente, Überreste einer ehemaligen Kaserne. Seit den 1950er Jahren lockt das einstige Militärgelände mitten in der kalifornischen Coloradowüste Menschen an, die vor dem Winter in Maine, Alaska oder Kanada flüchten - so genannte \"Snow Birds\". Es sind zumeist Rentner, die ihr Haus verkauft haben und für den Rest ihres Lebens in mehr oder weniger luxuriösen Wohnmobilen der Sonne hinterher ziehen. Die 66-jährige Sherry Sheets ist ein echtes \"Snow Bird\" -Slab City ist für sie vor allem ein aufregendes Abenteuer. Im Singleclub \"LOWs\" trifft sich die Seniorin mit Gleichgesinnten zur Happy Hour für Gesellschaftsspiele oder andere Vergnügungen. Wie die meisten Snow Birds hat sie nur wenig Kontakt zu den Dauercampern in Slab City. Wayne Gardner (67) lebt seit 35 Jahren in Slab City und ist ein Einzelgänger. DE 2012"
