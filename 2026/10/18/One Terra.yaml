  title: Planet Weltweit - Das schwimmende Krankenhaus vom Amazonas
  subtitle: Planet Weltweit - Das schwimmende Krankenhaus vom Amazonas
  description: Der Rumpf des Militärschiffes durch den Seitenarm des Amazonas-Flusses, die Besatzung steht einsatzbereit an Deck. Sie besteht nicht aus Soldaten, sondern aus Ärzten und Krankenschwestern. Das brasilianische Militärschiff "Oswaldo Cruz" ist in friedlicher Mission unterwegs, transportiert medizinische Ausrüstung über die Wasserstraßen des Regenwalds. Am frühen Morgen legt die "Oswaldo Cruz" in Manaus ab. Drei junge Ärzte sind bei diesem Einsatz mit an Bord, die ein Jahr lang dabei helfen, die abgelegenen Dörfer im Amazonas-Gebiet medizinisch zu versorgen. Für Carolina Barbiéri ist es ist die erste Reise in den Amazonas. Sie wird eingewiesen von Azael Ribeiro, dem leitenden Arzt, der bereits fünf Jahre mit der "Oswaldo Cruz" unterwegs ist. Er hat die Erfahrung gemacht, dass die Ärzte nicht nur als Mediziner benötigt werden, sondern es in den Dörfern auch an Informationen über Hygiene und Ernährung mangelt. Drei Krankenhausschiffe kreuzen im Amazonas, trotzdem erreichen sie die meisten Dörfer nur alle ein bis zwei Jahre. Ganze 50 Dörfer sollen die Ärzte der "Oswaldo Cruz" auf dieser vierwöchigen Reise aufsuchen - vorausgesetzt, dass sie sie finden. Carolina Barbiéri ist nahe dran, bereits bei ihrem ersten Einsatz zu scheitern. Mit einem Boot sucht sie einen Ort, doch dort, wo sich laut Karte die Häuser befinden, findet sie nur Sumpfgras. Kleine Dörfer, in denen nur wenige Personen leben, ändern häufig ihren Standort. Kaum jemand besitzt ein Funkgerät, mit dem er seine aktuelle Position durchgeben oder im Notfall ärztliche Hilfe herbeirufen kann. Die junge Ärztin ist erleichtert, als sie das Dorf schließlich doch noch findet. Sie kommt gerade zur rechten Zeit, um zwei kranke Säuglinge zu behandeln. Mit einem einfachen Präparat kann die Ärztin hier helfen. Carolina Barbiéri träumt davon, dass es irgendwann in allen Amazonas-Dörfern Krankenstationen geben wird. Doch bis dahin gibt es viel zu tun für die Crew der "Oswaldo Cruz".  DE 2005
