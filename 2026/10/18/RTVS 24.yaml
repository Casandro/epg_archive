  title: VAT (23)
  subtitle: Ochrana kritickej infraštruktúry lesníkmi. Magazín o vede a technológiách s Gregorom Marešom.
  description: Ukážeme, ako fungujú nákladné automobily bez vodičov v čínskom kameňolome. Zistíme, v akej fáze sa nachádza misia BepiColombo, smerujúca k Merkúru. Na Slovensku sa pozrieme na to, ako technológie pomáhajú chrániť lesníkom kritickú infraštruktúru. (2026)
