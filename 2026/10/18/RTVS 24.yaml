  subtitle: Extrémne suché a teplé leto. Budúcnosť prichádza už dnes. Talk show o vede s Gregorom Marešom.
  description: Šesť dní s teplotami nad 40 °C, vyschnuté korytá riek a historický kolaps Dunaja, aký sme v lete nezaznamenali 126 rokov. Leto 2026 prepisovalo klimatické mapy Slovenska a zasiahlo pôdu aj zásoby podzemných vôd oveľa tvrdšie než obávaný rok 2022. Ako rýchlo sa naša krajina mení, prečo nás už zachrániť nedokážu ani alpské ľadovce a čo to znamená pre našu pitnú vodu? (2026)
