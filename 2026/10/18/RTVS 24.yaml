  description: Na špecialistu čakáme týždne či mesiace a niekedy nám v ambulancii bez okolkov povedia, že nových pacientov neprijímajú. Ktorých lekárov na Slovensku skutočne potrebujeme a prečo ich nemáme dosť? A čím to je, že na vyšetrenie cez poisťovňu niekedy miesto nie je, ale ako samoplatca sa objednať môžeme? (2026)
