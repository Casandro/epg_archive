  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory.
  description: 'PACIENT BEZ LEKÁRA: Bublalo to roky. Dostupnosť lekárov špecialistov sa dostala na hranu. Pacient, ktorý potrebuje vyšetrenie, často blúdi systémom, obvoláva jednu ambulanciu za druhou a prosí o termín. Na vyšetrenie môže čakať mesiace, niekedy aj roky alebo zaň platiť. Ombudsman upozorňuje, že pacient tak môže prichádzať o ústavné právo na dostupnú zdravotnú starostlivosť. (2026)'
