  stop: 2026-10-18T16:50:00Z
  title: Občan za dverami (26)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: at si však pre vlastných zamestnancov urobil vlastný zákon.... Najprv im štát pozemky dal, potom vzal. Znova vrátil a znova vzal. Zdá sa, že ani zápis v katastri negarantuje, že vám niečo patrí... Presťahovali sa z paneláka v meste do chaty v lese, aby mali súkromie a aby ich vážne chorá dcérka nerušila susedov. Pokoj síce našli, no iba od pondelka do štvrtka. Cez víkend sa tam vraj nedá žiť. Alexovci sa sťažujú na neznesiteľný hluk počas spoločenských akcií v neďalekom penzióne... (2026)
