  title: Science-Fiction-Hörspiel | "Gärten von gestern" von Gabi Schaffner
  subtitle: Schräge Soundcollagen mit Anita Iselin als Audioarchäologin und Arndt Schwering-Sohnrey als Künstliche Intelligenz
  description: "Wovon erzählen die Tonspuren unseres Zeitalters, die in der Zukunft von Archäologen in den Erdschichten ausgraben werden? \n\nEuropa Anfang des 22. Jahrhunderts: Nach dem LSD-Aufstand von 2090 ist die Bevölkerung dezimiert, unendlich viel Wissen ist verloren gegangen. Die Arbeit der Audio-Archäologen besteht in der Wiedergewinnung dieses Fundus aus verbliebenen Tonträgern, Festplatten und anderen Artefakten jener nahezu ausgelöschten Gartenkultur."
