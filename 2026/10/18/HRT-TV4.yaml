  title: 'Romano Bolković - 1 na 1: Ivan Marović, talk show'
  subtitle: S gostom Ivanom Marovićem razgovaramo o današnjoj Srbiji i usporedbi Vučićeva i Miloševićeva režima, iskustvu Otpora i odnosu prema današnjem studentskom pokretu, izborima i mogućnostima političke.
  ageRating: 4
  genre:
  - '160'
  description: 'S gostom Ivanom Marovićem razgovaramo o današnjoj Srbiji i usporedbi Vučićeva i Miloševićeva režima, iskustvu Otpora i odnosu prema današnjem studentskom pokretu, izborima i mogućnostima političke promjene. Razgovaramo o takozvanim obojenim revolucijama u Ukrajini i Gruziji, njihovim različitim ishodima, vezi s ratom u Ukrajini te o globalnoj krizi demokracije i povratku autoritarnih sustava. Govorimo i o Americi pod Donaldom Trumpom, umjetnoj inteligenciji, podatkovnim centrima i nastanku tehnološke oligarhije, a završni dio razgovora posvećen je teoriji i praksi revolucija i prevrata - od La Boétiea, Machiavellija i Malapartea do 1968., propasti socijalističke alternative i Fukuyamine teze o liberalnoj demokraciji. Ivan Marović jedan je od nekadašnjih čelnika pokreta Otpor, studentskog i građanskog pokreta koji je imao važnu ulogu u rušenju režima Slobodana Miloševića 2000. godine. Kao jedan od najistaknutijih članova Otpora i njegov predstavnik u koaliciji Demokratska opozicija Srbije, sudjelovao je na sastancima vodstva DOS-a te u pripremama za izbore i prosvjede koji su uslijedili nakon Miloševićeva pokušaja osporavanja izbornog rezultata. Nakon demokratskih promjena u Srbiji Marović se posvetio proučavanju i praktičnoj primjeni strategija nenasilnog političkog otpora. Radio je s prodemokratskim pokretima i aktivistima u brojnim zemljama, među ostalima u Ukrajini, Gruziji, Iranu, Egiptu, Zimbabveu, Siriji i Sudanu, te je sudjelovao u obrazovanju i savjetovanju organizacija koje se bave građanskom mobilizacijom, nenasilnim otporom i demokratskim promjenama. Danas živi u Washingtonu i od lipnja 2025. predsjednik je Centra za istraživanje nenasilnih konflikata. Diplomirao je procesno inženjerstvo na Sveučilištu u Beogradu, a magistrirao međunarodne odnose na Fletcher School of Law and Diplomacy Sveučilišta Tufts. Autor je priručnika The Path of Most Resistance: A Step-by-Step Guide to Planning Nonviolent Campaigns te je sudjelovao u stvaranju dviju edukativnih videoigara posvećenih građanskom otporu i društvenim promjenama: A Force More Powerful i People Power.'
