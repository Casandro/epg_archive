  title: Potrošački kod
  subtitle: ' '
  description: 'Digitalne prijetnje sve su raznovrsnije i učestalije - njihov je broj gotovo 36 posto veći nego lani. Kibernetički napadači sve su uvjerljiviji, a među najčešćim oblicima prijevara ističu se lažno predstavljanje u ime državnih institucija i poznatih tvrtki, preuzimanje korisničkih računa te zlouporaba osobnih podataka u ciljanim prijevarama.Na meti se može naći svatko, a posljednjih su mjeseci posebno pogođeni umirovljenici. Kako prepoznati prijevaru, zaštititi osobne podatke i sigurno se koristiti digitalnim uslugama? Gosti emisije su: Vlatka Jajetić, voditeljica Službe za obradu kibernetičkih incidenata i upravljanje sigurnošću u CARNET-ovu Nacionalnom CERT-u, i Marko Gulan, stručnjak za kibernetičku sigurnost.'
