  title: Kenjac, hrvatski film (12)
  subtitle: ' '
  description: Drama. Boro (Nebojša Glogovac) sa ženom Jasnom (Nataša Janjić) i sinom Lukom vraća se nakon sedam godina u svoje rodno mjesto Drinovce, selo u Hercegovini. Njegov brat (Emir Hadžihafizbegović) izišao je iz okupiranog Sarajeva. Božo zna da mu je brat ranjen, ali tek sada otkriva da je on za cijeli život prikovan za invalidska kolica. Uza sve, Boro je u neprekidnoj svađi sa suprugom Jasnom, a s ocem Paškom (Tonko Lonza), kojeg optužuje za majčinu smrt, uopće ne razgovora... Na Pula film festivalu "Kenjac" je osvojio Zlatnu arenu za najbolji scenarij, za kameru (Mirko Pivčević), i za glazbu (Srđan Gulić Gul). Stručna, filmska kritika je ovom filmu dodijelila nagradu Oktavijan.
- eventId: 790391
  start: 2026-10-18T03:41:00Z
  stop: 2026-10-18T04:41:00Z
  title: 'Acoustic Project: Furious Dance'
  subtitle: ' '
  description: Godine 2012. ansambl Acoustic Project objavljuje svoj prvi CD pod nazivom Acoustic Project, koji je iste godine nominiran i za hrvatsku diskografsku nagradu "Porin". U kontinuitetu djelovanja ovaj sastav sjajnih glazbenika smjelo se suočava s raznim izazovima ne prežući niti od glazbenih eksperimenata, uvijek nastojeći doprijeti do novih i još neistraženih "predjela glazbe". Ansambl je po mišljenju publike i stručne kritike napravio iskorak u nova glazbena prostranstva uvođenjem u klasičnu glazbu nekih suvremenih, inovativnih formalnih struktura i instrumentacijskih postupaka drugačijih od onih uvriježenih te ju je time ne samo približio drugim glazbenim stilovima, nego učinio i pristupačnijom publici koja je otvorena za nove izazove te željna novih vidika i uzbudljivih i još neistraženih glazbenih prostranstava.
- eventId: 790392
  start: 2026-10-18T04:41:00Z
  stop: 2026-10-18T05:22:00Z
  title: Dolina sunca, serija (27/210)
  subtitle: ' '
  description: 'Pri pospremanju Vjekine kancelarije Eva naleti na dokumentaciju Tomek i na Juranovu punomoć, ali ne pridodaje tome veliku važnost. Kristijan je zatečen ugledavši Jurana na novom motoru. Augustina zabrine Ladu kazavši joj da su dečki čudni jer jednom kad im se podaš više nisu zainteresirani. Kristijan polako gubi živce nad Juranovim bezobrazlukom, ali se ipak suzdržava. Juran je uvjeren da Kristijan neće reći Ivanu za motor. Irena pokušava s Kristijanom razgovarati o Adelinom daru, ali je on nervozan zbog Jurana. Sonja koristi priliku za neprimjeren komentar koji će sigurno iznervirati Irenu. Ivan potajno sprema iznenađenje za Adelin rođendan. Robert i Andrija krenu se prepucavati oko posla, što razljuti Evu. Eva nagovori Sofiju da odu na mali piknik opustiti se i odmoriti od svega. Nikola i Ruža spremaju se za Adelin rođendan, oni kao gosti i njihovi kolači Ivanovo su iznenađenje za Adelu. Irena je ljuta jer je imala posebno iznenađenje koje je sada zbog Ivana propalo. Nikola i Adela teško skrivaju poglede tijekom proslave. Eva je zaspala na pikniku, ne vidjevši da je zbog dječje spačke ostala bez odjeće, kad u tom trenu naiđe Kristijan...  Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 790393
  start: 2026-10-18T05:22:00Z
  stop: 2026-10-18T06:12:00Z
  title: 'Klub čitatelja: Semezdin Mehmedinović - Kuća za pisanje'
  subtitle: ' '
  description: Može li se stvoriti dom ondje gdje se osjećamo kao stranci? Možemo li u književnosti kazati ono za što nam u zbilji nedostaju riječi? U ovoj epizodi Kluba čitatelja razgovaramo o romanu "Kuća za pisanje" Semezdina Mehmedinovića, nježnoj i slojevitoj priči o odnosu oca i kćeri, pripadanju, sjećanju i pisanju. Gdje prestaje autobiografija, a počinje fikcija? Kako fotografija čuva prošlost? Je li jezik naš jedini pravi dom? O tome će novi voditeljski par, Đurđica Čilić i Dražen Ilinčić, razgovarati s književnom kritičarkom Jagnom Pogačnik, germanisticom Milkom Car, glumcem Draženom Šivakom i fotografom Stankom Abadžićem. "Klub čitatelja" - razgovor koji počinje nakon posljednje stranice - s vama je i ove srijede.
- eventId: 817056
  start: 2026-10-18T06:12:00Z
  stop: 2026-10-18T06:18:00Z
  title: 'Jojo i lijepe riječi: Zagrljaj (8/10)'
  subtitle: ' '
  description: 'U svakoj od epizoda novoga serijala "Jojo i njegovi prijatelji" družeći se na farmi kroz svladavanje različitih situacija i "problema" uče i upoznaju značenje i važnost LIJEPIH RIJEČI i njihovo korištenje u svakodnevnom životu. Tako će naučiti zašto je važno pozdraviti i nekome poželjeti dobro jutro (dobar dan ili laku noć), koliko je vrijedan osmijeh ili zbog čega nikada ne smijemo zaboraviti reći - oprosti, hvala i molim! Jojo i njegovi prijatelji kroz igru i pjesmu najmlađe uče ljubaznosti, poštovanju (svakoga pojedinca), empatiji, brižnosti... Uče ih koliko je važno voljeti kako sebe, tako i sve oko sebe!  Producentica: Blanka Barlović Scenarist, autor pjesama i animacija: Bojan Jambrošić Dramaturginja: Ivana Gudelj Redateljica: Ivana Radovčić Urednica: Silva Skender'
- eventId: 817057
  start: 2026-10-18T06:18:00Z
  stop: 2026-10-18T06:28:00Z
  title: 'Najbolji dan: Melani'
  subtitle: ' '
  description: 'Sedmogodišnja Melani ne želi dijeliti tatu s mlađom sestrom Rozali. Ona želi stalno biti s tatom pa je pozvala Digidigija u pomoć. Često djeca koja dobiju brata ili sestru imaju taj problem borbe za pažnju. Digidigi nije zabrinut jer ljubomora je normalna stvar, to je osjećaj kao i svaki drugi i svatko od nas ponekad je ljubomoran. To ne znači da smo loši ili da nekog ne volimo. A ljubomora je i korisna: pokazuje da nam nešto treba ili da nešto želimo. Sve što Melani treba učiniti jest glasno reći što je muči. Uz Digija, mamu i tatu Melani će naučiti kako se ljubav množi kad se dijeli. Kad imaš brata ili sestru, to nije upola manje ljubavi, nego dvostruko više.'
