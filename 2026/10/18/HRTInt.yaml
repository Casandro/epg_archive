- eventId: 872469
  start: 2026-10-18T14:15:00Z
  stop: 2026-10-18T14:25:00Z
  title: 'Najbolji dan: Melani'
  subtitle: ' '
  description: 'Sedmogodišnja Melani ne želi dijeliti tatu s mlađom sestrom Rozali. Ona želi stalno biti s tatom pa je pozvala Digidigija u pomoć. Često djeca koja dobiju brata ili sestru imaju taj problem borbe za pažnju. Digidigi nije zabrinut jer ljubomora je normalna stvar, to je osjećaj kao i svaki drugi i svatko od nas ponekad je ljubomoran. To ne znači da smo loši ili da nekog ne volimo. A ljubomora je i korisna: pokazuje da nam nešto treba ili da nešto želimo. Sve što Melani treba učiniti jest glasno reći što je muči. Uz Digija, mamu i tatu Melani će naučiti kako se ljubav množi kad se dijeli. Kad imaš brata ili sestru, to nije upola manje ljubavi, nego dvostruko više.'
