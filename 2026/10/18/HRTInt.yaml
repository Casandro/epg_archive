  start: 2026-10-18T05:20:00Z
  stop: 2026-10-18T06:10:00Z
  title: 'Klub čitatelja: Semezdin Mehmedinović - Kuća za pisanje'
  subtitle: ' '
  description: Može li se stvoriti dom ondje gdje se osjećamo kao stranci? Možemo li u književnosti kazati ono za što nam u zbilji nedostaju riječi? U ovoj epizodi Kluba čitatelja razgovaramo o romanu "Kuća za pisanje" Semezdina Mehmedinovića, nježnoj i slojevitoj priči o odnosu oca i kćeri, pripadanju, sjećanju i pisanju. Gdje prestaje autobiografija, a počinje fikcija? Kako fotografija čuva prošlost? Je li jezik naš jedini pravi dom? O tome će novi voditeljski par, Đurđica Čilić i Dražen Ilinčić, razgovarati s književnom kritičarkom Jagnom Pogačnik, germanisticom Milkom Car, glumcem Draženom Šivakom i fotografom Stankom Abadžićem. "Klub čitatelja" - razgovor koji počinje nakon posljednje stranice - s vama je i ove srijede.
