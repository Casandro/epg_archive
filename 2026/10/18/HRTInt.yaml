  description: U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu postati vrijedna uspomena na vrijeme koje su proveli zajedno. U ovoj epizodi Tristan i tata odlaze posjetiti farmu životinja.
