- eventId: 872465
  start: 2026-10-18T11:39:00Z
  stop: 2026-10-18T12:38:00Z
  title: 'Acoustic Project: Furious Dance'
  subtitle: ' '
  description: Godine 2012. ansambl Acoustic Project objavljuje svoj prvi CD pod nazivom Acoustic Project, koji je iste godine nominiran i za hrvatsku diskografsku nagradu "Porin". U kontinuitetu djelovanja ovaj sastav sjajnih glazbenika smjelo se suočava s raznim izazovima ne prežući niti od glazbenih eksperimenata, uvijek nastojeći doprijeti do novih i još neistraženih "predjela glazbe". Ansambl je po mišljenju publike i stručne kritike napravio iskorak u nova glazbena prostranstva uvođenjem u klasičnu glazbu nekih suvremenih, inovativnih formalnih struktura i instrumentacijskih postupaka drugačijih od onih uvriježenih te ju je time ne samo približio drugim glazbenim stilovima, nego učinio i pristupačnijom publici koja je otvorena za nove izazove te željna novih vidika i uzbudljivih i još neistraženih glazbenih prostranstava.
