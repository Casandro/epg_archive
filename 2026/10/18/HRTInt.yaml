- eventId: 872466
  start: 2026-10-18T12:38:00Z
  stop: 2026-10-18T13:20:00Z
  title: Dolina sunca, serija (27/210)
  subtitle: ' '
  description: 'Pri pospremanju Vjekine kancelarije Eva naleti na dokumentaciju Tomek i na Juranovu punomoć, ali ne pridodaje tome veliku važnost. Kristijan je zatečen ugledavši Jurana na novom motoru. Augustina zabrine Ladu kazavši joj da su dečki čudni jer jednom kad im se podaš više nisu zainteresirani. Kristijan polako gubi živce nad Juranovim bezobrazlukom, ali se ipak suzdržava. Juran je uvjeren da Kristijan neće reći Ivanu za motor. Irena pokušava s Kristijanom razgovarati o Adelinom daru, ali je on nervozan zbog Jurana. Sonja koristi priliku za neprimjeren komentar koji će sigurno iznervirati Irenu. Ivan potajno sprema iznenađenje za Adelin rođendan. Robert i Andrija krenu se prepucavati oko posla, što razljuti Evu. Eva nagovori Sofiju da odu na mali piknik opustiti se i odmoriti od svega. Nikola i Ruža spremaju se za Adelin rođendan, oni kao gosti i njihovi kolači Ivanovo su iznenađenje za Adelu. Irena je ljuta jer je imala posebno iznenađenje koje je sada zbog Ivana propalo. Nikola i Adela teško skrivaju poglede tijekom proslave. Eva je zaspala na pikniku, ne vidjevši da je zbog dječje spačke ostala bez odjeće, kad u tom trenu naiđe Kristijan...  Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
