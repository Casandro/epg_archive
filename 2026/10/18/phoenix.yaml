  title: Terra X-History
  subtitle: Inside Zweiter Weltkrieg
  widescreen: true
  hd: true
  description: Was erlebten U-Bootfahrer oder Panzersoldaten im Zweiten Weltkrieg? Das fragt sich Presenter Mirko Drotschmann und will es möglichst hautnah selbst erfahren. Er fährt dafür mit dem sowjetischen Panzer T-34, steigt in ein deutsches U-Boot aus dem Zweiten Weltkrieg und muss bei einer Übung der Bundesmarine ein Leck stopfen. Archivmaterial und Experten vor Ort ergänzen seine persönlichen Erlebnisse. Das Resultat sind tiefe Eindrücke vom Alltag der U-Bootfahrer und Panzersoldaten des Zweiten Weltkriegs. Ihre ständige Angst vor dem Tod lässt sich kaum nachempfinden, wohl aber die beklemmende Enge, in der sie kämpften.
