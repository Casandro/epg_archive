  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Philippinensee
  widescreen: true
  hd: true
  description: Im Sommer 1945 sind große Teile Japans zerstört. Täglich sterben zahllose Zivilisten. Trotzdem weigert sich die Führung zu kapitulieren. Die US-Armee bereitet eine Invasion vor, zögert aber noch. Zuerst soll die Insel Okinawa erobert werden. Sie liegt nahe genug an den Hauptinseln des Kaiserreichs, um von dort aus die entscheidenden Operationen durchzuführen. Beim Angriff auf Okinawa bleibt es zunächst vergleichsweise ruhig. Doch das ist nur die Ruhe vor einem blutigen Sturm.
