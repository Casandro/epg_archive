  title: 'Geheime Nazi-Expeditionen: Der Steinzeitmensch'
  subtitle: 'Geheime Nazi-Expeditionen: Der Steinzeitmensch'
  description: Der fanatische Rassismus der Nazis machte auch vor der Evolutionstheorie nicht Halt. Ihrer Überzeugung nach ließen sich die Ursprünge der Menschheit auf eine überlegene, urgermanische Entwicklungsform zurückführen. Sie wollten unbedingt belegen, dass ihr nordisches Ideal bereits in der Altsteinzeit die weniger fortschrittlichen Entwicklungslinien verdrängte. Um dies zu beweisen, führten die Nazis zahlreiche Ausgrabungen durch.
  widescreen: true
