  title: Lost Places - Folge 71
  subtitle: Lost Places - Folge 71
  description: An der Küste der taiwanesischen Insel Kinmen, wenige Kilometer von China entfernt, zeichnet sich ein Betonblock oberhalb der Klippen ab. Gebilde an einem nahegelegenen Strand weisen auf den Zweck des Gebäudes hin. Im Norden Schottlands ragen runde, fensterlose Türme aus der Eisenzeit in die Höhe. Ein verlassenes Dorf in der Schweiz birgt ein dunkles Geheimnis. Tief in den Bergen Alaskas finden sich Überreste einer bahnbrechenden Unternehmung der amerikanischen Vergangenheit.
  widescreen: true
- eventId: 803697
  start: 2026-10-18T15:33:00Z
  stop: 2026-10-18T16:30:00Z
  title: Lost Places - Folge 72
  subtitle: Lost Places - Folge 72
  description: In den Wäldern Kroatiens befindet sich ein ominöser Turm. Ein Gebäude am Rande des New Yorker Hafens wurde von der US-Regierung seit dem zweiten Weltkrieg bis in die 1960er Jahre für Transporte nach Europa eingesetzt. Im ländlichen Kolumbien liegen verborgen im Unterholz die Überreste einer Stadt. Eine prächtige Anlage am Ufer der Londoner Themse scheint nicht zur tristen Umgebung des Stadtviertels zu passen. Sie spielte eine wichtige Rolle für die Entwicklung der einst größten Stadt der Welt.
  widescreen: true
- eventId: 803698
  start: 2026-10-18T16:30:00Z
  stop: 2026-10-18T17:23:00Z
  title: Lost Places - Folge 73
  subtitle: Lost Places - Folge 73
  description: 'Auf der australischen Cockatoo-Insel befinden sich die Überreste eines einst berüchtigten Gefängnisses. Verborgen auf einer Insel im Golf von Mexico liegt eine rätselhafte Ruine, die zum Schutz gegen Piraterie errichtet wurde. Im bulgarischen Ljulin-Gebirge versteckt sich ein verlassener Gebäudekomplex: Die Bankja-Residenz wurde vom kommunistischen Parteichef Schiwkow in Auftrag gegeben. Im Norden Deutschlands ragen noch heute die Gemäuer einer einst streng geheimen U-Boot-Fertigungsanlage auf.'
  widescreen: true
- eventId: 803699
  start: 2026-10-18T17:23:00Z
  stop: 2026-10-18T18:15:00Z
  title: Lost Places - Folge 74
  subtitle: Lost Places - Folge 74
  description: 'Im Wald in Schottland verbirgt sich ein verlassenes Bauwerk, welches einst als Ausbildungsstätte für katholische Priester diente. Westlich von Berlin liegt eine verlassene Siedlung: In Krampnitz wurden während des zweiten Weltkriegs Soldaten ausgebildet. Tief in der Atacama-Wüste befindet sich die Überreste der Stadt Chacabuco, welche Chiles industrielle Vergangenheit widerspiegeln. Eine Geisterstadt zwischen Rom und Neapel: Im Jahr 1943 wurde San Pietro von der deutschen Armee zerstört.'
  widescreen: true
- eventId: 803700
  start: 2026-10-18T18:15:00Z
  stop: 2026-10-18T19:10:00Z
  title: Lost Places - Folge 75
  subtitle: Lost Places - Folge 75
  description: 'An der Südspitze von Bali liegt eine Ansammlung von mit Graffiti bedeckten Ruinen. In Belgien befinden sich die Überreste einer kreisrunden Festung aus Stahlbeton, die zur Verteidigung während des Ersten Weltkriegs diente. Das Greenbrier Ressort in den USA: Eine noble Einrichtung, die unterirdisch an eine geheimnisvolle Anlage angebunden ist. In Abu Dis, am Rande Jerusalems, erinnert die verlassene Ruine des Palästinensischen Parlaments an den verlorenen Frieden.'
  widescreen: true
- eventId: 803701
  start: 2026-10-18T19:10:00Z
  stop: 2026-10-18T20:05:00Z
  title: Lost Places - Folge 76
  subtitle: Lost Places - Folge 76
  description: 'Nahe der US-Kleinstadt Bethlehem ragen zerfallene Türme auf: Der früher dort ansässige Industriegigant beschäftigte einst 30.000 Mitarbeitende. Die geheimnisumwobene Ruine einer Kirche in England ist umgeben von einem Friedhof mit verblüffenden Grabsteinen. In einem polnischen Dorf verbergen sich die Ruinen eines einst prunkvollen Schlosses, das als Krankenhaus und Sanatorium erbaut wurde. Unweit der Stadt Jerusalem befindet sich das Geisterdorf Lifta, welches im 20. Jahrhundert zerstört wurde.'
  widescreen: true
- eventId: 803702
