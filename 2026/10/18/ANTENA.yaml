  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 6)'
  subtitle: Leo, syn Candice, okłamuje matkę. Chłopak twierdzi, że zdobył świadectwo szkolne, gdy tak naprawdę jest zawieszony w obowiązkach za bójkę z innymi uczniami.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2018
    Reżyseria: Adeline Darraux
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, François-Dominique Blin, Yeelem Jappain
    Leo, syn Candice, okłamał matkę. Chłopak twierdził, że zdobył świadectwo szkolne, gdy tak naprawdę był zawieszony w swoich obowiązkach za wdanie się w bójkę z innymi uczniami. Początek weekendu był pod wieloma względami niezbyt udany, jednak to nic w porównaniu z tym, co jeszcze czeka Candice. Tego sobotniego poranka szkoła zdaje się być całkowicie opuszczona. Jakaś kobieta wzięła uczniów za zakładników?
