    Na wiejskiej drodze, o poranku, biegacz odkrywa ciało młodej kobiety, przy którym waruje rasowy pies. Grupa Renoir odkrywa, że ofiara miała ciekawe hobby: brała udział w konkursach skoków psów, na których często ze swoim pupilem wygrywała. Candice musi przeniknąć w szeregi klubu ofiary wraz ze swoim ukochanym psem o imieniu Fun, który za dużo nie potrafi?
