  title: hr1 am Sonntagmorgen - "Konservativ sein? Was wir bewahren wollen"
  description: |-
    In einer Welt des rasenden Wandels regt sich die Sehnsucht nach dem Bleibenden. Es stellt sich die Frage: was möchten wir für die Zukunft unbedingt bewahren? Für unsere Kinder, für unsere Gesellschaft? Es geht um Werte, um Kultur, alte Handwerke, Dialekte, Denkmäler, um die Bewahrung der Schöpfung. Wir möchten heimisch bleiben in unserer Welt.

