  title: ARD Musikclub Soul
  description: Übernahme von SWR1. Soul ist Musik ohne Kompromisse, Soul geht direkt ins Herz. Wir grooven entspannt durch Jahrzehnte mit großartiger Musik. Ob Uptown Soul, Balladen, Disco, Blues - wir nehmen uns Zeit für ganz viel Gefühl, Rhythmus und einmalige Stimmen, von Aretha Franklin bis Erykah Badu, von Ray Charles bis Michael Kiwanuka. Natürlich schauen wir auch über Genre-Grenzen und bringen neue spannende Musik und die Geschichten dazu.
