  subtitle: 'C''est l''une des grandes artistes plasticiennes de l''époque, dont les oeuvres profondes et drôles s''exposent à travers le monde...  '
  description: "C'est l'une des grandes artistes plasticiennes de l'époque, dont les oeuvres profondes et drôles s'exposent à travers le monde... La géniale Sophie Calle a fait entrer l'art dans la vie, à travers ses installations sur le sommeil, les ruptures, le deuil... Elle est notre invitée alors qu'elle publie « Des histoires vraies » : histoires parfois légères mais aussi sérieuses ou dramatiques. Olivia Ruiz fête ses 25 ans de carrière et s'apprête à se produire dans le prestigieux cadre du musée du Louvre, à l'occasion d'un spectacle en hommage au peintre espagnol Murillo. Elle sort également un livre, « Vamos ! ». Mais qui était Berthe Brincour ? Alex Vizorek nous dit tout de la peintre luxembourgeoise. \n\nInvitées : Sophie Calle, artiste photographe et plasticienne ; Olivia Ruiz, autrice-compositrice-interprète, actrice et romancière\n\nPrésentation : Ali Baddou. Avec la participation d'Alex Vizorek, Nathalie Lesage, Fabrice Bousteau, Margaux Beytout, Charly Voodoo\n "
