- eventId: 849576
  start: 2026-10-18T04:00:00Z
  stop: 2026-10-18T06:00:00Z
  title: Partitury
  description: Na návštěvě Olomouce. Na varhanním festivalu ve sv. Mořici, v Kostele Panny Marie Sněžné na festivalu Baroko i na koncertě Moravské filharmonie Olomouc. Program Na Bachově životní pouti, varhany Leo van Doeselaar. - Mauritius Vogt a Duchovní hudba západočeských skladatelů. - Symfonie č. 98 B dur Josepha Haydna v nastudování Zsolta Hamara. Připravila Renáta Spisarová.
- eventId: 849634
  start: 2026-10-18T06:00:00Z
  stop: 2026-10-18T06:30:00Z
  title: Spirituála
  description: Apoštol Pavel očima levicových filosofů. Duchovní Evropa s Martinem C. Putnou. S profesorem Martinem C. Putnou procházíme spletitými duchovními dějinami Evropy napříč národy i náboženskými konfesemi.
- eventId: 849635
  start: 2026-10-18T06:30:00Z
  stop: 2026-10-18T07:00:00Z
  title: Krédo
  description: Víra v ulicích velkoměsta. Spiritualita a náboženství v dialogu. O spiritualitě v nás i za horizontem, o hledání přesahů i spodních proudů, o tom, proč a v co věříme.
- eventId: 849636
  start: 2026-10-18T07:00:00Z
  stop: 2026-10-18T08:00:00Z
  title: Bohoslužba
  description: Přímý přenos bohoslužby Římskokatolické církve z kostela sv. Bartoloměje v Pardubicích. Slouží P. Jan Uhlíř.
- eventId: 849637
  start: 2026-10-18T08:00:00Z
  stop: 2026-10-18T09:00:00Z
  title: Duchovní hudba
  description: 'Adam Michna z Otradovic: Missa I. O nové nahrávce z produkce Českého rozhlasu hovoří s uměleckým vedoucím souboru Czech Ensemble Baroque Romanem Válkem Alena Maršíková Michálková. (repríza pořadu z roku 2023)'
- eventId: 849695
  start: 2026-10-18T09:00:00Z
  stop: 2026-10-18T10:00:00Z
  title: Radioseriál
  description: 'Pavel Molek: Smetana. 3. část - Braniboři. Dramatická minisérie o životě v hudbě. Režie Lukáš Hlavica a Klára Novotná. Hudební a zvukový design Jakub Rataj. Dramaturgie Klára Novotná. Účinkují: Jaroslav Plesl, Klára Suchá, Anežka Šťastná, Jaromír Meduna, Václav Neužil, David Novotný, Ondřej Brousek a další. Natočeno v roce 2024.'
- eventId: 849696
  start: 2026-10-18T10:00:00Z
  stop: 2026-10-18T10:05:00Z
  title: Polední zvony
  description: Z věže evangelického kostela v Jimramově, zvon odlitý v r. 1888 Vojtěchem Hillerem. Připravil Radek Rejšek.
- eventId: 849697
  start: 2026-10-18T10:05:00Z
  stop: 2026-10-18T10:20:00Z
  title: Svět poezie
  description: 'Zeno Kaprál: Strmilovské listy. Ze stejnojmenné básnické sbírky pořad připravil a režii má Luboš Koníř. Účinkuje Martin Hruška (13 min). Natočeno v roce 2013.'
- eventId: 849698
  start: 2026-10-18T10:20:00Z
  stop: 2026-10-18T11:30:00Z
  title: Polední koncert
  description: Zpívá Richard Novák. Výběr z nahrávek legendárního operního a písňového interpreta k jeho letošním 95. narozeninám. Písňový a operní repertoár z díla F. Schuberta, J. Křičky, A. Dvořáka, B. Smetany, W. A. Mozarta, P. I. Čajkovského, G. Verdiho a L. Janáčka. Připravil Jan Hlaváč.
- eventId: 849699
  start: 2026-10-18T11:30:00Z
  stop: 2026-10-18T12:00:00Z
  title: Povídka
  description: 'Tommaso Landolfi: Zatmění, Sklepní brouk. Pozorování zatmění Slunce s dlouhovlasou Giovannou a osamělý muž sledující v prázdném domě na podlaze malou berušku. Dva emotivně fantaskní příběhy pozoruhodného solitéra italské literatury z knižního výboru Rozprava o vyšších systémech aneb Švábí moře. Připravil Dominik Mačas. Překlad Anna Kareninová. Účinkuje Pavel Čeněk Vaculík. Režie Radim Nejedlý (26 min).'
- eventId: 849767
  start: 2026-10-18T12:00:00Z
  stop: 2026-10-18T13:00:00Z
  title: Krásné hlasy
  description: Na cestě Evropou 18. věku. Po čtvrté a naposledy se setkáváme s anglickým historikem Charlesem Burneym na jeho poznávací výpravě. S autorem proslulého Hudebního cestopisu tentokrát pojedeme z Vídně přes Prahu a německá města zpět do Holandska. K 300. výročí autorova narození připravila a slovem provází Daniela Čermáková.
- eventId: 849768
  start: 2026-10-18T13:00:00Z
  stop: 2026-10-18T14:18:00Z
  title: Hra pro pamětníky
  description: 'Jiří Kolář: Chléb náš vezdejší. Rozhlasová koláž podle poetické hry Jiřího Koláře. Scénická hudba Daniel Forró. Dramaturg Jaromír Ptáček. Režie Petr Dufek. Účinkují: Luboš Ondráček, Radmila Merličková, Věra Zástěrová, Miroslav Středa, Eva Jelínková, Jaroslav Kuneš a další. Natočeno v roce 1994.'
- eventId: 849769
  start: 2026-10-18T14:18:00Z
  stop: 2026-10-18T14:30:00Z
  title: 'Antonio Vivaldi: Čtvero ročních dob op. 8 - Jaro'
  description: Koncert č. 1 E dur pro housle a smyčcový orchestr hrají Václav Hudeček a Virtuosi di Praga, řídí Pavel Kogan, umělecký vedoucí Oldřich Vlček.
- eventId: 849770
  start: 2026-10-18T14:30:00Z
  stop: 2026-10-18T15:00:00Z
  title: Klapka
  description: Rjúiči Sakamoto. Oscarový skladatel nejen k Bertolucciho filmům, spoluzakladatel legendárního Yellow Magic Orchestra a hlavně mistr sofistikovaných klavírních melodií. Výběr ze Sakamotovy filmové hudby od 80. let po současnost představí Kristýna Šrámková. (repr. 23.10. ve 22.30)
- eventId: 849821
  start: 2026-10-18T15:00:00Z
  stop: 2026-10-18T16:00:00Z
  title: Vizitka
  description: Vendulka Vaňková, harfistka a pedagožka ZUŠ. Získala cenu Akademie Menart pro výjimečného pedagoga ZUŠ v kategorii Pedagog legenda. Léta hrála jako harfistka v orchestru Státní opery, dnes už ale výhradně učí v ZUŠ Jana Hanuše v pražském Břevnově a v ZUŠ na Zbraslavi. "Za svůj úspěch považuju, že moje studentky studují práva nebo medicínu a do toho skvěle hrají na harfu," říká ve Vizitce propagátorka hry na tento nástroj a zakladatelka Mezinárodní harfové soutěže prof. Karla Patrase. Jak dlouho se ladí harfa? Kdo z historických postav tento nástroj zviditelnil? A jaké to pro ni bylo hrát na svatbách? Zkraje září se Vendulky Vaňkové ptal Ondřej Cihlář. Repríza z 8. 9. 2026
- eventId: 849822
  start: 2026-10-18T16:00:00Z
  stop: 2026-10-18T16:30:00Z
  title: Jazzový podvečer
  description: Největší jazzové kapely a jejich velké hudební možnosti v hledáčku jazzového skladatele a pedagoga. Tuto neděli uvádí Jan Hála.
- eventId: 849823
  start: 2026-10-18T16:30:00Z
  stop: 2026-10-18T17:00:00Z
  title: Četba na pokračování
  description: 'Markéta Pilátová: Tsunami blues (4/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkují Dana Černá a Jiří Schwarz. Režie Vlado Rusko (29 min). Natočeno v roce 2015.'
- eventId: 849824
  start: 2026-10-18T17:00:00Z
  stop: 2026-10-18T17:30:00Z
  title: Taktovka
  description: Concertino Praga slaví 60 let. O šedesáti letech mezinárodní soutěže mladých hudebníků, jejím významu a dlouholetém propojení se Symfonickým orchestrem Českého rozhlasu budou hovořit Kateřina Konopásková a dirigent Robert Kružík. Připravila Jana Trojanová.
- eventId: 849825
  start: 2026-10-18T17:30:00Z
  stop: 2026-10-18T20:00:00Z
  title: Koncert SOČR
  description: V přímém přenosu z Dvořákovy síně Rudolfina spolu se Symfonickým orchestrem Českého rozhlasu oslavíme šedesát let existence soutěže Concertino Praga. Na programu bude Koncert pro dvoje housle a orchestr d moll, BWV 1043 J. S. Bacha, Koncert pro klavír, trubku a smyčcový orchestr č. 1 c moll, op. 35 Dmitrije Šostakoviče, dále Koncert pro lesní roh a orchestr B dur, op. 91 Reinholda Gliera a Etuda ve formě valčíku, op. 52 č. 6 Camille Saint-Saënse (arr. Eugene Ysaye). Pod dirigentským vedením Roberta Kružíka jako sólisté vystoupí houslisté Dmitrij Sitkoveckij, Václav Hudeček a Daniel Matejča, dále hornista Radek Baborák, klavírista Ivo Kahánek a trumpetista Filippo Lombardi. Přímý přenos uvádí Jana Trojanová, živě jej přenáší ČRo Vltava.
- eventId: 849886
  start: 2026-10-18T20:00:00Z
  stop: 2026-10-18T21:00:00Z
  title: Futurissimo
  description: Století Mortona Feldmana. Sto let od narození amerického skladatele, tvůrce zcela originálního hudebního jazyka, jehož dílo lze zároveň poměrně těžko označit jakoukoliv nálepkou. Hudba uhrančivá, okouzlující, jen zdánlivě neměnná. Ve Futurissimu zazní sondy do obsáhlého katalogu skladeb Mortona Feldmana. Připravil Matěj Kratochvíl. Repríza z 26. 4. 2026
- eventId: 849969
  start: 2026-10-18T21:00:00Z
  stop: 2026-10-18T21:30:00Z
  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (1/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová, Pavel Soukup, Věra Galatíková, Zlata Adamovská a Josef Velda. Režie Petr Adler. Natočeno v roce 1990 (30 min).'
