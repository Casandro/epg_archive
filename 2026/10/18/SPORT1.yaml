  title: Die PS Profis Schule Baby Bomber
  subtitle: Die PS Profis Schule Baby Bomber
  description: 'Frohe Kunde für alle Fans der "PS PROFIS", denn es gibt eine neue SPORT1-Sendung: In "Die PS PROFIS - Schule" hilft Experte Sidney Hofmann Zuschauer-Kandidaten, die dringend einen fahrbaren Untersatz brauchen, aber keine Ahnung von Gebrauchtwagen haben. Sid zeigt, worauf man beim Kauf grundsätzlich achten muss und welche Schwachstellen die verschiedenen Modelle haben. Nach ihren Lektionen auf der Dortmunder Schulbank müssen Sidneys Schützlinge die Theorie in die Praxis umsetzen: Mit Hilfe der versteckten Anweisungen des "PS PROFIS" per Funk geht es zum Gebrauchtwagenkauf. Auch wenn es viel zu Lernen gibt, kommt der Spaßfaktor natürlich trotzdem nicht zu kurz. Kandidatin der zweite Folge ist die frischgebackene Zwillingsmama Mandy, die dringend ein Familien-Auto braucht. Auf der Suche nach dem "Baby Bomber" greift Sidney natürlich gerne unter die Arme.'
  widescreen: true
