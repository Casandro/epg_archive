  title: Hocus Pocus
  subtitle: Gruselkomödie, USA 1993
  description: 'Regie: Kenny Ortega. Darsteller: Bette Midler, Sarah Jessica Parker, Kathy Najimy. Geister? Alles Unfug! Hexen? Gibt es nicht! Da ist sich Max Dennison ganz sicher. Als seine Eltern ausgerechnet nach Salem ziehen, bleibt Max ganz cool. Die sagenumwobene Geisterstadt kann ihm keine Angst einjagen. Als seine neuen Schulkameraden von einem alten Haus berichten, in dem es spukt, kann der Junge nur müde lächeln. Max beschließt den Beweis anzutreten, dass es weder Geister, Hexen noch Gespenster gibt. Er lädt die umschwärmte Allison zu einem Ausflug in das gefürchtete Spukhaus, in dem einst die drei Sanderson-Schwestern gelebt und gezaubert haben sollen, ein. Ausgerechnet an Halloween! Doch das stört Max wenig. Im Schlepptau hat das Pärchen Max'' kleine Schwester Dani, neugierig und mächtig vorlaut. Kaum ist das Trio im Sanderson-Haus angelangt, geschieht sogleich schier Unglaubliches: Max öffnet ein angestaubtes altes Zauberbuch - und erweckt dadurch nichtsahnend die drei Hexen wieder zum Leben. Jetzt scheint alles aus zu sein! Die Sanderson-Schwestern, die im Jahre 1693 hingerichtet wurden, sinnen auf Rache. Vor allem aber haben sie mächtig Hunger - und zwar auf Menschenfleisch, insbesondere auf Kinder. Max und die Mädchen müssen sich mächtig ins Zeug legen, um den Hexen zu entkommen und die Stadt vor ihrem bösen Spuk zu bewahren ...'
  widescreen: true
