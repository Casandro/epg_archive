  subtitle: Vergissmeinnicht Animationsserie, F/COR/J/USA 2019
  description: Folge 62, Ladybug und Cat Noir erwachen ohne jede Erinnerung in einem Aufzug des Montparnasse Hochhauses. Sie verwandeln sich voreinander wieder in Marinette und Adrien zurück. Auch ihre Kwamis scheinen ihr Gedächtnis verloren zu haben, Plagg lässt sie sogar einfach im Stich. Während sie Stück für Stück versuchen herauszufinden, was ihnen widerfahren ist, bemerken sie, dass Oblivio, ein mysteriöser Bösewicht, in dem Hochhaus sein Unwesen treibt. Werden unsere beiden Helden es schaffen, ihre verlorenen Erinnerungen zurückzuerlangen und Oblivio zu besiegen?
