  title: Yuna & Stitch
  subtitle: Die Stitch-Invasion Animations-Serie, J/COR/CHN 2008
  description: Folge 8, Kenny hat Yuna gerade dann fotografiert, als sie niesen musste. Als Yuna hört, dass Kenny das Foto beim Wettbewerb des peinlichsten Fotos einreichen will, setzt sie alles daran, ihrerseits ein peinliches Foto einzusenden, das noch peinlicher als das von Kenny ist. Sie borgt sich Jambas Kamera, oder das, was Yuna für eine Kamera hält. Der Apparat macht zwar auch Fotos, er schafft aber darüber hinaus Klone der aufgenommenen Objekte oder Personen. Da Yuna nur Stitch aufgenommen hat, rennen also nach kurzer Zeit Hunderte von Stitches herum, die die Stadt in' s Chaos stürzen.
