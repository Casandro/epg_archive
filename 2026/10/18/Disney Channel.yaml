  description: 'Regie: Mark Andrews, Brenda Chapman, Steve Purcell. Darsteller: Kelly MacDonald, Billy Connolly, Emma Thompson. Inmitten der rauen und geheimnisvollen Wildnis der schottischen Highlands soll Merida eigentlich ihrer Rolle als elegante junge Königstochter gerecht werden. Doch ebenso wie ihre übermütigen kleinen Drillingsbrüder hat auch der rebellische Rotschopf nichts als Flausen im Kopf.Entgegen den Anweisungen ihrer Mutter, Königin Elinor, zieht es Merida vor, ihre eigenen Wege zu gehen, sich im Bogenschießen zu üben und in der freien Natur mit ihrem Pferd Angus mutig in immer neue Abenteuer zu stürzen.'
