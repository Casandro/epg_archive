  title: Yuna & Stitch
  subtitle: Mama Stitch Animations-Serie, J/COR/CHN 2008
  description: Folge 7, Beim Karate-Training mit Stitch im Wald fällt Yuna auf einmal ein ziemlich großes Ei in die Hände. Yuna schlägt vor, mit diesem Ei ein leckeres Frühstück zu veranstalten. Grandma allerdings ist entsetzt, dass die beiden das Ei aus dem Wald mitgenommen haben und befiehlt den beiden, das Ei sofort dorthin zurückzubringen. Dies klappt allerdings nicht so ganz und schließlich müssen sie das Ei noch mal mit nach Hause nehmen, wo nachts dann auch ein Küken dem Ei entschlüpft. Da es zuerst Stitch sieht, ist es der Meinung, dass Stitch seine Mama ist und zeigt sich dementsprechend anhänglicht.
  widescreen: true
