  title: Taran und der Zauberkessel
  subtitle: Zeichentrickfilm, GB/USA 1985
  description: 'Regie: Ted Berman, Richard Rich. Darsteller: Grant Bardsley, Susan Sheridan, Freddie Jones. Taran träumt davon, ein ruhmreicher Krieger zu sein. Bald erhält der Schweinehirte eine Chance, sich zu beweisen. Er muss einen bösen König besiegen, der die Welt zu unterjochen versucht. Bei seinen gefährlichen Abenteuern stehen ihm ein magisches Zauberschwert, die liebreizende Prinzessin Eilonwy und ein putziges Schweinchen mit übersinnlichen Fähigkeiten zur Seite. - Spektakuläres Fantasy-Zauberkino.'
