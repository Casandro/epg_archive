  title: Yuna & Stitch
  subtitle: Der Glücksbringer Animations-Serie, J/COR/CHN 2008
  description: 'Folge 9, Yuna kann es nicht fassen: als sie aufwacht ist ihr Haar zu einer Säule frisiert worden und nicht nur das, allen Klassenkameraden wurde ebenfalls eine neue Frisur verpasst. Natürlich hat sie zuerst Stitch in Verdacht, aber schließlich stellt sich heraus, dass Warracchi,-ein Yokai-, für die ganzen Streiche verantwortlich ist. Und irgendwie ist Warracchi auch niemand böse, da eine Legende besagt, dass Warracchi dem Haus, wo er sich niederlässt Glück bringt. Als Stitch hört, dass Warracchis Streiche die Leute glücklich machen, beginnt er auch, allen Streiche zu spielen.'
