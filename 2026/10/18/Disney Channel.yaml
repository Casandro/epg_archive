  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Das Miraculous der Schlange Animationsserie, F/COR/J/USA 2019
  description: Folge 63, Bei den Bandproben von Kitty Section kommen sich Marinette und Luka näher. Doch als Adrien und Kagami gemeinsam zur Probe kommen, wird Marinette eifersüchtig und verliert das Interesse an Luka. Als Jagged Stone auf der Suche nach Ersatz für die Gitarristin, die er gerade gefeuert hat, aufkreuzt, schlägt Marinette nicht ihren Gitarristen Luka sondern Adrien vor, obwohl er Klavier spielt. Das ist der Moment, wo Desperada auftaucht, die akumatisierte Ex-Gitarristin von Jagged Stone. Mit Hilfe ihrer Instrumente kann sie andere in Sticker verwandeln und hat es besonders auf Adrien abgesehen...
