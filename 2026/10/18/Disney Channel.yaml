  subtitle: Marinette, die Weihnachtselfe Animationsserie, F/COR/J/USA 2019
  description: Folge 64, Als Marinette auf Ninos Bruder aufpasst, entdeckt dieser ihren Bestand an Geschenken für Adrien. Verlegen lässt sie ihn glauben, dass sie eine von Santa Claus' Elfen ist. Als Chris sie daraufhin nach einem Geschenk fragt und sie ihm dies verwehrt, wird er von Hawk Moth akumatisiert. Bewaffnet mit einer magischen Schneekugel schickt er gigantische Spielzeuge los, um im verschneiten Paris Verwüstungen anzurichten und Santa Claus zu finden, damit er vorzeitig sein Weihnachtsgeschenk bekommt. Ladybug und Cat Noir müssen dem jungen Schurken klarmachen, dass Weihnachten nur einmal im Jahr ist.
