  title: Kochen mit Martina und Moritz
  subtitle: Herbstküche - Rezepte für Genießer
  description: 'Heute feiern Martina und Moritz den Herbst. Die Jahreszeit, die die schönsten und besten Zutaten in die Küche liefert. Im Herbst quellen die Märkte geradezu über, Gemüse und Obst gibt es in allen Formen und Farben, die Wahl fällt schwer. Deshalb haben die beiden Lieblingsprodukte für ihre Rezepte ausgesucht. Da gibt''s ein Kartoffeldurcheinander der ganz neuen Art, mit Kohlröschen und Schwarzwurzeln. Sie backen Gemüse im Ofen: bunte Wurzeln - also Möhren und Bete in allen Farben - und servieren es als rein vegetarisches Gericht. Sie reichen aber denen, die Lust auf Fleisch haben, zartes Reh in köstlicher Rotweinsauce dazu.'
