  title: 'Erlebnis Erde: Magisches Frankreich - Von der Loire ins Elsass (2/4)'
  subtitle: Ein Film von Heike Grebe und Michael Riegler
  description: Im Schatten der berühmtesten Monumente Frankreichs tobt das geheime Leben der Tiere. Im Zentrum des Landes liegt das Tal der Loire, bekannt für seine prachtvollen Schlösser - und für einen der letzten wilden Flüsse Europas. In einem versteckten Seitenarm hat ein Fischotter-Weibchen ihren Bau gegraben. Drei winzige Welpen krabbeln über ihren Bauch, blind, aber zielsicher auf der Suche nach Milch. Schon bald wird sie sie ins Wasser führen - doch die ersten Begegnungen mit dem Nass verlaufen zögerlich.
