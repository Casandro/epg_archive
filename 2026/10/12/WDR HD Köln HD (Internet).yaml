  title: 'Rockpalast: Long Distance Calling - Rock Hard Festival 2019'
  subtitle: Aufzeichnung vom 09.06.2019 aus dem Amphitheater, Gelsenkirchen
  description: |-
    Long Distance Calling werden nicht umsonst von der Kritik gefeiert: Seit ihrer Gründung im Jahr 2006 überzeugen die Münsteraner auf ihren vorwiegend instrumentalen Alben mit der Virtuosität wahrer Klangkünstler.
    Das Münsteraner Quartett Long Distance Calling, bestehend aus den Gitarristen David Jordan und Florian Füntmann, Bassist Jan Hoffman und Schlagzeuger Janosch Rathme, hat sich vom mitreißenden Post-Rock früher Alben bis hin zu den experimentierfreudigen und genreübergreifenden Alben der letzten Jahre immer weiter entwickelt und steht für fantasievollen, progressiven, heavy Sound.
