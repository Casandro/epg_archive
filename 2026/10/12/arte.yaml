  stop: 2026-10-12T01:55:00Z
  title: Turbulenz
  subtitle: Frankreich 2023
  subtitled: true
  description: 'Die französisch-amerikanische Regisseurin Anne Aghion war zehn Jahre alt, als ihre Mutter starb. In einer Reihe liebevoller filmischer Briefe an die Verstorbene erkundet sie die Auswirkungen dieses Verlustes und geht den verdrängten Erinnerungen ihres Vaters an den Holocaust in Frankreich nach. Gleichzeitig setzt sich die engagierte Filmemacherin mit ihrem eigenen Leben auseinander: In ihren Arbeiten gibt sie den Überlebenden von Extremsituationen eine Stimme. Der in zwölf Jahren entstandene Dokumentarfilm ist eine Weltreise in faszinierenden Bildern und zugleich eine Sinnsuche angesichts des erlittenen Leids.'
- eventId: 1104316
  start: 2026-10-12T01:55:00Z
  stop: 2026-10-12T03:05:00Z
  title: Kanada - Die Rückkehr der Blackfoot
  subtitle: Deutschland 2024
  description: In der Provinz Alberta in Kanada ist die Landschaft in vielen Regionen noch unberührt und von atemberaubender Schönheit. Hier sind die Blackfoot zu Hause. Sie gehören zu den First Nations in Kanada. Ihr Stammesgebiet erstreckte sich einst über 160.000 Quadratkilometer, eine Fläche fast halb so groß wie Deutschland. Aufgrund eines umstrittenen Vertrages mit den Weißen behielten sie aber nur noch das Wohnrecht in drei kleinen Reservaten. Die Blackfoot waren Jäger, Sammler und begnadete Reiter.
- eventId: 1104338
  start: 2026-10-12T03:05:00Z
  stop: 2026-10-12T03:55:00Z
  title: Menopause Mystery
  subtitle: Dänemark 2025
  subtitled: true
  description: |-
    Wer sind wir, wenn sich alles verändert? Mit wissenschaftlicher Präzision und persönlicher Offenheit begibt sich Filmemacherin Louise Unmack Kjeldsen auf eine emotionale Reise in das Mysterium der Menopause. Sie trifft führende Forscherinnen und erzählt gemeinsam mit anderen betroffenen Frauen aus aller Welt offen über ihre Erlebnisse mit starken Symptomen der Menopause.

    "Menopause Mystery" bricht Tabus, deckt Mythen und Fehlinformationen auf und rückt die Menopause in ein neues Licht.
