  title: 360° Reportage
  subtitle: 'Kanada: Frauenpower im Helikopter'
  subtitled: true
  description: Kanada, ein Land, so groß wie der gesamte europäische Kontinent. Der Hubschrauber ist oft die einzige Verbindung für die Menschen in ihrer Umgebung, mehr als 3.000 zertifizierte Hubschrauberpiloten gibt es - und nur fünf Prozent davon sind Frauen. Wer sind diese Pionierinnen, die der Kälte, Isolation und Unvorhersehbarkeit trotzen, um außergewöhnliche Einsätze zu bewältigen?
