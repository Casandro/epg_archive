  subtitle: Walnüsse
  subtitled: true
  description: 'Von der Römerzeit bis heute prägt sie Europas Kulturlandschaft - die Walnuss begeistert mit intensivem Aroma und erstaunlicher Vielseitigkeit. In der französischen Dauphiné pflegt Familie Berger einen der ältesten Walnusshaine der Region. Köchin Lucie Fischer-Chapalain macht aus den aromatischen Nüssen unerwartete Kompositionen: cremiges schwarzes Walnusseis und duftende Walnuss-Focaccia.'
