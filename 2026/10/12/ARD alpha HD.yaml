  title: Willi wills wissen (55)
  subtitle: Wer fühlt den Zähnen auf den Zahn?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Willi besucht die Münchener Zahnärztin Ana. Und ehe er es sich versieht, sitzt er selbst auf dem Behandlungsstuhl, Widerstand ist zwecklos. Jeden einzelnen Zahn sieht sich Ana ganz genau an. Glück gehabt, Willi - alles in Ordnung!
    Willi möchte auch noch wissen, wie das mit den Spangen funktioniert. Dazu macht der Zahnarzt als erstes einen Abdruck des Gebisses. In Gips ausgegossen, dient der Abdruck Zahntechniker Rudi als Vorlage für eine herausnehmbare Spange.
