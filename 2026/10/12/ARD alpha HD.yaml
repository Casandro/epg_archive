  audiodesc: true
  description: Herbstzeit ist Wein-Zeit - nirgends lässt sich diese Jahreszeit besser spüren als in den prächtigen Farben des Schilcherlandes im Südwesten der Steiermark. Für seine Dokumentation hat Filmautor Wolfgang Niedermair die Region mit der Kamera bereist und zeigt, was diese Jahreszeit für die bäuerliche Bevölkerung bedeutet. Im Weingut Klug in St. Stefan ob Stainz ist die Weinlese voll im Gang. Neben dem Weingarten gibt es hier auch eine Kastanienplantage.
