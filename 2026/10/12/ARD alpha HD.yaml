  title: Hannah Arendt - Das Mädchen aus der Fremde (1/5)
  subtitle: Ich lasse das Leben auf mich regnen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die fünfteilige Serie über Hannah Arendt zeigt ihr Leben, angelehnt an ihre Werke, ihre bedeutenden Beziehungen und Freundschaften, die gleichzeitig auch immer Reflektoren ihrer Arbeiten waren. Die Folgen setzen sich aus inszenierten Sequenzen und dokumentarischen Teilen zusammen. Der rege Briefwechsel Hannah Arendts mit Freunden und Kollegen wird als Gespräche in einem Raum à la "Dogville" mit Schauspielern dargestellt. Das Interview "Zur Person", das Günter Gaus 1964 mit Hannah Arendt geführt hat, ist Selbstzeugnis und Dokument zugleich und wird als immer wiederkehrendes Element in jede Folge thematisch eingebunden.
