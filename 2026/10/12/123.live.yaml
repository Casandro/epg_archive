  title: Die Superbullen
  subtitle: Die Superbullen
  description: Franz hat Pech. Nach einem Motorradunfall wird der Superbulle in den Krankenstand versetzt. Sein Rivale, der unfähige Bulle Kleiber, übernimmt das Kommando. Als ein junges Paar mit einer Millionenerbin ins Schloss zieht, heuert Franz als Hausmeister an, um ein Mordkomplott aufzudecken. Der Onkel des Mädchens hat mörderische Pläne. Verdächtigungen und Indizien passen perfekt zusammen. Doch Franz wird selbst für den Mörder gehalten, bevor er die wahren Täter entlarven kann. Ös 1997
