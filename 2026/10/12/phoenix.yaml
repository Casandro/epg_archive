  title: Afrikas Berge
  subtitle: 'Südafrika: Drakensberge'
  widescreen: true
  hd: true
  description: Südafrika ist nicht nur durch weite Savannen, sondern auch durch beeindruckende Gebirgszüge geprägt. Die Felsen der Drakensberge, die an Drachenzacken erinnern, gaben der größten Erhebung ihren Namen. Die Zulu nennen diese majestätischen Berge uKhahlamba, die Wand der aufgestellten Speere. Damit beschreiben sie das sogenannte Amphitheater, die berühmteste Felswand der Drakensberge. Sie erstreckt sich über mehrere Kilometer Länge und bis zu 1.200 Höhenmeter. Zahlreiche Wasserfälle stürzen hier in die Tiefe.
- eventId:
  - 1103730
  - 892437
  start: 2026-10-12T17:15:00Z
  stop: 2026-10-12T18:00:00Z
  title: Afrikas Berge
  subtitle: 'Uganda: Ruwenzori-Gebirge'
  widescreen: true
  hd: true
  description: 'Der Anblick ist ebenso atemberaubend wie unerwartet: Unmittelbar nördlich des Äquators erheben sich aus dem Tropenwald in Uganda mit Gletschern bedeckte Berge das Ruwenzori-Gebirge. Es ist mit 5.109 Metern das dritthöchste Gebirge Afrikas und bildet die Grenze zur Demokratischen Republik Kongo. 1991 wurde auf der ugandischen Seite der Ruwenzori-Mountains-Nationalpark gegründet, um den Regenwald und die Tiere, die darin leben, zu schützen.'
