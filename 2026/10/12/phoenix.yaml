  title: Spektakuläre Erde
  subtitle: Blitze
  widescreen: true
  hd: true
  description: Die Reihe kommt Naturphänomenen so nah wie nie zuvor und zeigt spektakuläre Wetterereignisse wie Blitze, Monsterwellen oder Polarlichter aus nächster Nähe. In Arizona liefern Blitze eine einzigartige Lightshow aufgrund der klaren Luft. Das Team geht auf die Jagd nach den Blitzen. Dabei ist ein Blitz heißer als die Oberfläche der Sonne.
