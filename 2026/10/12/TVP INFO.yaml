  stop: 2026-10-12T02:14:00Z
  title: 'Stacja Arktyka: Baza polarna od kuchni'
  subtitle: W dokumencie pokazujemy polską stację polarną Hornsund. W środku wiecznej zmarzliny, znajduje się obiekt na najwyższym poziomie naukowym, utrzymywany w ciągłej gotowości dzięki pracy i zmianom ludzi.
  description: |-
    Tytuł oryginalny: Stacja Arktyka
    PL, 2023
    Reżyseria: Sambor Wilk
    W filmie dokumentalnym prezentujemy, jak na polskiej stacji polarnej Hornsund w środku wiecznej zmarzliny funkcjonuje obiekt na najwyższym poziomie naukowym, który dzięki pracy i dyżurom ludzi utrzymywany jest w ciągłej gotowości do pracy. Pokażemy, jak gwarantowane są polskim i zagranicznym naukowcom podstawowe wygody, tak aby mogli prowadzić swoje badania. Ekspedycja pod kierownictwem prof.
  ageRating: 12
