  title: Lejeune - Prof. Dr. med. Dr. med. Barbara Richartz (Wh.)
  subtitle: Lejeune im Gespräch mit Kardiologin Prof. Dr. Barbara Richartz über Herzgesundheit, moderne Kardiologie und die Frage, warum es sich lohnt, auf sein Herz zu hören.
  description: |-
    Prof. Dr. phil. h. c. mult. Erich Lejeune im Gespräch mit Prof. Dr. med. Dr. med. Barbara Richartz, Gründerin des Kardiologie Zentrums München Bogenhausen. Als international tätige Kardiologin und gefragte Referentin auf Fachkongressen spricht sie über moderne Herzmedizin, ihre internationale Erfahrung und die Bedeutung eines bewussten Umgangs mit der eigenen Gesundheit.

    Auch Lejeunes persönliche Erfahrungen mit dem Marathon und seine Motivation, auf das eigene Leben und den eigenen Körper zu hören, spielen eine Rolle. Dabei geht es um die Frage, was ein gesundes und erfülltes Leben ausmacht - und warum es sich lohnt, nicht nur auf medizinische Werte, sondern auch auf die Signale des eigenen Körpers zu achten.
- eventId: 1472624
  start: 2026-10-12T13:45:00Z
  stop: 2026-10-12T14:00:00Z
  title: Heimatgschichtn in Emmering (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
