  stop: 2026-10-12T20:35:00Z
  title: Kamerni orkestar mladih.
  subtitle: Emisija je posvećena Kamernom orkestru mladih Radio-televizije Beograd.
  description: Emisija je posvećena Kamernom orkestru mladih Radio-televizije Beograd. U njihovom izvođenju slušaćete kompozicije Svetomira Nastasijevića, Frančeska Đeminijanija, Ignaca Plejela, Domenika Čimaroze i Luiđija Bokerinija. Ovi trajni snimci iz Fonoteke Radio Beograda načinjeni su u periodu od 1959. do 1966. godine. Nedostatak kamernih ansambala nakon Drugog svetskog rata stvorio je prazninu koju je osećala naša publika, jer je bilo onemogućeno izvođenje kamernih kompozicija. Decembra 1950. najpre je osnovan Kamerni orkestar Radio Beograda, a sedam godina kasnije, zalaganjem Dragoljuba Erića - pedagoga, dirigenta i šefa Muzičke produkcije Radio Boegrada, osnovana je prvo Dečja filharmonija, a potom i Kamerni orkestar mladih Radio-televizije Beograd. Orkestar je bio sačinjen od darovitih studenata Muzičke akademije, pod vođstvom umetničkog šefa Dragoljuba Erića. Jedan od glavnih zadataka bio im je pripremanje muzike za dečje emisije, ali i koncertni nastupi. Sa mladim gudačima u orkestru...
