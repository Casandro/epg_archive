  - '112'
  description: Estland ist ein waldreiches Land. 50 Prozent der Gesamtfläche ist von Wäldern bedeckt. Der Wald nimmt im Leben der Esten einen großen Stellenwert ein. Viele besitzen irgendwo im Land ein Stück Wald und sind oft in der Natur unterwegs. Auch die Arbeit mit Holz ist tief in der Geschichte und Kultur der Esten verankert. Bäume gelten vielen sogar als heilig.
