  title: Die Rettung der Wälder - Wie schützen wir sie vor kommenden Dürren?
  subtitle: Die Rettung der Wälder - Wie schützen wir sie vor kommenden
  subtitled: true
  description: "\"Wir müssen jetzt den Wald für die kommenden Generationen pflanzen\". Ludwig Pertl hat eine Mission. Der ehemalige Revierförster im oberbayerischen Kaufering will die Wälder der umliegenden Gemeinden widerstandsfähig gegen den Klimawandel machen. \nSein Plan: Statt der Fichte Laubbäume zu pflanzen. Seine Favoriten sind Ahorn, Wildapfel und Hainbuche. Keine Rotbuche, denn auch die hält er für ein Auslaufmodell."
