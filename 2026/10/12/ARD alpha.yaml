  title: 'alpha-retro: München bei Nacht (1962)'
  description: 'Was wurde feierhungrigen Menschen in München zu Beginn der 1960er-Jahre alles geboten? Dieser Frage geht der Filmbeitrag von 1962 nach: "Auf geht''s!" Man konnte z.B. in eine Bar gehen, dort tanzen und launige Chansons hören. Es gab noch keine "Beatschuppen" und selbstverständlich auch noch keine Discos. Manche gingen auch ins berühmte Theater am Platzl und sahen und hörten dort die Erni Singerl in einer Parodie auf Edith Piaf. Man konnte auch zur Schwabinger Gisela gehen oder in ein Jazzkonzert, geboten wurde viel. Und alles war, aus heutiger Sicht, sehr, sehr brav.'
- eventId: 1102091
