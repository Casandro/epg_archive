  stop: 2026-10-12T14:45:00Z
  title: 'alpha-retro: Beat auf dem Lande (1966)'
  subtitle: Liverpool-Rhythmus in der Leberkäs-Region
  description: 'Der Spiegelautor und spätere Grimme-Preisträger Wilhelm Bittorf porträtiert in diesem Film aus dem Jahr 1966 in launiger Weise verschiedene Beatbands im süddeutschen Raum. Die Protagonisten erzählen dabei im Off selbst ihre Geschichte, teilweise sehr selbstironisch. Sie geben z. B. zu, dass sie teilweise aus Langeweile eine Beatband gegründet hätten und die Musik nie nach Noten spielen würden: Sie kauften sich die Platten ihrer Lieblingsbands und spielten die Musik einfach nach.'
