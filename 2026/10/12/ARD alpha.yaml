  description: Die Kirchbauern, eine Gemeinschaft aus zehn Familien, feiern einmal im Jahr ihren "Umgang". Eine Prozession mit einer rund 15 Meter hohen Kerze, die auf ein rund 300 Jahre altes Pestgelübde zurückgeht. Teil dieser Gemeinschaft zu sein, gilt in den Familien als "Ehre". Alle haben ihre feste Rolle und tragen damit Verantwortung. Anna-Maria Diestler hat sie für kreuz&quer nah dran besucht mit ihnen über den Zusammenhalt in Krisenzeiten sowie Herausforderungen des Generationenwechsels gesprochen.
