  title: POV - Deine Geschichte zählt (27)
  subtitle: Suizidgedanken · Was tun, wenn ein Freund nicht mehr kann?
  description: |-
    Elisa hatte selbst Suizidgedanken, heute klärt sie darüber auf. Was können Freundinnen und Freunde tun, wenn sich ihnen jemand anvertraut?

    Während ihrer Schulzeit kämpft Elisa mit Depressionen und Suizidgedanken. Heute geht es ihr besser - und sie nutzt ihre Erfahrungen, um an Schulen über psychische Krisen und Suizidprävention aufzuklären. Sie erzählt, warum es so schwer sein kann, sich anderen anzuvertrauen und was ihr damals geholfen hätte.

    POV-Host Kiara begleitet Elisa bei ihrer Präventionsarbeit und zu einer Podcast-Aufnahme. Gemeinsam mit einem Therapeuten sprechen sie darüber, was Freundinnen und Freunde tun können.
