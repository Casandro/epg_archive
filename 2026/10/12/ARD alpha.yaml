  title: 'alpha-retro: ''s Fensterl zum Hof - Beatles (1966)'
  description: Elfie Pertramer spielt in dieser Folge eine Zimmerwirtin, die einen jungen Mann als Zimmerherrn hat. Der wäre eigentlich ganz brav, aber seine Haare! Viel zu lang nach Meinung seiner Zimmerwirtin. Ihr Akt der Selbstjustiz hat jedoch ungeahnte Folgen. Die Beatles, die Beatmusik und die langen Haare waren damals ein riesengroßes öffentliches Thema. Elfie Pertramer hat das mit ihrem feinen Gespür für den Zeitgeist wunderbar aufgegriffen.
