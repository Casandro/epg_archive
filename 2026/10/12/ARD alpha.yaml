  title: 42 - Die Antwort auf fast alles
  subtitle: Sind Wespen Gamechanger der Evolution?
  description: 'Wespen finden die meisten von uns vor allem: unendlich nervig. Insbesondere, wenn sie uns mal wieder den Pflaumenkuchen streitig machen wollen. Doch damit werden wir ihnen nicht gerecht, findet der Biologe Michael Ohl vom Naturkundemuseum Berlin. Denn Wespen spielen für das Ökosystem eine ganz entscheidende Rolle. Sie bestäuben jede Menge Pflanzen - ja, auch Wespen tun das! Und wären sie nicht so erfolgreiche Jägerinnen, würden wir wahrscheinlich in Insekten versinken, vermutet er. Eigentlich müssten wir uns also beim Anblick jeder Wespe freuen - über all die Mücken, die uns dank ihr nicht gestochen haben.'
