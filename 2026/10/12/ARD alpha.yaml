  title: 'alpha-retro: Berlin bietet Beat (1968)'
  subtitle: Jamboree im SFB
  description: Ausschnitte aus einer Veranstaltung des SFB im Jahr 1968 mit den englischen Beat-Bands "Dave Dee, Dozy, Bicky, Mick and Tich" und "Eric Burdon and the Animals". Im Studio des SFB durfte getanzt werden. Damals war alles Beatmusik, für die Band "Dave Dee, Dozy, Bicky, Mick and Tich" stimmt das auch, aber für Eric Burdon und seine "Animals" schon nicht mehr so ganz, denn deren Musik ging schon eher in Richtung Bluesrock. Eric Burdon stand damals nicht ohne Grund am Beginn einer Weltkarriere.
