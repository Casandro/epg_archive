  subtitle: Geld und Gold
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2015
    Eine Frau hatte die Idee zum Spiel, das die Gier salonfähig machte: das Brettspiel Monopoly. Ein Spiele-Hersteller zahlte sie aus, damit sie keine Rechte am endgültigen Spiel geltend machte.

    Viele Schlagzeuger lieben den einmaligen Klang dieser Becken. Auf der Suche nach Gold fand der Alchemist Avedis Zildjian die geheime Substanz für den großartigen Klang. Sein Geheimnis hütet die Familie wie einen Augapfel seit 400 Jahren.
    HD-Produktion
- eventId: 1303263
  start: 2026-10-12T06:15:00Z
  stop: 2026-10-12T07:00:00Z
  title: Geistesblitze - Geniale Erfindungen
  subtitle: Das Bild der Welt
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2015
    Kopierer prägen den Büroalltag. Das Radargerät macht Geschwindigkeit messbar. Die Fernsehkamera ist live dabei. Visionäre Erfinder veränderten mit ihren Erfindungen unser Bild der Welt.

    Sterne können am besten oberhalb der Erdatmosphäre beobachtet werden. Doch endlich im Orbit, sendet das Hubble-Teleskop nur unscharfe Bilder. Die Lösung: Das Fernrohr bekommt eine Brille.
    HD-Produktion
- eventId: 1303264
  start: 2026-10-12T07:00:00Z
