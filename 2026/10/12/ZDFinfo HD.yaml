  description: |-
    Großbritannien 2015
    Edison, Nobel, Kennard, Fuld, Thompson - fünf Männer, deren Erfindungen Angst und Schrecken verbreiten und schließlich zum Milliardengeschäft werden.

    Den elektrischen Stuhl erfand Thomas Edison. Sein Plan: Tötung durch Wechselstrom sollte die Wechselstrom-Technik seines Konkurrenten George Westinghouse in Verruf bringen.
