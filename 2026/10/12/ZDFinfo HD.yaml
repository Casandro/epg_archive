  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Zwischen dem 9. und dem 15. Jahrhundert ist das Reich der Khmer eine der mächtigsten Hochkulturen Südostasiens. Seine Stärken erweisen sich als fatal und führen zum Untergang.

    Der Schlüssel zum Erfolg der Khmer liegt in der Beherrschung des Wassermanagements und des Reisanbaus. Sie bauen komplexe Systeme aus Kanälen und Stauseen und sichern so die Versorgung der Bevölkerung. Ihre Großstadt Angkor wird so zur größten Stadt der Welt.
    HD-Produktion
- eventId: 1300252
  start: 2026-10-12T03:00:00Z
  stop: 2026-10-12T03:45:00Z
  title: Ancient Apocalypse
  subtitle: Die Azteken
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Die Azteken errichten ein Großreich mit eigener Schrift, eigenem Kalender und einer Religion, die Menschenopfer fordert. Führt die Begegnung mit den europäischen Kolonisatoren zum Untergang?

    Im 15. und 16. Jahrhundert ist das Aztekenreich die letzte große Hochkultur und die beherrschende Macht in Mesoamerika. Ihre Hauptstadt Tenochtitlán zählt 140.000 Einwohner und ist ein wichtiges Handelszentrum. Heute befindet sich dort die Stadt Mexiko.
    HD-Produktion
- eventId: 1300253
  start: 2026-10-12T03:45:00Z
  stop: 2026-10-12T04:30:00Z
  title: Ancient Apocalypse
  subtitle: Die Zerstörung Karthagos
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2025
    Karthago war eine der mächtigsten Städte der Antike: reich, einflussreich und gefürchtet. Doch 146 vor Christus fiel die Handelsmetropole im Dritten Punischen Krieg. Was führte zum Untergang?

    Von phönizischen Seefahrern gegründet, entwickelte sich Karthago zur mächtigsten Handelsmacht im Mittelmeerraum. Reichtum, Flotte und Kolonien machten die Stadt zum gefürchteten Konkurrenten Roms. Ein dramatischer Kampf um die Vorherrschaft begann.
    HD-Produktion
- eventId: 1301555
  start: 2026-10-12T04:30:00Z
  stop: 2026-10-12T05:00:00Z
  title: Die sieben Mythen der Antike
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    War Kleopatra eine eiskalte Verführerin? Gab es das Trojanische Pferd wirklich? Und warum stürzten sich 300 Spartaner in eine ausweglose Schlacht? Viele Mythen der Antike werfen Fragen auf.

    Forscherinnen und Forscher versuchen, die Wahrheit hinter den schillernden Erzählungen der Antike zu finden. Wie sind die Mythen entstanden und aus welchen Motiven? Eine Spurensuche nach den Ursprüngen der Legendenbildungen in und nach der Antike.
    HD-Produktion
- eventId: 1301556
