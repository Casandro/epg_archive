  title: Julius Cäsar - Der Diktator
  subtitle: Macht
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2025
    Cäsar verbündet sich mit Crassus und Pompeius - gemeinsam bilden sie das sogenannte Triumvirat. Zu dritt bestimmen sie die Geschicke des Römischen Reiches und setzen die Politik unter Druck.

    Doch das Bündnis gerät ins Wanken und damit auch die Stabilität der Republik. Diese ist auf Machtverteilung ausgelegt. Kein Einzelner soll die Kontrolle übernehmen können. Doch Cäsar feiert in Gallien einen Sieg nach dem anderen. Er gewinnt immer mehr an Einfluss.
    HD-Produktion
