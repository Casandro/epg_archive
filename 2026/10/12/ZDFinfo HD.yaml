  description: |-
    Großbritannien 2015
    Ein Lächeln in einer Strichzeichnung schreibt Popgeschichte: das Smiley. Von der Motivationshilfe wird es zum Ausdruck eines Lebensgefühls einer ganzen Epoche. Einige haben daran verdient.

    LEGO-Steine sind bunt und können immer wieder anders verbaut werden. Kinder bauen damit die unterschiedlichsten Häuser und Türme. Der Entwickler der ersten Steine hatte zuvor bei Kindern nachgefragt, was sie sich wünschen. Aber ein anderer hatte Erfolg damit.
