  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2025
    Cäsar triumphiert im Römischen Bürgerkrieg. Nie zuvor hatte ein Römer so viel Macht. Er nutzt sie, um weitreichende Reformen durchzusetzen. Doch sein Aufstieg weckt Widerstand.

    Im Krieg hat Cäsar hart gekämpft, aber vielen seiner Gegner Gnade gewährt. Er will sie auf seine Seite ziehen und den Staat wieder aufrichten. Doch ist er bereit, seine Macht wieder abzugeben? Wird Cäsar zum Gewaltherrscher? Oder richtet sich die Gewalt gegen ihn?
    HD-Produktion
