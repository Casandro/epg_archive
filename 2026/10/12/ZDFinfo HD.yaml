  title: Geistesblitze - Geniale Erfindungen
  subtitle: Bewegte Zeiten
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2015
    Die Idee beim Sonntagsfrühstück brachte Millionen in Bewegung: der Joggingschuh mit Sohlen aus dem Waffeleisen. Joggen revolutionierte den Freizeitsport und wurde ein Milliardengeschäft.

    Das Zusammenklappen und Unterbringen auf kleinstem Raum ist das Konstruktionsprinzip von Kampfjets. Daran orientierte sich der Ingenieur Owen MacLaren bei der Entwicklung eines Kinderwagens für seine Enkel. Ergebnis: der Buggy, ein zusammenklappbares Raumwunder.
    HD-Produktion
- eventId: 1303912
  start: 2026-10-12T08:30:00Z
  stop: 2026-10-12T09:15:00Z
  title: Geistesblitze - Geniale Erfindungen
  subtitle: Auf Leben und Tod
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2015
    Die Erfindung sieht aus wie eine Idee aus der Zukunft, doch der 3-D-Drucker wurde schon 1983 erfunden. Mehr als 30 Jahre wurde das Besondere dieser Entwicklung übersehen.

    Winzig ist die Box, die Herzen im Takt schlagen lässt und so Millionen Menschen ein gesundes Leben ermöglicht. Eigentlich fasziniert von Funksignalen und Radios, löst Wilson Greatbatch ein Gelübde aus großer Gefahr ein und entwickelt den Herzschrittmacher.
    HD-Produktion
- eventId: 1304504
  start: 2026-10-12T09:15:00Z
  stop: 2026-10-12T10:00:00Z
  title: Geistesblitze - Geniale Erfindungen
  subtitle: Im Angesicht der Gefahr
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2015
    Entgegen aller Vorurteile entwickelt der Erfinder Garrett Morgan die Atemschutzmaske und überzeugt alle beim ersten Einsatz: Er rettet Bergleute aus einem verschütteten Stollen.

    Als Schutz gegen Überfälle entwickelt Richard Davis eine leichte Weste aus vielen Gewebeschichten. Zum Beweis der Wirksamkeit schießt sich Davis in seinen nur mit der neuen Polsterung gesicherten Bauch. Die Folge: ein blauer Fleck und viele Bestellungen der Weste.
    HD-Produktion
- eventId: 1304505
