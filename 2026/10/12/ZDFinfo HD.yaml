    Die 2020er: Ein Virus, ein Sturmtief, der Angriff auf die Ukraine, ein Terrorakt in Nahost und eine "Zeitenwende" - schwierige Herausforderungen lassen die Welt den Atem anhalten.

    Die Berliner Republik erlebt eine Reihe schwerwiegender Herausforderungen. Angefangen mit der Coronapandemie 2020 über die Flutkatastrophe 2021, den russischen Angriffskrieg gegen die Ukraine 2022 bis hin zu den Folgen des Terroranschlags der Hamas in Israel 2023.
