  audiodesc: true
  description: |-
    Großbritannien 2025
    Das Jahr 476 markiert das Ende eines Weltreiches: Rom fällt, der letzte Kaiser wird abgesetzt. Doch was führte wirklich zum Untergang des einst so mächtigen Imperiums?

    War es der Einfall germanischer Stämme, ein lähmender Bürgerkrieg - oder ganz andere Kräfte, wie Seuchen und Klimawandel? Neue Forschungen zeigen, wie viele Faktoren zusammenwirkten, bis Rom dem inneren und äußeren Druck nicht mehr standhielt.
    HD-Produktion
