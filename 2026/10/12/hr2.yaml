  title: Doppelkopf
  subtitle: Am Tisch mit Christoph Poschenrieder, vom Schriftsteller zum Tramfahrer
  description: Christoph Poschenrieder veröffentlichte mit 46 Jahren sein literarisches Debüt "Die Welt ist im Kopf". Nach dem Erfolg folgten weitere sieben Werke, die von der Kritik und Leserschaft durchweg positiv aufgenommen wurden. Und doch hat der in München lebende Poschenrieder beschlossen, die Schriftstellerei an den Nagel zu hängen.
