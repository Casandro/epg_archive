  description: Als Heidrun Kantereit ihre Mutter besucht, macht sie eine grauenvolle Entdeckung. Das Haus ist verwüstet und die vermögende alte Dame liegt tot im Kleiderschrank. Dieser brutale Mord führt die Lübecker Kommissare Finn Kiesewetter und Lars Englen in ein Heim für straffällige Jugendliche. Die Tote, Roswitha Wittling, hatte sich sehr für die Heimkinder engagiert. Hat einer der Jungen die betagte Frau ausgeraubt und anschließend in ihren eigenen Kleiderschrank gesperrt? Als der junge Leon zu fliehen versucht, finden die Kommissare den Schmuck der Ermordeten in seiner Tasche. Aber Leon bestreitet die Tat.
