  description: Zu Beginn jeder Spielrunde darf ein Team aus zwei Kategorien auswählen - ohne zu wissen, welche Fragen sich dahinter verbergen. Zu jeder Frage gibt es fünf Antwortoptionen, die nach richtig oder falsch sortiert werden müssen. Das jeweilig spielende Rateteam darf sich beratschlagen, aber wenn Florian Weber den Countdown auslöst, bleiben nur noch zehn Sekunden Zeit für die Entscheidung. Sind die Antworten gesetzt, löst Florian Weber Schritt für Schritt auf und erklärt die richtigen, aber auch die falschen Antworten. Pro richtig sortierte Antwort erhält das Team 100 Euro.
