  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: Am Morgen nach der Chorprobe wird Chorleiter Ecki tot aufgefunden, offenbar erschlagen. Ein junger Mann, der mit Eckis EC-Karte Geld abheben will, wird verhaftet und des Raubmordes verdächtigt. Aber Günter und Edwin glauben nicht recht an die Täterschaft des eher schlichten Gemüts. Sie recherchieren im privaten Umfeld des Toten, bei seiner Witwe, im Chor und kommen dabei einer Privatdetektivin in die Quere, die von Ecki angeheuert wurde, seine vermutlich untreue Frau zu überwachen. Aber dies ließ sich beim besten Willen nicht beweisen.
- eventId: 894535
  start: 2026-10-12T13:10:00Z
  stop: 2026-10-12T14:00:00Z
  title: Rentnercops - 45. Langfristig untragbar
  subtitle: Spielfilm Deutschland 2020
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: "So etwas haben Edwin und Günter noch nicht gesehen: in einem Fahrradschuppen wird die Leiche eines Mannes gefunden, der durch einen extrem starken Stromschlag ums Leben kam. Der Stromschlag war so heftig, dass er nur künstlich erzeugt worden sein kann. \nFrau Dr. Schmidt ist entzückt - eine solche Leiche hatte sie noch nicht auf ihrem Tisch. Während immer mehr Indizien auf die Freundin des Opfers hinweisen, durchleuchten Edwin und Günter die Vergangenheit von Jens Katter. Verschiedene Exfreundinnen lassen ihn in keinem allzu guten Licht erscheinen. Aber als Täterin kommt keine von ihnen infrage."
