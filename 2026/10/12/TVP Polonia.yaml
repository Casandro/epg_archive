    PL, 2012
    Reżyseria: Krzysztof Tadej
    Film dokumentalny o jednym z najważniejszych wydarzeń w historii Polski i Kościoła katolickiego - wyborze kard. Karola Wojtyły na Stolicę Piotrową. Film opowiada o mało znanych wydarzeniach z udziałem kard. Karola Wojtyły, a potem do pierwszych tygodni pontyfikatu Ojca Świętego w 1978 r. , pontyfikatu, który stał się jednym z najbardziej znaczących w dziejach świata. Film jest pełen emocji i wzruszeń, pokazuje wyjątkowość i świętość Jana Pawła II.
  genre:
