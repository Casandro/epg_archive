  subtitle: Do archiwum przychodzi policjant z teczką sprawy, nad którą śledczy pracowali przez ostatnie dwa lata. Dyrygent chóru, Zygmunt Mazur, zginął od strzału w głowę z popularnej broni wojskowej.
