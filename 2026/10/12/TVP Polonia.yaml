    Występują: Marta Mazurek, Vanessa Aleksander, Aleksandra Pisula, Michał Czernecki, Danuta Stenka, Arkadiusz Cyran
    odc. 9 Za radą Witka Marysia opowiada Dietrichowi, że jest szantażowana przez gestapo. Irka i Ewka udają się do mieszkania Brodzkiej po tajemniczą kasetkę, którą zostawił Kamil. Po licznych przygodach zdobywają kasetkę, jest w niej notes z zaszyfrowanymi informacjami. Ewka, która poprzednią noc spędziła z Witkiem, teraz go odrzuca. Ewa i Marysia otwierają sejf Dietricha.
