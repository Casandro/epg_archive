    Tytułowa "prasa szczególnej troski" to tygodnik, który masowo wykupują ludzie prezesa Kluska. W paczkach z gazetami ukrywają narkotyki i wysyłają do Niemiec, do prezesa Gonschorka. Z radości, że kolejna dostawa dotarła na miejsce, Klusek spędza wieczór z prostytutką Mariolą. Zostaje przez nią kompletnie okradziony i nie ma czym zapłacić Kasi za kurs. Kasia wozi młode małżeństwo, które musi pilnie zrobić zakupy, by wykorzystać kredyt dla młodych małżeństw.
