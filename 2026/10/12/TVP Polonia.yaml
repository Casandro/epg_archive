  title: Zaginione? Ocalone? Historie zawodów różnych - Dziegciarz
  description: |-
    Tytuł oryginalny: Zaginione? Ocalone? Historie zawodów różnych
    PL, 2022
    Reżyseria: Agnieszka Żmijewska
    Występują: Andrzej Kaczmarczyk
    Praczka, świniopas, śledziarz, handlarz skupujący starzyznę i kurze łapki, czy wędrowny ostrzyciel noży, odeszli w zapomnienie, choć tego ostatniego widziano jeszcze na warszawskich podwórkach na początku lat 90. Podobny los może czekać wikliniarzy, bednarzy, kołodziejów czy garncarzy, choć ta ostatnia umiejętność przeżywa właśnie swój renesans. Miejmy nadzieję, że nie krótkotrwały.
  genre:
  - '149'
  subtitle: Tematem odcinka będzie praca dziegciarza, czyli osoby zajmującej się wytwarzaniem dziegciu - gęstej, ciemnej substancji otrzymywanej z suchej destylacji drewna, najczęściej brzozowego.
