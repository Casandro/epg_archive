    PL, 2018
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Olga Sumskaya
    Siódmy sezon serialu o życiu wiejskiej doktor weterynarii, Sylwii Kubus. W kościele zebrali się niemal wszyscy mieszkańcy wsi. Okazja jest niecodzienna - ślub Sylwii i Dawida. Kiedy wszyscy wychodzą przed kościół i ustawiają się do pamiątkowego zdjęcia, nad Majaki nadciąga huragan. Welon Sylwii odfruwa. To początek katastrofy. Zamiast na wesele wszyscy biegną ratować dobytek. Orkan pokazuje swoją niszczycielską siłę. Wybuchają pożary.
  ageRating: 12
  genre:
  - '23'
  subtitle: Sylwia i Dawid biorą ślub. Nad Majaki nadciąga huragan. Straszliwy orkan niszczy wiele budynków, między innymi dom doktora i Jasiuni, lecznicę, schronisko dla psów i stajnię dla koni.
- eventId: 1488483
  start: 2026-10-12T11:00:00Z
