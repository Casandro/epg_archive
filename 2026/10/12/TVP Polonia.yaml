  title: Dom - odc. 5/25 - Ponad 200 czwartków
  description: |-
    Tytuł oryginalny: Dom
    PL, 1980
    Reżyseria: Jan Łomnicki
    Występują: Tomasz Borkowy, Wacław Kowalski, Stefania Iwińska, Jolanta Żółkowska, Anna Ciepielewska, Bożena Dykiel
    Basia Lawinówna trafia do szpitala w Otwocku. Choroba zbliża ją do Andrzeja, który okazuje dziewczynie wiele czułości, a w końcu odważy się zaproponować jej małżeństwo. Los nie szczędzi mu jednak zmartwień. Będąc potajemnie w rodzinnym Sierpuchowie, Talar jest świadkiem zabójstwa młodego ZWM - owca. Oskarżony o popełnienie zbrodni zostaje Wiktor. Andrzej wie, że jego przyjaciel z dawnych lat jest niewinny, usiłuje mu pomóc, lecz niewiele może zdziałać.
  ageRating: 12
  genre:
  - '23'
  subtitle: Basia trafia do szpitala. Talar usiłuje ratować przyjaciela niesłusznie oskarżonego o zabójstwo. Popada w konflikt z bratem, Bronkiem. Wszystkie kłopoty rekompensuje mu miłość Basi, uwieńczona ślubem.
