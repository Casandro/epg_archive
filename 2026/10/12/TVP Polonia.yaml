    PL, 2018
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Olga Sumskaya
    Kapitan zadomowił się już w leśniczówce. Wzbudza ciekawość Auguścikowej i Jasiuni. Kim on jest i czego właściwie szuka? Zanim znajdą odpowiedź na to pytanie, kapitan pomoże im, ściągając z drzewa fotel doktora, który ugrzązł tam po huraganie. Jasiunia jest zachwycona, z pewnością Jan ucieszy się z odnalezienia zguby. Nieoczekiwanie doktor zamiast zasiąść w fotelu jak dawniej, rozbija go w kawałki na oczach Jasiuni i kapitana.
  ageRating: 12
  genre:
  - '23'
  subtitle: Sylwia jest zajęta pracą i nie zauważa, że kapitan zbiera informacje na jej temat. Stec wyznacza nagrodę za schwytanie czarnego psa. Majka dostaje propozycję pracy w Warszawie.
