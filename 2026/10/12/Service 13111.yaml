  title: Hubert und Staller
  subtitle: Steg mit Aussicht
  description: |-
    Vor den Augen von Hubert und Staller springt Klaus Böttcher von einer Brücke in den Tod. Kurz davor war der Familienvater auf der Wache gewesen, um eine Aussage zu machen. Nachdem er eine Handymitteilung erhalten hatte, ist Böttcher jedoch schnell wieder gegangen. Wurde der Mann durch diese Nachricht in den Tod getrieben? Während man im Revier nach dem Absender der Droh-Nachricht sucht, haben Hubert und Staller noch ein anderes Problem. Beim Versuch, Böttcher am Sprung zu hindern, ist Staller von einem Auto angefahren worden und muss nun einige Tage im Rollstuhl sitzen. Da er im Rollstuhl nicht mehr in seine Wohnung kommt, ist Staller froh, dass ihm Barbara Hansen anbietet, vorübergehend bei ihr zu bleiben. Die Journalistin ist nach Wolfratshausen zurückgekehrt, weil ihr Vater verstorben ist. Kurz darauf glaubt der beurlaubte und an den Rollstuhl gefesselte Staller, ein Verbrechen zu beobachten. Er sieht einen Mann, der in den frühen Morgenstunden am Steg seines Grundstücks einen Sack im Wasser versenkt, der sich zu bewegen scheint. Für Staller steht schnell fest, Nachbar Hanselmann hat einen Menschen im See versenkt! Verbissen und gegen alle Widerstände versucht er, seinen Verdacht zu beweisen und entdeckt dadurch unbewusst eine Verbindung zu Böttchers Selbstmord.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.
    Krimi, Deutschland 2016, R: Philipp Osthus
  widescreen: true
- eventId: 636878
