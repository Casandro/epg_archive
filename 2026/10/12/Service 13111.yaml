  title: P.M. Wissen
  subtitle: u.a. Was zwitschern Wellensittiche?
  description: 'Was Wellensittiche sich zu erzählen haben, das versucht Dr. Marisa Hoeschele in einem "Budgie-Labor" der Österreichischen Akademie der Wissenschaften herauszufinden. Dazu zeichnet sie den Gesang der kleinen Papageien auf und sucht mit einem Algorithmus nach wiederkehrenden Lauten. Die agilen Vögel benutzen wie wir Konsonanten und Vokale, allerdings in zehnfacher Geschwindigkeit verglichen mit unserer Sprache. Die Forscherin will ihre Laute übersetzen und das Geheimnis ihrer Sprache entschlüsseln //  Papst Franziskus in weißer Daunenjacke: ein Bild, das um die Welt ging. Doch das Bild war nicht echt, sondern von Künstlicher Intelligenz erschaffen. Gefälschte oder manipulierte Bilder sind immer leichter zu erstellen und lassen sich mit wenigen Klicks erstellen. Was wahr ist und was nicht, lässt sich immer schwerer erkennen. Ein Faktenchecker der Austria Presse Agentur in Wien erklärt, wie wir Fälschungen entlarven. // Stauseen liefern Energie und sind wichtig für unsere Trinkwasserversorgung. Doch an ihrem Grund entsteht viel klimaschädliches Methan. Ein Team der Technischen Hochschule Köln hat nun eine Methode entwickelt, um es aus den Seen abzuleiten: ihr Prototyp ist ein riesiger Staubsauger, der methanhaltiges Sediment vom Seegrund aufnimmt. Eine Auffanganlage trennt dann das Methan vom aufgesaugten Schlamm. Mit dem  gewonnenen Methan kann sogar Strom erzeugt werden. // P.M. Wissen" erklärt Phänomene des Alltags, schaut in Labore und Werkstätten und zeigt, wo und wie gerade Zukunft entsteht. Gemeinsam mit Astro-Physiker Gernot Grömer begibt sich das Team von "P.M. Wissen" jede Woche auf eine Reise zu Ideen, die vor kurzem noch Science-Fiction waren.Österreich 2023'
  genre:
  - '144'
  widescreen: true
