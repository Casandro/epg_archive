  title: Bares für Rares
  subtitle: Alte Stadtansichten
  description: |-
    Wer kauft die Kupferdruckplatten mit Ansichten von Frankfurt am Main? Finden sich im Händlerraum Liebhaber für diese Antiquität? Die Platten stammen aus den 1840er bis 1870er Jahren und zeigen verschiedene Sehenswürdigkeiten Frankfurts wie die Börse, das Goethedenkmal, die Zeil, das Theater, den Kaiserdom St. Bartholomäus und den Zoologischen Garten. Es handelt sich um ein Konvolut von 8 Platten, die zur Herstellung von Drucken verwendet wurden. Wer zeigt Interesse an der Antiquität im Händlerraum des Pulheimer Walzwerks? Wie werden die Druckplatten in der Expertise durch Dr. Bianca Berding bewertet? Welcher Schätzpreis wird genannt? Es bleibt spannend!
