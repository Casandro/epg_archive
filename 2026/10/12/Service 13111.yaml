  title: Servus um 3
  description: |-
    Informativ, unterhaltsam, abwechslungsreich: Eine ganze Stunde lang widmet sich "Servus um 3" jenen Themen, die Österreich bewegen. Worüber spricht, diskutiert und spekuliert das Land aktuell? Freuen Sie sich auf fesselnde Reportagen, ausführliche Hintergrund-Informationen und besondere Studiogäste! Erhalten Sie wertvolle Service-, Verbraucher- und Gesundheitstipps sowie einen umfangreichen Blick auf das Wetter! Und lernen Sie die interessantesten Menschen, Bräuche und Regionen des Landes kennen! Von Montag bis Freitag, ab 15 Uhr, bei ServusTV! Die Moderatoren der Sendung sind Gerald Schober, Judith Nagiller und Kathrin Anfang.
