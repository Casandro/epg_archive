  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: |-
    Ein Tisch, verschiedene Meinungen. Dazu ein Moderator, der mit den Gästen die relevanten Themen der Woche bespricht und ausdiskutiert. Im Mittelpunkt steht ein pointierter und lebendiger Austausch an Argumenten und Meinungen, der dem Zuseher beide Seiten einer Medaille erklärt. Bei "Links. Rechts. Mitte" kommen Gäste zu Wort, die tatsächlich etwas zu sagen haben und nicht nur die bekannten Phrasen austauschen. 60 Minuten Talkshow, die das Zeitgeschehen auf den Punkt bringt und dem Zuschauer Orientierung auch in turbulenten Zeiten spendet.
    Diskussion, Österreich 2026,  M: Katrin Prähauser
  genre:
  - '33'
  widescreen: true
- eventId:
  - 1618961
  - 637069
  start: 2026-10-12T21:52:00Z
  stop: 2026-10-12T22:52:00Z
  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Koalition im Krisenmodus: Ist Österreich reif für Neuwahlen? \nEin Vizekanzler, dem seine eigene Partei so tief misstraut, dass sie ihm gleich zwei Bewacher zur Seite stellt. Ein Bundeskanzler, der immer stärker unter Druck gerät. Auch wenn die Regierung selbst einen \"Herbst der Ergebnisse\" ausruft: Die Krise der Dreierkoalition wird immer tiefer. Und immer mehr Österreicher sagen: So kann es nicht weitergehen, wir brauchen Neuwahlen. Ist diese Regierung stehend k.o. oder kann sie doch noch liefern? Zieht unsere Politik das Land doch noch aus der Krise - oder braucht es bei der nächsten Wahl neue Parteien? \n\nIntrige oder Fehlverhalten: Was ist wahr im Fall Weißmann? \nPaukenschlag im Fall Roland Weismann. 3.800 Chatnachrichten zwischen dem ehemaligen ORF-Generaldirektor und jener ORF-Mitarbeiterin, die ihm sexuelle Belästigung vorwirft, liegen den Ermittlern inzwischen vor. Und mehrere Medien behaupten, Einsicht genommen zu haben. Und sie zeichnen ein verheerendes Bild: Wurde Weißmann Opfer einer politischen Intrige? Oder hat er sich Fehlverhalten schuldig gemacht - und versucht sich jetzt in der Presse rein zu waschen? Welche Rolle spielt der politisch besetzte ORF Stiftungsrat? Und braucht es Konsequenzen am Küniglberg?\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
