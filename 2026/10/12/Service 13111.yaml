  title: Geniale Technik
  subtitle: Battersea Power Station - Sanierung der Superlative
  description: |-
    Aus dem Kohlekraftwerk der Vergangenheit, der Battersea Power Station,  soll eine moderne Attraktion im heutigen Stadtbild Londons werden. Geplant ist eine radikale Umgestaltung des 24.000 Quadratmeter großen Gebäudes. Das alte, riesige Kesselhaus könnte theoretisch vier Jumbo-Jets beherbergen. Dort sollen Büroflächen, Wohnungen und ein Veranstaltungssaal entstehen. Die beiden riesigen Turbinenhallen sind für den Einzelhandel bestimmt. Die zwei ehemaligen Schaltanlagen werden in 200 Wohnungen umgewandelt. Und schließlich sollen die vier weißen Schornsteine des Gebäudes erneuert werden. In einem davon ist beabsichtigt, einen modernen, gläsernen Aufzug einzubauen, mit einem atemberaubenden Blick auf die Stadt. Die Planungen für dieses ehrgeizige Milliardenprojekt haben bereits 2012 begonnen. Der Umfang des Projekts ist astronomisch. Die 2.500 Bauarbeiter müssen so viel Erdreich ausheben, das man damit 60 olympische Schwimmbecken füllen könnte. Außerdem verbauen sie 25.000 Tonnen Stahl und 1,75 Millionen Ziegelsteine. Die Dokumentation gibt Einblicke in die aufwendigen Sanierungsarbeiten und zeigt, welches Know-how nötig ist, um ein solches Bauprojekt zu meistern.
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Valerie Mellon
  genre:
  - '144'
  widescreen: true
