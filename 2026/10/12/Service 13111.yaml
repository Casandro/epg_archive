  title: Terra Mater - NaturTalente
  subtitle: Smart & Smarter (1/3)
  description: "Wer denkt, dass nur wir Menschen Außerordentliches vollbringen, sollte sich im Tierreich umsehen: Dort wimmelt es vor Erfindergeist! Winzige Wanderameisen errichten Trutzburgen aus eigenen Körpern mit bis 15 Zentimeter dicken Wänden. Webervögel bauen nur mit Hilfe ihres Schnabels kunstvoll geflochtene  Hängenester aus Gras. Elefanten haben ein riesiges Navigationssystem im Kopf, um verborgene Wasserstellen in der Wüste zu finden. Kapuzineraffen und Bergpapageien haben gelernt, geschickt mit Werkzeugen umzugehen. Schnell wird klar - es sind nicht nur die großen Säugetiere, die klug agieren - viele Vögel verhalten sich intelligent. Und auch Fische sind smart: Die kleinen Schützenfische in den Mangroven Sri Lankas beschießen ihre Beute mit Wasserpistolen. Und wenn Winzlinge wie Termiten oder Ameisen kooperieren, vollbringen sie wahre Wunderleistungen. Cleverness zahlt sich eben aus - und Staunen ist erlaubt! Sind doch alle Tiere und jedes auf seine Art: Smart & Smarter! \nNatur, Österreich 2016"
