  title: Das Gefängnis HMP Durham - Folge 2
  subtitle: Das Gefängnis HMP Durham - Folge 2
  description: Der Insasse Dale leidet an einer Persönlichkeitsstörung und gefährdet zunehmend das Sicherheitspersonal der Strafanstalt Durham und sich selbst. Die Gefängnisleitung und der psychologische Notdienst sehen zum Schutze aller keine andere Möglichkeit, als Dale in die Isolationshaft zu verlegen - das heißt keinen Kontakt zu anderen Insassen in einer Zelle ohne Tageslicht. Nach nur wenigen Tagen gerät seine innere Uhr aus dem Gleichgewicht. Größter Stressfaktor bleibt jedoch die Einsamkeit ...
  widescreen: true
- eventId: 1606414
