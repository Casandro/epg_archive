- eventId: 1606349
  start: 2026-10-12T00:17:00Z
  stop: 2026-10-12T01:00:00Z
  title: Lost Places - Folge 70
  subtitle: Lost Places - Folge 70
  description: In Schottland, nahe den Fluten des Firth of Forth, liegt eine Anlage, die einst ihrer Zeit voraus war. Heute findet man lediglich verlassene Gebäude mit rostigen Blechdächern und eingeschlagenen Scheiben vor. Einiges lässt Rückschlüsse auf den ursprünglichen Zweck des Ortes zu, an dem Geldwäsche, die russische Mafia und internationale Intrigen eine Rolle gespielt haben könnten. In Bulgarien befindet sich eine Betonruine, die einst zu einem feudalen Ferienort für viele Menschen werden sollte.
  widescreen: true
- eventId: 1606350
  start: 2026-10-12T01:00:00Z
  stop: 2026-10-12T01:49:00Z
  title: Geheimakte Atombombe - Lügen und Verrat
  subtitle: Geheimakte Atombombe - Lügen und Verrat
  description: Bei der Spaltung von Uran-Atomen wird unglaublich viel Energie freigesetzt. Dieses Wissen sollte in den ersten Jahrzehnten des 20. Jahrhunderts Verkehr, Stromerzeugung und Medizin revolutionieren - doch ebenso die Kriegsführung. Im Juni 1942 gab der US-amerikanische Präsident Franklin D. Roosevelt das Sofortprogramm zum Bau einer Atombombe frei, das später als Manhattan-Projekt in die Geschichtsbücher einging. Nach zwei Jahren Entwicklung war die erste Kernwaffe der Welt zum Abschuss bereit.
  widescreen: true
- eventId: 1606351
  start: 2026-10-12T01:49:00Z
  stop: 2026-10-12T02:34:00Z
  title: Geheimakte Atombombe - Bilder der Apokalypse
  subtitle: Geheimakte Atombombe - Bilder der Apokalypse
  description: Im Juni 1946 wird das Bikini-Atoll im Pazifik zum Testgebiet für die Operation Crossroads ernannt. Es ist der Beginn einer verheerenden Reihe von Kernwaffenversuchen. Hunderte Fotografen und Kamerateams sollen die Detonationen der Bomben festhalten, um der Wissenschaft neue Erkenntnisse über ihr Zerstörungspotenzial zu liefern - und um Imagefilme zu produzieren. Leichtsinnig gibt die US-Regierung Überlebenstipps in Werbeclips und der Atompilz wird zeitweilig sogar zu einem Symbol der Popkultur.
  widescreen: true
- eventId: 1606352
  start: 2026-10-12T02:34:00Z
  stop: 2026-10-12T03:18:00Z
  title: 'Geheime Nazi-Expeditionen: Himalaya'
  subtitle: 'Geheime Nazi-Expeditionen: Himalaya'
  description: Um die vermeintliche Überlegenheit der arischen Rasse wissenschaftlich zu belegen, unternahmen die Nazis Reisen in die entlegensten Winkel der Welt. Ihre aufwendigste Expedition verschlug sie bis in die obersten Gipfel des Himalaya-Gebirges. Die von Heinrich Himmler ausgewählten Wissenschaftler setzten alles daran, den hochrangigen SS-Mann zufriedenzustellen. Dieser war fest davon überzeugt, dass in Tibet einst gottähnliche Arier mit magischen Fähigkeiten gelebt hätten.
  widescreen: true
- eventId: 1606353
  start: 2026-10-12T03:18:00Z
  stop: 2026-10-12T03:59:00Z
  title: 'Geheime Nazi-Expeditionen: Der Heilige Gral'
  subtitle: 'Geheime Nazi-Expeditionen: Der Heilige Gral'
  description: Die Nationalsozialisten setzten alles daran, die Bevölkerung zu manipulieren. Ein wichtiger Teil ihrer Propaganda bestand darin, geschichtliche Mythen aufzugreifen und ihrer Ideologie entsprechend auszulegen. Der Heilige Gral, ein sagenumwobenes Artefakt, war eines jener Relikte, die Heinrich Himmler unbedingt finden wollte. Sein Plan war es, den Gral als Quelle der Macht zu nutzen, um das Dritte Reich weiter zu stärken.
  widescreen: true
