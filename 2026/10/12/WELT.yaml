  title: Der Puma - Raubkatze aus Stahl
  subtitle: Der Puma - Raubkatze aus Stahl
  description: Das Panzermodell Puma gehört zu den neuesten Geschützfahrzeugen der Bundeswehr und wird insbesondere durch seine Feuerkraft und Beweglichkeit gekennzeichnet. Seinem mehr als vierzig Jahre alten Vorgänger, dem Marder, ist er vor allem um eine viel höhere Treffsicherheit überlegen. Doch den Soldaten steht nun eine lange Ausbildungszeit bevor. Die Reportage zeigt den technologisch hochentwickelten Schützenpanzer von allen Seiten.
  widescreen: true
