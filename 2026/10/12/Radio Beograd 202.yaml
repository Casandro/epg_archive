  title: Ustanak
  subtitle: Ovog jutra proveravamo zašto je parkiranje u Prokuplju postalo nemoguća misija i podsećamo se neverovatnog, filmskog života fudbalske legende iz Čuruga Zdravka Rajkova.
  description: Ovog jutra proveravamo zašto je parkiranje u Prokuplju postalo nemoguća misija i podsećamo se neverovatnog, filmskog života fudbalske legende iz Čuruga Zdravka Rajkova. Spremni smo za dobar početak dana koji ćemo podeliti sa vama uz zanimljive priče i dobru muziku. Naravno, tu su i redovne vesti, prognoza vremena i praćenje stanja na putevima.Proveravamo kako se Prokupčani snalaze u jutarnjim gužvama, ali i kakva konkretna rešenja i velike infrastrukturne projekte priprema lokalna samouprava kako bi se tranzitni saobraćaj konačno izmestio iz centra.Podsećamo se životnog puta Zdravka Rajkova, proslavljenog fudbalera Vojvodine i jugoslovenskog reprezentativca. Otkrivamo kako mu se njegov rodni Čurug odužio otvaranjem muzeja i spomen-ploče, i to baš na stogodišnjicu postojanja lokalnog fudbalskog kluba Hajduk.Pišite nam - koliko vremena ujutru izgubite tražeći slobodan parking i ko je najveća sportska legenda iz vašeg kraja? Vaše poruke i pozdrave čekamo putem Vajbera ili SMS-a na naš...
