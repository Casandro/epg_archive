  description: Drohnen sind Teil unseres Alltags geworden. Für wenige Hundert Euro kann heute nahezu jeder ein leistungsfähiges Fluggerät kaufen. Die ARD-Dokumentation "Drohnen über der Siedlung - Wer schützt unsere Privatsphäre?" begleitet Menschen, die sich durch Drohnen beobachtet, gestört oder sogar ausgespäht fühlen. Gleichzeitig stellt die Dokumentation rechtliche Fragen, die viele Menschen bewegen.
