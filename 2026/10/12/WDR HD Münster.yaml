  title: 'Rockpalast: Long Distance Calling / The Ocean'
  subtitle: Aufzeichnung des Visions Westend vom 03.10.2013 aus dem FZW, Dortmund
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Long Distance Calling werden nicht umsonst von der Kritik gefeiert: Seit ihrer Gründung im Jahr 2006 überzeugen die Münsteraner auf ihren vorwiegend instrumentalen Alben mit der Virtuosität wahrer Klangkünstler.

    Die Berliner Band The Ocean um Gitarrist und Songwriter Robin Staps, auch als The Ocean Collective bekannt, ist eine Gruppe furchtloser Klangforscher, die so unterschiedliche Elemente wie Post Rock und Progressive Metal, klassische Musik und Sludge in ihrem Sound verbinden.

    Wr zeigen die Auftritte von Long Distance Calling und The Ocean bei Westend Festival 2013 in Dortmund.
