  description: |-
    Großbritannien 2025
    Karthago war eine der mächtigsten Städte der Antike: reich, einflussreich und gefürchtet. Doch 146 vor Christus fiel die Handelsmetropole im Dritten Punischen Krieg. Was führte zum Untergang?

    Von phönizischen Seefahrern gegründet, entwickelte sich Karthago zur mächtigsten Handelsmacht im Mittelmeerraum. Reichtum, Flotte und Kolonien machten die Stadt zum gefürchteten Konkurrenten Roms. Ein dramatischer Kampf um die Vorherrschaft begann.
    HD-Produktion
