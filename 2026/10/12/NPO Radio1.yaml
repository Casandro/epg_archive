  title: Nooit Meer Slapen
  subtitle: Lukas Dhont is regisseur, scenarioschrijver en filmproducent. Hij debuteerde als regisseur en scenarist met de korte film "Corps perdu" in 2012. Datzelfde jaar verscheen ook zijn korte film 'Huid van glas'.
  description: Lukas Dhont is regisseur, scenarioschrijver en filmproducent. Hij debuteerde als regisseur en scenarist met de korte film "Corps perdu" in 2012. Datzelfde jaar verscheen ook zijn korte film 'Huid van glas'. Vervolgens debuteerde hij met de lange speelfilm 'Girl'. Daarvoor ontving hij op het Filmfestival van Cannes een Queer Palm en een Prix FIPRESCI. Zijn tweede speelfilm "Close" ontving op hetzelfde festival in 2022 een Grand Prix. Zijn nieuwe film "Coward" is een oorlogsdrama dat zich afspeelt in de loopgraven van de Eerste Wereldoorlog. In de film organiseren soldaten tussen de gevechten door voorstellingen om het moreel van de groep hoog te houden. Femke van der Laan gaat met Lukas Dhont in gesprek. (2026)
