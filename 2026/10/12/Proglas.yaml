  subtitle: Swing, to mě baví - Brněnský jazzový saxofonista a zpěvák Jiří Suchý slaví 85. narozeniny koncertem na radiu Proglas
  description: 'Autor: Josef Javůrek; Interpret: Jiří Suchý, Josef Javůrek, ... * Speciální díl pořadu Čaj do páté z koncertního studia Proglasu, který výjimečně připravil Josef Javůrek, oslaví 85. narozeniny brněnského jazzového saxofonisty a zpěváka Jiřího Suchého. Ten vystoupí se svou skupinou Breeze Band. Posluchači se mohou seznámit s životním příběhem Jiřího Suchého prostřednictvím historek z jeho pestrého života plného zážitků. Premiéru pořadu můžete poslouchat v pondělí 12. října v 16 hodin.'
