- eventId: 1489592
  start: 2026-10-12T03:57:00Z
  stop: 2026-10-12T04:00:00Z
  title: Myšlenka na den
  description: 'Autor: Jiří Šenkýř; Interpret: Martin Holík * Je možné, že o této nemoci mluví v bibli prorok Habakuk před 2 tisíci a šesti sty roky, když praví ?kostižer mi vniká do kostí“.  Co je mnohočetný myelom? Je to zhoubné nádorové ocnosti. Takovými jsou dnes dezinformace, které se množí přes elektronická média a oslabují imunitní systém společnosti. Zdravá společnost má dostatek lidí, kteří považují hledání pravdy za samozřejmost. Jakmile začne těchto leněcenné, jako by se rozpadla část naší kostry. Jako jsou myelomové buňky nezničitelné a zůstávají v těle, jsou dezinformace schopné usazovat se ve společnosti a zůstávají nevratně v mysli lidí.  Jak se mnohočetný myelom léčí? Myelomové buňky se v těle maskují tak, že je imunitní systém nerozezná od zdravých bílých krvinek. Současné metody spoléhají na umělé molekuly vpravené do těla pacienta, které dokáží rozpoznat myelomovou buňku, označí ji a předají imunitnímu systému k likvidaci. Podobně je třeba dezinformace označit a rozeznat, v čem je její závadnost. Jako je cílem imunitního systému zachování lidského života, ve společnosti se jedná o zachování důstojnosti každého člověka. Skeletem společnosti je totiž důstojné místo pro každého člověka. Dezinformace vytvářejí narativy, které se zahlodávají do paměti jejich konzumentů a vedou k nenávisti vůči druhým lidem.  Imunitním systémem společnosti je každý z nás, komu není lhostejný osud lidí. Imunitou společnosti jsou pak pravdivé informace. Rozlišit pravdu od lži je ve složité společnosti obtížné, protože se lež maskuje pravdou, jako myelomové buňky se schovávají mezi bílými krvinkami. Proto je potřeba nasazení řady lidí a institucí, aby to zvládly. Vzpomeňme na diskuze o škodlivosti očkování. Je snadné plácnout, že očkování škodí a postrašení lidé tomu uvěří. Označit taSenkýř, Ždár nad Sázavou'
  subtitle: Inspirace myelomem
