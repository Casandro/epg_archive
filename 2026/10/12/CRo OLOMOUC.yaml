  title: Rockle
  description: V pátek jste brněnskou skupinu Insania mohli vidět naživo v olomouckém Bounty Rock Café. Skupina má aktuálně horkou novinku "Neo - Noe" a jak se u ní už stalo zvykem, deska bude opět aspirovat - a zaslouženě - na mnohá ocenění. Příslovečný tah na branku zůstává, texty opět srší nejrůznějšími odkazy a humorem, drobné hudební vychytávky (třeba foukací harmonika!) vše dokonale zdobí. Nad novým albem Insanie se potkáme s frontmanem kapely Petrem Poly Pálenským v dnešní Rockli. Připravuje Jiří Matějů.
