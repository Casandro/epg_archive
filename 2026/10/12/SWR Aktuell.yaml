  title: Der Tag
  description: 'Eigentlich tun wir den Viechern ja oft unrecht - wir ekeln uns vor ihnen, entwickeln Phobien und blenden dabei gerne aus, wie nützlich sie sind: Spinnen. Journalist Jan Mohnhaupt beleuchtet in diesem Buch "das Beziehungsgeflecht" von Spinnen und Menschen. Warum fürchten wir uns vor den Gliederfüßlern? Warum verglich man Napoleon mit einer Spinne? Wie prägte die christliche Symbolik die Abneigung gegenüber Spinnen? Und wieso wurden gleich drei Weltraummissionen von Spinnen begleitet?'
