  title: SWR Kultur - Das Wissen
  subtitle: Panzer statt PKW - Rettet Rüstung die deutsche Autoindustrie?
  description: |-
    Von Bartholomäus Laffert und Ronja Morgenthaler
    Mangelnde Transformation, Konkurrenz durch China, hohe Energiekosten - die deutsche Autoindustrie schwächelt seit Jahren. Werke wie VW Osnabrück oder Mercedes Ludwigsfelde stehen vor dem Aus. Während große Autobauer hierzulande Stellen abbauen wollen, erfährt die deutsche Rüstungsindustrie einen neuen Aufschwung - mehr als 100 Milliarden Euro fließen jährlich in Verteidigung. Um den Aufträgen gerecht zu werden, suchen Rüstungskonzerne nach Kapazitäten und Fachkräften. Könnte hier die Autoindustrie einspringen? Fachleute zweifeln, dass die Transformation vom Auto- zum Rüstungsbauer gelingt.
