  description: |-
    14:00 - 15:00
    MAFIA LAND
    Koks und Küsschen: Narco Traffico - Das Kokain-Netzwerk (3/4)
    Er war einer der meistgesuchten Kriminellen der Welt: Der Kokainbroker Maluferru. Er hat jahrelang mit Bacetto zusammengearbeitet. In dieser Folge erzählen wir, wie die italienische 'Ndrangheta ihren Kokainhandel aufbaut, wie komplex und skrupellos das Geschäft abläuft, mit welchen Tricks das Kokain über die europäischen Grenzen geschmuggelt wird und warum es ein mafiöses System unterstützt, wenn man sich auf der Party eine "Line" zieht
    Von Karin Senz
    Gibt es auch zum Nachhören in ARD Sounds:
