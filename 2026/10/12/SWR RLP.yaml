  audiodesc: true
  description: Langenthal ist ein Dorf im Soonwald mit knapp 100 Einwohner:innen. Es liegt wenige Kilometer von Monzingen entfernt, der Glaubsbach fließt mitten hindurch. Die Straße "Im Unterdorf" ist die kürzeste von Langenthal. Hier findet sich der Hofladen von Diane Kunz mit Edelbränden aus der eigenen Destillerie, Gelees und vielen Leckereien in ungewöhnlichen Kombinationen, z.B. Johannisbeer-Ketchup.
