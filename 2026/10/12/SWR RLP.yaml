  description: |-
    Der fünf Monate alte Emil hat wie jeden Tag seinen Mittagsschlaf im Büro seiner Mutter gehalten, doch plötzlich ist er spurlos vom Werftgelände verschwunden. Die sofort eingeleitete Suche endet mit der Festnahme mehrerer Mütter mit ihren Babys. Dies führt zu einem Chaos auf dem Revier, aber nicht zum Kidnapper.
