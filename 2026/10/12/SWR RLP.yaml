  description: "Die Moderatoren aus dem \"ARD-Buffet\" präsentieren ihre liebsten Rezepte im \"Best of ARD-Buffet\". Heute kocht Fatma Mittler-Solak die besten Fischgerichte: Seeteufel im Brotmantel, Kabeljau auf Petersilienwurzelpüree, Zander mit confierten Orangen, gebratene Forelle mit Mandelbutter und Schnittlauchkartoffeln. \nDazu gibt es nützliches Küchenwissen im Schnellformat: Woran erkennt man beim Einkauf, dass Fisch wirklich frisch ist? Wie filetiert man rohen Fisch richtig? Welche Süßwasserfische gibt es in Deutschland und was zeichnet sie aus?"
- eventId: 893782
