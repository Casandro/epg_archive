  title: Glück auf vier Rädern
  subtitle: Fernsehfilm Deutschland 2006
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: 'Der Psychologieprofessor Friedrich Sibelius hat seinen Beruf sehr geliebt. Damit sich der emeritierte Hochschullehrer nach seiner Pensionierung nicht langweilt, heckt seine Frau Anna diverse Pläne für ihn aus: Friedrich wird öfter für die Enkelkinder eingespannt und soll in einem Salsa-Kurs das Tanzbein schwingen. Außerdem verdonnert Anna ihren Gatten dazu, endlich seinen Führerschein zu machen. Trotz seines anfänglichen Missmuts, setzt der Autos hassende Professor a. D. sich ans Steuer: Die Fahrlehrerin entpuppt sich nämlich als höchst liebreizende Dame, die dem Großvater den Kopf zu verdrehen scheint.'
