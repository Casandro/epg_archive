  description: Der Video-Livestream der "SWR3 Morningshow", unter SWR3.de zu sehen, wird auch im SWR Fernsehen ausgestrahlt. Während der Musikstrecken ergänzen aktuelle Nachrichten in kompakter Form zum Nachlesen auf dem Fernsehbildschirm die Live-Bilder aus dem Studio. Aufnahmen der Autobahnkameras veranschaulichen die Verkehrsmeldungen, Live-Bilder zeigen die aktuelle Wetterlage im Sendegebiet.
- eventId: 893754
  start: 2026-10-12T05:55:00Z
  stop: 2026-10-12T07:00:00Z
  title: Panoramablick
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
