  title: Deutschland 1933 - Wie die Nationalsozialisten in wenigen Wochen die Demokratie abschaffen
  subtitle: Machtübernahme
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Am 30. Januar 1933 wird Adolf Hitler zum Reichskanzler ernannt: Die Nationalsozialisten übernehmen in Deutschland die Macht. Die Weimarer Republik ist zu diesem Zeitpunkt schwer angeschlagen. Aus der Wirtschaftskrise von 1929 ist eine Staatskrise geworden. Die Demokratie scheint am Ende. Die instabile Situation hat Hitlers Partei, die NSDAP, stark gemacht. Sie beginnt jetzt mit dem systematischen Umbau der Gesellschaft. Joseph Goebbels, einer von Hitlers engsten Mitstreitern, betreibt gezielt Propaganda für die NS-Bewegung. Auch einflussreiche Wirtschaftsvertreter wie Hjalmar Schacht stehen auf Hitlers Seite. Der Journalist und Herausgeber Carl von Ossietzky dagegen verachtet Hitler und sieht früh, welche Gefahr durch die NSDAP droht. Der Autor und liberale Reichstagsabgeordnete Theodor Heuss ist unschlüssig, was er von Hitlers Kanzlerschaft halten soll. Mit der Auflösung des Reichstags am 1. Februar 1933 nimmt die Errichtung der NS-Diktatur ihren Lauf.'
- eventId: 893751
  start: 2026-10-12T03:40:00Z
  stop: 2026-10-12T03:55:00Z
  title: Deutschland 1933 - Wie die Nationalsozialisten in wenigen Wochen die Demokratie abschaffen
  subtitle: Propaganda und Gleichschaltung
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nach der Machtübernahme beginnen die Nationalsozialisten, die öffentliche Meinung durch Propaganda zu lenken. Bei der NSDAP ist dafür Joseph Goebbels zuständig. Führende Wirtschaftsvertreter wie Hjalmar Schacht unterstützen die NS-Regierung und hoffen, dass sie der Wirtschaft auf die Beine hilft. Die NSDAP betreibt die Gleichschaltung der Gesellschaft: Sie besetzt staatliche und gesellschaftliche Institutionen mit ihren Anhängern - auch Polizei und Justiz. Magnus von Levetzow wird neuer Polizeipräsident. Er will beim Aufbau der NS-Diktatur helfen. Gerichtsreporterin Gabriele Tergit beobachtet, wie die unabhängige Justiz ausgeschaltet wird. KPD-Chef Ernst Thälmann erkennt die Gefahr, die politischen Gegner:innen droht. Als am 27. Februar 1933 der Reichstag in Brand gesteckt wird, nutzt das NS-Regime den Vorfall, um die Reichstagsbrandverordnung zu erlassen. Sie setzt zentrale Grundrechte außer Kraft. Politische Gegner:innen werden verhaftet - auch Schriftsteller Carl von Ossietzky.'
- eventId: 893752
  start: 2026-10-12T03:55:00Z
  stop: 2026-10-12T04:00:00Z
  title: Erklär's mir
  subtitle: Warum ernähren sich Menschen vegan?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kein Fleisch, keine Milch, keine Eier - wer sich vegan ernährt, verzichtet auf tierische Produkte. Drei der möglichen Gründe, weshalb sich Menschen zu einer veganen Ernährung entscheiden: Erstens. Das Tierwohl. Viele möchten nicht, dass Lebewesen für sie sterben oder leiden. Viele Tiere in Massentierhaltung leben unter schlechten Bedingungen. Was zum zweiten Grund führt. Der Umweltschutz. Denn bei der Produktion tierischer Lebensmittel entstehen viele klimaschädliche Gase und Wälder werden für Tierfutter abgeholzt. Drittens: Die Gesundheit. Zu viel Fleisch ist ungesund. Doch Achtung: Auch eine rein vegane Ernährung ist nicht automatisch gesund. Nach diesem Video kennt man die drei häufigsten Gründe und kann besser verstehen, warum sich manche Menschen vegan ernähren.'
