  subtitle: 'I Casi di Teresa Battaglia. Figlia della cenere 1^ Visione - FICTION - - Episodio 1: Il ritrovamento di un anziano pensionato lungo il greto del torrente mette in moto la squadra della commissaria Teresa B'
  description: "attaglia. Il corpo presenta una firma oscura e rituale: le falangi recise, lo sterno sfondato. Le indagini portano in superficie tensioni familiari irrisolte e il DNA del figlio sulla scena del crimine apre nuovi scenari imprevisti...- Episodio 2: Un secondo omicidio scuote Udine: un imprenditore ritrovato in un parco pubblico, mutilato con le stesse modalità. Per Teresa si profila l'ipotesi di un serial killer. Le indagini rivelano un legame preciso tra le due vittime, che passa attraverso una storia di molestie taciuta per anni... - Regia di Kiko Rosati\nCon Elena Sofia Ricci, Gianluca Gobbi, Giuseppe Spata\nDal romanzo Figlia della Cenere di Ilaria Tuti \nEdito da Longanesi, Gruppo editoriale Mauri Spagnol\nUna coproduzione RAI Fiction-Publispei\n1^ puntata\n -  PROGRAMMA ADATTO AD UNA VISIONE CONGIUNTA CON UN ADULTO"
