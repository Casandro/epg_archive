  title: OnlineKirche mit Pastor Gert Hoinle - Du bist nie verlassen, nie allein
  description: 'Jesus rief am Kreuz: "Mein Gott, warum hast du mich verlassen?" Er zitierte nicht einfach Psalm 22, sondern nahm tatsächlich unsere Gottverlassenheit auf sich. Weil er von Gott verlassen wurde, werden wir nie von Gott verlassen sein. Das zu wissen ist wichtig, denn wir werden uns immer mal wieder verlassen vorkommen. Paulus ging das so, und David und Joseph auch. Doch sie alle erlebten den Einbruch des Übernatürlichen in ihr Leben als Gott ihnen schließlich entgegenkam. Das gleiche gilt für dich.'
  widescreen: true
- eventId: 650101
  start: 2026-10-12T04:00:00Z
  stop: 2026-10-12T04:30:17Z
  title: 'OnlineKirche mit Pastor Gert Hoinle - Gottes Trost: Mit Enttäuschung richtig umgehen'
  description: Du hast gebetet, doch das Problem hat sich nicht aufgelöst. Dein Kind, Ehepartner, Verwandter oder Freund ist gestorben. Nun kämpfst du, wenn du ehrlich bist, mit Enttäuschung oder sogar Bitterkeit. Der Herr, der Gott allen Trostes, will dich wieder aufrichten. In der Bibel gibt es zwei Personen mit Namen Lazarus. Einer starb und wurde auferweckt. Der andere aber war arm, hungrig und krank und starb und blieb tot, obwohl auch er gläubig war. Doch kaum war er tot, änderte sich seine Befindlichkeit zum besten. Pastor Gert öffnet die Bibel und schaut sich das genauer an.
  widescreen: true
