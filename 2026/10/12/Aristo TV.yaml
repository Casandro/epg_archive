  title: ANIXE auf Reisen - Korea mit Johann Lafer
  description: Starkoch Johann Lafer beginnt seine kulinarische Reise über die südkoreanische Halbinsel in einem alten Kloster und lässt sich von buddhistischen Nonnen in die Jahrtausende alte Tradition der Tempel-Küche einführen. Hier folgt die Zubereitung der Speisen bis heute faszinierenden, uralten Rezepten und religiösen Vorschriften.  In der Hauptstadt Seoul schlägt seit jeher das wirtschaftliche Herz des Landes. Auch wenn es keinen koreanischen König mehr gibt - die Wachablösung der königlichen Garde im Palast der strahlenden Glückseligkeit ist ein Spektakel, das Sie auf gar keinen Fall verpassen sollten. Doch Wintersport-Fan Johann Lafer will hoch hinaus und so besucht er mit dem Kamerateam u.a. die Skisprungschanze in Pyeongchang. Im Februar 2018 wurden hier die Olympischen Winterspiele ausgetragen.
