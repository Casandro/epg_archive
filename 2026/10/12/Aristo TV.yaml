  title: Gunst der Stunde mit Heiko Bräuning - Blindlings!
  description: 'Pudding ist etwas Wunderbares. Er tröstet, er beruhigt, er macht satt - zumindest für eine Weile. wenn der Magen knurrt, reicht manchmal ein Lö?el, und es wird ruhig in uns. Aber wir kennen das alle: der Hunger kommt zurück. Und manchmal merken wir: Es ist gar nicht der Magen, der leer ist. Heute haben wir zwei ganz besondere Gäste bei uns - zwei Frauen, die auf ihre je eigene Art Mut machen, Ho?nung schenken und zeigen, was echte Dankbarkeit bedeutet. Sabine und Birte Langenbach.'
