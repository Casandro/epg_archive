- eventId: 1581150
  start: 2026-10-12T20:58:00Z
  stop: 2026-10-12T21:30:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Jedini način da budemo sposobni živjeti život vjere, život pun ljubavi, mira, radosti i snage jest po Duhu Svetome. To vidimo vrlo jasno u životima Apostola. Oni su u svakoj prednosti jer su bili s Isusom i čuli ga kako propovijeda te vidjeli mnoga čudesa koja je učinio. A opet, čak i s tom prednosti bili su uplašeni muškarci koji žive svoju vjeru u zaključanoj sobi prije negoli su primili Duha Svetoga. To što se je dogodilo u gornjoj sobi promijenilo je život tih muškaraca i žena i ubrzo i tijek ljudske povijesti. To iskustvo Duha Svetoga je susret dostupan svakome; nije rezerviran za nekoliko izabranih. Pedesetnica i preobražavajuća sila Duha Svetoga tema je ove epizode.
