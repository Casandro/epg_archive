  subtitle: Magazin
  description: U današnjoj emisiji saznajte kako personalizirana medicina mijenja suvremeno zdravstvo. Gost je prof. dr. Dragan Primorac, jedan od znanstvenika s najvećim utjecajem citiranosti u svijetu te prema pisanju međunarodnih medija, jedan od ključnih liječnika u razvoju i uvođenju personalizirane medicine. Otkrijte što ova revolucija u medicini znači za budućnost dijagnostike i liječenja.
