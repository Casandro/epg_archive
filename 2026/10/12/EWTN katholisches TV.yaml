  title: Maria - Zwischen Himmel und Erde
  subtitle: Einführung in das marianische Thema
  description: 'In der 1. Episode führt Robert Rauhut im Gespräch mit Prof. Dieter Hattrup in das Marianische Thema ein. Es gibt vier marianische Dogmen: Gottesgebärerin und Jungfrau in der Antike, Unbefleckte Empfängnis und Aufnahme in den Himmel in der Neuzeit. Ein fünftes wäre die Miterlöserschaft, es könnte in der Nachneuzeit kommen. Das Alte Testament kennt wohl nur eine junge Frau, die eine neue menschliche Dynastie begründet. Erst das Evangelium kennt die Jungfrau, die einen Dynastiewechsel bringt von Mensch zu Gott.'
  widescreen: true
