  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: 'Sacra Musica: Eine lebendige Tradition'
  description: |-
    Diese Woche bei Vaticano:
    Wir untersuchen, wie die Kirchenmusik im Herzen von Rom bewahrt und weitergegeben wird. Vom Chor der Diözese Rom über die Bartolucci-Stiftung bis hin zum Päpstlichen Institut für Sakralmusik erfahren wir, wie die Kirche Musiker ausbildet und ihr musikalisches Erbe schützt. Zudem sprechen wir darüber, wie Ordensgemeinschaften diese Traditionen durch Jahrhunderte des Gebets, des Gottesdienstes und der Andacht aufrechterhalten haben.
