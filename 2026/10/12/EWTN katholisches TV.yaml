  title: Dem Tod begegnen (2. Staffel)
  subtitle: Das haben wir nicht gewusst
  description: "Gespräch über das Buch: Schicksalsschlag - Der Weg zurück ist kein Spaziergang. Autorin \nAnnunziata Gräfin Hoensbroich berichtet über die Notwendigkeit einer Vorsorgevollmacht und macht das sehr plastisch fest am Schicksal ihres Sohnes Caspar.Der 18-jährige Caspar wurde 2016 bei einem Autounfall in Barcelona lebensgefährlich verletzt. Ohne die Vorsorgevollmacht hätte Annunziata Hoensbroich mit ihrer Familie den Weg von Caspar zurück ins ganz normale ins Leben durch beste medizinische Vorsorge nicht mitbestimmen können."
