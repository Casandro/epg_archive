- eventId: 677871
  start: 2026-10-12T19:00:00Z
  stop: 2026-10-12T20:00:00Z
  title: Stage
  description: Na Stagi si dnes poslechneme koncert dua Eremen a Petijee, který odehráli v rámci koncertní série Pohoda_FM. Eremen a Petijee je slovenské rapové duo, které ve své tvorbě propojuje hip hop, soul a různé formy elektronické hudby. Jejich zvuk staví na propracované produkci, ve které se samplování potkává s živými nástroji. Společně vydali v roce 2014 album Únikový východ, na které navázali pokračováním jménem Únikový východ 2 v roce 2021. Na pódiu je doprovází bratislavské trio Space Cats, které elektronickou hudbu hraje naživo. Stage laďte v pondělí ve 21:00. (repríza)
- eventId: 677872
  start: 2026-10-12T20:00:00Z
  stop: 2026-10-12T20:30:00Z
  title: Tahle země není pro ženský (1/5)
  description: Pětidílný černě humorný thriller o dvou holkách, které dostanou druhou šanci na život. Isa a Dee se probudí uprostřed pouště a nepamatují si, jak se tam dostaly. Aby se mohly vrátit zpátky, musí najít a zabít jednoho muže. Jenže neznají jeho jméno, nevědí, jak vypadá ani proč právě on má zemřít. Na cestě plné násilí, podivných setkání a špatných rozhodnutí postupně zjišťují, co se jim skutečně stalo. Vyprahlý audiotrip o holčičí pomstě, vzteku, který se nedá pohřbít, a mužích, kteří si myslí, že jim všechno projde. V hlavních rolích Karolína Knězů, Marie Anna Myšičková, Jan Hájek a Jan Teplý. Scénář a režie Tomáš Ráliš. Obsah zahrnuje vulgarismy, násilí a sexuálně explicitní scény a není vhodný pro děti.
