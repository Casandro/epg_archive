  description: Nocovky před odevzdávkami, švarcsystém a někdy i hodinová sazba pod 100 korun. Nejnovější Fasády otevírají téma, o kterém se v architektuře příliš nemluví - pracovní podmínky. Architektka Eliška Havla, která stojí za prvním velkým průzkumem na toto téma, vysvětluje, proč je architektura tak specifická profese a kolik práce se skrývá za hezkými fasádami.
