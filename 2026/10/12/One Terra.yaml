  title: Planet Weltweit - Dagestan - Land über den Wolken
  subtitle: Planet Weltweit - Dagestan - Land über den Wolken
  description: 'König Salomo soll seine letzte Ruhestätte in der südrussischen Teilrepublik Dagestan gefunden haben. Auf dem albuz-da, einem über 4.000 Meter hohen Berg, der allen Dagestanern seither als heilig gilt - Christen, Juden und Muslimen, die den König aus dem alten Testament gleichermaßen verehren. Der Weg nach oben, so glauben sie, reinige den Menschen vom Bösen. Wir begleiten eine kleine Gruppe auf den Weg zum Gipfel und erleben, wie Menschen unterschiedlicher Religion Differenzen überwinden können, wenn sie ein gemeinsames Ziel haben. Im nordkaukasischen Dagestan, liegt das höchste Dorf Europas. Knapp 800 Seelen fühlen sich momentan noch stark genug für ein Leben in dieser Höhe und Abgeschiedenheit. Gegenüber dem Dorf liegt der Berg albuz-da - seit grauen Vorzeiten heilig, ist er bis heute ein Wallfahrtsort. Auch Ashab Magomadow möchte zusammen mit einigen Freunden den Berg bezwingen, jeder hat seinen eigenen Grund für den Aufstieg. Die erste Nacht verbringen sie in einer Moschee auf der Hälfte des Weges. Dort rasten alle Pilger - ob Moslems, Juden oder Christen. Sie bekommen eine warme Mahlzeit und ein Nachtlager. Am nächsten Morgen beginnt der härteste Teil des Aufstiegs. Den Weg nach oben markieren kleine Pyramiden aus aufgeschichteten Steinen. Die größten sind etwa einen Meter hoch. Pilger haben mit ihrem Bau vor Jahrhunderten begonnen, jeder, der vorbeikommt, fügt einen neuen Stein. Dann verschwinden auch die letzten Grasflecken und die Felslandschaft wird immer zerklüfteter. Schneefelder sind zu überwinden, bis der Heilige See vor den Pilgern liegt, kristallklar und von Gletschern gespeist. Zuvor lauert jedoch die schwierigste Prüfung auf Ashab Magomadow und seine Begleiter: Wer zu viele Sünden hat, kann sich nicht durch den Spalt im Felsen zwängen, der den Weg zum Gipfel versperrt. Wer es schafft, darf sich an dem Grab des Salomo ausruhen und den Blick genießen. DE 2004'
- eventId: 1617795
  start: 2026-10-12T02:15:00Z
  stop: 2026-10-12T03:07:00Z
  title: Planet Weltweit - Der Wüstendoktor
  subtitle: Planet Weltweit - Der Wüstendoktor
  description: 'Wenn Ousmane Dodo, der "Wüstendoktor" auf seinem Kamel in die Zeltlager der Tuaregnomaden kommt, wird er als Freund und Heiler willkommen geheißen. Als einziger ausgebildeter Krankenpfleger und Geburtshelfer in der nigrischen Ténéré-Wüste kümmert er sich um die gesundheitlichen Sorgen und Nöte der hier lebenden Menschen. Es ist das Ende der Regenzeit in der Ténéré-Wüste. Ousmane Dodo bereitet sich auf eine seiner mehrwöchigen Touren am Fuße des Aïr-Gebirges vor. Zu seinem Gepäck gehört ein großer Vorrat an Chloroquin, einer Malaria-Medizin. Diese Krankheit tritt besonders stark an den Wasserlöchern auf, die den Nomaden als Rastplätze dienen. Jeder Zweite von ihnen ist mit dem Erreger infiziert. So auch die 60-jährige Takafert Uandogam, deren Clan aber keine Rücksicht auf sie nehmen kann: Wenn die Wasserlöcher verschmutzt sind oder zu versiegen drohen, muss er weiterziehen, damit die Herden nicht verdursten. Denn von den Wasserlöchern hängt aller Überleben ab. Ousmane Dodo folgt dem Clan der Frau, bis er ihn eingeholt hat. Erst dann kann er sie behandeln - gerade noch rechtzeitig. Nicht selten kommt der Wüstendoktor jedoch zu spät, verliert den Kampf gegen die Zeit und die Unwägbarkeiten der kargen, zerklüfteten Felslandschaft des Aïr. Dennoch zieht Ousmane Dodo diese Arbeit dem geregelten Rhythmus in einem Krankenhaus vor. Er weiß, dass sich außer ihm niemand um die etwa 18.000 Nomaden kümmern würde. Nicht nur, weil die Wege lang und steinig sind, sondern auch, weil es weder Telefon noch Ambulanzen für Notfälle gibt. Meist müssen sich die Tuareg selber helfen. Ihren traditionellen Heilpflanzen vertraut auch der Wüstendoktor. Bei Skorpion- und Schlangenbissen bereitet Dodo etwa einen Tee aus den senfkrautgrünen Blättern der Madalanfou-Pflanze zu, der Lähmungserscheinungen bekämpft. Ein Beispiel für jene Art von Wissen, die lebenswichtig bleibt, um die Zukunft der Tuareg zu sichern. DE 2004'
