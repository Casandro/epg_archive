  title: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  subtitle: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  description: 'In Costa Rica, in den Bergen der Provinz Heredia liegt ein einzigartiges Tierheim, das Territorio de Zaguates, "das Land der Streuner". Über tausend Hunde leben zeitweilig auf dem 150 Hektar großen Gelände unter freiem Himmel und ohne Zwingerhaltung. Bei Lya Ballte und ihrem Mann Alvaro Saumet haben schon zigtausende Hunde Zuflucht gefunden, die Verstoßenen, Kranken und Alten, aber auch viele gesunde und junge Hunde, die ihr Leben auf der Straße fristen. Mit einer ausgeklügelten Idee versucht das Team die Tiere zu vermitteln. Im Fokus steht dabei die Einzigartigkeit der Mischlinge, denn kein Hund gleicht dem anderen. GEO Reportage hat das "Paradies der Streuner" besucht. Umgegeben von Farmland liegt das Territorio de Zaguates. 600 Kilogramm Futter fressen die über tausend Hunde jeden Tag, dazu kommen Tierarztkosten und unvorhersehbare Ausgaben für immer neue Baumaßnahmen, die staatlichen Behörden ihnen auferlegen. Bis zu 45.000 Dollar braucht das Tierheim pro Monat. Kein Tier wird abgewiesen oder eingeschläfert, Weitervermittlung in ein liebevolles Zuhause steht im Vordergrund der Bemühungen. Wer nicht vermittelt wird, bleibt. In Costa Rica gilt ein Hund nicht viel: Viele leben von Geburt an auf der Straße, ebenso viele werden ausgesetzt oder zurückgelassen. Weil der Staat nichts unternimmt, gibt es viele private Initiativen, vor allem wenn es um Kastrationsprojekte geht, um die Population der Straßenhunde einzudämmen. Auch den Initiatoren des Territorio de Zaguates geht es in erster Linie um Hilfe für die Tiere, aber auch um ein Umdenken in der Bevölkerung. Und darum, ein Bewusstsein für das Leid der Straßenhunde zu schaffen. So entstand die Idee einer einzigartigen Imagekampagne: "Razas Unikas". Die Kampagne erfindet neue Hunderassen: Aus den besonderen und oft einzigartigen Merkmalen der Mischlinge entstehen die lustigsten Namen, und viele traurige Hundegeschichten fanden so ein Happy End. DE 2019'
- eventId: 1617849
  start: 2026-10-12T18:15:00Z
  stop: 2026-10-12T19:06:00Z
  title: Planet Weltweit - Die Odyssee der Mönchsrobbe
  subtitle: Planet Weltweit - Die Odyssee der Mönchsrobbe
  description: 'Planet Weltweit: Seit der Antike gehört die Mönchsrobbe zu den geheimnisvollsten Säugetieren des Mittelmeeres. Die letzten 500 leben in Griechenland und der Türkei, extrem zurückgezogen in schwer zugänglichen Unterwasser-Höhlen. Ein Team einer Schweizer Stiftung will mit Kamera-Installationen mehr über die Lebensgewohnheiten der Robben erfahren, um sie besser schützen zu können. Die scheuen Meeressäuger wurden lange Zeit gejagt, wegen ihrer Haut, ihres Fettes - oder weil sie den Fischern zu viel Fisch wegfressen. Inzwischen ist die Art so gefährdet, dass die letzten knapp 500 im Mittelmeer lebenden Exemplare dringend besser geschützt werden müssen. Doch ihr versteckter Lebensraum macht ihre Erforschung und damit ihren Schutz sehr schwierig. Das will ein Team der Octopus-Foundation ändern. Segler, Fotografen, Taucher, begleitet von Biologen und Einheimischen wollen gemeinsam autonome Kameras an ausgewählten Stellen positionieren, um zu erfahren, ob und wo es die Robben überhaupt noch gibt und um ihre Lebensgewohnheiten zu erforschen. Julien Pfyffer, der Leiter der Expedition, setzt zusammen mit seinen Mitstreiterinnen und Mitstreitern die Segel in Richtung der Insel Kefalonia: Wir sind extrem gespannt, was uns erwartet. Nach mehreren Wochen oder Monaten werden wir es vielleicht endlich schaffen, eine Robbe zu erspähen, die sich am Strand ausruht. Und sei es nur für einen kurzen Augenblick, so Pfyffer. Bis zum Ende ihrer Reise erwartet sie eine ganze Reihe erstaunlicher Entdeckungen.  DE 2021'
- eventId: 1617850
  start: 2026-10-12T19:15:00Z
  stop: 2026-10-12T20:07:00Z
  title: Planet Weltweit - Die Igel-Retter aus dem Piemont
  subtitle: Planet Weltweit - Die Igel-Retter aus dem Piemont
  description: 'Planet Weltweit: Massimo Vacchetta schon viele tierische Patienten behandelt, vor allem Rinder. Bis die kleine Ninna das Herz des Tierarztes so sehr berührte, dass er sich fortan der Rettung einer Art verschrieb: der Igel. Die uralte Villa des Igel-Doktors hoch über den Weinbergen im Nordwesten Italiens ist inzwischen eine Institution. Doch wie sieht der Alltag in der Igel-Ambulanz eigentlich aus? Wer bringt die Wildtiere zu Dottore Massimo? Und können die oft schwer verletzten Patienten überhaupt wieder zurück in die Wildnis? Orecchio, Ettore, Pino oder Onorina - sie alle sind Patienten bei Dr. Massimo Vacchetta, in der einzigen Igelklinik Italiens. Die nachtaktiven Tiere sind Opfer von Autos, motorisierten Heckenscheren, Sensen oder Mährobotern, ihre Verletzungen sind oft schwerwiegend. Dottore Massimo betreut seine Schützlinge zusammen mit fünf Angestellten und vielen ehrenamtlichen Helferinnen und Helfern rund um die Uhr. Mit Feingefühl und auch unkonventionellen Methoden werden die stacheligen Patienten oft wochenlang aufgepäppelt. Das große Ziel: Sie wieder fit zu machen für ein Leben in der Natur. Angefangen hat alles mit einem winzigen Igelmädchen: Als ich das erste Mal Ninna in der Praxis eines Kollegen sah, war sie noch sehr klein. Sie wog gerade mal fünfundzwanzig Gramm. Ich war tief berührt - und mir wurde so einiges klar. Zum Beispiel, dass es die kleinen Dinge sind, die einen glücklich machen. Ich betrachtete den Igel, der so zufrieden und glücklich war, wenn er einen Tropfen Milch zu sich nahm und dann in meiner Hand einschlief. Im Grunde lehrte er mich, dass ich den Sinn des Lebens woanders suchen musste.Heute, wenn Massimos stachelige Patienten gesund genug sind, werden sie mit größtmöglicher Fürsorge in die Freiheit entlassen. Für den Igel-Doktor ist das jedes Mal aufs Neue ein Moment des Glücks, gemischt mit einer Prise Wehmut - wenn sich seine Igel wieder in ihren natürlichen Lebensraum aufmachen. DE 2021'
- eventId: 1617862
  start: 2026-10-12T20:15:00Z
  stop: 2026-10-12T21:07:00Z
  title: Planet Weltweit - Wilde Waterkant - Nordfriesland und seine Gänse
  subtitle: Planet Weltweit - Wilde Waterkant - Nordfriesland und seine Gänse
  description: 'Planet Weltweit: Die Gänse kommen! Für Naturschützer Martin Kühn ein Grund zum Jubeln. Riesige Schwärme lassen sich jeden April in Nordfriesland nieder, bevor es weitergeht in die arktischen Brutgebiete. Was Naturfreunde begeistert, ist für Bauern an der Küste eine Katastrophe: Die Gänse rasten nun auf ihren Feldern und fressen jeden Halm kurz. Noch vor 50 Jahren waren Nonnengänse vom Aussterben bedroht. Heute gibt es wieder Hunderttausende. Brüteten sie früher nur in den Polargebieten, sind sie inzwischen auch an der Ostsee und selbst an Norddeutschlands Westküste zu finden. Was Biologen und Naturschützer freut, alarmiert jedoch zunehmend viele Landwirte. Denn die Vögel richten erheblichen Schaden auf ihren Feldern an. Nicht nur das: Während die Tiere früher in Nordfriesland nur als Kurzzeitgäste zu Besuch waren, bleiben einige von ihnen inzwischen den ganzen Sommer hier. Und vermehren sich dank strikter Schutzmaßnahmen prächtig. In den Augen vieler Bauern sind die inzwischen nicht mehr gerechtfertigt. Sie fordern eine Bejagung und wollen notfalls selbst zum Gewehr greifen. Das wollen Naturschützer und Vogelliebhaber verhindern. Einer davon ist Martin Kühn, Ranger im Nationalpark Wattenmeer. Doch wie könnte schlussendlich ein Kompromiss für beide Seiten aussehen? DE 2021'
- eventId: 1617863
  start: 2026-10-12T21:15:00Z
  stop: 2026-10-12T22:07:00Z
  title: Planet Weltweit - Die Kichwa-Krieger und das Öl
  subtitle: Planet Weltweit - Die Kichwa-Krieger und das Öl
  description: Der Regenwald im Osten Ecuadors beherbergt eine unbändige Artenvielfalt und Wasserfälle, die das gesamte Amazonasbecken speisen. Doch riesige Landstriche dieses einmaligen Waldgebiets werden durch Ölförderung verseucht. Nur wenige Einheimische wagen es, dagegen zu protestieren, die Einwohner Sarayakus gehören dazu. Sie streiten seit Jahren gegen die Öl-Konzerne, die auf ihrem Grund und Boden nach dem lukrativen Rohstoff bohren wollen. Besonders die Geschwister Patricia und Heriberto Gualinga engagieren sich in diesem Kampf. Beide sollen für das Dorf Informationen aus entfernten Öl-Regionen sammeln, um zu beweisen, dass die Konzerne ihre Versprechen gegenüber den betroffenen Dörfern nur selten einhalten, denn auch in Sarayaku treten die Firmen immer wieder an einzelne Stammesmitglieder heran und versuchen, den Zusammenhalt der Gemeinde zu stören. Das Geschäft mit dem Öl gilt als bedeutendster Wirtschaftszweig Ecuadors. Allerdings haben bis heute nur ausländische Konzerne und die Machtelite des Landes ihren Profit daraus ziehen können, die Bauern leiden unter katastrophalen Umweltschäden. Trotzdem will die Regierung neue Fördergebiete auf dem Territorium der Ureinwohner erschließen. 2003 wurden weitere 10.000 Quadratkilometer Regenwald für die Ölförderung freigegeben. Damit sind rund 80 Prozent des ecuadorianischen Amazonasgebietes betroffen - und damit faktisch alle noch im Wald lebenden Ureinwohner. Auch die Kichwa in Sarayaku. DE 2004
- eventId: 1617864
  start: 2026-10-12T22:15:00Z
  stop: 2026-10-12T23:07:00Z
  title: Planet Weltweit - Kambodscha - Die Seele der Seide
  subtitle: Planet Weltweit - Kambodscha - Die Seele der Seide
  description: 'Der Japaner Kikuo Morimoto fördert in Kambodscha die traditionelle Webkunst und verschafft mit der Anpflanzung von Maulbeerbäumen und der Herstellung hochwertiger Seidenstoffe Hunderten von Menschen ein Einkommen. Er geht wie jeden Morgen durch die Reihen der 300 Frauen, die in seiner Seiden-Weberei arbeiten. Der ehemalige Kimonomaler war vor 15 Jahren, bei seiner ersten Reise nach Phnom Penh, auf die Spur der fast ausgelöschten Tradition der Seidenweberei gestoßen. Ausgelöscht während der Diktatur der Roten Khmer und dem nachfolgenden Bürgerkrieg, unter dem Kambodscha jahrzehntelang gelitten hat.  Für ihr Ziel, den neuen Menschen zu schaffen, zertrümmerten die Roten Khmer im Namen eines Steinzeit-Kommunismus alles Geistige und Sinnliche im Lande. Damit verschwand beinahe auch die einmalige Kunst der Seidenherstellung. Morimoto grub die alten Rezepturen des Färbens wieder aus: rot aus dem Saft der Lackschildläuse, braun vom Sud der Kokosnussschalen, grau durch die ausgekochten Äste des Lychee-Baums. Und er studierte die in Vergessenheit geratenen, über 1200 Jahre alten Muster. 1996 gründete er schließlich eine Weberei. Im ganzen Land konnte er nur noch ein Dutzend Weberinnen aufspüren und für sein Projekt begeistern. Sie verließen ihre Dörfer und zogen mit ihm nach Siem Reap, die Touristenstadt vor den Toren Angkors, im Nordwesten Kambodschas. Heute sind sie die Seele der Weberei und vermitteln ihr Wissen an jüngere Frauen weiter. Obwohl seit 1999 Frieden herrscht, ist die schreckliche Zeit für viele dieser Frauen immer noch gegenwärtig, so wie für Phorn Loan. Sie versorgt vier Kinder und einen vom Krieg psychisch gezeichneten Ehemann. Vor drei Monaten hat Morimoto die schüchterne Phorn Loan angestellt. Mit 37 Jahren lernt sie nun zum ersten Mal einen Beruf und sieht für sich und ihre Familie eine Zukunft. DE 2005'
- eventId: 1617869
  start: 2026-10-12T23:15:00Z
  stop: 2026-10-13T00:07:00Z
  title: Planet Weltweit - Die Eisenbahn vom Baikal zum Amur
  subtitle: Planet Weltweit - Die Eisenbahn vom Baikal zum Amur
  description: 'Sergej Kuplenski und Gennadi Laptjew sind Chefinspektoren auf der Baikal-Amur-Magistrale, deren Gleise sich 4000 Kilometer quer durch Sibirien ziehen. Ganze 30 Jahre dauerte ihr Bau, und neben der Trasse wuchsen Städte und Siedlungen, die nur durch die Bahn mit der Zivilisation verbunden sind. Es war das letzte große Prestige-Projekt der Sowjetära. Sie sollte neben der Transsibirischen Eisenbahn als zweite transkontinentale Trasse das östliche Europa über den Baikalsee mit dem Pazifik verbinden. Nach 30 Jahren Bauzeit, war die BAM mit der Fertigstellung des letzten großen Tunnels vollendet. Doch im neuen Russland fehlt es an Geld und Investoren, die sich an die Rohstofflager heranwagen. Die Züge rollen dennoch: Fünf Tage braucht ein Schnellzug von Moskau nach Tynda, der erst 1974 gegründeten "Hauptstadt der BAM". Hier leben Sergej Kuplenski und Gennadi Laptjew. Sie sind Chefinspektoren der Russischen Eisenbahn und für die Sicherheit der Züge, Gleise, Brücken, Tunnel und Bahnhöfe verantwortlich. Regelmäßig koppeln sie ihren Dienstwaggon an verkehrende Züge und unternehmen Inspektionsreisen entlang der BAM. Ihre nächste Fahrt führt sie über 1500 Kilometer weit in Richtung Osten über den Pass des Seweromuisker Gebirges und durch den längsten Tunnel Russlands, der von freiwilligen Bauarbeitern unter Einsatz ihres Lebens gebaut wurde. Aus den Lagern dieser Männer sind Siedlungen entstanden, in denen heute hauptsächlich Mitarbeiter der russischen Eisenbahn leben. Nach einem Zwischenstopp in ihrer Heimatstadt Tynda geht es für die Inspektoren vorbei an der riesigen Kohlengrube von Nerjengrü bis nach Jakutien in das Land der Rentierhirten. Die bekommen nun eine Zugverbindung an die Welt - und wissen nicht recht, ob sie ihnen Segen oder Fluch bringen wird. DE 2005'
