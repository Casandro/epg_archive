  title: Planet Weltweit - Åland-Archipel, warten auf das Eis
  subtitle: Planet Weltweit - Åland-Archipel, warten auf das Eis
  description: |-
    Fast 7000 Inseln umfasst der Aland-Archipel im Westen Finnlands - nur wenige davon sind bewohnt. Wer hier lebt hat gelernt während der langen Wintermonate mit eisiger Kälte und zunehmender Einsamkeit zurechtzukommen. Viele Insulaner schätzen gar die Stille und die Schönheit des Winters und richten ihr Leben danach aus.
    Der Aland-Archipel im Westen Finnlands ist eine Inselwelt in nächster Nachbarschaft zu Schweden. Nur wenige Wochen dauert hier der Sommer, und dann sind viele der Inseln Ziele naturverliebter Touristen. Nicht so im Winter. Mit zunehmender Kälte wächst in den Schären das Eis und auf den Inseln die Einsamkeit. Einmal pro Woche versorgt ein kleines Postschiff Ake und Monica Finnermann, die ganz allein auf der Insel Björkö leben. So sehr beide den finnischen Sommer hier draußen lieben, mit seinem Licht und den vielen Besuchern, so wenig können sie sich ein Leben ohne diese ruhigen Winter vorstellen. So lange sie können, wollen sie allein auf der Insel leben. Wir haben die Postboten auf ihren Touren durch wunderschöne Winterlandschaften Finnlands begleitet und dabei sehr besondere Menschen getroffen.
    Nur rund 60 von den fast 7000 Inseln des Aland-Archipels im Westen Finnlands sind überhaupt bewohnt. Im Sommer ein Paradies für Segler und Naturfreunde, ist diese Inselwelt im Winter ein gefrorenes Paradies für Menschen, die die Stille schätzen und die sich kein anderes Leben denken können. Diese wenigen Menschen, die hier leben und ihren Alltag und den ihrer Kinder in Schnee und Eis, von Insel zu Insel, von Fähre zu Fähre, von Boot zu Boot, organisieren und bestehen, sind erprobt in allen Härten des Winters. Dunkelheit und Kälte bestimmen ihre eisige Winterwelt. Dennoch ist sie voller Poesie und einsamer Schönheit. In der unbarmherzigen Natur sehen sie keinen Feind. Droht Gefahr für Mensch und Tier durch Eis oder Sturm, bleiben sie möglichst gelassen. Sie haben ein Urvertrauen ins Überleben und sie sind gut vernetzt. DE 2014
