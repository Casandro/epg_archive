  description: Vulkanische Kräfte haben mitten im Atlantik grandiose Landschaften geformt. Die Azoren erheben sich aus rund 3.000 Meter Meerestiefe in die Höhe und ragen mehrere hundert, an einigen Stellen sogar über 2.000 Meter aus dem Wasser heraus. Der Atlantik bietet hier dank warmer Wasserströmungen zahllosen Meeresbewohnern reichlich Nahrung und ist ein Paradies für Wale und Delfine. An wenigen Orten der Erde leben so viele Arten in so hoher Dichte.  DE 2011
