  title: Planet Weltweit - Kurt und seine Wölfe
  subtitle: Planet Weltweit - Kurt und seine Wölfe
  description: "Wie ticken Wölfe? Wer ist schlauer, Hund oder Wolf? Welche wölfischen Fähigkeiten hat der Hund aufgegeben, um mit dem Menschen leben zu können? Um dies herauszufinden, arbeitet Professor Kurt Kotrschal mit seinem Forscherteam in Ernstbrunn bei Wien im einzigen Wolf Science Center der Welt. \nZwölf Wölfe, 17 Hunde. Mit diesen Tieren arbeiten die Forscher im Wolf Science Center bei Wien, um herauszufinden, worin sich Hunde und Wölfe unterscheiden und wo ihre Gemeinsamkeiten liegen. In diesem Jahr nimmt das Center einen neuen Wurf Timberwölfe auf, die, von Hand aufgezogen, im Alter von fünf Monaten in die bestehenden Rudel eingegliedert werden sollen. Wir haben die Forscher und ihre Zöglinge während dieser spannenden Zeit besucht.\n DE 2014"
