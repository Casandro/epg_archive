  title: Planet Weltweit - Kamtschatka, kochende Erde
  subtitle: Planet Weltweit - Kamtschatka, kochende Erde
  description: Auf Kamtschatka zu arbeiten war immer schon der Traum der Vulkanologin Ludmilla Ossipenko. Denn nirgendwo brodeln so viele kochend heiße Quellen und gibt es so viele Feuerberg wie auf dieser Halbinsel im Osten Russlands. Ludmilla Ossipenko will den gewaltigen Kräften der Erde auf den Grund gehen und wissenschaftliche Artikel darüber schreiben. Einige ihrer Kollegen sind am Fuße der riesigen Tobaschik-Vulkane stationiert. Vor 31 Jarhen ereignete sich hier einer der sechs größten Ausbrüche der vergangenen 2000 Jahre. An der Oberfläche sind die Lavaströme von damals erstarrt, doch noch immer entströmen den Spalten giftige und brennend heiße Gase, im Innern arbeitet die Erde weiter. Ludmilla Ossipenko lebt in Petropawlowsk, der größten Stadt Kamtschatkas. Hier befindet sich das zu Sowjetzeiten führende wissenschaftliche vulkanologische Institut, für dessen Zeitschrift Ludmilla arbeitet. Dafür begleitet sich Wissenschaftler und Forscher überall dorthin, wo die Erde auf der Halbinsel brodelt. Auf ihrer aktuellen Reise will Ludmilla mit einem Forscherteam zum ersten Mal dem größten Geysir Kamtschatkas, dem Velikan, auf den Grund sehen. Das Journal, in dem Ludmilla ihre Artikel veröffentlicht, soll helfen, Forschernachwus zu gewinnen. Nach dem Zusammenbruch der Sowjetunion hatte der Staat kaum noch Geld für die Wissenschaft und die jungen Leute sind ins besser bezahlte Ausland abgewandert. Heute geht es finanziell langsam wieder aufwärts, aber es fehlt an Nachwuchs. Ludmilla Ossipenko will mithelfen, jungen Wissenschaftler für die kochende Erde Kamtschatkas zu begeistern. Dies ist auch das Ziel des amerikanischen Vulkanologen John Eichelberger. Seit Jahren initiiert er einen amerikanisch-russischen Studentenaustausch zwischen Alaska und Kamtschatka. Dabei entdeckte er nicht nur seine Liebe zu den Vulkanen der Halbinsel, sondern auch die zu seiner russischen Kollegin. DE 2006
