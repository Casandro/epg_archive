  description: Die russische Stadt Workuta liegt nördlich des Polarkreises. Im Winter herrscht hier bei Dauerfrost anderthalb Monate komplette Dunkelheit. 1990 hatte sie noch 120.000 Einwohner, heute sind es nur noch 55.000. Doch nun entfaltet Workuta eine neue Anziehungskraft. In Zeiten von Krieg und Wirtschaftskrise zieht es verarmte Großstädter und Kriegsflüchtlinge in die Arktis.
