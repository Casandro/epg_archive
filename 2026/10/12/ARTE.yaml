  title: Vietnam, des ponts pour sauver les singes
  subtitle: E632. Avec son pelage bariolé, le douc à pattes rousses est considéré comme l'un des plus beaux primates au monde. Mais il est menacé par le braconnage et la destruction de son habitat.
  genre:
  - '146'
  description: 'Bùi Van Tuân et Luc Nguyen sont des défenseurs de la cause animale. Depuis des années, ils surveillent la population de doucs sur la péninsule de Son Trà. Ces singes très paisibles, qui mesurent environ 70 centimètres à l''âge adulte, vivent en petits groupes. Ils passent le plus clair de leur temps dans les cimes des arbres où ils sont à l''abri des prédateurs et se nourrissent de feuilles. Au début de la guerre du Vietnam, la marine américaine avait débarqué sur la péninsule de Son Trà, qui, par la suite, était restée une zone militaire interdite aux civils en raison de sa position stratégique. Les doucs à pattes rousses ont donc pu s''y reproduire en toute tranquillité. Exclusivement végétariens, ils se nourrissent essentiellement de feuilles cueillies sur la cime des arbres. À cause du conflit, leur aire de répartition s''est considérablement réduite. Et depuis que l''armée vietnamienne a construit une route au milieu de cette forêt, de nombreux langurs ont du mal à trouver une alimentation adéquate. Pour tenter de remédier à ce problème et préserver les derniers spécimens de cette espèce menacée, Bùi Van Tuân et Luc Nguyen ont lancé l''idée de construire des passerelles pour les singes pour permettre à ces primates arboricoles d''accéder à des parcelles boisées, où ils peuvent se nourrir sans être dérangés. Réalisateur: Luigi Maria Perotti (2023)'
