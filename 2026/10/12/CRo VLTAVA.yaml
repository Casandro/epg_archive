  title: ArtCafé
  description: '40 let Laury a její tygrů. Deset let uplynulo od vydání posledního alba skupiny Laura a její tygři Továrna na sny. Bylo to v polovině 80. let, kdy kapela poprvé uhranula publikum svěžím zvukem s dechovými nástroji a provokativní image s tmavými brýlemi. Zakladatel a hybná síla kapely baskytarista Karel Šůcha bude komentovat vznik nejnovějšího alba Most!. Písně, často inspirované africkými rytmy, evokují konkrétní i smyšlené postavy, obecné asociace, a místa Šůchova dětství a mládí, která již vesměs existují jen v paměti. A uslyšíme i nezaměnitelný hlas Ilony Csákové. Pořad připravil Aleš Opekar. E-mail: artcafe@rozhlas.cz'
