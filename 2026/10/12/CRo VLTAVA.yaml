  title: Vizitka
  description: 'Peter a Veronika Jarůškovi - Pavel Haas Quartet. Za album se smyčcovými kvartety Bohuslava Martinů získal Pavel Haas Quartet prestižní Gramophone Award, přezdívanou Oscar klasické hudby. Pro soubor je to už šesté ocenění tohoto druhu. Hudba Martinů podle Veroniky Jarůškové překvapuje bohatstvím, jazzovými i folklorními vlivy a také absurdním humorem. Co všechno se odehrává mezi čtyřmi hlasy, které se na pódiu musí stát jedním organismem? O hudbě, společném hledání i radosti z komorní hry budou ve Vizitce mluvit houslistka Veronika Jarůšková a violoncellista Peter Jarůšek, manželé a členové Pavel Haas Quartet. Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
