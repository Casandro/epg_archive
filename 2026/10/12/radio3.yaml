  stop: 2026-10-12T20:00:00Z
  title: ARD Konzert
  subtitle: 'Moderation: Petra Gute'
  description: |-
    Kazuki Yamada dirigiert das Deutsche Symphonie-Orchester Berlin

    Alice Sara Ott, Klavier
    Maja Göpel, Rednerin

    Rede von Maja Göpel

    Charles Ives
    "The Unanswered Question"

    Edvard Grieg
    Klavierkonzert a-Moll

    Anna Clyne
    "Woman of the Mountain" (Deutsche Erstaufführung)

    Claude Debussy
    "La mer"

    Der japanische Dirigent Kazuki Yamada übernimmt mit diesem Konzert die Position des Chefdirigenten und Künstlerischen Leiters des Deutschen Symphonie-Orchesters Berlin (DSO). In seinem Antrittskonzert eröffnet Kazuki Yamada ein weites Panorama über das Verhältnis von menschlichem Individuum, Spiritualität und Natur mit Werken von Charles Ives, Edvard Grieg, Anna Clyne und Claude Debussy.
    Moderation: Petra Gute

    Konzertaufnahme vom 04.10.26 in der Berliner Philharmonie

    Moderation: Petra Gute
- eventId: 1045182
  start: 2026-10-12T20:00:00Z
  stop: 2026-10-12T21:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Michael Kuhlmann'
  description: |-
    Mit Seele, Groove und Strom - 75 Jahre E-Bass

    Anfangs nahmen ihn die Jazzer mit seinem dumpf-mulmigen Klang nicht ernst. Doch Musiker wie Stanley Clarke und Steve Swallow bereiteten dieser scheinbar zu groß geratenen Gitarre den Weg. So wurde neben dem Kontrabass auch der E-Bass zum schlagenden Herz eines Jazzensembles. Virtuosen öffneten ihm Solo-Welten, Groove-Arbeiter verliehen dem Instrument eine funkige Note. Wieder andere holten aus dem Instrument eine ungekannte Lyrik heraus. Vor allem aber Jaco Pastorius revolutionierte den E-Bass über den Jazz hinaus, indem er wie kein anderer jedem einzelnen Ton Seele verlieh.

    Moderation: Michael Kuhlmann
