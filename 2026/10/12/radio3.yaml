  start: 2026-10-12T20:00:00Z
  stop: 2026-10-12T21:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Michael Kuhlmann'
  description: |-
    Mit Seele, Groove und Strom - 75 Jahre E-Bass

    Anfangs nahmen ihn die Jazzer mit seinem dumpf-mulmigen Klang nicht ernst. Doch Musiker wie Stanley Clarke und Steve Swallow bereiteten dieser scheinbar zu groß geratenen Gitarre den Weg. So wurde neben dem Kontrabass auch der E-Bass zum schlagenden Herz eines Jazzensembles. Virtuosen öffneten ihm Solo-Welten, Groove-Arbeiter verliehen dem Instrument eine funkige Note. Wieder andere holten aus dem Instrument eine ungekannte Lyrik heraus. Vor allem aber Jaco Pastorius revolutionierte den E-Bass über den Jazz hinaus, indem er wie kein anderer jedem einzelnen Ton Seele verlieh.

    Moderation: Michael Kuhlmann
