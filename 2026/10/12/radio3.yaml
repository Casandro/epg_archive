  title: ARD Konzert
  subtitle: 'Moderation: Petra Gute'
  description: "Amtsantritt Kazuki Yamada beim DSO Berlin\n \nKazuki Yamada eröffnet seine erste Saison als Chefdirigent\n \nMit seinem Antrittskonzert als neuer Chefdirigent des Deutschen Symphonie-Orchesters Berlin eröffnet Kazuki Yamada die Saison 2026/27. Gemeinsam mit Alice Sara Ott gestaltet er ein Programm zwischen romantischem Repertoire, Gegenwartsmusik und orchestraler Klangkunst.\nMit diesem Konzert beginnt offiziell die Amtszeit von Kazuki Yamada als Chefdirigent des Deutschen Symphonie-Orchesters Berlin. Für seinen Einstand hat der japanische Dirigent ein Programm gewählt, das den Bogen von grundlegenden Fragen des Menschseins bis zu großen Klangbildern der Natur spannt. Charles Ives eröffnet mit The Unanswered Question den Abend. Es folgt Edvard Griegs Klavierkonzert a-Moll mit Alice Sara Ott als Solistin. Mit Anna Clynes Woman of the Mountain erklingt eine Deutsche Erstaufführung. Den Abschluss bildet Debussys La mer, ein Meilenstein der Orchesterliteratur. Das Konzert markiert den Auftakt einer neuen künstlerischen Partnerschaft zwischen Kazuki Yamada und dem DSO Berlin.\nAufnahme vom 04.10.2026 in der Philharmonie Berlin\n\nCharles Ives\nThe Unanswered Question\n\nEdvard Grieg\nKlavierkonzert a-Moll, op. 16\nAlice Sara Ott\n\nAnna Clyne\nWoman of the Mountain (Deutsche Erstaufführung)\n\nClaude Debussy\nLa mer\n \nDeutsches Symphonie-Orchester Berlin\nLeitung: Kazuki Yamada\nAlice Sara Ott, Klavier\n\nModeration: Petra Gute"
- eventId:
