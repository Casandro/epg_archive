    Afera "łowców skór", ujawniona w 2002 roku, wstrząsnęła opinią publiczną, odsłaniając proceder związany z działalnością części pracowników pogotowia ratunkowego. W odcinku przedstawiono także historię owianego legendami szpitala psychiatrycznego "Zofiówka" w Otwocku, kulisy kradzieży obrazu Claude'a Moneta z poznańskiego muzeum oraz okoliczności śmierci Andrzeja Leppera, jednej z najbardziej zagadkowych spraw ostatnich lat.
