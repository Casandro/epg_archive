  subtitle: Parmigiana aus dem Exotengarten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die fünfte Gartenreise führt ins Münsterland, nach Emsdetten. Hier genießt Sozialpädagogin Jacky Uda mit ihrer Familie Urlaubsflair unter Palmen und Bananenstauden - in einem 400 qm großen Garten mitten in einem modernen Wohnviertel.
    Hier fühlen sich auch sechs junge griechische Landschildkröten wohl. Neben den Exoten gibt es einen Teich, als auch jede Menge Obst und Gemüse in Hochbeeten. Darauf ist die mit 32 Jahren jüngste Teilnehmerin der Staffel besonders stolz und möchte beim Gartenfest so viel wie möglich aus dem eigenen Anbau auf den Tisch bringen.
