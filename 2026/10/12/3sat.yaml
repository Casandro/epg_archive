    Ausnahmezustand auf hoher See: Gitarrenriffs, vibrierender Bass und Headbangen. Zehn Tage entern 2.500 Metalfans und Bands ein Kreuzfahrtschiff. Heavy Metal Party pur.

    Einmal im Jahr verwandelt sich das 300 Meter lange Kreuzfahrtschiff in ein schwimmendes Festival. Drei Bühnen, tonnenweise Technik und tausende Liter Bier sorgen für eine ganz spezielle Kreuzfahrt. Für Kapitän Kassel und seine Crew eine echte Herausforderung.
