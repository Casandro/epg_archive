  title: Die Hohe Tatra (1/2)
  subtitle: Im Reich der Bären
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Steil, verwunschen, unzugänglich: Die Hohe Tatra ist eine der letzten Wildnisse Europas - ein Gebirge der Extreme zwischen Polen und der Slowakei.

    An seinen Hängen wächst einer der ältesten Wälder Europas: Mehr als 1000-jährige Zirbelkiefern wechseln sich mit dichten Fichtenwäldern ab. Es ist die Heimat der größten Raubtiere unserer Breiten, die andernorts längst ausgerottet wurden: Bär, Wolf und Luchs.
    HD-Produktion
