  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Ein Netz aus Flussarmen und Kanälen, verzweigt und verbunden mit einer Länge von zusammen fast 1000 Kilometern - das ist der Spreewald.

    Gespeist von der Spree, ist im Südosten Brandenburgs eine außergewöhnliche Natur- und Kulturlandschaft aus Wasser, Wiesen und Wäldern entstanden. Wie gelingt es, die oft unberührte Natur zu bewahren?
