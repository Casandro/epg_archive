  description: 'Petr Sagitarius: Trujkunt - Kruhy (5/8). Místo činu. Svérázný major Roman Saran vyšetřuje brutální vraždu. Nález zohaveného těla uprostřed podivných kruhů v obilném poli je jen začátkem temného příběhu, který dá ostravské kriminálce pořádně zabrat. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2022.'
