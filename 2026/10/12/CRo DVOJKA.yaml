  title: Noční Mikrofórum
  description: 'Host: Petr Holas, předseda České vexilologické společnosti, znalec vlajek a praporů. Ve kterých státních vlajkách najdeme kalašnikov, muškátový oříšek nebo jeřába? Jakého přešlapu se Češi při vyvěšování státní vlajky dopouštějí nejčastěji? A proč černobílá lebka s hnáty nebyla tou nejhorší vlajkou, kterou mohl námořník na obzoru spatřit? Moderuje Jan Eliáš Svatoš.'
