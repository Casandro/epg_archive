  subtitle: In principio erano i trattori, poi sono diventate le auto più potenti e lussuose del mondo. Tra Modena e Bologna, in un fazzoletto di terra abitata da grandi lavoratori della terra prima e della meccanica, ha
  description: "nno preso vita sogni su due e quattro ruote che sono diventati leggenda. In questa puntata di Che magnifica impresa vi raccontiamo la Motor Valley: un'eccellenza del made in Italy dove sono nate aziende come Ferrari, Lamborghini, Dallara, Ducati, Maserati, Pagani. Assieme a Mario Sechi ci saranno il mito dei costruttori Giancarlo Minardi, l'ingegnere della Ferrari Andrea Antichi e infine la giovane manager Laura Tancredi. - Conduce Mario Sechi\nDi Mario Sechi, Enrico Salvatori Clemente Volpini, Roberto Fagiolo, Fabrizio Marini e Gian Maria Tavanti Coordinamento editoriale Anna Lisa Guglielmi\nRegia Claudio Del Signore  \nAcura di Lucia De Angelis\nProduttore esecutivo Germana Mudanò"
