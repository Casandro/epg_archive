  title: 'Passato e Presente - Cristoforo Colombo '
  subtitle: 'Passato e Presente - Cristoforo Colombo la lettera che cambiò il mondo - Il 19 luglio 2023 l''Italia è entrata nuovamente in possesso di un testo preziosissimo: un incunabolo del 1493 contenente la copia in'
  description: "latino d'una lettera con cui Cristoforo Colombo ha dato conto al tesoriere del re d'Aragona della scoperta di alcune isole situate sulla rotta per l'Asia. L'epistola ''de Insulis Indiae supera Gangem nuper inventis'', scritta probabilmente nel febbraio del 1493, fu stampata in una tipografia romana il 30 maggio successivo. A lungo custodita in una miscellanea della Biblioteca Marciana di Venezia, trafugata alla fine degli anni Ottanta, è stata oggetto di una lunga indagine che, grazie alla collaborazione tra i Carabinieri del Comando Tutela del Patrimonio Culturale, l'Homeland Security Investigation americana e il professor Needham dell'Università di Princeton, ha portato al suo ritrovamento. La lettera era nelle mani di un collezionista di Dallas che non si è opposto alla sua confisca malgrado l'avesse acquistata per ben quindici milioni dollari. Ma nessuna cifra avrebbe potuto eguagliare il valore dell'incunabolo. Perché in sole otto pagine, con una manciata di parole, quell'incunabolo ha contribuito a cambiare il mondo, per sempre. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli \nCon la consulenza di Cristoforo Gorno \nProduttore esecutivo Valentina Tassini \nRegia Davide Frasnelli  \nOspite in studio il prof. Franco Cardini \nCon la partecipazione di Carla Oppo"
