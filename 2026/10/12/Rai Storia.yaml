  subtitle: 'Passato e presente - Attila il flagello di Dio - Attila, il ''''flagello di Dio'''', re degli Unni. Per secoli il suo nome è stato sinonimo di terrore e distruzione: il barbaro al cui passaggio tremava l''Europ'
  description: "a. Il suo nome ancora oggi evoca terrore e tragedia. Ma, dietro la leggenda c'è uno dei protagonisti indiscussi del V secolo, un uomo capace di costruire un grande impero e sfidare Roma nel suo momento di maggiore fragilità. Un uomo dai tanti volti: brigante avido, stratega spietato, abile condottiero, barbaro purificatore, mostro diabolico. Ma quanto della sua fama appartiene alla storia e quanto al mito? E chi erano veramente gli Unni? In studio con Paolo Mieli, il prof. Umberto Roberto. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Umberto Roberto \nCon la partecipazione di Matteo Marroni"
