  title: Doma je doma
  subtitle: Popoludňajšie stretnutie sa "doma v obývačke".
  description: 'V živote často čelíme výzve byť trpezlivý a vydržať. Gréckokatolícky katedrálny zbor Kyrillomethodeon oslavuje 90. výročie a musel vydržať aj príkoria totalitného režimu. Predstavíme aj novootvorený S klub v Študentskom domove Svoradov v Bratislave. Moderuje Pavol Danko. Hostia: František Bartek, Ladislav Sabolčák - dirigent zboru (2026)'
