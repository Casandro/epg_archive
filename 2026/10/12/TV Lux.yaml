  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Povolanie k láske ("Boh je láska a žije sám v sebe z tajomstva osobného spoločenstva lásky. Tým, že Boh stvoril ľudskú prirodzenosť muža a ženy na svoj obraz, vložil do nej povolanie - a teda schopnosť a morálnu zodpovednosť - k láske a spoločenstvu." (KKC 2331); Manželská láska ("Sexualita, prostredníctvom ktorej sa muž a žena navzájom odovzdávajú úkonmi, ktoré sú vlastné a vyhradené manželom, vôbec nie je iba čosi biologické, ale sa týka najvnútornejšieho jadra ľudskej osoby ako takej. Sexualita sa realizuje skutočne ľudským spôsobom len vtedy, ak je integrálnou súčasťou lásky, ktorou sa muž a žena úplne zaväzujú jeden druhému až do smrti." (KKC 2361) (2018)'
