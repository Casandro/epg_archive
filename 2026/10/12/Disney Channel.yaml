  description: Folge 67, Ted ist oft bei Stella und muss deshalb eine Menge Zeit im Zug zwischen New York City und New Jersey verbringen. Das hat zur Folge, dass er nicht mehr so oft seine Freunde sehen kann. Als Ted ihnen vorschlägt, für einen Samstagabend nach New Jersey zu kommen, stößt er auf Widerstand. Für New Yorker ist New Jersey Provinz und somit verachtenswert. Letztlich lassen sie sich doch breitschlagen und landen an dem besagten Abend in Stellas trostlosen Partykeller.
