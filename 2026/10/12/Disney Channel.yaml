  title: How I Met Your Mother
  subtitle: Unerwünschte Gäste Comedy-Serie, USA 2008
  description: Folge 69, Stellas Schwester Nora ist drei Tage vor der Hochzeit der Bräutigam abhanden gekommen, sodass Stella und Ted den Termin übernehmen. Gemeinsam mit ihren Freunden besuchen sie das Hochzeitshotel auf Shelter Island, das ein Yoga- und Meditationscenter ist. Entsetzt müssen Barney, Marshall und Lily feststellen, dass dort sowohl Alkohol als auch Fleisch verboten sind. Als Stella erfährt, dass Robin auch zur Hochzeit kommt, bittet sie Ted eindringlich, sie wieder auszuladen.
