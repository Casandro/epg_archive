  title: Profil 8 (odc. 4)
  subtitle: 'Ekipa jest świadkiem wzięcia zakładników: Claire, niestabilna młoda kobieta, szuka zemsty za dawną traumę. Adele rozumie, że w tych okolicznościach najważniejsze jest podjęcie dialogu.'
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2017
    Reżyseria: Fouad Benhammou
    Występują: Jean-Michel Martial, Raphaël Ferret, Philippe Bas, Juliette Roudet, Diane Dassigny, Sophie De Fürst
    Claire, niestabilna młoda kobieta, szuka zemsty za krzywdy wyrządzone jej w przeszłości. Ekipa jest świadkiem, jak zatrzymuje zakładników. Adele rozumie, że w tych okolicznościach najważniejsze jest podjęcie dialogu. Udaje się jej nakłonić kobietę do zwierzeń. Zdobyte informacje rzucają światło na sprawę zabójstwa Emeline, ciężarnej kobiety znalezionej nieopodal posiadłości. Adele chcce, by winowajca zapłacił za zbrodnie.
