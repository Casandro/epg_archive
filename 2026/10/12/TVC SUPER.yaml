  title: Winnice miłości 1 (odc. 26)
  subtitle: Achilleas robi wszystko, by być przy Melinie w trudnych chwilach. Anastasia zostaje obarczona winą za atak na Mattheosa. Achilleas postanawia udać się na Kretę, by spotkać się z Mattheosem.
  description: |-
    Tytuł oryginalny: Brousko
