    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Achilleas robi wszystko, co w jego mocy, by być przy Melinie w trudnych chwilach, jakie przeżywa ona w szpitalu, a jednocześnie odczuwa presję powrotu na Cypr. Tam czekają go jednak jeszcze poważniejsze problemy, a to z powodu spiskowania Eurydiki i Antonisa. Melina jest w szoku i nie może dojść do siebie po złych wieściach, które przynoszą jej lekarze. Nie może uwierzyć, że w ciągu jednej nocy wszystko się zmieniło, a jej marzenia umarły.
