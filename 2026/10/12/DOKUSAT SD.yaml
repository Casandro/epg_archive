  title: Geheime Helden - Nukleare Bedrohung
  subtitle: Geheime Helden - Nukleare Bedrohung
  description: 'Am 29. August 1949 zündet die Sowjetunion in Kasachstan ihre erste Atombombe. Seit den amerikanischen Angriffen auf Hiroshima und Nagasaki sind gerade einmal vier Jahre vergangen. Wie konnten die Russen derartig schnell nachziehen? Die Antwort ist einfach: Spionage. KGB-Agenten ist es tatsächlich gelungen, den innersten Zirkel der entsprechenden US-Laboratorien zu unterwandern. "Geheime Helden" erzählt, was damals passierte und wie die USA ihrerseits die Geheimcodes der UdSSR entschlüsselten.'
