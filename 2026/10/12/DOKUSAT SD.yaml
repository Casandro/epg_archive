  title: Geheime Helden - Die Agenten des D-Day
  description: 'Am 6. Juni 1944 landen nahezu 130.000 alliierte Soldaten in der Normandie. Ihr Ziel: die Befreiung Frankreichs und ganz Europas von der Nazi-Herrschaft. Die Invasion gelingt vor allem, weil die Deutschen den Angriff an völlig anderer Stelle erwartet hatten. Vorausgegangen war ihr der vielleicht größte Coup in der Geschichte der Desinformation. Die Alliierten hatten das Bild einer Geisterarmee geschaffen und ihre Gegner mit einem abenteuerlichen Netz aus Wahrheit und Lüge in die Irre geführt.'
  widescreen: true
- eventId: 1502093
  start: 2026-10-12T02:45:00Z
