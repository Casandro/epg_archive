- eventId: 1490220
  start: 2026-10-12T02:00:00Z
  stop: 2026-10-12T02:40:00Z
  title: Wie man Riesen bekämpft
  subtitle: Daniel Rentschler - Sklaverei muss aufhören
  description: "Daniel Renchler möchte auf den Kilimanjaro steigen, um ein Zeichen zu setzen gegen Sklaverei. Auch heute noch ist Sklaverei ein Riesenthema, das unter den Teppich gekehrt wird 50 Millionen Menschen weltweit leben in Sklaverei. Daniel ist zusammen mit seiner Frau Pastor in der City Church Ulm und liebt es Kirche neu zu definieren, so dass Menschen eine ganz neue Begeisterung entdecken, wenn sie einen Gottesdienst besuchen. Kirche muss lebendig sein. Christ sein kann nur echt sein im Engagement für andere Menschen, denen es nicht so gut geht. \n\nMehr Infos zu unserem Mutmach-Projekt \"WIE MAN RIESEN BEKÄMPFT?!\" findet Ihr hier:\nwww.wiemanriesenbekaempft.de"
  widescreen: true
  hd: true
- eventId: 1490267
  start: 2026-10-12T02:40:00Z
  stop: 2026-10-12T03:10:00Z
  title: ERF Mensch Gott
  subtitle: ERF MenschGott
  description: |-
    Ja, es ist möglich, Gott zu begegnen. Und diese Begegnung verändert Menschen. Deshalb erzählen wir bei ERF Mensch Gott solche ganz persönlichen Geschichten.
    Manche sind spektakulär, manche eher leise, aber alle tief berührend. Geschichten, bei denen man ins Staunen kommt, die zu Tränen rühren, die Hoffnung geben für das eigene Leben. Denn Gott will jedem Menschen begegnen - auch dir.
  widescreen: true
  hd: true
