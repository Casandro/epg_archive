  title: Charakterwerkstatt
  subtitle: Die Authentizität Jesu | Authentizität und Ehrlichkeit
  description: |-
    Nikodemus kommt nachts zu Jesus voller Fragen, Zweifel und der Sehnsucht nach mehr. In dieser Begegnung zeigt Jesus, dass wahre Authentizität nicht aus Ansehen oder Leistung entsteht, sondern aus einer tiefen Beziehung zu Gott und einem erneuerten Herzen.

    Diese Folge lädt dazu ein, ehrlich nach Wahrheit zu suchen, mutig Fragen zu stellen und zu entdecken, wie die Begegnung mit Jesus den Blick auf das Leben verändert. Authentizität beginnt dort, wo wir den Mut haben, echt zu sein.

