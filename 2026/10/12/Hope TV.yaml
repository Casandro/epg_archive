- eventId: 1490982
  start: 2026-10-12T03:10:00Z
  stop: 2026-10-12T03:20:00Z
  title: Open Doors Magazin
  subtitle: Hoffnung, die trägt
  description: |-
    Was gibt Menschen Kraft, wenn Ausgrenzung, Gewalt und tiefe Verluste ihr Leben erschüttern? Jorina hält trotz Konversion vom Islam und sozialer Ausgrenzung unbeirrt an ihrem Glauben, der Bibel und der Vergebung fest und leitet mit Unterstützung von Open Doors eine Hauskirche. Lamec aus der Demokratischen Republik Kongo hat durch einen Angriff auf sein Dorf fast alles verloren - und kämpft dennoch weiter für seine Familie und seine Hoffnung. Wie bleiben Christen standhaft unter Verfolgung? Welche Rolle spielen Gebet, Gemeinschaft und Vertrauen auf Gott? Schauen Sie rein ins Open Doors Magazin und lassen Sie sich berühren, herausfordern und zum Mitbeten bewegen.

    Weitere Infos unter www.opendoors.de
  widescreen: true
  hd: true
- eventId: 1490983
  start: 2026-10-12T03:20:00Z
  stop: 2026-10-12T03:50:00Z
  title: auserlesen
  subtitle: 'Uwe Birnstein: Aus dem Leben anderer lernen'
  description: |-
    Warum faszinieren uns die Lebensgeschichten anderer Menschen so sehr? Uwe Birnstein, Theologe, Journalist und Autor, beschäftigt sich seit vielen Jahren intensiv mit Biografien. Er porträtiert Reformatoren wie Martin Luther, Johannes Calvin und Philipp Melanchthon, Persönlichkeiten wie Johannes Rau oder Rainer Maria Rilke und Musiker wie Leonard Cohen, Bob Dylan und Johnny Cash. Seine Biografie über Margot Käßmann wurde 2018 zum "Spiegel" Bestseller. In dieser Sendung erzählt er, welche Kraft in guten Biografien steckt und welche Porträts ihn selbst im Leben und im Glauben am meisten geprägt haben.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
