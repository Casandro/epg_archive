  title: Klątwa Wyspy Dębów 4 (odc. 12)
  subtitle: Rick znajduje więcej dowodów łączących Wyspę Dębów z templariuszami. Wraz z Martym postanawiają wykopać trzeci otwór w "dziurze na pieniądze".
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2017
    Reżyseria: Kevin Burns
    Występują: Rick Lagina, Alex Lagina, Paul Troutman, Marty Lagina, Doug Crowell, Zena Halpern
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 1519128
  start: 2026-10-12T07:50:00Z
  stop: 2026-10-12T10:10:00Z
  title: Bóg wybacza - ja nigdy
  subtitle: Bezwzględny rabuś ograbia pociąg przewożący wypłaty. Na jego drodze staje tajemniczy rewolwerowiec pragnący zawłaszczyć jego łup. Podstępem wciąga rabusia do gry w pokera zakończonej strzelaniną.
  description: |-
    Tytuł oryginalny: Dio perdona... Io no!
    IT,ES, 1967
    Reżyseria: Giuseppe Colizzi
    Występują: Terence Hill, Frank Wolff, Bud Spencer, Gina Rovere, José Manuel Martín, Frank Bra?a
    Bezwzględny rabuś napada i ograbia pociąg przewożący wypłaty. Na jego drodze staje tajemniczy rewolwerowiec pragnący zawłaszczyć jego łup. Podstępem wciąga rabusia do gry w pokera zakończonej strzelaniną. Rewolwerowiec po wyeliminowaniu konkurenta dogaduje się z agentem ubezpieczeniowym kolei. Planują wspólnie szukać ukrytej fortuny pochodzącej z napadu. Jednak obydwaj nie wiedzą, że zabity bandyta miał jeszcze jednego asa w rękawie.
  ageRating: 16
  genre:
