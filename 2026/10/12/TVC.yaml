  title: Porzucone konstrukcje 1 (odc. 1)
  subtitle: W Portsmouth celnicy trafiają na autokary pełne pasażerów, którym oferowana jest darmowa podróż w zamian za zabranie przydziału tytoniu. Takie praktyki kosztują Skarb Państwa ponad 2 miliardy funtów rocznie.
  description: "Tytuł oryginalny: Abandoned Engineering\nGB, 2017\nReżyseria: Luke Wales\nWystępują: Roma Agrawal, Rob Bell, Sergey Chernov, Saul David, Andrew Gough, Minoru Kinoshita\nNa świecie znajduje się wiele niezwykłych inżynieryjnych projektów, które stworzono, aby ułatwić ludziom ich dotychczasowe życie. Niektóre z nich za sprawą sporów politycznych czy problemów finansowych zostały ostatecznie porzucone. Twórcy serii prezentują historie tych konstrukcji oraz ludzi, którzy je stworzyli bądź byli zaangażowani w ich realizację. Za każdą z konstrukcji kryją się bowiem pasjonujące i wyjątkowe dzieje. "
  ageRating: 7
