  title: Wochenrückblick vom 10.10.2026 (Wh.)
  subtitle: 'Ohne Ticket Bus und Bahn fahren, im schlimmsten Fall droht Gefängnis. Sollte das Schwarzfahren entkriminalisiert werden? Und: Militärflugzeuge am Airport Nürnberg - das Taktische Luftwaffengeschwader 74 aus Neu..'
  description: "Ohne Ticket Bus und Bahn fahren - im schlimmsten Fall droht dafür Gefängnis. In Augsburg sollen jetzt solche Vorfälle nicht mehr zur Anzeige gebracht werden. Wäre das auch für Nürnberg denkbar - wir haben darüber mit der VAG gesprochen. Ein Thema gleich im Wochenrückblick.  \n\nUnd dann waren in dieser Woche noch Militärflugzeuge über unsere Köpfen zu sehen. Der Grund: das Taktische Luftwaffengeschwader 74 aus Neuburg an der Donau hat in dieser Woche die Nutzung ziviler Infrastruktur für den Ernstfall geübt - und das am Airport Nürnberg. \nHeute für Sie im Studio: Moderator Adrian Roser."
