  audiodesc: true
  description: |-
    Julius zweifelt am Abend vor der Aufsichtsratssitzung: Ist es richtig, Richard zu unterstützen? Seine Familie grenzt ihn aus, Mo schneidet ihn, Simon führt ihm vor Augen, was einen guten Menschen ausmacht. Doch als Richard unfair gegen Victoria schießt, kann Julius nicht länger schweigen.
    Carla und Ellie glauben, dass Michael sie im Kampf um den Hof unterstützt. Doch Michael bietet Richard hinterrücks den Hof zum Kauf an.
    Der Lektorin gefällt Jess' Roman. Doch Jess soll das Ende zu einem Happy End umschreiben, damit er sich besser verkauft. Für Jess' Künstlerseele ein No-Go.
