  description: 'Mit kühleren Temperaturen kommt der Appetit auf herbstliche Gerichte wie wärmende Suppen, nahrhafte Eintöpfe oder deftige Ofengerichte. Die beste Zeit für Kohl- und Kürbisgerichte. Beide Gemüse kommen aus der Region und haben Hochsaison, sind besonders geschmackvoll, zudem prall gefüllt mit Vitaminen und anderen gesunden Inhaltsstoffen. Ein weiterer Vorteil: Die regionalen Produkte sind zur Erntezeit preiswerter als importierte Ware. So lässt sich beim Einkauf Geld sparen.'
