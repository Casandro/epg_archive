  description: 'Kattakind Mangoky wächst ohne Mutter auf, sie starb kurz nach seiner Geburt. Die Tierpfleger des Tropen-Aquariums ziehen den Kleinen nun mit der Flasche groß. Aber nicht nur fürs leibliche Wohl ist gesorgt: Papa Gerard ist wundersamer Weise in die Mutterrolle geschlüpft. Jetzt kann Mangoky auch kuscheln. Mandrill-Clanchef Enuro ist nicht auf Kuschelkurs. Dem alten Affen muss Blut abgenommen werden - dabei kommt sogar ein Besen zum Einsatz! Die Elefanten profitieren vom stürmischen Wetter und zwei Nandus nehmen stürmisch Abschied.'
