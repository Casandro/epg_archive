  description: 'Tomaten sind das beliebteste Gemüse der Menschen in Deutschland und Grundlage für die wohl wichtigste Soße zu Pommes, Burgern oder Currywurst: Ketchup. In der Nähe von Gifhorn wollen die IseBauern ihren ersten eigenen regionalen Ketchup produzieren. Ihre Idee: Tomaten aus dem eigenen Gewächshaus verwenden, die sie wegen kleiner Schönheitsfehler nicht mehr verkaufen können und bislang immer entsorgt haben. "Die Nordreportage" zeigt Ketchup-Profis wie die IseBauern, die mit Leidenschaft und neuen Ideen die beliebte Tomatensoße hierzulande im Norden produzieren.'
