- eventId: 892286
  start: 2026-10-12T02:30:00Z
  stop: 2026-10-12T02:40:00Z
  title: Mein Norden
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 892287
  start: 2026-10-12T02:40:00Z
  stop: 2026-10-12T03:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Auf Thudts Hof in Herrhausen am Harz hat die Erntezeit für Gemüse begonnen. Verschiedene Salate, aber auch Rote Beete, Aubergine, Fenchel und Mangold erntet Jessica Lange gleich am frühen Morgen und bringt das frische Gemüse in den Hofladen. Auch auf dem Blumenhof von Jens Wöbb in Hamburg-Altengamme ist die Erntezeit angelaufen. Die ersten Blumenfelder stehen bereits in voller Blüte und sind bereit zur Ernte. Zufrieden ist der Gärtner jedoch nicht.
