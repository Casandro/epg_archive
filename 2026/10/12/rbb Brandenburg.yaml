  description: |-
    Ulrike Finck ist unterwegs in einem parkähnlichen Privatgarten in Templin: Es ist ein Garten wie eine Gartenschau im Kleinen. Wechselflorbeete, Heckenkabinette, Stauden- und Rosenbeete, Schaugärten aus verschiedenen Ländern, wilde Wiesenbereiche und Kunst.
