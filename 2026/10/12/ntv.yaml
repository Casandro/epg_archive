  start: 2026-10-12T02:10:00Z
  stop: 2026-10-12T02:50:00Z
  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Marc Duttroux
  description: Marc Dutroux versetzt die belgische Nation in Aufruhr, als im Sommer 1996 ans Licht kommt, dass der verurteilte Kinderschänder sechs junge Mädchen zwischen acht und 19 Jahren entführen, foltern und vergewaltigen konnte.
  genre:
  - '17'
