  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Rodney Alcala
  description: Rodney Alcala wurde in den Vereinigten Staaten als "Herzblatt"-Mörder bekannt. Er tötete mindestens sechs Frauen und ein 12-jähriges Mädchen. Gefasst wurde der Serienkiller, weil er 1978 dreist in der US-Version von "Herzblatt" auftrat.
  genre:
  - '129'
- eventId: 1505619
  start: 2026-10-12T00:45:00Z
  stop: 2026-10-12T01:25:00Z
  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Peter Sutcliffe
  description: Peter Sutcliffe versetzte mit 13 Frauenmorden den Norden Englands in Angst. Nachts allein auf der Straße unterwegs zu sein, konnte für jede Frau tödlich enden. Als er 1981 gefasst wurde, ging eine Welle der Erleichterung durchs Land.
  genre:
  - '17'
- eventId: 1505620
  start: 2026-10-12T01:25:00Z
  stop: 2026-10-12T02:10:00Z
  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Volker Eckert
  description: Nur ein Zufall sorgte dafür, dass Volker Eckert, der LKW-Mörder, als einer der schlimmsten Serienmörder der Geschichte entlarvt werden konnte. Seine Kabine war ausstaffiert mit "Souvenirs" eines Serienkillers.
  genre:
  - '17'
