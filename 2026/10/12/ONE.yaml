  description: Hans-Dieter Sigl und Pierre M. Krause treffen sich schon wieder zur Kurzstrecke und sie haben immer noch das gleiche an. Dabei werden in dieser Folge noch Hosen ausgezogen. Erstmal geht es aber mit der Fähre über den Ammersee. Dort erzählt uns Hans Sigl, dass wir fast mit einem Pharmaunternehmer eine Kurzstrecke gedreht hätten. So wurde es zum Glück der Bergdoktor, der heute proaktiv durch die Lande zieht, um mit ahnungslosen Passanten Selfies zu machen. Die fragen sich dann zu Hause, was der Mann mit der MC-Jacke auf ihren Hochzeitsfotos macht. Andere wiederum besuchen extra sein Bühnenprogramm, bei dem Pierre heute zu Gast ist.
