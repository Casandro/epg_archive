  start: 2026-10-12T09:15:00Z
  stop: 2026-10-12T10:00:00Z
  title: The Dolomites
  subtitle: Summer in the Italian Alps
  description: In the Dolomites, Italy's "dolce vita" culture meets Alpine tradition — the perfect combination for anyone who wants spectacular natural scenery coupled with a diverse culinary scene. Beyond better-known tourist destinations like Seiser Alm, the Tre Cime di Lavaredo and the Rosengarten, there is much to discover in the Dolomites — or "pale mountains". In the Friulian Dolomites Nature Park, a team of biologists, veterinarians and animal rangers saves the life of an ibex by performing emergency surgery on a crooked horn. South of Bolzano, a photographer captures the portraits of elderly mountain farmers and alpinists from remote valleys as part of a UNESCO project — using camera technology that's over a century old. A young shepherd couple spends their summer on a secluded high pasture near the Valles Pass, relishing their modest Alpine lifestyle. An entrepreneur from Trento, a city on the Adige River, makes speaker cabinets from the wood of trees felled by a hurricane, while investing in local reforestation. And in Val Gardena, on one of the oldest farms in the Alps, a family offers guests a menu of traditional Ladin food — the regional cuisine — made with ingredients they grow themselves.
  widescreen: true
- eventId: 1521636
  start: 2026-10-12T10:00:00Z
  stop: 2026-10-12T10:02:00Z
