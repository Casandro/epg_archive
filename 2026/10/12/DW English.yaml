  title: The Gen Z Reading Phenomenon
  description: "The new books have striking, glossy covers, their language is easy to follow, the stories are romantic, exciting and full of eroticism from a female perspective. But young women aren't just engaging in online discussions about their favorite books. Book blogger Jess 'miss.Nerdstagram' also meets her followers in person at events like the Book Ball at Namedy Castle in Germany.\nAuthor Kim Leopold from the German town of Rheine also frequently takes to the road to be close to her fans. She's an 'own voice' author writing about her own personal experience, in stories that satisfy the hunger for authentic narratives. Topics such as mental health, body positivity and ADHD are close to her heart. Kim is nervously awaiting the release of her latest book, which ventures into new territory: the focus is no longer on a single woman, but on a young married couple. Will this story also resonate with her fans? \nThe Riekes are living their dream in Jever: right in the center of town, they've opened a shop dedicated to the New Adult phenomenon. The young entrepreneurs are also a couple in their private lives and post clips on social media as a comedy duo. For them, just as for Kim and Jess, attending the Frankfurt Book Fair is the highlight of the year. But traditional critics at events like these are generally skeptical of these modern literary formats, no matter how vibrant they may be. Can the couple hold their own?"
  widescreen: true
