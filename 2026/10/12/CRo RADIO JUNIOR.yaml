  start: 2026-10-12T16:30:00Z
  stop: 2026-10-12T16:55:00Z
  title: Čtení na pokračování
  description: 'Kluci netančej 2/5. Balet je pořádně náročný, je to umění a zároveň i vrcholový sport. Spousta holek se chce stát baletkami. Jaké to ale je, když se baletu chce věnovat kluk? Napsala: Olga Stehlíková. Režie: Izabela Schenková. Natočeno v roce 2019. Čtou: Matěj Havelka, Sophie Louise Bransten a další.'
