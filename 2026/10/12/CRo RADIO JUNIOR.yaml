  title: Klub Rádia Junior
  description: Speciální vysílání z 58. Dětského filmového a televizního festivalu Oty Hofmana v Ostrově. Filmové plátno, zajímaví hosté a atmosféra, která se jen tak nezažije! Dětský filmový a televizní festival Oty Hofmana v Ostrově je v plném proudu a moderátorka Rádia Junior Klára Nováková vyráží přímo do jeho centra. Čekají nás rozhovory s herci, režiséry, porotci, dětskými novináři i dalšími festivalovými hosty. Budeme zjišťovat, jaké je to stát před kamerou, tvořit filmové příběhy a představovat je divákům. A hlavně budeme nasávat jedinečnou atmosféru festivalu, kde se potkávají lidé, které spojuje láska k filmu. Poslouchej naše speciální festivalové vysílání z Ostrova! Moderuje Klára Nováková a Jiří Kohout.
