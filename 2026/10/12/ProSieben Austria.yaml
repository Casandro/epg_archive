  title: 'Galileo X-Plorer: Saudi-Arabien - Das neue Dubai'
  subtitle: |-
    Galileo X-Plorer: Saudi-Arabien - Das neue Dubai
    Information, D 2026
    Altersfreigabe: ab 12
    (WH vom Sonntag, 11.10.2026, 19:05 Uhr)
  description: Das Königreich Saudi-Arabien öffnet sich zunehmend für den weltweiten Tourismus und treibt spektakuläre Megaprojekte voran. Die Galileo X-Plorer reisen durch den Wüstenstaat, um den Wandel hautnah zu erleben. In der Unterhaltungsstadt Qiddiya City entstehen u. a. ein Erlebnispark mit Weltrekord-Achterbahnen und Aquarabia, der größte Wasserpark der Welt. Wie viel gesellschaftlicher Aufbruch findet tatsächlich im Land statt? Und wie wird Umweltschutz mit den Bauvorhaben vereinbart?
