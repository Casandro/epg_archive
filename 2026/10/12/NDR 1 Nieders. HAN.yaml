  title: Niederdeutsches Hörspiel
  subtitle: 'Smiet Rin - Mehr as blots ümtrecken!: De leeve Familie (Folge 1)'
  description: |-
    Niederdeutsche Hörspielreihe
    Von Dirk Böhling
    Regie: Ilka Bartels
    RB/NDR 2026

    Ob Umzug, Wohnungsauflösung, Zwangsräumung oder Möbeltransport - im  Umzugsunternehmen "Smiet Rin" sorgen Inhaberin Isabell Smitt und ihr Team dafür, dass die Wünsche ihrer Kund*innen zuverlässig erfüllt werden.

    Hannes und Daniel sollen einige Möbel aus Frau Pawlaks alter Wohnung ins Seniorenheim bringen. Vor Ort erwartet sie eine Überraschung: Frau Pawlak ist noch in ihrer Wohnung und weigert sich, sie zu verlassen. Die Umstände, die die Seniorin in ihre Situation brachten, verschlagen dem Team die Sprache.
