  description: "Au sommaire :\n\nTerritoires autochtones : l'heure de la réappropriation a sonné\nL'heure de la réappropriation a sonné pour les Atikamekw et les Innus. Confrontés durant des siècles à la perte de leurs terres ancestrales, ces deux peuples, membres des Premières Nations du Québec, relèvent la tête et veulent que cesse l'exploitation des forêts sans leur consentement et sans leur participation.\n\nDéterrer le savoir ancestral des trois soeurs Wendat\nLa Nation Wendat veut faire renaître au Québec la tradition de la technique agricole dite « des trois soeurs ». La culture du maïs, des courges et des haricots grimpants sur une même surface présente des avantages agronomiques.\n\nPrésentation : Catherine Gauthier\n "
