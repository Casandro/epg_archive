  title: kulturMONTAG
  description: "Unendliche Universen\n\"Möge die Macht mit uns sein\", das sagte nicht nur Jedi-Meister Yoda, das dachte sich wohl auch \"Star Wars\"-Erfinder George Lucas. Nach dem milliardenschweren Verkauf seines Imperiums an Walt Disney ließ er jüngst ein spaciges Raumschiff direkt in Los Angeles landen. Das \"Lucas Museum für die Kunst des Geschichtenerzählens\", eine futuristische Architektur auf mehr als 9000 Quadratmetern, lässt nicht nur die Herzen der Star Wars Fans höherschlagen. \nIhre Figuren haben Ecken und Kanten, sind rebellisch, frech oder ängstlich. Mit ihren erfrischenden Geschichten \"Wir pfeifen auf den Gurkenkönig\", \"Maikäfer flieg\" oder \"Konrad oder Das Kind aus der Konservenbüchse\", die allesamt zum Kanon der deutschsprachigen Literatur gehören, hat Christine Nöstlinger viele Kindheitserinnerungen geprägt. Zu ihrem 90. Geburtstag kommt jetzt die Dokumentation \"Sowieso und überhaupt\" ins Kino. \nInternationale Schwergewichte wie Wolf Biermann, Colson Whitehead oder Gisèle Pelicot werden zur 78. Ausgabe der Frankfurter Buchmesse erwartet. Im Fokus stehen in diesem Jahr Themen wie Demokratie, Meinungsfreiheit, Menschenrechte sowie der Umgang mit weltweiten Konflikten und technologischen Umbrüchen.\nModeration: Peter Schneeberger"
  genre:
