  stop: 2026-10-12T03:04:00Z
  title: Mein wunderbarer Kochsalon - Erdäpfelkas mit geräucherter Forelle
  subtitle: Mein wunderbarer Kochsalon - Erdäpfelkas mit geräucherter Forelle
  description: Lukas Nagl ist ein Meister seiner Klasse - als Vier-Hauben-Koch verteidigt er mit dem Bootshaus eine Spitzenposition in der österreichischen Gastronomie. Der See und alles, was aus ihm kommt ist seine Spielwiese, nebenbei produziert er noch mit Partnern erstklassige Fermentationsprodukte wie Misopasten und Sojasauce. Im Kochsalon zeigte er uns, wie man im Backofen ganz einfach Fisch räuchern kann - einen Kuchen sollte man nicht unmittelbar danach backen wollen, aber die Rauchbombe war es allemal wert. Smoerebroed kann einpacken, das ist das Weltmeisterbrot mit Erdäpfelkas, geräuchertem Fisch und hauchzarten Radieschen. AT 2022
