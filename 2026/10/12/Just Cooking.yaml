  title: Mein wunderbarer Kochsalon - Chili-Paprika-Paste
  subtitle: Mein wunderbarer Kochsalon - Chili-Paprika-Paste
  description: 'Mein Mann erklärt mir immer, dass Grillen das Einfachste und Unkomplizierteste überhaupt ist. Kehrt die archaischen Gefühle hervor, die das heiß gestreifte Fleisch in ihm hervorruft und preist die Vorzüge der einfachen Küche. Ja, er hat leicht reden, weil am Grill steht bei uns... drei Mal dürft ihr raten: die Gattin. Ich beize also, was das Zeug hält, mariniere Salate und bringe den Griller zum Glühen. Bis es zur Sauce kommt, herrscht heilige Einigkeit, aber dann entfacht die einfache Frage Funken zwischenmenschlicher Natur: Greift man zur fertigen Sauce oder tut man sich noch die Mühe einer selbst produzierten an? Die Fronten sind klar, diesmal habe ich gewonnen: Dank dieses einfachen Rezepts für eine sagenhaft fruchtig-scharfe Grillsauce fehlten dem Mann dann auch die Argumente. Die Paprika und Chilis dafür stammen übrigens von Michael Unger aus dem Seewinkel. AT 2022'
  ageRating: 6
- eventId:
