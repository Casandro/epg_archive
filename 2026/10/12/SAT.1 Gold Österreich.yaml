    Her mit den Angeklagten
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: Der Spielhallenbesitzer Leo Brand überfällt allem Anschein nach seine eigene Filiale und erschießt dabei eine Mitarbeiterin. Noch mysteriöser erscheint das Tatgeschehen, weil der Räuber mit einem gleichaussehenden Mittäter auftrat. Hat der 40-Jährige vielleicht einen heimlichen Zwilling und mit diesem zusammen seine eigene Spielhalle ausgeraubt? Äußerst unwahrscheinlich. Das findet auch Staatsanwältin Benita Schrank und verfolgt eine ganz andere Theorie ...
