  subtitle: |-
    Geldgeile Eltern
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: Martina Krass hat in der Lotterie eine lebenslange monatliche Sofortrente von 5.000 Euro gewonnen, da treten schon ihre berufsunfähigen Eltern auf den Plan und bitten zur Kasse. Nach einem Gerichtsurteil muss sie ihren Eltern tatsächlich Unterhalt zahlen. Doch dagegen wehrt sich Martina, da ihre Eltern gar nicht so mittellos sind, wie sie scheinen. Sind ihre Eltern tatsächlich nur Schmarotzer und wollen ihre eigene Tochter ausnehmen? Oder tut ihnen Martina Unrecht?
  widescreen: true
