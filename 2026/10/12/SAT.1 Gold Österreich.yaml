    Altersfreigabe: ab 12
  description: 'Comeback für Ingo Lenßen: Ab heute kehrt der beliebte Verteidiger bei "Richter Alexander Hold" auf den Bildschirm zurück - mit einem ungewöhnlichen Fall: Nachdem seine Mutter die Familie verlassen hat, ist der 15-jährige Jannik abgestürzt. Alkohol und auffälliges Verhalten sind seitdem an der Tagesordnung. Jetzt ist Jannik angeklagt, weil er seine Nachbarin Nicole Klein brutal überfallen und ausgeraubt haben soll. Doch es kommt noch schlimmer ...'
