    Altersfreigabe: ab 12
  description: 'Weil ihn drei seiner Mitschülerinnen über Jahre hinweg mobbten, soll sich Mike jetzt an ihnen gerächt haben: Nach dem Vorbild des Computerspiels "Wild Hunter" soll er die Mädchen nachts durch den Park gejagt, sie gefesselt, geknebelt und mit einem Messer verletzt haben. Eines der Mädchen bekommt sogar eine Morddrohung. Verbirgt sich tatsächlich Außenseiter Mike hinter dem Pseudonym "Der Jäger" - oder haben die Mädchen noch andere Feinde?'
