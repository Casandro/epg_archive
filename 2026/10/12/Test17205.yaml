  title: Blind
  description: |-
    1 (1/6) La femme enceinte Nathaniel, un barman aveugle, signale l'enlèvement d'une jeune femme en fin de grossesse, Carole Stein. La police ne trouvant aucun indice pour confirmer ses dires, Nathaniel devient vite suspect. Mais une journaliste prénommée Milla croit en son innocence. Lorsque la jeune femme présumée disparue réapparaît soudainement, Nathaniel est convaincu que cette femme n'est pas celle qui se trouvait à son bar; c'est une sosie qui tente de se faire passer pour Carole Stein.

     (Suisse-2026)  "Audio description"
