  title: Le Miracle Suisse
  description: Le parler romand Mais adieu donc, ça joue le chalet ? Eh oui, il existe un parler romand ! Et chaque canton est fier de son accent et de ses expressions. Certains mots comme panosse, catelle, clopet ou cornet n'existent que chez nous. Et puis nous ne disons pas forcément quatre-vingt comme nos amis français, mais huitante ou même octante dans certains endroits, et puis septante et nonante, bien entendu. Nous ferons le tour des différents cantons suisses. Nous rencontrerons l'humoriste vaudois Vincent Kucholl qui régale depuis 15 ans le public romand avec ses personnages et ses accents très typés. Nous parlerons aussi en patois et nous découvrirons ce qu'est le prix Champignac. Y'a pas le feu au lac mais avec le Miracle Suisse, y'a le feu à la lucarne !  "Audio description"
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
