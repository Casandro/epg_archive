  title: Blind
  description: 1 (2/6) Le chaman Alors que Milla enquête sur une série d'infections mystérieuses par le VIH, le guérisseur charismatique Jean Schwaabe se retrouve dans le collimateur de la police. De son côté, Nathaniel suit toujours avec obstination la piste d'une possible sosie. L'intrigue révèle que la vraie Carole est effectivement retenue captive et qu'elle court un grave danger. (Suisse-2026)  "Audio description"
