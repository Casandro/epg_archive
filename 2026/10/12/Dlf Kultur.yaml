  description: "Kultur und Politik am Morgen\nMit Buchkritik\nModeration: Stephan Karkowsky\n05:50-05:54 Aus den Feuilletons\n\n06:00-06:05 Nachrichten\n\n06:20-06:23 Wort zum Tage\nPfarrerin Antonia Klumbies, Karlsruhe\nEvangelische Kirche\n\n06:30-06:33 Nachrichten\n\n07:00-07:05 Nachrichten\n\n07:20-07:24 Politisches Feuilleton\nHart arbeiten - kein deutscher Wesenszug?\nVon Paul Stänner\n\n07:30-07:33 Nachrichten\n\n07:40-07:48 Interview\n\n08:00-08:05 Nachrichten\n\n08:30-08:33 Nachrichten\n\n08:50-09:00 1001 Nacht\nNacht 116/121: Ein nervöser Esel \n\nDie Ente erzählt Frau Pfau von einem jungen Löwen. Selbst dessen Vater warnt vor den Menschen. Aus einer Staubwolke erscheint ein Esel - der hat hier einen Menschen gesehen! Er sucht Schutz vor dem Sohn Adams, der Esel bis auf die Knochen ausbeutet.\n\nNach der Neuübersetzung von Claudia Ott\nAuswahl der Geschichten: Safiye Can\nHörspielbearbeitung und Storytelling: Judith Lorentz, Roxana Samadi\nMit Roxana Samadi, Jasmin Shakeri, Susana AbdulMajid\nBesetzung: Kathi Bonjour\nRegieassistenz: Vanessa Gräfingholt, Delia Lang\nExpertin für Arabisch: Heba Tebakhi\nÜbersetzung und philologische Beratung: Claudia Ott\nCopyright der Übersetzung: Verlag C. H. ..."
