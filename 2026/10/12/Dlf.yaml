  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nFall Christa Pike: Gibt es eine ?humane Todesstrafe??\nDer Fall der verurteilten Mörderin Christa Pike hat weltweit für Entsetzen gesorgt und die Debatte über vermeintlich ?humanes Töten? neu entfacht. Was sagt die Praxis der Todesstrafe über das Wesen eines Staates aus und über sein Verhältnis zu Grausamkeit, Macht und Ordnung? Ein Gespräch über ethisch-philosophische Implikationen der Todesstrafe in modernen Demokratien.\n\nVerbrecher oder Heiliger? Die Verehrung von Alojzije Stepinac in Kroatien \nAm 11. Oktober 1946 wurde Alojzije Stepinac, der Erzbischof von Zagreb, in einem Schauprozess zu 16 Jahren Haft verurteilt - wegen angeblicher Kollaborationen mit dem faschistischen Ustasa-Regime. Dennoch blieb er Bischof und ließ sich von Papst Pius XII. zum Kardinal ernennen. Ob Stepinac tatsächlich Schuld auf sich geladen hat oder ein Märtyrer im Kampf gegen totalitäre Herrschaft war, ist bis zum heutigen Tag umstritten. \n\nAm Mikrofon: Elena Hong"
