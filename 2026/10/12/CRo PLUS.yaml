  description: Česko zažívá výrazný pokles počtu narozených dětí. Zároveň se rodičovství posouvá do vyššího věku - první dítě ženy mívají v průměru až v 29 letech. Do jaké míry ovlivňují rozhodování o rodičovství životní podmínky a kdy už začíná rozhodovat věk a biologie? A jaká je v ČR situace s mužskou plodností? Hostem pořadu Leonardo Plus je lékař Pavel Otevřel, specialista na reprodukční medicínu a vědecký sekretář Sekce asistované reprodukce České gynekologické a porodnické společnosti České lékařské společnosti Jana Evangelisty Purkyně.
