  title: Hlasy paměti
  description: Miloš Havel, filmový magnát, velkorysý bohém, který byl na každém kroku obklopen filmovými hvězdami. Postavil barrandovské ateliéry, v jeho filmech zářily prvorepublikové hvězdy jako Adina Mandlová nebo Lída Baarová, ve 30. letech pořádal nejen v Lucerně velkolepé večírky. Muž, kterému se nakonec stala osudným spolupráce s Němci za druhé světové války. Nad jeho životem a osudovými volbami se zamýšlí Lucie Korcová a Adam Drda.
