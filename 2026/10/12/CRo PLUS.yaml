- eventId: 678812
  start: 2026-10-12T02:05:00Z
  stop: 2026-10-12T02:33:00Z
  title: Laboratoř
  description: Jak se útok na Izrael z října 2023 promítl do duševního zdraví svědků událostí? V jakém psychickém stavu jsou ukrajinské děti? Co zvyšuje naši odolnost vůči traumatu? Debatují neurovědec a psychiatr Jiří Horáček, evoluční psycholog Marek Špinka a zlatý medailista z Mezinárodní biologické olympiády, student Jan Beránek.
- eventId: 678813
  start: 2026-10-12T02:33:00Z
  stop: 2026-10-12T03:00:00Z
  title: Osobnost Plus
  description: Pavel Barša, politolog. "Pro mě je u Václava Havla podstatná myšlenka interakce svobodných lidí. To, že vzniká něco nového a životaschopného mezi lidmi v určitých chvílích, ve kterých se přestanou bát, začnou se starat o ty druhé a vytvářet veřejný prostor, ve kterém je každý součástí něčeho, co ho přesahuje," říká o prvním českém prezidentovi. Jak chápe Havlovu nepolitickou politiku a co dnes znamená žít v pravdě? Moderuje Světlana Witowská.
