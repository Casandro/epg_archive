- eventId: 1629510
  start: 2026-10-12T03:03:00Z
  stop: 2026-10-12T04:29:00Z
  title: Tu, hrvatski film
  subtitle: ' '
  description: 'Drama. Film "Tu" djelo je s radnjom iz suvremenoga života, što sugerira i naslov. Metodom koja podsjeća na isprepletene kriške života, film stvara panoramski prikaz ovdašnje sredine. Desetak likova prati se izdvojeno, na prvi pogled čak i nasumično, da bi se ponovno pojavili, ponekad i susreli. Likovi tvore galeriju marginalaca (umirovljenik, narkomanka, bivši ratnici...), ljudi mahom bez perspektive, pa je i sveukupna slika ovdašnje stvarnosti poprilično tmurna.  Nagrade: Kristalni globus, Posebna nagrada žirija, 39. međunarodni filmski festival u Karlovym Varyma, 2004.; Grand prix, 9. međunarodni filmski festival u Milanu, 2004.; 27. međunarodni filmski festival u Denveru, 2004. (Nagrada "Krzysztof Kieslowski"); 11. međunarodni filmski festival u Paliću, 2004.; 50. filmski festival u Puli, 2003.; Nagrada međunarodnog žirija kritike, 26. mediteranski filmski festival u Montpelliereu, 2004.; Godišnja nagrada "Vladimir Nazor", 2004. U glavnim ulogama nastupaju Zlatko Crnković, dobitnik Zlatne arene za glavnu mušku ulogu na 50. filmskom festivalu u Puli, zatim Ivo Gregurević, Jasmin Telalović, Marija Tadić, Ivan Herceg, Nikola Ivošević te niz glumaca u izvrsno ostvarenim epizodnim ulogama. Direktor fotografije je Davorin Gecl, čiji je snimateljski rad osobito hvaljen u američkom "Varietyju", montažer Josip Podvorac, dobitnik Zlatne arene za montažu na festivalu u Puli.  Suradnik na scenariju: Josip Mlakić Majstorica maske: Slavica Živaljić Majstori zvuka: Zbynek Mikulik i Tomislav Fogec'
- eventId: 1629511
  start: 2026-10-12T04:29:00Z
  stop: 2026-10-12T04:38:00Z
  title: 'Abeceda zdravlja: Fascija'
  subtitle: ' '
  description: U deset minuta govori se o jednoj bolesti i načinima liječenja te mogućnostima koje nude suvremena dijagnostika i terapija.
- eventId: 1629512
  start: 2026-10-12T04:38:00Z
  stop: 2026-10-12T04:46:00Z
  title: 'Studio 4: Kultura'
  subtitle: ' '
  description: Najnoviji informativni sadržaji iz zemlje i svijeta. Prijenosi, javljanja uživo, analize i razgovori s gostima iz svih područja javnog djelovanja. Politika, kultura, sport i aktualnosti iz društvenog života. Prvi, najbrži i najrelevantniji - Studio 4.
- eventId: 1629513
