- eventId: 1629514
  start: 2026-10-12T05:46:00Z
  stop: 2026-10-12T06:12:00Z
  title: 'Mostovi: Hrvatski identitet - Srednjoeuropljani i Vlaji , dokumentarna serija (2018.)'
  subtitle: ' '
  description: U trećoj epozodi pokazujemo hrvatske kulturološke razlike i sličnosti između različitih krajeva Hrvatske. Dokumentarni film otkriva koliko Varaždin ima sličnosti s Mućem i kako na te kulturne vaze središta i provincije utječe globalizacija.
- eventId: 1629515
  start: 2026-10-12T06:12:00Z
  stop: 2026-10-12T07:36:00Z
  title: 'Tereza Kesovija: Još se srce umorilo nije - 50 godina umjetničkog rada, snimka koncerta'
  subtitle: ' '
  description: Naša istinska glazbena diva Tereza Kesovija obilježila je 50 godina uspješne i bogate karijere svečanim gala koncertom "Još se srce umorilo nije", uz sudjelovanje Simfonijskog orkestra HRT-a. Koncert je održan u Koncertnoj dvorani Vatroslava Lisinskog u Zagrebu 23. rujna 2010. godine.
