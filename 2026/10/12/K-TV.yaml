  title: Glaubenszeugnisse by @tini
  subtitle: Gespräch
  description: Eine Begegnung mit Gott kann alles verändern und von dieser Erfahrung gibt Tini Zeugnis. Gott lässt sich im Alltag finden und mit Impulsen über Tinis persönliches Glaubensleben möchten wir dich für dein Abenteuer mit Gott inspirieren! Dich erwarten außerdem neue Gesichter mit spannenden Geschichten. Lets share the good news and get ready for your godly meeting!
