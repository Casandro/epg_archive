  title: Influencer Gottes? - Katholiken in den Fußspuren von Carlo Acutis
  subtitle: Dokumentation
  description: 'Das Internet ist längst zu einem neuen "digitalen Kontinent" geworden, auf dem sich Glauben, Gemeinschaft und Sinnsuche neu entfalten. In dieser Dokumentation gehen wir der Frage nach, wie Christinnen und Christen im Jahr 2025 Social Media nutzen, um das Evangelium zu verkünden und Menschen zu erreichen. Der heilige Carlo Acutis, der als erster "Internet-Apostel" der katholischen Kirche gilt, ist dabei eine zentrale Leitfigur: Schon als Jugendlicher erkannte er die Möglichkeiten des Netzes, um Glauben sichtbar zu machen und Hoffnung zu teilen.'
- eventId: 1610750
  start: 2026-10-12T03:00:00Z
  stop: 2026-10-12T03:15:00Z
  title: Spirit
  subtitle: Wie Carlo Acutis die Herzen für den Glauben öffnet, Pfr. Tobias Brantl / Gespräch
  description: |-
    Pfarrer Tobias Brantl, geistlicher Berater des Vereins "Freunde von Carlo Acutis"
    Moderation: Volker Niggewöhner, 538b


    Zum 20. Todestag des heiligen Carlo Acutis im Oktober 2026 greift der Beitrag dessen Verbindung von Glauben und digitaler Welt auf, die weit über kirchliche Grenzen hinaus Menschen berührt. Im Gespräch mit Volker Niggewöhner erläutert Pfarrer Tobias Brantl, warum der junge Italiener als Hoffnungsträger in Krisenzeiten und Vorbild für die Jugend gilt. Ein Einblick in das Leben eines Heiligen, dessen Wirken das Wort von Papst Benedikt XVI., "Die Kirche lebt - und sie ist jung", verkörpert.
- eventId: 614013
  start: 2026-10-12T03:00:00Z
  stop: 2026-10-12T03:15:00Z
  title: 'Spirit: Wie Carlo Acutis die Herzen für den Glauben öffnet'
  subtitle: Gespräch
  description: '"Die Kirche lebt - und sie ist jung." Dieses Wort von Papst Benedikt XVI. scheint im Leben des heiligen Carlo Acutis Wirklichkeit geworden zu sein.Der italienische Teenager verband Glauben, Alltag und digitale Welt auf eine Weise, die bis heute Menschen berührt, weit über kirchliche Grenzen hinaus.Was macht Carlo Acutis zu einem Hoffnungsträger in Zeiten kirchlicher Krisen? Und warum spricht sein Zeugnis gerade junge Menschen an?Darüber spricht Volker Niggewöhner mit Pfarrer Tobias Brantl.'
- eventId:
  - 1610751
  - 614014
  start: 2026-10-12T03:15:00Z
  stop: 2026-10-12T03:45:00Z
  title: Kardinal Leo Scheffczyk - einer der großen Theologen unserer Zeit
  subtitle: Dokumentation
  description: |-
    Am 8. Dezember feiert die Kirche das Hochfest der ohne Erbsünde empfangenen Jungfrau und Gottesmutter Maria - eines der schönsten Marienfeste des Jahres.
    Für die geistliche Familie Das Werk in Bregenz ist dieses Datum doppelt bedeutsam. Am 8. Dezember 2005, starb hier im Kloster Thalbach Kardinal Leo Scheffczyk - einer der großen Theologen des 20. Jahrhunderts, Dogmatiker, Priester und leidenschaftlicher Marienverehrer. Sein Grab, seine Bücher und seine Gedanken sind bis heute lebendig - im Kardinal-Leo-Scheffczyk-Zentrum, das Pater Johannes Nebel leitet. Wir haben Pater Nebel in Bregenz besucht - und ihn gebeten, uns auf eine kleine Spurensuche mitzunehmen: Wer war Leo Scheffczyk? Was bleibt von seinem Denken? Und warum war Maria für ihn der Schlüssel zur Theologie?
