  title: Deutschland 1933 - Wie die Nationalsozialisten in wenigen Wochen die Demokratie abschaffen
  subtitle: Machtübernahme
  description: 'Am 30. Januar 1933 wird Adolf Hitler zum Reichskanzler ernannt: Die Nationalsozialisten übernehmen in Deutschland die Macht. Die Weimarer Republik ist zu diesem Zeitpunkt schwer angeschlagen. Aus der Wirtschaftskrise von 1929 ist eine Staatskrise geworden. Die Demokratie scheint am Ende. Die instabile Situation hat Hitlers Partei, die NSDAP, stark gemacht. Sie beginnt jetzt mit dem systematischen Umbau der Gesellschaft. Joseph Goebbels, einer von Hitlers engsten Mitstreitern, betreibt gezielt Propaganda für die NS-Bewegung. Auch einflussreiche Wirtschaftsvertreter wie Hjalmar Schacht stehen auf Hitlers Seite.'
- eventId: 712446
  start: 2026-10-12T03:40:00Z
  stop: 2026-10-12T03:55:00Z
  title: Deutschland 1933 - Wie die Nationalsozialisten in wenigen Wochen die Demokratie abschaffen
  subtitle: Propaganda und Gleichschaltung
  description: 'Nach der Machtübernahme beginnen die Nationalsozialisten, die öffentliche Meinung durch Propaganda zu lenken. Bei der NSDAP ist dafür Joseph Goebbels zuständig. Führende Wirtschaftsvertreter wie Hjalmar Schacht unterstützen die NS-Regierung und hoffen, dass sie der Wirtschaft auf die Beine hilft. Die NSDAP betreibt die Gleichschaltung der Gesellschaft: Sie besetzt staatliche und gesellschaftliche Institutionen mit ihren Anhängern - auch Polizei und Justiz. Magnus von Levetzow wird neuer Polizeipräsident. Er will beim Aufbau der NS-Diktatur helfen.'
- eventId: 712674
  start: 2026-10-12T03:55:00Z
  stop: 2026-10-12T04:00:00Z
  title: Erklär's mir
  subtitle: Warum ernähren sich Menschen vegan?
  description: 'Kein Fleisch, keine Milch, keine Eier - wer sich vegan ernährt, verzichtet auf tierische Produkte. Drei der möglichen Gründe, weshalb sich Menschen zu einer veganen Ernährung entscheiden: Erstens. Das Tierwohl. Viele möchten nicht, dass Lebewesen für sie sterben oder leiden. Viele Tiere in Massentierhaltung leben unter schlechten Bedingungen. Was zum zweiten Grund führt. Der Umweltschutz. Denn bei der Produktion tierischer Lebensmittel entstehen viele klimaschädliche Gase und Wälder werden für Tierfutter abgeholzt. Drittens: Die Gesundheit. Zu viel Fleisch ist ungesund.'
