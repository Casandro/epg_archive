  title: Eisenbahn-Romantik (819)
  subtitle: Der Rasende Roland - Mit Tempo 30 über die Insel Rügen
  description: Die vielfältigen Reize von Rügen zu beschreiben, ist ein schweres Unterfangen. Eine riesige Fülle an Sehenswürdigkeiten, Geschichte und Kultur machen die größte deutsche Insel zu einem Reiseziel, das man erleben und "erfahren" sollte - am besten mit dem dampfbetriebenen "Rasenden Roland". Die Geschichte der schmalspurigen Rügenschen Kleinbahn begann im Jahre 1895. Vieles haben die ursprünglich knapp einhundert Kilometer langen Gleise auf der Insel seither erlebt, wurden doch Millionen von Gästen mit maximal 30 Kilometern pro Stunde über die Insel geschaukelt.
