  subtitle: Unsere Seen im Norden
  description: In der Dokumentation werden die schönsten Seen im Norden Deutschlands vorgestellt. Gezeigt werden ihre Besonderheiten, wie die überraschenden Zeugnisse menschlicher Zivilisation, der tiefste Punkt, oder das geheime Leben der Tiere im See. Etwa kinderfressende Frösche, das Liebesleben der Bitterlinge und die blubbernden Gase am Grunde der Vulkanseen der Eifel.
