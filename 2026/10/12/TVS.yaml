  title: 'Rosamunde Pilcher: Przepowiednia 1 (odc. 159)'
  subtitle: Grace Kent, już jako sześcioletnia dziewczynka, oglądała każdy film w kinie ojca. Od dzieciństwa marzyła o studiowaniu kostiumografii, a wróżka Ruby Moyle przepowiedziała jej błyskotliwą karierę.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wie verhext
    DE, 2021
    Reżyseria: Käthe Niemeyer
    Występują: Jördis Richter, Stefan König, Helmut Zierl, Marion Mitterhammer, Oliver Franck, Petra Berndt
    Grace Kent już jako sześcioletnia dziewczynka oglądała po kolei każdy film wyświetlany w kinie jej ojca. Nic więc dziwnego, że od dzieciństwa marzyła o tym, by w przyszłości studiować kostiumografię. Gdy wróżka Ruby Moyle przepowiada jej błyskotliwą karierę u boku przystojnego i majętnego Roberta Hayforda, Grace opuszcza rodzimą Kornwalię i wyjeżdża, by spełnić swoje marzenia.
  ageRating: 12
  genre:
  - '22'
- eventId:
  - 1518988
  - 650172
  start: 2026-10-12T19:50:00Z
  stop: 2026-10-12T21:35:00Z
  title: Rosamunde Pilcher - Niebo nad Kornwalią 1 (odc. 64)
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Der Himmel über Cornwall
    AT,DE, 2005
    Reżyseria: Michael Faust
    Występują: Anja Knauer, Florian David Fitz, Anja Kruse, Walter Kreye, Alexandra Schalaudek, Daniel Fünffrock
    Po ponad dwudziestu latach Charlotte Bold wraca do Kornwalii razem ze swoją 21-letnią córką Grace. To właśnie Grace nalega, aby poznać swojego ojca, którego nigdy wcześniej nie widziała. Jest nim Lord James Blixton, właściciel pięknej posiadłości Blixton Manor. James nie wiedział dotąd, że ma córkę. Przed laty Charlotte pracowała w jego domu jako ogrodniczka i połączył ich gorący romans. James ostatecznie jednak poślubił kobietę ze swojej sfery.
