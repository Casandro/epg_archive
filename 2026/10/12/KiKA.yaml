    Willkommen im Fitnessstudio! In dieser Folge von "Wissen macht Ah!" zeigen Clarissa und Tarkan, was sie körperlich so draufhaben, denn heute wird nicht nur Hirnmasse trainiert, sondern auch Muskelmasse. Es können nicht genug Gewichte auf die Stange gepackt werden! Während Clarissa und Tarkan über Muskeln, Proteine und die Bedeutung von Darwins Theorie vom "Survival oft the Fittest" fachsimpeln, finden sie außerdem Zeit, die fünf Fragen der Sendung zu beantworten.

    Warum fühlen sich 21 Grad im Sommer anders an als im Winter?

    Warum knistert und kracht holz?

