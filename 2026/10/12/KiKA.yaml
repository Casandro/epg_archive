  description: |-
    Hip-Hop im Museum

    Bei einem Klassenausflug in ein Museum erschrickt Lena, als sie plötzlich vor einem Porträt ihrer Familie aus dem Jahr 1905 steht. Auf dem Bild trägt ihre Mutter eine ihr unbekannte Kette.

    Lena entdeckt, dass auf dem Amulett an der Kette ähnliche Symbole eingraviert sind, wie auf dem Zeitmesser, den sie an die Zeitsammler verloren hat. Zum ersten Mal kommt Lena der Gedanke, dass ihre Mutter auch eine Zeitreisende sein könnte.

    Im Jahr 1905 wird Henri in eine Kutsche gezerrt und sieht sich der Mutter von Lena, Prinzessin Alexandra, gegenüber. Sie drängt ihn, ihr zu erzählen, wo sich Lena aufhält. Zögernd berichtet Henri von dem Portal, durch das Lena in das Jahr 2018 gereist ist. Lenas Mutter scheint nicht erstaunt zu sein über diese Schilderung. Sie zwingt Henri, sie zu seinem Vater Victor zu bringen. ...
