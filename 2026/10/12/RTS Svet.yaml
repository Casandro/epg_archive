  description: Prošlost ne ćuti, ona samo čeka da njene tragove pročitamo na pravi način. Redakcija naučnog programa Radio-televizije Srbije sa ponosom najavljuje premijeru novog serijala "ArheoForenzika", autorke Milice Popović. Serijal donosi potpuno nov i uzbudljiv pristup proučavanju naše kulturne i istorijske baštine ? kroz spoj vrhunske arheologije, savremenih naučnih metoda i forenzičke analize, otvara vrata davno zaboravljenih svetova i daje glas onima čije su sudbine vekovima bile obavijene velom tajne.
