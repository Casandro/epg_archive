  title: Fantastična planeta
  subtitle: Autor emisije Vladimir Banić vodiće nas kroz 18 novih epizoda - od Kostarike i Paname, preko Afrike i Azije, do Islanda i Irske.
  description: 'Autor emisije Vladimir Banić vodiće nas kroz 18 novih epizoda - od Kostarike i Paname, preko Afrike i Azije, do Islanda i Irske. Kuda idu veliki grbavi kitovi, a kuda ajkule i da li leopardi napadaju ljude saznaćemo u novim epizodama ovog putopisnog serijala. Vladimir Banić, čovek koji je do sada obišao većinu mesta na planeti, otkrio je da posle prve sezone nije bio siguran da će uspeti da nastavi istim tempom, jer cela ekipa godišnje provede oko 120 dana na snimanjima, uz dodatne dane putovanja, što ukupno može da dostigne oko 140 dana. "U novoj sezoni prešli smo gotovo 100.000 kilometara, koristeći gotovo sva moguća prevozna sredstva - od aviona i helikoptera do vozova i čamaca", rekao je Banić i dodao da je u prvoj i drugoj sezoni pokušao da izračuna koliko su kilometara prešli za potrebe snimanja, ali da je od toga "digao ruke". "Posle prve sezone sam rekao: "Ovo je samoubistvo, tempo je užasno jak." Međutim, kako je dobro prošlo posle emitovanja i kakve su reakcije bile kod...'
