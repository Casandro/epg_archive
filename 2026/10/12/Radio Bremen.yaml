  title: Elefant, Tiger & Co. (963)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "* Mäkelfritzen\nExotische Tiere müssen sich an unseren Speiseplan gewöhnen. Äpfel, Milchsuppe und Fisch, anstelle von Skorpionen, Termiten oder stacheligen Akazien. Das schmeckt nicht jedem Tier.\n* Kratzbürsten\nKaum haben Quesan und Tou-Feng, die Schuppentiere, sich mittags aus ihrer Schlafkuhle gerollt, in Erwartung einer leckeren Mahlzeit, werden sie von Dr. Andreas Bernhard überrascht. Statt dem erwarteten süßen Brei steht da heute der Zoo-Tierarzt. \n* Drückeberger\nNoch mehr Fußpflege, diesmal in der Erlebniswelt Afrika. Auch unter den Zebras sind die älteren Tiere nicht mehr so flink zu Fuß."
- eventId: 917924
  start: 2026-10-12T04:20:00Z
  stop: 2026-10-12T04:50:00Z
  title: Wie geht das? Die Welt der Äpfel
  subtitle: Die Welt der Äpfel
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: "Ein Apfel hat viele Vitamine, wenig Kalorien und besteht aus 85 Prozent Wasser. Und gerade das hat in diesem Jahr in den großen Anbaugebieten des Nordens gefehlt. Obstbauer Karl Walter Brüggenwirth aus dem Schaumburger Land musste täglich zusätzliches Wasser von den Stadtwerken kaufen, um seine Plantagen zu sprengen und die Ernte zu retten. Er baut seit über 30 Jahren Äpfel an. \n\nDiese Folge aus der Reihe \"Wie geht das?\" begleitet den Apfelbauern aus dem Schaumburger Land und zeigt, wie anspruchsvoll der Anbau der beliebten Obstsorte ist."
- eventId: 917925
