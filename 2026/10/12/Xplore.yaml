  description: Das TOURENFAHRER-Filmteam war wieder unterwegs. Diesmal führte die Reise vom Bodensee durch die Ostalpen bis ins nördliche Slowenien. Begeistern Sie sich mit unserem Filmteam an traumhaften Bildern von atemberaubenden Alpenkulissen, versteckt gelegenen, kleinen Bergstraen, wunderschönen Tälern, Seen und Wasserfällen. DE 2015
