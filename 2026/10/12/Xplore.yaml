  title: '377'
  subtitle: '377'
  description: '377 - A Race Across America History begleitet Christoph Strasser und sein Team von einem früheren Traum bis hin zu legendären Rekorden beim berühmten "Race Across America". Im Mittelpunkt stehen dabei nicht die Siege, sondern die unmittelbare Nähe zum Radsport. Detailliert, unverblümt und so authentisch wie möglich zeigt 377 den Athleten und Menschen Christoph Strasser auf seinem Weg, einen Lebenstraum zu verwirklichen - und verdeutlicht einmal mehr, dass neben jahrelangem Training und einem unbeugsamen Willen ein weiterer entscheidender Faktor zählt: das Team. Die Dokumentation ist stets nah am Geschehen, bietet nie zuvor gesehene, fast intime Einblicke und vereint die Höhen und Tiefen des härtesten und längsten Non-Stop-Radrennens der Welt in einem Kaleidoskop aus Rückschlägen, Euphorie und vor allem viel Durchhaltevermögen. Der Film erzählt die persönliche Geschichte des Team Strasser - vom ersten Start im Jahr 2009 bis hin zu den bahnbrechenden Rekorden ein Jahrzehnt später auf den 3.000 Meilen / 4.800 Kilometern des RAAM. Erleben Sie acht Rennen bis zum großen Finale: das Race Across America 2019. AT 2021'
