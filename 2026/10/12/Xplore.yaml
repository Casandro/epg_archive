  title: Rio de Janeiro hautnah - Das gute alte Rio
  subtitle: Rio de Janeiro hautnah - Das gute alte Rio
  description: Rio de Janeiro ist Brasiliens faszinierendste Stadt. Nicht nur, wenn zur Karnevalszeit im Februar die ganze Stadt im Sambarhythmus tanzt, ist die Lebensfreude am Zuckerhut grenzenlos. Gerade abseits der Touristenwege gibt es viel zu entdecken. Hylka Maria, in Rio geboren, nimmt die Zuschauer in diesem PLANET-Reisehighlight mit auf eine Entdeckungstour zu den versteckten Schätzen der Stadt. In jeder Episode begleitet sie einen anderen Touristen und zeigt ihm einen ganzen Tag die Plätze, die nur Einheimische kennen. Die Zuschauer erleben, wie die Carioca, so werden die Einwohner Rios genannt, leben und Spaß haben, ob im historischen Zentrum, in angesagten Szenevierteln oder den Favelas. BR 2015
