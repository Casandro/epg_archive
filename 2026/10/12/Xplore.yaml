- eventId: 1618008
  start: 2026-10-12T20:35:00Z
  stop: 2026-10-12T21:01:00Z
  title: Foodwise - Eating Global in Beijing
  subtitle: Foodwise - Eating Global in Beijing
  description: In dieser Folge begeben sich Tianran He und Eva May auf die Suche nach internationalen Küchen, die in Peking, der 3000 Jahre alten Hauptstadt Chinas, zu finden sind. Von ehrlichen Gerichten vom Bauernhof bis hin zu den kulinarischen Höhen der französischen Haute Cuisine und sogar einem Kochkurs. CN 2022
