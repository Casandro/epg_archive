  title: Schitour ins Ungewisse
  subtitle: Schitour ins Ungewisse
  description: Fünf Tage lang wollen Peter Stannecker, Stefan Rusch und Tom Dauer auf Schi die Allgäuer Alpen queren - ohne zu wissen, wo diese Traverse enden wird. Ihr Spiel hat nur eine Regel. Jeden Tag werden die Bergsteiger neu entscheiden, über welche Gipfel und durch welche Täler ihr Weg führen soll. Es ist eine neue Art des Tourengehens, ein Experiment, das Freiheit, Freundschaft und Achtsamkeit feiert. Peter Stannecker der Musiker, Stefan Rusch der Bergführer und Tom Dauer der Autor und Filmemacher sind jeden Tag von Sonnenaufgang bis zum Abend unterwegs, sie bringen ermüdende Tagesetappen hinter sich, klettern durch senkrechte Abbrüche und befahren traumhafte Schihänge. Die Kette ihrer Erlebnisse verdichtet sich zu einem alpinen Roadmovie, dessen große Bühne die Berge sind. Eine Landschaft von erhabener Schönheit, welche die Darsteller nicht nur einmal sprachlos macht. AT 2015
