  title: Bergwelten - Das Tote Gebirge - Abenteuer im Karst
  subtitle: Bergwelten - Das Tote Gebirge - Abenteuer im Karst
  description: 'Bergwelten: Das "Tote Gebirge" liegt in der nördlichen Steiermark und dem südlichen Oberösterreich und ist mit einer Fläche von über 1000 Quadratkilometern das größte Karstgebiet Europas. Es besticht durch seine Weitläufigkeit und Kargheit und durch die Abgeschiedenheit, die sich dort finden lässt. Aber "tot" ist es auf keinen Fall. Denn für Bergbegeisterte hat diese Landschaft eine Menge zu bieten. Das "Tote Gebirge" liegt in der nördlichen Steiermark und dem südlichen Oberösterreich und ist mit einer Fläche von über 1000 Quadratkilometern der größte Plateaustock der Alpen und das größte Karstgebiet Europas. Es besticht durch seine Weitläufigkeit, seine bizarre Mondlandschaft und durch die Einsamkeit und Stille, die sich dort finden lässt. Aber "tot" ist es auf keinen Fall. Denn für Bergbegeisterte hat diese Landschaft eine Menge zu bieten. Wir entdecken und erleben das Tote Gebirge bei der Besteigung seines höchsten Gipfels, des Großen Priel, bei spannenden Touren in die Karstlandschaft und in die geheimnisvolle Höhlenwelt, bei einer Ski-Durchquerung im Winter, mit den Augen eines Profi-Fotografen und bei der Begehung einer schweren Kletterroute an der Spitzmauer. Das Tote Gebirge wirklich zu verstehen, fordert lange Wege, genaues Hinschauen, sich einlassen - aber dann ist die Faszination für diese besondere Berglandschaft umso größer. AT 2021'
