  title: Stargate
  subtitle: Cassandra
  description: |-
    Auf einem bereits bekannten Planeten grassiert eine tödliche Krankheit. Die einheimische Bevölkerung sowie die vor Ort forschenden Kamerad:innen von SG-7 wurden komplett ausgelöscht! Nur ein kleines Mädchen namens Cassandra hat die Epidemie überlebt. Das SG-1-Team beschließt, das verwaiste Kind mit zur Stargate-Basis auf der Erde zu nehmen. Doch als die Militärs mehr über die Immunität des Mädchens herausfinden, kommt ein düsteres Geheimnis ans Licht: Cassandra wurde als Trojanisches Pferd missbraucht und trägt eine Bombe der Goa'uld in ihrem Körper...
