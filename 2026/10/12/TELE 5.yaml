  title: Stargate
  subtitle: Der Kuss der Göttin
  description: |-
    Es ist ein absoluter Sensationsfund: In einer Maya-Pyramide in Mexiko stoßen Forschende auf einen Sarkophag - reich verziert mit ägyptischen Hieroglyphen! Als das Relikt aus der Grabkammer zur Stargate-Basis in Colorado verfrachtet wird, taucht plötzlich eine mysteriöse Frau dort auf. Sie gibt an, die Fruchtbarkeitsgöttin Hathor zu sein, die Mutter aller Pharaonen. Allerdings verbirgt sich hinter dem hübschen Antlitz ein gefährlicher Goa'uld, der die Menschheit versklaven will. Da die Göttin Männern auf magische Weise den Kopf verdreht, liegt es nun an Captain Samantha Carter, den Bann zu brechen.
