  title: Torchwood
  subtitle: Die Sünden der Vergangenheit
  description: |-
    Bei einer Rückblende ins Jahr 1927 kommt Jacks Liebesdrama mit dem italienischen Einwanderer Angelo Colasanto (Daniele Favilli) ans Licht. Auch Details über den Mafiaboss Salvatore Maranzano (Cris D'Annunzio), einen außerirdischen Parasiten sowie eine gefährliche Nazi-Verschwörung werden enthüllt. Damals sollte Jack einen streng geheimen Auftrag erfüllen. Allerdings ist er in der Folterkammer eines kriminellen Fleischers gelandet! Zurück in der Gegenwart tritt ebenfalls eine obskure Gruppe in Erscheinung, die Gwens Familie in Wales bedroht. Durch transatlantische CIA-Kontakte wird die Geiselnahme beendet.
    GBR, USA, CAN 2011
