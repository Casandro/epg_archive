  title: Torchwood
  subtitle: Befreiungsaktion
  description: |-
    Im San Pedro-Camp spielen sich dramatische Szenen ab. Da Rex und Esther um jeden Preis das Tötungsvideo aus dem Vernichtungslager schmuggeln wollen, sind sie gezwungen, den Direktor der Einrichtung, Colin Maloney (Marc Vann), auszuschalten. Als sie das Beweismaterial öffentlich machen, geht ein Aufschrei durch die Gesellschaft. Aber die Regierung behält ihren Kurs bei. In Wales schafft es Gwen, ihren Vater zu befreien und die Verbrennungsanlage des Camps in die Luft zu jagen. Doch kaum ist sie zurück am Airport von L.A., wartet bereits die nächste Hiobsbotschaft.
    GBR, USA, CAN 2011
