  title: Bassangeln vom Belly
  subtitle: Bassangeln vom Belly
  description: |-
    Am Ende der USA Tour stand der Spaß im Vordergrund. Noch einmal mit dem Belly - Boat auf Schwarzbarsche. Dafür eignen sich besonders kleinere Gewässer oder Kanäle. Letztere gab es nahe der Cabin reichlich und so schnallten wir unsere Bellys auf ein Golfcar und machten uns auf den Weg zum Angeln.
    Gute Laune war vorprogrammiert und wir angelten völlig befreit. Anfängliche Schwierigkeiten waren beim ersten Biss wie weggeblasen. Was dann aber passierte konnte keiner von uns ahnen. Eine ganz besondere Freundschaft zwischen Mensch und Tier prägte diesen Nachmittag zunehmends. Unser ständiger Begleiter Boots, der Hund war auf einmal mittendrin statt nur dabei.Nachdem sich das Angeln im Kanal als eher mau herauskristallisiert hatte, wollten wir den Abend auf dem See ausklingen lassen. Nochmal alles auf eine Karte setzen und den ein oder anderen Topwater Blowup kassieren. Gesagt, getan ging es wieder raus auf den Cranberry Lake und wir konnten einen versöhnlichen Abschluss mit den diversen Fischarten wie Rockbass Crappi und Bass erleben. Die Beißphase zur Primetime war fantastisch und jeder von uns fing die Abschlussfische eines gigantischen Angelabenteuers in Michigan - USA. DE 2017
