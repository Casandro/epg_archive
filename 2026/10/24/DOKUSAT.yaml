  title: Tiere vor der Kamera - Die Schlucht der Felsenkänguruhs
  subtitle: Ernst Arendt und Hans Schweiger nehmen uns mit ins Outback Australiens. Tief eingeschnittene Schluchten in den MacDonnell Ranges in Zentralaustralien sind wie kleine Oasen. Zwischen den mal...
  description: 'Ernst Arendt und Hans Schweiger nehmen uns mit ins Outback Australiens. Tief eingeschnittene Schluchten in den MacDonnell Ranges in Zentralaustralien sind wie kleine Oasen. Zwischen den malerischen roten Felsen hält sich auch in trockenen Zeiten Wasser. Hier finden Arendt/Schweiger Felsenknguruhs, Spinifextauben, aber auch Vgel, die man in der Wste nicht vermutet: Zwergtaucher und Reiher.'
