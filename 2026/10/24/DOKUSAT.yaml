  title: Helden der Evolution - Kängurus
  subtitle: 'Australien ist die Heimat zahlreicher Spezies, die es nur hier gibt: zum Beispiel Koalas, Wombats oder Emus. Doch der Superstar unter den Symboltieren des Kontinents ist zweifellos das Känguru. „Just Animals“...'
  description: 'Australien ist die Heimat zahlreicher Spezies, die es nur hier gibt: zum Beispiel Koalas, Wombats oder Emus. Doch der Superstar unter den Symboltieren des Kontinents ist zweifellos das Känguru. „Just Animals“ widmet sich den verschiedenen Arten dieser faszinierenden Beuteltiere und stellt dabei deren oft verblffende Fhigkeiten heraus. Diese helfen ihnen dabei, in der gnadenlosen Wildnis des Outbacks zu berleben. Eines bleibt den Kngurus allerdings verwehrt: Sie knnen nicht rckwrts laufen.'
