  title: Helden der Evolution - Beuteltiere
  subtitle: 'Pelzig, niedlich und voller Überraschungen – so präsentieren sich die Beuteltiere. Neben den weltbekannten Kängurus geben sich auch ihre gleichermaßen faszinierenden Verwandten ein Stelldichein: Koalas, Wo...'
  description: 'Pelzig, niedlich und voller Überraschungen – so präsentieren sich die Beuteltiere. Neben den weltbekannten Kängurus geben sich auch ihre gleichermaßen faszinierenden Verwandten ein Stelldichein: Koalas, Wombats, Tasmanische Teufel, Opossums und Nasenbeutler. All diese hpfenden, kletternden und bisweilen gleitenden Geschpfe sind ausschlielich in Australasien und Amerika anzutreffen.'
