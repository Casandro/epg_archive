  title: WDR 3 Lesung
  subtitle: Eduard Mörike - Mozart auf der Reise nach Prag (2/2)
  description: |-
    <strong>Teil 2:</strong>
    In Mörikes Erzählung spaziert Mozart während einer Rast auf der Reise nach Prag durch einen Schlossgarten, pflückt gedankenverloren eine Pomeranze und wird dabei vom Gärtner ertappt. Das hat ungeahnte Folgen und führt schließlich dazu, dass die Mozarts zu einer Verlobungsfeier auf dem Schloss eingeladen werden.
    Von Eduard Mörike <br/>Mit: Gert Heidenreich <br/>BR <markup type="abbr" abbreviation="2015" correspondent="zweitausendfünfzehn">2015</markup> /WDR <markup type="abbr" abbreviation="2024" correspondent="zweitausendvierundzwanzig">2024</markup>
    Ab dem <markup type="abbr" abbreviation="9." correspondent="neunten">9.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> in ARD <markup type="language.en">Sounds</markup>.
