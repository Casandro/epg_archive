  stop: 2026-10-24T17:00:00Z
  title: WDR 3 Vesper II
  subtitle: Musikalische Monologe
  description: |-
    Musikalische Monologe sind quasi Mini-Opern, die sich auf einen entscheidenden dramatischen Moment fokussieren. Meistens geht es dabei um Frauenschicksale. Etwa in Haydns "Scena di Berenice", in der die Titelheldin aus Angst um ihren Geliebten dem Wahnsinn verfällt. Oder in Händels Lucrezia-Kantate, in der Lucrezia nach einer traumatischen Gewalterfahrung in den Freitod geht. Sowohl Haydn als auch Händel leuchten die hoch emotionalen Situationen der beiden Frauen bis ins kleinste Detail aus. Dabei spielen extreme musikalische Gegensätze eine große Rolle. Etwa abrupte Tempo- und Harmoniewechsel, die innere Zerrissenheit ausdrücken. Oder Spitzentöne und Koloraturen, die für Wut und Rache stehen.
    von Gela Birckenstaedt
    Die Musikstücke zur Sendung
