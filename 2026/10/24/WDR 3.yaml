- eventId: 1401933
  start: 2026-10-24T18:03:00Z
  stop: 2026-10-24T21:00:00Z
  title: ARD Oper
  subtitle: La grotta di Trofonio
  description: |-
    Der Besuch einer Höhle hat selten Nebenwirkungen - dieser hier schon. In Antonio Salieris La grotta di Trofonio geraten zwei Freunde in die Höhle des Philosophen und Zauberers Trofonio. Danach ist der belesene Artemidoro plötzlich ein Draufgänger, während sich der lebenslustige Plistene in Bücher vergräbt. Für ihre Verlobten ein Problem, denn gerade schienen zwei passende Paare gefunden. Als schließlich auch die beiden Frauen Trofonios Höhle betreten, ist endgültig unklar, wer noch zu wem passt.<br/><br/>Salieri macht aus dem Persönlichkeitstausch ein musikalisches Spiegelkabinett: mal fein gezeichnet mit ungewöhnlichen Bläserfarben, mal herrlich überdreht mit wilden Trillern und schaurig-komischem Geisterspuk. Zugleich nimmt die Oper eine Wiener Gesellschaft aufs Korn, die sich aufgeklärt gibt und doch auf Scharlatane und Übersinnliches hereinfällt. Rüdiger Lotter dirigiert die Hofkapelle München in der Aufzeichnung von den Tagen Alter Musik in Herne 2025. Wenige Wochen vor der Jubiläumsausgabe holt ARD Oper damit noch einmal einen vergnüglichen Fund aus dem Festivaljahr hervor und stimmt auf die 50. Tage Alter Musik in Herne ein.
    <strong>"La grotta di Trofonio"</strong><br/>Dramma giocoso in zwei Akten<br/>von <strong>Antonio Salieri</strong><br/>Libretto: <strong>Giovanni Battista Casti</strong>
    Aristone: <strong>Nikolay Borchev</strong> (Bariton)<br/>Trofonio: <strong>Jonas Müller</strong> (Bariton)<br/>Ofelia: <strong>Maria Hegele</strong> (Mezzosopran)<br/>Dori: <strong>Annija Adamsone</strong> (Sopran)<br/>Artemidoro: <strong>Jan Petryka</strong> (Tenor)<br/>Plistene: <strong>Jorge Navarro Colorado</strong> (Tenor)
    <strong>Hofkapelle München Chor und Orchester</strong><br/>Leitung: <strong>Rüdiger Lotter</strong>
    (Aufzeichnung vom 16. November 2025 aus dem Kulturzentrum Herne vom Festival Tage Alter Musik)
