  title: WDR 3 Vesper I
  subtitle: Musikalische Dialoge
  description: |-
    Dialoge sind die Keimzelle des Oratoriums. Purcells "In guilty night" erzählt von König Saul. Er befiehlt der Hexe von Endor, die Verstorbenen nach seiner Zukunft zu befragen. Da erscheint der Geist des Propheten Samuel und weissagt Saul seinen Untergang. Purcells Musik über diese alttestamentliche Szene jagt einem die sprichwörtlichen Schauer über den Rücken. Ähnlich spannend: Carissimis Dialog "Job". Darin sät der Teufel beim leidgeprüften Hiob Angst und Glaubenszweifel, indem er ihm eine Schreckensbotschaft nach der anderen überbringt. Doch Hiob erhält Unterstützung durch einen Engel, so dass der Fürst der Finsternis irgendwann das Weite sucht. Verglichen mit Carissimis und Purcells Dialogen ist Hammerschmidts Gespräch zwischen Gott und einer gläubigen Seele musikalische Idylle pur.
    Von Gela Birckenstaedt
