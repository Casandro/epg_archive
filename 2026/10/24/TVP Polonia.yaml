  title: Przygody psa Cywila - odc. 4/7 Pościg
  description: |-
    Tytuł oryginalny: Przygody psa Cywila
    PL, 1970
    Reżyseria: Krzysztof Szmagier
    Występują: Krzysztof Litwin, Wacław Kowalski, Włodzimierz Kmicik, Andrzej Krasicki, Jolanta Bohdal, Zdzisław Kielecki
    Ranny Cywil, który nie miał siły wyskoczyć z pociągu, dojeżdża aż w okolice granicy. Trafia w ręce przemytnika, który postanawia wykorzystać psa do pomocy w swoim procederze. Cywil świetnie się sprawuje w nowej roli, jednak kiedy spotka milicjantów, silniejsze okażą się stare przyzwyczajenia...
  genre:
