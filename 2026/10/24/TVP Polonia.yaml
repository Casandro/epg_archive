  title: Na sygnale - odc. 675 "Zwyklak"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Karol Kiewel
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Kolejnym pacjentem Britney oraz Alka jest mężczyzna, który ma nietypowy objaw - niebieską skórę - i o mało nie umiera przez leki na zwykłe przeziębienie. A gdy Klis ratuje mu życie, chory wyznaje chłopakowi, że jest współpracownikiem Bereniki i że modelka od początku "ukochanego" okłamuje. Tymczasem Benio zabiera Wandę na strzelnicę - na pełną emocji "randkę", podczas której oboje spotykają pułkownika Bielińskiego, a później dochodzi do niebezpiecznego wypadku.
  ageRating: 12
  genre:
  - '23'
  subtitle: Pacjentem Britney i Alka jest mężczyzna o niebieskiej skórze. Chory jest współpracownikiem Bereniki. Benio zabiera Wandę na strzelnicę. Spotykają tam pułkownika Bielińskiego.
- eventId: 854649
  start: 2026-10-24T03:05:00Z
  stop: 2026-10-24T03:35:00Z
  title: Na sygnale - odc. 676 "Mentalny kopniak"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Tomasz Szreniawa
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Kolejną pacjentką Lisickiego zostaje rowerzystka po wypadku - z urazem głowy i amnezją. Lekarz próbuje wykorzystać jej zdezorientowanie i postanawia wybrać się z chorą na urodzinowe przyjęcie swojego ojca - ku oburzeniu towarzyszącej mu na dyżurze Basi. Z kolei zespół doktora Góry pomaga kobiecie, która zasłabła przez niski poziom cukru. Artur znów spotyka się z Katią, cały czas w tajemnicy przed żoną. Kilka godzin później doktor Górska przyłapuje jednak ukochanego na kłamstwie.
  ageRating: 12
  genre:
  - '23'
  subtitle: Pacjentką Lisickiego zostaje rowerzystka po wypadku. Cierpi na amnezję Lekarz próbuje zabrać chorą na przyjęcie swojego ojca. Artur znów spotyka się z Katią. Górska przyłapuje go w końcu na kłamstwie.
- eventId: 854650
  start: 2026-10-24T03:35:00Z
