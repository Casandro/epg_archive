    Przed Cywilem pierwszy poważny sprawdzian umiejętności nabytych podczas miesięcy szkoleń. Pies dostaje zadanie odnalezienia Gosi i Jacka - dwójki dzieci zaginionych w Puszczy Białowieskiej. Choć las nie jest wdzięcznym terenem do poszukiwań i Cywil napotyka coraz nowe przeszkody, udaje mu się wreszcie odnaleźć zabłąkane dzieci.
