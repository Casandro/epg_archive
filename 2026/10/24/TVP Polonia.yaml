    Występują: Marek Kondrat, Maria Pakulnis, Paweł Wilczak, Witold Dębicki, Henryk Bista, Piotr Fronczewski
    Basia pomału dochodzi do zdrowia. W obawie o bezpieczeństwo córki Olgierd wysyła ją i Beatę do strzeżonego domu w górach. Sam ukrywa się w willi p. Henia, którego niegdyś wysłał za kratki. Między przestępcą a policjantem rodzi się przyjaźń.
  ageRating: 16
  genre:
  - '18'
  subtitle: Basia stopniowo wraca do zdrowia. Olgierd ukrywa się w willi Henia - włamywacza, którego niegdyś wysłał za kratki. Cysterna z heroiną rozpuszczoną w acetonie ma się niebawem pojawić na granicy.
- eventId: 854637
  start: 2026-10-24T02:40:00Z
