    "Europa da się lubić - Nowe pokolenie" to widowisko rozrywkowe o współczesnej Europie i jej mieszkańcach. Przygląda się Europie przez pryzmat ludzi, ich historii, doświadczeń i różnorodnych kultur, sprawdzając, co nas dzieli, a co łączy. W każdym odcinku sześcioro uczestników z różnych krajów, którzy związali swoje życie z Polską, rywalizuje w pełnych humoru i emocji konkurencjach sprawdzających ich wiedzę, błyskotliwość oraz refleks.
