  title: M jak miłość
  subtitle: Kinga wyznaje Piotrowi, że wyczuła guzek w piersi. Zduńscy od razu jadą do specjalisty na badania. Filarska trafia do szpitala wskutek upadku ze schodów. Bliźniaczki uciekają z zajęć na basenie.
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Michał Wnuk
    Występują: Teresa Lipowska, Krystian Wieczorek, Mikołaj Roznerski, Maurycy Popiel, Ilona Janyst, Adriana Kalska
    Kinga wyznaje Piotrowi, że wyczuła w piersi guzek i w efekcie Zduńscy jadą od razu do specjalisty na badania. Filarska trafia do szpitala wskutek upadku ze schodów. Bliźniaczki nagle uciekają z zajęć na basenie - przekonane, że babcia miała wypadek z ich winy. Bogna znów wybiera się do Warszawy i zapowiada Mateuszowi, że może zostać nawet na całą noc. W stolicy dziewczyna zmienia jednak zdanie, gdy widzi Mostowiaka z Majką. Jest przekonana, że jej wybranek tak naprawdę kocha inną.
  ageRating: 12
