  subtitle: Sondaż zamówiony u Witebskiego wykazuje, że szanse wójta na wygraną w kolejnych wyborach są minimalne. W Wilkowyjach zjawia się Czerepach i oferuje pomoc.
- eventId: 854635
  start: 2026-10-24T01:10:00Z
  stop: 2026-10-24T01:40:00Z
  title: Tańcząca ze światem - Tunezja - Sidi Bou Said
  description: |-
    Tytuł oryginalny: Tańcząca ze światem
    PL, 2023
    Reżyseria: Piotr Poraj-Poleski
    Program lifestylowo podróżniczy, w którym prowadząca Edyta Herbuś pokazuje widzom piękno odwiedzanych miejsc. Podziwia malownicze krajobrazy, charakterystyczne rzemiosło, rozmawia z ludźmi o lokalnych tradycjach i obrzędach. Kosztuje regionalnych potraw, zwiedza najważniejsze zabytki, uczestniczy w lokalnych aktywnościach. Rozmawia o życiu i postrzeganiu kobiety w danym regionie.
  ageRating: 12
  subtitle: Sidi Bou Said to miejsce lubiane przez artystów. Jest też idealne dla turystów; piękne położenie na urwistym klifie nad Morzem Śródziemnym zachwyca widokami, plażami i krętymi uliczkami.
  genre:
  - '35'
