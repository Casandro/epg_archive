  title: Ranczo s.IV - odc. 42 (seria IV, odc. 3) - Śluby i rozstania
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2009
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Grzegorz Wons, Artur Barciś, Marta Lipińska
    Sondaż zamówiony u Witebskiego wykazuje, że szanse wójta na wygraną w kolejnych wyborach są minimalne. Niespodziewanie w Wilkowyjach zjawia się Czerepach i oferuje swoją pomoc. Sam zresztą też pomocy wymaga, bo jego elastyczny stosunek do etyki i prawa wpędził go w kłopoty. W przeciwieństwie do Kusego Lucy nie chce się ograniczyć do opieki nad dzieckiem. Nakłania wójta, żeby wykorzystując unijną pomoc wprowadził Internet pod strzechy.
  ageRating: 12
  genre:
