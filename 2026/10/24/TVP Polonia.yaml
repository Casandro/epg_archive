  title: Podróże z historią s.III - Bursztynowym szlakiem
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    O istnieniu szlaku bursztynowego dowiaduje się każdy uczeń na lekcji historii, ale jak w praktyce wyglądało jego funkcjowanie? Po co kupcy przemierzali tysiące kilometrów, aby kupić nieco złota północy, jak tradycyjnie określano bursztyn? Jak radzili sobie z przechodzeniem przez rzeki? Aby to sprawdzić, Radek Kotarski jedzie do Gdańska, gdzie poszukuje bursztynu, bada jego zagadkowe powstawanie i próbuje poddać obróbce jubilerskiej. Jaki będzie efekt tych prac?
  genre:
  - '149'
  subtitle: Radosław Kotarski wybiera się do Gdańska, gdzie poszuka złota północy - bursztynu. Będzie badał jego zagadkowe powstawanie, a także spróbuje go poddać obróbce jubilerskiej.
