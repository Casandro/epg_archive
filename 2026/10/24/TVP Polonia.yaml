    Reżyseria: Tomasz Rostworowski
    Karol Okrasa ponownie zabierze widzów do Lusławic Krzysztofa Pendereckiego. Ale tym razem, po zwiedzeniu Europejskiego Centrum Muzyki, ostatniego wielkiego dzieła naszego Mistrza, wpadanie na pomysł, aby skonfrontować komponowanie muzyki z komponowaniem potraw. Choć na pierwszy rzut oka te dziedziny są zupełnie różne, to jednak cechuje je kilka podobieństw.
  subtitle: Karol Okrasa ponownie odwiedzi Lusławice, gdzie po wizycie w Europejskim Centrum Muzyki Krzysztofa Pendereckiego poszuka podobieństw między komponowaniem muzyki a tworzeniem potraw.
