  title: 43e Festival mondial du cirque de demain
  subtitle: 'Poésie, clownerie, acrobatie : la 43e édition du Festival mondial du cirque de demain ouvre une parenthèse enchantée en invitant au cirque Phénix les meilleurs espoirs circassiens.'
  description: 'Sous l''immense chapiteau du cirque Phénix à Paris, le Festival mondial du cirque de demain se fait, comme chaque année depuis sa fondation en 1977, la vitrine prestigieuse de nouveaux talents venus du monde entier. Tous âgés de moins de 25 ans, ces candidats ont la chance de briller devant un jury composé de professionnels et des ambassadeurs des plus prestigieux cirques du monde. Ce best of de la 43e édition offre, une fois de plus, une succession de moments athlétiques et poétiques, alliant l''humour aux émotions fortes. Avec, en vrac : le duo hongrois de la Pal''s compagnie à la planche coréenne ; l''acrobate tadjik Mukhamadi Sharifzoda ; les jongleurs ukrainiens Trio Inshi ; le diaboliste chinois Xiangiu Yan ou l''étonnant trio de trapézistes canadiennes Trickatrap, mariant la puissance à la grâce. Le tout présenté avec son panache habituel par l''inénarrable Calixte de Nigremont, monsieur Loyal attitré du Festival. Filmé en janvier 2024, au Cirque PHENIX, à Paris. Réalisateur: Guillaume Klein (2024)'
