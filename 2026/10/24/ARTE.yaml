  description: 'À Fès, Colette l''orientale\n\nRepliée dans ses remparts, Fès est une cité intérieure : voilée, pleine et inépuisable. L''écrivaine Colette dit ne faire que la "mordiller". En réalité, la gourmande Colette la croque à pleines dents. Et la ville agit sur elle comme un excitant. Entre 1926 et 1938, l''autrice à la réputation sulfureuse des Claudine et de Chéri effectue plusieurs séjours au Maroc. Elle a 53 ans quand elle découvre pour la première fois le pays alors sous protectorat français.\n\n\n\nLe Maroc fait son cirque\n\nSur les places des médinas, comme sur les plages du royaume, les troupes d''acrobates nomades portent haut les couleurs du Maroc. Intrépides, agiles et volontaires, ces athlètes témoignent d''une réussite, celle qui se forge à la force du poignet. Plus qu''un spectacle de rue, leurs acrobaties puisent autant dans les croyances religieuses que dans l''histoire du pays.\n\n\n\nAu Maroc, le tajine berbère d''Hamid\n\nÀ Bin El-Ouidane, Hamid cueille les légumes de son potager pour réaliser un tajine traditionnel. Tout est 100 % de saison : oignons, tomates, courgettes, aubergines. Hamid les accompagne de viande de chèvre, d''épices et les fait cuire lentement sur des braises.\n\n\n\nAu Maroc, le diable s''habille en rockeur\n\nCasablanca, ville au rythme effréné, est la capitale économique du Maroc. Cette métropole à l''architecture moderne cache la sombre histoire d''un procès qui, dans les années 2000, fit grand bruit : une chasse aux sorcières, ou plutôt aux jeunes rockeurs.". (2024)'
