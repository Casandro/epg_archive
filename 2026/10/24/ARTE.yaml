  title: Stardust, le mystère de l'étoile
  subtitle: Un jeune homme timide et maladroit prend fait et cause pour une femme, enjeu d'une terrible guerre de succession dans un royaume merveilleux.
  ageRating: 6
  genre:
  - '83'
  description: 'Angleterre, XIXe siècle. Niché au creux d''une vallée, le charmant village de Wall doit son nom au mur d''enceinte qui l''entoure et dissuade ses habitants de s''aventurer jusqu''au royaume voisin de Stormhold, peuplé de sorcières, de pirates et de lutins. Bravant l''interdit, le jeune Dunstan Thorn trompe un soir la vigilance du gardien et part y conter fleurette à la séduisante esclave d''une magicienne. Neuf mois plus tard, on lui apporte un bébé qu''il prénomme Tristan. Dix-huit années ont passé et Tristan, devenu un candide jeune homme, déclare sa flamme à Victoria, la plus jolie fille de Wall. Pour la convaincre de l''épouser, il lui promet d''aller chercher pour elle une étoile tombée du ciel. Au même moment, le roi de Stormhold s''apprête à rendre son dernier souffle. Ne sachant lequel de ses fils Primus ou Septimus lui succédera, il lance dans les airs son médaillon magique : celui des deux qui le retrouvera montera sur le trône. Après avoir été percutée par le bijou, une étoile s''écrase sur Terre... Mythes et légendes Adaptant librement pour le grand écran le roman de fantasy du Britannique Neil Gaiman, Matthew Vaughn ("X-Men : Le commencement", la saga des "Kingsman".) imagine un conte de fées pour adultes dans lequel cohabitent mythes et légendes, amour et violence, introspection et action, coeurs purs et êtres malfaisants. Bénéficiant d''un trio de seconds rôles de premier plan (Michelle Pfeiffer, Robert De Niro et Peter O''Toole), une aventure picaresque aux effets visuels enchanteurs et à l''imagination débridée. Réalisateur: Matthew Vaughn. Des acteurs: Claire Danes (Yvaine), Charlie Cox (Tristan Thorn), Michelle Pfeiffer (Lamia), Sienna Miller (Victoria), Jason Flemyng (Primus) (2007)'
- eventId: 652415
  start: 2026-10-24T11:31:45Z
  stop: 2026-10-24T13:30:00Z
  title: Stardust, le mystère de l'étoile (VM)
  description: |-
    Film de Matthew Vaughn (Royaume-Uni/États-Unis, 2007, 2h) Pour l'offrir à sa bien-aimée (Sienna Miller), un jeune candide (Charlie Cox) part à la recherche d'une étoile tombée du ciel dans un royaume surnaturel... Par Matthew Vaughn ("Kingsman"), un film de fantasy à l'imagination débridée, avec un trio de seconds rôles de premier plan : Michelle Pfeiffer, Robert De Niro et Peter O'Toole.

