  subtitle: Leinen los - junge Menschen mit Autismus
  genre:
  - '112'
  description: "Eine starke Böe fährt in die Segel, Wasser spritzt über das Deck, hoch am Wind schiebt das Schiff kräftig Lage. Sebastian hat das Steuer fest im Griff. Skipper Rollo gibt klare Anweisungen zur Wende. Charlotte holt das Vorsegel dicht. \nWenn sich die Ostsee von ihrer rauen Seite zeigt, müssen alle Kommandos sitzen. Zumal es keine gewöhnliche Mannschaft ist, auf die Skipper Rollo Beckmann sich verlassen muss: Alle Mitglieder seiner fünfköpfigen Crew sind junge Menschen mit Autismus.\nDer Film führt auf einfühlsame Weise in die Lebenswelt der Autistinnen und Autisten ein und ermöglicht, sie schließlich besser zu verstehen."
