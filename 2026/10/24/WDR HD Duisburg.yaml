  title: Ghosts - 2. Lästiger Spuk
  subtitle: Sechsteilige Serie, Deutschland 2025
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Emma und Felix geht allmählich das Geld aus, die Renovierungsarbeiten im Haus Donnerhall stocken. Felix packt tatkräftig mit an, doch Emma ist nach ihrem Unfall noch angeschlagen. Entsetzt erkennt sie, dass die Geister, die im ganzen Haus ihr Unwesen treiben, keine Einbildung sind. Am liebsten will sie auf der Stelle das Anwesen verlassen, aber einen Umzug kann sich das junge Paar nicht leisten. Die Situation scheint für alle ausweglos, doch dann macht Emma einen kühnen Vorschlag.
- eventId:
