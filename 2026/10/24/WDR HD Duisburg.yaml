  title: Ghosts - 1. Schweres Erbe
  subtitle: Sechsteilige Serie, Deutschland 2025
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Emma erbt unverhofft ein altes Herrenhaus und zieht mit Felix ein, ohne zu ahnen, dass es von Geistern bewohnt ist. Die beäugen das Paar neugierig - bis sie erfahren, dass aus ihrem Zuhause ein Hotel werden soll. Um das zu verhindern, wollen die Geister die neuen Besitzer durch Spuk vertreiben. Doch die beiden sind unbeeindruckt und beginnen mit der Renovierung. Dabei hat Emma einen schweren Unfall, der sie fast umbringt. Als sie aus dem Krankenhaus zurückkehrt, sieht sie auf einmal Gespenster!
- eventId:
