  start: 2026-10-24T23:45:00Z
  stop: 2026-10-25T00:10:00Z
  title: Ghosts - 4. Rätselhafter Fall
  subtitle: Sechsteilige Serie, Deutschland 2025
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Haus Donnerhall ist weiterhin eine Baustelle. Bei Felix und Emma laufen die Kosten für die Renovierung aus dem Ruder. Plötzlich steht auch noch die Polizei vor der Tür und ermittelt rund um einen der Bauarbeiter. Doch dieser scheint verschwunden. Wurde ihr Zuhause zum Ort eines Verbrechens? Dank Emmas Fähigkeit, Geister sehen zu können, weiß sie mehr als ihr lieb ist. Dabei muss sie aufpassen, sich nicht vor dem Kommissar zu verplappern.
