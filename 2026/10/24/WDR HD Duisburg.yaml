  stop: 2026-10-24T23:45:00Z
  title: Ghosts - 3. Verhängnisvolles Duell
  subtitle: Sechsteilige Serie, Deutschland 2025
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Bei den Arbeiten im Haus Donnerhall findet Felix zufällig eine antike Pistolenkugel, was Geist Friedrich in helle Aufregung versetzt. Darin erkennt er die Kugel, mit der er einst erschossen wurde. Er erzählt Emma seine Geschichte und nimmt sie mit auf eine Reise in die Vergangenheit. Doch Emma merkt schnell, dass seine Erinnerung und die Realität nicht immer zusammenpassen und dass Geister keine verlässlichen Zeit-Zeugen sind, sondern eigenwillige Versionen der Ereignisse zu erzählen haben.
- eventId:
  - 1313782
