  description: 'Heute ist Zora Klipp aus Hamburg zu Gast bei Björn Freitag und hat ein Rezept aus der Küche ihrer Großmutters im Gepäck: Königsberger Klopse - und dazu Rote Bete und Kartoffelpüree. Das sorgt für Freude bei Björn und für etwas Druck bei Zora: Es ist sein Lieblingsgericht! Auch Björn Freitag schwelgt gerne in Erinnerungen an Deutschlands Norden. Er bringt Seelachsburger "Bremer" mit frisch gebackenen Brioche-Buns und einem Artischockensalat auf den Tisch. Die beiden kennen sich gut und werfen sich die Zutaten und Pointen hin und her.'
