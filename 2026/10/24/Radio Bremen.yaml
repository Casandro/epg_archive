  description: 'Mauern einreißen, Wände verputzen, Leitungen ziehen. Carolin und Sebastian Paschen sind wichtige Handlanger für ihre Handwerker bei der Sanierung des Gutshauses Langwitz. Das Dach haben sie allein frei gelegt, damit Zimmermeister Fridolin Fischer die verrotteten Balken erneuern kann. Der Experte für historische Gutshäuser ist begeistert von den Bauherren. Ihr nächstes Projekt: Schalung fürs Fachwerk mit einem Hanf-Kalk-Gemisch. Nicht selten steht das Künstlerpaar bis weit nach Mitternacht auf der Leiter. Und auch ein schwerer Wassereinbruch kurz vor einem Konzert bringt sie nicht aus der Ruhe.'
