  description: Etwa 17 Millionen Reisende nutzen Hamburgs Flughafen jedes Jahr. Die rund 160 Zöllnerinnen und Zöllner sorgen dafür, dass nichts eingeschmuggelt wird. Dabei kommen Zollhunde und hochmoderne Technik zum Einsatz, mit deren Hilfe die Beamten zum Beispiel tierische Produkte oder Sprengstoff aufspüren können. Die Zöllner am sogenannten Grünen Kanal haben weder ein echtes noch ein elektronisches "Näschen" für nicht angemeldete Waren. Sie müssen sich auf ihre Erfahrung verlassen, wenn sie Reisende bitten, ihr Gepäck zu öffnen.
