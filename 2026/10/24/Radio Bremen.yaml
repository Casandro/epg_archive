  audiodesc: true
  description: 'Malta: Europas trockenste Insel und zugleich trockenstes Land. Der Inselstaat kämpft ums Überleben. Forscher, Bauern und Umweltaktivisten kämpfen gegen die Dürre und gegen die eigene Regierung, die weiter auf Wachstum setzt. Während jedes Jahr Millionen Urlauber auf die Insel drängen, bleibt für die Landwirtschaft kaum ein Tropfen Wasser. Die Reportage zeigt jene Menschen, die trotz widrigster Bedingungen nicht aufgeben und Malta zu einem Labor der Zukunft machen. Eine eindringliche Warnung. Aber auch ein Hoffnungsschimmer.'
