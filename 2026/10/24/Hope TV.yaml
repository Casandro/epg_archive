  title: Hope Gottesdienst
  subtitle: Wir werden staunen - Matthias Müller
  description: |-
    In der Predigt "Wir werden staunen" geht es um die uralte Frage, warum Menschen überall auf der Welt nach Spiritualität suchen. Vom Staunen über Schöpfung, Bewusstsein und Ordnung in der Natur führt die Predigt zu den offenen Fragen nach Leid, Ungerechtigkeit und Hoffnung. Sie zeigt: Die Welt ist nicht so, wie sie ursprünglich gedacht war, aber sie wird auch nicht so bleiben. Gottes Ziel ist Erneuerung, Gerechtigkeit und eine Zukunft, die alles heutige Vorstellungsvermögen übertrifft.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
