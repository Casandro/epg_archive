  title: Open Doors - Geschichten von Gottes Wirken
  subtitle: Wenn Jesus Leben verändert
  description: |-
    Jesus Christus verändert Leben - und manchmal wird daraus eine Bewegung, die niemand mehr stoppen kann! Was geschah in einer kleinen Stadt in Kuba, als Menschen Jesus begegneten? Wie entstand daraus eine landesweite Erweckung, die selbst die Regierung nicht aufhalten konnte? Erleben Sie in "Geschichten von Gottes Wirken" eine bewegende Geschichte über Glaube, Veränderung und Gottes Wirken. Lassen Sie sich inspirieren - und entdecken Sie, was möglich wird, wenn Menschen Jesus vertrauen!

