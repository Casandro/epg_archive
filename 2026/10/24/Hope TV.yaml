  title: Bibelkompass
  subtitle: Gottes Gnade ist immer größer
  description: |-
    Gottes Gnade ist größer als jede Schuld. Das zeigt die Geschichte von Saulus, der Christen verfolgte und durch Jesus Vergebung, Berufung und ein neues Leben fand. Doch Gnade ist mehr als Schuldenerlass. Sie rechtfertigt, richtet auf und verändert durch den Heiligen Geist. Die Bibel beschreibt, wie aus Vergebung ein neues Leben wächst: nicht durch eigene Leistung, sondern durch die Verbindung mit Jesus. Wer in seiner Gnade bleibt, erlebt, dass Gott nicht nur vergibt, sondern Schritt für Schritt erneuert. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

