  title: Tierisch München - Die missverstandene Krähe (Wh.)
  subtitle: |-
    - Warum wirken Krähen so unheimlich?
    - Wie schlau sind diese Vögel wirklich?
    - Was haben Vögel mit Krokodilen zu tun?
  description: 'Wenn Caroline du Fresne mit ihrem Hund Gassi geht, wird sie häufig von Krähen begleitet. Sie hat erst sich und dann den Wildtierexperten Jacek Koppe gefragt, warum das so ist - und hat erstaunliche Antworten bekommen: Einerseits sind Krähen (wie alle Vögel) quasi echte lebende Dinosaurier, andererseits kommunizieren sie miteinander, benutzen Werkzeuge und gelten als intelligenter als Hunde. Außerdem verrichten sie als Gesundheitspolizei einen äußerst wichtigen Dienst.'
