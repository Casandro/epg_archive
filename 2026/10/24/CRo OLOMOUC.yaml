  title: Mezi nebem a zemí
  description: Duhový Kristus od architekta Davida Vávry nově zdobí kostel ve Všekarech. Podíváme se tam. Kostel Nejsvětější Trojice v Rychnově nad Kněžnou bude zářit světly. Poslední říjnovou sobotu se tam bude konat světelný festival Maják. Úlomek kosti kněze Václava Drboly a část kněžského oděvu Jana Buly. To jsou církví uznané relikvie prvních českých mučedníků z dob komunismu. Ostatky nově blahoslavených kněží teď faráři umisťují do kostelů. A pravidelné zamyšlení bude tentokrát od římskokatolického kněze Jana Hanáka.
