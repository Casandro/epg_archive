    Fos wächst in Somalia mit weiblicher Genitalverstümmelung auf - für sie ist das Normalität. Sie entkommt diesem Schicksal und findet in Belgien einen Weg zurück zu ihrem Körper und zu ihrer ?Perle?, der Klitoris.
