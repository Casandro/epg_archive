  title: Die besondere Aufnahme
  description: |-
    Ludwig van Beethoven
    Konzert für Violine und Orchester D-Dur op. 61 (Bearbeitung für Akkordeon und Orchester)

    Bagatelle a-Moll WoO 59 "Für Elise"

    Menuett Es-Dur WoO 82

    Viviane Chassot, Akkordeon
    Collegium Musicum Basel
    Leitung: Jan Schultsz

    Deutschlandfunk / Prospero 2026

    Die Schweizer Akkordeonistin Viviane Chassot wagt sich an ein Heiligtum und arrangiert es für ihr Instrument: Beethovens Violinkonzert. Dabei stützt sie sich auf Beethovens Klavierfassung und orientiert sich an der Interpretation des Geigers Franz Clement, für den Beethoven das Werk schrieb und dessen Spiel für seine ?äußerst liebliche Zartheit? bekannt war.
