  title: Aus den Archiven
  description: |-
    Luise Rinser
    Literatin und Nazi-Verstrickte
    Von Dagmar Ploetz und Heike Schneider
    Deutschlandfunk 1981 / Deutschlandradio 1996
    Vorgestellt von Isabella Kolar

    Luise Rinser, 1911 in Pitzling in Oberbayern geboren, war eine der meistgelesenen und bedeutendsten deutschen Autorinnen, nicht nur der Nachkriegszeit, und eine moralische Instanz. Da aber das Bild, das sie selbst durch ihre Autobiografie von sich kreiert hatte, nicht mit der Wirklichkeit ihres Lebens unter der Herrschaft der Nationalsozialisten übereinstimmte, wurde sie gleichzeitig zu einer umstrittenen Persönlichkeit.
