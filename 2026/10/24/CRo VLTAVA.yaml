  title: Poutník v krajině snů a vzpomínek
  description: Gérard de Nerval v novém překladu. Čtyřsvazkový projekt začalo vydávat nakladatelství Malvern roku 2023. Kromě romanisty Jiřího Pelána se Nervalových textů ujali také Václav Jamek a Eva Blinková Pelánová. Proč byl francouzský spisovatel tolik fascinován německou mytologií? V čem spočívá originalita jeho psaní, kterou později obdivovali surrealisté? Jak důležitá byla pro jeho pozdější vývoj práce na překladu Goethova Fausta? Nejen na tyto otázky hledá Petr Šmíd odpovědi s romanistou a překladatelem Jiřím Pelánem. (45 min).
