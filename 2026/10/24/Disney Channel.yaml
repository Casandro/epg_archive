  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Ängste Animationsserie, F/COR/J/USA 2025
  description: 'Folge 143, Marinette und Adrien sind zwei Schüler - fast - wie andere auch. Bei der kleinsten Bedrohung von Paris werden sie zu Ladybug und Cat Noir. Ihre Mission: Die Akumas des mysteriösen Hawk Moth fangen, der die Pariser in Super-Bösewichte verwandelt. Obwohl die beiden Helden ein Team bilden, wissen sie wenig voneinander: Marinette weiß nicht, dass sich hinter Cat Noir Adrien verbirgt, der Junge, in den sie heimlich verliebt ist; und Adrien, dessen Herzen für Ladybug schlägt, ignoriert, dass sich hinter dem Kostüm der Superheldin das nette und zerstreute Mädchen aus seiner Klasse verbirgt...'
  widescreen: true
- eventId: 972106
  start: 2026-10-24T16:30:00Z
