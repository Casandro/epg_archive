  title: Merida - Legende der Highlands
  subtitle: Animationsfilm, USA 2012
  description: 'Regie: Mark Andrews, Brenda Chapman, Steve Purcell. Darsteller: Kelly MacDonald, Billy Connolly, Emma Thompson. Inmitten der rauen und geheimnisvollen Wildnis der schottischen Highlands soll Merida eigentlich ihrer Rolle als elegante junge Königstochter gerecht werden. Doch ebenso wie ihre übermütigen kleinen Drillingsbrüder hat auch der rebellische Rotschopf nichts als Flausen im Kopf.Entgegen den Anweisungen ihrer Mutter, Königin Elinor, zieht es Merida vor, ihre eigenen Wege zu gehen, sich im Bogenschießen zu üben und in der freien Natur mit ihrem Pferd Angus mutig in immer neue Abenteuer zu stürzen.'
  widescreen: true
- eventId: 972117
  start: 2026-10-24T18:15:00Z
  stop: 2026-10-24T20:20:00Z
  title: 'Onward: Keine halben Sachen'
  subtitle: Animationsfilm, USA 2020
  description: 'Regie: Dan Scanlon. Darsteller: Tom Holland, Chris Pratt, Julia Louis-Dreyfus. Die Elfenbrüder Ian und Barley erhalten die unerwartete Chance, einen Tag mit ihrem verstorbenen Vater zu verbringen und begeben sich in Barleys Wagen Krimhild auf eine abenteuerliche Reise. Wie jedes gute Abenteuer ist auch ihres voller Zaubersprüche, geheimnisvoller Karten, unmöglicher Hindernisse und unvorstellbarer Entdeckungen. Als ihre Mutter Laurel erkennt, dass Ian und Barley weg sind, tut sie sich mit dem Mantikor zusammen, um sie zu finden. Von gefährlichen Flüchen mal abgesehen, könnte dieser eine magische Tag mehr für sie bereithalten, als sich jeder von ihnen erträumt hätte.'
  widescreen: true
- eventId: 972118
  start: 2026-10-24T20:20:00Z
  stop: 2026-10-24T22:25:00Z
  title: Hocus Pocus
  subtitle: Gruselkomödie, USA 1993
  description: 'Regie: Kenny Ortega. Darsteller: Bette Midler, Sarah Jessica Parker, Kathy Najimy. Geister? Alles Unfug! Hexen? Gibt es nicht! Da ist sich Max Dennison ganz sicher. Als seine Eltern ausgerechnet nach Salem ziehen, bleibt Max ganz cool. Die sagenumwobene Geisterstadt kann ihm keine Angst einjagen. Als seine neuen Schulkameraden von einem alten Haus berichten, in dem es spukt, kann der Junge nur müde lächeln. Max beschließt den Beweis anzutreten, dass es weder Geister, Hexen noch Gespenster gibt. Er lädt die umschwärmte Allison zu einem Ausflug in das gefürchtete Spukhaus, in dem einst die drei Sanderson-Schwestern gelebt und gezaubert haben sollen, ein. Ausgerechnet an Halloween! Doch das stört Max wenig. Im Schlepptau hat das Pärchen Max'' kleine Schwester Dani, neugierig und mächtig vorlaut. Kaum ist das Trio im Sanderson-Haus angelangt, geschieht sogleich schier Unglaubliches: Max öffnet ein angestaubtes altes Zauberbuch - und erweckt dadurch nichtsahnend die drei Hexen wieder zum Leben. Jetzt scheint alles aus zu sein! Die Sanderson-Schwestern, die im Jahre 1693 hingerichtet wurden, sinnen auf Rache. Vor allem aber haben sie mächtig Hunger - und zwar auf Menschenfleisch, insbesondere auf Kinder. Max und die Mädchen müssen sich mächtig ins Zeug legen, um den Hexen zu entkommen und die Stadt vor ihrem bösen Spuk zu bewahren ...'
  widescreen: true
- eventId: 972131
