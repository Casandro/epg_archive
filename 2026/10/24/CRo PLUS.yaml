  description: Trump mění kurz. Blíží se konec války? Americký prezident Donald Trump zásadně mění přístup k Rusku - i přes sankce uzavřel s Kremlem naftovou dohodu. Zatímco vůči Ukrajině jeho rétorika citelně přitvrzuje. Je konec konfliktu skutečně nebývale blízko, jak Trump prohlásil? Nebo jeho kroky naopak cestu k příměří ztížily, jak se domnívá český prezident Petr Pavel? A jaká by měla být reakce Evropy na změnu amerického přístupu? Otázky pro europoslance hnutí ANO Tomáše Kubína z frakce Patrioti pro Evropu a europoslance TOP 09 z klubu Evropské lidové strany Ondřeje Koláře. Moderuje Lukáš Matoška.
