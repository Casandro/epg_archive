  subtitle: Magazín o národnostních menšinách v Česku
  description: 'Magazín o národnostních menšinách v Česku. Někdejší ředitel běloruské redakce Rádia Svobodná Evropa, Aliaksandr Lukašuk, mluvil s redaktorkou Alenou Kovářovou o vztahu Václava Havla k Bělorusku. Jana Šustová zavítala do Goethe-Institutu na výstavu Nevyřčená jména, která se věnuje historickým kořenům vietnamské komunity v Německu, Česku a na Slovensku.Tomáš Pilát oslovil Jakuba Štědroně, ředitele Domu národnostních menšin v Praze, který brzy bude oslavovat své 20. výročí. Moderuje: Tomáš Pilát. Připravila: Tajana Mančalová.'
