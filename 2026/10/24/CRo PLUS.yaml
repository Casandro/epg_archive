  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (5/15) Část pátá: Předehra. červenec 1953 - leden 1955 v Budapešti a Moskvě. Destalinizace, kterou ohlásil nový ministerský předseda Imre Nagy, vzbudila velké naděje. Internační tábory budou uzavřeny, skončí diskriminace kulaků, rolníci se nemusejí zapojovat do družstev, zase budou moct vznikat malé soukromé firmy. "Červnová cesta", jak to Nagy nazval, trpěla ale intrikami starého vládce Rákosiho. V lednu si maďarské sluhy opět pozvali do Moskvy. Nagye sice nesesadili, on sám ale utrpěl srdeční záchvat. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
