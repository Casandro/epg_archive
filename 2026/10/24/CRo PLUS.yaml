  title: Speciál
  description: 'Maďarsko, revoluční rok 1956. Sovětské vojsko brutálně potlačilo bleskovým úderem během několika dnů vzdor široké maďarské veřejnosti. Maďarsko-britský novinář Victor Sebestyen v knize Dvanáct dnů: Příběh maďarského povstání 1956, kterou právě v těchto dnech Český rozhlas Plus vysílá jako Radioknihu, líčí dramatické události den po dni v rozmanitých perspektivách. Co ukázalo toto povstání o vztahu Západu k zemím za železnou oponou? Jaké paralely můžeme vidět se sovětskou invazí do Československa v roce 1968? A jak rezonuje tragický rok 1956 v Maďarsku dnes? Hlavním hostem diskuse k 70. výročí tragických událostí v Maďarsku na Podzimním knižním veletrhu v Havlíčkově Brodě byl hungarista Jan Blažek, moderuje Karolína Koubová.'
