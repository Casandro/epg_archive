  subtitle: Chartstürmer mit 16 Jahren - Justus Eichhorn am Klavier
  description: |-
    Der Club zum Mitmachen

    Chartstürmer mit 16 Jahren - Justus Eichhorn am Klavier

    Musikalische Spitzenklasse im Tigerenten Club: Der 16-jährige Justus Eichhorn ist eines der vielversprechendsten Nachwuchstalente der klassischen Musikszene. Der preisgekrönte Pianist, der bereits auf internationalen Bühnen glänzte, zeigt, dass klassische Musik alles andere als langweilig ist. Mit seiner Begeisterung und beeindruckender Fingerfertigkeit beweist er, wie modern, mitreißend und cool Klassik sein kann. Neben einer Live-Performance am Klavier gibt Justus spannende Einblicke in seinen Alltag zwischen Schule und Konzertflügel. Die Teams der Frösche und der Tigerenten von der Georg-Christoph-Lichtenberg-Schule in Ober-Ramstadt und des Ganztagsgymnasium Theresianum in Mainz kämpfen in der Spielearena in spannenden und kniffligen Challenges um Notbremsen für das große Finale. Für die Frösche treten Lean, Marlena und Niklas gegen Abram, Elisa und Theo vom Team der Tigerenten an. Wer holt sich den goldenen Siegerpokal? Die Teams spielen aber nicht nur um den begehrten goldenen Tigerenten-Pokal, sondern auch darum, die Kinderhilfsaktion "Herzenssache" des SWR und SR mit Spendengeldern zu unterstützen. Zuschauer können live mit der KiKA-Quiz App mitspielen und eine kleine Glückstigerente für zuhause gewinnen.

    Der Tigerenten Club ist eine Produktion des Südwestrundfunks für KiKA und Das Erste. Seit 30 Jahren steht die Sendung für Action, Spaß und kunterbunte Themen.
    Moderation: Laura Knöll, Joyce Stiernon, Johannes Zenglein

