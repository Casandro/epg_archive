    3D-Animationsserie, Frankreich / Australien / Deutschland 2013
    Thors Hammer

    Offenbar hat Gott Thor einen Hammer in einem Fels versenkt. Beim Versuch, ihn he-rauszuziehen, geraten Halvar und Baltak aneinander und liefern sich einen Zweikampf, den letztlich Wickie entscheiden muss.

    Eigentlich ist gar nichts Besonderes passiert: Tjure hat seinen Hammer auf einem Felsen vergessen, ein Blitz ist eingeschlagen und hat das Werkzeug tief ins Gestein eingebrannt. Leider glauben nun alle, nichts Geringeres als der Hammer von Gott Thor sei da im Gestein versenkt, und wer ihn besitzt, der sei sein Leben lang unbesiegbar. Insbesondere Halvar, der Herr von Flake, und Baltak, oberster Vertreter des Nachbarorts, streiten sich um die Kostbar-keit. Allerdings ist nicht herauszufinden, ob das Objekt der Begehrlichkeit nun rechtmäßig dem Herrschaftsbereich des einen oder des anderen Häuptlings zukommt. Und so einigt man sich auf ein simples Verfahren: wer es schafft, den Hammer aus dem Fels zu ziehen, der soll Besitzer von Thors Werkzeug und deshalb auch für alle Zeit unbesiegbar sein. Halvar und Baltak machen sich daran, ihre Kräfte zu sammeln, ein paar Übungseinheiten einzulegen und dann mit aller Macht zu versuchen, den eisernen Klotz aus dem steinharten Felsen zu ziehen. Doch keiner von beiden bewegt den Hammer auch nur um einen Millimeter. Es wird also mal wieder Zeit für Wickie, mit einer Lösung des Problems aufzuwarten.
