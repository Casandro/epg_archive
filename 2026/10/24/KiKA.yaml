  description: "Gleiches Geld für alle!\n\nGina stellt fest, dass sie viel weniger verdient als der Doktor. Sie glaubt zunächst, es sei ein Fehler. Doch sie entdeckt, dass es sich in Wirklichkeit um eine Entscheidung des Bürgermeisters Magnus handelt. Seit er den Schnurrbart der Macht geerbt hat, wurde ihm immer gesagt, er solle Frauen weniger bezahlen. So sei es schon immer gewesen... . Aber es ist wirklich zu unfair! Edgar und seine Freunde beschließen, dieser unfairen Behandlung ein Ende zu setzen.\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
