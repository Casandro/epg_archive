  description: "Das Plastikmüll-Problem\n\nRudi fällt in den Teich und entdeckt, dass er stehen kann. Der Teich ist voller Plastikmüll! Seit Jahren fordert Bürgermeister Magnus alle auf, Plastikflaschen und allen anderen Müll dort hineinzuwerfen... Wütend beschließt das Superkaribu Edgar, den Teich zu reinigen. Doch schon bald steht er vor einem Berg aus Plastik, mit dem er nichts anzufangen weiß...\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
