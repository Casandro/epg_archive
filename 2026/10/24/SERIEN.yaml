  description: Graces Hochzeit steht bevor. Olivia und Maryellen planen eine Brautparty. Doch Grace macht es ihnen nicht leicht, sie zu überraschen. Sie kann einfach ihren Zwang, alles unter Kontrolle zu haben, nicht ablegen. Die beiden wissen sich zu helfen und planen um. Jack will es sich auch als Chefredakteur nicht nehmen lassen, weiter zu schreiben. Er versucht jetzt, alles unter einen Hut zu bekommen.  US 2014
