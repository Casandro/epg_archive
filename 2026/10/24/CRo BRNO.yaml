  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese fejeton Jana Krejčího Jedno malé putování po řece, zázraku přírody. Zazní rozhovor s malířem a básníkem Petrem Veselým. Ten pod názvem Jitroceli, jitroceli... vystavuje v Knihovně Jiřího Mahena v Brně své textové kresby. Jedenáctou částí pokračuje četba z knihy Jany Soukupové Brněnské mordy. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Připomeneme si 50. výročí úmrtí spisovatele Františka Křeliny.
