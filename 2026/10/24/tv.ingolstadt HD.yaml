  title: Bayrische Landfrauen kochen auf... (Wh.)
  subtitle: 'Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipp..'
  description: |-
    Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps und Rezepte rund ums bayerische Essen. Diese Landfrauen kommen aus unterschiedlichen landwirtschaftlichen Betrieben in ganz Bayern und lieben die Landwirtschaft und lieben Bayern! Hier erfahren Sie viel über die Vielfalt und Qualität der heimischen Erzeugnisse, aber auch die Arbeit und das Engagement der Landwirte.

    Moderatorin Johanna Nagel führt uns in die kulinarische Welt der bayerischen Landfrauen und trifft auf Landfrau Evi Rieger und Experte Leonhard Neuner. Gekocht wird Käsesuppe und ein geschmolzenes Käsebrot.
- eventId: 693644
  start: 2026-10-24T12:00:00Z
  stop: 2026-10-24T12:45:00Z
  title: Bayern Agenda vom 21.10.2026 (Wh.)
  subtitle: Das Politmagazin für ganz Bayern.
  description: Was planen die Ministerien für uns? Wie steht es um unser Oberbayern? Wir laden die Kabinettsmitglieder ein, um Rede und Antwort zu stehen - auch Social-Media-Zuschauerfagen werden beantwortet.
- eventId: 693645
  start: 2026-10-24T12:45:00Z
  stop: 2026-10-24T13:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 693646
  start: 2026-10-24T13:00:00Z
  stop: 2026-10-24T13:45:00Z
  title: MITTENDRIN mit Corinna Binzer (Wh.)
  subtitle: Menschen - Miteinander - Meinungen
  description: Corinna Binzer - ganz nah dran an den bewegenden Geschichten von Menschen, die im Verborgenen ihrer Heimatstadt leben. Geschichten, die berühren, inspirieren und viel zu wertvoll sind, um unentdeckt zu bleiben. Sie gehören vor die Kamera - und erzählt.
