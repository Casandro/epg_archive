- eventId: 1012765
  start: 2026-10-24T21:27:10Z
  stop: 2026-10-24T22:21:17Z
  title: Gordon Ramsay - Kulinarische Abenteuer
  subtitle: |-
    Perus heiliges Tal
    Koch-Reality, USA 2019
    Altersfreigabe: ab 12
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsays kulinarische Abenteuerreise verschlägt ihn nach Peru, wo er die lokalen Köstlichkeiten des Anden-Staates näher kennenlernt. Von seltenen bunten Kartoffeln, bis hin zu Meerschweinchen und frittierten Würmern ist hier alles dabei. Zusammen mit Virgilio Martínez bereitet der Starkoch schließlich ein exotisches Festmahl zu.
  widescreen: true
