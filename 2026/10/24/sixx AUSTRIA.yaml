  title: The Taste
  subtitle: |-
    The Taste
    Kochshow, D 2026
    Altersfreigabe: ab 6
    (WH vom Mittwoch, 21.10.2026, 20:15 Uhr)
  description: |-
    Moderation: Angelina Kirsch

    Kann Sternekoch Tim Raue auch Backfisch? Wie schlägt sich Elif Oskan an der Currywurst? Gelingt Alexander Herrmann der perfekte Imbiss-Burger? Und wie bringt Steffen Henssler einen ganzen Döner auf den Löffel? Zum Jubiläum von "The Taste" müssen die vier Coaches gleich selbst ran: Im großen Coachbattle bringen sie Streetfood auf den Löffel.

    Jury: Steffen Henssler, Elif Oskan, Tim Raue, Alexander Herrmann
