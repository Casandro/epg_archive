    Neuseelands rauer Süden
    Koch-Reality, USA 2019
    Altersfreigabe: ab 12
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay macht sich auf den Weg nach Neuseeland, um im rauen Süden des Landes die Maori-Küche zu erkunden. Von den Einheimischen lernt er, Aale mit den Händen zu fangen und nach wertvollen Meeresschnecken zu tauchen. Mit den gefundenen Zutaten bereitet er zusammen mit Monique Fiso ein Festmahl zu.
