  title: 'Naši ljudi, njihova mjesta: La Plata'
  subtitle: ' '
  description: La Plata, glavni grad Provincije Buenos Aires, nastala je krajem 19. stoljeća kao planski grad i simbol napretka tadašnje Argentine. Upravo je u tom novom gradu svoj dom pronašao mladi Hvaranin Ivan Vučetić. U argentinskoj policiji Vučetić je razvio sustav identifikacije pomoću otisaka prstiju, koji će ga proslaviti diljem svijeta. Njegov uspon pratio je optimizam zemlje koja je privlačila milijune doseljenika, no njegov život donio je i razočaranja, sukobe i gotovo zaborav. Tragovima Ivana Vučetića prolazimo kroz La Platu i s Juanom Pablom Caparrom otkrivamo manje poznate strane njegova života. S Horacijem Riggijem, urednikom gospodarske redakcije lista Clarín, razgovaramo o tome kako je uspio obnoviti kontakt s obitelji Josipović u Hrvatskoj te o Argentini u koju je Vučetić stigao, njezinim velikim očekivanjima, ali i gospodarskim krizama.
