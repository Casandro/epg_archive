  description: 'Eva je zatečena pred Stelom zbog don Antinog izravnog upita o njoj kao izvoru problema u Jablanovu. Karlo je u škripcu jer ga Augustina pritišće da optutuju negdje za vikend, a on nema novca, pa odluči posuditi nešto od Lovre. Eva govori Steli kako joj nije ni na kraj pameti pomiriti se s Julijom. Karlu je sve teže jer Augustina mu pokazuje hotel s pet zvjezdica koji je izabrala. Stela je oduševljena Evinim priznanjem o Kristijanu, ali Eva je zabrinuta jer je on zaručen, a ona poučena vlastitim iskustvom ne želi nikome otimati muškarca. Adela savjetuje Juliji da krene dalje što se tiče Andrije. Juran traži od Sonje pomoć pri provali u Vjekinu kancelariju. Lovro dolazi po Ladu za vrijeme pauze i nailazi na don Antu i Otta koji s Ladom pretresaju dosadašnji napredak oko slaganja ekipa za nogometni turnir. Ruža pobjesni kad sazna da se kod nje u gostionici hrane Evini radnici. Eva i Kristijan otvoreno razgovaraju o onome što se između njih dogodilo. On je zatečen i ne zna kako bi odgovorio na njezina izravna pitanja.  Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
