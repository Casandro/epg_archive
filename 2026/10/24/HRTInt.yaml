  title: 'Život u jednom danu: Pero Zlatar - Zlatno pero'
  subtitle: ' '
  description: 'Pero Zlatar (1934. - 2020.) bio je jedan od naših najdugovječnijih novinara i urednika koji je sudjelovao u stvaranju mnogih novinskih magazina i dnevnih novina, reporter je koji je dobivao prve intervjue, ulazio u zemlje diljem svijeta prateći sve, od politike do sporta. Svježinu i entuzijazam i u devetom desetljeću života pokazao je i u razgovoru snimljenom 2019. sa Ksenijom Urličić, kolegicom i prijateljicom, Nikolom Plećašem, proslavljenim košarkašem te nezaboravnim duhovitim karikaturistom Davorom Štambukom.  Autorica koncepcije: Snježana Samac'
