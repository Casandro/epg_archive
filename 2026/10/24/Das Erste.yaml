  audiodesc: true
  description: 'Im österreichischen Dorf Engelsberg sorgt die Polizistin Pia Kraus mit Augenmaß für Recht und Ordnung. Von ihren eigenen Sorgen weiß nur ihre Freundin, die Ärztin Anni Rath. Pia kann jedoch nicht kürzertreten: Seit Monaten sucht sie nach ihrer 17-jährigen Nichte Amelie, die nach einem Streit mit ihrer Mutter Caro Scheuer vermisst wird. Als in einem Moor ein blutverschmierter Turnschuh entdeckt wird, beginnt unter Leitung von Pias ehemaligem Kollegen Tarek Moser eine Suchaktion.'
