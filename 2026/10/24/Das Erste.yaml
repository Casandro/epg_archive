  subtitle: Der sagenhafte Gral
  description: Guinevere ist auf dem Weg in die Ferien in ihre Heimat Cameliard. In ihrem Gepäck befindet sich der sagenhafte Gral, der magische Kräfte besitzt. Doch Guinevere weiß davon nichts und hält ihn für ein normales Abschiedsgeschenk. Auch die Freunde der Tafelrunde haben den Gral in Guineveres Gepäck entdeckt und stellen Nachforschungen an. Sie finden heraus, dass der Gral zwar jeden Wunsch erfüllen kann, seine Besitzer aber in den Wahnsinn treibt.
