  description: Nach dem Leichenfund im Moor sitzt der Schock bei Polizistin Pia Kraus tief. Die Obduktion ihrer Nichte ergibt, dass Amelie kurz vor ihrem Tod ein Kind zur Welt brachte. Damit gilt es, nicht nur einen Mörder, sondern auch das verschwundene Baby zu finden, was Pia und ihren Kollegen Moser zusätzlich unter Druck setzt. Zu Hause ist für die zweifache Mutter die Situation ebenfalls angespannt, als Ehemann Jonas zufällig ein Schreiben entdeckt, das ihre ganze Zukunft in ein neues Licht stellt. Pia bittet ihn um Stillschweigen - doch wie lange lässt sich ihr Geheimnis hüten?
