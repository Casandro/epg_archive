- eventId: 1407516
  start: 2026-10-24T17:03:00Z
  stop: 2026-10-24T18:00:00Z
  title: MausRadio - MausHörspiel
  subtitle: 'Die Pfefferkörner: Das Geisterhaus / Peking-Kracher (12/13)'
  description: |-
    <strong>Das Geisterhaus</strong>
    Eigentlich doch total klar: es gibt keine Geister. Aber wenn trotzdem alles darauf hindeutet? Hinter dieses Geheimnis wollen die Pfefferkörner ganz dringend kommen: was ist los in Tante Gordys Haus?
    <strong>Peking-Kracher</strong>
    Es ist immer wieder toll im Hamburger Hafen. Diese riesigen Schiffe! Bei einigen von ihnen darf man als Besucher sogar an Bord gehen. Als Jasina sich während einer Schiffsführung unter Deck umschaut, kommt sie einem großen Verbrechen auf die Spur und gerät dabei in Gefahr.
    Regie: Sebastian Stuertz und Sandra Thormählen<br/>Produktion: NDR <markup type="abbr" abbreviation="2025" correspondent="zweitausendfünfundzwanzig">2025</markup>
