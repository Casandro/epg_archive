  description: Peggy Rosinski muss ihre Familie mit den drei Kindern und Mann alleine über Wasser halten. Torben ist wieder einmal ohne Job und die unbezahlten Rechnungen führen dazu, dass die Zwangsräumung droht. Als ihre Mutter Angelika wieder einmal auftaucht und ihren Schwiegersohn Torben für eine Lieferung von Traktoren nach Polen anheuern möchte, ahnt Peggy nichts Gutes und kann gerade noch verhindern, dass die Sache schiefgeht. Doch die listige Oma hat noch ganz andere Pläne.
