  title: Impakt
  description: Generace Z je líná, nechce pracovat a má přehnané nároky. Podle ekonoma Jana Bittnera podobné stereotypy provázejí téměř každou nastupující generaci. Mladí dnes navíc vstupují na pracovní trh, na kterém musí řešit drahé bydlení, nejisté pracovní podmínky i nástup umělé inteligence. "To už není rozhodování o kariéře, je to spíš survival mode," říká v pořadu Impakt. Poslechnout si ho můžete už teď. (repríza)
