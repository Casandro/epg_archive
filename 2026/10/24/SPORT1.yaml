  title: Hamburger Autoperlen Kurzversion
  subtitle: Hamburger Autoperlen Kurzversion
  description: Bentley, Ferrari, Lamborghini, Porsche - In der neuen Auto-Dokusoap auf SPORT1 dreht sich alles um die pfeilschnellen Sportwagen des Hamburger Luxusautohändler Hamid Mossadegh. Nur namhafte und PS-starke Schlitten stehen bei Mossadegh im Showroom. Zu seinen prominenten Kunden gehören unter anderem die Fußballstars Mesut Özil und Jerome Boateng. In "Hamburger Autoperlen" wird Hamid Mossadegh beim Kauf und Verkauf von neuen Luxuskarossen begleitet. Bei ausgefallenen Kundenwünschen müssen auch Autos von "außerhalb" eingekauft werden. Ein Fall für den Hamburger Autoexperten Karsten Peters, der die Garagen, Hinterhöfe und Scheunen von Privatbesitzern nach potentiellen Auto-Schätzen durchforstet.
  widescreen: true
