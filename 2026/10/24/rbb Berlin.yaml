  description: "In den 1960ern hat die Rockmusik das Regiment über die Jugendkultur übernommen, aber die altehrwürdige BBC weigert sich, die Titel angesagter Bands zu senden. In die Bresche ist unter anderem der Piratensender Quentins gesprungen, der von einem in der Nordsee ankernden Schiff die britischen Jugendlichen mit der gewünschten Musik versorgt. \nCarl ist ein Neuankömmling auf dem Schiff. Absurderweise soll er auf Geheiß seiner Mutter im Schoß des Piratensenders von den Drogen loskommen. Das ist aber gar nicht so einfach, wenn man bedenkt, dass an Bord Drogen und Frauen wichtige Zutaten des DJ-Lebens sind."
