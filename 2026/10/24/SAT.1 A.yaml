  description: |-
    Herzerwärmender Animationsfilm nach dem Roman von Peter Brown: Roz ist eine Roboterfrau, die stets nur Befehle befolgt. Als sie unerwartet auf einer einsamen Insel landet, ist da niemand mehr, auf den Roz hören muss. Stattdessen trifft sie auf wilde Tiere, die ihre ganz eigenen Regeln haben. Roz entdeckt ein Ei, aus dem ein Gänseküken schlüpft und sie als Mama ansieht. Daraufhin gibt der Roboter alles, um das flauschige Wesen auf die unausweichliche Reise gen Süden vorzubereiten.

