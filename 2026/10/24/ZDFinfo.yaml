    Wie lebenswichtig die Sonne ist, zeigt sich, wenn sie fehlt. Vulkanausbrüche und Kometeneinschläge haben die Sonne schon mehrfach in der Geschichte mit Staub verhüllt - und so ganze Arten ausgelöscht.
