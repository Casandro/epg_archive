    Deutschland 2019
    Unter Milliarden von Sternen hat einer für uns besondere Bedeutung: Die Sonne bestimmt das Schicksal der Erde. Doch kosmische Mächte nehmen Einfluss auf unseren Glücksstern - und auch auf uns.

    Immer wieder gerät die Sonne in Wallung. Dann drohen gewaltige Stürme geladener Teilchen, die unserer modernen Welt erheblichen Schaden zufügen. Niemand weiß genau, was die Sonne aufbrausen lässt. Eine Theorie gibt bestimmten Planetenkonstellationen eine Mitschuld.
