    Deutschland 2021
    Die Flut an Informationen wird immer größer. Die neuen Medien drohen uns zu überfordern. Was muss man heute wirklich wissen? Harald Lesch findet einen Weg durch das Labyrinth des Wissens.

    Früher fand das Wissen der Welt Platz in einem Bücherregal. Heute umfasst das Internet Milliarden Webseiten, jährlich wächst die Datenmenge schneller. Die Lösung der großen Fragen von Gegenwart und Zukunft findet sich aber nicht in Milliarden von Google-Links.
    HD-Produktion
