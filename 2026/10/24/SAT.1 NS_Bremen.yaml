    (WH vom Samstag, 24.10.2026, 00:10 Uhr)
  description: 'Das Detektivspiel nimmt Fahrt auf - und jetzt sind die Diebe am Zug. In der Blackbox müssen sie ihre erste folgenschwere Entscheidung treffen: Wer ist ihnen bereits gefährlich nahe gekommen? Während die Detektive noch im Dunkeln tappen, wird einer von ihnen heimlich aus dem Spiel genommen. Doch Zeit zum Durchatmen bleibt nicht: Die erste Anklage steht bevor. Nur der Sieg im Immunitätsspiel kann jetzt noch Schutz bieten - und das Misstrauen wächst.'
