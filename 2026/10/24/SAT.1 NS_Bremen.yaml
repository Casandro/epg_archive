    (WH vom Freitag, 23.10.2026, 23:05 Uhr)
  description: 'Madame S. lädt 13 ahnungslose Realitystars in ihr pompöses Schloss - und mitten hinein in ein packendes Detektivspiel. Drei Diebe haben ihre geliebte Hündin Coco entführt. Gelingt es den Detektiven, den Fall zu lösen, winken 20.000 Euro. Doch was niemand ahnt: Die Täter sind längst unter ihnen. Schon kurz nach dem Einzug überschlagen sich die Verdächtigungen. Wer spielt falsch, wer sagt die Wahrheit - und wem kann man überhaupt noch trauen?'
