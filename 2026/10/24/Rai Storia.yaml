  title: Un'epoca nuova Pace - Uniti e divisi (p
  subtitle: Un'epoca nuova Pace - Uniti e divisi (pt3) - I trattati di pace che seguono la Seconda Guerra Mondiale vengono discussi a Parigi nell'estate del 1946 e firmati dal Governo Italiano nel Febbraio del `47. N
  description: "ei confronti dell'Italia sconfitta le potenze vincitrici hanno un atteggiamento punitivo e lasciano poco spazio alla trattativa. Per l'Italia guidata da Alcide De Gasperi si apre tuttavia una nuova stagione in cui le sfide sono quelle della rinascita economica e politica, della creazione di nuovi rapporti diplomatici e della scelta dello schieramento tra i due blocchi contrapposti che si stanno configurando: Stati Uniti e Unione Sovietica. Il grande investimento americano in Europa, con il Piano Marshall, getta le basi per una crescita e un primo tentativo di unificazione europea; tuttavia la separazione tra est e ovest e lo spettro atomico, la cosiddetta guerra fredda, danno inizio a decenni di tensioni diplomatiche internazionali. Per evitare nuovi conflitti viene creata l'Organizzazione delle Nazioni Unite, mentre alla fine degli anni '40 nasce il Patto Atlantico con lo scopo di difendere i paesi che ne fanno parte, tra cui l'Italia, da possibili aggressioni. L'Europa si avvia verso una serie di accordi economici e politici che scaturiscono nei trattati di Roma del 1957, le prime basi dell'attuale Comunità Europea. La puntata approfondisce e racconta questi temi con i contributi dei professori Sara Lorenzini, Mario Del Pero e Antonio Varsori. A Umberto Broccoli invece è affidato il compito di punteggiare con brevi aneddoti i quattro capitoli della narrazione. - \n\nDi Fabrizio Marini produttore esecutivo Annalisa Vasselli"
