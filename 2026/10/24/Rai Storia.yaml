  title: Storie della tv Videocrazia (1994-2004)
  subtitle: 'I primi 50 anni della Televisione Italiana e la lunga preparazione al lancio della programmazione ufficiale, avviata il 3 gennaio 1954. Tra il 1994 e il 2004 il nuovo scenario politico sorto con il sistema '
  description: "elettorale maggioritario e la 'discesa in campo' di Silvio Berlusconi trasformano il ruolo sociale della TV, sia pubblica che commerciale, mentre si profila lo scenario degli anni 2000, dove la televisione pubblica copre nuove missioni e affronta nuovi mercati, nel segno della sua storia. Con le testimonianze di Bruno Vespa, Rosario Fiorello, Lino Banfi, Simona Ventura e il linguista Giuseppe Antonelli. - \n\ndi Ario Giorgino. Un programma di Enrico Salvatori e di Fabrizio Marini, con la consulenza di Aldo Grasso. Produttore esecutivo Emanuela Capo. Regia di Eva Frerè e Matteo Bardelli"
