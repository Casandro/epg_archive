  title: SWR4 Sprechstunde
  subtitle: 'Thema: Haustiere'
  description: "Was kann ich tun, wenn mein Hund ständig bellt? Wie oft sollte ich mit meiner Katze zur \nVorsorgeuntersuchung? Wie kann ich meinem alten Haustier das Leben erleichtern? \n \nTierarzt Ralph Schuh hilft allen Herrchen und Frauchen. \n\nSie fragen, unsere Experten antworten.\n\nUnter der kostenlosen Telefonnummer  08000 70 4444  können Sie Ihre Fragen in der Sendung stellen.\n\nImmer samstags zwischen 10 und 12 Uhr geben Ihnen unsere Experten in der SWR4 Sprechstunde nützliche Tipps."
