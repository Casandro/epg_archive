  description: "ha saputo intraprendere un importante percorso di rinascita, trasformando memoria e identità in nuove occasioni di sviluppo e innovazione. Il programma è realizzato in collaborazione con il Ministero della Cultura  Dipartimento per le attività culturali. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore Esecutivo Daniela Rainaldi\nRegia di Fernando Lizzani"
