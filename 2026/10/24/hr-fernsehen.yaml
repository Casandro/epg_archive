  title: 'Der Camping-Check: Wacken Festivalcamping'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    Die härtesten und kreativsten Camper feiern das bisher wohl schlammigste Wacken Open Air! Sie pilgern mit Zelten, rockigen Wohnwagen und außergewöhnlichen Wohnmobilen auf das größte Heavy-Metal-Festival der Welt.
    Klar, dass Friso Richter und Kameramann Lukas Lowack da nicht fehlen dürfen. Sie wollen die Menschen mit ihren Unterkünften und den Festival-Campingplatz kennenlernen, der währenddessen immer weiter im Schlamm versinkt. Dabei wollen sie auch herausfinden, was diese ganz besondere Wacken-Gemeinschaft ausmacht.
