  title: Soul Shift (4/10)
  subtitle: Revolutionär Evolutionär (S01/E04)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: Auf Tau-Blaus Erde haben sich verschiedenste Arten von Reptilien und Echsen entwickelt. Eisengrün trainiert währenddessen auf seinem Planeten Conglom Steinmonster, die große Gesteinsbrocken in den Himmel schleudern sollen. Glitzer lernt, dass Seelen jegliche Formen annehmen können. "Außerhalb des Dienstes" zeigen sie sich am liebsten in der Form, die am meisten ihrer persönlichen Natur entspricht. Darunter sind auch unangenehme Charaktere wie Parasiten und Milben. Für welche Erscheinung wird sich wohl die kleine Glitzer entscheiden?
- eventId:
