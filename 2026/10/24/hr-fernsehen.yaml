  audiodesc: true
  description: 'Nirgendwo wird so gefeiert wie in Berlin. Durch den Mauerfall hat die Stadt viel zu bieten: keine Sperrstunde, freie Flächen und Freiraum. Etliche Clubs entstehen: Planet, E-Werk, Tresor oder Bunker. DJs und Techno-Fans ziehen von überallher in die Großstadt. Der Trend hält bis heute. Viele Touristen kommen nur wegen der Parties. Vor allem um das "Berghain" bildet sich ein Mythos. Das liegt auch an den Regeln: keine Fotos, Awareness für queere Partygäste, strenge Türpolitik.'
