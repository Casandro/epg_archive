  description: Eine junge Dame, Fräulein Müller, ist stille Teilhaberin an der Firma Hesselbach. Sie hat von Geschäften wenig Ahnung und kreuzt darum mit einer Beraterin, Fräulein Flockenbusch, im Betrieb auf. Jene Beraterin bringt es fertig, Direktor Hesselbach einen Aufsichtsrat in Gestalt seiner Frau und Fräulein Müller vor die Nase zu setzen und sich selbst als zweite Geschäftsführerin und "Spezialistin für Werbung und Betriebsrationalisierung" in die Firma einzusetzen. Nicht nur die Angestellten haben unter ihr zu leiden, sondern auch der Direktor persönlich. Nur - wie wird man diese Dame wieder los?
