  - 561538
  start: 2026-10-24T01:35:00Z
  stop: 2026-10-24T01:45:00Z
  title: Soul Shift (2/10)
  subtitle: Ende der Monotonie (S01/E02)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: Für die Schaffung neuer Lebensformen auf ihren jeweiligen Planeten werben die Evolutionsmanager um die besten Seelen. Da jeder Planet andere Vorteile hat, entsteht eine heiße Diskussion unter den Seelen, welcher wohl der vielversprechendste ist. Will man lieber bei der bezaubernden Calendula auf Zinnober Prime inkarnieren, oder beim minimalistischen Eisengrün auf Conglom? Auf Tau-Blau kommt jede Menge Arbeit zu, um die Erde bestmöglich zu entwickeln. Und so beschließt er, das pinke, kleine Energiebündel namens Glitzer bei seinem Freund Sonnengelb abzugeben und sich vollkommen auf seine Evolution zu konzentrieren.
