  title: Mein wunderbarer Kochsalon - Süß-sauer mariniertes Schweinefilet mit Wildem Brokkoli und gebratenem Spargel
  subtitle: Mein wunderbarer Kochsalon - Süß-sauer mariniertes Schweinefilet mit Wildem Brokkoli und gebratenem Spargel
  description: |-
    Wenn man an Filzmoos denkt, kommen einem die Bischofsmütze, das Skifahren und Wandern in den Sinn. Und natürlich die Familie rund um Johanna Maier, die die Gegend mit ihrem 'Hubertus' als erste Vierhaubenköchin der Welt kulinarisch prägte. Ihre Küche steht für scheinbar unspektakuläre Zutaten, der sie ein wenig Zauberstaub drüberstreut und sie auf ihre ganz spezielle Art und Weise alchemiert. Diese Fähigkeit hat sie auch ihren Buben in die Wiege gelegt. Bei mir zu Gast im Kochsalon ist diesmal Didi Maier (Restaurant 'Didilicious' in Salzburg), der Schweinefilet und ein paar Gemüse auf die Bühne holt. Und sich damit standing ovations holt.
     AT 2019
- eventId: 974554
  start: 2026-10-24T14:10:00Z
  stop: 2026-10-24T14:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ana Ros
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ana Ros
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ana Ros ist Mutter von zwei Kindern, hat keine Kochausbildung, dafür aber außergewöhnliches Talent. Gemeinsam mit Ehemann Valter Kramar, ein renommierter Sommelier, übernahm sie das Restaurant Hisa Franko - er überredet Ro¨, die Küchenleitung zu übernehmen. Heute begeistert sie dort mit einer Küche, die lokale und saisonale Ingredienzien aus ihrer Heimat mit einem internationalen, avantgardistischen Ansatz verbindet. Martin Klein, der Executive Chef des Restaurant Ikarus im Hangar 7 hat die Köchin in Kobarid besucht. AT 2014'
