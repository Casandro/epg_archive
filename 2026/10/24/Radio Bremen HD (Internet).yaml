  title: Auf'm Trecker
  subtitle: Auf der Überholspur zwischen Zwiebeln und Wein
  description: 'Elise Köhler hat ihr ganz eigenes Tempo! Mit 16 Jahren hat sie Abitur gemacht, danach folgt eine Ausbildung zur Tanzlehrerin und - weil es sie interessiert hat - ein Jurastudium in Münster. Nach diesen "Umwegen" ist für die heute 28-Jährige aber klar: Sie möchte den heimischen Hof südlich von Hannover von ihrem Vater übernehmen - in der 16. Generation. Mit Zwiebeln und Wein möchte sie in ihrem Tempo den Hof auf Erfolg bringen. Wird es ihr in diesem Jahr gelingen?'
- eventId: 666162
  start: 2026-10-24T14:30:00Z
  stop: 2026-10-24T15:15:00Z
  title: Unterwegs auf der Luftlinie
  description: 'Die beiden Reporter Vanessa Kossen und Thilo Tautz bewegen sich zu Fuß und abseits ausgetretener Pfade durch Norddeutschland. Möglichst dicht an der Luftlinie zwischen ihren jeweiligen Startpunkten wollen sie den Norden erkunden. Die Strecke ist 100 Kilometer lang: Thilo Tautz startet in Dyksterhusen (Ostfriesland), dem sogenannten "Endje vun de Welt", Vanessa Kossen in Bremen-Gröpelingen. Konsequent laufen sie die Luftlinie entlang, ohne Geld und Zelt, immer schnurstracks geradeaus. Wie soll das funktionieren?'
  genre:
  - '144'
- eventId: 668057
  start: 2026-10-24T15:15:00Z
  stop: 2026-10-24T16:00:00Z
  title: Hanseblick
  subtitle: Adriaparadies Vis - Kroatiens Inselwelt
  description: Die kroatische Insel Vis blüht wieder auf. Zu jugoslawischen Zeiten wurde das abgelegene Eiland zur Festung ausgebaut, Ausländern war das Betreten verboten. Jetzt leben sie hier wieder ihre einzigartige Geschichte. Da sind das venezianische Kastel am Hafen von Komiza, die verlassenen U-Boot Bunker an der Nordküste oder die alten Flugfelder, auf denen Wein wächst. Vor ein paar Jahren entdeckte Hollywood die romantischen Küstenorte Vis-Stadt und Komiza.
