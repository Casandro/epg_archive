  start: 2026-10-24T10:00:00Z
  stop: 2026-10-24T10:45:00Z
  title: Unsere Geschichte - Made in Norddeutschland
  subtitle: Rügenwalder Mühle - Mit der Teewurst an die Spitze
  description: 'Das Familienunternehmen Rügenwalder Mühle ist 183 Jahre alt. Der jetzige Seniorchef Christian Rauffus ist überzeugt: "Wenn wir uns nicht immer geändert hätten, gäbe es uns so lange nicht." Angefangen hat alles in einer kleinen Fleischerei in Rügenwalde in Pommern. Dort wurde 1904 eine neue Spezialität hergestellt: Die Teewurst. Der Film dokumentiert den Aufstieg der Metzgerdynastie zu einer der bekanntesten Wurstfabrikanten in Deutschland.'
  genre:
  - '144'
- eventId: 659563
  start: 2026-10-24T10:45:00Z
  stop: 2026-10-24T11:15:00Z
  title: Weltbilder
  subtitle: Malta - Wüste oder Wasserlabor der Zukunft?
  description: 'Malta: Europas trockenste Insel und zugleich trockenstes Land. Der Inselstaat kämpft ums Überleben. Forscher, Bauern und Umweltaktivisten kämpfen gegen die Dürre und gegen die eigene Regierung, die weiter auf Wachstum setzt. Während jedes Jahr Millionen Urlauber auf die Insel drängen, bleibt für die Landwirtschaft kaum ein Tropfen Wasser. Die Reportage zeigt jene Menschen, die trotz widrigster Bedingungen nicht aufgeben und Malta zu einem Labor der Zukunft machen. Eine eindringliche Warnung. Aber auch ein Hoffnungsschimmer.'
- eventId: 659875
  start: 2026-10-24T11:15:00Z
  stop: 2026-10-24T12:00:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Französisch-Guayana - Europas Paradiesvogel
  description: Französisch-Guayana ist ein entlegenes EU-Überseegebiet an der Nordküste Südamerikas. Mehr als 80 Prozent des Landes sind von Regenwald bedeckt, doch illegale Goldgräber bedrohen das fragile Ökosystem. Unter Capitaine Clément kämpft die Fremdenlegion gegen die verborgenen Minen. Wildtierärztin Solène Lefort versorgt Jaguare, Tapire und ein verwaistes Brüllaffenbaby. In Saül unterrichtet Mirabelle Nurgent eine einzige Schulklasse. In Cayenne feiern die Touloulous die kreolische Kultur, während in Kourou Europas Raumfahrt ins All startet.
