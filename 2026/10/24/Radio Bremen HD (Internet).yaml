- eventId: 652641
  start: 2026-10-24T03:15:00Z
  stop: 2026-10-24T04:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Ronja von Rönne, Schriftstellerin'
  description: 'Ronja von Rönne erzählt von der Liebe, wie sie wirklich sein kann: komisch, grausam und zärtlich, aber manchmal auch ziemlich manipulativ. All das kommt in ihrem neuen Roman "Alles Liebe" vor. Dass Liebe trotz allem funktionieren kann, weiß sie aus eigener Erfahrung: Sie hat den Mann aus ihrem einzigen Tinder-Date geheiratet. Geboren 1992 in Berlin und aufgewachsen in einem oberbayerischen Dorf, machte sich Ronja von Rönne zunächst mit dem Blog "Sudelheft" und provokanten Texten einen Namen.'
- eventId: 653031
  start: 2026-10-24T04:00:00Z
  stop: 2026-10-24T04:30:00Z
  title: 'Die Nordreportage: Zoll - Einsatz an der Westküste'
  description: 'Sarah und Christoph arbeiten als Team beim Zoll. Ihr Einsatzgebiet: Die Westküste Schleswig-Holsteins, von Wedel bis zur dänischen Grenze. Das Besondere an dieser Zolleinheit: Sie kontrollieren alles - Pkw, Lkw, Schiffe und Flugzeuge. Dabei sind sie unterschiedlichen Schmuggelwaren auf der Spur: Zigaretten, Drogen, Alkohol und Gold. Wer beim Zoll arbeitet, sollte den richtigen Riecher haben und Verdächtiges in der Masse erkennen. Das ist keine einfache Aufgabe.'
- eventId: 653409
  start: 2026-10-24T04:30:00Z
  stop: 2026-10-24T05:00:00Z
  title: Die Nordreportage
  subtitle: Den Schmugglern auf der Spur - Unterwegs mit dem Zoll am Hamburg Airport
  description: Etwa 17 Millionen Reisende nutzen Hamburgs Flughafen jedes Jahr. Die rund 160 Zöllnerinnen und Zöllner sorgen dafür, dass nichts eingeschmuggelt wird. Dabei kommen Zollhunde und hochmoderne Technik zum Einsatz, mit deren Hilfe die Beamten zum Beispiel tierische Produkte oder Sprengstoff aufspüren können. Die Zöllner am sogenannten Grünen Kanal haben weder ein echtes noch ein elektronisches "Näschen" für nicht angemeldete Waren. Sie müssen sich auf ihre Erfahrung verlassen, wenn sie Reisende bitten, ihr Gepäck zu öffnen.
  genre:
  - '144'
- eventId: 655580
  start: 2026-10-24T05:00:00Z
  stop: 2026-10-24T05:30:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: Lach- und Sachgeschichten, heute mit einem echten Rettungshubschrauber, Charlie und Lola im Herbst, Christoph und ganz viel Laub, Bitzers Kampf mit den Herbstblättern - und natürlich mit der Maus, dem Elefanten und der Ente.
- eventId: 655926
  start: 2026-10-24T05:30:00Z
  stop: 2026-10-24T06:00:00Z
  title: Sehen statt Hören
  subtitle: Fernsehen in Gebärdensprache
  description: 'Wiedersehen nach 30 Jahren: "Alice & der Aurifactor" - ein Film, der bis heute nachwirkt. Es ist ein außergewöhnlicher Kurzfilm, eine expressionistische Märchenfabel, die den Kampf der Gehörlosengemeinschaft in einer hörenden Welt untersucht. Regisseur Jörg Fockele thematisierte Ausgrenzung schon vor 30 Jahren in seinem Abschlussfilm der HFF München. Und bekam viel Aufmerksamkeit dafür. Es ist Zeit, sich an all das noch einmal zu erinnern - mit den SchauspielerInnen und MacherInnen von damals.'
- eventId: 656378
  start: 2026-10-24T06:00:00Z
  stop: 2026-10-24T06:30:00Z
  title: Grænzenlos - Hinter den Kulissen der "Flensborg Avis"
  subtitle: Eine dänische Tageszeitung in Deutschland
  description: Die erste Ausgabe "Flensborg Avis" erschien am 1.Oktober 1869. Gegründet wurde die Zeitung von dänisch gesinnten Kreisen, die auch nach der Niederlage Dänemarks 1864 und der Eroberung Sønderjyllands durch Preußen die Verbindung zu Dänemark betonen wollten. Der preußischen Verwaltung war die dänischsprachige Zeitung ein Dorn im Auge. Die Grenzziehung 1920 brachte neue Probleme, da nun ein Großteil der Leserschaft nördlich der Grenze lebte. Überlegungen, den Redaktionssitz nach Dänemark zu verlegen, wurden verworfen, die "Flensborg Avis" wurde die Zeitung der dänischen Minderheit in Deutschland.
- eventId: 656566
  start: 2026-10-24T06:30:00Z
  stop: 2026-10-24T07:00:00Z
  title: Mit Mut, Mörtel und Millionen Tipps (3/3)
  subtitle: Kleines Gutshaus, große Fortschritte
  description: 'Mauern einreißen, Wände verputzen, Leitungen ziehen. Carolin und Sebastian Paschen sind wichtige Handlanger für ihre Handwerker bei der Sanierung des Gutshauses Langwitz. Das Dach haben sie allein frei gelegt, damit Zimmermeister Fridolin Fischer die verrotteten Balken erneuern kann. Der Experte für historische Gutshäuser ist begeistert von den Bauherren. Ihr nächstes Projekt: Schalung fürs Fachwerk mit einem Hanf-Kalk-Gemisch. Nicht selten steht das Künstlerpaar bis weit nach Mitternacht auf der Leiter. Und auch ein schwerer Wassereinbruch kurz vor einem Konzert bringt sie nicht aus der Ruhe.'
