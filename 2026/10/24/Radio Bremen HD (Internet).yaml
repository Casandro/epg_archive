  title: DAS! Rote Sofa
  subtitle: 'zu Gast: Caren Miosga, ARD-Moderatorin'
  description: 'Als Journalistin und Moderatorin gehört Caren Miosga zu den bekanntesten Persönlichkeiten des deutschen Fernsehens. Nach vielen Jahren als prägendes Gesicht der tagesthemen ist sie inzwischen mit ihrer eigenen politischen Talksendung "Miosga" sonntags im Ersten zu sehen. In der Sendung wird sie über eines der drängendsten Probleme vieler Menschen sprechen: häusliche Pflege. Denn gegenwärtig werden in Deutschland fünfeinhalb Millionen Menschen zu Hause versorgt. Für die ARD-Dokumentation "Und wer fragt nach mir?" hat sie Angehörige getroffen und zeigt, wie Familien an ihre Grenzen kommen.'
