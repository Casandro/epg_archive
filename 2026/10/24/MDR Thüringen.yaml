  description: Unter Drogeneinfluss rufen die passionierten Okkultisten Nik und Isaak bei einer Séance den Geist der Finsternis an. Wenig später liegt Nik tot in dem verschlossenen Raum. Isaak behauptet, der Dämon Belphegor sei der Täter. Für Van der Valk kommt das übersinnliche Wesen als Verdächtiger nicht infrage. Doch mit jedem Hinweis wird das Rätsel undurchsichtiger. Auf der Spur eines verschwundenen Ordensmitglieds und dunkler Geheimnisse gerät die Ermittlung in ein Netz aus Angst, Glauben und Täuschung.
