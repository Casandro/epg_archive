  title: Entstehung der Alpen - Schatzkammer Alpen
  subtitle: Entstehung der Alpen - Schatzkammer Alpen
  description: 'Entstehung der Alpen - Schatzkammer Alpen: Unsere Alpen sind eine wahre Schatzkammer, sogar im allerengsten Sinn des Wortes. Denn unter den Wurzeln der Berge schlummern wertvolle Ressourcen. Der österreichische Wissenschafter Prof. Rudi Simek ist dafür durchs Land unterwegs auf der Suche nach diesen Schätzen. Stets mit einem Augenzwinkern, ob in den Mythen nicht doch ein Kern Wahrheit steckt. AT 2015'
- eventId: 974586
  start: 2026-10-24T12:25:00Z
  stop: 2026-10-24T13:11:00Z
  title: Entstehung der Alpen - Erlebniswelt Alpen
  subtitle: Entstehung der Alpen - Erlebniswelt Alpen
  description: Entstehung der Alpen - Erlebniswelt Alpen:Unsere Alpen - seit jeher ein geschichtsträchtiger Ort im Herzen Europas und Mittelpunkt historischer Entwicklungen und bahnbrechender Erkenntnisse. Beeindruckende Berge, wilde Flüsse und einzigartige Landschaften haben die Menschen seit Jahrhunderten bewegt und in die Alpen gelockt. Prof. Rudolf Simek macht sich auf die Spuren des Tourismus. Warum kamen die ersten Reisenden in die Alpen und wie entwickelte es sich zum Massentourismus? AT 2015
- eventId: 974587
  start: 2026-10-24T13:15:00Z
  stop: 2026-10-24T14:02:00Z
  title: Entstehung der Alpen - Mythos Alpen
  subtitle: Entstehung der Alpen - Mythos Alpen
  description: 'Entstehung der Alpen -  Mythos Alpen: Unsere Alpen. Eine beeindruckende und vielfältige Landschaft, die über Jahrmillionen entstanden ist. Prägende Epochen und historische Ereignisse spielten sich ab, umgeben von imposanten Berggipfeln der Alpen. Aber woher stammen die vielfältigen Namen unserer Berge und Gebirge? Und welche Geschichten führten zu ihrer Benennung? Wenn die Berge unserer Alpen selbst sprechen und erzählen könnten, würde es lange dauern bis sie etwas über uns zu berichten hätten. Denn als der Mensch hier irgendwann einmal hier auftauchte, standen die Gebirge selbst schon Millionen von Jahren AT 2015'
- eventId: 974588
  start: 2026-10-24T14:05:00Z
  stop: 2026-10-24T14:52:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  description: |-
    Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen: Seit tausenden Jahren trennen die imposanten Gipfel der Alpen Nord und Süd in Mitteleuropa - und scheinen dabei schier unüberwindlich. So bauten sich die Menschen Wege über die Alpen und perfektionierten die einfachen Pfade zu dem ausgeklügelten Verkehrsnetz das wir heute kennen. In den Pässen der Alpen sehen sie wichtigsten Routen, die die Geschichte Europas prägten und zum Aufstieg und Fall großer Persönlichkeiten führten.
     AT 2015
- eventId: 974589
