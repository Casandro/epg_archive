  description: |-
    Im zweiten Teil von Robert Klinks Trekkingabenteuer entlang des 175 km langen Fisherman's Trail an Portugals Atlantikküste setzt sich die Reise zum südwestlichsten Punkt Europas fort. Nach einem starken Auftakt in Teil 1 geht es nun mit Rucksack und Zelt weiter durch eine der schönsten, aber auch anspruchsvollsten Küstenlandschaften Europas.
