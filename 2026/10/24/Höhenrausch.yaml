  description: Seit 70 Jahren erst gibt es Steinböcke in den Berchtesgadener Alpen. Seit einiger Zeit hält sich ein unglaubliches Gerücht - einige Steinböcke sollen sogar in der extrem steilen Watzmann Ostwand leben. Gesehen hat sie aber dort noch niemand. Die beiden Dokumentarfilmer und Extremkletterer Max Reichl und Franz Hinterbrandner wollen die Steinböcke in der Ostwand aufzuspüren. Damit hätten sie geschafft, was noch keinem vor ihnen gelungen ist...  AT 2013
