  title: Otvori spomenar
  subtitle: Religijski
  description: U emisiji Otvori spomenar! gostuje stožerni narednik i voditelj klape "Sveti Juraj" HRM koja ove godine slavih punih 25 godina svoga postojanja. Priča o njihovom osnutku je posebna i kako oni sami osjećaju, dogodila se Božjom voljom pod okriljem Gospe Lurdske. Članovi klape Sv. Juraj HRM podarili su Hrvatima u domovini i diljem svijeta prekrasne domoljubne i duhovne pjesme koje su ušla u srca ljudi i u njima zauvijek ostala. Stožerni narednik, Marko Bralić prisjetit će se mnogih lijepih događaja i susreta tijekom godina, ali se i osvrnuti  na povijest Hrvatskoga naroda i otkriti kako se osjećaju dok imaju čast, na najljepši način, pjesmom prenositi glas ljubavi prema dragom Bogu, obitelji i domovini.
