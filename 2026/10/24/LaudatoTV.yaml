  description: Priča o djelovanju humanitarne organizacije Marijini obroci (Mary's Meals), koja danas u školama diljem svijeta hrani više od milijun i sto tisuća gladne djece. Autori filma s osnivačem organizacije zaputili su se u posjet programima školske prehrane u Malavi, na Haiti i u Indiju, gdje su otkrili priče pune nade i nadahnuća, izravno iz usta mladih ljudi čije su živote već trajno preobrazili Marijini obroci. Ovo je film o onima koji su jednom primali Marijine obroke, a koji sada pronalaze svoj glas. Zovemo ih 'generacijom nade'. Ovo je film o mladim ljudima koji će, nahranjeni i dobro obrazovani, postati muškarci i žene koji će podići svoje zajednice iz siromaštva i zajedno izgraditi svjetliju budućnost za svoje zemlje.
