  title: 'Sveta misa: Sveti Duh, Sveta misa: Sveti Duh, Zagreb'
  subtitle: Religijski
  description: Povodom proslave godine svetoga Franje, pratimo izravan prijenos iz Bazilike sv. Antuna Padovanskog na Svetom Duhu. Svečano euharistijsko slavlje predslavit će zagrebački nadbiskup mons. Dražen Kutleša, A prigodnu homiliju uputit će krčki biskup mons. Ivica Petanjak. Nadahnuti primjerom svetoga Franje zajedno obnovimo svoju vjeru i produbimo zajedništvo u Kristu.
