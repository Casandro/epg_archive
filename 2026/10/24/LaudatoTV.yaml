  title: Živjeti što Bog govori, Živjeti što Bog govori
  subtitle: Magazin/Religijski
  description: Deveta Božja zapovijed poziva nas da čuvamo čistoću srca i poštujemo svetost bračne ljubavi. Što znači ne poželjeti tuđega ženidbenog druga i zašto se vjernost ne odnosi samo na naše postupke nego i na naše misli, želje i nakane? O tome kako razumjeti ljudske želje, razlikovati napast od grijeha te živjeti vjernost u svakodnevnim odnosima u emisiji ,,Živjeti što Bog govori razgovaramo sa stručnim suradnikom don Rolandom Jelićem.
- eventId: 907478
  start: 2026-10-24T19:00:00Z
  stop: 2026-10-24T20:00:00Z
  title: Novo srce
  subtitle: Religijski
  description: Donosimo snažno i nadahnjujuće svjedočanstvo bračnog para Ane i Dražena Petrovića, koji su u braku već 15 godina. Kroz iskren razgovor podijelit će s gledateljima svoj životni put - kako je Gospodin u njihovoj različitosti spojio dva srca i pokazao da ljubav ne briše razlike, nego ih pretvara u bogatstvo. Govorit će o izazovima, traženjima i trenucima kada je svakodnevica postala siva, ali i o prekretnici koja je promijenila njihov pogled na brak i život. Posebno će istaknuti koliko ih je susret na Taboru duboko dotaknuo i preobrazio - kako su iz umora i rutine krenuli prema svjetlu, obnovljenoj vjeri i novoj radosti življenja s Gospodinom.
