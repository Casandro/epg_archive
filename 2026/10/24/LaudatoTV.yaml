  title: Superknjiga
  subtitle: Animirani
  description: Luka je sanjao san o Borisu, dječaku koji je u prošloj sezoni provalio u njihovu kuću. Ela misli da san možda služi kao Božji poticaj Luki da pomogne Borisu; Luka se nikada kasnije nije raspitivao za Borisa, nakon što su mu oprostili provalu, ali su ga nedavno vidjeli kako se druži s lošim društvom. Luka odbacuje Elino tumačenje, smatrajući da je premlad da bi ga Bog pozvao. Superknjiga ih odvodi da upoznaju mladog Samuela, upravo u vrijeme kada su Elijevi sinovi radili negativan utjecaj na izraelski narod. Luka i Ela svjedočili su tome kada je Bog pozvao Samuela još kao dječaka za vrijeme služenja Eliju. Godinama kasnije, kada je Samuel odrastao, vidjeli su ispunjenje Božjeg poziva kada je Samuel vratio narod Bogu, a Bog spasio Izraelce od pokolja Filistejaca. Po povratku u sadašnjost, Luka djeluje prema pozivu iz sna i pokuša se sprijateljiti s Borisom.
