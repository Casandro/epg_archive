  title: Iz srca majke Angelice
  subtitle: Religijski
  description: "From the Heart with Mother Angelica\nEmisije 'Iz srca majke Angelice' govore o temi koja je srž cijelog ovog serijala a to je odgovor na poziv za svetošću.\nU ovoj epizodi majka Angelica govori o gladi i žeđi za hranom i pićem, o gladi i žeđi za Bogom navodeći primjer Samarijanke sa zdenca i njezinog razgovora s Isusom. \nIsus u tom razgovoru kaže Samarijanki: \"Tko bude pio vode koju ću mu ja dati, ne, neće ožednjeti nikada. I majka Angelica objašnjava ovako: \"Što to znači kada očito žeđate za Bogom? Bog nas je stvorio da gladujemo za Njim. Ne idete za nečim za čim ne gladujete. Jedete li uopće kada ste siti? Ne, ne jedete kada ste siti. Jedete kada ste gladni, a uvijek možete biti gladni. Mi gladujemo za Bogom i moramo Bogu iznova ponavljati da ga volimo.\""
