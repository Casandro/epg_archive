  title: 'Pfarrer Braun: Das Skelett in den Dünen'
  subtitle: Fernsehfilm Deutschland 2003
  description: |-
    Ein Dummejungenstreich zu Halloween lässt Pfarrer Brauns kriminalistischen Spürsinn erwachen: Auf digitalen Fotomontagen ist neben Bewohnern der kleinen Insel Nordersand eindeutig ein Skelett zu sehen! Brauns Recherchen nach dem Ursprung der Gebeine ergeben, dass Hauptkommissar Geigers Sohn Markus in den Dünen buchstäblich darüber gestolpert ist. Während Geiger das Ganze kaltlässt, wittert Pfarrer Braun Mord - und seine Haushälterin Margot Roßhauptner bereits die nächste Verbannung, die üblicherweise seinen kriminalistischen Aktivitäten auf dem Fuß folgt.

    * Beginn der Winterzeit um 03:00 Uhr
