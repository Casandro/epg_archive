- eventId: 657290
  start: 2026-10-24T07:50:00Z
  stop: 2026-10-24T08:20:00Z
  title: Sehen statt Hören
  subtitle: Fernsehen in Gebärdensprache
  description: In Deutschland leben Menschen aus aller Welt, rund ein Viertel der Bevölkerung hat einen Migrationshintergrund und damit eine andere Kultur. Für eine eigene Kultur braucht es nicht unbedingt eine andere Herkunft, auch Gehörlose haben ihre Sprache, Kultur und Identität. Sehen statt Hören trifft auf drei ganz unterschiedliche Konstellationen und Menschen, die mit der Herausforderung umgehen, trotz unterschiedlicher kultureller Hintergründe, Werte und Traditionen offen und tolerant den anderen gegenüber zu sein - oder zu werden.
- eventId: 658397
  start: 2026-10-24T08:20:00Z
  stop: 2026-10-24T08:50:00Z
  title: Echtes Leben
  subtitle: Leinen los - junge Menschen mit Autismus
  description: "Eine starke Böe fährt in die Segel, Wasser spritzt über das Deck, hoch am Wind schiebt das Schiff kräftig Lage. Sebastian hat das Steuer fest im Griff. Skipper Rollo gibt klare Anweisungen zur Wende. Charlotte holt das Vorsegel dicht. \nWenn sich die Ostsee von ihrer rauen Seite zeigt, müssen alle Kommandos sitzen. Zumal es keine gewöhnliche Mannschaft ist, auf die Skipper Rollo Beckmann sich verlassen muss: Alle Mitglieder seiner fünfköpfigen Crew sind junge Menschen mit Autismus.\nDer Film führt auf einfühlsame Weise in die Lebenswelt der Autistinnen und Autisten ein und ermöglicht, sie schließlich besser zu verstehen."
  genre:
  - '112'
- eventId: 658634
  start: 2026-10-24T08:50:00Z
  stop: 2026-10-24T09:05:00Z
  title: KlimaZeit
  subtitle: 'Moderation: Katha Jansen'
  description: |-
    Klimaveränderung verhindern oder sich daran anpassen? Bislang liegt der Fokus auf Klimaschutz. Der Versuch, den globalen Temperaturanstieg so weit wie möglich zu begrenzen, verschlingt den Löwenanteil der Investitionen. Gleichzeitig werden die Folgen des Klimawandels immer stärker spürbar. Ist es an der Zeit, mehr in die Anpassung an die neue Klimarealität zu investieren? Wir sprechen mit dem Ökonomen Professor Bernd Hansjürgens vom Helmholtz-Zentrum für Umweltforschung über den schwierigen Spagat zwischen Vorbeugung und Anpassung.
    Außerdem: Anpassung zu Hause. Wie der heimische Garten fit für den Klimawandel gemacht werden kann.
- eventId: 658784
  start: 2026-10-24T09:05:00Z
  stop: 2026-10-24T10:35:00Z
  title: Nachtcafé
  subtitle: Komplizen
  description: 'Es gibt Menschen, die einen Blick verstehen, ohne dass viele Worte nötig sind, die bei jedem Unsinn mitmachen und auch dann bleiben, wenn es schwierig wird - und manchmal sogar kriminell. Mit ihnen können wir lachen, Abenteuer erleben und manchmal auch einfach nur schweigen. Solche Menschen sind Komplizen im Leben: Sie kennen unsere Stärken und Schwächen, unsere Träume und Fehler, und bleiben trotzdem an unserer Seite - manchmal auch bis ans Lebensende.'
