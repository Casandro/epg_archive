- eventId: 657290
  start: 2026-10-24T07:50:00Z
  stop: 2026-10-24T08:20:00Z
  title: Sehen statt Hören
  subtitle: Fernsehen in Gebärdensprache
  description: In Deutschland leben Menschen aus aller Welt, rund ein Viertel der Bevölkerung hat einen Migrationshintergrund und damit eine andere Kultur. Für eine eigene Kultur braucht es nicht unbedingt eine andere Herkunft, auch Gehörlose haben ihre Sprache, Kultur und Identität. Sehen statt Hören trifft auf drei ganz unterschiedliche Konstellationen und Menschen, die mit der Herausforderung umgehen, trotz unterschiedlicher kultureller Hintergründe, Werte und Traditionen offen und tolerant den anderen gegenüber zu sein - oder zu werden.
