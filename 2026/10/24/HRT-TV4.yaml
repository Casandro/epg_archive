  description: 'U ovotjednoj emisiji bavimo se zdravstvenom temom: nedostatkom fizikalne terapije. Je li problem nedostatak fizioterapeuta ili njihov raspored unutar zdravstvene mreže? Pacijentima, posebno našim starijima, nije važan razlog, već terapija za koju je u mnogo slučajeva važno da se odradi na vrijeme. Na probleme u sustavu nedavno su upozorili sami fizioterapetuti na skupu u Križevcima. A o ulozi fizioterapije, prevenciji i ulozi samih pacijenata u provedbi terapije razgovarat ćemo s tajnicom Udruge fizioterapeut u zajednici s Katarinom Janković.'
