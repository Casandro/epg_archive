  title: 'Charlie Luxton: domy nad Morzem Śródziemnym 1 (odc. 6)'
  description: |-
    Tytuł oryginalny: Homes by the Med
    GB, 2015
    Reżyseria: James Knight
    Kolejna odsłona programu, w którym wybitny brytyjski architekt odwiedza nadmorskie posiadłości - tym razem znajdujące się u wybrzeży Morza Śródziemnego. Charlie spotyka właścicieli wyjątkowych posiadłości, odkrywając sekrety ich budowy, historię oraz inspiracje, które kryją się za ich stworzeniem. Prowadzący przenosi widzów do świata marzeń o idealnym nadmorskim życiu - odwiedza m.in. Costa Brava, Cote d'Azur, Majorkę i Kretę.
