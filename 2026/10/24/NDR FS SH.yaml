  title: Legenden - Harry Belafonte
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    " DAY-OH". Diesen Ruf kennt die ganze Welt. Harry Belafonte hat damit Musikgeschichte geschrieben. Wer ist der Mann hinter diesem Lied? Und wie ist es dem Jungen aus Harlem gelungen, einer der größten Künstler des 20. Jahrhunderts zu werden?
    Belafonte ist Schauspieler, Sänger, Entertainer - doch seine Berufung fand er im Aktivismus. Inzwischen ist er 95 Jahre alt und hat sich aus der Öffentlichkeit zurückgezogen. Diese Filmdokumentation porträtiert Belafontes wichtigsten Stationen, lässt seine Familie, Freunde und Kollegen zu Wort kommen und zeigt die schönsten Momente seines langjährigen Bühnenlebens.
