  title: Grænzenlos - Hinter den Kulissen der "Flensborg Avis"
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Grænzenlos - Hinter den Kulissen der "Flensborg Avis" - Eine dänische Tageszeitung in Deutschland
  description: Die erste Ausgabe "Flensborg Avis" erschien am 1.Oktober 1869. Gegründet wurde die Zeitung von dänisch gesinnten Kreisen, die auch nach der Niederlage Dänemarks 1864 und der Eroberung Sønderjyllands durch Preußen die Verbindung zu Dänemark betonen wollten. Der preußischen Verwaltung war die dänischsprachige Zeitung ein Dorn im Auge. Die Grenzziehung 1920 brachte neue Probleme, da nun ein Großteil der Leserschaft nördlich der Grenze lebte. Überlegungen, den Redaktionssitz nach Dänemark zu verlegen, wurden verworfen, die "Flensborg Avis" wurde die Zeitung der dänischen Minderheit in Deutschland.
