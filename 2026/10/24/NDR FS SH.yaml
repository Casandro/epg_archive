  description: 'Die beiden Reporter Vanessa Kossen und Thilo Tautz bewegen sich zu Fuß und abseits ausgetretener Pfade durch Norddeutschland. Möglichst dicht an der Luftlinie zwischen ihren jeweiligen Startpunkten wollen sie den Norden erkunden. Die Strecke ist 100 Kilometer lang: Thilo Tautz startet in Dyksterhusen (Ostfriesland), dem sogenannten "Endje vun de Welt", Vanessa Kossen in Bremen-Gröpelingen. Konsequent laufen sie die Luftlinie entlang, ohne Geld und Zelt, immer schnurstracks geradeaus. Wie soll das funktionieren?'
