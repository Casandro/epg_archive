  title: Sehen statt Hören - Ein Wochenmagazin für Hörgeschädigte
  subtitle: Fernsehen in Gebärdensprache
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wiedersehen nach 30 Jahren: "Alice & der Aurifactor" - ein Film, der bis heute nachwirkt. Es ist ein außergewöhnlicher Kurzfilm, eine expressionistische Märchenfabel, die den Kampf der Gehörlosengemeinschaft in einer hörenden Welt untersucht. Regisseur Jörg Fockele thematisierte Ausgrenzung schon vor 30 Jahren in seinem Abschlussfilm der HFF München. Und bekam viel Aufmerksamkeit dafür. Es ist Zeit, sich an all das noch einmal zu erinnern - mit den SchauspielerInnen und MacherInnen von damals.'
