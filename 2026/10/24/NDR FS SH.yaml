  start: 2026-10-24T20:15:00Z
  stop: 2026-10-24T21:45:00Z
  title: Faszination Musicals
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Musicals in Deutschland sind seit drei Jahrzehnten Zuschauermagneten. In dieser Sendung wird die Geschichte des Musicals in Norddeutschland gezeigt und hinter die Kulissen der Szene geblickt. \n\nDarsteller*innen wie die Niederländerin Willemijn Verkaik (\"Die Eiskönigin\", \"& JULIA\"), Alexander Klaws (\"Tarzan\") oder auch Angelika Milster (\"Cats\", \"La Cage aux Folles\") sind umjubelte Stars. Bevor jedoch die Künstler*innen achtmal in der Woche auf der Bühne stehen, müssen sie drei Jahre lang durch eine sehr anstrengende Ausbildung gehen: die Stage School in Hamburg ist eine der Talentschmieden."
