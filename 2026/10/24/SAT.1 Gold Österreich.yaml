  title: Richterin Barbara Salesch
  subtitle: |-
    Woher komme ich?
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 21.10.2026, 05:40 Uhr)
  description: Durch Zufall erfährt die 16-jährige Jessica, dass sie adoptiert wurde. Nach dem langersehnten Treffen mit ihrer leiblichen Mutter wird diese kurz darauf mit einem Spaten niedergeschlagen. War Jessica so wütend und enttäuscht, weil ihre Mutter sie abgewiesen hatte, dass sie ein Verbrechen verübte?
  widescreen: true
- eventId: 918650
  start: 2026-10-24T04:34:52Z
  stop: 2026-10-24T05:28:13Z
  title: Richterin Barbara Salesch
  subtitle: |-
    747 Tage
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 21.10.2026, 06:20 Uhr)
  description: 'Als Hannah spurlos verschwindet, fällt der Verdacht sofort auf ihren Mann Jürgen. Der hat herausgefunden, dass seine angebliche Tochter Vanessa ein Kuckuckskind ist. Während die Polizei die Ermittlungen nach ein paar Monaten einstellt, sind sich Nachbarn und Freunde einig: Jürgen hat Hannah umgebracht! Als zwei Jahre später ihre Leiche gefunden wird, geht der Spießroutenlauf für Jürgen erst richtig los ...'
  widescreen: true
