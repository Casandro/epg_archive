    Durchs Raster gefallen
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Einmal gewalttätig, immer gewalttätig? Die 16-jährige Michelle ist in ihrem Viertel als Schlägerbraut bekannt. Erst vor wenigen Monaten bekam sie von Richterin Barbara Salesch eine Bewährungsstrafe, weil sie ein Mädchen verprügelt hatte. Nun soll Michelle ihren Anti-Aggressionstrainer Ralf mit einem Baseballschläger zusammengeschlagen haben ...
