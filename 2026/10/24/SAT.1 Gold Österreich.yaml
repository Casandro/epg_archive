- eventId: 918655
  start: 2026-10-24T08:22:05Z
  stop: 2026-10-24T09:15:15Z
  title: Richterin Barbara Salesch
  subtitle: |-
    So nimm denn meine Hände
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: 'Es sollte der schönste Tag in ihrem Leben werden, doch dann wird der Traum von der perfekten Hochzeit für Marie zum reinsten Alptraum. Unmittelbar nach der Trauung bricht ihr Mann zusammen, hat Krämpfe und stirbt. Er wurde vergiftet. Für die Braut steht fest, dass ihr Ex der Täter ist. Doch die Verteidigung hat jemand ganz anderen im Visier: Die Braut selbst! Wer verübte den Mord vorm Altar wirklich?'
  widescreen: true
