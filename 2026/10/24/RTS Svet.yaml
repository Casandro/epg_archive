  title: Svet. Uživo
  subtitle: Sve je teže razumeti svet koji se svakodnevno menja. Odluke koje menjaju tok istorije donose se preko noći. Savezi pucaju. Granice se pomeraju ? jedna emisija povezuje sve tačke.
  description: 'Sve je teže razumeti svet koji se svakodnevno menja. Odluke koje menjaju tok istorije donose se preko noći. Savezi pucaju. Granice se pomeraju ? jedna emisija povezuje sve tačke. Od Vašingtona do Moskve. Od Brisela i Bliskog istoka do Pekinga. Od prve linije fronta do samita svetskih lidera. Od izbora do kriza koje menjaju region i svet. Donosimo ono što je iza naslova: šta se dešava, zašto se dešava i šta to znači za nas. Kroz mape, analize, uključenja sa terena i razgovore sa ključnim sagovornicima ? vodimo vas kroz najvažnije globalne događaje. Jasna slika sveta koji se menja.'
