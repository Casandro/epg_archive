  description: Televizijski film Bora pod okupacijom bavi se manje poznatim detaljima iz života slavnog srpskog romansijera i dramatičara Borisava Stankovića za vreme austrougarske okupacije 1916-1918. godine. Pošto se vratio iz internacije, iz Dervente u Beograd, Borisav Stanković na poziv hrvatskog književnika Milana Ogrizovića urednika Beogradskih novina pristaje da piše za literarni podlistak tih okupacijskih novina kao i mnogi drugi ugledni srpski intelektualci. Ali za razliku od njih, Bora Stanković će posle rata skupo platiti ovu svoju kolaboraciju. Mada mu nikada nije suđeno zbog pisanja za Beogradske novine ovaj pisac tamnih vilajeta ljudske duše nosiće na svojim plećima mučni teret moralne osude javnosti zbog te saradnje sve do svoje smrti 1927. godine. Ova osuda išla je toliko daleko da je odrednica s njegovim imenom bilo izostavljena iz Prve Srpsko-hrvatsko-slovenačke enciklopedije koju je pripremio S. Stanojević.
