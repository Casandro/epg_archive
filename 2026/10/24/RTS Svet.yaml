  title: NTC kviz
  subtitle: 'Poslednje pripreme su u toku: topi se trema, kuju se planovi za timski rad, poliraju se strategije za igre i zato će svaki odgovor biti zlata vredan! Između zabave i želje za pobedom, takmičari će.'
  description: 'Poslednje pripreme su u toku: topi se trema, kuju se planovi za timski rad, poliraju se strategije za igre i zato će svaki odgovor biti zlata vredan! Između zabave i želje za pobedom, takmičari će težiti zlatnoj sredini, a na kraju će takmičare u zlatni obruč dovesti... Ognjen Mićović! Sa jedne strane su učenici Osnovne škole "Boško Palkovljević Pinki" iz Stare Pazove, dok drugi tim čine učenici Osnovne škole "Knez Lazar" iz Lazarevca. Tim Rumeni i Ognjen Mićović Škola naših Staropazovčana nosi ime mladog borca u Drugom svetskom ratu, koji se najviše iskazao kao kurir u Sremu, posebno po svojoj hrabrosti i snalažljivosti. Imao je rumene obraze i nadimak Pinki je dobio po engleskoj reči za ružičastu boju. Ognjen će timu dati ime po srpskoj reči za takve obraze, a to je Rumeni.'
