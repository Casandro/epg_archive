  description: Neposredno nakon predstavljanja novog studijskog albuma (dupli CD, PGP RTS), pod nazivom "Koreni i cvetovi", renomirana estradna umetnica Dragica Radosavljević Cakana održala je i veliki solistički koncert u MTS dvorani. "Dobro veče i dobro došli da zajedno zapevamo, pa i zaplačemo. Da slavimo što smo svoji, što imamo i korene i cvetove. Hvala vam još jednom i dobro mi došli.", obratila se Dragica Radosavljević Cakana publici na početku koncerta, odevena u narodnu nošnju koju je donela iz rodnog Leposavića. Tokom nesvakidašnjeg muzičkog spektakla koji je trajao duže od dva sata, uz pratnju vrhunskih muzičara Narodnog ansambla RTS-a pod vođstvom soliste na harmonici Siniše Vićentijevića, legendarna pevačica podsetila je na brojne hitove koji su obeležili njenu karijeru, koja kontinuirano i uspešno traje trideset tri godine.
