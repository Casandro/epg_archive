  description: Legenda naše muzičke scene Slavko Perović, jedan od pionira srpske televizije sa početka 60 tih godina, već 1969. godine za prodatih milion ploča dobija zlatnu ploču. U emisiji "Zlatna ploča" podsetićemo se na neke od hitova sa mnogobrojnih zlatnih ploča koje je ovaj pevač dobijao - Jedan dan života, Pesma majci, Ja pustolov, Oči pune suza, Mućo mala mućo, Sve zbog jedne crne žene. Tu je i nekoliko pesama iz antologijskih emisija Televizije Beograd Kod zlatnog konja, Od srca srcu u kojima Slavko Perović izvodi poznate pesme i stare srpske zapise poput Grivne kompozitora Davorina Jenka.
