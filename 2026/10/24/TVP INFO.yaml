  title: Perły Bałtyku 1 (odc. 3)
  subtitle: Mierzeja Helska to jeden z najbardziej zdumiewających półwyspów na świecie. Ta ogromna ściana piasku odchodzi od lądu i wbija się w głąb morza. Z lotu ptaka przypomina kosę.
  description: |-
    Tytuł oryginalny: Perły Bałtyku
    PL, 2023
    Reżyseria: Joanna Pawlikowska
    Bałtyk jest pełen tajemnic. Te najciekawsze ukrywa głęboko w swojej toni i wysoko ponad nią. To najmłodsze morze świata, które nieustannie się zmienia. W jednym milimetrze bałtyckiej wody żyje ponad 5 milionów organizmów. Bo Bałtyk, wbrew wszystkiemu - nie umiera. Życie w nim dopiero nabiera rozpędu. Dr Andrzej Kruszewicz postanawia przyjrzeć się mu z bliska. Odc. 3 Mierzeja Helska to jeden z najbardziej zdumiewających półwyspów na świecie.
