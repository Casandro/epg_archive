  description: |-
    serial dokumentalny (Polska, 2023), Półwysep Helski
    Prowadzą: Andrzej Kruszewicz
    Mierzeja Helska to jeden z najbardziej zdumiewających półwyspów na świecie. Ta ogromna ściana piasku odchodzi od lądu i wbija się w głąb morza. Z lotu ptaka przypomina kosę. Oddziela ona wzburzony Bałtyk od Zatoki Gdańskiej i spokojnej Zatoki Puckiej.
    Reżyser: Joanna Pawlikowska, Joanna Pawlikowska
    Od lat: 7
