  title: 3 op reis
  subtitle: Molukken, Seram & Kei-eilanden S20 E08. Sahil reist via Seram naar de Kei-eilanden. Onderweg ziet hij hoe bewoners al generaties met de natuur samenleven en hoe de Sasi-traditie de eilanden helpt beschermen.
  description: Sahil vervolgt zijn reis op Maluku op het moedereiland Seram. Hier trekt hij het regenwoud in en duikt hij de onderwaterwereld in, terwijl hij leert hoe mensen al generaties lang samenleven met de natuur. Via het eiland Haruku reist hij verder naar de Kei-eilanden. Hier maakt hij kennis met de Sasi-traditie en leert hij hoe die helpt de eilandengroep te beschermen tegen groeiende druk van buitenaf. (2026)
