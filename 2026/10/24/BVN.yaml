  title: Kassa
  subtitle: S41 E24. Consumentenprogramma met relevante, actuele en creatieve reportages, spannende confrontaties en handige tests. Kassa geeft niet op als het moeilijk wordt, graaft dieper en legt ingewikkelde zaken eenvoudig uit.
  description: De woningmarkt is al langer onderwerp van gesprek, maar problemen grijpen langzaam maar zeker verder omhoog in de samenleving en de vanzelfsprekendheid van een dak boven je hoofd lijkt steeds meer onder druk te staan. Verder duiken we dieper in de privacygevoeligheid van je auto, ligt er een peperdure brug in een weiland die nooit geplaatst is en vindt Max de kleinste vlek op de grootste bank in de Belbus. (2026)
  genre:
  - '32'
