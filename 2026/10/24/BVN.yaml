  description: 'We volgen drie emigratieverhalen. Romano vertrekt met zijn partner Francisco naar Suriname, een land waar hij nooit dacht te gaan wonen. Dennis reist naar Ghana om als provinciaal koning in de voetsporen te treden van zijn overleden vader, maar ontdekt al snel de grote verantwoordelijkheden van die rol. Ondertussen zeggen Rany en Kevin hun leven in Amsterdam vaarwel voor een nieuw bestaan op Bali. Terwijl de voorbereidingen en afscheidsmomenten doorgaan, blijft de spanning hoog: hun werkvisum is nog altijd niet rond. (2026)'
