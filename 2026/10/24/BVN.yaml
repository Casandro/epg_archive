  title: Vroege vogels
  subtitle: Nijmegen S23 E19. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: In Nijmegen leven mens en natuur op verrassende manieren samen. Zo herbergt de Lentloper, de bekende brug over de Spiegelwaal, de grootste huiszwaluwenkolonie van Nederland. Op een voormalig fabrieksterrein mag de natuur volledig haar eigen gang gaan. In een lokaal hondenuitlaatgebied bloeit de zeer zeldzame wilde averuit en de rust van een oude begraafplaats blijkt een waar walhalla voor talloze unieke paddenstoelen. Toch schuurt die nabijheid tussen mens en dier soms ook. In het Goffertpark verstoren zonnebaarzen, uitgezet door mensen, het leven van kikkers en padden. En zorgen beverfamilies voor de nodige overlast en schade aan huizen. (2026)
  genre:
  - '146'
- eventId: 1021697
