  title: Svět zvířat
  description: S kukačkami a fotoaparátem za tajemstvím přírody. Hostem Světa zvířat dnes bude fotograf a ornitolog Tomáš Grim. Dozvíme se, jak vzniká snímky, který oslnili poroty v národních i mezinárodních fotografických soutěžích. Proč se divoká příroda čím dál častěji stěhuje přímo do našich měst. A čím je zajimavá kukačka. Moderuje Slávka Brádlová.
