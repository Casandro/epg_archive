  title: Hobby magazín
  description: Kolegyně Jitka Slezáková se vypravila do sadů v okolí Svinčan na Pardubicku. Zjišťovala, jaké následky zanechalo letošní sucho na úrodě. Myslivecké spolky na Vysočině na začátku října vykupovali čelisti divočáků. Kraj tak monitoruje počet odstřelené přemnožené zvěře i případné nákazy. Jaké čelisti a v jakém stavu odevzdat? Budeme i toho. S Jirkou Šobrem se zaměříme na zazimování bazénů. Kdy se vyplatí vodu vypustit, kdy naopak nechat. Jak zazimovat, čím, kde uschovat filtraci atd. Přikrýt nebo nechat jen tak? Na tyto a další otázky pro vás hledal odpověď.
