  title: Das Wochenende
  subtitle: mit Anja Kwijas und Ariane Wirth und Michelle Brückner  und Severino Melchiorre
  description: "So klingt Wochenende: Alle Tore, Werder Bremen pur, mehr Regionalsport und alles was am Wochenende sonst noch wichtig ist.\n\nWir bleiben für Sie an Werder Bremen dran: Bremen Eins berichtet live aus der Fußball-Bundesliga und überträgt wie gewohnt die legendäre Schlusskonferenz der ersten Liga. \n \nDazu gibt es mehr Sport aus der Region und alles was für Ihr Wochenende in Bremen und Nordwest-Niedersachsen wichtig ist."
