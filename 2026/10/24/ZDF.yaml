  description: |-
    Deutschland 2018
    Unfassbar, aber wahr: Hier wird der Eiffelturm verkauft, dort scheffelt ein Goldmacher Millionen, und ein schottischer Lord verkauft eine Kolonie, die es nicht gibt. Der große Bluff!

    Gibt es ein Geheimnis des Meisterbetrugs? Warum fallen wir immer wieder auf die Blender herein? "Terra X" erzählt die Geschichten der großen Verführer und erforscht die Regeln, die ihre grandiosen Schwindeleien immer wieder zum Erfolg machen.
