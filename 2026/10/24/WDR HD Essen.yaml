  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In den Lach- und Sachgeschichten wird heute fleißig gemalt. Tanja und André basteln sich Stempel aus Kartoffeln und drucken damit. Ilvy und Ferris malen zusammen lustige Bilder. Auch Charlie, Lola und ihre Freunde zeichnen und basteln: Als Hausaufgabe soll jedes Kind sein Haus abbilden. David zeigt der Puppe Red, wie man ein Bild auf eine Scheibe malt, und dann malt Red. Und zum Mitraten gibt es heute wieder ein spannendes Bilderrätsel.'
