  title: Kochen mit Martina und Moritz
  subtitle: Schmorbraten aus Burgund - Zartes Fleisch in viel würziger Sauce
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: 'Herbst und Winter sind die idealen Jahreszeiten für Schmorgerichte aller Art. Die WDR-Fernsehköche Martina und Moritz haben sich dafür in einer Region Frankreichs umgeschaut, die berühmt für ihre Weine ist und gleichzeitig aber auch für ihre großartige, herzhafte, bodenständige Küche: im Burgund. Hier gedeihen die begehrtesten Weine der Welt. Kein Wunder, dass auch die Küche dazu passt. Und so servieren die beiden butterzart geschmorte Ochsenbacken in Rotwein, Kaninchen in Weißwein und Kalbfleisch in Zitronensauce. Und dazu passt jeweils ein Gratin aus zweierlei Äpfeln.'
