  description: 'Autor: Alena Rubášová, Natálie Feitová; Interpret: Jana Rambousková; Premiéra: 20.10.2026 * Tentokrát si do Barvínku Alča a Naty pozvaly kolegyni Janu Rambouskovou, aby popovídala o svých zkušenostech s koncertováním na zaoceánských lodích. Slyšíte dobře - lodích! Jak se k tomu Jana dostala? Jak to na lodi chodí? Jací jsou cestující posluchači? A v které zemi se Janě líbilo nejvíc? To vše uslyšíte v premiéře v úterý 20. října od 17.10 a v repríze v sobotu 24. října od 11 hodin. '
