- eventId: 856288
  start: 2026-10-24T18:15:00Z
  stop: 2026-10-24T19:00:00Z
  title: ChariTALK
  description: 'Autor: Charita ČR; Interpret: Tereza Pospíšilová, Nataša Diatková, Jannis Moras * Dobrovolnictví může mít mnoho podob a často se mu věnujeme, aniž bychom si to vůbec uvědomovali. Podle výzkumů Češi loni jako dobrovolníci odpracovali asi 95?000 plných úvazků v?hodnotě 34 miliard korun bez nároku na odměnu. Rok 2026 je Mezinárodním rokem dobrovolnictví a při této příležitosti vzniká ve spolupráci podcastu ChariTALK s platformou Young Caritas nová podcastová série, která má za cíl bořit stereotypy o dobrovolnictví a ukázat, že může mít mnoho podob. Jak vlastně dobrovolnictví definovat, proč pomoc rodině a blízkým vnímáme jinak než veřejně prospěšnou činnost a kdo se do dobrovolnictví zapojuje nejčastěji? O tom spolu s?moderátorem Janisem Morasem diskutují socioložka Tereza Pospíšilová a Nataša Diatková, ředitelka HESTIA ? Centra pro dobrovolnictví.'
  subtitle: Dobrovolnictví a oceňování jeho přínosu je základem zdravé společnosti
