  description: 'Autor a interpret: Helena Bretfeldová * Folklorní sedmička na Proglasu je jedinou hitparádou lidových písní na rozhlasových vlnách Čech, Moravy a Slovenska. Nabízí sedm písniček z českých, moravských a slezských folklorních regionů. Do dalšího kola postupují nejméně tři písně podle výsledků hlasování posluchačů. Zpěvák a kapela, kteří návazně se třemi písněmi postoupí do dalšího kola (tedy zazní celkem devětkrát), získává ocenění Zlatý výběr Folklorní sedmičky.'
