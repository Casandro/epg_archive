  subtitle: Džbánek pohádek - Čertův mlýn (3. díl)
  description: 'Autor: Zuzana Nováková; Interpret: Adriana Růžičková, Magda Hauserová; Premiéra: 21.4.1997 * Nejhorší je, že čerta hned tak nepoznáš, nechodí po světě chlupatý s kopytem, ale potkáš spíš krásného myslivce. Jeden takový chce získat děvče Kateřinu. Má kvůli tomu postavit do tří dnů větrný mlýn, už už se mu to daří, kéž by tak zakokrhal kohout ,aby byla Kateřinka zachráněná!'
