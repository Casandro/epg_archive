  title: Knihovnička
  subtitle: Země česká, domov můj
  description: 'ižkou Země česká, domov můj si to rádi připomenou nejen děti každého věku.Co v knížce, jejímž autorem je David Karakevas, najdete: ?    ilustrovaný příběh Česka ?    klíčové události historie, osobnosti, unikáty ?    celkem přes 700 obrázků s texty ?    až 142 stránek plných zajímavostí.Vydalo Česko v obrazech v roce 2021 jako první vydání, vyšlo již 4. vydání.Další dílo, jež oslavuje českou zemi, nám  představí Jiří Martínek z Historického ústavu AV ČR. Rozhovor o 26. svazku Biografického slovníku českých zemí a o knize pro děti ke 100. výročí republiky, jsme s ním natočili na 33. knižním veletrhu v Havlíčkově Brodě na začátku října roku 2023.A také budeme soutěžit o výše zmíněnou hodnotnou knihu Země česká domov můj.'
- eventId: 856275
  start: 2026-10-24T11:45:00Z
  stop: 2026-10-24T12:00:00Z
  title: Filmana Talks
  description: 'Filmana je nezisková křesťanská streamovací platforma, která od roku 2023 působí v Česku a na Slovensku. Nabízíme bohatý výběr duchovních filmů, seriálů, dokumentů i pořadů pro děti. V jejím katalogu najdete klasické filmy o svatých, snímky inspirované skutečnými událostmi i tituly, které vás přimějí k hlubšímu zamyšlení. Každý měsíc přibývá nový obsah, který můžete sledovat kdykoliv a kdekoliv ? zcela bez reklam. Část obsahu je po registraci zdarma, zatímco kompletní katalog je dostupný prostřednictvím předplatného. Předplatné umožňuje projektu dále růst a rozvíjet se. Kromě toho Filmana produkuje i originální pořady, které jsou v souladu s jejím hlavním posláním ? šířit křesťanské hodnoty skrze filmovou tvorbu. Produkci Filmany nyní představujeme i na Proglasu v rámci nového cyklu Filmana Talks vždy v sobotu v 13.45. '
  subtitle: Speciál ? Pavel Helan
