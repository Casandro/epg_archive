    Hochmoderne wissenschaftliche Missionen führen zurück an den Anfang: 13,8 Milliarden Jahre in die Vergangenheit, zum Ursprung des Universums. Weltraumteleskope wie Hubble und Planck helfen, den Moment des Urknalls zu bestimmen und die Geschichte des Kosmos zu erzählen.
