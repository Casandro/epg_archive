  title: 'FeatureZeit: Staatsgeheimnis 9/11 '
  subtitle: Die Saudi-Connection (Folgen 4+5)
  description: '25 Jahre nach den Terroranschlägen vom 11. September 2001 wirft eine investigative Podcast-Serie ein neues Licht auf eine der umstrittensten Fragen der jüngeren Geschichte: Welche Rolle spielte Saudi-Arabien? In der fünfteiligen Serie "Staatsgeheimnis 9/11" folgt WDR-Journalist Nikolaus Steiner der Spur eines Mannes, der nach den Anschlägen im Zentrum internationaler Ermittlungen steht: der saudische Staatsbürger Omar Al-Bayoumi. Für die einen ist er ein normaler Student. Für andere ist er ein Geheimdienstagent, der den Auftrag hatte, zwei der späteren Attentäter zu unterstützen. Al-Bayoumi bestreitet das.15 der 19 Attentäter vom 11. September kommen aus Saudi-Arabien. Ebenso wie der Al-Qaida-Führer Osama bin Laden. Saudi-Arabien ist damals neben Israel der wichtigste Verbündete der USA im Nahen Osten: Öllieferant, Militärstützpunkt, Waffenkäufer und Pulsader für die Energieversorgung und den Welthandel. Haben die saudische Regierung oder Teile der Regierung möglicherweise im Vorfeld von den Anschlagsplänen gewusst? Kam von dort möglicherweise die Anweisung, einige der Attentäter zu unterstützen? Vorwürfe, die die saudische Regierung seit Jahren zurückweist. Aktuell läuft deshalb ein juristisches Verfahren in New York: Hunderte Angehörige von Opfern der Terroranschläge fordern mehrere Milliarden Dollar Schadenersatz von der saudischen Regierung. Ein Bezirksgericht hat der Zivilklage grünes Licht gegeben. Saudi-Arabien hat dagegen Berufung eingelegt.'
