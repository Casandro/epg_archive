  title: 'Die Reportage: Netanjahus Vermächtnis'
  subtitle: Ein zerrissenes Land vor der Wahl
  description: 'In den vier Jahren seit der letzten Parlamentswahl war Israel ein Land im Ausnahmezustand. Anteil daran hatten zuerst die Pläne der in Teilen rechtsextremen Regierung unter Benjamin Netanjahu für eine Justizreform, gegen die Hunderttausende auf die Straße gegangen sind. Dann kam der 7. Oktober 2023, der Terrorangriff aus dem Gazastreifen, der das Sicherheitsgefühl vieler Menschen in Israel nachhaltig zerstört hat. Und es kamen die anschließenden Kriege im Gazastreifen, im Libanon gegen den Iran. Wegen seiner Kriegführung und wegen der Gewalt im besetzten Westjordanland durch Siedlerterroristen und Sicherheitskräfte gegen Palästinenser gilt Israel international inzwischen als weitgehend isoliert.  Und nun wird wieder gewähltam 27.10.: Wie steht Israel da, nach den vier Jahren? Was beschäftigt die Menschen, was wird ihre Wahlentscheidungen beeinflussen? Gibt es Hoffnung, vielleicht sogar die Chance auf Heilung und Frieden?'
