  description: "seit 17:30\nAktuelles & Sport\n\n18:30 \nKultur - \"Ich singe um mein Leben\" - Reinhard Mey im neuen Porträt\nReinhard Mey ist DER deutsche Liedermacher, seit über 60 Jahren. Mit Hits wie \"Über den Wolken\", \"Gute Nacht, Freunde\" oder \"Nein, meine Söhne geb'  ich nicht\". Vor kurzem ist Reinhard Meys 30. Studioalbum \"Schatzhauser\" erschienen und hat ihn aus dem Stand auf Platz 1 der Deutschen Albumcharts katapultiert. Fast zeitgleich ist ein neues Buch über den Berliner Musiker erschienen: >\"Ich singe um mein Leben\". Reinhard Mey - ein Porträt<. Dafür stand der Literaturwissenschaftler, Lektor und Autor Oliver Kobold über vier Jahre hinweg mit Reinhard im Austausch. Warm und berührend erzählt Kobold hier die Geschichten hinter den Liedern. So entsteht ein vielschichtiges Bild des Musikers und Menschen Reinhard Mey.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n19:00 \nDer Tag- \nEin Thema, viele Perspektiven\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-tag-ein-thema-viele-perspektiven/urn:ard:show:cd24ec031ec87a00/"
