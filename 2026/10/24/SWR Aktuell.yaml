  description: "12:00\nAktuelles & Sport\n\n12:30     \nSWR Kultur Das Wissen\nAufmerksamkeit lernen - Wie wir uns besser konzentrieren können\nSmartphone, Social Media und Benachrichtigungen konkurrieren permanent um unsere Aufmerksamkeit. Doch verkümmert dadurch unsere Konzentrationsfähigkeit? Und wie können wir die sinnvoll trainieren? \nNadine Zeller spricht mit dem Neurobiologen Prof. Martin Korte von der TU Braunschweig (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n13:00 \nARD Interview der Woche ~ \nBianca Schwarz im Gespräch mit Ines Schwerdtner, Parteivorsitzende Die Linke \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nMAFIA LAND \nDie Codes der Mafia 2 (4/8)\nWie funktioniert eigentlich das System 'Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n14:30 \nMariniæ's FREIHEIT\nKI-IIing me softly feat. Katharina Zweig\nIn dieser Woche möchte ich mit euch über ein Thema sprechen, über das gefühlt alle reden - und über das trotzdem viel zu wenig geredet wird: Künstliche Intelligenz.\nZum Nachhören:\nhttps://www.ardsounds.de/sendung/freiheit-deluxe-mit-jagoda-marinic/urn:ard:show:5fda9cb937c63786/"
