  title: Corso - Kunst & Pop
  description: "Hip-Hop als Stilsport - Neues von Shabazz Palaces\nSeit mehr als 35 Jahren lotet Ishmael Butler die Grenzen des Hip-Hop aus, erst mit Digable Planets, später als Shabazz Palaces. Auf seinem neuen Album ?It's a Style Sport? kehrt er zum spielerischen Wettstreit des frühen Rap zurück. \nIshmael Butler im Corsogespräch mit Mike Herbstreuth\n\nFür immer Frühling? SOFFIE und die Kunst der Hoffnung\nMit ?Für immer Frühling? lieferte SOFFIE 2024 den Soundtrack für zahlreiche Demonstrationen gegen rechts. Auf ihrem Debütalbum verbindet sie politische Haltung mit tanzbarem Indie-Pop, Selbstironie und Fragen der Selbstfindung. Wie viel Leichtigkeit verträgt eine Gegenwart, die oft wenig Anlass zur Hoffnung gibt?\nSOFFIE im Corsogespräch mit Mike Herbstreuth\n\nFolk mit Sonderzeichen: @ und ?Autosmile?\nDas Duo @ aus Philadelphia macht Musik, die sich ebenso schwer kategorisieren lässt wie sein Bandname googeln. Auf seinem zweiten Album ?Autosmile? verbinden Victoria Rose und Stone Filipczak akustischen Folk mit experimentellen Klangideen. Ein intimer musikalischer Dialog zwischen zwei Gitarren und zwei Stimmen.\n\nAm Mikrofon: Mike Herbstreuth"
