  title: 'Recht konkret: Kaufen und Reklamieren'
  description: 'Was tun, wenn nach dem Kauf plötzlich Probleme auftreten? Ob Gebrauchtwagen, Online-Shopping oder Leasing: Moderatorin Larissa Rausch zeigt, welche Rechte Konsumentinnen und Konsumenten haben und wo typische Fallstricke lauern. Außerdem geht es um den Unterschied zwischen Gewährleistung und Garantie, die Kündigung eines Bankkontos und die Risiken einer Bürgschaft. Ein Überblick über wichtige Rechte rund ums Kaufen, Bezahlen und Reklamieren.'
