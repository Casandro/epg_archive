  title: 'betrifft: uns - Reportagen ohne Filter'
  subtitle: 'Taxis: Wer sind die Menschen hinter dem Steuer?'
  genre:
  - '35'
  description: 'Etwa 4.500 Taxis sind täglich in Wien unterwegs. Wenn gerade kein Wagen in Sicht ist, reicht ein Griff zum Handy: Über App oder Funkzentrale ist ein Taxi in wenigen Minuten vor Ort. Doch wer sind die Menschen, die Tag und Nacht hinter dem Steuer sitzen? Die Mehrheit der Taxilenkerinnen und Taxilenker hat eine Migrationsbiografie. Für viele war das Taxifahren nie ein Traumberuf, oft nur eine Übergangslösung. Und doch bleiben sie - trotz langer, unregelmäßiger Arbeitszeiten, hohen Konkurrenzdrucks und geringer Wertschätzung in der Branche.'
