- eventId: 870636
  start: 2026-10-24T16:00:00Z
  stop: 2026-10-24T16:50:00Z
  title: Bürgeranwalt
  genre:
  - '130'
  description: "- Kein Dienstzeugnis: Herr. W. war über 15 Jahre lang bei der Wiener Polizei beschäftigt. Zuletzt bei der Diensthundestaffel als Landesausbildungsleiterstellvertreter. Im Oktober 2023 hat er seinen Dienst bei der Polizei quittiert und sich selbständig gemacht. Nun würde Herr W. für seine Zeit bei der Hundestaffel als stellvertretender Ausbildungsleiter eine Bestätigung benötigen. Doch diese wird ihm von der Wiener Polizei verweigert, weil sie angeblich nur vorübergehend gewesen sei. \n- E-Scooter: Herr. P hat sich im Sommer vor zwei Jahren bei der Volksanwaltschaft beschwert. Der Grund - ein unsachgemäß abgestellter E-Scooter hat den Gehsteig vor seinem Haus verstellt, und ihm sei es nicht möglich gewesen, mit der Verleihfirma diesbezüglich in Kontakt zu treten. \n- Schwerst verletzt bei Autounfall - Zu wenig Schadenersatz? Ein Jus-Student wird 2017 als Beifahrer bei einem Verkehrsunfall schwerst verletzt und ist seither auf Pflege und Betreuung angewiesen. Die Haftpflichtversicherung des Unfallfahrzeughalters erkennt Ihre Einstandspflicht 2019 in einem prätorischen Vergleich zu 75 % an. Jedoch fließe seit Jahren praktisch kein Geld mehr, so die verzweifelte Mutter, die die Erwachsenenvertreterin ihres mittlerweile 33-jährigen Sohnes ist, und sechsstellige Beträge stemmen muss.  \n- Land Tirol zieht erhöhte Familienbeihilfe ein:  In Tirol sind viele Menschen mit Behinderungen, die in einem Pflegeheim leben, finanziell schlechter gestellt als in den anderen Bundesländern. Das Land Tirol zahlt die erhöhte Familienbeihilfe nicht an die Bezieher:innen aus, denen dieses Geld für erhöhte Aufwendungen zugesprochen wurde."
