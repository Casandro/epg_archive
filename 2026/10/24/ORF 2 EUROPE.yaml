  title: Erlebnis Österreich
  subtitle: Wenn der Brunnen versiegt - Die Grenzen unserer Wasserressource
  description: Unser Land gilt bisher als wasserreich - mit seinen Alpen und ihren Gletschern. Doch unter der grünen Oberfläche Oberösterreichs zeigen sich besorgniserregende Entwicklungen. Das Bundesland gehört zu den am stärksten betroffenen Regionen beim Absinken der Grundwasserstände. Frühling und Sommer 2026 zählen bislang zu den trockensten Perioden seit Beginn der Wetteraufzeichnungen. An 46 Prozent der Messstellen erreichte das Grundwasser Ende Mai den tiefsten jemals gemessenen Stand. Mehr als 90.000 Hausbrunnen und Quellen versorgen Landwirtschaft und Haushalte - doch immer mehr von ihnen fallen trocken. Die Dokumentation begleitet den Milchbauern Josef Strasser, dessen Brunnen seinen 30 Kühen kein Wasser mehr liefert, sowie den Brunnengraber Rainer Fraueneder, einen der wenigen Handwerker dieses Fachs in Österreich. Expertinnen und Experten aus Hydrologie und Wasserwirtschaft ordnen ein, was der Klimawandel für Österreichs wichtigste Ressource bedeutet.
