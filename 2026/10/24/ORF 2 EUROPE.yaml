  subtitle: Die Faust
  description: |-
    (Fernsehkrimi, AUT 2017)
    Eine Leiche, die öffentlich spektakulär zur Schau gestellt wird, und eine auffällige Tätowierung stellen Moritz Eisner und Bibi Fellner vor ein Rätsel. Denn der Tote kann nicht identifiziert werden. Den Ermittlern wird sehr bald klar: Um den Täter zu finden, gibt es nur einen möglichen Weg: Sie müssen zuerst klären, wer eigentlich das Opfer ist. Doch noch während unter Hochdruck nach der Identität des Toten geforscht wird, passiert ein weiterer Mord.
    Mit Harald Krassnitzer (Moritz Eisner), Adele Neuhauser (Bibi Fellner), Hubert Kramar (Ernst Rauter), Thomas Stipsits (Manfred Schimpf), Misel Maticevic (Nenad Ljubic), Larissa Fuchs (Nalo/Nataliya Lomatschenka), Dominik Maringer (Clemens Steinwendtner), Sebastian Pass (Davit Nosadse), Faris Rahoma (Dusan Savic), Günter Franzmeier (Prof. Kreindl), Gisela Salcher (Karin Ladstätter), Erika Mottl (Henriette Cerwenka), Paul Matic (Simon Rohrbacher), Ernst Konarek (Constantin Montag) u.a.
    Buch: Mischa Zickler
    Regie: Christopher Schier
