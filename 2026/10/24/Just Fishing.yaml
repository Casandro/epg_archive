  title: Norwegen - Angelabenteuer am Polarkreis
  subtitle: Norwegen - Angelabenteuer am Polarkreis
  description: Der Ort Finnkroken ist nur zwei Bootsstunden von Tromsö entfernt und bietet so ziemlich alles, was sich ein Anglerherz so wünscht. Peter Wahl erlebte zusammen mit seinen Freunden das Reiseziel am Polarkreis bei fast schon tropischen Temperaturen und karibischen Flair. Riesige Dorsche, Köhler, Steinbeißer & Heilbutte bescherten ihm und seinen Freunden ganz nebenbei dazu noch aufregende Drills. DE 2018
- eventId: 974383
  start: 2026-10-24T21:15:00Z
  stop: 2026-10-24T22:10:00Z
  title: Auf Sindbads Spuren - große Gelbflossenthune im Oman
  subtitle: Auf Sindbads Spuren - große Gelbflossenthune im Oman
  description: Die Redaktion des Global Angler Magazins reiste Anfang 2019 nach Salalah in den Süden des Omans um ihr Glück auf große Gelbflossenthune zu erleben. Neben einer wirklich traumhaften Fischerei erlebten sie auch noch einen wunderschönen Urlaub in diesem noch nicht vom Tourismus überlaufenen Land. Ihrer Meinung nach kann man noch von einem Geheimtipp sprechen. DE 2019
