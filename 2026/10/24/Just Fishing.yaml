  subtitle: Doggy Island 3.0
  description: Diese Expedition war alles andere als einfach. Krankheit, Unfälle und schlechtes Wetter machten es den Teilnehmern nicht leicht. Aber die Jungs zogen durch und am Ende konnte sie doch noch ein paar tolle Doggies, GTs und andere Fischarten auf die Popper und Jigs fangen! ID 2023
- eventId: 1000586
  start: 2026-10-24T05:00:00Z
  stop: 2026-10-24T05:15:00Z
  title: Angeln am Forellensee
  subtitle: Angeln am Forellensee
  description: Hochsommer am Forellensee, keine einfache Zeit. Doch Timo Keibel und Elmar Elfers erwischten einen top Tag im Juli. Die beiden Angler besuchten eine Kiesgrube bei Lemwerder. Die niedersächsische Anlage ist immer einen Besuch wert, wenn Regenbogenforellen Zielfisch sind. Das glasklare und tiefe Gewässer ist sehr gut besetzt. Wie an anderen Tag auch, zogen die Forellen in kleinen Schwärmen ihre Kreise. Meist 10 bis 15 Fische. Angeln auf Sicht macht besonders viel Spaß. Timo setzte von Anfang an auf einen kleinen schwarzen Spinner in Größe 2 und konnte damit immer wieder Fische an den Haken locken. Elmar angelte hauptsächlich mit einer Schleppposenmontage und Naturködern. Nicht ganz so viele Forellen wie Timo entlockte er dem hübschen See. An der Tabellenspitze der quirligen Happen standen auch diesmal Bienenmaden. In L-Form zog er die beliebten Köder auf den vierer Haken. Beim Einholen rotieren die Naturköder um die eigene Achse und locken die Regenbogenforellen aus der Reserve. Nebenbei warfen die beiden Forellenangler noch jeder eine Montage mit schwimmendem Sbiro und Pilotkugeln aus. Mehlwürmer und Forellenteig in Braun oder Chartreuse sowie Bienenmaden trieben aufgrund leichten Windes übers Wasser. Dank der schwimmenden Pilotkugeln konnten sie die Tiefe der angebotenen Köder ganz einfach anpassen. Es stellte sich heraus, dass die Fische in 20  bis 30 Zentimetern Tiefe den Köder nahmen. Neben den Portionsforellen zwischen 300 und 500 Gramm schwimmen auch große Exemplare in der Kiesgrube. Elmar erwischte eine davon, die ordentlich Gas im Drill gab. Immer wieder zog sie einige Meter Schnur von der Rolle. Leider blieb Elmar zweiter Sieger. Nach einigen Minuten schlitzte sie aus. Vielleicht beißt sie ja das nächste Mal. Denn die beiden werden sicher im Herbst erneut ihre Köder auf Regenbogenforellen auswerfen. DE 2023
- eventId: 1000587
  start: 2026-10-24T05:20:00Z
  stop: 2026-10-24T05:37:00Z
  title: Zanderangeln im Fluss mit dem Gummifisch
  subtitle: Zanderangeln im Fluss mit dem Gummifisch
  description: John Chowns, Henne Skipper und Dominik Fastabend möchten mit dem Gummifisch Zander aus dem Fluss überlisten. Sie erklären die Techniken und nebenbei fangen sie auch noch ordentlich Fische. NL 2023
- eventId: 1000588
  start: 2026-10-24T05:40:00Z
  stop: 2026-10-24T05:50:00Z
  title: Norwegen Midnight Popping Madness
  subtitle: Norwegen Midnight Popping Madness
  description: 'Wenn Angler an Norwegen denken, geht es meistens ums Pilken oder Gummifischangeln. Was viele aber nicht wissen: Dass gerade Seelachse und Pollacks oft auch sehr nah an der Oberfläche rauben. Bereits beim ersten Versuch, diese auf Popper und Co. zu fangen, fliegen diese aggressiven Räuber durch die Lüfte und attackieren unsere Köder brutalst. Ausnahmezustand an Bord! NO 2023'
- eventId: 1000589
  start: 2026-10-24T05:50:00Z
  stop: 2026-10-24T06:02:00Z
  title: Speedpilken auf Seelachse in Norwegen
  subtitle: Speedpilken auf Seelachse in Norwegen
  description: Bevor es zur abendlichen Poppersession geht, sind wir auf der Suche nach Seelachsschwärmen, um diese mit unseren Pilkern zu beangeln. Sind die Fische erst mal lokalisiert, geht es Schlag auf Schlag. Mehrfachdrills mit diesen kampfstarken Meeresräubern, kreischende Bremsen und jede Menge Drillspaß sind vorprogrammiert. Die verwendete Angeltechnik, das Speedpilken ist an und für sich relativ einfach. Die Köder werden einfach am Boot heruntergelassen, bis sie sich unterhalb der Sicheln auf dem Echolot befinden. Bügel zu und schnell durch die Wassersäule gekurbelt bleiben sie dabei selten unentdeckt. NO 2023
- eventId: 974337
  start: 2026-10-24T06:05:00Z
  stop: 2026-10-24T06:33:00Z
  title: 'Angeln in Norwegen: Traumhafte Lofoten'
  subtitle: 'Angeln in Norwegen: Traumhafte Lofoten'
  description: Die Lofoten sind ein Traumrevier für Meeresangler. Die Inselkette begeistert mit einer atemberaubenden Landschaft und Natur. Außerdem finden Norwegen Angler ein sehr fischreiches Revier. Heilbutt, Dorsch, Köhler, Pollack, Rotbarsch und große Plattfische wie Schollen oder Klieschen lassen sich gut im Revier fangen. Jan Schilling und Timo Keibel besuchten das Angel Camp Lofoten Havfiske und befischten das traumhafte Angelrevier vor den Lofoten. NO 2023
