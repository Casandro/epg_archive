  title: Abgründe - Unfassbare Verbrechen
  subtitle: Das Urteil
  description: "Als sich Casey Anthony ein Tattoo mit dem Schriftzug \"Bella Vita\", zu Deutsch \"schönes Leben\", stechen lässt, weiß sie bereits seit Tagen, dass ihre 2-jährige Tochter Caylee tot ist. Der Casey-Anthony-Prozess, der in Orlando, Florida, stattfand, ist die Geschichte eines Kindes, das einen tragischen Tod starb, und einer Mutter, die ein dunkles Geheimnis in einem Netz aus Lügen verbarg. Doch es ist auch die Geschichte einer aufgebrachten Nation und eines Urteils, das Amerika erschütterte. Hat Casey, die als feierfreudiges Partygirl bekannt war, ihre eigene kleine Tochter umgebracht, oder wird sie dieses grausamen Verbrechens zu Unrecht beschuldigt?  \nDEU 2019"
  widescreen: true
- eventId: 983726
