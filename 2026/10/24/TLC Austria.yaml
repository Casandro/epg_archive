  stop: 2026-10-24T18:15:00Z
  title: Abgründe - Unfassbare Verbrechen
  subtitle: Verschleppt
  description: "Als sich Kenia Monge mit zwei Freunden am 31. März 2011 ins Nachtleben von Aurora, Colorado, stürzt, denkt keiner daran, dass es Kenias letzte Nacht sein könnte. Nach ein paar feuchtfröhlichen Stunden wird die 19-Jährige von den anderen getrennt. Zurück bleiben ihre Handtasche, ihr Handy und ihr Autoschlüssel. Da das Mädchen an den folgenden Tagen nicht auftaucht, startet die Polizei die Ermittlungen: Kurz vor ihrem Verschwinden wurde Kenia zusammen mit einem Kerl sturzbetrunken aus dem Club geworfen. Der junge Mann namens Travis ist höchst verdächtig, doch es fehlen handfeste Beweise. Und so beginnt ein Katz-und-Maus-Spiel mit ungewissem Ausgang.  \nDEU 2019"
  widescreen: true
