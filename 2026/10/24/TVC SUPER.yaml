    FR, 2015
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Do grupy komisarz Renoir dołącza nowa postać. Brygadier, o którym mowa, jest równie oryginalny, co dowódca. Czy metody Candice zaskoczą go? Na odpowiedź nie trzeba długo czekać, gdyż zgłoszono właśnie morderstwo. Śledczy i jego akolita badają substancję, która pokrywa ciało ofiary. Jadalne malowidło naprowadza ich na trop nielegalnego żłobka i matki cierpiącej na depresję poporodową. W domu Candice też nie ma łatwo.
