  title: Písničky z cizí kapsy
  description: Diskografie Jitky Zelenkové není tak objemná, jak by mohla být, kdyby coby back-vokalistka nekryla záda Karlu Gottovi a více se věnovala sólové kariéře. Na druhou stranu, dlouhodobý dotyk s maximální profesionalitou, jež kolem zlatého slavíka panovala, jistě také měl svou hodnotu. Přesto se Zelenkové během let jaksi bokem podařilo nazpívat několik písniček, co unesou označení hit. A ve zralejších letech si splnila i sen s nahrávkami inklinujícími k pop-jazzu. Sem také patří její verze písničky Šťastné staré slunce navazující na předešlé české pokusy Hany Hegerové a dalších popasovat se s působivou melodií i textem vzniklým v dávných poválečných časech. Tehdy (samozřejmě v originálu nazvaném That Lucky Old Sun) je poprvé - a velmi úspěšně - představil světu americký zpěvák a herec Frankie Laine. A jen potvrdil, že se na jeho ocelové hlasivky nesnášely komplimenty jen tak pro nic za nic. K poslechu zve Martin Schuster.
