  title: Planet Weltweit - Italien, eine neue Glocke für Monopoli
  subtitle: Planet Weltweit - Italien, eine neue Glocke für Monopoli
  description: Glocken sind seit jeher aus christlichen Kirchen nicht weg zu denken. Im süditalienischen Agnone werden sie noch heute nach traditionellen Methoden hergestellt. Die Glockengießerei Marinelli blickt auf eine tausendjährige Tradition zurück. Die Brüder Armando und Pasquale führen den Betrieb in der 24. Generation. Selbst der Vatikan bestellt seine Glocken bei den Brüdern. Nun sollen sie eine kleine Glocke für die Gemeinde Monopoli herstellen. Ein kleiner, aber feiner Auftrag. Diese Reportage hat den Glockengießern über die Schultern geschaut. Don Vincenzo hat ein Problem. Die Glocken in der Kirche des 42-jährigen Priesters schlagen nun schon seit vielen Jahren nicht mehr. Was eine Andacht stets zu einer halben Sache macht. Denn eine Kirche ohne Glocke hat keinen Wert, wie die Anhänger von Don Vincenzos Gemeinde meinen. Nun endlich soll sich das ändern. Über Spenden hat der emsige Geistliche das nötige Geld zusammengesammelt, um sich bei den Brüdern Marinelli in Agnone eine neue Glocke anfertigen zu lassen. Die Marinellis gehören zu den berühmtesten Glockengießern Italiens. Besonders stolz sind sie auf ihre Beziehungen zum Vatikan, der seit vielen Jahren zu ihren Kunden zählt. Papst Johannes Paul II kam 1995 sogar nach Agnone, um den Guss einer Glocke zu segnen. Seit 1924 ist die Glockengießerei der Marinellis die einzige weltweit, die ihre Glocken mit dem päpstlichen Wappen zieren darf. Verständlich, dass Don Vincenzo entsprechend aufgeregt ist. Die Geschichte der Verwendung von Glocken im Christentum geht bis in das 5. Jahrhundert nach Christus zurück. Aufgrund ihres hohen Gewichtes wurden sie zunächst direkt vor Ort in den Klöstern gegossen, erst später etablierten sich spezialisierte Betriebe vor allem in Europa. Der Transport zur Kirche und die Installation im Glockenturm finden bis heute unter teilweise abenteuerlichen Bedingungen statt. DE 2017
