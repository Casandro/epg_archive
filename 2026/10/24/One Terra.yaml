- eventId: 974396
  start: 2026-10-24T00:15:00Z
  stop: 2026-10-24T01:06:00Z
  title: Planet Weltweit - Die Bergführer vom Mont Blanc
  subtitle: Planet Weltweit - Die Bergführer vom Mont Blanc
  description: Majestätisch überragt Europas Gipfel die felsigen Bergspitzen der Savoyer Alpen. Der Mont Blanc - seit seiner Erstbesteigung vor 230 Jahren ein Magnet für Alpinisten. Aber der weiße Gigant ist tückisch. Nicht jeder kehrt vom Aufstieg zurück.  Im kleinen Ort Chamonix am Fuße des Mont Blanc treffen sich leidenschaftliche Alpinisten, Familien, die Hautevolee und Einheimische. In der Hochsaison dreht sich alles um den Gebirgssport - und um den mit 4810 Metern höchsten Berg der Alpen. Rund 1000 Menschen versuchen jedes Jahr den Aufstieg - zehn davon bezahlen ihn mit dem Leben, darunter auch erfahrene Bergsteiger. Viele von ihnen unterschätzen den als weniger schwierig geltenden "Normalweg" von der Goûter-Hütte aus. Aber Gletscherspalten, Wetterstürze und Lawinen bedeuten oft tödliche Gefahr. Wir haben neben der Compagnie de Guides, der legendären Bergführertruppe, Menschen besucht, deren Leben eng mit dem Mont Blanc verbunden ist. François Pallandre ist Bergführer und hat die höchsten Gipfel der Welt erklommen. Ein Skiunfall ließ ihn sein Leben überdenken und jetzt hat sein alter Mentor ihn überzeugen können, der Gilde der ältesten Bergführertruppe von Chamonix beizutreten. Diese wurde nach einem Unglück am Mont Blanc 1821 zur sozialen Absicherung der Bergführer und ihrer Angehörigen ins Leben gerufen. François führt seine Klienten auf anstrengenden und gefährlichen Skirouten, gesäumt von verwehten Gletscherspalten, mehrere Meter hohen Türmen aus Gletschereis und schwierigen Schneeverhältnissen. Der Schwierigkeitsgrad der Route wird immer an die Fähigkeiten der Skifahrer und Klienten angepasst - für seine Arbeit braucht er daher nicht nur beste technische und körperliche Voraussetzungen sondern auch viel Menschenkenntnis.  DE 2015
- eventId: 974400
  start: 2026-10-24T01:15:00Z
  stop: 2026-10-24T02:07:00Z
  title: Planet Weltweit - Lettland, das Land der Sänger
  subtitle: Planet Weltweit - Lettland, das Land der Sänger
  description: "Das Singen gehört zum Leben der Bewohner Lettlands wie die Flüsse und das Meer. Ob auf dem Land oder in der Hauptstadt Riga: Tausende Letten singen in unterschiedlichen Chören die traditionellen Volkslieder, die von der klaren Schönheit und Poesie ihrer Heimat erzählen. Während ihrer 'Singenden Revolution', spendeten die Lieder den Letten Kraft im Kampf um nationale Unabhängigkeit - heute sind sie ein Teil der Popkultur geworden. \n\nDie Geschichte Lettlands, vor allem die der Besatzung, hat sich in das Stadtbild von Riga geschrieben. Viele Denkmale erinnern an die einst Mächtigen, Befreier und Okkupanten gleichermaßen. Die Traditionen der heute rund zwei Millionen Letten, ihre Sprache, die Kultur, vor allem aber ihre alten Lieder waren über Jahrhunderte einigende Kraft des Widerstands. 1991, als die Letten in Riga ihre Unabhängigkeit von der Sowjetmacht erkämpften, ging ein ganzes Volk mit der 'Singenden Revolution' in die Geschichte ein. Planet ist den Letten und ihren Liedkultur auf der Spur.\n\n'Die Volkslieder sind unser Spiegelbild. Sie sind überliefert, sind unser Leben: Im Grunde genommen sind sie die schriftliche Geschichte des Volkes', sagt Ints Teterovskis, der berühmteste Chorleiter Lettlands. Der attraktive und umtriebige 42jährige ist im ganzen Land bekannt wie ein Popstar. Viele junge Mädchen und Jungen wünschen sich nichts mehr, als in seinen Chor 'Balsis' ('Stimmen') aufgenommen zu werden. Doch die Auswahlkriterien bei den Castings sind hart, nur die besten Stimmen dürfen im Konzertchor mitsingen. Woher kommt diese große Liebe zu den eigenen Volksliedern, was verbinden in Lettland Jung und Alt, Arm und Reich mit ihren volkstümlichen Gesängen? Der berühmte Chorleiter Ints Teterovskis und die 16-jährige Krista Ziemele aus der kleinen Küstenstadt Pavilosta sind nur zwei Menschen, deren Leben tief mit dem Gesang und der Liebe zu den Liedern Lettlands verbunden ist. Sie gewähren uns einen tiefen Einblick in die Seele eines Volkes. DE 2014"
- eventId: 974401
  start: 2026-10-24T02:15:00Z
  stop: 2026-10-24T03:07:00Z
  title: Planet Weltweit - Tonga, Paradies der Südsee?
  subtitle: Planet Weltweit - Tonga, Paradies der Südsee?
  description: "Tonga, ein Paradies in der Südsee und auf den ersten Blick eine traumhafte Idylle. Mildes Klima und üppige Vegetation versprechen ideale Lebensbedingungen im ältesten Königreich Polynesiens. Doch abseits von Hofstaat und Palästen sind viele Menschen verzweifelt: Es herrschen Arbeitslosigkeit und Armut. \n\n92 Prozent der  Bevölkerung Tongas leiden an Übergewicht. Mehr als die Hälfte stirbt an Diabetes und ihren Folgen. Armut, Hoffnungslosigkeit und mangelnde medizinische Versorgung veranlassen seit vielen Jahren immer mehr Bewohner zur Auswanderung. Sie suchen Heil in Neuseeland, in Australien oder in den USA. Wer zurück bleibt, versucht sich einzurichten - auch wenn es kaum reguläre Arbeitsplätze gibt. Die einen leben von Fischfang und Ackerbau, andere bauen vor allem auf die Geldüberweisungen von Familienangehörigen aus dem Ausland. Planet fragt nach: Gibt es eine Zukunft für Tongas Kinder im eigenen Land?\n\nFipe Paea ist Diabetikerin. Sie hat bereits ein Bein verloren und leidet an chronischem Nierenversagen. Auf Tonga ein Todesurteil. Nur im Ausland gibt es die rettende Dialysebehandlung. Auswandern oder sterben - wie Fipe Paea stellt sich jährlich etwa 200 weiteren Nierenpatienten in Tonga diese Frage. Doch nur wenige haben die Chance auszuwandern. Fipes Sohn Timote, der seit fast 15 Jahren in San Francisco lebt, startet jetzt den vierten Anlauf, um seine todkranke Mutter und deren Nichte Laukau in die USA nachzuholen. Doch zum Auswandern braucht man Visa und Geld. Umgerechnet 4000.- Euro fehlen noch. Ein Vermögen in Tonga. Die Zeit drängt, die Flugtickets sind nur noch bis morgen reserviert. Wird es Timote diesmal schaffen, die Mutter außer Landes zu bringen? DE 2013"
- eventId: 974406
  start: 2026-10-24T03:10:00Z
  stop: 2026-10-24T03:23:00Z
  title: Rund um den Globus - Die Rettungshunde vom Gardasee
  subtitle: Rund um den Globus - Die Rettungshunde vom Gardasee
  description: 'Die 17-jährige Ester und ihre sieben Monate alte Hündin Mia haben große Pläne: Sie wollen Lebensretter am Gardasee werden. Denn hier im Norden Italiens gibt es eine Wasserrettungs-Hundestaffel, die an den zahlreichen Seen und am Mittelmeer zum Einsatz kommt, wenn Menschen in Not geraten. Ertrinken ist nach Verkehrsunfällen weltweit der zweithäufigste Unfalltod, die Rettung ist schwierig. Es geht es vor allem um Zeit und Kraft. Denn auch der Retter kann schnell selbst in Gefahr geraten. Die italienische Rettungshundestaffel besteht aus Neufundländern und Retrievern '' Hunden, die das Wasser lieben, mindestens 30 Kilogramm schwer sind und die in Not geratenen Menschen an Land ziehen können. Gemeinsam mit ihrem Herrchen und Frauchen werden die Tiere drei Jahre lang zu Rettungsschwimmern ausgebildet. Am Ende wartet auf Ester und ihre Hündin Mia die größte Mutprobe: ein Sprung aus dem Helikopter!  DE 2013'
- eventId: 974407
  start: 2026-10-24T03:25:00Z
  stop: 2026-10-24T03:38:00Z
  title: Rund um den Globus - Die Elefanten von Mount Kenya
  subtitle: Rund um den Globus - Die Elefanten von Mount Kenya
  description: "Rund um den Mount Kenya gibt es ein Schutzgebiet für rund 2.000 Elefanten. Leider kommt es immer wieder zu Konflikten, manche Tiere werden auch getötet. Zurück bleiben oft die Elefanten-Kinder: Im Waisenhaus für Elefanten bekommen die Tiere eine neue Familie - und wenn alles gutgeht, akzeptieren die kleinen Riesen ihre Beschützer als ihre Mütter - in allen Lebenslagen. \n\n DE 2011"
- eventId: 974408
  start: 2026-10-24T03:40:00Z
  stop: 2026-10-24T03:50:00Z
  title: Rund um den Globus - Indien - Das größte Schulessen der Welt
  subtitle: Rund um den Globus - Indien - Das größte Schulessen der Welt
  description: An Indiens Schulen bekommen täglich Millionen Schüler ein kostenloses Mittagessen. Besonders Kinder wie die zwölfjährige Misbah Honnali profitieren von der Schulspeisung, die Misbah sogar besser schmeckt als das Essen zu Hause. Misbahs Familie ist sehr arm, ihr Vater ist Obsthändler und lebt von der Saisonarbeit. Zum Glück gibt es Großkantinen, die für die Schüler eine ausgewogene Mahlzeit kochen. In einer Fabrik im Südwesten Indiens werden jeden Tag Mittagessen für 800 Schulen zubereitet.  DE 2011
- eventId: 974409
  start: 2026-10-24T03:50:00Z
  stop: 2026-10-24T04:35:00Z
  title: Rund um den Globus - Mit Spürhunden gegen Wilderer
  subtitle: Rund um den Globus - Mit Spürhunden gegen Wilderer
  description: "Im Amboseli-Nationalpark in Kenia spielt die Hundestaffel der Naturschutzorganisation 'Big Life' im Kampf gegen Wilderer eine entscheidende Rolle. Denn die intelligenten Hunde sind beim Aufspüren der Täter extrem erfolgreich. Chef der Hundestaffel ist Mutinda Ndivo, der selbst einst ein gefürchteter Wilderer war, bevor er die Seiten zu wechselte, um fortan als Ranger zu arbeiten. Mit seiner Hündin Dede hat er schon vielen Elefanten und anderen Wildtieren das Leben gerettet. \n DE 2011"
- eventId: 974410
  start: 2026-10-24T04:35:00Z
  stop: 2026-10-24T05:10:00Z
  title: Planet Weltweit - Frisch vermählt in Estland
  subtitle: Planet Weltweit - Frisch vermählt in Estland
  description: Wenn in Estland der Sommer einzieht, beginnt auch die Hochzeitssaison, denn kaum jemand will im Winter heiraten. Und die Esten lassen sich einiges einfallen, um eine Hochzeit zu einem unvergesslichen Erlebnis zu machen. Dazu gehören aktionsreiche Spiele und Rituale, die überwiegend unter freiem Himmel stattfinden - vom Segeltörn im Wikingerschiff bis zum Tauziehen der gesamten Festgesellschaft.  DE 2017
- eventId: 974412
  start: 2026-10-24T05:10:00Z
  stop: 2026-10-24T06:02:00Z
  title: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  subtitle: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  description: |-
    Um kaum einen anderen Meeresbewohner ranken sich so viele Legenden wie um den Tintenfisch - vom Ungeheuer Skylla in Homers Odyssee bis zum Monster-Kraken bei Jules Verne. Für die Bewohner des Mittelmeerraumes spielen Tintenfische als Nahrungsquelle eine wichtige Rolle. Seit Jahrtausenden werden sie in Tunesien mit einer Technik gefangen, die bereits die Römer benutzt haben: Statt Netzen legen die Fischer Tonamphoren am Meeresboden aus. Mohammed Dahmen ist einer der letzten, der die schlauen Tiere mit dieser traditionellen Methode überlistet. Planet Weltweit ist mit ihm hinaus aufs Mittelmeer gefahren.

    Für Mohammed Dahmen hat sich niemals die Frage gestellt, ob er einen anderen Beruf ergreifen möchte. Seine Familie lebt seit Generationen traditionell vom Tintenfischfang. Selbst jetzt, wo die Tiere durch die Großfischerei immer seltener werden, hält der 78-jährige an seinem Beruf fest. Mohammed lebt mit seiner Familie auf den Kerkennah-Inseln. Bekannt wurden die Inseln durch den Feldherren Hannibal, der hier seinen Stützpunkt hatte, bevor er sich mit seinen Kriegs-Elefanten in Richtung Rom zog. Von der einstigen Bedeutung der Region ist nicht mehr viel übriggeblieben. Das Leben ist mühsam. Immer mehr der 7000 Einwohner verlassen die karge Heimat, um sich auf dem Festland eine Existenz aufzubauen. Viehzucht oder Ackerbau gibt es kaum, die meisten Lebensmittel müssen exportiert werden. Nur Tintenfische gab es über Jahrhunderte genug. Hier im Golf von Gabés an der tunesischen Ostküste werden 80 Prozent des gesamten landesweiten Tintenfischs gefangen. Seit der Römerzeit sind Tonamphoren eine effektive Fangmethode. Über 500 Amphoren werden an einer langen Schnur aneinandergeknotet und dann ins Wasser gelassen. Die Tintenfische, selber Räuber der Meere, verwechseln die dunklen Gefäße mit natürlichen, kleinen Höhlen, in die sie sich zurückziehen, um ihrer Beute aufzulauern. Der Fischer braucht sie dann nur noch an die Oberfläche zu ziehen. DE 2012
- eventId: 974414
  start: 2026-10-24T06:10:00Z
  stop: 2026-10-24T07:02:00Z
  title: Planet Weltweit - Myanmar, die Marmorkünstler von Mandalay
  subtitle: Planet Weltweit - Myanmar, die Marmorkünstler von Mandalay
  description: "Myanmar - das Land der goldenen Pagoden. Die Schönheit des Landes verzaubert immer wieder. Gespeist wird diese Prachtentfaltung aus der Verehrung Buddhas. Über 20 Meter misst die größte Marmor-Statue in Mandalay. Myanmars zweitgrößte Stadt ist berühmt für die Kunstfertigkeit ihrer Marmorschnitzer. Klöster und Tempel in ganz Asien verlangen nach immer neuen Bildnissen des Erhabenen. \n DE 2018"
- eventId: 974415
  start: 2026-10-24T07:10:00Z
  stop: 2026-10-24T08:02:00Z
  title: Planet Weltweit - Paris, Blitz Motorcycles
  subtitle: Planet Weltweit - Paris, Blitz Motorcycles
  description: 'Fred Jourden und Hugo Jezegabel haben ihre Leidenschaft zum Beruf und zu einem einträglichen Geschäft gemacht: In ihrer Werkstatt mitten in Paris fertigen sie kunstvoll aus alten Motorrädern neue, ganz besondere Zweiräder. Ein jedes Exemplar ist ein Unikat, eine ganz persönliche Kreation. Individuell, wie ihre Kunden. Sie haben ihr Unternehmen "Blitz Motorcycles" genannt. So blitzschnell ihre Maschinen auch fahren, in ihrer Werkstatt zwischen Arc de Triomphe und Montmartre geht es generell eher lässig zu. Es ist ihre ganz persönliche Philosophie: Stress, Liefertermine, fremdbestimmte Auftragsarbeiten, all dies lehnen die vollbärtigen Bastler kategorisch ab. GEO Reportage hat ihnen über die Schulter geguckt. Fred und Hugo fertigen sogenannte Custombikes, "personalisierte Motorräder", nach dem persönlichen Geschmack ihrer Kunden. Zuerst werden die Klienten ausführlich befragt: Was sind ihre Wünsche? Welche Charaktereigenschaften hat der Kunde, wie übersetzt man die in ihr neues Bike? Warum möchten die Kunden überhaupt ein solches Unikat? Erst wenn sich die Monteure ein genaues Bild von den Klienten gemacht haben, geht es an die Umsetzung des Auftrages. Fred und Hugo gehen auf die Suche nach passenden Gebraucht-Motorrädern, die sie in den folgenden Monaten auseinandernehmen und komplett umbauen. Tank, Motorblock und Sattelbank werden neu designt oder von anderen Modellen hinzugefügt. Und die wichtigste Regel: Nie darf ein Kunde auch nur einen Zwischenschritt der Montage begutachten. Erst am Ende präsentieren die Blitzboys das Gesamtkunstwerk. Und das soll perfekt sein. Bisher hat es immer geklappt. Stets haben Fred und Hugo wahre Traummaschinen für ihre neuen Besitzer gefertigt. Dass eine solche Geschäftsidee funktioniert, mag auch am Standort des Unternehmens liegen: Wo wenn nicht in Paris kann der Kreativität und gleichermaßen dem Hang zum Althergebrachten so erfolgreich freien Lauf gelassen werden?  DE 2014'
- eventId: 974420
  start: 2026-10-24T08:10:00Z
  stop: 2026-10-24T09:02:00Z
  title: Planet Weltweit - Paraguays neue Häuser
  subtitle: Planet Weltweit - Paraguays neue Häuser
  description: 'Eigentlich war die Luffa-Pflanze in Paraguay schon in Vergessenheit geraten. In den letzten Jahren aber erlebte sie ein erfolgreiches Comeback - als Badeschwamm. Die Luffa-Schwämme werden heute in alle Welt verkauft. Vielen armen Bauernfamilien sichert Paraguays alte Gurkenpflanze so das Überleben. Wenn es nach Elsa Zaldivar geht, soll Luffa nun auch für den Bau von Häusern eingesetzt werden. Das einst von dichtem Wald überzogene Land ist heute in weiten Teilen komplett abgeholzt. Viele Menschen haben praktisch keinen Zugang mehr zu bezahlbarem Baumaterial. Wir begleiten Elsa Zaldivar auf ihrem Weg, Paraguay von der Wohnungsnot zu befreien. Ist Luffa wirklich die Lösung? Elsa Zaldivar hat eine große Vision: Die Gurken-Pflanze Luffa soll helfen, in Paraguay die Armut zu bekämpfen. 1995 gründete Elsa Zaldivar eine Kooperative, in der mittellose Frauen durch Luffa die Chance für ein Einkommen erhalten. Die Frauen fertigen alles in Eigenregie: vom Anbau der Pflanze bis zum Luffa-Badeschwamm. So erzielen sie damit Einkünfte, die doppelt so hoch sind wie der gesetzliche Mindestlohn in Paraguay. Jetzt träumt Elsa Zaldivar davon, dass Menschen mit Luffa ein preiswertes Dach über dem Kopf bekommen sollen. Seit Jahren werden selbst einfache Holzhäuser in Paraguay immer teurer. Das südamerikanische Land ist in weiten Teilen abgeholzt. Holz als Baumaterial ist dadurch heute zum Luxusgut geworden. Insbesondere in der Hauptstadt Paraguays Asunción wachsen die Slums immer schneller. Viele Menschen leben als Müllsammler und zimmern sich aus Resten notdürftige Behausungen. Die Idee der Luffa-Kooperative ist es nun, die Reste der Luffa-Schwämme mit recyceltem Plastikmüll zu einem stabilen Baumaterial für Hauswände zu verbinden. Sollte das funktionieren, hätten die Frauen zugleich auch einen neuen Markt erschlossen. Elsa Zaldivar will jetzt mit dem ersten Testbau beginnen. DE 2009'
