  title: Planet Weltweit - Die Mutter der Bonobos
  subtitle: Planet Weltweit - Die Mutter der Bonobos
  description: "Die Serie \"Rund um den Globus\" zeigt außergewöhnliche Kinder und deren spannende Geschichten: Ein Bauernmädchen aus Rajasthan wird Ministerin in einem Kinderparlament und lernt so Demokratie.Màrta ist Tierfreundin durch und durch und hat das Otterbaby Viki in der Pflege.  Und Simón, ein junger Indianer aus dem bolivianischen Dschungel, geht mit seinem Dorforchester auf große Konzertreise... \n DE 2011"
