  title: Planet Weltweit - Die Kichwa-Krieger und das Öl
  subtitle: Planet Weltweit - Die Kichwa-Krieger und das Öl
  description: Der Regenwald im Osten Ecuadors beherbergt eine unbändige Artenvielfalt und Wasserfälle, die das gesamte Amazonasbecken speisen. Doch riesige Landstriche dieses einmaligen Waldgebiets werden durch Ölförderung verseucht. Nur wenige Einheimische wagen es, dagegen zu protestieren, die Einwohner Sarayakus gehören dazu. Sie streiten seit Jahren gegen die Öl-Konzerne, die auf ihrem Grund und Boden nach dem lukrativen Rohstoff bohren wollen. Besonders die Geschwister Patricia und Heriberto Gualinga engagieren sich in diesem Kampf. Beide sollen für das Dorf Informationen aus entfernten Öl-Regionen sammeln, um zu beweisen, dass die Konzerne ihre Versprechen gegenüber den betroffenen Dörfern nur selten einhalten, denn auch in Sarayaku treten die Firmen immer wieder an einzelne Stammesmitglieder heran und versuchen, den Zusammenhalt der Gemeinde zu stören. Das Geschäft mit dem Öl gilt als bedeutendster Wirtschaftszweig Ecuadors. Allerdings haben bis heute nur ausländische Konzerne und die Machtelite des Landes ihren Profit daraus ziehen können, die Bauern leiden unter katastrophalen Umweltschäden. Trotzdem will die Regierung neue Fördergebiete auf dem Territorium der Ureinwohner erschließen. 2003 wurden weitere 10.000 Quadratkilometer Regenwald für die Ölförderung freigegeben. Damit sind rund 80 Prozent des ecuadorianischen Amazonasgebietes betroffen - und damit faktisch alle noch im Wald lebenden Ureinwohner. Auch die Kichwa in Sarayaku. DE 2004
