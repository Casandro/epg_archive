  title: Planet Weltweit - Valparaiso, die Stadt der Aufzüge
  subtitle: Planet Weltweit - Valparaiso, die Stadt der Aufzüge
  description: 'Die chilenische Hafenstadt Valparaiso ist die Stadt der Standseilbahnen. 1883 wurde die erste Seilbahn in die hoch am Hang gelegenen Viertel eröffnet, in den 1920er Jahre waren es bereits über 30. Heute gibt es noch 15 der traditionellen Ascensores, wie die Bewohner von Valparaíso ihre Seilbahnen nennen. Davon sind allerdings nur neun in Betrieb. In Schuss gehalten werden sie von den Ascensoristas.  In den nächsten Jahren wartet viel Arbeit auf Chefmechaniker Luis Segovia und die Renovierungsmannschaft: Schon heute fallen täglich Aufzüge aus, weil alte Teile verschlissen sind und für eine Komplettsanierung bislang das Geld fehlte. Die Mechaniker müssen vor allem improvisieren können und schwindelfrei sein. Nun sollen sechs Aufzüge saniert werden, die seit langem ungenutzt in der Stadt verrotten. Diese Reportage geht mit auf Inspektion. Seine Bedeutung verdankte die Stadt Valparaíso der günstigen geografischen Lage am Pazifik. Nach der wochenlangen Seereise von Europa nach Südamerika und der gefährlichen Umsegelung von Kap Hoorn war Valparaíso nach seiner Gründung 1544 der erste größere Hafen für die europäischen Seefahrer. Ab Beginn des 19. Jahrhunderts entwickelte sich die Stadt rasant - bis zur Öffnung des Panama-Kanals 1914. Inzwischen ist Valparaíso für die internationale Schifffahrt fast bedeutungslos. Zeugnisse der ehemals herausragenden Rolle der Stadt sind die alten Ascensores. Die Aufzüge sind auch heute noch dringend benötigte Transportmittel - Lebensadern zwischen den Vierteln der steil an den Hängen errichteten Stadt. Der steilste Aufzug hat einen Steigungsgrad von 70°. Nachdem die UNESCO 2003 die historische Altstadt inklusive der Standseilbahnen als Weltkulturerbe anerkannt hat, sollen jetzt endlich alle noch existierenden Aufzüge modernisiert werden. Doch wo zuerst beginnen? Zumal in der Bucht von Valparaiso vor allem im südamerikanischen Winter das Wetter oft unberechenbar ist. DE 2016'
