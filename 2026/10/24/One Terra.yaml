  title: Planet Weltweit - Das Dschungel-Orchester
  subtitle: Planet Weltweit - Das Dschungel-Orchester
  description: Urubichá, ein staubiges 4000-Seelen-Dorf im bolivianischen Südamazonien. Hier gibt es keine Autos, nur einfache Lehmhütten, giftige Schlangen, Esel, Schweine und Hühner, ein Telefon, drei Kramläden - und ein Barock-Orchester. Jedes vierte Kind im Dorf spielt ein Instrument oder singt im Chor. Bis tief in die Nacht bereitet sich der 15-jährige Simon Aguape auf das wichtigste Konzert seines Lebens vor. Er spielt Geige im Dorforchester, beherrscht Bach und Vivaldi ebenso wie Barock-Partituren, die einst seine Vorfahren geschrieben haben. Ende des 17. Jahrhunderts hatten Jesuiten Noten und Instrumente nach Süd-Amazonien gebracht. Und tatsächlich ließen sich viele Ureinwohner mit Hilfe der Musik missionieren, denn nach ihrem traditionellen Glauben stellt sie die Verbindung ins Jenseits her. Sie bauten Instrumente, schrieben Messen und Opern, bis die Spanier 1767 die Jesuiten verjagten und viele Indianer versklavten. Durch das Orchester in Urubichá erlebt der südamerikanische Barock nun seine Renaissance. In Urubichá werden wieder Geigen und Cellos hergestellt. Aus der Dorfkirche, aus der Musikschule, aus den strohgedeckten Hütten Urubichás klingen von früh bis spät Streicher und Trompeten, Fagotte und Klarinetten, Harfen und Posaunen. Simon lebt mit seinen beiden Brüdern, einer Schwester und den Eltern in einer strohgedeckten Lehmhütte ohne Strom und Wasser. Mühsam ernähren sie sich von einem kleinen Stück Land, ihre Mutter verkauft Webarbeiten. Auch Simons Brüder sind begnadete Musiker, beide Cellisten. Der 18-jährige Dionisio hat auf Einladung der bolivianischen Kirche dem Papst ein Geburtstagsständchen gespielt. Der 22-jährige Juan-Carlos hat vor dem spanischen König musiziert. Nun wird Simon auf einer Tournee durch Peru die erste Geige spielen. Für viele der jugendlichen Musiker ist diese Tournee die erste Auslandsreise ihres Lebens. DE 2004
- eventId: 974428
  start: 2026-10-24T11:10:00Z
  stop: 2026-10-24T12:02:00Z
  title: Planet Weltweit - Die letzten Köhler von Rumänien
  subtitle: Planet Weltweit - Die letzten Köhler von Rumänien
  description: |-
    Die Karpaten erstrecken sich über einen Großteil Rumäniens. Wie ein großer, dicker Mantel bedeckt der Wald diese sagenumwobene Gebirgslandschaft. Mit seinen Tausenden Hektar bildet er eine wahre Schatzkammer, für den sich nun auch ausländische Investoren interessieren.

    In der Sommerhitze holen zwei Männer, umgeben von Glut und Feuer, Kohle aus einem noch nicht ausgebrannten Meiler. Sie tragen keinen Schutz vor dem ständigen Rauch und den giftigen Staubteilchen. Lajos Balint ist 58 Jahre alt. Sein ganzes Leben hat er nichts anderes gemacht als Holz in Kohle zu verwandeln. Die Köhler Rumäniens sind die Ärmsten der Armen, stehen in der Hierarchie der Landbevölkerung ganz unten, obwohl sie Meister und Könner sind. Einen fünf Meter hohen Meiler wochenlang am Brennen zu halten erfordert viel Erfahrung, physikalisches Wissen und Mut. Tag und Nacht muss das Ungetüm bewacht, Luft zugeführt oder gedrosselt werden, denn das Feuer darf nicht mit einer offenen Flamme brennen. Nur so entsteht nach Wochen die begehrte Holzkohle.

    Die landet überwiegend auf westeuropäischen Grillpartys, ohne dass irgendjemand weiß, woher sie kommt und wer sie unter welchen erbärmlichen Bedingungen hergestellt hat. Mitten in Europa führen die Köhler ein bettelarmes und schweres Leben jenseits aller Vorzüge der Moderne und immer begleitet von der Frage, wie lange man dieses Leben überhaupt aushält. DE 2013
