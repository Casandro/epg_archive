  description: "Das Singen gehört zum Leben der Bewohner Lettlands wie die Flüsse und das Meer. Ob auf dem Land oder in der Hauptstadt Riga: Tausende Letten singen in unterschiedlichen Chören die traditionellen Volkslieder, die von der klaren Schönheit und Poesie ihrer Heimat erzählen. Während ihrer 'Singenden Revolution', spendeten die Lieder den Letten Kraft im Kampf um nationale Unabhängigkeit - heute sind sie ein Teil der Popkultur geworden. \n\nDie Geschichte Lettlands, vor allem die der Besatzung, hat sich in das Stadtbild von Riga geschrieben. Viele Denkmale erinnern an die einst Mächtigen, Befreier und Okkupanten gleichermaßen. Die Traditionen der heute rund zwei Millionen Letten, ihre Sprache, die Kultur, vor allem aber ihre alten Lieder waren über Jahrhunderte einigende Kraft des Widerstands. 1991, als die Letten in Riga ihre Unabhängigkeit von der Sowjetmacht erkämpften, ging ein ganzes Volk mit der 'Singenden Revolution' in die Geschichte ein. Planet ist den Letten und ihren Liedkultur auf der Spur.\n\n'Die Volkslieder sind unser Spiegelbild. Sie sind überliefert, sind unser Leben: Im Grunde genommen sind sie die schriftliche Geschichte des Volkes', sagt Ints Teterovskis, der berühmteste Chorleiter Lettlands. Der attraktive und umtriebige 42jährige ist im ganzen Land bekannt wie ein Popstar. Viele junge Mädchen und Jungen wünschen sich nichts mehr, als in seinen Chor 'Balsis' ('Stimmen') aufgenommen zu werden. Doch die Auswahlkriterien bei den Castings sind hart, nur die besten Stimmen dürfen im Konzertchor mitsingen. Woher kommt diese große Liebe zu den eigenen Volksliedern, was verbinden in Lettland Jung und Alt, Arm und Reich mit ihren volkstümlichen Gesängen? Der berühmte Chorleiter Ints Teterovskis und die 16-jährige Krista Ziemele aus der kleinen Küstenstadt Pavilosta sind nur zwei Menschen, deren Leben tief mit dem Gesang und der Liebe zu den Liedern Lettlands verbunden ist. Sie gewähren uns einen tiefen Einblick in die Seele eines Volkes. DE 2014