  title: Planet Weltweit - Mit dem Wanderbarden durch Aserbaidschan
  subtitle: Planet Weltweit - Mit dem Wanderbarden durch Aserbaidschan
  description: Auf den sattgrünen Hochebenen des Kleinen Kaukasus in Aserbaidschan ist die Moderne noch nicht angekommen. Hier liegt die Heimat des 40-jährigen Nemet Gasimli, der schon als kleiner Junge genau wusste, was er werden wollte. Nicht Bauer, Imker oder Landarbeiter, wie die meisten hier, sondern Sänger, Dichter, Musiker! Nemet ist ein Aschug - ein traditioneller Wanderbarde, der sein Land bereist und es in leidenschaftlichen Versen besingt. Die Dokumentation hat sich dem Barden und seinem Lehrling Elvin an die Fersen geheftet und ein vielfältiges Land zwischen Orient und Okzident entdeckt. Die Republik Aserbaidschan liegt zwischen Kaspischem Meer und Kaukasus. Sie ist etwa so groß wie Österreich und seit dem Kollaps der Sowjetunion 1991 ein souveräner Staat. Obwohl das Land so klein ist, durchqueren der Wanderbarde Nemet Gasimli und sein Lehrling Elvin auf ihrer Reise gleich mehrere Klimazonen. Unterwegs mit ihrem Kleinwagen besuchen sie das Grenzgebiet zu Armenien mit seinen imposanten Gebirgszügen, die Stadt Lenkoran direkt am Kaspischen Meer, und tief im Süden das Örtchen Süljäkaran, in dem die Menschen aus unerfindlichen Gründen uralt werden. Ihre Musik trägt sie zu Gesangsauftritten auf Hochzeiten, Lyrik-Vorträgen in der Provinz oder Musikseminaren in der Hauptstadt Baku. Die Kunst der Aschugs ist in Aserbaidschan ein uraltes und noch immer hoch angesehenes Gewerbe. Schon vor Jahrhunderten zogen Aschugs als Nachrichtenübermittler durch den Orient, sie unterhielten ihr Publikum aber auch als Dichter von Heldenepen und Liebesgeschichten. Ein guter Aschug versteht es heute noch, die Menschen mit seinen Versen tief im Innersten zu berühren. Dazu braucht es viel Wissen und musikalisches Können. Jeder Aschug durchläuft eine mehrjährige Lehrzeit bei einem Meister. Er muss die wichtigsten Epen Aserbaidschans kennen und spannend nacherzählen können. DE 2011
