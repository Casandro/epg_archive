  title: Planet Weltweit - Island - Die wertvollsten Daunen der Welt
  subtitle: Planet Weltweit - Island - Die wertvollsten Daunen der Welt
  description: 'Planet Weltweit: Die raue, von Fjorden durchzogene Landschaft im Nordosten Islands ist Schauplatz einer faszinierenden Symbiose zwischen Mensch und Tier. Hier brüten arktische Eiderenten, die ein außergewöhnliches Federkleid tragen. Und den Menschen seit Hunderten Jahren die wertvollsten Daunen der Welt überlassen: Die Wildvögel gestatten den Farmern, die Federn aus ihrem Nest zu nehmen und genießen dafür den Schutz der Menschen, die wiederum die Enten und ihr Gelege vor Fressfeinden wie Möwen und Polarfüchsen schützen. Der Loğmundarfjörğur auf Island. Hierhin zieht es den Farmer Ólafur Ağalsteinsson, seine Frau und ein befreundetes Ehepaar. Es ist die Zeit, in der die Eiderenten zur Brut auf die Farm kommen. Geschützt durch die Menschen legen sie hier ihre Eier und überlassen den Farmern dafür ihre weichen Daunen. Diese feinen Federn besitzen spezielle, auch von den Menschen geschätzte Eigenschaften wie etwa die besondere Wärmespeicherung. Mit diesen Daunen gefüllte Kissen und Decken gehören zu den wertvollsten der Welt und kosten in der Regel mehrere Tausend Euro. Derart gewinnbringend können aber nur wenige der etwa 380 Farmer auf Island von der Eiderernte leben. Im Gegensatz zu Ólafur Ağalsteinsson etwa muss Óğinn Logi den Lebensunterhalt für sich und seine Familie als Feuerwehrmann, Sanitäter und Jäger verdienen. Doch jedes Frühjahr zieht die ganze Familie hinaus und sammelt die Eier unvorsichtiger Entenmütter ein, deren Gelege der Flut zum Opfer fallen würde. Die Küken brüten sie dann erfolgreich in einer Garage aus. Neu in der Branche ist auch Íris Birgisdóttir, die vor wenigen Jahren die ehemalige Schaffarm ihres Onkels zu einer Eiderfarm umwandelte und diese nun allein mit ihrer vierjährigen Tochter betreibt. Ob die junge Witwe sich dauerhaft durchsetzen wird, bleibt abzuwarten. Ólafur Ağalsteinsson ist da schon weiter: Allein in dieser Saison wird er über 300 Kilogramm Daunen ernten. Ohne dass auch nur einer einzigen Ente Schaden zugefügt wird. DE 2022'
