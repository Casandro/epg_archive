  title: Planet Weltweit - Jadehandel im Goldenen Dreieck
  subtitle: Planet Weltweit - Jadehandel im Goldenen Dreieck
  description: Leuchtend schimmert sie - die Jade. Seit Jahrtausenden zählt sie vor allem in Asien zu den begehrtesten Edelsteinen. Ihre Fundstätten werden streng gehütet und immer wieder heiß umkämpft. Jade findet man vor allem rund um den Pazifischen Feuerring, aber die besten Steine kommen aus Myanmar. Hier streiten sich Regierung und Rebellen immer noch um die Schürfrechte. Doch der Jadehandel blüht. Scharen von chinesischen Minengesellschaften sind in das Land eingefallen, um die Jadevorkommen Myanmars im großen Stil auszubeuten. Traditionelle, einheimische Jadehändler haben zunehmend Beschaffungs- und Absatzprobleme. Deshalb besinnen sie sich auf alte Schmugglerpfade, um neue Verkaufsmöglichkeiten zu finden! Wir durften einen von ihnen auf seinen abenteuerlichen Wegen begleiten. Mandalay, die zweitgrößte Stadt des Landes und einstige Hauptstadt Myanmars, ist die Hochburg des Jadehandels. Auf dem Jademarkt im Herzen der Stadt leben mehr als 10.000 Händler und Schleifer vom Handel mit den "Nierensteinen" - so die wörtliche Übersetzung des spanischen Namens "piedra de ijada". Doch der Handel wird zunehmend von Chinesen kontrolliert. Denn nirgendwo ist die Jade so begehrt wie in China, wo man ihr schon seit etwa 8.000 Jahren mystische sowie medizinische Bedeutung beimisst. Chinesische Konzerne haben von der Regierung weitreichende Lizenzen und die wichtigsten Schürfgebiete erworben, die in gigantischen Tagebauprojekten ausgebeutet werden. Und sie diktieren die Preise. Kleine, einheimische Händler, wie der junge Ko Min und seine Brüder, haben neuerdings Probleme, an gute, neue Ware zu kommen und diese zu akzeptablen Preisen zu veräußern, um damit ihre Familien zu ernähren. Ko Min will nicht tatenlos zusehen, wie den kleinen Händlern das Wasser abgegraben wird. Er hat erfahren, dass auch im 300 km entfernten Minengebiet von Mogok, das für seine Rubine berühmt ist, vermehrt Jade geschürft wird. DE 2014
