  title: NDR 1 Radio MV - Plappermoehl
  subtitle: Plattdüütschen Klönsnack, Literatur und Musik ut uns Land
  description: Die "Plappermoehl" ist die älteste plattdeutsche Radiosendung im Nordosten. Angefangen hat alles in Dabel, als 1983 die erste "Plappermoehl" auf dem Kornboden der alten Holländerwindmühle aufgezeichnet wurde. Mittlerweile ist die Sendung unterwegs in ganz Mecklenburg-Vorpommern und meldet sich regelmäßig aus einem anderen Ort des Landes mit "ne lütt Stunn Lüdsnack, Musik un süst noch wat". Mit Humor und guter Laune moderieren Susanne Bliemel und Thomas Lenz ihren Klönsnack mit interessanten Gästen.
