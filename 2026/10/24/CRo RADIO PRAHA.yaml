  title: Kriminálka
  description: 'Horký případ - Zdánlivě "obyčejná" loupež v pražské restauraci s rychlým občerstvením. Lupiči si odnesli jen několik málo tisíc korun. Proč u toho ale použili samopal? A proč nezvolili jiný objekt, kde by v pokladně našli daleko vyšší částku? Podezření kriminalistů, že se jedná pouze o zkoušku a pachatelé se chystají na daleko větší "akci" se zanedlouho potvrdilo. Spolupráce pražských, středočeských a brněnských kriminalistů při dopadení organizované skupiny. Autor, dramaturgie: Dana a Mirek Vaňurovi. premiéra'
