  title: Host Lenky Vahalové
  description: Hostem Lenky Vahalové bude režisér TOMÁŠ MAŠÍN. Natočil 3 sézony v pekle, film Bratři nebo Gertu Schnirch. Film Bratři se dokonce stal oficiálním českým kandidátem na Oscara. Tomáš Mašín si ale od filmu občas odskočí k divadlu. Jeho posledním počinem je komorní psychologické drama Odmocnina ženy v hlavních rolích s Pavlou Gajdošíkovou a Martinou Preissovou...
