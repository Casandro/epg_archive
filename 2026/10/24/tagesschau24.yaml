  title: 'Verteidigung vor der Haustür: Wie gut sind wir vorbereitet?'
  subtitle: Film von Lennart Banholzer und Caroline Rollinger
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Hubschrauber über dem Hafen, Hundertschaften der Bundeswehr in den Straßen, Panzer in der Stadt. Nicht wenige Hamburger staunten, als im Jahr 2025 eine große Übung der Bundeswehr stattfand. Und auch anderorts im Norden und ganz Deutschland bereiten sich Landkreise und Kommunen auf mögliche Verteidigungsfälle vor. Das alles regelt der Operationsplan Deutschland - ein wichtiger und weitgehend geheimer Einsatzplan. \nDer Film erklärt, wer daran arbeitet und welche Folgen er haben könnte. Und er zeigt, welche Auswirkungen das auf die Menschen vor Ort hätte."
