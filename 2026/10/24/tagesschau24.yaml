  description: "Die Salomonen sind ein kleiner Staat in der Südsee. Paradiesische Strände, Palmen, Schilfhütten - unendlich weit von Europa entfernt. Aber durch die strategische Lage im Pazifik ist das Land weltpolitisch von großem Interesse. Seit einiger Zeit sind die Inseln ins Visier der Großmächte geraten. China und der Westen kämpfen dort unübersehbar um Einfluss. \nDie WDR Story war auf den Salomonen unterwegs und hat beobachtet, wie der Kampf der Großmächte das Leben im kleinen Inselstaat verändert."
