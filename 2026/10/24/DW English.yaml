  title: Luxury Beauty
  description: |-
    The film follows two successful women entrepreneurs working in Germany's beauty industry, giving insights into their professional lives.

    In Frankfurt, Hatice Nizam runs two exclusive hair salons under the name "HaarWerk," serving clients from all over the world. She's spent three decades in the industry and has long been a star on social media, where she's known as the "Queen of Blonde Shades."

    Dr. Tamarica Fischer-Nagel is a cosmetic surgeon. Together with her partner, Dr. Patrice Moubayed, she runs practices in Bad Wildungen and Kassel in central Germany. Many of her patients are willing to go to great lengths for the sake of their appearance — Botox injections are part of her daily routine.
