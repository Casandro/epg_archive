  title: Helden der Evolution - Beuteltiere
  subtitle: Helden der Evolution - Beuteltiere
  description: 'Pelzig, niedlich und voller Überraschungen - so präsentieren sich die Beuteltiere. Neben den weltbekannten Kängurus geben sich auch ihre gleichermaßen faszinierenden Verwandten ein Stelldichein: Koalas, Wombats, Tasmanische Teufel, Opossums und Nasenbeutler. All diese hüpfenden, kletternden und bisweilen gleitenden Geschöpfe sind ausschließlich in Australasien und Amerika anzutreffen.'
