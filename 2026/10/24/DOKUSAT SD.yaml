  title: Tiere vor der Kamera - In den Wüsten Australiens
  description: Outback Australien, Staub, Hitze, Trockenheit und dann plötzlich Regen. Seit Monaten trockene Flussbetten verwandeln sich in reißende Ströme. Vögel singen, Pflanzen sprießen, aus der Wüste wird ein Blumengarten. 1980 verschifften Ernst Arendt und Hans Schweiger LKW und Ausrüstung nach Australien. Monatelang durchstreiften sie die Wüsten Australiens.
  widescreen: true
  subtitle: Tiere vor der Kamera - In den Wüsten Australiens
