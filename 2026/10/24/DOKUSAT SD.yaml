  title: Tiere vor der Kamera - Die Schlucht der Felsenkänguruhs
  subtitle: Tiere vor der Kamera - Die Schlucht der Felsenkänguruhs
  description: 'Ernst Arendt und Hans Schweiger nehmen uns mit ins Outback Australiens. Tief eingeschnittene Schluchten in den MacDonnell Ranges in Zentralaustralien sind wie kleine Oasen. Zwischen den malerischen roten Felsen hält sich auch in trockenen Zeiten Wasser. Hier finden Arendt/Schweiger Felsenkänguruhs, Spinifextauben, aber auch Vögel, die man in der Wüste nicht vermutet: Zwergtaucher und Reiher.'
