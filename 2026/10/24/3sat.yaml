  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im letzten Teil von Christian Reichholds Dokumentation über die Hörbigers kommt die mittlerweile erfolgreiche "Dritte Generation" zu Wort.

    Paul Hörbigers Enkel Mavie Hörbiger und Christian Tramitz sowie Maresas Sohn Manuel Witting, Christianes Sohn Sascha Bigler und Elisabeth Orths Sohn Cornelius Obonya, der wie sein Großvater Attila als "Jedermann" bei den Salzburger Festspielen begeistert, blicken zurück.
