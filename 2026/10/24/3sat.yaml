  title: 'Christian Ehring: Nebensaison. Das Musikprogramm'
  subtitle: 3satFestival Mainz, September 2026
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Seit Langem träumt Christian Ehring davon, auch dort zu sein, wo die Musik spielt ... das ist am einfachsten, wenn man sie selbst macht. So entstand sein musikalisches Programm "Nebensaison".

    Wo der vielfach ausgezeichnete Kabarettist sonst mit scharfen Worten das politische Geschehen analysiert, wirft er hier Note für Note mit feinem Sarkasmus und Melancholie seinen scharfsinnigen Blick auf die Gesellschaft. Ein Crescendo aus Comedy und Kunst!
