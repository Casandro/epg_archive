  description: 'Im Südosten Finnlands liegt Europas viertgrößter See: der Saimaa. Hier ist die sehr seltene Süßwasser-Ringelrobbe zu Hause. Immer wärmere Winter machen ihr zu schaffen. Auch Torfabbau und Holzwirtschaft rund um den Saimaa bedrohen sein natürliches Gleichgewicht. Aber Tierschützer, Ökologen und Biologen überraschen mit einfachen Maßnahmen gegen große Probleme.'
