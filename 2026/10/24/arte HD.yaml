  title: Impulse
  subtitle: 'Elektromagnetische Wellen: Unsichtbar und omnipräsent'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Bloß keine mathematischen Formeln und keine physikalischen Gleichungen? Die Serie "Impulse" macht naturwissenschaftliche Sachverhalte auch für Mathematik-, Physik- und Wissenschaftsmuffel schmackhaft. "Impulse" bereitet die wichtigsten Fragen und Antworten der Naturwissenschaft auf und erklärt sie so, dass selbst Schöngeister, die um Mathematik und Physik lieber einen großen Bogen machen, sich dafür begeistern können.
    Diese Folge widmet sich der Entdeckung der elektromagnetischen Wellen und den schlauen Köpfen, die dazu beigetragen haben. Eine Reise ins Reich der Funkwellen, Lochstreifen, der Telefonie, der GPS-Systeme und des WLAN.
