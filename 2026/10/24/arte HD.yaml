  description: 'Wall ist ein verschlafenes englisches Dorf, benannt nach der Steinmauer, welche die Bewohner seit Äonen vor dem übernatürlichen Paralleluniversum sichert, das direkt auf der anderen Seite liegt. Hier gibt der junge Tristan Thorn dem hübschesten Mädchen der Ortschaft, dessen Liebe er zu gewinnen hofft, ein gewagtes Versprechen: Er wird ihr einen herabgefallenen Stern bringen. Dazu muss er jedoch gegen alle Verbote verstoßen und die Mauer überwinden. Auf der anderen Seite taucht er in eine geheimnisvolle Welt voller Magie und sich entfaltender Legenden ein und wird so ein Teil von ihr.'
