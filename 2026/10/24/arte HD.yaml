  title: 360° Reportage
  subtitle: 'La Réunion: Die Wiederbelebung der kreolischen Gärten'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Auf der französischen Überseeinsel La Réunion sind die sogenannten kreolischen Gärten ein wahres Reservoir an biologischer Vielfalt und ein Spiegel der Identität. Doch die fortschreitende Urbanisierung der Insel und der moderne Lebensstil bedrohen die alte Gartenkultur. Einige Enthusiasten kämpfen dagegen an. Sie wollen die wertvolle Kultur der kreolischen Gärten erhalten. Die Idee der Selbstversorgung - wo könnte sie besser funktionieren als hier? Auf der felsigen und fruchtbaren Insel La Réunion, mitten im Indischen Ozean.
