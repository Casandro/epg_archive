  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: |-
    17.05 Die Entscheidung. Momente, die alles verändern
    Gefangen in der DDR (3/3) I Flucht und doch zurück
    Ausgerechnet im Gefängnis spürt es Thomas Nolte zum ersten Mal: Er will unbedingt raus aus der DDR. Als er aus der Haft entlassen wird, unternimmt er im Sommer 1989 mit seinem Bruder Stefan einen Fluchtversuch. Doch der scheitert. Dann sieht er im Fernsehen, wie Außenminister Genscher in der bundesdeutschen Botschaft in Prag Tausenden DDR-Bürgern die Ausreise verspricht. Thomas Nolte macht sich auf den Weg nach Prag - und in die Freiheit. In die Bundesrepublik. Gemeinsam mit seiner Tocher, der BR-Journalistin Marie Müller, versucht er heute nachzuempfinden, was ihn damals bewegte. Warum er überraschend schnell in seine thüringische Heimat Heiligenstadt zurückkehrt, als im November 1989 die Mauer fällt. Und warum er wie Mario Obst, der ebenfalls mit 18 in Erfurt willkürlich im Gefängnis saß, eins schwer ertragen kann: Die Ostalgie von Menschen, die sich heute die DDR zurückwünschen.
    Host: Jasmin Brock
    Reporterin: Marie Müller

    17.30 Bayern 2 Breitengrad
    ARD Auslandsreportage



    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar.
