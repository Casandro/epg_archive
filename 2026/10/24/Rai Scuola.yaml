  title: Amarcord - Ritratti di città Matera
  subtitle: ATTUALITA' - Il documentario ripercorre l'evoluzione socio-economica di Matera e del Metapontino, dalla millenaria architettura rupestre della Civita e dei Sassi, segnata dalla povertà, al riscatto avviato dal..
  description: "a visita di Alcide De Gasperi nel 1951 e dalla legge di sgombero del 1952. Nella piana di Metaponto, le testimonianze contadine ricordano la lotta alla malaria e la costruzione della Città Nuova, mentre emerge la fierezza di una comunità storicamente reattiva ai soprusi: nel settembre 1943 Matera fu la prima città meridionale a insorgere armata contro l'occupazione nazifascista, meritando la Medaglia d'Oro al Valor Civile. Nei primi anni Sessanta si apre il dilemma dei Sassi vuoti, percepiti dalle nuove generazioni come siti archeologici estranei anziché memoria familiare; il confronto tra demolizione e ripopolamento si risolve con la legge del 1967, che finanzia il risanamento conservativo. Il documentario si conclude con la trasformazione dei rioni da ferita sociale a patrimonio architettonico da rigenerare attraverso attività culturali e produttive, quale raccordo tra passato contadino e contemporaneità. - Programma di: Enrico Gras e Mario Craveri\nFotografia: Franco Castelli\nContenuto musicale: Franco Potenza \nVoce: Rolf Tasna\nConsulenza: Luca Pinna\n,"
- eventId: 994243
