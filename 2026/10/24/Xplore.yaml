- eventId: 974390
  start: 2026-10-24T11:50:00Z
  stop: 2026-10-24T13:20:00Z
  title: 'Bike Mike: Kenia, Uganda, Tansania mit Sansibar'
  subtitle: 'Bike Mike: Kenia, Uganda, Tansania mit Sansibar'
  description: Nach den großen Erfolgen von NAMIBIA - im Kino und SÜDAFRIKA - im Kino, war Filmemacher Michael Scharl und sein Team nun in Tansania, Sansibar, Uganda und Kenia unterwegs, um dort die schönsten Plätze sowie die grandiose Tierwelt mit der Kamera festzuhalten. OSTAFRIKA - im Kino heißt der neue Film, der diesen afrikanischen Landstrich auf Cinemascope Breitbild mit wuchtigem Surroundsound in die deutschen Kinos zaubert. Ein Augenschmaus für jeden Liebhaber afrikanischer Wildtiere und der einmaligen ostafrikanischen Lebensart. Mythische Orte wie die Serengeti, der Ngorongoro Crater, die Massai Mara oder etwa die weltweit nur noch knapp 1.000 Berggorillas in Uganda lassen sehnsüchtige Gedanken entstehen. Doch nicht nur migrierende Tiere soweit das Auge reicht, auch Begegnungen mit indigenen Naturvölkern, ökologische Trekkingerlebnisse mit Nashörnern und Schimpansen in deren natürlichem Habitat sowie die einzigartige Gewürzinsel Sansibar als faszinierendes Kontrastprogramm lassen ein lebendiges realistisches Bild der Region entstehen. Mit OSTAFRIKA im Kino entstand ein 90 minütiges Filmwerk, das diesen großartigen Landstrich mit all seinen unterschiedlichen abenteuerlichen Facetten zeigt. Kommen, sehen und erleben Sie. DE 2020
- eventId: 974391
  start: 2026-10-24T13:35:00Z
  stop: 2026-10-24T15:05:00Z
  title: 'Bike Mike: Botswana + Victoria Falls'
  subtitle: 'Bike Mike: Botswana + Victoria Falls'
  description: Südafrika und Botswana gehören neben Namibia zu den beliebtesten Zielen im Reiseparadies des Südlichen Afrikas. Zwei faszinierende Länder voller kultureller Dynamik, landschaftlicher Schönheit und einem grandiosen Tierreichtum. Schlagwörter wie Kapstadt, der Krüger N.P. oder etwa das Okavango Delta zaubern Weltenbummlern ein wohlwollendes Lächeln ins Gesicht. Zu diesen gehört seit über 15 Jahren auch Filmemacher Michael Scharl, der speziell für diese Produktion nochmals 3 Monate mit seiner Crew in Südafrika und Botswana verbrachte. Dabei besuchte die Crew alle touristischen Highlights und hielt sie in unzähligen Stunden 4 K Filmmaterial fest. In den heimischen Studios ist nun, nach monatelanger Sichtung, Auswahl und finaler Zusammenstellung, ein 90 minütiger Kinofilm entstanden, der den Betrachter auf eine eindrucksvolle Reise durch diese spektakuläre Region mitnimmt. DE 2018
- eventId: 974392
  start: 2026-10-24T15:20:00Z
  stop: 2026-10-24T16:50:00Z
  title: 'Bike Mike: Across down under'
  subtitle: 'Bike Mike: Across down under'
  description: AUSTRALIEN - Paradies am anderen Ende der Welt! Ein Land der Superlative und zwar in allen Belangen. Drei Zeitzonen, eine Staatsfläche in die Deutschland über 21 mal hineinpassen würde und eine Klimavielfalt von den feucht-heißen Tropen über trockene Wüstengebiete bis hin zu Regen- und gemäßigten Laubwaldgebieten. Eingefasst von über 25.000 km Küste leben auf dem 5. Kontinent neben rund 23 Mio. Australiern eine endemische Tierwelt angeführt vom Wappentier, dem allgegenwärtigen Känguru! Umwerfende Landschaftsszenerien, eine jahrtausende alte Kultur, moderne Millionenstädte und viel, viel rote Erde machen das Land einzigartig und prädestinieren Australien zum Urlaubsland No. 1 in Ozeanien. Das MGS Filmteam nahm genau dies zum Anlass den 5. Kontinent in den Monaten März bis Mai einmal zu durchqueren und all die unendlichen Schönheiten des Landes auf 4 K Filmmaterial zu bannen. Aus unzähligen Stunden Rohmaterial entstand nun ein 90-minütiger Film, der eine 10.000 km lange Reise vom südlichen Ende in Adelaide über das rote Zentrum bis hinauf ins tropische Darwin nachzeichnet. Australien, wie es wirklich ist ... erleben, genießen, träumen! DE 2016
- eventId: 974393
  start: 2026-10-24T17:05:00Z
  stop: 2026-10-24T18:04:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Slawonien / Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 5 - Slawonien / Kroatien mit Oliver Hörner
  description: Mit der Region Slawonien im Nordosten Kroatiens hat sich der beliebte Schauspieler Oliver Hörner diesmal eine weitgehend unbekannte Region Europas als Reiseziel ausgesucht. Doch der langjährige Hauptdarsteller der Fernsehserie "Die Rettungsflieger" fühlt sich sofort wie zuhause. Das liegt erstens an der - historisch bedingten - weiten Verbreitung der deutschen Sprache und zweitens an der unglaublichen Gastfreundschaft. Oliver Hörner beginnt seine Rundreise in der Stadt Osijek mit ihrer beeindruckenden Altstadt. Von dort aus erkundet er mit dem Naturpark "Kopacki rit" eines der größten Sumpfgebiete Europas. In der Region Baranja begeistert sich der Schauspieler an den mühevoll restaurierten Bauernhöfen. Und er begleitet den erfolgreichsten Paprika-Bauern bei seiner Arbeit. Sein Geschick mit der Angel beweist Oliver Hörner beim Fischen auf der Donau. Den erbeuteten Hecht bereitet er dann gemeinsam mit einem Koch in einem nahe gelegenen Restaurant zu. Mit einem Jeep und weiter auf dem Fahrrad geht es dann weiter durch die Weinberge Baranjas, auf dem europäischen Radfernweg 13. Auf Schloss Prandau-Mailath werden Oliver Hörner dann kulinarische und musikalische Spezialitäten präsentiert, bevor ein Besuch bei dem Weinanbaugebiet von Erdut folgt. Ein Highlight der Reise ist der Besuch des staatlichen Lipizzaner- Gestüts in Ivandvor. In Dakovo informiert er sich über Wesen und Formen der Pferdedressur, kann aber auch eine entspannte Kutschfahrt genießen. Nächste Station ist die pittoreske Innenstadt von Dakovo mit ihrer beeindruckenden Kathedrale und dem bischöflichen Weinkeller. Weinkenner schätzen die Qualität der slawonischen Winzer. Daher unternimmt Oliver Hörner eine Stippvisite ins Anbaugebiet von Ilok. Höhepunkt der Reise ist für ihn der Ort Babina Greda. Hier erfährt er eine Menge über das Brauchtum der Schokzen, einer Volksgruppe in Kroatien. DE 2020
- eventId: 974397
