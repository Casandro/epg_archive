  stop: 2026-10-24T19:06:00Z
  title: Deutschlands Küsten - Kiel nach Lübeck
  subtitle: Deutschlands Küsten - Kiel nach Lübeck
  description: Die siebte Folge führt entlang der Ostseeküste von Kiel nach Lübeck und folgt dabei maritimen Handelsrouten. Von Schweden und Norwegen kreuzen täglich große Fähren durch die Kieler Förde. Eine der letzten Bastionen alter Seefahrtsromantik ist das Schiffer-Café am Tiessenkai. Einmal in der Woche treffen sich hier Leute mit Fernweh, um beim Tango Argentino dem Alltag zu entfliehen. Südlich der Kieler Bucht beginnt die Halbinsel Wagrien. An der Steilküste von Stein lebt Birgit Rautenberg-Sturm, die einen besonderen Weg gefunden hat, die Geschichte der Küste als Druckgrafik zu erzählen. Sie verwendet Zinkplatten, die, eingenäht in Stoff, über Monate im Meer liegen. Rost, Algen und Salzwasser hinterlassen einzigartige Muster, die von der Künstlerin veredelt werden. Weiter geht es durch eine der schönsten Landschaften der Ostseeküste, die Holsteinische Schweiz, nach Gut Panker, seit dem Zweiten Weltkrieg die neue Heimat der Trakehner, einer alten Pferderasse aus dem ehemaligen Ostpreußen. Aus dem Helikopter ist Graswarder zu erkennen, eine mystische Lagunenlandschaft, gesäumt von reetgedeckten Häuschen. Landung ist auf Fehmarn, beim Leuchtturm Staberhuk. Abends versammeln sich hier Männer mit einem besonderen Jagdfieber. Stundenlang stehen die Fliegenfischer im Wasser und schwingen ihre Angel wie eine Peitsche. Und die Zwillingsbrüder Manfred und Jürgen Charchulla zeigen, wie man auf der idyllischen Insel den Kick der Geschwindigkeit findet. Als Surfopas unterrichten sie immer noch den Nachwuchs. Im Hubschrauber begleitet das Kamerateam den passionierten Segelflieger Klaus Grube entlang der Küstenlinie. Zwischenstopp ist der Niendorfer Hafen. Hier verkaufen Fischersfrauen in kleinen Buden fangfrische Meereschen, Steinbutt sowie Scholle und Johanna Orthmann ihre Töpferwaren. Von der Lübecker Bucht führt das letzte Stück der Etappe landeinwärts nach Lübeck, Stadt der sieben Türme. Im Rathaus ist die Pracht der Hanse und der reichen Pfeffersäcke von einst noch zu spüren. DE
- eventId: 974402
  start: 2026-10-24T19:15:00Z
  stop: 2026-10-24T20:07:00Z
  title: Deutschlands Küsten - Von Lübeck nach Rostock
  subtitle: Deutschlands Küsten - Von Lübeck nach Rostock
  description: Die achte Folge der Dokumentationsreihe "Deutschlands Küsten" folgt den Spuren der alten Hanse. Es geht von Lübeck bis nach Rostock. Im Lübecker Hafen liegt die "Lisa von Lübeck", ein Dreimaster nach mittelalterlichem Vorbild. Weder Wrackfunde noch Baupläne gab es, an denen Charly Brüser und seine Mitstreiter vom Museumshafen sich beim Nachbau hätten orientieren können. Stolz bläht die Kraweel heute ihre Segel. In der Lübecker Bucht fahren heute die Skandinavienfähren in die Trave ein. Am Brodtener Ufer finden sich geheimnisvolle Blumen in der Brandung. Sie sind die Überreste von Seebestattungen, die hier regelmäßig stattfinden. Der Architekt Georg Conradi begleitet Menschen auf ihrer letzten Fahrt. Von Travemünde geht der Flug Richtung Mecklenburg-Vorpommern. Nahe der Küste liegt Schloss Bothmer. Restaurator Andreas Baumgart versucht, unter den Farbschichten der Jahrhunderte das wahre Gesicht des Schlosses frei zu legen. Nur wenige Kilometer weiter in Boltenhagen arbeitet Rettungsschwimmerin Elisa Kostyra, die vor den Gefahren der Ostsee durch Unterströmung warnt. Über Wismar geht es zum Salzhaff, dem Revier der draufgängerischen Kitesurfer. Etwas weiter nordöstlich liegt das Fischerdorf Rerik. Früh am Morgen herrscht im Hafen schon reges Treiben. Doch die Bestände sind minimiert, die Preise niedrig, so dass die Fischerei hier eine aussterbende Zunft ist. Auf dem Weg nach Osten erstrahlt das Seebad Heiligendamm als klassizistisches Gesamt-Kunstwerk. Schon im 18. Jahrhundert reisten Gäste sogar aus Russland an, um die Sommerfrische zu genießen. Letzte Station der Reise ist Rostock. Am Hafen bricht Berufstaucher Eyk-Uwe Pap zu einer schwierigen Unterwasser-Operation auf. Er soll die Messstation Darßer Schwelle warten, mit der Daten zur Klimaveränderung gewonnen werden. Mit Luftaufnahmen der Nikolaikirche in Rostock endet die achte Folge von "Deutschlands Küsten". DE 2010
- eventId: 974403
  start: 2026-10-24T20:15:00Z
  stop: 2026-10-24T20:44:00Z
  title: Foodwise - Hangzhou Teil 1
  subtitle: Foodwise - Hangzhou Teil 1
  description: In dieser Folge sind Tianran und Hannah in Hangzhou, einer Stadt mit über 2000-jähriger Geschichte und Hauptstadt zweier alter chinesischer Dynastien. Vom berühmten Westsee bis zum köstlichen Drachenbrunnentee erleben unsere Gastgeber die wichtigsten Sehenswürdigkeiten Hangzhous, genießen die lokale Küche und probieren alles von Wintermelonen in Schweinebauchform über nach den Prinzipien der Traditionellen Chinesischen Medizin zubereitete Speisen bis hin zu buddhistischen Nudeln und Zen-Tee. CN 2023
- eventId: 974404
  start: 2026-10-24T20:45:00Z
  stop: 2026-10-24T21:15:00Z
  title: Foodwise - Hangzhou Teil 2
  subtitle: Foodwise - Hangzhou Teil 2
  description: In dieser Folge setzen Tianran und Hannah ihre Tee-Verkostungsreise entlang des Qiantang-Flusses in Hangzhou fort und erkunden die historische Kultur und die kulinarischen Köstlichkeiten der Region. Sie fahren zum Anding-Berg und genießen auf dem Gipfel nebligen Tee. In der Altstadt von Longmen tauchen sie in die traditionelle chinesische Clankultur ein und genießen "Sun Quan Seitan". Im gentrifizierten Dorf Shishe verliebt sich Hannah in "Graue Suppenreisklöße", während Tianran am Qiandao-See den besten Fischkopf und Beluga-Kaviar seines Lebens probiert. Ihre Reise endet mit einer Tasse Jiukeng-Tee und einem Besuch uralter Teebäume. CN 2023
