  title: Live aus der Deutschen Oper Berlin
  subtitle: 'Moderation: Anja Herzog'
  description: |-
    Richard Wagner
    Der fliegende Holländer

    Tareq Nazmi, Daland
    Ausrine Stundyt_, Senta
    Attilio Glaser, Erik
    Stephanie Wake-Edwards, Mary
    Omar Mancini, Steuermann Dalands
    Tomasz Konieczny, Der Holländer
    Shlomi Moto Wagner, Erzähler
    Chor der Deutschen Oper Berlin
    Orchester der Deutschen Oper Berlin
    Giedr_ Slekyt_, Musikalische Leitung

    "Der fliegende Holländer" ist die erste Oper von Richard Wagner, die Milo Rau inszeniert. Er nutzt die romantsiche Oper als Ausgangspunkt für eine Reise in die politischen Tiefenschichten der deutschen Nachkriegsgeschichte. Im Zentrum steht der verfluchte Seemann, der nur durch die Treue einer Frau Erlösung finden kann - und in Senta eine obsessiv entschlossene Verbündete findet. In der Inszenierung verbinden sich ideologisch aufgeladene Motive mit Fragen nach Schuld, Erinnerung und Versöhnung. Und es geht auch um die Beziehung zwischen Deutschland und Israel. Die Partitur wird dabei zum Denkraum über Rezeption und Verantwortung. Die Dirigentin Giedr_ Slekyt_, gibt damit ihr Wagner-Debüt an der Deutschen Oper Berlin. In den Hauptrollen sind Tomasz Konieczny als Holländer und Ausrin_ Stundyt_ als Senta zu erleben.

    Moderation: Anja Herzog
