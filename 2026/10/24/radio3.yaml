  title: Der Gute Salon
  subtitle: mit Petra Gute
  description: "Zu Gast: Christian Spuck, Intendant des Staatsballetts Berlin\n\nDie rbb-Kulturjournalistin Petra Gute begrüßt in ihrem Salon in der radio3 Dachlounge illustre Gäste aus der vielfältigen Berliner und Brandenburger Kulturlandschaft. Zu Gast sind Intendantinnen und Intendanten, Schauspielerinnen und Schauspieler, Sängerinnen und Sänger, Autorinnen und Autoren. Dabei soll es nicht nur über ihre Kunst und neue Produktionen gehen, sondern darüber hinaus um den Menschen hinter der offiziellen Funktion.\nZu Gast ist diesmal Christian Spuck, Intendant des Staatsballetts Berlin. Er ist ausgebildeter Ballett-Tänzer, Choreograf und Regisseur und seit der Spielzeit 2023/2024 Intendant des Berliner Staatsballetts, unter ihm ist das Staatsballett, mit seinen 80 Tänzerinnen und Tänzern aus rund 30 verschiedenen Nationen die größte Ballett-Kompagnie Deutschlands und die Einzige, die ihr vielseitiges Repertoire auf drei Opernbühnen der Stadt zeigt, so erfolgreich wie nie zuvor: zum dritten Mal hintereinander wurde das Staatsballett vom Fachmagazin \"Tanz\" auf den Spitzenplatz gehoben und als \"Glanzlicht\" ausgezeichnet, Christian Spuck wurde zudem in diesem Jahr mit dem Tanzpreis 2026 geehrt.\nChristian Spuck begeistert mit der Verbindung aus klassischem und zeitgenössischem Ballett ein breites Publikum, alle Vorstellungen sind durchgehend ausverkauft. Rechtzeitig zur Weihnachtszeit wird er eine neue Version des Tschaikowsky-Klassikers \"Der Nussknacker\" auf die Bühne der Deutschen Oper bringen. \nDas Publikum erwartet gute Gespräche und Live-Musik und -Performance, es geht um aktuelle und kommende Produktionen, vor allem aber geht es um die Menschen hinter den offiziellen Funktionen.\n\nAufnahme vom 14.10.2026 aus dem Haus des Rundfunks\n\nModeration: Petra Gute"
