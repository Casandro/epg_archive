- eventId: 1405613
  start: 2026-10-24T16:00:00Z
  stop: 2026-10-24T17:00:00Z
  title: Eine Stunde reden
  description: 'Thomas Schwabe (47) hat es vom Arbeiterkind zum Akademiker geschafft. In Greifswald wächst er in einfachen Verhältnissen auf und macht eine Maurerlehre, die er als Qual erlebt. Er wird Krankenpfleger und arbeitet zwölf Jahre in der ambulanten Pflege. "Aber wenn die Routine zu routiniert wird, muss ich etwas anderes machen", erzählt er Host Mario Neumann im Bremen-Zwei-Podcast "Eine Stunde reden". Der Wahlbremer holt sein Abitur nach und studiert mit 31 Jahren Biologie und Politik auf Lehramt. Seine große Liebe aber ist die Musik: Er singt und spielt Bass in einer Irish-Folk-Band. Diese Leidenschaft kann er seit Kurzem auch in den Schulalltag einbringen, denn dank einer Weiterbildung ist er nun auch Musiklehrer.'
  subtitle: mit Mario Neumann
