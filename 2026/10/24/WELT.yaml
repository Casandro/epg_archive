  title: 'Border Patrol Südamerika: Auf Krawall gebürstet'
  subtitle: 'Border Patrol Südamerika: Auf Krawall gebürstet'
  description: 'Am Flughafen von Santiago de Chile stehen die Grenzschützer vor gleich mehreren Herausforderungen: Ein Haitianer verliert die Fassung, als ihm wegen fehlender Visa der Weiterflug verweigert wird. Zeitgleich sorgt eine verdächtige Lieferung aus Mexiko für Alarm bei der Zollkontrolle, und zwei junge Reisende geraten ins Visier der Sicherheitskameras, als sie ein Souvenir entwenden wollen. Drei Situationen, die zeigen, wie schnell Routine zur Bewährungsprobe wird.'
  widescreen: true
- eventId: 967523
  start: 2026-10-24T14:07:00Z
  stop: 2026-10-24T14:36:00Z
  title: 'Border Patrol Südamerika: Seifenoper am Flughafen'
  subtitle: 'Border Patrol Südamerika: Seifenoper am Flughafen'
  description: 'Am Flughafen von Santiago de Chile läuft der Einsatz der Anti-Drogen-Brigade auf Hochtouren: In einem Koffer aus Brasilien entdecken Röntgenkontrolleure verdächtige Gegenstände - 36 Seifenstücke für eine zehntägige Reise. Ein weiterer Passagier fällt durch auffällige Nervosität auf, sein Hintergrund weist auf organisierte Kriminalität hin. Währenddessen schlägt ein Spürhund am Frachterminal an - ein vermeintlich harmloses Lebensmittelpaket entpuppt sich als außergewöhnlicher Fund.'
  widescreen: true
- eventId: 967524
  start: 2026-10-24T14:36:00Z
  stop: 2026-10-24T15:07:00Z
  title: 'Border Patrol Südamerika: Jetzt schlägt''s dreizehn'
  subtitle: 'Border Patrol Südamerika: Jetzt schlägt''s dreizehn'
  description: 'Am Flughafen von Santiago de Chile erleben die Beamten einen ereignisreichen Tag: Ein Reisender aus Spanien sorgt mit überladenem Gepäck für Aufsehen - unter Kleidung und Souvenirs verbergen sich Luxusgüter in verdächtiger Menge. Ein junger Mann kehrt nach einer Abschiebung aus den USA zurück und muss sich seiner Vergangenheit stellen. Währenddessen spürt die Spürhundestaffel am Frachtterminal verdächtige Sendungen auf - ihr Instinkt führt die Ermittler auf eine heiße Spur.'
  widescreen: true
- eventId: 967525
  start: 2026-10-24T15:07:00Z
  stop: 2026-10-24T15:34:00Z
  title: 'Border Patrol Südamerika: Gefährliche Mission'
  subtitle: 'Border Patrol Südamerika: Gefährliche Mission'
  description: Das Gepäck einer Passagierin weckt Verdacht - doch erst die Röntgenuntersuchung bringt Erschreckendes ans Licht. Ein junger Mann kehrt mit Übergepäck aus Europa zurück und reagiert aggressiv auf die Kontrollen. Gleichzeitig entdecken die Zöllner eine Lieferung Medikamente, deren Einfuhr ohne Genehmigung erfolgt. Jeder Fund kann den entscheidenden Hinweis auf ein weit größeres Netzwerk liefern.
  widescreen: true
- eventId: 967526
