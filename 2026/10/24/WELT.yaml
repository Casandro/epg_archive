  title: Der Luxus-Camper - Freiheit auf Rädern
  subtitle: Der Luxus-Camper - Freiheit auf Rädern
  description: Obwohl Wohnmobile kein günstiges Vergnügen sind, boomt der Camping-Markt. Die Flexibilität und Freiheit eines Urlaubsdomizils auf Rädern reizt viele Reiselustige. Besonders hochwertige Modelle können je nach Ausstattung mehr als 100.000 Euro kosten. Welche Ausführungen gibt es und wie werden die fahrenden Ferienhäuser hergestellt? Die Reportage zeigt die Fertigung eines Luxus-Wohnmobils.
  widescreen: true
- eventId: 967538
