  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  description: Entlang der texanisch-mexikanischen Grenze stehen die US-Grenzbeamten täglich vor enormen Herausforderungen. An einem der meistfrequentierten Übergänge führt ein verdächtiges Röntgenbild zu einem riskanten Einsatz, bei dem Drogen raffiniert versteckt sind. Währenddessen gelingt ein spektakulärer Schlag gegen den Drogenschmuggel, und an einer weiteren Grenzbrücke spitzt sich die Lage zu, als Migranten versuchen, die Absperrungen zu überwinden.
  widescreen: true
- eventId: 967490
  start: 2026-10-24T01:09:00Z
  stop: 2026-10-24T01:57:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 13'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 13'
  description: An der Grenze zwischen Texas und Mexiko prallen gegensätzliche Welten aufeinander. Grenzbeamte stehen vor der täglichen Aufgabe, Sicherheit und Menschlichkeit in Einklang zu bringen. In dieser Folge bittet eine von einer berüchtigten Gang aus Honduras vertriebene Familie um Asyl. Gleichzeitig decken Beamte einen großen Drogenschmuggel auf und stoßen bei einer Kontrolle auf ein perfides Schleusernetz, das von einer schwangeren Mutter angeführt wird.
  widescreen: true
- eventId: 967491
  start: 2026-10-24T01:57:00Z
  stop: 2026-10-24T02:45:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 14'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 14'
  description: Die texanisch-mexikanische Grenze ist einer der sensibelsten Orte der Welt. Hier treffen Drogenkartelle auf den lukrativsten Markt der Erde. Die Doku begleitet Grenzbeamte an internationalen Brücken, die täglich über Schicksale entscheiden. In dieser Folge sorgt ein allein reisender Junge mit widersprüchlicher Geschichte für Zweifel, während zwei Schwestern nach einem gewalttätigen Zwischenfall festgehalten werden.
  widescreen: true
- eventId: 967492
  start: 2026-10-24T02:45:00Z
  stop: 2026-10-24T03:29:00Z
  title: Abgefahren - Die spektakulärsten Dashcam Clips (1.7)
  subtitle: Abgefahren - Die spektakulärsten Dashcam Clips (1.7)
  description: 'Nie war auf den Straßen der Erde mehr los als heute: Mehr als eine Milliarde Autos kurven auf unserem Globus inzwischen umher. Dazu kommen Fußgänger, Zweiräder und andere Fahrzeuge. Wen wundert es da, dass es immer mehr Unfälle gibt. Und immer mehr Kameras, die diese festhalten. Die Doku-Reihe zeigt die spektakulärsten und irrwitzigsten Bilder von Karambolagen zwischen China und Chile, Kanada und Kapstadt. Unglaublich, aber wahr: Ernstlich verletzt wurde dabei niemand.'
  widescreen: true
