  title: WELT Musikergrillen
  subtitle: 'Gast: Thomas Anders'
  description: Wenn der Duft vom Grill über den Dächern Berlins liegt, entstehen Gespräche, die man sonst nicht hört. Bei Musikergrillen treffen die Journalistinnen und Journalisten von WELT und ROLLING STONE auf die spannendsten Musikerinnen und Musiker des Landes. Abseits klassischer Interviews geht es um die Geschichten hinter der Musik, persönliche Erfahrungen, Wendepunkte und das, was Künstlerinnen und Künstler wirklich antreibt.
