  title: Die spektakulärste Achterbahn Europas entsteht
  subtitle: Die spektakulärste Achterbahn Europas entsteht
  description: Für den belgischen Freizeitpark Plopsaland De Panne entsteht in Waldkirch im Schwarzwald einer der modernsten und extremsten Spinning Coaster der Welt. Hierbei drehen sich die Wagen horizontal auf einer vertikalen Achse. Für das komplexe Fahrgeschäft müssen 723 Tonnen Material geschweißt, transportiert und schließlich vor Ort zusammengesetzt werden - ein logistischer Kraftakt. Dafür entstehen 98 Schienenteile in sogenannter Fachwerkstruktur, die teilweise in Handarbeit gefertigt werden.
  widescreen: true
