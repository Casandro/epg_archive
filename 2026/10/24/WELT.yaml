  title: PS-Schnäppchen - Oldtimer aus den USA
  subtitle: PS-Schnäppchen - Oldtimer aus den USA
  description: 'In Dallas, im US-Bundesstaat Texas, findet eine große Fahrzeug-Auktion statt: Rund tausend Pkw werden hier in vier Tagen versteigert. Zu den bekanntesten Auto-Verkäufern in den Vereinigten Staaten gehört Alex Manos. Sein Geschäft in Los Angeles vertreibt Oldtimer rund um den Globus. Erfahren im Einkauf von US-amerikanischen Oldtimern ist Dieter Thiel aus Wuppertal, der die historischen Fahrzeuge für seine Kunden erwirbt. Die Reportage gibt einen Einblick in den Handel mit Oldtimern aus den USA.'
  widescreen: true
- eventId: 967539
  start: 2026-10-24T20:05:00Z
  stop: 2026-10-24T21:05:00Z
  title: Gigant auf Rädern - Der Panzer-Transporter
  subtitle: Gigant auf Rädern - Der Panzer-Transporter
  description: Mit einer Leistung von 680 PS gehört der HX81 zu den stärksten Zugmaschinen überhaupt. Fast zehn Meter lang und 23 Tonnen schwer ist der "Elefant", wie er in der Bundeswehr heißt. Es ist die einzige Zugmaschine, die einen Kampfpanzer Leopard 2 problemlos bergen, ziehen und transportieren kann. Die Reportage gewährt einen Einblick in die Fertigung des HX81 im Werk in Wien und zeigt seinen Einsatz in einer Gefechtsübung.
  widescreen: true
