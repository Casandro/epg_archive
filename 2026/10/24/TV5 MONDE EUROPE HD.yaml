  title: 'Kader Attou, Soufiane Guerrab, Nadia Henni-Moulaï, Serge Najjar '
  subtitle: 'Depuis des années, Kader Attou poursuit son travail fait de rencontres, de métissages et de transmission. Il présente « Un petit p '
  ageRating: 7
  description: "Kader Attou, Soufiane Guerrab, Nadia Henni-Moulaï, Serge Najjar\n\n« Faire Méditerranée aujourd'hui, c'est aussi résister. C'est proposer des paroles et des actes qui rassemblent. » Tel est le credo de Kader Attou. Depuis des années, le danseur et chorégraphe poursuit son travail fait de rencontres, de métissages et de transmission. Son spectacle « Un petit pas de trop » est à voir jusqu'au 1er novembre 2026 à La Scala Paris ; le 20, à Maisons-Alfort ; le 25, à Bagneux ; les 14 et 15 janvier, à Charleroi. Sa création « Prélude In » est actuellement en tournée.\n\nTout juste de retour du Maroc, Soufiane Guerrab affiche un agenda bien rempli, du grand au petit écran. Au cinéma, il a tenu le rôle principal dans « Bombonera », de Syrine Boulanouar. Le 23 octobre 2026, il retrouve sur Netflix son personnage d'inspecteur dans la quatrième partie de « Lupin », portée par Omar Sy. \n\nAprès « Un rêve, deux rives », Nadia Henni-Moulaï poursuit son travail autour de l'histoire algérienne, de l'immigration et de la transmission entre générations. Paris, 1920. Le Petit Pot est bien plus qu'un café : derrière le zinc, Mohamed Belkacem, immigré algérien devenu citoyen français, milite au Parti communiste, écrit pour une revue clandestine, éveille les consciences, transmet ses convictions à sa fille... « Sur la brèche » (éditions Arcane 17) revient sur les prémices d'un mouvement qui conduira, quelques décennies plus tard, à l'indépendance de l'Algérie. \n\nAvocat, passionné de photographie, Serge Najjar photographie depuis plus de dix ans l'architecture, le béton et les chantiers de construction du pays du Cèdre. Ses clichés sont à découvrir jusqu'au 17 janvier 2027 à l'IMA de Tourcoing. Un reportage de Pascale Achard, Gérald Breistroff et Sébastien Dufour.\n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Kader Attou, danseur et chorégraphe ; Soufiane Guerrab, acteur ; Nadia Henni-Moulaï, journaliste et écrivaine\n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
