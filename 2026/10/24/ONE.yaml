  description: 'Der Neuntklässler Lukas (Levy Rico Arcos) wächst in der "Platte" der Berliner Gropiusstadt auf: Schule nervt, zu Hause nur Stress. Von den Gangs im Park möchte er sich fernhalten. Sein großmäuliger Kumpel Julius (Vincent Wiemer) legt sich jedoch beim Graskaufen mit den "Arabern" an - und löst eine brutale Schlägerei zwischen Jugendgangs von Djamel (Wael Alkhatib) und Cem (Lucio101) aus. Am Ende muss ausgerechnet Lukas dafür bezahlen: Die "Araber" verlangen 500 Euro als Wiedergutmachung. Wo soll Lukas, dessen Vater (Jörg Hartmann) arbeitslos ist, so viel Geld herbekommen?'
