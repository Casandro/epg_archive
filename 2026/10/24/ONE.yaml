  description: "Susanne Mertens hat sich nach Christophs Tod vor fast einem Jahr beruflich neu aufgestellt. Sie arbeitet jetzt als mobile Tierärztin. Das bringt allerdings diverse Schwierigkeiten mit sich: stockende Zahlungen der Kunden, finanzielle Außenstände, Ärger mit der Bank. Es ist der tägliche Kampf einer Freiberuflerin. \nIhre Tochter Luisa wohnt immer noch zu Hause und hat mittlerweile eine Freundin: Isabel. Die beiden planen zusammenzuziehen, wovon Susanne erst mal besser nichts wissen soll. Schonung ist geboten."
