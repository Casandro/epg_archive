  description: "Isa von Brede hat den chronisch klammen Markus Gellert zum Partner in der Rechtsanwaltskanzlei gemacht. Und die Kanzlei Brede und Gellert ist in neue Räume umgezogen, die Markus Gellert ausgesucht hat. Rechtsanwaltsgehilfin Yasmin und Reinigungsfachkraft Gudrun sind wenig begeistert von dem neuen, klaren Look, den Gellert der Kanzlei mit diesen Räumen verordnet hat. \n\nAlles ist auf Neuanfang gestellt, wäre da nicht der Prozess gegen Egin, Isa von Bredes Bruder. Egin hat einen Geldeintreiber getötet und danach versucht, Isa den Mord anzuhängen. Unter Druck hat er den Mord zugegeben. Jetzt aber droht er, sein Geständnis zu widerrufen."
