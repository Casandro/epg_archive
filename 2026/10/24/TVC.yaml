  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2010
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Para przyłapana z trzema kilogramami kokainy w bagażu podręcznym twierdzi, że została wrobiona przez służby celne. Narkotyk ten zostaje też znaleziony w Manchesterze, w torbach należących do znanego szefa kuchni. Mężczyzna w końcu przyznaje się, że nosi również kokainę w spodniach.
