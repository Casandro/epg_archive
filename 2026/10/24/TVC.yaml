  - 879043
  start: 2026-10-24T08:30:00Z
  stop: 2026-10-24T09:35:00Z
  title: Celnicy 2 (odc. 3)
  subtitle: Pasażerka ma na sobie 3 kilogramy kokainy. Zostaje aresztowana, ale nie jest przy tym ugodowa. Funkcjonariusze zatrzymują mężczyznę podróżującego z małym chłopcem. Nie jest on ojcem dziecka.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2010
    Reżyseria: Andrew Zikking
    Występują: Jon Rand
    Na lotnisko Gatwick przylatuje samolot z Montego Bay. Podczas rutynowej kontroli pasażerów funkcjonariusze graniczni znajdują paczkę, która wygląda, jakby zawierała narkotyki. Kobieta ma na sobie body, w którym ukryte są prawie 3 kilogramy kokainy. Pasażerka zostaje aresztowana, ale wpada w szał i musi zostać powstrzymana przez funkcjonariuszy. W Manchesterze zostaje złapany przemytnik przewożący prawie 50 tys. papierosów.
  ageRating: 12
  genre:
