  title: '12 podmienok dedičstva: Nekompromisný odkaz (3)'
  description: 'Po tom, čo milionár Jason Stevens (Logan Bartholomew) prežil mnohé tragédie a ohrozenia vlastnej rodiny, musí pomôcť svojmu mladému priateľovi Hawthornovi (Doug Jones), aby aj on dokázal prekonať podobné nástrahy a zvládol neľahkú cestu životom. Jeho misia zanechá zaujímavý odkaz. Ak sa naučíme niečo nové, zmení nám to život. Ak budeme učiť druhých, zmeníme život niekomu inému. A keď naučíme ľudí, aby učili iných, zmeníme celý svet... Mladý Hawthorne sa práve zoznámil s poslednou vôľou svojej nedávno zosnulej babičky, v ktorej mu prenecháva obrovskú časť dedičstva. Má to však háčik. Mladý ľahkovážny muž musí najprv dokázať, že je dedičstva hodný a dokáže sa o veľký majetok zodpovedne postarať. Hawthorna však ešte čaká jedna veľká úloha - najskôr sa bude musieť vyrovnať so svojou minulosťou vetroplacha a presvedčiť sa, že prijať životné výzvy a chlapsky čeliť problémom je jedinou cestou ku skutočnej slobode. Réžia: Joanne Hock. Účinkujú: Myko Olivier (Joey Anderson), Ali Hillisová (Alexia Stevens), Logan Bartholomew (Jason Stevens), Doug Jones (Hawthorne), Bill Cobbs (Theodore Hamilton) (2016)'
