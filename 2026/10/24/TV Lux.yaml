  title: Peter medzi nami
  subtitle: Katechézy a príhovory pápeža Františka.
  description: Pokrok musí usmerňovať láska, aby slúžil dôstojnosti človeka. Technický a vedecký pokrok sa stáva skutočne ľudským vtedy, keď ho usmerňuje láska a slúži všetkým, najmä k tým najviac znevýhodneným. Zdôraznil to pápež Lev XIV. pri generálnej audiencii v stredu 23. septembra, keď pokračoval v katechézach o konštitúcii Gaudium et spes. Pripomenul, že človek sa stretáva s Bohom aj prostredníctvom každodennej práce.
