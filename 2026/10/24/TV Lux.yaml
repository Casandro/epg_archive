  title: Misia
  subtitle: Dej výpravného príbehu sa odohráva v roku 1750 v španielskych a portugalských kolóniách Južnej Ameriky. Obchodník s otrokmi (Robert de Niro) je obávaný pre svoju vznetlivú povahu.
  description: 'Príbeh sa odohráva v roku 1750 v španielskych a portugalských kolóniách v Južnej Amerike. Obchodník s otrokmi (Robert de Niro) je má prudkú povahu. V bitke o manželku zabije svojho brata, ale neskoršie výčitky svedomia ho prinútia hľadať spôsob, ako odčiniť svoju vinu. Vydáva sa na nebezpečnú misionársku cestu spolu s kňazom Gabrielom (Jeremy Irons). Film získal Oscara za najlepšiu kameru a Zlatú Palmu. Hudbu k filmu zložil známy filmový skladateľ Ennio Morricone. Réžia: Roland Joffé. Účinkujú: Robert De Niro (Rodrigo Mendoza), Jeremy Irons (Otec Gabriel), Ray McAnally (Kardinál Altamirano), Aidan Quinn (Felipe Mendoza), Cherie Lunghi (Carlotta) (1986)'
