  title: Moja misia - magazín XXVI (15)
  subtitle: Kňaz vojakom. Dokumentárny film zo života misionárov a následný rozhovor, aktualizujúci udalosti z filmu.
  description: V ďalšej relácii Moja misia magazín si predstavíme slovenského kňaza, ktorý pôsobil ako vojenský kaplán v Kanadskej armáde a dnes pokračuje vo svojej službe v rámci Ordinariátu Ozbrojených síl a ozbrojených zborov Slovenskej republiky. Ako vyzerá život kňaza medzi vojakmi? Čo prináša služba na zahraničných misiách a ako sa v náročných podmienkach mení pohľad človeka na vieru, domov či poslanie? O svoje skúsenosti zo služby medzi vojakmi a zo zahraničných misií sa s nami podelí František Krušinský. (2026)
