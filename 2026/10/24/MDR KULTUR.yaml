  description: "* 12:15 Uhr - Studierendenprojekt - Mozarts \"Hochzeit des Figaro\"\nEinmal auf der Opernbühne! Diesen Traum haben sich Lehramts-Studierende der ML Uni Halle mit ihrer Fassung von W.A. Mozart's \"Hochzeit des Figaro\" erfüllt. Bettina Volksdorf war dabei.  Von Bettina Volksdorf\n\n* 12:30 Uhr - Wetter & Verkehr\n\n* 12:45 Uhr - Vorschau: Studiosession Panacea - Celine Cairo\nDas dritte Album der Musikerin Celine Cairo heißt \"Panacea\" -  und das steht für das mythologische Allheilmittel Panakeia,  nach dem  Alchimisten Jahrhunderte gesucht haben. Es soll alle Krankheiten heilen, Menschen von ihren Sorgen befreien und unendliches Leben schenken. Während der Arbeit an dem Album fand die Musikerin ihre Art von Heilung und Selbstfindung im Studio und auf einer langen Reise. Darüber spricht sie mit MDR Kultur Musikredakteur Jan Kubon und spielt akustische Versionen ihrer aktuellen Songs. \n\n* 13:15 Uhr -  Schülermusical \"MARGAS TRAUM\" \n\"MARGAS TRAUM\" - DIE MUSICALWOCHE IN BAD ELSTER!\nNeues Schülermusical: Premiere am Europäischen Tag der Historischen Theater\nVon Wolfgang Schilling\n\n* 13:30 Uhr - Wetter & Verkehr \n\n* 13:45 Uhr - Hollywood-Star Jeff Bridges hat einen Traum\nTreffen sich zwei Hessen und ein Hollywoodstar... Was so klingt, wie der Anfang eines schlechten Witzes, ist die unglaubliche Geschichte von Charys Schuler und Marwan El- Mozayen aus dem mittelhessischen Bad Nauheim und einer echten Hollywoodgröße: Jeff Bridges. Gemeinsam möchten sie eine alte Panoramakamera wieder zum Leben erwecken. Die ganze Geschichte gibt es heute in der neuen ARD Doku \"Jeff Bridges' Analoges Abenteuer\".  Antonia Troschke hat bereits reingeschaut."
