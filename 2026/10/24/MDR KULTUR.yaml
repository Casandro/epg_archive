  description: "* 14:10 Uhr - Die großen Fragen in 10 Minuten: \"Kommt ein neuer großer Krieg?\"\nDie Welt scheint aus den Fugen geraten. Krisen, Kriege, Katastrophen. Wo man hinschaut. Die Frage ist, wo führt das hin? Kriegen wir die Dinge, die in unseren Händen liegen, überhaupt noch eingefangen? Schaffen wir das - bspw. die Kriege, die gerade außer Kontrolle geraten zu scheinen - noch zu begrenzen?  Oder eskaliert das immer weiter? Bis hin zu der Frage, ob das alles in einen neuen großen Krieg mündet: In einen Konflikt zwischen NATO und Russland? Diese Frage treibt auch Wissenschaftsjournalisten Karsten Möbius um. \n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Joel Ross - Das Evangelium auf dem Vibraphon\nDie Leipziger Jazztage gehen am Sonntag mit Jazz für Kinder zu Ende. Heute ((am Sonnabend)) gibt es aber nochmal ein großes Highlight. Aus Illinois/USA der Vibraphonist Joel Ross. Er reiht sich in eine sehr spannende Welle des aktuellen US-amerikanischen Jazz ein: Virtuos schnell, melodiös und handwerklich auf höchstem Niveau. \nDer 1995 geborene Joel Ross hat mit den größten seines Business gespielt: Herbie Hancock, Wynton Marsalis und viele mehr. Zur Entstehung seines mittlerweile 5. Albums Julia Hemmerling.\n\n* 15:15 Uhr - Soundtrack des neuen Films \"Sinn und Sinnlichkeit\"\nGut 30 Jahre nach der erfolgreichen Verfilmung von Janes Austens \"Sinn und Sinnlichkeit\" von Ang Lee mit Emma Thompson und Kate Winslet - ist jetzt t eine neue Verfilmung des Bestellers im Kino zu sehen.\n\"Sinn und Sinnlichkeit\"  hat alles, was ein romantisches Drama braucht - dazu die  englischen Landschaft, die Kostüme, die schicksalhaften Begegnungen der Geschlechter .Und klar die Musik spielt eine wichtige Rolle. Thomas Hartmann stellt den die Filmmusik von  Roger Goula vor.\n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:45 Uhr - Zeitumstellung verschieben oder streichen?\nHeute Nacht ist es wieder soweit: Wir drehen die Uhr eine Stunde zurück auf die Winterzeit. Viele würden dieses Hin und Her am liebsten ganz abschaffen, andere wollen es neu denken - zum Beispiel mit einer kürzeren Sommerzeit. Julia Nestlen aus der ARD-Wissenschaftsredaktion hat sich angeschaut, was die Forschung dazu sagt - und was Menschen von Winterzeit und Sommerzeit halten.\n\n* 15:50 Uhr - Hinweis: MDR Diskurs mit Gwendolyn Sasse\nWelche Meinung haben die Deutschen von Russland und seinem autokratischen Präsidenten Wladimir Putin? Und wie weit gehen die Meinungen darüber auseinander? Darum geht es heute Abend im Diskurs mit der Politologin Gwendolyn Sasse, die zu diesen Fragen von 2019 bis Ende 2025 drei große Umfragen durchgeführt hat. Die Ergebnisse sind zum Teil erstaunlich: Denn wenn die Deutschen über Russland sprechen, so das Fazit, dann sprechen sie weniger über die realen Verhältnisse dort als vielmehr über ihre eigenen Hoffnungen, Ängste und Befindlichkeiten. Und noch etwas ist interessant: Weil es ja oft heißt, die Meinungen über Putin und seinen Krieg gegen die Ukraine gegen in Ost und West auseinander. Tatsächlich ist es aber so, dass sich in Deutschland kaum noch jemand Illusionen über den Charakter von Putins Herrschaft macht. Nur bei der Schlussfolgerung daraus gibt es wiederum Differenzen, meint die Politologin Gwendolyn Sasse."
