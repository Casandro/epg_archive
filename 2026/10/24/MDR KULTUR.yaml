  description: |-
    * 09:40 Uhr - Wort zum Tag

    * 09:50 Uhr - Kulturtipps

    * 10:15 Uhr - "Der Name der Rose" am Puppentheater Halle
    Umberto Ecos Weltbestseller »Der Name der Rose« kommt ab 23. Oktober in Halle als Puppentheater auf die Bühne - und erhält dafür mehr Platz. Im Rahmen der erweiterten Partnerschaft zwischen der Theater, Oper und Orchester GmbH Halle (TOOH) und der Stadt Halle (Saale) wird das ehemalige Thalia Theater (am Puschkinhaus) künftig intensiver genutzt. Damit können für die stark nachgefragten Produktionen des Puppentheaters Halle zusätzliche Plätze angeboten werden. Eine Kritik von Stefan Petraschewsky.

    * 10:30 Uhr - Feuilleton, Wetter & Verkehr
    Von Wolfgang Schilling

    * 10:40 Uhr - Der Stichtag: 1806 Erste französische Truppen erreichen Berlin
    Als die Franzosen im Oktober 1806 in Berlin einrückten, da beherrschte die Stadt vor allem Neugier und Aufregung. Das sollte sich im Zuge der zahlreichen Einquartierungen, der hohen Kosten wandeln. Und der Raub der Quadriga auf dem Brandenburger Tor, ihre Entführung nach Paris, die wurde von den Berlinern als Schmach und Demütigung empfunden. Der Stichtag. Von Thomas Hartmann.

    * 10:50 Uhr - Das Gedicht: "Zeit" von Ludwig Tieck
    In der kommenden Nacht werden die Uhren um eine Stunde zurückgedreht. Und uns wird eine Stunde - fast jedenfalls - geschenkt. Auf jeden Fall empfinden es viele so - dass wir für einen Augenblick mehr Zeit haben. Aber was ist das - Zeit? Eine Frage, über die sich unendlich nachdenken ließe. Jetzt, an dieser Stelle, tun wir das für einen kurzen Moment - mit einem Gedicht, das Ludwig Tieck geschrieben hat. Er galt als "König der Romantik", brachte Deutschland mit seinen Übersetzungen Shakespeare und Cervantes nahe, und war überhaupt ein genialer Entdecker, Förderer und Vorleser. 1773 wurde er in Berlin geboren, hat in Halle, Göttingen und Erlangen studiert. Und lange Jahre in Dresden gelebt. "Zeit" - Sarah Grunert liest Ludwig Tieck.
