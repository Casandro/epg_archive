  title: MDR KULTUR trifft Susanne Kim
  subtitle: MDR KULTUR trifft - Menschen von hier
  description: |-
    Das Internationale Leipziger Festival für Dokumentar- und Animationsfilm DOK Leipzig findet vom 26. Oktober bis 01. November statt. Die in Dresden geborene und in Leipzig lebende Filmemacherin Susanne Kim war dort in den vergangenen Jahren mit einigen Produktionen vertreten. Ihr jüngster Film "Becoming Kim" allerdings wurde bereits im Mai 2026 bei DOK München gezeigt. Ab August lief er bundesweit in den Kinos. Im September kam- und im November kommt "Becoming Kim" im Rahmen von Let's Dok, den Aktionstagen für Dokumentarfilm, auf die Leinwand.  Der Film erzählt von einer Beziehung zwischen zwei Menschen aus zwei Kulturen, die dann oft nicht nur eine private Angelegenheit ist. Susanne Kim erzählt von ihrer deutsch-koreanischen Ehe und davon, wie die Liebe, die Erwartungen, die Rollenbilder im Alltag immer wieder neu betrachtet und ausgehandelt werden müssen. "Kimchi & Potato" wurden einst in ihre Eheringe eingraviert. Kimchi für Korea und Kartoffel für Deutschland. Ihr Mann Jeong Rae kehrte 2020 nach Korea zurück und teilte Susanne Kim ein Jahr später am Telephon mit, daß er mit seiner Mutter in Wonju einen Hähnchengrill eröffnen wird. Ihre Erwiderung: "Dann mache ich jetzt einen Film über uns". Sie habe immer schon ein Interesse an dem, wie Ehen, Familien, Beziehungen zwischen Menschen funktionieren, sagt Susanne Kim, wie solch ein Mikrokosmos das gesellschaftliche Ganze widerspiegelt. Aber Susanne Kim wollte auch im ureigenen Interesse erfahren, wie koreanische Vorstellungen auf deutsche, ostdeutsche Prägungen treffen und jongliert selbst vor der Kamera in den Rollen als Ehefrau, Mutter und Künstlerin. Sehr persönlich und universell zugleich spürt sie so der uralten Frage nach: Wie bleiben wir uns selbst treu und lernen gleichzeitig, einen anderen Menschen zu lieben.

    In Dresden wurde Susanne Kim 1976 geboren. Das 3. bis 9.  Lebensjahr verbrachte sie mit den Eltern in Syrien. Kurz vor dem Mauerfall 1989 flüchtete die Familie über Ungarn und Österreich in die Bundesrepublik und lebte fortan im bayerischen Neumarkt. Nach dem Abitur studierte Susanne Kim bis 2003 an der Universität Leipzig Journalistik und Politikwissenschaften. Parallel dazu besuchte sie 2001/2002 das European Film College in Ebeltoft/ Dänemark. Ihr erster Kurz-Dokumentarfilm "Zusammengebacken" aus dem Jahr 2003 lief auf mehreren internationalen Festivals. Anschließend begann sie mit der Arbeit an ihrem Langzeitprojekt "Auf Reisen mit Frau Berge". Susanne Kim absolvierte verschiedene Praktika im Medienbereich, u.a. bei der deutsch-jüdischen Exilzeitung "Aufbau" in New York oder dem Magazin der Süddeutschen Zeitung in München. 2005 nahm sie am Berlinale Talent Campus teil und 2007 am Nachwuchsprogramm für Filmschaffende TP2 in Erfurt. Dort entwickelte sie die Idee für ihren ersten langen Dokumentarfilm. In "White Box" portraitierte Susanne Kim Empfänger von Arbeitslosengeld II/ Hartz IV in der Stadt Löbau. 2010 wurde er beim Internationalen Leipziger Festival für Dokumentar- und Animationsfilm DOK Leipzig uraufgeführt. 2011 nahm Susanne Kim an der Professional Media Master Class für dokumentarische Filmpraxis und Medienkunst der Werkleitz-Gesellschaft in Halle teil. Dort entstand ihr Kurzfilm "Die Bande", der ebenfalls bei DOK Leipzig vorgestellt wurde. 2016 realisierte sie ihren zweiten langen Dokumentarfilm "Trockenschwimmen", der auch vor dem Kinostart bei DOK Leipzig zur Uraufführung kam.
