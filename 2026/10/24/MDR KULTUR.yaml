  title: MDR KULTUR Weltgeschichte vor der Haustür
  subtitle: '"Glück auf, wenn ihr Kumpel seid" - 5 Jahrhunderte Steigerlied / Eine MDR Kultur-Podcastfolge von Hartmut Schade und Conny Wo'
  description: Keine Bergparade im Erzgebirge kommt ohne dieses Lied aus, in Aue und auf Schalke wird es vor Fußballspielen von Zehntausenden angestimmt. Und Popsänger wissen, stimmen sie das Steigerlied an, singt der Saal mit. "Glück auf, der Steiger kommt" ist eines der populärsten Lieder. Gesungen nicht nur dort, wo einst Bergleute Silber und Gold brachen, wie es im Lied heißt, sondern überall, wo Bergbau betrieben wurde. Das Singen des Steigerliedes ist seit 2023 immaterielles Kulturerbe in Deutschland. Was das Lied mit Sachsen verbindet, erzählt Hartmut Schade diesmal in der "Weltgeschichte vor der Haustür".
