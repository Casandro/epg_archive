  description: "* 06:15 Uhr -  Werkvorstellung Igor Strawinsky: Feuervogel-Suite\n\"Feuervogel\" ist die Überschrift des MDR-Konzerts am morgigen Sonntag im Leipziger Gewandhaus. Igor Strawinskys berühmte \"Feuervogel\"-Ballettmusik erklingt als Hauptwerk des Abends. Außerdem gibt es Märchenhaftes von Anatoli Ljadow und Sergej Prokofjew - alles gespielt vom MDR-Sinfonieorchster unter Leitung der jungen französisch-britischen Dirigentin Stephanie Childress. Für Komponist Igor Strawinsky war seine \"Feuervogel\"-Musik der erste Riesenerfolg - und wie wir heute sagen würden, der Karrieredurchbruch. Julius Heile stellt den musikalischen Geniestreich vor. \n\n* 06:30 Uhr - Wetter & Verkehr\n\n* 06:45 Uhr - Der Stichtag: 1806 Erste französische Truppen erreichen Berlin\nAls die Franzosen im Oktober 1806 in Berlin einrückten, da beherrschte die Stadt vor allem Neugier und Aufregung. Das sollte sich im Zuge der zahlreichen Einquartierungen, der hohen Kosten wandeln. Und der Raub der Quadriga auf dem Brandenburger Tor, ihre Entführung nach Paris, die wurde von den Berlinern als Schmach und Demütigung empfunden. Der Stichtag. Von Thomas Hartmann.\n\n* 06:50 Uhr - Kulturtipp für den 25.10.26: Theater Gera \"Der Gott des Gemetzels\"\n\n\n* 07:10 Uhr - Wie geht's in der Klosterbibliothek voran?\nIn Klöstern schlummern oftmals Schätze, gerade auch in ihren Bibliotheken. In Sachsen ist das bspw. im Kloster St. Marienthal, auf der Strecke zwischen Görlitz und Zittau gelegen, so. Umso fataler, wenn, weil man sich anders nicht zu helfen weiß, derartige Schätze verkauft werden müssen, um die Finanzlöcher des Konvents zu stopfen. Um den wertvollen Buchbestand von St. Marienthal für Sachsen zu sichern, hat 2023 der Freistaat ihn angekauft. Und seitdem kümmert sich ein Team der Sächsischen Landes-, Staats- und Universitätsbibliothek Dresden um die Klosterbibliothek. Mit vor Ort war kürzlich auch Grit Krause. \n\n* 07:30 Uhr - Medienschau, Wetter & Verkehr\n\n* 07:45 Uhr - Zeitumstellung verschieben oder streichen?\nHeute Nacht ist es wieder soweit: Wir drehen die Uhr eine Stunde zurück auf die Winterzeit. Viele würden dieses Hin und Her am liebsten ganz abschaffen, andere wollen es neu denken - zum Beispiel mit einer kürzeren Sommerzeit. Julia Nestlen aus der ARD-Wissenschaftsredaktion hat sich angeschaut, was die Forschung dazu sagt - und was Menschen von Winterzeit und Sommerzeit halten. \n\n* 07:50 Uhr - Vorschau: MDR KULTUR trifft Susanne Kim\nHeute ist die Filmemacherin Susanne Kim zu Gast. Das Internationale Leipziger Festival für Dokumentar- und Animationsfilm DOK Leipzig findet vom 26. Oktober bis 01. Novembers statt. Die in Dresden geborene und in Leipzig lebende Filmemacherin Susanne Kim war dort in den vergangenen Jahren mit einigen Produktionen vertreten. Ihr jüngster Film \"Becoming Kim\" allerdings wurde bereits im Mai 2026 bei DOK München gezeigt. Ab August lief er bundesweit in den Kinos. Im September kam- und im November kommt \"Becoming Kim\" im Rahmen von Let's Dok, den Aktionstagen für Dokumentarfilm, auf die Leinwand.  Der Film erzählt von einer Beziehung zwischen zwei Menschen aus zwei Kulturen, die dann oft nicht nur eine private Angelegenheit ist. Susanne Kim erzählt von ihrer deutsch-koreanischen Ehe und davon, wie die Liebe, die Erwartungen, die Rollenbilder im Alltag immer wieder neu betrachtet und ausgehandelt werden müssen. \"Kimchi & Potato\" wurden einst in ihre Eheringe eingraviert. Kimchi für Korea und Kartoffel für Deutschland."
