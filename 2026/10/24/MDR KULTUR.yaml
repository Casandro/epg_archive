  description: "* 16:30 Uhr - Wetter & Verkehr\n\n* 16:45 Uhr - \"Taxi-Ranked\": Videogame mit Johannesburg-Vibes\nEine kleine Truppe von Spiele-Entwicklern hat den täglichen Kampf auf den von Schlaglöchern übersäten Straßen in Johannesburg aufs Handy gebracht. Im Spiel erlebt man das, was jeder Autofahrer in der Millionenmetropole täglich durchmacht. Man steuert ein Sammeltaxi durch die Stadt, sammelt Fahrgäste ein, springt über Schlaglöcher, muss sich mit der Polizei herumschlagen. Das Spiel ist gratis und trifft ganz offensichtlich einen südafrikanischen Nerv, denn es hat schon über 600.000 Fans. Stephan Ueberbach hat es ausprobiert.\n\n* 17:05 Uhr - MDR KULTUR Spezial Musik mit Hendryk Proske\nDie Musikredakteure von MDR KULTUR stellen Neuerscheinungen aus dem aktuellen Musikmarkt vor. \nDie Auswahl reicht von Jazz, Pop, Weltmusik und Chanson bis Folk und Elektronik.\nUnter anderem mit diesen Alben:\n* John Legend: Muse\n* Fenne Lily: Win Win\n* Iuma: 3 Balladen EP\n* Michael Kiwanuka: Fudge\n* Fontaines D.C.: Dopamine Chamber\n* Wolf Biermann: Unterm Haar nur Himmel\n* Wim: Wenn man das Licht zurückverfolgt, weiß man, wie alt die Sterne sind\n\nAktuelle Empfehlungen für das Wochenende."
