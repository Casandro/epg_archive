  title: Red Bull BassLine
  subtitle: Highlights
  description: Wer gewinnt das Red Bull Bassline 2026? Sechs der besten Tennisspieler der Welt werden sich in einem kurzweiligen Tie-Break-Format auf der größten Tennis-Bühne Österreichs duellieren. Der berühmteste Sieger des Red Bull Basslines ist kein geringerer als Carlos Alcaraz. Der Spanier siegte 2021. Bei Red Bull BassLine werden sechs Spieler in zwei Dreiergruppen in einem kurzweiligen "Best-of-three"-Tie-Break-Format gegeneinander antreten. Dabei dürfen die Tennis-Fans in der Wiener Stadthalle per Publikums-Voting mitbestimmen, welche Spieler sich in der Gruppenphase gegenüberstehen. Die beiden Gruppensieger bestreiten das Finale. 2026 gibt es mit "Domis Double" ein neues taktisches Element. Jeder Spieler kann einmal pro Match mit einem kurzen Signal an Dominic Thiem den nächsten Ballwechsel zum zwei Punkte-Highlight machen.Österreich 2026
