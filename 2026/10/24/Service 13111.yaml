  title: Gartln mit Starkl
  subtitle: Gartln zu Allerheiligen
  description: 'Josef Starkl widmet sich einem wichtigen Thema rund um Allerheiligen: der Grabbepflanzung. Er zeigt, welche Pflanzen sich besonders für die Grabbepflanzung eignen - robust, pflegeleicht und lange haltbar. Praktische Tipps erklären, wie man das Grab mit schönen Dekorationen herbstlich gestaltet. Ein wichtiger Schwerpunkt liegt auf der Vorbereitung von Pflanzen auf den Winter - welche Arbeiten sind notwendig, um Grünflächen und Bepflanzungen sicher durch die kalte Jahreszeit zu bringen. Außerdem zeigt Josef, wie man ein Grab neu bepflanzt, damit es den ganzen Winter über gepflegt aussieht und eine würdige Ruhestätte bietet.Österreich 2026, R: Michael Starkl M: Josef Starkl'
