  title: MotoGP - Red Bull Grand Prix von Australien
  subtitle: 'Moto3: Vorbericht'
  description: |-
    Große Emotionen beim Großen Preis von Indonesien! Maximo Quiles liefert in Mandalika eine beeindruckende Vorstellung ab und krönt sich mit einem souveränen Sieg vorzeitig zum Moto3-Weltmeister 2026. Sein größter Rivale David Almansa gibt alles, übernimmt nach dem Start zunächst die Führung und kämpft sich nach einer turbulenten Anfangsphase zurück auf Platz zwei. Doch gegen den überlegenen Quiles ist an diesem Tag kein Kraut gewachsen. Während der Spanier seinen zehnten Saisonsieg und den WM-Titel feiert, richtet Almansa den Blick bereits auf den Kampf um die Vizeweltmeisterschaft. Kann er beim Red Bull Grand Prix von Australien zurückschlagen und den nächsten Schritt in Richtung Vizeweltmeistertitel machen?
    Der Countdown zum Rennen der Moto3 live und in Full HD bei ServusTV.
    WM-Stand nach 14 Rennen: M. Quiles 351 P. | D. Almansa 219 P. | A. Carpe 203 P.
    Australien 2026
