  title: Die Erde - Entstehung des Lebens
  subtitle: Menschen und Tiere
  description: "Auf der Erde leben mittlerweile 8 Milliarden Menschen, und ihre Zahl steigt ständig. Der Mensch hat einen größeren Einfluss auf die Gestaltung der Erdoberfläche als viele natürliche Prozesse. Wie haben dramatische Wendungen in der Erdgeschichte es dem Menschen ermöglicht, von einem Bestandteil der Natur zu ihrem Beherrscher zu werden? Was können wir aus dieser epischen Geschichte lernen, bevor es zu spät ist? \nDie Entwicklung des Menschen nimmt vor 66 Millionen Jahren ihren Anfang mit dem Asteroideneinschlag, der die Dinosaurier auslöschte. Nach dieser Katastrophe entwickelte sich eine neue Tierfamilie, die anpassungsfähig und erfinderisch genug war, um in der rauen neuen Welt zu überleben: die Säugetiere. \nAlles begann mit einem entfernten Vorfahren, der viele Merkmale mit der oft geschmähten, aber evolutionär brillanten Ratte teilte. Durch eine Reihe extremer geologischer und klimatischer Ereignisse entwickelten sich die Säugetiere zu den Primaten, die in den neu entstandenen tropischen Regenwäldern lebten, und schließlich zu frühen Menschen, die in Gebieten wie dem ostafrikanischen Grabenbruch weite Strecken zwischen den Wäldern zurücklegten.\nDie Geschichte der Erde ist eine 4,5 Milliarden Jahre alte Saga, aber erst in den letzten 11.000 Jahren - mit dem Aufkommen der Landwirtschaft - hat unsere Spezies begonnen, den Planeten und seine Ökosysteme dramatisch zu beeinflussen.\nDokumentarfilm, Vereinigtes Königreich 2021, R: David Briggs"
  genre:
  - '144'
  widescreen: true
- eventId: 1003293
