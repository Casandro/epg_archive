- eventId: 656391
  start: 2026-10-24T05:50:00Z
  stop: 2026-10-24T06:15:00Z
  title: Die Sendung mit dem Elefanten
  subtitle: Wie geht Kartoffeldruck?
  description: 'In den Lach- und Sachgeschichten wird heute fleißig gemalt. Tanja und André basteln sich Stempel aus Kartoffeln und drucken damit. Ilvy und Ferris malen zusammen lustige Bilder. Auch Charlie, Lola und ihre Freunde zeichnen und basteln: Als Hausaufgabe soll jedes Kind sein Haus abbilden. David zeigt der Puppe Red, wie man ein Bild auf eine Scheibe malt, und dann malt Red. Und zum Mitraten gibt es heute wieder ein spannendes Bilderrätsel.'
- eventId: 656394
  start: 2026-10-24T06:15:00Z
  stop: 2026-10-24T06:45:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: Lach- und Sachgeschichten, heute mit einem echten Rettungshubschrauber, Charlie und Lola im Herbst, Christoph und ganz viel Laub, Bitzers Kampf mit den Herbstblättern - und natürlich mit der Maus, dem Elefanten und der Ente.
