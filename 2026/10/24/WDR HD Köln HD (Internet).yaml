  title: Ostwind (5)
  subtitle: Der große Orkan
  description: Ein heftiger Sommersturm treibt eine reisende Pferde-Zirkus-Show nach Kaltenbach. Ari, die sich mittlerweile gut auf dem Gestüt eingelebt hat, wird von der faszinierenden Welt des Kunstreitens magisch angezogen und will mit dem Zirkusjungen Carlo mit Ostwinds Hilfe einem alten Showpferd helfen. Doch als der fanatische Zirkusdirektor Yiri ihren waghalsigen Plan enttarnt, gerät Ostwind in Gefahr. Im letzten Moment kehrt Mika aus Kanada zurück, denn nur mit vereinten Kräften kann es Mika und Ari gelingen, ihren geliebten Ostwind zu retten.
  genre:
