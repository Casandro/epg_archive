  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: Lach- und Sachgeschichten, heute mit einem echten Rettungshubschrauber, Charlie und Lola im Herbst, Christoph und ganz viel Laub, Bitzers Kampf mit den Herbstblättern - und natürlich mit der Maus, dem Elefanten und der Ente.
