  title: Meisterküche - Alles mit Fisch
  subtitle: mit Yvonne Willicks
  description: 'Knuspriger Lachs, überbackener Kabeljau und mediterraner Wolfsbarsch: Moderatorin Yvonne Willicks eröffnet die neue Staffel "Meisterküche" mit ihren liebsten Fischgerichten. Spitzenkoch Jaspar Walk (ehemals Wcislo) zeigt, wie aromatische Zitronenpasta mit kross gebratenem Lachs perfekt und schnell gelingt. Ein winterlicher Blattsalat sorgt für den Frischekick.'
