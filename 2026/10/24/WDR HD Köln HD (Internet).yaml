- eventId: 657874
  start: 2026-10-24T09:00:00Z
  stop: 2026-10-24T09:45:00Z
  title: Raus aufs Land (32)
  subtitle: Aufgeben ist nicht! - Mit Humor durchs Chaos
  description: 'Anselm und Simone merken, dass sie ihre Renovierungen unterschätzt haben. Die ältere Tochter entscheidet, nicht mehr mit einzuziehen - ein Rückschlag. Sie fragen sich, ob sie mit über 50 noch genug Zeit haben werden, um das Haus fertigzustellen. Dennoch bleiben sie optimistisch: Ihre erste Nacht verbringen sie auf einer Luftmatratze im unfertigen Gebäude.'
- eventId: 658797
  start: 2026-10-24T09:45:00Z
  stop: 2026-10-24T10:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: Schmorbraten aus Burgund - Zartes Fleisch in viel würziger Sauce
  description: 'Herbst und Winter sind die idealen Jahreszeiten für Schmorgerichte aller Art. Die WDR-Fernsehköche Martina und Moritz haben sich dafür in einer Region Frankreichs umgeschaut, die berühmt für ihre Weine ist und gleichzeitig aber auch für ihre großartige, herzhafte, bodenständige Küche: im Burgund. Hier gedeihen die begehrtesten Weine der Welt. Kein Wunder, dass auch die Küche dazu passt. Und so servieren die beiden butterzart geschmorte Ochsenbacken in Rotwein, Kaninchen in Weißwein und Kalbfleisch in Zitronensauce. Und dazu passt jeweils ein Gratin aus zweierlei Äpfeln.'
  genre:
  - '144'
- eventId: 659324
  start: 2026-10-24T10:15:00Z
  stop: 2026-10-24T10:45:00Z
  title: Einfach und köstlich - Björn Freitag kocht mit Zora Klipp (2/6)
  subtitle: Norddeutsche Küstenkracher
  description: 'Heute ist Zora Klipp aus Hamburg zu Gast bei Björn Freitag und hat ein Rezept aus der Küche ihrer Großmutters im Gepäck: Königsberger Klopse - und dazu Rote Bete und Kartoffelpüree. Das sorgt für Freude bei Björn und für etwas Druck bei Zora: Es ist sein Lieblingsgericht! Auch Björn Freitag schwelgt gerne in Erinnerungen an Deutschlands Norden. Er bringt Seelachsburger "Bremer" mit frisch gebackenen Brioche-Buns und einem Artischockensalat auf den Tisch. Die beiden kennen sich gut und werfen sich die Zutaten und Pointen hin und her.'
  genre:
  - '144'
