  subtitle: mit Felix Lobrecht
  description: "Felix Lobrecht löst in seiner Show \"1LIVE 99 Problems\" die Sorgen und Probleme des Sektors. Die Hörerinnen und Hörer von 1LIVE sprechen mit dem gebürtigen Nordrhein-Westfalen im 1LIVE Haus über Dinge, die sie beschäftigen oder die Probleme in ihrem Leben darstellen. \n\nFelix Lobrecht wurde mehrfach mit dem Deutschen Comedypreis und der 1LIVE Krone ausgezeichnet. Zusammen mit Moderator und Kolumnist Tommi Schmitt produziert er den Podcast \"Gemischtes Hack\"."
