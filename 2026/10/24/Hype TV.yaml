  stop: 2026-10-24T19:35:00Z
  title: Tišina je moja publika, film
  description: '"Tišina je moja publika" je kanadski dramski film o Mauri, nadarenoj ženi i majci dvije kćeri koja se bori s mentalnim bolestima nakon niza emocionalnih udaraca. Film prati njezin život 1997. u Tors Covu kada planira odmor prije velike glazbene turneje, ali njen muž odlučuje ostati u Rusiji zbog poslovnih obaveza, što dovodi Mauru u duboku depresiju. Njezine pogrešne odluke i nesreće - uključujući ostavljanje djece bez nadzora - rezultiraju time da gubi skrbništvo nad kćerima. Kroz godine izolacije, emotivnih padova, neočekivane povezanosti i pokušaja osobne obnove, Maura nastoji pronaći način da ponovo izgradi odnos sa svojim odraslim kćerima i pronađe smisao života.'
  subtitle: AN AUDIENCE OF CHAIRS (2018) Drama
