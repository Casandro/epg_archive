  title: Bez publike, film
  subtitle: AN AUDIENCE OF CHAIRS (2018) Drama
  description: Maura je talentirana pijanistica koja planira dvotjedni odmor prije audicije za turneju Amerikom. Kad primi telefonski poziv supruga, ambicioznog novinara koji joj javi da je odlučio cijelo ljeto ostati u Rusiji kako bi istraživao priču na kojoj radi, Maura je prisiljena ostati u Newfoundlandu ostatak ljeta i paziti na svoje dvije kćeri. Nakon što propusti audiciju, Maura pada u depresiju, noću lupa po glasoviru i spava tijekom dana, ostavljajući djecu bez nadzora. Jednog dana odvede svoje kćeri na obližnji otok i u stanju manije ondje ih zaboravi...
