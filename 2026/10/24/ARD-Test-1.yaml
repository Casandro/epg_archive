  title: Das Vergessen - Spurlos im Moor (4/6)
  subtitle: Verraten
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  description: 'Ein weiterer Todesfall erschüttert Engelsberg: Axmann wird in seiner Werkstatt tot aufgefunden. Pia glaubt nicht an einen Unfall und vermutet einen Zusammenhang mit ihrer Mordermittlung. Ein Foto mit Axmann und ihrer ermordeten Nichte Amelie gibt Rätsel auf: Wer ist der Mann, der im Hintergrund zu sehen ist? Unterdessen fürchtet der Autohändler Broszek, dass sein Drogenschmuggel auffliegt. Er knüpft sich seinen Gehilfen Roman vor - und erfährt von Pias Geheimnis!'
