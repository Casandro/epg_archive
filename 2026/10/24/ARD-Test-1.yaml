  title: Das Vergessen - Spurlos im Moor (3/6)
  subtitle: Verborgen
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  description: LKA-Ermittler Moser merkt, dass seine Kollegin Pia sich verändert. Ihre Ermittlungen führen sie zu dem Autohausbetreiber Broszek, dem Chef von Amelies "Ex" Roman. Von ihm möchten sie einen Vaterschaftstest einholen. Roman weigert sich, verrät Pia jedoch, dass Amelie heimlich einen Social-Media-Account mit freizügigen Fotos besaß. Einer der davon wusste, ist ihr Lehrer Bichler. Schnell ist klar, dass auch er Wesentliches verheimlicht.
- eventId:
