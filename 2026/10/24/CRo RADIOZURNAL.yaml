  description: Snímek režisérky a kameramanky Olgy Malířové Špátové "Návrat do neznámé země" bude zahajovat letošní 30. ročník Mezinárodního festivalu dokumentárních filmů Ji.hlava. Film je věnován světoznámému choreografovi a tanečníkovi Jiřímu Kyliánovi a jeho životní partnerce a múze Sabine Kupferberg. Je osobním zamyšlením nad lidskou existencí a neúprosným plynutím času. Moderuje Vladimír Kroc. (repríza)
