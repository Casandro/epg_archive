  description: |-
    Korinth: Auf der Burg von Hercules' Bruder Iphicles soll eine Geburtstagsparty für den Halbgott stattfinden. Aber die Feierlichkeiten im Kreis von Familie und Freunden nehmen eine böse Wendung. Callisto (Hudson Leick), die einen Pakt mit Hera geschlossen hat, vergiftet die Gäste! Auf der Suche nach einem Gegenmittel ist Hercules gezwungen, mit der Attentäterin zusammenzuarbeiten. Im Labyrinth der Götter muss das ungleiche Duo den Baum des Lebens finden. Dessen goldene Äpfel versprechen Heilung. Derweil wird die vergiftete Geburtstagsgesellschaft von heftigen Halluzinationen geplagt, was schier im Wahnsinn endet.
