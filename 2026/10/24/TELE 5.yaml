  title: Hercules
  subtitle: Freund oder Feind
  description: |-
    Prinz Nestor (Stephen Hall) verfolgt einen perfiden Plan. Um Hercules zu töten, hat er es auf die übernatürliche goldene Hirschkuh abgesehen. Das Blut des mystischen Mischwesens soll in der Lage sein, sogar Götter zu töten! Als Hercules und Iolaus die Fallen entschärfen, die Prinz Nestors Schergen im Wald verteilt haben, stoßen sie auf eine rätselhafte Frau namens Serena (Sam Jenkins). Sie verfügt über wundersame Heilkräfte und steht offenbar mit der goldenen Hirschkuh in Verbindung. Auch Kriegsgott Ares hat bei dem ausgeklügelten Komplott seine Finger im Spiel.
