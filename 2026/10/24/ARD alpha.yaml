    Friedrich Engels bildet mit Karl Marx eines der berühmtesten Duos der Weltgeschichte. Im Gegensatz zu Marx scheint Engels jedoch heute in Vergessenheit zu geraten. Zu Unrecht. Anlässlich seines 200. Geburtstag am 28. November 2020 verfolgt die Dokumentation seinen turbulenten Lebensweg.

