  title: 'grenzenlos: Für die Kinder dieser Welt'
  subtitle: Dokumentation
  description: Kinder sind die Zukunft. Dort wo sie geschunden und gequält werden, ist der Schaden deshalb besonders groß. An drei Beispielen auf drei Kontinenten zeigt 'grenzenlos' wie Steyler Missionare dafür sorgen, dass Kinder und Jugendliche neue Lebensperspektiven erhalten.
