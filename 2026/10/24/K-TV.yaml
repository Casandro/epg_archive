  title: 'Spirit: Wie betet man richtig?'
  subtitle: Gespräch
  description: '"Beten ist sprechen mit Gott", heißt es in einer alten Formulierung. Aber antwortet er auch? Vielen Menschen fällt es schwer zu beten oder sie wissen nicht wie. Was das Gebet ausmacht und warum es einen festen Platz in unserem Tagesablauf haben sollte, erläutert Pater Anton Lässer CP.'
- eventId: 972238
  start: 2026-10-24T11:15:00Z
  stop: 2026-10-24T12:00:00Z
  title: '"Wenn dir Gott begegnet, was willst du da machen?" I Vom Protestanten zum katholischen Mönch'
  subtitle: Gespräch
  description: 'Pater Kilian Müller erlebt 2006 eine Begegnung, die sein bisheriges Leben komplett auf den Kopf stellt. Hinter ihm liegen die Suche nach Erfolg, die Sehnsucht nach Erfüllung, eine tiefe innere Leere und eine erschütternde Diagnose, die alles infrage stellt. Doch dann beginnt ein Weg, mit dem niemand gerechnet hätte - am wenigsten er selber.In dem Gespräch mit Athinea Andryszczak erzählt der Zisterzienserpater von seiner überwältigenden Begegnung mit Gott, von 14 Tagen auf dem "Schoß des himmlischen Vaters" und von dem Moment, der alles entschieden hat: "Wenn dir der Herr begegnet, was willst du da machen?"Ein außergewöhnliches Berufungszeugnis über einen evangelisch Getauften, dessen Leben durch Gottes Gegenwart radikal verwandelt wurde - von der Suche nach Erfüllung bis zum Leben als katholischer Mönch und Priester.'
- eventId: 972261
  start: 2026-10-24T12:00:00Z
  stop: 2026-10-24T13:00:00Z
  title: Deine Frage zählt!
  subtitle: Gespräch
  description: 'Fragen begleiten uns ein Leben lang - sei es zum Glauben, zu unseren Beziehungen, zu Leid und Hoffnung oder einfach zu den Dingen des Alltags. Einige dieser Fragen tragen wir schon seit Jahren in uns, andere tauchen ganz unerwartet auf. Genau hier setzt unsere neue Fernsehsendung "Deine Frage zählt" mit Eva-Maria Admiral an: Sie schafft einen Ort, an dem solche Fragen Gehör finden.Eva-Maria Admiral ist Schauspielerin, Autorin und Dozentin. Aufgrund ihrer persönlichen Lebensgeschichte hat sie neben ihrer Theaterarbeit auch Theologie, Traumatherapie und Neurowissenschaften studiert. Seit vielen Jahren begleitet sie Menschen durch unterschiedlichste Fragen des Lebens und beschäftigt sich mit Themen wie Verletzungen, Heilung, Beziehungen und neuen Perspektiven.In "Deine Frage zählt" nimmt sie sich der eingesandten Fragen an und beantwortet sie mit Herzlichkeit und reicher Lebenserfahrung. Werden auch Sie ein Teil davon! Senden Sie uns Ihre Frage - ganz einfach per Telefon oder E-Mail:E-Mail: deinefragezaehlt@k-tv.orgTelefonnummer für Deutschland: +49 (0) 8385 - 39499933Telefonnummer für Österreich: +43 (0) 512 411035Telefonnummer für die Schweiz: +41 (0) 71 5880 925'
