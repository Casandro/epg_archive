  title: Hajaja
  description: Ferda v mraveništi (6/7). Podle stejnojmenné knihy Ondřeje Sekory pro rozhlas připravila Eva Linková. Účinkuje Vlastimil Brodský. Režie Miroslav Šváb. Natočeno v roce 1988 (8 minut). Repríza.
- eventId: 1007357
  start: 2026-10-24T18:00:00Z
  stop: 2026-10-24T18:30:00Z
  title: Úžasné životy
  description: 'Pavel Dostál podle Richarda Pogody. Richard Pogoda a Pavel Dostál byli nerozlučnou dvojicí. Jako malí kluci spolu prováděli lotroviny, později spolu tvořili nezapomenutelné kabarety a písně. Nerozdělila je ani náročná doba normalizačních zákazů, ani pozdější politické angažmá Pavla Dostála. Na divadelníka, režiséra, textaře, politika, ale především na svého kamaráda bude Richard Pogoda vzpomínat v Úžasných životech. Autor: Kateřina Kubalová. Repríza.'
- eventId: 1007358
  start: 2026-10-24T18:30:00Z
  stop: 2026-10-24T19:00:00Z
  title: Stopy, fakta, tajemství...
  description: 'Muž v zeleném mercedesu - Pátrání Stanislava Motla po okolnostech, za nichž se 9. května 1945, krátce po půlnoci, začal odehrávat dramatický útěk K. H. Franka a jeho rodiny z Prahy. Dramaturgie: Magdalena Šorelová. Repríza.'
- eventId: 1007359
  start: 2026-10-24T19:00:00Z
  stop: 2026-10-24T20:00:00Z
  title: Zlaté časy
  subtitle: Václav Kopta a jeho milovaná 60. léta v písničkách a především jejich textech. Repríza.
- eventId: 1007360
  start: 2026-10-24T20:00:00Z
  stop: 2026-10-24T20:30:00Z
  title: Četba na pokračování
  description: 'Anna Bolavá: Ke dnu (1/10). V době prvních mrazů je v močálech na kraji města nalezeno mrtvé tělo manželky lékaře Marka Diviše. Mezi obyvateli se začíná roztáčet kolotoč spekulací a pomluv... Druhý román autorky, která za svou prvotinu Do tmy obdržela v roce 2016 Magnesii Literu za prózu. Adaptace Pavla Nejedlá. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Isteník a Barbora Goldmannová. Natočeno v roce 2018.'
- eventId: 1007361
  start: 2026-10-24T20:30:00Z
  stop: 2026-10-24T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Petr Holas, předseda České vexilologické společnosti, znalec vlajek a praporů. Ve kterých státních vlajkách najdeme kalašnikov, muškátový oříšek nebo jeřába? Jakého přešlapu se Češi při vyvěšování státní vlajky dopouštějí nejčastěji? A proč černobílá lebka s hnáty nebyla tou nejhorší vlajkou, kterou mohl námořník na obzoru spatřit? Moderuje Jan Eliáš Svatoš. Repríza.'
