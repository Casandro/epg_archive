  title: Kriminálka
  description: 'DNA 632 - Zmizení mladé dívky vystrašilo všechny obyvatele dvou středočeských vesnic. Do pátrání se zapojili téměř všichni a nikomu nevadilo, že byl první večer nového roku. Nakonec ji našli v potoce mezi vesnicemi. Byla zavražděna. Nastalo jedno z nejzdlouhavějších vyšetřování středočeské kriminálky. Testům DNA se postupně podrobili všichni muži. Bezvýsledně. Mohl být vrahem náhodný řidič projíždějící ten večer kolem? Kriminálka se ale nevzdala a snížila věkovou hranici testovaných mužů. Odhalení nakonec nikdo nechtěl uvěřit. Autor, dramaturgie: Dana a Mirek Vaňurovi. Repríza'
