  description: 'Už zase skáču přes kaluže. Příběh chlapce s velkou touhou a statečným srdcem. Podle stejnojmenného románu Alana Marshalla s použitím překladu Zory Wolfové pro rozhlas zdramatizovala Lenka Veverková. Hudba Jan Šikl. Dramaturgie Zuzana Vojtíšková. Režie Josef Kačmarčík. Účinkují: Viktor Kuzník, Mikuláš Převrátil, Tereza Vilišová, Jan Grundman, Matěj Havelka, Vasil Fridrich, Robert Mikluš, Jan Vlasák, David Matásek, Zuzana Mixová, Matěj Převrátil, Tomáš Poláček, Lukáš Vejšický, Eva Hacurová, Martin Hruška, Milada Vyhnálková, Kristýna Ševčíková a Kateřina Zapletalová. Natočeno v roce 2020 (54 minut). Repríza.'
