  title: Krimi am Samstag
  subtitle: Der Schatz
  description: |-
    Journalist Michael Bellow wird als Korrespondent in den Irak geschickt. Der Krieg ist gerade vorbei, in Bagdad herrschen Chaos und Anarchie. Im Dampfbad belauscht Bellow zwei Deutsche, die ihr Geld offensichtlich mit dem Schmuggel von Kunstschätzen verdienen. Bellow wittert eine große Geschichte. Er folgt einer Fährte in den Norden des Landes, in ein vom amerikanischen Militär streng abgeriegeltes Dorf. Dort ist die Macht von Saddam Hussein noch allgegenwärtig, und für Beweise setzt Bellow sein Leben aufs Spiel.
    Regie: Thomas Blockhaus<br/>Produktion: WDR <markup type="abbr" abbreviation="2007" correspondent="zweitausendsieben">2007</markup>
