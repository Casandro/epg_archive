  description: 'Hubert Aiwanger setzt in seiner aktuellen Politik verstärkt auf einen rechtskonservativen, bürgerlichen Kurs, mit dem er die Freien Wähler als klaren Gegenpol zu linken Parteien positioniert. Als bayerischer Wirtschaftsminister und Vize-Regierungschef betont er dabei traditionelle Werte wie Freiheit, Eigentum und Heimat und fordert spürbare Entlastungen für die arbeitende Bevölkerung sowie den Mittelstand. Zudem sucht er durch seine markante, bürgernahe Sprache den direkten Schulterschluss mit der ländlichen Bevölkerung, Handwerkern und Landwirten. Philipp Kuffler hat mit dem stellvertretenden Ministerpräsident gesprochen. +++ Herbstwetter bedeutet für Autofahrer: Winterreifen aufziehen. In Deutschland gilt die Faustregel O bis O, in Österreich Winterreifenpflicht ab 1. November. Wichtig sind Reifenalter, Profiltiefe und korrekter Luftdruck; nach 50 bis 100 km Radschrauben nachziehen.'
