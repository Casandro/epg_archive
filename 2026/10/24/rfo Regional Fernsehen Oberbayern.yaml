- eventId: 606377
  start: 2026-10-24T11:00:00Z
  stop: 2026-10-24T11:10:00Z
  title: Süd Journal Teil 1 (Wh.)
  subtitle: Über 10 Millionen Euro für die Region - 20 Jahre Sparkassenstiftungen Zukunft +++ Bayerische Wälder im Visier des Borkenkäfers +++ Bayerische HIV Testwoche +++ Nach Grenzübergang ins Gefängnis
  description: 'Die Sparkassenstiftungen Zukunft feiern 20 Jahre Förderung in Stadt und Landkreis Rosenheim. Zum Jubiläum fließen statt 200.000 mehr als 266.000 Euro an 68 Projekte. Mit Aufwind wurden seit 2012 zudem knapp 8.000 benachteiligte Kinder und Familien unterstützt. +++ Trotz nur vier Millimetern Größe kann ein Borkenkäfer-Weibchen in warmen Sommern bis zu 100.000 Nachkommen erzeugen. In trockenen Jahren vernichten die Schädlinge bundesweit Millionen Festmeter Holz. Wie ist die Lage in unserer Region? Reportage aus dem Wald. +++ Im Landkreis Traunstein starten am 2. November die Bayerischen HIV-Testwochen. Bis 30. November sind im Gesundheitsamt kostenlose, anonyme HIV-Tests ohne Anmeldung möglich: Mo-Do vormittags und nachmittags, Fr nur vormittags. Empfohlen ab sechs Wochen nach Risiko. +++ Bei einer Grenzkontrolle auf der A93 bei Kiefersfelden nahm die Polizei zwei gesuchte Männer fest. Ein 40-jähriger Slowake und ein 33-jähriger Deutscher konnten vierstellige Geldstrafen nicht zahlen und mussten Ersatzhaft antreten.'
