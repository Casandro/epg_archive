- eventId: 610449
  start: 2026-10-24T06:30:00Z
  stop: 2026-10-24T06:45:00Z
  title: Süd Kultur Teil 1 (Wh.)
  subtitle: Wenn Farbe den Raum sprengt - Peter Casagrande in der Städtischen Galerie +++ Klangpoesie mit Daniel Stelter +++ Bass, Bässer, Burghausen - Die Bayerischen Basstage
  description: 'Die Städtische Galerie Rosenheim zeigt eine Retrospektive von Peter Casagrande: vom frühen Schriftenmaler mit feinen Zeichnungen bis zu pastosen Großformaten. Höhepunkt ist das monumentale Zehnteiler Aschaffenburg, ergänzt durch Filme zur Arbeitsweise. Bis 8. November. +++ Jazzgitarrist Daniel Stelter, bekannt für warme Sounds zwischen Jazz und Pop und als Sideman u.a. von Al Jarreau, Till Brönner und Jan Delay, gastiert am 12. November mit seinem Trio beim Internationalen Gitarrenfestival Saitensprünge in Bad Aibling. +++ In Burghausen starten am 31. Oktober die 13. Bayerischen Basstage. Norbert Haimerl trifft Veranstalter Claus Freudenstein. Beim Auftaktkonzert spielt Ida Nielsen, frühere Bassistin von Prince, mit Bruce Hertz und Da Xun Zhang. Dazu gibt es Workshops für alle Levels.'
