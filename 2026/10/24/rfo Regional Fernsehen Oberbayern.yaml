  subtitle: Revision im Fall der ehemaligen Bundespolizistin +++ Brand in Rosenheim - Eine Person tot +++ Einsatzfahrzeug für Bischofswieser Spontanhelfer +++ Mehr Wohnraum in Feldkirchen-Westerham
  description: Der Fall schien nach Geständnis, Deal vor Gericht und mehr als drei Jahren Haft erledigt. Doch eine frühere Bundespolizistin aus dem Landkreis Rosenheim legt Revision gegen ihr Urteil wegen Vergewaltigung einer Jugendlichen und weiterer Taten ein. Das könnte Strafe und Beamtenstatus beeinflussen. +++ Bei einem Wohnungsbrand in der Münchener Straße in Rosenheim ist am späten Freitagabend ein 52-Jähriger gestorben. Rund 35 Bewohner mussten das Mehrfamilienhaus verlassen, das Feuer wurde auf eine Wohnung begrenzt. Ursache und Todesumstände sind unklar, die Kripo ermittelt. +++ STC Rescue aus Bischofswiesen kann bei Großschadenslagen und Katastrophen künftig mit eigenem Einsatzfahrzeug und Ausrüstung unterstützen. Der per Spenden finanzierte Nissan Navara wurde pünktlich zum zweijährigen Bestehen übergeben und kirchlich gesegnet. +++ Feldkirchen-Westerham will Wohnraum schaffen, ohne neue Baugebiete auszuweisen. Im Bereich Weidach West soll auf einem bisher nur für Nebenanlagen zugelassenen Grundstück ein Wohnhaus entstehen. Dafür wird der Bebauungsplan geändert, das Verfahren läuft noch.
