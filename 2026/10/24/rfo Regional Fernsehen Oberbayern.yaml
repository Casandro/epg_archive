  title: Süd Journal Teil 3 (Wh.)
  subtitle: Energielandwirt des Jahres 2026 - CERES Award für Franz Kirchmaier  +++ Freilassinger Künstlergilde stellt in Freilassing aus +++ Wetter für das Sendegebiet
  description: 'Der Hof Kirchmaier in Schützing am Chiemsee verbindet Milchkühe mit Urlaubshof, Hofladen und Café und versorgt sich komplett selbst mit Energie. Für das innovative, nachhaltige Konzept wurde Franz Kirchmaier mit dem CERES Award 2026 als Energielandwirt des Jahres geehrt. +++ Kunst verbindet Rupertiwinkel und Berchtesgadener Tal: Acht Mitglieder der Künstlergilde Freilassing zeigen bis Ende November im Haus der Berge in Berchtesgaden die Ausstellung Unterwegs mit Bildern, Fotos, Zeichnungen, Karikaturen und Drucken. +++ Südostoberbayern erwartet ein wechselhaftes Herbstwochenende: Am Samstag wird es um Rosenheim noch freundlich, in Traunstein und besonders im Berchtesgadener Land sind öfter Schauer möglich. Am Sonntag bleibt es überall unbeständig, zum Wochenstart wird es milder bis 18 Grad.'
