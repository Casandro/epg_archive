  description: Uhus in Ohlsdorf, Füchse in Vorgärten oder Waschbären im Einkaufszentrum - immer mehr Wildtiere suchen die Nähe zur Stadt. Und das kann ihnen leicht zum Verhängnis werden. Durch Stacheldrähte, Autos, Windräder oder Bauarbeiten geraten unzählige von ihnen täglich in Hamburg in Not. Mehr als 4.000 verletzte Wildtiere werden jedes Jahr in Hamburg versorgt. Viele von ihnen werden von Christian Erdmann aufgepäppelt. Der Film begegnet dem engagierten Tierschützer in der Wildtierstation Hamburg.
