  stop: 2026-10-21T16:00:00Z
  title: Betonový lidi
  description: V páté epizodě série Betonový lidi míří Vladimír 518 se sociálním pracovníkem Petrem Globočníkem do Janova v Litvínově. Prochází sídlištěm s vyhořelými a vytlučenými torzy paneláků. A rozebírají, kudy vedla cesta místních obyvatel do sociálního vyloučení a jaké jsou šance na obrat k lepšímu. Na procházku po Janově navazuje studiový rozhovor o širším kontextu tamní situace a aktivitách, kterými se místní snaží situaci zvrátit k lepšímu.
- eventId: 930999
  start: 2026-10-21T16:00:00Z
  stop: 2026-10-21T16:30:00Z
  title: Vltava Live
  description: Před přímým přenosem písňového recitálu Belly Adamové v rámci MHF Lípa Musica 2026 debatuje Vojtěch Babka nejen s interpretkou, ale také festivalovým ředitelem Martinem Prokešem a hudební režisérkou Českého rozhlasu Markétou Tomkovou Janáčkovou. Pořad vysíláme živě ze zákulisí Městského divadla v Děčíně.
- eventId: 931000
  start: 2026-10-21T16:30:00Z
  stop: 2026-10-21T17:00:00Z
  title: Četba na pokračování
  description: 'Markéta Pilátová: Tsunami blues (7/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkuje Dana Černá. Režie Vlado Rusko (26 min). Natočeno v roce 2015.'
- eventId: 931001
  start: 2026-10-21T17:00:00Z
  stop: 2026-10-21T18:40:00Z
  title: Koncert klasika
  description: 'Za všechno může Eva! Přímý přenos koncertu, na kterém v rámci MHF Lípa Musica 2026 zazní premiérový program, sledující všechny možné facety ilustrující ženský přínos, boj a emoce. Na programu: Fauré, Schnittke, Schubert, Hindemith, Wolf a další. Účinkují Bella Adamova (mezzosoprán) a Malte Schäfer (klavír). Během koncertní přestávky bude hostem u mikrofonu skladatelka Sylva Stejskalová. Večer moderuje Vojtěch Babka, vysíláme živě z Městského divadla v Děčíně.'
- eventId: 931028
  start: 2026-10-21T18:40:00Z
  stop: 2026-10-21T20:00:00Z
  title: Koncert klasika
  description: 'Večer Nikol Bókové a Franze Liszta. Záznam koncertu festivalu Lípa Musica ze 17. října 2024. V koncertním sále v německém Seifhennersdorfu zazněla mj. tato díla: Nikol Bóková: First Impression, Second Impression, Perseids, Sakamoto Temple Town. - Franz Liszt: Vallée d''Obermann, Sonetto del Petrarca 104, La Leggierezza, Balada č. 2 h moll. Připravil Zdeněk Havlíček.'
- eventId: 931029
  start: 2026-10-21T20:00:00Z
  stop: 2026-10-21T21:00:00Z
  title: Radioateliér
  description: Rozhlas to radio. Je rádio jako médium udržitelné? Tuto otázku si položili studenti katedry skladby na HAMU v rámci cvičení Kompoziční praxe elektroakustické a multimediální hudby a vytvořili udržitelný proud vysílání, který reaguje na médium, jež v době podcastů a politických debat tiše mizí z našeho povědomí. Repríza.
- eventId: 931055
  start: 2026-10-21T21:00:00Z
  stop: 2026-10-21T21:30:00Z
  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (4/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová, Pavel Soukup, Zlata Adamovská a Martin Velda. Režie Petr Adler. Natočeno v roce 1990 (28 min).'
