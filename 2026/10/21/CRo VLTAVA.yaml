  title: Vizitka
  description: 'Magdalena Juříková, ředitelka GHMP Po čtrnácti letech končí v čele Galerie hlavního města Prahy její dlouholetá ředitelka Magdalena Juříková. Během této doby představila galerie výrazné osobnosti české i světové výtvarné scény, rozšiřovala své sbírky a otevírala prostor současnému umění. Co se jí podařilo změnit a jaká je role městská galerie v současné Praze? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
