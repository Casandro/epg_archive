  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Der heilige Raum und der Altar
  description: Die Juden hatte den Tempel in Jerusalem als heiligen Raum. Nur dort war der Ort, um Gott anzubeten. Die Synagoge entstand unter den Juden im babylonischen Exil als Institut, um sich zu versammeln und als Ort der Schriftlesung, da der Tempel, Ort der Opferung und Anbetung, zerstört war. Die ersten Christen versammelten sich mit wenigen Familien in Hauskrichen, um 'das Brot zu brechen'. Monsignore Schroedel nimmt den Zuschauer mit auf eine Reise, die bis zu den großen Kathedralen führt und ihrer Ausrichtung nach Osten, auf Christus hin, der aufgehenden Sonne der Gerechtigkeit und erläutert die Rolle des Altars als Zentrum der Kirche.
  widescreen: true
