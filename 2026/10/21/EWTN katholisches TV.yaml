  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: Das missionarische Herz der Kirche
  description: 'Diese Woche bei Vaticano: Vom historischen Hauptsitz der Propaganda Fide in Rom bis hin zu abgelegenen Gemeinschaften auf der ganzen Welt erkunden wir die missionarische Arbeit der Kirche. Wir treffen die Weißen Väter (Missionare von Afrika) und hören aus erster Hand von einem Bischof, der in einem der entlegensten Missionsgebiete der Welt dient, nämlich Papua-Neuguinea. Außerdem besuchen wir ein besonderes Projekt in Österreich, das körperliches Training, Katechese und Glaubensvermittlung für Flüchtlinge miteinander verbindet.'
  widescreen: true
