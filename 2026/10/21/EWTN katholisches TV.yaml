  stop: 2026-10-21T01:15:00Z
  title: GRANDIOS (4. Staffel)
  subtitle: 'im Porträt: Vickermann & Stoya Maßschuhe GBR'
  description: "\"Ich glaube, die wenigsten wissen, was in ihnen steckt.\" Matthias Vickermann und Martin Stoya gründen 2004 die Schuhmanufaktur \"Vickermann & Stoya Maßschuhe GBR\". Das Unternehmen hat Kunden auf der ganzen Welt und ist längst mehr als eine Schuhmanufaktur. \n\nFür Pascal Rößler ist die Bibel im wahrsten Sinne des Wortes \"wahr und wundervoll\". In seiner Wahlheimat Salzburg arbeitet der gebürtige Schwarzwälder als Visual Storyteller und verfolgt ebenso sein Herzensprojekt: Mit Linoldrucken Kunst und Kreativität mit dem Wort Gottes verbinden.\n\nMit GRANDIOS haben die Unternehmer über ihre je eigene Firmenphilosophie und die Nutzung von Talenten gesprochen."
  widescreen: true
