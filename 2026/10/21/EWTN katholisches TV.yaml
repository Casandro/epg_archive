  title: In Concert - Konzerte großer Meister
  subtitle: Moscow Synodal Choir - XXIV. Internationales Festival für Sakrale Musik & Kunst
  description: "Im Rahmen des XXIV. Internationalen Festivals für sakrale Musik und Kunst, das unter dem Zeichen des 500. Geburtstags Giovanni Pierluigi da Palestrinas steht, ist dieser Abend ganz der geistlichen Musik der östlichen Kirche gewidmet. \n\nEs singt der Moskauer Synodalchor, eines der ältesten und traditionsreichsten Ensembles Russlands. 1721 offiziell gegründet, prägte er um 1900 die \"Neue Russische Chorschule\"- Komponisten wie Pjotr Tschaikowsky und Sergei Rachmaninow schrieben Werke eigens für dieses Ensemble. Seit seiner Wiederbelebung im Jahr 2009 steht der Chor unter der Leitung von Alexei Puzakov. \n\nMit Kompositionen von Tschaikowsky, Rachmaninow, Sorokin, Tschesnokow und anderen entfaltet sich die klangliche Tiefe der orthodoxen Liturgie. In der Konzentration auf das östliche Repertoire wird die Einheit der Kirche als Einheit in der Vielfalt erfahrbar - getragen vom gemeinsamen geistlichen Klang."
  widescreen: true
