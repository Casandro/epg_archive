  title: So schmeckt die Welt - München
  subtitle: So schmeckt die Welt - München
  description: Eine kulinarische und kulturelle Expedition durch die bayerische Landeshauptstadt. Erleben sie die kulinarischen Highlights in der schönsten Stadt Deutschlands. Flanieren sie mit uns über den Viktualienmarkt und entdecken sie die weltweit einzige Flughafenbrauerei am Airport in München. München, die nördlichste Stadt Italiens vermittelt eben auch alpines und mediterranes Flair. Ein Rendezvous der Sinne.
