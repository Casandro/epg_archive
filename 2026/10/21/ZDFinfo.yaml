  title: Mythen der Bibel
  subtitle: Auszug aus Ägypten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2025
    Der Auszug aus Ägypten - eine der großen Bibelgeschichten. Mose führt sein Volk aus der Knechtschaft ins gelobte Land. Verfolgt vom ägyptischen Pharao, mitten durch das Meer.

    Archäologen graben in Ägypten nach Spuren der biblischen Welt. Unter 3000 Jahren Sand finden sie mächtige Städte - und Hinweise auf verschleppte Arbeiter, Naturkatastrophen und politische Krisen.
    HD-Produktion
