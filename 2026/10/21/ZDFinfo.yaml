  title: Mythen der Bibel
  subtitle: Sündenstadt Ninive
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2025
    Ninive wird in der Bibel als die Stadt der Sünde dargestellt. Ihre Bewohner als grausam, verdorben und gottlos. Warum ein so finsteres Bild? Und wie war Ninive wirklich?

    Unter dem irakischen Mossul liegen die Überreste der Metropole: mächtige Mauern, prachtvolle Reliefs, Bauten einer Kultur, die sich selbst als gewaltvoll inszeniert. Kann Ninive wirklich Buße tun, oder trifft die Stadt ein anderes Schicksal?
    HD-Produktion
- eventId:
  - 1559816
  - 547054
  start: 2026-10-21T17:30:00Z
  stop: 2026-10-21T18:15:00Z
  title: Mythen der Bibel
  subtitle: Die Arche Noah
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2025
    Ein Mann, ein Schiff - und eine Sintflut, die fast alles Leben auslöscht. So erzählt die Bibel die Geschichte von Noah und seiner Arche. Doch gab es diese apokalyptische Katastrophe wirklich?

    Die Forscher suchen nach Hinweisen. Im Irak stoßen sie auf frühe Hochkulturen, die von Hochwasserkatastrophen betroffen waren, und auf uralte Texte, die lange vor der Bibel von einer großen Flut berichten. Und vom Bau eines Schiffes, das ihr trotzen soll.
    HD-Produktion
- eventId:
  - 1559817
  - 551822
  start: 2026-10-21T18:15:00Z
  stop: 2026-10-21T19:00:00Z
  title: Mythen der Bibel
  subtitle: Turmbau zu Babel
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2025
    Ein Turm, der bis in den Himmel ragt und Gottes Zorn erregt. So erzählt die Bibel vom Turmbau zu Babel. Wie viel Wahrheit steckt in dieser Geschichte? Und finden sich noch Spuren des Turms?

    Der Turmbau zu Babel ist eine der beeindruckendsten Geschichten des Alten Testaments. Archäologen und Historiker suchen sein reales Vorbild. In den Ruinen Babylons und auf alten Schrifttafeln entdecken sie eine Welt, in der dieser Mythos entstanden ist.
    HD-Produktion
- eventId:
