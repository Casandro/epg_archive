    Auf dem Höhepunkt der letzten Eiszeit ziehen die ersten Menschen von Ostasien über eine Landbrücke namens Beringia nach Nordamerika: in eine Welt voller Raubtiere und urzeitlicher Riesen.

    Das Überleben für den Homo sapiens ist dort nicht einfach. Die Landschaft ist karg und größtenteils mit Schnee und Eis bedeckt. Das Nahrungsangebot ist zwar ausreichend, doch die frühen Menschen werden von gigantischen Tieren bedroht: der Megafauna.
