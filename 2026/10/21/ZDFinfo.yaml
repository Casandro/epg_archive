    Das mildere Klima ermöglicht den Menschen, Pflanzen anzubauen, Tiere zu halten und feste Behausungen zu errichten. Doch sie gehen ein Wagnis ein, denn die Sesshaftigkeit bringt nicht nur zahlreiche Vorteile mit sich, sondern auch ungeahnte Herausforderungen.
