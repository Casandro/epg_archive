  title: 'Manjinski mozaik: Edin'
  subtitle: Svaki tjedan donosi dokumentarne priče iz života 22 nacionalne manjine. Predstavlja portrete osoba i zajednica ističući njihov nacionalni, kulturni i povijesni identitet, običaje i tradiciju.
  ageRating: 4
  genre:
  - '128'
  description: Čitav život sam učenik jer sam znatiželjan. I uvijek sam nalazio na dobre učitelje. Tako govori Edin Nurkić. Za sebe kaže da je Bošnjak i Splićanin koji je 91. stao na branik grada i države. Ali prije svega on je humanist koji 30-ak godina u Domu za djecu i mlade oblikuje bolje živote splitske dice. U grad podno Marjana došao je kao dječarac 1969. iz Mostara. Zahvalan je roditeljima koji su odlučili ostati i osigurati mu divno djetinjstvo, ali i stalnu vezu s rodnim krajem. Zato i ne čudi da je Edin i danas pokretač mnogih aktivnosti Bošnjačkog kulturnog društva Preporod i Vijeća bošnjačke nacionalne manjine.
