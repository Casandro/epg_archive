  title: Rockle
  description: Legendární domácí skupina Laura a její tygři slaví 40 let na koncertních pódiích mimořádnými koncerty In!Ventura Tour 1986 - 2026 a navíc její kapelník Karel Šůcha stihl připravit už 13. řadové album s názvem Most. K mikrofonu pozval dávné členy Ilonu Csákovou a Bohumila Vitáska, kteří také pamatují původní město ještě před zatopením. O nové desce Laury a jejích tygrů i o turné, které bude mít poslední říjnový den zastávku v olomouckém Bounty Rock Café, si s Karlem Šůchou budeme povídat mimořádně ve středu v Rockli ČRo Olomouc. Moderuje Jiří Matějů.
