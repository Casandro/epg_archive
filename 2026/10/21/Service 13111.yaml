  title: Fahrt ins Risiko
  subtitle: Kolumbien - Ausnahmezustand an der Karibikküste
  description: "Im äußersten Nordosten Kolumbiens verläuft die karibische Hauptstraße, vorbei an lebendigen Städten, dem höchsten Küstengebirge der Welt, durch Regenwald und Salzminen in die Wüste der Guajira. Die Straße hat ihre Tücken: Sie wird vom Meer überspült, von Wind und Sand verblasen. \nJedes Jahr im Februar herrscht Ausnahmezustand an der wichtigen Verkehrsader, denn es ist Karneval. Dann gehören die Straßen den Clowns, Musik- und Tanzgruppen. Die afrikanischen Rhythmen, indigenen Instrumente und europäischen Einflüsse vermischen sich zu einem bunten, lauten Fest, das die einzigartige Vergangenheit der Gegend spürbar macht. Die bezaubernde Gegend ist auch die Heimat von vier indigenen Völkern. Die Straße ist ihnen ein Dorn im Auge, denn sie bedroht die Natur. Immer wieder demonstrieren die \"Arhuacos\" aus dem Küstengebirge gegen den weiteren Ausbau und andere Infrastrukturprojekte. Die Straße und die nahegelegene Kohlemine sind jetzt schon ein massiver Eingriff in die Natur. Das spürt auch Raphael. Wegen anhaltendem Wassermangel liefert er mit einem jahrzehntealten LKW das Trinkwasser über holprige Straßen an die Bevölkerung aus. Trotzdem verfügt die Gegend noch über eine große Biodiversität. Jaguare bewohnen das Gebirge. Doch ihr Lebensraum wurde durch den Bau der Straße stark eingeschränkt. Catalina und die Gemeinschaft der Kogi arbeiten daran Wildbrücken und Tunnels zu bauen, um die Jaguare wieder ans Meer zu locken.\nIm äußersten Nordosten Kolumbiens liegt die Guajira-Wüste, umgeben vom Meer der Karibik. Das Gebiet ist Dokaris Heimat und Arbeitsumfeld. Mit dem LKW ihrer Schwestern transportiert sie Salz in die entlegensten Ecken. Der Weg über unmarkierte, holprige Sandpisten ist ein echtes Abenteuer und auch der alte LKW macht nicht immer, was er soll.\nDokumentarfilm, Deutschland 2024, R: Alexander Hick"
  genre:
  - '112'
  widescreen: true
