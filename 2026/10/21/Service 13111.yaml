  title: Hubert ohne Staller
  subtitle: Ein Paket zu viel
  description: "Hubert und Girwidz gehen einer Beschwerde wegen Lärmbelästigung nach und finden die Leiche von Jessica Jablonski in ihrer Wohnung. Offenbar ist die Shopping-süchtige Frau beim Öffnen eines Pakets verstorben. Ein Zünder lässt darauf schließen, dass es mit einer Knallvorrichtung versehen war. Laut Pathologie litt Jablonski unter einem Herzfehler und könnte durch einen Schock verstorben sein. Hat gar jemand absichtlich versucht, sie durch einen lauten Knall umzubringen? Oder war es ein schlechter Marketing-Gag? \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
