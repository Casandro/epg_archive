  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Druidenzirkel
  description: "In den 1970er Jahren verursachte der Harvard-Professor Barry Fell einen Zwist in der Wissenschaftswelt. Denn er behauptete, dass altertümliche Druiden vor Jahrtausenden den ganzen Weg von Großbritannien nach Nordamerika gesegelt seien. Diese Druiden sollen auch seltsame Steinkonstruktionen hinterlassen haben, die man noch heute in New England und im New Yorker Hudson Valley vorfinden kann. Seit dem Jahr 1982 wurden zahlreiche UFOs im Hudson Valley gesichtet, direkt über den altertümlichen Steinbauten. Später, im Jahr 1987, schockierte der Autor Whitley Strieber die Welt mit einer Erzählung über eine Entführung durch Außerirdische, die in eben jener Gegend stattgefunden haben soll. Könnten all diese Vorfälle zusammenhängen? Sind somit tatsächlich altertümliche Druiden nach Nordamerika gereist, lange bevor Christoph Kolumbus den Kontinent entdeckt hat? \nDokumentarfilm, Vereinigte Staaten Von Amerika 2019"
