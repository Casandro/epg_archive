  title: Lautlose Morde
  description: "Der berufliche Erfolg ist nur ein schwacher Trost für den Banker Andreas Mersfeld (Fritz Karl). Er war verantwortlich für den Unfalltod seines Sohnes, und nun erfährt er vom Selbstmord seiner Frau Julia in einer Frankfurter Psychiatrie. Julia, die den Tod des gemeinsamen Kindes nie überwinden konnte, wurde dort wegen ihrer Depressionen behandelt. Als Andreas jedoch Sarah Merlow (Jessica Schwarz) begegnet, eröffnet sich ihm ein vollkommen neues Bild. Sarah ist die Gattin des Klinik-Professors und berichtet von Therapien mit einem nicht zugelassenen Medikament. Sie selbst wurde unschuldig eingewiesen und wie ihre Zimmergenossin Julia auf diese Weise behandelt. Bei dem Arzneimittel dreht es sich um ein Antidepressivum der Firma Votec. Mit dem Medikamenten-Hersteller konnte Andreas erst vor Kurzem einen lukrativen Deal einfädeln. Die entflohene Sarah fürchtet um ihr Leben. In Österreich finden Andreas und Sarah zunächst Unterschlupf. Doch als Andreas über die Todesumstände seiner Frau nachforscht, kommt plötzlich auch Sarah als Mörderin in Frage. \n\nWer am Ende die Wahrheit spricht und was wirklich geschehen ist, bleibt lange unklar in dem wendungsreichen Thriller \"Lautlose Mörder\" von Jörg Grünler (\"Krücke\", \"Der zehnte Sommer\"). Geschickt gelingt es dem Regisseur, das hochaktuelle Thema von der Macht der Pharmaindustrie und der möglichen Verwendung nicht erlaubter Medikamente in eine spannende Krimihandlung zu kleiden. Beeindruckend das differenzierte Spiel von Fritz Karl (\"Meiberger - Im Kopf des Täters\") als zunehmend verunsicherter Banker Andreas Mersfeld sowie von Jessica Schwarz (\"Romy\") in der Rolle der undurchsichtigen Sarah Mellow.\nThriller, Deutschland 2010, R: Jörg Grünler"
