  title: Geniale Räuber
  subtitle: Krokodile auf der Jagd
  description: "Das Nilkrokodil gilt als das stärkste Raubtier in Afrikas Süßwassergebieten. Die Dokumentation folgt einem dominanten Krokodilmännchen in Tansanias Grumeti-Region über ein Jahr hinweg, während es sich den Herausforderungen der Nahrungssuche, der Fortpflanzung und des Überlebens in einer sich ständig verändernden Umwelt stellt. \nAchtzig Kilometer entfernt, im Fluss Mara, lauern junge männliche Krokodile auf Beute. Sie sind bereit ihre Fähigkeiten unter Beweis zu stellen, um in der Hierarchie aufzusteigen. Die weiblichen Krokodile suchen währenddessen nach Partnern. Auch sie haben nur begrenzt Zeit, sich zu paaren und ihre Eier zu legen. Zudem müssen sie jagen. Ist erstmal das Gelege mit den Eiern bereit, muss die Krokodilmutter ununterbrochen darüber wachen. Dann bleibt keine Zeit zu jagen und zu fressen.\nElf Monate im Jahr ist das dominante Männchen in der Grumeti-Region auf kleinere Beutetiere angewiesen, die im oder am Fluss leben. Aber einen Monat lang ist Zeit für so manches Festmahl. Denn dann kommt es zur Großen Tierwanderung und die Gnu- und Zebraherden ziehen vorbei. Einen großen, ausgewachsenen Gnu-Bullen zu erlegen, könnte das Krokodil das ganze Jahr über ernähren. Deshalb setzt es all sein Können ein, um aus dem Hinterhalt anzugeifen und die Beute in eine Falle zu locken. Aber wird es gelingen? Jetzt heißt es: Alles oder nichts. \nDokumentarfilm, Vereinigtes Königreich 2024"
