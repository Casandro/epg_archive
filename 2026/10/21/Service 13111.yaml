  title: Bergwelten
  subtitle: Durch die Brenta Dolomiten - im Bann der Bären
  description: 'Diese Bergwelten-Dokumentation zeigt einen außergewöhnlichen Naturfilm aus den Brenta Dolomiten im nordwestlichen Trentino. Im Mittelpunkt steht der Südtiroler Horst Eberhöfer. Ein Mann, der sich vom Wilderer zum Wildtierfotografen wandelt und den Bären in dieser einzigartigen Bergwelt so nah kommt, wie niemand sonst. Die Idee zu diesem Film entsteht in einem Gespräch zwischen Kameramann Marco Polo und Regisseur Markus Frings. Marco Polo hat Horst Eberhöfer schon vor Jahren auf der Jagd kennengelernt und war von seiner besonderen Gabe fasziniert, Tieren in freier Wildbahn auf die Spur zu kommen. Als er Frings Bärenfotos von Horst zeigt, wird schnell klar, dass diese Geschichte wie geschaffen für Bergwelten sein könnte. Die Dolomiten, ein außergewöhnlicher Natur-und Bergmensch und wildlebende Bären, deren Dasein in dieser Region nicht unumstritten ist. Ein Themen-Mix, der Bergwelten-Chef Hans-Peter Stauber sofort überzeugte. Der Film begleitet Horst Eberhöfer über mehrere Jahre hinweg durch die Brenta Dolomiten, wo rund 80 bis 100 Braunbären durch Schluchten, Wälder und über Almen streifen. Es ist eine der wenigen Regionen Europas, wo Mensch und Bär in unmittelbarer Nähe zueinander leben. Nicht immer, aber doch immer wieder zu nahe. Mit unglaublicher Geduld, feinem Gespür für diese wilden Kreaturen und sensibler Kameraarbeit gelingt es Horst Bilder einzufangen, wie sie in der freien Natur bislang kaum zu sehen waren. Bären im Kampf und beim Liebesspiel, spielende und erstmals kletternde Jungtiere, aber auch Begegnungen zwischen Mensch und Bär. Hirten, die ihre Schafherden mit mobilen Zäunen, aber auch mit scharfen Hunden schützen.Österreich 2024, R: Hans-Peter Stauber, Markus Frings'
  widescreen: true
