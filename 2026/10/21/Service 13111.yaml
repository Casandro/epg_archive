  title: Michael Martin - Gesichter der Erde
  subtitle: Sibirien
  description: "Sibirien reicht vom Ural bis zum Pazifik, vom Arktischen Ozean bis an die Steppen und Wüsten Kasachstans, Chinas und der Mongolei - durchzogen von 50.000 Flüssen und bedeckt von unendlichen Wäldern. Im grimmigen sibirischen Winter besucht Michael Martin die Rentiernomaden der Nenzen in der Waldtundra, bestaunt das glasklare Eis des Baikalsees und fährt 2000 Kilometer durch Jakutien, das \"kalte Herz Sibiriens\". Endpunkt der Reise ist der kälteste bewohnte Ort der Erde, wo Michael Martin auf umso warmherzigere Menschen trifft. \nDokumentarfilm, Deutschland 2021, R: Viktor Stauder"
