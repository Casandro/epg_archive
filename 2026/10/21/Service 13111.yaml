  title: Quizmaster
  description: Wer sich den Fragen von Moderator Andreas Moravec stellt, kann täglich von Montag bis Freitag bis zu 5000.- Euro abräumen. Vier Herausforderer haben die Chance, in fünf Wissensgebieten gegen den Quizmaster anzutreten und ihn vom Thron zu stoßen. In den letzten beiden Runden duelliert sich der Quizmaster mit dem besten Herausforderer. Derjenige, der aus dem Duell als Sieger hervorgeht, nimmt das gesamte, erspielte Geld mit nach Hause und steigt in der nächsten Show als Quizmaster in den Ring. Setzt sich der Quizmaster gegen seine Konkurrenten durch, bleibt er im Spiel und spielt in der nächsten Sendung erneut um 5000.- Euro. Die TV Zuschauer können via App im "Live Modus" zeitgleich mit den Kandidaten im TV mitspielen und haben so die Möglichkeit, sich als Kandidat für das Studio zu qualifizieren und jeden Freitag den "App Jackpot" einzustreichen - das Geld, das während der Woche durch falsch beantwortete Fragen, nicht an den Quizmaster oder seine Herausforderer ausgespielt wurde.Österreich 2026
