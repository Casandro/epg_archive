  title: Der Schmidt Max auf der Suche
  subtitle: nach der Freundschaft
  description: 'Der Schmidt Max bekommt in München ein Freunde-Coaching von der Therapeutin Birgit Salewski. In der Nähe von Bamberg trifft er Andreas Reich und Simon Limpert, zwei enge Freunde, die ein Schicksalsschlag noch mehr verbunden hat. In Kemnath erfährt Max von einer Tanzgruppe, was Frauenfreundschaft bedeutet und auf dem Wallberg erzählen ihm Vincent Zeitler und Markus Kaufmann von ihrer besonderen Freundschaft, die ungewöhnlich begonnen hat: mit einer Stammzellenspende.'
