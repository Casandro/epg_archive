  title: Boden und Ernährung
  description: Die Schüler einer Waldorfschule pflanzen in ihrem Schulgarten Salat an. Ein Landwirt im Gäuboden bestellt sein Feld mit Kartoffeln. Der Film begleitet beide von der Aussaat im Frühjahr bis zur Ernte im Herbst. Im Focus steht der Boden, er wird gebraucht für die Produktion von Lebensmitteln, er wird aber auch verbraucht. Deutlich werden die Grenzen und Risiken der Ertragssteigerung und die Bedeutung einer nachhaltigen Bodennutzung für die Ernährung. Die Schüler erkennen, dass ihr Schulgarten für die vollständige Ernährung einer Schulklasse viel größer sein müßte.
