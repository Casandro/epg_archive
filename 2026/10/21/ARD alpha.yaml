  genre:
  - '16'
  description: 'Bitzer kommt mit dem Farmer vom Arzt. Er hat ein kleines Pflaster am Po und trägt einen Halskragen. Die Schafe kümmern sich rührend um ihn, und Bitzer genießt die Fürsorge. Als der Farmer ihm Pflaster und Kragen abnimmt und Bitzer für geheilt erklärt, gerät der in Panik: Schließlich kochen die Schafe gerade für ihn! Bitzer besorgt sich einen Ersatzkragen und spielt weiter krank.'
