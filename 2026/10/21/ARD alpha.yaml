  description: Leonhard Korbinian Meyer ist am 17. Januar 2006 mit nur 12 Jahren an Leukämie verstorben. Der Film erzählt seine Geschichte. Es ist eine Geschichte von Freundschaft, Liebe, Hoffnung und Tod, erzählt durch seine Eltern, Freunde und Lehrer. Im Mittelpunkt des Filmes steht ein Buch, das zwischen Leo und seiner Klasse über Jahre hin- und hergewandert ist. Texte aus längst vergangenen Tagen auch von Leo erfüllen den Raum und hinterlassen eine unheimliche Stille. Leos Stille. Die Stille nach seinem Tod.
