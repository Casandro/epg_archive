  title: Willi wills wissen
  subtitle: Wie kommt das Salz in die Suppe?
  subtitled: true
  description: 'Willi kocht sein Lieblingsessen, eine Suppe. Was fehlt? Na, Salz natürlich. Denn ohne Salz schmeckt kein Essen. Und deswegen will Reporter Willi wissen, wo das Salz überhaupt herkommt. Dazu macht er sich auf den Weg ins Salzbergwerk nach Berchtesgaden. Zusammen mit Bergmann Hans schließt sich Willi der Frühschicht an. Willi ist verblüfft. Hier, mitten im Berg, ist rings um ihn herum tatsächlich alles voller Salz! Auch wenn es nicht die gewohnt weiße Farbe hat: Das Gestein der Stollenwände schmeckt eindeutig danach.'
