  title: Spillover - Planet der Viren
  subtitle: Deutschland 2024
  subtitled: true
  description: Klimawandel, menschliches Handeln und der Ausbruch von Pandemien - wie hängt das zusammen? Ob Ebola, Marburg, Hanta, COVID-19 oder die Vogelgrippe - die Liste der tödlichen Viren, die bereits vom Tier auf den Menschen übergesprungen sind, ist lang. Dieser sogenannte Spillover, also der Prozess, bei dem ein Erreger von einer Tierart auf den Menschen übergeht und sich dort verbreitet, wird immer häufiger - und für uns zu einer immer akuteren Bedrohung.
