  title: Wissen vor acht - Erde
  subtitle: Wann ist das Öl alle?
  description: Das Öl ist bald alle! Das sagte schon 1972 der Club of Rome voraus. Spätestens 2002, so hatte man im Bestseller "Die Grenzen des Wachstums" berechnet, würden alle Öl-Reserven aufgebraucht sein. 2002 ist längst vorbei und Öl haben wir immer noch. Woher diese Fehlkalkulation kam und wieso wir trotzdem sparsam mit dem Öl umgehen sollten, erklärt Eckart von Hirschhausen in "Wissen vor acht - Erde".
