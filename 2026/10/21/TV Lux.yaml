  description: 'Príbeh sa odohráva v paneláku, počas rušného sobotného rána. Pani Zlatica, bývalá učiteľka, je zvedavá a klebetná obyvateľka, ktorá si v pokoji chcela vychutnať svoj narodeninový deň pri obľúbenej televíznej relácii. Rušia ju však hry detí na ihrisku, rozliehajúci sa zvuk klavíra po poschodí a znepokojuje ju aj nová susedka Ingrid. Premôže Zlatica svoju zvedavosť a dočká sa svojho narodeninového priania? Réžia: Igor Pargáč. Účinkujú: Olga Salagová, Marta Kondrla, Michaela Drotárová, Kovács Benjámin (2021)'
