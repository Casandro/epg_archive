  title: Leto bez mrlje, ep. 35. serija
  subtitle: Komedija
  description: '"Leto bez mrlje" humoristička je serija u formi sitcoma s elementima telenovele, smještena na otok Rab, koji svojom ljepotom i šarmom postaje neizostavan lik ove tople, duhovite i vizualno atraktivne priče. Radnja prati brata i sestru iz Beograda, Luku i Anđelu, kojima je njihova ekscentrična baka obećala u nasljedstvo ostaviti kuću na Rabu.No uvjet je jednostavan samo na papiru: tijekom cijelog ljeta moraju uspješno iznajmljivati kuću turistima bez ijedne negativne recenzije. U praksi to znači svakodnevno suočavanje s nizom nepredvidivih gostiju, kulturoloških razlika, ljubavnih zavrzlama, tajni, podvala i urnebesnih nesporazuma. Uz sve to, tu je i bakin dodatni "dar", strogi batler Stipe, koji dolazi u paketu s kućom i čija prisutnost unosi dodatnu napetost i humor u svakodnevnicu mladih domaćina. Uz obilje humora, serija je prožeta emocijama i empatijom jer likovi, unatoč nesporazumima i razlikama, u svakoj epizodi pronalaze zajednički jezik, otkrivajući važnost međusobnog razumijevanja, solidarnosti i obitelji. "Leto bez mrlje" serija je o obitelji, ambiciji, snalažljivosti i izazovima ljeta. Glavne uloge: Andrej Jemcov, Maša Đorđević, Asim Ugljen...'
