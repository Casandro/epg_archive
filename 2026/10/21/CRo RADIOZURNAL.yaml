  stop: 2026-10-21T21:00:00Z
  title: Host Radiožurnálu
  description: Režisér Vít Klusák v novém dokumentu Jediná vteřina přibližuje čtyři skutečné příběhy tragických dopravních nehod. Nechává promluvit řidiče, kteří je způsobili, i pozůstalé. Proč za volantem podceňujeme zdánlivé maličkosti? A dokážeme si připustit, že podobná tragédie se může stát každému z nás? Moderuje Jan Pokorný. (repríza)
