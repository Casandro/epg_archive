- eventId: 932025
  start: 2026-10-21T20:05:00Z
  stop: 2026-10-21T20:30:00Z
  title: Host Radiožurnálu
  description: 'Příběh ženy, která připravila sokoly o miliony. Třetí díl: Život ve lži Když Eliška Colding nastupovala do Sokola, měla už za sebou dlouhou řadu podvodů. Zároveň ale dlužila peníze a jen se štěstím se jí dařilo vyhýbat vězení. Právě v době, kdy se stala pravou rukou starostky Sokola, ji začala donánět vlastní minulost. Kdy a proč nastoupila na dráhu podvodnice? Policejní dokumenty a svědectví okradených podnikatelů odhalují, jakým způsobem Colding obírala lidi, kteří jí věřili.'
