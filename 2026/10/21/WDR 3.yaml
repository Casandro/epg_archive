  title: ARD Konzert
  subtitle: Graupner im Kirchheimer Konzertwinter 2026 - Sommeredition
  description: |-
    Christoph Graupner wollte Opern schreiben, aber der Darmstädter Hof hatte kein Geld dafür. Also verlegte der Hofkapellmeister seine Dramaturgie kurzerhand in die Kirche und komponierte in 45 Jahren über 1450 Kantaten. Seine vergessenen Werke werden seit einigen Jahren systematisch wiederentdeckt, aufgeführt und eingespielt - maßgeblich durch das Kantaten-Projekt des Bassbaritons Dominik Wörner im kleinen pfälzischen Weinort Kirchheim an der Weinstraße. Fünf Kantaten stehen dieses Jahr auf dem Programm - auf Texte von Johann Conrad Lichtenberg, konzipiert für eine einzelne Singstimme und kleines Instrumentalensemble.
    <strong>Christoph Graupner</strong><br/><strong>Ein Gnadenglanz strahlt aus der Höhe</strong>, GWV 1107/41, <br/>Kantate zum 3. Weihnachtstag<strong><br/>Siehe, dieser wird gesetzt zu einem Fall</strong>, GWV 1108/45, <br/>Kantate zum Sonntag nach Weihnachten<br/><strong>Gleich wie mich der Vater gesandt hat</strong>, GWV 1131/18, <br/>Kantate zum 1. Sonntag nach Ostern (Quasimodogeniti)<br/><strong>Teurer Tröster aus der Höhe</strong>, GWV 1137/42, <br/>Kantate zum 6. Sonntag nach Ostern (Exaudi)<br/><strong>Wer nicht zur Tür hineingehet</strong>, GWV 1140/43, <br/>Kantate zum 3. Pfingsttag
    Aufnahmen vom 22. und 23. August 2026 aus der Protestantischen Kirche in Kirchheim an der Weinstraße
    <strong>Kirchheimer BachConsort<br/>Dominik Wörner</strong>, Bass<br/>Leitung: <strong>Florian Heyerick</strong>
