  title: Thorin - Der letzte Neandertaler
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Grotte Mandrin im Rhône-Tal ist eine faszinierende Ausgrabungsstätte. Der Archäologe Ludovic Slimak entdeckte hier Fossilien und Feuersteine, die beweisen, dass Neandertaler die Höhle über 80.000 Jahre lang bewohnten. Die Funde erlauben Rückschlüsse auf die Ankunft der ersten Vertreter des Homo sapiens im heutigen Westeuropa vor circa 54.000 Jahren und zeugen sogar von einem Zusammentreffen der beiden Menschenformen. Zudem wurde in der Höhle der erste Neandertaler in Frankreich seit einem halben Jahrhundert ausgegraben: Er gehörte einer der letzten Neandertaler-Linien an und bekam den Namen Thorin.'
