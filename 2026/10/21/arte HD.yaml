  title: Quallen
  subtitle: Hirnlos, aber oho
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Sie haben weder Herz, noch Hirn oder Skelett und bestehen zu 90 Prozent aus Wasser. Und doch sorgen Quallen regelmäßig für Schlagzeilen. Mancherorts verbreiten sie sich gar massiv - dann spricht man von Quallenalarm. Trotz ihres einfachen Baus besitzen Quallen regelrechte Superkräfte. \nDiese Dokumentation konzentriert sich auf die Ohrenqualle - Aurelia aurita - und zeigt auf, wie sich diese und andere Arten dank Überfischung, Klimaerwärmung und Umweltverschmutzung rasant vermehren können."
