  title: Hexenwahn - Die Dokumentation
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2014
    Zu Beginn der frühen Neuzeit wurden in Europa Zehntausende angebliche Hexen auf dem Scheiterhaufen verbrannt. Besonders hell loderten die Feuer in Deutschland.

    Ein Zentrum der Hexenverfolgung war das katholische Bamberg. Unter Fürstbischof Fuchs von Dornheim wurde fast der gesamte Stadtrat der Hexerei bezichtigt und hingerichtet. Erhaltene Prozessakten geben Einblicke in die Anklage- und Strafpraxis jener Zeit.
    HD-Produktion
