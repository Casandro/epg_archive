  title: Humans - Geschichte der Menschheit
  subtitle: Von Jägern zu Siedlern
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2026
    Als vor rund 12.000 Jahren die letzte Eiszeit endet, ändern die Menschen ihre Lebensweise von Grund auf. Sie geben ihr Dasein als Jäger und Sammler auf und lassen sich dauerhaft nieder.

    Das mildere Klima ermöglicht den Menschen, Pflanzen anzubauen, Tiere zu halten und feste Behausungen zu errichten. Doch sie gehen ein Wagnis ein, denn die Sesshaftigkeit bringt nicht nur zahlreiche Vorteile mit sich, sondern auch ungeahnte Herausforderungen.
    HD-Produktion
- eventId:
