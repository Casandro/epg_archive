  title: Humans - Geschichte der Menschheit
  subtitle: Vergessene Verwandte
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2026
    Die Evolution des Menschen ist geprägt von Aufbrüchen und Rückschlägen. Unsere Geschichte beginnt vor Millionen von Jahren. Sie hätte auch ganz anders ausgehen können.

    Als der Homo sapiens in Afrika auftaucht, ist er nicht allein: Mehrere Menschenarten teilen sich die Welt. Manche beherrschen bereits Werkzeuge und Feuer. Doch kleine Populationen, Klimawandel, Konkurrenz und Vermischungen lassen viele Linien verschwinden.
    HD-Produktion
- eventId:
  - 1543699
  - 608308
  start: 2026-10-21T01:25:00Z
  stop: 2026-10-21T02:05:00Z
  title: Humans - Geschichte der Menschheit
  subtitle: Aufbruch aus Afrika
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2026
    Vor rund 70.000 Jahren beginnt sich das Klima in Afrika zu wandeln. Ein Prozess, der dem Homo sapiens neue Lebensräume eröffnet. Er wagt sich über die Grenzen des Kontinents hinaus.

    In nur wenigen Jahrtausenden verbreitet er sich über den gesamten Globus. Auf seinem Weg passt er sich selbst extremen Lebensräumen an, etwa den tropischen Regenwäldern Südostasiens. Funde auf der indonesischen Insel Flores zeigen jedoch, dass er nicht allein war.
    HD-Produktion
- eventId:
  - 1546614
  - 608309
  start: 2026-10-21T02:05:00Z
  stop: 2026-10-21T02:50:00Z
  title: Humans - Geschichte der Menschheit
  subtitle: Kampf ums Überleben
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2026
    Vor rund 40.000 Jahren leben mehrere Menschenarten auf der Welt: in Asien der Denisova-Mensch, in Europa der Neandertaler, und der Homo Sapiens hat sich bis nach Australien ausgebreitet.

    Neue Forschungen zeigen, dass das Bild vom primitiven Neandertaler überholt ist: Er nutzte Pigmente für Höhlenmalereien und fertigte Schmuck aus Federn und Vogelkrallen.
    HD-Produktion
- eventId:
  - 1546615
  - 608310
  start: 2026-10-21T02:50:00Z
  stop: 2026-10-21T03:35:00Z
  title: Humans - Geschichte der Menschheit
  subtitle: Neue Welten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2026
    Auf dem Höhepunkt der letzten Eiszeit ziehen die ersten Menschen von Ostasien über eine Landbrücke namens Beringia nach Nordamerika: in eine Welt voller Raubtiere und urzeitlicher Riesen.

    Das Überleben für den Homo sapiens ist dort nicht einfach. Die Landschaft ist karg und größtenteils mit Schnee und Eis bedeckt. Das Nahrungsangebot ist zwar ausreichend, doch die frühen Menschen werden von gigantischen Tieren bedroht: der Megafauna.
    HD-Produktion
- eventId:
