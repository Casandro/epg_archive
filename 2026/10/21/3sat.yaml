  title: Wasserreich - Vorarlbergs Bäche, Seen und Wasserfälle
  subtitle: Film von Raphaela Stefandl
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Wasser ist für Vorarlberg der wichtigste Bodenschatz. Der Film zeigt, wie in der regenreichen Region Seen, Bäche und Wasserfälle die Landschaft prägen und welche Umweltgefahren drohen.

    Ist der Wasserreichtum auch in Zeiten des Klimawandels gesichert? Welchen Bedrohungen ist das Lebenselixier ausgesetzt? Experten aus Umweltinstituten, Biologinnen, Naturführer und Wasserfreunde kommen zu Wort.
    HD-Produktion
