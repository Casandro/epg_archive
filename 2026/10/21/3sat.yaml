  title: Stalin und Trotzki - Die Todfeinde
  subtitle: Film von Marie-Laurence Rincé
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Mexiko, 20. August 1940: Mit einem Eispickel wird Trotzki der Schädel eingeschlagen. Mit seinem Tod endet ein fast 20 Jahre andauerndes Duell um die Spitze der kommunistischen Bewegung.

    Stalin, der uneingeschränkte Alleinherrscher der Sowjetunion, hat endlich seinen langjährigen Rivalen eliminiert. Beide spielten tragende Rollen bei der Revolution, beide schreckten vor nichts zurück, um an die Hebel der absoluten Macht zu gelangen.
