  description: |-
    Deutschland 2026
    KI-Boom: Droht ein Brain Drain? - KI-Agenten wie ChatGPT und Claude halten Einzug in Schulen, Universitäten, Krankenhäuser und Unternehmen. Während viele vor allem den Verlust von Arbeitsplätzen befürchten, stellt sich eine andere Frage: Was passiert, wenn Menschen immer mehr Aufgaben an KI auslagern und dadurch weniger Wissen, Erfahrung und Fähigkeiten selbst aufbauen?

    Hochwasser auf Knopfdruck - Im schweizerischen Andelfingen simuliert ein einzigartiger Trainingsturm realistische Hochwasserkatastrophen: Innerhalb von fünf Minuten stürzen 350.000 Liter Wasser herab. Feuerwehr und Zivilschutz bereiten sich hier auf Extremereignisse vor, die durch die Klimaerwärmung künftig häufiger auftreten könnten.

    Idefix auf Mission zum Marsmond - Der deutsch-französische Rover "Idefix" reist mit einer japanischen Mission zum Marsmond Phobos. Dort soll er die Oberfläche erkunden und einen geeigneten Landeplatz identifizieren. Anschließend will das Mutterschiff Bodenproben sammeln und zur Erde zurückbringen. Ein Erfolg wäre ein bedeutender Meilenstein für die Raum-fahrtforschung.

    Die Rückkehr der Tiger - Kasachstan bringt den Tiger zurück: Erstmals wurde ein sibirischer Tiger im Naturschutzgebiet Ili-Balchasch ausgewildert. Langfristiges Ziel ist der Aufbau einer stabilen Population von rund 50 Tieren und die Rückkehr des Raubtiers in seinen früheren Lebensraum.

    Moderation: Ingolf Baur
