  title: Österreich und Russland - Das Ende der Dynastien
  subtitle: Film von Alexander Frohner
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Österreich und Russland verbindet lange Zeit mehr als politische Nähe. Doch hinter Bündnissen und Kaisertreffen wachsen Spannungen, die Europas Geschichte verändern.

    Im 19. Jahrhundert stützen sich die Habsburger auf russische Hilfe und feiern beim Dreikaisertreffen ihren Zusammenhalt. Doch mit dem Machtwechsel in Russland zerbricht die Allianz, und Europa steuert auf den Ersten Weltkrieg zu.
