  title: Kroatiens Süden
  subtitle: Inselparadies und Traumstädte
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Über 1000 Inseln, spektakuläre Küsten und historische Städte: Ramon Babazadeh reist durch den Süden Kroatiens und entdeckt die Vielfalt der Adriaküste.

    Auf Vis erkundet er eine geheimnisvoll blau leuchtende Grotte, und in der Cetina-Schlucht wagt er sich beim Canyoning 180 Meter in die Tiefe. Unterwegs erlebt er die Gastfreundschaft der Menschen und die Tradition des Klapa-Gesangs.
    Moderation: Ramon Babazadeh

