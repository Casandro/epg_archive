  description: |-
    Deutschland 2026
    Protestwelle in Europas Städten - In mehreren europäischen Ländern gehen junge Menschen auf die Straße. Auslöser sind marode Schulen, Lehrkräftemangel, hohe Lebenshaltungskosten, Korruption und fehlende Perspektiven. Während viele Demonstrationen friedlich verlaufen, kommt es mancherorts zu Krawallen und Ausschreitungen. Die Proteste verdeutlichen die wachsende Unzufriedenheit einer jungen Generation in Europa.

    Gold um jeden Preis - Trotz jahrelanger Proteste und laufender Klagen soll in Armenien die größte Goldmine des Landes den Betrieb aufnehmen. Regierung und Betreiber verweisen auf Investitionen und zusätzliche Einnahmen. Umweltverbände warnen dagegen vor erheblichen Risiken für Wasserressourcen, Landwirtschaft und Tourismus in einer ökologisch sensiblen Region.

    Kohleverbrauch auf Rekordniveau - Der weltweite Kohleverbrauch steigt auf knapp neun Milliarden Tonnen und erreicht damit einen Höchststand. Verantwortlich sind vor allem die hohen Preise für Öl und Gas. Langfristig erwarten Fachleute dennoch einen Rückgang der Kohlenutzung und einen weiteren Ausbau erneuerbarer Energien.

    Das Geheimnis unserer Zunge - Forschende der Universität Leeds haben eine künstliche Zungenoberfläche mit realitätsnahen Papillen entwickelt. Damit analysieren sie das Mundgefühl von Lebensmitteln und wollen insbesondere pflanzliche Alternativen schmackhafter machen. KI-gestützte Auswertungen zeigen zudem, dass die Zungenoberfläche ähnlich individuell ist wie ein Fingerabdruck.

    Moderation: Ingolf Baur
