  title: 'Detektyw Candice: Niezawodny instynkt 4 (odc. 5)'
  subtitle: Candice zajmuje się sprawą seryjnego zabójcy emerytów. Śledztwo doprowadza ją do rodzinnego Velenciennes, gdzie niegdyś przeżyła tragedię.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2016
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Szczęśliwy ze swego powrotu do S?te i dawnej ekipy Antoine nie podejrzewał, jak bardzo ucierpiała pozycja Candice. Nie są jej powierzane żadne ciekawe sprawy. Kobieta zajmuje się sprawami dotyczącymi zwykłych pijackich burd i kradzieżami w sklepikach osiedlowych. Kiedy jednak ma się otwarty umysł i oczy szeroko otwarte, wszystko może się zdarzyć. I tak od zwykłego złożenia w trumnie Candice przejdzie do tropienia seryjnego zabójcy emerytów.
  ageRating: 12
