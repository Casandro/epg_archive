  title: Kaisers Klänge - Musikalische Entdeckungsreisen
  subtitle: Die singende Nachtwache - Musik zu berühmten Bildern
  description: |-
    Rembrandts "Nachtwache", Botticellis "Geburt der Venus", Klees "Zwitschermaschine" oder Goyas "Maja" - was haben alle diese berühmten Gemälde gemeinsam? Zu jedem von ihnen gibt es Vertonungen! Klavierstücke, Kammermusik oder Orchesterwerke übertragen die visuellen Motive in die Klangfarben der Musik.

    Wird wiederholt am 25.10.2026.
