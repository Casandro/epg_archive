  title: Gesprächszeit
  description: Die wichtigste Recherche ihres Lebens führte Journalistin und Künstlerin Geraldine Oetken in die eigene Vergangenheit. Mit Anfang dreißig erfuhr die gebürtige Oldenburgerin von einer Leerstelle in ihrem Familien-Stammbaum - ihrer Urgroßtante, von der in der Familie nie jemand erzählt hat. Bekannt war nur, dass sie 1941 in einer Pflegeanstalt gestorben war. Über ihre Spurensuche stieß Oetken auf ein düsteres Kapitel der NS-Krankenmorde im Kloster Blankenburg bei Oldenburg.
  subtitle: mit Kirsten Rautenberg
