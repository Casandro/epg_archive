  title: Bergwelten - Trans Salzburgerland
  subtitle: Bergwelten - Trans Salzburgerland
  description: |-
    Bergwelten: Ski-Olympiasiegerin Viktoria Rebensburg und die Profi-Freeriderinnen Sabine Schipflinger und Sandra Lahnsteiner wagen eine hochwinterliche Ski-Durchquerung des Salzburgerlandes.
    Die Trans Salzburgerland ist ein Skitouren-Abenteuer von dem jeder träumt. Eine Olympiasiegerin und zwei Profi-Freeriderinnen wagen eine hochwinterliche Skidurchquerung von Sportgastein nach Hinterglemm. Viktoria Rebensburg, Sabine Schipflinger und die Freeride Pionierin Sandra Lahnsteiner kämpfen sich über Grate und Gletscher. Fünf Tage geht es durch die Berge ihrer Heimat. Nach den wildesten Abfahrten in aller Welt, entdecken sie jetzt die Berge ihrer Heimat auf der Trans-Salzburger Land. Und als Finale wartet der höchste Berg Österreichs. AT 2020
