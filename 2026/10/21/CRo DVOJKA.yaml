- eventId: 930616
  start: 2026-10-21T20:00:00Z
  stop: 2026-10-21T20:30:00Z
  title: Četba na pokračování
  description: 'Petr Sagitarius: Trujkunt - Čtverka (6/8). Major Roman Saran na stopě třineckému vrahovi. Ostravská kriminálka řeší případ dvou vražd, do kterých jsou zapleteni dávní spolužáci ze čtvrté základní školy v Třinci. Chodil do ní i major Sagan, přesto vyšetřování dlouho míří chybným směrem. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2023.'
- eventId: 930617
  start: 2026-10-21T20:30:00Z
  stop: 2026-10-21T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Miloslav Mejzlík, herec, laureát Ceny Františka Filipovského za celoživotní působení v dabingu. Vnímá tuto disciplínu jako srovnatelně náročnou s divadlem? Které změny v pojetí herecké profese považuje za převratné? A jak prožíval, když coby umělecký šéf činohry Národního divadla v Brně řídil své kolegy? Moderuje Ondřej Kepka.'
