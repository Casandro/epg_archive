  title: 'Die Nordreportage: Kürbisernte im Norden'
  subtitle: Unheimlich vielfältig
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kürbisse zu Halloween: Vor Jahren waren sie noch eine Seltenheit, inzwischen ist der Kürbis für viele Landwirte ein wichtiges und erstaunlich vielfältiges Produkt. Der Kürbis bekommt in Norddeutschland eine immer größere Bedeutung, die Anbauflächen in Niedersachsen wachsen. "Die Nordreportage" begleitet Kürbisprofis aus Niedersachsen durch die sehr kurze Erntezeit und zeigt, wie vielfältig dieses Gewächs ist, das übrigens weder Frucht noch Gemüse ist, sondern ein Fruchtgemüse.'
