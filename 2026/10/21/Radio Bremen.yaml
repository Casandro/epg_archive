  description: "Susanne Mertens wird von ihren Kindern mit dem Vorwurf konfrontiert, dass sie sich in der Trauerphase zu sehr mit sich selbst beschäftigt hat. Während ihr Sohn Jonas nach dem Streit wieder auf Susanne zukommt, fühlt sich ihre Tochter Luisa nach wie vor von der Mutter alleingelassen und meidet sie. \nNach einem Notfall auf Mike Redmanns Farm lenkt Susanne sich mit einem Ausritt ab. Verletzt und wütend reitet sie auf der Stute Caramel davon - und stürzt schwer. \nIm Zoo wächst mittlerweile der Druck auf Dr. Elif Sahin, die versucht, ihrem Chef, Zoodirektor Jasper Winter, weitere Erfolge zu präsentieren."
