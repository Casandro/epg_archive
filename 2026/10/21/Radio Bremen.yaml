  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Für diese Hochzeit machen sich Kai und Knossi auf den Weg ans andere Ende der Welt - nach Ozeanien! 16.000 Kilometer und 40 Reisestunden von Deutschland entfernt sind sie zum großen Tag von Selai und Kenson auf Vanuatu eingeladen. Aber wie sieht eine Hochzeit abseits jeglicher Zivilisation mitten im Dschungel aus? Wie gehen die Verhandlungen der beiden Dorfvorsteher über die Braut aus, welche Rolle spielt ein Schwein, wie schmeckt ein Getränk, dessen Inhaltsstoffe von anderen vorgekaut wurden, und was sagt das Brautpaar wohl zum Hochzeitsgeschenk der beiden Freunde aus Deutschland: einer Kuckucksuhr?'
