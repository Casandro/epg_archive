- eventId: 772826
  start: 2026-10-21T03:57:00Z
  stop: 2026-10-21T04:00:00Z
  title: Myšlenka na den
  subtitle: O eutanázii
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * O eutanáziiXavier Normand z francouzského časopisu Le Pèlerin: Svatý otče, dobrý večer. Nejprve bych vám chtěl poděkovat za vaši apoštolskou cestu do Francie. Po čtyři dny žila naše země v rytmu všeobecného nadšení, které vyvolala vaše návštěva. Což je ve Francii opravdový úspěch. Děkujeme! Motto vaší apoštolské cesty znělo: ?Aby svět měl život“. Téma péče o umírající se ve vašich projevech opakovaně objevovalo. Vlastně si myslím, že jste se o něm zmínil ve více než polovině svých promluv ve Francii. Mám na mysli zejména projev v Elysejském paláci a včerejší v Lurdech, kdy jste řekl, že to, co je legální, nemusí být nutně morální, což byla jasná narážka na nedávnou legalizaci eutanázie ve Francii. Ve Francii také máme princip ?laicité“, tedy oddělení náboženství od politiky. Myslíte si, že když jde o důležité věci, když je v sázce mnoho, měla by být tato hranice překročena ve jménu prvenství svědomí? A pokud ano, překročil jste ji? Děkuji za vaši otázku. Řekl bych, že pokud jde o to, jak chápat oddělení církve od politiky, respektive církve od státu, jak jej vnímá církev, tuto hranici jsem nepřekročil. A rád bych vás vyzval, abyste si přečetli nebo znovu přečetli encykliku Magnifica Humanitas, kde v první části, v prvních několika kapitolách, hovořím o sociální nauce církve a říkám,reknou:  ?Náboženství by mělo být výhradně v soukromé sféře.“ Ať si lidé dělají, co chtějí, ale jako stát musíme být odděleni. Právě proto jsem přijel do Francie především kázat evangelium, hlásat Radostnou zprávu, znovu potvrdit to, co potvrzuje sám Ježíš Kristus, když říká: ?Já jsem cesta, pravda a život“, tedy hlásat pravdu, kterou nám Ježíš nabízí. Ochrana života je něco, co, jak všichni víte, církev učí a v co velmi hluboce věří. A tak na jedné straně samozřejmě vím, že ve Francii byl nedávno schválen určitý zákon, a také v jiných zemích Evropy i v jiných částech světa probíhá mnoho debat o otázkách souvisejících s koncem života. Ale zejména na místě, jako jsou Lurdy, kde lidé hledají něco mnohem hlubšího a chápou, že jejich život, i uprostřed nemoci, postižení nebo různých druhů bolesti, má smysl, církev, díky Ježíši samému, chce být těmto lidem nablízku a potvrzovat horeložila JB, upravil MHhttps://www.vaticannews.va/cs/papez/news/2026-10/podcast-slova-papezu-kdo-je-muj-blizni.html'
