  title: Folklorní okénko
  subtitle: Guberniální sběratelská akce z roku 1819 ? 200 let - Čechy (1. díl)
  description: 'Autor a interpret: Zdeněk Vejvoda; Premiéra: 13.11.2019 * Úřední pokyn k zapisování ?jednohlasých světských lidových písní s co možná nejúplnějšími texty a s udáním kraje, ve kterém se zpívají,“ vzešel roku 1819 přímo od rakousko-uherské vlády, konkrétně od ministra vnitra Františka hraběte Sauraua z podnětu vídeňské Společnosti přátel hudby. Zapisovány měly být i staré lidové tance a kostelní písně. Vznikla tak reprezentativní kolekce, která sice nebyla nikdy souborně vydána, dochované prameny však v zemích tzv. Předlitavska nezřídka tvoří nejstarší notovaný písňový repertoár širokých lidových vrstev. Tak je tomu i v Čechách a na Moravě. Motivaci a osudům tzv. guberniální sbírky z roku 1819 se v souvislosti s jejím dvoustým výročím věnuje Folklorní okénko na vlnách Proglasu. První díl patří českým krajům. Připravil a uvádí Zdeněk Vejvoda.'
  genre:
  - '99'
