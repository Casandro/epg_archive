  title: Neues aus dem Münchner Tierpark Hellabrunn (7)
  subtitle: Action im Urwaldhaus
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Das ist vielleicht eine Woche im Münchner Tierpark Hellabrunn! Überall totales Remmidemmi: Die Affenwelt wird komplett renoviert. Und das bedeutet, dass die Gorillas umziehen müssen. Da gibt es nur eine Lösung: Die Gorillas ziehen vorübergehend ins Nachbargehege der Schimpansen. Die Begrüßung durch die neuen Nachbarn ist bedrohlich: Clan-Chef Willi und sein Co-Chef Woida sind in Rage und lassen an der Glasscheibe Muskeln spielen. Revierleiter Markus Klostermeier hat ein Auge drauf und erklärt, was es mit dem Kran im Gorilla-Gehege auf sich hat.'
