  title: Durch die Wildnis - Das Abenteuer Deines Lebens
  subtitle: Nordgriechenland
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Am zweiten Tag in der Wildnis ohne Handys und Kontakt zur Außenwelt wollen die sechs wenigstens ein bisschen Körperpflege machen. Doch mit eiskaltem Wasser aus einem Gebirgsfluss kostet das Haarewaschen ganz schön Überwindung. Wildniscoach Tobi fordert die Jugendlichen mit einer außergewöhnlichen Aktion heraus: Ein 40 Meter hoher Baumriese muss erklettert werden. Da darf keiner Höhenangst haben.'
- eventId:
  - 1314192
  - 586366
  start: 2026-10-21T06:15:00Z
  stop: 2026-10-21T06:40:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens
  subtitle: Nordgriechenland
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Mädchen sind gespannt: Gestern Nacht haben Die Jungs noch Klos gebaut. Ob Die wohl funktionieren? Die Jungs demonstrieren ihre Wildnistoilettenanlage jedenfalls mit viel Humor. Auf dem Weg zum nächsten Camp entdecken Die sechs ein gruseliges Tierskelett. Ganz geheuer ist es ihnen nicht. War das womöglich ein Bär? Zum Glück kommen sie bei ihrer nächsten Herausforderung auf andere Gedanken. Ein wilder Fluss muss mit Kajaks bezwungen werden.'
