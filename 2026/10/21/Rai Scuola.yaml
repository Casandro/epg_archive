  title: Amarcord - Ritratti di città Modena
  subtitle: ATTUALITA' - Il documentario su Modena si apre tra i tetti storici con le gare dei triganieri, allevatori di colombi, per passare all'eccellenza meccanica di Ferrari e della storica rivale Maserati, fino alle f
  description: "onderie operaie. Seguono i prodotti tipici della gastronomia  aceto balsamico, ciliegie di Vignola, tortellini, zamponi e Lambrusco  accostati alla modernità economica, al consumo delle figurine Panini e alle intuizioni pionieristiche dell'azienda agricola di Franco Grandi. Il racconto valorizza quindi il patrimonio culturale, dalla Bibbia di Borso d'Este, miniata da Taddeo Crivelli, all'editoria Zanichelli, dalla liuteria al teatro, per culminare nel fermento imprenditoriale delle piastrelle di Sassuolo e della maglieria carpigiana, trasformatasi dal lavoro a domicilio in industria internazionale. - Programma di: Enrico Gras e Mario Craveri\nFotografia: Franco Castelli\nContenuto musicale: Franco Potenza \nVoce: Rolf Tasna\nConsulenza: Luca Pinna\n,"
