  description: 'esiderata e unica nel mondo. Moda, costume, design, arte, cultura, enogastronomia, ospitalità e grandi eccellenze del Made in Italy diventano le chiavi per entrare nel cuore di un Paese capace, da sempre, di trasformare il talento in stile e la tradizione in innovazione. - Conduttore: Greta Mauro,'
