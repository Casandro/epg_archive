  title: Dobré dopoledne s Českým rozhlasem Brno
  description: Hodinka pro pohodové dopoledne. Babské rady, Česká NEJ a písničky, které si rádi zazpíváte. Moderuje Sandra Silná.
- eventId: 931612
  start: 2026-10-21T09:00:00Z
