- eventId: 931613
  start: 2026-10-21T09:04:00Z
  stop: 2026-10-21T10:00:00Z
  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Poradna pro zdraví: farmaceutka Alice Sychrová o úskalích přírodních léčivých prostředků. Víte, že to, co je přírodní, nemusí být vždy automaticky bezpečné? Jak mohou některé byliny a přírodní léčivé prostředky ovlivňovat účinnost léků na různé zdravotní potíže? Na co si dát pozor u zázvoru, echinacei anebo ženšenu? A jak na podzim, v čase respiračních chorob, správně kombinovat předepsané medikamenty s čaji a bylinnými tinkturami? Moderuje Sandra Silná.'
