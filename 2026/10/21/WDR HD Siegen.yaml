  subtitle: Heimlichkeiten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Das Zusammenleben der Patchworkfamilie ist nicht so einfach. Lars und Hilde stellen neue Regeln auf und Jenny hat Angst, dass Hilde und Kim wieder ausziehen wollen. Aber Kim hat andere Pläne: Sie möchte an eine Musik-Schule wechseln und hat heimlich einen Termin bei der Direktorin ausgemacht. Aber um sich zu qualifizieren, muss Kim in zwei Wochen zu einem Klaviervorspiel kommen. Das stellt sie vor ein Problem.'
