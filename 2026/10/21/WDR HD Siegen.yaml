  title: Glow (4)
  subtitle: Das Kellerzimmer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Jenny will aus dem chaotischen Keller ein gemütliches Zimmer für alle machen und fängt mit ihrer Freundin Naomi an, das Gerümpel nach draußen zu räumen. Zu ihrer Enttäuschung haben August, Yasin und Kim kein Interesse an ihrem Plan, nur Hilde unterstützt sie. Als dann auch Kim einen Schritt auf die Mädchen zumachen möchte, kriegt sie mit, wie schlecht Jenny vor den anderen über sie spricht. Die Situation eskaliert...
