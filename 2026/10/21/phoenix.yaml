  title: Spies of War - Geheime Helden
  subtitle: Nukleare Bedrohung
  widescreen: true
  hd: true
  description: Am 29.8.1949, vier Jahre nachdem die USA die erste Atombombe abgeworfen hatten, zündeten auch die Sowjets eine Nuklearwaffe. Niemand hatte so früh damit gerechnet. Hinter den Kulissen dieses bahnbrechenden Ereignisses des Kalten Krieges hatten die Sowjets das größte Spionagenetzwerk des Jahrhunderts aufgebaut. Diese Episode zeigt, wie und warum brillante Wissenschaftler die Geheimnisse der Atombombe an den Erzfeind der USA weitergaben und wie die Spionageabwehrdienste die Codes knackten, um die Lecks aufzudecken.
