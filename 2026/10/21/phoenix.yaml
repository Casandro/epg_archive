  hd: true
  description: Im Oktober 1962 hielt die Welt aus Angst vor einem Atomkrieg den Atem an. Hinter den Kulissen half einer der größten Spione des Jahrhunderts dem US-Präsidenten John F. Kennedy dabei, sich während der Kubakrise gegen Chruschtschow zu behaupten. Diese Episode enthüllt die bemerkenswerten Leistungen von Oleg Penkovsky, einem sowjetischen Offizier, der für die CIA arbeitete. Er hinterging die UdSSR, um für den Westen zu spionieren, und verhinderte einen dritten Weltkrieg.
