  title: Spies of War - Geheime Helden (1/4)
  subtitle: Die Agenten des D-Day
  widescreen: true
  hd: true
  description: Am 6. Juni 1944 stürmten fast 130.000 alliierte Soldaten die Strände der Normandie, um die Befreiung Frankreichs von den Nazis einzuleiten. Hinter den Kulissen dieses wichtigen Ereignisses leisteten britische Doppelagenten des MI-5 ihren Beitrag zu der größten Täuschungsaktion des Krieges. Ihre Mission bestand darin, die Deutschen davon zu überzeugen, dass die Alliierten an anderer Stelle landen würden. Diese Episode lässt die tollkühne Mission, die entscheidend zum Erfolg des D-Day beitrug, noch einmal aufleben.
