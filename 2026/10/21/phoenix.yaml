  hd: true
  description: 'Er gehört zu den bedeutendsten Pilgerwegen der Welt. Und die ganze Welt ist auf ihm unterwegs: der Jakobsweg. Doch viele Anwohner ärgern sich über grölende Gruppen, stinkende Funktionskleidung, die in der Altstadt zum Trocknen ausgebreitet wird oder Badende im Barockbrunnen. WDR-Reporter Ulf Eberle hat sehr unterschiedliche Pilger kennengelernt: Marcello, der mit seiner Katze unterwegs ist. Babette, die die Asche ihres verstorbenen Mannes mit sich trägt. Veronica und ihre Freundinnen, für die Spaß wichtiger ist als Spiritualität.'
