  title: Spies of War - Geheime Helden
  subtitle: Der falsche Soldat
  widescreen: true
  hd: true
  description: '10. Juli 1943: Die alliierten Truppen landen auf Sizilien und erzielen einen neuen Schlag gegen Hitler. Zwei Monate zuvor war der Leichnam eines britischen Offiziers an einem spanischen Strand gefunden worden, der vertrauliche Dokumente bei sich trug, in denen von einer militärischen Landung auf dem Balkan die Rede war. Der britische Geheimdienst lancierte die Aktion. Die Deutschen stürzten sich auf die wertvollen Informationen und zogen daraufhin Truppen von Sizilien ab.'
