  title: 'Giuseppe Verdi: Stiffelio'
  description: 'Opera o 3 dějstvích. Libreto Francesco Maria Piave.; Zpívají: Luciano Ganci (Stiffelio), Joyce El-Khoury (Lina), Franco Vassallo (Stankar), Štěpánka Pučálková (Dorotea), Alessio Cacciamani (Jorg), Luigi Morassi (Raffaele), James Kryshak (Federico). Spoluúčinkuje Sbor Arnolda Schoenberga, sbormistr Erwin Ortner. Hraje Symfonický orchestr Rakouského rozhlasu (ORF), řídí Jérémie Rhorer. Záznam představení v Divadle na Vídeňce 13.května 2026. Připravila a uvádí Dagmar Henžlíková.'
