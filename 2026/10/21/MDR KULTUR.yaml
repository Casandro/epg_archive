- eventId: 1322629
  start: 2026-10-21T07:00:00Z
  stop: 2026-10-21T07:35:00Z
  title: Selig & Boggs - Die Erfindung von Hollywood (Folge 3 von 7)
  subtitle: Von Christine Wunnicke
  description: "Dass sich die sogenannte Traumfabrik von Hollywood in Kalifornien befindet, weil dort immer die Sonne scheint, mag man für einen Witz halten. Es ist aber die reine Wahrheit, und Christine Wunnicke hat ein wundervolles Stück Literatur darüber geschrieben, wie es dazu kam. Es handelt von Mr. Selig, dem Filmunternehmer, der vom ewig schönen Wetter im langweiligen Kalifornien nichts hält und lieber im brausenden Chicago sein Glück machen will. Und von Mr. Boggs, seinem Spielleiter, der jedes Mal, wenn sich eine Wolke vor die Sonne schiebt, den Betrieb einstellen muss und deshalb nichts sehnlicher wünscht, als in den sonnigen Westen zu ziehen. Dass es am Ende doch noch geklappt hat, ist bekannt, aber wie es dazu kam, wurde noch nie so schön erzählt wie hier.\n\nChristine Wunnicke, geboren 1966, lebt in München. Sie schreibt Hörspiele, biografische Literatur und Romane. 2002 erhielt sie für ihre Biografie des Kastratensängers Filippo Balatri, \"Die Nachtigall des Zaren\", den Bayerischen Staatsförderungspreis für Literatur. Für den Roman \"Serenity\" bekam sie 2008 den Tukan-Preis. Zuletzt erschienen u. a. ihre Romane \"Der Fuchs und Dr. Shimamura\" (2015) und \"Katie\" (2017), die beide für den Deutschen Buchpreis nominiert waren.  2020 wurde sie mit dem Münchner Literaturpreis für ihr Gesamtwerk ausgezeichnet. Ihr neuer Roman \"Die Dame mit der bemalten Hand\" wurde mit dem Wilhelm Raabe-Literaturpreis gewürdigt und stand auf der Shortlist für den Deutschen Buchpreis. Im Oktober 2026 wird Christine Wunnicke mit dem Georg-Büchner-Preis für ihr Gesamtwerk ausgezeichnet.\n\nRegie: Steffen Moratz\nProduktion: MDR 2021\n\nMitwirkende: \nJens Wawrczeck - Sprecher\nLeslie Malton - Sprecherin"
