  title: MDR KULTUR am Mittag
  description: |-
    * 12:00 Uhr - Nachrichten

    * 12:15 Uhr - Norma Winstone - Die Anti-Diva
    Sie ist einer der Gründe, weshalb klar ist: Der europäische Jazz hinkt nicht dem US-amerikansichen Jazz hinterher. Nein, er macht sein eigenes Ding - und zwar schon seit den 60er Jahren. Norma Winstone, die sympatische Engländerin hat den Jazzgesang ohne Text erfunden. Damit hat sie sich auch vom US-amerikanischen Scatgesang abgehoben, der ja nur mit Silben funktioniert. Wie sie darauf kam? Aus Ehrfurcht vor der Musik ist sie über den menschlichen Gesang hinausgewachsen und mit ihr die Musik. Julia Hemmerling mit einem Portrait.

    * 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr

    * 12:45 Uhr - Thilo Krause zu "Jetzt, wo du ein Held bist"
    "Jetzt, wo du ein Held bist" heißt der neue Roman von Thilo Krause, den Oscar Hoppe Ihnen noch bis letzte Woche in der Lesezeit vorgelesen hat und deren 15 Folgen jederzeit bei ARD Sounds abrufbar sind. Eine bewegende Geschichte über den Jungen Toni, der Ende der 1980er Jahre in Dresden aufwächst, seine Umwelt genau beobachtet und durch die Freundschaft zu Maik  neues Selbstbewusstsein entwickelt, während das Land, in dem er lebt, langsam untergeht. Thilo Krause ist heute Abend zu Gast im Literaturhaus Leipzig, uns hat er zuvor folgendes über seinen Roman gesagt.

    * 13:00 Uhr - Nachrichten

    * 13:15 Uhr - Pet Shop Boys: "Man From The Future"
    Das britische Elektropop-Duo Pet Shop Boys ist vor allem für seine filigranen Dancefloor-Nummern bekannt. Jetzt kommen sie mit etwas, das man eine Elektro-Suite nennen könnte: der Vertonung eines Lebens, nämlich der Biografie des britischen Logikers, Kryptoanalytikers und Computerpioniers Alan Turing, einem bis heute zu wenig bekannten Mathematikgenie, ohne den die Geschichte des 20. Jahrhunderts womöglich einen ganz anderen Verlauf genommen hätte. Herausgekommen ist dabei ein eigenwilliges und höchst elegantes Hybrid aus Clubsound und der tragischen Geschichte eines Mannes, der von intelligenten Maschinen träumte.
    Von Sky Nonhoff

    * 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr

    * 13:45 Uhr - Biermann Verlosung
