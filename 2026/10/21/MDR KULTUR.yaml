  title: 'MDR KULTUR Spezial: Unter Büchern unterwegs... mit Cécil Ludwig Röski und Res Sigusch'
  description: "Unter Büchern ist unterwegs: zwischen schönen Büchern, Selfpublishing und einer Hexengeschichte.\n\n* 60 Jahre Stiftung Buchkunst. Wie sieht eigentlich ein schönes Buch aus, wie fasst es sich an, was ist das Besondere in Herstellung und Gestaltung? Seit sechs Jahrzehnten stellt die Stiftung Buchkunst diese Fragen - in einer Jubiläumsausstellung sind gerade die Preisträgerinnen der letzten Jahrzehnte zu erleben. Unter Büchern hat Birte Kreft getroffen, die Geschäftsführerin der Stiftung, um mit ihr über schöne du schön gemachte Bücher zu sprechen.\n\n* Nicole Czerwinka: Das Geheimnis am Fjord. Wie geht das eigentlich, ein Buch im Selbstverlag zu veröffentlichen? Uta Burkhardt hat die Dresdner Autorin getroffen und mit ihr über das Selfpublishing ihres ersten Romans gesprochen.\n\n* Bücher in Boxen: Der Lampe Verlag. In Zeiten, in denen weniger gelesen wird, einen Verlag gründen? Ist weniger wahnsinnig als man erstmal annehmen möchte. Die Verlegerin Christiane Lahusen spricht bei Unter Büchern über das Konzept der Büchlein in Boxen, über das Vertrauen in die Kurzgeschichte und über das aktuelle Programm. \n\n* Juliane Schiemenz: Meine Ahnin, die Hexe, und ich. In diesem Buch geht es um eine Hexe, respektive eine Frau, die als solche im 17. Jahrhundert verbrannt wurde. Harte Zeiten für Frauen, die damals aus der Norm fielen. Aber wie ist das heute. Für solch unangepasste Frauen. Und wer überhaupt legt fest, was die Normen sind. Damit beschäftigt sich Juliane Schiemenz in ihrem Buch, wenn man so will, aus echter persönlicher Betroffenheit. Wolfgang Schilling stellt es vor."
  subtitle: Eine Sendung von Katrin Schumacher
