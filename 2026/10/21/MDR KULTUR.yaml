  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Schockens Gärten\nRund zwei Drittel der 500.000 Juden, die 1933 in Deutschland lebten, emigrierten bis zum Verbot der Auswanderung im Oktober 1941. Unter ihnen auch Salman Schocken. Mitinhaber der Schocken-Kaufhäuser, Handschriftensammler und Kafka-Verleger. Schocken geht 1934 nach Jerusalem, wo ihm der berühmte Architekt Erich Mendelssohn eine Villa in einen 5000 Quadratmeter großen  Garten baut. \"Schockens Gärten\" ist nun eine kleine, aber äußerst aufschlussreiche Ausstellung gewidmet, die das Leipziger Simon Dubnow Institut zeigt. Hartmut Schade hat sie sich angesehen.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1901 Margarete Buber-Neumann geboren\nSie wurde als Opfer der stalinistischen Säuberungsaktionen in der UdSSR in einem sowjetischen Straflager interniert, ab 1940 sperrten sie die Nazis in das Konzentrationslager Ravensbrück. Eine leidvolle, jahrelange Erfahrung, die die ehemalige Kommunistin bewog, nach dem Zweiten Weltkrieg vehement gegen jede Form von Diktatur einzutreten. Die Publizistin Margarete Buber-Neumann wurde heute vor 125 Jahren geboren. Der Stichtag. Von Thomas Hartmann.\n\n* 06:50 Uhr - Vorschau Folk und Welt: Clare Sands\n\"They Tried To Bury Us\" ist eine Sammlung eigener Lieder, die den Stimmlosen eine Stimme verleiht: dem vom Aussterben bedrohten Großen Brachvogel, den verlorenen Wörtern unserer Muttersprache, den an unseren Küsten Zuflucht Suchenden sowie den palästinensischen Dichtern, deren Worte von Widerstand zeugen. Alle Lieder sind tief mit Nordirland verwurzelt; das Album entstand mit einer beeindruckenden Riege dort ansässiger Musiker. Das sagt Clare Sands über ihre neue CD. Grit Friedrich stellt die Musikerin und ihre neuen Songs heute ausführlich bei Folk und Welt ab 21 Uhr vor. In \"Lí Ban\" besingt Clare Sands eine keltische Göttin und einen See in Nordirland der völlig mit Algen zugewachsen ist, was dem englischen Besitzer allerdings völlig egal ist.\nVon Grit Friedrich\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Vor 10 Jahren starb Manfred Krug\nHeute jährt sich der Todestag von Manfred Krug zum 10 Mal. Er verstarb 2016 im Alter von 79 Jahren. Der Schauspieler und Sänger zählte zu den wichtigsten deutschen Unterhaltungskünstlern. Über seine beeindruckende Karriere und seine bis heute anhaltende Beliebtheit spreche ich jetzt mit Andreas Kötzing. Er ist Historiker und forscht am Hannah-Arendt-Institut u.a. zur DDR-Erinnerungskultur.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\nVon Wolfgang Schilling\n\n* 07:50 Uhr - Kulturtipp: Rainer Haseloff in Halle\nHeute abend in Halle - ein Gepräch zum politischen Zustand des Landes Sachsen-Anhalt\n\n* 08:0 Uhr - Nachrichten\n\n* 08:10 Uhr - Sachbuch der Woche: \"Wie ich gesund essen ohne komplett verrückt zu werden\" von Elisabeth Raether\nUnser Sachbuch der Woche dreht sich heute um _s Essen... komplexes Feld wie wir wissen: es ist privat, aber auch politisch. Hält uns am Leben und entscheidet mehr als uns bewusst ist, ob wir gesund bleiben oder nicht - auch wie wir uns fühlen. Gute Voraussetzungen, um gleichzeitig über- und unterschätzt zu werden. (Für Frauen oft nochmal ein anderes Thema, sehen sie sich doch Schönheitsvorstellungen anders unterworfen als Männer.) \nDa kommt Elisabeth Raether gerade recht."
