  title: Tiere vor der Kamera - Highway durch die Rocky Mountains - Herbst
  subtitle: Tiere vor der Kamera - Highway durch die Rocky Mountains - Herbst
  description: Arendt und Schweiger führen durch Nordamerika, wo Stau von Hirschen verursacht wird und Bergschafe Trucks stoppen. Sie zeigen kuriose Tierverhalten wie Hirsche auf Zebrastreifen und die tumultartige Hirschbrunft in Touristenorten. Neben herrlichen Landschaften werden Bären beim Winterspeckessen und Murmeltiere beim Matratzensammeln gezeigt. Die Reise bietet amüsante Einblicke in das Tierverhalten auf Straßen.
