  title: Tiere vor der Kamera - Die Sage vom Vogel in der Hand
  subtitle: Tiere vor der Kamera - Die Sage vom Vogel in der Hand
  description: Ernst Arendt und Hans Schweiger erleben die "Saga vom Vogel in der Hand" in Lappland. Sie überwintern in den Bergen am Eismeer, erleben Dunkelheit, Schnee und Stürme. Mit der Schneeschmelze kehrt der Mornellregenpfeifer zurück. Die erste Begegnung ist flüchtig, doch nach zwei Wochen vertraut er den Filmemachern und brütet in Arendts Händen. Es ist ein bewegender Moment der Versöhnung von Mensch und Natur.
  genre:
