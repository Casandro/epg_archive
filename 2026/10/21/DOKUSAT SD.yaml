  title: 'Hitlers Geldgeber: Bestrafung und Entschädigung'
  subtitle: 'Hitlers Geldgeber: Bestrafung und Entschädigung'
  description: Mit dem Ende des Zweiten Weltkriegs in Europa begann die Verfolgung der Naziverbrecher. Neben dem Wunsch nach Gerechtigkeit stand auch der nach Restitution von Gütern und Wertgegenständen, die während Hitlers 12-jähriger Terrorherrschaft gestohlen wurden, im Vordergrund. Vieles bleibt weiterhin verschwunden und führt zu Verschwörungstheorien und Schatzsuchen. Wurden jene, die Hitler finanziell unterstützten, bei den Nürnberger Prozessen und anderen Entnazifizierungsmaßnahmen angemessen bestraft?
