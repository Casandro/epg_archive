  title: 'Hitlers Geldgeber: Hitler und die industrielle Elite'
  description: Deutschland, 1937. Mit der rücksichtlosen Durchsetzung seiner Wirtschaftspolitik scheint Hitler sein Versprechen einzulösen, Deutschland innerhalb von vier Jahren zurück zu Wohlstand und Wachstum zu führen. Der Wiederaufstieg hatte jedoch düstere Seiten, und während Deutschland sich in seinem zurückgewonnenen Glanz sonnte, verkauften Hitler und seine Schergen Deutschlands Seele. Diese Folge enthüllt, wie die Nazis mit der finanziellen Unterstützung der industriellen Eliten die Macht übernahmen.
