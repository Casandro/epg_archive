  title: Hitlers Tod - Der Selbstmord
  description: Seit 5 Uhr morgens unter sowjetischem Granatenbeschuss liegt die Reichskanzlei. Die Rote Armee rückt auf 100 Meter heran. Um halb vier nachmittags begeht Hitler Selbstmord, seine Frau nimmt Zyankalikapseln. Dokumente aus dem Nationalarchiv in Washington und Vernehmungen von Hitlers Adjutanten Otto Günsche und Kammerdiener Heinz Linge bieten Einblicke. Zeitzeuge Rochus Misch, Mitglied des "Führerbegleitkommandos", berichtet.
