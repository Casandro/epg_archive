  subtitle: Výzkum, vynálezy a objevy, které mění lidský život. Moderuje Ondřej Látal.
  description: Czech Space Week je největší festival kosmických aktivit v Česku. Co si pod takovým festivalem představit? - Když člověk krajinu desítky let přetváří, musí ji potom znovu naplánovat, aby ji napravil? - Tomáš Baťa vyvážel ze Zlína do světa nejen boty, ale i svou představu o ideálním městě. Jak se v různých koutech světa zabydlela? - Kvůli nebezpečným horkům a vysychání přírody zažalovaly švýcarský stát a jako první dosáhly verdiktu, podle kterého je ochrana klimatu lidské právo. Teď švýcarské klima babičky - jak si samy přezdívají - přijely do Prahy, aby dle svých slov k něčemu podobnému inspirovaly i Čechy. Moderuje Ondřej Látal.
