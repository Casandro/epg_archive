  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (2/15) Část druhá: Předehra, léta 1945 - 1948. Po válce se do Maďarska z Moskvy vrátil Mátyás Rákosi, "Moskal", jehož Stalin vybral jako svého místokrále. V roce 1945 se konaly první a poslední svobodné volby. Komunisté sice nezískali převahu, věřili však, že čas je na jejich straně a měli pravdu. Po třech letech byla jejich moc absolutní, Rákosi se projevil jako nejlepší Stalinův žák a Maďarsko začalo žít podle sovětského vzoru. Nejbrutálnější sovětskou kopií bylo ÁVO, maďarská obdoba sovětské KGB. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
