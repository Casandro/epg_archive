  title: Ex libris
  description: Helena Sováková je armádní psycholožka, která působila také v zahraničních misích. Nejen za nimi se ohlíží v knižním rozhovoru i v Ex libris. Připravil Milan Mundier.
- eventId: 931063
  start: 2026-10-21T01:33:00Z
  stop: 2026-10-21T02:00:00Z
  title: Pro a proti
  description: Kdo povede Prahu? Lídr hnutí STAN v Praze Petr Hlaváček pokračuje v povolebních jednáních o nové koalici. Bude spojenectví STAN a Spolu pro metropoli spásou nebo sňatkem z rozumu? Nebo bude rozumnější přibrat třetí subjekt? Najde trojkoalice programovou shodu, nebo hrozí střety kvůli bydlení a dopravě? Zeptáme se lídryně pražských Pirátů Terezy Nislerové a lídra Spolu Tomáše Portlíka. Moderuje Lukáš Matoška.
