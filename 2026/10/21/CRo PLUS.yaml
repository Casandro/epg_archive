  description: Vladimír Votápek, odborník na mezinárodní vztahy, bezpečnostní analytik, bývalý generální konzul v Petrohradě. "Je to jeden článek dlouhého řetězce ruských útoků, kterým se Rusko snaží mapovat naše slabosti, nebo je přímo využívat," komentoval před časem nález dronu s výbušninou na lipském letišti. Jak se na ruské testování chystá Česko? Máme se jako veřejnost dozvědět, před čím naše orgány varovala CIA, nebo je namístě mlčení, které provázelo úterní jednání Bezpečnostní rady státu? A kde leží hranice mezi provokací a útokem, který by vyžadoval vojenskou odpověď NATO? Ptá se Barbora Tachecí.
