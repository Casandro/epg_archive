  description: David Maxa patří mezi nejvýraznější tváře židovské komunity a má zásluhy o rozvoj progresivního judaismu v Česku. Klade důraz na rovnost pohlaví, zapojení rodin s dětmi a přizpůsobení tradic modernímu světu. Rabín Maxa má dar sdělnosti a využívá jej k tomu, aby přiblížil židovskou víru lidem, pro které by byl ortodoxní směr příliš složitý. Co jej inspirovalo k tomu, aby se po studiích vydal na rabínskou cestu? Jaké role ve svém životě si obzvláště cení? Čím je pro něj diskusní salon ve Winternitzově vile v Praze a jakým tématům se jeho aktéři věnují? Tyto a další otázky v Hovorech. Moderuje Eva Hůlková.
