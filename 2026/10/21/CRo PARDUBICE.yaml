  title: Máme hosty
  description: Skoro každý na něj má názor. Pro někoho provokatér, pro jiného zásadový člověk. Filip Sedlák se stal seriózním politickým hráčem. Bez jeho hlasů se neobejde plánovaná duhová koalice na magistrátu. Zmírní teď legendární opozičník svou ostrou rétoriku? Překvapil ho volební výsledek? A mělo cenu kandidovat ve více městských obvodech? Moderuje Jakub Malý.
