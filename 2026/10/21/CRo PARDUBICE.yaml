  title: Radioporadna
  description: Jaké období je ideální pro rekonstrukci domu nebo bytu? Odpověď není jednoznačná. My se s odborníkem Karlem Sedláčkem zaměříme na práce, které se provádějí nejlépe v podzimním a zimním období. Ve kterých případech není potřeba čekat s rekonstrukcí na jaro? Poslechněte si středeční Radioporadnu. Moderuje Jitka Slezáková.
