  description: |-
    Das Ende des Sommers

    An einem heißen Sommertag entdeckt der kleine braune Hase einen Baum, der voll mit köstlichen Früchten hängt. Der große Hase sagt ihm, dass dies ein Pflaumenbaum ist und dass sie nun den ganzen Sommer über die köstlichen Pflaumen genießen können. Der kleine braune Hase möchte den Pflaumenbaum unbedingt seinen Freunden zeigen, damit sie auch von den Früchten essen können. Doch seine Freunde haben den Baum längst selbst entdeckt, genau wie zahlreiche andere Wiesenbewohner. So genießen alle Wiesenbewohner Tag für Tag die köstlichen Früchte. Eines Morgens wird der kleine braune Hase von einer sehr aufgeregten kleinen Feldmaus geweckt. Sie berichtet ihm, dass alle Pflaumen vom Baum verschwunden sind. ...
