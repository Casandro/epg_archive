    Geheimnisvolle Fußabdrücke

    Beim Spielen im Schnee entdecken Pip und Posy plötzlich, dass sie mit einem Pingpongschläger tolle Fußabdrücke im Schnee machen können. Jamila entdeckt die Abdrücke und findet sie toll.

    Jamila fragt sich, wer die Abdrücke wohl gemacht haben könnte. Da behauptet Posy, die kämen von einem sogenannten mysteriösen Wesen und die drei Freunde machen sich auf die Suche nach ihm. Jamila glaubt, dass es dieses Wesen wirklich geben muss.

    Sie merkt nicht, dass Pip und Posy sie nur veräppeln. Als sie ihr schließlich gestehen, dass das Wesen reine Erfindung war, ist Jamila wirklich sauer und enttäuscht. Pip und Posy tut das furchtbar leid - und sie verkleiden sich als mysteriöses Wesen, um Jamila wieder aufzuheitern.
