    Kisten packen und umziehen

    Die Welt ist elefantastisch, Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen, extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um den Umzug. Die beiden Geschwister Emma und Pepe ziehen bald um und sollen deshalb ihre Sachen in große Kartons packen. Mit den Kartons kann man aber auch gut spielen! Charlie ist verabredet und seine Schwester Lola hat niemanden zum Spielen. Schließlich hat Lola aber doch noch eine Idee, wie sie auch alleine Spaß haben kann. Die bekannte Kinderbuchillustratorin Sybille Hein malt ein Bild mit Mäusen. Was die wohl vorhaben? Und Knolle sucht überall nach seinem Lieblingsknochen. Wo der wohl stecken könnte?
