  subtitle: Der Kein-Schnee-Tag
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Kein-Schnee-Tag

    Am Abend hat es plötzlich angefangen, zu schneien, und Posy will ganz schnell einschlafen, weil sie es kaum erwarten kann, am nächsten Morgen mit Pip im Schnee zu spielen.

    Aber - oh Schreck! Am Morgen ist der ganze Schnee wieder weg. Posy ist total enttäuscht und hat keine Lust, irgendetwas anderes zu spielen. Da fängt Pip einfach an, so zu tun, als ob Schnee liegen würde: Er baut einen Schneemann aus Bällen.

    Außerdem bewirft er Posy mit "unsichtbaren" Schneebällen. Posy findet das ziemlich lustig und hat auf einmal eine ganz tolle Idee: Sie "zaubert" Schneeflocken aus Seifenschaum, die sie mit einem Föhn aus dem Fenster herauspustet. Der Schneetag ohne echten Schnee ist gerettet.
    Regie: Seán McCormack
    Buch/Autor: Matt Baker
    Musik: Ellie Wyatt, Joss Peach
