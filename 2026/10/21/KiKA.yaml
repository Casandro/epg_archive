  title: Felix macht Ferien
  subtitle: Scherbenhaufen
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Serie, Deutschland 2017
    Scherbenhaufen

    Schön, aber zerbrechlich sind die Porzellanfiguren auf der Anrichte im Wohnzimmer. Opa Karl erklärt seinem Enkel, wie alt und wertvoll Omas Lieblingsstücke sind. Sichtlich begeistert, versinkt Felix alsbald in die Betrachtung. Aus Versehen passiert es, ein weißer Hirsch fällt herunter. Dabei bricht ein Stück des Geweihs ab. Felix ist erschrocken und versucht, das Missgeschick zu verheimlichen. Doch schließlich fasst er sich ein Herz und beichtet Opa was passiert ist. Mit Sekundenkleber klebt der das kleine Stück wieder an und zeigt Felix zwei Vögelchen, die früher schon repariert wurden. Aber das soll auch ihr Geheimnis bleiben.
    Regie: Markus F. Adrian
    Buch/Autor: Paul Markurt
    Kamera: Urs Zimmermann, Gunnar Sell
    Musik: Nicolas Nohn
