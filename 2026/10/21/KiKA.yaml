    Ein Helm für Bert

    Bert liest gerade ein Buch, als Ernie dazu platzt und ihn auffordert, schnell einen Helm aufzusetzen. Zunächst will Bert nicht, aber Ernie besteht darauf - zum Glück hört Bert auf Ernie. Ein Eichhörnchen hat ein Problem: Das Regal für seine Riesen-Haselnüsse hängt schief. Super Grobi 2.0 muss helfen!

    Bei den "Cleveren Keksen" haben es Krümel und seine Kekse dieses mal mit einem vom Kekser gebackenen "Gingerbread Man" zu tun.

    Bei den "Unheimlich heimeligen Begegnungen" treffen die Musiker auf Wesen, die total entspannt in Liegestühlen sitzen. Irgendwann fangen "die Langsamen" dann an, sich zu bewegen und den Musikern dämmert: In der Ruhe liegt auch Kraft!
