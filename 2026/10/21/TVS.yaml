  title: 'Rosamunde Pilcher: Bicie serca 1 (odc. 160)'
  subtitle: Dla Jacky Davies produkcja ginu w tradycyjnej, rodzinnej destylarni jest zarówno pasją, jak i obsesją. Ojciec Jacky martwi się o nią, ponieważ dziewczyna poświęca całe swoje życie gorzelni.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Herzensläufe
    DE, 2021
    Reżyseria: Marc Prill
    Występują: Hedi Honert, Liliane Zillner, Jochen Nickel, Max Themak, Orestes Fiedler, Benjamin Weygand
    Dla Jacky Davies produkcja ginu w tradycyjnej, rodzinnej destylarni jest czymś więcej niż tylko rzemiosłem. Jest pasją i obsesją. Matka Jacky przed wielu laty straciła życie w pożarze. Jej córka czuje się zobowiązana prowadzić dalej spuściznę po matce. O Jacky martwi się jej ojciec, ponieważ dziewczyna całe swoje życie poświęca gorzelni. Niespodziewanie przyjeżdża starsza siostra Jacky, Alice. W rekordowo krótkim czasie między siostrami dochodzi do ostrej kłótni.
  ageRating: 12
  genre:
  - '22'
- eventId: 797560
  start: 2026-10-21T19:50:00Z
  stop: 2026-10-21T21:35:00Z
  title: 'Rosamunde Pilcher: Jeszcze mężatka'
  subtitle: Ukochany Sienny w końcu jej się oświadcza. Kobieta postanawia pojechać do Kornwalii, by załatwić rozwód.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Fast noch verheiratet
    DE, 2017
    Reżyseria: Marco Serafini
    Występują: Paula Schramm, Raphael Vogt, Jochen Schropp, Angela Roy, Robert Giggenbach, Krystian Martinek
    Adwokatka Sienna nie posiada się ze szczęścia. Jej ukochany w końcu się jej oświadczył. Niestety zamążpójście nie będzie takie łatwe, ponieważ kobieta wciąż jest jeszcze żoną Tylera, swojej młodzieńczej miłości. Opuściła go przed laty ze względu na jego niewierność. Sienna postanawia pojechać do Kornwalii i załatwić wreszcie sprawy rozwodowe.
  ageRating: 12
  genre:
  - '22'
