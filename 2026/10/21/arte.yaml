  title: 360° Reportage
  subtitle: 'Leben mit dem Tod: Ahnenkult auf Sulawesi'
  subtitled: true
  description: Auf der zu Indonesien gehörenden Insel Sulawesi dreht sich schon zu Lebzeiten der Bewohner alles um den Tod, vielmehr um die Beerdigung. Der Totenkult der Toraja kann mehrere Hunderttausend Euro verschlingen, was die Bestattung verstorbener Verwandter oft auf Jahre unmöglich macht. So behalten die Angehörigen ihre Toten so lange im Haus, bis sie das Geld für die aufwendigen Feierlichkeiten zusammen haben. Die Toraja und ihr komplexer Ahnenkult lassen einen anderen Blick auf den Tod werfen.
