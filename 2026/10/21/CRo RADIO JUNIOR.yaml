  description: 'Speciální vysílání ze 42. ročníku Mezinárodního festivalu rozhlasové tvorby Prix Bohemia Radio 2026 Olomouc - živé vysílání z Kavárny POTMĚ se Světluškou. Obsluha kavárny: Miroslav a Kateřina Orságovi, Zuzana Mádlová, Jiří Ferenz a vidící členové týmu Veronika Opršalová a Kristína Šedivá. Co kdybychom si dnes dali kávu, ale neviděli ani na šálek, ze kterého ji pijeme? Rádio Junior se v rámci festivalu Prix Bohemia Radio vydá na nevšední návštěvu do Kavárny POTMĚ. Tu provozuje Světluška, projekt Nadačního fondu Českého rozhlasu pomáhající lidem se zrakovým postižením. Tady totiž neplatí, že kdo nevidí, ten se nevyzná! V naprosté tmě se o hosty starají nevidomí kavárníci, kteří se orientují tam, kde ostatní tápou. Jaké to je pracovat, obsluhovat hosty a zvládat každodenní situace bez zraku? O tom si budu povídat třeba i s Kačkou a Mírou, kteří o tom pořádají přednášky a workshopy pro děti. Prozradí nám také, na co se jich lidé nejčastěji ptají a co by o životě nevidomých měli vědět i školáci. A možná zjistíme, že někdy stačí zhasnout, abychom toho víc poznali! Moderuje Klára Nováková.'
- eventId: 931309
  start: 2026-10-21T17:50:00Z
  stop: 2026-10-21T18:00:00Z
  title: Hajaja
  description: Ferda v mraveništi 3/7. Všeuměl Ferda se po ztroskotání své lodi vrací do rodného mraveniště a hned se vrhne do vymýšlení všelijakých zlepšováků, ať už při lovu divokých mšic nebo čištění chodeb mraveniště. Poslechněte si příhody chytrého mravence s červenou kravatou, který se ničeho nezalekne a je vždy ochoten pomoci přátelům i těm, s nimiž se setká poprvé. Podle stejnojmenné knihy Ondřeje Sekory pro rozhlas připravila Eva Linková. Dramaturgie Václava Ledvinková. V roce 1988 natočil režisér Miroslav Šváb. Vypráví Vlastimil Brodský.
