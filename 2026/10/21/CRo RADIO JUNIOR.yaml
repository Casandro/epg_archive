- eventId: 930585
  start: 2026-10-21T16:30:00Z
  stop: 2026-10-21T16:55:00Z
  title: Čtení na pokračování
  description: 'Bitva o diamant 6/6. Když hraješ baseball v zapadákově, musíš do toho dát srdce! Jedenáctiletý Luke, talentovaný nadhazovač, se navzdory svému drobnému tělesnému hendikepu nevzdává snu stát se profesionálním sportovcem. Když si ale trenéři místo něj odvedou do profesionálního klubu jiné hráče, vypadá to, že s baseballem je na vesnici konec a rodiče se rozhodnou hřiště zastavět. Pak teprve začne ta pravá bitva, ve které se zbylé děti musí spojit a vybojovat svůj prostor zpátky. Napsala: Bára Dočkalová. Režie: Petr Gojda. Asistentka režie: Lenka Radová. Rozhlasová adaptace: Marie Špalová. Dramaturgie: Petr Gojda, Zuzana Sikačová. Hudba: Marek Doubrava. Sound design: Ondřej Gášek. Mistr zvuku: Jitka Špalová. Vyrobeno: 2026. PREMIÉRA'
- eventId: 931308
  start: 2026-10-21T16:55:00Z
  stop: 2026-10-21T17:50:00Z
