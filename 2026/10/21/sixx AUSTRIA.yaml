  title: Gilmore Girls
  subtitle: |-
    Der Schoko-Hund
    Familie, USA 2005
    Altersfreigabe: Ohne Altersbeschränkung
  description: |-
    Luke kümmert sich in Lorelais Abwesenheit um den Hund Paul Anka und merkt schnell, dass man das Tier nicht aus den Augen lassen darf. Paul Anka hat eine Riesenportion Schokolade gefressen und muss nun schleunigst zum Tierarzt. Unterdessen überlegt Rory, das Angebot ihrer Oma anzunehmen und in die Organisation "Daughters of the American Revolution" einzusteigen - obwohl sie das Uni-Leben in Yale mittlerweile ziemlich vermisst.

    Regie: Michael Zinberg
    Drehbuch: David S. Rosenthal
    Komponist: Sam Phillips

