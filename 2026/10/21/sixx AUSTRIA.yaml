    Altersfreigabe: ab 12
    (WH vom Dienstag, 20.10.2026, 15:40 Uhr)
  description: |-
    Derek wird vom Vorstand zum Interimschefarzt bestimmt. In den Krankenhausfluren kursieren die wildesten Gerüchte, warum Webber abgesetzt wurde. Allen ist allerdings klar, dass Derek etwas damit zu tun hat. Derek hat gleich an seinem ersten Tag ein Riesenproblem, da eine Patientin von Bailey, die eine seltene Gen-Krankheit hat, während der Narkose aufwacht und bei lebendigem Leibe, aber ohne die Möglichkeit zu sprechen oder sich zu wehren, die Operation miterlebt ...

