  title: Klątwa Wyspy Dębów 5 (odc. 2)
  subtitle: Pojawiają się nowe dowody na obecność piratów na Wyspie Dębów. Znaleziono XVIII-wieczną skrzynię ze skarbami. Bracia otrzymują informację o znalezieniu w szybie GAL-1 "dziury z pieniędzmi".
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2017
    Występują: Rick Lagina, Marty Lagina, Charles Barkhouse, Craig Tester, Kyle Fetterly, Christa Brosseau
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 797733
  start: 2026-10-21T08:00:00Z
  stop: 2026-10-21T10:20:00Z
  title: Przyjaciel na wagę złota
  subtitle: Na małej wyspie na Pacyfiku Alan i Charlie próbują odnaleźć wojenny skarb pozostawiony przez armię japońską podczas II wojny światowej.
  description: |-
    Tytuł oryginalny: Chi trova un amico trova un tesoro
    IT,US, 1981
    Reżyseria: Sergio Corbucci
    Występują: Terence Hill, Bud Spencer, John Fujioka, Louise Bennett, Salvatore Borghese, Kainowa Lauritzen
    Alan zdobywa mapę prowadzącą do skarbu ukrytego przez armię japońską na jednej z wysp Pacyfiku pod koniec II wojny światowej. Uciekając przed gangsterami, potajemnie zmienia kurs statku Charliego i wyrusza na poszukiwania. Na miejscu odkrywa jednak, że wyspa nie jest bezludna. Na straży tajemniczego łupu stoją zarówno miejscowi mieszkańcy, jak i japoński żołnierz.
  genre:
  - '20'
