  title: Passato e presente Grand Hotel. L'Italia
  subtitle: Passato e presente Grand Hotel. L'Italia del lusso - Saloni sfarzosi, lampadari di cristallo, ascensori, orchestre, terrazze sul mare, ricevimenti, camerieri in livrea e viaggiatori provenienti da tutta Eu
  description: |-
    ropa. Sono i Grand Hotel che, tra la Belle Époque e il primo Novecento, diventano il grande palcoscenico del lusso internazionale. Lo specchio di una nuova società. Nato con lo sviluppo dei trasporti e del turismo moderno, il Grand Hotel accompagna l'ascesa della borghesia, modifica il paesaggio delle città e delle località di villeggiatura e si trasforma in luogo di mondanità, cultura e diplomazia. Tempio del lusso in cui s'incontrano aristocratici, finanzieri, artisti e nuovi ricchi. Non soltanto luoghi dove soggiornare ma dove ''stare al mondo''. Le guerre ne stravolgono la funzione; il boom economico e il turismo di massa ne mettono in crisi il modello. Oggi i Grand Hotel sopravvissuti custodiscono la memoria di quella stagione e continuano a offrire l'illusione di entrare, anche solo per qualche giorno, in un'Europa scomparsa. In studio con Paolo Mieli, il prof. Stefano Pivato. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Stefano Pivato Con la partecipazione di David Ognibene
