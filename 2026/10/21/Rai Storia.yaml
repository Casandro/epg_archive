  title: Passato e presente Madri di latte il mes
  subtitle: Passato e presente Madri di latte il mestiere delle balie - Prima del latte in polvere e dei biberon, il latte materno aveva un prezzo. Luigi Pirandello nel 1903 scrive la novella ''La balia'', storia di A
  description: |-
    nnicchia, una giovane donna siciliana alla quale, diventata madre, viene chiesto di fare da balia al figlioletto di una benestante coppia romana. Per molto tempo, l'''oro bianco'' ha tracciato il confine tra ricchezza e miseria, unendo due mondi lontanissimi: i palazzi dei ricchi e i casolari delle campagne. Da una parte c'erano donne benestanti, sollecitate a delegare l'allattamento per preservare la propria bellezza e riattivare la fertilità, così da garantire nuovi eredi alla casata. Dall'altro, madri indigenti costrette a mettere a rendita il proprio corpo, svezzando a forza i figli naturali per venderne il nutrimento e consegnandoli, spesso, a un destino di inedia. A fissare il prezzo di quel contratto non erano le donne, ma gli uomini: il marito, che contrattava l'ingaggio e incassava il compenso; il medico, che ispezionava la qualità del latte come fosse una perizia tecnica, gli istituti di carità, che contavano le gocce e trasformavano la maternità in una voce di bilancio. Poi, tra Otto e Novecento, la rivoluzione industriale e il lavoro in fabbrica hanno spezzato definitivamente questo ingranaggio, rendendo l'allattamento al seno del tutto incompatibile con i turni di produzione. A dare la svolta finale è arrivata la scienza: la sterilizzazione, i pastorizzatori domestici e i primi preparati in polvere hanno offerto un'alternativa sicura. Il cibo per i neonati poteva finalmente essere conservato e somministrato senza dover affittare il corpo di un'altra donna. È così che il mercato delle balie è tramontato, consegnando agli archivi un sistema secolare e lasciando dietro di sé la memoria di una moltitudine silenziosa di madri. In studio con Paolo Mieli, la prof.ssa Maria Giuseppina Muzzarelli. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio la prof.ssa Giuseppina Muzzarelli Con la partecipazione di Charlotte Marincola
