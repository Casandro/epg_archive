  title: Il tunnel per la libertà
  subtitle: A poco più di 60 anni di distanza dalla costruzione del muro di Berlino, Rai Documentari propone un documentario per ripercorre la storia da una prospettiva inedita del Muro, uno dei simboli storici dello scorso millenni..
  description: |+
    . 'Tunnel della Libertà' racconta una vicenda sorprendente e sconosciuta nella Berlino del primo dopoguerra. Due italiani, Luigi Spina e Domenico Sesta, partecipano alla costruzione del primo tunnel per consentire la fuga da Berlino Est a Berlino Ovest. Una rocambolesca avventura dove Spina e Sesta hanno l'idea geniale di vendere ai network televisivi americani i diritti delle immagini del tunnel e dell'evacuazione attraverso di esso, dei rifugiati. Questa operazione, molto audace per quei tempi, è l'asso nella manica con cui si rende possibile e realizzabile l'incredibile sogno della libertà. - di Marcus Vetter

