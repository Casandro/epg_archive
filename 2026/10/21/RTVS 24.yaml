  title: SK Dejiny (18)
  subtitle: Predseda vlády - od červenej k trikolóre. Populárno-náučná diskusia o objavovaní zlomových okamihov našich dejín.
  description: Ministerský predseda čaká v predsieni, kedy ho príjmu vodcovia strany. Tak nejak to mohlo vyzerať u nás za socializmu, keď namiesto viacerých strán vládla jedna. Vtedy sme mali aj niekoľkých predsedov slovenskej vlády. Najdlhšie - vyše 19 rokov bol v úrade Petr Colotka. Možno si na to meno spomínate matne, no Vladimír Mečiar či Mikuláš Dzurinda sa z pamäti určite nevytratili. O nich aj o ďalších v tomto úrade si povieme oveľa viac v druhej časti SK_Dejiny venovanej našim premiérom od obdobia socializmu po druhé parlamentné voľby. (2026)
  genre:
  - '35'
