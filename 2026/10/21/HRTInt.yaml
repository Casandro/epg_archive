  description: '"Povijest zagrebačkoga urbanog i arhitektonskog modernizma povijest je utjecaja i njihova prihvaćanja - pluralistička povijest istodobnosti, sučeljavanja i uporednosti različitih govora i mentaliteta, povijest sinteze i kombinacije." - pisao je početkom devedesetih arhitekt i konzervator Aleksander Laslo, tada na vrhuncu svoje stvaralačke karijere. Njegovi tekstovi opisuju jedinstvenu arhitektonsku atmosferu grada Zagreba, a prvi put su okupljeni u nedavno objavljenoj knjizi u izdanju Instituta za povijest umjetnosti. Takav pogled na arhitekturu blizak je i Ákosu Moravánszkom, čiji je rad bitno pridonio promjeni načina na koji promatramo srednjoeuropsku arhitekturu: umjesto tradicionalnog poimanja odnosa arhitektonskih "centara" i njihovih "periferija", on istražuje mrežu uzajamnih utjecaja, prijenosa i preoblikovanja ideja. U drugom dijelu emisije razgovaramo s tim uglednim mađarsko-švicarskim arhitektom i teoretičarem, koji je u Zagrebu gostovao prilikom predstavljanja Laslove knjige.'
