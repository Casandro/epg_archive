  start: 2026-10-21T02:10:00Z
  stop: 2026-10-21T02:55:00Z
  title: Kod nas doma
  subtitle: ' '
  description: 'Nikolu Koju dobro poznajemo po brojnim filmskim ulogama, a sada ćemo ga upoznati i kao pjevača! S bendom Girls, Boys & Toys stiže u Zagreb s glazbenom predstavom "Kako sam prestao da pevam pod tušem". Kako je kupaonicu zamijenio pozornicom i što nam sve donosi spoj glazbe, humora i osobnih priča, otkrit će nam danas. Zašto majke često osjećaju krivnju kada odvoje vrijeme za sebe i očekujemo li od njih da uvijek budu na raspolaganju? S psihologom Borisom Blažinićem razgovaramo o pritisku savršenog majčinstva, ulozi očeva i tome zašto je za dobrobit djeteta važno da i mama bude dobro. A u rubrici "Računica s Milunom" govorimo o ulaganju u zlato. Toni Milun i njegov gost Vladimir Potočki objasnit će kako se uopće počinje ulagati, po čemu se zlatna poluga razlikuje od nakita i koje rizike treba imati na umu. Voditeljica: Barbara Kolar Redateljica: Kamelija Čančarević Urednik, scenarist: Danijel Despot'
- eventId: 879074
  start: 2026-10-21T02:14:00Z
  stop: 2026-10-21T02:59:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
