  title: 'Brodovi hranitelji: Posljednji vinari, dokumentarna serija (2008.) (2/5)'
  subtitle: ' '
  description: U drugom nastavku priča nas odvodi u Stari Grad na Hvaru i Velu Luku na Korčuli. Naime, iz Vele Luke je bio najveći broj vinara, a u Starom Gradu još vozi i radi posljednji jadranski brod vinar "Duboka" građen 1878. godine. Korištene su i najstarije poznate snimke šibenske luke iz 1904. godine koje svjedoče o životu luke i velikoj važnosti prijevoza vina. Sugovornici, nekada i sami vinari, vlasnici vrlo vrijednih brodova, ni sami ne znaju kako sačuvati to blago. U filmu je svoju praizvedbu imala i pjesma Marija Prižmića iz Vele Luke "Sveto blago".
