  description: 'U Pričama iz Hrvatske pogledajte - kakav planet ostavljamo budućim generacijama? Klimatske promjene čine svoje, sve se mijenja, brišu se granice između godišnjih doba. Doznajemo što možemo očekivati u skoroj budućnosti. Družimo se s gospođom Đurđom koju nazivaju ženom zmajem. Njezinu priču donosi Maja Sever. Urednica i voditeljica: Klaudia Kežić Mrkonjić Realizatorica: Kamelija Čančarević'
