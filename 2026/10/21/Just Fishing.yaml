  description: Der Fiume Po ist das größte Fließgewässer Italiens und nicht nur für seine Wallervorkommen - sondern auch für seine Karpfen - und Zanderbestände legendär. Andy Gutscher - der Wallerknaller - ist seit Mitte der 90er Jahre Angelcampbetreiber im Unterlauf des Pos. Gerade beim Kunstköderangeln auf Großzander setzte der bescheidene Österreicher maßgebliche Akzente in Bezug auf Fangmethoden und Fangerfolge. AT 2023
