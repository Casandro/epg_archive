  title: Großhuchen in der Steppe der Mongolei
  subtitle: Großhuchen in der Steppe der Mongolei
  description: Der Steppe der Mongolei hat der frühere Herrscher Dschingis Khan seinen Stempel aufgedrückt. In den Flüssen hat es der asiatische Huchen, der sogenannte Taimen getan. Dschingis Khan Herrschaft ist schon lange Vergangenheit, der Taimen herrscht indessen noch immer in den Flusssystemen der Mongolei. Ihn umgibt auch heute noch eine Aura der Unbesiegbarkeit. DE 2024
