- eventId: 890372
  start: 2026-10-21T00:20:00Z
  stop: 2026-10-21T00:35:00Z
  title: Hecht, Zander und Barsch am Voralpensee
  subtitle: Hecht, Zander und Barsch am Voralpensee
  description: Glasklares Wasser, heiße Temperaturen und ein verwegener Plan, den Herbert Ziereis ausgeheckt hat. Er versucht mit Gummiködern an einem Tag sowohl Hecht, Zander und Barsch zu fangen. Von der richtigen Farbwahl hin zur perfekten Angelstelle und der richtigen Köderpräsentation bedarf es jeder Menge Gespür und Vertrauen. Genau das macht einen Profi wie ihn aus. Ob es am Ende tatsächlich gelingt und das Glück auf seiner Seite ist, bleibt fraglich. Eins steht jedoch fest, ohne den richtigen Riecher und die langjährige Erfahrung ist dieser Plan schnell zum Scheitern verurteilt. DE 2022
- eventId: 890373
  start: 2026-10-21T00:35:00Z
  stop: 2026-10-21T00:48:00Z
  title: Topwatern im November - 12 Monate Topwater Challenge
  subtitle: Topwatern im November - 12 Monate Topwater Challenge
  description: Der Winter kommt mit großen Schritten immer näher, aber trotzdem ist gerade jetzt eine super Zeit, um Topwater zu angeln! Die Futterfische stehen oft noch Flach und Hecht, Barsch und Co. Fressen sich so richtig satt. Passt man nun die Köderführung und Stellenwahl den Gegebenheiten an, kann man oftmals wahre Sternstunden und gigantische Bisse an der Wasseroberfläche bekommen. Genau aus diesem Grund haben wir unsere 12 Monate Topwater Challenge ins Leben gerufen! DE 2022
- eventId: 890374
  start: 2026-10-21T00:55:00Z
  stop: 2026-10-21T01:15:00Z
  title: Techniken zum Schwarzbarschangeln unter der Oberfläche
  subtitle: Techniken zum Schwarzbarschangeln unter der Oberfläche
  description: Die meisten Angeltechniken wurden einst konzipiert, um Schwarzbarsche zu fangen. Kaum ein Zielfisch kann so unterschiedlich beangelt werden wie er und wir versuchen herauszufinden, was unter der Oberfläche am besten funktioniert. Sei es Powerfishing mit schnell geleierten Ködern wie Chatter- oder Spinnerbaits oder auf die langsame Tour mit Dropshot und verschiedenen Rigs. DE 2022
- eventId: 890375
  start: 2026-10-21T01:15:00Z
  stop: 2026-10-21T01:29:00Z
  title: Überraschender Beifang beim Schwarzbarschangeln - Der italienische Hecht
  subtitle: Überraschender Beifang beim Schwarzbarschangeln - Der italienische Hecht
  description: Im Lago di Bolsena soll es eigentlich auf Schwarzbarsch gehen. Nach dem ein oder anderen gefangenen Zielfisch ist auf einmal die Rute richtig krumm. Was jedoch am anderen Ende der Schnur hängt, ist eine Riesige Überraschung. Ein italienischer Hecht, Esox Cisalpinus hat sich den Köder geschnappt. Dies ist eine endemische Fischart, welche nur in Nord und Mittelitalien vorkommt. Die wunderschöne Zeichnung dieser Gattung macht ihn zu einem ganz besonderen, unvergesslichem Fang auf unserer Angeltour. DE 2022
- eventId: 890376
  start: 2026-10-21T01:35:00Z
  stop: 2026-10-21T01:57:00Z
  title: Pelagisch auf Große Zander am Großgewässer
  subtitle: Pelagisch auf Große Zander am Großgewässer
  description: |-
    In diesem Video zeigen euch  John Chowns und Bernd Kapust das pelagische Angeln auf große Zander am Rheindelta. Geangelt wird über die neueste Technik (Livescope). Die Fische werden gezielt gesucht und mit der Live-Technik gezielt angefahren und angeangelt.

     NL 2023
- eventId: 890377
  start: 2026-10-21T02:00:00Z
  stop: 2026-10-21T02:20:00Z
  title: Pelagisch bis zum Motorschaden
  subtitle: Pelagisch bis zum Motorschaden
  description: Pelagisches Angeln auf Zander zieht immer mehr Bootsangler in ihren Bann - zurecht, denn mit dieser Methode lassen sich kapitale Fische fangen. John Chowns und Kevin Kampino, Experten dieser Technik, zeigen Euch, dass diese Methode trotz bester Technik kein Zuckerschlecken ist. DE 2023
