    Seria podróżnicza niewiele mająca wspólnego z typowym przewodnikiem turystycznym. Wieloetniczność oraz współwystępowanie katolicyzmu, islamu i prawosławia to symbol Półwyspu Bałkańskiego. W samej tylko Bośni i Hercegowinie występuje 40% muzułmanów, 30% prawosławnych oraz 15% katolików. Lena spotka się z wyznawcami każdej z religii i postara się zrozumieć, jak koegzystują one ze sobą. W tym celu odwiedzi muzułmańską Albanię, prawosławną Bułgarię oraz zróżnicowaną religijnie Bośnię.
  ageRating: 12
