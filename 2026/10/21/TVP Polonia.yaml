    W swojej kolejnej wyprawie kulinarnej Karol Okrasa odwiedzi dwór Krzysztofa Pendereckiego z wyjątkowym parkiem, liczącym ponad 2 tysiące rzadkich drzew i krzewów. Profesor Penderecki był bodaj najbardziej znanym na świecie polskim kompozytorem muzyki poważnej przełomu XX i XXI wieku. Odznaczony przez rządy wielu krajów, obsypany licznymi nagrodami był wielkim światowcem.
  genre:
