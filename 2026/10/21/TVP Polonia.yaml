  title: Nad rozlewiskiem... - odc. 8/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Kuba nadal mieszka w domu Marysi. Ona nie chce z nim rozmawiać. W końcu Kuba otrzymuje pozew rozwodowy, na który się nie zgadza. Marysia przeżywa ciężkie chwile. Podsumowuje swoje dotychczasowe życie, ale bilans niestety wychodzi na minus. Spokój mieszkańców Ostródy zakłóca przejazd ciężkiego sprzętu budowlanego. Przez pole Karolaków ma przychodzić droga szybkiego ruchu. Do zespołu Macieja i Karola dołączają Krzysztof i Marysia.
  ageRating: 12
  genre:
  - '23'
  subtitle: Kuba otrzymuje pozew rozwodowy, z którym się nie zgadza. Konrad kupuje konia i postanawia zbudować stajnię. Planuje zostać z Małgosią na stałe. Tomasz namawia Basię, by napisała kolejną książkę.
- eventId: 768272
  start: 2026-10-21T19:20:00Z
  stop: 2026-10-21T20:10:00Z
  title: Nad rozlewiskiem... - odc. 9/13
  description: |-
