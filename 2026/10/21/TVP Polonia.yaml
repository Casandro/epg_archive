    W tym odcinku przyjrzymy się sieci powiązań, która jest charakterystyczna dla zwierząt związanych z dużymi rzekami. Jest to tylko mały wycinek ich skomplikowanych relacji. Przetrwanie rybitw żyjących w Polsce jest w pełni uzależnione od działań jakie podejmuje człowiek. Dowiemy się również co łączyrybitwę z człowiekiem i jak połączeni są oni z meszką.
