  title: Vom Rind zum Steak - Europas größter Rinder-Schlachthof
  subtitle: Vom Rind zum Steak - Europas größter Rinder-Schlachthof
  description: 'Rund 7.000 Tiere kommen pro Woche in Europas größtem Rinder-Schlachthof im oberbayerischen Waldkraiburg an - ob Bio-Qualität oder konventionelle Mast, ob Milchkuh oder Jungbulle. Täglich werden hier rund tausend Rinder geschlachtet, zerlegt und weiterverarbeitet. Doch Rind ist nicht gleich Rind: Jedes Exemplar wird bewertet und in Klassen eingeteilt. Bei der Fleischverarbeitung muss ein strenger Produktionsablauf eingehalten werden. Die Reportage begleitet die Herstellung des Massenprodukts.'
  widescreen: true
