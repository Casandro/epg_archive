  title: ARD Konzert
  description: "Graupner im Kirchheimer Konzertwinter 2026 - Sommeredition\n\nChristoph Graupner: \nFünf Solokantaten für Bass\nEin Gnadenglanz strahlt aus der Höhe, GWV 1107/41, Kantate zum 3. Weihnachtstag\nSiehe, dieser wird gesetzt zu einem Fall, GWV 1108/45, Kantate zum Sonntag nach Weihnachten\nGleich wie mich der Vater gesandt hat, GWV 1131/18, Kantate zum 1. Sonntag nach Ostern (Quasimodogeniti)\nTeurer Tröster aus der Höhe, GWV 1137/42, Kantate zum 6. Sonntag nach Ostern (Exaudi)\nWer nicht zur Tür hineingehet, GWV 1140/43, Kantate zum 3. Pfingsttag\n\nKirchheimer BachConsort\nDominik Wörner (Bass)\nLeitung: Florian Heyerick\n\nKonzertaufnahme vom 22. und 23. August 2026 in der Protestantischen Kirche in Kirchheim an der Weinstraße\n\nVom dritten Weihnachtstag bis zum dritten Pfingsttag: Fünf Solokantaten für Bass von Christoph Graupner durchmessen das Kirchenjahr - Musik eines Komponisten, der seine Opernpläne begraben musste und die Kirche zur Bühne machte.\nChristoph Graupner wollte Opern schreiben, aber der Darmstädter Hof hatte kein Geld dafür. Also verlegte der Hofkapellmeister seine Dramaturgie kurzerhand in die Kirche und komponierte in 45 Jahren über 1450 Kantaten. Seine vergessenen Werke werden seit einigen Jahren systematisch wiederentdeckt, aufgeführt und eingespielt - maßgeblich durch das Kantaten-Projekt des Bassbaritons Dominik Wörner im kleinen pfälzischen Weinort Kirchheim an der Weinstraße. Fünf Kantaten stehen dieses Jahr auf dem Programm - auf Texte von Johann Conrad Lichtenberg, konzipiert für eine einzelne Singstimme und kleines Instrumentalensemble."
