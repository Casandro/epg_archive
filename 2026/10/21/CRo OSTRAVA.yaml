  description: Záznam druhé části profilového koncertu Cimbálové muziky Soláň a jejích sólistů, který se konal v říjnu 2006 jako historicky druhá edice obnoveného hudebního cyklu Zpěvem k srdci. Hostem večera byl emeritní ředitel Valašského muzea v přírodě v Rožnově pod Radhoštěm Jaroslav Štika, zpívají Ludmila Vašková, Klára Blažková a Pavel Ptáček, slovem provází Jan Rokyta senior, s odstupem 20 let úvodem glosuje Jan Rokyta mladší.
