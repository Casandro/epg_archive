  description: 'Mit ''Car Maniac'' präsentiert SPORT1 am Freitagabend das erste Magazin zur Elektromobilität im deutschen TV. Moderiert wird das neue Format von E-Auto-Spezialist und YouTube-Star Chris Karatsonyi, der an seiner Seite die Rennfahrerin Laura-Marie Geissler begrüßt. Zusammen nimmt das Duo die neuesten Modelle der Autohersteller genau unter die Lupe und spricht dabei Klartext. Mit seiner langjährigen Erfahrung testet Chris kompetent und ehrlich alle wichtigen Elektrofahrzeuge auf Herz und Nieren - und das nicht immer zum Vorteil der Hersteller. Egal ob Hypercar, Nobelmarke, Familienkutsche oder Billig-Stromer: Jeder muss sich der schonungslosen Instanz von ''Car Maniac'' stellen.'
