  title: Die PS Profis - Im Einsatz Alfa Katastrophale
  subtitle: Die PS Profis - Im Einsatz Alfa Katastrophale
  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann.  In der zweiten Folge möchte der 18-jährige Keanu seiner Mutter Peggy etwas Gutes tun und hat sich deshalb an Sidney gewandt.  Keanus Mutter arbeitet als Familienpflegerin in einem Heim für Demenzkranke. Ein harter Job, der Peggy viel abverlangt. 2016 hatte Peggy mit ihrem Alfa eine "Begegnung" mit einem Pfeiler im Parkhaus. Seitdem ist das Auto stark beschädigt, aber es fehlt das nötige Geld für Reparaturen und Wartung.  Hier kann nur noch einer helfen: Sidney und sein Team nehmen sich der Sache an und versuchen, den kleinen Italiener so schnell wie möglich wieder in neuem Glanz erstrahlen zu lassen. Wird es der Crew gelingen den Alfa innerhalb von drei Tagen wieder hinzubekommen? Und wie reagiert die 39-Jährige auf die Komplettverwandlung ihres Autos?'
  widescreen: true
