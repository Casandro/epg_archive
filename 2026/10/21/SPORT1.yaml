  title: Die PS Profis - Im Einsatz Kleines Auto - große Probleme
  subtitle: Die PS Profis - Im Einsatz Kleines Auto - große Probleme
  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann.  In der dritten Ausgabe stellen sich Sidney und seine Crew der schwierigen Challenge, aus einem Smart Fortwo ein echtes Kunstwerk zu machen. Besitzer und Überraschungskandidat Patrick fährt damit täglich knapp 200 km Autobahn und wird dabei von anderen Verkehrsteilnehmern ordentlich gemobbt. Doch damit soll jetzt Schluss sein: Der PS Profi fährt alle Geschütze auf: Außen und innen soll der Smart ordentlich was hermachen.'
