  title: Die PS Profis - Im Einsatz Der Horror Golf
  subtitle: Die PS Profis - Im Einsatz Der Horror Golf
  description: Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann.  Zur ersten Ausgabe hat Tims Freund Julien den Studenten ohne dessen Wissen bei Sidney beworben. Der 29-Jährige geht tagsüber studieren und arbeitet nachts und am Wochenende bei einem Paketdienst, um sich seinen Lebensunterhalt zu finanzieren. Dabei bleibt kein Geld für die Reparatur seines 22 Jahre alten 3er Golf GTI übrig. Sidney ist von Juliens Bewerbungsvideo überzeugt und macht sich auf den Weg nach Wuppertal. Dort überrascht er mit Hilfe von Julien und Tims Freundin Sonja den Studenten und nimmt das Auto mit in die heimische Garage. Das Team kommt an seine Grenzen, wird es Sidney, Pedro, Tobi und Probearbeiter Benni dennoch gelingen, den Golf wieder fit zu machen?
