  description: 'Ein nächtlicher Einbruch im Wolfratshausener Heimatmuseum: Als "Hubert und Staller" am Tatort eintreffen, entdecken sie im Schrank einer historischen Bauernstube die Leiche eines Wachmannes - erstochen mit einem Säbel. Wertvolle Orden wurden gestohlen. Museumsdirektor Brase und seine Assistentin sind schockiert. Als die beiden Polizeiobermeister herausfinden, dass der Einbruch vorgetäuscht war, rücken die Mitarbeitenden des Museums in den Fokus.'
