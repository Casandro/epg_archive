  start: 2026-10-21T13:00:00Z
  stop: 2026-10-21T13:10:00Z
  title: Süd Journal vom 20.10.2026 (Wh.)
  subtitle: Sicherheit im Alpenraum - Tagung in Kiefersfelden +++ Knott bei Eggstaett IG Metall will zurück zum Tarifvertrag +++ 260.000 Euro für bessere Straßen in Feldkirchen-Westerham
  description: Drogenhandel, organisierte Kriminalität und Drohnen als neue Gefahr setzen die Sicherheitsbehörden im Alpenraum unter Druck. Eine Tagung der Bayern-Südtirol-Gesellschaft in Kiefersfelden betonte grenzüberschreitende Zusammenarbeit und moderne Technik. Wie sicher ist die Region? +++ Fast 30 Jahre lang galt beim Bremsen- und Achsenhersteller Knott in Eggstätt ein Tarifvertrag mit der IG Metall. Diesen Vertrag hat die Geschäftsführung gekündigt. Gewerkschaft und Betriebsrat kritisieren diese Entscheidung. +++ Feldkirchen-Westerham erweitert sein Straßensanierungsprogramm dank günstiger Ausschreibung von drei auf fünf Ortsstraßen. Für rund 260.000 Euro werden Asphalt, Bankette und Entwässerung erneuert. Start noch dieses Jahr, teils mit Sperrungen, Abschluss bis 2027.
- eventId: 694573
  start: 2026-10-21T13:10:00Z
  stop: 2026-10-21T13:20:00Z
  title: Süd Journal vom 20.10.2026 (Wh.)
  subtitle: Zollrazzia in Rosenheim und Umgebung +++ Vor Gericht wegen Drogenhandels +++ Autounfall bei St. Georgen +++ Schechen plant Entlastungen bei Kita-Beiträgen +++ Therme Bad Aibling - Insolvenz bei der Beauty-Kuppel
  description: Nach einer Zollrazzia in Rosenheim und Umgebung sitzen sieben Verdächtige in U-Haft. Sie sollen Arbeitskräfte illegal eingeschleust und Sozialabgaben betrogen haben. Über 200 Einsatzkräfte durchsuchten 16 Objekte, sicherten Beweise und pfändeten Geschäftskonten. Ermittlungen laufen. +++ Drei Männer aus dem Raum Rosenheim stehen wegen mutmaßlichen Drogenhandels und schwerer Gewalttaten vor Gericht. Laut Staatsanwaltschaft sollen sie seit Anfang 2023 gemeinsam mit Drogen gehandelt und Menschen eingeschüchtert haben, darunter ein Überfall im Wald. +++ Beim Abbiegen Richtung Traunreut geriet eine Autofahrerin an einer Kreuzung auf die falsche Spur und prallte auf eine Verkehrsinsel. Ölwanne und Reifen wurden beschädigt, Motoröl lief aus. Die Feuerwehr Stein an der Traun sicherte die Stelle, die Insassinnen blieben unverletzt. +++ In Schechen sinkt ab Januar 2027 die Kita-Gebühr für drei bis vier Stunden Betreuung von 192 auf 98 Euro. Weil der staatliche Zuschuss von 100 Euro wegfällt, zahlen Eltern unterm Strich dennoch mehr als bisher. Der Gemeinderat stimmte zu, Elternbeirat folgt, Beschluss im November.
