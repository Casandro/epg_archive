- eventId: 694569
  start: 2026-10-21T12:20:00Z
  stop: 2026-10-21T12:30:00Z
  title: Süd Journal vom 20.10.2026 (Wh.)
  subtitle: Energiegipfel in Burghausen kommende Woche +++ Kirta in Traunreut +++ Wetter für das Sendegebiet
  description: 'Der dritte Burghauser Energiegipfel diskutiert nächste Woche, wie die Energieversorgung der Zukunft gelingt und Burghausen als Industriestandort wettbewerbsfähig bleibt. Im Fokus stehen neue Energieprojekte, der Ausbau der Stromnetze und Herausforderungen für die Industrie. +++ In Traunreut hat die Kirta-Saison begonnen: Im Holzstadl am Marktplatz feierten Gäste aus der Stadt und den Nachbargemeinden bei Musik und frisch gezapftem Bier. Bürgermeister Hans-Peter Dangschat eröffnete das Fest traditionell mit dem Bieranstich. +++ Am Mittwoch verbreitet stark bewölkt bis bedeckt und ostwärts ausgreifender Regen, am Abend auch Oder und Neiße erreichend. Höchstwerte 8 bis 16 Grad. Schwacher bis mäßiger Wind, von Westen her von Südost auf Südwest drehend. An der Nordsee frischer Süd- bis Südostwind.'
