  stop: 2026-10-21T03:18:00Z
  title: Živjeti što Bog govori, Živjeti što Bog govori
  subtitle: Magazin/Religijski
  description: Poštuj oca i majku svoju -- zapovijed koju svi znamo, ali živimo li je doista? U novoj emisiji Živjeti što Bog govori s don Rolandom Jelićem ulazimo u srce četvrte Božje zapovijedi. Zašto Bog kaže poštuj, a ne samo slušaj? Koga ta zapovijed obvezuje? Kada poslušnost prestaje biti dužnost? Što dugujemo starijim roditeljima i kako se nositi s ranama i prekinutim odnosima? Može li se živjeti vjera, a ostaviti obiteljske odnose nerazriješenima? Odgovore tražimo u svjetlu Evanđelja i nauka Crkve.
