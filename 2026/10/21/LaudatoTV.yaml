  title: Čovjek prije svega
  subtitle: Magazin
  description: Svećenik za oltarom - očekivano. Ali svećenik za volanom autobusa? Vlč. Dragutin Goričanec naučio ga je voziti zbog osoba s invaliditetom, kako bi i oni mogli krenuti na put, hodočašće ili susret. No njegov životni put odavno vodi prema onima koje drugi ponekad ne vide - osobama s invaliditetom, beskućnicima, ovisnicima, zatvorenicima i svima kojima je potreban čovjek. Što ga tjera da uvijek iznova krene prema drugome? Zašto nikada nije odustao od ljudi koji žive u problemima? Župnik u Završju, povjerenik za pastoral osoba s invaliditetom i duhovnik Caritasa, čovjek je koji ne pristaje na riječ ''nemoguće . Upoznajte vlč. Dragutina Goričanca u novoj epizodi serijala ''Čovjek prije svega .
