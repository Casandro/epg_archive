  title: Superknjiga
  subtitle: Animirani
  description: '"Luka ima problema u komunikaciji s novim učenikom u školi. Raj je upravo doselio iz Indije i govori samo hindu jezikom. Kada se Gizmov program za prevođenje pokvari, Luka žali zbog činjenice da postoji toliko različitih jezika i pita se zašto svi drugi jednostavno ne govore njegovim jezikom! Superknjiga odvede djecu u vrijeme kada je Bog pobrkao jezike u Babelu. S razumijevanjem zašto postoji toliki broj jezika, djeca bivaju prenesena u kasnije vrijeme, u gornju sobu za vrijeme Pentekosta, gdje svjedoče tome kako je Sveti Duh dao čudesnu sposobnost da se svi međusobno razumiju. Luka dolazi do dubljeg razumijevanja što znači zajednički rad i pronalazak zajedničkog ,,jezika. Po povratku kući, djeca organiziraju zajednički objed s Rajom i njegovom obitelji i, iako Luka i Raj još uvijek ne govore istim jezikom, trude se sporazumjeti koristeći univerzalni jezik PIZZE!"'
