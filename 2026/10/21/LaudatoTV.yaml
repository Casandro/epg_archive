  title: Božanstvena komedija
  subtitle: Religijski
  description: 'Tko je žena za 21. stoljeće i koje su to specifičnosti žena? Zanimljivo pitanje čiji nam odgovor otkrivaju gosti i voditelji u ovoj epizodi o najvećoj tajni svemira: žene. Koja je razlika između žena i muškaraca? Kako ispravno vrednovati feministički pokret? U religijskom pogledu razmatra se jesu li žene zanemarene, odnosno diskriminirane u Crkvi. Je li ukidanje svih razlika rješenje da se stvori sklad? Razumijemo li uopće ulogu muškaraca i žena u društvu?'
