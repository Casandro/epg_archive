  title: Blagoslovljen tek
  subtitle: Religijski
  description: Na zagrebačkoj Trešnjevci ugostili su nas Emica i Damir Macan, bračni par koji slavi punih 40 godina braka u kojem su blagoslovljeni s dvoje djece i četvero unučadi. Emica i Damir otkrivaju nam kako su kroz životne kušnje, krize, ali i brojne milosti, učili vjerovati i ne odustajati. Njihova priča govori o tome da nas Gospodin poziva u svakom životnom razdoblju, samo je pitanje hoćemo li se odazvati. U kulinarskom dijelu pripremaju gulaš sa žgancima te mramorni kolač.
