  title: 'Podcasty: Konkretnie. 60 minut z polityką - Radosław Sikorski'
  description: |-
    cykl reportaży (Polska, 2026), Konkretnie. 60 minut z polityką - Radosław Sikorski
    Arkadiusz Gruszczyński zaprasza do rozmów najważniejszych graczy polskiej polityki. Gościem premierowego odcinka podcastu "Konkretnie. 60 minut z polityką" jest wicepremier i szef MSZ Radosław Sikorski. Gruszczyński pyta polityka m.in. o kulisy negocjacji z prezydentem Karolem Nawrockim dotyczących nominacji ambasadorskich. Sikorski krytykuje prezydenta za ingerowanie w kompetencje rządu, mówi o osiągnięciach gabinetu, odpowiada na pytania o największe porażki Koalicji 15 października i wskazuje, kogo uważa za głównego przeciwnika rządzących.
