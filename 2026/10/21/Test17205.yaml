  title: Objectif Monde
  description: "Chine, une superpuissance fragile ? En dix ans, la Chine est devenue la locomotive technologique de la planète. De Canton à Pékin, les voitures électriques du constructeur XPeng désormais considéré comme le Tesla chinois côtoient les taxis volants sans pilote. Les énergies renouvelables cohabitent avec les centrales à charbon. La puissance chinoise est économique mais aussi militaire. Elle possède la plus grande armée du monde et son économie dégage 1 200 milliards de dollars d'excédent commercial. Pourtant derrière ces excellents chiffres, on peut voir l'ombre d'un essoufflement : consommation en berne, chômage des jeunes, crise immobilière, déclin démographique. \n (France-2026)"
