  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Der Mann mit dem goldenen Näschen
  description: |-
    Kaum jemand kennt die Goldfelder des Northern Territory in Australien so gut wie Steve Woods. Und mit seinem Dryblower kann man auch in sehr trockenen Regionen Edelmetall fördern, in denen es kein Wasser gibt. Die Machereys wollen zusammen mit Steve und seiner Maschine beweisen, dass auf der riesigen Moline Lease wertvolle Goldvorkommen verborgen liegen. Gelingt ihnen das nicht, wird ihr Traum von einer eigenen Mine in Down Under wie eine Seifenblase zerplatzen. Denn ohne einen fundierten Nachweis wird kein Investor in das Projekt einsteigen.
    DEU 2026
  widescreen: true
