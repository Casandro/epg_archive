  title: The Last Woodsmen - Holzfäller am Limit
  subtitle: Wer bremst, verliert
  description: |-
    Die Crew hat in den vergangenen sechs Tagen hart gearbeitet. Jared Douglas bleiben noch 48 Stunden, um sein Gebot für den "Forever Claim" abzugeben. Die fehlenden 200.000 Dollar für das vielversprechende Erntegebiet bekommt er nur zusammen, wenn der Kahn voll beladen ablegt. Deshalb packt der Chef selbst mit an. Der Forstunternehmer sitzt am Steuer eines 30 Tonnen schweren Trucks und muss das Fahrzeug unmittelbar an einem steilen Hang wenden. Die Holzfäller Jim Gardner und Rob Winger dringen unterdessen auf der Suche nach Riesen-Lebensbäumen tief ins Bergland vor.
    USA 2025
