  title: Goldrausch in Alaska
  subtitle: Ein Beets kommt selten allein
  description: |-
    Tony Beets bekommt Besuch. Sein jüngerer Bruder Klaas ist zu Gast in Nordamerika. Die beiden Männer sind zusammen auf einer Milchfarm in den Niederlanden aufgewachsen. Klaas war 2011 das letzte Mal im Yukon. Seitdem ist der Familienbetrieb enorm gewachsen. Tonys Tochter Monica liefert am Indian River einen neuen Muldenkipper ab. Und auf einer benachbarten Mine ist ein Damm gebrochen. Dabei wurde eine Straße überflutet, und jetzt steckt einer von Tonys Bulldozern im Graben fest. Der Versuch, die Planierraupe zu bergen, läuft komplett aus dem Ruder.
    GBR 2025
  widescreen: true
