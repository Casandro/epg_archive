  title: Setkání u mikrofonu
  description: V Setkání u mikrofonu se podíváme do CERNu, největší světové laboratoře částicové fyziky sídlící v Ženevě. Jeden z tisíců vědců, kteří se tohoto rozsáhlého mezinárodního výzkumu účastní, je fyzik Miroslav Šulc z Fakulty přírodovědně-humanitní a pedagogické Technické univerzity v Liberci. Jaká je jeho role a jakých úspěchů naši vědci v Švýcarsku dosáhli? Nejen na to se ho zeptal Miroslav Černík z výzkumného ústavu CXI.
