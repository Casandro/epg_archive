- eventId: 930984
  start: 2026-10-21T09:05:00Z
  stop: 2026-10-21T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: S nejbližšími na konci života. Manažerka péče o dárce v organizaci Hospic sv. Zdislavy v Liberci Helena Kuličová. Poradenská pracovnice organizace s. Zdislavy v Liberci Marie Rissová. Prožít poslední dny svého života v laskavém domácí prostředí, nebo v důstojném a útulném lůžkovém hospici. Jaké jsou v současné době možnosti paliativní a hospicové péče pro nemocné, a podpory pro celé jejich rodiny, a proč je pro nás důležité být s našimi nejbližšími v jejich posledních chvílích života. Nejen těmto otázkám se budeme věnovat hodinu před polednem.'
