- eventId: 809793
  start: 2026-10-21T21:30:00Z
  stop: 2026-10-21T22:21:57Z
  title: WELTjournal +
  subtitle: Netanjahu - die Anklage des Internationalen Strafgerichtshofs
  description: "Israels Premierminister Benjamin Netanjahu ist der erste Staatschef eines vom Westen unterstützten demokratischen Landes, gegen den ein Haftbefehl des Internationalen Strafgerichtshofs vorliegt. Der IStGH wirft Netanjahu und seinem früheren Verteidigungsminister Joav Galant vor, für Kriegsverbrechen und Verbrechen gegen die Menschlichkeit während des Gaza-Krieges verantwortlich zu sein.\nDas WELTjournal +  zeigt, worauf sich die Anschuldigungen des IStGH gegen Netanjahu und Galant stützen. Die Zerstörung ganzer Wohnviertel mit zahllosen zivilen Todesopfern, die Zerstörung von landwirtschaftlichen Flächen und Teilen der Wasserversorgung, die Behinderung humanitärer Hilfe sowie Angriffe auf die medizinische Infrastruktur werden u.a. durch die Analyse von Satellitenbildern akribisch nachgewiesen. Zu Wort kommen israelische Politiker und Geheimdienst-Mitarbeiter ebenso wie Soldaten, Menschenrechtsorganisationen und die Familien der Geiseln. \nGestaltung: Laetitia Moreau, Mitarbeit Matan Cohen"
  genre:
  - '129'
