  title: 'Recht konkret: Alles rund um Konsum und Verträge'
  description: Verträge begegnen uns beinahe täglich - oft, ohne dass wir groß darüber nachdenken. Kann man ein Geschenk zurückverlangen, wie lange dürfen Gutscheine befristet sein und was unterscheidet einen Werkvertrag von anderen Verträgen? Auch beim täglichen Einkauf halten sich einige Rechtsmythen hartnäckig. Moderatorin Larissa Rausch klärt die wichtigsten Fragen rund um Verträge, Gutscheine und Konsumentenrechte.
