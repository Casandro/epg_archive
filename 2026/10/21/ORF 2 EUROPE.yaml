  title: Autofocus
  subtitle: Strom zurück ins Haus
  description: Elektroautos werden zunehmend mehr als reine Verkehrsmittel. Mit dem Laden in zwei Richtungen, können ihre Batterien überschüssigen Strom speichern und später wieder an Haushalt oder Stromnetz abgeben. Besonders in Verbindung mit Photovoltaikanlagen eröffnet das neue Möglichkeiten für den Alltag. Damit das funktioniert, müssen Fahrzeug, die Ladestation für zuhause, das Haus selbst und das Energiemanagement optimal zusammenspielen. So entwickelt sich das Auto Schritt für Schritt zu einem flexiblen Baustein der zukünftigen Energieversorgung.
