  title: Österreich vom Feinsten
  subtitle: Salzburg - Rund um Neumarkt am Wallersee
  description: "Neben gepflegten Wiesen und Wäldern und den idyllischen Ortschaften sind es vor allem der Wallersee sowie der Mattsee, der Obertrumer See und der Grabensee, die das sanft hügelige  Gebiet prägen. \nDie landschaftlichen Besonderheiten, die Menschen in der Region, und die echte Volksmusik stehen wieder im Mittelpunkt der Hauptabendsendung in ORF 2.\nSo besucht Hans Knauß diesmal das Europaschutzgebiet Wenger Moor und den international renommierten Künstler Johann Weyringer. Auch altes Handwerk wird gezeigt, wie etwa die Herstellung von Pranger Stutzen. Ein Besuch im Ferdinand-Porsche-Automobilmuseum darf nicht fehlten, und schließlich wird der \"Österreich vom Feinsten\" Moderator noch mit einer kulinarischen Spezialität \"vom Feinsten\" verwöhnt - mit Salzburger Nockerln.\n\nMusikalisch umrahmt wird die Hauptabendsendung in ORF 2 wieder mit echter Volksmusik.\nDie Flochgau Blech wird zu hören sein, genauso wie die Mirabell Dirndln, die Schallmoser Buam und die Wiesl Musi. Auch die Edelweiß Musi und die Seesaitn Musi sind diesmal mit dabei.\nStimmgewaltig wiederum präsentiert sich der Männerchor \"Liedertafel Neumarkt\" - und auch eine der ältesten Trachtenmusikkapellen im Land Salzburg darf nicht fehlen: die Trachtenmusikkapelle Henndorf am Wallersee. Buch und Regie: Robert Sturmer."
