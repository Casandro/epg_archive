  title: WELTjournal
  genre:
  - '129'
  subtitle: Israel - der Einfluss der Rechtsextremen
  description: |-
    Bei den kommenden Wahlen in Israel könnten die beiden rechtsextremen Minister Bezalel Smotrich und Itamar Ben-Gvir den Ausschlag geben. Sie repräsentieren nur einen kleinen Teil der israelischen Gesellschaft, doch die Regierung Netanjahu ist auf sie angewiesen. Unter Netanjahu haben sie überproportional viel Macht und tragen maßgeblich zur Radikalisierung der Politik bei. Zahlreiche westliche Länder haben Sanktionen bzw. Einreiseverbote gegen sie verhängt. Das WELTjournal zeigt ein Porträt der beiden rechtsextremen Minister, die eine gemeinsame ideologische Agenda verfolgen: die Verdrängung der palästinensischen Bevölkerung, die Annexion der besetzten palästinensischen Gebiete und ein Groß-Israel, das Teile von Jordanien, Syrien und dem Libanon umfasst. Gezeigt wird zugleich auch der Widerstand jener Israelis, die seit den Justiz-Umbauplänen der Netanjahu-Regierung das Ende der Demokratie in ihrem Staat befürchten. Zu Wort kommen die ehemaligen israelischen Ministerpräsidenten Ehud Barak und Ehud Olmert und die frühere Justizministerin Tzipi Livni, die - wie viele Israelis - mit Sorge auf die nationalreligiösen und rechtsextremen Strömungen in der Politik blicken.
    Gestaltung: Jérôme Sesquin
