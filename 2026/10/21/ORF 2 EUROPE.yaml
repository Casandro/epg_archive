  title: Kronprinz Rudolf
  subtitle: Der Rebell
  description: |-
    (Fernsehfilm, AUT/DEU/ITA 2006)
    Er ist reich, brillant und voller revolutionärer Pläne für die Zukunft Österreich-Ungarns.  Für seinen Vater, Kaiser Franz-Joseph, den er verehrt, gerät Kronprinz Rudolf zu sehr nach seiner Mutter, der freigeistigen Kaiserin Sisi.  Bald muss Rudolf sich entscheiden, was er wirklich will, privates Glück oder die Verwirklichung seiner politischen Ambitionen.
    Mit Max von Thun (Rudolf), Vittoria Puccini (Mary Vetsera), Klaus Maria Brandauer (Franz-Joseph), Sandra Ceccarelli (Sisi), Birgit Minichmayr (Mizzi), Christian Clavier (Taffee), Julia Jentsch (Sarah), Omar Sharif (Canon), Julia Cencig (Larisch), Daniela Golpashin (Stephanie), Fritz Karl (Johann), Karl Markovics (Bombelles), Gabriel Barylli (Braganza), Wolfgang Böck (Bratfisch), Nikolaus Paryla (Loschek), Joachim Król (Szeps) u.a.
    Drehbuch: Klaus Lintschinger und Didier Decoin
    Regie: Robert Dornhelm
    Koproduktion ORF/ARD/RAI
