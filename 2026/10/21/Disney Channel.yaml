  title: Hör' mal, wer da hämmert
  subtitle: Ein verrückter Haarschnitt Comedy-Serie, USA 1996
  description: 'Folge 120, Tim Taylor ist der selbsternannte Heimwerker-König und der Moderator der Heimwerker-Sendung "Tool Time", die vom Werkzeughersteller Binford gesponsert wird. Dabei steht ihm der gutmütige und etwas behäbige Schreiner Al als Assistent zur Seite. Tim ist mit der resoluten Jill verheiratet. Das Paar hat drei Söhne: Brad, Randy und Mark. Die Handlung kreist um das Leben der Familie und Tims Versuche, mit meist übertriebenen Mitteln handwerkliche Aufgaben zu lösen. Dabei scheitert er meist. Zur Seite steht ihm in allen Lebenslagen sein Nachbar Wilson, mit dem er sich über den Gartenzaun hinweg unterhält.'
