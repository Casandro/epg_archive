  title: Hör' mal, wer da hämmert
  subtitle: Eine Pille für Randy Comedy-Serie, USA 1996
  description: Folge 121, Bei einer ärztlichen Routineuntersuchung wird bei Randy ein womöglich bösartiges Geschwulst am Hals entdeckt. Tim und Jill wollen ihren Sohn nicht beunruhigen, bis das Testergebnis da ist. Es gelingt ihnen nicht besonders und Randy spürt, dass etwas nicht Ordnung ist und schließlich darf er zu Hause bleiben. Er tut allerdings so, als gehe er in die Schule, doch Tim findet ihn schließlich im Spiele-Salon, wo Randy sich die Zeit bis zum Testergebnis vertreiben will. Als das Ergebnis negativ ausfällt, sind alle erleichtert, nur Tim hat nicht verstanden, worum es bei der Sache eigentlich ging.
