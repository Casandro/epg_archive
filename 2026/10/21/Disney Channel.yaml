  title: How I Met Your Mother
  subtitle: Nackter Mann Comedy-Serie, USA 2008
  description: 'Folge 73, Nachdem Ted einen schönen Abend mit Vicky verbracht hat und abends nach Hause kommt, sitzt ein nackter Mann namens Mitch auf seinem Sofa. Seine Erklärung: Er habe eine ausgefeilte Taktik entwickelt, um Frauen ins Bett zu bekommen. Während die Frauen kurzfristig den Raum verlassen, zieht er sich nackt aus, um sie bei ihrer Rückkehr zum Sex zu animieren. Diese neue Methode versuchen auch Ted und Barney bei ihren Frauen ... Nicht jeder hat damit Erfolg.'
  widescreen: true
- eventId: 902187
  start: 2026-10-21T18:35:00Z
  stop: 2026-10-21T19:05:00Z
  title: How I Met Your Mother
  subtitle: Weicheier Comedy-Serie, USA 2008
  description: Folge 74, Barmann Dough ist für seine Loyalität gegenüber seinen Stammgästen im McLaren's bekannt. Das bekommen auch Ted und seine Freunde zu spüren, als ihr Stammtisch besetzt ist. Gegen ihren Willen räumt Dough rigoros für sie den Tisch und verabredet sich mit den Typen draußen zu einer Schlägerei und fordert Ted und seine Freunde auf, ihm zu helfen. Die endet jedoch anders als gedacht ... Schließlich ist es der als Weichei verspottete Marshall, der als Sieger aus der Runde geht.
  widescreen: true
- eventId: 902188
  start: 2026-10-21T19:05:00Z
  stop: 2026-10-21T19:35:00Z
  title: How I Met Your Mother
  subtitle: Im Exil Comedy-Serie, USA 2008
  description: Folge 75, Ted bekommt Besuch von seiner Schwester Heather. Sie möchte nach New York ziehen und sucht einen Job und eine Wohnung. Heather ist sehr chaotisch und kann nicht mit Geld umgehen, nun möchte sie ausgerechnet in der Finanzbranche arbeiten. Barney war von Teds hübscher Schwester schon immer angetan und besorgt ihr ein Vorstellungsgespräch bei der Bank, bei der er arbeitet ... Robin hat Heimweh nach Kanada. Um sie abzulenken, nimmt Marshall sie mit in eine Bar.
  widescreen: true
