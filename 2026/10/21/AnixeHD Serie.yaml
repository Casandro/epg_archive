  title: So schmeckt die Welt - Norderney
  subtitle: So schmeckt die Welt - Norderney
  description: Norderney ist mehr als nur eine Insel, Norderney ist Sehnsuchtsort, Kraftplatz und oft zweite Heimat. Die zweitgrößte ostfriesische Insel erreicht man mit der Fähre ab Norddeich nach rund 1 Stunde und die Schiffe stechen auch im Stundenrhythmus in See. Herb, friesisch, kultig und auch etwas mondän. Es ist diese Mischung aus Nationalpark, Dünenarchitektur, endlosen Sandstränden und stattlichen Häusern die einen Aufenthalt so erlebenswert und abwechslungsreich machen. Der Urlaub beginnt bereits an Bord. Sehnsucht steigt, sobald die Insrl in Sichtweite ist. Im Hafen angekommen holt einen die Düneninsel sofort ab und die Skyline von Norderney zieht einen in das Innere. Willkommen zuhause.
