  description: 'Her return to Ritsona is both personal and political: access to the camp is tightly controlled, and journalists are routinely denied entry. When our team applied for permission to film inside, our request was denied. What we found outside the gates — and what Fadia carries with her — tells its own story. After the Taliban seized power in Afghanistan in August 2021, millions fled the country fearing persecution, violence, and severe restrictions on women''s rights. Greece remains one of the EU''s main entry points for asylum seekers, recording over 55,000 applications in 2025 — the highest number per capita in the European Union. Many people spend months or years in reception centres like Ritsona, waiting for their cases to be decided. Greece''s Migration Minister has publicly stated the ministry is "not a hotel" for migrants, reflecting a broader shift toward restrictive asylum policies across Europe. Fadia''s story is one of displacement, trauma, and the slow work of rebuilding. It is also a window into a system that remains largely hidden from public view.'
