  description: В программе "Движимые верой" вы услышите реальные истории людей, жизнь которых кардинально изменилась после встречи с Иисусом Христом. Герои программы в диалоге с ведущей, Анной Федоровой, расскажут о том, что они видели собственными глазами! Это и сверхъестественные исцеления, отменяющие приговоры врачей, и избавления от неминуемой смерти, и другие невероятные чудеса, которые подтверждают реальность Божественной силы в жизни тех, кто верит! Смотрите новую программу о том, как Господня рука творит чудеса сегодня!
- eventId: 840679
