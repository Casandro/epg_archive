  description: Олег Васильевич Булкин - старший пастор церкви "КОВЧЕГ" в г. Сочи. Олег Васильевич был военным. Однажды он встретил человека, который рассказал ему о Христе, о спасении. Господь коснулся сердца будущего служителя, и в нем зародилось желание посвятить свою жизнь Богу. После окончания военной службы Олег Булкин принял сан священника и уже около десяти лет служит пастором церкви. Служение общины распространилось за пределы Сочи; дочерние церкви открыты в Дагомысе, Адлере и других районах Краснодарского края. Олег Васильевич убежден, что нашел свое призвание, цель рождения; пастор уверен, что ты тоже избран и любим Небесным Отцом! Кем бы ты ни был - богатым или бедным, здоровым или в немощи, - Господь для всех Един, Он ждет каждого! В Нём ты можешь обрести семью, братство, единство!
