  title: '"Повелитель тьмы" - х/ф 16+'
  subtitle: '"Повелитель тьмы" - х/ф 16+'
  description: В тот день настал конец света. Взлетевшие ядерные ракеты затмили солнце, а затем внезапно исчезли, как и миллионы людей, и среди них семья эксперта по борьбе с терроризмом Стоуна. Началась эра правления Мессии, "спасителя мира", объявившего себя Главой Правительства Единой Земли. Но у "мечты о всеобщем единстве" есть противники -движение сопротивления, которое считает самозванного Мессию самым настоящим Антихристом. В отчаянной попытке разобраться в происходящем и найти свою семью Стоун заключает союз с участниками сопротивления - компьютерным хакером и таинственной слепой девушкой. Ключ к разгадке - код доступа в секретную программу виртуальной реальности. Взломав ее, Стоун понимает, что вовлечен в битву, старую как мир - битву с самим Сатаной!
