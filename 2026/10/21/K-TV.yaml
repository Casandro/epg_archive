  title: Neues Leben für alte Mauern - Die Restaurierung der Dorfkirche in Leins im Pitztal
  subtitle: Dokumentation
  description: Die Dorfkirche in Leins im Pitztal ist das Herz des Dorfes. Die Einwohner setzen alles daran, sie zu bewahren. Mit viel Hingabe und handwerklichen Geschick arbeiten sie gemeinsam an der Restaurierung.Die Reportage erzählt von dem großen Engagement der Dorfgemeinschaft um dafür zu sorgen, dass dieses spirituelle und kulturelle Erbe für kommende Generationen erhalten bleibt.
