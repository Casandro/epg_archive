  subtitle: Spiritualität
  description: Anna Schäffer führte bis zu ihrem 18. Lebensjahr ein äußerlich unauffälliges Leben, allerdings seit ihrem Erstkommuniontag  in enger Verbundenheit mit dem eucharistischen Jesus. Nach ihrem Unfall, der ihre Berufspläne zum Scheitern brachte, war der Rest ihres Lebens ein schwerer Kreuzweg, begleitet von ununterbrochenem Leid. Sie lernte es, im Kreuztragen mit Jesus Christus eins zu werden und an seiner Erlöserliebe teilzunehmen. Vortrag von Pfarrer Johann Bauer.
