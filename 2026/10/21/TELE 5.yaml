  title: Stargate
  subtitle: Trojanische Kugel
  description: |-
    P5C-353: Als Colonel O'Neill, Captain Carter und Dr. Jackson ein rätselhaftes Objekt entdecken, das elektromagnetische Wellen aussendet, ist die Neugier der Forscher:innen geweckt. Zur genaueren Untersuchung nehmen sie die Kapsel, die einem futuristischen Fabergé-Ei ähnelt, mit zur Stargate-Basis auf der Erde. Doch plötzlich entwickelt das antike Artefakt ein bedrohliches Eigenleben. Beim Versuch, das Gerät durch das Stargate zu schicken, ereignet sich eine fatale Kettenreaktion: Die Alien-Kugel verankert sich im Gemäuer, verletzt O'Neill und setzt aggressive Organismen frei, die sich unkontrolliert ausbreiten.
