- eventId: 966326
  start: 2026-10-21T05:30:00Z
  stop: 2026-10-21T05:40:00Z
  title: Glow (3)
  subtitle: Heimlichkeiten
  description: 'Das Zusammenleben der Patchworkfamilie ist nicht so einfach. Lars und Hilde stellen neue Regeln auf und Jenny hat Angst, dass Hilde und Kim wieder ausziehen wollen. Aber Kim hat andere Pläne: Sie möchte an eine Musik-Schule wechseln und hat heimlich einen Termin bei der Direktorin ausgemacht. Aber um sich zu qualifizieren, muss Kim in zwei Wochen zu einem Klaviervorspiel kommen. Das stellt sie vor ein Problem.'
- eventId: 966441
  start: 2026-10-21T05:40:00Z
  stop: 2026-10-21T05:50:00Z
  title: Glow (4)
  subtitle: Das Kellerzimmer
  description: Jenny will aus dem chaotischen Keller ein gemütliches Zimmer für alle machen und fängt mit ihrer Freundin Naomi an, das Gerümpel nach draußen zu räumen. Zu ihrer Enttäuschung haben August, Yasin und Kim kein Interesse an ihrem Plan, nur Hilde unterstützt sie. Als dann auch Kim einen Schritt auf die Mädchen zumachen möchte, kriegt sie mit, wie schlecht Jenny vor den anderen über sie spricht. Die Situation eskaliert...
- eventId: 966469
  start: 2026-10-21T05:50:00Z
  stop: 2026-10-21T06:15:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens
  subtitle: Nordgriechenland
  description: 'Am zweiten Tag in der Wildnis ohne Handys und Kontakt zur Außenwelt wollen die sechs wenigstens ein bisschen Körperpflege machen. Doch mit eiskaltem Wasser aus einem Gebirgsfluss kostet das Haarewaschen ganz schön Überwindung. Wildniscoach Tobi fordert die Jugendlichen mit einer außergewöhnlichen Aktion heraus: Ein 40 Meter hoher Baumriese muss erklettert werden. Da darf keiner Höhenangst haben.'
