- eventId: 966326
  start: 2026-10-21T05:30:00Z
  stop: 2026-10-21T05:40:00Z
  title: Glow (3)
  subtitle: Heimlichkeiten
  description: 'Das Zusammenleben der Patchworkfamilie ist nicht so einfach. Lars und Hilde stellen neue Regeln auf und Jenny hat Angst, dass Hilde und Kim wieder ausziehen wollen. Aber Kim hat andere Pläne: Sie möchte an eine Musik-Schule wechseln und hat heimlich einen Termin bei der Direktorin ausgemacht. Aber um sich zu qualifizieren, muss Kim in zwei Wochen zu einem Klaviervorspiel kommen. Das stellt sie vor ein Problem.'
- eventId: 966441
  start: 2026-10-21T05:40:00Z
  stop: 2026-10-21T05:50:00Z
  title: Glow (4)
  subtitle: Das Kellerzimmer
  description: Jenny will aus dem chaotischen Keller ein gemütliches Zimmer für alle machen und fängt mit ihrer Freundin Naomi an, das Gerümpel nach draußen zu räumen. Zu ihrer Enttäuschung haben August, Yasin und Kim kein Interesse an ihrem Plan, nur Hilde unterstützt sie. Als dann auch Kim einen Schritt auf die Mädchen zumachen möchte, kriegt sie mit, wie schlecht Jenny vor den anderen über sie spricht. Die Situation eskaliert...
- eventId: 966469
  start: 2026-10-21T05:50:00Z
  stop: 2026-10-21T06:15:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens
  subtitle: Nordgriechenland
  description: 'Am zweiten Tag in der Wildnis ohne Handys und Kontakt zur Außenwelt wollen die sechs wenigstens ein bisschen Körperpflege machen. Doch mit eiskaltem Wasser aus einem Gebirgsfluss kostet das Haarewaschen ganz schön Überwindung. Wildniscoach Tobi fordert die Jugendlichen mit einer außergewöhnlichen Aktion heraus: Ein 40 Meter hoher Baumriese muss erklettert werden. Da darf keiner Höhenangst haben.'
- eventId: 966601
  start: 2026-10-21T06:15:00Z
  stop: 2026-10-21T06:40:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens
  subtitle: Nordgriechenland
  description: 'Die Mädchen sind gespannt: Gestern Nacht haben Die Jungs noch Klos gebaut. Ob Die wohl funktionieren? Die Jungs demonstrieren ihre Wildnistoilettenanlage jedenfalls mit viel Humor. Auf dem Weg zum nächsten Camp entdecken Die sechs ein gruseliges Tierskelett. Ganz geheuer ist es ihnen nicht. War das womöglich ein Bär? Zum Glück kommen sie bei ihrer nächsten Herausforderung auf andere Gedanken. Ein wilder Fluss muss mit Kajaks bezwungen werden.'
- eventId: 966860
  start: 2026-10-21T06:40:00Z
  stop: 2026-10-21T06:55:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (3/6)
  subtitle: Punk und Breakdance unerwünscht
  description: Wild, bunt und ganz schön mutig! Wie haben Jugendliche damals ihr eigenes Ding gemacht? Anna und Julian versuchen sich im Breakdance und treffen Punk Bernd, der in seinen Songs das triste Leben in der DDR beschreibt - zum Unmut der Regierung. Als Bernd mit seinen Freunden Kerzen für den Frieden anzündet, wird er mitten in der Leipziger Innenstadt verhaftet. Als 19-Jähriger sitzt er plötzlich im Gefängnis und weiß nicht, was jetzt mit ihm passiert.
- eventId: 967355
  start: 2026-10-21T06:55:00Z
  stop: 2026-10-21T07:10:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (4/6)
  subtitle: Fußball neben der Stinkefabrik
  description: Wie eklig! Südlich von Leipzig befindet sich eine der größten Stinkefabriken der DDR. In Espenhain wird Braunkohle verarbeitet, Unmengen von Dreck und Mief verpesten die Luft. Anna und Julian lernen Hartmut kennen, der als Kind gern Fußball spielt, aber kaum noch Luft zum Atmen findet. Hartmut und seine Freunde haben die Nase voll von dem Dreck und starten Aktionen für eine saubere Umwelt - zum Ärgernis der Stasi.
