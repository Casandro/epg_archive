  description: Ein kulinarischer Roadtrip mit Wildwest-Romantik im Norden Baden-Württembergs. SWR Moderator und Reporter Ramon Babazadeh begibt sich auf einen Abenteuerstreifzug durch das wilde, schöne Hohenlohe.
- eventId: 969205
  start: 2026-10-21T09:55:00Z
  stop: 2026-10-21T10:45:00Z
  title: Elefant, Tiger & Co. (436)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: Kaum ein Tier lockt mehr Besucher in den Zoo als ein Elefant - und zugleich ist keines schwerer zu halten - und vor allem zu züchten. Im März bringt Elefantenkuh Hoa ein Kalb zur Welt, nach 22 Monaten Tragzeit. Tags und fast ohne erkennbare Vorzeichen. Eine Sturzgeburt inmitten der Elefantenherde, ganz anders als geplant.
