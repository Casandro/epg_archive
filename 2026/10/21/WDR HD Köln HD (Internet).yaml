  stop: 2026-10-21T09:10:00Z
  title: Mittendrin - Flughafen Frankfurt (85)
  subtitle: Die höchste Party der Welt - der letzte Flug der 757
  description: "Farewell 757 - nach 35 Jahren. Condor sagt Tschüss zur letzten Boeing in ihrer Flotte. Damit endet auch eine Ära bei der hessischen Airline, die jetzt nur noch Airbus-Maschinen einsetzen wird. \nDer Abschiedsflug startet in Frankfurt und bringt die Passagiere nach Wien, wo die Boeing 757 mit einem Event feierlich gewürdigt wird.\nZum Abschluss des Tages wird auf dem Rückflug die höchste Party der Welt gefeiert. \"Mittendrin\" ist mittendrin im Partyflieger mit DJ und Ehrengästen und blickt zurück auf ein außergewöhnliches Flugzeug, das bei Piloten und Flugbegleitern zu den Lieblingsfliegern gehörte."
- eventId: 968966
