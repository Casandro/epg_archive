  description: Als Lucrezia ihrem früheren Geliebten Alfonso D'Este begegnet, flammt ihre Leidenschaft erneut auf. Unterdessen weiß sie ihren mutmaßlich entführten Sohn Giovanni in guten Händen. Obgleich er von Savonarola fasziniert ist, lässt Cesare den Mönch festnehmen und foltern, bis dieser alle Vorwürfe gesteht. Zugleich nimmt Cesare die Florentiner für sich ein, die schließlich Savonarolas Tod verlangen. FR 2012
