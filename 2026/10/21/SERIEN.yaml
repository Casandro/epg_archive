  title: Borgia - Ein Mysterienspiel
  subtitle: Borgia - Ein Mysterienspiel
  description: In Lyon erfüllt Cesare sein Versprechen gegenüber König Ludwig, aber dieser verweigert ihm dennoch Carlottas Hand. Rodrigo liefert öffentlich den Beweis neu gewonnener Stärke. Stärke beweist auch Lucrezia, als sie ihrem Ehemann Alfonso Di Calabria klar macht, wer in ihrer Ehe die Macht hat. Alfonso muss eine weitere Demütigung hinnehmen, als Lucrezia und nicht er Statthalter von Spoleto wird. FR 2012
