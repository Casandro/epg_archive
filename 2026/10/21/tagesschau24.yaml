  title: Kampf gegen die Uhr - Lieferdienste im Großstadtstress
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: "Jeden Tag werden in Hamburg Tausende Pakete, Lebensmittel und Waren ausgeliefert - möglichst schnell, pünktlich und direkt bis an die Haustür. \n\"Die Nordreportage\" begleitet drei Zusteller durch den Großstadtstress: Paketzusteller Thorsten Goldmann, Lebensmittellieferantin Nadin Grüning im Mini-Elektromobil und einen Fahrer auf dem Cargo-Bike. \n\nDer Film zeigt Zeitdruck, körperliche Belastung, aber auch Humor und überraschend persönliche Begegnungen. Und er blickt auf eine mögliche Zukunft: Jörg von Cölln testet, ob Hamburgs Wasserwege eine Alternative zu den verstopften Straßen sein könnten."
