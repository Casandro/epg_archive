  audiodesc: true
  description: Ginge es nach der Statistik, dann wäre Sabrina längst tot, doch die moderne Medizin hat dem Schicksal ein Schnippchen geschlagen. Mit einem angeborenen Herzfehler lebt sie nun schon 27 Jahre. Dabei hatten die Ärzte ihr eine Prognose von nur wenigen Jahren gegeben. Was für die Betroffenen und ihre Familien ein Segen ist, stellt Gesellschaft und Versorgungssystem vor besondere Herausforderungen, denn die Anzahl der jungen Erwachsenen mit lebensverkürzenden Krankheiten verdoppelt sich alle fünf Jahre, es sind mittlerweile über 100.000 in Deutschland.
