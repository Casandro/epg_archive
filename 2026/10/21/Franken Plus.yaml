  title: Guten Abend Franken vom 20.10.2026 (Wh.)
  subtitle: 'Unsere Themen heute u.a.: Erlanger Technikerschule vor dem Aus?, wie stark sind unsere Gewässer mit Nitrat belastet?, Sportschießen Bundesligaauftakt in Fürth'
  description: 'Erlangen muss weiter viel Geld einsparen.  Aus diesen finanziellen Zwängen ist die Zukunft der traditionsreichen Technikerschule in der Stadt ungewiss. Nitrat im Wasser ist auch bei uns hier in der Region ein Problem. Mit Wasserproben in Ansbach will die Umweltorganisation Greenpeace mögliche Nitratbelastungen sichtbar machen. Und im Sport schauen wir heute zu den Sportschützinnen und -schützen nach Fürth.  Die SSG RWS Fürth ist am Wochenende mit einem Sieg und einer Niederlage in die neue Bundesligasaison gestartet. Heute für Sie im Studio: Moderator Philipp Waldmann.'
