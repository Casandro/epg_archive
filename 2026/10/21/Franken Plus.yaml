  stop: 2026-10-21T05:45:00Z
  title: TVO - Der Bezirk (Wh.)
  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen S..
  description: Der Bezirk Oberfranken - Das Magazin ist eine monatliche Sendereihe, in der die Aufgaben des Bezirks Oberfranken und die Menschen, die dafür stehen, vorgestellt werden. Dass der Bezirk Oberfranken wichtige Aufgaben zu erledigen hat, liegt auf der Hand. Über 300 Millionen Millionen Euro fließen jährlich allein in die Sozialarbeit. Aber auch Fischerei und Gewässerschutz, Kultur- und Brauchtumspflege, der Unterhalt der Bezirkskliniken und die Landwirtschaftlichen Lehranstalten sind Facetten der täglichen Arbeit der Bezirksverwaltung.
- eventId: 694240
  start: 2026-10-21T05:45:00Z
  stop: 2026-10-21T06:00:00Z
  title: TVO - Topf & Teller (Wh.)
  subtitle: In der Sportsendung Treffer fassen wir am Montagabend das Sportgeschehen in Oberfranken vom Wochenende zusammen. Welche Teams jubelten, welche Mannschaften verließen mit hängenden Köpfen die Spielfläche? Wir geben eine ausführl..
  description: Im Jahr 2018 prämierte der Freistaat 100 Genussorte in Bayern. Insgesamt 23 davon liegen in Oberfranken. Damit ist die Region der Bezirk mit den meisten Genussorten in ganz Bayern. Auch die Tradition spielt in den neun Landkreisen und vier kreisfreien Städten eine sehr große Rolle. Grund genug, auf eine kulinarische Reise durch Oberfranken zu gehen. In Topf & Teller zeigen wir Ihnen, wie Oberfranken schmeckt. Wir stellen traditionelle Gerichte und Speisen vor, die es nur in bestimmten Landkreisen, Städten oder Dörfern gibt - oder die eben typisch oberfränkisch sind. Dabei sind wir zu Gast bei Privatpersonen, aber auch bei Sterneköchen, traditionellen Wirtschaften, Bäckereien und Metzgereien.
