  description: "14:00\nDie Entscheidung - Momente, die alles verändern\nWarum geht jemand zurück in den Krieg? | Die Entscheidung Aktuell\nAls Russland die Ukraine angreift, flieht die Journalistin Maryna Osipova mit ihren beiden kleinen Kindern nach Frankreich. Dort sind sie in Sicherheit. Doch dann trifft sie eine Entscheidung, die alles verändert: Sie kehrt zurück in die Ukraine. Zurück in den Krieg. Zurück ausgerechnet in eine Region nahe der Front, die ihre Heimat ist. Warum verlässt jemand einen sicheren Ort und geht freiwillig zurück in Gefahr? Die Frage \"Gehen oder bleiben?\" begleitet in der Ukraine Millionen Menschen jeden Tag. Die Antwort wird am Ende auch über den Ausgang des Krieges entscheiden.\nHost: Christine Auerbach\nZum Nachhören in  ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-entscheidung-momente-die-alles-veraendern/urn:ard:show:e7bcaf8eea1771e3/\n\n14:30h \n11KM: der tagesschau-Podcast\nKim Jong Un und der Ukraine-Krieg: Nordkoreas gefährlicher Aufstieg\nNordkorea gilt als bitterarm, ist aber zu einem entscheidenden Helfer Russlands im Ukraine-Krieg geworden. Fernsehbilder zeigen Nordkoreas Machthaber Kim Jong Un mit Tränen in den Augen, als Särge gefallener Soldaten aus dem Ukrainekrieg eintreffen. Hinter dieser Szene steht ein Kurswechsel, sagt ARD-Korrespondent Ulrich Mendgen. \nHost Elena Kuch \nZum Nachhören in  ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/"
