  title: Der Tag
  description: Es ist ein Bündnis mit Sprengkraft. SPD, Grüne und Linke wollen gemeinsam Berlin regieren. Politiker der Union, aber auch aus anderen Parteien warnen vor einem "Dammbruch" und fordern das Ende der Verhandlungen. Schon die Wahlparty der Berliner Linken sorgte für Aufregung, weil ein Clanmitglied und ein Unterstützer einer Terrororganisation mitfeierten. Außerdem äußern sich Parteimitglieder immer wieder pro-palästinensisch und stellen die Existenz Israels in Frage. Die "Berliner Vereinbarung" von Linken, Grünen und Sozialdemokraten fordert ein klares Bekenntnis zum Existenzrecht Israels, zum Schutz jüdischen Lebens und harte Sanktionen bei Verstößen.
  subtitle: Berliner Koalition - wie antisemitisch ist die Linke?
