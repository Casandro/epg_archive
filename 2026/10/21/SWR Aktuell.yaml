  title: SWR Kultur - Das Wissen
  subtitle: Die Wildkatze ist zurück - Wie Artenschutz gelingt
  description: |-
    Von Stephanie Eichler
    Die Europäische Wildkatze war vom Aussterben bedroht, durch erfolgreichen Naturschutz leben in Deutschland wieder rund 7000 Tiere. Geholfen haben naturnahe Wälder und Wildkatzenkorridore, die Lebensräume verbinden, aber auch dass viele Menschen Katzen mögen und sich für ihren Erhalt gewinnen lassen. Davon profitiert der Artenschutz insgesamt. Forscher und Forscherinnen nutzen GPS, Fotofallen und DNA-Analysen, um zu verstehen, wo Wildkatzen Ruheplätze und Verstecke für die Jungenaufzucht finden. Doch Straßenverkehr und Hybridisierung mit Hauskatzen bleiben große Gefahren.
