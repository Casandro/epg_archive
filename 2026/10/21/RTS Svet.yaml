  title: Obrazovno ogledalo
  subtitle: Pojava mesečine na noćnom nebu neodoljivo privlači i oduvek intrigira ljudski um i podstiče maštu kreativnih sanjara.
  description: Pojava mesečine na noćnom nebu neodoljivo privlači i oduvek intrigira ljudski um i podstiče maštu kreativnih sanjara. Zahvaljujući Mesecu postoje i mnoga neobična bića i najromantičniji trenuci u ljudskim životima. Većina ljudi veruje u njegovu moć i tajnu i pokušava da svoj životni ritam uskladi sa njegovom ćudi. Uticajem Meseca na ljude bavili su se još Aristotel, Paracelzus, Plinije Stariji verujući da, naročito pun Mesec, vrši jak fizički uticaj na ljudski organizam. Najdalje u svojim istraživanjima otišao je Pitagora i njegovi sledbenici o čemu u emisiji govori psiholog Bojana Škorc.
