  title: Koncert grupe Kerber
  subtitle: Na vrata jugoslovenske rok scene, grupa Kerber je ušla 1983. godine pobedom na čuvenom Omladinskom festivalu u Subotici.
  description: 'Na vrata jugoslovenske rok scene, grupa Kerber je ušla 1983. godine pobedom na čuvenom Omladinskom festivalu u Subotici. Prve koncerte održavaju u niškim klubovima, a često su bili i predgrupa Galije. Na muzičkoj sceni Srbije aktivni su više od 30 godina. Dana 12. decembra 2017. u prepunoj sali Centra Sava održali su romantičan i nezaboravan koncert izvodeći stare hitove u novim aranžmanima. Gosti koncerta bili su Vokalni ansambl Konstantin i Crkveni hor Branko iz Niša. Urednica emisije: Dijana Stefanović-Srećković Rediteljka: Natalija Mićević.'
