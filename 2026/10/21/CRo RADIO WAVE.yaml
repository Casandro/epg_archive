  description: Avengerky amerického popu spojily síly, hashtag girl power! Olivia Rodrigo oslovila do duetu Chappel Roan, kterou Charli xcx přizvala na stage spolu s Adélou a Miley Cyrus zase dojatě vzpomínala na Dolly Parton. Lynč i obdiv sklidila topmodelka Barbara Palvin, která šla přehlídku ještě před koncem šestinedělí. A když už jsme u těch žen ve veřejném obraze, věděli jste, že Sydney Sweeney je příbuzná s Marilyn Monroe? Pusťte si Slejvák a zjistěte více podobných informací, se kterými možná vyhrajete i popkulturní kvíz.
