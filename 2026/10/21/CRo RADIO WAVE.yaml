  title: 'Ztělesnění 6: Self love'
  description: Do dalšího Flámu pozvání tentokrát přijali Tereza.Pro a JohnyM. Pár, který kolem sebe už roky tmelí pražskou bassovou scénu a stojí za sérií SWITCH, si pro nás chystá b2b set ze samého jádra UK soundu, jež se bude motat okolo grimeu, dubstepu a všeho "bass-related" ve vodách 140 BPM. V posledních letech jste o nich mohli slyšet také ve spojení s eventem X-RAY, s nímž prezentovali legendární jména z jádra grimeové scény jako Slimzee nebo Manga Saint Hilaire. Laďte Flám už tuto středu od 20:00.
