  subtitle: Een Oogje op Brabant - Route C - Op Oorlogspad S06 E166. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'Een Oogje op Brabant is deze keer in Helmond. Oude filmbeelden van de stad komen voorbij. Deze keer in het cultuurmagazine Route C: kunstenaar Sandra Westgeest. Toen Sandra voor het eerst een schaar kreeg, liet ze hem nooit meer los. Met een zee aan insecten, bloemen en dieren tot gevolg; van blik of van papier. In Op Oorlogspad nemen Hans Sakkers en Klaas van de Ketterij de kijker mee op reis. Van Baarland naar Veere: de opmars van de Schotse troepen was een cruciaal hoofdstuk in de bevrijding van Zuid-Beveland en Walcheren. (2026)'
