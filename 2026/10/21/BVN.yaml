  subtitle: 'Follow Up: Familie Mensing S27 E10. Jean Paul (39) en Rosalie (39) beginnen aan een nieuw hoofdstuk op Bonaire. Ze laten hun B&B in Italië achter zich en starten op het eiland een Italiaanse foodtruck.'
  description: Een follow-up bij de familie Mensing. Jean Paul (39) en Rosalie (39) laten samen met hun kinderen Dylan (15) en Isabelle (9) hun goedlopende B&B in Italië achter zich. Het gezin kiest voor een nieuw leven op Bonaire, waar ze opnieuw beginnen met een Italiaanse foodtruck. De truck wordt vanuit Nederland verscheept, maar al snel blijkt dat hun nieuwe avontuur vooral draait om wachten, regelen en improviseren. Terwijl Rosalie en Jean Paul de foodtruck klaarmaken voor de eerste opening, loopt de spanning thuis op. Lukt het ze om de foodtruck op tijd draaiende te krijgen? (2026)
