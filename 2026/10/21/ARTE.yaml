  title: Interstellar
  subtitle: Un scénario captivant et des personnages fouillés pour un grand moment d'aventure et de réflexion sur l'avenir de la planète. Les effets spéciaux, jamais gratuits, sont réussis.
  ageRating: 12
  genre:
  - '19'
  description: 'La Terre se meurt. Tandis que les cultures dépérissent et que les tempêtes de poussière se multiplient, Joseph Cooper, ancien pilote de la Nasa reconverti en cultivateur, tente tant bien que mal de faire pousser son maïs. En suivant un jour un drone incontrôlable pour essayer de récupérer ses composants, il tombe sur la base secrète qui abrite le projet de la dernière chance de l''Agence spatiale américaine. Dans l''espoir de conjurer le sort funeste qui attend l''humanité, les scientifiques planchent sur l''envoi d''astronautes à des milliers d''années-lumière de la Terre pour étudier l''habitabilité de trois planètes susceptibles d''accueillir la vie. Souffle épique Bientôt quinze ans après sa sortie, tout est devenu culte dans Interstellar : le calvaire de Matthew McConaughey perdu aux confins des galaxies, en larmes dans son cockpit face aux vidéos de sa fille Murphy qui grandit sans lui, le poème de Dylan Thomas comme un mantra face à l''obscurité grandissante ("N''entre pas sans violence dans cette bonne nuit [.] Rager, s''enrager contre la mort de la lumière"), les champs de maïs brûlés et les tempêtes de poussière, l''orgue pharaonique de la bande originale de Hans Zimmer, et l''amour, qui dans le cerveau de Christopher Nolan devient une dimension palpable. et malléable. En dramatisant le mythe de l''Amérique des pionniers (l''exploration comme seule planche de salut pour une humanité au bord de l''extinction), le réalisateur qui a réconcilié le cinéma d''auteur et les superproductions hollywoodiennes orchestre une expérience visuelle et dramatique au souffle épique. Du grand et beau spectacle. Réalisateur: Christopher Nolan. Des acteurs: Matthew McConaughey (Cooper), Anne Hathaway (Amelia Brand), Jessica Chastain (Murph), Ellen Burstyn (Murph âgée), Michael Caine (le professeur Brand) (2014)'
