  title: Alerte aux méduses
  subtitle: Pas moins de soixante espèces de méduses ont envahi les littoraux français. Dans les laboratoires, des scientifiques tirent parti de ce phénomène.
  genre:
  - '146'
  description: 'Apparues il y a près de 650 millions d''années, les méduses ont colonisé les océans bien avant les premiers poissons et survécu aux cinq grandes extinctions de masse. Championnes de l''adaptabilité, pas moins de soixante espèces de méduses ont envahi les littoraux français, et terrorisent désormais les nageurs. Leur prolifération est permise par le réchauffement et la pollution des mers, ainsi que la disparition de leurs prédateurs naturels à cause de la surpêche : des facteurs qui garantissent un avenir prospère à ces animaux mystérieux. Leur surabondance au bord des côtes sonne alors comme un signal d''alarme écologique. Mais, dans les laboratoires, des scientifiques tirent parti de ce phénomène. Dans l''industrie pharmaceutique, les méduses sont utilisées pour leur collagène, utilisable pour les soins des grands brûlés, et, en biotechnologie, leurs protéines bioluminescentes laissent imaginer de nouvelles sources de lumière. (2026)'
- eventId: 964851
  start: 2026-10-21T11:02:39Z
  stop: 2026-10-21T11:35:00Z
  title: ARTE Regards - Alerte aux méduses
  description: |-
    Reportage (France, 2026, 31mn) Elles sont les mal-aimées de l'été, les indésirables de nos plages, les cauchemars des baigneurs : les méduses. À la rencontre des estivants qui doivent adapter leurs activités et des scientifiques qui essaient de valoriser la présence des méduses plutôt que de la subir, ce reportage interroge la transformation de notre cauchemar estival en richesse insoupçonnée.
