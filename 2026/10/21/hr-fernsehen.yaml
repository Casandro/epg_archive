  description: |-
    Im Rhein-Main-Gebiet gestaltet Katja Eulenbach, Landschaftsarchitektin aus Wiesbaden, exklusive Luxusgärten für wohlhabende Kundschaft.
    Jürgen Kirchner zählt zu Deutschlands bekanntesten Gestaltern für japanische Gärten. Seine kunstvollen Wasserlandschaften mit Koi-Teichen, Bonsai-Bäumen und tonnenschweren Findlingen aus dem Taunus sind wahre Gesamtkunstwerke und kosten mitunter mehrere Millionen Euro.
