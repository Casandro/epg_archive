  description: 'Es ist ganz schön eng im Otter-Gehege! Neun südamerikanische Riesenotter tummeln sich hier inzwischen: Beni, Mako und ihre siebenköpfige Kinderschar. Und da Otter nicht nur laut, sondern auch sehr temperamentvoll sind, hat das Mobiliar inzwischen kräftig gelitten. Uwe Fischer macht sich mit dem Gärtnerteam vom Tierpark Hagenbeck an die Grundsanierung. Die Elefanten tragen inzwischen wegen ihrer vielen Sandduschen Tarnfarben und heben sich kaum noch vom Hintergrund ab. Michael Schmidt lässt Wasser in den Badeteich. Unter den Dickhäutern gibt es jedoch nur eine echte Wasserratte.'
