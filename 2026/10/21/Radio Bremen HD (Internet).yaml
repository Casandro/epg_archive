  title: Tierärztin Dr. Mertens (93)
  subtitle: Unter Druck
  description: Die Zusammenarbeit von Susanne Mertens und der Cheftierärztin wird immer besser. Sie respektieren einander und schätzen die jeweiligen Kompetenzen der anderen. Nach der anspruchsvollen Operation am Schneeleoparden gibt es sogar einen freundschaftlichen Moment zwischen den beiden Frauen. Das plötzliche Auftauchen von Mike Redmann auf der Baustelle ihres Hauses irritiert Susanne zutiefst. Sie hat Schuldgefühle ihrem verstorbenen Mann Christoph gegenüber und ist mit der Situation und ihren Gefühlen zu Mike komplett überfordert. Sie verhält sich extrem distanziert. Als er sie um ein klärendes Gespräch bittet, lehnt sie ab ...
- eventId: 977700
  start: 2026-10-21T20:50:00Z
  stop: 2026-10-21T21:35:00Z
  title: Tierärztin Dr. Mertens (94)
  subtitle: Der Sturz
  description: "Susanne Mertens wird von ihren Kindern mit dem Vorwurf konfrontiert, dass sie sich in der Trauerphase zu sehr mit sich selbst beschäftigt hat. Während ihr Sohn Jonas nach dem Streit wieder auf Susanne zukommt, fühlt sich ihre Tochter Luisa nach wie vor von der Mutter alleingelassen und meidet sie. \nNach einem Notfall auf Mike Redmanns Farm lenkt Susanne sich mit einem Ausritt ab. Verletzt und wütend reitet sie auf der Stute Caramel davon - und stürzt schwer. \nIm Zoo wächst mittlerweile der Druck auf Dr. Elif Sahin, die versucht, ihrem Chef, Zoodirektor Jasper Winter, weitere Erfolge zu präsentieren."
