- eventId: 963268
  start: 2026-10-21T03:15:00Z
  stop: 2026-10-21T04:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Johanna Wokalek, Schauspielerin'
  description: Johanna Wokalek fesselt das TV-Publikum als Ermittlerin Cris Blohm im Münchner "Polizeiruf 110", brilliert seit Jahren auf der Theaterbühne und auch im Kinofilm. Aufgewachsen  im Schwarzwald studiert Wokalek nach dem Abitur in Wien am Max Reinhardt Seminar und startet danach ihre Theaterkarriere in Bonn. Schnell etabliert sie sich auch als Filmschauspielerin. Jetzt ist die 51-Jährige in der Adaption des Elfriede Jelinek-Romans "Die Liebhaberinnen" im Kino zu sehen. Auf dem Roten Sofa spricht sie mit Inka Schneider über ihre Rolle und das heutige Frauenbild.
- eventId: 963898
  start: 2026-10-21T04:00:00Z
  stop: 2026-10-21T04:20:00Z
  title: Sesamstraße
  description: 'Eine Vogelfamilie hat ein Problem: Sie bekommt ein Klavier nicht in ihr Nest hinein. Ein Fall für Supergrobi 2.0! Hundegebell von draußen weckt Ernie in der Nacht aus dem Schlaf. Das Gebell erinnert Ernie an ein Lied, das er dann zu singen beginnt; sehr zu Berts Leidwesen, denn der möchte einfach nur schlafen. Der Kekser klaut den Beißkeks eines Babys. Krümelmonster und die "Cleveren Kekse" müssen ihr Bestes geben, um dem Baby seinen Beißkeks wieder zurückzubringen.'
