  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Johanna Wokalek, Schauspielerin'
  description: Johanna Wokalek fesselt das TV-Publikum als Ermittlerin Cris Blohm im Münchner "Polizeiruf 110", brilliert seit Jahren auf der Theaterbühne und auch im Kinofilm. Aufgewachsen  im Schwarzwald studiert Wokalek nach dem Abitur in Wien am Max Reinhardt Seminar und startet danach ihre Theaterkarriere in Bonn. Schnell etabliert sie sich auch als Filmschauspielerin. Jetzt ist die 51-Jährige in der Adaption des Elfriede Jelinek-Romans "Die Liebhaberinnen" im Kino zu sehen. Auf dem Roten Sofa spricht sie mit Inka Schneider über ihre Rolle und das heutige Frauenbild.
- eventId: 963898
