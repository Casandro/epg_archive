  title: Sesamstraße
  description: 'Eine Vogelfamilie hat ein Problem: Sie bekommt ein Klavier nicht in ihr Nest hinein. Ein Fall für Supergrobi 2.0! Hundegebell von draußen weckt Ernie in der Nacht aus dem Schlaf. Das Gebell erinnert Ernie an ein Lied, das er dann zu singen beginnt; sehr zu Berts Leidwesen, denn der möchte einfach nur schlafen. Der Kekser klaut den Beißkeks eines Babys. Krümelmonster und die "Cleveren Kekse" müssen ihr Bestes geben, um dem Baby seinen Beißkeks wieder zurückzubringen.'
