  title: Bibel TV Das Gespräch
  subtitle: 'Bernd Hock: Immer im Rampenlicht'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Bernd Hock ist ein Tausendsassa - trotz anscheinend widriger Startbedingungen. Geboren mit verkürzten Armen und deformierten Händen schien seine Zukunft vorgezeichnet. Doch nicht nur seine Eltern und Lehrer erkannten es schon früh: Bernd Hock ist durch und durch Entertainer. Und so erzählt er auch - von seiner Behinderung, seinem Weg mit Gott und seiner Theorie, dass eigentlich jeder Mensch eine Behinderung hat. Im Gespräch mit Moderator Daniel Deman streift er außerdem seine verschiedenen Berufe: Puppenspieler, Pädagoge und Kabarettist. Warum Bernd Hock kein Problem damit hat, als "Behinderter" bezeichnet zu werden, verrät er hier.'
  genre:
  - '51'
  widescreen: true
  hd: true
