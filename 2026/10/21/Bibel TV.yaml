  title: Superfromm
  subtitle: Mein Kind ist trans(3/3)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Was machst du, wenn dein Kind vor dir steht und sagt: "Ich bin im falschen Körper"? Für Grace ist das kein theoretisches Thema, sondern Realität. Ihre erste Reaktion: Ablehnung. Worte, die sie später bereut. Doch schnell wird klar - ihr Kind leidet. Grace steht vor einer der schwersten Fragen überhaupt: Wie reagiert man als Mutter? Wie geht man damit um, ohne das eigene Kind zu verlieren? Sie erzählt von einem Weg voller Spannungen - zwischen Liebe und Schmerz, zwischen eigenen Überzeugungen und dem Wunsch, ihr Kind nicht allein zu lassen. Teil 3 von 3.'
