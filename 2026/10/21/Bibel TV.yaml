  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gott spricht auch heute noch zu uns Menschen - davon sind viele Christen überzeugt. Manche sagen, dass Gott durch die Bibel zu ihnen spricht. Andere empfinden es als göttliches Reden, wenn äußere Umstände sich ändern. Und Dritte hören eine akustische Stimme, die sie Gott zuordnen. Todd, Mauricio und Martha haben so etwas erlebt. Sie berichten von ihrer persönlichen Begegnung mit Gott. (Moderation: Sabine Bhandari / Andreas Waldmann)'
