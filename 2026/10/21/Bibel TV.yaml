  title: Ein Hauch von Himmel
  subtitle: Der traurige Clown
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Monica, Tess und Andrew gehen zum Zirkus. Denn hier erwartet sie ihr nächster Auftrag. Der Junge Davy wünscht sich, ein normales Leben zu führen. Sein Vater, der kleinwüchsige Clown Leroy, möchte ihn aufgrund seiner eigenen Erfahrungen aber nur ungern in die Welt außerhalb des Zirkus hinauslassen. Als Davy schließlich doch in die örtliche Schule gehen darf, gerät er in große Gewissenskonflikte. Wie soll er sich verhalten? Es scheint, nur wenn er seinen Vater verheimlicht, kann er neue Freunde finden. Aber ist das wirklich so? Monica, Tess und Andrew haben einiges zu tun, Vater und Sohn in dieser schwierigen Zeit beizustehen.'
