  title: Don Matteo
  subtitle: Capitano unter Mordverdacht
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Antonio Simeoni, der Mörder von Capitano Anceschis Vater, wird aus dem Gefängnis entlassen. Er wurde seinerzeit zwar für den Mord verurteilt, hat aber die Hintermänner nie verraten. Nun aber sind es genau diese Hintermänner, die Simeoni noch am Tag der Haftentlassung eliminieren. Dabei hinterlassen sie eine ganze Reihe falscher Beweise, sodass der Verdacht auf Capitano Anceschi fällt. Er wird vom Dienst suspendiert. Nun liegt es an Don Matteo und Maresciallo Cecchini, die wahren Täter zu finden.'
