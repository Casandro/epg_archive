  title: Die besten Köche der Welt - Zu Gast im Ikarus - Jannis Brevet
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jannis Brevet
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Jannis Brevet verarbeitet mit Leidenschaft erlesene Produkte aus der Nordsee: Oosterschelde-Krebs, Austern, Muscheln und Seebarsch sind Fixpunkte auf der Menükarte. Dazu kommt das Feinste, was das Land zu bieten hat, so zum Beispiel Milchlamm, Queller und Meerlavendel. Einzigartig sind seine Interpretationen der Culinary Arts. Brevet ist ein Verehrer des Modernismus der 1950er-Jahre: Ich orientiere mich nicht an Gemälden, aber sie inspirieren und beeinflussen mich mit ihren Farben, Schattierungen und Strukturen beim Arrangieren meiner Kreationen. Diese Faszination ist auch in jedem seiner Gerichte, die er im Manoir Restaurant Inter Scaldes zubereitet, zu schmecken: Bei Brevet steuert jede einzelne Zutat einen wesentlichen Teil zum großen Ganzen bei. Das Ziel ist die totale Explosion von Geschmack und Aroma. AT 2013'
