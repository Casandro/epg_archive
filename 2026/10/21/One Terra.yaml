  title: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  subtitle: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  description: 'Planet Weltweit: Viele Menschen am Amazonas leben in schwer zugänglichen Gebieten, abseits großer Städte ohne jede Infrastruktur und ohne Zugang zu Behörden und Ämtern. Für Recht und Ordnung sorgt ein schwimmendes Gerichtsschiff, welches sechsmal pro Jahr die Flussarme des Amazonas befährt und Streitfälle in den Gemeinden schlichtet. An Bord sind neben einer Richterin und einem Staatsanwalt mehrere Sozialarbeiter. Fast siebzig Mitarbeiter teilen sich während dieser Zeit die wenigen Waschbecken und Hängematten. Eine logistische Herausforderung. Sorgerechtsstreitereien, Unterhaltsforderungen oder kleinere Diebstähle - all das, was in größeren Städten zur täglichen Routine von Gerichten und Ämtern gehört, stellt an den Flussufern des Amazonas eine besondere Herausforderung dar. Denn oft liegen die kleinen Dörfer und Gemeinden an unzugänglichen Uferstellen, an denen nur Schiffe anlanden können. Feste Wege oder gar Straßen gibt es nicht.  Dennoch unterstehen auch jene Ortschaften der brasilianischen Gerichtsbarkeit, und die Menschen haben ein Recht auf Unterstützung bei Amtsfragen und Streitfällen. Sechsmal im Jahr fährt deshalb das Gerichtschiff Joao Bruno für jeweils eine Woche die Regionen ab, um den Menschen in jenen abgelegenen Orten diese Serviceleistung des Staates anzubieten. Höchste Instanz dabei ist eine amtliche Richterin oder ein Richter. Diesmal ist es Laura Costeira. Der 42jährigen ist es ein Anliegen, ihre Dienste den Menschen auch abseits der Städte nahezubringen. Einfach wird die Reise nicht: An Bord gibt es für die insgesamt 70köpfige Reisegemeinschaft gerade einmal vier Waschmöglichkeiten. Die meisten Passagiere schlafen in Hängematten. Eine einzige Köchin ist für die Verpflegung der Mannschaft zuständig. Und dennoch hat sich das Projekt zu einem Erfolgsmodell entwickelt, bei der Mannschaft und den Menschen am Amazonas. So soll es auch diesmal sein. DE 2022'
