  title: Planet Weltweit - Modelsuche in Sibirien
  subtitle: Planet Weltweit - Modelsuche in Sibirien
  description: Einmal im Jahr machen sich Modelscouts der Agentur "Noah Models" von Sankt Petersburg aus auf nach Sibirien. Dort gibt es nicht nur Mädchen mit perfekten Maßen, sondern mit Gesichtern, so einzigartig und ungewöhnlich, dass sie auf dem internationalen Modemarkt äußerst begehrt und erfolgreich sind. Für die meisten dieser Sibirischen Mädchen ist es die einzige Chance, Geld im Westen zu verdienen und dabei die Welt zu sehen. In der Modebranche sind sie zum Label geworden ' Mädchen aus Sibirien. Zart, mitunter elfengleich, geben sie mit ihren exotischen Gesichtern den Look auf Hochglanzmagazinen und Laufstegen vor. Mädchenhafte Unschuld gepaart mit Sinnlichkeit - perfekte Projektionsflächen der Modeindustrie. Einigen wenigen sibirischen Mädchen hat das Wohlstand und Unabhängigkeit gebracht. Die Reportage begleitet junge Mädchen auf dem Weg von ihren Dörfer auf den Laufsteg und erkundet dabei das Geschäft, das sie im Rampenlicht strahlen lässt. Er erzählt vom Alltag der Mädchen in ihrer sibirischen Heimat, ihren Sehnsüchten fernab davon und fragt, ob die Träume dieser Mädchen, werden sie tatsächlich wahr, sie am Ende glücklich machen. Anna Juschakowa, Modelscout aus Sankt Petersburg und die Fotografin Valeria Kritsova sind seit acht Tagen mit der Transsibirischen Eisenbahn unterwegs. Doch statt Brot, Wurst, Käse oder Wodka, wie die anderen Reisenden, haben sie ihre Laptops auf den Knien, die Ausbeute Ihrer Tour. Mehr als 150 Mädchen haben sie in den Dörfern und Kleinstädten gesichtet, fotografiert oder auf Videos festgehalten. Die 16-jährige Anja hat ihr erstes Casting hinter sich gebracht. Hier, am Ufer des riesigen Jenissei ist sie zu Hause. Während sie Steine auf dem Wasser hüpfen lässt, wehen ihre langen braunen Haare und nur manchmal lugt das dicke Pflaster unter ihrem linken Auge hervor. DE 2012
