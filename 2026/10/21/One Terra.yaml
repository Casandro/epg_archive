  title: 'Planet Weltweit - Mit Tempo und Leidenschaft: Argentiniens Polo-Spielerinnen'
  subtitle: 'Planet Weltweit - Mit Tempo und Leidenschaft: Argentiniens Polo-Spielerinnen'
  description: 'Planet Weltweit: Argentinien, das Land der Pferde. Und auch Land des Polospiels, eines traditionell männlich dominierten Sports. Einmal im Jahr findet in Buenos Aires das weltberühmte "Abierto de Palermo" statt, das bedeutendste internationale Turnier. Längst haben sich auch Frauen das Terrain erobert - mit beeindruckender Geschwindigkeit.  Clarita Cassino ist eine der argentinischen Spitzenspielerinnen. Schafft sie es mit ihrem Team erneut ins Finale? Die Welt des Polo-Sports ist vor allem eine Welt der Pferde, eine ganze Batterie von Spezialisten im Hintergrund macht das Spiel erst möglich: Tierärzte, Pferdepfleger, Trainer, Hufschmiede, Stiefelmacher und viele andere. Sie alle vereint die bedingungslose Leidenschaft für Pferde und diesen Sport. Es ist beeindruckend zu sehen, wie ein klischeebehafteter, seit über einem Jahrhundert männerdominierter Sport sich verändert. Frauen haben die Sportart für sich erobert und sind darin sehr erfolgreich. Clarita Cassino ist eine der Top-Spielerinnen Argentiniens, ein Leben ohne Pferde ist für sie undenkbar: "Polospielen bedeutet mir alles. Ich betreibe den Sport, seitdem ich klein bin.  Nur darum stehe ich jeden Tag auf und versuche, noch etwas besser zu sein." Überhaupt findet man in der Szene inzwischen viele starke und pferdebegeisterte Frauen, wie zum Beispiel auch Silvina Casadedio. Sie züchtet auf ihrer Ranch Rinder und arbeitet als Pferdezähmerin. Dafür hat sie viel aufgegeben, im Alter von 24 Jahren entschied sie sich, allein zu leben, baute ein Haus und lebt seither ihren Traum: Sie widmet ihre ganze Zeit den Pferden. DE 2022'
