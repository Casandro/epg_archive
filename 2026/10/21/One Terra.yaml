  title: Planet Weltweit - Die Bogenschützin von Bhutan
  subtitle: Planet Weltweit - Die Bogenschützin von Bhutan
  description: 'Im Königreich Bhutan ist Bogenschießen eine traditionelle Männerdomäne. Umso erstaunlicher, dass es ausgerechnet eine junge Frau bis an die Weltspitze schaffen könnte: Tshering Choden gilt als talentierteste Schützin des Landes. Wenn sie ihr Können in einem Ausscheid vor dem Olympischen Komitee beweist, darf sie im Sommer zu den Spielen fahren - und aus dem isolierten Bergstaat im Himalaya ins internationale Rampenlicht treten.  Jedes Dorf in Bhutan hat seinen Schützenkönig, fast jeder männliche Bewohner des Landes praktiziert die Kunst mit Pfeil und Bogen - ein Relikt aus der kriegerischen Vergangenheit des buddhistischen Bergvolkes. Die Spannkraft eines Bogens kann bis zu 30 Kilogramm betragen, 145 Meter sind die Zielscheiben entfernt. Bei einem traditionellen Wettkampf treten jeweils zwei Dörfer gegeneinander an. Frauen dienen den männlichen Kontrahenten dabei lediglich zum Anfeuern. So ist es auch heute noch in Radhi, einen kleinen Dorf tief in den Bergen Bhutans, dicht an der chinesischen Grenze. Mit einer Ausnahme: der 25-jährigen Tshering Choden, die hier herkommt und für Olympia trainiert. Doch als Frau ist sie vom traditionellen Kräftemessen ausgeschlossen - und das, obwohl sie sich darauf vorbereitet, ihr Land vor der ganzen Welt zu präsentieren. Ihre Chancen stehen gut, denn Tshering Choden gilt als Virtuosin mit Pfeil und Bogen. Bhutan, das abgeschottete Land, so groß wie die Schweiz, umgeben von vergletscherten Siebentausendern, hat sich erst in den letzten Jahren der Außenwelt geöffnet. Noch 1960 war ein fünftägiger Fußmarsch nötig, um nach Bhutan zu gelangen. Damals begann König Wangchuk mit seiner vorsichtigen Modernisierungspolitik. Bis heute bestimmen er und seine Minister, wie viel Außeneinfluss sein Volk verkraftet, ob es reif ist für Elektrizität, Fernsehen oder Tourismus. Industrialisierung wird nur geduldet, wenn sie nicht gegen die hohen Umweltstandards verstößt. DE 2004'
