  title: Planet Weltweit - Die letzten Kamelkarawanen der Sahara
  subtitle: Planet Weltweit - Die letzten Kamelkarawanen der Sahara
  description: 'Bereits zu Zeiten der Pharaonen zogen sie durch die Sandwüste zwischen dem heutigen Sudan und Ägypten: Kamel-Karawanen, beladen mit Elfenbein, Salz, Straußenfedern und anderen Kostbarkeiten. Bis heute folgen die Beduinenstämme in der Sahara diesen uralten Handelsrouten, nur sind inzwischen die Kamele selbst die Ware, die nach Ägypten verkauft wird. Einer der wichtigsten und gleichzeitig gefährlichsten Pfade führt von Kordufan und Darfur nach Süd-Ägypten. Es ist der Darb al-Arba''in - "Der Weg der 40 Tage". Nur erfahrene Karawanenführer trauen sich diesen Marsch zu.  Der alte Beduine Nuri Gomaa hat sich eigentlich schon lange aus dem Karawanen-Geschäft zurückgezogen. Jahrzehntelang war er einer der gefragtesten Treckführer zwischen Darfur und Assuan in Süd-Ägypten. Er liebt die Weite und Schönheit der Sahara, kennt die Gefahren der Wüste - und weiß, wo die überlebenswichtigen Wasserstellen liegen. Nuris Stamm der Besharis lebt schon seit über 1000 Jahren in einem Gebiet, das sich vom Roten Meer über den Nord-Sudan bis nach Oberägypten erstreckt. Wie ihre Vorfahren züchten die Beduinen auch heute noch Kamele und sind gefragte Führer der großen Karawanen. Schätzungsweise 3 Millionen Kamele gibt es allein im Sudan und über 200.000 Tiere werden pro Jahr nach Ägypten verkauft. Zwar werden viele Herden inzwischen auch per LKW über moderne asphaltierte Straßen transportiert, noch immer aber gibt es auch die alten Wüsten-Wege. Einen der gefährlichsten will der Bediune Nuri nun noch ein letztes Mal wagen, als zweiter Karawanenführer und zuständig für eine Herde mit 100 Kamelen. Der Weg führt durch die westlichen Ausläufer der Bayuda-Wüste in Richtung Norden bis zum Ufer des Nils. Planet Weltweit begleitet die Karawane quer durch die Sahara. So sehr Nuri die Wüste auch liebt, ist die Reise für ihn doch eine harte Bewährungsprobe. Wie wird er die Strapazen verkraften? DE 2009'
