  title: Planet Weltweit - Venezuela - Die alte Frau und das Meer
  subtitle: Planet Weltweit - Venezuela - Die alte Frau und das Meer
  description: 'In El Morro, an der Nordostküste Venezuelas, leben die Menschen seit Jahrtausenden von der Sardinenfischerei. "Wenn es keinen Fisch gibt, sind wir erledigt, es gibt kaum andere Arbeit", sagt die 78-jährige Luisa Vargas. Sieben Kinder hat sie mit Sardinen großgezogen, und auch die Familien ihrer 52 Enkel leben vom Meer. Doch in den letzten Jahren haben die Erträge massiv abgenommen, die Überlebensbedingungen sind härter geworden. Seit acht Monaten werden die Sardinen in El Morro sogar komplett vermisst - mit jedem Tag ohne großen Fang spitzt sich die Lage zu. Die Reportage begleitet Luisa Vargas und ihre Familie bei ihrem täglichen Ringen mit der Natur.  Wenn es Sardinen gibt, arbeitet Luisa Vargas trotz ihrer 78 Jahre Tag und Nacht ohne Pause: Sie hilft beim Ausladen der Boote, Ausnehmen der Sardinen oder dem Weitertransport in die Fabrik von El Morro. Doch im Moment kann sie nur, ab und zu beim Tragen einer Kiste Fisch anpacken. Lediglich kleine Haie, Makrelen oder Anchovis gehen den Fischern bei ihren Fangzügen vor der venezolanischen Küste ins Netz. Doch die bringen auf den lokalen Märkten nur das Nötigste zum Überleben ein - im Gegensatz zu den Sardinen, die für den Export bestimmt sind. Solange keine Sardinen in der Nähe von El Morro auftauchen, müssen die Männer des Dorfes weit hinaus aufs Meer ziehen - teilweise sogar in die Nachbarländer Surinam oder Guyana. Wochenlang sind sie dann von ihren Familien getrennt. Und leben immer mit der Gefahr verhaftet zu werden, weil sie illegal in fremden Hoheitsgewässern fischen. Während der Abwesenheit ihrer Männer versuchen die Frauen, ein wenig Geld zu verdienen: Luisas Enkelin Naile vermietet ihre Waschmaschine an die Nachbarinnen, zusammen mit zwei ihrer Schwestern teilt sie sich einen Job in einer Suppenküche. Naile sieht immer weniger Zukunft in der Sardinenfischerei, und auch ihre Kinder wollen lieber Ärzte, Lehrer oder Anwälte werden, statt sich auf die Launen der Natur zu verlassen. DE 2007'
