  stop: 2026-10-21T10:02:00Z
  title: Planet Weltweit - Peru, das Goldhaar der Vikunjas
  subtitle: Planet Weltweit - Peru, das Goldhaar der Vikunjas
  description: In den peruanischen Anden leben die Vikunjas, Verwandte der Lamas. Lange wurden die zarten Tiere gejagt und dabei fast ausgerottet. Heute werden sie geschützt und nur für die Schur eingefangen. Denn ihre Wolle ist einzigartig, warm und leicht und wertvoll wie Gold. Im Dorf Lucanas haben die Menschen deshalb begonnen, den Vertrieb der Wolle selbst in die Hand zu nehmen. GEO Reportage hat das Dorf besucht. Geschützt von ihrer dichten Wolle, vertragen Vikunjas selbst große Kälte von bis zu minus zehn Grad in der Nacht. Und die ist in ihrer Heimat, den Anden, zwischen 3.500 und 5.500 Metern Höhe nicht selten. Bereits unter der Herrschaft der Inka wurden die Vikunjas wegen ihrer Wolle und des Fleisches gejagt. Nach der spanischen Eroberung und lange darüber hinaus wurden sie abgeschlachtet, so dass sie bis Mitte der 1960er Jahre fast ausgestorben waren. Die Länder, in denen die Tiere lebten, unterzeichneten eine Naturschutzkonvention zu ihrem Erhalt. Heute gibt es wieder zehntausende Tiere, die meisten davon in Peru. Hier leben sie frei und werden nur zur Schur eingefangen. Ihre feine Wolle ist wertvoller als Kaschmir und begehrtes Luxusprodukt westlicher Edel-Designer. Bis heute boomt das Geschäft. Neu ist, dass sich die Bauern des Hochlands inzwischen daran beteiligen. Sie wussten schon immer, wie man die Tiere fängt, aber findige Geschäftemacher und Wilderer machten ihnen stets den Gewinn streitig. Die Bauern des Dorfes Lucanas haben nun eine Kooperative gegründet, die direkt mit den Abnehmern verhandelt. Ein voller Erfolg und Ansporn für die Bauern, möglichst viel Wolle zu erwirtschaften. So auch beim demnächst geplanten Chakku, einer Hatz, an der das ganze Dorf teilnimmt und bei der durch ein kilometerlanges Seil mehrere hundert Tiere zusammengetrieben werden sollen.  DE 2018
- eventId: 890158
