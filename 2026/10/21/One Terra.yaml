  title: Planet Weltweit - Der fröhliche Friedhof von Rumänien
  subtitle: Planet Weltweit - Der fröhliche Friedhof von Rumänien
  description: 'Die Bewohner des Dorfes Sâpânta in der rumänischen Region Maramures sind stolz auf ihre Besonderheit: den Fröhlichen Friedhof. Seit einigen Jahrzehnten schmücken sie ihre Familiengräber mit geschnitzten Kreuzen, auf denen die Lebensgeschichte der Verstorbenen in bunten Bildern nacherzählt wird - im Guten wie im Bösen.. Ein Brauch, der bis heute von dem Schnitzer Dumitru Pop aufrecht erhalten wird. Jedes Kreuz ist ein Kunstwerk und der Friedhof Dank ihm kein Ort der Trauer. In Rumänien gibt es einen Ort, an dem anders mit dem Tod umgegangen wird als man es landläufig kennt: D die Angehörigen aus Sâpânta sparen oft Jahre, bis sie ein von Dumitru Pop handgefertigtes Holzkreuz, reich und bunt verziert mit Bildern und der jeweiligen Lebensgeschichte des Toten, in Auftrag geben können. Und so wirkt der Friedhof von Sâpânta wie das Tor zum Paradies: Eine Zeichnung, eine Grabschrift, Symbole und Farben erzählen das Wesentliche aus dem Leben des Toten. 800 Kreuze sind die Seiten eines offenen Buches über ein kleines orthodoxes Dorf. Wir haben das Dorf und seinen Fröhlichen Friedhof besucht und viel über das Leben erfahren. Ostern steht vor der Tür. Im Dorf wird geputzt, gestrichen, und auch in der Werkstatt von Dumitru Pop steht ein fast fertiges, leuchtend blaues Holzkreuz, reich verziert mit Bildern und Symbolen. Es ist das Kreuz der 85-jährigen Anoutza, sie hat es selbst bei Dumitru Pop in Auftrag gegeben. Und sie ist gespannt darauf, wie der Schnitzkünstler sie auf dem Kreuz dargestellt hat, wie viel von ihrer Lebensgeschichte festgehalten wurde. Viel Trauriges hat sie erlebt, doch Angst vor dem Tod hat sie keine. "Ich bin bereit", lächelt sie - und füttert vergnügt ihre Hühner. "Das Leben ist nicht nur fröhlich oder nur traurig. Es besteht aus Freude und Traurigkeit. Deswegen ist jedes Kreuz mit seinen Symbolen anders und erzählt das Leben von demjenigen, der gestorben ist... und manchmal machen wir uns auch über den Tod lustig", sagt Dumitru Pop. DE 2013'
