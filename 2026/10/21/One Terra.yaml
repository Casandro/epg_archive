  title: Planet Weltweit - Der letzte Rheinfischer
  subtitle: Planet Weltweit - Der letzte Rheinfischer
  description: 'Der Rhein im Herzen Europas ist von jeher eine Lebensader für die Menschen in den durch ihn geprägten Landschaften. Im Elsass, zwischen Frankreich und Deutschland, fließt der alte Rhein. Einst ein wilder, unbändiger Strom, dessen Überschwemmungen viel Leid über die Region brachten, heute vielfach begradigt und kanalisiert. In seinem Herzen, dem alten Rhein, hat sich die Natur erholt. Viele Fische sind zurückgekehrt. Hier ist das Refugium des letzten, berufsmäßigen Rheinfischers des Elsass! Adrien Vonarb fischt seit 30 Jahren im Rhein, als einziger Berufsfischer im Elsass. Er kennt alle Geheimnisse dieses wilden Flusses. Mit einem einfachen Kahn fährt er jeden Morgen um 5 Uhr hinaus, um mit extra breitmaschigen Netzen Beute zu machen. Er entnimmt dem Fluss nur so viel, wie er braucht. Aus tiefem Respekt zur Natur und ihren Lebewesen fängt er nur jene Fische, die Gelegenheit hatten, sich zu vermehren. Es geht nicht nur um Geld, es geht um "leben und leben lassen". Der Rhein hat viel mitgemacht in den letzten Jahrzehnten: Überschwemmungen, Umweltkatastrophen und Wasserverschmutzung. Doch inzwischen bringt Adrien wieder Barben, Hechte, Welse und Schleien nach Hause: gesunde Fische aus sauberem Wasser. Adrien ist eins geworden mit dem Fluss und seinen Fischen. Eine tiefe Lebensphilosophie spricht aus allem, was sein Leben ausmacht: der Fischfang, die Weiterverarbeitung, die innige Partnerschaft mit seiner Frau, die seit 50 Jahren an seiner Seite ist. Viele Lehrlinge hat er gehabt, doch nur einer wird ihm jetzt nachfolgen: Jérémy Fuchs. Er ist nun bereit für ein Leben, wie Adrien es geführt hat. Bestimmt vom harten Alltag des Fischers, aber frei und unabhängig. DE 2020'
