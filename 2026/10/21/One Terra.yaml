  title: Planet Weltweit - Die verrückten Karren des Mister Winfield
  subtitle: Planet Weltweit - Die verrückten Karren des Mister Winfield
  description: |-
    Ein ungewöhnlicher Anblick mitten im Nichts der kalifornischen Mojave-Wüste: Am Zaun der Werkstatt  von Gene Winfield steht ein Oldtimer neben dem anderen. Sammler aus aller Welt lassen sich hier  ihre alten Cadillacs, Dodges und Mercuries aufmotzen. Gene Winfield, der legendäre Designer  zahlreicher Hollywood-Filmautos baut am liebsten Rennwagen. Mit diesen geht der 1927 geborene  Autonarr seit den 50ern bis heute an den Start. Wir besuchen Gene Winfield auf seinem Schrottplatz  in der Mojave-Wüste, fahren mit ihm zu Oldtimershows und begleiten ihn auf das berüchtigten El  Mirage Autorennen.

    Gene Winfields Grundstück wirkt wie ein bizarres Oldtimermuseum. Hier ein rostiger Cadillac, die  Windschutzscheibe zum Spinnennetz zerplatzt, dort ein Ford Pickup ohne Motorhaube. "Schatztruhe"  nennt er seinen Schrottplatz. In seiner Werkstatt kommen die Einzelteile zum Glänzen. Winfield ist  Spezialist für Custom Cars und Hot Rods, aufgemotzte und frisierte oder gar neu gebaute Oldtimer.  Im Kalifornien ohne TÜV ist alles möglich. Der berühmt-berüchtigte Winfield schraubte schon als  Jugendlicher die schnellsten Vehikel zusammen und holte sich einen Pokal nach dem anderen, ob bei  legalen oder illegalen Autorennen. Er ist einer der ganz Großen in der kalifornischen Custom-Car- Kultur, die nach wie vor lebendig ist. Showstar Jay Leno zeigt ihm seine berühmte Autosammlung,  die über 200 Oldtimer umfasst. "Gene ist der Held meiner Jugend", sagt er. "In der Schule sahen  wir uns heimlich Magazine mit Bildern seiner Hot Rods an." Dem agilen Winfield sieht man sein  Alter nicht an. Wenn er nicht zu Hause Autos zu wertvollen Sammlerstücken aufmotzt, fährt er um  die Welt, um die Wünsche seiner Kunden zu erfüllen. Er lässt keine Autoshow und kein Rennen aus.  In El Mirage, dem legendären ausgetrockneten Seebett, will er in diesem Jahr sogar mit zwei  Rennautos starten und seinen Geschwindigkeitsrekord von 325 Stundenkilometern brechen. DE 2010
  ageRating: 6
