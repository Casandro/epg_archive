  title: 'Planet Weltweit - Kourou: Palmen, Raketen, Gefängnisinseln'
  subtitle: 'Planet Weltweit - Kourou: Palmen, Raketen, Gefängnisinseln'
  description: 'Planet Weltweit: Mehr als hundert Jahre war das Überseegebiet Französisch-Guayana an der Küste Südamerikas ein Schreckensort für Gefangene. Die hier errichteten Zuchthäuser galten als die härtesten Frankreichs. Heute sind von ihnen nur noch Ruinen übrig, die aufwändig restauriert werden. Frankreich beginnt, dieses dunkle Kapitel seiner Geschichte aufzuarbeiten, nur ein paar Kilometer entfernt vom gigantischen Weltraumbahnhof Kourou. Vom Raumfahrtzentrum in Französisch-Guayana starten regelmäßig europäische Raketen und Satelliten ins All. Vor jedem Countdown müssen die vorgelagerten drei Inseln aus Sicherheitsgründen evakuiert werden. Sie wurden bis Mitte des 20. Jahrhunderts auch als Gefängnisinseln genutzt. Danach verfielen sie und wurden von der Natur zurückerobert. Heute wachsen darin Bäume und bedrohen die Standfestigkeit der Wände, Schlingpflanzen überwuchern das Gelände. Doch Frankreich hat mit der Vergangenheitsbewältigung begonnen, die Gebäude werden saniert, um dieses historische Erbe zu bewahren. Aurélie Schneider ist mit der Freilegung und Renovierung der Anlagen beauftragt. Mit Hilfe der Fremdenlegion sollen sie bald Besuchern offenstehen. Immer wieder jedoch müssen die Arbeiten unterbrochen werden. Raketen, die vom Weltraumbahnhof der Stadt Kourou abgeschossen werden, überfliegen die ehemaligen Gefängnisinseln. Aus Furcht vor herabfallenden Teilen müssen die Inseln bei jedem Start geräumt werden. Auch jetzt wieder, und zwar für eine besonders heikle Mission: das größte bisher gebaute Weltraumteleskop soll schon in wenigen Tagen von Kourou aus in den Orbit fliegen.  DE 2022'
