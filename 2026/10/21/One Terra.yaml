  title: Planet Weltweit - Die Polarbahn
  subtitle: Planet Weltweit - Die Polarbahn
  description: "Die Polarbahn auf der sibirischen Halbinsel Jamal bildet die Lebensader für die gigantische Erdgasförderstätte Bowanenko. Sie startet hinter dem Polarkreis und verläuft als nördlichste Eisenbahn der Welt über den 70. Breitengrad hinaus. Die 572 km lange Strecke muss um jeden Preis befahrbar bleiben, auch bei meterhohem Schnee und Temperaturen unter minus 50°C.\nDie Halbinsel Jamal liegt im Nordwesten Sibiriens und ragt weit in das Polarmeer hinein - eine karge Heimat für Nomaden und Rentiere. Seit 2011 durchqueren mehrmals pro Woche Züge der Polarbahnlinie die Ödnis der Tundra. Sie starten in der Station Obskaja und fahren 572 km über Permafrostböden und Moore immer weiter nach Norden bis zu den Erdgasfeldern von Bowanenko. Die Bahn ist Eigentum des russischen Energiekonzerns Gazprom, der über die Schienen Material und Mitarbeiter zur Gasförderstätte bringen lässt. Dafür dass die Züge stets verlässlich bei bis zu -60° C im Winter oder 30° C im Sommer rollen, sorgt ein enormer Aufwand an Technik - und der Einsatz des erfahrenen Streckenchefs Alexander Choroschailo. Die Reportage begleitet ihn und seine Kollegen auf dem Schneeräumzug hinter dem Polarkreis.\n\nDer 53-jährige Alexander Choroschailo ist Eisenbahningenieur und Herr über mehrere Schneeräumzüge auf der Jamal-Strecke der sibirischen Polarbahn. Die hochmodernen Züge wurden speziell für extreme Wetterbedingungen in der Arktis entwickelt. Sie sind vor allem im Winter pausenlos zwischen den Stationen im Einsatz. Mit riesigen Schaufelauslegern befreien Alexander Choroschailos Züge Gleise und Weichen von Schnee und Eis. Andere Spezialisten kontrollieren regelmäßig die Lage der Gleise auf dem Permafrostboden. Auch noch so starke Schneestürme und Temperaturschwankungen dürfen die Polarbahn nicht aufhalten, denn sie versorgt Tausende Menschen, die auf den Gasfeldern von Bowanenko arbeiten. Es ist ein permanenter Kampf zwischen Zivilisation und Natur. \n DE 2013"
