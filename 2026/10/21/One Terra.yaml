  title: Planet Weltweit - Palawan, Das Dorf der Gefangenen
  subtitle: Planet Weltweit - Palawan, Das Dorf der Gefangenen
  description: 'Palawan - ein Inselparadies der Philippinen. Doch hinter weißen Stränden, Korallenriffen und Palmen verbirgt sich seit über hundert Jahren eine grüne Hölle: die Iwahig-Strafkolonie. Auf dem 28.000 Hektar großen Areal im gebirgigen Inneren Palawans verbüßen Schwerverbrecher ihre Strafen. Viele der Männer sind mehrfache Mörder. Sie bleiben hier Jahrzehnte und wissen: Wer sich in Iwahig nicht an die Regeln hält, kommt in die feuchte, dunkle Zelle des Hochsicherheitstraktes. Lawrence Ponciano ist privilegiert. Der dreifache Mörder lebt seit 21 Jahren mit seiner Familie im sogenannten Freiheitsdorf der Strafkolonie. "Mein Vater ist ein liebevoller Mensch, und ich hatte hier eine glückliche, normale Kindheit", sagt Lawrence 16jährige Tochter Cathryn, die seit ihrer Geburt im Gefängnis lebt. Lebenslänglich hinter Gittern - das war das Urteil vor 19 Jahren, nachdem Rogelio Teves einen Verwandten mit der Machete getötet hatte. Es war eine Form von Notwehr, sagt er selbst. Bald nach dem Urteil zog seine Frau mit den drei Söhnen zu einem anderen. Rogelio verbringt sein Leben seitdem in Iwahig - einem besonderen Gefängnis, in dem die meisten Wächter selbst Häftlinge sind. Dichter Regenwald umgibt die Strafkolonie. Ein natürlicher Schutzwall, der Mauer und Zäune überflüssig macht. Wer von hier fliehen will, kann allein kaum überleben. Zum Gefängnis wurde die tropische Idylle Ende des 19. Jahrhundert, als die spanischen Kolonialherren politische Aufständische nach Iwahig verbannten. Doch erst 1904, zur Zeit der amerikanischen Besatzung, gründete das US-Militär hier eine Strafkolonie für Unabhängigkeitskämpfer und zwang sie, zur Selbstversorgung die Felder zu beackern. Damals trugen die Häftlinge noch Ketten. Heute wohnen und arbeiten hier sogenannte "Minimum-Insassen" kaum unbewacht Doch auch in Iwahig ist das Leben keineswegs so paradiesisch, wie es von außen wirkt. Gewalt bricht immer wieder aus. Und jeder muss für sein Überleben selbst sorgen. DE 2011'
