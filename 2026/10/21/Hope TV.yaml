  title: Ja Jesus - Die Offenbarung
  subtitle: Die Sabbat-Verschwörung (Teil 3) - Offenbarung 1,10a
  description: |-
    Der biblische Siebte-Tags-Sabbat, den der Mensch zu Ehre seines Schöpfers und Erlösers feiert, ist ein sichtbares, äußeres Zeichen der Verbundenheit mit Gott. So hat die Kirche im Osten (Kleinasien/Syrien) den Sabbat auch Jahrhunderte nach der apostolischen Zeit noch gefeiert.

    Weitere Infos unter: www.hopetv.de
