  title: VIP Trip - Prominente auf Reisen 6 - ¦ibenik mit Nikki Adler
  subtitle: VIP Trip - Prominente auf Reisen 6 - ¦ibenik mit Nikki Adler
  description: 'Reiseziel in dieser Folge ist diesmal die Region rund um die Stadt ¦ibenik in Mitteldalmatien. Als Tourguide fungiert Nikki Adler. Für die charmante Sportlerin und mehrfache Boxweltmeisterin mit kroatischen Wurzeln ist die Stadt ein beliebtes Urlaubsrefugium. Ihre Streifzüge durch die mittelalterlichen Altstadtgassen von ¦ibenik bereiten ihr ebenso große Freude wie die Ausflüge an die Adriaküste und auf das Inselarchipel der Kornaten. Nikki Adler: "Bei jedem Besuch hier habe ich immer das Gefühl nach Hause zu kommen, denn schließlich ist Kroatien das Geburtsland meiner Eltern." Daher freut sich die ehemalige Boxerin bei ihrer Reise auch wieder alte Freunde zu treffen, die sie am Anfang ihrer Sportkarriere begleitet haben. Unsere Reportage begleitet Nikki Adler zu zahlreichen Zielen wie den Krka-Nationalpark, die Festungsstadt Knin oder auf die Insel Murter. "Echter dalmatinischer Schinken, gute regionale Weine und bestes Essen: Das gehört zu einem Besuch in der Region ¦ibenik einfach dazu", da ist sich Nikki Adler sicher und deshalb forscht sie filmisch auch nach allerlei kulinarischen Genüssen. Eine Reportage nicht nur für Kroatien-Liebhaber. HR 2024'
