  title: 'Bike Mike: Die Tauern Radweg Runde - Teil 3: Von Bischofshofen zur Mozartstadt Salzburg'
  subtitle: 'Bike Mike: Die Tauern Radweg Runde - Teil 3: Von Bischofshofen zur Mozartstadt Salzburg'
  description: Die Tauern Radweg Runde by BikeMike ist eine faszinierende 6-tägige Radreise über 345 km in Österreich und Bayern. Sie startet und endet in Krimml und durchläuft währenddessen das Salzburger Land sowie den südöstlichsten Teil Bayerns. Die Rundreise ist von wild strömenden Wassermassen und gigantischen Bergen geprägt, denn sie folgt den Flußläufen der Salzach und Saalach inmitten der Täler des Hohe Tauern Nationalparks. Zahlreiche spektakulär ins Tal stürzende Wasserfälle und über die Jahrhunderte pittoresk ausgewaschene Klammen säumen den Weg und laden immer wieder zu einem Besuch ein. Einen Kontrastwechsel gibt es in Salzburg, wo die wilden Wasser Mozart treffen. Die Geburtsstadt des Musikgenies verspricht trubelige Abwechslung inmitten einer atemberaubenden barocken Kulisse. Diese Radreise ist ein wahrer Genuß für all diejenigen, die ihre Glückseeligkeit in dieser perfekten Kombination aus grandioser Natur und Weltkulturerbe finden. Aber seht am Besten selbst!  DE 2024
