  description: 'Was deutet das Thema "Wer''s glaubt, wird selig" an? Glaubt ein Christ an irgendwas oder auf naive Weise? Der Glaube an den dreifaltigen Gott verändert grundsätzlich das Leben, kann letztlich selig bzw. glücklich machen. Wer an IHN glaubt, wer IHM vertraut, ist und wird selig! Das Thema hat schließlich seinen Ursprung im Markusevangelium: "Wer glaubt, wird gerettet." Erster von zwei Teilen. Vortrag von Prof. DDr. Hanna-Barbara Gerl-Falkovitz. Aufgezeichnet im Rahmen des Studientages der Diözese Augsburg, am 25. Januar 2025.'
