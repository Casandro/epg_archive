    Tiergeheul in Bärstadt! Peter Lustig und sein Nachbar sind sich sicher: ein Wolf. Herr Paschulke fürchtet um sein Leben. Doch was hat es mit dem Märchen vom bösen Wolf wirklich auf sich?

    Neugierig sucht Peter nach Spuren im Wald. Eine Wildhüterin erklärt ihm, dass Wölfe in Rudeln leben wie in einer Familie. Das Heulen dient dem Zusammenhalt. Gefährlich sind die Tiere nicht. Im Gegenteil: Die Vorfahren unserer Hunde sind vom Aussterben bedroht.
