  title: Natur und Technik
  subtitle: Versteinerte Geschichte - Mineralien und Fossilien
  description: |-
    Was Steine alles erzählen können, darum geht es in dieser Folge von "Natur und Technik".
    Wie sich die Geschichte der Erde und die Geschichte des Lebens aus Mineralien und Fossilien erschließen lässt, das zeigt die Sendung in vielen Beispielen, Experimenten und anschaulichen Trickdarstellungen. Vom Pflasterstein bis zum Computerchip: Einblicke in ganz unterschiedliche Fertigungsprozesse verweisen schließlich auf die Bedeutung von Mineralien als Rohstoffe für Industrie und Technik.
