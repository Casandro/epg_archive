  title: Humor in der Musik
  description: Humor ist nach antiker Vorstellung die Mischung der Lebenssäfte, die die Grundstimmung bewirkt. Einer Grundstimmung, die das Widrige der Wirklichkeit mit heiterem Darüberstehen betrachtet. Doch über was der eine lachen kann, das findet ein anderer oft gar nicht lustig - Humor ist verschieden! Auch in der Musik, wo man grandios scheitern kann, wo man aber auch mit "Katzenmusik" viel Spaß haben kann. Und so stellt die Sendung verschiedene Aspekte von Humor vor, die man mit der Musik haben kann.
