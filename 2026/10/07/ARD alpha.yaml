- eventId: 950584
  start: 2026-10-07T05:15:00Z
  stop: 2026-10-07T05:30:00Z
  title: GRIPS Englisch
  subtitle: going to future
  subtitled: true
  description: |-
    Pläne für heute Abend oder fürs Wochenende, den Urlaub oder fürs Shopping ... Wenn du etwas Bestimmtes vorhast oder die Absicht hast, etwas zu tun, dann brauchst du das going to-future. Schau's dir an.

    Das going to-future ist eine ganz besondere Form der Zukunft. Sie drückt feste Absichten aus oder dass etwas ziemlich sicher passieren wird. Wenn du deinen Freunden zum Beispiel erzählen willst, dass du heute Abend ins Kino gehst und dass es wahrscheinlich bald regnen wird, weil der Himmel voller dunkler Wolken hängt, dann verwendest du diese Zeit.
- eventId: 950585
  start: 2026-10-07T05:30:00Z
  stop: 2026-10-07T05:55:00Z
  title: Willi wills wissen (154)
  subtitle: Wo schießen Pilze aus dem Boden?
  description: |-
    Ob groß, klein, dick, dünn, bunt, oder blass - es gibt sie in rund 1.000.000 verschiedenen Sorten: die Pilze!
    Um genau heraus zu finden, an welchen Plätzen sie sich verstecken, ist Willi mit Pilzesammler Günther Groß im Bergheimer Wald in der Nähe von Augsburg unterwegs. Nochmal schnell die pilzgerechte Ausrüstung wie Pilzmesser, Korb und Bestimmungsbuch checken - und los geht die Pilzsuche! Und am besten mit Hut, um sich vor Spinnweben und Zecken zu schützen. Apropos Hut: der Hut, den der Pilz auf hat, ist der des Fruchtkörpers.
