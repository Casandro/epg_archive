  title: RESPEKT kompakt
  subtitle: Information und Freiheit - wie wichtig ist das Internet für die Demokratie?
  subtitled: true
  genre:
  - '128'
  description: |-
    Das Internet ist zu einem wichtigen Baustein der Demokratie geworden: Nirgendwo sonst kann man sich so schnell und unabhängig informieren. Nirgendwo sonst kann so schnell und unkontrolliert Kritik an politisch Mächtigen geübt und millionenfach geteilt werden. Und nirgendwo sonst kann man sich so schnell organisieren. Diese Freiheit hat auch negative Seiten: Nur im Internet lassen sich Falschmeldungen so schnell und unkontrolliert millionenfach verbreiten, dass die Demokratie gefährdet sein kann.
    Moderatorin Sabine Pusch spricht u.a. mit Markus Beckedahl von Netzpolitik.org über die Bedeutung der Netzfreiheit für die Demokratie.
