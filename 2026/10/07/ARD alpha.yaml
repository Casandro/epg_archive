  title: Expedition in die Heimat
  subtitle: Lebendiger Mythos - Märchenhafter Vater Rhein
  subtitled: true
  description: 'Der Rhein - kein Fluss in Deutschland hat die Menschen mehr bewegt, als dieser Strom. Glück und Leid, Krieg und Frieden, Reichtum und Armut: Alle Facetten menschlichen Lebens und menschlicher Emotionen wurden hier im Laufe der Jahrtausende durchlebt und haben ihre Spuren hinterlassen. In zahlreichen Mythen und Legenden sind diese Spuren zu finden und einige sind weltbekannt geworden. Das Nibelungenlied oder die Sage von der Loreley sind nur zwei davon.'
- eventId: 950649
