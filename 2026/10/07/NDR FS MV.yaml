  description: Der Wisent ist Europas größtes Tier und vom Aussterben bedroht. Das Wisentgehege Springe bei Hannover setzt sich seit 1928 für seinen Schutz ein. Leiter Thomas Hennig bereitet vier Wisente auf die Auswilderung in den rumänischen Karpaten vor. Nur eine gut eingespielte Gruppe hat in der Wildnis eine Überlebenschance. Doch nach ihrer sicheren Ankunft verwandeln heftige Regenfälle die steilen Waldwege in Schlamm. Der Transport-Lkw kommt nicht weiter, und das lang geplante Projekt droht auf den letzten Metern zu scheitern.
