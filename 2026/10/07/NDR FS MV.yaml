  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Für Dr. Susanne Mertens wächst die Belastung durch Beruf, Familie und die Sanierung des Wochenendhauses. Als Luisa erfährt, dass ihre Mutter und Isabel ihr Praktikum im Zoo organisiert haben, schwänzt sie es und streitet sich mit beiden. Auch Susanne beginnt zu zweifeln. Im Zoo gerät die geplante In-vitro-Fertilisation eines Tapirs durch eine Erkrankung in Gefahr. Als die neue Cheftierärztin Elif Sahin bei der Behandlung eine Panikattacke erleidet, kann Susanne das Tier retten. Susanne stellt Elif die Frage, ob der Job im Zoo wirklich das Richtige für sie ist.
