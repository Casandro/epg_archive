  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nRon Dekel (JSUD) zum 7. Oktober: \"Wir lassen uns Deutschland nicht wegnehmen\"\nAm 7. Oktober zeigt die Jüdische Studierendenunion Deutschland (JSUD) vor dem Brandenburger Tor in Berlin eine Gedenkinstallation, um an den Terrorangriff der Hamas auf Israel vor drei Jahren zu erinnern. Im Interview erzählt Ron Dekel, Präsident der JSUD, dass die Studierenden mit einer ähnlichen Aktion vor einem Jahr viele positive Erfahrungen gemacht hätten - aber auch angefeindet worden seien. Viele Jüdinnen und Juden erlebten im Alltag Antisemitismus und würden Übergriffe aus Angst vor weiteren Anfeindungen nicht öffentlich machen.\n\nJudentum in der Türkei: Die Küstenstadt Izmir und das sephardische Erbe\nDie sephardisch-jüdische Gemeinde in der türkischen Küstenstadt Izmir hat eine jahrhundertelange Tradition. Im Osmanischen Reich war sie mit rund 40.000 Menschen die drittgrößte jüdische Gemeinde. Heute leben noch rund 1.200 Jüdinnen und Juden in Izmir. Seit 2010 werden im Rahmen des ?Izmir Jewish Heritage Project? Synagogen restauriert, um das jüdische Kulturerbe zu erhalten.\n\nAm Mikrofon: Christian Röther"
