  description: Ovog jutra pričamo o zlatnim uspesima našeg paraolimpijca Dragana Ristića i proveravamo kako pirotska škola "Mladost" kroz novi status resursnog centra menja sistem obrazovanja nabolje. Ovog jutra vodimo vas u Pirot, gde je specijalna škola "Mladost" dobila važan status resursnog centra. Direktorka Bojana Đorđević otkriva šta će tačno ova velika promena doneti učenicima sa smetnjama u razvoju, ali i nastavnicima u sistemu redovnog obrazovanja. Srpski paraolimpijac i član streljačkog kluba "Čika Mata", Dragan Ristić, vratio se sa Svetskog prvenstva u Južnoj Koreji sa čak dva najsjajnija odličja. Ovaj sportista svojom čeličnom disciplinom neprestano pomera granice, a jutros slušamo kako je tekao njegov put razvoja u svetu sporta i pored prepreka koje mu je život priređivao. Pišite nam - da li ste nekada imali priliku da kroz volonterski rad pomognete drugima u svojoj zajednici? Vaše poruke šaljite nam putem Vajbera ili SMS-a na naš dobro poznati broj 064-0-202-200. Dobro jutro!
