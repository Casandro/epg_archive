  description: 'Emisija za one koji vole umetničku muziku. Ako ste ljubitelj umetničke muzike i ako Vas interesuje: šta možete čuti na koncertnim podijumima u našoj zemlji; šta od muzičko-scenskih sadržaja možete videti u narednih sedam dana; šta se dešava na koncertnim i scenskim pozornicama sveta; ko je nastupio, a koga ćemo tek slušati; ko su mladi talenti i šta rade doajeni muzičke scene; koja su nova muzička izdanja... I sve to, uz mnoge interesantne i aktuelne goste, snimke sa koncerata i direktna uključenja sa najnovijim informacijama možete čuti u emisiji Susretanja Radio Beograda 1.'
