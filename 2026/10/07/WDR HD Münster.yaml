  description: Erlebnisreisen sind die Zusammenfassung von Magazinbeiträgen aus der Servicezeit oder kürzere exklusive Reportagen. Die Attraktivität der dargestellten Reiseziele steht im Vordergrund. Nachvollziehbar sind die beschriebenen Routen und Ziele. Deshalb werden praktische Tipps und konkrete Anregungen gegeben.
- eventId: 741323
  start: 2026-10-07T05:40:00Z
  stop: 2026-10-07T06:25:00Z
  title: In aller Freundschaft - 1025. Elternliebe
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In die Sachsenklinik wird ein Notfallpatient mit einem Militärhubschrauber eingeliefert. Kai Hoffmann ist bei seinem Einsatz durch die Explosion einer Tellermine verletzt worden. Er hat schwere Verbrennungen und einen zertrümmerten Unterschenkel. Kathrin Globisch und Philipp Brentano übernehmen gemeinsam mit Maria Weber die Versorgung und müssen bald eine Entscheidung treffen: Kais Bein ist stark beschädigt und muss vielleicht amputiert werden. \nDie selbstständige Kosmetikerin Claudia Kössler ist wegen anhaltender Bauchschmerzen bei Ilay Demir in Behandlung. Bei der Operation kommt es  zu einer lebensbedrohlichen Situation."
- eventId: 741382
  start: 2026-10-07T06:25:00Z
  stop: 2026-10-07T07:10:00Z
  title: In aller Freundschaft - 1026. Grenzgänger
  subtitle: Deutschland 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Maria Weber macht sich Sorgen um Kai Hoffmann und will ihn so schnell wie möglich aus dem künstlichen Koma holen. Kathrin Globisch steht dem eher kritisch gegenüber, aber Maria setzt sich schließlich durch. Zunächst scheint auch alles nach Plan zu laufen, doch dann reagiert Kai mit einer fulminanten Stressreaktion.
    Oliver Kehl, der bei der städtischen Müllabfuhr arbeitet, ist mit seinem rechten Arm in eine Müllpresse geraten und wird von Roland Heilmann und Philipp Brentano als Notfall operiert.
    Miriam Schneider und Jasmin Hatem freuen sich auf einen gemütlichen Serienabend auf Miriams Sofa.
