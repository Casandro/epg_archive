  title: Temps présent
  description: |-
    Les gourous de l'argent facile De Lausanne à Miami, en passant par Dubaï, ils s'affichent dans des appartements de luxe et des bolides à plusieurs centaines de milliers de francs. Ils affirment que faire fortune est un jeu d'enfant et proposent de partager avec vous la méthode qui vous rendra riche en quelques mois. Or, même dans le monde de l'argent facile, rien n'est gratuit. Surtout pas leurs prétendus secrets. Enquête sur les influenceurs du fric et leurs promesses onéreuses.

    Un reportage d'Anastase Liaros (Suisse Romande-2026)
