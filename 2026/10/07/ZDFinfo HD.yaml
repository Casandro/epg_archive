  description: |-
    Niederlande 2025
    Im Hochsicherheitsgefängnis der Hafenstadt Cebu City auf den Philippinen sitzen Mörder, Menschenhändler, Drogendealer ein. Um Aufstände zu vermeiden, müssen die Wärter 24/7 wachsam sein.

    Viele der inhaftierten Männer und Frauen, die in einem getrennten Bereich untergebracht sind, warten dort jahrelang auf ihr Urteil. Denn die Anzahl an Straftaten, mit denen sich die philippinischen Gerichte befassen müssen, ist extrem hoch, die Justiz ist überlastet.
