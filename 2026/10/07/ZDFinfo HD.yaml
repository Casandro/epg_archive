    30 Jahre nach dem Ende der DDR erzählt ZDFinfo die wahre Geschichte der Kernforschung im Osten. Es geht um Bomben und billigen Strom: In der DDR wird das erste deutsche Kernkraftwerk eröffnet. Und der ostdeutsche Staat liefert Uran für sowjetische Atomwaffen.
