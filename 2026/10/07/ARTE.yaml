  title: Nebraska
  subtitle: Un road movie mélancolique et personnel, filmé par Alexander Payne en noir et blanc. On y retrouve le regard bienveillant du cinéaste, on y découvre un Bruce Dern épatant. L'ensemble peut toutefois sembler un peu morne.
  ageRating: 7
  genre:
  - '16'
  description: 'Modeste vendeur en électronique dans une ville moyenne du Montana et fraîchement célibataire, David voit son vieux père Woody, déjà sujet à des problèmes d''alcool, commencer à doucement perdre la boule. Au grand désespoir de Kate, la mère de David (pour qui sa place est déjà à l''hospice), le septuagénaire s''est mis en tête de se rendre à pied - car il s''est vu retirer son permis de conduire - dans le Nebraska, deux États plus loin, pour récupérer le million de dollars qu''il croit avoir remporté à une obscure loterie. Son cadet a beau lui expliquer que le "ticket gagnant" n''est qu''un prospectus publicitaire mensonger, le vieil homme s''obstine dans son projet. David consent donc à prendre la route avec lui jusqu''à Lincoln, voyant finalement dans ce roadtrip, qui les fera passer par la ville où ses parents ont grandi, une occasion de renouer avec ce père ronchon et ahuri qui aura passé sa vie à le décevoir. Cruauté et burlesque Après le lumineux The Descendants, Alexander Payne signe en 2013 une nouvelle comédie douce-amère - et un rien plus dépressive - sur les affres de la famille, avec cet attachant road-movie qui le ramène sur ses propres terres natales. Dans un magnifique noir et blanc, il filme d''un oeil tendre et souvent satirique une Amérique profonde sinistrée, peuplée de losers ordinaires, de vieux rednecks et de chômeurs benêts, mais aussi les retrouvailles en demi-teinte d''un fils (l''humoriste Will Forte, dans un excellent contre-emploi) et de son père, oscillant entre burlesque et cruauté. Remarqué et primé dans de nombreux festivals - notamment à Cannes, dont le jury a distingué Bruce Dern, l''irrésistible interprète de Woody -, Nebraska est hélas reparti bredouille des Oscars malgré six nominations. Réalisateur: Alexander Payne. Des acteurs: Bruce Dern (Woody Grant), Will Forte (David Grant), June Squibb (Kate Grant), Stacy Keach (Ed Pegram), Bob Odenkirk (Ross Grant) (2013)'
