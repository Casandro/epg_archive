    Das Lebensglück von Elodie droht zu zerbrechen: Ihr Mann Mehdi will sich von ihr trennen, weil er sich an ihrer Seite einsam fühlt. Zudem wird die in Brüssel lebende Übersetzerin immer wieder von rätselhaften Albträumen heimgesucht.

