    * Was bringt die Mehrwegpflicht für Speisen und Getränke?
    Es ist offensichtlich: Wir brauchen mehr Mehrweg! Obwohl 2023 die Mehrwegpflicht für die Gastronomie eingeführt wurde, steigt die Menge an Einwegverpackungen weiter an. Dabei könnte eine einzelne Person ganze 13 Kilo Müll pro Jahr einsparen, wenn sie statt Wegwerf-Verpackungen auf Mehrwegbehälter umsteigen würde. Warum das im Alltag kaum gelingt und wie wir es besser machen können, weiß Eckart von Hirschhausen in "Wissen vor acht - Erde".
