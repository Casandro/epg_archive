  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: Papst Leo XVI. und das katholische Herz Frankreichs
  description: 'Diese Woche bei Vaticano: Wir blicken zurück auf die Höhepunkte der historischen Reise von Papst Leo XIV. nach Frankreich und sprechen mit der französischen Botschafterin beim Heiligen Stuhl über die Geschichte des Glaubens in Frankreich. Wir schauen uns die Nachbildung der Grotte von Lourdes in den Vatikanischen Gärten genauer an und besuchen die Kirche Santa Maria in Via, auch bekannt als das "geheime Lourdes von Rom".'
