  title: In Concert - Konzerte großer Meister
  subtitle: Die Regensburger Domspatzen - Konzert an der Basilika St Paul vor den Mauern
  description: "Die Regensburger Domspatzen, einer der ältesten und renommiertesten Knabenchöre der Welt, feiern 2025/2026 ihr 1050-jähriges Bestehen. Seit 975 prägen sie die europäische Kirchenmusik - eine Tradition von außergewöhnlicher Kontinuität. \n\nZum 500. Geburtstag von Giovanni Pierluigi da Palestrina widmet sich der Chor einem Komponisten, der als Inbegriff der katholischen Kirchenmusik des 16. Jahrhunderts gilt. Mit über 100 Messen und rund 250 Motetten schuf er ein Œuvre von enormer Strahlkraft. Der Legende nach bewahrte seine Missa Papae Marcelli die mehrstimmige Kirchenmusik nach dem Konzil von Trient vor dem Verbot - sicher ist: Sein Stil wurde zum Lehrmodell für Generationen. \n\nUnter der Leitung von Domkapellmeister Christian Heiß spannt der Chor einen weiten Bogen - vom gregorianischen Gesang über Renaissance und Barock bis hin zur Gegenwart. Ein konzentriertes Panorama geistlicher Musik, das 1000 Jahre Klangtradition in einem Programm bündelt."
  widescreen: true
