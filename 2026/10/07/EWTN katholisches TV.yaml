  title: Maria - Zwischen Himmel und Erde
  subtitle: Alle Christen sind "Miterlöser"
  description: In der 13. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup darüber, inwiefern alle Christen "Miterlöser" sind. Auf dem Konzil fand 1964 eine Abstimmung statt. Etwa 1050 Väter waren gegen eine eigene Mariologie, etwa 1000 dafür. Ratzinger hat wohl zurecht von einem Kollaps der Marienverehrung gesprochen. Aber man kann in dem Entscheid auch einen Wink des Heiligen Geistes sehen für die Miterlösung Mariens, aber nicht im Gegensatz zu allen Gläubigen, sondern ekklesiologisch eingebettet in der allgemeinen Berufung zur Heiligkeit in der Kirche.
  widescreen: true
