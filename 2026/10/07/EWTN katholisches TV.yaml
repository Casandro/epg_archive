  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Gedanken zur Zukunft der Heiligen Messe
  description: '''Wird die Messe überall so gefeiert, wie sie vorgeschrieben ist?'', fragt Monsignore Schroedel. Ist uns noch klar, dass die Liturgie ein objektives Handeln der Kirche ist und kein Experimentierfeld? Brauchen wir in Zukunft nicht mehr Mystik, mehr Ruhe, um sich in die Gegenwart Gottes versenken zu können? Die Messe darf keine ''Überwortung'' sein, sie sollte einfach und verständlich sein. Sie sollte eine Einladung sein, bei Christus zu verweilen. Dann wird sie wieder attraktiv, wie Formen der Anbetung zeigen, die gerade auch bei der Jugend Zuspruch finden.'
  widescreen: true
