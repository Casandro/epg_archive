  description: |-
    Zur Wochenmitte geht es in die "Meisenklause" im Kölner Stadtteil Vogelsang. Küchenchef Maurizio, bekannt als "flotter Sizilianer", steht für schnelle Küche und viel Erfahrung. Das Veedel-Lokal kombiniert deutsche Klassiker mit italienischen Einflüssen und gilt als "Wohnzimmer" der Nachbarschaft. Neben Pizza und Schnitzel punktet man auch mit Events und familiärer Atmosphäre. Reicht das für wichtige Punkte?

    Gastgeber: Christian Henze
