- eventId: 1510998
  start: 2026-10-07T16:30:00Z
  stop: 2026-10-07T16:55:00Z
  title: Čtení na pokračování
  description: 'Můj táta duch 4/7. Rozhlasový seriál o tom, že některé věci se nedají dokázat, ale i tak můžou být skutečné. "Ahoj, já jsem Etel. Můj táta zmizel do nemocnice a už se nevrátil. Teda vrátil. Ale jako duch!" Etel miluje encyklopedie, chce být vědkyní a sní o Nobelově ceně. Jenže jednoho dne zjistí, že ne všechno se dá změřit, spočítat nebo vysvětlit. Její táta se totiž po smrti vrátí na Zem jako duch! A tak si Etel začne psát vlastní encyklopedii o duchách. Právě tenhle výzkum jí přivede do života nejen nejlepší kamarádku Bedřišku, ale i školní psycholožku Vilmu, která jí vysvětlí, že někdy je v pořádku být prostě smutná. Napsala: Daniela Samsonová. Režie: Bela Schenková. Natočeno v roce 2025. Čte: Berenika Anna Mikeschová.'
- eventId: 1510999
  start: 2026-10-07T16:55:00Z
  stop: 2026-10-07T17:50:00Z
  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Aneta Žabková, ilustrátorka. Povídat si budeme o inspiracích i oblíbených postavách, o knížkách pro děti, které ilustrovala jako je Pyžaman, Udatný netopýrek, Je mi skvěle nebo Už máš svého koníka, ale i o veleúspěšném krátkém filmu Botička, která už si v České televizi svou premiéru odbyla a vyrazila na festivaly. Bude nás zajímat, jak byla Botička úspěšná v Mexiku i novinky, které Aneta právě ilustruje. Moderuje Denisa Kimlová a dětský spolumoderátor Kilián Štech (14 let).
- eventId: 1511000
  start: 2026-10-07T17:50:00Z
  stop: 2026-10-07T18:00:00Z
  title: Hajaja
  description: O nejkrásnějším ostrově 3/7 - O ostrově deště. Poslouchat rady rodičů se dětem často nechce. Zvláště když si myslí, že poučení jsou už zastaralá a nepotřebná. Právě takové připadalo malému Fumiovi pravidlo, že se lidé k sobě mají chovat slušně a že si nikdo nemůže dělat jen to, co sám chce. Rozhodl se, že najde takové místo, kde si každý žije podle svého přání a nálady. Původní pohádkový seriál napsala Dagmar Langová. V roce 2013 natočil režisér Petr Mančal. Vypráví Luboš Veselý.
