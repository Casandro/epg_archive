  description: Otvárací koncert 61. ročníka Bratislavských hudobných slávností zaznel pod taktovkou austrálskej dirigentky Simone Young. Sólistom večera bol japonský klavirista Mao Fujita. Múzeum moderného umenia Andyho Warhola v Medzilaborciach otvorili po rekonštrukcii budovy, aj expozície. Národné divadlo Brno uviedlo premiéru baletu Maska v choreografii a réžii Mária Radačovského. Režisér Juraj Štepka rozpráva o svojom filme Generál Golian. Básnik Ivan Štrpka recitoval svoju tvorbu v sprievode hudobného zoskupenia Altar Quartet. Divadlo komédie uviedlo premiéru Klimaktérium 3 s podtitulom Horúce strely. (2026)
