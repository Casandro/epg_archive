  title: Traumhäuser im Norden - Ein Haus am See
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Vor 150 Jahren wurde im kleinen Dorf Nusse in Schleswig-Holstein direkt an einem See ein Haus für einen Apotheker gebaut. Mit Verkaufs- und Lagerräumen, Platz für Salben, Arzneien und Hunderte Tinkturen. Außerdem auch mit viel Wohnraum für die Familie des Apothekers.  Es ist ein repräsentatives Bürgerhaus in Backstein mit riesigen Fenstern, Wandmalereien und eleganter Innenausstattung entstanden. Die Alte Apotheke wurde 2017 unter Denkmalschutz gestellt. Die Sanierung des Gebäudes stellte die heutigen Besitzer vor große Probleme.
