  title: Liebe auf Bewährung
  subtitle: Fernsehfilm Deutschland 2004
  ageRating: 6
  genre:
  - '16'
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Nach dem Tod ihres Mannes versinkt die gut situierte Witwe Juliane Willbrandt in einer großen Leere. Ihre Bemühungen, nach zwanzig Jahren wieder in ihren alten Beruf als Bibliothekarin zurückzukehren, erweisen sich als aussichtslos, bis der Gefängnisdirektor Schober ihr eine Chance gibt.
    Die Herausforderung als Leiterin der Gefängnisbibliothek gibt Juliane Energie und neuen Lebensmut. Sie verliebt sich in den künstlerisch begabten Häftling Albert Tieck, der nach einer Brandstiftung, bei der seine Frau ums Leben kam, zu sieben Jahren hinter Gittern verurteilt wurde. Doch dann nutzt Albert einen gemeinsamen Hafturlaub zur Flucht.
