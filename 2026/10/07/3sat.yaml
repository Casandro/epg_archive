  title: Im Bann der Drachenberge
  subtitle: Film von Lynn Richardson und Philip Richardson
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sie sind die längste und höchste Gebirgskette im südlichen Afrika, die von der Kapregion bis in den Nordosten Südafrikas reicht: die Drakensberge - deutsch "Drachenberge".

    Sie wurden Ende der 1990er-Jahre zum Nationalpark ernannt, seit dem Jahr 2000 ist das Gebirge UNESCO-Weltnatur- und Weltkulturerbe. Die Hauptdarsteller des Films "Im Bann der Drachenberge" sind eine Gruppe Paviane und eine Herde Elen-Antilopen.
    HD-Produktion
- eventId:
