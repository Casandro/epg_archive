  title: Inside Stasi
  subtitle: Film von Susanne Gerecke
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    "Wir müssen alles erfahren!", fordert Erich Mielke, der Leiter des DDR-Inlandsgeheimdienstes. Die etwa 200.000 Mitarbeiter seiner "Staatssicherheit" spionieren dafür rund um die Uhr.

    Nach der Wende finden Bürgerrechtler tonnenweise Akten, Tonbänder, Filme, aber auch rätselhafte Gläser mit "Geruchsproben" in den Stasiarchiven. Sie geben tiefe Einblicke in die geheime Welt von Mielkes Agenten und Zuträgern, in ihr Tun und Denken.
    HD-Produktion
- eventId:
