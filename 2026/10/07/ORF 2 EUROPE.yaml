  title: Fokus Europa
  description: "Terror - Propaganda\nImmer mehr rechtsextreme Gewalt gegen Zuwanderer in Großbritannien.\n\nSoziale Medien verbreiten Falschinformationen und hetzen gegen Ausländer, dann eskalieren die Proteste und maskierte Randalierer machen Jagd auf Zuwanderer.  Wer organisiert diese Krawalle, was ist der politische Hintergrund, wie passiert die Radikalisierung im Netz? Unser Großbritannien-Korrespondent Jörg Winter hat recherchiert.\n\nGast im Studio dazu: Daniela Grabovac, Extremismus-Prävention Graz\n\nFlüchtlingschaos in der Grenzstadt Ceuta \nEuropas Außengrenzen unter Druck durch illegale Migration\n\nEnde Juli stürmten 70.000 Flüchtlinge die spanische Enklave Ceuta am nördlichen Ende von Marokko.  Die Lage ist auch Wochen später angespannt, viele Flüchtlinge weigern sich die Stadt zu verlassen und hoffen weiter auf Asyl in Europa. Während fast alle EU - Staaten auf eine harte Migrationspolitik setzen, ist das sozialistisch regierte Spanien eher liberal. Maren Häußermann mit einem Lagebericht direkt aus Ceuta. \n\nStrahlende Zukunft für Atomkraft \nEuropäische Kommission bekennt sich zum Ausbau von Kernkraftwerken\n\nTrotz der bekannten Risiken setzt die EU auf mehr Atomstrom. Moderne, kleine Reaktoren seien sicher und klimaneutral, erklären die Experten. Das ursprünglich geplante Aus für AKW sei ein strategischer Fehler gewesen, räumt die Präsidentin der EU-Kommission, Ursula von der Leyen, ein. Stefan Gehrer prüft die Zukunft der Kernkraft mit einem Besuch in Litauen, wo das einst stärkste Atomkraftwerk der Welt steht.\n\nModeration:  Andreas Mayer-Bohusch"
  genre:
  - '129'
