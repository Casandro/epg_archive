  title: WELTjournal
  subtitle: 7. Oktober - die Liste von Oz
  description: Am 7. Oktober jährt sich der beispiellose Terrorangriff der Hamas auf Israel zum dritten Mal. Fast 1200 Menschen wurden damals getötet, etwa 250 als Geiseln in den Gazastreifen verschleppt. Es war der größte und folgenschwerste Terrorangriff der israelischen Geschichte und hat in der Bevölkerung ein nachhaltiges Trauma hinterlassen. Das WELTjournal zeigt die Geschichte des israelischen Landwirts Oz Davidian, der durch sein mutiges Handeln 120 junge Menschen vom Gelände des Nova-Musikfestivals retten konnte. Insgesamt 15mal fährt er zu dem Gelände, vorbei an ausgebrannten Autos, leblosen Körpern und schwer bewaffneten Terroristen, die auf ihn schießen. Im Film sind Oz Davidians waghalsigen Rettungsfahrten mit Live-Aufnahmen der Dash-Cam aus seinem Auto zu sehen, ebenso wie Bilder von den Handykameras der flüchtenden Festivalbesucher sowie Aufnahmen von den Body-Cams der Hamas-Teroristen. Zwischen Oz und den jungen Menschen, die ihm ihr Leben verdanken, hat sich unterdessen eine tiefe Freundschaft entwickelt.
  genre:
  - '129'
