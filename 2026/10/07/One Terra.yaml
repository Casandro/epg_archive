  description: "Komodowarane sind die weltweit größten Echsen und erinnern an Drachen aus alten Geschichten. Die Riesenechsen leben seit etwa vier Millionen Jahren auf der Erde, wurden aber erst vor 100 Jahren wissenschaftlich beschrieben. Heute gibt es noch rund 2.500 frei lebende Komodowarane. Die Inseln des Nationalparks Komodo sind ihre letzten Rückzugsorte. Chefranger David Robert Hau lebt auch auf der Insel Komodo - inmitten der Riesenechsen. \n DE 2011"
