  title: Planet Weltweit - Mit Volldampf durch Kärnten
  subtitle: Planet Weltweit - Mit Volldampf durch Kärnten
  description: 'Es ist immer wieder eine ganz besondere Zeitreise, wenn eine 100 Jahre alte Dampflok durch romantische Alpentäler schnauft:  In Kärnten, Österreichs südlichstem Bundesland, gibt es ein gigantisches Technikmuseum, in dem hunderte historische Fahrzeuge wie Lokomotiven, Straßenbahnen, Busse und sogar ganze Schiffe gewartet und betrieben werden. Neben dem Museum unterhält der Verein "Nostalgiebahnen in Kärnten" auch diverse Werkstätten. Ohne Ehrenamt ginge hier nichts. In ihrer Freizeit restaurieren technikbegeisterte Männer und Frauen dort die tonnenschweren und imposanten Relikte vergangener Zeiten, und das schon seit über 30 Jahren. Sie geben alles, damit ihre Nostalgiegefährte auch rechtzeitig zur Saison startklar sind. Es ist der Leidenschaft und dem unermüdlichen Einsatz der Mitglieder des Vereins zu verdanken, dass diese technischen Kulturgüter der Nachwelt erhalten geblieben sind. Jedes Jahr im Frühling geht die Saisonvorbereitung wieder los. Unzählige Arbeitsstunden investieren die insgesamt knapp 100 Enthusiasten dann wieder, darunter Väter mit ihren Söhnen zum Beispiel oder auch Paare, die sich dieser ungewöhnlichen Leidenschaft gemeinsam verschrieben haben. Hans-Georg Prix ist Gründungsmitglied des Museums, auch ihm ist es zu verdanken, dass heute bis zu 4000 Exponate, darunter historische Feuerwehrwagen, alte Polizeibusse oder eben sogar ganze Züge wieder der Öffentlichkeit gezeigt und auf zum Teil eigens dafür geschaffenen Strecken gefahren werden können. Der schönste Lohn für ihn und seine Mitstreiterinnen und Mitstreiter aber ist das Strahlen in den Gesichtern der Fahrgäste, wenn sie mit Volldampf durch ihr romantisches Kärnten reisen. DE 2020'
