  title: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  subtitle: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  description: '"Der Erfolg steckt in guten Schuhen." Nirgendwo scheint diese alte chinesische Weisheit zutreffender als in Wenzhou. In der Hafenstadt werden fast alle in China hergestellten Brillen, Rasierer, Schlüssel, Schlösser und 80 Prozent aller weltweit verkauften Feuerzeuge produziert. Vor allem aber ist Wenzhou die Welthauptstadt der Schuhe. Nirgendwo werden mehr Schuhe hergestellt als hier. Doch die Branche gerät an ihre Grenzen. Schon längst werden in Wenzhou hergestellte Schuhe zu teuer. Unternehmer wie der Fabrikant Jian Ping Wang liebäugeln deshalb mit Niederlassungen in Afrika, wo die Produktion billiger ist.  Die Bewohner der ostchinesischen Küstenstadt Wenzhou stehen bei ihren Landsleuten im Ruf, ein besonderes Talent fürs Geldverdienen zu besitzen. "In Wenzhou reden selbst die alten Frauen übers Geschäft, statt zu tratschen", so eine Redensart. Schon im Kaiserreich um 200 v. Chr. existierten in der Stadt private Banken. Heute hat die Metropole eine imposante Skyline, eine Börse, Chinas modernste Bank, effiziente Behörden und einige der erfolgreichsten Unternehmen des Landes. Eine Musterstadt, auf die man auch heute noch stolz ist und die vom Ausland bestaunt wird - vor allem wegen der einzigartigen Schuhproduktion. Insgesamt werden pro Jahr geschätzte 1,5 Milliarden Paar Schuhe hergestellt; in Produktion und Verkauf sind fast 400.000 Menschen beschäftigt. Täglich kommen Menschen aus den Provinzen in die Millionenstadt, die Karriere, Geld und Anerkennung verheißt. Der Arbeiter Yi You Xu hat es geschafft - vor 16 Jahren kam er nach Wenzhou und hat sich seitdem mit Fleiß und Ausdauer nach oben gearbeitet. Der Lohn waren ein Haus in seinem Heimatdorf und eine Wohnung in der Stadt. Jetzt fehlt ihm nur noch ein Auto zu seinem Glück. Doch zu dessen Anschaffung wird er demnächst kaum Gelegenheit haben. Sein Arbeitgeber, der Fabrikant Jian Ping Wang, plant, ihn nach Nigeria zu schicken, wo er eine Niederlassung seines Unternehmens leiten soll. DE 2007'
