  title: Planet Weltweit - Die Falkenärztin von Abu Dhabi
  subtitle: Planet Weltweit - Die Falkenärztin von Abu Dhabi
  description: Falken sind ein fester Bestandteil der arabischen Kultur. Seit Jahrhunderten gehört die Jagd mit den imposanten Greifvögeln in den Vereinigten Arabischen Emiraten zur Tradition. Nahezu jede Familie besitzt einen oder mehrere Falken. Um die Gesundheit dieser kostbaren Greifvögel kümmert sich die deutsche Tierärztin Margit Müller. Sie ist Leiterin des "Abu Dhabi Falcon Hospital" - der größten Falkenklinik der Welt.  Die Vereinigten Arabischen Emirate haben in den letzten Jahrzehnten einen einzigartigen Wirtschaftsboom erlebt. Dank großer Erdölfunde etablierte sich eine weltmarktfähige Industrie. Neue Hochhäuser schossen aus dem Wüstensand. Gastarbeiter aus aller Welt wanderten in die Region. Aus den ehemaligen Beduinen wurden sesshafte Industrielle und Geschäftsmänner. Dennoch wollen viele die althergebrachten Traditionen, das Erbe ihrer Väter, nicht vernachlässigen. Einer dieser Bräuche ist die Falkenjagd. Ursprünglich trug die Falknerei, also das Abrichten von Falken zur Jagd, maßgeblich zur Ernährung der Beduinen in der Wüste bei. Sie fingen die Wildvögel, die auf dem Weg in ihr afrikanisches Winterquartier die arabische Halbinsel überquerten, und richteten sie zur Jagd nach Wüstentieren, vor allem den Kragentrappen, ab. Die Falken sind der Stolz der Wüstensöhne und als soziales Rangabzeichen wichtiger als Ferraris und Schweizer Uhren. Entsprechend wichtig ist auch das Wohlbefinden und die Gesundheit des Falken für seinen Besitzer. Als die deutsche Tierärztin Margit Müller vor acht Jahren das größte Falkenhospital der Welt in Abu Dhabi übernahm, hatte sie es nicht leicht. Die Vorbehalte in der arabischen Kultur gegenüber Frauen waren groß. Mittlerweile haben die Männer sie als medizinische Koryphäe akzeptiert. Der 37-jährige Geschäftsmann Hamdan Mathar Bin Hamash ist seit vielen Jahren Falkner. Für ihn sind seine Vögel vollwertige Familienmitglieder. Er will sich ein neues Tier zulegen. DE 2009
