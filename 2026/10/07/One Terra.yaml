  title: Planet Weltweit - Biberkrieg in Bayern
  subtitle: Planet Weltweit - Biberkrieg in Bayern
  description: 'Inmitten des größten Waldgebietes in Europa liegt ein kleines Stück Wildnis verborgen: Der Nationalpark Bayerischer Wald. Dieser nicht bewirtschaftete und daher sehr artenreiche Wald ist Naturschützern zu verdanken. Ein Tier steht unter besonderem Schutz: Der Biber. Doch die fleißigen Nager haben nicht nur Freunde. Manchem Bauern geht der Naturschutz zu weit.  "Das war alles der Biber" - Bauer Pfeffer ist überzeugt, dass sich der Biber an seinen Rüben vergriffen hat. Bibermanager Gerhard Schwab vom Naturschutzbund Bayern versucht vergeblich, ihn vom Gegenteil zu überzeugen. Der Biber ist ein willkommener Sündenbock für alle möglichen Probleme der Bauern. Fast täglich werden Gerhard Schwab und seine Biber-Manager-Kollege Jens Schlüter gerufen, um Schäden zu begutachten und ihr Urteil zu fällen: Darf der Biber in der betroffenen Region bleiben, oder muss er samt Familie umgesetzt werden? Bedroht er nachweislich die Existenz der Betroffenen, oder ist es nur blinder Hass auf das Wildtier? Der Biber spaltet die Gemüter, und die sturbayerische Volksseele ist kein leichter Gesprächspartner. Ebenso wenig, wenn es um den Nationalpark Bayerischer Wald geht: Riesige Fichtenwaldflächen verrotten hier nach dem Durchzug des Borkenkäfers auf natürliche Weise, und die dadurch entstehende Wildnis ist Nährboden für eine atemberaubende Artenvielfalt: Seltene Pilze, Vögel und Libellen bevölkern den Wald. Hier kann sich auch der Biber frei entfalten, der in Deutschland gänzlich ausgerottet war. Vor 40 Jahren importierten Naturschützer einige Tiere aus Skandinavien und Russland, inzwischen haben sie sich auf über zehntausend vermehrt. Die vierbeinigen Vegetarier fällen ganze Bäume, häufen meterhohe Dämme aus Ästen und Stämmen auf oder stauen einem Bach schon gerne mal zum stattlichen See. Künstliche Uferbegradigungen macht er rigoros rückgängig. DE 2009'
  ageRating: 12
