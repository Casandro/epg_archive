  title: Planet Weltweit - Bretagne, Von Bienen und Leuchttürmen
  subtitle: Planet Weltweit - Bretagne, Von Bienen und Leuchttürmen
  description: 'Wild, schroff, wind- und meerumtost ist das Land, seine Bewohner stolz und eigenwillig. Die Bretagne nimmt einen Sonderstatus unter den französischen Regionen ein. Was bedeutet es heute, ein Bretone zu sein? "Land am Meer", nannten die Kelten die Bretagne. Wo die Gezeiten gewaltig sind, die Steinhäuser sich vermeintlich vor den Stürmen ducken und am westlichen Zipfel Amerika zu erahnen ist, beherrscht der Atlantik das Leben. Über Jahrhunderte lebten die Menschen vom Fischfang und der Seefahrt. Heute hat sich das Leben geändert: Der Fischfang ist industriell geworden, die Leuchttürme drohen zu verfallen. Manche sehen in dieser Entwicklung eine Chance zum Aufbruch. Andere kämpfen dagegen an.  Von jeher haben die Leuchttürme der Bretagne Schiffen den Weg entlang ihrer felsigen und scharfkantigen Klippen gewiesen und so die Einfahrt in den Ärmelkanal ermöglicht. Heute orientieren sich die großen Frachter mittels Satellitennavigation. Die Leuchttürme stehen leer und drohen zu verfallen. So geht nicht nur die Tradition der hochangesehenen Leuchtturmwärter verloren, es weiß auch keiner, ob und wie die Gebäude zukünftig genutzt werden sollen. Ein Verein kämpft um den Erhalt der maritimen Architektur und versucht neue Nutzungsmöglichkeiten zu erschließen. Einen ersten Erfolg gibt es auf der Insel Ouessant, wo der örtliche Imkerverein in die Gebäude gezogen ist. Die schwarzen Bienen der Region sind einzigartig, da nur sie nicht von der weltweit grassierenden Bienenseuche Varroa betroffen sind. Ein möglicher Wirtschaftszweig für die Zukunft - wenn sich die Bienenzüchter auf der Insel einig wären. Begrenzte Kapazitäten und die den Bretonen eigene Starrköpfigkeit sorgen immer wieder für Streitigkeiten unter den Imkern. Hinzu kommen Konflikte zwischen alten und jungen Insulanern - während die einen versuchen, neue Wege zu gehen und wirtschaftliche Perspektiven zu eröffnen, hängen die Alten an Bräuchen und Gewohnheiten und verweigern sich jeder Öffnung nach außen. DE 2013'
