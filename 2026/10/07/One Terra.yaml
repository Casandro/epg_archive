  description: 'Drei kleine, einsame Atolle mitten im Pazifik, die zu Pionieren in Sachen Energieerzeugung wurden: Tokelau ist die erste Nation der Welt, die ihre Stromproduktion zu 100 Prozent auf Solarenergie umgestellt hat. Die Dokumentation beleuchtet, wie sich das Leben dadurch verändert hat. DE 2015'
