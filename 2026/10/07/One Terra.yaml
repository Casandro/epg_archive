  title: Wasser ist Zukunft - Die Niederlande - Der Pakt mit dem Wasser
  subtitle: Wasser ist Zukunft - Die Niederlande - Der Pakt mit dem Wasser
  description: 'Gott erschuf Himmel und Erde doch wir erschufen die Niederlande. So lautet das selbstbewusste Credo der Bewohner des Küstenlandes. Über Jahrhunderte haben die Niederländer das Meer mit Deichen gezähmt, Sümpfe trockengelegt, ihr Land mit unzähligen Kanälen und Wasserstraßen durchzogen. Doch die Natur droht mächtiger denn je zurückzuschlagen: Der Klimawandel facht die Stürme an und lässt den Meeresspiegel steigen. Gegen anschwellende Fluten und Pegel müssen die Niederländer neue Wege finden, mit dem Wasser zu leben. Die traditionellen Lösungen reichen nicht mehr aus, das tiefliegende Land zu schützen. Die Niederlande suchen einen neuen Pakt mit dem Wasser. Statt immer häufiger Sand an den Küsten aufzuschütten, wagten die niederländischen Ingenieure im Jahr 2011 ein einmaliges Experiment: Mit rund 20 Millionen Kubikmetern Sand schufen sie eine riesige, hakenförmige Halbinsel: den "Sandmotor". Die Idee: Das Meer soll in den nächsten 20 Jahren den aufgeschütteten Sand entlang der Küste verteilen. Ganz von selbst. Solange sind keine weiteren Strandreparaturen nötig. Immer häufiger versuchen die Menschen in den Niederlanden, die Kraft der Natur zu nutzen, um die Küsten zu schützen und an den Flüssen dem Wasser gezielt Raum zu geben. Die Dokumentation begleitet Ingenieure, Architekten und Naturschützer, besucht Dachgärten, Muschelfarmen und schwimmende Häuser und zeigt Menschen, die mit Einfallsreichtum und Geschäftssinn den neuen Pakt mit dem Wasser schmieden. Denn für die Niederlande ist das Wasser die Zukunft. DE 2017'
  ageRating: 6
- eventId: 1469363
