  title: Planet Weltweit - Georgien, die Wiege des Weins
  subtitle: Planet Weltweit - Georgien, die Wiege des Weins
  description: 'Georgien galt zu Sowjetzeiten als der Weinkeller der UdSSR. Auch nach dem Zusammenbruch des Riesenreiches blieb Wein eines der wichtigsten Exportgüter des Landes. Erst seit Russland ein Embargo verhängt hat, ist der Export dramatisch eingebrochen, und Georgien sucht nach neuen Absatzmärkten. Denn der Weinanbau im Kaukasus läuft nach wie vor auf Hochtouren, wird Jahr für Jahr sogar effektiver. Kleinbauern, freie Kooperativen und Weingüter nach westlichem Vorbild wetteifern um Ertrag und Qualität. Die Reportage zeigt eine Weinregion im Wandel, zerrissen zwischen einer Jahrtausende alten Tradition, dem sowjetischen Erbe und den Anforderungen des modernen Marktes. Wer sich in Georgien begrüßt, fragt nicht: "Wie geht es dir?", sondern "Wie geht es deinem Weinstock?" Wein ist hier heilig. Experten gehen sogar davon aus, dass Georgien eines der Ursprungsländer für den Weinanbau ist; seit Jahrtausenden werden die Reben unter idealen klimatischen und geologischen Bedingungen gezüchtet. Zu Sowjetzeiten belieferte das Land die gesamte UdSSR mit dem traditionell süßen Wein. Etwa 85 Prozent der Produktion wurde exportiert. Nach dem Zusammenbruch des kommunistischen Systems war Russland noch immer der größte Abnehmer; seit es jedoch starke Konflikte zwischen beiden Ländern gibt und Moskau ein Embargo verhängt hat, leidet Georgien unter einem Absatzproblem. Denn der Wein wird weiter angebaut und gelesen. Um weltmarktfähig zu werden und neue Kunden zu gewinnen, suchen die georgischen Winzer nach Strategien, um ihre Ware international zu vermarkten. Einer von ihnen ist Dato Maïsouradzé. Zusammen mit anderen Winzern versucht er den georgischen Wein unter einer Qualitätsmarke zu etablieren. Kein leichtes Unterfangen, denn bisher unterlag die Produktion eher dem Prinzip Masse statt Klasse.  DE 2009'
  ageRating: 6
