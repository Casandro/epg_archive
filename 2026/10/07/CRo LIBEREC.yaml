  start: 2026-10-07T09:05:00Z
  stop: 2026-10-07T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Předejít trombóze. MUDr. Eva Drbohlavová, Oddělení klinické hematologie KNL. Žilní tromboembolie postihuje každý rok téměř deset milionů lidí na celém světě. Co je trombóza, jaké jsou rizikové faktory, jak se projevuje žilní trombóza a jak plicní embolie, v čem spočívá léčba a jak můžeme tomuto onemocnění předejít, nejen na tyto otázky se zaměříme s lékařkou Evou Drbohlavovou z Oddělení klinické hematologie KNL.'
