  subtitle: 'Christel Eggers: Trauma-Überwindung - Die Seele atmet auf'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Zweimal wurde Christel Eggers von einer psychisch kranken Frau angegriffen, der sie bis dahin als Seelsorgerin zur Seite stand. So ein traumatisches Erlebnis kann einem Menschen schnell den Boden unter den Füßen wegreißen. Bei Christel Eggers machten sich Unsicherheit, Zweifel und Einsamkeit breit. Für sie war Gott die Hoffnung in aller Dunkelheit. Sie berichtet im Gespräch mit Moderator Wolfgang Severin von ihrem Überwindungsweg und macht Betroffenen Mut.'
