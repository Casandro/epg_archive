  description: 'Adam Georgiev: Deník sestry Lídy Baarové 5/5. Byla inteligentní a milá, měla velké charisma a herecký talent od Boha. A přece byla celý život nešťastná. Zorka Janů, o sedm let mladší sestra legendární Lídy. Pro rozhlas připravila Eva Lenartová. Účinkuje Tereza Vilišová. Režie Tomáš Jirman. Natočeno v roce 2013.'
