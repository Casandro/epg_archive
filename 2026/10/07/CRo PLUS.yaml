  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (8/10). Křížová výprava - další střípek ze života svatého Františka. Minorita ji bral jako příležitost k mučednictví. Autor se zamýšlí nad tím, co mohl ve své době František vědět o islámském Orientu, i nad tím, jak asi vypadalo skutečné setkání Františka s egyptským sultánem. Po návratu z výpravy získává řád Františka z Assisi jasná pravidla určená papežem. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
