  description: Zastavíme ruské drony? Řada evropských států se chystá na dronové útoky a sabotáže, které podle zpravodajských služeb v příštích měsících můžou přijít z Ruska. Jak se připravuje Česko? Mělo by se zapojit do spolupráce s Ukrajinou ohledně dronových technologií? Nebo má váhání ministra obrany Jaromíra Zůny za SPD své opodstatnění? Zeptáme se poslance ODS Pavla Žáčka a poslance SPD Josefa Nerušila. Moderuje Lukáš Matoška.
