  description: Adam Sybera, kyjevský novinář. Rusko o víkendu vyzvalo zahraniční diplomaty, aby z důvodu bezpečí opustili ukrajinské hlavní město. Ruský dron poté v době návštěvy německého kancléře Merze zasáhl Severní most přes Dněpr. Proč se ruské útoky zaměřují na mosty a jaký dopad mají na obyvatele ukrajinských měst? Moderuje Pavlína Nečásková.
