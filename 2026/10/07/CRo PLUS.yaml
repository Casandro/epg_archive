  description: Proč lidé začali cestovat a kdy se z cestovatelů stali turisté? To zkoumá historik Jan Pezda v knize Slunce, voda, vzduch - zrod moderního turismu, kterou v roce 2025 vydalo nakladatelství Paseka.
