  description: Vladimír Dzuro, vyšetřovatel Mezinárodního trestního tribunálu pro bývalou Jugoslávii, autor knihy Vyšetřovatel - Zločiny privilegovaných. Jak jako vyšetřovatel válečných zločinů vnímá tři roky poté teroristický útok Hamásu na izraelské civilisty a následnou odpověď Izraele? Kde končí legitimní vojenská operace a začíná válečný zločin? A je pocit beztrestnosti privilegovaných, o kterém píše ve své nové knize, jeden z hlavních momentů, který stojí za zločinem? Moderuje Barbora Tachecí.
