  title: Beweg dich!
  subtitle: 'Kräftige Arme: Mehr Kraft im Alltag'
  description: |-
    In dieser Episode von Beweg dich! dreht sich alles um das Krafttraining für die Arme - ein oft unterschätzter Bereich. Mit gezielten Übungen für Schultern, Bizeps, Trizeps und Rücken lässt sich nicht nur die Muskelmasse erhalten, sondern auch alltägliche Aufgaben wie Heben oder Aufstehen erleichtern. Zusätzlich kann regelmäßiges Armtraining helfen, die Knochendichte zu verbessern und das Osteoporoserisiko zu senken. Eine effektive Einheit für mehr Kraft, Stabilität und Lebensqualität.
    15 Minuten sanfte Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Eka Ninow-Woysch ist Sportlehrerin im "Ruhestand".
     Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
  widescreen: true
  hd: true
- eventId: 1356017
  start: 2026-10-07T00:15:00Z
  stop: 2026-10-07T00:45:00Z
  title: Bibelkompass
  subtitle: Gottes Liebe meint auch dich
  description: |-
    Viele Menschen kennen Liebe als etwas Bedingtes: Wer Erwartungen erfüllt, wird angenommen. Gottes Liebe ist anders. Sie ist nicht abhängig von Leistung, Vergangenheit oder Versagen. An der Geschichte von Maria Magdalena wird sichtbar, wie Jesu Liebe befreit, Schuld vergibt und ein verletztes Herz heilt. Die Bibel zeigt: Gott liebt zuerst. Diese Liebe nimmt Angst, schenkt Würde und verändert das Leben von innen heraus. Wer sie annimmt, entdeckt: Gottes Liebe gilt nicht nur anderen - sie meint ganz persönlich jeden Menschen. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
