  title: Immanuel - Jesus folgen
  subtitle: Frei werden
  description: |-
    Jeder Mensch kennt Situationen, die er am liebsten ungeschehen machen würde. Doch wie geht man mit Schuld um, ohne daran zu zerbrechen?
    Die Begegnung Jesu mit der Ehebrecherin in Johannes 8 macht deutlich, wie Jesus Menschen weder verurteilt noch ihre Schuld verharmlost. Stattdessen eröffnet er einen Weg, der Wahrheit, Vergebung und einen echten Neuanfang miteinander verbindet.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

