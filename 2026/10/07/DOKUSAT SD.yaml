  subtitle: Hitler - Eine deutsche Tragödie - Ein Selbstmörder
  description: Nach der Landung der Alliierten in der Normandie und der gescheiterten Ardennenoffensive weigert sich Hitler, die ausweglose Situation zu akzeptieren. Viele Deutsche hoffen weiterhin auf eine Wende. Er zieht sich in den Bunker unter der Reichskanzlei zurück und heiratet Eva Braun. Erst als die Russen am 30. April 1945 nur 500 Meter vor dem Bunker stehen, erkennt er die totale Niederlage und steht vor einer entscheidenden Wahl.
