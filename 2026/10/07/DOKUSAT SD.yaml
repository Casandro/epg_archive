  subtitle: Hitler - Eine deutsche Tragödie - Ein Feldherr
  description: Hitler bricht den Pakt mit Stalin und marschiert in Russland ein, um die russische Rasse zu vernichten und Osteuropa zu kolonisieren. Die deutsche Armee gewinnt schnell Terrain und erreicht im Dezember 1941 Moskau. Trotz der Bedenken seiner Generäle ordnen sich diese ihm unter. Nach anfänglichen Erfolgen kämpft die Armee jedoch gegen große Distanzen, die Überzahl der russischen Soldaten und den harten Winter.
