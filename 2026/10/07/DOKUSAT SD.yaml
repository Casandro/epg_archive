  title: 'Explosiv - Männer in gefährlicher Mission: Explosives Erdreich'
  description: 'Unter Feldern, Straßen und Baustellen liegen noch immer gefährliche Blindgänger und Sprengkörper. Für die Spezialisten bedeutet das: Präzision, höchste Vorsicht und oft ein Wettlauf gegen die Zeit. Die Männer in gefährlicher Mission graben nach explosiven Altlasten, sichern tonnenschwere Bomben und entschärfen gefährliche Hinterlassenschaften aus vergangenen Kriegen. Die Doku begleitet sie bei Einsätzen, bei denen jeder Handgriff über Leben und Tod entscheidet.'
