  title: ERF - Jess Talkwerk - Zerbrechlich - und trotzdem stark
  subtitle: ERF - Jess Talkwerk - Zerbrechlich - und trotzdem stark
  description: Als sein Cousin ermordet wird, gerät Sven in Sucht und Depression. Auf einer Jugendfreizeit bittet er Jesus um Hilfe - dann verändert ein Traum sein Leben. Esther lebt mit Glasknochen. Viele Brüche, Operationen und Einschränkungen prägten ihre Kindheit. Heute lebt sie selbstständig und spricht darüber, was ihr Halt gibt. Im Talkwerk erzählt Sarah Selle von ihrer Endometriose, dem Weg zur Diagnose und warum die Krankheit sie bis heute besonders beim Kinderwunsch beschäftigt.
