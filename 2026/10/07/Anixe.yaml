  title: Vier Frauen und ein Todesfall - Notlügen
  subtitle: Vier Frauen und ein Todesfall - Notlügen
  description: Siegfried Kraller ist ein unguter Typ, der nicht nur seine Frau und seinen Sohn tyrannisiert, sondern auch seinen friedvollen Nachbarn und alle jene die bei diesem im Garten fernöstliche Lebenskunst erlernen wollen. Keiner trauert auch nur einen Augenblick, als Kraller, eines Morgens von einer Giftschlange aus seinem Terrarium gebissen, tot aufgefunden wird. Friedvoll beschäftigen sich derweil der Wirt Salchegger und Julies Lover, der desertierte Dorfpfarrer Raphael, mit der Vorbereitung ihres Passionsspiels. Und der Haubenkoch Franzi präsentiert seine ganz neue Naturküche. Dass sich der Ex-Postler und Neo-Hilfspolizist Toni in Pippa verknallt hat, nötigt Julie zu einem überraschenden Bekenntnis.
