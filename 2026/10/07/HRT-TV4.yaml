  description: 'U Split dolaze najmoćniji europski političari: od Ursule von der Leyen preko Emmanuela Macrona do Giorgie Meloni. Uz ostalo, razgovarat će i o europskoj sigurnosti koja je teško ugrožena današnjim navodnim napadom nepoznatih dronova na brodove u bugarskim vodama u Crnome moru. Jedan je potonuo, a posada nestala. Je li to izravni ruski udar na članicu NATO-a? Jesu li u pravu oni koji tvrde da upravo počinje Treći svjetski rat? Gosti su: Davor Ivo Stier, zastupnik u Europskom parlamentu (HDZ),  Joško Klisović, međunarodni tajnik SDP-a, Ivo Lučić, rektor Sveučilišta obrane i sigurnosti "Dr. Franjo Tuđman", Denis Avdagić, vanjskopolitički analitičar.'
