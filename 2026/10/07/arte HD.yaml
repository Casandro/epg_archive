  title: Nationalparks im Baltikum
  subtitle: 'Estland: Nationalpark Lahemaa'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'An der estnischen Ostseeküste, ganz im Norden des Landes, liegt ein großes Naturschutzgebiet: der Lahemaa-Nationalpark. Seit 1971 steht die ganze Region unter Naturschutz, damit war Lahemaa der erste Nationalpark in der gesamten Sowjetunion. Entlang der Küste erstrecken sich vier Halbinseln, sieben Flüsse und ein riesiges Urwaldgebiet.'
- eventId: 740001
  start: 2026-10-07T07:10:00Z
  stop: 2026-10-07T07:55:00Z
  title: Nationalparks im Baltikum
  subtitle: 'Estland: Nationalpark Soomaa'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Nationalpark Soomaa ist wild, fast menschenleer und vor allem feucht. Ein Wildnis-Gebiet, fast einzigartig in Europa. Riesige von Wäldern umrandete Moore, artenreiche sumpfige Grasländer und blütenreiche Laubwiesen. Bekannt ist der Nationalpark für das nach der Schneeschmelze entstehende Hochwasser, die sogenannte fünfte Jahreszeit.
- eventId: 740002
  start: 2026-10-07T07:55:00Z
  stop: 2026-10-07T08:40:00Z
  title: Nationalparks im Baltikum
  subtitle: 'Lettland: Nationalpark Gauja'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Eine unvergleichliche biologische Vielfalt, malerische Landschaften und einzigartige Naturdenkmäler prägen den Gauja-Nationalpark. Er beherbergt über 200 Tier- und 900 Pflanzenarten. Mittelalterliche Burgen und archäologische Ausgrabungsstätten zeugen von der langen Siedlungsgeschichte. Sanfter Tourismus ist im Nationalpark erlaubt.
- eventId: 740003
  start: 2026-10-07T08:40:00Z
  stop: 2026-10-07T09:25:00Z
  title: Nationalparks im Baltikum
  subtitle: 'Litauen: Nationalpark Kurische Nehrung'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Kurische Nehrung, eine schmale Halbinsel im Westen Litauens, ist ein lebendiges Beispiel für das Wechselspiel von Mensch und Natur. Nachdem die Landschaft abgeholzt wurde, begräbt der Sand ganze Dörfer, erst die Wiederaufforstung macht ein Leben an der Küste möglich. Heute ist die Landschaft des Unesco-Welterbes als Nationalpark geschützt.
