  title: '"Рецепты женского счастья" -- №25 Как воспитать принцессу?'
  subtitle: '"Рецепты женского счастья" -- №25 Как воспитать принцессу?'
  description: Это яркая, красивая программа, во время которой четыре подруги встречаются на уютной кухне и обсуждают вопросы, волнующие каждую женщину - семья, дети, карьера, домашний уют, увлечения, психология, мода и многое другое. Каждая найдет в этой передаче что-то для себя, а в героинях - собственные черты. Наталья - прагматичный романтик. Елена - идеалистка и мечтательница. Оксана - обожает детей и хочет делать добрые дела. Светлана - гостеприимная хозяйка, мудрая, очаровательная женщина. Четыре, такие разные, женщины найдут ключ к решению любой проблемы, дадут совет, найдут ободряющее слово, развеселят... Программа будет интересна домохозяйкам и карьеристкам, молодым мамам и незамужним девушкам. После просмотра у зрительниц останется хорошее настроение и желание встретиться с новыми подругами снова и снова.
