  title: '"Лофт тайм" -- №9 Теплое христианство ч. 2'
  subtitle: '"Лофт тайм" -- №9 Теплое христианство ч. 2'
  description: 'В программе обсудим актуальные проблемы молодежи и подростков. Ведущий - музыкант, автор и исполнитель песен, автор проекта "Иди, беги, лети!" Роман Русаненко. На повестке дня: гражданский брак, биткоины, курение электронных сигарет, веганизм, татуировки, гомосексуализм, субкультуры, "лайкозависомость" и соцсети - модные тренды и отношение к ним христианской Церкви. Поп-музыка, сериалы, интернет-ресурсы и комьюнити, популярные герои медийного пространства - христианская молодежь и современная массовая культура. Также порассуждаем о современных видах евангелизации, обсудим, как начать служить, что есть свобода, кто такие "ДВР" и о многом другом.'
