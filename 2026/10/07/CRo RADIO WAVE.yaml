  title: 'Ztělesnění 4: That Girl'
  description: Kulatý zadek, úzký pas, vyrýsované svaly - to je ideál That Girl, jehož dosažení bývá podmíněné náročnými dietami, nekonečným cvičením a snahou o co nejnižší procento tělesného tuku. Poslechněte si, kde je u fitness trendu hranice mezi disciplínou a nebezpečnou posedlostí. Disciplína, kontrola jídla a překonávání vlastních limitů jsou v naší společnosti často vnímané pozitivně. Právě proto může být těžké poznat, kdy už zdravý režim zašel příliš daleko. S Markétou Gajdošovou mluvíme o ortorexii nebo poruchách příjmu potravy u profesionálních i rekreačních sportovců.
