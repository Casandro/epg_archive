  title: Hubert und Staller (68)
  subtitle: Fahr zur Hölle
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Girwidz, Hubert und Staller sind auf dem Weg zum Bahnhof, um dort Girwidz' Neffen Jannis abzuholen. Der 16-Jährige soll ein Schülerpraktikum bei der Polizei absolvieren. Aber schon bald geraten die drei in einen Stau. An der grünen Ampel blockiert eine dunkle Limousine den Verkehr. Gleich dahinter befindet sich Taxifahrer Hans Hauser, der den Fahrer vor ihm wüst beschimpft. Doch der kann gar nicht weiterfahren, denn er ist tot. Die Befragung ergibt, dass der Verstorbene für Taxler Hauser kein Fremder war. Bei der Leiche handelt es sich um Jörn Gruner, der mit seinem Fahrservice per App den Taxifahrern ein Dorn im Auge war.
