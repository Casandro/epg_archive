  title: Folklorní okénko
  subtitle: Cimrmanova akustická konstanta v lidové písni (podruhé)
  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 31.12.2023 * Na podkladě přednášky dr. Miloně Čepelky uvádějící hru Hospoda na mýtince o významu tzv. akustické konstanty v díle Járy Cimrmana pokračujeme v důkladné analýze četnosti této citoslovné zvukové anomálie v české a moravské lidové písni. Postupně mapujeme užití jednotlivých velmi variabilních koncovek veršů, ba přímo refrénů - a nacházíme stále další a další. Od víceméně obyčejných "duli-duli-dej" nebo "čhajlom-hajlom-tradadydy-trajlom" ke zvukomalebným "holarijá-rijá-dom", "hoj-dydlá-hojdydlá" nebo "klinka-klinka-klimprdálum-ostruhárum". Doloženo opět četnými hudebními ukázkami. K poslechu zve Helena Bretfeldová.'
  genre:
  - '99'
