  title: In aller Freundschaft (320)
  subtitle: Eine Nacht mit Folgen
  description: 'Der achtjährige Finn Becker wird in die Sachsenklinik eingeliefert. Er hat sich beim Fußballtraining einen Arm ausgekugelt und wird von Dr. Brentano behandelt. Finns Mutter Isabelle und der Arzt kennen sich von einer Party vor neun Jahren. Damals haben sie eine Nacht miteinander verbracht. Dr. Brentano stellt bei Finn Asthma fest. Außerdem treibt ihn ein anderer Gedanke um: Könnte es sein, dass Finn sein Sohn ist? Isabelle bestätigt Philipps Theorie: Ja, es könnte sein. Arzu, der diese Neuigkeiten schwer zu schaffen machen, möchte, dass ihr Mann einen Vaterschaftstest macht. Auch Isabelle stimmt zu.'
