  title: DAS! Rote Sofa
  subtitle: 'Gast: Anna Osicki, Autorin, Content Creatorin und Speakerin'
  description: |-
    Anna Osicki: eine junge Frau, die mit ihrer
    Lebenskraft und Resilienz Hunderttausende Menschen
    inspiriert. Nach einer vermeintlich harmlosen Knieoperation im Jahr 2017 infizierte sie sich mit einem multiresistenten Krankenhauskeim, was einen jahrelangen, qualvollen Leidensweg auslöste. Nach über 30 Operationen und lebensbedrohlichen Blutvergiftungen stand sie vor dem radikalsten Entschluss ihres Lebens: Sie entschied sich bewusst für die Amputation ihres Beines. In ihrem gerade
    erschienenen Buch "Komme was wolle - Ich gehe weiter" blickt sie offen und schonungslos auf diese Zeit voller Angst, aber auch voller Hoffnung zurück.
