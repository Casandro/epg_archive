  description: Der Surfer Daniel Dellbrück treibt leblos im Wasser, er wurde Opfer von gezielten Schlägen - mit einem Paddel? Jede Rettung kommt zu spät. Jedenfalls ist Julia zutiefst erschrocken, als sie ihren Stand-up-Paddling (SUP)-Yoga-Lehrer erkennt. Sie will seiner Frau Catrin die Nachricht persönlich überbringen. Catrin ist die Alleinerbin der SUP-Schule und eines großen Grundstücks, auf das es auch Investoren unter Leitung von Manfred Tresko abgesehen haben. Sein Sohn Ben greift zu einer Zermürbungsstrategie. Für die Witwe wird es eng, als Pirmin herausfindet, dass Daniel einen Ehe-Vertrag aufgesetzt hat. Traute er seiner Frau nicht?
