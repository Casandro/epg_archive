  description: '"Die Nordreportage" feiert 20. Geburtstag! Anlässlich dieses Jubiläums begleitet der NDR erneut Rolly in ihrem Imbiss und zeigt einen Ort, an dem Hausmannskost, Zusammenhalt und echte Gastfreundschaft gelebter Alltag sind. Ihr Trucker-Stop ist für viele Gäste ein Stück Heimat und zieht inzwischen sogar Fans aus weiter entfernten Städten an. Unterstützt wird Rolly von ihrem Team. Trotz ihrer wachsenden Bekanntheit bleibt Rolly bodenständig. Neben dem Imbiss spielen auch ihre Familie und eine kurze tägliche Auszeit zum Schwimmen eine wichtige Rolle in ihrem Leben.'
