  title: 'Lesung | Angelika Klüssendorf: Trost (2|12)'
  description: |-
    Wie findet man Trost in einer aus den Fugen geratenen Welt?  Die Figuren in Angelika Klüssendorfs neuem Roman suchen jeweils individuelle Antworten auf diese Frage. Allen ist gemeinsam, dass sie im Jahr 2022, das unter dem Zeichen der Pandemie und dem russischen Überfall auf die Ukraine steht, ihren Weg zu Menschlichkeit, Verlässlichkeit und Liebe gehen. Eine ungekürzte Lesung mit Corinna Harfouch.

    Wird wiederholt um 17:00 Uhr.
