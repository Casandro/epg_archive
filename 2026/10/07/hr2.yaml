  title: Kaisers Klänge - Musikalische Entdeckungsreisen
  subtitle: Dem Himmel entgegen - Die Musik vom Fliegen
  description: |-
    Der Traum vom Fliegen ist so alt wie die Menschheit selbst - und die Musik hat ihn schon immer begleitet. Komponisten setzten dem Vogelflug ein Denkmal, reisten in ihrer Fantasie zu den Wolken hinauf und brachten später sogar das Knattern und Donnern von Propellermaschinen und Düsenjets bis in den Konzertsaal.

    Wird wiederholt am 11.10.2026.
