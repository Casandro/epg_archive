  title: Wer kann das bezahlen? Pflege im Alter - Das kostet der Ruhestand
  subtitle: 'Moderation: Anna Planken'
  description: 'Anna Planken trifft Menschen in NRW und spricht mit ihnen über Geld. Während die Hälfte der Menschen in Deutschland weniger als 2000 Euro netto verdient, gibt es gleichzeitig immer mehr Einkommensmillionäre. Viele spüren, dass sie auf ihrem Konto am Monatsende weniger übrig haben. Anna Planken: "Alles wird teurer, egal in welchen Bereich wir gucken:  Essen, Trinken, Klamotten, Möbel. Und wir wollen uns ja nicht nur versorgen. Wie schaffen wir es den kleinen Luxus in den Alltag zu bringen? Wir suchen nach Strategien, sich trotzdem noch was gönnen zu können".'
