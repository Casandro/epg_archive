  description: Die Dokumentation "Tanz um Tabu" begibt sich auf eine Reise durch ein Deutschland im Wandel. Zwischen Bahnhofsvierteln, Schützenfesten, migrantisch geprägten Stadtteilen und Rheinromantik erkundet sie eine Nation zwischen Verlustgefühl, Fortschrittserzählung und der Suche nach einem neuen Wir.
- eventId: 1560226
