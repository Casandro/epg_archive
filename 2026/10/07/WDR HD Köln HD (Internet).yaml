  title: Mordlichter - Tod auf den Färöer Inseln
  subtitle: Spielfilm Deutschland 2025
  description: "Die nordatlantischen Färöer-Inseln dienen als von rauer See umtoster Schauplatz eines ungewöhnlichen Thrillers: Auf der Suche nach einem aufwühlenden Geheimnis begibt sich die Journalistin Johanna zwischen die Fronten eines erbitterten Konflikts zwischen einheimischen Traditionalisten und internationalen Walschützern. \nDie dünn besiedelte Inselgruppe mit stillen Fjorden wird zu einem Pulverfass, das nach einem mysteriösen Mordfall hochzugehen droht. An der Seite der mutigen Ermittlerinnenfigur Johanna, gespielt von Odine Johne, sind Jan Krauter als Inselpolizist und Henning Baum als aktivistischer Skipper zu sehen."
