  title: Sea Patrol - Der letzte Fang
  subtitle: Sea Patrol - Der letzte Fang
  description: Nikki ist überglücklich als ET ihr einen Heiratsantrag macht. Er verrät ihr auch, dass er aus der Marine austreten möchte um sich ganz seinem Hobby, dem Korallentauchen, hinzugeben. Bald bricht ET zu einem neuen Auftrag auf, doch als die Hammersley überraschend auslaufen muss, ist er noch nicht zurückgekehrt. Kurz darauf macht die Crew einen entsetzlichen Fund. AU 2009
  ageRating: 12
- eventId: 1469535
