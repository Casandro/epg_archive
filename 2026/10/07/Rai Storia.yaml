  title: Passato e presente Operazione Enduring F
  subtitle: Passato e presente Operazione Enduring Freedom - ''Una battaglia per difendere non solo gli Stati Uniti, ma anche il diritto di chiunque, nel mondo, di vivere e crescere i propri figli liberi dalla paura''
  description: |-
    . Così il presidente George W. Bush presenta l'operazione Enduring Freedom, lanciata il 7 ottobre 2001, a mano di un mese dalle torri Gemelle. Una coalizione internazionale a guida americana per rispondere agli attacchi terroristici dell'11 settembre. E' l'inizio della guerra in Afghanistan, un conflitto che, nelle attese, raggiungerà rapidamente i suoi obiettivi: annientare Al-Qaeda e colpire il regime dei talebani, il gruppo fondamentalista al potere in Afghanistan. Sarà, invece, l'inizio di una lunga guerra, nella quale gli Stati Uniti e i loro alleati investiranno ingentissime risorse militari ed economiche. Attraverso diverse stagioni politiche, Enduring Freedom cambierà progressivamente forma, espandendo e modificando i propri obiettivi. In studio con Paolo Mieli, il professor Gastone Breccia. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Gastone Breccia Con la partecipazione di Carla Oppo
