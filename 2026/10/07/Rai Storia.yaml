  stop: 2026-10-07T05:30:00Z
  title: Il tesoro di Assisi
  subtitle: 'Il 26 settembre 1997, un devastante terremoto colpì l''Umbria, scuotendo le fondamenta non solo degli edifici, ma della storia stessa. La Basilica di San Francesco ad Assisi, sede di uno dei cicli di affreschi più iconici del '
  description: "Medioevo, crollò parzialmente. In pochi secondi, oltre 300.000 frammenti di genio artistico giacevano in frantumi sul pavimento della basilica. Ma da questa tragedia emerse il più grande e ambizioso progetto di restauro artistico della storia. Questo film ripercorre il viaggio di 25 anni di scienziati, artisti e visionari, che hanno lavorato per ricomporre gli affreschi che un tempo hanno portato alla luce la vita e il messaggio di San Francesco. Oggi il restauro continua con la tecnologia digitale all'avanguardia e ci stia consentendo di ripristinare virtualmente colori perduti, sottigliezze tonali e unità compositiva, rendendo visibile ciò che un tempo era irrimediabilmente perduto. - \n\nRegia di Paolo Colangeli"
