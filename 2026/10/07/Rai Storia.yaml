  subtitle: Passato e presente La Belle Epoque luci e ombre - Belle Époque. Un'espressione che evoca luci, eleganza e fiducia nel futuro. È una rivoluzione - del tempo e dello spazio - quella che si verifica in Occide
  description: nte tra fine Ottocento e primi del Novecento. Sono gli anni delle grandi città, dei caffè, dei boulevard, delle strade illuminate dalla luce dei lampioni. dei lunghi viaggi in treno, delle automobili e del cinematografo. In un'Europa che si sente al centro del mondo, il progresso avanza veloce e tutto appare così sfolgorante che gli storici hanno chiamato quest'epoca della belle époque. Eppure, dietro il progresso e la modernità si allungano ombre, brucianti contraddizioni e quell'epoca apparentemente sfavillante è già attraversata da forti tensioni. In studio con Paolo Mieli, la prof.ssa Fiamma Lussana. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio la prof.ssa Fiamma Lussana Con la partecipazione di Maria Sole Sanasi
