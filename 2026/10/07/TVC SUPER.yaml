  title: Winnice miłości 1 (odc. 23)
  subtitle: W Londynie Achilleas, po otrzymaniu anonimowego telefonu, martwi się o życie swoich braci. Tymczasem na farmie rodziny Giannakakis odbywa się zwyczajowy i tradycyjny festiwal raki - alembic.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    W Londynie Achilleas, po otrzymaniu anonimowego telefonu, martwi się o życie swoich braci. Tymczasem na farmie rodziny Giannakakis odbywa się zwyczajowy i tradycyjny festiwal raki - alembic. Kreteńskie tańce, tradycyjne rytuały i kreteńskie zwyczaje pięknie łączą się ze sobą, tworząc odurzającą atmosferę. Wszyscy jednak starają się ukryć swoje tajemnice i pasje. Anastasia wciąż prowokuje Mattheosa. Po festiwalu następuje szybki rozwój wydarzeń.
  ageRating: 12
