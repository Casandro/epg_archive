  subtitle: Para turystów zwiedza ruiny zamku, w którym nakręcono film grozy. Odkrywają, że główna aktorka filmu została powieszona wśród manekinów w ten sam sposób, jak odgrywana przez nią postać.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2014
    Reżyseria: Vincent Giovanni
    Występują: Xavier Deluc, Franck Sémonin, Manon Azem, Chrystelle Labaude, Vincent Primault, Julie Fournier
    Para turystów zwiedza ruiny zamku, w którym nakręcono film grozy. W jednej z sal natrafiają na makabryczną scenę ? trzech kołyszących się na sznurach wisielców. Na szczęście są to tylko manekiny, a wszystko jest dokładną repliką najważniejszej sceny nakręconego tu filmu. Wkrótce jednak horror staje się rzeczywistością. Turyści odkrywają, że główna aktorka filmu została powieszona wśród manekinów w ten sam sposób, jak odgrywana przez nią postać.
