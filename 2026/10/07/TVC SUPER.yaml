    Tytuł oryginalny: Meurtres ?...
    FR, 2021
    Reżyseria: Laurent Dussaux
    Występują: Evelyne Bouix, David Kammenos, Nadia Roz, Cécile Brune, Juliette Aver, Fred Epaud
    Na plaży przy Pointe du Raz zostaje odnalezione ciało starszej kobiety. Początkowo wygląda to na nieszczęśliwy wypadek, lecz śledztwo ujawnia związek z bretońską legendą o Ankou. Kapitan Jérémy Meyer wraz z nową partnerką, kapitan Marie Leroy, odkrywają mroczne sekrety mieszkańców wybrzeża.
