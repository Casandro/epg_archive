  title: Pip und Posy
  subtitle: Zac, die kleine Meerjungfrau
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Zac, die kleine Meerjungfrau

    Pip und Posy backen "Sandkuchen", und Zac hat sich bis zum Bauchnabel im Sand eingebuddelt. Posy findet, dass er aussieht wie eine kleine Meerjungfrau. Es fehlt nur noch etwas Muschel-Deko.

    Die Freunde beschließen, seinen Meerjungfrauenschwanz mit hübschen Schuppen zu verzieren. Pip sammelt dafür viele verschiedene Steinchen, und Posy häuft kunterbunte Blätter an. Doch diese verschwinden immer wieder.

    Posy verdächtigt Pip, dass er die Blätter einfach weggenommen hat. Der streitet das entschieden ab, aber Posy glaubt ihm nicht - bis sie entdeckt, dass es Ameisen sind, die die Blätter eines nach dem anderen wegtransportieren. Jetzt hat Posy ein schlechtes Gewissen, dass sie Pip nicht vertraut hat, und entschuldigt sich bei ihm. Aber der ist ihr nicht böse - und die beiden stellen gemeinsam fest, dass die Ameisen mit ihren Füßchen ein richtig tolles Muster auf dem Meerjungfrauenschwanz hinterlassen haben.
    Regie: Seán McCormack
    Buch/Autor: Mariama Ives-Moiba, Matt Baker
    Musik: Ellie Wyatt, Joss Peach
    HD-Produktion
