  title: Sesamstraße
  subtitle: Der wacklige Tisch
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lernen mit Spaß für Kinder

    Der wacklige Tisch

    Im Café sitzend freut sich der Blaue auf ein Eis, aber dann erkennt er Grobi als Kellner und er ahnt: Das geht schief!

    Elmo hat für Julia ein Bild mit einem Regenbogen gemalt. Die Farben sind sehr schön, aber der Bogen ist weniger ein Bogen, sondern eher ein Rechteck. Mit Julias Hilfe lernt Elmo, wie ein Bogen aussieht.

    Ernie bietet Bert an, seinen Streifenpullover zu malen. Bert ist begeistert. Die senkrechte Lage der Streifen bereitet Ernie allerdings Kopfzerbrechen. Da hat er eine Idee, wie er das lösen kann... Sehr zu Berts Leidwesen.

    Wandern findet Henry, 9, so richtig öde. Gut, dass er eine Idee hat, wie er sich hier draußen in der Natur noch bewegen kann. Beim Slalom laufen um die Bäume passt er auf, dass er keinen Baum umrennt. Und balancieren geht am besten, wenn er die Arme ausstreckt wie ein Vogel. Am coolsten findet Henry Klettern, aber Weitsprung und Zickzack springen gehören auf jeden Fall auch zu seinen Lieblingsbewegungen. Für ihn ist der Wald ein riesiger Abenteuerspielplatz!

    Die Sonne scheint und Kiwi möchte gerne in seinem Liegestuhl liegen und ein bisschen lesen. Aber Strit hat andere Pläne, er will Fußball spielen. Weil Kiwi das aber stört, schießt er den Fußball tief in den Wald. Wie gemein!
    Regie: Dirk Nabersberg, Jojo Wolff

