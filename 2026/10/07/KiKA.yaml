    Was verändert sich im Herbst?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" gibt es heute eine ganz besonders lange Folge von Charlie und Lola. Nach den Ferien geht die Schule wieder los und in der Zwischenzeit hat sich einiges verändert: Die Bäume verlieren im Herbst ihre Blätter, in Lolas Klasse gibt es eine andere Sitzordnung und auch die Klassenlehrerin ist neu. Das gefällt Lola überhaupt nicht. Als auch noch Lolas und Lottas großes Herbst-Bild für das Herbstfest in der Schule misslingt, gibt es für die beiden nur noch eine Lösung: sie beschließen, einen Winterschlaf zu halten und erst im Frühjahr wieder rauszukommen. Jetzt ist Charlie gefragt. ...
