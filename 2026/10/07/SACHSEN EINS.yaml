  title: Lieblingsorte 2026
  subtitle: Lieblingsorte 2026 - ein Besuch am Balaton
  description: 'Den Balaton mit allen Sinnen erleben: Lilly Marlene Kistner riecht den Duft von Lavendel, probiert süße und überraschend gewöhnungsbedürftige Spezialitäten und spürt den See beim Segeln und Kajakfahren aus nächster Nähe. Zwischen Tihany, Balatonfüred, Siófok und Balatonföldvár entdeckt sie außerdem jahrhundertealte Klostermauern, besondere Kulturorte und versteckte Wege abseits des Ufers. In Hévíz taucht Lilly in warmes Thermalwasser ein, kostet sich durch den Bauernmarkt und genießt die Ruhe des Schutzwaldes. In Sümeg wird es schließlich laut und lebendig: Zwischen prachtvollem Palast, mittelalterlicher Burg, Ritterturnier und Festmahl scheint die Zeit plötzlich rückwärtszulaufen. Eine Reise voller Düfte, Geschmäcker, Geräusche und überraschender Begegnungen und die Frage: Wie fühlt sich der Balaton an, wenn man ihn mit allen Sinnen entdeckt?'
