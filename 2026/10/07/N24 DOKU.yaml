  title: 'Strip the Cosmos: Rätsel der Milchstraße'
  subtitle: 'Strip the Cosmos: Rätsel der Milchstraße'
  description: '2015 machen Astronomen eine beunruhigende Entdeckung: Hunderttausende Galaxien überall im Universum werden dunkler. Einige von ihnen haben in den vergangenen zwei Milliarden Jahren die Hälfte ihrer Leuchtkraft eingebüßt. Zu den runtergedimmten Sternenansammlungen gehört auch unsere Milchstraße. Der Energiekreislauf im Universum scheint gestört zu sein. Was steckt hinter dem Phänomen, und was bedeutet es für das Leben auf der Erde? Mögliche Antworten gibt ein Blick ins Zentrum der Milchstraße.'
