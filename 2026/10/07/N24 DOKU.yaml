  title: 'Marvellous Machines: Superkräfte'
  subtitle: 'Marvellous Machines: Superkräfte'
  description: Wer würde sich nicht gerne mal wie ein Superheld fühlen? Mit dem Jetsuit eines britischen Unternehmens kann man sich mühelos in die Lüfte erheben und über den Himmel jagen. Der Harvesterkopf einer finnischen Firma fällt und entastet einen Baum binnen Sekunden und unterstützt obendrein eine verantwortungsvolle Forstwirtschaft. Und ein 3D-Drucker aus Dänemark erschafft auf Knopfdruck perfekt designte Häuser aus schnelltrocknendem Beton in fast jeder gewünschten Form.
  widescreen: true
