  title: Die Porschemeister - Wiedergeburt eines 911
  subtitle: Die Porschemeister - Wiedergeburt eines 911
  description: 'Der Traum vieler Oldtimersammler und eine Legende: der Porsche 911. Seine Restauration ist zeitaufwendig, benötigt Geduld und eine feine, spezifische Handwerkskunst. Manfred Hering gründete 2003 einen Manufakturbetrieb, der sich auf die Wiederbelebung von Porsches spezialisiert hat. Es handelt sich nicht um einen profit- und effizienzorientierten Betrieb, sondern um 85 Mitarbeiter, die eine Herzenskunst verrichten. Ihr Ziel: mit präziser, sauberer Arbeit einen Original-Porsche zu restaurieren.'
  widescreen: true
- eventId: 1479570
