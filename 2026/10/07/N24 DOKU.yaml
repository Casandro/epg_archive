  title: 'Border Patrol Südamerika: Vergangenheit im Gepäck'
  subtitle: 'Border Patrol Südamerika: Vergangenheit im Gepäck'
  description: 'Am Flughafen von Santiago de Chile stehen die PDI-Beamten vor gleich zwei heiklen Situationen: Eine Reisegruppe aus dem Norden gibt Rätsel auf, als sich ihr angeblicher Tourist als Arbeiter entpuppt - und ihr Gepäck überraschende Funde bereithält. Kurz darauf landet ein aus den USA abgeschobener Chilene. Was zunächst Routine scheint, wird brisant, als seine kriminelle Vergangenheit ans Licht kommt. Zwei Einsätze, ein Ziel: die Grenze zu schützen.'
  widescreen: true
