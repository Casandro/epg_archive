  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  description: Einige Menschen behaupten, sie seien von Außerirdischen entführt worden. Einer der wohl bekanntesten Vorfälle dieser Art ereignete sich in West Yorkshire. Der Polizist Alan Godfrey war im November 1980 früh morgens in seinem Streifenwagen unterwegs. Als plötzlich ein strahlend weißes Licht vom Himmel leuchtete, kam sein Auto unvermittelt zum Stehen. Eine halbe Stunde später kam er dreißig Meter entfernt wieder zu Bewusstsein und erinnerte er sich nur daran, dass er nach seinem Funkgerät griff.
