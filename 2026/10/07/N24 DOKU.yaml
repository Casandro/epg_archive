  title: 'Border Patrol Südamerika: Der Fahrradkurier'
  subtitle: 'Border Patrol Südamerika: Der Fahrradkurier'
  description: 'Am Flughafen von Santiago de Chile läuft die Arbeit der Zollbeamten auf Hochtouren: In einem Frachtpaket voller Fahrradstoßdämpfer entdecken sie mithilfe des Röntgenscanners verdächtiges organisches Material. Währenddessen sorgt ein Passagier aus Miami mit übergroßem Gepäck und fehlenden Quittungen für Aufsehen - und ein Diebstahl im Duty-Free-Shop entpuppt sich als interner Betrug.'
  widescreen: true
