  title: Offroad-Monster - Der steinige Weg zum eigenen Fernreisemobil
  subtitle: Offroad-Monster - Der steinige Weg zum eigenen Fernreisemobil
  description: 'Diese Karossen lassen zweifelsohne jedes Camper-Herz höher schlagen: Individuell gestaltete und extravagant eingerichtete Fernreisemobile sind der letzte Schrei auf dem Caravanmarkt - zumindest für diejenigen Hobbycamper, die sich die ausgefallenen Modelle leisten können. Den Offroad-Gefährten und rollenden Luxus-Suiten sind preislich keine Obergrenzen gesetzt. Wer sind die Besitzer der teuersten Wohnmobile hierzulande, und wie sieht es unter den Motorhauben ihrer rollenden Heime aus?'
