  title: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  subtitle: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  description: Entlang der 2.000 Meilen langen Grenze zwischen Texas und Mexiko arbeiten Grenzbeamte an einem der sensibelsten Übergänge der Welt. Täglich müssen sie den legalen Verkehr ermöglichen und gleichzeitig gefährliche Schmuggelware stoppen. Diese Folge begleitet sie bei riskanten Einsätzen, einer heiklen Übergabe mutmaßlicher Kartellmitglieder, bewegenden Asylgeschichten und Momenten, in denen persönliche Schicksale auf harte Grenzrealität treffen.
  widescreen: true
