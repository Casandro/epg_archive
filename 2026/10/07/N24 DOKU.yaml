  stop: 2026-10-07T06:30:00Z
  title: 'Border Patrol Neuseeland: Brexit mal anders'
  subtitle: 'Border Patrol Neuseeland: Brexit mal anders'
  description: 'Nicht jeder, der nach Neuseeland will, hält sich an die Regeln - manchmal nur an seine eigenen.   An der Grenze treffen Beamte auf einen Briten, der seinen ganz persönlichen Brexit plant. Im Mailzentrum sorgt ein auffälliges Paket für Aufmerksamkeit - Glückstreffer oder Fehlalarm? Und: Eine angespannte Verfolgungsjagd in der Bay of Islands erfordert polizeiliche Verstärkung.'
  widescreen: true
- eventId: 1479444
  start: 2026-10-07T06:30:00Z
  stop: 2026-10-07T06:58:00Z
  title: 'Border Patrol Neuseeland: Katzenjammer'
  subtitle: 'Border Patrol Neuseeland: Katzenjammer'
  description: 'Unerwartete Vorfälle halten die Grenzbehörden in Atem: Eine US-Amerikanerin sorgt mit einem ungewöhnlichen Schmuggelversuch für Aufsehen, während der Zoll in einem Stofftier eine brisante Entdeckung macht. Auf See eskaliert die Situation, als Einheimische die Regeln ignorieren und die Beamten vor eine heikle Entscheidung stellen. Eine Episode voller Spannung, überraschender Wendungen und konsequenter Grenzarbeit.'
  widescreen: true
