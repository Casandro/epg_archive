  title: Máme hosty
  description: Blíží se Podzimní městské slavnosti v Pardubicích, jejichž vrcholem je nejtěžší kontinentální překážkový dostih. Jaký bude multižánrový festival v ulicích města? S Jaroslavem Müllerem a Janou Fiedlerovou pozveme na bohatý program a už 136. Velkou pardubickou, a to v roce, kdy samotné dostihové závodiště slaví 170 let od svého založení. Moderuje Jakub Malý.
