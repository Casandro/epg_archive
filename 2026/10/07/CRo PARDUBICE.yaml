  title: Radioporadna
  description: Třetí týden v říjnu se v chovatelském areálu v Holicích koná významná akce. Základní organizace Českého svazu chovatelů slaví 105. narozeniny a při té příležitosti pořádá jubilejní 20. krajskou výstavu drobného zvířectva se soutěží okresů. Pozveme vás a představíme holická želízka v ohni, která se týkají chovu drůbeže, králíků a holubů. Moderuje Jitka Slezáková.
