  title: Urlaubschecker ferngesteuert
  subtitle: Tourismus
  description: |-
    Sehen Sie mit den Augen eines Urlaubscheckers, als wären es Ihre eigenen Augen!
    Bei der neuen 15-minütigen Sendung "Urlaubschecker ferngesteuert" gibt es eine spannende Neuheit:
    Wie gewohnt präsentiert Ihnen sonnenklar.TV interessante Urlaubsreiseangebote.
    Doch während dieser Sendung schreiben Sie in Echtzeit dem sonnenklar.TV - Außenreporter mit Hilfe von Facebook, wohin er sich mit seiner Kamera begeben soll. Sie können ihn dorthin steuern, was Sie bspl. an der Hotelanlage des präsentierten Reiseangebots besonders interessiert. Sofern machbar, überträgt der Urlaubschecker die Live-Bilder hiervon dann direkt zu Ihnen auf den Fernsehbildschirm bzw. auf den sonnenklar.TV - Stream.
    Was möchten Sie sich also bei dem Angebot genauer ansehen? Einen Poolbereich, eine Bar?
    Link zu Facebook: www.facebook.com/ sonnenklar.TV.
