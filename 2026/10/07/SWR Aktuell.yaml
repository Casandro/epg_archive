- eventId: 892553
  start: 2026-10-07T16:30:00Z
  stop: 2026-10-07T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Jüdisches Leben in Deutschland - Sichtbar bleiben trotz Bedrohung
  description: |-
    Von Lissy Kaufmann
    Parolen auf Häuserwänden, Beschimpfungen, Angriffe auf der Straße - in Deutschland hat der Antisemitismus seit dem Hamas-Angriff am 7. Oktober 2023 und Israels militärischer Reaktion stark zugenommen. Jüdinnen und Juden fühlen sich zunehmend bedroht und vom Staat allein gelassen. Trotz politischer Solidaritäts-Bekundungen denken viele ans Auswandern. Manche ziehen sich ins Private zurück, andere kämpfen dafür, dass jüdisches Leben sichtbar bleibt. Aber alle sagen: Der neue, alte Antisemitismus bedroht jüdisches Leben in Deutschland grundsätzlich.
- eventId: 892554
  start: 2026-10-07T17:00:00Z
  stop: 2026-10-07T18:00:00Z
  title: Der Tag
  description: Am 7. Oktober 2023 überfielen Kämpfer der Hamas und anderer extremistischer Organisationen Israel. Sie töteten rund 1200 Menschen in Israel und verschleppten mehr als 250 Geiseln. Die israelische Regierung reagierte mit dem Gaza-Krieg, mit Zerstörung und Vertreibung der Menschen im Gaza-Streifen, Zehntausende starben. Offiziell herrscht seit einem Jahr eine Waffenruhe. Am 27. Oktober steht in Israel eine Parlamentswahl an. Wie prägen heute die Ereignisse vom 7. Oktober und der folgende Gaza-Krieg die israelische Gesellschaft? Wie sieht das Leben im Gaza-Streifen aus?
  subtitle: Drei Jahre nach dem Hamas-Überfall - Was der 7. Oktober verändert hat
