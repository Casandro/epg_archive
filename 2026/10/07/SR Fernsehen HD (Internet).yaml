  title: Doc Fischer
  subtitle: 'Moderation: Derek Zieker-Fischer'
  description: |-
    * Folsäure - wie viel braucht man?
    In Spinat, Feldsalat und Hülsenfrüchten steckt reichlich Folsäure, ein Vitamin, das der Körper für die Bildung neuer Zellen braucht. Viele ältere Menschen nehmen zu wenig davon auf, die Folgen reichen von Konzentrationsproblemen bis zur Blutarmut. Wer den Speiseplan anpasst, kann viel erreichen: Schonend zubereitetes grünes Gemüse liefert genug Folsäure. Doch mehr ist nicht immer besser. Denn während die natürliche Form aus dem Essen unbedenklich ist, kann synthetische Folsäure aus Tabletten in großen Mengen schaden. Wie kommt man auf die richtige Dosis?
- eventId: 1559212
  start: 2026-10-07T19:00:00Z
  stop: 2026-10-07T19:45:00Z
  title: 'Abenteuer Diagnose: Gefährliches Hobby (5)'
  description: |-
    Medizin als Detektivgeschichte: Was zunächst wie eine harmlose Verletzung aussieht, entwickelt sich für Markus Sander zu einem immer größeren Problem. Seine rechte Hand schwillt an, schmerzt und verändert sich zunehmend. Selbst starke Medikamente bringen keine dauerhafte Besserung. Als sich plötzlich knotige Entzündungen unter der Haut bilden, wächst die Angst: Was steckt hinter diesen mysteriösen Beschwerden?

    Ärztinnen und Ärzte suchen monatelang nach der Ursache. Die Verdachtsmomente reichen von einer Entzündung bis zu Rheuma. Doch keine Erklärung passt wirklich zu Markus' ungewöhnlichem Krankheitsverlauf.
