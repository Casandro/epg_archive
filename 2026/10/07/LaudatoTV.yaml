- eventId: 1423410
  start: 2026-10-07T20:20:00Z
  stop: 2026-10-07T20:35:00Z
  title: Uđi u Arku, Uđi u Arku
  subtitle: Dokumentarni
  description: U društvu postoje predrasude o tome da su osobe s intelektualnim teškoćama teret, često i sramota. Zajednica Arka ruši te predrasude tvrdeći da oni nisu samo ranjiva skupina u društvu koja treba pomoć, nego da i oni svijetu mogu mnogo toga pružiti- radost, autentičnost, ljubav, najtopliju podršku potrebnu svakom od nas i prijateljstvo koje nas mijenja. Uđi u arku poziv je svima da zajedno gradimo čovječnije društvo za svakog njegovog člana.
- eventId: 1423411
  start: 2026-10-07T20:35:00Z
  stop: 2026-10-07T21:30:00Z
  title: Božanstvena komedija
  subtitle: Religijski
  description: 'Vječno pitanje koje se javlja i univerzalna dilema: kako pronaći curu, odnosno dečka. Tko je osnovao i što je KATSUS? U Hrvatskoj možemo primjetiti da je puno više samaca, koji je problem, društvo ili pojedinac? Što Božja riječ govori o traženju žene/muškarca? I za kraj saznajemo koje su najveće greške koje mladi rade prilikom ulaska u vezu? Ovo, za neke nerješivo i osjetljivo pitanje prikazuju na svoj poseban način urednički trojac Božanstvene komedije.'
