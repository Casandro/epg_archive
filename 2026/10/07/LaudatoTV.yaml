  title: Nadbiskup Fulton J. Sheen
  subtitle: Religijski
  description: Na Laudato TV predstavljamo jednu od najpoznatijih medijskih osoba katoličanstva - nadbiskupa Fultona J. Sheena! Video zapisi ovog priznatog intelektualca, filozofa i teologa su iz 1950-tih i 1960-tih godina, ali tehnička zastarjelost ne zasjenjuje njihovu dubinu, jasnoću, živost i aktualnost.
