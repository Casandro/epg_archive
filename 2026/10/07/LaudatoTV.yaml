  title: Život i zdravlje
  subtitle: Magazin
  description: U novoj sezoni emisije Život i zdravlje govorimo u krucijalnoj temi debljine, koja predstavlja izniman zdravstveni problem u Hrvatskoj. Naime, naša zemlja spada među najdeblje populacije u Europi. O znanstvenim spoznajama, terapiji i prevenciji debeljine više će nam reći naša gošća prof. dr. sc. Marica Jandrić Balen, specijalistica interne medicine i subspecijalistica endokrinologije, čije je uže znanstveno područje dijabetets i debljina.
