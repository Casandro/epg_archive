  title: Blagoslovljen tek
  subtitle: Religijski
  description: U srcu Turopolja tradicija i dalje živi kroz pjesmu, ples, običaje i domaću kuhinju. O baštini svoga kraja predano skrbi Kulturno-umjetničko društvo Vrhovje Župe Dubranec, čiji članovi čuvaju uspomene na način života minulih generacija. Posebno mjesto zauzimaju tradicionalna turopoljska jela, beli i kukuruzni žganci, meso iz žbanje, polevka i gibanica, ali i stare vještine poput dobivanja masla iz drvene stupe.
