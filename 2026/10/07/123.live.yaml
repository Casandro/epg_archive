  title: Hein Simons - Auf den Spuren von Heintje
  subtitle: Hein Simons - Auf den Spuren von Heintje
  description: '"Hein Simons - Auf den Spuren von Heintje" ist eine emotionale Reise durch Simons'' Vergangenheit. Das Album würdigt sein musikalisches Erbe, indem es bekannte Hits aus seiner Jugend neu interpretiert. Mit seiner warmen Stimme verleiht er den Songs eine persönliche Note und präsentiert zugleich neue Kompositionen, die seine Entwicklung als Künstler zeigen. Das Album ist eine Hommage an seine Vergangenheit und gleichzeitig ein Blick in die Zukunft. Ge 2019'
