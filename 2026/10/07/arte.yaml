  subtitle: Madagaskar, Toliara
  description: 'Im Südwesten Madagaskars entdecken die Meeresnomaden um den Ingenieur Corentin de Chatelperron eine wichtige Ressource des Landes: die nährstoffreiche Spirulina-Alge. Täglich dient sie Zehntausenden von Menschen als wichtiges Nahrungsergänzungsmittel - eine Wunderwaffe gegen Mangelernährung im Kindesalter. Wie ließe sich der Ertrag am besten steigern?'
