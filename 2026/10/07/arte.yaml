  title: 360° Reportage
  subtitle: Kourou - Palmen, Raketen, Gefängnisinseln
  subtitled: true
  description: Mehr als hundert Jahre war das Überseegebiet Französisch-Guayana an der Küste Südamerikas ein Schreckensort für Gefangene. Die hier errichteten Zuchthäuser galten als die härtesten Frankreichs. Heute sind von ihnen nur noch Ruinen übrig, die aufwendig restauriert werden. Frankreich beginnt dieses dunkle Kapitel seiner Geschichte aufzuarbeiten - nur ein paar Kilometer entfernt vom gigantischen Weltraumbahnhof Kourou.
