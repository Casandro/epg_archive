  title: Rosamunde Pilcher - Królowa nocy 1 (odc. 60)
  subtitle: Po śmierci męża Lilly Brown postanawia zacząć wszystko od nowa. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie przy wsparciu ukochanej ciotki Valerie otwiera wymarzony butik.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Königin der Nacht
    AT,DE, 2005
    Reżyseria: Karsten Wichniarz
    Występują: Leonore Capell, Thomas Scharff, Christian Kohlund, Olivia Pascal, Barbara Lanz, Claudius Zimmermann
    Lilly Brown po śmierci męża postanawia całkowicie odmienić swoje życie. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie z pomocą ukochanej ciotki Valerie spełnia swoje marzenie o prowadzeniu własnego sklepu. W dniu otwarcia jej butik staje się niespodziewanym schronieniem dla młodego mężczyzny uciekającego przed natarczywymi dziennikarzami i fanami. Lilly nie wie, że jest nim John Fox - słynny angielski zawodnik polo.
