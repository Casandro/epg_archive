  description: |-
    serial kryminalny (Austria, 2017) odc.7
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Christine Klein, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair
    Lara Kreidl stała się gwiazdą internetu za sprawą filmów przedstawiających, jak uprawia ekstremalną wspinaczkę. Pewnego dnia kobieta ginie, skacząc z klifu w kombinezonie ze skrzydłami. Wydaje się, że powodem śmierci Kreidl był nieudany wyczyn. Jednak znalezione na miejscu ślady wskazują na to, że doszło do morderstwa.
    Reżyser: Rainer Hackstock
    Od lat: 12
