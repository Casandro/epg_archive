  title: Muzyczne podróże
  subtitle: Autorzy wędrują po najpiękniejszych regionach Europy z niemiecką muzyką biesiadną w tle, która od dawna cieszy się dużą popularnością. Twórcy przedstawiają między innymi historię danego regionu.
  description: |-
    Tytuł oryginalny: Lieder, Land und Leute
    DE, 2026
    Autorzy łączą trzy słowa: muzyka, kraj i ludzie. Wędrują po najpiękniejszych regionach Europy, wykonują utwory niemieckiej muzyki biesiadnej, które zdobyły popularność i sympatię u szerokiego grona odbiorców. Historia danego regionu prezentowana jest za pomocą muzyki, miejscowych legend oraz zwyczajów mieszkańców.
