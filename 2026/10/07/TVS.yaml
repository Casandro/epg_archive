- eventId: 1384852
  start: 2026-10-07T00:35:00Z
  stop: 2026-10-07T01:30:00Z
  title: Emeryci na tropie
  subtitle: W policji brakuje personelu, dlatego byli komisarze Edwin i Günter zostają przywróceni do służby przez komendanta. Obaj cieszą się, że mogą uciec od emerytury i z zapałem zabierają się do pracy.
  description: |-
    Tytuł oryginalny: Rentnercops
    DE
    Reżyseria: Thomas Durchschlag
    Występują: Tilo Prückner, Katja Danowski, Wolfgang Winkler, Aaron Le, Verena Plangger, Michael Prelle
    "Emeryci na tropie" to niemiecki serial kryminalny (Rentnercops), który łączy lekki humor z zagadkami śledczymi. Akcja serialu toczy się w Kolonii, gdzie z powodu braków kadrowych szefowa lokalnego komisariatu prosi o pomoc dwóch emerytowanych detektywów wydziału zabójstw. Mimo że obaj mają już swoje lata i inną wizję pracy, decydują się wrócić do służby i wspólnie rozwiązywać sprawy kryminalne, często napotykając różnice pokoleniowe, śmieszne sytuacje i niekonwencjonalne metody pracy.
  ageRating: 12
