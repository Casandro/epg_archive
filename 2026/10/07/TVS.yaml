  title: Krąg miłości
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    Tytuł oryginalny: Familie Dr. Kleist
    DE
    Reżyseria: Peter Weissflog
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser
    Doktor Christian Kleist, główny bohater, po śmierci żony Susanne przenosi się z szesnastoletnią Lisą i dwunastoletnim Peterem do spokojnego Eisenach, by zacząć nowy etap życia. Na miejscu otwiera własny gabinet lekarski, a dzięki życzliwości i empatii szybko zdobywa sympatię mieszkańców oraz burmistrza. Poznaje nowych ludzi, a po latach odnawia też kontakty z dawnymi kolegami i przyjaciółmi.
  ageRating: 12
- eventId: 1384865
  start: 2026-10-07T13:45:00Z
  stop: 2026-10-07T14:50:00Z
  title: Górski lekarz
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    Tytuł oryginalny: Der Bergdoktor
    DE,AT, 2013
    Reżyseria: Axel De Roche
    Występują: Hans Sigl, Heiko Ruprecht, Mark Keller, Monika Baumgartner, Ronja Forcher
    "Doktor z alpejskiej wioski" - niemiecko-austriacki serial telewizyjny. Po wielu latach pracy za granicą chirurg z Tyrolu, Martin Gruber, chce sprawić swojej matce urodzinową niespodziankę i złożyć jej niezapowiedzianą wizytę. Rodzinna miejscowość Martina, górska wioska Ellmau, okazuje się zupełnie inna niż ta, którą zapamiętał.
  ageRating: 12
