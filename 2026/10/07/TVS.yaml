  title: Rosamunde Pilcher - Królowa nocy 1 (odc. 60)
  subtitle: Po śmierci męża Lilly Brown postanawia zacząć wszystko od nowa. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie przy wsparciu ukochanej ciotki Valerie otwiera wymarzony butik.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Königin der Nacht
    AT,DE, 2005
    Reżyseria: Karsten Wichniarz
    Występują: Leonore Capell, Thomas Scharff, Christian Kohlund, Olivia Pascal, Barbara Lanz, Claudius Zimmermann
    Lilly Brown po śmierci męża postanawia całkowicie odmienić swoje życie. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie z pomocą ukochanej ciotki Valerie spełnia swoje marzenie o prowadzeniu własnego sklepu. W dniu otwarcia jej butik staje się niespodziewanym schronieniem dla młodego mężczyzny uciekającego przed natarczywymi dziennikarzami i fanami. Lilly nie wie, że jest nim John Fox - słynny angielski zawodnik polo.
  ageRating: 12
  genre:
  - '22'
- eventId: 1384870
  start: 2026-10-07T19:50:00Z
  stop: 2026-10-07T21:35:00Z
  title: 'Rosamunde Pilcher: Nie z tego świata 1 (odc. 139)'
  subtitle: Po stracie pracy Natalie zatrudnia się jako opiekunka dzieci u Benjamina Wilsona. Kobieta zmaga się nie tylko z nieufnością szwagierki mężczyzny, ale także własnym bratem, który jest chuliganem.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wie von einem anderen Stern
    DE, 2017
    Reżyseria: Marco Serafini
    Występują: Liza Tzschirner, Daniel Aichinger, Francis Fulton-Smith, Saskia Valencia, Elena Bin, Leo Bilicky
    Natalie jest kasjerką. Po śmierci rodziców sprawuje opiekę nad swym małoletnim bratem Johnem. Chłopak jest chuliganem i drobnym przestępcą. W końcu Natalie traci z jego winy pracę w sklepie. Musi poszukać innego zajęcia i zatrudnia się jako opiekunka dzieci u astrofizyka Benjamina Wilsona, który od śmierci żony sam zajmował się wychowywaniem trójki swych latorośli. Brat Benjamina, Paul i jego żona Ellen próbują go wspierać.
  ageRating: 12
  genre:
  - '22'
