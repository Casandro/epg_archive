  title: 'Doktor z alpejskiej wioski - nowy rozdział: odc.7'
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007) odc.7
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Ulrich wychowuje wnuczkę Gretę. Jej matka i babcia nie żyją, a on sam jest poważnie chory, cierpi na raka prostaty. Pacjentem Martina zostaje też ojciec dziewczynki, Lennart, który chce odzyskać córkę. Prawo do opieki stracił, gdy pod wpływem środków przeciwbólowych spowodował wypadek, w którym zginęła jego żona.
    Reżyser: Jorgo Papavassiliou
    Od lat: 12
