  title: Fürchte Deinen Nächsten!
  subtitle: Mein Vater, der Killer
  description: Für Jenn Carson ist ihr Vater die wichtigste Bezugsperson. Er blieb zuhause, als sie ein Baby war, und die Mutter arbeitete. Doch alles ändert sich als die junge Frau erkennt, dass der Mensch, den sie am meisten liebt, ein Serienkiller ist.
