    Nacht 112/121: Verwandlung in eine Maultierstute

    Königin Lab merkt, dass ihr Zauberspruch bei Badr nicht wirkt. Sie habe nur Spaß gemacht, versichert sie. Und probiert von seinem Gerstenbrei. Da zittert sie am ganzen Körper. Badr verwandelt sie in eine Maultierstute und reitet auf ihr in die Welt.

