  title: Hörspiel
  description: "Wir sind das Volk (1/4)\nNach dem Theaterstück am Deutschen Nationaltheater Weimar\nVon Eva Bormann und Luise Voigt\nRegie: Luise Voigt\nMit: Annelie Korn, Dascha Trautwein, Katharina Hackhausen, Calvin Noel Auer, Fabian Hagen, Nahuel Häfliger, Bastian Heidenreich, Marcus Horn, Nadja Robiné, Roxana Safarabadi und Janus Torp\nKomposition: Frederik Werth \nTon: Jean Szymczak\nRegieassistenz: Assunta Allegiani\nDeutschlandfunk 2026\nLänge: 54'05\n\n(Wdh. am 10.10.2026, Deutschlandfunk, 20.05 Uhr)\n\nTeil 2 am 10.10.2026, 20.05 Uhr (Deutschlandfunk) und am 14.10.2026, 22.05 Uhr (Deutschlandfunk Kultur)\n\nWas bedeutet ?Wir sind das Volk? heute? Basierend auf 50 nachdenklichen und emotionalen Interviews mit Menschen aus Weimar und Thüringen erkundet das Hörspiel Fragen nach Zugehörigkeit, Identität, Zusammenhalt und Spaltung."
