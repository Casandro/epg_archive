  description: Spinalonga ist eine kleine Insel vor der Küste Kretas mit einer bewegenden Geschichte. Jahrhundertelang diente sie als venezianische Festung, später - von 1903 bis 1957 - als Leprakolonie. Menschen, die an Lepra erkrankten, wurden hier isoliert und lebten fernab der Gesellschaft. Heute ist Spinalonga ein stiller Ort, der von Leid, Hoffnung und Überlebenswillen erzählt.
