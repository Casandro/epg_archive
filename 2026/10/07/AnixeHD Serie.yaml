  description: Bei der Eröffnung des Besinnungssteiges sitzt statt dem Kunstwerk der Künstler Leo Hell (Gregor Bloéb) tot auf einem Stuhl unter der Verhüllung, mit dem Kopf auf ein Gewehr gestützt. Selbstmord! Nicht für das smarte Damenquartett, das wieder ein Verbrechen vermutet. Und nicht zu Unrecht, denn es stellt sich heraus, dass Leo Hell als eigenständiger Künstler nur mäßigen Erfolg hatte, aber mit der Fälschung von Werken seines berühmten, verstorbenen Vaters offenbar Unsummen verdient hat.
