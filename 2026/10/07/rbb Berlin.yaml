  description: "Berlin, Ende April 1933. Seit drei Monaten sind die Nationalsozialisten unter Adolf Hitler an der Macht. Im März haben sie zusammen mit den Deutschnationalen knapp die Wahl zum Reichstag gewonnen. Abgeordnete der KPD, der SPD und des katholischen Zentrums werden verfolgt und bedroht. Tausende verschwinden in Gefängnissen und wilden Konzentrationslagern, andere fliehen aus dem Land, vor allem Intellektuelle, nach Prag, Paris oder Wien. \nAls das Jahr sich dem Ende neigt, ist hat sich im Deutsche Reich die neue Realität des Dritten Reiches etabliert: Wahn und Gewalt, Terror und Propaganda."
