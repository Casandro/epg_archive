  title: Radioateliér
  description: 'Alex Švamberk: The Rite of Spring. Záznam studiové session z roku 2023. Setkání tří různých hudebních entit: významného jazzového pianisty a skladatele Emila Viklického a dále pak předního představitele české improscény, kontrabasity George Cremaschiho a ne-hudebníka Alexe Švamberka, který celý projekt inicioval s jeho hademade instrumentem, vyrobeným z nejrůznějších kovových pružin. Odtut také název projektu "The Rite of Spring". Repríza.'
