  title: Akcent
  description: Českou mediální scénu v posledních letech obohatilo několik projektů, které si daly za cíl rozvíjet nezávislou žurnalistiku. Stojí ale za nimi novináři, nikoliv silné mediální domy se svou už vybudovanou manažerskou strukturou. Jak náročné je takový mediální projekt, vybudovaný takzvaně na zelené louce, udržet? Kde brát manažery, kteří by dokázali menší a nezávislé projekty řídit? Saša Michailidis se ptá Jakuba Zelenky a Vojtěcha Boháče.
