  title: Vizitka
  description: 'Jan Míšek, vedoucí souboru Bonifantes. Z Pardubic do koncertních sálů po celé Evropě i třeba na Expo do Japonska. Chlapecký sbor Bonifantes před šestadvaceti lety založil Jan Míšek, jeho současný sbormistr, a za tu dobu z něj vytvořil špičkové hudební těleso. Bonifantes pravidelně vystupují na prestižních festivalech, spolupracují s českými orchestry, objevili se v operách i filmech a jejich nahrávky zahrnují také několik světových premiér. Jak se pracuje s chlapeckým hlasem, který se může proměňovat doslova před očima? A co všechno může mladému člověku dát zkušenost zpívat v takovém sboru? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
