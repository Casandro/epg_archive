  title: Hubert ohne Staller
  subtitle: Mord mit 1.600 Umdrehungen
  description: "Hubert verbringt einen freien Tag mit Angeln an der Loisach und zieht eine Leiche an Land, weshalb er kurz darauf den Kollegen Girwidz und Riedl Rede und Antwort stehen muss. Zunächst mal spricht alles dafür, dass das Opfer, ein alter Mann, ausgerutscht und in die Loisach gefallen ist. Girwidz hätte trotzdem gerne, dass Hubert und nicht Riedl ihn bei dem Fall unterstützt. Hubert lässt sich breitschlagen und tatsächlich, als die beiden der Witwe die Todesnachricht überbringen wollen, stellt sich nicht nur heraus, dass die bereits verstorben ist. Es finden sich im Haus des Toten auch deutliche Spuren eines Einbruchs! Auch der Befund aus der Pathologie gibt Rätsel auf - der alte Mann ist zwar ertrunken, dass Wasser in seiner Lunge enthält aber Reinigungsmittel und stammt nicht aus der Loisach. Die Ermittler stehen vor einem Rätsel. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
