  title: Fahrt ins Risiko
  subtitle: Madeira - Serpentinen am Abgrund
  description: "Madeira, die portugiesische Insel im Atlantischen Ozean, ist berühmt für ihre zerklüfteten Berglandschaften - und kurvenreichen Straßen. Steile Anstiege und Serpentinen führen zu spektakulären Aussichten und lassen bei Autofahrern den Puls höherschlagen. Fahrten ins Inselinnere sind bis heute ein Trip ins Abenteuer.\nDas besondere Terrain Madeiras hat die Menschen erfinderisch gemacht, ungewöhnliche Transportwege sind so entstanden. Aus diesen Zeiten stammen die Straßenschlitten, mit denen Menschen und Güter in Windeseile nach unten befördert werden konnten: Die Fahrer nennen sich Carreiros, spezialisiert darauf, die hölzernen Gefährten ohne Lenkung und Bremsen den Berg hinabzusteuern. \nAbseits der ausgebauten Straßen lockt das Abenteuer: Offroad-Spezialist Edgar Silva liebt die entlegenen Ecken der Insel. Je wilder und gefährlicher die Wege durchs Gebirge werden, umso mehr steigt sein Fahrspaß - und das Geschäft. Der gebürtige Madeirer bringt Besucher an Orte, an die sie mit dem Mietwagen nicht mehr kommen - und wo seine Geländekenntnis und Fahrpraxis gefragt sind.\nMadeiras zerklüftetes Terrain beschert auch dem Abschleppunternehmer Duarte Ribeiro ein Auskommen. Die steilen und engen Wege sorgen dafür, dass ihm die Arbeit so schnell nicht ausgeht. Heute soll er einen englischen Oldtimer überführen, von denen es einige auf der Insel mit dem milden Klima gibt. Da die alten Sportwagen ein Vermögen wert sind, muss mit viel Fingerspitzengefühl vorgehen.\nDokumentarfilm, Deutschland 2024, R: Christian Schidlowski"
