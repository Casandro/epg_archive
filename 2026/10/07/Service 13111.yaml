  title: TM Wissen
  subtitle: Holz im Kochrezept - Können wir Bäume essen?
  description: 'Als Vorspeise einen Baumblüten- und Knospensalat mit knusprig gebratenen Douglasienholz-Chips, zum Hauptgang Tannennadel-Pesto: Das "Baum Menü" aus der Küche von Artur Cisar-Erlach. Für den Waldökologen sind Bäume Nahrungsmittel. Er beschäftigt sich seit Jahren damit, was an unseren Bäumen essbar ist und wie die Rinde, das Holz, die Nadeln oder die Blätter am besten in der Küche eingesetzt werden. // Wolfgang Ott Mitte beginnt Mitte der 1990er Jahre eine beispiellose Verbrechensserie. Im Sommer 1995 entführt er mindestens vier Frauen und ermordet zwei von ihnen. Was bringt Menschen dazu, solche Gewaltverbrechen zu begehen? Gibt es das "Böse" in uns - oder werden Menschen durch eine Verkettung von Umständen und Einflüssen "böse gemacht"? Kriminalpsychologin Anita Raiger identifiziert Einflussfaktoren anhand der Geschichte des Serienmörders Wolfgang Ott. // Die Tiefen des Weltalls - fotografiert mit dem Handy. Robert Grögler ist Hobby-Astrofotograf und dabei so erfolgreich, dass sogar die US-Weltraumbehörde NASA angefragt hat, ob sie eines seiner Bilder veröffentlichen darf. Für die Aufnahmen benutzt er sein Smartphone. "Terra Mater Wissen" begleitet Robert Grögler bei der Jagd nach der perfekten Aufnahme des Cirrus Nebels. // "De facto brechen wir alles, was nötig ist." Professor Andrea Frangi und sein Team von der ETH Zürich bringen Holz an seine Grenzen - mit einem riesigen Pendel etwa, dem Gewicht von vier Lastwagen, oder mit ihrem eigenen High-Tech-Brandsimulator. Die Forscher wollen die Holzbauweise weiter optimieren. Wie lassen sich Hochhäuser aus Holz noch sicherer und noch effizienter bauen?Österreich 2024'
