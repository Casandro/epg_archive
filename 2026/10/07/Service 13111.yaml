  title: Michael Martin - Gesichter der Erde
  subtitle: Anden
  description: |-
    Die Anden sind die längste Gebirgskette der Erde und erstrecken sich an der Westküste Südamerikas über 7500 km oder 65 Breitengrade. Ihre Entstehung steht im engen Zusammenhang mit der Plattentektonik und ist so typisch, dass man vom "andinen Typ" der Gebirgsbildung spricht. Michael Martin durchquert auf seinem Motorrad das Altiplano mit seinen farbigen Lagunen und gleißenden Salzseen. Von dort aus folgt er der Andenkette über spektakuläre Pässe bis zur Cordillera Real Boliviens, wo er seinen ersten Sechstausender besteigt. Ziel ist der Alpamayo, der schönste Berg der Erde.
    Dokumentarfilm, Deutschland 2021, R: Viktor Stauder
