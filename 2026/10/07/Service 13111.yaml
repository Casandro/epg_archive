  title: 'Terra Mater - Die Erde: Ein Planet im Portrait'
  subtitle: Wasser (3/3)
  description: |-
    Die Erde wird nicht umsonst "Blauer Planet" genannt: Zwei Drittel ihrer Oberfläche sind mit Wasser bedeckt. Die Weiten der Weltmeere beherbergen große Walherden, riesige Manta-Rochen "fliegen" unter Wasser, während daneben Walhaie ruhig dahingleiten, die mächtigsten Fische der Erde. Die Ozeane mit ihren schwankenden Wassertemperaturen und weitreichenden Strömungen sind aber auch ein Motor für Wetterphänomene und Klima-Effekte. Und sogar unser Nachbar im All nimmt Einfluss auf die Meere: Der Mond sorgt mit seiner Anziehungskraft für Ebbe und Flut. In den Mangrovenwäldern und Wattgebieten der Gezeitenzone finden sich Wesen, die es nirgendwo sonst gibt - etwa Winkerkrabben oder Schlammspringer.
    Natur, Österreich 2018, R: Martin Mészáros
