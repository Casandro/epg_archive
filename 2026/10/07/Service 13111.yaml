  title: Hotels zum Staunen - Ein Blick hinter die Kulissen
  subtitle: Datai Langkawi, Malaysia
  description: |-
    Die britische Chefköchin Monica Galetti und ihr Kollege Rob Rinder besuchen das Datai Langkawi in Malaysia. Dieses Hotel liegt versteckt unter den Baumkronen des Regenwaldes. Wer die Türen der Hotelzimmer nicht geschlossen hält, kann eine Überraschung vorfinden: Affen im Hotelzimmer. Während ihres Aufenthalts werden Rob Rinder und Monica Galetti mit verschiedenen Aufgaben betraut, von der Pflege des Seerosenteichs bis zum Fahren eines Golfbuggys durch kurvenreiches Gelände. Dabei lernen sie die wichtigsten Umweltprobleme der Region kennen und erfahren, welcher Aufwand nötig ist, um ein Hotel mitten in der Natur zu betreiben. Das Datai Langkawi ist nämlich weit bekannt für sein Engagement im Bereich Nachhaltigkeit und Umweltschutz.
