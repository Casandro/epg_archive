  title: Bergwelten
  subtitle: Der Tiroler Höhenweg
  description: '"Der Tiroler Höhenweg" ist eine dokumentarische Reise in eine der ursprünglichsten Bergwelten der Alpen. Gemeinsam mit dem Trailrunner Daniel Jung und einem der Erschließer des Weges, dem Bergführer Hanspeter Eisendle erzählt der Film den ungezähmt rauhen Charakter und die Geschichte der gewaltigen Gebirgsregionen entlang der Grenze zwischen Österreich und Südtirol. Seine dramaturgische Dynamik entfaltet der Film aus der sportlichen Herausforderung des jungen Trailrunners, der die Route in Rekordzeit bezwingen will; seine Tiefe erfährt er aus den jahrzehntelangen alpinistischen Erfahrungen des Bergführers Eisendle und seiner detailreichen Kenntnis all der entlegenen Kare und einsamen Scharten, und der bewegten Geschichte, die diese unberührt archaische Wildnis so einzigartig macht.Österreich 2020, R: Peter Künzel'
