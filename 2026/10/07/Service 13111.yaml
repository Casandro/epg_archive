  title: Geniale Räuber
  subtitle: Löwen auf der Jagd
  description: |-
    Wie jagen Löwen große Beutetiere wie Büffel und Zebras? Mithilfe innovativer 3D-Animationen werden Schlüsselmomente der Jagd eingefroren und Schritt für Schritt analysiert, um erstaunliche Einblicke in den täglichen Überlebenskampf der Löwen zu bieten. Dabei wird deutlich, dass die Beute manchmal sechsmal so groß ist wie die Jäger selbst. Um bei der Jagd erfolgreich zu sein, setzen die Löwen auf Präzision, Strategie und das richtige Timing. Im Rudel ist die Löwin die Anführerin. Sobald sie jedoch trächtig ist, verlässt sie das Rudel, um ihre Jungen allein aufzuziehen. Das bedeutet, dass sie sowohl für sich als auch für ihre Jungen auf die Jagd gehen muss. Doch im Rudel ist Teamarbeit entscheidend, besonders wenn es darum geht, größere Beutetiere zu erlegen. Das Rudel macht Jagd auf einen riesigen afrikanischen Elefanten Im Schutz der Dunkelheit wagen sie den Angriff. Denn wenn es um das Überleben des Rudels geht, riskieren die Löwen alles.
    Dokumentarfilm, Vereinigtes Königreich 2024
