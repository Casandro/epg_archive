  title: Stargate
  subtitle: Die Auserwählten
  description: |-
    Prunkvolle Tempel, üppige Festmähler und sinnliche Orgien: Die griechisch anmutenden Bewohner:innen des Planeten Argos leben in Saus und Braus. Als das SG-1-Team die paradiesische Welt erforscht, kommt es zu einem folgenschweren Zwischenfall. Colonel Jack O'Neill erliegt den erotischen Verlockungen, wobei er sich prompt mit einem KI-Virus der Goa'uld infiziert. Die Leichtigkeit des Seins findet ein jähes Ende, denn nun ticken die Uhren anders für O'Neill. Er altert extrem schnell, und seine Lebenszeit ist nun auf wenige Tage begrenzt - genau wie bei den Auserwählten von Argos.
    USA 1997
