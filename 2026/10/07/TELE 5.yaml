  stop: 2026-10-07T21:50:00Z
  title: 'Alien: Rubicon'
  description: |-
    Eigentlich wollte der Astrobiologe Dr. Jeff Morrow (Preston Geer) gerade eine Auszeit nehmen und mit seinen Kids zum Campen fahren. Aber dann kommt alles anders: Ein getarntes Alien-Raumschiff ist unterwegs zur Erde und bedroht die Menschheit! US-Präsident McCoy (Michael Paré) sucht im Bunker Schutz und beauftragt den Astroforscher sowie das Militär, angeführt von Captain Sean Jeffe (Paul Logan), die Invasion der Außerirdischen abzuwenden. Können die monströsen Aliens mit einer international geächteten Geheimwaffe gestoppt werden? - Mockbuster der Produktionsfirma "The Asylum".
    USA 2024
  widescreen: true
