  title: Stargate Atlantis
  subtitle: Das Auge - Teil 2
  description: |-
    Genii-Kommandant Kolya hat Atlantis überfallen und in seiner Gewalt. Dr. Weir und Dr. McKay sind seine Geiseln, Major Sheppard konnte fliehen. Die Sturmflut naht, doch die Schutzschilde funktionieren nicht. Dr. Weir und Dr. McKay sollen sie reparieren, nur deshalb lässt Kolya sie am Leben. Da gelangen Teyla, Lieutenant Ford und Dr. Beckett im Auge des Sturms zurück nach Atlantis...
