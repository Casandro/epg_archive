  title: Stargate
  subtitle: Die Macht der Weisen
  description: |-
    Hohe Regierungsbeamte und der US-Generalstab fordern handfeste Erfolge vom Stargate-Programm. Damit sind insbesondere überlegene Alien-Technologien gemeint! Als Teal'c den Militärs von einem exotischen Tier berichtet, das in der Lage ist, sich unsichtbar zu machen, wird das SG-1-Team losgeschickt, um die biologische Tarnkappentechnik zur Erde zu bringen. Allerdings warten in dem außerirdischen Habitat der Kreatur jede Menge Überraschungen. So trifft die Truppe nicht nur auf Goa'uld Apophis (Peter Williams), sondern auch auf friedfertige Waldwesen, die Tote wieder zum Leben erwecken können.
