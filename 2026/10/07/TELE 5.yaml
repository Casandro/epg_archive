  title: Trance - Gefährliche Erinnerung
  description: |-
    Der Kunsthändler Simon Newton (James McAvoy) ist an eine kriminelle Bande geraten, die von ihm verlangt, ein Multimillionen-Dollar-Gemälde zu stehlen. Allerdings geht der Coup in dem Auktionshaus schief: Durch einen Schlag auf den Kopf erleidet Simon einen fatalen Gedächtnisverlust! Nun soll die Psychotherapeutin Elizabeth Lamb (Rosario Dawson) den Mann in Hypnose versetzen, um den Verbleib des wertvollen Goya-Gemäldes herauszufinden. Unter den Argusaugen von Gangsterboss Franck (Vincent Cassel) gerät Simon immer tiefer hinein in ein tödliches Psycho-Labyrinth aus Lügen und Intrigen. - Für ihre Rolle erhielt Rosario Dawson eine Nominierung für den Black Reel Award.
    USA, GBR 2013
