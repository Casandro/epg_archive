  title: The Twisters
  description: |-
    Der Mittlere Westen der USA wird von einer tödlichen Tornado-Serie heimgesucht. Während die Nationalgarde unzählige Menschen aus der Gefahrenzone evakuiert und die Bevölkerung aufgerufen ist, schnellstmöglich Schutzräume aufzusuchen, braut sich am Himmel eine noch viel größere Katastrophe zusammen: Die Tornados vereinen sich zu einem zerstörerischen Mega-Twister! Mit dem neu entwickelten sowie KI-gestützten Frühwarnsystem "TINA" versucht das Sturmforscher-Paar Dr. James (Mark Justice) und Dr. Erica Garland (Kayla Fields) den Weg der Tornado-Apokalypse vorauszuberechnen. - Stürmischer Mockbuster der Produktionsfirma "The Asylum".
    USA 2024
  widescreen: true
