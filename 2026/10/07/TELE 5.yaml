  subtitle: Im Reich des Donnergottes
  description: |-
    Die Stargate-Spezialeinheit reist zum Planeten Cimmeria, wo es mögliche Verbündete im Kampf gegen die  Goa'uld geben soll. Der Planet gilt zudem als Herrschaftsgebiet nordischer Götter. Doch als Teal'c und  Colonel Jack O'Neill von einem magischen Energiestrahl erfasst, und in ein bedrohliches Labyrinth geschickt werden, sind sie auf die Rettung durch ihre Teamkamerad:innen angewiesen. Diese müssen nun Thors Hammer entschärfen - die mächtige Waffe des Donnergottes, die ursprünglich zur Vernichtung der Goa'uld entwickelt wurde.
