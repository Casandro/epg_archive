  title: Stargate
  subtitle: Die Auferstehung
  description: |-
    Während der Erkundungsmission auf einem scheinbar unbewohnten Planeten kommt es zu einem seltsamen Zwischenfall: Ein mystisches Kristallwesen, mit dem Colonel Jack O'Neill versehentlich interagiert, nimmt dessen Gestalt an. Der extraterrestrische Doppelgänger reist unbemerkt vom SG-1-Team mit zur Erde zurück, wo das Wesen versucht, ein tiefsitzendes Trauma von O'Neill zu lösen. Allerdings ist die Kristallkreatur mit den Bedingungen auf der Erde überfordert, und plötzlich taucht der echte O'Neill wieder auf...
