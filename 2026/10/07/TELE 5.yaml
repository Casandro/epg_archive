  title: Haus gesucht in Alaska
  subtitle: Episode 8
  description: |-
    Dave und Penny Van Arsdall aus Fairbanks haben das Stadtleben satt. Die beiden wollen den Lärm und den Trubel hinter sich lassen und suchen ein neues Zuhause - zum Beispiel am Ufer des Chena River. Im Sommer kann man dort Bootstouren machen und angeln. Und im Winter friert der Fluss zu und wird zu einer Schnellstraße für Schneemobile. Das Ehepaar hat im US-Bundesstaat Alaska ein erschwingliches Blockhaus mit Pelletheizung entdeckt. Der ideale Wohnort für hemdsärmelige Naturliebhaber:innen.
