  title: Doctor Who
  subtitle: Mission Dalek
  description: |-
    Der Doktor und Clara eilen dem Rebellenraumschiff "Aristoteles" zur Hilfe. Gretchen Carlisle (Laura Dos Santos) und weiter tapfere Soldat:innen an Bord gehören dem "Vereinten Galaktischen Widerstand" an, der gegen die Daleks kämpft. Da sich an Bord auch ein freundlich gesinnter Dalek namens Rusty sowie ein futuristisches Molekulolnanoskalargerät befinden, entscheiden sich der Timelord und seine Verbündeten für einen riskanten medizinischen Eingriff. Auf mikroskopische Größe geschrumpft, reisen sie ins Innere von Rusty, um dort die neuronalen Schaltkreise des Außerirdischen zu erforschen.
    GBR 2014
  widescreen: true
- eventId: 1469997
  start: 2026-10-07T01:00:00Z
  stop: 2026-10-07T02:25:00Z
  title: The Artifice Girl - Sie ist nicht real
  description: |-
    Special Agent Deena Helms (Sinda Nichols) und Amos McCullough (David Girard) gehören einem NGO-Team an, das Jagd auf pädophile Straftäter im Internet macht. Bei seinen Ermittlungen stößt das Sondereinsatzkommando für Cyberkriminalität auf das KI-gesteuerte Mädchen Cherry (Tatum Matthews). Sie wirkt täuschend echt und dient als virtueller Lockvogel, um Kinderschänder zu überführen. Als Cherry beginnt, sich vom Computerprogramm zu einem selbständig denkenden "Wesen" zu entwickeln, gerät auch Gareth (Franklin Ritch, Lance Henriksen), der Urheber der innovativen Software, ins Visier der Ermittlungen. - Der preisgekrönte Sciencefiction-Film wurde u.a. mit dem Asteroid Award ausgezeichnet.
    USA 2022
  widescreen: true
