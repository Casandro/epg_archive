- eventId: 893108
  start: 2026-10-07T16:00:00Z
  stop: 2026-10-07T17:00:00Z
  title: MDR KULTUR Spezial
  description: "Dora Kaprálová: Die Mariborhypnose. Die Gegenwart kann erdrückend sein: Ereignisse überschlagen sich und es wird immer schwieriger, Meldungen von Falschmeldungen zu trennen. Da hilft es, die Perspektive zu wechseln. Genau das macht die tschechische Schriftstellerin Dora Kaprálová in ihrem neuen Roman Die Mariborhypnose. Darin erkundet sie die slowenische Stadt Maribor aus der Perspektive einer Stubenfliege. Tino Dallmann hat sie getroffen und stellt den Roman vor.\n\nDaniela Fischerová: Veilchen, Geheimnisse. Die Autorin ist 1948 in Prag geboren und hat gleich mit ihrem ersten, kritischen Theaterstück \"Stunde zwischen Hund und Wolf\" aus dem Jahr 1979 für politische Unruhe gesorgt - nach nur vier Aufführunge wurde es von den Behörden verboten. Zensurmaßnahmen begleiteten sie auch als Dramatikerin und Drehbuchautorin durch die 1980er Jahre. Sie gehörte zum Dissidentenkreis um Václav Havel. Mitte der 1990er Jahre begann Fischerová Prosatexte zu schreiben und zu veröffentlichen - im Jahr 2002 erschien der Band \"Fern und Nah\" mit sieben Erzählungen, aus dem Tschechischen übersetzt von Sophia Marzolff. Fast 50 Kurzgeschichten bietet der nun anlässlich des Gastlandauftritts Tschechiens bei der Frankfurter Buchmesse veröffentlichte Band \"Veilchen, Geheimnisse\". Die Übersetzerin ist wieder Sophia Marzolff. Und Ulrich Rüdenauer stellt uns das Buch der hierzulande fast unbekannten Autorin vor.\n\nJarka Kubsova: Im Licht des neuen Tages. Die Autorin wurde 1977 in der Tschechoslowakei geboren. Mit zehn Jahren kam sie nach Deutschland, seit 2021 schreibt sie Romane. Besonders erfolgreich wurde ihr zweites Buch \"Marschlande\", das zwei Frauenfiguren, die fünf Jahrhunderte voneinander trennen und vereint sind durch ihren Wohnort der Hamburger Marschlande. Ein erfolgreiches Romankonzept wird von Autorinnen und Autoren in Folgebüchern gern aufgegriffen. So auch hier - Rainer Moritz hält das für einen Gewinn. \n\nTereza Semotamová: Radikale Bedürfnisse. Wer vor einigen Jahren den tschechischen Gastlandauftritt auf der Leipziger Buchmesse verfolgt hat, der konnte gleich eine ganze Reihe von tschechischen Autorinnen entdecken: Katerina Tucková, Radka Denemarková - oder Tereza Semotamová. Denn 2019 erschien ihr Debütroman Im Schrank in der deutschen Übersetzung. Pünktlich zum Gastlandauftritt Tschechiens auf der Frankfurter Buchmesse ist nun das zweite Buch von Tereza Semotamová bei uns erschienen. Tino Dallmann stellt das Buch vor.\n\nFlorence Noiville: Milan Kundera. Klassische Biographien folgen einem simplen und durchaus sinnfälligen Prinzip: Sie begleiten den Porträtierten von der Geburt bis zum Totenbett, oft noch mit einer Rückschau auf die Familienhistorie und einem Blick auf seine posthume Wirkungsgeschichte. Das kann sehr ins Detail gehen. Mit einem ganz anderen Kaliber - einem wesentlich kleineren - haben wir es bei Florence Noivilles Annäherung an den tschechischen Autor Milan Kundera zu tun. Ihren Essay mit dem Untertitel \"Schreiben, was für eine komische Idee\" stellt Ulrich Rüdenauer vor.\n\nDer aktuelle, ausführliche Themenschwerpunkt aus Kultur, Gesellschaft und Politik."
  subtitle: Unter Büchern! Tschechien
