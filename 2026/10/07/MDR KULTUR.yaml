  title: MDR Kultur trifft Peter Wurschi
  description: "Seit 36 Jahren sind Ost- und Westdeutschland wieder vereint. Nach 45 Jahren Teilung trat am 03. Oktober 1990 der Einigungsvertrag in Kraft. Die zentralen Feierlichkeiten finden in diesem Jahr vom 02. bis 04. Oktober in Bremen unter dem Motto \"Viele Stärken - Ein Land\" statt. Auch das Bundesland Thüringen wird sich dort präsentieren. Peter Wurschi, seit 2018 Thüringer Landesbeauftragter zur Aufarbeitung der SED-Diktatur, besuchte am Vortag des 03. Oktober das Grenzmuseum Schifflersgrund zum 35sten Jubiläum. Es ist die älteste Gedenkstätte ihrer Art an der ehemaligen innerdeutschen Grenze, gelegen zwischen Hessen und Thüringen. Herzstück dieser Anlage ist einer der längsten im Original erhaltenen Abschnitte des Eisernen Vorhangs in Europa. Erst Anfang September hatte Kulturstaatsminister Wolfram Weimer zehn Millionen Euro zusätzliche Förderung für Gedenkstätten und Erinnerungsorte in Deutschland in Aussicht gestellt. \n\nDas \"Grüne Band\" in Deutschland, der größte zusammenhängende Biotopverbund, verläuft ca. 1400 Kilometer entlang der ehemaligen innerdeutschen Grenze, erstreckt sich von Travemünde an der Ostsee bis zum Dreiländereck bei Hof an der Grenze zu Bayern, Sachsen und Tschechien. Dieser historisch gewachsene Natur- und Erinnerungsraum verweist auf eine zentrale Erfahrung vieler Deutscher, stand für Trennungen von Familien und wirtschaftlichen Beziehungen und insbesondere für die Menschen im Osten Deutschlands für staatliche Überwachung und Zwangsumsiedlungen. 2018 wurde erstmals in einem Bundesland, in Thüringen, das \"Grüne Band\" als nationales Naturmonument gesetzlich verabschiedet. Dieser Schutzstatus nationales Naturmonument beinhaltet die Gleichgewichtigkeit von Natur und Erinnerungskultur. Andere Bundesländer schlossen sich an. Inzwischen gibt es in Hessen und in Sachsen-Anhalt ein \"Grünes Band\", in Mecklenburg-Vorpommern wird es als nationales Naturmonument vorbereitet. Ende 2023 setzte die Kultusministerkonferenz das \"Grüne Band\" auf die deutsche Tentativliste für das UNESCO-Welterbe. Die Konferenz der Landesbeauftragten zur Aufarbeitung der SED-Diktatur und der Folgen der kommunistischen Diktatur forderte im Juni 2026 die Bundesländer auf, die Bewerbung des \"Grünen Bandes\" als gemischtes UNESCO-Welterbe aktiv zu unterstützen, einschließlich der Gedenkstätten und Grenzlandmuseen. Das \"Grüne Band\" als gemischtes UNESCO-Welterbe, Natur- und Erinnerungskultur verbindend, sieht der Thüringer Landesbeauftragter zur Aufarbeitung der SED-Diktatur beim Thüringer Landtag Peter Wurschi, als einzig sinnvoll gangbaren Weg. Diese Symbolkraft lade ein miteinander ins Gespräch zu kommen, über Teilung und über Einheit, über all das, was das menschliche Zusammenleben in den letzten Jahrzehnten zusammengeführt hat.  \n\nIn Suhl wurde Peter Wurschi 1975 geboren. Von 1995 bis 2000 studierte er Politikwissenschaften, Soziologie, Philosophie und Psychologie an der Universität Leipzig. Thema seiner Abschlußarbeit war die Erforschung der Entwicklung der politischen Opposition in Suhl. Als Stipendiat der Bundesstiftung zur Aufarbeitung der SED-Diktatur schrieb Peter Wurschi seine Promotion zu DDR-Jugendprotestkultur in Thüringen. Im Böhlau Verlag wurde sie unter dem Titel \"Rennsteigbeat. Jugendliche Subkulturen im Thüringer Raum 1952 bis 1989\" veröffentlicht. 2007 legte Peter Wurschi ein erstes Konzept zur Entwicklung einer Gedenk- und Bildungsstätte in der ehemaligen Erfurter Stasi-Untersuchungshaftanstalt Andreasstraße vo"
  subtitle: Thüringer Landesbeauftragter zur Aufarbeitung der SED-Diktatur
