  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Ausstellung: Wochenkrippen in der DDR in Gera\nMontags abgeben und Freitag wieder abholen - was heute unvorstellbar klingt, war in den Wochenkrippen der DDR normal. In Gera gab es nicht nur eine dieser Krippen. Was hat das mit den Kindern und Müttern gemacht? Warum gab es diese Krippen?\nEin kritischer Rückblick wird in den nächsten Wochen dazu in Gera gegeben; mit einer Ausstellung, Theater, Lesungen von Betroffenen.\n \n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1391 Birgitta von Schweden heiliggesprochen\nDie adlige Mystikerin gründete einen Orden, beriet Könige und Päpste. 1999 wurde sie zur \"Patronin Europas\" ernannt.\nVon Hartmut Schade\n\n* 06:50 Uhr - MDR Kulturtipp: Kürbisfestival Schloss Lichtenwalde  \n\n* 07:20 Uhr - Film: \"Alte Liebe\" \n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Fanfare Ciocarlia - Demon Dance \nEin Blick auf Folk und Welt heute Abend. Grit Friedrich widmet sich dort unter anderem Levante-Stimmen, der Musik mesopotamischer Nachbarn und besonders ausführlich Obertongesang und Pferdekopfgeigen aus der Mongolei. \nEs gibt wieder eine Reihe Konzerttipps. Diese Band soll die schnellste Blaskapelle der Welt sein. Seit 30 Jahren sind die Lerchenbläser aus Rumänien auf Tour. Und am 19.Oktober spielt die Fanfare Ciocarlia im Objekt 5 in Halle, am Tag darauf im Parkhotel Dresden, bei den Jazztagen. Das ist ihr \"Demon Dance\" - aufgenommen in einem Erfurter Studio.\n\n* 08:10 Uhr - Sachsen-Anhalt hat einen neuen Landtag\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Sachbuch der Woche: Fritz Seemann \"Wir sitzen hier in einer Mausefalle\" \n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
- eventId: 892988
