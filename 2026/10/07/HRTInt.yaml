- eventId: 1524853
  start: 2026-10-07T02:10:00Z
  stop: 2026-10-07T02:55:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Prije jedanaest godina upoznali smo je u prvoj sezoni "The Voicea", a danas nam stiže s prvim autorskim albumom "Mačak u vreći". Što se sve krije iza tog glazbenog prvijenca, otkrit će nam Elena Stella. Što se događa s mirovinom ako ste dio radnog vijeka proveli u Irskoj, Njemačkoj ili Austriji? Kako se računa taj staž i vrijede li ista pravila za godine rada prije ulaska Hrvatske u EU? Odgovore donose Toni Milun i Antonija Krolo Vasilj iz Hrvatskog zavoda za mirovinsko osiguranje. Gdje završava neugodan komentar, a počinje ozbiljno nasilje na internetu? Kako se zaštititi kada uvrede prerastu u prijetnje i zašto ljudi iza ekrana tako lako prelaze granice? O tome razgovaramo s Tomislavom Ramljakom, dugogodišnjim voditeljem Centra za sigurniji internet.
- eventId: 1458531
  start: 2026-10-07T02:14:00Z
  stop: 2026-10-07T02:59:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
