  title: Igor Lešnik i Pavle Dešpalj uz Simfonijski orkestar HRT-a, V. Lisinski 2001.
  subtitle: ' '
  description: 'Maestro Pavle Dešpalj izvedbom 1. klasičnog koncerta Stjepana Šuleka još se jednom potvrdio kao ustrajni promicatelj glazbe svojega profesora. Zildijan concerto Mladena Tarbuka, u kojem je kao solist nastupio ugledni udaraljkaš Igor Lešnik, ime je dobio po američkoj tvrtki za proizvodnju činela i ostalih udaraljki. Prometej - poema vatre za klavir, zbor i orkestar odraz je cjelokupnog Skrjabinova glazbeničkog umijeća i svjetonazora. U izvedbi sudjeluju pijanistica Srebrenka Poljak, Zbor HRT-a i Zbor Ivana pl. Zajca.  Urednica koncerta: Anna Maria Doricich'
