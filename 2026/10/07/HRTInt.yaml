  title: ART
  subtitle: ' '
  description: 'Što se događa kada tehnologiju ne promatramo samo kao alat, nego kao nešto s čime smo u odnosu? Osmo izdanje međunarodnog Device_art festivala pod naslovom "Transfer + Resistor (Poetic Devices / Device Poetics)" okuplja 27 hrvatskih i korejskih umjetnika i umjetničkih suradnji te kroz izložbu, performanse, razgovore i radionice istražuje promjenjive uloge uređaja i strojeva. Festival od svog prvog izdanja 2004. godine povezuje umjetnost, znanost i tehnologiju, a ovogodišnje izdanje prvi put uspostavlja opsežniji dijalog s Južnom Korejom. Što nam taj susret govori o tehnologiji, umjetnosti i načinima na koje s uređajima živimo, gledamo u prilogu iz MSU-a, a u studiju komentiraju kustosice Olga Majcen Linn i Tereza Teklić. Urednice: Anja Cerar i Ana Marija Habjan Novinarka: Jasna Coce Redateljica: Vesna Fijačko Fodor'
