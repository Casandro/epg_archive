  title: 'Emocije - sluge i gospodari: Formula za sreću, dokumentarna serija (4/4)'
  subtitle: ' '
  description: 'Znanstveno istraživanje sreće puno je teže nego što se na prvi pogled čini. Ali, jedno je sigurno. Sretni ljudi žive čak 9 godina dulje od depresivnih. A, to se ne smije zanemariti. Dobra je vijest da se možemo naučiti misliti pozitivno. Svaki put kada jednu negativnu misao pretvorite u pozitivnu, napravili ste korak prema sreći. Jer, male stvari vode do velikih promjena. Stručni suradnici: doc. dr. sc. Dubravka Miljković i prof. dr. sc. Zdravko Petanjek Glumac: Marko Makovičić Autor glazbe: Srđan Sekulović Koscenaristica: Eleonora Korošić Knez'
