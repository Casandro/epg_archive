  description: |-
    Kurz vor einem Sichtungsturnier wird ein junger, vielversprechender Fußballspieler mit Aussicht auf einen Profivertrag brutal zusammengeschlagen und schwer verletzt. Da es sich um einen Mordversuch handeln könnte, ermitteln Vicky, Hui, Edwin und Plocher - der wegen seines schlechten Gewissens aushelfen will.
    Bei einem Besuch im Krankenhaus erfahren sie von einem weiteren Spieler aus derselben Mannschaft, der nach einem Autounfall mit Fahrerflucht ebenfalls in der Klinik liegt. Versucht da jemand, mögliche Konkurrenten um einen Profivertrag aus dem Weg zu räumen?
- eventId: 741514
  start: 2026-10-07T13:10:00Z
  stop: 2026-10-07T14:00:00Z
  title: Rentnercops - 39. Alles Symbolik
  subtitle: Deutschland 2018
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: |-
    Das Team hat Stress: drei Tote an einem Morgen, alle drei erschossen. Während zwei der Opfer vor Jahren bereits aktenkundig waren und sich nun anscheinend im "Ruhestand" befanden, ist das dritte Opfer bislang nicht auffällig geworden.
    Aber bei der Untersuchung der Toten fällt Dr. Schmidt etwas auf: Alle drei haben das gleiche Haifisch-Tattoo, das nach ihrem Tod mit einem Messer quasi durchgestrichen wurde. Sie gehörten alle drei zur gleichen Verbrecherbande, die von einem Mann mit dem Spitznamen Mackie Messer geführt wurde. Das sieht nach Rache an abtrünnigen Mitgliedern aus - doch Mackie Messer ist bereits seit zwei Jahren tot.
