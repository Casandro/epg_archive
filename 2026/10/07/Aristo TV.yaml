  title: OnlineKirche mit Pastor Gert Hoinle - Engel in deiner Wüste | Engel 3
  description: Die Wüste ist kein Ort, an dem man wohnen will. Milch und Honig gibts dort nicht. Menschen landen aus unterschiedlichen Gründen in ihr. So ist eine schwangere Ausreißerin dort die erste, die in der Bibel dem Engel des Herrn begegnet. Elia wollte in der Wüste sterben, doch dann begegnete ihm ein Engel. Israel wanderte 40 Jahre in ihr und uns ist nicht bewusst, wie intensiv sich Engel um das Volk dort kümmerten. Sie dienten auch Jesus. Engel gibts auch in deiner Wüste.
  widescreen: true
