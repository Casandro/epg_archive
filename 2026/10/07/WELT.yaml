- eventId: 1466645
  start: 2026-10-07T00:24:00Z
  stop: 2026-10-07T01:07:00Z
  title: Spacetime
  subtitle: Das Licht - Einem Phänomen auf der Spur
  description: Welchen Einfluss hat Licht auf uns? Wo kommt es her? Der Astronaut Prof. Ulrich Walter geht der elektromagnetischen Strahlung auf den Grund und klärt auf, wie sich die übermäßige Helligkeit der Erde auf uns auswirkt. Speziell für Astronomen ist die Lichtverschmutzung ein echtes Problem - sie brauchen einen dunklen Nachthimmel, um mit Teleskopen die Galaxien zu erforschen. Wissenschaftler verschiedener Institute erläutern das Phänomen Licht und weshalb es mehr ist als nur Helligkeit.
  widescreen: true
- eventId: 1466646
  start: 2026-10-07T01:07:00Z
  stop: 2026-10-07T01:50:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  description: Eine der berüchtigtsten Untertassen-Sichtungen der neueren Geschichte ereignete sich über einem der größten und verkehrsreichsten Flughäfen der USA. Im Jahr 2006 entdeckte ein Mitarbeiter der Fluggesellschaft United Airlines auf dem Rollfeld des Chicago O'Hare International Airport ein mysteriöses Flugobjekt über dem Gate C17. Dutzende von Zeugen und Zeuginnen beschrieben ein lautloses, stillstehendes Objekt direkt über dem Rollfeld. Es wurde minutenlang beobachtet, bevor es spurlos verschwand.
  widescreen: true
- eventId: 1466647
  start: 2026-10-07T01:50:00Z
  stop: 2026-10-07T02:31:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  description: Einige Menschen behaupten, sie seien von Außerirdischen entführt worden. Einer der wohl bekanntesten Vorfälle dieser Art ereignete sich in West Yorkshire. Der Polizist Alan Godfrey war im November 1980 früh morgens in seinem Streifenwagen unterwegs. Als plötzlich ein strahlend weißes Licht vom Himmel leuchtete, kam sein Auto unvermittelt zum Stehen. Eine halbe Stunde später kam er dreißig Meter entfernt wieder zu Bewusstsein und erinnerte er sich nur daran, dass er nach seinem Funkgerät griff.
  widescreen: true
- eventId: 1466648
  start: 2026-10-07T02:31:00Z
  stop: 2026-10-07T03:13:00Z
  title: 'Strip the Cosmos: Rätsel der Milchstraße'
  subtitle: 'Strip the Cosmos: Rätsel der Milchstraße'
  description: '2015 machen Astronomen eine beunruhigende Entdeckung: Hunderttausende Galaxien überall im Universum werden dunkler. Einige von ihnen haben in den vergangenen zwei Milliarden Jahren die Hälfte ihrer Leuchtkraft eingebüßt. Zu den runtergedimmten Sternenansammlungen gehört auch unsere Milchstraße. Der Energiekreislauf im Universum scheint gestört zu sein. Was steckt hinter dem Phänomen, und was bedeutet es für das Leben auf der Erde? Mögliche Antworten gibt ein Blick ins Zentrum der Milchstraße.'
  widescreen: true
- eventId: 1466649
  start: 2026-10-07T03:13:00Z
  stop: 2026-10-07T03:59:00Z
  title: 'Strip the Cosmos: Geheimnisvoller Jupiter'
  subtitle: 'Strip the Cosmos: Geheimnisvoller Jupiter'
  description: Wem unser Heimatplanet zu vertraut und der wüste, leblose Mars zu langweilig ist, der findet in Jupiter eine spannende Alternative. Auf dem Gasriesen wüten gigantische Stürme und monströse Magnetfelder, sein Kern ist heißer als die Oberfläche der Sonne. Und sein feuriger Mond Io hat die größte vulkanische Aktivität im gesamten Sonnensystem. Die NASA-Raumsonde Juno liefert seit 2016 faszinierende neue Erkenntnisse über den planetaren Platzhirsch mit dem berühmten "roten Fleck".
  widescreen: true
