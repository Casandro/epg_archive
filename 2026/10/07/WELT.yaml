  title: Surviving 9/11 - Die Überlebenden
  subtitle: Surviving 9/11 - Die Überlebenden
  description: Die Bilder des 11. Septembers 2001 haben sich in das kollektive Gedächtnis der Menschheit eingebrannt. Allein in New York starben mehr als 2.700 Menschen in den Türmen des World Trade Centers. Doch es gab auch Tausende, die sich rechtzeitig in Sicherheit bringen konnten. 20 Jahre nach den Anschlägen erzählen vier dieser "Survivors" ihre Geschichten. Welche Zufälle, welche Entscheidungen, welche Heldentaten führten dazu, dass sie mit dem Leben davonkamen? Eine bewegende Rekonstruktion.
  widescreen: true
