  title: WELT Zeitreise von Stefan Aust (13)
  subtitle: Die Falle 9/11
  description: Die Anschläge vom 11. September 2001 erschütterten die Welt und prägten Stefan Austs Zeit als "Spiegel"-Chefredakteur. Deutschland erklärte seine Solidarität mit den USA und beteiligte sich am Afghanistan-Einsatz. Der Krieg gegen den Terror führte zu fragwürdigen Methoden wie Geheimgefängnissen und Folter. Aust analysierte mit US-Regierungsmitgliedern die Folgen des 11. September und hinterfragte, ob die USA in eine Falle geraten waren.
  widescreen: true
