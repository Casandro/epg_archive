  title: L'dor Vador - Von Generation zu Generation
  subtitle: L'dor Vador - Von Generation zu Generation
  description: Der 100-jährige Holocaust-Überlebende Dr. Leon Weintraub kehrt an die Orte seiner Verfolgung zurück und folgt den Spuren einer Geschichte, die weit über sein eigenes Leben hinausreicht. Von Lodz über Chelmno bis nach Auschwitz verbindet sich die Erinnerung an die Verbrechen der Shoah mit der Frage, wie sie über Generationen bewahrt werden kann. Ein bewegendes Porträt über Erinnerung, Verantwortung und die Bedeutung jüdischen Lebens gestern und heute.
