  title: ARD Konzert
  description: "Robert Schumanns \"Das Paradies und die Peri\" wurde 1843 im Leipziger Gewandhaus uraufgeführt und gehörte zu Schumanns Lebzeiten zu den meistaufgeführten seiner Werke. Es handelt sich nicht um ein Oratorium im eigentlichen Sinn, sondern um eine Art weltliches Liedoratorium, das lyrische Innigkeit und exotische Klangpracht mit großer romantischer Bildkraft vereint - ein Schlüsselwerk der deutschen Romantik. Der Text basiert auf Thomas Moores orientalischer Märchensammlung \"Lalla Rookh\". Erzählt wird von Peri, die als gefallener Engel aus der himmlischen Gemeinschaft verstoßen wurde. Ihre leidenschaftliche Suche durch ferne Länder beginnt, getragen vom Wunsch, den Weg zurück ins Paradies zu finden. \n<strong>Robert Schumann:<br/></strong>»Das Paradies und die Peri« <br/>Oratorium op. 50 für Soli, Chor und Orchester\n<strong>Lenneke Ruite</strong>, Sopran<br/><strong>Hanna Herfurtner</strong>, Sopran<br/><strong>Ulrike Schneider</strong>, Alt<br/><strong>Manuel Günther</strong>, Tenor<br/><strong>Tobias Berndt</strong>, Bariton<br/><strong>MDR-Rundfunkchor<br/>MDR-Sinfonieorchester<br/></strong>Leitung: <strong>Dennis Russell Davies</strong>\n(Aufnahme v. 13.09.2026, Leipzig, Gewandhaus)"
