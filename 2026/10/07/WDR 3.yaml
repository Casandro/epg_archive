  subtitle: 'Fernweh: Musik der Welt in der DDR'
  description: |-
    Ob kambodschanische Studentenparty, Jazzfest oder Forschungsobjekt: Musik der Welt hat in der DDR eine gewisse Rolle gespielt, vor allem im Austausch mit antikolonialen Bewegungen. Aufgetreten sind Künstlerinnen und Künstler wie Miriam Makeba, Inti Illimani, Mercedes Sosa. Es kursierten LPs von Ravi Shankar, Santana oder Muddy Waters. Und schon 1965 war Louis Armstrong zu Gast.
