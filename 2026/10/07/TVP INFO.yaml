  title: Podróże z historią 3 (odc. 7)
  subtitle: Radosław Kotarski odkrywa historię miast kresowych. Odwiedza najlepszą szkołę w historii Rzeczpospolitej. Przedstawia, w jaki sposób na wschodnich krańcach Polski współistniały różne narody i kultury.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Kto sprawił, że zamiast polskiego kościoła wybudowano siermiężny dom handlowy? Dlaczego z zabytku zrobiono magazyn soli rozbijanej dynamitem? Skąd pomysł, aby obiekt sakralny zamienić w kino? Radosław Kotarski odkrywa burzliwą historię kresowych miast. Przy okazji odnajduje miejsca najbliższe sercom polskich królów i magnatów oraz odwiedza najlepszą szkołę w historii Rzeczpospolitej. Przedstawia także, w jaki sposób na wschodnich krańcach Polski współistniały różne narody i kultury.
