  description: 'In den ersten Einheitsjahren nutzen Betrüger dreist unklare Strukturen und Lücken im System aus. ZDF-History zeigt spektakuläre Fälle von Vereinigungskriminalität. Glücksritter aus dem Westen, altgediente Träger des sterbendes Staates DDR oder zwielichtige Investoren aus dem Ausland: Die Wiedervereinigung ist ein Eldorado für Betrüger aller Art.'
