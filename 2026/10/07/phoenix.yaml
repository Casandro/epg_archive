  description: Historiker und Presenter Christopher Clark reist zu spektakulären Naturwundern, den beeindruckenden Spuren präkolumbianischer Hochkulturen und den Zeugnissen langer Kolonisation. Die filmische Reise führt von den Wasserfällen von Iguazú zu den alten Missionsstationen der Jesuiten, geht weiter nach Sucre in Bolivien mit seinem kolonialen Erbe, nach Tiwanaku, Cusco und Machu Picchu und endet in Buenos Aires mit dem UNESCO-Welterbe Tango.
