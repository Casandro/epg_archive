  title: 491 Tage Geisel in Gaza
  subtitle: Die Schätze Nordafrikas
  widescreen: true
  hd: true
  description: Eli Sharabi hat den 7. Oktober 2023 und die Monate der Geiselhaft überlebt. Seine Frau Lianne, die beiden Töchter Yahel und Noiya und viele andere leben nicht mehr. 491 Tage war Eli Sharabi in der Gewalt der Hamas. Am 8. Februar 2025 kam er im Rahmen eines Abkommens frei. Wenige Wochen später sprach er mit dem israelischen Sender Keshet 12 über die Zeit seiner Gefangenschaft. Geführt wurde das Gespräch von Ilana Dayan, einer der renommiertesten Investigativjournalistinnen Israels. Dabei entstand ein bewegendes zeitgeschichtliches Dokument, das phoenix nun auch dem deutschsprachigen Publikum zugänglich macht.
