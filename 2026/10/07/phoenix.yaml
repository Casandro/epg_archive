  title: Mein Freund, der Feind
  widescreen: true
  hd: true
  description: "Im \"Kanaan\" arbeiten der Israeli Oz Ben David und der Palästinenser Jalil Dabit seit Jahren Seite an Seite. Ihr Restaurant gilt als Symbol für Verständigung und Koexistenz \"Peace by Hummus\". Doch seit dem Massaker der Hamas und dem Gazakrieg wird ihre Freundschaft auf eine harte Probe gestellt. Oz Ben David, aufgewachsen in einer rechtsgerichteten Siedlerfamilie, und Jalil Dabit aus einer bekannten Hummus-Dynastie in Ramla, kämpfen mit ihren Ängsten und Verletzungen  und mit der Frage, ob ihr Projekt diese Zeiten übersteht. \n\nIm pfälzischen Pirmasens stehen sich junge Russen und Ukrainer im freundschaftlichen Kampf gegenüber."
