  description: Když v závěru milénia po dlouhých 17 letech vypustila skupina Blondie do světa album "No Exit", zrodil se jeden z největších comebacků poprockové historie. Singl "Maria" šel až na čelo britské hitparády a hraje se dodnes. Na domácí scéně v zámoří to bylo slabší, zlatá deska za půl milionu prodaných nosičů utekla o pár tisíc, ale čtyřiapadesátiletá Debbie Harry tady zní pořád skvěle. Připravuje Jiří Matějů.
