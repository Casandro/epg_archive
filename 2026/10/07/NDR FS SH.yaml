  description: "Carla will den Pferdehof nicht kampflos aufgeben und bittet Julius, Richard zu überzeugen, eine andere Trasse für die Zubringerstraße zu finden. Julius steckt zwischen den Stühlen und trifft am Ende eine Entscheidung, die Carla fassungslos zurücklässt. \nGerd möchte Baby Henri mit einem Ritual in der Familie begrüßen. Nachdem Jess Mutter Anni abgesagt hat, bittet er Victoria, dabei zu sein. Doch Victoria möchte nicht kommen, sie fühlt sich nicht als Teil der Familie. Toni, Ellie und Jonas genießen ihre Dreierbeziehung. Bei einem erotischen Kartenspiel kommen sich Ellie und Jonas unerwartet näher."
