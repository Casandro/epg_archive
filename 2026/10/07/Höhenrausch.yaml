  title: Entdecker der Welt - The Rocky Mountains Traverse
  subtitle: Entdecker der Welt - The Rocky Mountains Traverse
  description: Gadd und Gavin sind entschlossen, das wohl größte Paragliding-Projekte weltweit erfolgreich zu meistern. In Kanada starten sie ihren Flug von insgesamt über 1.200 Kilometern entlang der Rocky Mountains bis in die USA. Dabei gleiten sie über die zerklüfteten und wilden Landschaften der Bergkette und schlagen ihr Nachtlager auf Berggipfeln auf. AT 2015
- eventId: 1469567
  start: 2026-10-07T23:45:00Z
