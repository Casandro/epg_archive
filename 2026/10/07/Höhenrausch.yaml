  title: Entdecker der Welt - Erebus Enigma
  subtitle: Entdecker der Welt - Erebus Enigma
  description: 'Entdecker der Welt: Dr. Clive Oppenheimer von der Cambridge Universität in England ist einer der weltweit führenden Vulkanologen. "Entdecker der Welt" begleitet ihn auf den Erebus Enigma, einer der außergewöhnlichsten Vulkane der Erde. Denn nirgendwo sonst trifft solche Hitze auf solche Kälte. Der Erebus Enigma in der Antarktis ist der weltweit einzige Vulkan mit einem aktiven Lavasee. Doch wie heiß ist er wirklich? Diese Frage will Dr. Oppenheimer beantworten. GB 2015'
