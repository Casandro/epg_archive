- eventId: 1469501
  start: 2026-10-07T03:25:00Z
  stop: 2026-10-07T04:12:00Z
  title: Mystisches Tirol
  subtitle: Mystisches Tirol
  description: Tirol. Land der Berge und Seen. Sehnsuchtsort für so manch gestressten Großstädter des 21. Jahrhunderts. Tirol aber ist mehr als nur Urlaubsidylle. Inmitten der wilden Bergwelt und seinen sanften Tälern haben sich sagenumwobene Burgruinen erhalten. Orte, an denen Mythen und Magie gedeihen, festgehalten in alten Bräuchen und Legenden. Auch die Hexerei hat in Tirol ihre Spuren hinterlassen.  Ein rund 15 Köpfe starkes Expertenteam um den Tiroler Professor Harald Stadler ist gewillt, das Geheimnis um die Heilerin zu entschlüsseln. AT 2018
- eventId: 1469502
  start: 2026-10-07T04:15:00Z
  stop: 2026-10-07T05:02:00Z
  title: Entstehung der Alpen - Schatzkammer Alpen
  subtitle: Entstehung der Alpen - Schatzkammer Alpen
  description: 'Entstehung der Alpen - Schatzkammer Alpen: Unsere Alpen sind eine wahre Schatzkammer, sogar im allerengsten Sinn des Wortes. Denn unter den Wurzeln der Berge schlummern wertvolle Ressourcen. Der österreichische Wissenschafter Prof. Rudi Simek ist dafür durchs Land unterwegs auf der Suche nach diesen Schätzen. Stets mit einem Augenzwinkern, ob in den Mythen nicht doch ein Kern Wahrheit steckt. AT 2015'
- eventId: 1469503
  start: 2026-10-07T05:05:00Z
  stop: 2026-10-07T05:52:00Z
  title: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  subtitle: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  description: 'Bergwelten: Alaska: - seit 1867 der 49. US-Bundesstaat - war schon immer ein Land für Abenteurer. Waren es früher Trapper, Pelztierjäger und Goldschürfer, sind es heute Bergsteiger und Extremskifahrer, die hier ihr Glück suchen.Sie sind auf der Suche nach steilen Flanken, unberührten Bergen und dem einzigartigen Pulverschnee, den es nur hier gibt. AT 2016'
- eventId: 1469504
  start: 2026-10-07T05:55:00Z
  stop: 2026-10-07T06:43:00Z
  title: At Your Service
  subtitle: At Your Service
  description: |-
    Es gibt einen Moment, der zur Magie gehört, eine Art übernatürlicher Zustand, in dem die Alchemie ihren Zauber wirkt und zwei Menschen, die am Ende so unterschiedlich sind, wie eins werden. Eine völlige Verschmelzung ihrer Geister und Körper, als ob die Augen von. Der Kameramann wurde zum Trick des Reiters, so dass sie uns für eine Sekunde den Eindruck vermittelten, wir würden mitten in ihrem Paradies fliegen. Dabei entstehen die schönsten Bilder, als Beweis dieser perfekten Verbindung . Die PVS Company, Magier der ersten Male, Alchemist des Freeski-Films, bietet mit ihrem neuen Freeski-Film einen Moment puren visuellen Glücks, ein Stück Himmel, nach einem Geheimrezept, das nur sie kennen ... Wie immer, Sie sind zu Ihren Diensten...
     FR 2012
- eventId: 1469505
  start: 2026-10-07T06:45:00Z
  stop: 2026-10-07T07:31:00Z
  title: Entstehung der Alpen - Erlebniswelt Alpen
  subtitle: Entstehung der Alpen - Erlebniswelt Alpen
  description: Entstehung der Alpen - Erlebniswelt Alpen:Unsere Alpen - seit jeher ein geschichtsträchtiger Ort im Herzen Europas und Mittelpunkt historischer Entwicklungen und bahnbrechender Erkenntnisse. Beeindruckende Berge, wilde Flüsse und einzigartige Landschaften haben die Menschen seit Jahrhunderten bewegt und in die Alpen gelockt. Prof. Rudolf Simek macht sich auf die Spuren des Tourismus. Warum kamen die ersten Reisenden in die Alpen und wie entwickelte es sich zum Massentourismus? AT 2015
- eventId: 1469506
  start: 2026-10-07T07:35:00Z
  stop: 2026-10-07T08:22:00Z
  title: Entstehung der Alpen - Mythos Alpen
  subtitle: Entstehung der Alpen - Mythos Alpen
  description: 'Entstehung der Alpen -  Mythos Alpen: Unsere Alpen. Eine beeindruckende und vielfältige Landschaft, die über Jahrmillionen entstanden ist. Prägende Epochen und historische Ereignisse spielten sich ab, umgeben von imposanten Berggipfeln der Alpen. Aber woher stammen die vielfältigen Namen unserer Berge und Gebirge? Und welche Geschichten führten zu ihrer Benennung? Wenn die Berge unserer Alpen selbst sprechen und erzählen könnten, würde es lange dauern bis sie etwas über uns zu berichten hätten. Denn als der Mensch hier irgendwann einmal hier auftauchte, standen die Gebirge selbst schon Millionen von Jahren AT 2015'
- eventId: 1469507
  start: 2026-10-07T08:25:00Z
  stop: 2026-10-07T09:12:00Z
  title: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  subtitle: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  description: 'Bergwelten: Ernst Merkinger geht, meistens weit. Diesmal für Bergwelten den Berge-Seen-Trail im Salzkammergut und trifft dabei inspirierende Persönlichkeiten, die ihn ein Stück seines Weges begleiten. Ernst Merkinger auf der Kärtnerstraße in Wien. Bepackt mit dem Wesentlichsten für''s Weitwandern. Dann geht es auf ins Salzkammergut. Wir folgen Ernst auf seinem Weg, dem Berge-Seen-Trail 340 Kilometer weit, 20 Tage lang. Der Trail ist ein grandioses und intensives Landschaftserlebnis. Die Berge, die Seen - großartige Aus- und Anblicke, im Großen und im Kleinen. Unterwegs trifft er auf bekannte und unbekannte Protagonisten, die ihn ein Stück begleiten und mit ihm über das Leben und die Natur philosophieren. AT 2021'
