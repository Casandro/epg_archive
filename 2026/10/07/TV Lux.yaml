  description: Liturgia nie je iba obrad, ale živé stretnutie s Kristom. V relácii vKontexte sa pozrieme na katechézy pápeža Leva XIV. o liturgii, liturgickej reforme a jej správnom chápaní. Prečo je dôležité zachovať vernosť podstate liturgie a vyhnúť sa svojvoľným či nesprávnym praktikám?
