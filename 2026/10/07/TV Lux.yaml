  description: 'O tom, že na pohľad dokonalé a čo do chuti fantastické torty môže upiecť aj bežný "smrteľník", nás presvedčí naša kolegyňa z prešovskej pobočky TV LUX Františka Stanovčáková. V jubilejnom roku svätého Františka nám upečie tortu z domácich medových plátov inšpirovanú týmto obľúbeným svätcom. Réžia: Pavol Danko (2026)'
