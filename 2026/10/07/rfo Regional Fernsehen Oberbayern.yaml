  subtitle: Das Urteil - Ex-Bundespolizistin für Vergewaltigung verurteilt +++ 13,4 Millionen Euro Investition - Rosenheim will Parkhaus P1 erneuern +++ Rosenheim ist offiziell eine Fahrradfreundliche Kommune +++ Trockenheit verringer..
  description: 'Ein Fall, der wegen der Schwere der Vorwürfe und der beruflichen Stellung der Angeklagten für besondere Aufmerksamkeit sorgte, hat heute sein Ende gefunden: Vor dem Landgericht Traunstein ist das Urteil gegen eine frühere Bundespolizistin gefallen. Sie war unter anderem wegen Vergewaltigung einer 14-Jährigen sowie dem Besitz vom Kinderporographie angeklagt. +++ Rosenheim plant das fast 40 Jahre alte Parkhaus P1 am Hammerweg für 13,45 Millionen Euro neu: Statt 450 sollen rund 700 Stellplätze entstehen, Baubeginn 2028, Fertigstellung 2029, begleitet von neuen Parkgebühren, die im Stadtrat umstritten sind. +++ Rosenheim ist offiziell als fahrradfreundliche Kommune zertifiziert: Oberbürgermeister Abuzar Erdogan begrüßte die Auszeichnung der Arbeitsgemeinschaft und sieht damit bestätigt, dass Rosenheim eine Fahrradstadt ist, bewertet nach Infrastruktur, Information, Kommunikation und Service. +++ Die Silomaisernte ist weitgehend abgeschlossen. Die letzten Felder werden gerade noch abgeerntet. Heuer fällt die Ernte wegen der Trockenheit schlechter aus als im Vorjahr. Die großen Unterschiede beim Ertrag und bei der Qualität sind auffallend, teilweise von Feld zu Feld.'
- eventId: 1279573
  start: 2026-10-07T15:10:00Z
  stop: 2026-10-07T15:20:00Z
  title: Süd Journal vom 6.10.2026 (Wh.)
  subtitle: GALERIA  zum vierten Mal in 6 Jahren insolvent +++ Urteil zur Kampenwandbahn gefallen +++ Genusstage am Hilgerhof in Pittenhart +++ Weidefasswagen für durstige Tiere in Mühldorf
  description: 'Galeria ist erneut insolvent und ringt wieder mit großen wirtschaftlichen Problemen, was die Zukunft des Traditionswarenhauses ungewiss macht; auch in Rosenheim wächst die Sorge der Beschäftigten, Details berichtet Philipp Kuffler. +++ Der Bayerische Verwaltungsgerichtshof erlaubt den Neubau der Kampenwandseilbahn in Aschau, verlangt aber eine erneute Prüfung von bis zu 79 Sonderfahrten wegen möglicher Störungen streng geschützter Birkhühner, womit Betreiber jubeln und der Bund Naturschutz einen Teilerfolg sieht. +++ Wie vielfältig Äpfel und Birnen sein können, war am Wochenende am Hilgerhof in Pittenhart zu sehen und zu schmecken. Bei den Genusstagen ging es aber nicht nur um alte Obstsorten: Auch die Bienen und der Honig standen im Mittelpunkt. Ein Wochenende ganz im Zeichen regionaler Produkte. +++ Im Landkreis Mühldorf sichern Bund Naturschutz und Landwirte mit Wilden Weiden die Artenvielfalt, doch die Dürre bringt Tiere und Natur in Bedrängnis, weshalb zwei Stiftungen 15.000 Euro für einen mobilen 2000-Liter-Weidefasswagen bereitstellen.'
- eventId: 1279574
  start: 2026-10-07T15:20:00Z
  stop: 2026-10-07T15:30:00Z
  title: Süd Journal vom 6.10.2026 (Wh.)
  subtitle: Saisonstart Museum Bilder erzählen in Waldkraiburg  +++ Ecologies of Time in der Studienkirche Burghausen +++ Wetter für das Sendegebiet
  description: Das Museum Bilder erzählen in Waldkraiburg, 2022 eröffnet und der Genremalerei des 19. Jahrhunderts gewidmet, steuert auf sein fünfjähriges Jubiläum 2027 zu und verbindet weiterhin erzählende Bilder mit einem vielseitigen Programm von Konzerten bis Vorträgen. +++ Zeit ist mehr als das, was unsere Uhren anzeigen. In der Studienkirche St. Josef in Burghausen beschäftigt sich die Ausstellung Ecologies of Time mit der natürlichen Zeit - und damit, was passiert, wenn wir unseren Blick auf die Zeit verändern. Im Mittelpunkt steht dabei die Salzach. +++ Heute in der Mitte und im Süden nach Nebelauflösung meist heiter, teils wechselnd bewölkt und trocken. Im Südosten, vor allem im Alpenraum im Tagesverlauf Quellbewölkung, einzelne Schauer oder vereinzelt Gewitter.
