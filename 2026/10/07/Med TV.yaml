  title: A sud di Taranto i popoli tra due mari
  subtitle: ' '
  description: Francesco Gasparri and Valentina Caruso explore Taranto, founded by Spartan settlers in 706 BC and soon a bustling Mediterranean hub. Gasparri traces the city’s history through the Aragonese castle, revealing remnants of ancient Taranto. Caruso visits the Archaeological Park of Egnatia, where the ancient Via Traiana, built by Emperor Trajan, still stands—a route once used by pilgrims to the Holy Land. Salento's traditions, including the Notte della Taranta dance, preserve the legacy of this rich past, as explained by prima ballerina Lucia Scarabina.
