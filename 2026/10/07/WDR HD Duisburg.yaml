- eventId: 741405
  start: 2026-10-07T08:25:00Z
  stop: 2026-10-07T09:10:00Z
  title: Garten & Lecker (32)
  subtitle: Spanische Küche im Kreativgarten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die zweite Gartenparty startet in Freudenberg im Siegerland. Hier hat Peter Mecklenburg einen schmalen Hausgarten in ein überraschendes Gartenparadies voller Pflanzen und Deko-Objekte verwandelt. Peter ist Halbspanier und möchte seine spanischen Wurzeln beim Gartenfest unter dem Motto "Tief verwurzelt" kulinarisch einfließen lassen. Zum Hauptgang gibt es maurische Hähnchenspieße mit kanarischen Kartoffeln und Auberginenpommes. Die Kohlrabi-Möhren-Lasagne als Vorspeise ist seinem deutschen Vater gewidmet, beim Dessert geht es mit Mandelkuchen und Milchmädcheneis wieder gen Süden.
- eventId: 741452
  start: 2026-10-07T09:10:00Z
  stop: 2026-10-07T09:55:00Z
  title: 'Expedition in die Heimat: Vier Jahreszeiten am Laacher See'
  subtitle: 'Moderation: Anna Lena Dörr'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Moderatorin Anna Lena Dörr ist auf Expedition durch die Jahreszeiten: Sie besucht einen Ort, an dem es seit Jahrtausenden brodelt und der zugleich von klösterlicher Ordnung geprägt ist: den Laacher See, Naturschutzgebiet und Klosterort, vulkanisch und touristisch ein Hotspot. Viele Menschen pilgern hierher, genießen die Natur am See, wandern, campen oder haben Spaß auf dem Wasser. Andere verbringen hier ihren Alltag, arbeiten als Fischer:in, Bäuerin oder Bauer, Gärtner:in oder Künstler:in. Der Laacher See verändert sein Gesicht im Lauf des Jahres. Im Winter ist er in sich gekehrt und still. Der Campingplatz ist geschlossen.'
- eventId: 741453
  start: 2026-10-07T09:55:00Z
