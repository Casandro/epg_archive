  title: Nashorn, Zebra & Co. (45)
  subtitle: Zoogeschichten aus München
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Jeden Tag wird bei den Löwen das Innengehege geputzt und ein Rolltor schützt die Tierpfleger dann vor den Raubkatzen. Ein mulmiges Gefühl bleibt irgendwie trotzdem. Mähnenrobbe Michi ist noch ein richtiges Muttersöhnchen, da wird es Zeit, dass er mal auf eigenen Flossen steht. Die Meerschweinchen in Hellabrunn leben in einer reinen Frauen-WG, nur ab und an gibt es auch mal Herrenbesuch. In der neuen Giraffenanlage läuft der Countdown: In zwei Tagen soll hier alles zur Eröffnung fertig sein. Bei den Mähnenrobben ist Chefbulle Haui außer Rand und Band, weil seine geliebte Frau wieder da ist.'
