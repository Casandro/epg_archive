  title: Mein wunderbarer Kochsalon - Mango-Kokos-Torte
  subtitle: Mein wunderbarer Kochsalon - Mango-Kokos-Torte
  description: 'Jahr für Jahr coache ich meine Kinder in Richtung Muttertag. Diesmal habe ich mir eine besonders einfache und frische Kokos-Mango-Torte überlegt. Die Arbeitsteilung zwischen Lilly und Louis funktioniert nach ein paar Trainingseinheiten auch perfekt - zwischen Teig, Früchten und Hardware gab es so nicht einen Streit. Backen kann bekanntlich therapeutisch wirken. Und so ein Kuchen erst recht: Ich wünsche allen Müttern da draußen einen fröhlichen, wertschätzenden, gemütlichen und entsptannten Muttertag. Ihr habt es Euch verdient! AT 2021'
