  title: Mimilicious - Knödel mit Ei und Gurkensalat
  subtitle: Mimilicious - Knödel mit Ei und Gurkensalat
  description: |-
    Mimilicious: Knödel mit Ei und Gurkensalat

    Zutaten für 2 Portionen

    3 Semmelknödel
    3 Eier
    1 EL Butter
    1 EL Petersilie, fein geschnitten
    Salz und Pfeffer

    Zubereitung
    - Semmelknödel in etwa 1 cm große Würfel schneiden.
    - Butter in einer Pfanne bei mittlerer Hitze schmelzen. Die Knödelwürfel hinzufügen und bei schwacher Hitze ca. 10 Minuten langsam anbraten, dabei gelegentlich wenden.
    - In der Zwischenzeit die Eier in einer Schüssel verquirlen, mit Salz und Pfeffer würzen.
    - Die verquirlten Eier gleichmäßig über die angebratenen Knödelwürfel gießen. Die Pfanne zudecken und die Eier etwa 2 Minuten stocken lassen.
    - Die Ei-Knödel-Mischung in Stücke teilen, auf Tellern anrichten und mit fein geschnittener Petersilie bestreuen.


    Gurkensalat

    Zutaten für 4 Portionen:

    2 Salatgurken
    1 Prise Salz
    Für das Dressing:
    1 Becher Sauerrahm
    4 EL Balsamico
    1 EL Öl
    1 Zwiebel
    2 Knoblauchzehen
    1 Bund Dill

    Zubereitung:

    - Die Gurken schälen, in dünne Scheiben hobeln und in eine Schüssel geben. Mit einer Prise Salz bestreuen und ca. 20 Minuten Wasser ziehen lassen. Anschließend die Gurkenscheiben gut ausdrücken und in eine Salatschüssel umfüllen.
    - Dill fein schneiden. Zwiebel und Knoblauchzehen schälen und fein hacken.
    - Für das Dressing Sauerrahm, Balsamico, Öl, gehackte Zwiebeln, Knoblauch und Dill in einer Schüssel gründlich verrühren.
    - Das Dressing über die Gurkenscheiben geben und alles gut vermischen. Den Salat vor dem Servieren etwa 10 Minuten durchziehen lassen. DE 2024
