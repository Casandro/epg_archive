  title: Mein wunderbarer Kochsalon - Paradeiser-Kokos-Suppe
  subtitle: Mein wunderbarer Kochsalon - Paradeiser-Kokos-Suppe
  description: Der Paradeiser ist einer meiner Lieblingsgemüse. Von Suppen über Saucen bis zu Tartes, Quiches, Chutneys und sogar Eis ist seine Vielfalt schier unerschöpflich. Ich verwende besonders gerne den Ochsenherzparadeiser, dank seiner Größe fühle ich mich als tendenziell faule Köchin sehr zu ihm hingezogen. Außerdem hat er eine dünne Schale, also muss ich ihn nicht schälen (da ist sie wieder, die faule Frau am Herd) und wenige Kerne, was ihm in der Verarbeitung an Herbheit nimmt. Ich habe einen Wiener Ochsenherzgärtner besucht, Markus Pannagl in Simmering, zeigte mir nicht nur sein beeindruckendes Glashaus, sondern kochte mit mir auch diese Tomaten-Ingwer-Suppe, die im Sommer auch kalt große Freude macht. AT 2021
