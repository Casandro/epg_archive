  title: Mein wunderbarer Kochsalon - Ingwer-Linsensuppe mit Kokosmilch
  subtitle: Mein wunderbarer Kochsalon - Ingwer-Linsensuppe mit Kokosmilch
  description: 'Selten hat etwas zu einem krassen Sinneswandel bei meinem Sohn geführt, wie diese Suppe: Von "Wäh, das esse ich sicher nicht" bis zu "Wahnsinn, ein echtes Suchtmittel". Ich gebe Louis vollinhaltlich recht: Rote Linsensuppe mit Kokosmilch, Lauch, Tomaten und Ingwer. Klingt vielleicht nach einem winterlichen Seelentröster, ist bei uns aber mittlerweile ein saisonfreies Standardgericht. Im Klartext: Sie steht mindestens einmal das ganze Jahr über am Speiseplan. Und das beste daran: Ich habe Louis'' Segen dafür. AT 2021'
