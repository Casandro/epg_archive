  title: Mein wunderbarer Kochsalon - Sauce Hollandaise mit weißem Spargel
  subtitle: Mein wunderbarer Kochsalon - Sauce Hollandaise mit weißem Spargel
  description: 'Ein Klassiker zeichnet sich dadurch aus, dass man nicht daran rütteln sollte. Und das hat einen guten Grund: Er hat sich über viele Jahre diesen Status erarbeitet, bestand die härteste Kritik und wird von der Allgemeinheit geschätzt bis gar geliegt. Die Beschreibung passt messerscharf auf weißen Spargel mit Sauce Hollandaise. Ein Fest in weiß. AT 2021'
- eventId: 1469611
  start: 2026-10-07T13:50:00Z
