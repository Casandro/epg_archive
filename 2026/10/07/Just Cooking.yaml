  description: Fleisch und Fisch zu mischen ist für mich eigentlich ein No-Go. Doch Jamie Oliver hat mich eines Besseren belehrt, er wickelte munter Pancetta um Seeteufel und siehe da, ich war hingerissen. Ich habe die Spieße über die Jahre ein wenig verändert, sie sind extrem einfach und extrem gut. Vor allem auch ideal vorzubereiten, wenn Gäste auch etwas davon haben sollen. AT 2017
