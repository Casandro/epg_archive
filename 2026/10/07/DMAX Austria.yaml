  title: Goldrausch in Alaska
  subtitle: Geheimnisse der Goldsuche
  description: |-
    Im Yukon wird sechs Monate im Jahr intensiv Gold geschürft. Danach schiebt Mutter Natur den Bemühungen der Schatzsucher mit eisigen Minustemperaturen einen Riegel vor. Aber unerschrockene Abenteurer wie Parker Schnabel oder Dustin Hurt versuchen ihr Glück auch an noch extremeren Orten. Von den Vulkanen Papua-Neuguineas bis zu den reißenden Gebirgsflüssen der Chilkat Mountains: Dieses Special zeichnet den Weg nach, den das Edelmetall aus dem Erdinneren bis in die Täler zurücklegt, und zeigt, welche Anstrengungen die Teams unternehmen, um die Schätze zu bergen.
    GBR 2025
  widescreen: true
