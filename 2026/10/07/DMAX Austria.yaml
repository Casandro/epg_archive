  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Wettlauf gegen die Flut
  description: |-
    Vier Tage entscheiden über die Zukunft einer Farmerfamilie. Andreas Macherey und seine Söhne müssen beweisen, dass auf dem Gelände in Südafrika genügend Gold verborgen liegt, um den Bau einer Mine zu rechtfertigen. Doch dann zieht ein gewaltiges Unwetter über das Tal hinweg. Ein trockengelegter Fluss verwandelt sich innerhalb weniger Minuten in einen reißenden Strom. Blitze schlagen in unmittelbarer Nähe ein, und Wassermassen reißen wertvolle Ausrüstung mit sich. Steht die Mission vor dem Aus, bevor Andreas, Tobi und Benni den entscheidenden Nachweis erbringen können?
    DEU 2026
  widescreen: true
