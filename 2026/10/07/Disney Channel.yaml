  title: Scrubs - Die Anfänger
  subtitle: Mein bester Freund heiratet Comedy-Serie, USA 2004
  description: Folge 68, Turks und Carlas Hochzeit steht endlich bevor. Aber während Carla in der Kirche wartet, wird Turk bei einer Notoperation festgehalten und fährt danach auch noch zur falschen Kirche. Als er endlich bei seiner Hochzeitsgesellschaft ankommt, ist der Termin jedoch schon verschoben und seine Braut stocksauer. Ebenfalls auf den Mond schießen möchte Elliot J.D., der ihr den Laufpass gegeben hat. Alle Versuche, ihre Freundschaft zu retten, machen sie nur noch wütender.
- eventId: 1479565
  start: 2026-10-07T20:00:00Z
  stop: 2026-10-07T20:35:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine Psychiaterin Comedy-Serie, USA 2004
  description: 'Folge 69, Das Ende von J.D.s Ausbildung naht, aber sein Resümee sieht erschreckend aus, denn am Ende seiner Zeit als Assistenzarzt ist nichts mehr so, wie es war: Turk und Carla kommen frisch verheiratet aus den Flitterwochen zurück, seine einst beste Freundin Elliot möchte ihn am liebsten auf den Mond schießen und eine neue Kollegin wirbelt das Leben in der Klinik gewaltig durcheinander. Nur Dr. Cox ist der Alte - und immer noch der Meinung, dass J.D. nicht selbstständig arbeiten kann.'
  widescreen: true
