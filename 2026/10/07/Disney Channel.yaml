  title: How I Met Your Mother
  subtitle: Ich liebe New Jersey Comedy-Serie, USA 2008
  description: Folge 67, Ted ist oft bei Stella und muss deshalb eine Menge Zeit im Zug zwischen New York City und New Jersey verbringen. Das hat zur Folge, dass er nicht mehr so oft seine Freunde sehen kann. Als Ted ihnen vorschlägt, für einen Samstagabend nach New Jersey zu kommen, stößt er auf Widerstand. Für New Yorker ist New Jersey Provinz und somit verachtenswert. Letztlich lassen sie sich doch breitschlagen und landen an dem besagten Abend in Stellas trostlosen Partykeller.
  widescreen: true
- eventId: 1479562
  start: 2026-10-07T18:35:00Z
  stop: 2026-10-07T19:05:00Z
  title: How I Met Your Mother
  subtitle: Der alte Mann und drei Umzüge Comedy-Serie, USA 2008
  description: Folge 68, Barney versucht Ted zu überreden, nicht zu heiraten und sich nur auf eine Frau zu konzentrieren. Zu diesem Zweck will er mittels Schminke und entsprechendem Outfit beweisen, dass man auch mit 80 noch junge Frauen aufreißen kann ... Indes stehen Ted, Marshall, Lily und Robin vor ihren Umzügen. Ted zieht zu seiner zukünftigen Ehefrau Stella. Marshall und Lily ziehen in ihre neue Wohnung und Robin wird als TV-Korrespondentin nach Japan gehen.
  widescreen: true
- eventId: 1479563
  start: 2026-10-07T19:05:00Z
  stop: 2026-10-07T19:35:00Z
  title: How I Met Your Mother
  subtitle: Unerwünschte Gäste Comedy-Serie, USA 2008
  description: Folge 69, Stellas Schwester Nora ist drei Tage vor der Hochzeit der Bräutigam abhanden gekommen, sodass Stella und Ted den Termin übernehmen. Gemeinsam mit ihren Freunden besuchen sie das Hochzeitshotel auf Shelter Island, das ein Yoga- und Meditationscenter ist. Entsetzt müssen Barney, Marshall und Lily feststellen, dass dort sowohl Alkohol als auch Fleisch verboten sind. Als Stella erfährt, dass Robin auch zur Hochzeit kommt, bittet sie Ted eindringlich, sie wieder auszuladen.
  widescreen: true
