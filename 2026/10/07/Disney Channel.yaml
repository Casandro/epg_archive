  title: Hör' mal, wer da hämmert
  subtitle: Bruderherz Comedy-Serie, USA 1996
  description: Folge 113, Tims Bruder Marty ist auf Jobsuche. Tim bietet ihm einen Job im Studio an, wo er die neue Dekoration aufbauen soll. Bei den Arbeiten kommt es zum Streit zwischen den beiden und Al muss schlichten. Tim entschließt sich, Marty zu kündigen, doch dieser ist ihm bereits zuvorgekommen, was einen erneuten Streit auslöst. Derweil freut sich Brad ungewohnterweise auf die Schule und alle vermuten, dass es wegen einer neuen Freundin sein muss.
