  title: Scrubs - Die Anfänger
  subtitle: Meine Beförderung Comedy-Serie, USA 2004
  description: 'Folge 70, Für lange Zeit sah es so aus, als wäre J.D. der Posten als Chef-Assistenzarzt schon sicher - schließlich hatte er keinen Mitbewerber. Dann bekommt Dr. Cox doch noch einen zweiten Anwärter zur Auswahl: Elliot, die in letzter Sekunde von Molly dazu gedrängt wird, sich auch zu bewerben. Die richtige Katastrophe kommt für J.D. jedoch erst noch, als Dr. Cox'' Entscheidung feststeht. Der Job wird zwischen Elliot und J.D. aufgeteilt. Dumm nur, dass die sich gar nicht grün sind.'
