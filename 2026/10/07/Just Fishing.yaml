  title: Florida on Tour - Teil I
  subtitle: Florida on Tour - Teil I
  description: An der Golfküste Floridas versuchen die Redakteure des Global Angler Magazinsihr Glück auf Tarpon, Jacks und Redfish. Ihre Tour beginnt auf Gasparilla Island am legendären Boca Grande Pass, an dem sich jedes Jahr zwischen April und Juni tausende Tarpon versammeln. Danach reisen sie weiter in den Norden nach Homosassa Springs. Während ihre Frauen den allgegenwärtigen Seekühen über und unter Wasser begegnen, versuchen Peter und Benni den ein oder anderen Redfish zu fangen. DE 2015
