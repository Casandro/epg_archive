  title: 90 godina Narodnog orkestra.
  subtitle: Ova godina je jubilarna za Narodni orkestar RTS-a. Večerašnjim koncertom u MTS dvorani najstariji orkestar u našoj zemlji obeležiće 90 godina rada.
  description: 'Ova godina je jubilarna za Narodni orkestar RTS-a. Večerašnjim koncertom u MTS dvorani najstariji orkestar u našoj zemlji obeležiće 90 godina rada. O značaju, umetničkom doprinosu Narodnog orkestra u oblikovanju nacionalnog muzičkog identiteta, i o programu koncerta govorili su Aleksandra Paladin, odgovorna urednica Muzičke produkcije RTS-a i vokalni solista Čeda Marković. Sve je spremno za ovaj veliki, jubilarni koncert, rekla je Paladin: "Rođendansko uzbuđenje je zaista veliko, 90 godina jer Narodnog orkestra RTS-a i to je ste najstariji ansambl na području Balkana. Ponosimo se time kao i velikim brojem izvođača koji će biti na sceni".'
