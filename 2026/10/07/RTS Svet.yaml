  title: Dokumentarni program
  subtitle: Raffai Anna je proslavila svoj 96. rođendan u junu 2022...Njen svakodnevni život je i dalje bio ispunjen radošću, kojoj doprinose mačka, posete rođake Ilone Pajić i jedne starije komšinice.
  description: Raffai Anna je proslavila svoj 96. rođendan u junu 2022...Njen svakodnevni život je i dalje bio ispunjen radošću, kojoj doprinose mačka, posete rođake Ilone Pajić i jedne starije komšinice. Ana ne zaboravlja tužne i srećne događaje iz svog dugog života i sređuje svoja sećanja baš kao stari porodični foto-album. Međutim, nedavno emitovanje njenog radio-portreta na Radiju Bgd2 u njenoj kući budi sećanja na način koji nikada ranije nije doživeo. Posle nekog vremena, Ana sluša radio-emisiju u kojoj je govorila i ponovo proživljava svoj dramatičan život, pun obrta i preokreta, uspona i padova, slušajući ovu retrospektivu kao neko "spolja" izvan sopstvenog habitusa. Sećanja koja je pokrenuo zvuk opisana su kadrovima, fotografijama, animiranim crtežima, a preplavljujuće emocije ublažava želja za životom koji prevazilazi granice svakodnevnog života.
