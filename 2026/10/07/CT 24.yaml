  title: Předpověď počasí
  subtitle: Bude oblačno až zataženo. Zpočátku čekáme místy i polojasno a v západní polovině Čech ojediněle s deštěm nebo přeháňkami. Během odpoledne a večera se od západu srážky postupně vyskytnou na celém území
  description: |-
    a na východě a jihovýchodě ojediněle i bouřky. Později večer budou v západní polovině Čech srážky a částečně i oblačnost ubývat. Nejvyšší teploty na západě a severu 16 až 20 °C, jinak 19 až 23 °C, na jižní Moravě až 25 °C. Nejvyšší teploty v 1000 m na horách kolem 15 °C. Slabý, místy mírný vítr z jižních směrů, bude dopoledne na východě, později odpoledne a večer od severozápadu na frontě i jinde přechodně zesilovat na čerstvý, místy s nárazy kolem 55 km/h. Za frontou se vítr změní na severozápadní.
