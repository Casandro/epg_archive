  title: Wanderlust! - Der Stevenson-Weg, Frankreich
  subtitle: Wanderlust! - Der Stevenson-Weg, Frankreich
  description: 'Eine Wanderung auf den Spuren des schottischen Schriftstellers Robert Louis Stevenson. 1878 streifte der Autor der "Schatzinsel" durch die Berge des französischen Zentralmassivs. Zwölf Tage lang, mit einer Eselin. Und schrieb ein Buch darüber: "Travels with a Donkey in the Cévennes", die erste Wanderliteratur überhaupt. Der englische Reiseführerautor Bradley Mayhew folgt der Originalroute Stevensons. Sie führt in 12 Etappen von der Vulkanlandschaft des Velay 220 Kilometer weit über die Berge des Lozère bis in den Ort St. Jean du Gard in den Cevennen. Erstes Ziel ist Le Monastier-sur-Gazeille. Hier traf Stevenson seine Reisevorbereitungen und fand seine "Modestine", eine eigenwillige Eselin. Heute gibt es "Leih-Esel" für die Wanderer, auch Bradley mietet sich ein Grautier. Der Weg folgt dem Oberlauf der Loire, passiert Weiler, die von Burgen überragt werden, quert ein Hochplateau. Wie Stevenson übernachtet Bradley in Notre-Dame des Neiges, einem Kloster von Schweige-Mönchen. Dann steigt er auf den Mont Lozère, den höchsten Punkt der Tour. Und trifft Hirten, die ihre Herden auf die Sommerweiden treiben. Wie ehedem. Die Globalisierung scheint hier noch nicht angekommen. Am gesamten Stevensonweg atmet noch das gute, alte, langsame Frankreich. Bradley hört vom Mangel an Arbeitsplätzen, genießt dennoch das gute Essen und die Atmosphäre. "Urfranzösisch", meint er. Nun geht es durch die Cevennen, zunächst bergab, in das tiefe Tal der Tarn. In Pont de Montvert begann der Krieg der Camisarden. Stevenson beschreibt ausführlich die hugenottischen Protestanten und ihren Kampf für Religionsfreiheit. Bradley trifft Wassermüller, Bienenzüchter und Ziegenhirten. Und Bauer Jean-Christophe Barthes, der den Pélardon, den berühmten Rohmilchkäse der Cevennen, produziert. Bradley beendet nach zwölf Tagen wie einst Stevenson die Tour in St. Jean du Gard, einem Städtchen am Fluss Gardon. Mit einer Partie Boule. DE 2014'
