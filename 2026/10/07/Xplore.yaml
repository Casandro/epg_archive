  title: 'Bike Mike: Bodensee - Königssee  - Etappe 5: Kochelsee - Tegernsee'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 5: Kochelsee - Tegernsee'
  description: Hier seht ihr die fünfte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der fünfte Tag beginnt direkt am Kochelsee in Schlehdorf. Tiefhängende Wolken lassen uns am Morgen daran zweifeln, ob wir wirklich in den Bergen unterwegs sind? Es kommt, wie es kommen muss - der gesamte Tag wird ein Bad in den Fluten der offenen Himmelsschleusen! Doch dieser Streckenabschnitt ist zu schön, um ihn nicht bei idealem Wetter zu präsentieren. Lange Rede kurzer Sinn, der Originalfahrtag war nicht zeigenswert, so dass wir diese superschöne Etappe nachgedreht haben Zunächst geht es ein kurzes Stück am Kochelsee entlang, bevor wir nördlich einschwenken und durch die landschaftlich großartigen Kochelsee-Loisach Moore Richtung Benediktbeuern fahren. Hier besuchen wir das beeindruckende Kloster Benediktbeuern mit seiner mächtigen Basilika. Kurz vor Bad Heilbrunn beginnt ein langgezogener Anstieg rund um den Blomberg, der auch als Hausberg Bad Tölzs bekannt ist. Vorbei an der Sommerrodelbahn erreichen wir die Isar und das besagte Bad Tölz. Wir besuchen die imponierende Fußgängerzone der 19.000 Seelen Gemeinde mit ihren farbenfrohen Lüftlmalereien an den Hauswänden. Anschließend gehts wieder durch unberührte Natur auf traumhaften Wegen zum Tegernsee. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1469423
  start: 2026-10-07T15:45:00Z
  stop: 2026-10-07T17:05:00Z
  title: GlobalTrek - Die Kunst der inneren Reise - Red Heart
  subtitle: GlobalTrek - Die Kunst der inneren Reise - Red Heart
  description: Abenteurer Lei Jona bewegt sich auf den Spuren der Nomaden durch die Wüsten Australiens und Afrikas. Inmitten der Abgeschiedenheit kommt es zu unerwarteten Begegnungen und während Lei immer wieder an seine Grenzen kommt, entpuppt sich die Essenz von reisenden Nomaden in ihrer Ambivalenz. Auf der Suche nach Antworten auf die Frage, was einen Nomaden ausmacht, bricht Lei seine eigenen Grenzen. DE 2019
- eventId: 1469424
  start: 2026-10-07T17:15:00Z
  stop: 2026-10-07T17:40:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  description: 'Breslau (Wroclaw) gilt heute als eine der schönsten Städte Polens. Vor allem der historische Marktplatz rund um das mittelalterliche Rathaus erstrahlt wieder in altem Glanz, trotz der schweren Schäden infolge des 2. Weltkriegs. Die Altstadt Breslaus ist eine wahre Augenweide: Das empfand auch Schauspieler Michael Roll bei seinen Streifzügen durch die belebten Straßen und Gassen, stets auf der Suche nach den "Breslauer Zwergen", die als bronzene kleine "Mitbewohner" die Stadt bevölkern. Die Geschichte des Breslauer Zwergenvolks wird der Schauspieler natürlich erzählen. Breslau ist eine Stadt, die Kunst, Kultur und Kulinarik liebt. In etlichen Restaurants leben alte Rezepte aus Großmutters Zeiten auf, während viele Kneipen und Clubs mit allen denkbaren Musikstilen das junge Publikum anlocken. Unterwegs auf der Oder wird Michael Roll klar, warum Breslau auch als "Venedig des Ostens" bezeichnet wird. Denn zahlreiche Brücken über dem Fluss verbinden die Stadtteile und führen so etwa zur historischen Dominsel. Breslau ist auch der ideale Startpunkt für Michael Rolls Ausflüge in die alte Kulturlandschaft Niederschlesien mit ihren Schlössern, Landgütern und Kirchen. Kommen Sie doch mit! DE 2021'
- eventId: 1469435
  start: 2026-10-07T17:45:00Z
  stop: 2026-10-07T18:09:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  description: 'Das Fürstentum Liechtenstein, zwischen Österreich und der Schweiz gelegen: Klein an Fläche zwar, aber großartig was seine Geschichte, seine Kultur und seine landschaftlichen Schönheiten betrifft. Das jedenfalls ist die Erkenntnis von Schauspieler Sebastian Ströbel, die er nun auch seinen Zuschauern vermitteln möchte. Dabei begibt er sich auf den Liechtenstein-Weg. Eine Wanderstrecke, die das gesamte Fürstentum durchzieht und ihn zu den interessantesten Spots des Landes am Alpenrhein führt. Dabei ist er keineswegs alleine! Immer wieder begleiten ihn Prominente des Mikrostaates und erzählen ihm allerlei Geschichten, so etwa die berühmten Ski-Asse Tina Weirather und Marco Büchel. Auf seinen Wandertouren erkundet er die Siedlungen der Walser und lässt sich von einem Spitzenkoch erklären, wie eines der Liechtensteiner Nationalgerichte, die "Käsknöpfli", zubereitet werden. Alles in allem dürfen sich die Zuschauer auf eine Reportage freuen, die unter anderem noch anschaulich darstellt, wie ein Kleinstaat von rund 38.000 Einwohnern funktioniert... ohne eigene Währung, ohne Armee und ohne einen einzigen Kilometer Autobahn. DE 2021'
