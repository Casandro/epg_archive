  title: 'Bike Mike: Bodensee - Königssee  - Etappe 2: Oberstaufen - Oy'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 2: Oberstaufen - Oy'
  description: Hier seht ihr die zweite Etappe unserer ereignisreichen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der zweite Teilabschnitt beginnt im Allgäuer Oberstaufen und bringt uns zunächst durch das Konstanzer Tal über den großen Alpsee Richtung Immenstadt. Hier drehen wir südwärts ein und befahren bei zauberhaftem Sonnenschein für gute 10 km den Illerradweg. Direkt neben dem türkisfarbenen Bergfluss gehts entspannt bis nach Sonthofen. Hinter dieser südlichsten Stadt Deutschlands beginnen dann die Höhenmeter des heutigen Tages. Ab Burgberg zieht die Strasse an, so dass wir nun etwas langsamer die traumhafte Allgäuer Alpenlandschaft genießen. Über den riesigen Rottachspeichersee erreichen wir dann unser heutiges Ziel, Oy-Mittelberg. Kommt einfach mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1469354
  start: 2026-10-07T00:50:00Z
  stop: 2026-10-07T01:13:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 3: Oy - Halblech'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 3: Oy - Halblech'
  description: Hier seht ihr die dritte Etappe unserer ereignisreichen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der dritte Tag beginnt am höchsten Punkt der kompletten Reise, in Oy/Mittelberg. Von hier geht es über fantastische kleine Strässchen entlang der Allgäuer Alpen. Nachdem wir Nesselwang durchquert haben, erreichen wir den sagenhaft schön gelegenen Hopfensee. Nur einen Steinwurf entfernt liegt Füssen, das wir ausgiebig erkunden, bevor wir zu den Königsschlössern Hohenschwangau und Neuschwanstein aufbrechen. Zum Abschluss dieses ereignisreichen Tages bringt uns ein wunderschön angelegter Radweg vorbei am Bannwaldsee zu unserem heutigen Etappenziel Buching bei Halblech. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
