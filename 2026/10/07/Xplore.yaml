  start: 2026-10-07T20:15:00Z
  stop: 2026-10-07T20:45:00Z
  title: Foodwise - Fuding
  subtitle: Foodwise - Fuding
  description: Die Gastgeber sind in Funding in der Provinz Fujian im Südosten Chinas zum Drachenbootfest, bei dem Ruderteams in schmalen, drachenförmigen Booten gegeneinander antreten. Von der Zubereitung und dem Verzehr von Zongzi-Reisklößen bis hin zum Probieren von lokalem Streetfood nehmen die Gastgeber an den Festlichkeiten teil, bevor sie die Welt des weißen Tees erkunden - vom Besuch seines "Mutterbaums" über das Trinken im Zen-Tempel bis hin zu einem Festmahl mit weißem Tee! CN 2023
- eventId: 1469442
  start: 2026-10-07T20:45:00Z
  stop: 2026-10-07T21:15:00Z
  title: Foodwise - Wuyi Mountains
  subtitle: Foodwise - Wuyi Mountains
  description: Die Gastgeber befinden sich in den Wuyi-Bergen der Provinz Fujian, der Geburtsstätte des Oolong-Tees. Hier genießen sie eine Teezeremonie auf einem Bambusfloß, schlemmen alles von geräucherter Gans bis zu Lotussamensuppe und erkunden eine alte Stadt, die einst Tee nach Russland verkaufte. Sie entdecken, dass es hier vor allem auf das Terroir ankommt und dass in den Klippen der Wuyi-Berge der teuerste Tee der Welt wächst. CN 2023
