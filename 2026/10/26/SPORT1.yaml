  title: Die PS Profis Wien
  subtitle: Die PS Profis Wien
  description: 'Neue Gesichter, neue Stadt, aber dieselbe Aufgabe: Mit den "PS PROFIS Wien" bekommt die beliebte Gebrauchtwagen-Doku "Die PS PROFIS - mehr Power aus dem Pott" auf SPORT1 Verstärkung aus der Alpenrepublik. Ab sofort gehen auch Knud und Kofi für die SPORT1-Zuschauer in der österreichischen Hauptstadt auf Autosuche. Nicht nur die Aufgabenstellung hat das Wiener Duo mit den Dortmundern gemeinsam, sondern auch die geballte Fachkompetenz: Knud ist ausgewiesener Experte für US-Musclecars und Hotrods und dazu eine Koryphäe der Airbrush-Technik, die er in Chicago erlernt hat. Zu seinem prominenten Kundenstamm gehört z.B. das Formel-1-Team "Torro Rosso". Sein Partner Kofi ist gelernter Karosseriebauer und hat nach Stationen bei diversen Herstellern mittlerweile seinen eigenen Meisterbetrieb, der auf Restauration, Tuning und Customizing spezialisiert ist.   Heute suchen Knud und Kofi nach Kult. Ein Ami-Klassiker für den waschechten Wiener Franz soll es sein. Das Budget: 30.000 Euro. Der Wunsch: Ein krasser V8 bis maximal Baujahr 1970. Da ist die Auswahl natürlich gewaltig! Vom ersten Ford Mustang bis zu den optisch auffälligen Corvette C3-Klassikern im "Coke-Bottle" Design. Oder wird es ein Musclecar? Vielleicht ein Direktimport aus den Staaten? Franz will auf keinen Fall Geld verlieren, die V8-Wumme sollte in den nächsten Jahren mehr Zinsen abwerfen als ein Sparbuch auf der Raiffeisenbank. Werden sie den passenden Kult- Ami für Franz finden?'
  widescreen: true
