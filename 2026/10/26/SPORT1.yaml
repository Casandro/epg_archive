  title: Hausmeister Krause - Ordnung muss sein Carmen ist schwanger
  subtitle: Hausmeister Krause - Ordnung muss sein Carmen ist schwanger
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. Damit hat Carmen nicht gerechnet: Ihr Schwangerschaftstest ist positiv. Doch wer aus der Heerschar ihrer Verehrer könnte der Vater sein? Angesichts des unehelichen Nachwuchses gerät Dieter in dieser Episode in Panik. Wenn der Leibliche nicht aufzutreiben ist, muss eben Ersatz gefunden werden. Und wer wäre besser geeignet, als Dieters trotteliger Freund Herbert? Doch gerade als der von seiner Vaterschaft überzeugt werden konnte, taucht der leibliche Vater auf: Ein Traum von einem Mann ...'
