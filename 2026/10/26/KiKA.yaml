  description: |-
    Klugscheißen

    Schwer nicht schwer

    Wissen ist keine Schande, finden Clarissa und Ralph, und sorgen wie in jeder Sendung für fünffachen Wissenszuwachs: fünf Fragen, fünf Antworten, fünf Ah -Erlebnisse.

    Heute wird es schwer im Ah!-Studio! Sehr, sehr schwer... So schwer, dass Ralph seinen schwarzen Rollkragenpullover hervorgekramt hat und ein paar schwere Gedichte präsentieren möchte. Clarissa hingegen hält schwere Gewichte für das bessere Thema und auf welche Weise man sie leicht bewegen kann. Wer da wohl thematisch das Rennen macht? Außerdem gibt es noch die Antworten auf folgende fünf (leicht-)gewichtige Fragen.

    Warum werden manche Menschen häufiger von Mücken gestochen als andere?

    Es gibt sie, diese armen Menschen, die Mücken magisch anziehen und mit vielen juckenden Stichen übersäht sind, während andere eher selten Opfer von Stechmücken werden. Woran liegt das? Was hat unsere Atemluft damit zu tun? Und was die Bakterien auf unserer Haut? ...
    HD-Produktion
