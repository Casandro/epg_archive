  description: |-
    Lernen mit Spaß für Kinder

    Tobi und das Sonnensegel

    Puh, heute ist es megaheiß! Zum Glück ist Checker Tobi zur Stelle und hat eine Idee, wie sich die Bewohner der Sesamstraße abkühlen können.

    Mit tatkräftiger Unterstützung von Wolle bauen Checker Tobi, Elmo und Pferd ein riesiges Sonnensegel für die hitzegeplagte Sesamstraße. Außerdem bekommen Pferds schlapp gewordene Sonnenblumen schützenden Mulch, damit sie nicht austrocknen. Doch ist das Sonnensegel womöglich zu schwer, um es aufzuspannen? Erst vereint gelingt es schließlich, das Segel zu hissen - und endlich weht ein kühler Schatten über die Sesamstraße.

    Außerdem möchte Bert einen sonnigen Tag am Meer genießen - herrlich! Doch Ernie macht sich Sorgen um den Sonnenschutz seines Freundes. Bert kann ihn beruhigen: Er hat sich gut eingecremt. Doch Ernie gibt sich damit nicht zufrieden...
