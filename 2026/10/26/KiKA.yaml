  title: Wissen macht Ah!
  subtitle: Schwer nicht schwer
  description: |-
    Klugscheißen

    Schwer nicht schwer

    Wissen ist keine Schande, finden Clarissa und Ralph, und sorgen wie in jeder Sendung für fünffachen Wissenszuwachs: fünf Fragen, fünf Antworten, fünf Ah -Erlebnisse.

    Heute wird es schwer im Ah!-Studio! Sehr, sehr schwer... So schwer, dass Ralph seinen schwarzen Rollkragenpullover hervorgekramt hat und ein paar schwere Gedichte präsentieren möchte. Clarissa hingegen hält schwere Gewichte für das bessere Thema und auf welche Weise man sie leicht bewegen kann. Wer da wohl thematisch das Rennen macht? Außerdem gibt es noch die Antworten auf folgende fünf (leicht-)gewichtige Fragen.

    Warum werden manche Menschen häufiger von Mücken gestochen als andere?

    Es gibt sie, diese armen Menschen, die Mücken magisch anziehen und mit vielen juckenden Stichen übersäht sind, während andere eher selten Opfer von Stechmücken werden. Woran liegt das? Was hat unsere Atemluft damit zu tun? Und was die Bakterien auf unserer Haut? Und das allerwichtigste: Was kann man tun, um die winzigen Plagegeister gar nicht erst anzulocken? Ralph hat sich das mal genauer angesehen.

    Woher kommt die Kettlebell/Kugelhantel?

    Wie kann man am Klopfen an einer Wassermelone erkennen, ob sie schon reif ist?

    Was ist ein Kaventsmann?

    Wie springt ein Flummi?

    "Wissen macht Ah!" im Internet: www.wissen-macht-ah.de
    Moderation: Clarissa Corrêa da Silva, Ralph Caspers

