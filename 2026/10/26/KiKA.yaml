    Reise ins Märchenland

    Finn baut gerade eine Hundehütte für Wuff, als der Zauberschrank sich meldet. Diesmal erlebt er mit Zoé und QuackQuack ein Abenteuer im Märchenland. Dort finden die Freunde Zauberbohnen, aus denen riesige Bohnenranken wachsen. Dann lernen Zoé und Finn einen Tischler kennen, der gerade ein neues Bett für einen Riesen baut. Der Riese ist nämlich ziemlich schlecht gelaunt, weil er in sein altes Bett nicht mehr hinein passt. Aber wie groß ist so ein Riese eigentlich? Und wie soll das neue Bett zu ihm kommen, wenn er hoch in den Wolken lebt?
