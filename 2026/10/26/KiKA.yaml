  description: |-
    Paul und die Eisenbahn

    Paul ist 5 Jahre alt und Eisenbahn-Fan. Zu Hause hat er viele Bücher und sogar eine passende Uniform. Wenn er groß ist, will er in Japan mit dem schnellsten Zug der Welt fahren oder zumindest mit dem schnellsten Zug Europas, dem TGV. Um die schnellsten Züge Deutschlands zu sehen, muss Paul mit dem Bus zum nächstgelegenen Bahnhof fahren. Von dort aus startet seine Reise nach Berlin zur Parkeisenbahn Wuhlheide. Die ist zwar nicht besonders schnell, aber jeder fängt mal klein an. Er darf die Kelle halten, Fahrkarten knipsen und sogar beim Zugführer ganz vorn in der Lok mitfahren. Bei seiner Rundfahrt mit der Bahn erzählt Paul, was er alles über Züge weiß.
    Regie: Anna Beeck
    Buch/Autor: Anna Beeck
    Kamera: Elias Franke

