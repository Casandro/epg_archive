  title: 'alpha-retro: Neue Welt unter 20 (1966)'
  subtitle: Ein Bericht von Gerd Ruge und Werner Kohn aus den USA 1966
  description: 'Gerd Ruge und Werner Kohn berichteten 1966 über die Lebenswirklichkeit amerikanischer Jugendlicher in Stadt und Land, aus der Ober- und der Unterschicht. Einerseits wurden sie von traditionellen Bindungen beeinflusst, andererseits gab es in den 60er-Jahren einen massiven gesellschaftlichen Wandel und eine immer stärker werdende Konsumindustrie. Zu den Aufnahmen der Jugend-Prominenz in Daytona Beach beim Spring Break sagt Ruge: "Hier demonstriert die wohlhabendste Jugend, die die Welt je sah."'
- eventId:
