  title: kreuz & quer reportage
  subtitle: Die Reise der Götter - Das indische Wagenfest Ratha Yatra
  subtitled: true
  description: |-
    Das Ratha-Yatra-Fest mit der großen Wagenprozession gehört zu den ältesten und kraftvollsten Ritualen des Hinduismus. Ursprünglich im Küstenort Puri im Bundesstaat Odisha beheimatet, ehrt sie die Gottheiten Jagannath, Balabhadra und Subhadra. Einmal im Jahr verlassen sie ihren Tempel, steigen auf monumentale Wagen und begegnen den Menschen auf Augenhöhe. Regisseur Klaus Steindl begleitet das aufwendige Schmücken der Wagen - und taucht ein in den Trubel des bunten und für Europäer höchst exotischen Festes in der indischen Megacity Delhi.
