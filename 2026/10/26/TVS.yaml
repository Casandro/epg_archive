  title: Rosamunde Pilcher - Dziedzictwo miłości 1 (odc. 59)
  subtitle: Życie Lindy Hewitt, cenionej fotografki, zmienia się, gdy poznaje Thomasa Williamsa, ornitologa badającego populację nadmorskich ptaków. Między dwojgiem rodzi się silne uczucie.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Vermächtnis der Liebe
    DE,AT, 2005
    Reżyseria: Dieter Kehler
    Występują: Karin Thaler, Tom Mikulla, Christina Rainer, Alexander-Klaus Stecher, Dieter Kirchlechner, Lisa Kreuzer
    To opowieść o lecie. Lato w Freeport, malowniczej wiosce rybackiej na wybrzeżu południowo-zachodniej Anglii. Linda Hewitt mieszka z córką Vanessą i ojcem Jackiem w Lilac House, posiadłości na obrzeżach Freeport. Linda, odnosząca sukcesy fotografka, ma swoje życie pracującej kobiety i matki pod kontrolą, gdy do jej życia wkracza mężczyzna. Thomas Williams jest ornitologiem i przybywa do Freeport z zamiarem badania populacji rybitwy.
