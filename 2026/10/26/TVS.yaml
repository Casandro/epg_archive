  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    Tytuł oryginalny: Der Bergdoktor
    DE,AT, 2013
    Reżyseria: Axel De Roche
    Występują: Hans Sigl, Heiko Ruprecht, Mark Keller, Monika Baumgartner, Ronja Forcher
    "Doktor z alpejskiej wioski" - niemiecko-austriacki serial telewizyjny. Po wielu latach pracy za granicą chirurg z Tyrolu, Martin Gruber, chce sprawić swojej matce urodzinową niespodziankę i złożyć jej niezapowiedzianą wizytę. Rodzinna miejscowość Martina, górska wioska Ellmau, okazuje się zupełnie inna niż ta, którą zapamiętał.
