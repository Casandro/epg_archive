  title: 'Rosamunde Pilcher: Kłopotliwa zamiana 1 (odc. 138)'
  subtitle: Sarah i Michael zamieniają się na domy z Olivią i Fergusem. Okazuje się, że ci mają kłopoty z biznesmenem, który chce przejąć ich posiadłość. Sarah postanawia temu przeciwdziałać.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Haustausch mit Hindernissen
    DE, 2016
    Reżyseria: Stefan Bartmann
    Występują: Wanda Perdelwitz, Oliver Franck, Ursela Monn, Peter Prager, René Schönenberger, Felix Maximilian
    Sarah i Michael postanawiają zamienić swój dom w Australii na położony w Kornwalii wiejski domek Olivii i Fergusa, pary poznanej na giełdzie nieruchomości. Tuż po przyjeździe na miejsce okazuje się, że Michael musi wyjechać służbowo do Londynu. Sarah zostaje sama. Niebawem odkrywa, że Olivia i Fergus mają kłopoty finansowe. Ich posiadłość zamierza kupić Silas McKenzie, który chce zbudować tam centrum kongresowe. Sarah postanawia temu przeciwdziałać.
