  title: Borgia - 1503 - Teil 1
  subtitle: Borgia - 1503 - Teil 1
  description: In Ferrara begegnen Alfonso D'Estes Geschwister Lucrezia mit Feindseligkeit,Alfonso verbietet der Einsamen den Umgang mit seinem unehelichen Halbbruder Giulio. Cesare überrumpelt die abtrünnigen Generäle und lässt sie töten. Seine Brutalität lässt Ludwig erschaudern. In Rom fällt Rodrigo der Malaria zum Opfer. Der syphiliskranke Cesare, Agapito und Goffredo verschanzen sich vor dem wütenden Mob. FR 2013
  ageRating: 16
- eventId: 1019999
  start: 2026-10-26T01:45:00Z
  stop: 2026-10-26T02:39:00Z
  title: Borgia - 1503 - Teil 2
  subtitle: Borgia - 1503 - Teil 2
  description: Der Tod ihres neugeborenen Sohnes schwächt Lucrezias Position, zumal ihre Freundschaft mit Giulio Alfonso D'Estes Zorn weckt. Vor dem Konklave ringt Cesare den widerstreitenden Parteien Zugeständnisse ab. Rodrigos Nachfolger wird sein Erzfeind, der greise Piccolomini, der jedoch nur einen Monat später stirbt. Auf den Stuhl Petri gelangt mit Della Rovere ein Gegner, den Cesare gut zu kennen meint. FR 2013
  ageRating: 16
- eventId: 1020000
  start: 2026-10-26T02:40:00Z
  stop: 2026-10-26T03:34:00Z
  title: Borgia - 1504
  subtitle: Borgia - 1504
  description: 'In Ferrara stirbt der greise Ercole D''Este, Alfonso wird als neuer Herzog akklamiert. Als Della Rovere, der neue Papst Julius, Cesare überlistet, beginnt Cesare, sich seinen Befehlen zu widersetzen. Cesares Position wird durch die Niederlage seines Bruders Goffredo weiter geschwächt. Lucrezias Versuche, Cesare zu unterstützen, laufen ins Leere: Della Rovere lässt ihn in den Kerker werfen.  FR 2013'
  ageRating: 16
- eventId: 1020006
  start: 2026-10-26T03:40:00Z
  stop: 2026-10-26T07:50:00Z
  title: Borgia - 1505
  subtitle: Borgia - 1505
  description: Als Lucrezia erst nach der Geburt ihres Sohnes von Cesares Haft erfährt, verkündet sie kühn, eher ihren Sohn zu opfern als ihren Bruder zu verraten. Trotz Niccolo Machiavillis brillanten Plädoyers lässt Della Rovere ihn im Kerker. Lucrezias Bemühungen bleiben ohne Ergebnis, doch Machiavelli verhilft Cesare zur Flucht. Zurück in Ferrara, erfährt Lucrezia vom Tod ihres jüngsten Sohnes.  FR 2013
  ageRating: 16
