  title: Wie geht das? Überleben auf See
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In der Seemannsschule in Lübeck-Travemünde werden zukünftige Seefahrer auf den Notfall vorbereitet. Denn für Schiffbrüchige zählt jede Sekunde. Die Überlebenszeit in kaltem Wasser vermindert sich von Minute zu Minute. Doch mit einem sogenannten Eintauchanzug sinkt die Körpertemperatur auch nach sechs Stunden nur um zwei Grad und erhöht somit die Chancen auf eine Rettung. Neben dem richtigen Gruppenverhalten im Wasser wird auch das Erklimmen einer Rettungsinsel gelehrt, alles realitätsnah in der Ostsee bei neun Grad.
