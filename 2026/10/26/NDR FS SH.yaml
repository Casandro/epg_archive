  description: Wie kommunizieren eigentlich Elefanten? Und was bekommt der Mensch davon mit? Um seine Herde mal aus der Reserve zu locken, spielt Thomas Günther den Dickhäutern Aufnahmen von Gesprächen anderer Elefanten vor. Kewa und ihre Familie spitzen mächtig die Ohren, stampfen mit den Füßen und schlagen mit dem Rüssel. Was ihnen da wohl gerade an den Kopf geworfen wird? Die mit den Erdmännchen verwandten Zwergmangusten werden an diesem Tag viel Neues entdecken. Jörg Gräser hat ihnen eine Art Forschungsstation gebaut.
