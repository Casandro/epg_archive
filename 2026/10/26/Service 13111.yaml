  title: 'Monika Gruber: Persönlich'
  description: In einem persönlichen Gespräch erzählt Monika Gruber über ihr bayerisches Elternhaus, das ihre Weltsicht bis heute prägt, über ihre Anfänge im Showgeschäft, ihr politisches Engagement, das 2023 zur Großdemonstration in Erding führte und was sie als erfolgreiche Bühnenkünstlerin sonst noch alles erleben durfte.Österreich 2024
