- eventId: 913630
  start: 2026-10-26T00:20:00Z
  stop: 2026-10-26T01:05:00Z
  title: Die geheime Welt des Essens
  subtitle: Eine Frage des Geschmacks (2/3)
  description: |-
    Die Geschmackserlebnisse, die der Mensch beim Essen nicht missen möchte: Von den saftigen Erdbeeren, die süßer erscheinen als sie sind, bis zur erstaunlich schmackhaften Mischung von Meersalz und Karamell. Wie ist die evolutionäre Geschichte unserer Nahrung von statten gegangen? Wie hat sich unser Geschmacks- und Geruchssinn im Laufe der Jahrtausende verändert? In Spanien werden dazu die stärksten Geschmackserfahrungen aufgespürt. In den peruanischen Anden wird nachgegangen, wie eine bittere Knolle, ein Cousin der Kartoffel, in der Landwirtschaft Einsatz fand, um das Überleben der Bewohner in den Bergen sicherzustellen. Anhand innovativer Kameratechnik und erstaunlicher Computeranimationen geht die Reise bis in die Moleküle unseres Essens. Die Dokumentation liefert eine neue Perspektive, wie Geschmack gedacht werden kann: Mehr als um nur gut zu schmecken, benötigte der Mensch seine Geschmacksnerven zum Überleben.
    Dokumentarfilm, Vereinigtes Königreich 2017, R: Toby MacDonald
  genre:
  - '144'
  widescreen: true
- eventId: 913631
  start: 2026-10-26T01:05:00Z
  stop: 2026-10-26T01:55:00Z
  title: TM Wissen
  subtitle: Schnüffler auf dem Acker - Wie Hunde unsere Lebensmittel sicherer machen und mehr
  description: 'Auf unseren Feldern wachsen oft unerwünschte, giftige Beikräuter - und ihre Rückstände können in Lebensmitteln landen. Besonders tückisch: Pyrrolizidinalkaloide aus Pflanzen wie dem Greiskraut, die in vielen Tees nachweisbar und gesundheitsschädlich sind. Doch eine verblüffende Lösung könnte Abhilfe schaffen: speziell trainierte Hunde. In einem Forschungsprojekt der Universität für Bodenkultur Wien testet Dr. Silvia Winter, wie Vierbeiner mit ihrem feinen Geruchssinn Giftpflanzen erschnüffeln - lange bevor sie geerntet werden. Erste Erfolge zeigen: Die tierischen Helfer könnten eine neue Ära in der Lebensmittelsicherheit einläuten.Österreich 2025'
  genre:
  - '144'
  widescreen: true
