  title: Der Blunzenkönig
  description: "Für Franz König (Karl Merkatz), den Blunzenkönig, wird es langsam Zeit, in den Ruhestand zu treten. Der Meister des Blutwurstguglhupfs möchte, dass Sohn Franzl (Andreas Lust) den Hof mit Wirtshaus übernimmt. Doch der Betrieb soll geschlossen werden. So zumindest will es der Lebensmittel-Inspektor. Der Blunzenkönig, der als Fleischhauer auch selbst schlachtet, hätte gegen zu viele Regeln verstoßen. Aber das ist nicht das einzige Problem für König Senior. Denn Sohn Franzl hat andere Zukunftspläne. Der vermeintliche Thronfolger beginnt eine Romanze mit der Veganerin Charlotte (Jaschka Lämmert), und die möchte das Wirtshaus als \"Bio-Körndl-Station\" vermarkten. Zu viele Sorgen auf einmal für den alten Franz. Der Familienpatriarch wird ohnmächtig und muss im Krankenhaus kuriert werden. Als sich selbst seine treue Rösli (Inge Maux) von dem ewigen Grantler abwendet, steht der Blunzenkönig auf einmal ohne Reich und Untergebene da. \n\nDie Komödie \"Der Blunzenkönig\" lebt vor allem vom niederösterreichischen Lokalkolorit und dem perfekten Zusammenspiel des Casts. Der Wiener Regisseur Leo Bauer, bekannt für erfolgreiche Comedyshows (\"Wir sind Kaiser\") und TV-Serien (\"Die Lottosieger\"), stellte eine bis in die Nebenrollen passende Besetzung zusammen. Karl Merkatz (\"Der Bockerer\") spielt den \"Blunzenkönig\" Franz König, Andreas Lust (\"Schachnovelle\") dessen aufmüpfigen Sohn Franzl, Jaschka Lämmert (\"Meiberger - Im Kopf des Täters\") ist die clevere Charlotte und Inge Maux (\"Heimsuchung\") die gute Seele Rösli. Gedreht wurde in Wien und im Weinviertel, u.a. in Ottenthal, Unterstinkenbrunn, Laa an der Thaya und Falkenstein.\nComedy, Österreich 2015, R: Leo Maria Bauer"
  widescreen: true
