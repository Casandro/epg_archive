  title: Monika Gruber - Das Finale
  description: '"Ohne Worte" bietet einen rasanten, scharfen, kritischen, aber auch versöhnlichen Ritt durch die Themen und Befindlichkeiten unserer Zeit. Was darf ich noch sagen, und zu wem? Was kann ich noch glauben, wem möchte ich vertrauen, wohin geht die Welt und warum macht die Schwerkraft auch bei meinem Körper keine Ausnahmen? Die Show gleicht einer fulminanten Achterbahnfahrt, bei der ihr einzigartiges Schmäh-Stakkato immer wieder mit eher leisen Bühnen-Momenten abwechselt. Am Ende des Abends weiß der Zuschauer, was die Welt vielleicht doch noch zusammenhält, und warum eine Frau ab 50 zwar jederzeit ohne Mann, aber niemals ohne Pinzette verreisen sollte. Über zwei Jahre tourte Monika Gruber mit dem Soloprogramm "Ohne Worte" erfolgreich durch Deutschland und Österreich. Jeder Auftritt ein Triumphzug. Sie versteht es wie kaum jemand sonst, ihr Publikum glücklich zu machen. Österreich 2024'
  widescreen: true
- eventId: 963030
