  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory.
  description: OSEMDESIATROČNÝ ÚČET:Pred osemdesiatimi rokmi zaplatili vyše pol milióna korún za les, aby mali kde hospodáriť. Dnes doň nemôžu pomaly ani vstúpiť. Lesy SR totiž zažalovali Lesné spoločenstvo Zohor, ktoré združuje 150 podielnikov. Vyhlasujú, že lesy im nikdy nepatrili. Odvolávajú sa na povojnové Benešove dekréty a tvrdia, že kúpna zmluva z roku 1945 mala formálne chyby. Ako je možné, že štát po 80-tich rokoch spochybňuje list vlastníctva a občanov vyháňa z pozemkov? (2026)
  genre:
  - '32'
