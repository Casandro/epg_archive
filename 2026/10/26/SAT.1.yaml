  title: Richter Alexander Hold - Der Prozess seines Lebens
  subtitle: |-
    Richter Alexander Hold - Der Prozess seines Lebens
    Gerichtsshow, D 2026
  description: |-
    Bei seiner Rückkehr ans Landgericht bietet sich Richter Hold im spektakulären Prozess um einen Oldtimer-Mordanschlag die Chance, eine alte Rechnung zu begleichen. Steht der brutale Mordversuch an Geschäftsmann Andreas L. in Verbindung mit der gewaltsamen Entführung seiner Tochter vor 16 Jahren? Wird es Hold gelingen, den wahren Baby-Entführer diesmal dingfest zu machen? Doch plötzlich drohen sich die schrecklichen Taten der Vergangenheit zu wiederholen.

    Experte: Alexander Hold
