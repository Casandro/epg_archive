  title: Weiblich. Tödlich. Sisters in Crime
  subtitle: |-
    Weiblich. Tödlich. Sisters in Crime
    Real Crime, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Jule Gölsdorf, Karolin Kandler

    Eine Frau wird tot in ihrer Berliner Wohnung aufgefunden. Die Ermittler suchen nach einer Unbekannten, die Zeugen am Tatort gesehen haben. In Düsseldorf steht eine Tochter unter Verdacht, ihre beiden Eltern kaltblütig ermordet zu haben. Durch deren Tod erbt die Frau mehrere Millionen Euro. In Wien sorgt ein Leichenfund in einer Eisdiele für Entsetzen. Zwei menschliche Körper wurden im Keller einbetoniert. Steckt die Betreiberin des Ladens hinter diesem grausamen Verbrechen?
  widescreen: true
