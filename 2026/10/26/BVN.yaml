  title: Dwars door de Pyreneeën
  subtitle: Hoge toppen en eenzame boeren S01 E04. Arnout ontwaakt in het keteldal van Gavarnie. Met stijgijzers trotseert hij met zijn vrienden de sneeuw om via de historische bergpas Brèche de Roland de Spaanse grens over te steken.
  description: 'Arnout ontwaakt in het adembenemende keteldal van Gavarnie. Met stijgijzers aan de voeten trotseert hij met zijn vrienden de sneeuw om via de historische bergpas Brèche de Roland de Spaanse grens over te steken. In het bergdorpje Plan stuiten ze op een hartverwarmende geschiedenis: ze ontdekken hoe de eenzame boeren er destijds via een gedurfde oproep aan een vrouw zijn geraakt. Maar de Pyreneeën tonen ook hun rauwe kant. Even verderop is het drietal getuige van een indrukwekkend natuurspektakel, wanneer gieren in een mum van tijd een dood schaap verslinden. (2026)'
