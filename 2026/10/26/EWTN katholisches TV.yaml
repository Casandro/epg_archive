  title: Dem Tod begegnen (2. Staffel)
  subtitle: Leben mit dem Verlust-Schmerz
  description: Zwei Jahre nach dem plötzlichen Unfalltod ihres Sohnes Severin in Kirgistan spricht Christina Link-Blumrath mit Melanie Oetting. Auch wenn der unermesslichen Verlustschmerz bleibt ist ihr unerschütterliche Glaube an Gott nur gewachsen. Melanie verliert sich nicht im Grübeln und quälenden Fragen nach dem Warum dieses schrecklichen Schicksalsschlags. Vielmehr gelingt es ihr, den Verlustschmerz in große Energie für Projekte umzuwandeln.
  widescreen: true
