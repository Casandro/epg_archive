  title: ARD Konzert
  description: "Alan Gilbert dirigiert das NDR Elbphilharmonie Orchester\n\nEin Geburtstagsständchen zum 80. von John Adams, berauschende Orchesterklänge von Korngold, Heimatgefühle mit Brahms und eine junge Star-Geigerin: Simone Lamsma, das NDR Elbphilharmonie Orchester und Alan Gilbert.\n\nJohn Adams: Lollapalooza\nErich Wolfgang Korngold: Violinkonzert D-Dur op. 35 \nJohannes Brahms: Sinfonie Nr. 1 c-Moll op. 68\n\nSimone Lamsma, Violine\nNDR Elbphilharmonie Orchester\nLeitung: Alan Gilbert\n\nKonzertaufnahme vom 11.09.26 in der Elbphilharmonie in Hamburg\n\nDer US-Amerikaner John Adams wird zwar erst im kommenden Februar 80 - das NDR Elbphilharmonie Orchester gratuliert aber schon jetzt: Sein spritziges \"Lollapalooza\" schrieb Adams einst selbst als Geschenk für Simon Rattle. Die junge niederländische Geigerin Simone Lamsma baut mit Korngolds klangreichem Violinkonzert eine Brücke von Europa in die USA. Den Heimvorteil genießt zum Schluss Johannes Brahms: Seine \"Erste\" entstand teilweise auf Rügen und gehört nicht erst seit der ersten Probe im Großen Saal der Elbphilharmonie vor zehn Jahren zur DNA des NDR Elbphilharmonie Orchesters."
- eventId: 1458882
  start: 2026-10-26T21:00:00Z
  stop: 2026-10-26T22:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Florian Rumberg'
  description: "Das Jazzfest 2026 - Ein Vorbericht \nVom 29. Oktober bis zum 1. November bringt das Jazzfest Berlin Musiker*innen aus mehr als 25 Ländern zusammen und vereint prägende Stimmen der improvisierten Musik mit einer jüngeren, international vernetzten Szene.\nEin spannender Programmpunkt der diesjährigen Ausgabe wird das Konzert von Anthony Braxton. 50 Jahre nach seinem ersten Auftritt beim Festival kehrt der Musiker mit einem eigens zusammengestellten Septett zurück. Die Saxofonistin Camila Nebbia präsentiert mit ihrem Large Ensemble ein brandneues Projekt und Christian Lillinger steuert mit \"Open Form For Society II\" eine weitere Uraufführung bei.\nAuch die Festivalgeschichte wird lebendig: 60 Jahre nach seiner Gründung beschließt Alexander von Schlippenbachs Globe Unity Orchestra die diesjährige Ausgabe in neuer Besetzung. Weitere Akzente setzen Musiker*innen einer jüngeren Generation wie beispielsweise der Saxofonist Immanuel Wilkins mit seinem Quartett oder auch die Improvisationsmusikerin und Cellistin Tomeka Reid.\nFlorian Rumberg stellt ausgewählte Künstler*innen und Projekte vor, spricht Empfehlungen aus und taucht für Sie ab ins musikalische Universum des Jazzfests Berlin 2026.\n\nModeration: Florian Rumberg"
