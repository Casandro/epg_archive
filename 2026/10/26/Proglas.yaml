  title: Před kostelem
  subtitle: Klarisky v Brně-Soběšicích
  description: 'Autor: Martin Weisbauer; Interpret: Pavel Sršeň * V pořadu cyklu Před kostelem bude v královéhradeckém studiu Pavel Sršeň, který společně s režisérkou Olgou Sommerovou připravuje pro českou televizi seriál o různých klášterních komunitách, ve kterých přímo natáčejí. V tomto pořadu si s Pavlem Sršněm popovídáme o natáčení, které proběhlo u klarisek v Soběšicích u Brna. Připravovaným filmem by chtěli lidem připomenout, že my, obyčejní lidé, máme někde ve ztišení kláštera na kolenou někoho, kdo se za nás, za naše děti a za svět vytrvale modlí a dennodenně přináší malé či velké oběti. Film má veřejnosti umožnit tyto lidi lépe poznat.'
