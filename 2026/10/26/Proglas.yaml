  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Potkaly jsme se nedávno s mou kamarádkou. Ona je o trochu starší než já a chystá se už brzy odejít do důchodu. Připadalo mi to zábavné. Musím se přiznat, že si uvnitř pořád připadám jako holka a tak až půjdu do důchodu já, budu se asi trochu cítit jako podvodnice, která na odchod do důchodu rozhodně nemůže mít ještě nárok. Majka to tak ovšem necítila. Byla skleslá. Mně se nedařilo chápat důvod její skleslosti, vždyť nemuset chodit do práce, ale přesto dostávat nějaké peníze a mít čas na všechno, co mě baví, to je přece fajn? Když jsem tohle souvětí vyslovila, podívala se na mne s tak bolestným výrazem, že jsem se až lekla.?Tak prosím tě, co máš za problém?“ zeptala jsem se přímo. Majka se rozplakala. Mezi vzlyky mi vyprávěla, že má pocit, že ještě v životě nic nedokázala a už vlastně skoro končí. A že neví, kde promarnila ten čas, že se pořád jen věnovala práci a rodině a najednou jde do důchodu a kde je nějaké dílo? Nevěřila jsem vlastním uším. Tahle Marie nevidí svůj život jako vrchovatě naplněný? Tak to je asi jediná na světě. Až budu psát knihu o obětavosti, bude to o ní. Jak skvěle vychovala své tři děti, to je zřetelně vidět na jejich životech a na jejich rodinách. Jak laskavě dochovala své i manželovy rodiče, to viděl Bůh. Věrně se modlila vždycky, kdykoli to bylo zapotřebí a já věřím, že spousta viditelných skutků se stala jen díky jejím neviditelným modlitbám.?Ach, Majko, čiň pokání,“ zcela vážně jsem jí nařídila. Ona myslela, že z promarněného života, já trvala na tom, že musí změnit svůj pohled na hodnotu svého života. Před Bohem je přece jedno, jestli někdo píše knihy, operuje nemocné nebo řídí stát. Je to stejně cenné jako dobře vychovat děti, věrně se postarat o staré rodiče nebo se vytrvale modlit. Copak Bůh s námi nedělá všechno, co čeho se pustíme?'
