  description: 'Autor: Dominikánská 8; Interpret: Sandra Kreisslová, David Macek, Michal Stehlík, Lenka Ovčáčková * Co znamená žít v krajině, kde byla kontinuita několikrát radikálně přerušena? Kdo nebo co dnes utváří identitu Sudet a kdo má právo tento příběh vyprávět? Co z minulosti přetrvává v místních vztazích i politice a co naopak vzniká nově? Sudety nejsou uzavřená česko-německá otázka nebo téma minulosti. Způsob, jak mluvíme o dnešních Sudetech ukazuje, jak přemýšlíme o Česku, naší identitě, vztahu k vlastnímu území a jeho obyvatelům.Celou debatu si poslechněte v archivu na webu Dominikánské 8.'
