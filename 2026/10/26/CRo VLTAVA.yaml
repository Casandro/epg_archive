  description: 'Markéta Pilátová: Tsunami blues (12/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkují Dana Černá a Jiří Schwarz. Režie Vlado Rusko (29 min). Natočeno v roce 2015.'
