  title: Koncert SOČR
  description: Přímý přenos koncertu SOČR z Dvořákovy síně Rudolfina nabídne ve světové premiéře na objednávku Rozhlasových symfoniků skladbu Petra Wajsara Katedrála, symfonický obraz na motivy obrazu Františka Kupky. Dále zazní v podání klavíristy Lukáše Vondráčka Klavírní koncert č. 3 C dur, op. 26 Sergeje Prokofjeva. A po přestávce nás pak čeká symfonická báseň Tak pravil Zarathustra, op. 30 Richarda Strausse. Dirigovat bude šéfdirigent SOČR Elias Grandy. Koncertem posluchače provede Jitka Novotná. Přímý přenos bude vysílat Český rozhlas Vltava, v záznamu jej pak následující středu uvede ČRo D-dur.
