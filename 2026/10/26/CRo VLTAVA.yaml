  title: Vizitka
  description: 'ORION, rapper. Vedle urbanistů a historiků debatuje ve vltavském podcastu Betonový lidi spolu s Vladimírem 518 také rapper Michal Opletal alias Orion. Vladimír se se svým souputníkem vrací na Jižní město, do míst, ve kterých vznikaly jejich první nahrávky, tagy a graffiti. Proč si Orionovi rodiče vybrali k bydlení po příchodu do Prahy obří sídliště a ne lukrativní čtvrť Hanspaulka? A dovede si představit, kudy by se jeho život a tvorba ubíraly bez paneláků? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
