  description: 'Ivan Matoušek: Dobré semeno, koukol. Mrtvý muž na koberci a žena, co si vyčítá, že šla na večeři bez něj. Povídka v níž minulost a přítomnost splývají v jedno a příběh je nahlédnut z mnoha různých perspektiv. Povídku současného českého spisovatele pro rozhlas připravila Ivana Myšková. Účinkuje Ivan Jiřík. Režie Vlado Rusko (24 min). Natočeno v roce 2020.'
