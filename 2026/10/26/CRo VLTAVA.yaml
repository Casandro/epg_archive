  title: Akcent
  description: Od středy 28. října si můžete poslechnout v Četbě s hvězdičkou Lolitu od Vladimira Nabokova. Román, který při svém vydání vyvolal skandál, dodnes vzbuzuje otázky, jak zacházet s literárními díly, která překračují naše morální představy. Podobné spory se ale nevedou jen o klasiku. V současnosti se literatura stává také bojištěm politických a kulturních konfliktů. Saša Michailidis se ptá Hany Ulmanové a Evy Klíčové.
