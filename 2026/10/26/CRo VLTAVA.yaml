  title: ArtCafé
  description: 'O svobodě, válce a náboženském fanatismu. Před dvaadvaceti lety v Afghánistánu proběhly první demokratické volby. Jak to dopadlo? "Vrátili jsme se do středověku," tvrdí afghánská zpěvačka Elaha Soroor. Jiří Moravčík pozve na pražský koncert izraelského klavíristy Shai Maestra, představí debut 300 vlaků dua Jakub Jedlinský & Pavel Fischer a francouzskou skupinu Brama. Vysvětlí také, proč si Elaha Soroor s britskou kapelou Kefaya na překvapivě rockovém albu Our Freedoms Must Be Won stojí za tím, že nikdy nebylo důležitější než dnes nahlas mluvit o nebezpečí válek a náboženského fanatismu. E-mail: artcafe@rozhlas.cz'
