  title: Open Doors Magazin
  subtitle: Hoffnung weltweit stärken
  description: |-
    Wie wirkt sich der Ukrainekrieg auf Christen in Afrika aus? Und wie können Kinder in Kolumbien neue Hoffnung schöpfen? In dieser Folge des Open Doors Magazins erfahren Sie, wie verfolgte Christen in der Zentralafrikanischen Republik unter steigenden Preisen leiden - und wie mutige Reisende in Kolumbien jungen Menschen neue Perspektiven schenken. Lassen Sie sich bewegen von Berichten aus zwei Welten, die eins gemeinsam haben: den Glauben, der verbindet. Schauen Sie rein - und werden Sie Teil des Gebetsnetzwerks für verfolgte Christen weltweit!

