  title: Charakterwerkstatt
  subtitle: Ehrlich währt am längsten | Authentizität und Ehrlichkeit
  description: |-
    Manchmal scheint eine Lüge das einzig Richtige zu sein, vor allem wenn es um Leben und Tod geht. Eine mutige Frau verbirgt zwei Fremde vor den eigenen Behörden und riskiert damit alles, um sie zu schützen. Was folgt, wirft eine der spannendsten Fragen dieses Themenmonats auf: Wird sie für ihre Notlüge belohnt, oder für etwas ganz anderes?

    Was macht Ehrlichkeit überhaupt zu etwas Gutem, und warum ist Lügen auf Dauer gefährlicher, als es im Moment scheint? Eine Folge, die zum Nachdenken über Vertrauen, Charakter und den eigenen Umgang mit schwierigen Situationen einlädt.

