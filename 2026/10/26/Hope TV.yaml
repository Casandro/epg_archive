  title: Songs of Hope
  subtitle: Mit Gott durch die Nacht
  description: |-
    Es gibt Zeiten, in denen das Leben dunkel wird: wenn wir trauern, zweifeln oder keine Antworten finden. In dieser Sendung erzählen Lieder von Schmerz und Hoffnung und erinnern daran, dass Gott uns auch durch die Nacht begleitet - selbst dann, wenn wir seine Nähe nicht spüren.

