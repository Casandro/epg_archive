  title: Stuttgart 21 - Die Jahrhundertbaustelle
  subtitle: u.a. Aktuelles
  widescreen: true
  hd: true
  description: 'Das teuerste Großprojekt Deutschlands: Stuttgart 21. Für die einen ist und bleibt es wirtschaftlich unsinnig und voller Fehlplanungen. Andere betrachten es als ein beeindruckendes Zeugnis deutscher Ingenieurskunst. Nur: Züge fahren dort über 30 Jahre nach Projektbeginn immer noch nicht. Stattdessen ist der Stuttgarter Hauptbahnhof und das Schienennetz drumherum ein Dauerprovisorium, das täglich unzähligen Reisenden Geduld abverlangt. Warum dauert der Bau so lange? Und wieso baut die Bahn den Bahnhof überhaupt? Die Doku Stuttgart 21 Die Jahrhundertbaustelle von Helmar Büchel und Michael Fräntzel gibt die Antwort.'
