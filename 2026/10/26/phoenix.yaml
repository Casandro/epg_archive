  description: Eisige Welten führt wieder in den hohen Norden, in die Heimat der großen borealen Wälder und der kargen Tundren. Diese riesige Wildnis wird von jahreszeitlichen Extremen beherrscht. Der Film zeigt Wölfe, die dort im Winter überleben, indem sie als Superrudel aus 25 Tieren bei der Jagd zusammenarbeiten. Mit dem Amerikanischen Bison haben sie sich keine leichte Beute ausgesucht, doch die mächtigen Wildrinder sind die einzigen Tiere, die den Wölfen zu dieser Jahreszeit als Nahrung dienen.
