  title: 'Studio 4: Dijagnoza'
  subtitle: U sklopu Ružičastog listopada na zagrebačkom Cvjetnom trgu održan je "BRA Day", već tradicionalan susret struke s građanstvom.
  ageRating: 4
  genre:
  - '160'
  description: 'U sklopu Ružičastog listopada na zagrebačkom Cvjetnom trgu održan je "BRA Day", već tradicionalan susret struke s građanstvom. Vrlo je važno prenositi znanja o svim mogućnostima liječenja kada je rak dojke dijagnoza, s kojom se treba nositi. U mjesecu koji je posvećen zdravlju dojke govorimo o suvremenom liječenju te o mogućnostima koje pružaju rekonstrukcije - ovaj put s dva aspekta, liječničkog i mlade pacijentice... Gosti su: izv. prof. prim. dr. sc. Domagoj Eljuga, dr. med., spec. plastične, rekonstrukcijske i estetske kirurgije, FEBOPRAS, te pacijentica Maja Galeković, prvostupnica ekonomije.'
