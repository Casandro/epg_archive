  title: Geschichte in Farbe - Der Blitzkrieg
  subtitle: Geschichte in Farbe - Der Blitzkrieg
  description: Im März 1939 rücken deutsche Truppen in der Tschechoslowakei ein. Dies ist der Beginn des Zweiten Weltkriegs. Die deutsche Überrumpelungstaktik heißt "Blitzkrieg" - und funktioniert. Die westlichen Großmächte lassen Hitler zunächst gewähren. Erst als er Polen angreift und nach vier Wochen Warschau fällt, erklären Großbritannien und Frankreich Deutschland den Krieg. Hitler plant da schon die nächsten Feldzüge, um seine Idee eines nationalsozialistischen Weltreichs umzusetzen.
