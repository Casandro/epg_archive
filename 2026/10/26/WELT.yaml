  title: Der Wasserzoll - Kontrolleinheit See im Einsatz
  subtitle: Der Wasserzoll - Kontrolleinheit See im Einsatz
  description: 'Sie retten Leben auf hoher See und machen Schmugglern den Garaus: die Beamten des Deutschen Wasserzolls. Die Reporter haben die Zöllner bei der Arbeit an Bord ihres größten Einsatzschiffs, der Borkum, begleitet. Jeden Tag setzt die 14-köpfige Besatzung ihr Leben aufs Spiel, um Verunglückte zu retten, Schiffsbrände zu löschen oder gegen Piraterie und Schmuggel anzukämpfen.'
