  title: Lost Airships - Amerikas vergessene Luftschiffe
  subtitle: Lost Airships - Amerikas vergessene Luftschiffe
  description: 'Tief im Pazifik liegt ein außergewöhnliches Schiffswrack: die USS Macon. Es sind die Überreste eines Luftschiffs der US Navy - erbaut als fliegender Flugzeugträger, etwa so groß wie die Titanic. In den 1930er-Jahren wurde es eingesetzt, um bis zu fünf Kampfflugzeuge zu transportieren. Doch ihre Hochzeit hielt nicht lange an, Luftschiffe kosteten die US Navy dutzende Menschenleben und Millionen Dollar. Luftfahrt-Experten erzählen die Geschichten verschiedener US-amerikanischer Luftschiffe.'
