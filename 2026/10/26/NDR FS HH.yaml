  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Vertrauen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Bei den Fallers steht die Silage an und Bea hat wieder einmal "freihand" geplant: Der Pasteur für die Molkerei muss ausgesucht werden, Karl muss sich aber nach dem Wetter richten und silieren. Kurzerhand teilt Bea die Aufgaben in Teams: Markus und Karl kaufen den Pasteur ein, sie und Evelyn werden gemeinsam silieren. Während Markus zuversichtlich ist, zweifelt Karl mal wieder. Johanna und Evelyn kämpfen im Hofladen mit Bergen von Hackfleisch. Leni hatte Einkaufsdienst und Hackfleisch war im Angebot. Punkt.'
