  title: NDR Talk Show
  subtitle: 'Moderation: Bettina Tietjen und Hubertus Meyer-Burckhardt'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Amüsant, streithaft, nachdenklich - die \"NDR Talk Show\" ist immer lebendig und im besten Sinne des Wortes interessant. \nBettina Tietjen und Hubertus Meyer-Burckhardt begrüßen in der \"NDR Talk Show\" aus Hamburg folgende Gäste:\n\n* Ekaterina Leonova, Tänzerin\n* Zora Klipp, Gastronomin und Fernsehköchin\n* Martin Reinl, Puppenspieler\n* Caren Miosga, Journalistin und Moderatorin\n* Hendrik Wüst, Ministerpräsident von NRW\n* Rosalie Thomass, Schauspielerin"
- eventId:
