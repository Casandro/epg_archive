  start: 2026-10-26T05:20:00Z
  stop: 2026-10-26T05:50:00Z
  title: Wie geht das? Überleben auf See
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In der Seemannsschule in Lübeck-Travemünde werden zukünftige Seefahrer auf den Notfall vorbereitet. Denn für Menschen, die auf See Schiffbruch erleiden, zählt jede Sekunde. Die Reportage aus der Reihe "Wie geht das?" zeigt außerdem die Entwicklung der Rettungstechniken. Denn fehlerhafte Schwimmwesten beispielsweise waren und sind oft die Ursache für menschliche Tragödien auf hoher See.
