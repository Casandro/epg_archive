  title: Stacja Arktyka 1 (odc. 4)
  subtitle: Oskar Głowacki bada lodowiec na różne sposoby. Jego międzynarodowy zespół skanuje lodowce.
  description: |-
    Tytuł oryginalny: Stacja Arktyka
    PL, 2023
    Reżyseria: Sambor Wilk
    Przemieszczanie się po lodowcu w miejscu, gdzie ubywa masy w wyniku zjawiska cielenia, graniczyłoby z szaleństwem. Dlatego Oskar Głowacki bada lodowiec na różne sposoby. Jego międzynarodowy zespół skanuje lodowce. Ten nowatorski sposób pozwoli lepiej oszacować ich wielkość oraz ocenić, dlaczego lodowce cielą się i jaka jest trasa gór lodowych, które lodowiec urodził.
