  title: Szczyńść Boże, Polsko!
  subtitle: 'W debacie udział biorą znawcy tematu i mieszkańcy regionu: prof. Zygmunt Woźniczka, prof. Ryszard Kaczmarek, prof. Stanisław Nicieja, dr Angelika Blina i dr Karol Makles.'
