  subtitle: Wendepunkte des zweiten Weltkrieges - D-Day
  description: 'Die Alliierten arbeiten an einem Plan mit dem sie Hitlers Atlantikwall in Frankreich durchbrechen und die Nazis überraschen können. Ihre geplante Täuschungsoperation gehört zu den aufwendigsten des Krieges, einschließlich einer riesigen aufblasbaren Armee und Doppelagenten, die den Nazis falsche Informationen zukommen lassen. Der Plan geht auf: Über 160.000 Männer überqueren den Kanal, doch das ist erst der Anfang des heute noch bekannten D-Days.'
