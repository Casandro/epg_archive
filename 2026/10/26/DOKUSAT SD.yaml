  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Schlacht von Stalingrad
  description: Bis zum Sommer 1942 hat Hitler die Kontrolle über weite Teile Mittel- und Südeuropas erlangt und drängt nun seine Streitkräfte weiter in die Sowjetunion. Mit einem Sieg könnte er das Dritte Reich über die Wolga bis zum Ural ausweiten. Doch die Schlacht von Stalingrad wird zu einem entscheidenden Wendepunkt, denn das sowjetische Volk verteidigt sein Land eisern, außerdem sind die Deutschen der Kälte nicht gewachsen.
