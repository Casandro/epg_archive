  description: Emisija Radija 202 o neprolaznom šarmu osamdesetih. Pop kultura i muzika osamdesetih godina prošlog veka ostavile su dubok trag u decenijama koje su usledile. Taj uticaj je povremeno slabio, ali se ponovo vraćao i jačao, tako da na različite načine traje i danas. Muzika, imidž poznatih ličnosti, moda, pojava široko popularnih brendova različitih proizvoda, tehničke inovacije poput "vokmena", mobilnih telefona ili, pak, kompjutera koji su postali pristupačniji običnim ljudima - sve to je ovoj deceniji donelo neprolazni šarm i značaj.
