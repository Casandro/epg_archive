  description: |-
    Deutschland 2026
    Las Vegas - die Glitzerstadt in der Wüste Nevadas ist Sinnbild für den American Dream von Aufstieg und Erfolg. Ein staubiges Wüstennest wurde zur Welthauptstadt ikonischer Casinos.

    Von einer Oase mit natürlichen Quellen zu einer Eisenbahnstation, zum Gangsterparadies, zur "Atomic City" und schließlich zu einer Hotelmetropole. Ein Magnet für Zocker und Glücksritter, Abenteurer und Romantiker.
