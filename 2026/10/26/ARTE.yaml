  title: 'La pègre animale : La vie secrète des parasites'
  subtitle: Une tique dévoile les stratégies des parasites, maîtres de l'infiltration et de la manipulation, pour survivre et prospérer aux dépens des autres espèces.
  description: '"Quand j''étais petit, on m''a dit : ''Chasse une proie et tu mangeras un jour. Parasite-là et tu mangeras toute ta vie.''" Dans ce documentaire insolite, les parasites prennent la parole - par la voix d''une tique experte - pour dévoiler les stratégies qu''ils mettent en oeuvre afin de survivre et de prospérer, en toute impunité, aux dépens des autres espèces. En mêlant humour, science et codes du film de mafia, Paul-Aurélien Combre met en lumière les sombres combines, redoutablement brillantes, de ces maîtres de l''infiltration. Moule des rivières, bactérie Wolbachia, champignon cordyceps... : chacun joue son rôle clandestinement, dans un mélange de manipulation, d''exploitation, de racket et de... meurtre. Réalisateur: Paul-Aurélien Combre (2025)'
  genre:
  - '146'
- eventId: 733169
  start: 2026-10-26T14:44:07Z
  stop: 2026-10-26T15:35:00Z
  title: La pègre animale - La vie secrète des parasites
  description: |-
