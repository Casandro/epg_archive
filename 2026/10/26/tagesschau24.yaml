  description: "Kann Benjamin Netanjahu noch einmal an der Macht bleiben? Seit fast 18 Jahren prägt er Israel wie kein anderer Politiker. Doch nach dem Sicherheitsversagen vom 7. Oktober 2023, Korruptionsvorwürfen und einem internationalen Haftbefehl wächst der Druck. \n\"Alle gegen Netanjahu?\" zeigt einen Wahlkampf unter Hochspannung: Wie stark ist der Langzeit-Premier wirklich? Können seine Gegner die zersplitterte Opposition bündeln? Und gibt es noch Hoffnung auf einen neuen politischen Anlauf - auch im Verhältnis zu den Palästinensern?"
