  title: Torchwood
  subtitle: Unsterbliches Blut
  description: |-
    Das Torchwood-Team operiert an zwei gegensätzlichen Orten auf der Welt gleichzeitig, um die Folgen des "Miracle Day" rückgängig zu machen. In Buenos Aires setzen Rex und Esther auf die Unterstützung der CIA-Zentrale. Der Maulwurf (Marina Benedict) zündet eine Bombe, wodurch mehrere Geheimdienstler sterben. Derweil erreichen Jack, Gwen und Oswald den Komplex in Shanghai. Dort kommt es zum Showdown mit der Mutter des Kartells (Frances Fisher). Offenbar haben die Familienclans ein morphisches Feld generiert, womit sie die Menschheit kontrollieren! Jacks Blut ist der Schlüssel zur Verschwörung, und nun wird es benötigt, um das globale Desaster zu beenden.
    GBR, USA, CAN 2011
