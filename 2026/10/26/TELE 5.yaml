  title: Doctor Who
  subtitle: Hinter den Wänden
  description: |-
    Im Südwesten Englands bekommen es "Doctor Who" und Clara mit einer seltsamen Form von Aliens zu tun. Die "Boneless", also Knochenlosen, verwandeln Menschen in 2-dimensionale Wandgemälde. Es gibt bereits mehrere Vermisste! Die Spurensuche in Bristol wird erschwert, da der Doktor in der geschrumpften TARDIS gefangen ist. Clara nimmt den Timelord samt Mini-TARDIS unter ihre Fittiche, während sie zusammen mit dem Graffiti-Künstler Rigsy (Joivan Wade) versucht, die Außerirdischen zu stoppen. Derweil entwickelt der Doktor ein Gerät namens "2Dis", das Objekte in zwei- oder dreidimensionale Dinge umwandeln kann.
    GBR 2014
