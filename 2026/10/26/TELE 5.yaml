  title: Doctor Who
  subtitle: Die Mumie
  description: |-
    Als der Timelord und Clara eine interstellare Zugreise antreten, müssen sie eine Reihe rätselhafter Todesfälle aufklären. Die Passagiere im kosmischen Orient-Express werden von einer unsichtbaren Mumie attackiert. Wer die grausige Kreatur erblickt, stirbt exakt in 66 Sekunden! Der Doktor findet heraus, dass es sich bei der Mumie um eine sagenumwobene Entität handelt, die auch als "Prophezeiung" bezeichnet wird. Weitere Detektivarbeit im Weltraumzug bringt ans Licht, dass die Mumie in Wahrheit ein untoter Soldat aus der Zukunft ist, der zum Morden verdammt wurde und futuristische Technologien einsetzt.
    GBR 2014
