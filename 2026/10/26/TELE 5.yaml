  title: Stargate
  subtitle: Das zweite Tor
  description: |-
    Auf dem Planeten Madrona ist es zu einem ungeheuerlichen Raub gekommen: Unbekannte, die sich als Stargate-Team ausgegeben haben, sind mit einem mächtigen Kraftstein durchgebrannt, der die Fähigkeit besitzt, das Klima zu manipulieren. Jetzt droht dort eine Eiszeit mit tödlichen Folgen! Um die Dinge wieder geradezurücken, muss die echte SG-1-Truppe schleunigst ermitteln: Wer sind die dreisten Trittbrettfahrer? Steckt der Geheimdienst NID dahinter? Letzteres scheint plausibel. Denn das zweite Stargate aus der Antarktis wurde aktiviert, und die Spur der meteorologischen Wunderwaffe führt direkt zur Area 51.
    USA 1998
