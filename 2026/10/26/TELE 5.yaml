  title: Stargate
  subtitle: Die Tok'Ra - Teil 1
  description: |-
    Als Captain Samantha Carter von rätselhaften Visionen heimgesucht wird, beschließt das SG-1-Team Kontakt zu den Tok'ra aufzunehmen. Da Carter vor einiger Zeit als Wirtin von Jolinar diente, verfügt sie nun offenbar über eine Art unsichtbare Verbindung zu der Goa'uld-Subspezies. Aber als es Colonel Jack O'Neill und seinen Leuten gelingt, die Tok'ra auf einem fremden Planeten aufzuspüren, ist der Empfang alles andere als freundlich: Die hochintelligenten Symbionten stufen SG-1 als Sicherheitsrisiko ein, was eine Rückkehr zur Erde vorerst ausschließt.
    USA 1998
