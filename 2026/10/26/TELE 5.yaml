  title: Doctor Who
  subtitle: Tötet den Mond
  description: |-
    2049 steht die Welt kurz davor, den Mond in die Luft zu jagen. Da die Masse des Erdtrabanten stark zugenommen hat, kommt es zu tödlichen Flutwellen. Der Doktor und Clara fliegen mit dem Space Shuttle von Captain Lundvik (Hermione Norris) zum Mond, wobei sie einige erschreckende Entdeckungen machen. Die Astronaut:innen befinden sich auf einer Selbstmordmission: Sie sollen den lästigen Himmelskörper mit Atombomben pulverisieren! Bei näherer Betrachtung kommt zudem heraus, dass es sich beim Mond in Wahrheit um ein gigantisches Ei handelt. Aber welche Kreatur wird hier in Kürze schlüpfen? Und was bedeutet das für die Zukunft der Menschheit?
    GBR 2014
