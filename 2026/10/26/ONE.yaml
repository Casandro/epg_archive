  description: "Ausstrahlung auch im englischen Originalton\n\nDer erfolglose Schriftsteller Keane steckt in einer Ehekrise: Sein zweiter Roman will nicht entstehen und nach einem heftigen Streit fordert seine Frau Suzie die Scheidung. \nIn einer Bar trifft Keane den exzentrischen Kollmick, der behauptet, sein größter Fan und obendrein ein pensionierter Serienmörder zu sein. Er möchte, dass Keane ein Buch über ihn schreibt. Keane lehnt ab, doch Kollmick begleitet ihn betrunken nach Hause, wo Suzie überraschend auftaucht. Als sie fragt, wer er sei, stellt sich Kollmick nur als 'Berater' vor."
