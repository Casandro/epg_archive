  description: |-
    Ein Paar aus Wien gönnt sich eine Auszeit und mietet sich für ein halbes Jahr in einer Schweizer Berghütte ein. Die Kinderbuchautorin Anna (Birgit Minichmayr) möchte endlich einen Roman für Erwachsene schreiben und Nick (Philipp Hochmair), Koch und Restaurantbetreiber, plant ein Kochbuch über vergessene Schweizer Gerichte. Beide hoffen, dass die Auszeit auch ihrer Beziehung guttut.

    Ein Schaf ist zur falschen Zeit am falschen Ort. Es steht auf der Straße und wird von Nick und Anna überfahren. Sie selbst erleiden nur leichte Verletzungen und können die Reise fortsetzen. Dennoch ist nach dem Unfall nichts mehr wie vorher.
