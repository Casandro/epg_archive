  title: 'Dating ohne Grenzen: Für immer Single?'
  subtitle: In großer Runde -Teil 1
  description: |-
    Beim großen Wiedersehen ist die Stimmung schon vor dem ersten Kameraschwenk am Kochen: Cortney knöpft sich Colt wegen seiner Lästereien und wegen anderer Frauen vor - und bekommt viel Unterstützung aus der Runde. Sophie und Pedro sind so zerstritten, dass sie kaum noch ein Wort wechseln. Liz sorgt dagegen mit einem Verlobungsring von Alec für überraschte Gesichter, doch dann taucht Villa auf und gesteht, dass er noch Gefühle für sie hat. Auch Gino muss sich unangenehmen Fragen stellen. Und als plötzlich Kims Sohn Jamal ins Spiel kommt, wird es richtig pikant: Was lief zwischen ihm und Liz?
