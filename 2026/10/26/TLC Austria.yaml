  title: Married To Evil
  subtitle: Das Grab im Keller
  description: |-
    Heidi Grant und Chris Franklin führen zunächst eine glückliche Beziehung. Beide sind geschieden, lernen sich über soziale Medien kennen und heiraten. Doch bald zeigen sich Risse in der harmonischen Fassade: Chris fängt wieder an zu trinken, wird launisch und gewalttätig. Die einst liebevolle Ehe verwandelt sich in ein gefährliches Spiel aus Kontrolle, Angst und Verzweiflung. Als Chris eines Tages spurlos verschwindet, beginnen Familie und Polizei fieberhaft zu suchen. Doch je tiefer die Ermittler graben, desto mehr Widersprüche tauchen auf - und ein schrecklicher Verdacht nimmt Gestalt an.
    GBR 2024
