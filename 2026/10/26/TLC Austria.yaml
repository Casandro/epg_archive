  title: Married To Evil
  subtitle: Eine fatale Affäre
  description: |-
    Maria Muñoz glaubt, in Joel Pellot den Mann ihres Lebens gefunden zu haben. Nach außen führt das Paar ein perfektes Familienleben, doch die Fassade beginnt schnell zu bröckeln: Joel betrügt Maria mit einer Kollegin aus dem Krankenhaus und belügt sie über Monate. Als Maria endlich die Wahrheit erfährt, will sie sich trennen und ein neues Leben beginnen. Doch Joel, ein OP-Pfleger mit Spezialwissen über Narkosemittel, schmiedet einen perfiden Plan. In einer Nacht des Grauens spritzt er seiner Frau tödliche Medikamente, inszeniert ihren Tod als Suizid - und ist überzeugt, den perfekten Mord begangen zu haben.
    GBR 2024
  widescreen: true
- eventId: 1033779
