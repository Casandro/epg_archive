  title: Die Geisterkliniken
  subtitle: Die alte Besucherin
  description: |-
    Rettungssanitäterin Ryleigh kommt zu einer routinemäßigen Patientenverlegung in ein Krankenhaus und spürt sofort, dass dort etwas nicht stimmt. Im Zimmer des Patienten angekommen, sieht Ryleigh eine weiße Erscheinung über dem Bett schweben, ergreift panisch die Flucht und muss bei ihrer Rückkehr entsetzt feststellen, dass der Mann verstorben ist. Seit Apotheker Devin ein kleiner Junge war, werden er und seine Familie von einem aggressiven Wesen mit Verbrennungsnarben im Gesicht heimgesucht. Doch jetzt will er seine Familie von der dunklen Energie zu befreien, die der Geist mit sich bringt.
    GBR 2020
  widescreen: true
