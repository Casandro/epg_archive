  title: Das vergessene Leben
  subtitle: DE 1997
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Eine verstörte alte Frau zu Fuß auf der Autobahn: "entlaufen", "ausgesetzt"? Eine Antwort bleibt die störrische Alte schuldig. Auch in der psychiatrischen Abteilung des nächstgelegenen Krankenhauses gibt sie kein Sterbenswörtchen von sich. Die Polizei wird eingeschaltet, doch es meldet sich niemand, der die alte Frau vermisst. Der ehrgeizige Praktikant Axel, der sich auf sein Medizinstudium vorbereitet, versucht, ihr Schweigen zu brechen und das Geheimnis um ihre Person zu lüften. Und tatsächlich findet er einen Schlüssel zu ihrer Seele: die Liebe zur Musik, die beiden gemeinsam ist.'
