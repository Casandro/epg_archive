  audiodesc: true
  description: "Gewürzgurken unter der Lupe: grün, knackig, würzig - aber auch gut?\n \nMit Salz, Kräutern, Chili oder Knoblauch: Eine große Auswahl an Gewürzgurken gibt es eigentlich in jedem Supermarkt oder Discounter. Doch in manchen Produkten wurden zuletzt auch bedenkliche Pestizide entdeckt. Und auch Aromastoffe sowie der Zuckergehalt sorgten für Kritik. Welche Gewürzgurke kann sowohl im Labor als auch im Geschmacks-Check überzeugen?"
