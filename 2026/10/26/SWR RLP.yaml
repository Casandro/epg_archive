  description: Ändert sich die Sozialversicherungsnummer, wenn man heiratet? Sollte ein selbstgebautes Igelhaus zwei Kammern haben? Diese und viele weitere kuriose Fragen rund um den Alltag gibt es im SWR Wissensquiz. Moderatorin Jess Schöne und Schauspieler Antoine Monot treten gegen Comedian Bodo Bach und Moderatorin Enie van de Meiklokjes an. Kreativität und Ideenreichtum sind gefragt beim Erraten der Antworten auf knifflige Fragen des täglichen Lebens.
