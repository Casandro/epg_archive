  description: Nach 20 Jahren kehrt Zimmermann Johannes Keinath in seine Heimatstadt am Bodensee zurück. Als er sich bei einem Raubüberfall gegen zwei Ganoven zur Wehr setzt, glaubt er, einen der beiden tödlich verletzt zu haben. Als Mönch verkleidet taucht er in einem Dorf unter. Dort gewinnt "Bruder Johannes" das Vertrauen des protestantischen Pfarrers Clausen und kämpft für den Erhalt der Gemeindekirche.
