  subtitle: Über den Tod hinaus
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  genre:
  - '16'
  description: "Der Selfmade-Millionär und geniale Erfinder Ulrich Harmsen ist tot. Aufgrund seiner schweren, unheilbaren Krankheit hat er Suizid begangen - glaubt zumindest seine Familie. Bis die aufgebrachte Tanja Sanftrieder die Trauerzeremonie sprengt. Sie ist sich sicher: Harmsen wurde ermordet. Seine Leiche dürfe nicht eingeäschert werden, denn dann werden alle Beweise vernichtet. \n\nFinn Kiesewetter und Lars Englen sind sich des heiklen Auftrags bewusst, die Trauerfeier des angesehenen Lübecker Unternehmers zu stoppen. Doch tatsächlich stellt sich bei der Obduktion heraus, dass Harmsen einem Mord zum Opfer gefallen ist."
