  title: Chip im Kopf
  subtitle: Wie Gehirnimplantate die Medizin verändern Film von Christian Brandt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Michael Mehringer trainiert, einen Roboterarm nur mithilfe seiner Gedanken zu steuern. Seit einem Unfall ist er vom Hals abwärts querschnittsgelähmt. Die neue Technologie, die ihm etwas Selbstständigkeit zurückgeben könnte, heißt Brain-Computer-Interface (Hirn-Computer-Schnittstelle), kurz BCI.
    Die neue Technik kann die Medizin verändern und vielen Menschen helfen. Aber welche Gefahren birgt es in Zukunft, wenn immer mehr Menschen ihr Gehirn mit Computern verbinden? Werden Menschen zum Beispiel ihre Leistungsfähigkeit mithilfe von BCI optimieren wollen? Lena Ganschow begibt sich auf Spurensuche.
