  subtitle: Nordgriechenland
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Heute müssen sich die Abenteurer einer ganz besonderen Herausforderung im eiskalten Wasser eines Gebirgsflusses stellen: Canyoning. Nach einem Sprung ins Flussbett geht es in rasantem Tempo rutschend über die glattgewaschenen Steine flussabwärts. Ein Riesenspaß, aber nicht ungefährlich. Völlig durchgefroren erreichen die sechs abends ihr Camp an einem verlassenen Einsiedlerlager. Tom überrascht seine Freunde mit einer selbstgemachten Wildnispizza aus dem Steinofen. So kann der ereignisreiche Tag gemütlich ausklingen.'
