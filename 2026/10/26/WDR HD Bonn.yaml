  audiodesc: true
  description: In der Wildnis gibt es keine Toilette, daran haben sich die sechs Jugendlichen am neunten Tag ihres Abenteuers schon gewöhnt. Sie sind mittlerweile Profis im Umgang mit dem sogenannten Kackspaten, der immer zum Einsatz kommt, wenn ein Geschäft erledigt werden muss. Dummerweise haben sie den Spaten morgens im letzten Camp liegen lassen. Jannis muss mal, dringend. Was nun? Wildniscoach Tobi wartet unterdessen an einer wackeligen Seilbrücke auf die Gruppe. Auf dieser müssen die sechs einen Fluss überqueren. Eine schwierige Mission.
