  title: Süd Blick Teil 1 (Wh.)
  subtitle: Sicherheit im Alpenraum - Tagung der Bayern-Südtirol-Gesellschaft in Kiefersfelden +++ Knott bei Eggstaett IG Metall will zurück zum Tarifvertrag +++ 260.000 Euro für bessere Straßen in Feldkirchen-Westerham
  description: 'Drogenkriminalität, Mafia und Drohnen: Bei einer Tagung in Kiefersfelden diskutierten Behörden und Experten die Sicherheit im Alpenraum. Bayerns Innenminister Herrmann betonte moderne Technik und grenzüberschreitende Zusammenarbeit, etwa beim neuen Drohnenabwehrzentrum. +++ Fast 30 Jahre lang galt beim Bremsen- und Achsenhersteller Knott in Eggstätt ein Tarifvertrag mit der IG Metall. Diesen Vertrag hat die Geschäftsführung gekündigt. Gewerkschaft und Betriebsrat kritisieren diese Entscheidung. +++ Feldkirchen-Westerham erweitert sein Straßensanierungsprogramm: Dank günstiger Ausschreibungen werden statt drei nun fünf Ortsstraßen erneuert. Für rund 260.000 Euro werden Asphalt, Bankette und Entwässerung verbessert. Start noch dieses Jahr, teils mit Vollsperrungen; Abschluss bis 2027.'
