  title: MareTV
  subtitle: Taiwan - Kleiner Inselstaat mit großer Vielfalt
  description: 'Taiwan ist ein Land von schier unglaublicher Vielfalt. Die Natur der Insel vereint auf kleinster Fläche die schönsten Seiten Asiens. Im Osten Steilküsten mit Berggipfeln, Hochebenen und heißen Quellen. Im Süden palmengesäumte Sandstrände, Korallenriffe und Lagunen. Die Taiwaner leben zwar in einer hochtechnisierten Welt, sind aber zugleich fest verankert in uralten Traditionen: Lin Liang-tai hat in seinem Leben schon Hunderte aufwendig verzierte Holzboote gebaut. Doch sie haben nur eine kurze Lebenszeit: Sie enden auf Taiwans legendärem Wang-Ye-Festival. Für die dem Meeresgott gewidmete Tempelzeremonie wird ein zehn Meter langes Boot gesegnet, mit Opfergaben beladen und durch das Dorf bis an den Strand gezogen. Dort wird es angezündet. Und mit ihm verbrennen die bösen Geister des Ortes.'
  genre:
  - '161'
  widescreen: true
  hd: true
