  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nach einer einfachen Zahnbehandlung gelangten Bakterien aus dem Mundraum ins Herz von Christoph Siemons und zerstörten eine Herzklappe. Die Krankheit wurde erkannt und im Krankenhaus aufwändig behandelt. In einer durchwachten Nacht gelobte der erfolgreiche Musiker, Gott eine Messe zu schreiben, als Dank für seine plötzlich wiedergefundene Hoffnung. Er genas und setzte sein Gelübde in die Tat um. "Sinfoglesia" heißt das Album, das er mit einer Vielzahl von Profimusikern über acht Jahre produziert hat. Wie er gedenkt, sein Werk an Gott zu übergeben, verrät er im Gespräch mit Moderator Daniel Deman.'
