  title: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  description: 'Hongkong einmal anders! Das ist das Motto der heutigen Folge. Begleiten Sie den umtriebigen Schauspieler Hannes Jaenicke quer durch ein Hongkong abseits der Touristenpfade.  Der Schauspieler beginnt seine Reise auf dem höchsten Punkt auf Hongkong Island und wagt von dort aus den Abstieg zu einem langen Sandstrand, der sich ideal zum Stehpaddeln eignet. Anschließend lässt er sich zu einer Radtour einladen. An Felsen klettern, vorbei an spektakulären Wasserfällen und tropischen Pflanzen: auch das ist in Hongkong möglich. Zu den beliebtesten Freizeitaktivitäten in der Weltmetropole gehört der Pferdesport, insbesondere Pferderennen locken jede Woche Tausende von Zuschauern an. Pferdewetten inklusive. Ein Spektakel, das sich Hannes Jaenicke nicht entgehen lässt.  Auch eine eindrucksvolle Kayaktour gehört zu Hannes Jaenickes Programm, vorbei an den zahlreichen kleinen Inseln Hongkongs, teilweise von Mangroven gesäumt. DE 2005'
