  title: VIP Trip - Prominente auf Reisen 4 - Sabah mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 4 - Sabah mit Richy Müller
  description: Der malaysische Bundesstaat Sabah auf der Insel Borneo ist noch immer eine Region voller Geheimnisse und Abenteuer.  Aus diesem Grund hat sich Tatort-Kommissar Richy Müller zu einer ausgiebigen Expedition quer durchs Land entschieden. Dabei informiert er sich zunächst an Ort und Stelle über die Lebensgewohnheiten der Einheimischen, der fünf Stämme und ihre jahrhundertealte Kultur. Der Regenwald prägt noch heute das Leben der indigenen Bevölkerung. Eine abenteuerliche Tour durch die "grüne Hölle Borneos"  vermittelt Richy Müller bald den Reichtum von Fauna und Flora in Sabah. Der Schauspieler lernt aber auch, wie sehr die Orang Utans auf Borneo bedroht sind. Beim Besuch einer Aufzuchtstation für die Tiere wird das besonders deutlich. Doch für den Schauspieler kommen in Sabah auch sportliche Aktivitäten nicht zu kurz. River-Rafting und Tauchgänge zu den einzigartigen Korallenriffen vor der Küste Sabahs gehören dazu, manchmal sogar mit einem romantischen Dinner am Strand als Abschluss.  Denn bei Richy Müllers Exkursionen in die Kultur des Bundesstaates darf ein Streifzug durch die malaysische Küche nun wirklich nicht fehlen. Sie gilt zurecht als eine der vielfältigsten Asiens. DE 2013
- eventId:
  - 1020198
  - 673285
  start: 2026-10-26T10:50:00Z
  stop: 2026-10-26T11:22:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 4 - Hongkong mit Hannes Jaenicke
  description: 'Hongkong einmal anders! Das ist das Motto der heutigen Folge. Begleiten Sie den umtriebigen Schauspieler Hannes Jaenicke quer durch ein Hongkong abseits der Touristenpfade.  Der Schauspieler beginnt seine Reise auf dem höchsten Punkt auf Hongkong Island und wagt von dort aus den Abstieg zu einem langen Sandstrand, der sich ideal zum Stehpaddeln eignet. Anschließend lässt er sich zu einer Radtour einladen. An Felsen klettern, vorbei an spektakulären Wasserfällen und tropischen Pflanzen: auch das ist in Hongkong möglich. Zu den beliebtesten Freizeitaktivitäten in der Weltmetropole gehört der Pferdesport, insbesondere Pferderennen locken jede Woche Tausende von Zuschauern an. Pferdewetten inklusive. Ein Spektakel, das sich Hannes Jaenicke nicht entgehen lässt.  Auch eine eindrucksvolle Kayaktour gehört zu Hannes Jaenickes Programm, vorbei an den zahlreichen kleinen Inseln Hongkongs, teilweise von Mangroven gesäumt. DE 2005'
