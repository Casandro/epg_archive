  description: 'Die Gefühlswelten fast aller Beteiligten geraten ziemlich durcheinander: Da ist Björn Liebig, der sich von seinem neuen Freund als dubioses Bekenntnis zur monogamen Zweisamkeit einen "Peniskäfig" anlegen lässt. Als sich dieser nicht mehr öffnen lässt, sollen Nina Sieveking und Lukas Petersen Björn aus der delikaten Klemme helfen. Und da ist das Ehepaar Böckmann, das kurz vor seiner Goldenen Hochzeit steht. Doch plötzlich verbringt Rolf Böckmann sehr viel Zeit bei der neuen, jüngeren Nachbarin ...'
