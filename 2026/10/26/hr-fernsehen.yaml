  title: 'Mein Körper. Meine Wohlfühltemperatur: Wie halte ich Kälte aus?'
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Gerade im Winter mögen es die meisten von uns mollig warm. Das macht es dem Körper leichter, seine Kerntemperatur von 36,5°C bis 37,5°C zu halten. Und nur mit dieser Kerntemperatur können alle Stoffwechselabläufe optimal funktionieren, kann der Körper reibungslos denken und agieren. Doch so sehr viele Menschen die Wärme lieben, eigentlich ist unser Körper gesünder und leistungsfähiger, wenn er ständig wechselnden Temperaturen und vor allem Kältereizen ausgesetzt ist.
