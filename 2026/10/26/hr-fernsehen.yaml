  description: Im Rhein-Main-Gebiet gestaltet Katja Eulenbach, Landschaftsarchitektin aus Wiesbaden, exklusive Luxusgärten für wohlhabende Kundschaft. Unter der Erde steckt modernste Gartentechnik, über der Erde entsteht eine perfekte Illusion von Natur - mit hohen Hecken, alten Bäumen und unsichtbarer Bewässerung, die jeden Garten wie ein jahrzehntealtes Paradies wirken lässt. Jürgen Kirchner zählt zu Deutschlands bekanntesten Gestaltern für japanische Gärten. Seine kunstvollen Wasserlandschaften mit Koi-Teichen, Bonsai-Bäumen und tonnenschweren Findlingen aus dem Taunus sind wahre Gesamtkunstwerke.
