  description: 'Das Schicksal führt Lotte Wagner und Matthias Winkelmann im Berufsverkehr zusammen. Sie: eine junge alleinerziehende Mutter mit zwei heranwachsenden Kindern und fehlendem "Mannkontakt"; er: ein geschiedener Top-Manager mit Herzproblemen. Als sich Lotte und Matthias trotz aller Unterschiede langsam näherkommen, scheint einer gemeinsamen Zukunft nichts im Weg zu stehen. Wäre da nicht der mächtige Konzern, für den Matthias arbeitet. Dieser plant, eine kleine Mittelstandsfirma, bei der auch Lotte beschäftigt ist, in den wirtschaftlichen Ruin zu treiben.'
