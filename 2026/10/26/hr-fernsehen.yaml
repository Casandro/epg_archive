  description: 'In dieser Folge kommt Uwe B. an Bord des Hausboots. Er sucht dringend Hilfe, denn seit einem traumatischen Arbeitsunfall geht es mit seiner Gesundheit bergab. Das Erlebnis hat ihn dick und krank gemacht: Er leidet unter Bluthochdruck, Sodbrennen, Kopfschmerzen und vor allem einer stark verfetteten Leber. Ernährungs-Doc Matthias Riedl zeigt dem 59-Jährigen, wie weit Die Erkrankung bereits fortgeschritten ist: mehr als 60 Prozent seiner Leberzellen sind verfettet, bis zu fünf Prozent wären normal.'
