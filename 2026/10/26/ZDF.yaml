    Die Zeit läuft gegen Kai. Heute kommt sein gewalttätiger Bruder Mirko vorzeitig aus dem Gefängnis. Am Abend wird er vor Kais Tür stehen und sein Geld zurückverlangen, das nicht mehr da ist.

    Kai sollte das Geld für Mirko aufbewahren - doch es ist längst ausgegeben. Für den 31-jährigen Ehemann, Vater und Arbeiter in einer Hühnerfabrik nördlich von Duisburg beginnt ein Tag unter wachsendem Druck, in dem die Situation letztendlich eskaliert.
