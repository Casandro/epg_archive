  title: Hör' mal, wer da hämmert
  subtitle: In Angst und Schrecken Comedy-Serie, USA 1997
  description: Folge 157, Jill macht sich Sorgen, weil Mark auf keine Halloween-Party geht und seine Brüder ihn nicht mitnehmen wollen. Umso erleichterter ist, als Mark ihr mitteilt, dass er plant, mit einem Freund einen Horrorfilm für seinen Filmkurs zu drehen, in der alle Taylors mitspielen sollen. Nachdem die ersten Szenen abgedreht sind, können Jill und Tim nicht widerstehen, nachts heimlich das erste Material zu sichten. Doch was sie sehen, beunruhigt sie sehr, denn die Geschichte handelt offenbar von einem kleinen ungeliebten, vernachlässigten Jungen, der seine Eltern in Monster verwandelt...
