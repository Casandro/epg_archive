  description: |-
    Deutschland 2026
    DIE LINKE - Soziale Ungleichheit und hohe Mieten gehören zu den gesellschaftspolitischen Topthemen in Deutschland. Mit ihrer Forderung nach einer Vergesellschaftung von Immobilien hat DIE LINKE die Berliner Wahl gewonnen. Sie löst allerdings auch heftige Kritik aus. Außerdem sieht sich die Partei einer Reihe weiterer Vorwürfe ausgesetzt.

    Wohnen, aber wie? - Gespräch mit Journalist Heribert Prantl über das Thema Vergesellschaftung und ihre Verankerung in der Verfassung der Bundesländer.

    Ost-Passage Theater in Leipzig - Das Ost-Passage Theater Leipzig hat sich eine neue Spielstätte erkämpft. "Kulturzeit" hat mit den Theatermachern über ihr Projekt gesprochen und zeigt, wie es mit viel Eigeninitiative und ein wenig öffentlichen Fördermitteln gelingen kann, Kulturräume als Orte der Begegnung und des kommunikativen Austauschs zu schaffen.

    Poetry-Slam-Weltmeisterschaft - Der Schweizer Valerio Moser hat am 9. Oktober 2026 in Durban die 5. Weltmeisterschaft im Poetry-Slam gewonnen.

    Wirtshaus in der Steilwand - Alles begann im 17. Jahrhundert mit einer Eremitenklause an einer steilen Felswand bei Oberaudorf. Jetzt sucht der mittlerweile 81-jährige Konrad Walser, Wirt und Besitzer des einmaligen Wirtshauses "Weber an der Wand", einen Nachfolger.

    Moderation: Vivian Perkovic
