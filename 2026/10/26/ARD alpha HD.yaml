  title: Wenn es Herbst wird auf der Alm
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Alles hat einmal ein Ende, auch die Tage oben auf der Alm. Wenn der Herbst durch die steirischen Berge zieht, wird jede Stunde umso wertvoller, die die Menschen mit ihren Nutztieren oben in der Seehöhe verbringen können. Denn der Tag naht, an dem die Alm eingewintert und die Herden zurück ins Tal getrieben werden müssen. Heuer war für viele Bauern die Zeit auf der Alm besonders kurz, das schlechte Wetter im Mai hat manche sogar ganz davon abgehalten, die Tiere aufzutreiben. Wolfgang Scherz zeigt auf mehreren steirischen Almen, wie dort die Saison zu Ende geht und wie die Einheimischen mit der Rückkehr der dunklen Jahreszeit umgehen.
