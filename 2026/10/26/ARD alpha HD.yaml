  description: 'Vor über einem Jahr haben wir Melanie und Andree auf ihrer langen Kinderwunschreise begleitet. Nach vier Jahren Hoffnung, Rückschlägen und hohen Kosten kam schließlich die erlösende Nachricht: Melanie ist schwanger. Jetzt treffen wir die beiden wieder und lernen ihr Baby kennen. Wie hat sich ihr Leben als Familie verändert? Sind die Sorgen und der Schmerz der Kinderwunschzeit wirklich verschwunden? Melanie spricht offen über Schwangerschaft, Geburt, Social Media als Mama und die Frage, ob sie sich sogar ein zweites Kind wünschen.'
