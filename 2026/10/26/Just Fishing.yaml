- eventId: 1020114
  start: 2026-10-26T03:05:00Z
  stop: 2026-10-26T03:39:00Z
  title: Sleepless Nights - Karpfenangeln am Baggersee
  subtitle: Sleepless Nights - Karpfenangeln am Baggersee
  description: Schlaflose Nächte und Bisse am laufenden Band. 15 Fische in 30 Stunden. Robin Illner befischt einen neuen See und macht direkt alles richtig. Doppelruns, starke Karpfen und volle Kescher sind das Resultat. Begleite Robin an einen Baggersee und erfahre, was Du machen musst, um auch 15 Karpfen in 30 Stunden zu fangen. Nach dieser Session brauchst Du Urlaub! NL 2024
- eventId: 1020115
  start: 2026-10-26T03:45:00Z
  stop: 2026-10-26T03:55:00Z
  title: Dorsche und Co. mit Gummiködern
  subtitle: Dorsche und Co. mit Gummiködern
  description: Gerade Dorsche halten sich sehr gerne am Gewässergrund auf und lassen sich somit hervorragend mit Jigs und Gummiködern beangeln. Diese werden bis zum Boden durchsacken gelassen und anschließend ähnlich wie beim Zanderangeln gejiggt. Aber nicht nur unser eigentlicher Zielfisch interessiert sich dafür, nein, auch eine Vielzahl an teils kuriosen Beifängen kommt an Bord. NO 2023
- eventId: 1020116
  start: 2026-10-26T03:55:00Z
  stop: 2026-10-26T04:08:00Z
  title: Topwaterangeln auf Blackbass in Italien
  subtitle: Topwaterangeln auf Blackbass in Italien
  description: Es gibt wohl kaum einen Zielfisch der so begehrt ist wie der Schwarzbarsch. Inzwischen gibt es in nahezu ganz Italien sehr gute Bestände dieser kampfstarken Fische. Einige Gewässer - wie beispielsweise der Lago die Bolsena - sind dafür bekannt, viele und große Basse zu beherbergen. Dieser klare, große Vulkankratersee ist somit eine Topadresse für Angler aus ganz Europa. Er hat riesige Krautfelder in denen sie sich sehr gerne aufhalten und auf Raubzug gehen. Kommt nun noch ein Oberflächenköder ins Spiel, wird es spannend. Hemmungslose Attacken und eine Fischerei der Extraklasse sind vorprogrammiert. IT 2023
- eventId: 1020117
  start: 2026-10-26T04:10:00Z
  stop: 2026-10-26T04:20:00Z
  title: Mission 50er Bass auf Topwater
  subtitle: Mission 50er Bass auf Topwater
  description: Ein Angeltag, der es in sich hat. Ganz in den frühen Morgenstunden geht es erst einmal mit dem Belly Boat auf die Jagd nach dem 50er Schwarzbarsch. Bereits im ersten Licht des Tages sind die Fische sehr aktiv und rauben an der Wasseroberfläche. Schnell ist der erste gelandet, jedoch fehlen noch ein paar Zentimeter, um die Mission zu erfüllen. Nach der Morgensession geht es dann mit dem lokalen Guide Marco auf sein Bassboat. Ein zäher Nachmittag mit relativ wenig Action ist nicht der beste Start. Wir fischen bis spät in die Abendstunden. Ob sich unsere Hartnäckigkeit doch noch auszahlt, seht ihr in diesem Film. IT 2023
- eventId: 1020118
  start: 2026-10-26T04:20:00Z
  stop: 2026-10-26T04:34:00Z
  title: Hechtangeln mit Köderfisch am Fireball
  subtitle: Hechtangeln mit Köderfisch am Fireball
  description: Hechtangeln heißt für die meisten Angler inzwischen Gummifische und andere Kunstköder wie Jerkbaits, Spinnerbaits, Wobbler, Streamer & Co zu werfen. Dabei ist ein Köderfisch in vielen Situationen ein echtes Ass im Ärmel. Dieser lässt sich klassisch beim Hechtangeln mit Pose oder an einer Grundmontage anbieten. Wer es aber aktiver mag, der kann den Köderfisch am Fireball servieren. Hechtangeln mit Köderfisch ist über die ganze Saison eine vielversprechende Methode. Egal ob im Sommer oder Winter - einem echten Fisch kann ein Hecht selten wiederstehen. Beim Angeln mit Fireball wird der Köderfisch an einem Jigkopf mit kurzem Haken sowie einem Stinger mit Drilling angeboten. Das System wird vertikal unterm Boot gefischt - und bietet sich auch super als tote Rute an. An diesem Tag waren Daniel Wnendt und Rute&Rolle-Redakteur Timo Keibel in Holland zum Hechtangeln im Sommer vom Boot. Dabei sollten Rotaugen in Größen um 15 Zentimeter Länge, die Hecht an die Köder locken - ob es geklappt hat? NL 2023
- eventId: 1020119
  start: 2026-10-26T04:35:00Z
  stop: 2026-10-26T04:40:00Z
  title: Abgehakt! - Pop Up im Fluss?
  subtitle: Abgehakt! - Pop Up im Fluss?
  description: 'Abgehakt!: In meiner neuen Serie kläre ich in verschiedenen Staffeln Fragen und Fakten zum Thema Karpfenangeln. Unzählige Mythen und Anglerlatein sind im Umlauf und in den sozialen Netzwerken zu finden. In kurzen und spannenden Clips bringe ich die wichtigsten Fakten auf den Punkt. Abgehakt ist ein kritisches Format, in dem ich zum Nachdenken und Hinterfragen anregen möchten. Nehmt nicht immer alles so hin, wie es serviert wird. Fragt nach und versteht, warum Dinge sind, wie sie sind. Diskutiert mit und erzählt mir von euren Erfahrungen. Lasst uns zusammen mit Mythen aufräumen, Themen besprechen und ein für alle Mal abhaken!  DE 2022'
