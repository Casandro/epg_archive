  description: 'Abgehakt!: In meiner neuen Serie kläre ich in verschiedenen Staffeln Fragen und Fakten zum Thema Karpfenangeln. Unzählige Mythen und Anglerlatein sind im Umlauf und in den sozialen Netzwerken zu finden. In kurzen und spannenden Clips bringe ich die wichtigsten Fakten auf den Punkt. Abgehakt ist ein kritisches Format, in dem ich zum Nachdenken und Hinterfragen anregen möchten. Nehmt nicht immer alles so hin, wie es serviert wird. Fragt nach und versteht, warum Dinge sind, wie sie sind. Diskutiert mit und erzählt mir von euren Erfahrungen. Lasst uns zusammen mit Mythen aufräumen, Themen besprechen und ein für alle Mal abhaken!  DE 2022'
- eventId: 1020121
  start: 2026-10-26T04:45:00Z
  stop: 2026-10-26T04:55:00Z
  title: Flexibel zum Fisch
  subtitle: Flexibel zum Fisch
  description: 'Der Plan von Daniel Wnendt und Timo Keibel war eigentlich einen Film über das Barschangeln mit Finesse Methoden wie das Carolina Rig, Texas Rig, Free Rig zu drehen. Doch das Wetter war anders als die Vorhersage: Anstatt Flaute gab es Sturm in den Niederlanden. Daher waren die beiden Angler flexibel, schnappten sich die schwersten Barschruten an Bord, klinkten Jig Spinner in den Karabiner und retteten den Angeltag. Die Raubfische spielten mit und schnappten sich die Kunstköder beim Raubfischangeln. Jigspinner sorgte an diesem Tag für eine große Überraschung am Ende des Angeltages. Flexibel zum Fisch zahlte sich für die beiden Angler aus.  NL 2023'
- eventId: 1020122
