  title: Militärmusikfestival 2026 für Licht ins Dunkel
  description: |-
    Unter dem Motto "Partnerschaft mit Herz: Bundesheer und LICHT INS DUNKEL" lud  das Österreichische Bundesheer im Mai 2026 zu einem abwechslungsreichen Programm in die Stadthalle Graz ein. Sieben österreichische Militärmusiken sowie die Trachtenmusikkapelle Ottendorf an der Rittschein präsentierten traditionelle Blasmusik mit modernen Showelementen und choreografischen Darbietungen. Als Special Guests stellten sich Austropop-Legende Christian Kolonovits sowie Rockmusiker und Musikproduzent Ewald Pfleger zusammen mit Opus Band und den Schick Sisters in den Dienst dieser Benefizveranstaltung. Weitere Gäste waren Sopranistin Julia Wisniewski, Harmonikaspieler Jonas Lazarus und Panflötenvirtuose Wolfgang Niegelhell.
    Durch den Abend führten Kathrin Ficzko und Norbert Oberhauser.
  genre:
