  title: Im Wandel der Zeit - 3 Familien - 3 Generationen
  description: |-
    Drei Salzburger Familien, drei Generationen und drei unterschiedliche Lebenswelten: Eisenbahn, Eismacherei und ein international erfolgreiches Familienunternehmen. Auch die vierte Folge dieser Dokumentationsreihe des ORF Salzburg porträtiert Vielfalt, Lebensqualität und Familien, die das Land seit Generationen prägen.
    Die Familien erzählen von Zusammenhalt, Tradition, Pioniergeist und dem Mut zu neuen Wegen in Zeiten der gesellschaftlichen Veränderung, des technischen Fortschritts und der neuen Lebensentwürfe jeder Generation. Ihre Geschichten öffnen eine generationenübergreifende Zeitreise durch Arbeits- und Lebenswelten im Wandel.
