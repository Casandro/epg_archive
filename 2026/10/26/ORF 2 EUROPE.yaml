  start: 2026-10-26T08:10:00Z
  stop: 2026-10-26T09:43:56Z
  title: Militärmusikfestival 2026 für Licht ins Dunkel
  description: |-
    Unter dem Motto "Partnerschaft mit Herz: Bundesheer und LICHT INS DUNKEL" lud  das Österreichische Bundesheer im Mai 2026 zu einem abwechslungsreichen Programm in die Stadthalle Graz ein. Sieben österreichische Militärmusiken sowie die Trachtenmusikkapelle Ottendorf an der Rittschein präsentierten traditionelle Blasmusik mit modernen Showelementen und choreografischen Darbietungen. Als Special Guests stellten sich Austropop-Legende Christian Kolonovits sowie Rockmusiker und Musikproduzent Ewald Pfleger zusammen mit Opus Band und den Schick Sisters in den Dienst dieser Benefizveranstaltung. Weitere Gäste waren Sopranistin Julia Wisniewski, Harmonikaspieler Jonas Lazarus und Panflötenvirtuose Wolfgang Niegelhell.
    Durch den Abend führten Kathrin Ficzko und Norbert Oberhauser.
  genre:
  - '175'
- eventId: 920445
  start: 2026-10-26T09:45:00Z
  stop: 2026-10-26T11:15:00Z
  title: ZIB Spezial
  subtitle: Angelobung am Heldenplatz
  description: |-
    Es ist der jährliche Höhepunkt der Leistungsschau des Bundesheeres am Heldenplatz - die Angelobung der Rekruten und Rekrutinnen. Den Treueeid auf die Republik Österreich legen die Rekrut:innen nach etwa vier Wochen Grundausbildung ab. Das am Nationalfeiertag vor dem Oberbefehlshaber und der Staatsspitze zu tun, ist zusätzlich besonders. Aber was bedeutet es heute, "das Vaterland, die Republik Österreich und sein Volk zu schützen und mit der Waffe zu verteidigen", angesichts der volatilen Weltlage und einem seit fast fünf Jahren tobenden Krieg in der Ukraine, etwas mehr als 1000 Kilometer Luftlinie von Österreich entfernt?
    Dem geht eine ZIB Spezial nach mit Schaltungen auf den Heldenplatz, der Live-Übertragung der Angelobung und Analysen im Studio.

    Moderation: Rebekka Salzer
