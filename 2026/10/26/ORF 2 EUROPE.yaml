  title: Österreich-Bild am Feiertag
  subtitle: '"Es muass sein!" 400 Jahre Niederschlagung des Bauernaufstands in OÖ'
  description: |-
    Der oberösterreichische Bauernkrieg von 1626 ist bis heute von Legenden und Mythen umgeben. Das "Gefecht von Lembach", der "Sturm auf Peuerbach", die "Belagerung von Linz" und natürlich das "Frankenburger Würfelspiel": alle diese Ereignisse haben sich tief in das historische Gedächtnis Oberösterreichs eingegraben.
    Im Gedenkjahr 2026 erinnert man allenthalben im Land ob der Enns an die historischen Ereignisse: Die "Communale Oberösterreich" hat rund 130 Projekte an mehr als 27 Schauplätzen auf die Beine gestellt. Das "Schlossmuseum Linz" zeigt noch bis 7. Jänner 2027 eine Großausstellung zum Thema Bauernkrieg, und in St. Agatha, der Heimatgemeinde des Rebellenführers Stefan Fadinger, fanden im Sommer - nach zwölfjähriger Pause - wieder spektakuläre "Bauernkriegsspiele" statt.
