  title: Führen,schützen, helfen! - Ausbildung zum Offizier
  description: 'Führen lernen, Verantwortung übernehmen. Offizier zu sein bedeutet, stets zum Einsatz für die österreichische Bevölkerung da zu sein. Die Dokumentation aus dem ORF Landesstudio Niederösterreich (Regie: Andi Leitner, Kamera: Andreas Kotzmann) begleitet angehende Offiziere bei ihrer Ausbildung und zeigt, wie vielfältig der Beruf Offizier sein kann.'
