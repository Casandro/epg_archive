  title: 9 Plätze - 9 Schätze
  description: "Rot-weiß-rote Tradition rund um den Nationalfeiertag: Bereits zum dreizehnten Mal sucht \"9 Plätze - 9 Schätze\" den schönsten Ort des Landes! Für imposante Bilder und Spannung ist wieder gesorgt, wenn Armin Assinger und Barbara Karlich gemeinsam mit den Moderatorinnen und Moderatoren der neun ORF-Landesstudios, neun Prominenten aus den Bundesländern und dem Publikum zu Hause Österreichs schönsten verborgenen Platz küren. \nDiesmal setzt sich die prominente Jury aus Jutta Fastian, Cornelia Hütterer, Anna Buchegger, Sabine Haag, Toni Polster, Gery Seidl, Max Stiegl, Alois Mühlbacher und Benjamin Raich zusammen. Als musikalisches Highlight wird der mehrfach mit dem österreichischen Musikpreis Amadeus Austrian Music Award ausgezeichnete Singer-Songwriter \"Josh\" zwei seiner aktuellen Songs performen."
  genre:
  - '48'
