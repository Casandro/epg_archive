  title: Der Bockerer II - Österreich ist frei
  description: |-
    (Spielfilm, AUT 1996)
    Im besetzten Wien der Nachkriegsjahre ist es abermals Karl Bockerer, der auf charmant-trotzige Weise den herrschenden Mächten Paroli bietet. Diesmal richtet sich seine Verbissenheit gegen die russischen Besatzer, deren unmenschliche Härte das Glück zweier sich Liebender gefährdet.
    Mit Karl Merkatz (Karl Bockerer), Caroline Vasicek (Elena), Sascha Wussow (Gustl), Ida Krottendorf (Binerl Bockerer), Heinz Petters (Bruder von Hatzinger), Michael Schottenberg (Gstettner), Heinz Marecek (Dr. Rosenblatt), Marianne Nentwich (Anna), Heinrich Schweiger (Major Novotny), Dolores Schmidinger (Mitzi) u.a.
    Regie: Franz Antel
    Hergestellt in Zusammenarbeit mit dem ORF Film/Fernseh-Abkommen
