- eventId: 684013
  start: 2026-10-26T10:05:00Z
  stop: 2026-10-26T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Když je to o prsa. Primářka Oddělení onkologie Nemocnice v Jablonci nad Nisou Marta Kučerová. Koordinátorka projektu Bellis - mladé ženy s rakovinou prsu Eva Průšová. Říjen, měsíc boje proti rakovině prsu připomíná význam prevence a včasného záchytu. Jaké jsou první varovné signály tohoto onemocnění, jaké jsou nejčastější příčiny, v čem pokročila současná léčba a nakolik může být toto onemocnění dědičné.'
