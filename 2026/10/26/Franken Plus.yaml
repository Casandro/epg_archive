  title: 'Kultur daham: Ausstellungen in Mittelfranken (Wh.)'
  subtitle: 'Zwischen Tierwelten und Modellautos - in Mittelfranken locken aktuell zahlreiche spannende Ausstellungen. Vier davon stellen wir in unserer neuen Folge Kultur Daham vor. '
  description: 'Von Pikachu bis Evoli: Die Pokémons haben das Zukunftsmuseum in Nürnberg erobert. Doch auch im Tiergarten gibt es etwas Neues zu entdecken. Im Bionicum machen Tunnel Unterwasserwelten und verborgene Tier erlebbar. In Zirndorf lässt das Museum einen wahren Klassiker aufleben: Modelle und Exponate zeigen den kultigen VW-Käfer und seine Geschichte. Und zu guter Letzt: Das DB-Museum Nürnberg widmet eine Ausstellung den Tunneln.'
