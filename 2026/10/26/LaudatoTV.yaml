  description: Gošća je književnica i učiteljica Ivana Ćurić iz Tomislavgrada. Po struci je profesorica razredne nastave, a radi kao učiteljica u Osnovnoj školi fra Mije Čuića u Bukovici. Svoje priče i pjesme objavljuje u časopisima za djecu, među kojima su Mak, Cvitak i Smib, a za svoj je književni rad primila i nekoliko nagrada. Autorica je brojnih djela, među kojima su humoristične knjige ,,Iz dnevnika jedne mlade, romani za djecu ,,Folirant u razredu, ,,Sedmero znatiželjnih i ,,Čudo, zbirka priča ,,Moj tata superheroj, kao i roman ,,Ćaćino dite. S Marijanom Ćurićem potpisuje i zbirku božićnih priča ,,San o vječnom Božiću.
