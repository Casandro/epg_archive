  title: Najveći dar, Najveći dar
  subtitle: Religijski
  description: 'U emisiji "Najveći dar", govorimo o najvećem daru kojeg kao vjernici imamo, a to je sveta Misa. Kroz epizode koje ćemo prikazati, objasnit ćemo svaki pojedini dio Mise: reći što se točno događa tijekom liturgijskog slavlja, objasniti molitve, geste i sve ono što se događa od početka misnog slavlja do završnih obreda. U prvoj epizodi emisije "Najveći dar" stručni suradnik u studiju, liturgičar vlč. Tomislav Hačko gledatelje upoznaje o važnosti i značenju Mise. Zašto je Misa, sveta? Što se zapravo sve događa, tijekom cijele Mise? Kako ispravno sudjelovati u svetoj Misi? Ovo su samo neka od pitanja na koja ćemo odgovoriti.'
