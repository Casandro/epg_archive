  description: Luka, Ela i Gizmo vraćaju se kući jedne večeri kada dva gruba tinejdžera otimaju Lukinu gitaru i uskaču u vlak. Luka se da u potjeru za njima i zahtjeva da mu vrate instrument, no umjesto toga, grubijani razbiju gitaru. Sav bijesan, Luka se zaklinje da će se osvetiti, no taman prije nego će to učiniti, Superknjiga odvodi naš trio u prošlost kako bi upoznali odraslog Davida. (Upoznali su ga u mlađoj verziji kada je pobijedio diva Golijata.) David je postao veliki ratnik, no također je stekao nepredvidivog neprijatelja u kralju Šaulu. Šaul, koji je svjestan da će ga David jednog dana zamijeniti u ulozi vladara, mijenja svoje ponašanje i emocije od ljubavi i privrženosti do ljubomornog bijesa, te pokušava ubiti Davida u nekoliko navrata. Luka očekuje da će David tražiti osvetu; umjesto toga, David pošteđuje Šaulov život u špiljama En Gedija. Kada Šaul vidi dokaz Davidove blagosti (komad njegova plašta u Davidovoj ruci), Šaul moli za milost za sebe i svoje potomke, što mu David i obećava. Luka, Ela i Gizmo se vraćaju kući. S Davidovim primjerom na pameti, Luka odustaje od osvete, svjestan da koja god kazna očekuje delikvente, to nije njegova odgovornost, već Božja.
