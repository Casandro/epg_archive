  title: Passato e Presente- Trieste all'Italia
  subtitle: Alla fine della Seconda Guerra mondiale, l'Italia sconfitta è condannata a fermarsi alle porte di Trieste. La città stretta tra il mare e il Carso diventa oggetto di una lunga e contrastata questione confina
  description: ria con la Jugoslavia. Sullo sfondo della Guerra Fredda, il possesso di Trieste assume un significato al contempo politico, strategico e simbolico. E' l'emblema dei movimenti nazionali e degli irredentismi sloveno e italiano; rappresenta la porta sul Mediterraneo a disposizione del blocco socialista che progressivamente si profila nell'Europa centro-orientale; e infine, per gli Stati Uniti e il Regno Unito, costituisce l'antemurale dell'Occidente, essenziale ad assicurare la penisola alla loro sfera d'influenza. La vertenza diplomatica, punteggiata da crisi e da momenti di tensione, si conclude il 5 ottobre del 1954, e l'ingresso dei bersaglieri a piazza Unità, il 26 ottobre successivo, segna finalmente l'agognata restituzione di Trieste all'Italia. Una pagina raccontata da Carla Oppo sui luoghi della storia e, in studio con Paolo Mieli, dal professor Raoul Pupo. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno  Ospite in studio il prof. Raoul Pupo Con la partecipazione di Carla Oppo Regia Davide Frasnelli Produttore Esecutivo Valentina Tassini
