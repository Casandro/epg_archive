  title: SWR3 New Pop Festival 2026 - Best of Open Air Bühne
  subtitle: Sekou, Connor Skinner, Lusaint und The Bausa
  description: Sänger Sekou lebt in London und klingt mit Anfang 20 schon jetzt wie eine alte Soul-Seele. Tiefgründige Texte sind seine Spezialität. Musiker und Sänger Connor Skinner aus der Nähe von Manchester begeistert mit E-Gitarre, kraftvoller Stimme und energiegeladenen Auftritten. Ruhiger, souliger Gesang zeichnet die Britin Lusaint aus. Sie ist schon vor dem Papst aufgetreten, hat ihre größte Fanbase in Italien und Frankreich. "The Bausa" sind drei Musiker aus Norwegen. Mit Partysongs haben sie ihre Karriere gestartet.
- eventId: 717543
  start: 2026-10-26T01:50:00Z
  stop: 2026-10-26T02:35:00Z
  title: SWR3 New Pop Festival 2026 - YouNotUs x Topic
  description: Tobias von YouNotUs und Tobias aka Topic legten bei der "Cupra- DJ Night" auf. Damit kamen zwei erstklassige DJs und Musikproduzenten zum SWR3 New Pop Festival. Beide Acts dominieren seit Jahren die deutsche EDM-Szene mit Hits wie "Breaking Me" von Topic, der bisher mehr als 1,2 Milliarden Streams gesammelt hat, oder auch der absolute Ohrwurm-Remix "Narcotic" von YouNotUs.
