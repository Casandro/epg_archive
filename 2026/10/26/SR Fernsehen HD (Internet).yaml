  title: Eisenbahn-Romantik (816)
  subtitle: Die Mariazellerbahn - Auf der Himmelstreppe zur Wallfahrt
  description: Der Wallfahrtsort Mariazell war im 19. Jahrhundert einer der am stärksten besuchten Fremdenverkehrsorte in der k. & k. Monarchie und auch mitverantwortlich für den Bau der gleichnamigen Bahn. Seit Kurzem geht es nun mit der "Himmelstreppe" zum Wallfahrtsort. - Hundert Jahre alte E-Loks die bis vor kurzem im Plandienst waren, fahren nun im Museumsbetrieb und die modernen Züge sichern die Zukunft der einzigartigen Gebirgsbahn in Österreich. Eisenbahn-Romantik zeigt eine Bahn im Umbruch, alt und neu in einer wildromantischen Alpenlandschaft.
