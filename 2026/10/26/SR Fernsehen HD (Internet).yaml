  description: '"ARD-Buffet"-Moderator Florian Weber liebt Fleisch. Er zeigt in dieser Folge geschmorte Rinderschulter mit Perlzwiebeln und Polenta sowie Wiener Schnitzel mit selbstgemachten Pommes. Außerdem wird in dieser Sendung Schweinefilet mit Spitzkohllasagne und Altbiersauce zubereitet. Es wird auch Mailänder Schnitzel mit Rahmspinat und gebackenen Kartoffeln serviert. Dazu gibt es schnelles Küchenwissen für die Zuschauer. Welche Teile vom Rind sind für welches Gericht zu verwenden? Und wie geht eigentlich das perfekte Steak?'
