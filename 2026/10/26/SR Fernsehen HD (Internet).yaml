- eventId: 724173
  start: 2026-10-26T04:40:00Z
  stop: 2026-10-26T04:45:00Z
  title: When I worry about things
  subtitle: Luke's and Jenny's story
  description: Panikattacken bestimmen Lukes und Jennys Alltag. Die Angst ist ihr ständiger Begleiter und isoliert sie. Auch wenn ihre Geschichten unterschiedlich sind, so teilen die beiden Kinder doch viele Erfahrungen. Sie ertragen es nicht, allein zu sein, sehen überall Gefahren und befürchten mögliche Katastrophen. Die Panikattacken machen sie hilflos, lassen Herz und Puls rasen, verflachen die Atmung und verkrampfen die Muskeln. Luke und Jenny wollen sich von der Angst nicht mehr dominieren lassen und suchen sich therapeutische Hilfe.
