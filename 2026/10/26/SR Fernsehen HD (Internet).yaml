  title: Eine Liebe in der Stadt des Löwen
  subtitle: Fernsehfilm Deutschland/Singapur 2009
  description: Die junge Lehrerin Anniela will gemeinsam mit ihrem zukünftigen Ehemann Robert nach Singapur auswandern, dort soll Robert die Firma ihres verstorbenen Vaters weiterführen. Dann aber erwischt Anniela ihren Verlobten in den Armen seiner Exfreundin - für die junge Frau bricht eine Welt zusammen. Sie flüchtet vor Robert und fliegt mit ihrer Mutter Dorothea nach Singapur. Bald lernt sie den sympathischen Chinesen Dai Si Wong kennen. Während Dorothea versucht, ihre Tochter wieder mit Robert zusammenzubringen, entwickelt sich zwischen Anniela und Dai Si eine zarte Liebe. Anniela ahnt nicht, dass ihr neuer Freund etwas vor ihr verbirgt.
