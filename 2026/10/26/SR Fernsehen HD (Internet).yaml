  stop: 2026-10-26T04:35:00Z
  title: When I worry about things
  subtitle: Annabel's story
  description: Annabels Mitschüler:innen sind genervt. Ständig klopft sie auf den Tisch, berührt Wände oder macht Geräusche mit der Nase. Keine:r versteht, warum sie das macht, am wenigsten Annabel selbst. "Ich muss es tun, ich muss es einfach tun, immer wieder". Annabel fühlt sich hilflos und einsam, es geht ihr immer schlechter. Erst als sie ins Krankenhaus kommt und eine Therapeutin ihr erklärt, dass sie an einer Zwangsstörung leidet, die man behandeln kann, fasst sie neuen Mut.
