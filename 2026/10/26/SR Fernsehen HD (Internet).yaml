  title: Wir im Saarland - Saar nur!
  subtitle: 'Moderation: Michael Friemel'
  description: "Themen u.a.:\n* Für Sagen-Fans: Ob Maldix, Irrlichter oder Aufhocker. Im Saarland geht's gruseliger zu, als man meinen mag. \n* Für 70er-Fans: Michael Johns Herz schlägt für die 70er. Sein Elternhaus in Wiesbach hat er mehr und mehr in ein Museum verwandelt. Bei der Deko dominiert rot-braun-orange.\n* Für Herbst-Fans: Handy weglegen, auf in den Wald. Denn hier findet sich das Bastelmaterial für die herbstliche Kreativ-Stunde im Bauernhaus Habach.\n* Für Club-Fans: Solo(at)Silo heißt eine Aktion, mit dem der Silodom-Club regionale Künstler fördern möchte."
