  title: Stonados
  subtitle: Science fiction / Fantasy / Horror 2013, FSK 12
  description: '2013 ● FSK: 12 Als sich ein Tornado in Plymouth Rock mit Steinen vollsaugt und Kurs auf Boston nimmt, bricht in der Stadt Chaos aus. Es regnet riesige Brocken Gestein vom Himmel, die die ganze Stadt in Schutt und Asche zu legen drohen. Mitten im Unwetter findet sich der ehemalige und nach dem Tod seiner Frau traumatisierte Highschool-Physik-Lehrer Joe wieder, der sich mit dem Freizeitsturmjäger Lee und seiner Schwester Maddy zusammen getan hat, um seine Kinder Megan und Jackson zu retten. Science fiction / Fantasy / Horror 2013, Regie: Jason Bourque,  Mit: Paul Johansson, William B. Davis, Thea Gill, FSK 12'
