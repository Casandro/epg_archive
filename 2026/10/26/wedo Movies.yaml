  title: Der Mittsommerkranz
  subtitle: Comedy 2015
  description: '2015 ● FSK: 0 Prinzessin Verunka soll mit ihrer Heirat ihr Königreich retten, das durch die verrückten Erfindungen des Königs verarmt ist. Die Bewerber stehen Schlange, um ihre Hand anzuhalten - mit ihnen versucht der junge Ondra zu konkurrieren. Doch schnell wird der Wettbewerb um Verunkas Hand zu einem Kampf, um die Leben der Einwohner des Königreichs zu retten. Wie gut, dass es die Magie der Liebe - und die neueste Erfindung des verrückten Königs - gibt. Comedy 2015, Regie: Jiri Strach,  Mit: Jirí Mádl, Eliska Jansová, Ivan Trojan'
