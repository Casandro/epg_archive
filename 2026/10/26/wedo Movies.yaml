  title: Dance-Off
  subtitle: Musical / Opera 2014
  description: '2014 Die alljährliche Tanzmeisterschaft steht vor der Tür. Zwei rivalisierende Tanzgruppen aus einer Stadt stehen sich im Finale gegenüber. Schnell stellt sich heraus, dass die beiden Stars der Gruppen nicht nur auf der Tanzfläche Rivalen sind sie haben sich auch im Privatleben ineinander verliebt. Im großen Finale müssen die beiden versuchen, ihre Gefühle von ihrer Leidenschaft für das Tanzen zu trennen, ohne das ihre Liebe zu Schaden kommt. Musical / Opera 2014, Regie: Alex DiMarco,  Mit: Shane Harper, Kathryn McCormick, David Burtka'
