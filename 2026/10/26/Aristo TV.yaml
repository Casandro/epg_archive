  title: ERF Mensch Gott - Gott gibt _s echt! - Wenn Vertrauen zerbricht
  description: 'Meine Mama hat mich im Stich gelassen - dieser Schmerz brennt sich als Kind in ihr Herz ein. In einer für Melanie furchtbaren Notlage stellt sich die Mutter zu ihrem Partner und nicht zu ihr. Melanie lernt: Ich kann mich auf niemanden verlassen. Gleichzeitig sehnt sie sich nach Liebe. Als eine langjährige Freundschaft zu Ende geht, stürzt sie das in eine tiefe Krise. Sie will Vertrauen ins Leben zurückgewinnen, doch hat keine Idee, wie das gehen kann. Bis sie in einem Buch einen Hinweis findet.'
  widescreen: true
- eventId: 656674
  start: 2026-10-26T03:59:24Z
  stop: 2026-10-26T04:29:44Z
  title: Antworten mit Bayless Conley - Menschliche Maßstäbe und großer Glaube
  description: Wünschen Sie sich einen beharrlichen Glauben, der auch dann dranbleibt, wenn eine Situation aussichtslos erscheint? Auf seine seelsorgerliche Art zeigt Bayless Conley anhand von Markus 7, wie leicht menschliche Maßstäbe den Blick auf Gottes Wahrheit verstellen und den Glauben schwächen können. Gleichzeitig begegnen wir einer Frau, deren fester Glaube alle Hindernisse überwindet. Lassen Sie sich durch sie neu dafür begeistern, was einen großen Glauben ausmacht und wie er in Ihrem Leben wachsen kann.
  widescreen: true
- eventId: 656675
  start: 2026-10-26T04:29:44Z
  stop: 2026-10-26T05:00:00Z
  title: OnlineKirche mit Pastor Gert Hoinle - Diese drei Bibelstellen sollte jeder Mensch kennen
  description: Die Bibel ist ein Navi, eine Lebenslandkarte von Gott. Dort sind gute Gegenden eingezeichnet, in denen du aufblühst, aber auch Wüsten und Löcher, Minenfelder und Höhlen von Drachen, so dass du sie vermeiden kannst. Folgst du dieser Karte, gewinnst du an Lebensqualität, auch wenn dir JETZT nicht jeder Wunsch erfüllt wird. Die drei für alle Menschen wichtigsten Stellen der Bibel schauen wir uns genauer an.
  widescreen: true
- eventId: 656676
  start: 2026-10-26T05:00:00Z
  stop: 2026-10-26T05:29:00Z
  title: 'OnlineKirche mit Pastor Gert Hoinle - Gott verwertet alles. Oder: Wenn die Hütte brennt'
  description: 'Jesus ließ nach der Speisung der 5000 die übriggebliebenen Brocken aufheben, "damit nichts umkomme". Er gedachte, alles zu verwerten, obwohl er gerade Überfluss produziert hatte. Das deutet auf eine grundsätzliche Haltung hin: Gott verwertet alles und verschwendet nichts. Das macht er nicht nur mit Brotbrocken und Fischstückchen so, sondern auch mit Ereignissen in deinem Leben. Selbst wenn einmal die Hütte brennt. Alles, was dir passiert ist und noch passieren wird, wird Gott für seine Zwecke verwenden und zum Segen wenden, wenn du im Glauben bleibst. Das erlebten nicht nur der arme Lazarus und der Räuber am Kreuz, sondern auch Mose. Pastor Gert öffnet die Bibel und steigt tiefer in die Materie ein.'
  widescreen: true
- eventId: 656677
  start: 2026-10-26T05:29:00Z
  stop: 2026-10-26T05:57:56Z
  title: Gunst der Stunde mit Heiko Bräuning - Gefüllt bis an den Rand, (mit Abendmahl)
  description: 'Herzlich Willkommen zur Gunst der Stunde! Dein Moment mit Gott! Wir lieben Alltagshelfer. Geräte, Apps, kleine Tricks, die uns die Arbeit erleichtern, Zeit sparen, Kraft schonen, den Alltag e?izienter machen. Und doch erleben wir es immer wieder: Trotz aller Helfer bleiben wir müde. Überfordert. Manchmal innerlich leer. Wir feiern Gott, der unseren Alltag kennt. Der unsere Grenzen sieht. All die Fronten, wo wir uns müde kämpfen. Der heilige Gott ist sich nicht zu schade, sich um uns anzunehmen. Er liebt es, zu helfen! Wir freuen uns, gemeinsam das heilige Abendmahl zu feiern!'
  widescreen: true
