  title: Reportage - Mythos Hongkong
  description: Die Weltstadt Hongkong  ist eine Stadt der Extreme und Superlativen.  ANIXE beschäftigt sich in dieser Reportage mit dem Themenbereichen Verkehr und Umwelt.  Neuestes Vorzeigeprojekt ist die Hongkong-Macau-Zhuhai Brücke.  Das 56 Kilometer lange und 15 Milliarden EURO teure Bauwerk ist die bislang längste Brücke der Welt.  Startpunkt in Hongkong ist am Internationalen Flughafen.  Dieser ist beim Passagieraufkommen der achtgrößte der Welt. Der Bau eines neuen Terminals sowie einer neuen Startbahn soll auch künftiges Wachstum sicherstellen. Im Bereich Luftfracht ist der Flughafen bereits die Nummer 1 weltweit. Grund genug für unser Team, einen ausführlichen Blick hinter die gigantische Logistik zu werfen. Zweiter Themenbereich ist die Umweltpolitik. Beim Müllrecycling geht Hongkong ganz neue Wege. In intensiver Zusammenarbeit mit dem deutschen Entsorgungsunternehmen ALBA wird ein zukunftsweisendes System aufgebaut, das auch als Vorbild für die benachbarte Volksrepublik China dienen könnte. Neue Wege geht Hongkong auch bei der Stromgewinnung. Im 5-Milliarden Euro teuren T-Park wird beim Verbrennen von Schlämmen Strom gewonnen. Gleichzeitig ist die Anlage  Anschauungszentrum für neue Wege in der Energiegewinnung. Umweltminister Wong Kam-sing erläutert dazu seine Planung für eine umweltschonende Zukunft der ehemaligen britischen Kolonie.
  widescreen: true
