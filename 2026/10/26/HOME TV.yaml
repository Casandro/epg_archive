  title: 'Charlie Luxton: domy nad morzem 1 (odc. 3)'
  subtitle: Domy nad morzem to marzenie każdego. Niektórzy Brytyjczycy je spełnili i właśnie ich odwiedzi Charlie Luxton - brytyjski architekt i projektant. Odwiedza domy Brytyjczyków mieszkających nad morzem.
  description: |-
    Tytuł oryginalny: Charlie Luxton's Homes By the Sea
    GB, 2014
    Reżyseria: Mark McMullen
    Występują: Charlie Luxton, Ajay Tegala
    Domy nad morzem to marzenie każdego. Niektórzy Brytyjczycy je spełnili i własnie ich odwiedzi Charlie Luxton. Charlie Luxton to znany brytyjskki architekt i projektant. W serii "Charlie Luxton: domy nad morzem" odwiedza domy Brytyjczyków mieszkających nad morzem. W każdym odcinku odwiedza cztery posiadłości i stara się odpowiedziec na pytanie, co czyni posiadłość nad morzem idealną.
