  title: Bergwelten - Shangri La...das verborgene Kletterparadies
  subtitle: Bergwelten - Shangri La...das verborgene Kletterparadies
  description: 'Bergwelten: Der Kletterer Bernd Zangerl reist jedes Jahr an einen geheimen Ort in Nordindien: sein Shangri-La. Mit Freunden erforscht er das märchenhafte Kletterparadies im Himalaya und lernt eine einzigartige Kultur und Menschen kennen.  AT 2016'
- eventId: 1020023
  start: 2026-10-26T00:50:00Z
  stop: 2026-10-26T01:37:00Z
  title: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  subtitle: Bergwelten - Tiefer Schnee - Abenteuer in Alaska
  description: 'Bergwelten: Alaska: - seit 1867 der 49. US-Bundesstaat - war schon immer ein Land für Abenteurer. Waren es früher Trapper, Pelztierjäger und Goldschürfer, sind es heute Bergsteiger und Extremskifahrer, die hier ihr Glück suchen.Sie sind auf der Suche nach steilen Flanken, unberührten Bergen und dem einzigartigen Pulverschnee, den es nur hier gibt. AT 2016'
- eventId: 1020024
  start: 2026-10-26T01:40:00Z
  stop: 2026-10-26T02:27:00Z
  title: Faszination Heimat - Gewalt der Luft
  subtitle: Faszination Heimat - Gewalt der Luft
  description: 'Präsentiert wird die Doku-Reihe vom Tiroler Meteorologen und Geophysiker Norbert Span. Dank seiner sehr persönlichen und mitreißenden Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Luft. Unsichtbar, lebensspendend und auch zerstörerisch... AT 2013'
- eventId: 1020025
  start: 2026-10-26T02:30:00Z
  stop: 2026-10-26T03:17:00Z
  title: Heimatleuchten - Wenn alle zum Bach runtergehen
  subtitle: Heimatleuchten - Wenn alle zum Bach runtergehen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 1020032
  start: 2026-10-26T03:20:00Z
  stop: 2026-10-26T04:23:00Z
  title: Down Days
  subtitle: Down Days
  description: Down Days ist ein Dokumentarfilm, der den Lebensstil, die Gedanken und Gefühle des Big-Mountain-Extremskifahrers verfolgt. Die Reise führt uns zu einem einmonatigen Filmdreh in Haines, Alaska. Erfahren Sie, was es braucht, um ein professioneller Skifahrer zu sein, der steigende Risiken bekämpft, um Sponsoren zufrieden zu stellen und den Sport voranzubringen, während er gleichzeitig die berüchtigten Wetterbedingungen Alaskas bewältigt. Erleben Sie diese emotionale Achterbahnfahrt aus der einzigartigen Perspektive der Menschen, die daran beteiligt waren, von den Helikopter-Guides über das Filmteam bis hin zu Spitzensportlern wie Daron Rhalves, Cody Townsend, Enak Gavaggio, Jamie Pierre, Reggie Crist und Lynsey Dyer , Richard Permin, Elyse Saugstad, Corey Felton und Tom Wayes. CA 2008
