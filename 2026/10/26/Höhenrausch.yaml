  title: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  description: 'Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn: Das 19. Jahrhundert war eine Zeit bedeutender Veränderungen. Die Industrialisierung, die Arbeiterbewegung und bahnbrechende neue Erfindungen. In diese Zeit fällt der Bau der revolutionierenden Semmeringbahn. Geplant und ausgeführt von Carl Ghega, einem großen Visionär, dessen Bahnprojekt der Gegend am Semmering Wohlstand brachte und in ganz Europa bekannt machte. So wurde der Semmering Anziehungsort der Reichen und Schönen, der Dichter und Denker. AT 2015'
- eventId: 1020058
  start: 2026-10-26T08:30:00Z
  stop: 2026-10-26T09:17:00Z
  title: Entstehung der Alpen - Race Around Austria
  subtitle: Entstehung der Alpen - Race Around Austria
  description: 'Entstehung der Alpen - Race Around Austria: Der 32jährige Grazer Fahrradbote Lukas Kienreich nimmt zum ersten Mal den Solo-Bewerb des "Race Around Austria" in Angriff. Dabei muss er eine Strecke von insgesamt 2.200 Kilometern zurücklegen und unglaubliche 30.000 Höhenmeter überwinden - entlang der grenznahen Straßen, einmal rund um Österreich, nonstop. 4 Tage Schlaflosigkeit, 4 Tage Schmerz, 4 Tage Siegeswille: Die TV-Doku "Bis an die Grenzen - Das härteste Radrennen Österreichs" ist hautnah dabei, wenn der Langstreckenradfahrer weit über sich hinaus wächst, um sein gestecktes Ziel zu erreichen: durchzukommen. AT 2015'
- eventId: 1020069
  start: 2026-10-26T09:20:00Z
  stop: 2026-10-26T10:05:00Z
  title: Bergwelten - Durch den Berg
  subtitle: Bergwelten - Durch den Berg
  description: 'Eine abenteuerliche Skitour durch die riesigen Karstbögen am Grand Ferrand bei Grenoble bringt drei Tiroler Extremskifahrer auf eine verrückte Idee: Was, wenn man den Aufstieg einer Skitour nicht außen am Berg sondern mitten durch den Berg machte? Nach kurzer Recherche finden Stefan Ager, Andreas Gumpenberger und Martin Sieberer ihr Ziel: und zwar in Slowenien, gleich über der österreichischen Grenze in den Julischen Alpen. Nahe der Stadt Tolmin führen die Höhlen der "Poloska Jama" ganze 500 Höhenmeter durch den Berg "Krn" hinauf zum Gipfel. Selbst für die erfahrenen und ortkundigen Höhlenforscher der Region ist eine Durchsteigung dieser Höhle mit ihren vielen Verzweigungen ein Grenzgang - erst recht für die jungen Abenteurer aus Österreich. Sie müssen sich zuvor mit den Grundlangen des Fortbewegens in engen, oft senkrecht verlaufenden und wasserführenden Schächten vertraut machen. Die Vorbereitung ist intensiv und geht einen ganzen Sommer lang: Training mit erfahrenen Höhlenforschern, mit Sicherungs-Experten und zu guter Letzt noch ein intensives psychologisches Briefing. Erst dann kann das Abenteuer starten. Nach dem Einstieg ins Höhlensystem warten drei lange Tage ohne Tageslicht auf die jungen Tiroler, die sie an ihre psychischen und physischen Grenzen bringen: die Durchgänge und Felsspalten sind enger als erwartet, und durch die senkrechten Röhren dringt mehr Wasser als prognostiziert. Zu den Schwierigkeiten mit der Orientierung in den weit verzweigten Karstwelten stellt sich bald die Frage: wird es am Ende ,draußen'' überhaupt noch Schnee geben, um mit den Skiern abzufahren? - Das Abenteuer, das die drei jungen Männer erleben, übertrifft alle ihre Erwartungen: es ist ein Grenzgang im Herzen Europas. AT 2021'
