  title: Tamburaška rapsodija u Lisinskom, 24.03.2026. (2. dio)
  subtitle: ' '
  description: Orkestar s više od stotinu tamburaša, koji pratimo već godinama, održao je tradicionalni koncert Tamburaška rapsodija u Koncertnoj dvorani Vatroslava Lisinskog. Tamburaši okupljeni iz svih krajeva Slavonije, Baranje i Srijema, ali i drugih dijelova Hrvatske, zasvirali su, zapjevali i publici priredili nezaboravnu glazbenu večer. Orkestar, pod umjetničkim vodstvom Krunoslava Dražića, i ovom su prigodom dirigentski vodili Damir Butković i Marko Sesar. Tambura je više od glazbala - ona nosi osjećaj pripadnosti, prenosi emociju i identitet te budi uspomene.
