  title: 'Mostovi: Svoj k svome (1. dio), dokumentarni film'
  subtitle: ' '
  description: 'U dvije polusatne epizode govorimo o kulturno-povijesnim vezama Hrvata i Čeha. Upoznajemo prvog Čeha u Zagrebu biskupa Duha, s kojim i počinje nazočnost češke manjine u Hrvatskoj, govorimo o hrvatskim glagoljašima koji na poziv cara Karla IV. dolaze u Prag u 14. stoljeću, o mnogim poznatim i manje poznatim osobama i događajima koji su obilježili kulturno nebo obaju naroda. Prva epizoda otkriva prve poznate kulturno-povijesne veze Hrvata i Čeha. Nadbiskup Josip Juraj Strossmayer jedan je od najomiljenijih Hrvata u Češkoj, a njegove zasluge su prepoznali češki rodoljubi. Češki narod mu se odužio nazvavši čak sedam ulica i jedan trg u Pragu njegovim imenom. Zatim upoznajemo prvog poznatog Čeha u Hrvatskoj, biskupa Duha, s kojim počinje i nazočnost češke manjine u Hrvatskoj. Pratimo prisutnost hrvatskih glagoljaša u Pragu, koji dolaze u samostan Emaus sredinom 14. stoljeća, na poziv rimsko-njemačkog cara i češkog kralja Karla IV. Oni su toj novoj sredini dali glagoljaško bogoslužje, glagoljicu kao pismo kojom se češki jezik zapisivao i ostavili brojna glagoljička djela koja se čuvaju u Narodnom muzeju i Narodnoj sveučilišnoj knjižnici. Tragove Hrvata u Češkoj zatim pratimo na Karlovom sveučilištu, u katedrali sv. Vita te na dvoru kralja Rudolfa II., kojemu je carski tajnik bio naš glasoviti izumitelj Faust Vrančić. Zanimljiv primjer uzajmne povezanosti Hrvata i Čeha su i slova s kvačicama. Česi su kvačicu s glagoljičkog slova ž u 15. stoljeću uveli u svoj pravopis, a u 19. stoljeću Ljudevit Gaj vraća tu kvačicu u hrvatski pravopis. Mnogi su hrvatski velikani boravili ili studirali u Pragu. Među njima su Vatroslav Lisinski, August Šenoa, Nikola Tesla, Andrija Mohorovičić, nobelovac Vladimir Prelog. Epizoda završava s pričom o našem najpoznatijim studentom u Pragu - Stjepanu Radiću i njegovoj supruzi, Čehinji Mariji Radić. Tekst čitao: Miljenko Kokot'
