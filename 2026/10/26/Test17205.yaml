  title: Mise au point
  description: "(Rediffusion) (Suisse Romande-2026)  - Pénurie de foin La Suisse peine à nourrir ses vaches après un été caniculaire et une sécheresse qui perdure. Dans les prairies, l'herbe ne pousse tout simplement pas assez et le précieux foin fait l'objet d'un trafic qui met sous pression les paysans au-delà des frontières, reportage. \n - Israël : à droite toute Ils sont 600'000 jeunes israéliens et israéliennes à voter pour la première fois aux élections législatives ; une grande partie d'entre eux ne croit plus à la paix et veut la sécurité par-dessus, dans une société polarisée à l'extrême, un virage à droite qui divise aussi les familles, reportage.\n - Gypaète : réintroduction gagnante C'est le retour d'un oiseau géant des Alpes : naguère estampillé oiseau de mauvais augure, soi-disant kidnappeur de mouton et d'enfants, il avait disparu pendant plus d'un siècle. Nous avons suivi la réintroduction, du nid à l'air libre, avec tous ses dangers et ses victoires, découverte."
  genre:
