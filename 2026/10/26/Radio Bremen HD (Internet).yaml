  title: Elefant, Tiger & Co. (965)
  subtitle: Die Sprache der Elefanten
  description: Wie kommunizieren eigentlich Elefanten? Und was bekommt der Mensch davon mit? Um seine Herde mal aus der Reserve zu locken, spielt Thomas Günther den Dickhäutern Aufnahmen von Gesprächen anderer Elefanten vor. Kewa und ihre Familie spitzen mächtig die Ohren, stampfen mit den Füßen und schlagen mit dem Rüssel. Was ihnen da wohl gerade an den Kopf geworfen wird? Die mit den Erdmännchen verwandten Zwergmangusten werden an diesem Tag viel Neues entdecken. Jörg Gräser hat ihnen eine Art Forschungsstation gebaut.
- eventId: 724744
  start: 2026-10-26T05:20:00Z
  stop: 2026-10-26T05:50:00Z
  title: Wie geht das? Überleben auf See
  description: In der Seemannsschule in Lübeck-Travemünde werden zukünftige Seefahrer auf den Notfall vorbereitet. Denn für Schiffbrüchige zählt jede Sekunde. Die Überlebenszeit in kaltem Wasser vermindert sich von Minute zu Minute. Doch mit einem sogenannten Eintauchanzug sinkt die Körpertemperatur auch nach sechs Stunden nur um zwei Grad und erhöht somit die Chancen auf eine Rettung. Neben dem richtigen Gruppenverhalten im Wasser wird auch das Erklimmen einer Rettungsinsel gelehrt, alles realitätsnah in der Ostsee bei neun Grad.
  genre:
  - '112'
