- eventId: 718657
  start: 2026-10-26T02:45:00Z
  stop: 2026-10-26T03:10:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 722824
  start: 2026-10-26T03:10:00Z
  stop: 2026-10-26T03:40:00Z
  title: Die Nordreportage
  subtitle: Neustart auf dem Gutshof - Mit Herzblut für Hühner, Holz und Honig
  description: 'Frederik von Rumohr gehört zu einer der ältesten Familien in Schleswig-Holstein und hat vor wenigen Jahren etwas ganz Besonderes geerbt: das Gut Drült im schleswig-holsteinischen Angeln. Nachdem der Hof lange fremd bewirtschaftet war, möchte ihn Frederik von Rumohr unter Rückgriff auf altbewährte Methoden neu aufbauen. Die Reportage zeigt die Herausforderungen eines großen Erbes und die Bestrebungen, dem Hof mitsamt Holz, Honig und Hühnern eine nachhaltige Perspektive zu geben.'
- eventId: 722826
  start: 2026-10-26T03:40:00Z
  stop: 2026-10-26T04:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  subtitle: Abschied von Hof Hahnenkamp in Schleswig-Holstein in den "Hofgeschichten"
  description: In Schleswig-Holstein ist der Herbst auf Hof Hahnenkampf angekommen. Es gab sogar schon Frost. Und bevor die Weiden unter Wasser stehen, wollen Urte Schulz-Möllgaard und ihr Mann Jörg Schulz ihre Kühe in den Stall bringen. Aber die wollen nicht ohne Weiteres mit. Mithilfe eines Seils versuchen sie schließlich, die Tiere auf den Viehwagen zu treiben. Diese Aktion ist die letzte, die es von Urte und Jörg in den "Hofgeschichten" zu sehen gibt. In dieser Folge erzählen sie, warum sie sich schweren Herzens dazu entschlossen haben, auszusteigen.
- eventId: 723639
  start: 2026-10-26T04:10:00Z
  stop: 2026-10-26T04:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Marietta Slomka, "heute journal"-Moderatorin'
  description: Unter Politikerinnen und Politikern dürfte Marietta Slomka durchaus gefürchtet sein. Denn mit ihrem unnachgiebigen Fragestil hat sie schon einige von ihnen im Interview gehörig ins Schlingern gebracht. Zu sehen sind solche eindrücklichen Fernsehmomente im ZDF-"heute journal". Seit nunmehr einem Vierteljahrhundert ist Marietta Slomka in einer der wichtigsten Nachrichtensendungen des Landes zu sehen. Wenn die Lichter im TV-Studio aus sind, setzt sie sich auch mal als Autorin hin.
- eventId: 724008
  start: 2026-10-26T04:55:00Z
  stop: 2026-10-26T05:20:00Z
  title: Elefant, Tiger & Co. (965)
  subtitle: Die Sprache der Elefanten
  description: Wie kommunizieren eigentlich Elefanten? Und was bekommt der Mensch davon mit? Um seine Herde mal aus der Reserve zu locken, spielt Thomas Günther den Dickhäutern Aufnahmen von Gesprächen anderer Elefanten vor. Kewa und ihre Familie spitzen mächtig die Ohren, stampfen mit den Füßen und schlagen mit dem Rüssel. Was ihnen da wohl gerade an den Kopf geworfen wird? Die mit den Erdmännchen verwandten Zwergmangusten werden an diesem Tag viel Neues entdecken. Jörg Gräser hat ihnen eine Art Forschungsstation gebaut.
