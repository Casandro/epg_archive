  description: 'Der Dethlinger Teich ist eine ehemalige Kieselgur-Grube im Landkreis Heidekreis, in die laut niedersächsischem Umweltministerium während des Zweiten Weltkrieges und danach mehr als 100.000 hochgefährliche Giftgas- und Sprenggranaten der Wehrmacht entsorgt wurden. Seit Oktober 2023 werden diese geborgen und entsorgt. Gut fünf Jahre soll die Räumung dauern. Als einziges Kamerateam ist "Die Nordreportage" bei der Räumung dabei, begleitet die Feuerwerker bei ihrer gefährlichen Arbeit und zeigt den Weg der Munition: von der Bergung bis zur Vernichtung.'
