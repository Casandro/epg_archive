  title: 'Von alten und neuen Herrlichkeiten: Günter de Bruyn'
  subtitle: Porträt / von Helmut  Böttiger
  description: "Zum 100. Geburtstag von Günter de Bruyn am 1. November\n\nGünter de Bruyn hat mit der ihm gemäßen leisen Beharrlichkeit seines Schreibens und öffentlichen Wirkens eine unverzichtbare Position in die Öffentlichkeit gebracht. In vielem setzt er eine deutsche Traditionslinie fort, die er selbst am deutlichsten in seinem Buch über Jean Paul festgemacht hat: es ist der spielerische, leichte Blick aus der Provinz, in dem das große Weltgefüge aufklart und verwunden werden kann. \nIn Werken wie \"Buridans Esel\", \"Märkische Forschungen\" oder \"Neue Herrlichkeit\" hat er präzise Zeit- und Gesellschaftsdiagnosen gestellt. Seine autobiografischen Bücher \"Zwischenbilanz\" und \"Vierzig Jahre\" geben ein differenziertes, dichtes Bild des geteilten Deutschlands, das alle Nostalgiker und Vereinfacher überdauern wird.\n\nHelmut Böttiger, geboren 1956, war viele Jahre Kulturredakteur bei großen Tageszeitungen und lebt als freier Autor und Kritiker in Berlin. Der promovierte Germanist hat zahlreiche Bücher veröffentlicht und kuratierte mehrere Literatur-Ausstellungen. 1996 erhielt er den Ernst-Robert-Curtius-Förderpreis für Essayistik. Er lehrte als Gastprofessor für Literaturkritik an der Georg-August-Universität Göttingen und gehört verschiedenen Jurys an, unter anderem der SWR-Bestenliste mit Buch-Empfehlungen. 2012 wurde er mit dem Alfred-Kerr-Preis für Literaturkritik ausgezeichnet.\n\n(53 Min.)\n\nRegie: Rainer Schwarz\nProduktion: MDR 2006\n\nMitwirkende: \nSusanne Bard\nWinfried Glatzeder\nThomas  Stecher\nConny Wolter"
