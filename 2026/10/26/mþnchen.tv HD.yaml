  description: |-
    Ein Kandidat wird überraschend auf der Straße angesprochen und erhält die Chance auf einen Kurzurlaub. Die Bedingung: Er muss drei Begleitpersonen spontan finden (Freunde, Kollegen,
    Familienmitglieder), die innerhalb von zwei Stunden startklar sind. Gelingt es, sitzen alle vier rechtzeitig im Auto - andernfalls verfällt die Reise, und ein neuer Kandidat wird gesucht.
