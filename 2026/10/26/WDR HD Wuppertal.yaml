  description: Die erste Dorfversammlung geht in die entscheidende Phase. Nach langen Diskussionen und zahlreichen Verdächtigungen muss das Dorf erstmals einen Spieler aus den eigenen Reihen wählen. Die Gruppe ist sich schnell einig, wer gehen muss - vielleicht zu schnell? Die Dorfbewohner erhalten einen Trumpf im Kampf gegen das Wolfsrudel. Doch wer hat die neue Sonderrolle erhalten? Die Seherin kann entscheidendes Wissen sammeln - darf dabei jedoch keinesfalls riskieren, sich den Werwölfen zu erkennen zu geben.
