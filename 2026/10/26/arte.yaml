  title: Europa. Kontinent im Umbruch (5/6)
  subtitle: Die digitale Herausforderung
  subtitled: true
  genre:
  - '130'
  description: "Dating-Apps und Lieferservice, Homeoffice und künstliche Intelligenz im Wohnzimmer: Unser Alltag ist digitaler denn je. Gleichzeitig treten die wunden Punkte der globalen Vernetzung hervor. Die Abhängigkeit von internationalen Tech-Giganten wird zur Gefahr für die europäischen Demokratien. Doch Europa rüstet auf. \n\nDie Zuschauer erleben in deutschen Mikrochip-Fabriken, bei Hackern im Kosovo, Aktivisten der spanischen Demokratie-2.0-Bewegung und aufbegehrenden Telearbeitern in Italien den allgegenwärtigen Kampf um die Kontrolle über unseren verborgenen Kontinent: das digitale Europa."
