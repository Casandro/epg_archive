  title: Die Mythen der Wikinger (9/10)
  subtitle: Lokis Zankreden
  description: 'Die Reihe erzählt die Geschichte der nordischen Götter, von Odins Visionen bis zur Götterdämmerung Ragnarök, als visuelles Abenteuer. In dieser Folge: Eine alte Priesterin erkundigt sich bei Frigg nach dem Schwur der Geschöpfe, ihrem Sohn Baldr kein Leid zuzufügen. Frigg bestätigt, dass alle außer der harmlosen Mistel den Eid abgelegt haben.'
