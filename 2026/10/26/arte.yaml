  title: Europa. Kontinent im Umbruch (6/6)
  subtitle: Die Natur und wir
  subtitled: true
  description: Klimakrise und Artenschwund offenbaren auf dramatische Weise, dass wir unser Verhältnis zur Natur verändern müssen. Von den schmelzenden Gletschern der Alpen zu den mit Plastik verschmutzten Küsten Griechenlands, von den blauen Schmetterlingen auf den Wiesen Englands zu den Primärwäldern Rumäniens, vom Herzen Berlins bis zu den Bären im verlassenen Berggebiet Asturiens suchen Menschen auf dem ganzen Kontinent nach Wegen zu einem neuen Gleichgewicht mit der Natur.
