  title: Stage
  description: Na Stagi si dnes poslechneme koncert hudebníka Yasha 96 z loňského ročníku Czeching Showcase v Archa+. Právě tam se představila živě trojice finalistů exportního projektu Radia Wave Czeching. Yasha 96 je indie-popový projekt v Berlíně usazeného hudebníka Jáchyma Kováře, který čerpá inspiraci ze sugestivní písničkářské tvorby 90. let. Její nostalgické vibrace svérázně propojuje se současnými vlivy, tím se do jeho hudby dostává i moderní pojetí post-punku. Ve spolupráci s producentem Nero Scartchem se často odkazuje i na klubovou elektroniku. Stage laďte v pondělí ve 21:00. (repríza)
