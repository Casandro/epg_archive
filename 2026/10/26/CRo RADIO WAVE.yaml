  stop: 2026-10-26T21:30:00Z
  title: Tahle země není pro ženský
  description: (3/5) Pětidílný černě humorný thriller o dvou holkách, které dostanou druhou šanci na život. Isa a Dee se probudí uprostřed pouště a nepamatují si, jak se tam dostaly. Aby se mohly vrátit zpátky, musí najít a zabít jednoho muže. Jenže neznají jeho jméno, nevědí, jak vypadá ani proč právě on má zemřít. Na cestě plné násilí, podivných setkání a špatných rozhodnutí postupně zjišťují, co se jim skutečně stalo. Vyprahlý audiotrip o holčičí pomstě, vzteku, který se nedá pohřbít, a mužích, kteří si myslí, že jim všechno projde. V hlavních rolích Karolína Knězů, Marie Anna Myšičková, Jan Hájek a Jan Teplý. Scénář a režie Tomáš Ráliš. Obsah zahrnuje vulgarismy, násilí a sexuálně explicitní scény a není vhodný pro děti.
