  title: SWR Kultur - Das Wissen
  subtitle: Pilze sammeln - Naturnahes Hobby oder ökologisch fragwürdiger Trend?
  description: |-
    Von Olivia Samnick
    Pilz-Influencer erreichen auf Social Media ein großes Publikum und geführte Pilz-Sammeltouren sind gefragt. Die Gründe sind vielfältig: Naturerlebnisse beim Sammeln spielen ebenso eine Rolle wie der Wunsch nach gesunder fleischloser Ernährung, die auch noch nachhaltig sein soll. Letzteres machen auch Start-ups erfolgreich zu ihrem Business. Doch der wachsende Pilz-Enthusiasmus hat auch seine Kehrseiten: Wer einfach unbedacht drauflos sammelt, kann Naturschutzgebiete gefährden, Wälder übermäßig plündern oder schnell doch mal einen Giftpilz erwischen.
