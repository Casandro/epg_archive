    Science-Fiction-Serie, USA 2022
    Altersfreigabe: ab 12
  description: |-
    Die Verschmelzung beider Welten ist in vollem Gange. Immer mehr Menschen verschwinden spurlos - und auch Lana versucht verzweifelt, ihren Mann Kyle aufzuspüren. Lois und Clark überlegen fieberhaft, wie sie Ally aufhalten können, um ihre Familie und die ganze Erde zu retten. John Henry gelingt es zeitgleich, Kontakt zu seiner Tochter herzustellen. Er scheint sich zwischen den Welten zu befinden. Superman muss indes alles riskieren, um seine Kräfte wiederzuerlangen.

