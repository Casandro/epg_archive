    Information, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Aiman Abdallah

    Penny oder Netto Marken-Discount - wo bekommen Kundinnen und Kunden mehr fürs Geld? "Galileo"-Reporter Martin Dunkelmann nimmt beide Discounter anhand einer identischen Einkaufsliste, eines Preisvergleichs und eines Geschmackstests genauer unter die Lupe. Außerdem vergleicht er die Marktstrategien der Anbieter und klärt die Frage: Warum setzen die Mutterkonzerne REWE und EDEKA überhaupt auf Discount-Ableger?
