  start: 2026-10-26T02:15:00Z
  stop: 2026-10-26T03:10:00Z
  title: Europa. Kontinent im Umbruch (4/6)
  subtitle: Die neuen Europäer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '130'
  description: Europa fußt auf dem Prinzip der Reisefreiheit von Personen. Doch Sicherheitspolitik und Fremdenfeindlichkeit, Arbeitslosigkeit und der Ukrainekrieg bestimmen Migrationsbewegungen und ihre Regeln immer wieder neu. Erneut steht die europäische Migrationspolitik vor historischen Herausforderungen.
