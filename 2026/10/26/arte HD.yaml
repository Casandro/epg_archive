  title: Europa. Kontinent im Umbruch
  subtitle: Die Natur und wir
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Klimakrise und Artenschwund offenbaren auf dramatische Weise, dass wir unser Verhältnis zur Natur verändern müssen. Von den schmelzenden Gletschern der Alpen zu den mit Plastik verschmutzten Küsten Griechenlands, von den blauen Schmetterlingen auf den Wiesen Englands zu den Primärwäldern Rumäniens. Europäerinnen und Europäer suchen nach Wegen zu einem neuen Gleichgewicht mit der Natur.
- eventId:
