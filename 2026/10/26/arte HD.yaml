  start: 2026-10-26T05:50:00Z
  stop: 2026-10-26T06:20:00Z
  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Käse
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vom einfachen Grundnahrungsmittel zum wertvollen Kulturgut - Käse schreibt Geschichte: Während italienische Banken Parmesan als Wertanlage nutzen, pflegen Senner Daniel Mangeng im Montafon und Sébastien Beaury in der Touraine traditionelles Handwerk. Köchin Lucie Fischer-Chapalain entdeckt die kulinarische Vielseitigkeit mit raffiniertem Grilled Cheese und würzigen Käse-Muffins.'
