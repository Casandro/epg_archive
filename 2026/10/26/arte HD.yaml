  title: Europa. Kontinent im Umbruch (2/6)
  subtitle: Energie für alle
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Energie ist Leben. Das spüren die Europäer derzeit hautnah. Zu lange schon lebt unser Kontinent von Kohle, Öl und Gas - aus der ganzen Welt importiert, Druckmittel geopolitischer Interessen und Treiber des Klimawandels. Alternative Lösungen sind überlebenswichtig. Aber reichen die nationalen und lokalen Initiativen für eine europäische Energiewende? \nDer Film hinterfragt \"grüne\" Multinationale in Dänemark, befragt Kohlearbeiter in Polen und zeigt Low-Carbon-Initiativen in Frankreich. Können die Anstrengungen ausreichen, um unsere Autonomie zu sichern und die Klimakatastrophe zu verhindern?"
- eventId:
  - 1319959
  - 573340
  start: 2026-10-26T01:20:00Z
  stop: 2026-10-26T02:15:00Z
  title: Europa. Kontinent im Umbruch (3/6)
  subtitle: Mobilität ohne Grenzen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '130'
  description: 'Ohne Transport steht der Kontinent still. Straßen, Schienen und Flugkorridore sind die Adern, die Europa versorgen und verbinden. Wie können wir das mit den großen Herausforderungen der Zukunft in Einklang bringen: Reduzierung der CO2-Emissionen, E-Autos, Revolution des Schienenverkehrs?'
- eventId:
