    Liberté, égalité, brutalité - die Bilder der Verwüstung aus Frankreich sind verstörend. Sind sie auch ein Menetekel für Deutschland? Was Anfang September mit friedlichen Protesten über den maroden Zustand der Schulen begonnen hatte, endete letztes Wochenende in einem Gewaltinferno. Mehr als eine halbe Million Menschen beteiligte sich im ganzen Land an teils gewaltsamen Demonstrationen. Übrig blieben verletzte Polizisten, geplünderte Geschäfte, zerstörte Gebäude. Seit dem Wochenende wurden rund 2.700 Menschen festgenommen.
