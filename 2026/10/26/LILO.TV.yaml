  title: So schmeckt die Welt - Klagenfurt
  subtitle: So schmeckt die Welt - Klagenfurt
  description: Ein einzigartiger und stilvoller Ausflug in die kulturelle Szene von Klagenfurt erwartet dich. Als österreichische Landeshauptstadt strahlt Klagenfurt am berühmten Wörthersee zweifellos Urlaubsatmosphäre aus. Hier zu leben bedeutet praktisch, immer im Urlaub zu sein. Die Dokumentation über diese Sonnenstadt in Kärnten zeigt eindrucksvoll, warum das so ist. Dabei präsentiert sich die Landeshauptstadt auf vielfältige Weise bunt und abwechslungsreich - vom Bodypainter bis zum Schlagzeug-Workshop.
  genre:
