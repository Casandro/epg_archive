  title: So schmeckt die Welt - Leipzig
  subtitle: So schmeckt die Welt - Leipzig
  description: Während andere Städte in Ostdeutschland noch versuchen, aufzuholen, hat Leipzig bereits viele westdeutsche Städte überholt. Diese Stadt ist zweifellos ein Paradebeispiel dafür, wie Veränderungen auf kreative Weise gestaltet werden können. Ob in der Kunst, im Wohnbereich oder bei der Gestaltung der Stadt - Leipzig beeindruckt mit innovativen Vierteln und einem modernen Flair. In dieser 45-minütigen Dokumentation werfen wir einen Blick auf das neue, zeitgemäße Leipzig des 21. Jahrhunderts.
  genre:
