  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Das Weltgebetstreffen in Assisi: 40 Jahre Beten für den Frieden
    Im Oktober 1986 fand im italienischen Assisi das erste Weltgebetstreffen für den Frieden statt, initiiert vom damaligen Papst Johannes Paul II. Zum 40. Jahrestag kommen in Assisi erneut Vertreter unterschiedlicher Religionen zusammen. Organisiert werden die Weltgebetstreffen von der römisch-katholischen Laiengemeinschaft Sant?Egidio. Welche Potenziale und Grenzen bietet interreligiöse Friedensarbeit in Zeiten multilateraler Konflikte in der Welt. Fragen an den Generalsekretär von Sant?Egidio, Cesare Zucconi.

    Pionierarbeit in der Hospizbewegung: Vor 40 Jahren wurde das erste Hospiz in Deutschland eröffnet
    Am 26. Oktober 1986 wurde in Aachen das erste Hospiz in Deutschland eröffnet: Ein Haus des katholischen Oratorianerordens, das sterbende Menschen medizinisch, menschlich und seelsorgerisch begleitet. Heute sind Hospize aus der gesundheitlichen Versorgung nicht mehr wegzudenken. Doch am Anfang gab es auch viel Widerstand.

    Am Mikrofon: Benedikt Schulz
