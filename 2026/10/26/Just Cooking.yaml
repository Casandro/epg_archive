  description: Ich bin eine große Verfechterin der klassischen Saucen und finde, sie können ein ansatzweise banales Gericht in den Adelsstand erheben. Sebastian Hurnaus vom Casino Restaurant in Wien zeigt uns, was hinter der Sauce Maltaise steckt - und die wichtigsten Tricks, damit der Klassiker gelingt. Dazu gibt es einen saftigen Schweinerücken aus Niederösterreich. Was will man mehr? AT 2019
