  title: Mein wunderbarer Kochsalon - Kärntner Ritschert mit Forelle
  subtitle: Mein wunderbarer Kochsalon - Kärntner Ritschert mit Forelle
  description: Ritschert, das schmeckt für mich nach Kindheit. Meine Mutter kochte geselchte Würsteln und im Sud dann Gerste, Zwiebeln, Karotten, bis es sich zu einem geschmacksdichten Eintopf verband. Mit Nostalgie und einem Touch Rührung schaute ich Drei-Hauben-Koch Hannes Müller (Forelle/Weißensee) beim Ritschert-Kochen über die Schulter. Das Ergebnis war schlicht und ergreifend köstlich und wie so oft danach frage ich mich, warum ich so selten mit Rollgerste koche. AT 2019
