  title: Die besten Köche der Welt - Zu Gast im Ikarus - Sat Bains
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Sat Bains
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Wer denkt, Sat Bain''s imposante Statur lasse auf eine grobe, ungelenke Küche schließen, der irrt gewaltig. Der Zwei-Sterne-Koch ist in seinem nach ihm benannten Restaurant ein Perfektionist, der jedes kleinste Detail in seinen, britisch angehauchten Degustationsmenüs im Blick hat. Dabei entstehen Kreationen, die dann doch wieder viel mit Bains'' Physis gemein haben: Sie sind einfach kolossal.Lernen Sie die Küche Großbritanniens näher kennen. AT 2014'
