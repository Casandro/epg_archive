  title: Die besten Köche der Welt - Zu Gast im Ikarus - Rodolfo Guzman in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Rodolfo Guzman in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Rodolfo Guzmán kocht radikal regional und mit einem gesamtkulturellen Ansatz - er bringt die indigenen Ressourcen Chiles in den Hangar-7. Mit dem Team des Restaurants Ikarus wird er Kochtechniken umsetzen, die bereits die chilenischen Ureinwohner - die Mapuche-Indianer - anwendeten. Als Chef des "Boragó" in Santiago de Chile ist Rodolfo Guzmán eine Art Botschafter seines Landes. Mit seiner avantgardistischen Endemic Cuisine lockt er Gourmets aus aller Herren Länder in die Andenrepublik. Diese Folge von Spitzenköche im Ikarus zeigt, wie der Chilene seine Küche an die Salzburger Umgebung anpasst - das Ikarus-Küchenteam steht ihm dabei zur Seite. AT 2014'
- eventId: 1020241
  start: 2026-10-26T05:30:00Z
  stop: 2026-10-26T05:55:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Magnus Ek
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Magnus Ek
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im "Oaxen Krog" auf der Schäreninsel Djurgarden, unweit der City von Stockholm, präsentiert Magnus Ek seine innovative und regional verankerte New Nordic Cuisine. Dafür wird das Restaurant 2014 mit dem ersten Stern im Guide Michelin der europäischen Hauptstädte ausgezeichnet. Schon Jahre vor anderen Sterneköchen wie René Redzepi entwickelte Ek seine Küchenphilosophie, die auf Regionalität und Nachhaltigkeit setzt. Magnus Ek nutzt die Komposthaufen in der unmittelbaren Nachbarschaft, um Knoblauch zu fermentieren und bezieht Rentierfleisch aus dem weit im Norden gelegenen Jokkmokk. Vill du fika? - Möchtest du Kaffee trinken? - ist eine existenzielle Frage im skandinavischen Sprachraum. Gemeinsame Kaffeepausen mit Kollegen gehören für Sternekoch Magnus Ek zum Arbeitsalltag. Die typisch schwedischen Zimtschnecken und das traditionelle Knäckebrot sind dabei unentbehrlich. AT 2014'
- eventId: 1020248
  start: 2026-10-26T06:00:00Z
  stop: 2026-10-26T06:25:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Magnus Ek in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Magnus Ek in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Die innovative nordische Küche von Magnus Ek wird 2014 mit einem Stern ausgezeichnet. Eks Küche basiert auf dem New Nordic Manifesto - regionale Produkte stehen in den nordischen Ländern seit 2004 im Fokus. Seine eigene Küchenphilosophie hat er aber schon lange zuvor entwickelt. Seit 20 Jahren setzt Ek unbeirrt auf Regionalität und Nachhaltigkeit. Eine große Herausforderung in einem Land, in dem sechs Monate lang Winter herrscht. Doch der schwedische Einfallsreichtum macht es möglich, und so werden diesmal im Salzburger Hangar-7 typisch nordische Spezialitäten zubereitet: Schwarzer Knoblauch, Rentiertatar und die Neuinterpretation traditioneller Fischgerichte sind nur ein kleiner Auszug dessen, wie die Gäste im Juni empfangen werden. AT 2014'
