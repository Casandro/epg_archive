  title: Die besten Köche der Welt - Zu Gast im Ikarus - Sat Bains in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Sat Bains in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Wer denkt, Sat Bain''s imposante Statur lasse auf eine grobe, ungelenke Küche schließen, der irrt gewaltig. Er ist Perfektionist mit Hang zum Filigranen. Jedes kleinste Detail seines aromenreichen, britisch angehauchten Gastkochmenüs hat er im Blick. Er ist ein Chef, der weiss, wo es langgeht, Das Team des Restaurant Ikarus im Hangar-7 bringt er jedenfalls richtig ins Schwitzen. AT 2014'
