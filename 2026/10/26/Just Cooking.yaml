  title: Die besten Köche der Welt - Zu Gast im Ikarus - Martin Klein und das Ikarus Team
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Martin Klein und das Ikarus Team
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Neu ist diesmal der Regisseur in der Ikarus Küche: Martin Klein hat Anfang 2014 das Zepter als Executive Chef im Restaurant Ikarus übernommen und kreiert zum ersten Mal selbst das Menü des Monats. Tatkräftig unterstützt wird er dabei von seinem Team. Für Martin Klein eine willkommene Abwechslung. 2002 hat er sich in München einen Michelin-Stern erkocht, sein Können muss er nun in Salzburg unter Beweis stellen. Für ihn ist es jedenfalls eine Rückkehr nach Hause, zauberte er doch bereits von 2003 bis 2012 als Küchenchef im Restaurant Ikarus. Das August-Thema vom Ikarus Team: Die Essenz des Geschmacks. Es gibt sie in jeder Küche der Welt - und dennoch wird ihnen nur allzu selten die Aufmerksamkeit zuteil, die sie eigentlich verdienten: Essig und Öl. Für Executive Chef Martin Klein und das Team des Restaurant Ikarus war dies der Ansporn, diese beiden essenziellen kulinarischen Begleiter im diesjährigen Festspielmenü zu inszenieren. Nie als Hauptkomponenten, aber stets außergewöhnlich arrangiert als entscheidende Note jedes Gerichts. AT 2014'
