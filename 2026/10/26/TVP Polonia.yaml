    Sylwia i kapitan zbliżają się do siebie. Przychodzi więc czas pytań i odpowiedzi. Zaprzecza, że wiedział o istnieniu Sylwii przed zobaczeniem w telewizji reportażu z huraganu w Majakach. Między ojcem i córką zawiązuje się nić zaufania i sympatii. Pod dużym znakiem zapytania staje koncert Bystrej Wody. Wprawdzie wszyscy członkowie dawnego zespołu doktora przyjeżdżają do Majaków, ale Boruta nie zgadza się, żeby zagrać na koncercie pożegnalnym.
