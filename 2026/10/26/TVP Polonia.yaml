    odc. 11 Malina zabiera Marysię do getta, aby spotkała się z ojcem i siostrą. Na miejscu Marysia z przerażeniem obserwuje nieludzkie warunki, w jakich żyją. Kiedy wychodzą z getta, trafiają na szmalcowników. Marysi udaje się zbiec, dzięki pomocy Franka, który wpuszcza ją do swojego mieszkania, aby przeczekała obławę. Ewa idzie na spotkanie do fotografa, czyli skrzynki kontaktowej. Zastaje tam Witka, który wyznaje jej miłość. Dziewczyny stają na odprawie przed majorem Alfą.
