    Sylwia musi zająć się Dżekiem, pieskiem Kozyrów. Okazuje się, że po skaleczeniu w lesie jego łapa nie chce się goić, wdała się martwica. Sylwia robi wszystko, żeby uratować kończynę. Doktor czuje się coraz gorzej. Dawid jest świadkiem jego zasłabnięcia. Kolejny dzień w Majakach rozpoczyna wiec wyborczy Traczyka, na który prawie nikt nie przychodzi.
  ageRating: 12
