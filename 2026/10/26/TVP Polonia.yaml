    Po rozmowie z Bogusiem, który musiał tłumaczyć się na komendzie ze swoich powiazań z właścicielem klubu, w którym pracuje, Zuza spotyka na korytarzu Tomka. Policjant prowadzi na przesłuchanie Jana Mostowskiego podejrzanego o wyłudzanie haraczy. Gdy Wasiluk wspomina o tym Henrykowi, ten przypomina sobie sprawę sprzed czterech lat. Chodziłoo morderstwo psychiatry Bogdana Sawickiego, którego opinia zaprowadziła Mostowskiegodo więzienia. Lekarz zginął kilka dni po wyjściu Jana na wolność.
