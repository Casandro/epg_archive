  description: "Im Schweizer Kanton Wallis liegt die Bettmeralp. Hier lebt der 15-jährige Alexander Eyholzer. In den Sommerferien hilft er auf dem Bauernhof und in der Berghütte seines Onkels. Am liebsten kümmert er sich aber um die Rinder der Familie. Die alte Rasse der Eringer Kühe gehört zu den kleinsten Rinderrassen Europas. Mit den Tieren geht Alexander bei traditionellen Ringkuhkämpfen an den Start. \n\n DE 2011"
