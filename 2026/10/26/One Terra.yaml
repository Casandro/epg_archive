  title: Planet Weltweit - Die Marmorberge von Italien
  subtitle: Planet Weltweit - Die Marmorberge von Italien
  description: "Die Apuanischen Alpen im Nordwesten der Toskana beherbergen eines der größten Marmorvorkommen der Welt. Seit der Römerzeit wird hier der weltberühmte Carrara-Marmor abgebaut. Mit allen Mitteln der Technik ringt der Mensch dem Berg das wertvolle Gestein ab und transportiert es auf halsbrecherischen Wegen ins Tal, von wo aus seine Reise in die ganze Welt beginnt. \nAm frühen Morgen fährt der Bildhauer Renzo Maggi zum 1.300 Meter hoch gelegenen Marmorbruch von Monte Cervaiole. Bereits Michelangelo hat sich hier im 16. Jahrhundert seine gigantischen Marmorblöcke ausgesucht. Trotz moderner Technik wird die Marmorgewinnung größtenteils noch auf traditionelle Weise betrieben. Teilweise unter lebensgefährlichen Bedingungen: Extreme Wetterschwankungen und Nebel erschweren den Einsatz von schwerem Gerät. Auf halsbrecherischen Serpentinen wird die tonnenschwere Last dann hinab zum Hafen von Carrara gebracht, von wo aus der Marmor seine Reise in die ganze Welt antritt. \n\n\"Man sagt, dass der Marmor ewig lebt. Nachdem er den Berg verlassen hat, kann er vielleicht eine Treppe werden, die sich mit dem Vergehen der Zeit abnutzt, oder ein Waschbecken. Er wird mit der Patina der Zeit immer schöner werden...\" Der Bildhauer Renzo Maggi ist dem Marmor verfallen - oft fährt er schon am frühen Morgen in den Marmorbruch von Monte Cervaiole - weil er sich einerseits mit den Marmorarbeitern eng verbunden fühlt, andererseits um sich wieder einmal ein Filetstückchen unter den Marmorbrocken für seine Arbeiten auszusuchen. Er ist einer der wenigen Bildhauer, die ihre Arbeiten selbst anfertigen. Berühmte Bildhauer wie Louise Burgeois, Fernando Botero oder Jeff Koons kamen in das weltberühmte Dörfchen Pietrasanta und überließen die Ausführung ihrer Entwürfe meist anderen Bildhauern. Der Marmor aus dieser Gegend wird weltweit wegen seiner weißen Reinheit geschätzt. Rund 190 Millionen Jahre alt sind die Felsmassive der Apuanischen Alpen. DE 2013"
- eventId: 1020233
  start: 2026-10-26T12:15:00Z
  stop: 2026-10-26T13:07:00Z
  title: Planet Weltweit - Das Vermächtnis der Marquesas-Inseln
  subtitle: Planet Weltweit - Das Vermächtnis der Marquesas-Inseln
  description: "Nahezu verloren wirken die Marquesas im nördlichen Teil Französisch-Polynesiens: vulkanische Inseln inmitten des Pazifik, weit abgelegen von jedem Kontinent. Und doch prägte die Kultur ihrer Bewohner, ihre Kunst und Sprache, einst den gesamten südpazifischen Raum. \n\nDie Marquesaner behaupten, die Inseln seien so weit abgelegen, dass ihre nächsten Nachbarn die Götter sind. In der Tat sind es bis nach Neuseeland über 5000 Kilometer, nach Australien mehr als 6000. In dieser Abgeschiedenheit entstanden einst eine lebendige Kultur und Religion, die später den gesamten südpazifischen Raum beeinflusst haben. Auf der Suche nach neuen Lebensräumen besiedelten die Marquesaner etwa die Osterinseln oder Hawaii und brachten ihre Lebensweise, ihre Gesänge und Tänze, und ihre Religion mit. Auch die heute weltweit beliebten \"Tataus\", die Tätowierungen, stammen von den Marquesas. Als die Inseln jedoch Ende des 18. Jahrhunderts unter den Einfluss europäischer Eroberer und Missionare gerieten, wurden die Menschen gezwungen, ihre Jahrtausende alten Traditionen aufzugeben; ihre Kultur ging verloren. Erst in den vergangenen Jahren wurde deren Wert wiedererkannt, sowohl von den Einheimischen als auch von westlichen Wissenschaftlern. Einer von ihnen ist der französische Archäologe Pierre Ottino. Zusammen mit einheimischen Jugendlichen versucht er, das Leben auf den Inseln vor der Okkupation zu rekonstruieren: In mühevoller Kleinarbeit legen sie die Überreste einstiger Siedlungen frei, entdecken tief in die Erde gegrabene Opferstätten und steinerne Göttergestalten - so genannte Tiki. Kein leichtes Unterfangen, denn viele dieser Stellen liegen im dichten Dschungel oder an unzugänglichen Buchten. \n DE 2004"
- eventId: 1020234
  start: 2026-10-26T13:15:00Z
  stop: 2026-10-26T14:07:00Z
  title: Planet Weltweit - Chartres, die Farben des Himmels
  subtitle: Planet Weltweit - Chartres, die Farben des Himmels
  description: 'Weniger als 100 Kilometer südwestlich von Paris, inmitten der großen Ebene von Beauce, bekannt als die "Kornkammer" Frankreichs, ist die Kathedrale Notre-Dame de Chartres weithin sichtbar. Der Bildhauer Auguste Rodin nannte sie die "Akropolis von Frankreich". Auch die kunstvollen Glasmalereien der Kathedrale beeindrucken Besucher seit jeher. Im Schatten des Riesenbaus beherbergt die Gegend noch immer Werkstätten für Glasmalereien. Die "Maison Lorin" ist eine der letzten aus dem 19. Jahrhundert, die heute noch in Betrieb sind. Sie wird von Elodie Vally geführt, einer Meisterin ihres Fachs. Elodie Vally wuchs direkt an der Kathedrale auf und entwickelte bereits in ihrer Jugend eine Leidenschaft für die Glasmalerei. Heute leitet sie die "Maison Lorin" und erhält damit ein wichtiges Kulturerbe am Leben. Glasmalerei ist für Elodie eine Herausforderung an sich, ein Balanceakt zwischen den verschiedenen Eigenschaften von Glas: Glanz, Transparenz, Steifheit, Farbenvielfalt. Dazu kommt die Zerbrechlichkeit des Materials. In ihrer Werkstatt gewährt Elodie einen Blick zurück, fast so etwas wie einen Zeitsprung hinein ins Mittelalter. Auch für Jacques Loire ist die Glasmalkunst Berufung. Selbst mit seinen über 80 Jahren ist er noch immer äußerst kreativ im "Atelier Loire". Zusammen mit seinem Vater Gabriel schuf er schon vor Jahrzehnten beeindruckende Glaskunstwerke. So gestalteten beide Anfang der 1960er-Jahre die imposanten blauen Glassteine für den Neubau der Berliner Gedächtniskirche. Aktuell ist Jacques Loire mit der Glasarbeit für eine Krankenpflegeschule im japanischen Osaka beschäftigt. Wir verfolgen die einzelnen Arbeitsschritte bis das Gesamtkunstwerk schließlich in voller Schönheit erstrahlt.  DE 2011'
- eventId: 1020238
  start: 2026-10-26T14:15:00Z
