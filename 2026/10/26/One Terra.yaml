  title: Planet Weltweit - Harris Tweed - Rückkehr einer Legende
  subtitle: Planet Weltweit - Harris Tweed - Rückkehr einer Legende
  description: Auf den Hebriden, vor der Nordwestküste Schottlands, ist das Wetter ist rau, die Landschaft schroff. Die Menschen sind widerstandsfähig, auch dank ihrer besonderen Kleidung. Inspiriert von den Farben der Landschaft ist Harris Tweed der Aristokrat unter den Tweeds, seit Jahrhunderten auf den Inseln gewebt. Heute erlebt der Stoff ein Comeback, auch dank neuer Kunden wie Nike oder Chanel. Mit Harris Tweed zelebriert man heute einen Lebensstil. 218 Frauen und Männer weben wieder Tweed, ausschließlich in Heimarbeit. Denn das ist die Bedingung für den Erhalt einer Lizenz. GEO Reportage hat die Insel und ihre Weber besucht. Rebecca Hutton ist auf der Suche nach einem neuen Muster. Die Weberin will etwas Neues versuchen, abseits der gängigen Muster, die ihre Landsleute auf den heimischen Webstühlen für die großen Spinnereien der Insel herstellen. Ende des 19. Jahrhunderts wandelte sich der raue Wollstoff, der Landwirte und Fischer vor Nässe und Kälte schützte, zum noblen Tuch der britischen Aristokratie. Bis in die 1960er Jahre herrschte Hochkonjunktur, danach geriet der Stoff in Vergessenheit. Harris Tweed konnte mit Billigtextilien aus Fernost nicht mehr mithalten. Heute steht langlebige und nachhaltige Ware wieder hoch im Kurs. Rebecca Hutton ist deshalb auf ihre Heimatinsel zurückgekehrt. Wie alle Weber arbeitet sie wie vorgeschrieben zuhause. Der Name Harris Tweed ist seit 1993 per Gesetz geschützt. Der Stoff muss aus reiner Schurwolle sein, das Garn darf nur auf den Äußeren Hebriden gesponnen und gefärbt werden. Größter Kunde ist Großbritannien für klassische Sakkos und Interieur Design. Aber auch Japan, hat einen Anteil am Aufschwung von Harris Tweed. Der Einfluss Pariser Modehäuser hat die Popularität zusätzlich enorm gesteigert. Um das Interesse an ihrem Stoff aufrecht zu erhalten, müssen die Weber immer wieder neue Märkte erschließen.  DE 2018
- eventId: 1020200
  start: 2026-10-26T06:15:00Z
  stop: 2026-10-26T07:07:00Z
  title: Planet Weltweit - Der gute Mensch von Karachi
  subtitle: Planet Weltweit - Der gute Mensch von Karachi
  description: "Das normale Leben ist täglich eine Herausforderung in Karachi. Die Hauptstadt Pakistans leidet seit Jahren unter politischen und sozialen Unruhen. Vergessen sind besonders die wirklich Bedürftigen wie Alte, Kranke und Kinder. Sie hätten keine Überlebenschance, gäbe es nicht einen Mann, der sie inmitten von Chaos und Gewalt unterstützt. Seit 65 Jahren versuchen der mittlerweile über 90-jährige Abdul Sattar Edhi und seine Familie, ihren Mitmenschen zu helfen, indem sie andere zu Mitgefühl und Toleranz bewegen. Nicht allen gefällt diese Einstellung. Edhi ist des Öfteren selber bedroht worden. Doch sein Erfolg ist beispielhaft.\nMuslimischer Fundamentalismus, Gewalt, politische Unruhen, dafür ist Pakistan und besonders die Hauptstadt Karachi in den westlichen Medien bekannt. Inmitten des Chaos versucht ein Mann, seine Vision eines gewaltfreien und friedlichen Pakistans zu verwirklichen: Abdul Sattar Edhi ist Kopf und Gründer der größten Hilfsorganisation des Landes. In den letzten 65 Jahren hat er über 50.000 Waisen eine Heimat gegeben, über 20.000 ungewollte Babys gerettet und über 40.000 junge Mädchen zu Krankenschwestern ausbilden können. Selber in Armut lebend, hat er sich nie in den Dienst großer Konzerne oder Organisationen gestellt oder sich von der Politik vereinnahmen lassen. Eine Einstellung, die ihm Kritik und gar öffentliche Drohungen, etwa von Seiten der Taliban einbrachte. Dafür hat Edhi die Bevölkerung Karachis auf seiner Seite, die ihn auf den Straßen um Hilfe bitten sieht. Edhis Prinzip beruht auf gegenseitiger Hilfe und dem Appell an einfache Menschlichkeit in einer Stadt, in der für viele Milde und Barmherzigkeit lange verloren scheinen. Inzwischen ist Edhi über 90 Jahre alt, ebenso seine Frau Bilquis. Beide versuchen ihr Vermächtnis in die Hände ihrer Kinder zu legen. Doch wird das gelingen und die Hilfe weiter funktionieren, wenn die beiden stadtbekannten Symbolfiguren der Barmherzigkeit und Menschenliebe nicht mehr da sind? \n\n DE 2013"
- eventId: 1020201
  start: 2026-10-26T07:15:00Z
  stop: 2026-10-26T08:07:00Z
  title: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  subtitle: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  description: 'Planet Weltweit: Viele Menschen am Amazonas leben in schwer zugänglichen Gebieten, abseits großer Städte ohne jede Infrastruktur und ohne Zugang zu Behörden und Ämtern. Für Recht und Ordnung sorgt ein schwimmendes Gerichtsschiff, welches sechsmal pro Jahr die Flussarme des Amazonas befährt und Streitfälle in den Gemeinden schlichtet. An Bord sind neben einer Richterin und einem Staatsanwalt mehrere Sozialarbeiter. Fast siebzig Mitarbeiter teilen sich während dieser Zeit die wenigen Waschbecken und Hängematten. Eine logistische Herausforderung. Sorgerechtsstreitereien, Unterhaltsforderungen oder kleinere Diebstähle - all das, was in größeren Städten zur täglichen Routine von Gerichten und Ämtern gehört, stellt an den Flussufern des Amazonas eine besondere Herausforderung dar. Denn oft liegen die kleinen Dörfer und Gemeinden an unzugänglichen Uferstellen, an denen nur Schiffe anlanden können. Feste Wege oder gar Straßen gibt es nicht.  Dennoch unterstehen auch jene Ortschaften der brasilianischen Gerichtsbarkeit, und die Menschen haben ein Recht auf Unterstützung bei Amtsfragen und Streitfällen. Sechsmal im Jahr fährt deshalb das Gerichtschiff Joao Bruno für jeweils eine Woche die Regionen ab, um den Menschen in jenen abgelegenen Orten diese Serviceleistung des Staates anzubieten. Höchste Instanz dabei ist eine amtliche Richterin oder ein Richter. Diesmal ist es Laura Costeira. Der 42jährigen ist es ein Anliegen, ihre Dienste den Menschen auch abseits der Städte nahezubringen. Einfach wird die Reise nicht: An Bord gibt es für die insgesamt 70köpfige Reisegemeinschaft gerade einmal vier Waschmöglichkeiten. Die meisten Passagiere schlafen in Hängematten. Eine einzige Köchin ist für die Verpflegung der Mannschaft zuständig. Und dennoch hat sich das Projekt zu einem Erfolgsmodell entwickelt, bei der Mannschaft und den Menschen am Amazonas. So soll es auch diesmal sein. DE 2022'
- eventId: 1020202
  start: 2026-10-26T08:15:00Z
  stop: 2026-10-26T09:07:00Z
  title: Planet Weltweit - Die letzten Walfänger der Beringsee
  subtitle: Planet Weltweit - Die letzten Walfänger der Beringsee
  description: 'Tschukotka ist eine fernab gelegene Region im Nordosten Russlands und kaum von Menschen besiedelt. Zehntausende Grauwale ziehen jedes Jahr im Sommer hier vor der Küste entlang. Ein natürlicher Zyklus, der seit Generationen auch das Leben der Ureinwohner bestimmt - der Tschuktschen. Die Jagd auf Wale ist ihr Leben. Den letzten Tschuktschen ist es von der Internationalen Walfangkommission gestattet worden, pro Jahr etwa 140 Grauwale zu erlegen. GEO Reportage war mit an Bord Tschukotka liegt direkt an der Beringstraße, nur einen Steinwurf entfernt von Alaska. Die Küste hier ist reich an Meeresbewohnern: Fische, Walrosse und Wale. Die Waljagd ist für die Tschukschen immer ein Ereignis. Denn ein Wal ist nicht nur Nahrung. Er steht auch für die Identifikation der Ureinwohner als Volk. Für die Tschuktschen ist die Jagd eine uralte Tradition. Nur durch die Wale wurde diese Küste seit Jahrtausenden zu ihrer Heimat. Heute versuchen die Tschuktschen, ihre Identität bewusst zu erhalten. Auch deshalb ist es den Älteren wichtig, der jeweils jüngeren Generation die Tradition des Walfangs beizubringen. Jetzt überträgt Tvol, ein erfahrener Jäger, sein Wissen an den 13-jährigen Rustam. Alle hier glauben, dass die Zukunft ihres Volkes von der Richtung abhängt, die der jungen Generation vorgegeben ist. Neben dem Fang der Wale gehört dazu auch die Kultur. Und die wird besonders am offiziellen Festtag in Tschukotka, dem "Tag des Walfangs", großgeschrieben. Alle beteiligen sich emsig an den Vorbereitungen. Wenn nur das Wetter mitspielt.  DE 2019'
- eventId: 1020208
  start: 2026-10-26T09:15:00Z
  stop: 2026-10-26T10:07:00Z
  title: Planet Weltweit - Neuseelands Lauf der Extreme
  subtitle: Planet Weltweit - Neuseelands Lauf der Extreme
  description: Eine Maori-Legende bestimmt die Strecke des Ultra-Marathons. Sie erzählt von einem Jungen, der mit seinem Volk an der neuseeländischen Küste lebte. Eines Tages bat ihn seine Mutter, Süßkartoffeln für das Essen zu suchen. Statt welche auszugraben, beschloss er jedoch, sie von einem Nachbarstamm zu stehlen. Sein langer Weg den Strand entlang wird noch heute nachgelaufen - beim berühmtesten Marathon Neuseelands. Der 90-Mile-Beach im Norden Neuseelands gilt als einer der längsten Strände der Welt. Seine genaue Länge weiß keiner, die namensgebenden 90 Meilen gelten eher als Schätzung. Dennoch ist es ein Ort für Rekorde und Rekordjäger. Einmal im Jahr findet hier der Ultra-Marathon statt, bei dem die Läufer eine Strecke von 63 Kilometern zu bewältigen haben. Die älteste und zugleich erfolgreichste Läuferin ist Lilac Flay. Die 55-jährige hat den Lauf schon mehrfach gewonnen und möchte auch diesmal ganz vorn mit dabei sein. Und das, obwohl ihr seit Tagen ihr Knie zu schaffen macht. Symbolisch geben die Teilnehmer mit dem Lauf einst gestohlene Kartoffeln zurück, die ein Maori- Stamm einem anderen vor vielen Jahren stahl. Doch nicht alle Nachkommen der einst Geschädigten sind bereit, diese Geste anzuerkennen. Rueben Porter betrachtet das jährliche Spektakel eher als Störung der geheiligten Stätten und unternimmt alles, um den Lauf zu verhindern. Nach dem Glauben der Ureinwohner wandern die Seelen nach dem Ableben der Menschen den Strand hinunter, um sich an dessen Nordspitze von den Klippen zu stürzen. Offiziell sieht Rueben Porter sich als Verfechter der Maori-Rechte. Da aber viele Veranstalter des Laufs, wie etwa die Organisatorin Frances Piacun, ebenfalls Maoris sind, offenbart sich in diesem Konflikt die tiefe Zerrissenheit der einstigen Ureinwohner, die zwischen Tradition und Moderne, Zukunftsdenken und Vergangenheitsbewältigung schwanken. DE 2009
- eventId: 1020209
  start: 2026-10-26T10:15:00Z
  stop: 2026-10-26T11:07:00Z
  title: Planet Weltweit - Spanien, die Tradition der Menschentürme
  subtitle: Planet Weltweit - Spanien, die Tradition der Menschentürme
  description: 'Das Errichten haushoher Menschentürme, der Castells, ist in Katalonien zugleich sportlicher Wettkampf und tollkühne Tradition. Besonders halsbrecherisch geht es beim großen Wettkampf der Menschentürme in Tarragona zu. Dann dreht sich alles um die Frage: Welche Stadt baut den höchsten Turm? Die Castells erleben in Katalonien goldene Zeiten. Knapp hundert Teams, die Menschentürme errichten - so genannte Collas Castelleras - gibt es dort mittlerweile. Auch unter Jugendlichen haben die traditionsverbundenen Vereine starken Zulauf - die Rückbesinnung auf katalanische Kultur und Tradition steht hoch im Kurs in dieser nach mehr Autonomie strebenden Provinz im Nordosten Spaniens. Alle zwei Jahre treffen Anfang Oktober die zwölf besten Collas Castelleras in Tarragona aufeinander. Gewinnen wird dasjenige Team, das die höchsten und schwierigsten Formationen schafft. Diese Reportage war mit Vorort. Oft lassen sich die mehrere hundert Mitglieder starken Teams zu halsbrecherischen Höchstleistungen hinreißen. Eine besonders wichtige Rolle beim Errichten der bis zu zwölf Meter hohen Castells kommt den beteiligten Kindern zu: Erst wenn sie bis zur Spitze klettern und den Turm krönen, gilt er als Erfolg. Eine von ihnen ist Sofía. Die siebenjährige Katalanin zählt zu den besten Kindern ihres Teams, der Colla Vella Xiquets de Valls. Drei Mal pro Woche trainiert Sofía in der unweit von Tarragona gelegenen Kleinstadt Valls mit den anderen Kindern das Besteigen der Menschentürme. Besonders leichtgewichtige und akrobatische Mädchen übernehmen den riskanten Job - jede unkontrollierte Bewegung kann das Gleichgewicht stören und den Turm zum Einsturz bringen. In dieser Saison trainieren Sofía und die Turmbauer aus Valls besonders hart. Denn die Colla Vella, die älteste Colla Kataloniens, möchte nach zehn Jahren, die es auf dem zweiten Rang verbringen musste, dieses Jahr endlich wieder den Titel der besten Colla erringen. DE 2016'
- eventId: 1020220
