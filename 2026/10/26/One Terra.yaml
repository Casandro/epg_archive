  title: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  subtitle: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  description: 'Planet Weltweit: Bergkristall gehört zur Gruppe der Quarze, genauer genommen ist es Quarz in seiner reinsten und transparentesten Form. Nicht überall in den Schweizer Alpen ist der Abbau von Bergkristallen erlaubt, man braucht dafür meist ein "Strahlerpatent". Mineralien- und Kristallsucher werden in der Schweiz "Strahler" genannt. Technische Hilfsmittel sind nicht erlaubt, nur mit Spitzhacke, Hammer, Meißel und einem sogenannten Strahlstock bewaffnet, ziehen die abenteuerlustigen Frauen und Männer hoch in die Berge. Auf Schatzsuche in tiefen Felsspalten und Hohlräumen, den sogenannten Klüften, riskieren manche Kristallsucher ihr Leben, denn Sammler bezahlen für Bergkristalle oft mehrere Tausend Euro. Amateure und Berufsstrahler sind in den Schweizer Alpen unterwegs, aus ganz unterschiedlicher Motivation: Jelena Brkic ist Schmuckdesignerin und hat ihr eigenes Schmucklabel gegründet, außerdem ist es ihr wichtig, ein traditionelles Handwerk ihrer Heimat weiterleben zu lassen. Oder Thomas Steinbrugger, Berufsstrahler und ehemaliger Extremkletterer, der ausschließlich vom Abbau der wertvollen Bergkristalle lebt. In 3500 Metern Höhe schlägt er, zusammen mit seinem Bruder, jeden Sommer sein Basislager auf. Hier oben wird das Steinesuchen zur nicht ganz risikofreien Expedition. Die Veränderung des Klimas ist Fluch und Segen zugleich:  Einerseits legt das Schmelzen der Gletscher neue Klüfte frei, andererseits birgt das Tauen des Eises auch eine erhebliche Gefahr für die Schatzsucher, Unfälle gibt es fast jedes Jahr. Faszination Bergkristall, ob kleinste Kristallsplitter oder große, außergewöhnliche Funde. Nach Millionen von Jahren im Dunkeln, erstrahlen sie das erste Mal im Licht.  DE 2022'
- eventId: 1020242
  start: 2026-10-26T15:15:00Z
  stop: 2026-10-26T16:07:00Z
  title: Planet Weltweit - Mit Volldampf durch Kärnten
  subtitle: Planet Weltweit - Mit Volldampf durch Kärnten
  description: 'Es ist immer wieder eine ganz besondere Zeitreise, wenn eine 100 Jahre alte Dampflok durch romantische Alpentäler schnauft:  In Kärnten, Österreichs südlichstem Bundesland, gibt es ein gigantisches Technikmuseum, in dem hunderte historische Fahrzeuge wie Lokomotiven, Straßenbahnen, Busse und sogar ganze Schiffe gewartet und betrieben werden. Neben dem Museum unterhält der Verein "Nostalgiebahnen in Kärnten" auch diverse Werkstätten. Ohne Ehrenamt ginge hier nichts. In ihrer Freizeit restaurieren technikbegeisterte Männer und Frauen dort die tonnenschweren und imposanten Relikte vergangener Zeiten, und das schon seit über 30 Jahren. Sie geben alles, damit ihre Nostalgiegefährte auch rechtzeitig zur Saison startklar sind. Es ist der Leidenschaft und dem unermüdlichen Einsatz der Mitglieder des Vereins zu verdanken, dass diese technischen Kulturgüter der Nachwelt erhalten geblieben sind. Jedes Jahr im Frühling geht die Saisonvorbereitung wieder los. Unzählige Arbeitsstunden investieren die insgesamt knapp 100 Enthusiasten dann wieder, darunter Väter mit ihren Söhnen zum Beispiel oder auch Paare, die sich dieser ungewöhnlichen Leidenschaft gemeinsam verschrieben haben. Hans-Georg Prix ist Gründungsmitglied des Museums, auch ihm ist es zu verdanken, dass heute bis zu 4000 Exponate, darunter historische Feuerwehrwagen, alte Polizeibusse oder eben sogar ganze Züge wieder der Öffentlichkeit gezeigt und auf zum Teil eigens dafür geschaffenen Strecken gefahren werden können. Der schönste Lohn für ihn und seine Mitstreiterinnen und Mitstreiter aber ist das Strahlen in den Gesichtern der Fahrgäste, wenn sie mit Volldampf durch ihr romantisches Kärnten reisen. DE 2020'
- eventId: 1020243
  start: 2026-10-26T16:15:00Z
  stop: 2026-10-26T17:07:00Z
  title: Planet Weltweit - Maine - Hummer oder Wale?
  subtitle: Planet Weltweit - Maine - Hummer oder Wale?
  description: 'Planet Weltweit: Der US-Bundesstaat Maine ist für die einen Urlaubsparadies, für andere traditionsreiche Heimat und hart umkämpfte Einnahmequelle. Seit Jahrhunderten werden hier Hummer gefischt, eine weltbekannte Delikatesse und Markenzeichen des Bundesstaates im Nordosten der USA. Doch die Hummer-Fischerei in Maine steht vor dem Aus.  Zum einen erwärmt sich der Golf von Maine viel schneller als der Rest der Weltmeere. Das hat Einfluss auf die Hummer, denn sie ziehen nun weiter gen Norden, in kältere Gewässer. Zum anderen ist der Golf von Maine auch der Lebensraum vieler Wale. Die großen Meeressäuger verfangen sich mitunter in den Seilen der Hummerfallen, manche gehen qualvoll zu Grunde. Besonders die Glattwale sind vom Aussterben bedroht. So hat die US-amerikanische Regierung den Hummer-Fischern viele Restriktionen verordnet. Den Fischern stellt sich nun die Frage: Aufhören oder mitwandern? Auf eine andere Einnahmequelle setzen? Andere Fallen einsetzen? Der Film begleitet die 25-jährigen Hummerfischerin Emma Fernald sowie ihren Onkel Danny. Während Danny sich bald zur Ruhe setzen wird, steht die junge Berufseinsteigerin Emma gerade erst am Anfang. Aber sie hat sich bereits nach Alternativen zur Hummerfischerei umgeschaut. Auf dem Campus der Privatuniversität College of the Atlantic bei Bar Harbor, einem der Hotspots des Hummertourismus und wenige Kilometer von der kleinen Insel Little Cranberry entfernt, untersucht derweil der Biologe und Ozeanograph Sean Todd gemeinsam mit seinen Studenten die Verhaltensweisen der Wale sowie die Auswirkungen des Klimawandels und der Fischerei auf die Tiere. Sein Kollege, der Naturschützer und Biologe Zack Klyver, hat sich seit 35 Jahren den Walen verschrieben und versucht, die verunsicherten Fischer von einer neuen Hummerfallen-Technologie zu überzeugen, die ohne Seile auskommt. Wird sich eine Lösung finden, die die Wale schützt und gleichzeitig die Hummerfischerei fortbestehen lässt? DE 2022'
- eventId: 1020255
  start: 2026-10-26T17:15:00Z
  stop: 2026-10-26T18:07:00Z
  title: Planet Weltweit - Kushti, Indiens uralter Kampfsport
  subtitle: Planet Weltweit - Kushti, Indiens uralter Kampfsport
  description: 'Nilesh ist Kushti-Kämpfer im indischen Mumbai. Wenn er wie einst die römischen Gladiatoren in den Ring steigt, geht es für ihn und seine Kontrahenten nicht nur um Sieg oder Niederlage, sondern um viel mehr: Er kämpft für ein besseres Leben! GEO Reportage hat die letzten Kushti-Kämpfer von Indien besucht. Kushti ist eine traditionelle indische Form des Ringens, deren Ursprung auf das 5. Jahrhundert zurückgeht. Anders als beim modernen Wrestling wird nicht auf Matten, sondern auf einem speziell zubereiteten Sandboden gekämpft. Die Kushti Kämpfer haben sich einem asketischen Leben verschrieben: täglich mehrere Stunden hartes Training, eine gesunde Ernährung und zudem kein Alkohol, keine Drogen, kein Sex. Ringen hat in Indien einen hohen Stellenwert. Viele Sportler verlassen ihre Heimat und ziehen in die Großstädte in der Hoffnung, sich dort ein besseres Leben aufzubauen. Der indische Staat ist an den disziplinierten und gut durchtrainierten Kushti-Kämpfern interessiert, doch die wenigen Arbeitsplätze sind hart umkämpft. Nur wer bei wichtigen Turnieren Siege vorweisen kann, hat gute Chancen bei der Bewerbung. Für den 31-jährigen Nilesh Madale ist daher jeder Wettkampf ein Schritt in Richtung seines Traumjobs als Polizist. In Kürze findet in seinem Heimatdorf ein wichtiges Turnier statt. Für die Jüngeren ist Nilesh ein Vorbild, denn Kushti, jahrelang beinahe in Vergessenheit geraten und von dem westlichen Ringen auf Matten verdrängt, erlebt eine Wiedergeburt. Das Besondere daran: Auch Frauen öffnen sich langsam diesem Sport, der traditionell Männern vorbehalten war. Ein Beispiel dafür ist Shivani, die Tochter von Nileshs Trainer. Auch sie bereitet sich auf Wettkämpfe vor. Während Shivani jedoch erst am Anfang einer professionellen Karriere steht, zählt für Nilesh jeder Tag und jeder Sieg. Mit 31 Jahren muss sich sein jahrelanges Training langsam auszahlen und sollte in einem Job bei der Polizei enden.  DE 2018'
- eventId: 1020256
  start: 2026-10-26T18:15:00Z
  stop: 2026-10-26T19:07:00Z
  title: Planet Weltweit - Peloponnes - Die Pioniere des Waldgartens
  subtitle: Planet Weltweit - Peloponnes - Die Pioniere des Waldgartens
  description: 'Planet Weltweit: Im Süden Griechenlands wachen die Gipfel des Peloponnes über einen Alltag, der nach wie vor hauptsächlich von der Landwirtschaft geprägt ist. Mit der Rückkehr der jungen Generation auf das Land ihrer Familien keimt Hoffnung: Permakultur und Agroforstwirtschaft sollen das in der Vergangenheit durch Monokulturen und Brände ausgelaugte Land zu neuem Leben erwecken. Inmitten der traditionell durch Monokulturen geprägten Ebenen des Peloponnes gibt es eine wahre Oase der Biodiversität. Möglich gemacht wurde das von Sheila Darmos, einer jungen Deutsch-Griechin. Sheila hat den Hof ihres Vaters Stavros übernommen, der als Bio-Pionier Griechenlands gilt: "Alle Pflanzen und Bäume wachsen auf mehreren Ebenen, wie in einem Wald. In diesem Waldgarten entscheiden wir selbst, welche Früchte die einzelnen Ebenen einnehmen und welche Art von Ernte wir haben möchten. Wir nutzen fast die gesamte Fläche, nicht nur über die gesamte Breite, sondern auch in die Höhe. Und erreichen dadurch mehr Biodiversität", sagt die gelernte Soziologin, die lange in Deutschland gelebt hat. Mit ihrer Organisation Southern Lights steht sie einheimischen jungen Bauern beim Wiederaufbau ihrer ausgelaugten Felder finanziell und beratend zur Seite, um dieses Modell in ganz Griechenland zu verbreiten. Unterstützt wird sie von Familie und Freunden, hochmotiviert und kämpferisch folgen ihr viele junge Landwirte, die nach folgenschweren Krisenjahren in Griechenland, die Höfe ihrer Eltern übernehmen und Neues schaffen wollen. DE 2022'
- eventId: 1020257
  start: 2026-10-26T19:15:00Z
  stop: 2026-10-26T20:07:00Z
  title: Planet Weltweit - Indien - Kampf den Scharlatanen
  subtitle: Planet Weltweit - Indien - Kampf den Scharlatanen
  description: 'Planet Weltweit: Indien, das Land der Spiritualität. Heiler und Gurus, sogenannte Babas, tausende im ganzen Land und einige berühmt und reich, berufen sich auf höhere Mächte. Doch es gibt Widerstand gegen den gefährlichen Aberglauben und die Geschäftemacherei mit der oft verzweifelten Hoffnung auf Gesundheit. Die Rationalisten haben sich zusammengeschlossen, mit ihrem Science-Van touren sie durch das Land und klären auf. Rationalisten glauben nicht an Götter und Geister, sondern an Vernunft und Wissenschaft. Die Organisation hat fast zehntausend Mitglieder, sie machen ehrenamtlich mit, sind aufgeklärt und arbeiten als Anwälte, Lehrer, Handwerker oder Hochschulprofessoren. Von harmlosen Trickbetrügereien bis zu schweren seelischen Misshandlungen und ruinöser Abhängigkeit reicht das Spektrum der Opfer. Frauen sind durch ihre untergeordnete Position in der Familie und im gesellschaftlichen Leben oft willfährige Opfer, mangelnde Bildung ist fast immer der Grund dafür, dass die Menschen den Gurus blind vertrauen. Parvin Sherka ist eines der Baba-Opfer. Der Ingenieur litt unter schwerem Rheuma. Mit Hilfe von Ärzten wurde er zwar gesund, hatte aber große Angst, dass das Rheuma zurückkehren würde. Hilfesuchend wandte er sich an einen Wunderheiler und blieb sechs Jahre lang in seinen Fängen. Die Anhänger des Babas "opferten" Autos, Smartphones, Bargeld.. Parvin Sherka vermachte dem Baba seine gesamten Ersparnisse. Hilfe fand er bei der Anwältin Tubki Patil und einer Psychologin. Die Organisation der Rationalisten hatte es in jahrelanger Lobbyarbeit geschafft, dass in Indien ein einzigartiges Gesetz erlassen wurde, das "Schwarze-Magie-Gesetz". Demzufolge können Heilsversprechen mit Verweis auf höhere Mächte strafrechtlich von der Justiz als Betrug geahndet werden. Die Rationalistin und Anwältin kämpft, zusammen mit vielen tausend anderen Rationalisten in Indien, gegen den Missbrauch von Hilfesuchenden durch Aberglauben und überkommene Traditionen. DE 2022'
- eventId: 1020259
  start: 2026-10-26T20:15:00Z
  stop: 2026-10-26T21:07:00Z
  title: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  subtitle: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  description: 'Planet Weltweit: "Las Fallas de Valencia" sind eine Mischung aus Frühlingsfest und Karneval. Sie verwandeln die spanische Stadt jedes Jahr in einen Party-Hotspot. Künstler wie Mario Gual del Olmo stecken viel Zeit und Kreativität in ihre riesigen Straßen-Skulpturen, die allerdings nicht sehr langlebig sein werden: Im März gehen sie traditionell in Flammen auf. Eine ganze Woche lang wird gefeiert, begleitet von Spielmannszügen, Fanfaren, Böllern und viel Feuerwerk. Die Ursprünge reichen zurück bis ins Mittelalter. Damals verbrannten die Zimmerleute am 19. März, dem Gedenktag ihres Schutzheiligen Joseph, alle Werkstatt-Reste auf den Straßen. "Fallas", übersetzt "Fehler" oder "Misserfolge", nannten sie diese Überreste erledigter oder misslungener Arbeiten und trieben mit dem Feuer den Winter aus. Später begann man, die Holzreste mit Puppen, den sogenannten "ninots", zu schmücken und zu bemalen.  Mario Gual del Olmo und andere "Artistas Falleros" arbeiten das ganze Jahr an ihren Werken. Die Vorbereitungen für das kommende Spektakel beginnen bereits im Frühling. Bunte Zeichnungen sollen den Auftraggebern die neuen Ideen schmackhaft machen. Das sind Fallas-Vereine, von denen es Dutzende in jedem Stadtviertel gibt. Rund 400 solcher Vereine gibt es derzeit, die alle eine bis zu 15 m hohe, große Falla und eine kleinere Kinder-Falla bauen lassen. Rund 120 Künstler, vor allem Designer, Zimmerleute, Bildhauer und Maler sowie deren Mitarbeiter leben davon. Die meisten haben ihre Werkstätten in der "Ciudad Fallera", einem eigenen Stadtviertel nur für dieses Handwerk. Hier entstehen jährlich fast 780 Kreationen im Gesamtwert von knapp acht Millionen Euro, nach Größe und Budget in Sektionen unterteilt. Lediglich eine "ninot indultat", eine "begnadigte Puppe", die vom Publikum gewählt wird, entgeht dem Verbrennen und wandert ins Museum. "Las Fallas de Valencia" - alle Jahre wieder eine spektakuläre, feurige Fiesta. DE 2022'
- eventId: 1020265
  start: 2026-10-26T21:15:00Z
  stop: 2026-10-26T22:07:00Z
  title: Planet Weltweit - Marquesas-Inseln Das Comeback der Tattoos
  subtitle: Planet Weltweit - Marquesas-Inseln Das Comeback der Tattoos
  description: 'Planet Weltweit: Die Marquesas-Inseln mitten im Pazifischen Ozean. Tätowierungen am ganzen Körper waren hier lange Zeit ganz normal, bis Kolonialherren und Kirche solche Bräuche streng untersagten. Das alte Wissen geriet in Vergessenheit. Doch die Kultur erlebt jetzt ihr Comeback. Tattoos gehören in dem französischen Überseegebiet nun wieder auf alle Körperteile, auch ins Gesicht. Heretu Tetahiotupa und Teiki Huukena sind die Pioniere der neuen Tattoo-Bewegung auf den Marquesas-Inseln. Sie haben eine Tätowier-Schule ins Leben gerufen, in der das alte Wissen über die originalen Marquesas-Motive vermittelt wird.  Die Bedeutung der alten Tattoo-Zeichen ist fast komplett verloren gegangen. Auf Nuku Huva, der nördlichen Hauptinsel des Archipels, durchstreifen Heretu und Teiki die Waldgebiete. Hier verbergen sich Hinterlassenschaften ihrer Vorfahren und Hinweise zu ursprünglichen Tattoo-Motiven. Das früher nahezu komplett isolierte Insel-Volk auf den Marquesas entwickelte eine eigene Sprache und einzigartige Zeichensymbole. Die wurden als Tattoos unter die Haut gestochen und in Felsen geritzt. So haben einige Symbole die Jahrhunderte überdauert. Schätzungsweise seit dem 4. Jahrhundert wurde der Archipel von Seefahrern aus Westpolynesien besiedelt. Politisch und wirtschaftlich sind die Marquesas heute fest an Frankeich und Europa angebunden. Einst aber regierte hier ein recht kriegerisches Südsee-Volk, das Kannibalismus praktizierte und Menschenopfer darbrachte. Und: damals ließ man sich jeden Teil des Körpers tätowieren. Die Menschenopfer wünscht sich heute niemand zurück. Die Tätowierungen aber schon. Heretu gehört zur Avantgarde der Tattoo-Bewegung. Er hat sich sogar schon ein großes Tattoo ins Gesicht stechen lassen, wie einst die Vorfahren. Haben die martialisch anmutenden Tätowierungen eine Zukunft in der modernen Welt der Marquesas-Inseln? DE 2022'
- eventId: 1020266
  start: 2026-10-26T22:15:00Z
  stop: 2026-10-26T23:07:00Z
  title: Planet Weltweit - Sulawesi - die letzten Seenomaden
  subtitle: Planet Weltweit - Sulawesi - die letzten Seenomaden
  description: 'Die Bajau sind Seenomaden. Seit mehr als drei Jahrhunderten durchstreift das Volk als Fischer, Jäger und Sammler die Meere zwischen Indonesien, Malaysia und den Philippinen, ihre Heimat ist ihr Holzboot. Mittlerweile jedoch praktizieren die meisten Bajau ihr Nomadentum nur noch zeitweise, die Regierung Indonesiens drängt darauf, das Volk sesshaft zu machen. Wie lange noch werden sie ihre angestammte Kultur bewahren?  Den größten Teil des Jahres leben die Bajau schon heute fest an einem Ort in Stelzenhäusern. Bis der Ruf der See oder das Knurren der Mägen zu laut wird. Dann ziehen die Familien wieder mit ihren Booten und Harpunen hinaus aufs Meer. Hauptsächlich ernähren sie sich von dem, was die Natur ihnen bietet: Fisch und Meeresfrüchte. Sie verkaufen aber auch Muscheln, Seegurken und Trockenfisch. Ima und Musir rüsten ihr Boot für eine mehrtägige Fahrt. "Auf Pongkat gehen" nennen sie es, wenn sie ihr Stelzendorf für einige Tage hinter sich lassen und mit den türkis schimmernden Küstengewässern der einsamen Nachbarinseln austauschen. Dort leben sie tagelang auf dem Boot, genau wie ihre Vorfahren. Planet war mit an Bord. Das Dorf Kabalutan liegt im Norden Sulawesis auf den Togian-Inseln. Rund 3000 Bajau sind hier zuhause. "Feste Boote" nennen sie ihre Häuser, die sie auf Pfählen im Meer errichten. Die Bajau fühlen sich an Land nicht wohl. Das Stelzendorf ist der Kompromiss, ihre Antwort auf das Drängen der indonesischen Regierung, alle Bürger sesshaft zu machen und den Kindern eine Ausbildung zu ermöglichen. Zum Glück braucht ein Bajau nur wenige Handgriffe, um sein Boote klar für die Pongkat-Fahrt zu machen. Dann geht"s hinaus in die Inselwelt des Togian-Archipels, direkt am Äquator. Die Heimatregion der Bajau liegt im sogenannten Korallendreieck. Das Meer ist hier flach und extrem artenreich. DE 2013'
