  description: |-
    Die Isla del Coco liegt mitten im Pazifischen Ozean. Rund 500 Kilometer sind es von der entlegenen Insel bis nach Costa Rica, an die nächstgelegene Küste. Früher sollen Piraten auf der Insel ihre Goldschätze versteckt haben, heute ist die Natur der größte Schatz. Viele Hai-Arten tummeln sich rund um das Eiland. Die Meeres-Biologen Ilena und Andrès tauchen zu den imposanten Raubfischen ab, um sie besser erforschen zu können. Sie wollen die Haie mit Sendern markieren und unter Wasser Empfänger installieren.
     DE 2011
- eventId: 1020192
  start: 2026-10-26T05:25:00Z
