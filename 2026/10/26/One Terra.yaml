- eventId: 1020145
  start: 2026-10-26T00:15:00Z
  stop: 2026-10-26T01:07:00Z
  title: Planet Weltweit - Thailands Elefanten - raus aus der Stadt!
  subtitle: Planet Weltweit - Thailands Elefanten - raus aus der Stadt!
  description: 'Über Jahrzehnte gehörten sie in Thailand zum Straßenbild: "Mahouts", die Elefantenführer. Tausende zogen mit ihren Arbeitselefanten durch die Straßen der großen Städte, ließen sich für Futtergeld fotografieren und lebten sozusagen vom Rüssel in den Mund. Doch die Dickhäuter waren ein Sicherheitsrisiko, fast täglich gab es Unfälle, außerdem liefen Umweltschützer Sturm gegen die wenig tiergerechte Haltung und Nutzung. Doch wohin verschwinden all diese Tiere, wenn sie aus den Städten verbannt werden? Einst arbeiteten viertausend Elefanten und ihre Mahouts in der Forstwirtschaft Thailands. Nur sie schafften es, die gefällten Urwaldriesen zur nächsten Straße zu bringen. Doch seit die Regierung den Kahlschlag der Wälder Ende der 1980er Jahre gestoppt hat, sind sie arbeitslos. Immer mehr Elefantenführer zogen in die großen Städte. Seit vier Jahren aber versucht die Regierung, die Elefanten aus den Straßen zu verbannen, da sie ein Sicherheitsrisiko für den Straßenverkehr darstellen. Auch Non Yamdee lebt mit seiner 35 Jahre alten Elefantendame Poon Thap in den Außenbezirken von Bangkok. Doch er will nicht warten, bis er von der Polizei erwischt und umgesiedelt wird. Er hat von einem neuen Elefantencamp im Süden gehört, das zwei Dutzend Mahouts und ihren Tieren eine neue Existenz offeriert. Dort will er hin. Wir durften ihn und seine Elefantenlady auf ihrem abenteuerlichen Weg begleiten. Wie legt man mit einem Dickhäuter fast 300 km zurück? Und wie kann Mahout Non die viereinhalb Tonnen schwere Lady während ihrer Reise versorgen? Schließlich braucht ein Elefant rund 40 Liter Wasser und 200 kg Grünfutter pro Tag. Non überredet einen befreundeten LKW-Fahrer, ihn und Poon Thap ein gutes Stück mitzunehmen. Über Nebenstraßen geht es rund 100 km nach Süden, immer in der Angst vor der Polizei, denn für solche Transporte braucht man eigentlich eine Sondergenehmigung. DE 2013'
- eventId: 1020162
  start: 2026-10-26T01:15:00Z
  stop: 2026-10-26T02:07:00Z
  title: Planet Weltweit - Basketball - Die kleinen Barfußspieler von Mexiko
  subtitle: Planet Weltweit - Basketball - Die kleinen Barfußspieler von Mexiko
  description: Barfuß laufen sie um Anerkennung, kämpfen für Pokale und den Traum auf eine bessere Zukunft. Die Kinder der Triquis, einer indigenen Volksgruppe im Hochland Mexikos, zählen zu den besten Basketballspielern weltweit. Nicht mit ihrer Körpergröße, sondern mit ihrer Willenskraft brechen sie Rekorde. Weltrekorde! Missionare machten vor knapp 50 Jahren Basketball bei den Triquis im Bundesstaat Oaxaca populär. Aus Mangel an Freiflächen in den Kiefernwäldern des Hochlands kam Fußball nicht in Frage. Jedes Kind wächst dort heute mit diesem Sport auf, Jungen wie Mädchen. Deysi Martinez ist ein Ausnahmetalent. Dank ihres Talents und ihrer guten Noten geht sie seit anderthalb Jahren auf ein Sportinternat in der Hauptstadt Oaxaca. Deysi dribbelt den Ball im Slalom über den Betonboden, von vorne kommt Angriff, die Dreizehnjährige hat keine Zeit zum Überlegen, wie ein Pfeil schießt sie nach oben, wirft den Ball in den Korb und landet mit einem dumpfen Geräusch. Deysi gehört zu besten Basketball-Spielerinnen Mexikos, zumindest in ihrer Altersgruppe. Sie ist kleiner als ihre Konkurrenten in anderen Regionen und spielt meist barfuß, wie alle Triquis, eine kleine indigene Minderheit im Südwesten Mexikos. Etwa 38.000 von ihnen gibt es noch, ein Drittel der Erwachsenen sind in die Vereinigen Staaten ausgewandert, die meisten illegal. Zurück geblieben sind Alte, Frauen und Kinder. Auch Deysis Vater lebt seit rund drei Jahren in Washington, wo er als Erntehelfer arbeitet, für weniger als den Mindestlohn. Er war selbst Kapitän einer Basketballmannschaft. Die Tochter hat sein Talent geerbt. Das hat auch Sergio Ramirez Zuñiga erkannt. Der Trainer hat den Casa Club gegründet, eine Sportakademie, in der Triqui-Kinder gefördert werden. Die harte Schule des Trainers hat zu ersten Erfolgen geführt. Einige der jungen Spieler haben Stipendien, Sprachkurse mit Bildungsreisen, in Amerika und Europa erhalten. Auch Deysi hat diesen Traum. DE 2015
- eventId: 1020170
  start: 2026-10-26T02:15:00Z
  stop: 2026-10-26T03:07:00Z
  title: Planet Weltweit - Das Koala-Hospital
  subtitle: Planet Weltweit - Das Koala-Hospital
  description: Dank ihrer Knopfaugen, ihres weichen Plüschfells und ihrer tapsigen Bewegungen gehören Koalas zu den beliebtesten Tieren Australiens. Doch obwohl die einst gejagten Beuteltiere mittlerweile unter strengem Schutz stehen, nimmt ihre Zahl weiter ab. Öffentliche und private Einrichtungen kämpfen um den Erhalt der niedlichen Beutelbären.  Ausgetrocknet von der Hitze des Sommers gehen in Australien jedes Jahr tausende Hektar Eukalyptuswald in Flammen auf. Unzählige Tiere, die nicht schnell genug flüchten können, verbrennen. Zu den Opfern zählen immer auch Koalas, die in ihrem Bestand sowieso schon stark gefährdet sind. Neben den Kängurus gehören sie zu den berühmtesten Beuteltieren des Kontinents. Und Feuer ist nicht die einzige Gefahr für die niedlichen Baumbewohner. Engagierte Australier kämpfen mittlerweile um das Leben jedes einzelnen Tieres. In speziellen Kliniken päppeln Tierärzte und freiwillige Helfer kranke Koalas wieder auf und bereiten sie auf ihre Auswilderung vor. Wir haben ein Koalahospital besucht und Menschen getroffen, die mit großem Einsatz das Aussterben der beliebten Beutelbären stoppen wollen.  Koala-Baby Neil lebt seit einigen Wochen bei seinen Pflegeeltern, einem älteren Ehepaar, im Badeort Port Macquarie an der Ostküste Australiens. Das Waisenjunge wurde ohne seine Mutter gefunden und ist etwa neun Monate alt. Es braucht noch viel Zuwendung und täglich seine Milch. Erst nach dem ersten Lebensjahr sind Koalas in der Lage für sich allein zu sorgen. In Port Macquarie steht auch das erste Koala-Hospital Australiens. Ob Brandwunden oder Infektionen - seit dem Jahr 1973 finden hier alle verletzten, kranken oder verwaisten Koalas der Region ein vorübergehendes Zuhause. In den letzten Jahren stieg die Zahl der pflegebedürftigen Tiere stetig an. Nicht nur verheerende, oft von Brandstiftern gelegte Waldbrände vernichten ihren Lebensraum. DE 2013
- eventId: 1020171
  start: 2026-10-26T03:15:00Z
  stop: 2026-10-26T04:07:00Z
  title: Planet Weltweit - Hamburg, die Stadt der Schwäne
  subtitle: Planet Weltweit - Hamburg, die Stadt der Schwäne
  description: 'Hamburg - die stolze Hansestadt im Norden Deutschlands - geprägt von der Elbe und dem Hafen und von der Alster mit ihren berühmten weißen Alsterschwänen. Seit Jahrhunderten sind die majestätischen Vögel eng mit der Tradition Hamburgs verbunden. Zum Schutz der Schwäne gibt es seit über 400 Jahren sogar ein eigenes städtisches Amt: Den Schwanenvater von Hamburg. Bereits seit1674 existiert in der Hansestadt eine behördliche Planstelle zum Schutz der Schwäne der Stadt - die des Schwanenvaters. Sie ist wohl auch die älteste Tierschutzbehörde Europas. Olaf Nieß hat das Amt vor 19 Jahren von seinem Vater Harald übernommen und ist rund ums Jahr mit der Hege und dem Schutz der Tiere beschäftigt. Das Verhältnis der Hamburger zur ihren wilden Stadtschwänen ist innig - werden sie im November eingefangen, gilt das in Hamburg als offizieller Winterbeginn. Und erst, wenn sie im Frühjahr wieder aus dem Winterquartier getrieben werden, beginnt in der Hansestadt der Frühling.  Alle in Hamburg kennen ihn, den hochgewachsenen, charismatischen Endvierziger, der fast täglich mit seinem Boot und dem quirligen Terrier auf Hamburgs Wasserstraßen unterwegs ist: Olaf Nieß ist der sogenannte Schwanenvater von Hamburg, er übernahm das Amt von seinem Vater, der es 46 Jahre lang innehatte. Seit seiner Kindheit ist Olaf Nieß mit der Rettung von Schwänen und anderen Wildtieren beschäftigt - und so wie er das Wasser liebt, liebt er "seine" Schwäne: "Die Legende sagt, solange stolze Schwäne auf der Alster ihre Runden ziehen, ist Hamburg eine freie und wirtschaftlich erfolgreiche Stadt. Ich werde alles dafür tun, dass das so bleibt." Einen Bestand um die 150 Tiere ist in der Stadt aufrecht zu halten - laut jahrhundertealter Gesetzgebung. DE 2014'
