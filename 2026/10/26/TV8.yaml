  title: Т/с "Чужие грехи", 1 и 2 с.
  description: 'Мелодрама. Новая история любви рождается из двух неудавшихся браков. С одной стороны - Наталия. Она страдает в браке, полном оскорблений и унижений. Муж-алкоголик присвоил себе ее состояние и их отношения просто невыносимы. Свекровь мечтает избавиться от невестки и с помощью лучшей подруги Наталии Инесс задумывает и осуществляет коварный план - вынудить Наталию стать беглянкой. С другой стороны - Адриан, который женился, веря в настоящую любовь, но со временем болезненная ревность жены разрушает его представления о браке. Две родственные души встречаются - Наталия и Адриан. Они будут бороться за свою любовь, которая сначала покажется им невозможной. Колумбия-Испания-США, 2007-2008. Режиcсер: Давид Посада. В ролях: Лорена Рохас, Маурисио Ислас, Катрин Сиачоке.'
