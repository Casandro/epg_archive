  title: Deine Frage zählt!
  subtitle: Gespräch
  description: 'Fragen begleiten uns ein Leben lang - sei es zum Glauben, zu unseren Beziehungen, zu Leid und Hoffnung oder einfach zu den Dingen des Alltags. Einige dieser Fragen tragen wir schon seit Jahren in uns, andere tauchen ganz unerwartet auf. Genau hier setzt unsere neue Fernsehsendung "Deine Frage zählt" mit Eva-Maria Admiral an: Sie schafft einen Ort, an dem solche Fragen Gehör finden.Eva-Maria Admiral ist Schauspielerin, Autorin und Dozentin. Aufgrund ihrer persönlichen Lebensgeschichte hat sie neben ihrer Theaterarbeit auch Theologie, Traumatherapie und Neurowissenschaften studiert. Seit vielen Jahren begleitet sie Menschen durch unterschiedlichste Fragen des Lebens und beschäftigt sich mit Themen wie Verletzungen, Heilung, Beziehungen und neuen Perspektiven.In "Deine Frage zählt" nimmt sie sich der eingesandten Fragen an und beantwortet sie mit Herzlichkeit und reicher Lebenserfahrung. Werden auch Sie ein Teil davon! Senden Sie uns Ihre Frage - ganz einfach per Telefon oder E-Mail:E-Mail: deinefragezaehlt@k-tv.orgTelefonnummer für Deutschland: +49 (0) 8385 - 39499933Telefonnummer für Österreich: +43 (0) 512 411035Telefonnummer für die Schweiz: +41 (0) 71 5880 925'
