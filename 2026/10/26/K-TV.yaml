  description: 'GOTT ODER GAR NICHT ist ein Podcast über den christlichen Glauben mit P. Anton Lässer und P. Karl Wallner. Hier gibt es ungeschnittene und ehrliche Gespräche über Glaubensfragen, die Herausforderungen der leidenden Weltkirche und die Zukunft der Kirche bei uns. Dieser Podcast soll euren Glauben vertiefen und Menschen Christus bringen, die den Herrn noch nicht kennen - der Titel ist dabei das Motto: GOTT ODER GAR NICHT.'
