  title: 'Thema: Märtyrer, Glaubenszeugen ... und ich? Hingabe - Der Weg zur Heiligkeit im Alltag (2)'
  subtitle: Spiritualität
  description: 'Pater Dr. Anton Lässer CP, Internationaler Kirchlicher Assistent von KIRCHE IN NOT (ACN)Was macht einen Märtyrer aus? Für Pater Anton Lässer beginnt das Martyrium nicht erst mit dem Tod, sondern mit der Entscheidung, Christus nachzufolgen. An Beispielen aus der Weltkirche zeigt er, wie Menschen ihren Glauben unter schwierigen Bedingungen leben und bezeugen. Im Mittelpunkt steht dabei die christliche Hingabe: die Bereitschaft, sich Gott und den Mitmenschen zu schenken. Ein Vortrag über Jüngerschaft, Heiligkeit und die Frage, wie jeder Christ zum Glaubenszeugen werden kann.'
