  title: Von der satanistischen Metal Band zum katholischen Priester I Dirk Egger CRV I Glaubenszeugnisse
  subtitle: Gespräch
  description: Dirk Egger hat früher Texte einer satanistischen Metal Band übersetzt und heute gehört er zu den katholischen Augustiner Chorherren und ist Priester geworden. Er hat einen intensiven Weg hinter sich und berichtet vom Tiefpunkt seines Lebens, seiner Konversion und seinem Veränderungsprozess.
- eventId: 1021952
  start: 2026-10-26T03:15:00Z
  stop: 2026-10-26T04:15:00Z
  title: Cantate Domino - Konzert mit dem Rasso-Ensemble
  subtitle: Unterhaltung
  description: Das Rasso-Ensemble wurde besteht aus den Sängern Ingrid Eimansberger (Erster Sopran), Anja Völler (Zweiter Sopran), Maria Müller (Alt), Luis Amberger (Tenor), Andreas Heidel (Erster Bass) und Franz Eimansberger (Zweiter Bass). Das Ensemble gab am 15. August 2017 in der Wallfahrtskirche St. Rasso in Gammenried (Bad Wörishofen) ein Konzert. Aufgeführt würden Vokal- und Instrumentalwerke aus mehreren Jahrhunderten. Überschrieben ist das Konzert mit "Cantate Domino' - zu Deutsch "Singt dem Herrn'.
- eventId: 1021953
  start: 2026-10-26T04:15:00Z
  stop: 2026-10-26T04:45:00Z
  title: 'Entschlossenheit und Glaube: die Geschichte von Youssef Azizeh aus Bethlehem'
  subtitle: Dokumentation
  description: 'Die Fragen, die wir uns stellen müssen, sind folgende: Wohin gehen wir? Wie machen wir es? Was wird mit Yousef geschehen? Keiner weiß das. Niemand kann die Zukunft vorhersagen, aber wir wissen, dass wir eine Wahl zu treffen haben: Entweder wir legen unseren Willen im Glauben in die Hände des Herrn, bis wir, wie Yousef von Bethlehem, nach dem Willen des Herrn das Ziel erreichen, oder wir wählen den Weg der Trägheit, der Müdigkeit, der Verzweiflung und des Pessimismus.Yousef entschied sich für die Hoffnung, den Glauben, die Liebe und den Willen des Herrn.'
- eventId: 1021954
  start: 2026-10-26T04:45:00Z
  stop: 2026-10-26T05:00:00Z
  title: Katholisch auf den Punkt I JESUS JA, KIRCHE NEIN! - Braucht es die Kirche wirklich?
  subtitle: Gespräch
  description: '"Jesus ja, Kirche nein''  zum Beten brauche ich doch keine Institution? Diesen Einwand hört man heute überall. Aber stimmt er? In dieser Folge von "Katholisch auf den Punkt'' erklärt Prof. Dr. Christoph Ohly (KHKT Köln), warum Christus und Kirche in der Bibel untrennbar zusammengehören  und warum die Kirche kein Verein von Gleichgesinnten ist, sondern das Werkzeug, durch das Gott auch heute wirkt.Unter anderem geht es um diese Fragen:- Ist die Kirche nur eine spätere menschliche Erfindung?- Was bedeutet "Kirche'' eigentlich  Gebäude oder Gemeinschaft?- Warum eine sichtbare Kirche, wenn Gottes Wirken unsichtbar ist?- Skandale, Verbrechen, Sünder: Wie passt das zur "heiligen'' Kirche?- Brauche ich die Kirche, um gerettet zu werden?- Wie finden Enttäuschte einen neuen Zugang?Mit dem berühmten Wort von Mutter Teresa auf die Frage, was sich in der Kirche ändern muss: "Sie und ich.'''
