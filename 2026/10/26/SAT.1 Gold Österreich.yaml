    Doku-Reihe, USA 2023
    Altersfreigabe: ab 12
  description: Die 16-jährige Britney Ujlaky aus dem kleinen Städtchen Elko in Nevada liebt Pferde, Rodeos und ihre eng verbundene Familie. Doch nach einem Ausflug mit ihrem Vater kehrt sie nicht nach Hause zurück. Während verzweifelte Eltern und Freunde die Gegend absuchen, fahndet die Polizei nach einem unbekannten Cowboy in einem grünen Pickup-Truck. Als bedrohliche Lösegeldforderungen eingehen, gerät der Fall in eine neue und erschreckende Richtung.
