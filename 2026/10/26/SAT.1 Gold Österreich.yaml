  description: Als eine beliebte Jugendliche in East Millinocket, Maine, tot aufgefunden wird, stürzt die Kleinstadt in tiefe Trauer. Fast vier Jahrzehnte bleibt der Mord unaufgeklärt, Spuren verlaufen im Sand, die Polizei tappt im Dunkeln. Doch eine unbeirrbare Mutter und eine Gemeinschaft, die das Opfer nie vergaß, kämpfen unermüdlich weiter - bis schließlich das dunkle Geheimnis ans Licht kommt und der wahre Täter entlarvt wird.
