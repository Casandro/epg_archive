  description: |-
    Unser Verständnis von Gesundheit, Krankheit und Tod ist abhängig von kulturellen Faktoren, von Werten, von unserem sozialen Hintergrund. Daher ist es für medizinisches Personal wichtig, kulturelle Besonderheiten und Differenzen ihrer Patienten zu kennen. Gleichzeitig geht es darum, Patienten losgelöst von Klischees zu betrachten, denn in der Gesundheitsversorgung kann Schubladendenken zu fatalen Missverständnissen führen.

    Wie genau sieht also kultursensible Medizin und Pflege aus und wie kann man kranken Menschen in unserer wertepluralen Gesellschaft gerecht werden?
