  title: Simon Rattle dirigiert Mahlers Zweite
  subtitle: Aus der Elbphilharmonie
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Angeführt von zehn Kontrabässen, zehn Hörnern, zehn Trompeten, zwei Paukensätzen: Der Aufwand für Gustav Mahlers Sinfonie Nr. 2, der "Auferstehungssinfonie", ist gewaltig. Und der Anlass ein besonderer: Das Symphonieorchester und der Chor des Bayerischen Rundfunks zu Gast in der Hamburger Elbphilharmonie. Es dirigiert der Chefdirigent beider Ensembles, Sir Simon Rattle, der auch in Hamburg für eine ungewöhnliche Gegenüberstellung sorgte: Der gleichermaßen monumentalen wie spirituellen Zweiten von Mahler ging ein kurzes Chorwerk von Henry Purcell voraus, gefolgt von Robert Schumanns "Nachtlied" für Chor und Orchester.'
