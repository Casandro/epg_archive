- eventId: 684609
  start: 2026-10-26T00:05:00Z
  stop: 2026-10-26T00:33:00Z
  title: Vertikála - 1. část
  description: 'Francie se zmítá v pouličních nepokojích. Jak na ně reaguje katolická církev? Zeptáme se ve Vertikále. Brazilci rozhodnou ve druhém kole prezidentských voleb. Kampaň nečekaně ovládlo náboženství: spor o patronku země, Pannu Marii Aparecidskou. Dvacet let bojovala se závislostí, dnes Nikola Kovářová pomáhá druhým a přebírá Cenu Charity.'
- eventId: 684610
  start: 2026-10-26T00:33:00Z
  stop: 2026-10-26T01:00:00Z
  title: Vertikála - 2. část
  description: Moderní věda rozšiřuje naše poznání o člověku. Odhaluje více souvislostí těla, mozku, emocí, vztahů i toho, jak nás formuje kultura a společnost. Jak se podle současného poznání mění obraz člověka a jak na to má reagovat křesťanství? Co zůstává v křesťanském pohledu na člověka podstatné a co je třeba nově promýšlet? To je téma debaty Vertikály s katolickou teoložkou Lucií Kolářovou a evangelickým teologem Petrem Gallusem. Moderuje Karolina Antlová.
- eventId: 684611
  start: 2026-10-26T01:00:00Z
  stop: 2026-10-26T01:05:00Z
  title: Zprávy
