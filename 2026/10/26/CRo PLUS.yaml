  title: Vertikála - 1. část
  description: 'Francie se zmítá v pouličních nepokojích. Jak na ně reaguje katolická církev? Zeptáme se ve Vertikále. Brazilci rozhodnou ve druhém kole prezidentských voleb. Kampaň nečekaně ovládlo náboženství: spor o patronku země, Pannu Marii Aparecidskou. Dvacet let bojovala se závislostí, dnes Nikola Kovářová pomáhá druhým a přebírá Cenu Charity.'
- eventId:
