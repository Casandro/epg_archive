  title: Laboratoř
  description: Jak motýli matou predátory? Proč? Za jakých okolností může babočka lépe vidět barvy? Debatují entomologové Robert Tropek a Petr Šípek a student Michal Barták. Moderuje Martina Mašková.
- eventId: 684681
  start: 2026-10-26T03:33:00Z
  stop: 2026-10-26T04:00:00Z
  title: Osobnost Plus
  description: Benjamin Tuček, režisér. "Na příběhu české jednotky na misi v Litvě ukazujeme, jak se během půl roku měnila bezpečnostní situace v Litvě, Evropě i ve světě. Je kronikou eskalace mezinárodního napětí, ve kterém už i u nás v Česku žijeme," říká autor šestidílného seriálu s názvem PROVEDU! CENA ZA SVOBODU. Dá se válka reálně natrénovat? A jak voní mír? Moderuje Světlana Witowská.
