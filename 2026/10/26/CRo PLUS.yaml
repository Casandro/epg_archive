  title: Hlasy paměti
  description: Přátelský člověk, bez předsudkům vždy otevřený diskuzi, ale zároveň tvrdohlavý muž, který si pevně stojí za svými názory - tak popisují přátelé a známí Jana Litomiského. Někdejší disident a mluvčí Charty 77 byl za komunistického režimu vězněn a roky šikanován Státní bezpečností. A právě jeho životní osud připomínají Mikuláš Kroupa a Lucie Korcová.
