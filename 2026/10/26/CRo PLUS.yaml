  start: 2026-10-26T02:05:00Z
  stop: 2026-10-26T02:33:00Z
  title: Leonardo Plus
  description: Stále více lidí se potýká s extrémy v oblasti vztahu k jídlu a tělu - každý 13. trpí nějakou formou poruchy příjmu potravy. Jak spolu souvisí mentální anorexie a obezita? Co je bigorexie, která je na vzestupu. A kudy vede cesta ke svobodnějšímu vztahu s jídlem? Moderuje Renata Kropáčková.
- eventId: 684616
  start: 2026-10-26T02:33:00Z
  stop: 2026-10-26T03:00:00Z
  title: Žárovky
  description: 'Mladí vědci a vědkyně mění svět: Kybernetické útoky - i to musí v dnešní době umět řešit diplomacie. Jak se to dělá prozradí kyber atašé Berta Jarošová.'
