  title: Reportáže zahraničních zpravodajů
  description: Jedenáct písečných kurtů ukrytých pár kroků od Lincolnova památníku stírá rozdíly mezi washingtonskými diplomaty, studenty i úředníky, volejbal se tam hraje jako o život. Mohutní koně brodící se Severním mořem a rybáři, kteří za nimi táhnou sítě plné krevet - staletá tradice lovu ještě přežívá na belgickém pobřeží. Ukrajinští malíři, kolážisti a grafici se svým uměním nepřestali ani poté, co Rusko napadlo jejich zem. Ani ti v Oděse. U Baltu už několik tisíc let dělají střechy z rákosu, ukážeme si nejen, jak taková střecha vypadá, ale taky jak vzniká.
