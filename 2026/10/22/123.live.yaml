  title: Laß jucken, Kumpel
  subtitle: Laß jucken, Kumpel
  description: Die bewährten Typen Jupp und Erwin stellen wieder einmal den Kohlenpott auf den Kopf. Als sie bei einem Kneipenabend auch noch ihre Kriegserlebnisse erzählen, endet das Ganze in einer wilden Rauferei. Zum Leidwesen von Erwin erscheint auch noch die italienische Verwandtschaft von Lucky, der die Tochter des Kantinenwirtes heiraten will. Die Hochzeitsfeierlichkeiten entwickeln sich ganz anders als geplant. Trotz aller Verrücktheit und derben Späßen endet alles mit einem Happy End. Ge 1974
