  description: 'Liedermacher und Kabarettist Christoph Weiherer kommt mit Bitte kommen, brauche Geld nach Trostberg: Am Sa., 24.10., 20 Uhr im Postsaal. Mit Gitarre und niederbayerischem Humor nimmt er den Alltagswahnsinn und gesellschaftliche Absurditäten aufs Korn. Karten im Vorverkauf und an der Abendkasse. +++ Bis Freitag bringen Atlantiktiefs verbreitet Regen und Wind, oberhalb von 1.200 Metern Schnee. Am Mittwoch zieht eine Kaltfront ostwärts, im Osten bleibt es länger trocken. Donnerstag folgen Schauer aus Westen. Am Freitag erreicht den Westen ein Sturmtief mit kräftigem Regen und Böen. +++ PlenumTV am Mittwoch mit Stimmen aus dem bayerischen Landtag'
- eventId: 695409
  start: 2026-10-22T14:30:00Z
  stop: 2026-10-22T14:45:00Z
  title: Süd Leben vom 21.10.2026 (Wh.)
  subtitle: Angela Aux zur Lage der Nation +++ Fucked Up Blues - Angela Aux featuring Maria Moling +++ Transit Art 2026 - Die Künstler und die Wände +++ Sternwarte in Rosenheim und die Beobachtung der Sonne
  description: 'Der Traunsteiner Songwriter und Texter Florian Tobias Kreier alias Angela Aux stellt am 23. Oktober in der Arge Kultur Salzburg sein neues Album vor. Seine Texte kreisen um Deutschland zwischen Nationalgefühl und Zweifel, hohen Mieten, Ungleichheit, Geschichte und der Suche nach Orientierung. +++ Der Chiemgauer Literat, Journalist und Musiker Angela Aux präsentiert am Freitag, 23. Oktober, in Salzburg in der Arge Kultur seine neue Vinyl-Platte. Dazu gibt es seinen Fucked Up Blues live vom Album Wrap Up Your Troubles In Dreams mit Maria Moling am Schlagzeug. +++ Seit 2020 verwandelt Street Art Rosenheim in eine offene Galerie: 40 frei zugängliche Fassadenkunstwerke prägen die Stadt. Initiiert von der Städtischen Galerie, unterstützt von der meine Volksbank Raiffeisenbank. 2026 erweitert Transit Art das Projekt um fünf neue Werke. +++ Sie sitzt auf dem Dach der TH Rosenheim und blickt weit ins All: die Sternwarte. Am Himmel war dieses Jahr einiges los. Wir erinnern uns an die Sonnenfinsternis im Sommer, die in Bayern teilweise zu sehen war.'
- eventId: 695410
  start: 2026-10-22T14:45:00Z
  stop: 2026-10-22T15:00:00Z
  title: Süd Leben vom 21.10.2026 (Wh.)
  subtitle: Im Süd-Leben laden wir ein, stellen vor, zeichnen nach - ein spannendes Kaleidoskop des Lebens bei uns im Süden.
  description: Am Chiemsee spricht Olympiasieger Florian Wellbrock über seinen Weg an die Weltspitze, den Umgang mit Niederlagen und die Emotionen nach Gold in Tokio 2021. Er verrät, was ihn im Training antreibt, und gibt Nachwuchsschwimmern Tipps.
- eventId: 691940
  start: 2026-10-22T15:00:00Z
  stop: 2026-10-22T15:10:00Z
  title: Süd Journal vom 21.10.2026 (Wh.)
  subtitle: Neuer Treffpunkt am Lokschuppen - Rosenheim gestaltet Vorplatz um +++ Mehr Wohnraum in Feldkirchen-Westerham +++ Nachrichten kompakt
  description: 'Rosenheim hat den Vorplatz des Lokschuppens für 3,1 Mio. Euro neu gestaltet: mehr Grün, Sitzplätze, Radstellplätze und ein Wasserspiel auf der historischen Drehscheibe. Die Stadt setzt auf Aufenthaltsqualität und Geschichte; 80 Prozent der förderfähigen Kosten tragen Bund und Freistaat. +++ Feldkirchen-Westerham will knappen Wohnraum durch Nachverdichtung schaffen: Im Gebiet Weidach West soll auf einem bisher nur für Nebenanlagen zulässigen Grundstück ein Wohnhaus entstehen. Dafür wird der Bebauungsplan geändert, der Bauausschuss stimmt zu, das Verfahren läuft. +++ Der Bund fördert Meggles neue Biogasanlage in Reitmehring mit 7,5 Millionen Euro. Sie soll grüne Energie liefern und jährlich 3.000 Tonnen Calciumphosphat zurückgewinnen. Beim Bergfilm-Festival Tegernsee gewann Valentin Rapp den Publikumspreis.'
- eventId: 831065
  start: 2026-10-22T15:10:00Z
  stop: 2026-10-22T15:20:00Z
  title: Süd Journal vom 21.10.2026 (Wh.)
  subtitle: DAV Fazit zur Huettensaison 2026 +++ Warum Parkhäuser in Rosenheim schnell altern +++ Achtung - Wildwechsel in der Region
  description: Die Sommersaison auf den Berghütten endet, vielerorts waren sie laut Deutschem Alpenverein gut ausgelastet. Doch die Hitze belastete auf vielen Hütten die Wasserversorgung. Wie der Sommer in Südostoberbayern lief und was im Winter kommt, erklärt DAV-Sprecher Julian Rohn. +++ Rosenheim reißt das fast 40 Jahre alte Parkhaus P1 am Hammerweg ab und baut für rund 13 Millionen Euro neu. Grund sind starke Belastungen durch Verkehr, Wasser und Streusalz, die Beton und Bewehrung schädigen. Fertigstellung 2029, dann 700 Stellplätze und neue Parkgebühren. +++ Mit der Zeitumstellung wird es abends früher dunkel, der Feierabendverkehr fällt in die Dämmerung. An Wald- und Feldrändern steigt das Risiko für Wildunfälle durch Rehe, Füchse und Hasen. Achtsam fahren, nicht ausweichen, Wildunfälle melden.
