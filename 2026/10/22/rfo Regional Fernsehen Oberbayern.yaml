  start: 2026-10-22T18:00:00Z
  stop: 2026-10-22T18:10:00Z
  title: Süd Journal vom 22.10.2026 (Wh.)
  subtitle: Lokal-TV auf dem Smartphone  +++ Mehr als 350.000 Euro Schaden durch Schockanrufe +++ Polizei-Sporttest für Jugendliche in der Region +++ Spendenaufruf für Bridge 15 in Rosenheim +++ Kaffeemaschine löst Wohnhausbrand aus  ..
  description: 'Lokalfernsehen wird mobiler: Das Lokal-TV-Portal ist nun als App für Smartphone und Tablet verfügbar und bündelt Sender aus ganz Deutschland. Die Erweiterung wird vom 21. bis 23. Oktober bei den Medientagen München vorgestellt. rfo zeigt, wie regionale Inhalte so auch unterwegs erreichbar sind. +++ Schockanrufe setzen vor allem Senioren mit erfundenen Notfällen unter Druck. Das Polizeipräsidium Oberbayern Süd meldet von Juli bis September Schäden von über 400.000 Euro, mehrere Festnahmen und warnt: Nie Geld oder Schmuck an Unbekannte geben, im Zweifel 110 wählen. +++ Das Polizeipräsidium Oberbayern Süd bietet Jugendlichen ab 14 Jahren einen Probe-Sporttest für den Polizeiberuf an. Termine sind am 31. Oktober in Teisendorf und am 7. November in Bad Aibling. Anmeldung online über die Website der Bayerischen Polizei. +++ Das integrative Freizeitsportgelände Bridge15 im Rosenheimer AicherPark steht kurz vor der Fertigstellung und soll Mitte November eröffnen. Das Gemeinschaftsprojekt von Vereinen, Unternehmen, Politik und Stadt braucht für letzte Anschaffungen noch Spenden per GoFundMe. +++ Brand in einem Wohnhaus in der Frauenbachstraße in Chieming: Nachbarn entdeckten Flammen am Fenster und alarmierten die Feuerwehr. Ursache war wohl eine brennende Kaffeemaschine. Rund 40 Kräfte löschten das Feuer schnell, die Küche ist vermutlich zerstört. Schaden: 15.000 Euro. Keine Verletzten. +++ Rosenheims Bibliotheksmobil Lese-Lotte bringt Bücher und Vorlesepaten in Stadtviertel mit wenig Zugang zu Leseangeboten. Die Zukunftsstiftung Ehrenamt Bayern fördert das Projekt mit 15.000 Euro für neue Medien, Material und Entschädigungen.'
- eventId: 691977
  start: 2026-10-22T18:10:00Z
  stop: 2026-10-22T18:20:00Z
  title: Süd Journal vom 22.10.2026 (Wh.)
  subtitle: Bunkerbogen im Mühldorfer Hart - Grünes Licht für neuen Gedenkort +++ Herbstversteigerung im Fundamt Rosenheim +++ Weintrauben mit Bergblick - zu Besuch bei Philipp Baumgärtner am Samerberg
  description: 'Es gibt Grünes Licht für den neuen Gedenkort, dem Bunkerbogen im Mühldorfer Hart  +++ In Rosenheim hat das Fundamt liegengebliebene Gegenstände versteigert, von Fahrrädern bis zu Überraschungsfunden. Vor dem Bieten konnten Interessierte alles prüfen, gekauft wird ohne Garantie auf eigenes Risiko. Für die Stadt lohnt sich der Termin, die nächste Auktion folgt im Frühjahr. +++ Philipp Baumgärtner erfüllt sich am Samerberg den Traum vom eigenen Weinberg: 90 Rebstöcke im oberbayerischen Voralpenland, gepflegt mit 50 bis 60 Arbeitsstunden pro Jahr. Im Magazin Südmenschen erzählt er von Sortenwahl, Herausforderungen und Geschmack.'
- eventId: 691978
  start: 2026-10-22T18:20:00Z
  stop: 2026-10-22T18:30:00Z
  title: Süd Journal vom 22.10.2026 (Wh.)
  subtitle: Lebenswege früher Archäologinnen im ReichenhallMuseum +++ Vereinsgespräch in Freilassing +++ Wetter für das Sendegebiet
  description: 'Schon seit dem späten 18. Jahrhundert prägten Frauen als Altertumskundlerinnen und Archäologinnen ihr Fach, lange vor der Zulassung an Universitäten. Eine Ausstellung im ReichenhallMuseum porträtiert zehn Pionierinnen, darunter die Reichenhallerin Liselotte Mertig. +++ Beim traditionellen Vereinsgespräch im Freilassinger Rathaus blickten Stadt und Vereinsvertreter auf das ablaufende Vereinsjahr zurück und koordinierten Termine für kommende Veranstaltungen. Bürgermeister Markus Hiebl dankte für Engagement und Ehrenamt. +++ Südostoberbayern erwartet ein wechselhaftes Herbstwochenende: Am Samstag wird es um Rosenheim teils freundlich, in Traunstein und besonders im Berchtesgadener Land sind häufiger Schauer möglich. Am Sonntag bleibt es überall unbeständig, ab Wochenbeginn wird es milder bis 18 Grad am Dienstag.'
