  title: WDR 3 Konzert
  subtitle: 'Moderation: Johannes Zink'
  description: "Ein ungewöhnliches Konzertmotto: \"Star-Crossed\" heißt soviel wie \"unter einem unguten Stern\". Alle Werke des Abends erzählen auf ihre Weise von schwieriger und tragischer Liebe an Schauplätzen im Orient, Südamerika oder Europa. Ein Bild inniger Eintracht bietet dagegen das Ensemble Brooklyn Rider selbst, das mit diesem Programm beim stARTfestival in Leverkusen sein 20-jähriges Bestehen feiert.\n<strong>Colin Jacobsen</strong><br/>Beloved, do not let me be discouraged \n<strong>Gabriela Lena Frank</strong><br/>Frida's Dreams (Europäische Erstaufführung) \n<strong>Robert Schumann</strong><br/>Streichquartett a-Moll, op. 41,1\n<strong>Brooklyn Rider</strong><br/><strong>Johnny Gandelsman</strong>, Violine<br/><strong>Colin Jacobsen</strong>, Violine<br/><strong>Nicholas Cords</strong>, Viola<br/><strong>Michael Nicolas</strong>, Cello\nAufnahme vom 18. Juni 2026 aus dem Erholungshaus Leverkusen\nModeration: Johannes Zink<br/>Redaktion: Martin Bürkl"
