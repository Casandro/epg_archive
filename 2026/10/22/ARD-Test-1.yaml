  description: In einer niedergebrannten Strandhütte findet die Polizei die verkohlten Leichen eines Liebespaars. Bei der Toten handelt es sich um die Ehefrau von Peter Adler, einem wohlhabenden Unternehmer aus Ystad. Die verbrannte männliche Leiche ist Martin Rittner - Adlers Nachbar und Geschäftspartner. Wallander bleibt nicht verborgen, dass Adler eine Affäre mit Rittners attraktiver Lebenspartnerin Kim Kristensen hat. Ein Stapel Akten aus dem Wirtschaftsdezernat belegt zudem, dass Adler und Rittner in illegale Geschäfte verwickelt waren, die ihnen aber nie nachgewiesen werden konnten.
