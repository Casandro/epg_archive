  title: Kronprinz Rudolf
  subtitle: Mayerling
  description: |-
    (Fernsehfilm, AUT/DEU/ITA 2006)
    Rudolfs Ehe mit Prinzessin Stephanie von Belgien ist gescheitert. Sein Verhältnis zum Kaiser ist zunehmend angespannt.  Kaiserin Sisi kann ihm nicht helfen.  Premierminister Graf Taaffe isoliert den Thronfolger von allem, was mit Macht und Politik zu tun hat.  Deutschnationale Antisemiten bekämpfen ihn.  Privat äußert er Selbstmordgedanken. Während die politische Lage sich zuspitzt, eröffnet ihm die liebliche aber naive Baronesse Mary Vetsera eine Welt bedingungsloser Liebe.
    Mit Max von Thun (Rudolf), Vittoria Puccini (Mary Vetsera), Klaus Maria Brandauer (Franz-Joseph), Sandra Ceccarelli (Sisi), Birgit Minichmayr (Mizzi), Christian Clavier (Taffee), Omar Sharif (Canon), Julia Cencig (Larisch), Daniela Golpashin (Stephanie), Fritz Karl (Johann), Karl Markovics (Bombelles), Gabriel Barylli (Braganza), Wolfgang Böck (Bratfisch), Nikolaus Paryla (Loschek), Joachim Król (Szeps), Heribert Sasse (Krauss) u.a.
    Drehbuch: Klaus Lintschinger und Didier Decoin
    Regie: Robert Dornhelm
    Koproduktion ORF/ARD/RAI
