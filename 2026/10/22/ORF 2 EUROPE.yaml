  title: Am Schauplatz
  subtitle: Mein Wille geschehe
  description: |-
    - Wenn Vereine per Testament erben
    122 Millionen Euro werden jährlich in Österreich per Testament an gemeinnützige Vereine vererbt - ein neuer Höchststand. Laut Fundraising Verband Austria ist diese Form des Spendens in den vergangenen zehn Jahren um mehr als 120 Prozent gewachsen. Gründe dafür könnten im demografischen Wandel liegen: Immer mehr Menschen bleiben kinderlos. Rund 90 Prozent der Testamentsspenden stammen von alleinstehenden Personen, im Schnitt werden 50.000 bis 100.000 Euro vererbt. Besonders häufig profitieren Tierschutzvereine, aber auch Organisationen aus den Bereichen Gesundheit, Pflege, Soziales sowie Kinder- und Jugendschutz. Die Am Schauplatz-Reportage von Gudrun Kampelmüller begleitet Menschen, die über ihren Tod hinaus Gutes bewirken wollen, und fragt nach ihren Motiven.
  genre:
  - '35'
