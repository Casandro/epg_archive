  subtitle: Emisija "Reč na reč" prvi put je emitovana 2012. godine, u vreme tadašnjih parlamentarnih izbora.
  description: Emisija "Reč na reč" prvi put je emitovana 2012. godine, u vreme tadašnjih parlamentarnih izbora. Debate su omogućile političkim predstavnicima (učesnicima) predstavljanje svojih političkih pozicija javnosti, a glasačima da prikupe sve informacije koje su im bile potrebne za formiranje konačnog izbora, ali i da pozovu javne funkcionere na odgovornost. Od tada, ova emisija se nametnula kao pouzdana platforma za razmatranje problema koji su se pokazali kao najvažniji u datim momentima. Svrha ovih debata jeste da informiše građane o stavovima i strategijama političkih stranaka u Srbiji koje se takmiče na izborima. Na taj način svi birači u Srbiji imaće najbolji mogući uvid u ideje koje politička scena Srbije trenutno pruža. Ovakve debate između kandidata za političke funkcije su sastavni deo demokratskih izbora u velikom broju zemalja, promovišu dijalog na temu javnih pitanja koja su u interesu svih građana i stimulišu političku toleranciju.
