  title: Srpski junaci srednjeg veka
  subtitle: Uz obilje ilustracija kako grafičkih, digitalnih tako i kostimiranih, igranih, videćemo priče o Marku Kraljeviću, caru Dušanu, braći Vukašinu i Uglješi Mrnjavčeviću, knezu Lazaru, Milošu Obiliću.
  description: Igrano-dokumentarna serija "Srpski junaci srednjeg veka" realizovana je po scenariju i u režiji Gordana Matića, a prema ideji glumca i reditelja Radoša Bajića. Ovaj televizijski projekat, kroz deset polučasovnih epizoda gledaocima donosi malo poznate detalje iz srpske srednjovekovne istorije i baštine. Svaka od epizoda pričaće priču o životu i sudbini nekog od najvećih junaka srpskog srednjeg veka. Uz obilje ilustracija kako grafičkih, digitalnih tako i kostimiranih, igranih, videćemo priče o Marku Kraljeviću, caru Dušanu, braći Vukašinu i Uglješi Mrnjavčeviću, knezu Lazaru, Zmaju Ognjenom Vuku, Milošu Obiliću, Vuku Brankoviću, a kroz priče o njima saznati i mnogo toga o političko-ekonomskoj i društvenoj situaciji, kao i svim drugim aspektima života u tadašnjoj Srbiji. U realizaciji serijala učestvovali su eminentni domaći i strani stručnjaci iz oblasti istorije, arheologije, književnosti, etnologije, koji su imali nimalo lak zadatak da na realan način predstave ne samo dobro...
