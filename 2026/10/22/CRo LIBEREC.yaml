  description: 'Téma: Fenomén Zlatý Lev. Ředitelka Grand Hotelu Zlatý Lev Vlasta Špísová. Historik Severočeského muzea, autor knihy Fenomén Zlatý Lev, Lubor Lacina. Grand Hotel Zlatý Lev můžeme podle historika Lubora Laciny považovat za pomyslnou kroniku Liberce. Která období v průběhu 160 let poznamenala a ovlivnila tuto krásnou secesní budovu, které známé i nechvalně známé osobnosti pobývaly v prostorách hotelu, co všechno najdeme v knize, vydanou u příležitosti toho zajímavého výročí, to se dozvíme hodinu před polednem.'
