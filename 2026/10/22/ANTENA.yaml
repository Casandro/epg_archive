    US, 2008
    Reżyseria: Matthew Asner
    Występują: Vincent Bridges, Bruce Bueno de Mesquita, Ethan Bueno De Mesquita, Larry Herbst, David Jeremiah, Danny Penman
    Przez wieki ludzie próbowali przewidzieć przyszłość, używając różnych metod - od kryształowych kul, po układy gwiazd. Dziś, w XXI wieku, ta tradycja łączy się z nauką, co budzi pytanie: kto będzie kolejnym Nostradamusem? Czy przyszłość, która wydaje się nieosiągalna, jest w zasięgu naszej ręki, czekając na odkrycie?
