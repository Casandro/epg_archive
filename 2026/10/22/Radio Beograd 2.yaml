  description: 'Serija polusatnih dokumentarnih reportaža, za čiji je skupni naziv uzeta poznata Sokratova izreka: "Govori da bih te video". Ova originalna produkcija Radio Beograda 2 sjedinjuje kvalitete aktuelnog društvenog angažmana i kultivisane radiofonske obrade. Istrajan rad na složenim dokumentarnim strukturama, koje se drže same od sebe, takoreći bez intervencije naratora, doneo je Dokumentarnom programu, a time i Radio Beogradu, mnoge uspehe na međunarodnim festivalima kreativne radiofonije.'
