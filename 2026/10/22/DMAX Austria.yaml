  title: Goldfieber Down Under
  subtitle: Episode 4
  description: |-
    Gordon versucht, sein Grundstück in Australien zu schützen, indem er den Wald anzündet. Das klingt absurd, ist es aber nicht. Denn kontrollierte Feuer entfernen trockenes Unterholz und nehmen gefährlichen Buschbränden den Treibstoff. Wenn man die Flammen zielgerichtet einsetzt, erfüllen sie einen sinnvollen Zweck. Und James bewegt mit seinem Team in Queensland enorme Mengen an Gestein - täglich bis zu 100 Tonnen. Bei der Aufbereitung des Materials kommt gelegentlich auch ein Vorschlaghammer zum Einsatz, denn durch das Raster der Steinmühle passen nur faustgroße Brocken.
    DEU 2026
