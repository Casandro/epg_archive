- eventId: 959339
  start: 2026-10-22T08:10:00Z
  stop: 2026-10-22T08:30:00Z
  title: Náš host
  description: Tento čtvrtek po 10. hodině se můžete těšit na rozhovor s Danielem Pfefferem, manažerem a hráčem extraligového klubu VK ČEZ Karlovarsko. V dopoledním vysílání rádia vašeho kraje prozradí, jak si hráči odpočinuli a jak probíhala letní příprava včetně herního kempu na Sardinii. Volejbaloví fanoušci se dozví, jak se tým poučil z minulé sezóny a jak do kabiny zapadly nové zahraniční posily. Chybět nebude ani vize, se kterou do ligy obmněněný kádr vstupuje a jak se všichni těší na sobotní start extraligy. Nalaďte si nás ve čtvrtek po 10:00
