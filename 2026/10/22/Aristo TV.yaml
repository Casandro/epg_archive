  title: ANIXE auf Reisen - Nagasaki Teil 4
  description: Es ist weithin unbekannt, dass die japanischen Goto-Inseln über 200 Jahre lang der Zufluchtsort für verfolgte Christen gewesen ist. Daher sind dort auch viele Kirchen zu sehen, die an diese Zeit erinnern. Der Schauspieler Oliver Hörner geht dort auf Exkursion, zu Fuß und mit dem Fahrrad. Der Besuch bei einem Fischer zeigt auch, dass das traditionelle Leben der Einwohner nicht immer einfach war. Entweder ziehen Taifune über die Inseln oder die Fischschwärme ziehen weiter, bei sinkenden Erträgen. Olivers Film ist ein bunter Streifzug zu den schönsten und interessantesten Stellen der Goto-Inseln.
