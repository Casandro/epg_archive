  description: Dänemark ist ein echtes Gourmet-Land und voller Delikatessen. Die Schauspielerin, Eva Habermann, führt sie durch Dänemark und zeigt Ihnen die schönsten Restaurants und Spots. Unteranderem die Torvehallerne, das Schlaraffenland in Kopenhagen. Dort befindet sich der Luxus der Delikatessen mit dem größten Sortiment an Spirituosen in ganz Dänemark, sowie das berühmte Smörrebröd. Davon gibt es mehr als genug Variationen und zeigen Ihnen ein Restaurant, dass das beste Smörrebröd in ganz Dänemark anbietet. Auch zahlreich süßes hat Dänemark anzubieten, wie der Sportskuchen - der Konkurrent der Zachertorte. Auch sehr Sehenswert, ist das Blue Planet, eines der größten Aquarien Europas. Nicht nur dort sind Fisch und Meeresfrüchte angesagt, auch im Szenenviertel, dort wo es auch etwas mehr kosten darf. Auch darf der Schlossgarten nicht vergessen werden, der den größten Kräutergarten ganz Dänemark hat.
  widescreen: true
