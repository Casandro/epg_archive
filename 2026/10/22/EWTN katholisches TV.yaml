  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Warum gerade die katholische Kirche? - Das Wesen der katholischen Kirche
  description: Der Kath-Kurs ist ein Glaubenskurs, den vier bayerische Bistümer entwickelt haben, um in Pfarreien die Evangelisierung zu stärken. In der zweiten Folge erläutert Sr. Theresia Mende OP, was an der katholischen Kirche einzigartig ist, und wieso und inwiefern wir trotz der Versagens und der Sünde in der Kirche ihre Heiligkeit bekennen. Wir hören das Glaubenszeugnis eines jungen Mannes, der bewusst in die katholische Kirche eingetreten ist und erfahren im "Kath-Kurs konkret"-Interview, wie Organisatoren und Teilnehmer den Kath-Kurs erleben.
