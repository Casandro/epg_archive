  title: Hitlers Tod - Das Testament
  subtitle: Hitlers Tod - Das Testament
  description: In der Nacht vom 28. auf den 29. April 1945 diktiert Hitler seiner Sekretärin Traudl Junge politisches und privates Testament. Er macht Juden für die Katastrophe verantwortlich und beklagt die Schwäche der Deutschen für seinen Plan zur Weltveränderung. Danach heiratet er Eva Braun. Eine Dokumentation im Nationalarchiv der USA zeigt die Originale der Testamente und die Heiratsurkunde. Zeitzeugen erinnern sich an diese Nacht.
  genre:
  - '129'
