  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Pearl Harbor
  description: Als Japan den sich ausbreitenden Krieg in Europa nutzt, um im Pazifik zu expandieren, stoppt Amerika alle Ölexporte. Durch das Embargo sieht sich der japanischen Admiral Yamamoto dazu gezwungen, seine gesamte Flotte knapp 6.500 Kilometer über den Pazifik zu schicken, um die amerikanische Pazifikflotte in einem Überraschungsangriff auszuschalten. Damit setzt der Oberkommandierende der Kaiserlichen Marine den Startschuss für den Krieg im Pazifik.
  widescreen: true
  genre:
  - '129'
