  title: Hitlers Tod - Das Ende im Bunker
  subtitle: Hitlers Tod - Das Ende im Bunker
  description: In einem Berliner Bunker, acht Meter unter der Erde, fand Hitler im April 1945 Zuflucht. Geschützt von Beton und seiner Garde, befehligte er Millionen Soldaten und drangsalierte sein Volk. Zeitzeugen wie Armin Lehmann und Rochus Misch erinnern an Hitlers letzten Geburtstag, seinen Zusammenbruch am 22. April und Görings Verhaftung. Computeranimationen zeigen die Bunkeranlagen, während Historiker Rolf-Dieter Müller die militärischen Hintergründe analysiert.
  genre:
  - '129'
  widescreen: true
- eventId: 802234
  start: 2026-10-22T02:45:00Z
  stop: 2026-10-22T04:00:00Z
  title: Hitlers Tod - Das Testament
  subtitle: Hitlers Tod - Das Testament
  description: In der Nacht vom 28. auf den 29. April 1945 diktiert Hitler seiner Sekretärin Traudl Junge politisches und privates Testament. Er macht Juden für die Katastrophe verantwortlich und beklagt die Schwäche der Deutschen für seinen Plan zur Weltveränderung. Danach heiratet er Eva Braun. Eine Dokumentation im Nationalarchiv der USA zeigt die Originale der Testamente und die Heiratsurkunde. Zeitzeugen erinnern sich an diese Nacht.
  genre:
  - '129'
