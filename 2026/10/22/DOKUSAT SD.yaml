  title: Tiere vor der Kamera - Highway durch die Rocky Mountains - Frühling
  description: Arendt und Schweiger führen durch die Rocky Mountains, bremsen für Bisonherden und zeigen faszinierende Tierbeobachtungen entlang des Highways. Die Reise vom Yellowstone Nationalpark bis ins Hochgebirge auf über 4.000 Meter Höhe offenbart Wölfe beim Jagen, Wasseramseln beim Nestbau und Bären im Konflikt mit Wölfen. Die Fahrt ist lehrreich und amüsant, mit Augenzwinkern kommentiert.
  widescreen: true
  subtitle: Tiere vor der Kamera - Highway durch die Rocky Mountains - Frühling
