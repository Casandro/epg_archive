  title: Hitlers Tod - Die Kapitulation
  description: Am 1. Mai 1945 begingen Reichskanzler Joseph Goebbels und seine Frau Selbstmord, nachdem sie ihre Kinder ermordeten. Die Verteidiger der Reichskanzlei kapitulierten. Hitlers letzte Getreue, darunter Martin Bormann, versuchten auszubrechen. Die Rote Armee beherrschte Berlin am nächsten Tag. Stalin hielt Hitlers Tod geheim. Gerüchte über seinen Verbleib verbreiteten sich weltweit. Das FBI und der britische Geheimdienst suchten nach Überlebenden und Hitlers Testamenten.
  widescreen: true
  subtitle: Hitlers Tod - Die Kapitulation
