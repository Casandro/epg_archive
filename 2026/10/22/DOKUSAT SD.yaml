  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Surf's Up
  description: 'Alarm für die Coast Guard: Ein Surfer ist gestrandet und braucht dringend Hilfe. Kurz darauf kommt es zu einem Schiffsbruch, der das Team erneut fordert. Die Rettung gelingt nur durch den Einsatz aller - Coast Guard und die Bewohner Alaskas müssen zusammenarbeiten, um Leben zu retten. Inmitten rauer See und eisiger Temperaturen zeigt sich, wie entscheidend Zusammenhalt in Extremsituationen ist. Ein Wettlauf gegen die Zeit beginnt.'
