  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Blitzkrieg
  description: Nach dem Einmarsch von Hitlers Truppen in Polen erklären Großbritannien und Frankreich Deutschland den Krieg. Als Ablenkungsmanöver beginnt die Wehrmacht den Westfeldzug und marschiert in die Niederlande, Belgien und Luxemburg ein. Dabei kommen die Soldaten schnell voran und erreichen nach zehn Tagen die Atlantikküste. Die Alliierten sitzen in der Falle - die Operation "Dynamo" ist ihre letzte Möglichkeit den deutschen Soldaten zu entkommen.
  widescreen: true
  genre:
  - '129'
- eventId: 823321
  start: 2026-10-22T22:20:00Z
  stop: 2026-10-22T23:25:00Z
  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Kampf über England
  description: Nach der Niederlage Frankreichs 1940 scheint die nationalsozialistische Kriegsmaschinerie unaufhaltsam zu sein. In seinem Wahn versuchte Hitler, mit geplanten Luftangriffen die Kapitulation Großbritanniens zu erzwingen. Sein Ziel war es, durch die Vernichtung der Royal Air Force die Herrschaft über den britischen Luftraum zu erringen. Die Dokumentation blickt auf den Kampf der militärischen Giganten am Himmel über England.
  widescreen: true
  genre:
  - '129'
