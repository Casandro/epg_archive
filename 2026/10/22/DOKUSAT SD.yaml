  title: Hitlers Tod - Das Ende im Bunker
  subtitle: Hitlers Tod - Das Ende im Bunker
  description: In einem Berliner Bunker, acht Meter unter der Erde, fand Hitler im April 1945 Zuflucht. Geschützt von Beton und seiner Garde, befehligte er Millionen Soldaten und drangsalierte sein Volk. Zeitzeugen wie Armin Lehmann und Rochus Misch erinnern an Hitlers letzten Geburtstag, seinen Zusammenbruch am 22. April und Görings Verhaftung. Computeranimationen zeigen die Bunkeranlagen, während Historiker Rolf-Dieter Müller die militärischen Hintergründe analysiert.
