  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Ein kleiner Elefant muss zum Zahnarzt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ludwig, der junge Elefantenbulle, hat sich den Stoßzahn abgebrochen. Da muss etwas geschehen! Und weil es keine Zahnärzte für Elefanten gibt, hat sich kurzerhand ein Zahnarzt, der normalerweise Menschen behandelt, bereit erklärt, den abgebrochenen Stoßzahn zu versorgen. Dass das nur geht, wenn der kleine Dickhäuter in Narkose liegt, ist leicht zu verstehen. So wird das Ganze eine äußerst spannende Sache - besonders für Tierärztin Christine Gohl, die den jungen Bullen zum ersten Mal "hinlegen" muss. Wir beobachten, wie die Behandlung verläuft und zeigen, wie Ludwig sie durchsteht.
