  title: 'Expedition in die Heimat: Moselsteig mit Seitensprung'
  subtitle: 'Moderation: Arndt Reisenbichler'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Mosel ist ein beliebtes Urlaubsziel, doch relativ unbekannt ist der Moselsteig: ein 365 Kilometer langer Wanderweg entlang des Flusses. Er führt über 24 Etappen von Perl bis Koblenz. Die Landschaft überrascht dabei mit Vielfalt und Schönheit. SWR-Moderator Arndt Reisenbichler erkundet die Etappen neun bis dreizehn - von Neumagen-Dhron bis Reil, vorbei an Kesten, Bernkastel-Kues, Ürzig oder Traben-Trarbach. Arndt trifft auf eine leidenschaftliche Ape-Fahrerin, die mit ihrem Hobby ein besonderes Ziel verfolgt. Er begegnet einem Mann, der schon fast 40 Jahre nahezu autark im Wald lebt.'
