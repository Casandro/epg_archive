  title: Mittendrin - Flughafen Frankfurt (86)
  subtitle: 86. Frisch vom Werk - Wir holen ein neues Flugzeug
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die neue Generation des Dreamliner mit neuer Kabine und noch mehr digitalen Highlights an Bord kommt nach Frankfurt. Europas größte Airline, die Lufthansa Group, modernisiert ihre Flotte. Alte Flieger werden ausgemustert. Dafür investiert die Airline Milliarden in neue Maschinen, wie die Boeing 787-9. 34 Flieger sind bestellt. Speziell geschulte Piloten bringen sie vom Hersteller aus Seattle nach Hessen. Hier werden die nagelneuen Maschinen für ihren Einsatz vorbereitet. Wir begleiten exklusiv die nagelneuen Maschinen von der Abholung bis zum ersten Flug.
