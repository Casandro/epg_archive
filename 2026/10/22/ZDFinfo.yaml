  title: Supervulkan Yellowstone - Amerikas tickende Zeitbombe
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2024
    Wie wahrscheinlich ist ein Ausbruch des Supervulkans Yellowstone in den USA? Unter der Erdkruste schlummert eine riesige Magmakammer. Eine Eruption hätte katastrophale Folgen.

    Es ist ein Wettlauf gegen die Zeit: Mithilfe moderner Messtechniken wollen Forschende die Frühwarnzeichen des Vulkans deuten, Vorgänge im Erdinneren verstehen und einen Ausbruch vorhersagen. So könnten betroffene Gebiete rechtzeitig evakuiert werden.
    HD-Produktion
