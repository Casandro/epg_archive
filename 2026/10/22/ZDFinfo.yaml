  title: Terra X Harald Lesch
  subtitle: '... und das Leben auf dem Supervulkan'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Ein Supervulkan rumort bei Neapel. Ein Ausbruch hätte katastrophale Folgen für ganz Europa. Einige Forschende warnen bereits. Wie kurz stehen wir vor dem Inferno?

    Harald Lesch reist zu den Phlegräischen Feldern, einem unterirdischen Vulkansystem, um sich ein Bild zu machen: Wie verlässlich sind die Vorhersagen der Wissenschaftler, und welche Vorbereitungen werden bereits getroffen, um gegen die Katastrophe gewappnet zu sein?
    HD-Produktion
