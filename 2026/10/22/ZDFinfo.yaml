  title: Mysterien des Weltalls
  subtitle: Brauchen wir Feindbilder?
  genre:
  - '128'
  widescreen: true
  description: |-
    USA 2015
    Niemand ist frei von Vorurteilen. Oscarpreisträger Morgan Freeman fragt, warum. Der Mensch war immer auf Hilfe der eigenen Bezugsgruppe angewiesen. Außenstehende werden ausgegrenzt.

    Psychologin Mina Cikara forscht, wie sich aus Einzelpersonen Gruppen formieren. Wenn zwei Gruppen konkurrieren, wird der Einzelne immer das Wohl der Gruppe über sein eigenes stellen - selbst bei Gruppen, die durch eine zufällige Auswahl gebildet wurden.
    HD-Produktion
