  title: Reise ins Innere der Erde - Auf den Spuren von Jules Verne
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2024
    Jules Verne schickt seine Helden 1864 auf eine sagenhafte "Reise zum Mittelpunkt der Erde". Heute folgen Forscher diesem Weg und zeigen, was uns im Inneren der Erde wirklich erwarten würde.

    Die Experten machen den Realitätscheck: Gibt es Jules Vernes fantastische Unterwelten wirklich? Bizarre Kristalle, unbekannte Lebensformen und seismische Erschütterungen aus der Tiefe: Die echte Reise ins Erdinnere ha?lt viele Überraschungen parat.
    HD-Produktion
