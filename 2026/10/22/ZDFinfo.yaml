  title: Die Erde - Entstehung des Lebens
  subtitle: Inferno
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2024
    Vor rund 252 Millionen Jahren ereignet sich das schlimmste Massenaussterben in der Erdgeschichte. Es vernichtet fast alles Leben auf dem Planeten und verursacht Verwüstung und Zerstörung.

    Ein Vulkanausbruch führt in der Folge zu einer weltweiten Klimaveränderung und zum Zusammenbruch ganzer Ökosysteme. Bis zu 90 Prozent aller Arten sterben aus. Doch das Leben auf der Erde findet einen Weg, sich zu erholen. Die Ära der Dinosaurier beginnt.
    HD-Produktion
- eventId:
  - 1575034
  - 546644
  start: 2026-10-22T05:40:00Z
  stop: 2026-10-22T06:30:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Eiswüste
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2024
    Vor Hunderten Millionen Jahren gefriert fast die gesamte Erde wie ein glitzernder Schneeball im All. Das Eis reicht von den Polen bis in Äquatornähe. Eine Bedrohung für das Leben auf der Erde.

    Die Vereisung startet durch Feuer. Gewaltige tektonische Kräfte lösen Prozesse aus, die zu einem Temperatursturz führen. Erste Formen komplexen Lebens stehen vor dem Aussterben. Doch dann lassen Vulkanausbrüche das Eis schmelzen. Das Leben entwickelt sich weiter.
    HD-Produktion
- eventId:
  - 1575035
  - 547088
  start: 2026-10-22T06:30:00Z
  stop: 2026-10-22T07:13:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Pflanzen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2024
    Wie wird die Erde von einem unwirtlichen kargen Felsen zum grünen Paradies? Nicht nur Eis und Feuer formen die Erde. Auch eine andere Kraft ist wichtig für ihre Entwicklung: Pflanzen.

    Das Leben verlässt das schützende Wasser. Es ernährt sich von der Struktur der Erde selbst, erschafft Boden, erzeugt eine lebensfreundliche Atmosphäre und lässt neue Landschaften entstehen. Mit unerwarteten Verbündeten verwandelt es die Erde in einen grünen Planeten.
    HD-Produktion
