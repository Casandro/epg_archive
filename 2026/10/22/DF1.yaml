  title: MareTV
  subtitle: Sylt - Mehr als ein Klischee
  description: 'Sylt ist mehr als ein Klischee: Das kann man auf den Heckscheiben tausender Autos als Aufkleber mit der Silhouette der Insel, ihrem offiziellen Logo, sehen. Die Nordseeinsel ist viel mehr als nur eine Ansammlung von Sandstränden für wohlhabende Urlauber und Zweitwohnungsbesitzer. Sie ist auch die Heimat der echten Insulaner, jener, die seit Generationen auf, von und mit der Insel leben. Am bekannten "Ellenbogen", einem Sandstrandabschnitt im Norden der Insel, muss während des jährlichen Schafabtreibens Deutschlands nördlichste Schafherde zusammengetrieben und von den Dünen zum Schafscherer gebracht werden. Auch die Mitglieder des Sylter Wasserbauteams müssen ihre Sinne beisammen haben. Im Wattenmeer sorgen sie dafür, dass die Insel nicht von den Naturgewalten ins Meer gespült wird.'
  genre:
  - '161'
  widescreen: true
  hd: true
