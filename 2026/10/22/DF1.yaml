  title: MareTV
  subtitle: Irlands Riviera - Die Küste der Grafschaft Cork
  description: 'Idyllische, malerische Hafenstädte, spektakuläre, felsige Inseln und dank des Golfstroms ein angenehm mildes Klima. Deshalb nennen die Bewohner der Grafschaft Cork ihre Heimat Riviera. Die "irische Riviera" ist aber nicht nur malerisch, sondern auch äußerst charismatisch: Ziegenhirte Ed Harper arbeitet und lebt seit über 40 Jahren hoch oben auf den Klippen an der felsigen Küste der Insel Cape Clear. Es mag zunächst nicht besonders aufregend klingen, aber Ed ist blind! Gerald Butler war Leuchtturmwärter an vielen Orten, einschließlich des berühmten Fastnet Rock, auch bekannt als "Träne Irlands". Dies war das letzte Stück Irland, das amerikanische Auswanderer noch sehen konnten, wenn sie die Überfahrt antraten. Wer kein Boot hat, kann die Insel Dursey dennoch erreichen, allerdings mit einer äußerst abenteuerlichen Seilbahn. Die rostige Kabine kann maximal sechs Erwachsene aufnehmen und lange Wartezeiten sind unvermeidlich.'
  genre:
  - '161'
  widescreen: true
  hd: true
