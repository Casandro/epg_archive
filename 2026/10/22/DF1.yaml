  title: MareTV
  subtitle: Am Oslofjord - Schärenidyll mit Hauptstadt-Flair
  description: In den letzten Jahren scheint sich Norwegens Hauptstadt neu erfunden zu haben. Zusätzlich zu ihrer futuristischen Oper wurde der neue Sørenga-Bezirk mit modischen Apartments, einem Badestrand und dem neuen Munch-Museum Lambda geschaffen. Vor der Kulisse der glitzernden Silhouette der Fjordstadt bahnen sich schwimmende Saunen ihren Weg durch das Wasser. Momentan werden die anarchisch anmutenden Schwitzhütten von der Stadtverwaltung einfach toleriert, aber die Initiatoren müssen sich wiederholt Sorgen um die Zukunft ihres unkonventionellen Projekts machen. Viele Norweger besitzen Häuser in den Schären. Aber wenn sie sie bauen oder reparieren müssen, kann die Inselidylle eine ziemliche Herausforderung sein. Materialien müssen oft per Hubschrauber transportiert werden.
