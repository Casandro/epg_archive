  title: Unbekanntes Spanien (3/4)
  subtitle: Von Cáceres nach Toledo
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Diese Folge führt in ein Spanien, das sich nicht über touristische Kulissen definiert, sondern über seine Menschen und deren enge Verbundenheit zu Natur, Tradition und Gemeinschaft.

    Das Filmteam begleitet Schäfer José Manuel auf der jahrtausendealten Transhumanz - einem Marsch über Hunderte Kilometer, den heute nur noch wenige wagen. Zwischen Hitze, Gewitterfronten und einsamen Nächten zeigt sich ein Leben, das mit der Landschaft verschmilzt.
    HD-Produktion
