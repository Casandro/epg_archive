  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Mitten im verborgenen Herzen Spaniens öffnet sich ein Panorama abseits von Stränden und Metropolen: ein Spanien voller Leidenschaft, rauer Schönheit und überraschender Lebenswege.

    Dort leben Menschen, die in der Abgeschiedenheit ihrer Täler, Hochebenen und Dörfer ein fast verschwundenes Erbe bewahren. Diese Folge zeigt ein verletzliches, wildes Spanien voller Menschen, die ihre Heimat mit Leidenschaft neu beleben.
    HD-Produktion
