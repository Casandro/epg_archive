  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Hans-Jürgen Hoeppke ist Militärseelsorger in der Bundeswehr. Er beschreibt die Herausforderung seines Berufes und die Belastungen und Ängste, mit denen Soldaten und Soldatinnen zu ihm kommen. Die Militärseelsorge ist ein ziviler Organisationsbereich der deutschen Bundeswehr mit der Aufgabe, einen Beitrag zur seelsorgerischen Betreuung der Soldaten und ihrer Familien zu leisten. Die Militärseelsorger arbeiten in den Liegenschaften der Bundeswehr. Dadurch können sie den Kontakt zu den Kameraden während der Dienstzeit pflegen.'
