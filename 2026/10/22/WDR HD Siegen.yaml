  title: 'Quarks: Gesund durch die Lebensmitte - Jetzt die richtigen Weichen stellen'
  subtitle: 'Moderation: Florence Randrianarisoa'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die Zeit lässt sich zwar nicht zurückdrehen, unser Alter aber schon! \nZumindest unser biologisches Alter. Für ein langes und gesundes Leben kommt es dabei besonders auf die Lebensmitte an. Schon innerhalb weniger Monate können wir unseren Körper dazu bringen, Alterungsprozesse zu verlangsamen oder sogar umzukehren. Im Test wird deutlich, wie stark sich das biologische Alter tatsächlich verändern lässt - nach nur drei Monaten mit neuem Lebensstil."
