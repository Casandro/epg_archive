  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nashornbulle Ndugu hatte sich vor einiger Zeit Richtung Hannover aus dem Staub gemacht. Nun, da es in Leipzig eine moderne, neue Nashornanlage gibt, klopft er wieder an die Tür. Die Zusammenarbeit zwischen Mercedes und Benz trägt weiter Früchte: Seit kurzem hat Plumplori Mercedes zwei Minis im Stall - sozusagen als Nachfolger für Smart. Der dreht inzwischen in Frankreich seine Runden. Zebra-Hengst Henry hat ein Leben ohne Probleme: aber er macht Zebra-Stute Kathrin Probleme. Sie wird von ihm gemobbt. Wird Henry Kathrin wieder in Ruhe lassen?'
