  title: Sea Patrol - Ausgeknockt
  subtitle: Sea Patrol - Ausgeknockt
  description: Von einem Landgang kehrt Robert mit einem Filmriss zurück an Bord der Hammersley. Bei einer Übung mit den neuen Schnellbooten reagiert er nicht auf Buffers Befehle und setzt dabei das Leben seiner Kameraden aufs Spiel. Ein Drogenschnelltest fällt positiv aus. AU 2008
