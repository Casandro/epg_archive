  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nNeuwahlen in Serbien - der Einfluss der serbischen orthodoxen Kirche \nAm kommenden Sonntag stehen in Serbien vorgezogene Neuwahlen an. Anfang September hatte der serbische Präsident Aleksander Vucic das Parlament aufgelöst. Jetzt will er wieder in das Amt des Ministerpräsidenten wechseln, um an der Macht zu bleiben. Dabei wird er von der einflussreichen serbischen orthodoxen Kirche unterstützt. \n\n10 Jahre Amoris Laetitia - die Sexualmoral der römisch-katholischen Kirche \nIn Rom sind katholische Bischöfe aus aller Welt zusammengekommen, um über den Text ?Amoris Laetitia? erneut zu beraten. Vor zehn Jahren hatte Papst Franziskus das Schreiben veröffentlicht. Es fasst zusammen, was der Papst und die katholischen Bischöfe über Ehe, Partnerschaft und Familie in der modernen Welt denken.\n\nAm Mikrofon: Susanne Fritz"
