  title: Klątwa Wyspy Dębów 5 (odc. 3)
  subtitle: Pojawiły się nowe dowody na to, że Europejczycy byli obecni na Wyspie Dębów ponad sto lat przed odkryciem "dziury z pieniędzmi".
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2017
    Reżyseria: Kevin Burns
    Występują: Terry Matheson, Jack Begley, Craig Tester, Mike Gudelewicz, Rick Lagina, Gary Drayton
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 827492
  start: 2026-10-22T07:50:00Z
  stop: 2026-10-22T10:05:00Z
  title: W czepku urodzeni
  subtitle: Rosco i Doug poznają się, gdy w trakcie rutynowej kontroli policyjnej zostają mylnie rozpoznani jako poszukiwani rabusie. W czasie ucieczki przypadkowo trafiają na pokład samolotu.
  description: |-
    Tytuł oryginalny: Nati con la camicia
    IT,US, 1983
    Reżyseria: Enzo Barboni
    Występują: Terence Hill, Bud Spencer, Buffy Dee, David Huddleston, Riccardo Pizzuti, Harold Bergman
    Kierowca ciężarówki Doug i autostopowicz Rosco zostają niesłusznie wzięci przez policję za złodziei. Podczas ucieczki na lotnisko przypadkowo zdobywają darmowy lot do Miami oraz torbę z milionem dolarów. Na miejscu okazuje się, że tym razem wzięto ich za tajnych agentów, a gra staje się zbyt niebezpieczna, by się wycofać. Obsada: Terence Hill, Bud Spencer, Buffy Dee
  genre:
  - '20'
