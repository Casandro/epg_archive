  description: "Tytuł oryginalny: Doomsday: 10 Ways the World Will End\nUS, 2016\nReżyseria: Gabriel Rotello\nTwórcy cyklu zastanawiają się, co może spowodować zagładę naszego świata. Przedstawiają dziesięć potencjalnych przyczyn. Wśród nich znajdą się m.in. dziura w ziemskiej atmosferze, zakłócenia pola grawitacyjnego, pandemia nieuleczalnej choroby, kolizja z inną planetą, erupcja podziemnych złóż metanu czy wojna nuklearna. W każdym odcinku naukowcy omawiają zjawiska i kataklizmy, które mogą zmieść życie z powierzchni naszej planety. "
