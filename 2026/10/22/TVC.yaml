  title: Porzucone konstrukcje 1 (odc. 4)
  subtitle: 'Wracająca z Lanzarote grupa Polaków wwozi do Wielkiej Brytanii 37 tys. papierosów. Zostaje złapana na lotniskowym parkingu. Podejrzenia kontroli granicznej wzbudza młoda para przybywająca z Karaibów. '
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2017
    Reżyseria: Luke Wales
    Występują: Rob Bell, Saul David, Andrew Gough, Nigel James, Andrew Lambert, Susan Langely
    W tym odcinku twórcy serii przyglądają się łodzi podwodnej z okresu zimnej wojny. Próbują też się dowiedzieć, dlaczego amerykański rząd podczas I wojny światowej wydał miliony dolarów na flotę okrętów wojennych, które następnie celowo zniszczył, oraz dlaczego przodek współczesnych jednostek wojennych spoczywa zapomniany pod wodą na drugim końcu świata.
  ageRating: 7
