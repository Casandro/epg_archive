  title: Stargate
  subtitle: Sha'res Rückkehr
  description: |-
    Teal'c und Dr. Daniel Jackson besuchen den Planeten Abydos, wo sie eine erschreckende Neuigkeit erfahren: Jacksons Ehefrau Sha're (Vaitiare Hirshon) ist hochschwanger - und zwar vom Goa'uld-Anführer Apophis! Um Sha're und das Baby vor den parasitären Aliens zu bewahren, sollen die beiden auf die Erde evakuiert werden, was aber misslingt. Derweil sind Colonel O'Neill und Captain Carter in Washington bei einer Ehrengala der U.S. Air Force. Doch als ein Investigativjournalist, der Informationen über das streng geheime Stargate-Projekt veröffentlichen will, bei einem "Unfall" ums Leben kommt, platzt die Preisverleihung...
