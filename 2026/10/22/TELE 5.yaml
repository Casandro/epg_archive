  title: Stargate
  subtitle: Insekten des Todes
  description: |-
    Auf dem Planeten PB6-3Q1 machen O'Neill und seine Spezialeinheit eine bemerkenswerte Entdeckung. Offensichtlich wurde die Welt noch vor Kurzem von einer menschenähnlichen Zivilisation bevölkert. Allerdings ist nun alles verlassen, und riesige Insekten haben die Kontrolle übernommen! Plötzlich wird auch Teal'c von einem überdimensionalen Fluginsekt gestochen, was eine gefährliche Infektion nach sich zieht. Nicht einmal der Symbiont in Teal'cs Körper ist in der Lage, den mysteriösen Krankheitserreger auszumerzen. Stattdessen verändert sich Teal'cs DNA, sodass er droht, selbst zum Insekt zu werden...
