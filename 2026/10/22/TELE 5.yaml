  description: |-
    In Hongkong hat Kriminalinspektor Cheung Sung-bong (Donnie Yen) dem organisierten Verbrechen den Kampf angesagt. Allerdings bekommt es der Polizist nun auch mit einem brutalen Gegenspieler aus den eigenen Reihen zu tun. Nachdem bei einer Razzia ein berüchtigter Gangsterboss erschossen worden ist, und jede Menge Drogen verschwunden sind, gerät Yau Kong-ngo (Nicholas Tse) - Cheungs abtrünniger Kollege - ins Visier der Ermittlungen. In den Straßen der Metropole bricht ein schonungsloser Showdown los. - Der Actionfilm von Benny Chan wurde u.a. mit dem Hong Kong Film Award ausgezeichnet. Die Veröffentlichung erfolgte erst nach dem Tod des Regisseurs.
