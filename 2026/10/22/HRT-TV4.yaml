  ageRating: 4
  genre:
  - '160'
  description: Podaci su alarmantni! Kad je riječ o liječnicima obiteljske medicine, odavno smo u crvenom. U Hrvatskoj ih nedostaje 288, u sljedećih pet godina njih gotovo 900 odlazi u mirovinu. U manjim sredinama i na otocima zdravstvena skrb bi teško funkcionirala bez liječnika koji su u Hrvatsku stigli iz susjednih zemalja. Labirint donosi priče o onima koji su došli i postali dio zajednice u kojoj rade i žive, naši ljudi u bijelom, oni koji liječe, ali i slušaju. Na Veli Iž stigao je iskusni kirurg, Sarajlija Luka Pirnat, a na Cres mladi liječnik Driton Zeneli iz Tetova u Sjevernoj Makedoniji. Kako su prihvaćeni i što znače za otočane?
