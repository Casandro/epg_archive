  title: Siostry od Aniołów w sercu Afryki
  description: |-
    Tytuł oryginalny: Siostry od Aniołów w sercu Afryki
    PL, 2026
    W 1984 roku Siostry od Aniołów z podwarszawskiego Konstancina założyły swoją pierwszą placówkę misyjną w sercu Afryki. Na miejsce pierwszej misji wybrały wioskę Kampanga położoną w trudno dostępnych górach Rwandy, na wysokości ponad 2 tys. metrów n.p.m. Trafiły tam do społeczności, w której chrześcijaństwo było wciąż nowością, a warunki życia w pierwszych latach znacząco odbiegały od tych znanych im z Polski i Europy lat 80. XX w.
  ageRating: 12
  genre:
