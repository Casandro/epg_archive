  title: Zakochaj się w Polsce - Radomsko
  description: |-
    Tytuł oryginalny: Zakochaj się w Polsce
    PL, 2021
    Reżyseria: Adam Molak
    Radomsko to miasto, w którym można usiąść na najdłuższej drewnianej ławce w Polsce. Liczy ona 94 metry długości. Jednocześnie może na niej siedzieć aż 190 osób. Składa się z 58 połączonych ze sobą odcinków, mierzących od 80 cm do ponad 2, 5 m każdy. Patronką Radomska jest Jadwiga Andegaweńska - jedna z dwóch kobiet na polskim tronie, którą wybrano na królową Polski - na zjeździe szlachty w Radomsku w 1384 roku. Jednym z najważniejszych zabytków miasta jest dawny ratusz miejski.
  ageRating: 7
  genre:
  - '149'
  subtitle: Tym razem Tomasz Bednarek zawita do Radomska, rodzinnego miasta braci Różewiczów, gdzie pamięć o Januszu - poecie, Stanisławie - reżyserze, i Tadeuszu - dramaturgu, jest od lat pielęgnowana z największą atencją.
