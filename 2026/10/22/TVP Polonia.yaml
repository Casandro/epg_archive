    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Krzysztof angażuje się w pracę zespołu i zaniedbuje swoje obowiązki leśniczego. Tomasz przywołuje młodego leśniczego do porządku. Całe miasteczko żyje budową drogi. Okazuje się, ze nowa droga ma przechodzić przez nowy dom Pauli i Sławka. Jóźwiakowie natomiast już planują, w co zainwestują pieniądze otrzymane z odszkodowania. Zdania mieszkańców co do budowy autostrady są podzielone. Zespół parafialny działa już pełną parą, Róża wymyśliła nazwę dla zespołu - Niebiańskie Gitary.
  ageRating: 12
  genre:
  - '23'
  subtitle: Mieszkańcy miasteczka żyją budową drogi. Okazuje się, że nowa droga ma przechodzić przez dom Pauli i Sławka. Ewa Stern udziela wywiadu w telewizji. Małgosia dowiaduje się, że Janusz nie żyje.
- eventId: 799551
  start: 2026-10-22T11:50:00Z
