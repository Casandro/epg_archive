  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Petr Gojda, režisér, dramaturg Bitvy o diamant a Jaroslav Šťastný, herec, který ztvárnil hlavní roli v tomto sportovním a dobrodružném seriálu. S Petrem a Járou si budeme povídat o tom, jak se nové čtení na pokračování pro Rádio Junior natáčelo, co je bavilo, a proč by tenhle příběh měl každý slyšet. Moderuje Eva Sinkovičová.
