  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Karel Kerouš, přírodovědec. 20. října je Mezinárodní den stromů a my lidé oslavujeme stromy. Měli bychom to ale dělat častěji, protože stromy nejsou důležité, jen když jsou venku tropické dny. O tom, jak stromy snášejí sucho, jak jsou důležité pro život na Zemi a jak stromy mezi sebou komunikují, si budeme povídat s ochráncem přírody Karlem Keroušem. Repríza pořadu.'
