  description: 'Wie wird eigentlich aus Trauben Wein gemacht? Willi wills wissen und verfolgt den Weg der Trauben von der Lese bis in die Flasche. Selbstverständlich hilft Willi bei der Lese mit und erfährt dabei vom Kitzinger Winzer Otto, dass es zwei verschiedene Möglichkeiten gibt, die Trauben zu lesen. Entweder mühsam mit der Hand oder vollautomatisch mit einer Maschine. Auch die nächsten Arbeitsschritte schaut sich Willi ganz genau an: Die Trauben werden in einer Bütte gesammelt, gewogen und in die Kelterhalle transportiert. Und dann kommt der große Moment - das Pressen der Reben.'
