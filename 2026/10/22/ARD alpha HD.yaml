  audiodesc: true
  description: 'Abgebrochene Mechanikerlehre, Handelsschule ohne Abschluss, schließlich eine Lehre zum Bürokaufmann: Günter Grünwald weiß lange nicht, wo es hingehen soll. Die Musik wird zu seiner Gegenwelt, seit er im Jugendalter eine erste E-Gitarre bekommt. Günter Grünwald übernimmt bei Auftritten die Ansagen, baut sie aus zu kleinen Sketchen, entdeckt, dass sein Talent für das Komische gut ankommt. Bald hat er erste TV-Auftritten und bekommt seine eigene Fernsehshow. Seine derben Comedy-Figuren wie der Hausmeister Bamberger sind sein Ventil, mit Kindheits- und Jugenderlebnissen durch prügelnde und sadistische Erwachsene umgehen zu können.'
