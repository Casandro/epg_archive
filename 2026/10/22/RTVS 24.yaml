  title: Slovensko v obrazoch (20)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: Tiesňava Prielom Hornádu v Slovenskom raji s rebríkmi a vodopádmi počas jesene utícha. Turistov striedajú zvuky prírody... V Považskej Bystrici stoja blízko seba dve dominanty. Delí ich od seba zhruba 700 rokov. Jednou je chrám z 13. storočia a druhou administratívna budova zo 70. rokov minulého storočia. Jej aulu prirovnávajú k zasadacej miestnosti OSN v New Yorku... Hradná kaplnka, rytierska sála, dobové expozície, drak aj sokoliari čakajú na návštevníkov v zámku Vígľaš... Umelecký maskér a kostýmová výtvarníčka oživujú dávnu módu. Inšpirujú sa historickými obrazmi. (2026)
  genre:
  - '35'
