  description: Záverečný koncert 61. ročníka Bratislavských hudobných slávností. Feldek 90 - večer v Slovenskom národnom divadle venovaný oslave celoživotnej tvorby básnika a dramatika Ľubomíra Feldeka. Hudobné ceny SOZA 2025 majú svojich laureátov. Rozhovor s režisérkou Yvonne Vavrovou. Sochár Ján Ťapák vystavuje v Berlíne. Múzeum mesta Bratislavy otvorilo výstavu Medzi eufóriou a vyčerpaním. Bratislavské módne dni. (2026)
