  subtitle: Dokumentarni
  description: Granice među ljudima često su određene zemljopisnim kartama. Ali u sudbonosnim trenucima povijesti, te granice briše isto srce i isti cilj. U "Novoj misiji" spajamo ponosni kamen Hercegovine, ljepotu kontinentalne Hrvatske i predivno more koje nas je povezalo. Tri različita životna puta, ali jedna, zajednička nit - borba za slobodu. Ivica, Vito i Roberto - ispovijesti koje trajno povezuju.
