  title: Jazzový podvečer
  description: 'Litevská nekompromisní jazzová scéna: Vilnius JJAZZ Ensemble 2/2. Jazz se možná proměňuje v nejlepší platformu pro umění v hudbě, ať už zní a vypadá jakkoliv. Každý čtvrtek uvádí Václav Vraný.'
- eventId: 958420
