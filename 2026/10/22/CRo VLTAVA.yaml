  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (5/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová a Pavel Soukup. Režie Petr Adler. Natočeno v roce 1990 (29 min).'
