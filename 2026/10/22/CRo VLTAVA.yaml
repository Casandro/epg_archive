  title: Akcent
  subtitle: Akcentujeme to, co hýbe kulturou. Každý všední den jedno téma z více úhlů pohledu.
  description: 'V Kobce 17 na pražském Smíchově můžete zajít na výstavu Josef Klimeš: Rovnováha. Expozice přibližuje příběh monumentální plastiky, která patřila po desetiletí k výrazným dílům na Barrandovském mostě, jenže v červenci spadla. Která díla jsou podobně ohrožená a co s tím? A proč dnes určitá díla odstraňujeme? Jaká pravidla platí pro umisťování plastik ve veřejném prostoru? Saša Michailidis se ptá Pavla Karouse a Matěje Michalk Žaloudka.'
