  title: Vizitka
  description: 'Lukáš Sapík, kreativní producent ČRo. Zaměřuje se na vývoj nových audio formátů a stojí za celou řadou úspěšných podcastových a dokumentárních sérií. Jak a kde hledá náměty pro své projekty? Jaké je to poslouchat Havla, nebo zavolat na Urgent? V čem má audio budoucnost a proč má smysl začít zvukově přemýšlet? Hostem speciálního festivalového vysílání bude kreativní producent Českého rozhlasu Lukáš Sapík. V mediálním světě ušel pestrou profesní cestu - od novinařiny a zpravodajství až k uměleckým disciplínám. Aktuálně se Lukáš Sapík věnuje přípravě a dramaturgii podcastových sérií. (Poslechům podcastů je mimochodem dnešek na festivalu věnován.) Přímo z Prix Bohemia Radio v Olomouci se ptá Michal Bureš. e-mail: vizitka@rozhlas.cz'
