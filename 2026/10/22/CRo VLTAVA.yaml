  title: ArtCafé
  description: 'Berlin Manson nejen o nové desce Cheap Fashion . Berlin Manson je jednou z nejvýraznějších kapel současné česko-slovenské alternativní scény, která propojuje punkovou naléhavost, syrový postpunk, elektroniku a rap s ostrou společenskou reflexí, černým humorem a generační frustrací. Se zpěvákem Adamem Dragunem si bude Pavel Zelinka povídat nejen o novém albu, ale i o jeho výrazné divadelní cestě. E-mail: artcafe@rozhlas.cz'
- eventId: 958419
