  title: Planet Weltweit - Montenegro - Der Eselretter
  subtitle: Planet Weltweit - Montenegro - Der Eselretter
  description: Noch vor wenigen Jahren waren Esel in Montenegro akut vom Aussterben bedroht. Dass es die einst auf dem Balkan zahlreichen, treuen Helfer noch immer gibt, ist vor allem Darko Savelji zu verdanken. 2015 rettete der Biologe die erste Eselstute; die Besitzer hielten sie in elenden Verhältnissen. Kurze Zeit später nahm er zwei andere Esel zu sich, die als Futter für Jagdhunde geschlachtet werden sollten. Inzwischen sind es 59 Stuten und ein Hengst, die auf Darkos Eselfarm ein Zuhause haben - hoch in den Bergen, 17 km von Montenegros Hauptstadt Podgorica entfernt. Mandarina ist mit 40 Jahren die älteste Stute auf der Farm. Bevor Darko Savelji sie zu sich nahm, hatten ihre Besitzer sie als Arbeitstier ausgebeutet und dabei jahrelang nicht einmal bemerkt, dass sie blind ist. Drina hingegen war das erste Fohlen auf der Farm, geliebt und verhätschelt von der ganzen Familie. Als ein Wolf ihre Mutter tötete, hielten die Saveljis die Eselwaise umso mehr wie eines ihrer Haustiere. Doch als immer mehr Esel auf die Farm kamen, baute die Familie für die neuen Bewohner einen Stall und ein Auslaufgehege. Inmitten der Herde steht nun auch Drina - die nun jedoch umso eifersüchtiger darüber wacht, dass sie die meiste Zuwendung genießt. Was als Rettungsaktion für die oft misshandelten und ausgesetzten Esel begann, ist zu einer überaus populären, amüsanten und zu Herzen gehenden Umweltschutzaktion des kleinen Balkanlandes geworden. Noch vor 30 Jahren sicherten Esel den Bauern Montenegros das Überleben. Sie ackerten, bis Landflucht und Maschinen sie in den Augen ihrer Besitzer überflüssig und wertlos machten. Und obwohl der Esel zum kulturellen Erbe auf dem Balkan gehört, zählt er in Montenegro plötzlich zu den vom Aussterben bedrohten Tierarten. Die letzten Esel davor zu bewahren und ihnen ein artgerechtes Leben zu ermöglichen sowie sein Modell von Tierschutz in die Öffentlichkeit zu tragen, dafür kämpft Darko Saveljic. DE 2022
