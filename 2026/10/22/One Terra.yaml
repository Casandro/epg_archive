  title: Planet Weltweit - Das Geheimnis der Schweizer Uhren
  subtitle: Planet Weltweit - Das Geheimnis der Schweizer Uhren
  description: Die Wiege der Uhrmacherei steht in den Bergen der Französischen Schweiz. La-Chaux-de-Fonds und Le Locle - mit den Namen beider Städtchen verbinden Kenner höchste Präzision. Denn hier entstand im 18. Jahrhundert der Weltruhm der Schweizer Uhren - auf höchst ungewöhnliche Weise. Im Winter, wenn auf den Höfen wenig Arbeit anfiel, begannen einige der Bauern komplizierte Uhren herzustellen. Ein Handwerk, das über die Jahrhunderte in dieser Region perfektioniert wurde. Handverlesen sind heute die Studenten, denen hier der Sprung vom einfachen Uhrmacher zum Uhren-Restaurator gelingt. Jener Qualifikation, um die sich die Luxusuhren-Labels wie zum Beispiel Cartier, Zenith oder Ulysse Nardin reißen.  In dem lichtdurchfluteten Atelier ist es still. Leise tickt und surrt es an den Arbeitspulten. Eine junge Frau springt auf, schaut verzweifelt auf den Boden. Emilie Choulat, Restaurationsstudentin im zweiten Studienjahr, hat eine unersetzbare Schraube verloren. Für ihre Diplomprüfung muss sie eine historische Uhr restaurieren und versuchen, die ursprünglichen Funktionen wiederherzustellen. Ersatzteile gibt es keine - jede Uhr ist ein Unikat, handgefertigt bis ins millimeterkleinste Rädchen. Doch zur Restauration einer Pendel- oder Taschenuhr gehört mehr - ihnen wohnt eine Philosophie, eine Einzigartigkeit in der Herstellung inne, die ein Restaurator ergründen muss. Komplikationen heißen jene Uhren, die neben Minuten und Stundenanzeigen weitere Funktionen haben. Sie können beispielsweise in Sekundenbruchteilen stoppen, das Datum oder astronomische Angaben anzeigen oder die Zeit durch akustische Signale wiedergeben. Auch Diego Azconegui gehört zu den sechs bis acht Nachwuchs-Restauratoren, die pro Jahr an der CIFOM, der Technischen Hochschule von Le Locle, aufgenommen werden. Wie Emilie kämpft er nicht nur mit der Uhr, sondern auch gegen die Zeit, um rechtzeitig vor Ablauf der Prüfung fertig zu sein. DE 2008
  ageRating: 6
- eventId: 951177
  start: 2026-10-22T07:15:00Z
  stop: 2026-10-22T08:07:00Z
  title: Planet Weltweit - Jillaroos - Cowgirls im australischen Outback
  subtitle: Planet Weltweit - Jillaroos - Cowgirls im australischen Outback
  description: 'Australiens Rinderfarmer stehen vor einem Problem: Reihenweise laufen ihnen die Cowboys weg. Die Männer satteln um und arbeiten lieber als Kumpel im Bergbau - für besseres Geld. Statt harter Kerle treiben nun immer mehr junge Frauen die riesigen Viehherden kilometerweit durch das Outback. Sie reparieren Zäune, reiten Pferde zu und verkaufen die Herden auf Viehauktionen. Eine neue Zeit bricht im Outback an - die Zeit der Jillaroos, der Cowgirls. In der Reportage werden eine Farmerfamilie und deren Töchter durch Wochen voller Arbeit und großer Entscheidungen begleitet. Die 19-jährige Flicky arbeitet auf der Farm ihrer Eltern als Jillaroo. Zusammen mit ihrer Schwester Emma Jane muss sie in harten Zeiten mit anpacken. Denn es gibt keine Cowboys mehr, seit die Bergbauminen im ganzen Land mit lukrativen Jobs locken. Es müssen ohnehin schon fast alle Rinderfarmer im Outback um ihre Existenz kämpfen. Eine fünfjährige Dürre zwang sie, hohe Kredite zum Kauf von Futter aufzunehmen, die sie durch die fallenden Fleischpreise nicht zurückzahlen können. Dazu kommt, dass wochenlange Regenfälle auf dem ausgetrockneten Land zu Überschwemmungen geführt haben - ein Problem löst das andere ab. Doch die Farmer lieben ihre Tiere und ihren Beruf. Aufgeben, um einen Job in der Stadt anzunehmen, ist nur die allerletzte Option. Zum Glück vieler Farmer gibt es neuerdings junge Frauen wie Flicky, die die harte Farmarbeit nicht scheuen. Die Mädchen kommen oft mit verklärten Ansichten in die Wildnis. Sie träumen von romantischen Abenden am Lagerfeuer und Ausritten bei Sonnenuntergang. Doch die Realität aus Arbeit, Einsamkeit und Abgeschiedenheit sieht anders aus. Im Outback funktioniert kein Fernsehen und kein Mobiltelefon. Die nächste Stadt ist oft eine Tagesreise entfernt. Freunde treffen oder sich verlieben klappt hier nicht ohne weiteres. Und dennoch wächst die Zahl der Jillaroos. DE 2010'
  ageRating: 6
- eventId: 951203
  start: 2026-10-22T08:15:00Z
  stop: 2026-10-22T09:07:00Z
  title: Planet Weltweit - Bangkoks Schatztaucher
  subtitle: Planet Weltweit - Bangkoks Schatztaucher
  description: "In Blickweite der glitzernden Bürotürme und Luxushotels der thailändischen Hauptstadt leben Bangkoks Flusstaucher in einer ländlichen Oase. Sie wohnen mit ihren Familien auf der Halbinsel Pra Pradaeng - dort,  wo der mächtige Chao Phraya eine Schleife mitten durch die Stadt zieht. An seinen Ufern ließen sich schon vor Jahrhunderten Könige, europäische Handelshäuser und asiatische Zuwanderer nieder. Und so ist der Fluss heute eine unergründliche Schatztruhe. Zum Ende der Regenzeit, im Oktober, können die Taucher es wieder wagen, auf dem Grund des Chao Phraya nach Wertvollem zu suchen. Davor ist die Arbeit unter Wasser zu gefährlich, die Strömung ist zu stark und oft unberechenbar. \nIm schlammigen Bett von Thailands 'Fluss der Könige', dem Chao Phraya, liegen noch viele Schätze verborgen, da ist sich der Taucher Somchai Panthong sicher. Der 50jährige lebt davon, mitten in Bangkok Fundstücke aller Art - von Antiquitäten bis  Altmetall - aus dem Fluss zu holen und zu verkaufen. Zusammen mit seinem Neffen Tding sucht er nach dem, was Händler, Mönche und Kriegsherren im Laufe der Jahrhunderte im Chao Phraya versenkt, verloren und  versteckt haben. Tauchen können Somchai und Tding überall, wo Strömung und Wasserstand es zulassen. Ihr Revier erstreckt sich vom Norden Bangkoks über das Zentrum bis hin zum Hafen im Südwesten. Zum Ende der Regenzeit müssen sie sich allerdings auf geschützte Tauchstellen mit wenig Strömung beschränken - sonst riskieren sie ihr Leben. Doch auch die vielen Schiffe auf dem Chao Phraya, der eine von Bangkoks Hauptverkehrsadern ist, können den Tauchern gefährlich werden. Um sich mit ihrem kleinen Boot und dem selbstgebauten Equipment bemerkbar zu machen, hissen die Männer eine Flagge. Somchai Panthong braucht nun viel Glück, denn zu Beginn der Tauchsaison ist sein erspartes Geld weitgehend aufgebraucht. Was werden die wagemutigen Schatzsucher finden? \n DE 2013"
  ageRating: 6
- eventId: 951205
  start: 2026-10-22T09:15:00Z
  stop: 2026-10-22T10:07:00Z
  title: Planet Weltweit - Das Salz der Inka
  subtitle: Planet Weltweit - Das Salz der Inka
  description: 'Die Salinen von Maras liegen im Hochland der peruanischen Anden auf über 3000 Höhenmetern. Sie bilden ein weit verzweigtes Salzlabyrinth, errichtet von Menschenhand. Tausende terrassenförmig angelegte Becken fangen das warme Salzwasser des Berges auf. Während das Wasser in der Sonne verdunstet, bleibt an den Rändern und am Wannenboden eine kostbare weiße Kruste zurück: das Maras-Salz. Noch heute gewinnen die Nachfahren der Inka auf diese traditionelle Weise ihr "Weißes Gold" der Anden. Der Film zeigt den harten Alltag der Salineros inmitten der atemberaubend schönen Berglandschaft Südamerikas. Jetzt, Anfang Mai, endet in Perus Hochland allmählich die Regenzeit. Sieben Monate lang lagen die Salinen brach. Nun kann die Familie von Emilia Atapaucar endlich mit der Säuberung der acht familieneigenen Salinenbecken beginnen. Sie benötigt die Einnahmen aus dem Salzverkauf dringend. Denn Mariella, die 23-jährige Tochter, steht kurz vor der Entbindung, und ein Aufenthalt im Krankenhaus ist teuer. Bereits zur Zeit der Inka dienten die Salinen von Maras als ergiebige Salzquelle. Im 16. Jahrhundert plünderten die spanischen Eroberer die Silber- und Salzvorkommen Perus. Heute ist Maras ein armes Bergdorf, dessen Bewohner die Salinen eigenständig bewirtschaften. Jede Bauernfamilie besitzt zwischen fünf und zehn Terrassenbecken, die sich an die steilen Andenhänge heften. Die meisten Bauern haben sich zu einer Kollektive zusammengeschlossen, doch wirklich ausreichend Geld verdient hier niemand. Das große Geschäft mit dem Salz machen andere: Exporteure, die das "Weiße Gold der Anden" zu hohen Preisen in die Industrieländer liefern. Seit einigen Jahren findet das Anden-Salz in Europa und Amerika immer mehr Liebhaber. 360°- GEO Reportage begleitet eine Salzbauernfamilie bei der mühevollen Ernte des kostbaren Salzes. DE 2009'
  ageRating: 6
- eventId: 951211
  start: 2026-10-22T10:15:00Z
  stop: 2026-10-22T11:07:00Z
  title: Planet Weltweit - Bishnoi, Tierliebe bis in den Tod
  subtitle: Planet Weltweit - Bishnoi, Tierliebe bis in den Tod
  description: Vor über 500 Jahren gründete ein indischer Guru die Gemeinschaft der Bishnoi, einem Volk, das sich dem Schutz allen Lebens verschrieben hat - und in enger Verbindung mit Pflanzen und Tieren lebt. Die Heimat ihrer Nachkommen ist noch immer die Wüste Rajasthans. Dort verteidigen die Bishnoi bis heute ihre traditionellen Regeln gegen die Einflüsse der modernen Welt, notfalls unter Einsatz ihres Lebens.  Die Wüste Thar im Nordwesten Indiens. Schon früh am Morgen geht Ramniwas Budhnagar hinaus, um Wasser und Futter für die wilden Tiere bereitzustellen. Sein Sohn Mahaver begleitet ihn. Eines Tages soll er dieses Ritual fortführen. Ramniswas Familie gehört zum Volk der Bishnoi. Bishnoi bedeutet "29", abgeleitet von den 29 Geboten, die Lord Jambeshwar vor etwa 500 Jahren für seine Gemeinde aufstellte. Zu jener Zeit drohte das Land durch Konflikte zwischen Muslimen und Hindus und Rivalitäten innerhalb verschiedener Kasten auseinander zu brechen. Jambeshwar glaubte, dass der einzige Weg aus dieser Situation ein absoluter Respekt gegenüber jedem Lebewesen sei. Dafür stellte er die 29 Regeln auf. Sie betreffen die tägliche Hygiene ebenso wie die Art zu sprechen, die Ernährung, das Mitgefühl und das Vergeben gegenüber anderen. Sie reichen von "Töte niemals ein Tier", "Schütze die wilden Tiere, denn auch sie spielen eine Rolle im Gleichgewicht der Natur" über "Lüge nicht" bis hin zu "Fälle keine Bäume". Mit ihrem strengen Regelwerk gehören die Bishnoi zu den ersten Umweltschützern der Welt. Bis heute versuchen sie, ihren Idealen treu zu bleiben, auch in der globalisierten Welt, in der wenig Platz für Individuen und Lebensformen jenseits der Moderne bleibt. Viele junge Bishnoi wandern ab in die Städte. Diejenigen, die bleiben, kämpfen weiter für die Rechte der Tiere und Bäume, verarzten verwundete Gazellen, pflegen sie in den eigenen Tempeln gesund. DE 2010
  ageRating: 6
