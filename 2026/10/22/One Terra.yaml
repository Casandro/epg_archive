  title: Planet Weltweit - Kalmückien, Die Rückkehr der Mönche
  subtitle: Planet Weltweit - Kalmückien, Die Rückkehr der Mönche
  description: 'Sanan Matvenov ist erst 26 Jahre alt, doch seit seinem 13. Lebensjahr studiert er die Lehre Buddhas. Mit sieben anderen Mönchen im Alter von 16 bis 26 Jahren lebt er im Goldenen Tempel von Elista, der Hauptstadt Kalmückiens. Im südeuropäischen Teil Russlands, nordwestlich des kaspischen Meeres, lebt das einzige mehrheitlich buddhistische Volk Europas: die Kalmücken. Ihre autonome Republik besteht überwiegend aus Steppe und ist mit knapp vier Bewohnern pro Quadratkilometer extrem dünn besiedelt. Erst seit dem Zusammenbruch der Sowjetunion darf hier der Buddhismus wieder offizieall ausgelebt werden Sie sprechen russisch, kalmückisch und tibetisch. Jeder der jungen Mönche hat seinen eigenen Beweggrund, diesen Weg zu beschreiten. In der ehemaligen Sowjetunion glich die öffentliche Bekundung, Buddhist zu sein, einem Todesurteil. Ein Verwandter Sanans, der ebenfalls buddhistischer Mönch war, opferte damals sein Leben, um seinen Glauben und seine Berufung nicht verraten zu müssen. Sanans Mutter wollte aufgrund dieser tragischen Familiengeschichte einen ihrer Söhne ins Kloster senden - und Sanan erfüllt diese Berufung mit Stolz. Die Kalmücken gelten als westlicher Zweig der Mongolen. Sie ließen sich seit dem 17. Jahrhundert in der Steppe nahe dem kaspischen Meer nieder. Nach der russischen Revolution 1917 wurden alle Tempel und Klöster in Kalmückien zerstört, Lamas und Mönche getötet oder als Gefangene in Arbeitslager deportiert. Sie kehrten erst 1956 nach Kalmückien zurück, nach dem Tod Stalins. Aus diesem Grund gab es bis zum Zusammenbruch der Sowjetunion nahezu keine Lamas oder lebende buddhistische Übertragung mehr in Kalmückien. Seit Anfang der 1990er Jahre existiert das Kloster in Elista wieder, und Sanan will mithelfen, das buddhistische Erbe seiner Heimat neu aufleben zu lassen. DE 2011'
