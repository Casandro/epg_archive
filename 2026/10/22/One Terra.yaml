  title: Planet Weltweit - St. Helena, vergessen im Atlantik
  subtitle: Planet Weltweit - St. Helena, vergessen im Atlantik
  description: "Einsam und allein liegt das britische Übersee-Territorium St. Helena mitten im Atlantischen Ozean. Kaum eine bewohnte Insel der Welt ist weiter entfernt von jeglicher Nachbarschaft. 2000 Kilometer sind es bis zur afrikanischen und 3000  bis zur südamerikanischen Küste. Dass die Briten den französischen Kaiser Napoleon hierher in die Verbannung  schickten, hat seinen Grund. Von St. Helena gab und gibt es praktisch kein Entkommen. Noch heute ist ein Schiff die einzige Verbindung mit der Außenwelt, ein Flughafen existiert nicht. Rund 4.000 Menschen trotzen der Einsamkeit. Die \"Saints\", wie sie sich nennen, harren aus auf ihrer Insel im Ozean. Wir setzen einen Fuß auf das isolierte Eiland und zeigen, wie das Leben mitten im Südatlantik möglich ist.\n\nSt. Helena, so die Planung im fernen London, sollte endlich einen Flughafen bekommen. Für Michael Benjamin ein Grund, nach 33 Jahren im Ausland auf seine Heimatinsel zurückzukehren. Er hat alles auf eine Karte gesetzt. Mit einem  Gastronomiebetrieb will er zuerst Bauarbeiter versorgen und später die Touristen. Das neue Wohnhaus ist bezogen, Frau  und Sohn leben auch schon auf der Insel - nur der Beschluss zum Flughafenbau wurde rückgängig gemacht. Die Zentralregierung in London hat wegen der Finanzkrise plötzlich kein Geld mehr für sein entferntes Übersee-Territorium. Die Pläne für den ersehnten Flughafen liegen auf Eis - St. Helena bleibt abgeschnitten vom Rest der  Welt. Für Michael Benjamin und seine Familie ist diese Situation existenzbedrohend. Ohne Flughafen bietet die  abgelegene Atlantikinsel praktisch keine Perspektiven. Wovon sollen die drei nun leben? Der Alltag auf St. Helena  wird für die Benjamins zu einem Überlebenskampf mit ungewissem Ausgang. \nDie Reportage begleitet weitere Menschen bei Ihrer Rückkehr nach St. Helena.  Nach 21 Jahren zieht es auch die gebürtige Insulanerin Winnie Thomas mit ihrer Tochter Annalise aus England zurück in die Isolation. Notgedrungen und  aus traurigem Anlass. DE 2009"
  ageRating: 6
