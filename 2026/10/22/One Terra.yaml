  title: Planet Weltweit - Die Honigsammler von Yunnan
  subtitle: Planet Weltweit - Die Honigsammler von Yunnan
  description: "Schon seit Jahrtausenden ziehen Wanderimker durch China. Sie stellen ihre Bienenkörbe immer genau dort auf, wo die Pflanzen blühen, die einen besonders wohlschmeckenden oder medizinisch wirksamen Honig ergeben. Der größte Teil der chinesischen Wanderimker ist in Yunnan unterwegs, im bergigen Südwesten Chinas. Luft, Wasser und Böden sind hier deutlich sauberer, als im Rest des Riesenreiches. Der Honig aus Yunnan gilt seit jeher als der beste Chinas.\nMit Sack und Pack und der ganzen Familie zieht der 33-jährige Xing Bangwang zusammen mit vielen anderen Wanderimkern am Ende des Sommers in die Region Dongchuan, dem \"roten Land\". Dort blüht ab August der weiße Raps, ein ergiebiger Energielieferant. Er hat einen besonders zuckerreichen Nektar und garantiert damit einen hochwertigen Honig. Nur seit Jahren schon fällt das Saisonfinale ins Wasser, denn die sommerliche Regenzeit dauert viel zu lang und ist zu nass für die empfindlichen Honigbienen. Xing hofft, dass es dieses Jahr anders ist. \nChen Chunfeng, 29, ist noch ein Neuling auf dem Imker-Gebiet. Weil er nicht länger in einer Maschinenfabrik arbeiten wollte, kündigte er seinen Job und sattelte um, \"zurück zur Natur\". Darüber zerbrach jedoch seine Ehe, die kleine Tochter sieht er nur noch selten. Das will er ändern und nicht zuletzt seiner Frau beweisen, dass er auch als Imker erfolgreich sein kann. Denn dann, so hofft vor allem die Tochter, gibt es vielleicht eine zweite Chance für die Familie. Chen stellt seine Bienenvölker bevorzugt im Süden der Provinz auf, nahe des Roten Flusses, wo die Bauern kaum Pestizide einsetzen. Sein Bio-Honig ist jetzt schon begehrt. Um den noch besser zu vermarkten, will er sich als Marketingaktion einen spektakulären \"Bienenbart\" wachsen lassen. Aber wird er den Mut aufbringen, sich vor laufenden Kameras von zigtausend Bienen bedecken zu lassen? \n DE 2016"
