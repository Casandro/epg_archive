  title: Planet Weltweit - Stilikone Panamahut
  subtitle: Planet Weltweit - Stilikone Panamahut
  description: "Der Panamahut ist der wohl berühmteste Hut der Welt. Dennoch ist über seine wahre Herkunft - er kommt aus Ecuador, nicht aus Panama - und über die aufwendige Kunst des Strohhutflechtens wenig bekannt. Die feinsten Panama Hüte werden auch heute noch von Königshäuptern getragen und Prominente schmücken sich gerne damit. Sie bezahlen Preise von bis zu 10.000 Euro pro Hut, weil sie die Einzigartigkeit und Qualität zu schätzen wissen. Umso erstaunlicher erscheint es da, das die jahrhundertealte Tradition des Strohhutflechtens in Ecuador völlig zu verschwinden droht. Ein Film über die unbekannten Hutflechter von Ecuador. \n\nSchon lange haben die jungen Ecuadorianer kein Interesse mehr am Flechten der  Panamahüte. Die Arbeit ist ihnen körperlich zu hart und die Bezahlung reicht kaum zum Leben. Zu lange sind die Hutflechter von skrupellosen Mittelsmännern ausgebeutet worden. In den letzten Jahren sind außerdem viele tausend Hutflechter in die USA oder nach Spanien ausgewandert. Zusätzlich macht die industrielle Billigware aus China den Hutexporteuren aus Ecuador schwer zu schaffen. Der 40jährige Hutflechter Simon Espinal aus dem Küstenort Pilé, die 39jährige Hutflechterin Carmen Florinda Portillo aus dem Andendorf Yuel und der Panamahut-Liebhaber Brent Black aus Hawaii sorgen sich um den Erhalt des Panamahutes. Sie kämpfen auf unterschiedliche, sehr persönliche Weise für den Fortbestand der alten Herstellungsweise. Planet Weltweit gibt Einblicke in die Alltagswelten von Simon und Carmen und deren Familien. Ein hartes, entbehrungsreiches aber auch ein zufriedenes Leben zwischen traditioneller Arbeit an den Hüten und familiärer Gemeinschaft im Dorf. Wir erfahren, weshalb auch sie sich beinahe eine andere Arbeit gesucht hätten und weshalb sie nun doch noch eine Hoffnung für ihr Leben und die Zukunft des Panamahutes sehen. Simon ist stolz auf seine Arbeit und hat seinen drei Kindern das Flechten der Strohhüte schon beigebracht. DE 2011"
