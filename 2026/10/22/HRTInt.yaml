- eventId: 945274
  start: 2026-10-22T20:03:00Z
  stop: 2026-10-22T20:38:00Z
  title: 'Što je klasik? M. Držić: Skup - Književnost i novčanik'
  subtitle: ' '
  description: Koliko nam vrijedi ono što posjedujemo? Prije gotovo petsto godina Marin Držić napisao je Skupa, komediju o čovjeku koji je pronašao zlato, a s njim izgubio mir, povjerenje i bliskost s drugima. "Amor nije amor, zlato je amor", govori Skup. Od Dubrovnika 16. stoljeća do danas, jesmo li se doista toliko promijenili? O vezi književnosti i novca govori Maša Kolanović, a Skupa, kojega je ove godine igrao na Dubrovačkim ljetnim igrama, iz perspektive glumca tumači Frano Mašković, dobitnik Orlanda za najbolje umjetničko ostvarenje u dramskom programu.
