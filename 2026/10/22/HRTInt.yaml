  title: Luda kuća (3), humoristična serija (31/34)
  subtitle: ' '
  description: 'Bivša pospremačica Majerovih Brankica Bedeković uganula je nogu u Norveškoj, gdje privremeno čuva djecu jednog bogataša. Nećaku Slavku šalje avionsku kartu za Oslo, kako bi joj pomogao. No, Slavko se boji letenja i traži zamjenu.  U stanu kod Majerovih je nepozvan gost, bahati Miljenkov agent Mlinac, koji se skriva od glumca koji mu prijeti.  Stanari Lude kuće uključeni su u rješavanje Slavkovog i Mlinčevog problema. Izlaz iz neugodne situacije vide u Boženinom prijedlogu: umjesto Slavka za Norvešku leti agent Mlinac. Gostuju: Saša Buneta i Igor Mešin Uloge: Jelena Milholjević, Ljubo Zečević, Ivan Glowatzky, Marinko Prga, Ljubomir Kapor, Nada Gaćešić Livaković, Jadranka Đokić, Pjer Meničanin Scenaristice: Zinka Kiseljak, Dora Delbianco, Tanja Kirhmajer Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
- eventId: 978711
