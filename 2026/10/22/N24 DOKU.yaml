  title: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  subtitle: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  description: Entlang der 2.000 Meilen langen Grenze zwischen Texas und Mexiko arbeiten Grenzbeamte an einem der sensibelsten Übergänge der Welt. Täglich müssen sie den legalen Verkehr ermöglichen und gleichzeitig gefährliche Schmuggelware stoppen. Diese Folge begleitet sie bei riskanten Einsätzen, einer heiklen Übergabe mutmaßlicher Kartellmitglieder, bewegenden Asylgeschichten und Momenten, in denen persönliche Schicksale auf harte Grenzrealität treffen.
  widescreen: true
- eventId: 922834
  start: 2026-10-22T06:01:00Z
  stop: 2026-10-22T06:56:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  description: Entlang der texanisch-mexikanischen Grenze stehen die US-Grenzbeamten täglich vor enormen Herausforderungen. An einem der meistfrequentierten Übergänge führt ein verdächtiges Röntgenbild zu einem riskanten Einsatz, bei dem Drogen raffiniert versteckt sind. Währenddessen gelingt ein spektakulärer Schlag gegen den Drogenschmuggel, und an einer weiteren Grenzbrücke spitzt sich die Lage zu, als Migranten versuchen, die Absperrungen zu überwinden.
  widescreen: true
