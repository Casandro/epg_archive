  title: Spacetime
  subtitle: Die dunkle Seite - Schwarze Löcher und unsichtbare Materie
  description: 'Die Erde ist umgeben von Dunkler Materie und Dunkler Energie - mysteriösen Kräften, die das gesamte All durchziehen und so die Entwicklung unseres Universums maßgeblich bestimmen. Wissenschaftler sehen die Auswirkungen dieser kosmischen Rätsel, doch ihren Ursprung kennen sie nicht. Auch Schwarze Löcher gehören dazu: Gravitationsmonster, die alles in sich hineinziehen. In dieser Folge Spacetime versucht der Wissenschaftler Ulrich Walter, Licht in die dunklen Teile des Weltraums zu bringen.'
  widescreen: true
- eventId: 922871
  start: 2026-10-22T13:00:00Z
  stop: 2026-10-22T13:54:00Z
  title: Spacetime
  subtitle: Gravitation - Kraft, die alles zusammenhält
  description: Am 14. September 2015 messen zwei Detektoren in den USA zum allerersten Mal Gravitationswellen. Das bestätigte einmal mehr Einsteins Allgemeine Relativitätstheorie, die besagt, dass das Raum-Zeit-Gefüge nicht statisch ist. Doch was ist Gravitation? Warum ziehen sich Massen an? Wieso schwebt der Mensch im All und ist Schwerelosigkeit auch auf der Erde möglich? Wissenschaftler und Astronaut Ulrich Walter erklärt, was es mit der unsichtbaren Kraft auf sich hat.
  widescreen: true
- eventId: 922872
  start: 2026-10-22T13:54:00Z
  stop: 2026-10-22T14:47:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: SETI-Institut'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: SETI-Institut'
  description: Das SETI-Institut widmet sich der Erforschung des Universums und der Frage, ob es außerirdisches Leben gibt. Doch im Oktober 2017 wurden die renommierten Wissenschaftler vor ein Rätsel gestellt. Ein seltsames Objekt, genannt Oumuamua, rauschte auf die Erde zu. Es war stolze 800 Meter lang, aber nur 80 Meter breit. Die Oberfläche des unbekannten Himmelsobjekts reflektierte zehnmal stärker als die eines gewöhnlichen Kometen. Handelte es sich um ein Raumschiff?
  widescreen: true
- eventId: 922873
  start: 2026-10-22T14:47:00Z
  stop: 2026-10-22T15:41:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Wales'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Wales'
  description: In den frühen Morgenstunden des 27. Februar 2016 erleben die Einwohner von Pentyrch etwas, das ihr Leben verändert und UFO-Interessierte weltweit erschüttert. Zeugen beschreiben ein riesiges pyramidenförmiges Objekt über einer Baumgruppe. Eine Armada von Militär-Flugzeugen und Hubschraubern greift das Flugobjekt an und liefert sich eine Schlacht mit ihm. Es sind Szenen wie aus einer Mystery-Serie, nur spielen sie sich in einem beschaulichen Dorf im Süden von Wales ab.
  widescreen: true
- eventId: 922888
  start: 2026-10-22T15:41:00Z
  stop: 2026-10-22T16:30:00Z
  title: 'Strip the Cosmos: Die Große Mauer'
  subtitle: 'Strip the Cosmos: Die Große Mauer'
  description: Die Große Mauer ist eine Ansammlung tausender von Galaxien, die typischerweise eine abgeflachte Form haben. Sie ist die größte zusammenhängende Struktur, die bisher im Universum entdeckt wurde. Warum und wie entstand diese dichte Anordnung von Galaxien, die sich zu dem sie umgebenden Raum abgrenzt? Die Dokumentation widmet sich den neuesten wissenschaftlichen Erkenntnissen über die Große Mauer und untersucht hierbei einen Zeitraum von sechs Milliarden Lichtjahren.
  widescreen: true
- eventId: 922889
  start: 2026-10-22T16:30:00Z
  stop: 2026-10-22T17:16:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 1'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 1'
  description: 'Die US-Zoll- und Grenzschutzbehörde im Dauereinsatz an der meistfrequentierten Grenze der Welt: In dieser Folge wird eine Lieferung scheinbar harmloser Kartonverpackungen zur tödlichen Falle. Heroin, getarnt als Laptop, bringt selbst hochmoderne Spürtechnik an ihre Grenzen. Und: Agrar-Spezialisten decken eine gefährliche Insektenplage auf - rechtzeitig, bevor Amerikas Wälder bedroht werden.'
  widescreen: true
- eventId: 922890
  start: 2026-10-22T17:16:00Z
  stop: 2026-10-22T18:15:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 2'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 2'
  description: Die US-Grenze zu Mexiko ist ein Hotspot für Schmuggel und Gewalt. In dieser Folge werden Grenzschützer bei der riskanten Übergabe eines Kartell-Killers an die mexikanische Armee begleitet. 32 Kilo Drogen werden bei einer Kontrolle entdeckt, während ein Mann mit einem Aluschuppen und einem abgebrochenen Schlüssel für Aufregung und Lächeln an der Gateway to the Americas Bridge sorgt.
  widescreen: true
- eventId: 922911
  start: 2026-10-22T18:15:00Z
  stop: 2026-10-22T19:10:00Z
  title: Mayday - Sturzflug in den Pazifik
  subtitle: Mayday - Sturzflug in den Pazifik
  description: Der Alaska-Airlines-Flug 261 stürzt am 31. Januar 2000 auf dem Weg vom mexikanischen Urlaubsort Puerto Vallarta nach Seattle in den Pazifik. Alle 88 Personen an Bord kommen dabei um. Obwohl die erfahrenen Piloten den ersten Sturzflug der McDonnell MD-83 abfangen können, sind sie bei einem weiteren Sturzflug machtlos. Nachdem 85 Prozent der Trümmer und die Blackboxen aus dem Meer geborgen werden, rekonstruieren Luftfahrtexperten der US-Verkehrsbehörde NTSB die Ursache des Absturzes.
  widescreen: true
- eventId: 922912
  start: 2026-10-22T19:10:00Z
  stop: 2026-10-22T20:05:00Z
  title: Mayday - Fußballteam Chapecoense
  subtitle: Mayday - Fußballteam Chapecoense
  description: 2016 erreicht die brasilianische Überraschungsmannschaft Chapecoense das Finale der Copa Sudamericana. Das Spiel soll in Kolumbien stattfinden. Doch die Maschine der bolivianischen Fluggesellschaft LaMia mit der Mannschaft an Bord stürzt kurz vor der Landung in Rionegro in einen Berg. 71 Menschen sterben. Per Funk hatten die Piloten von einem "Treibstoffproblem" gesprochen. Die Experten der kolumbianischen Unfallbehörde müssen die Ursachen für das Unglück herausfinden.
  widescreen: true
- eventId: 922913
  start: 2026-10-22T20:05:00Z
  stop: 2026-10-22T21:05:00Z
  title: Mayday - Steigflug nach unten
  subtitle: Mayday - Steigflug nach unten
  description: Es ist der 8. Januar 2016. Der West-Air-Sweden-Flug 294 ist auf dem Weg von Oslo nach Tromso, einem Ort tief in der norwegischen Arktis. Die beiden Piloten des CRJ200 Cargo-Flugzeugs sind sehr erfahren. Doch plötzlich fällt das Flugzeug förmlich aus dem Himmel und schlägt mit einer Geschwindigkeit von mehr als 950 Kilometern pro Stunde in der schwedischen Arktis auf dem Boden auf. Den Ermittlern zeigt sich ein erschreckendes und chaotisches Bild. Wie konnte es zu dieser Tragödie kommen?
  widescreen: true
- eventId: 922924
  start: 2026-10-22T21:05:00Z
  stop: 2026-10-22T22:05:00Z
  title: Lost Places - Folge 129
  subtitle: Lost Places - Folge 129
  description: 'Ein idyllisch gelegenes Sanatorium wird im Zweiten Weltkrieg zum Schauplatz unvorstellbarer Verbrechen: In Hohenlychen in der Uckermark führt der NS-Arzt Karl Gebhardt grausame Experimente an KZ-Häftlingen durch. Wie konnte ein Ort der Heilung zur Hölle auf Erden werden? Außerdem: Eine gigantische Zinnmaschine im von Kolonialmächten umkämpften Malaysia, ein texanisches Arbeitslager zwischen Hoffnung und Ausbeutung - und ein italienisches Dorf, das von der Natur ausgelöscht wird.'
  widescreen: true
- eventId: 922925
  start: 2026-10-22T22:05:00Z
  stop: 2026-10-22T22:56:00Z
  title: Lost Places - Folge 130
  subtitle: Lost Places - Folge 130
  description: 'Verlassene Gebäude in El Paso erzählen von einer Revolution ab 1910 - und von Spannungen an der US-mexikanischen Grenze, die bis heute nachwirken. Hier plante ein Rebellenführer den Sturz von Diktator Díaz, der das Land nachhaltig veränderte. Außerdem: Der sowjetische Militärflugplatz Sperenberg mit deutsch-deutscher Geschichte - von hier floh Erich Honecker ins Exil nach Moskau. Dazu: ein irisches Herrenhaus und einstiger IRA-Stützpunkt sowie die Geisterstadt Granadilla in Spanien.'
  widescreen: true
- eventId: 922926
  start: 2026-10-22T22:56:00Z
  stop: 2026-10-22T23:45:00Z
  title: Lost Places - Folge 95
  subtitle: Lost Places - Folge 95
  description: 'Faszinierende Überreste vergangener Zeiten: Im schottischen Edinburgh erzählen unterirdische Gewölbe eine Geschichte von Aufbruch, Niedergang und Elend. Außerdem: Ein Fort an Kroatiens Küste, erbaut von einem vergangenen Reich zum Schutz einer mächtigen Flotte. Eine verlassene Fabrik in Island, die mit flüssigem Gold für wirtschaftlichen Aufschwung sorgte. Und: die Spuren einer Schlacht auf amerikanischem Boden, die die USA erschütterte.'
  widescreen: true
- eventId: 922927
  start: 2026-10-22T23:45:00Z
  stop: 2026-10-23T00:31:00Z
  title: Lost Places - Folge 96
  subtitle: Lost Places - Folge 96
  description: 'Die Ruinen eines Luxushotels an der Adria dienten als perfekte Kulisse für ein episches Duell der Serie "Game of Thrones". Doch warum wurde das einst so opulente Belvedere in Dubrovnik zerstört? Außerdem: Bei 130 Dezibel liegt die Schmerzgrenze für das menschliche Gehör. Dieser Schalldruckpegel entspricht einem startenden Düsenflugzeug, wurde aber auch bei einem Konzert der Metalband Motörhead 1984 im Variety Theatre von Cleveland erreicht. Was wurde aus der Konzertlocation?'
  widescreen: true
