  stop: 2026-10-22T05:06:00Z
  title: Geniale Maschinen - Geschwindigkeitsrekorde
  subtitle: Geniale Maschinen - Geschwindigkeitsrekorde
  description: Seit der Entwicklung des Autos strebt der Mensch danach, immer schnellere und effizientere Fahrzeuge zu entwickeln. Der Bugatti Chiron Super Sport 300+ hat eine Leistung von bis zu 1600 PS und kann mehr als 400 Kilometer pro Stunde schnell fahren - eine Meisterleistung der Automobiltechnik.  Jenseits der Straßen erreichte das ThrustSSC, ein schubkraftgetriebenes Auto, eine Geschwindigkeit von über 1200 Kilometern pro Stunde und durchbrach damit als erstes Landfahrzeug die Schallmauer.
  widescreen: true
