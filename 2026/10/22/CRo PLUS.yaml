  stop: 2026-10-22T01:05:00Z
  title: Zprávy
- eventId: 957710
  start: 2026-10-22T01:05:00Z
  stop: 2026-10-22T01:33:00Z
  title: Na Východ!
  description: 80 metrů pod mořem. Nikdo, včetně elitních vojenských amerických potápěčů v americké armádě, nemá výcvik na potápění hlouběji než do 40 metrů. A potom je tu diverzní ukrajinská skupina, která se v sychravém podzimním počasí spustila na dno Baltského moře, aby poškodila produktovody Nord Stream 1 a 2. Detektivní příběh, který mu prý "závidí každý novinář", vypráví Josefu Pazderkovi a Ondřeji Soukupovi americký novinář Bojan Pancevski z listu Wall Street Journal.
- eventId: 957711
  start: 2026-10-22T01:33:00Z
  stop: 2026-10-22T02:00:00Z
  title: Pro a proti
  description: Větrné elektrárny u domů nechceme. Z jednadvaceti místních referend, která se konala souběžně s komunálními volbami, obyvatelé ve dvaceti případech výstavbu větrných elektráren odmítli. Do jaké míry přispěly k odporu místních obyvatel netransparentní vymezování akceleračních zón, vybičované emoce a šíření dezinformací? A jaký přínos mají větrné elektrárny pro českou energetiku? Zeptáme se termojaderného fyzika Jana Horáčka a Ondráše Přibyla, vedoucího projektu Fakta o klimatu. Moderuje Lukáš Matoška.
- eventId: 957712
  start: 2026-10-22T02:00:00Z
  stop: 2026-10-22T02:05:00Z
  title: Zprávy
- eventId: 957713
  start: 2026-10-22T02:05:00Z
  stop: 2026-10-22T03:00:00Z
  title: Návraty časem
  subtitle: Výběr toho nejlepšího z archivních pořadů stanice mluveného slova.
  description: Jaká byla pro USA léta prezidenta Jamese Cartera? A kdy byla promarněna šance na pokojné soužití Čechů a Němců v meziválečné republice? Témata pro reprízy pořadů Archiv Plus a Historie věčně živá, které připravili Pavel Hlavatý a Ivan Štern.
