  title: Pro a proti
  description: Větrné elektrárny u domů nechceme. Z jednadvaceti místních referend, která se konala souběžně s komunálními volbami, obyvatelé ve dvaceti případech výstavbu větrných elektráren odmítli. Do jaké míry přispěly k odporu místních obyvatel netransparentní vymezování akceleračních zón, vybičované emoce a šíření dezinformací? A jaký přínos mají větrné elektrárny pro českou energetiku? Zeptáme se termojaderného fyzika Jana Horáčka a Ondráše Přibyla, vedoucího projektu Fakta o klimatu. Moderuje Lukáš Matoška.
