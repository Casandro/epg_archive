  title: Na Východ!
  description: 80 metrů pod mořem. Nikdo, včetně elitních vojenských amerických potápěčů v americké armádě, nemá výcvik na potápění hlouběji než do 40 metrů. A potom je tu diverzní ukrajinská skupina, která se v sychravém podzimním počasí spustila na dno Baltského moře, aby poškodila produktovody Nord Stream 1 a 2. Detektivní příběh, který mu prý "závidí každý novinář", vypráví Josefu Pazderkovi a Ondřeji Soukupovi americký novinář Bojan Pancevski z listu Wall Street Journal.
