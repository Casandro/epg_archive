  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (3/15) Část třetí: Předehra, léta 1949 - 1951. Počátkem roku 1949 nastal v sovětském impériu hon na titovské trockistické špiony a hysterie otřásla nejvíc Maďarskem. Inscenovaný proces s loajálním stalinistou László Rajkem spustil velký teror, který poznamenal víc než milion lidí. Byla to další demonstrace věrnosti sovětským pánům, stejně jako absurdnosti maďarské ekonomiky ctící pravidlo, podle něhož smyslem kolonie je obohacovat impérium. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
