- eventId: 957809
  start: 2026-10-22T03:05:00Z
  stop: 2026-10-22T03:30:00Z
  title: Interview Plus
  description: Pavlína Žáková, ředitelka sekce hospodářské politiky Svazu průmyslu a dopravy. Sněmovna v prvním kole podpořila vládní návrh na zavedení mimořádné daně na rafinerie. Proč proti zavedení daně protestuje nejen opozice, ale také Svaz průmyslu a dopravy? Postupuje vláda správně při regulaci cen pohonných hmot? Zeptá se Petr Vizina.
