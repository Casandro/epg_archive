  title: 'Doktor z alpejskiej wioski - nowy rozdział: odc.16'
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007) odc.16, Zeitenwende - Teil 2
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Małżeństwo z Monachium ma kupić farmę Gruberów. Lisbeth szykuje się do wyjazdu z Ludwigiem do Wiednia. Martin prosi stryja, by nie mówił kobiecie o kłótni, do której doszło w dniu śmierci jego ojca. Jana odzyskuje wzrok. Anton boi się, że żona zostawi go dla trenera wspinaczki. Niebawem okazuje się, że jest chory.
    Reżyser: Nikolai Müllerschön
    Od lat: 12
