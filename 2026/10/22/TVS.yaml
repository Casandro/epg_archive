  title: Rosamunde Pilcher - Mgła nad zamkiem Kilrush
  subtitle: Po tragicznej śmierci narzeczonego Keira wycofuje się z życia i zamieszkuje w rodzinnej posiadłości na południu Irlandii. Jej ojciec zatrudnia tam amerykańskiego szepta koni Patricka O'Connella.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Nebel über Schloss Kilrush
    DE,AT, 2007
    Reżyseria: Andi Niessner
    Występują: Lara-Joy Körner, Hendrik Duryn, Reiner Schöne, Mathias Herrmann, Kerstin Gähte, Rudi Knauss
    Od czasu przypadkowej śmierci narzeczonego Keira mieszka na wiejskiej posiadłości rodziców na południu Irlandii. Oprócz pięknej posiadłości, jej rodzice Samuel i Cathleen Kilrush prowadzą prestiżowy biznes hodowlany koni, którym głównie zajmuje się brat Keiry, Jacob. Keira obwinia siebie i swojego ulubionego konia Otella za wypadek i całkowicie wycofała się z życia konia po tragicznym wydarzeniu. Z troski o Otella Samuel zatrudnia amerykańskiego szepta koni Patrick O'Connell.
  ageRating: 12
