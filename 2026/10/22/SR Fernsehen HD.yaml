  title: Eisenbahn-Romantik (826)
  subtitle: Die Brenztalbahn
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Vor mehr als 160 Jahren bekam die Ostalb zwischen Aalen, Heidenheim und Ulm Gleisanschluss. "Eisenbahn-Romantik" blickt zurück auf die Geschichte dieser gut 70 Kilometer langen Hauptbahn. Es geht um die Frage, warum die Strecke von Aalen nach Heidenheim bereits 1864 eröffnet wurde und die Weiterführung nach Ulm erst zwölf Jahre später erfolgte. Der Film beleuchtet aber auch zukünftige Fragen, etwa inwieweit ein zweigleisiger Ausbau der Strecke wahrscheinlich ist.
