  subtitle: 'Reinhard Henkel: "Jesus ist der Hauptgeschäftsführer"'
  description: |-
    Gerechtigkeit ist für Reinhard Henkel keine Theorie, sondern tägliche Verantwortung. Aufgewachsen in einer christlichen Familie in der DDR erlebt er früh, was es bedeutet, wegen des Glaubens anzuecken. Statt Abitur und Karriereplänen macht er zunächst eine Maurerlehre und verweigert später als überzeugter Christ den Wehrdienst mit der Waffe. Nach der Wende studiert er Bauingenieurwesen und Architektur, übernimmt schließlich den kleinen Betrieb seines Vaters - und baut daraus gemeinsam mit seinem Team zwei erfolgreiche Unternehmen mit rund 80 Mitarbeitenden auf. Reinhard Henkel erzählt von existenziellen Krisen, schmerzhaften Rückschlägen und überraschenden Wendungen, die er bis heute als Wunder Gottes erlebt. Für ihn ist klar: Unternehmer sind Verwalter - und Jesus Christus der eigentliche "Hauptgeschäftsführer".
    Warum ihm Gerechtigkeit, Verlässlichkeit und Verantwortung wichtiger sind als schneller Erfolg, erzählt er in dieser Sendung.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
