  description: |-
    Anne Löwen und ihr Mann haben nach vier eigenen Kindern entschieden, ein Pflegekind aufzunehmen. Die Beweggründe und der Weg zur Pflegefamilie.

    Ein Pflegekind aufzunehmen, verändert Leben. Nicht nur das eigene, sondern vor allem das Leben des Pflegekindes. Im besten Fall hat das Kind eine zweite Chance auf eine Kindheit mit viel Nähe, Liebe und Sicherheit. Anne Löwen und ihr Mann haben sich entschieden, einem Kind das es braucht, ein Zuhause zu geben. Sie haben ihr Haus und ihr Herz geöffnet.
    Wer selbst ein Pflegekind aufnehmen möchte, kann sich bei seinem örtlichen Jugendamt informieren.

