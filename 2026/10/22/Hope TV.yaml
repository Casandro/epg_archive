  title: ungeschminkt. family
  subtitle: Freundinnen - wo sind sie eigentlich hin?
  description: |-
    Als Erwachsene wird es oft schwieriger, Freundschaften zu pflegen oder neue Freundinnen zu finden. Kinder, Beruf, unterschiedliche Lebensentwürfe und Entfernungen verändern Beziehungen. Wir sprechen darüber, warum Freundschaften manchmal auseinandergehen, wie neue Freundschaften entstehen und was eine gute Freundin ausmacht. Und sie fragen: Muss eine Freundschaft ein Leben lang halten - oder darf sie sich auch verändern?

