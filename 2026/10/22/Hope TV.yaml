  title: Kingdom Manifesto - Manifest des Himmelreichs
  subtitle: Ich aber sage - Teil 2
  description: |-
    In der vierten Episode beschäftigen sich Ty Gibson und David Asscherick mit den Versen 31 - 48 aus Matthäus Kapitel 5. Durch ihren Blick auf die "Ihr-habt-gehört... / Ich-aber-sage-euch"-Prozesse in diesem Kapitel wird unser Blick auf die Gebote Gottes geweitet. Jesus nimmt eine Gegenposition ein, die sich nicht gegen die Gesetze des Alten Testamentes richtet, sondern gegen die rabbinischen Vorschriften. Jesus verschärft die Gesetze, geht zum Kern der Gebote und erhöht damit den Standard. Es geht nicht darum, die Buchstaben zu erfüllen, sondern uns so zu verhalten, wie Gott es getan hat, der allen(!) Menschen Sonne, Regen, Segen schenkt, freundlich ist zu allen Menschen, ohne Unterschied. Lieben, wie Gott liebt!

    Weitere Infos unter: hopetv.de
