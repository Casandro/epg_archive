  title: Damals in Amerika
  subtitle: Die Geschichte Alaskas
  widescreen: true
  hd: true
  description: 'Zu Beginn des 20. Jahrhunderts ist Alaska ein eisiges, von wenigen Ureinwohnern bewohntes Land im hohen Norden Amerikas. 1896 bringt der Goldrausch von Klondike einen ersten Besiedlungs- und Entwicklungsschub. Nach dem Börsencrash 1929 wird Alaska Teil des New-Deal-Programmes, mit dem die amerikanische Regierung unter Franklin D. Roosevelt den Zusammenbruch der Wirtschaft für die Menschen abfedern will. Als schließlich Öl gefunden wird, hat das Land genug Gewicht für die Selbständigkeit: 1959 wird es 49. Bundesstaat der USA. Bis heute bewahrt es seinen besonderen Charakter als Amerikas "last frontier", letzter Außenposten der USA.'
