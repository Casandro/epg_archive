  title: Damals in Amerika
  subtitle: Die Geschichte der Einwanderer
  widescreen: true
  hd: true
  description: '1886 machte Frankreich Nordamerika die Freiheitsstatue zum Geschenk: "Gebt mir eure Müden und Armen, eure geknechteten Massen, die frei zu atmen begehren!", verkündet die Inschrift. Seitdem hat ''Lady Liberty'' im Hafen von Ellis Island Millionen von Einwanderern aus aller Welt empfangen. Auf frühen, nachträglich mit Farbe versehenen Aufnahmen der Filmgeschichte, sieht man die Erleichterten, die die Torturen der Überfahrt und das Prozedere der Einwanderungsbeamten überstanden haben, wie sie sich mit Donuts stärken. Von New York aus ziehen sie in alle Teile des Landes, um ihr Glück zu versuchen.'
