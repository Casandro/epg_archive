  subtitle: Was gibt uns Sicherheit?
  description: |-
    Inflation, Kriege, Klimakrise: Die Welt scheint aus dem Takt geraten. Für Am Puls fragt Christian Sievers, was uns in einer Zeit dauerhafter Unsicherheit noch Halt gibt. Der Verteidigungsminister an der NATO-Ostflanke, ein Unternehmer unter dem Druck irrwitziger Zölle und ein junges Paar, das sich gegen ein zweites Kind entscheidet: Die globalen Krisen wirken bis in das Leben jedes Einzelnen hinein. Für Am Puls untersucht Christian Sievers ein Grundgefühl der Gegenwart: Kontrollverlust. Die Krisen stapeln sich nicht nur, sie werden auch zum Dauerzustand.

    Wie verändert die wachsende Verunsicherung unseren Blick auf die Zukunft?
