  title: 9/11 - Der lange Schatten des Terrors
  subtitle: Spaltung
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Die Terroranschläge von 9/11 veränderten die Welt. Die Dokumentation zeichnet nach, wie sie die politische Spaltung in den USA befeuerten - und wie Menschen mit den Folgen fertigwerden.

    Hat der "War on Terror" letztlich mehr Radikalisierung erzeugt als verhindert? Bilder aus Guantánamo, Bagdad und Kabul untergruben die Glaubwürdigkeit der amerikanischen Einsätze und verstärkten die Spaltung, die Donald Trump für seinen eigenen Aufstieg nutzen konnte.
    HD-Produktion
- eventId:
