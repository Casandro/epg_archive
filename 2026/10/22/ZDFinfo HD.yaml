    "Terra X" forscht nach den Wurzeln des modernen Europa. "Große Völker - Die Karthager" schildert die Geschichte der einflussreichsten Handelsmacht in der Antike.

    Die meisten Berichte über die Karthager stammen von ihren Konkurrenten - den Griechen und Römern - und sind wenig objektiv. Die Karthager gelten als verschlagene Händler und grausame Kindsmörder. Doch Forscher haben herausgefunden: Sie waren besser als ihr Ruf.
