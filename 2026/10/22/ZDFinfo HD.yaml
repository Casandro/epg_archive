  title: Die Erde - Entstehung des Lebens
  subtitle: Inferno
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Vor rund 252 Millionen Jahren ereignet sich das schlimmste Massenaussterben in der Erdgeschichte. Es vernichtet fast alles Leben auf dem Planeten und verursacht Verwüstung und Zerstörung.

    Ein Vulkanausbruch führt in der Folge zu einer weltweiten Klimaveränderung und zum Zusammenbruch ganzer Ökosysteme. Bis zu 90 Prozent aller Arten sterben aus. Doch das Leben auf der Erde findet einen Weg, sich zu erholen. Die Ära der Dinosaurier beginnt.
    HD-Produktion
