  stop: 2026-10-22T02:05:00Z
  title: Im Schatten der Türme - Der Krieg gegen den Terror
  subtitle: Vergeltung in Afghanistan
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Australien 2021
    Nach den Anschlägen vom 11. September 2001 durch das Terrornetzwerk Al-Kaida wollen die USA und ihre Verbündeten Vergeltung. Sie beginnen einen Krieg in Afghanistan, der 20 Jahre dauern soll.

    Erste Erfolge wecken übermäßige Hoffnungen, das Land bald kontrollieren zu können. Doch es gelingt nicht, eine stabile Regierung aufzubauen oder zuverlässige Sicherheitskräfte auszubilden. Der Abzug der ausländischen Truppen 2021 besiegelt das Scheitern.
    HD-Produktion
- eventId:
  - 1571801
  - 610077
  start: 2026-10-22T02:05:00Z
  stop: 2026-10-22T02:50:00Z
  title: Im Schatten der Türme - Der Krieg gegen den Terror
  subtitle: Mit Lügen in den Irak
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Australien 2021
    Die USA sehen 9/11 als Rechtfertigung für den Versuch, den Nahen Osten neu zu gestalten. 2003 marschieren sie in den Irak ein, um Saddam Hussein zu stürzen. Doch die Invasion endet in Chaos.

    Das Regime und die irakische Armee werden von den USA und ihren Verbündeten außer Gefecht gesetzt. Das Machtgefüge im Land gerät ins Wanken, religiöse Milizen und terroristische Banden erstarken. Die Folge ist ein jahrelanger Guerillakrieg gegen die Besatzer.
    HD-Produktion
- eventId:
  - 1571802
  - 610078
  start: 2026-10-22T02:50:00Z
  stop: 2026-10-22T03:30:00Z
  title: Im Schatten der Türme - Der Krieg gegen den Terror
  subtitle: Die schwarze Flagge des IS
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Australien 2021
    2014 ziehen islamische Extremisten mit schwarzer Flagge durch Nordsyrien und den Irak. Sie zerschlagen die irakische Armee und rufen ein Kalifat aus. Es dauert Jahre, den IS zu vertreiben.

    Das Chaos im Irak und der Beginn des Bürgerkrieges in Syrien schafften das Umfeld, in dem sich der sogenannte Islamische Staat entwickeln konnte. Mit äußerst gewalttätigen Methoden wirbt der IS in den sozialen Medien für sich und zieht Zehntausende an.
    HD-Produktion
- eventId:
  - 1571804
