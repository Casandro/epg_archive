  description: 'Günther Willers trifft in Saloniki einen alten Bekannten wieder, der ihn vor Jahren auf gemeine Weise betrogen hat: Sengle! Er will mit ihm abrechnen, doch Sengle, inzwischen kein kleiner Fisch mehr, hält sich Willers mit ausgesprochen rabiaten Methoden vom Hals. Auf Bezichtigung der attraktiven Griechin Calypso hin, die ihn bei der Polizei hereinlegt, landet Willers prompt im Gefängnis. Sein Glück, dass Meersdonk herausfindet, wie Sengle gestohlene Lastwagen nach dem Nahen Osten verschiebt. Mit einer sanften Erpressung bekommt der erfahrene Meersdonk seinen jähzornigen jungen Kollegen frei - und Sengle hinter schwedische Gardinen.'
