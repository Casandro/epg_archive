  title: Border Patrol USA - Einsatz an der Grenze
  subtitle: |-
    Illegales auf vier Pfoten
    Dokumentation, USA 2018
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 15.10.2026, 11:55 Uhr)
  description: 'Die Zoll- und Grenzschutzbeamten überprüfen einige Paletten und Container am Flughafen in New York. Die Ermittler gehen auf Drogenjagd und werden schon bald fündig. Am Grenzübergang Pacific Highway bekommen es die Polizisten währenddessen mit einem besonderen Souvenir zu tun: Ein amerikanisches Pärchen hat einen kleinen Welpen aus Kanada mitgebracht. Nun muss sichergestellt werden, ob der Hund in die Staaten einreisen darf, denn er könnte lebensgefährliche Seuchen mitbringen.'
  widescreen: true
