  title: Highway Heroes Down Under
  subtitle: |-
    Eine verfahrene Situation
    Doku-Serie, AUS/NZ 2022
    Altersfreigabe: ab 12
  description: |-
    In Neuseeland sorgen winterliche Straßenverhältnisse für Chaos: Ein Lkw ist bei Blitzeis eine Böschung hinabgestürzt. Das Team von Parks Towing muss den Sattelzug wieder auf die Straße stellen, doch die Verkehrsbehörde gibt ihnen dafür gerade mal drei Stunden Zeit. Auch die Cool-Brüder stehen unter Druck. Die Polizei hat sie beauftragt, ein gestohlenes Fahrzeug möglichst schnell aus einem Fluss zu bergen.

    Schnitt: Sam Hutchinson
  widescreen: true
