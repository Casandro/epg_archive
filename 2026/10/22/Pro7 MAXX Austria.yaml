  description: Am Flughafen von Detroit werden die Grenzschützer auf einen Mexikaner aufmerksam, der angeblich zu Besuch in der Stadt ist. Bei der weiteren Befragung wird schnell klar, dass der junge Mann keine glaubhafte Auskunft über seinen Aufenthalt geben kann. Derweil untersuchen die Kollegen in Boston das Gepäck eines Amerikaners, der gerade aus Afrika kommt. In seinem Koffer finden sie neben einigen Zahnbürsten auch Lebensmittel, die nicht ohne Weiteres eingeführt werden dürfen.
