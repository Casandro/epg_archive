  title: Terra Xplore
  subtitle: Was Wohnungen über Menschen verraten -
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Wie wir wohnen, beeinflusst unser Wohlbefinden stärker, als uns oft bewusst ist. Schon kleine Veränderungen zu Hause können dazu beitragen, dass wir uns wohler fühlen.

    In einem Studioexperiment zeigt Psychologe Leon Windscheid den Teilnehmenden Fotos der Wohnungen der jeweils anderen. Obwohl sie sich nicht kennen, versuchen sie daraus Rückschlüsse auf Persönlichkeit, Lebensstil und Gewohnheiten der Bewohner zu ziehen.
    Moderation: Leon Windscheid

