    Aufgrund des Techtelmechtels mit George ist Jen aus der Klinik geflogen. Bei der Suche nach ihrer Superkraft ist sie nun auf sich allein gestellt. Hilfe bekommt sie von unerwarteter Stelle.

    Endlich ist es so weit: Kashs Bürgerwehr-Musical kommt zur Aufführung! Während der Show findet nicht nur Carrie ihre Bestimmung. Jizz muss derweil lernen loszulassen, genau wie Jen, die sich endlich ihren Kindheitstraumata stellt.
