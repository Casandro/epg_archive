  description: |-
    Frankreich 2021
    Zoé ist eine Primaballerina, eine der legendären "Étoiles" am Ballett-Ensemble der Pariser Oper. Doch ihr Zenit scheint überschritten, ihre Tage gezählt.

    Der neue Intendant Sébastien wird von seiner Chefin angehalten, den Vertragsstatus der "Étoiles" zu reformieren. Da kommt es Sebastien gelegen, dass Zoé seit einem folgenschweren Sturz vor fünf Jahren nie wieder zu ihrer alten Form zurückfinden konnte.
