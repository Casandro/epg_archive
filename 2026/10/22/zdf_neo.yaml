  description: |-
    Dramaserie, Großbritannien 2023
    Jizz will mit Jen zusammen sein. Doch sie fühlt sich schlecht, weil sie mit ihrem Therapeuten rumgemacht hat. Ihre Lösung, damit die beiden wieder quitt sind: ein Freifahrtschein für Jizz!

    Carrie manifestiert, dass sie jetzt eine unabhängige Frau ist. Ob ein Töpferkurs für Pärchen dafür der richtige Ort ist? Kash arbeitet derweil weiter an seinem Musical und merkt immer mehr, dass Carrie ihm fehlt. In Jens Psyche öffnet sich eine verschlossene Türe.
