  title: MDR Kultur Café mit Michael Krebs
  description: |-
    Er ist Kabarettist, Musiker, Entertainer - und ein genauer Beobachter seiner Zeit: Michael Krebs tritt meistens auf Kleinkunstbühnen auf, manchmal aber auch auf Metal-Festivals und wo er spielt, verbindet er politischen Witz mit Musik, Alltagsbeobachtungen und einer gehörigen Portion Selbstironie. Im letzten Jahr wurde sein künstlerisches Schaffen mit dem Leipziger Löwenzahn ausgezeichnet, dem  traditionsreichen Preis für das beste Programm bei der Lachmesse. Dieses Jahr am 25.10. eröffnet der gebürtige Schwabe das größte Humorfestival des Ostens und wird dann auch mit dem Löwenzahn geehrt werden.

    Im MDR KULTUR Café geht es um den Menschen und Künstler hinter den Pointen: um die Lust am musikalischen Kabarett, um gesellschaftliche Themen, die auf der Bühne plötzlich komisch werden, und um die Frage, was Kabarett in Zeiten sich überbietender realsatirischer Ereignisse eigentlich leisten kann. Er erzählt von seinem künstlerischen Weg, von der Arbeit an seinen Programmen und davon, was es bedeutet, vor einem Publikum zu stehen, das nicht nur lachen, sondern manchmal auch genauer hinschauen soll.

    Im MDR KULTUR Gespräch der Klavierkabarettist Michael Krebs über Humor und Meinung, Musik und Bühne - und über die Kunst, den Finger in die Wunde zu legen, ohne dabei den Spaß zu verlieren.

    Moderation: Ilka Hein
    Redaktion: Gabriele Bischoff
