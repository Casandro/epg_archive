  title: 'MDR KULTUR Spezial: KINO/FILM/TV/SERIE'
  description: |-
    Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen, Berichte über Filmprojekte und Filmfestivals.

    Themen der Sendung u. a.:

    Film der Woche: "Der perfekte Urlaub"
    Die Fortsetzung des Erfolgsfilms "Das perfekte Geheimnis".  Was als entspannter Männer-Kurztrip nach Mallorca von Leo, Pepe, Rocco und Simon geplant war, eskaliert, als auch ihre Partnerinnen in derselben Villa auftauchen.

    DOK Leipzig kommt. Gespräch mit Ola Staszel
    Am kommenden Montag startet das Internationale Leipziger Festival für Dokumentar- und Animationsfilm. Das Festival gehört seit Jahrzehnten zu Leipzig. Für Ola Staszel ist es eine Premiere. Seit dem 1. Januar 2026 ist sie die neue künstlerische Leiterin, Intendantin und Geschäftsführerin von DOK Leipzig. Grit Krause hat mit ihr gesprochen.
