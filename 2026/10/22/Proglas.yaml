- eventId: 797494
  start: 2026-10-22T03:57:00Z
  stop: 2026-10-22T04:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1022 - Boj se strachem (296. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Nevím, kde jsem to vzala, že musím každý strach překonat. Jsou přece tak různé druhy strachu. Můžu se bát na základě děsivých zážitků něčeho, co jinému člověku vůbec nepřijde jako něco strašného. Strach si můžu dokonce hezky vypěstovat. Navymýšlela jsem si strašidelné historky o zelené příšeře, která žije v bujné hromadě výhonků rostliny přísavníku uprostřed našeho dvora. Ta ohavná bytost žere hlavně kolíčky na prádlo, které do té zelené hromady padají, a vůbec sežere všechno, co se jí vyskytne na dosah. S vykulenýma očima jsem to vykládala dětem, aby po té zeleni nedupaly a byla jsem fakt přesvědčivá. Doki, ale musím přiznat, že tento strach mě vlastně baví.Nejčastěji se ale bojím vážných věcí. Můj osvědčený strach se týká přijetí. Opravdu se někdy bojím, že mě lidi nepřijmou, že mě odmítnou, že mě nebudou mít rádi. Když se to navíc občas opravdu stane, bojuje se mi hůře. Zápasit se strachem tohoto druhu se dá jedině pokáním. Změna smýšlení o sobě samé je jediným způsobem, kterým se něco pořídí. Bůh říká, že ?si mě zamiloval a vyryl si mě do dlaní“. To si opakuju, když přichází známý pocit staženého žaludku a začínají se mi potit ruce. Připomínám si, že ?kdyby mě otec i matka opustili, Bůh si mě k sobě přivine“. Někdy také pomáhá, když ve skrytu vypláznu jazyk na pomyslné nepřátele a řeknu: Můj tatínek mě má rád, heč. A pak si troufnu říci nebo udělat věci, které se mohou někoho dotknout, nebo se nebudou každému líbit.Zaujalo mě, co říká zpěvačka Girli: ?Když se líbíte každému, znamená to, že jste neškodní“.'
