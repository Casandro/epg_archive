  title: Radioreport
  subtitle: Obnova hodin i věže sv. Mikuláše
  description: 'Autor: Iva Horká; Interpret: Marie Ripperová, Iva Horká * Věžní hodiny, jejíchž ciferník patří k největším prosvětleným věžním hodinám ve střední Evropě, prošly v roce 2026 opravou. Stejně tak samotná věž kostela svatého Mikuláše ve Velkém Meziříčí dostala v témže roce po mnoha letech opět nový kabát. V září 2026 se hodinový stroj z roku 1949 právě vrátil na věž kostela sv. Mikuláše.Z kostelní věže ve Velkém Meziříčí se podíváme nejsím průvodcem je historička Muzea Velké Meziříčí PhDr. Marie Ripperová. Pořadem vás provází Iva Horká.'
