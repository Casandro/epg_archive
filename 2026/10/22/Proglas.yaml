  title: Jak se vám líbí
  subtitle: Vilda Roubíček a přátelé živě z Koncertního studia
  description: 'Autor: Hana Slívová; Interpret: Vilém Roubíček, Ladislav Kokesch, Jiří Pelikán * Vilda Roubíček je český písničkář a hráč na foukací harmoniku, který žije ve Frýdku-Místku. Na českých pódiích se pohybuje od roku 1990, jako písničkář se pravidelně účastní předkol Porty a večerů Open Mic po celé republice. Na foukací harmoniku hrál v několika kapelách. V našem Koncertním studiu vystoupí se svými přáteli, pianistou Ladislavem Kokeschem a kytaristou Jiřím Pelikánem. [oupn majk] [kokešem] '
  genre:
  - '96'
