  title: CoESPU, costruttori di pace
  subtitle: 'In un momento di gravi conflitti e disordini nel mondo, a Vicenza c''è un centro dell''arma dei carabinieri che si occupa di addestrare e formare le forze di pace. È il COESPU, Centro di Eccellenza per le operazioni di '
  description: "pace e supporto. Nato nel 2005, ha ospitato più di 15.000 tra uomini e donne, cosiddetti peace keepers provenienti da 128 paesi per missioni delle Nazioni Unite, dell'Organizzazione per la sicurezza e la cooperazione in Europa, e di altre organizzazioni regionali. Il COESPU opera con la partnership degli Stati Uniti sin dalle sue origini, collaborazione formalizzata al Vertice di Sea Island nel 2004. Non solo addestramento, ma anche ricerca sulle zone di crisi e sulle strategie per riportare l'ordine in aree interessate da conflitti ed altre piaghe come la tratta di esseri umani, lo sfruttamento della prostituzione, il terrorismo. - \n\ndi Antonella Zechini scritto con Simona D'Aquanno produttore esecutivo Valentina Tassini"
