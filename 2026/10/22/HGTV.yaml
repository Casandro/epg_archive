    Es ist an der Zeit, den Sieger oder die Siegerin zu krönen. Aber zuerst müssen Todrick und Kim noch drei weitere Häuser begutachten. Jedes der Häuser verdankt sein zweites Leben einer umfassenden Sanierung - da wäre zunächst Mosaic Manor, ein historisches Haus, das einst als Bordell und später als Internat diente, das French Colonial, eine Hommage an alles, was mit Ludwig XVI. zu tun hat, und schließlich geht es zu einem Art-Déco-Haus, das sich anfühlt wie eine Reise in ein Luxushotel. Um schließlich das schillerndste Haus zu küren, ziehen Todrick und Kim drei Expert:innen zu Rate: Alison Victoria, Keith Bynum und Jackie Siegel.
