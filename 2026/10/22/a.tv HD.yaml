  title: Am Puls (Wh.)
  subtitle: Nahrungsmittel-Unverträglichkeiten und Allergien
  description: Nüsse, Milch und Weizenmehl. Das sind wohl die Klassiker, wenn es um Nahrungsmittel-Unverträglichkeiten oder Allergien geht. Doch was ist eigentlich der Unterschied zwischen einer Unverträglichkeit und einer Allergie? Auf welche Lebensmittel reagieren die meisten Menschen? Gibt es immer mehr Betroffene? Was ist mit Säuglingen und Kleinkindern? Und was kann man eigentlich gegen Nahrungsmittel-Unverträglichkeiten und Allergien tun? Viele Fragen, auf die wir zusammen mit Experten vom Universitätsklinikum Augsburg Antworten geben wollen.
