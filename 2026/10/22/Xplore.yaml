- eventId: 950974
  start: 2026-10-22T18:15:00Z
  stop: 2026-10-22T19:07:00Z
  title: Der Rhein von oben - Der romantische Rhein
  subtitle: Der Rhein von oben - Der romantische Rhein
  description: 'Das Rheintal hinter Bingen gilt als Inbegriff der deutschen Seele. Über die Hälfte seines Weges bis zur Nordsee hat der Rhein jetzt hinter sich gebracht. Er ist ein stolzer Fluss geworden und liefert Stoff für Sagen, Opern und Kriege. Im Mittelrheintal gibt es Burgen im Kilometertakt und Wein, den vor 2000 Jahren die Römer in den Norden brachten. Vorbei an der sagenumwobenen Loreley zieht der Rhein zum Deutschen Eck nach Koblenz, vorbei am Siebengebirge bis nach Bonn. Am Eingang zum Rheintal thront oberhalb von Rüdesheim eine Abtei, die das Andenken an Hildegard von Bingen pflegt. Schwester Christophora Janssen lebt hier für Gott und die Kunst. Eine Flusswindung weiter steht die erste von vielen ehemaligen Zollburgen: Rheinstein, seit 1975 im Privatbesitz der Hechers, die dort auch wohnen. Als Jugendlicher war Markus Hecher wenig begeistert vom neuen Familiendomizil, einen Stromanschluss gab es nicht. Inzwischen weiß er das Erbe seines Vaters zu schätzen und investiert Kraft, Geld und Leidenschaft in die Erhaltung des alten Gemäuers. Die mineralhaltigen Schieferböden im Rheintal eignen sich hervorragend für den Weinbau. Auch Bacharach verdankt seinen Reichtum den Trauben. Cecilia Jost bewirtschaftet in siebter Generation eines der traditionsreichen Familien-Weingüter mit Steillagen. Im Gründelbachtal klapperten früher 12 Mühlen, heute ist Josef Philipps der letzte Müller im gesamten Mittelrheintal. Aber seine Mühle läuft nicht mehr rentabel, in wenigen Jahren wird das Gerumpel der Mahlwerke endgültig verstummen. Auf der Spur der Dichterfreunde Clemens Brentano und Achim von Arnim wandern jeden Sommer Tausende durch das Mittelrheintal und suchen die Romantik. Um die Pflege der Wandersteige kümmern sich Wegepaten wie Beatrix Ollig. Das Rheinhotel Dreesen war früher das Wohnzimmer der Bonner Politikprominenz. Hoteldirektor Fritz Dreesen kümmert sich noch heute persönlich um jedes Detail. Sohn Olaf soll das traditionsreiche Haus in neue Zeiten führen. DE 2013'
