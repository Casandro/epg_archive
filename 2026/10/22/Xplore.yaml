  description: In Huangshan in der Provinz Anhui genießen die Gastgeber eine Tasse des Lieblingstees von Königin Elisabeth II. sowie den ältesten Tee, der je nach Europa exportiert wurde, und probieren ausgefallene lokale Köstlichkeiten, die von "Wortbonbons" und Tofu aus Blättern bis hin zu den ausgesprochen abgefahrenen Aromen von Haartofu und stinkendem Mandarinfisch reichen. CN 2023
