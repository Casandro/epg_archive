  title: VIP Trip - Prominente auf Reisen 6 - Island & Grönland mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 6 - Island & Grönland mit Richy Müller
  description: 'Wir begleiten Schauspieler Richy Müller und seine Frau Christl an Bord der luxuriösen Yacht Scenic Eclipse auf eine atemberaubende Expedition in die arktische Polarregion. Sie beginnen ihre Reise mit einem Flug über die Westküste Islands in einem der beiden bordeigenen Helikopter: unter ihnen erstrecken sich eine raue Vulkanlandschaft und beeindruckende Wasserfälle. Die Reise an Bord der Scenic Eclipse führt Richy und Christl weiter nach Grönland, wo sie beeindruckende Gletscherlandschaften entlang des längsten Fjordsystems der Welt, den Scoresbysund, erkunden. Auf der Scenic Eclipse genießen die beiden außergewöhnlichen Komfort: Suiten mit Butler-Service, ein großer Spa- und Wellnessbereich und zehn verschiedene Restaurants. Für besonders Abenteuerlustige steht sogar ein eigenes U-Boot bereit! In den eisigen Gewässern Grönlands erleben Richy und Christl die arktische Natur: Im Schlauchboot und im Kayak geht es durch die magische Welt der Eisberge und beide wagen sich beim "Polar-Plunge" sogar in das kalte Polarmeer. Beim Landgang entdecken sie die unberührte Pflanzenwelt der Grönland-Tundra, die im Sommer aus ihrem Winterschlaf erwacht. In dem kleinen, abgelegenen Ort "Ittoqqortoormiit" an der Westküste Grönlands erhalten Richy und Christl einen Einblick in lokale Traditionen. Die Expeditionsfahrt nach Island und Grönland ist eine Reise voller Entdeckungen und magischer Momente in der arktischen Wildnis. IS 2024'
- eventId: 950925
  start: 2026-10-22T09:05:00Z
  stop: 2026-10-22T09:48:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Nagasaki 1 mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 4 - Nagasaki 1 mit Michael Roll
  description: Japan ist ein Staat mit circa 6500 Inseln. Der Schauspieler Michael Roll interessiert sich für die Insel Kyushu, ganz im Süden des Archipels. Nach einem Zwischenstopp in Tokio, Hauptstadt und Wirtschaftszentrum Japans, führt die Reise nach Nagasaki. Die Stadt mit heute etwa 420.000 Einwohnern ist nach den Zerstörungen durch die Atombombe 1945 wieder aufgebaut worden. Zahlreiche Sehenswürdigkeiten wurden weitgehend so wieder hergestellt wie vor dem 2. Weltkrieg.  Dabei ist Nagasaki eine freundliche und weltoffene Stadt geblieben. Schon im 16. Jahrhundert kamen Portugiesen, Chinesen und Niederländer und trieben Handel mit der japanischen Bevölkerung. Besonderen Einfluss übten die portugiesischen und spanischen Missionare aus. Ihre Missionstätigkeit war so erfolgreich, dass selbst viele japanische Fürsten konvertierten. Allerdings löste diese Entwicklung aber bald eine Christenverfolgung aus, die mehr als 200 Jahre andauerte. Michael Roll geht bei seinen Streifzügen dieser dramatischen Geschichte nach und entdeckt dabei noch Inseln, auf denen die Zeit offenbar stehen geblieben ist.  In Nagasaki trifft Michael Roll einen Überlebenden des Atombombenabwurfs 1945 und lässt sich dessen Erlebnisse schildern.      DE 2019
