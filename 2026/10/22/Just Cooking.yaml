  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Bei ihm geben die Zutaten die Technik vor, sein Stil ist durch kreative Unruhe geprägt - unvorhersehbar und wahnsinnig. André Chiang ist der Gastkoch des Monats im Salzburger Hangar-7. André Chiang ist ein echter Prinzipienreiter. Die Gäste in seinem Restaurant ANDRE in Singapur bekommen das Tag für Tag zu spüren. Mit seiner eigenen Octaphilosophy, die auf acht Säulen basiert, vertritt Chiang eine kulinarische Philosophie, bei der Improvisation und saisonale Produkte im Vordergrund stehen. Diese acht Säulen verwandeln seine Menüs in ein einmaliges kulinarisches Erlebnis, das das Team des Restaurant Ikarus in Salzburg bei der Zubereitung des Gastkoch-Menüs vor besondere Herausforderungen stellt. AT 2014'
