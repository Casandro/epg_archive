  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein junger Taiwanese, der in der Weltmetropole Singapur französisch kocht. André Chiang steht für einen Kochstil, der oft als unvorhersehbar und wahnsinnig bezeichnet wird. Nicht umsonst zählt sein Restaurant ANDRE zu den Besten der Welt. Aktuell rangiert er auf Rang 38 der San Pellegrino-Liste. Der Stadtstaat Singapur ist für Chiang seit 2010 Heimat. In dem Land, das über 90 Prozent seiner Produkte aus dem Ausland importieren muss, setzt der Spitzenkoch auf internationale Zutaten von bester Qualität. Und doch verfügt das Land auch über kulinarische Traditionen, auf die der Asiate stolz ist. Diese stellt er auch seinem Gast Spitzenkoch Roland Trettl gerne vor. AT 2014'
