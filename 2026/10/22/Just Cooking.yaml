  title: Die besten Köche der Welt - Zu Gast im Ikarus - Paco Perez
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Paco Perez
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Paco Pérez ist mit insgesamt fünf Michelin-Sternen für fünf Restaurants ausgezeichnet - und gehört damit zur Weltelite der Spitzenköche. Mit dem Team des Restaurant Ikarus wird er ein besonders anspruchsvolles Menü zubereiten, das dann im Restaurant Ikarus in Salzburg auf der Speisekarte stehen wird. Wer sich in Paco Pérez'' kulinarische Hände begibt, sollte seine fünf Sinne beisammen haben. Denn bei seinen Menüs geht es nicht um Geschmack allein, sondern auch um die Optik, den Geruch, die Haptik und sogar den Klang eines Gerichtes. AT 2014'
