  title: Mittendrin - Flughafen Frankfurt (86)
  subtitle: Frisch vom Werk - Wir holen ein neues Flugzeug
  description: Die neue Generation des Dreamliner mit neuer Kabine und noch mehr digitalen Highlights an Bord kommt nach Frankfurt. Europas größte Airline, die Lufthansa Group, modernisiert ihre Flotte. Alte Flieger werden ausgemustert. Dafür investiert die Airline Milliarden in neue Maschinen, wie die Boeing 787-9. 34 Flieger sind bestellt. Speziell geschulte Piloten bringen sie vom Hersteller aus Seattle nach Hessen. Hier werden die nagelneuen Maschinen für ihren Einsatz vorbereitet. Wir begleiten exklusiv die nagelneuen Maschinen von der Abholung bis zum ersten Flug.
- eventId: 993138
  start: 2026-10-22T09:10:00Z
  stop: 2026-10-22T09:55:00Z
  title: Expedition in die Heimat
  subtitle: Moselsteig mit Seitensprung
  description: Die Mosel ist einer der schönsten Flüsse Europas. Verhältnismäßig unbekannt ist aber noch immer der Moselsteig - ein 365 Kilometer langer Wanderweg entlang des Flusses. Er führt über 24 Etappen von Perl bis Koblenz. Moderator Arndt Reisenbichler hat sich fünf Etappen und einen "Seitensprung" vorgenommen.
- eventId: 993407
  start: 2026-10-22T09:55:00Z
  stop: 2026-10-22T10:45:00Z
  title: Elefant, Tiger & Co. (437)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: 'Nashornbulle Ndugu hatte sich vor einiger Zeit Richtung Hannover aus dem Staub gemacht. Nun, da es in Leipzig eine moderne, neue Nashornanlage gibt, klopft er wieder an die Tür. Die Zusammenarbeit zwischen Mercedes und Benz trägt weiter Früchte: Seit kurzem hat Plumplori Mercedes zwei Minis im Stall - sozusagen als Nachfolger für Smart. Der dreht inzwischen in Frankreich seine Runden. Zebra-Hengst Henry hat ein Leben ohne Probleme: aber er macht Zebra-Stute Kathrin Probleme. Sie wird von ihm gemobbt. Wird Henry Kathrin wieder in Ruhe lassen?'
