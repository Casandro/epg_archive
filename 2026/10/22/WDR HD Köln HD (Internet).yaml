  title: Glow (5)
  subtitle: Eifersucht
  description: Während Jenny, Naomi, August und Yasin den Kellerraum schön machen, sucht Kim überall nach ihrer Mappe mit den Songtexten. Sie ist wie vom Erdboden verschluckt! Und dann sitzt ihr noch das Vorspiel an der Musik-Schule im Nacken. Sie hat nur noch wenig Zeit zum Üben, und bald sind auch noch Herbstferien! Zu allem Überfluss möchte Hilde die anderen mit auf ihre Hütte nehmen. Da reicht es Kim.
- eventId: 990188
  start: 2026-10-22T05:40:00Z
  stop: 2026-10-22T05:50:00Z
  title: Glow (6)
  subtitle: Freundinnen?
  description: 'Es herrscht miese Stimmung, nachdem Jenny Kim mit Farbe bespritzt hat. Doch Jenny entschuldigt sich, und die beiden verwandeln die frisch gestrichene Wand mit bunten Farbspritzern in ein kleines Kunstwerk. Können sie doch noch Freundinnen werden? Aber da findet August Kims Songtexte bei Jenny. Er ist sich sicher: Das wird Kim ihr nie verzeihen! Ausgerechnet jetzt, wo Kim Jenny gefragt hat, ob sie mit auf die Hütte kommen wollen!'
- eventId: 990427
  start: 2026-10-22T05:50:00Z
  stop: 2026-10-22T06:15:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (5/20)
  subtitle: Nordgriechenland
  description: 'Die sechs Abenteurer sind nun mitten im Bärengebiet. Die Mädels wecken Die Jungs ziemlich laut mit ihren selbstgebastelten Bärenpfeifen. Zu allem Überfluss gibt Melanie den Drill Instructor und treibt Die ganze Truppe zum Frühsport. Wenigstens wird allen warm dabei, denn in den Bergen sind Die Nächte sehr kalt. Am Nachmittag erleben Die sechs eine Überraschung: Sie müssen eine Ziegenherde treiben, dann melken und aus der Ziegenmilch Joghurt machen. Das hört sich leichter an, als es ist.'
- eventId: 990523
  start: 2026-10-22T06:15:00Z
  stop: 2026-10-22T06:40:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (6/20)
  subtitle: Nordgriechenland
  description: 'Ziegenjoghurt zum Frühstück ist nicht jedermanns Sache, aber da er selbstgemacht ist, probieren alle sechs davon und sind ein klein bisschen stolz auf ihre Leistung vom Vortag. Heute wartet nach einer Wanderetappe eine große Herausforderung auf sie: Mit einem Flying Fox rauschen die Abenteurer einen steilen Abhang zu einer Höhle hinunter. Dort bringt ihnen Wildniscoach Tobi bei, nach Steinzeitart Feuer zu machen. Ob sie das auch abends in ihrer Schlafhöhle schaffen? Jannis hofft darauf, denn er befürchtet, sonst nachts von wilden Tieren überrascht zu werden.'
- eventId: 991947
  start: 2026-10-22T06:40:00Z
  stop: 2026-10-22T06:55:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (5/6)
  subtitle: Flucht statt Urlaub
  description: Hauptsache weg! Während immer mehr Menschen in Leipzig gegen die Regierung demonstrieren, wagen viele DDR-Bürger die Flucht über die ungarische Grenze in den Westen. Auch die Eltern des 12-jährigen Ronny wollen über Ungarn fliehen. Ronny weiß davon nichts und meint, nur kurz in den Urlaub zu fahren. Die Angst vor einer Verhaftung an der Grenze ist groß.
- eventId: 992042
  start: 2026-10-22T06:55:00Z
  stop: 2026-10-22T07:10:00Z
  title: Auf Fritzis Spuren - Wie war das so in der DDR? (6/6)
  subtitle: Schießbefehl oder Freiheit?
  description: Anspannung pur! Aus ihrem Versteck entdeckt die jugendliche Kathrin Scharfschützen auf den Dächern der Leipziger Innenstadt. Die ganze Nacht hat sie mit ihren Freunden Flugblätter gedruckt und zu einer gewaltfreien Demonstration aufgerufen. Heute wird sich entscheiden, ob die Regierung die Montagsdemo niederschießt oder den Menschen in der DDR tatsächlich die friedliche Revolution gelingt.
