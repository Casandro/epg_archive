  title: Rentnercops (61)
  subtitle: Entführt
  description: 'Als ein sehr wohlhabender Mann mit seiner Ehefrau die Wache betritt und einen Lösegeldbrief vorlegt, herrscht zunächst Ratlosigkeit. Seine angeblich entführte Frau sitze ja schließlich neben ihm und kann somit nicht entführt worden sein. Als plötzlich eine aufgeregte Francesca auf der Wache erscheint und Schmitz mitteilt, dass Tochter Daniela verschwunden sei, fällt es den Ermittlern wie Schuppen von den Augen: die Entführer haben das Opfer verwechselt und stattdessen Daniela entführt!'
