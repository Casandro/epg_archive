  stop: 2026-10-22T21:00:00Z
  title: Stottern vor der Klasse? Jenni will Lehrerin werden
  description: '"Viele Menschen denken, ich sei dumm. Dabei bin ich nicht dümmer als andere," erklärt Jennifer Springer, Lehramtsstudentin aus Köln. Im Alter von 32 Jahren veränderte ein Schlaganfall ihr Leben: Von einem Moment auf den anderen verliert die lebensfrohe und selbstbewusste junge Frau die Kontrolle über ihren Körper - und ihre Sprache. Seitdem stottert sie. Für die heute 34-Jährige bedeutet das nicht nur eine alltägliche Herausforderung, sondern auch eine tiefgreifende Erschütterung ihres Selbstbilds.'
