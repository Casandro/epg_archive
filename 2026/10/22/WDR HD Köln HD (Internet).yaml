  title: Freundschaft - eine Superkraft?
  subtitle: Deutschland 2025
  description: 'Alle suchen nach der großen Liebe. Doch übersehen wir dabei vielleicht die Freundschaft? Die Wissenschaft zeigt: Freundschaft ist eine außerordentliche Kraft. Sie formt unsere Identität, stärkt unser Wohlbefinden und hat sogar das Potenzial, unser Leben zu verlängern. Doch was entscheidet darüber, mit wem wir uns befreunden? Warum werden Freunde gerade in der Pubertät regelrecht zu Magneten? Und: Hat die Freundschaft in Zeiten zunehmender Einsamkeit und Digitalisierung überhaupt noch eine Chance - oder ist gerade sie der Kit, der uns zusammenhält?'
