  title: Rentnercops (60)
  subtitle: Der alte Fritz
  description: 'Eine besorgte Nachbarin verständigt die Polizei: Schon länger hat sie ihren Nachbarn Fritz nicht mehr gesehen. Und das aus einem guten Grund: Der fast 80-jährige Witwer liegt tot in seiner Wohnung. Die Umstände seines Ablebens sind mysteriös und auch die grüne Tasche mit brisantem Inhalt stellt Bielefelder und Schmitz vor ein kniffliges Rätsel. Im Dezernat steht unterdessen ein weiterer Abschied an: Rosalind Schmidt folgt einem Ruf der Universität Münster.'
  ageRating: 12
  genre:
  - '16'
- eventId: 995178
