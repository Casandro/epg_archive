  title: SWR4 Goldies
  subtitle: mit Barbara Scherrer
  description: "\"Erinnerungen werden wachgeküsst\" \n\nZeitreise gefällig? Barbara Scherrer nimmt Sie zweimal in der Woche mit und spielt unvergessliche 60er Oldies, legendäre 70er Classics und prägende 80er Hits! Songs, die Geschichte schrieben, die die Welt veränderten. Jeden Dienstag und Donnerstag von 20:00 bis 23.00 Uhr.\n\nSie haben einen Lieblingshit aus diesen Jahrzehnten? Mail ins Studio und einschalten, eintauchen und genießen!\n \nDie Barbara Scherrer Show: SWR4 Goldies! Neu in SWR4 und der ARD Audiothek!"
