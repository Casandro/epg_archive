    Série documentaire de Jobst Knigge, Susanne Utzt et Cristina Trebbi (2024, 53mn) D'où venons-nous ? Pourquoi souffrons-nous ? Et à quoi nous raccrocher quand tout nous échappe ? Face à la peur, à la mort, au chaos et aux questions sur le sens de la vie, aussi vieilles que l'humanité, la foi s'est imposée comme un programme de survie ancestral. Mais comment expliquer qu'aujourd'hui, jusque dans les sociétés sécularisées, cette force façonne encore notre pensée ?

