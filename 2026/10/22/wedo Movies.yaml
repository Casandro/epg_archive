  title: Terrordactyl
  subtitle: Adventure / Western / War 2016, FSK 16
  description: '2016 ● FSK: 16 Nach einem Meteoritenschauer in der Nähe von Los Angeles suchen Jonas und Lars nach Resten des kosmischen Gesteins, um es zu verkaufen und reich zu werden. Sie finden tatsächlich Teile eines Meteors. Plötzlich werden sie jedoch von urzeitlichen Echsen verfolgt. Gemeinsam mit drei Bekannten flüchten sie vor den blutrünstigen Flugwesen. Doch dann erkennen sie, dass sie nur gemeinsam den Angriff der Urzeitwesen auf Los Angeles stoppen können. Adventure / Western / War 2016, Regie: Don Bitters III,  Mit: Bianca Haase, Victoria Summer, Candice Nunes, FSK 16'
