  title: Nicht heulen, Husky
  subtitle: Movie / Drama 2000
  description: '2000 Barbara und Oliver sind beide verheiratet, allerdings nicht miteinander. Beide sind große Freunde der Landschaft Kanadas und beschließen eines Tages spontan, mit ihren Kindern und seinen Hunden dorthin zu reisen und gemeinsam ein neues Leben zu beginnen. Doch in Kanada läuft alles ganz anders, als die beiden sich das vorgestellt haben. Schon bald müssen sie feststellen, dass am Yukon neben eisiger Kälte unerbittliche Regeln herrschen. So steht für die neue Familie eine harte Bewährungsprobe an. Movie / Drama 2000, Regie: Tomy Wigand,  Mit: Heiner Lauterbach, Barbara Rudnik, Tobias Schenke'
