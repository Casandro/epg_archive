  stop: 2026-10-22T02:21:59Z
  title: Survive the Wild
  subtitle: Kommunikation im Tierreich, Magazines / Reports / Documentary 2017, Season:1 Episode:2, FSK 12
  description: '2017 ● S1 E2 ● FSK: 12 Um in der Wildnis zu überleben, müssen auch Tiere miteinander kommunizieren - und manche Arten haben wirklich ganz erstaunliche Techniken entwickelt, mit denen sie Informationen an ihre Artgenossen weitergeben. Dabei spielt der Austausch sowohl bei Einzelgängern als auch bei Herden- und Rudeltieren eine entscheidende Rolle: Die Tiere mit den ausgefeiltesten Kommunikationsstrategien sind ihren Rivalen gegenüber immer einen Schritt voraus. Magazines / Reports / Documentary 2017, Season:1 Episode:2, FSK 12'
