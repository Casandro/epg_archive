  title: Survive the Wild
  subtitle: Territorialschutz bei Tieren, Magazines / Reports / Documentary 2017, Season:1 Episode:1, FSK 12
  description: '2017 ● S1 E1 ● FSK: 12 Die Herrschaft über ein Revier ist im Tierreich extrem wichtig. Das Territorium muss ausreichend Nahrung bieten und zugleich als sicherer Zufluchtsort dienen, um den Nachwuchs aufzuziehen - nur so kann der Fortbestand der jeweiligen Art gewährleistet werden. Solche Gebiete sind allerdings rar und dementsprechend hart umkämpft. Magazines / Reports / Documentary 2017, Season:1 Episode:1, FSK 12'
- eventId:
