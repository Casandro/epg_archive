  title: OMR Podcast - Uli Hoeneß, FCB Honorary President
  description: Uli Hoeneß ist formell nur noch Ehrenpräsident und einfaches Aufsichtsratsmitglied beim FC Bayern München. Doch abgesehen von den offiziellen Titeln ist er nach wie vor die prägende Kraft beim Verein. Wie sieht er heute den Club, den er sowohl als Spieler als auch als Manager maßgeblich geformt hat? Im OMR Podcast redet Uli Hoeneß über aktuelle Erfolge, die schwierige Suche nach einem Nachfolger, die zunehmende internationale Konkurrenz durch Investoren aus Ländern wie Saudi-Arabien – und einen entscheidenden Anruf vom mittlerweile verstorbenen Red-Bull-Gründer Dietrich Mateschitz kurz nach seiner Haftentlassung.
