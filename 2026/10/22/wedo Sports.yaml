  title: OMR Podcast - Jan-Christian Dreesen, Vorstandschef FC Bayern München
  description: 'Podcast-Premiere für Jan-Christian Dreesen: Der Vorstandschef des FC Bayern München gibt in seinem ersten Podcast-Interview überhaupt exklusive Einblicke in die Milliarden-Strategie des Rekordmeisters. Es geht um Millionensummen für Transfers, den Kampf gegen die Übermacht der Premier League und ausufernde Berater-Honorare. Jan-Christian Dreesen verrät, wie Bayern zehn Millionen E-Mail-Adressen monetarisiert, wie der Harry-Kane-Deal wirklich ablief und warum strategische Partner wie Adidas oder Audi mehr wert sind als jedes Private-Equity-Geld. Und natürlich geht es auch um die Frage, wie der FC Bayern den Wettbewerbsnachteil gegenüber der Premier League bei den Fernsehgeldern ausgleichen kann. Dreesen hat einen Plan – doch der enthält eine gewaltige Sprengkraft für die gesamte Bundesliga.'
