- eventId: 958939
  start: 2026-10-22T16:00:00Z
  stop: 2026-10-22T16:04:00Z
  title: Zprávy pro Pardubický kraj
  description: Přehled toho nejdůležitějšího, co se právě odehrává v Pardubickém kraji. Nechybí ani zásadní informace z republiky a ze světa.
- eventId: 958940
  start: 2026-10-22T16:04:00Z
  stop: 2026-10-22T17:00:00Z
  title: Kdo umí, ten umí
  description: Zemřel dlouholetý provozně-ekonomický náměstek Východočeského divadla v Pardubicích Bohumil Kos. Významně se podílel na rozvoji divadla, a to nejen svými odbornými a organizačními schopnostmi, ale také lidským přístupem. Kromě toho vedl hudební uskupení Kosteam a pod pseudonymem Jarad Portský napsal několik knih, ve kterých čerpal ze vzpomínek na dětství i ze zážitků z divadelního zákulisí. Právě divadlu věnoval velkou část svého profesního života, i když jak před necelým rokem popsal v našem vysílání, původně nastoupil na jeden rok. Poslechnete si vzpomínkovou reprízu rozhovoru s ním. Připravila Milena Vápeníková. (repríza)
