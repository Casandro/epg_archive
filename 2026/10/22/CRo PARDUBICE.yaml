- eventId: 958937
  start: 2026-10-22T15:30:00Z
  stop: 2026-10-22T15:42:00Z
  title: O čem se mluví v Pardubickém kraji
  description: Skoro každý na něj má názor. Pro někoho provokatér, pro jiného zásadový člověk. Zastupitel Filip Sedlák za Naše Pardubice se stal seriózním politickým hráčem. Bez jeho hlasů se neobejde plánovaná duhová koalice na magistrátu. Ustoupí teď legendární opozičník ze své ostré rétoriky? Překvapil ho volební výsledek? A mělo cenu kandidovat ve více městských obvodech? Moderuje Jakub Malý.
- eventId: 958938
  start: 2026-10-22T15:42:00Z
  stop: 2026-10-22T16:00:00Z
  title: Den v kraji
