- eventId: 959109
  start: 2026-10-22T20:05:00Z
  stop: 2026-10-22T20:42:15Z
  title: Podvodnice
  description: 'Příběh ženy, která připravila sokoly o miliony. Čtvrtý díl: Kyanid Chovala se jako chladnokrevná podvodnice. Za touto maskou se ale skrývaly deprese a opakované pokusy o sebevraždu. Od dětství byla v péči psychiatrů a během života opakovaně hledala pomoc odborníků. Její psychiku zásadním způsobem ovlivnilo několik zlomových životních okamžiků. Co jí vedlo k tomu, že cítila potřebu utrácet za luxus na cizí účet? A proč si nakonec sama vzala život? Závěrečný díl podcastu přináší odpověď na otázku, kým ve skutečnosti byla Eliška Colding?'
