  title: Miteinander vom 17.10.2026 (Wh.)
  subtitle: München und die Region packen an!
  description: Bayerisches Brauchtum - für die einen ein Stück Heimat, für die anderen fast schon eine fremde Welt. Doch wie hält man solche Traditionen lebendig? Der Trachtenverein Gaimersheim schafft das seit mittlerweile 80 Jahren - Reporterin Natalie Wiesenberger hat erlebt, wieviel Leidenschaft hinter dem Verein steckt.
- eventId: 695290
  start: 2026-10-22T08:30:00Z
  stop: 2026-10-22T08:45:00Z
  title: Culture Talk vom 20. November 2026 (Wh.)
  subtitle: 'Kultur pur, Weltrekordjagd und Entdeckungen: "Die Lange Nacht der Münchner Museen hats in sich!'
  description: "35 000 Münchnerinnen und Münchner waren an diesem Wochenende bei der Langen Nacht der Münchner Museen dabei.\nÜber 100 Museen, Sammlungen, Galerien und sogar Kirchen hatten ihre Pforten  bis Sonntagmorgen um 1 Uhr geöffnet, um den Kulturhunger der Besucherinnen und Besucher zu bändigen. \nUnter Ihnen auch Alexander Weggartner, der an diesem Abend wohl die meisten Museen besuchte, um einen neuen Weltrekord aufzustellen. \nIm aktuellen Culture Talk trifft Markus Stampfl Weggartner bei der Rekordjagd und zeigt, was es unter anderem noch zu erleben gab bei der Langen Nacht der Münchner Museen."
- eventId: 695291
  start: 2026-10-22T08:45:00Z
  stop: 2026-10-22T09:00:00Z
  title: München tut gut vom 15.10.2026 (Wh.)
  subtitle: Die Wohlfühl- und Nachhaltigkeitssendung auf münchen.tv
  description: München tut gut soll ein positives Lebensgefühl erzeugen und ist eine wöchentliche Sendung mit Reportage-Elementen. Das Format soll aufklären, inspirieren und die positiven Seiten des Lebens in den Mittelpunkt rücken. München tut gut berichtet über alltagsnahe Themen und aktuelle Trends mit Wohlfühlcharakter. Ziel des Formats ist es, den Zuschauern einen Impuls und vor allem einen Nutzen zu vermitteln. Es kann so einfach sein, sich selbst und anderen etwas Gutes zu tun. Manchmal fehlt nur ein ganz kleiner Impuls und genau den möchten wir jede Woche wieder aufs Neue finden.
