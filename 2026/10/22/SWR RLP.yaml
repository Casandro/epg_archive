  subtitle: Schwer erziehbar
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Einbruch auf dem Zeislerhof: Für Hofbesitzer Ludwig Zeisler haben die Problemkinder vom Boxerhof den Schmuck seiner Ehefrau gestohlen. Auf dem Boxerhof sollen seit einiger Zeit schwer erziehbare Jugendliche wieder in die Gesellschaft integriert werden. Einige Nachbar:innen stehen dem Projekt allerdings kritisch gegenüber. Auf der Fahrt zum Nachbarhof entdecken "Hubert und Staller" einen schlimmen Motorradunfall: Einer der Sozialarbeiter hat wortwörtlich seinen Kopf verloren. Die beiden Polizeiobermeister müssen Sozialarbeiter Norbert Dorfner nun nicht nur mit den Diebstahlsvorwürfen konfrontieren.'
