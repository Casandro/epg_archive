  description: Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann.  Im vierten Fall wollen Sidney und seine Crew der zweifachen und alleinerziehenden Mutter Lilia aus der Klemme helfen. Lilia hat bereits mehrere Schicksalsschläge hinter sich und muss sich - obwohl sie zwei Jobs hat - von rund 700 Euro monatlich über Wasser halten. Geld für ihren alten Audi A3 mit rund 240.000 km bleibt da nicht mehr übrig. Als Sidney vor ihrer Tür steht, kann sie  ihr Glück kaum fassen. Der Audi muss repariert und getunt werden. Sidney weiß, ohne seine Hilfe ist Lilia aufgeschmissen. Deshalb geben er und sein Team Vollgas.
