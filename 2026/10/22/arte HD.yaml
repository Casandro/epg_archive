  title: Mit offenen Augen
  subtitle: 'Relooted: Gamer plündern koloniale Raubkunst'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In dem afrofuturistischen Heist-Videospiel Relooted muss man versuchen, Kunstgegenstände aus westlichen Museen zurückzuholen. Diese "Befreiung" afrikanischer Artefakte bietet einen Perspektivwechsel und macht das Ausmaß kolonialer Plünderungen deutlich.

    Angesichts der halben Million afrikanischer Artefakte, die aktuell noch in europäischen Museen lagern, stellt das Spiel das "Zurückstehlen" als moralisch-ethische Verpflichtung dar. Die Narrative Designerin Mohale Mashigo erklärt den engagierten Anspruch des Spiels, während die Kunsthistorikerin Bénédicte Savoy die verschiedenen Inszenierungen rund um die Kunstgüter analysiert.
