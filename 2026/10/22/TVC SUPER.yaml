  title: Alex Hugo 4 (odc. 3)
  subtitle: Alex Hugo, były policjant z Marsylii, ucieka od zgiełku miasta i zaczyna nowe życie w górach, gdzie jako lokalny detektyw rozwiązuje trudne sprawy, jednocześnie mierząc się z własną przeszłością.
  description: |-
    Tytuł oryginalny: Alex Hugo
    FR, 2018
    Reżyseria: Sylvie Ayme
    Występują: Samuel Le Bihan, Jean-Marie Winling, Yasin Houicha, Anne Girouard, Nina Mazodier, Leyla Jawad
    Francuski serial kryminalny opowiada o Alexie Hugo, byłym policjancie z Marsylii, który porzuca pełne przemocy miasto, by odnaleźć spokój w odległej górskiej miejscowości. W surowym, wymagającym terenie zostaje lokalnym detektywem, rozwiązując trudne sprawy i jednocześnie mierząc się z własną przeszłością oraz potrzebą odzyskania wewnętrznej równowagi.
