  title: Jednostka do zadań specjalnych 9 (odc. 4)
  subtitle: Catherine Faure inauguruje otwarcie nowej sali sądowej w Nicei. Ochrona próbuje powstrzymać protest ojców domagających się zwiększenia praw do opieki nad dziećmi. Manuel Pujol zostaje dźgnięty nożem.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2015
    Reżyseria: Didier Delaître
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Julie Fournier, Manon Azem, Félicité Chaton
    Catherine Faure, strażniczka pieczęci, inauguruje otwarcie nowej sali sądowej w Nicei. Na zewnątrz ochrona z trudem próbuje powstrzymać protest ojców domagających się zwiększenia praw do opieki nad dziećmi. Fizjoterapeuta Manuel Pujol zostaje w tłumie dźgnięty nożem. Dlaczego bezdzietny kawaler uczestniczył w manifestacji?
  ageRating: 16
