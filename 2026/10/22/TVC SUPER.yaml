  title: Profil 9 (odc. 2)
  subtitle: Ad?le i Rocher po pięciu latach znowu wspólnie prowadzą dochodzenie w sprawie morderstwa. Para zostaje uwięziona przez przestępców. Rocher jest ranny.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2018
    Reżyseria: Vincent Jamain
    Występują: Juliette Roudet, Philippe Bas, Raphaël Ferret, Diane Dassigny, Arnaud Cassand, Jean Donagan
    Ad?le i Rocher po pięciu latach znowu wspólnie prowadzą dochodzenie w sprawie morderstwa. Grozi im śmiertelne niebezpieczeństwo - zostają uwięzieni przez przestępców. Rocher jest ranny. Komisarz Lamarck, Hyppo i Jess prowadzą wyścig z czasem, aby ich ocalić. W tych wyjątkowych okolicznościach, pod wpływem emocji, Ad?le i Rocher wyznają sobie uczucia, o których wcześniej nie byli w stanie powiedzieć. Niestety, mogą to być ich ostatnie słowa.
  ageRating: 16
