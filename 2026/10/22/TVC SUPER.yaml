  title: Winnice miłości 1 (odc. 34)
  subtitle: Detektyw śledzi Melinę i Achilleasa, robiąc im zdjęcia, co zbliża Sifisa do poznania prawdy o ich związku. Stefania spędza czas w domu Sifisa, a ich relacja wyraźnie się umacnia.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Detektyw śledzi Melinę i Achilleasa i robi im zdjęcia. To tylko kwestia czasu, aby Sifis dowiedział się prawdy o parze. Tymczasem Stefania przebywa w domu Sifisa, a ich związek z każdym dniem staje się silniejszy. Melina skarży się Achilleasowi na to, że Eurydiki nadal przebywa w domu jego rodziców na Cyprze. Achilleas obiecuje jej, że przekona Mattheosa, by ją wyrzucił. Natychmiast dzwoni do Mattheosa i po raz kolejny obaj bracia są ze sobą w konflikcie.
