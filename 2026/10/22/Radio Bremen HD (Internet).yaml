  description: 'Hamburg-Duell: Mit Olli Dittrich und Jan Delay treten zwei musikalische "Hamburger Jungs" zum lustigen Wettraten gegeneinander an. Olli Dittrich ist nicht nur der Tresen-Philosoph "Dittsche" im gestreiften Bademantel, sondern feierte auch schon mit "Die Doofen" und seiner Band "Texas Lightning", mit der er 2006 beim ESC antrat, große Erfolge. Der Hip-Hop-, Reggae-, Soul- und Funk-Musiker Jan Delay rappt seit den 1990er Jahren mit der Gruppe "Beginner" und ist im Sommer mit seiner Band "Disko No.1" auf großer "Best of 25 Years"-Tournee.'
