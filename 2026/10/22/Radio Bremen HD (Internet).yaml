  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Zora Klipp, Köchin'
  description: Einmal die Woche präsentiert Zora Klipp in der Sendungs Rubrik "DAS! schmeckt" allerfeinsten Schmackofatz zum Nachkochen daheim. Dabei zeigt sie frisch und humorvoll, wie unkompliziert, regional und kreativ moderne Küche sein kann. Ab November ist die 36-Jährige im NDR Fernsehen für die neue Sendereihe "Zora  schmeckt's!" im Norden unterwegs und begibt sich an verschiedenen Orten vom Harz bis ans Meer in ganz verschiedene kulinarische Welten, stellt leckere Genussgeschichten vor.
- eventId: 988029
  start: 2026-10-22T04:00:00Z
  stop: 2026-10-22T04:20:00Z
  title: Sesamstraße
  description: Auf einer Keks-Kostüm-Party stiehlt der Kekser die Verkleidungen der Gäste. Ein Fall für Krümel und die "Cleveren Kekse"! Ernie möchte, dass Bert nach oben und unten schaut, aber dort ist nichts zu sehen. Zunächst. Super Grobi 2.0 hilft einem Huhn, das nicht über die Chinesische Mauer kommt. Außerdem treffen die drei Musiker in den "Unheimlich heimeligen Begegnungen" auf Wesen mit vielen Augen.
