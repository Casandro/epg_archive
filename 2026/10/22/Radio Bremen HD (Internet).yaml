  title: 'Die Nordreportage: Melanies Traum vom Wellnesshof'
  subtitle: Zwischen Beautybehandlung und Bauleitung
  description: 'Melanie Goetzke hat in Neumünster einen erfolgreichen Beautysalon. Gemeinsam mit sechs Mitarbeiterinnen kommt die gelernte Make-up-Artistin auf rund 1.000 Termine im Monat. Doch Melanie will mehr: Sie möchte einen Ort schaffen, an dem Menschen zur Ruhe kommen und sich wohlfühlen. Dafür hat sie den 10.000 Quadratmeter großen Olenhof gekauft, einen Gutshof im kleinen Dorf Tasdorf, mitten in Schleswig-Holstein. Bis zum Herbst soll aus dem Anwesen eine Wohlfühloase mit nordischem Flair werden. Unterstützt wird Melanie von ihrem Mann Tobi, ihrer Familie, Freunden und Kolleginnen.'
