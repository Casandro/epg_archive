  description: Einmal die Woche präsentiert Zora Klipp in der Sendungs Rubrik "DAS! schmeckt" allerfeinsten Schmackofatz zum Nachkochen daheim. Dabei zeigt sie frisch und humorvoll, wie unkompliziert, regional und kreativ moderne Küche sein kann. Ab November ist die 36-Jährige im NDR Fernsehen für die neue Sendereihe "Zora  schmeckt's!" im Norden unterwegs und begibt sich an verschiedenen Orten vom Harz bis ans Meer in ganz verschiedene kulinarische Welten, stellt leckere Genussgeschichten vor.
