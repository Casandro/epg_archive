- eventId: 989317
  start: 2026-10-22T04:35:00Z
  stop: 2026-10-22T05:20:00Z
  title: Wir werden Camper!
  subtitle: Britta und Andreas im Baskenland
  description: Britta Hofmeister und Andreas Werner aus Dorsten haben sich vor kurzem von ihrem riesigen Wohnauflieger getrennt und sind auf ein kleineres Wohnmobil umgestiegen. Die Jungfernfahrt geht ins Baskenland - nach Frankreich und nach Spanien - auf vier unterschiedliche Campingplätze. Führt der Wechsel zu einem kleineren Gefährt nun zu mehr Entspannung im Urlaub? Oder fehlt ihnen jetzt der Platz ihres Vorgängermodells?
- eventId: 989723
  start: 2026-10-22T05:20:00Z
  stop: 2026-10-22T06:10:00Z
  title: Rote Rosen (4403)
  subtitle: Deutschland 2026
  description: 'Die Heizung im Rosenhaus fällt aus. Kurzerhand quartiert Gisela alle im Gutshaus ein, da Victoria verreist ist. Dort feiern die Böttchers ausgelassen eine Party. Gisela ist außer sich: Schaffen sie es noch rechtzeitig, vor Victorias Rückkehr alles aufzuräumen?'
