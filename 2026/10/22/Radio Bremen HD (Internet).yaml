  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Riccardo Simonetti, Moderator und Autor'
  description: In seinem aktuellen Buch beschäftigt sich Riccardo Simonetti mit neuen Vorstellungen von Männlichkeit jenseits traditioneller Rollenbilder. "Wann ist ein Mann ein Mann?!" verbindet persönliche Erfahrungen mit Popkultur, historischer Einordnung und gesellschaftlicher Analyse, möchte Vielfalt sichtbar machen. Der Moderator und Autor, 1993 in Bad Reichenhall geboren, entwickelte sich vom jugendlichen Radiotalent zu einer festen Größe der deutschen Medienlandschaft. Er engagiert sich seit Jahren für soziale Initiativen, war LGBT*-Sonderbotschafter des EU-Parlaments.
