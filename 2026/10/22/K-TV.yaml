  title: 'Jugendtreffen Kremsmünster 2026 - Sagt den Verzagten: Habt Mut!'
  subtitle: Dokumentation
  description: 'Warum sind über 500 Jugendliche freiwillig eine Woche im Kloster? Purer Glaube, pure Freude. Beim ältesten katholischen Jugendtreffen Österreichs begegnen sich Lobpreis, Gemeinschaft, Freundschaft, Fußballfinale, Theater u.v.m. Im Zentrum dieser Tage: Christus selbst. Wer glaubt, die junge Generation hätte mit Kirche nichts mehr am Hut, wird hier überrascht. Eine Dokumentation von Athinea Andryszczak.'
