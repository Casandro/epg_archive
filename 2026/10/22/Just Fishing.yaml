  description: 'Es ist Frühling. Die Flusspegel sind hoch. Wir werden zudem von einem 24-stündigen Dauerregen überrascht. In dieser Situation müssen wir eine Entscheidung treffen: Durchangeln oder einpacken. Aufgeben ist nicht unsere Passion und so stellen wir uns der schwierigen Aufgabe am Fluss, finden neue Wege und fangen tolle Fische in der harten Strömung. Im zweiten Teil des Films treffe ich das PR Baits Team und feiere mit der Crew eine geniale Hausmesse. Lets go Carpfishing! FR 2023'
