  title: Príbehy nádeje
  subtitle: V novej relácii prinášame silné, pravdivé príbehy o dobre, láske, o ťažkostiach života, ale najmä o nádeji, ktorá nikdy nehasne.
  description: 'Príbehy nádeje prinášajú skutočné životné osudy, ktoré povzbudzujú a ukazujú silu ľudskej vzájomnosti. V tretej časti spoznáme nečakané stretnutie v reštaurácii, kde si chorý starší muž pomýli neznámeho človeka so svojím dávnym priateľom z mladosti. Hlavný hrdina stojí pred dilemou - vziať osamelému človeku jeho ilúziu a povedať mu tvrdo pravdu, alebo mu darovať pozornosť, čas a vypočutie. Akú cenu má pravda v porovnaní s milosrdenstvom a obetovanou blízkosťou? Skutočné zážitky a osobný pohľad na tému počúvania, osamelosti a ľudského tepla dopĺňa trojica glosátorov: kňazi Benjamin Kosnáč a Cyril Jančišin spolu s Teréziou Kurekovou. Príbeh vyrozpráva Pavol Danko. (2026)'
