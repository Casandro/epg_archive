  title: vKontexte XXV (12)
  subtitle: Odpustky na ceste duchovného oslobodenia. V relácii ponúkneme na základe odhaľovania omylov v myslení a konaní ľudí dneška orientáciu v hodnotách, ktoré nie sú závislé na zmenách času.
  description: Čo vlastne znamenajú odpustky, aký je ich zmysel a ako súvisia s duchovným oslobodením človeka? V relácii vKontexte nám otec Juraj Vittek ponúka teologické i duchovné vysvetlenie odpustkov v nadväznosti na Sväté písmo, Katechizmus a učenie Cirkvi. Ukazuje, že odpustky nie sú stredoveký prežitok, ale dar Božieho milosrdenstva, ktorý človeka oslobodzuje od pút hriechu a otvára cestu k plnšiemu životu s Bohom. (2025)
