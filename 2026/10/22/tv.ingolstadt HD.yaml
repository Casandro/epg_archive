  title: Wetterpanorama (Wh.)
  subtitle: Der Blick in die Region - Webcams aus den schönsten Ecken!
  description: Lohnt sich ein Ausflug in die Berge oder hängt da der Nebel? Wo bietet die Sonne die Gelegenheit für schöne Spaziergänge? Oder ist heute doch ein Wetter für Langlaufen und Touren gehen? Genießen Sie mit unseren Panoramabildern den Blick in unsere wunderschöne Region und zu den Nachbarn!
- eventId: 695122
  start: 2026-10-22T06:30:00Z
  stop: 2026-10-22T07:00:00Z
  title: Bayerische Landfrauen kochen auf (Wh.)
  subtitle: 'Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps ..'
  description: |-
    Johanna Nagel stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartige Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps und Rezepte rund ums bayerische Essen. Diese Landfrauen kommen aus unterschiedlichen landwirtschaftlichen Betrieben in ganz Bayern und lieben die Landwirtschaft und lieben Bayern! Hier erfahren Sie viel über die Vielfalt und Qualität der heimischen Erzeugnisse, aber auch die Arbeit und das Engagement der Landwirte.

    Moderatorin Sandra Koltai führt uns in die kulinarische Welt der bayerischen Landfrauen und trifft auf Landfrau Silvia Schlögel und Expertin Kathrin Schlickenrieder. Gekocht werden Allgäuer Fleischpflanzerl mit Kartoffelbrei.
