  stop: 2026-10-22T16:30:00Z
  title: Moci bez nemoci
  description: Další díl pořadu přinese příběh 19leté Nikoly. Ta se narodila s vrozenou deformitou prsu. Novinkový přístup operačního zákroku ji vrátil zpátky do kvalitního života, jak po funkční, tak i psychické stránce. Nabídneme velké téma, které propojuje plastickou chirurgii s psychickou rovnováhou v jednom z nejcitlivějších období dospívání. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijala také MUDr. Eva Dřevínková - plastický chirurg Kliniky plastické chirurgie FN Královské Vinohrady a kliniky Laser Plastic. Premiéra.
