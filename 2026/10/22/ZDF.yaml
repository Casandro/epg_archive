  description: |-
    Norwegen 2023
    Eine Gruppe junger Freunde betrauert einen von ihnen selbst verschuldeten Unfalltod in ihren Reihen. Ein Wochenende im Grünen soll Ablenkung bringen, wird jedoch zum Horrortrip.

    In ihrem abgelegenen Ferienhaus wird das Trio von einem Unbekannten auf gespenstische Weise mit Erinnerungen an ihre gemeinsame Schicksalsnacht terrorisiert. Bald schon müssen die Freunde um ihr Überleben kämpfen, als der maskierte Fremde Jagd auf sie macht.
