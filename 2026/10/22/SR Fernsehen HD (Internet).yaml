  title: Mit Herz am Herd
  subtitle: Bibbelsches Bohnensuppe mit Zwetschgenkuchen
  description: |-
    In Staffel 12 hat das "Mit Herz am Herd-Team" seine mobile Kochinsel an der Saarschleife, am Noswendeler See, dem Binsenthal-Weiher in Neunkirchen, der Ludwigskirche in Saarbrücken, in Wallerfangen und im schönen Mandelbachtal aufgebaut. Am malerischen Binsenthal-Weiher bereiten Cliff Hämmerle und seine Koch-Azubis Verena Sierra und Michel Koch einen Klassiker der saarländischen Küche zu: Bibbelsches Bohnensuppe mit Zwetschgenkuchen. Cliffs Tipp: Etwas Mandelmehl auf den ausgerollten Kuchenteig geben - das saugt die Flüssigkeit von den Zwetschgen auf und schmeckt toll!
