  stop: 2026-10-22T08:54:00Z
  title: Apatyka
  description: Jakákoli aktivita je lepší než žádná. A platí to i o seniorech. Pohyb je pro ně naprosto klíčový, protože pomáhá udržet soběstačnost, zpomaluje stárnutí těla a výrazně zlepšuje fyzické i duševní zdraví. Vysvětlí to a na mnoha příkladech dokáže fyzioterapeutka Lenka Fasnerová. Přijďte si ji poslechnout. Apatyku tentokrát totiž vysíláme živě v rámci festivalu Prix Bohemia Radio. Zveme vás ve čtvrtek na 10. hodinu do atria budovy Českého rozhlasu Olomouc v Pavelčákově ulici číslo 19. Moderuje Dita Vojnarová.
