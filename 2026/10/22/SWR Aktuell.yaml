  title: SWR Aktuell Langstrecke
  description: |-
    14:00
    Die Ernährungsdocs - Essen als Medizin
    Schmerz und Entzündung eindämmen
    Host: Julia Demann

    14:30
    Abenteuer Diagnose - der Medizin-Krimi-Podcast
    Rätselhafte Fraktur - warum wächst der Knochen nicht zusammen?
    Ein Fahrradunfall, ein gebrochener Knochen - und ein Heilungsprozess, der einfach nicht in Gang kommt. Für Ulrich F. aus Hamburg beginnt damit ein langer, zermürbender Weg. Wochen vergehen, Monate vergehen. Die Röntgenbilder zeigen immer dasselbe ernüchternde Bild. Ärztinnen und Ärzte suchen nach einer Erklärung - und finden keine. Was steckt hinter der Fraktur, die partout nicht heilen will? Ist es ein Zufall - oder verbirgt sich dahinter eine seltene Erkrankung, die jahrzehntelang unentdeckt geblieben ist? In dieser Folge von Abenteuer Diagnose wird aus einem alltäglichen Knochenbruch ein medizinisches Rätsel. Und die Lösung führt zurück bis in die Kindheit des Patienten.
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/abenteuer-diagnose-der-medizin-krimi-podcast/urn:ard:show:0d1f9e131aab22c7/
