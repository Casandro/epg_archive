  title: SWR Kultur - Das Wissen
  subtitle: Psychologische Sicherheit im Job - Gut und gerne arbeiten
  description: |-
    Von Sofie Czilwik
    Psychologische Sicherheit am Arbeitsplatz ist längst kein Wohlfühl-Mythos mehr. Mittlerweile gilt sie als unabdingbare Basis für modernes Arbeiten. Studien zeigen: Mitarbeitende, die sich in ihren Teams verletzlich zeigen, Fehler zugeben und sich trauen, ihre Meinung zu sagen, arbeiten zuverlässiger und innovativer. Psychologische Sicherheit kann vor Burnout und emotionaler Erschöpfung schützen. Entscheidend ist, welche Atmosphäre die Führungskraft schafft. Ein offenes Arbeitsklima und eine ehrliche Kommunikation, aber auch Zusammenarbeit, die auf Vertrauen basiert, sind dabei wesentlich.
