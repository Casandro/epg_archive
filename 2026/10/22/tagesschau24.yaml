  description: 'In der englischen Kleinstadt Luton soll ein neues System die Krankenhäuser entlasten: Wann immer möglich, versorgt die Ärztin Dr. Adriana mit ihrem Team schwer kranke Patientinnen und Patienten zu Hause, vor allem alte Menschen. Der neue Ansatz ist dringend notwendig, denn so wie im restlichen Land sind auch Lutons Krankenhäuser komplett überlastet, die Zustände oft unhaltbar. Kann das neue Modell Abhilfe schaffen?'
