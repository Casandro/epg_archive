  subtitle: Wie krisenfest sind unsere Krankenhäuser? - Film von Mareike Müller
  widescreen: true
  hd: true
  audiodesc: true
  description: Krankenhäuser müssen heute auf Krisen vorbereitet sein, die noch vor wenigen Jahren kaum vorstellbar schienen. Flut und Hitze, Hackerangriffe, Terror, Sabotage und Krieg sind längst keine abstrakten Szenarien mehr. Wie gut ist das deutsche Gesundheitssystem auf diese neue Realität vorbereitet? Und was ist uns eine verlässliche medizinische Versorgung in einer zunehmend unsicheren Welt wert?
