  subtitle: 'Hoe gaat het? - Op Pad S06 E130. Presentator Fred Zuiderwijk spreekt spontaan mensen aan in de hal van het ziekenhuis en vraagt: Hoe gaat het? Op Pad: het Land van Heusden en Altena.'
