  description: 'Faya besluit eindelijk de confrontatie met haar moeder aan te gaan. Ondertussen brengt de trouwjurk van Rolindes moeder meer dan alleen herinneringen naar boven en stuit Margot op een ontdekking over haar moeder die een donker vermoeden aanwakkert. Nienke vertelt haar zussen van haar tweelingzus, maar komt ook voor de keuze te staan om haar pas teruggevonden moeder te beschermen ten koste van de waarheid. Regisseur: Annemarie van de Mond. Acteurs: Joy Delima (Rolinde Veenstra), Melody Klaver (Faya Aardenburg), Fockeline Ouwerkerk (Nienke van Dijk), Abke Haring (Paulien Boogers), Olga Zuiderhoek (Saar Veenstra-Flemming) (2026)'
