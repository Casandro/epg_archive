  title: Het klokhuis
  subtitle: Birdcontroller S39 E4974. Op Schiphol vliegen niet alleen vliegtuigen, het is ook een aantrekkelijk gebied voor vogels. Anas loopt mee met birdcontroller Boy. Boy zorgt dat de vogels geen gevaar vormen voor het vliegverkeer.
  description: Je zou het misschien niet zeggen, maar op en rond Schiphol vliegen niet alleen vliegtuigen rond, het is ook een aantrekkelijk gebied voor vogels. Hoe zorg je er nou voor dat vogels en vliegtuigen niet met elkaar in aanraking komen? Anas mag bij hoge uitzondering mee de landingsbaan op en loopt een dagje mee met Boy. Boy zorgt er als birdcontroller voor dat vogels geen gevaar vormen voor het vliegverkeer. Hij laat zien hoe met verschillende verjagingstechnieken, afschrikmiddelen, en andere snufjes en trucjes een "birdstrike" wordt voorkomen. Wendel en Liza vinden dat mensen slecht omgaan met vogels. (2025)
