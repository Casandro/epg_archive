  title: Binnenstebuiten
  subtitle: S12 E141. Na een zoektocht naar meer ruimte woont een Amsterdams gezin in Lobith, Ramon maakt een zoet dessert; gevulde filorolletjes, een historische boomgaard vol verhalen en het Rotterdamse monument Cascade.
  description: 'Diana en Fabian hebben hun stad Amsterdam verlaten voor een ruim huis aan de Duitse grens. In Lobith maakten ze van een oude pizzeria een gezellig familiehuis. * Chef-kok Ramon maakt een zoet dessert: krokante filorolletjes gevuld met amandelen en honing en een sinaasappel-honingsiroop. * Boswachter Marieke is in Mensingeweer in een bijzondere historische hoogstamboomgaard. Historicus Bram Verhave weet alles van deze geschiedenis en de bijzondere plek. * Geert bezoekt het monument Cascade in Rotterdam. Een eerbetoon aan de stad als poort van de wereld voor onze grondstoffen, en tegelijk een vlammend betoog tegen onze afhankelijkheid daarvan. (2026)'
