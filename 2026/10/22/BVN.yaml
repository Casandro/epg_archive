  description: De achttienjarige Mandy is opgegroeid in een molen die al vijf generaties lang meegaat in haar eigen familie. Tussen de draaiende wieken en het ritme van het water bouwde ze een hechte band op met haar bijzondere thuis. Nu treedt ze als jonge molenaar in de voetsporen van haar familie. * Chef-kok Sharon maakt aardappelpuree met sinaasappel en gesmoorde aubergine in een kokoscurry. * Waar Tilburg ooit vooral opwarmde door steen en asfalt, groeit nu op steeds meer plekken het groen. Met haar groene initiatieven helpt Janneke de stad stap voor stap koeler en kleurrijker te maken en komen buurtbewoners met elkaar in contact. (2026)
