  subtitle: Radosław Kotarski wciela się w rolę obrońcy Twierdzy Srebrna Góra w Górach Sowich. Sprawdza, jakie obowiązki należały do stacjonujących tu żołnierzy i jak wyglądało ich codzienne życie.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Radosław Kotarski tym razem wciela się w rolę obrońcy Twierdzy Srebrna Góra w Górach Sowich. Sprawdza, jakie obowiązki należały do żołnierzy stacjonujących w twierdzy i jak wyglądało ich codzienne życie. Co jedli? Gdzie spali? Na jakie zapadali choroby? A wszystko to w niesamowitym otoczeniu natury! Nie ma się więc co dziwić, że turyści z całej Europy pokonują co roku setki kilometrów, aby na własne oczy przyjrzeć się największej górskiej twierdzy w Europie. Co ich kusi?
  genre:
  - '149'
