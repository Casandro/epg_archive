  title: Hotspot
  description: Proč se mladá generace hlásí k estetice, která ještě nedávno představovala něco, od čeho se chtěli lidé distancovat? Slavic aesthetic mění paneláky, teplákovky i postsocialistickou minulost v internetový trend. Zároveň ale stírá rozdíly mezi slovanskými kulturami a často zaměňuje celý region za Rusko. Co tahle fascinace vypovídá o našem vztahu k minulosti, Západu a vlastní identitě? Nejen o tom se baví moderátorka Sarah Abulkasim s kulturní historičkou Veronikou Pehe. Dej si novou epizodu Hotspotu!
