  title: Špína
  description: Špína se vrací ke své staré lásce, vlajkové lodi washingtonského vydavatelství Dischord, kapele Fugazi. Jejich poslední deska The Argument vyšla přesně před 25 lety a Fugazi tak zároveň zahájili dodnes trvající hiatus. Zároveň nám tak přistála ideální záminka k tomu, připomenout si, jak podstatná byla pro nezávislou scénu a punk nejen tato kapela, ale samotný label Dischord.
