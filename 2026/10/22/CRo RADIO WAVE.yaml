  title: Studovna
  description: Studovna se tentokrát přesunula na Edufestival, kde jsme v panelové diskuzi sdíleli zkušenosti se studiem v zahraničí - s Annou Stárkovou s USA, s Denisou Caldovou s Holandskem, Velkou Británií a USA a s Markem Palánem s Portugalskem. Poslechněte si jejich tipy i zážitky.
- eventId: 958432
  start: 2026-10-22T16:00:00Z
  stop: 2026-10-22T17:00:00Z
  title: Čelisti
  description: Čelisti tentokrát vysílají z fiktivní republiky Shadaloo a přinášejí pořádné Street Fighterské jokogeri keage. Vidí to Kluci z Čelistí jinak než holky? Je Clayface horší než blackface? Ovládá Aleše spíš Rozum, nebo cit? Chce být Vítek jako táta, nebo jako nepálský šerpský horolezec Tenzing Norgay? Funguje to ještě Tomákovi Tam dole? A hodlají Čelisti zůstat českém éteru Napořád? Šamšulka / cukříček / kuna. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal.
- eventId: 958433
  start: 2026-10-22T17:00:00Z
  stop: 2026-10-22T17:30:00Z
  title: Psycho
  description: Ve druhém dílu rozhovoru s vedoucím psychologem Vězeňské služby Václavem Jiřičkou se Karolína a Pavel zaměřují na terapii pachatelů násilných trestných činů. Jak taková terapie vypadá, s kým má smysl a kde má své limity? To řeší tento díl Psycha. (repríza)
