  description: "Wir begleiten Sie mit handverlesener Popmusik, aktuellen Berichten aus der Kulturszene und inspirierenden Gesprächen in den Abend.\n\nDarin heute:\n\nBericht\nVon der Konsole zurück zum Brettspiel - Spielemesse in Essen zeigt großes Interesse an analogem Miteinander\nvon Olaf Biernat\n\nSong des Tages\nHowlvon Mei Semones\n\nBericht\nPremiere des Theaterstücks \"Der Schatten von Speyer\" im Alten Stadtsaal\nvon Kerstin Bachtler\n\nGast vor acht\nModerator Willi Weitzel sammelt für sein neues Bühnenprogramm weltweit Träume \n\nBuch des Tages\nMaría Agúndez: Saubere Häuser\nvon Victoria Eglau\n\nBericht\nMina Lichtenberg erhält den  Newcomer-Jazzpreis Rheinland-Pfalz\nvon Konrad Bott\n\n\n \n\nMusikliste:\n1.  Westside Cowboy: Dobro\n2. Anna Roig i L'ombre de ton chien: Així és la vida\n3. Semones, Mei: Howl \n4. Gringo Mayer : Ich kimmer mich drum\n5. Sroka: La nuée\n6. Gotts Street Part feat. Some birds don't fly\n7. Selah Sue: Another way\n8. Fjarill: Selbstbetrug\n9. Marco Castello: Beddu\n10.Bare Folk: Barnedrøm\n11. Ondara, J.S: American dream\n12. Madison Cunningham : Break the jaw\n13. Dekel, Irit & Zitrin, You don't know what love is\n14. Vinicio Capossela: Pryntyl\n15. Shannon Lay: Rare to wake\n19:00 - 19:04 Nachrichten, Wetter"
