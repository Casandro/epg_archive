  title: TM Wissen
  subtitle: Brennende Lösung - Wie Feuer den Neusiedler See retten kann
  description: 'SOS am Neusiedler See: Der Schilfgürtel erstickt unter seiner eigenen Biomasse! Alte Halme bilden undurchdringliche Matten, blockieren neues Wachstum und setzen beim Verrotten klimaschädliches Methan frei. Die Rettung kommt überraschend: Feuer! Ein Forschungsteam um Ornithologe Dvorak und Schilfschneider Fiedler entdeckt, dass kontrollierte Brandrodung dem Ökosystem neue Kraft gibt. Erste Tests zeigen: Wo es brennt, kehrt die Artenvielfalt zurück. Manchmal braucht die Natur eben einen heißen Neustart! // In den steirischen Alpen testen Gipfelstürmer der anderen Art: Das Wiener Start-up Solocean lässt Solarpanels schwimmen lernen! Auf 1.300 Metern Höhe sollen "Solar-Floater" auf einem Bergsee installiert werden - eine sonnige Revolution für die Wintersportbranche. Während unten Skifahrer ihre Schwünge ziehen, sollen oben die schwimmenden Kraftwerke Schneekanonen und Lifte mit Ökostrom versorgen. Nun muss sich zeigen, ob die solaren Schwimmer dem alpinen Extremwetter trotzen können! // Orcas als maritime Rebellen? In der Straße von Gibraltar treiben Schwertwale ein mysteriöses Spiel mit Segelbooten - sie knabbern an Rudern und bringen sogar Schiffe zum Kentern! Dr. Renaud de Stephanis und sein Unterwasser-Paparazzo Sebastian Lang sind den schwarzweißen Säugern auf der Spur. Mit Hightech-Gadgets wie Satellitenortung und Spezialkameras wollen sie herausfinden: Handelt es sich um aggressive Attacken oder übermütigen Zeitvertreib? Eine Krimi auf hoher See mit den intellektuellen Schwergewichten der Meere! // Außerdem: Warum essen wir an Fasching Krapfen? Wie sammeln kanadische Inuit im Frühling Muscheln? Wie halten sich Pinguine in der Arktis warm? Warum verkleiden sich Tierpfleger als Panda? Und: Woher kommt die Redewendung "Die Katze aus dem Sack lassen"?Österreich 2025'
