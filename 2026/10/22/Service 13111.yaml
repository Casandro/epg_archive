  title: Australien - Magische Tierwelt
  subtitle: Ozean
  description: "Schneebedeckte Berge, weitreichende Trockengebiete durchzogen Salzseen, herrliche Küstenlandschaften mit spektakulären Korallenriffen. Australien besitzt die wohl abwechslungsreichste Natur unseres Planeten. Doch um in dieser Natur zu überleben, haben sich bestimmte Tierarten zu wahren Überlebenskünstlern entwickelt. Die dreiteilige Blue Chip-Serie zeigt, dass einige ihrer Überlebensstrategien aus dem Reich der Magie stammen könnten. Denn in Australien scheinen die Tiere Musik zu machen, zu tanzen und sich wie Akrobaten durch die Luft zu schwingen. Dank hochmoderner Aufnahmetechniken kann der Zuschauer die ungewöhnlichen Verhaltensweisen in Australiens Tierwelt erstmals kennen lernen. Ein Reich von Zauberern, Verführern und Ganoven!   \n\nDoppelt so viele Tierarten leben in Australien unter Wasser als auf dem Land. In den drei Ozeanen - Südsee, Pazifik und Indischer Ozean - die den Staat umgeben, trifft man auf seltene Arten von Walen, Haien und Tintenfischen. Einige von ihnen sind nur auf der Durchreise, doch viele sind hier auch heimisch geworden. \nAustralien 2019, R: Tosca Looby"
  genre:
  - '145'
  widescreen: true
