    Riskanter Ausweg

    Armando Castillo probt intensiv für den Grand Prix, der in Brüssel stattfinden wird. Der verletzte Max wird von seinen Freunden gebeten, als moralische Unterstützung mit nach Brüssel zu fahren.

    Auch sein Vater fordert ihn auf, mitzureisen. Aber Max lehnt ab und bleibt in Paris. Am Tag vor dem Auftritt kommt es in Brüssel zu einem Streit zwischen der Engländerin Jenna und Lena. Gekränkt fordert Lena die englische Crew zu einem Wettstreit auf.

    Dieser sinnlose Kampf der beiden Gruppen wird aber von Armando und der Schuldirektorin Gabrielle Carré unterbrochen. Allen Schülern, die an diesem Wettstreit teilgenommen haben, droht der Verweis von der Schule. Lena sieht die Schuld allein bei sich und erkennt nur einen Ausweg. Sie muss mit dem Zeitmesser ihrer Mutter die Zeit zurückstellen und alles zum Positiven wenden. Ihre Freundin Ines hält das für sehr gefährlich und will sie davon abhalten. ...
