  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schneeflöckchen, Weißröckchen

    Es hat geschneit, und Pip und Posy bauen einen lustigen Schneemann, den sie "Schneeflöckchen, Weißröckchen" taufen. Plötzlich beginnt es, zu regnen, und der Schneemann ist in Gefahr.

    Sie schützen ihn mit einem Schirm vor den dicken Regentropfen. Als es wieder aufhört, zu regnen, möchte Posy gern eine heiße Schokolade trinken. Pip begleitet sie ins Haus - er denkt, dass seinem "Schneeflöckchen, Weißröckchen" jetzt nichts mehr passieren kann.

    Aber Pustekuchen. Inzwischen ist die Sonne hervorgekommen, und der Schneemann schmilzt langsam vor sich hin. Pip schlägt vor, ihn in den Kühlschrank zu stellen - aber dabei stolpert er, und von "Schneeflöckchen, Weißröckchen" bleibt nur noch eine Pfütze übrig. Pip ist sehr traurig. Doch dann bastelt Posy ein neues Schneeflöckchen aus Papier und viele andere Sachen für ihn - und Pip kann wieder lachen.
    Regie: Seán McCormack
    Buch/Autor: Isabel Fay, Matt Baker
    Musik: Ellie Wyatt, Joss Peach
    HD-Produktion
