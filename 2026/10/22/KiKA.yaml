    Die Waldinspektoren

    Die BEWI (Behörde Echter Wald-Inspektoren) hat sich angekündigt, um den "Super Happy Status" des Magic Forests zu überprüfen. Meister Heiter will, dass dafür alles absolut perfekt ist.

    Doch er schießt komplett übers Ziel hinaus. Es geht alles schief, was nur schiefgehen kann und die Inspektoren erkennen den "Super Happy Status" umgehend ab. Meister Heiter ist total geknickt. Die Helden dagegen lassen sich nicht entmutigen - mit Erfolg.
    Regie: Ruth Ducker
    Buch/Autor: Isabel Fay, Ciaran Murthag, Andrew Barnett Jones
    Musik: Andy Mellon, John Greswell
