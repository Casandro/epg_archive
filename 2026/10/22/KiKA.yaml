    In den Lach- und Sachgeschichten geht es heute um viele Tiere. Kleine Ziegen toben auf ihrem eigenen Spielplatz. Dabei balancieren sie auf Holzbalken und laufen über eine Wippe. Das ist gar nicht so leicht! Tanja und André üben einen schwierigen Zungenbrecher, dabei geht es auch um Tiere. Timmy spielt mit einem ganz besonderen Haustier - bis es plötzlich verschwindet. Wer wohl dahintersteckt? Die Geschichte gibt es zuerst auf Englisch, dann auf Deutsch. Der berühmte Zauberer Denis Moschitto, auch genannt Michelle Miracle, möchte eine weiße Taube aus einem Zylinder herzaubern. Leider funktioniert das nicht ganz so wie geplant. Und zum Schluss zeigt auch Knolle Tanja noch einen tollen Zaubertrick. Kann er wirklich aus Wasser Eis zaubern? ...
