  title: 'États-Unis/Manifs lycéennes/Trafic de drogue/Génération boomerang '
  subtitle: 'C''est que le début : États-Unis, la peine de mort et ses dérives E07. "Mise au Point" propose des enquêtes, des reportages et des interviews portant sur différents thèmes d''actualité au niveau national et international.'
  description: "Au sommaire : \n\nC'est que le début : États-Unis, la peine de mort et ses dérives\nUne condamnée à mort qui survit à son exécution, de futures mises à mort en public et en direct : les pratiques américaines choquent.\n\nTableau noir\nLa révolte des lycéens déstabilise la France et son gouvernement, à quelques mois d'une élection présidentielle tendue. Les manifestations et les émeutes n'ont pas essaimé en Suisse, malgré plusieurs appels sur les réseaux sociaux, mais elles sont observées de très près par les élèves romands. Regards croisés entre la France et la Suisse.\n\nBankok mule\nUn reportage exceptionnel sur la piste de ces jeunes Suisses romands arrêtés en Thaïlande pour trafic de drogue. Comme de nombreux occidentaux, ils ont été recrutés via les réseaux sociaux. \nInvitée : Béatrice Guelpa, journaliste\n\nAllô maman dodo\nRevenir habiter chez ses parents et retrouver sa vieille chambre d'enfant : de plus en plus de Suisses y sont obligés en raison de la crise du logement et des difficultés économiques. Reportage au sein de ce qu'on appelle « la génération boomerang ».\n\nPrésentation : Philippe Revaz\n "
