  title: 'Grands prématurés / Prix du carburant / Colocation '
  subtitle: 'À Strasbourg, le service de néonatologie de l''hôpital de Hautepierre accueille chaque année des dizaines de grands prématurés. Ukr '
  description: "Au sommaire : \n\nGrands prématurés : des vies sur le fil\nIls sont nés à 25 semaines de grossesse, pèsent parfois à peine 600 grammes, et leur vie se joue dans une couveuse. À l'hôpital de Hautepierre, à Strasbourg, le service de néonatologie accueille chaque année des dizaines de grands prématurés. Derrière les portes du service, il y a des équipes médicales mobilisées jour et nuit, et des parents suspendus au moindre chiffre affiché sur un moniteur. Ici, la vie et la mort se côtoient en permanence...\nReportage : Sonia Sadone\n\nCarburants : comment ne plus subir la crise ?\nUkraine, Iran, Arabie saoudite... À chaque soubresaut de l'actualité internationale, les prix des carburants flambent et les habitants des petites villes et des campagnes françaises sont pris au piège. Dans ces zones où la vie quotidienne est impossible sans énergies fossiles, comment s'organisent les artisans, les salariés et les familles ? \n\nEn coloc malgré eux\nEn pleine crise du logement, jamais les Français n'ont été si nombreux à vivre en colocation. Une situation loin d'être toujours choisie. La vie en commun n'est plus seulement associée à la période d'études : 44 % des candidats à des colocations sont des actifs et la moitié d'entre eux sont en CDI. Ce côté « auberge espagnole » peut séduire, mais parfois, la colocation c'est aussi une impression de régression sociale. \nReportage : Emmanuelle Msika, Clément Brelet, Florent Bardos\n\nPrésentation : Élise Lucet\n "
  ageRating: 7
- eventId: 948057
