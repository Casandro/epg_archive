  title: Entstehung der Alpen - Schatzkammer Alpen
  subtitle: Entstehung der Alpen - Schatzkammer Alpen
  description: 'Entstehung der Alpen - Schatzkammer Alpen: Unsere Alpen sind eine wahre Schatzkammer, sogar im allerengsten Sinn des Wortes. Denn unter den Wurzeln der Berge schlummern wertvolle Ressourcen. Der österreichische Wissenschafter Prof. Rudi Simek ist dafür durchs Land unterwegs auf der Suche nach diesen Schätzen. Stets mit einem Augenzwinkern, ob in den Mythen nicht doch ein Kern Wahrheit steckt. AT 2015'
- eventId: 951316
  start: 2026-10-22T07:25:00Z
  stop: 2026-10-22T08:11:00Z
  title: Entstehung der Alpen - Erlebniswelt Alpen
  subtitle: Entstehung der Alpen - Erlebniswelt Alpen
  description: Entstehung der Alpen - Erlebniswelt Alpen:Unsere Alpen - seit jeher ein geschichtsträchtiger Ort im Herzen Europas und Mittelpunkt historischer Entwicklungen und bahnbrechender Erkenntnisse. Beeindruckende Berge, wilde Flüsse und einzigartige Landschaften haben die Menschen seit Jahrhunderten bewegt und in die Alpen gelockt. Prof. Rudolf Simek macht sich auf die Spuren des Tourismus. Warum kamen die ersten Reisenden in die Alpen und wie entwickelte es sich zum Massentourismus? AT 2015
- eventId: 951317
  start: 2026-10-22T08:15:00Z
  stop: 2026-10-22T09:02:00Z
  title: Bergwelten - Influencer - Vernetzt mit den Bergen
  subtitle: Bergwelten - Influencer - Vernetzt mit den Bergen
  description: |-
    Sie sind die Trendsetter unserer Zeit, verstehen sich als moderne Meinungsbildner: Influencer. Aus der digitalen Welt sind sie nicht mehr wegzudenken, ihre Erlebnisse unverhohlene und kaum bezahlbare Werbung. Auch für den Tourismus im Alpenraum. Wir begleiten sechs Influencer, die es es sich zur Aufgabe gemacht haben, ihr Leben in den Bergen mit der Welt zu teilen.
    Dabei stellt sich die Frage nach Authentizität. Sowohl, was die Erlebnisse an sich angeht, als auch die gestalterische Umsetzung: Wo liegt die Grenze zwischen Erleben und Inszenieren? Sind Soziale Medien nur ein Mittel zum Zweck - oder verhält es sich umgekehrt?
    Und was macht die Faszination überhaupt aus? Geht es um Inspiration, Stellvertreter-Erleben, während wir in unserer Komfortzone Latte-Macchiato schlürfen? Oder haben wir nur das Gefühl, ständig etwas zu verpassen?
    Im Film kommen wir so nah an die Influencer heran, wie sonst nie. Wir werfen einen Blick "hinter die Kulissen", sind mit dabei auf spektakulären Trips und bei der langwierigen Nachbearbeitung.
    Und erleben mit ihnen den täglichen Spagat zwischen Wunsch und Wirklichkeit. AT 2021
