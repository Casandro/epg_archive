- eventId: 951275
  start: 2026-10-22T00:25:00Z
  stop: 2026-10-22T01:15:00Z
  title: Faszination Heimat - Geheimnisse der Schauhöhlen
  subtitle: Faszination Heimat - Geheimnisse der Schauhöhlen
  description: Jedes Jahr ziehen Österreichs Schauhöhlen tausende Besucher an, die eine faszinierende Welt aus Stein und Stille bestaunen. Keiner von ihnen aber ahnt, dass sich abseits der gesicherten Wege riesige Labyrinthe verbergen. Höhlenforscher Robert Bouchal zeigt uns die unbekannten Geheimnisse abseits der ausgetretenen Pfade, uralte Fresken in der Karnerhöhle beispielsweise oder ein zehntausend Jahre altes Skelett in der Kärntner Obirhöhle. AT 2015
- eventId: 951276
  start: 2026-10-22T01:15:00Z
  stop: 2026-10-22T02:02:00Z
  title: Heimatleuchten - Wasserreich Österreich - Unterwegs mit Sebastian Weber
  subtitle: Heimatleuchten - Wasserreich Österreich - Unterwegs mit Sebastian Weber
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 951277
  start: 2026-10-22T02:05:00Z
  stop: 2026-10-22T02:18:00Z
  title: Mit dem Camper durch Hokkaido
  subtitle: Mit dem Camper durch Hokkaido
  description: Mit dem Campervan durch Hokkaido? Unbedingt! Ein unvergesslicher Roadtrip, der uns ein Japan zeigte, das wir so nicht erwartet haben. Weit weg der Touristenmassen, rein in die letzte Wildnis des Landes, wo man mit etwas Glück Bären bewundern und Orcas und Blauwalen hallo sagen kann. Von abgeschiedenen Nationalparks, unberührter Natur, brodelnden Vulkanen, dem nördlichsten Punkt des Landes und einer nie endenden schroffen Küste, erlebten wir hier ein Japan, das uns mehr als ein Mal die komplette Freiheit spüren ließ und uns daran erinnerte, dass es sich immer lohnt die ausgetretenen Pfade auf Reisen auch mal zu verlassen. AU 2025
