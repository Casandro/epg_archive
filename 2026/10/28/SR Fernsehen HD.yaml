  title: Mein Körper. Mein Alter
  subtitle: Wer bestimmt, wie alt ich bin?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: 'Man ist so alt, wie man sich fühlt - Phrase oder Wirklichkeit? Damit beschäftigt sich eine neue Doku von ARD Wissen. Sie geht der Frage nach, inwieweit der Alterungsprozess beeinflusst werden kann und welche Faktoren eine Rolle spielen. Dabei nähert sie sich dem Thema aus unterschiedlichen Perspektiven. Denn Fakt ist: Jeder Mensch altert anders. Wie können wir unser biologisches Alter beeinflussen?'
