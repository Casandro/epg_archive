  title: Terra Santa News
  subtitle: Terra Santa News - Nachrichten aus dem Heiligen Land
  description: In Kooperation mit dem Christian Media Center der Kustodie des Heiligen Landes sendet EWTN wöchentlich aktuelle Nachrichten aus dem Heiligen Land. Damit will EWTN die Schönheit und den kulturellen Reichtum des Landes zeigen, das die Heimat Jesu Christ war, und den Blick auf die Menschen lenken, die dort heute leben. Dazu gehören Berichte über kirchliche Feste, liturgische Feiern und Veranstaltungen ebenso wie über besondere Ereignisse und das Alltagsleben der Christen im Heiligen Land.
  widescreen: true
- eventId: 964523
  start: 2026-10-28T01:00:00Z
  stop: 2026-10-28T01:30:00Z
  title: Maria - Zwischen Himmel und Erde
  subtitle: Maria und die Dreiheit der Evangelischen Räte
  description: In der 3. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup über Maria und die Dreiheit der Evangelischen Räte. In der Mitte der Kirche stehen nach Lumen Gentium die Evangelischen Räte. Jeder Gläubige soll aus dem Bekenntnis zu diesen Räten leben. Ihre Dreigestalt läßt sich aus der Dreigestalt der Zeit ableiten, Vergangenheit, Gegenwart und Zukunft. Mit den brisanten Interessen will ich mich in der Zeit erhalten, was nicht gelingt, da ich sterben werde. Die Befreiung vom Tod bringen erst die Evangelischen Räte und das Leben in der Gnade.
  widescreen: true
- eventId: 964524
  start: 2026-10-28T01:30:00Z
  stop: 2026-10-28T01:45:00Z
  title: Bericht aus Genf - mit Christian Peschken
  subtitle: '"Migration zwischen Grenzen und Menschenwürde: Wo steht die Kirche?"'
  description: |-
    Migration gehört zu den großen politischen und gesellschaftlichen Herausforderungen unserer Zeit. Dabei beginnt die Debatte bereits bei den Begriffen: Flüchtlinge, Migranten und Asylsuchende werden im öffentlichen Diskurs häufig miteinander gleichgesetzt - obwohl es sich um unterschiedliche Kategorien mit unterschiedlichen rechtlichen Voraussetzungen handelt.
    Gleichzeitig stellt sich eine grundsätzliche Frage: Wie kann Migration so gestaltet werden, dass sie sicher, legal und geordnet erfolgt? Welche Verantwortung tragen die Herkunfts- und Aufnahmeländer - und wie lässt sich dabei die Würde jedes einzelnen Menschen schützen?
  widescreen: true
- eventId: 964525
  start: 2026-10-28T01:45:00Z
  stop: 2026-10-28T02:15:00Z
  title: GRANDIOS (4. Staffel)
  subtitle: Ralf Bielefeldt
  description: Ralf Bielefeldt hat sich mit seinem Berliner Hafenbistro "Kleine Freiheit Teltow" einen kleinen Traum erfüllt. Er hat Freude daran, Kommunikationsräume zu schaffen, wo Menschen sich begegnen und austauschen können - ein Talent, das er nutzen will. GRANDIOS hat ihn in seinem Hafenbistro besucht, um den Selfmade-Man kennenzulernen.
  widescreen: true
- eventId: 964526
  start: 2026-10-28T02:15:00Z
  stop: 2026-10-28T02:45:00Z
  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: 'Hl. Johannes Paul II.: "Fürchtet euch nicht!"'
  description: 'Diese Woche in Vaticano: Wir feiern das 45-jährige Bestehen der Johannes-Paul-II.-Stiftung im Vatikan und erinnern an das Leben und Pontifikat Johannes Pauls II. Mit Gianfranco Svidercoschi, dem ehemaligen stellvertretenden Direktor des L''Osservatore Romano, sprechen wir über Karol Wojty_as besondere Verbundenheit mit jungen Menschen. Abschließend erleben wir bei einer Gebetswache auf dem Petersplatz die Nacht der Wahl des polnischen Papstes noch einmal.'
  widescreen: true
