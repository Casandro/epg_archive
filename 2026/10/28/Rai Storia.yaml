  title: Passato e presente Margherita la prima r
  subtitle: 'Passato e presente Margherita la prima regina d''Italia - ''''Eterno femminino regale'''' per il repubblicano Carducci, ''''professionista'''' del trono, per Indro Montanelli: la regina Margherita, prima sovrana d'''
  description: 'd''Italia, due volte Savoia per appartenenza e per matrimonio col re Umberto I, fa della corona una missione, contribuendo a unificare una nazione appena nata e disperatamente in cerca di identità. In un Paese frammentato e ferito, alle prese con tensioni mai sopite e sfide nuove, Margherita ridisegna il volto della monarchia: crea dalle fondamenta una corte di respiro europeo, tenta il riavvicinamento tra lo Stato e la Chiesa arroccata sulle sponde dell''Oltretevere e rende il trono accessibile al popolo. Amministratrice accorta della sua immagine, è lei stessa l''artefice del suo mito che nutrito di valori patriottici trasforma la lunga epopea risorgimentale nella consacrazione della dinastia sabauda. Il margheritismo è una febbre collettiva fatta di tradizione e modernità, opere benefiche e paternalismo, moda e mecenatismo, fervore nazionalista e grandeur savoiarda, politica d''acciaio e ardimento colonialista. Una leggenda così potente da sopravvivere al sangue versato sulle strade della repressione e all''abbraccio finale col fascismo. Alla sua morte, cento anni fa, il 4 gennaio del 1926, il New York Times scriverà: Era adorata dagli italiani. Un viaggio magnetico nei lati oscuri e luminosi della regina Margherita. In studio con Paolo Mieli, il prof. Francesco Perfetti. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D''Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Francesco Perfetti Con la partecipazione di Charlotte Marincola'
