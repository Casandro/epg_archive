  title: Houpačky
  description: Děti potřebují chránit. Když v tom selhává rodičovská náruč, nastupuje stát. Je jeho přístup vždycky fér? Kde končí svoboda rodičů vychovávat a kde začíná dohled, jestli svoji práci dělají dobře? O tom jsme mluvili v kině Bio Oko po projekci filmu Fjord. Moderátorka Michaela Sladká se ptala právničky Madgy Freseové a psycholožky Elišky Kodyšové.
