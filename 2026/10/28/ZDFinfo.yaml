  subtitled: true
  description: |-
    Deutschland 2023
    Die Entdeckung der Kernspaltung führt in ein neues Zeitalter. Die Frage ist: Wie wird die Menschheit dieses neue Energiepotenzial für sich nutzen?

    In Hiroshima wird die Welt zum ersten Mal Zeuge des gewaltigen Zerstörungspotenzials der Atombombe. Die Kernwaffe wird zum Spielball politischer Machtkämpfe und die Atomkraft gleichzeitig zum Hoffnungsträger für eine sichere und bezahlbare Energieversorgung.
    HD-Produktion
