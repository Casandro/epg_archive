    Nach 9/11 bricht der "Krieg gegen den Terror" aus. Der Gegner ist keine Armee, sondern es sind flexible Netzwerke und Ideologien, die sich der konventionellen Kriegsführung entziehen. Technische und zahlenmäßige Überlegenheit sind kein Garant mehr für den Sieg.
