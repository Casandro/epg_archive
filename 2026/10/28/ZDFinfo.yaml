  description: |-
    Deutschland 2023
    Die Kubakrise bringt die Welt an den Rand eines Atomkrieges. Den Mächtigen wird klar, dass die Existenz der menschlichen Zivilisation auf dem Spiel steht.

    Die folgende Zeit prägen bahnbrechende wissenschaftliche Entdeckungen, geopolitische Spannungen und tragische Katastrophen. Eine Zeit, in der die zivile und militärische Nutzung der Atomkraft gesellschaftliche und politische Debatten nachhaltig beeinflusst.
