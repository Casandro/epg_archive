  title: Tödliches Erbe der DDR - Deutsches Uran für Moskaus Bomben
  subtitle: Erz um jeden Preis
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Dokumentationsreihe, Deutschland 2026
    Kurz nach Kriegsende 1945 startet im Erzgebirge eines der größten Geheimprojekte der Nachkriegszeit: Unter dem Tarnnamen "Wismut" graben Arbeiter nach Uran für Stalins Atombombe.

    Sachsen und Thüringen sind im Kalten Krieg anfangs die wichtigsten Uran-Lieferanten Moskaus. Zehntausende schuften unter strenger Geheimhaltung und Lebensgefahr. Viele kommen ums Leben - durch Unfälle und die Langzeitfolgen radioaktiver Strahlung.
    HD-Produktion
