  title: MareTV
  subtitle: Lissabon. Fado, Feinkost und Flamingos
  description: Malerische Gassen, prächtige Paläste und eine permanente frische Brise vom Atlantik. Die Seefahrt hat Lissabon Wohlstand gebracht. Portugals Hauptstadt am Fluss Tejo ist sowohl kosmopolitisch als auch voller Traditionen. Ein Beispiel ist Tuago Ferreira, der in dritter Generation eine Konservenfischfirma führt. Sardinen in Öl erleben derzeit eine Wiederbelebung. Ana Moura, eine berühmte Sängerin, interpretiert traditionellen portugiesischen Gesang kreativ auf ihre eigene Weise, ein Ausdruck ihrer Lebenseinstellung voller Melancholie und Sehnsucht. Im Gegensatz zum urbanen Flair von Lissabon gibt es südlich der Hauptstadt ein Naturschutzgebiet mit etwa 200 Vogelarten. Eine der wenigen Flamingo-Kolonien Europas findet sich auch in diesem fischreichen Biotop. Die Westküste Portugals ist als Mekka für Surfer bekannt, obwohl der raue Atlantik und seine riesigen Wellen nur für erfahrene Surfer geeignet sind.
  genre:
  - '161'
  widescreen: true
  hd: true
- eventId: 973007
  start: 2026-10-28T14:25:00Z
  stop: 2026-10-28T15:20:00Z
  title: MareTV
  subtitle: Die Flensburger Förde - Deutsch-dänische Meeresbucht
  description: 'Zwei Nationen, eine Meeresbucht: Zwischen Deutschland und Dänemark erstreckt sich die Flensburger Förde als Verlängerung der Ostsee bis zum Festland. Die Grenze verläuft durch die Mitte des Flensborg Fjords, wie die Dänen ihn nennen, 40 Kilometer von der Stadt Flensburg entfernt, dem westlichsten Punkt der Ostsee. MareTV begleitete Menschen, die den schmalen Fjord auf beiden Seiten der Bucht teilen: zu Land, zur See und in der Luft! Nichts scheint Wasserflugzeug-Instructor Sven Bohnsack-Porten zu erschüttern. Besonders was Starts und Landungen auf dem unruhigen Fjord betrifft, die sowohl für Flugschüler als auch Lehrer eine Herausforderung sind. Glatte Wasseroberflächen und andere ideale Bedingungen kommen selten vor. Erschwerend kommt hinzu, dass die Landebahn regelmäßig mit fast schiffsverkehrsähnlichen Staus verstopft ist. Die beiden kleineren Ochseninseln auf der dänischen Seite sind die einzigen in der Flensburger Förde.'
  genre:
  - '161'
  widescreen: true
  hd: true
