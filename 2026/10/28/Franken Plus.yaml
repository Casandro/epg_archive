  title: TVO - Oberfranken Aktuell (Wh.)
  subtitle: Mit unserer Nachrichtensendung erreichen wir von Montag bis Freitag täglich bis zu eine Million Menschen in den neun oberfränkischen Landkreisen Bamberg, Bayreuth, Coburg, Forchheim, Hof, Kronach, Kulmbach, Lichtenf..
  description: Mit unserer Nachrichtensendung erreichen wir von Montag bis Freitag täglich bis zu eine Million Menschen in den neun oberfränkischen Landkreisen Bamberg, Bayreuth, Coburg, Forchheim, Hof, Kronach, Kulmbach, Lichtenfels und Wunsiedel sowie in den kreisfreien Städten Bamberg, Bayreuth, Coburg und Hof. In Oberfranken Aktuell blicken wir auf die wichtigsten, spannendsten und unterhaltsamsten Themen des Tages in unserem Sendegebiet. Die Erstausstrahlung der Sendung gibt es im Kabel immer um 18:00 Uhr, via Satellit (Franken Plus) ab 19:00 Uhr!
- eventId:
