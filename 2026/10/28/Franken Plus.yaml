  subtitle: Mit unserer Nachrichtensendung erreichen wir von Montag bis Freitag täglich bis zu eine Million Menschen in den neun oberfränkischen Landkreisen Bamberg, Bayreuth, Coburg, Forchheim, Hof, Kronach, Kulmbach, Lichtenfels un..
