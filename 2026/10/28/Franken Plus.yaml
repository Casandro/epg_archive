  title: TVO - Ein Freund für Dich (Wh.)
  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen S..
  description: Tiere machen das Leben bunter, lustiger und Menschen einfach glücklich. Tiere sind unsere besten Freunde, sie sind Seelentröster und gehören einfach zur Familie. Trotzdem leben in den Tierheimen immer noch so viele Hunde, Katzen, Vögel und weitere Kleintiere, die keine Familie haben - ein neues liebevolles Zuhause aber verdient haben. In Ein Freund für dich besuchen wir deshalb die Tierheime in ganz Oberfranken, stellen Ihnen zauberhafte Tiere vor und hoffen, dass sich neue Herrchen und Frauchen finden, die den Tieren die Liebe geben, die sie verdient haben.
