    Sterben verändert alles
    Drama, USA 2008
    Altersfreigabe: ab 16
  description: |-
    Nach dem Tod von Amber kehrt Wilson erstmals seit zwei Monaten ins Princeton Plainsboro zurück. Cuddy bittet House, mit seinem Freund zu reden, denn Wilson hat vor, das Krankenhaus zu verlassen. Nun sucht House Mittel und Wege, ihn zum Bleiben zu bewegen - mit wenig Erfolg. Sein Team lässt er derweil mit einem neuen Fall allein: Eine junge Frau wurde mit Halluzinationen eingeliefert. Doch Dreizehn, Taub und Kutner sind ratlos und bräuchten dringend die Hilfe ihres Chefs.

