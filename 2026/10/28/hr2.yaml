  subtitle: '"Geschüttelt, nicht gerührt!" - Musik für Geheimagenten'
  description: |-
    Geheimagenten im Einsatz! Diesmal nicht in New York oder der Karibik, sondern in Frankfurt am Main und im hessischen Bergland! Hier sind die Bösewichte nicht weniger gefährlich, auch wenn sie Hessisch babbeln und mit Bembeln statt Bomben um sich werfen. Frankfurts 007-Spion erwarten Attacken im Ebbelwoi-Express, Schlammschlachten im Kellerwald und jede Menge Action am Wasserhäuschen.

    Wird wiederholt am 29.10.2026.
    Wird wiederholt am 01.11.2026.
