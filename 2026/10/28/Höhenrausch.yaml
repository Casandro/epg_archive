  title: Winter Gold - Fear
  subtitle: Winter Gold - Fear
  description: Die Angstbewältigung ist für alle Wintersportler essenziell. Sie müssen mutig sein, das zu tun, was sie am besten können - denn ein Moment des Zögerns im falschen Moment kann zu einem noch gefährlicheren Ergebnis führen. Mit der britischen Snowboarderin Katie Ormerod in der Hauptrolle. NL 2021
- eventId: 701993
  start: 2026-10-28T01:40:00Z
  stop: 2026-10-28T02:30:00Z
  title: Faszination Heimat - Macht der Erde
  subtitle: Faszination Heimat - Macht der Erde
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Geophysiker Norbert Span. Dank seiner sehr persönlichen Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Erde, das sich auf vielfältige Weise im Alpenraum zeigt. Als Fels, Almböden und saftige Wiesen.  AT 2013'
- eventId: 701994
  start: 2026-10-28T02:30:00Z
  stop: 2026-10-28T03:17:00Z
  title: Heimatleuchten - Wild unterwegs - im Pongau
  subtitle: Heimatleuchten - Wild unterwegs - im Pongau
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2020'
- eventId: 701999
  start: 2026-10-28T03:20:00Z
  stop: 2026-10-28T03:59:00Z
  title: Saslonch Suite
  subtitle: Saslonch Suite
  description: 'Was passiert, wenn einige Extremsportler auf der Oberfläche eines Felsens mit einigen Jazzmusikern in einen Dialog treten? Andreas Pichler dokumentiert ein Projekt des Jazzfestivals Südtirol, Südtirol, bei dem Kletterer und Seiltänzer ihren ganz eigenen Rhythmus finden. Wer nicht voll konzentriert ist, wer nicht anwesend ist, hat verloren. Diese Regel gilt sowohl für Musiker als auch für Kletterer. In einer außergewöhnlichen Symbiose begleiten Jazzmusiker Kletterer und Slackliner auf ihren Touren. Musik ist ein verbindendes Element zwischen den Künstlern, sie dient als Motivator, Metronom und Zeitvertreib. Dieser Dokumentarfilm voller Adrenalin beschäftigt sich mit dem Dialog verschiedener Kunstformen. Offizielle Auswahl 2015: Trento Film Festival, Cervino Cinemountain International Film Festival, International Festival of Outdoor Films, South Tirol Jazz Festival & DOK.fest München. CH 2014'
