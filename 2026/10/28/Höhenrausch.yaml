  title: Entdecker der Welt - Titanen aus Eis
  subtitle: Entdecker der Welt - Titanen aus Eis
  description: 'Der Kanadier Will Glad ist ein erfahrener Eiskletterer. Sein neues Projekt ist jedoch gefährlich: der 141 Meter hohe gefrorene Wasserfall "Helmcken Falls". Überhänge und Kälte sind nur zwei der Gefahren, die auf Will bei jedem Meter, den er sich vorwärts zieht, warten. AT 2015'
