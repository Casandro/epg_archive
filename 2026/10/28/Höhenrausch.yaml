  title: Bergwelten - Auf der Jagd nach dem Augenblick
  subtitle: Bergwelten - Auf der Jagd nach dem Augenblick
  description: Dieser Film begleitet zwei junge Sudtiroler Naturfotografen bei ihren imposanten Abenteuern. Lukas und Daniel machen mit ihren Fotos und Filmen Perspektiven und Momente sichtbar, die den meisten Menschen verborgen bleiben. Den beiden ist kein Weg zu weit und kein Hang zu steil, wenn am Ende ein außergewöhnliches Foto wartet. Auf ihren Touren zu Gletscherhöhlen, Canyons oder einsamen Hochplateaus  entstehen einmalige Fotos und Filmaufnahmen der alpinen Tier- bzw. Bergwelt.  Ihr Antrieb ist die Neugier. Ihr Revier sind die Sudtiroler Berge. Lukas und Daniel sind die Jager des Dolomitenlichts. AT 2021
