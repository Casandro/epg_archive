  title: Into the Light
  subtitle: Into the Light
  description: Majlis al Jinn ist eine riesige Höhle im Oman und eine epische Herausforderung für die Kletterer Stefan Glowacz und Chris Sharma. Nach einem 170 m lang frei hängenden Abstieg klettern sie gemeinsam von der tiefsten Stelle der Höhle zurück ins Licht. Beim Aufstieg müssen sie nicht nur ihre ganze körperliche und geistige Kraft einsetzen, sondern auch gegen die Schwerkraft ankämpfen, da sie kopfüber vom Dach dieses riesigen Naturwunders hängen OM 2014
