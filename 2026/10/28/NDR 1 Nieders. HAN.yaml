  title: Visite
  subtitle: 'Das Gesundheitsmagazin: Herzwochen mit Prof. Bauernsachs und Melanie Thieltges'
  description: Vorhofflimmern betrifft Millionen Menschen - es ist die häufigste Herzrhythmusstörung. Trotzdem bleibt die Erkrankung oft lange unbemerkt. Vorhofflimmern kann unbehandelt das Risiko für Schlaganfälle, Herzschwäche und weitere Komplikationen deutlich erhöhen. Wie erkennt man Vorhofflimmern, welche Risikofaktoren spielen eine Rolle? In der "Visite" sprechen wir über die Diagnostik und wie die Herzrhythmusstörung wirkungsvoll behandelt werden kann. Der Kardiologe Prof. Johann Bauersachs von der Medizinischen Hochschule Hannover ist zu Gast und beantwortet Fragen von Hörern und Hörerinnen.
