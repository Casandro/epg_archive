- eventId: 698412
  start: 2026-10-28T00:41:00Z
  stop: 2026-10-28T01:31:00Z
  title: Spacetime
  subtitle: Astrobiologie - Suche nach Leben im All
  description: Sind wir wirklich allein im Universum oder gibt es Leben außerhalb der Erde? Diese Frage beschäftigt die Wissenschaft schon seit Menschengedenken. Astronomen identifizieren fortwährend Exoplaneten, die erdähnliche Bedingungen aufweisen. Doch wie sind auf der Erde überhaupt Lebewesen entstanden? Und wo könnte extraterrestrisches Leben zu finden sein? Wissenschaftler und Astronaut Ulrich Walter begibt sich auf die Suche nach unserem Ursprung und dem Leben im All.
  widescreen: true
- eventId: 698413
  start: 2026-10-28T01:31:00Z
  stop: 2026-10-28T02:14:00Z
  title: Spacetime
  subtitle: Stille Begleiter - Monde in unserem Planetensystem
  description: Die Erde hat einen, der Mars zwei, Jupiter und Saturn je mehr als 60 - zahlreiche Monde umkreisen die Planeten unseres Sonnensystems. Ihre vielfältigen Eigenschaften haben einen erheblichen Einfluss auf die Himmelskörper, die sie begleiten. Auch wir sind auf den Mond der Erde angewiesen. Er stabilisiert die Erdachse und sorgt so für feste Jahreszeiten. Monde von Saturn und Jupiter bergen unterirdische Ozeane und Meere aus Methan. Wissenschaftler Ulrich Walter erkundet die natürlichen Satelliten.
  widescreen: true
- eventId: 698414
  start: 2026-10-28T02:14:00Z
  stop: 2026-10-28T02:57:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Irland'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Irland'
  description: Eine der außergewöhnlichsten Sichtungen von UFOs durch Berufspiloten fand vor der Westküste Irlands im November 2018 statt. Aus dem Cockpit eines Flugzeugs der British Airways erblickten die Piloten in der Morgendämmerung einen hell rasenden Himmelskörper über dem Horizont. Ein weiterer Augenzeuge, ein norwegischer Pilot, beschrieb eine ähnliche Sichtung. Diese einzigartige UFO-Beobachtung durch erfahrenen Piloten gibt viele Rätsel auf.
  widescreen: true
- eventId: 698415
  start: 2026-10-28T02:57:00Z
  stop: 2026-10-28T03:40:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Pentagon'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Pentagon'
  description: 'Trotz zahlreicher Beweise und Aussagen von Augenzeugen über UFOs hielt sich das US-Militär jahrzehntelang bedeckt. Doch die Ereignisse während einer Navy-Übung am 14. November 2004 änderten diesen Kurs: Die Piloten zweier Super-Hornets erhielten plötzlich den ungewöhnlichen Befehl, eine unmittelbare Bedrohung aus der Luft vor der Küste San Diegos abzufangen. Sie fanden ein kleines Flugobjekt über den brechenden Wellen vor. Es war zwölf Meter lang, weiß, glatt und oval.'
  widescreen: true
- eventId: 698416
  start: 2026-10-28T03:40:00Z
  stop: 2026-10-28T04:10:00Z
  title: 'Strip the Cosmos: Leben auf dem Mars'
  subtitle: 'Strip the Cosmos: Leben auf dem Mars'
  description: 'Mehr als 40 Raumsonden sind inzwischen zum Mars geflogen, um unseren kosmischen Nachbarn besser kennenzulernen. In dieser Mission ist auch der neue NASA-Rover Perseverance seit dem 30. Juli 2020 unterwegs. Wissenschaftler erhoffen sich vom SUV-großen Roboterfahrzeug Hinweise, um die wohl brennendste Frage rund um den Mars zu beantworten: Gab es Leben auf dem erdähnlichen Planeten? Seine wüstenartige Beschaffenheit lässt daran zweifeln. Könnte der Mars dennoch von Menschen besiedelt werden?'
  widescreen: true
- eventId: 698417
  start: 2026-10-28T04:10:00Z
  stop: 2026-10-28T04:59:00Z
  title: 'Strip the Cosmos: Weiße Löcher'
  subtitle: 'Strip the Cosmos: Weiße Löcher'
  description: 'Nachdem die Existenz Schwarzer Löcher inzwischen nicht nur mathematisch, sondern auch mittels eines Fotos bewiesen werden konnte, rückt deren Gegenstück in den Fokus der Astronomie: Weiße Löcher. Ein Energiestrom, aus dem etwas austreten, nichts aber eindringen kann. Woraus bestehen Weiße Löcher? Wo und unter welchen Bedingungen treten sie auf? Die Dokumentation geht auf die Suche nach dem mysteriösen Himmelskörper und erklärt die Gemeinsamkeiten und Unterschiede Schwarzer und Weißer Löcher.'
  widescreen: true
