  title: Mega-Krane - Schwergewichte im Einsatz
  subtitle: Mega-Krane - Schwergewichte im Einsatz
  description: Bei Flensburg muss eine Eisenbahnbrücke über eine vierspurige Bundesstraße gelegt werden. Sie ist aus Stahl, 46 Meter lang, acht Meter breit, über drei Meter hoch und wiegt 267 Tonnen. Dafür werden zwei Mobilkrane benötigt. Sie sind über 100 Tonnen schwer und können bis zu 1.000 Tonnen heben. Doch diese extremen Gewichtheber müssen erst einmal selber aufgebaut werden, dazu bringen Schwertransporte die Einzelteile der Krane an die Baustellen. Die Reportage zeigt deren Aufbau und Einsatz.
