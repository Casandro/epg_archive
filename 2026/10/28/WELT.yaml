  title: Salami, Wiener & Co - Die Wurstmacher
  subtitle: Salami, Wiener & Co - Die Wurstmacher
  description: 'Mit einer Fleischproduktion von etwa acht Millionen Tonnen ist Deutschland der größte Fleischproduzent Europas und der drittgrößte der Welt. Im Durchschnitt verzehrt jeder Bundesbürger im Jahr rund 31 Kilogramm Fleischwaren. Schweinefleisch wird am häufigsten verarbeitet - und aus ihm besonders oft Wurst hergestellt. Allein die Brühwurst, also zum Beispiel die Lyoner Fleischwurst, macht ein Drittel des gesamten Fleischkonsums aus. Die beliebteste Wurst ist jedoch eine Rohwurst: die Salami.'
  widescreen: true
- eventId: 698482
  start: 2026-10-28T20:10:00Z
  stop: 2026-10-28T21:05:00Z
  title: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  subtitle: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  description: Der hohe Konsum von Naschzeug und Süßigkeiten in Deutschland hält die Produzenten auf Trab. In Viersen produziert der Konsumgigant Mars jeden Tag 10 Millionen Keks-Schoko-Riegel - und jeder davon muss absolut identisch aussehen und schmecken. In Erdmannhausen entstehen in der ersten Württembergischen Brezelfabrik Huober Snack-Brezeln. Und die Lübecker Marzipanmanufaktur Niederegger will mit traditionellen Produktionsverfahren das nach eigenen Angaben beste Marzipan der Welt produzieren.
  widescreen: true
- eventId: 748262
