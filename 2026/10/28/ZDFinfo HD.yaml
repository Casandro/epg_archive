  description: |-
    Deutschland 2024
    Welche Tiere sind die Spezialisten der Unterwasserwelt? Faszinierende Arten zeigen erstaunliche Anpassungen, kluge Jagdstrategien und komplexe Überlebenstechniken in Flüssen und Meeren.

    Die Welt der Wasserbewohner weist eine große Vielfalt auf: vom riesigen Walhai über hochintelligente Delfine bis zu besonderen Arten wie Eisvögeln und Wasserläufern. Dabei zeigen sich ungewöhnliche Sinnesleistungen, spektakuläre Sprungtechniken und enge Familienbande.
