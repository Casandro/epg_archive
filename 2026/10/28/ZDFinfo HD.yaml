  title: Tödliches Erbe der DDR - Deutsches Uran für Moskaus Bomben
  subtitle: Erz um jeden Preis
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentationsreihe, Deutschland 2026
    Kurz nach Kriegsende 1945 startet im Erzgebirge eines der größten Geheimprojekte der Nachkriegszeit: Unter dem Tarnnamen "Wismut" graben Arbeiter nach Uran für Stalins Atombombe.

    Sachsen und Thüringen sind im Kalten Krieg anfangs die wichtigsten Uran-Lieferanten Moskaus. Zehntausende schuften unter strenger Geheimhaltung und Lebensgefahr. Viele kommen ums Leben - durch Unfälle und die Langzeitfolgen radioaktiver Strahlung.
    HD-Produktion
- eventId: 767983
  start: 2026-10-28T00:55:00Z
  stop: 2026-10-28T01:40:00Z
  title: Tödliches Erbe der DDR - Deutsches Uran für Moskaus Bomben
  subtitle: Strahlende Gefahr
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentationsreihe, Deutschland 2026
    Bis 1990 liefert die DDR Uran für Moskaus Atombomben - mit drastischen Folgen für Mensch und Umwelt: Dörfer verschwinden, Landschaften werden radioaktiv verseucht, Bergleute erkranken.

    Die "Wismut" im Erzgebirge ist zeitweise der größte Uranbergbaubetrieb der Welt. Die Jagd nach dem radioaktiven Metall bezahlen viele Kumpel mit dem Leben. Die Sanierung der strahlenden Altlasten kostet bis heute Milliarden. Eine Mammutaufgabe für Generationen.
    HD-Produktion
- eventId: 767984
  start: 2026-10-28T01:40:00Z
  stop: 2026-10-28T02:25:00Z
  title: Die sieben geheimen Atompläne der DDR
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Nach dem Zweiten Weltkrieg liefern sich Ost und West einen Wettlauf um die Nukleartechnik. Welche geheimen Pläne verfolgt die DDR in der Atomforschung - und welche Folgen hat sie bis heute?

    30 Jahre nach dem Ende der DDR erzählt ZDFinfo die wahre Geschichte der Kernforschung im Osten. Es geht um Bomben und billigen Strom: In der DDR wird das erste deutsche Kernkraftwerk eröffnet. Und der ostdeutsche Staat liefert Uran für sowjetische Atomwaffen.
    HD-Produktion
- eventId: 772873
  start: 2026-10-28T02:25:00Z
