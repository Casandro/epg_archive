  title: Uran - Das unheimliche Element
  subtitle: Der Weg zur Bombe
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland / Frankreich 2015
    Uran wurde im 19. Jahrhundert als sogenannte Pechblende, einem Abfallprodukt des Silberbergbaus, entdeckt. 1896 fand der Physiker Antoine-Henri Becquerel heraus, dass Uran radioaktiv ist.

    Die "Erfolgsgeschichte" von Uran begann mit dem Färben von Glas und der Behandlung von Tumoren. Dass das Wundermaterial einmal Grundstoff für die gefährlichste Waffe der Welt werden würde, vermutete damals noch niemand.
    HD-Produktion
