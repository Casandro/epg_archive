  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Norwegen 2024
    Auf der Strecke von Bergen nach Oslo schlängelt sich die Bergensbanen durch die atemberaubende Landschaft Norwegens. Doch Schneefall, Geröll und wilde Tiere sind eine Herausforderung.

    Auf den knapp 500 Kilometern vom Westen Norwegens bis zur Hauptstadt im Osten können Fahrgäste weite Fjorde, dichte Wälder und schneebedeckte Berge bewundern. Erstes Highlight ist die Hochebene Hardangervidda, wo die Temperaturen oft zweistellige Minusgrade erreichen.
    HD-Produktion
