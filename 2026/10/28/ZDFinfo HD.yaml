  description: |-
    Deutschland 2024
    Tiereltern geben alles für ihren Nachwuchs. Von der Brutpflege bis zur Aufzucht: Für die besten Überlebenschancen ihrer Jungen entwickeln Wildtiere erstaunliche Formen der Fürsorge.

    Ob Orang-Utan, Seepferdchen oder Elefant: Manche Arten schützen, erziehen und versorgen ihre Tierbabys über Jahre hinweg, andere setzen auf Mut, Teamarbeit oder raffinierte Tarnung. Der Film zeigt, welche Tiereltern besonders fürsorglich sind.
