  title: Das Atomzeitalter - Höllenfeuer und Hoffnung
  subtitle: Von Hiroshima bis zur Kuba-Krise
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Die Entdeckung der Kernspaltung führt in ein neues Zeitalter. Die Frage ist: Wie wird die Menschheit dieses neue Energiepotenzial für sich nutzen?

    In Hiroshima wird die Welt zum ersten Mal Zeuge des gewaltigen Zerstörungspotenzials der Atombombe. Die Kernwaffe wird zum Spielball politischer Machtkämpfe und die Atomkraft gleichzeitig zum Hoffnungsträger für eine sichere und bezahlbare Energieversorgung.
    HD-Produktion
- eventId: 772874
  start: 2026-10-28T03:10:00Z
  stop: 2026-10-28T03:55:00Z
  title: Das Atomzeitalter - Höllenfeuer und Hoffnung
  subtitle: Vom Wettrüsten bis Tschernobyl
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Die Kubakrise bringt die Welt an den Rand eines Atomkrieges. Den Mächtigen wird klar, dass die Existenz der menschlichen Zivilisation auf dem Spiel steht.

    Die folgende Zeit prägen bahnbrechende wissenschaftliche Entdeckungen, geopolitische Spannungen und tragische Katastrophen. Eine Zeit, in der die zivile und militärische Nutzung der Atomkraft gesellschaftliche und politische Debatten nachhaltig beeinflusst.
    HD-Produktion
- eventId: 772875
  start: 2026-10-28T03:55:00Z
  stop: 2026-10-28T04:40:00Z
  title: Das Atomzeitalter - Höllenfeuer und Hoffnung
  subtitle: Vom Abrüsten bis zur Endlagersuche
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Mit der Wiedervereinigung Deutschlands scheint eine Zeitenwende möglich. Zerbricht mit der bipolaren Weltordnung auch die Notwendigkeit von Atomwaffen?

    Eine Hoffnung, die sich als Illusion erweist. Immer mehr Atommächte betreten die Weltbühne und sorgen für eine neue Bedrohungslage. Die zivile Nutzung der Kerntechnik wird ab jetzt durch den Unfall von Tschernobyl geprägt, die Sensibilität für mögliche Risiken wächst.
    HD-Produktion
- eventId: 774656
  start: 2026-10-28T04:40:00Z
  stop: 2026-10-28T06:05:00Z
  title: Fukushima - Chronik einer Katastrophe
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Japan 2025
    11. März 2011: Japan wird vom stärksten jemals dort gemessenen Erdbeben heimgesucht. Ein gewaltiger Tsunami folgt und durchbricht die Schutzmauern des Atomkraftwerks Fukushima.

    Die dadurch ausgelöste Atomkatastrophe drohte weitaus schlimmer zu werden als Tschernobyl. Die Existenz Japans als Nation war bedroht. Der Dokumentarfilm "Fukushima" zeigt minutiös, fesselnd und schonungslos die Chronik dieser beispiellosen Katastrophe.
    HD-Produktion
- eventId: 776782
  start: 2026-10-28T06:05:00Z
  stop: 2026-10-28T06:25:00Z
  title: Wer ist die Familie Murdoch?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Rupert Murdoch, Medienmogul und mächtigster Meinungsmacher der Welt. Mit 92 tritt er von der Spitze seines Imperiums zurück. Was bedeutet das für seine Nachfolge?

    Nach einer von Skandalen geprägten Karriere übergibt Rupert Murdoch die Geschäfte an seinen Sohn Lachlan. Der soll in Zukunft die Kontrolle über einflussreiche Medien wie Fox News und die Zeitung "The Sun" übernehmen.
    HD-Produktion
