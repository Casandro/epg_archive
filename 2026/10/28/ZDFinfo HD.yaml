  description: |-
    Deutschland 2024
    Wenn schlau sein über Leben und Tod entscheidet: Tiere zeigen, wie Intelligenz, Gebrauch von Werkzeugen und raffinierte Strategien helfen, in extremen Lebensräumen erfolgreich zu bestehen.

    Bartgeier zertrümmern Knochen, und Primaten lösen komplexe Aufgaben. So zeigt sich Tierintelligenz in Aktion: Eigenschaften wie Lernen, Kommunikation und Gedächtnisleistung sichern das Überleben - und offenbaren Parallelen zum Menschen.
