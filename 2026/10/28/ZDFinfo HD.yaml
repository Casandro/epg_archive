    Die Meister der Verkleidung: Im Tierreich entscheiden perfekte Täuschung, lautlose Jagd und Anpassung über Leben und Tod. Wer sind die wahren Experten in der Kunst der Tarnung?

    Von Gottesanbeterin bis Wiesel, von sibirischem Tiger bis Bartkauz: Sie alle zeigen unterschiedliche Tarnstrategien. Der Bartkauz jagt mit lautlosen Flügeln, das Wiesel wechselt im Winter das Fell. Solche Fähigkeiten sichern das Überleben im harten Existenzkampf.
