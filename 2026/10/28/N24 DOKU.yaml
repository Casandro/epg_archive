  title: Bundespolizeidirektion Berlin - Einsatz Tag und Nacht
  subtitle: Bundespolizeidirektion Berlin - Einsatz Tag und Nacht
  description: Im Kampf gegen Kriminelle und Gewalttäter setzen die 3750 Beschäftigten der Bundespolizei Berlin täglich ihr Leben aufs Spiel. Ihr Einsatzgebiet ist die Hauptstadt und das umliegende Brandenburg samt dem deutsch-polnischen Grenzgebiet. Die Reportage begleitet neun Bundespolizisten bei ihren Einsätzen und gibt tiefe Einblicke in den Arbeitsalltag an deutschen Grenzen und Bahnhöfen.
  widescreen: true
- eventId: 702885
  start: 2026-10-28T13:59:00Z
  stop: 2026-10-28T14:52:00Z
  title: Die Bundespolizei - Im Einsatz für Deutschland
  subtitle: Die Bundespolizei - Im Einsatz für Deutschland
  description: Wir sind Sicherheit - das ist der Leitspruch, an dem sich rund 38.000 Bundespolizistinnen und Bundespolizisten messen lassen wollen. Die dreiteilige Reportageserie beleuchtet unterschiedliche Aufgabenbereiche und Einsatzgebiete der Bundespolizei, zum Beispiel den Grenz- und Küstenschutz mit dem Einsatzschiff BP82 Bamberg, den Einsatz von Spezialkräften der BFEplus sowie die Aufgaben und Fähigkeiten der Bundesbereitschaftspolizei und der Bundespolizeidirektion Flughafen Frankfurt am Main.
  widescreen: true
- eventId: 702886
  start: 2026-10-28T14:52:00Z
  stop: 2026-10-28T15:45:00Z
  title: Der Zoll - Auf Schmugglerjagd (2)
  subtitle: Der Zoll - Auf Schmugglerjagd (2)
  description: 'Das dunkle Geschäft der Waffenschieber und Drogendealer an den deutschen Grenzen wächst bedrohlich. Seit 2012 führt der Deutsche Zoll in den Brennpunkten daher Autobahnkontrollen mithilfe sogenannter Vollmobilen Röntgenanlagen durch: Dabei durchleuchtet ein mit einem Röntgenarm aufgerüsteter LKW verdächtige Fahrzeuge zentimetergenau. Der Vorteil: Die Beamten können aus sicherer Entfernung Schmuggler und Dealer schneller entlarven und hochnehmen.'
  widescreen: true
- eventId: 702903
  start: 2026-10-28T15:45:00Z
  stop: 2026-10-28T16:39:00Z
  title: Der Wasserzoll - Kontrolleinheit See im Einsatz
  subtitle: Der Wasserzoll - Kontrolleinheit See im Einsatz
  description: 'Sie retten Leben auf hoher See und machen Schmugglern den Garaus: die Beamten des Deutschen Wasserzolls. Die Reporter haben die Zöllner bei der Arbeit an Bord ihres größten Einsatzschiffs, der Borkum, begleitet. Jeden Tag setzt die 14-köpfige Besatzung ihr Leben aufs Spiel, um Verunglückte zu retten, Schiffsbrände zu löschen oder gegen Piraterie und Schmuggel anzukämpfen.'
  widescreen: true
- eventId: 702904
  start: 2026-10-28T16:39:00Z
  stop: 2026-10-28T17:28:00Z
  title: 'Gefängnisse: Maafushi Prison, Malediven'
  subtitle: 'Gefängnisse: Maafushi Prison, Malediven'
  description: Türkisblaues Meer und weiße Sandstrände locken jedes Jahr mehr als zwei Millionen Besucher aus aller Welt auf die Malediven. Auf der Hauptinsel Male ist vom Paradies jedoch nichts zu spüren. Neben chronischem Platzmangel sind Drogen dort das größte Problem. Wen die Polizei erwischt, der landet hier - auf der Insel Maafushi. Dort befindet sich ein Hochsicherheitsgefängnis auf einer Fläche von zehn Fußballfeldern, umgeben von sechs Meter hohen Mauern - mitten im Urlaubsparadies.
  widescreen: true
- eventId: 702905
  start: 2026-10-28T17:28:00Z
  stop: 2026-10-28T18:15:00Z
  title: Airport Security USA - Folge 11
  subtitle: Airport Security USA - Folge 11
  description: 'In Newark geraten Beamte bei einer Frachtkontrolle an brisante Funde: Drogen, gefälschte Handtaschen, Medikamente. In Honolulu verweigert ein Passagier jedes Wort. Doch sein Handy deutet klar auf Drogenkonsum hin. San Francisco wird zum Schauplatz einer riskanten Festnahme - ein Gesuchter wird direkt nach der Landung gestellt. Der Mann beteuert lautstark seine Unschuld. Drei Flughäfen, drei Fälle voller Spannung - und die Frage: Haben die Beamten wirklich den Richtigen?'
  widescreen: true
- eventId: 702925
  start: 2026-10-28T18:15:00Z
  stop: 2026-10-28T19:15:00Z
  title: Airport Security USA - Folge 12
  subtitle: Airport Security USA - Folge 12
  description: Trotz striktem Kontaktverbot möchte ein Mann zu seiner Frau ins Flugzeug steigen - die Beamten müssen sofort handeln. In Atlanta entdecken Fahnder in Videospiel-Verpackungen dreiste Fälschungen. Und in San Francisco glaubt eine Passagierin, Luxusgüter im Wert von 200.000 Dollar einfach "vergessen" zu können. Sekunden entscheiden, ob Recht und Ordnung triumphieren. Drei Flughäfen, drei heikle Fälle - ein Tag voller Einsätze am Limit.
  widescreen: true
- eventId: 702926
  start: 2026-10-28T19:15:00Z
  stop: 2026-10-28T20:10:00Z
  title: Maestro del Gelato - Die Geheimnisse der Eismacher
  subtitle: Maestro del Gelato - Die Geheimnisse der Eismacher
  description: Speiseeis oder Eiscreme, Softeis oder Frozen Yogurt? Was steckt drin in der kühlen Köstlichkeit und welche Sorten schmecken uns am besten? Gerade in den Sommermonaten floriert das Geschäft. Acht Liter Eis schleckt jeder Deutsche im Schnitt pro Jahr. Die Reportage wirft einen Blick hinter die Kulissen der Eismanufakturen Deutschlands und Berlins und zeigt, wie der enorme Bedarf am erfrischenden Sommerhit bundesweit gestillt wird.
  widescreen: true
- eventId: 702927
  start: 2026-10-28T20:10:00Z
  stop: 2026-10-28T21:05:00Z
  title: Salami, Wiener & Co - Die Wurstmacher
  subtitle: Salami, Wiener & Co - Die Wurstmacher
  description: 'Mit einer Fleischproduktion von etwa acht Millionen Tonnen ist Deutschland der größte Fleischproduzent Europas und der drittgrößte der Welt. Im Durchschnitt verzehrt jeder Bundesbürger im Jahr rund 31 Kilogramm Fleischwaren. Schweinefleisch wird am häufigsten verarbeitet - und aus ihm besonders oft Wurst hergestellt. Allein die Brühwurst, also zum Beispiel die Lyoner Fleischwurst, macht ein Drittel des gesamten Fleischkonsums aus. Die beliebteste Wurst ist jedoch eine Rohwurst: die Salami.'
  widescreen: true
- eventId: 702941
  start: 2026-10-28T21:05:00Z
  stop: 2026-10-28T22:05:00Z
  title: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  subtitle: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  description: Der hohe Konsum von Naschzeug und Süßigkeiten in Deutschland hält die Produzenten auf Trab. In Viersen produziert der Konsumgigant Mars jeden Tag 10 Millionen Keks-Schoko-Riegel - und jeder davon muss absolut identisch aussehen und schmecken. In Erdmannhausen entstehen in der ersten Württembergischen Brezelfabrik Huober Snack-Brezeln. Und die Lübecker Marzipanmanufaktur Niederegger will mit traditionellen Produktionsverfahren das nach eigenen Angaben beste Marzipan der Welt produzieren.
  widescreen: true
- eventId: 702942
  start: 2026-10-28T22:05:00Z
  stop: 2026-10-28T23:05:00Z
  title: Riesenbaustelle Fehmarnbelt - Europas Mega-Tunnel entsteht (2)
  subtitle: Riesenbaustelle Fehmarnbelt - Europas Mega-Tunnel entsteht (2)
  description: 'Im zweiten Teil der Reportage rückt der Fehmarnbelt-Tunnel seinem wichtigsten Meilenstein näher: Das erste Tunnelelement steht vor dem millimetergenauen Absenken in die Ostsee. Die Doku begleitet Ingenieure, Bauleiter und Spezialschiffe beim Bau des längsten Absenktunnels der Welt. Zwischen Deutschland und Dänemark entstehen Tunnelportale, riesige Produktionsanlagen und eine neue Verkehrsverbindung für Europa.'
  widescreen: true
- eventId: 702943
  start: 2026-10-28T23:05:00Z
  stop: 2026-10-29T00:00:00Z
  title: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  subtitle: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  description: Am 23. März 2021 bohrt sich eines der größten Containerschiffe der Welt ins sandige Ufer des Suezkanals. Fast eine Woche lang blockiert die Ever Given die vielbefahrene Handelsroute in Ägypten. Nie zuvor ist ein Frachter dieser Größe so auf Grund gelaufen, dass es zu einer vergleichbaren, globalen Lieferkrise gekommen gekommen wäre. War es eine Verkettung unglücklicher Umstände? Oder zeigt der Megastau auf See einen gefährlichen Schwachpunkt in der weltweiten Versorgungskette auf?
  widescreen: true
