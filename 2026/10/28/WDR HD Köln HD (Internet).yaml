  title: Durch die Wildnis - Das Abenteuer Deines Lebens (14/20)
  subtitle: Nordgriechenland
  description: Das Wandern in den Bergen Nordgriechenlands macht den sechs Abenteurern unheimlich viel Spaß. Die Landschaft ist wunderschön, und Die eindrucksvolle Vikosschlucht produziert tolle Echos. In den Felsen zu navigieren ist nicht so einfach, und so stellt sie Tobis Aufgabe, sich im Steinlabyrinth zu orientieren, vor eine große Herausforderung.
- eventId: 777095
  start: 2026-10-28T07:20:00Z
  stop: 2026-10-28T07:45:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (15/20)
  subtitle: Nordgriechenland
  description: Wandern ist super, aber noch besser ist Reiten. Heute soll die Gruppe ihre Etappe auf dem Rücken von Wildpferden zurücklegen. Das ist nicht so einfach, wie es klingt. Wildpferde sind sehr schreckhaft, und um sie nicht in Panik zu versetzen, müssen sich die Reiter ganz ruhig verhalten. Da Felix eine Allergie hat, geht er in Begleitung von Melli zu Fuß zum nächsten Camp. In der Steinwüste ist die Navigation extrem schwierig, und die beiden verirren sich heillos.
