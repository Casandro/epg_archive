  description: 'Die Mädels sind heute Morgen richtig gut drauf und malen den Jungs vor dem Aufwachen Bärte mit Kajal. Die Rache lässt natürlich nicht lange auf sich warten. Heute wandern Die sechs endlich ans Meer. Alle freuen sich sehr, und Die Aufregung steigert sich noch, als Tobi Die heutige Herausforderung verrät: Beim Tauchen in der Bucht müssen Schätze gehoben werden.'
