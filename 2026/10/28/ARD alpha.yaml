  title: Tierisch teuer - Was hinter den hohen Tierarztkosten steckt
  description: 'Seit der Novellierung der Gebührenordnung für Tierärzt:innen 2022 haben Praxen und Kliniken deutlich größere Spielräume bei der Abrechnung. Ein lukrativer Markt: große Klinikverbünde, häufig finanziert von internationalen Investoren, expandieren in Deutschland. Insider:innen berichten von wachsendem Druck, die Umsätze zu steigern - durch mehr Diagnostik oder Behandlungen. Nicht alle Tierärzt:innen gehen diesen Weg. Einige rechnen bewusst zurückhaltend ab. Gleichzeitig formiert sich Widerstand. Ein Film über ein System unter Druck - und die Frage, wie bezahlbar Tierliebe künftig noch ist.'
