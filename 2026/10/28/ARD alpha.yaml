  title: 'alpha-thema Gespräch: Von Tieren und Menschen'
  description: "Haustiere gehören für viele ganz selbstverständlich zur Familie. Doch was tun, wenn aus dem süßen Welpen ein Problemhund wird? Oder das Haustier krank gezüchtet wurde? Darüber spricht Andrea Lauterbach mit ihren Gästen.\nDr. Astrid Schubert ist Tierärztin mit Schwerpunkt Verhaltenstherapie. \nWie es weiter geht, wenn Tier und Halter einfach nichtmehr miteinander auskommen können, darüber weiß die Leiterin der Münchner Tierheims, Dr. Eva-Maria Natzer nur allzu gut Bescheid. Die beiden Expertinnen geben wertvolle Tipps, wie man das richtige Haustier für sich finden kann, um lange harmonisch zusammenzuleben."
