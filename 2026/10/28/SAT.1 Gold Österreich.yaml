  title: Serienkiller - Mörder und ihre Markenzeichen
  subtitle: |-
    Der Englewood Killer
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
  description: 'In Englewood, einem Stadtteil von Chicago, werden von 1993 bis 1999 sechs ermordete Frauen gefunden. Die Ähnlichkeiten der Verbrechen sind unübersehbar: Die Köpfe der Opfer sind mit einem Tuch bedeckt und ihre Schuhe fehlen. Es gibt lange Zeit keine Hinweise oder Zeugen, und die Morde bleiben jahrelang unaufgeklärt. Doch dann schlägt der Täter erneut zu, aber dieses Mal überlebt die Frau den Angriff schwer verletzt und kann der Polizei wichtige Hinweise geben ...'
  widescreen: true
