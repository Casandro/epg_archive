    Dokumentation, USA 2022
    Altersfreigabe: ab 12
    (WH vom Dienstag, 27.10.2026, 20:15 Uhr)
  description: Im Winter 1984 wird mitten in einem verschlossenen Fast-Food-Restaurant die Leiche der 25-jährigen Mitarbeiterin Terri Brooks entdeckt. Offenbar verschaffte sich der Täter über das Drive-thru-Fenster Zugang und griff die junge Frau brutal an. Zunächst deutet vieles auf ein Raubmotiv hin, doch steckt hinter dem Verbrechen noch mehr? Der Fall bleibt 14 Jahre lang ungelöst, bis moderne DNA-Analysen die Ermittler schließlich auf die Spur eines Verdächtigen bringen.
  widescreen: true
