  title: Die Kirche bleibt im Dorf (16/30)
  subtitle: O Tannenbaum
  description: Eine große Tanne hat Gottfried und seinen Freund Lothar unter sich begraben. Hilflos, unbeweglich und frierend warten die beiden auf Hilfe. Doch Kai-Uwe ist der einzige, der sie im Wald vermuten könnte und der backt Plätzchen mit Christine und kriegt noch nicht einmal mit, dass Oma Anni den kleinen Thaddäus entführt. Mit Kai-Uwes Ruhe ist es vorbei, als er von Gottfrieds Verschwinden erfährt. Er knattert mit seinem Roller durch den Wald und entdeckt tatsächlich Gottfried und Lothar unter der Tanne.
  ageRating: 12
  genre:
