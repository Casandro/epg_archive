  title: Christoph Sonntag live
  subtitle: Deutschland, ich hab' dich lieb
  description: 'Ob am Stammtisch oder auf der Straße - Kabarettist Christoph Sonntag hört überall das Gleiche: Immer mehr Deutsche wollen auswandern. Doch warum? Und vor allem: wohin? Der Kabarettist kann das alles nicht verstehen. Er liebt Deutschland von ganzem Herzen und hat dafür auch jede Menge gute Gründe: die Sprache, die klugen Köpfe und vor allem seine heißgeliebte Heimatstadt Stuttgart.'
