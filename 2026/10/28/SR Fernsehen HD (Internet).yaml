  title: Wir im Saarland - Kultur extra
  subtitle: Im Gleichschritt - Gold? - Ein Saarländer will Weltmeister werden
  description: |-
    Steve Mantzer aus Rilchingen-Hanweiler spielt Sousaphon - ein seltenes, riesiges Blasinstrument, das in Marching Bands die Basslinie übernimmt. Seit 4 Jahren ist er festes Mitglied der Maastrichtse Verkennersband. Er pendelt regelmäßig rund 250 km zu den Proben in Maastricht.
    Alle 4 Jahre steht ein besonderes Event an: der World Music Contest, so etwas wie die Weltmeisterschaft der Marchingbands.
    Der Film begleitet Steve auf dem Weg - vom Einzeltraining auf einem kleinen Platz in Hanweiler, über den vereinseigenen Probenplatz in Maastricht bis ins Stadion von Roda Kerkrade: Wird ein Saarländer in den Niederlanden zum Weltmeister?
