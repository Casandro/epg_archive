  title: Teslin narod
  subtitle: Dokumentarni serijal Teslin narod donosi priče o čuvenoj Mim Bizič, o jednom od vodećih srpskih lidera Aleksu Mačeskom, o velikim dobrotvorima Branku Tupanjcu, Milici Govedarici i dr Nenadu.
  description: Kroz priče istaknutih Srba pored Nikole Tesle i Mihajla Pupina, upoznaćete i trostrukog dobitnika Pulicerove nagrade Volta Bogdanića, Gordanu Vunjak Novaković, jedinu ženu člana Njujorške Akademije nauka, srpske inženjere tvorce Apolo programa, legendarne Oskarovce Karla Maldena, Stiva Tešića, Pitera Bogdanovića i mnoge druge čije je ime utkano u istoriju. U filmu se može čuti priča o prvom Srbinu u Americi Džordžu Fišeru (Đorđu Šagiću) koga su spasili ribari po kojima je nazvan, a čije ime se nalazi u Livingstonovoj knjizi "100 znamenitih Amerikanaca", ali i zanimljivosti poput one da je čuvena Dži Aj Džo igračka napravljena po uzoru na jednog srpskog heroja Mihajla Pejića. Teslin narod rađen je u produkciji Optimistic filma i RTS-a, na inicijativu Tesla Science Foundation iz Filadelfije, a serijal su podržali Ministarstvo kulture i informisanja Republike Srbije, Ambasada SAD u Beogradu i Savet za kreativne industrije predsednice Vlade Ane Brnabić. U serijalu se pojavljuje preko 70...
