  subtitle: Das NIEDERBAYERN TV Passau Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit einer t..
  description: |-
    Abriss beschlossen - Passauer Stadtrat entscheidet über Zukunft der Hängebrücke
    Der Passauer Stadtrat hat am Montagabend mit deutlicher Mehrheit den Neubau der Hängebrücke beschlossen. Bereits in den vergangenen Wochen wurde dies in den Ergebnissen einer Machbarkeitsstudie zum Seiltausch empfohlen. Eine Sanierung wäre demnach fast so teuer wie ein Neubau und würde keine Förderung erhalten.

    Ein halbes Jahrhundert - Passauer Fußgängerzone feiert Geburtstag
    Jubiläen sind besondere Meilensteine. Sie erinnern an wichtige Ereignisse, lassen auf gemeinsame Erlebnisse zurückblicken und bieten Anlass, das Erreichte zu würdigen. Oft stecken dahinter viele Jahre Arbeit, persönlicher Einsatz oder eine lange gemeinsame Geschichte. Doch nicht jedes Jubiläum ist gleich: Was gefeiert wird, wie gefeiert wird und welche Bedeutung dahintersteckt, kann ganz unterschiedlich sein. In Passau feiert heuer etwa ein ganzer Straßenzug Geburtstag, der aus der Dreiflüssestadt nicht mehr wegzudenken ist.

    LEGO und Co. am Haslinger Hof - Klemmlinge Passau laden zur Klemmbaustein-Tauschbörse
    Ein einzelner Stein, tausende Möglichkeiten - und manchmal steckt in einem kleinen Bauteil mehr, als man auf den ersten Blick vermuten würde. Im Haslinger Hof sind am Wochenende Menschen zusammengekommen, die genau dafür einen Blick haben. Hier wurde gesucht, gefachsimpelt und getauscht. Was die Klemmbaustein-Sammler antreibt und was es dort alles zu entdecken gab - wir haben uns umgesehen.
