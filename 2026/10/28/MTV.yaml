  description: 'Ink Master, la série originale de Spike TV, est de retour pour la saison 9, et les enjeux sont plus grands que jamais avec une récompense deux fois plus élevée qu''avant. Cette saison, des studios du pays entier envoient deux de leurs tatoueurs les plus talentueux pour remporter 200 000 dollars de récompense, un article dans un magazine de tatouage et, pour la première fois dans l''histoire d''Ink Master, le titre de meilleur tatoueur. Réalisateur: Paul Starkman. Des acteurs: Thom Bulman (lui-même), Dave Navarro (lui-même), Chris Nunez (lui-même), Oliver Peck (lui-même), Dj Tambe (lui-même) (2017)'
