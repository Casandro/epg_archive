  description: 'Ink Master met en scène une compétition de tatoueurs professionnels américains, jugés à travers différents défis artistiques. Ink Master est la première émission à faire de l''art du tatouage une compétition ! Le principe est simple : dix candidats s''affrontent à travers des épreuves afin de décrocher le prestigieux titre de "meilleur tatoueur" et la récompense de 100.000$. Pendant huit semaines, les candidats vont devoir faire leurs preuves et relever une série de défis tous plus compliqués les uns que les autres. Leurs oeuvres seront ensuite jugées par un jury impitoyable. (2016)'
