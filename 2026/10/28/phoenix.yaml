  title: 'Kritisch Reisen: Jakobsweg - Ich bin dann mal anstehen'
  widescreen: true
  hd: true
  description: |-
    Er gehört zu den bedeutendsten Pilgerwegen der Welt. Und die ganze Welt ist auf ihm unterwegs: der Jakobsweg. Seitdem Hape Kerkeling mal weg war, hat sich der Strom der Pilger verfünffacht, zur Hauptsaison kommen an Spitzentagen 5000 Pilger am Grab des heiligen Jakobus in Santiago de Compostela an. Viele Anwohner ärgern sich über grölende Gruppen, stinkende Funktionskleidung, die in der Altstadt zum Trocknen ausgebreitet wird oder Badende im Barockbrunnen.
    Das bringt etliche Einwohner Santiago de Compostelas auf die Palme. Ein Protestmarsch zieht um die Altstadt, die zum UNESCO-Weltkulturerbe gehört.
  subtitle: Eine WDR Story von Ulf Eberle
