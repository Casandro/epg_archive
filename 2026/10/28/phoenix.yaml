  title: Die Wahrheit über Google
  subtitle: u.a. Aktuelles
  widescreen: true
  hd: true
  description: 'Vor rund 25 Jahren startete Google als eine der ersten Suchmaschinen im Internet. Wer heute im Internet etwas sucht, googelt. Viele Dienste des Internet-Giganten erleichtern unseren Alltag: der Browser Chrome, Navigieren mit Maps, Mails schreiben mit Gmail, Cloudspeicher oder eben die Internetsuche, mit der alles angefangen hat. Google macht es uns einfach, liefert hilfreiche Informationen und vor allem kostenlos. Doch wie gut sind die Services wirklich? Liefert uns die Google-Welt tatsächlich die besten Ergebnisse oder sind die Ergebnisse am besten für Google? Und welchen Preis zahlen wir dafür?'
