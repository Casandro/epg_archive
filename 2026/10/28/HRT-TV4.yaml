  subtitle: Kako stručnjaci komentiraju sve veću potrošnju hrvatskih građana na putovanja? Kakva se ulaganja planiraju u ACI-jeve marine?
  description: Kako stručnjaci komentiraju sve veću potrošnju hrvatskih građana na putovanja? Kakva se ulaganja planiraju u ACI-jeve marine? Što novi putnički terminal u splitskoj trajektnoj luci donosi tamošnjem turizmu? U emisiji provjeravamo i što se posjetiteljima ove jeseni nudi na Brijunima, a što u NP Krka...
