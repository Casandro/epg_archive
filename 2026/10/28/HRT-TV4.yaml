  title: Otvoreno
  subtitle: ' '
  description: 'Ispisuje li se nakon izbora u Srbiji nova sigurnosna arhitektura Balkana ili nikakve bitne razlike neće biti u usporedbi s Vučićevom erom? Hoće li se Srbija okrenuti prema Europskoj uniji ili će ostati u ruskoj sferi utjecaja? Hoće li dostaviti dokumente o sudbini i grobnicama nestalih u Domovinskom ratu? Što će biti s ratnom odštetom? Stranački prvaci u studiju Otvorenog večeras analiziraju kakvi su budući odnosi Hrvatske i Srbije. Gosti su: Sandra Benčić, predsjednica Kluba zastupnika stranke Možemo!, Stipo Mlinarić, zamjenik predsjednika Domovinskog pokreta, Marin Piletić, saborski zastupnik HDZ-a, Arsen Bauk, potpredsjednik Kluba zastupnika SDP-a.'
