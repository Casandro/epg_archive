  title: Temps présent
  description: 'Là-haut sur la montagne, nos cabanes disparaissent Les Alpes se transforment à une vitesse vertigineuse. Glaciers en déroute, éboulements quotidiens, permafrost qui dégèle : les 152 cabanes du Club Alpin Suisse sont en première ligne. Faut-il les déplacer, les abandonner ou les réinventer ? De la cabane du Mutthorn, menacée d''effondrement, à la mythique Konkordia et son escalier sans fin, Temps Présent plonge au c_ur d''un patrimoine alpin en péril. Entre nostalgie et urgence climatique, un témoignage saisissant sur ce que nous sommes en train de perdre - et ce qu''il nous reste à sauver. (Suisse Romande-2026)'
  genre:
  - '128'
  widescreen: true
  subtitled: true
