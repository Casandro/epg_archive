  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Poradna pro zdraví: fyzioterapeut a trenér David Vostrejž o posilování. Proč a jak začít posilovat v jakémkoli věku? Pokud jsme zvyklí na pravidelnou fyzickou zátěž dlouhodobě, může nám to výrazně pomoci v pozdějším věku zvládnout proces stárnutí. A pokud jsme byli celý život spíše kavárenští povaleči, ani tehdy není vše ztraceno. S fyzioterapeutem a trenérem Davidem Vostrejžem probereme základy správného tréninku a vyvrátíme některé mýty ohledně věku a pohybu. Moderuje Jannis Moras.'
