  title: Alpha & Omega
  subtitle: 'Jana Spegel: von der Schul-AG zu den Paralympics'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als Kind wächst Jana Spegel ohne körperliche Einschränkungen auf und treibt gern Sport. Doch aufgrund einer Muskelerkrankung ist sie seit dem 18. Lebensjahr auf einen Rollstuhl angewiesen. Davon lässt sie sich nicht unterkriegen. In kürzester Zeit kämpft sie sich von einer Schul-AG in die Weltspitze des Para-Tischtennis. 2024 nimmt sie bei den Paralympischen Sommerspielen in Paris teil, mittlerweile ist sie mehrfache Deutsche Meisterin. Was half ihr, mit der Diagnose umzugehen? Mit welchen Herausforderungen kämpft sie als Leistungssportlerin? Und welche Medaille würde sie gerne noch gewinnen? Darüber spricht Jana Spegel mit Moderatorin Juliane Eberwein.'
