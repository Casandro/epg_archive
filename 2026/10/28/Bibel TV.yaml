  title: Ein Hauch von Himmel
  subtitle: Die Macht der Karten
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Engel sind Boten Gottes, die in seinem Auftrag auf der Erde wandeln. Meist verkünden sie die Botschaft, dass Gott existiert und die Menschen liebt. Doch manchmal ist die Botschaft eine andere: Der Teufel existiert auch und er läuft umher wie ein brüllender Löwe, auf der Suche danach, wen er verschlingen kann. Das ist die Botschaft, die Monica und Andrew mithilfe von Tess dem jungen Paar Annie und Rick überbringen müssen. Die Engel müssen wachsam sein, denn der Teufel kann sich in allem und jedem verstecken - auch in Tarotkarten, durch die er seine Lügen verbreiten kann. Zu Halloween beginnt Annie, sich mit genau diesen Tarotkarten auseinanderzusetzen. Die Zukunft, die sie Rick und ihren zwei Kundinnen im Friseursalon auslegt, scheint sich in mehreren Fällen zu bewahrheiten. Doch Monica und Andrew sind souverän dabei, den ängstlichen Menschen zu zeigen, dass die Karten keine Wahrheit enthalten, sondern böse Lügen des Feindes.'
