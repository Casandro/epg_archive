  title: Planet Weltweit - Bird Island - Allein unter Pinguinen
  subtitle: Planet Weltweit - Bird Island - Allein unter Pinguinen
  description: 'Kaum ein Ort ist dichter besiedelt als Bird Island - zumindest was Pinguine, Seevögel und Robben betrifft. Menschen dürfen dieses subantarktische Tierreich nur wenige betreten. Und wenn, dann müssen sie viel Zeit mitbringen: Eineinhalb Jahre verbringen sie in der kleinsten Forschungsstation des British Antarctic Survey, 1400 Kilometer vom nächsten Hafen entfernt. Acht junge Briten leben als Einsiedler auf Bird Island: eineinhalb Jahre ohne schnelles Internet, ohne Arzt oder Bäcker, ganz auf sich gestellt. Nur zweimal jährlich kommt ein Versorgungsschiff vorbei. Als erstes deutsches Filmteam durfte diese Reportage ihren Alltag begleiten: auf einer nur vier Quadratkilometer kleinen Vogelinsel vor der Küste Südgeorgiens - einem der stürmischsten und tierreichsten Plätze der Erde. Bird Islands Natur ist tatsächlich noch unberührt. Hunderttausende Pinguine und Albatrosse nisten auf dem subantarktischen Eiland, unbeeindruckt von den neugierigen Blicken der - wenigen - Menschen. Für die acht Frauen und Männer, die hier für den British Antarctic Survey forschen, geht ein Lebenstraum in Erfüllung: Es gibt kaum einen besseren Ort auf der Erde, um Seevögel zu beobachten. Dafür nehmen sie Arbeit bei Schnee und Sturm in Kauf, und monatelange Isolation. Selbst ihre Kollegen auf der 1000mal größeren Nachbarinsel Südgeorgien bleiben für sie unerreichbar. Nur 500 Meter Südpolarmeer trennen beide Inseln. Doch für Vögel und Menschen liegen Welten dazwischen. Robben- und Walfänger haben nicht nur Südgeorgiens Tierwelt geplündert, sondern auch Ratten eingeschleppt. Die Nager bedrohen die Vogelwelt. Ohne sie würden hier vermutlich 90 Millionen mehr Tiere nisten als heute. Mit der bisher größten Rattenausrottung aller Zeiten versucht daher ein Biologen-Team, Südgeorgiens Natur in ihren "Urzustand" zu versetzen: in ein Bird Island in Mega-Format und damit in den wichtigsten Vogelbrutplatz der Südhalbkugel. DE 2015'
