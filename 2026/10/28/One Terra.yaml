  title: Planet Weltweit - Großglockner, König der Hochalpen
  subtitle: Planet Weltweit - Großglockner, König der Hochalpen
  description: |-
    Majestätisch erhebt sich der Großglockner inmitten der Hohen Tauern. Er ist mit 3798 Metern der höchste Berg Österreichs und bildet die Grenze zwischen den Bundesländern Kärnten im Osten und  Tirol im Westen. Auf halber Höhe zum Großglockner liegt die Glorerhütte, ein Schutz- und Gästehaus für Bergsteiger. Nach achtmonatiger Winterpause eröffnet die Wirtsfamilie Riepler im Juni die Hüttensaison. Wir begleiten die jungen Rieplers und ihre Gäste durchs Jahr - vom  urigen Bergdorf Kals bis hoch auf den Gipfel des Großglockners und vom Junifeuer bis zur  Bergweihnacht.
    Es ist Anfang Juni. Toni Riepler startet seinen zweistündigen Fußmarsch zur 2600 Meter hoch  gelegenen Glorerhütte. Seit fünf Jahren bewirtschaftet er mit seiner Frau Gitti das alte Schutzhaus, das bereits 1887 von Alpinisten auf halber Strecke zum Gipfel des Großglockners errichtet wurde. Einzige Verbindung zwischen Hütte und Tal ist die Seilbahn, die Straße endet an  der Talstation der Bahn. Also müssen Toni und Gitti sämtliche Vorräte für den Sommer per Seilbahnschlitten transportieren. Die Glorerhütte ist jede Saison Anlaufpunkt für Alpinisten auf dem Weg zu ihrem Sehnsuchtsberg: dem fast viertausend Meter hohen Großglockner. Kaum ist die Hütte Anfang Juni wieder eröffnet, kündigt sich auch schon die erste Bergsteigergruppe an. Toni und seine Kollege Johann Rogl, der im Hauptberuf einen Alpenhof bewirtschaftet, werden die kleine Gruppe auf den 3798 Meter hohen Glockner führen. Mehr als 200 Jahre nach seiner Erstbesteigung übt der Glockner eine ungebrochenen Faszination auf Alpinisten aus aller Welt aus. Doch etliche haben beim Aufstieg ihr Leben gelassen und so sind die Bergtouren von Toni und Johann geprägt von Umsicht und Respekt. Der Berg prägt auch das Leben rund um das Dorf Kals. Die Menschen hier leben  intensiv mit den Jahreszeiten, dem kurzen Sommer und dem früh einsetzenden Winter. Ihr Leben ist eng verbunden mit Riten, Traditionen und den Festen. DE 2011
- eventId: 701980
  start: 2026-10-28T16:15:00Z
