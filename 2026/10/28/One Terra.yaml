- eventId: 701960
  start: 2026-10-28T00:05:00Z
  stop: 2026-10-28T00:57:00Z
  title: Planet Weltweit - Der gute Mensch von Karachi
  subtitle: Planet Weltweit - Der gute Mensch von Karachi
  description: "Das normale Leben ist täglich eine Herausforderung in Karachi. Die Hauptstadt Pakistans leidet seit Jahren unter politischen und sozialen Unruhen. Vergessen sind besonders die wirklich Bedürftigen wie Alte, Kranke und Kinder. Sie hätten keine Überlebenschance, gäbe es nicht einen Mann, der sie inmitten von Chaos und Gewalt unterstützt. Seit 65 Jahren versuchen der mittlerweile über 90-jährige Abdul Sattar Edhi und seine Familie, ihren Mitmenschen zu helfen, indem sie andere zu Mitgefühl und Toleranz bewegen. Nicht allen gefällt diese Einstellung. Edhi ist des Öfteren selber bedroht worden. Doch sein Erfolg ist beispielhaft.\nMuslimischer Fundamentalismus, Gewalt, politische Unruhen, dafür ist Pakistan und besonders die Hauptstadt Karachi in den westlichen Medien bekannt. Inmitten des Chaos versucht ein Mann, seine Vision eines gewaltfreien und friedlichen Pakistans zu verwirklichen: Abdul Sattar Edhi ist Kopf und Gründer der größten Hilfsorganisation des Landes. In den letzten 65 Jahren hat er über 50.000 Waisen eine Heimat gegeben, über 20.000 ungewollte Babys gerettet und über 40.000 junge Mädchen zu Krankenschwestern ausbilden können. Selber in Armut lebend, hat er sich nie in den Dienst großer Konzerne oder Organisationen gestellt oder sich von der Politik vereinnahmen lassen. Eine Einstellung, die ihm Kritik und gar öffentliche Drohungen, etwa von Seiten der Taliban einbrachte. Dafür hat Edhi die Bevölkerung Karachis auf seiner Seite, die ihn auf den Straßen um Hilfe bitten sieht. Edhis Prinzip beruht auf gegenseitiger Hilfe und dem Appell an einfache Menschlichkeit in einer Stadt, in der für viele Milde und Barmherzigkeit lange verloren scheinen. Inzwischen ist Edhi über 90 Jahre alt, ebenso seine Frau Bilquis. Beide versuchen ihr Vermächtnis in die Hände ihrer Kinder zu legen. Doch wird das gelingen und die Hilfe weiter funktionieren, wenn die beiden stadtbekannten Symbolfiguren der Barmherzigkeit und Menschenliebe nicht mehr da sind? \n\n DE 2013"
- eventId: 701961
  start: 2026-10-28T01:05:00Z
  stop: 2026-10-28T01:57:00Z
  title: Planet Weltweit - Kastanien, Das Brot der Korsen
  subtitle: Planet Weltweit - Kastanien, Das Brot der Korsen
  description: 'Ohne die Kastanienbäume und vor allem die Esskastanien wäre Korsika nicht das, was es ist: eine Insel voller Traditionen, voller Stolz und Würde. Hunderte Bauern haben hier einst die legendären Kastanienwälder bewirtschaftet. Heute ist eine Handvoll übriggeblieben, die gegen das Aussterben der Kastanienproduktion kämpft. Und das erst recht, seit die Gallwespe die Bäume zu vernichten droht. Die Reportage hat die wenigen verbliebenen Kastanienproduzenten eine Saison lang begleitet und ihr faszinierendes Handwerk kennengelernt. Jean-Paul Vincensini ist Korse aus Leidenschaft. Er ist ein "Pionier", er war der Erste, der in den 1970iger Jahren auf Korsika den Anbau der Kastanien und die Produktion des Kastanienmehls wiederaufnahm und so die traditionelle Lebensweise der Kastanienbauern wiederentdeckte. Wo früher Hunderte Menschen im Dorf von der Viehzucht und der Kastanie lebten, teilen sich heute ein paar freilebende Esel und Schweine den Lebensraum mit den letzten Einwohnern. Jean-Pauls Firma produziert nun wieder Kastanienmehl, das zur Herstellung des berühmten korsischen Biers, von Konfitüren, glasierten Maronen und Keksen genutzt wird. Auch die berühmte korsische Schweinerasse züchtet die Familie. Uralte Familienrezepturen kommen bei der Herstellung der Produkte zum Einsatz - doch in diesem Jahr macht allen die Gallwespenplage schwer zu schaffen. Der Schädling wurde vermutlich durch Jungpflanzen aus dem benachbarten Italien eingeschleppt und frisst sich seitdem durch die Kastanienwälder. Das bedroht nicht nur die Existenz der korsischen Kastanienbauern sondern es droht damit auch eine ganze Kultur und das Erbe Korsikas zu verschwinden. "Unsere Ahnen waren weise. Sie haben sich dem Boden angepasst, irgendwie waren sie schon genial, sie haben die richtigen Lösungen gefunden, in diesen Bergen, mit diesen Felsen. DE 2014'
- eventId: 701962
  start: 2026-10-28T02:05:00Z
  stop: 2026-10-28T02:57:00Z
  title: Planet Weltweit - Tasmanien, Sympathie für den Teufel
  subtitle: Planet Weltweit - Tasmanien, Sympathie für den Teufel
  description: Die australische Insel Tasmanien ist die Heimat einer einzigartigen Tierwelt. Ein Paradies auf Erden, das für seinen Teufel zur Hölle wurde. Unbarmherzig wird der Beutelteufel von einer heimtückischen Krankheit dahingerafft. Wenn nicht bald etwas geschieht, wird es die legendären Tasmanischen Teufel bald nicht mehr geben. Über 90 Prozent des Bestandes wurden bereits von einem heimtückischen Krebs dahingerafft, der nur die Tiere angreift. Biologen, Immunologen und Tiermediziner arbeiten mit Hochdruck daran, ein Gegenmittel zu finden. Private Initiativen kümmern sich um kranke, verletzte und verwaiste Teufel. Ein Wettlauf gegen die Zeit, der die einstmals gegen den Teufel eingestellte tasmanische Öffentlichkeit wieder eint. Greg Irons, der Besitzer des Bonorong Wildlife Sanctuary, will nicht akzeptieren, dass der Tasmanische Teufel demnächst aussterben soll. Dass der Gesichtskrebs, der die Tiere seit Jahren unaufhörlich dahinrafft, ihr Ende sein soll. Nun, da die tasmanische Öffentlichkeit endlich zu begreifen beginnt, wie wertvoll die Teufel für das Ökosystem und das Image der australischen Insel sind. Jahrhunderte lang wurden die Tiere gejagt und ausgerottet, woran hauptsächlich ihre für das menschliche Ohr unangenehm schrill klingende Stimme schuld war. Die ersten Siedler glaubten sogar, den Teufel persönlich zu vernehmen, wenn sie ihn nachts im Wald rufen hörten. Daher auch ihr Name. Inzwischen weiß man, dass die Teufel als Aasfresser einen wertvollen Dienst im Ökosystem erfüllen. Auch sind sie weder aggressiv noch gefährlich. Deshalb hat Greg Irons ein Rettungsprogramm ins Leben gerufen, das alle erdenklichen Seiten des Problems mit einbezieht. Er koordiniert die Bergung kleiner Teufel aus den Beuteln ihrer todkranken oder überfahrenen Mütter und sorgt dafür, dass sie von speziell dafür ausgebildeten Menschen großgezogen werden. In seinem Wildtierpark leben Teufel, die er zum Teil selbst aufgezogen hat. DE 2014
- eventId: 701963
  start: 2026-10-28T03:05:00Z
  stop: 2026-10-28T03:56:00Z
  title: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  subtitle: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  description: 'In der indischen Himalaja-Provinz Ladakh auf 3500 Metern Höhe wird seit Jahrzehnten Eishockey gespielt - vor allem von Männern aus der Armee, die die Grenzen zu China und Pakistan sichern. Seit einigen Jahren trainieren in dieser abgelegenen Bergregion auch immer mehr Frauen und Mädchen Eishockey. Mit Erfolg: Die 20-jährige Tsewang Chuskit ist eine der besten Spielerinnen in Ladakh.  Ladakh im Nordwesten Indiens ist ein Gebiet der Extreme. Auf einer Höhe zwischen 2500 und fast 7700 Metern herrscht monatelang klirrende Kälte, es gibt kaum Niederschläge. So ist Ladakh eine Gebirgswüste mit wenig Vegetation, aber strategisch wichtig durch die Lage an der Grenze zu Pakistan und China. Neue Entwicklungen oder gar moderne Umbrüche halten nur sehr zögerlich Einzug. Umso verwunderlicher, dass es seit einiger Zeit in Ladakh sogar Frauen- und Mädcheneishockey gibt. Diese Reportage hat das aussichtsreichste Frauenteam besucht, mitten im Himalaja. Übersetzt bedeutet Ladakh: Land der hohen Pässe. Direkt hinter der Hauptstadt Leh windet sich die Straße die Gebirgskette hoch bis auf 5600 Meter, und führt in ein Tal an der Grenze zu China. 20 Kilometer außerhalb der Stadt, am Ufer des Indus, liegt das Secmol-Internat, in dem Tsewang Chuskit lebt und lernt. SECMOL steht für: Students Educational and Cultural Movement of Ladakh - übersetzt: Studenten- und Schülerbewegung von Ladakh. Eine private Schulinitiative, die Kindern und Jugendlichen aus armen Dorffamilien den Zugang zu Bildung ermöglichen will. Eishockey ist wichtiger Teil des Erziehungsprogramms. Chuskit wohnt seit zwei Jahren hier und trainiert, wie die anderen Mädchen, jeden Morgen auf dem schuleigenen, selbst gebauten Eishockeyfeld. Von Mitte Dezember bis Ende Februar sind Schul- und Universitätsferien. Dann wird jeden Morgen und jeden Abend Eishockey trainiert und gespielt. Nach dem gewonnen Halbfinale bereitet sich das Team jetzt auf das kommende Endspiel vor. DE 2014'
- eventId: 701964
  start: 2026-10-28T04:05:00Z
  stop: 2026-10-28T04:15:00Z
  title: Rund um den Globus - Die Großfamilie der Straßenkinder
  subtitle: Rund um den Globus - Die Großfamilie der Straßenkinder
  description: "Der 47-jährige Sitha lebt mit seiner 40-jährigen Frau Sreymom in einem Randbezirk von Siem Reap - Hauptstadt der gleichnamigen Provinz in Kambodscha und drei Kilometer entfernt von der berühmten Tempelanlage Angkor Wat. Die beiden ziehen gemeinsam 37 Kinder im Alter von fünf bis 20 Jahren groß: vier eigene Kinder und 33 Straßenkinder, die sie bei sich aufgenommen haben und um die sie sich liebevoll kümmern. Ob beim Spülen oder beim Wäschewaschen - nur gemeinsam kann die Großfamilie die Aufgaben des Alltags meistern. \n DE 2011"
- eventId: 701965
  start: 2026-10-28T04:15:00Z
  stop: 2026-10-28T04:28:00Z
  title: Rund um den Globus - David und die Drachen
  subtitle: Rund um den Globus - David und die Drachen
  description: "Komodowarane sind die weltweit größten Echsen und erinnern an Drachen aus alten Geschichten. Die Riesenechsen leben seit etwa vier Millionen Jahren auf der Erde, wurden aber erst vor 100 Jahren wissenschaftlich beschrieben. Heute gibt es noch rund 2.500 frei lebende Komodowarane. Die Inseln des Nationalparks Komodo sind ihre letzten Rückzugsorte. Chefranger David Robert Hau lebt auch auf der Insel Komodo - inmitten der Riesenechsen. \n DE 2011"
- eventId: 701966
  start: 2026-10-28T04:30:00Z
  stop: 2026-10-28T04:43:00Z
  title: Rund um den Globus - Das Kinderparlament von Rajasthan
  subtitle: Rund um den Globus - Das Kinderparlament von Rajasthan
  description: Tagsüber hütet die 13-jährige Inderin Neraj Jath Ziegen in der dürren, ausgetrockneten Felslandschaft am Rand der Wüste Thar. Nach Sonnenuntergang besucht sie die Abendschule ihres kleinen Dorfes. Und in ihrer knappen Freizeit ist sie Ministerin für Ackerbau und Viehzucht im Parlament der Kinder von Rajasthan. Es wurde gegründet, damit die Kinder das im indischen Rajasthan typische Kastendenken überwinden und die Bedeutung von Demokratie und Rechtsstaatlichkeit erfassen. Etwa 3.000 Kinder aus 150 Schulen wählen das Parlament aus ihren Reihen. In ihrem Amt kümmert sich Neraj zum Beispiel um die Ausstattung der Schulen und die Wasserversorgung in den Dörfern. Das derzeitige Hauptproblem der Menschen der Region ist jedoch die langanhaltende Dürre. Deshalb hat Neraj den Einfall, das traditionelle rajasthanische Puppentheater für ihre Ziele einzusetzen. Doch in der traditionsverhafteten Gesellschaft Rajasthans zählt das Wort einer Frau wenig. Wird es da ein dreizehnjähriges Hirtenmädchen schaffen, die alten Männer für ihre Idee zu gewinnen? DE 2011
- eventId: 701967
  start: 2026-10-28T04:45:00Z
  stop: 2026-10-28T04:55:00Z
  title: Rund um den Globus - Die ungewöhnliche Großfamilie
  subtitle: Rund um den Globus - Die ungewöhnliche Großfamilie
  description: "In Russland, am Fuße des Südurals, lebt die Familie von Nikolai Stremski. Zu ihr zählen 60 Kinder, die aus den unterschiedlichsten Winkeln des Landes stammen. Alle tragen einen gemeinsamen Familiennamen - Priester Nikolai Stremski hat sie alle adoptiert. Damit der Haushalt der Stremskis funktioniert, kümmern sich die Großen um die Kleinen - und jedes Kind übernimmt Aufgaben. \n DE 2011"
- eventId: 701968
  start: 2026-10-28T04:55:00Z
  stop: 2026-10-28T05:50:00Z
  title: Rund um den Globus - Indien - Haare für die Götter
  subtitle: Rund um den Globus - Indien - Haare für die Götter
  description: Die Rasiermesser schaben ununterbrochen, legen Stück für Stück die darunter liegende Kopfhaut frei. Die Friseure arbeiten im Akkord, die Wartenden werden im Minutentakt auf die flachen Bretter bugsiert, die als provisorische Schemel dienen. Unter ihnen sind heute der zehnjährige Balaji und seine Mutter Sumati Jayapathi. Sie sind in die Tempelanlage von Palani gekommen, um ihr Haar zu opfern. Im Gegenzug dafür erhoffen sie sich von Gott Murugan Segen für den Bau eines eigenen kleinen Hauses. Mehrere Millionen Menschen pilgern jedes Jahr nach Palani. Zurück lassen sie Tonnen von geopfertem Haar, das der Tempel verkauft. Seit sich Haarverlängerungen und Echthaarperücken weltweit zunehmender Beliebtheit erfreuen, boomt das Geschäft. Die Reportage hat Balaji und seine Mutter begleitet.  DE 2013
- eventId: 701969
  start: 2026-10-28T05:50:00Z
  stop: 2026-10-28T06:20:00Z
  title: Planet Weltweit - Rattenjagd im Südpolarmeer
  subtitle: Planet Weltweit - Rattenjagd im Südpolarmeer
  description: 'Team Rat - das "Team Ratte" - startet zu einer einzigartigen Rettungsaktion. Ihr Einsatzgebiet: die menschenleere Insel Südgeorgien im Südpolarmeer, eine der abgelegensten und stürmischsten Inseln der Erde - und eines ihrer wichtigsten Vogelbiotope. Das Ziel: die größte Rattenausrottung aller Zeiten, um Millionen von Seevögel zu schützen. Im Einsatz: ein Schiff, drei Hubschrauber und ein internationales Team von 25 Leuten. Haben sie im Kampf gegen die eingeschleppten Nager eine Chance? Der Neuseeländer Peter Garden gilt als der erfahrenste Pilot für Rattenausrottungen weltweit. Doch noch nie waren die Herausforderungen so groß wie auf der subantarktischen Insel Südgeorgien. Schneestürme, hohe Berge und technische Probleme behindern den Luftangriff auf die Vogelräuber, die einst von Robbenschlägern und Walfängern eingeschleppt wurden. Jetzt soll die Insel in ihren Urzustand zurückversetzt werden. Planet hat das Team bei seinem Anti-Ratten-Einsatz am Ende der Welt begleitet. Nirgendwo sind die Gewässer des Südlichen Ozeans nährstoff- und artenreicher als rund um Südgeorgien. Die britische Insel von der Größe Mallorcas ist wichtigster Treffpunkt für Meeressäuger weltweit und Brutplatz für bis zu 60 Millionen Seevögel, darunter Arten, die nirgendwo sonst vorkommen. Doch das ist nur noch ein Bruchteil des einstigen Lebens. Denn viele der Bodenbrüter sind hilflos Ratten und Mäusen ausgeliefert, die einst mit Robben- und Walfängern an Land kamen. Mit einem acht Millionen Euro teuren Projekt einer britischen Privatstiftung sollen die Räuber nun ausgerottet werden. Per Schiff werden drei Hubschrauber, 200 Tonnen Rattengift, 700 Fässer Treibstoff sowie Essen für mehrere Monate auf die unbewohnte Insel gebracht. Das Einsatzgebiet umfasst 58.000 Hektar - und ist damit fünfmal größer als jede Fläche, auf der je zuvor eine Rattenausrottung versucht wurde. DE 2013'
- eventId: 701970
  start: 2026-10-28T06:20:00Z
  stop: 2026-10-28T07:04:00Z
  title: Planet Weltweit - Kambodscha, Sithas große Waisenfamilie
  subtitle: Planet Weltweit - Kambodscha, Sithas große Waisenfamilie
  description: "Über 30 Kinder leben in der Familie des Kambodschaner Sitha. Nur vier davon sind seine eigenen. Der Rest sind ehemalige Straßenkinder, welche die Familie adoptiert hat. Noch immer kommen neue Kinder hinzu.\nDie Zahl der Straßenkinder in Kambodscha hat in den letzten Jahren stark zugenommen. Allein 20.000 leben in der Hauptstadt Phnom Penh. Viele von ihnen stammen aus den ländlichen Gebieten, wo ihre Familien sie nicht mehr ernähren können. Einige wenige hatten Glück und wurden von Sitha und seiner Frau Sreymom adoptiert. Über 30 Kinder leben heute bei ihnen. \nDer Tag beginnt für Sitha um fünf Uhr dreißig morgens. Dann muss er durch die Schlafräume gehen und alle dreiundreißig Kinder seiner Familie wecken. Anziehen, Waschen und Frühstücken sind logistisch aufeinander abgestimmt, ebenso wie der Rest des Tages, um allen Kindern und ihren Ansprüchen gerecht zu werden. Während die einen noch im Kleinkindalter sind, werden die Ältesten bald das Haus verlassen. Als vollwertige, gebildete Mitglieder der Gesellschaft, wie Sitha hofft. Aufgenommen hat er die meisten von ihnen als arme, mittellose Straßenkinder, die mit Betteln oder Stehlen versucht hatten, über die Runden zu kommen. Die Zahl der Straßenkinder in Kambodscha wächst, die Waisenhäuser platzen aus allen Nähten. Gerade in den Dörfern ist die Armut groß. Häufig können Eltern ihre Kinder nicht ernähren oder sich um sie kümmern. Die Kinder müssen dann entweder arbeiten, um ihre Familien finanziell zu unterstützen oder sie werden komplett verstoßen und sind folglich auf sich allein gestellt. Immer wieder nimmt Sitha neue Kinder auf, auch wenn die finanziellen Anforderungen das Ehepaar längst an ihre Grenzen gebracht haben. Dreijährige Zwillinge sollen die neuesten Familienmitglieder werden. Ihre Eltern starben an Tuberkulose. Doch wohin mit den beiden in dem ohnehin schon überfüllten Haus der Familie?\n\n \n DE 2015"
- eventId: 701971
  start: 2026-10-28T07:10:00Z
  stop: 2026-10-28T08:02:00Z
  title: Planet Weltweit - Schignano, ein uralter Karneval in Italiens Bergen
  subtitle: Planet Weltweit - Schignano, ein uralter Karneval in Italiens Bergen
  description: 'Schignano. Seit Jahrhunderten feiern die Menschen hier mit einem archaischen, wilden Karneval das Ende des Winters. Sie spielen in bunten, selbstgenähten Kostümen die "Wilden", in einem Bergdorf hoch über dem Comer See. In den Straßen tanzen die "Belli" und die "Brutti". GEO Reportage hat die Menschen hinter den schaurigen Holzmasken besucht. Einmal im Jahr legen die Bewohner der Gemeinde Schignano ihre Identität ab, um einen rauschhaften, euphorischen, wild-ungezügelten Karneval zu feiern. Die meisten Bewohner hier fahren täglich zum Arbeiten in die benachbarte Schweiz. Schignano hat eine lange Migrationstradition. Schon Anfang des 20. Jahrhunderts suchten die Männer in Australien, Südamerika und den USA ihr Glück. Die Frauen blieben mit Kindern und Hof allein zurück. Damals wie heute waren jedoch einmal im Jahr alle wieder zu Hause: Zur Karnevalszeit. Nicht zuletzt deswegen ist in Schignano der Karneval eng an das Thema Auswanderung geknüpft, die "Belli", die Schönen und Erfolgreichen und die "Brutti", die Hässlichen und Erfolglosen liefern sich wilde, deftige Szenen, begleitet von viel Alkohol. Battista, ein alteingesessener, berühmter Maskenschnitzer der Region erklärt die Kostüme:" Der Schöne ist der, der die Welt bereist hat und zu Geld gekommen ist. Sein Bauch steht für Wohlstand, er trägt üppigen Schmuck, große, blumige Hüte, macht sich wichtig und gibt sich arrogant. Der Hässliche ist das exakte Gegenteil: Er symbolisiert einen schlechten Lebenswandel, trinkt viel und trägt zerschlissene Kleider. Er ist voller Wut gegenüber den Schönen und Reichen. Das ganze Jahr ist Battistas Frau mit dem Nähen und Besticken der schrillen Kostüme beschäftigt. Wie alle hier hofft sie, dass der Karneval auch in Zukunft weiterleben wird. DE 2020'
- eventId: 701972
  start: 2026-10-28T08:10:00Z
  stop: 2026-10-28T09:02:00Z
  title: Planet Weltweit - Kentucky - Die Schlacht von Sacramento
  subtitle: Planet Weltweit - Kentucky - Die Schlacht von Sacramento
  description: 'Jedes Jahr im Mai wird aus einer beschaulichen Kleinstadt im Süden der USA ein kriegerischer Schauplatz, wenn seine Bewohner und zahlreiche Angereiste die Schlacht von Sacramento originalgetreu nachstellen. Aus Farmern und Handwerkern werden Offiziere und Soldaten, die sich mit Pistolen und Kanonen wilde Gefechte liefern. Als Abraham Lincoln 1861 zum Präsidenten der Vereinigten Staaten von Amerika gewählt wurde, kam es zur Abspaltung der Südstaaten. In dem folgenden Sezessionskrieg zwischen der Union und den Konföderierten Staaten schrieb die Schlacht von Sacramento im Staat Kentucky Geschichte. Sacramento erzählt seine Geschichte heute aus einer Perspektive, die der offiziellen Geschichtsschreibung widerspricht. GEO Reportage war mit auf dem Schlachtfeld der "Battle of Sacramento". Sacramento im Mai 2019. Überall in der Stadt gibt es Hinweise auf die Schlacht von Sacramento, "Battle of Sacramento", die die kleine Stadt weit über ihre Grenzen hinaus bekannt gemacht hat. Die Männer, die hier leben sind Pferdenarren, das gehört zur Lebensart und hat viel mit der Geschichte des landwirtschaftlich geprägten Südens zu tun. Ihre Pferde trainieren sie für die jährliche Nachstellung der berühmten Schlacht von Sacramento, wenn die Gegner von Union und Konföderierten im Gefecht aufeinander stürmen und Schüsse und Kanonenkugeln dröhnen. Doug Key ist einer dieser Männer und wie für die meisten Südstaatler sind für ihn Heimat, Familie und Freunde das wichtigste Gut, egal ob Schwarz oder Weiß: "Wir alle funktionieren zusammen wie eine große Familie. Wir sind Brüder, und der Erfolg in der Schlacht bringt uns noch näher zusammen und lässt uns gestärkt in die nächste gehen..." Jedes Jahr im Mai wird die Schlacht von 1861 wieder lebendig und mit ihr die Sichtweise des Südens, worum es im Bürgerkrieg ging. DE 2020'
- eventId: 701973
  start: 2026-10-28T09:10:00Z
  stop: 2026-10-28T10:02:00Z
  title: Planet Weltweit - Handgemacht in Laos - Rares aus Rattan
  subtitle: Planet Weltweit - Handgemacht in Laos - Rares aus Rattan
  description: 'Planet Weltweit: Seit jeher wird Rattan in Asien vielseitig verwendet: zur Herstellung von Möbeln, Korbwaren, Wandverkleidungen und Sportbällen. Auch im bergreichen Zentrum von Laos gedeiht die stachelige Rattan-Palme. Wild als Kletter-Liane in den Dschungelwäldern und angebaut auf Feldern. Die Menschen in den Dörfern ringsum leben seit Generationen von Rattan, der Pflanze mit vielfältigen Eigenschaften. DE 2022'
- eventId: 701974
  start: 2026-10-28T10:10:00Z
  stop: 2026-10-28T11:02:00Z
  title: Planet Weltweit - Island, von strickenden Männern und Pullovern
  subtitle: Planet Weltweit - Island, von strickenden Männern und Pullovern
  description: 'Island, das karge Land am Polarkreis, wo Menschen und Tiere ganz und gar ungerührt den Elementen wie Wind und Kälte trotzen. In den langen und kalten Wintern ziehen sich die Bewohner in ihre Häuser zurück und frönen einer uralten Leidenschaft: Sie stricken, und zwar Frauen und Männer! GEO Reportage hat den strickenden Isländern über die Schulter geschaut und feiert das Comeback des Islandpullovers. Musikmanager Petur Oddbergur Heimisson ist 35 Jahre alt und strickt seit seinem 12. Lebensjahr. Mit großer Leidenschaft fertigt er den traditionellen Islandpullover mit seinen Jacquard-Mustern und aus einer Wolle, die nur von isländischen Schafen stammt. Um mehr über die Geschichte des Islandpulllovers zu erfahren, begibt er sich auf eine Reise durch das Land, um dem Ursprung der Wolle, der einzigartigen Muster und der wundervollen Farben nachzugehen. Dabei entdeckt er, wie viel der legendäre Pullover mit den Wikingern, der atemberaubenden Landschaft und seinen Vorfahren zu tun hat. Und so verwundert es nicht, dass man in der Hauptstadt Reykjavík abends in den Cafés eine drollige Szenerie antrifft: Verheiratete Männer, Familienväter, Singles aller Berufsgruppen stricken beim Bier, manche begleitet von ihren Frauen. Sie bewegen sich auf den Spuren ihrer Vorfahren, denn Stricken war nicht nur unter Seeleuten, sondern auch unter Männern auf dem Land weit verbreitet. Die Freude, etwas Kreatives und zugleich Praktisches mit den eigenen Händen zu erschaffen, einer beruhigenden Tätigkeit nachzugehen und zeitgleich mit Freunden zu plaudern, sein Bier zu trinken oder fernzuschauen: Das macht Stricken so einzigartig. Die Nachfrage nach dem Original führt das kleine Land und seine strickenden Hände an seine Grenzen, woher die vielen Pullover nehmen, und wie vermeiden, dass auch hier die asiatischen Kopien den Markt erobern? Die Isländer hatten eine Idee... DE 2019'
- eventId: 701975
  start: 2026-10-28T11:10:00Z
  stop: 2026-10-28T12:02:00Z
  title: Planet Weltweit - Indien, ein Himmel voller bunter Drachen
  subtitle: Planet Weltweit - Indien, ein Himmel voller bunter Drachen
  description: Am Neujahrsfest verwandelt sich die westindische Stadt Ahmadabad in die Hauptstadt der Drachen. Tausende Papierdrachen steigen in die Luft, begleitet von Feuerwerk und guten Wünschen. Wie die meisten Einwohner fiebert auch der 15-jährige Mohit monatelang auf dieses Fest hin. Einen ganzen Stapel neuer Drachen hat er dafür gekauft, die länger in der Luft bleiben sollen als die der Konkurrenz. Dafür präpariert Mohit sie auf ganz besondere Weise. GEO Reportage hat ihn bei seinen Vorbereitungen begleitet. Drachensteigen gehört zu den beliebtesten Freizeitbeschäftigungen im westindischen Bundesstaat Gujarat. Es ist Wettkampf und Leidenschaft. Besonders deutlich wird dies am Neujahrsfest, dem sogenannten Uttarayan, das traditionell im Januar stattfindet. Tausende von Flugkörpern steigen dann in den Himmel und ringen um die Lufthoheit. Doch die Drachen sollen nicht nur hoch steigen und möglichst lange in der Luft bleiben. Durch speziell mit Glaspulver präparierte Schnüre sollten sie auch die Halterungen der anderen Drachen kappen und diese zum Absturz bringen. Einer der diese Kunst zu einer besonderen Fertigkeit gebracht hat, ist der 15-jährige Mojit Prajapati aus der Stadt Ahmedabad. Das Drachensteigen lernte er von seinem zwei Jahre älteren Bruder Nikhil. Drachen lassen die Geschwister das ganze Jahr steigen. Nun vor dem großen Fest verbringen sie jede freie Minute auf dem Dach ihres Hauses, um ihre Flugtechniken zu perfektionieren. Auch wollen sie, wie die meisten Einwohner Ahmedabads neue Drachen kaufen, die sie am Tag vor den Festlichkeiten aufwendig präparieren. Tausende kleine Werkstätten richten sich ein, um sie herzustellen, Millionen Drachen werden in den Tagen vor Uttarayan verkauft. Zwei Tage dauert das Ereignis, bei dem die Flugdrachen bis in die Nacht hinein den Himmel über Ahmedabad bevölkern. Und Mojit hofft, dass seine Modelle bis zuletzt oben bleiben werden. DE 2019
- eventId: 701976
  start: 2026-10-28T12:10:00Z
  stop: 2026-10-28T13:02:00Z
  title: Planet Weltweit - Tradition am Steilhang - Die Schweiz und ihre Wildheuer
  subtitle: Planet Weltweit - Tradition am Steilhang - Die Schweiz und ihre Wildheuer
  description: 'Im Schweizer Kanton Uri pflegen die Bauern an den fast senkrechten Steilhängen eine gefährliche Tradition: Das Wildheuen. Seit Jahrhunderten mähen sie hier in den Alpen das Gras für ihre Tiere auch oberhalb der Weiden. Dafür braucht es vor allem Kondition und absolute Trittsicherheit. Doch es lohnt sich, denn Wildheu ist extrem gesund für die Tiere, das regelmäßige Mähen hält die Wiesen frei von Wildwuchs und ist obendrein ein Schutz vor Lawinen. Hoch über dem Vierwaldstättersee beginnt jeden August ein gefährliches Abenteuer:  die Saison der Wildheuer. Sepp Herger ist von Kindesbeinen an mit seinen Eltern auf der Alm, ein anderes Leben kann er sich kaum vorstellen. Vor acht Jahren hat er sich eine eigene Bergweide im Kanton Uri gekauft, hier lebt er den Sommer über mit seiner Frau Andrea in 1500 Metern Höhe. Die beiden hüten dort oben 80 Kühe, haben eine eigene Ziegenzucht, sind Käsebauern und nicht zuletzt Wildheuer. Die schwer zugänglichen Wildheuwiesen, liebevoll "Wildi" genannt, sind voller Kräuter und Blumen, das Heu ist nährstoffreich und regelmäßiges Mähen sorgt dafür, dass die Flächen frei von Wald bleiben und damit auch sicher vor Lawinen. Dafür zahlt der Kanton seinen Bauern sogar Geld. Doch das Wildheuen bleibt nicht nur körperlich mühsam, sondern ist vor allem extrem gefährlich. Der Tag im Sommer beginnt früh für Sepp und seine Frau. Nachdem die Kühe im Freien, direkt auf der Alm, gemolken wurden, geht es für Andrea in die eigene Käserei und für Sepp auf die "Wildi", die steilen Wildheuwiesen. Nicht nur, dass er das Heu der Wiesen überweigend von Hand mäht, er muss es auch zu 80 Kilogramm schweren Ballen binden. Allein sechs Tonnen wurden es in diesem Sommer. Auf noch steileren und höher gelegenen Wiesen kommt auch schon mal schweres Gerät zum Einsatz: Mäher und Helikopter. Ein Abenteuer ganz in der Tradition der Schweizer Bergbauern vor einer atemberaubenden Kulisse DE 2020'
- eventId: 701977
  start: 2026-10-28T13:10:00Z
  stop: 2026-10-28T14:02:00Z
  title: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  subtitle: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  description: 'Planet Weltweit: "Las Fallas de Valencia" sind eine Mischung aus Frühlingsfest und Karneval. Sie verwandeln die spanische Stadt jedes Jahr in einen Party-Hotspot. Künstler wie Mario Gual del Olmo stecken viel Zeit und Kreativität in ihre riesigen Straßen-Skulpturen, die allerdings nicht sehr langlebig sein werden: Im März gehen sie traditionell in Flammen auf. Eine ganze Woche lang wird gefeiert, begleitet von Spielmannszügen, Fanfaren, Böllern und viel Feuerwerk. Die Ursprünge reichen zurück bis ins Mittelalter. Damals verbrannten die Zimmerleute am 19. März, dem Gedenktag ihres Schutzheiligen Joseph, alle Werkstatt-Reste auf den Straßen. "Fallas", übersetzt "Fehler" oder "Misserfolge", nannten sie diese Überreste erledigter oder misslungener Arbeiten und trieben mit dem Feuer den Winter aus. Später begann man, die Holzreste mit Puppen, den sogenannten "ninots", zu schmücken und zu bemalen.  Mario Gual del Olmo und andere "Artistas Falleros" arbeiten das ganze Jahr an ihren Werken. Die Vorbereitungen für das kommende Spektakel beginnen bereits im Frühling. Bunte Zeichnungen sollen den Auftraggebern die neuen Ideen schmackhaft machen. Das sind Fallas-Vereine, von denen es Dutzende in jedem Stadtviertel gibt. Rund 400 solcher Vereine gibt es derzeit, die alle eine bis zu 15 m hohe, große Falla und eine kleinere Kinder-Falla bauen lassen. Rund 120 Künstler, vor allem Designer, Zimmerleute, Bildhauer und Maler sowie deren Mitarbeiter leben davon. Die meisten haben ihre Werkstätten in der "Ciudad Fallera", einem eigenen Stadtviertel nur für dieses Handwerk. Hier entstehen jährlich fast 780 Kreationen im Gesamtwert von knapp acht Millionen Euro, nach Größe und Budget in Sektionen unterteilt. Lediglich eine "ninot indultat", eine "begnadigte Puppe", die vom Publikum gewählt wird, entgeht dem Verbrennen und wandert ins Museum. "Las Fallas de Valencia" - alle Jahre wieder eine spektakuläre, feurige Fiesta. DE 2022'
- eventId: 701978
  start: 2026-10-28T14:10:00Z
  stop: 2026-10-28T15:02:00Z
  title: Planet Weltweit - Kalifornien auf die harte Tour
  subtitle: Planet Weltweit - Kalifornien auf die harte Tour
  description: 'Kalifornien, Anfang August: Wo andere in der Sonne braten, suchen 15 Urlauber das wahre Leben - die Realität hinter dem kalifornischen Traum von Sonne, Sand und Meer. In einer Reality Tour entdecken sie vom Fahrrad aus Kaliforniens Hinterhof. Sie radeln durch Kaliforniens atemberaubend schöne Landschaft zu den sozialen und politischen Brennpunkten des Sonnenstaats, erkunden die harten Lebensbedingungen illegal eingewanderter Mexikaner. Im Visier: Themen wie Immigration und Freihandel, Umweltverschmutzung und Rassismus. Strampeln statt Strand.  Was macht eine 62-jährige Nonne auf einer knochenharten 1000-km Radtour entlang der kalifornischen Küste? Wie kommt eine gutsituierte Hausfrau auf die Idee, für eine Gesundheitsreform auf dem Fahrrad zu demonstrieren? Wie fühlt sich eine Anwältin bei der Übernachtung im Immigrantenheim? 13 amerikanische Frauen und zwei Männer auf einer Höllentour durch Kalifornien. Sie sehen ihr Land in einer Sackgasse, suchen neue Werte und eine politische Moral. Bis zu 150 Kilometer täglich strampeln sie dafür durch Hitze, Staub und Abgase. Start der Tour ist San Francisco. Die Stadt, die Tausende Touristen wegen ihrer Kultur und Lebensart reizt, lässt die Biker kalt. Sie haben keine Augen für die Cable Cars auf den steilen Straßen, nicht für Chinatown oder die legendäre Golden Gate Bridge. Entlang von Kaliforniens schneeweißen Stränden und spektakulären Steilküsten suchen sie soziale Brennpunkte und das wahre Leben. Derzeit leben rund 38 Millionen Lateinamerikaner in den USA, in Kalifornien machen die Latinos 32 Prozent der Bevölkerung aus. Schätzungsweise bis zu 300.000 Mexikaner reisen jährlich kurz vor der Erntezeit in die USA ein. Die mexikanischen Immigranten nehmen lebensgefährliche Strapazen, Gefängnis und Verfolgung auf sich, um hier eine neue Existenz zugründen. Die Tour der Radfahrer verfolgt ihren Weg zurück. DE 2004'
- eventId: 701979
  start: 2026-10-28T15:10:00Z
