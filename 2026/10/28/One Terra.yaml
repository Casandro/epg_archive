  title: Planet Weltweit - Wildererjagd am Mount Kenya
  subtitle: Planet Weltweit - Wildererjagd am Mount Kenya
  description: 'Ein 5.200 Meter hoher Riese thront am Äquator: der Mount Kenya. Den Berg umringt ein dichter, undurchdringlicher Regenwald, in dem rund 2.000 Elefanten leben. Die Natur hier ist nahezu unberührt. Doch dieses Paradies ist bedroht seit Wilderer ihr Unwesen treiben. Die Dokumentation beobachtet die Fallensteller und begleitet deren Jäger, die Wildhüter vom Mount Kenya, auf ihren gefährlichen Streifzügen durch den Tropenwald. Bereits in den frühen Morgenstunden ist der tropenfeuchte Wald höchst lebendig: In den Baumkronen, 50 Meter weit oben, zetern halbstarke Meerkatzenmännchen. Äste krachen, von Elefanten beim Frühstück gebrochen. Der Wildhüter Simon Gitau und seine Kollegen streifen durch das Dickicht des Bergregenwalds vom Mount Kenya, um Wilderer auf frischer Tat zu ertappen. Zur gleichen Zeit, nicht weit entfernt, machen drei Männer ihre Fallen scharf. Auf alles, was Beine hat, haben sie es abgesehen. Auch auf die fast ausgestorbene Bongo-Antilope. Simon Gitau will den Wilderern das Handwerk legen. Er ist einer der leitenden Wildhüter vom Kenya Wildlife Service - im Tierschutz hat er seine Berufung gefunden. Vor Jahren war Simon selbst Wilderer. Deshalb kennt er den Unterschied zwischen dem "kleinen" Wilderer, der es aus Armut und Bedrängnis für die Ernährung seiner Familie tut, und dem bewaffneten Großwilderer, der es auf das wertvolle Elfenbein abgesehen hat. Kriminell sind beide für ihn, denn sie bedrohen das Leben der Tiere Afrikas. Die Wildhüter haben allesamt eine militärische Ausbildung, denn die Konfrontation mit gewaltbereiten Wilderern kann sehr gefährlich werden. Dabei hat der Kenya Wildlife Service nicht nur den Schutz des einzigartigen Naturparadieses zum Ziel - auch die Bergrettung gehört zu den Aufgaben der Organisation. Der Mount Kenya ist mit knapp 5.200 Metern nach dem Kilimandscharo der zweithöchste Berg Afrikas und Sehnsuchtstort für Bergsteiger aus aller Welt. DE 2011'
- eventId: 701983
  start: 2026-10-28T19:15:00Z
  stop: 2026-10-28T20:07:00Z
  title: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  subtitle: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  description: 'Es ist die Geschichte eines unglaublichen Comebacks eines kleinen Flüsschens und einer ganzen Landschaft: Die Emscher fließt mitten durch das Ruhrgebiet, lange Zeit das industrielle Herz Deutschlands. Dem Fluss widerfuhr das traurige Schicksal, alle Abwässer der Region Richtung Rhein zu befördern. Er verkam zu einem in ein Betonbett gezwängten, stinkenden Kanal. Die Emscher war der dreckigste Fluss in ganz Europa. Ausgerechnet die Emscher wird heute zum Vorbild für Stadt- und Landschaftsplaner in Industrieregionen weltweit. Auf einer Strecke von insgesamt 350 Kilometern werden sie und ihre Nebenflüsse von ihrer schmutzigen Last befreit: Überall entstehen Kläranlagen und unterirdische Kanalsysteme. Die Flüsse und Bäche dürfen sich wieder einen natürlichen Lauf suchen, seltene Tiere und Pflanzen erobern das Ruhrgebiet zurück. Die Emschergenossenschaft, ein Zusammenschluss von Städten und Unternehmen, ist verantwortlich für diese Renaturierung. Das Wiedererblühen des Flüsschens ist nur ein Baustein des Wandels des gesamten Ruhrgebiets hin zu einer grünen, lebenswerten Gegend. Die Dokumentation zeigt auch die Menschen, die die Rückkehr der Natur ins Ruhrgebiet vorantrieben: Anwohner, Ingenieure und Biologen, die sich nicht damit abfinden wollten, am dreckigsten Fluss Europas zu leben. Als die Kohleförderung an der Ruhr zu Ende ging, war ihre Zeit gekommen. Wo früher die Schlote rauchten, gibt es heute Seen, Wälder und sogar Weinberge. Und die Menschen entdecken ihren wieder ergrünten "Pott" als einzigartige Naturregion mit einer ganz speziellen Industriegeschichte. DE 2017'
- eventId: 701984
  start: 2026-10-28T20:15:00Z
  stop: 2026-10-28T21:08:00Z
  title: Wasser ist Zukunft - Andalusiens geheimer Schatz
  subtitle: Wasser ist Zukunft - Andalusiens geheimer Schatz
  description: 'Andalusien ist der trockene und wilde Süden Spaniens, über Jahrhunderte umkämpft zwischen Spaniern und Mauren, eine Region voller Geschichte. Immer schon bestimmte vor allem das Wasser das Leben der Andalusier. Ein knappes Gut in Südspanien, von den Mauren auch "flüssiges Silber" genannt. Zugleich liegt in Andalusien eines der wichtigsten Feuchtgebiete der Welt: der Doñana-Nationalpark, in dem jedes Jahr rund sechs Millionen Zugvögel überwintern. Heute ist Andalusien eine der produktivsten landwirtschaftlichen Regionen Europas, trotz des knappen Wassers. Viele Früh-Erdbeeren werden im Westen Andalusiens mit Wasser aus illegalen Brunnen bewässert. Dadurch sinkt das Grundwasser, Flüsse versanden, der Doñana-Nationalpark fällt immer öfter trocken. Eine Bedrohung für das UNESCO-Weltkulturerbe. Auch im Osten Andalusiens dominiert die Landwirtschaft. Hier wächst auf einer Fläche von 50.000 Fußballfeldern tonnenweise Gemüse für ganz Europa. Sonne gibt es genug. In diesem "Plastikmeer", nur wenige Kilometer von Europas einziger Wüste entfernt, regnet es kaum. Die Grundwasserspeicher sind durch die künstliche Bewässerung der Felder erschöpft. Doch es gibt Menschen, die Andalusiens geheimen Schatz bewahren wollen. Bauern greifen auf das Wissen der Mauren zurück, die vor 1.300 Jahren eine sparsame Wasserwirtschaft installierten. Wissenschaftler versuchen Abwasser mittels Sonnenenergie trinkbar zu machen. Die Dokumentation begleitet Landwirte, Physiker und Naturschützer, besucht Gewächshäuser und Naturparks und zeigt Menschen, die das kostbare Wasser dem Menschen und der Natur bereitstellen wollen. DE 2017'
- eventId: 701985
  start: 2026-10-28T21:15:00Z
  stop: 2026-10-28T22:08:00Z
  title: Wasser ist Zukunft - Die Niederlande - Der Pakt mit dem Wasser
  subtitle: Wasser ist Zukunft - Die Niederlande - Der Pakt mit dem Wasser
  description: 'Gott erschuf Himmel und Erde doch wir erschufen die Niederlande. So lautet das selbstbewusste Credo der Bewohner des Küstenlandes. Über Jahrhunderte haben die Niederländer das Meer mit Deichen gezähmt, Sümpfe trockengelegt, ihr Land mit unzähligen Kanälen und Wasserstraßen durchzogen. Doch die Natur droht mächtiger denn je zurückzuschlagen: Der Klimawandel facht die Stürme an und lässt den Meeresspiegel steigen. Gegen anschwellende Fluten und Pegel müssen die Niederländer neue Wege finden, mit dem Wasser zu leben. Die traditionellen Lösungen reichen nicht mehr aus, das tiefliegende Land zu schützen. Die Niederlande suchen einen neuen Pakt mit dem Wasser. Statt immer häufiger Sand an den Küsten aufzuschütten, wagten die niederländischen Ingenieure im Jahr 2011 ein einmaliges Experiment: Mit rund 20 Millionen Kubikmetern Sand schufen sie eine riesige, hakenförmige Halbinsel: den "Sandmotor". Die Idee: Das Meer soll in den nächsten 20 Jahren den aufgeschütteten Sand entlang der Küste verteilen. Ganz von selbst. Solange sind keine weiteren Strandreparaturen nötig. Immer häufiger versuchen die Menschen in den Niederlanden, die Kraft der Natur zu nutzen, um die Küsten zu schützen und an den Flüssen dem Wasser gezielt Raum zu geben. Die Dokumentation begleitet Ingenieure, Architekten und Naturschützer, besucht Dachgärten, Muschelfarmen und schwimmende Häuser und zeigt Menschen, die mit Einfallsreichtum und Geschäftssinn den neuen Pakt mit dem Wasser schmieden. Denn für die Niederlande ist das Wasser die Zukunft. DE 2017'
- eventId: 701986
  start: 2026-10-28T22:15:00Z
  stop: 2026-10-28T23:07:00Z
  title: Planet Weltweit - Sibirien, Der Kapitän und die Lena
  subtitle: Planet Weltweit - Sibirien, Der Kapitän und die Lena
  description: 'Seit 35 Jahren ist Kapitän Wassili Wassiljewitsch in den Sommermonaten auf dem mächtigsten Strom Sibiriens unterwegs, der Lena. Sein Schiff namens "Magdeburg" dient als Versorgungs- und Transportschiff. Einsatzgebiet ist der Nordabschnitt des Flusses, am sibirischen Eismeer. Nur drei Monate ist es hier in der Regel eisfrei. Heimathafen der "Magdeburg" ist Jakutsk, die größte Stadt an der Lena. Hier beginnt alljährlich die Reise in den Norden. Jakutsk ist die Hauptstadt der fern im nördlichen Asien liegenden größten föderalen Republik Russlands - Sacha, die Republik der Jakuten. Ihre Fläche ist so groß wie die der Europäischen Union. Im kurzen Sommer zeigt sich die Stadt Jakutsk offen und modern. Im Winter ist sie dick eingepackt, bei Temperaturen bis zu minus 45° C. Diese Reportage war dabei, als es für die "Magdeburg" wie jedes Jahr hieß: "Leinen los! Auf nach Norden!" Kapitän Wassili Wassiljewitsch lebt mit seiner Familie an der Ostsee in Kaliningrad, dem einstigen Königsberg. Aber von April bis Oktober kehrt er auf sein Schiff, die "Magdeburg" zurück, und auf die Lena. Der Strom fließt durch die autonome jakutische Republik Sacha, weit im asiatischen Teil Russlands. Von der Hauptstadt Jakutsk aus führt die Reise der "Magdeburg" 1600 km weit nach Norden. Es geht über den Polarkreis die Lena hinunter, bis zur Landspitze Mys Bykow am Eismeer. Seit 24 Jahren ist die "Magdeburg" für Wassili Wassiljewitsch zur zweiten Heimat geworden. Das Schiff ist beladen mit all dem, was man zum Überleben jenseits der Zivilisation braucht: Lebensmittel, Mehl, Konserven, frisches Obst und Gemüse - und vor allem Baumaterial und Holz. Denn im Norden gibt es nur die baumlose Tundra. Die "Magdeburg" fährt im Auftrag der Regierung zur Unterstützung Bewohner des russischen Nordens. Der Staat trägt zwei Drittel der Kosten. DE 2015'
