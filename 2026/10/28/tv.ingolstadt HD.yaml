  title: Heimspiel vom 27.10.2026 (Wh.)
  subtitle: 'Heute im Heimspiel: Regionalliga-Fußball, Profi-Fußball & Selbstverteidigung.'
  description: |-
    Regionalliga-Fußball
    Mehr als 2.800 Zuschauer, Dauerregen und eine bittere Niederlage: wir waren beim Heimspiel des VfB Eichstätt gegen den TSV 1860 München dabei. Eine unglückliche Ecke und ein Konter in der Nachspielzeit entschieden die Partie zugunsten der Löwen.
    Profi-Fußball
    Seit Ende September steht Achim Beierlorzer beim FC Ingolstadt an der Seitenlinie. Wir blicken auf seine ersten Wochen als Schanzer-Cheftrainer zurück - inklusive dem jüngsten 2:1-Heimsieg gegen Tabellenführer MSV Duisburg.
    Und Selbstverteidigung
    Wie kann man sich in bedrohlichen Situationen behaupten und die eigenen Grenzen deutlich machen? Wir haben bei einem Selbstbehauptungs- und Selbstverteidigungskurs im Bürgerhaus Neuburger Kasten mitgemacht.
