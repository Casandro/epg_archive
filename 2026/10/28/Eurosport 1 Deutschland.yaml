  description: Janja Garnbret konnte sich vor heimischem Publikum schließlich den Sieg sichern. Die Slowenin setzte sich gegen die US-Amerikanerin Brooke Raboutou durch. Das Podium vervollständigte die Südkoreanerin Seo Chae-hyun. Bei den Männern triumphierte der Japaner Neo Suzuki vor seinem Landsmann Satone Yoshida. (2026)
