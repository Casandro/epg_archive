  subtitle: Eintagesrennen der Herren. Die Gastgeber warten seit rund 30 Jahren auf einen Sieg. Zu den französischen Hoffnungsträgern zählt auch diesmal Klassikerjäger Christophe Laporte.
  description: Paris-Roubaix ist das, was man einen Klassiker nennt. Das berühmte Eintagesrennen wurde erstmals 1896 ausgetragen. Seitdem findet es in jedem Jahr immer an einem Sonntag Mitte April statt. Es ist 250 Kilometer lang. Berüchtigt ist es für die Abschnitte, die über Kopfsteinpflaster führen - man nennt sie auch Pavé-Sektoren. Start des Rennens ist vor dem Schloss in Compiègne. (2026)
