  title: Rosamunde Pilcher - Wiatr nad morzem 1 (odc. 78)
  subtitle: Jenny Peters, pasjonatka biologii morskiej, chroni nadmorski rezerwat. Gdy po latach wraca jej dawna miłość, architekt John, między nimi ponownie odżywa uczucie.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wind über der See
    AT,DE, 2007
    Reżyseria: Thomas Herrmann
    Występują: Sophie Wepper, Martin Kluge, Iréna Flury, Daniela Ziegler, Kyra Mladeck, Rüdiger Joswig
    Jenny Peters jest pasjonatką biologu morskiego. Razem z babcią Emily, która z miłością się nią opiekowała po śmierci matki, mieszka w pięknej rezydencji na angielskim wybrzeżu. Otrzymuje aktywne wsparcie w Instytucie Biologii Morskiej od sir Simona, z którym walczy o rezerwat przyrody na wybrzeżu. Gdy jego syn John wraca, dawna miłość między Jenny a Johnem znów się rozpala.
