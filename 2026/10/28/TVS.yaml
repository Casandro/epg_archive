  title: 'Rosamunde Pilcher: Żagle miłości 1 (odc. 61)'
  subtitle: Głowa herbacianego rodu, od lat skłócony z synem, postanawia zapisać swoje imperium zaufanemu dyrektorowi. Mężczyzna planuje poślubić młodą garncarkę. Sytuację komplikuje powrót syna marnotrawnego.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Segel der Liebe
    DE,AT, 2005
    Reżyseria: Michael Steinke
    Występują: Annika Murjahn, Thorsten Grasshoff, Rosel Zech, Miguel Herz-Kestranek, Philipp Moog, Hans Dieter Trayer
    Skłócony od lat z synem patriarcha herbacianego rodu postanawia przekazać rodzinne przedsiębiorstwo lojalnemu dyrektorowi zarządzającemu. Mężczyzna planuje ślub z młodą garncarką, co ma umocnić jego pozycję. Niespodziewanie do domu wraca syn, który na emigracji zbudował własną firmę i chce pojednać się z ojcem. Wraz z nim odżywa dawne uczucie do pięknej rzemieślniczki. Dyrektor, rywal zarówno w interesach, jak i w miłości, zaczyna realizować niebezpieczny plan.
