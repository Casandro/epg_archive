  description: "Das Foto von Lee Miller in Hitlers Badewanne ging um die Welt. Sie war eine von wenigen Kriegsreporterinnen, die mit einer Genehmigung der US-Armee vom Zweiten Weltkrieg berichten konnten. Zum ersten Mal in der Geschichte gab es einen weiblichen Blick auf den maßgeblich von Männern geführten Krieg. \n\nDer Film von Grimme-Preisträgerin Luzia Schmid porträtiert die drei Journalistinnen Lee Miller, Martha Gellhorn und Margaret Bourke-White und ihren Blick auf den Zweiten Weltkrieg mit ihren eigenen Fotos und Texten - eingebettet in Archivmaterial der Alliierten."
