  title: 'Star Trek: Legenden'
  subtitle: Wer war Gene Roddenberry
  description: |-
    Als O'Neill und seine Leute den Planeten P3R-272 erforschen, landen sie in einem futuristischen Raum, der von einer bislang unbekannten Alien-Spezies erschaffen worden ist. Kryptische Schriftzeichen deuten darauf hin, dass es sich dabei um Verbündete der Asgard handelt. Plötzlich wird der Colonel von einer seltsamen Apparatur erfasst. Kurz darauf fängt er an, Wörter einer außerirdischen Sprache zu verwenden. Scheinbar wurde ihm das Wissen der Aliens in den Kopf implantiert! Doch es gibt ein Problem: Die geballte Ladung an Informationen sowie die komplexen Erkenntnisse der uralten Spezies könnten O'Neills Gehirn überfordern.
