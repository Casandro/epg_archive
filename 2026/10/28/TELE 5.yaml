  title: 'Star Trek: Legenden'
  subtitle: Die Rettung von Star Trek
  description: |-
    In einem futuristischen Alien-Labor findet SG-1 einen sterbenden alten Mann namens Ma'chello vor. Außerdem gibt es dort jede Menge Gerätschaften, deren Funktionsweise völlig unbekannt ist. Wie sich herausstellt, verfügt Ma'chello über wertvolles Wissen, wie man die Goa'uld besiegen kann. Allerdings ist bei den Hightech-Maschinen auch eine Apparatur dabei, die Seelenwanderungen ermöglicht. So transferiert der Alte sein Bewusstsein in den Körper von Dr. Daniel Jackson, um die Erde kennenzulernen. Auch Teal'c und O'Neill tauschen ungewollt ihre biologischen Hüllen, was weitreichende Konsequenzen nach sich zieht.
    USA 1998
