  title: Late Nite Sounds - Folk & Welt
  description: "Neues vom Orchestra Baobab und was ist eigentlich Mbalax? \n \nJay Rutledge gräbt sich durch die Musikgeschichte des Senegal. Wir tauchen ein in die afrokubanischen Anfänge, unsterblich gemacht vom legendären Orchestra Baobab, verfolgen den Aufstieg von Youssou Ndour und landen dann heute bei den harten Mbalaxklängen des 26 jährigen Bass Thioung. Anlass ist das neue Album 'Made in Senegal' des legendären Orchestra Baobab, eingespielt mit neuer verjüngter Band. Können sie dem Mythos Band gerecht werden?\n\nNeuvorstellungen, spannende Alben und aktuelle Strömungen der Folk- und Weltmusik."
  subtitle: Made in Senegal
