  title: Die toten Augen von London (Folge 8 von 12)
  subtitle: von Edgar Wallace
  description: "Dichter Nebel liegt über London. Plötzlich unterbricht ein Schrei die unheimliche Stille. Inspektor Larry Holt von Scotland Yard mag nicht mehr an einen Unfall glauben, als die Polizei nach einer Nebelnacht wieder einmal einen Toten aus der Themse fischt. Bei den Opfern der Mordserie handelt es sich ausschließlich um wohlhabende, allein stehende Herren aus Übersee. Winzige Zettel in Blindenschrift führen Inspektor Holt auf eine erste Spur.\n\nEs liest: Udo Wachtveitl\n\n(12 Min.)\n\n\n\nMitwirkende: \nUdo Wachtveitl"
