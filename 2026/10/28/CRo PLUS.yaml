  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (9/15) Část devátá: Revoluce středa a čtvrtek 24. a 25. října 1956. Ve středu 24. října vstoupili sovětští vojáci do Budapešti a rázem se ocitli uprostřed gerilové války. Na živelný odpor spoléhající na moment překvapení nebylo vojsko připraveno a na druhý den mu připravili bojovníci za svobodu další perné chvilky, posíleni vědomím, že dokážou odolávat armádě velmoci. Před parlamentem došlo k prvnímu velkému masakru. Z řad armády, která se přidala na stranu rebelů, se rekrutovali první vůdci jako Gergély Pongrátz nebo Pál Maléter. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
