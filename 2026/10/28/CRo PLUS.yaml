  title: Historie českého zločinu
  description: Kdo zavraždil paní Emerencii. 28. prosinec roku 1918. Nájemník Antonín Vitouch přichází na policejní úřad v Brně nahlásit smrt své bytné. A tím začíná kriminální případ. Je totiž na první pohled jasné, že nešlo o smrt přirozenou. Scénář podle skutečné události napsala Jitka Škápíková. odborná spolupráce emeritní policejní rada Vladimír Matoušek. Komentuje publicista Jiří Skoupý.
