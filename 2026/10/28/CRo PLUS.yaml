  title: Hovory
  description: 'Petra Homolová je záchranářka, která získala Stříbrnou medaili předsedy Senátu za projekt Sanitka splněných snů: "Lidé se jezdí rozloučit s místy, která pro ně něco znamenala. Nejčastěji domů, nebo na chalupy, či za zážitky, které sdílejí se s blízkými. Mám pocit, že nás umírající učí žít," říká a dodává: "Dozvěděla jsem se, že podobné služby fungují po světě a rozhodli jsme se založit neziskovku, šla jsem do neznáma z dobře placené práce, ale chtěla jsem dělat, co mě baví." Co pomáhá zvládat práci s lidmi na konci životní cesty? Jak náročné je zvládat práci s paliativními pacienty v mladém nebo dětském věku? Jaká je zpětná vazba od klientů a klientek i jejich rodin? Moderuje Renata Kalenská.'
