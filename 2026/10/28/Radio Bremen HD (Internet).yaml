  subtitle: Ein deutsch-dänischer Sonderfall
  description: 'Als Sarah Brodersen noch ein Kind war, schaute sie bereits auf das Haus gegenüber. Doch als sie in den 1990er-Jahren bei der damaligen Bewohnerin Eis kaufen wollte, musste sie ein Hindernis überwinden: die Landesgrenze. Das Haus stand damals wie heute in Dänemark. Nun stand das Haus zum Verkauf. Als Deutsche hätte Sarah es nicht kaufen dürfen. Aber ihr Mann Poul, ein Däne, war sofort interessiert und damit ging die Arbeit los.'
