  title: 'Die Nordreportage: Tränen, Schweiß und Zwiebeln'
  subtitle: Ernte zwischen Rekord und Risiko
  description: 'Zwiebelernte in Niedersachsen: Für Landwirte und Lohnunternehmer zählt jetzt jeder Tag, an dem es trocken ist. Denn 2026 wachsen in Niedersachsen so viel Zwiebeln wie nie zuvor. Gleichzeitig haben Hitze und Trockenheit das Wachstum vieler Knollen gebremst. Ende September werden die Knollen aus dem Boden geholt, in Reihen auf dem Acker getrocknet und dann eingelagert. Für Landwirte und Lohnunternehmer ist das ein Wettlauf gegen das Wetter.'
