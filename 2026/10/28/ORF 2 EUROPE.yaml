  title: Autofocus
  subtitle: Auto und Identität
  description: Das Auto ist mehr als ein praktischer Gebrauchsgegenstand. Beim Kauf eines Neuwagens, gilt es häufig Platz, Preis und Nutzen, sowie Design, Emotion und persönliche Vorlieben abzuwägen. Oft ist bereits der erste Eindruck darüber entscheidend, ob ein Fahrzeug zum eigenen Lebensstil und Selbstbild passt. Dabei muss Identität nicht immer Auffälligkeit bedeuten. Auch Funktionalität, Zurückhaltung oder bewusste Abgrenzung können Teil einer Entscheidung sein. So bleibt der Autokauf ein Zusammenspiel aus Vernunft und Gefühl!
