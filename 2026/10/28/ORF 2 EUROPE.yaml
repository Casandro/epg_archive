  title: Tatort
  subtitle: Elvis lebt
  description: |-
    (Fernsehkrimi, AUT 2001)
    Die frischgebackene Polizeioffizierin Stefanie Gschnitzer übernimmt ihren ersten Fall bei der Innsbrucker Mordkommission: Richard Stecher, das Mitglied einer notorischen Wildererfamilie, wurde am Fuß einer Felswand tot aufgefunden. Erschossen, allem Anschein nach aus Notwehr, und zwar vom Jagdpächter und Bürgermeister Hopfgartner und seinem Aufseher Buchberger. Bereits am Tatort kommen der Polizistin die ersten Zweifel. Moritz Eisner kommt der jungen Kollegin zu Hilfe, die versucht, eine sich anbahnende blutige Fehde zwischen den Stechers und den Jägern des Dorfes unter Kontrolle zu halten. Aufgrund der heiklen Situation beschließt Moritz Eisner, die Untersuchungen sehr behutsam anzugehen und ermittelt undercover: Getarnt als Jagdgast mischt er sich unter die Jäger.
    Mit Harald Krassnitzer (Moritz Eisner), Roswitha Szyszkowitz (Stefanie Gschnitzer), Gundula Rapsch (Renata Lang), Gregor Bloéb (Erwin Stecher), Guntram Brattia (Hannes Stecher), Hannes Spiss (Richard Stecher), Peter Mitterrutzner (Simon Stecher), Brigitte Jaufenthaler (Gerlinde Stecher), David Kofler (Georg Stecher), Fini Bloéb (Maria Stecher) u.a.
    Buch: Felix Mitterer
    Regie: Peter Sämann
    89.11
