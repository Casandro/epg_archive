  title: WELTjournal
  genre:
  - '129'
  subtitle: Mein Leben unter Trump
  description: In den USA herrscht Hochspannung vor den Midterms, den Zwischenwahlen Anfang November. Präsident Trump und seine Republikaner könnten ihre Mehrheit im Kongress verlieren. Das WELTjournal zeigt das ebenso persönliche wie politische Filmtagebuch der Journalistin Marine Pradel, die hautnah erlebt, wie sich der Alltag der Menschen in den USA unter Trump verändert hat. Marine Pradel ist akkreditierte Korrespondentin im Weißen Haus und wohnt in einem multikulturellen Viertel in Washington, das zuletzt zu über 90% demokratisch gewählt hat. In ihrer Nachbarschaft leben zahlreiche Beamte im öffentlichen Dienst, die durch Trumps Kürzungspolitik ihren Job verlieren, und viele lateinamerikanische Einwanderer, die schockiert sind über die brutale Vorgangsweise und die Abschienbungen der Einwanderungsbehörde ICE. Pradel filmt aber auch alle möglichen Formen des Widerstands von Bürgern, die für ihre Demokratie kämpfen.
- eventId:
  - 629057
  - 978473
  start: 2026-10-28T22:25:00Z
  stop: 2026-10-28T23:15:00Z
  title: WELTjournal +
  genre:
  - '129'
  subtitle: Kalifornien - Bastion gegen Trump
  description: "Kalifornien ist der bevölkerungsreichste und wirtschaftlich erflogreichste US-Bundesstaat, gilt als liberal, vielfältig und weltoffen - und sieht sich als Bastion gegen die autoritäre Politik von US-Präsident Trump. \nDas WELTjournal + zeigt, wie sich der Konflikt zwischen der Trump-Regierung und Kalifornien im Sommer 2025 dramatisch zuspitzt. Als es zu Protesten gegen das brutale Vorgehen der Einwanderungsbehörde ICE kommt, entsendet Trump das Militär nach Los Angeles - ein Tabu-Bruch. Unter dem demokratischen Gouverneur Gavin Newsom setzt sich Kalifornien zur Wehr. Der Konflikt wird vor Gericht ebenso ausgetragen wie in der Einwanderungspolitik, an Universitäten und im Bildungswesen."
