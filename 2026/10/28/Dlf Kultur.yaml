    Psychologie der Entfesselungskunst
    ?Du kannst Dich aus jeder Zwangslage befreien? - Harry Houdini und der Beginn der Selbstoptimierung
    Von Dagmar Just

    Auf den ersten Blick waren die Shows des Entfesselungskünstlers Harry Houdini vor allem spektakulär. Sieht man genauer hin, stellt man fest: sie waren immer auch Kommentare zu politischen Debatten seiner Zeit - von Spiritismus über U-Bahn-Bau bis hin zu Folterpraktiken. Aber: mit Happy End. Wenn man nur will.
