  description: "Open Space\nModeration: Martin Risel\n\n?Only love can conquer hate? - lange Nacht mit einer Lichtgestalt: RYUICHI SAKAMOTO\n\nMit der Ausstellung ?Seeing Sound, Hearing Time? werden in Berlin gerade erstmals in Europa Kunstwerke des japanischen Ausnahme-Musikers und Komponisten gezeigt. Martin Risel nimmt diese außergewöhnliche Schau mit ihren eindrücklichen Klanginstallationen zum Anlass, das umfangreiche musikalische Werk von Ryuichi Sakamoto in seinen vielen Facetten zum Klingen zu bringen. Die vier Stunden lange Nachtsendung ist dazu in vier Kapitel unterteilt:\n\nOUVERTÜRE \nDie Einführung in sein Werk erfolgt vom Pophit ?Risky? mit Iggy Pop über die wohl prominenteste Komposition ?Merry Christmas, Mr. Lawrence? - und von der ganz aktuellen Veröffentlichung ?Conversations? zu Sakamotos Anfängen als Technopionier und mit dem Yellow Magic Orchestra.\n\nREQUIEM\nÄhnlich wie David Bowie hat Ryuichi Sakamoto seinen Tod lange vorausgeahnt und musikalisch bebildert. Von frühen Andeutungen bis zu späten Aufnahmen mit letzter Lebenskraft gibt es berührende musikalische Zeugnisse. Vor allem die Alben ?Async?, ?Opus? und ?12? ..."
