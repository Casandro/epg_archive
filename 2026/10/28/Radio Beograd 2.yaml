  title: Vreme muzike
  subtitle: Uživo vođena autorska emisija klasične muzike vibrira u skladu s aktuelnostima, prati odjeke naših najznačajnijih manifestacija, beleži najznačajnije muzičke događaje u svetu, donosi intervjue sa.
  description: '"Sve što sviram jeste odraz mog bića", izjavio je jednom prilikom čuveni ruski pijanista Arkadij Volodos. Taj pedesettrogodišnji umetnik je od svojih prvih koncerata i diskografskih izdanja hvaljen kao izraziti viruoz, dok su ga mediji poredili sa pijanistima poput Horovica ili Lista. On, međutim, odbacuje tu vrstu etiketiranja i insistira na tome da je prava virtuoznost u tišini, boji i izražavanju emocija, a ne u brzini ili tehničkoj moći. Prepoznaju to i kritičari koji ističu njegovu poetičnost i individualnost, i interpretacije koje plene sofisticiranošću, punoćom boja i ekspresije.'
