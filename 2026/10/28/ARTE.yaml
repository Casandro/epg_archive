  title: Nomade des mers, les escales de l'innovation
  subtitle: Taïwan S02 E05. A Singapour, cité-Etat qui importe 90 % de sa nourriture, Corentin et Coline découvrent des agriculteurs urbains soucieux de tendre vers l'autosuffisance.
  genre:
  - '146'
  description: 'L''ingénieur Corentin de Chatelperron et ses compagnons embarquent à bord du "Nomade des mers" pour la deuxième partie de leur tour du monde qui les mène de l''Asie à la côte Ouest des États-Unis. Chaque escale est l''occasion de rencontres inspirantes avec des inventeurs (étudiants, entrepreneurs, bricoleurs, scientifiques...) qui déploient des low-tech ingénieuses, porteuses d''autonomie et de développement. Aujourd''hui : à Taïwan, le paradis de la high-tech, Corentin, se demande comment créer un ordinateur à l''aide de composants de récupération. Réalisateur: Vincent Lefebvre (2021)'
