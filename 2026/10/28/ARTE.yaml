  title: Trois femmes reporters au coeur de la guerre
  subtitle: Une chronique de la Seconde Guerre mondiale à travers le regard et les mots de trois reporters américaines, qui accompagnèrent la progression des troupes alliées en Europe.
  ageRating: 12
  genre:
  - '32'
  description: 'En 1940, Lee Miller (1907-1977), ancienne mannequin devenue photographe au contact des surréalistes parisiens, est à Londres, où elle capture le quotidien sous le Blitz pour le magazine Vogue. Après le choc de l''attaque japonaise de Pearl Harbor, le 7 décembre 1941, et l''entrée en guerre des États-Unis, Margaret Bourke-White (1904-1971), reporter pour Life, est accréditée auprès de l''US Air Force. Début 1943, elle participe aux raids aériens sur l''Afrique du Nord, avant de couvrir la campagne d''Italie, au plus près des combats au sol. Correspondante pour l''hebdomadaire Collier''s Weekly, sa consoeur Martha Gellhorn (1908-1998), épouse d''Ernest Hemingway et amie de la première dame Eleanor Roosevelt, est envoyée dans les Caraïbes, puis en Europe. Privée de son accréditation au printemps 1944 - au profit de son mari, dont elle divorcera l''année suivante -, elle parvient néanmoins à retraverser l''Atlantique pour assister au débarquement en Normandie, également immortalisé par Lee Miller. Entre la France et l''Italie, toutes trois vont accompagner la progression des troupes alliées jusqu''en Allemagne, où elles documenteront la prise des grandes villes - dont Munich, où Lee Miller se fait photographier dans la baignoire de Hitler -, la rencontre entre soldats américains et soviétiques, et la libération des camps de Dachau et Buchenwald, révélant au monde l''horreur des crimes nazis. Réalisateur: Luzia Schmid. Des acteurs: Margaret Bourke-White, Martha Gellhorn, Lee Miller (2022)'
