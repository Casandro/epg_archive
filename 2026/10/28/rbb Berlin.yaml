  description: Willers, wegen seiner Eskapaden unlieb aufgefallen, bekommt einen Beifahrer zugeteilt. Jörg benimmt sich von Anfang an recht merkwürdig. So verkauft er, um Geld für Benzin aufzutreiben, heimlich die Lichtmaschine im Austausch gegen eine alte. Eine Kette von Komplikationen ist die Folge. Schließlich, nach einem Unfall, ist es Willers, der den ganzen Motor seines neuen Lastwagens verkauft. Aber auch der eingetauschte Motor versagt, und der Truck steckt endgültig fest. Nachts brennt plötzlich das ganze Fahrzeug, und jeder Löschversuch kommt zu spät.
