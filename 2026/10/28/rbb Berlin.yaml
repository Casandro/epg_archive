  description: In Deutschland leben noch ungefähr 20.000 Gämsen, die meisten davon in Bayern. Als Symboltiere einer intakten Natur gehören sie zum festen Repertoire der Gebirgswelt. Im Sommer leben sie oberhalb der Waldgrenze, im Winter kommen sie in tiefere Talregionen. In den Wäldern verbeißen sie dann Triebe vom Jungwuchs der nachwachsenden Bäume. Viele bayerische Förster fordern daher einen wesentlich stärkeren Abschuss der Gams als bisher. Jäger und Naturschützer dagegen befürchten, dass die Gams in manchen Alpenregionen ausgerottet werden könnte.
