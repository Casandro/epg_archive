  audiodesc: true
  description: Gut 600 Kilometer fließt die Donau durch Deutschland - von der Quelle im Schwarzwald bis zur Grenze unterhalb von Passau. Sie ist zerstückelt in eine Kette von Stauseen. Der Fluss als Verkehrsweg, Kraftwerkskühler und Stromlieferant mit meist verheerenden Auswirkungen. Wenn von der Donau die Rede ist, denken wir auch an Jahrhunderthochwasser, geborstene Dämme, verzweifelte Menschen, meterhohe Fluten, die alles mit sich rissen und Existenzen vernichtet haben. Viel wurde über Hintergründe und Ursachen diskutiert. Betroffene kamen zu Wort, Politiker, Experten. Dieser Film möchte dem Fluss selbst eine Stimme geben.
