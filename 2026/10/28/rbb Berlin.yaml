  title: Songs of Gastarbeiter
  subtitle: Liebe, D-Mark und Tod - Film von Cem Kaya
  episodeUri: crid://onid-8468/e/6aad1d4e95b51568a372933a
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Die Dokumentation erzählt die Geschichte der einzigartigen Musik türkischer Gastarbeiter und ihrer Enkelkinder in Deutschland. Diese musikalische Kultur, die es in ihrer besonderen Form nur in Deutschland gibt, ist ein kulturelles Erbe der Bundesrepublik. Cem Kayas Dokumentation entdeckt diese musikalische Subkultur neu und eröffnet somit neue Perspektiven auf gesellschaftspolitisch relevante Themen wie Heimat, Identität und Partizipation.
