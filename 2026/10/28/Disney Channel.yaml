  title: Scrubs - Die Anfänger
  subtitle: Mein Einhorn Comedy-Serie, USA 2004
  description: Folge 79, Den neuesten Patienten des Sacred Heart hat schnell die ganze Belegschaft ins Herz geschlossen, denn Gregory Marx versteht es, jedem schnell ein Lächeln aufs Gesicht zu zaubern. Doch dem alten Herrn läuft die Zeit davon; er braucht schnellstens eine Niere! Um einen geeigneten Spender zu finden, übertritt J.D. seine Kompetenzen und macht sich auf eigene Faust auf die Suche nach einem geeigneten Spender - und stolpert dabei über Herrn Marx' verlorenen Sohn.
