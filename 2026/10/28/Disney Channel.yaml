  title: Scrubs - Die Anfänger
  subtitle: Mein Spiel mit dem Feuer Comedy-Serie, USA 2004
  description: Folge 77, Neena, die Tochter von J.D.s neuem Patienten, ist ausgerechnet eine gefürchtete, auf Kunstfehler spezialisierte Anwältin. Natürlich bekommt J.D. das große Nervenflattern, da er garantiert auf der Anklagebank landen wird, wenn Neenas Vater nur das Geringste passiert. Aber Neena beginnt mit ihm zu flirten - um ihn bereits vor der Operation unter ihre Kontrolle zu bekommen. Damit erreicht sie allerdings nur, dass je näher der OP-Termin rückt, J.D. umso nervöser wird.
  widescreen: true
- eventId: 702951
