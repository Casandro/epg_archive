  title: Maman & Ich
  subtitle: Jugend-Serie, F 2014
  description: '(a) Das Geschirr: Isa wendet einen Trick an, um Barbara dazu zu bringen, die Geschirrspülmaschine auszuräumen. (b) Privatverkauf: Bei einem exklusiven Privatverkauf von Markenklamotten halten Barbara und Isa einen wartenden Kunden für einen Türsteher, vor dem sich Isa ziemlich blamiert. (c) Lieferservice: Laurent ruft an, weil die Lebensmittelbestellungen, die Isa und Barbara angeblich nie bekommen haben, alle zu ihm geliefert wurden. (d) Die neue Frisur: Barbara versucht alles, um Gaëls Aufmerksamkeit auf ihre neue Frisur zu lenken und flippt aus, weil er nichts bemerkt.'
  widescreen: true
