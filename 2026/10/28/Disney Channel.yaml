  title: Scrubs - Die Anfänger
  subtitle: Meine Hexe Comedy-Serie, USA 2004
  description: 'Folge 78, J.D.s neue Freundin kostet ihm noch den letzten Nerv. Nicht nur, dass Neena ihn nur verächtlich als willenlosen Lustknaben behandelt! Sie vertritt auch einen Hypochonder, der Turk wegen eines angeblichen Kunstfehlers verklagen will. Endlich ringt J.D. sich dazu durch, sich von ihr zu trennen. Allerdings schafft er dies nicht alleine. Er braucht Hilfe, und es gibt nur einen Menschen, der es wagt, Neena die Stirn zu bieten: Dr. Cox'' dämonische Gemahlin Jordan.'
