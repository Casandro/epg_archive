  title: Best Of - Die Clipshow mit Imke & Senad
  subtitle: Episode 11
  description: 'Senad und Imke empfangen Fitness-Creator und YouTuber Sascha Huber im Studio. Im Mittelpunkt steht sein Werdegang: Sascha erzählt, wie alles auf YouTube begann - von den ersten holprigen Videos bis zu jenem Moment, der zur Weichenstellung wurde. Die ersten 70 Euro, die er mit seinen Videos verdiente, waren für ihn kein Nebenverdienst, sondern der Beweis, dass sein Weg funktioniert - und der Auslöser, alle anderen Berufspläne endgültig aufzugeben. Außerdem berichtet er von seiner Red Bull Secret Workout Tour, bei der er mit ausgewählten Fans an vier geheimen Orten trainierte: tief unter der Erde in den Salzwelten, hoch am Berg auf über 3.000 Metern, auf einer Burg und mitten auf dem See. Dazu wie gewohnt: die besten Clips aus der Welt von Red Bull und eine humorvolle Studio-Challenge. Doch welche Zweifel musste Sascha auf dem Weg zu Millionen Followern überwinden?Österreich 2027'
