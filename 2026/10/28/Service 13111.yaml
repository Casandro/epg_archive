  title: Hotels zum Staunen - Ein Blick hinter die Kulissen
  subtitle: Marina Bay Sands, Singapur (1/6)
  description: "Der britische Restaurantkritiker Giles Cohen und die neuseeländische Köchin Monica Galetti begleiten einige der 9.500 Mitarbeiter eines der weltweit größten Hotels: das Marina Bay Sands in Singapur. Dieser epische Hotelkomplex bewirtet circa eine Million Gäste im Jahr. Das Marina Bay Sands ist ein ikonisches Gebäude, dessen Bau fast 4 Milliarden Euro gekostet hat und der von der Regierung errichtet wurde, um die Anzahl der Touristen in Singapur innerhalb von 10 Jahren zu vervierfachen. \n\nDas Juwel des Hotels ist das längste, in luftiger Höhe gebaute Schwimmbecken der Welt, das über eine verdeckte Wasserkante verfügt und somit den Eindruck erweckt, dass das Wasser im Nichts oder in der Endlosigkeit verschwindet. Das Becken selbst ist so groß wie drei olympische Schwimmbecken. Giles und Monica übernehmen die Aufgaben eines Bademeisters und entdecken dabei, wie die Marathonaufgabe gemeistert wird, täglich 10.000 Handtücher zu waschen. \n\nEin weiterer erstaunlicher Ort ist der hochtechnologische Shop für Uniformen, der für die Angestellten 160.000 Uniformen mit 600 unterschiedlichen Designs bereithält. Giles wird unter dem wachsamen Auge des Ex-Offiziers eines Sondereinsatzkommandos zum Butler ausgebildet, während Monica dem 600 Angestellte umfassenden Cateringpersonal beitritt, das 60 Restaurants am Laufen hält. \n\nDoch für eines bleibt stets Zeit: Mit dem Personal des Hotels auch im Privaten Zeit zu verbringen und dabei inspirierende, herzerwärmende Geschichten über ihr Leben abseits des Hotels zu erfahren.\nDokumentarfilm, Vereinigtes Königreich 2017, R: Max Shapira, Chris Alcock"
  genre:
  - '144'
  widescreen: true
- eventId: 971450
  start: 2026-10-28T08:15:00Z
  stop: 2026-10-28T09:05:00Z
