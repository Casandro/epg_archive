  title: Tod in den Bergen
  description: "Ein Mord setzt das idyllische Bergdorf Kalltach in Aufruhr. In dem Touristenort in den österreichischen Alpen arbeitet die junge Ärztin Clara Lang (Ursula Strauss). Bei einer Bergtour mit ihrem Freund, dem Journalisten David Tanner, stößt sie auf eine mumifizierte Leiche. Während die Polizei nach dem Täter ermittelt, beginnt auch David für die Lokalzeitung zu recherchieren. Kurz darauf wird der Reporter tot aufgefunden. Dessen Vater Jan (Robert Atzorn) glaubt nicht an einen Unfall. Er ist überzeugt davon, dass sein Sohn ermordet wurde. Jan, ebenfalls Journalist, kommt aus Berlin angereist und entdeckt wie sein Sohn David einen Umweltskandal. In dem stillgelegten Bergwerk von Kalltach wird unwissentlich radioaktiver Müll gelagert. Die Erlaubnis dazu erteilte damals der Bürgermeister. Auch Claras Vater könnte in kriminelle Machenschaften verstrickt sein. Zudem geht die Polizei seltsam passiv bei den Nachforschungen vor. Clara und Jan müssen auf eigene Faust Täter und Hintermänner stellen. \n\nEin aufregender Mix aus Kriminalfilm, Wirtschaftskrimi und Familiendrama, so urteilten Kritiker und Presse über den Alpen-Thriller \"Tod in den Bergen\". Die spannende Handlung wurde temporeich in Szene gesetzt von Nils Willbrandt (bekannt durch seine Ferdinand von Schirach-Verfilmungen). Der Regisseur lässt allerdings auch Raum für tiefer gehende Charakterstudien. Insbesondere Ursula Strauss in ihrer Rolle als kämpferische Clara Lang beweist, dass sie zu den besten Schauspielerinnen im deutschsprachigen Raum gehört. Ebenso bravourös Robert Atzorn (TV-Serien \"Unser Lehrer Doktor Specht\", \"Tatort\"). Gedreht wurde am Großglockner, im Salzbergwerk von Hallein und am Gollinger Wasserfall.\nThriller, Deutschland 2013, R: Nils Willbrandt"
  widescreen: true
