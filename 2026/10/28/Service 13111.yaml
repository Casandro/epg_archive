  title: Mama ist die Best(i)e
  subtitle: Episode 1
  description: "Vor zehn Jahren wanderte die verwöhnte und realitätsfremde High Society-Lady Gloria Almeda (Adele Neuhauser) ins Gefängnis. Es hieß, sie habe einen Killer beauftragt, ihren Gatten Victor (Bernhard Schir) zu ermorden. Niemand glaubte an ihre Unschuld. Im Gefängnis wurde aus der rosa Lebedame die schwarze Witwe Gloria. Gloria lernte zu überleben, sich zu behaupten und aufzusteigen. Vielleicht auch, weil ein einziger Gedanke sie am Leben hielt: Rache! Und sie hatte viel Zeit darüber nachzudenken, wer ihren Mann tatsächlich ermordet hat. Mit einer Fußfessel ist sie nun nach vorzeitiger Entlassung an die noble Familienvilla gebunden. Sowohl ihre Kinder (Fanny Krausz, Manuel Rubey) als auch ihr restliches, durchtriebenes Umfeld (Elena Uhlig, Roland Koch, Andreas Lust) glauben noch immer, dass Gloria einfältig und naiv ist und sie ihr weiterhin Lügengeschichten auftischen können. Gloria lässt die Sippe vorerst in dem Glauben, doch nach und nach setzt sie ihren Racheplan in die Tat um - und sie wird erst ruhen, wenn sie den wahren Mörder ihres Mannes gefunden hat. Koste es, was es wolle. \n\nNach einem Drehbuch von Erfolgsautor Uli Brée (\"Vorstadtweiber\") inszenierte Regisseurin Ute Wieland mit \"Mama ist die Best(i)e\" eine bitterböse Krimikomödie, die durch große Bilder und einen deutsch/österreichischen Star-Cast zu überzeugen weiß. Neben Adele Neuhauser in der Hauptrolle versammelt sich das Who ist Who der heimischen Film- und TV-Landschaft vor der Kamera: Manuel Rubey, Fanny Krausz, Bernhard Schir, Elena Uhlig, Roland Koch, Andreas Lust, Michou Friesz, Aglaia Szyszkowitz, Miriam Fussenegger, Edita Malovcic und Stefanie Stappenbeck - sie alle verwandeln den Krimi-Zweiteiler mit großer Spielfreude in ein packendes TV-Event.\nKrimi, Österreich 2025, R: Ute Wieland"
  widescreen: true
