  title: TM Wissen
  subtitle: Dehnen - Wundermittel oder Zeitverschwendung? - Ein Sportmythos auf dem Prüfstand
  description: Kaum ein Thema polarisiert im Sport so stark wie das Dehnen. Einige schwören darauf, andere halten es für reine Zeitverschwendung - und jeder macht es anders. TM Wissen-Reporter Philipp McAllister hat den Selbstversuch gewagt und sich von einem führenden Experte erklären lassen, was wirklich hinter dem Dehn-Mythos steckt // Rund 20.000 Menschen in Österreich haben kein Dach über dem Kopf - die Hälfte davon lebt in Wien. Viele meiden Notschlafstellen, weil sie sich dort nicht sicher fühlen. Ein Designer aus den Niederlanden bietet ihnen mit seiner Erfindung, dem "Sheltersuit", nun Schutz und Wärme // Das Wiener Schnitzel - Symbol für Genuss, Handwerk und Heimat. Doch wer Ketchup oder Preiselbeeren dazu bestellt, begeht mancherorts schon fast ein Sakrileg. Denn hinter der goldenen Panier steckt eine stolze Tradition, die weit über den Teller hinausreicht // Handgemachtes, feinstes Porzellan - einst Symbol für Eleganz und Ewigkeit, heute oft nur Zierde hinter Glas, zu schade für den Alltag. Jedes Stück erzählt von meisterlicher Handarbeit und jahrhundertealter Geschichte. Besonders eindrucksvoll zeigt sich das in der ehemaligen kaiserlichen Porzellan-Manufaktur in Wien.Österreich 2025
