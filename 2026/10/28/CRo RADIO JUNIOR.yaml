  title: Hajaja
  description: Báchrobky 3/7 - Ina a Angelína. Báchrobky to jsou báchorky a povídačky ze hřbitovů a z popravišť. A taky první dušičkový Hajaja! Poslechněte si příběhy z tajuplných míst, na která vás zavede havran Krasomil. Potkáte tu první katyni, neposednou bludičku nebo příliš roztomilé strašidlo? Možná se chvílemi budete trochu bát, ale uvidíte, že všechny příběhy nakonec dobře dopadnou. Tak žádný strach! Sedm strašidelných pohádek napsal Lukáš Csicsely, dramaturgie Renata Venclová. Natočeno v roce 2023. Režie Bela Schenková. Vypráví Vasil Fridrich.
