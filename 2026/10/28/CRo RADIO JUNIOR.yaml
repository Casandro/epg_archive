  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Michaela Hráská a Alena Tadialová, herečky Divadla Malenka. Mladé divadlo Malenka je divadlem maminky a Alenky, aneb dvě herečky, které zároveň pojí rodinné pouto, založily divadlo a teď vám ho přicházejí na Junior představit. Řeč bude ale i o jejich začátcích v Dismanově rozhlasovém dětském souboru a plánech do budoucna. Moderuje Denisa Kimlová.
