  title: Hitlers Wunderwaffen
  subtitle: Hitlers Wunderwaffen
  description: Ein Einblick in die geheimen, fortschrittlichen Technologien und Waffensysteme, die das NS-Regime während des Zweiten Weltkriegs entwickelte. Dazu gehören Raketen wie die V2, Düsenflugzeuge und innovative Panzer. Die Doku untersucht die technischen Fortschritte und deren Einfluss auf den Kriegsverlauf sowie die moralischen und ethischen Fragen, die durch den Einsatz solcher Waffen aufgeworfen wurden. Trotz ihrer Fortschrittlichkeit konnten diese Waffen den Krieg nicht entscheiden.
