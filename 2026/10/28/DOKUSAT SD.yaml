  title: Helden der Evolution - Elefanten
  description: Elefanten sind die größten Landtiere der Erde. Die afrikanische Unterart kann bis zu vier Meter hoch werden und dabei ein Gewicht von ca. 7,5 Tonnen auf die Waage bringen. "Helden der Evolution" begibt sich auf die Spuren dieser beeindruckenden Dickhäuter. Die Kamera begleitet Steppenelefanten durch die Savannen Afrikas und folgt ihren Verwandten in den asiatischen Dschungel. Auf diese Weise lernen die Zuschauer die Tiere genauer kennen und werden Zeuge ihrer sprichwörtlichen Gedächtnisleistungen.
