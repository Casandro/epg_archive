  title: Helden der Evolution - Nilpferde & Nashörner
  description: Nilpferde und Nashörner zählen zu den größten und schwersten Landtieren, die es gibt. Früher wurden beide Arten gemeinsam mit den Elefanten unter dem Begriff "Dickhäuter" zusammengefasst - heute faszinieren sie ihre menschlichen Beobachter nicht zuletzt durch ihre offensichtlichen Unterschiede. In der afrikanischen Wildnis leben sie oft in unmittelbarer Nachbarschaft. "Helden der Evolution" zeigt Nilpferde und Nashörner in ihrer natürlichen Umgebung und widmet ihnen eine spannende Charakterstudie.
