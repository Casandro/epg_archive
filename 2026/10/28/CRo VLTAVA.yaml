  title: Vizitka
  description: Rostislav Korytčánek, teoretik architektury. Jako historik a teoretik architektury je jedním z odborníků, kteří se spolupodíleli na podcastu Vltavy Betonový lidi o československých sídlištích. Specifikem naší výstavby podle něj bylo, že se odvíjela od diskurzu meziválečné avantgardy. Ve Vizitce taky mluví o technických parametrech. "Kvalita konstrukčních systémů, které se uplatňovaly na stavbu sídlišť v bývalé NDR nebo i v Polsku, byla mnohem míň kvalitní než to, co se realizovalo v Československu." V čem bylo stavění panelákových sídlišť největším experimentem? A přinášejí současné developerské projekty kvalitnější bydlení? Zkraje října se Rostislava Koryčánka ptal Ondřej Cihlář. Repríza z 2. 10. 2026
