  title: 'Tomáš Garrigue Masaryk: Můj Havlíček'
  description: Od smrti Karla Havlíčka Borovského letos uplynulo sto sedmdesát let. Před sto třiceti lety napsal Tomáš Garrigue Masaryk knihu s názvem Karel Havlíček. Snahy a tužby politického probuzení. Co Havlíčka s Masarykem spojovalo? V čem byl Havlíček Masarykovi vzorem? Jak TGM navázal na Havlíčkovo úsilí? Nad těmito i dalšími otázkami se v hodinovém Vltavském speciálu zamýšlejí historik Petr Pithart s publicistou Pavlem Kosatíkem. Relaci připravili a scénář napsali Milan Dus a Pavel Krejčí v roce 2021 (v době druhého volebního období prezidenta Miloše Zemana). (59 min).
