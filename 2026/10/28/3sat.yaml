  title: 'Weltstädte: London'
  subtitle: Mit Leon Windscheid
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Europas Kampf um Rohstoffe - Seltene Erden und kritische Rohstoffe sind Schlüsselressourcen für Energiewende, Digitalisierung und Verteidigung. Der Markt wird bislang von China dominiert, wodurch Europa in eine starke Abhängigkeit geraten ist. Mit dem "Critical Raw Materials Act" will die EU gegensteuern. Ob der Weg zu mehr Unabhängigkeit gelingt, bleibt jedoch offen.

    Biodiversität sichert unser Überleben - Jede achte Art ist vom Aussterben bedroht. Warum das Verschwinden einzelner Arten zum Kollaps ganzer Ökosysteme führen kann, zeigt die Suche von Ingolf Baur nach einem der letzten zehn Brutpaare des eurasischen Graukranichs in Armenien.

    Problematische Tierzucht - Die Idee, ausgestorbene Tiere zurückzubringen, fasziniert seit Jahrzehnten. Bereits in den 1920er-Jahren versuchten Forscher, den Auerochsen durch Nachzüchtungen wieder entstehen zu lassen. Daraus gingen die sogenannten Heck-Rinder hervor, von denen heute rund 3.000 Tiere existieren. Über Sinn, Nutzen und historische Hintergründe dieser Zucht wird bis heute kontrovers diskutiert.

    Moderation: Eric Mayer
    HD-Produktion
