  description: "14:00\nSWR Kultur Das Wissen\n\"Neue Bäume fürs Stadtklima - wie die Kommunen auf den Engpass reagieren\"\nVerbesserte Pflanzmethoden, neue Arten und Bäume in mobilen Containern sollen für mehr Stadtgrün sorgen. Und weil der Nachschub aus Baumschulen stockt, nehmen erste Städte die Pflanzenaufzucht selbst in die Hand.\nVon Richard Fuchs (SWR 2026) \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n14:30 \nARD Klima Update \n\"Das Weltrekord-Windrad - Chancen und Risiken\"\nEin Windrad, so hoch wie ein Wolkenkratzer: In der Lausitz soll ab November die höchste Windkraftanlage der Welt in Betrieb gehen. Sie steht bereits, ist 365 Meter hoch und weithin sichtbar. Die Anlage soll stärkere Höhenwinde nutzen und deutlich mehr Strom liefern als herkömmliche Windräder. Sie könnte perspektivisch bis zu 7.500 Haushalte mit Strom versorgen. Lohnt sich der enorme Aufwand? Wir schauen auf Chancen und Risiken dieses Projekts im brandenburgischen Schipkau. Die MDR-Reporterin Inka Zimmermann erklärt, wie die Menschen vor Ort auf das Windrad schauen und warum so eine Anlage verlässlicher Strom liefern kann, als herkömmliche Windräder. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/"
