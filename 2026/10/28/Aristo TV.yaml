  title: ANIXE auf Reisen - Interlaken 2 mit Richy Müller
  description: 'In der zweiten Folge mit Richy Müller in Interlaken geht es traditionsbewusst weiter: In Spiez besucht der Schauspieler einen Weinberg und verkostet später auch den dort erzeugten Rebensaft. Auf dem Spiezer Weinfest erlebt Richy, wie dort die Weinlese gefeiert wird. Ganz in der Nähe spaziert der Schauspieler durch die Altstadt von Thun und besucht das Schloss Schadau. Auch diverse Outdoor-Aktivitäten warten auf Richy Müller. Auf dem Oberberghorn genießt er ein atemberaubendes Panorama, welches genauso spektakulär ist wie der darauffolgende Gleitschirmflug zurück ins Tal von Interlaken. Beim River Rafting wird es noch einmal nass und turbulent. Schließlich geht es mit der Jungfraubahn durch einen über sieben Kilometer langen Tunnel quer durch das Eiger-Massiv hinauf aufs Jungfraujoch, den höchstgelegenen Bahnhof Europas. Allein die Baugeschichte dieser Bahnstrecke ist ein Musterstück Schweizer Ingenieurskunst. Highlights im ewigen Eis sind schließlich der Eispalast im Jungfraufirn und eine Wanderung über den Aletschgletscher, den größten Gletscher der Alpen.'
  widescreen: true
