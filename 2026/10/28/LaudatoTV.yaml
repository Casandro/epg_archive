  title: Živjeti kršćanski, Living the Christian Way
  description: "Dokumentarna serija u kojoj o. Jeffrey Kirby i Kathy Schmugge ispituju goruća pitanja današnjice kroz perspektivu katoličke vjere. Katolički svećenik i župnik župe Naše Gospe od Milosti u Južnoj Karolini, o. Kirby je nacionalni govornik s doktoratom iz moralne teologije i dubokim žarom za Gospodina. Kreator je digitalnog sadržaja i voditelj vrlo hvaljene dnevne molitve dostupne online. Kathy Shmugge je voditeljica obiteljske zajednice u biskupiji u Charlestonu i članica katoličke udruge medicinskih djelatnika. \nU sekulariziranom svijetu teško je znati što je ispravno, a što pogrešno. O. Jeffrey Kirby i Kathy Schmugge tumače teme koje izazivaju kontroverze u društvu. Istražuju jedinstvene uloge muškaraca i žena u Crkvi dok raspravljaju o dvije polarizirajuće teme - muškom svećeništvu i jednakosti spolova kroz perspektivu katoličke vjere. Kako kritička teorija rase dovodi u pitanje naše dugotrajne koncepte pravde i jednakosti, o. Jeffrey i Kathy uključuju se u debatu. LGBTQ+ pokret postaje sve otvoreniji i glasniji, stoga je važno razumjeti ovaj alternativni stil života iz perspektive katoličke vjere. O. Jeffrey i Kathy raspravljaju o posljedicama. Imigracija je škakljiva tema za SAD, zemlju koja se dugo ponosila pružanjem dobrodošlice izbjeglicama iz drugih zemalja. U emisiji se raspravlja o potrebi razboritosti u rješavanju imigrantske krize. Možda nijedan problem nije važniji u današnjem društvu od ciljeva pro-lifea. O. Kirby i Kathy raspravljaju o važnim temama vezanih uz pobačaj i nadmoć kroz perspektivu katoličke vjere."
- eventId: 1011247
  start: 2026-10-28T18:40:00Z
  stop: 2026-10-28T19:10:00Z
  title: Živjeti kršćanski, Living the Christian Way
  description: "Dokumentarna serija u kojoj o. Jeffrey Kirby i Kathy Schmugge ispituju goruća pitanja današnjice kroz perspektivu katoličke vjere. Katolički svećenik i župnik župe Naše Gospe od Milosti u Južnoj Karolini, o. Kirby je nacionalni govornik s doktoratom iz moralne teologije i dubokim žarom za Gospodina. Kreator je digitalnog sadržaja i voditelj vrlo hvaljene dnevne molitve dostupne online. Kathy Shmugge je voditeljica obiteljske zajednice u biskupiji u Charlestonu i članica katoličke udruge medicinskih djelatnika. \nU sekulariziranom svijetu teško je znati što je ispravno, a što pogrešno. O. Jeffrey Kirby i Kathy Schmugge tumače teme koje izazivaju kontroverze u društvu. Istražuju jedinstvene uloge muškaraca i žena u Crkvi dok raspravljaju o dvije polarizirajuće teme - muškom svećeništvu i jednakosti spolova kroz perspektivu katoličke vjere. Kako kritička teorija rase dovodi u pitanje naše dugotrajne koncepte pravde i jednakosti, o. Jeffrey i Kathy uključuju se u debatu. LGBTQ+ pokret postaje sve otvoreniji i glasniji, stoga je važno razumjeti ovaj alternativni stil života iz perspektive katoličke vjere. O. Jeffrey i Kathy raspravljaju o posljedicama. Imigracija je škakljiva tema za SAD, zemlju koja se dugo ponosila pružanjem dobrodošlice izbjeglicama iz drugih zemalja. U emisiji se raspravlja o potrebi razboritosti u rješavanju imigrantske krize. Možda nijedan problem nije važniji u današnjem društvu od ciljeva pro-lifea. O. Kirby i Kathy raspravljaju o važnim temama vezanih uz pobačaj i nadmoć kroz perspektivu katoličke vjere."
