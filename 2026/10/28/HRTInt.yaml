  title: 'Brodovi hranitelji: Posljednji drveni ribari, dokumentarna serija (2008.) (3/5)'
  subtitle: ' '
  description: Kamera nas vodi u najribarskije mjesto na Jadranu - u Kali. S kaljskim ribarima odlazimo u lov na plavu ribu u takozvanu "kaluadu", odnosno, spuštanje mreže. "Kaluada" je i naziv pjesme koja prati cijelu operaciju ribarenja, a koju je uglazbio Kaljanin Slaven Longin. Priča nas vodi i u Privlaku u ribolov s najstarijom poznatom gajetom građenom prije dvjestotinjak godina, te u Istru, na kočarenje pred obalama Umaga.
