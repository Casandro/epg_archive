  title: Priče iz Hrvatske
  subtitle: ' '
  description: Zavirit ćemo u putujuću književnu kuću Zadarske županije, a doznat ćemo i zašto su se strani influenceri zaljubili u sjever Hrvatske. Matematika nije samo školski predmet, nego i alat koji nam pomaže razumjeti svijet oko nas. Oni kojima matematika baš i ne ide na takve tvrdnje obično samo odmahuju rukom. No dobar profesor može učiniti čuda! Tako je brojke zavoljela i naša Branka Suvajac Ljubičić.
