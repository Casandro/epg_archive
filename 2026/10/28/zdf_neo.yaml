    Eine Frau wird tot aufgefunden. Neben ihr auf dem Fußboden steht mit Lippenstift eine Nachricht geschrieben. DI Mooney und sein Team ermitteln und machen eine Entdeckung.

    Eine Person mit einer Teufelsmaske hat die Tat begangen. Es scheint sich um einen Racheakt zu handeln. Der Fall ist kompliziert, da alle Verdächtigen zur Tatzeit ein Alibi nachweisen können. Darunter auch der Ehemann des Opfers: Aaron McCormack.
