    Ein Radfahrer stirbt bei einem Autounfall in den Straßen von Brighton. Er wurde von einem Fahrzeug unter einen Lkw geschleudert; der Unfallverursacher kann unerkannt flüchten.

    Weil im Rucksack des Opfers Drogen entdeckt werden, vermutet Roy Grace zunächst Absicht hinter dem Unfall. Mit seinem Team macht er sich auf die Suche nach dem Täter. Tatsächlich kann das Fahrzeug dank zahlreicher Überwachungskameras ausfindig gemacht werden.
