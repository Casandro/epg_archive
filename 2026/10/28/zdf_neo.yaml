  description: |-
    Großbritannien 2023
    Der bizarre Fall einer Vergewaltigung in einem Brightoner Nobelhotel erinnert Roy Grace an einen Serientäter, der 2012 auf gleiche Weise handelte. Ist es derselbe Täter?

    Pikantes Detail: Grace' verhasster Vorgesetzter hatte kurz zuvor mit dem Opfer Kontakt über einen SMS-Chat und wollte sich mit ihr verabreden, was sie ausschlug. Ist sein Chef womöglich der Serienvergewaltiger, der bereits vor einem Jahrzehnt zuschlug?
