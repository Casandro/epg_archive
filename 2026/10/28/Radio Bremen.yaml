  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In Mecklenburg-Vorpommern tut sich was. Exotische Tier- und Pflanzenarten sind auf dem Vormarsch und verdrängen anscheinend immer mehr die einheimischen Arten. Zu Land, zu Wasser und selbst in der Luft. Landwirt Stefan Puls begibt sich auf Spurensuche. Sein Ziel: Er will wissen, wie gefährlich diese Neubürger wirklich sind. Auf seiner Suche nach Antworten trifft sich Stefan Puls mit Experten. Kann man gegen die exotischen Einwanderer überhaupt noch etwas tun? Und: Wie sehen Deutschlands Wälder, Seen und Felder wohl in 100 Jahren aus?'
