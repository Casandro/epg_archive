  description: 'Der 43-jährige Diskjockey Ben Lenz leidet seit Wochen unter Kopfschmerzen und anhaltendem Schwindelgefühl. Obwohl bei ihm vor Jahren ein Gehirntumor diagnostiziert und entfernt wurde, spielt er die Beschwerden herunter. Erst auf Drängen seiner schwangeren Frau Britta begibt er sich in ärztliche Behandlung, verlässt aber - da er einen Auftritt hat - vorzeitig die Klinik. Auf der Fahrt wird ihm plötzlich schwarz vor Augen. Die Folge: ein schwerer Autounfall. Mit einer Notoperation rettet ihm Brentano das Leben. Er diagnostiziert Epilepsie, Spätfolge einer früheren Tumoroperation.'
