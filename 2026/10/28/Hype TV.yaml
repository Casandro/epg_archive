  subtitle: Magazin
  description: Prime time s Cigijem je dinamična večernja emisija koja donosi tri najaktualnije teme dana, bez uljepšavanja i bez kalkuliranja. Voditelj Neven Ciganović Cigi zajedno s dvoje brutalno direktnih komentatora secira društvene, medijske i showbiz teme koje su obilježile dan. Tri teme, tri potpuno različita pogleda i komentari koji se ne boje reći ono što drugi prešućuju. Od najvažnijih događaja do tema koje pune društvene mreže, "Prime time s Cigijem" donosi stav, argument i provokaciju. Tri aktualne teme. Dva beskompromisna komentatora. Jedan Cigi. Bez rukavica. Bez autocenzure. Bez dosadnih odgovora.
