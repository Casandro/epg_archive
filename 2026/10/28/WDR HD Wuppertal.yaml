  subtitle: Nordgriechenland
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Wandern in den Bergen Nordgriechenlands macht den sechs Abenteurern unheimlich viel Spaß. Die Landschaft ist wunderschön, und Die eindrucksvolle Vikosschlucht produziert tolle Echos. In den Felsen zu navigieren ist nicht so einfach, und so stellt sie Tobis Aufgabe, sich im Steinlabyrinth zu orientieren, vor eine große Herausforderung.
