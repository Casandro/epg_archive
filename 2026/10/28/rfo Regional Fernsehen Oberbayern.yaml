  - 889017
  start: 2026-10-28T02:00:00Z
  stop: 2026-10-28T02:10:00Z
  title: Süd Journal vom 27.10.2026 (Wh.)
  subtitle: Neue Brücke in Rohrdorf - Neubau in nur sechs Wochen +++ Demonstration unter dem Motto nicht auf unserem Rücken +++ Ludwig fordert mehr Beteiligung bei Brenner-Nordzulauf +++ Betrugsmasche mit wertlosen Geldscheinen +++ Fe..
  description: 'Die 90 Jahre alte Brücke über die Rohrdorfer Ache wird seit Mitte September neu gebaut. Nach Staus und bis zu einer Stunde Zeitverlust sollen ab Freitag, 30. Oktober, wieder zwei Spuren je Richtung frei sein. Kosten: rund sechs Mio. Euro. Nach den Herbstferien folgen nachts Restarbeiten. +++ In Rosenheim demonstrierten Menschen unter dem Motto Nicht auf unserem Rücken gegen den Kurs der Bundesregierung. Sie kritisieren Sozialabbau bei gleichzeitig steigenden Militärausgaben und fordern, soziale Sicherheit nicht gegen Aufrüstung auszuspielen. +++ Beim Brenner-Nordzulauf soll die Region Rosenheim stärker mitreden, sagt CSU-Abgeordnete Daniela Ludwig nach Gesprächen im Verkehrsministerium. Zeitdruck sieht sie nicht, der Tunnelanteil sei hoch. Landwirte warnen im Inntal vor Existenzgefahr für 19 Betriebe. Der Bundestagstermin ist offen. +++ Die Polizei Bad Aibling warnt vor Betrug mit fast wertlosen Banknoten: Ein Unbekannter bezahlte in einem Schmuckgeschäft mit einem alten argentinischen Schein, gab aber vor, australische Dollar zu haben. Er erbeutete Schmuck und Wechselgeld im niedrigen dreistelligen Bereich. +++ Bei Grenzkontrollen in Kiefersfelden hat die Bundespolizei zwei gesuchte Männer festgenommen: Ein 26-jähriger Ungar muss wegen versuchten Diebstahls 298 Tage Reststrafe absitzen, ein 46-jähriger Georgier kam per U-Haftbefehl wegen schweren Diebstahls in Haft.'
- eventId:
  - 605252
  - 889018
  start: 2026-10-28T02:10:00Z
  stop: 2026-10-28T02:20:00Z
  title: Süd Journal vom 27.10.2026 (Wh.)
  subtitle: Max Gilg über die Gefahren von Cyberangriffen +++ Bayerischer Ärztetag in Berchtesgaden
  description: 'Cyberangriffe auf Strom-, Wasser- und Kühlsteuerungen nehmen zu: Viele Systeme sind schlecht gesichert und teils frei im Netz erreichbar. Experte Max Gilg nennt bundesweit rund 150.000 öffentlich zugängliche Geräte, in Bayern besonders viele. Schulungen und sichere Fernwartung sollen schützen. +++ Beim Bayerischen Ärztetag in Berchtesgaden fordern 180 Delegierte ein Junk-Food-Werbeverbot im TV und bei Streamingdiensten von 6 bis 23 Uhr. Zudem verlangen sie eine dauerhaft gesicherte, flächendeckende Kinder- und Jugendmedizin sowie Prävention ohne Budgetgrenzen.'
- eventId:
  - 605253
  - 889019
  start: 2026-10-28T02:20:00Z
  stop: 2026-10-28T02:30:00Z
  title: Süd Journal vom 27.10.2026 (Wh.)
  subtitle: 50 Jahre Kleinkunstkooperative Burghausen +++ Wetter für das Sendegebiet
  description: 'Die Burghauser Kleinkunstkooperative feiert 50 Jahre: 1976 als mutiges Ehrenamtsprojekt gestartet, holt der Verein bis heute Künstler in die Stadt. Gründungsmitglied und Vorsitzender Hans Steindl blickt mit Petra Holzner in einer Foyer-Ausstellung zurück, begleitet von Konzert und Anekdoten. +++ Ein graues Oktoberfinale steht bevor, denn der Himmel ist zur Wochenmitte vielerorts wolkenverhangen. Am Donnerstag ist es vor allem im Norden dicht bewölkt, etwas Sprühregen kann es auch geben. Im Süden zeigt sich ab und an die Sonne. Ähnlich ist es dann auch zum Freitag.'
