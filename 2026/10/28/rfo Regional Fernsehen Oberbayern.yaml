  subtitle: Hier porträtieren wir Süd-Menschen mit ihren Ecken und Kanten, mit interessanten Biografien und Lebensläufen.
  description: 'Social-Media-Star Joey Humbs zeigt sich nachdenklich: Sie spricht über Einsamkeit und das Single-Leben. In Rosenheim erzählt die Content Creatorin, wer hinter der Kamera steckt, wie sie arbeitet und was sie an der Social-Media-Welt bewegt. +++ Ein graues Oktoberfinale steht bevor, denn der Himmel ist zur Wochenmitte vielerorts wolkenverhangen. Am Donnerstag ist es vor allem im Norden dicht bewölkt, etwas Sprühregen kann es auch geben. Im Süden zeigt sich ab und an die Sonne. Ähnlich ist es dann auch zum Freitag.'
- eventId:
