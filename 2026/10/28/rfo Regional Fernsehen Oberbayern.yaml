  subtitle: Max Gilg über die Gefahren von Cyberangriffen +++ Bayerischer Ärztetag in Berchtesgaden
  description: 'Cyberangriffe auf Strom-, Wasser- und Kühlsteuerungen nehmen zu: Viele Systeme sind schlecht gesichert und teils frei im Netz erreichbar. Experte Max Gilg nennt bundesweit rund 150.000 öffentlich zugängliche Geräte, in Bayern besonders viele. Schulungen und sichere Fernwartung sollen schützen. +++ Beim Bayerischen Ärztetag in Berchtesgaden fordern 180 Delegierte ein Junk-Food-Werbeverbot im TV und bei Streamingdiensten von 6 bis 23 Uhr. Zudem verlangen sie eine dauerhaft gesicherte, flächendeckende Kinder- und Jugendmedizin sowie Prävention ohne Budgetgrenzen.'
