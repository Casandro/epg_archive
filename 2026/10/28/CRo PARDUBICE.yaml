  stop: 2026-10-28T07:55:00Z
  title: Máme hosty
  description: 28. říjen není státním svátkem pouze v České republice. Řekové v tento den slaví Den OCHI, tedy Den NE. Připomíná odmítnutí ultimáta Benita Mussoliniho řeckým premiérem Ioannisem Metaxasem 28. října 1940. O historických souvislostech i současné podobě oslav tohoto svátku si budeme povídat s Konstantinosem Tsivosem, který působí také na honorárním konzulátu Řecké republiky v Pardubicích. Moderuje Miroslav Hruban.
