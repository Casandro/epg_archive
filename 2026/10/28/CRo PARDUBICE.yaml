  description: Čeština a slovenština jsou si velmi podobné. V době společného soužití Čechů a Slováků vznikl také koncept ?československého jazyka?. Co to bylo? A co tenhle konstrukt způsobil? Jaká slovenská slova jsou Čechům neznámá a naopak? Poslechněte si jazykovědkyni Dagmar Magincovou, se kterou se naladíme na slavnostní notu. Moderuje Jitka Slezáková.
