  description: Dieser See ist voller Fisch. Robin Illner ist in Litauen unterwegs. Der See ist nur einen Meter tief. Die Fische stehen weit draußen. Das Futter muss mit einer Angel und eine Spomb auf 100 Meter in Entfernung gebracht werden. Welche Techniken Robin einsetzt und wie es Ihm gelingt Fisch auf Fisch in den Kescher zu bringen kannst du in diesem aktiongeladenen Film miterleben.  LT 2024
