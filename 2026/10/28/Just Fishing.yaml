  title: Unsere Fischbestände verschwinden lautlos!
  subtitle: Unsere Fischbestände verschwinden lautlos!
  description: |-
    Die Veränderungen im Habitat Donau und deren Zubringern, sowie der Wellenschlag der Schifffahrt, als auch der Ausfraß durch fischfressende Vögel und Säugetiere, sind mit Bestimmtheit die Hauptursachen, für die extreme Verminderung der heimischen Fischbestände.
