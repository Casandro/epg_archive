  hd: true
  audiodesc: true
  description: 'Bauchfett - das unterschätztes Krebsrisiko. Die Hose kneift, der Gürtel braucht ein Loch mehr - für viele nur ein kosmetisches Ärgernis. Dabei ist das viszerale Fett, das die inneren Organe umgibt, hochaktiv: Es produziert entzündungsfördernde Botenstoffe, bildet Östrogen und treibt den Insulinspiegel. Eine aktuelle Studie zeigt, dass weit mehr Krebserkrankungen auf zu viel Gewicht zurückzuführen sind als bislang angenommen. Entscheidend ist nicht der BMI, sondern der Bauchumfang: Er verrät, wo das Fett sitzt. Wie viel Umfang ist normal? Was hilft, wenn der Bauchumfang zu groß ist?'
