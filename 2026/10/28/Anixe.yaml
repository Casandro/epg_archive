  title: Kochen mit Anixe - Spaghetti Kürbis a la Guhmann
  subtitle: Kochen mit Anixe - Spaghetti Kürbis a la Guhmann
  description: Die Kürbiszeit beginnt typischerweise mit dem Ende des Spätsommers im August. Die Kürbis-Saison hat ihren Höhepunkt in den Herbst-Monaten September und Oktober und geht bis zum Frost. Kulinarisch hat der Kürbis einiges zu bieten. Aber wenn Sie Ihre Gäste auch noch überraschen wollen, dann bereiten Sie doch mal einen Spaghetti- Kürbis zu. Unser TV-Koch zeigt ihnen eine klassische Variante, auch wenn Sie den Kürbis mit allem, was das Herz begehrt, füllen könnten. Und ein echter Hingucker ist ein gefüllter Kürbis auf dem Esstisch allemal.  Hier das komplette Rezept!
- eventId: 702809
