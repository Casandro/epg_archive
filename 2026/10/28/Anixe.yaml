  title: city church Karlsruhe - Du siehst den Moment - Gott sieht die Geschichte
  subtitle: city church Karlsruhe - Du siehst den Moment - Gott sieht die Geschichte
  description: Oft vergleichen wir unser Leben mit dem anderer Menschen - die tollen Jobs, die schöne Familie, das scheinbar perfekte Umfeld. Doch wir sehen nur ein Kapitel, nicht die ganze Geschichte. In dieser Predigt entdecken wir an der Geschichte von Rut, dass Gottes Wirken oft nicht spektakulär, aber übernatürlich fürsorglich ist. Rut erlebt Verlust, Schmerz und schwierige Umstände, doch durch Treue, harte Arbeit und kleine Entscheidungen führt Gott sie Schritt für Schritt zu Segen - und zu einer Rolle in der Ahnenlinie Jesu.
