  title: Selten aber super - Musikalische Raritäten in SWR4
  subtitle: 'Heute: Meet the Temptations - Otis Williams zum 85. Geburtstag'
  description: |-
    Was man im SWR4 Musikarchiv so alles findet: Hans-Jürgen Finger ist jede Woche auf der Suche nach Schlager-Juwelen und anderen musikalischen Überraschungen. Hier geht es mal nicht um Evergreens und Ohrwürmer - sondern um echte Raritäten.

    "Selten aber super" gibt es auch jederzeit zum Nachhören in der SWR4 App, unter SWR4.de und in der ARD Audiothek.
