  title: Die besten Köche der Welt - Zu Gast im Ikarus - Manish Mehrotra
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Manish Mehrotra
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Head Chef Manish Mehrotra beweist, dass indisches Comfort Food und internationale Haute Cuisine kein Widerspruch sein müssen. Mitten in der lauten und überfüllten Metropole Neu Delhi findet sich mit dem Luxushotel The Manor eine kleine Oase. Hier begeistert das Restaurant Indian Accent seine Gäste mit zeitgenössischen Neuinterpretationen althergebrachter Rezepte aus ganz Indien. Manish Mehrotra und seinem Team gelang es dank seiner raffinierten Küche die klassische indische Küche auf ein Fine-Dining-Niveau zu heben. Martin Klein, der Executive Chef des Restaurants Ikarus im Salzburger Hangar- 7, reist persönlich nach Neu Delhi, um dort die Welt der indischen Gewürze und ihrer exotischen Zutaten zu studieren. Ein Kulturclash selbst für den welterfahrenen Spitzenkoch! Er wird gemeinsam mit Manish Mehrotra ein indisches Menü fürs Ikarus erstellen, das dort dann einen Monat lang serviert wird. Aber dieser kulinarische Austausch birgt einige Herausforderungen für Martin Kein und sein Team: Werden alle speziellen Zutaten aus Indien in Salzburg ankommen? Können alle für das Menü erforderlichen Techniken - wie der Umgang mit dem Tandoori Ofen zum Backen des berühmten Naan Brotes oder die Erstellung der eigenen Gewürzmischungen - von der Ikarus-Crew erlernt werden? Selten gestaltete sich der internationale Küchenaustausch so schwierig - dieses Mal wachsen Martin Klein und seine Köche über sich selbst hinaus! AT 2017'
- eventId: 702041
  start: 2026-10-28T05:40:00Z
  stop: 2026-10-28T06:26:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Wien
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Wien
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im März beehrt nicht EIN Spitzenkoch, sondern gleich VIER die Ikarus-Küche. Vier der meistausgezeichneten Sterne-Köche von Wien kreieren ein Luxusmenü, das die kulinarische Raffinesse Österreichs zelebriert. Martin Klein und Jahrhundertkoch Eckart Witzigmann machen sich gemeinsam auf zu einer Recherchereise in die Hauptstadt.  Mit von der Partie ist Heinz Reitbauer vom Restaurant Steirereck. Mit zwei Sternen und dem sensationellen achten Platz auf der Pellegrino-Liste der besten Restaurants der Welt ist Reitbauer der international bekannteste Vertreter der heimischen Spitzengastronomie. Seine Kreationen stellen außergewöhnliche Zutaten aus ganz Österreich ins Zentrum. Tief in der Österreichischen Tradition verwurzelt ist auch Mraz und Sohn, ein ehemaliges Vorstadtwirtshaus, das Hausherr Markus Mraz von seinem Vater übernommen hat. Die Speisekarte hat er kurzerhand abgeschafft, die Gäste werden mit Kreationen zwischen österreichischer Tradition und internationalen Einflüssen überrascht. Einzigartig in Österreich ist das Tian unter der Führung von Paul Ivic. Das Restaurant wurde als einziges rein vegetarisches Lokal des Landes mit einem Michelin-Stern geehrt, und hat längst eine treue Fangemeinde, auch unter überzeugten Fleischessern, erobert. Der vierte im Bunde residiert in einem der prächtigsten Bauten der Wiener Innenstadt, dem herrschaftlichen Palais Coburg. Das Luxushotel vereint barocke Opulenz mit kühner moderner Architektur, ein spektakulärer Rahmen der Eckart Witzigmann und Martin Klein tief beeindruckt. Spannende Gegensätze machen auch Silvio Nickols Küche aus. Bei ihm trifft etwa Entenleber auf Tannenwipfel und Schokolade. Für Martin Klein und sein Team wird dieses Gipfeltreffen eine Herausforderung! AT 2017'
