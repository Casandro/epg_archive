  title: Mein wunderbarer Kochsalon - Koreanisch marinierte Chicken Wings
  subtitle: Mein wunderbarer Kochsalon - Koreanisch marinierte Chicken Wings
  description: 'Hinter dem Rücken meines Mannes habe ich mir wieder einmal ein neues Küchengerät gekauft: einen Philips Airfryer. Frittiert nicht mit Fett, sondern mit heißer Luft. Ich war anfangs sehr skeptisch und habe das Gerät erstmals mit koreanisch marinierten Chicken wings probiert. Top oder Flop? Das Ergebnis seht ihr in meinem neuen Video. AT 2020'
  ageRating: 6
- eventId: 702059
  start: 2026-10-28T07:35:00Z
  stop: 2026-10-28T07:40:00Z
  title: Mein wunderbarer Kochsalon - Lachsforelle mit Kohlrabi
  subtitle: Mein wunderbarer Kochsalon - Lachsforelle mit Kohlrabi
  description: Ich esse grundsätzlich zu wenig Fisch, weil mir die Beschaffung in meinem stressigen Leben meistens zu mühsam ist. Eigentlich bedauerlich, gehört Fisch doch eindeutig zu meinen Favoriten. Aber nachdem ich so selten damit spiele, fehlt mir auch ein bisschen das Know-how. Daher habe ich Stefan Speiser vom Restaurant Apron (im Hotel am Konzerthaus) eingeladen, der uns in nur wenigen Schritten zu einer absoluten Delikatesse führt - und indem man die Lachsforelle im Ofen ganz sanft konfiert, kann auch nichts schiefgehen, solange man sich an die Zeit hält. Gemeinsam mit Erbsen und Kohlrabi ein mehr als wohlmeinender Frühlingsgruß. AT 2020
  ageRating: 6
- eventId: 702083
  start: 2026-10-28T07:40:00Z
  stop: 2026-10-28T07:47:00Z
  title: Mein wunderbarer Kochsalon - Lauwarmer Erdäpfel-Artischocken-Salat
  subtitle: Mein wunderbarer Kochsalon - Lauwarmer Erdäpfel-Artischocken-Salat
  description: Ich esse immer gerne gut, aber mit zunehmendem Alter auch mit wachsendem Bewusstsein, was mir denn wirklich gut tut. Körperlich, nicht seelisch, weil das ist eine völlig andere Geschichte. Schokolade für die Nerven, Rotwein zum Belohnen, Guglhupf gegen Wetterblues... Ich könnte endlos fortsetzen, aber diesmal geht es wie gesagt um etwas Gesunden. Dafür kam die TCM Expertin Ursula Peer in den Kochsalon, um mir einen Blitzkurs für das Wohlbefinden zu geben. Das Ganze passierte in Form eines wunderbaren Erdäpfelsalats mit Artischocken, der uns gerade jetzt nach dem Winter wieder Energie geben und alles Unnötige, was wir in den dunklen Monaten angesammelt haben, austreiben soll. Der Salat schmeckt so sensationell gut, dass man gar nicht an diese Nebenwirkungen denkt, auch, wenn sie sehr willkommen sind. AT 2020
