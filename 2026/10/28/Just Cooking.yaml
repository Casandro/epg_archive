  title: Mein wunderbarer Kochsalon - Tortellini mit Schmorparadeisern
  subtitle: Mein wunderbarer Kochsalon - Tortellini mit Schmorparadeisern
  description: 'Seien wir uns ehrlich: Hat uns der Alltag fest im Griff, kochen wir in Wahrheit immer das selbe. Was ja nicht schlecht sein muss, aber auf dem Weg zwischen Schule, Büro und Babylaufstall bleibt regelmäßig meine Kreativität auf der Strecke. Für solche dunklen kulinarischen Momente gibt es dann Hilfestellungen aus der Rezeptkiste, nämlich wirklich. Der Biohof Adamah - bekannt durch seinen Biokistln, die man sich je nach Größe, Art und Regelmäßigkeit liefern lassen kann - stellt nun auch eigene Kistln für ein bestimmtes Rezept zusammen. Das heißt, ich bekomme eine Idee und die Zutaten geliefert, alles rein bio, kochen muss/darf ich dann selbst. Bringt nicht nur Erleichterung in meiner Küche, sondern auch Abwechslung. AT 2020'
  ageRating: 6
