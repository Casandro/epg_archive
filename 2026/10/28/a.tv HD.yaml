  title: a.tv Gesundheit (Wh.)
  subtitle: 'Moderne Pflege: Welche Rolle spielt Digitalisierung'
  description: 'Die Pflege entwickelt sich seit Jahren immer weiter und wird immer digitaler. Das hat zur Folge, dass man nach einer Operation viel schneller wieder mobil ist. Durch die Digitalisierung der Vitaldaten sparen die Pflegekräfte auch wertvolle Zeit, die sie dafür am Patienten nutzen können. Moderation: Adrian Burg'
