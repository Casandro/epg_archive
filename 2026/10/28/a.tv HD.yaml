  - 888990
  start: 2026-10-28T02:15:00Z
  stop: 2026-10-28T02:30:00Z
  title: Aus dem Ostallgäu und Kaufbeuren (Wh.)
  subtitle: Raketenabwehr in Kaufbeuren - Arrow 3 soll ins Allgäu kommen
  description: 'Das Allgäu wird ein künftig eine wichtige Rolle bei der Raketenabwehr Deutschlands übernehmen: Im Königsberger Forst bei Friesenried ist eine Radaranlage für das Raketenabwehrsystem Arrow 3 geplant.  Die Standortwahl sorgt vor Ort für Kritik. Im Mittelpunkt stehen die Folgen für Wald und Trinkwasserversorgung sowie auch die Kommunikation der Bundeswehr. Mehr  zum Thema zeigen wir Ihnen in unserem Landkreismagazin aus dem Ostallgäu und Kaufbeuren'
