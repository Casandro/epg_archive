  title: Bayern 1 am Morgen
  subtitle: Mit Marcus Fahn
  description: "Mit Marcus Fahn fängt der Tag gut an.\nDie größten Hits aus den 80ern, viel musikalische Abwechslung und die tägliche Portion an guten Geschichten machen den Bayern 1 Morgen zu Deutschlands meistgehörter Frühsendung.\nAlle 30 Minuten die wichtigsten Infos für Sie - Live aus Ihrer Region und in den Nachrichten des Bayerischen Rundfunks! \nUnd auch unsere Comedystars in der täglichen Videokonferenz sind immer up to date. Die Bayern 1 Superbayern: Söder, Stoiber und Aiwanger.\n\nMarcus Fahn hat immer ein offenes Ohr für Sie. Schreiben Sie uns an studio@bayern1.de oder schicken Sie uns eine Sprachnachricht auf unser Studiohandy: 0151-19589000 (WhatsApp) \n\n5.10 Fahns besondere Morgennummer auf Bayern 1\n5.30 Nachrichten-Schlagzeilen\n5.56 Gedanken zum Tag *\n6.00 / 7.00 / 8.00\nNachrichten, Wetter, Verkehr\n6.30 / 7.30 / 8.30 \nDas Wichtigste aus Ihrer Region\nGetrennte Ausstrahlung\nüber die fünf UKW-Sendergruppen\nOberbayern, Niederbayern/Oberpfalz, \nMittel- und Oberfranken, Mainfranken, Schwaben\n7.50 \"Die Superbayern\" - Comedy mit Wolfgang Krebs *\n8.50 Fahns finale Frage\n\n* Als Podcast verfügbar in der App ARD Sounds"
