    Unterwasserbergung bei null Sicht
    Doku-Serie, AUS/NZ 2022
    Altersfreigabe: ab 12
  description: |-
    Heftige Regenfälle in New South Wales: Wagga Truck Towing kämpft gegen die Zeit, um wertvolle Landmaschinen aus dem Morast zu retten, während bereits die nächste Unwetterfront droht. Gleichzeitig wartet in Queensland ein riskanter Unterwassereinsatz auf Clayton's Towing: Eine gesunkene Yacht blockiert den Mary River, und Taucher Mackie muss bei Nullsicht im trüben Wasser Bergungsseile befestigen - umgeben von Krokodilen, Haien und lauernden Krabben.

