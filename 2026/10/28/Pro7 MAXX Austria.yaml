  title: Highway Heroes Down Under
  subtitle: |-
    Oldies but Goldies
    Doku-Serie, AUS/NZ 2022
    Altersfreigabe: ab 12
  description: |-
    Das Team von Wagga Truck Towing wird zu einem umgestürzten Viehtransporter in Australiens Hinterland gerufen. Schon die Anfahrt über einen unbefestigten Feldweg wird zur Herausforderung. Das Team von Clayton's Towing erhält einen außergewöhnlichen Auftrag: In einer Duplexgarage hat das Metallgerüst mit drei wertvollen Oldtimern teilweise nachgegeben. Ein Wagen droht in einen zweiten zu stürzen und stellt die Männer vor enorme Probleme.

    Schnitt: Sam Hutchinson
  widescreen: true
