    (WH vom Mittwoch, 21.10.2026, 14:15 Uhr)
  description: |-
    Die Käufer reisen nach Amityville, Long Island, zu einer Auktion, die mit großen Lagern lockt. Mike ist schon bei der Anreise etwas mulmig zumute, da er sich an die gruselige Historie der Stadt erinnert. Courtney und Candy haben beschlossen, ihre Konkurrenz genau zu analysieren und wollen die Veranstaltung deshalb aufzeichnen - doch damit ist nicht jeder einverstanden. Joe P. will nach einer langer Flaute endlich wieder zuschlagen.

