  title: Zwei Priester, ein Glaube, viele Fragen I  "Ich hab doch niemanden umgebracht" - Wozu Beichte?
  subtitle: Gespräch
  description: 'Die Beichte - muss das wirklich sein? "Ich habe doch niemanden umgebracht - das kann ich auch direkt mit Gott klären!" Die Priester Lukas und Patrick zeigen, worum es bei diesem Sakrament wirklich geht: um Heilung, Versöhnung und die erneuerte Freundschaft mit Gott. Sie erzählen von persönlichen Erfahrungen, erklären die "4 B" der Beichtvorbereitung und deuten das Gleichnis vom barmherzigen Vater. Ihr Fazit: Die Beichte ist eine Waschanlage für die Seele.'
