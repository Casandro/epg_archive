  stop: 2026-10-28T13:15:00Z
  title: Niklaus von Flüe. Ringen mit dem Leben
  subtitle: Dokumentation
  description: Der heilige Niklaus von Flüe ist der überragende Heilige der Schweiz. Über Jahrzehnte steht er mitten im Leben als Bauer, Soldat und Ratsherr im Kanton Obwalden. Trotzdem ringt er mit seinem Leben. Schließlich wird er krank. In dieser Situation wird ihm klar, was Gott von ihm möchte.
