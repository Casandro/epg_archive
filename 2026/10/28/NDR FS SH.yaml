  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein heruntergekommenes Mehrfamilienhaus aus zwei unterschiedlichen Baujahren mit Schimmel, unzählige Herausforderungen und die Vision eines lichtdurchfluteten Familienhauses: Jelena und Simon Heeger wagen in Hamburg-Alsterdorf ein außergewöhnliches Umbauprojekt. Aus zwei ehemals getrennten Häusern soll innerhalb eines Jahres ein gemeinsames Zuhause für ihre junge Familie entstehen. Der Rückbau fördert Überraschungen zutage: unterschiedliche Baustoffe, mehr als 60 Tonnen Bauschutt und ein komplexes Gebäude, das bis ins Detail neu gedacht werden muss.'
