  description: Vor dem Landegericht in Braunschweig gesteht Miriam A., ihre Lebensgefährtin Josephine R. misshandelt und auch vergewaltigt zu haben. Miriam A. wird zu 6,5 Jahren Haft verurteilt - und es gibt Hinweise auf einen immer größer werdenden Täterkreis. Wenig später werden die Eltern von Josephine R. verhaftet. Sie sollen den Missbrauch organisiert und auch selbst betrieben haben. Die Polizei stößt sehr schnell auf widersprüchliche Ermittlungsergebnisse. Aber die Staatsanwaltschaft bleibt bei ihrem Kurs.
