  subtitle: Eltern vor Gericht
  description: Im Juli 2023 werden die Eltern von Josephine zu langjährigen Haftstrafen verurteilt. Das Gericht folgt der Staatsanwaltschaft und schenkt den entlastenden Hinweisen der Kripo kaum Beachtung. Die Verteidigung nutzt die letzte Chance, die sie noch hat und geht in Revision. Zur großen Überraschung kippt der Bundesgerichtshof das Urteil aus Braunschweig. Es sei nicht ausreichend geprüft worden, ob die Zeugin glaubwürdig sei. Josephine R. beschuldigt nun auch ihre eigene Anwältin des Missbrauchs. Der Prozess wird neu verhandelt. Für die Eltern die letzte Hoffnung, aus dem Gefängnis zu kommen.
