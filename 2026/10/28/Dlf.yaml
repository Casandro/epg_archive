  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nFestnahmen nach dem Attentat auf eine orthodoxe Kirche in Jordanien\nVergangenen Freitag kam es in Jordanien zu einem Attentat auf die Gemeinde einer orthodoxen Kirche. Bewaffnete eröffneten das Feuer auf einen Trauerzug, neun Menschen wurden getötet, 25 weitere verletzt. Jordanien ist ein mehrheitlich islamisches Land, mehr als 90 Prozent sind sunnitische Muslime. Doch das Land gilt als tolerant gegenüber Christen und Juden. Die jordanische Armee griff am Montag Ziele im benachbarten Syrien an, nach eigenen Angaben Stellungen von Terrororganisationen, denn hinter dem Anschlag sollen Islamisten stecken, das Attentat ein Angriff sein auf die religiöse Toleranz. \n\nSpiritualität im Medizinstudium\nWer als Arzt oder Ärztin arbeitet, wird unweigerlich irgendwann mit dem Thema Tod konfrontiert. Aber nicht nur mit toten Patienten, sondern auch mit lebenden, die sich mit dem Tod auseinandersetzen müssen. Doch der Umgang mit existenziellen Fragen, mit dem Tod, mit dem Leben nach dem Tod, Glaube und Religion nimmt im Medizinstudium bislang wenig Raum ein. ..."
