  title: MAX maakt mogelijk
  subtitle: Verkeersregelaar mishandeld S21 E03. Na een jarenlange carrière als NS-conducteur stopt Ton als hij voor de zevende keer een aanrijding met een persoon meemaakt. Na een tijdje thuiszitten wil hij graag weer onder de mensen komen.
  description: Na een jarenlange carrière als NS-conducteur stopt Ton uit Lelystad als hij voor de zevende keer een aanrijding met een persoon meemaakt. Na een tijdje thuiszitten wil hij graag weer onder de mensen komen. Hij wordt verkeersregelaar en werkt deze zomer met plezier op een festival. Maar de feestgangers zijn niet allemaal in opperbeste stemming, blijkt als Ton na een woordenwisseling flink mishandeld wordt. Hij houdt er flinke verwondingen aan over en zit nu weer thuis. Jan Slagter zoekt Ton thuis op en neemt hem mee voor een verrassing waar hij nog lang plezier van zal hebben. (2026)
  genre:
  - '32'
