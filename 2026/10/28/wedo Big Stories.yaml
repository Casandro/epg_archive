  title: Survive the Wild
  subtitle: Die Komplexität der Tierreproduktion, Magazines / Reports / Documentary 2017, Season:1 Episode:3, FSK 12
  description: '2017 ● S1 E3 ● FSK: 12 Ob mikroskopisch kleine Einzeller oder die größten Tiere der Welt - ein Ziel eint sie alle: die Fortpflanzung. Die Suche nach dem passenden Partner ist allerdings eine echte Herausforderung. Um sie zu bewältigen, gibt es auch im Tierreich die unterschiedlichsten Strategien. Tierische Strategen zeigt die kreativsten Methoden, mit denen Tiere versuchen, einen Partner zu finden und ihn dann hoffentlich auch für sich gewinnen. Magazines / Reports / Documentary 2017, Season:1 Episode:3, FSK 12'
