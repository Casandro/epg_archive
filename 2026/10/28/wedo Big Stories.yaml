  title: Survive the Wild
  subtitle: Die Strategie des Agonismus in der Wildnis, Magazines / Reports / Documentary 2017, Season:1 Episode:4, FSK 12
  description: '2017 ● S1 E4 ● FSK: 12 Keine Frage: Die Fähigkeit zu kämpfen und sich gegen Rivalen durchzusetzen, ist für Wildtiere essenziell wichtig. Die Gründe für eine körperliche Auseinandersetzung können dabei ganz unterschiedlicher Natur sein - zum Beispiel um eine bestehende Hierarchie zu festigen, um Ressourcen zu sichern, um mögliche Partner zu erobern oder um neue Reviere einzunehmen. Magazines / Reports / Documentary 2017, Season:1 Episode:4, FSK 12'
