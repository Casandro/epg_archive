- eventId: 740740
  start: 2026-10-28T10:05:00Z
  stop: 2026-10-28T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: Regiodokument - Nový domov Žitava. Matěj a Eliška se přestěhovali do Žitavy, aby spolu jako mladý pár začali bydlet. Zjišťují, že tuto variantu volí řada Čechů - bydlení je tam dosažitelnější než na druhé straně hranic. Schází se s dalšími Čechy, kteří denně přejíždějí hranice, a společně zkoumají, nakolik je možné si vytvořit domov v místě, kde nezní čeština, a nakolik jsou němečtí sousedé české komunitě otevření. V dokumentu vystupuje několik žitavských obyvatel a geografka a socioložka komentující každodenní přeshraniční migraci. Zaznívá autorská hudba Matěje Klimši.
