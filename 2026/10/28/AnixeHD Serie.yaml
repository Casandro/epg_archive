  title: 'Reisen mit Kreta.de - Tipps: Open-Air Museum Lychnostatis'
  subtitle: 'Reisen mit Kreta.de - Tipps: Open-Air Museum Lychnostatis'
  description: Das Lychnostatis Open Air Museum in Hersonissos bringt kretische Tradition zum Leben. Auf einem weitläufigen Gelände siehst du original nachgebaute Häuser, Werkstätten, Oliven und Weinpressen, Kräuter und Obstgärten sowie Ausstellungen zur Natur und Volkskultur. Hier taucht man ein in das einfache Leben vergangener Zeiten - ideal für Kulturinteressierte und Familien.
