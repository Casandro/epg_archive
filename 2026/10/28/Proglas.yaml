  title: K výročí republiky
  subtitle: Symboly státnosti
  description: 'Autor: Marcela Kopecká; Interpret: plk. Michal Burian * Národní památník na Vítkově v Praze otevřel  nedávno stálou expozici Symboly státnosti. Zájemci o českou historii uvidí exponáty, které byly svědky nejvýznamnějších okamžiků našich novodobých dějin.  Výstava návštěvníky seznámí  s vývojem naší státní vlajky a prezidentskými standartami.  Část expozice je věnována národní hymně i malému a velkému státnímu znaku.  K výjimečným památkám se řadí i vlajka, kterou si ušili čeští vězni v koncentračním táboře Dachau nebo autentická vlajka z roku 1968.  Další vzácné artefakty  v pořadu Radioreport představí posluchačům Proglasu plukovník Michal Burian, ředitel odboru muzeí Vojenského historického ústavu, se kterým jsme novou expozicí procházeli.'
