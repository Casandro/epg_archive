  title: Klika (Rádio 7)
  subtitle: Jak to vlastně je? - Víra nebo aktivismus (5. díl)
  description: 'Autor a interpret: Petr Húšť * Někdy se velmi snažíme žít ten správný křesťanský život. A po čase zjišťujeme, že jsme unavení, nervózní nebo podráždění. Je tohle náš úkol? Máme se snažit, aby...? - a dosaďte si, co chcete. Nebo je naším úkolem spíše objevit, kým jsme v Kristu a jaké zdroje máme k dispozici? A jak to udělat? Mnoho otázek míří k závěrečné části série Petra Húště v pořadu Klika, série s názvem Jak to vlastně je. Poslouchejte v 10.15.'
