  description: 'Autor a interpret: Natálie Feitová, Tamara Suchánková; Premiéra: 28.10.2025 * Dnešní Barvínek bude sváteční. S Naty a Tamčou si povíme, co to státní svátek vlastně je a co si připomínáme každý rok 28. října. Věděli byste, kolik svátků vlastně slavíme? Znáte naše státní symboly? Co je to Fidlovačka a o co významného se zasloužil Josef Kajetán Tyl?  Pokud se chcete dozvědět odpovědi (nejen) na tyto otázky, poslouchejte nový Barvínek. Těšit se můžete i na závěrečný opakovací kvíz, kde si můžete ověřit, co všechno jste si zapamatovali. Barvínek pro vás vysíláme vždy premiérově v úterý v 17.10 a v repríze v sobotu v 11.00. '
