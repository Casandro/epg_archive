  description: 'Vulkane mit azurblauen Kraterseen, Wasserfälle im Dschungel, heiße Quellen und Portugals höchster Berg: Die Azoren sind ein grünes Paradies mitten im Atlantik und bieten alles für einen naturnahen Abenteuerurlaub - inklusive Wandern, Canyoning, Surfen, Tauchen, Kanufahren und Baden im Naturschwimmbecken. Tamina Kallert besucht drei der insgesamt neun Inseln: Die Hauptinsel São Miguel ist berühmt für ihre üppige Vegetation mit riesigen Farnen, Baumheide, Lorbeerhecken und Blumen, die nur auf den Azoren wachsen. Die Westküste gleicht einer Mondlandschaft und ist Treffpunkt der Weltumsegler. Pico ist die Insel des Weins und der Wale.'
