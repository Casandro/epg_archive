    England, Grafschaft Wiltshire, 1860. Im Road Hill House, dem angemieteten Wohnsitz der Familie Kent, wird der kleine Savill Kent grausam ermordet aufgefunden. Der Fall schlägt Wellen in ganz England, und der Innenminister veranlasst, dass Inspektor Whicher von der Metropolitan Police nach Wiltshire geschickt wird, um ihn zu lösen. In Wiltshire angekommen stößt Mr. Whicher - obwohl vom dortigen Magistrat mit allen Vollmachten ausgestattet - auf Ablehnung und sogar Widerstand der örtlichen Polizei.
