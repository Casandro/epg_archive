    Wie bastelt man eine Puppe aus Socken?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um Farben. Anke Lepanke führt einen beeindruckenden Trick vor. Sie verzaubert Denis T-Shirt, das plötzlich die Farbe wechselt. Robert Metcalf singt ein Lied über eine nette Tante, die ganz viele Hüte braucht. Olivia zeigt, wie man aus alten Socken lustige Sockenwesen basteln kann. Timmys Sockenpuppe ist verschwunden. Ob er sie wohl wieder findet? Und zum Schluss verabschieden sich Tanja und Knolle mit einem kunterbunten Farbklecksmonster.
