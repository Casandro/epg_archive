    Der kleine Hase und die kleine Feldmaus finden beim Spielen auf der Wiese ein großes Ei. Es liegt aber nicht in einem Nest, sondern einfach allein und verlassen am Boden. Der kleine Hase findet, dass dies ziemlich gefährlich für ein Ei ist. Blauvogel kommt vorbei und bietet an, sich um das Ei zu kümmern. Weil das Ei großes Glück gehabt hat, nennen sie es das Glücks-Ei. In Blauvogels Nest liegen schon zwei Eier zum Ausbrüten. Doch das Glücks-Ei ist zu groß, um von Blauvogel gewärmt zu werden. Also helfen ihr der kleine Hase und die kleine Feldmaus beim Ausbrüten. Blauvogels Kinder schlüpfen zuerst und kurz danach schlüpft auch das Küken aus dem Glücks-Ei. Es ist sehr groß und ganz anders als Blauvogels eigene Küken. Doch obwohl es ganz anders ist, hat Blauvogel es genau so lieb wie ihre eigenen Kinder. Alle zusammen kümmern sich rührend um das ungewöhnliche Küken. ...
