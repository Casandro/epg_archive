    Beim Wettbewerb "Jugend forscht" sorgt die 13-jährige Fleur mit einer bahnbrechenden Erfindung für Aufsehen. Sie hat einen synthetischen Adlerholzduft entwickelt, der die Parfümindustrie revolutionieren könnte. Denn Adlerholz ist teuer und der Abbau des seltenen Holzes schadet dem Urwald. Doch kurz nach der Pressekonferenz werden ihre Forschungsergebnisse zerstört! Jules, der Fleur bewundert, will unbedingt herausfinden, wer ihr das angetan hat. Ein neidischer Konkurrent? Oder steckt mehr dahinter? Die Pfefferkörner nehmen die Ermittlung auf. Währenddessen macht Piet eine Entdeckung, die Kofis Leben für immer verändern könnte.
