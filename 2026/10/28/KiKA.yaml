  description: |-
    Junis und sein kleiner Hund

    Junis ist sechs Jahre alt und gerade ist ganz viel neu in seinem Leben! Vor kurzem kam die kleine Windhündin Olivia in seine Familie. Für Olivia ist alles neu: die Wohnung, die Familie und sogar ein großer Hund wohnt hier schon. Was kann Junis tun, damit sich Olivia in ihrem Zuhause richtig wohl fühlt und die beiden schnell gute Freunde werden? Junis verbringt viel Zeit mit ihr und versucht zu verstehen, wie es dem Welpen geht, was er will und was nicht.

    Am liebsten würde Junis den ganzen Tag mit Olivia kuscheln und spielen, aber sie braucht auch noch viel Ruhe und muss lernen, ihre Umgebung selbständig zu entdecken. Damit Olivia auch auf Junis hört, übt er beim Gassi gehen Sitz! Platz! Hier! Aus! Mach Pippi! Und NEIN! Besonders am Anfang ist es wichtig, jeden Tag die Dinge zur gleichen Zeit zu erledigen: vom Füttern bis zum Schlafengehen. Daran muss sich Junis auch erstmal gewöhnen.
    Regie: Iris Stark

