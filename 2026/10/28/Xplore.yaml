  title: VIP Trip - Prominente auf Reisen 5 - Interlaken mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 5 - Interlaken mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 5: In dieser Folge "VIP Trip - Prominente auf Reisen" begleiten wir wir den Schauspieler Richy Müller in die Schweiz, nach Interlaken. In dieser prominenten Ferienregion bleiben keine Wünsche offen. Ob Abenteuerurlaub oder Tradition erleben: Hier ist für jeden Reisenden was dabei. Neben Muskelarbeit beim Käser und im Seilpark als Vorbereitung für spätere  Bergtouren, trifft Richy Müller auch auf einen Alphorn-Instrumentenbauer und besucht die einzige Schule für Holzbildhauerei in der Schweiz. Mit der Brienz-Rothorn-Bahn geht es schließlich auf den gleichnamigen Berg mit einer beeindruckenden Aussicht. Gemäß Schweizer Tradition versucht sich der Schauspieler auch beim Alphornspiel. Jetzt muss Richy als Anfänger dem Alphorn nicht nur Töne entlocken, sondern auch vermeiden, die Kühe auf der Alpe zu verschrecken. Ob das klappt? In Spiez besucht der Schauspieler einen Weinberg und verkostet den dort erzeugten Rotwein. Auf dem Spiezer Weinfest erlebt Richy, wie am Thuner See die Weinlese gefeiert wird. Die historische Altstadt von Thun ist ganz gewiss einen Ausflug wert, ebenso das Schloß Schadau, direkt am See gelegen. Auch diverse Outdoor-Aktivitäten warten auf Richy Müller. Auf dem Oberberghorn genießt er das atemberaubende Panorama, welches genauso spektakulär ist wie der darauffolgende Gleitschirmflug zurück ins Tal nach Interlaken. Beim River Rafting wird es nass und turbulent. Schließlich geht es mit der Jungfraubahn durch einen über sieben Kilometer langen Tunnel quer durch das Eiger-Massiv hinauf aufs Jungfraujoch, den höchstgelegenen Bahnhof Europas. Allein die Baugeschichte dieser Bahnstrecke ist ein Musterstück schweizer Ingenieurskunst. Highlights im ewigen Eis sind schließlich der Eispalast im Jungfraufirn und eine Wanderung über den Aletschgletscher, den größten Gletscher der Alpen. DE 2019'
