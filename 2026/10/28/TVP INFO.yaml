  title: Podróże z historią 2 (odc. 5)
  subtitle: Radosław Kotarski wstępuje do zakonu. Razem z cysterskimi braćmi opowiada o codziennym życiu średniowiecznych zgromadzeń - o pracy, rozrywkach i kuchni odległych czasów.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Radosław Kotarski potrafi zrobić wiele, aby poznać prawdę o dawnych czasach. Tym razem niemal dosłownie wstępuje do zakonu. Dzięki temu jest w stanie z perspektywy mnisiego habitu opowiedzieć o codziennym życiu średniowiecznych zakonów. Razem z cysterskimi braćmi opowiada o pracy, rozrywkach i kuchni odległych czasów. Jaką funkcję znajdą dla niego mnisi?
  genre:
  - '149'
