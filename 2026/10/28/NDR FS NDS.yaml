  title: 'Die Nordreportage: Unter Norderney durch'
  subtitle: Buddeln für die Energiewende
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Wenn Ernst Fengler auf der Baustelle ist, passiert Entscheidendes. Er ist verantwortlich für vier Bohrungen unter Norderney hindurch, mitten im Nationalpark Niedersächsisches Wattenmeer. In die Bohrschächte müssen Kabelschutzrohre eingezogen werden, damit später Elektroleitungen den Windstrom von der offenen Nordsee ans Festland leiten können. Die Nationalparkverwaltung beäugt die Baustellen im Watt kritisch. Regelmäßig achten deren Mitarbeitenden vor Ort darauf, dass nichts Schädliches in die Umwelt gelangt. Ein schwieriger Spagat zwischen Hightech und Natur.
