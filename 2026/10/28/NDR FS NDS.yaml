  description: Die Filmproduzentin Alice Brauner setzt sich seit Jahren dafür ein, dass die Verbrechen des Nationalsozialismus zwischen 1933 und 1945 nicht in Vergessenheit geraten. Mit ihrem aktuellen Projekt, dem Kinofilm "Block 10", geht sie diesen Weg weiter voran. Erzählt wird die systematische Misshandlung und Ermordung Hunderter jüdischer Frauen und Männer während grausamer medizinischer Experimente im Konzentrationslager Auschwitz. Brauner selbst hat das Drehbuch geschrieben, sie versteht diese Arbeit auch als Vermächtnis ihrer verstorbenen Eltern, den Shoa-Überlebenden Maria und Artur Brauner.
