  title: Plattdeutsches Hörspiel
  subtitle: 'Smiet Rin - Mehr as blots ümtrecken!: Kronjuwelen (Folge 2)'
  description: |-
    Niederdeutsche Hörspielserie
    Von Hans Helge Ott
    Regie: Ilka Barthels
    RB/NDR 2026

    Ob Umzug, Wohnungsauflösung, Zwangsräumung oder Möbeltransport - im  Umzugsunternehmen "Smiet Rin" sorgen Isabell Smitt und ihr Team dafür, dass die Wünsche ihrer Kund*innen zuverlässig erfüllt werden.

    Der Auftrag: Transport wertvoller Gemälde von Erfurt nach Hamburg , verlangt Isabell und ihrem Team viel ab. Es geht um Millionenwerte! Nach vielen Anstrengungen, Sicherheitsmaßnahmen für diese wertvolle Fracht anzupassen, bricht sich das Team zu einer heiklen Reise auf. Allen ist klar: Es muss klappen...
