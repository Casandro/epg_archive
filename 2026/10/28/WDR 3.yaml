  title: ARD Konzert
  subtitle: 'Moderation: Claudia Belemann'
  description: "August der Starke und dessen Sohn, der vermutlich Blockflöte spielte, scheuten weder Kosten noch Mühen, um die berühmtesten Komponisten und Instrumentalisten nach Elbflorenz zu holen. Dorothee Oberlinger und ihr Ensemble 1700 spielen im WDR Funkhaus Werke aus dem \"Schranck No: II\" der sächsischen Landesbibliothek - u.a. Werke von Georg Philipp Telemann, Antonio Vivaldi und Johann Joachim Quantz.\n<strong>Jan Dismas Zelenka<br/></strong>Kanon Nr.1\n<strong>Johann Georg Pisendel<br/></strong>\"Imitation Les caractères de la danse\"\n<strong>Johann Gabriel Buffardin<br/></strong>Concerto f-Moll \n<strong>Johann Joachim Quantz<br/></strong>Menuett \"L _inconueë\"\n<strong>Francesco Maria Veracini<br/></strong>Sonate a-Moll \"Il Postiglione\"\n<strong>Georg Philipp Telemann<br/></strong>\"Concerto Polonois\" TWV 43:G7 \n<strong>Christian Petzold<br/></strong>Menuett in G Dur und G Moll<br/>Bearbeitung aus dem Notenbüchlein für Anna Magdalena Bach BWV Anh. 114 -115\n<strong>Johann David Heinichen<br/></strong>Concerto in D-Dur \n<strong>Johann Friedrich Fasch<br/></strong>Quartett a-Moll\n<strong>Johann Georg Pisendel<br/></strong>Ausschnitt aus Sonata a-Moll <br/>für Violine solo in einer Bearbeitung für Blockflöte solo\n<strong>Antonio Vivaldi<br/></strong>Concerto d-Moll \"per Pisendel\" RV 242, bearbeitet für Blockflöte, Streicher und BC in c-Moll \n<strong>Charles Dieupart<br/></strong>Concerto a 7 \nDorothee Oberlinger, Blockflöte &amp; Leitung<br/>Ensemble 1700\nAufnahme vom 27. September 2026 im WDR Funkhaus Wallrafplatz, Köln\nModeration: Claudia Belemann<br/>Redaktion: Susanne Rump"
