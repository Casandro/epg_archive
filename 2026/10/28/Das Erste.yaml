  audiodesc: true
  description: 'Irgendwo im Nirgendwo lebt der 16-jährige Ben und würde gern was erleben, vorzugsweise weit weg in Afrika. Aber was wäre dann mit Karl, seinem dementen Großvater? Ben sitzt fest. Sein väterlicher Freund Maslow hat einen Super-Plan: Die Nachricht von einem Ufo soll die Presse und dann die Touristen anlocken. Er sorgt dafür, dass ein Ufo gesichtet wird. Und tatsächlich kommt die junge Lena in den Ort. Zwar stellt sich heraus, dass Lena gar keine Journalistin ist und Verliebtsein Ben auch nicht weiterhilft, trotzdem hat Maslow am Ende seine Schlagzeilen und Ben endlich ein paar richtig gute Gründe, doch noch eine Weile zu bleiben.'
