  title: auserlesen
  subtitle: 'Erna Hüls: Was dich wirklich stark macht'
  description: |-
    "Das schaffst du nicht." Solche inneren Stimmen kennt fast jeder. Erna Hüls erlebt seit vielen Jahren, wie Zweifel, Sorgen und alte Denkmuster Menschen ausbremsen und was ihnen hilft, sich davon zu lösen. Die Diplom Sozialpädagogin arbeitet seit 1999 als Coach, wurde mit dem European Speaker Award ausgezeichnet und ist Autorin von "Ein Coach für alle Fälle". In dieser Sendung spricht sie darüber, was Menschen wirklich stark macht, wie Selbstzweifel überwunden werden und wie jeder seine ganz persönliche Bestimmung finden kann.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 963961
  start: 2026-10-28T03:20:00Z
  stop: 2026-10-28T03:50:00Z
  title: Leben und Gesundheit
  subtitle: Wenn Schmerz dich lähmt
  description: |-
    "Ich würd ja gern, aber..." - Schmerzen sind für viele eine echte Hürde, wenn's ums Thema Bewegung geht. Manchmal ist der Schmerz real, manchmal eine bequeme Ausrede. In beiden Fällen gilt: Bewegung kann helfen. Nicht als Leistungssport, sondern als heilsamer Impuls - im Alltag, mit kleinen Schritten, angepasst an den Körper. In dieser Folge spreche ich mit Dr. Martin Matyk über Denkfehler, Schmerzvermeidung und warum es sich lohnt, trotzdem in Bewegung zu bleiben. Für mehr Lebensqualität, mehr Selbstwirksamkeit - und vielleicht sogar weniger Schmerz.

    Weitere Infos: www.hopetv.de
  widescreen: true
  hd: true
