- eventId: 963671
  start: 2026-10-28T02:35:00Z
  stop: 2026-10-28T02:50:00Z
  title: Sabbat - Das Gebot der Freiheit
  subtitle: Der Sabbat - Lieblingsgebot Gottes?
  description: |-
    Kann Gott ein Lieblingsgebot haben? Ausgehend von einer überraschenden Aussage des Oscarpreisträgers Roberto Benigni untersucht Paulin Giurgi die besondere Stellung des Sabbats. Kein anderes Gebot verbindet Schöpfung, Befreiung, Ruhe, Würde und Gemeinschaft auf dieselbe Weise. Die Folge zeigt, was der Sabbat über Gottes Herz verrät: Ihm geht es nicht zuerst um Leistung, sondern um Menschen und um den Schutz seiner ganzen Schöpfung.

    Weitere Infos unter: www.hopetv.de
