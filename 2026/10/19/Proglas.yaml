  title: Studna slova (Rádio 7)
  subtitle: 1. Korintským - Pokora a jednota církve (94. díl)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková; Premiéra: 18.10.2026 * Co znamená přikrývání vlasů ženy při modlitbě a zvěstování evangelia? A proč Pavel spojuje tuto otázku s Božím řádem, pokorou a vzájemným respektem? V pořadu Studna slova pokračuje kazatel Jiří Hurta v tématu přikrývání hlavy u žen tentokrát z pohledu pokory a jednoty církve. K zamyšlení nad pokorou, jednotou a svobodou v církvi zveme po tři čtvrtě na osm.'
