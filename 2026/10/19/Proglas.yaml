  description: 'Autor: Jiří Holeček, Daniel Blažke; Interpret: doc. Ing. Pavel Kopeček, Th.D.; Premiéra: 10.3.2025 * Jak se modlí breviář a proč by nás to mělo zajímat? O historii i současné praxi této modlitby si budeme povídat s docentem Pavlem Kopečkem z Cyrilometodějské teologické fakulty. Prozradí, co obnáší závazek kněží modlit se breviář, jaké kuriozity se s ním pojí a jestli je to jen ?modlitba“, nebo i radost.'
