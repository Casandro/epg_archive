  title: Čaj do páté
  subtitle: Swing, to mě baví - Brněnští jazzmani Jiří Suchý a Vincenc Kummer slaví 85. narozeniny koncertem na Proglasu (2. díl)
  description: 'Autor: Josef Javůrek; Interpret: Jiří Suchý, Vincenc Kummer, Jaroslav Zvoník, Ladislav Káňa, Roman Kobiela, Josef Javůrek * Speciální díl pořadu Čaj do páté z koncertního studia Proglasu, který výjimečně připravil Josef Javůrek, oslaví 85. narozeniny jazzového saxofonisty a zpěváka Jiřího Suchého a kontrabasisty Vincence Kummera. Ti vystoupí se svou skupinou Breeze Band. Posluchači se mohou seznámit s životním příběhem obou oslavenců prostřednictvím historek z jejich pestrého života plného zážitků. Premiéru druhého dílu pořadu můžete poslouchat v pondělí 19. října v 16 hodin.'
  genre:
  - '99'
