- eventId: 726903
  start: 2026-10-19T03:57:00Z
  stop: 2026-10-19T04:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1019 - Potenciál, co je uvnitř (293. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Znám jednu holčičku. Nechodí ještě do školy, protože má odklad. Není právě komunikativní, ačkoli se mi zdá, že se dokáže domluvit, když chce. V jejím věku bývají holčejak se jí přiblížit, ale ona mě ignoruje. Maximálně mě pozdraví, ale nestane se to vždycky. Mám ráda její rodiče, a tak je to pro mne nepříjemná a nepohodlná situace.Dnes se mi o ní zdálo. Viděla jsem ji, jak se snaží těmi seho, hlubokého, nad čím by se ostatním zatajil dech, avšak cítila, že to nikdo nevidí. Možná se i trochu bála, že se jí lidé vysmějí. Snad i přemýšlela o tom, že ji lidé nebudou mít rádi, když ona neumí hezky tančit. Bylo mi jí líto, ale nevěděla jsem, co dělat. Pak se mi zazdálo, že vidím ještě něco. Jako by uvnitř té holčičky žil pták podobný plameňáku. Byl s ní jedna bytost. Pohyboval křídly, když ona mávala rukama, poskakoval jejíma nohamejaké záhady, spočítá tajemství vzdálené hvězdy nebo pojmenuje nový dosud neznámý druh exotického motýla. Třeba vynikne ve sportu a bude nejlepší široko daleko. Není v ní ukrytá malířka, sochařka nebo básnířka? Ještě to není vidět, ale něco v ní dřímá, něco tam žije, a to ji možná činí neklidnou. Cítí, že by chtěla vzlétnout, ale její perutě jsou zatím slabé, nejde to. V tom snovém obrazu mi připadala nesmírně křehká a silná zároveň, jen to ještě zvenku není pořádně rozpoznatelné. Teprve až jsem uviděla toho krásného plachého ptáka, co se postupně odívá modrým peřím, pochopila jsem. Musím být opatrná, abych ho nevyplašila.'
