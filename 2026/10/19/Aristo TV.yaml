  title: OnlineKirche mit Pastor Gert Hoinle - Überfordert? In dir steckt mehr als du denkst
  description: Unsicherheit macht unentschlossen. Unentschlossenheit macht schlechte Laune und erzeugt Überforderungsgefühle. Doch Gott hat für deine "Lebensreise" alles eingepackt, was du brauchst. Er hilft dir, wenn du dich im Herzen zu ihm zurückwendest. Gideon hat das eindrücklich erfahren. Pastor Gert öffnet die Bibel und schaut nach, wie Gideon vom unsicheren Jüngling zum Triumphator wurde.
  widescreen: true
