  title: ANIXE auf Reisen - Nagasaki Teil 1
  description: Japan ist ein Staat mit circa 6500 Inseln. Der Schauspieler Michael Roll interessiert sich für die Insel Kyushu, ganz im Süden des Archipels. Nach einem Zwischenstopp in Tokio, Hauptstadt und Wirtschaftszentrum Japans, führt die Reise nach Nagasaki. Die Stadt mit heute etwa 420.000 Einwohnern ist nach den Zerstörungen durch die Atombombe 1945 wieder aufgebaut worden. Zahlreiche Sehenswürdigkeiten wurden weitgehend so wieder hergestellt wie vor dem 2. Weltkrieg.  Dabei ist Nagasaki eine freundliche und weltoffene Stadt geblieben. Schon im 16. Jahrhundert kamen Portugiesen, Chinesen und Niederländer und trieben Handel mit der japanischen Bevölkerung. Besonderen Einfluss übten die portugiesischen und spanischen Missionare aus. Ihre Missionstätigkeit war so erfolgreich, dass selbst viele japanische Fürsten konvertierten. Allerdings löste diese Entwicklung aber bald eine Christenverfolgung aus, die mehr als 200 Jahre andauerte. Michael Roll geht bei seinen Streifzügen dieser dramatischen Geschichte nach.
  widescreen: true
