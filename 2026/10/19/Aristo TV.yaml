  title: ERF Mensch Gott - Gott gibt _s echt! - Meine Seele war überfordert
  description: 'Die Freundin macht Schluss. Ein Freund wird tot im Fluss gefunden. Und dann ein Anruf: Seiner Mama geht''s nicht gut. Sie wird bald sterben. Drei Schocknachrichten innerhalb kürzester Zeit. Dominik ist total überfordert. Mit Trauer umzugehen, hat er nie gelernt. Das Einzige, was ihm einfällt: Sich mit Drogen wegballern. Nach einer Überdosis K.O-Tropfen wird er bewusstlos in seiner Wohnung gefunden. Doch es dauert noch einige Zeit, bis er sich eingestehen kann: Ich brauche Hilfe.'
