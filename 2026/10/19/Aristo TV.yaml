  title: ERF Mensch Gott - Gott gibt _s echt! - Wer bin ich noch, wenn ich scheitere?
  description: 'Vivien träumt von einem perfekten Leben. Für sie bedeutet das: Eine glückliche Ehe, beruflichen Erfolg und Kinder. Fremdgehen war in diesem Idealbild nicht vorgesehen. Doch was nicht passieren durfte passiert: Ihr Mann betrügt sie. Kurz darauf verliert sie auch ihren Job. Mit 27 ist sie geschieden und arbeitslos. Aus Scham zieht sie sich zurück und fragt sich: Wer bin ich noch, wenn ich so gescheitert bin?'
  widescreen: true
