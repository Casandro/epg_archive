  title: ARD Konzert
  description: |-
    "Wieniawskis 1. Violinkonzert gehört mit den Paganini-Konzerten zu den technisch herausforderndsten Konzerten", bestätigt auch Julia Fischer. "Tatsächlich habe ich dieses Konzert bislang nie gespielt, sodass es eine Premiere mit dem hr-Sinfonieorchester sein wird - worauf ich mich sehr freue."
    Auf Beethoven und konkret auf seine 5. Sinfonie, die sogenannte "Schicksals-Sinfonie", bezieht sich Esteban Benzecry mit "Latinthoven V". Darin "tauchen bestimmte unverkennbar Beethoven'sche Motive wieder auf", so der in Lissabon geborene argentinisch-französische Komponist über sein neuestes Orchesterwerk, "transformiert und in eine andere Klanglandschaft versetzt: in einen üppigen, rhythmischen tropischen Dschungel, als würde Beethoven selbst eine imaginäre Reise durch Amerika unternehmen."
    <strong>Esteban Benzecry<br/></strong>Latinthoven V (Auftragswerk des hr - Uraufführung)
    <strong>Henryk Wieniawski<br/></strong>1. Violinkonzert fis-Moll op. 14
    <strong>Ludwig van Beethoven<br/></strong>5. Sinfonie c-Moll op. 67
    <strong>Julia Fischer</strong>, Violine<br/><strong>hr-Sinfonieorchester</strong><br/>Leitung:<strong> Alain Altinoglu</strong>
    (Aufnahme vom 18. September 2026 aus der Alten Oper Frankfurt)
