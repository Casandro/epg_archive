  title: ARD Jazz
  description: '"Eine Sendung wie eine Insel. Draußen herrscht hoher Seegang, aber was im Hier und Jetzt zählt, das sind handverlesene Töne, die in die Ohren des Publikums tropfen". Das schrieb 2022 die Grimme-Jury in ihrer Begründung dafür, dass "Hören wir Gutes und reden darüber!" den Deutschen Radiopreis als "Beste Sendung" erhielt. Wir nehmen Sie mit auf diese Hör-Insel! Jede und jeder stellt ein neues Jazzalbum vor, ohne den anderen vorher zu verraten, worum es sich handelt. Hören, rätseln und laut nachdenken über Töne - darum geht es bei "Hören wir Gutes". Lassen Sie sich überraschen!'
  subtitle: Hören wir Gutes und reden darüber!, Vol. 67
