  start: 2026-10-19T02:05:00Z
  stop: 2026-10-19T02:33:00Z
  title: Laboratoř
  description: Proč se hadí embrya před narozením stáčejí doprava? Jak se dá změřit teplota tyranosaurům? Jak si skokani poradí při nedostatku výživy? Debatují evoluční biolog Lukáš Kratochvíl, herpetolog Václav Gvoždík a student Filip Mészároš.
- eventId: 877475
  start: 2026-10-19T02:33:00Z
  stop: 2026-10-19T03:00:00Z
  title: Osobnost Plus
  description: Petr Hruška, básník. Literatura se může podílet na relativním znormálnění světového šílenství už jen proto, že četba knihy člověka zpomaluje, funguje jako záchranná brzda, soudí spisovatel, který Česko reprezentoval na Mezinárodním knižním veletrhu ve Frankfurtu nad Mohanem. Jakou roli může hrát báseň ve válečném světě? A jak to myslí, když říká, že banalita a zázrak se vždycky tahají spolu? Moderuje Světlana Witowská.
