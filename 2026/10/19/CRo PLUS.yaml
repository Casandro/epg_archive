  subtitle: Dva hosté, dva různé pohledy
  description: Boj o dlouhodobý rozpočet EU pokračuje. Spory unijních států o to, kam v příštích sedmi letech směřovat peníze Evropské unie, trvají i po právě skončeném summitu. Mělo by se zásadně škrtat a ubrat peníze zemědělcům a chudším zemím, jak požaduje šest států v čele s Německem? Nebo jsou škrty nepřípustné, jak varuje skupina známá jako Přátelé koheze, do které patří i Česko? A jak velkým rizikem pro Prahu je Evropskou komisí potvrzený potenciální střet zájmů premiéra Andreje Babiše? Debatovat budou europoslankyně hnutí ANO z frakce Patrioti pro Evropu Jaroslava Pokorná Jermanová a europoslankyně hnutí STAN z lidovecké frakce Danuše Nerudová. Moderuje Lukáš Matoška.
