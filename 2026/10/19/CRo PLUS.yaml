  start: 2026-10-19T01:05:00Z
  stop: 2026-10-19T01:33:00Z
  title: Leonardo Plus
  description: Jak fungují mikrobiální společenstva v půdě? Co se s pomocí softwaru můžeme dozvědět o rozšíření hub ve světě? Jak se programuje počítačová hra o houbách? Hostem Leonarda Plus je Tomáš Větrovský, který zkoumá mikrobiální společenstva v půdě a je také herní vývojář.
- eventId: 877472
  start: 2026-10-19T01:33:00Z
