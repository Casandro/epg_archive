  title: Reportáže zahraničních zpravodajů
  description: Německá televizní tvorba zrodila vícero legend, a jednou z nich je nepochybně vrchní komisař Schimanski. Nepál, to je velmi barevný a zajímavý svět bohů a náboženství, my si představíme Živoucí bohyni. Přiblížíme si premiéru filmu, který si pokládá otázku, jestli má důstojnost větší hodnotu než život. Doznání od režiséra Václava Marhoula. Hrnčířský kruh, rozpálená pec a štětce, se kterými se musí pracovat s milimetrovou přesností, takhle vzniká tradiční slovenská malovaná keramika.
