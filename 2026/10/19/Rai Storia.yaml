  title: Ritorno al presente.Ritorno a Zingonia
  subtitle: 'Che fine ha fatto Zingonia? La città ideale costruita dal finanziere e imprenditore Renzo Zingone a metà degli anni ''60 in una zona della provincia di Bergamo. Era la prima città satellite italiana: zona ind'
  description: |-
    ustriale e area urbanistica insieme, con i lavoratori che finalmente potevano risiedere accanto alle unità produttive e contemporaneamente disporre di tutti i servizi. 1000 stabilimenti industriali e 50 mila abitanti previsti. Oggi l'immagine di Zingonia che rimbalza dai telegiornali e dalle pagine dei quotidiani è quella di una `Lampedusa del nord', un ghetto per extracomunitari, o peggio ancora un Bronx dove regnano incontrastati lo spaccio e la prostituzione. "Ritorno al presente" torna in questa "città utopica" per raccontare la storia di questo singolare esperimento urbanistico e sociale. - (2011)
    Di Giuseppe Giannotti
