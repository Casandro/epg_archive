  title: 'Rosamunde Pilcher: Duch z Cassley 1 (odc. 142)'
  subtitle: 'Riley Owen, osobisty ochroniarz, otrzymuje nietypowe zlecenie: ma strzec młodej wdowy, Lady Anjali Cassley, przed rzekomym duchem. Matka Anjali chce wydać córkę ponownie za mąż.'
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Das Gespenst von Cassley
    DE, 2017
    Reżyseria: Marco Serafini
    Występują: Patricia Meeden, Martin Gruber, André Eisermann, Michael Roll, Claudia Wenzel, Sima Bürgin
    Ochroniarz osobisty, Riley Owen dostaje dziwne zlecenie. Ma chronić młodą wdowę, Lady Anjali Cassley, przed duchem. Uważa, że zlecenie jest niepoważne, lecz mimo to decyduje się je przyjąć, ma bowiem spore długi do spłacenia. Matka Anjali chce wydać córkę ponownie za mąż. Ochroniarz szybko się domyśla, o co w tym wszystkim chodzi, i stara się pomóc pięknej Anjali, mieszkającej w zamku razem z rodzicami zmarłego męża - Susan i Duncanem Cassleyem.
  ageRating: 12
  genre:
  - '22'
- eventId: 745154
  start: 2026-10-19T19:50:00Z
  stop: 2026-10-19T21:35:00Z
  title: 'Rosamunde Pilcher: Miasto, wieś, pocałunek 1 (odc. 158)'
  subtitle: Flora kocha swojego syna, ponad wszystko, jednak ten przysparza swojej matce kłopotów związanych ze szkolnymi wybrykami.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Stadt, Land, Kuss
    DE, 2021
    Reżyseria: Stefan Bartmann
    Występują: Pina Kühr, Ian Thomas McMillan, Günther Maria Halmer, Heike Trinker, Leonard Conrads, Giles Cooper
    Flora kocha Luke, swojego syna, ponad wszystko. Jednak Luke, bystry nastolatek z łagodnym ADHD, nieustannie przysparza swojej matce kłopotów związanych ze szkolnymi wybrykami. Dyrekcja szkoły i szkolna psycholożka radzą Florze, żeby w czasie wakacji zapewniła synowi przede wszystkim spokój i dużo ruchu. Flora postanawia spędzić z synem letnie wakacje u swojej matki w Kornwalii. Flora i jej matka-artystka nie wytrzymują ze sobą nawet jednego weekendu.
  ageRating: 12
  genre:
  - '22'
