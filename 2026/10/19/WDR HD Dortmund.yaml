  description: '"Pretty fucking beige", antworten Deadletter auf die Frage, wie ihr Sound zu beschreiben ist. Die sechsköpfige Band aus Südwest-London zelebriert einen selten gewordenen Style zwischen Art-Rock, Dance-Punk und den Trademarks des Garage-Rock-Revivals der frühen 2000er. Trotz dieser Einflüsse klingt die Band zeitgemäß.'
