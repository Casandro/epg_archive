  title: kulturMONTAG
  description: "Auf Achse\nVon Liverpool bis nach Tahiti - von Beginn an hatte Beatle George Harrison seine Pentax immer dabei und dokumentierte den Weg der Kultband on tour, aber auch abseits vom Rampenlicht. Jetzt erscheint der Fotoband \"The Third Eye\".\nAls untote Aristokratin reiste Elisabeth Báthory im 17. Jahrhundert durch die österreichische Hauptstadt und erledigte mit einem Biss ihre Opfer. Diese historische Vorlage hat Regisseurin Ulrike Ottinger als Vorlage zu ihrer morbiden, schwarzhumorigen Gesellschaftssatire inspiriert. In \"Die Blutgräfin\", die bei der Viennale präsentiert wird spielt Isabelle Huppert lustvoll die Titelfigur, Birgit Minichmayr ihre Zofe, die sie liebevoll \"Würgeschatzl\" nennt. \nWohin die politische Reise in den USA geht, wird sich Anfang November bei den \"Midterms\" herausstellen. Über Trumps Republikaner und die Chancen der Demokraten haben sich die US-amerikanischen Autoren Richard Ford und Dave Eggers für den \"kulturMONTAG\" Gedanken gemacht.\nModeration: Clarissa Stadler"
  genre:
  - '122'
- eventId: 871752
  start: 2026-10-19T20:31:54Z
  stop: 2026-10-19T21:26:54Z
  title: kulturMONTAG
  description: "Auf Achse\nVon Liverpool bis nach Tahiti - von Beginn an hatte Beatle George Harrison seine Pentax immer dabei und dokumentierte den Weg der Kultband on tour, aber auch abseits vom Rampenlicht. Jetzt erscheint der Fotoband \"The Third Eye\".\nAls untote Aristokratin reiste Elisabeth Báthory im 17. Jahrhundert durch die österreichische Hauptstadt und erledigte mit einem Biss ihre Opfer. Diese historische Vorlage hat Regisseurin Ulrike Ottinger als Vorlage zu ihrer morbiden, schwarzhumorigen Gesellschaftssatire inspiriert. In \"Die Blutgräfin\", die bei der Viennale präsentiert wird spielt Isabelle Huppert lustvoll die Titelfigur, Birgit Minichmayr ihre Zofe, die sie liebevoll \"Würgeschatzl\" nennt. \nWohin die politische Reise in den USA geht, wird sich Anfang November bei den \"Midterms\" herausstellen. Über Trumps Republikaner und die Chancen der Demokraten haben sich die US-amerikanischen Autoren Richard Ford und Dave Eggers für den \"kulturMONTAG\" Gedanken gemacht.\nModeration: Clarissa Stadler"
