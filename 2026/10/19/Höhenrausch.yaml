- eventId: 843307
  start: 2026-10-19T07:45:00Z
  stop: 2026-10-19T08:32:00Z
  title: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  subtitle: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  description: 'Bergwelten: Es ist das einzige Land dieser Erde, in dem das Glück seiner Bewohner in der Verfassung verankert ist! BHUTAN: durch dieses kleine Königreich, eingebettet zwischen China und Indien, trekken die beiden Top-Alpinisten Heli Putz und Gerlinde Kaltenbrunner diesmal für BERGWELTEN und tauchen tief in dieses noch immer geheimnisvolle Land am Rande des Himalaya ein. Eine Reise von den Stromschnellen des Si Chhu, vorbei am Taktsang-Kloster, bis zum 7.326 Meter hohen Jomolhari. Mit jungen, einheimischen Abenteurern befährt Heli Putz die Stromschnellen des Si Chhu und mit lokalen Kletterfreaks gelingen ihm Erstbegehungen an den überhängenden Felsen von Thimphu. Wer nicht mit Pfeil und Bogen umzugehen vertsteht, ist kein echter Bhutaner. Bogenschießen ist Nationalsport in Bhutan, und Heli Putz darf außer Konkurrenz am Bogenturnier von Bhumtang teilnehmen. Mit Gerlinde Kaltenbrunner, die aus Nepal kommend auf das BERGWELTEN-Team trifft, trekkt Heli Putz schließlich zum 7.326 Meter hohen Jomolhari, dessen Gipfel - wie alle anderen Berggipfel in Bhutan auch - heilig ist und nicht bestiegen werden darf. Ein Verzicht, der diesem Abenteuer aber keinen Abbruch tut. Atemberaubende Bilder, auch aus dem Helikopter, zeigen eine Bergwelt von ausnehmender Schönheit und ein Land, dessen Menschen versuchen in Bescheidenheit glücklich zu sein. AT 2020'
- eventId: 843308
  start: 2026-10-19T08:35:00Z
  stop: 2026-10-19T08:59:00Z
  title: Ultimate Rush - Scoping the Line
  subtitle: Ultimate Rush - Scoping the Line
  description: 'Ultimate Rush: Athleten wie der Extrem-Kajaker Steve Fisher, Freerider Kaj Zackrisson und Mountain Biker Wade Simmons suchen stets nach außergewöhnlichen Landschaften, um die "Perfect Line" zu finden. So hinterlassen Freeskier auf steilen Abhängen ihre Spur, während Kajaker gewaltige Wasserfälle hinabstürzen, und Downhill Biker ihren Weg durch dichte Wälder bahnen. Während die BASE Jumper ihre unsichtbare Line in den unendlichen Horizont zeichnen. US 2012'
- eventId: 843319
  start: 2026-10-19T09:00:00Z
  stop: 2026-10-19T09:24:00Z
  title: Ultimate Rush - Epic Pow
  subtitle: Ultimate Rush - Epic Pow
  description: 'Ultimate Rush: Freerider James Heim, Mark Abma und Eric "Hoji" Hjorleifson begeben sich beim Skitourengehen im Hochgebirge auf die Suche nach einzigartigem Pulverschnee, den sie "Epic Pow" nennen. Dabei treffen sie auf verschiedenste Schneeformationen. In den Bergen von British Columbia warten nicht nur extreme sportliche Herausforderungen und gewaltige Naturschönheiten auf die Drei, sondern auch unberechenbare Gefahren. AT 2012'
- eventId: 843320
  start: 2026-10-19T09:25:00Z
  stop: 2026-10-19T09:49:00Z
  title: Ultimate Rush - Bralorne
  subtitle: Ultimate Rush - Bralorne
  description: 'Ultimate Rush: Einige der weltbesten Skifahrer, darunter Rory Bushfield, James Heim, Eric Hjorleifson, Mark Abma und Sean Pettit, reisen nach Bralorne, der kleinen Goldgräberstadt in British Columbia, wo eine Fülle überwältigender Abfahrten auf sie wartet. Die Wetterbedingungen sind nicht perfekt, doch als der Himmel aufreißt, ist keiner mehr zu bremsen. AT 2012'
