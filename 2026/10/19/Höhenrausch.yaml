  title: Faszination Heimat - Ein Krimi
  subtitle: Faszination Heimat - Ein Krimi
  description: Friedrich Ani ist der Sohn eines Syrers und einer Schlesierin. Eine ungewöhnliche Konstellation. Doch das allein macht den Autoren sicher noch nicht zu dem Ausnahmetalent für den deutschsprachigen Kriminalroman. Bekannt ist Friedrich Ani für seinen Ermittler "Tabor Süden" der sich ganz der Suche nach vermissten Personen verschrieben hat. Dabei legt sein Anis Ermittler ein Tempo vor, das mit bestem Gewissen als sehr langsam bezeichnet werden kann. Dafür zeichnet "Tabor Süden" etwas aus, das andere Kriminellen schon lange verlernt haben. Er schaut ganz genau hin. So löst er mit Hilfe seiner genauen Betrachtungen Fälle, die Andere für unlösbar gehalten haben. Das Porträt des ungewöhnlichen Autoren Friedrich Ani stellt einen Menschen vor, der auch als Autor neue Wege geht. AT 2014
