    Aukcje schowków magazynowych, to prawdziwa gratka dla łowców skarbów. Porzucone, często zapomniane magazyny potrafią skrywać unikatowe przedmioty o które walczą licytujący. Po otwarciu drzwi magazynu, uczestnicy aukcji mają tylko pięć minut na obejrzenie jego zawartości. Ulubiony bohater widzów "Wojen magazynowych" - Barry Weiss przedstawia najlepsze momenty programu wybrane z poprzednich sezonów.
