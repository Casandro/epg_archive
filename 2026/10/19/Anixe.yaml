  title: OnlineKirche mit Pastor Gert Hoinle - Die Wahrheit über den Himmel
  subtitle: OnlineKirche mit Pastor Gert Hoinle - Die Wahrheit über den Himmel
  description: Nicht alle haben am Ende ihres Lebens eine gute Zeit. Lazarus aus Lukas 16 starb arm und krank. Er kam wohl erst spät zum Glauben, hielt aber dann an ihm fest. Kaum war Lazarus tot, entschädigte der Herr ihn für sein Leiden mit Gutem. Was erwartet uns nach dem Tod? Wie sieht der Himmel aus? Wie werden wir wohnen? Wie wird sich unser Tagesablauf gestalten? Da viele Vorstellungen, die wir landläufig vom Himmel haben, mehr in den Vorstellungen des Griechen Plato wurzeln als in der Bibel, lohnt sich da ein genauerer Blick.
