  title: Hubert und Staller
  subtitle: Wenn's läuft, dann läuft's
  description: "Die hübsche Blondine Christine ist ein echter Volltreffer, das steht für Yazid bereits nach dem ersten Date in einer Gaststätte fest. Doch mit der ewigen Liebe wird es nichts, denn Christine ist bereits kurz nach dem Rendezvous tot. Yazid findet ihre Leiche auf dem Parkplatz vor dem Lokal, in dem er seine Traumfrau traf. Als Yazid im Affekt die Tatwaffe aufhebt und mit dem Messer in der Hand gesehen wird, steckt das ansonsten um keine Ausrede verlegene Schlitzohr in ernsten Schwierigkeiten. Hubert und Staller wollen ihrem Freund beistehen und übernehmen den Fall. Ihre erste Spur führt die Ermittler zur Treuetest-Agentur \"Herzblut\", die die Ermordete gemeinsam mit Nina Schulz betrieben hatte. Die beiden Frauen haben dort liierte Männer auf ihre Bereitschaft zum Seitensprung getestet. Tatsächlich war Christine bei Yazid nur als Lockvogel, also beruflich, unterwegs. Auftraggeberin war Yazids neue Freundin Angie, die feststellen wollte, woran sie bei ihm ist. Bald finden Hubert und Staller ein weiteres Paar, dessen Beziehung durch Treuetesterin Christine geprüft wurde - und dadurch in die Brüche ging. \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.\nKrimi, Deutschland 2016, R: Holger Gimpel"
