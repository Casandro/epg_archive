  title: Terra Mater - Skandinavien
  subtitle: Schweden - Wildnis im Wandel
  description: Schwedens Natur ist die große Leidenschaft des ungarischen Naturfilmers Zoltán Török. Vor 25 Jahren begann er, die Tierwelt des skandinavischen Landes mit seiner Kamera einzufangen. Später durchwanderte er mit seiner Frau und seinen beiden Töchtern das Land und ist so hautnah Augenzeuge der gewaltigen Veränderungen geworden. Zoltán Töröks persönliches Naturporträt Schwedens ist eine Bestandsaufnahme des Hohen Nordens Europas. Die Region verändert sich so schnell wie keine andere des Kontinents. Noch ist die Zukunft ungewiss, aber der Klimawandel birgt hier Chancen wie Risiken zugleich.Deutschland 2024
