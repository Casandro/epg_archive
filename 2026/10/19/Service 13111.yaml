  title: TM Wissen
  subtitle: Schlau gefrühstückt? - wie das richtige Essen unsere Denkleistung boostet und mehr
  description: 'Unser Frühstück steuert mehr, als wir denken - es prägt Körper, Geist und Entscheidungen. Käse und Joghurt oder doch Marmelade und Äpfel? Eine Studie der MedUni Wien zeigt: Was wir essen, beeinflusst Gehirnleistung und Risikobereitschaft. Die Ergebnisse überraschen - Ernährung verändert, wie wir denken und handeln // Kreatin gilt als Geheimtipp für schnelle Muskelzunahme und mehr Leistung im Kraftsport. Doch wie viel Wahrheit steckt hinter den Versprechen der Hersteller, für wen ist Kreatin sinnvoll, und wer kann getrost darauf verzichten? TM Wissen Reporterin und Ernährungswissenschaftlerin Iris Pohl geht der Sache auf den Grund // Weltweit speichern Moore doppelt so viel Kohlenstoff wie alle Wälder zusammen und schützen vor Überschwemmungen. Doch jahrhundertelanger Torfabbau hat viele dieser einzigartigen Ökosysteme zerstört. Im Schremser Hochmoor in Niederösterreich kämpfen zwei Naturschützer darum, diesen wertvollen Lebensraum wiederzubeleben - mit ersten Erfolgen // Die Jahresringe eines Baumes verraten nicht nur sein Alter, sondern erzählen auch von Stürmen, Dürre und Wendepunkten im Klima. Forscher entschlüsseln diese Geschichten, um Einblicke in die Vergangenheit zu gewinnen und die Zukunft besser vorherzusagen. Ihre Erkenntnisse könnten unsere Wälder vor den Folgen des Klimawandels schützen. // "TM Wissen" erklärt Phänomene des Alltags und beleuchtet neuste Trends aus Forschung und Wissenschaft. Mit Astro-Physiker Gernot Grömer präsentiert das Team von "TM Wissen" jede Woche spannende Ideen und Erfindungen, die unsere Welt besser machen.Österreich 2025'
