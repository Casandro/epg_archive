  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Aus dem Ozean
  description: |-
    Über 70 Prozent der Erdoberfläche sind von Wasser bedeckt. Ein Großteil der Ozeane ist noch nicht erkundet worden. Versteckt in den Tiefen unserer Weltmeere könnten erstaunliche Wesen leben, die bisher noch nicht entdeckt und erforscht wurden. Zu den seltsamsten Tierarten zählen etwa die Oktopoden, die auch im ausgewachsenen Alter ihre DNA verändern können und bioluminiszente Tiere, die ihr gesamtes Gehirn nach einem Verlust wieder herstellen können. Quallen stellen die Wissenschaft vor weitere Rätsel, denn sie leben beinahe ewig. Dabei sind auch noch nicht alle in den Ozeanen lebenden Tierarten erforscht worden. Die Theoretiker der Prä-Astronautik sind überzeugt, dass Außerirdische bereits mehrfach die Erde besucht haben und in den Weltmeeren Spuren für ihre Existenz hinterlassen haben. Könnten unsere Ozeane womöglich ein Experimentierfeld für Außerirdische sein, die genetische Experimente auf der Erde durchführen?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2019
