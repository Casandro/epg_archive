  title: Vom Westallgäu bis zum Bodensee (Wh.)
  subtitle: Ausbildung im Allgäu - drei Betriebe, viele Wege in den Beruf
  description: Welche Chancen bietet eine Ausbildung heute und wie sieht der Arbeitsalltag von Auszubildenden aus? Wir sprechen mit der Arbeitsagentur in Kempten über die aktuelle Situation und begleiten anschließend Azubis bei Baldauf Käse in Lindenberg und bei Buhmann Systeme in Weiler. Dabei lernen wir verschiedene Ausbildungsberufe kennen - Vom Industriemechaniker über die Kauffrau im Einzelhandel bis zum Fachinformatiker für Systemintegration. Außerdem erzählen die Auszubildenden, wie sie ihren Beruf gefunden haben und wie der Einstieg ins Arbeitsleben für sie läuft.
