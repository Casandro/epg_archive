- eventId: 852604
  start: 2026-10-19T05:41:00Z
  stop: 2026-10-19T06:08:00Z
  title: 'Mostovi: Američki junak Petar Tomich, dokumentarni film'
  subtitle: ' '
  description: Među prvim žrtvama iznenadnog japanskog napada na Pearl Harbour 7. prosinca 1941., kojim je počeo Drugi svjetski rat na Pacifiku, bio je američki bojni brod Utah. Pogođen s dva torpeda, naglo se počeo prevrtati, a samo je hrabrost i požrtvovnost šefa stroja, časničkog namjesnika Petra Tomicha, spriječila eksploziju kotlova i veće žrtve među posadom. Za svoj junački čin, u kojem je izgubio život, Tomich je posmrtno odlikovan najvišim američkim odlikovanjem za hrabrost, Kongresnom medaljom časti. Poslije šest i pol desetljeća jedna od rijetkih neuručenih Medalja časti dodijeljena je obitelji Petra Hercega Tonića na palubi najvećeg nosača zrakoplova američke ratne mornarice Enterprise usidrenim 2006. pred Splitom.
