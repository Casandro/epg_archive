  title: Kenjac, hrvatski film (12)
  subtitle: ' '
  description: Drama. Boro (Nebojša Glogovac) sa ženom Jasnom (Nataša Janjić) i sinom Lukom vraća se nakon sedam godina u svoje rodno mjesto Drinovce, selo u Hercegovini. Njegov brat (Emir Hadžihafizbegović) izišao je iz okupiranog Sarajeva. Božo zna da mu je brat ranjen, ali tek sada otkriva da je on za cijeli život prikovan za invalidska kolica. Uza sve, Boro je u neprekidnoj svađi sa suprugom Jasnom, a s ocem Paškom (Tonko Lonza), kojeg optužuje za majčinu smrt, uopće ne razgovora... Na Pula film festivalu "Kenjac" je osvojio Zlatnu arenu za najbolji scenarij, za kameru (Mirko Pivčević), i za glazbu (Srđan Gulić Gul). Stručna, filmska kritika je ovom filmu dodijelila nagradu Oktavijan.
