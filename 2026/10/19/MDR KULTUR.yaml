  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - 90. Geburtstag von Rolf Kuhrt\nIn Leipzig prägte er über Jahrzehnte die Grafiktradition an der Hochschule für Grafik und Buchkunst mit: Der Maler, Grafiker und Bildhauer Rolf Kuhrt. Heute wird vielen vor allem ein Werk bekannt sein, bei dem er nur mitgearbeitet hat. Das Relief \"Aufbruch\" - salopp \"Marx-Relief\" genannt. Inzwischen steht es auf dem Campus in der leipziger Jahnalle und wurde erst kürzlich restauriert. Doch Rolf Kuhrt war vor allem ein vielseitiger Grafiker, der fulminante Radierungen und Holzschnitte schuf, und als Professor an der Hochschule für Grafik und Buchkunst Leipzig Generationen von Künstlerinnen und Künstlern prägte. Heute wird Rolf Kuhrt 90 Jahre alt. Eva Gaeding mit einer Würdigung.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVin Tina Murzik-Kaufmann\n\n* 06:40 Uhr - Der Stichtag: 2001 Bundestag verabschiedet Prostitutionsgesetz\nIn seiner Sitzung vom 19. Oktober 2001 beschloß der Deutsche Bundestag das sogenannte Prostitutionsgesetz. Damit wurde die Sittenwidrigkeit der Prostitution in Deutschland weitgehend aufgehoben und Prostituierte erhielten rechtliche Ansprüche u.a. auf Lohn und Zugang zum Sozialversicherungssystem. Andreas Naumann mit einem Rückblick in unserem heutigen Stichtag.\n\n* 06:50 Uhr - Kulturtipp Film in Weimar/Jena\nVon Katrin Engelhardt\n\n* 07:10 Uhr - Museum der Westlausitz zur Disposition?\nIn der Lausitz entsteht derzeit ein Großforschungszentrum, des Deutsche Zentrum für Astrophysik. Noch befindet man sich in der Aufbauphase, unter anderem wird nach einem Ort gesucht für ein unterirdisches Labor, oder auch ein Observatorium, in dem dann das Einsteinteleskop stehen könnte. (Sollte die Lausitz den Zuschlag dafür erhalten.) Aber offenbar bietet die Lausitz durch das sogenannte Lausitzer Granitmassiv die ideale Ruhe, die man braucht, um kosmische Wellen auf oder besser unter der Erde zu analysieren. Mehr dazu, zu den Plänen des DZA und den Perspektiven für die Lausitz, erfährt man derzeit in einer Sonderausstellung im Museum der Westlausitz: ein Blick in die Zukunft der Region, während die Zukunft des Museum gerade zur Disposition steht, wie Grit Krause berichtet.  \n\n* 07:20 Uhr - Clare Sands Anam Cara\nClare Sands gilt als eine der eindrucksvollsten Stimmen Irlands. Ihr neues Album \"They try to bury us \" is gerade erschienen. Es beschreibt den jahrhunderte andauernden Freiheitskampf des irischen Volkes und ist geprägt von Mut und Furchtlosigkeit , aber auch von der tiefen Verbundenheit der Iren mit ihrer Tradition und Kultur.\nClare Sands hat in diesem Jahr auch einen Auftritt auf dem Rudolstadtfestival gehabt und war bei uns in der Studiosession zu Gast .  Und in dieser Session hat sie auch den Song \"Anam Cara\" vom Album \" They try to bry us\" gespielt. Alle Sessions aus Rudolstadt und auch das komplette Konzert von Clare Sands finden sie bei ARD Sounds.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVin Tina Murzik-Kaufmann\n\n* 07:40 Uhr - Feuilleton\nVon Wolfgang Schilling\n\n* 07:50 Uhr - MDR Kultur trifft Anne Hahn\nNoch bis zum 31. Oktober ist Anne Hahn Stadtschreiberin in Magdeburg, am Samstag war sie zu Gast bei MDR Kultur trifft. In Magdeburg wurde Anne Hahn 1966 geboren. Dort unternahm sie als junge Frau einen Fluchtversuch, der 1989 im Gefängnis endete. Heute lebt Anne Hahn in Berlin und fühlt sich zu Hause in der deutschen Sprache, an den Flüssen und am Meer."
