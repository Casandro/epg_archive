  description: "* 09:40 Uhr - Wort zum Tag\n \n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Der Stichtag: 2001 Bundestag verabschiedet Prostitutionsgesetz\nIn seiner Sitzung vom 19. Oktober 2001 beschloß der Deutsche Bundestag das sogenannte Prostitutionsgesetz. Damit wurde die Sittenwidrigkeit der Prostitution in Deutschland weitgehend aufgehoben und Prostituierte erhielten rechtliche Ansprüche u.a. auf Lohn und Zugang zum Sozialversicherungssystem. Andreas Naumann mit einem Rückblick in unserem heutigen Stichtag.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Tina Murzik-Kaufmann\n\n* 10:40 Uhr -  Vorschau: Ferientipps\nIn Sachsen z.B. können Kinder auf Burgen und Festungen  in vergangene Zeiten eintauchen, in Leipziger Museen tüfteln und Rätsel lösen. In Dresden, Chemnitz und Zwickau ist Kreativität gefragt. \nIn Sachsen-Anhalt können Familien Familien können sich durch verwinkelte Gartenanlagen wagen, auf Burgen Geschichte erleben, in Museen selbst aktiv werden oder faszinierende Lichtinstallationen bestaunen. \nUnd in Thüringen können Kinder z.B. in Goldisthal  den Wald erkunden, in Gera geheimnisvolle Fabeltiere kennenlernen und in Erfurt Kino und Theater erleben. Altenburg, Weimar und Sonneberg laden zum Kreativwerden ein, während Nordhausen und Meiningen spannende Zeitreisen in die Vergangenheit versprechen. Jeweils 20 spannende Ferientipps haben wir für Sie für jedes unserer drei Bundesländer im Netz zusammengestellt.\n\n* 10:50 Uhr - Das Gedicht: \"Epicyklus\" von Victor Auburtin.\nEr war ein Enkel des Leibkochs von Friedrich Wilhelm III. und galt als Gourmet: Victor Auburtin (französ.!!).\nAls er mit immerhin 40 Jahren endlich vom \"Berliner Tagblatt\" als Redakteur angestellt wurde, begann sein Siegeszug durch die deutsche Publizistik - seine feuilletonistischen Skizzen wurden populär wie Schlager. Die Berliner kauften das Blatt dieser Texte wegen. Und Kurt Tucholsky empfahl \"kleine Vorspeisen von Auburtin\". Diese Feuilletons wurden zu einem der Vorbilder für das literarisch-journalistische Genre. \nGedichte gibt es auch von Victor Auburtin, aus ihnen liest: Shenja Lacher.\n\n* 11:15 Uhr - Feuilleton\nVon Wolfgang Schilling\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 11:45 Uhr - Vorschau auf die Lesezeit \"Selig & Boggs\"\nWas wäre die Welt ohne Hollywood, ohne die Traumfabrik, die Oscars, den Walk of Fame, all die glitzernden Stars - so unersetzlich für unsere Daseinsfluchten ... Aber wie hat das eigentlich angefangen? Und vor allem, wieso ausgerechnet in Hollywood? Für die Antwort dieser Frage begeben wir uns nach Chicago in das Jahr 1910, wo ein Mann namens Francis Boggs gerade versucht, einen Film zu drehen. Einen der frühesten Filme namens \"The Sergeant\", mit den Schauspielern Hobart Bosworth, Tom Santschi und Frank Clark."
