  title: MDR KULTUR am Nachmittag (14:30-18 Uhr Mo-Fr)
  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 14:45 Uhr - Kulturtipps \n\n* 15:10 Uhr - 90. Geburtstag Rolf Kuhrt\nRolf Kuhrt (1936*) gehört zu den herausragenden Vertretern der zweiten Generation der \"Leipziger Schule\". Er studierte Mitte der fünfziger Jahre an der Hochschule für Grafik und Buchkunst Leipzig u.a. bei den Professoren Wolfgang Mattheuer und Bernhard Heisig. Nach dem absolvierten Studium begann seine langjährige Lehrtätigkeit als Dozent und Professor an derselben Hochschule. Seit 2001 lebt und arbeitet Kuhrt freiberuflich als Maler, Grafiker und Bildhauer in Kirch Rosin bei Güstrow. Von Eva Gaeding.\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 15:40 Uhr - Der Indikator für Artenvielfalt und Landschaftsqualität\nWie geht's der Natur? Und wie finden wir heraus, ob unsere Anstrengungen zum Naturschutz Erfolg haben? Diese Fragen werden auf der Weltnaturschutzkonferenz im armenischen Jerewan diskutiert. Wichtig auch: Gibt es Fortschritte im Kampf gegen das Artensterben?\nIn Deutschland haben wir einen Weg gefunden, wie wir die nachhaltige Entwicklung und Erfolge im Naturschutz abbilden können: mit einer Kennzahl für die Biodiversität. Max Fallert berichtet über den Indikator für Artenvielfalt und Landschaftsqualität. Von Max Fallert.\n\n* 16:10 Uhr - Eröffnung Hans Tutschku - Offene Räume aus Licht und Klang\nHans Tutschku (*1966 in Weimar) ist Komponist, Musiker und bildender Künstler. Seit mehr als vier Jahrzehnten erforscht er Klang als Material und räumliche Erfahrung. Die Ausstellung Offene Räume aus Licht und Klang in der ACC Galerie Weimar widmet seinem vielseitigen Schaffen erstmals in seiner Heimatstadt eine umfassende Präsentation. Von Ulrike Thielmann.\n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 16:40 Uhr - Kultur international\n\n* 17:10 Uhr - Projekt Götterhand: Sonnenheiligtum oder Laune der Natur?\nDer Herbstanfang beschert uns einen Tag, der genauso lang ist wie die Nacht - Tagnachtgleiche genannt. Das Phänomen kennt der Mensch seit Jahrtausenden. Nicht zuletzt die Himmelsscheibe von Nebra ist als sensationeller archäologischer Fund der handfeste Nachweis, wie präzise schon vor 3600 Jahren Sonne, Mond und Sterne in ihrem Verlauf erkannt - und religiös gedeutet wurden. Seit Jahren nun geht ein privates Team in der Oberlausitz der These nach, dass eine markante Felsformation bei Bautzen einst ein Sonnenheiligtum gewesen sein - ein prähistorisches Observatorium in vorchristlicher Zeit. Diesen sogenannte Teufelsstein von Pließkowitz hat sich Mario Süßenguth angeschaut und die verschiedenen Meinungen dazu gehört.\n\n* 17:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 17:40 Uhr - Hörbuch: Agatha Christie \"Vorhang\"\nInsgesamt sechsundsechzig packende Krimis hinterließ Agatha Christie. Seriösen Schätzungen zufolge verkauften sich davon bis heute weltweit rund zwei Milliarden Exemplare. Damit gilt die Britin als eine der erfolgreichsten Schriftstellerinnen aller Zeiten. Im Januar jährte sich der Todestag der Queen of Crime zum 50. Mal. Aus diesem Anlass erschien jetzt ihr 1975 entstandener Roman \"Vorhang\" als Hörbuch. Unser Kritiker Ulf Heise stellt es vor. \n\n\nDer Blick in die Welt bei MDR KULTUR international, aktuelle Berichte aus dem kulturellen und politischen Leben.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
