  description: "* 12:15 Uhr - Rezension \"Der Hase mit den Bernsteinaugen\" \n\"Der Hase mit den Bernsteinaugen\" findet am 17. Oktober 2026 an der Musikalischen Komödie der Oper Leipzig statt.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 12:45 Uhr - Vorschau: Hörspiel ARD Radio Tatort \"Mit dem Rücken zur Wand\nIm Hörspiel heute Abend gibt es hier bei uns im Programm einen neuen ARD Radio Tatort aus dem Saarland. \nEine ältere Dame taucht bei der Mordkommission in Saarlouis auf und lässt sich nicht abweisen, bis sie schließlich Hauptkommissar Michel Paquet sprechen kann. Das Haus, in dem sie seit vielen Jahren wohnt, wird saniert, und zwar gründlich. Was nicht nur bei ihr, sondern auch bei den anderen Bewohnern zu massiven Einschränkungen und größtem Ärger führt. Doch was soll der Kriminalkommissar da tun? Von Madeleine Giese.\n\n* 13:15 Uhr - Ferien WanderTipp - 20 Jahre Selketalstieg\nDer Wanderweg Selketal-Stieg führt Sie rund 70 km durch den Ostharz und das Selketal.\nDer Selketalstieg im Harz wird 20 Jahre alt - ein Fernwanderweg, der Naturidylle und Kulturgeschichte verbindet: vom Bahnhof Stiege durchs autofreie Selketal über Burg Falkenstein, Ballenstedt und Gernrode bis in die Welterbestadt Quedlinburg. Und alles entlang der Harzer Schmalspurbahn. Nicht nur zur Ferienzeit ein Tipp - findet natürlich der Harzer Tourismusverband, aber auch unsere Landeskorrespondentin Sandra Meyer, die ihn schon gewandert ist.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 13:45 Uhr -  Neue Musik von Heather Nova\nThe Orchard\", also \"Der Garten\" ist der Titel des neuen Heather Nova-Albums, das Ende diesen Monats erscheinen wird. Darauf: genau der Mix aus luftig-leichten Pop und Folk, der auch die letzten 13. Studioalben der auf den Bermuda Inseln lebenden Musikerin geprägt hat. Und bei dem Albumtitel mussten wir Heather Nova natürlich fragen, wie denn Ihr Garten zu Hause aussieht.\n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
