    Als Kreml-Chef rechnete er mit Stalin ab. Als Gegenspieler John F. Kennedys brachte er die Welt an den Rand des Abgrunds. Geheime Tonbandaufnahmen zeigen, was Chruschtschow wirklich dachte.

