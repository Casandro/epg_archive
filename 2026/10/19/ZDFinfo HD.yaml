    Die Geschichte der Wissenschaft ist männlich dominiert. Doch auch Frauen haben viel für die Forschung riskiert, für ihre Visionen gekämpft und nachfolgenden Generationen den Weg geebnet.

    Marie Curie, Dian Fossey und Elizabeth Fleischman sind nur drei Wissenschaftlerinnen, die vielfältige Hürden bewältigen mussten, um ihre Forschung voranzutreiben. Heute gelten sie als Ikonen auf ihren Spezialgebieten der Chemie und Physik, Zoologie und Medizin.
