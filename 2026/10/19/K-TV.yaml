  title: 'Thema: Märtyrer, Glaubenszeugen ... und ich? Zeugen der Wahrheit (1)'
  subtitle: Spiritualität
  description: Pater Dr. Anton Lässer CP, Internationaler Kirchlicher Assistent von KIRCHE IN NOT (ACN)Märtyrer gelten vielen als Gestalten aus den ersten Jahrhunderten des Christentums. Doch Christen werden auch heute wegen ihres Glaubens verfolgt und getötet. Pater Anton Lässer erinnert daran, dass christliches Zeugnis immer mit der Frage nach Wahrheit, Gewissen und Haltung verbunden ist. Ausgehend von Jesus Christus zeigt er, warum Christen ihren Glauben nicht verstecken sollten und weshalb Märtyrer bis heute Orientierung geben können. Ein Vortrag über Glaubensmut, Religionsfreiheit und die Kraft des christlichen Zeugnisses.
