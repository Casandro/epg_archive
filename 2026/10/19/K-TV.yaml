  title: Die Heilige Anna Schäffer - Ihr Leben und Leiden
  subtitle: Spiritualität
  description: Anna Schäffer führte bis zu ihrem 18. Lebensjahr ein äußerlich unauffälliges Leben, allerdings seit ihrem Erstkommuniontag  in enger Verbundenheit mit dem eucharistischen Jesus. Nach ihrem Unfall, der ihre Berufspläne zum Scheitern brachte, war der Rest ihres Lebens ein schwerer Kreuzweg, begleitet von ununterbrochenem Leid. Sie lernte es, im Kreuztragen mit Jesus Christus eins zu werden und an seiner Erlöserliebe teilzunehmen. Vortrag von Pfarrer Johann Bauer.
- eventId: 836972
  start: 2026-10-19T02:00:00Z
  stop: 2026-10-19T02:15:00Z
  title: Glaubenszeugnisse by @tini
  subtitle: Gespräch
  description: Eine Begegnung mit Gott kann alles verändern und von dieser Erfahrung gibt Tini Zeugnis. Gott lässt sich im Alltag finden und mit Impulsen über Tinis persönliches Glaubensleben möchten wir dich für dein Abenteuer mit Gott inspirieren! Dich erwarten außerdem neue Gesichter mit spannenden Geschichten. Lets share the good news and get ready for your godly meeting!
- eventId: 836973
  start: 2026-10-19T02:15:00Z
  stop: 2026-10-19T02:45:00Z
  title: Awaken - Erwachen (Kirchenkonzert Teil 2)
  subtitle: Unterhaltung
  description: Unter der Leitung des Dirigenten Thomas Wolf spielt das Sinfonische Blasorchester Leutkirch mit Solist KMD Franz Günthner an der großen Orgel in der Kirche St. Marin in Leutkirch im Allgäu. Neben bereits bekannten Werken wie dem "Benedictus" des englischen Komponisten Karl Jenkins, der "Interstellarsuite" von Hans Zimmer oder der "Star Wars Suite" von John Williams kommen auch das "Concertino" von Thomas Trachsel oder die Symphony Nr. 3 "Planet Earth" des niederländischen Meisters Johan de Meij zur Aufführung. Unter dem Motto "Awaken - Erwachen" werden christliche Themen wie Dunkelheit, Hoffnung, Auferstehung, Leben" von Pastoralreferent Benjamin Sigg inhaltlich mit der symphonischen Musik verknüpft. Zweiter von zwei Teilen.
- eventId: 836974
