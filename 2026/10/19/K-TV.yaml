  title: kommt & seht' 2026 in Köln - Katholischer Aufbruch in Deutschland
  subtitle: Dokumentation
  description: Fronleichnam ist eines der bedeutendsten Feste der katholischen Kirche und hat in Köln eine lange Tradition. In diesem Beitrag berichten wir über die Feierlichkeiten zum Fronleichnamsfest sowie über die zweite Eucharistische Konferenz "Kommt & Seht", die von Kardinal Rainer Maria Woelki im Erzbistum Köln initiiert wurde.Wir begleiten Gottesdienste, Vorträge und Begegnungen und sprechen mit spannenden Persönlichkeiten über ihren Glauben, die Bedeutung der Eucharistie und die Impulse der Konferenz für Kirche und Gesellschaft heute.
- eventId: 836976
  start: 2026-10-19T03:45:00Z
  stop: 2026-10-19T04:00:00Z
  title: Katholisch auf den Punkt I SONNTAGSPFLICHT - Muss ich zur Kirche?
  subtitle: Gespräch
  description: 'Wir klären, warum die Kirche den sonntäglichen Messbesuch als Pflicht und nicht als bloße Empfehlung versteht  und was das theologisch wirklich bedeutet.Wir diskutieren: Woher kommt die Sonntagspflicht überhaupt? Ist sie nur eine kirchenrechtliche Vorschrift oder hat sie einen tieferen geistlichen Sinn? Was bedeutet es, das dritte Gebot zu missachten  und wann gilt eine Entschuldigung? Warum ist der Sonntag mehr als ein freier Tag?Eine klare Auseinandersetzung mit einem oft missverstandenen Gebot des katholischen Glaubens  verständlich erklärt und fest im kirchlichen Lehramt verankert.'
