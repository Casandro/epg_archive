  title: 'Spirit: Das Ewige Leben - Was wissen wir darüber?'
  subtitle: Gespräch
  description: Der Glaube daran, dass unser Leben nicht mit dem Tod endet, ist vielleicht die größte Gemeinsamkeit zwischen allen Religionen. Und selbst nicht religiöse Menschen glauben bisweilen daran, dass nach dem Tod noch etwas kommt. Was aber ist die christliche Vorstellung vom "Ewigen Leben" und was können wir darüber überhaupt mit Sicherheit sagen? Diese und weitere Fragen bespricht Volker Niggewöhner mit dem Dogmatiker und Bioethiker Ralph Weimann.
