  title: VIP Trip - Prominente auf Reisen 4 - Nagasaki 3 mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 4 - Nagasaki 3 mit Oliver Hörner
  description: 'VIP Trip - Prominente auf Reisen 4: In dieser Episode ist der Hamburger Schauspieler Oliver Hörner wieder in Südjapan unterwegs. Ziel ist diesmal die Region um den Vulkan Unzen, der bis heute aktiv ist...auch wenn er gerade eine Ruhepause eingelegt hat. Der Unzen gehört trotzdem zu den gefährlichsten Vulkankomplexen in Japan. Bei seinen bisher letzten Eruptionen - zwischen 1991 und 1995 - kamen mehr als 40 Menschen ums Leben, die Zerstörungen waren riesig. Oliver Hörner erkundigt sich bei einem Seismologen über den aktuellen Status des Unzen und lässt sich erklären, welche Vorsichtsmaßnahmen zum Schutz der Bevölkerung getroffen worden sind. Dabei wird deutlich. Die Menschen leben bereits seit mehr als 1000 Jahren im Schatten des Vulkans, da sie von den fruchtbaren, mineralreichen Böden und den heißen Thermalquellen profitieren. Schließlich gründet sich die japanische Badekultur auf der wohltuenden und die Gesundheit fördernden Wirkung der heißen Quellen. Begleiten sie Oliver Hörner bei seinen Ausflügen am Unzen und werden Sie Zeuge, wie er auch bei einem Karaoke-Contest  eine gute Figur macht.        DE 2019'
