  title: Wanderlust! - An der Amalfiküste, Italien
  subtitle: Wanderlust! - An der Amalfiküste, Italien
  description: Südlich von Neapel erstreckt sich die Amalfiküste. Uralte Pfade verbinden traumhaft schöne Küstenorte, die auf eine reiche Geschichte zurückblicken. Steile Treppenwege führen durch Terrassen, auf denen die berühmte Amalfi-Zitrone kultiviert wird. Eine Woche ist Bradley Mayhew unterwegs entlang der Monti Lattari, der Milchberge. Für anstrengende Auf- und Abstiege wird er mit grandiosen Aussichten belohnt. Die erste Station ist Positano, ein Fischerort, der in den Fünfzigerjahren vom Jetset entdeckt wurde. Hier ist Bradley mit Anna Naclerio verabredet, seiner Wanderpartnerin. Über 1.700 Stufen geht es hinauf ins Dorf Nocelle, wo der "Sentiero degli Dei" beginnt, der Weg der Götter. Spektakulär windet er sich die Steilküste entlang, bis heute genutzt von Hirten und Bauern. Ihren Namen hat die Küste von einem Ort, den einst der Orienthandel reich machte. Im frühen Mittelalter war Amalfi eine Seemacht. Amalfitanische Schiffe brachten auch die Technik der Papierherstellung aus dem Orient. Die ersten Papiermühlen Europas standen in Amalfi, und Familie Amatruda produziert noch wie früher. Immer wieder führt der Weg durch Gemüsegärten und Zitronenhaine, in denen die amalfitanischen Sfusato-Zitronen wachsen. Sie sind überraschend süß, hoch aromatisch und teuer. Von einem Händler erfährt Bradley das Rezept für Limoncello, den Zitronenlikör der Küste. In Ravello erkundet er Adelspaläste und streift durch den Garten der Villa Rufolo, Vorbild für den Zaubergarten in Richard Wagners Oper "Parsifal". Hoch oben in den Bergen verläuft die Etappe zum Fischerdorf Cetara, wo Anchovi mit Salz zu Fischsauce fermentiert werden. Nach dem römischen Rezept wird am ganzen Mittelmeer nur noch hier produziert. Der letzte Wandertag führt Bradley vor die Tore Palermos, nach Vietri sul Mare. Vom Touristengewühl hat er wenig mitbekommen, in den Bergen an der Amalfiküste atmet noch das ursprüngliche Italien. DE 2015
