  title: ARD Konzert - Julia Fischer und das hr-Sinfonieorchester in Frankfurt
  description: 'Die 5. Sinfonie eröffnet die Spielzeit, in die Ludwig van Beethovens 200. Todestag fällt. Die ersten Töne: Nichts weniger als die Erkennungsmelodie der klassischen Musik! Dazu passt ein Violinkonzert, das in Sachen Virtuosität ebenfalls einen Spitzenplatz einnimmt: Das 1. Violinkonzert von Henryk Wieniawski.'
