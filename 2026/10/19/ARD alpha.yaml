  description: '"Les Gammas! Les Gammas!" zeigt die Abenteuer der Besatzung eines außerirdischen Weltraumgefährts, das vom Sternbild Gamma kommend in Frankreich niedergeht. Die Gamms kommen aus einer scheinbar zurückgebliebenen technologielosen, Geld, Hast, Lärm und Krieg nicht kennenden Zivilisation. Sie verfügen über gewisse magische Kräfte, praktische Intelligenz und sprachliche Anpassungsfähigkeit. Sie können anfangs kein Wort Französisch, doch sie verstehen schnell, sprechen, was sie hören, häufig und mit Freude nach und halten einmal Gelerntes fest.'
