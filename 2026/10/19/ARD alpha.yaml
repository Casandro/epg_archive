  description: Wie kommt die Mode in Mode? Das möchte Willi heute herausfinden und trifft deshalb zwei Münchener Mode-Designer. Ihr Job ist es, Kleider zu entwerfen - auch nach Wunsch. Entscheidungshilfe und Stilberatung bekommt man vom Fachmann dazu. Die "normalen" Klamotten, die man im Kaufhaus kaufen kann, werden nicht maßgeschneidert, sondern stammen aus der Konfektionsindustrie. Die Schüler der Münchener Modeschule ESMOD präsentieren ihre Abschluss-Kollektion. Und Willi ist mindestens genauso nervös wie sie. Er darf nämlich mit auf den Laufsteg und den Entwurf einer Schülerin vorführen. Jetzt bloß nicht stolpern, Willi!
