  title: Wissen macht Ah!
  subtitle: In der BA(h!)n
  description: |-
    Die heutige Ausgabe von "Wissen macht Ah!" beginnt mit warten. Lange warten. Clarissa und Tarkan sitzen an einer einsamen Bahnhaltestelle - ohne Handyempfang. Und der Zug hat schon einen halben Tag Verspätung. Als endlich einer kommt, scheint es nicht der richtige zu sein. Schaffen es die beiden noch rechtzeitig zur Verabschiedung ins Ah!-Studio? Unterwegs werden wie gewohnt die fünf Fragen der Sendung beantwortet:
    * Wie wurde das WLAN erfunden?
    * Warum weiß keiner genau, wo Aale sich fortpflanzen?
    * Warum bleibt mein Handy-Display nie sauber?
    * Warum sind Rettungsdecken so dünn?
    * Warum hat jeder Mensch eine andere Stimme?
