  stop: 2026-10-19T08:00:00Z
  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\n?Seen and Unseen?: Sufismus in Deutschland \nEine Foto-Ausstellung im Frankfurter Römer befasst sich mit der Glaubenspraxis der Sufis in Deutschland. Der Sufismus ist eine mystische Strömung im Islam. Vor mehr als 30 Jahren sind die Lehren der Sufis auch in Deutschland angekommen. \n\nModerne am heiligen Feuer: Verbrennungsghat 2.0 in Varanasi\nDie indische Stadt Varanasi gilt als die heiligste Stadt des Hinduismus. Jedes Jahr pilgern Millionen von Hindus nach Varanasi, um dort zu sterben oder am Ufer des Ganges einen toten Angehörigen zu verbrennen. Jetzt soll eine der ältesten Einäscherungsstätte aufwendig saniert werden. Einige Hindus befürchten den Verlust von Traditionen, die Jahrtausende alt sind.\n\nBluesmessen in Ostberlin - Happenings unterm Kirchendach\nZwischen 1979 und 1987 organisierten einige Kirchen in Ostberlin Messen für Jugendliche mit Blues-, Rock- und Punkmusik. Sie waren ein geschützter Freiraum für Regimekritik. Die erste Bluesmesse fand in der Samariterkirche in Berlin-Friedrichshain statt. Initiator war der evangelische Pfarrer, Bürgerrechtler und spätere Politiker Rainer Eppelmann. Doch nicht nur dem SED-Regime, auch der Kirche waren die Bluesmessen ein Dorn im Auge. ..."
