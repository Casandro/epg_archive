  subtitle: Vertrauenskrise in der Koalition - wie können Reformen jetzt gelingen?
  description: |-
    * Vertrauenskrise in der Koalition - wie können Reformen jetzt gelingen?
    Der Rücktritt von Bärbel Bas als SPD-Vorsitzende und Bundesarbeitsministerin hat in der Bundesregierung erneut für Unruhe und Streit gesorgt. Ihr Nachfolger im Ministerium, Alexander Schweitzer, übernimmt eine lange Reformagenda: Rente, Flexibilisierung von Arbeitszeit und Kündigungsschutz - vieles versprochen, wenig beschlossen. Gleichzeitig will die Union mit der Senkung der Stromsteuer ein Signal für ein bezahlbares Leben setzen, die SPD verweist auf fehlende Haushaltsspielräume.
