  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 7)'
  subtitle: Opuszczona żaglówka osiada na mieliźnie nieopodal wybrzeża. W okolicy znajduje się szkoła pod żaglami. Na miejscu dochodzenia pojawiają się dzieci.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Stéphane Blancafort
    Opuszczona żaglówka osiada na mieliźnie nieopodal wybrzeża. Do szkoły pod żaglami i jej uczniów, początkujących żeglarzy, nie jest daleko. W centrum dochodzenia pojawiają się dzieci. Candice, która dotychczas uważała, że świetnie sobie radzi z najmłodszymi, szybko uświadamia sobie, że młodzi ludzie, pełni niespodzianek, manipulują i bawią się nią nie bez żadnej złośliwości. Ich zachowanie sprawia, że policjantka czuje się zdezorientowana.
  ageRating: 12
