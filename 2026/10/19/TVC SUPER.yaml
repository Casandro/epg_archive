  title: 'Detektyw Candice: Niezawodny instynkt 4 (odc. 3)'
  subtitle: Podczas wspólnego wyjścia z dziećmi do kina Candice pomaga uroczemu staruszkowi zaatakowanemu przez młodą kobietę. Ofiarą okazuje się być prezes stowarzyszenia antyaborcyjnego.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2016
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Ali Marhyar, Delphine Rich, Stéphane Blancafort
    Nieudana niedziela rodziny Renoir... Podczas wspólnego wyjścia z dziećmi do kina Candice pomaga uroczemu staruszkowi brutalnie zaatakowanemu przez młodą kobietę? i musi się zmierzyć z czwórką obrażonych dzieci, jak i z problemem sumienia: ofiarą okazuje się być prezes stowarzyszenia antyaborcyjnego, a agresorką stażystka oddziału położniczego, doprowadzona do ostateczności przez prześladowania, których ofiarą padła jej placówka. Jednak na tym sprawa się nie kończy.
  ageRating: 12
