  title: 'Detektyw Candice: Niezawodny instynkt 4 (odc. 4)'
  subtitle: Candice postanawia zrezygnować ze swoich metod śledczych. W tym czasie policjanci próbują rozwiązać zagadkę śmierci pewnego menadżera, stosującego ekstremalne metody zarządzania.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2016
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Ali Marhyar, Delphine Rich, Stéphane Blancafort
    Candice jest przygnębiona, odkąd jej zastępca odszedł do policji kryminalnej, a ona sama, upokorzona przed sądem, została. Kobieta postanawia przefarbować włosy i zrezygnować ze swoich metod śledczych. Jej współpracownicy i dzieci zaczynają się poważnie martwić. Czy Candice znajdzie siłę, by rozwiązać zagadkę śmierci menadżera stosującego ekstremalne metody zarządzania?
  ageRating: 16
