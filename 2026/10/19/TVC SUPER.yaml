  title: Profil 8 (odc. 9)
  subtitle: W jednym z mieszkań znaleziono spalone ciało przed laty odsuniętego od zawodu lekarza. Ekipa śledcza odkrywa, że przed piętnastoma laty Grandet uratował kilku nastolatków z płonącego autobusu.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2017
    Reżyseria: Sébastien Cirade
    Występują: Philippe Bas, Juliette Roudet, Jean-Michel Martial, Raphaël Ferret, Diane Dassigny, Hugo Hamdad
    Profil to francuski serial telewizyjny, który gości na małym ekranie od wiosny 2009 roku. Jego główną bohaterką jest Chloe Saint-Laurent ? psycholog specjalizująca się w kryminalistyce. Niebagatelne umiejętności i wyjątkowe wyczucie pozwalają jej wedrzeć się do umysłów sprawców i pomagać policji, która prowadzi mrożące krew w żyłach śledztwa.
  ageRating: 16
