  title: Blondynka s.VII - odc. 81 (seria VII, odc. 3) - Nie chodzi o mnie
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2018
    Występują: Natalia Rybicka, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Olga Sumskaya
    Kapitan próbuje zbliżyć się do Sylwii. Sprzyja mu w tym los. Kiedy po porannej zaprawie znajduje w trawie rannego bociana, wzywa Sylwię do woliery, do pacjenta. Przy okazji udaje im się dłużej porozmawiać. Kapitan opowiada jej o swojej pracy na morzu, Sylwia odwdzięcza się opowieściami o ptakach i przesącza wiadomości o swoim dzieciństwie. Widać, że mają ze sobą dobry kontakt. W Karolu szubko dojrzewa myśl, żeby wyznać Sylwii prawdę, że jest jej ojcem.
  ageRating: 12
  genre:
  - '23'
  subtitle: Kapitan znajduje w trawie rannego bociana i prosi Sylwię o pomoc. Udaje mu się porozmawiać z dziewczyną; opowiada jej o pracy na morzu. Karol zastanawia się nad wyjawieniem Sylwii prawdy.
