  title: Ojciec Mateusz - odc. 39 (Ojciec Mateusz III odc. 9) - Strach na scenie
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Aleksandra Górska, Beata Ścibakówna
    W Sandomierzu szykuje się premiera przedstawienia "Anna Karenina" z udziałem wielkiej aktorki, Marii Brodzkiej. Reżyser, a zarazem mąż aktorki Wiktor Szymański, dba o każdy szczegół spektaklu. Za kulisami ktoś podmienia śrubę w blokadzie wyciągarki służącej do opuszczania ekranu. Ekran spada na scenę, uderzając jednego z aktorów w głowę. Właśnie w tym miejscu miała stać Maria. Aktorka uważa, że ciąży na niej klatwa. Poprzednio poślizgnęła sie na scenie i poroniła.
  ageRating: 12
  genre:
  - '18'
  subtitle: W Sandomierzu szykuje się premiera przedstawienia pt. "Anna Karenina" z udziałem słynnej aktorki. Ktoś powoduje wypadek, w którym zostaje ranny jeden z aktorów. Celem ataku miała być gwiazda.
