    odc. 10 Dziewczyny szantażują Dietriecha i żądają współpracy z podziemiem. A on, nie mając wyjścia, zgadza się. Ewka decyduje, że przez jakiś czas zamieszkają razem w mieszkaniu pani Felicji. Dziewczyny spotykają Malinę, który prosi Ewkę o wyrobienie kenkart dla dwojga Żydów z getta. Nocą do kamienicy wpadają Niemcy. Przerażone Ewka i Marysia w ostatniej chwili uciekają przewodem kanałowym. Stefan wyznaje miłość Irce. Ta jednak zdecydowanie odrzuca jego zaloty.
