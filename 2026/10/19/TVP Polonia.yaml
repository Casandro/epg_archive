    Sylwia jest w szoku, kiedy dowiaduje się od kapitana Karola, że prawdopodobnie on jest jej ojcem. Chciałaby powiedzieć o tym Dawidowi, ale ten właśnie wyjeżdża z doktorem do Białegostoku. Próbuje rozmawiać z księdzem, z przyjaciółkami Jagną i Majką. Sylwia próbuje zapomnieć się w pracy. Jedzie do schroniska Pawełka pomóc mu naprawić budy po huraganie. Spotyka felczerową, która przed bramą przytułku zorganizowała jednoosobową pikietę. Eleonora żąda zamknięcia schroniska.
  ageRating: 12
