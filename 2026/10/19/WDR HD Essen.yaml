  title: The Red Flags - Rockpalast Festival 2025
  subtitle: Aufzeichnung vom 09.10.2025 aus Bonn
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '2024 waren sie plötzlich in aller Munde - die Geschichte war aber auch zu schön: Eine junge Schulband tritt - gepusht von Jan Böhmermanns ZDF-Sendung "Lass Dich Überwachen!" - bei Rock am Ring auf. The Red Flags wurden in der Show entdeckt und von Böhmermann gefördert. Klanglich bewegt sich die Band zwischen Grunge, Punk und Alternative Rock, sie nutzen ihre Musik als Ventil für Ängste und Zorn.'
