  title: Mittendrin - Flughafen Frankfurt (83)
  subtitle: Frankfurt Frauenpower im Flugzeugschlepper mit Ioulita
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Ioulita schleppt die größten Flugzeuge der Welt, wie den A380 oder den Jumbo. Sie pusht sie vom Gate auf das Rollfeld. Ihr Pushbacktruck wiegt 60 Tonnen und hat 360 PS. Für die alleinerziehende Mutter ein Traumjob. \nAlarm an der Sicherheitskontrolle: Handgepäck, Taschen, Jacken werden nach gefährlichen Gegenständen durchsucht und 250.000 Passagiere täglich durchleuchtet. Viele Fluggäste haben wenig Verständnis für die Arbeit der Kontrolleure. Wir sind exklusiv an mehreren Kontrollstellen dabei, wo normalerweise nicht gefilmt werden darf."
