  title: Romys Salon
  subtitle: Spielfilm Deutschland/Niederlande 2019
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Erzählt wird die Geschichte der 9-jährigen Romy und ihrer 69 Jahre alten Oma Stine. Romy lebt mit ihrer Mutter Margot in einer kleinen Stadt in der Nähe der deutsch-holländischen Grenze. Ihre Eltern haben sich getrennt und da Margot wenig Zeit hat, sich um ihre Tochter zu kümmern, muss Romy jeden Tag nach der Schule zu ihrer Oma, die einen Friseursalon betreibt. Ihre Oma ist eine eher strenge, ordentliche und beherrschte Frau und Romy fühlt sich bei ihr nicht wirklich willkommen. Doch dann ändert sich etwas. Die Beziehung zu ihrer Großmutter wird besser, näher. Bis der Grund für die Verhaltensänderung klar wird: Stine hat Alzheimer.'
