  subtitle: Religijski
  description: Božidar Petrač književni je povjesničar, kritičar, antologičar, prevoditelj, pjesnik i publicist. Rođen je 1952. u Zagrebu, gdje je završio studij komparativne književnosti te talijanskoga i francuskoga jezika i književnosti. Autor je i urednik brojnih knjiga i antologija hrvatske književnosti, a osobito se bavi odnosom književnosti i religije te utjecajem kršćanske duhovnosti na hrvatsku književnost. Dobitnik je nagrada ,,Julije Benešić i ,,Rikard Jorgovanić.
