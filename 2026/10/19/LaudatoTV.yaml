  title: Izdvojeno
  subtitle: Religijski
  description: Crkva se 21. listopada spominje blaženoga Karla Habsburga, posljednjega vladara Habsburške monarhije kojeg je papa Ivan Pavao II. proglasio blaženim. Vlast nije shvaćao kao povlasticu, nego kao svetu službu i odgovornost pred Bogom. Njegov brak s caricom Zitom sveti je papa istaknuo kao nadahnjujući primjer kršćanskim parovima koji pokazuje kako se bračne i roditeljske dužnosti mogu živjeti u potpunoj vjernosti Evanđelju.
