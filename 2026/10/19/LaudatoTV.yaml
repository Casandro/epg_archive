  title: Život i zdravlje
  subtitle: Magazin
  description: 'U vremenu kada su mobiteli, prijenosna računala i televizijski ekrani postali gotovo neizostavan dio svakodnevice, sve više se postavlja pitanje: kako stalna povezanost i izloženost ekranima utječu na naše mentalno, emocionalno i tjelesno zdravlje? O tome ćemo razgovarati s našom gošćom, dr. sc. Lucijom Mihaljević, docenticom na Sveučilišnom odjelu za komunikologiju Hrvatskog katoličkog sveučilišta u Zagrebu. Donosimo stručne uvide, konkretne primjere i savjete kako uskladiti digitalni stil života s očuvanjem zdravlja i kvalitetnih međuljudskih odnosa.'
