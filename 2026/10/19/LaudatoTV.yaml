    "Čipka od okova i milosrđa" - Bl. Alojzije Stepinac i Lepoglava
    U povodu obljetnice sudskog procesa protiv blaženoga Alojzija Stepinca, 3. listopada donosimo reportažu iz Lepoglave - mjesta njegova zatočeništva i svjedočanstva vjere, čiji se tragovi osjećaju i danas. Upravo je 3. listopada 1998. blaženi Alojzije Stepinac proglašen blaženim, a datum beatifikacije odabran je u spomen na njegovu poznatu obranu pred sudom i riječi: ,,Moja je savjest čista.
