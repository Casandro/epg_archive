- eventId: 820074
  start: 2026-10-19T19:00:00Z
  stop: 2026-10-19T22:00:00Z
  title: Ritam devedesetih
  subtitle: Novo vrtoglavo putovanje kroz muziku devedesetih je spremno za vas. Muzika i popularna kultura koji su obeležili uzbudljivu, dinamičnu i stilski šaroliku poslednju deceniju prošlog veka.
  description: Novo vrtoglavo putovanje kroz muziku devedesetih je spremno za vas. Muzika i popularna kultura koji su obeležili uzbudljivu, dinamičnu i stilski šaroliku poslednju deceniju prošlog veka. Devedesetih su se žanrovi slobodno i kreativno mešali i ukrštali, hrabro i bučno predstavili su se sasvim novi glasovi, neki već dobro poznati se potpuno promenili, a neki pored svega ostali potpuno isti. Gitarski bendovi istupili su sa svežinom, žestinom i mirisom slobode. Elektronska muzika pokazala je svoju raskoš kroz čitav vid različitih formi i stilova. Plesna i klupska scena je cvetala, koncerte nismo snimali mobilnim telefonima, a do nove muzike smo dolazili bez interneta. Ona je nezaustavljivo pristizala sa svih strana sveta, a svi smo jedva čekali da je otkrijemo. Domaći i strani hitovi koji su se za sva vremena velikim slovima upisali u muzičku istoriju, uz istraživanje naše bogate arhive i prisećanje na neke zaboravljene muzičke dragulje. Pred mikrofonom je Zorana Minčić.
- eventId: 820083
  start: 2026-10-19T22:00:00Z
  stop: 2026-10-20T01:00:00Z
  title: Osamdesete zauvek
  subtitle: Emisija Radija 202 o neprolaznom šarmu osamdesetih. Pop kultura i muzika osamdesetih godina prošlog veka ostavile su dubok trag u decenijama koje su usledile.
  description: Emisija Radija 202 o neprolaznom šarmu osamdesetih. Pop kultura i muzika osamdesetih godina prošlog veka ostavile su dubok trag u decenijama koje su usledile. Taj uticaj je povremeno slabio, ali se ponovo vraćao i jačao, tako da na različite načine traje i danas. Muzika, imidž poznatih ličnosti, moda, pojava široko popularnih brendova različitih proizvoda, tehničke inovacije poput "vokmena", mobilnih telefona ili, pak, kompjutera koji su postali pristupačniji običnim ljudima - sve to je ovoj deceniji donelo neprolazni šarm i značaj.
