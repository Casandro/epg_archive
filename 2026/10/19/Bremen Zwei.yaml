  title: Gesprächszeit
  description: 'Seit über 12 Jahren ist das Cockpit von riesigen Passagier- und Frachtmaschinen der Arbeitsplatz von Raja Katz. Aber die Langstreckenpilotin fliegt nicht nur um die ganze Welt: Als Deutschlandchefin von "Elevate(her) Aviation" setzt sie sich für eine stärkere Repräsentation von Frauen in der Luftfahrt ein. Auf ihren Social-Media-Kanälen teilt Katz Einblicke aus ihrem Alltag über den Wolken, um so die nächste Generation von Pilotinnen zu inspirieren.'
