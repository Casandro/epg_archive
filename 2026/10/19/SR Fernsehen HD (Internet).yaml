  title: SWR3 New Pop Festival 2026 - Best of Open Air Bühne
  subtitle: BOY LOCO, Nectar Woode, Argyle und Tiffany Aris
  description: SWR3 bringt die vielversprechendsten neuen Acts auf die Live-Bühnen in Baden-Baden. Jedes Jahr für drei Tage im September wird Baden-Baden zum Treffpunkt der Musikszene und bietet die Möglichkeit, dabei zu sein, wenn aufstrebende Künstlerinnen und Künstler ihre Musik präsentieren. Die Auftritte auf der Open Air Bühne stechen mit ihrer Nahbarkeit besonders heraus.
- eventId: 907029
  start: 2026-10-19T01:45:00Z
  stop: 2026-10-19T03:15:00Z
  title: Der Pfälzerwald rund ums Jahr
  description: Der Pfälzerwald ist Deutschlands größtes zusammenhängendes Waldgebiet und bildet mit den Nordvogesen ein UNESCO-Biosphärenreservat, Lebensraum seltener Tier- und Pflanzenarten. Im Wandel der Jahreszeiten begleitet die Dokumentation Menschen, die den Wert naturnahen Handelns erkannt haben und sich für den Erhalt der Natur einsetzen. Buntsandstein-Formationen sind das Ziel von Kletterenden.
- eventId: 909320
