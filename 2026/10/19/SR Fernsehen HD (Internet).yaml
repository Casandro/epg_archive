- eventId: 907029
  start: 2026-10-19T01:45:00Z
  stop: 2026-10-19T03:15:00Z
  title: Der Pfälzerwald rund ums Jahr
  description: Der Pfälzerwald ist Deutschlands größtes zusammenhängendes Waldgebiet und bildet mit den Nordvogesen ein UNESCO-Biosphärenreservat, Lebensraum seltener Tier- und Pflanzenarten. Im Wandel der Jahreszeiten begleitet die Dokumentation Menschen, die den Wert naturnahen Handelns erkannt haben und sich für den Erhalt der Natur einsetzen. Buntsandstein-Formationen sind das Ziel von Kletterenden.
- eventId: 909320
  start: 2026-10-19T03:15:00Z
  stop: 2026-10-19T03:30:00Z
  title: Expedition in die Heimat
  subtitle: Genusstour durch den Schwarzwald
  description: Kaum eine Region bietet mehr an kulinarischem Hochgenuss und Naturidylle als der Nordschwarzwald. Der Ort Baiersbronn wurde von der New York Times zur "ungewöhnlichsten Gourmethauptstadt der Welt" gekürt. Nirgends ist die Michelin-Sterne-Dichte höher. Moderatorin Annette Krause stellt berühmte Feinschmecker-Tempel vor und kleine, gemütliche Örtlichkeiten für Urlauber und Genussmenschen.
- eventId: 913337
  start: 2026-10-19T03:30:00Z
  stop: 2026-10-19T03:45:00Z
  title: Deutschland 1933 - Wie die Nationalsozialisten in wenigen Wochen die Demokratie abschaffen
  subtitle: NS-Diktatur
  description: Nach dem Erlass der Reichstagsbrandverordnung wird KPD-Chef Ernst Thälmann verhaftet. Die jüdische Gerichtsreporterin Gabriele Tergit flieht. Der Journalist Carl von Ossietzky bleibt inhaftiert. Bei der Reichstagswahl am 5. März 1933 gewinnt die NSDAP mit knapp 44 Prozent. Hitler kann nur zusammen mit den Rechtskonservativen regieren. Joseph Goebbels, jetzt Propagandaminister, inszeniert Hitler deshalb als gemäßigten Staatsmann. Doch der SA-Terror geht weiter.
- eventId: 913436
  start: 2026-10-19T03:45:00Z
  stop: 2026-10-19T03:55:00Z
  title: Spickzettel
  subtitle: Was macht die EU?
  description: Die EU, die Europäische Union, ist ein Zusammenschluss von 27 Ländern in Europa, ein politisches und wirtschaftliches Bündnis, das auf gemeinsamen Werten wie Demokratie, Rechtsstaatlichkeit, Freiheit und Menschenrechten basiert. In jedem Land finden Europawahlen statt, bei denen die Bürgerinnen und Bürger ihre Abgeordneten fürs EU-Parlament wählen. Die Mitgliedsstaaten legen Ziele und Politik gemeinsam fest. Dazu hat die EU gemeinschaftlich organisierte Strukturen und Institutionen.
- eventId: 913995
  start: 2026-10-19T03:55:00Z
  stop: 2026-10-19T04:00:00Z
  title: Spickzettel
  subtitle: Wie ist die EU entstanden?
  description: 'Frieden in Europa sichern - aus diesem Wunsch entstand die Europäische Union. Nach dem Zweiten Weltkrieg lag Europa in Trümmern. Länder wie Deutschland, Frankreich, Italien, Belgien, die Niederlande und Luxemburg wollten nie wieder gegeneinander Krieg führen. Die Idee: Teamwork statt Krieg.'
