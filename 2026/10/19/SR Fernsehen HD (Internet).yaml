  title: Eisenbahn-Romantik (818)
  subtitle: Das letzte Häusle - Modellbaufirma Vollmer schließt
  description: 'Nach 68 Jahren Firmengeschichte wird Vollmer keine Häuschen für die Modellbahn mehr herstellen. Die Traditionsfirma schließt zur Jahresmitte 2014 ihren Betrieb, weil das Firmengelände an Porsche verkauft worden ist. Viele Vollmer-Häuschen sind inzwischen ein Stück Architektur- und Eisenbahngeschichte des Südwestens geworden. Ob der Bahnhof Baden-Baden samt passendem Bahnsteig, die Kirche von Stuttgart-Berg oder ein Aldi-Markt: Bei dem Sortiment mit mehr als 1.000 Artikeln hat jedes Modell sein Vorbild in der Realität. Für eingefleischte Eisenbahnfans ist diese Wirklichkeitsnähe ein wichtiger Punkt.'
