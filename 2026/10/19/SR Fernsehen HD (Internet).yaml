  title: Expedition in die Heimat
  subtitle: Genusstour durch den Schwarzwald
  description: Kaum eine Region bietet mehr an kulinarischem Hochgenuss und Naturidylle als der Nordschwarzwald. Der Ort Baiersbronn wurde von der New York Times zur "ungewöhnlichsten Gourmethauptstadt der Welt" gekürt. Nirgends ist die Michelin-Sterne-Dichte höher. Moderatorin Annette Krause stellt berühmte Feinschmecker-Tempel vor und kleine, gemütliche Örtlichkeiten für Urlauber und Genussmenschen.
