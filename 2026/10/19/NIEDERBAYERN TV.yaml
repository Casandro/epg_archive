  description: "Bayerns letztes Volksfest - Kirta-Auftakt mit Jubiläumskonzert\nWenn in Dingolfing wieder die Kirta beginnt, gehören Tradition, Musik und Geselligkeit einfach dazu. Am Samstag wurde das mit dem traditionellen Auszug auf die Festwiese einmal mehr deutlich. Eine Besonderheit gab es heuer schon vorab: Anlässlich des Stadtjubiläums wurde die Kirta-Eröffnung erstmals durch ein Stadtkonzert und weitere Standkonzerte in der Innenstadt ergänzt. \n\nKunstvielfalt im Bruckstadel - Isargilde zieht Bilanz zur Herbstausstellung\nBei der Kunst dreht sich alles um die Kreativität und um das Umsetzen der Ideen, mit Stilmitteln, ein Wiedergeben einer bestimmten Epoche oder Ausprobieren von Sachen, die vielleicht so noch keiner versucht hat. Dabei kann ein Gemälde mit einer recht simplen Idee bei der Umsetzung ein ganz anderes werden, als man am Anfang gedacht hatte. Diese Vielfalt zeigte sich auch bei der Herbstausstellung, die im September und Oktober den Dingolfinger Bruckstadel in ein Haus der Kunst verwandelt hat. Ob Bleistiftzeichnungen, Ölgemälde, Acryl oder Aquarell - die Ausstellung gab einen Einblick in die vielfältige Kunstszene Niederbayerns.\n\nLiebe auf den ersten Blick? Speed-Dating in Landshut\nWer heutzutage Single ist und sich nach einer Beziehung sehnt, hat es gar nicht so einfach. Das Nachtleben ist nicht, was es einmal war und Dating Apps sind sowieso nichts. Aber vielleicht ist da einem mit dem sogenannten SpeedDating geholfen. Man trifft sich an einem Ort und hat 8 Minuten Zeit sich kennenzulernen, bevor durchgewechselt wird.  Im Landshuter CCL hatte man gestern die Gelegenheit, sich da einmal zu versuchen. \n\n4:2 in Kassel: EV Landshut macht erstes Sechs-Punkte-Wochenende perfekt\nDas erste Sechs-Punkte-Wochenende der neuen DEL2-Saison ist da für den EV Landshut. Nach einem überzeugenden 6:3 am Freitag zu Hause gegen Ravensburg legte die Krupp-Truppe am Sonntag auch bei Meisterschafts-Mitfavorit Kassel nach."
