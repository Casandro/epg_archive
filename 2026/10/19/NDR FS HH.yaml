  description: 'Essen als Medizin: Mit gezielten Ernährungsstrategien Symptome deutlich lindern und manche Krankheiten sogar heilen - das ist das erfolgreiche Rezept der Ernährungs-Docs. Die erfahrenen Medizinerinnen und Mediziner Silja Schäfer, Viola Andresen, Matthias Riedl und Jörn Klasen zeigen in dem einzigartigen Coaching-Format, wie sich schon innerhalb weniger Monate oft erstaunliche Erfolge erzielen lassen. Ob bei Adipositas oder Fibromyalgie - an Bord eines Hausboots in Hamburg helfen die "Docs" auch in Staffel 12 Menschen, die an ihren massiven Gesundheitsproblemen fast verzweifeln.'
