  title: Die Kairo Verschwörung
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Spielfilm Frankreich/Schweden/Finnland 2022
  genre:
  - '16'
  description: 'Für Adam, den Sohn eines Fischers, geht ein Traum in Erfüllung: Er erhält ein Stipendium für die renommierte Al-Azhar-Universität in Kairo - das Machtzentrum des sunnitischen Islam in Ägypten. Als das Oberhaupt der Universität stirbt, beginnt ein Kampf um seine Nachfolge. Der Regierungsbeamte Ibrahim rekrutiert Adam als Informanten für den ägyptischen Geheimdienst und bringt ihn damit zwischen die Fronten der religiösen und politischen Eliten des Landes, sogar in Lebensgefahr. Ein Politthriller über Macht und Autorität in einer hierarchisch geschlossenen Organisation.'
