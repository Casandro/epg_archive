  subtitle: Die Kinder vom Bürgerzentrum
  description: 'Jahrzehntelang lagen sie unbeachtet in einem Schrank: VHS-Filme mit seltenen Einblicken in eine vergangene Zeit. Ein norddeutsches Viertel in den 1980er-Jahren: Beton, Hochhäuser, kaum Platz zum Spielen. Mittendrin Kinder, die dicht gedrängt vor einer verschlossenen Tür warten - dann öffnet sie sich, und es gibt kein Halten mehr. Sozialarbeiter Dirk Ysker leitete das Bürgerzentrum Achim fast 40 Jahre lang. Heute öffnet er sein Archiv und trifft die Menschen von damals wieder - ein Rückblick auf vier Jahrzehnte Migrationsgeschichte.'
