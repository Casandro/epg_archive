  title: Planet Weltweit - Die Dhaus, Arabiens legendäre Schiffe
  subtitle: Planet Weltweit - Die Dhaus, Arabiens legendäre Schiffe
  description: Im Königreich Bhutan, mitten im Himalaja, leben die Menschen streng nach der buddhistischen Lehre. Sie glauben fest daran, dass die Seelen der Verstorbenen auf dem Rücken von Kranichen zum Himmel getragen werden. So gelten die Zugvögel hier als "Vögel des Glücks". Kraniche, so heißt es in Bhutan, bevorzugen heilige Orte. Das Phobjikha-Tal, tief im Inneren Bhutans, ist so ein heiliger Ort. Ab Mitte Oktober warten alle Bewohner hier auf die Ankunft der Zugvögel. Die Tiere fliegen zum Überwintern von Tibet in das geschützte Tal. Da hier die Böden so gut wie nie zufrieren, können die Kraniche auch in den Wintermonaten ausreichend Nahrung finden. Für die Menschen ist die Ankunft der Kraniche ein wichtiges Omen. Wann aber kommen sie endlich? Besonders gespannt wartet der 11-jährige Karma in diesem Jahr auf die Kraniche. Im buddhistischen Glauben ist sein Name etwas ganz Besonderes, denn "Karma" bedeutet Schicksal, das Schicksal, das wir selbst in der Hand haben. Der Junge hat gelernt, dass er sein "Karma" positiv beeinflussen kann, mit Bescheidenheit, Güte und Einsicht, so verlangt es sein Glaube. Die Eltern wollen, dass sich Karma jetzt, wo er die frühen Kinderjahren hinter sich lässt, auf eine Zukunft im Kloster vorbereitet. Für nahezu jede Familie in Bhutan ist es eine Ehre und Pflicht, zumindest einen Sohn in eines der vielen Klöster zu entsenden. Doch Karma ist unschlüssig. Ihn interessiert nicht nur die spirituelle Rolle der Kraniche, der Himmelsvögel im Phobjikha-Tal. Er will auch alles über die Biologie, die Natur der schönen Tiere wissen. Als die Vögel endlich ihr Winterquartier erreichen, streift er immer wieder mit dem Biologen Jigme durch das Tal, um die Kraniche zu beobachten. Wie wird sich Karma am Ende entscheiden? Für den Weg ins Kloster oder den der Wissenschaft? DE 2015
