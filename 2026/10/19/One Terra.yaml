  title: Planet Weltweit - Handgemacht in Laos - Rares aus Rattan
  subtitle: Planet Weltweit - Handgemacht in Laos - Rares aus Rattan
  description: 'Planet Weltweit: Seit jeher wird Rattan in Asien vielseitig verwendet: zur Herstellung von Möbeln, Korbwaren, Wandverkleidungen und Sportbällen. Auch im bergreichen Zentrum von Laos gedeiht die stachelige Rattan-Palme. Wild als Kletter-Liane in den Dschungelwäldern und angebaut auf Feldern. Die Menschen in den Dörfern ringsum leben seit Generationen von Rattan, der Pflanze mit vielfältigen Eigenschaften. DE 2022'
