  title: Planet Weltweit - Eine Fähre nach Afrika
  subtitle: Planet Weltweit - Eine Fähre nach Afrika
  description: 'Sie gilt als eine der am dichtesten befahrenen Meerengen der Welt: Die Straße von Gibraltar. Über acht Millionen Passagiere setzen jährlich von Europa nach Afrika über oder zurück. Nirgendwo liegen die beiden Kontinente näher beieinander. Das ist nicht nur für Händler und Touristen verlockend, sondern auch für Kriegs- und Wirtschaftsflüchtlinge, die sich von hier aus Eintritt in die Europäische Union erhoffen. Wir haben die Straße von Gibraltar besucht und Menschen getroffen, die hier leben und arbeiten. Drei Mal täglich von Europa nach Afrika und zurück. Für Jesus Borrego ist das Alltag. Der Fährkapitän kreuzt mit seinem Ceuta Jet eine der abenteuerlichsten und am dicht befahrendsten Meerengen der Welt - die Straße von Gibraltar. Der Fährverkehr auf der Passage gilt seit Jahren als boomender Wirtschaftszweig. Bis zu 400 Frachter und Fähren passieren täglich die Wasserstraße, transportieren Waren und Reisende etwa zur marokkanischen Hafenstadt Tanger oder der spanischen Enklave Ceuta. Hinzu kommen Tausende von Touristen, die vom zollfreien Einkauf in der englischen Enklave Gibraltar profitieren wollen. Doch die Nähe zu Afrika hat auch ihre Schattenseiten: Immer wieder versuchen Wirtschaft- und Kriegsflüchtlinge, besonders aus Afrika, die Meerenge in Schlauchbooten und kleinen Barken zu überwinden, um in die Europäische Union zu gelangen. Mindestens 4.500 Flüchtlinge haben in den vergangenen 20 Jahren die halsbrecherische Reise mit dem Tod bezahlt. Hinzu kommt, dass viele illegale Einwanderer von der Polizei aufgegriffen und in Auffanglager gesteckt werden. Das Ende einer meist langen Odyssee. Kapitän Jesus Borrego kennt die Situation, so wie die meisten seiner Landsleute. Dabei hat Spanien selber mit Problemen zu kämpfen - die Provinz Andalusien, die an die Küste grenzt, muss mit einer Arbeitslosenquote von 30 Prozent zu kämpfen. DE 2011'
