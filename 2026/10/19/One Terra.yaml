  title: Planet Weltweit - Myanmars Bambusbrücke - Ein Dorf packt an!
  subtitle: Planet Weltweit - Myanmars Bambusbrücke - Ein Dorf packt an!
  description: Im Norden Myanmars, dem einstigen Burma, entsteht jedes Jahr aufs Neue eine der längsten Bambusbrücken der Welt. Das Hochwasser im Sommer spült die filigrane Konstruktion stets fort. Erst im Winter, bei Niedrigwasser, ziehen die Bewohner des Flussinseldorfes Sin Kin los, um ihre Bambusbrücke zum Festland neu zu errichten. Jede Hand wird da gebraucht.  DE 2017
