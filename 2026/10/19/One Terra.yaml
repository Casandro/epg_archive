  title: Planet Weltweit - Taipeh 101 - Der Himmel über Taiwan
  subtitle: Planet Weltweit - Taipeh 101 - Der Himmel über Taiwan
  description: Der Wolkenkratzer "Taipeh 101" ragt 509 Meter in die Höhe. Wie ein gigantischer Bambus aus Glas und Stahl dominiert er die Skyline von Taiwans Hauptstadt Taipeh. Tag für Tag strömen über 10.000 Menschen in den Büroturm, den ein Fengshui-Meister mitkonstruiert hat, so dass die Lebenskraft, das Chi, ungestört fließen kann. Wie aber ist es um die Sicherheit dieses riesigen Bauwerks bestellt? Taiwan ist eine der aktivsten Erdbebengebiete der Welt mit über 40.000 Beben pro Jahr ist. Außerdem fegen jährlich drei bis vier tropische Wirbelstürme mit bis zu 250 Kilometern pro Stunde über die Pazifikinsel hinweg. Die Reportage blickt hinter die Kulissen des bis vor kurzem noch höchsten Gebäudes der Welt und begleitet den Alltag der Menschen, die stolz sind in diesem einzigartigen Gebäude zu arbeiten. Das "Taipeh 101" ist für Julia Han-Li Meng inzwischen ein zweites Zuhause geworden. Sie fährt täglich eine Stunde lang mit dem Bus aus einem Vorort von Taipeh in das Bankenviertel Hsinyi im Nordosten der Stadt. Die 45-jährige ist seit vier Jahren Gebäudemanagerin und damit zuständig für vieles, was in den 101 Stockwerken passiert. Ob Sturm- oder Erdbebenwarnungen, verirrte Touristen, undichte Klimaanlagen, Stromausfälle - nichts geschieht, ohne dass sie davon weiß und sich darum kümmern muss. Julia Han-Li Meng kennt fast jeden Winkel des Wolkenkratzers und muss ständig erreichbar sein, selbst in der Freizeit. Zur Zeit scheint sich wieder ein schwerer Sturm vor Taiwan aufzubauen. Zwar hält die Konstruktion des Hochhauses Taifunen bis zu einer Geschwindigkeit von 300 Kilometern pro Stunde sicher stand - und bisher auch den Erdbeben, die durch die nur 200 Meter vom "Taipeh 101" entfernt verlaufende Bruchlinie der Erdkruste, die sogenannte Taipeh-Verwerfung, ausgelöst werden. DE 2008
