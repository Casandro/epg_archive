  title: Planet Weltweit - Die Wassernomaden vom Sambesi
  subtitle: Planet Weltweit - Die Wassernomaden vom Sambesi
  description: |-
    Der gewaltige Sambesi durchzieht den Süden Afrikas und bildet riesige Überschwemmungsgebiete: In Sambia zwingt die Flut jedes Jahr ein ganzes Volk zum Umzug. Die Kuomboka - ein großes, rituelles Spektakel für die Bewohner des Sambesi, einschließlich ihrer Königin, die von den Untertanen in Sicherheit gebracht wird.

    Auf 2500 Kilometern entwässert der Sambesi eine Fläche doppelt so groß wie Frankreich. Mit seinen Überschwemmungen prägt er das Leben von Mensch und Tier. Üppig und fruchtbar sind die Plains, in denen das Volk der Lozi seit zwei Jahrhunderten lebt. Jedes Jahr im November beginnt der Sambesi über die Ufer zu treten und überschwemmt in den Folgemonaten gigantische Flächen. Die Lozi leben mit der Gefahr der jährlichen Überschwemmung, die durch den Klimawandel jedoch immer unberechenbarer wird. Wenn das Wasser ihre Häuser erreicht hat, ziehen sie in trockene Gebiete um. Auch die Königin ist vor den Fluten nicht sicher. Die 87-jährige Mulena Mukwae Kandundu Yeta ist die fünfte Monarchin seit der Gründung des Lozi-Königreichs im achtzehnten Jahrhundert. Nach sieben Monaten Trockenheit kommt im November endlich der ersehnte Regen - von nun an steigt allmählich der Wassertand des Sambesi, bis in rund drei Monaten, gespeist von den großen Nebenflüssen, die Plains überflutet sein werden. In diesen Monaten rücken die Lozifamilien noch mehr zusammen - Zusammenhalt und ein enges familiäres Geflecht sind typisch für die Lozi, nur so können sie das abgeschiedene Leben in den Plains meistern. Ende April ist das Wasser so hoch, dass auch die letzten in den etwas höher gelegenen Häusern vor dem Wasser fliehen müssen - wer kann, sichert sein Haus vor Schlangen und Krokodilen. Das zum Leben Notwendigste wird auf Einbäume geladen und ins mehrere Stunden entfernte Ausweichquartier, quer durch die überschwemmten Auen gebracht.

     DE 2017
