  title: Planet Weltweit - Rio de la Plata - SOS am Silberfluss
  subtitle: Planet Weltweit - Rio de la Plata - SOS am Silberfluss
  description: Das Parana-Delta, ein Labyrinth aus Wasserwegen an der Ostküste Argentiniens, rund 30 Kilometer nördlich von Buenos Aires. Jahrelang galt die Region als Rückzugsort für Künstler, Aussteiger und Eigenbrötler. Doch zunehmend entdecken auch gestresste Großstädter diese Idylle für sich - mit noch nicht absehbaren Folgen für das Delta und seine ständigen Bewohner. Die Reportage hat den charismatischen Flusskapitän Oskar "Chiqui" Bruzzone bei seinen Touren durchs Delta begleitet und erlebt, wie die Menschen auf den drohenden Wandel reagieren. Die Menschen im argentinischen Parana-Delta sind besorgt. Immer mehr Auswärtige entdecken ihr Delta zum Ausspannen oder für Wochenendtrips. Nun soll ein neuer Hafen gebaut werden - für die Touristenboote und als Standort für ein modernes Einkaufszentrum. An den Ufern der idyllischen Wasserwege entstehen immer neue Wochenendhäuser und Wohnsiedlungen. Keiner von den Alteingesessenen weiß inzwischen noch, wo und wann er sein Boot festmachen darf. Dabei ist der schwimmende Untersatz überlebenswichtig im Delta. Was woanders das Auto, ist hier der Frachtkahn, das Kaufladen-Boot oder der Mülldampfer. Nur so kommen die Menschen auf den verzweigten, kilometerlangen Wasserstraßen voran, die dem Parana-Delta auch den Ruf als "Venedig Südamerikas" eingebracht haben. Kapitän Oskar Bruzzone - genannt "Chiqui" - lebt seit über 30 Jahren mit seiner Familie im Delta. Hier kennt ihn jeder als einen der zuverlässigsten Frachtschiffer. Auch Chiqui Bruzzone sieht die Gefahren, die seiner Heimat durch die großen Bauvorhaben drohen. Andererseits profitiert er auch davon, denn die neuen Projekte verschaffen ihm auch Aufträge. Und so versucht er, die Nachteile in Grenzen zu halten und das Delta für seine Bewohner zu retten. Er trifft sich mit dem Bürgermeister der Stadt Tigre, dem Wirtschaftszentrum der Region. DE 2008
