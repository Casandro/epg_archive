  title: Planet Weltweit - Louisiana - Land unter bei den Shrimpfischern
  subtitle: Planet Weltweit - Louisiana - Land unter bei den Shrimpfischern
  description: 'Die Shrimps-Fischer aus der Sumpflandschaft am Südrand des Mississippi: kauzige Charaktere, die mit der Wasserwelt der verwunschenen, moosbewachsenen Bayous in fast symbiotischer Gemeinschaft leben. Ihre Häuser bauen sie wegen der Überflutungen auf Stelzen und nebenbei fangen sie Nutria und Alligatoren. Heute steht der Aufwand ihres harten Jobs in keinem Verhältnis mehr zum Ertrag. Viele von ihnen haben in den letzten Jahren aufgegeben und arbeiten jetzt in der Ölindustrie. Doch eine Minderheit der kleinen Shrimper will und kann sich kein anderes Leben als auf dem Wasser vorstellen. Jake Billiot lebt, wo das Land im Meer versickert. Es ist die verwunschene Welt der Bayous von Südlouisiana. Noch erstreckt sich das Marschland weit bis zum Golf von Mexiko. Ein Wasserlabyrinth, das Tag für Tag schwindet, denn jede Stunde schlucken die Fluten eine Fläche so groß wie ein Fußballfeld. Das Bohren nach Öl und Gas sowie das Ausheben von Kanälen für den Bohrinsel-Verkehr haben das Land abgesenkt und damit immer mehr Salzwasser in die Bayous fließen lassen. Dies führte zu einem Rückgang der Shrimpserträge. Noch bis in die 1980er Jahre belieferten die Fischer mit den Meeresfrüchten ganz USA und verdienten gutes Geld. Heute sind ihre Fangreviere durch die territorialen Streitigkeiten mit den Öl-Konzernen eingeschränkt, Billig-Importe aus Fernost sorgen für weitere Konkurrenz. Das Leben der insgesamt 45 Großfamilien, die seit Generationen von den Shrimps leben, ist massiv bedroht. Wollen sie überleben, müssen sie sich neu orientieren. So wie die Familie Chauvin, die nicht nur fischt, sondern ihre Erträge selber verarbeitet und an Restaurants verkauft. Heute steht "David Chauvin''s Seafood Company" für die Zukunft der Shrimper Louisianas. Viele Familien sehen dies als Verrat an der Tradition. Sie versuchen lieber den Zusammenhalt untereinander zu stärken und zu unterstützen.  DE 2017'
