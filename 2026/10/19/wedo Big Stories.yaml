  description: '2018 ● S3 E7 Durch die kontinuierliche Beobachtung von Arth aus dem Orbit haben Wissenschaftler im Laufe der Zeit einen Datensatz erstellt, der viel darüber verrät, wie die Erde atmet und wie das Leben auf diesem lebendigen Planeten erhalten wird. Education / Science / Factual topics 2018, Regie: Andrew Thomson,  Mit: Stuart Sykes, Season:3 Episode:7'
