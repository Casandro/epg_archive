  title: The New Frontier
  subtitle: Kosmische Kollisionen, Education / Science / Factual topics 2018, Season:3 Episode:8
  description: '2018 ● S3 E8 Der Weltraum ist riesig, aber voller Kollisionen. Gas und Staub sammeln sich elektrostatisch an, die Schwerkraft lässt Körner zu Gesteinen und diese zu Felsbrocken verschmelzen, dann kollidieren Asteroiden immer wieder miteinander und mit Planeten. Education / Science / Factual topics 2018, Regie: Andrew Thomson,  Mit: Stuart Sykes, Season:3 Episode:8'
