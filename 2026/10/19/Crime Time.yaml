  title: Sea Patrol - Schadensbegrenzung
  subtitle: Sea Patrol - Schadensbegrenzung
  description: 'Galvin Daley sendet einen Notruf: Das von ihm gecharterte Schiff hat einen Motorschaden, den ET und Swain rasch reparieren. Galvin gibt vor, mit seinen beiden Kindern eine Urlaubsreise zu unternehmen, doch Swain wird zu Recht skeptisch: Nach der Scheidung hat Galvin seine Kinder entführt, um zu verhindern, dass sie mit ihrer Mutter in die USA umsiedeln. AU 2007'
