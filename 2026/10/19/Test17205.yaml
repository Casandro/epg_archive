  title: Le Miracle Suisse
  description: 'Les parents Aaaah les parents ! Vaste sujet ! Depuis les années 60, la manière d''élever les enfants a bien changé, on est passé de la famille nombreuse à la famille nucléaire et du pater familias autoritaire à l''éducation bienveillante. Mais étonnamment, les paroles d''adolescents sont assez similaires à toutes les époques : en résumé on aime nos mamans et papas, mais ils font toujours faux ! Nous plongerons aussi dans l''histoire de Marie-Christine, une fillette indienne adoptée dans les années 60 dans un village fribourgeois que la RTS avait filmée. Nous l''avons retrouvée 57 ans plus tard pour un témoignage très touchant. Et puis, la RTS a donné la parole à celles et ceux qui ne veulent pas devenir parents, un sujet dérangeant mais très actuel. Le Miracle Suisse à regarder absolument par toute la famille !   "Audio description"'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
