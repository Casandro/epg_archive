  description: In het middeleeuwse Poptaslot in Marsum lijkt de tijd stil te hebben gestaan. Cultuurhistoricus Valentijn bezoekt deze bijzondere Friese state, die dankzij de nalatenschap van Henricus Popta vrijwel volledig intact bleef. * Chef-kok Rosah is in de buurt van Maastricht waar Michiel zijn leven op zee verruilde voor een bestaan tussen zo'n zestig bijenvolken. Na een burn-out ontdekte hij de imkerij en maakte hij van zijn passie zijn beroep. * Tuinexperts Manon en Simon gaan langs bij De Volksmond in Tilburg. In deze sociale voedseltuin voor de minima helpen zij mee om de moestuin biodiverser te maken. (2026)
