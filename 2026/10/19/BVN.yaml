  title: Pointer
  subtitle: Schulden of kiespijn? S15 E16. Hoge tandartskosten, hoog eigen risico in de zorg. Mensen met een laag inkomen moeten soms noodgedwongen de dokter laten schieten. Gemeenten zouden helpen, maar dat blijkt gevaarlijk mis te gaan.
  description: 'Hoge tandartskosten, een dure bril, je eigen risico. Voor mensen met lage inkomens is zorg zo duur dat ze noodgedwongen een jaar rondlopen met een rot gebit of zelfs helemaal de zorg vermijden. Het Rijk zegt dat voor de laagste inkomens de gemeentepolis bestaat: een speciale verzekering die veel hoge kosten dekt. Maar steeds meer gemeenten schrappen deze polis, zoals Utrecht, Breda en Groningen. Andere gemeenten maken deze verzekering zo duur dat die niet te betalen is. Staat je huis in een van deze gemeenten, dan heb je pech. We volgen burgers die harde keuzes maken: zorg uitstellen of schulden maken? (2026)'
  genre:
  - '32'
