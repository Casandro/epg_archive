  subtitle: Diego Gutiérrez keert na dertig jaar terug naar zijn geboorteland Mexico, gedreven door zijn zoektocht naar betekenis en veerkracht in een wereld vol verlies, eenzaamheid en onzekerheid.
  description: 'Wat doe je met dit kostbare, kwetsbare leven dat zowel vreugde als zwaar verdriet kan brengen? Diego Gutiérrez keert na dertig jaar terug naar zijn geboorteland Mexico, gedreven door zijn zoektocht naar betekenis en veerkracht in een wereld vol verlies, eenzaamheid en onzekerheid. Hij ontmoet verschillende mensen die allen op hun eigen manier omgaan met deze uitdagingen. Ieder van hen zoekt naar grip op het leven in een wereld met steeds minder om je aan vast te houden. Regisseur: Diego Gutierrez (2025)'
