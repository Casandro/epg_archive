- eventId: 711127
  start: 2026-10-19T02:05:00Z
  stop: 2026-10-19T02:45:00Z
  title: Wie man Riesen bekämpft
  subtitle: Esther Weber - Paralympics-Gold verliert gegen Jesu Strahlkraft
  description: |-
    Esther Weber ist eine echte deutsche Sportheldin. Als Jugendliche wird sie bei einem schweren Autounfall schwer verletzt und sitzt fortan im Rollstuhl. Doch statt in ihrem Leid zu verharren, entscheidet sie sich, Gott treu zu bleiben und ihr Leben neu auszurichten. Als Rollstuhl-Fechterin erkämpft sie sich den Weg an die Weltspitze - mehrfach mit Paralympics-Gold und zahlreichen weiteren Medaillen ausgezeichnet. Bis heute ist Esther Weber ein echtes Vorbild dafür, wie man Riesen bekämpft und sich immer wieder aufrichtet.

    Mehr Infos zu unserem Mutmach-Projekt "WIE MAN RIESEN BEKÄMPFT?!" findet Ihr hier:
    www.wiemanriesenbekaempft.de
  widescreen: true
  hd: true
- eventId: 711959
  start: 2026-10-19T02:45:00Z
  stop: 2026-10-19T03:15:00Z
  title: ERF Mensch Gott
  subtitle: ERF MenschGott
  description: |-
    Ja, es ist möglich, Gott zu begegnen. Und diese Begegnung verändert Menschen. Deshalb erzählen wir bei ERF Mensch Gott solche ganz persönlichen Geschichten.
    Manche sind spektakulär, manche eher leise, aber alle tief berührend. Geschichten, bei denen man ins Staunen kommt, die zu Tränen rühren, die Hoffnung geben für das eigene Leben. Denn Gott will jedem Menschen begegnen - auch dir.
