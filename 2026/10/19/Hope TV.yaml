  title: Wissenswert
  subtitle: Verschwörungstheorien entlarven
  description: |-
    Wie können wir Verschwörungstheorien aufdecken und uns vor Irrwegen schützen? In dieser Episode beleuchtet Martin Borm die Kunst des kritischen Denkens. Mit praktischem Wissen und klaren Methoden zeigt er, wie man Fakten prüft und zu einem klaren Urteil gelangt. Diese Sendung bietet Orientierung in einer Zeit, in der die Wahrheit oft im Nebel der Gerüchte verschwindet. Seien Sie dabei und lernen Sie, wie man sich von falschen Theorien nicht in die Irre führen lässt!
