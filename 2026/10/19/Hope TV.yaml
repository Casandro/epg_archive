- eventId: 712009
  start: 2026-10-19T03:15:00Z
  stop: 2026-10-19T03:25:00Z
  title: Open Doors Magazin
  subtitle: Vom Hass zur Hoffnung
  description: |-
    Was geschieht, wenn Glaube auf tödlichen Hass trifft -
     und Gott alles wendet? Im Open Doors Magazin erleben Sie die bewegende Geschichte von Bulbula aus Äthiopien, den sein eigener Cousin töten wollte - und der heute Seite an Seite mit ihm evangelisiert. Außerdem begegnen Sie Mike von den Philippinen, einem verfolgten Christen, der trotz Bedrohung die "DNA der Kirche" lebt: Muslime lieben und sie mutig zu Jesus führen. Wie ist solche Vergebung, solcher Mut und solche radikale Liebe möglich? Lassen Sie sich herausfordern und ermutigen,  entdecken Sie, wie Gott selbst aus Hass Hoffnung wachsen lässt.

    Weitere Infos unter www.opendoors.de
  widescreen: true
  hd: true
- eventId: 713603
  start: 2026-10-19T03:25:00Z
  stop: 2026-10-19T03:55:00Z
  title: auserlesen
  subtitle: 'Uwe Birnstein: Spirituelle Spuren in Rock und Pop'
  description: |-
    Welche spirituelle Botschaft steckt in Songs von AC/DC, Led Zeppelin oder Johnny Cash? Uwe Birnstein, Theologe, Journalist und Autor, beschäftigt sich seit Jahren mit genau dieser Frage. Eigentlich wollte er Pastor werden, doch während seines Theologiestudiums entdeckte er den Journalismus. Er arbeitete für Hörfunk und Fernsehen und veröffentlichte rund 30 Bücher. In vielen seiner Biografien geht es um Rock und Pop und darum, wie Glaube, Zweifel und die Suche nach Gott das Schaffen großer Künstler geprägt haben. In dieser Sendung erzählt er, welche "Hits from Heaven" man sich genauer anschauen sollte und was diese Musik mit seinem eigenen Glauben gemacht hat.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
