  title: 'Die Nordreportage: Hofgeschichten'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Auf Hof Schmidt im schleswig-holsteinischen Besenthal versorgt Marko Ladewig die jungen Kälber mit einer besonderen Milchpulver-Mischung. Jens Wöbb setzt auf seinem Blumenhof in Altengamme Nützlinge ein, um seine wertvollen Edelrosen gegen die rote Spinnmilbe zu schützen. Im Harzer Vorland bei Landwirt Steffen Thudt stehen Pflegearbeiten bei den Weinreben an. Damit die Trauben später größer werden und mehr Saft liefern, müssen sie an jeder Rebe Blätter entfernen.
