    Die Krawallschlichter - Eure Sicherheit ist unser Job
    Information, D 2026
    Altersfreigabe: ab 12
  description: Polizisten, Türsteher und Security-Mitarbeiter sind da, um Konflikte zu stoppen, bevor sie außer Kontrolle geraten. Für die Männer und Frauen der Sicherheits-Branche zählen Deeskalation unter Druck, klare Ansagen und ein kühler Kopf. Professionelles Auftreten und der richtige Ton sind Pflicht - egal ob gegenüber einem alkoholisierten Partygast oder pöbelnden Passanten. "Spiegel TV" begleitet Security-Mitarbeiter bei der Arbeit und ist hautnah bei Kontrollen und Konflikten dabei.
