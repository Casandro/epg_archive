  title: MareTV
  subtitle: Sri Lanka - Tropen, Tempel, Teeplantagen
  description: 'Sri Lanka steht in jeder Hinsicht für bunte Vielfalt. Wenn Sie Spiritualität oder Ayurveda suchen, hier ist es. Abenteurer und Naturliebhaber können hier auch ihre Bedürfnisse befriedigen. Niemand muss weit reisen, um exotische Welten auf dieser tropfenförmigen Tropeninsel zu entdecken. MareTV taucht in das tägliche Leben der Inselbewohner ein, von denen einige die ungewöhnlichsten Berufe ausüben: Uditha Lakmaal ist ein Palmenbaumkletterer. Er erntet den Saft der Bäume, bekannt als Palmwein, indem er auf ihre Spitze klettert. Sri-lankische Stelzenfischer haben heute tatsächlich sehr wenig mit Fischen zu tun und fungieren eher als Modelle, die von Touristen für das Schauspiel bezahlt werden. Anulawathie betreibt ein kleines schwimmendes Reifengeschäft und bietet Autoreifen für Erwachsene und Tuk-Tuk-Reifen für Kinder an.'
  genre:
