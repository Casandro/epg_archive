  title: Ijasint Žaden i klavirska.
  subtitle: Ijasint Žaden rođen je 27. aprila 1776. godine u Versaju, u porodici dvorskog muzičara Fransoa Žadena.
  description: 'Ijasint Žaden rođen je 27. aprila 1776. godine u Versaju, u porodici dvorskog muzičara Fransoa Žadena. Muzičko obrazovanje sticao je kod alzaškog pijaniste i kompozitora Nikola-Žozefa Ilmandela, a izuzetnu nadarenost pokazao je veoma rano: prvu kompoziciju objavio je već 1785, sa svega devet godina, dok je četiri godine kasnije debitovao na pariskim Duhovnim koncertima, izvodeći sopstveni koncert za klavir. Žadenovo stvaralaštvo odvijalo se u burnim godinama Francuske revolucije, kada su opera i muzika za revolucionarne svečanosti zauzimale istaknuto mesto u javnom muzičkom životu Pariza i pružale kompozitorima značajne mogućnosti za sticanje ugleda i profesionalni angažman. Istovremeno, Ijasint Žaden je kao težište svog mladalačkog opusa izabrao žanrove klavirske i kamerne muzike, pre svega namenjene privatno i polujavnoj sferi. Aktivan i kao pijanista, 1795. godine Žaden je postavljen za profesora klavira na novoosnovanom Pariskom konzervatorijumu, a sredinom devedesetih godina je...'
