  subtitle: U ovom sedmičnom ciklusu emitujemo snimke izlaganja sa skupa koji je održan krajem septembra ove godine u Krnjevu.
  description: 'U ovom sedmičnom ciklusu emitujemo snimke izlaganja sa skupa koji je održan krajem septembra ove godine u Krnjevu. Naučni skup "Simposion o ljubavi", koji je organizovala Sekcija za istoriju medicine Srpskog lekarskog društva u saradnji sa udruženjem "Paviljon-Eksedra", bio je zamišljen kao omaž poznatom Platonovom dijalogu Gozba, ili o ljubavi. Učesnici skupa razmatrali su pojam ljubavi u njegovim različitim manifestacijama (eros, filija, agape), iz perspektiva filozofije, antropologije, istorije književnosti, medicine i religije. Domaćin skupa bila je vinarska kompanija "Podrumi Radovanović". Ove sedmice, na našem programu možete slušati izlaganja sledećih autora: Časlava Koprivice - "Ljubav(i): Prilog nomenklaturnoj egzegezi" (19. oktobar); Vladimira Milisavljevića - "Nelagodnost u ljubavi" (20. oktobar); Bojana Jovanovića - "Početak ljubavi" (21. oktobar); Jasmine Ahmetagić - "Zašto ljubav nije dovoljna: slučaj Ane Karenjine" (22. oktobar); i Zorana Vacića - "Carpe diem: Ljubav...'
- eventId: 820069
