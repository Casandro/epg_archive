  title: phoenix der tag
  subtitle: NS-Täter vor Gericht
  widescreen: true
  hd: true
  description: "Vor 75 Jahren begann in Nürnberg der größte Mordprozess der Geschichte. 21 Nazi-Führer mussten sich vor Gericht für Verbrechen verantworten, die im Zweiten Weltkrieg zum Tod tausender unschuldiger Menschen geführt hatten. \n\nDiese neue, schonungslose Dokumentation erzählt die Geschichte der Nürnberger Prozesse. Sie wurde sorgfältig zusammengestellt aus über eintausend Archivfilmen, inklusive erstmals digitalisiertem Filmmaterial aus dem Gerichtssaal, und kommt ohne Kommentartext aus."
