  subtitle: Wie Europas Armeen um Nachwuchs werben
  description: |-
    Schon in wenigen Jahren könnte es zu einem Angriff Russlands auf NATO- und EU-Gebiet kommen, befürchten Politikerinnen und Politiker. Gleichzeitig wird das Verteidigungsbündnis mit den USA infrage gestellt. Europa versucht deshalb, die eigenen Verteidigungsfähigkeiten so schnell wie möglich zu stärken.
    Die Bundeswehr soll innerhalb weniger Jahre "kriegstüchtig" werden. Bis 2035 soll die Truppe von derzeit 186.000 auf 260.000 aktive Soldatinnen und Soldaten anwachsen. Deshalb wirbt die Bundeswehr massiv um Nachwuchs. Ein Mittel: einwöchige Schnupperangebote für Jugendliche und junge Erwachsene.
