  title: Die geheime Welt der Hunde
  subtitle: Das Familienmitglied
  widescreen: true
  hd: true
  description: Sie sind die besten Freunde des Menschen seit Tausenden von Jahren. Es gibt sie in über 400 unterschiedlichen Rassen. Aber wie viel weiß der Mensch wirklich über seinen besten Freund, den Hund? Die dreiteilige Doku-Reihe zeigt die einzigartigen Eigenschaften von Hunden und entdeckt dabei ihre bemerkenswerte Physiologie, ihre emotionale Bindung zum Menschen und ihre außergewöhnlichen, hervorragenden Sinne.
