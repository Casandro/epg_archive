  title: Medzi nebom a zemou XXIV (16)
  subtitle: Lomnička, svetová jednička. Publicistika Mariána Gavendu. Stretnutie so zaujímavým človekom a prechádzka dôležitými medzníky, ktorými v živote prešiel.
  description: Rómska farnosť Lomnička je už 10 rokov misijným miestom pre kňaza Martina Pasiara. Spolu so svojim tímom, kaplánom a sestrami františkánkami vedú v dedine duchovnú, sociálnu a materiálnu službu. Predstaví nám zaujímavé projekty akými sú Práčovňa bl. Emílie, požičovne náradia či pomoci pri stavbách, burzy šatstva. Ale hlavne ako Evanjelium a adorácia menia srdcia ľudí. (2024)
