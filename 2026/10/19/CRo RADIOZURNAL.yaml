- eventId: 877645
  start: 2026-10-19T07:06:00Z
  stop: 2026-10-19T07:30:00Z
  title: Host Radiožurnálu
  description: Historička Eva Ješutová strávila v Českém rozhlase více než čtyři desetiletí, z toho dlouhá léta vedla jeho archiv. Pátrala po ztracených záznamech, zachraňovala unikátní nahrávky a pomáhala odhalovat příběhy, které by jinak mohly zmizet z paměti. Za svou práci byla nově uvedena do Rozhlasové síně slávy. Jak se podařilo zachránit projev Alexandra Dubčeka po návratu z Moskvy, který mohl za normalizace zmizet? A proč rozhlasoví archiváři dostali příkaz smazat nahrávky Waldemara Matušky? Moderuje Jan Pokorný.
