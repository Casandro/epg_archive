  title: Kulatý stůl Radiožurnálu
  subtitle: Debata s politiky o klíčovém dění v Česku i ve světě.
  description: Jak funguje inkluze v českých školách? Měla by se rozšířit kapacita speciálních škol? Jakou roli mají mít asistenti pedagoga? Kolik jich má být a jak mají být placení? A má mít ředitel školy právo dočasně vyloučit problémové dítě z výuky? Odpoví členové školského výboru Poslanecké sněmovny Miroslav Krejčí (MS), Renáta Zajíčková (ODS) a Jan Berki (STAN). Zveme také zástupce ANO a SPD. Moderuje Tomáš Pancíř.
