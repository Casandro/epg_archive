- eventId: 878065
  start: 2026-10-19T20:05:00Z
  stop: 2026-10-19T20:40:41Z
  title: Host Radiožurnálu
  description: 'Příběh ženy, která připravila sokoly o miliony. První díl: Odhalení V únoru 2024 sokolové s údivem zjistili, že jim z účtů zmizely desítky milionů korun. Ještě ten den se přímo v ústředí České obce sokolské otrávila asistentka starostky Eliška Colding. Ukázalo se, že peníze ukradla ona. Kdo všechno o tom ale věděl? Kdo je za ztrátu peněz zodpovědný? Jak to celé vysvětlit 160 tisícům sokolů, kteří se tou dobou skládali doslova po stokorunách na prestižní všesokolský slet? První díl přináší pohled do zákulisí největší kauzy v dějinách Sokola.'
