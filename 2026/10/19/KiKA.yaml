    In der "Sendung mit dem Elefanten" geht es heute um Außerirdische. Lea bastelt sich ihre eigene Rakete und fliegt damit durch die Wohnung. Timmy, das Schäfchen und seine Freunde entdecken Spuren von Außeririschen. Wo die wohl herkommen? In zwei Bilderrätseln gilt es etwas zu erraten, das auch mit Außerirdischen zu tun hat. Anke Lepanke, Zauberin aus Leidenschaft lässt Jürgen Vogel schrumpfen. Das ist ganz schön merkwürdig! Und zum Schluss verabschieden sich Tanja und André auf Außerirdisch.
