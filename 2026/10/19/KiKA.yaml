  title: Sesamstraße
  subtitle: So viele Möhren
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lernen mit Spaß für Kinder

    So viele Möhren

    Elmo, Pferd und Elin müssen lernen zusammenarbeiten, um eine Lieferung Möhren vom Baumhaus zum Möhrenhaus zu bringen.

    Durch eine Verwechslung liefert Grobi Pferds riesigen Möhrenvorrat nicht vor dem Möhrenhaus ab, sondern vor Elmos Baumhaus. Doch was nun? Mit Elins Hilfe kommen sie auf die Idee, einen Anhänger zu bauen, mit dem sie die Möhren zu Pferds Zuhause ziehen können - und lernen dabei, wie wichtig es ist, miteinander zu kooperieren.

    Außerdem macht sich Bert auf die Suche nach seiner Büroklammer-Sammlung, während Krümel und Keks darüber diskutieren, was klug und was schlau ist.
    Regie: Dennis Jacobsen
    Kamera: Robert Naczynsky

