    Große Suchaktion in Zoés Kinderzimmer, denn Zoés supertoller Rucksack ist plötzlich verschwunden. Auch Tanja und Yasemin können ihn nirgends finden. Viel schöner wäre es, ein Spiel zu spielen. Der Zauberschrank meldet sich und in seinem Innern befinden sich zarte Feenkostüme. Die Mädchen jubeln, können sie doch als Waldfeen durch die Zauberwelt fliegen. So lernen sie eine Entenfamilie kennen, die nicht aufhören kann, ein erstaunlich großes Nest bauen. Weil ein Nest eben genau einen Tag lang gebaut wird. Der Tag scheint einfach nicht enden, die Sonne nicht untergehen zu wollen. Also fliegt Zoé mit Tanja und Yasemin zu Frau Sonne, um sie zu fragen, warum sie ihr Licht noch nicht ausmacht.
