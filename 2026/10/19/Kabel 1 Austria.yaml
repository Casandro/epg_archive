  description: |-
    Boxer Burt Ryan gewinnt einen manipulierten Kampf, den er verlieren sollte, und taucht mit dem Preisgeld unter. Nun jagt ihn die Wettmafia. Als sein Sohn Yo-Yo bei Jack Hilfe sucht, nehmen dieser und Dumas die Verfolgung auf. Doch Morde geschehen, Drogen tauchen auf und die Spuren führen zum Exporteur Goodwin. Als schließlich auch noch Dumas  überfallen und Yo-Yo entführt wird, beginnt für Jack ein Wettlauf gegen die Zeit.

