  title: Unter unserem Himmel
  subtitle: Die Bauern vom Inntal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Auf dem Lainthaler Hof in Niederaudorf lebt die Familie Pichler. Jetzt steht ein Generationenwechsel an: Martin soll den Hof übernehmen, seine Frau Barbara ist schwanger. Doch wie soll man einen Hof übernehmen, wenn niemand weiß, was in wenigen Jahren mit den eigenen Feldern passiert?
    Der Grund ist die geplante Bahntrasse im Rahmen des Brennerbasis-Tunnels durch das obere Inntal. Nördlich des Klosters Reisach bei Oberaudorf soll eine rund 2,5 Kilometer lange, oberirdische viergleisige Verbindungsstrecke bis nach Flintsbach für den Brenner-Nordzulauf entstehen.
