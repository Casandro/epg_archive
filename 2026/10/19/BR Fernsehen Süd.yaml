  title: Einfach und köstlich
  subtitle: 'Zitronenhuhn und Caesar Salad: Alexander Herrmann kocht mit Jaspar Wcislo'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Aus vertrauten Rezepten kreieren Alexander Herrmann und Lisa Angermann moderne Wohlfühlküche.
    Saure Eier sind für die Spitzenköchin aus Leipzig mit den Rezepten von Oma und Ur-Oma verbunden. Den Klassiker aus dem Osten interpretiert die gebürtige Thüringerin neu und kombiniert süß-saure Eier mit grünem Kräuterstampf, knusprigem Speck-Kapern-Topping und einem fruchtigen Mandarinen-Salat.
    Gastgeber Alexander Herrmann serviert Spaghetti mit cremigem Avocado-Limetten-Pesto, scharfen Chili-Zwiebeln und luftigem Knoblauchschaum. Hausgemachte Schupfnudeln treffen beim gemeinsamen Kochen auf cremige Pecorino-Soße und zarten Babyspinat.
