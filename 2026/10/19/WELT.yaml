- eventId: 832322
  start: 2026-10-19T02:34:00Z
  stop: 2026-10-19T03:17:00Z
  title: 'Geheime Nazi-Expeditionen: Der Steinzeitmensch'
  subtitle: 'Geheime Nazi-Expeditionen: Der Steinzeitmensch'
  description: Der fanatische Rassismus der Nazis machte auch vor der Evolutionstheorie nicht Halt. Ihrer Überzeugung nach ließen sich die Ursprünge der Menschheit auf eine überlegene, urgermanische Entwicklungsform zurückführen. Sie wollten unbedingt belegen, dass ihr nordisches Ideal bereits in der Altsteinzeit die weniger fortschrittlichen Entwicklungslinien verdrängte. Um dies zu beweisen, führten die Nazis zahlreiche Ausgrabungen durch.
  widescreen: true
- eventId: 832323
  start: 2026-10-19T03:17:00Z
  stop: 2026-10-19T03:59:00Z
  title: 'Geheime Nazi-Expeditionen: Runen'
  subtitle: 'Geheime Nazi-Expeditionen: Runen'
  description: Der Forschungsverein Ahnenerbe wurde von Heinrich Himmler gegründet, um historische Beweise für die Überlegenheit der Deutschen zu sammeln. Während die Theorien der Nazi-Forscher im Ausland als absurde und ideologische Spinnereien entlarvt wurden, begeisterte sich der SS-Mann für jede Geschichtsverdrehung. So wurden einfache Höhlenmalereien als hochkomplexe, urgermanische Schriftzeichen ausgelegt. Es wurde sogar verbreitet, die Menschen im antiken Rom hätten germanisches Blut in sich getragen.
  widescreen: true
