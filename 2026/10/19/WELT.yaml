  title: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  subtitle: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  description: In der größten Haftanstalt Rheinland-Pfalzes in Wittlich sind 600 männliche Strafgefangene inhaftiert. Der Komplex aus JVA, Jugendstrafanstalt, Krankenhaus und Bildungszentrum misst die Größe von 25 Fußballfeldern. Mit seiner Vielzahl an Einrichtungen ist die Gefängnisanlage Wittlich einmalig in Deutschland. Wie sehen Alltag und Zukunftspläne der Inhaftierten aus, wie die Ausbildung der Justizvollzugsbeamten? Die Reportage gewährt Einblicke hinter "schwedische Gardinen" in der deutschen Eifel.
  widescreen: true
- eventId: 835744
  start: 2026-10-19T21:03:00Z
  stop: 2026-10-19T22:01:00Z
  title: 'Gefängnisse: Zenica, Bosnien'
  subtitle: 'Gefängnisse: Zenica, Bosnien'
  description: 'Zenica in Bosnien ist mit einhundertfünfzehntausend Einwohnern die viertgrößte Stadt des Landes. Sie ist ein Ort, geprägt durch Armut und hohe Arbeitslosigkeit. In Zenica leben fünfzehn Prozent Katholiken, dreißig Prozent Orthodoxe und fünfzig Prozent Muslime. Seit vielen Jahren konkurrieren die drei religiösen Gruppen um die Macht:  Zenica gleicht einem Pulverfass. Mittendrin, in einem eigenen Stadtteil, liegt das größte und härteste Gefängnis Bosniens.'
  widescreen: true
- eventId: 832386
