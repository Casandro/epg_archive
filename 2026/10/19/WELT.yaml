  title: Lost Places - Folge 76
  subtitle: Lost Places - Folge 76
  description: 'Nahe der US-Kleinstadt Bethlehem ragen zerfallene Türme auf: Der früher dort ansässige Industriegigant beschäftigte einst 30.000 Mitarbeitende. Die geheimnisumwobene Ruine einer Kirche in England ist umgeben von einem Friedhof mit verblüffenden Grabsteinen. In einem polnischen Dorf verbergen sich die Ruinen eines einst prunkvollen Schlosses, das als Krankenhaus und Sanatorium erbaut wurde. Unweit der Stadt Jerusalem befindet sich das Geisterdorf Lifta, welches im 20. Jahrhundert zerstört wurde.'
  widescreen: true
- eventId: 832320
  start: 2026-10-19T00:54:00Z
  stop: 2026-10-19T01:44:00Z
  title: Hitlers Krieg im Osten - 1941-1943 (1)
  subtitle: Hitlers Krieg im Osten - 1941-1943 (1)
  description: Am 22. Juni 1941 überfällt Deutschland die Sowjetunion. Hitler bricht den Nichtangriffspakt mit Stalin und entfesselt einen Vernichtungskrieg gegen Slawen und Juden. Er will "Lebensraum im Osten" schaffen - im größten Land der Welt. Was treibt Hitler an? Größenwahn, Rassenhass, militärischer Weitblick? Wie kann er seine Generäle für sein Vorhaben gewinnen? Das Wetter, der Widerstand der Roten Armee und der Kriegseintritt der USA treiben die Wehrmacht bis 1943 an der Ostfront in die Defensive.
  widescreen: true
- eventId: 832321
  start: 2026-10-19T01:44:00Z
  stop: 2026-10-19T02:34:00Z
