  description: Die Bodybuilderin Edina gewinnt unter den Blicken ihres Partners, Trainers und Ex-Bodybuilders Adam einen Wettbewerb, mit dem sie sich für das "Miss Olympia"-Turnier qualifiziert. Um an der Weltspitze mithalten zu können, müssen teure Aufbaupräparate gekauft werden, für die das Sponsoring fehlt. Edina heuert bei einem Escort-Service für ausgefallene Kundenwünsche an, um Geld zu beschaffen. Sie verliebt sich in ihren Kunden Krisztian, an dessen Seite sie sich ein bürgerliches Leben erträumt. Zwischen strengster Diät, Dehydrierungsspritzen und Träumen verliert Edina den Kontakt zur Realität.
