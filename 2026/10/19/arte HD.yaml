  description: Dank ihrer Koordinationsfähigkeit sind Hütehunde zu unentbehrlichen Helfern der Viehzüchter geworden - Wildhunde mit denselben Fähigkeiten sind hingegen ihr Albtraum. Denn wenn sie im Rudel arbeiten, sind Wildhunde die effizientesten Raubtiere und können Beutetiere töten, die viel größer sind als sie selbst. Von Afrika bis Australien gehen Menschen mit mehr oder weniger legalen Mitteln gegen Dingos, Afrikanische Wildhunde und Schabrackenschakale vor, um ihre Herden zu schützen. Ist eine Koexistenz zwischen den räuberischen Hundeartigen und Viehzüchtern möglich?
