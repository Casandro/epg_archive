  description: Vor 20.000 Jahren begannen Mensch und Wolf ihren gemeinsamen Weg. Durch dieses Zusammenleben sowie im Ergebnis der natürlichen Auslese veränderte sich die Morphologie der Hunde. Im Laufe der Jahrtausende entstand eine Vielzahl von Hunderassen mit sehr unterschiedlichen körperlichen Eigenschaften. Heute übt der Mensch überall Druck auf die Ökosysteme aus. Von den dadurch ausgelösten Umweltveränderungen sind auch der Marderhund, der Goldschakal und der Mähnenwolf betroffen, die auf drei verschiedenen Kontinenten beheimatet sind.
