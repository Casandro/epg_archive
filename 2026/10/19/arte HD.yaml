  description: Ob in der Rolle knallharter Polizisten oder schwerer Jungs - in den 1960er Jahren war Lino Ventura einer der populärsten französischen Charakterdarsteller. Das Porträt setzt in der Kindheit des Schauspielers an. Er kam als Kind mit seiner alleinerziehenden Mutter vom italienischen Parma nach Paris und sah sich in einem fremdenfeindlichen Umfeld vielen Demütigungen ausgesetzt. Die Dokumentation ergründet den Menschen hinter der rauen Schale und den harten Figuren, die er verkörperte und die meist mutige, aber in sich gekehrte Einzelgänger waren.
