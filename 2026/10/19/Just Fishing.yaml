  title: Thunfischalarm in Andys Wallercamp
  subtitle: Thunfischalarm in Andys Wallercamp
  description: Eine Videoliveproduktion über das Thunfischangeln an der italienischen Adria. Skipper Andy Gutscher präsentiert an drei Tagen mit seinen Angelgästen das Spinnfischen auf Thunfische. Mit der "Anna" verfügt er über ein neues, ideales Boot zu diesem Zweck. Thunfische mit der Spinnrute anzuwerfen und zu fangen ist für Andy Gutscher keine Vision, sondern gelebte Realität. Von sechs Angelgästen wurden in drei Angeltagen siebzehn Thunfische gefangen. Knallharte Drills die bis an den Rand der körperlichen Leistungsfähigkeit gehen, zeigen von der Wehrhaftigkeit dieses gigantischen Kämpfers und gewähren Ihnen einen einzigartigen Einblick in die Welt des Spinnfischens auf Thunfische! In nur drei Tagen finalisierten Andy Gutscher und Michael Komuczki diese beispiellosen Aufnahmen über das Spinnfischen auf Thunfische in der Adria vor Albarella. AT 2023
