- eventId: 877407
  start: 2026-10-19T09:05:00Z
  stop: 2026-10-19T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Trenér sportovního lezení, metodik klubu LK Boulder Marek Klíma. Předsedkyně a ředitelka klubu LK Boulder Eva Fryšarová. Téma: Neboj se a lez! Zapojuje celé tělo, rozvíjí strategické myšlení a funguje jako skvělý nástroj pro odbourání stresu. Řeč o lezení na lezeckých stěnách různých obtížností. O tom, že tento druh sportu není zdaleka jen pro mladé, ale i pro starší ročníky, jak začít s lezením, nakolik se můžeme zbavit strachu z výšek, a zda je tento druh sportu bezpečný, to vše probereme hodinu před polednem.'
