  title: Hör' mal, wer da hämmert
  subtitle: Ein verrückter Haarschnitt Comedy-Serie, USA 1996
  description: 'Folge 120, Tim Taylor ist der selbsternannte Heimwerker-König und der Moderator der Heimwerker-Sendung "Tool Time", die vom Werkzeughersteller Binford gesponsert wird. Dabei steht ihm der gutmütige und etwas behäbige Schreiner Al als Assistent zur Seite. Tim ist mit der resoluten Jill verheiratet. Das Paar hat drei Söhne: Brad, Randy und Mark. Die Handlung kreist um das Leben der Familie und Tims Versuche, mit meist übertriebenen Mitteln handwerkliche Aufgaben zu lösen. Dabei scheitert er meist. Zur Seite steht ihm in allen Lebenslagen sein Nachbar Wilson, mit dem er sich über den Gartenzaun hinweg unterhält.'
- eventId: 852118
  start: 2026-10-19T18:40:00Z
  stop: 2026-10-19T19:10:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Eine Pille für Randy Comedy-Serie, USA 1996
  description: Folge 121, Bei einer ärztlichen Routineuntersuchung wird bei Randy ein womöglich bösartiges Geschwulst am Hals entdeckt. Tim und Jill wollen ihren Sohn nicht beunruhigen, bis das Testergebnis da ist. Es gelingt ihnen nicht besonders und Randy spürt, dass etwas nicht Ordnung ist und schließlich darf er zu Hause bleiben. Er tut allerdings so, als gehe er in die Schule, doch Tim findet ihn schließlich im Spiele-Salon, wo Randy sich die Zeit bis zum Testergebnis vertreiben will. Als das Ergebnis negativ ausfällt, sind alle erleichtert, nur Tim hat nicht verstanden, worum es bei der Sache eigentlich ging.
