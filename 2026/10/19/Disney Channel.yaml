  title: How I Met Your Mother
  subtitle: Der alte Mann und drei Umzüge Comedy-Serie, USA 2008
  description: Folge 68, Barney versucht Ted zu überreden, nicht zu heiraten und sich nur auf eine Frau zu konzentrieren. Zu diesem Zweck will er mittels Schminke und entsprechendem Outfit beweisen, dass man auch mit 80 noch junge Frauen aufreißen kann ... Indes stehen Ted, Marshall, Lily und Robin vor ihren Umzügen. Ted zieht zu seiner zukünftigen Ehefrau Stella. Marshall und Lily ziehen in ihre neue Wohnung und Robin wird als TV-Korrespondentin nach Japan gehen.
  widescreen: true
- eventId: 852142
  start: 2026-10-19T21:10:00Z
  stop: 2026-10-19T21:40:00Z
  title: How I Met Your Mother
  subtitle: Unerwünschte Gäste Comedy-Serie, USA 2008
  description: Folge 69, Stellas Schwester Nora ist drei Tage vor der Hochzeit der Bräutigam abhanden gekommen, sodass Stella und Ted den Termin übernehmen. Gemeinsam mit ihren Freunden besuchen sie das Hochzeitshotel auf Shelter Island, das ein Yoga- und Meditationscenter ist. Entsetzt müssen Barney, Marshall und Lily feststellen, dass dort sowohl Alkohol als auch Fleisch verboten sind. Als Stella erfährt, dass Robin auch zur Hochzeit kommt, bittet sie Ted eindringlich, sie wieder auszuladen.
  widescreen: true
- eventId: 852143
  start: 2026-10-19T21:40:00Z
  stop: 2026-10-19T22:05:00Z
  title: How I Met Your Mother
  subtitle: Unter dem Tisch Comedy-Serie, USA 2008
  description: Folge 70, Nachdem Ted von Stella am Tag der Hochzeit verlassen wurde und sie wieder mit ihrem Ex Tony zusammen ist, müsste er am Boden zerstört sein. Aber bereits am Abend danach hat Ted den Schmerz offenbar überwunden und er versichert, dass es ihm gut gehe. Die Freunde beschließen, essen zu gehen. Die Entscheidung für ein Lokal fällt allerdings schwer, da Ted bestimmte Gegenden von New York City meiden möchte, in denen sich Stellas Lieblingslokale, Friseur oder Fitness-Studio befinden.
  widescreen: true
- eventId: 852144
  start: 2026-10-19T22:05:00Z
  stop: 2026-10-19T22:35:00Z
  title: How I Met Your Mother
  subtitle: Der Nicht-Vatertag Comedy-Serie, USA 2008
  description: Folge 71, Während Barney nach einem One-Night-Stand mit der Vorstellung hadert, Vater zu werden, wünschen sich Marshall und Lily nichts sehnlicher. Als Marshall aufgrund eines wichtigen Meetings nicht heim kommt, verfällt Lily in Trinklaune und beschließt, ihn betrunken in seinem Büro aufzusuchen, um dem Kinderwunsch nachzukommen. Die ganze Situation verdeutlicht Marshall, dass er noch nicht bereit ist für ein Baby. Für derartige Fälle richtet Barney einen Feiertag für Nicht-Väter ein.
  widescreen: true
- eventId: 852145
  start: 2026-10-19T22:35:00Z
  stop: 2026-10-19T23:05:00Z
  title: How I Met Your Mother
  subtitle: Wuu-Girls Comedy-Serie, USA 2008
  description: Folge 72, Da Robin im Moment ohne Freund, ohne Job und ohne festen Wohnsitz dasteht, erbarmt sich Lily ihrer und begleitet sie zur Geburtstagsfeier einer Arbeitskollegin. Entsetzt müssen Robin und Lily feststellen, dass es sich dabei um eine jener verhassten Mädelsrunden handelt, die bei jedem nur erdenklichen Anlass lauthals , Woooo!' schreien. Nichtsdestotrotz scheint sich Robin nach einer Weile dort immer wohler zu fühlen. In der Zwischenzeit hofft Ted auf einen überaus lukrativen und prestigereichen Auftrag als Architekt.
  widescreen: true
