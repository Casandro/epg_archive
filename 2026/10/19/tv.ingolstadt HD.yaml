  title: Lejeune - Emanuel Pavel (Wh.)
  subtitle: Lejeune im Gespräch mit Emanuel Pavel über Hollywood, Journalismus, Storytelling, persönliche Entwicklung und die Frage, was ein ehrliches und freies Leben ausmacht.
  description: |-
    Prof. Dr. phil. h. c. mult. Erich Lejeune im Gespräch mit dem Münchner Journalisten, Filmkritiker, Moderator und Kommunikations-Coach Emanuel Pavel. Pavel blickt auf eine vielseitige Medienkarriere zurück und hat im Laufe seiner journalistischen Tätigkeit mehr als 500 Hollywoodgrößen interviewt. Im Gespräch geht es um außergewöhnliche Begegnungen, die Welt des Films und die Kunst, Geschichten zu erzählen.

    Darüber hinaus sprechen Lejeune und Pavel über Kommunikation, persönliche Entwicklung und die Frage, was Menschen bewegt und inspiriert. Auch Themen wie Ehrlichkeit, Motivation und ein selbstbestimmtes Leben stehen im Mittelpunkt.
- eventId: 692721
  start: 2026-10-19T13:45:00Z
  stop: 2026-10-19T14:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
