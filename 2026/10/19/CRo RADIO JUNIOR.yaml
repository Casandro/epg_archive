- eventId: 877460
  start: 2026-10-19T16:30:00Z
  stop: 2026-10-19T16:55:00Z
  title: Čtení na pokračování
  description: 'Bitva o diamant 4/6. Když hraješ baseball v zapadákově, musíš do toho dát srdce! Jedenáctiletý Luke, talentovaný nadhazovač, se navzdory svému drobnému tělesnému hendikepu nevzdává snu stát se profesionálním sportovcem. Když si ale trenéři místo něj odvedou do profesionálního klubu jiné hráče, vypadá to, že s baseballem je na vesnici konec a rodiče se rozhodnou hřiště zastavět. Pak teprve začne ta pravá bitva, ve které se zbylé děti musí spojit a vybojovat svůj prostor zpátky. Napsala: Bára Dočkalová. Režie: Petr Gojda. Asistentka režie: Lenka Radová. Rozhlasová adaptace: Marie Špalová. Dramaturgie: Petr Gojda, Zuzana Sikačová. Hudba: Marek Doubrava. Sound design: Ondřej Gášek. Mistr zvuku: Jitka Špalová. Vyrobeno: 2026. PREMIÉRA'
- eventId: 877461
  start: 2026-10-19T16:55:00Z
  stop: 2026-10-19T17:50:00Z
  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Dalibor Naar, tvůrce, projektový manažer a Lucie Palonciová, tvůrce obsahu projektu Skryté příběhy. Řeč bude o unikátní aplikaci Skryté příběhy, která je pro celou rodinu. Proměňuje obyčejnou procházku ve výpravu do minulosti. Nechte se nalákat do historie a zjistěte, že dobrodružství začíná hned za rohem. Moderuje Denisa Kimlová ve studiu Rádia Junior a Klára Nováková z Mezinárodního Festivalu rozhlasové tvorby Prix Bohemia Radio 2026 Olomouc.
- eventId: 877462
  start: 2026-10-19T17:50:00Z
  stop: 2026-10-19T18:00:00Z
  title: Hajaja
  description: Ferda v mraveništi 1/7. Všeuměl Ferda se po ztroskotání své lodi vrací do rodného mraveniště a hned se vrhne do vymýšlení všelijakých zlepšováků, ať už při lovu divokých mšic nebo čištění chodeb mraveniště. Poslechněte si příhody chytrého mravence s červenou kravatou, který se ničeho nezalekne a je vždy ochoten pomoci přátelům i těm, s nimiž se setká poprvé. Podle stejnojmenné knihy Ondřeje Sekory pro rozhlas připravila Eva Linková. Dramaturgie Václava Ledvinková. V roce 1988 natočil režisér Miroslav Šváb. Vypráví Vlastimil Brodský.
