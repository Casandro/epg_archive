  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Dalibor Naar, tvůrce, projektový manažer a Lucie Palonciová, tvůrce obsahu projektu Skryté příběhy. Řeč bude o unikátní aplikaci Skryté příběhy, která je pro celou rodinu. Proměňuje obyčejnou procházku ve výpravu do minulosti. Nechte se nalákat do historie a zjistěte, že dobrodružství začíná hned za rohem. Moderuje Denisa Kimlová ve studiu Rádia Junior a Klára Nováková z Mezinárodního Festivalu rozhlasové tvorby Prix Bohemia Radio 2026 Olomouc.
