- eventId: 877124
  start: 2026-10-19T11:00:00Z
  stop: 2026-10-19T12:00:00Z
  title: Velká pohádka
  description: 'Zázračný brokát. Na jedné straně ztichlé a vyprahlé údolí, na druhé strmá skaliska horského masívu s dravým proudem řek, který zadržuje vládce hor. Stejně protikladní jsou tu i lidé. Uctívají horské démony i vyšší nebeské bohy, a přitom z nich mají strach. Obdivují je i zatracují. Vydat se do hor vyžaduje velkou odvahu, ale jeden z vesničanů se nezalekne. Chce vrátit vesnici vodu, získat zpět matčin zázračný brokát a přivést si nevěstu. Na motivy asijských pověstí napsal: Vladimír Lukeš. Režie: Jaroslav Kodeš. Účinkují: Lukáš Hlavica, Jana Štěpánková, Jiří Schwarz, Ladislav Frej a další.'
