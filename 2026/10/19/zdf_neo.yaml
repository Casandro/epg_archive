  description: |-
    Mysterythriller, Schweden 2020
    Niklas erlebt das Unfassbare: Direkt vor seinen Augen explodiert sein Freund Sebastian - mitten in der Schule und völlig unvermittelt. Was ist passiert und ist Niklas schuld daran?

    Zur gleichen Zeit kehrt Niklas' Schwester Lisa zurück nach Hause. Sie ist nach dem Tod ihrer Mutter abgehauen. Jetzt plagen Lisa düstere Visionen von einem nahegelegenen See, an dem sich ihre Mutter das Leben genommen hat.
