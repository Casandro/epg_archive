  title: The Dip
  widescreen: true
  description: |-
    Caught between an increasingly protectionist United States and a more assertive China, Europe faces a difficult question: Can it stay committed to free trade, or must it join the global race for economic power?

    In this episode of The Dip, Abraham Newman and Hosuk Lee-Makiyama debate whether Europe is adapting to a new era of geoeconomics or slowly losing its place in the world. Who will write the rules of the global economy in the next decade: the US, China, or Europe?
