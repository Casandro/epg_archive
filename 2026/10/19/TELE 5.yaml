  title: Big Trouble in Little China
  description: |-
    Als in San Francisco die Verlobte von Wang Chi (Dennis Dun) entführt wird, trommelt der Chef eines Chinarestaurants eine schlagkräftige Truppe zusammen, um die junge Frau aus den Fängen der Kriminellen zu befreien. Fest entschlossen nehmen es Wang, Jack (Kurt Russell), Gracie (Kim Cattrall) und weitere Gesetzestreue mit dem mächtigen Geschäftsmann Lo Pan (James Hong) auf, der für das Kidnapping verantwortlich ist. Allerdings bekommen es Wang und seine Freund:innen nun mit den magischen Kräften einer 2.000 Jahre alten Geisterlegende zu tun, was zu einem fantastischen Showdown in Chinatown führt. - 2023 wurde der Regisseur John Carpenter in die "Science Fiction and Fantasy Hall of Fame" aufgenommen.
