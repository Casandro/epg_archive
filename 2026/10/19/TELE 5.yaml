  title: Torchwood
  subtitle: Die drei Familien
  description: |-
    Olivia Colasanto (Nana Visitor) enthüllt bislang unbekannte Details über den "Miracle Day". Offenbar sind drei mächtige Familienclans für die globale Verschwörung verantwortlich. Diese hatten in den 1920er-Jahren Jacks Blut abgezapft, um das Geheimnis seiner Unsterblichkeit zu erforschen. Als Brian Friedkin und eine Spezialeinheit der CIA das Anwesen der Colasantos stürmen, nutzt Rex die Gelegenheit, die kriminelle Verwicklung des hochrangigen Geheimdienstlers aufzudecken. Friedkin sprengt sich daraufhin selbst in die Luft! Die CIA entdeckt zudem Alien-Technologie, die zur Gefahr für die gesamte Menschheit werden könnte.
    GBR, USA, CAN 2011
