  title: Torchwood
  subtitle: Die Quelle
  description: |-
    Zwei Monate sind seit den jüngsten Ereignissen vergangen. Da allmählich die Weltwirtschaft kollabiert, nehmen diktatorische Tendenzen rund um den Globus zu. Auch im walisischen Swansea kommt es zum Eklat, als rabiate Strafverfolgungsbeamte Gwens Vater aufspüren und deportieren! Esther und Rex finden heraus, dass zwei gegenüberliegende Punkte auf dem Planeten mit dem Phänomen der Unsterblichkeit in Verbindung stehen: Buenos Aires und Shanghai. Das Team teilt sich auf, um in beiden Mega Citys parallel zu ermitteln. Derweil erhält Jilly Kitzinger eine neue Identität und wird ebenfalls nach Shanghai beordert.
