  title: Doctor Who
  subtitle: Der Hausmeister
  description: |-
    Als ständige Zeitreisebegleiterin von "Doctor Who" ein funktionierendes Privatleben zu führen, ist ein Ding der Unmöglichkeit. Diese Erfahrung muss nun auch Clara machen. Zwar gibt sie sich jede Mühe, ihre Beziehung mit dem Kriegsveteran und Mathelehrer Danny Pink am Laufen zu halten, aber das Liebesleben in London mit kosmischen Seitensprüngen unter einen Hut zu kriegen, ist eine Krux. Zumindest kommt endlich die Wahrheit über Claras Doppelleben ans Licht: Als der Doktor an der Coal Hill School einen Kriegsroboter der Gattung "Skovox Blitzer" lokalisiert, muss das Trio die galaktische Gefahr gemeinsam abwenden.
