  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wir leben auf einer Insel der Seligen und jammern auf hohem Niveau, meint Pastor Veit Claesberg, wenn er an die Gesellschaft in Deutschland denkt. Claesberg und seine Tochter Cim haben das Projekt "HelpMy" ins Leben gerufen. Sie sammeln Spenden und unterstützen die Ärmsten der Armen in den Slums von Myanmar. Dabei geht es ihnen um drei Grundpfeiler des Lebens: Bildung, Nothilfe und Mission.'
