  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Trau, schau, wem?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Karl Faller ist allerbester Laune. Er möchte Sophie die Pacht für die Fallersäge anbieten und weiß ganz genau, dass sie sich darüber mindestens genauso sehr freut wie er selbst. Einzig Toni wird vielleicht ein wenig verschreckt sein, wenn Sophie dann seine einzige Chefin wird. Doch mit dem Schriftstück unterm Arm muss Karl im Sägewerk eine Entdeckung machen. Franz und Heinz übernehmen für einen Abend die Schicht im "Löwen". Seine Gourmetkünste im "Löwen" anzubieten, ist für Franz eigentlich unter seiner Würde, trotzdem macht er mit.
