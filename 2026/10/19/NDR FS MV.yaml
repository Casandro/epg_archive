  title: Wie geht das? Das Gummihuhn im Hochregal
  subtitle: Modernste Logistik im Heimtierbedarf
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: In Tarp bei Flensburg befindet sich Europas Marktführer für Heimtierbedarf. Auf 52.000  Quadratmetern Fläche lagern hier Fressnäpfe, Hundehütten und Gummihühner. Aber wie findet man in den kilometerlangen Regalen die Artikel möglichst schnell und effizient? Ein neues Hochregallager soll die Arbeit vereinfachen. 39.000 neue Palettenstellplätze entstehen und werden bald vollautomatisch mit Lagerbediengeräten befüllt, umgeordnet und geleert. Da hat auch ein Gummihuhn keine Chance, sich zu verstecken.
