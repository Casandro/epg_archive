  title: Na pěknú notečku
  description: Pozvánka do Brna i do Rožnova. Dnešní pořad je pozvánkou na dvě akce, které se uskuteční nadcházející víkend. Na první událost nás pozve Helena Brzobohatá z FS Jánošík Brno. Můžeme se těšit na informace ke 14. ročníku přehlídky dětských souborů s názvem "Na lidovú notečku". Druhou akcí bude oslava 65. výročí souboru písní a tanců Javořina z Rožnova pod Radhoštěm. Muzika tohoto souboru nám také zahraje a přidá se například i Brněnský rozhlasový orchestr lidových nástrojů či ostravská cimbálová muzika Technik. Pořad připravil Jaroslav Kneisl.
