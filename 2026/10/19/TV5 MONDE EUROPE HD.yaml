  subtitle: 'Au sommaire : La relève agricole au Canada, un chemin semé d''embûches ; lumières sur un concours de beauté pour vaches laitières.  '
  description: "Au sommaire :\n\nLa relève agricole, un chemin semé d'embûches\nPendant un an, immersion dans la vie de cinq jeunes agriculteurs, passionnés et résilients. De leur diplôme à la concrétisation de leurs défis professionnels, la réalité est souvent plus difficile que ce qu'ils avaient imaginé.\n\nConcours beauté pour vaches\nPlus d'une centaine d'éleveurs passionnés participent à la finale provinciale des expositions agricoles pour vaches laitières. Pour impressionner les juges, rien n'est laissé au hasard : toilette, alimentation, coiffure, marche, tout y passe ! \n\nPrésentation : Catherine Gauthier "
