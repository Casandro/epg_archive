  title: Tiere vor der Kamera - Schneehasen in Schottland
  description: Skihase, Osterhase, Angsthase. Hasen sind alltäglich in unserem Sprachgebrauch, doch was wissen wir über sie? Ein Hasenleben führten Ernst Arendt und Hans Schweiger drei Monate lang in Schottland und bekamen Neues und Lustiges über die Langohren vor die Kamera. "Nach eineinhalb Monaten gehörten wir einfach zum Alltag der Schneehasen, sie gaben sich ganz ungezwungen vor unserer Kamera. Wir wollen sie nicht vermenschlichen aber Parallelen sind unübersehbar, da gibt es so einiges zum Schmunzeln.
  widescreen: true
  subtitle: Tiere vor der Kamera - Schneehasen in Schottland
  genre:
  - '129'
