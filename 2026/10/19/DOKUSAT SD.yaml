  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Die Schlacht in der Philippinensee'
  description: Die Schlacht in der Philippinensee im Oktober 1944 war eine entscheidende Auseinandersetzung im Pazifikkrieg. Die US-Marine führte einen Luftangriff auf die japanische Flotte durch, um die Landung alliierter Truppen auf den Philippinen zu sichern. Obwohl die Japaner massive Verluste erlitten, entkamen viele ihrer Schiffe. Dennoch schwächte die Schlacht die japanische Marine erheblich und ebnete den Weg für die Befreiung der Philippinen und den Vormarsch der Alliierten im Pazifik.
  widescreen: true
  genre:
  - '129'
