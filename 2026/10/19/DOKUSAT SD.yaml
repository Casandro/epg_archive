  title: Tiere vor der Kamera - Dohlen in Stadt und Land
  description: Dohlen, kleine Rabenvögel, brüten an ungewöhnlichen Orten mitten in Deutschland, sogar in Erdölpumpen. Sie sind bekannt für ihre Sozialität und Intelligenz. In Städten wärmen sie sich an Kaminen, sammeln Nistmaterial im Park und spielen um Burgzinnen. Ihre Jungen erleben aufregende Abenteuer mit Autos, Radfahrern und Enten, was für viel Spaß sorgt.
  widescreen: true
  subtitle: Tiere vor der Kamera - Dohlen in Stadt und Land
