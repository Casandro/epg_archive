  title: Hitlers Blitzkrieg 1940 - Der Fall "Gelb"
  description: Es war ein gespenstischer Anblick an jenem 13. Mai 1940, als deutsche Panzereinheiten die französische Grenze bei Sedan erreichten. Mit ungeheurem Geheul stießen Stukkas auf die französischen Verteidiger herab, pausenlos feuerte die deutsche Artillerie. In nur drei Tagen sind Hitlers Armeen durch Luxemburg und Belgien gestürmt und werden binnen weniger Stunden Richtung Kanalküste vorrücken. Der Film dokumentiert in erschütternder Weise die Tragödie Frankreichs.
  widescreen: true
  subtitle: Hitlers Blitzkrieg 1940 - Der Fall "Gelb"
