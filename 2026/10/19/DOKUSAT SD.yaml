  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Nach Norden
  description: 'Am Nordpol steht für die Kodiak-Teams eine gefährliche Mission an: Zwei schwer verletzte Fischer müssen gerettet werden. Die Bedingungen sind extrem, Zeit ist knapp. Während das Rettungsteam sich durch das Eis kämpft, zeigen die übrigen Crewmitglieder auf der Station, wie ihr Alltag unter solch herausfordernden Bedingungen aussieht - geprägt von Zusammenhalt, Technik und der ständigen Bereitschaft für den Ernstfall.'
