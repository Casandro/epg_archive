  title: SWR Aktuell Langstrecke
  description: |-
    14:00
    SWR Kultur - Mein Mensch - Begegnungen, die das Leben verändern
    Lilly und der Vor-Vor-Vormieter
    Lilly ist 11, als eines Tages ein fremder Mann vor ihrer Wohnungstür steht. Sein Name ist Arthur. Er hat selbst einmal in dieser Wohnung gelebt und seine ganze Kindheit dort verbracht, bis er - etwa in dem Alter von Lilly - fliehen musste. Arthur ist Jude und hat die NS-Zeit nur dank eines Kindertransports überlebt. Alle anderen Mitglieder seiner Familie wurden ermordet. Heute ist Lilly Mitte 30 und der Holocaust ist durch Arthur zu ihrem Forschungsthema geworden.
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/

    14:30
    SWR1 Leute mit Marina Brutscher, Schlittenhundesportlerin
    Huskys sind mein Leben
    Huskys gehören bei Marina Brutscher zur Familie. Mit ihrem Siberian Huskyrudel hat sie in den vergangenen zehn Jahren erfolgreich an nationalen und internationalen Schlittenhunderennen quer durch Europa teilgenommen.
    Sie gehören dem A-Kader der Deutschen Schlittenhunde Nationalmannschaft an und waren mehrfach Deutsche Meister und unter den Top 10 der Weltrangliste.
    Sie verbindet ihre Leidenschaft zu den Huskys und zur Natur in verschiedenen Angeboten. So organisierte sie Husky Erlebnis Events im österreichischen Alpenraum. Und sie unterstützt Menschen, die Angst vor Hunden haben, ihre Angst zu verlieren.
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/
