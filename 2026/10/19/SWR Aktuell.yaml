  title: Der Tag
  description: Es wird gedrängelt, gehupt und ausgebremst - immer öfter. Das zeigt eine Studie der Deutschen Versicherungswirtschaft. Demnach werden die Teilnehmer im Straßenverkehr immer aggressiver, gerade die Jüngeren. Stress, Zeitdruck, zu volle Straßen - egal ob im Auto, zu Fuß, auf dem Roller oder Rad, wir alle bewegen uns mehr als früher und alle wollen schnell ans Ziel. Hinzu kommt, dass Maßnahmen, die die Verkehrswende begünstigen sollen, auch dazu führen, dass es auf den Straßen für manche Teilnehmer enger wird.
  subtitle: Hupen, drängeln, ausrasten - Warum fahren wir immer aggressiver?
