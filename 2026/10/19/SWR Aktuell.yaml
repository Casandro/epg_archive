  title: SWR Kultur - Das Wissen
  subtitle: Raus aus dem Extremismus - Strategien für Rechte und Islamisten
  description: |-
    Von Joseph Röhmel
    Rechtsextremistische Gewalttaten haben in Deutschland stark zugenommen. Aber auch Islamisten und Linksextremisten sind eine Gefahr für die öffentliche Sicherheit. Menschen mit extremistischer Ideologie zu deradikalisieren, bezeichnet das Bundesinnenministerium daher als eine zentrale Aufgabe der Terrorismusbekämpfung. Doch eine Deradikalisierung ist anspruchsvoll, sie dauert oft Jahre und benötigt viel Personal. Meist wird auch das persönliche Umfeld entsprechender Extremisten mit einbezogen. Wie stabil dann der jeweilige Ausstieg ist, lässt sich oft erst nach längerer Zeit erkennen. (SWR 2025/2026)
