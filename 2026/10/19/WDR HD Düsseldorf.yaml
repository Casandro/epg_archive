  description: 'Ein ungewöhnliches Abenteuer für Moderator Arndt Reisenbichler. Ein Campingtest auf engstem Raum. Sein Minicamper hat nur knapp zwei Quadratmeter Wohnraum und dennoch soll hier alles Platz finden, was man zum Leben braucht. Passend dazu besucht er auch besondere Übernachtungsangebote mit nur wenigen Stellplätzen. Abenteuer Minicamper auf dem Land und in der Stadt: So findet er zum Beispiel einen ehemals geheimen NATO-Bunker. Die riesige Anlage ist in Privatbesitz und der Zugang befindet sich im Garten des Besitzers. Dann gibt es noch ein Highlight: Einen Besuch in Luxemburg, mit einem Streifzug durch diese wunderschöne Stadt.'
