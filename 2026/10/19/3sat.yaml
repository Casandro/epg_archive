  title: 'Bergbauernleben: Vom Traunviertel ins Villgratental (2/2)'
  subtitle: Film von Dieter Pochlatko und Stefan Pichl
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Josef Schett wächst im schwer zugänglichen Villgratental auf. Der wuchtige Hof steht an einem Hang, der einem Respekt abverlangt. Von Anfang an spürt Josef eine tiefe Heimatverbundenheit.

    So bleibt er, während viele andere das Tal verlassen. Er übernimmt 1985 den elterlichen Hof, stellt auf Schafzucht um und gründet eine Vermarktungsfirma für Lammfleisch- und Naturprodukte aus Osttirol. Frei nach dem Motto: Altes bewahren, neue Impulse setzen.
    HD-Produktion
