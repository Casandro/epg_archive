  subtitle: Chaco und Anden
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Argentinien vereint Extreme: Gletscher, Wüsten, Regenwald und Megacities. Von den Anden bis zum Atlantik, vom Chaco bis nach Feuerland und Patagonien warten Naturwunder und Kulturen.

    Dort leben Menschen, die Traditionen mit Leidenschaft bewahren. Inmitten des Regenwalds stürzen die gewaltigen Iguazú-Wasserfälle auf fast drei Kilometern Breite in die Tiefe. Weiter südlich, in Misiones, baut die Familie Kraus nachhaltig Yerba Mate an.
