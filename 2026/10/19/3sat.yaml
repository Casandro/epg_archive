  title: Argentinien (2/4)
  subtitle: Pampa und Buenos Aires
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die gesamte Pamparegion erstreckt sich über 750.000 Quadratkilometer. Es ist ein einzigartiges Ökosystem mit extrem trockenen und sehr fruchtbaren Gebieten.

    In General Acha, mitten in der Pampa Seca, führt Gabriela Iturrioz einen Auktionshandel. Sie gehört zu den wenigen Frauen im Land, die Viehauktionen leiten. In Capitán Sarmiento, im fruchtbaren Teil der Pampa, liegt eine Hochburg für edle Pferderassen.
    HD-Produktion
