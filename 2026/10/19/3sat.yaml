  subtitle: Córdoba und Cuyo
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Im Andenhochland prägen bunte Gipfel die karge wüstenartige Landschaft. Auf gut 4200 Metern Höhe liegt die Laguna Brava, eines der letzten Refugien für bedrohte Flamingos.

    Ornithologin Rebecca Lobo beobachtet die Tiere und setzt sich für den Schutz von Natur und Vögeln ein. Bis zu 310 sternenklare Nächte gibt es im Nationalpark El Leoncito. Beste Bedingungen für das Observatorium Casleo, das sich dort angesiedelt hat.
