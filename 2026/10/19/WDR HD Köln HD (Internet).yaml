  title: Deadletter - Crossroads Festival 2024
  subtitle: Aufzeichnung vom 10. Oktober 2024 aus der Harmonie, Bonn
  description: '"Pretty fucking beige", antworten Deadletter auf die Frage, wie ihr Sound zu beschreiben ist. Die sechsköpfige Band aus Südwest-London zelebriert einen selten gewordenen Style zwischen Art-Rock, Dance-Punk und den Trademarks des Garage-Rock-Revivals der frühen 2000er. Trotz dieser Einflüsse klingt die Band zeitgemäß.'
- eventId: 907439
  start: 2026-10-19T01:45:00Z
  stop: 2026-10-19T02:45:00Z
  title: The Red Flags - Rockpalast Festival 2025
  subtitle: Aufzeichnung vom 09.10.2025 aus Bonn
  description: '2024 waren sie plötzlich in aller Munde - die Geschichte war aber auch zu schön: Eine junge Schulband tritt - gepusht von Jan Böhmermanns ZDF-Sendung "Lass Dich Überwachen!" - bei Rock am Ring auf. The Red Flags wurden in der Show entdeckt und von Böhmermann gefördert. Klanglich bewegt sich die Band zwischen Grunge, Punk und Alternative Rock, sie nutzen ihre Musik als Ventil für Ängste und Zorn.'
- eventId: 909332
