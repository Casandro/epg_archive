  title: Scorpion Child - Crossroads Festival 2024
  subtitle: Aufzeichnung vom 12. Oktober 2024 aus der Harmonie, Bonn
  description: Der Sound von Scorpion Child greift auf ihre Vorfahren aus den 1970er Jahren zurück, ergibt sich aber nicht der puren Nostalgie. Seit ihrem Debütalbum, das 2013 erschien, musste die bluesige Hardrock-Band aus Austin, Texas, viele Besetzungswechsel überstehen. Sie entfernte sich aber nicht von ihrem musikalischen Kern.
