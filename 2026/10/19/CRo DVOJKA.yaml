  title: Četba na pokračování
  description: 'Petr Sagitarius: Trujkunt - Čtverka (4/8). Major Roman Saran na stopě třineckému vrahovi. Ostravská kriminálka řeší případ dvou vražd, do kterých jsou zapleteni dávní spolužáci ze čtvrté základní školy v Třinci. Chodil do ní i major Sagan, přesto vyšetřování dlouho míří chybným směrem. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2023.'
