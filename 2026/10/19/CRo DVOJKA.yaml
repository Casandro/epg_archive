  title: Noční Mikrofórum
  description: 'Host: Tomáš Baldýnský, filmový kritik, publicista a scenárista. Dokáže se po letech hodnocení filmů ještě dívat na plátno očima obyčejného diváka? Jak moc se v něm ozývá kritik, když sám píše scénář? A může ho ještě nějaký film opravdu zaskočit či překvapit? Moderuje Jan Večeřa.'
