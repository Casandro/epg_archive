  - 881728
  start: 2026-10-19T19:00:00Z
  stop: 2026-10-19T20:00:00Z
  title: Stage
  description: Na Stagi si dnes poslechneme koncert sboru LADA z loňského ročníku Czeching Showcase v Archa+. Právě tam se představila živě trojice finalistů exportního projektu Radia Wave Czeching. Sbor Lada je pražský kolektiv věnující se pěvecké interpretaci moravského a slovenského folkloru. Soubor jedenácti členek se zformoval v roce 2015, ale jeho podstatu tvoří hluboká přátelství sahající až do poloviny 90. let a zkušenosti z dětského pěveckého sboru. Jejich repertoár tvoří především milostné písně, trávnice nebo balady. Stage laďte v pondělí ve 21:00. (repríza)
