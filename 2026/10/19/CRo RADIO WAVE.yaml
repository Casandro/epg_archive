  title: Fasády
  description: 'Taky se občas v nové čtvrti zastavíte a říkáte si - tady to vypadá jak v Kodani? Nejste daleko od pravdy! Města sezačínají čím dál tím víc podobat. A tohle téma otevřely i nejnovější Fasády. Může za to oblíbená trojice: gentrifikace, globalizace a turismus. Podle kunsthistoričky Kristýny Drápalové ale hraje roli i snaha zbavit se vizuálního smogu. Možná jsme si tak zadělali na další problém: nově vznikají místa, která vypadají čistě, uhlazeně a skoro identicky od Prahy po Soul. Proč si můžu dát stejného skořicového šneka na Dělnický v Holešovicích i v Helsinkách? A co s tou vší béžovou ztrácíme?'
