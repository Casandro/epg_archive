  title: In aller Freundschaft - Die jungen Ärzte (271)
  subtitle: Bleib dir treu
  description: 'Eigentlich ist Lilly Rieth "nur" vom Baum gestürzt. Da ihr Mann Tim Rieth aber auf einer Untersuchung besteht, erklärt sich die junge Frau einverstanden, sich im Johannes-Thal-Klinikum untersuchen zu lassen. Doch bei der Anamnese stellt Fachärztin Julia Berger noch etwas ganz anderes fest: Die 21-Jährige hatte noch nie ihre Periode. Lilly hat sich das mit ihren unsteten Lebensumständen erklärt und ansonsten das Problem verdrängt. Julia ordnet eine Untersuchung an und das Ergebnis ist ein Schock für Lilly. Sie gerät in eine Identitätskrise und stellt all ihre Lebenspläne infrage.'
