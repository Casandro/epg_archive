- eventId: 907033
  start: 2026-10-19T02:15:00Z
  stop: 2026-10-19T02:40:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 912137
  start: 2026-10-19T02:40:00Z
  stop: 2026-10-19T03:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  description: Auf Hof Schmidt im schleswig-holsteinischen Besenthal versorgt Marko Ladewig die jungen Kälber mit einer besonderen Milchpulver-Mischung. Jens Wöbb setzt auf seinem Blumenhof in Altengamme Nützlinge ein, um seine wertvollen Edelrosen gegen die rote Spinnmilbe zu schützen. Im Harzer Vorland bei Landwirt Steffen Thudt stehen Pflegearbeiten bei den Weinreben an. Damit die Trauben später größer werden und mehr Saft liefern, müssen sie an jeder Rebe Blätter entfernen.
- eventId: 912138
  start: 2026-10-19T03:10:00Z
  stop: 2026-10-19T03:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Haya Molcho, Köchin und Gastronomin'
  description: Hummus, Challah, Shawarma, kaum jemand kann die eklektische Küche Israels, Essen, Genuss und Kochen so liebevoll und energetisch vermitteln wie Haya Molcho. Die Starköchin, Unternehmerin und Mutter von vier Söhnen, kommt mit ihrem neuesten autobiografischen Kochbuch "Erinnerungen, die schmecken" aufs Rote Sofa.
