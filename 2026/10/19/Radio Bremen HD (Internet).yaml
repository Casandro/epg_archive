  description: "Rüsselhündchen: Am laufenden Band \nLeipzig schreibt schon wieder Geschichte: Einst international als Löwenfabrik bekannt und geschätzt, strahlt nun der Ruhm der beiden Rüsselhündchen Rina und Herbert in die Welt. Innerhalb von nur drei Monaten haben sie ganze drei Würfe zur Welt gebracht. Lasse Nieberding ist mächtig stolz auf die beiden und ihre rekordverdächtige Geburtenfrequenz. Zeit, einen Stammbaum der Leipziger Rüsselhündchen-Dynastie zu erstellen."
- eventId: 914452
