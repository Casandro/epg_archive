- eventId: 907033
  start: 2026-10-19T02:15:00Z
  stop: 2026-10-19T02:40:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 912137
  start: 2026-10-19T02:40:00Z
  stop: 2026-10-19T03:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  description: Auf Hof Schmidt im schleswig-holsteinischen Besenthal versorgt Marko Ladewig die jungen Kälber mit einer besonderen Milchpulver-Mischung. Jens Wöbb setzt auf seinem Blumenhof in Altengamme Nützlinge ein, um seine wertvollen Edelrosen gegen die rote Spinnmilbe zu schützen. Im Harzer Vorland bei Landwirt Steffen Thudt stehen Pflegearbeiten bei den Weinreben an. Damit die Trauben später größer werden und mehr Saft liefern, müssen sie an jeder Rebe Blätter entfernen.
- eventId: 912138
  start: 2026-10-19T03:10:00Z
  stop: 2026-10-19T03:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'Zu Gast: Haya Molcho, Köchin und Gastronomin'
  description: Hummus, Challah, Shawarma, kaum jemand kann die eklektische Küche Israels, Essen, Genuss und Kochen so liebevoll und energetisch vermitteln wie Haya Molcho. Die Starköchin, Unternehmerin und Mutter von vier Söhnen, kommt mit ihrem neuesten autobiografischen Kochbuch "Erinnerungen, die schmecken" aufs Rote Sofa.
- eventId: 913134
  start: 2026-10-19T03:55:00Z
  stop: 2026-10-19T04:20:00Z
  title: Elefant, Tiger & Co. (964)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: "Rüsselhündchen: Am laufenden Band \nLeipzig schreibt schon wieder Geschichte: Einst international als Löwenfabrik bekannt und geschätzt, strahlt nun der Ruhm der beiden Rüsselhündchen Rina und Herbert in die Welt. Innerhalb von nur drei Monaten haben sie ganze drei Würfe zur Welt gebracht. Lasse Nieberding ist mächtig stolz auf die beiden und ihre rekordverdächtige Geburtenfrequenz. Zeit, einen Stammbaum der Leipziger Rüsselhündchen-Dynastie zu erstellen."
- eventId: 914452
  start: 2026-10-19T04:20:00Z
  stop: 2026-10-19T04:50:00Z
  title: Wie geht das? Das Gummihuhn im Hochregal
  subtitle: Modernste Logistik im Heimtierbedarf
  description: In Tarp bei Flensburg befindet sich Europas Marktführer für Heimtierbedarf. Auf 52.000  Quadratmetern Fläche lagern hier Fressnäpfe, Hundehütten und Gummihühner. Aber wie findet man in den kilometerlangen Regalen die Artikel möglichst schnell und effizient? Ein neues Hochregallager soll die Arbeit vereinfachen. 39.000 neue Palettenstellplätze entstehen und werden bald vollautomatisch mit Lagerbediengeräten befüllt, umgeordnet und geleert. Da hat auch ein Gummihuhn keine Chance, sich zu verstecken.
  genre:
  - '112'
- eventId: 914953
  start: 2026-10-19T04:50:00Z
  stop: 2026-10-19T05:20:00Z
  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Trau, schau, wem?
  description: Karl Faller ist allerbester Laune. Er möchte Sophie die Pacht für die Fallersäge anbieten und weiß ganz genau, dass sie sich darüber mindestens genauso sehr freut wie er selbst. Einzig Toni wird vielleicht ein wenig verschreckt sein, wenn Sophie dann seine einzige Chefin wird. Doch mit dem Schriftstück unterm Arm muss Karl im Sägewerk eine Entdeckung machen. Franz und Heinz übernehmen für einen Abend die Schicht im "Löwen". Seine Gourmetkünste im "Löwen" anzubieten, ist für Franz eigentlich unter seiner Würde, trotzdem macht er mit.
