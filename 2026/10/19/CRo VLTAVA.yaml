  stop: 2026-10-19T09:00:00Z
  title: Vizitka
  description: 'Marek Hovorka, ředitel MFDF v Jihlavě. "Častokrát se nás lidé ptají, jestli může umění změnit svět. Rozhodli jsme se hledat filmy, které to prokazatelně dokázaly," říká k letošní sekci Filmy, které změnily svět - ředitel Mezinárodního filmového festivalu v Jihlavě Marek Hovorka. Tuto dnes i v zahraničí respektovanou kulturní událost založil spolu se čtyřmi spolužáky z jihlavského gymnázia v roce 1997. V oblasti festivalů je sám uznávaným odborníkem, který často usedá v porotách světových festivalových soutěží. Jak se za třicet let vlivem technologické revoluce, finančních i mezigeneračních výzev proměnily dokumentární filmy a filmařské postupy? A co všechno v souvislosti s dokumentem umožňuje online svět a co je naopak jeho nevýhodou? Nejen na to se zeptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
