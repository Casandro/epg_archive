- eventId: 877675
  start: 2026-10-19T18:00:00Z
  stop: 2026-10-19T20:00:00Z
  title: Koncert SOČR
  description: 'Ve výběru z nahrávek rozhlasových symfoniků zazní Antonio Vivaldi: Koncert pro hoboj, housle, smyčcové nástroje a basso continuo B dur RV 548, úprava pro trubku, hraje Jiří Houdek (trubka), řídí Vojtěch Spurný - J. S. Bach: Koncert pro dvoje housle a orchestr d moll BWV 1043, hrají Čeněk Pavlík a Václav Hudeček (housle), řídí Libor Pešek - Leonard Bernstein: Chichesterské žalmy, zpívají Chen Reiss (soprán) a Český filharmonický sbor Brno, řídí John Axelrod - Anton Bruckner: Symfonie č. 4 Es dur Romantická, řídí Robert Jindra. Připravil a uvádí Ondřej Scholtz.'
- eventId: 877676
  start: 2026-10-19T20:00:00Z
  stop: 2026-10-19T21:00:00Z
  title: Souzvuk
  description: 'Giuseppe Ungaretti: Starcův zápisník. Literárně-hudební pásmo z díla italského avantgardisty v překladu Jiřího Pelána a hudby Bohuslava Martinů. Připravila Lucie Barborková. Účinkují Ivan Řezáč a Lenka Novotná. Režie Jan Tůma (56 min). Natočeno v roce 2007.'
- eventId: 877794
  start: 2026-10-19T21:00:00Z
  stop: 2026-10-19T21:30:00Z
  title: Četba s hvězdičkou
  description: 'Choderlos Laclos: Nebezpečné známosti (2/10). Četba z epistolárního románu francouzského autora z 18. století. Příběh dvou libertinských šlechticů, vikomta de Valmont a markýzy de Merteuil, jejichž největší zálibou je zahrávat si s city ostatních lidí. Z překladu Dagmar Steinové připravila Zina Borůvková. Účinkují Daniela Kolářová, Pavel Soukup, Dana Černá, Zlata Adamovská a Martin Velda. Režie Petr Adler. Natočeno v roce 1990 (30 min).'
