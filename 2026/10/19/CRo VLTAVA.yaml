  title: Akcent
  description: Britská komička Diane Morganová v roli informačně omezené moderátorky Philomeny Cunk zase řádí. Na světě je nová řada pseudodokumentu, tentokrát s názvem Cunk on Cinema. Jak se tentokrát podařilo zesměšnit právě kinematografii? A proč je právě zobrazování smyšlených událostí, které jsou prezentovány jako skutečné, u diváků tak populární? Saša Michaillidis se ptá Antonína Tesaře a Kristiny Roháčkové.
- eventId: 877463
  start: 2026-10-19T15:02:00Z
  stop: 2026-10-19T16:00:00Z
  title: ArtCafé
  description: 'Přelet nad loutkářským hnízdem. To je název divadelní přehlídky, jejíž 36. ročník se uskuteční od středy 4. do neděle 8. listopadu v pražském divadle Alfred ve dvoře, v Klubu Letka a v divadle Minor. Letos zároveň uplyne deset let od zápisu českého loutkářství na seznam nehmotného kulturního dědictví UNESCO. Jak se tuzemskému loutkářskému řemeslu daří? Čím oslovuje dnešního dětského i dospělého diváka? Jak vypadají experimentální inscenace překračující hranice loutkového divadla? ArtCafé Hanky Malaníkové nabízí setkání s fenoménem současné české loutkové tvorby, která je progresivnější a angažovanější, než by se mohlo na první pohled zdát. E-mail: artcafe@rozhlas.cz'
- eventId: 877464
  start: 2026-10-19T16:00:00Z
  stop: 2026-10-19T16:30:00Z
  title: Jazzový podvečer
  description: O všem novém v jazzu s Davidem Bradou. Pro každého, kdo nepřestává hledat a chce zůstat "up to date", stejně jako autor pořadu, jenž flámoval s Quincym Jonesem. Každé pondělí uvádí David Brada.
- eventId: 877465
  start: 2026-10-19T16:30:00Z
  stop: 2026-10-19T17:00:00Z
  title: Četba na pokračování
  description: 'Markéta Pilátová: Tsunami blues (5/13). Román současné české spisovatelky vypráví příběh mladé trumpetistky, kterou připravily ničivé vlny tsunami o rodiče i o schopnost hrát a skládat hudbu a dívka se pak díky jedné hispanistce vydává na nečekanou výpravu. Připravil Jiří Vondráček. Účinkuje Dana Černá. Režie Vlado Rusko (24 min). Natočeno v roce 2015.'
