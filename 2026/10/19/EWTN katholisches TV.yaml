  title: Maria - Zwischen Himmel und Erde
  subtitle: Das marianische Thema - Neue Perspektiven
  description: 'In der 2. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup über neue Perspektiven auf das marianische Thema. Adam und Eva stehen für die brisanten Interessen, für Macht, Sexualität, Geld. Christus und Maria stehen für die Umkehrung in den Evangelischen Räten, für Gehorsam, Ehelosigkeit, Armut. Die Ehe ist das alte Zeichen des Heiles, wie die Nicht-Ehe das neue Zeichen des Heiles ist. In der Levir-Ehe des AT suchte der Mensch in Sohn und Sohnessohn das Reich des Messias zu erreichen. Jesus Christus aber sagt: Das Reich Gottes ist schon nahe.'
