  title: Dem Tod begegnen (2. Staffel)
  subtitle: Ja zum Leben
  description: |-
    Als in den 70er Jahren die Abtreibungsdebatte und  "Fristenregelungen" die westliche Welt aufwühlten, erkannte Johanna Gräfin von Westphalen früher als viele andere, was dies für das ungeborene Leben bedeuten würde. Sie wurde in der Politik aktiv und kämpfte fortan vehement gegen die Abtreibung und für den Schutz der Familie als Grundstein der Gesellschaft. 1988 gründete Gräfin von Westfalen die Stiftung JA zum Leben.
    Tochter Marie Elisabeth Hohenberg, die 2016 den Vorsitz der Stiftung übernahm, spricht mit  Christina Link-Blumrath über das Lebenswerk ihrer verstorbenen Mutter und die Arbeit und Entwicklung der Stiftung.
  widescreen: true
