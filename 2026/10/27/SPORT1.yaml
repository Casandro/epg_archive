  title: Hausmeister Krause - Ordnung muss sein Der Karnevals-Coup
  subtitle: Hausmeister Krause - Ordnung muss sein Der Karnevals-Coup
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. In dieser Episode geht es um den Rosenmontag in Köln-Kalk: Der Dackelclub begeht Karneval in gewohnt militärischer Form, die Dackel sind mit festlichen Hüten geschmückt, als die Horror-Meldung für Dieter aus dem Radio kommt: Ein Einbrecher, als alte Frau verkleidet, hat eine Wohnung in Kalk ausgeräumt! Mit Schlagstöcken und Funkgeräten bewaffnet, gehen Dieter und Herbert auf Ganovenjagd ...'
