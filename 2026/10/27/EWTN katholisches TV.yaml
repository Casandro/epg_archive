  title: Maria - Zwischen Himmel und Erde
  subtitle: Maria und die Dreiheit der Evangelischen Räte
  description: In der 3. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup über Maria und die Dreiheit der Evangelischen Räte. In der Mitte der Kirche stehen nach Lumen Gentium die Evangelischen Räte. Jeder Gläubige soll aus dem Bekenntnis zu diesen Räten leben. Ihre Dreigestalt läßt sich aus der Dreigestalt der Zeit ableiten, Vergangenheit, Gegenwart und Zukunft. Mit den brisanten Interessen will ich mich in der Zeit erhalten, was nicht gelingt, da ich sterben werde. Die Befreiung vom Tod bringen erst die Evangelischen Räte und das Leben in der Gnade.
  widescreen: true
