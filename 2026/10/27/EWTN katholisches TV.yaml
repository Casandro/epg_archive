  title: EWTN präsentiert
  subtitle: Das wunderbare Geschehen von Lourdes
  description: |-
    Anni Angele aus Leutkirch im Allgäu erzählt Pater Hubertus ihre Leidens- und Heilungsgeschichte.

    Sie kommt 1929 behindert auf die Welt und es beginnt ein Jahrzehnte währender Leidensweg. Anni Angele verliert das Augenlicht und kann kaum noch schlucken. Doch intensive Gebete, auch ihrer Eltern und eine Reise nach Lourdes führen zur Heilung und einem Leben ohne größere Komplikationen bis ins hohe Alter. - Anni Angele starb am 16. Januar 2017 mit 88 Jahren.
  widescreen: true
