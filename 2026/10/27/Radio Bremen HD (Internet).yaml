  title: In aller Freundschaft (335)
  subtitle: Geplatzte Träume
  description: Franz begleitet seinen Freund und Kollegen Holger, der von schweren Magenkrämpfen geschüttelt wird, in die Sachsenklinik. Sofort werden sie von Charlotte als legendäres Gastrotester-Paar "Schieber & Konarek" erkannt. Sie hofft, dass die beiden auch ein paar Zeilen über die Cafeteria schreiben. Doch Holger hat ganz andere Probleme, er hat sich offensichtlich eine Salmonelleninfektion geholt. Bald hat auch Franz gesundheitliche Probleme. Doch während es Holger bald besser geht, wird bei Franz von Dr. Heilmann ein Magenkarzinom diagnostiziert.
