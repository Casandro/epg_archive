  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: Diabetes-Typ-2 gehört in Deutschland und anderen Industrieländern zu den meistverbreiteten Volkskrankheiten. Neben erblichen Veranlagungen gelten Übergewicht, Bewegungsmangel und ungesunde Ernährung zu den wichtigsten Verursachern. Grund genug für Ernährungs-Doc Matthias Riedl und NDR Fernsehkoch Tarik Rose wieder einmal das Bewusstsein für ausgewogene Ernährung zu schärfen, damit die allgemeine Gesundheit unterstützt wird und der Blutzuckerspiegel stabil bleibt. Dafür haben sie reichlich Tipps und leckere Rezepte parat.
