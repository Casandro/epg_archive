  title: die nordstory - Überraschungen an der Kaikante
  subtitle: Rostocks Fischereihafen erfindet sich neu
  description: 'Kleiner Hafen mit großer Geschichte: Der Fracht- und Fischereihafen im Rostocker Stadtteil Marienehe war die Heimat der Hochseefangflotte der DDR und das Zentrum der Fischverarbeitung. Seit dem Ende der Planwirtschaft erfindet sich der Hafen an der Warnow immer wieder neu. Eine turbulente Reportage über die neuen Nutzer des alten Hafengeländes. Von brummigen Hafenarbeitern, fröhlichen Küchenfrauen, Tanzmädchen, Trödlern, Tierärzten und vielen mehr.'
  genre:
