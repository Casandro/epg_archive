  title: DAS! Rote Sofa
  subtitle: Comedian Ralf Schmitz
  description: 'In seinem allerneuesten Bühnenprogramm begibt sich Ralf Schmitz direkt hinein in die Welt der Superhelden. Sorgfältig seziert der Comedian deren Macken und setzt den Herren Supermann, Roter Blitz und Thor einen Gegenentwurf vor die Nase: "SCHMITZÄN", der auch Namensgeber dieser verrückten Show ist, die man sich als rasanten Mix aus Impro-Comedy, Stand-up und spontaner Publikumsbeteiligung vorstellen kann. Auf dem Roten Sofa wird uns Ralf Schmitz verraten, welche Menschen für ihn die wahren Heroen sind.'
