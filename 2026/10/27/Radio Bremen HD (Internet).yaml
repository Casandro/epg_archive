- eventId: 738283
  start: 2026-10-27T00:30:00Z
  stop: 2026-10-27T01:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: Diabetes-Typ-2 gehört in Deutschland und anderen Industrieländern zu den meistverbreiteten Volkskrankheiten. Neben erblichen Veranlagungen gelten Übergewicht, Bewegungsmangel und ungesunde Ernährung zu den wichtigsten Verursachern. Grund genug für Ernährungs-Doc Matthias Riedl und NDR Fernsehkoch Tarik Rose wieder einmal das Bewusstsein für ausgewogene Ernährung zu schärfen, damit die allgemeine Gesundheit unterstützt wird und der Blutzuckerspiegel stabil bleibt. Dafür haben sie reichlich Tipps und leckere Rezepte parat.
- eventId: 742697
  start: 2026-10-27T01:00:00Z
  stop: 2026-10-27T01:30:00Z
  title: Club-Legenden 2
  subtitle: Diskotheken, die Geschichte schrieben
  description: "In einer Zeit vor Smartphones und Social Media wurde anders gefeiert. Clubs und Diskotheken waren Treffpunkte, Freiräume und prägende Orte der Jugend- und Musikkultur. \n\"Club-Legenden\" blickt zurück auf die Blütezeit legendärer Tanztempel, Dorfdiscos und Szene-Clubs: von Alternative Rock bis Techno.\nDie zweite Folge erzählt der Großraumdiskothek \"Ziegelei\", dem \"Voilà\", dem  \"Fiz Oblon\" und der Diskothek \"Gummibärchen\"."
- eventId: 743411
  start: 2026-10-27T01:30:00Z
  stop: 2026-10-27T01:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
