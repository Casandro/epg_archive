- eventId: 672792
  start: 2026-10-27T00:15:00Z
  stop: 2026-10-27T01:07:00Z
  title: Planet Weltweit - Aubrac - Kühe, Käse, Kerle!
  subtitle: Planet Weltweit - Aubrac - Kühe, Käse, Kerle!
  description: 'Das Aubrac liegt im südwestlichen Zentralmassiv und gehört zu den kargsten und dennoch schönsten Landstrichen Frankreichs. Es ist die Heimat der Aubrac - Rinder, jener besonderen Rasse, von der man scherzhaft sagt, ihre Augen seien schöner als die der Mädchen. Und es ist das Land der Buronniers, jener Männer, die im Sommer jeden Morgen hingebungsvoll ihre Kühe auf den mit Blumen und Kräutern übersäten Weiden von Hand melken.  Das Aubrac: ein einsames Hochplateau vulkanischen Ursprungs, das sich über drei Departements erstreckt: Cantal, Lozère und Aveyron. Im Winter ein trostloser, gottverlassener Ort, im Sommer ein sattgrünes Auenland, übersät von Kräutern und Blumen, deren Vielfalt in Europa ihres Gleichen sucht. Sie schmecken nicht nur den Tausenden von stolzen Aubrac-Rindern, die von Ende Mai bis Mitte Oktober das Landschaftsbild des Hochplateaus prägen und deren Glockengeläut weit ins Land hinein zu hören ist. Die Flora des Aubrac liefert auch zwei weltberühmten Sterneköchen täglich neue Inspiration: Michel und Sébastien Bras. Sie locken Feinschmecker aus aller Welt ins malerische Örtchen Laguiole, in eine Gegend, die aufgrund ihres launischen Wetters lange Zeit als eine der gefürchtetsten Stationen auf dem Jakobsweg galt.  In diesem Jahr ist der Frühling spät in das Aubrac gezogen - höchste Zeit für die "Transhumance" - den alljährlichen Auftrieb zu den Sommerweiden. Sechs Monate standen die Tiere überwiegend im Stall. Jetzt rückt die Freiheit näher, und man spürt: Die stolzen Aubrac-Rinder können es kaum abwarten, in die Berge und auf die Weiden zu kommen. Doch das ist nicht allein der Grund für das lautstarke Muhen. Die Aubrac-Kühe rufen ihre Kälber. Aubrac-Züchter Phillippe Boubal treibt siebzig seiner Rinder in alter Tradition zu Fuß ins Hochland. DE 2013'
- eventId: 672797
  start: 2026-10-27T01:15:00Z
  stop: 2026-10-27T02:07:00Z
  title: Planet Weltweit - Chivas - Kolumbiens bunte Busse
  subtitle: Planet Weltweit - Chivas - Kolumbiens bunte Busse
  description: |-
    Wunderbar bunt sind die Busse Kolumbiens - die Chivas - und ein Wahrzeichen des südamerikanischen Landes. Über und über detailreich bemalt fahren diese zum Teil Jahrzehnte alten Vehikel bis in die entlegensten Dörfer und sind damit das wichtigste Transportmittel. Im Wettbewerb mit den modernen Bussen und Jeeps geraten die Chivas-Fahrer zunehmend unter Druck. Sie suchen nach einer Zukunft für das farbenfrohe Erbe auf den Bergstraßen. Ohne Chivas wäre Kolumbien nicht mehr das, was es ist.

    Andes, eine Kleinstadt in den kolumbianischen Bergen, ist das Zentrum der Chivas-Kultur. Die Busse sind umgebaute Lkw und werden aufwendig per Hand bemalt. Man nennt sie auch "buses de escalera" - übersetzt etwa "Leiterbusse" -, denn neben den Fahrgästen in der Kabine transportieren die Chivas seit Jahrzehnten auch allerlei Waren und landwirtschaftliche Produkte von und zu den Fincas abseits der Großstädte. Die Waren werden zumeist über Leitern auf dem Dach gehievt und dort verstaut. Die Chivas sichern damit seit langem das Überleben im kolumbianischen Hinterland.

    Einer der erfahrensten Chivas-Fahrer ist Humberto Restrepo, genannt Frijoles, übersetzt "Böhnchen", denn der 46jährige aß als Kind gerne Bohnen. Er fährt seit 27 Jahren mit seinem Bus über geteerte und unasphaltierte Straßen und Wege quer durch ganz Kolumbien. Zurzeit steuert Frijoles den Bus eines Freundes, da seine eigene Chiva neu bemalt wird. Seit 15 Jahren ist der Bus nicht mehr überholt worden, fünf Millionen Pesos wird die vollständige neue Bemalung kosten, immerhin fast 2000 Euro. Alejandro und Humberto Serna - die Maler, die den Bussen ihren eigenwilligen Charakter geben und sich auch um die Chiva von Frijoles kümmern, sind Stars in Kolumbien. Die Brüder haben die Kunst von ihrem Vater erlernt und setzen seit dessen Tod im Jahr 2010 die Familientradition fort. Unter ihren Händen entsteht in etwa zwei Monaten ein Meisterwerk auf zwei Achsen. DE 2013
- eventId: 672810
  start: 2026-10-27T02:15:00Z
  stop: 2026-10-27T03:07:00Z
  title: Planet Weltweit - Die goldenen Schildkröten von Madagaskar
  subtitle: Planet Weltweit - Die goldenen Schildkröten von Madagaskar
  description: Die Angonoka, so nennen die Madagassen die Goldene Schnabelbrust-Schildkröte, ist eine besonders edle Landschildkröte mit einem golden glänzenden Panzer. Sie ist nicht nur schön, sondern auch selten - und deshalb sehr begehrt bei Reptiliensammlern weltweit. Für die Angonoka auf Madagaskar ist das fatal. Neben den gut betuchten Sammlern, vornehmlich aus der westlichen Welt, haben immer mehr Asiaten Interesse an den Tieren. Jedoch nur am Panzer, der bei vielen dort als Aphrodisiakum gilt. Inzwischen ist der madagassische Nationalpark Baly Bay die letzte natürliche Zuflucht der Goldenen Schnabelbrustschildkröte, die weit über 100 Jahre alt werden kann. Aber ist der Tierbestand in dieser abgelegenen Region wirklich stabil oder droht der Art das Ende? Planet suchte auf Madagaskar nach Antworten und nach Spuren des Schmuggels. Der Biologe und ausgewiesene Angonoka-Experte Miguel Pedrono begibt sich zusammen mit dem Veterinär Ranto Rany-Ratiarison auf Spurensuche. Mit nur noch etwa 250 wildlebenden Exemplaren ist die Angonoka die seltenste Schildkrötenart der Welt. Die Preise, die für Angonoka-Babies auf dem Schwarzmarkt erzielt werden, sind abenteuerlich, bis zu US$ 50.000. Ihre lange Lebensdauer und dazu ihre Seltenheit machen die Tiere inzwischen unter skrupellosen Sammlern auch zur begehrten Geldanlage. Trotz internationaler Kampagnen, Hilfsgelder und Schutzprogramme werden so immer wieder Schildkröten außer Landes geschmuggelt - illegaler Tierhandel, und ein Raubzug mitten im Naturparadies Madagaskar. Die tropische Insel liegt rund 500 km östlich von Mozambique im Indischen Ozean. Es ist der Ort mit der größten Vielfalt an endemischen Arten weltweit. Doch der Lebensraum für die so einzigartige Tier- und Pflanzenwelt ist immer stärker bedroht. Von den rund 22 Millionen Menschen auf Madagaskar leben über 80% in ländlichen Regionen, Armut ist gerade hier weit verbreitet. DE 2014
- eventId: 672829
  start: 2026-10-27T03:15:00Z
  stop: 2026-10-27T04:07:00Z
  title: Planet Weltweit - Kuba, eine Generation im Wandel
  subtitle: Planet Weltweit - Kuba, eine Generation im Wandel
  description: "Kuba, über 60 Jahre nach der Revolution. Hunderttausende Menschen wurden in den letzten Jahren aus dem sozialistischen Staatsdienst entlassen. Nun ist Eigeninitiative gefragt. Die jungen Kubaner stellen sich auf ein neues Kuba ein, versuchen eigene Lebensentwürfe und Träume Wirklichkeit werden zu lassen.\nGilberto Valladares ist Unternehmer der ersten Stunde und Besitzer eines der angesagtesten Friseursalons der Stadt. Finanziellen Erfolg hat er erreicht, doch er möchte vor allem ein neues Kuba mitgestalten - ein Kuba, in dem das Miteinander nicht verlorengeht. Deswegen investiert er einen großen Teil seines Verdienstes in soziale Projekte. Das wichtigste - eine kostenlose Friseurschule. Hier gibt er Jugendlichen auf Abwegen eine Chance, ihrem Leben einen neuen Sinn zu geben.\n \nFriseurschüler Yoni ist aktuell das wohl größte Sorgenkind. Vom Polizeichef persönlich bei Gilberto abgegeben, geht es für Yoni jetzt ums Ganze. Bald volljährig muss er nicht nur die Prüfungen in der Friseurschule meistern, sondern auch eine Geschäftsidee umsetzen, die ihn in Zukunft ernähren kann: Friseure und Barbiere gibt es viele in Havanna - aber kaum jemand spezialisiert sich auf vierbeinige Kunden. Deswegen eröffnet Yoni einen der ersten Hundesalons der Stadt. Dringendstes Problem: einen Geschäftsraum finden. In der verfallenden Altstadt sind schon Wohnräume rar. So muss Yoni in anderen Vierteln auf die Suche gehen. \nEinige wenige Kubaner haben das Glück und erhalten finanzielle Unterstützung aus dem Ausland. So wie der Musiker und Renovierer Albertico, der es geschafft hat, in einem Vorort Havannas eine Wohnung für sich zu bauen. Der Umzug in die eigenen vier Wände steht vor der Tür und damit auch eine ganz neue Erfahrung für den jungen Kubaner - Einsamkeit im Luxus statt Gemeinsamkeit auf engstem Raum. \nGilberto, Yoni, Albert - sie sind die neue Generation Kubas, eine Generation, die sich dem Wandel stellt und ein neues Kuba mitgestaltet. DE 2014"
- eventId: 672830
