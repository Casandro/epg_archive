  title: Planet Weltweit - Marquesas-Inseln Das Comeback der Tattoos
  subtitle: Planet Weltweit - Marquesas-Inseln Das Comeback der Tattoos
  description: 'Planet Weltweit: Die Marquesas-Inseln mitten im Pazifischen Ozean. Tätowierungen am ganzen Körper waren hier lange Zeit ganz normal, bis Kolonialherren und Kirche solche Bräuche streng untersagten. Das alte Wissen geriet in Vergessenheit. Doch die Kultur erlebt jetzt ihr Comeback. Tattoos gehören in dem französischen Überseegebiet nun wieder auf alle Körperteile, auch ins Gesicht. Heretu Tetahiotupa und Teiki Huukena sind die Pioniere der neuen Tattoo-Bewegung auf den Marquesas-Inseln. Sie haben eine Tätowier-Schule ins Leben gerufen, in der das alte Wissen über die originalen Marquesas-Motive vermittelt wird.  Die Bedeutung der alten Tattoo-Zeichen ist fast komplett verloren gegangen. Auf Nuku Huva, der nördlichen Hauptinsel des Archipels, durchstreifen Heretu und Teiki die Waldgebiete. Hier verbergen sich Hinterlassenschaften ihrer Vorfahren und Hinweise zu ursprünglichen Tattoo-Motiven. Das früher nahezu komplett isolierte Insel-Volk auf den Marquesas entwickelte eine eigene Sprache und einzigartige Zeichensymbole. Die wurden als Tattoos unter die Haut gestochen und in Felsen geritzt. So haben einige Symbole die Jahrhunderte überdauert. Schätzungsweise seit dem 4. Jahrhundert wurde der Archipel von Seefahrern aus Westpolynesien besiedelt. Politisch und wirtschaftlich sind die Marquesas heute fest an Frankeich und Europa angebunden. Einst aber regierte hier ein recht kriegerisches Südsee-Volk, das Kannibalismus praktizierte und Menschenopfer darbrachte. Und: damals ließ man sich jeden Teil des Körpers tätowieren. Die Menschenopfer wünscht sich heute niemand zurück. Die Tätowierungen aber schon. Heretu gehört zur Avantgarde der Tattoo-Bewegung. Er hat sich sogar schon ein großes Tattoo ins Gesicht stechen lassen, wie einst die Vorfahren. Haben die martialisch anmutenden Tätowierungen eine Zukunft in der modernen Welt der Marquesas-Inseln? DE 2022'
- eventId: 672880
  start: 2026-10-27T06:10:00Z
  stop: 2026-10-27T07:02:00Z
  title: Planet Weltweit - Sibirien, die Eischneider von Jakutsk
  subtitle: Planet Weltweit - Sibirien, die Eischneider von Jakutsk
  description: 'In Jakutien, im östlichen Teil Sibiriens, herrschen im Winter extrem tiefe Temperaturen. Auf dem Fluss Lena wird die Flotte dann "tiefgekühlt" repariert! Es ist eine Technik, mit der Schiffe direkt im Eis überholt werden, ohne sie ans Ufer zu bringen. Wenn die Temperatur tief genug sinkt, fräsen die sogenannten "Eisschneider" ein Eislabyrinth von Tunneln unter die Schiffe nur mit Hacke und Motorsäge. GEO Reportage war mit ihnen im Eis der Lena. Russland, ein Land der klimatischen Gegensätze. Von den Subtropen im Süden bis zur Arktis im Norden. Auch in Jaktusk, am mächtigen Fluss Lena, haben Menschen gelernt zu überleben und sie versuchen, aus den harten Bedingungen im Winter ihrem Vorteil zu ziehen. Die Schiffe der Lena-Flotte frieren monatelang ein. Gewartet werden sie trotzdem: unter dem Eis, das erspart den Bau von Trockendocks. Zum Einsatz kommen dafür die harten Männer Sibiriens, zu denen auch Michail und Sascha gehören. Sie haben den Auftrag, einen Tunnel unter einem der großen Schlepper ins Eis zu schneiden, damit eine Inspektion an der Schiffsschraube durchgeführt werden kann. Das Problem ist nicht die Kälte, im Gegenteil. Im ausgehenden Winter herrschen inzwischen teils Temperaturen über minus 30 °C. Das Eis friert dann weniger stabil. Außerdem kämpfen Michail und Sascha immer wieder mit gefährlichen Gasblasen im Eis. Als Folge eines natürlichen, organischen Zersetzungsprozesses bilden sich diese permanent am Boden des Flusses. Im Winter sammeln sich die Blasen im Eis und bilden manchmal sogar vertikale Gasröhren, die auch "Luftschläuche" genannt werden. Wenn einer der Eisschneider eine solche Röhre durchbohrt oder ansägt, bricht das warme Flusswasser oft unter hohem Druck an die Oberfläche, wodurch die Eistunnel schnell völlig überflutet werden und teils wochenlange Arbeit umsonst war! Werden Michail und Sascha ihre Tunnel rechtzeitig vor Einbruch des Frühlings fertig bekommen? DE 2019'
- eventId: 672888
  start: 2026-10-27T07:10:00Z
  stop: 2026-10-27T08:02:00Z
  title: Planet Weltweit - Churubamba - Frauen am Ball
  subtitle: Planet Weltweit - Churubamba - Frauen am Ball
  description: "Peru - eine stille Bergregion fernab der großen Städte. Sanft schmiegen sich die Wolken an die malerischen Felsen, ein Lama kaut träge vor sich hin bis ein Aufschrei jäh die Stille unterbricht: \"Tooor!\" Eine Gruppe Frauen reißt jubelnd die Arme in die Luft. \"Bei jedem Tor würden wir am liebsten erst mal zehn Minuten lang lachen\", sagt Juana Estrada Huamán. Sie ist Verteidigerin im Fußballteam von Churubamba, einem kleinen Andendorf. Jeden Tag spielt sie auf 3.850 Meter Höhe gemeinsam mit zwei Dutzend weiterer Bäuerinnen Fußball. Kicken ist für sie Spaß, Spannung und auch Flucht vor ihrem Alltag aus Feldarbeit, Viehzucht, Haushalt und Kinderversorgung. Planet Weltweit begleitet Juana Estrada Huamán und ihre Mannschaft während einer Reihe turbulenter Spiele. \n\nIn Churubamba gibt es keinen Strom, kaum fließendes Wasser. Nicht einmal eine Busverbindung führt in das kleine Dorf. Der nächste Ort ist eine Stunde Fußmarsch entfernt. Dorthin laufen die Frauen nur, um hin und wieder ihre Produkte auf dem Markt zu verkaufen - oder um Fußball zu spielen! Sie kennen weder Beckham noch Ballack oder Zidane. Auch, dass im Jahr 2006 eine Fußball-Weltmeisterschaft ausgetragen wird, weiß in Churubamba niemand. Wichtig ist für die Frauen vor allem, wie es ihren Tieren, ihrem Land und ihrer Familie geht. Und es ist wichtig, wie das nächste Spiel ausgeht. \n\nDiesen Sonntag trifft das Frauenteam aus Churubamba auf Manco, ein Dorf auf der anderen Seite des Berges, gegen das sie noch nie gespielt haben. Die Stimmung an und auf dem Spielfeld brodelt, als ginge es um den Weltmeistertitel. Am Ende geht Churubamba als Sieger vom Platz. Die Prämie: ein Dutzend Meerschweinchen - Cuy, wie sie hier genannt werden. Kross gebraten sind sie eines der Nationalgerichte Perus.\n\nIm Spiel darauf gibt es keinen Grund zum Jubeln: Churubamba verliert gegen Huilloc, und damit auch den Siegpreis - diesmal sind es Hühner. Damit wird das nächste Spiel für Churubamba umso wichtiger. DE 2006"
- eventId: 672913
  start: 2026-10-27T08:10:00Z
  stop: 2026-10-27T09:02:00Z
  title: Planet Weltweit - Die rasenden Engel der Linea 5
  subtitle: Planet Weltweit - Die rasenden Engel der Linea 5
  description: 'Ein paar Bretter und vier Räder aus Kugellagern bestimmen ihr Leben: Auf ihren selbstgebauten Karren stürzen sich die Balineros die höchste und gefährlichste Passstraße Kolumbiens hinunter, um überall dort mit anzupacken, wo sie gebraucht werden. Ohne diese Männer würden die Fernfahrer, die ihre Waren über den Pass transportieren, oftmals scheitern. Die Reportage zeigt das Leben der Balineros am Pass der Línea 5 und begleitet einen Fernfahrer nach Buenaventura, der wichtigsten Hafenstadt Kolumbiens am Pazifik. Kolumbien - ein Land, das ein über 50 Jahre dauernder Bürgerkrieg beinahe unregierbar gemacht hat, ein Land, in dem Bedrohungen zum Alltag gehören. Unter diesen Bedingungen ist es nicht einfach, die Menschen mit dem Lebensnotwendigen zu versorgen. Es sind die Fernfahrer mit ihren Schwertransportern, die die Verbindung zwischen den Städten und Regionen aufrecht halten. Auf ihrem Weg durch Kolumbien müssen sie die Anden überqueren. Über die mittlere und höchste Bergkette, die Zentralkordillere, führt nur eine einzige für Lastwagen befahrbare Passstraße - die Línea 5. In unendlichen Kurven und Windungen geht es bis auf 3200 Meter hinauf und auf der anderen Seite wieder hinunter. Steile Serpentinen, Wetterstürze und Nebelschwaden machen die Passüberquerung extrem gefährlich. An diesem Nadelöhr zwischen Ost und West leben die so genannten Balineros - die "Kugellagerer". Auf selbstgezimmerten Karren, die sie aus ein paar Brettern und den heiß begehrten Kugellagern zusammenbauen, rasen die Balineros überall hin, wo sie gebraucht werden und anpacken können. Loco kann sich ein Leben ohne die Línea 5 nicht vorstellen, sie ist sein Wohnort, sein Arbeitsplatz, sein Lebenssinn - trotz der täglichen Gefahr durch Verkehr und Guerilla. Seit über 30 Jahren ist er mit seinen Kollegen hier jeden Tag bergab- und bergaufwärts unterwegs. DE 2004'
- eventId: 672922
  start: 2026-10-27T09:10:00Z
  stop: 2026-10-27T10:02:00Z
  title: Planet Weltweit - Hamburg - Welthafen mit schwimmender Kirche
  subtitle: Planet Weltweit - Hamburg - Welthafen mit schwimmender Kirche
  description: 'Mitten im Trubel des Hamburger Hafens, zwischen Containerschiffen, Schleppern und Schuten, gibt es die Flussschifferkirche, eine schwimmende Kirche. Ein "Seelenhafen" sozusagen, an dem Menschen mit ihren Sorgen und Nöten andocken können. Ein Kleinod, das dank der Ideen und der Tatkraft seines Diakons wieder ein besonderer Treffpunkt werden soll. Der Hamburger Hafen ist der größte Seehafen Deutschlands und der drittgrößte in Europa. Inmitten der historischen Speicherstadt ankert mit der Flussschifferkirche eine Insel der Ruhe. Die Idee entstand vor rund 150 Jahren auf Initiative des evangelischen Theologen Johann Hinrich Wichern und einiger christlicher Missionare, die sich um die Binnenschiffer im Hafen kümmerten, als Ergänzung zur Arbeit der Seemannsmissionen für die Hochsee-Matrosen aus aller Welt. 1952 wurde ein ehemaliges Transportschiff zur schwimmenden Kirche umgebaut. Ein Förderverein ist für die "Flusi" verantwortlich, wie sie liebevoll genannt wird. Mit dem neuen Diakon und Geschäftsführer Mark Möller sollen nun frischer Wind und neue Ideen in die Binnenschifferkirche einziehen. Nach Jahren als Seelsorger in England macht er sich mit dem Hamburger Hafen vertraut. Er besucht den Turmbläser auf der St. Michaelis-Kirche, den "Michel-Türmer" Josef Thöne, und bereitet schon seine erste größere Veranstaltung in der Flussschifferkirche vor, den Erntedank-Gottesdienst. Mit zum Team der "Flusi" gehört auch die Diakonin Christel Zeidler. Sie versorgt mit der Kirchenbarkasse "Johann Hinrich Wichern" einmal pro Woche Binnenschiffer, die weiter draußen im Hafen festgemacht haben. Währenddessen fiebert der Schiffsfotograf Dietmar Hasenpusch einem ganz anderen Ereignis entgegen: der Rückkehr des legendären Viermasters "Peking" nach Hamburg nach fast einem Jahrhundert.  DE 2020'
- eventId: 672923
  start: 2026-10-27T10:10:00Z
  stop: 2026-10-27T11:02:00Z
  title: Planet Weltweit - Mexiko - Die edlen Reiterinnen
  subtitle: Planet Weltweit - Mexiko - Die edlen Reiterinnen
  description: 'Die "Charreria" ist Mexikos Volkssport. Es ist eine Art Rodeo, bei dem die Charros, die mexikanischen Cowboys, ihre Künste beim Reiten, Fangen mit dem Lasso, beim Bullenreiten und beim Einreiten ungezähmter Pferde unter Beweis stellen. Seit den 1950er Jahren haben Frauen ihre eigene Disziplin bei der Charreria: Die "Escaramuza", was soviel bedeutet wie Geplänkel oder Scharmützel. Acht Reiterinnen in prächtigen, traditionellen Kleidern und im Damensattel vollführen dabei im Galopp eine Choreografie aus ebenso halsbrecherischen wie eleganten Figuren. GEO Reportage hat die stolzen Reiterinnen begleitet Die "Escaramuza" gilt als eigene Sportart und ist inspiriert von den "Adelitas", den Soldatinnen, die während der mexikanischen Revolution von 1910 an der Seite der Männer kämpften, um die Diktatur des Machthabers Porfirio Dias zu beenden. Seit 1991 ist "Escaramuza" offiziell ein Wettkampfsport. Zunächst treten die regionalen Reiterteams der mexikanischen Bundesstaaten gegeneinander an. Es geht um Schnelligkeit, Präzision, Eleganz und das Gesamtbild des Teams. Und darum, das Escaramuza-Finale im Spätherbst in Zacathecas zu erreichen. "Las alteñitas", die Hochländerinnen, gehören zu den besten Escaramuza-Teams Mexikos. Zusammen mit ihrem Trainer José Eduardo Moreno bereiten sie sich auf den letzten Qualifikations-Wettkampf in Queretaro vor. Alle stehen unter Druck, beim Training, bei den direkten Vorbereitungen und während der Wettkämpfe. Bei den Reiterinnen geht es immer auch um Werte und Themen, die im Leben der alten mexikanischen Familien eine Rolle spielen: Stolz, Ansehen und Passion, die Rolle der Frau, die Frage nach Tradition, Moderne und Identität. Wie weit werden es die Frauen vom Team "Las alteñitas" in diesem Jahr bringen?  DE 2018'
- eventId: 672940
  start: 2026-10-27T11:10:00Z
  stop: 2026-10-27T12:02:00Z
  title: Planet Weltweit - Die versunkenen Flugzeuge
  subtitle: Planet Weltweit - Die versunkenen Flugzeuge
  description: 'Holger Steinle ist ein Sammler: Im Auftrag des Deutschen Technikmuseums Berlin reist er um die Welt, um historische Flugzeuge aufzuspüren, zu bergen und zu restaurieren. Besonders interessiert er sich dabei für die Deutsche Luftfahrtsammlung, die in den Wirren des Zweiten Weltkrieges verschwunden ist. Steinle durchforstet ganz Europa nach den vermissten Fliegern; sucht in Wäldern, Gebirgen und vor allem in Seen.  Deutsche Ingenieure haben bis zum Zweiten Weltkrieg entscheidend zur Entwicklung der Luftfahrt beigetragen. Im Berlin der 1930er Jahre fand die größte Luftfahrtausstellung der Welt statt - hauptsächlich mit Maschinen, die vor oder während des Ersten Weltkrieg gebaut worden waren. Während des Zweiten Weltkrieges verschwand die berühmte Sammlung, die unter anderem Otto Lilienthals Fluggerät, Richthofens roten Dreidecker oder Ernst Udets Kunstflugzeug beherbergte, aus der umkämpften Stadt. Über Jahrzehnte galt sie als verschollen. Erst 40 Jahre nach Kriegsende stieß Holger Steinle zufällig auf Reste dieser außergewöhnlichen Ausstellung. Seitdem ist die Suche nach den Flugzeugen für ihn zur Lebensaufgabe geworden. Er inseriert weltweit in Zeitungen, geht Hinweisen von Zeitzeugen nach und befragt die Hinterbliebenen ehemaliger Piloten. Seine jüngsten Einsätze führen ihn nach Norwegen und Polen: In der Nähe von Prechlau soll einst vor den Augen der Dorfbewohner eine alte Rohrbach in einem Dorfsee versenkt worden sein. Steinle organisiert eine Suchaktion, bei der Taucher den Grund des Sees absuchen. Läge im Prechlauer See wirklich die Rohrbach-Roland, wäre das eine kleine Sensation! Viel Zeit hat Holger Steinle in Pommern jedoch nicht, denn ein anderer Auftrag wartet bereits auf ihn: In einem See nahe dem norwegischen Trondheim will er eine spektakuläre Bergung aus 60 Meter Wassertiefe durchführen. DE 2004'
- eventId: 672960
  start: 2026-10-27T12:15:00Z
  stop: 2026-10-27T13:07:00Z
  title: Planet Weltweit - Die Feuerflieger von Valencia
  subtitle: Planet Weltweit - Die Feuerflieger von Valencia
  description: Jedes Jahr verliert Spanien mehrere zehntausend Hektar Wald durch Feuer. Besonders in den heißen Sommermonaten wüten unzählige Feuer das ausgetrocknete Land und vernichten ganze Regionen. Gelingt es nicht, die Feuer stoppen, wird in 50 Jahren die Hälfte der spanischen Wälder für immer verloren sein. Um diese Entwicklung aufzuhalten, bekämpft eine Feuerpatrouille aus Hubschraubern und Löschflugzeugen Brände bereits aus der Luft. Vor wenigen Minuten hat Joaquim Miniana - genannt Chimo - den Einsatzbefehl erhalten. Er soll eine breite Feuerfront in einem Bergwald bekämpfen. Die Feuerleitstelle hat Luftunterstützung angefordert. Mit drei Tonnen Löschmittel beladen hebt Chimo ab. Beim Start kennt der Pilot selten mehr Details als seinen Einsatzort. Starke Winde treiben die Feuerwalze durch das ausgetrocknete Nadelholz, in Sekunden brennen ganze Bäume nieder. Chimo fliegt mit über 200 Stundenkilometern in wenigen Metern Höhe direkt auf die Spitze des Feuers zu. Das Flugzeug verliert durch den Abwurf fast die Hälfte seines Gewichts. Der Pilot nutzt den plötzlichen Auftrieb, um die Gefahrenzone so schnell wie möglich zu verlassen. An manchen Einsatztagen während der Feuersaison starten und landen die Flugzeuge bis zu 20 Mal. Seit den 1960er Jahren hat sich die Zahl der Waldbrände in Spanien verzehnfacht, heute brennt es bis zu 25.000 Mal pro Jahr. Hauptgrund dafür sind die durch Bewirtschaftung immer stärker austrocknenden Böden. Dennoch haben die Löschmannschaften Erfolge aufzuweisen - durch schnelle Ortung der Brandherde können viele Feuer frühzeitig bekämpft werden. Moderne Technik ermöglicht außerdem ein effizienteres Vorgehen. Dennoch bleibt der Job einer der gefährlichsten Berufe überhaupt - jedes Jahr verunglücken Piloten bei ihrer Arbeit. Auch Chimo hat bereits einen schweren Unfall hinter sich. Ein Ereignis, das ihn vorsichtig gemacht hat. DE 2008
- eventId: 672961
  start: 2026-10-27T13:15:00Z
