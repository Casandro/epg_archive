  title: Planet Weltweit - Kristall - die magische Kunst aus den Vogesen
  subtitle: Planet Weltweit - Kristall - die magische Kunst aus den Vogesen
  description: 'Planet Weltweit: Alles funkelt, alles stahlt: Die nördlichen Vogesen gelten als Wiege der Kristallherstellung in Europa. Vor allem drei französische Manufakturen haben Weltruhm erlangt: die Werkstätten Saint-Louis und Lalique sowie das Internationale Zentrum für Glaskunst in Meisenthal. Dort herrscht erst recht zu Weihnachten alle Jahre wieder Hochbetrieb. Die Nordvogesen sind wie gemacht für die Kristallherstellung. Hier entstehen schon seit Generationen glänzende, durchsichtige, glitzernde Kristall-Körper. Wandernde Glasmacher im 16. Jahrhundert wählten diese Region, weil hier alle natürlichen Ressourcen vorkommen, die für die Herstellung von Glas und Kristall unerlässlich sind: feinster Sand aus Flüssen und Gestein, ausreichend Holz für die pausenlos befeuerten Brennöfen und auch reichlich Wasser zur Kühlung des Glases. Die Arbeit der Glasmacher ähnelt seit jeher der Choreographie eines Balletts. Jeder und jede weiß, was zu tun ist. Alle Arbeitsschritte sind im Sekundentakt aufeinander abgestimmt. Nur dann kann die flüssige, rund 1400° Celsius heiße Glasmasse Qualität und Perfektion erlangen. Nach stundenlangem, vorsichtigen Abkühlen wird das Kristall geschnitten, geformt und poliert. Auch in den Werkstätten von Meisenthal, rund 50 km nordöstlich von Straßburg, sind die Öfen Tag und Nacht in Betrieb. Gerade jetzt, kurz vor Weihnachten, herrscht hier Hochkonjunktur. Im Fokus der Glasmacher stehen Tannenbaumkugeln aus Glas, allesamt Entwürfe von Designern. Kein Wunder, dass Weihnachten hier so kunstvoll zelebriert wird. Schließlich sagt man, dass vor allem die romantische Landschaft der Vogesen die Menschen hier schon immer angetrieben haben mag, Märchenhaftes zu kreieren.    DE 2022'
- eventId: 672976
  start: 2026-10-27T14:15:00Z
  stop: 2026-10-27T15:07:00Z
  title: Planet Weltweit - Die Vespa-Rebellen in Indonesien
  subtitle: Planet Weltweit - Die Vespa-Rebellen in Indonesien
  description: 'Indonesien schwingen sich Tausende junge Leute auf alte, umgebaute Vespa-Roller, um auf friedliche Art zu rebellieren. Gegen Langeweile und Chancenlosigkeit. Sie sind Anhänger der sogenannten "Extrem-Vespa-Szene", tätowiert, gepierct, tragen womöglich Dreadlocks. Höhepunkt ist das große Vespa-Roller-Jahrestreffen in der Stadt Kediri auf der Hauptinsel Java. Hier muss alles passen. Denn es geht nicht nur um Spannung und Spaß. Es geht auch ums Gewinnen. GEO Reportage war vor Ort. Vespas, die Italo-Roller von Piaggio, wurden lange auch in der Hauptstadt Jakarta hergestellt. Heute kostet eine alte Vespa umgerechnet 20 Euro, so viel kann sich ein junger Indonesier leisten. Im Gegensatz zu anderen Rollern wird bis heute an Vespas kein Kunststoff verbaut. Sie sind aus Metall und lassen sich gut umschweißen. Ideal für die Anhänger der "Extrem-Vespa-Szene". Sie fahren keine gewöhnlichen Motorroller wie Millionen andere Indonesier. Extrem-Vespa-Fans schweißen und schrauben Tag und Nacht an ihren Fahrzeugen. Vor allem jetzt, wo der Höhepunkt des Jahres ansteht: das große Szene-Treffen in Kediri, in Ost-Java. Das Festival lockt bis zu 50.000 Besucher aus ganz Indonesien an. Die Entfernungen sind teils erheblich. Viele sind Tage oder sogar Wochen unterwegs zum Event. Nicht so weit haben es Tajab und sein Freund Blablu, die selbst in Kediri leben. Sie wollen eine ganz besondere Vespa an den Start bringen: für die Wettbewerbskategorie "Schönheit", bei der das kreativste Gefährt gekürt wird. Aber was soll das Besondere ihrer Vespa sein? Die beiden durchforsten Werkstätten und Ersatzteilmärkte, um sich inspirieren zu lassen. Werden sie auf gute Ideen kommen? Und wie groß ist die Konkurrenz auf dem diesjährigen Festival? DE 2019'
- eventId: 672993
  start: 2026-10-27T15:15:00Z
  stop: 2026-10-27T16:07:00Z
  title: Planet Weltweit - Kalkstein - Das weiße Gold von Brac
  subtitle: Planet Weltweit - Kalkstein - Das weiße Gold von Brac
  description: 'Kalkstein von der kroatischen Insel Bra war über viele Jahrhunderte einer der begehrtesten Baustoffe Europas: Paläste und Kathedralen entstanden aus dem edlen weißen Stein. Die Ausbildung der Steinmetze hat Tradition, viele von ihnen erlangen bis heute auch als Künstler hohes Ansehen, vor allem wegen ihrer Skulpturen. Der Handwerksberuf hatte zwischenzeitlich an Strahlkraft verloren, mittlerweile wandelt sich das. Diese ganz besondere Ausbildung ist wieder im Kommen, auch bei jungen Frauen. Die sechzehnjährige Vanessa Martini arbeitet an einer imposanten Amphore aus Kalkstein. Es ist eine der Aufgaben, die sie während ihrer Ausbildung zur Steinmetztechnikerin absolvieren muss. Vanessa ist das einzige Mädchen unter den insgesamt sieben Lehrlingen ihrer Klasse. Es ist ihr Traumberuf, denn hier kann sie ihre künstlerische Ader voll ausleben. Seit Jahrhunderten schon inspiriert Kalkstein Künstler und Bildhauer, dient als Baustoff für beeindruckende Paläste und Kirchen. Auch im Weißen Haus in Washington und im Berliner Reichstag ist Kalkstein von der Adria-Insel verbaut. Darüber hinaus experimentieren viele Künstler auf Bra mit dem Rohstoff, erschaffen Plastiken und moderne Skulpturen, die sie in Galerien verkaufen. Zu ihnen gehört die Familie Jak¨i. Alle Mitglieder der Familie sind Künstler, Oma Ida entwirft und fertigt sogar Kleider aus Kalksteinplättchen. Kein Wunder, dass eine bekannte Musikerin jetzt auf den Geschmack gekommen ist und in diesem Aufsehen erregenden Outfit auftreten will. Auch Steinmetz-Azubi Vanessa arbeitet daran mit. Für die Insel Bra ist das wiedererwachte Interesse an der altehrwürdigen Kalkstein-Tradition wichtig, denn nur so hat dieses stolze Export- und Kulturgut eine Zukunft.  DE 2020'
- eventId: 672994
  start: 2026-10-27T16:15:00Z
  stop: 2026-10-27T17:07:00Z
  title: Planet Weltweit - Albanien - Die Stimmen der Schäfer
  subtitle: Planet Weltweit - Albanien - Die Stimmen der Schäfer
  description: 'Planet Weltweit: Über viele Jahrhunderte wanderten albanische Hirten mit ihren Tieren über den ganzen Balkan. Eine Tradition, die mit der sozialistischen Diktatur ein jähes Ende fand. Nach deren Niedergang besannen sich viele der einstigen Schäfer wieder auf ihre alten Bräuche und versuchten auch ihre Kinder für den Hirtenberuf zu begeistern. Doch die haben sich längst der Moderne zugewandt, studieren in den Städten und sehen keine Perspektive in der althergebrachten Tradition. Haben die Schäfer dennoch eine Zukunft in dem Balkanland? Bastri Limoj ist Hirte im südalbanischen Bergdorf Vranisht und lebt mit seiner Familie, von dem, was er mit seinen Schafen und Ziegen erwirtschaftet. Während der sozialistischen Diktatur unter Enver Hodscha, zwischen 1944 und 1990, wurden die Herden jedoch zwangskollektiviert, den Hirten weggenommen und in Gemeinschaftseigentum umgewandelt. Nach dem Ende des Regimes waren es die Alten, die sich wieder auf diese Tradition besannen, um ihren Lebensunterhalt zu verdienen. Nachwuchs gab es kaum. Zu mühselig erschien vielen jungen Menschen der Beruf, zu rückwärtsgewandt, mit zu geringen Verdienstmöglichkeiten. Auch Bastris Sohn Lucjano suchte wie viele seiner Generation ein besseres Leben in der Stadt und studierte Maschinenbau. Ab und zu kommt er in sein Heimatdorf zurück, um seinem Vater zu helfen. Der möchte diesmal, dass er ihn auch beim Auftrieb der Herde zur Sommerweide in die Berge begleitet. Der Weg über die Geröll-Pfade ist gefährlich für Mensch und Tier. Und auch oben auf den Weiden nimmt die Sorge um das Vieh nur selten ein Ende. Kein Platz für Schäferromantik außer in den überlieferten Polyphongesängen. Diese mehrstimmigen Gesänge mit einem tiefen Halteton stammen aus der Hirtentradition der Region - "Labëria" genannt. Mittlerweile greifen sie auch junge Leute begeistert wieder auf. Liegt hierin auch eine Chance für den Schäferberuf?  DE 2022'
- eventId: 673015
  start: 2026-10-27T17:15:00Z
  stop: 2026-10-27T18:07:00Z
  title: Planet Weltweit - Georgiens himmlische Klöster
  subtitle: Planet Weltweit - Georgiens himmlische Klöster
  description: 'Majestätisch thronen die Klöster Georgiens in der rauen Schönheit des Kaukasus, meist einsam und abgelegenen, oft in den Fels geschlagen. Die Klöster sind lebendige Zeugen der Anfänge der Christianisierung und damit auch der kulturellen Entwicklung der Menschheit. Seit der 1991 wiedererlangten Souveränität Georgiens bemühen sich Kirche und Staat, ihre alten Klöster wieder mit Leben zu erfüllen, sie vor weiterem Verfall zu bewahren, und zu restaurieren. Das ist, neben ihrer religiösen Bestimmung, heute die wichtigste Aufgabe der Mönche. Schon im ersten Jahrhundert entstanden nach dem Vorbild der urchristlichen Gemeinden von Antiochia und Jerusalem auch im heutigen Georgien erste urchristlichen Gemeinden. Bereits im Jahre 337 wurde in dem ostgeorgischen Königreich Kartli das Christentum zur Staatsreligion erhoben, lange vor der Christianisierung Europas. Die georgische orthodoxe Kirche ist autokephal, d.h. eigenständig. Damit konnten, vor allem in der Abgeschiedenheit der Klöster, viele alte kirchliche und kulturelle Traditionen, alte Produktions- und Lebensweisen bewahrt werden. Was auf die Betrachter aus der heutigen, schnelllebigen und technisierten Welt eine große Faszination ausübt. Auf dem Territorium des kleinen Staates, der nicht größer ist als das Bundesland Bayern, gab es vor der Sowjetherrschaft unzählige aktive Klöster. Nur wenige konnten bewahrt werden. Ihre kulturhistorisch wertvollen Bauten mit über 1000 Jahre alten Fresken und Ikonen wurden unter der kommunistischen Herrschaft entweiht: als Lagerhäuser, Viehställe oder Militärlager und Kasernen missbraucht. Immer wieder unternimmt Vater Artschil, ein junger Erzpriester, Reisen durch die Klöster des Landes. Er interessiert sich vor allem für die Entwicklung des klösterlichen Lebens, sowohl in religiöser als auch wirtschaftlicher Hinsicht. Welche Perspektive hat das traditionell so eng mit Georgien verflochtene Klosterleben in der heutigen Zeit? DE 2018'
- eventId: 673027
  start: 2026-10-27T18:15:00Z
  stop: 2026-10-27T19:07:00Z
  title: Planet Weltweit - Estland und das kleine Königreich der Seto
  subtitle: Planet Weltweit - Estland und das kleine Königreich der Seto
  description: 'Es ist eines der kleinsten Völker Europas: Die ethnische Minderheit der Seto lebt im Süden des heutigen Estland, ihr traditionelles Siedlungsgebiet reicht bis über die nahe Grenze hinein ins westliche Russland. Nur noch einige Tausend von ihnen gibt es heute, mit ganz eigener Kultur. Einer ihrer wichtigsten Bräuche ist die alljährliche Wahl des "Vizekönigs". Er vertritt ihren König "Peko" auf Erden, einen legendenumwobenen, heidnischen Gott. Zwar sind die Seto schon seit Jahrhunderten auch streng gläubige orthodoxe Christen, aber "Peko" und sein irdischer Stellvertreter genießen nach wie vor höchstes Ansehen. Rein Järvelill ist seit einem Jahr der Vizekönig. Wird er die Wahl auch diesmal wieder gewinnen? Heute verläuft mitten durch das Seto-Stammland die EU-Außengrenze. Ein schwieriger Status und sicher einer der Gründe, warum den Seto ihre Traditionen so wichtig sind. Kulte und Zeremonien werden entsprechend ernsthaft praktiziert. Zwar nimmt heute nicht mehr jeder die alten Legenden für bare Münze, da sie aber dem kleinen Volk ihre Identität geben, bleibt Tradiertes elementar. Das ganze Jahr hindurch ist Vizekönig Rein Järvelill im estnischen Siedlungsgebiet der Seto unterwegs, gerade jetzt vor dem Fest. Die Dörfer und einzelnen Höfe liegen verstreut und zum Teil sehr weit entfernt voneinander. Überall sind die Seto mit der Vorbereitung ihres wichtigsten Rituals beschäftigt: Schmuckschmiede, Seifenmacher, Köche und Sänger, sie alle wollen mithelfen, diesen besonderen Tag gebührend zu begehen. Schon die Kinder werden dabei mit den alten Traditionen vertraut gemacht. Der Festtag selbst ist dann endlich die Gelegenheit, die Trachten anzuziehen. Frauen zeigen ihren üppigsten Silberschmuck, Chöre singen alte Lieder. Und schließlich der Höhepunkt, das große Finale, nämlich die Wahl des Vizekönigs. Rein Järvelill gibt alles, um das Seto-Volk ein weiteres Mal hinter sich zu vereinen - seine Konkurrenten nicht minder DE 2020'
- eventId: 673028
  start: 2026-10-27T19:15:00Z
  stop: 2026-10-27T20:07:00Z
  title: Planet Weltweit - Peloponnes - Die Pioniere des Waldgartens
  subtitle: Planet Weltweit - Peloponnes - Die Pioniere des Waldgartens
  description: 'Planet Weltweit: Im Süden Griechenlands wachen die Gipfel des Peloponnes über einen Alltag, der nach wie vor hauptsächlich von der Landwirtschaft geprägt ist. Mit der Rückkehr der jungen Generation auf das Land ihrer Familien keimt Hoffnung: Permakultur und Agroforstwirtschaft sollen das in der Vergangenheit durch Monokulturen und Brände ausgelaugte Land zu neuem Leben erwecken. Inmitten der traditionell durch Monokulturen geprägten Ebenen des Peloponnes gibt es eine wahre Oase der Biodiversität. Möglich gemacht wurde das von Sheila Darmos, einer jungen Deutsch-Griechin. Sheila hat den Hof ihres Vaters Stavros übernommen, der als Bio-Pionier Griechenlands gilt: "Alle Pflanzen und Bäume wachsen auf mehreren Ebenen, wie in einem Wald. In diesem Waldgarten entscheiden wir selbst, welche Früchte die einzelnen Ebenen einnehmen und welche Art von Ernte wir haben möchten. Wir nutzen fast die gesamte Fläche, nicht nur über die gesamte Breite, sondern auch in die Höhe. Und erreichen dadurch mehr Biodiversität", sagt die gelernte Soziologin, die lange in Deutschland gelebt hat. Mit ihrer Organisation Southern Lights steht sie einheimischen jungen Bauern beim Wiederaufbau ihrer ausgelaugten Felder finanziell und beratend zur Seite, um dieses Modell in ganz Griechenland zu verbreiten. Unterstützt wird sie von Familie und Freunden, hochmotiviert und kämpferisch folgen ihr viele junge Landwirte, die nach folgenschweren Krisenjahren in Griechenland, die Höfe ihrer Eltern übernehmen und Neues schaffen wollen. DE 2022'
- eventId: 673062
  start: 2026-10-27T20:15:00Z
  stop: 2026-10-27T20:59:00Z
  title: Die Sonnenmenschen von Tokelau
  subtitle: Die Sonnenmenschen von Tokelau
  description: 'Drei kleine, einsame Atolle mitten im Pazifik, die zu Pionieren in Sachen Energieerzeugung wurden: Tokelau ist die erste Nation der Welt, die ihre Stromproduktion zu 100 Prozent auf Solarenergie umgestellt hat. Die Dokumentation beleuchtet, wie sich das Leben dadurch verändert hat. DE 2015'
- eventId: 673066
  start: 2026-10-27T21:05:00Z
  stop: 2026-10-27T21:57:00Z
  title: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  subtitle: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  description: 'Es ist ein Fluss der Superlative: Der Colorado entspringt in den Rocky Mountains und fließt durch den berühmten Grand Canyon. Doch in Mexiko, wo der Strom über Jahrtausende ins Meer mündete, kommt kaum noch ein Tropfen Wasser an. Die Mündung liegt seit Jahrzehnten trocken, eine Wüstenlandschaft. Zu groß ist der Wasserbedarf der Menschen im Einzugsgebiet des Colorados. Angesichts des Wassermangels erscheint verwegen, was mexikanische und amerikanische Naturschützer vorhaben: Die Mündung des Colorados soll wieder Wasser führen und ergrünen. Dabei sind die Herausforderungen groß. Seit 15 Jahren schneit und regnet es im Quellgebiet des Colorados in den Rocky Mountains weniger als zuvor. Der Wasserspiegel am Lake Mead, einem der größten Wasserreservoire der USA, sinkt. Dadurch muss ausgerechnet die Stadt Las Vegas Wasser sparen. Aus der verschwenderischen Wüstenmetropole ist eine Stadt mit Vorbildcharakter geworden: Sie verbraucht immer weniger Wasser, obwohl ihre Einwohnerzahl steigt. Anders in Arizona: Rund um die Stadt Yuma fließen weiterhin Milliarden Liter Coloradowasser in die Wüste, um die USA mit Salat und Gemüse zu versorgen. Die Dokumentation begleitet Menschen, deren Leben eng mit dem Wasser des berühmten Flusses verbunden sind. Sie zeigt Wasserpolizisten und Wüstengärtner in Las Vegas, die Bewohner zum bewussten Umgang mit dem kostbaren Nass bewegen. Das Kamerateam folgt Farmern in die Wüste Arizonas und kreativen Umweltschützern in das spektakuläre Coloradodelta. Ihre Geschichte zeigt, dass eine ausgedorrte Landschaft wieder erblühen kann, wenn der Mensch dem Fluss einen Teil seines Wassers zurückgibt. DE 2017'
- eventId: 673067
  start: 2026-10-27T22:05:00Z
  stop: 2026-10-27T22:56:00Z
  title: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  subtitle: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  description: Im Städtchen Torre Annunziata, kurz vor den Toren von Neapel, betreibt Lucio Zurlo seit über 50 Jahren ein erfolgreiches Boxstudio. Der 77-jährige ist in der Boxszene eine Legende. Etliche Meistertitel konnten seine Zöglinge einfahren, nationale wie internationale. Und doch hat Zurlos Studio seinen privaten Charme nie verloren. Für viele Boxsportler ist es das zweite Wohnzimmer. Profis und Laien gehen hier ein und aus. So manchen gar hat Zurlos Zuwendung aus dem kriminellen Milieu gerettet. Lucio Zurlos Studio namens "Boxe Vesuviana" liegt im Stadtviertel "Provolera", was in neapolitanischen Dialekt so viel bedeutet wie "Pulverfass". Es ist eine Anspielung auf den Vulkan gleich nebenan, auch darauf dass sich hier einst eine Militärstation befand - der Name könnte aber auch die soziale Sprengkraft des armen Viertels bezeichnen. Der Boxsport hat hier eine riesige Anhängerschaft. Es ist schlicht für viele der Weg heraus aus Tristesse, Straßengewalt und sinnlosem Dasein. Zurlo engagiert sich daher nicht nur für Sport und Titelkämpfe. Er ist vor allem ein sozialer Anlaufpunkt. Diese Dokumentation taucht ein in die Welt des neapolitanischen Box-Zirkus. Im Boxstudio trainieren Sportler unterschiedlichen Alters. Von Anfängern bis hin zu Profis, so wie zum Beispiel Salvatore Annunziata. Nach einem Jahr Pause bereitet sich der 30-jährige auf einen wichtigen Kampf vor, der ihm die Möglichkeit geben könnte, um den nationalen Titel zu boxen. Salvatore besucht Lucios Boxtraining schon seit dem 12. Lebensjahr. Einst war er ein eher schüchternes Kind. Doch mit den Jahren ist aus Salvatore ein professioneller Boxer geworden, der auch schon den Welttitel IBF sowie den Mittelmeer-Boxtitel gewonnen hat. Und doch reicht sein Verdienst aus dem Sport nicht aus, um damit seine Familie zu ernähren. So arbeitet er zusätzlich vier Tage pro Woche auf dem Markt von Ischia als Verkäufer von Bekleidung. Sobald er Feierabend hat, trainiert er auch dort, am Strand unter freiem Himmel. DE 2014
