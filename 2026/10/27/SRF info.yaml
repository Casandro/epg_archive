  title: Sternstunde Religion
  subtitle: Vom Umgang mit dem Tod
  description: |-
    Sterben müssen alle. Wie man damit umgeht und welche Rituale Menschen mit dem Tod verbinden, ist stark geprägt von Kultur und Religion. In einem multikulturellen Vorort von Amsterdam treffen diese Unterschiede aufeinander. Preisgekrönter Dokumentarfilm von Paul Sin Nam Rigter.
    Niederlande 2022
