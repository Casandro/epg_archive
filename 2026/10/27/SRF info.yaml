  title: Puls
  subtitle: Umstrittene Therapie - Kann man Long Covid wegdenken?
  description: |-
    Für Long Covid gibt es nach wie vor keine heilende Therapie. Betroffene müssen sich mit der Krankheit abfinden und mit ihr leben. Nun verspricht ein Therapiekonzept Heilung durch Hirntraining. Von den einen wird es gefeiert, andere warnen deutlich.
    Schweiz 2026
