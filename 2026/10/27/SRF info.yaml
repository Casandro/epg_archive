  start: 2026-10-27T11:00:00Z
  stop: 2026-10-27T12:00:00Z
  title: Sternstunde Philosophie
  subtitle: 'Klimakrise: Warum handeln wir nicht, Reto Knutti?'
  description: |-
    Hitzesommer, ausgetrocknete Seen und Flüsse, Gletschersterben: Der Klimawandel hinterlässt unübersehbar seine Spuren. Und dennoch sorgt das Thema oft nur für Achselzucken. Können wir uns diese Nonchalance leisten? Und auf wessen Kosten? Ein Gespräch mit Klimawissenschaftler Reto Knutti.
    Schweiz 2026
