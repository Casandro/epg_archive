  subtitle: 'Harald Schmidt: Warum können Sie nicht aufhören?'
  description: |-
    Harald Schmidt brachte Late Night nach Deutschland und wurde damit zum Star. Heute ist der 69-Jährige zurück beim Schauspiel und auf dem «Traumschiff» unterwegs. Bei «Gredig direkt» erzählt er, warum er im Kopf noch täglich eine Late-Night-Show produziert und warum er sich keine Sorgen machen will.
    Schweiz 2026
