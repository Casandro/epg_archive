  description: 'Am elften Tag des Wildnisabenteuers überraschen die Mädchen die Jungs mit einem Luxusfrühstück. Natürlich nach Wildnisart! Das macht gute Stimmung und gibt Energie für den anstrengenden Wandertag und die heutige Herausforderung: die sechs müssen sich auf einer gigantischen Schaukel zwischen Bäumen hinabschwingen lassen. Das ist eine große Mutprobe. Ob sie den Wildnisumschlag heute gewinnen können?'
