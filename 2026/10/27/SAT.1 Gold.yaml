  description: |-
    Ein Mann, der nach außen ruhig, zurückhaltend und völlig unauffällig wirkt. Eine junge Frau, deren Leben auf grausame Weise endet. Und ein abgelegener Ort, der zum Schauplatz eines brutalen Verbrechens wird: der "Mord im Nazibunker". Was geschah zwischen den beiden und wie konnte die Situation derart eskalieren? Bei den Ermittlungen zeigt sich nach und nach, dass hinter der unscheinbaren Fassade des Täters mehr verborgen lag.

