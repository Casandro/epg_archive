  title: Unexpected Killer - Die Mörder von nebenan
  subtitle: |-
    Der Albtraum einer Mutter
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: 'Als der 20-jährige Gonzalo Pizano-Guzman am 7. Juli 2000 spurlos verschwindet, beginnt seine Familie sofort mit der Suche nach ihm. Schon bald stoßen die Angehörigen auf sein ausgebranntes Auto - von Gonzalo selbst fehlt jedoch jede Spur. Erst der Fund einer Männerleiche im rund elf Kilometer entfernten Henry Hagg Lake bringt traurige Gewissheit: Es handelt sich um den Vermissten. Doch was geschah mit dem jungen Mann und wer steckt hinter der grausamen Tat?'
