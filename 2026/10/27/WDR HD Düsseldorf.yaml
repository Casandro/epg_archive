  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ein Fisch ist in der selbstgebauten Reuse im Fluss gefangen! Die Sechs diskutieren, ob sie ihn nun essen oder lieber wieder freilassen sollen. Es ist nicht einfach, ein Lebewesen zu töten, auch wenn man gerne Fleisch oder Fisch isst. Heute sollen Die Abenteurer einmal nicht in ihren Zelten übernachten, sondern sich selbst eine Unterkunft bauen - in den Bäumen. Die sechs sind total begeistert. In einem Baumhaus zu übernachten, ist für Melli und Sofie ein Kindheitstraum
