  title: So schmeckt die Welt - Turin
  subtitle: So schmeckt die Welt - Turin
  description: Eine faszinierende und modische Erkundung von Turin, die sowohl kulturell als auch stilvoll ist. Als Hauptstadt des Piemonts erstrahlt diese Stadt wie eine Königin unter den italienischen Metropolen. Im Gegensatz zu Rom ist sie nicht so laut, zu Mailand nicht so hässlich und zu Venedig nicht so überlaufen. Turin strahlt Exklusivität aus und beeindruckt mit Feinsinnigkeit, Charme und Eleganz. Fast schon ein Hauch von französischem Flair verleiht Turin seine Einzigartigkeit.
  genre:
  - '129'
  widescreen: true
