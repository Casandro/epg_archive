  description: "Aus Religion und Gesellschaft \n\nDas Thema, das Israel spaltet: Die Charedim und der Wehrdienst\nHeute wird in Israel ein neues Parlament gewählt. Ein brisantes Thema in diesem Wahlkampf: Der Wehrdienst für die Charedim. Bis vor etwa zwei Jahren waren junge Israelis, die sich dem Torah-Studium gewidmet haben vom Wehrdienst befreit. \n\nDas Museo Ebraico di Venezia wird wiedereröffnet \nDas älteste jüdische Ghetto Europas liegt in Venedig. Dort befindet sich seit über 70 Jahren eines der bedeutendsten jüdischen Museen der Welt. Ein Museum, das allerdings sieben lange Jahre geschlossen war - und nun nach aufwändiger Renovierung wieder besucht werden kann. Rund fünfeinhalb Millionen hat die Sanierung gekostet\n\nZwischen Diskriminierung und Wiederbelebung: Die Syrischen Orthodoxen Christen in der Türkei\nSie gehören zu den ältesten christlichen Glaubensgemeinschaften der Welt und beten bis heute in der Sprache von Jesus: Die Anhänger der Syrischen Orthodoxen Kirche. Ihr Zentrum liegt in der historischen Region Tur Abdin im Südosten der heutigen Türkei. Ab dem Beginn des 20. ..."
