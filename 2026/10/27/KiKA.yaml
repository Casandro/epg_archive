  description: |-
    Biber am Fluss

    Der kleine Hamid kämpft mit einem großen Puzzle auf dem Fußboden. Er hat keine Lust auszuprobieren, wo das Puzzleteil hineinpassen könnte, denn er möchte es von Anfang an richtig machen. Der Zauberschrank nimmt Zoé und Hamid samt QuackQuack als Waldhüter diesmal in eine Waldlandschaft mit. Dort treffen Zoé und ihre Freunde auf Tiere, die sich beklagen, weil der Fluss kein Wasser mehr führt. Wo könnte das Wasser hin sein? Zoé hat verschiedene Ideen. Ob sie dem Rätsel des verschwundenen Wassers auf die Spur kommt?
