  description: |-
    Elea wartet auf den Schnee

    Elea liebt den Winter und das Schlittenfahren. Leider gibt es gerade keinen Schnee in Berlin. Aber der wird bestimmt bald kommen. Zusammen mit ihrer Schwester findet sie im Keller einen alten Schlitten, den sie wieder fit machen möchte. So wird aus einem verstaubten, lange nicht genutzten, Schlitten Eleas erster eigener Schlitten. Nun fehlt nur noch Schnee.
