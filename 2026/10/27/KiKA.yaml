  description: |-
    Zauberer in Not

    Tanja und Zoé malen zusammen. Aber Tanja ist es peinlich zuzugeben, dass sie nicht weiß, wie man neue Farben zusammenmischt. Da meldet sich der Zauberschrank. Die Mädchen sind Burgfräulein auf einer prächtigen Burg. Dort begegnen sie einem freundlichen, aber schüchternen Ritter, der sie zur Kammer des großen Zauberers Abrakabam führt. Doch dem Zauberer misslingen heute alle magischen Tricks. Weder der Magische Würfel, noch die Magische Kugel tun ihre Dienste. Das kann nur daran liegen, dass er seinen Magischen Kegel verlegt hat. Zoé und Tanja helfen bei der Suche.
