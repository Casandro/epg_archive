    Fleißige Handwerker

    Finn und Tanja sind zu Besuch und bewundern Zoés Luftballons, die schon bald oben an der Zimmerdecke schweben. Finns Versuch, die Ballons mit Hilfe eines Pappkartons herunterzuholen, geht daneben. Doch dann befinden sich Zoé mit QuackQuack, Tanja und Finn in einem spannenden Abenteuer als Handwerker. Sie bekommen den Auftrag, Reparaturarbeiten im Haus von Mutter Natur zu erledigen. Dort ist einiges kaputt. Aber wenn man das richtige Werkzeug hat, geht selbst ganz kleinen Handwerkern alles flink und leicht von der Hand!
