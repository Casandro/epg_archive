    Was macht eine Logopädin?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" gibt es diesmal eine bunte Mischung. In einem lustigen Bilderrätsel verwandelt sich ein Buchstabe. Das ist ganz schön lustig! Nele ist zu Besuch bei der Logopädin. Dort lernt sie, auch schwierige Laute richtig auszusprechen. Kinder zeigen viele lustige Brillen. Auch Lola wünscht sich sehnlichst eine Brille. Ob sie wohl eine braucht? Anke Engelkes Füße können plötzlich nicht mehr sehen und brauchen dringend eine Brille. Und zum Schluss verabschieden sich André und Knolle mit einem spannenden Geschichten-Endspurt.
