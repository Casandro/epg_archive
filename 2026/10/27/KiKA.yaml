  title: PUR+
  subtitle: Eric klebt fest!
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Eric klebt fest!

    "PUR+"-Moderator Eric Mayer macht ein waghalsiges Experiment: Um zu testen, wie gut biobasierte Kleber haften, hängt er kopfüber an einem Brett in luftiger Höhe - festgeklebt!

    Wie lange wird es dauern, bis die Klebewirkung nachlässt? Noch nicht auf dem Markt erhältlich und noch in der Forschungsphase, testet Eric den biobasierten Kleber aus Mais, Zitrone und Harz. Welche weiteren Kleber aus der Natur gibt es?

    "PUR+" zeigt, wie Miesmuscheln und Napfschnecken Klebstoffe selbst herstellen und wie die Medizin davon jetzt schon profitiert. Ein wahrer Klebekünstler ist auch der Seestern, der wunderbar überall haften bleiben, aber sich davon wieder lösen kann. Ein österreichisches Forscherteam will dieses Klebeprinzip im Labor nachbauen.
    Buch/Autor: Sandra Palm

