  description: ia e per giustificare la sacralità del potere politico. Un elemento culturale sostanzialmente estraneo alla religione ebraica, radicata piuttosto nella cultura latina e greca. Forse anche per questo, le prime testimonianze sulla loro esistenza risalgono al IV secolo, quando ormai il cristianesimo si è ''romanizzato''. Elena, madre dell'imperatore Costantino, si reca in pellegrinaggio a Gerusalemme e conduce una vera e propria campagna di scavi alla ricerca della vera croce di Cristo. E poi ancora i volti di Cristo dal Mandylion di Bisanzio alla Sindone di Torino fino alle reliquie, totalmente immaginarie, create dalla fantasia di un fortunato racconto come quello del sacro Graal. In studio con Paolo Mieli, la prof.ssa Chiara Mercuri. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  Ospite in studio il prof. Chiara Mercuri Con la partecipazione di Pietro Sorace Regia Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini
