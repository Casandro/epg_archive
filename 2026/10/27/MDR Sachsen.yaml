  description: 'In den 1950er Jahren der DDR verliebt sich der junge hochtalentierte Maler Kurt Barnert in die Kunststudentin Ellie. Was er nicht weiß: Ihr Vater lebt wegen seiner NS-Verbrechen unter falschem Namen in der DDR, und seine dunkle Vergangenheit ist  eng mit Kurts eigener Familiengeschichte verknüpft. Nach der Flucht in die BRD sucht Kurt als Künstler nach seinem eigenen Ausdruck. Ohne es zu wissen, schafft er ein Gemälde, das eine unentdeckte Verbindung zwischen Täter und Opfer herstellt.'
