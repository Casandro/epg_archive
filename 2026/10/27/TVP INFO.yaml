  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Radosław Kotarski tym razem dosłownie i w przenośni podąża torami historii. Sprawdza, jak dawniej podróżowano koleją i dowiaduje się czym było piąte koło u wozu. Poznaje także sekrety, które skrywa zabytkowa parowozownia w Wolsztynie oraz próbuje uruchomić dawne maszyny i drezyny. To prawdziwie historyczna podróż.
