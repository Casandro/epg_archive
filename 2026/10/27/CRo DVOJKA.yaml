  title: Noční proud
  description: Hostem dnešního vysílání bude zpěvačka Lenny. Nezapadá do zavedených škatulek, opustila velké vydavatelství, vzala na sebe veškerá rizika a vydala pod vlastním labelem Weird & Wonderful Records rockem nasáklé album Good Omens. Zpěvačka desku poprvé pokřtí v pražském klubu Roxy, podruhé v londýnském Nottnig Hill Arts Clubu. Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.
