  title: Úžasné životy
  description: 'Štepánka Haničincová podle Jiřího Chalupy. Štěpánka Haničincová provázela dětstvím několik generací českých dětí. V 50. letech zakládala televizní vysílání a je podepsaná pod takovými fenomény, jako byl třeba Malý televizní Kabaret. V Úžasných životech na ni zavzpomíná dlouholetý kolega Jiří Chalupa, scenárista a dramaturg. Štěpánku Haničincovou si uchoval v paměti jako laskavého člověka, který si i v nepříjemných situacích zachovával úsměv na rtech. Autor: Jan Herget. Repríza.'
