  title: Četba na pokračování
  description: 'Anna Bolavá: Ke dnu (4/10). V době prvních mrazů je v močálech na kraji města nalezeno mrtvé tělo manželky lékaře Marka Diviše. Mezi obyvateli se začíná roztáčet kolotoč spekulací a pomluv... Adaptace Pavla Nejedlá. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Isteník a Barbora Goldmannová. Natočeno v roce 2018.'
