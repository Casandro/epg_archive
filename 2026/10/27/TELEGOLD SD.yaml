  description: Andy Borg ist eine Legende der Volksmusikszene. Seit Jahrzehnten begeistert er sein Publikum mit seiner einzigartigen Stimme und seinem charismatischen Auftreten. Als Interpret zahlreicher Hits und erfolgreicher Moderator hat er sich einen festen Platz in den Herzen der Menschen erobert. Seine Musik ist geprgt von traditionellen Klngen und modernen Elementen, die ein breites Publikum ansprechen. Mehr zu der Musik erfahren Sie in der Sendung Legenden der Volksmusik. Wir freuen uns auf Sie!
