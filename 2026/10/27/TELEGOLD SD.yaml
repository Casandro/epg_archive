  description: Die beliebtesten Wunsch-Hits des Tenors aus Südtirol, Rudy Giovannini, werden in dieser Sendung erfüllt. Mit strahlenden Tönen, die Rudy mit Leichtigkeit auch ohne technische Unterstützung singt, begeistert er seit über 20 Jahren seine Fans in ganz Europa. Aber auch Rudys groe Liebe, mit leisen zrtlichen Tnen, mit Herz und Gefhl Emotionen zu wecken, kommt in dieser Sendung nicht zu kurz. Erfahren Sie viel Wissenswertes ber Privates sowie die Karriere des Ausnahme-Interpreten Rudy Giovannini.
