  title: Djeca sunca, dokumentarna serija (7/7)
  subtitle: ' '
  description: U sedmoj i završnoj epizodi serije Djeca sunca čut ćemo priču o neutrinima. Upoznat ćemo prvu i najveću europsku solarnu elektranu u malom španjolskom mjestu Sanlúcar la Mayor kraj Seville, koja će podmirivati potrebe 153.000 domova. U nastavku priče o helioterapiji upoznat ćemo rad dr. Harryja Rileyja Spittlera, koji je razvio znanost "sintoniku". Vidjet ćemo reportažu s trodnevnog rituala vezanog uz zimski solsticij koji u Meksiku svake godina održavaju pripadnici drevne tradicije Tetzkatzlipoka.
