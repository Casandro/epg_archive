  description: Judoka Eike Voss wird mit gerissener Achillessehne in die Sachsenklinik eingeliefert und von Dr. Lucia Böhm und Benno Nowak behandelt. In der Klinik trifft er zufällig auf seine Schwiegermutter Claudia Hegebart, zu der er lange keinen Kontakt hatte. Nun steht die Auflösung des Grabs seiner verstorbenen Frau Flora an und Claudia möchte unbedingt an der Ruhestätte ihrer Tochter festhalten. In der Aussprache mit Eike offenbart sie schließlich ein Geheimnis, das seine Entscheidung, das Grab aufzulösen, ins Wanken bringt.
