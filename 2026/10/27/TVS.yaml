  title: 'Rosamunde Pilcher: A do nieba tak blisko 1 (odc. 58)'
  subtitle: 'Z okazji 30. rocznicy ślubu Edwiny i Henry''ego Harleyów do rodzinnej rezydencji przyjeżdżają ich dzieci: Rodney z Londynu i Tessa z Paryża.'
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Dem Himmel so nah
    AT,DE, 2004
    Reżyseria: Dieter Kehler
    Występują: Renate Schroeter, Claus Wilcke, Janina Flieger, Wanja Mues, Marisa Burger, Alexander Wussow
    Ku wielkiej radości Edwiny i Henry'ego Harleyów, którzy są szczęśliwie małżeństwem od 30 lat, syn Rodney z Londynu oraz córka Tessa z Paryża również przyjeżdżają na rocznicę ślubu. Nastrój w dużej rezydencji zmienia się, gdy Tessa wyjawia rodzicom, że jest w ciąży. Nie chce ujawniać, kto jest ojcem, i postanowiła wychować dziecko sama. Nikomu nie przychodzi do głowy, że hodowca koni Thomas White, właściciel farmy niedaleko Heavens Hill, mógłby być ojcem.
