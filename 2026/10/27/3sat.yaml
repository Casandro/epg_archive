  title: 'Ein Stück Österreich: Das Gesäuse'
  subtitle: Film von Christina Geyer
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Enns ist die wilde Schwester der Salzach und bahnt sich ihren Weg durch die schroffen Kalkwände des Gesäuses. Die Dokumentation begibt sich auf Spurensuche durch die Geschichte des Tals.

    Im Ennstal, zwischen tosenden Wassermassen, dichten Wäldern und markanten Felswänden schlängeln sich Pfade hinauf zu den Gipfeln der umliegenden Berge. Dort oben, wo Stille und ein atemberaubendes Panorama warten, wandern Bergsteiger.
