  title: Traumschlösser und Ritterburgen - Das Südburgenland
  subtitle: Film von Fritz Aigner und Alfred Ninaus
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Von der Ritterburg bis zum Friedenszentrum - die Burgen und Schlösser im Südburgenland zeugen auf charmante Art und Weise von der bewegten Geschichte im südöstlichen Grenzland Österreichs.

    Lebensfreude und das Miteinander prägen heute die südburgenländischen Burgen und Schlösser. In einem Land, das jahrhundertelang umkämpft war, tummeln sich Opernstars und Möchtegern-Ritter, Friedensvermittler und Hochzeitsverkünder rund um die einstigen Wehrbauten.
    HD-Produktion
