  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Überraschungssieg in Serbien - Die Studentenliste gewinnt die Wahl gegen Aleksandar Vucic. In Belgrad wird gefeiert: Gespräch mit Breza Race Maksimovic.

    Dubioza Kolektiv - Die Band verbindet Balkan-Sounds mit Ska, Punk, Hip-Hop und elektronischer Musik und nutzt ihre Musik als Sprachrohr für politische Themen. Jetzt gehen sie in Bayern auf Tour.

    "NAZA" und "NAZA: The Real Story" - Zwei Filme ringen in Israel kurz vor der Wahl um den Blick auf die zivilen Toten des Gazakriegs. Der Film "NAZA" von Yuval Abraham und Rachel Szor und "NAZA: The Real Story" in dem ein Soldat darüber spricht, wie umfassend die Hamas zivile Umgebungen militärisch beziehungsweise terroristisch nutzte. Welche Auswirkungen haben die beiden Filme auf den Wahlkampf in Israel?

    Georg Büchner - Preis - Die Deutsche Akademie für Sprache und Dichtung vergibt den Georg-Büchner-Preis 2026 an Christine Wunnicke.

    Nachruf auf Joachim Lottmann - Der Schriftsteller Joachim Lottmann verstarb am 25. Oktober nach schwerer Krankheit in Wien. "Kulturzeit" hat ihn kürzlich besucht und mit ihm über sein Leben und Sterben gesprochen.

    Moderation: Lilian Moschen
    HD-Produktion
