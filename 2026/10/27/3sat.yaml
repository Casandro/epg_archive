  title: nano
  subtitle: Die Welt von morgen
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Bezahlbarer wohnen in Berlin - Die Berliner Linke gewann den Wahlkampf um das Abgeordnetenhaus auch mit dem Versprechen, rund 200.000 Wohnungen zu vergesellschaften. Viele erhoffen sich dadurch dauerhaft niedrigere Mieten und mehr verfügbaren Wohnraum. Doch kann dieses Modell tatsächlich funktionieren und ließe es sich auf andere Städte übertragen?

    Pestizide ohne Verfallsdatum - Pestizide finden sich selbst auf der Zugspitze in fast 3.000 Metern Höhe. Dennoch will die EU ihre Zulassung deutlich vereinfachen. Umweltverbände, Wissenschaftler und Politiker warnen vor Risiken für Gesundheit und Artenvielfalt, Landwirte hoffen auf schnellere Verfahren und neue Wirkstoffe. In Brüssel fällt die Entscheidung, wie streng Pestizide künftig noch kontrolliert werden.

    Weddellmeer in Gefahr - Das Weddellmeer zählt zu den letzten weitgehend unberührten Meeresgebieten der Erde und erwärmt sich bislang nur sehr langsam. Als wichtiger Rückzugsraum für kälteliebende Arten könnte es helfen, das Artensterben zu bremsen. Dennoch scheitert die Ausweisung als Naturschutzgebiet bislang an geopolitischen Einzelinteressen.

    Moderation: Eric Mayer
    HD-Produktion
