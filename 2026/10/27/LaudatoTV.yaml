  title: Blagoslovljen tek
  subtitle: Religijski
  description: Na zagrebačkoj Trešnjevci ugostili su nas Emica i Damir Macan, bračni par koji slavi punih 40 godina braka u kojem su blagoslovljeni s dvoje djece i četvero unučadi. Emica i Damir otkrivaju nam kako su kroz životne kušnje, krize, ali i brojne milosti, učili vjerovati i ne odustajati. Njihova priča govori o tome da nas Gospodin poziva u svakom životnom razdoblju, samo je pitanje hoćemo li se odazvati. U kulinarskom dijelu pripremaju gulaš sa žgancima te mramorni kolač.
- eventId: 1011369
  start: 2026-10-27T09:20:00Z
  stop: 2026-10-27T10:25:00Z
  title: Otvori spomenar
  subtitle: Religijski
  description: 'U novoj sezoni emisije " Otvori spomenar!" gostuje mladi kršćanski duo ZANAS koji je osvojio publiku prekrasnim duhovnim pjesmama, snažnih poruka i modernog zvuka. Duo čine dvojica talentiranih i simpatičnih mladića: Mateo Marić i Marin Lučić koji su i privatno najbolji prijatelji. Trap glazba ima dobar ritam ali i poruke koje mlade ljude mogu odvesti u krivom smjeru. Kršćanski sastav ZANAS donosi pjesme u najljepšem svjetlu, ispunjene Božjom ljubavi. Otkrit će nam, jesu li oduvijek znali da će tako izgledati njihov put i kada se sve promijenilo. Upoznat će nas i s trećim članom sastava ZANAS, kojeg uvijek stavljaju na prvo mjesto i kažu:" Ne ja, nego Ti!" zahvaljujući za sve blagoslove.'
- eventId: 1011370
  start: 2026-10-27T10:25:00Z
  stop: 2026-10-27T10:53:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Jedini način da budemo sposobni živjeti život vjere, život pun ljubavi, mira, radosti i snage jest po Duhu Svetome. To vidimo vrlo jasno u životima Apostola. Oni su u svakoj prednosti jer su bili s Isusom i čuli ga kako propovijeda te vidjeli mnoga čudesa koja je učinio. A opet, čak i s tom prednosti bili su uplašeni muškarci koji žive svoju vjeru u zaključanoj sobi prije negoli su primili Duha Svetoga. To što se je dogodilo u gornjoj sobi promijenilo je život tih muškaraca i žena i ubrzo i tijek ljudske povijesti. To iskustvo Duha Svetoga je susret dostupan svakome; nije rezerviran za nekoliko izabranih. Pedesetnica i preobražavajuća sila Duha Svetoga tema je ove epizode.
