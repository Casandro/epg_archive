  title: Superknjiga
  subtitle: Animirani
  description: Luka je dobio zadatak da nakon škole pomogne Tomi i Beniju s instrukcijama iz kemije. Međutim, kada oni počnu ismijavati njegov talent za kemiju te mu se rugati da je štreber, Luka umalo 'poludi'. Superknjiga intervenira na vrijeme i djecu odvodi da upoznaju Nehemiju koji se suočio sa sličnim izazovom ismijavanja i ruganja kada je pokušao obnoviti zidine Jeruzalema. Luka, Ela i Gizmo se nađu uključeni u opasnu zavjeru Nehemijinih neprijatelja koji su se svim silama trudili osujetiti njegov plan obnove zidina, a na kraju i ubiti ga. Kroz sve to Luka shvaća da može uspjeti ako se drži posla koji mu je Bog dao - i ne obraća pažnju na podrugljivce. Nehemija završava zadatak obnove čitavog jeruzalemskog zida u pedeset i dva dana, a Luka se vraća kući s obnovljenom predanošću, i planom da pomogne Tomi i Beniju shvatiti da kemija može biti stvarno cool.
