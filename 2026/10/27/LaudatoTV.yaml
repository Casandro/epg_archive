  title: Izdvojeno
  subtitle: Religijski
  description: Venezuela - zemlja Latinske Amerike na obali Karipskog mora i Atlantskog oceana. Prirodnim ljepotama privlači mnoge turiste. No, kakav je stvaran život domaćeg stanovništva - od velikih gradova i siromašnih favela do izoliranih plemena Amazonske prašume? Ovoj zemlji kao misionar odlučio je služiti salezijanac don Tomislav Puškarić. Već kao bogoslov prošao je put od poučavanja matematike u amazonskoj prašumi do pastoralnog rada u Petareu, jednoj od najvećih favela Južne Amerike. Ovog ljeta, nakon što su zemlju pogodili razorni potresi, don Tomislav je bio produžena ruka humanitarne pomoći. Kako izgleda svakodnevni život i preživljavanje u Venezueli? Što je naučio od naroda koji unatoč golemoj patnji ne gubi vjeru i osmijeh? Poslušajte dirljivo svjedočanstvo u emisiji ,,Izdvojeno.
