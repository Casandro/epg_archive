  description: 'Prisjećamo se povijesti klarisa u Svetoj Zemlji: od mučenica iz Akre, preko osnutka samostana u Nazaretu i Jeruzalemu, sve do međunarodne zajednice koja danas moli u srcu Svetog grada. U Getsemaniju, među stoljetnim stablima maslinama koja su bila svjedoci Isusove molitve, volonteri iz cijeloga svijeta okupljaju se na berbi maslina. Dobiveno ulje namijenjeno je za sveta ulja koja se blagoslivljaju tijekom Mise posvete ulja. U okolici Jerihona, jedinstvena klima doline rijeke Jordan daje datuljama sorte Medjoul posebna svojstva. Riječ je o voću koje osigurava egzistenciju mnogim obiteljima.'
