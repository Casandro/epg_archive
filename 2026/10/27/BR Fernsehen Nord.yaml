  description: 'In "Steirerrausch" bekommen es Hary Prinz alias Chefinspektor Bergmann und Anna Unterberger als seine neue Partnerin Anni Sulmtaler mit einem nicht alltäglichen Mordfall zu tun: Um einen Todesschuss bei einer spirituellen Sprechstunde aufzuklären, müssen auch übersinnliche Zeugen in Betracht gezogen werden. Denn nichts ist, wie es scheint! Adele Neuhauser spielt ein Medium mit allzu menschlichen Problemen. Als stalkender Exorzist ist Eisi Gulp zu sehen. Maria und Wolfgang Murnberger verpacken die spannende Tätersuche basierend auf einem "Steirerkrimi" von Claudia Rossbacher mit subtilem Dialogwitz und feinem Humor.'
