  description: "Zwischen Esstisch und Weltgeschehen nimmt Altinger die großen und kleinen Verrücktheiten gemeinsam mit seinen Gästen unter die Lupe. \nDiesmal bringt Claudia Koreck frischen Wind ins Studiowohnzimmer von Michael Altinger. Die gebürtige Traunsteinerin mit großer Leidenschaft für Musik ist bekannt für ihre bayerisch-authentischen Songs. \nAltingers zweiten Gast kennt man als kauzigen Polizist Johannes Staller in \"Hubert und Staller\": Mittlerweile wagt Helmfried von Lüttichau Neues und ist mit autobiografischen Geschichten auf den Kabarettbühnen unterwegs.\nFür den passenden musikalischen Rahmen sorgt die Altinger Band."
