  title: Mein wunderbarer Kochsalon - Erdäpfelgnocchi mit Spinat und Trüffel
  subtitle: Mein wunderbarer Kochsalon - Erdäpfelgnocchi mit Spinat und Trüffel
  description: Gnocchi aus der Packung sind nicht schlecht, wenn es schnell gehen muss. Hat man aber ein bisschen Zeit und Muße, verursacht die Handarbeit einen geschmacklichen Quantensprung. Hubert Wallner vom See Restaurant Saag am Wörthersee zeigt, dass man kein technisches Genie sein muss, um perfekte Gnocchi selbst zu produzieren. Außerdem hat das Rollen, Formen, Drehen durchaus etwas Therapeutisches, vor allem, wenn man zu zweit daran arbeitet. Ehetechnisch sehr zu empfehlen. AT 2019
