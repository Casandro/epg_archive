  title: Mein wunderbarer Kochsalon - "Seeviche" vom Seesaibling
  subtitle: Mein wunderbarer Kochsalon - "Seeviche" vom Seesaibling
  description: Wenn sich schon die besten Köche unter einem Dach versammeln, dann wollen wir ihnen auch auf die Finger schauen. Vergangene Woche veranstalteten wir die dritte Gault&Millau Genussmesse im Kursalon in Wien und erstmals war ich auch mit meinem Kochsalon vertreten - in Form einer Kochschule. Vertreter der jungen Haubenköche-Vereinigung "Jeunes Restaurateurs" zeigten ihre besten Tricks und Techniken aus der Profiküche für uns zu Hause zum Nachmachen. Den Beginn machte Lukas Nagl vom Restaurant Bootshaus am Traunsee und gab eine Lehrstunde im Umgang mit rohem Fisch - filetieren, häuten, entgräten. Das Ganze dann zu einer "Seeviche" verarbeitet. Sehr spannend. AT 2019
- eventId: 688560
  start: 2026-10-27T14:25:00Z
  stop: 2026-10-27T14:33:00Z
  title: Mein wunderbarer Kochsalon - Seesaibling "Hausfrauen-Art"
  subtitle: Mein wunderbarer Kochsalon - Seesaibling "Hausfrauen-Art"
  description: Als meine Tochter noch kleiner war, fragte sie mich, ob jeder Fisch braun und knusprig durch das Meer schwimmt. Nein, Lilly, Fische kommen nicht mit Panier auf die Welt. Aber wie bekommt man sie richtig hin? Fisch hat mir immer schon gehörigen Respekt eingejagt, dabei braucht man nur etwas Gefühl - für Zeit und Fingerspitzen - und dann kann nicht viel schiefgehen. Vor allem mit dieser Methode, die mir Sören Herzig zeigte. Nach Hausfrauen-Art. Also diese Hausfrau wäre ich gerne. AT 2019
- eventId: 688561
  start: 2026-10-27T14:35:00Z
  stop: 2026-10-27T14:43:00Z
  title: Mein wunderbarer Kochsalon - Marillenknödel
  subtitle: Mein wunderbarer Kochsalon - Marillenknödel
  description: 'Bei Marillenknödel kenne ich keine Vernunft, pfeife auf die Bikinifigur (ist es schon egal), auf Cholesterin und sonstige unappetitliche Nebenerscheinungen. Die Saison ist kurz und heiß begehrt, vor allem, wenn man das Glück hat, die weltbesten Marillenknödel im Wirtshaus nebenan zu finden. Erdäpfelteil oder Topfenteig? Oder Erdäpfel-Topfenteig? Nichts dergleichen, Manfred Hausgnost vom "Gasthaus an der Kreuzung" im niederösterreichischen Guntersdorf macht Marillenknödel aus Brandteig. Ich sage euch: eine Offenbarung. AT 2019'
- eventId: 688563
  start: 2026-10-27T14:45:00Z
  stop: 2026-10-27T15:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Lightner
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Lightner
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im Gastkochkmenü von Matthew Lightner treffen lokale Produkte auf moderne Kochtechniken: Lightner serviert eine neue, westliche Version der traditionellen Kaiseki-Küche. Dabei werden nur frische Zutaten entsprechend der jeweiligen Jahreszeit verwendet und so zubereitet, dass vor allem ihr Eigengeschmack hervorgehoben wird. Das vorrangige Ziel von Chef Matthew Lightner: die Gäste sollen etwas Neues entdecken. AT 2014'
