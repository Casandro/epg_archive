  description: Beim Kaiserschmarren lassen sich die Emotionen schwer verbergen - mit oder ohne Rosinen, mit Sauerrahm oder Eischnee, zerrissen oder geschnitten. Fragen über Fragen. Ich hatte Jonas Posselt zu Gast in meiner Küche, Chefkoch im Haubenrestaurant im Casino Salzburg. Die Verwandtschaft seines Schmarrens zu Salzburger Nockerln lässt sich nicht leugnen.  AT 2017
