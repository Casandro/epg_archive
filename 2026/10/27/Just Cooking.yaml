  title: Mein wunderbarer Kochsalon - Martinigansl mit Apfelrotkraut und gefülltem Erdäpfelbiskuit
  subtitle: Mein wunderbarer Kochsalon - Martinigansl mit Apfelrotkraut und gefülltem Erdäpfelbiskuit
  description: 'Das ganze Jahr über kommt uns keine Gans am Tisch, aber zu Martini lassen wir es krachen. Fast gerührt machen wir uns über Gänsekeulen, gedünstetes Kraut und Serviettenknödel her, die jedes mögliche Quäntchen an Fleischsaftessenz in sich aufgenommen haben. Ich habe mir die Martinigansl-Expertin in den Kochsalon eingeladen: Irene Buchacher vom Klampererhof - eine patente wie charmante junge Gänsezüchterin aus dem schönen Mölltal. Da muss ich den Kochsalon erfinden, dass ich diese Perle aus meiner Heimat kennen lerne... AT 2019'
