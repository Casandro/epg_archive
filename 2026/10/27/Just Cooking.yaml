  title: Mein wunderbarer Kochsalon - Überbackene Schinkenfleckerl
  subtitle: Mein wunderbarer Kochsalon - Überbackene Schinkenfleckerl
  description: Martina Stierböck kümmert sich im teilzeitbetreuten Wohnen der Lebenshilfe Mödling um Erwachsene mit besonderen Bedürfnissen. Sie schrieb mir, dass einer ihrer Schützlinge den großen Wunsch hätte, einmal im Kochsalon seine berühmten Schinkenfleckerln zu kochen. AT 2019
