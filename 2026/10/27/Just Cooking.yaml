  title: Mein wunderbarer Kochsalon - Forelle am Salzstein
  subtitle: Mein wunderbarer Kochsalon - Forelle am Salzstein
  description: Er ist unser "Newcomer des Jahres 2018" und zeigt uns, wie man ohne Risiko Fisch am Salzstein gart. Was kompliziert klingt, ist eine schnelle und einfache Technik, die man vor den Gästen am Tisch zelebrieren kann. Haubenkoch Lukas Kienbauer aus Schärding und seine Forelle am Salzstein. Ein Gastspiel von der Gault&Millau-Genussmesse. AT 2019
