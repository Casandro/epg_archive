  description: 'Wenn mein Vater früher Teufelsroller aus dem Glas fischte, drehte sich mir der Magen um. Sauer-scharf eingelegter Fisch stand als Kind nicht auf meiner Favoritenliste. Mit der Zeit habe ich mich ihm angenähert und seit ich mit Richard Rauch selbst Rollmöpse fabriziert habe, ist alles anders. Kein Wunder: heimische Fischfilets mit Fenchelkraut und Yuzuwürze gedämpft kann man unmöglich nicht mögen. AT 2019'
