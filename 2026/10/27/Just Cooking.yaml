  description: Einen Tomatensalat aus der Dreihauben-Küche - das bekommen wir nicht alle Tage. Thomas Dorfer aus dem Landhaus Bacher in Mautern zeigt uns, wie man das Beste aus dem Paradeiser holt - vom Wasser über das Püree bis zur einfachen Technik zum Enthäuten. Dazu gibt es besonders feinen Ricottaschaum. Ein Gastspiel auf der Gault&Millau-Genussmesse, jetzt im Kochsalon. AT 2019
