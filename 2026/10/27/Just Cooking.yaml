  title: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Ligthner in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Ligthner in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im Gastkochkmenü von Matthew Lightner treffen lokale Produkte auf moderne Kochtechniken: Lightner serviert eine neue, westliche Version der traditionellen Kaiseki-Küche. Dabei werden nur frische Zutaten entsprechend der jeweiligen Jahreszeit verwendet und so zubereitet, dass vor allem ihr Eigengeschmack hervorgehoben wird. Das vorrangige Ziel von Chef Matthew Lightner: die Gäste sollen etwas Neues entdecken. Unter diesem Motto kreiert er zusammen mit der Küchencrew des Ikarus im September ein Menü, das die unglaubliche Vielseitigkeit seiner Wahlheimat New York widerspiegelt. AT 2014'
- eventId: 688565
