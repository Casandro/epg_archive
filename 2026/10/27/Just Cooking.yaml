  subtitle: Mein wunderbarer Kochsalon - Geflämmte Bluntauforelle mit Nussbutterpüree
  description: Er kommt aus einer Gastronomenfamilie und war einer der ersten, die den starken regionalen Bezug in seiner Küche auf höchstem Niveau zelebrierte. Mehrfach-Haubenkoch Andreas Döllerer zu Gast in der Showküche auf der Gault&Millau-Genussmesse. Und weil ich mich durchkosten musste, hat Kollege Peter Tichatschek die Kochsalon-Kochschule übernommen. Er zeigt uns die verschiedensten Techniken - vom Fermentieren bis zum Flämmen. AT 2019
