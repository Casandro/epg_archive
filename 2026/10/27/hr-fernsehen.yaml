  description: 'Die glücklich verheiratete Richterin Susanne trägt seit vielen Jahren ein Geheimnis mit sich herum. Als 17-Jährige gab sie ihr Baby zur Adoption frei. Doch ein Brief konfrontiert sie nun mit der Vergangenheit: Paolo, der italienische Vater ihres Mädchens, ist gestorben und hat der unbekannten Tochter sein Haus in der Toskana vererbt. Wider besseres Wissen begibt Susanne sich auf die Suche nach ihrer verlorenen Tochter - und gefährdet so das Glück zweier Familien.'
