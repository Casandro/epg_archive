  start: 2026-10-27T21:00:00Z
  stop: 2026-10-27T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Thomas Haak'
  description: |-
    JazzBaltica 26: Arcanum

    Das Quartett Arcanum ist wirklich eine Supergruppe. Denn Arve Henriksen, Trygve Seim, Anders Jormin und Markku Ounaskari gehören nicht nur zu den originellsten, sondern auch zu den gefragtesten Jazzmusikern des hohen Nordens. Basis sind eigene Stücke, Komponisten wie Federico Mompou oder Ornette Coleman sowie nicht zuletzt Folk-Songs unterschiedlichster Kulturkreise.

    Moderation: Thomas Haak
