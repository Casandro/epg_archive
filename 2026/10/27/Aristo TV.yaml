  title: ANIXE auf Reisen - Interlaken 1 mit Richy Müller
  description: 'In dieser Folge fahren wir zusammen mit dem Schauspieler Richy Müller in die Schweiz, nach Interlaken. In dieser schönen Ferienregion bleiben keine Wünsche offen. Ob Abenteuerurlaub oder Tradition erleben: Hier ist für jeden Reisenden was dabei. Neben Muskelarbeit beim Käser und im Seilpark als Vorbereitung für spätere  Bergtouren, trifft Richy Müller auch auf einen Alphorn-Instrumentenbauer und besucht die einzige Schule für Holzbildhauerei in der Schweiz. Mit der Brienz-Rothorn-Bahn geht es schließlich auf den gleichnamigen Berg mit einer beeindruckenden Aussicht. Gemäß Schweizer Tradition versucht sich der Schauspieler auch beim Alphornspiel. Jetzt muss Richy als Anfänger dem Alphorn nicht nur Töne entlocken, sondern auch vermeiden, die Kühe auf der Alpe zu verschrecken. Ob das klappt?'
  widescreen: true
- eventId: 698371
  start: 2026-10-27T09:19:50Z
  stop: 2026-10-27T09:25:26Z
  title: 'Reisen mit Kreta.de - Doku: Der malerische Ort Fodele'
  description: Das Dorf Fodele liegt in einem grünen Tal westlich von Heraklion und ist bekannt für seine Orangenhaine und traditionelle kretische Atmosphäre. Kleine Tavernen, schattige Plätze und die Verbindung zum berühmten Maler El Greco machen den Ort zu einem besonderen Ausflugsziel auf Kreta.
  widescreen: true
