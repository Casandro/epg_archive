  title: Entdecke die Welt - Kapstadt
  description: Entdecke die Welt führt uns in die südafrikanische Metropole Kapstadt. Sie zählt gewiss zu den modernsten und innovativsten Städten auf dem afrikanischen Kontinent. Entsprechend gestalten sich auch die Themen dieser Folge. Paragliden vom berühmten Tafelberg steht ebenso auf dem Programm wie der Besuch bei einer Parfümeurin, einer Art-Künstlerin, oder einer Miniaturmalerin. Wir bekommen einen Einblick in das Leben der Fischer und tauchen in das legendäre Nachtleben der Stadt ein. Wir fahren hinaus aufs Land und entdecken den berühmten Marulabaum, dessen Früchte als Leibspeise der Elefanten gelten. Und natürlich gehen wir auch auf kulinarische Expedition am Kap und hier darf der traditionsreiche Wein aus Südafrika nicht fehlen.
  widescreen: true
- eventId: 698382
  start: 2026-10-27T13:14:22Z
  stop: 2026-10-27T13:59:51Z
  title: So schmeckt die Welt - Mediterran
  description: Kommen Sie mit an Board auf der Epic und reisen Sie mit uns durch das Mittelmeer. Von Barcelona in Spanien, über Neapel in Italien, hinzu nach Frankreich machen wir Zwischenstops um einige Leckereien zu bestaunen und zu genießen.
  widescreen: true
