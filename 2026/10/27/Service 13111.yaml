  title: 'DFB-Pokal: Borussia Dortmund - SV Werder Bremen'
  subtitle: 'Fußball LIVE: 2. Runde - Vorbericht'
  description: In der zweiten Hauptrunde des DFB-Pokals treffen mit Borussia Dortmund und Werder Bremen zwei Bundesligisten aufeinander. Für den BVB unter Niko Kova_ ist es bereits das neunte Pokal-Duell mit den Bremern, die Bilanz zwischen den Traditionsklubs ist mit jeweils vier Siegen ausgeglichen. Unvergessen bleibt aus Dortmunder Sicht das Finale von 1989, als der BVB die Grün-Weißen in Berlin mit 4:1 bezwang. Das bislang letzte Duell ging dagegen an Werder, das sich im Achtelfinale der Saison 2019/20 mit 3:2 durchsetzte. Seien Sie live dabei am 27. Oktober ab 20:45 Uhr bei ServusTV und ServusTV On.Deutschland 2026
