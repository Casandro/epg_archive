  title: TM Wissen
  subtitle: Reaktorunfall als Härtetest - Roboter sollen retten, wo Menschen sterben würden
  description: 'Wenn Roboter im Atomkraftwerk Zwentendorf den Ernstfall proben, steht modernste Technologie im Mittelpunkt. Im weltweit einzigartigen, nie in Betrieb genommenen Reaktor testen internationale Teams Maschinen für Katastropheneinsätze, bei denen Menschen nicht mehr eingreifen können. Ein Team der FH Oberösterreich entwickelt dabei Roboter, die Verletzte bergen, Strahlungsquellen orten und Ventile schließen - ein Härtetest unter extremen Bedingungen. // Ganz anders, aber ebenso innovativ, zeigen sich Landwirte im Waldviertel: Rund 1000 Bauern produzieren dort Spezialpflanzen wie Gingko und Kapuzinerkresse für die weltweite Pharmaindustrie. Präzision, Wissen und Mut machen die Region zum Vorreiter einer neuen, nachhaltigen Landwirtschaft "Made in Austria". // Im Pinzgau erlebt der heimische Safran eine Renaissance: Familie Wölfler baut in Leogang das "rote Gold" wieder an und beweist mit viel Handarbeit, dass die wertvolle Pflanze auch in den Alpen gedeihen kann. // Und schließlich widmet sich eine weitere Geschichte einem echten Klassiker - dem Wiener Schnitzel. Fleischsommelier Jürgen Gschwendtner zeigt, was den goldenen Kult ausmacht und wie er sich von der Lombardei bis in die österreichische Identität eingebrannt hat. // Dazu stellt die Sendung spannende Fragen: Wie fühlt ein Roboter mit künstlicher Haut? Wie lassen sich Meerneunaugen stoppen? Und warum können wir ohne Schimmel nicht leben?Österreich 2025'
  genre:
  - '144'
  widescreen: true
- eventId: 1026618
  start: 2026-10-27T10:47:49Z
  stop: 2026-10-27T11:45:00Z
  title: TM Wissen
  subtitle: Reaktorunfall als Härtetest - Roboter sollen retten, wo Menschen sterben würden
  description: 'Wenn Roboter im Atomkraftwerk Zwentendorf den Ernstfall proben, steht modernste Technologie im Mittelpunkt. Im weltweit einzigartigen, nie in Betrieb genommenen Reaktor testen internationale Teams Maschinen für Katastropheneinsätze, bei denen Menschen nicht mehr eingreifen können. Ein Team der FH Oberösterreich entwickelt dabei Roboter, die Verletzte bergen, Strahlungsquellen orten und Ventile schließen - ein Härtetest unter extremen Bedingungen. // Ganz anders, aber ebenso innovativ, zeigen sich Landwirte im Waldviertel: Rund 1000 Bauern produzieren dort Spezialpflanzen wie Gingko und Kapuzinerkresse für die weltweite Pharmaindustrie. Präzision, Wissen und Mut machen die Region zum Vorreiter einer neuen, nachhaltigen Landwirtschaft "Made in Austria". // Im Pinzgau erlebt der heimische Safran eine Renaissance: Familie Wölfler baut in Leogang das "rote Gold" wieder an und beweist mit viel Handarbeit, dass die wertvolle Pflanze auch in den Alpen gedeihen kann. // Und schließlich widmet sich eine weitere Geschichte einem echten Klassiker - dem Wiener Schnitzel. Fleischsommelier Jürgen Gschwendtner zeigt, was den goldenen Kult ausmacht und wie er sich von der Lombardei bis in die österreichische Identität eingebrannt hat. // Dazu stellt die Sendung spannende Fragen: Wie fühlt ein Roboter mit künstlicher Haut? Wie lassen sich Meerneunaugen stoppen? Und warum können wir ohne Schimmel nicht leben?Österreich 2025'
