  description: "Zu Beginn des 20. Jahrhunderts herrscht der Goldrausch in Kalifornien. Der alternde Ex-Marshal Steve Judd (Joel McCrea) bekommt den Auftrag, einen Goldtransport durchzuführen. Dabei handelt es sich um Gold im Wert von über 11.000 US-Dollar, das aus einer Mine in den Bergen der Sierra Nevada in die Stadt geschafft werden soll. Steves guter Freund Gil Westrum (Randolph Scott) und der junge Cowboy Heck Longtree entscheiden sich dafür, den früheren Gesetzeshüter zu begleiten. Auf einer Ranch trifft die Gruppe auf Elsa Knudsen. Die attraktive Farmerstochter schließt sich Steves Truppe an. In der Goldgräbersiedlung möchte sie ihren Verlobten Billy Hammond heiraten. Aber dann stellt sich heraus, dass Billy und seine Brüder die brutale Hammond-Bande anführen. Nachdem die Outlaws versuchen, Elisa zu vergewaltigen, sucht sie Schutz bei Steve und seinen Begleitern. Auf dem Rückweg planen Westrum und Heck, das Gold zu stehlen. Doch das ist nicht das einzige Problem für Steve. Denn Billy und seine Kumpane sind der Gruppe dicht auf den Fersen.    \n\n\"Sacramento\" ist der zweite Kinofilm von Kultregisseur Sam Peckinpah (\"The Wild Bunch\"). In dem Spätwestern wird das Ende des Wilden Westens porträtiert, wo sich nicht idealistisch gesinnte Helden durchsetzen, sondern Egoismus, Raffgier und Rücksichtslosigkeit gewinnen. Trotz aller Desillusionierung und Entmythisierung erzählt Peckinpah seine Geschichte mit viel Humor. So brauchen die in die Jahre gekommenen Hauptfiguren etwa Brillen und kommen nicht mehr allein in den Sattel. Gespielt werden die Protagonisten von Joel McCrea (Steve Judd) und Randolph Scott (Gil Westrum). Beide hatten seit den 1930er-Jahren Hauptrollen in vielen Western gespielt. Die bildgewaltigen Landschaftsaufnahmen besorgte Peckinpahs Stamm-Kameramann Lucien Ballard.\nWestern, Vereinigte Staaten Von Amerika 1962, R: Sam Peckinpah"
