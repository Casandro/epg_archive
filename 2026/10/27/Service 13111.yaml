  title: Hans Hass - Pionier der Tiefe
  description: "Hans Hass hat als Erster mit seinen Aufnahmen und Forschungs-Expeditionen die Welt der Meere für die Öffentlichkeit zugängig gemacht, zu einer Zeit, in der das eigentlich noch fast unmöglich war - die notwendige Technologie existierte einfach noch nicht. Es machte ihn zu einer weltweiten Berühmtheit. Aber wie kam es dazu, dass ein junger Mann aus Wien im Binnenland Österreich, der gerade mit seinem Jurastudium in Berlin anfing - noch dazu zu Beginn des Zweiten Weltkriegs - schon bald allen Widrigkeiten zum Trotz eine bahnbrechende Karriere als Taucher, Filmemacher und Zoologe beginnen sollte? \n\nHans Hass ist uns vor allem als Vorreiter des Unterwasserfilms bekannt, der damals die Welt der Tierfilme neu erfand. Seine Filme sollten für alle zugänglich sein, und waren mit dramatischer Musik und spannenden Szenen der Expeditionsmitglieder unterlegt. Aber er war noch viel mehr als nur ein Filmemacher: Erfinder innovativer neuer Technologien, Wissenschaftler mit wichtigen Beiträgen in Meeresbiologie und Verhaltensforschung, Autor und Akademiker.  Das Vermächtnis seines Lebenswerks bleibt uns nach wie vor erhalten: alles, was heute in der Welt der Unterwasserfilme entsteht und uns mit atemberaubenden Aufnahmen erstaunt, beruht auf seiner Pionierarbeit. \"Ich war und bin stets auf der Suche nach dem Neuen - nach Dingen, die andere nicht machen\", sagte Hass einmal. Damals wie heute eine einmalige Leistung.\nDokumentarfilm, Deutschland 2023, R: Daniela Pulverer"
  genre:
  - '145'
  widescreen: true
