  title: 'Der Garmisch-Krimi: Wolfsmord'
  description: "Ermittlerin Daphne Meindl (Philine Schmölzer) ist gleich alamiert, als ein abgetrennter Wolfskopf per Post an einen Naturschützer geschickt wird. Für die junge Polizistin gilt dies klar als Morddrohung. Gerade in der politisch angespannten Lage, für die der Wolf in dem sonst so idyllischen Garmisch sorgt. Auch ihr Chef, Garner (Halrald Windisch) muss den Ernst der Lage erkennen, als kurz darauf die Leiche des Mannes gefunden wird. Nun muss Daphne dem brodelnden Konflikt zwischen Bauern, Aktivisten und Politikern auf den Grund gehen. Doch das ist gar nicht Mal so einfach. Neu im Amt, stößt die junge Österreicherin auch im Kommissariat auf Widerstand. Da wendet sich Daphne an ihre eigensinnige Vorgängerin, Ira Zach (Lavinia Wilson), die nach ihrer Entlassung bei der hießigen Polizei im Baumarkt arbeitet. Als Garmischerin kennt Ira nicht nur alle Partein. Sie verfolgt auch ein eigenes Ziel bei den Ermittlungen. Schließlich ist sie Mutter einer Teenager-Tochter, die sich für den Wolf engagiert und die sie nun in Gefahr sieht. Die beiden Frauen beginnen gemeinsam mit den Ermittlungen. Hat der Absender des Wolfskopfs auch den engagierten Naturschützer auf dem Gewissen? Obwohl Daphne und Ira nicht unterschiedlicher sein könnten, haben sie dennoch ein gemeinsames Ziel: Den Fall zu lösen. Doch was, wenn ausgerechnet die eigene Familie ins Zentrum der Eskalation rückt? \n\nDer neue Garmisch-Krimi zeigt die bergige Grenzregion mit ihrer rauen Schönheit als Schauplatz gesellschaftlicher, aktueller Themen, die im Großen wie im Kleinen existieren.\nKrimi, Deutschland 2025, R: Saralisa Volm"
  widescreen: true
