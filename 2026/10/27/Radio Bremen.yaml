  description: Kein Rotkehlchen guckt nach links, kein Sonnenuntergang hinter malerischen Getreidefeldern und kein Flusslauf taucht im Morgennebel auf. Timo Großpietsch fokussiert seinen filmisch dokumentarischen Blick auf den ländlichen Raum, so wie er heute benutzt wird. Eine ertragsoptimierte Fläche, auf der immer weniger Menschen zur Aussaat oder zur Ernte gebraucht werden. Für diese filmische Dekonstruktion hat der Jazzpianist, Vladyslav Sendecki, einen soghaften Soundtrack komponiert und eingespielt.
