  title: Zembla
  subtitle: Doden op de Noordzee S35 E14. In oktober 2023 spoelen op het strand van Texel twee lichaamsdelen aan. Samen met NH Media reconstrueren we hoe het onderzoek naar de identiteit van de slachtoffers is gegaan.
  description: 'In oktober 2023 spoelen op het strand van Texel twee lichaamsdelen aan. Deze zomer, na bijna drie jaar politieonderzoek, zijn de lichaamsdelen eindelijk geïdentificeerd. Het gaat om twee Afghaanse mannen die om het leven zijn gekomen terwijl ze Het Kanaal probeerden over te steken naar Engeland. Jaarlijks maken tienduizenden vluchtelingen deze levensgevaarlijke oversteek in de hoop op een betere toekomst. Zembla reconstrueert samen met NH Media hoe het onderzoek naar de identiteit van de slachtoffers is gegaan, hoe ze zijn verongelukt en welke handel er achter hun dood schuilgaat. Regisseur: Bart Nijpels (2026)'
