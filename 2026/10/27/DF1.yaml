  title: MareTV
  subtitle: Malaysia - Ganz Asien in einem Land
  description: 'Die malayische Halbinsel bietet praktisch alles, was Asien ausmacht. Es gibt verlassene traumhafte Strände, uralte Wälder, eine einzigartige Kirche und Gotteshäuser aller Glaubensrichtungen entlang ihrer 4000 Kilometer langen Küste. Malaien, Chinesen und Inder leben hier seit Jahrhunderten in Frieden; die Menschen gelten als tolerant und liberal gesinnt. Ein bestimmtes Produkt aus dem Fischerdorf Kuala Sepetang hat sich zu einem internationalen Bestseller entwickelt: Holzkohle aus dem Meer. Ivan Mohd macht sich zusammen mit seinem Erntetrupp auf den Weg in den Mangrovenwald. Seit Jahrhunderten wird der Wald nachhaltig bewirtschaftet und die Mangroven kontinuierlich neu gepflanzt. Die Straße von Malakka ist eine der verkehrsreichsten Seerouten der Welt. Piraten führen hier weiterhin ihre ruchlosen Taten aus. Mit ihren wendigen Langbooten entern sie Schiffe und stehlen alles, was nicht festgenagelt ist.'
