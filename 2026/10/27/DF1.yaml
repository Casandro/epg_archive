  title: MareTV
  subtitle: Elbmarschen. Altes Land, großer Strom
  description: 'Prunkvolle Obsthöfe, ein buntes Blütenmeer, sattgrünes Land hinter den Deichen: Die sogenannten Elbmarschen zu beiden Seiten der Unterelbe sind für viele Norddeutsche Sehnsuchtsgebiet direkt vor der Haustür. Was kaum jemand weiß: Abseits der Plantagen besitzt das Alte Land seine eigene Trauminsel. Lühesand liegt mitten in der Elbe und ist äußerst exklusiv. Denn es gibt nur eine einzige Übernachtungsmöglichkeit, und zwar den Campingplatz von Holger Blohm. Dieses Campingabenteuer beginnt mit einer kleinen Seereise. Im Winterhalbjahr muss der Platz nämlich wegen Überflutungsgefahr geräumt werden.'
  genre:
