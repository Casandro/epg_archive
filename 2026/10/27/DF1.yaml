  title: MareTV
  subtitle: Lissabon. Fado, Feinkost und Flamingos
  description: Malerische Gassen, prächtige Paläste und eine permanente frische Brise vom Atlantik. Die Seefahrt hat Lissabon Wohlstand gebracht. Portugals Hauptstadt am Fluss Tejo ist sowohl kosmopolitisch als auch voller Traditionen. Ein Beispiel ist Tuago Ferreira, der in dritter Generation eine Konservenfischfirma führt. Sardinen in Öl erleben derzeit eine Wiederbelebung. Ana Moura, eine berühmte Sängerin, interpretiert traditionellen portugiesischen Gesang kreativ auf ihre eigene Weise, ein Ausdruck ihrer Lebenseinstellung voller Melancholie und Sehnsucht. Im Gegensatz zum urbanen Flair von Lissabon gibt es südlich der Hauptstadt ein Naturschutzgebiet mit etwa 200 Vogelarten. Eine der wenigen Flamingo-Kolonien Europas findet sich auch in diesem fischreichen Biotop. Die Westküste Portugals ist als Mekka für Surfer bekannt, obwohl der raue Atlantik und seine riesigen Wellen nur für erfahrene Surfer geeignet sind.
  genre:
  - '161'
  widescreen: true
  hd: true
