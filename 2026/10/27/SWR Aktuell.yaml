  title: SWR Kultur - Das Wissen
  subtitle: Flamingo-Proteste in Albanien - Gegen Korruption und Kushner
  description: |-
    Von Christoph Kersting
    Sie begannen Ende Mai und halten bis heute an: Massenproteste in Albaniens Hauptstadt Tirana. Auslöser war ein geplantes Luxus-Tourismus-Projekt von Trump-Schwiegersohn Jared Kushner in einem Schutzgebiet an der albanischen Adria. Inzwischen ist das Vorhaben durch die Proteste ins Wanken geraten. Doch es geht um mehr: den Ausverkauf des Landes in vielen Lebensbereichen. Vor allem junge Albanerinnen und Albaner wollen einen Systemwechsel des kleinen Balkanstaats, der durch Korruption und Vetternwirtschaft auch den angestrebten EU-Beitritt aufs Spiel zu setzen droht.
