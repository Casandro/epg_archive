  subtitle: Franz von Assisi - Radikaler Prophet der Armut
  description: "14:00\nSWR Kultur - Das Wissen\nFranz von Assisi - Radikaler Prophet der Armut\nFreiwillige Armut statt Kirchenprunk, Frieden statt Kreuzzüge, mystische Gotteserfahrung statt erstarrter Frömmigkeit: Franz von Assisi radikalisierte kirchenkritische Reformbewegungen seiner Zeit. Nach seinem Tod 1226 wurde er zur Projektionsfigur: Die Kirche entschärfte seine Armutsbotschaft zur systemkonformen Armenfürsorge, seine Kritik an Macht und Gewalt zu Demut und Volksnähe. Mussolini stilisierte ihn zum Symbol nationaler Größe. Heute gilt Franz von Assisi vielen als \"Ökoheiliger\" und Vordenker spirituell begründeter Ökologie. \nVon Rolf Cantzen\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n14:30\n11KM: der tagesschau-Podcast\nPferde klonen: Millionengeschäft im Spitzensport\nIm Jahr 2006 beendet ein Unfall das Leben eines der wertvollsten Polopferde der Welt. Sein Besitzer, der Polospieler-Star Adolfo Cambiaso, setzt darauf, das Spitzenpferd zu klonen und aus diesem Experiment entwickelt sich ein Geschäftsmodell für geklonte Tiere im Spitzensport, erzählt Kilian Mazurek in dieser 11KM-Folge. Kilian hat mit seinem Kollegen Jonatan Geller-Hartung für den sechsteiligen Doku-Podcast \"Unsterblich: Die Klonpferde\" in Argentinien und in den USA, in der Welt der Superreichen und in Biotech-Firmen recherchiert. Die Episode zeigt, wie eine Technik, die im elitären Polosport beginnt, weitreichende Folgen hat und sie wirft die Frage auf, wie weit die Gesellschaft mit der Optimierung von Leben gehen will. \nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/"
