  title: 'Medizin mit Tiefgang: Komplementärmedizin'
  subtitle: Gespräch
  description: 'Komplementäre Heilmethoden haben heute nicht nur in der Onkologie einen festen Platz. Im Gespräch mit Dr. Claudia Kaminski erläutert Prof. Dr. Christoph von Ritter, warum Ernährungsmedizin ein Schlüssel zur Komplementärmedizin ist - etwa bei entzündlichen Darmerkrankungen oder zur Reduktion von Durchfällen. Er plädiert für eine sinnvolle Verbindung von Schulmedizin und alternativen Ansätzen, stets in enger Abstimmung mit dem behandelnden Arzt. Auch die Hildegard-Medizin kommt zur Sprache: eine spannende Brücke zwischen praktischem medizinischem Handeln und spiritueller Tiefe.'
- eventId: 661296
  start: 2026-10-27T04:45:00Z
  stop: 2026-10-27T05:00:00Z
  title: 'Spirit: Wie betet man richtig?'
  subtitle: Gespräch
  description: '"Beten ist sprechen mit Gott", heißt es in einer alten Formulierung. Aber antwortet er auch? Vielen Menschen fällt es schwer zu beten oder sie wissen nicht wie. Was das Gebet ausmacht und warum es einen festen Platz in unserem Tagesablauf haben sollte, erläutert Pater Anton Lässer CP.'
