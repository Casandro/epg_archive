  title: 'Über Gott und die Welt: Muss die Kirche sich ändern?'
  subtitle: Gespräch
  description: Wann kommt die Kirche endlich in der Gegenwart an!'. Wie dringend ist dieser Ruf tatäschlich? Was muss sich ändern, damit mehr Menschen in die Kirche kommen? Diesen Fragen stellen sich Rupert Santner und Studenten der Phil.-Theol. Hochschule Benedikt XVI. Heiligenkreuz.
