  title: Wanderlust! - In Andalusien, Spanien
  subtitle: Wanderlust! - In Andalusien, Spanien
  description: Das Frühjahr ist die beste Zeit, um in Andalusien zu wandern. Die Sträucher blühen, die Wälder und Weiden sind grün und die Temperaturen angenehm. Ein Fernwanderweg verbindet die weißen Dörfer, denen einst die Mauren, die muslimischen Eroberer aus dem nahen Afrika, das Gesicht gaben. Die Wanderung beginnt in Tarifa, der südlichsten Stadt des europäischen Festlandes. In einem Haus am Wegesrand holt Bradley Mayhew seinen Wanderkameraden ab, den Gewerkschafter und Umweltschützer Quico Rebolledo. Vor den beiden liegen 200 Kilometer. Durch Korkeichenwälder und Karstgebirge geht es bis Ronda, dem größten der weißen Dörfer von al-Andalus, wie die Mauren ihr Herrschaftsgebiet nannten. Die erste Hälfte der Wanderung verläuft durch die Alcornocales, benannt nach der Korkeiche und eines der größten Waldgebiete am Mittelmeer. Bradley und Quico treffen einen jungen Korkfabrikanten bei der Arbeit. In einem Kastell lädt sie ein englischer Aussteiger und Gastwirt zu Tortilla mit Flamenco-Begleitung ein. Und wo die Alcornocales bergiger werden, begegnen die beiden Wanderer einer Kräuterfrau, die uraltes Wissen über die essbaren Pflanzen der Gegend bewahrt. Die zweite Hälfte des Weges führt in die Sierra de Grazalema. Die Karstlandschaft ist für ihre Pinsapo-Tannen bekannt, die hier die letzte Eiszeit überstanden haben. Im weißen Dorf Grazalema geraten die Wanderer in eine Fabrik, in der Decken aus der Wolle des Merino-Schafs gewoben und auf uralten Maschinen gewalkt werden. Höhepunkt der Wanderung ist Ronda, eine spektakulär auf Felsen thronende Stadt. Bradley ist am Palmsonntag da, die Prozessionen der Semana Santa, der Karwoche, fangen an. Hinter Ronda geht der Fernwanderweg, der GR7, wie er offiziell heißt, noch über 500 Kilometer weit. Bradley nimmt in der spektakulären Schlucht von El Chorro den Zug zum Flughafen, im Gepäck all die schönen Eindrücke von der Wanderung durch al-Andalus. DE 2015
