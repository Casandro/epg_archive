  title: VIP Trip - Prominente auf Reisen 4 - Teneriffa mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Teneriffa mit Eva Habermann
  description: 'VIP Trip - Prominente auf Reisen 4: Begleiten Sie Eva Habermann auf ihrer spannenden Reise quer durch Teneriffa. Die deutsche Schauspielerin erkundet die vielfältige, vom Vulkanismus geprägte Natur Teneriffas. Die Rundreise führt sie über Steinwüsten zum höchsten Berg Spaniens, den Teide, und tief in die Erde durch riesige, begehbare Lavakanäle. Im Kayak erforscht Eva Habermann zudem die wilde Küstenregion Im Süden Teneriffas. Übrigens: Teneriffa ist weltweit einer der besten Hot Spots zur Beobachtung von Walen und Delphinen. Doch auch der Besuch der schönen Küstenstädte Teneriffas lohnt. Gerade Santa Cruz de Tenerife lockt mit wunderschöner Architektur, romantischen Cafes und Restaurants. Ein wunderbarer Ausgangsort außerdem für einen Streifzug durch die Küche der Kanarischen Inseln. Genießen Sie es! DE 2017'
- eventId: 686228
  start: 2026-10-27T11:45:00Z
  stop: 2026-10-27T12:05:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Wolfsburg mit Katharina Schubert
  subtitle: VIP Trip - Prominente auf Reisen 4 - Wolfsburg mit Katharina Schubert
  description: 'Wolfsburg ist die Heimat von Schauspielerin Katharina Schubert. Nun will sie einer größeren Zuschauergemeinde "ihre" Stadt vorstellen und näher bringen. So besteht der Stadtteil Fallersleben aus vielen hübschen, renovierten  Fachwerkhäusern. Übrigens, auch die Heimat von Hoffmann von Fallersleben. Dieser entwarf vor mehr als 175 Jahren den Text der deutschen Nationalhymne. Ein  faszinierender Kontrast dazu: das Phaeno. In dem hochmodernen Gebäude von Renzo Piano können Kinder und Erwachsene Naturphänomene auf den Grund gehen. Weiterer Programmpunkt: ein Besuch der mobilen Erlebniswelt "Autostadt" und mit seiner einzigartigen Sammlung von Oldtimern. Auch eine Visite im städtischen Kunstmuseum und im Allerpark lässt sich Katharina Schubert nicht entgehen. DE 2017'
- eventId: 686230
  start: 2026-10-27T12:10:00Z
  stop: 2026-10-27T12:29:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Taiwan mit Valerie Niehaus
  subtitle: VIP Trip - Prominente auf Reisen 4 - Taiwan mit Valerie Niehaus
  description: 'Sprudelnde heiße Quellen, von Palmen gesäumte Strände, geheimnisvolle Berglandschaften. Flächenmäßig ist Taiwan gerade mal so groß wie Baden-Württemberg, aber die Insel im Pazifik zählt mehr Berge über 3000 Meter als Österreich. Mit anderen Worten: Taiwan ist ein Land, das überrascht.  Viele taoistische und buddhistische Tempel belegen, dass die Bevölkerung tief in Traditionen verhaftet ist und doch längst im digitalen Zeitalter angekommen ist. Auch Kunst und Kultur stehen auf der Insel hoch im Kurs. Taiwans Kulturszene ist eine der markantesten in ganz Asien. Die Doku mit der Schauspielerin Valerie Niehaus zeigt, wie vielfältig und abenteuerlich Taiwan ist und welche Regionen auf jeden Fall einen Besuch lohnen. DE 2019'
