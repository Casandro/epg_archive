  title: Złapać przemytnika 4 (odc. 5)
  subtitle: Przemytnicy z Portoryko mają dostarczyć towar o wartości 2,5 miliona dolarów. Uciekając przed policją, przestępcy wyrzucają towar do morza.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    W Portoryku agenci wpadają na trop szajki przemycającej drogą morską narkotyki o wartości 2,5 miliona dolarów. W trakcie obławy przestępcy próbują wyrzucić towar do morza. Po drobnej stłuczce na przejściu granicznym w El Paso służby celne zatrzymują samochód wyładowany metamfetaminą. Celnicy z Miami próbują ukrócić przemyt nielegalnych w USA imprezowych dopalaczy.
