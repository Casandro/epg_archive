  title: Klątwa Wyspy Dębów 5 (odc. 5)
  subtitle: Stary dokument zawiera nowe wskazówki na temat lokalizacji "dziury z pieniędzmi". Poszukiwacze dokonują intrygującego odkrycia w głębinach.
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2017
    Reżyseria: Kevin Burns
    Występują: Marty Lagina, Rick Lagina, Jack Begley, Craig Tester, David Blankenship, John Wonnacott
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 961840
  start: 2026-10-27T08:55:00Z
  stop: 2026-10-27T11:05:00Z
  title: Jak pies z kotem
  subtitle: Kapitan policji z Los Angeles tuż przed rozpoczęciem długo wyczekiwanego urlopu z rodziną zostaje zmuszony do podjęcia kolejnej sprawy. Ma schwytać sprytnego uwodziciela, który okrada starsze kobiety.
  description: |-
    Tytuł oryginalny: Cane e gatto
    IT,US, 1983
    Reżyseria: Bruno Corbucci
    Występują: Bud Spencer, Tomas Milian, Marc Lawrence, Margherita Fumero, Billy Garrigues, Cristina Trotterová
    Kapitan policji w Los Angeles w ostatniej chwili musi odwołać wyczekiwany urlop z rodziną, aby złapać sprytnego złodzieja biżuterii uwodzącego starsze kobiety. Sytuacja komplikuje się jeszcze bardziej, gdy poszukiwany przestępca staje się przypadkowym świadkiem brutalnego morderstwa dokonanego przez mafię. Pogoń za uciekinierem i walka z gangsterami zamieniają planowany odpoczynek stróża prawa w pełną napięcia i humoru grę z czasem. Obsada: Bud Spencer, Tomas Milian, Marc Lawrence
  ageRating: 12
  genre:
  - '20'
