  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wie versteckt man ein ganzes Zelt? Die Jungs geben sich heute Morgen alle Mühe, sich komplett unsichtbar zu machen, bevor Die Mädchen aufwachen. Und es scheint zunächst, als hätten sie Erfolg. Die Mädchen sind jedenfalls sehr erstaunt, als sie sich frühmorgens mutterseelenallein im Camp wiederfinden. Doch sie sind pfiffig und mit ihrer fast zweiwöchigen Wildniserfahrung finden sie Die Spuren der Jungs recht schnell. Am Nachmittag wartet eine spektakuläre Herausforderung auf Die sechs: Raften auf dem wilden Fluss. Das wird aufregend!'
