  subtitle: 'Moderation: Andrea Mühlberger'
  description: "14.04 Zeit für hintergründige Porträts, Ortsbesuche und essayistische Betrachtungen.\n\nGespräch mit Landschaftsarchitekt Stefan Wallerius: Hofgarten Ansbach\nModerationsgespräch\n \n14.45 Bayern 2 Sozusagen\nUnser Sprach-Magazin: Sozusagen. Für alle Liebhaber, nicht für Rechthaber der deutschen Sprache. Mit Gesprächen, Glossen, Kommentaren über neue und alte Phänomene unserer Sprache. \n\nGossip und mehr: Gizem Çelik und ihr neues Buch, \"Warum die Popkultur bestimmt, wer wir sind\"\nVon Hannah Heinzinger\n\n15.00 Nachrichten, Wetter, Verkehr\n\n15.10 Bayern 2 Radiowissen\n\nPapier für die Ewigkeit? Wie Restauratoren Geschichte retten\nVon Julie Metzdorf\n\n15.30 Kultur-Update\nWas passiert gerade in der Welt der Kultur? Die Antwort liefert das Kultur-Update. Aus Bayern und der ganzen Welt: Wir berichten von Ausstellungen, Büchern, Filmen oder Serien, aber auch vom neuesten TikTok-Trend. \n\nGespräch mit Schriftsteller Marko Dinic: Serbien nach einer historischen Wahl\nModerationsgespräch\n\nRadikale Selbstoptimierung: Warum heutzutage alles gemaxxt wird\nVon Tobias Stosiek\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
