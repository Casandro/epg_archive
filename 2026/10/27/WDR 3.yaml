  title: WDR 3 Konzert
  subtitle: 'Zamus Early Music Festival: mal zwei!'
  description: "Zwei Liebende aus verfeindeten Lagern: mit Tancredi und Clorinda aus Claudio Monteverdis berühmten Madrigal treten Bryan Brenner und das Ensemble opia eine emotionale Reise durch unterschiedlichste Gefühlswelten an. Beim Konzert der zamus:academy zeigen ausgewählte Bläserinnen und Bläser unter der Leitung des Klarinettisten Robert Oberaigner ihr Können bei Kammermusikwerken der Klassik.\n<strong>Arcadia: Death in paradise</strong>\n<strong>Claudio Monteverdi<br/></strong>Il combattimento di Tancredi e Clorinda\nWeitere Werke von Salomone Rossi, Dario Castello, Giovanni Legrenzi, Carlo Gesualdo und Antonio Bertali \n<strong>Ensemble opia: <br/>Eva-Leonie Fegers</strong>, <strong>Alina Loewenich</strong>, Blockflöten<br/><strong>Julia Willeitner</strong>, <strong>Mauro Colantonio</strong>, Viola da gamba<br/><strong>Fabio Kapeller</strong>, Perkussion<br/><strong>Alexander Gergelyfi</strong>, Cembalo<br/><strong>Bryan Brenner</strong>, Gesang\nAufnahme vom 28. Mai 2026 aus dem Museum Schnütgen, Köln\n<strong>zamus: academy</strong>\n<strong>Anton Reicha<br/></strong>Quintett op. 88 No. 2 in Es-Dur (Auszüge)\n<strong>Bernhard Hendrik Crusell<br/></strong>Duo für 2 Klarinetten in d-Moll<br/>Rondo alla Svedese\n<strong>Giuseppe Cambini<br/></strong>Bläserquintett Nr. 2 in d-Moll (Auszüge)\n<strong>Franz Ignaz Danzi<br/></strong>Quintett Op 56, Nr. 2 g-moll (Auszüge)\n<strong>zamus:academy:<br/>Rebecca Taio</strong>, Flöte<br/><strong>Kana Motooka</strong>, Oboe<br/><strong>Isabell Pöll</strong>, Klarinette<br/><strong>Javier Caruda</strong>, Fagott<br/><strong>Félix Foster</strong>, Horn<br/><strong>Robert Oberaigner</strong>, Klarinette (Dozent)\nAufnahme vom 25. Mai 2026 aus der Aula St. Aposteln, Köln\nModeration: Susanne Herzog<br/>Redaktion: Susanne Rump"
