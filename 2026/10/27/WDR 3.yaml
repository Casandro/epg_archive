  title: WDR 3 Open
  description: '"Bei männlicher geschlechtsbezogener Gewalt geht es darum, die Hierarchie und Eindeutigkeit der Geschlechterordnung wiederherzustellen. Dass queere Menschen - vor allem trans, inter und nichtbinäre Personen - sich nicht in dieses duale, binäre System von Mann, Frau, Heterosexualität einfügen, führt zu einer noch größeren Irritation als Weiblichkeit: Es stellt nicht nur traditionelle Geschlechterrollen, sondern die gesamte Geschlechterordnung, die nur Männer und Frauen kennt, infrage." Sagt der Sozialpsychologe Rolf Pohl in der Frankfurter Rundschau vom 22.10.2026. Traditionelle Geschlechterrollen, womöglich auch die gesamte Geschlechterordnung, die nur Männer und Frauen kennt, stellt auch Meshell Ndegeocello infrage. Auf diese Idee könnte man zumindest beim Hören ihres neuen Albums kommen. "Synonym" besteht aus 15 Coverversionen von mehr (It ain _t me babe, I got you babe, Don _t you want me) oder weniger bekannten Popsongs. Gesungen im Duett mit mehr (Chaka Khan, Anohni, Cat Power, Bill Callahan) oder weniger berühmten Gäst:innen. "Die konsequent als gleichgeschlechtlich angelegten Duette eröffnen neue Perspektiven auf vertraute Songs, ohne sie ideologisch festzuschreiben", verkündet die Plattenfirma. Offen bleibt, was "als gleichgeschlechtlich angelegten Duette" sind. Die afroamerikanische Bassistin, Sängerin &amp; Rapperin Meshell Ndegeocello habe, "mehrfach erklärt, dass sie sich beim Musikmachen oft frei von festen Kategorien wie Geschlecht oder Rasse fühlt", sagt Wiki. Andere Quellen bezeichnen sie als "openly bisexual activist". So oder so oder so stiften einige Duette auf "Synonym" eine gewisse Geschlechterunordnung, gerade bei Songs, die man(n) &amp; frau seit Jahrzehnten mitsingt - nicht zuletzt, weil sie der binären Geschlechterordnung folgen. You were working as a waitress in a cocktail bar...I was working as waitress in a cocktail bar, that much is true...'
  subtitle: Geschlechterunordnung mit Meshell Ndegeocello
