  title: WDR 3 Jazz
  subtitle: 'Pionier der Jazz-Geige: Jean-Luc Ponty'
  description: |-
    Die Violine - im Jazz lange ein Außenseiter. Mit Jean-Luc Ponty ändert sich das. In den 1970ern avanciert er zu einem Star der Fusion-Musik. Nach Klassik-Studium und drei Jahren im Sinfonieorchester ein radikaler Stil-Wechsel. Er spielt mit Frank Zappa und dem Mahavishnu Orchestra. Danach baut Ponty erfolgreich eine Solo-Karriere auf, in den 1980ern integriert er Elemente westafrikanischer Musik.
