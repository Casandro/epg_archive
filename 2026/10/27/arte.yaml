  title: Die Mythen der Wikinger (7/10)
  subtitle: Sigurd und die Walküre
  description: Der Fluch des Rings lastet erneut auf dem Menschenreich. Regin, der Sohn des getöteten Zauberers, will sich an seinem Bruder Fafnir rächen, der sich in Gestalt eines Drachen des väterlichen Schatzes und des magischen Rings bemächtigt hat. Er überredet Sigurd, gegen den Drachen zu kämpfen. Als dieser Regins Manipulation durchschaut, tötet er den Drachen und auch Regin. Sigurd freundet sich mit Gudrun und Gunnar an und befreit - als Gunnar verkleidet - die gefallene Walküre Brünhild. Sie heiratet ihren vermeintlichen Retter. Als sie jedoch erkennt, dass sie getäuscht wurde, fordert sie Sigurds Tod.
