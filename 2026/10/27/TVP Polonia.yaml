    Jest sierpień 1932 rok. Na weselu Mani i Pawła bawią się wszyscy Winni i przyjaciele rodziny. Jedynie Ania jest smutna. Wiem, że ci jest ciężko - mówi do wnuczki Antoni. Ale, zobaczysz, innego spotkasz - dodaje zdziwionej jego przenikliwością Ani. Po weselu Ania wyjeżdża na studia do Warszawy. Podczas wizyt w domu unika spotkań z siostrą i szwagrem. W pałacu Wieruszów trwa generalny remont. Jasiek sprawdza się tam jako elektryk. Ma nadzieję, że Łucja spojrzy na niego łaskawym okiem.
