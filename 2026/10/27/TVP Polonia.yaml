    Historia namiętnej, lecz niemożliwej miłości dwojga ludzi, którzy nie potrafią być ze sobą i jednocześnie nie mogą bez siebie żyć. Na przeszkodzie ich uczuciu stają nie tylko trudne charaktery, lecz także wydarzenia zimnej wojny lat 50. w Polsce, Berlinie, Jugosławii i Paryżu. Tło dla ludzkich dramatów stanowi poruszająca ścieżka dźwiękowa - polska muzyka ludowa przeniesiona z wiejskich chat do filharmonii, hipnotyzujący ówczesną bohemę jazz oraz szlagiery paryskich barów z połowy XX wieku.
