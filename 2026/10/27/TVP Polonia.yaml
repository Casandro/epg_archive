  description: |-
    Tytuł oryginalny: Nasz premier. Tadeusz Mazowiecki
    PL, 2025
    Reżyseria: Agnieszka Olejnik
    "Nasz premier. Tadeusz Mazowiecki" - to film opowiadający o nieznanych dotąd faktach z życia człowieka, który odcisnął swój ślad na drodze polskich przemian. Hiob, który ukrywał przed światem swoje cierpienie, by nie przysłonić drugiego człowieka. Odważny i nieugięty, gdy rezygnował z mandatu specjalnego wysłannika ONZ ds byłej Jugosławii, powiedział, że: "uczciwość musi stać ponad pokrętną polityką", potrafił poruszyć opinię międzynarodową niezłomnością.
  ageRating: 12
