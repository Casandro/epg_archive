  description: |-
    Tytuł oryginalny: Magazyn Ekspresu Reporterów
    PL, 2026
    Wielokrotnie nagradzany i ceniony przez widzów program reporterski, w którym reporterzy Telewizji Polskiej pokazują życie z jego blaskami, ale i dramatami. Zawsze blisko ludzi. W tym wydaniu: Paweł Kaźmierczak - "Olek czeka na sprawiedliwość". Olek miał zaledwie cztery lata, kiedy jego świat się zatrzymał. I nie wiadomo, czy kiedykolwiek ruszy. Olek śpi, choć wygląda tak, jakby wszystko rozumiał. A za wszystkim stoi wypadek. Olek razem ze starszymi siostrami miał pójść do dziadka.
  ageRating: 12
  genre:
