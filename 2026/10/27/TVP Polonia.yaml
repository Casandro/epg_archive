  subtitle: Czteroletni Olek został ciężko ranny w wyniku potrącenia przez samochód. Jego rodzice walczą o wyjaśnienie okoliczności zdarzenia. W programie także historia miłośnika książek, który ratuje je przed zniszczeniem.
