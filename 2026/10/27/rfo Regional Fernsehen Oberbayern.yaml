  title: Süd Journal vom 26.10.2026 (Wh.)
  subtitle: Alles was die Region täglich bewegt.
  description: Ein Großbrand hat das Kehlsteinhaus bei Berchtesgaden weitgehend zerstört. Die Feuerwehr wurde Freitagabend um 21.15 Uhr alarmiert, gelöscht wurde bis Sonntag. Ein 33-Jähriger gilt als mutmaßlicher Brandstifter und sitzt in einer geschlossenen Klinik. Die Ruine soll abgerissen werden.
- eventId:
  - 604564
