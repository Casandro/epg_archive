  - 893929
  start: 2026-10-27T05:20:00Z
  stop: 2026-10-27T05:30:00Z
  title: Süd Journal vom 26.10.2026 (Wh.)
  subtitle: Eishockey - Starbulls und Pasanen gehen getrennte Wege +++ 2. BL Basketaball - 1880 Wasserburg gewinnt auswärts +++ 2. Bundesliga Volleyball - TSV Mühldorf unterliegt im Oberbayernderby deutlich mit 0:3 +++ Hinter den Kuli..
  description: Die Starbulls Rosenheim trennen sich mit sofortiger Wirkung von Cheftrainer Jari Pasanen. Nach gemeinsamer Analyse der sportlichen Lage soll ein neuer Impuls her. Ein Nachfolger ist noch offen, ebenso die Zukunft von Co-Trainer Jamie Bartman und Torwarttrainer Mika Tarvainen. +++ Die Basketballerinnen des TSV 1880 Wasserburg gewinnen in der 2. DBBL Süd auswärts bei den Rhein-Main Baskets mit 61:50. Entscheidend ist ein starkes drittes Viertel (19:8), trotz mehrerer verletzungsbedingter Ausfälle. +++ TSV Mühldorf verliert das Oberbayernderby in der 2. Volleyball-Bundesliga beim ASV Dachau klar mit 0:3. Nach zwei deutlichen Sätzen war Mühldorf im dritten Durchgang nah am Satzgewinn, scheiterte aber nervlich. Am Samstag folgt daheim das Derby gegen TSV Grafing. +++ Beim Tag der offenen Tür in der neuen OVB-MEDIA-City in Rosenheim warfen zahlreiche Besucher bei Führungen durch Redaktion und Funkhaus einen Blick hinter die Kulissen. Sie erfuhren, wie Lokaljournalismus entsteht und sich stetig verändert. +++ Wechselnd bewölkt, im Norden und Nordosten einzelne Schauer. Abends im äußersten Westen leichter Regen. Höchstwerte 10 bis 16 Grad. Schwacher bis mäßiger Westwind, nach Norden teils frisch, an der See in Böen stark bis stürmisch.
