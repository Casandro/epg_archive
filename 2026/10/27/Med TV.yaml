  title: Mediterranean Kitchen Tunisia
  subtitle: ' '
  description: 'Chef Kurt welcomes Chef Rania to prepare a vibrant Tunisian masterpiece: fluffy, spice-infused couscous served with melt-in-your-mouth tender lamb and slow-simmered vegetables. While the aromatic steam fills the kitchen, the two dive into the bold flavours of North Africa and the personal stories behind Rania’s family recipes. It’s an authentic celebration of heat, heritage, and the comfort of home cooking.'
