  description: The Mediterranean screens its stories this week. Malta hosts the Mediterranean Film Festival, while Italy Venice Film Festival and Med Film Festival bring glamour and regional storytelling to iconic locations. France Cannes Film Festival shines globally, Spain International Fantastic Film Festival of Catalonia celebrates genre cinema, and Morocco Amazigh Film Festival showcases North African voices. Turkey Adana Golden Boll Film Festival and Croatia Zagreb Film Festival round out a cinematic journey across the Med.
