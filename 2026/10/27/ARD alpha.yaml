    Unter einer Traumfigur versteht jeder etwas anderes - aber in einem sind sich alle einig: Ein flacher Bauch, ein knackiger Po und straffe Beine gehören einfach dazu!
    Die Fitness-Expertin Nina Winkler hat nach neuen sportwissenschaftlichen Erkenntnissen die besten Übungen zusammengestellt. Das Trainingsprogramm funktioniert nach dem Prinzip "2 in 1": Fettverbrennung und Training finden in einer einzigen Trainingseinheit zusammen statt!  Die Muskeln werden außerdem funktionell vernetzt trainiert. Dadurch sieht der Körper nicht nur gut aus, sondern die Muskulatur ist auch im Alltag gesund und leistungsfähig.
