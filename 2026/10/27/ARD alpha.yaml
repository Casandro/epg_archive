  title: Fast Track English (25/26)
  subtitle: The Office at Home
  description: Der Sprachkurs "Fast Track English" bietet die Möglichkeit, vorhandene Englischkenntnisse aufzufrischen und zu vertiefen. Die einzelnen Folgen sind rein englischsprachig. Die Begleitbücher geben aber deutschsprachige Hinweise und Anleitungen. Die Filme wurden an Originalschauplätzen in England gedreht. Es wird alltägliches Englisch gesprochen. Dabei wechseln individuelle Akzente und das Sprechtempo der native speakers, Engländerinnen und Engländer in ihrer normalen Umgebung.
