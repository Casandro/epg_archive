  subtitle: Odpolední živě moderovaný radioproud plný hudby a informací z regionu.
  description: Prostranství u hradu, v Palackého sadech a Na Bakalářích v Písku zkrášlí na jaře tisíce cibulovin. Dnes je budou pracovníci městských služeb vysazovat speciálním strojem. Druhy vybírali i pěstitelé z Holandska. Natáčela Jitka Cibulová Vokatá. Vysychající řeky a poloprázdné přehrady by mohly zkomplikovat výrobu technického sněhu v některých českých lyžařských areálech. Příspěvek ze zimního střediska v Lipně nad Vltavou na Českokrumlovsku, které čerpá vodu přímo z nádrže, připravila Eliška Kotlínová.
