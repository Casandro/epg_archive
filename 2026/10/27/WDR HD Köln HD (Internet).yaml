  description: 'Frühling im Tierpark! Überall tut sich was: Die Eisbären feiern Frühlingsanfang, die Meerschweinchen haben Nachwuchs und Ludwig tobt sich aus. Und dann sind da noch die Christbäume ... Christbäume? Oh ja! Herrlich, der Winter ist jetzt endgültig vorbei. Am Samstag ist Frühlingsanfang und da gibt es für die Eisbären ein dickes Schmankerl. Auf die Überraschung darf man gespannt sein, in einer bayerischen Wirtschaft würde sie auf der Speisekarte vielleicht als Haxe XXL mit frischem Salat der Saison stehen.'
