  title: Glow (12)
  subtitle: Das perfekte Kleid
  description: Nach den Ferien kommt Jenny in eine andere Klasse als Kim und Naomi. Dort machen Adele und ihre Clique ihr das Leben schwer. Umso wichtiger, dass Jenny beim beliebtesten Jungen der Schule gut ankommt. Sie muss Emilio unbedingt dazu bringen, mit ihr auf den Schulball zu gehen! Dafür braucht sie ein cooles Kleid, und sie hat auch schon eins im Blick. Aber das Kleid ist teuer und Jenny pleite. Da hat sie eine Idee.
- eventId: 752933
  start: 2026-10-27T07:00:00Z
  stop: 2026-10-27T07:20:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (11/20)
  subtitle: Nordgriechenland
  description: 'Am elften Tag des Wildnisabenteuers überraschen die Mädchen die Jungs mit einem Luxusfrühstück. Natürlich nach Wildnisart! Das macht gute Stimmung und gibt Energie für den anstrengenden Wandertag und die heutige Herausforderung: die sechs müssen sich auf einer gigantischen Schaukel zwischen Bäumen hinabschwingen lassen. Das ist eine große Mutprobe. Ob sie den Wildnisumschlag heute gewinnen können?'
- eventId: 753108
  start: 2026-10-27T07:20:00Z
  stop: 2026-10-27T07:45:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (12/20)
  subtitle: Nordgriechenland
  description: 'Wie versteckt man ein ganzes Zelt? Die Jungs geben sich heute Morgen alle Mühe, sich komplett unsichtbar zu machen, bevor Die Mädchen aufwachen. Und es scheint zunächst, als hätten sie Erfolg. Die Mädchen sind jedenfalls sehr erstaunt, als sie sich frühmorgens mutterseelenallein im Camp wiederfinden. Doch sie sind pfiffig und mit ihrer fast zweiwöchigen Wildniserfahrung finden sie Die Spuren der Jungs recht schnell. Am Nachmittag wartet eine spektakuläre Herausforderung auf Die sechs: Raften auf dem wilden Fluss. Das wird aufregend!'
- eventId: 753932
  start: 2026-10-27T07:45:00Z
  stop: 2026-10-27T08:10:00Z
  title: Durch die Wildnis - Das Abenteuer Deines Lebens (13/20)
  subtitle: Nordgriechenland
  description: Ein Fisch ist in der selbstgebauten Reuse im Fluss gefangen! Die Sechs diskutieren, ob sie ihn nun essen oder lieber wieder freilassen sollen. Es ist nicht einfach, ein Lebewesen zu töten, auch wenn man gerne Fleisch oder Fisch isst. Heute sollen Die Abenteurer einmal nicht in ihren Zelten übernachten, sondern sich selbst eine Unterkunft bauen - in den Bäumen. Die sechs sind total begeistert. In einem Baumhaus zu übernachten, ist für Melli und Sofie ein Kindheitstraum
