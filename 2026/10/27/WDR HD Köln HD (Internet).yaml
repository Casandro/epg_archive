  description: Hier treten Prominente zu einem außergewöhnlichen Duell an. Um zu gewinnen, müssen die Stars die superschlauen "Quizduell"-Profis schlagen. Ein Wissenswettkampf David gegen Goliath - die Stars gegen den "Quizduell-Olymp". Es geht um Wissen und Nervenstärke, aber auch um die Einschätzung der Gegner und die Bereitschaft zu zocken. Und es geht um viel Geld. Doch Vorsicht! Im packenden Finale am Ende jeder Show heißt es entweder Sieg für den Olymp und somit Team Deutschland oder Sieg für die Promis.
