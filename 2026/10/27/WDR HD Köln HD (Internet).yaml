  title: Glow (11)
  subtitle: Ein neues Zuhause
  description: Als Kim mit ihrer Mutter Hilde zu deren neuem Freund Lars und seinen Kindern Jenny und August zieht, ist nichts mehr wie vorher. Jenny tut alles, um Kims Freundin zu werden, aber sie geht ihr schrecklich auf die Nerven. Dabei will Kim vor allem Ruhe, um sich für die Aufnahmeprüfung an der Musikschule vorzubereiten. Immer funkt Jenny dazwischen. Ein Streit zwischen den Mädchen eskaliert und es kommt zu einer schrecklichen Kettenreaktion.
- eventId: 752861
  start: 2026-10-27T06:45:00Z
  stop: 2026-10-27T07:00:00Z
  title: Glow (12)
  subtitle: Das perfekte Kleid
  description: Nach den Ferien kommt Jenny in eine andere Klasse als Kim und Naomi. Dort machen Adele und ihre Clique ihr das Leben schwer. Umso wichtiger, dass Jenny beim beliebtesten Jungen der Schule gut ankommt. Sie muss Emilio unbedingt dazu bringen, mit ihr auf den Schulball zu gehen! Dafür braucht sie ein cooles Kleid, und sie hat auch schon eins im Blick. Aber das Kleid ist teuer und Jenny pleite. Da hat sie eine Idee.
- eventId: 752933
