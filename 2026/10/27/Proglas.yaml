  title: Jak se vám líbí
  subtitle: Koncert ukrajinského hudebníka Volodymyra Voyta ze studia Proglasu
  description: 'Autor: Jannis Moras; Interpret: Volodymyr Voyt * Hostem pořadu Jak se vám líbí je ukrajinský hudebník, skladatel a improvizátor Volodymyr Voyt, který hraje na tradiční strunný nástroj banduru. V rozhovoru s Jannisem Morasem představuje možnosti tohoto nástroje, jenž vedle ukrajinského folkloru nachází uplatnění také v avantgardní hudbě a volné improvizaci. Uslyšíte jeho autorskou hudbu v živém provedení ze studia Proglasu, včetně skladeb inspirovaných válkou na Ukrajině.[vojt] '
