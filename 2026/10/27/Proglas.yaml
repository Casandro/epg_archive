  title: Slyšte, lidé!
  subtitle: Hudební výlet do Švédska
  description: 'Autor: Milan Tesař; Premiéra: 21.3.2026 * V pořadu Slyšte, lidé! se tentokrát vydáme na hudební výlet do Švédska. Představíme si interprety, kteří vycházejí z tradiční severské hudby, i výrazné osobnosti tamní jazzové scény. Slovo dostanou například zpěvačka a pianistka Annika Hammer, trombonista Nils Landgren, estonsko-švédská skupina Strand? Rand nebo švédsko-norská formace Mojna. Jako bonus přidáme také mezinárodní projekt Monoswezi, který propojuje africkou hudbu se severským jazzem a improvizací.[anyka hamr] [nyls landgren] '
  genre:
