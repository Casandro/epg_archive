  title: Myšlenka na den
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Jediný pravý Bůh se chce stát naším BohemPromluva před modlitbou Anděl Páně v neděli 25. října 2026Milí bratři a sestry, krásný den! V nedělním evangeliu podle Matouše (22,34?40) nás Pán ještě jednou vede k jádru naší víry. Učitel Zákona ve snaze Ježíše testovat se ho ptá: ?Které přikázání je v Zákoně největší?“ Ježíš mu odpovídá citátem s Páté knihy Mojžíšovy (Dt 6,5): ?Miluj Pána, svého a osobní vztah: jediný pravý Bůh se chce stát naším Bohem.V setkání s Ním není přikázání lásky povinností ani nařízením zvnějšku. Nelze totiž milovat ?na povel“. Lásku k Bohu vyžaduje vlastní touha člověka, který nachází svou plnost ve společenství s Ním. Proto může být naše láska autentická tehdy, když je odpovědí na jeho lásku, která nás vždy předchází. Z toho vyplývá požadavek na zapojení naprosto celé lidské bytosti: srdce, duše, mysli.S prvním přikázáním Ježíš spojuje druhé: ?Budeš milovat svého bližního jako sám sebe.“ Toto životní pravidlo vyvěrá ze stejného zdroje: proto je, jak říká Ježíš, podobné prvnímu. Díky niternému vztahu s Bohem jsme schopní dívat se na sebe sama i na bližního stejným pohledem a ze stejné perspektivy, jako se na nás dívá Kristus. Takto je egoismus přemožen a schopnost mít rád sám sebe se stává skutečnou láskou: naše existence se obrací k druhému člověku a stává se darem pro toho, kdo stojí vedle nás.Dobře to pochopila svatá Terezie od Dítěte Ježíše: ?Jedině láska pohne k činnosti části církve; kdyby tato láska vyhasla, už by církev nehlásala evangelium.“ Bez lásky by naše víra byla ve skutečnosti připravena o svůj obsah, naše dobré skutky by byly redukovány na moralizování, naše naděje by vyšla naprázdno.Vážení a milí, nemůžeme skutečně milovat Boha, aniž by se tato láska nepřelila v lásku k bratřím a sestrám. A nemůžeme opravdu milovat svého bližního než jako synové a dcery jednoho a téhož Otce, který si nás zamiloval jako první ve svém Synu Ježíši.Prosme Pána o milost nového srdce, schopného přijmout a prožívat velké přikázání. Kéž se za nás přimlouvá Panna Maria, v jejímž Neposkvrněném srdci není nic než láska.překlad - zd ?, upravil -mh-  https://www.vaticannews.va/cs/papez/news/2026-10/papez-lev-jediny-pravy-buh-se-chce-stat-nasim-bohem.html'
  subtitle: Pravý Bůh se chce stát naším Bohem
