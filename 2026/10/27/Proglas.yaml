  description: 'Autor: Iva Horká; Interpret: Marie Ripperová, Iva Horká; Premiéra: 22.10.2026 * Věžní hodiny, jejíchž ciferník patří k největším prosvětleným věžním hodinám ve střední Evropě, prošly v roce 2026 opravou. Stejně tak samotnáičí se podíváme nejen na město pod námi, ale také do jeho historie. Příběh věže, hodin a zvonů ukazuje, že i věci, které každý den míjíme a považujeme je za samozřejmou součást města, za sebou mohou mít několik staletí lidských příběhů.Naším průvodcem je historička Muzea Velké Meziříčí PhDr. Marie Ripperová. Pořadem vás provází Iva Horká.'
