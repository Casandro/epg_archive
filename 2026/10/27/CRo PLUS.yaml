  title: Věda Plus
  subtitle: Výzkum, vynálezy a objevy, které mění lidský život. Moderuje Lucie Vopálenská.
  description: Historička umění a básnířka Marie Šťastná (45) po čtyřicítce přestala svůj život poměřovat kariérním růstem a velkými cíli. Stačí jí malý obchod, ve kterém prodává své výrobky - sukně a šperky, a život, který nemusí nutně připomínat dobrodružný film. V rozhovoru s Ivanou Veselkovou ze série Klub 40 mluví o úlevě, kterou jí přineslo právo chtít "jen" krásně žít.
