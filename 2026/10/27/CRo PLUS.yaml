  subtitle: Richard Hindls, ekonom. Moderuje Vladimír Kroc.
  description: Richard Hindls, ekonom. Jak vidí oprávněnost masových protestů ve Francii a nejen tam? Jak vidí výnosy francouzských státních dluhopisů a jak vidí vliv jejich hodnoty na hypotéky ve Francii? Na Dvojce se ptal Vladimír Kroc.
