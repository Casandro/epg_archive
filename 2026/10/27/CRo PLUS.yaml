  title: Dvacet minut Radiožurnálu
  subtitle: Každý den na rovinu!
  description: Hostem je Veronika Kuchyňová-Šmigolová, česká velvyslankyně v Izraeli. Poslední předvolební průzkumy přisuzují izraelské vládní koalici přibližně stejné šance na vítězství jako bloku opozičních stran. Kdo v bedlivě sledovaných parlamentních volbách zvítězí? A jaký dopad to může mít na vztah Česka k Izraeli? Zeptá se Vladimír Kroc.
