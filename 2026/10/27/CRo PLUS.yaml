  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (8/15) Část osmá: Revoluce úterý 23. října 1956. Revoluce začala pochodem studentů, lidé se přidávali, davy v ulicích narůstaly. Moc byla bezradná a Sověti došli k přesvědčení, že bez zásahu sovětské armády to nepůjde. Lidé se ptali, kde je Imre Nagy, a když konečně vystoupil, ukázalo se, že je za událostmi zoufale pozadu. S jedním z hlavních požadavků nesouzněl. Byl jím odchod sovětských vojsk ze země. První lidé zemřeli toho dne u maďarského rozhlasu. Ve víru událostí schválili Sověti návrat Imreho Nagye do vedení země. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
