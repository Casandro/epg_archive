  title: Osobnost Plus
  description: Ivan Gabal, sociolog a bývalý politik. Byl mezi prvními, kdo politiky už před 17 lety varoval před pokusy zrušit poplatky veřejnoprávních médií. Vedlo by to k "nejostřejšímu testu stavu a kvality naší demokracie," napsal tehdy. Jak si v dnešní ostré zkoušce čeští politici vedou? A stane se to, co jsme sledovali ve sněmovně od pátku do sobotního rána, novým standardem politického chování? Ptá se Barbora Tachecí.
