  title: Pro a proti
  description: Sobota 4:36. Začala bitva o veřejnoprávní média. Lidé na zaplněném Staroměstském náměstí v Praze v neděli protestovali proti změně financování veřejnoprávních médií a způsobu, jakým ji vláda začala v pátek prosazovat ve sněmovně. Ohrožuje vládní návrh nezávislost České televize a Českého rozhlasu, nebo naopak zajišťuje jejich stabilitu? Zneužila vládní koalice ve sněmovně početní převahu na úkor demokratické debaty? Nebo bylo projednávání v mezích legitimního mandátu většiny? A může opozice uspět se stížností u Ústavního soudu? Debatovat budou poslankyně ANO Jana Murová a poslanec KDU-ČSL František Talíř. Moderuje Lukáš Matoška.
