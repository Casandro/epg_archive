  description: 'Matěj Lukeš je čtyřiadvacetiletý mistr světa v moderním pětiboji: "Když jsem měl medaili na mistrovství světa dvakrát po sobě, proč bych nemohl být potřetí, cítím se dobře, otázky, které jsem měl k sobě samému jsem si už zpracoval," říká a dodává: "Když znáte sebe sama, tak vaše mysl ovládá tělo jako loutku." Jak se cítil ve chvíli, kdy zvítězil v Číně na mistrovství světa? Je možné se uživit profesionálním pětibojem? Už ví, jak se bude připravovat na olympijské hry v Los Angeles? Moderuje Michael Rozsypal.'
