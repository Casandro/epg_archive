  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Andrej Babiš je už skoro rok u moci. Je Česko po jeho návratu do Strakovy akademie jinou zemí? Oslabuje jeho vláda nezávislé instituce a mění pravidla fungování státu, jak tvrdí její kritici? Nebo jsou varování před rozkladem demokracie přehnaná a Babiš je silným lídrem, který dokáže prosazovat svou politiku? A co o vládních a opozičních stranách prozradily říjnové volby? Hosty Pro a proti budou komentátoři Petr Honzejk a Ondřej Leinert. Moderuje Lukáš Matoška.
