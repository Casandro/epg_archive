  description: 'Diese Doku begleitet eines der größten Abenteuer der Menschheit: Wird Valery Rozov es schaffen, mit einem Wingsuit vom höchsten Punkt der Welt zu fliegen? Der Russe hat sich vorgenommen, aus 7.220 Metern von der Nordwand des Mount Everest zu springen. AT 2014'
