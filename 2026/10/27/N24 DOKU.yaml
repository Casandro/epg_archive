  title: Spacetime
  subtitle: Es werde Licht! - Religion und Astronomie
  description: Auf der Suche nach den letzten Antworten zur Entstehung unseres Universums blicken die Forscher immer tiefer und genauer ins All. Sollte die Wissenschaft aber die Welt irgendwann komplett mit Naturgesetzen erklären können, was bleibt dann vom Glauben? Ist alles einfach aus dem Nichts entstanden? Diese Folge Spacetime beschäftigt sich mit dem Zusammenhang und dem Gegensatz von Religion und Wissenschaft, der Geschichte der Astrophysik und dem gemeinsamen Ursprung von Astrologie und Astronomie.
  widescreen: true
- eventId: 664598
  start: 2026-10-27T20:12:00Z
  stop: 2026-10-27T21:06:00Z
  title: Spacetime
  subtitle: Astrobiologie - Suche nach Leben im All
  description: Sind wir wirklich allein im Universum oder gibt es Leben außerhalb der Erde? Diese Frage beschäftigt die Wissenschaft schon seit Menschengedenken. Astronomen identifizieren fortwährend Exoplaneten, die erdähnliche Bedingungen aufweisen. Doch wie sind auf der Erde überhaupt Lebewesen entstanden? Und wo könnte extraterrestrisches Leben zu finden sein? Wissenschaftler und Astronaut Ulrich Walter begibt sich auf die Suche nach unserem Ursprung und dem Leben im All.
  widescreen: true
- eventId: 664618
  start: 2026-10-27T21:06:00Z
  stop: 2026-10-27T22:04:00Z
  title: Spacetime
  subtitle: Stille Begleiter - Monde in unserem Planetensystem
  description: Die Erde hat einen, der Mars zwei, Jupiter und Saturn je mehr als 60 - zahlreiche Monde umkreisen die Planeten unseres Sonnensystems. Ihre vielfältigen Eigenschaften haben einen erheblichen Einfluss auf die Himmelskörper, die sie begleiten. Auch wir sind auf den Mond der Erde angewiesen. Er stabilisiert die Erdachse und sorgt so für feste Jahreszeiten. Monde von Saturn und Jupiter bergen unterirdische Ozeane und Meere aus Methan. Wissenschaftler Ulrich Walter erkundet die natürlichen Satelliten.
  widescreen: true
- eventId: 664619
