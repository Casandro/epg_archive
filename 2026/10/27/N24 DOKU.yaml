  title: Lost Places - Folge 107
  subtitle: Lost Places - Folge 107
  description: 'Tief in den Klippen von Dover verborgen liegt eines der größten Verteidigungsbauwerke Großbritanniens. Welche streng geheimen Operationen wurden hier durchgeführt? Versteckt in der armenischen Felsenlandschaft liegt das Höhlendorf Chndsoresk. Doch warum wurde es plötzlich aufgegeben? Und: Der Schwerbelastungskörper in Berlin - Teil von Hitlers Plänen, eine monumentale "Welthauptstadt Germania" zu errichten.'
