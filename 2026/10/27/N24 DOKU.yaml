  title: Lost Places - Folge 106
  subtitle: Lost Places - Folge 106
  description: 'Was haben der Kalte Krieg und das Erotikmagazin "Penthouse" miteinander zu tun? Spuren einer ruinösen Friedensmission finden sich im ehemaligen Haludovo Palace Hotel in Kroatien.  Und: Wie sieht es heute in Hitlers Führerhauptquartier "Wolfsschanze" in Nordost-Polen aus? Dazu: Ein Radioteleskop in den Bergen Armeniens, mit dessen Hilfe ein sowjetischer Wissenschaftler die Urknall-Theorie widerlegen wollte. Und: Das Tunnelsystem im englischen Ramsgate als Lebensretter gegen Bomben der Luftwaffe.'
