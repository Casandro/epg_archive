  title: Lost Places - Folge 105
  subtitle: Lost Places - Folge 105
  description: 'Ausgerechnet das tropische Inselparadies Montserrat ist der Entstehungsort einiger der erfolgreichsten Pop-Alben der 80er Jahre. Warum? Weil Produzentenlegende Sir George Martin nach dem Ende der Beatles hier sein mit modernster Technik ausgestattetes AIR Studio baute. Leider machten Naturkatastrophen dem Musik-Mekka ein jähes Ende. Außerdem: Ein luxuriöses Lichtspielhaus in Arkansas wartet auf das Ende seines Dornröschenschlafs. Und: Die Salpa-Linie, ein monumentaler Kraftakt Finnlands.'
