  subtitle: Airport Security USA - Folge 9
  description: 'Am Flughafen Honolulu sorgt eine Japanerin für Aufsehen: Verdächtige Herkunft, unklare Geldflüsse - ist sie wirklich nur Urlauberin? In San Francisco suchen Zollbeamte nach einem Drogenkoffer. Zudem entdecken sie sechs Rassewelpen, die stundenlang in einer kleinen Box ausharren müssen, weil die Einfuhrpapiere fehlen. Spannende Szenen von Kontrolle und Risiko an den US-Grenzen.'
