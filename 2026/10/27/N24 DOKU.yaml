  description: 'Was machen kitschige Schlösschen à la Disney im Landesinneren der Türkei? Burj al Babas ist das ehrgeizige Projekt von Investoren: eine Luxus-Siedlung aus über 700 Mini-Schlösschen sollte Reiche aus dem Ausland in die Türkei locken. Doch Wirtschaftskrise und Pandemie zwingen die Unternehmer in die Knie. Zurück bleibt eine surreale Kulisse einer schier endlosen Reihe von verwaisten "Schlösschen".'
