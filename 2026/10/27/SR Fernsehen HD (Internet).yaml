  title: Hannes und der Bürgermeister (60)
  subtitle: Das Vorbild / Besitz belastet
  description: |-
    * Das Vorbild: Wenn zwei aneinander vorbeireden, gibt es oft die seltsamsten Gespräche. In diesem Fall spricht der Bürgermeister (Karlheinz Hartmann) von der vorbildlichen Bereiterklärung zur Prostata-Frühuntersuchung und sein Amtsbote Hannes (Albin Braig) von Personaleinsparung beim Putzdienst. Die Missverständnisse übertreffen sich an Komik.

