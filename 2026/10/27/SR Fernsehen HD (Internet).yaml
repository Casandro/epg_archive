  title: Eisenbahn-Romantik (824)
  subtitle: Modell-Landschaften in Europa - EXPO TRAINS in Luxembourg
  description: |-
    In Luxemburg, wo sonst der Europarat tagt, findet einmal im Jahr die Expo Trains statt, eine kleine, aber feine Modellbahnmesse.
    Veranstalter ist die "Association des Modélistes Ferroviaires de Luxembourg", das sind die Modellbahnfreunde in der nördlichen Vorstadt Walferdange, die im schönen hochherrschaftlichen Bahnhof Ihr Domizil haben.
    Alle Modellbahnanlagen wurden von den Eisenbahnfreunden Walferdange persönlich ausgesucht und zu dieser kleinen aber feinen Messe eingeladen.
