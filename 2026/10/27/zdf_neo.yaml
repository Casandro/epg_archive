  description: |-
    Großbritannien 2021
    Ein Junggesellenabschied läuft aus dem Ruder. Es gibt Tote - und vom Bräutigam fehlt jede Spur. Detective Superintendent Grace begibt sich auf die Suche. Es beginnt ein Wettlauf gegen die Zeit.

    In Brighton feiert der erfolgreiche Unternehmer Michael Neward mit seinen Freunden Junggesellenabschied. Doch bald weicht die Partystimmung purem Entsetzen: Es gibt Tote, und Michael ist verschwunden. Für DSI Roy Grace beginnt ein Wettlauf gegen die Zeit.
