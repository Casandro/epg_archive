  title: Podhoubí
  description: Podhoubí je magazín o přírodě, životním prostředí a všech cestách k šetrnému životu. Přinášíme v něm rozhovory s odborníky, ochranáři, zemědělci i dalšími aktivními lidmi, jimž životní prostředí není lhostejné. Vysvětlujeme environmentální témata, která v současnosti výrazně pronikají do společenské diskuze. Moderují Magdaléna Kořenová a Prokop Pithart.
- eventId:
  - 716132
  - 717785
  start: 2026-10-27T17:00:00Z
  stop: 2026-10-27T18:00:00Z
  title: Šatníky
  description: Šatníky přináší příběhy módy z českých skříní a ulic. Poslechněte si, co se skutečně nosí a proč. Hledáme odpovědi na to, co dnes móda pro lidi znamená, jakou má hodnotu a co o nás prozrazuje. Za poklady ze skříní zajímavých osobností vás každé úterý od 18:00 zavede Veronika Ruppert a Veronika Dušková.
- eventId:
  - 716248
  - 717882
  start: 2026-10-27T18:00:00Z
  stop: 2026-10-27T19:00:00Z
  title: Nádech
  description: Vztahy s větším věkovým rozdílem - jaká jsou jejich specifika? Přinášejí unikátní výzvy, nebo i rizika? Jak mluvit o společné budoucnosti, když se nacházíme v různých životních fázích? Jak se v takovým vztazích může projevovat mocenská nerovnováha? A na čem stojí zdravé vztahy bez ohledu na věk partnerů? Poslechněte si novou epizodu pořadu Nádech s psycholožkou a psychoterapeutkou ve výcviku Sárou Kratochvílovou.
- eventId:
  - 716249
  - 717883
  start: 2026-10-27T19:00:00Z
  stop: 2026-10-27T20:00:00Z
  title: Impakt
  description: Knihy Sally Rooney už si nebudete moci koupit u britských knihkupců. Důvodem je autorčina podpora skupiny Palestine Action, kterou britská vláda zařadila na seznam teroristických organizací. Co k rozhodnutí vedlo? Podporuje spisovatelka terorismus, nebo sledujeme omezování svobody projevu? Dozvíte se v nejnovějším Impaktu s překladatelkou Annou Štádlerovou a politologem Janem Danielem.
