  title: Modeláři
  description: Chmurné Švýcarky E-L-R si na novou desku přizvaly Shazzulu z Wolvennest. A label Sub Pop si do svých řad pozval jednoznačně nazvané noiserockery Piss. Hurá. Novou, a samozřejmě vynikající, kapelu mají i členové The Chisel. Jmenuje se The Easy Eight a stylově se jedná o energický, ale zároveň melodický hc/punk s lehkým nádechem Ramones. A je to jízda.
