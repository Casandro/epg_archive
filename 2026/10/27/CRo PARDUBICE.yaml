  title: Radioporadna
  description: Pohřební obřad nemusí být jen o slzách a černé barvě. Jak se smířit se smrtí svého blízkého a věnovat mu při loučení úsměv? S tím mají zkušenosti obřadnice z litomyšlského spolku Návrat duše. Hlavní aktérkou je Tereza Kovářová, která se věnuje vědomým a osobitým posledním rozloučením. Mimo jiné učí lidi včetně dětí vnímat smrt ne jako strašáka, o kterém se nemluví, ale jako součást života. Moderuje Jitka Slezáková.
