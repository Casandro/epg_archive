  title: kreuz & quer
  subtitle: Die Entschlüsselung des Tassilo-Codes
  description: Der sogenannte Tassilokelch birgt zahlreiche Geheimnisse, Anagramme, versteckte Abbildungen von Tieren und ikonenhafte Darstellungen. Martin Betz hat für "kreuz & quer" mit Pater Altman Pötsch gesprochen, der seit vielen Jahren versucht, die Geheimnisse des Kelchs zu lüften. Wie der Kelch von Salzburg nach Kremsmünster kam, warum er nur für Papstbesuche das Stift verlässt und wie er zur Zeit des Nationalsozialismus versteckt wurde, zeigt "kreuz & quer" im Gespräch mit Expertinnen und Experten.
