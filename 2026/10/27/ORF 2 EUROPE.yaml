  title: Unterwegs beim Nachbarn
  subtitle: Der Weiße Turm von Mulegns. Wie Kultur ein Dorf rettet.
  description: ORIGEN ist das größte Kulturfestival Graubündens in der Schweiz. Es veranstaltet Tanz und Theater an den ungewöhnlichsten Orten, empfängt Gäste aus aller Welt, saniert leerstehende Hotelbauten, ist Arbeitgeber und setzt Visionen um. Wie etwa den Weißen Turm von Mulegns. Das höchste digital gedruckte Gebäude der Welt ist neue, phantastische Spielstätte und haucht dem nur noch 12 Einwohner zählenden Dorf an der Passstraße wieder Leben ein. Die Dokumentation des ORF Vorarlberg begleitet die Entstehung des Weißen Turms, erforscht das Potential von Kultur als Wirtschaftsfaktor und begibt sich auf die Spuren eines historischen Geschichtenschatzes, der von ORIGEN gehoben und weitererzählt wird.
  genre:
