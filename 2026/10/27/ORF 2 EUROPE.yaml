  title: Report
  genre:
  - '34'
  description: "- Wie wehrfähig ist Österreich? Am Nationalfeiertag lockt die Leistungsschau des Bundesheeres zigtausende Menschen auf den Wiener Heldenplatz. Hubschrauber, Panzer und modernes Gerät üben - Politische Polarisierung: Verlernen wir, wie man streitet? Migration, Klima, Gender - die Liste der emotional aufgeladenen politischen Streitthemen ist lang. In der Politik scheint es immer seltener zu werden, dass über diese Themen zivilisiert diskutiert wird - zu festgefahren sind die eigenen Ansichten und die Meinung über die jeweils Andersdenkenden. \n- Im Interview: Juristin Irmgard Griss und Unternehmer Ali Mahlodji\n-  Kunst, Kultur, Sport: Wie stolz sind wir auf Österreich?  Worauf sind die Österreicherinnen und Österreicher stolz? Die Skala hat sich in den letzten 30 Jahren merklich nach unten verschoben: Während Österreich früher stolz war auf das außenpolitische Standing oder die Wirtschaft, sind es heute andere Dinge, die begeistern. Kunst, Kultur und Sport führen die Hitliste an."
