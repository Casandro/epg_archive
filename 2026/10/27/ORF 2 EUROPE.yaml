  title: Ein Dorf wehrt sich
  description: |-
    (Fernsehfilm, AUT/DEU 2019)
    Ein kleines Dorf gegen den Rest der Welt. In den letzten Tagen des Zweiten Weltkriegs wagen die Bergarbeiter von Altaussee den Aufstand gegen den immer noch wütenden nationalsozialistischen Irrsinn, der ihre Lebensgrundlage, die Salzmine, zu zerstören droht. Dabei retten sie den größten zusammengeraubten Kunstschatz Europas vor der sicheren Vernichtung.
    Mit Fritz Karl (Sepp Rottenbacher), Brigitte Hobmeier (Elsa Mitterjäger), Harald Windisch (Franz Mitterjäger), Maresi Riegner (Leni Mitterjäger), Verena Altenberger (Eva Schädler), Gerhard Liebmann (Johann Dörfler), Norman Hacker (Xaver Pröttl), Oliver Masucci (Dr. Ernst Kaltenbrunner), Philipp Hochmair (August Eigruber) u.a.
    Drehbuch und Regie: Gabriela Zerhau
    Koproduktion ZDF/ORF/ARTE
    107:50
  genre:
  - '23'
