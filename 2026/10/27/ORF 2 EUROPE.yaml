  title: Universum
  subtitle: Die Abruzzenbärin - Das wilde Herz Italiens
  description: |-
    Nur wenige Autostunden von Rom entfernt lebt Europas seltenster Bär. Über Jahrtausende von anderen Populationen getrennt, entwickelte sich der Marsische Braunbär zu einer einzigartigen Unterart.
    Heute streifen nur noch rund sechzig dieser besonderen Tiere durch den Zentralen Apennin - eine Gebirgslandschaft aus schroffen Gipfeln, uralten Wäldern, stillen Seen und alpinen Weiden im Herzen Italiens. In den kleinen Dörfern dieser Region ist die Verbindung zwischen Mensch und Natur bis heute lebendig.
    Im malerischen, mittelalterlichen Bergdorf Villalago in den Abruzzen wurde eine außergewöhnliche Bärenmutter zur Legende. "Amarena", wie sie die Einheimischen nennen, wurde zum Symbol für ein seltenes Miteinander von Mensch und Bär - ein friedliche Koexistenz, die ihresgleichen sucht.
    Doch es braucht nur einen einzigen folgenschweren Moment, um dieses fragile Gleichgewicht zu gefährden.
    Ein Film von Luca Verducci und Paolo Forconi
  genre:
  - '144'
