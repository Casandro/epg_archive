  title: Karpfenangeln in Portugal
  subtitle: Karpfenangeln in Portugal
  description: Robin Illner angelt dieses Mal auf Karpfen an einem Stausee in Portugal. Wird er hier seinen ersten portugiesischen Karpfen fangen können? Es erwartet den Angler neben einem unbekannten Gewässer auch hohe Temperaturen und Krebse im Wasser - eine Challenge die es zu meistern gilt. Im Video wird nicht nur der Einsatz von Futter und Reisegerät geklärt, sondern gleichermaßen auch besprochen, wo ein Angler die Angel-Erlaubnis für Portugal herbekommt. Viel Spaß beim Karpfenangeln in Portugal. PT 2024
- eventId: 673184
  start: 2026-10-27T01:45:00Z
  stop: 2026-10-27T01:58:00Z
  title: Flexibel zum Fisch
  subtitle: Flexibel zum Fisch
  description: 'Der Plan von Daniel Wnendt und Timo Keibel war eigentlich einen Film über das Barschangeln mit Finesse Methoden wie das Carolina Rig, Texas Rig, Free Rig zu drehen. Doch das Wetter war anders als die Vorhersage: Anstatt Flaute gab es Sturm in den Niederlanden. Daher waren die beiden Angler flexibel, schnappten sich die schwersten Barschruten an Bord, klinkten Jig Spinner in den Karabiner und retteten den Angeltag. Die Raubfische spielten mit und schnappten sich die Kunstköder beim Raubfischangeln. Jigspinner sorgte an diesem Tag für eine große Überraschung am Ende des Angeltages. Flexibel zum Fisch zahlte sich für die beiden Angler aus.  NL 2023'
- eventId: 673185
  start: 2026-10-27T02:00:00Z
