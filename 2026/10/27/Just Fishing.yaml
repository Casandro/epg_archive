- eventId: 673246
  start: 2026-10-27T04:45:00Z
  stop: 2026-10-27T05:00:00Z
  title: Aalangeln am See
  subtitle: Aalangeln am See
  description: Wer dicke Aale fangen will, der sollte es an einem stehenden Gewässer probieren. Deshalb machten sich Jesco Peschutter und Tobias Norff auf den Weg an einen Baggersee. Dieses große und strukturreiche Gewässer ist tief und beherbergt angeblich fette Aale. Aber das Angeln auf Aal ist am See nicht immer einfach und an diesem Gewässer hat keiner der beiden Angler bisher gefischt. Tackle und Köder sind mit dabei und für eine Nacht soll es auf armdicke Aale gehen. Da es schon langsam dunkel wird, beködert Jesco seine Selbsthakmontagen mit Tauwürmern. Tobias hingegen setzt bei diesem Ansitz auf das sogenannte Twig Rig, eine spezielle Laufbleimontage von englischen Aalzspezis. Dieses soll am besten mit kleinen Ködern und Haken funktionieren. Deshalb nimmt Tobias nur ein Stück vom Wurm und stoppt das Ganze mit zwei bis drei Maden. Dann landen die Köder im Wasser und das Warten beginnt. Doch erst einmal passiert nicht viel. Aber nach einiger Zeit werden die Aale aktiv und eine schlaflose Nacht beginnt. Wie viele Aale im Kescher landen und welche Überraschung noch am Morgen für Aufregung sorgt, seht Ihr in diesem Angelvideo. Seid auch gespannt und erfahrt, ob das Twig Rig oder die Selbsthakmontage mehr Fische an die Leine bringt. DE 2023
- eventId: 673247
  start: 2026-10-27T05:00:00Z
  stop: 2026-10-27T05:19:00Z
  title: Seehechtangeln vor Frøya
  subtitle: Seehechtangeln vor Frøya
  description: 'Das Angeln auf Seehecht ist beliebt und bringt Spaß. Begleitet Jesco Peschutter und Sebastian Boch nach Norwegen, wo Euch die beiden Angler zeigen wollen, wie Ihr die schmackhaften Speisefische an die Köder lockt. Vor der Insel Frøya lassen sich im Sommer super Seehechte fangen. Die Hotspots liegen nur wenige Minuten hinter den Schären und Inselchen, sodass sie vom Hafen schnell angesteuert werden können. Mit einem kleinen Kutter geht es für Jesco und Sebastian Richtung Fanggründe. Ruten, Rollen, Montagen und Naturköder sind mit an Bord. Bei Tiefen von 60 bis 90 Meter lassen die beiden Angler ihre Naturködermontagen mit ganzen Heringen und Fischfetzen zum Meeresgrund. Auch Kaja, eine norwegische Anglerin, und der Kapitän des Kutters angeln mit. Wenig Drift erleichtert das Angeln an diesem Tag, sodass es nicht lange dauert bis die ersten Seehechte Interesse an den fischigen Happen zeigen. Auch das Echolot zeigt die Zielfische an: Diese stehen nur knapp über dem Grund. An mehreren Plätzen immer wieder dasselbe Bild und anschließend krumme Ruten. Super Seehechte landen an Bord. Livebisse inklusive! Und als Beifang gehen bei dieser kurzen Tour auch noch Leng, Lumb sowie Knurrhahn an die Leine. Abschließend verraten Euch Jesco und Sebastian noch hilfreiche Tipps und Tricks zum Seehechtangeln, welches Gerät sich eignet, was für Köder fangen und wie die Hotspots zu finden sind. NO 2023'
- eventId: 673248
  start: 2026-10-27T05:20:00Z
  stop: 2026-10-27T05:31:00Z
  title: Bachforellen im Sommer
  subtitle: Bachforellen im Sommer
  description: Der Hochsommer ist mit seinen extremen Hitzeperioden nicht gerade die beste Angelzeit. Doch Christian Siegler war zusammen mit Dirk Nestler an der Hörsel in Eisenach unterwegs, um mit der Spinnrute und kleinen Gummifischen und Wobblern Bachforellen zu fangen. Bei sommerlicher Hitze und absoluten Topwetter konnten die beiden Angler große Bachforellen auf ihre Köder fangen. Spinnfischen am Fluss ist im Sommer eine heikle Angelegenheit und die beiden Angler mussten viel experimentieren, um den Forellen auf die Spur zu kommen. Viele Köderwechsel und etliche Würfe braucht es, um dem Fluss die Fische zu entlocken. DE 2023
