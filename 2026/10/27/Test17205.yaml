  title: Signes
  description: |-
    Fuir la guerre, et après? Février 2022, la guerre éclate en Ukraine. Des milliers de personnes trouvent refuge en Suisse. Parmi elles, de nombreux sourds, une trentaine rien que pour le canton de Vaud. Mais les structures d'accueil n'étaient pas prêtes à faire face au handicap de la surdité, il a fallu s'adapter tant bien que mal. Trois ans plus tard, nous avons rencontré Maksym, Hanna et Sandra qui nous racontent comment, après beaucoup de difficultés et d'acharnement, elles parviennent lentement à s'intégrer et à refaire leur vie en Suisse.
     (Suisse Romande-2025)  "Audio description"  "Langue des signes"
