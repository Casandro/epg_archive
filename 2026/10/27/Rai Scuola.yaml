  title: 'Amarcord - Le Alpi di Messner - Isole: l'
  subtitle: |-
    Amarcord - Le Alpi di Messner - Isole: la Laguna Veneta - Oriente selvaggio Scritto e diretto da Carlo Alberto Pinelli.
    La puntata sulle Alpi Giulie si apre con la corsa primaverile dei brummeri, antico ri
  description: |-
    to sloveno propiziatorio del raccolto, in cui i giovani di leva celebrano natura e cultura di una terra-cerniera tra Alpi, Balcani e Carso. Reinhold Messner ne esalta la geologia aspra e calcarea; La puntata si conclude nelle comunità di confine, dove si incontrano influenze slovene e friulane, con la riflessione di Messner sull'importanza di preservare la natura incontaminata e il carattere unico delle Alpi Giulie.
    A seguire, un programma mai più trasmesso di Sandro Bolchi del 1983. Il documentario prende avvio da Venezia, centro del sistema lagunare, e ne richiama subito la civiltà musicale attraverso Italo Gomez, direttore artistico del Teatro La Fenice, che cita Galuppi, nato a Burano, e Vivaldi. Il percorso prosegue a Murano, articolata in cinque isole e attraversata dal Canal Grande, dove la secolare arte del vetro convive con palazzi nobiliari, Palazzo Giustinian, sede del Museo del Vetro, e la Basilica dei Santi Maria e Donato. Da qui a Burano, isola di pescatori, pittori e merlettaie, dalle case colorate riflesse nei canali e frequentata da artisti quali de Pisis, Carena e Semeghini.
