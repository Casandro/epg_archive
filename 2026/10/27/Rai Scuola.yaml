  title: Documentario - Materia viva
  subtitle: ATTUALITA' - Il documentario racconta le peculiarità del legno altoatesino esplorando gli aspetti legati al suo utilizzo innovativo nella produzione di opere artistiche ed edilizie, alla sua tutela come patrimonio natu
  description: |-
    ralistico e al rapporto con l'uomo. Il filo conduttore del racconto sono le storie di uomini e donne che, in modi diversi, hanno disegnato le proprie esistenze seguendo i contorni di questo straordinario elemento. Un liutaio, un artigiano, un gruppo di scienziati, la guardia forestale e una grande azienda che ha rivoluzionato il settore, costruiscono i propri ritratti, intrecciati da sempre con una materia viva, dinamica e che si rigenera continuamente. Il legno è il protagonista silenzioso del documentario, declinato in tutte le sue sfumature e utilizzi con il magnifico sfondo dei territori incontaminati dell'Alto Adige. - Di Sara Catalini
    Regia di Michele Melani,
