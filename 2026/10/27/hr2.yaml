  title: 'Lesung | John Berger: Der Szum und der Ching (4/7)'
  description: |-
    Der britische Schriftsteller, Maler und Kunstkritiker John Berger zählte zu den prägenden Intellektuellen Europas. Polen war für ihn ein biografischer und erzählerischer Fluchtpunkt, "Der polnische Reiter" ein Lieblingsgemälde. Seine Erzählung "Der Szum und der Ching" führt uns an den Fluss Szum nahe der ukrainischen Grenze, an dem er Sauerampfer sammelt und Erinnerungen nachspürt. Am 4. November vor 100 Jahren wurde John Berger in London geboren - in der Nähe eines Wasserlaufs namens The Ching.

    Wird wiederholt um 17:00 Uhr.
