  title: Aus dem Leben
  description: "Hubertus Meyer-Burckhardt ist Filmproduzent, Moderator der NDR Talk Show und erfolgreicher Autor. Mit seinem Buch \"Das Buch meines Lebens haben Klügere geschrieben\" hat er erneut den Sprung auf die Bestsellerliste geschafft. Darin begibt er sich anhand von 90 Zitaten, die ihn immer wieder begeistern, auf eine Reise durch sein Leben. Denn seit seiner Teenagerzeit Anfang der 1970er-Jahre sammelt er Zitate in einem kleinen schwarzen Büchlein mit roten Ecken - von Rainer Maria Rilke über Hilde Domin bis hin zu Thomas Mann und Jerry Lewis. \n\nHubertus Meyer-Burckhardts Vater war Alkoholiker und gewalttätig. Im Zweiten Weltkrieg hatte er ein Bein verloren und kehrte traumatisiert aus Russland zurück. Als Zwölfjähriger wirft Hubertus Meyer-Burckhardt seinen gewalttätigen Vater nach einem erneuten Streit zu Hause raus. Fortan lebt er mit seiner Mutter allein. Sie arbeitet in einem Seniorenheim, um den Lebensunterhalt für beide zu sichern. Das Geld ist knapp. In den Zitaten, die er als Jugendlicher in sein Büchlein notiert, findet er Halt und oft auch einen väterlichen Freund. Auf der Suche nach Abenteuer und Identität helfen ihm die Zitate ganz unterschiedlicher Autoren, das Leben besser zu verstehen. Sie geben ihm Orientierung, inspirieren, trösten und ermutigen ihn. Seine \"Kladde\" wird zu einem Freund, der ihm immer wieder hilft, trotz aller Herausforderungen des Lebens seine Zuversicht nicht zu verlieren. \n\nDiese Zuversicht prägt ihn bis heute. Der erste Entwurf für seinen Bestseller \"Das Buch meines Lebens haben Klügere geschrieben\" entstand während einer Schiffsreise, die er gemeinsam mit seiner Frau Dorothee von Hamburg über den Indischen Ozean bis zu den Seychellen gemacht hat. Dabei reiste er nicht nur um die Welt, sondern auch zurück in sein eigenes Leben. \n\nHeute ist Hubertus Meyer-Burckhardt zu Gast in unserer Sendung. Mit Gastgeber Uwe Jäger unterhält sich der Moderator der NDR Talk Show und Bestsellerautor darüber, welche Zitate ihm Halt und Orientierung gegeben haben, wie es ihm gelungen ist, trotz aller Herausforderungen und Rückschläge seinen Optimismus nicht zu verlieren, und welches Resümee er nach der Reise durch sein Leben mit inzwischen 70 Jahren zieht. \n\nDas Gespräch gibt es anschließend als Podcast auf sr3.de und in der ARD-Sounds-App.\n\n18:30 - 18:31 SR info Nachrichten um halb\n\n19:00 - 19:04 SR info Nachrichten"
  subtitle: mit dem Moderator der NDR Talk Show und Bestsellerautor Hubertus Meyer-Burckhardt über das Buch seines Lebens
