  title: Hitlers Wunderwaffen
  description: Ein Einblick in die geheimen, fortschrittlichen Technologien und Waffensysteme, die das NS-Regime während des Zweiten Weltkriegs entwickelte. Dazu gehören Raketen wie die V2, Düsenflugzeuge und innovative Panzer. Die Doku untersucht die technischen Fortschritte und deren Einfluss auf den Kriegsverlauf sowie die moralischen und ethischen Fragen, die durch den Einsatz solcher Waffen aufgeworfen wurden. Trotz ihrer Fortschrittlichkeit konnten diese Waffen den Krieg nicht entscheiden.
  widescreen: true
- eventId: 963028
  start: 2026-10-27T01:35:00Z
  stop: 2026-10-27T02:40:00Z
  title: Das unterirdische Reich - Von Wunderwaffen und Sklavenarbeitern
  description: Ein Film über unterirdische Stollensysteme, in denen die Nationalsozialisten ganze Fabrikanlagen versteckten, um ihre Rüstungsproduktion sicher zu stellen. Zu Wort kommen Zeitzeugen und Historiker.
  widescreen: true
- eventId: 963029
  start: 2026-10-27T02:40:00Z
  stop: 2026-10-27T03:45:00Z
  title: Das unterirdische Reich - Von Festungen und Führerbunkern
  description: Unterwelten - über tief in der Erde verborgene Geheimnisse und Schätze Es war eines der gigantischsten Bauvorhaben der Menschheitsgeschichte. Überall im "Dritten Reich" und den von Deutschland besetzten Gebieten wurden 1944 ganze Fabrikanlagen in unterirdische Stollensysteme verlegt, um sie dem Bombenhagel der Alliierten zu entziehen. Sklavenarbeiter mussten bis Kriegsende unter unmenschlichen Bedingungen kilometerlange Tunnel in Berge graben.
  widescreen: true
