  title: Scrubs - Die Anfänger
  subtitle: Meine Trauer Comedy-Serie, USA 2004
  description: 'Folge 74, Eines Tages steht J.D.s Bruder Dan mit einem Kuchen in der Hand und einer schlechten Nachricht vor der Tür: Ihr Vater ist gestorben. J.D. lässt Dan ein paar Tage bei sich wohnen, doch der wird schnell unerträglich. Den ganzen Tag liegt er nämlich Bier trinkend in der Badewanne. Noch merkwürdiger benimmt sich allerdings Dr. Cox, der, als er von der Nachricht erfahren hat, nichts unversucht lässt, um J.D.s Trauer zu mildern. Inzwischen bekommt auch Turk eine schlechte Nachricht...'
  widescreen: true
- eventId: 664639
  start: 2026-10-27T23:15:00Z
  stop: 2026-10-27T23:55:00Z
  title: Scrubs - Die Anfänger
  subtitle: Mein hollywoodreifer Auftritt Comedy-Serie, USA 2004
  description: 'Folge 75, J.D.s Bruder ist immer noch da und sorgt erneut für ein Problem: Offenbar hat er erfolgreich mit Elliot angebändelt! Als J.D. die beiden zusammen im Bereitschaftsraum erwischt, ist er zwar überrascht, doch erstaunlicherweise stört es ihn nicht, dass seine Exfreundin nun mit seinem Bruder zusammen ist. Turk rät ihm jedoch, trotzdem den Betroffenen zu spielen - denn wenn Elliot sich schuldig fühlt, verzeiht sie ihm vielleicht. Natürlich kann dieser Plan nur nach hinten losgehen.'
  widescreen: true
