  description: Izbor numera iz muzičkog serijala "Šljivik". Takmičari amateri, popularni pevači i glumci, pevali su izvorne narodne pesme, kao i one komponovane u tradicionalnom duhu. Sve izvođače pratio je Narodni orkestar RTS pod upravom Vlade Panovića. Proizvedeno 2015. godine.
