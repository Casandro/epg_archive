  title: Rémi - sein größtes Abenteuer
  subtitle: Comedy 2018
  description: '2018 ● FSK: 6 Rémi wird als Baby von der gütigen Friseurin Madame Barberin adoptiert. Weil ihr Mann Geld für einen Prozess braucht, muss Rémi seine Adoptivmutter im Alter von zehn Jahren verlassen. Er wird dem mysteriösen Straßenkünstler Signor Vitalis anvertraut. Mit ihm, seinem Äffchen Joli-Coeur und seinem Hund Capi zieht Rémi quer durch Frankreich und erlernt das Handwerk des Musikers und Gauklers. Dabei lernt er nicht nur neue Freunde kennen, sondern kommt auch dem Geheimnis seiner Herkunft auf die Spur. Comedy 2018, Regie: Antoine Blossier,  Mit: Daniel Auteuil, Maleaume Paquin, Virginie Ledoyen'
