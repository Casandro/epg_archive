  description: '2012 ● FSK: 12 Die schüchterne Tara traut sich in der Schule kaum, den Mund aufzumachen. Doch das sieht zu Hause ganz anders aus. An ihrem Laptop produziert die 17-Jährige ihren eigenen Podcast, den sie Radio Rebel nennt. Ihr Stiefvater erfährt von diesem Nebenprojekt und kann einen großen Radiosender überzeugen, Tara Sendezeit zu geben. Das Mädchen will vor allem weiterhin unerkannt bleiben. Doch der große Erfolg ihrer Sendung macht dieses Unterfangen immer schwieriger. Children''s / Youth programs 2012, Regie: Peter Howitt,  Mit: Debby Ryan, Sarena Parmar, Adam DiMarco, FSK 12'
