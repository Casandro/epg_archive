  description: '2018 ● FSK: 6 Antonia Brico kommt in Rotterdam als Tochter einer unverheirateten Katholikin auf die Welt. Die Pflegeeltern nennen sie Wilhelmina Wolthuis und emigrieren mit ihr in die USA. In Kalifornien studiert die talentierte Pianistin zusätzlich das Dirigieren, denn sie möchte unbedingt Dirigentin werden. Doch im Jahr 1929 ist diese Profession noch exklusiv für Männer. Wilhelmina lässt sich nicht beirren in ihrem Wunsch und schafft es als 24-Jährige bei den Berliner Philharmonikern zu debütieren. Remarkable people 2018, Regie: Maria Peters,  Mit: Christanne de Bruijn, Benjamin Wainwright, Scott Turner Schofield'
