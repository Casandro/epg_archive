  title: Elvis - Aufstieg und Fall des King
  subtitle: Teil 1, Magazines / Reports / Documentary 2005, Season:1 Episode:1
  description: '2005 ● S1 E1 ● FSK: 6 Der 17-jährige Elvis lebt mit seinen Eltern in bescheidenen Verhältnissen. Vor allem seine Mutter Gladys unterstützt sein Interesse für Blues und Country-Musik sowie auffällige Kleidung. Für sie nimmt er seine erste selbst finanzierte Single im Studio der Sun Records auf. Zwei Jahre später bekommt er dort von Studiochef Sam Phillips die Chance zu einer weiteren Aufnahme: `What''s All Right Mama'' wird sein erster Hit. Mit seinen Kumpels Bill Black und Scotty Moore tourt er durchs Land. Magazines / Reports / Documentary 2005, Regie: James Sadwith,  Mit: Jonathan Rhys-Meyers, Randy Quaid, Rose McGowan, Season:1 Episode:1'
