  title: Emmanuelle Haïm et le Berliner Philharmoniker interprètent Haendel
  genre:
  - '98'
  description: 'Depuis 2008, la cheffe baroque Emmanuelle Haïm entretient une relation privilégiée avec l''Orchestre philharmonique de Berlin. Au festival de Baden-Baden 2023, la maestra française et le prestigieux ensemble allemand s''attelaient à un oratorio de Haendel : Il trionfo del tempo e del disinganno (Le triomphe du temps et de la désillusion). Cette oeuvre de jeunesse, composée et créée en 1707, met en scène la confrontation de la beauté, du temps, du plaisir et de la désillusion dans un exaltant jeu de pouvoir, qui évoque les grandes questions de l''existence humaine. Un quatuor de solistes de haut vol, constitué des sopranos Elsa Benoit et Julia Lezhneva, du contre-ténor Carlo Vistoli et du ténor Anicio Zorzi Giustiniani, interprète avec virtuosité ce chef-d''oeuvre de Haendel, qui témoigne de la forte influence exercée par l''opéra italien sur les compositeurs de l''époque. Filmé le 08 avril 2023 au Festspielhaus de Baden-Baden, Allemagne. Réalisateur: Torben Jacobsen (2023)'
