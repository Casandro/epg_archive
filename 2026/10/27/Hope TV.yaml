  title: Beweg dich!
  subtitle: Entspannt in den Abend - sanfte Übungen zum Runterkommen
  description: |-
    Diese Einheit unterstützt beim Loslassen und Abschalten. Mit ruhiger Musik und gezielten Übungen wird das Nervensystem beruhigt, Verspannungen lösen sich, die Atmung vertieft sich. Im Sitzen oder Liegen werden einfache Dehn- und Atemsequenzen kombiniert - ideal als feste Abendroutine oder zur Regeneration zwischendurch. Eine achtsame Auszeit, die dabei hilft, zur Ruhe zu kommen und die innere Balance zu stärken.
    15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden.

