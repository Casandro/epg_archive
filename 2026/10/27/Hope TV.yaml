  title: Geschichten der Hoffnung
  subtitle: '"Und wo warst du in der Dunkelheit" - Interview mit Helene Ziegler'
  description: |-
    "Ich hab mich verloren, in meinem eigenen dunklen Eck..." Die junge und talentierte Slam-Poetin Helene Ziegler aus Salzburg nimmt uns mit auf eine ehrliche und schonungslose Reise durch die Dunkelheit des Zweifels. In ihrem kraftvollen Text stellt sie die tiefsten Fragen: Wo ist Gott, wenn das Leid unerträglich wird? Warum scheint er zu schweigen? Dieses Interview ist mehr als nur eine Lebensgeschichte; es ist ein moderner Psalm, eine Klage im besten Sinne, in der sie erkennt, dass das Versteckspiel nicht von Gott, sondern von ihr selbst ausging. Ein inspirierender Beitrag, der Mut macht, auch in den Momenten der größten Hoffnungslosigkeit laut und ehrlich zu sein.

    Weitere Infos unter: www.hopetv.de
