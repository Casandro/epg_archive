  title: Akademie
  description: '"Nic není svaté" aneb Poklady české hudby v moderních aranžmá. Pořad nabídne osobitou retrospektivu vybraných "předělávek" toho, co v české hudební kultuře považujeme za takřka nedotknutelné. Patří sem např. staré české duchovní písně, státní hymna a hudba Bedřicha Smetany. Zkrátka "poklady české hudební historie" tak, jak je neznáte. Připravil muzikolog Viktor Velek, spolupracoval Libor Vacek.'
