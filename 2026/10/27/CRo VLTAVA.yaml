  title: Vizitka
  description: 'Jana Burkiewiczová, choreografka. Čtvrtý ročník festivalu Bread & Dance Prague představí na přelomu října a listopadu výrazné osobnosti a soubory současného českého tance. Jeho zakladatelka, choreografka Jana Burkiewiczová, zve na inscenace souborů 420PEOPLE, BURKICOM, DEKKADANCERS nebo Farma v jeskyni. Každý z nich pracuje s vlastní uměleckou vizí i osobitými prostředky, spojuje je ale odvaha hledat nové podoby scénického umění. Festival zároveň usiluje o to, aby se český tanec prosazoval i na mezinárodní scéně - podporuje spolupráci a hledá cesty, jak českým souborům otevírat dveře na světová pódia. Čím je česká taneční scéna specifická a jak obstojí v mezinárodní konkurenci? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
