  description: |-
    2027 jährt sich zum 800. Mal der Todestag von Dschingis Khan, Mongolenfürst. Aber abgesehen von dem berühmten Schlager ist die Welt der Mongolen hierzulande nahezu unbekannt. Der Direktor des Museums für Vor- und Frühgeschichte der Staatlichen Museen zu Berlin, Prof. Dr. Matthias Wemhoff, möchte das ändern.
    In "Thadeusz lang & breit" spricht Jörg Thadeusz mit Matthias Wemhoff, der auch Berliner Landesarchäologe ist, über den Aufstieg vom verstoßenen Hirtenjungen zum Begründer des größten Landreichs der Menschheitsgeschichte, welchen Einfluss Dschingis Khans Machtverschiebungen auf unsere Gegenwart haben.
