  description: 'Ob als Stange oder Knolle: Sellerie enthält viele gesunde Inhaltsstoffe. Nicht umsonst wurde das Gemüse zunächst als Arzneipflanze angebaut. Erst seit dem 19. Jahrhundert wird sie vermehrt in der Küche genutzt. Sellerie ist mit 18 Kilokalorien beziehungsweise 75 Kilojoule pro 100 Gramm äußerst kalorienarm, das schützt vor überflüssigen Pfunden. Die gesunde Wirkung des Selleries ist vielfältig. Der Saft, der in der Regel aus Stangensellerie gewonnen wird, gilt als sogenanntes Superfood. Unser TV Koch Jörg Guhmann zaubert aus der Wunderknolle ein gesundes Schnitzel raffiniert angerichtet mit schmackhaften Waldpilzen. Seien Sie dabei, wenn er unsere Moderatorin Tanja Götemann mit diesem vegetarischen Gericht überrascht.  Hier das komplette Rezept!'
