- eventId: 715856
  start: 2026-10-27T18:50:00Z
  stop: 2026-10-27T19:00:00Z
  title: Hajaja
  description: Báchrobky 2/7 - O Locim nejstrašnějším. Báchrobky to jsou báchorky a povídačky ze hřbitovů a z popravišť. A taky první dušičkový Hajaja! Poslechněte si příběhy z tajuplných míst, na která vás zavede havran Krasomil. Potkáte tu první katyni, neposednou bludičku nebo příliš roztomilé strašidlo? Možná se chvílemi budete trochu bát, ale uvidíte, že všechny příběhy nakonec dobře dopadnou. Tak žádný strach! Sedm strašidelných pohádek napsal Lukáš Csicsely, dramaturgie Renata Venclová. Natočeno v roce 2023. Režie Bela Schenková. Vypráví Vasil Fridrich.
