  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Václav Pavlík, astrofyzik. Co to jsou exoplanety? Jak vědci poznají, co na nich je? A kolik jich už je objevených? O planetách, které obíhají kolem jiných hvězd, bude vyprávět astrofyzik Václav Pavlík. Moderuje Jana Rychterová.
