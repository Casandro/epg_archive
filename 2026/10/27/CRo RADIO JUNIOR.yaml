  start: 2026-10-27T12:00:00Z
  stop: 2026-10-27T13:00:00Z
  title: Velká pohádka
  description: Skotská pohádka. Král Robert jednoho dne neprozřetelně zavítá do Glenu Sem, do údolí, které zná jen cesty sem a nikoli už zpátky. Přemýšlí tady o sobě, o životě a o své zemi. Jen o jednom nechce ani slyšet. O ženění. Odmítl bretaňskou Marlén s kudrny jak len, irskou kněžnu Mary z Derry i norskou královnu Kristel, která až z Osla poslala posla, že ho má ráda. Jenže bez krále uvězněného mezi stráněmi a bez královny je Skotsko zranitelné a válečné bubny už znějí na poplach. Napsal Jan Jícha, režie Karel Weinlich, natočeno v roce 2006. Účinkují Ivan Trojan, František Němec, Jiřina Jirásková, Pavel Rímský, Klára Trojanová, Barbora Hrzánová a další.
