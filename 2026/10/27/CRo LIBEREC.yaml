  title: Host Dopoledne pod Ještědem
  description: 'Téma: Dluhové pasti. Vedoucí střediska Dlouhá, terénní sociální pracovnice Naděje Aneta Hajská. Ztráta zaměstnání, vážná nemoc, nečekaná životní událost, ale také nákupy nad poměry a řetězení nevýhodných úvěrů. To vše může být příčinou dluhové pasti. Jak se dostat ze spirály dluhů a předejít tak osobnímu bankrotu a jak jsme na tom s finanční gramotností. To jsou témata, kterým se budeme věnovat hodinu před polednem.'
