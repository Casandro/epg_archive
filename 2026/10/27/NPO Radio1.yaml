  title: MISCHA!
  subtitle: Een uur lang met een bekende gast de diepte in, een reis langs inzichten en kwetsbaarheden.
  description: 'Gelukkig zijn ze er nog, de mensen die hun mond opendoen, hun visie, gedachten en dromen met ons delen, zich mengen in het publieke debat of zonder enige terughoudendheid het openbare toneel betreden. Ze trotseren de haat op twitter, de steen door de ruit, de onder de gordel-opmerkingen van reaguurders, terwijl ze weten dat ze ieder moment gecanceld kunnen worden. Toch gaan ze door. Wat beweegt hen? In MISCHA! gaat presentator Mischa Blok op zoek naar de drijfveren van deze mensen. Dat doet ze met haar kenmerkende stijl van interviewen: een echt en gelijkwaardig gesprek. Oprechte interesse. Dus geen draaiboek, geen enkele vraag op papier. Een uur lang met één gast de diepte in, een reis langs inzichten en kwetsbaarheden. Persoonlijke gesprekken met verrassende wendingen die zowel de gast als de presentator ontregelen.'' MISCHA! Iedere maandag- t/m donderdagnacht om 01:00 uur op NPO Radio 1 en daarnaast natuurlijk op ieder gewenst moment te beluisteren in alle podcast-apps! (2026)'
