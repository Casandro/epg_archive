  title: Nooit Meer Slapen
  subtitle: Nour-Eddine Jarram is kunstenaar. Hij brak in de jaren negentig door met zijn schilderijen, waarin hij werken van Hollandse meesters vermengde met motieven uit de islamitische beeldcultuur.
  description: Nour-Eddine Jarram is kunstenaar. Hij brak in de jaren negentig door met zijn schilderijen, waarin hij werken van Hollandse meesters vermengde met motieven uit de islamitische beeldcultuur. Daarna ontwikkelde hij een eigen wereld met glooiende landschappen in verzadigde kleuren, waarin figuren zijn verborgen. Voor de tentoonstelling "Mensen zoals wij" brengt het Chabot Museum het werk van Jarram en Henk Chabot voor het eerst samen. Ondanks hun verschillen delen de kunstenaars een sterke betrokkenheid bij thema's als migratie, vrijheid, identiteit en menselijke waardigheid. Femke van der Laan gaat met Nour-Eddine Jarram in gesprek. (2026)
