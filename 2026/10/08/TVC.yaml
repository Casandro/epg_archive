  title: Złapać przemytnika 4 (odc. 39)
  subtitle: Funkcjonariusze amerykańskiej służby celnej rozprawiają się z przestępcami próbującymi przemycić nielegalne towary do USA. Kamera śledzi agentów pracujących na międzynarodowym lotnisku w Nowym Jorku.
