  title: 'Dzień zagłady: odliczanie 1 (odc. 4)'
  subtitle: Wybucha III wojna światowa; tysiące bomb wodorowych niszczą największe miasta W następstwie zimy nuklearnej zbiory płodów rolnych są znikome, a masowy głód grozi zagładą ludzkości.
  description: |-
    Tytuł oryginalny: Doomsday: 10 Ways the World Will End
    US, 2016
    Reżyseria: Wade Carney
    Występują: Dan Nachtrab, Jake Jacobson, Tomas Johansson, Trevor S. Valle, Justin Wilson
    Serial przedstawia hipotetyczne przyczyny wyginięcia ludzkości. Wśród możliwych scenariuszy są m.in zderzenie Ziemi z asteroidą, wchłonięcie przez ogromną czarną dziurę, spotkanie z planetą wielkości Neptuna, a także burza słoneczna, która pozbawiłaby "błękitną planetę" prądu. Autorzy rozpatrują także możliwość wybuchu wojny nuklearnej, konsekwencje wystawienia Ziemi na intensywne promieniowanie z kosmosu, erupcję wulkanu, wypadnięcie Ziemi z orbity, zniknięcie prądów oceanicznych i atak Obcych.
