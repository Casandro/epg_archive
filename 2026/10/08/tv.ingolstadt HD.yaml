  start: 2026-10-08T11:30:00Z
  stop: 2026-10-08T12:00:00Z
  title: Heimspiel vom 06.10.2026 (Wh.)
  subtitle: 'Heute im Heimspiel: Baseball, Wintersport & Eiskunstlauf.'
  description: |-
    Baseball
    Beim TV 1861 Ingolstadt nimmt die Landesliga-Saison ein überraschendes Ende. Die Laub Raiders aus der Oberpfalz holen sich zwar den Meistertitel, verzichten jedoch auf den Aufstieg. Davon profitieren die Schanzer, die künftig in der Bayernliga spielen. Dort will das Team nun voll angreifen.
    Wintersport
    Für die Athletinnen und Athleten des Deutschen Skiverbands beginnt die entscheidende Phase der Vorbereitung. Ob Abfahrt, Slalom, Skicross oder Nordische Kombination: in Ingolstadt haben die Sportler über Training und ihre Ziele für den kommenden Winter gesprochen. Die Vorfreude ist groß.
    Und Eiskunstlauf
    Die Eisgala verwandelt die Ingolstädter Saturn Arena auch in diesem Jahr wieder in eine große Eis-Bühne. Neben internationalen Stars gibt es mit der Band Eisgala-Allstars und dem Synchroneiskunstlauf einige besondere Premieren. Am 20. Dezember heißt es wieder: Musik und Lichter an für eine Show voller Gänsehautmomente.
- eventId: 1280138
  start: 2026-10-08T12:00:00Z
  stop: 2026-10-08T12:45:00Z
  title: Bayern Agenda vom 7.10.2026 (Wh.)
  subtitle: Das Politmagazin für ganz Bayern.
  description: Was planen die Ministerien für uns? Wie steht es um unser Oberbayern? Wir laden die Kabinettsmitglieder ein, um Rede und Antwort zu stehen - auch Social-Media-Zuschauerfagen werden beantwortet.
- eventId: 1280139
  start: 2026-10-08T12:45:00Z
  stop: 2026-10-08T13:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 1280140
  start: 2026-10-08T13:00:00Z
  stop: 2026-10-08T13:45:00Z
  title: Record 0841 (Wh.)
  subtitle: Der Musik-Talk mit Alexander Onken
  description: |-
    In der 45-minütigen Sendung trifft Alexander Onken Musikerinnen und Musiker zum Dialog in einer angesagten Location. Pro Ausgabe können das nacheinander mehrere Gäste sein - oder auch mal nur einer. In jedem Fall sind es spannende Newcomer oder bereits etablierte Künstler.
    Um eine intime Atmosphäre zu schaffen, verzichten wir ganz bewusst auf ein großes Setting. In der Postproduktion wird das Gespräch mit dem jeweiligen Musikvideo vereint, lockert so den Talk auf, treibt das Thema voran und hält gleichzeitig die Stimmung des Songs.
- eventId: 1280141
  start: 2026-10-08T13:45:00Z
  stop: 2026-10-08T14:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
