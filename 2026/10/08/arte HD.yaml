  description: 'Der Langschwanzmakak ist die am häufigsten vorkommende Affenart auf der Welt. In thailändischen Städten fühlen sich die Bewohner zunehmend durch die Tiere gestört: Die Langschwanzmakaken durchwühlen Mülltonnen und dringen auch in Häuser ein. In freier Natur sind die Affen ausgezeichnete Taucher und Schwimmer. Auf der thailändischen Insel Ko Kho Ram ernähren sich die Langschwanzmakaken von Austern, Muscheln und Krabben. Dabei können die Tiere geschickt mit Werkzeugen umgehen.'
