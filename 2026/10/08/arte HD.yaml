  title: Der Boxerkrieg
  subtitle: Das Ende des chinesischen Kaiserreichs
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Zum 125. Jahrestag des Boxerprotokolls erzählt die Dokumentation "Der Boxerkrieg - Das Ende des chinesischen Kaiserreichs" vom Aufstand chinesischer Bauern gegen ausländische Kolonialmächte, darunter Frankreich und Deutschland. Seltene Bildquellen zeigen einen Krieg, der von extremer Gewalt geprägt war und der im Westen - anders als in China - weitgehend vergessen ist.
- eventId: 768424
