  description: 'Unterwegs auf einer abenteuerlichen Route durch das Pamir-Gebirge, die voller Geheimnisse und Überraschungen steckt: Diese Folge der Dokureihe führt vorbei an über 7.000 Meter hohen Bergen nach Kirgistan, wo Steppen und Pferdeherden das Bild bestimmen. Ausgangspunkt der Reise ist Duschanbe, die Hauptstadt Tadschikistans.'
