  title: Der Boxerkrieg
  subtitle: Das Ende des chinesischen Kaiserreichs
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Zum 125. Jahrestag des Boxerprotokolls erzählt die Dokumentation "Der Boxerkrieg - Das Ende des chinesischen Kaiserreichs" vom Aufstand chinesischer Bauern gegen ausländische Kolonialmächte, darunter Frankreich und Deutschland. Seltene Bildquellen zeigen einen Krieg, der von extremer Gewalt geprägt war und der im Westen - anders als in China - weitgehend vergessen ist.
- eventId: 768424
  start: 2026-10-08T03:55:00Z
  stop: 2026-10-08T04:50:00Z
  title: 360° Reportage
  subtitle: 'Leben mit dem Tod: Ahnenkult auf Sulawesi'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Auf der zu Indonesien gehörenden Insel Sulawesi dreht sich schon zu Lebzeiten der Bewohner alles um den Tod, vielmehr um die Beerdigung. Der Totenkult der Toraja kann mehrere Hunderttausend Euro verschlingen, was die Bestattung verstorbener Verwandter oft auf Jahre unmöglich macht. So behalten die Angehörigen ihre Toten so lange im Haus, bis sie das Geld für die aufwendigen Feierlichkeiten zusammen haben. Die Toraja und ihr komplexer Ahnenkult lassen einen anderen Blick auf den Tod werfen.
