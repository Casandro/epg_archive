  title: Die Concorde - Absturz einer Legende
  subtitle: Deutschland/Frankreich/USA 2020
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Concorde war das außergewöhnlichste Passagierflugzeug, das je gebaut wurde - ein technisches Wunderwerk, dessen Innovation und Schönheit bis heute für viele ungeschlagen sind. Doch beim Absturz einer Concorde bei Paris im Jahre 2000 kamen 113 Menschen ums Leben. Bald danach wurde das einzige Überschall-Passagierflugzeug der Welt vorzeitig aus dem Verkehr gezogen.
- eventId: 768415
  start: 2026-10-08T01:20:00Z
  stop: 2026-10-08T01:45:00Z
  title: Weht bald ein anderer Wind?
  subtitle: 42 - Die Antwort auf fast alles
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Bisher war der Wind das Stiefkind der Klimaforschung: zu schwierig zu messen, zu wechselhaft, zu wenige Daten aus der ferneren Vergangenheit. Aber in den letzten Jahren rückt er zunehmend in den Fokus, wenn es um unsere Zukunft im sich verändernden Klima geht.'
- eventId: 768416
  start: 2026-10-08T01:45:00Z
