  title: Jihočeské odpoledne
  subtitle: Odpolední živě moderovaný radioproud plný hudby a informací z regionu.
  description: Čtyřiatřicet metrů vysoká kamenná hráz Husinecké přehrady na Prachaticku je teď vidět skoro celá. Kvůli dlouhodobému suchu zůstalo v nádrži jen asi jedno procento běžné zásoby vody. I kvůli tomu se na hrázi scházejí lidé, kteří se chtějí podívat na vyschlou přehradu. Natáčel reportér Ľubomír Smatana. Na burze škol v Třeboni si mohli včera budoucí studenti učební obory doslova osahat. Deváťáci viděli třeba virtuální realitu, rozebraný motor nebo krajtu Alfreda. Příspěvek připravila Eva Marvanová.
