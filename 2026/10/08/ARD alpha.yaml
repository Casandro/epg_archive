  title: Willi wills wissen
  subtitle: Gib Gummi!
  subtitled: true
  description: "So viele Dinge sind aus Gummi oder enthalten wenigsten das lustige Material, das man so schön deeeeeeehnen kann: Der Flummi, der Hosengummi, die Gummistiefel, das Gummiboot, das Bungeeseil, Autoreifen und, natürlich, der Radiergummi! Um den geht es Reporter Willi heute als erstes. \nUm heraus zu finden, wie ein Ratzefummel hergestellt wird, ist der Reporter in der Nähe von Hannover unterwegs, bei der Firma Läufer in Burgdorf. Dort trifft er Carlo, der ihm Schritt für Schritt zeigt, wie aus einem Stück Naturkautschuk Gummi wird."
