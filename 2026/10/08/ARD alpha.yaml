- eventId: 977500
  start: 2026-10-08T09:45:00Z
  stop: 2026-10-08T10:05:00Z
  title: RESPEKT kompakt
  subtitle: Pluralismus - warum die Demokratie von mehr Vielfalt profitiert
  subtitled: true
  genre:
  - '128'
  description: |-
    Freie Meinungsäußerung - ein im Grundgesetz verankertes Recht. In Deutschland ist sie eine Selbstverständlichkeit, die wir tagtäglich leben und uns kaum mehr bewusst machen. In nicht-demokratischen Ländern heißt es nicht selten, das eigene Leben für Werte und Weltanschauung zu riskieren.

    Die Reportage "Pluralismus" zeigt in Begegnungen mit Menschen, wie Meinungsvielfalt gelebt werden kann. Unsere Gesellschaft wird immer heterogener, umso mehr kommt es jetzt darauf an, auch bei unterschiedlichen Meinungen in einen fairen Dialog zu treten und Toleranz zu üben.

    Moderation:  Sabine Pusch
