  title: Die größten Rätsel der Wissenschaft
  subtitle: Tutanchamuns Dolch aus dem All
  description: Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. Eine der Grabbeigaben des jung verstorbenen Pharaos Tutanchamun war ein Dolch mit Eisenklinge, ein Dolch, den es nicht geben dürfte. Denn die Eisenzeit begann erst rund 500 Jahre später. Woher also stammt dieser mysteriöse Dolch, war er wirklich aus Meteoreisen, kam er vielleicht sogar aus dem Weltall? Und wer hatte ihn gefertigt?
- eventId: 977534
  start: 2026-10-08T14:05:00Z
  stop: 2026-10-08T14:55:00Z
  title: Die größten Rätsel der Wissenschaft
  subtitle: Solare Superstürme
  description: 'Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. Thema dieser Episode sind die solaren Superstürme, die durch koronale Massenauswürfe auf der Sonne ausgelöst werden. Für die moderne Infrastruktur auf der Erde und die Satelliten im Erdorbit können sie verheerend sein. Um diese Bedrohung für Mensch und Technik in den Griff zu kriegen, müssen wir eines der größten Rätsel der Wissenschaft lösen: Warum und wann entstehen die solaren Superstürme?'
- eventId: 977535
  start: 2026-10-08T14:55:00Z
  stop: 2026-10-08T15:30:00Z
  title: Kreist ein Phantom um die Sonne?
  subtitle: Deutschland 2025
  description: 'Unser Sonnensystem schrumpfte von neun auf acht Planeten, als Pluto 2006 zum Zwergplaneten degradiert wurde. Doch "Pluto-Killer" Mike Brown meint, dass wir kurz vor der Entdeckung eines neunten Planeten stehen: Es mehrten sich zuletzt die Anzeichen, dass es da noch einen Planeten in unserem Sonnensystem gibt. Unregelmäßigkeiten im äußeren Sonnensystem ließen keinen anderen Schluss zu. Doch könnte es auch einen anderen Grund für diese Auffälligkeiten geben?'
