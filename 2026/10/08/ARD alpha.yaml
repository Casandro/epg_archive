  description: Der Italienischkurs "Avanti! Avanti!" führt Anfänger in 26 Lektionen zur Beherrschung der wichtigsten Konversationsformeln und der nötigsten Grammatik. Auch zur Auffrischung vorhandener Italienischkenntnisse ist die Serie hervorragend geeignet.
- eventId: 977357
  start: 2026-10-08T04:30:00Z
  stop: 2026-10-08T05:00:00Z
  title: TELEKOLLEG Französisch (11/39)
  subtitle: Bon Courage
  description: Die Lebenswege der Menschen unterscheiden sich ganz erheblich. Oft stehen unvorhersehbare Hürden einer geradlinigen Schulausbildung im Wege. Aber eine fundierte Ausbildung ist als solide Basis für ein erfülltes Berufsleben wichtig. Das Telekolleg eröffnet Ihnen die Möglichkeit, Wissen aufzufrischen oder staatlich anerkannte Schulabschlüsse nachzuholen - auch später und neben Job und Familie.
- eventId: 977358
  start: 2026-10-08T05:00:00Z
  stop: 2026-10-08T05:15:00Z
  title: GRIPS Mathe
  subtitle: Terme
  subtitled: true
  description: |-
    Ein Ferienjob im Sealife, das klingt doch gar nicht schlecht! Doch welche Tätigkeit ist am interessantesten und vor allem wo verdient man am meisten? Janine und Ibo vergleichen die verschiedenen Verdienstmöglichkeiten mit Hilfe von Termen.

    In dieser Lektion erfährst du alles über Terme: Was ist ein Term? Wie kann man ihn vereinfachen? Und welche Regeln gelten beim Rechnen mit Termen? Dabei nehmen wir zum Beispiel die Klammersetzung unter die Lupe, du erfährst, was du beachten musst, wenn ein Minus vor der Klammer steht und es geht es um Terme mit Variablen, also um Terme die einen Platzhalter für eine bestimmte Zahl enthalten.
- eventId: 977359
  start: 2026-10-08T05:15:00Z
  stop: 2026-10-08T05:30:00Z
  title: GRIPS Mathe
  subtitle: Lineare Gleichungen
  subtitled: true
  description: |-
    Eine Gleichung ist wie eine Wippe, nur wenn beide Seiten "gleich schwer" sind, befindet sich die Wippe im Gleichgewicht. Das GRIPS-Team macht sich auf den Weg zu den Kulissenhallen des Bayerischen Rundfunks und macht den Selbstversuch.

    Du erfährst in dieser Lektion, was eine Gleichung ist. Häufig kommen in Gleichungen Variablen vor. Das sind Platzhalter für unbekannte Teile einer Gleichung. Wir zeigen dir, wie du eine Gleichung mit Variablen aufstellst und wie du diese Gleichung dann Schritt für Schritt löst. Dabei lernst du auch, auf welche Rechenregeln du besonders achten musst.
