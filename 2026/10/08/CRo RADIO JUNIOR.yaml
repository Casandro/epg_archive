  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Libuše Pecharová a Martin John ze SOŠ a SOU Hradec Králové. Martin je panem mistrem v oboru klempíř a Libuška studuje na klempířku a vyhrála už i celostátní přehlídku učňovských oborů České ručičky ve svém oboru. Stala se tak první ženou v historii soutěže, která ovládla obor klempíř. Co ji na oboru baví a proč si ho vybrala? A je těžké se na školu dostat? Moderuje Eva Sinkovičová.
- eventId:
  - 1535270
  - 1541544
  start: 2026-10-08T17:50:00Z
  stop: 2026-10-08T18:00:00Z
  title: Hajaja
  description: O nejkrásnějším ostrově 4/7 - O kanárkovém ostrově. Poslouchat rady rodičů se dětem často nechce. Zvláště když si myslí, že poučení jsou už zastaralá a nepotřebná. Právě takové připadalo malému Fumiovi pravidlo, že se lidé k sobě mají chovat slušně a že si nikdo nemůže dělat jen to, co sám chce. Rozhodl se, že najde takové místo, kde si každý žije podle svého přání a nálady. Původní pohádkový seriál napsala Dagmar Langová. V roce 2013 natočil režisér Petr Mančal. Vypráví Luboš Veselý.
