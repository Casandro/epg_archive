- eventId: 1536381
  start: 2026-10-08T11:00:00Z
  stop: 2026-10-08T12:00:00Z
  title: Velká pohádka
  description: 'Chytrá princezna. V královském zámku se mísí radost a štěstí s obavami. Jiřík totiž kdysi upsal svou duši peklu a teď mu zbývají poslední tři dny a tři úkoly, kterými se může vykoupit. Naštěstí má chytrou ženu, která dokáže přelstít i čerta. Na motivy pohádky Boženy Němcové napsal: František Pavlíček. Režie: Karel Weinlich. Hrají: Sylva Sequensová, David Schneider, Luděk Munzar, Jana Hlaváčová a Josef Vinklář.'
