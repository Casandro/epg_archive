  description: |-
    USA 2023
    1984 steht das Basketballgeschäft von Nike vor dem Aus, doch der Sonderbeauftragte Sonny Vaccaro setzt alles daran, um den Nachwuchsstar Michael Jordan als Markenbotschafter zu gewinnen.

    Nachdem Vaccaro für die Chance auf ein Treffen mit Jordan und dessen Eltern zunächst sowohl seinen Chef als auch Jordans Spieleragenten übergeht, konzipiert er mit seinem Team den legendären Air Jordan und schreibt mit dem Schuh Sport- und Marketinggeschichte.
