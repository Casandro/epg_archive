  title: Schauplatz Gericht
  description: |-
    Wohn-Klage
    Die L.s haben 2020 bei einem Bauträger in Innsbruck Eigentumswohnungen erworben. Der Bauträgervertrag sieht vor, dass die neu zu errichtenden Wohnungen spätestens Ende 2022 übergeben werden. Bis heute sind die Wohnungen nicht fertiggestellt, der Bauträger reagiert nicht mehr auf Urgenzen. Die L.s haben eine Klage auf Schadenersatz eingebracht. Weil die neuen Wohnungen, für die sie bereits mehr als 80% vom Kaufpreis bezahlt haben, nicht bezugsfertig sind, können sie die Wohnung, in der sie jetzt wohnen, nicht vermieten. Aber auch dieses Verfahren zieht sich in die Länge. Die Klage wurde 2023 eingebracht, ein Urteil gibt es immer noch nicht. Die Baustelle steht still. Die halb fertiggestellten Wohnungen verfallen immer mehr.
  genre:
  - '35'
