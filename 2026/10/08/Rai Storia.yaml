  description: ifica essere liberi? E, siamo davvero in grado di esserlo? Il paese sta vivendo un'epoca di passione politica e profonde trasformazioni sociali, ma, speranze e certezze degli anni della contestazione cominciano a incrinarsi. Gaber - showman, autore di ballate romantiche e cantautore politico, artista poliedrico, istrione e affabulatore, innovatore del teatro e della canzone, intellettuale engagé ma non organico né allineato, utopista, nichilista, antitaliano e al tempo stesso appassionato indagatore dei mali della società italiana, coscienza critica e modello di riferimento per molti giovani impegnati - ancora una volta mette sotto accusa parole, comportamenti e ideologie del suo tempo. Raccontando le contraddizioni di una generazione, la crisi delle utopie, trasforma lo spettacolo nel luogo di una originale critica politica e sociale dell'Italia degli anni '70. In studio con Paolo Mieli, il prof. David Bidussa. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. David Bidussa Con la partecipazione di Emanuela Lucchetti
