  description: Als Sonja Velich mir sagt, sie möchte eine Paprikablume mit mir kochen, konnte ich mir ein Nasenrümpfen nicht verkneifen - Paprika gehört nicht zu meinem Lieblingsgemüse und Florales im Essen behagt mir auch nicht wirklich. Aber nachdem sie dermaßen überzeugt war von ihrer Kreation, tat ich, als wär's mir recht und fuhr in den Seewinkel. Das Weingut liegt am äußersten Eck Österreichs, ein paar Schritte weiter überquert man die Grenze zu Ungarn. Paprika ist hier Programm, klar, und mit Couscous gefüllt ließ ich mich auch besonders gerne zur Blume überreden. Ein Spitzengericht für den Sommer - leicht und unkompliziert. Dass Velichs Weine bestens dazupassen, versteht sich von selbst. AT 2021
- eventId: 1500766
  start: 2026-10-08T13:45:00Z
  stop: 2026-10-08T13:50:00Z
  title: Mein wunderbarer Kochsalon - Tomaten-Galette mit Ziegenfrischkäse und Basilikumpesto
  subtitle: Mein wunderbarer Kochsalon - Tomaten-Galette mit Ziegenfrischkäse und Basilikumpesto
  description: 'Im Moment leide ich unter akuter Provence-Sehnsucht. Schuld daran ist Madame le Commissaire, deren Kriminalfälle ich am liebsten im Sommerurlaub verschlinge. Mit dem Ergebnis: Ich komme aus dem Urlaub und will nur weg, nämlich in die Provence. Zweitens verspüre ich Seite um Seite den Drang, mir ein krachkaltes Glas Rosé einzuschenken und dazu nicht nur das Buch, sondern auch eines der südfranzösischen typischen Gerichte zu verschlingen. Eines der spannendsten Rezepte aus dem letzten Buch habe ich versucht, hier nach zu kochen. Ich finde das Ergebnis großartig. Vor allem mit einem Glas Rosé. Und irgendwie habe ich dann doch das Gefühl, noch ein bisschen auf Urlaub zu sein. AT 2021'
- eventId: 1500767
