  title: Mein wunderbarer Kochsalon - Steinbuttfilet in Zitronen-Kapern-Butter
  subtitle: Mein wunderbarer Kochsalon - Steinbuttfilet in Zitronen-Kapern-Butter
  description: 'Mein Erinnerungsvermögen definiert sich ganz stark über Gerüche - natürlich rufen Bilder und Klänge auch Gedanken an früher hervor, aber am stärksten bilden sie sich über Geruch und Geschmack aus. So gesehen ist es kein Wunder, dass mir der Geruch nach Weißwein, Kapern, warmer Butter und zartem Fischfleisch fast Tränen in die Augen treibt. Es war vor vier Jahren, mein Mann und ich unternahmen eine Wanderung an den unfassbaren Klippen in Cornwall und kehrten mittags in ein Pub ein. Was von außen unscheinbar und gewöhnlich wirkte, entpuppte sich als unvergessliche Geburtsstätte eines der besten Fischgerichte, die ich je gegessen hatte: Steinbutt in Zitronen-Kapern-Butter. Mein Versuch einer Reproduktion ist durchaus gelungen, ja, die Klippen fehlen, aber mit dem richtigen Fisch bekommt man das ganz gut hin. Ich habe meinen Steinbutt bei Eishken gekauft, dort hält man die Fische aus französischer Aquakultur in 30.000-Liter-Salzwasserbecken. AT 2021'
- eventId: 1500703
  start: 2026-10-08T02:15:00Z
  stop: 2026-10-08T02:23:00Z
  title: Mein wunderbarer Kochsalon - Shakshuka
  subtitle: Mein wunderbarer Kochsalon - Shakshuka
  description: "Er: Was hast du heute zum Mittagessen geplant?\n\nIch: Dass du mich ausführst. Unter drei Hauben komme ich aber nicht mit.\n \nEr, leicht gestresst: Was? Warum sagst du mir das nicht früher? Ich muss doch etwas reservieren! Und überhaupt: Was schwebt dir vor?\n \nIch, gütig: Entspann dich Kari, war nur ein Witz, es gibt Shakshuka.\n \nEr: Das ist jetzt auch ein Witz, oder? Den Namen hast du dir gerade ausgedacht.\n \nIch: Nein, das ist ein typisch israelisches Frühstücksgericht, das es bei uns eben zu Mittag gibt.\n \nEr: Du bist mir ein Rätsel. In allem, was du gerade gesagt hast.\n \nIch: Es bleibt spannend, auch nach 20 Jahren Paarlauf.\n \nEr: Wer ist seit 20 Jahren ein Paar?\n \nIch: Kari, du bist so vergesslich. Wir natürlich! Ich finde es wirklich verletzend, dass du dir nicht einmal das merken kannst! Wenn schon nicht meinen Geburtstag und...\n \nEr: Haha, reingelegt. Das war jetzt mein Witz.\n \nWährend ich Paprika, Tomaten und Zwiebeln in Form brachte, dachte ich nach, ob er nicht nur einfach die Kurve gekratzt hat. Bis heute weiß ich es nicht. Aber die Shakshuka war perfekt. Auch wenn mein Mann findet, man kann sie einfach Letscho mit Ei nennen. Irgendwie hat er Recht. AT 2021"
- eventId: 1500714
  start: 2026-10-08T02:25:00Z
  stop: 2026-10-08T02:29:00Z
  title: Mein wunderbarer Kochsalon - Avocado-Frühlingsrollen
  subtitle: Mein wunderbarer Kochsalon - Avocado-Frühlingsrollen
  description: 'Die Avocado hat eine Karriere sondergleichen hingelegt, sie startete als elitäres Superfood und drängt sogar Kim Kardashian als Social Media Star vom Podest. Was wir uns anfänglich glücklich auf den Sauerteigtoast strichen, wird mittlerweile sogar in Pudding und Haarmaske verpackt. Der Makel der Avocado steckt einzig und alleine in ihrem Durst: Sie verbraucht so viel Wasser, dass man alleine vom Hausverstand her auf übermäßigen Genuss verzichten sollte. Wenn Avocado, dann gut überlegen, was man damit machen möchte. Dieses Rezept ist die Avocado wert: knusprige Frühlingsrollen mit Chilidip. Perfektes Fingerfood im Sommer, als Starter vor dem BBQ oder einfach als köstlicher Snack zum TV-Programm. AT 2021'
