  subtitle: Mein wunderbarer Kochsalon - Mediterrane Gemüse-Reis-Pfanne
  description: Immer, wenn meine Mutter sagte, es gäbe Gemüsereis zum Mittagessen, habe ich ein langes Gesicht gezogen. Meine Mutter hat uns die ganze Kindheit durch unvergleichlich bekocht, die besten Rahmschnitzel, Krautwickler und Bohnschadeln der Welt, ganz zu schweigen von ihrer Weihnachtsbäckerei und der Sachertorte (das Hotel Sacher kann sich bei der Torte meiner Mutter anschnallen, ehrlich). Aber ihr Gemüsereis langweilte mich zu Tränen. Daher, liebste Mutter, hier meine Variante eines Gemüsereis, die nicht nur spannender schmeckt, sondern auch prachtvoll aussieht. Ich habe sie übrigens mit ÖsterReis gemacht, heimischer Reis aus Gerasdorf. AT 2021
