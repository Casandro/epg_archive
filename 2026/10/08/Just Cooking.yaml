  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ivan Raltson
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ivan Raltson
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sao Paulo, eine der größten Städte der Welt, pulsierendes Herz des modernen Brasilien! Doch die 12 Millionen-Metropole hat mehr zu bieten als Business und Beton.  Im Künstlerviertel Vila Madalena hat sich eine neue Bohéme niedergelassen, die sich innovativer Küchenkunst verschrieben hat. An der Speerspitze dieser Bewegung: Ivan Ralston. Der junge Paulista hat ursprünglich Musik studiert, sich aber kurz darauf seiner wahren Berufung zugewendet: der Erneuerung brasilianischer Esskultur. Martin Klein besucht Ralston in seiner Heimatstadt, um die Gerichte aus dem Tuju ins Restaurant Ikarus im Salzburger Hangar-7 zu holen. Dabei entsteht ein Menü, das die multikulturelle Vielfalt Sao Paulos auf den Punkt und vor allem auf die Teller bringt!  AT 2020'
- eventId: 1500777
  start: 2026-10-08T14:30:00Z
  stop: 2026-10-08T14:55:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Pascal Barbot
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Pascal Barbot
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Pascal Barbot ist ein Meister der Einfachheit. Sein Reich ist die wohl die kleinste Sterneküche der Welt. Nur wenige Quadratmeter, auf denen aber Bahnbrechendes geschieht: der Franzose erweitert die Küche seiner Heimat um eine neue Dimension. AT 2012'
- eventId: 1500779
  start: 2026-10-08T15:00:00Z
  stop: 2026-10-08T15:25:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Onno Kokmeijer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Onno Kokmeijer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein war schon oft und gern in Amsterdam, aber so großzügige und fröhliche Gastgeber hatte er noch nie! Onno Kokmeijer und Arjan Speelman stellen die wohl berühmteste kulinarische Doppelspitze Hollands. In ihrem mit zwei Michelin-Sternen ausgezeichneten Restaurant Ciel Bleu hoch über den Dächern der Stadt verwöhnen sie ihre Gäste mit internationaler Küche, ohne lokale Produkte dabei aus den Augen zu verlieren. Sie servieren ausladende Gerichte, keine Snacks - ein Genuß für den Gast, aber auch deutlich mehr Lernaufwand für den Gast aus Salzburg! Dieser muß sich erst einmal ans Pulen von Krabben gewöhnen - und eine Taube im Salzmantel hat er auch noch nie gesehen. Ein gemeinsamer Ausflug mit dem Kutter zum Muschelsuchen im Watt begeistert aber auch den erfahrenen 2-Sterne-Koch, zumal sich dieser Trip zum Festtag für Genießer entwickelt: Auf dem Boot zeigen die Chefs, was sie können! AT 2020'
