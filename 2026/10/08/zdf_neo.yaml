  title: Ermittler!
  subtitle: Die Täuschung
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Täter sind oft Meister der Täuschung. Sie täuschen ihre Opfer und Kriminalisten, die sie zur Strecke bringen wollen. Doch die Ermittler bleiben beharrlich, wie in diesem Fall aus Südtirol.

    Bei Meran liegt ein Mann tot in einer Obstwiese - sein Bein ist fast abgetrennt. Capitano Lunardi glaubt zuerst an einen Mord. Staatsanwalt Goldbeck und Kommissar Schlund starten 2015 die Jagd auf Anlagebetrüger und stoßen auf ein internationales Netzwerk.
    HD-Produktion
