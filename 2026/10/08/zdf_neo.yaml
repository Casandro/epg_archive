  description: |-
    Deutschland 2025
    Viele Morde werden in Liebesbeziehungen begangen. Doch das macht die Aufklärung nicht unbedingt leichter, denn die Taten sind oft minuziös geplant und schwer zu durchschauen.

    In Flensburg wird eine Marokkanerin als vermisst gemeldet. Ermittler Hauke Bahnsen glaubt nicht, dass die junge Mutter freiwillig verschwunden ist. An einem See bei München liegt eine bis zur Unkenntlichkeit verbrannte Leiche. Ein Fall für Staatsanwalt Lafleur.
    HD-Produktion
