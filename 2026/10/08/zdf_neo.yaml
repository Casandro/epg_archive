  description: |-
    Deutschland 2024
    Binnen weniger verhängnisvoller Sekunden passieren Verbrechen. Staatsanwältin Karen Häußer ermittelt im Frühjahr 2023 gegen einen Taximörder, der sein argloses Opfer überrascht hat.

    Der 49-Jährige wurde für eine Beute von nur zehn Euro umgebracht. Und: Der Täter hat nicht zum ersten Mal getötet. Dr. Josef Siska muss sich 1983 in Wien mit einem Doppelmord an Mutter und Tochter beschäftigen. Es gibt kein Motiv, aber noch ein weiteres Opfer.
    HD-Produktion
