  audiodesc: true
  description: |-
    Deutschland 2025
    Salzgitter, 26. Januar 2019: Milad A. bricht nach Schüssen in einem Hinterhof zusammen, stirbt im Krankenhaus. Kameras und eine Augenzeugin liefern den Beamten Hinweise auf den Täter.

    Oberstaatsanwalt Hans Christian Wolters und die Ermittler verknüpfen das Überwachungsvideo, Zeugenhinweise und Drohungen aus dem Umfeld der Freundin. Schmauchspuren werden zum Wendepunkt. Der Verdächtige Ala A. schweigt - doch die Indizienkette überführt den Täter.
    HD-Produktion
