  description: |-
    Deutschland 2023
    Mörder gibt es in unterschiedlichsten Schichten und Berufen. Auch dort, wo man sie nicht vermutet. Alle vereint: Sie haben ein Motiv. Finden die Ermittler es, können sie die Täter entlarven.

    So wie in dem Fall der zweifachen Mutter Maria F., die spurlos verschwindet. Voller Sorge wendet sich ihr Mann, ein beliebter Pfarrer, an die Öffentlichkeit. Die Gemeindemitglieder fühlen mit ihm, doch Kriminalexperte Isager-
    Nielsen hält ihn für verdächtig.
    HD-Produktion
