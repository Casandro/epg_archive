  title: MareTV
  subtitle: Öland - Schwedens königliche Insel
  description: 'Im Westen terrassenförmige Felsgebilde, im Osten endlose Sandstrände und verwunschene Wälder mit vom Wind gebeugten Kiefern. Öland, die lange schmale Inselschönheit in der Ostsee ist das perfekte Naherholungsgebiet für die Schweden. Nur sechs Kilometer vom Festland entfernt, ist sie schnell über eine Brücke zu erreichen. Jeden Sommer zieht die schwedische Königsfamilie ins Schloss Solliden, ihren Sommersitz auf der Insel. - Die Sonneninsel Öland ist auch die Insel des Windes. Früher drehten sich dort die Flügel von 2.000 Bockwindmühlen. Inzwischen hat sich ihre Zahl auf 400 reduziert, Wind und Wetter bedrohen die historischen Holzbauten... - Für Lars Einarsson ist Öland eine Trauminsel: Er ist Schatzsucher und Leiter der Tauchexpedition zum Wrack der "Kronan", eines der gewaltigsten Segelschiffe des 17. Jahrhunderts. Ein Traum für jeden Schatzsucher!'
  genre:
