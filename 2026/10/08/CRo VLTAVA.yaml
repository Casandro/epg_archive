  title: ArtCafé
  description: 'Jak online prostor proměňuje způsob, jakým vnímáme sami sebe i ostatní? Odpoví i 30. ročník Mezinárodního festivalu dokumentárních filmů Ji.hlava. Sociální sítě, algoritmy a digitální komunity ovlivňují naše představy o tom, jak bychom měli vypadat, žít nebo přemýšlet. Film Zářit sleduje mladé lidi, pro které se online svět stává prostorem neustálého srovnávání a honby za dokonalostí. Snímek Nesnášení zase ukazuje internet jako místo konfliktu, utvrzování vlastních postojů a postupné radikalizace. O vlivu online prostoru na naše identity, vztahy i společnost mluví Agáta Hrnčířová s režiséry Ondřejem Šálkem a Martinem Pávem a s vedoucí jihlavského Inspiračního fóra Terezou Swadoschovou. E-mail: artcafe@rozhlas.cz'
