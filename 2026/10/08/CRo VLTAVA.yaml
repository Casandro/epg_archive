  title: Vizitka
  description: Justin Quinn, básník a překladatel. Pochází z Dublinu a v Česku žije přes třicet let. Převádění české poezie do angličtiny je pro něj spíš fyzický než mentální proces. Svět vnímá rovnou dvojjazyčně, jakkoliv se pohybuje mezi dvěma světy, které se občas střetávají. "Když člověk neumí jazyk země, v níž žije, je to jako ve vězení," konstatuje ve Vizitce. Proč se v devadesátých letech vydal do Prahy? Co pro něj bylo překvapivé na sídlišti Jižní Město? Jak složité bylo proniknout do češtiny natolik, aby mohl začít překládat básně? A jak mu česká poezie pomohla pochopit tuzemské prostředí, kontext a mentalitu? V srpnu se Justina Quinna ptala Karolína Koubová. Repríza ze 7. 8. 2026
