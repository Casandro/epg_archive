- eventId: 1385639
  start: 2026-10-08T03:57:00Z
  stop: 2026-10-08T04:00:00Z
  title: Myšlenka na den
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Kdo je můj bližní?Ježíš se ujal slova a řekl: ?Jeden člověk sestupoval z Jeruzaléma do Jericha a octl se mezi lupiči. Ti ho o všechno obrali, zbili, nechali napolo mrtvého a odešli. Náhodou šel tou cestou nějaký kněz; viděl ho, ale vyhnul se mu. Stejně i jeden levita přišel k tomu místu; viděl ho, ale vyhnul se mu. Také jeden Samaritán přišel na své cestě k němu, viděl ho a bylo mu ho líto. Přistoupil k němu, nalil mu do ran oleje a vína, obvázal je, vysadil ho na svého soumara, dopravil do hostince a staral se o něho. Druhého dne vytáhl dva denáry a dal je hostinskému se slovy: ''Starej se o něho, a co vynaložíš navíc, já ti doplatím, až se budu vracet.'' Co myslíš, kdo z těch tří se zachoval jako bližní k tomu, který se octl mezi lupiči?“ On odpověděl: ?Ten, kdo mu prokázal milosrdenství.“ A Ježíš mu řekl: ?Jdi a stejně jednej i ty!“Papež Lev dodává:Podobenství, které Ježíš vypráví, se odehrává (?) na cestě, a je to cesta náročná a strmá, stejně jako život. (?) Život je však tvořen ze setkání, a v těchto setkáních se projevuje naše pravá podstata. Stojíme tváří v tvář druhému, před jeho křehkostí a slabostí, a můžeme se rozhodnout, jak se zachovat: postarat se o něj, nebo předstírat, že se nic neděje. Stejnou cestou přicházejí kněz a levita. Jsou to lidé, kteří slouží v jeruzalémském chrámu, kteipadě text neuvádí odkud kam se ubírá, říká pouze, že byl na cestě. Náboženství zde nehraje žádnou roli. Tento Samaritán se zastaví jednoduše proto, že se ocitl před jiným člověkem, který potřebuje pomoc. Kdy budeme také my schopni přerušit svou cestu a projevit soucit? Když pochopíme, že ten zraněný muž na cestě představuje každého z nás. A tehdy nám vzpomínka na všechny ty chvíle, kdy se Ježíš zastavil, aby se o nás postaral, pomůže, abychom byli lépe schopní soucítit. (Lev XIV. ? Generální audience, 28. května 2025)Přeložila JB, upravil MHhttps://www.vaticannews.va/cs/papez/news/2026-10/podcast-slova-papezu-kdo-je-muj-blizni.html'
  subtitle: Kdo je můj bližní?
