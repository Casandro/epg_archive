  description: 'Autor a interpret: Petr Húšť; Premiéra: 7.10.2026 * Povzbuzování je dnes trochu věda. Mluví se o poměru pochval oproti kritice, o formě, jak je vyjadřovat a v poslední době i o tom, že moc pochval taky působí nejistotu, respektive sebejistotu podmíněnou. Jak se tedy k chválení postavit a co je skutečným povzbuzením, o tom bude řeč v další relaci Klika. Petr Húšť dostane slovo v 10.15.'
