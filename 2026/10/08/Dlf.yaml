  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nSachsen-Anhalt: Hans-Thomas Tillschneider (AfD) und der \"Islam als großer Feind\"\nMit Hans-Thomas Tillschneider ist ein habilitierter Islamwissenschaftler in Sachsen-Anhalt zum Landtagsvizepräsidenten gewählt worden. Tillschneider spricht sich gegen die Präsenz des Islams in Deutschland aus und markiert den Islam entsprechend der Ideologie der Neuen Rechten als ?großen Feind? - das erläutert die Religionswissenschaftlerin und Theologin Philine Lewek im Interview. \n\nKirche in Kanada: Die Missionsschulen und das Leid der indigenen Bevölkerung\nJahrzehntelang sind indigene Kinder in Kanada in christlichen Missionsschulen ?erzogen? worden - oft gegen den Willen der Familien und mit Gewalt. So sollte nicht nur die indigene Kultur zum Verschwinden gebracht werden, viele Kinder kamen in den Internaten auch ums Leben. Damit setzt sich der Autor und Filmemacher Julian Brave Noisecat auseinander. \n\nAm Mikrofon: Christian Röther"
