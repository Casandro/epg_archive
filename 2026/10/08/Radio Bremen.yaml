  subtitle: Graues Gold - Faszination Beton
  genre:
  - '112'
  description: Neue Häuser, Straßen, Brücken oder Gehwege, wenn gebaut wird, geht es fast nie ohne Beton. 125 Millionen Tonnen des Baustoffes werden jährlich in Deutschland mit Betonmischern zu den Baustellen gefahren. In kaum einem anderen Land in Europa wird so viel von dem Kies-, Sand- und Zementgemisch verarbeitet. Dabei kommen alle Bestandteile in großen Mengen im Boden von Norddeutschland vor. Der Film erzählt den Weg des Betons von der norddeutschen Kalkmergelgrube bis zur Baustelle.
