  description: Wer ist Werwolf, wer Dorfbewohner? Die zweite Staffel der mit dem Deutschen Entertainment Award ausgezeichneten Show hält nicht nur für die 15 Spielenden zahlreiche Überraschungen bereit. Jeder Blick, jedes Zögern und jede noch so kleine Geste können Verdacht erregen. Wer spielt ein doppeltes Spiel? Wem gelingt es, die Gruppe zu manipulieren? Und wem kann man trauen, wenn alle lügen?
