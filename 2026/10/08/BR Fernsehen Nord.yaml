  subtitle: Der Wolfshund
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Nach der Rollenzeremonie tauschen sich die Spielenden in kleinen Gruppen über ihre ersten Beobachtungen aus. Mimik, Körpersprache und kleinste Reaktionen werden analysiert - und schnell entstehen die ersten Verdächtigungen. Ein Spielender fällt dabei besonders mit seinen messerscharfen Analysen auf. Doch sein offensives Auftreten sorgt auch für Misstrauen: Würde ein echter Dorfbewohner sich am ersten Tag so deutlich positionieren?
