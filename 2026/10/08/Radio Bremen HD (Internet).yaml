- eventId: 1576606
  start: 2026-10-08T10:25:00Z
  stop: 2026-10-08T11:10:00Z
  title: In aller Freundschaft (321)
  subtitle: Auf eigenes Risiko
  description: Gerd Franke erhält von Sarah Marquardt den Auftrag, Renovierungsarbeiten in dem von ihr bewohnten Haus durchzuführen. Ohne Wissen ihrer Nachbarn ist sie seit Kurzem Miteigentümerin und strebt im Zuge der Sanierung eine Mieterhöhung an. Gerd Franke ist ein alter Freund von Ottmar Wolf, dem Hausmeister der Sachsenklinik. Während der Bauarbeiten stürzt der Handwerker und bricht sich das Fersenbein. Eine von Doktor Stein angeratene Operation und Therapie lehnt er kategorisch ab. Als Ottmar ihn von der Notwendigkeit des Eingriffs überzeugen will, offenbart sein Freund ihm, dass er aus seiner privaten Krankenversicherung geflogen ist.
- eventId: 1576839
  start: 2026-10-08T11:10:00Z
  stop: 2026-10-08T12:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (264)
  subtitle: Aufatmen
  description: Gewissenhaft bereitet sich Dr. Ben Ahlbeck auf die anstehende Lungentransplantation der 17-jährigen Luise Heuser vor. Das Mädchen leidet seit ihrer Geburt unter einer schweren Krankheit und die Transplantation ist ihre einzige Chance. Für Ben ist es die Möglichkeit, sich mal wieder zu beweisen und sein Portfolio für eine neu ausgeschriebene Stelle zu erweitern. Als Freundin und Kollegin Julia Berger auch an der Operation teilnimmt, dämpft das Bens Stimmung. Beide arbeiten souverän zusammen. Doch schnell kommt es nicht nur zu Unstimmigkeiten zwischen Ben und Julia, sondern auch zwischen Luisa und ihrer Mutter Inka Heuser!
  ageRating: 12
- eventId: 1577269
  start: 2026-10-08T12:00:00Z
  stop: 2026-10-08T13:00:00Z
  title: die nordstory
  subtitle: 24 h Warnemünde - Das Ostseebad, das niemals schläft
  description: 'Die Dokumentation erzählt, was den meisten Urlaubsgästen verborgen bleibt: Wer arbeitet eigentlich, während andere Urlaub machen? In einem 24-Stunden-Porträt begleitet der Film die Menschen, die Warnemünde Tag und Nacht am Laufen halten, vom Strandvogt über den Kreuzfahrtmanager bis zur Schaustellerin und den Strandreinigern. Neugierde erzeugt auch der Ort selbst: der gigantische Sandstrand, die kleinen Fischerkaten, die großen Kreuzfahrtpötte, Leuchtturm, Teepott, Alter Strom. Warnemünde ist zwar nicht das älteste Seebad an der Ostseeküste, aber sicher das turbulenteste.'
