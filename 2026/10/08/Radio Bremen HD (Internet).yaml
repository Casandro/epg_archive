  subtitle: 'Gast: Rosalie Thomass, Schauspielerin und Drehbuchautorin'
  description: "Rosalie Thomass kommt mit der Bestsellerverfilmung\n\"Lügen über meine Mutter\" ins Studio, für die sie nicht nur die Hauptrolle der Cornelia übernommen, sondern auch das Drehbuch geschrieben hat. Auf dem Roten Sofa spricht die Schauspielerin über die große Liebe zwischen Mutter und Kind, über weibliche Selbstbestimmung und darüber, wofür sie ihre eigene Mutter bewundert. \nKünftig wird es für die 39-Jährige besonders spannend: Sie ermittelt als neue Kriminalhauptkommissarin Emilia Rathgeber im Franken-\"Tatort\"."
