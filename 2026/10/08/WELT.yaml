  title: Geniale Maschinen - Mega-Transporter
  subtitle: Geniale Maschinen - Mega-Transporter
  description: 'Globaler Handel ist die Basis des modernen Lebens, zahlreiche Alltagsgegenstände werden importiert. Um die gewaltigen Massen Frachtgüter zu befördern, werden die größten beweglichen Maschinen der Welt genutzt: Riesentransporter. Volvo, führender Hersteller von Kraftfahrzeugen, entwickelte den FH16 750. Dieser 44 Tonnen schwere LKW kann extrem schwere Lasten bewegen und ersetzt über 30 typische Sattelschlepper. Weitere Transporter in dieser Sendung: Frachtschiff Ever Ace und Güterzug FLXdrive.'
  widescreen: true
