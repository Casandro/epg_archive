    George Gershwin: "An American in Paris" (Symphonieorchester des Bayerischen Rundfunks: Lorin Maazel); Antonín Dvorák: Serenade d-Moll, op. 44 (Bläsersolisten des Symphonieorchesters des Bayerischen Rundfunks); Max Bruch: Romanze F-Dur, op. 85 (Jean Rieber, Viola; Symphonieorchester des Bayerischen Rundfunks: Jan Koetsier); Robert Schumann: "Kinderszenen", op. 15 (Matthias Kirschnereit, Klavier); Tomás Luis de Victoria: "Missa pro victoria" (Chor des Bayerischen Rundfunks: Howard Arman); Eduard Künneke: Serenade (Münchner Rundfunkorchester: Ernst Theis)

    2.

    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    George Gershwin: "An American in Paris" (Symphonieorchester des Bayerischen Rundfunks: Lorin Maazel); Antonín Dvorák: Serenade d-Moll, op. 44 (Bläsersolisten des Symphonieorchesters des Bayerischen Rundfunks); Max Bruch: Romanze F-Dur, op. 85 (Jean Rieber, Viola; Symphonieorchester des Bayerischen Rundfunks: Jan Koetsier); Robert Schumann: "Kinderszenen", op. 15 (Matthias Kirschnereit, Klavier); Tomás Luis de Victoria: "Missa pro victoria" (Chor des Bayerischen Rundfunks: Howard Arman); Eduard Künneke: Serenade (Münchner Rundfunkorchester: Ernst Theis)

    2.03  Das ARD-Nachtkonzert (II)

    Joseph Haydn: Violoncellokonzert D-Dur, Hob. VIIb/2 (Jean-Guihen Queyras, Violoncello; Rundfunk-Sinfonieorchester Berlin: Marek Janowski); Komitas: "Armenische Miniaturen" (Ensemble Esperanza); Claude Debussy: Nocturnes (La Maîtrise de Radio France; Orchestre Philharmonique de Radio France: Mikko Franck); Joseph Rheinberger: Sonate Es-Dur, op. 178 (Johannes Ritzkowsky, Horn; Oliver Triendl, Klavier); Franz Vinzenz Krommer: Flötenkonzert G-Dur, op. 30 (Peter-Lukas Graf, Flöte; English Chamber Orchestra)

    4.03  Das ARD-Nachtkonzert (III)

    Florence Price: Klavierkonzert d-Moll (Jeneba Kanneh-Mason, Klavier; Chineke! Orchestra: Leslie Suganandarajah); Luigi Boccherini: Gitarrenquintett D-Dur (Pepe Romero, Gitarre; Academy Chamber Ensemble); Carl Stamitz: Konzert G-Dur (Ana de la Vega, Flöte; Ramón Ortega Quero, Oboe; Trondheimer Solisten: Geir Inge Lotsberg)

    5.03  Das ARD-Nachtkonzert (IV)

    Henry Charles Litolff: Klavierkonzert Nr. 3 Es-Dur, Presto (Peter Donohoe, Klavier; BBC Scottish Symphony Orchestra: Andrew Litton); Johann Friedrich Fasch: Konzert D-Dur (Il Gardellino); Friedrich Witt: Sinfonie Nr. 1 B-Dur, Allegro vivace (Kölner Akademie: Michael Alexander Willens); Arnold Krug: Klavierquartett, Carneval, op. 16 (Linos Ensemble); Domenico Cimarosa: Klarinettenkonzert c-Moll (Heinz Holliger, Oboe d'amore; I Musici); Émile Waldteufel: "Trictrac", op. 181 (Staatliche Slowakische Philharmonie Kosice: Alfred Walter)
