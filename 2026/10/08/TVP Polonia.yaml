  title: Jerzy Buzek. Siła marzeń
  description: |-
    Tytuł oryginalny: Jerzy Buzek. Siła marzeń
    PL, 2026
    Reżyseria: Andrzej Buchowski
    Film jest opowieścią o realizacji marzeń i przekraczaniu granic: geograficznych, językowych, religijnych, kulturowych. I o jednej, której Jerzy Buzek nigdy nie przekroczył - granicy przyzwoitości. Był szefem bodaj najbardziej zwaśnionego wewnętrznie rządu III RP. Na przełomie XX i XXI wieku Polską rządziła koalicja Akcji Wyborczej Solidarność, w skład której wchodziło ponad 30 małych ugrupowań, oraz Unii Wolności. Odporność premiera codziennie wystawiana była na próbę.
  ageRating: 12
