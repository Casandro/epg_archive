  title: Brod - tvrđava i grad, dokumentarni film
  subtitle: ' '
  description: 'U povijesti Brod je proživljavao sudbinu mnogih hrvatskih gradova kojima su tijekom duljih razdoblja vladali tuđinci. Potrebe i težnje naroda bile su ograničavane i usmjeravane prema njihovim, tuđinskim interesima i ciljevima, i to od onih davnih rimskih vremena pa do devedesetih godina prošlog stoljeća od kada brodska tvrđava postaje najveći spomenik kontinentalne Hrvatske i ujedno spomenik nulte kategorije.  Scenarist i urednik: Branko Dopuđa Snimatelji: Damir Bednjanec i Dragan Ruljančić Montažer: Mirko Kremenić Producent: Anto Jurić Redateljica: Ljiljana Mandić'
