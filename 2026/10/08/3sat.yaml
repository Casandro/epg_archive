  title: Söhne der Wüste (1/3)
  subtitle: Durch die Atacama
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Atacama zwischen Chile, Bolivien und Peru ist die größte Wüste des amerikanischen Kontinents und die trockenste der Erde. Der österreichische Forscher Thaddäus Haenke erkundete sie.

    Zur Zeit der Französischen Revolution macht er sich auf den Weg nach Südamerika. Im Auftrag der spanischen Krone soll er die Tier- und Pflanzenwelt der unbekannten Landschaft am Rande der Anden erforschen. Die Dokumentation folgt seinen Spuren in der Wüste Atacama.
    HD-Produktion
- eventId:
  - 978880
  - 980590
  start: 2026-10-08T01:55:00Z
  stop: 2026-10-08T02:40:00Z
  title: Söhne der Wüste (2/3)
  subtitle: Durch die Sahara
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mitte des 19. Jahrhunderts durchquert der 29-jährige Hamburger Ethnologe und Botaniker Heinrich Barth als erster Europäer die Sandwüste und erreicht die goldene Stadt Timbuktu am Fluss Niger.

    In fünf Jahren legt die Expedition über 15.000 Kilometer zurück. Barth sammelt auf Tausenden von Notizbuchseiten Informationen über Geologie und Ethnologie, über die Pflanzen- und Tierwelt der Wüste. Der Film folgt den Spuren der Forscher durch die Sahara.
    HD-Produktion
- eventId:
