  title: 'WeltWeit: Dauerbrenner Plastikmüll. Wer zahlt den Preis?'
  description: |-
    Rund 400 Millionen Tonnen Plastikmüll fallen jährlich weltweit an, nur ein sehr kleiner Teil davon wird recycelt. Auch Österreich ist weit davon entfernt, die Vorgabe der EU zu erfüllen.

    Die Einführung des Einwegpfands auf Flaschen und Dosen Anfang 2025 zeigte positive Effekte. Größtes Problem beim Recycling: Es gibt hunderte verschiedene Kunststoffsorten, deshalb muss Plastikmüll aufwendig sortiert werden, das ist teuer und auch fehleranfällig.
    HD-Produktion
