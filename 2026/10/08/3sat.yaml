  title: nano
  subtitle: Die Welt von morgen
  description: |-
    Deutschland 2026
    Nobelpreis Chemie - Einige Moleküle wie Aminosäuren existieren in zwei Varianten, wobei die eine immer das Spiegelbild der anderen ist. Lebende Organismen enthalten jedoch nur eines dieser Spiegelbilder. Wie diese chemische Asymmetrie entstehen kann, haben der Franzose Henri Kagan und der Japaner Kenso Soai erforscht. Dafür erhalten sie in diesem Jahr den Nobelpreis für Chemie.

    Neue Wege in der Traumatherapie - Der Umgang mit psychischen Traumata zählt zu den größten Herausforderungen in Medizin und Psychologie. Seit einigen Jahren erforschen Wissenschaftler und Therapeuten wieder das Potenzial lange verbotener psychoaktiver Substanzen wie MDMA, LSD und Psilocybin. Kontrollierte Studien untersuchen ihre mögliche Rolle in der Traumatherapie, unter anderem in Israel.

    Dead Internet Theory - Ist das Internet, wie wir es kennen, längst tot? Die "Dead Internet Theory" behauptet, dass immer mehr Inhalte nicht von Menschen, sondern automatisiert erstellt werden. Der Beitrag zeigt, wer darunter leidet, welche Folgen das für soziale Medien und die digitale Öffentlichkeit hat und welche Lösungsansätze diskutiert werden.

    Schwimmen macht schlau - Schon 20 Minuten Schwimmen bringen Körper und Geist in Bewegung. Das gelenkschonende Ganzkörpertraining stärkt Muskeln, Herz und Lunge, fördert die Durchblutung des Gehirns und kann Konzentration sowie Denkleistung unterstützen. Zudem hilft Schwimmen beim Stressabbau und kann die Stimmung nachhaltig verbessern.

    Moderation: Ingolf Baur
