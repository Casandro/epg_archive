  title: Söhne der Wüste (3/3)
  subtitle: Durch Gobi und Taklamakan
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In den 1920er-Jahren durchquert der schwedische Abenteurer Sven Hedin mit 60 Begleitern die Wüsten Gobi und Taklamakan auf der Suche nach einer Flugroute von China nach Europa.

    Dabei löst er auch das Rätsel der "Wandernden Seen von Lop Nor" inmitten der Wüste Taklamakan. Das Filmteam trifft auf seinen Spuren auf versunkene Mongolenstädte, kämpft sich durch Sandstürme und kreuzt die Pfade der Seidenstraße.
    HD-Produktion
