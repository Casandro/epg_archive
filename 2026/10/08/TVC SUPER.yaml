  title: 'Detektyw Candice: Niezawodny instynkt 3 (odc. 6)'
  subtitle: Candice zastępuje komisarz Attię, która jest na urlopie macierzyńskim. Musi zajmować się dokumentacją i formularzami zgłoszeń.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2015
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Samira Lachhab, Gaya Verneuil, Delphine Rich, Stéphane Blancafort
    Na cierpiącą od zawsze na fobię administracyjną Candice spada nieszczęście: komisarz Attia jest na urlopie macierzyńskim i zastąpić ją może tylko osoba najwyższa stopniem, czyli ona sama, komisarz Renoir. Odtąd Candice będzie musiała się zajmować całą dokumentacją i formularzami zgłoszeń. Kiedy próbuje sobie poradzić z tym koszmarem, jej zastępca chce, by uwierzyła, że on sam jest na wakacjach, podczas gdy w rzeczywistości ukrywa przed nią tajną misję.
