    Pip und Posy spielen Zirkus und Zac und Jamila wollen unbedingt mitspielen. Auch Frankie möchte gerne dabei sein. Sie befürchtet aber, keine eigene tolle Zirkusnummer anbieten zu können.

    Pip schlägt ihr vor, sie solle sich die Nummern der anderen anschauen und sich dann eine aussuchen. Er beginnt mit seiner Seiltanznummer, aber die kriegt Frankie gar nicht hin. Auch als Hula-Hoop-Akrobatin macht sie längst keine so gute Figur wie Jamila.

    Jonglieren, wie Zac es vorführt, will ihr auch nicht gelingen. Sie sieht bei allen Darbietungen einfach immer nur zum Kaputtlachen komisch aus. Frankie hat keine Lust mehr, Zirkus zu spielen. Da haben die Freunde eine tolle Idee: Das, was jeder Zirkus braucht, ist genau das, was Frankie besonders gut kann. Sie bringt die Leute zum Lachen wie ein Clown. ...
