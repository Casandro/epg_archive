    Pip und Posy haben Lebkuchenfiguren gebacken. Pip verputzt seine auf der Stelle. Posy findet ihr "Fräulein Knusperchen" aber so niedlich, dass sie lieber mit ihr spielen möchte.

    Leider ist so eine Lebkuchenfigur ziemlich zerbrechlich, und man muss besonders vorsichtig mit ihr umgehen. Was Pip schon nach kurzer Zeit so gar nicht mehr gefällt. Er ist sogar ein bisschen eifersüchtig auf Posys neue beste Freundin.

