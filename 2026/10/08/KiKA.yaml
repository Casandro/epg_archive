    Wie wird eine Zahnbürste gemacht?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Heute gibt es in den Lach- und Sachgeschichten viele spannende Dinge zu erleben. Tanja und André führen einen magischen Trick mit einem Zauberglas vor. Leckere Erdbeeren fallen spektakulär in eine Schüssel Milch - ganz langsam, in Zeitlupe. Ein Kind fährt mit seiner Mutter durch einen langen Tunnel, in dem sich Bürsten drehen und Wasser von der Decke spritzt. Wo die beiden wohl sind? Beim Monster ist heute Waschtag. Welches Tier sich waschen lässt, wird noch nicht verraten. Auch Jule, die sich eigentlich nie wäscht, braucht dringend ein Bad. Und zwei gute Freunde entdecken mitten in der Wüste einen blauen Stuhl. ...
