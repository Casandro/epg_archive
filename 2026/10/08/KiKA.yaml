  description: |-
    Haustiere - ja oder nein?!

    Sollte man Haustiere halten dürfen? Darüber diskutieren 6 Schüler und Schülerinnen in der vierten Folge der dritten Staffel logo! no.front.

    Für einige sind Hund oder Katze wie ein Familienmitglied. Für andere ist es absolut nicht in Ordnung, ein Tier in einer Wohnung zu halten. Werden Haustiere okay gehalten und können sie so ein artgerechtes Leben führen oder nutzt der Mensch die Haustiere aus?

    Die einen finden: Ja, es ist sinnvoll und gut ein Haustier zu haben und dass es denen auch gut geht. Andere sagen dagegen: Nein, Tiere gehören eigentlich immer in die Natur und nicht in eine Wohnung.

    Haustiere halten - Ja oder Nein?! Darüber diskutieren sechs Jugendliche im Pro- und Kontra-Format für Teens, logo! no.front. Moderiert wird die Debatte von Sherif Rizkallah.
    Moderation: Maral Bazargani, Sherif Rizkallah

