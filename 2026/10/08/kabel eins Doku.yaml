    Komplizen des Todes
    Dokumentation, USA 2022
    Altersfreigabe: ab 16
  description: |-
    Südkalifornien, Ende der Siebzigerjahre: Innerhalb weniger Monate werden zahlreiche junge Männer brutal ermordet aufgefunden. Die Ermittler tappen lange im Dunkeln, während die Opferzahl steigt und die Bevölkerung in Angst lebt. Doch nun werden Tonbandaufnahmen zugänglich, die über vier Jahrzehnte unter Verschluss lagen - Geständnisse des Serienmörders William Bonin, der glaubte, sie würden nie ans Licht kommen.

