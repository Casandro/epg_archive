  title: 'Der Freeway Killer: Das Böse spricht'
  subtitle: |-
    Wie es begann
    Dokumentation, USA 2022
    Altersfreigabe: ab 16
  description: |-
    Jahrzehntelang lagen sie unter Verschluss: Tonbandaufnahmen, in denen einer der grausamsten Serienmörder Amerikas seine Taten schildert - kalt, emotionslos, ohne jede Reue. Der Dokumentarfilm rekonstruiert die Mordserie, die Ende der Siebziger- und zu Beginn der Achtzigerjahre Südkalifornien in Schrecken versetzt. Zahlreiche junge Männer fallen William Bonin zum Opfer. Ermittler, Journalisten und Überlebende schildern ihre Erlebnisse.

    Regie: Anna Keel
