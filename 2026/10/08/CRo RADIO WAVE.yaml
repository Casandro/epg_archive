  title: Psycho
  description: Co o vztahu prozradí společná túra? Fenomén "alpských rozvodů" ukazuje, jak stres, únava, rozdílné tempo nebo zkušenosti mění partnerskou dynamiku. Karolína a Pavel rozebírají, proč náročná situace může vztah vyhrotit, ale také dvojici stmelit. (repríza)
