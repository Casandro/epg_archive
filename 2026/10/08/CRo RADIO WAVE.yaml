  title: Hotspot
  description: Čelist, lícní kosti, obočí. Sítě vám během pár vteřin vysvětlí, co je na vašem obličeji špatně, a hned nabídnou řešení. Od lymfatické masáže přes botox až po výplně. S autorkou série Ztělesnění Adélou Šponerovou mluvíme o tom, proč ze svého těla děláme seznam úkolů, kdo na naší nespokojenosti vydělává a co všechno nám sociální sítě dokázaly namluvit o vlastním těle. Dej si novou epizodu Hotspotu!
