  title: Špína
  description: Tento týden ve Špíně po delší době sestoupíme do hlubin jednoho ze subžánrů nezávislé scény. Harsh ambient sice nemá jasně dané hranice, naopak jednotlivé interpretstvo balancuje v jeho rozmlžených mokřinách. Stěžejní jsou pro něj abstraktní, zadumané plochy, fieldrecordings i nekompromisní noisové pasáže a občas celkem bizarně vystupující představitelé. Moderují Jan Šamánek a Judita Císařová.
