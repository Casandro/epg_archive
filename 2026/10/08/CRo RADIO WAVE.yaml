  title: Čelisti
  description: V havlovském speciálu Čelistí vyhlášený Oddíl B Občanského fóra Aleš, Vítek a Tomák konečně předvede skutečnou Moc bezmocných. Patřil Havel mezi vyhlášené Šipkaře? Kdy a s kým prožil svůj Poslední vrchol? Byl větší Milovník, než bojovník? A stávala jeho chalupa na Hrádečku na západ, nebo Na východ od ráje? Pravda a láska / lež a nenávist / kuna. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal.
