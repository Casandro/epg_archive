- eventId: 1536517
  start: 2026-10-08T16:00:00Z
  stop: 2026-10-08T17:00:00Z
  title: Čelisti
  description: V havlovském speciálu Čelistí vyhlášený Oddíl B Občanského fóra Aleš, Vítek a Tomák konečně předvede skutečnou Moc bezmocných. Patřil Havel mezi vyhlášené Šipkaře? Kdy a s kým prožil svůj Poslední vrchol? Byl větší Milovník, než bojovník? A stávala jeho chalupa na Hrádečku na západ, nebo Na východ od ráje? Pravda a láska / lež a nenávist / kuna. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal.
- eventId: 1536518
  start: 2026-10-08T17:00:00Z
  stop: 2026-10-08T17:30:00Z
  title: Psycho
  description: Co o vztahu prozradí společná túra? Fenomén "alpských rozvodů" ukazuje, jak stres, únava, rozdílné tempo nebo zkušenosti mění partnerskou dynamiku. Karolína a Pavel rozebírají, proč náročná situace může vztah vyhrotit, ale také dvojici stmelit. (repríza)
