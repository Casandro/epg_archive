  title: Auf Sindbads Spuren - große Gelbflossenthune im Oman
  subtitle: Auf Sindbads Spuren - große Gelbflossenthune im Oman
  description: Die Redaktion des Global Angler Magazins reiste Anfang 2019 nach Salalah in den Süden des Omans um ihr Glück auf große Gelbflossenthune zu erleben. Neben einer wirklich traumhaften Fischerei erlebten sie auch noch einen wunderschönen Urlaub in diesem noch nicht vom Tourismus überlaufenen Land. Ihrer Meinung nach kann man noch von einem Geheimtipp sprechen. DE 2019
