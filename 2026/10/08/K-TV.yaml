  subtitle: Dokumentation
  description: Die Ursprünge der Wallfahrt Fährbrück gehen zurück auf das Benediktinerkloster Neustadt am Main. Die Benediktiner führten dort auch die Verehrung des heiligen Papstes Gregor des Großen ein. Der sogenannte Gregoriusstsein in der Wallfahrtskirche Fährbrück ist sagenumwoben. Ursprünglich soll es sich um einen Opferstein handeln. Dann um einen Taufstein, auf dem der heilige Kilian, der Bistumspatron Würzburgs, getauft haben soll. Über Jahrhunderte bezeugten Gläubige die Heilkraft des Wassers aus diesem Stein.
