  title: Franziskus - Das Mysterium seiner Wundmale
  subtitle: Dokumentation
  description: |-
    Der erste Mensch der Geschichte, der die Wundmale Christi am eigenen Leib trug.
    1224: Franziskus zieht sich auf den Berg La Verna zurück - erschöpft, krank, fast blind, zutiefst zerrissen zwischen seiner Gemeinschaft und seinem Ideal der Armut. Vierzig Tage fastet er in völliger Zurückgezogenheit und ringt mit inneren Kämpfen. Der Teufel selbst greift ihn an einem Felsvorsprung an und will ihn in die Tiefe hinabstürzen. Auf dem Höhepunkt dieser Nacht der Seele erscheint ihm ein Engel mit sechs Flügeln - Christus, der Gekreuzigte. Er durchglüht Franziskus mit der gekreuzigten Liebe. Freude und Schmerz zugleich überwältigen ihn. Von diesem Moment an trägt er die Wunden des Gekreuzigten - an Händen, Füßen, an seiner Seite.
    Ein Zeugnis über den ersten Menschen der Geschichte, der die Wundmale Christi trug - gedreht auf dem schroffen und heiligsten Berg der Franziskaner, La Verna. Ein Ort, so heilig, dass selbst Michelangelo ihn in der Sixtinischen Kapelle verewigt hat. Eine Dokumentation von Athinea Andryszczak.
