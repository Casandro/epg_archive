  title: grenzenlos
  subtitle: Indonesien - Flores - Priester für die Welt / Dokumentation
  description: In keinem Land der Erde leben mehr Muslime als in Indonesien. 200 Millionen Indonesier bekennen sich zum Islam. Umso erstaunlicher ist, dass auch nirgendwo auf der Welt der Nachwuchs an katholischen Priestern größer ist als in diesem Land. Woran das liegt, dass besonders auf der indonesischen Insel Flores so viele junge Männer Priester werden wollen, das erzählt diese "grenzenlos" Episode.
