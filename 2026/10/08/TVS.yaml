  title: 'Rosamunde Pilcher: Odziedziczone szczęście 1 (odc. 144)'
  subtitle: Nelly jest świadkową na ślubie swojej siostry Eve i jej narzeczonego Billa. Świadkiem Billa jest jego najlepszy przyjaciel Leo.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Geerbtes Glück
    DE, 2018
    Reżyseria: Stefan Bartmann
    Występują: Maxi Warwel, Florian Odendahl, Roman Knižka, Götz Schubert, Carin C. Tietze, Kim Sarah Brandts
    Nelly jest świadkową na ślubie swojej siostry, Eve, i jej narzeczonego, Billa. Świadkiem jest najlepszy przyjaciel Billa, Leo. Młodzi chętnie by zeswatali tę dwójkę. Ci jednak spotkali się już wcześniej i czują wzajemną antypatię. Eve ma niespodziankę dla Nelly i swojego ojca, Tony'ego. Zaprosiła na ślub i wesele kolumbijską matkę obu dziewcząt, Sofię, która przed laty zostawiła swojego męża z dwiema córkami. Wszyscy biorą się jednak w garść, ponieważ nie chcą psuć ślubu ciężarnej Eve.
  ageRating: 12
  genre:
  - '22'
- eventId: 1413689
  start: 2026-10-08T19:50:00Z
  stop: 2026-10-08T21:35:00Z
  title: 'Rosamunde Pilcher: Spotkanie klasowe 1 (odc. 130)'
  subtitle: Sandra Cale wybiera się w rodzinne strony na spotkanie maturzystów. Niespodziewanie spotyka Luke'a, dawnego kolegę z klasy.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Nie wieder Klassentreffen
    DE, 2017
    Reżyseria: Hans-Jürgen Tögel
    Występują: Denise Zich, Patrik Fichte, Jens-Peter Nünemann, Katja Woywood, Diana Körner, John Friedmann
    Konsultantka biznesowa, Sandra Cale, po raz pierwszy od 20 lat wybiera się w rodzinne strony na spotkanie maturzystów. Prosi swojego szefa Petera, z którym łączy ją romans, by towarzyszył jej w tej podróży. Mężczyzna obiecuje, że opuści żonę, ale tuż przed przyjazdem do Kornwalii zmienia decyzję. Sandra niespodziewanie spotyka Luke'a, dawnego kolegę z klasy. Okazuje się, że oboje byli kiedyś w sobie zakochani i nawet o tym nie wiedzieli.
  genre:
  - '22'
