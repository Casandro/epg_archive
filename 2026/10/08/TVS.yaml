  title: 'Wydział kryminalny Kitzbühel: odc.8'
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2017) odc.8
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Christine Klein, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair
    Trojgu studentów z uczelni w Kufstein udaje się dokonać przełomowego wynalazku w dziedzinie inżynierii genetycznej. Wkrótce należąca do zespołu mikrobiolog Yasmin Stackler zostaje zastrzelona. Nie wiadomo, czy została zabita przez jednego z kolegów, czy może stanęła na drodze zawistnemu pracownikowi uczelni.
    Reżyser: Rainer Hackstock
    Od lat: 12
