  description: |-
    Ein Patient mit einer besonderen Verletzung kommt für Dr. Niklas Ahrend und Assistenzärztin Eva Ludwig ins Klinikum. Heinz Vogt hat sich eine Pfählungsverletzung zugezogen - durch eine Glocke! Die Ärzte müssen sofort notoperieren. Als Heinz aufwacht, gilt seine einzige Sorge dem Verbleib seiner Glocke. Doch die ist in der Hektik zwischen Notaufnahme und OP verschwunden.
    Ben Ahlbeck ist unterdessen ebenfalls auf der Suche. Er schaut nach einem geeigneten Haus für seine Familie.
