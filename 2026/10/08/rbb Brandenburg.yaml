  description: Die junge Vietnamesin Lan Diep Nguyen wird tot aus der Trave geborgen. Sie trägt auffällig lange Fingernägel, und ihr Gesicht weist frische Spuren einer Säureverätzung auf. Wie sich herausstellt, kam sie mit einer gefährlichen Chemikalie in Kontakt, die trotz Verbots in manchen Kosmetiksalons verwendet wird. Finn und Lars ermitteln, dass die Tote ohne Arbeitserlaubnis im vietnamesischen Nagelstudio "Da Nang" gearbeitet hat. Dort zog sie sich auch ihre schweren, aber nicht tödlichen Verletzungen zu. Wurde sie danach kaltblütig in den Fluss geworfen, um einen Arbeitsunfall zu vertuschen?
