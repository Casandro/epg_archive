  description: 'Bei den Uganda-Giraffen im Tierpark gibt es in diesem Jahr wieder zweifachen Nachwuchs: Das Giraffenkind Jule und ihre 20 Tage jüngere Halbschwester Dorle. Während Dorle bereits am frühen Morgen mit ihrer Mutter Inge auf die große Außenanlage darf, muss sich Jule noch ein wenig gedulden. Für sie steht erst noch eine Flaschenfütterung auf dem Plan, denn Mutter Jette hat leider keine Milch für ihre kleine Tochter. Morgens und abends bekommt Jule deshalb von Tierpfleger Enrico Rödiger eine große Portion Milch.'
