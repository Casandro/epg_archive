  title: Fang des Lebens - Der gefährlichste Job Alaskas
  subtitle: Der Störfaktor
  description: |-
    Die Schneekrabben-Saison ist eröffnet! Und auf der Time Bandit fliegen die Fetzen: Decksmann Danny Chiu pöbelt wie wild die Nachwuchs-Krabbenfischer an und terrorisiert mit seinem aggressiven Gehabe die gesamte Crew. Als der Störenfried dann auch noch droht, den Captain bei der Küstenwache anzuschwärzen, eskaliert die Lage endgültig. Kapitän Johnathan Hillstrand zieht alle Register und steuert schnurstracks den nächsten Hafen an, um den unberechenbaren Wirrkopf von Bord zu werfen. Deutlich besser ist die Stimmung dagegen auf der Cape Caution: "Wild" Bill Wichrowski und seine Männer ziehen prall gefüllte Körbe an Deck! Doch die Freude ist nur von kurzer Dauer. Denn ein irreparabler Schaden zwingt das Schiff in die Knie.
    USA 2015
  widescreen: true
