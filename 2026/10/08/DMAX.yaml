  title: Fang des Lebens - Der gefährlichste Job Alaskas
  subtitle: Der junge Kapitän
  description: |-
    Jake Anderson blickt großen Herausforderungen entgegen: Der frisch gebackene Papa wird ab sofort das Kommando auf der Saga übernehmen. Nach 17 Jahren harter Schule auf hoher See darf sich der Krabbenfischer nun endlich Kapitän nennen! Ob Lehrmeister Sig Hansen seinem Zögling alle Tricks und Kniffe beigebracht hat, die einen echten Captain ausmachen, wird sich allerdings erst in den stürmischen Fluten der Beringsee zeigen. Auf der Time Bandit gibt es ebenfalls personelle Veränderungen: Pünktlich zum Start der Schneekrabben-Saison geht Greenhorn Amy Majors an Bord. Kann das Mädel den hartgesottenen Männern das Wasser reichen? Außerdem in dieser Folge: Die Crew der Cape Caution begleicht eine alte Rechnung - und kettet die Northwestern an der Kaimauer fest!
