  title: Goldfieber Down Under
  subtitle: Episode 2
  description: |-
    Abgelegen und schwer erreichbar: Gordon und Sebastian kämpfen sich im australischen Bundesstaat Queensland zum ersten Gold-Spot vor. Das Gelände im Daintree-Nationalpark ist steil, dicht bewachsen und kaum erschlossen. Für große Maschinen ist dort kein Durchkommen. Deshalb arbeiten die Männer am Flusslauf mit einem Detektor. 120 Kilometer südlich bereiten James, Roger und Stanley in einer Untertagemine eine Sprengung vor. Dieses Verfahren ist aufwendig - es kostet Zeit, Arbeit und Geld. Und ob dabei tatsächlich Edelmetall freigelegt wird, ist ungewiss.
    DEU 2026
