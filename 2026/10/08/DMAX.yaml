  title: Feuerwache 1 - Alarm in Ingolstadt
  subtitle: 24 Stunden auf der Feuerwache Ingolstadt
  description: |-
    Der Dienstantritt ist morgens um sieben Uhr. Die Feuerwehrleute der Wachabteilung 2 sind anschließend 24 Stunden lang einsatzbereit, um in Ingolstadt Brände zu löschen und Menschen aus Notlagen zu befreien. Neben den Routineaufgaben steht an diesem Tag auch eine Übung an: die Rettung einer eingeklemmten Person aus einem Pkw mit schwerem Gerät. Doch dann wird es ernst - bei einem Verkehrsunfall auf der A 9 gibt es einen Verletzten. In einer Wohnung hat zudem ein Rauchmelder ausgelöst. Besteht tatsächlich Gefahr oder handelt es sich um einen Fehlalarm?
    DEU 2026
  widescreen: true
