  title: Kingdom Manifesto - Manifest des Himmelreichs
  subtitle: Gesegnet sind die Ungesegneten
  description: |-
    Das heutige  Thema behandelt die "Seligpreisungen" in Matthäus 5. Hier sagt Jesus etwas Radikales, Revolutionäres, Bahnbrechendes und Unerwartetes zu den Juden. Er nennt in diesem Bibelabschnitt die Menschen, die "qualifiziert" sind, Bürger seines Reiches zu werden: geistlich Arme, Trauernde, Sanftmütige, die nach Gerechtigkeit hungern, die reines Herzens sind, Friedensstifter und die, die um seinetwillen verfolgt werden. Ty Gibson und David Asscherick zeigen die Entwicklung der Seligpreisungen auf, denn jede Seligpreisung ist eine natürliche Folge auf die Vorhergehende.

