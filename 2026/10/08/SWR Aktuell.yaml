  title: SWR Aktuell Langstrecke
  description: "14:00\n11KM: der tagesschau-Podcast\nSchikanen und Übergriffe: Sexismus in der Medizin\nWer in Deutschland im OP steht, entscheidet nicht nur über Leben und Tod, sondern auch über Karrieren. Und meistens sind das: Männer. Lea Struckmeier von team.recherche berichtet in dieser Folge, wie Ärztinnen in der Ausbildung klein gehalten werden, warum sexuelle Übergriffe von Ärzten offenbar keine Einzelfälle sind. Und welchen Einfluss die Buddykultur in der Medizin auf die Sicherheit von Patientinnen und Patienten haben kann.   \nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/\n\n14:30\nWeltspiegel Podcast - Kann Netanjahu die Wahl in Israel verlieren?\nAm 27. Oktober wählt Israel ein neues Parlament: Kann Premierminister Benjamin Netanjahu nach Jahren des Krieges, dem Terrorangriff der Hamas vom 7. Oktober und einer tiefen Spaltung des Landes tatsächlich abgewählt werden? Würde sich Israels Politik unter einer neuen Regierung grundlegend verändern? Und welche Rolle spielt die arabische Community in Israel und die Zukunft Gazas bei der Wahl? Darüber spricht Host Natalie Amiri mit ARD-Korrespondent Björn Dake in Tel Aviv und Ofer Waldman von der Heinrich-Böll-Stiftung in Israel in einer neuen Folge vom Weltspiegel Podcast.\nHost Natalie Amiri\nGäste ARD-Korrespondent Björn Dake, TLV / Ofer Waldman, Heinrich-Böll-Stiftung lL\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/"
