- eventId: 920004
  start: 2026-10-08T16:30:00Z
  stop: 2026-10-08T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Organisierte Kriminalität in Europa (1/3) - Die Kriminellen
  description: |-
    Von Beate Krol
    In der EU sind laut Europol 821 kriminelle Netzwerke aktiv. Die gefährlichsten von ihnen sollen etwa 25.000 Mitglieder haben. Was sind das für Menschen, die mit Drogen, Menschen und Waffen in Milliardenhöhe handeln? Die Jugendliche als Killer anheuern, Konkurrenten foltern, Minister und Staatsanwälte bedrohen? Nach außen inszenieren sie sich oft als eiskalte Typen, die mit Geld und Gewalt prahlen. Ehemalige Mitglieder und Ermittler kennen die andere Seite: permanente Angst vor Verfolgung, faschistoide Züge, krankhafte Allmachtsfantasien. Gleichzeitig arbeiten organisiert Kriminelle hochprofessionell. (SWR März 2026)
    (Teil 2: Organisierte Kriminalität in Europa - Die vielen Komplizen, Freitag, 9. Oktober 2026, 8.30 Uhr)
- eventId: 920005
  start: 2026-10-08T17:00:00Z
  stop: 2026-10-08T18:00:00Z
  title: Der Tag
  description: Das Buch - es war schon oft totgesagt und doch lebt es noch immer, allerdings in einer immer digitaleren Welt. Autorinnen und Autoren haben Millionen Follower bei Instagram, Bücher werden nur wegen TikTok-Empfehlungen Bestseller und Verlage verklagen KI-Firmen, weil der Chatbot ganze Kinderbücher kopiert hat. Und das alles in einer Zeit, in der sowieso weniger Menschen lesen - besonders heftig ist der Rückgang bei den 10- bis 15-Jährigen. Ist die neue Generation zu abgelenkt, um überhaupt zum Buch zu greifen? Und wie sieht die Zukunft des Buches aus?
  subtitle: Das Buch - digitalisiert, KI-generiert, bedroht?
