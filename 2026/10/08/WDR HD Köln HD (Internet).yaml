- eventId: 1575033
  start: 2026-10-08T08:25:00Z
  stop: 2026-10-08T09:10:00Z
  title: Garten & Lecker (3/6)
  subtitle: Himbeertraum und Gemüseglück
  description: Zur dritten Gartenparty geht es nach Baden-Württemberg. Selber Anbauen und Ernten ist Dajana Schmitts Leidenschaft. In Neuhausen ob Eck, am südlichen Ausläufer der Schwäbischen Alb, versorgt die fünffache Mutter ihre Familie mit Obst und Gemüse aus dem rund 3.000 qm großen Familiengarten. Zur Vorspeise serviert Dajana Pflücksalate mit Rote Beete-Carpaccio, gefüllten Kohlrabi, Zitronengurke und Kapuzinerkresse. Als Hauptgang gibt es Rinderrouladen mit Spätzle, Wurzelgemüse und Selleriepüree und zum Dessert eine Himbeermousse mit Vanilleparfait, Sesamchip, Himbeermacarons und Himbeerspiegel.
- eventId: 1575797
  start: 2026-10-08T09:10:00Z
  stop: 2026-10-08T09:55:00Z
  title: 'Expedition in die Heimat: Heidelberg für Verliebte'
  subtitle: 'Moderation: Annette Krause'
  description: 'Das Heidelberger Schloss - ein Inbegriff der Romantik: nicht nur für Dichtergrößen aus längst vergangener Zeit, sondern noch heute für Millionen von Besucher:innen aus aller Welt. SWR-Moderatorin Annette Krause macht sich auf die Suche nach pulsierenden Liebesgeschichten, amourösen Orten und herzerwärmenden Plätzen der Universitätsstadt: Heidelberg ist eine Stadt für Verliebte und zum Verlieben. Kein Wunder, dass viele ihr Herz an sie verloren haben.'
- eventId: 1576356
  start: 2026-10-08T09:55:00Z
  stop: 2026-10-08T10:45:00Z
  title: Elefant, Tiger & Co.
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    Heute gibt es die erste frische Luzerne des Jahres und alle sind begeistert. Es bricht ein wahrer Ansturm auf das frische Grün aus. Egal, ob Okapi, Giraffe oder Zebra - die Tiere futtern den kulinarischen Leckerbissen nur so weg.
    Auf der Hyänenanlage von Neuzugang Hondo beginnt der Tag für Jörg Gräser nicht gerade mit einer appetitlichen Arbeit - putzen! Um Hondo zu beschäftigen, macht er die neue Anlage gleich wieder schmutzig - mit Pferdeäpfeln. Aber so richtig interessiert sich Hondo nicht für den Mist.
    Bei den Tapiren gab es Ärger. Deshalb hat Tierpfleger Timo Gessner die beiden Streithälse nun voneinander getrennt.
