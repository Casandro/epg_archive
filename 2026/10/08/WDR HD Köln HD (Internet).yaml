- eventId: 1572343
  start: 2026-10-08T05:40:00Z
  stop: 2026-10-08T06:25:00Z
  title: In aller Freundschaft (1027)
  subtitle: Vatergefühle
  description: |-
    Kai Hoffmann liegt immer noch im künstlichen Koma. Nachdem ein erster Versuch, die Sedierung zu beenden, gescheitert war, ist der nächste Anlauf für Maria Weber nun mit großer Angst verbunden. Nach langem Warten und Bangen reagiert er endlich auf die Ansprache des Ärzteteams. Maria ist überglücklich, doch Kais Reaktion in dieser Situation verläuft anders als gedacht.
    Gerhard "Gerry" Ost ist es als Oberhaupt einer Schaustellerdynastie gewohnt, die Autorität auf dem Platz zu sein und keine Schwäche zu zeigen. So hat er auch eine Nierenerkrankung vor seiner Tochter Melody verheimlicht und die Behandlung verschleppt.
- eventId: 1572892
  start: 2026-10-08T06:25:00Z
  stop: 2026-10-08T07:10:00Z
  title: In aller Freundschaft (1028)
  subtitle: Herz und Herd
  description: |-
    Jakob Heilmann überrascht seinen Vater Roland mit der Bitte um ein Darlehen, um sein eigenes Projekt im Restaurant, das er mit seiner Freundin Samira betreibt, zu verwirklichen. Die ist allerdings kein Fan der Unternehmung. Die finanzielle Situation ist bereits angespannt und sie ist in der neunten Woche schwanger. Als sie am Telefon mit Jakob streitet, wird sie von einem Lieferwagen angefahren.
    Claudia Kössler sucht, von starken Bauchkrämpfen geplagt, abermals die Sachsenklinik auf. Vor wenigen Wochen war sie schon einmal wegen einer akuten Divertikulitis hier und wurde von Dr.Demir operiert. Ein Behandlungsfehler?
