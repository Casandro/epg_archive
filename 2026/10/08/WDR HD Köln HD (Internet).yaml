  stop: 2026-10-08T13:10:00Z
  title: Rentnercops (40)
  subtitle: Wer einmal lügt ...
  description: Melanie Thorwardt bezichtigt ihren Schwager des Mordes an ihrer Schwester, die angeblich Selbstmord begangen hat. Als Beweis legt sie die Buchung einer Reise für sich und ihre Schwester vor, die sie wenige Tage nach dem Selbstmord gemeinsam hätten antreten wollen. Melanie behauptet, ihre Schwester habe sich von ihrem Mann Marco trennen wollen, weshalb der sie umgebracht und das Ganze als Selbstmord getarnt habe. Vicky veranlasst daraufhin Dr. Schmidt, sich die Tote noch einmal genauer anzusehen. Und in der Tat, neben dem Schlafmittel findet sie noch Spuren von Betablockern und Botox.
  genre:
  - '16'
- eventId: 1579141
  start: 2026-10-08T13:10:00Z
  stop: 2026-10-08T14:00:00Z
  title: Rentnercops (41)
  subtitle: Fossi
  description: In einem Wohnmobil, das seit Wochen falsch geparkt an den Poller Wiesen steht und mit Knöllchen übersät ist, wird die Leiche einer Frau gefunden. Vicky, die mit Edwin und Dr. Schmidt als Erste vor Ort ist, erkennt in der Toten ihre ehemalige Schulkameradin "Fossi", Christina Möbius. Edwin und Günter finden heraus, dass Christina nicht das war, was sie ihrem Mann und den Nachbarn gegenüber behauptet hat.
  ageRating: 12
