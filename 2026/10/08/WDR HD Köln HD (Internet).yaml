- eventId: 1572343
  start: 2026-10-08T05:40:00Z
  stop: 2026-10-08T06:25:00Z
  title: In aller Freundschaft (1027)
  subtitle: Vatergefühle
  description: |-
    Kai Hoffmann liegt immer noch im künstlichen Koma. Nachdem ein erster Versuch, die Sedierung zu beenden, gescheitert war, ist der nächste Anlauf für Maria Weber nun mit großer Angst verbunden. Nach langem Warten und Bangen reagiert er endlich auf die Ansprache des Ärzteteams. Maria ist überglücklich, doch Kais Reaktion in dieser Situation verläuft anders als gedacht.
    Gerhard "Gerry" Ost ist es als Oberhaupt einer Schaustellerdynastie gewohnt, die Autorität auf dem Platz zu sein und keine Schwäche zu zeigen. So hat er auch eine Nierenerkrankung vor seiner Tochter Melody verheimlicht und die Behandlung verschleppt.
