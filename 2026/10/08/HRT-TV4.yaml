  title: Dan Hrvatskog Sabora
  subtitle: Dan Hrvatskoga sabora obilježava se kao spomendan na 8. listopada 1991. godine, kada je Hrvatski sabor jednoglasno donio Odluku o raskidu državnopravnih sveza s ostalim republikama i pokrajinama SFRJ.
  ageRating: 4
  genre:
  - '32'
  description: Dan Hrvatskoga sabora obilježava se kao spomendan na 8. listopada 1991. godine, kada je Hrvatski sabor jednoglasno donio Odluku o raskidu državnopravnih sveza s ostalim republikama i pokrajinama SFRJ. Sabor je utvrdio da Hrvatska više ne priznaje legitimnim ni jedno tijelo dotadašnje SFRJ niti ikakve pravne akte bivše federacije. Sjednica je održana u zgradi Ine u Šubićevoj ulici u Zagrebu zbog ratnih opasnosti i napada JNA na Banske dvore prethodnoga dana.
