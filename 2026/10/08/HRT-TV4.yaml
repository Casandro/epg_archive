  description: 'Iza diplomatskih poruka o sigurnijem, održivijem i otpornijem Mediteranu kriju se vrlo konkretni problemi - kako zaštititi vanjske granice Europe, osigurati energiju, sačuvati gospodarstvo, financirati obranu te odgovoriti na demografsko pražnjenje i klimatske promjene.  Jedno od pitanja je i kako Europska unija može imati veću geopolitičku težinu u vlastitom susjedstvu? Čelnici devet mediteranskih zemalja, okupljeni u Splitu, moraju uskladiti i interese o novom europskom proračunu, migracijama i proširenju.  Koliko će Pakt za Sredozemlje ostati prazna politička deklaracija, a koliko postati konkretan instrument europske politike? Gosti su: Gordan Grlić Radman, ministar vanjskih i europskih poslova izv. prof. dr. sc. Gordan Akrap, prorektor Sveučilišta obrane i sigurnosti "Dr. Franjo Tuđman", prof. dr. sc. Goran Bandov, Sveučilište u Zagrebu'
