  title: Musikclub Rock
  subtitle: mit Jochen Stöckle und Ingo Lege
  description: 'Laut und ohne Limit geht es im Musikclub Rock zu. Iron Maiden, Linkin Park, AC/DC, Foo Fighters, The Who: Wir spielen das Beste aus sechs Jahrzehnten Musik mit stromverstärkten Gitarren. Egal ob Hair-Metal, Grunge, Alternative oder die Headliner von morgen - jeden Donnerstag läuft, was rockt. Luftgitarre spielen, headbangen und Mitgrölen ist ausdrücklich erwünscht! Wir hauen nicht nur die Klassiker raus, sondern gucken auch über die Grenzen: Wir spielen Rocksongs aus allen Ländern der Erde, stellen neue Singles vor und erfüllen natürlich eure Musikwünsche, damit ihr euch den Alltag von der Seele rocken könnt.'
