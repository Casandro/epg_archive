- eventId: 928260
  start: 2026-10-08T17:00:00Z
  stop: 2026-10-08T20:00:00Z
  title: Der Abend
  description: "Lassen Sie den Tag entspannt ausklingen mit viel Musik und Musikgeschichten. Wir begleiten sie durch den Abend mit den \"Größten Hits aller Zeiten\". \nDer Abend auf Bremen Eins ist die erste Wahl für Pop- und Rockfans. Unsere Musikgeschichten erzählen wir authentisch und mit Leidenschaft. Und die Musikredaktion präsentiert regelmäßig ein neues \"Album der Woche\".\nAlle zwei Wochen haben Sie bei Bremen Eins mit dem Bremen Eins Musiktester die Möglichkeit, Musik aktiv mitzugestalten: Aus 15 Songs wählen Sie Ihre Favoriten und entscheiden, welche 5 Titel es ins Programm schaffen."
  genre:
  - '32'
- eventId: 928112
