  title: Grüße und Musik
  description: "In unserer Wunschsendung spielen wir Ihre Lieblingshits von 1960 bis heute! Ob Klassiker, Pop, Rock, Soul oder aktuelle Lieblingssongs - sagen Sie uns, welche Musik Sie gerne hören möchten.\n \nIhr Musikwunsch darf gern mit einem Gruß, Glückwunsch, Dankeschön oder einer kleinen Geschichte verbunden sein - wir freuen uns über Ihre persönlichen Botschaften!"
