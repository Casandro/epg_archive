  title: Na pěknú notečku
  description: Názvy vesnic na Kyjovsku, které na mapě nenajdete. Vesnice na Kyjovsku mají tak jako všechny jiné na světě svá oficiální jména. Pro některé z nich jsou však obecně známy přezdívky vystihující povahu jejich obyvatel, mohou se také vázat k některé historické události, řemeslu, či původnímu způsobu obživy. Pojďme se dnes pomyslně projít některými lokalitami Kyjovska a připomeňme si jejich letitě zaužívaná přízviska. Pořad připravila Markéta Vašulková.
