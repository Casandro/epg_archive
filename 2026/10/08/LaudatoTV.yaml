  title: Susret u riječi
  subtitle: Religijski
  description: Vladimir Sokol hrvatski je arheolog, muzeolog i istraživač srednjovjekovne i antičke baštine. Osnivač je Muzeja Prigorja u Sesvetama, gdje djeluje kao ravnatelj, a desetljećima se bavi arheološkim istraživanjima područja istočnog Zagreba i Sesvetskog Prigorja. Posebno se posvetio kasnoj antici i ranom srednjem vijeku, a svojim je istraživanjima pridonio boljem poznavanju arheološke prošlosti Zagreba i šire Hrvatske. Sudjelovao je na brojnim domaćim i međunarodnim stručnim skupovima te surađivao s različitim znanstvenim i kulturnim institucijama.
