    Stopama don Orionea - otkrivajući Božju providnost
    Donosimo vam priču o misonarskoj strasti i nesebičnom služenju koje je oblikvalo tisuće života. Monsinjor Marco Navoni govori o životu sv. Luigija Orionea, iznimnog čovjeka koji je svoj život posvetio brizi za siromašnu djecu, njihovom duhovnom rastu i obrazovanju. Njegova djela i poslanje proširila su se diljem cijeloga svijeta.
