  title: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  description: 'Kennen Sie Mitteldalmatien? Haben Sie schon mal etwas von den Städten Trogir, Marina, Seget, Okrug oder Kastella gehört? Schauspieler Falk-Willy Wild nimmt Sie mit auf seine ganz persönliche Entdeckungsreise durch die Region. So lernt er die Altstadt von Trogir kennen mit ihren wunderschönen Palästen und Kirchen aus verschiedenen Jahrhunderten. Auf dem Rad geht es über die Straße der Kastelle am Meer entlang und Falk-Willy Wild erfährt so manche Geschichte über die historischen Befestigungsanlagen. Im hügeligen Hinterland wandert er auf historischen Pfaden zu Aussichtspunkten, von wo er die traumhaften Ausblicke zur Küste hin genießt. Ein Museum der anderen Art erkundet er mit Schnorchel in der Adria: Das einzigartige Unterwassermuseum mit seinen großen Statuen ist ein beliebter Tauch-Hotspot sowohl für Anfänger als auch erfahrene Taucher. An einer abgelegenen Badebucht genießt Falk-Willy anschließend die mediterrane Küche mit ihrer tollen Vielfalt aus frischem Fisch, Fleisch und Gemüse aus der Region. DE 2022'
- eventId: 1500927
  start: 2026-10-08T10:30:00Z
  stop: 2026-10-08T10:52:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  description: 'Schauspieler Oliver Hörner begibt sich auf Entdeckungsreise auf die kroatischen Inseln Krk, Cres, Losinj und Rab in der Adria: Römische Spuren, Altstädte mit engen Gassen, pittoreske Fischerdörfer, Wein, der 30 Jahre lang im Meer gereift ist, eine Tropfsteinhöhle. Wo befinden sich traumhafte Sandstrände und abgelegene Badebuchten? Mit dem Fahrrad lassen sich die Inseln am besten erschließen. Oliver Hörner wandert über Karstplateaus und genießt den herrlichen Rundumblick über die Inselwelt Kroatiens, fährt durch einen der letzten Eichenwälder des Mittelmeerraums, entdeckt die weltweit einzigartigen Gänsegeier in freier Wildbahn und beobachtet Delfine vom Boot aus. Zudem genießt der Schauspieler die kroatische Kulinarik mit Lammspezialitäten, Kvarner Scampi, traditionellem Oktopus-Eintopf und Raber Torte. DE 2021'
