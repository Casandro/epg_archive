- eventId: 1500839
  start: 2026-10-08T01:10:00Z
  stop: 2026-10-08T01:36:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 4: Halblech - Schlehdorf'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 4: Halblech - Schlehdorf'
  description: Hier seht ihr die vierte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der vierte Tag beginnt in Halblech von wo wir durch sanft hügeliges Gelände zur Wieskirche radeln. Der Besuch dieses sakralen Zauberwerks ist bei dieser Tour ein unbedingtes Muss! Weiter gehts durch die sagenhaft schöne Landschaft des oberbayerischen Alpenvorlandes. Über Bad Kohlgrub gelangen wir immer leicht bergab ins Murnauer Moos. Es ist bezaubernd durch das saftige Grün dieser ursprünglichen Gegend zu radeln. In Eschenlohe treffen wir auf die Loisach (Fluß), der wir rund um den Heimgarten (Berg) bis zu unserem Etappenziel nach Schlehdorf am Kochelsee folgen. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1500840
  start: 2026-10-08T01:40:00Z
  stop: 2026-10-08T02:16:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 5: Kochelsee - Tegernsee'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 5: Kochelsee - Tegernsee'
  description: Hier seht ihr die fünfte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der fünfte Tag beginnt direkt am Kochelsee in Schlehdorf. Tiefhängende Wolken lassen uns am Morgen daran zweifeln, ob wir wirklich in den Bergen unterwegs sind? Es kommt, wie es kommen muss - der gesamte Tag wird ein Bad in den Fluten der offenen Himmelsschleusen! Doch dieser Streckenabschnitt ist zu schön, um ihn nicht bei idealem Wetter zu präsentieren. Lange Rede kurzer Sinn, der Originalfahrtag war nicht zeigenswert, so dass wir diese superschöne Etappe nachgedreht haben Zunächst geht es ein kurzes Stück am Kochelsee entlang, bevor wir nördlich einschwenken und durch die landschaftlich großartigen Kochelsee-Loisach Moore Richtung Benediktbeuern fahren. Hier besuchen wir das beeindruckende Kloster Benediktbeuern mit seiner mächtigen Basilika. Kurz vor Bad Heilbrunn beginnt ein langgezogener Anstieg rund um den Blomberg, der auch als Hausberg Bad Tölzs bekannt ist. Vorbei an der Sommerrodelbahn erreichen wir die Isar und das besagte Bad Tölz. Wir besuchen die imponierende Fußgängerzone der 19.000 Seelen Gemeinde mit ihren farbenfrohen Lüftlmalereien an den Hauswänden. Anschließend gehts wieder durch unberührte Natur auf traumhaften Wegen zum Tegernsee. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
