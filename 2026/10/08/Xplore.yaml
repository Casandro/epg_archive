  description: 'Die Insel Pag mit ihrem Hauptort Novalja war schon zu Zeiten der Römer eine beliebte  Adresse. Das Imperium legte den Hafen der Stadt an und baute vor rund 2000 Jahren ein geradezu unglaubliches, unterirdisches Aquädukt, das Touristen bestaunen können. Viele Jahrhunderte alt sind auch die unzähligen Olivenbäume, die die Landschaft von Pag prägen und die - neben dem vorzüglichen Schafskäse - mit ihren Ölen maßgeblich die Kulinarik beeinflussen. Pag: Das ist ein touristisches Nahziel in Europa und ein Geheimtipp für Aktivurlauber, die saubere Strände, das klare Wasser und viele Ausflugsangebote schätzen. Der Schauspieler Oliver Hörner und sein Kamerateam haben die Insel mit dem Fahrrad, dem Motorrad und zu Fuß erforscht und präsentieren mit ihrer Reportage eine Destination, die noch immer als Geheimtipp bezeichnet werden kann. DE 2021'
