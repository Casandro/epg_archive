- eventId: 1500896
  start: 2026-10-08T07:25:00Z
  stop: 2026-10-08T07:57:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 6: Bad Wiessee - Bad Feilnbach'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 6: Bad Wiessee - Bad Feilnbach'
  description: Hier seht ihr die sechste Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der sechste Tag startet direkt am wunderschönen Tegernsee - in Bad Wiessee. Von hier weg, gehts erstmal ein Stückchen um den See, wo wir immer wieder zauberhafte Bilcke auf das malerisch gelegene Gewsser erhaschen können. Bei Gmund am Tegernsee ist es mit dem gemütlichen Dahinrollen erstmal vorbei! Nun folgt der anspruchsvollste Teil der heutigen Etappe mit Schotterpassagen über einen kleinen Höhenzug nach Hausham. Hier fahren wir dann immer leicht bergauf bis zum etwas kleineren, aber nicht minderschönen Schliersee, den wir erneut halb umrunden. Kurze Zeit später baut sich der markante Wendelstein vor uns auf. Dort auf der anderen Seite, am Fuße des Bergriesen liegt unser heutiges Tagesziel. Doch bevor wir durch die großartige Voralpenlandschaft Oberbayerns über kleine versteckte Wege dorthin radeln, kehren wir bei der "Fischbachauer Institution Cafe Winklstüberl" ein und lassen uns von der unfassbaren Kuchen- und Tortenvielfalt gefangen nehmen!!! Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1500912
  start: 2026-10-08T08:00:00Z
  stop: 2026-10-08T08:35:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 7 und 8: Von Bad Feilnbach über den Chiemsee nach Traunstein'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 7 und 8: Von Bad Feilnbach über den Chiemsee nach Traunstein'
  description: Hier seht ihr die siebte und achte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Ich habe die beiden Etappen zusammengefügt, weil die Einzelstrecken nicht sonderlich lang sind und ich der Meinung bin, dass man unbedingt eine Schiffsfahrt auf dem Chiemsee mit einplanen sollte. Der Besuch der Herren- bzw. Fraueninsel gehört zum "Pflichtprogramm" , wenn man touristisch in dieser Region unterwegs ist. Durch diese Etappenplanung bleibt genug Zeit dies zu realisieren! Der heutige Abschnitt beginnt in Bad Feilnbach direkt unterhalb des Wendelsteins. Wie queren zunächst die flache Innebene nebst dem namensgebenden Fluss. Über Neubeuern, mit seinem schmucken Marktplatz und altem Schlösschen, fahren wir über Rohrdorf Richtung Frasdorf. Ein toller kleiner Radweg bringt uns mit ganz leichter Steigung nach Aschau, immer den Blick auf die markante Kampenwand gerichtet. Ein Stückchen weiter endet dann der siebte Fahrtag in unserer, etwas erhöhten Unterkunft mit einem fantastischem Blick auf den Chiemsee. Am folgenden Tag brechen wir früh auf, um das erste Ausflugsboot zur Herreninsel rechtzeitig zu erreichen. Wir verbringen den ganzen Vormittag damit, die imponierenden Schloss- und Klosteranlagen inmitten des "Bayerischen Meeres" in eindrucksvoller Art und Weise auf uns wirken zu lassen. Bayern at its best!!! Nach unserer Rückkehr aufs Festland geht's erstmal durch die naturbelassenen Moore und Filze, des ehemalig viel größeren Chiemsees. Anschließen haben wir wieder asphaltierte Radwege unter den Reifen, auf denen wir gemütlich durch die Kulturlandschaft des Chiemgaus bis Traunstein cruisen. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 1500913
  start: 2026-10-08T08:45:00Z
  stop: 2026-10-08T09:16:00Z
  title: Mission Manx
  subtitle: Mission Manx
  description: '4 BMW-Motorräder, 8 Räder, 16 Ventile. "Mission Manx" ist eine Dokumentation über eine Reise von vier Freunden, die ihren Traum verwirklichen: Sie fahren von Berlin zu der legendären "Isle of Man" in Irland. Werden Sie ein Teil dieses authentischen Motorradfilms. Der Film gehört zu der offiziellen Auswahl des "Motorcycle Film Festival 2014". US 2014'
