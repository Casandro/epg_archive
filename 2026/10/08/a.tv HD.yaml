  title: Heimatzeit (Wh.)
  subtitle: Geschichten und Traditionen aus Schwaben.
  description: In der Heimatzeit ist wieder viel geboten. Wir machen unter der Anleitung von Martin Spreiter in Finningen Kunst mit einer Motorsäge. Außerdem treffen wir Hans Lohberger, der in Höchstädt Wein herstellt. Nancy Keller aus Neusäß wird in ihrer Keramikwerkstatt kreativ und die Wanderausstellung in Nördlingen des Bezirks Schwaben Schwäbische Sinti und Roma in Vergangenheit und Gegenwart lädt zum Nachdenken ein. Mit Jessica Becker
