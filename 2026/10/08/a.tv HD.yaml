  subtitle: Vom bedrohten Grauvieh bis zum erfolgreichen Ringernachwuchs - Unterwegs in Westendorf
  description: 'Wir besuchen den Grauviehhof Zettl und lernen das vom Aussterben bedrohte Tiroler Grauvieh kennen. In Westendorf schauen wir uns außerdem einen neuen Spielplatz und die Renaturierung der Gennach an. Anschließend wird es außergewöhnlich: Ein Tüftler hat aus alten Feuerwehrfahrzeugen und Anhängern besondere Eventmobile gebaut - inklusive Bar und musikalisch synchronisiertem Springbrunnen. Zum Abschluss geht es zum Ringertraining: Die Sportler aus Westendorf sind über das Allgäu hinaus bekannt und treten teilweise sogar als Deutsche Meister an.'
