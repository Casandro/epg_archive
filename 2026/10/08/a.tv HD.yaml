  title: Wies Leben so spielt (Wh.)
  subtitle: Menschen aus der Region erzählen von prägenden Lebenswegen.
  description: 'Wies Leben so spielt ist ein journalistisches Gesprächsformat mit Menschen aus der Region. Im Mittelpunkt stehen persönliche Erfahrungen, besondere Lebensereignisse, außergewöhnliche Tätigkeiten und Entscheidungen, die ein Leben geprägt oder verändert haben. Die Gesprächspartnerinnen und Gesprächspartner berichten von Wendepunkten, Herausforderungen und Einsichten. Dabei kann es um gesundheitliche Extremsituationen, ungewöhnliche Lebensverläufe, soziale Verantwortung, medizinische Arbeit, ehrenamtliches Engagement oder andere Tätigkeiten mit besonderer gesellschaftlicher Bedeutung gehen. Die Gespräche finden nicht im Studio statt, sondern an Orten, die mit der jeweiligen Geschichte verbunden sind: am Arbeitsplatz, an privaten Rückzugsorten oder an charakteristischen Schauplätzen der Region. So entsteht ein direkter Bezug zwischen der persönlichen Erzählung und der Umgebung. Die Sendung setzt auf ruhige, strukturierte Gespräche und nimmt sich Zeit für Hintergründe, Zusammenhänge und persönliche Perspektiven. Einzelne Folgen greifen auch religiöse oder ethische Fragen auf. Ziel ist es, Lebensgeschichten verständlich, respektvoll und nah an den Menschen zu erzählen.'
