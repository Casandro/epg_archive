  title: Až na dřeň
  description: Hudební skladatel, zpěvák, scénárista a režisér Lukáš Daniel Pařík stojí za úspěšnou sérií fantasy pohádek Princezna zakletá v čase 1 a 2, kterou spoluvytváří. Právě v těcho dnech vzniká závěrečný díl trilogie - Princ zakletý v čase. Jak se pohádka a množstvím trikových scén natáčí, jak vzniká filmová hudba a jak může tvorba pomoci zpracovat osobní trápení? I o tom bude řeč v pořadu Až na dřeň. Moderuje Kateřina Kubalová
