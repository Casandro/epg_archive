  title: Das große Stimmen-der-Berge-Wunschkonzert
  subtitle: Das große Stimmen-der-Berge-Wunschkonzert
  description: Heute widmen wir uns einer Gruppe, die mit ihren harmonischen Klängen und ihrer einzigartigen Botschaft die Herzen der Menschen berührt - Die Stimmen der Berge. Die vier talentierten Sänger aus dem Herzen der Domspatzen, verkörpern die reiche Tradition der Volksmusik und bringen sie mit modernen Elementen auf die Bühne. Mit ihren kraftvollen Stimmen und einfühlsamen Interpretationen traditioneller Volkslieder, begeistern sie ihr Publikum in ganz Deutschland und darüber hinaus. Ge 2021
