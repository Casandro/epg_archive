  title: Unvergessene Legenden - Andrea Jürgens
  subtitle: Unvergessene Legenden - Andrea Jürgens
  description: Andrea Jürgens steht im Mittelpunkt  in der Sendung "Unvergessene Legenden". Geboren als Andrea Elisabeth Maria Jürgens am 15. Mai 1967 in Herne wurde sie eine der bekanntesten Sängerinnen Deutschlands. Der Erfolg der Andrea Jürgens Lieder nach ihrem Tod erleben wir als eine wirkliche Renaissance. Ihr besonderes Leben vom Kinderstar aus der Jack-White-Hitschmiede bis zur erwachsenen Künstlerin wird in der Sendung beleuchtet. Dazu erleben Sie die schnsten Musikvideos dieser Zeit. Ge 2020
