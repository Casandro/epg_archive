  title: Invitation au voyage
  subtitle: E02. Kate Bush conquiert Londres à contre-courant. Dès les années 1970, tandis que le punk et le rock exultent la virilité, l'artiste fait surgir la femme là où règne l'homme.
  genre:
  - '116'
  description: Kate Bush, Londres dans la peau Kate Bush conquiert Londres à contre-courant. Dès les années 1970, tandis que le punk et le rock exultent la virilité, l'artiste se joue des codes et fait surgir la femme là où règne l'homme. Réservée, Kate Bush brise sa coquille. Dans un Londres crispé par la récession et les émeutes raciales, sa voix haut perchée fend l'asphalte. Mi-conteuse mi-chamane, elle impose sa présence envoûtante. À seulement 19 ans, Kate Bush devient la première compositrice à dominer les charts britanniques. Les tisaneurs, guérisseurs de la Réunion Déployée sur près de la moitié de l'île, la forêt n'est pas seulement le poumon de la Réunion. Elle forme un immense jardin médicinal pour ceux qui savent l'apprivoiser et qu'on nomme ici les tisaneurs. Providentielles ont été ces feuilles et ces herbes, pour les esclaves en fuite, les travailleurs forcés, tous ces proscrits qui ont peuplé l'intérieur de l'île depuis quatre siècles. En trouvant dans ces plantes des remèdes et des baumes, ils en ont fait une force, des alliés pour survivre. En Norvège, les abats de cabillaud de Henrik À Trondheim, Henrik prépare un skrei avec l'aide de son frère. Ils commencent par paner et frire la langue du poisson puis pochent les oeufs et le foie dans un bouillon de légumes. Une dégustation traditionnelle et conviviale entre amis. En Grèce, Sésame ouvre-toi ! La Grèce antique n'a pas seulement accouché de philosophes ou de tragédiens. Elle a également abrité des inventeurs. De la création de l'éolipyle au premier distributeur automatique de l'humanité, Héron d'Alexandrie a marqué de son empreinte le monde moderne. (2026)
- eventId: 1570282
  start: 2026-10-08T06:22:41Z
  stop: 2026-10-08T07:05:00Z
