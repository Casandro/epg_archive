  title: Die Concorde - Absturz einer Legende
  subtitle: Deutschland/Frankreich/USA 2020
  subtitled: true
  description: Die Concorde war das außergewöhnlichste Passagierflugzeug, das je gebaut wurde - ein technisches Wunderwerk, dessen Innovation und Schönheit bis heute für viele ungeschlagen sind. Doch beim Absturz einer Concorde bei Paris im Jahre 2000 kamen 113 Menschen ums Leben. Bald danach wurde das einzige Überschall-Passagierflugzeug der Welt vorzeitig aus dem Verkehr gezogen.
- eventId: 977290
  start: 2026-10-08T01:20:00Z
  stop: 2026-10-08T01:45:00Z
  title: Weht bald ein anderer Wind?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: 'Bisher war der Wind das Stiefkind der Klimaforschung: zu schwierig zu messen, zu wechselhaft, zu wenige Daten aus der ferneren Vergangenheit. Aber in den letzten Jahren rückt er zunehmend in den Fokus, wenn es um unsere Zukunft im sich verändernden Klima geht.'
- eventId: 977291
  start: 2026-10-08T01:45:00Z
  stop: 2026-10-08T02:00:00Z
  title: Mit offenen Augen
  subtitle: 'Trumps Fäkalvideo: Wenn PR-Codes unter die Gürtelgrenze rutschen'
  description: Als im Oktober 2025 Millionen Amerikanerinnen und Amerikaner im Zuge der "No Kings"-Bewegung gegen den US-Präsidenten demonstrierten, konterte dieser mit einem spektakulären, KI-generierten Video. Für Donald Trump stellt Künstliche Intelligenz längst ein äußerst wirksames politisches Instrument dar. Der Politikjournalist Jake Lahut erläutert, wie der Präsident mit dieser Kommunikationsstrategie seine Gegner verspottet und sich zugleich mediale Präsenz sichert. Der Medienwissenschaftler Andrew Rojecki ordnet diese enthemmte PR-Methode ein und erklärt, warum sich inzwischen auch andere Staatschefs damit anfreunden.
- eventId: 977292
  start: 2026-10-08T02:00:00Z
  stop: 2026-10-08T03:00:00Z
  title: 28 Minuten
  subtitle: 'Moderation: Elisabeth Quin'
  subtitled: true
  description: '"28 Minuten" ist das Polit-Magazin bei ARTE, täglich frisch und frech aus Paris. Jede Sendung nimmt aktuelle Themen aus Gesellschaft, Politik, Wirtschaft oder Wissenschaft unter die Lupe. Montags bis donnerstags moderiert von Élisabeth Quin, freitags und samstags von Renaud Dély.'
