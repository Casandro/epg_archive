  title: Traumrouten des Orients
  subtitle: Grand Trunk Road
  subtitled: true
  description: Indien und Pakistan bilden einen geheimnisvollen Subkontinent. In der Kolonialzeit bauten die Briten eine Straße durch das gesamte Reich und nannten sie "Grand Trunk Road". Der legendäre Weg bildet auf über 2.400 Kilometern eine pulsierende Lebensader. Von Kolkata über Benares nach Delhi führt die Route von Indien über die pakistanische Grenze nach Lahore und Peshawar.
- eventId: 977431
  start: 2026-10-08T07:40:00Z
  stop: 2026-10-08T08:25:00Z
  title: Traumrouten des Orients
  subtitle: Pamir-Highway
  subtitled: true
  description: 'Unterwegs auf einer abenteuerlichen Route durch das Pamir-Gebirge, die voller Geheimnisse und Überraschungen steckt: Diese Folge der Dokureihe führt vorbei an über 7.000 Meter hohen Bergen nach Kirgistan, wo Steppen und Pferdeherden das Bild bestimmen. Ausgangspunkt der Reise ist Duschanbe, die Hauptstadt Tadschikistans.'
