    Die Tier-Docs! Pfotenhelden mit Herz
    Reality-Doku, D 2025
    Altersfreigabe: ab 6
  description: Im Tierpark Kleve sind die Otter los! Tierarzt Martin Polotzek untersucht den süßen Nachwuchs. Das bereits anderthalb Jahre alte Otterweibchen Arielle zieht in den spanischen Loro Parque, wo sie auf Männchen Acéro trifft. Ob die beiden sich verstehen werden? An der Mosel kümmert sich Isabelle Reißmann heute um ein ganzes Wildgehege voller Geflügel. Und Dr. Herbert Dreesen untersucht Bulldoggenmännchen Buddy im Kölner Tiermobil. Kann er dem leidenden Hund helfen?
