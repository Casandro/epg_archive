  title: ANIXE auf Reisen - Emsland mit Norman Kalle
  description: Dass auch Deutschland  über viele lohnenswerte Kurzreiseziele verfügt, beweist Schauspieler Norman Kalle mit seinem Trip durch das Emsland. So begleitet ,,Anixe auf Reisen' den bekannten Schauspieler beim Besuch einer Kornbrennerei mit anschließender Degustation und auf einer abwechslungsreichen Reise durch die fruchtbaren Ebenen. Mit dem Elektroroller und dem Paddelboot vorbei an Windmühlen und Ölförderpumpen und dann hinein ins Mo or zeigt, das dieses ein aufregender Lebensraum für Pflanzen und Tiere ist. In Papenburg interessiert sich Norman Kalle für die Meyer-Werft, in denen die größten Kreuzfahrtschiffe der Welt gebaut werden. In der Festung Bourtange, auf niederländischem Gebiet, taucht der Schauspieler ab in die Tiefe der Geschichte und versetzt sich in das Jahr 1742, als in den massiven Mauern noch Bürgersoldaten lebten.
