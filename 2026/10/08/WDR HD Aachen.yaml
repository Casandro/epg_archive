  description: 'Das Heidelberger Schloss - ein Inbegriff der Romantik: nicht nur für Dichtergrößen aus längst vergangener Zeit, sondern noch heute für Millionen von Besucher:innen aus aller Welt. SWR-Moderatorin Annette Krause macht sich auf die Suche nach pulsierenden Liebesgeschichten, amourösen Orten und herzerwärmenden Plätzen der Universitätsstadt: Heidelberg ist eine Stadt für Verliebte und zum Verlieben. Kein Wunder, dass viele ihr Herz an sie verloren haben.'
