  stop: 2026-10-08T19:00:00Z
  title: 'Quarks: Mehr Wildnis wagen - Wie nah darf sie uns kommen?'
  subtitle: 'Moderation: Thomas Ranft'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wilde, scheinbar unberührte Natur fasziniert viele Menschen. Sie verspricht Freiheit, Abenteuer und eine Welt, die ihren eigenen Regeln folgt - und uns daran erinnert, dass nicht alles geplant, geordnet und kontrolliert sein muss. Deshalb wünschen sich viele mehr Wildnis. Doch was passiert, wenn sie nicht nur Sehnsuchtsort ist - sondern plötzlich ganz nah?
    Wenn Füchse durch Wohngebiete streifen, Waschbären durch unsere Städte ziehen oder Wölfe wieder Teil unserer Kulturlandschaften werden, zeigt sich: Unsere Begeisterung für "wilde" Natur endet oft dort, wo sie unseren Alltag betrifft. Wie kann das Zusammenleben gelingen?
- eventId: 772039
  start: 2026-10-08T19:00:00Z
  stop: 2026-10-08T19:45:00Z
  title: Gute Nachrichten vom Planeten - Was bringt uns Naturschutz?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Tiere und Pflanzen schützen, ist auch wichtig für Menschen. Intakte Lebensräume tragen zum Klimaschutz bei und sichern unsere Ernährung. In den letzten Jahrzehnten sind viele verändert oder zerstört worden. Doch wir können etwas dagegen tun und die Natur schützen - das zeigen engagierte Umweltschützerinnen und Forscher.
    Auf Raja Ampat, einem Archipel in Indonesien, ziehen zum Beispiel sogenannte "Hai-Mamas" Zebrahaie in Zuchtstationen auf, um sie später freizulassen. Als Wächter der Korallenriffe sorgen die Haie für einen gesünderen Lebensraum.
  subtitle: Was bringt uns Naturschutz?
