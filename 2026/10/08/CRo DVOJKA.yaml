  description: 'Petr Sagitarius: Trujkunt - Kruhy (1/8). Mrtvý chlapec uprostřed pšeničného pole. Svérázný major Roman Saran vyšetřuje brutální vraždu. Zohavené tělo mladého muže je jen začátkem temného příběhu, který dá ostravské kriminálce pořádně zabrat. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2022.'
