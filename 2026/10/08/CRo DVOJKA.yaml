  stop: 2026-10-08T16:30:00Z
  title: Moci bez nemoci
  description: Martin dostal srdeční kolaps na běžkách. Jeho tělesný tlak byl 50 na 30 a měl nehmatný puls. Prodělal infarkt myokardu jako následek ischemické choroby srdeční. Postoupil novinkový zákrok - robotický bypass bez otevření hrudníku a mimotělního oběhu a ten ho vrátil zpět do plnohodnotného života. O tom všem v dalším díle pořadu Moci bez nemoci. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijal také MUDr. Štěpán Černý, CSc., MBA - přednosta Kliniky kardiovaskulární chirurgie 2. LF UK a FN Motol a Homolka, který tuto operaci provedl. Premiéra.
