- eventId: 1535949
  start: 2026-10-08T09:05:00Z
  stop: 2026-10-08T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Když jablko nepadne daleko od stromu. herečka Michaela Lohniská. Nositelka slavného hereckého jména spojila největší část svého hereckého života s libereckou činohrou. Jak vypadala cesta studentky Střední sklářské školy v Železném Brodě k herectví, jaký byl její otec - režisér a herec Václav Lohniský? Setkala se s ním někdy před filmovou kamerou? Zajímavé vyprávění Michaely Lohniské si můžete poslechnout hodinu před polednem.'
