  description: 'Alaska ist wild und unbarmherzig: endlose Weiten, extreme Wetterlagen und mehr Tiere als Menschen. Schneestürme, meterhohe Wellen und eisige Kälte machen das Leben zum Überlebenskampf. In dieser rauen Umgebung zählt jede Sekunde, wenn Fischer oder Arbeiter auf Bohrinseln in Not geraten. Die US-Küstenwache (USCG) ist rund um die Uhr im Einsatz - mit Flugzeugen, Helikoptern und Schiffen rettet sie Menschenleben unter extremsten Bedingungen.'
