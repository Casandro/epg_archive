  title: Faszination Anden
  description: Die Anden, das längste Gebirge der Welt, üben eine unvergleichliche Faszination aus. Mit majestätischen Gipfeln, tiefen Schluchten und einer reichen Tier- und Pflanzenwelt bieten sie ein atemberaubendes Panorama. Ihre kulturelle Vielfalt, von den Inka-Ruinen bis zu den indigenen Gemeinschaften, zieht Reisende aus aller Welt an. Die Anden sind nicht nur ein Naturwunder, sondern auch ein Ort der spirituellen Bedeutung und historischen Bedeutung für die Menschen in Südamerika.
  widescreen: true
- eventId: 1568017
  start: 2026-10-08T03:45:00Z
  stop: 2026-10-08T04:00:00Z
  title: Patagonien - Ungezähmte Wildnis
  description: Patagonien, eine Region von unvergleichlicher Schönheit, lockt Abenteurer mit seiner ungezähmten Wildnis. Hier erstrecken sich endlose Steppen, majestätische Gletscher und raue Bergketten bis zum Horizont. Die atemberaubende Landschaft beherbergt eine Vielzahl von Tierarten, darunter Guanakos, Pumas und Kondore. Für Wanderer, Bergsteiger und Naturliebhaber ist Patagonien ein Paradies, das sie immer wieder zurückkehren lässt.
  widescreen: true
