  subtitle: Tiere vor der Kamera - Der schnelle Sommer der Eisfüchse
  description: Arendt und Schweiger beobachten den hektischen Sommer der Eisfüchse am nördlichsten Ende Alaskas. Mit einer Ondergenehmigung fahren sie entlang der Trans-Alaska-Pipeline nach Prudhoe Bay und dokumentieren das quirlige Treiben der Fuchsfamilien sowie anderer Tundra-Bewohner während der kurzen schneefreien Zeit.
