  description: 'Regie: Gore Verbinski. Darsteller: Johnny Depp, Orlando Bloom, Keira Knightley. Gerade als Will und Elizabeth heiraten wollen, werden sie verhaftet. Ihnen droht die Todesstrafe, es sei denn, sie bringen Lord Beckett den magischen Kompass, der sich im Besitz des geflüchteten Piraten Jack Sparrow befindet. Doch auch Davy Jones, der Kapitän des Geisterschiffes "Flying Dutchman", ist auf der Suche nach Sparrow. Die beiden Todfeinde haben noch eine ganz alte Rechnung offen. Jack hat Davy Jones einst seine Seele versprochen.'
