  subtitle: Mein bester Freund heiratet Comedy-Serie, USA 2004
  description: Folge 68, Turks und Carlas Hochzeit steht endlich bevor. Aber während Carla in der Kirche wartet, wird Turk bei einer Notoperation festgehalten und fährt danach auch noch zur falschen Kirche. Als er endlich bei seiner Hochzeitsgesellschaft ankommt, ist der Termin jedoch schon verschoben und seine Braut stocksauer. Ebenfalls auf den Mond schießen möchte Elliot J.D., der ihr den Laufpass gegeben hat. Alle Versuche, ihre Freundschaft zu retten, machen sie nur noch wütender.
