  start: 2026-10-08T03:05:00Z
  stop: 2026-10-08T03:30:00Z
  title: Interview Plus
  description: Michal Vašečka, bratislavský politolog a sociolog. Vláda Roberta Fica na Slovensku koncem září ztratila ministra životního prostředí Tomáše Tarabu, proti němuž se postavila malá vládní strana SNS společně s opozicí. Proč ani tak výrazný projev neloajality neznamená konec vládní koalice? Vyhne se Slovensko předčasným volbám? Moderuje Pavlína Nečásková.
