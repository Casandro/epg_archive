  title: Na Východ!
  description: Vztahy Srbska s Ruskem byly v historii vždy nadstandardní. Jaké důsledky to má v době plošné ruské invaze na Ukrajinu? Je Srbsko ruskou spojkou v Evropě a výcvikovým střediskem pro diverzanty, nebo naopak útočištěm pro ruské uprchlíky a nárazníkovou zónou pro různé ideologie? To probírají Josef Pazderka a Ondřej Soukup s reportérkou Magdalenou Fajtovou z týdeníku Respekt.
