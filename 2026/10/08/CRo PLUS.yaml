  title: Na Východ!
  description: Vztahy Srbska s Ruskem byly v historii vždy nadstandardní. Jaké důsledky to má v době plošné ruské invaze na Ukrajinu? Je Srbsko ruskou spojkou v Evropě a výcvikovým střediskem pro diverzanty, nebo naopak útočištěm pro ruské uprchlíky a nárazníkovou zónou pro různé ideologie? To probírají Josef Pazderka a Ondřej Soukup s reportérkou Magdalenou Fajtovou z týdeníku Respekt.
- eventId: 1535804
  start: 2026-10-08T01:33:00Z
  stop: 2026-10-08T02:00:00Z
  title: Pro a proti
  description: Co dnes platí z havlovské zahraniční politiky? Václav Havel se stal symbolem hodnotové české zahraniční politiky. Je ale možné ji uplatňovat i v dnešní době? Obstojí jeho představa i v době války na Ukrajině, proměňujících se Spojených států nebo konfliktu na Blízkém východě? A připomínáme si stále skutečného Havla, nebo spíš obraz, který jsme si z jeho odkazu vytvořili? Hosty Pro a proti budou europoslanec ODS a někdejší spolupracovník Václava Havla Alexandr Vondra a novinář a šéfredaktor deníku Alarm Jan Bělíček.
- eventId: 1535805
  start: 2026-10-08T02:00:00Z
  stop: 2026-10-08T02:05:00Z
  title: Zprávy
- eventId: 1535806
  start: 2026-10-08T02:05:00Z
  stop: 2026-10-08T03:00:00Z
  title: Návraty časem
  description: Co se odehrávalo v zákulisí první volby Václava Havla prezidentem v prosinci 1989? A byl Václav Havel skutečně autorem výroku o humanitárním bombardování, který je mu občas připisován? Více v reprízách pořadů Archiv Plus a Jak to bylo doopravdy, které připravili Pavel Hlavatý a Ivana Chmel Denčevová.
- eventId: 1535856
  start: 2026-10-08T03:00:00Z
