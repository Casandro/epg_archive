  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Andrea Slováková je dokumentaristka, nakladatelka, pedagožka a dramaturgyně sekce experimentálních filmů na MFDF Jihlava: "Zajímají mě ty experimentální filmy, které v sobě dokážou reflektovat i způsob, jak byly vytvořené. Díváme se na film a zároveň přemýšlíme nad tím, jak byl vytvořen a jak ztvárňuje realitu," říká o své roli dramaturgyně na prestižním festivalu v Jihlavě. Proč je důležitá filmová věda a jaká je role ombudsmana na FAMU? Jak posunout umělecké vzdělávání? A co přinese třicátý ročník přehlídky dokumentárního filmu? Moderuje Lenka Buriánková.'
