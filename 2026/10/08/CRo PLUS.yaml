  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (9/10). Poslední roky Františkova života jsou spojeny s nemocemi a ztrátou zraku. Je mu téměř 40 let, což není málo pro člověka 13. století žijícího od 15 let asketicky. Je potřeba založit řád, uvědomuje si to i František. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
