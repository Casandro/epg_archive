  title: Sea Patrol - Das Killerschiff
  subtitle: Sea Patrol - Das Killerschiff
  description: Die Besatzung der Hammersley genießt ein paar freie Stunden und vertreibt sich die Zeit beim Baden und Schnorcheln. Die Idylle wird jäh gestört, als ein Handelsschiff auftaucht und ungebremst auf die Schwimmer zusteuert. Alle, bis auf Spider, der die Warnrufe unter Wasser nicht hören konnte, können sich in letzter Sekunde in Sicherheit bringen. AU 2009
  ageRating: 12
