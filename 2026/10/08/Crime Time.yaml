  title: Sea Patrol - Menschenhandel
  subtitle: Sea Patrol - Menschenhandel
  description: Ein Fischerboot mit eigenartiger Besatzung bestehend aus einem Kapitän und zahlreichen jungen, ängstlichen Frauen hält die Crew der Hammersley in Atem. Gegen alle Regeln verstoßend, nehmen sie eine in den Wehen liegende Frau auf, die bald darauf stirbt. Nun beginnt die Suche nach der Schwester der Toten, doch statt der Schwester machen sie einen Menschenhändlerring ausfindig. AU 2009
  ageRating: 12
- eventId: 1500677
