  description: Während einer Patrouillenfahrt stellt die Mannschaft der Hammersley auf einem illegalen Fischerboot eine beträchtliche Menge Plastiksprengstoff sicher. Diesen Erfolge feiert die Crew an ihrem freien Abend an Land ausgelassen und feucht-fröhlich. Als Robert sich betrunken auf den Weg zur Hammersley macht, belauscht er zufällig ein Gespräch zweier militanter Umweltschützer. AU 2009
