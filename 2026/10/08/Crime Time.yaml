  title: Sea Patrol - Halbwertszeit
  subtitle: Sea Patrol - Halbwertszeit
  description: 'Die Besatzung der Hammersley erhält den Auftrag auf Victory Day Island nach einem abgestürzten Helikopter zu suchen. Die Aussicht Überlebende zu finden, ist äußerst gering. Aber nicht nur das bereitet Captain Mike und seiner Mannschaft Sorgen: Auf Victory Day Island wurden in den Fünfziger Jahren Atomtests durchgeführt und die Insel gilt als extrem strahlenbelastet. AU 2009'
  ageRating: 12
- eventId: 1500706
