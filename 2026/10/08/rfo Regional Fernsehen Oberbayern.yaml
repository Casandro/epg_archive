  description: 'Wegen der Vergewaltigung seiner Ex-Freundin muss ein Mann aus Prien ins Gefängnis: Das Schöffengericht Rosenheim verhängte zweieinhalb Jahre Haft und ein weiteres Jahr, nachdem er nachts in ihre Wohnung eindrang, gestand und als alkoholabhängig galt; eine Entzugstherapie wurde angeordnet. +++ Unfall zwischen Bad Enhof und Wechselberg +++ Die Kreisstraße BGL 10 zwischen Thundorf (Ainring) und Vachenlueg bei Anger ist nach dem termingerechten Ausbau der gut drei Kilometer langen Strecke samt Geh- und Radweg wieder frei; die zweijährigen Arbeiten kosteten 11,3 Millionen Euro, davon 7,5 Millionen vom Freistaat. +++ Neuötting blickt auf 1000 Jahre voller Kriege, Brände und Blütezeiten zurück und feiert 30 Jahre Stadtmuseum, das seit 1996 als Erlebnisort, Galerie und Kulturzentrum mit neuen Attraktionen wie Brandinszenierung und Stadtmodell die Kulturstadt prägt.'
- eventId: 1280001
  start: 2026-10-08T05:20:00Z
  stop: 2026-10-08T05:30:00Z
  title: Süd Journal vom 7.10.2026 (Wh.)
  subtitle: Waging lädt zum Bauern- und Handwerkermarkt +++ Wetter für das Sendegebiet
  description: 'Am Sonntag, 11. Oktober, lockt der Waginger Bauern- und Handwerkermarkt als Höhepunkt der Genusswochen mit Schmankerlmeile, Vorführungen alten Handwerks, Kostproben sowie Musik und Tanz der Trachtenkinder und Waginger Musiker. +++ Der Herbst hat uns bisher mit viel Sonne verwöhnt. Doch jetzt zieht es sich erstmal zu: Die kommenden Tage werden grauer, nasser und vor allem kühler. Der goldene Oktober legt also eine kurze Pause ein - bevor es nächste Woche wieder etwas freundlicher wird.'
