- eventId: 1279896
  start: 2026-10-08T00:10:00Z
  stop: 2026-10-08T00:20:00Z
  title: Süd Journal vom 7.10.2026 (Wh.)
  subtitle: 28-jähriger wegen Vergewaltigung verurteilt  +++ Unfall zwischen Bad Enhof und Wechselberg +++ Verkehrsfreigabe - Ausbau BGL10 abgeschlossen +++ 30 Jahre Stadtmuseum Neuötting
  description: 'Wegen der Vergewaltigung seiner Ex-Freundin muss ein Mann aus Prien ins Gefängnis: Das Schöffengericht Rosenheim verhängte zweieinhalb Jahre Haft und ein weiteres Jahr, nachdem er nachts in ihre Wohnung eindrang, gestand und als alkoholabhängig galt; eine Entzugstherapie wurde angeordnet. +++ Unfall zwischen Bad Enhof und Wechselberg +++ Die Kreisstraße BGL 10 zwischen Thundorf (Ainring) und Vachenlueg bei Anger ist nach dem termingerechten Ausbau der gut drei Kilometer langen Strecke samt Geh- und Radweg wieder frei; die zweijährigen Arbeiten kosteten 11,3 Millionen Euro, davon 7,5 Millionen vom Freistaat. +++ Neuötting blickt auf 1000 Jahre voller Kriege, Brände und Blütezeiten zurück und feiert 30 Jahre Stadtmuseum, das seit 1996 als Erlebnisort, Galerie und Kulturzentrum mit neuen Attraktionen wie Brandinszenierung und Stadtmodell die Kulturstadt prägt.'
- eventId: 1279897
  start: 2026-10-08T00:20:00Z
  stop: 2026-10-08T00:30:00Z
  title: Süd Journal vom 7.10.2026 (Wh.)
  subtitle: Waging lädt zum Bauern- und Handwerkermarkt +++ Wetter für das Sendegebiet
  description: 'Am Sonntag, 11. Oktober, lockt der Waginger Bauern- und Handwerkermarkt als Höhepunkt der Genusswochen mit Schmankerlmeile, Vorführungen alten Handwerks, Kostproben sowie Musik und Tanz der Trachtenkinder und Waginger Musiker. +++ Der Herbst hat uns bisher mit viel Sonne verwöhnt. Doch jetzt zieht es sich erstmal zu: Die kommenden Tage werden grauer, nasser und vor allem kühler. Der goldene Oktober legt also eine kurze Pause ein - bevor es nächste Woche wieder etwas freundlicher wird.'
- eventId: 1279898
  start: 2026-10-08T00:30:00Z
  stop: 2026-10-08T00:45:00Z
  title: Süd Leben vom 7.10.2026 (Wh.)
  subtitle: Im Süd-Leben laden wir ein, stellen vor, zeichnen nach - ein spannendes Kaleidoskop des Lebens bei uns im Süden.
  description: Seit 75 Jahren steht das Kampenwandkreuz als Mahnmal und Chiemgau-Wahrzeichen auf 1664 Metern; zum Jubiläum wurde es samt 13 Lampen aus umfunktionierten VW-Käfer-Scheinwerfern restauriert, organisiert von Ehrenamtlichen um Franz Schaffner.
- eventId: 1279899
  start: 2026-10-08T00:45:00Z
  stop: 2026-10-08T01:00:00Z
  title: Süd Leben vom 7.10.2026 (Wh.)
  subtitle: Im Süd-Leben laden wir ein, stellen vor, zeichnen nach - ein spannendes Kaleidoskop des Lebens bei uns im Süden.
  description: 'In Rosenheim feierte der erste Mind-Sport-Tag mit Schach, Bridge und Tabletop Premiere: Vereine und Schirmherrin Gabriele Bauer brachten Neulinge und Routiniers zusammen, um strategische Spiele, Teamgeist und Kreativität zu vernetzen und mehr Aktive zu gewinnen.'
- eventId: 1279900
  start: 2026-10-08T01:00:00Z
  stop: 2026-10-08T01:10:00Z
  title: Süd Journal vom 7.10.2026 (Wh.)
  subtitle: Warnstreik der IG Metall +++ Energie- und Treibhausgasbilanz des Landkreises Roseheim  +++ Stadtratsfraktion stellt Antrag bezüglich Mittagsverpflegung
  description: |-
    Bei Alzmetall in Altenmarkt ist die Stimmung angespannt: Nach mehr als zwei Jahrzehnten mit Verzicht fordern die Beschäftigten wieder einen Tarifvertrag. Mit einem Warnstreik hat die IG Metall heute ihrer Forderung Nachdruck verliehen - und gleichzeitig den Druck auf die Geschäftsführung erhöht. +++ Wie klimafreundlich ist der Landkreis Rosenheim? Neue Zahlen zeigen, wo sich beim Energieverbrauch und bei den Emissionen etwas bewegt hat - und wo weiterhin Handlungsbedarf besteht. Besonders der Verkehr fällt dabei ins Gewicht. Und auch beim Thema Heizen zeigt die gestern veröfentlichte Bilanz noch deutliches Verbesserungspotenzial.
     +++ In Rosenheims städtischen Schulen zahlen Familien fürs Mittagessen je nach Schule und Caterer unterschiedlich; die Grünen fordern eine einheitliche Gebühr mit sachlich begründeten Ausnahmen sowie soziale Ermäßigungen über den Grünen Pass, doch die Finanzierung bleibt offen.
