  title: Terra Mater - Die Lemuren-Bande
  subtitle: Weiter geht's! (3/3)
  description: Madagaskars Tiere und Pflanzen ächzen unter der anhaltenden Trockenheit. Die Lemuren werden bei der Suche nach Futter kreativ. Seb und andere jugendliche Schwarzmakis machen die Obstplantagen der Gegend und die Straßen des Dorfes unsicher. Dort weckt ein junges Weibchen sein Interesse. Der paradiesische Hotelgarten von Velvets Sifaka-Familie lockt verschiedenste Tierarten an, die sich an den Wasserhähnen und reifen Früchten laben. Unter ihnen ist auch eine andere Sifaka-Gruppe, die Velvets Clan ihr Territorium streitig machen will. Eine Aye-Aye-Familie verschafft sich Zugang zu einem nicht enden wollenden Quell an köstlichen Erfrischungen. Endlich bringt ersehnte Regen Erlösung bringt. Und mit ihm kommt nicht nur ein besonders schmackhafter Snack für die Schwarzmakis - es gibt auch Nachwuchs. Die Lemuren Madagaskars können auf wachsende Unterstützung zählen - durch Aufklärung und kontinuierliche Arbeit versuchen ihre menschliche Verbündeten, die Lemuren und ihre Wälder zu schützen. Österreich 2026
