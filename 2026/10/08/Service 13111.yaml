  title: Man vs. Time - Im Wettlauf mit der Zeit
  subtitle: Selbstbedienung
  description: |-
    Selbstbedienungssysteme haben unsere Art zu leben und zu konsumieren grundlegend verändert. Vom ersten Münzautomaten in der Antike bis hin zu modernen, vollautomatisierten Supermärkten ohne Personal: der Gedanke, Aufgaben eigenständig und effizient zu erledigen, prägt unsere Gesellschaft. Fortschritt scheint Kontrolle, Schnelligkeit und Unabhängigkeit zu versprechen. Doch ist Selbstbedienung wirklich so effizient und bequem, wie das auf den ersten Blick wirkt oder führt uns diese Technologie in die Irre?
    Wir leben in einer Welt, in der Selbstbedienung und Automatisierung längst zum Alltag gehören. Ob beim Einkaufen, Reisen oder Arbeiten - viele Tätigkeiten, die früher von Fachkräften übernommen wurden, erledigen wir heute selbst. Mit einem Klick buchen wir Flüge, bestellen Produkte, erstellen unsere Steuererklärung oder stellen unser Essen zusammen. Doch welche Folgen hat diese Entwicklung für unser Leben, unseren Alltag und unser Verständnis von Zeit und Effizienz?
    Dokumentarfilm, Kanada 2025, R: Leo Singer, Michel D.T. Lam  , Pierre-Luc Robillard
  widescreen: true
