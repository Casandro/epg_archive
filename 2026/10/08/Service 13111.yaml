  title: Hubert ohne Staller
  subtitle: Harte Landung
  description: |-
    Eine hupende Alarmanlage führt Hubert und Girwidz in den Hochseilgarten von Wolfratshausen. Erst vermuten sie einen Einbruch, dann einen Fehlalarm, bis sie den Besitzer des Kletterparks unter einer Plattform entdecken: tot. Dr. Fuchs findet schnell raus, dass es sich bei dem Absturz um keinen klassischen Arbeitsunfall handelt, denn die Spuren an der Leiche deuten auf einen vorangegangenen Zweikampf in zehn Meter Höhe hin. Als die Polizisten rausfinden, dass das Gelände des Parks verkauft werden sollte, führen alle Hinweise zum Bruder des Toten, der den Verkauf mit aller Macht verhindern wollte. Aber war es wirklich Brudermord? Und welche Rolle spielt dabei der Käufer des Geländes, von dem der Tote ein zerrissenes Foto in der Tasche hatte? Auf die Hilfe der Kollegen müssen Hubert und Girwidz dieses Mal fast komplett verzichten, denn die haben mit einem Findelkind aus der Bäckerei bereits alle Hände voll zu tun.

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Matthias Steurer
