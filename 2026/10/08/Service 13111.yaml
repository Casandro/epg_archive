  title: Verschwörung
  description: |-
    Die junge Schwedin Lisbeth Salander (Claire Foy) rächt sich brutal an Männern, die Frauen schwer verletzen oder vergewaltigen. Der Grund hierfür liegt in der Vergangenheit. Lisbeth und ihre Schwester Camilla wurden von ihrem Vater, dem Boss eines Verbrechersyndikats, tyrannisiert. Lisbeth gelang die Flucht, aber ihre Schwester verblieb in den Fängen des Psychopathen. In der Zwischenzeit hat sich Lisbeth als Hackerin in der kriminellen Unterwelt einen Namen gemacht. Von dem Informatiker Frans Balder erhält sie einen besonderen Auftrag: Balder entwickelte für die US-Regierung ein Programm, mit dem alle Online-Verteidigungssystem der Welt ausgeschaltet werden können. Doch nun soll Lisbeth für Balder eine Kopie herstellen und das Original vernichten. Die Mission gelingt, aber wenig später wird Lisbeth der Laptop mit der Kopie gestohlen. Nachdem Balder ermordet wurde, kann nur sein Sohn das Programm entschlüsseln. Lisbeth nimmt das Kind unter ihren Schutz und macht sich auf die Suche nach der Verbrecherbande.

    Der Thriller "Verschwörung" basiert auf dem vierten Roman "Was uns nicht umbringt" der Millennium-Krimreihe. Die erste Trilogie von Stieg Larsson wurde komplett verfilmt, unter anderem von David Fincher ("Verblendung"). Die atmosphärisch düstere Adaption der vierten Buchvorlage stammt von Fede Álvarez ("Don't Breathe"). Protagonistin ist erneut die introvertierte, mit Tätowierungen bedeckte Superheldin Lisbeth Salander. Beeindruckend in der Hauptrolle Claire Foy (die junge Elisabeth II. in der TV-Serie "The Crown").
    Thriller, Vereinigte Staaten Von Amerika 2018, R: Fede Álvarez
