  title: P.M. Wissen
  subtitle: Braunes Fett - Ein Bonus für die Gesundheit?
  description: 'Selbst bei gleicher Ernährung und Bewegung nehmen einige Menschen weniger zu als andere. Eine Erklärung für dieses Phänomen könnte das "braune Fett" sein. Dieses besondere Fettgewebe ist nicht bei jedem gleichermaßen vorhanden: manche haben mehr dieser braunen Fettzellen, manche weniger. Es unterscheidet sich vom weißen Fettgewebe darin, dass es Fett nicht speichert, sondern verbrennt und in Wärme umwandelt. Könnten wir unser braunes Fett künstlich vermehren und dadurch zusätzlich Kalorien verbrennen? // Vier Personen, die sich nie zuvor gesehen haben, treffen sich in einem Wiener Escape Room. Sie werden in einem Raum eingeschlossen. Heraus kommen sie nur, wenn sie bestimmte Rätsel und Aufgaben lösen. Und das geht nur in Teamarbeit gemeinsam. Beobachtet werden sie dabei von Dr. Konstantin Mitgutsch. Der Sozialforscher und Spieleentwickler hat viele solcher Escape Rooms selbst konzipiert, Teamwork erforscht er seit vielen Jahren. Was aber macht ein gutes Team aus, und wie lassen sich Teams optimieren? // Bis 2030 will Österreich seinen Strom zu 100 Prozent aus erneuerbaren Energien gewinnen. Die Solarenergie spielt dabei eine wichtige Rolle. Der Kärntner Physiker Hermann Kopetz will mit seiner neu entwickelten Photovoltaik-Anlage, der sogenannten "Solar-Pappel", hoch hinaus - und zwar auf unsere Berge. Sein Prototyp soll am Berg bis zu zehn Mal mehr Strom erzeugen als Photovoltaik-Anlagen im Tal. // Außerdem: Schüler auf Raumfahrt-Mission // Wer ist das beste Team im Tierreich? // Wie verhindern wir Weltraumschrott? // Wie wachsen Seeotter-Babys auf? Österreich 2023'
