  description: |-
    Eine Reise zu den Wurzeln der Musik der Seer. Mit den Musikern erleben wir Handwerk, Brauchtum, kulinarische Spezialitäten und vor allem die einzigartige Natur der Region. Sie singen gemeinsam am Lagerfeuer und sie treffen auf Menschen, die besonderen Leidenschaften nachgehen. Fred geht mit Albrecht Syen auf dem Toplitzsee fischen, Astrid erkundet mit Höhlenforscher Robert Seebacher das Innere des Gebirgsstocks der Tauplitzalm, Sabine lernt die Bäuerin und ehemalige Dorfrichterin von Gößl Heidi Rastl kennen und Jürgen Leitner kocht gemeinsam mit Stephan Wieland in der neu eröffneten Jausenstation Seewiese. Dieses Heimatleuchten zeigt einen ganz persönlichen Blick auf das Salzkammergut und verrät, wo und wie die Seer die Seele ihrer Heimat besonders spüren.
