  subtitle: 'Pater Max Cappabianca: Vom Schreibtisch im Vatikan zur Studierendenseelsorge in Berlin'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Leben von Pater Max Cappabianca hat Kontraste: Jahrelang hatte er im Vatikan mit Ordensmännern und Amtsinhabern zu tun. Nun ist er Seelsorger für Studenten in Berlin. So unterschiedlich die Aufgaben für den Dominikanerpater auch waren, seine Botschaft ist klar: Gott gibt Halt. Das gilt im Leben eines Studenten genau wie im Leben eines Kardinals. Im Gespräch mit seinem alten Bekannten, Moderator Wolfgang Severin, gibt Cappabianca Einblicke in die Arbeit des Vatikans und die Seelsorge in Berlin.'
