  title: Planet Weltweit - Der Affenflüsterer
  subtitle: Planet Weltweit - Der Affenflüsterer
  description: Schimpansen, die nächsten Verwandten des Menschen, sind in Zoos und in Zirkusunternehmen eine beliebte Attraktion. Oft werden sie jedoch mehr als schlecht gehalten und sind nach wie vor gefragte Versuchstiere in Forschungslabors. Auch bei Privatleuten, die illegal Schimpansen halten, leider viele dieser Tiere. Die niederländische Stiftung AAP befreit misshandelte Menschenaffen, päppelt sie in einer Auffangstation nahe Amsterdam auf und bringt sie erstmals mit Artgenossen zusammen. Wenn sie körperlich und seelisch genesen sind, können sie in ein Freigehege der Stiftung in Spanien umgesiedelt werden und dort fast wie in freier Natur leben.  David van Gennep stieß schon als Teennager zur Stiftung "AAP" (holländisch für "Affe") und arbeitete neben der Schule hier als Tierpfleger. Heute, mit 44 Jahren, ist der Biologe und Immunologe Chef dieser Stiftung und ein echter "Affenflüsterer". Wie kaum ein anderer versteht er es, mit den Tieren zu kommunizieren. Die Rettung und Resozialisierung von Schimpansen ist längst zu seiner Lebensaufgabe geworden. Ständig reist er quer durch Europa, manchmal bis in die USA, um misshandelte Menschenaffen aufzuspüren und zu befreien. Die entscheidenden Tipps bekommt er meist von Tierschützern. Manchmal dauert es Monate, bis die alarmierten Behörden reagieren und ein Tier beschlagnahmt werden kann. So geschehen auch bei Fiffi. Jahrelang lebte die Schimpansendame eingepfercht in einem engen, rostigen Käfig im Obergeschoss eines abgehalfterten Safariparks nahe Paris, bevor sie befreit werden konnte. Tiefe Kratzspuren an den Wänden zeugten davon, dass sie versucht hatte, sich selbst zu befreien. Das verwahrloste Tier wog bei seiner Befreiung über 90 Kilo. Das war vor zwei Jahren. Heute ist sie 35 Kilo leichter und Mittelpunkt einer neu zusammengestellten Affengruppe. Die erfolgreiche Integration in neue Familienverbände ist die Aufgabe von David und seiner rechten Hand, dem Ungarn Mike Seres. DE 2011
