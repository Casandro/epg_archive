  title: Planet Weltweit - Wilde Pferde im Donaudelta
  subtitle: Planet Weltweit - Wilde Pferde im Donaudelta
  description: 'Das rumänische Donaudelta gilt als eines der letzten Naturparadiese: Es ist ein kilometerweites Geflecht aus Röhrichten, schwimmenden Inseln und Flussarmen und ein Rückzugsgebiet vieler bedrohter Tierarten. Auch die größte Pelikankolonie Europas lebt hier. In den letzten zwei Jahrzehnten ist eine weitere Spezies hinzugekommen: wilde Pferde. Als die kommunistischen Kolchosen ihre Dienste einstellten, strömten Hunderte von Arbeitspferden in das Delta. Über 2.000 leben heute in den Wiesen und Wäldern der Region. Naturschützer laufen inzwischen Sturm gegen diese ungebremste Ausbreitung, denn die Herden drohen das natürliche Gleichgewicht im Delta zu zerstören. Die Dokumentation hat miterlebt, wie Naturliebhaber und Ökologen um die neuen wilden Pferde streiten. Mugur Pop ist Pferdezüchter aus Leidenschaft: Die Vierbeiner bestimmen sein Leben, seit er denken kann. Ganz besonders liegen ihm die Herden wilder Pferde am Herzen, die seit dem Zusammenbruch des kommunistischen Systems im Donaudelta leben. Forscher vermuten, dass diese Pferde eine neue Rasse gebildet haben könnten. Doch ihre Zukunft ist bedroht. Umweltschützer behaupten, dass der einzigartige Letea-Wald im Delta, der mit seinen Lianen, Eichen und Birken als nördlichster tropischer Urwald Europas gilt, von den Pferden zerstört wird. Deshalb drängen sie die rumänische Regierung zum Handeln. Die Tiere sollen gefangen oder zumindest in ihrem Bestand reduziert werden. Mugor Pop glaubt nicht daran, dass es eine Lösung ist, die Pferde zu töten. Er ist davon überzeugt, dass die Pferdeherden und der Wald nebeneinander existieren können. Zusammen mit dem Tierarzt Stefan Raileanu sucht er nach Lösungen zur Rettung der Tiere. In diesem Jahr begleitet Mugor die Jugendlichen aus dem Dorf Letea bei ihrer Jagd auf neue billige Arbeitstiere. Er beobachtet, wie sie die Tiere in einem halsbrecherischen Unternehmen einfangen und anschließend gefügig machen. Das geschieht nicht immer zum Wohl der Tiere. DE 2009'
