  title: Planet Weltweit - Der Andenkondor, König der Lüfte
  subtitle: Planet Weltweit - Der Andenkondor, König der Lüfte
  description: Mit drei Meter Flügelspanne ist der Anden-Kondor der größte flugfähige Vogel Südamerikas - und einer der elegantesten der Welt. Mehrere Hunderte Kilometer kann er am Tag zurücklegen, wobei er die Aufwinde im südamerikanischen Andengebirge geschickt nutzt, um Energie zu sparen. In den letzten Jahren hat sich seine Heimat dramatisch verändert, was den Kondor immer weiter zurückdrängt. Der Ornithologe Lorenzo Sympson und der Paraglider Martin Vallmitjana wollen gemeinsam die Flug- und Lebensweise der Vögel erforschen und so nach einer Überlebenschance für die Tiere zu suchen. Über Jahrhunderte galt der Andenkondor als unumschränkter König der südamerikanischen Lüfte. Zu Zeiten als das Gebirge noch vor allem von Indios bewohnt wurde, die in Eintracht mit der Natur lebten und in den Tieren des Hochgebirges nicht selten Gottheiten sahen, war der Kondor hoch verehrt. Als westliche Siedler in das Gebirge vordrangen und ihre Herden mitbrachten, wurde das den Kondoren zum Verhängnis. Durch leichte Beute angelockt, folgten Pumas den Herden und rissen Tiere. Weil die Kondore als Aasfresser die Überreste der toten Tiere vertilgten - an einem gerissenen Schaf können sich bis zu 20 Kondore einfinden -, wurden auch sie für die Farmer zum Sinnbild einer feindlichen Umwelt und deshalb gnadenlos gejagt. Bis heute hat sich der Bestand nicht erholen können, im Gegenteil, die Kondorpopulation geht weiter zurück.  Der Ornithologe Lorenzo Sympson erforscht das Verschwinden der Vögel, er gilt als einer der führenden Experten auf diesem Gebiet. Seit Jahren besucht er die Brutplätze der Tiere, die stets in größeren Gruppen zusammenleben, hoch oben im Andengebirge und beobachtet ihr Verhalten. Inzwischen befestigt er sogar kleine Kameras an den Horsten, die ihm ein genaues Bild von der Jungenaufzucht der Elternpaare liefern sollen. Solche Bilder hat es bisher noch nicht gegeben. DE 2011
