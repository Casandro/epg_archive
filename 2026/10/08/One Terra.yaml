  title: Planet Weltweit - Sumatras letzte Orang-Utans
  subtitle: Planet Weltweit - Sumatras letzte Orang-Utans
  description: "Nur noch etwa 6000 Orang-Utans leben heute auf Sumatra. Pessimistischen Schätzungen zufolge stehen die Chancen für die bedrohte Art, die nächsten zehn Jahre zu überleben, sehr schlecht. Grund dafür ist, dass ihr natürliches Habitat zunehmend Palmölplantagen weichen muss; etwa 70 Prozent der indonesischen Insel sind heute schon davon bedeckt. Zudem sieht ein Großteil der einheimischen Bevölkerung die Tiere eher als Unterhaltungsobjekte statt als schützenswertes Nationalerbe. Letzteres ändert sich zwar langsam, könnte für die Menschenaffen aber zu spät sein. Der Engländer Ian Singleton arbeitet seit 20 Jahren daran, den Orang-Utans ein Refugium zu schaffen, in dem die letzten ihrer Art ungestört leben und sich im besten Fall wieder vermehren können. \nDie sechsjährige Togur hat den Großteil ihres Lebens im Haus eines indonesischen Offiziers verbracht, genauer gesagt: angekettet in seinem Hinterhof, um dort Kinder und Gäste zu erfreuen. Wie sie werden vermutlich 50 Prozent aller auf Sumatra lebenden Orang-Utans in Gefangenschaft gehalten, meist unter jämmerlichen Bedingungen und zum Großteil von hohen Funktionsträgern wie Polizisten, Politikern und Militärangehörigen. Entsprechend schwer ist die Aufgabe von Dr. Ian Singleton, dem Leiter des Sumatra-Orang-Utan-Schutzprogramms (SOCP): Er befreit die Tiere aus den offiziell verbotenen Haltungen, um sie im Idealfall in einem Nationalpark wieder auszuwildern. Oder zumindest artgerechter leben zu lassen. Jedes einzelne Tier zählt, um der hochgradig gefährdeten Art das Überleben zu sichern. Denn der Lebensraum der schätzungsweise 6000 verbliebenen Tiere wird durch die Ausbreitung der wirtschaftlich enorm erfolgreichen Palmölplantagen weiter eingeschränkt. Etwa 80 Prozent des Lebensraumes der Orang-Utans wurden in den letzten 25 Jahren abgeholzt. Um den Affen letzte Rückzugsmöglichkeiten zu bieten, hat die Regierung nun geeignete Gebiete Sumatras unter Schutz gestellt. DE 2011"
