  title: Planet Weltweit - Gletscherflieger - Faszination in Weiß
  subtitle: Planet Weltweit - Gletscherflieger - Faszination in Weiß
  description: 'Planet Weltweit: In der Schweiz retten die Piloten, Ärzte und Sanitäter der REGA, der Schweizer Rettungsflugwacht, täglich Leben. Ein komplexer und gefährlicher Job, der ein hohes Maß an Können und Einfühlungsvermögen voraussetzt. Neben den Helikoptern gibt es in den Schweizer Alpen auch kleine, leichte Propellermaschinen auf Skiern, die auch auf eisigen Pisten landen können. Die Gletscherfliegerei gilt als eine der Königsdisziplinen für Pilotinnen und Piloten. Isabel Menzi ist im Hauptberuf Pilotin bei einer Schweizer Fluggesellschaft. Doch sie liebt nicht nur die großen Jumbos, sondern auch die kleinen Gletscherflugzeuge, mit denen sie regelmäßig in den Hochalpen unterwegs ist. Sie will Gletscherpilotin werden. Diese fliegerische Tradition rettete schon Tausenden Menschen das Leben, obendrein machte sie Bau und Versorgung zahlreicher Berghütten in den Schweizer Alpen erst möglich. Das Gletscherfliegen ist besonders schwierig, da etwa in der weißen, schroffen Bergwelt das Gelände für die Landung oft nur schwer zu erkennen ist. Hinzukommen unberechenbare Faktoren wie Wind und Schneebeschaffenheit. Ohne die Gletscherfliegerei könnte auch Notarzt Joachim Koppenberg seinen Job heute kaum ausüben. Er sitzt zwar im Hightech-Helikopter, muss sich aber auf die Erfahrung und das Können seines Piloten verlassen. Nur so kann er in wenigen Minuten von seiner Basis in Samedan zu jedem noch so entlegenen Unglücksort in den Bergen gelangen. DE 2021'
- eventId: 1500892
  start: 2026-10-08T21:15:00Z
