  title: Planet Weltweit - Jenny und ihre Flughunde
  subtitle: Planet Weltweit - Jenny und ihre Flughunde
  description: |-
    Die Nordostküste Australiens ist die biologisch artenreichste Region des gesamten Kontinents. Sie ist auch die Heimat der Flughunde, die einst zu Hunderttausenden den 400 Kilometer langen Küstenstreifen bevölkerten. Doch die Populationen sind dramatisch gesunken - auch weil Obstfarmer die gefräßigen Fledertiere mit allen Mitteln bekämpft haben. In den letzten Jahren ist eine neue Gefahr für die Flughunde hinzugekommen: Eine mysteriöse Krankheit, die viele Tiere im Herbst befällt und sie von den Bäumen zu Boden stürzen lässt, wo sie qualvoll verenden. Jenny Maclean hat ihr Zuhause in ein Flughund-Hospital umgebaut, in dem sie Hunderte der possierlichen Tiere gesund pflegt. Planet Weltweit hat sie und ihre kleinen Patienten besucht.

    Es ist November in den Atherton Tablelands im Norden des australischen Bundesstaates Queensland. Jenny Maclean ist hier auf Rettungsmission. In der Gegend ist sie als Retterin der Flughunde bekannt, eine zweifelhafte Bezeichnung in einer Region, die hauptsächlich vom Obstanbau lebt und in der Flughunde von vielen als Schädlinge betrachtet werden. Jenny sucht nach Tieren, die gelähmt am Boden liegen, infiziert von einem Erreger, der die Tiere jeden Herbst befällt und sie zu Hunderten von den Bäumen stürzen lässt. Wissenschaftler konnten bisher weder die Herkunft noch die Wirkungsweise dieses Parasiten klären. Klar ist nur, dass er die Tiere vorrangig zur Zeit der Jungenaufzucht befällt. Mütter stürzen gleichzeitig mit ihren Jungen zu Boden, wo beide verenden. Diese Entwicklung ist umso dramatischer, als sich die Population erst in den letzten Jahren etwas erholt hat. Bis die Regierung die Jagd auf Flughunde unter Strafe stellte, schossen Obstfarmer die Tiere zu Tausenden ab. Neue Schutzmethoden wie Sicherheitsnetze haben das Verhältnis zwischen Mensch und Tier heute verbessert, durch den Parasiten sinkt die Flughundpopulation jedoch weiter. Jenny Maclean stellt sich dieser Entwicklung entgegen. DE 2011
