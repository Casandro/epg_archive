  title: Planet Weltweit - Kolumbien - Ein Riesenrad auf Reisen
  subtitle: Planet Weltweit - Kolumbien - Ein Riesenrad auf Reisen
  description: Lautes Kinderlachen hallt von jedem Platz, auf dem César Romoleroux mit seiner Kirmes Station macht. Zu seinem fahrbaren Vergnügungspark gehören unter anderem ein Riesenrad, ein Autoscooter und mehrere Kinderkarussells. Seit zehn Jahren reist er mit seinen Fahrgeschäften quer durch die kolumbianischen Anden, eine Gegend, die bis vor kurzem noch Bürgerkriegsgebiet war. Die Reportage hat César Romoleroux bei seinen ungewöhnlichen Reisen begleitet und mit ihm ein Land erlebt, welches mühsam versucht, sich aus dem Schatten der Vergangenheit zu lösen und in eine neue, erfreulichere Zukunft zu steuern. Drei Wochen war César Romoleroux mit seiner Kirmes in dem Dorf Aguadas - jetzt bereitet er zusammen mit seinen Angestellten und einigen Tagelöhnern den Abtransport vor. Er besucht mit seinem Jahrmarkt nur die kleinen Dörfer auf dem Land. Jedes Mal wird er von den Leuten, insbesondere den Kindern, freudig empfangen, bietet er ihnen doch eine willkommene Abwechslung nach all den Jahren des Bürgerkriegs, welcher das Land bis heute innerlich zu zerreißen droht. Insgesamt reist César Romoleroux seit zehn Jahren mit seiner Kirmes von Ort zu Ort. Neben den politischen Problemen muss er sich mit den kleinen, alltäglichen Sorgen herumschlagen, die solch ein Unternehmen zu bewältigen hat - Kurzschlüsse in den Stromleitungen, Wetterkapriolen und die persönlichen Befindlichkeiten, die ein Leben auf Wanderschaft mit sich bringt. So ist Cesar seit einem halben Jahr Vater eines kleinen Sohnes; einer seiner Mitarbeiter erwartet Zwillinge. Zudem muss eine Kirmes ihren Gästen ständig etwas Neues bieten, um nicht langweilig zu werden. In diesem Jahr plant Cesar deshalb den Bau einer Piratenschaukel. Ein riskantes Unternehmen, denn solch eine neue Attraktion kostet etwa 35.000 Euro. Ein Arbeiter verdient auf dem Land jedoch kaum mehr als zwei Euro am Tag und muss davon die ganze Familie ernähren. DE 2007
