  title: Rund um den Globus - Russlands Zirkusschule auf Tour
  subtitle: Rund um den Globus - Russlands Zirkusschule auf Tour
  description: 'Am sonst so stillen Ufer des Seligersee zwischen Moskau und St. Petersburg ist einiges los. Hier bringen die jungen Studenten der Moskauer Zirkusschule Abwechslung in das Leben der Dorfbewohner. Laut schallt die Musik, während Jelena im weißen Tüllrock auf acht übereinanderliegenden Rollen schwankt. Groß ist auch das Staunen bei der Vorführung der biegsamen Schlangenfrau Alessa, die keine Knochen zu haben scheint oder wenn Pawel seine zehn Jongleur-Ringe durch die Luft wirbelt. "Ich glaube, wenn wir dem Publikum mit offenem Herzen begegnen, werden sie uns auch so empfangen", sagt Jelena. Trainer Igor Teplov lacht zufrieden. Er will den Jugendlichen zeigen, was den Kern des Artistenlebens ausmacht: Trainieren und Auftreten, ob bei Sonne oder Wind, auf der Wiese oder auf einem Boot. DE 2011'
