  title: Planet Weltweit - Falklandinseln, Pinguine auf dem Vormarsch
  subtitle: Planet Weltweit - Falklandinseln, Pinguine auf dem Vormarsch
  description: |-
    Die Falklandinseln - ein Archipel im Atlantik, unweit des südamerikanischen Festlands. 1982 kämpften hier Argentinien und Großbritannien in einem blutigen Krieg um die Vorherrschaft. Insgesamt mussten auf beiden Seiten fast 1000 Menschen ihr Leben lassen, bevor die argentinischen Truppen kapitulierten. Heute sind die rund 700 Inseln des britischen Überseeterritoriums wieder ein Naturparadies: Hunderttausende Pinguine bevölkern die Küste, die knapp 3000 Menschen hier leben den "british way of life" und versuchen, mit der wirtschaftlichen und territorialen Isolation zurecht zu kommen. 12.600 Kilometer von London entfernt. Die Dokumentation hat die raue Schönheit der Falklandinseln mit der Kamera eingefangen und ist eingetaucht - in das Leben der Pinguinkolonien am Ende der Welt.

    Sally Poncet, gebürtige Australierin, lebt seit über 30 Jahren auf den Falklandinseln. Die Biologin kümmert sich um den Schutz der Pinguine, besonders der einen Meter großen Königspinguine, die hier in großen Kolonien leben und brüten. Der Erhalt und die Wiederherstellung der ursprünglichen Natur stehen im Mittelpunkt ihrer Arbeit.  Fünf von weltweit 18 Pinguinarten leben auf den Falklandinseln, Hunderttausende Brutpaare. Menschen hingegen sind selten: nur knapp 3000 Insulaner wohnen hier, rund 600 Kilometer vor der argentinischen Küste - die meisten sind Briten. Seit dem Falklandkrieg gibt es keinerlei wirtschaftliche Verbindungen zum südamerikanischen Nachbarn, nicht einmal eine Schiffs- oder Flugverbindung existiert. Aber die Falkländer haben sich eingerichtet in der Isolation. Wer sich zwischen den Falklandinseln fortbewegen will, bemüht die inseleigene Fluglinie. Man fliegt mit Troyd, dem Inselpiloten; Lebensmittel kommen aus Chile oder dem fernen England. Doch die Narben des Krieges sind weiterhin sichtbar - etwa auf den noch immer nicht geräumten Minenfeldern oder den weißen Holzkreuzen für die gefallenen Argentinier. DE 2010
