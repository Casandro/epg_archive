  description: 'Wer im Kaffeeanbaugebiet Kolumbiens etwas auf sich hält, fährt einen "Willys". Der legendäre und robuste Geländewagen aus den USA wurde bekannt als "das Auto, das den zweiten Weltkrieg gewann." Seit den 1950iger Jahren ist der Vater aller Jeeps auch in Kolumbien im Einsatz, denn das robuste Fahrzeug ist wie geschaffen für das bergige Gelände. Bis zu 50 Prozent Gefälle müssen die Willys bewältigen. Etliche Fincas sind nur über halsbrecherische, unbefestigte Pisten erreichbar. Im Macho-Land Kolumbien saßen bislang nur Männer am Lenkrad der Geländewagen. Johana Londoño setzt dieser Tradition ein Ende. Seit 14 Jahren schon gehört der "Willys" zu Johana Londoños Familie. Der Jeep, Baujahr 1963, wurde vom Vater an die Tochter weitergegeben. Die 25jährige Johana ist die einzige hauptberufliche Willys-Fahrerin des Landes. Sie verdient sich ihr Geld mit dem Jeep als Taxifahrerin rund um die Provinzstadt Calarcá. Am Anfang reagierten die Menschen skeptisch auf die junge Frau hinter dem Steuer. Viele Fahrgäste hatten Angst, von ihr chauffiert zu werden. Nach und nach aber hat sich Johana Londoños ihren Platz in der Männerwelt der Willys-Fahrer erkämpft. Kaum jemand fährt sicherer als sie: schließlich hat Johana das Jeep-Fahren schon als Mädchen auf Kolumbiens abenteuerlichen Bergpisten an den Hängen der zentralen Andenkordillere erlernt. Wie viele Familien sind auch die Londoños wirtschaftlich von dem Geländewagen abhängig: Neben dem Taxifahren transportiert Johana regelmäßig die Kaffee- und Bananenernte von der 20 Hektar großen Finca zu den Händlern im Umland. Das Vehikel ist dafür ideal: Viele sagen: Willys sind die "mulas con motor" - die motorisierten Esel. Die Geschichte der Willys begann 1940, als die US-Armee ein kleines, geländegängiges Fahrzeug für den Einsatz im Krieg entwickeln ließ. Die Firma "Willys-Overland" bekam den Zuschlag. DE 2008'
