  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Die Rätsel des Bermudadreiecks (Teil 1)
  description: "Verschwundene Schiffe, abgestürzte Flugzeuge oder Navigationsgeräte, die plötzlich außer Kontrolle geraten: Die rätselhaften Phänomene, die immer wieder aus dem Bermudadreieck gemeldet werden, sind vielfältig und kaum zu glauben. Um sich selbst ein Bild von den mysteriösen Ereignissen zu machen, reist Abenteurer Josh Gates in die Karibik, wo er neben Augenzeugen und Wracktauchern auch auf Raumfahrtingenieure trifft, die das Thema aus einem wissenschaftlichen Blickwinkel beleuchten. Ihrer Theorie zufolge könnten Anomalien im Erdmagnetfeld für die bizarren Berichte verantwortlich sein... \nUSA 2019"
  widescreen: true
