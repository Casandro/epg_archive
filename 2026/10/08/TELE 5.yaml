  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Das Herz des Sultans
  description: "Das Grab von Süleyman dem Prächtigen ist eines der merkwürdigsten Rätsel der Weltgeschichte. Der Sultan regierte das Osmanische Reich im 16. Jahrhundert und hat fast ganz Europa erobert. 1566 starb er während einer erbitterten Schlacht im heutigen Ungarn. Die Legende besagt, dass das Herz des siegreichen Sultans immer noch weiter schlägt. Es wurde in einem goldenen Behälter begraben und ist seither verschollen. Josh Gates begleitet ein Archäologen-Team, das glaubt, die Überreste des einstigen Herrschers am Dorf Turbek entdeckt zu haben. Stehen die Forscher kurz davor, die geheimnisvolle Grabstätte Süleymans zu öffnen? \nUSA 2019"
  widescreen: true
- eventId: 1517171
