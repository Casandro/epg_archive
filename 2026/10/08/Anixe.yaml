  title: 'Der Missionsdienst von David Hathaway - Erwarte größere Wunder: Lebe in der ganzen Kraft Gottes'
  subtitle: 'Der Missionsdienst von David Hathaway - Erwarte größere Wunder: Lebe in der ganzen Kraft Gottes'
  description: Es ist ein Leichtes, die Schrift aufzuschlagen, über die Teilung des Meeres oder das auf den Berg Karmel herabfallende Feuer zu staunen und anzunehmen, dass Gottes größte Taten ausschließlich der fernen Vergangenheit angehören. Doch Gott ist kein Relikt der Antike. Derselbe Gott, der das Leben ins Dasein rief, besitzt auch heute eine unbändige Kraft - und Er möchte sie in unserer Generation auf eine Weise offenbaren, wie es sie noch nie zuvor gegeben hat.  Das Kreuz in der Mitte hält den Schlüssel bereit.
