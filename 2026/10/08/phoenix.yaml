  title: Welten-Saga II
  subtitle: Die Schätze des Nahen Ostens
  widescreen: true
  hd: true
  description: Christopher Clark besucht die Geburtsstätten uralter Mythen und Religionen, die der Weltgeschichte bis heute ihren Stempel aufgedrückt haben. Die filmische Reise führt den Moderator vom Pharaonenreich am Nil über das christliche Katharinenkloster auf dem Sinai zu den heiligen Stätten Jerusalems, weiter zur modernen Metropole Tel Aviv und schließlich zum Toten Meer und der antiken Festung Masada.
