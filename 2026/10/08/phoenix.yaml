  title: Welten-Saga II
  subtitle: Die Schätze Griechenlands und der Türkei
  widescreen: true
  hd: true
  description: In dieser Welten-Saga begibt sich Historiker und Moderator Christopher Clark auf die Suche nach den Spuren vergangener Reiche und ihrer Metropolen in Griechenland und in der Türkei. Von Istanbul aus geht es ins anatolische Kappadokien und zu den Naturwundern von Pamukkale, weiter zur Insel Rhodos und zu den Meteora-Klöstern und schließlich ins antike Olympia, der Geburtsstätte der Spiele, die noch heute die Welt bewegen.
