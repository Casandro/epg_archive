  title: Ein Jahr in Kanadas Wildnis
  subtitle: Frühling
  widescreen: true
  hd: true
  description: 'Überall passt sich die Natur an die unterschiedlichen Jahreszeiten an, doch in Kanada sind die Wechsel extrem, spektakulär und vor allem eins: unvorhersehbar. Die bildstarke Reihe zeigt in vier Folgen, wie sich die vielfältige Tier- und Pflanzenwelt Kanadas auf die Wetterlagen einstellt, und erkundet an außergewöhnlichen Orten das Zusammenspiel der Natur: Eisbären beim sommerlichen Jagen in offenen Gewässern, Glühwürmchen beim leuchtenden Balztanz und Luchse, die auf der Suche nach Beute die verschneiten Wälder durchstreifen.'
- eventId:
  - 774124
  - 977286
  start: 2026-10-08T01:00:00Z
  stop: 2026-10-08T01:45:00Z
  title: Ein Jahr in Kanadas Wildnis
  subtitle: Sommer
  widescreen: true
  hd: true
  description: 'Im Sommer entfaltet die Schönheit der kanadischen Landschaften ihren Höhepunkt. Die Reise beginnt auf einer Insel vor der Pazifikküste, wo gerade 4.000 kleine Seelöwenbabys geboren wurden. Unweit davon kommen Exoten zu Besuch: Blauhaie, riesige Quallen und der Mondfisch. In der Arktis passieren 3000 Belugawale die Mündung eines Flusses, der in die Hudson-Bucht mündet. Die warmen, geschützten Gewässer sind ein idealer Geburtsort für ihre Jungen.'
