  title: Ein Jahr in Kanadas Wildnis (1/4)
  subtitle: Frühling
  widescreen: true
  hd: true
  description: 'Überall passt sich die Natur an die Jahreszeiten an, doch in Kanada ist der Wechsel extrem, spektakulär und vor allem eins: unvorhersehbar: Nach den langen, dunklen Wintertagen erwacht die Natur allerorts zu neuem Leben. Im Norden Québecs sind die Karibu-Weibchen zu einer 600 Kilometer langen Wanderung aufgebrochen. Ein Rennen gegen die Zeit beginnt, denn die Tiere müssen ihr Ziel erreichen, bevor ihre Jungen zur Welt kommen. An den Ostküsten lernen derweil junge Schwarzbären auf Bäume zu klettern und Seeotter spielen im Tang. Das Frühjahr zeigt somit vor allem eins: Früh übt sich, wer den Gefahren der Wildnis die Stirn bieten will.'
- eventId:
  - 774124
  - 977286
  start: 2026-10-08T01:00:00Z
  stop: 2026-10-08T01:45:00Z
  title: Ein Jahr in Kanadas Wildnis (2/4)
  subtitle: Sommer
  widescreen: true
  hd: true
  description: 'Der Sommer bringt die Schönheit der kanadischen Landschaften auf ihren Höhepunkt. Die Reise beginnt auf einer Insel vor der Pazifikküste, wo gerade 4.000 kleine Seelöwenbabys geboren wurden. Unweit von der Robbenkolonie kommen Exoten zu Besuch: Blauhaie, riesige Quallen und der Mondfisch. Während den Sommermonaten lernen die Jungtiere die wichtigsten Dinge auf dem Weg zur Selbstständigkeit. Ihre Eltern lassen sie dabei noch nicht aus den Augen. In der Arktis passieren 3.000 Belugawale die Mündung eines Flusses, der in die Hudson-Bucht mündet. Die warmen, geschützten Gewässer sind ein idealer Geburtsort für ihre Jungen.'
- eventId:
  - 774125
  - 977287
  start: 2026-10-08T01:45:00Z
  stop: 2026-10-08T02:30:00Z
  title: Ein Jahr in Kanadas Wildnis (3/4)
  subtitle: Herbst
  widescreen: true
  hd: true
  description: Im Herbst wandeln sich die kanadischen Wälder in ein Farbenmeer. Es ist die Zeit der großen Wanderungen. Drei Viertel aller Vogelarten, die in Kanada genistet haben, ziehen wieder gen Süden. Im stürmischen Wasser vor der zerklüfteten Küste British Columbias wacht der Pazifische Riesenkrake sechs Monate lang über sein Gelege von über 80.000 Eiern, um kurz nach dem Schlüpfen der Jungen zu sterben. In der Hudson Bay sichern die hungrigen Eisbären ihr Überleben, indem sie weiter Richtung Meer wandern, wo sie auf den Einbruch des Winters warten und darauf, dass sich Eisbänke herausbilden.
- eventId:
  - 774126
  - 977288
  start: 2026-10-08T02:30:00Z
  stop: 2026-10-08T03:10:00Z
  title: Ein Jahr in Kanadas Wildnis (4/4)
  subtitle: Winter
  widescreen: true
  hd: true
  description: Der Winter ist in Kanada die längste und härteste Jahreszeit. Im Norden dauert der Winter mehr als sechs Monate. Die letzte Folge der Reihe zeigt die faszinierende Verwandlung der kanadischen Landschaften durch Schnee und Eis. In den borealen Nadelwäldern überwintert eine Braunbärenfamilie in ihrem warmen Bau, wo die Mutter ihre Jungen zur Welt bringt. Die erwachsenen Bären brauchen fünf Monate nichts zu fressen; sie zehren von ihren Reserven und verbrennen 4.000 Kalorien pro Tag. In der Arktis geht ein letztes Mal die Sonne unter und überlässt den nunmehr nächtlichen Himmel dem Spektakel der grünen und purpurfarbenen Polarlichter.
