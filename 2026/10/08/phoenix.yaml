  title: Ein Jahr in Kanadas Wildnis
  subtitle: Herbst
  widescreen: true
  hd: true
  description: Der Herbst steht für den Wandel des wilden Kanadas - während die Tiere im Süden noch in der Sonne baden, müssen die Streifenhörnchen im Norden schon Wintervorräte sammeln. Im Herbst wandeln sich die kanadischen Wälder in ein Farbenmeer. Es ist die Zeit der großen Wanderungen. Drei Viertel aller Vogelarten, die in Kanada genistet haben, ziehen wieder gen Süden.
