  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Hosté: pekaři Vilém Ráček a Tomáš Kadlec. Co je i po deseti letech baví na pekařském řemesle? Jak vzpomínají na začátky, kdy pekli bagety a croissanty v garáži rodičů? Jakým směrem se mění chutě a nároky na pečivo? A kolik tun těsta denně spotřebují na téměř tisíc chlebů? Těšte se na malou oslavu říjnového Světového dne chleba. Moderuje Jarka Vykoupilová.'
