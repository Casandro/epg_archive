  description: 'Will Gmehling schreibt seit fast 30 Jahren Kinderbücher und fühlt sich ohne das Schwimmen im Freibad wie ein Fisch auf dem Trockenen. Zu seinen bekanntesten Werken zählt sein Buch "Freibad", das mit dem Deutschen Jugendliteraturpreis ausgezeichnet worden ist. Jetzt versucht der Bremer Autor auch Teenager zu überzeugen: In diesem Jahr ist mit "Stuxx" sein erstes Jugendbuch erschienen.'
