  stop: 2026-10-08T09:40:00Z
  title: Radioporadna
  description: Osmého října si připomínáme Světový den zraku. Proč je důležité mít takový den a proč bychom měli péči o zrak věnovat větší pozornost? Jak poznáme, že se s naším zrakem něco děje, jaké příznaky lidé nejčastěji přehlížejí? Stále častěji se mluví také o zhoršování zraku u dětí. Co mohou rodiče dělat preventivně a jak poznají, že jejich dítě nemusí vidět dobře? To vše probereme s optometristkou Alenou Flídrovou. Moderuje Jitka Slezáková.
