  title: MDR Thüringen Frühschicht
  subtitle: mit Johannes-Michael Noack
  description: "Die MDR THÜRINGEN Frühschicht - mit Johannes-Michael Noack und Timo Hartmann. Wir stehen für Sie früh auf und versorgen Sie täglich mit allem, was ihren Morgen schöner macht. Immer mit dabei das ganze Frühschicht-Team.\nAb 5 Uhr starten wir mit Ihrer Lieblingsmusik, aktuellen Nachrichten, Geschichten und Berichten aus Ihrer Region. Sie können mitmachen in der MDR THÜRINGEN APP. Hinterlassen Sie uns einfach ihren Kommentar, ihre Meinung oder was Sie sonst bewegt. \n\n\nDie MDR THÜRINGEN Frühschicht - mit Johannes Michael-Noack und Timo Hartmann. Wir stehen für Sie früh auf und versorgen Sie täglich mit allem, was ihren Morgen schöner macht. Immer mit dabei das ganze Frühschicht-Team.\nAb 5 Uhr starten wir mit Ihrer Lieblingsmusik, aktuellen Nachrichten, Geschichten und Berichten aus Ihrer Region. Sie können mitmachen in der MDR THÜRINGEN APP. Hinterlassen Sie uns einfach ihren Kommentar, ihre Meinung oder was Sie sonst bewegt. \nNachrichten hören Sie jeweils zur vollen und Schlagzeilen zur halben Stunde, dazu um 5.30, 6.30, 7.30 und 8.30 Uhr Regionalnachrichten, halbstündlich aktuelle Informationen zum Wetter und zur aktuellen Verkehrslage. Wetter gibt es ausführlich um 5.50 und 7.50 Uhr im Gespräch mit dem MDR-Wetterstudio.\nDie \"Kirche im Radio\" hat ihren Platz um 6.20 Uhr. Und um 8.40 Uhr präsentieren wir Ihnen aktuelle Informationen direkt aus den Thüringer Landespolizeiinspektionen im Polizeibericht."
