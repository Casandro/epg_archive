  audiodesc: true
  description: 'Im Dschungelzelt ist es für die Loris fast wie in der Wildnis, deshalb bekommen sie auch regelmäßig Nachwuchs. Mal wieder ist eine Nistkastenkontrolle fällig. Spitzer Schnabel und messerscharfe Krallen: Wie gefährlich sind eigentlich die Waffen eines Steinadlers? Bei den Mähnenrobben ist keine zu dünn, doch weshalb müssen sie dann trotzdem noch ordentlich Gewicht zulegen? Was Elefanten von Schnee halten und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".'
