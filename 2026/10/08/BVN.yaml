  description: De 27-jarige Henriëtte koopt in haar eentje een jaren 30-huis in Zwolle. Het idee was een paar muurtjes door te breken en een beetje verven, maar dat liep anders. Inmiddels is Henriëtte een ervaren klusvrouw. * Chef-kok Ramon bakt een hartige taart met stracciatella, gemengde tomaten en geitenkaas. * Op een oude tennisbaan heeft Bram een biologische tuin ontwikkeld. Hij gebruikt olifantenpoep uit de dierentuin om pompoenen te kweken en heeft verschillende appelsoorten waarin de mistletoe groeit. * Marieke Eyskoot ziet wat je kan doen tegen zwerfafval op een Rotterdamse markt. Hier zijn duurzame oplossingen om deze afvalberg te verkleinen. (2026)
