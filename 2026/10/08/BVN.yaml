  subtitle: S12 E131. In ecodorp de Bloeipleats leven bewoners samen in de natuur, Jetske laat zich inspireren door regeneratief tuinder Rick en artiest Brohlin neemt ons mee langs zijn familiegeschiedenis in Roermond.
  description: 'Aan de rand van Leeuwarden ligt Ecodorp De Bloeipleats. In deze gemeenschap experimenteren bewoners met duurzaam wonen, natuurherstel en vooral... samen leven. * Onze kok Jetske is in Dronten waar regeneratief tuinder Rick laat zien hoe je mét de natuur samen kan werken. Met kippen, compost, een voedselbos en gifvrije teelt bouwt hij aan zijn land en hoopt hij anderen te inspireren. * Roermond is voor artiest Brohlin meer dan zijn geboortestad: het is zijn inspiratie, zijn werkplek en de stad met veel persoonlijke familiegeschiedenis. Hij neemt ons mee langs de hoogte-en dieptepunten en een kunstwerk waarop hij zijn handtekening heeft gezet. (2026)'
  genre:
  - '32'
