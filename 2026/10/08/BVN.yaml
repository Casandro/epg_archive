  description: Sportleraar Sjors (41) en ambtenaar Sofie (41) verhuizen met hun zoons Billy (11) en Flynn (8) naar het Franse Ambert. Ze nemen een bestaande camping over die ze willen vernieuwen met safaritenten, een zwembad en een speeltuin. Voor de jongens is de emigratie wennen. Ze moeten afscheid nemen van familie en vrienden en naar een Franse school waar ze de taal niet spreken. Ondertussen is het terrein al snel volgeboekt vanwege een muziekfestival in de buurt. Terwijl Sjors het zwembad probeert af te krijgen, vraagt Sofie zich af of het campingleven wel echt haar droom is. (2026)
