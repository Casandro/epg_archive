  title: Infrarouge
  description: "(Rediffusion) 2026 (26/34) Infrarouge: Israël : la fuite en avant ? Trois ans jour pour jours après les attentats du 7 octobre, Israël est plus isolé que jamais sur la scène internationale. La guerre sanglante qu'il mène dans la bande de Gaza en guise de représailles est condamnée de toutes parts.  \nPourtant, Benjamin Netanyahou semble déterminé à maintenir le cap. Il faut dire qu'il jouera son maintien au pouvoir lors des élections législatives du 27 octobre. \nAlors, la chute du Premier ministre israélien pourrait-elle permettre d'envisager une désescalade dans la région ? Et alors que la colonisation s'accélère en Cisjordanie, jusqu'où est-il prêt à aller pour se maintenir au pouvoir ?  \n (Suisse Romande-2026)"
  genre:
  - '32'
