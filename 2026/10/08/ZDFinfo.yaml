  description: |-
    Großbritannien 2022
    Die Milchstraße, unsere Heimatgalaxie, ist ein schwaches Lichtband, das sich über den Nachthimmel zieht. Schon die alten Griechen haben davon geträumt, ihre Geheimnisse zu verstehen.

    Nach Kollisionen mit anderen Galaxien entwickelte sich die Milchstraße in zahllosen Wachstumsschüben. Seit Kurzem können wir dank modernster Weltraumteleskope ihre dramatische Geschichte enthüllen. Und auch ihre katastrophale Zukunft vorhersagen.
    HD-Produktion
