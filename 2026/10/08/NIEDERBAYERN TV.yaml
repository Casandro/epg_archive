  description: |-
    Kino made in Niederbayern - Hundswut in Waldkirchen vorgestellt!
    Kinospielstätten sind nach wie vor ein beliebter Freizeitaufenthaltsort von Kindern, Jugendlichen und auch Erwachsenen. Laut einer Statistik hat es im Jahr 2023 in Deutschland rund 1.740 Kinos gegeben. Mit ihrem umfangreichen Filmaufgebot ziehen sie ihre Besucherinnen und Besucher förmlich an. Ein bayerischer Film der ab März neu auf den Leinwänden zu sehen ist trägt den Titel Hundswut. Meine Kolleginnen Anja Gembries und Franziska Weiß durften bei einer exklusiven Filmpremiere erste Blicke hinter die Kulissen des Films werfen.

    Hinter den Kulissen - Warten auf Godot am Theater an der Rott!
    Es ist wohl das berühmteste und meistdiskutierte Theaterstück des 20. Jahrhunderts. Warten auf Godot zeigt in epischer Breite zwei in die Jahre gekommene Freunde am Rande der Zivilisation. Was ihnen vom Leben bleibt, ist Warten. Warten auf Godot. Eine lange Wartezeit, die immer wieder aufgeschoben und angezweifelt wird und doch die einzige Hoffnung ist. Den Klassiker von Samuel Beckett bringt das Theater an der Rott in Eggenfelden auf die Bühne. Rainer Auer hat sich mit den Protagonisten des Stücks und dem Regisseur über die Hintergründe dieses Meisterwerks der Theaterbühne unterhalten.

    Im Gespräch - KBM Josef Ascher und KBI Stefan Drasch zur Feuerwehr-Fachtagung in Ried im Innkreis!
    Sie sind buchstäblich zur Stelle, wenn es brennt. Die vielen tausend Feuerwehrmänner und -frauen in Niederbayern. Größtenteils ehrenamtlich erfüllen sie eine besonders wichtige Aufgabe in unserer Gesellschaft. Dabei immer wichtig: Fortbildung und Austausch. Genau darüber hat sich mein Kollege Maximilian Ortner mit zwei Funktionsträgern des Kreisfeuerwehrverbandes Passau unterhalten.
