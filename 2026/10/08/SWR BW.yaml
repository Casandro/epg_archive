  title: Watzmann ermittelt (47)
  subtitle: Sommerschnee
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Als Johanna Jerry eröffnet, schwanger zu sein, wird der von seinem Schwiegervater, Kommissar Beissl, zu einem Tatort gerufen. Im Bergrestaurant \"Gipfelglück\" des Gastro-Papstes Herby Allgeier findet Chefin Nina Allgeier den Kellner Rudi tot, vergiftet mit Kokain, das mit Pflanzenschutzmittel versetzt wurde. Die wiederhergestellten Handydaten verraten, dass der Kellner eine geheimnisvolle Freundin hatte, die Ana heißt. Mit ihr wollte er nach Thailand auswandern. Was haben der Chefkoch im Gipfelglück, Falk Straub, und sein Kollege Markus Walther mit dem Fall zu tun? \n\nJerry und Sophia finden heraus, dass Rudi den Chefkoch erpresste. Damit hat dieser ein Mordmotiv. Als Sophia ein Treffen von Nina Allgeier mit ihrer ehemaligen Freundin Susi Rabl und dem Dealer Peter Müller belauscht, ergeben sich neue Spuren und Rätsel. Die jungen Leute scheinen sich alle zu kennen - doch was verbindet sie? Da geschieht ein weiterer Mord. Es ist der Beissl, der die richtigen Schlüsse zieht."
- eventId:
