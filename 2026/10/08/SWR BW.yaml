  - 977893
  start: 2026-10-08T20:45:00Z
  stop: 2026-10-08T21:35:00Z
  title: Watzmann ermittelt (48)
  subtitle: Unter Falken
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Beissls jüngste Tochter Eva will Meeresbiologie in Kiel studieren. Außerdem macht ihm der Mord an Tierarzt Dr. Leitner zu schaffen. Den fand man erschlagen im Greifvogelgehege seines Bruders Jakob. Ein saudischer Geschäftsmann wollte dort viel Geld investieren. Die Assistentin des Tierarztes, Dalilah, bricht in Tränen aus, als sie von seinem Tod erfährt. Hatte sie ein Verhältnis mit dem Tierarzt und wurde ihm das zum Verhängnis? \n\nSie ist die Tochter des reichen saudischen Geschäftsmanns Al Ahyan, der bei Jakob einen Falken für 40.000 Euro kaufen wollte. Der fast ebenso teure Diamantkopfschmuck des Falken blieb am Tatort zurück. Raubmord ist somit ausgeschlossen. Doch dann stößt Al Ahyad eine Drohung gegen Jakob aus. Geht es dabei um den Erwerb des Falken oder um Al Ahyads Tochter Dalilah? \n\nCaros akribische Recherchen und eine undercover-Aktion ihres Kollegen Max in dem Luxushotel, in dem sich Al Ahyad und sein Clan eingemietet haben, bringen schließlich die entscheidende Wende."
