  title: Festival Muzički dani u.
  subtitle: Nastavljamo ciklus posvećen najstarijem festivalu savremene muzike u svetu, osnovanom 1921, koji je prošle godine doživeo svoje 75. izdanje.
  description: Nastavljamo ciklus posvećen najstarijem festivalu savremene muzike u svetu, osnovanom 1921, koji je prošle godine doživeo svoje 75. izdanje. U saradnji Radija Jugozapadne Nemačke iz Štutgarta i grada Donauešingena, svakog trećeg vikenda u oktobru se širom ovog mesta održavaju koncerti i prateće manifestacije, a prošle godine, festival je trajao od 16. do 19. oktobra. U večerašnjoj emisiji pratićete snimak nastupa ansambla Klangforum iz Beča, održanog 19. oktobra u Mocartovoj dvorani. Na programu su bile svetske premijere dela Aleksandra Hubejeva, Ane Korsun, Koke Nikoladzea i Frančeske Veruneli.
- eventId: 1488204
