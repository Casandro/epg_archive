  description: U emisiji Putevi proze, od ponedeljka, 5. do četvrtka, 8. oktobra, možete slušati delove romana Maje Haderlap "Žene noći". Autorka je rođena u Koruškoj. Posle studija pozorišnih nauka i germanistike, predavala je na Univerzitetu u Klagenfurtu i bila dugogodišnja glavna dramaturškinja u Gradskom teatru u ovom gradu. Objavljivala je liriku na slovenačkom jeziku. Godine 2011. osvojila je Nagradu "Ingeborg Bahman" za roman, "Anđeo zaborava". Usledile su druge prestižne nagrade, a među njima Nagrada "Maks Friš" (2018) i Nagrada "Kristine Lavant" (2021). Njen roman "Žene noći" bio je u užem izboru za Nagradu "Mariluize Flajser" i Austrijsku književnu nagradu. Glavna junakinja Mira kreće na put u Korušku znajući da joj predstoje teški dani - ona bi trebalo da pripremi majku da će morati da napusti kuću u kojoj je pre više desetina godina, sa svojom tada još malom decom, kao nekvalifikovana radnica našla krov nad glavom. U nedeljama koje će uslediti intenziviraju se sećanja na traumatično...
