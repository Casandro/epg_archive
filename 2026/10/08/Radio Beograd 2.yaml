  description: 'U emisiji Naučni skupovi od 5. do 10. oktobra možete slušati snimke sa 33. Simpozijuma Srpskog filozofskog društva, koji je održan 19. i 20. septembra u Sremskim Karlovcima. U četvrtoj emisiji ovog ciklusa možete pratiti izlaganje Damira Smiljanića "Aporetika kontra kombinatorika: filozofski problemi kao izazov za veštačku inteligenciju", kojim je otvorena sesija "Filozofija i veštačka inteligencija".'
