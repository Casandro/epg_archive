- eventId: 1500966
  start: 2026-10-08T00:35:00Z
  stop: 2026-10-08T01:25:00Z
  title: Faszination Heimat - Der Arche-Bauer und sein Vieh
  subtitle: Faszination Heimat - Der Arche-Bauer und sein Vieh
  description: Thomas Strubreiter ist Arche-Bauer. Er hat sich und sein Leben der Erhaltung heimischer Nutztierrassen verschrieben, die vom Aussterben bedroht sind. Tiere, die seit Jahrhunderten den Menschen das Überleben im Alpenraum gesichert haben. Für den Bauern sind die bedrohten Rassen ein Stück österreichisches Kulturgut. Der Film begleitet einen Sommer auf der Alm und portraitiert einen Mann, dessen größte Leidenschaft seine Tiere sind. AT 2013
- eventId: 1500967
  start: 2026-10-08T01:30:00Z
  stop: 2026-10-08T02:15:00Z
  title: Heimatleuchten - So schmeckt Südtirol
  subtitle: Heimatleuchten - So schmeckt Südtirol
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2018'
- eventId: 1500968
  start: 2026-10-08T02:15:00Z
  stop: 2026-10-08T02:46:00Z
  title: Mount Infinity
  subtitle: Mount Infinity
  description: Mount Infinity ist ein Film über das Erreichen großer Ziele, Freiheit und das Älterwerden. Dieser Film begleitet die erfolgreiche Acro-Pilotin Judith Zweifel zwei Jahre lang auf ihrer Reise, um das Infinite Tumble zu erlernen. Unter Infinity Tumbling versteht man eine fortlaufende Reihe von Loopings, bei denen der Pilot senkrecht über den Flügel fliegt. In dieser Zeit muss Judith ihre Ängste und Zweifel überwinden - das Ergebnis ist ein einzigartig ehrlicher und oft überraschender Blick in die Privatwelt einer Extremsportlerin. CH 2011
- eventId: 1500969
  start: 2026-10-08T02:50:00Z
  stop: 2026-10-08T03:42:00Z
  title: Entdecker der Welt - Ruhe bewahren
  subtitle: Entdecker der Welt - Ruhe bewahren
  description: |-
    Niemand wurde zum Höhlentauchen geboren. Außer vielleicht Elizabeth Rogers. Liz wurde virtuell von ihren bahnbrechenden Eltern in Australiens produktivsten Jahren der Höhlenerkundung unter der Erde geboren, gestillt und aufgezogen. Liz' Vater, Peter Rogers, ist einer der ersten Entdecker der riesigen Kalksteinhöhlen von Cocklebiddy in Australiens verlassener Nullarbor-Ebene.Liz würde niemals der Blasenspur eines anderen folgen. Als Australiens am meisten ausgezeichnete Höhlentaucherin hat Liz ihre eigenen Höhlen gefunden, die sie erkunden kann - in Westtimor, Indonesien. Für einen Höhlentaucher ist die Suche nach einer unerforschten Höhle wie ein Kletterer, der einen unentdeckten Berg findet. Es ist eine Chance, Ihren Namen in die Geschichtsbücher zu schreiben.
     PG 2016
- eventId: 1500979
  start: 2026-10-08T03:45:00Z
  stop: 2026-10-08T04:31:00Z
  title: Entstehung der Alpen - Erlebniswelt Alpen
  subtitle: Entstehung der Alpen - Erlebniswelt Alpen
  description: Entstehung der Alpen - Erlebniswelt Alpen:Unsere Alpen - seit jeher ein geschichtsträchtiger Ort im Herzen Europas und Mittelpunkt historischer Entwicklungen und bahnbrechender Erkenntnisse. Beeindruckende Berge, wilde Flüsse und einzigartige Landschaften haben die Menschen seit Jahrhunderten bewegt und in die Alpen gelockt. Prof. Rudolf Simek macht sich auf die Spuren des Tourismus. Warum kamen die ersten Reisenden in die Alpen und wie entwickelte es sich zum Massentourismus? AT 2015
- eventId: 1500980
  start: 2026-10-08T04:35:00Z
  stop: 2026-10-08T05:22:00Z
  title: Entstehung der Alpen - Mythos Alpen
  subtitle: Entstehung der Alpen - Mythos Alpen
  description: 'Entstehung der Alpen -  Mythos Alpen: Unsere Alpen. Eine beeindruckende und vielfältige Landschaft, die über Jahrmillionen entstanden ist. Prägende Epochen und historische Ereignisse spielten sich ab, umgeben von imposanten Berggipfeln der Alpen. Aber woher stammen die vielfältigen Namen unserer Berge und Gebirge? Und welche Geschichten führten zu ihrer Benennung? Wenn die Berge unserer Alpen selbst sprechen und erzählen könnten, würde es lange dauern bis sie etwas über uns zu berichten hätten. Denn als der Mensch hier irgendwann einmal hier auftauchte, standen die Gebirge selbst schon Millionen von Jahren AT 2015'
- eventId: 1500981
  start: 2026-10-08T05:25:00Z
  stop: 2026-10-08T06:20:00Z
  title: Because
  subtitle: Because
  description: BECAUSE ist Two Planks erster hochkarätiger Produktionsfilm, der in zwei Wintern mit Rekordschneefall auf der ganzen Welt gedreht wurde. BECAUSE folgt 22 Profisportlern durch den tiefsten Schnee, die größten Klippen und die intensivsten Abenteuerexpeditionen, die unsere Kameras je gesehen haben. BECAUSE ist ein geschichtenbasiertes, reichhaltiges visuelles Projekt, bei dem etablierte Fahrer zusammen mit den am meisten erwarteten Nachwuchssportlern Einblick in ihre sportlichen Ambitionen und ihren Motivationsdrang für den nächsten Erfolg in ihrer Karriere geben. BECAUSE bietet ununterbrochene Freeski-Abenteuerunterhaltung durch die Darbietungen, gepaart mit der Suche von Sportlern und Filmemachern gleichermaßen. CA 2012
- eventId: 1500990
  start: 2026-10-08T06:20:00Z
  stop: 2026-10-08T07:07:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  description: 'Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn: Das 19. Jahrhundert war eine Zeit bedeutender Veränderungen. Die Industrialisierung, die Arbeiterbewegung und bahnbrechende neue Erfindungen. In diese Zeit fällt der Bau der revolutionierenden Semmeringbahn. Geplant und ausgeführt von Carl Ghega, einem großen Visionär, dessen Bahnprojekt der Gegend am Semmering Wohlstand brachte und in ganz Europa bekannt machte. So wurde der Semmering Anziehungsort der Reichen und Schönen, der Dichter und Denker. AT 2015'
- eventId: 1500991
  start: 2026-10-08T07:10:00Z
  stop: 2026-10-08T07:57:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  description: |-
    Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen: Seit tausenden Jahren trennen die imposanten Gipfel der Alpen Nord und Süd in Mitteleuropa - und scheinen dabei schier unüberwindlich. So bauten sich die Menschen Wege über die Alpen und perfektionierten die einfachen Pfade zu dem ausgeklügelten Verkehrsnetz das wir heute kennen. In den Pässen der Alpen sehen sie wichtigsten Routen, die die Geschichte Europas prägten und zum Aufstieg und Fall großer Persönlichkeiten führten.
     AT 2015
