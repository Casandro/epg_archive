  description: 'Da počnemo od ritma: Na nedavno održanom Drum Dum festivalu u Leskovcu, razgovarali smo sa učesnicima i dobitnicima nagrade Tokan. Događaj su pratili koncerti, filmovi i strip radionice. Čućemo i neke od nagrađivanih učesnika od kojih mnogi imaju jednocifren broj godina i zavidan talenat. Najavljujemo i koncert grupa Koikoi i Turbo Trans Turisti u nedelju u Bašti KST-a. Ovim koncertom (uz još jedan 15. oktobra) Bašta se zatvara a izvođači najavljuju posebno energične i emotivne koncerte. Očekuju vas ulaznice za ovaj koncert, kao i za nastup Ane Stanić 16. oktobra u Bitef Art Kafeu. Ana će biti naša gošća od 13 časova. Sa vama su Danijela i Ružica.'
