  title: Čtení na pokračování
  subtitle: Dokonalá svoboda (1. díl)
  description: 'Autor: Maria Calasanz Ziescheová; Interpret: Adriana Růžičková; Premiéra: 1.11.2003 * Dokonalá svoboda Marie Calasanz Ziescheové vypráví příběh Heřmana z Altshausenu, šlechtického syna, kterého dětská obrna připoutala na celý život k lůžku a učinila závislým na pomoci druhých. V klášteře Reichenau však navzdory tělesnému omezení rozvíjí své mimořádné nadání a stává se uznávaným učencem, hudebníkem a duchovním. Román zachycuje jeho zápas s bolestí, samotou, nepřízní osudu i vlastními slabostmi a především cestu k vnitřní svobodě. Příběh středověkého mnicha tak otevírá otázky smyslu utrpení, přijetí životního údělu a skutečné svobody člověka obecně.'
