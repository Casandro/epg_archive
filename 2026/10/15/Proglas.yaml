  title: Na stole je téma
  subtitle: Broňa, nadšený učitel z Brna
  description: 'Autor: Zdislava Horníková; Interpret: Bronislav Sobotka; Premiéra: 15.10.2026 * Jak učit angličtinu tak, aby lidi bavila a nebáli se ji používat? Hostem pořadu je Broňa Sobotka, nadšený učitel angličtiny z Brna, který své zkušenosti předává prostřednictvím online kurzů, podcastů i sociálních sítí. Mluvit bude také o budování týmu, hledání vlastních silných stránek a o tom, proč někdy musíme část práce předat druhým, abychom se mohli věnovat tomu, co nám jde nejlépe.'
