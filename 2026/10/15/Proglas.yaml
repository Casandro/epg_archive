  title: Jak se vám líbí
  subtitle: Rozhovor se slovenským hudebníkem Františkem Bálešem
  description: 'Autor: Jannis Moras; Interpret: František Báleš * Slovenský jazzový pianista, aranžér a skladatel František Báleš představí v pořadu Jak se vám líbí nové album svého ansámblu, inspirované starou slovenskou básní Janka Kráľe Zakliata panna vo Váhu a divný Janko. Baladu z roku 1844 převedl do angličtiny irský básník John Minahane, který Bálešovi pomohl objevit v slovenské poezii spojení křesťanské tradice a lidových představ. O novém albu, o vztahu k slovenské poezii i o cestě od literární předlohy k jazzové hudbě hovoří František Báleš v pořadu Jak se vám líbí s Jannisem Morasem. '
  genre:
  - '96'
