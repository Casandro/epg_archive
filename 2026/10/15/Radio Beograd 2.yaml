  description: Tokom letnjih meseci, reprodukovaćemo snimke načinjene na specijalnom dvonedeljnom festivalu posvećenom stodvadesetpetogodišnjici dvorane Vigmor hol u Londonu. Neki od najpoznatijih umetnika klasične muzike - operske zvezde poput Asmik Grigorijan i Lise Davidsen, pijaniste Igora Levita, Vilijema Kristija i Žordija Savalja, kao i vedete vorld mjuzik i fjužn scene poput Abela Selakoa i Rinanon Gidens, uz sjajne muzičare iz gudačkih kvarteta Modiljani i Leonkoro - okupili su se kako bi proslavili važnu istoriju ove dvorane, otvorene 1901. godine.
