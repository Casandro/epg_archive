  title: Wunder der Natur
  subtitle: Natürlich belebend, Magazines / Reports / Documentary 2017, Season:1 Episode:9
  description: '2017 ● S1 E9 ● FSK: 6 Island besitzt unzählige Naturwunder und über 200 Vulkane, von denen 30 immer noch aktiv sind. Überall dampft und blubbert es aus der Erde. Es ist daher nicht verwunderlich, das die Insel voller Mythen und Sagen ist. Die Einheimischen glauben, dass ihr Land von Elfen, Zwergen und Gnomen bewohnt sei. Island vereint wildromantische Wasserfälle mit explodierenden Geysiren, unberechenbaren Vulkanen und riesigen Eisabbrüchen und bietet dadurch ein einzigartiges Naturspektakel. Magazines / Reports / Documentary 2017, Regie: Max Serio,  Mit: Terry Schappert, Season:1 Episode:9'
