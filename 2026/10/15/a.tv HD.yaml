  title: Heimatzeit (Wh.)
  subtitle: Punch Needling in Friedberg, Hagebutten-Oxymel selber machen
  description: In der Heimatzeit wird es kreativ, bunt und flauschig. Beim Bastelkiosk-Workshop im Wittelsbacher Schloss in Friedberg lernen wir eine besondere Sticktechnik, die gerade voll im Trend liegt - das sogenannte Punch Needling. Außerdem zeigen unsere Gartenfreunde, wie man mit selbstgemachten Hagebutten-Oxymel jetzt seine Abwehrkräfte für den Winter stärken kann. In der Austellung Imperium im Kleinen erfahren wir, was in Oettingen und der Umgebung zur römischen Kaiserzeit so los war. Und im Schulmuseum Ichenhausen gibt es eine neue Dauerausstellung - Tora und Tablet heißt sie und erzählt anschaulich die Geschichte der Jüdischen Schulen in Bayern. Mit Laura Hunger.
