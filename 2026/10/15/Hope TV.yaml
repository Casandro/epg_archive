  title: Charakterwerkstatt
  subtitle: Der ehrliche Umgang miteinander | Authentizität und Ehrlichkeit
  description: |-
    Wie ehrlich sind wir wirklich, wenn viel auf dem Spiel steht? Die Geschichte von Jakob, Esau, Rebekka und dem blinden Isaak zeigt, wie eine Familie an einer Täuschung zerbricht, mit der ein Sohn sich Segen und Erstgeburtsrecht erschleicht.

    Diese Folge lädt dazu ein, den eigenen Umgang mit Wahrheit zu hinterfragen: Wann ist Ehrlichkeit unbequem, und warum lohnt sie sich trotzdem? Ein Gespräch über Vertrauen, Beziehungen und den Charakter, der daraus wächst.

    Weitere Infos unter: www.hopetv.d
