  subtitle: Zartheit und Krawall
  description: |-
    Ihre Herzensfreundin Katharina stirbt viel zu früh. Ihr Buch "Zartheit und Krawall" ist eine Hommage an diese Freundschaft. Mit Anne Fleck.
    Nach Katharinas Tod schreibt Anne Fleck über das, was ihr aus dem Herz sprudelt, wenn sie an ihre Freundin denkt: Und das ist ehrlich, klug und herausfordernd schön! Es geht nicht nur um Katharinas Leben und ihre Freundschaft, sondern auch um den Glauben, die Hoffnung und die Zärtlichkeit mitten im Krawall.

