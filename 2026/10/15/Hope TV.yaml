  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Alexander Gerlitz: Wem gibst du dein Geld - und warum?'
  description: |-
    Geld verdienen wird für Alexander Gerlitz früh zum Antrieb seines Lebens. Aufgewachsen in einer mennonitischen Familie in der ehemaligen Sowjetunion erlebt er Mangel, harte Lebensumstände und den Wunsch, es später einmal besser zu haben. Mit 22 Jahren kommt er nach Deutschland - ehrgeizig, leistungsbereit und entschlossen, erfolgreich zu werden. Doch hinter dem Erfolg wachsen persönliche Krisen, innere Leere und zerstörerische Gedanken. Eine Zeit lang sieht Alexander Gerlitz keinen Ausweg mehr. Erst eine tiefgreifende Begegnung mit Jesus Christus verändert sein Denken und sein Herz grundlegend. Heute leitet der fünffache Vater mit über 20 Mitarbeitenden das Unternehmen "Energiestifter" und versorgt rund 5.000 Kunden bundesweit mit Strom und Gas. Das Besondere: Mindestens die Hälfte des Gewinns spendet die Firma an christlich-soziale Projekte. Warum Alexander Gerlitz heute sagt, dass Geld nicht ihm gehört - und weshalb er mit seinem Unternehmen Menschen segnen möchte, erzählt er in dieser Sendung.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
