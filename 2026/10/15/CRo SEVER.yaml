  title: Host Dopoledního expresu
  description: Podzim je pro všechny milovníky přírody a hlavně rybaření jedním z nejzajímavějších období roku. Co všechno se aktuálně děje pod hladinou i na březích našich vod? To se dozvíme od hosta Dopoledního expresu Mgr. Jana Skalského, tiskového mluvčího Českého rybářského svazu. Dozvíte se, jak probíhají podzimní výlovy, jak se daří zarybňování revírů před zimou a jaké nové rybolovné techniky teď hýbou rybářským světem. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Eva Bucharová.
