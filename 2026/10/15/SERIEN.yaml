  title: Cedar Cove - Das Gesetz des Herzens - Pauls Schwester
  subtitle: Cedar Cove - Das Gesetz des Herzens - Pauls Schwester
  description: Jack und Olivia beschließen, sich sich wieder mehr Zeit füreinander zu nehmen. Außerdem klärt Olivia Pauls Schwester Liz über ihre privaten Verhältnisse auf. Die besteht darauf, sich von Will die Stadt zeigen zu lassen. Schließlich offenbart Paul Olivia den wahren Grund, weshalb er seine Heimatstadt verlassen hat. US 2014
