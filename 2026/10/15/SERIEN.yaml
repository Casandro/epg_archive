  title: Borgia - 1497
  subtitle: Borgia - 1497
  description: Cesare macht Dorotea Malatesta zu seiner Gefangenen. Während Alfonso D'Este erneut in Lucrezias Leben tritt, treibt Giulia Rodrigos Vertraute Yuisa in den Selbstmord. Della Rovere lässt über seinen Geliebten Alidosi eine Schmähschrift über die Borgia in Umlauf bringen. König Ludwig greift in Cesares Feldzug gegen die Stadtstaaten ein, doch der Heerführer Vitelli unterläuft Cesares Pläne. FR 2013
  ageRating: 16
- eventId: 740119
  start: 2026-10-15T01:40:00Z
  stop: 2026-10-15T02:34:00Z
  title: Borgia - 1498
  subtitle: Borgia - 1498
  description: 'Zu Rodrigos Ärger ist Cesare gezwungen, sich Ludwig zu unterwerfen und ihm freies Geleit durch den Kirchenstaat zu gewähren. Alfonso Di Calabrias Unachtsamkeit lässt Lucrezias jüngsten Sohn schwer erkranken. Alfonso sorgt für die Genesung des Kleinen, doch seine Position ist schwächer denn je. Cesares Glück wendet sich: Er erleidet eine schwere Niederlage und kehrt geschlagen nach Rom zurück. FR 2013'
  ageRating: 16
- eventId: 740120
  start: 2026-10-15T02:40:00Z
  stop: 2026-10-15T05:40:00Z
  title: Borgia - 1499
  subtitle: Borgia - 1499
  description: Während sowohl Federigo von Aragon als auch Ludwig Anspruch auf den Thron von Neapel erheben, erobert Cesare Faenza kampflos. Alfonso Di Calabria will Cesare töten lassen, doch der Plan fliegt auf. Nachdem Alfonso in einem Hinterhalt schwer verletzt wird, kehrt Cesare nach Rom zurück. Lucrezia entdeckt einen Maskierten, der Alfonso tötet. Von Trauer überwältigt, zieht sie sich aufs Land zurück. FR 2013
  ageRating: 16
