  - 1195927
  start: 2026-10-15T12:05:00Z
  stop: 2026-10-15T12:50:00Z
  title: Naturparadies Armenien (2/2)
  subtitle: Nationalpark Arevik
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Im Süden Armeniens erstreckt sich der Arevik-Nationalpark. In den nahezu unberührten Gebirgstälern des größten Naturschutzgebiets des Landes leben seltene Tierarten.

    Ranger Mkrtich Boyajyan schützt dort die gefährdeten Bezoarziegen. Gleichzeitig kämpft Umweltschützer Gagik Sargsyan gegen eine geplante Kupfer- und Bleimine am Rand des Nationalparks, die seine Heimat bedroht.
    HD-Produktion
- eventId:
  - 1192885
  - 1195928
  start: 2026-10-15T12:50:00Z
  stop: 2026-10-15T13:30:00Z
  title: Armenien - Die Rückkehr des Leoparden
  subtitle: Film von Petra Dorrmann
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Arus Nersisian leitet das 3000 Hektar große Arpa-Naturschutzgebiet im Südwesten Armeniens, direkt an der Grenze zur Exklave Nachitschewan. Typisch für das Gebiet sind seine rostroten Felsen.

    Wilderer hatten die Artenvielfalt in der Region stark dezimiert. Doch nun feiert Arus mit ihrem Team endlich Erfolge: Die Bezoarziegen haben sich deutlich vermehrt, einige Braunbären bevölkern das Gebiet, und selbst der Persische Leopard ist zurück.
    HD-Produktion
