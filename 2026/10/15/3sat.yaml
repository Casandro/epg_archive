  title: Naturparadies Armenien (1/2)
  subtitle: Nationalpark Sewan
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Türkisblau wie die Karibik und doch mitten in Armenien: Der Sewansee liegt auf 1900 Metern Höhe im Kleinen Kaukasus. Die Armenier nennen ihn stolz ihr "armenisches Meer".

    Der See, mehr als doppelt so groß wie der Bodensee, ist Symbol für Natur, Kultur und Geschichte Armeniens. An seinen Ufern stehen eine rund 1000 Jahre alte Zyklopenfestung und die 900 Kreuzsteine des größten Friedhofs der Welt als Zeugen der Vergangenheit.
    HD-Produktion
- eventId:
