  title: Im Ballon zum Balaton
  subtitle: Vom Burgenland zum Plattensee
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Österreicherin Elisabeth Kindermann, Jahrgang 1988, ist Vizeweltmeisterin im Ballonfahren und startet eine ungewöhnliche Tour.

    Mit ihrem Ballon will sie vom österreichischen Neusiedler See zum ungarischen Plattensee. Doch die Aufgabe ist nicht einfach, schließlich herrscht dort meist Ostwind, der den Ballon in die falsche Richtung treibt.
    HD-Produktion
