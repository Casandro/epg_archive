  title: Arten retten im Zoo - Letzte Hoffnung für bedrohte Tiere?
  subtitle: Film von Michael Gärtner
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Mehr als 49.500 Tierarten sind vom Aussterben bedroht, die Biodiversität in Gefahr. Zoos, Wissenschaftler und Behörden wollen nun an einem Strang ziehen, um die Artenvielfalt zu schützen.

    Die Rote Liste der gefährdeten Tiere wächst von Jahr zu Jahr. Mit der Initiative "Reverse the Red" will die Weltnaturschutzorganisation IUCN Maßnahmen in Zoos und im Freiland koordinieren und so das Verschwinden der Tiere stoppen.
