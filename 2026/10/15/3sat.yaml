  title: 'Legendäre Zugabenteuer: Der Schweizer "Glacier Express"'
  subtitle: Film von Claudio Planta
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Schweiz 2024
    Der "Glacier Express" verkehrt zwischen St. Moritz und Zermatt. Spektakuläre Aufnahmen der Hochgebirgsstrecke wechseln sich ab mit Einblicken in die Technik dieser Schmalspurbahn.

    Der "Glacier Express" überwindet große Höhendifferenzen, streckenweise mit Zahnradbetrieb. Während die Reisenden die spektakuläre Strecke genießen, sorgt ein Team im Hintergrund für ihre sichere und reibungslose Fahrt.
    HD-Produktion
