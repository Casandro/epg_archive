    Indien ist das Land der Schlangen. Es gibt sie in den Häusern, auf Dächern, Terrassen und in der Kanalisation. Jährlich sterben in Indien über 50.000 Menschen infolge ihrer Bisse.

    Sebastian Perez Pezzani begleitet die Schlangenfänger der Irulas. Mit einem einfachen Schlangenhaken, einem Leinensack und einem Korb machen sich Kali und seine Frau Alamelu auf die Suche nach den sogenannten Big Four, den vier giftigsten Schlangen der Welt.
