  title: Die härtesten Orte der Welt
  subtitle: Indonesiens giftige Schwefelminen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2023
    In Indonesien liegen Himmel und Hölle nah beieinander. Auf der Trauminsel Bali relaxen Touristen, während Arbeiter in der Schwefelmine im Vulkan Ijen auf Java jeden Tag ihr Leben riskieren.

    Die Mine am Ufer eines leuchtend türkisen Kratersees, um den nachts blaue Flammen lodern, wirkt aus der Ferne fast pittoresk. In Wirklichkeit ist sie die reinste Hölle: Das Wasser des Sees ist säurehaltig, und die Flammen speisen sich aus giftigen Schwefelgasen.
