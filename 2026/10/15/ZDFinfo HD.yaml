  title: Terra X History
  subtitle: Jüdischer Widerstand - Nicht wie Lämmer zur Schlachtbank
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentation, Deutschland 2025
    Sie kämpften im Ghetto, in den Wäldern und selbst noch im Vernichtungslager gegen ihre Verfolger. Und doch sind die Frauen und Männer des jüdischen Widerstands bis heute weitgehend unbekannt.

    Die Gruppe um Simon und Gusta Draenger, die in Krakau spektakuläre Anschläge verübte, oder Marianne Cohn, die 200 jüdische Kinder in die Schweiz schleuste - sie stehen beispielhaft für viele jüdische Widerstandskämpfer, die ihren Mut meist mit dem Leben bezahlten.
    HD-Produktion
- eventId: 1381868
  start: 2026-10-15T00:45:00Z
  stop: 2026-10-15T01:30:00Z
  title: Schindlers Liste - Eine wahre Geschichte
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2006
    Oskar Schindler steht für Eigenschaften, die während der Nazidiktatur selten waren: Menschlichkeit und Mut. Steven Spielberg setzte ihm mit "Schindlers Liste" ein filmisches Denkmal.

    Als Vorlage für Itzhak Stern, dem jüdischen Sekretär, diente das Leben von Mietek Pemper. Helene Hirsch, die Haushälterin des SS-Hauptsturmführers Amon Göth, heißt in Wirklichkeit Helene Rosenzweig. Der Film hat beide in ihrer Heimat besucht.
