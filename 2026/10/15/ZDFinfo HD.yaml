    Die Biologin taucht mit Sandtigerhaien, folgt den Spuren einer einzigartigen Walfangtradition und erkundet die geheimnisvollen Kelpwälder. Außerdem besucht sie ein Schutzgebiet für Zwergpinguine sowie eine der größten Kolonien Australischer Seelöwen.
