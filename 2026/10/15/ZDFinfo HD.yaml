  title: Verbotene Liebe - Queere Opfer der NS-Diktatur
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Warum wurden Schwule, Lesben und Transpersonen im Nationalsozialismus verfolgt? Die Dokumentation zeigt, wie die Nazis Strafen verschärften und queere Menschen terrorisierten.

    Drei ergreifende Schicksale zeigen, wie Homosexuelle in der NS-Zeit unterdrückt wurden, aber auch, wie sie lebten und überlebten. Ihren Geschichten gehen der Schauspieler Jannik Schümann und die Aktivistinnen Kerstin Thost und Julia Monro nach.
    HD-Produktion
- eventId: 1384310
  start: 2026-10-15T02:15:00Z
  stop: 2026-10-15T02:55:00Z
  title: Verbotene Liebe - Queere Schicksale in der NS-Diktatur
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Verfolgt, verhaftet und weggesperrt. Queeren Menschen drohte in der NS-Diktatur großes Leid - und sogar der Tod. Selten wagten es homosexuelle Personen und Transpersonen, sich zu outen.

    Ein Coming-out im Nationalsozialismus bedeutete gesellschaftliche Verachtung, Ausgrenzung und Strafverfolgung. Die Dokumentation begibt sich auf Spurensuche dreier queerer Menschen in der NS-Zeit: Fritz Spangenberg, Gerd Kubbe und Nelly Mousset-Vos.
    HD-Produktion
- eventId: 1384311
  start: 2026-10-15T02:55:00Z
