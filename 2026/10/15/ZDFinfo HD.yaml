  title: Verbotene Liebe - Queere Überlebende der NS-Diktatur
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Verfolgt, gebrochen, vergessen? Drei queere Menschen beweisen im NS-Regime Entschlossenheit und großen Mut. Jannik Schümann, Julia Monro und Kerstin Thost suchen nach ihren Spuren.

    Ein schwuler KZ-Häftling, der überlebte und NS-Belastete zur Rechenschaft zog. Eine Transfrau, die den gewalttätigen Vater erschlug. Eine Rebellin, die für ihre jüdischen Freundinnen alles riskierte. Sie alle stehen im Licht dieser Dokumentation.
