  description: Der Wallfahrtsort Mariazell war im 19. Jahrhundert einer der am stärksten besuchten Fremdenverkehrsorte in der k. & k. Monarchie und auch mitverantwortlich für den Bau der gleichnamigen Bahn. Seit Kurzem geht es nun mit der "Himmelstreppe" zum Wallfahrtsort. Die 91 Kilometer lange Schmalspurbahn von St. Pölten nach Mariazell glänzt mit neuen Triebwagen - "Himmelstreppe" genannt.
