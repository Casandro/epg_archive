  title: Rentnercops (50)
  subtitle: No risk, no fun
  description: "Edwin liegt mit Grippe im Bett, deswegen rückt Polizeipräsident Plocher als Verstärkung aus. Zum großen Missfallen von Günter. \nBei der Leiche handelt es sich um eine junge Frau mit riskantem Hobby und es deutet alles auf einen Unfall hin. Die Ermittler stoßen jedoch während ihrer Recherche auf einige Ungereimtheiten. Steckt vielleicht doch mehr als ein tragischer Unfall dahinter? \nGünter tut sich indessen schwer damit, dem Wunsch von Heidrun nachzugehen, den heimischen Keller auszuräumen."
