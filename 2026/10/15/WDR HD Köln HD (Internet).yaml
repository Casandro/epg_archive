  title: Nach dem Feuer - Was wird aus dem Hohen Venn?
  subtitle: Ein Film von Achim Scheunert
  description: 'Der verheerende Brand im Hohen Venn rückt eine Landschaft in den Fokus, die für Artenvielfalt, Klimaschutz und Wasserhaushalt der Region von großer Bedeutung ist. Die Dokumentation von Achim Scheunert zeichnet die Ereignisse nach: Von den ersten Meldungen über die Ausbreitung des Feuers bis zu den Maßnahmen, mit denen Einsatzkräfte versuchten, das Feuer einzudämmen und eine weitere Gefährdung von Menschen und Natur zu verhindern. Dabei kommen Beteiligte, Fachleute und Menschen aus der Region zu Wort.'
