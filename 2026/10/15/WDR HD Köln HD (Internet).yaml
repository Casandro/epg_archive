- eventId: 816638
  start: 2026-10-15T22:15:00Z
  stop: 2026-10-15T23:50:00Z
  title: Echo
  subtitle: Spielfilm Deutschland 2022
  description: In Friedland ist die Welt noch in Ordnung. Oder zumindest wieder in Ordnung, denn die Vergangenheit ist ja schon lange her - meinen zumindest einige im Dorf. Aber das Moor vergisst nicht. Dort gibt es nicht nur rätselhafte Ruinen, manchmal spuckt es auch Leichen aus und genau mit so einer Moorleiche beginnt (fast) die Geschichte. Kriminalhauptkommissarin Saskia Harder wird aus der Großstadt in die Provinz nach Friedland geschickt. Ein guter Neubeginn nach ihrem traumatischen Einsatz als Polizeiausbilderin in Afghanistan. Das finden zumindest die Vorgesetzten und auch Harder möchte ihre Erinnerungen am liebsten vergessen.
  ageRating: 16
  genre:
  - '16'
