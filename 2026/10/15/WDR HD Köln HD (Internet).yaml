  title: Wer weiß denn sowas?
  subtitle: 'Moderation: Kai Pflaume'
  description: Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
- eventId: 804157
  start: 2026-10-15T08:25:00Z
  stop: 2026-10-15T09:10:00Z
  title: Mittendrin - Flughafen Frankfurt (81)
  subtitle: Die A380-Barkeeperin Laura
  description: "Laura mixt Cocktails in der höchsten Bar der Welt, zehn Kilometer über der Erde im größten Passagierflugzeug, dem Airbus A380. 26 Fluggäste können hier schlürfen, was der Tresen hergibt. Vom Edel-Cognac bis zum 18 Jahre alten, schottischen Whisky. 37 verschiedene Weine stehen zur Auswahl. Die Fluggesellschaft sucht Nachwuchs für den Job. \nSusanne Krause managt Parkplätze für Flugzeuge. 270 Parkpositionen hat der Flughafen. 700 Flugzeuge landen täglich in Frankfurt. Ein anspruchsvoller Job. Ihr größter Gegner: Gewitter - das macht alles kompliziert."
- eventId: 804454
  start: 2026-10-15T09:10:00Z
  stop: 2026-10-15T09:55:00Z
  title: 'Expedition in die Heimat: Mit dem Kanu auf dem Neckar'
  subtitle: mit Annette Krause
  description: Eine Flussreise auf dem Neckar. SWR-Moderatorin Annette Krause ist mit dem Kanu auf einem der schönsten Flüsse Deutschlands unterwegs. Zwischen Weinbergen und wunderschönen Fachwerk-Städtchen entdeckt sie unterschiedlichste Menschen und ihre Geschichten.
