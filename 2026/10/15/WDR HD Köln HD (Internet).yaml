  subtitle: 'Moderation: Florence Randrianarisoa'
  description: Jedes Jahr zur Pilz-Saison gibt es Schlagzeilen über dramatische Vergiftungsfälle. Werden Menschen beim Sammeln leichtsinniger oder verändern sich durch den Klimawandel die heimischen Pilze und werden zur tödlichen Falle? Und können Bestimmungs-Apps helfen? Pilze, die wir im Wald sehen oder im Supermarkt kaufen können, sind nur ein winziger Bruchteil der Pilze-Welt. Weit mehr spielt sich unter der Erde ab.
- eventId: 815084
  start: 2026-10-15T19:00:00Z
