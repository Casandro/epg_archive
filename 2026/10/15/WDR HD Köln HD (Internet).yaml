  title: Fliegen oder fallen? - Luisa und ihr Gendefekt
  subtitle: aus der Reihe "Menschen hautnah"
  description: 'Luisa (20) liebt Menschenmengen und Achterbahnfahren, kann aus dem Nichts einen Witz erzählen oder sächsisch sprechen und ist voller Sehnsucht nach einem selbstbestimmten Leben. Dass sie einen Gendefekt hat - das Williams-Beuren-Syndrom - sieht man ihr nicht an. Doch das fehlende kleine Stück auf dem siebten Chromosom prägt ihr Leben: Lernen, Struktur und Selbstmotivation kosten viel Kraft.'
