- eventId: 802755
  start: 2026-10-15T05:40:00Z
  stop: 2026-10-15T06:25:00Z
  title: In aller Freundschaft (1033)
  subtitle: Wahrheiten
  description: Hendrik Block stürzt bei einer illegalen Kletteraktion für seinen Internet-Video-Kanal ab und wird mit einer thorakalen Pfählungsverletzung in die Notaufnahme der Sachsenklinik eingeliefert. Wie durch ein Wunder kann Roland Heilmann ihn retten. Hendriks bester Freund Richard May besucht ihn am nächsten Tag in der Klinik, wo Hendrik dazu drängt, das gedrehte Video vom Absturz sofort hochzuladen.
- eventId: 802882
  start: 2026-10-15T06:25:00Z
  stop: 2026-10-15T07:10:00Z
  title: In aller Freundschaft (1034)
  subtitle: Schuld und Bitterkeit
  description: Philipp Brentano hat einen Autounfall verursacht, bei dem Emil, der einjährige Sohn von Maria Weber und Kai Hoffmann, schwer verletzt wird. Max Brentano kommt mit dem Schrecken davon. Emil hat eine Zwerchfellruptur erlitten, durch die seine Leber nach oben in den Brustkorb gerutscht ist und in den Bauchraum blutet. Die Operation ist riskant und kompliziert.
