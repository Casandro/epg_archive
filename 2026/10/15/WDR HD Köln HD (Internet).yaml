  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Zu Besuch bei Lieblingstieren
  description: 'Es gibt so viel, was sich hinter den Kulissen des Tierparks Hellabrunn tut! Die Reporter Felix Heidinger und Jens-Uwe Heins gehen jede Woche auf Erkundungstour und berichten top-aktuell über die Geschehnisse. Auf Schritt und Tritt sind sie mit den Pflegern unterwegs und halten mit der Kamera deren Begegnungen und Erlebnisse mit den Tieren fest: Wie entwickeln sich die Eisbären-Zwillinge? Was ist die Lieblingsbeschäftigung der Elefanten?'
- eventId: 806022
