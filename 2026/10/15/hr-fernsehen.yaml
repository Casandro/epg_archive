  description: "Die Beschäftigung der Tiere ist heutzutage in den Zoos das A und O. Im Frankfurter Katzendschungel bastelt Pfleger Hans-Jürgen Reinelt für Malea und Iban einen Gewürzsack mit Nelken-Curry. Mal sehen, was die beiden Sumatratiger damit anstellen. \nIm Opel-Zoo nehmen die Gebäude des neuen Savannen-Reviers langsam Gestalt an. Pflegerin Judith Wantia führt durch das Gelände. Ihre Freude über das neue Projekt wird jedoch von der Sorge überschattet, dass die Bauarbeiten nicht rechtzeitig zur Eröffnung fertig sein werden. \nIn Frankfurt sind die Pfauen los. Diesmal sind die drei einjährigen Brüder allerdings nicht weit gekommen."
