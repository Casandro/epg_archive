  description: 'Jedes Jahr erhalten etwa 170.000 Menschen in Deutschland ein neues Kniegelenk, meist wegen fortgeschrittener Arthrose. Über den Erfolg entscheidet nicht allein der Eingriff im OP: Vor- und Nachbereitung spielen eine entscheidende Rolle, damit das Gehen schnell und sicher wieder schmerzfrei möglich wird. Dazu gehören ausführliche Voruntersuchungen, die Wahl der passenden Narkoseform und eine gezielte Vorbehandlung, um Infektionsrisiken zu senken. In der Physiotherapie werden Muskeln gestärkt und vor dem Eingriff wichtige Bewegungsabläufe und der Umgang mit Gehstützen erlernt. Das spart spürbar Zeit und Unsicherheit nach dem Eingriff.'
