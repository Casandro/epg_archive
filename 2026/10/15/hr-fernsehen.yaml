  description: 'In Hengasch geht es hoch her. Die Rockband "Fraktus" macht Station im Ort und gibt ein Konzert. Alle sind in Partylaune, der Alkohol fließt in Strömen, doch am kommenden Morgen gibt es ein böses Erwachen: Sophie hat einen Filmriss und Roadie Gonzo liegt tot in den Rabatten. Sophie hat während ihrer Ermittlungen alle Hände voll damit zu tun, die kindischen Egomanen von "Fraktus" in den Griff zu bekommen und den Fall zu lösen. Was ihr nicht gerade leichtfällt, schließlich kann sie sich an nichts erinnern. Dietmar hingegen hat sich selbst den Floh ins Ohr gesetzt, dass er der uneheliche Sohn von Zielonka sein könnte.'
