  title: Hovory
  description: 'Aleš Březina je vystudovaný houslista, věnuje se ale komponování a muzikologii: "Fascinovaly mě životopisy skladatelů, hudba je jedno z nejuniverzálnějších umění, které existuje, zajímalo mě, jak se vyvíjelo v dějinách," říká o vědeckém poznání, kterému se při studiu věnoval. "Na co máme v našich končinách talent? Je to absurdita." Jaká byla studia ve švýcarské Basileji ve srovnání s Prahou na konci 80. let 20. století? Jak se vzájemně inspirují filmoví tvůrci a hudební znalci? Čím ho okouzluje tvorba Bohuslava Martinů a jak se mění postavení tohoto skladatele ve světě? Moderuje Ondřej Konrád.'
