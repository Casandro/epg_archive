  title: Nic osobního. Prostě byznys
  description: Český průmysl odhalil svou výkladní skříň v minulých dnech v Praze na Designbloku a v Brně na strojírenském veletrhu.Téma pro hlavní ekonomickou analytičku Českého rozhlasu Janu Klímovou a publicistu Petra Šimůnka. Ti se pozastaví i nad tím, že čeští miliardáři investují v Polsku a že premiér Andrej Babiš z hnutí ANO chce rozšířit těžbu plynu a ropy v Evropě.
