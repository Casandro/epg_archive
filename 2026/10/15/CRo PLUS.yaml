  title: Názory a argumenty
  description: Tereza Friedrichová, analytička NMS. Opoziční ODS, STAN a Piráti by v případě konání parlamentních voleb v září společně získali těsnou většinu 101 hlasů, uvádí průzkum agentury NMS zveřejněný v tomto týdnu. Doplácejí tak koaliční strany na to, že nesou vládní odpovědnost? Jak se v oblíbenosti stran projeví výsledek komunálních a senátních voleb? Moderuje Petr Vizina.
