  title: Radiokniha
  description: 'Markéta Hejkalová: Dům pod náměstím (6/10). Mimořádně schopný ředitel továrny Veselých Josef Knop je i s manželkou ve vykonstruovaném procesu odsouzen k osmi letům těžkého žaláře - v roce 1958. Ve vězení posléze umírá. Umírá i Josef Vlkovský. Děje historické i rodinné pokračují. Četbu pro rozhlas připravila Blanka Kostřicová. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkuje Zdeněk Bureš.'
