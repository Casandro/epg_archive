  title: Hausmeister Krause - Ordnung muss sein Der Sittenstrolch
  subtitle: Hausmeister Krause - Ordnung muss sein Der Sittenstrolch
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll.  Ein Exhibitionist ist in dieser Episode in der Nähe der Siedlung gesichtet worden. Sofort leitet Dieter die Fahndung ein und benutzt seinen Freund Herbert als Lockvogel in Lisbeths Klamotten. Doch wie immer kommt wieder alles ganz anders als geplant: Erst hält Herbert Dieters Vorgesetzten für den Übeltäter und dann taucht noch ein netter junger Mann auf, der Dieter seine Hilfe anbietet, was der natürlich nicht ablehnen kann ...'
