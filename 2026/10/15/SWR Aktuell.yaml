  title: SWR Kultur - Das Wissen
  subtitle: Wenn Chatbots die Karriere mitbestimmen - KI in der Personalauswahl
  description: |-
    Von Beate Krol
    Stellenausschreibungen entwerfen, Bewerbungsgespräche führen, Karrierewege planen, Kompetenzen schulen - auch das Personalwesen macht sich die Künstliche Intelligenz zunehmend zunutze. Dabei geht es nicht nur darum, Kosten zu sparen. Mit der KI ist die Hoffnung verbunden, Bewerber und Mitarbeitende objektiver und effizienter zu beurteilen und zu entwickeln, als es Vorgesetzten und Personalern gelingt. Das allerdings setzt voraus, dass die KI perfekt trainiert ist und in die bestehende IT-Struktur passt. Außerdem greifen auch Bewerber*innen und Mitarbeitende zunehmend auf die Tools zurück, um sich KI-gerecht zu präsentieren.
