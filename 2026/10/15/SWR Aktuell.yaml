  description: "14:00\nFeature \nHitze und lange Dürre: Wie sich Simbabwe gegen Super El Nino wappnet\"\nvon Stephan Ueberbach\n\n14:30\nSWR1 Leute mit Achill und Aaron Moser, Weltreisende\nSo erkunden Vater und Sohn gemeinsam Natur und Kultur\"\nDer renommierte Filmemacher und Fotograf Achill Moser teilt seit Jahrzehnten seine tiefen Einblicke in fremde Kulturen und unberührte Naturräume mit einem Millionenpublikum. Seit einigen Jahren wird er dabei von seinem Sohn Aaron Moser begleitet, der als Kameramann und Regisseur frische Perspektiven in die gemeinsamen Expeditionen einbringt. Ob Wüstendurchquerungen oder Dschungelpfade - Vater und Sohn suchen das echte Abenteuer. Sie hockten schon wochenlang fernab der Zivilisation aufeinander, wissen aber auch, dass sie sich auf ihren Trips blind vertrauen müssen. Ihre Erlebnisse der vergangenen Jahre haben sie in ihrem Buch \"Zu Fuss kommt die Seele an\" zusammengetragen. Über 20.000 Kilometer zu Fuß durch die großen Naturräume der Erde, zwischen Nordsee und Südafrika, Island und Kanada.\nModeration: Jens Wolters\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
