  description: "Dunkelgrau ist der Himmel über dem bergigen Gebiet der Atacamawüste im Norden Chiles. Eine riesige  Staubwolke liegt über Chuquicamata, der größten Kupfermine der Welt, 15.000 Bergarbeiter arbeiten  dort rund um die Uhr: Sie sprengen Felswände, transportieren tonnenweise Geröll mit gigantischen  Lkws und schmelzen Kupfer bei glühenden Temperaturen. Auf der ganzen Welt wird das Leichtmetall  immer begehrter, so dass sich das 120 km² große Abbaugebiet immer weiter ausbreitet. Alles muss  der Mine weichen, selbst die benachbarte Bergarbeiterstadt. Wo einst Leben blühte, verschütten nun  nach und nach riesige Schutthalden die Straßen und Häuser der ehemals 22.000 Einwohner großen  Stadt. Die Familie von Bergarbeiter Raul Alfaro ist eine von vielen, die ihr Heim verlassen  müssen.\n\nAus dem Bauch der Kupfermine ertönt ein lautes Gewitter: Maschinen hämmern, Felswände explodieren, donnernd wird das Gestein verladen. Die Bergarbeiter von Chuquicamata müssen sich diesem Lärm Tag  für Tag aussetzen. Raul Alfaro arbeitet seit 18 Jahren als Lkw-Fahrer in der Kupfermine. 3300 PS sind nötig, um sein Arbeitsgerät in Gang zu setzen. Über schmale Serpentinen transportiert er das  Gestein zu den Schmelzöfen, wo aus dem glühenden Erz reines Kupfer gewonnen wird. \nMit seiner Frau Victoria und drei Kindern lebt Raul in der Bergarbeiterstadt am Rande der  Kupfermine. Bis vor einiger Zeit fühlten sich hier alle wohl. \"Chuquicamata war wie eine große  Familie\", erinnert sich seine Frau Victoria. Der Minenbetreiber Codelco übernahm für die  Bergarbeiter und ihre Familien nicht nur die Mietkosten, sondern baute auch Schulen, Kindergärten  und Sportstätten. Doch mit dem chilenischen Staatskonzern kam nicht nur Segen sondern auch Fluch  über Chuquicamata. Die Gesundheit der Einwohner ist durch den giftigen Mineralienstaub, der  überall in der Luft liegt, gefährdet. Und da sich die Kupfermine immer weiter ausbreitet,  verlieren viele Menschen ihre langjährige Heimat. DE 2006"
