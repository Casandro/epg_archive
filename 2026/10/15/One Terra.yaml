  title: Planet Weltweit - Laos - Futterblöcke und Büffelleasing
  subtitle: Planet Weltweit - Laos - Futterblöcke und Büffelleasing
  description: 'Planet Weltweit: Wasserbüffel gelten in Laos als "Sparbücher für Notzeiten". Muss jemand ins Krankenhaus, geht der Reis aus oder steht eine Hochzeit an, verkauft man einen Büffel. Doch die meisten sind schwach und mangelernährt. Ein junges Team von Tier-Spezialisten will die Büffel in Laos aufpäppeln - mit Hilfe von Futterblöcken, entwickelt von australischen Wissenschaftlern. So können die Büffel ganzjährig ausreichend ernährt werden, sie werden gesünder, setzen mehr Fleisch an und geben bis zu 30 Prozent mehr Milch. Diese wird in Laos bisher nicht genutzt, dabei sind viele Kinder chronisch unterernährt. Die Ernährung der Kinder mit Wasserbüffel- und Ziegenmilch anzureichern, könnte schnelle Hilfe bedeuten. Auf der ersten Wasserbüffel-Milchfarm in Nord-Laos hat die Australierin Susie Martin mit ihren laotischen Farm-Managern und einheimischen Tier-Spezialisten deswegen einen Notdienst für Wasserbüffel eingerichtet. Sie fahren zu den Kleinbauern, impfen und klären über artgerechte Haltung auf und haben kostenloses Zusatzfutter im Gepäck. Sie mieten von den Kleinbauern trächtige Wasserbüffelkühe und holen sie auf die Farm. Grasen auf der Weide, Gesundheits-Checks und nährstoffreiches Powerfutter sollen die Büffelkühe vor der Geburt aufpäppeln. Ihre Besitzer erhalten die Kühe wieder trächtig zurück - mit frischer Genetik von einem Zuchtbullen. Die Milch der Wasserbüffelkühe und neuerdings auch von Ziegen wird in Ernährungsprogrammen eingesetzt, auch in der Grenzregion zu China, in der viele Dorfbewohner in Armut leben und Mangelernährung fast die Hälfte der Kinder betrifft. Mit Wissen und für die Viehhalter kostenlosen Futterblöcken im Gepäck bringen die Tier-Spezialisten den Dorfbewohnern das Melken ihrer Tiere bei und das Zubereiten einfacher Milch-Speisen. Was schmeckt und was der Gaumen als nicht lecker wahrnimmt, wird über Generationen tradiert - eine Riesen-Herausforderung für die Agrar-Avantgardisten. DE 2022'
