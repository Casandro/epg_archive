  title: Planet Weltweit - Das Postschiff zum Ende der Welt
  subtitle: Planet Weltweit - Das Postschiff zum Ende der Welt
  description: |-
    "Kommst du nach Ouessant, siehst du dein Blut. Kommst du nach Molène, siehst du dein Leid", sagt ein bretonisches Sprichwort. Kapitän Michel Stephan lässt sich von dem schweren Seegang, der rund um diese beiden französischen Inseln herrscht und schon so manches Schiff auf den Meeresboden befördert hat, nicht aus der Ruhe bringen. Mit seiner Mannschaft ist er auf dem Postschiff Enez Eussa im tückischen Atlantik unterwegs, um die abgeschiedenen Felseninseln mit allem zum Leben Notwendigen zu versorgen. Und das jeden Tag, denn die Inselbewohner sind auf sein Schiff angewiesen!

    Eigentlich hätte das französische Postschiff Enez Eussa längst ausgemustert werden sollen. Doch es fand sich kein robuster Ersatz für den harten Alltag auf dem Atlantik. Darum versorgt das Schiff auch weiterhin Tag für Tag Molène und Ouessant, die kleinen Inseln vor der bretonischen Küste. Wenn die Winter-Orkane über den Atlantik ziehen, ist die Enez Eussa eines der wenigen Schiffe, das in See stechen kann. Die Fähre bringt auch dann noch Fracht, Passagiere und Post vom Festland auf die Inseln. Dabei muss sie stets die berüchtigte "Passage de Fromveur" durchfahren. Zur Sicherheit stehen hier die stärksten Leuchttürme Europas. Auf halbem Weg kommt die Enez Eussa am Felsen von Men Tensel mit dem berühmten Leuchtturm Kéréon vorbei. Am westlichsten Punkt von Ouessant weist der Leuchtturm von Créach den Schiffen den Weg. Insgesamt sind sechs Leuchttürme nötig, um den Schiffsverkehr vor dieser gefährlichen Küste zu sichern. Die kleinen Inseln, die dort im äußersten Westen Frankreichs liegen, zählen zu den wildesten und ursprünglichsten Orten des Landes. Auf den schroffen Felsen leben die Einwohner vor allem von der Fischerei und während der Sommermonate vom Tourismus. Die Bretonen nennen die Gegend "Penn Ar Bed" - das Ende der Welt. Die Gruppe der zahlreichen unbesiedelten Inselchen um Ouessant und Molène wurde von der UNESCO zum besonders schützenswerten Naturareal erklärt. DE 2005
