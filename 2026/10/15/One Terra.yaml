  title: Planet Weltweit - Pelikane, die Könige des Donaudeltas
  subtitle: Planet Weltweit - Pelikane, die Könige des Donaudeltas
  description: 'Das rumänische Donaudelta ist eines der letzten Refugien der Pelikane in Europa. Doch auch hier wurden sie während der kommunistischen Herrschaft fast ausgerottet. Heute hat sich ihre Zahl, auch dank intensiver Schutzbemühungen, erholt, sogar gesteigert. Doch nicht allen übrigen Bewohnern des Deltas gefällt das. Die letzten verbliebenen Fischer fürchten um ihre Fanggründe. Andrei Ciobanu ist verzweifelt. Seit Monaten holt der Fischer aus dem kleinen Dorf Letea im rumänischen Donaudelta kaum noch genügend Fische aus dem Wasser, um sich und seine Frau zu ernähren. Die Gründe dafür sind vielfältig: industrieller Fischfang, zunehmender Tourismus, Umweltverschmutzung. Und jetzt im Frühjahr kehren auch noch die gefräßigen Pelikane aus ihren afrikanischen Winterquartieren ins Delta zurück und zerstören mit ihren scharfen Schnäbeln die Netze von Andrei und seinen Nachbarn. Die Fischer im Delta sehen sich als große Verlierer einer Veränderung, die nach dem Ende der kommunistischen Ära in Rumänien begonnen hatte: Privaten Tourismus gab es bis dahin nur wenig, und die Pelikane wurden von den Behörden gejagt, weil sie als offizielle Feinde der industriellen Fischerei galten. Heute ist dies vorbei, und Biologen wie der Vogelkundler Eugen Petrescu haben durchgesetzt, dass der Pelikan und andere Wasservögel im Donaudelta unter Schutz stehen. Das Ergebnis: Ihre Zahl hat sich in den vergangenen Jahren vervielfacht. Immer neue Kolonien sind entstanden. Die Tiere dehnen ihre Fangreviere aus und nehmen damit den Fischern ihre Lebensgrundlage. Während Umweltschützer und Wissenschaftler diese Entwicklung als Erfolg für die Renaturierung des Donaudeltas feiern, geraten die verbliebenen Bewohner der umliegenden Dörfer zunehmend in Bedrängnis. Ein unlösbarer Konflikt, wie es scheint, der die letzten Fischer des Deltas bald an den Rand des Verschwindens bringen könnte. DE 2020'
