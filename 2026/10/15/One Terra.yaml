  title: Planet Weltweit - Die Minenratten von Tansania
  subtitle: Planet Weltweit - Die Minenratten von Tansania
  description: 'Tansania. Ein Mann geht langsam über ein Feld und redet auf ein graues Tier zu seinen Füßen ein. Was da mit Brustgurt und Leine vor ihm läuft, ist kein gewöhnliches Haustier, sondern eine 80 Zentimeter lange und 1,5 Kilogramm schwere Ratte - eine Riesenhamsterratte. Wie überall auf der Welt haben auch die Menschen in Afrika eine Abscheu vor den Tieren; dass sich das gerade ändert, ist dem Wissenschaftler Bart Weetjens zu verdanken. Er hat entdeckt, dass die Ratten mit ihrem außergewöhnlichen Geruchssinn in der Lage sind, den Sprengstoff TNT zu erschnüffeln - eine Hoffnung für den afrikanischen Kontinent, wo noch Millionen Antipersonenminen im Boden verstreut liegen. Die heimtückischen Waffen fordern jährlich bis zu 20.000 Opfer. Wir begleiten eine Ratte von ihrer Geburt über das monatelange Training bis zu ihrem ersten Einsatz auf einem Minenfeld in Mosambik. Im Forschungszentrum der nichtstaatlichen Organisation APOPO in Tansania herrscht helle Aufregung: Wieder hat eine Rattenmutter Junge geworfen - ein Riesenerfolg bei in Gefangenschaft lebenden Tieren. Schnell zeigt sich, dass einer der Rattenwelpen besonders aufgeweckt ist. Bart Weetjens, Initiator des Projekts, gibt ihm den Namen Ronaldinho, nach dem auch in Afrika verehrten Fußballidol. In nur wenigen Wochen lernt das intelligente Tier, unter verschiedenen Proben aus Kaffee, Tee und anderen Stoffen das gefährliche TNT heraus zu schnüffeln. Dies ist der Stoff, aus dem die ca. 110 Millionen Antipersonenminen hergestellt sind, die weltweit noch sprengbereit im Boden lauern. Das Training mit Ronaldinho basiert auf der Reiz-Reaktions-Methode. Hat der Nager die richtige Probe entdeckt, bedient sein Trainer ein kleines akustisches Signal in Form eines "Klickers". Sofort danach bekommt der kleine Lehrling eine Belohnung in Form vom Bananenbrei - eine Delikatesse für Ratten. DE 2008'
