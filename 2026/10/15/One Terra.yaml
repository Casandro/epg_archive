  title: Planet Weltweit - Island - Der große Schafabtrieb
  subtitle: Planet Weltweit - Island - Der große Schafabtrieb
  description: |-
    Jedes Jahr im frühen Herbst feiern die Isländer ihr traditionell wichtigstes Fest: das "Réttir", den Abtrieb der Schafe von den wilden Sommerweiden. Eine Aufgabe, die kein Landwirt allein erledigen könnte. In dem extrem dünn besiedelten Gebiet braucht es die Zusammenarbeit ganzer Gemeinden, um alle Schafe rechtzeitig vor dem Winter ins Tal zu bringen.

    Anfang Mai werden auf den isländischen Höfen die Lämmer geboren. Die Bauern haben dann alle Hände voll zu tun, denn schon wenige Wochen später sollen die Schafe in die Berge getrieben werden. An den südlichen Hängen Islands grasen dann mehrere Tausend Schafe für über zwei Monate frei in den Bergen, bis sie im September in einem spektakulären Trieb zusammengesammelt und zurück auf die Höfe geholt werden. Dieses Ereignis gehört zu den größten Ereignissen der Insel. Ganze Familienverbände schließen sich zusammen, um daran teilzunehmen.

    Jedes einzelne Schaf wird dabei mit der Hand gefangen, entweder zu Fuß verfolgt oder vom Rücken eines Pferdes, das für diesen Einsatz sorgfältig ausgewählt wurde. Eine Sisyphusarbeit. Überhaupt ist der ganze Einsatz eine Frage der Organisation. Zuständig dafür ist der sogenannte Bergkönig, ein besonders guter und erfahrener Treiber.

    Derzeit ist das Kristinn Gudnarsson, der das Amt seit fast 30 Jahren ausübt und langsam über einen Nachfolger nachzudenken beginnt. Sein Schwiegersohn Ellindur scheint ihm geeignet, sicher ist sich Kristinn jedoch noch nicht. Besonnenheit und Ruhe, die zwei wichtigsten Eigenschaften kommen erst im Alter, und Ellindur ist noch keine 40 Jahre alt. Dafür gehören er und seine Frau Berglind zu den größten Schafhaltern der Region. Etwa 1.200 Tiere nennen sie ihr Eigen. Und ein Großteil davon wird auch dieses Jahr in den Bergen sein. Es bleibt abzuwarten, ob am Ende des Sommers wieder alle zusammengetrieben werden können. DE 2013
