  title: Planet Weltweit - Die Kämpferinnen von Mexiko
  subtitle: Planet Weltweit - Die Kämpferinnen von Mexiko
  description: Lady Warrior nennt sie sich, die Frau hinter der schwarz-silbernen Maske. Von ihren Fans wird sie verehrt als aufsteigender Stern des Lucha Libre, des mexikanischen Catchens. Doch kaum einer weiß, wer sie wirklich ist. Niemand kennt ihr Gesicht, niemand ihren wirklichen Namen. Und doch schafft sie es, ein immer größeres Publikum um sich zu scharen. Jetzt versucht die alleinerziehende Mutter von zwei Töchtern in die Oberliga der Lucha Libre zu gelangen. Wir begleiten sie zu ihren spektakulären Kämpfen vor kreischendem Publikum. In den mexikanischen Arenas des Lucha Libre kämpft immer das Gute gegen das Schlechte. "Lady Warrior" ist eine "Ruda", sie verkörpert das Böse und greift auch mal auf eigentlich verbotene Kampf-Tricks zurück, dann tobt ihr Publikum! Lucha Libre ist die populärste aller Sportarten in Mexiko, beliebter noch als Fußball. Fast ein Viertel aller Kämpfer sind Frauen. Es ist grelles Volkstheater, vor allem für die ärmeren Schichten. Ganze Familienclans strömen mindestens einmal pro Woche in die Arenen - vom Kind bis zu 80-jährigen Greisinnen. Zu den schrillen maskierten Kämpfern zählt sogar ein Priester. Beim Lucha Libre dürfen Kämpfer wie Zuschauer Grenzen überschreiten, fluchen und obszöne Gesten machen, die sonst im Alltag verpönt sind. "Schimpfworte sind für mich Komplimente", sagt die Lady, die eigentlich gar keine ist, "das bedeutet, dass meine Rolle als Böse, als "Ruda", funktioniert. Eigentlich heißt sie Enedina Molina. Der Weg der Verwandlung zu "Lady Warrior" war nicht leicht. Ihr ganzes Leben lang war Enedina von der Magie des Lucha Libre fasziniert. Als 17-Jährige fasste sie dann gegen den Willen ihres Vaters den Entschluss, selber Kämpferin zu werden. Heute verdient sie tagsüber als Obstschälerin das Geld für sich und ihre zwei Töchter, am Abend steht sie maskiert als "Lady Warrior" im Ring. DE 2008
