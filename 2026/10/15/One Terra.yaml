  title: Planet Weltweit - Spitzbergen - eisige Insel
  subtitle: Planet Weltweit - Spitzbergen - eisige Insel
  description: |-
    Der arktische Herbst ist kurz. Bereits Ende September bereiten sich die Bewohner Spitzbergens auf den langen, dunklen Winter vor. Wer kann, verlässt jetzt die Inseln. Eine kleine Gruppe von Menschen bleibt jedoch. Es sind vor allem Studenten, Wissenschaftler und Logistiker: Zu ihnen gehört Rupert Krapp. Seit Ende der 1990er Jahre lebt er in Longyearbyen, dem größten Ort auf der  Hauptinsel. Von hier aus beliefert er all jene, die in einsamen Stationen und auf  Forschungsschiffen  versorgt werden müssen.

    Abende wie dieser, an denen er Freunde treffen und gemeinsam kochen kann, sind während der  geschäftigen Sommermonate selten in Rupert Krapps Alltag. Zwischen Mai und Ende September versorgt der Logistiker Kreuzfahrtschiffe, Transportfrachter der Kohleindustrie, Forschungsstationen oder  Feriencamps. Denn wer auf Spitzbergen lebt, hat immer einen Auftrag und muss seine kostbare Zeit  zum Arbeiten, zum Studieren oder Forschen nutzen. Erst im Winter rücken die wenigen Bewohner, die  auf der Hauptinsel bleiben, zusammen. Einer von Rupert Krapps Gästen, der es schon sechs Jahre auf  Spitzbergen aushält, ist der Geologe Malte Jochmann. Im Auftrag eines norwegischen Konzerns  untersucht er die reichen Kohlevorkommen der Inselgruppe. In diesem Herbst machte der Münchner in einem Flöz Hunderte Meter unter der Erde einen besonderen Fund: er entdeckte Fußabdrücke eines Dinosauriers. An zwei freien Tagen zieht es Malte Jochmann hinaus in die Weite der arktischen  Tundra. Zusammen mit seiner Freundin geht er auf Rentierjagd - ein Privileg, das auf Spitzbergen jedem Einwohner nach einigen Jahren zugestanden wird. Es ist vielleicht ihre letzte Chance in diesem Jahr, bevor sich die "Kalte Küste" - wie die Norweger die Inselgruppe nennen - in eine menschenfeindliche Gegend verwandelt.  DE 2010
