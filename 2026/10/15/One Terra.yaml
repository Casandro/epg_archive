  title: Planet Weltweit - Bolivien, Lebensader Todesstraße
  subtitle: Planet Weltweit - Bolivien, Lebensader Todesstraße
  description: |-
    Bolivien ist das Land mit den größten Höhenunterschieden Südamerikas. Zwischen dem Hochland der Anden im  Westen und dem Quellgebiet des Amazonas im Osten fällt die Landschaft um 4.000 Meter ab. Mittendrin liegen die steilen Täler und Hänge der Yungas - mit den gefährlichsten Straßen der Welt. Allen voran die "Carretera de  la Muerte": die Todesstraße!

    In Boliviens Höhenlagen zwischen 1.200 und 1.800 Metern gedeihen in mildem, feuchtem Klima Kaffee, Obst,  Gemüse und vor allem Coca-Sträucher, mit denen sich viel Geld verdienen lässt. Die Blätter dieser Pflanze  werden in Bolivien als Volksmedizin eingesetzt, sie helfen gegen Kopfschmerzen, Übelkeit, Hunger und die weit verbreitete Höhenkrankheit. Aber sie dienen auch zur Herstellung der gefährlichen Droge Kokain. Der Coca-Anbau  ist weltweit verboten - außer in Boliviens Hochland. Den Transport der begehrten Fracht über schmale,  ungesicherte Passstraßen bis in die Metropole La Paz übernehmen mutige LKW-Fahrer. Einer von ihnen ist Bernabé  Quispe, selbst Cocalero, Coca-Bauer. Tagtäglich steuert er seinen 24 Jahre alten Lastwagen über die wohl gefährlichste Route der Welt, die Todesstraße. Wir durften ihn und seine Familie auf ihren riskanten Fahrten begleiten.

    Wenn Bernabé seinen alten Truck Baujahr 1988 besteigt, um die Andenpässe zu überqueren, betet er nicht nur zur  Gott, sondern er opfert vorsorglich auch "Pachamama", also Mutter Erde. Aus gutem Grund. Denn die Straße, die er befährt, ist nur zwei bis drei Meter breit und fällt auf einer Seite 800 Meter steil ab - ganz ohne sichernde Leitplanke. In nahezu jeder Kurve zeugen kleine Kreuze von den vielen Opfern, die diese "Todesstraße" bereits gefordert hat. Zwischen La Paz und der Provinzhauptstadt Coroico gibt es zwar neuerdings  eine gut ausgebaute, breite Landstraße, aber zu allen anderen Orten entlang seiner Route führt nur die mörderische Schotterpiste. DE 2012
