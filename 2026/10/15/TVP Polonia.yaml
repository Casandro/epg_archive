    Nadieżda telefonuje do Sabiny i pozwala jej usłyszeć głos Basi. Dziewczynka jest ciężko chora i błaga ciocię o pomoc. Stan małej sprawia, że Sabina podejmuje bolesną decyzję. Postanawia wydać brata na łup oprawców Nadieżdy, wierząc, że w ten sposób uratuje życie ukochanej bratanicy. Tumska spotyka się z bossem, którego informuje o przygotowaniach do przyjęcia dużego transportu heroiny. Ku jej przerażeniu boss wie o kłopotach z Halskim.
