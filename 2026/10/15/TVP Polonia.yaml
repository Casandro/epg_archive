  description: |-
    Tytuł oryginalny: Zakochaj się w Polsce
    PL, 2022
    Reżyseria: Ewa Grodzka
    Ponadczasowa seria podróżnicza, wpisująca się w cykl inicjatyw promujących i popularyzujących Polskę w oparciu o jej potencjał historyczny, kulturowy, przyrodniczy i rekreacyjny. Tomasz Bednarek odwiedza najpiękniejsze i najciekawsze miejsca w wielu zakątkach kraju, wędrując nie tylko szlakiem tłumnie odwiedzanym przez turystów, ale docierając również do miejsc, o których wiedzą nieliczni. Kożuchów to miasto w województwie lubuskim.
  ageRating: 7
  genre:
