    Wczesnym rankiem w zaułku Sete znaleziono ciało 18-latka. Wszelkie ślady wskazują, że zanim został uduszony, walczył z kimś. Niestety, na miejscu zbrodni nie znaleziono żadnego śladu DNA napastnika. Znaleziono za to legitymację Legii Cudzoziemskiej. Ofiarą okazał się Arnaud Terrasson, obywatel Szwajcarii. Czy legionista na urlopie został zamordowany podczas pijackiej bijatyki?
