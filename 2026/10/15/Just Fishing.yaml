  title: Auf Hechte in Nordirland
  subtitle: Auf Hechte in Nordirland
  description: "Nordirland verbinden noch viele mit der IRA und roher Gewalt, obwohl das kleine Land schon längst befriedet ist. Die Metropole Belfast faszinierte die Global Angler auf ihrer Tour genau so wie auch die Angelei am Lough Erne. \nDer riesige See liegt idyllisch an der Borderline (Grenze) zur Republik Irland und beherbergt in seinem moorigen Wasser wahre Hecht-Monster denen die Angler in diesem Film gezielt nachstellen werden. DE 2017"
- eventId: 740266
  start: 2026-10-15T21:10:00Z
  stop: 2026-10-15T21:58:00Z
  title: Mit dem Global Angler auf Sail & GT vor Madagaskar
  subtitle: Mit dem Global Angler auf Sail & GT vor Madagaskar
  description: |-
    Vor Madagaskar gibt es so gut wie keinen kommerziellen Fischfang. Dementsprechend unberührt sind auch die Fischgründe. Haie, Sails, Hundezahnthune und große GTs brachten die Rollen der Freunde während dieser Reise ständig zum Glühen.
     DE 2018
