  title: Il sacrificio di Salvo D'Acquisto
  subtitle: 'A 80 anni dalla morte, Rai Storia ricorda il sacrificio del vicebrigadiere dei Carabinieri Salvo D''Acquisto, fucilato da soldati nazisti presso la Torre di Palidoro, in provincia di Roma. Grazie alla struggente '
  description: "intervista alla madre registrata dalla Rai negli anni '60, alle testimonianze del fratello Alessandro D'Acquisto e del Generale dell'Arma Antonino Neosi, si ricostruiscono le vicende di Salvo D'Acquisto culminate con l'atto eroico del 23 settembre 1943 quando, dopo un rastrellamento nazista per rappresaglia, il giovane Carabiniere offre la propria vita per salvare quella dei 22 uomini catturati dalle truppe tedesche e destinati alla fucilazione. Ancora oggi il gesto di Salvo D'Acquisto rimane uno degli esempi più edificanti della storia contemporanea italiana. - \n\nDi Fabrizio Marini"
