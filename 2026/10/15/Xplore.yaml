  description: "Vom Bodensee aus geht es über Basel und Straßburg bis nach Mainz. Im Schweizer Städtchen Stein am Rhein ist der Rhein im Sommer ein einziger großer Badeplatz. Das Wasser ist kalt, aber sauber. Als Schwimmtrainerin in der Schweizer Lebensrettungsgesellschaft kennt und respektiert Jennifer Glogg die starke Strömung. Trotzdem gehört das Bad im Rhein für sie zum Alltag. Allzuweit darf sie sich jedoch nicht mittreiben lassen. Denn bei Schaffhausen zeigt der Rhein deutlich, wie viel Kraft in ihm steckt: der Rheinfall ist mit 23 Metern Europas höchster Wasserfall. Für Schiffe ist er unpassierbar. Das brachte Schaffhausen einst den Wohlstand, die Schiffe wurden vor dem Rheinfall entladen. Auch Basel hat vom Rhein als schnellem Verkehrsweg bis hinauf zur Nordsee enorm profitiert. Doch die Stadt hat dem Rhein nicht immer gut getan. Nach dem Unfall in einem Chemie-Werk 1986 verseuchten 20 Tonnen Gift den Fluss. Eine Katastrophe, gleichzeitig aber ein Weckruf gegen den Missbrauch der Ressource Wasser. Für dieses Umdenken steht das \nRhybadhysli, ein historisches Schwimmbad auf einer Plattform direkt auf dem Fluss. Badechef Hugo Buser möchte die Baseler näher an ihren Fluss bringen und macht aus dem Badhysli einen Kultort. Am Hafen von Lauterbourg steht das \"Au Bord du Rhin\", das Restaurant der Familie Schwartz - mitten in der Risikozone. Knapp ein Dutzend Mal wurde das Haus schon von Hochwasser überflutet. Wenn der Pegel steigt, stehen auch am Illinger Altrhein die Weiden unter Wasser, wie ein Schwamm saugen die Auen die Wassermassen auf. Ein Paradies für Wasservögel und für den Fotografen Arno Helfer. Er dokumentiert, wie der Rhein sein ursprüngliches Gesicht zurückgewinnt. Den Flussgrund hält Thomas Bach sauber, der Kapitän der \"Carl Straat\". Sein Schiff kann eine stählerne Tauchglocke absenken, die durch Überdruck das Wasser vom Rheinboden verdrängt. Thomas Bach kann dann trockenen Fußes unten arbeiten und zum Beispiel verloren gegangene Anker bergen. DE 2013"
