  stop: 2026-10-15T10:55:00Z
  title: VIP Trip - Prominente auf Reisen 7 - Costa Rica mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 7 - Costa Rica mit Michael Roll
  description: 'Costa Rica: Das mittelamerikanische Land zwischen karibischer und pazifischer Küste ist ein riesiges Naturparadies und lockt mit seiner gewaltigen Artenvielfalt Reisende aus aller Welt an. Vor allem Naturliebhaber und Abenteuerlustige, die authentische Urlaubserfahrungen suchen. "Costa Rica ist deshalb so interessant, weil nicht nur einzigartige Naturerlebnisse, sondern auch spektakuläre, sportliche Aktivitäten quasi nebeneinander erfahren werden können", antwortet der Schauspieler Michael Roll auf die Frage, warum er sich gerade dieses Land für seine Reisereportage ausgesucht hat. Als Konsequenz hat er sich ein strammes Programm auferlegt: Um die Natur in vollen Zügen genießen zu können, besucht Michael Roll die aktiven Vulkane Turrialba und Irazú und begibt sich in die Schwüle des Regenwaldes. Um dessen Baumwipfel zu erkunden, lässt er sich beim Ziplining, also an einer Seilrutsche, durch die Luft gleiten. Bei einer Rafting-Tour kämpft er sich durch die Stromschnellen des Sarapiquí-Rivers, der nach jüngsten Regenfällen besonders viel Wasser führt. In seiner Reportage widmet sich Michael Roll auch den Geheimnissen der Kakao- und Kaffeeproduktion und geht der Frage nach, welche kulinarischen Spezialitäten sich aus Palmenherzen zaubern lassen. Die Kamera ist stets hautnah dabei, wenn Michael Roll ohne vorgefertigtes Drehbuch seine Reiseerlebnisse sammelt und spontan kommentiert: "Mir hat diese Reportage sehr großen Spaß bereitet und ich habe viel über Costa Rica, seine Kultur und seine Menschen gelernt." CR 2024'
