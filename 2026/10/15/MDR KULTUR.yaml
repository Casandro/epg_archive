    * 12:15 Uhr - KOCHWERK, veganes Bistro in Görlitz: der besondere Mittagstisch
    Es gibt Initiativen, die sind  so ungewöhnlich, dass sie verdienen, näher beleuchtet zu werden. Das "Kochwerk" in Görlitz gehört definitiv dazu:  Menschen mieten eine ehemalige Lagerhalle, weil die Miete günstig ist - verwandeln diesen in einen hippen Ort - indem sie  veganes Essen für andere kochen. Viele Künstler und Theaterleute übrigens. Preis und Angebot sind so gut, dass sich die Macher des "Kochwerkes" vor Fans und Kundschaft kaum retten können. Und noch etwas ist besonders und hat auch usnere Autorin Blanka Weber (die im Sommer da war) staunen lassen.

    * 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr
    Von Anne Wihan

    * 12:45 Uhr - Rathmann live in Mitteldeutschland
    Das teilweise aus Leipzig kommende Trio Rathmann ist auf Tour. Im Gepäck: das gerade erst erschienene Debütalbum "Die Goldenen Zwanziger". Der Titel spielt natürlich zum einen auf das aktuelle Jahrzehnt an, gleichzeitig aber auch auf das Alter der drei Mitglieder, die sich eben in ihren Zwanzigern befinden. Die Musik von Rathmann kennen sie eventuell schon aus dem Programm von MDR KULTUR, Sänger Magnus Ernst möchte sie zu zwei Konzerten einladen. Von Andreas Zagelow

    * 13:15 Uhr - Serie "Portobello" auf arte"
    ARTE zeigt in Deutscher Erstaufführung ab morgen in der Mediathek und linear eine Woche später im TV mit PORTOBELLO einen Sechsteiler, um einen der größten Justizskandale Italiens. Es geht um den beliebten Showmaster Enzo Tortora, der in den 1970er- und 1980er-Jahren die populäre TV-Show "Portobello" moderiert - bis er beschuldigt und verurteilt wird, ein Mitglied der Mafia zu sein. Regie führte Italiens Altmeister MARCO BELLOCCHIO, der sich in den letzten Jahren mit Kinofilmen wie DIE BOLOGNA ENTFÜHRUNG oder IL TRADITORE-ALS KRONZEUGE GEGEN DIE COSA NOSTRA und vor allem vor vier Jahren mit der Fernsehserie UND DRAUSSEN DIE NACHT über Aldo Moro als ein kenntnisreicher Chronist Italiens erwies. Jörg Taszman stellt PORTOBELLO vor.

    * 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr
    Von Anne Wihan

    * 13:45 Uhr - MDR KULTUR Fragebogen an Annett Louisan
    Chanson in Deutschland hat sie revolutioniert. Ihre Texte sind voller Poesie, voller Doppeldeutigkeiten und voll mit trockenem Humor. Musik, die verführt, gleichzeitig aber auch provoziert, und das schon seit ihrem allerersten Lied "Das Spiel". 2004 war das und ihr Markenzeichen damals wie heute ist ihre einzigartige, unverwechselbare Stimme. Zu hören gibt es diese Stimme auf ihrem neuen Album "Sehnsucht" und bei ihrer Deutschlandtour, die sie auch nach Mitteldeutschland bringt. Wie aus dem Mädchen aus Sachsen-Anhalt die Frau wurde, die heute ein Synonym für deutsche Chansons ist, ob so eine markante, aber auch polarisierende Stimme eher Fluch oder Segen ist, und warum es gar nicht so schlimm ist, älter zu werden, das erzählt Annett Louisan im MDR KULTUR  Café heute ab 12:00 Uhr. Heri ihre Antworten auf den Fragebogen...


    Die Sängerin Annett Lousian heute ab 20  Uhr im langen Gespräch im MDR Kultur Café und schon jetzt in der kostenfreien App Sounds...


