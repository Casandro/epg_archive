  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - MDR KULTUR Fragebogen an Michael Krebs\nEr ist Kabarettist, Musiker, Entertainer - und ein genauer Beobachter seiner Zeit: Michael Krebs tritt meistens auf Kleinkunstbühnen auf, manchmal aber auch auf Metal-Festivals und wo er spielt, verbindet er politischen Witz mit Musik, Alltagsbeobachtungen und einer gehörigen Portion Selbstironie. Im letzten Jahr wurde sein künstlerisches Schaffen mit dem Leipziger Löwenzahn ausgezeichnet, dem  traditionsreichen Preis für das beste Programm bei der Lachmesse. Dieses Jahr am 25.10. eröffnet der gebürtige Schwabe das größte Humorfestival des Ostens. \nEr hat vorher einen Abstecher nach Halle gemacht und hier sind seine Antworten auf den MDR KULTUR Fragebogen.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 06:40 Uhr - Der Stichtag: 1926 Michel Foucault geboren\nEr wird gern als einer der einflussreichsten Philosophen des 20. Jahrhunderts bezeichnet, um dann nicht selten anzufügen, dass er selbst mit der Bezeichnung in dieser Eindeutigkeit wohl nicht so recht glücklich gewesen wäre: «Man frage mich nicht, wer ich bin, und man sage mir nicht, ich solle der gleiche bleiben», hat Michel Foucault gesagt. Heute vor 100 Jahren wurde er geboren. Der Stichtag von Thomas Hartmann.\n\n* 06:50 Uhr - Kulturtipp: Theater Altenburg\nStroboskoplicht, Kunstnebel, ein DJ und alles, was noch zu einem guten Rave gehört, gibt es heute Abend im Theater Altenburg. Da stehen Schauspieler und Tänzer gemeinsam auf der Bühne und nehmen das Publikum mit in die Altenburger Diskothek \"Teichhaus\" - und zurück in die 90er-Jahre. Ein Kulturtipp von Katrin Engelhardt.\n\n* 07:10 Uhr - \"Die Bauleitung\" aus Schmalkalden\nSie renoviert ein altes Haus in Thüringen auf eigene Faust und hat damit eine Debatte losgelöst. Cindy-Adriana Speich begleitet ihre Renovierungsarbeiten sehr erfolgreich mit der Kamera, zeigt es bei Social Media und erntet dafür viel Lob aber auch Hass mit dem sie wiederum einen sehr humoristischen Umgang gefunden hat, der ihren Erfolg umso mehr befeuert hat. Die selbsternannte \"Bauleitung\" - versorgt ihre 1.2 Millionen Follower täglich mit Videos (Reels) indem sie ihre Do it yourself Renovierung am Haus begleitet. \n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Neue Musik von Paul McCartney\nNoch keine fünf Monate alt ist das aktuelle Album von Paul McCartney \"The Boys Of Dungeon Lane\". Darauf reiste er musikalisch und textlich zurück zu seinen Anfängen, seiner Kindheit und Jugend in Liverpool, den ersten Begegnungen mit den anderen drei Beatles.\nLetzten Freitag ist dieses Album nun erneut erschienen. Mit vier neuen Bonus-Songs. Für Fans sicher ein Muss, für alle anderen wohl eher ein Kann. Aber entscheiden Sie selbst. Wir hören eines der neuen Stücke:  Paul McCartney mit \"Chelsea Boots\".\n\n* 08:10 Uhr - Die Filme der Woche\nHeimsuchung - Eine Jahrhundertgeschichte R: Volker Schlöndorff - die Verfilmung des Romans von Jenny Erpenbeck - der sogar Schulstoff ist - wie kommt die anspruchsvolle Struktur des Buches auf die Leinwand?\nCall Me Queen R: Emily Atef - dieser Film führt uns nach Nairobi in die Zeit einer schweren Krise?\nLondon R: Sebastian Brameshuber - dieser Film aus Österreich hat einen vielleicht etwas irreführenden Titel, denn in London sind wir hier nie?\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 08:40 Uhr - Was hat das \"Kulturbündnis Sac"
