  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 14:45 Uhr - Kulturtipps\n\n* 15:10 Uhr - Buch: Wolf Biermann \"Mit uralten Kinderaugen\"\n\"Maulschlachten\" sind nach eigener Aussage Wolf Biermanns erklärte Spezialität. Provokationen und Auseinandersetzungen scheute der be-deutendste deutsche Liedermacher nie, egal, ob er nun Stefan Heym ei-nen \"Feigling\" nannte oder Gregor Gysi als \"Verbrecher\" bezeichnete. Der Bühnenstar, der heute 90 Jahre alt geworden ist, hat gerade einen neuen Gedichtband vorgelegt, der Texte aus den Jahren 2006 bis 2026 enthält. Er trägt den Titel \"Mit uralten Kinderaugen\". Unser Kritiker Ulf Heise stellt ihn vor.\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Paula Kautz\n\n* 15:40 Uhr - Porträt Hans Pischner zum 10. Todestag\nEr hat ein ganzes Jahrhundert erlebt und das Musikleben, vor allem in der DDR, mit geprägt. Cembalist, Kulturmanager und Operintendant Hans Pischner hat mit David Oistrach musiziert, war enger Mitarbeiter von Johannes R. Becher und hat Otmar Suitner an die Berliner Staatsoper engagiert. In der DDR war er eine der einflussreichsten Kulturpersönlichkeiten, aber auch ein angesehener Solist auf seinem Instrument, dem Cembalo. Heute vor 10 Jahren - am 15. Oktober 2016 - ist Hans Pischner mit 102 Jahren gestorben. Ein Porträt von Bernhard Schrammek, für das er mit dem damals schon reichlich 100Jährigen sprechen konnte. \nBernhard Schrammek über den Cembalisten, Kulturmanager und Operintendanten Hans Pischner, der heute vor 10 Jahren gestorben ist. \n\n* 15:50 Uhr - Baba Yaga \nDie Weltmusikband aus Wien singt in 7 Sprachen. Die Mitglieder kommen aus ganz Europa. Ihr neues Album heißt \"Odiseja\" - naheliegend , daß es sich  um ine Reise zu den musiklischen Wurzeln der vielvölker Band handelt. Aber dem ist nicht ganz so, erzählt Florian einer der Musiker in der MDr Kulturstudiosession bei Jan Kubon.\n\n* 16:10 Uhr - Saxon Moonbase Challenge - Feriencamp in Löbau \nMit dem Artemis-Programm der NASA rückt die Besiedlung des Mondes näher. Doch wie könnte eine solche Mondbasis aussehen und funktionieren? In Löbau entwickeln Jugendliche zusammen mit Experten ein sächsisches Modell. \n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Paula Kautz\n\n* 16:40 Uhr - Helden oder Verräter? Die gefährliche Welt der Whistleblower \nWhistleblower leben gefährlich. Ein Click und ein Geheimnis erreicht die Weltöffentlichkeit. Sie gelten als Helden. Oder Verräter. Der preisgekrönte Regisseur Marc Bauder erkundet mit seinem Dokumentarfilm \"Whistleblower\" die Welt dieser Informanten, in der es lebensnotwendig ist zu wissen, mit wem, wann und wie Wissen geteilt\nwird. Über drei Jahre begleitet er Jäger und Gejagte weltweit und jene, die die  Whistleblower schützen: Menschenrechtsanwälte, aber auch Delphine Halgand-Mishra mit ihrer Organisation \"The Signal Networks\". Ihr geht es darum, den Whistleblowern ein Leben \"danach\" zu sichern. Notfalls organisiert sie politisches Asyl. Heute sind Whistleblower gefährdeter denn je, das ist die Erkenntnis des Regisseurs.\nMit ttt diskutiert er, warum Whistleblower ihr Leben und ihre Freiheit riskieren, um die Öffentlichkeit über Missstände zu informieren. \"Whistleblower\" kommt am 15. Oktober in die Kinos. Ein ttt-Beitrag von Petra Dorrmann, für den Hörfunk umkonfektioniert. Von Jan Tussing\n\n* 17:10 Uhr - KOCHWERK, veganes Bistro in Görlitz: der besondere Mittagstisch\nEs gibt Initiativen, die sind  so ungewöhnlich, dass sie verdienen, näher bel"
