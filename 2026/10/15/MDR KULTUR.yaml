  title: MDR KULTUR Spezial KINO/FILM/TV/SERIE
  description: "Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen. Berichte über Filmprojekte und Filmfestivals.\n\nThemen der Sendung u. a.:\n\n* Film der Woche: Heimsuchung\n87 Jahre alt ist Volker Schlöndorff jetzt - an den Ruhestand denkt der Regisseur aber noch lange nicht. Heute kommt kommt sein neuer Film \"Heimsuchung\" ins Kino - eine Romanverfilmung , wie schon sein 1966 in Cannes ausgezeichnetes Regiedebüt \"Der junge Törless\" oder \"Die Blechtrommel\", für die er 1980 als erster deutscher Filmemacher den Oscar für den Besten Internationalen Film erhalten hat. Wie gelungen seine neue Literatur-Adaption ist: Bettina Dunkel stellt ihn vor.\n\n* Mediathekstipp \"Gerta\" bei arte \nIn Tschechien hat das Buch ein Tabu gebrochen: Die junge Schriftstellerin Katerina Tuckova thematisiert 2009 als eine der ersten die Vertreibung der Deutschen nach dem Zweiten Weltkrieg.\nMenschlich, differenziert und schonungslos rüttelt sie am Dogma der Kollektivschuld der Deutschen und der tschechischen Unschuld. Die Brünner Schriftstellerin hat eine Welle der Aufarbeitung und\nAussöhnung angestoßen - besonders durch Kunst, Kultur und die Zivilgesellschaft. In der Politik ist das anders. Da ziehen anti-deutsche Ressentiments mitunter noch: Zu beobachten diesen Mai rund um das erste Treffen der Sudetendeutschen in ihrer alten Heimat in Brünn. Eine aufwändige deutsch-tschechische Film-Adaption des Bestsellers ist gerade im Arte Stream zu sehen. Unsere Korrespondentin in Tschechien Marianne Allweiss \nmit den Hintergründen.\n\n* Von Palucca bis ins Fernsehen\nVom Ballettsaal auf die Fernsehleinwand: Michael Ihnow begann seine künstlerische Laufbahn schon als Kind an der berühmten Gret Palucca-Schule in Dresden. Es folgten Engagements als Solist an der Semperoper Dresden sowie an der Komischen und der Deutschen Oper Berlin, bevor er sich zunehmend dem Schauspiel zuwandte.\nIm neuen Kieler Tatort \"Unter Feinden\" ist er als Kurt Fauser zu sehen. Der Krimi bildet den zweiten Teil eines Zweiteilers und erzählt von Ermittlungen, die tief in ein Geflecht aus Macht, Loyalität und Verdacht führen.\nMit Michael Ihnow sprechen wir über seine Rolle im \"Tatort\", über die Verbindung von Körper, Bewegung und Schauspiel und über einen bemerkenswerten Berufsweg, der vom Tanz über die Choreografie bis vor die Filmkamera geführt hat.\n\n* Serientipp: Die Falle \nDie deutsche Produktion basiert auf dem gleichnamigen Bestseller-Roman von Melanie Raabe. Im Mittelpunkt steht die erfolgreiche Schriftstellerin Lisa Konrad (gespielt von Friederike Becht), die ihr Haus seit fast zehn Jahren nicht mehr verlassen hat. Sie leidet unter den Nachwirkungen des unaufgeklärten Mordes an ihrer Schwester Anna. Als sie den mutmaßlichen Mörder im Fernsehen zu erkennen glaubt, fasst sie einen gefährlichen Plan: Sie benutzt sich selbst als Köder."
  subtitle: Mit Knut Elstermann
