  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Der Stichtag: 1926 Michel Foucault geboren\nEr wird gern als einer der einflussreichsten Philosophen des 20. Jahrhunderts bezeichnet, um dann nicht selten anzufügen, dass er selbst mit der Bezeichnung in dieser Eindeutigkeit wohl nicht so recht glücklich gewesen wäre: «Man frage mich nicht, wer ich bin, und man sage mir nicht, ich solle der gleiche bleiben», hat Michel Foucault gesagt. Heute vor 100 Jahren wurde er geboren. Der Stichtag von Thomas Hartmann.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 10:40 Uhr - Lutz Seiler heute zu Gast in Leipzig\nLange erwartet: Der neue Roman von Lutz Seiler, in dem er die Stränge seines Romanhelden aus \"Kruso\" und \"Stern 111\" weiterführt. Heute abend ist Lutz Seiler mit diesem neuen Roman \"Das tickende Herz\" zu Gast beim Literarischen Herbst in Leipzig, ab 19 Uhr im haus des Buches. Bei MDR Kultur stellte Niels Beintker den Roman vor. Seiler liest heute abend 19 Uhr im Literaturhaus Leipzig.\n\n* 10:50 Uhr - Das Gedicht: \"Im Badezimmer meiner Mutter\" von Sascha Kokot\nEine feine Veranstaltungsform für die Gegenwartslyrik ist beim Festival Literarischer Herbst in Leipzig entwickelt worden: Zum \"Lyriksalon\" lädt Leipziger Autorin oder Autor sich einen Gast aus einer anderen Stadt ein - zu gemeinsamer Lesung und Gespräch. Heute um   19 Uhr trifft Sascha Kokot seinen Kollegen Christoph Wenzel in der Möbelkkooperative Süd, in der Leipziger Südvorstadt; am 17.10. dann ist Lutz Seiler zu Gast bei Jörg Schieke, ab 20 Uhr in der Alten Post in Lindenau. Jetzt zur Einstimmung ein Text von und mit Sascha Kokot aus seinem aktuellen Band \"Geisternetze\".\n\n* 11:15 Uhr - Feuilleton\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 11:45 Uhr - Literaturredakteur Jörg Schieke über die Didier Eribon: Foucault. Eine Biografie \nAm 15. Oktober 1926 wurde in Frankreich der Philosoph Michel Foucault geboren.  Das war ja bereits Thema des Stichtags hier bei MDR KULTUR.Seine Bücher tragen Titel wie: \"Wahnsinn und Gesellschaft\", \"Die Ordnung der Dinge\", \"Der Gebrauch der Lüste\" oder \"Die Geständnisse des Fleisches\".\nMit diesen Büchern und neuen Methoden des philosophischen Denkens wurde Foucault seit den 1950er Jahren bis zu seinem Tod im Sommer 1984 zum intellektuellen Weltstar.\nAuf dem Wag da hin - zum Weltstar - ist Didier Eribon, erfolgreicher Sachbuchautor inzwischen, der 2011 eine Biografie über Foucault vorlegte, die nun neu und überarbeitet erschienen ist und von Hans Horst Henschen und Michael Bischoff ins Deutsche übersetzt wurde. Für uns gelesen von Jörg Schieke.\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
