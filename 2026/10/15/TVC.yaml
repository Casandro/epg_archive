    Tytuł oryginalny: The Curse of Oak Island
    US, 2016
    Występują: Craig Tester, Rick Lagina, Marty Lagina, Michel Ouellette, Andrew Folkins, Charles Barkhouse
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
