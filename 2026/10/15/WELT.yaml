  title: Mayday - Rätsel um EgyptAir-Flug 804
  subtitle: Mayday - Rätsel um EgyptAir-Flug 804
  description: Ein Airbus A320 verschwindet spurlos auf dem Flug von Paris nach Kairo. 66 Menschen sterben. Was folgt, ist eine internationale Ermittlung zwischen technischen Pannen und Terrorverdacht - und ein jahrelanger Streit um die Wahrheit. Die Doku rekonstruiert die Ereignisse und beleuchtet, warum der Fall bis heute ungelöst bleibt.
  widescreen: true
- eventId: 720382
  start: 2026-10-15T20:05:00Z
  stop: 2026-10-15T21:00:00Z
  title: 'Lost Places: Folge 127'
  subtitle: 'Lost Places: Folge 127'
  description: 'Vor 100 Jahren war Pawhuska in Oklahoma eine der reichsten Gemeinden der Welt. Das heute verfallene Duncan Hotel im Zentrum der verschlafenen Kleinstadt ist Ausgangspunkt einer dramatischen Geschichte, die das Hollywood-Epos "Killers of the Flower Moon" inspirierte. Außerdem: eine ehemalige Schule in Kambodscha, die unter der Terrorherrschaft der Roten Khmer zum grausamen Foltergefängnis wurde. Und: eine geheime Stadt in Lettland, die die Welt im Kalten Krieg an den Rand des Atomkriegs brachte.'
  widescreen: true
- eventId: 720383
  start: 2026-10-15T21:00:00Z
  stop: 2026-10-15T21:55:00Z
  title: 'Lost Places: Folge 128'
  subtitle: 'Lost Places: Folge 128'
  description: 'Ein Betonkoloss im sowjetischen Vilnius wird 1988 zur Arena eines historischen Duells hinter dem Eisernen Vorhang: NBA-Stars treffen auf die Auswahl der UdSSR. Eine Zeche im britischen Clipstone-Schauplatz eines erbitterten Machtkampfs zwischen Bergarbeitern und Margaret Thatcher. Ein Wolkenkratzer in Memphis lockt Rock-''n''-Roll-Größen, geht aber an einem 99-Jahre-Pachtvertrag zugrunde. Und im malaysischen Dschungel träumt ein Prinz von einem Palast, bis eine Tragödie alles zunichtemacht.'
  widescreen: true
- eventId: 720384
  start: 2026-10-15T21:55:00Z
  stop: 2026-10-15T22:47:00Z
  title: Lost Places - Folge 78
  subtitle: Lost Places - Folge 78
  description: 'In Maltas Hauptstadt Valletta befindet sich eine verborgene Gartenanlage:  Von wem wurde dieser prunkvolle Bau errichtet? Am Rande der kubanischen Hauptstadt Havanna liegt die verlassene Ruine einer einst berühmten Kunstschule. In der US-Metropole Philadelphia erstreckt sich ein weitläufiger Komplex, in dem einst ein berühmter Straftäter lebte. Und im Süden Nürnbergs liegt ein verwildertes Areal mit Bauten, die an Deutschlands dunkle Geschichte erinnern.'
  widescreen: true
- eventId: 720385
  start: 2026-10-15T22:47:00Z
  stop: 2026-10-15T23:33:00Z
  title: Lost Places - Folge 98
  subtitle: Lost Places - Folge 98
  description: Die Burg Houska in Tschechien, erbaut im 13. Jahrhundert direkt über dem "Tor zur Hölle", ist bis heute ein mystischer Ort voller düsterer Legenden. Es heißt, die Nazis hätten hier bis 1945 geheime Experimente durchgeführt. Sind das bloß Gruselgeschichten? Zudem das einstige Prunkstück Liberias, das 5-Sterne-Hotel Ducor in Monrovia. Ehemals ein Symbol des afrikanischen Aufschwungs, ist es heute nur noch eine Ruine - ein stummes Zeugnis vergangener Glanzzeiten.
  widescreen: true
