  title: 'Mayday: Gefährlicher Irrtum'
  subtitle: 'Mayday: Gefährlicher Irrtum'
  description: Nach umfangreichen Wartungsarbeiten in Portugal soll eine Embraer E190 der Air Astana nach Kasachstan zurückfliegen. Doch schon kurz nach dem Start gerät das Flugzeug im Luftraum über Lissabon in schwere Turbulenzen und droht abzustürzen. Nur dank des besonnenen Vorgehens der Piloten und der Unterstützung durch portugiesische Kampfjets gelingt der Crew in einem dramatischen Kraftakt die Landung. Wie konnte die Steuerung der frisch gewarteten Maschine komplett außer Kontrolle geraten?
  widescreen: true
- eventId: 720381
  start: 2026-10-15T19:10:00Z
