  title: 'Die Wechseljahre: Zu heiß für Deutschland?'
  subtitle: Film von Antonia Coenen mit Sabine Heinrich
  widescreen: true
  hd: true
  audiodesc: true
  description: "\"Bin ich schon in den Wechseljahren - und wenn ja, was heißt das eigentlich?\" Moderatorin Sabine Heinrich ist 49 und merkt: Da verändert sich etwas. Körperlich, emotional, hormonell. Und sie ist damit nicht allein. Neun bis elf Millionen Frauen in Deutschland befinden sich derzeit in den Wechseljahren - oft einhergehend mit Hitzewallungen, Schlafproblemen, Erschöpfung oder Konzentrationsstörungen. Trotzdem wird über die Wechseljahre noch immer nicht genug gesprochen. \nWarum bleiben die Bedürfnisse von Frauen in dieser Lebensphase so oft unsichtbar - im Job, in der Medizin und in der Gesellschaft generell?"
