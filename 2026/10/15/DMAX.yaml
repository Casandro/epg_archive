  title: Feuerwache 1 - Alarm in Ingolstadt
  subtitle: Frisch vom Band und schon zerbeult
  description: |-
    Stefan und sein Kollege Sebastian führen am sogenannten "Abrollbehälter Einsatzleitung" einen Rundumcheck durch. Der AB-EL wird bei Großschadenslagen als mobile Zentrale genutzt und ist mit modernster Kommunikations- und IT-Technik ausgestattet, die im Ernstfall fehlerfrei funktionieren muss. Eine Amtshilfe für die Polizei führt die Männer der Wachabteilung 2 zu einem Einfamilienhaus, das vor zwei Jahren in Flammen stand. Damals waren 100 Feuerwehrleute im Einsatz. Außerdem wird das Team zu einer Unfallstelle mit drei leicht verletzten Personen gerufen.
