    Die Einsatzkräfte der "Air Ambulance" versorgen in der Nähe von Skipton die einzige Überlebende einer Massenkarambolage. Das Schien- und Wadenbein der Lkw-Fahrerin sind gebrochen. Die Knochen sind regelrecht zersplittert. Um den Blutverlust zu begrenzen und bleibende Schäden zu vermeiden, müssen die Notfallsanitäter:innen das Bein in seine korrekte Position bringen. Und in North Yorkshire sind Metallteile von einem Lastkraftwagen gefallen. Dabei wurde ein Tischler von schweren Platten getroffen. Der Mann könnte seinen Unterschenkel verlieren.
