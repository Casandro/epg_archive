  title: Goldfieber Down Under
  subtitle: Episode 3
  description: |-
    Wenn in Queensland die Regenzeit beginnt, geraten Straßen und Maschinen durch Dauerregen und Stürme in Gefahr. Deshalb treffen Jacob, Norman und Sebastian in Down Under Vorkehrungen: Die Männer wollen ihr Camp absichern und zusätzliche Pfosten in den Boden rammen. Dazu benötigen sie Holz. Die Schatzsucher ziehen mit der Kettensäge los, um Bäume zu fällen. 20 Kilometer weiter südlich füttern James und sein Team ihre Waschanlage Marke Eigenbau mit Schürfmaterial. Doch der Wasserdruck ist zu hoch - dadurch könnte den Goldgräbern wertvolles Edelmetall verloren gehen.
