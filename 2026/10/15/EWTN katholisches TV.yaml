  title: In persona Christi - Das sakramentale Priestertum in der Kirche
  subtitle: Gemeinsames und besonderes Priestertum
  description: Was bedeutet die Taufe? - Man kann vom Priester in der Kirche nicht sprechen, ohne zunächst an das Sakrament der Taufe zu erinnern. Denn der Priester ist selbst ein Getaufter. Die Taufe schenkt ihm die Würde der Gotteskindschaft. Und als Priester, der im Sakrament der Weihe mit Christus als dem Haupt der Kirche gleichgestaltet worden ist, steht er ganz im Dienst des gemeinsamen Priestertums aller Gläubigen, die ihm von Gott anvertraut werden.
