  title: Babiččiny recepty s Vladimírou Jakouběovou
  description: Staročeské recepty našich babiček a prababiček, které můžete v kuchyni vyzkoušet i vy, nabízí každý všední den po 11. hodině Vladimíra Jakouběová, sběratelka regionálních receptů. Nechte se inspirovat - čekají vás recepty z Pojizeří, Jizerských hor, z Liberecka i Lužice, sladké, slané, polévky a další dobroty. Těší se na vás Vladimíra Jakouběová.
