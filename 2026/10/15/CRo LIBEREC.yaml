  title: Host Dopoledne pod Ještědem
  description: 'Téma: Jen si vzpomenout. Knihovnice a lektorka paměti 1. stupně Michaela Valterová. Vzpomínky, emoce, myšlenky i sny. Za tím vším je fascinující orgán - mozek. A stejně jako tělo, i mozek potřebuje výživu, trénink a odpočinek. S lektorkou paměti Michaelou Valterovou si hodinu před polednem povíme, jak správně trénovat paměť a proč je důležité dodržovat spánkovou hygienu.'
