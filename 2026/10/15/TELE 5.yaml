  title: Machine Gun Preacher
  description: |-
    Sam Childers (Gerard Butler) Leben als Mitglied der Hell's Angels ist geprägt von Drogen und Kriminalität. Bis er ins Gefängnis kommt. Wieder draußen findet der Mann mit der schweren Kindheit durch seine Frau Lynn (Michelle Monaghan) zum Glauben. Childers beginnt eine missionarische Reise nach Uganda. Vor Ort erkundet er gemeinsam mit dem SPLA-Soldaten Deng (Souléymane Sy Savané) die Krisengebiete in friedlicher Absicht. Doch schon bald ist er mit mörderischen Warlords konfrontiert und muss handeln. - Nach der wahren Geschichte von Sam Childers, die er 2011 als Biografie veröffentlichte.
