  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Der Schatz der Keltenkönigin
  description: |-
    Genötigt und gedemütigt durch die Besatzung der Römer, kam es um das Jahr 60 n. Chr. zu einem blutigen Aufstand in Britannien. Ein keltischer Stammesverbund aus bis zu 150.000 Kämpfern zog in die Schlacht! Angeführt wurden die Krieger von Keltenkönigin Boudicca, die bis heute als Volksheldin gilt. Jetzt begibt sich Abenteurer Josh Gates auf die Spuren der legendären Kriegsherrin. Sein Ziel ist das einstige Schlachtfeld und Hoheitsgebiet der Icener. Nahe der Ortschaft Snettisham, in Norfolk, spürt Josh gemeinsam mit Schatzsuchern aus der Region keltischen Goldartefakten sowie 2.000 Jahre alten Silbermünzen nach.
