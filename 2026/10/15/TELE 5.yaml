  title: Sniper 3
  description: |-
    Hintergrund:Die Geschichte spielt in Vietnam und dort auch in Ho Chi Minh, aber alle Schilder sind in thailändischer Schrift. Der Grund ist offensichtlich: Es wurde in Thailand gedreht. Der Film, der im Motel-Zimmer des Scharfschütze Beckett läuft, ist das legendäre Kriegsdrama "Die Brücke am Kwai" aus dem Jahr 1957. Die beiden Maschinengewehre, die zu Beginn des Films auftauchen, tragen die Namen Mangold und Pennycate - eine Hommage an die Autoren Tom Mangold und John Pennycate, die das Buch THE TUNNELS OF CU CHI geschrieben haben, eine Quelle für das Drehbuch.
