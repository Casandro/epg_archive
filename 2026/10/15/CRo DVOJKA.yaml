  stop: 2026-10-15T16:30:00Z
  title: Moci bez nemoci
  description: Choroba malých tepen. Další díl pořadu přináší příběh Agáty, které je 36 let. Bolest na hrudi ji zastihla v posilovně. Tehdy si řekla, že je na takové onemocnění přeci ještě mladá. Novinková možnost vyšetření malých srdečních tepen ji přinesla řešení a úlevu. Pro koho je takové vyšetření vhodné a v čem nám může pomoci? Pozvání autorky a moderátorky pořadu Šárky Volemanová přijal také Prof. MUDr. Tomáš Kovárník, Ph.D. - vedoucí lékař oddělení intervenční kardiologie Všeobecné fakultní nemocnice Praha. Premiéra.
