  stop: 2026-10-15T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Kateřina Macháčková, herečka. Proč má dojem, že ji polovina národa miluje a polovina nesnáší? Jak dlouho hledala cestu ke svému otci a kdy mu konečně porozuměla? A co ji nejvíc baví na práci s mladými adepty herectví? Moderuje Jaroslav Sedláček.'
