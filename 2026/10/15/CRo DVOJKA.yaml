  stop: 2026-10-15T20:30:00Z
  title: Četba na pokračování
  description: 'Petr Sagitarius: Trujkunt - Kruhy (8/8). Kdo byl třetím účastníkem noční schůzky? Svérázný major Roman Saran vyšetřuje brutální vraždu. Nález zohaveného těla uprostřed podivných kruhů v obilném poli je jen začátkem temného příběhu, který dá ostravské kriminálce pořádně zabrat. Připravila Eva Lenartová. Účinkuje Jan Szymik. Režie Tomáš Soldán. Natočeno v roce 2022.'
- eventId: 763692
