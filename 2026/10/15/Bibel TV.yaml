  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND In Beziehungen gibt es oft beides: große Gefühle und die nüchterne Realität. Auch in der Beziehung zu Gott kann das so sein. Doch was macht man, wenn die Realität des Alltags die Beziehung zu Gott überschattet? Wenn die Zweifel größer sind als die Gefühle? Im Gespräch mit Moderatorin Bente Rathjen spricht Pastor Malte Detje darüber, wie wichtig es ist, den Zuspruch von Gott nicht aus den Augen zu verlieren.'
