  title: WDR 3 Konzert
  subtitle: Preisträgerkonzert Maria-Ladenburger-Förderpreis für Musik 2026
  description: |-
    Vier starke Künstlerpersönlichkeiten aus der Begabtenförderung des Cusanuswerks sind mit dem Maria-Ladenburger-Förderpreis für Musik 2026 ausgezeichnet worden. Mit Programmbeiträgen unter dem Motto "Freiheit" bedankten sie sich in einem beeindruckenden Konzert, in dem sie ihre musikalische Exzellenz und Ausdruckskraft zeigen konnten - und ihre ganz eigene künstlerische Handschrift!
