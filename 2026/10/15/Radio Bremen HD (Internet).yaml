  title: mareTV
  subtitle: Montenegro - An der Küste der lebenden Legenden
  description: 'In Montenegro tummeln sich gleich mehrere Legenden: In Kotor werden Straßenkatzen verehrt, denn sie sollen einst die Bewohner vor der Pest bewahrt haben. Legendär im Nationalsport Wasserball ist der dreifache Europameister Veljko Uskokovic und aus dem Städtchen Perast brechen an jedem 22. Juli unzählige Boote zu einer ganz besonderen traditionellen Wallfahrt auf. Montenegro ist noch immer ein Geheimtipp. Dabei punktet seine Küste genau wie im benachbarten Kroatien mit türkisfarbenem Wasser, kleinen Buchten und malerischen Städtchen.'
