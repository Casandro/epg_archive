  title: Leopard, Seebär & Co. (94)
  subtitle: Geschichten aus dem Tierpark Hagenbeck in Hamburg
  description: |-
    Hagenbecks Federvieh ist im kollektiven Brutfieber. Nur ein Vogel kann scheinbar nicht mithalten: im Ibis-Nest liegen Steine statt Eier. Dave Nelde gibt das Verhalten des Tieres Rätsel auf.
    Kombuko verlässt Hagenbeck. Für dieses Ereignis haben die Tierpark-Azubis sogar berufsschulfrei bekommen. Alle stehen bereit, um den jungen Giraffenbullen zu verladen.
    Mandschurenkraniche gehören zu den wertvollsten Vögeln bei Hagenbeck - Starallüren inklusive. Außerdem haben sie äußerst spitze Schnäbel, denen man besser aus dem Weg gehen sollte. Beim Reinigen des Geheges braucht Dave Nelde also eigentlich Augen im Hinterkopf.
