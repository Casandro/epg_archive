  title: Rote Rosen (4398)
  subtitle: Deutschland 2026
  description: "Victoria will mit ihrer knappen Aktienmehrheit einen neuen Aufsichtsrat einsetzen, um so die Kontrolle über die EmKa wiederzuerlangen. Lou ahnt das Vorhaben ihrer Mutter und versucht, es zu verhindern. Kurz vor der Aktionärsversammlung liefern sich Mutter und Tochter einen heftigen Schlagabtausch, den die Aufsichtsräte miterleben und einstimmig beschließen: Kein Mitglied der Familie Kaiser soll je wieder die EmKa führen! \n\nMo darf das Krankenhaus verlassen und könnte nach Parma zurückkehren. Doch als Mo mitbekommt, dass es Simon wegen Valerie schlecht geht, entschließt er sich, vorerst für seinen Freund in Lüneburg zu bleiben."
