  title: Sesamstraße
  description: Grobi taucht beim Blauen auf und präsentiert ihm seinen neuen Supersauger, der alles, aber auch wirklich alles einsaugt. Ernie will herausfinden, wie sich sein Quietscheentchen fühlt. Bert hält das für unmöglich, da das Entchen kein Lebewesen ist. Das sieht Ernie aber anders. Bei den "Smart Cookies" sabotiert der Kekser die Klatschspiel-Weltmeisterschaften. Krümelmonster & die "Cleveren Kekse" müssen eine Lösung finden. Bei den "Unheimlich heimeligen Begegnungen" treffen die drei Musiker auf eine Gruppe traurig aussehender Außerirdischer und versuchen, sie aufzuheitern.
