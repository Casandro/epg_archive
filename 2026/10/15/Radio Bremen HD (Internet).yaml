  title: Wir werden Camper!
  subtitle: Die Erbslöhs an der Côte d'Azur
  description: 'Petra und Rüdiger Erbslöh suchen auf dieser Campingreise den Luxus an der Côte d''Azur! Beide werden bald 70 Jahre alt, der perfekte Anlass, um mit ihrem Wohnmobil "Olaf" zu den Reichen und Schönen zu reisen. Hierfür hat Petra extra Französisch gelernt. In Grasse schnuppern sie an Parfüms, in Cannes folgen sie den Spuren der Filmstars, Monaco beeindruckt mit Megajachten und Luxuskarossen. Bleibt die Frage: Urlaubstipp oder Touristenabzocke?'
- eventId: 802071
  start: 2026-10-15T05:20:00Z
