  description: |-
    Dokumentation, Deutschland 2026
    Im Internet einzukaufen ist heutzutage Alltag: Fast 90 Milliarden Euro gaben die Deutschen 2024 beim Onlineshopping aus. Hinter dieser enormen Summe stecken oft raffinierte Verkaufstricks.

    Pia Osterhaus will herausfinden, wie es die Onlinehändler schaffen, uns zum schnellen "Klick" zu bringen. Mit welchen Tricks werden wir angelockt, wie vertrauenswürdig sind Sterne-Bewertungen, Produktbeschreibungen und zeitlich limitierte Schnäppchen wirklich?
    Kamera: Christopher Scheit, Stefan Jungmann

