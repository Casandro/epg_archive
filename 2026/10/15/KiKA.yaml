    Pip und Posy wollen "Bergretter" für Schweinchen und Froschi spielen. Doch da fällt Pip auf, dass bei Posy ein ziemlicher Kuddelmuddel herrscht. Pip überredet Posy, aufzuräumen.

    Bei Posy soll es genauso ordentlich aussehen wie bei Pip. Ein bisschen widerwillig lässt sich Posy darauf ein, obwohl ihr der Kuddelmuddel eigentlich richtig gut gefällt. Und wie sich herausstellt, ist er auch äußerst praktisch.

    Posy gefällt es, wenn alles immer in Griffnähe liegt. Das muss sogar Pip am Ende einsehen. Und außerdem gibt er zu, dass er ja gerade deshalb so gern bei Posy ist, weil es in ihrem Zuhause eben nicht so aussieht wie in seinem.
