  title: Die Sendung mit dem Elefanten
  subtitle: Was lernen Kinder in der Schule?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Was lernen Kinder in der Schule?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es um die Einschulung. Jonas bastelt seine Schultüte selbst und beklebt sie mit Raketen und Planeten. Leni zeigt uns, wie sie ihren Schulweg übt. Dabei muss sie ganz schön viele Herausforderungen meistern! Vivienne und Nelson sind schon seit einigen Wochen in der Schule. Sie zeigen uns ihre Klasse und sogar das Lehrerzimmer.
