    Die Meeresbiologin Jodie startet das Projekt "Meereswelten-Freunde", um mit ganz Pontypandy die Vielfalt der Meereslebewesen zu erkunden. Ziel ist es, am Strand so viele Tiere wie möglich zu entdecken. Norman schneidet dabei besonders schlecht ab. Auf der Suche nach einer Krabbe läuft die unzufriedene Dilys mit ihm in eine Grotte. Doch die Flut kommt schneller als erwartet. Vom steigenden Wasser werden die beiden eingeschlossen.
