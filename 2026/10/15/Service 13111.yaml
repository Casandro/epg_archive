  title: Geniale Räuber
  subtitle: Geparden auf der Jagd
  description: |-
    Wie machen Geparden Jagd auf Letschwe, Impala und Gnus? Wie spüren diese Raubtiere ihre Beute auf? Dank innovativer Computer-Animationen werden Schlüsselmomente eingefroren und genau unter die Lupe genommen, um Schritt für Schritt die erstaunlichen Fähigkeiten zu enthüllen, die für das Überleben der Geparden unerlässlich sind. Eine erfahrene alleinerziehende Geparden-Mutter steht vor der Herausforderung, einerseits ihre Jungen zu beschützen und andererseits regelmäßig auf Jagd zu gehen, um ihre Energiereserven wieder aufzufüllen und das Überleben ihres Nachwuchses zu sichern. Ein neu gebildeter Verbund dreier Geparden muss zusammenarbeiten und die Interaktion bei der Jagd orchestrieren, um ein Gnu zu erlegen.
    Dokumentarfilm, Vereinigtes Königreich 2024
