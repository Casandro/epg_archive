  title: Hubert ohne Staller
  subtitle: Der nasse Tod
  description: |-
    Yazid versucht sich als Makler und führt ein junges Paar durch das Haus einer Witwe. Als sie dabei auf die Leiche der Witwe stoßen, ist Yazids Versuch, im Immobilienbusiness Fuß zu fassen, umgehend beendet. Das Paar sucht das Weite. Riedl, zufällig in der Nähe, darf erste Beweise sichern, weil Hubert und Girwidz noch am See sind und dort Jagd auf Wildcamper machen. Hubert zumindest, sein Kollege Girwidz ist eher daran interessiert, ein paar schöne Schnappschüsse von sich selbst zu machen, da er seiner Tochter zum 30. Geburtstag ein Fotoalbum schenken will. Da passt es Girwidz natürlich gar nicht, dass sie von ihrer Tour abgezogen werden, während sich Riedl von nun an um die Wildcamper am See kümmern darf. Hubert und Girwidz finden bald heraus, dass der Witwe erst vor wenigen Tagen die Lebensversicherung ihres Mannes ausbezahlt worden war. Doch von dem Geld fehlt jede Spur. Dafür können Hubert und Girwidz in Erfahrung bringen, dass die Witwe kurz vor ihrem Tod noch eine Tauchstunde in der Tauschule "Abgetaucht" genommen hatte. Haben deren Betreiber etwas mit dem Verbrechen zu tun?

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Carsten Fiebeler
