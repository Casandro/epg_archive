  title: P.M. Wissen
  subtitle: u.a. Mehr Durchblick mit Brillenheizung? - Wie Gold gegen beschlagene Brillen hilft
  description: 'In der kalten Jahreszeit fehlt Brillenträgern oft der Durchblick: Trifft kaltes Brillenglas auf warme Raumluft, kondensiert die Luftfeuchtigkeit und die Gläser beschlagen. Das stört Erfinder Dr. Iwan Hächler schon lange. Der Thermodynamiker hat dafür eine Lösung gefunden, die so simpel wie genial ist: Die Brillengläser sollen eine integrierte Heizung bekommen! Dafür tüftelt der Forscher an einer hauchdünnen Beschichtung aus Gold - mit Erfolg. Die ETH Zürich hat seine Erfindung bereits zum Patent angemeldet. // Hausstaub ist nicht nur unser lästiger Alltagsbegleiter - oft ist er auch giftig! Das Deutsche Umweltbundesamt in Berlin untersucht in einer Studie, mit welchen Schadstoffen Wohnungen belastet sind, und diese Informationen stecken unter anderem im Staub. Deshalb sammeln die Forscher insgesamt 400 Staubsaugerbeutel in deutschen Haushalten und lassen sie analysieren auf krankmachende Chemikalien. // Millionen verloren gegangene Fischernetze, die im Wasser treiben oder sich verfangen haben, schwimmen in den Ozeanen. Sie fischen unbemerkt weiter. Jedes Jahr werden so Millionen von Fischen, Vögeln und Meeressäugern getötet. "P.M. Wissen" begleitet Taucher bei einem Einsatz in der Ostsee. Das Team will ein Geisternetz bergen, das sich 30 Meter unter der Wasseroberfläche verfangen hat. // Im Jahr 2019 stößt ein Bagger bei Grabungsarbeiten im niederösterreichischen Ebreichsdorf auf eine echte Sensation: einen mehr als 3000 Jahre alten Goldschatz aus der Bronze-Zeit, darunter eine in Mitteleuropa einzigartige Goldschale. Schon damals haben Menschen also aus Gold Kunstwerke erschaffen. Das Edelmetall muss bereits für unsere Vorfahren einen ganz besonderen Wert gehabt haben. Doch warum war Gold bereits vor Jahrtausenden das begehrteste Metall der Welt?  Österreich 2023'
  genre:
  - '144'
  widescreen: true
