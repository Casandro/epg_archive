  title: Servus Musikantenstammtisch
  subtitle: Im Pinzgau
  description: "Bei diesem Musikantenstammtisch mit dabei ist die Junge Pongauer Tanzlmusi. Die sieben Burschen mit vier Blechblasinstrumenten, steirischer Harmonika, Gitarre und Klarinette sind vor allem für ihre flotte Spielweise bekannt. Sie wissen genau, wie man den Tanzboden beim Kirchenwirt füllt. Richtig flott mag es auch die Eschenauer Tanzlmusi. Die Lokalmatadore brauchen keine Noten und spielen überall - egal ob auf den Tischen, im See oder beim Einzug in den Kirchenwirt. Ohne sängerische Stücke geht im Wirtshaus nichts, das wissen auch die Hollerstauden. Die drei Pinzgauerinnen singen einheimische und eigene Lieder und haben immer einen lässigen Spruch und ein paar lustige Musikantengeschichten parat.\n\n \n\nGenau wie die drei Haudegen des Seekanal Trios. Die Besetzung der drei pinzgauer Originale mit Teufelsgeige und \"Kübelbass\" ist wohl einmalig. Zu diesem Musikantenstammtisch lassen sich auch die einheimischen Trachtler, \"d'Hundstoana\" nicht lange bitten. Sie zeigen den beiden Moderatoren Conny Bürgler und Richard Deutinger den Brauch des Kranzltanzens. Dabei schmücken die Frauen die Hüte ihrer Tanzpartner und bleiben den ganzen Abend nur mit ihnen zusammen. Ganz in der Nähe des Wirtshauses trainiert auch eine Gruppe Herreiter. Wenn die Burschen auf ihren Rössern die Goaßln schnalzen lassen, ist das ein besonders beeindruckendes Erlebnis, um die Tanzsaison gebührend zu verabschieden.\nVolkskultur, Österreich 2018"
  genre:
  - '116'
  widescreen: true
