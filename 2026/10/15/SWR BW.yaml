  description: Ottmar und Tanja machen ihren Traum von der Rente unter Palmen wahr und wagen einen Neustart in einer Seniorenresidenz in Thailand. Hier können sie mit ihrer deutschen Rente leben wie die Könige, und auch im Pflegefall ist man bestens versorgt. Der Neuanfang in der Fremde wird zu einer Herausforderung. Nicht nur die fremde Kultur, auch neue Bekanntschaften sind immer für eine Überraschung gut. Angestachelt von dem Auswanderer Max beschließt Ottmar, eine deutsche Bäckerei vor Ort zu eröffnen. Doch Max entpuppt sich als Betrüger und Ottmar verliert die gesamten Familien-Ersparnisse. Nun steht auch die Ehe auf dem Spiel.
