  title: Eisenbahn-Romantik (836)
  subtitle: KuK-Monarchie-Dampf-Express
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die "Eisenbahn-Romantik"-Sonderfahrt im Herbst 2014 erinnert an die Dampflok-Zeiten der k.u.k.-Monarchie. Die Reise führt über Wien nach Tschechien, in die Slowakei und zurück nach Österreich. Verschiedenste Dampflokomotiven vor dem Sonderzug sorgen dabei für ein wirkliches Nostalgievergnügen.
    In Teil zwei sind die Zuschauer auf den Gleisen der ehemaligen Donaumonarchie unterwegs und entdecken die Geschichte der tschechischen Eisenbahn, die ihren 175. Geburtstag beging. Außerdem geht die Reise zu Dampfschätzen in der Slowakei und zum Dampflokfest "40 Jahre ÖGEG" in Ampflwang in Österreich.
