  description: 'In einem Dorf taucht eines Morgens ein japanischer Mönch auf: Er spricht kein Wort, hat eine Kopfverletzung und ist offenbar auf der Flucht. Hauptkommissarin Louise Bonì spürt sofort, dass der junge Mann in großer Gefahr schwebt. Allerdings glaubt ihr Vorgesetzter Bermann ihr kein Wort - denn seit einem tödlichen Einsatz ist Bonì psychisch angeschlagen und fällt vor allem durch ein Alkoholproblem auf. Trotzdem ermittelt sie auf eigene Faust weiter. Die Spur führt zu einem geheimnisvollen Zen-Kloster und einer privaten Kinderhilfsorganisation, die asiatische Adoptivkinder vermittelt. Bald erwacht in Louise ein schrecklicher Verdacht.'
