  title: 'Hollywood : sexe et puritanisme'
  subtitle: Ces dernières années, les productions hollywoodiennes ont tourné le dos à la sensualité. La scène de sexe est-elle en voie d'extinction, ou de réinvention ?
  ageRating: 12
  genre:
  - '32'
  description: 'Après trois décennies régies par le code de censure Hays, le cinéma américain renoue avec la nudité et la sexualité à la fin des années 1960. Tandis qu''à l''étranger des créateurs vont explorer les tabous dans des oeuvres radicales, Hollywood réduit le plus souvent les femmes à des objets de désir. Dans les années 1990, les scènes de sexe deviennent l''élément central d''un nouveau genre : le thriller érotique, à l''instar de Basic Instinct. Après l''émergence de #MeToo, certains pays imposent une coordination d''intimité quand le scénario comporte une dimension érotique. Alors que certains cinéastes dénoncent une entrave à leur liberté, les productions hollywoodiennes, de leur côté, se détournent de la sensualité. Mais si l''érotisme se fait plus rare, il n''a pas disparu pour autant des écrans. Réalisateur: Viola Löffler. Des acteurs: Nina Schwabe (la narratrice) (2024)'
