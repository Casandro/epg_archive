  title: So schmeckt die Welt - Streuobstwiesen
  subtitle: So schmeckt die Welt - Streuobstwiesen
  description: Streuobstwiesen sind traditionelle landwirtschaftliche Flächen, die eine Vielzahl von Obstbäumen beherbergen, darunter Äpfel, Birnen, Kirschen und Zwetschgen. Sie sind charakterisiert durch ihre hohe Artenvielfalt und dienen als wichtiger Lebensraum für zahlreiche Tier- und Pflanzenarten. Streuobstwiesen fördern die Biodiversität, den Naturschutz und die Erhaltung alter Obstsorten. Sie sind auch ein kulturelles Erbe und prägen das Landschaftsbild vieler Regionen.
  genre:
  - '129'
  widescreen: true
- eventId: 1586334
  start: 2026-10-15T19:40:00Z
  stop: 2026-10-15T20:35:00Z
  title: So schmeckt die Welt - Wein
  subtitle: So schmeckt die Welt - Wein
  description: Wein, eine der ältesten und vielfältigsten alkoholischen Getränke der Welt, wird durch die Fermentation von Trauben hergestellt. Von trocken bis süß, von rot über weiß bis rosé, bietet Wein eine enorme Bandbreite an Geschmacksrichtungen und Stilen. Er ist nicht nur ein Genussmittel, sondern auch ein kulturelles Symbol, das gesellschaftliche Zusammenkünfte und Feiern begleitet. Weinanbau prägt Landschaften weltweit und ist oft eng mit der Geschichte und Tradition einer Region verbunden.
  genre:
  - '129'
  widescreen: true
