  title: Muzyczne podróże
  subtitle: Autorzy wędrują po najpiękniejszych regionach Europy z niemiecką muzyką biesiadną w tle, która od dawna cieszy się dużą popularnością. Twórcy przedstawiają między innymi historię danego regionu.
  description: |-
    Tytuł oryginalny: Lieder, Land und Leute
    DE, 2026
    "Muzyczne podróże" to interesujący program muzyczno-podróżniczy, który zabiera widzów w wyjątkową wędrówkę po najpiękniejszych i najbardziej ciekawych regionach Europy poprzez muzykę. W każdym odcinku autorzy prezentują nie tylko lokalne krajobrazy i kulturę, ale także towarzyszącą im muzykę biesiadną i tradycyjną, charakterystyczną dla danego miejsca.
