  title: 'Rosamunde Pilcher: Spotkanie klasowe 1 (odc. 130)'
  subtitle: Sandra Cale wybiera się w rodzinne strony na spotkanie maturzystów. Niespodziewanie spotyka Luke'a, dawnego kolegę z klasy.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Nie wieder Klassentreffen
    DE, 2017
    Reżyseria: Hans-Jürgen Tögel
    Występują: Denise Zich, Patrik Fichte, Jens-Peter Nünemann, Katja Woywood, Diana Körner, John Friedmann
    Konsultantka biznesowa, Sandra Cale, po raz pierwszy od 20 lat wybiera się w rodzinne strony na spotkanie maturzystów. Prosi swojego szefa Petera, z którym łączy ją romans, by towarzyszył jej w tej podróży. Mężczyzna obiecuje, że opuści żonę, ale tuż przed przyjazdem do Kornwalii zmienia decyzję. Sandra niespodziewanie spotyka Luke'a, dawnego kolegę z klasy. Okazuje się, że oboje byli kiedyś w sobie zakochani i nawet o tym nie wiedzieli.
