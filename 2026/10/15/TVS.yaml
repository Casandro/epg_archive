    Hans przedstawia Susanne plan sprzedaży gospodarstwa. Choć kobieta początkowo ma wątpliwości, zapewnia go o swoim wsparciu. Arno i Katrin znów chcą być razem. Kobieta postanawia pojechać z ukochanym na Madagaskar. Fotografowi jednak coraz częściej przytrafiają się momenty dezorientacji i zaniki pamięci.
    Reżyser: Jan Bauer
