  description: "serial obyczajowy (Niemcy, 2004) odc.6, Hilferuf\nWystępują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser, David Bode, Teresa Weissbach, Martin Goeres, Aline Hochscheid, Alexandra Scheidt\nW przychodni zjawia się kobieta, która niedawno urodziła. Potrzebuje pomocy, gdyż skaleczyła się w rękę, ale Christian dostrzega, że dręczy ją także coś innego. Do Kleistów niespodziewanie przyjeżdża Anke z Benem. Natyka się na Ursta. Tanja informuje rodzinę, że zamierza przyjąć stanowisko adiunkta w Tybindze. \nReżyser: Richard Engel\nOd lat: 12"
