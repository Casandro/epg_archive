  description: "USA 2024\nDeborah ist entschlossen, die Moderatorennachfolge von Danny zu ergattern. Daher muss die \"Roast\"-Show mit humorvollen, spöttischen Beleidigungen zu ihren Ehren ein großer Erfolg werden.\n\nDeborah hofft, dass auch ihre Tochter auftritt. Aber DJ ist nur durch einen besonderen Deal zur Teilnahme bereit. Ava fürchtet Details der schwierigen Mutter-Tochter-Beziehung könnten ein Desaster für Deborah werden oder die schlechten Witze eine Blamage für DJ.\nDarsteller:\nDeborah Vance - Jean Smart\nAva Daniels - Hannah Einbinder\nMarcus - Carl Clemons-Hopkins \nKayla - Megan Stalter\nJimmy - Paul W. Downs\nRegie: Jeff Rosenberg\nBuch/Autor: Joe Mande\n\nHD-Produktion"
