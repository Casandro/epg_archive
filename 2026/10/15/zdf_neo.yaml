  widescreen: true
  subtitled: true
  hd: true
  description: "USA 2024\nDeborah möchte immer noch am liebsten ihre eigene Late-Night-Show moderieren. Jimmy und Kayla bemühen sich daher um Kontakt mit der Comedy-Chefin Winnie Landell.\n\nSie scheuen keine Mühen und versuchen mit einem Trick in ungewöhnlichem Ambiente ein Zusammentreffen der beiden Powerfrauen herbeizuführen. Unterdessen trifft Deborah auf eines ihrer alten Stand-up-Idole und lässt sich auf eine besondere Party ein.\nDarsteller:\nDeborah Vance - Jean Smart\nAva Daniels - Hannah Einbinder\nMarcus - Carl Clemons-Hopkins \nKayla - Megan Stalter\nJimmy - Paul W. Downs\nRegie: Jessica Brunetto\nBuch/Autor: Guy Branum\n\nHD-Produktion"
