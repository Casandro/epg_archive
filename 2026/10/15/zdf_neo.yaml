  hd: true
  description: "USA 2024\nDeborah reist mit Ava nach Berkeley, um einen Ehrendoktortitel entgegenzunehmen und für ein Porträt ein Interview für ein renommiertes Magazin zu geben. Doch dann ziehen neue Probleme auf.\n\nEin unglücklicher Zusammenschnitt von Deborahs problematischsten Witzen, der viral geht, droht ihre neue Chance auf eine Late-Night-Show zu Nichte zu machen.\nDarsteller:\nDeborah Vance - Jean Smart\nAva Daniels - Hannah Einbinder\nMarcus - Carl Clemons-Hopkins \nKayla - Megan Stalter\nJimmy - Paul W. Downs\nRegie: Paul W. Downs\nBuch/Autor: S. Riley, L. Aniello u.a.\n\nHD-Produktion"
