  widescreen: true
  subtitled: true
  hd: true
  description: "USA 2024\nDeborah gibt eine Weihnachts-Dinnerparty. Und auf Wunsch ihrer schwangeren Tochter DJ hat sie auch ihre verhasste Schwester Kathy eingeladen. Natürlich kommt es schnell zum Streit.\n\nDenn Deborah kann ihrer Schwester einfach nicht verzeihen, dass diese vor vielen Jahren eine Affäre mit ihrem Mann hatte. Kann eine Aussprache etwas ändern? Jimmy und Kayla suchen derweil einen Weg, damit Deborahs Late-Night-Traum doch noch wahr wird.\nDarsteller:\nDeborah Vance - Jean Smart\nAva Daniels - Hannah Einbinder\nMarcus - Carl Clemons-Hopkins \nKayla - Megan Stalter\nJimmy - Paul W. Downs\nRegie: Lucia Aniello\nBuch/Autor: Pat Regan\n\nHD-Produktion"
