  description: "USA 2024\nDeborah nimmt an einem Golfturnier teil, um sich bei den dort ebenfalls teilnehmenden Lokalsenderchefs beliebt zu machen. Dort trifft sie nicht nur auf Marty.\n\nAuch Bob Lipka ist vor Ort, der bei der Auswahl des neuen Moderators für \"Late Night\" das größte Mitspracherecht hat. Unterdessen trifft Ava auf eine Golferin, die ihr reges Interesse weckt.\nDarsteller:\nDeborah Vance - Jean Smart\nAva Daniels - Hannah Einbinder\nMarcus - Carl Clemons-Hopkins \nKayla - Megan Stalter\nJimmy - Paul W. Downs\nRegie: Paul W. Downs\nBuch/Autor: Ariel Karlin\n\nHD-Produktion"
