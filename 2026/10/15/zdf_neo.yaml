  description: |-
    Peter Lustig ist fasziniert von den Kleinstlebewesen im Gras. Eine eigene kleine Welt. Weiß der Ohrenkneifer, wie gefährlich es sein kann, einen Apfel zu verspeisen?

    Und wie lange macht eine Grillendame ihre Winterwanderung? Letztendlich erkennt Peter, wie wichtig alle diese noch so kleinen Lebewesen sind, und wie gefährlich es ist, wenn der Mensch sie mit Schädlingsbekämpfungsmitteln beseitigen will.
