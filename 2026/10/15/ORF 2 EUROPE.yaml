  description: Millionen Menschen kommen jedes Jahr nach Österreich - auf der Suche nach ihren persönlichen Sehnsuchtsorten. Für jene, die hier leben, gehört der Besucherstrom zum Alltag. Manchmal reicht er sogar bis ins eigene Wohnzimmer. Schauplatz-Reporterin Julia Kovarik dokumentiert den Alltag von Menschen, deren Heimatorte zu Kulissen des internationalen Massentourismus geworden sind.
