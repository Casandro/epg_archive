  title: Die Stille danach
  description: |-
    (Fernsehfilm, AUT/DEU 2015)
    Aus heiterem Himmel stürzen Paula und ihre Familie in die Katastrophe. Mitten im Dienst erhält die Krankenschwester einen alarmierenden Anruf. An der Schule gab es einen Amoklauf. Als sie dort ankommt um nach ihrem 15-jährigen Sohn Felix zu suchen trifft die Wahrheit sie mit voller Wucht. Ihr Sohn, der schüchterne, höfliche Felix war der Täter. Von da an ist nichts wie es war. Die Familie ist wütenden Anfeindungen ausgesetzt. Und sie muss versuchen, das Unverständliche zu verstehen. Wie konnte es zu diesem Wahnsinn kommen?
    Mit Ursula Strauss (Paula Rom), Peter Schneider (Michael Rom), Sophie Stockinger (Flora), Enzo Gaier (Felix), Rainer Wöss (Zoller), Philipp Hochmair (Prof. Kruger) u.a.
    Drehbuch und Regie: Nikolaus Leytner
    Koproduktion ORF/MDR
