- eventId: 764675
  start: 2026-10-15T20:00:00Z
  stop: 2026-10-15T21:00:00Z
  title: EXCALIBURR
  description: Nejostřejší rapová show široko daleko. Hodina v plné zbroji pro všechny rytíře ukáže, kdo je král a kdo páže. Každé dva týdny čekejte příjezd karavany plné aktualit z bitevního pole, k tomu vybroušené rozhovory s hlavními hybateli i šedými eminencemi scény. O rapu a všem okolo něj, to je vaše pravidelné rapové ostří! Oslava kamilství i těch nejvytříbenějších skills, od rapperů přes producenty a grafiky až po fashion designéry nebo zlatníky. Zbojníci Jardič, Don Chain a Casablanka každého z hostů zapojí do tématických speciálů, nabitých rubrik a vybaví vás do plné polní svým rapovým přehledem.
- eventId: 764786
  start: 2026-10-15T21:00:00Z
