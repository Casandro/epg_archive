  title: Čelisti
  description: Čelisti se tentokrát zaměří na vzdělávání. Jak se Alešovi, Vítkovi a Martinovi pozdávalo Mungiovo pokračování Troškovy komediální série Fjord, seno a pár facek? Schvalují výchovné metody matky hlavní hrdinky seriálu Carrie? Stali by se pilnými žáky "školy přežití", kterou si v Divočině otevřela Klára Issová? A patří Minotaur do světa Zvířat, nebo do světa lidí, případně je odmocninou / protlačeninou skutečného světa? Dědeček / Trenér / Výrazný strýc / Vdovec / Kuna.
- eventId: 764590
