  title: Chudáčci
  description: Chudáčci Petr Uhlík a Adam Trnka Ernest kráčejí v nové epizodě po tenkém ledě. Vyhověli totiž posluchačským výzvám a natočili díl o vlastních ženách. Jak se herci se svými herečkami poznali? Který z Chudáčků tančí své paní nahý a který utáhl svou ženu na svačinky? Poslechněte si ve čtvrtek večer Chudáčky, třeba se vám některá balící rada bude hodit.
