  title: Psycho
  description: 'True crime, skutečné oběti, ale pozornost patří hlavně pachatelům. Nová série Monster: Příběh Lizzie Borden romantizuje násilí skrze krásné záběry a příběh touhy po svobodě. Oběti přitom ustupují do pozadí. Karolína a Pavel v novém Psychu řeší uměleckou stylizaci zločinu i Freudův odkaz: proč tak rádi hledáme vysvětlení násilí v dětství?'
