  title: Tussen Kunst en Kitsch Extra
  subtitle: Tinnen zuigflesje E19. Een bijzonder voorwerp, een aansprekend verhaal of een opvallende ontwerper of kunstenaar; het kunnen allemaal aanleidingen zijn voor een Tussen Kunst en Kitsch Extra.
  description: Een tinnen bodemvondst, in de vorm van een zuigfles, komt aan het daglicht. Expert en liefhebber Jan Beekhuizen ziet direct aan het patin dat het een bodemvondst is. Naast de zuigfles, die gekenmerkt wordt door een gekroonde roos en de letter F, laat Jan ook andere zuigflesjes uit zijn collectie zien. Ook gaat Jan naar Tingieterij Holland, waar nog steeds met behulp van oude en nieuwe mallen tin wordt vervaardigd. (2024)
