  title: ANIXE auf Reisen - Hongkong - kulturell
  description: 'In Hongkong trifft Jahrtausende alte Kultur auf die Trends und Herausforderungen der Moderne. Ca. 7,5 Million Menschen leben in der Metropole, welche zu den am dichtesten besiedelten Gebieten der Welt gehört. Hongkong hat eine vielfältige Künstler und Kreativ Szene und so findet man Galerien an Orten, die eher unüblich sind, z.B. in den Treppenhäusern alter, leerstehender Industriebauten. Da die Stadt sehr dicht bebaut ist, fehlt es an großen Ackerflächen und so verwundert es nicht, dass sich ein weiterer ungewöhnlicher Trend entwickelt hat: das Rooftop Gardening, also der Anbau von Gemüse und Obst auf den Dächern der Stadt.'
