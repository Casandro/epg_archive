  description: '2022 ● FSK: 16 Der Jüngling Hans langweilt sich auf dem Hof seines Vaters und sehnt sich nach Liebe. Seine Brautsuche führt ihn quer durch das Märchenland der Gebrüder Grimm, wo er unter anderem Dornröschen, Rumpelstilzchen und Frau Holle begegnet. Schließlich trifft Hans auch Gevatter Tod und hilft ihm aus einer misslichen Situation. Gerührt von dieser Geste macht er Hans ein Versprechen: Wenn seine Zeit gekommen ist, will er ihn nicht gleich holen, sondern zunächst einen warnenden Boten schicken. Science fiction / Fantasy / Horror 2022, Regie: Thomas Pill,  Mit: Anne Alexander-Sieder, Melody Bayer, Günther Brandl, FSK 16'
