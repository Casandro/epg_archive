  description: Diese Dokumentation beleuchtet den dramatischen Vorfall an Bord des Singapore Airlines Fluges SQ321, bei dem ein Mann starb und viele schwer verletzt wurden. Auf 37.000 Fuß Flughöhe erschüttern schwere Turbulenzen das Flugzeug - inzwischen gibt es eine Detailanalyse ihrer Ursachen und Auswirkungen. Kann man Turbulenzen vermeiden? Interviews mit Betroffenen, Piloten und Wissenschaftlern, sowie Simulationen und Aufnahmen, zeigen, wie die Luftfahrt auf Turbulenzen reagiert.
  widescreen: true
