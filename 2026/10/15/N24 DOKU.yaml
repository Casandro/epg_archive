  subtitle: Legenden auf Rädern - Vom Jugendtraum zum Klassiker
  description: Was macht ein Auto zur Legende? Die Dokumentation begleitet Menschen, für die Klassiker weit mehr sind als Fortbewegungsmittel. Ein Sotheby's-Experte, ein Porsche-Sammler und ein Autojäger auf der Suche nach seltenen Muscle Cars geben Einblicke in eine Welt voller Leidenschaft und Erinnerungen. Von versteckten Scheunen bis zu renommierten Auktionshäusern zeigt sich, wie Youngtimer der 80er- und 90er-Jahre zu begehrten Kultobjekten werden und eine neue Generation von Sammlern begeistern.
