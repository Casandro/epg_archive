  title: Geniale Maschinen - Lebensretter
  subtitle: Geniale Maschinen - Lebensretter
  description: 'Wenn Menschen in Gefahr oder ganze Gebiete bedroht sind, werden gigantische Maschinen als Lebensretter eingesetzt. Das Löschflugzeug CL-415 schafft es, großflächige Waldbrände zu löschen. Um Katastrophenhilfe über den Seeweg anzufordern, kommt das schwimmende Superkrankenhaus USNS Mercy zum Einsatz. Außerdem in dieser Folge: Der Panther 8X8, der Brände bekämpft, die durch Flugzeugtreibstoff verursacht werden, ein revolutionäres Geländefahrzeug und ein Suchhubschrauber mit Wärmebildkamera.'
  widescreen: true
