  title: 'Marvellous Machines: Stille Helden'
  subtitle: 'Marvellous Machines: Stille Helden'
  description: 'Mit Hochdruck gegen Gummiabrieb: Ein gigantischer Staubsauger reinigt die Landebahnen am Flughafen vom gefährlichen Belag. Atomuhren, die alle 10 Millionen Jahre nur eine Sekunde abweichen. Eine Wunderwaffe gegen Schlaglöcher. Diese Maschinen sind die stillen Helden unserer Zeit, unverzichtbar, doch oft unbemerkt. In dieser Folge lüften wir das Geheimnis dieser unsichtbaren Wächter der Technikwelt.'
