  description: Während die ersten Marsreisen vorbereitet werden, geht der Blick der Astronomen auf der Suche nach habitablen Planeten schon weit über unser Sonnensystem hinaus. Die Suche nach Exoplaneten steht im Fokus der Astronomie. Bislang zeigen die meisten dieser neu entdeckten Welten jedoch nur, wie lebensfeindlich der Kosmos ist. Mit welchen Methoden versuchen die Forscher, in der Milchstraße einen erdähnlichen Planeten aufzuspüren und wie stehen die Chancen, dort draußen eine "zweite Erde" zu finden?
