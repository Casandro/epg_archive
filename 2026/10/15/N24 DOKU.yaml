  title: Der Löschgigant - Hightech am Flughafen
  subtitle: Der Löschgigant - Hightech am Flughafen
  description: Am Flughafen Berlin Brandenburg befindet sich eine der modernsten Feuerwachen Deutschlands. Ein wichtiges Arbeitsinstrument dabei ist ein spezielles Hightech-Löschfahrzeug, entwickelt im baden-württembergischen Giengen. Binnen drei Minuten müssen die Einsatzkräfte jeden Platz auf dem Flughafen erreichen, denn hier zählt jede Sekunde. Die Reportage gewährt einen Einblick in die Entwicklung des komplexen Löschfahrzeugs und zeigt die Übungseinsätze am Flughafen hautnah.
  widescreen: true
- eventId: 741070
