  stop: 2026-10-15T06:55:00Z
  title: Máme hosty
  description: Po dvou letech se na zámek vrátí stálá expozice archeologie. Představí nejstarší dějiny regionu od doby kamenné až po období stěhování národů. A na pardubickém zámku i příhrádku můžete tento týden oslavit také Mezinárodní den archeologie. Pozveme si ředitele Východočeského muzea v Pardubicích Tomáše Libánka a archeoložku Kristýnu Bulvovou. Moderuje Jakub Malý.
