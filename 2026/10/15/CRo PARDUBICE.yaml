  stop: 2026-10-15T15:42:00Z
  title: O čem se mluví v Pardubickém kraji
  description: Letošní komunální volby v Pardubicích znovu rozvířily debaty o existenci městských obvodů. Jaký smysl má třeba ten centrální, který sídlí 350 metrů od hlavní budovy magistrátu? Co budou jeho stěžejní témata následující 4 roky? Už je jasno o koalici? A udrží se v křesle starosta Filip Šťastný z vítězného hnutí ANO? Zeptáme se ho. Moderuje Jakub Malý.
