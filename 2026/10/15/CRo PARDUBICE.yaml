  start: 2026-10-15T16:04:00Z
  stop: 2026-10-15T17:00:00Z
  title: Kdo umí, ten umí
  description: Původní profesí strojní zámečník Jiří Čáp se dostal do firmy, která se věnovala opravám automobilů, především veteránů. Ti se stali jeho celoživotní vášní a postupně si získal pověst odborníka, kterého znají po celém světě. Dnes už je sice v důchodu, ale rád vzpomíná na dobu, kdy do jeho dílny putovaly i přes oceán vzácné automobily staré téměř sto let. Připravila reportérka Šárka Rusnáková.
