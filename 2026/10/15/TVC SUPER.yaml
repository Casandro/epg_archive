  title: 'Detektyw Candice: Niezawodny instynkt 4 (odc. 1)'
  subtitle: Candice wraz z rodziną wprowadza się do nowego domu nad wodą. Antoine'a na własną prośbę zostaje przeniesiony do policji kryminalnej w Montpellier i uprzykrza życie Candice.
