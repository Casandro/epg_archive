  title: Slovensko v obrazoch (19)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: Na Gemeri pribudla nová ferrata. Okolie Jelšavy a jej banícku históriu môžete spoznať s prilbou na hlave a visiac na lane. Spoločnosť vám bude robiť dobrosrdečný obor Miko... Už od útleho veku si voľný čas krátil prácou s drevom. Keď vyštudovaný strojár Milan Karľa ostal po zranení na invalidnom dôchodku, vrátil sa k svojej drevenej láske z detstva. S úsmevom hovorí, že spokojne žije pri koryte a dlabe si svoj sen... Krásnu prírodu striedajú geologické záhady a stopy nie tak dávnej minulosti - to je turistická ponuka z Kysúc. Ukryté v lese nájdeme pozostatky vojnových stavieb i prírodný úkaz tzv. megoňky... Cestovanie je staré ako ľudstvo samo - či už to bolo pešo, na koči, po vode, po koľajach či na kolesách. V Múzeu dopravy v Bratislave spoznáte, ako sme kedysi cestovali. Medzi exponátmi sú aj ručne vyrobený drevený bicykel i automobil Alexandra Dubčeka. (2026)
  genre:
  - '35'
