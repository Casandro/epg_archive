  title: SK Dejiny (9)
  subtitle: Dualizmus a Slovensko - Národ a ľud. Populárno-náučná diskusia o objavovaní zlomových okamihov našich dejín.
  description: Nové životné situácie a predstavy o budúcnosti v časoch rakúsko-uhorského dualizmu vyvolali zmeny v mentalite človeka na prahu modernity. Šírili sa novátorské myšlienky o zdravotníctve, stravovaní, hygiene či sociálnych otázkach. Ľudia sa zaoberali potrebou školskej reformy, ktorá patrila k prioritám. Prebiehal masívny rozvoj úverových a potravinových družstiev, ktoré už neboli len ekonomickým, ale aj spoločenským a kultúrnym fenoménom. Formovanie robotníckeho hnutia viedlo až k vytvoreniu celouhorskej politickej strany, ktorej agenda sa zameriavala na zlepšenie pracovných podmienok, na rast miezd, skrátenie pracovnej doby či všeobecné volebné právo. A bol naozaj slovenský vidiecky ľud taký národne a politicky ľahostajný, ako sa zvykne hovoriť? Povieme si v treťom pokračovaní SK_Dejiny o rakúsko-uhorskom vyrovnaní. (2026)
  genre:
  - '35'
