  audiodesc: true
  description: 'Haus F gehören aktuell zu den spannendsten Newcomern der deutschen Indie-Pop-Szene: Mit ihrem handgemachten Sound, authentischem Auftreten und musikalischem Können begeistern die vier Freunde aus Berlin. Was als Taschengeld-Band angefangen hat, ist inzwischen ein Social-Media-Hype. In ihren "PULS Startrampe"-Live Sessions präsentieren Haus F Songs voller Emotion und spielfreudiger Bandmomente, irgendwo zwischen gefühlvoller Ballade und funky Indie-Pop-Song.'
