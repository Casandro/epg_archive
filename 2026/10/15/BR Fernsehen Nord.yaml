  audiodesc: true
  description: Indie-Musiker Kasi performt seine eigene Interpretation von "Die Sonne in deinem Zimmer" von Edwin Rosen als Startrampe COVERED Session. Intensiv, ehrlich und mitreißend - Kasis Musik vereint beschwingt-melancholische Indiepop-Elemente mit legerem Rap und formlosen Gesangsmelodien. Kasi sucht Authentizität .Seine Musik vereint Rap, Gitarrensounds und Gesang, und er lässt bewusst Widersprüche zu. Seine Identitätssuche zwischen Weltschmerz und Leichtigkeit macht ihn zu einer der spannendsten Neuentdeckungen der deutschen Musikszene. Seine Kunst ist geprägt von der Konfrontation mit Kontrasten und dem Streben nach Echtheit.
