  audiodesc: true
  description: Die Bayern 3 Band, unter anderen mit Radiomoderatorin und Instagram-Host Sophie Grund sowie Radiomoderator Bene Gutjan, sorgt mit den größten Chart-Hits und Partyklassikern für einen energiegeladenen Start ins Bayern 3 POP-up Festival. Mit Leony und FAST BOY stehen anschließend zwei der erfolgreichsten deutschen Pop-Acts auf der Bühne. Außerdem können Besucherinnen und Besucher zahlreiche "Bayern 3"-Moderatorinnen, Moderatoren in der Community Corner treffen. "Bayern 3"-DJ Jerry Gstöttner beschließt das Festivalwochenende mit der "Immer-noch-geil-Hits-Party" und den größten Songs der 90er, 2000er und 2010er.
