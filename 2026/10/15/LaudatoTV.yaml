  description: U ovoj epizodi emisije Života na stijeni gost je Brock Martin. Dolazi iz FOCUS-a (Fellowship of Catholic University Students), odnosno Zajednice katoličkih sveučilišnih studenata, i potpredsjednik je za pastoralno djelovanje u župama. FOCUS ulaže velike napore u to kako bi svoje biblijske skupine i zajednice prenio i u župe te ondje evangelizirao. Također ćemo čuti razmatranje oca Marka.
