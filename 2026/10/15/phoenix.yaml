  title: Afrikas Berge (2/4)
  subtitle: 'Uganda: Ruwenzori-Gebirge'
  widescreen: true
  hd: true
  description: Unmittelbar nördlich des Äquators erheben sich aus dem Tropenwald in Uganda mit Gletschern bedeckte Berge - das Ruwenzori-Gebirge. Es ist mit 5.109 Metern das dritthöchste Gebirge Afrikas und bildet die Grenze zur Demokratischen Republik Kongo. Hier leben zahlreiche Affenarten, Antilopen und eine Vielzahl schillernder Vögel. Am Fuße der Berge erstreckt sich der Queen-Elizabeth-Nationalpark. Er gilt mit fast 100 Säugetier- und mehr als 600 Vogelarten als besonders artenreich und als einer der schönsten Afrikas.
