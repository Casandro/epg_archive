  title: Afrikas Berge (4/4)
  subtitle: 'Madagaskar: Andringitra- und Ibity-Massiv'
  widescreen: true
  hd: true
  description: Im Mittelpunkt stehen das bis zu 2.600 Meter hohe Andringitra-Massiv mit seinen mehr als tausend Pflanzenarten und vielfältigen Tierwelten sowie das fast 2.300 Meter hohe Ibity-Massiv, bekannt für seine teils endemischen Aloe-vera-Arten und weitere Heilpflanzen. Angesichts der jährlichen Brandrodungen ist dieser Artenreichtum in Gefahr. Porträtiert werden Akteure, die sich dem Schutz und der Wiederaufforstung der Natur verschrieben haben. Ein französischer Unternehmer hat eine Baumschule gegründet und eine NGO patrouilliert im Primärwald, um ihn und seine Tierwelt zu schützen.
