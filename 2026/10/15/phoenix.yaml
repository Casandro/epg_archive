  title: Putins Propaganda
  widescreen: true
  hd: true
  subtitle: Wie der Kreml das Volk lenkt
  description: "Wladimir Putins Herrschaft basiert auf einer breiten Akzeptanz in der russischen Bevölkerung, die durch Propaganda erzeugt wird. Sein Regime hat im Laufe der Zeit ein ausgeklügeltes und effektives System geschaffen, um die Gedanken und Emotionen des russischen Volkes aktiv zu kontrollieren und zu lenken. Einblicke in diesen wirksamen Mechanismus sind selten. \n\nÜber die Mechanismen und die Wirkung dieser Inlands-Propaganda sprechen fünf prominente russische Stimmen, die heute im Exil leben: Viktor Schenderowitsch, Anna Narinskaja, Tschulpan Chamatowa, Andrej Chrschanowski und Iwan Filippow.\n\nSendehinweis: 15.10.2026, 23:00"
