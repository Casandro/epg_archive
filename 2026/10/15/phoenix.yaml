  subtitle: Spielsucht in Südafrika
  description: "Sisanda Lwana verlor über 7000 Euro durch Online-Wetten - und überwand die Sucht. Ihre Geschichte zeigt die Schattenseiten des Glücksspiels. \n\nDer Traum vom schnellen Reichtum lockt in Südafrika Millionen Menschen an. Aber für viele endet das Glücksspiel in Schulden und Abhängigkeit. Fast jeder dritte Spieler gilt als spielsüchtig. Die Gesundheitshelferin Sisanda Lwana aus Johannesburg hat das überwunden: Nach Jahren der Sucht und wachsenden Schulden gelang ihr mithilfe einer Selbsthilfegruppe der Ausstieg. Heute unterstützt sie andere Betroffene."
