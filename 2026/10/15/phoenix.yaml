  - 979453
  start: 2026-10-15T01:00:00Z
  stop: 2026-10-15T01:45:00Z
  title: Afrikas Berge
  subtitle: 'Uganda: Ruwenzori-Gebirge'
  widescreen: true
  hd: true
  description: 'Der Anblick ist ebenso atemberaubend wie unerwartet: Unmittelbar nördlich des Äquators erheben sich aus dem Tropenwald in Uganda mit Gletschern bedeckte Berge das Ruwenzori-Gebirge. Es ist mit 5.109 Metern das dritthöchste Gebirge Afrikas und bildet die Grenze zur Demokratischen Republik Kongo. 1991 wurde auf der ugandischen Seite der Ruwenzori-Mountains-Nationalpark gegründet, um den Regenwald und die Tiere, die darin leben, zu schützen.'
- eventId:
  - 1193971
  - 979454
  start: 2026-10-15T01:45:00Z
  stop: 2026-10-15T02:30:00Z
  title: Afrikas Berge
  subtitle: 'Tansania: Kilimandscharo und Mount Meru'
  widescreen: true
  hd: true
  description: Mit seinen 5.895 Metern ist der Kilimandscharo nicht nur der mit Abstand höchste Berg Afrikas, er ist auch das Wahrzeichen Tansanias und steht symbolisch für den ganzen Kontinent. Für die Einheimischen ist der Berg weiblicher Natur schüchtern in die Wolken gehüllt und bescheiden. Kilima ist Swahili und bedeutet kleiner Hügel, Njaro ist eine Ortsbezeichnung, die für Wasser steht und die Bedeutung des Berges als Lebensspender für die Region unterstreicht. An seinen Hängen fallen deutlich mehr Niederschläge als in den weiten Ebenen, die ihn umgeben.
- eventId:
