  title: Mein wunderbarer Kochsalon - Blätterteig Pastete mit Huhn und Pilzen
  subtitle: Mein wunderbarer Kochsalon - Blätterteig Pastete mit Huhn und Pilzen
  description: Die Engländer sind die Meister der Pasteten, vieles, was optisch vielleicht etwas ausbaufähig ist, wird in einen Blätterteig gepackt, Deckel drauf, ab in den Ofen und schon hat man einen beeindruckenden Pie. Ich habe mich bei diesen Rezept am klassischen "Chicken pot pie" orientiert - eine Art helles Geschnetzeltes mit Erbsen und Karotten, leicht mit Mehl gebunden. Ich ziehe diese Version mit Pilzen und körnigem Senf eindeutig vor, aber das Prinzip ist das selbe. Man kann die Pastete natürlich auch im Kleinformat produzieren und jedem Gast ein Töpfchen vorsetzen. AT 2017
