  title: Die besten Köche der Welt - Zu Gast im Ikarus - Das Ikarus Team in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Das Ikarus Team in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Monat für Monat beweist die Ikarus Crew um Executive Chef Martin Klein ihr Können, wenn sie die Küchentechniken und -philosophien internationaler Spitzenköche auf den Teller bringen. Die daraus gewonnenen Erfahrungen setzt die Ikarus Küchenbrigade nun in ihrem eigenen Menü um. Die Liebe zum Detail und Produktbewusstsein stehen dabei im Mittelpunkt: Daher schickt Martin Klein sein Team aus, um die bestmöglichen Produkte zu finden. Blaue Bio-Garnelen aus Bayern treffen auf veredeltes Urgemüse aus Südtirol. Südsteirischer Wein umgarnt Störkaviar aus Grödig. Dazu stellt die Festspielzeit der Stadt Salzburg und ihre Besucher eine zusätzliche Herausforderung dar: Um bis zu 70 Gästen ein unvergessliches Geschmackserlebnis zu bescheren, bedarf eines straffen Zeitplans und präziser Vorbereitungen. Ikarus-Patron Eckart Witzigmann, wird die Mannschaft aus eigenem Hause strenger denn je kontrollieren. Denn schließlich müssen ihre eigenen Geschmackskompositionen dem Vergleich mit internationalen Gastkochmenüs standhalten. Wird es die Ikarus Crew schaffen die hohen Erwartungen zu erfüllen? AT 2016'
- eventId: 740034
  start: 2026-10-15T03:35:00Z
  stop: 2026-10-15T04:22:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Syrco Bakker aus Cadzand
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Syrco Bakker aus Cadzand
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Das Restaurant "Pure C" an der holländischen Nordseeküste hält was der Name verspricht: reduziertes Ambiente trifft auf eine unkomplizierte wie leichte Sterneküche. Für dieses Erfolgsrezept hat der raubeinige Küchengenius Sergio Herman den jungen Quereinsteiger Syrco Bakker an seine Küchenspitze gestellt. Dessen Gerichte sind getragen von frischem Fisch und Meeresfrüchten, Gemüse und Kräutern aus der Region sowie aufregenden Aromen aus der indonesischen Heimat von Syrco Bakkers Mutter. Gemeinsam mit Ikarus Executive Chef Martin Klein kreiert das holländische Ausnahmetalent ein einzigartiges Menü fürs Salzburger Ikarus, bei dem das dortige Team alles geben muss, denn der kompromisslose Perfektionist richtet seine Teller immer extrem aufwendig an. Da Bakker außerdem einen eigenen Likör erfand, hat Martin Klein für dessen Besuch einen Überraschungsausflug auf das Weingut Reiterhaindl am Fuße des Salzburger Untersbergs vorbereitet. Dort stellen die beiden Starköche gemeinsam unter der Obhut von Marianne Witzko den ersten Obstmost aus der Hand von Sterneköchen her. AT 2016'
