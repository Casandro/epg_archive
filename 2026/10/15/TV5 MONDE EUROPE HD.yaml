  title: 'Réseaux sociaux, la santé mentale des ados en danger '
  subtitle: 'Faut-il interdire ou restreindre l''usage des réseaux sociaux aux adolescents ? Sommes-nous face à un risque de santé publique mond '
  description: "Réseaux sociaux, la santé mentale des ados en danger\n\nFaut-il interdire ou restreindre l'usage des réseaux sociaux aux adolescents ? Sommes-nous face à un risque de santé publique mondial ? Le nouveau numéro d'« À vrai dire » s'intéresse à ces dangers et enquête en Australie, premier pays au monde à interdire l'accès aux réseaux sociaux aux moins de 16 ans. \n\nLe reportage « Australie : interdire les réseaux sociaux aux ados, la solution ? », de Philippine de Clermont-Tonnerre et Chloé Domat, donne à voir les premiers effets et les limites de l'expérience australienne, tout en interrogeant la possibilité d'une régulation à l'échelle européenne. Il est suivi d'un débat.\n\nInvités : Arturo Bejar, ex-ingénieur en sécurité Facebook, ex-consultant Instagram, témoin au procès Meta ; Laure Boutron-Marmion, avocate au barreau de Paris, fondatrice du collectif Algos Victima ; Arnaud Ducoin, auteur de « Dérives de TikTok : le combat d'un père » ; Émile Benech, journaliste à « Ouest-France », auteur de « TikTok, 100 heures en enfer » ; Dominique Boullier, sociologue, auteur de « Déshumanités numériques » ; Grégoire Borst, professeur en neurosciences cognitives, co-auteur de « Faut-il interdire les réseaux sociaux aux jeunes ? » ; Karine de Leusse, psychologue clinicienne, autrice de « Sous écran total » ; Katia Roux, Amnesty International France ; Alexis Bossé, créateur de l'application Lyvio ; Simeon de Brouwer, conseiller politique auprès d'European Digital Rights \n\nPrésentation : Mohamed Kaci\n "
