  title: 'Guy Parmelin / Pouvoir d''achat / Barber Shops / Bergers '
  subtitle: 'Le parcours de Guy Parmelin, vigneron devenu conseiller fédéral et président de la Confédération. Tout augmente en Suisse, où la c '
  description: "Au sommaire : \n\nL'épopée de Parmelin\nLa démission de Guy Parmelin marque la fin d'une carrière politique qui a marqué la Suisse. Retour sur le parcours atypique d'un vigneron vaudois devenu conseiller fédéral et président de la Confédération.\n\nCoûts sur la tête\nPrimes maladie, loyers, essence : tout augmente en Suisse. Même la classe moyenne a de la peine à boucler ses fins de mois. Reportage dans un pays qui perd du pouvoir d'achat.\n\nAu nez et à la barbe\nEnquête sur le modèle d'affaires des « Barber Shops », qui se multiplient dans les villes suisses. Comment font-ils pour survivre économiquement, malgré une clientèle parfois peu nombreuse ? Les polices suisses les surveillent de près.\nInvité : François Ruchti, journaliste, auteur de l'enquête\n\nRevenons à nos moutons\nLa Suisse manque de bergers. Il n'y a plus assez de volontaires pour ce métier difficile, encore compliqué par la menace que fait peser le loup sur les troupeaux. \n\nPrésentation : Philippe Revaz\n "
