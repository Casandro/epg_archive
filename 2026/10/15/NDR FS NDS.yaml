  title: 'Die Nordreportage: Die Kampfmittelbeseitiger'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    75 Jahre nach dem Ende des Zweiten Weltkrieges schlummern noch immer unzählige Bomben, Geschosse und Granaten im Boden von Norddeutschland. Der Kampfmittelbeseitigungsdienst in Niedersachsen ist täglich gegen die gefährlichen Altlasten im Einsatz. Die Spezialisten spüren die Kampfmittel auf, entschärfen und entsorgen sie. Aber manchmal muss auch gleich vor Ort eine Sprengung durchgeführt werden.
    Die Reportage begleitet Menschen in ihrem täglichen Kampf gegen das gefährliche Vermächtnis und ist dabei, als eine Bombe gesprengt werden muss.
