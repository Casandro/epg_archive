    Elanas Eltern Steve und Maria mussten viel durchmachen: Vor 13 Jahren verloren sie ihr Geschäft und ihr Haus. Doch weder Marias Krebserkrankung noch Steves langwierige Wirbelsäulenverletzung konnten den Optimismus der Familie brechen. Dennoch bekommt die Familie eine Sache nicht hin: das Chaos im Hinterhof zu beseitigen, das nach und nach die schöne Terrasse in Beschlag nahm. Mit einem neuen Bereich, in dem die Familie Gäste einladen kann, wollen Cherie, Lucas und Peter dem Krempel den Kampf ansagen und Raum für neue Erinnerungen schaffen, die nicht an Materielles geknüpft sind.
