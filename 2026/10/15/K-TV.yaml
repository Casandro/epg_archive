  title: Katholisch auf den Punkt I Ist Maria ohne Sünde?
  subtitle: Gespräch
  description: Ist Maria wirklich ohne Sünde? Professor Ohly erklärt das Dogma und räumt damit auf mit dem Missverständnis, dass es Maria vergöttlicht.Wie steht es um die biblischen Belege? Und warum ist dieses Dogma für uns so wichtig? Ein tiefgreifendes Gespräch über dieses Glaubensgeheimnisse der Kirche, seine Wurzeln in der Heiligen Schrift und seine Bedeutung für unser eigenes Heil.
