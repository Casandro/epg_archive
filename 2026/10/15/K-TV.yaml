  start: 2026-10-15T00:30:00Z
  stop: 2026-10-15T01:00:00Z
  title: Orientierung I Zum Kirchenbild von Joseph Ratzinger/Benedikt XVI.
  subtitle: Gespräch
  description: 'Beschreibung: Kardinal Koch, der Präfekt des Dikasteriums zur Förderung Einheit der Christen, gilt als einer der profundesten Kenner von Joseph Ratzinger/Benedikt XVI., der ihm vor seinem Tod die Leitung seines theologischen Schülerkreises übertragen hat.'
- eventId: 744194
