  description: Mit dem Bau der Wallfahrtskirche Maria Limbach löste der Würzburger Fürstbischof Friedrich Karl von Schönborn ein Gelübde ein. Seine Heilung von einem Hüftleiden schrieb er nämlich der Fürsprache der Muttergottes von Limbach zu. Der Bau ist ein Entwurf von Johann Balthasar Neumann. Ein Film von Pfarrer Thomas Maria Rimmel.
