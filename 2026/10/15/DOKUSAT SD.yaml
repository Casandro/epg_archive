  widescreen: true
- eventId: 1579825
  start: 2026-10-15T02:45:00Z
  stop: 2026-10-15T04:00:00Z
  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Die Rheinüberquerung
  description: Nach dem Scheitern der Ardennenoffensive rücken die alliierten Truppen im März 1945 weiter Richtung Rhein vor. Während der britische Feldmarschall Montgomery den Fluss im Norden überqueren will, fällt den Amerikanern die noch unzerstörte Brücke von Remagen in die Hände. Wahrscheinlich wurde der Krieg durch diesen Coup um mehrere Wochen verkürzt. "Der Zweite Weltkrieg - Schlacht um Europa" lässt Zeitzeugen zu Wort kommen, die die entscheidenden Schlachten zur Befreiung Deutschlands erlebt haben.
  genre:
  - '129'
