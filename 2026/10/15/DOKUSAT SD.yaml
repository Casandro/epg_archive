  description: Die Dokumentation unternimmt den Versuch, dem Menschen Adolf Hitler auf die Spur zu kommen. Führende Wissenschaftler und Historiker geben ihre Einschätzung, allen voran der Hitler-Biograf Ian Kershaw. In den Jugendjahren Hitlers und der Zeit in Wien kennt sich die Bestsellerautorin Brigitte Hamann aus. Professor Hans-Joachim Neumann hat die Krankengeschichte des Diktators erforscht und entlarvt viele Legenden.
