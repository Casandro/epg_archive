  title: Tiere vor der Kamera - Der große Durst der kleinen Zebrafinken
  subtitle: Tiere vor der Kamera - Der große Durst der kleinen Zebrafinken
  description: Arendt und Schweiger erkunden monatelang das Zentrum Australiens, verfolgen die wilden Zebrafinken. In der trockenen Wüste dreht sich alles um Wasser. Nach einer extremen Dürre erleben sie einen plötzlichen Regen, der das Land verwandelt und die Zebrafinken dazu bringt, ihre Jungen schnell großzuziehen, bevor die Wüste wieder austrocknet. Der Film zeigt bewundernswert, wie die kleinen Vögel Wasser finden, singen, Nester bauen und ihre Jungen aufziehen.
