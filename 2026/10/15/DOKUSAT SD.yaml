  title: 'Tiere vor der Kamera - Nasenaffen: Starke Typen im Dschungel'
  subtitle: 'Tiere vor der Kamera - Nasenaffen: Starke Typen im Dschungel'
  description: Der Film "Starke Typen im Dschungel" zeigt die imposanten Nasenaffenmännchen und ihre beeindruckenden Eigenschaften. Rund 10-20 Weibchen versammeln sich um diese starken Männer, doch es ist keine typische Haremsdynamik. Die Damen erwarten ständige Bereitschaft und Leistung, und wenn der Mann nicht liefert, suchen sie sich einen anderen. Die Nasenaffen bewohnen die Wälder entlang der Urwaldflüsse und wagen spektakuläre Sprünge über Flüsse, trotz der Gefahr von Krokodilen.
