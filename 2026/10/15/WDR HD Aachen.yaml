  audiodesc: true
  ageRating: 12
  description: 'Am neuen Tatort scheint die Beweislage eindeutig: Der Hauptverdächtige wird mit der Tatwaffe in der Hand neben der Leiche gefunden. Günter und Chefin Vicky trauen ihren Augen nicht, als sie ihn zu Gesicht bekommen. Es ist kein Geringerer als der Polizeipräsident Plocher. Doch ist er wirklich fähig dazu, einen Mord zu begehen? Das Team bezweifelt das und versucht, Plochers Unschuld zu beweisen. Die neue Kollegin Hannah merkt an, dass die Ermittler befangen seien und deshalb gar nicht an dem Fall arbeiten dürften. Edwin bereitet sich in der Zwischenzeit auf seinen neuen Herzschrittmacher vor.'
