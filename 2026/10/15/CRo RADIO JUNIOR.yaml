  title: Čtení na pokračování
  description: 'Kluci netančej 5/5. Balet je pořádně náročný, je to umění a zároveň i vrcholový sport. Spousta holek se chce stát baletkami. Jaké to ale je, když se baletu chce věnovat kluk? Napsala: Olga Stehlíková. Režie: Izabela Schenková. Natočeno v roce 2019. Čtou: Matěj Havelka, Sophie Louise Bransten a další.'
