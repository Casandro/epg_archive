  title: ArtCafé
  description: 'Albové novinky ze zahraniční alternativní scény. Hudební dramaturg Josef Sedloň nabídne svůj pravidelný průřez nejzajímavějšími deskami současné zahraniční alternativní hudby. Představí nová alba nizozemského hiphopového a brokenbeatového tria .multibeat, britské indiepopové zpěvačky a hudebnice Lily Juniper, australského indie-elektronického projektu Now Always Fades, dánské postklasické skladatelky a zpěvačky Agnes Obel nebo amerického elektronického projektu Chrome Sparks. Zazní také hudba kostarické pianistky a skladatelky Sofi Paez, anglického elektronického projektu Fthmlss či americko-dánského elektronicko-akustického dua Jason Dungan & Johan Car?e. Výběr doplní i posmrtně vydaná alba japonského klavíristy Ryuichiho Sakamota s německým producentem Alva Noto a islandského skladatele Jóhanna Jóhannssona s americkým hudebníkem Adamem Wiltziem. E-mail: artcafe@rozhlas.cz'
