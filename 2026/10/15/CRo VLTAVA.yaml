  title: Vizitka
  description: Ažběta Tichá, akrobatka. V novém cirkusu posouvá možnosti jednotlivých artistických disciplín a ve svém performativním umění kombinuje různé cirkusové techniky. Se svojí inscenací Frekvence se dostala do užších nominací na Cenu Thálie v kategorii Alternativní divadlo. Zkoumá v ní možnosti svého těla za pomoci technologií, které v reálném čase snímají její tepovou frekvenci. "Nejdřív jsem si myslela, že tepovou frekvenci nejvíc zvýším pohybem, zjistila jsem ale, že nejrychlejší je stres," popisuje ve Vizitce. Sleduje během performance reakce diváků? Jaký je trend českého nového cirkusu? A co je pro akrobata největší noční můrou? Alžběty Tiché se ptal Ondřej Cihlář. Repríza z 1. 10. 2026
