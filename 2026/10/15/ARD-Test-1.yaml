  title: Morden im Norden (71)
  subtitle: Kellerkind
  widescreen: true
  subtitled: true
  hd: true
  ageRating: 12
  genre:
  - '16'
  description: Mit letzter Kraft ruft die Seniorin Elli Wenzel noch die Polizei, doch als diese eintrifft, ist sie bereits tot. Erstochen findet man sie im Haus ihres Sohnes Klaus. Als der Pathologe Dr. Strahl in ihrer Schürze einen mysteriösen Zettel findet, untersuchen die Kommissare Finn Kiesewetter und Lars Englen den Tatort nochmals genauer und machen eine fürchterliche Entdeckung. In einem Kellerverlies finden sie eine verstörte junge Frau. Stella Berthold wurde vor 19 Monaten als vermisst gemeldet. In ihrer Gefangenschaft hat sie eine Tochter zur Welt gebracht, doch die kleine Mimi ist mit ihrem Peiniger, Klaus Wenzel, verschwunden.
