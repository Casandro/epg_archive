  widescreen: true
  subtitled: true
  hd: true
  description: Auf der Suche nach Wilderern stolpern Hubert und Girwidz über die Leiche des Landwirts Thomas Lengstätter. Sie finden aber keine Hinweise auf eine Fremdeinwirkung und gehen von einer natürlichen Todesursache aus. Doch Pathologin Fuchs kommt zu einem anderen Ergebnis. Sie weist nach, dass Lengstätter Opfer eines besonders perfiden Mordanschlags mit einem schwer nachweisbaren Gift wurde. Schnell geraten Lengstätters Kinder und Erben in Verdacht, aber die decken sich gegenseitig.
