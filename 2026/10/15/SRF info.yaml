  title: mitenand in Gebärdensprache
  subtitle: Vermitteln, wenn der Konflikt zwischen Eltern eskaliert
  description: |-
    Christian von Gunten ist pädagogischer Familienberater. Im Auftrag der Stiftung Friedau unterstützt er Eltern, die es nach einer Trennung nicht mehr schaffen, zielorientiert und wohlwollend zu kommunizieren. Ziel hierbei ist vor allem, das Kindeswohl zu erhalten. Ein Bericht von Donat Hofer.
    Schweiz 2026
