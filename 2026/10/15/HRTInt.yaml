  title: Knjiga ili život
  subtitle: ' '
  description: Naša je gošća palestinska književnica Adania Shibli. Njezin je roman "Sporedan detalj" 2020. bio u užem izboru za National Book Award, a 2021. nominiran je za International Booker Prize. Na Sajmu knjiga u Frankfurtu 2023. svečana dodjela nagrade "LiBeraturpreis" za roman "Sporedan detalj" u posljednji je čas otkazana a odluka organizatora izazvala je oštre kritike brojnih svjetskih književnika i udruženja koji su to smatrali cenzuriranjem palestinskog glasa. Javno pismo podrške Shibli potpisalo je preko 600 autorica i autora, od Annie Ernaux do Olge Tokarczuk. Uz književni rad bavi se znanstvenim istraživanjem i predaje na sveučilištima diljem Europe, a predavala je i na Sveučilištu u Palestini. Adania Shibli u Zagrebu je na Festivalu svjetske književnosti predstavila roman "Zavaravanje" koji je s arapskog preveo Daniel Bučan. Zašto je dio romana pisala i u Hrvatskoj i odakle potiče njen interes za našu zemlju doznajte u emisiji.
