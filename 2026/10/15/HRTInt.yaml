  description: Francis Halzen dobitnik je Nobelove nagrade za fiziku. Donosimo razgovor sa Splićankom Leonorom Kardum koja je bila u njegovom timu.  Vodimo vas u čistu sobu na Institutu "Ruđer Bošković" u kojoj se razvijaju čipovi.  Čileanska pustinja Atacama jedno je od najsuših mjesta na Zemlji. Nakon rekordnih oborina ovoga ljeta procvjetalo je divlje cvijeće.  Koja je veza između Dalija i mode?
