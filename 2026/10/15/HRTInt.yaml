  description: Matilda je na državnom natjecanju iz matematike u Rovinju, a Miljenko je okupiran novom ulogom u TV prodaji, ugledne TV kompanije iz Den Haaga.  Laci i Voloder postaju aktivni agenti TV prodaje Gustav d.d., a Božena i Đuro tumače to kao krađu i nemoralni posao.  Filip je usamljen i priprema se za ispit, pa nije u stanju rasuđivati. Slavku je čudno ponašanje Gustava van Jansena, redatelja TV prodaje, kao i njegovog prevoditelja. Na kraju svi su zaprepašteni, jer otkrivaju da ugledna TV kompanija iz Nizozemske, kroz TV prodaju, širi marketinško i medijsko tržište gay programa.  Gostuju Boris Svrtan i Petar Leventić.
