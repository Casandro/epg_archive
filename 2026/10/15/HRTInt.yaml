- eventId: 777756
  start: 2026-10-15T22:25:00Z
  stop: 2026-10-15T22:52:00Z
  title: Svi moji krajolici, dokumentarni film (2000.)
  subtitle: ' '
  description: 'Umjetnički dokumentarni film na francuskom jeziku "Svi moji krajolici" profinjen je portret povjesničarke umjetnosti i književnice dr. Željke Čorak. Kroz nelinearnu priču o njezinom životu i nadahnut poetski tekst dr. Čorak, upoznat ćemo i doživjeti njezine krajolike srca: Gorski kotar, Dubrovnik, Split, otok Šipan i dakako Zagreb. Nastao u koprodukciji HTV-a i kanadske televizije, "Svi moji krajolici" atipičan je TV dokumentarac, više nalik na klasična filmska ostvarenja.'
