  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
- eventId: 777731
  start: 2026-10-15T10:12:00Z
  stop: 2026-10-15T10:57:00Z
  title: Kod nas doma
  subtitle: ' '
  description: U goste nam stiže glazbena obitelj Parmachy, Neda, Sanja i Tomislav Parmać, a s njima i Max Hozić. Predstavljaju novu pjesmu i spot za koji su na plažu dovukli klavir i potom ga zapalili! Max ima i vlastiti razlog za slavlje, njegova pjesma "Mornarski zanat" osvojila je nagradu publike na Dalmatinskoj šansoni. Alen Đuras priprema se za novu sezonu showa "Ples sa zvijezdama". Otkrit će nam kakav je plesač, kako se snalazi na probama i hoće li mu plesni koraci biti veći izazov od pjevanja! U rubrici Znanost i tehnologija Danijel Despot i dr. sc. Marko Košiček otkrivaju nam najneobičnija znanstvena istraživanja nagrađena ovogodišnjim Ig Nobelovim nagradama. Kakve veze sa znanošću imaju pisoari koji ne prskaju, zakopano donje rublje i još neke prilično bizarne ideje?
