  title: Die größten Rätsel der Wissenschaft
  subtitle: Das Alter des Universums
  description: 'Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. In dieser Episode geht es um das Alter des Universums. Supernovae, Hintergrundstrahlung, Dunkle Materie und Dunkle Energie, Taschenuniversum: die Astronomie ist viele Wege gegangen, um die Frage nach dem Alter des Universums zu beantworten. Aber das Rätsel ist bis heute ungelöst. Warum ist das so?'
- eventId: 1191549
  start: 2026-10-15T14:05:00Z
  stop: 2026-10-15T14:55:00Z
  title: Die größten Rätsel der Wissenschaft
  subtitle: Warum existieren wir?
  description: 'Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. Diese Episode erzählt von der mysteriösen Antimaterie, die eigentlich nicht existieren dürfte. Das klingt nach Science Fiction, aber sie ist real. Und wenn Forscher ihre Geheimnisse entdecken, könnten sie vielleicht die grundlegendste Frage der Menschheit beantworten: Warum existieren wir überhaupt?'
- eventId: 1191550
