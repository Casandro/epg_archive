  description: 'Moderator Tobi Kämmerer erkundet bei einem dreitägigen Städtetrip Frankfurt aus ungewöhnlichen Perspektiven - vom Hubschrauberflug über die Skyline bis zu einem Besuch im Dialogmuseum. Dabei entdeckt er kulturelle, sportliche und kulinarische Highlights sowie besondere Orte wie die Kleinmarkthalle, den ältesten Comicladen Deutschlands und die Fußball-Erlebniswelt in der MyZeil. Die Ausgabe "Tobis Städtetrip: Frankfurt City" zeigt die Mainmetropole mit spannenden Begegnungen, überraschenden Einblicken und vielen Geheimtipps.'
