- eventId: 1191190
  start: 2026-10-15T05:00:00Z
  stop: 2026-10-15T05:15:00Z
  title: GRIPS Mathe (36)
  subtitle: Gleichungen mit Brüchen
  subtitled: true
  description: |-
    Radarkontrolle in Ebersberg. Es fahren ganz schön viele Fahrzeuge zu schnell! Wie viele genau, das wollen Jessica, Felix und Sebastian Wohlrab herausfinden. Dazu stellen sie eine Gleichung auf und lösen sie.
    In dieser Lektion geht es um Gleichungen, die einen oder mehrere Brüche enthalten. Du lernst, wie man zu einer Sachsituation die Wortgleichung aufstellt und diese in eine mathematische Gleichung umwandelt. Außerdem zeigen wir dir, wie man eine Gleichung mit Brüchen löst und auf welche Rechenregeln du achten musst.
