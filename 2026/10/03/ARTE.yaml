  title: Voyage gourmand
  subtitle: Les figues S02 E13. Lucie Fischer-Chapalain met à l'honneur la polyvalence de la figue en préparant des samossas épicés ainsi qu'une tartinade aux saveurs aigres-douces.
  genre:
  - '32'
  description: 'La culture de la figue remonte à 11 000 ans, bien avant celle du blé ou de l''orge. Ce fruit à la chair veloutée est un symbole d''art de vivre méditerranéen et de raffinement culinaire. Sur l''île grecque d''Eubée, la famille Karava fait sécher ses figues issues de l''agriculture biologique selon la méthode traditionnelle. Fait intéressant : chaque figue naît d''une symbiose unique avec une minuscule guêpe, seule espèce capable de polliniser les fleurs logées à l''intérieur du sycone, le réceptacle charnu qui accueillera également les fruits. A la croisée de la nature et de la culture, la figue a traversé les millénaires sans prendre une ride. Lucie Fischer-Chapalain met à l''honneur sa polyvalence en préparant des samossas épicés ainsi qu''une tartinade aux saveurs aigres-douces. Réalisateur: Marit Christenfeldt (2025)'
