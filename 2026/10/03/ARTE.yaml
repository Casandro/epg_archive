  title: Cuba, le grand retour des boxeuses
  subtitle: Zoom sur Flores Rodriguez, ancienne boxeuse namibienne qui souhaite créer une écurie de boxe réservée aux femmes à La Havane, une première à Cuba.
  genre:
  - '32'
  description: 'Pour Namibia Flores Rodriguez, cette levée de l''interdiction de la boxe féminine à Cuba intervient trop tard. Son âge, 47 ans, lui interdit toute participation à des compétitions internationales. Elle voue pourtant une véritable passion à ce sport qu''elle n''a cessé de pratiquer malgré les défaites. Écartée des grandes épreuves éliminatoires, elle s''est reconvertie en entraîneuse et coache désormais les hommes et les femmes, les jeunes talents comme les boxeurs accomplis. À l''instar de son amie Yoana Rodriguez Castillo, boxeuse poids lourds, qui malgré ses trente ans révolus ne renonce pas à son rêve : participer à une compétition internationale. Mais le chemin qu''il lui reste à parcourir est parsemé d''embûches, même si certains verrous politiques ont sauté. Les infrastructures sportives font cruellement défaut sur l''île, sans parler des centres de formation sous-dotés en gants ou autres accessoires. Pour compenser ces manques criants, Namibia Flores aimerait offrir aux femmes un espace pour exprimer leur passion en ouvrant un centre de boxe exclusivement féminin. Une première pour Cuba, et un défi de plus à relever. Car à La Havane, comme sur le reste de l''île, nombreuses sont les constructions vétustes qui menacent de s''effondrer. Où trouver la place pour des locaux quand le manque de logements habitables est criant ? Mais Namibia refuse de jeter l''éponge. Ses protégées, elle le sait, ont un potentiel énorme. Elle doit empêcher que ces graines de championnes n''échouent comme elle du fait de conditions d''entraînement défavorables. Une fois de plus, pour elle le K.O. n''est pas une option. Réalisateur: Cordula Stadter (2022)'
- eventId: 1441056
  start: 2026-10-03T06:11:21Z
  stop: 2026-10-03T07:05:00Z
  title: 360° Reportage - Cuba, le grand retour des boxeuses
  description: |-
    Reportage (Allemagne, 2022, 52mn) Si la boxe est un sport bien ancré à Cuba, sa pratique a longtemps été interdite aux femmes. Mais une page se tourne. Les boxeuses sont en route vers la parité et font leur retour sur le ring pour concourir. Certaines participeront même aux épreuves des Jeux olympiques de Paris. Elles s'entraînent sans relâche pour y parvenir. Quant à la relève, elle est déjà prête à enfiler les gants.
