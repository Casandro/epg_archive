  subtitle: Chine E25. Le Pékin du "Dernier empereur" de Bernardo Bertolucci - La calligraphie - La recette des travers de porc caramélisés Jingdezhen, le berceau chinois de la porcelaine.
  genre:
  - '116'
  description: Le Pékin du "Dernier empereur" La Cité interdite est la résidence impériale mythique de Chine. Fermée aux visiteurs pendant des siècles, elle est pourtant au coeur du film monumental de Bernardo Bertolucci, Le dernier empereur. Premier étranger à filmer cette succession de cours carrées et de portes majestueuses, le réalisateur de gauche adapte au cinéma l'histoire de Puyi, cet empereur qui travaillera au Jardin botanique de Pékin après l'avènement du communisme en 1949. Un titre comme une promesse, celle de la fin de l'Empire. En Chine, j'écris donc j'existe En Chine, la calligraphie est un trésor national. Ces caractères tracés à l'eau, à mi-chemin entre l'écrit et l'art, racontent une culture plurimillénaire. L'écriture chinoise, apparue il y a 3 500 ans, est pendant longtemps l'apanage du pouvoir. Sous les Qin, elle atteste de la puissance impériale, et s'impose comme une écriture unique dans toute la Chine. La calligraphie est alors réservée à l'élite, qui maîtrise sa complexité, jusqu'à ce que les communistes la démocratisent au milieu du XXe siècle. Une éducation populaire au coeur de l'idéologie maoïste. En Chine, les travers de porc caramélisés de Liu À Chengdu, Liu prépare le tang cu pai gu, un classique du Sichuan. Elle commence par blanchir le porc avec du gingembre, du poireau et du vin de riz. Ensuite, Liu colore la viande dans un caramel de sucre non raffiné, puis ajoute une sauce aigre-douce et du bouillon. Une touche de sésame avant de servir vient parfaire ce plat emblématique. En Chine, une porcelaine très convoitée Sur les tables, mais aussi sous les pavés ou dans les arbres. La porcelaine s'affiche partout dans les rues de Jingdezhen. Depuis deux mille ans, cette cité chinoise maîtrise le travail du kaolin comme personne. Au point de piquer la curiosité de certains. (2026)
