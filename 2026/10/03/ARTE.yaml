  title: 42, la réponse à presque tout
  subtitle: Soufflera-t-il bientôt un vent nouveau ? E02. Le vent changeant, difficile à mesurer, a longtemps résisté aux climatologues. Mais la recherche évolue...
  genre:
  - '32'
  description: 'Quel sera notre climat futur ? D''après les prévisions d''une grande partie de la communauté scientifique, les vents devraient faiblir et non forcir sur l''ensemble de la planète. Car la fonte des glaces aux pôles a pour effet de réduire l''écart des températures entre l''Équateur et les pôles. Or, cet écart est le "moteur" du vent : l''air chaud et humide monte au niveau de l''Équateur en direction des pôles, où il refroidit avant de redescendre. Si cet écart se réduit, il devrait donc y avoir moins de vent. C''est précisément ce que l''on observe depuis une dizaine d''années : la vitesse du vent a de nouveau augmenté, après des décennies de recul progressif. Pour quelle raison ? Les scientifiques s''interrogent. Depuis quelque temps, ils constatent qu''un vent d''une importance majeure, le jet stream, se fait de plus en plus discret. Comme c''est lui qui pousse les dépressions et les anticyclones vers notre continent, son affaiblissement a de fortes répercussions. Un anticyclone stationnaire peut ainsi entraîner de longues périodes de canicule et de sécheresse. Si, à l''inverse, une dépression chargée de nuages donnant des précipitations n''est pas chassée par le vent, les fortes pluies peuvent entraîner crues et inondations. Ce numéro se penche sur la formation du vent et son influence sur la météo et le climat. Pour pouvoir anticiper le vent, il faut imaginer notre atmosphère comme un billard géant traversé par 1044 boules - ici, des molécules d''air. Car le vent n''est rien d''autre qu''un ensemble de toutes petites molécules qui s''entrechoquent et dont seule l''action conjointe génère la violence des tempêtes. Pour filer la métaphore du billard : même une poignée de carambolages aériens ne peuvent plus être prédits avec précision. Alors, comment prévoir le vent ? Et quelles tendances pouvons-nous encore identifier ? Réalisateur: Ingo Knopf (2023)'
