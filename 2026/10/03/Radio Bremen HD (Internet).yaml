  title: Die B96 - Legendäre Fernstraße
  description: Sie steht für Freiheit, Sehnsucht und Heimat - 520 Kilometer lang, führt sie einmal quer durch den Osten Deutschlands. Sie verbindet Menschen, Orte und Abenteuer zwischen Zittau in Sachsen und Sassnitz auf Rügen. "Die B96 - Legendäre Fernstraße" erzählt nicht nur Asphaltgeschichte, sondern blickt auf Region, Landschaft und Menschen, die zu einem Zwischenstopp einladen.
- eventId: 1444963
  start: 2026-10-03T11:00:00Z
  stop: 2026-10-03T11:45:00Z
  title: Unsere Geschichte
  subtitle: Unsere Geschichte - Die Meyer Werft - Die dicken Pötte von der Ems
  description: Wenn ein neues Kreuzfahrtschiff die Meyer Werft in Papenburg verlässt, herrscht Volksfeststimmung. Dann kommen die Menschen von weit her, um die schwimmenden Riesen zu bestaunen, die über die schmale Ems zum Meer geführt werden. Wenn es gut läuft, dann verlassen zwei oder drei Schiffe im Jahr die Docks der Meyer Werft. Schiffbau ist eine risikoreiche Branche. Schiffe will das Familienunternehmen auch in der siebten Generation bauen. Sohn Jan leitet schon die Konstruktion der Ozeanriesen.
- eventId: 1445483
  start: 2026-10-03T11:45:00Z
  stop: 2026-10-03T12:30:00Z
  title: Unsere Geschichte
  subtitle: Go West Go East - Transit DDR - Als die Grenze durchlässiger wurde
  description: "Die Dokumentation \"Transit DDR - Als die Grenze durchlässiger wurde\" ist eine filmische Reise in die Zeit des Kalten Krieges. In der sich zwei deutsche Staaten feindlich gegenüberstanden, deren Grenze am Ende aber doch von den Menschen überwunden wurde. \nDer Film erzählt von Menschen, für die die Fernverkehrsstraße 5 viel mehr war als nur eine Transitstrecke. Es war eine Straße der verbotenen Treffen, der gescheiterten Fluchten und der riskanten \"Grenzüberschreitungen\". Ehemalige Volkspolizisten, Stasi-Mitarbeiter und Fluchthelfer erzählen von ihren dramatischen Erlebnissen."
- eventId: 1445693
  start: 2026-10-03T12:30:00Z
  stop: 2026-10-03T13:15:00Z
  title: Expeditionen ins Tierreich
  subtitle: Wildes Deutschland - Grenzgänger am Grünen Band
  description: Eine außergewöhnliche Perlenschnur der Natur zieht sich längs durch Deutschland. Von der Ostsee bis zum Vogtland verbindet sie auf 1.400 Kilometern Länge über 100 verschiedene Biotope mit seltenen Tier- und Pflanzenarten zum Grünen Band. Raritäten wie Schwarzstorch, Fischotter oder Braunkehlchen finden ideale Bedingungen in Sumpfgebieten, Mooren, Pionierwäldern oder auf Magerrasenflächen. In diesem einzigartigen Biotopverbund leben über 5.000 verschiedene Tier- und Pflanzenarten, darunter über 600 stark gefährdete.
- eventId: 1447141
  start: 2026-10-03T13:15:00Z
  stop: 2026-10-03T14:00:00Z
  title: Gemeinsam feiern
  subtitle: Live vom Tag der Deutschen Einheit aus Bremen
  description: 'Bremen richtet in diesem Jahr die zentralen Feierlichkeiten zum Tag der Deutschen Einheit aus. In der Stadt werden 400.000 Gäste erwartet, die den 3. Oktober gemeinsam begehen: Bremerinnen und Bremer, Gäste von außerhalb, Politikerinnen und Politiker, Zeitzeugen, Kulturschaffende. In der Livesendung mitten vom Bremer Marktplatz erleben die Zuschauenden das Bürgerfest in Bremen mit der "Ländermeile" am Weserufer, wo sich auf mehreren Kilometern die 16 Bundesländer mit ihren Besonderheiten präsentieren.'
