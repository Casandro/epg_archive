- eventId: 1439540
  start: 2026-10-03T03:15:00Z
  stop: 2026-10-03T04:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Andrea Wulf, Historikerin und Autorin'
  description: "Georg Forster (1754-1794) - ein Mann, der mit Captain Cook die Welt umsegelte, die Französische Revolution miterlebte und dabei nie aufhörte, die Welt mit staunenden Augen zu betrachten. Die britisch-deutsche Bestsellerautorin und Historikerin Andrea Wulf erzählt seine faszinierende und zu Unrecht vergessene Lebensgeschichte. Zu seiner Zeit war Forster auch berühmt für seine Zeichnungen von Fauna und Flora, denen er auf seinen Reisen begegnete. \nAuf dem Roten Sofa verrät sie, warum Forster topaktuell ist und was ein Weltumsegler aus dem 18. Jahrhundert heutzutage über Freiheit, Verantwortung und Neugier lehren kann."
- eventId: 1440514
  start: 2026-10-03T04:00:00Z
  stop: 2026-10-03T04:30:00Z
  title: 'Die Nordreportage: Umzug mit Milch und Muffins'
  subtitle: Neues Logistiklager für den Discounter
  description: "Das zentrale Logistikzentrum eines großen Discounters für die Region Hannover, Wolfsburg und Braunschweig zieht samt Lebensmitteln um. Und das im laufenden Betrieb. Die Kundschaft darf das nicht bemerken. Damit die Regale nicht leer werden, packen alle Mitarbeitenden mit an. \n\"Die Nordreportage\" begleitet den Umzug ins neue Warenlager und zeigt, was hinter den Kulissen passiert, damit Milch und Muffins nach dem Umzug in den Regalen liegen."
- eventId: 1440942
  start: 2026-10-03T04:30:00Z
