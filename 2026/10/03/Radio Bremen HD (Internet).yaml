  title: Die Nordreportage
  subtitle: Schönheitskur für den Dorfladen
  description: 'Er ist der Mittelpunkt des kleinen Ortes Altwarp - direkt am Stettiner Haff: der Dorfkonsum von Sabine und Peter Knüttel. Seit fast 30 Jahren versorgen sie Einheimische und Gäste. Doch jetzt ist ihr Geschäft für drei Wochen dicht. Die Knüttels haben beschlossen: Wir renovieren, machen einmal alles neu! Für die beiden End-Fünfziger ein Abenteuer. Neue Kühltechnik, neues Kassensystem - und dabei ist Technik überhaupt nicht ihr Ding.'
