  title: Sehen statt Hören
  subtitle: Malte Arkonas Reise in die Welt der Gehörlosen
  description: 'Befragt, worauf er eher verzichten würde, Augenlicht oder Gehör hat Malte Arkona einmal ganz spontan geantwortet: "Ganz klar meine Augen. Ohne die wunderbare Musik von Gustav Mahler kann ich mir mein Leben nicht vorstellen!" Malte Arkona ist ein beliebter Sänger, Synchronsprecher und Moderator. Hören ist für sein gesamtes Leben unverzichtbar. Wirklich unverzichtbar? Für "Sehen statt Hören" lässt sich Malte Arkona auf das Unvorstellbare ein: Wie ist das, wenn Menschen nicht hören?'
