    Deutschland 2026
    Der Atlantik ist die Brücke zwischen den Kontinenten und der Motor einer zunehmend vernetzten Welt. Kaum ein anderer Ozean hat die moderne Welt so stark geprägt.

    Seit Jahrhunderten verbindet der zweitgrößte Ozean der Erde Kontinente, Menschen und Ideen. Über seine Gewässer segeln Wikinger, Händler, Entdecker und Auswanderer. Gleichzeitig ist er Schauplatz von Piraterie, Kolonialismus unddem transatlantischen Sklavenhandel.
