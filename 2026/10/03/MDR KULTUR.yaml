- eventId: 774381
  start: 2026-10-03T17:00:00Z
  stop: 2026-10-03T17:30:00Z
  title: 'MDR KULTUR Diskurs: Wo die Toten sprechen'
  subtitle: Jaroslav Rudis im Gespräch mit Katrin Schumacher
  description: "Er schreibt über Bier und Eisenbahnfahrten, schreibt Theaterstücke und Essays - aber die wahren Schätze sind die Romane von Jaroslav Rudis. Seit einigen Jahren schreibt der im böhmischen Paradies geborene Autor auf Deutsch, hat das deutsche Bundesverdienstkreuz genau wie die tschechische Verdienstmedaille und den Görlitzer Brücke-Preis bekommen - unter anderem für die Verständigungsarbeit zwischen Deutschland und Tschechien. \n\nMit \"Winterbergs letzte Reise\" war er für den Preis der Leipziger Buchmesse nominiert, sein neuer Roman \"Wo die Toten sprechen\" ist eine große europäische Erzählung über das Sterben und das Reisen, die Vergangenheit und die Gegenwart, über Kunst und Erbe und die Schönheit des Unterwegsseins. Seine Hauptfiguren sind der fast blinde Caspar, der in Venedig seine Liebe verliert, der etwas kriminelle Lorenzo, der sich am liebsten durch Bücher frisst und die geheimnisvolle Miss Detroit, in deren alten Saab die drei eine Tour durch Städte und Friedhöfe in ganz Mitteleuropa machen. \n\nMit Witz und Tempo, mit einer schönen Portion Irrsinn. \nMit MDR Literaturredakteurin Katrin Schumacher trifft sich Jaroslav Rudis auf einem Friedhof (wo sonst?) in Leipzig, und spricht über die Hinfälligkeit der Nationalstaaten, das Schreiben über Grenzen hinweg, seine Leidenschaft für die Toten und wie er es schafft, ihnen Geschichten zu entlocken. \n\nRedaktion: Katrin Wenzel"
