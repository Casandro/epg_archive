  title: MDR KULTUR am Nachmittag
  description: "* 15.05 - MDR KULTUR - Studiosession\nIn der MDR Kultur Studiosession sind Musiker aus der ganzen Welt zu Gast. Sie spielen ihre Songs in akustischen exklusiven Versionen, reden über ihre Musik und ihr Leben. Die Studiosession ist der Ort für die nahen Momente, ergreifende Geschichten und feine Musik.\nVonJan Kubon\n\n* 16.03 - MDR KULTUR - Feature: Der Deutschland-Äquator: Musik und Mensch von West nach Ost - Musikfeature zum Tag der Deutschen Einheit \n\nVon Friedemann Dupelius\n\nZwischen dem Selfkant und Görlitz liegen 640 Kilometer Luftlinie. Wie klingt die Strecke zwischen dem westlichsten und dem östlichsten Punkt Deutschlands, 36 Jahre nach der Wiedervereinigung?\nMit Deutschlandticket und Mikrofonen ist Friedemann Dupelius losgefahren und hat die Vielfalt der Musik und Klänge eingefangen, die ihm zwischen den zwei Zipfelpunkten begegnet ist, etwa: Grenzüberschreitendes Platt, Orgel-Experimente für die Ewigkeit, antifaschistische Barockmusik, ein Soundtrack aus der Idylle und großstädtischer Jazz. Einheitlich bleibt nur das Blau der Bahnhofsschilder.\n\nErzähler: Markus J. Bachmann\nRegie: Helga Mathea\nRedaktion: Martin Bürkl\nProduktion: WDR 2025"
- eventId: 774379
