  title: 'MDR KULTUR - Weltgeschichte am Samstag: Robert Blum - Eine Ikone der 1848er Revolution'
  description: "Leipzig war nicht erst 1989/90, sondern auch schon 1848 ein revolutionäres Pflaster. Und hat sich 2024 darauf besonnen. Seitdem vergibt die Stadt alle zwei Jahre den mit 25.000 Euro dotierten Leipziger Robert-Blum-Preis. \n\nDie Auszeichnung geht an Personen, die sich für Demokratie und Meinungsfreiheit, für Aufklärung und Verständigung einsetzen. Personen also, die im Sinne des legendären Politikers wirken. \n\nRobert Blum war eine der führenden Figuren der Revolution von 1848, den die Leipziger Bürger damals als ihren Abgeordneten in die Frankfurter Paulskirche gewählt haben, um dort die erste gesamtdeutsche demokratische Verfassung auszuarbeiten. Was waren seine Verdienste, was sein Programm und wie tragisch sein Scheitern?\n\nEs spricht Conny Wolter"
  subtitle: Von Hartmut Schade und Conny Wolter.
