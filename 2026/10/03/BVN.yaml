  title: First Dates
  subtitle: S16 E41. First Dates restaurant opent weer haar deuren voor singles die op zoek zijn naar de ware. Leidt een eerste date tot een tweede? Wie vindt de perfecte match?
  description: 'Een restaurant vol vrijgezellen én met camera''s. Het First Dates-restaurant van gastheer Sergio opent weer haar deuren! En ja, barman Victor is ook weer van de partij. In iedere aflevering zien we Nederlandse vrijgezellen die dromen van de perfecte partner. Schiet Cupido meteen raak? Of zal er na de eerste date zeker geen tweede meer volgen? De kandidaten die meedoen, zijn van alle leeftijden en seksuele voorkeuren. Regisseur: Remco Boogaard. Acteurs: Denice Dest (Maître), Sergio Vyent (Maître), Jeremy Zijlstra (2025)'
