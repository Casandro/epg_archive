  title: Vroege vogels
  subtitle: Wisselse Veen S23 E16. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: Sindskort fladdert de zeldzame zilveren maan weer in het Wisselse Veen, nabij Epe. Het natuurgebied aan de rand van de Veluwe laat zien hoe spectaculair de natuur kan herstellen. Akkers zijn nu kleurrijke velden met bijzondere flora zoals draadgentiaan, kleine zonnedauw en moeraswolfsklauw. Boven de plassen vliegen witgatjes en zwaluwen en zelfs de schuwe waterral laat zich onverwacht zien. Tussen de brandnetels ontdekken we schorpioenvliegen en hoog in de bomen wachten kuikens van de wespendief op hun eerste vlucht. Vlak daarvoor worden ze geringd voor wetenschappelijk onderzoek. (2026)
  genre:
  - '146'
