  subtitle: Boven Brabant - Roeg! - Trugkieke S06 E125. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'Boven Brabant: zonnepark Budel, grensovergang Hazeldonk en haven- en industriegebied Moerdijk. Roeg!: aan de rand van een Drents beekdal gaat het zo goed, dat een fragiele orchidee tot bloei komt. Maar verderop zijn er zorgen: redt de hermelijn het wel? En is de woekerende grote waternavel nog te stoppen? Trugkieke:: Oost-Souburg is aantrekkelijk om te wonen. Winkelhart van het dorp is De Kanaalstraat, vlak bij de draaibrug van Souburg. Vroeger was deze brug de enige manier om het dorp te verlaten. (2026)'
