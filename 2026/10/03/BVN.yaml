  description: 'De muzikale spotlights zijn gericht op Jeangu Macrooy. De soulvolle singer-songwriter verruilde Paramaribo voor Nederland en verwerkt liefde, identiteit en persoonlijke groei in zijn muziek. Yves Berendse maakt van Alive, dat Jeangu samen met zijn tweelingbroer schreef, het Nederlandstalige Dat Ik Leef. Desray vertolkt Grow, het persoonlijke lied waarmee Jeangu in 2020 naar het Songfestival zou gaan. Clouseau maakt van zijn doorbraaknummer High On You de Nederlandse bewerking Thuis Bij Jou. Acteurs: Yves Berendse (Self), Fay Claassen (Self), Zoë Livay (Self), Jeangu Macrooy (Self), Désirée Manders (Self) (2026)'
