  title: Pointer Checkt
  subtitle: 'De waarheid over omega-3 supplementen S14 E04. Langer leven en minder kans op hart- en vaatziekten: volgens influencers zijn dat dé voordelen van omega 3-vetzuren en moet je vis eten of supplementen slikken. Wat zegt de wetenschap?'
  description: 'Langer leven en minder kans op hart- en vaatziekten: volgens influencers zijn dat dé voordelen van omega 3-vetzuren. Je vindt deze voedingsstoffen onder andere in vis en visolie. Daarom raden sommige mensen op sociale media aan dat we meerdere keren per week vis moeten eten, of visoliecapsules moeten slikken. Wat klopt er van die beweringen over vis en visolie? We behandelen mogelijke bijwerkingen van omega 3-supplementen, zoals hartritmestoornissen, en wat recent onderzoek laat zien over hoge omega 3-waardes en de bijwerkingen van omega 3-supplementen. (2026)'
