  audiodesc: true
  description: "Die Dokumentation erzählt die außergewöhnliche Lebensgeschichte von Eva Ries, einer deutschen Musikmanagerin, die es von der badischen Provinz an die Spitze des internationalen Hip-Hops schaffte. Anfang der 1990er-Jahre wurde Eva Ries die Marketing- und Tourmanagerin des Wu-Tang Clans - der einflussreichsten Rap-Gruppe aller Zeiten. \nAls eine der wenigen Frauen durchbrach sie die Grenzen einer männerdominierten Musikindustrie und schrieb ihre eigenen Regeln. Ihre Geschichte ist auch die Geschichte von Aufstieg und Fall der Musikindustrie der 1990er-Jahre, von Female Empowerment und der Kraft der kulturellen Diversität."
