  title: Naturerlebnis Franken
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Viele Hessen kennen Franken als nahegelegenes Ausflugs- und Reiseziel, Freizeit- und Erholungsgebiet. Mit etwas Glück kann es bei Wanderungen, Spaziergängen, Rad- oder Bootstouren gelingen, die kleinen Wunder der artenreichen fränkischen Flora und Fauna zu entdecken. Der Film zeigt die kunstvollen Eis-Stalagmiten der Oswaldhöhle. Hinter alten Fachwerkhäusern blüht der Märzenbecher, in kleinen Biotopen die extrem seltene Schachbrettblume, eine botanische Kostbarkeit. Nach Frühling und Sommer zeigt sich ein bunter Herbst, wie er schöner nicht sein könnte.
