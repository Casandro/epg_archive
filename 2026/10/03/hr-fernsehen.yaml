  description: Emilio ist 14 Jahre alt, lebt in Brandenburg und ist durch einen Verkehrsunfall seit seinem vierten Lebensjahr blind. Emilio hat viel Spaß am Leben, viele Interessen und ist sehr selbstständig. Seit einem halben Jahr ist er stolzer Hundebesitzer von Roxy, mit der er einen Hundetreff in seinem Dorf besucht und dort mit ihr trainiert. Emilio spielt außerdem mit viel Begeisterung in der Blindenfußballmannschaft von Hertha BSC und macht auch gerne Stand-up-Paddeln. Seit acht Jahren spielt er Klavier. Emilios wichtigstes Ziel ist es, immer selbstständig zu bleiben.
