  title: Mittendrin - Flughafen Frankfurt
  subtitle: Wenn Teller fliegen lernen - Neues Bordgeschirr im Härtetest
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Die Lufthansa erneuert ihr Bordgeschirr auf allen Fliegern, weltweit. Schlappe 187 Millionen Teile werden ausgetauscht. Eine gigantische logistische Herausforderung. Doch vor dem Tausch steht der Testflug. Teller, Tassen und Besteck müssen zeigen, was sie draufhaben. Kann das Kabinenpersonal damit arbeiten? Sind die Teller zu schwer, unhandlich oder doch zu klein? Kommt das neue Design bei den Fluggästen an? Und entsprechen Messer und Gabel den internationalen Sicherheitsvorschriften? "Mittendrin" durfte exklusiv den Testflug des neuen Geschirrs begleiten. Nur wenn dieser Flug erfolgreich ist, startet der neue Bordservice.
