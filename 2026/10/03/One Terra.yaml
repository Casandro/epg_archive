  title: Rund um den Globus - Die blinden Kinder von Tibet
  subtitle: Rund um den Globus - Die blinden Kinder von Tibet
  description: Das Leben für die Menschen im Hochland von Tibet ist hart - und Blindheit gilt als schlechtes Karma, als eine Strafe für Sünden im vorherigen Leben. Allein die blinde Sabriye Tenberken nahm sich der Ausbildung der bis dahin verlorenen Kinder an. In ihrer Blindenschule von Lhasa leben 28 Kinder. Hier wird ihnen Tibetisch, Chinesisch, Englisch, Mathematik und die Kunst der Massage beigebracht. Und sie lernen, unabhängig zu sein, sich mit dem Blindenstock in der Stadt zu orientieren.  DE 2011
