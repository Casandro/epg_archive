  title: 'Planet Weltweit - Ganz ritterlich: Kastiliens Kämpfer'
  subtitle: 'Planet Weltweit - Ganz ritterlich: Kastiliens Kämpfer'
  description: 'Planet Weltweit: Ein kurioses Spektakel: In historischer Ritterrüstung, mit Schwertern, Äxten und Hellebarden bewaffnet, treten Männer und Frauen in Duellen oder als Mannschaft gegeneinander an. Der mittelalterliche Turnierkampf erlebt in Spanien einen regelrechten Boom. Jedes Jahr findet ein großes Turnier am Fuße der Burg Belmonte in Kastilien-La Mancha statt.  Zuschlagen, treten, zu Boden werfen - der mittelalterliche Turniersport ist so hart und anstrengend wie er aussieht. Ein Duell dauert bis zu eineinhalb Minuten und fordert physisch und mental Extremes ab. Beim Gruppenkampf geht es darum, die Gegner schonungslos niederzuringen. Die Waffen werden in traditioneller Weise hergestellt, sind aber aus Sicherheitsgründen ohne Spitze und scharfe Klinge. Die Hochburg dieser Schmiedekunst befindet sich in Toledo, wo auch der Schmied Julio Ramírez seine urige Feuerstelle hat. Dort, in der Region Kastilien-La Mancha, kämpfte einst schon der Romanheld Don Quijote gegen Windmühlen. Mario Fernandez, im wahren Leben Elektriker und seit drei Jahren Turnierkämpfer, fiebert auf das große Turnier an der Burg Belmonte regelrecht hin - für ihn ist es hier eine Premiere. Seit fünfzehn Jahren trainiert er Fechten und war regionaler Meister. Im mittelalterlichen Turnierkampf kann er sich nicht nur körperlich austoben, sondern auch der Fantasie freien Lauf lassen und in der Ritterwelt schwelgen. Sein Mannschaftskapitän David Diaz Torrijos ist schon sieben Jahre dabei. Sein Ziel ist es, dem Team Bohurt La Mancha zu einer Medaille zu verhelfen. Auch Frauen kämpfen im Turnier, so wie Susana Hernandez Cabo und ihre Freundinnen. Wie wird es ihnen allen dieses Jahr ergehen, wer wird den Turniersieg davontragen? Eines steht jetzt schon fest: sie werden sich ritterlich schlagen... DE 2021'
