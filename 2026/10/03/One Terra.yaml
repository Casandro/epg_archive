  title: Planet Weltweit - Die kleinen Schätze in Frankreichs Garten
  subtitle: Planet Weltweit - Die kleinen Schätze in Frankreichs Garten
  description: 'Planet Weltweit: Die Region Pays de la Loire in Westfrankreich gehört zu den grünsten Gegenden des Landes mit einer besonders traditionsreichen Gartenkultur. Serge Denoix ist Gärtner aus Leidenschaft und interessiert sich auch für die alten Werkzeuge, mit denen schon vor Jahrhunderten gearbeitet wurde, die aber heute kaum noch jemand kennt. Sie vor dem Vergessen zu bewahren, ist seine Mission. Serge Denoix und seine Partnerin Laurence Beaufils haben den sprichwörtlichen grünen Daumen. Die Liebe zur Gartenkunst hat sie schon immer verbunden. Doch nicht nur das - neben allem, was blüht und grünt, interessieren sich die beiden auch für die alten Werkzeuge, mit denen ihre Gärtnerkollegen über die vergangenen Jahrhunderte hinweg ihren Beruf ausgeübt haben. Dabei ist die Funktion manch eines Gerätes heute kaum mehr auf Anhieb ersichtlich. So haben die passionierten Sammler immer wieder Fundstücke vor sich, deren Zweck und Ursprung sie erst in mühevoller Recherche herausfinden müssen. Neben dem Durchforsten alter Nachschlagewerke helfen ihnen dabei befreundete Landwirte, Handwerker oder auch Antiquitätenhändler. Bei vielen der alten Werkzeuge hat das enorme Alter zudem seine Spuren hinterlassen. Sie sind kaputt oder abgenutzt und müssen erst in aufwändiger Arbeit von Hand restauriert werden. Eines dieser Stücke ist ein alter Blumenpflücker, den Serge und Laurence nun bei einem Goldschmied in Ordnung bringen lassen wollen. Wird es der Experte schaffen, das fragile Kleinod wieder funktionsfähig zu machen?  DE 2021'
