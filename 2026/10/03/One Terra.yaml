  subtitle: Planet Weltweit - Werft unter Palmen - Indonesiens Pinisis
  description: Pinisis, kleine wendige Frachtensegler, verkehrten bereits zu Zeiten der niederländischen Kolonialisierung zwischen den indonesischen Inseln. Sie transportierten dort sowohl Alltagsgegenstände als auch für den Export bestimmte Waren wie wertvolle Gewürze. Bis heute gibt es die Pinisis noch, auch wenn sich ihre Aufgaben verändert und die hochseetauglichen Schiffe nicht mehr die überlebenswichtige Funktion haben wie damals. Auch sind viele inzwischen mit Motoren ausgestattet. Doch noch immer werden Pinisis wie damals gebaut, am Strand, ohne schriftlichen Bauplan. Eine Einzigartigkeit, die inzwischen zum immateriellen Weltkulturerbe der UNESCO gehört. DE 2023
