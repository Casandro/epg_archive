  title: 'Planet Weltweit - Koh Panyee: Thailands fußballverrückte Insel'
  subtitle: 'Planet Weltweit - Koh Panyee: Thailands fußballverrückte Insel'
  description: 'Planet Weltweit: Die kleine Insel Koh Panyee liegt malerisch umringt von hoch aufragenden Karstfelsen inmitten der Phang-Nga-Bucht im Süden Thailands. Atemberaubend schön, jedoch im Alltag auch extrem eng. Denn die Einwohner leben auf Stelzen über dem Wasser, die meisten von ihnen betreiben Fischfang und Bootsbau. Und sie sind fußballbegeistert. Natürlich haben sie in ihrem Dorf auf dem Meer keinen normalen Fußballplatz, sondern ein schwimmendes kleines Stadion. Allerdings ist die Ponton-Konstruktion inzwischen kaum noch bespielbar. Das muss jetzt anders werden, denn ein großes Turnier steht an, das erste seit Jahren. Ein Neustart für Koh Panyees Wasserstadion und alle packen mit an. Koh Panyee liegt inmitten einer endlosen, glitzernden Wasserfläche. Gleißende Sonne, im Wechsel mit plötzlichen, heftigen Gewittern, kündigt schon den Wechsel der Jahreszeiten an. Die typischen Longtailboote der Fischer kreuzen bereits zum Sonnenaufgang durch die Bucht, sie sind das Hauptverkehrsmittel zwischen den Inseln. Koh Panyee war einst ein Magnet für Fußball-Begeisterte aus ganz Thailand. Inzwischen verfällt der schwimmende Fußballplatz immer mehr. Die ehemaligen Erfolgs-Spieler sind nicht mehr aktiv, der Ruhm des Fußballvereins Koh Panyee FC ist längst verblasst. Aber dieses Jahr soll ein Wendepunkt sein, ein Neuanfang. Endlich wird wieder ein prestigeträchtiges Turnier stattfinden, noch vor Beginn der Regenzeit und dem muslimischen Fastenmonat Ramadan. Dafür muss der Platz wiederhergerichtet werden. Das bedeutet viel Arbeit und immense Kosten, aber viele Bewohner wollen das Projekt mit ihren Spenden auf jeden Fall möglich machen. Das Team der Gastgeber jedenfalls ist auch sportlich hochmotiviert, zur Steigerung der Fitness gibt es sogar Trainingseinheiten auf einer nahegelegenen Sandbank - zusammen mit ihren enthusiastischen Fans werden sie nichts unversucht lassen, um beim ersten Heimturnier seit Jahren als Sieger vom Platz zu gehen...  DE 2021'
