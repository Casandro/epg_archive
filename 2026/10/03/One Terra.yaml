  title: Planet Weltweit - Die Bambusbahn von Kambodscha
  subtitle: Planet Weltweit - Die Bambusbahn von Kambodscha
  description: 'Ohne sie gäbe es keinen Handel und keine Familienfeste, keine Einkäufe auf dem Markt und keine Arztbesuche: "Norry", die Bambusbahn, ist für eine ganze Region im Norden Kambodschas die Lebensader. Denn noch gibt es im verminten Land nur wenige Straßen. Die Bahn ist weder verboten noch genehmigt - dafür aber wird sie dringend gebraucht. Die Reportage zeigt das Schicksal des Draisinenführers Ly Tith und seiner Passagiere und damit eine eindringliche Momentaufnahme des ländlichen Kambodscha. Jede Draisine ist eine Miniaturbühne des Alltags: Auf der dreieinhalb mal zwei Meter großen Bambusfläche drängen sich Bauern, Schulkinder, Mönche und stillende Mütter im Schneidersitz, gackernde Hühner, Trockenfisch, Kühe, Mangos, Säcke mit Reis. Mit bis zu 50 Stundenkilometern rattert Norry über geflickte Gleise und knarrende Holzbrücken, vorbei an Pfahlbauten, Tempeln, Tamarindenbäumen und Reisfeldern. "Diese Trasse ist wie unser Land", meint Draisinenführer Ly Tith, "geschunden, fast vergessen, aber unzerstörbar." Die Bambusbahn steht für den Überlebenswillen und die Improvisationskunst der Kambodschaner: Anstatt auf Hilfe vom Staat zu warten, haben ein paar Dutzend Bauern vor 25 Jahren auf der verrosteten Kolonialtrasse ihren eigenen Zug gebaut: aus Bambus, Motoren von gebrauchten Generatoren und Metallrädern aus Schrott-Panzern; einen Zug, der für wenig Geld jederzeit fährt und überall hält. Mittlerweile hat die improvisierte Bahn auch System. Die zwei Dutzend Draisinenführer haben Schichtpläne entworfen, Strecken aufgeteilt und Preise sowie Vorfahrtsregeln festgesetzt. Wie lange Norry noch durch die Reisfelder preschen wird, weiß niemand. Die staatliche Zuggesellschaft will die Bambusbahn gegen eine Entschädigung für die Draisinenführer, bald aus dem Weg räumen. Doch ob es wirklich dazu kommt? Ly Tith und seine Passagiere glauben noch nicht, dass ihre kleine Bambusbahn eines Tages tatsächlich verschwinden wird.  DE 2008'
  ageRating: 6
