  title: Planet Weltweit - Huskies am Start!
  subtitle: Planet Weltweit - Huskies am Start!
  description: Die 37jährige Norwegerin Marit Beate Kasin träumt seit ihrer Kindheit davon, Huskies zu züchten und an großen Hundeschlittenrennen teilzunehmen. Mit Mitte 20 gründete sie ihre Hundezucht "Winterdans" (Wintertanz). Fünfmal schon nahm sie am "Finnmarksløpet" in Norwegen teil, dem längsten und härtesten Rennen Europas. Zweimal wurde sie bereits Zweite, jetzt tritt sie mit einem neuen Hundeteam an. Das Rennen geht über 1.200 km quer durch die Finnmark, von Alta über Kautokeino nach Kirkenes und zurück. GEO Reportage war mit unterwegs. Mit dabei auf Marits Wegen ist seit 14 Jahren ihre Partnerin Susana, als gute Seele, Organisationstalent und beste Freundin. Die beiden haben sich auf der Uni in Bergen kennengelernt und Marit konnte die gebürtige Kolumbianerin für ihren Traum begeistern. Mit 14 Hunden und Marit als "Musher(in)", so nennt man die Hundeschlittenführer in der Fachsprache, treten sie jetzt beim nördlichsten Hundeschlittenrennen der Welt an, das zugleich das längste Europas ist. Marit kämpft sich mit ihren Alaskan Huskies über 12 Etappen durch Schnee und Eis, über Berge und zugefrorene Flüsse. Susana lenkt währenddessen mit Freunden den Begleittross aus Camper und Hundetrailer von Checkpoint zu Checkpoint, um mit frischem Material zur Stelle zu sein und verletzte oder erschöpfte Hunde in Empfang zu nehmen. Über die Gesundheit der Tiere wacht ein internationales Team von Tierärzten. Beim geringsten Anzeichen von Erschöpfung oder muskulären Problemen wird das Tier aus dem Rennen genommen. Tiere auswechseln ist verboten. Mit mindestens sechs der ursprünglich 14 Hunde müssen die Musher ins Ziel kommen, sonst droht die Disqualifikation. Wie weit werden es Marit und Susana bringen?   DE 2020
