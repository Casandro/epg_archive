  title: Hvězdné návraty
  description: 'Je tu další oslava jednoho komika, pořad s výběrem scének, veselého povídání a zajímavostí. Hvězdné návraty vám dnes připomenou, že své 95. narozeniny oslavila první osobnost divadla Semafor: Jiří Suchý. Stál u zrodu této scény a vede ji dodnes. Pustíme si scénky, vyprávění, vzpomínky i písničky. Pořad pro vás připravuje a těší se na vás Patrik Rozehnal. Už dnes po 16. hodině na vlnách Českého rozhlasu.'
