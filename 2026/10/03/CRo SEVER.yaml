  title: Svět zvířat
  description: 'Hostem Světa zvířat dnes bude chovatelka koní Kateřina Šeráková. Dozvíte se, jak vypadá každodenní život s koni, co všechno obnáší péče o tato ušlechtilá zvířata a jaké radosti i starosti chov přináší. Ptejte se i vy na to, co vás zajímá. Telefon do studia je 475 212 212. Své dotazy můžete psát na email: host@sever.rozhlas.cz. Moderuje Dáša Cestrová.'
