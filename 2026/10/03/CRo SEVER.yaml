  subtitle: Ústecký písničkář Petr Lüftner pro vás vybírá písničky, které má rád a které jinde neuslyšíte.
  description: Ústecký písničkář Petr Lüftner pro vás vybírá písničky, které má rád a které jinde neuslyšíte. Dnes se vydáme opět za hudbou Jižní Ameriky. Tentokrát nás čeká uruguayská kapela No Te Va Gustar, která během více než třicetileté kariéry propojila rock s reggae, ska i dalšími latinskoamerickými vlivy a pokud už Vás jejich tvorba zaujala třeba vloni, tak Vám možná v tomto díle udělá radost informace, kam nejblíže za pár dnů přijedou koncertovat. Z Montevidea se pak na závěr přesuneme o kus severněji do Brazílie, kde si představíme rockovou kapelu Ira!
