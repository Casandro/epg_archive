  title: rbb Gartenzeit
  subtitle: Ab in die Pilze
  episodeUri: crid://onid-1/e/6a8a1ee6769542e5e86c640a
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Herbstzeit ist Pilzzeit. Durch die Wälder streifen, mit Korb und Messer bewaffnet immer tiefer hineinlaufen, mit scharfem Blick den Waldboden scannen. \nDas Spannende an dem Vergnügen: Unter manchem Hut könnte der Tod lauern. Etwa 190 essbare stehen 150 giftigen Pilzarten gegenüber - 10 davon sind tödlich. Da macht es Sinn, sich auszukennen. Pilzcoaches kommen mit der Nachfrage zu ihren Kursen kaum hinterher.\nDer Film begleitet verschiedene Akteure durch Brandenburgs Wälder, schaut in geheimnisvolle Zuchtkammern und geht der Frage nach, was Menschen daran fasziniert, sich ganz der Welt der Pilze zu verschreiben."
