  title: Bye-Bye Bellevue - Der Bundespräsident zieht um
  subtitle: Reportage von Tina Handel und Moritz Rödle
  episodeUri: crid://onid-1/e/6a8f64dd4bd0516e6ee27500
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Bellevue und der Bundespräsident - das gehört eigentlich zusammen. Doch das Schloss im Herzen Berlins muss grundsaniert werden. Für acht Jahre zieht das Staatsoberhaupt deshalb in einen Neubau - und mit ihm alles, was zu seinem Amt gehört und damit auch Deutschland repräsentiert: die Küche für Staatsbankette, Staatsgeschirr und Standarte, Akten und Bibliothek. Viele Kunstgegenstände aus Bellevue können hingegen nicht mitkommen. Die Reportage blickt hinter die Kulissen dieses besonderen Umzugs.'
