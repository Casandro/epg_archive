  description: "Die junge Zooangestellte Sonja wird von ihrem Freund und Kollegen Jens verlassen. Die psychisch labile Frau rastet aus. Sie liebt Jens abgöttisch und in ihrer übersteigerten Eifersucht befürchtet sie, dass er zu seiner nach einem Unfall gelähmten Exfreundin Conny zurückkehren will. Und damit nicht genug: Sie droht damit, sich und das sich in ihrer Obhut befindliche Kragenbärbaby Gustav umzubringen, wenn Jens nicht seine Meinung ändert. \nNun ist Gustav erst eine Woche alt, und schon der erklärte Liebling der Stadt Köln. Jens alarmiert Sophie, weil sie die einzige Polizistin ist, die er kennt. Die beiden waren früher mal ein Paar."
