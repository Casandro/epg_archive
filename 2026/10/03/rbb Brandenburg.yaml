  title: Mord mit Aussicht (14)
  subtitle: Die Venus von Hengasch
  episodeUri: crid://onid-1/e/6a8a1ee6769542e5e86c640c
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Als Sophies Vater einen Herzinfarkt erleidet, erfährt sie, dass der alte Sturkopf hinter ihrem Rücken das alte Forsthaus in Hengasch gekauft hat. Damit ist klar: Sophie bleibt! Weil Hannes auf die geplante Reha pfeift und Sophie mitten im Umzug ins Forsthaus und in einem neuen Fall steckt, akzeptiert sie zähneknirschend, dass Hannes Heike Schäffer als Hilfe engagiert. Nachdem Sophie ihren Vater versorgt weiß, konzentriert sie sich ganz auf den Mord an Maler Sieben, der erschlagen wurde. Siebens langjährige Haushälterin Helene, die den Mörder noch kurz gesehen hat, glaubt an einen Rachemord.'
