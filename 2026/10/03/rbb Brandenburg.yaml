    Die sternförmigen Plätze und breiten Boulevards der polnischen Hafenstadt erinnern an die deutsche Geschichte, angelegt wurden sie nach dem Vorbild von Paris. Heute sucht die Stadt ihren eigenen Weg. Wer Szczecin verstehen will, steigt in die Tram 3. Die älteste Linie der Stadt an der Odermündung führt mitten durch ihr Herz und verbindet die Wohnquartiere im Süden mit dem Norden.
