  title: Unterwegs in Frankfurt/Oder
  episodeUri: crid://onid-1/e/6ab52bbf154534f4084eb793
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Frankfurt (Oder) - das ist optisch eine Stadt voller Gegensätze: Plattenbauten wetteifern mit prächtiger Backsteingotik, heruntergekommene Industrie-Ruinen mit liebevoll restaurierten Altbauten. So spiegeln sich schon im Stadtbild 750 Jahre wechselvoller Geschichte: unter anderem Hansestadt - Universitätsstadt - Stadt des größten Halbleiterwerks der DDR. Das alles ist eingebettet in die wunderschöne Flusslandschaft der Oder.'
