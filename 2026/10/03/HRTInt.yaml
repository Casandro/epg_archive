  title: Dolina sunca, serija (20/210)
  subtitle: ' '
  description: 'Julija se ljuti na oca jer je u posljednje vrijeme prema svima grub i sarkastičan. Juran kaže Augustini kako zna da je čula njegov i Sonjin razgovor, te je pokušava smiriti napominjući da zna kakav je Kristijan ponekad s tim svojim iluzijama. Eva se šali s Andrijom kako je napad jedino što može očekivati u Jablanovu. Ivan je ogorčen zbog Julije, ali ga Nikola oraspoloži pozivom na druženje što teško padne Adeli. Augustina prizna Kristijanu da na njegovom mjestu ne bi toliko vjerovala Juranu. Andrija i Eva razgovaraju o Vjeki i njegovom boravku u zatvoru. Ruža se pohvali Loreti kako je Nikola napokon pristao na njezinu ideju za proširivanjem posla. Andrija je zatečen kad ugleda Juliju koja koristi priliku vidjeti ga kada nema Eve i Sofije. Prizna mu da joj sve ovo neugodno jer su se upravo ovdje viđali i skrivali od svih ona i Vjeko. Eva i Sofija sretnu Irenu i Kristijana, te zaigraju tenis zajedno. Ljubomorna Irena pogodi Evu u gležanj na što joj Kristijan instinktivno priskoči u pomoć... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
