  title: 'Hrvatska moj izbor: Rebecca i Adriana'
  subtitle: ' '
  description: U ovoj epizodi ciklusa "Hrvatska, moj izbor" upoznajemo ljude koji su Hrvatsku izabrali srcem, iako su rođeni daleko od nje. Dr. Adriana Maria Camino Varela iz Buenos Airesa ostvarila je san svojih predaka i sredinom devedesetih sa suprugom Diegom i djecom doselila se u Dubrovnik. Danas su oboje omiljeni liječnici dubrovačkog kraja. Njihova obitelj broji petero odrasle djece, a njihov život svjedoči o tome kako se ljubav prema zemlji može prenijeti i na nove generacije. U Dubrovnik nas vodi i Rebecca, Britanka koja je nakon 12 godina putovanja svijetom slučajno uplovila u Grad. Već uz prvu kavu ova je stjuardesa osjetila da je pronašla mjesto kojem pripada. Što je ove ljude povezalo s Hrvatskom i zbog čega su upravo nju odabrali za svoj dom - pogledajte u ovoj epizodi "Hrvatska, moj izbor".
