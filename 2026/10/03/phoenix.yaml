  title: War Games - Der Kalte Krieg
  subtitle: Hysterie
  widescreen: true
  hd: true
  description: Im Jahr 1949 gründen mehrere westeuropäische Nationen die NATO, eine Allianz mit den USA, um sich gegen die UdSSR zu verteidigen. Im selben Jahr testet die Sowjetunion ihre erste Atombombe. Das Wettrüsten ist voll entbrannt, bald folgt die Entwicklung der Wasserstoffbombe. Die daraus resultierende Paranoia führt in den USA zu Schauprozessen und Hexenjagden. Ob Stellvertreterkriege wie in Korea oder Spionage - der Kalte Krieg beginnt heiß zu werden.
