  title: Kochen mit Anixe - Linsen-Quinoa Bowl- Bunt, Gesund, ab in den Mund
  subtitle: Kochen mit Anixe - Linsen-Quinoa Bowl- Bunt, Gesund, ab in den Mund
  description: 'Der Bowl-Trend hat einen wichtigen Grundsatz der ausgewogenen Ernährung optimal umgesetzt: Je bunter Ihr Essen ist, desto besser ist es für Sie! Die Bowl-Rezepte stellen nach dem Baukastenprinzip alles, was zu einer ausgewogenen Ernährung gehört, zusammen in einer farbenfrohen Schüssel zur Schau. Unser TV Koch Jörg Guhmann hat sich für eine lauwarme Variation mit Linsen, Quinoa, Rosenkohl und Cranberrys entschieden. Ganz zur Freude unserer Moderatorin, denn sie liebt diesen neuen Foodtrend. Und wer sich an die Vorgabe Je bunter, desto besser hält, kann letztlich nichts falsch machen und bekommt mit Bowls wie der unsrigen ein leckeres Essen.  Hier das komplette Rezept!'
