  title: Achim, wie hast du Menschen aus der DDR geschmuggelt?
  subtitle: Der Fälscher mit den Händen von Picasso (3/3)
  description: |-
    Bei ihrem Treffen mit dem Sohn des Fälschers Edgar Mrugalla hat Kunstverbrechen-Host Lenore eine Liste bekommen, auf der eine große Anzahl an Fälschungen aufgeführt sind und an wen sie verkauft wurden. Hängen heute noch Fälschungen in deutschen Museen? Eine Spur führt zu einem Museum in Berlin.

    Ein Podcast von NDR Kultur
