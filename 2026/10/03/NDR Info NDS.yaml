- eventId: 771475
  start: 2026-10-03T04:04:00Z
  stop: 2026-10-03T04:30:00Z
  title: 'Kunstverbrechen: True Crime meets Kultur'
  subtitle: Der Fälscher mit den Händen von Picasso (1/3)
  description: |-
    Alles beginnt mit einem vermeintlich echten Gemälde von Caspar David Friedrich. Ende der 1970er Jahre findet der Schrotthändler Edgar Mrugalla das Bild "Greifswald bei Sonnenaufgang" bei einer Haushaltsauflösung. Er erkennt aber nicht, dass es ein Caspar David Friedrich ist und verkauft es für einen viel zu geringen Preis weiter. Als er den Fehler bemerkt, ist es zu spät. Der Zorn auf das eigene Versagen motiviert ihn, sich mit Kunst zu beschäftigen. Es ist der Anfang seiner Karriere als Kunstfälscher.

    Ein Podcast von NDR Kultur
- eventId: 771476
  start: 2026-10-03T04:30:00Z
  stop: 2026-10-03T04:34:00Z
  title: Nachrichten
  description: .
- eventId: 771477
  start: 2026-10-03T04:34:00Z
  stop: 2026-10-03T05:00:00Z
  title: 'Kunstverbrechen: True Crime meets Kultur'
  subtitle: Der Fälscher mit den Händen von Picasso (2/3)
  description: |-
    Im Morgengrauen des 21. Oktober 1987 fahren Polizeiautos durch das kleine Dorf Fiel in Schleswig Holstein. Die Beamten wollen den Kunst-Fälscher Edgar Mrugalla verhaften. Denn endlich hat ein Düsseldorfer Kunsthändler ausgepackt und den Fälscher verraten. Was finden die Beamten in dem verwinkelten Haus alles und gesteht der Fälscher seine Taten?

    Ein Podcast von NDR Kultur
