  title: Faszination Heimat - Rausch des Wassers
  subtitle: Faszination Heimat - Rausch des Wassers
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Meteorologen und Geophysiker Norbert Span. Dank seiner sehr persönlichen und mitreißenden Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Wasser. Wild und schön, anmutig und gewaltig... AT 2013'
