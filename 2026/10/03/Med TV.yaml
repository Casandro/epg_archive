  title: La Firenze dei Medici
  subtitle: ' '
  description: Explore the profound influence of the Medici family on the history of Florence, highlighting their rule from the 15th to the 16th century. The focus is on Lorenzo Il Magnifico, the era's most renowned figure. Through his life, we delve into iconic works linked to the Medici, including the masterpiece of architecture, the Dome of Santa Maria del Fiore, designed by Filippo Brunelleschi. The episode also features Florence’s own Sergio Staino, a celebrated designer and cartoonist, offering a unique perspective on the city’s rich cultural legacy.
