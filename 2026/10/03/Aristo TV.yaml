  title: OnlineKirche mit Pastor Gert Hoinle - Positiv bleiben, Kurzschluss vermeiden
  description: 'Zacharias bekam als alter Mann durch den Engel Gabriel die göttliche Zusage, nunmehr einen ganz besondere Sohn zu bekommen. Doch statt sich zu freuen, motzte Zacharias. Gabriel schimpfte und schaltete Zacharias stumm. (Was für ein Kurzschluss!) Seine Frau Elisabeth war da ganz anders. Sie hatte ein gläubiges Herz und wurde nicht stummgeschaltet. Im Gegenteil. Sie redete so inspiriert, dass man ihre Worte aufschrieb und wir sie noch heute lesen können. Ihr Sohn Johannes der Täufer hatte Anteile von Vater und Mutter in sich. Er konnte beides: jubeln und zweifeln. In ihm finden sich wohl die meisten von uns wieder.'
  widescreen: true
