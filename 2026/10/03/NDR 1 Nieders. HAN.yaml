- eventId: 774841
  start: 2026-10-03T04:00:00Z
  stop: 2026-10-03T08:00:00Z
  title: Die 80er - auf dem Weg zur Einheit
  description: |-
    Mit viel Musik und emotionalen Geschichten erinnert NDR 1 Niedersachsen an ein Jahrzehnt, das Deutschland grundlegend veränderte. Der Kalte Krieg und der Eiserne Vorgang waren allgegenwärtig. Dann gingen die Menschen im Osten auf die Straße, kämpften für ihre Freiheit - und tranken plötzlich Sekt auf der Berliner Mauer. Die 80er waren aber auch: Schulterpolster und Lederkrawatten, Dallas und Denver, Aerobic und Breakdance, Ghostbusters und Top Gun. NDR 1 Niedersachsen holt das Lebensgefühl einer aufregenden Zeit zurück.

    Stündlich Nachrichten, Wetter und Verkehr
  subtitle: Mit Andreas Kuhnt
