- eventId: 780001
  start: 2026-10-03T17:00:00Z
  stop: 2026-10-03T18:00:00Z
  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: "Ane Brun \n\nEine norwegische Liedermacherin, die zunächst in Barcelona und San Sebastian als Straßenmusikerin unterwegs war und im Laufe ihrer Karriere aber auch für die schwedische Königsfamilie aufgetreten ist. Sie hat einen sehr eigenen Stil, der zuweilen zerbrechlich wirkt, es aber nicht ist. Das Spannungsfeld dieser Zartheit und der gleichzeitigen Energie, die sie versprüht, macht ihre Musik besonders.\n\nModeration: Susanne Papawassiliu"
- eventId: 779841
  start: 2026-10-03T18:00:00Z
  stop: 2026-10-03T21:00:00Z
  title: ARD Oper
  description: "Matthias Pintscher dirigiert die Staatskapelle Berlin\n\nMatthias Pintscher: Das kalte Herz - Oper in 12 Bildern\n\nPeter: Samuel Hasselhorn\nAnubis: Rosie Aldridge\nMutter: Katarina Bradic\nClara: Sophia Burgos\nAzael: Sunnyi Melles\nAlte Frau: Adriane Queiroz\nKind: Solist des Kinderchors der Staatsoper\n\nStaatskapelle Berlin\nLeitung: Matthias Pintscher \n\nAufnahme vom 11.01.26 aus der Staatsoper Unter den Linden Berlin\n\nMit \"Das kalte Herz\" feierte am 11.01.2026 eine neue Oper komponiert von Matthias Pintscher und geschrieben von Daniel Arkadij Gerzenberg Premiere - inspiriert von Wilhelm Hauffs Märchenklassiker von 1827. Im Zentrum steht das Herz als Ort menschlicher Gefühle, der daher immer wieder von verschiedenen Kräften begehrt und umkämpft wird. Gerzenberg nutzt den Wald als Kulisse für die Sehnsüchte, Ängste und die komplexe Gefühlswelt der Menschen. Auch der geheimnisvolle und überwältigende Klang des Werkes entführt uns in die unheimlichen Tiefen des menschlichen Seins. \n\nModeration: Petra Gute"
