  title: Feature
  description: "Schon lange kein Frühling\nUnser Vater, das Haus in Rumänien und wir\nVon Alexandra Bidian\n\nDach ab. Sie sprechen zum ersten Mal über den Umgang mit ihrer Trauer. Ihr Vater Alexandru oder Tata, Rumänisch für Papa, ist 2013 mit 83 Jahren gestorben. Da war Maria 24, Alexandra 21 Jahre alt. Er war nie ganz in Deutschland angekommen, sein Herz für immer in Rumänien geblieben, in dem Land, das er auf der Flucht vor dem kommunistischen Regime Ceausescus verlassen hatte. Sein Testament endete mit den Worten, dass seine Töchter in seinem Willen weiterleben sollen. Was heißt das? Wie sollen sie leben? Hütete der Vater ein Geheimnis? Maria, die sonst in Berlin Romane schreibt, und Alexandra, die Filme in Hamburg macht, renovieren das Haus in Sibiel, das für ihren Vater das Paradies war - auf der Suche nach ihrer Familie zwischen Rumänien und Deutschland, kommunistischem Regime und Demokratie, Freiheit und Exil, Republik und Revolution, Sehnsucht und Schweigen. \nAlexandra Bidian,1991 geboren, arbeitet als Autorin für die Redaktionen Stories und Dokumentarfilm beim NDR, lebt die Hälfte des Jahres in Hamburg und seit ihrer Recherche über ihren Vater auch in Rumänien. Das Gedicht \"Schon lange kein Frühling\" schrieb ihr Vater Alexandru Bidian in seinem Exil in Deutschland. Dies ist Alexandras erstes großes künstlerisches Radiofeature.\n\nNDR 2026"
- eventId: 779813
  start: 2026-10-03T13:00:00Z
  stop: 2026-10-03T15:00:00Z
  title: Blindverkostung
  subtitle: 'Moderation: Christian Detig'
  description: "Richard Strauss: Also sprach Zarathustra, op. 30 \nRichard Strauss' \"Also sprach Zarathustra\" ist ein monumentales Werk, das von Friedrich Nietzsches gleichnamigem philosophischem Roman inspiriert wurde. Die berühmte Einleitung \"Sonnenaufgang\" ist weltbekannt, doch das gesamte Tonepos entfaltet eine faszinierende Klangwelt voller Tiefe und Dramatik. Blind verkostet von Christine Lemke-Matwey, Kai Luehrs-Kaiser und Andreas Göbel. \nModeriert von Christian Detig.\n\nModeration: Christian Detig"
