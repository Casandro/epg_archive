- eventId: 1244934
  start: 2026-10-03T06:00:00Z
  stop: 2026-10-03T07:00:00Z
  title: Gdzie tu coś zjeść? 1 (odc. 7)
  description: |-
    Tytuł oryginalny: Gdzie tu coś zjeść?
    PL, 2026
    Agnieszka i Ewa w wielkiej trasie po Polsce sprawdzają lokale polecane przez mieszkańców, w internecie ale też sprawdzają miejsca "w ciemno". W odcinku z Tarnowa Podgórnego Big Mama zaserwuje największe schabowe w okolicy, leśny zakątek zachwyci nie tylko jedzeniem ale tez inwentarzem w zagrodzie oraz przekonamy się jak to jest jak restauracji pilnuje lew!
  ageRating: 12
  genre:
  - '35'
- eventId: 1244935
  start: 2026-10-03T07:00:00Z
  stop: 2026-10-03T08:00:00Z
  title: 'Charlie Luxton: domy nad Morzem Śródziemnym 1 (odc. 3)'
  description: |-
    Tytuł oryginalny: Homes by the Med
    GB, 2015
    Reżyseria: James Knight
    Kolejna odsłona programu, w którym wybitny brytyjski architekt odwiedza nadmorskie posiadłości - tym razem znajdujące się u wybrzeży Morza Śródziemnego. Charlie spotyka właścicieli wyjątkowych posiadłości, odkrywając sekrety ich budowy, historię oraz inspiracje, które kryją się za ich stworzeniem. Prowadzący przenosi widzów do świata marzeń o idealnym nadmorskim życiu - odwiedza m.in. Costa Brava, Cote d'Azur, Majorkę i Kretę.
  ageRating: 12
  genre:
  - '35'
- eventId: 1244936
  start: 2026-10-03T08:00:00Z
  stop: 2026-10-03T09:00:00Z
  title: Pokochaj lub sprzedaj - Finlandia 1 (odc. 5)
  subtitle: Rodziny muszą zdecydować, czy remontować stary dom, czy kupić nowy. Architekt i agent nieruchomości rywalizują, przedstawiając im swoje wizje, co prowadzi do emocjonującej decyzji.
  description: |-
    Tytuł oryginalny: Remppa vai muutto Suomi
    FI, 2021
    Fińskie rodziny stają przed trudnym wyborem - odnowić dotychczasowy dom czy przeprowadzić się do nowego. Projektant wnętrz i agent nieruchomości rywalizują, by przekonać uczestników do swojej wizji idealnego miejsca do życia. Emocje narastają, gdy nadchodzi chwila ostatecznej decyzji.
  ageRating: 12
  genre:
  - '49'
- eventId: 1233210
  start: 2026-10-03T12:00:00Z
  stop: 2026-10-03T13:00:00Z
  title: Pokochaj lub sprzedaj - Vancouver 4 (odc. 9)
  subtitle: Uczestnicy programu są niezadowoleni z domów, w których mieszkają. Z pomocą specjalistów od remontów i wystroju wnętrz mają szansę odmienić swój dom tak, by odpowiadał ich preferencjom.
  description: |-
    Tytuł oryginalny: Love It or List It Vancouver
    CA, 2016
    Reżyseria: Theone Masoner
    Występują: Jillian Harris, Todd Talbot, Kenny Gemmill
    Uczestnicy tego programu nie są zadowoleni ze swoich dotychczasowych domów. Dostają jednak szansę na niepowtarzalną zmianę. Mogą - z pomocą specjalistów od remontów i wystroju wnętrz - odmienić swój dom nie do poznania. Jeśli w dalszym ciągu nie będzie on spełniał ich wymagań, będą mogli go zamieć na coś bardziej odpowiadającego ich preferencjom.
