  title: So schmeckt die Welt - Dominikanische Republik
  subtitle: So schmeckt die Welt - Dominikanische Republik
  description: Eine kulinarische und kulturelle Expedition durch die Dominikanische Republik. Dieser Film ist karibisches Feeling pur. Vom Rum über den Karneval bis hin zum Merengue. Wer den Rhythmus der Karibik spüren möchte schaut diese Dokumentation an. Sinnlich, temperamentvoll einfühlsam und natürlich auch schmackhaft. Wir entdecken die Menschen und ihre Geschichten und damit auch ihre Seelen.
  genre:
  - '129'
  widescreen: true
- eventId: 1255766
  start: 2026-10-03T19:40:00Z
  stop: 2026-10-03T20:35:00Z
  title: So schmeckt die Welt - Franken
  subtitle: So schmeckt die Welt - Franken
  description: Franken ist mehr als Wein, Wurst und Bier. Aber das sind schon mal die wichtigsten Dinge im Leben eines Franken und das macht er auch besonders gut. Der fränkische Wein zählt zu den Besten weltweit, Franken hat die höchste Brauereidichte und wer einmal in eine Fränkische Wurst gebissen hat beißt keine Andere mehr an. Diese 45 Min. Dokumentation zeigt die Menschen hinter den Produkten und erklärt auch warum es in Franken einfach gemütlicher ist als anderswo.
  genre:
  - '129'
  widescreen: true
