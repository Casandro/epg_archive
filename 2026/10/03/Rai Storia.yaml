  title: Passato e presente Otello Sarzi. Buratti
  subtitle: Passato e presente Otello Sarzi. Burattini ribelli - Artista ribelle e visionario, figlio di una dinastia di teatranti girovaghi, Otello Sarzi cresce tra burattini e palchi improvvisati. Gli ideali antifas
  description: |-
    cisti lo portano a imbracciare le armi nella Resistenza, accanto a Dante Castellucci ''Facio'' e ai fratelli Cervi. Dopo la guerra non abbandona la passione civile: nel 1957 fonda a Roma il Teatro Sperimentale dei Burattini e delle Marionette, portando sul palco Brecht, Beckett, Kafka e Majakovskij. Con lui, il teatro di figura smette di essere ''minore'' e diventa linguaggio poetico, politico e universale. Negli anni Sessanta arriva la televisione: le sue creature di gommapiuma e lattice conquistano il piccolo schermo, aprendo la strada alla prima TV per ragazzi. Un percorso che si intreccia idealmente con il pensiero di Gianni Rodari, con cui Sarzi condivide la convinzione profonda che l'immaginazione sia, prima di tutto, una forma di libertà e di resistenza. In studio con Paolo Mieli, il professor David Bidussa. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

    Ospite in studio il prof. David Bidussa Con la partecipazione di Samuel Boscarello Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
