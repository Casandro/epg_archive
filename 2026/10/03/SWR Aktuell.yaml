- eventId: 769356
  start: 2026-10-03T04:00:00Z
  stop: 2026-10-03T07:00:00Z
  title: SWR Aktuell am Morgen
  description: "6:00\npunktEU: \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/ \n\n6:35\nZeitkapsel  - Folge 1 \nAuferstanden aus Ruinen\nAls die DDR gegründet wird, ist Achim zehn Jahre alt. Je älter er wird, desto mehr bekommt er die Ungerechtigkeit des Regimes zu spüren. Er ist dabei, als sowjetische Soldaten den Aufstand von 17. Juni 1953 brutal niederschlagen. Er muss Mitglied der FDJ sein, um studieren zu dürfen. Er darf nicht die Musik hören, die ihm gefällt. Aber als Berliner hat er immer noch die Chance, Clubs und Konzerte in West-Berlin zu besuchen. Bis sich im Sommer 1961 alles ändert.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/\n\n7:00\nhr-iNFO am Feiertag\n\n7:35\nZeitkapsel  - Folge 2 \nDie Mauer - eingesperrt im eigenen Land\nWas war eigentlich so anders in der DDR - und warum? Das wollen Eva und Josef von Achim wissen. Und inwiefern verschärft der Bau der Berliner Mauer die Situation damals gerade für Jugendliche? Für Achim ist die krasse Abschottung gegen den Westen ein Schock. Er fühlt sich eingesperrt. Eine Party, die für einen Freund im Gefängnis endet, gibt den Ausschlag: Achim will weg.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/\n\n8:00 \nAktuelles & Sport\n\n8:35\nZeitkapsel  - Folge 3 \nFlucht in den Westen\nAchims Entschluss steht fest: Er will in den Westen. Selbst wenn er Freunde, Eltern und seine große Liebe Christa zurücklassen muss. Eine Flucht über die Grenze ist gefährlich, viele Menschen werden bei dem Versuch erschossen oder verhaftet und dann landen für Jahre im Gefängnis. Wie überwindet man eine derartig schwer bewachte Grenze? Im Auto verstecken, einen Pass fälschen? Achim findet einen Weg, aber das Thema \"Flucht\" ist für ihn danach nicht vorbei. Im Gegenteil: Jetzt will er Freunde in den Westen holen - und Christa.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/"
- eventId: 769408
  start: 2026-10-03T07:00:00Z
  stop: 2026-10-03T10:00:00Z
  title: SWR Aktuell am Vormittag
  description: "9:00\nAus dem Leben\nMarianne Koch - Erinnerungen an abenteuerliche 95 Jahre als Schauspielerin und Ärztin\nMut, Zuversicht und Selbstvertrauen zeichnen Marianne Koch bis heute aus. Am 19. August 2026 ist die erfolgreiche Schauspielerin, leidenschaftliche Internistin, gefragte Medizinjournalistin und Bestsellerautorin 95 Jahre geworden. In ihrem Buch \"Mutig sein!\" blickt sie auf ihr abenteuerliches Leben zurück. Ein Leben, das von vielen Zufällen, aber auch von ihrem Wunsch geprägt ist, Ärztin zu werden. 1931 im Süden Münchens geboren, wächst Marianne Koch in der Zeit des Nationalsozialismus und des Zweiten Weltkriegs auf. Keine einfache Zeit.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/ \n\n10:00\nAktuelles & Sport\n\n10:30\nKultur \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/ \n\n11:00\nPlusminus - Gasspeicher - Panikmache oder echte Gefahr - wer profitiert?\n60 Prozent Füllstand, steigende Gaspreise: Wie sicher ist unsere Energieversorgung wirklich - und wer verdient an der Angst vorm Winter? Die Gasspeicher sind ungewöhnlich leer - und die Sorge vor Engpässen und steigenden Preisen wächst. Die Bundeswirtschaftsministerin Katherina Reiche (CDU) fängt an gegenzusteuern. Doch wie groß ist das tatsächliche Risiko für die Gasversorgung im kommenden Winter?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/ \n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
- eventId: 769457
  start: 2026-10-03T10:00:00Z
  stop: 2026-10-03T13:00:00Z
  title: SWR Aktuell am Mittag
  description: "12:00 - 13:30\nFestakt - DEUTSCHE EINHEIT\n\n\n13:30\nZeitkapsel  - Folge 4 \nEin Tunnel unterm Todesstreifen\nEs ist ein waghalsiger Plan: Achim und eine Gruppe junger Männer wollen einen Tunnel unter der Mauer graben. Von West- nach Ost-Berlin. Um zu verstehen, wie schwierig das ist, besuchen Eva und Josef mit Achim den Verein Unterwelten e.V. direkt an der Bernauer Straße. Dort geht es neun Meter unter die Erde. In einem feuchten, kalten, dunklen Keller erklärt Achim den beiden Jugendlichen aus Lohne (Niedersachsen) genau, wie sie damals die Tunnel gebaut haben. Und mit welchen Problemen sie dabei dealen mussten.\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/\n\n14:00\nMAFIA LAND\nGeschäfte mit Alpenblick (1/8)\nBacetto war ein kaltblütiger Krimineller, ein Mann, der der italienischen 'Ndrangheta zugerechnet wird. Er hat sich eine unauffällige Fassade aufgebaut: Als Pizzeria-Betreiber mit dem charmanten Spitznamen, der auch noch mit italienischen Lebensmitteln handelt und ganz bescheiden in einem kleinen Dorf lebt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n14:35\nZeitkapsel  - Folge 5\nDie Tunnelbauer\nWochenlang graben. Nur mit einem Spaten. Meter für Meter von Ost nach West, bis zu zwölf Meter unter der Erde. Dabei immer die Angst, dass die Aktion verraten wird, denn die Stasi hat ihre Augen und Ohren überall. Die Menschen im Osten, die auf ihre Flucht warten, dürfen mit niemanden darüber sprechen, denn schon für den Plan einer Flucht kann man ins Gefängnis kommen. Genau das passiert mit Christa, Achims Freundin, die er so dringend in den Westen holen will. Was jetzt?\nGibt es auch zum Nachhören in ARDSounds:\nhttps://www.ardsounds.de/sendung/zeitkapsel/urn:ard:show:7bfa3eb2144cdb14/"
- eventId: 769526
