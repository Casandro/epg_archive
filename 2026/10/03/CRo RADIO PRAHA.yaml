  title: Host Lenky Vahalové
  description: Hostem Lenky Vahalové bude hudební producent a kytarista Lukáš Chromek. Spolupracoval s Karlem Gottem, Richardem Krajčem i mladší generací hudebníků, jako jsou Thom Artway nebo Sofian MedjMedj. Jako hlavní kytarista působí také v kapele Ewy Farne. Co ho přitahuje na filmové hudbě? Jak pozná skutečný talent? A proč se rozhodl zůstat v Česku, přestože dostal několik nabídek ke spolupráci ze Spojených států? Moderuje Lenka Vahalová
