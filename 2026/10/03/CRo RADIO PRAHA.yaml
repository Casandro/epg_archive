  title: Host Lenky Vahalové
  description: Hostem Lenky Vahalové bude hudební producent a kytarista Lukáš Chromek. Spolupracoval s Karlem Gottem, Richardem Krajčem i mladší generací hudebníků, jako jsou Thom Artway nebo Sofian MedjMedj. Jako hlavní kytarista působí také v kapele Ewy Farne. Co ho přitahuje na filmové hudbě? Jak pozná skutečný talent? A proč se rozhodl zůstat v Česku, přestože dostal několik nabídek ke spolupráci ze Spojených států? Moderuje Lenka Vahalová
- eventId: 1404117
  start: 2026-10-03T22:00:00Z
  stop: 2026-10-03T23:00:00Z
  title: Kriminálka
  description: 'Vila k mání - Na pražskou policii je hlášeno pohřešování dvou osob. Jedná se o muže a ženu, kteří zmizeli beze stopy i se služebním vozem. Zanedlouho vozidlo nalezne policie v Maďarsku. Česká policie při pátrání zjišťuje, že vila, ve které dvojice bydlí, a která patří hledané ženě, je na prodej. Prodává ji člověk, který ji prý od ženy zakoupil těsně před jejím zmizením. Kam se druh s družkou poděli? A má muž, který vilu prodává s jejich zmizením něco společného? Složitý případ, na kterém spolupracovali pražští detektivové s kolegy z jihlavské kriminálky. Autor, dramaturgie: Dana a Mirek Vaňurovi'
