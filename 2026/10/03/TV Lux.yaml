  description: 'V chladnej noci roku 2007 dostal oddaný otec štyroch detí a sedemnásťročný opitý vodič doživotný trest. V jednej násilnej, ničivej chvíli čelili obaja úplne odlišnej budúcnosti. Keď však Chris Williams sedel v rozbitom aute a uvedomil si, že jeho manželka, nenarodené dieťa, deväťročná dcéra a jedenásťročný syn práve zahynuli, rozhodol sa urobiť niečo mimoriadne: odpustiť. Príbeh Chrisa Williamsa je filmovým rozprávaním o tom, ako niekto dokáže odpustiť napriek túžbe po pomste, ktorá sa vynára v temných zákutiach ľudského srdca - ukazuje svetu, že nádej, láska a odpustenie môžu prekonať všetko, keď to necháte tak. Réžia: Patrick Henry Parker. Účinkujú: Brenda Vaccaro (Nadine Williams), Henry Ian Cusick (Chris Williams), Sam Sorbo (District Attorney), Richard Sharrah (Daniel Kaff), Paris Warner (Teenage Girl) (2022)'
