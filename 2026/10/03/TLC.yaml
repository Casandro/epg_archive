  title: Deal Makers - Alles hat seinen Preis
  subtitle: Ein Kudu fürs Büro?
  description: |-
    Zwischen versteinerter Frucht, exotischer Tier-Trophäe und luxuriösen Rolex-Uhren stehen die Pfandhändler diesmal vor echten Rätseln. In Kent sorgt ein angeblich uralter fossilisierter Apfel für große Hoffnungen - doch sein Wert bleibt ein Rätsel. Gleichzeitig versucht ein ehemaliger Seemann, einen riesigen Kudu-Kopf aus Afrika zu Geld zu machen, während ein Technikfan seine wertvolle Uhrensammlung verkaufen will, um sich endlich den Traumwagen leisten zu können. Und in Sheffield muss Dan entscheiden, ob ungewöhnliche Kunstwerke wirklich ein Vermögen wert sind - oder eher Ladenhüter der Zukunft.
    GBR 2015
