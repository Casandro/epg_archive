  title: Mystery Diners - Undercover im Lokal
  subtitle: Wein zum Weinen
  description: |-
    In Scotts Restaurant in Las Vegas bekommen die Gäste täglich frischen Fisch sowie Schalentiere - und sind hochzufrieden. Scotts Problem betrifft den Weinverkauf: Seit Wochen erzielt er nicht mehr den üblichen Umsatz, weil deutlich weniger ausgeschenkt wird. Für ihn ist das existenzgefährdend, doch was ist der Grund? In Verdacht steht der französische Sommelier Faz, der seit einem Jahr im Restaurant arbeitet. Als er dort anfing, lag der Umsatz pro Monat bei rund 20.000 Dollar, nun ist er auf 10.000 gesunken. Macht ausgerechnet der Sommelier den Weinumsatz zunichte? "Mystery Diners" ermittelt.
    USA 2012
