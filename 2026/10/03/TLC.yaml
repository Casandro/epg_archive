  title: Unheimliche Videos - Wahrheit oder Fake?
  subtitle: Der Körperfresser
  description: |-
    Im Frühjahr 2018 kommt es in Knoxville, Tennessee, zu einer Tragödie: Ein Mann wird von einem Mitbewohner erstochen und ausgeraubt. Direkt nach der Tat berichten die anderen Leute, die in dem Haus leben, eine geheimnisvolle Präsenz zu spüren. Sie sind so verängstigt, dass sie sofort packen und ausziehen wollen. Ein Team paranormaler Ermittler:innen soll der Sache nun auf den Grund gehen und mit dem Geist des Ermordeten Kontakt aufnehmen. Außerdem: In den Everglades wird ein affenähnliches Fabelwesen gefilmt, ein UFO wird über Las Vegas gesichtet, und eine schaurige Gestalt, die auf die Jagd geht.
