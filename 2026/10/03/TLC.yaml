  title: Deal Makers - Alles hat seinen Preis
  subtitle: Ritterrüstung und Cocktailuhr
  description: |-
    Zwischen Luxus, Nostalgie und verrückten Fundstücken wird hart verhandelt. In Sheffield bringen seltene Designer-Schuhe aus Alligatorleder selbst erfahrene Händler ins Schwitzen - ihr Wert könnte bei 10.000 Pfund liegen. Gleichzeitig versucht ein Mann, seine lebensgroße Ritterrüstung zu verkaufen, sehr zur Freude seiner Familie und Haustiere. Außerdem sorgt eine angeblich von Cheryl Cole getragene Designerhandtasche für Diskussionen, während ein signierter Boxhandschuh mit Muhammad-Ali-Autogramm große Hoffnungen auf einen Familienurlaub weckt. Und wie immer gilt: Nicht jeder Schatz wird auch zum Deal.
    GBR 2015
  widescreen: true
