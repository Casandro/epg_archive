  title: Unheimliche Videos - Wahrheit oder Fake?
  subtitle: Ein Geist auf vier Pfoten
  description: |-
    In einigen Kulturen bedeutet der Tod nahestehender Menschen nicht, dass man sie zum letzten Mal gesehen hat. Eine Frau von den Philippinen will diese Erfahrung gemacht haben, denn auf einem Selfie-Video ihres Sohnes soll der Geist ihrer verstorbenen Mutter zu sehen sein: Immer wieder erscheint ihr Gesicht im Bild, obwohl sie im Jahr zuvor verstarb. Und ihr Enkel ist offensichtlich nicht erstaunt darüber. Außerdem: Vierbeiniger Besuch aus dem Jenseits, eine Überwachungskamera, die ein legendäres Fabelwesen in den Bergen filmt, und ein verstorbener Mann, der plötzlich auf einer Straße erscheint.
    USA 2020
