  title: Deal Makers - Alles hat seinen Preis
  subtitle: Goldgrube oder Gartenzwerg?
  description: |-
    In Sheffield bringt eine Familienmutter ihr spektakuläres Formel-1-Trike vorbei, um Rechnungen zu bezahlen und ihrem Sohn das langersehnte Baumhaus zu ermöglichen. Gleichzeitig sorgt in London eine rätselhafte Buddha-Statue für Aufsehen, die laut Besitzer über 1500 Jahre alt ist. Das Erbstück stammt angeblich aus dem frühen chinesischen Kaiserreich und wird mit Skulpturen der Sui-Dynastie verglichen. Experten halten die Figur für authentisch - doch ohne Herkunftsnachweis wird der Millionen-Deal zur Zitterpartie. Und eine Reiterin hofft, mit einem seltenen Diamantring genug Geld für ihr Traum-Pferd aufzutreiben.
    GBR 2015
  widescreen: true
