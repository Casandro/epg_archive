  title: Mein wunderbarer Kochsalon - Gegrillte Hirschsteaks mit Chilikürbis und Dijonrahm
  subtitle: Mein wunderbarer Kochsalon - Gegrillte Hirschsteaks mit Chilikürbis und Dijonrahm
  description: 'Kotelett, Cevapcici und Würstel gehören zum Grill wie die Glut zur Kohle. Bei mir landen mittlerweile auch ganze andere Sachen am Rost - von gefüllten Tomaten und Foccaccia über Chilikürbis bis zum Hirschfilet. Wild ist für mich sowieso immer eine Belohnung, aber dieses Filet vom Grill mit Dry Rub ist laut Familienrat das absolute Grillhighlight des bisherigen Sommers gewesen. Außerdem: Diese ganz spezielle Art des Garens verdient mehr als das Standardprogramm und ich finde es auch aufräumtechnisch sehr entgegenkommend - am liebsten grille ich alles auf einmal und die Küche bleibt sauber. Wo mich früher noch das mühsame Abkratzen des verkrusteten Rosts davon abgehalten hat, den Grill wieder anzuwerfen, bin ich heute dankbar für die Erkenntnis der Pyrolyse. Sie lebe hoch! Hoch! Hoch!  AT 2020'
