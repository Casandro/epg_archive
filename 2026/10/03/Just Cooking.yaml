  title: Mein wunderbarer Kochsalon - Orecchiette alla puttanesca presto
  subtitle: Mein wunderbarer Kochsalon - Orecchiette alla puttanesca presto
  description: Paradeiser, Oliven, Sardellen, Knoblauch, dazu ein ordentlicher Schuss Olivenöl - all das warf die italienische "puta", nicht ganz wörtlich übersetzt "Liebesdienerin", nach einer anstrengenden Arbeitsnacht in die Pfanne, um wieder zu Kräften zu kommen. Die klassische Puttanesca braucht keine exotischen Zutaten, nur ein bisschen Zeit. Ich liebe diese kräftigen Aromen und habe eine schnelle Version daraus gemacht.  AT 2020
- eventId: 1371164
  start: 2026-10-03T03:15:00Z
  stop: 2026-10-03T03:20:00Z
  title: Mein wunderbarer Kochsalon - French 75 Cocktail
  subtitle: Mein wunderbarer Kochsalon - French 75 Cocktail
  description: Ich bewege mich in Sachen Cocktails auf einem sehr kleinen Terrain, abgesehen von Gin Tonic und Veneziano habe ich es noch nicht weit gebracht. Zum Glück gibt es David Penker (26°East Bar/Hotel Kempinski in Wien), er war schon öfter im Kochsalon zu Gast und bringt mir die Mixology-Basics bei. Diesmal durften wir uns nicht persönlich treffen, dafür habe ich ein Online-Tutorial bekommen. Er fragte mich, was ich zu Hause habe (viel mehr als Orangenmarmelade, Eis, Gin und Champagner war nicht zu holen) und daraus entstand ein wunderbar sommerlicher Drink.  AT 2020
- eventId: 1371165
  start: 2026-10-03T03:20:00Z
  stop: 2026-10-03T03:30:00Z
  title: Mein wunderbarer Kochsalon - Frische Tagliatelle al limone
  subtitle: Mein wunderbarer Kochsalon - Frische Tagliatelle al limone
  description: 'Pasta an sich ist schon etwas Wunderbares, es gibt nur eine Steigerung: selbst gemacht und frisch. Ersteres, weil mich ein wirklich gutes Gefühl beschleicht, wenn ich ein Gericht von Anfang bis Ende selbst produziere und nicht bloß eine Packung aufreiße. Und zweitens, weil die Sauce nie besser haftet als an frischer Pasta. Nachdem ich mich schon bei den frischen Nudeln verausgabt habe, gibt es eine der einfachsten Saucen aus meinem Repertoire: al Limone, zu Recht ein Klassiker. AT 2020'
- eventId: 1371166
  start: 2026-10-03T03:30:00Z
  stop: 2026-10-03T03:38:00Z
  title: Mein wunderbarer Kochsalon - Nudelauflauf mit Spinat und Lauch
  subtitle: Mein wunderbarer Kochsalon - Nudelauflauf mit Spinat und Lauch
  description: Zu weich gekochte Nudeln sind für mich unessbar, das ist wie ein mehliger Apfel. Schlucksperre. Daher habe ich mich in der Vergangenheit auch immer gegen Nudelaufläufe gewehrt, weil ich den Garpunkt aufs Spiel setze. Nun hat es die Situation so gewollt, dass ich ein Mittagessen vorbereiten musste, das die Kinder selbstständig finalisieren, weil ich einen Termin hatte und nicht zu Hause war. Dank Louis musste es natürlich Pasta sein. Die Fähigkeiten des Finalisierens waren eher eingeschränkt, wie wir sehr bald feststellten ("Also, wie meinst du das jetzt... Nudelwasser erst salzen, wenn es kocht...???"), also überlegte ich mir ein Gericht, das ich fix und fertig machen kann und das die Kinder einfach aus dem Ofen nehmen. Soviel Finalisieren muss möglich sein. War es auch und die Nudeln waren noch immer al dente. AT 2020
