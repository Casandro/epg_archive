  description: Wenn mich meine Mutter früher nicht finden konnte, hockte ich meistens ganz oben im Kirschbaum und klaubte so viele von den Ästen direkt in den Mund, bis mir der Bauch weh tat. Nachdem ich hier im dritten Wiener Bezirk keinen Kirschbaum zur Verfügung habe, in dem ich mich verstecken könnte, grabe ich mich hin und wieder in diesem Kuchen ein - so saftig, so süß, so flaumig, man kann nicht anders. AT 2017
