    Amor führt den Straßenmusikanten Otto mit der jungen Tina zusammen und entfacht ein Feuerwerk turbulenter Verwicklungen. Alles ist furchtbar, und es kommt immer noch schlimmer - denn es handelt sich zwar um eine Liebesgeschichte, aber eben mit Otto.
