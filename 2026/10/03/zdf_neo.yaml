  description: |-
    Deutschland 1968
    Bei der Beerdigung von Sir Oliver Ramsey dröhnt aus seinem Sarg ein unheimliches Lachen. Die Journalistin Peggy Ward veröffentlicht daraufhin einen Artikel über die "lachende Leiche".

    Ihre Nachforschungen bringen sie in Gefahr. Der Anwalt der Familie Ramsey wird von einem Mörder im Leichenkostüm getötet. Cedric, Bruder des Opfers, glaubt fest, dass Sir Oliver noch am Leben und für den Mord verantwortlich ist. Inspector Higgins ermittelt.
