  description: |-
    Deutschland 1963
    Nachdem der alte Lord Lebanon mit einem indischen Tuch erwürgt wurde, versammelt sich die Erbengemeinde in seinem Schloss. Ungeduldig warten sie auf die Testamentseröffnung.

    Doch der Verblichene hat eine Bedingung: Die untereinander verfeindete Familie soll sechs Tage und Nächte gemeinsam im Schloss verbringen - dann wird das Testament verlesen. Zu aller Entsetzen bringen die Tage nicht nur Streit, sondern auch den Tod mit sich.
