  description: |-
    Deutschland 1961
    Eine Mordserie erschüttert London. Opfer sind ausnahmslos schwerreiche, ältere Ausländer. Scotland Yard nimmt die Ermittlungen auf. Schon bald ist Inspektor Holt einer Bande auf der Spur.

    Die Mordopfer waren bei derselben Versicherung mit horrenden Summen versichert. Als bei einem Toten zwei Pergamentstreifen mit Blindenschrift entdeckt werden, führt die Spur zu einer Bande blinder Hausierer, den "toten Augen von London".
