  description: |-
    Deutschland / Dänemark 1959
    "Der Frosch mit der Maske" ist der Anführer einer riesigen Verbrecherorganisation. Durch aufsehenerregende Coups terrorisiert die Gruppe ganz London und macht fast täglich Schlagzeilen.

    Alle Versuche Scotland Yards, Agenten in die Froschbande einzuschleusen, enden meist tödlich. Ein Spion in den eigenen Reihen wird vermutet. Aber Inspektor Elk und Amateurdetektiv Richard Gordon sind dem "Frosch" auf der Spur.
