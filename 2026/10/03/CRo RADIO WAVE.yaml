  title: Psycho
  description: Kdysi jedovatá zeleň na tapetách, dnes nekonečné scrollování. Karolína s Pavlem v novém Psychu hledají souvislosti mezi příběhy arzenových barev, tabákového průmyslu a sociálních sítí. Jak firmy reagují na varování odborníků? A proč se řešení často hledá hlavně u zákazníků? Poslechněte si, co nás staré kauzy mohou naučit o dnešních platformách. (repríza)
