  title: Impakt
  description: IQ Magazine ji letos zařadil do výběru New Bosses, kam pravidelně vybírá nejtalentovanější mladé osobnosti mezinárodního koncertního a festivalového průmyslu. I tak ale hudební produkční Andrea Blahová mluví o finanční nejistotě a potřebě kombinovat několik prací. "V tom seznamu jsem jediná, co má dvě práce. To dobře ilustruje rozdíl mezi mezinárodní a lokální scénou," říká. Co pro ni ocenění znamená? Jak vypadá práce v zákulisí zdánlivě nablýskaného festivalového světa? A jak se dnes daří českým a slovenským festivalům? Poslechněte si nový Impakt na Radiu Wave. (repríza)
- eventId:
  - 1404760
  - 1406538
  start: 2026-10-03T13:00:00Z
  stop: 2026-10-03T14:00:00Z
  title: Startér
  description: Finalisté Startéru 2023/2024 a vítězové letošního ročníku exportní soutěže Radia Wave Czeching zavítají za námi do studia, aby pohovořili o jimi vydlážděné cestě pro kohokoliv dalšího, kdo se snaží uspět s kytarovou hudbou nejen u nás, ale i za hranicemi. Plzenští Ida The Young mají venku čerstvý singl Dragon Head, chystají nové album, koncertují ostošest a hlavně se z nich stále nevytrácí hluboká láska k hudbě a společnému hraní. Jaký mají recept na pěstování společné chemie? Co se změnilo po veškerém uznání v souvislosti s předchozí deskou? A jak obrážet Evropu a nezbláznit se z toho? Laďte rozhovorový speciál Startéru. (repríza)
