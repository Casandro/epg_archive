  title: Pot
  description: Pot je podcast o lásce, sexu a intimitě, o motýlech v břiše, požáru v srdci a všem, co z nás teče. Rozebíráme témata vztahů, emocí a tužeb s lidmi různých sexualit, genderů, profesí a preferencí. Zapáleně, citlivě, na rovinu. O své zkušenosti a pohledy se v Potu kromě moderátorů Elišky Soukupové a Karla Vladyky podělí odborníci z řad psychologů, sociologů, sex workers, osobností veřejného života i náhodných kolemjdoucích. Příběhy, u nichž se vám orosí čelo, má totiž k vyprávění řada z nás. Poslouchejte každou sobotu od dvaadvaceti hodin.
