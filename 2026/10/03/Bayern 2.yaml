  title: Bayern 2 Songs und Stories
  subtitle: Clubkultur weltweit
  description: "Clubkultur weltweit: Die Rückkehr der Traditionen in die elektronische Musik \n\nAn den verschiedensten Ecken der Erde ergründen wir ein faszinierendes Phänomen: Auf der Suche nach Bedeutung greifen DJs und Produzenten von Clubmusik zunehmend auf folkloristische und Jahrhunderte alte Musiktraditionen zurück. Genres wie Neoperreo und Amapiano wurzeln tief in lokalen und traditionellen Klängen. \nMit Bad Bunny, Nicola Cruz, Mindy Meng Wang, Amaru Tribe, DJ Maphorisa und anderen\n\nModeration: Christoph Lindemann\n\nZum ARD Schwerpunkt Welcome to the Club - wir feiern Clubkultur.\nwww.ardmediathek.de/clubkultur"
