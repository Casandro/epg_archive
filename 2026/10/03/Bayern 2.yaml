  title: Bayern 2 Hörspiel
  subtitle: '"Schweres Geschütz" von Liza Cody'
  description: "Eva Wylie ist Catcherin im Schwergewicht und nicht auf den Mund gefallen. Ihr Job als Nachtwächterin auf dem Autofriedhof und ihre Botengänge für den durchtriebenen Mr. Cheng sind nicht gerade einfach. In richtige Schwierigkeiten gerät sie aber erst, als sie, ohne es zu wissen, eine hochexplosive Sendung überbringt. Was sie auch nicht weiß: Dass sie da in einen Bandenkrieg geraten ist, in dem es um Schutzgelder und Erpressung geht. Plötzlich findet sie sich auf zwei Abschusslisten wieder. Und das, als ihr der Kampf ihres Lebens bevorsteht.  \n\nVon Liza Cody\nMit Sascha Icks, Frauke Poolman, Jan Gregor Kremp, Veronika von Quast, Ingeborg Schöner, Jochen Striebeck, Roland Bayer, Eva Rieck, Bo Hu, Peter Pius Irl, Lars Weelings, Bernd Dechamps, Helene Grass, Jan Knebel, Christian Baus, Artemis Chalkidou, Detlef Kügow, Peter Weiß, Michael Skasa, Holger Buck und Roman Dudler\nRegie: Irene Schuck\nBR 1996 \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
