- eventId: 769679
  start: 2026-10-03T22:03:00Z
  stop: 2026-10-04T04:00:00Z
  title: ARD Jazz. Die Nacht
  subtitle: Legendärer Rundfunkworkshop - 60 Jahre SWR NEWJazz Meeting
  description: "Teil 1:\nWie alles begann - 60 SWR NEWJazz Meeting\nAls Joachim Ernst Berendt 1966 das Free Jazz Meeting Baden-Baden gründet, konnte niemand ahnen, dass der Jazzrundfunkworkshop so eine Erfolgsgeschichte wird - Albert Mangelsdorff, Manfred Schoof, Jeanne Lee, Don Cherry gehörten zu den ersten Gästen\nplaylist, Teil 1\nBarney Wilen, Eilert Ove \"Eje\" Thelin, Karl Berger, Palle Danielsson, Jaki Liebezeit: Abracadabra I (Barney Wilen)\nAlbert Mangelsdorff, Bent Jaedig, Rolf Kühn, Joachim Kühn, J. F. Jenny-Clarke, Aldo Romano: I love you (Cole Porter)\nJeanne Lee, Don Cherry, Gunter Hampel, Evan Parker, Peter Kowald, Barre Phillips, Sven-Ake Johansson, John Stevens: Namu-Amida-Butsu (Jeanne Lee)\nAlbert Mangesldorff, Marion Brown, Barre Phillips, Sven-Ake Johannson: Open spaces (Albert Mangelsdorff)\nNew (Free) Jazz Meeting Orchestra 1969: Babudah (Steve McCall)\nKarin Krog: For my tow J. B.'s (Karin Krog)\nKarin Krog-Norma Winstone Quartet: Woman's Liberation (Karin Krog, Norma Winstone)\nBaden-Baden Free Jazz Orchestra: The serpent's kindly eye (Chris McGregor)\nWolfgang Dauner, Jasper van't Hof, Dave McRae: Triolectric (Wolfgang Dauner, Jasper van't Hof, Dave McRae)\nToto Blanke, Philip Catherine: Ballad for B.B. (Toto Blanke)\nGlobe Unity Orchestra: Ruby my dear (Thelonious Monk)\nNew Jazz Meeting Orchestra 1976: Song sung long (Carla Bley)\nKarin Krog, Attila Zoller: What's new? (Bob Haggard, Johnny Burke)\nNew Jazz Meeting Orchestra 1978: Ba-Ba (Kenny Wheeler)\n\nTeil 2\nAnd so on ... 60 SWR NEWJazz Meeting\nDer Rundfunkworkshop heißt jetzt nicht mehr Free Jazz sondern New Jazz Meeting - und hat auch in den Achtzigern prominente Gäste wie u.a. Bobby McFerrin, Carla Bley und Babara Thompson.\nplaylist, Teil 2\nPerry Robinson, Gianluigi Trovesi, Ernst-Ludwig Petrowsky, Bernd Konrad, John Carter: Call and response for 6 Clarinets (Theo Jörgensmann)\nClarinet Summit Ensemble: Carnival (Didier Lockwood)\nAbdud Wadud Sextet: Sagira (Abdul Wadud) \nNew Jazz Meeting Orchestra '81: My favorite things (Richard Rodgers)\nSaxophone-Group des New Jazz Meetings '81: Last train to Baden-Baden (Alan Skidmore, Tomasz Szukalski, Roman Schwaller, Gerd Dudek, Leszek Zadlo, Rashied Ali)\nVocal Summit: Straight - no chaser (Thelonious Monk)\nNew Jazz Meeting Vocal Quintet '82: Yang Yang (Jay Clayton)\nPercussion Summit: Warm-up for inner feelings (Doug Hammond)\nPercussion Summit: The Spear of the Nation (Mbizo Johnny Dyani)\nWorld Music Meeting Ensemble: Again and again, again (Collin Walcott, Karl Berger)\nWorld Music Meeting Ensemble: Naomi (Juan José Mosalini)\nCarla Bley, Steve Swallow: Romantic notions Nr. 3 (Carla Bley)\nNew Jazz Meeting Ensemble 1988: Celebration (Barbara Thompson)\nThe Big Tenor Meeting Trio: Secret Agent (Barbara Dennerlein)\n\nTeil 3\nFar horizon ... 60 SWR NEWJazz Meeting\nVon den Neunziger Jahren bis heute - zeigt sich der Rundfunkworkshop künstlerisch vielgestaltig, bleibt aber seinem Motto \"Neues wagen!\" treu - u.a. mit Sylvie Courvoisier, George Lewis und Melissa Aldana\nplaylist, Teil 3\nNew Jazz Meeting '93 Quintet: Traum (Marco Ambrosio)\nLinda Sharrock Septet: Far horizon (Linda Sharrock)\nSylvie Courvoisier, Joachim Kühn: Body (Sylvie Courvoisier, Joachim Kühn)\nAnnie Whitehead-Ed Thigpen Duo: Hallo Max (Annie Whitehead, Ed Thigpen)\nNew Jazz Meeting 2001 Septet: Um a Zero (Pixinguinha)\nSteve Lacy Trio: Differenz/Wiederholung remix 7.4 (Bernhard Lang)\nNew Jazz Meeting 2004 Oktett: Oktett Basel 1, aus: Sequel (George Lewis)\nFranz Hautzing"
