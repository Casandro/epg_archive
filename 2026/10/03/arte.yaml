  title: Die schwarzen Schmetterlinge (5/6)
  subtitle: Serie Frankreich 2021
  ageRating: 16
  subtitled: true
  genre:
  - '16'
  description: "Endlich erfährt Adrien, was Nastya und Albert verbindet. Sie ist die kleine Tochter von Solanges Vater, den Albert erstochen hat. Adrien ist außer sich deswegen und konfrontiert den alten Mann. Als der kranke Albert sich Insulin spritzt, erfährt Adrien, dass Albert am selben Typ vererbbarer Diabetes leidet wie er. Albert ist Adriens biologischer Vater. Blind vor Wut erstickt Adrien ihn. Was wird nun aus Kommissar Carrel in Alberts Keller? \nEin Jahr später lebt Adrien nach Fertigstellung des Romans mit Nora und ihrem gemeinsamen Baby auf Korsika. Als er beruflich nach Paris muss und auf seine Mutter trifft, stellt er sie zur Rede."
