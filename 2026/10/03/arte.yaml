  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Kap Verde, Insel Santiago
  genre:
  - '144'
  description: Mit dem Katamaran "Nomade des Mers" und seiner Crew macht sich der junge Ingenieur Corentin de Chatelperron zu einer Weltreise von Concarneau über Indonesien bis nach Südamerika auf, um autarke Lowtech-Lebensweisen zu erforschen. Lowtech ist Technik, die man überall günstig selbst bauen und reparieren kann. Während seiner Reise trifft er auf geniale lokale Erfinder praktischer und nachhaltiger Innovationen. Eine abenteuerliche Weltreise, die zum ökologischen Umdenken anregen soll.
- eventId: 826828
  start: 2026-10-03T00:45:00Z
