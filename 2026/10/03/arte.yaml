  description: Die finanzielle Lage der Götterwelt ist alles andere als rosig. Hybris - die Nymphe der Maßlosigkeit und der Arroganz - und König Midas - der alles, was er anfasst, in Gold verwandelt - bereiten daher den Börsengang des Olymps vor. Doch die Götter sind alles andere als einverstanden mit deren massiven Reformvorschlägen.
