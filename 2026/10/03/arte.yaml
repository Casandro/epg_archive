- eventId: 826922
  start: 2026-10-03T03:10:00Z
  stop: 2026-10-03T03:55:00Z
  title: Phänomenale Natur
  subtitle: Yakushima - Insel des mystischen Waldes
  subtitled: true
  description: 'Vor 15 Millionen Jahren entstand die japanische Insel Yakushima im Ostchinesischen Meer durch vulkanische Aktivität. Ihre Abgelegenheit und das Fehlen großer Raubtiere schufen ein einzigartiges Ökosystem: Hier leben endemische Unterarten japanischer Makaken und Sikahirsche, die Hochlagen sind von uralten japanischen Zedern geprägt. Heute steht der Schutz des Naturjuwels im Fokus.'
- eventId: 826923
  start: 2026-10-03T03:55:00Z
  stop: 2026-10-03T04:25:00Z
  title: Weht bald ein anderer Wind?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: 'Bisher war der Wind das Stiefkind der Klimaforschung: zu schwierig zu messen, zu wechselhaft, zu wenige Daten aus der ferneren Vergangenheit. Aber in den letzten Jahren rückt er zunehmend in den Fokus, wenn es um unsere Zukunft im sich verändernden Klima geht.'
- eventId: 826924
  start: 2026-10-03T04:25:00Z
  stop: 2026-10-03T05:10:00Z
  title: Belgien - Krabbenfischen mit Pferden
  subtitle: Deutschland 2023
  subtitled: true
  genre:
  - '112'
  description: |-
    Am weiten Strand von Oostduinkerke an der belgischen Nordseeküste hat sich eine über 500-Jahre alte Tradition bewahrt. Im Herbst ziehen hier die Pferdefischerinnen und Pferdefischer mit ihren Brabanter Kaltblütern in die eiskalte Nordsee zum Krabbenfischen. Ihr Handwerk wurde 2013 von der UNESCO zum immateriellen Kulturerbe der Menschheit anerkannt.
    Die Dokumentation erzählt die Geschichten von einigen der noch heute aktiven Pferdefischer: von der jungen Mutter Katrien Terryn, dem alten Seemann Marius Dugardein, von Stefaan Hancke, der sein Pferd vom Schlachthof gerettet hat.
- eventId: 826925
  start: 2026-10-03T05:10:00Z
  stop: 2026-10-03T06:05:00Z
  title: Der Fliegenpilz
  subtitle: Zwischen Mythos und Wissenschaft
  subtitled: true
  description: 'Glücksbringer, Giftpilz, Mythos: Um kaum einen Pilz ranken sich so viele Geschichten wie um den Fliegenpilz. Die Dokumentation verbindet diese mit Wissenschaft und aktueller Forschung zu einer faszinierenden Reise durch die Welt des Amanita muscaria, so sein lateinischer Name. Dabei geht sie auch der Frage nach, warum seine berauschende Wirkung heute wieder großes Interesse weckt.'
- eventId: 827003
  start: 2026-10-03T06:05:00Z
  stop: 2026-10-03T06:30:00Z
  title: Sind Parteien an allem schuld?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: 'Vertrauensverlust, Liebäugeln mit einer anderen, Trennungsgedanken. Die Beziehung zwischen uns und den Parteien steckt in einer Krise. Und das ist alles andere als trivial. Denn diese Krise hat enorme Auswirkungen: Sie gefährdet unsere liberale Demokratie. Wer ist schuld daran? Die Parteien? Oder am Ende doch wir selbst?'
- eventId: 827004
  start: 2026-10-03T06:30:00Z
  stop: 2026-10-03T07:25:00Z
  title: 360° Reportage
  subtitle: Kuba - Die Stunde der Boxerinnen
  subtitled: true
  genre:
  - '64'
  description: Lange Zeit war Frauenboxen auf Kuba verboten. Und das, obwohl der Faustkampf traditionell zu den erfolgreichsten Sportarten auf der Karibikinsel gehört. Weibliche Gesichter wären zu schön, um sie mit Schlägen zu malträtieren - so das Argument der allmächtigen Regierung in Havanna. Seit kurzem nun ist das vorbei. Frauen steigen ab sofort gleichberechtigt in den Ring und kämpfen gegeneinander. Sie werden sogar demnächst bei den nächsten Olympischen Spielen antreten. Dafür trainieren sie hart. Und der Nachwuchs steht ebenfalls bereits in den Startlöchern.
- eventId: 827005
  start: 2026-10-03T07:25:00Z
  stop: 2026-10-03T08:20:00Z
  title: 360° Reportage
  subtitle: Das Fischerstechen von Sète
  subtitled: true
  description: Sète, eine Kleinstadt in Südfrankreich zwischen dem Mittelmeer und dem Thau-Becken, ist berühmt für ihren beeindruckenden Fischereihafen - und für ihre jährlich im August um den Feiertag Saint Louis stattfindenden Seespiele. Sechs Tage lang ist die ganze Stadt im Ausnahmezustand, wenn die Wasserwettkämpfe des Languedoc stattfinden, die Joutes Languedociennes. Christophe Bancilhon ist ein Star in Sète. Wie von Großvater und Vater vorgelebt, gibt er sein Können an seinen Sohn weiter. "Das Ritterturnier ist in meiner DNA verankert, seit 50 Jahren stelle ich mich den Blicken meiner Gegner", sagt er.
- eventId: 827006
