  description: Im Jahr 2026 überholte Afrikas BIP erstmals Asien. Länder wie Ruanda oder Marokko zeigen Potenzial - trotz Konflikten, dschihadistischer Bedrohungen und politischer Instabilität. Während Asiens Wachstum schwächelt, wirft "Mit offenen Karten" einen Blick auf die unterschiedlichen Entwicklungen der "aufstrebenden" Volkswirtschaften.
