  description: |-
    Der Demokratie-Check

    Demokratie ist griechisch und heißt: Herrschaft des Volkes. Das bedeutet, dass jeder die Möglichkeit hat mitzubestimmen. Wir können und dürfen wählen, wer unsere Wünsche und Interessen vertritt. Die Politiker, die uns vertreten, heißen deshalb auch Volksvertreter.

    Wer in Deutschland wählen und gewählt werden darf, und wie eine Demokratie funktioniert, checkt Tobi diesmal. Dafür inszeniert er sich als König, Diktator und demokratischer Politiker und erklärt den Vorteil der Demokratie. Wenn den Bürgern nicht passt, was die Volksvertreter machen, können sie sie bei der nächsten Wahl nicht mehr wählen; bei einem König oder Diktator geht das nicht.

    Außerdem besucht Tobi den Reichstag in Berlin. Dort werden wichtige politische Entscheidungen getroffen. ...
