  description: Lach- und Sachgeschichten, heute mit Clarissa im Kuhstall, Evas-Lied vom Schwabbel-Schweinchen, Lauras spritziger Erfindung, einer Wasserrutsche auf der Farm - und natürlich mit der Maus, dem Elefanten und der Ente.
- eventId: 618476
  start: 2026-10-03T07:00:00Z
  stop: 2026-10-03T07:45:00Z
  title: Tiere suchen ein Zuhause
  subtitle: 'Moderation: Simone Sombecki'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In jeder Folge stellen nordrhein-westfälische Tierschutzvereine ausgesetzte oder in Tierheimen abgegebene Tiere vor, um sie an tierliebe Zuschauer zu vermitteln. Im Mittelpunkt stehen die beliebtesten Haustiere, Hunde und Katzen, aber auch Vögel, Kleintiere, Pferde und Hausschweine suchen via Bildschirm ein gutes und vor allem dauerhaftes, neues Zuhause.
- eventId: 618477
  start: 2026-10-03T07:45:00Z
  stop: 2026-10-03T08:15:00Z
  title: 50 Jahre mit der Maus - Die 70er Jahre
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: 50 Jahre mit der Maus - Die 70er Jahre
  genre:
  - '16'
  description: 'Für ihre Zeitreise durch die 70er Jahre melden sich Armin, Ralph und Siham aus einer alten Felgenfabrik in Solingen. Armin erinnert sich an seine ersten Sachgeschichten: Schon damals interessiert ihn, wie Dinge unseres Alltags hergestellt werden. So fragt er: Wie kommen eigentlich die Brötchen, das Ei und die Milch auf den Frühstückstisch?'
- eventId: 618478
  start: 2026-10-03T08:15:00Z
