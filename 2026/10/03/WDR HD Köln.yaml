  description: "Lach- und Sachgeschichten zum 50. Geburtstag im Jahr 2021 - mit der Maus in 30 Minuten durch die 80er Jahre. \n* Ganz schön schlau, Willi Wiberg\n* Das Trüffelschwein\n* Katzentatzentanz\n* 1983 - Christoph Biemann spielt zum ersten Mal die Hauptrolle in einer Sachgeschichte: \nDie neun besten Möglichkeiten, über einen Fluss zu kommen\n* Die Teichpiraten\n* Hund trinkt Milch"
