  title: Písničky z cizí kapsy
  description: Aniž bychom si chtěli dovolit troufalé srovnání s knihou knih, i na začátku písničky Neverending Story bylo slovo. V tomto případě stejnojmenná fantasy novela. Z ní brzy vznikl film a k němu i píseň, kterou vymyslel hitmaker Giorgio Moroder. Na konci řady pak stojí její česká verze nazpívaná Evou Hurychovou. Tak vypadá posloupnost, v jejímž finálovém kole zpěvačka spojená v nejznámější etapě své kariéry s kapelou Bacily pěje, že "chybička se vloudí". Tedy s celkem banální rýmovačkou (od možná překvapivého autora) takříkajíc surfuje na popularitě songu, který má určité kouzlo dodnes. Obzvláště pro pamětníky zmíněného filmu Nekonečný příběh i zahraničních hitparád 80. let. Nakonec to, že Moroderův hit - ač zvukem poplatný tehdejší módě - drží překvapivě dlouhou záruční lhůtu, potvrdila mnohem později i verze Leony Machálkové. Pohádky z mládí se prostě neokoukají. A nestárnou ani písničky s nimi spojené. K poslechu zve Martin Schuster.
