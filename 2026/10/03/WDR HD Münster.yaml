  title: 'Die Sendung mit der Maus Spezial: Milch'
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    "Die Sendung mit der Maus Spezial: Milch" zeigt, was man aus Milch alles machen kann - und wie!

    Müsli, Kakao oder Kuchen: Für viele leckere Sachen braucht man Milch. Aber wie kommt die Milch aus dem Euter der Kühe ins Geschäft? Und was ist der Unterschied zwischen H- und Vollmilch?

    Die Mischung macht's! Maus-Reporterin Jana will wissen, wie aus Milch so viele unterschiedliche Milchprodukte entstehen können. Deshalb wirft sie in einer Lehrmolkerei einen Blick hinter die Kulissen.
- eventId: 618656
  start: 2026-10-03T15:45:00Z
  stop: 2026-10-03T16:15:00Z
  title: Einfach und köstlich
  subtitle: 'Cordon-Bleu und Mangold-Knödel: Björn Freitag kocht mit Michaela Stöberl'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Zu Gast beim Dorstener Spitzenkoch Björn Freitag ist Wirtin, Bier- und Käse-Sommelière Michaela Stöberl aus Straubing in Niederbayern. Sie präsentiert ein Cordon Bleu mit Schwarzwälder Schinken, dreierlei Käse und Bierzwiebeln. Auch bei Björn wird es herzhaft: Zu Semmelknödeln gesellen sich Mangold und eine cremige Käsesoße.

    Als drittes Gericht kreieren die beiden eine bayrische Komposition - saftig, deftig lecker. In dieser Folge verbindet sich bayrische Gastronomie mit hochdeutscher Spitzenküche - mit Schmankerln, die sich sehen lassen können.
