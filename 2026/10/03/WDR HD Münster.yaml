  title: Sehen statt Hören
  subtitle: Schläge statt Sprache - Erinnerungen an eine Kindheit im Heim
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'So war das noch bis in die 70er Jahre: Ordensschwestern sollten und wollten für gehörlose Kinder da sein, ihnen ein Zuhause, regelmäßige Mahlzeiten und Zugang zu Bildung bieten. Doch in Wirklichkeit wurden viele Heime zu Orten von Gewalt. Auch im Kloster Hohenwart haben die Kinder Traumatisches erlitten. Wie konnte das geschehen? Lässt sich solch eine Geschichte aufarbeiten? Sehen statt Hören hat Kloster Hohenwart mit den Kindern von damals besucht. Auf den Sehen statt Hören-Sendungsseiten finden Sie zusätzlich Experteninterviews in Gebärdensprache und weiterführende Informationen.'
