  description: "Wie war das wohl vor 50 Jahren?  Das hat die Maus gefragt und vergleicht mit heute. \nFrüher-Heute-Geschichten: Tankwart - Tanken, Öl prüfen, die Windschutzscheibe wischen, wenn es notwendig ist und kassieren - das hat früher alles der Tankwart erledigt. Wenn Armin heute sein Auto tanken will, muss er das selbst machen. Einen Tankwart gibt es hier nicht mehr, erst beim Bezahlen im Tank-Shop trifft er jemanden."
