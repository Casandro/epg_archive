  title: Ehe gut - alles gut Staffel II
  subtitle: In guten und in bösen Tagen
  description: |-
    In guten und in bösen Tagen, in Gesundheit und Krankheit, bis der Tod uns scheidet. Das verspricht sich ein Paar, dass sich vor Gottes Angesicht das Ja-Wort gibt. Aber wie gelingt es, dass es auch ein Ja aus vollem Herzen für immer bleibt?
