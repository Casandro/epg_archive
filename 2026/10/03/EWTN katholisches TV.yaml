  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Warum ist Maria so wichtig? - Marienverehrung in der katholischen Kirche
  description: "Marienverehrung wird als \"typisch katholisch\" empfunden. Warum aber verehren Katholiken die Gottesmutter? Wo sind die biblischen Grundlagen für diese Verehrung und was bedeutet Maria ganz konkret im Leben der Gläubigen? Sr. Mechthild Steiner OP schaut in der zwölften Folge des Glaubenskurses auf die Gottesmutter als Begleiterin im geistlichen Leben; und wir hören das Glaubenszeugnis einer Frau, die ihren eigenen Weg hin zu Maria beschreibt.\n \nDa der Kath-Kurs auch in Pfarreien vor Ort stattfindet, sollen auch Teilnehmer zu Wort kommen und Einblick geben, warum der Kath-Kurs eine kostbare Bereicherung für das Glaubensleben vor Ort ist. In dieser Folge erzählt uns Andrea Frisch aus dem Bistum Passau von ihren Erfahrungen als Teilnehmerin."
  widescreen: true
