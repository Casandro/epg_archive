  title: Meine Zeit mit Jesus
  subtitle: Die Fürsprache unserer himmlischen Mutter
  description: Das ist wirklich Pech! Am Samstag gibt es einen Meteoritenschauer am Himmel und Josephs Teleskop ist kaputt! Aber er kann sich auf seine Mutter verlassen, die seinen Vater überreden wird, früher nach Hause zu kommen, um es zu reparieren! Finde in dieser Episode heraus, wie die Heilige Jungfrau Maria die gleiche Rolle am Anfang von Jesus' Mission gespielt hat und es immer noch tut, wenn wir sie brauchen.
