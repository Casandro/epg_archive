  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese fejeton Evy Turnové Urnový Hi. Autorka jej sama přečte. Zdeněk Grmolec věnoval literární pásmo spisovateli a diplomatovi Jiřímu Palivcovi, od jehož narození uplyne 140 let. V režii Radima Nejedlého účinkují Aleš Slanina a Vladimír Hauser. Četba z knihy Jany Soukupové Brněnské mordy pokračuje osmou částí. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Připomeneme si 55. výročí úmrtí básníka a výtvarníka Bohuslava Reynka.
