    (WH vom Donnerstag, 17.09.2026, 23:00 Uhr)
  description: 'Wie sorgt ein Relikt aus deutscher Kolonialzeit an der Skelettküste Afrikas bis heute für Aufsehen? Womit stellt ein Schweizer Alpengipfel alle anderen Berge der Welt in den Schatten? "Die größten Geheimnisse der Welt" präsentiert zehn atemberaubende Mythen, Rätsel und Rekorde. Zahlreiche Prominente rätseln mit, um die Geheimnisse zu lüften. Mit an Bord: Schauspieler Uwe Ochsenknecht, Moderatorin Panagiota Petridou, Realitystar Dani Büchner und Comedian Lisa Feller.'
  widescreen: true
