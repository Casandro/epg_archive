  subtitle: Feuersturm - Der Bombenkrieg gegen Deutschland (1)
  description: Während des Zweiten Weltkriegs erlebte Deutschland den verheerenden Bombenkrieg, der durch alliierte Luftangriffe ausgelöst wurde. Brandbomben lösten Feuerstürme aus, die ganze Stadtviertel zerstörten und unzählige Menschenleben forderten. Besonders betroffen waren Städte wie Dresden und Hamburg. Die Auswirkungen dieser Angriffe prägten das kollektive Gedächtnis Deutschlands für Generationen.
