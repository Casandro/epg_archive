  title: Wasser ist unsere Zukunft - Deutschland
  subtitle: Wasser ist unsere Zukunft - Deutschland
  description: Esist das Comeback eines kleinen Flusses und einer ganzen Landschaft. Das Emscher im Ruhrgebiet, jahrzehntelang der dreckigste Fluss Europas, wird vom industriell genutzten Abwasserkanal wieder zu einem natürlichen Flusssystem zurück gebaut. Mit Hilfe von Klärwerken, befreiten Flussbetten und zurückkehrenden Tierarten erblüht eine einzigartige Naturregion-mit einer ganz speziellen Industriegeschichte.
