  title: WDR 3 am Tag der Deutschen Einheit
  description: "Von Mendelssohns ergreifender Choralkantate \"Verleih uns Frieden\" führt uns der Weg auf unbekannteres musikalisches Terrain. Beethovens \"nulltes\" Klavierkonzert ist ein Frühwerk, das er noch in Bonn als Teenager schrieb und von dem lediglich ein Klavierauszug erhalten ist. Neu und doch vertraut klingt eine große Ouvertürensuite aus dem Hause Bach: hier allerdings nicht von Johann Sebastian, sondern von seinem Cousin Johann Bernhard: eine funkelnde Tanzsuite, die den Vergleich mit dem genialen Vetter nicht zu scheuen braucht. Auch aus der Familie Haydn erklingt Überraschendes. Die 29. Sinfonie von Michael Haydn, Josephs jüngerem Bruder, beweist sein großes Gespür für Dramatik und Form. Zwischen diesen feierlichen Werken entführen uns Bettine von Arnim und ihr Bruder Clemens Brentano in ihre tiefsinnige Poesie: \"O Stern und Blume, Geist und Kleid, Lieb, Leid und Zeit und Ewigkeit!\"\n<strong>Die Musikstücke und Gedichte der Sendung</strong>\n<strong>Felix Mendelssohn Bartholdy</strong><br/>Verleih uns Frieden gnädiglich, WoO 5, MWV A 11<br/>Chor des Bayerischen Rundfunks<br/>Münchner Rundfunkorchester<br/>Leitung: Howard Arman<br/>(4'07'') \n<strong>Johann Friedrich Fasch</strong><br/>Konzert D-Dur, FWV L:D1<br/>Giuliano Sommerhalder, Trompete<br/>Kammerorchester Basel<br/>Leitung: Julia Schröder<br/>(5'54'')\n<strong>Bettine von Arnim</strong><br/>Auf diesem Hügel<br/>(1'21'')\n<strong>Pauline Viardot</strong><br/>Romance aus \"Morceaux\"<br/>Raphaela Gromes, Violoncello<br/>Festival Strings Lucerne<br/>Leitung: Julien Riem<br/>(3'03'')\n<strong>Franz Schubert</strong><br/>Quartettsatz c-Moll, D 703<br/>Quatuor Arod<br/>(8'26'')\n<strong>Clemens Brentano</strong><br/>In der Fremde<br/>(1'00'')\n<strong>Henri Dutilleux</strong><br/>Hommage à Bach, aus: \"Au gré des ondes\"<br/>Élisabeth Pion, Klavier<br/>(3'00'')\n<strong>Michael Haydn</strong><br/>Sinfonie Nr. 29 d-Moll<br/>Deutsche Kammerakademie Neuss<br/>Leitung: Frank Beermann<br/>(16'20'')\n<strong>Bettine von Arnim</strong><br/>Wer sich der Einsamkeit ergibt<br/>(1'12'')\n<strong>Germaine Tailleferre</strong><br/>Arabesque<br/>Maria du Toit, Klarinette<br/>Vera Kooper, Klavier<br/>(2'42'')\n<strong>Johannes Brahms</strong><br/>Schicksalslied, op. 54<br/>Rundfunkchor Berlin<br/>Deutsches Symphonie-Orchester Berlin<br/>Leitung: Gijs Leenaars<br/>(15'05'')\n<strong>Clemens Brentano</strong><br/>Was reif in diesen Zeilen steht<br/>(1'17'')\n<strong>Carl Nielsen</strong><br/>Der Nebel hebt sich<br/>Charlotte Norholt, Flöte<br/>Gesine Dreyer, Harfe<br/>(2'19'')\n<strong>Ludwig van Beethoven</strong><br/>Konzert Es-Dur, WoO 4<br/>Howard Shelley, Klavier<br/>Orchestra of Opera North<br/>Leitung: David Greed<br/>(25'08'')\n<strong>Giovanni Gabrieli</strong><br/>In ecclesiis<br/>His Majesty's Sackbutts &amp; Cornetts<br/>The Choir of King's College Cambridge<br/>Leitung: Stephen Cleobury<br/>(7'44'')\n<strong>Bettine von Arnim</strong><br/>Eilt die Sonne<br/>(2'17'')\n<strong>Anton Reicha</strong><br/>Rondeau. Allegro aus: 24 Horntrios, op. 82<br/>Deutsche Naturhorn Solisten<br/>(3'43'')\n<strong>Felix Mendelssohn Bartholdy</strong><br/>Variations concertantes, op. 17<br/>Daniel Müller-Schott, Violoncello<br/>Jonathan Gilad, Klavier<br/>(9'09'')\n<strong>Clemens Brentano</strong><br/>Wenn der lahme Weber träumt<br/>(1'25'')\n<strong>Fanny Hensel</strong><br/>Sonata o Fantasia g-Moll<br/>Friedemann Kupsa, Violoncello<br/>Céline Dutilly, Klavier<br/>(5'49'')\n<strong>Johann Bernhard Bach</str"
