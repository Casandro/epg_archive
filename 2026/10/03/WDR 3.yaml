- eventId: 769582
  start: 2026-10-03T16:04:00Z
  stop: 2026-10-03T18:00:00Z
  title: WDR 3 Vesper Spezial
  subtitle: Mittelalter-Perspektiven
  description: |-
    Wenn das Ensemble Per-Sonat Gesänge aus fünf berühmten mittelalterlichen Musikhandschriften präsentiert, verspricht das, eine spannende Klangreise zu werden. So geschehen in einem Konzert im Juni im Rahmen des Romanischen Sommers Köln 2026. Roter Faden des Konzertprogramms sind die "Cantigas de amigo" - Liebesgesänge aus Frauenperspektive vom galicisch-portugiesischen Troubadour Martín Codax. Die Musikerinnen von Per-Sonat kombinieren die eindringlichen und berührenden Lieder mit den herben Klängen früher Mehrstimmigkeit, etwa aus dem "Codex Las Huelgas". Eine völlig andere Perspektive auf mittelalterliche Musik bietet das Konzert der Sängerin Andriana-Yaroslava Saienko und des Experimentalmusikers Oleh Shpudeiko, bekannt unter seinem Künstlernamen Heinali. Das Duo nimmt die Gesänge der Hildegard von Bingen neu in den Blick: mit einer traditionellen Gesangsweise aus der Ukraine und analoger Synthesizer-Improvisation - was die Mystik von Hildegards Werken auf spektakuläre Weise unterstreicht.
    von Gela Birckenstaedt
    <strong>Die Musikstücke zur Sendung</strong>
    <strong>Anonym / Martìn Codax</strong><br/>Mia irmana fremosa <strong><br/></strong>aus: Cantigas de amigo<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>1'49''
    <strong>Anonym</strong><br/>Misit Herodes rex manus<br/>Rex inmense, pater pie<br/>Nimis honorati sunt<br/>aus: Codex Calixtinus<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>4'50''<br/>2'59''<br/>5'06''
    <strong>Anonym / Martìn Codax</strong><br/>Ai Deus, se sab'ora meu amigo<br/>aus: Cantigas de amigo<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>2'30''
    <strong>Anonym</strong><br/>Ave, regina gloriosa<br/>Magdalena degna da laudare<br/>De la crudel morte de Cristo<br/>aus: Laudario di Cortona<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>3'09''<br/>3'00''<br/>5'15''
    <strong>Anonym / Martìn Codax</strong><br/>Quantas sabedes amare amigo<br/>aus: Cantigas de amigo<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>2'56"
    <strong>Anonym</strong><br/>Mater alma clementie - Deitatis triclinium<br/>En un biau vergier <br/>O Radix Jesse - Cunti fundent precamina<br/>aus: Zypern-Codex<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>2'36''<br/>4'17''<br/>2'40''
    <strong>Anonym / Martín Codex</strong><br/>Eno sagrado en Vigo<br/>Ai ondas que eu vin veere<strong><br/></strong>aus: Cantigas de amigo<br/>Per-Sonat<br/>Leitung: Sabine Lutzenberger<br/>1'45''<br/>2'00''
