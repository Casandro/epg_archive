    Die MDR SACHSEN-ANHALT Hitparade läuft jeden Sonnabend von 18-20 Uhr. Sie stimmen für Ihren Favoriten ab - unter den Top 20 oder Sie geben einer Neuvorstellung Ihre Stimme.

