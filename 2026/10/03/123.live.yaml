  title: Unvergessene Legenden - Heintje
  subtitle: Unvergessene Legenden - Heintje
  description: Die einzigartige Karriere des Kinderstars Heintje steht im Mittelpunkt dieser Ausgabe. Der 12-jährige Heintje wurde zum Weltstar mit seiner Musik als Europas berühmtester Kinderstar. Als Heintje ersang er unerreichte Erfolge. Seine Fan-Clubs sind nach wie vor aktiv. Auf vielen Kontinenten ist er bis heute berühmt. Seine Hits von damals und die Story seines Lebens stehen heute im Mittelpunkt. Mit Heintjes Stimmbruch 1973 endete seine Karriere als Kinderstar. Heute ist er als Hein Simons ein gefragter Sänger. Ge 2020
