  subtitle: Auf der Alm, da gibt's koa Sünd
  description: 'Im idyllischen Alpenvorland ist was los: Professor Solo hat eine bahnbrechende Formel entwickelt, mit der sich Kuhdung in Benzin verwandeln lässt. Das lukrative Geheimrezept befindet sich auf einem Mikrofilm, den der Erfinder an Tankstellenbesitzer Josef Sandler weitergibt. Allerdings ist auch Agentin Sally hinter der Formel her - und die setzt leidenschaftlich ihre körperlichen Reize ein. Auch die Gebirgsleute sind dem Liebesspiel nicht abgeneigt und so fallen Lederhosen und Dirndl im Akkord. 1974'
