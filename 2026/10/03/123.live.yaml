  title: Das große Monika-Martin-Wunschkonzert
  subtitle: Das große Monika-Martin-Wunschkonzert
  description: Das große Wunschkonzert schmückt in der heutigen Sendung Monika Martin. Die in der schönen österreichischen Stadt Graz als Ilse Bauer zur Welt kam, entpuppte sich schon früh als sehr musikalisches Kind. Mit 10 Jahren sang sie im Kinderchor der Grazer Oper. In den 80er-Jahren begann sie ein Studium des Sologesangs an der Universität für Musik und Darstellende Kunst in Graz. Und Ende der 80er-Jahre sang sie dann in einer Band - den "Heart Breakers". Ge 2015
