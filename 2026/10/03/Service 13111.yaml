  title: TM Wissen Spezial
  subtitle: Vom Meeresgrund bis in den Weltraum
  description: 'Insekten retten durch Blütenwaschen, alte Apfelsorten bewahren und rätselhafte Orca-Attacken erforschen - Geschichten über das fragile Gleichgewicht in der Natur. Insekten sind essenziell für Ökosysteme, doch ihre Bestände schrumpfen dramatisch - auch in Österreich. Zwei Biologen der Universität Salzburg entwickeln daher eine neue Monitoring-Methode: Statt klassischer Insektenfallen waschen sie Blüten, um aus der Umwelt-DNA Rückschlüsse auf Insektenbesuche zu ziehen. Diese Methode könnte helfen, Artensterben frühzeitig zu erkennen und gezielt gegenzusteuern. Auch in Österreichs Obstgärten geht es um bedrohte Vielfalt: Alte Apfelsorten wie der "Kronprinz Rudolf" drohen durch Klimawandel, Spätfröste und Krankheiten zu verschwinden. Der Verein Arche Noah dokumentiert, sichert und erhält diese Sorten - ein genetisches Erbe, das sonst verloren wäre. Unterdessen sorgen Orcas in der Straße von Gibraltar für Aufsehen. Immer häufiger greifen sie Boote an. Forscher um den Walexperten Dr. Renaud de Stephanis versuchen mit Satellitentechnik, Kameras und Fotoanalysen zu verstehen, was hinter diesem Verhalten steckt. Ist es Spiel, Stress oder gezielte Reaktion? Die Forschung zeigt: Orcas sind klug und sensibel - und unsere Eingriffe ins Meer komplexer, als wir denken.Österreich 2024'
  genre:
  - '144'
  widescreen: true
