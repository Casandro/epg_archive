  title: Ocean's Eleven
  description: |-
    Danny Ocean (George Clooney) kann's nicht lassen. Schon kurz nachdem er seine Strafe abgesessen hat, denkt der charmante Meisterdieb an den nächsten Coup. Die Beute: 150 Millionen Dollar in einem Sicherheitstresor in Las Vegas. Dabei handelt es sich um die Einnahmen von gleich drei Spielcasinos, alle im Besitz des skrupellosen Terry Benedict (Andy Garcia). Aber der Raubzug ist kompliziert, auch weil der 60 Meter tief liegende Safe durch Sensoren gesichert ist. Einen Tunnel zu graben wäre sinnlos. Danny braucht die Hilfe von Spezialisten. Neben seinem Freund und Kollegen Rusty Ryan (Brad Pitt) sind das der Taschendieb Linus Caldwell (Matt Damon), ein Sprengstoffexperte, ein asiatischer Akrobat, ein Trickbetrüger und ein Elektronikexperte. Reuben Tishkoff, ein ehemaliger, von Benedict hintergangener Casinobesitzer, finanziert das Unternehmen. Mit dem Coup hofft Danny, seine Ex-Frau Tess (Julia Roberts), inzwischen die Geliebte Benedicts, zurückzugewinnen.

    Steven Soderberghs "Oceans Eleven" ist das Remake der Gaunerkomödie "Frankie und seine Spießgesellen". Im Original von 1960 spielen Frank Sinatra und Dean Martin die Hauptrollen, diesmal sind es George Clooney (Danny) und Brad Pitt (Rusty). Bemerkenswert, wie raffiniert und dennoch spielerisch leicht der Regisseur die Erzählstränge des Heist-Movies zu einer atemberaubend spannenden Handlung verknüpft. Außer den extrem cool agierenden Superstars George Clooney und Brad Pitt wirken mit Matt Damon (Linus), Julia Roberts (Tessa) und Andy Garcia (als kaltblütiger Tycoon Terry Benedict).
    Thriller, Vereinigte Staaten Von Amerika 2001, R: Steven Soderbergh
  widescreen: true
