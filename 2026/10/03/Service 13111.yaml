  title: Bergwelten
  subtitle: Die südlichen Westalpen - vom ewigen Eis an die Côte d _Azur
  description: 'Der Traum eines alpinistischen Roadtrips durch die südlichen Westalpen: von den französischen Gletschern über Granit- und Kalkwände zum Deep Water Soloing an die Côte d''Azur und über das italienische Valle Maira im westlichsten Piemont an den König der Felsen, den Monte Viso. Die drei Freunde Babsi Vigl, Martin Sieberer und Simon Messner haben sich diesen Traum erfüllt und leben auf dieser Rundreise gemeinsam ihre Leidenschaft fürs variantenreich-anspruchsvolle alpine Klettern.Auf ihrem Weg aus den südlichsten 4000ern der Dauphiné durch die mediterranen Landschaften der Provence und deren spektakuläre Schluchten bis an die Felsküste des Mittelmeers bei Toulon beweisen sich die drei als vielseitige Alpinisten und meistern spielerisch die unterschiedlichsten Terrains.Die drei Freunde um Simon Messner sind alle Topalpinisten und Babsi Vigl und Martin Sieberer auch als Bergführer erfahrene Profis. Doch diesmal geht es vor allem um die Freude am gemeinsam improvisierten Roadtrip.Für Babsi Vigl, Simon Messner und Martin Sieberer ist der Roadtrip aber immer wieder auch eine Reise in die Geschichte des Kletterns: von den Granitwänden der Dauphiné auf den Spuren des Wiener Alpin-Pioniers Emil Zsigmondy, dem hier mit seinem Bruder Otto und dem Innsbrucker Ludwig Purtscheller mit der Längsüberschreitung des Gipfelgrates im Juli 1885 eine spektakuläre Erstbegehung gelang. Aber auch in den Wänden der Verdonschlucht, wo sich das Sportklettern in den 80er-Jahren wesentlich weiterentwickelte, bis hin zu modernen Varianten wie Deep Water Soloing an den Felsen der Mittelmeerküste.Der Film feiert diese Begeisterung, gemeinsam unterwegs zu sein und gemeinsam zu klettern; und er zeigt, wie eindrucksvoll diese oft weniger bekannte Gegend der Alpen ist. Echter Abenteuer-Alpinismus.Österreich 2024, R: Peter Künzel'
