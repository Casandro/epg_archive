  title: Hobby magazín
  description: Zaměříme se na invazivní rostliny, které zatěžují krajinu, vytlačují původní druhy. Které rostliny, dřeviny a keře to jsou? Jak s nimi účinně bojovat? A mohou být pro člověka i nebezpečné? Zeptáme se divokého zelináře a botanika Radomíra Němce. Třetí říjnový víkend se v Holicích koná jubilejní 20. krajská soutěžní výstava králíků, holubů a drůbeže. Pořádá ji velmi aktivní holický svaz chovatelů. Vypravila se tam hobby redaktorka Jitka Slezáková, aby zjistila, v čem bude akce výjimečná. O výrobu ptačího krmítka na zimu se bude zajímat Zdeněk Truhlář.
