  title: Mezi nebem a zemí
  description: Někteří návštěvníci pražské zoologické zahrady z exotických zemí vnímají zvířata posvátně, modlí se k nim a meditují i na relaxačních místech. Natáčel o tom Karel Sladký. 3D modely unikátních umělých jeskyní zdobených ametysty z kroměřížského zámku si můžou prohlédnout návštěvníci olomoucké Pevnosti poznání v nové expozici. V reportáži z jejího otevření se mimo jiné dozvíte i to, kterému z olomouckých biskupů se říkalo Kníže diamant. Už 10. října bude slavnostně předána historicky úplně první Cena Josefa Zvěřiny. A čeká nás i pravidelné zamyšlení. Dnes je od Sandry Silné, husitské farářky z Brna.
