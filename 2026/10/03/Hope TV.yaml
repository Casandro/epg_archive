  title: Sabbat - Das Gebot der Freiheit
  subtitle: Wie sollen wir leben?
  description: |-
    Wie findet man Orientierung für ein gutes Leben? Paulin Giurgi geht einer der ältesten Fragen der Menschheit nach und zeigt, welche Bedeutung die Zehn Gebote bis heute haben. Im Mittelpunkt steht der Sabbat - ein Gebot, das an Schöpfung und Erlösung erinnert und den Menschen zu einem Leben in Freiheit und Würde einlädt.

