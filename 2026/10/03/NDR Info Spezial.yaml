  title: Springerstiefel - Alpha oder Opfer?
  subtitle: Anders als die anderen
  description: |-
    Die Gewalt gegen Frauen und queere Menschen nimmt zu. Influencer wie Andrew Tate sagen einem Millionenpublikum: Männer müssen dominant und hart sein. Und: Es gibt in dieser Welt nur zwei Möglichkeiten: entweder bist du Alpha - oder Opfer. Es ist ein Männlichkeitsideal, das auch der Neuen Rechten in die Hände spielt: Jeder vierte junge Mann hat bei der letzten Bundestagswahl AfD gewählt.

