  description: 'Autor: Jan Perout; Interpret: Karel Studený * Filmana Talks - povídání o filmech, které má smysl vidět. Film Babbetina hostina je starší film, nicméně je to jeden z mála, jehož citace se ocitla přímo v papežské exhortaci. Povídáme si o oblíbeném filmu papeže Františka.'
