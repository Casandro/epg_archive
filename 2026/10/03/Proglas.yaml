- eventId: 1232034
  start: 2026-10-03T14:55:00Z
  stop: 2026-10-03T15:40:00Z
  title: Za 5 pět
  description: 'Autor: Petr Vizina; Interpret: Petr Vizina, Leonardo Teca- farář ČCE, Kladno, Petr Štica - katolický teolog; Premiéra: 25.9.2021 * Na poslední zářijovou neděli připadá Světový den migrantů a uprchlíků. Připomínka původně vznikla díky papeži Benediktovi XV, v roce 1915. O století později, v roce 2015, se Evropané začali zabývat uprchlickou krizí, způsobenou převážně odchodem obyvatel z válkou zbídačené Sýrie. V pořadu uslyšíte příběh jednoho z příchozích, Angolana, který se v Česku stal evangelickým duchovním. A přidáme pohled na migraci z hlediska křesťanského sociálního učení.'
  subtitle: Světový den migrantů a uprchlíků
