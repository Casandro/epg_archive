  title: Z archivu hudebních pořadů
  subtitle: Rozhovor s íránským kytaristou Shahabem Tolouiem
  description: 'Autor: Jannis Moras; Interpret: Shahab Tolouie; Premiéra: 2.7.2026 * V pořadu Jak se vám líbí bude Jannis Moras hovořit s íránsko-českým hudebníkem Shahabem Tolouiem o jeho novém albu Ci vediamo Goldoni!, které vzniklo z hudby k inscenaci komedie Carla Goldoniho Poprask na laguně v pražském Divadle na Vinohradech. Uslyšíte, jak se z původně fragmentární divadelní hudby zrodilo samostatné album inspirované italskou lidovou tradicí, středomořskými rytmy i neobvyklými historickými dialekty. Řeč bude také o prolínání různých kulturních vlivů, o komponování hudby mezi Vltavou a benátskou lagunou i o cestě od divadelního jeviště ke koncertnímu provedení. [šahabem tolujím] [či vedjámo goldony] [karla goldonyho] '
  genre:
  - '96'
