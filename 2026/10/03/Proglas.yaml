  title: ChariTALK
  description: 'Autor: Charita ČR; Interpret: Dušan Kejmar, Naděžda Hávová; Premiéra: 14.9.2024 * Ač pracuje celý život v mezinárodní dopravě, není mu cizí charita ani pomoc druhým. Dušan Kejmar je manažerem v logistice, ale už dvacet let spolupracuje s Charitou a tím výčet jeho dobročinných aktivit zdaleka nekončí. Do podcastu ChariTALK přišel vyprávět o tom, jak na dálku adoptoval dívku z Indie, i o tom, jak si během covidu udělal kurz sociálního pracovníka a vedle svého zaměstnání začal pomáhat v sociálních službách. ?Vím, že nemohu pomoci všem a změnit svět, ale každý můžeme přispět svou troškou a zažít příjemný pocit z pomoci druhým,“ říká Kejmar, který se stal jednou z tváří charitního projektu Dobročinní. Co je jeho hnacím motorem v nezištné pomoci ostatním? Jaké ?díky“ pro něj má největší cenu? Kdo jsou to vlastně Dobročinní a proč jsou pro Charitu nepostradatelní? Poslechněte si nový díl podcastu a nechte se Dušanem Kejmarem namotivovat k pomoci.'
  subtitle: 'Dušan Kejmar: Musíme (si) pomáhat'
