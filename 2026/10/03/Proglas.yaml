- eventId: 1231965
  start: 2026-10-03T03:57:00Z
  stop: 2026-10-03T04:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1003 - Jak to změnit? (277. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * To bylo opravdu hezké, jak jsem včera hned u první osoby, kterou jsem přede dveřmi bytu potkala, mohla začít nacvičovat změnu myšlení. Dostala jsem se k tomu prakticky až večer.in, co znám. Jak se dá změnit myšlení? Mám dojem, že myšlenky v mém mozku mají už vyryté nějaké dráhy, po nichž se pohybují a zdá se mi skoro nemožné je vykolejit. Jak se to dá provést? Vůbec se mi nechtělo přemýšlet o sousedce, kterou jsem považovala za nesnesitelnou. Nebýt mé touhy být Bohu blíž a všem těm souvislostem, které se z ní vyvinuly, nikdy bych se jí nechtěla zabývat. Ale vypadalo to, že přesně toto, má Bůh na mysli. Nepředstavovala jsem si, že to bude velká legrace, nebo procházka růžovým sadem, ale přece jen se mi nechtělo se touto paní zabývat.?No dobře,“ řekla jsem sama sobě nahlas, ?pojďme do toho.“ Zavřela jsem oči a v klidu a tichu jsem chvíli seděla. Napadlo mě, že bych jí mohla pro začátek jen tak neutrálně požehnat. Představila jsem si v mysli její sevřenou tvář, oči bez záře, rty bez úsměvu a fakt mi jí bylo líto. Byla bych chtěla najít pro její život nějaké polehčující okolnosti, ale žádné jsem nemohla najít. Neznala jsem mnoho detailů, jen co tak člověk o svých nejbližších sousedech může zjistit pouhým necíleným pozorováním. Nedařilo se mi najít žádný důvod ke vzniku sympatií. Byla mi prostě protivná. No tak jsem jí požehnala. Krátce jsem se za ni pomodlila.Seděla jsem dál a nevěděla, co si počít. Je to už všechno? Zvládla jsem celou svou dnešní lekci výuky o ?blíže“? Pak mě napadlo, že možná ji já sama nemusím hned rovnou milovat. Třeba bude pro začátek stačit, že na ni budu pohlížet jako na někoho, koho miluje Bůh. Pak uvidíme.v'
