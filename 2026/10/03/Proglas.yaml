  title: Jak se vám líbí
  subtitle: Rozhovor s folkovou skupinou MeziMěsto
  description: 'Autor: Jannis Moras; Premiéra: 3.9.2026 * Folková skupina MeziMěsto představí v pořadu své nové album Pramen, co neuteče, na kterém rozvíjí motiv vody jako symbolu hledání, proměny i naděje. V rozhovoru s Jannisem Morasem členové kapely prozradí, jak vznikaly písně, proč jejich zvuk nově obohatily bicí a jak probíhalo rok a půl trvající nahrávání. Řeč bude také o společném autorském přístupu, literárních inspiracích i podzimních koncertních plánech.'
  genre:
  - '96'
