  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 6)'
  subtitle: Na terenie rezerwatu przyrody zostają znalezione obnażone zwłoki niezidentyfikowanej 40-latki. Dzięki zebranym wskazówkom Candice odkrywa, że ofiara należała do kongregacji zakonnej karmelitek.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Stéphane Malhuret
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Samira Lachhab, Delphine Rich, Mhamed Arezki
    Na terenie rezerwatu przyrody zostają znalezione obnażone zwłoki niezidentyfikowanej 40-latki. Ciało nosi ślady cięć i skaleczeń na kolanach. Dzięki zebranym wskazówkom Candice odkrywa, że ofiara należała do kongregacji zakonnej karmelitek. Jednocześnie wychodzi na jaw zaginięcie jednej z zakonnic w okolicach rezerwatu. Candice udaje się na miejsce zbrodni, a Antoine postanawia zainteresować się bliżej osobą Fabrice'a Garela, który jako leśniczy nadzorował teren w momencie zaginięcia ofiary.
  ageRating: 16
