    FR, 2014
    Reżyseria: Olivier Laneurie
    Występują: Cécile Bois, Raphaël Lenglet, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab
    17-letnia Alice Fontanel pojawia się na komisariacie, zaniepokojona trzydniową nieobecnością jej mamy, Magali. W odróżnieniu od pozostałych śledczych, Candice traktuje ten fakt z należytą powagą. Dzień wcześniej miały miejsce urodziny Alice, a jej mama, z którą nastolatka była bardzo blisko, nie wysłała jej żadnej wiadomości ani nie zadzwoniła z życzeniami.
