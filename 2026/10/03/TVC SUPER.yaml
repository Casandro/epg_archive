  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 5)'
  subtitle: 17-letnia Alice Fontanel pojawia się na komisariacie, zaniepokojona trzydniową nieobecnością jej mamy, Magali. W odróżnieniu od pozostałych śledczych, Candice traktuje ten fakt z należytą powagą.
  description: |-
