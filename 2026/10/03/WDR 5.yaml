  title: WDR 5 Spezial
  subtitle: Haus Vaterland - Die Hörspielserie zu Babylon Berlin
  description: |-
    Darin: <br/>zur vollen Stunde WDR aktuell
    Berlin <markup type="abbr" abbreviation="1932" correspondent="neunzehnhundertzweiunddreißig">1932</markup>/<markup type="abbr" abbreviation="33" correspondent="dreiunddreißig">33</markup>: Die Weimarer Republik steht am Abgrund. Politische Radikalisierung, wirtschaftliche Unsicherheit und Gewalt nehmen zu. Inmitten der aufgeheizten Atmosphäre ermittelt Gereon Rath weiter: Ein rätselhafter Todesfall im Vergnügungstempel "Haus Vaterland" führt den Kommissar von Berlin bis in die masurischen Moore - hinein in eine düstere Mordserie. Das Hörspiel zur finalen TV-Staffel Babylon Berlin verbindet Volker Kutschers Romane "Die Akte Vaterland" und "Märzgefallene" zu einem mitreißenden Hörerlebnis - mit prominentem Sprecherensemble und exklusivem Soundtrack vom WDR Funkhausorchester.
    Zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
