  title: DAS! Rote Sofa
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: 'Gast: Andrea Wulf, Historikerin und Autorin'
  description: "Georg Forster (1754-1794) - ein Mann, der mit Captain Cook die Welt umsegelte, die Französische Revolution miterlebte und dabei nie aufhörte, die Welt mit staunenden Augen zu betrachten. Die britisch-deutsche Bestsellerautorin und Historikerin Andrea Wulf erzählt seine faszinierende und zu Unrecht vergessene Lebensgeschichte. Zu seiner Zeit war Forster auch berühmt für seine Zeichnungen von Fauna und Flora, denen er auf seinen Reisen begegnete. \nAuf dem Roten Sofa verrät sie, warum Forster topaktuell ist und was ein Weltumsegler aus dem 18. Jahrhundert heutzutage über Freiheit, Verantwortung und Neugier lehren kann."
- eventId: 619075
