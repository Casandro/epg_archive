  title: Unerwäis - Unterwegs mit Friesen
  subtitle: Sprünge übers Meer mit Kite-Profi Marret Zielke
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nie wieder ohne: Marret "Mizzy" Zielke (30) lebt vom und fürs Kitesurfen. Dabei hat sie als Kind mit Wassersport nichts am Hut gehabt, obwohl sie auf Föhr geboren und aufgewachsen ist. Nach der Schulzeit will sie nichts wie weg von der Insel und arbeitet dennoch heute jeden Sommer genau dort: am Nordseestrand ihrer Heimatinsel als Kitelehrerin. Die Winter verbringt sie in Spanien und springt am Kitehotspot Tarifa meterhoch über die Wellen. Ein Leben auf Friesisch mit Sonne, Wind und hohen Sprüngen.'
