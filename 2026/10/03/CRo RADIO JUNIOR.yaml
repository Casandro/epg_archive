  title: Hajaja
  description: Rézička a Čtvrtjadýrko 5/6 - Jak pomáhali jezevci. Povídání o jedné veverce s kožíškem rezavým jako měď, která si říkala Rézička. Aby jí nebylo smutno, našla si kamaráda. Malého lískového skřítka jménem Čtvrtjadýrko. O tom, co všechno spolu zažili, vypráví seriál Jaroslavy Pechové Rézička a Čtvrtjadýrko. Natočeno v roce 1990. Režie Vladimír Gromov. Vypráví Dana Syslová.
