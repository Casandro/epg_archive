  title: Znojmo v královském hávu 1/3
  description: Před 800 lety povýšil český král Přemysl Otakar I. město Znojmo na město královské. Významnou událost připomíná Jihomoravské muzeum mimořádnou výstavou Tváře města Znojma. Unikátními exponáty představuje tváře královské i ty zcela "obyčejné" a "jejich pohledem" se noří do pradávné historie. Expozicí nás provázejí historičky umění Monika Frecerová a Klára Benešovská, naslouchá Eva Ocisková.
