  title: 'Adolf Loos: Nestav malebně!'
  description: Mezi vrcholná díla Adolfa Loose (1870-1933), autora tzv. Raumplanu patří pražská Müllerova vila, která se po nutných opravách znovu otevře veřejnosti. Pochopit Loosovu tvorbu ale znamená vydat se nejenom za rok 1930, kdy byla Müllerova vila postavena, ale také za hranice Prahy i tehdejšího kulturně a národnostně pestrého Československa. Na takový výlet v čase zve autorka pořadu Michaela Vrchotová společně se svými hosty historičkou umění a vedoucí Müllerovy vily Eliškou Zlatohlávkovou a profesorem dějin umění a architektury Jindřichem Vybíralem.
