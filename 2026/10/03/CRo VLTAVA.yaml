  title: Katedrála, jak ji neznáte 15/15
  description: Roškotovy panovnické etuje. Postupem doby se stala, bez ohledu na její duchovní obsah i funkci, celonárodním symbolem a pražskou dominantou, přesto všeobecně vyznívá jako architektonická ikona, o níž máme průměrné znalosti. Cyklus Mariuse Winzelera a Ivana Hartmanna se pokusí přiblížit pražský Svatovítský chrám běžnému návštěvníkovi coby model světa a vesmíru, tak, jak by ho sám pro sebe neobjevil a marně by našel smysl některých částí.
