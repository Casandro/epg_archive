- eventId: 619531
  start: 2026-10-03T07:30:00Z
  stop: 2026-10-03T08:00:00Z
  title: Selbstbestimmt
  subtitle: Plötzlich war ich taub
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Oliver Faulstich aus Hessen ist 37 Jahre alt und ein Grenzgänger zwischen den Gehörlosen und den Hörenden. Als er 15 Jahre alt ist, erkrankt er an einer seltenen Form der Hirnhautentzündung. Von einem Tag auf den anderen kann er nicht mehr hören. Ein Schock für den Teenager und auch für seine Eltern. Durch die moderne Technik von Cochlea-Implantaten und viel Training kann er heute wieder ein fast uneingeschränktes Leben als Familienvater führen, doch der Alltag bleibt anstrengend. Jetzt macht er sich stark für Menschen, denen es ähnlich geht, wie ihm.
- eventId: 619532
  start: 2026-10-03T08:00:00Z
  stop: 2026-10-03T08:30:00Z
  title: Sehen statt Hören
  subtitle: Schläge statt Sprache - Erinnerungen an eine Kindheit im Heim
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'So war das noch bis in die 70er Jahre: Ordensschwestern sollten und wollten für gehörlose Kinder da sein, ihnen ein Zuhause, regelmäßige Mahlzeiten und Zugang zu Bildung bieten. Doch in Wirklichkeit wurden viele Heime zu Orten von Gewalt. Auch im Kloster Hohenwart haben die Kinder Traumatisches erlitten. Wie konnte das geschehen? Lässt sich solch eine Geschichte aufarbeiten? Sehen statt Hören hat Kloster Hohenwart mit den Kindern von damals besucht. Auf den Sehen statt Hören-Sendungsseiten finden Sie zusätzlich Experteninterviews in Gebärdensprache und weiterführende Informationen.'
- eventId: 619533
  start: 2026-10-03T08:30:00Z
  stop: 2026-10-03T09:00:00Z
  title: STATIONEN
  subtitle: Nichts haben. Alles geben - 800 Jahre Franz von Assisi
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Vor 800 Jahren starb Franz von Assisi. Bis heute gilt er als einer der einflussreichsten Heiligen der Kirchengeschichte - als radikaler Erneuerer, Friedensstifter und Patron der Schöpfung. Seine Botschaft von Einfachheit, Mitgefühl und einem Leben in Verbundenheit mit Mensch, Natur und Gott fasziniert.
    Die Dokumentation begibt sich auf Spurensuche - an die historischen Orte seines Lebens in Assisi und Umbrien ebenso wie zu Menschen in Bayern, die sich von seiner Spiritualität inspirieren lassen.
