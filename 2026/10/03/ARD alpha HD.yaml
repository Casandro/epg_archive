  title: 'alpha-retro: D''Jubel Wies''n - Ein Oktoberfestfilm (1986)'
  subtitle: Unter deutschen Dächern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Musik ist zu Ende. Die schwitzende Menge, bewaffnet mit Bierkrügen, tobt. "Die Krüge hoch!", die Musiker heizen ein, fordern zum Trinken auf, verordnen Gemütlichkeit. Ein Prosit, ein Prosit.
    1985 war die "Jubelwies'n", die 175-Jahrfeier des Oktoberfestes, das längst zur größten Attraktion, zum Kulminationspunkt des bayerischen Jahres geworden war. Alles Dagewesene wurde wieder einmal in den Schatten gestellt: auch der Abfall zeigt die Fülle - wieder Rekord! Unter'm Strich aber: Zufriedenheit.
