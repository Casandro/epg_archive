  title: 42 - Die Antwort auf fast alles
  subtitle: Ist die Welt besser als wir denken?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In vielen globalen Kennzahlen hat sich der Zustand der Menschheit über die letzten Jahrzehnte deutlich verbessert. Wäre das nicht ein Grund zum Feiern? Die meisten Menschen sehen das anders - sie neigen eher zu Pessimismus. Die Organisation "Gapminder" befragt regelmäßig Menschen weltweit und stellt fest: Viele unterschätzen die Fortschritte der letzten Jahrzehnte erheblich. Ein Grund dafür sei unser sogenannter "Negativitätsinstinkt" oder "Gap-Instinkt" - kognitive Verzerrungen, die dazu führen, dass wir die Welt als schlechter, gefährlicher und ungleicher wahrnehmen, als sie tatsächlich ist.'
- eventId: 619491
  start: 2026-10-03T03:30:00Z
  stop: 2026-10-03T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Hide-A-Way Cove
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 619492
  start: 2026-10-03T04:00:00Z
  stop: 2026-10-03T04:30:00Z
  title: Englisch für Anfänger
  subtitle: Finding Somewhere to Live
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"What''s your name? Are you German?" Mit einfachen Fragen und Antworten führt dieser Klassiker unter den Fernsehsprachkursen in die englische Sprache ein. In 51 Lektionen werden die wichtigsten Grammatikstrukturen und der Grundwortschatz vermittelt. Wann sagt man "some" oder "any"? Wann  heißt es "he was" und wann "he has been"? Die Antworten auf diese und viele andere Fragen, die Sie im Englischunterricht nie zu stellen wagten, liefert "Englisch für Anfänger" in witzigen Spielszenen und fundierten Erklärteilen.'
- eventId: 619493
