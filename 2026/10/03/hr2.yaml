  title: Archivschätze
  subtitle: TRANSIT. In Erinnerung an Karl Corino
  description: 'Er war Robert-Musil-Experte, Rundfunkjournalist, Literaturkritiker, Schriftsteller und Lyriker. Von 1970 bis 2002 war Karl Corino Literaturredakteur im Hessischen Rundfunk. Ab 1985 leitete er die Literaturredaktion. Er war ein Kenner und Förderer der DDR-Literatur. In seiner Sendung "Transit" kamen viele Schriftstellerinnen und Schriftsteller aus dem Osten zu Wort: Christa Wolf, Volker Braun, Reiner Kunze, Sarah Kirsch, Rainer Kirsch, Ulrich Plenzdorf.'
