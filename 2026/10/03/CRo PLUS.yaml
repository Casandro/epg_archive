  title: Pro a proti
  description: Co kauza Eda Sheerana říká o debatě o Gaze? Hudební svět žije kauzou britského písničkáře Eda Sheerana. Ten byl fanoušky a hudebníky přinucen vyjádřit se k situaci v Gaze potom, co byl z jeho turné vyhozený předskokan a rapper Macklemore kvůli svým propalestinským výrokům. Vyhrotila se debata o Gaze natolik, že už je dnes morální povinností umělce vybrat si stranu konfliktu? Anebo má i megastar právo zůstat neutrální? A jak se Gaza promítá do zdejší debaty o Ukrajině? S režisérem snímku Velký vlastenecký výlet Robinem Kvapilem a novinářem deníku Alarm Davidem Scharfem bude diskutovat Lucie Vopálenská.
