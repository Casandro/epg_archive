  title: Archiv Plus
  description: Emigrace Waldemara Matušky a jeho manželky Olgy v roce 1986 zaskočila téměř celé Československo. Jak se o ní tehdy mluvilo? Ukázky z unikátního rozhovoru Waldemara Matušky ve Spojených státech o jeho emigraci i málo známou nahrávku jeho anglicky zpívané písničky - to a mnoho dalšího nabídne repríza pořadu, který připravil David Hertl.
- eventId: 1404767
