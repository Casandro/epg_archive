  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (4/10). Otec považuje Františkovu proměnu za nevyléčitelnou formu bláznovství. Autor také popisuje dvě verze příběhu o opravení kostelíku svatého Damiána, která stála na začátku jeho definitivní proměny. František opouští domov a stává se poustevníkem. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
