  title: Příběhy 20. století
  description: Josef Sorban se narodil v roce 1948 v židovské rodině. Jehož otce represivní složky v roce 1952 zatkli za ilegální převádění lidí na Západ a byl odsouzený na patnáct let. O rok později zavřeli i jeho maminku. Přestože pětiletý Josef měl babičku v Žilině, komunistické úřady ho poslali do dětského domova. Josefova matka si po roce a půl hladovkou vynutila informaci, kde se její syn nachází. Poté si pro něj přijela babička ze Žiliny. Ta byla členkou KSČ, a tak využila svých známostí a po třech měsících získala vnuka do své péče.
