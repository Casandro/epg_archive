  title: Ex libris
  description: 'Jakému dějinnému období se podobá dnešní svět? Norský historik Odd Arne Westad je přesvědčen, že mnohá podobenství můžeme vysledovat v Evropě před první světovou válkou. Jeho kniha vyšla zatím jen anglicky a mohli bychom ji přeložit jako Blížící se bouře: moc, konflikt a varování z historie. Pro Ex libris ji pročetl a citace vybral Ondřej Houska.'
