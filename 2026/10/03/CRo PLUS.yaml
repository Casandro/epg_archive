  description: Americký prezident Donald Trump v posledních dnech pohrozil Íránu zničením, vyzval Ukrajinu k energetickému příměří, označil Kanadu za nejhorší zemi světa a pochvaloval si partnerství s Čínou, ale obchodní válku s ní neukončil. Jsou skutečně tyto silné řeči jen součástí předvolební kampaně nebo je mají trhy a ekonomiky brát vážně? Václav Pešička se ptá prorektora VŠE v Praze Pavla Hnáta.
