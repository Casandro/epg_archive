  description: 120 tisíc lidí v Česku má podle letošního výzkumu agentury NMS Market Research, který vznikl ve spolupráci s organizací Konsent, osobní zkušenost se sexuálním vztahem s vyučujícím na základní nebo střední škole. Dalších 1,5 milionu lidí zná někoho, komu se to stalo. Co tato čísla znamenají? Jak na podobné případy reagují školy a další instituce? Kdo má zasáhnout, když se učitel nevhodně chová k žákyni nebo žákovi? Téma pro Evu Lammelovou.
