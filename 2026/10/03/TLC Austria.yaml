  title: Abgründe - Unfassbare Verbrechen
  subtitle: Verraten und verkauft
  description: "An einem milden Herbsttag kommen Cindy Karlsen und ihr Mann Karl nachhause und stehen einer Tragödie gegenüber: Levi, Karls 23-jähriger Sohn aus erster Ehe, wollte am Auto seines Vaters herumbasteln und ist nun unter dem drei Tonnen schweren Pick-up begraben. Karl kann nur noch seine Leiche unter dem Wagen herausziehen. Und dies ist schon der zweite familiäre Schicksalsschlag für Karl: Seine erste Frau war bei einem Hausbrand auf schreckliche Weise ums Leben gekommen. Auch Cindy ist untröstlich. Doch als sie erfährt, dass Karl kurz vor dem Unfall eine hohe Lebensversicherung für seinen Sohn abgeschlossen hatte, kommt ihr ein schrecklicher Verdacht.  \nDEU 2017"
