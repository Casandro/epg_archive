  title: Yukatans Gold - Goldmakrelen satt vor Mexikos Küste
  subtitle: Yukatans Gold - Goldmakrelen satt vor Mexikos Küste
  description: Yukatans Fischerei ist für Redakteur Peter kein Neuland. Er besucht bei dieser Reise dieses Revier nun schon zum vierten Mal. Beim ersten Besuch gab es noch Sailfish und Weiße Marline satt. Leider wurden die Fänge auch bei ihm im Laufe der Jahre immer weniger. Nach einer Pause von nunmehr 15 Jahren ist er zusammen mit seinem Freund Harald wieder einmal vor Ort, um auf die Boliden des Warmwassers erneut sein Glück zu versuchen. DE 2024
- eventId: 1371007
