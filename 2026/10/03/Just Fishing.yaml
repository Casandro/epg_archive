  title: Carpfishing Strategy - Dipps
  subtitle: Carpfishing Strategy - Dipps
  description: |-
    In der Reihe Carpfishing Strategy erklärt Robin Illner in kurzen Clips, wie er systematisch Karpfen zum Köder lockt. Der Zuschauer erfährt wie Köder attraktiver gestaltet werden können, an welchen Stellen Karpfen fressen und welches Gerät für den schnellen Erfolg wichtig ist. Zudem behandelt die Serie Themen wie Inhaltsstoffe von Ködern. Fette, Eiweiße und Kohlenhydrate sind wichtige Futterbestandteile. Welche Köder besonders viel Eiweiß aufweisen und welche Köder einen hohen Kohlenhydratanteil haben, erläutert Robin Illner in dieser Reihe.
     DE 2018
