  subtitle: Fischertradition auf Frauenchiemsee - Die Geschichte von Erika Lex +++ The Frontmen - Bühnenjubiläum zum Auftakt der Saitensprünge +++ Ein Rückblick voller Farbe, Kunst & Begegnungen - Transit Art Festival 2026
  description: Der Chiemsee ernährt seit Jahrhunderten Fischerfamilien, und ein neues Buch von Roswitha Gruber erzählt die Flüchtlings- und Lebensgeschichte der Fraueninsel-Fischerin Erika Lex, die die Tradition bis zu ihrem Tod 2025 prägte und deren Sohn Thomas sie fortführt. +++ Pete Lincoln, Peter Howarth und Mick Wilson, einst in Cliff Richards Band vereint, stehen seit 2016 als The Frontmen gemeinsam auf der Bühne und feiern ihr 10-jähriges Jubiläum am 4. November bei den Saitensprüngen in Bad Aibling mit akustischen Hits. +++ Ein Rückblick voller Farbe, Kunst & Begegnungen - Transit Art Festival 2026
