  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: 'In der Alten Füllerei der Schlossbrauerei Maxlrain bei Rosenheim startete am Samstag eine neue Kleinkunstbühne: Jannemacher und das Strawanza Trio mischten Mundart und Dialekt mit modernen Popklängen, weitere Abende folgen bis Oktober. +++ Bei Obacht - Volksmusik in Neuötting (10. bis 18. Oktober) stehen am 10. Oktober im Stadtsaal das Bayerische tapfere Schneiderlein und das Live-Hörspiel Jennerwein mit Stefan Murr, Heinz-Josef Braun, Johanna Bittenbinder und dem Art Ensemble of Passau auf dem Programm.'
- eventId: 1058214
  start: 2026-10-03T19:30:00Z
