  description: 'Der Freilassinger Stadtrat hat die Entwurfsplanung zur Neugestaltung der Fußgängerzone einstimmig beschlossen, damit Förderanträge eingereicht werden können; bei 6,4 Millionen Euro Kosten erwartet die Stadt 4,8 Millionen Zuschüsse, Baubeginn ist ab 2027 geplant. +++ Spätsommerwärme und Dauergrau prägen das Wochenende: Nebel und Hochnebel halten sich oft, besonders im Südosten, während im Westen und Osten häufiger die Sonne durchbricht; am Sonntag sind im Norden und Süden einzelne Schauer möglich, am Montag im Nordosten etwas Regen und im Süden viel Sonne.'
- eventId: 1057956
  start: 2026-10-03T14:30:00Z
  stop: 2026-10-03T14:45:00Z
  title: Süd Kultur vom 2.10.2026 (Wh.)
  subtitle: Fischertradition auf Frauenchiemsee - Die Geschichte von Erika Lex +++ The Frontmen - Bühnenjubiläum zum Auftakt der Saitensprünge +++ Ein Rückblick voller Farbe, Kunst & Begegnungen - Transit Art Festival 2026
  description: Der Chiemsee ernährt seit Jahrhunderten Fischerfamilien, und ein neues Buch von Roswitha Gruber erzählt die Flüchtlings- und Lebensgeschichte der Fraueninsel-Fischerin Erika Lex, die die Tradition bis zu ihrem Tod 2025 prägte und deren Sohn Thomas sie fortführt. +++ Pete Lincoln, Peter Howarth und Mick Wilson, einst in Cliff Richards Band vereint, stehen seit 2016 als The Frontmen gemeinsam auf der Bühne und feiern ihr 10-jähriges Jubiläum am 4. November bei den Saitensprüngen in Bad Aibling mit akustischen Hits. +++ Ein Rückblick voller Farbe, Kunst & Begegnungen - Transit Art Festival 2026
- eventId: 1058018
  start: 2026-10-03T14:45:00Z
  stop: 2026-10-03T15:00:00Z
  title: Süd Kultur vom 2.10.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: Blues-Sängerin und Multi-Instrumentalistin Katie Henry kommt mit eigener Band am 12. Oktober in den Bluesclub Chiemgau ins Feuerwehrhaus Rimsting, nachdem sie einst beim Ruf-Records-Jubiläum im Blues Caravan spielte und nun mit Gibson SG und Keyboards ihre drei Ruf-Alben live präsentiert.
- eventId: 1058068
  start: 2026-10-03T15:00:00Z
  stop: 2026-10-03T15:10:00Z
  title: Süd Journal vom 2.10.2026 (Wh.)
  subtitle: 200 Jahre Sparkasse Wasserburg +++ Veränderung der Arbeitslosenzahlen in der Region +++ Probleme am Salzstadel - Stadtrat reagiert mit Alkoholverbot +++ Neue Aufenthaltsfläche am Badria
  description: 'Zum 200-jährigen Bestehen feierte die Sparkasse Wasserburg bei bestem Wetter im Rathaus, ihrem Gründungsort, mit Gästen, Kunden und Mitarbeitern samt Kabarettprogramm, wobei die enge Verbundenheit von Bank, Stadt und Region im Mittelpunkt stand. +++ Der Arbeitsmarkt im Agenturbezirk Rosenheim bleibt im September träge: 10.500 Menschen sind arbeitslos, 54 weniger als im August, aber 250 mehr als vor einem Jahr; die Quote liegt bei 3,3 Prozent, in der Stadt Rosenheim bei 5,2 Prozent. +++ Am Salzstadel in Rosenheim belasten Lärm, Aggressionen sowie Alkohol- und Drogenkonsum Anwohner und Betriebe, die sich teils unsicher fühlen; nach häufigen Polizeieinsätzen beschloss der Stadtrat am 30. September mehrheitlich ein Alkoholverbot. +++ Am Badria in Wasserburg werden drei Stellplätze an der neuen Skateanlage zu einem Aufenthaltsbereich umgebaut, wie der Haupt- und Finanzausschuss beschloss: Aus Sicherheitsgründen kommen dort Biertischgarnituren hin, vor allem für begleitende Eltern.'
- eventId: 1058069
  start: 2026-10-03T15:10:00Z
  stop: 2026-10-03T15:20:00Z
  title: Süd Journal vom 2.10.2026 (Wh.)
  subtitle: Herrenchiemsee startet in die Wintersaison +++ Katzenschutzverordnung im Landkreis Rosenheim soll Leid freilebender Katzen verringern +++ Königssee - Kufensport kehrt zurück in die Eisarena +++ Tageskurbeitrag in Bad Aibli..
  description: 'Auf Herrenchiemsee wird für den Winter gerüstet: Sommerpflanzen werden entfernt, Hecken geschnitten und Kübelpflanzen eingelagert, am 5. Oktober folgen Brunnenstilllegung und Frostschutz; Kutschfahrten zum Königsschloss gibt es bei gutem Wetter bis 8. November, Museen öffnen ab 25. +++ Ab 1. Februar gilt in Amerang, Feldkirchen-Westerham, Griesstätt, Pfaffing und Tuntenhausen: Freigängerkatzen müssen kastriert, gechippt und registriert sein, um die Zahl verwilderter, oft kranker Tiere zu senken. +++ Nach sechs Jahren Stillstand nach einem Unwetter ist die Kunsteisbahn am Königssee saniert, und im Winter 2027 kehren Weltcups in Bob, Skeleton und Rodeln zurück, begleitet von Fanangeboten wie Kufenstadl, Konzerten und Familienprogramm. +++ Bad Aiblings Stadtrat hat die Entscheidung über den umstrittenen Ein-Euro-Tageskurbeitrag vertagt, weil Zahlen und Antworten etwa zur Therme fehlen; die Gebühr bleibt vorerst bestehen.'
