  title: Live-Gottesdienst zum Tag der Deutschen Einheit aus Sammarei
  subtitle: Am Tag der Deutschen Einheit führt uns die heutige Live-Übertragung nach Niederbayern, in die traditionsreiche Wallfahrtskirche Mariä Himmelfahrt in Sammarei.
  description: "Am Tag der Deutschen Einheit führt uns die heutige Live-Übertragung nach Niederbayern, in die traditionsreiche Wallfahrtskirche Mariä Himmelfahrt in Sammarei.  \nSeit Jahrhunderten kommen Menschen an diesen besonderen Ort, um zu beten und ihre Anliegen vor die Gottesmutter zu bringen. Im Mittelpunkt des festlichen Gottesdienstes stehen heute der Tag der Deutschen Einheit und zugleich der Beginn des Rosenkranzmonats.  \nWir laden Sie herzlich ein, diesen Gottesdienst mit uns mitzufeiern. Und damit geben wir jetzt live weiter nach Sammarei."
