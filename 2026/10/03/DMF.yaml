  description: 'Darsteller: Gerhard Riedmann, Paul Hörbiger, Margot Hielscher. Die charmante Sängerin Sonja Martens ist der Star einer Werbegesellschaft, aber sie will ihren Vertrag nur erneuern, wenn Manager Egon Fehring sie nicht mehr ständig anmacht, sondern erstklassige Auftritte organisiert. In der musikalischen Heimatkomödie wirken u.a. Margot Hielscher, Gerhard Riedmann und Paul Hörbiger mit. Gedreht wurde hauptsächlich entlang der malerischen Achenseestraße und, für Eisenbahn-Nostalgiker interessant, auf der Achenseebahn mit seltenen Aufnahmen der Dampflok 2.'
