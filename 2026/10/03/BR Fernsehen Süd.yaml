  description: |-
    Vor 800 Jahren starb Franz von Assisi. Bis heute gilt er als einer der einflussreichsten Heiligen der Kirchengeschichte - als radikaler Erneuerer, Friedensstifter und Patron der Schöpfung. Seine Botschaft von Einfachheit, Mitgefühl und einem Leben in Verbundenheit mit Mensch, Natur und Gott fasziniert.
