  start: 2026-10-03T05:35:00Z
  stop: 2026-10-03T06:15:00Z
  title: Katastrophen der Erdgeschichte
  subtitle: Planet aus Eis
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Womöglich ist unser Planet vor über zwei Milliarden Jahren vollständig von Eis bedeckt. Könnte frühes Leben für eine der ersten Katastrophen der Erdgeschichte verantwortlich sein?

    Die ersten Mehrzeller entstehen im flachen Urmeer, das die junge Erde einst bedeckt. Schnell entwickeln die einfachen Organismen einen revolutionären Mechanismus: die Photosynthese. Doch der freigesetzte Sauerstoff löst eine verheerende Kettenreaktion aus.
    HD-Produktion
- eventId: 1026263
  start: 2026-10-03T06:15:00Z
  stop: 2026-10-03T07:00:00Z
  title: Katastrophen der Erdgeschichte
  subtitle: Erstes Leben
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Im Paläozoikum, dem Erdaltertum, entsteht erstes komplexes Leben und eine nie da gewesene Artenvielfalt. Doch das größte Massenaussterben der Erdgeschichte verändert alles.

    Während der "Kambrischen Explosion" vor 500 Millionen Jahren entstehen komplexe Lebewesen mit Beinen und Augen. Bizarr geformte Meeresbewohner beherrschen die Ozeane und erobern nach und nach neue Lebensräume. Der evolutionäre Wettlauf beginnt.
    HD-Produktion
- eventId: 1026264
  start: 2026-10-03T07:00:00Z
  stop: 2026-10-03T07:43:00Z
  title: Katastrophen der Erdgeschichte
  subtitle: Das Ende der Dinosaurier
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Über Jahrmillionen beherrschen die Dinosaurier die Erde - bis sie plötzlich aussterben. Doch wie kommt es zu dieser Katastrophe, die unsere Welt für immer verändert?

    Ein Asteroideneinschlag vor 66 Millionen Jahren gilt als wahrscheinlichste Ursache für das Ende der Dinosaurier, das selbst gigantische Kreaturen wie T-Rex und Triceratops betrifft. Doch ist es der Einschlag selbst, der sie auslöscht - oder steckt mehr dahinter?
    HD-Produktion
