    Vor rund 100 Millionen Jahren ein tropisches Meer, heute ein Labyrinth aus Fels: Das Elbsandsteingebirge zeugt von Kräften, die Landschaft und Leben bis heute formen.

    Das Elbsandsteingebirge entsteht durch Ablagerung, Hebung, Brüche und Erosion - über Jahrmillionen geformt zu einer einzigartigen Felsenlandschaft. Doch Klimawandel und menschliche Eingriffe bedrohen zunehmend das empfindliche Gleichgewicht der Region.
    HD-Produktion
- eventId: 1206886
