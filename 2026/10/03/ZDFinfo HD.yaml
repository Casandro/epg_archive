    Die Vulkaneifel steht stellvertretend für die geologische Vielfalt der gesamten Eifel. Unter Hügeln und Kraterlandschaften verbirgt sich ein Naturarchiv, das Hunderte Millionen Jahre umfasst - von Flachmeeren bis zu den Spuren jüngster Naturgewalten.
