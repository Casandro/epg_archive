  description: |-
    Deutschland 2023
    Die Erde unter unseren Füßen ist voller Energie und Leben. Früh nutzt der Mensch fruchtbare Böden und gräbt nach Ressourcen. Doch Vulkane und Erdbeben bedrohen die Städte.

    Denn tief unter der Erde bewegen gigantische Kräfte die Kontinente, pressen Kohlenstoff zu fossilen Brennstoffen und lassen Metalle entstehen. Unsere Geschichte ist geprägt von der Nutzung dieser Ressourcen. Die Zukunft wird zeigen, wie nachhaltig wir das tun.
