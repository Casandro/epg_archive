  title: In Touch mit Dr. Charles Stanley
  subtitle: 'Der Heilige Geist: Erfüllt leben'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Dr. Stanley zeigt anhand von Epheser 5, dass der christliche Glaube im Alltag durch Gottes Geist geprägt und gestärkt wird. Erfüllt zu werden mit dem Heiligen Geist ist kein einmaliges Erlebnis, sondern ein fortwährender Weg: sich immer wieder von Gott neu ausrichten zu lassen und offen für sein Wirken zu bleiben. So wächst unser Glaube und wird in unserem Leben sichtbar.'
  genre:
