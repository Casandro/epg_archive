  title: Erlebt TV
  subtitle: Ich fühlte mich ausgeschlossen
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Ich gehöre nicht dazu." Dieses Gefühl vereint die drei Frauen der heutigen Sendung. Christy Pulis Leben ist geprägt von Gewalt, Missbrauch und Drogensucht. Dies ändert sich erst, als sie ins Gefängnis kommt. Nancy Amoah fühlt sich als Dunkelhäutige von ihrem Umfeld ausgegrenzt. Und Hope Donithan verzweifelt an einem Satz, den sie als Kind von einem Freund gehört hat. (Moderation: Sabine Bhandari / Andreas Waldmann)'
