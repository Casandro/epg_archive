  title: Ein Hauch von Himmel
  subtitle: Henrys Vermächtnis
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Monicas neuer Auftrag führt sie in das Jugendgefängnis, in dem der Junge Alex bis zur Festlegung seines endgültigen Strafmaßes einsitzt. Der Jugendliche war von seinem Mentor Henry Baldwin, einem ehemaligen Bluesmusiker, beim Einbruch in dessen Laden ertappt worden und hatte den alten Mann im Affekt getötet. Erst im Nachhinein merkt Alex, dass er damit den einzigen Menschen verloren hat, der je an ihn und sein musikalisches Talent geglaubt hat. Im Gefängnis gibt es noch mehr zornige und verängstigte junge Männer, die noch nicht herausgefunden haben, wer sie sind. Monica, Tess und ihr Engelkollege Ronald, der aus der Abteilung für Registratur und Aktenaufbewahrung kommt und keinerlei Erfahrung mit Problem-Teenagern hat, bemühen sich, dem Jungen auf den rechten Weg zurückzuhelfen. Doch wie geht man die Sache am besten an? Es ist ausgerechnet Ronald, der Monica auf die zündende Idee bringt ...'
