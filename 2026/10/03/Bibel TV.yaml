  title: ERF Mensch Gott
  subtitle: Wo finde ich Nähe?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Du bist zu nichts zu gebrauchen! Das hört Eva Merg als Kind oft. Als sie fünf Jahre alt ist, erkrankt ihre Oma an Krebs. Plötzlich muss es im Haus ruhig sein. Ihre Mutter ist rund um die Uhr mit der Pflege beschäftigt, für Eva bleibt keine Zeit mehr, ihr fröhliches Wesen ist plötzlich störend, sie soll funktionieren. Als sie älter wird, sucht Eva die fehlende Annahme bei Männern. Doch statt der erhofften Liebe und Nähe erlebt sie viel Ablehnung. Bis eines ihrer Abenteuer sie wachrüttelt.'
