  title: Freude am Leben
  subtitle: Mein Gott kann
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wenn wir sagen: "Mein Gott kann!", aber anderen Dingen im Leben größere Priorität einräumen, kann das zu Enttäuschung führen. Daniel Müller ermutigt zu einem uneingeschränkten Vertrauen zu unserem "Papa" im Himmel, das im Alltag sichtbar wird.'
