  title: Weitersehen
  subtitle: Wer's glaubt, wird selig?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Vertrauen gehört zu unserem Alltag und betrifft alle Lebensbereiche. Den einen fällt es leichter, den anderen fällt es schwerer, zu vertrauen. In welchen Situationen ist Vertrauen besonders wichtig? Und was bedeutet es, auf Gott zu vertrauen, wenn Unsicherheiten oder Mangel zum Leben gehören? Zu Gast ist Präses Dr. Thorsten Latzel. Er erzählt, was er mit Vertrauen verbindet. In dieser Weitersehen-Folge mit Moderator Steve Volke gibt es spannende Hintergrundinformationen zum Thema, eine bewegende Geschichte aus Kambodscha und einen Buchtipp zum Weiterlesen.'
