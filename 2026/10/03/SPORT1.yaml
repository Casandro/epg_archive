  description: 'Die beiden Ruhrpott-Originale Sid und JP geben in den  Folgen des Kultformats "Die PS Profis - Mehr Power aus dem Pott" auf SPORT1 Vollgas: Die beiden Dortmunder Sidney Hoffmann und Jean Pierre Kraemer gehen für SPORT1 auf Gebrauchtwagensuche und können dabei auf weit über hundert Sendungen zurückblicken.'
