  title: Container Wars Pelzige Angelegenheit
  subtitle: Container Wars Pelzige Angelegenheit
  description: 'Ab sofort werden auch im Hafen Geschäfte gemacht: In der neuen Serie "Container Wars" kommt der Inhalt von großen Schiffscontainern aus der ganzen Welt unter den Hammer. In diesem rasanten Business braucht es allerdings nicht nur einen dicken Geldbeutel, sondern auch ein gutes Auge und eiserne Nerven, um Erfolg zu haben. Den Auktionären bleiben nur wenige Minuten, um sich einen ersten Eindruck vom Inhalt der Container zu verschaffen. Daher weiß man auch erst nach der Versteigerung, ob sich das Geschäft gelohnt hat oder nicht. Die Auktionen übernimmt die lokale Berühmtheit John Kunkle, der immer den einen oder anderen Spruch parat hat. Zu den Bietern gehören das israelische Unternehmer-Duo Shlomi und Uzi, der charmante Südländer Jason, die beiden Kalifornier Ty und Mo, der erfahrene Matthew und die ehemalige Schönheitskönigin Deana, die sich in der Männerdomäne behaupten will.'
  widescreen: true
