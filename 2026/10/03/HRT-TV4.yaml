- eventId: 1375500
  start: 2026-10-03T14:30:00Z
  stop: 2026-10-03T14:55:00Z
  title: 'Agenda: Svijet, vanjskopolitički magazin'
  subtitle: Tjedni vanjskopolitički magazin koji informira, približava i analizira svjetske događaje, procese, izazove i prijetnje.
  ageRating: 4
  genre:
  - '160'
  description: Jesu li brojni ratovi i oružani sukobi ogolili slabosti sustava međunarodne pravde? Što mogu sudovi koji bi trebali presuđivati u slučajevima agresije i ratnih zločina? I što nam o tome govore nedavni slučajevi, ispraćaj Ratka Mladića i presude kosovskim čelnicima, više desetljeća nakon zločina? O tome razgovaramo s pravnim stručnjakom i diplomatom, bivšim pomoćnikom i savjetnikom glavnog tajnika UN-a Ivanom Šimonovićem, a donosimo i intervju s bivšom pravnicom u tužiteljstvu Haškog suda za bivšu Jugoslaviju, Andreom Matačić Cayley.
- eventId: 1375501
  start: 2026-10-03T14:55:00Z
  stop: 2026-10-03T15:20:00Z
  title: Druga strana
  subtitle: Koliko košta mentalno zdravlje? Može li to biti porezno priznati odbitak? I kako mjeriti odnos dobivenog novca, slave i društvenog statusa i psihoza, odnosno mentalnih poremećaja?
  ageRating: 4
  genre:
  - '160'
  description: Koliko košta mentalno zdravlje? Može li to biti porezno priznati odbitak? I kako mjeriti odnos dobivenog novca, slave i društvenog statusa i psihoza, odnosno mentalnih poremećaja? Je li briga o mentalnom zdravlju potreba ili novonametnuti luksuz? Jeste li primijetili da je oko vas sve više ljudi koji trebaju psihološku pomoć? Ili su anksiozni ili potišteni, depresivni... ili imaju burnout. Odjednom je postalo društveno prihvatljivo i moderno ići psihologu ili imati svog psihijatra? To se bez ikakve stigme može objavljivati na društvenim mrežama i biti tema razgovora, ali nitko ne voli da se spomene da je završio na psihijatriji. Kako to da naši preci nisu trebali psihološku pomoć, a danas treba svatko? Industrija je ovaj trend prepoznala pa je sve više "životnih učitelja" i samozvanih psihologa koji (naravno za novac) nude on-line terapije, mindfulness, muzikoterapiju i neurofeedback. Je li lokalni župnik bio prvi povijesno priznati i ovlašteni influencer i psihoterapeut? Kakva je njihova uloga danas? Koliko, u digitalnom svijetu, veliku opasnost predstavlja samodijagnoza i liječenje uz pomoć umjetne inteligencije? Kome se obratiti ako posumnjate da vam treba psihološka pomoć? Zašto ljudi odjednom trebaju toliku pomoć? Kolika je cijena? I ako je to tolika društvena potreba, može li terapija biti na "uputnicu HZZO-a"? Ili je industrija zapravo izmislila i nametnula potrebu koja ne postoji? Sve odgovore potražite u Drugoj stani HTV-a. Gošća emisije je Doris Čuržik, klinička psihologinja, doktorica znanosti s područja psihologije, kognitivno-bihevioralna terapeutkinja, edukatorica i supervizorica.
