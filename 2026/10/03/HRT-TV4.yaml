  description: Nedostatak radne snage, smještajnih kapaciteta, sve veće potrebe u dugotrajnoj skrbi za starije. Imamo li rješenja i kakva su za to goruće pitanje? Kako je moguće da neki privatni domovi za starije i dalje rade, unatoč zabrani? Postoji li barem nada da će se odnos države prema privatnim davateljima usluge skrbi izjednačiti s odnosom koji ima prema državnim, županijskim i gradskim domovima i institucijama koje skrbe o starijima? O tome ćemo u Trećoj dobi razgovarati s Pavom Ćorlukom, predsjednikom HUP-ove koordinacije socijalne skrbi i vlasnikom privatne ustanove za skrb o starijima i s predstavnicima Ministarstva rada, mirovinskog sustava, obitelji i socijalne politike.
