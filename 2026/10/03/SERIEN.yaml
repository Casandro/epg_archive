  title: Cedar Cove - Das Gesetz des Herzens - Geheimnisse und Lügen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Geheimnisse und Lügen
  description: Obwohl Olivia Rebeccas Lüge aufgedeckt hat, lässt sie die junge Assistenzstaatsanwältin nicht fallen, sondern gibt ihr eine zweite Chance. Doch Rebecca nimmt Olivias großzügige Geste nicht gut auf. Jack hat indessen das Angebot beim Seattle Courier angenommen und arbeitet an seiner ersten Kolumne, als eine Schreibblockade erleidet und deshalb gleich seine Fähigkeiten als Journalist infrage stellt. US 2013
- eventId: 1371205
