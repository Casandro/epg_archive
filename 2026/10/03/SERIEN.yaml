  title: Cedar Cove - Das Gesetz des Herzens - Versteckspiel
  subtitle: Cedar Cove - Das Gesetz des Herzens - Versteckspiel
  description: Olivia macht sich zunehmend Sorgen über Jacks nächtliche Arbeitsexzesse. Aber nur vor seiner Exfrau Jeri kann Jack seinen Rückfall in die Alkoholsucht zugeben - genau in dem Moment, als Olivia beginnt, Vertrauen in ihre Beziehung zu finden. Eric wird unwiderruflich in Warrens schmutzige Geschäfte verwickelt. Justine und Luke finden erneut einen Weg zueinander, als plötzlich Seth wieder auftaucht. US 2013
