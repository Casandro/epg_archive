- eventId: 1240292
  start: 2026-10-03T09:00:00Z
  stop: 2026-10-03T10:22:23Z
  title: Die Verzauberung
  description: |-
    (Fernsehfilm, DEU/AUT 2006)
    Die Verwechslung der Ferienunterkünfte zweier Familien ist der Startschuss zu einem Abenteuerurlaub  in malerischer Berglandschaft. Beide Elternpaare kommen einander zu nahe und verlieren dabei den angetrauten Partner aus dem Sinn. Im Gefühlsdurcheinander der Erwachsenen alleingelassen, machen sich ihre Kinder auf in die weite Welt und verirren sich. Die Wiedersehensfreude, als die Ausreißer gesund gefunden werden, überdeckt die Turbulenzen von zuvor und alles scheint eitel Wonne. Aber: Die Idylle trügt.
    Mit Katharina Müller-Elmau (Karin), Heio von Stetten (Walter), Katharina Abt (Nelly), Christoph Waltz (Helmut), Sidney Gersina, Lena Meckl (Kathi), Henrike Kresser (Fanny), Max Schulz (Ferdinand), Andreas Buntscheck (Sebastian), Werner Rom (Bauer Hias), Kathi Leitner (Bauerin Thres), Regina Kraml (Arzthelferin), Fritz Egger (Dr.Greil), Martin Walch (Rezeptionist) u.a.
    Drehbuch und Regie: Wolfram Paulus
    Koproduktion BR/ORF
