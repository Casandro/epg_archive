  title: 'betrifft: uns - Reportagen ohne Filter'
  subtitle: Jugendkriminalität - Was hilft wirklich?
  description: "Wielandpark in Wien Favoriten: Ein 12-Jähriger sticht auf drei 15-Jährige ein. Der Fall bringt das Thema Jugendkriminalität erneut in die Schlagzeilen und entfacht die Debatte über den Umgang mit strafunmündigen Tätern: Soll die Strafmündigkeit gesenkt oder die Auszeit-WG ausgeweitet werden? Steigt die Jugendkriminalität tatsächlich und was hilft wirklich dagegen? \n\nFür \"betrifft: uns\" begibt sich Melanie Dzambazov auf die Suche nach Antworten. Sie lernt eine Gruppe straffällig gewordener Jugendlicher vor dem Gefängnis kennen und begleitet sie einen Tag lang. Gemeinsam fahren sie zum Gericht, wo die Jugendlichen ihre Freunde beim Prozess unterstützen. Sie besucht Orte in Wien, an denen Jugendkriminalität sichtbar wird, und spricht mit Anwohnern, Betroffenen und Opfern.\nDie Reportage blickt auf unterschiedliche Ansätze zwischen Strafe und Prävention: Bewährungshilfe, Auszeit-WG und Orientierungshilfe für 10- bis 13-Jährige. Auch Drogenkonsum und die Frage, ob ein härteres Jugendstrafrecht tatsächlich mehr Sicherheit schafft, werden aufgegriffen. Und welche Rolle spielt Migration bei Jugendkriminalität? Ein Blick auf die Kriminalitätsstatistik zeigt: Syrische Staatsangehörige fallen darin besonders auf. Was steckt hinter den Zahlen und was lässt sich tatsächlich aus ihnen ableiten? Melanie Dzambazov spricht mit Vertretern der syrischen Community und fragt, welche Rolle sie selbst bei der Prävention von Jugendkriminalität spielen kann."
  genre:
  - '35'
- eventId: 1248169
  start: 2026-10-03T14:20:00Z
  stop: 2026-10-03T14:45:00Z
  title: Land und Leute
  description: "Bewahren und Erhalten - \"Land und Leute\"-Favoritenwahl startet\n\nTraditionen bewahren, Kulturgut erhalten oder alte Sorten retten: Es gibt beispielhafte Initiativen und Projekte in ganz Österreich, die sich für das Erhalten und Bewahren einsetzen.  \"Land und Leute\" stellt in den nächsten Sendungen jeweils zwei von ihnen vor, aus denen das Fernsehpublikum den \"Land und Leute Favoriten 2026\" wählt. \nDer erste Anwärter auf den Publikumspreis bewahrt Kärntner Volkskultur: Harald Wenzl hat ein jahrhundertealtes Anwesen im Metznitztal geerbt und veranschaulicht hier die Lebenswelt der ländlichen Bevölkerung anno dazumal. Über sechs Jahre hinweg hat er den historischen Stadl auf 1.200m Seehöhe in ein Museum verwandelt. Er tritt an gegen die Retter von Sortenvielfalt in Niederösterreich: Die Arche Noah in Schiltern bei Langenlois ist ein Verein, der seit über 30 Jahren die Vielfalt der Kulturpflanzen bewahrt. Tausende alte und seltene Sorten werden hier gerettet und wieder in die Gärten gebracht. Dabei hilft ein Netzwerk an Erhalterinnen und Erhaltern, die die Samen in ganz Österreich anbauen und vermehren.\n\nWeitere Themen von \"Land und Leute\" am 3. Oktober:\n\nDürreschäden in der Landwirtschaft \nAllein die Hitzewellen von Juni bis Anfang September haben Schäden in der heimischen Landwirtschaft von rund einer Milliarde Euro verursacht. Eine Reportage bei betroffenen Betrieben und der österreichischen Hagelversicherung mit möglichen Lösungsansätzen.\n\nWasserversorgung trotzt Dürre\nEin Vorzeigebeispiel für Wasserversorgung trotz Klimawandels und Dürre liefert ein junger Landwirt im Waldviertel: Mit zwei Wasserrückhaltebecken und einem Drainagebewässerungssystem schafft er es, trotz Hitze die meisten Kulturen zu retten. Er war der einzige Landwirt Europas, der an den heißesten Tagen Karfiol in Bioqualität ausliefern konnte. \n\nElsbeere und Blüten\nBeim Abrebeln der Elsbeeren zusehen oder Getränke aus Blüten und Kräutern verkosten: Ein Lokalaugenschein bei Betrieben in Niederösterreich, die ihre Produkte für Konsumenten und Konsumentinnen erlebbar machen.\n\nRedaktion: Sabine Daxberger\nca.25"
