  title: Bürgeranwalt
  description: "- Späte Lösung: Laurena ist im achten Lebensjahr und hat einen seltenen Gendefekt, der es ihr unmöglich macht, zu sprechen und zu gehen. Unmittelbar neben ihrem Wohnort gibt es in der Steiermark keine spezielle Volkschule. Nachdem Laurena schulpflichtig ist hat sie mit Ihren Eltern eine Schule für Ihre Bedürfnisse im 19 km entfernten Tamsweg in Salzburg ausgewählt. \n- Volksschule Retznei gerettet? Die geplante Schließung der beliebten Volkschule in Retznei in der Südsteiermark sorgte in der Gemeinde Ehrenhausen für Aufregung. 53 Schulkinder besuchten damals die Musikvolksschule mit reformpädagogischem Lehrplan. \n- Darf PVA Gutachten von Betroffenen schwärzen? Christina S. stellt einen Antrag auf Berufsunfähigkeit an die PVA, da sie unter anderem an CFS (Chronic Fatigue Syndrome) erkrankt ist. Eine schwerwiegende Erkrankung, die dazu führt, dass Betroffene ihren Alltag nicht mehr bewältigen können. Ihr Antrag wird abgelehnt. Als die Oberösterreicherin die Gutachten anfordert, die zu dieser Ablehnung geführt haben, erhält sie ein Gutachten, das fast zur Gänze von der PVA geschwärzt wurde."
  genre:
  - '130'
