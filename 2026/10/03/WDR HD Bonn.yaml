  title: Sehen statt Hören
  subtitle: Schläge statt Sprache - Erinnerungen an eine Kindheit im Heim
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'So war das noch bis in die 70er Jahre: Ordensschwestern sollten und wollten für gehörlose Kinder da sein, ihnen ein Zuhause, regelmäßige Mahlzeiten und Zugang zu Bildung bieten. Doch in Wirklichkeit wurden viele Heime zu Orten von Gewalt. Auch im Kloster Hohenwart haben die Kinder Traumatisches erlitten. Wie konnte das geschehen? Lässt sich solch eine Geschichte aufarbeiten? Sehen statt Hören hat Kloster Hohenwart mit den Kindern von damals besucht. Auf den Sehen statt Hören-Sendungsseiten finden Sie zusätzlich Experteninterviews in Gebärdensprache und weiterführende Informationen.'
- eventId: 618407
  start: 2026-10-03T05:50:00Z
  stop: 2026-10-03T06:05:00Z
  title: Erlebnisreisen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Erlebnisreisen sind die Zusammenfassung von Magazinbeiträgen aus der Servicezeit oder kürzere exklusive Reportagen. Die Attraktivität der dargestellten Reiseziele steht im Vordergrund. Nachvollziehbar sind die beschriebenen Routen und Ziele. Deshalb werden praktische Tipps und konkrete Anregungen gegeben.
- eventId: 618468
  start: 2026-10-03T06:05:00Z
  stop: 2026-10-03T06:30:00Z
  title: Die Sendung mit dem Elefanten (735)
  subtitle: Mut macht stark
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Ich bin gut so wie ich bin! Das zu spüren ist für Kinder sehr wichtig. Deshalb singt Eva in ihrem neuen Song davon und sorgt für gute Laune - sogar an schlechten Tagen. Die Quirlies setzen sich für den Traum vom Maulwurf ein: Sie basteln ihm eine besonderen Brille, damit er endlich ein Stunt-Maulwurf sein kann. Und Malou und Matti zeigen beim Kickbox-Training wie stark sie sind. \nMehr Mutmach-Geschichten gibt es in dieser elefantastischen Folge."
