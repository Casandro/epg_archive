  title: 'Die Sendung mit der Maus: Klima (Teil 1)'
  subtitle: Wetter, Klima, Mensch
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lach- und Sachgeschichten, heute - mit Deutschlands höchstgelegener Wetterstation, Katis kaputtem Regenschirm, dem Trick mit dem Feuer machen - und natürlich mit der Maus und dem Elefanten.

    Zum Start der Sommerreise erfahren Clarissa und Ralph auf der Forschungsstation Schneefernerhaus wie hier Wetterbeobachtungen gemacht werden. Julian Merker, Wetterwart beim Deutschen Wetterdienst, zeigt den beiden, wie hier Wetterdaten erfasst werden. Laura besucht das Gasometer in Oberhausen und erklärt dort, was das Wetter mit dem Klima zu tun hat und wie die Klimazonen auf der Welt aussehen.
- eventId: 618547
  start: 2026-10-03T11:30:00Z
  stop: 2026-10-03T11:55:00Z
  title: 'Die Sendung mit der Maus: Klima (Teil 2)'
  subtitle: Energie
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In der zweiten Folge der Sommer-Sachgeschichten-Reihe erfährt Clarissa von Michael Elsasser vom Umweltbundesamt, wie im Schneefernerhaus der CO2-Wert gemessen wird. Bei ihren Messungen haben die Forscher:innen festgestellt, dass sich immer mehr CO2 in der Atmosphäre ansammelt. Deshalb braucht es Alternativen zur Energiegewinnung. Das Maus-Team verschafft sich einen Überblick und schaut sich eine schwimmende Solaranlage in einem Baggersee an. Laura reist außerdem nach Salzgitter und erfährt hier mehr über eine neue Elektrolyseanlage - eine Methode zur Gewinnung von Wasserstoff, die für die Stahlindustrie genutzt werden kann.
- eventId: 618548
  start: 2026-10-03T11:55:00Z
  stop: 2026-10-03T12:25:00Z
  title: 'Die Sendung mit der Maus: Klima (Teil 3)'
  subtitle: Bauen und Wohnen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lach- und Sachgeschichten, heute - mit Ralph und Riccardo in der Zugspitze, Anke auf einer Stuhlpyramide, einer neuen Idee für Platten aus Beton, einer Baustelle auf der Farm - und natürlich mit der Maus, dem Elefanten und der Ente.

    Ralph ist heute mit Riccardo Scandroglio verabredet - gemeinsam begeben sie sich in einen Tunnel, der mitten in die Zugspitze führt. Im Permafrostbereich erklärt Riccardo die Auswirkungen der Erderwärmung auf den Berg, die selbst dort spürbar sind. Clarissa will mehr darüber wissen, wie Wärmedämmung an Häusern beim Energie sparen hilft.
