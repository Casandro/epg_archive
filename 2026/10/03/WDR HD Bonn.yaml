  audiodesc: true
  description: In jeder Folge stellen nordrhein-westfälische Tierschutzvereine ausgesetzte oder in Tierheimen abgegebene Tiere vor, um sie an tierliebe Zuschauer zu vermitteln. Im Mittelpunkt stehen die beliebtesten Haustiere, Hunde und Katzen, aber auch Vögel, Kleintiere, Pferde und Hausschweine suchen via Bildschirm ein gutes und vor allem dauerhaftes, neues Zuhause.
- eventId: 618471
