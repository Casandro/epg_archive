  description: "Lach- und Sachgeschichten zum 50. Geburtstag im Jahr 2021 - mit der Maus in 30 Minuten durch die 00er Jahre. \n* Was denkst du über Liebe?\n* 2005 - die Maus sucht mit der Aktion \"\"Frag doch mal ......\" die meist gestellten Kinderfragen und beantwortet in dieser Sachgeschichte die Nummer 1: Warum ist der Himmel blau?\n* Weißt du wie der Sommer riecht?\n* 2006 - Deutschland im WM-Fieber und die Maus zeigt das erste Match noch vor dem offiziellen Start: \nWM im Liegen\n* Sonnenblumen drehen\n* 2007 - Shaun heißt das neueste Mitglied der Maus-Familie. Von der ersten Folge an määht sich das Schaf in alle Herzen:"
