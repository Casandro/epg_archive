  subtitle: Emisija "Doživeti stotu" Prvog programa Radio Beograda već sedamnaest godina donosi intervjue i reportaže posvećene starijoj populaciji.
  description: Emisija "Doživeti stotu" Prvog programa Radio Beograda već sedamnaest godina donosi intervjue i reportaže posvećene starijoj populaciji. U razgovorima s istaknutim stručnjacima iz oblasti socijalne politike, ekonomije, medicine, kulturnog, javnog i sportskog života, emisija se bavi svim aspektima života trećeg doba. Osvrće se na probleme o kojima se malo govori, daje psihološku podršku, korisne informacije o tome gde i kada se može dobiti pomoć, ali i ukazuje na prikriveno i otvoreno zanemarivanje starijih ljudi. Sadrži i redovnu zdravstvenu rubriku koja ima informativni, edukativni i savetodavni karakter u vezi sa nekom bolešću, stanjem, poremećajem ili sezonskom epidemijom.
