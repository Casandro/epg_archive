  description: "Annette Kramer (Annette Frier) und Ehemann Ingolf (Christoph Maria Herbst) sind jetzt Eltern - allerdings noch nicht auf dem Papier. Das Jugendamt gibt ihnen das Sorgerecht für den 14-jährigen Ole (Nico Ramon Kleemann) erst einmal nur auf Probe. Dass die vielbeschäftigte Hoteldirektorin ebenso wie der ausgebuchte Psychotherapeut in ihren Berufen kürzertreten sollten, wollen beide zunächst nicht wahrhaben. \n\nWährend der recht selbständige Waisenjunge Ole, dem es in seiner neuen Familie auf Anhieb gefällt, zunächst gut klarkommt, führt das Jugendamt genau Protokoll über die Versäumnisse der Pflegeeltern."
