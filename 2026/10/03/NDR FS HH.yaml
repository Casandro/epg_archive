  description: Lach- und Sachgeschichten, heute mit Clarissa im Kuhstall, Evas-Lied vom Schwabbel-Schweinchen, Lauras spritziger Erfindung, einer Wasserrutsche auf der Farm - und natürlich mit der Maus, dem Elefanten und der Ente.
- eventId: 619088
  start: 2026-10-03T05:30:00Z
  stop: 2026-10-03T06:00:00Z
  title: Sehen statt Hören
  subtitle: Schläge statt Sprache - Erinnerungen an eine Kindheit im Heim
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'So war das noch bis in die 70er Jahre: Ordensschwestern sollten und wollten für gehörlose Kinder da sein, ihnen ein Zuhause, regelmäßige Mahlzeiten und Zugang zu Bildung bieten. Doch in Wirklichkeit wurden viele Heime zu Orten von Gewalt. Auch im Kloster Hohenwart haben die Kinder Traumatisches erlitten. Wie konnte das geschehen? Lässt sich solch eine Geschichte aufarbeiten? Sehen statt Hören hat Kloster Hohenwart mit den Kindern von damals besucht. Auf den Sehen statt Hören-Sendungsseiten finden Sie zusätzlich Experteninterviews in Gebärdensprache und weiterführende Informationen.'
- eventId: 619123
  start: 2026-10-03T06:00:00Z
  stop: 2026-10-03T06:30:00Z
  title: Unerwäis - Unterwegs mit Friesen
  subtitle: Sprünge übers Meer mit Kite-Profi Marret Zielke
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nie wieder ohne: Marret "Mizzy" Zielke (30) lebt vom und fürs Kitesurfen. Dabei hat sie als Kind mit Wassersport nichts am Hut gehabt, obwohl sie auf Föhr geboren und aufgewachsen ist. Nach der Schulzeit will sie nichts wie weg von der Insel und arbeitet dennoch heute jeden Sommer genau dort: am Nordseestrand ihrer Heimatinsel als Kitelehrerin. Die Winter verbringt sie in Spanien und springt am Kitehotspot Tarifa meterhoch über die Wellen. Ein Leben auf Friesisch mit Sonne, Wind und hohen Sprüngen.'
- eventId: 619124
  start: 2026-10-03T06:30:00Z
  stop: 2026-10-03T07:00:00Z
  title: Tietjen campt - der Roadtrip
  subtitle: Zum Schluss ans Meer - das Finale
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Für Bettina Tietjen und ihre prominenten Mitcamper steht das Ziel ihres Trips von Norderney in die niederländische Provinz Zeeland nun kurz bevor. Wer hat sich vom Campingenthusiasmus der "Reiseleiterin" anstecken lassen und wer entpuppt sich weiterhin als Camping-Skeptiker?
     Mit dabei: Schauspieler Sven Martinek, Boxlegende Regina Halmich, Moderator Jochen Schropp, Olympiasieger Matthias Steiner und Moderatorin und Podcasterin Evelyn Weigert.
