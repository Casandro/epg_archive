  title: TV lica...
  subtitle: Dubravka Mijatović je bila gošća u emisiji "TV lica kao sav normalan svet" na početku ovog serijala, pre 23 godine.
  description: Dubravka Mijatović je bila gošća u emisiji "TV lica kao sav normalan svet" na početku ovog serijala, pre 23 godine. Od tada je pristala na samo nekoliko intervjua vezanih za projekte u kojima je radila jer joj je uvek gluma bila važna a ne popularnost koja ide uz taj poziv. U ovoj emisiji zajedno sa mlađom ćerkom Sarom Madžgalj govori o roditeljstvu, o tome kako će reagovati ako ona krene stopama svojih roditelja, o starijoj Ivi koja je uspešna u poslu kojim se bavi uz podsećanje na prethodnu emisiju u kojoj je bila mala. Uz obilje inserata, od Dubravkinog debija u seriji "Vaga za tačno merenje" preko filma "Nije lako s muškarcima" i popularnosti koja je došla u seriji "Bolji život" govori o sreći što je imala priliku da radi sa Mijom Aleksićem, Milenom Dravić, Ljubišom Samardžićem i brojnim velikanima našeg glumišta.
- eventId: 1352343
