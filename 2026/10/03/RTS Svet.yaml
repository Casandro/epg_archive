  description: 'Da li muzika može da postavi pitanje? Da li se na takvo pitanje odgovara tišinom, tonom ili možda slikom? Biće dovoljno nekoliko tonova da bi se naši takmičari sreli sa junacima serija za decu i pronašli način da muzici daju pravi odgovor. Di- džej četvrte epizode je Ognjen Mićović i to u subotu, 3. oktobra 2026. godine u 11č na Prvom programu Televizije Srbije. Sa jedne strane su učenici Osnovne škole "Jovan Jovanović Zmaj" iz Novog Pazara, dok drugi tim čine učenici Osnovne škole "Vasa Živković" iz Pančeva. Na početku svake epizode Ognjen timovima daje imena. Učenici iz Novog Pazara su Ognjenu zadali velike, ali slatke muke. Jednostavno, izbora je bilo mnogo jer su i grad i čovek po kome škola nosi ime pojmovi sa mnogo značenja: Novi Pazar je raskrsnica kultura, mesto gde postoji velika tvrđava... Novi Pazar je poznat i po hrani ? mantijima i ćevapima. A sa druge strane, Jovan Jovanović Zmaj ? borac za slobodu. Postoji priča da je i nadimak Zmaj dobio tako što se, srećan zbog...'
