  description: Radnja televizijskog filma Ilka, obrađuje manje poznatu epizodu iz srpske istorije o neuspelom atentatu na kralja Milane u porti Saborne crkve u Beogradu, poznatu pod imenom Ilkin atentat. Mladi knez Milan Obrenović, budući kralj Srbije, odmah po dolasku na vlast kreće u oslobađanje južnih srpskih gradova od Turaka. Tokom rata, u vojsci izbija pobuna koju je istorija zabeležila kao Topolsku bunu. Kao organizatori i podstrekači pobune optuženi su neki viđeniji ljudi iz političkog života Srbije i vojni komandanti, a među njima i Jevrem Marković, heroj oslobodilačkih ratova, poznat po svom antidinastičkom stavu. Preki vojni sud ga po kratkom postupku osuđuje na smrt streljanjem. Nekoliko godina iza tog događaja supruga Jevrema Markovića, Jelena Ilka Marković, u Porti Saborne crkve, iz revolvera puca na kralja Milana. Televizijski film Ilka je priča o velikoj ljubavi i osveti jedne žene koja je svojom akcijom mogla da promeni tok istorije. To je i priča o surovim dinastički...
