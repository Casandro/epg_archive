  title: Archiwista - odc. 4 (seria I, odc. 4) Nie całkiem ślepa temida
  description: |-
    serial kryminalny (Polska, 2020) odc.4, Nie całkiem ślepa Temida
    Występują: Henryk Talar, Paulina Gałązka, Mirosław Zbrojewicz, Rafał Mohr, Maria Gładkowska, Sylwia Juszczak-Krawczyk, Beata Fido, Mateusz Kmiecik, Angelika Kurowska, Jan Wieczorkowski
    Henryk natrafia w archiwum na teczkę ze sprawą morderstwa prokuratora Dariusza Zwolińskiego. Z jego mieszkania pełnego biżuterii i antyków zginął jedynie klaser ze starymi monetami. Dzięki pomocy brata Zuza trafia na ich ślad w darknecie, miejscu półlegalnego handlu, i umawia się z jednym z jego użytkowników, Wojtkiem.
    Reżyser: Maciej Żak
    Od lat: 16
