  title: Samochodzik i templariusze - odc. 4/5 Podziemny labirynt
  description: |-
    Tytuł oryginalny: Samochodzik i templariusze
    PL, 1971
    Reżyseria: Hubert Drapella
    Występują: Stanisław Mikulski, Grażyna Marzec, Ewa Szykulska, Tomasz Samosionek, Stefan Niemierowski, Roman Mosior
    Pan Tomasz i jego mali pomocnicy przeczuwają, że wkrótce wyjaśni się tajemnica skarbu templariuszy. Pan Petersen i jego córka Karen również nie dają za wygraną. Dwie konkurujące ze sobą ekipy zjawiają się w małym miasteczku na Suwalszczyźnie, gdzie znajdują się ruiny średniowiecznego zamczyska. Pan Samochodzik i harcerze schodzą do podziemi, pilnie wypatrując na murach tajnych znaków templariuszy. Chłopcy trafiają na ślad podziemnego labiryntu.
  ageRating: 7
  genre:
  - '18'
  subtitle: Dwa konkurujące ze sobą zespoły zjawiają się w miasteczku na Suwalszczyźnie, gdzie znajdują się ruiny średniowiecznego zamku. Harcerze trafiają na ślad podziemnego labiryntu.
- eventId: 1232584
  start: 2026-10-03T10:40:00Z
  stop: 2026-10-03T11:15:00Z
  title: Samochodzik i templariusze - odc. 5/5 Skarb Templariuszy
  description: |-
    Tytuł oryginalny: Samochodzik i templariusze
    PL, 1971
    Reżyseria: Hubert Drapella
    Występują: Stanisław Mikulski, Grażyna Marzec, Ewa Szykulska, Tomasz Samosionek, Roman Mosior, Stefan Niemierowski
    W podziemnym labiryncie Pan Samochodzik wpada w pułapkę. W lochu natyka się na szkielet człowieka, który zapewne poszukiwał skarbu templariuszy przed wiekami, tak jak on teraz. Pan Tomasz wie jednak, że zakonnicy byli mistrzami w budowaniu tajemnych przejść, nie traci więc nadziei, że uda mu się znaleźć wyjście z podziemia. Nieoczekiwanie przychodzi mu z pomocą Karen Petersen, która wraz z ojcem i kuzynem, ślamazarnym Michałem, wytrwale podąża tropem skarbu.
  ageRating: 7
  genre:
  - '18'
  subtitle: Samochodzik wpada w pułapkę. Nieoczekiwanie z pomocą przychodzi mu Karen Petersen, która wraz z ojcem i kuzynem podąża tropem skarbu. Wdzięczny pan Tomasz postanawia działać razem z konkurencją.
