  title: M jak miłość - odc. 1934
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Sylwester Jakimow
    Występują: Teresa Lipowska, Krystian Wieczorek, Mikołaj Roznerski, Maurycy Popiel, Ilona Janyst, Adriana Kalska
    Jabłoński wraca do Polski i urządza zasadzkę na Paulinę, gotów żonę odurzyć narkotykami i porwać. Na drodze gangstera znów staje jednak Magda. Z kolei Kamil spędza popołudnie u Zduńskich, pomagając przyjaciołom w opiece nad dziećmi i walcząc z prawdziwym chaosem na Deszczowej. Paweł postanawia natomiast obejrzeć w końcu nagrania pozostawione przez Frankę i poznać jej ostatnie słowa nagrane dla męża i synka. W tych trudnych chwilach znów Zduńskiego wspiera Agnes.
  ageRating: 12
  genre:
  - '23'
  subtitle: Paweł i Agnes spędzają wspólnie noc. Zduński ogląda filmy nagrane przed śmiercią przez Frankę. Magda spotyka w bistro bandytę, który działa na zlecenie Jabłońskiego. Igor wraca do Polski.
- eventId: 1232629
  start: 2026-10-03T16:20:00Z
  stop: 2026-10-03T17:20:00Z
  title: Alternatywy 4 - odc. 4/9 - Profesjonaliści
  description: |-
    Tytuł oryginalny: Alternatywy 4
    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Zofia Czerwińska, Bożena Dykiel, Kazimierz Kaczor, Wojciech Pokora, Mieczysław Voit, Roman Wilhelmi
    Jedną z lokatorek bloku przy Alternatywy 4 jest śpiewaczkaKubiak - Kolińska. Jej próby głosu stają się uciążliwe dla sąsiadów. Śpiewaczce z kolei przeszkadza każdy szmer, wysyła więc męża, byuciszał robotników używających wiertarek, młotów i innych narzędzi. Gdy interwencje nie skutkują, z zemsty każe wszelkie prace w swoimmieszkaniu wykonywać nocą. Cichocki nieustannie nachodzi prezesa, jego koledzy udają ekipętelewizyjną.
  ageRating: 12
  genre:
  - '20'
  subtitle: Codzienne ćwiczenia głosu sprawiają, że sąsiedzi śpiewaczki Kolińskiej mają jej dosyć. Cichocki może wkrótce dostać upragnione mieszkanie. Niestety, na drodze staje dygnitarz partyjny Winnicki.
