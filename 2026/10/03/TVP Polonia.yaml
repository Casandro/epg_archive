  title: Okrasa łamie przepisy - Cuda, czyli ciasta na kiju
  description: |-
    Tytuł oryginalny: Okrasa łamie przepisy
    PL, 2025
    Reżyseria: Tomasz Rostworowski
    Karol Okrasa kontynuuje poszukiwania polskiego smaku. A kiedy już ten smak odnajduje, ze smakiem i pożytkiem dla konserwatywnej polskiej widowni, próbuje go przełamać. Bo wbrew powszechnym wyobrażeniom polska kuchnia to nie tylko pierogi i schabowy. Mamy wielowiekową tradycję podawania ryb, szczególnie słodkowodnych, a polskie mięsa i wędliny biją jakością większość europejskiej produkcji.
  genre:
