  title: Ranczo s.III - odc. 39 (seria III, odc. 13) - Szczęśliwe rozwiązanie
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2008
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Grzegorz Wons, Artur Barciś, Marta Lipińska
    Do konfesjonału ustawia się kolejka kobiet, a w kolejce wszystkie, z którymi polonista przeprowadzał wywiady. Kiedy spowiedź się kończy, ksiądz jak bomba wypada z konfesjonału i pędzi do polonisty. Witebski dostaje dożywotni zakaz rozmawiania z kobietami o ich duszy, ze wszystkimi tego konsekwencjami, bo inaczej ksiądz osobiście wyrwie mu nogi z tego miejsca, w którym są.
  ageRating: 12
  genre:
  - '23'
  subtitle: W kolejce do konfesjonału ustawiają się panie, z którymi polonista przeprowadzał wywiad. Po spowiedzi ksiądz zabrania rozmawiać Witebskiemu z kobietami na temat duszy.
- eventId: 1232561
  start: 2026-10-03T01:10:00Z
  stop: 2026-10-03T01:40:00Z
  title: Tańcząca ze światem - Tunezja - Touzer
  description: |-
    Tytuł oryginalny: Tańcząca ze światem
    PL, 2023
    Reżyseria: Piotr Poraj-Poleski
    Egzotyczna Tunezja to tak lubiane przez turystów piękne plaże, ciepłe i turkusowe morze, ale również piaski Sahary i zielone, życiodajne oazy. Jednym z takich niesamowitych, zielonych ogrodów zachwycających bujnością i różnorodnością roślin jest oaza Touzer. Rośnie tam kilkanaście tysięcy palm daktylowych, ale oprócz daktyli można skosztować również granatów, bananów, oliwek czy fig. Dojrzewające w gorącym, tunezyjskim słońcu owoce są niezwykle soczyste i słodkie.
  ageRating: 12
  subtitle: W programie widzowie zobaczą tętniący gwarem, niezwykle barwny targ w starej części miasta Touzer. Będą mieli okazję zobaczyć, jak gotuje się tradycyjne tunezyjskie danie z kuskusem.
  genre:
  - '35'
