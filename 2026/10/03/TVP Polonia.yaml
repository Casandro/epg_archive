    Po wspólnym spacerze po lesie Henryk podsuwa Zuzi kolejną sprawę sprzed lat. Tym razem chodzi o zabójstwo dziennikarza śledczego. Igor Sommer został postrzelony podczas polowania, które obserwował z ukrycia. Pewnie można by było uznać to za nieszczęśliwy wypadek, gdyby nie fakt, że kula, która utkwiła w ciele mężczyzny, nie pasowała do broni żadnego z myśliwych. Wasiluk jedzie do mieszkania pielęgniarki, która rozmawiała z dziennikarzem tuż przed jego śmiercią.
