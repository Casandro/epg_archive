    Kloss otrzymuje zadanie wydobycia planów nowych konstrukcji wojskowych od przebywającego w Warszawie prof. von Henninga. Sturmbannfuehrer Lothar podejrzewa o zdradę kapitana Willego Ruperta, który pije i przegrywa duże sumy. Kloss uwodzi córkę profesora, Benitę, by w jej towarzystwie dostać się do willi. Kiedy wydaje mu się, że Benita jest pod działaniem środka usypiającego i on może już przystąpić do swojej roboty, dziewczyna bierze go na muszkę.
