  title: M jak miłość - odc. 1934
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Sylwester Jakimow
    Występują: Teresa Lipowska, Krystian Wieczorek, Mikołaj Roznerski, Maurycy Popiel, Ilona Janyst, Adriana Kalska
    Jabłoński wraca do Polski i urządza zasadzkę na Paulinę, gotów żonę odurzyć narkotykami i porwać. Na drodze gangstera znów staje jednak Magda. Z kolei Kamil spędza popołudnie u Zduńskich, pomagając przyjaciołom w opiece nad dziećmi i walcząc z prawdziwym chaosem na Deszczowej. Paweł postanawia natomiast obejrzeć w końcu nagrania pozostawione przez Frankę i poznać jej ostatnie słowa nagrane dla męża i synka. W tych trudnych chwilach znów Zduńskiego wspiera Agnes.
  ageRating: 12
  genre:
  - '23'
  subtitle: Paweł i Agnes spędzają wspólnie noc. Zduński ogląda filmy nagrane przed śmiercią przez Frankę. Magda spotyka w bistro bandytę, który działa na zlecenie Jabłońskiego. Igor wraca do Polski.
