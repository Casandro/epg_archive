  title: ARD-Opernabend
  description: "ARD-Oper\n\nMatthias Pintscher: Das kalte Herz\n\nOper in 12 Bildern (2026)\nMusik von Matthias Pintscher\nText von Daniel Arkadij Gerzenberg\n\nPeter: Samuel Hasselhorn      \nAnubis: Rosie Aldridge\nMutter: Katarina Bradic      \nClara: Sophia Burgos      \nAzael: Sunnyi Melles      \nAlte Frau: Adriane Queiroz      \nKind: Otto Glass* / Richard Székely* (Mitglieder des Kinderchors der Staatsoper Unter den Linden)\n\nStaatskapelle Berlin\nLeitung: Matthias Pintscher\n \n(Aufnahme v. 11.01.2026, Berlin, Staatsoper)\n\nMit \"Das kalte Herz\" feiert am 11.01.\n\nARD-Oper\n\nMatthias Pintscher: Das kalte Herz\n\nOper in 12 Bildern (2026)\nMusik von Matthias Pintscher\nText von Daniel Arkadij Gerzenberg\n\nPeter: Samuel Hasselhorn      \nAnubis: Rosie Aldridge\nMutter: Katarina Bradic      \nClara: Sophia Burgos      \nAzael: Sunnyi Melles      \nAlte Frau: Adriane Queiroz      \nKind: Otto Glass* / Richard Székely* (Mitglieder des Kinderchors der Staatsoper Unter den Linden)\n\nStaatskapelle Berlin\nLeitung: Matthias Pintscher\n \n(Aufnahme v. 11.01.2026, Berlin, Staatsoper)\n\nMit \"Das kalte Herz\" feiert am 11.01.2026 eine neue Oper komponiert von Matthias Pintscher\nund geschrieben von Daniel Arkadij Gerzenberg Premiere - inspiriert von Wilhelm Hauffs\nMärchenklassiker von 1827. \nIm Zentrum steht das Herz als Ort menschlicher Gefühle, der daher immer wieder von verschiedenen Kräften begehrt und umkämpft wird. Gerzenberg nutzt den Wald als Kulisse für die Sehnsüchte, Ängste und die komplexe Gefühlswelt der Menschen.\nAuch der geheimnisvolle und überwältigende Klang des Werkes entführt uns in die unheimlichen Tiefen des menschlichen Seins."
