  title: Mezi nebem a zemí
  description: Zamíříme do pražské zoo, kde někteří návštěvníci z exotických zemí vnímají zvířata posvátně, modlí se k nim a meditují i na relaxačních místech. 3D modely unikátních umělých jeskyní zdobených ametysty z kroměřížského zámku si můžou prohlédnout návštěvníci olomoucké Pevnosti poznání v nové expozici. Už 10. října bude slavnostně předána historicky úplně první Cena Josefa Zvěřiny. A pravidelné zamyšlení je od Sandry Silné, husitské farářky z Brna.
