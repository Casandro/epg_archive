  title: Scheunenschätze - Neues von alten Traktoren und ihren Besitzern
  subtitle: 'Moderation: Beate Bastian'
  description: 'Eine Ladepritsche auf drei Rädern nannten Spötter den Dieselzwerg der Firma Kühner & Berger. Für Kevin Wölfle aus Sasbach ist er die Erfüllung seines Kindheitstraumes. Sein Name steht für eine ganze Traktoren-Dynastie: Wenn man in die Scheune von Hans Kramer blickt, scheint es, als sei die Welt für einen Moment stehen geblieben. Vom Prototyp bis zum Schwungrad-Schlepper steht hier alles - in Gutmadingen. Den kennt heute kaum mehr jemand: Ladog - Leichte Arbeit durch ordentliches Gerät. So lautet der Name des Dreirad-Schleppers von Helmut Rombach. Der SWR hat wieder "Scheunenschätze" gesucht und ist fündig geworden.'
