  title: Tiere auf dem Land - Erinnerungen an das Dorfleben im Südwesten
  description: 'Das Zusammenleben von Menschen und Tieren auf engstem Raum, in Notzeiten und in guten Jahren, prägte früher das Aufwachsen der Kinder und das Arbeiten von Generationen auf dem Land. Der Hofhund als Aufpasser und das Pferd als Arbeitstier, dazu Kühe, Schweine, Gänse, Hühner und mehr Mäuse, als allen lieb war. Katze und Kaninchen galten als Nutztiere, doch für die Kinder waren sie auch Spielgefährten und eine Möglichkeit zum Kuscheln. So eng die Bindung an die Tiere auch war, ihr Tod war natürlich: Das Schlachten gehörte selbstverständlich zum bäuerlichen Lebenszyklus.'
