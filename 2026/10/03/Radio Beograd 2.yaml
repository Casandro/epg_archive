  title: Dramski program
  subtitle: Judita Šalgo bila je jugoslovenska književnica i konceptualna umetnica, čije je neoavangardno stvaralaštvo donelo velike iskorake na vojvođanskoj umetničkoj sceni još od sedamdesetih godina 20.
  description: Judita Šalgo bila je jugoslovenska književnica i konceptualna umetnica, čije je neoavangardno stvaralaštvo donelo velike iskorake na vojvođanskoj umetničkoj sceni još od sedamdesetih godina 20. veka. Bila je i urednica čuvene "Tribine mladih", koja je negovala glasove eksperimentalnih umetnika, kasnije i urednica "Matice srpske". Sa posebnim fokusom na toponim Birobidžan, koji u imaginaciji Judite Šalgo predstavlja prostor istraživanja ženskog identiteta, heroinino putovanje u nepoznato, i potraga za domom, za "ženskim kontinentom", sagovornici u emisiji istražuju i ostale elemente njenog stvaralaštva - konceptualne prakse, verbo-voko-vizuelnu poeziju, eseje i kratke proze, od kojih je jedna - "Minotaur", poslužila i kao predložak za istoimeni igrani film Sabolča Tolnaija. Takođe, razmatra se koliko je Judita Šalgo pripadala "ženskom kanonu", i ko bi bile njene potencijalne naslednice u sadašnjoj umetničkoj praksi.
