  start: 2026-10-03T17:05:00Z
  stop: 2026-10-03T17:25:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Western Australia mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen 3 - Western Australia mit Michaela May
  description: 'Western Australia: Kaum eine Destination in der Welt verspricht mehr Abgeschiedenheit und Ursprünglichkeit als der große Bundesstaat im Westen des fünften Kontinents. Kommen Sie mit und begleiten Sie die beliebte deutsche Schauspielerin Michaela May auf ihrer Expedition durch die faszinierenden Landschaften des größten Staates in Down-Under. Die Reise beginnt auf dem Bibbulmun Track, einem Wanderweg der sich fast 1000 Kilometer durch den Westen des Bundesstaates zieht. Der lokale Ranger, mit dem die TV-Kommissarin einen Teil der Wanderung unternimmt, schätzt dass es circa zwei Monate dauern würde, den malerischen Trail von Anfang bis Ende zurückzulegen. Hier, entlang der großen Australischen Bucht, wechseln sich sanft-goldene Strände mit felsigen Küstenabschnitten ab. Der Weg führt außerdem in das ''Valley of the Giants'', in dem Michaela May auf einem ''Tree Top Walk'' die Baumwipfel riesiger Eukalyptusbäume erforscht. Die naturgeschützten Bäume werden mehrere hundert Jahre alt! Der weitere Verlauf der Reise führt nach Perth, der Hauptstadt des Bundesstaates, und in den Nambung-Nationalpark, in dem wundersame Felsformationen, die Pinnacles, aus der roten Erde ragen. Nicht nur Michaela May fragt sich, wie diese Kalksteinfelsen ihren Weg in die Wüste fanden. Nach einem romantischen Busch-Dinner, das auf einer derartigen Reise im Outback Australiens natürlich nicht fehlen darf, sucht die Schauspielerin den Kontakt mit den tierischen Bewohnern des Landes.   DE 2012'
- eventId: 1371142
  start: 2026-10-03T17:25:00Z
  stop: 2026-10-03T17:44:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Neuseeland mit Sophie Schütt
  subtitle: VIP Trip - Prominente auf Reisen 3 - Neuseeland mit Sophie Schütt
  description: 'VIP Trip - Prominente auf Reisen 3: Naturvielfalt am anderen Ende der Welt: Die beiden Inseln Neuseelands könnten unterschiedlicher kaum sein. Während die Nordinsel von Vulkanlandschaften, blubbernden Schwefelquellen und subtropischer Natur geprägt ist, präsentiert sich die Südinsel mit einsamen Fjorden und schneebedeckten Bergen. Die Schauspielerin Sophie Schütt reist in den größten Inselstaat des Südpazifiks, um diese pittoresken Naturlandschaften in Augenschein zu nehmen. Nach einem langen Flug beginnt ihre Reise in den neuseeländischen Alpen. Via Helicopter lässt sie sich auf den Fox-Gletscher fliegen, wo sie mit einem einheimischen Guide, einem echten "Kiwi", die weitläufige Eislandschaft bewandert. Die Szenerie des Landes ist so spektakulär, dass sich selbst fiktive Welten in ihr wiederfinden. Peter Jackson, der Regisseur des Kinohits "Herr der Ringe", nutzte viele Orte der beiden Inseln, um Tolkiens Epos filmisch zu realisieren. Auf dem Original-Filmset des Hobbit-Dorfes findet sich Sophie Schütt in der wunderbaren Welt der Roman-Trilogie wieder. Im weiteren Verlauf ihrer Reise erfährt sie quasi im Schwefeldunst von Rotorua mehr über die Kultur und die Kulinarik der Ureinwohner, der Maori.  Auf der Südinsel besucht Sophie Schütt unter anderem eine Schaffarm. Immerhin ist die Schafzucht dort ein bedeutsamer Wirtschaftszweig. Das Highlight der Reise sollte aber noch folgen: Im Südosten des Landes hat die Schauspielerin die Möglichkeit,  Pinguine, Seelöwen und Wale in ihrer natürlichen Umgebung zu erleben.   DE 2010'
- eventId: 1371143
  start: 2026-10-03T17:50:00Z
  stop: 2026-10-03T18:10:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Hongkong mit Tim Raue
  subtitle: VIP Trip - Prominente auf Reisen 3 - Hongkong mit Tim Raue
  description: 'Begleiten Sie Tim Raue auf einer Reise in das kulinarisch verführerische Hongkong. Der Sternekoch aus Berlin ist ein großer Fan der asiatischen Küche. In der chinesischen Metropole testet er typisch chinesische Gourmetküchen und stöbert durch exotische Märkte. In den Straßen der Stadt  lässt er sich von den fernöstlichen Gerüchen und Geschmäckern inspirieren. Doch Tim Raue sucht nicht nur kulinarische Erlebnisse, sondern auch Einblicke in die kulturelle Vielfalt der chinesischen Selbstverwaltungsregion. Nach einer Fahrt mit der längsten Seilbahn der Welt kommt der TV-Koch auf der Insel Lantau an. Sie ist die größte Insel Hongkongs und beherbergt auch die mächtige Buddhastatue von Tian-Tan, 34 Meter hoch und 250 Tonnen schwer. Bei einem Besuch des schwimmenden Fischerdorfes Tai-O erhält Tim Raue zudem einen Einblick in die Produktion von Garnelenpaste. Zurück auf Hongkong Island und in Kowloon geht er auf die Suche nach Designstücken und Kochutensilien für seine Restaurants in Deutschland. Schließlich freut sich der Fernsehkoch auf ein Essen im weltweit wohl günstigsten Sterne-Restaurant. Dort verkostet er verschiedene Varianten der kantonesischen Spezialität Dim Sum. Wie die Tradition es vorschreibt, wird die dampfende Delikatesse in kleinen Körbchen serviert. Auch vor Hühnerfüßen und typisch chinesischen Schweinerippchen schreckt Tim Raue nicht zurück. Fest steht: Von dieser Reise durch die Metropole am Perlfluss-Delta nimmt Tim Raue zahlreiche kulinarische Anregungen nach Hause mit.   DE 2012'
- eventId: 1371150
  start: 2026-10-03T18:15:00Z
  stop: 2026-10-03T19:06:00Z
  title: Deutschlands Küsten - Von Papenburg bis Bremerhaven
  subtitle: Deutschlands Küsten - Von Papenburg bis Bremerhaven
  description: In der ersten Folge führt die Reise von Papenburg an der Ems vorbei an den ostfriesischen Inseln bis nach Bremerhaven. Die Luftbilder dokumentieren die Besonderheiten des Wattenmeeres und die herbe Schönheit Ostfrieslands. Bewohnt wird dieser Landstrich von einem recht eigensinnigen Menschenschlag. Die Reise entlang der deutschen Küsten beginnt mit einem Besuch der Papenburger Meyer-Werft. Die junge Schweißerin Friedericke Brandt baut hier voller Stolz an einem großen Kreuzfahrtschiff mit. Mit der "Celebrity Equinox", einem frisch getauften Luxusliner, lässt sich das Filmteam durch das Emssperrwerk lotsen. Anschließend fliegt es über Emden bis zur westlichsten deutschen Insel Borkum, deren endlose Sandstrände ein Paradies für Kitebuggy-Fahrer sind. Mit dem Wattführer Kurt Knittel geht es durch das trocken gefallene Watt Richtung Norderney. Und im Städtchen Norden demonstriert Anke Zimmer eine original ostfriesische Teezeremonie. Obwohl die ostfriesischen Inseln bei Ebbe sogar zu Fuß erreicht werden können, sind sie durch die Gezeiten isoliert. Wer eine Fähre verpasst, muss schon mal sechs Stunden auf die nächste Flut warten. Einzige Alternative sind Flugzeuge. Pilot Jan-Lüppen Brunzema versorgt mit seiner Cessna die Inselbewohner mit allem, was sie zum Leben brauchen. Täglich legt er 30 Starts und Landungen hin - bei jedem Wetter. Weiter geht es entlang der Deiche und Kanäle. Aus der Luft lässt sich beobachten, wie zahlreiche Schafe mit spitzen Hufen unermüdlich die Deichnarben fest trampeln. Und dann ragen die Kräne im Hafen von Bremerhaven steil in die Höhe. 50 Millionen Tonnen Ware, mehr als New York oder Le Havre, schlägt der Hafen jedes Jahr um. Vor der imposanten Kulisse des mit fünf Kilometern längsten Containerterminals der Welt endet die Reise entlang der ostfriesischen Küste. DE 2010
- eventId: 1371151
  start: 2026-10-03T19:15:00Z
  stop: 2026-10-03T20:07:00Z
  title: Deutschlands Küsten - Von Bremerhaven bis Hamburg
  subtitle: Deutschlands Küsten - Von Bremerhaven bis Hamburg
  description: In der zweiten Folge folgt das Filmteam der niedersächsischen Nordseeküste von Bremerhaven bis zur Elbmündung und von dort bis in den Hamburger Hafen, Deutschlands Tor zur Welt. Janne Jobus ist Kranfahrerin im Bremerhavener Containerterminal. 40 Container verlädt sie von ihrer gläsernen Kanzel in luftiger Höhe pro Stunde und manövriert die Laufkatze zentimetergenau. Währenddessen lässt sich Erhard Djuren auf einem Hundeschlitten zu seinen Reusen im Watt ziehen. Er ist einer der letzten Reusenkrabbenfischer an der Nordsee. Plötzlich wird das friedliche Watt von Hufgetrappel erschüttert. 150 Teilnehmer zählt das Pferderennen auf dem Duhner Watt. Begeistert beteiligt sich auch Ramona Kosche mit ihrem Halbblut Agatonango, selbst wenn der Parcours eine äußerst nasse und manchmal schlammige Angelegenheit ist. In Drochtersen begegnet das Kamerateam dem Schiffsbauer Sven von Reith, der Freifallboote baut. Alle großen Frachter führen diese orangefarbenen, extrem leichten Boote mit, die Stürze aus bis zu 50 Metern Höhe aushalten und schon unzähligen Menschen das Leben gerettet haben. Über die endlosen Plantagen des Alten Lands, dem größten Obstanbaugebiet Nordeuropas, geht es weiter. Eine Viertelmillion Tonnen Äpfel werden hier dank der fetten Böden jedes Jahr geerntet. Am noblen Blankenese vorbei führt die Reise nach Finkenwerder. Hier wird der A380, das größte Passagierflugzeug der Welt gefertigt. Und entlang der alten Kapitänshäuser in Övelgönne navigiert Hafenlotse Manfred Müller die großen Kähne durch gefährliche Strömungen. Hochkonzentriert gibt er von der Brücke seine Kommandos, Zentimeter für Zentimeter schiebt sich das jeweilige Schiff an die Pier. Mit Flugbildern der Speicherstadt und der Elbphilharmonie, einem neuen Wahrzeichen von Hamburg, endet diese Folge von "Deutschlands Küsten". DE 2010
- eventId: 1371172
  start: 2026-10-03T20:15:00Z
  stop: 2026-10-03T20:44:00Z
  title: Foodwise - The Taste of Home
  subtitle: Foodwise - The Taste of Home
  description: Eva entdeckt in ihrer Heimatstadt Wien ihre Liebe zu einem jahrhundertealten Klassiker wieder. Währenddessen versetzt der bezaubernde Herbst in Peking Tianran in die Vergangenheit zurück und lässt ihn die Aromen seiner Kindheit wiederentdecken. CN 2023
