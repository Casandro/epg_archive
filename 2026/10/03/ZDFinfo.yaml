  title: Die schwersten Unglücke der DDR
  subtitle: Gefährliche Technik vom großen Bruder
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2016
    Die schwersten Unglücke der DDR: für die Staatsführung politisch brisant. Die wahren Hintergründe bleiben häufig unter Verschluss. Tragische Schicksale - und viele offene Fragen.

    Die Dokumentation zeigt eklatante Fälle, teils mit Archivbildern und Aufnahmen von Hobbyfilmern. Im Mittelpunkt einige Beispiele, wo die Technik des großen Bruders Sowjetunion versagte, zum Beispiel bei Flugzeugen und Panzern - mit oft verheerenden Folgen.
    HD-Produktion
