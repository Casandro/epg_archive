  title: Die schwersten Unglücke der DDR
  subtitle: Schuld ist nie der Sozialismus
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2016
    Wenig bekannt, weil vieles vertuscht wurde und Ermittlungen behindert wurden: In der DDR gab es zahlreiche große Unglücke und Katastrophen - viele davon bis heute nicht vollständig aufgeklärt.

    Die Dokumentation "Die schwersten Unglücke der DDR" zeigt eklatante Fälle, teils mit Archivbildern, Aufnahmen von Hobbyfilmern und anhand von Rekonstruktionen mit Augenzeugen.
    HD-Produktion
