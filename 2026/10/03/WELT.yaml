  title: 'Border Patrol Neuseeland: Liebesgrüße aus Litauen'
  subtitle: 'Border Patrol Neuseeland: Liebesgrüße aus Litauen'
  description: 'Rund um die Uhr überwachen Zoll, Biosecurity und Immigration Neuseelands sensible Grenzen. Diese Folge zeigt, wie unterschiedlich Einsätze verlaufen können: Ein verliebter Reisender aus Litauen hofft auf Milde, während Beamte am Flughafen Christchurch eine große Menge geschmuggelter Zigaretten sicherstellen. Gleichzeitig entdeckt die Biosecurity einen versteckten Schädling, der unbemerkt ins Land gelangen wollte.'
