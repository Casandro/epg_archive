  title: Der Lynx - Hightech aus Deutschland
  subtitle: Der Lynx - Hightech aus Deutschland
  description: WELT TV ist der erste TV-Sender weltweit, der die Produktion des Kettenfahrzeugs Lynx von Anfang an begleiten darf. Gedreht wurde in Unterlüss, wo die Prototypen entstanden, und im neuen Werk in Ungarn, das seit 2023 die Serienfertigung übernimmt. Der Lynx beeindruckt mit einer Länge von 8,49 Metern, einem Gewicht von 45 Tonnen. Ausgestattet mit dem Lance-Turm und modernster High-Tech-Technologie, erkennt er feindliche Angriffe und reagiert mit automatischer Zielverfolgung.
