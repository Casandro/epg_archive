  title: Abgefahren - Die spektakulärsten Dashcam Clips (1.1)
  subtitle: Abgefahren - Die spektakulärsten Dashcam Clips (1.1)
  description: 'Nie war auf den Straßen der Erde mehr los als heute: Mehr als eine Milliarde Autos kurven auf unserem Globus inzwischen umher. Dazu kommen Fußgänger, Zweiräder und andere Fahrzeuge. Wen wundert es da, dass es immer mehr Unfälle gibt. Und immer mehr Kameras, die diese festhalten. Die Doku-Reihe zeigt die spektakulärsten und irrwitzigsten Bilder von Karambolagen zwischen China und Chile, Kanada und Kapstadt. Unglaublich, aber wahr: Ernstlich verletzt wurde dabei niemand.'
