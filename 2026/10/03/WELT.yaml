  subtitle: Hubschrauber der Bundeswehr - Technik und Einsatz
  description: Dank ihrer Mobilität und Flexibilität spielen Militärhubschrauber bei Land-, See- und Lufteinsätzen der Bundeswehr eine wichtige Rolle. Sie werden für Transport-, Kampf- und Rettungseinsätze dringend benötigt. Unabhängig von den klimatischen oder geographischen Bedingungen müssen die Maschinen stets zuverlässig und schnell fortbewegt werden können. Die Reportage stellt verschiedene Helikoptermodelle vor und bietet einen Einblick in das Training des Hubschrauber-Geschwaders 64.
