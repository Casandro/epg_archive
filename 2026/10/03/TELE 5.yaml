    Tierra Santa, im 12. Jahrhundert: Der tapfere Kreuzritter Capitán Trueno (Sergio Peris-Mencheta) erhält den Auftrag, den Heiligen Gral zurück nach Spanien zu bringen. Dort soll er die mystische Reliquie dem Orden der Gralswächter übergeben. Doch in Aragon sind böse Mächte am Werk. Sir Black (Gary Piquer) und die Hexenkriegerin Ariadne (Jennifer Rope) rauben den Gral, um Luzifer mit einer okkulten Zeremonie aus der Hölle zu holen. Neben einer mutigen Truppe kämpft auch die Wikingerin Sigrid von Thule (Natasha Yarovenko) Seite an Seite mit dem Capitán für das Gute.
    ESP 2011
