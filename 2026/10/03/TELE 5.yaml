  description: Trzydziestokilkuletnia Maggie Fitzgerald (Hilary Swank) próbuje osiągnąć sukces w kobiecym boksie zawodowym; stara się dostać pod opiekę znanego trenera Frankiego Dunna (Clint Eastwood). Trener odkrywa w niej prawdziwy talent, a zawodniczka rozpoczyna błyskotliwą karierę, nokautując przeciwniczki zwykle w pierwszej rundzie. Podczas walki o mistrzostwo wagi półciężkiej dochodzi do wypadku na ringu...
