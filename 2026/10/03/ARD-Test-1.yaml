  description: "Es muss nicht immer Gotland sein: Auf der Nachbarinsel Fårö bekommt es Kommissarin Maria Wern mit einem verworrenen Fall zu tun, bei dem sie tief in das Beziehungsgeflecht einer abgeschiedenen Dorfgemeinschaft eintaucht. In \"Raues Land\" sind die Intuition und die Menschenkenntnis der erfahrenen Ermittlerin gefordert, denn schon bald gibt es zwar eine Vielzahl an Verdächtigen und Motiven, doch keine konkreten Spuren. \n\nDer Film präsentiert sich als klassisches \"Whodunit\" zum Mitfiebern, dem die subtile Regiearbeit von Johan Lundin einen melancholischen Unterton verleiht."
