  title: Maria Wern, Kripo Gotland - Raues Land
  subtitle: Fernsehfilm Deutschland/Schweden 2020 (Maria Wern - No Boundaries)
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
