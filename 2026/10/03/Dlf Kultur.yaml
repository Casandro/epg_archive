  title: Hörspiel
  description: "Tallhover (1/2)\nNach dem Roman von Hans Joachim Schädlich \nBearbeitung: Christoph Gahl \nRegie: Norbert Schaeffer \nMit: Werner Eichhorn, Lothar Blumhagen, Uta Hallant, Werner Rehm, Klaus Herm, Gert Haucke, Chajim Koenigshofen, Edith Hancke, Susanne Lüpertz, Gerd Wameling, Peter Fitz, Dirk Nawrocki, Eric Vaessen, Brigitte Mira, Fritz Eggert, Herbert Stass, Bernd Ludwig \nTon und Technik: Hans Martin, Sabine Lindner \nRIAS Berlin 1989 \nLänge: 68?16\n\nTeil 2 am 04.10.2026, 18.30 Uhr\n\nEin Leben für die Geheimpolizei: Ludwig Tallhover arbeitete für Preußen, den NS-Staat und die DDR. Der fiktive Offizier, der seit seiner Geburt im Jahr 1819 durch die Epochen hinweg im Dienst aller deutschen Geheimdienste stand, macht sich vor einem imaginären Gericht selbst den Prozess. Sein zentraler Vorwurf: Versagen und mangelnde Härte bei der Verfolgung von politischen Gegnern."
