  stop: 2026-10-03T10:25:00Z
  title: Ludzkość - historia nas wszystkich 1 (odc. 9)
  subtitle: Ludzkość rozpoczyna nowy etap podbojów. W Ameryce Północnej, na Syberii i w Australii stare tradycje wypierane są w imię rozwoju handlu i nauki.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Virginia Quinn
    Występują: Sam Sheridan, John Shea, Theodore Van Alst, Eric Jay Dolin, George Wunderlich, Richard Machowicz
    Ludzkość rozpoczyna nowy etap podbojów - ich ofiarą padają kolejne obszary dzikiej przyrody. Miejsca, gdzie człowiek żył w zgodzie naturą coraz bardziej się zmieniają. W Ameryce Północnej, na Syberii czy w Australii stare tradycje wypierane są w imię rozwoju handlu i nauki. W ciągu jednego stulecia irracjonalne lęki ustępują gloryfikacji rozumu ?? Ameryka, w której możliwe były procesy czarownic, zmienia się w kolebkę rewolucyjnych i wolnościowych dążeń.
  ageRating: 7
  genre:
  - '35'
