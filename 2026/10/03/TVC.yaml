  title: Pierwsi ludzie 1 (odc. 5)
  subtitle: 'Największym wyzwaniem stojącym przed naszymi przodkami było zasiedlenie Ameryki: droga wiodła przez tereny pokryte lodem. Czy dzisiejsi rdzenni Amerykanie to bliscy krewni tamtych osadników?'
  description: |-
    Tytuł oryginalny: First Peoples
    GB,US,FR, 2015
    Reżyseria: Nicolas Brown
    Występują: Metin Eren, Jon Erlandson, Jacquelyn Gill, Arturo González, John Hawks, Peter Lape
    Na Ziemi żyje siedem miliardów ludzi. Seria dokumentalna to globalna opowieść detektywistyczna wykorzystująca najnowsze odkrycia i badania genetyczne. Największym wyzwaniem stojącym przed naszymi przodkami było zasiedlenie Ameryki. Droga wiodła przez tereny pokryte lodem.
  genre:
  - '35'
- eventId: 1244620
  start: 2026-10-03T08:10:00Z
  stop: 2026-10-03T09:25:00Z
  title: Pierwsze cywilizacje 1 (odc. 1)
  subtitle: Seria dokumentalna przedstawiająca dzieje narodzin pierwszych cywilizacji. Twórcy analizują cztery kluczowe czynniki, które jednoczyły ludzi i kształtowały rozwój społeczeństw.
  description: |-
    Tytuł oryginalny: First Civilisations
    GB, 2018
    Reżyseria: Tomasz Cebula
    Występują: Kerry Shale, Alex Elvis Badillo, Vijak Bayani, Carla Becker, Michael Bideller, Achim Buch
    Seria dokumentalna przedstawiająca dzieje narodzin pierwszych cywilizacji. Twórcy analizują cztery kluczowe czynniki, które jednoczyły ludzi i kształtowały rozwój społeczeństw: religię, wojny, handel oraz powstawanie miast. To fascynująca podróż do początków cywilizowanego świata, ukazująca, jak rodziły się fundamenty współczesnej kultury i organizacji społecznej.
  genre:
  - '35'
