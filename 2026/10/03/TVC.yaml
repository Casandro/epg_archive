  title: 'Winnetou: Skarb w Srebrnym Jeziorze'
  subtitle: Wódz Apaczów Winnetou i jego biały druh Old Shatterhand wędrują przez prerię w poszukiwaniu Srebrnego Jeziora. Ich tropem podąża banda Brinkleya.
  description: |-
    Tytuł oryginalny: Der Schatz im Silbersee
    DE,FR,YU, 1962
    Reżyseria: Harald Reinl
    Występują: Pierre Brice, Lex Barker, Herbert Lom, Götz George, Karin Dor, Eddi Arent
    Cornel, przywódca bandy rewolwerowców, zabija farmera Engela, żeby zdobyć mapę, która doprowadzi go do Srebrnego Jeziora, gdzie na jednej z wysp ukryto indiański skarb. Gdy na miejsce zbrodni przybywają Winnetou i Old Shatterhand, postanawiają pomóc synowi zamordowanego, Fredowi, w odnalezieniu zbrodniarza. Okazuje się jednak, że Cornel zdobył na razie tylko połowę planu. Drugą ma przyjaciel zamordowanego Engela, Patterson. Patterson i jego córka Ellen wpadają w ręce Cornela.
