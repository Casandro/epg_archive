  title: Ludzkość - historia nas wszystkich 1 (odc. 10)
  subtitle: W Ameryce wojna o niepodległość rozbudza marzenia o politycznej i indywidualnej wolności. Tymczasem w efekcie rewolucji przemysłowej maszyny zastępują siłę ludzkich mięśni.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Dan Clifton
    Występują: Brian Williams, Richard Machowicz, H.W. Brands, George Wunderlich, Thaddeus Russell, James Meigs
    Ludzkość wchodzi w nowy wiek odkryć i podporządkowuje sobie dziką przyrodę. W Ameryce Północnej, na Syberii i w Australii starożytne tradycje są wypierane przez handel i naukę. Amerykańscy rewolucjoniści stawiają czoło potężnemu cesarstwu. Zaczyna się bitwa o współczesny świat.
