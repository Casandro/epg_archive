  title: Superknjiga
  subtitle: Animirani
  description: Superknjiga odvodi djecu da upoznaju jednog mladića koji se također trebao suočiti sa svojim "Golijatom" u trenutku krize. Luka, Ela i Gizmo se sprijateljuju sa mladim Davidom, koji nosi kruh svojoj braći koja su na fronti u ratu protiv Filistejaca. Pošto je David mali, svi mu se smiju kada kaže da će se on suočiti sa Izraelovim najljučim neprijateljem - Golijatom, divom iz Gata. David u konačnici uspijeva ubiti diva jer je Bog na njegovoj strani u ovoj bitci. Luka uviđa da ako se suoči sa svojim "Golijatom" (sviranje uživo pred publikom) i ako svira za Boga, nema šanse da izgubi! Superknjiga vraća djecu kući i Luka uspijeva na audiciji i dobiva mjesto u bendu.
