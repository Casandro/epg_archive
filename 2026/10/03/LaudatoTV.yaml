  title: Blagoslovljen tek
  subtitle: Religijski
  description: Novi domaćini emisije su Iva i Josip Martinkec, roditelji petero djece koji su se upoznali još kao tinejdžeri. Njihova veza isprva nije imala dublji smisao ni jasnu budućnost, bez življene vjere i bez ideje o predbračnoj čistoći. No, ono što je započelo kao mladenačka ljubav, kroz brojne izazove, od neplanirane trudnoće, financijskih problema, zdravstvenih borbi s djecom, do traženja smisla i istine, pretvorilo se u snažno svjedočanstvo Božje prisutnosti i vjernosti. Danas, s petero djece i šestim na putu, svjedoče kako se Gospodin proslavlja u svakom 'da' koje mu izgovore. U kulinarskom dijelu pripremaju se pileće rolice punjene šunkom i sirom te zapečene s mlincima u pećnici, a za desert torta od sira.
