  title: Helicopter ER - Rettung aus der Luft
  subtitle: Episode 10
  description: |-
    Ein Oldtimer wurde in der Nähe von Barnsley von einem anderen Pkw gerammt. In dem umgestürzten Fahrzeug sind zwei ältere Personen eingeschlossen. Die Feuerwehr versucht das Paar aus der misslichen Lage zu befreien. Aber das dicke Stahlblech leistet der Rettungsschere deutlich mehr Widerstand als die Karosserie eines modernen Fahrzeugs. Noch ist unklar, welche Verletzungen die Unfallopfer erlitten haben. Und an einem stillgelegten Bahngleis ist ein Rentner mit dem E-Bike gestürzt. Der Mann wirkt desorientiert und klagt über Schmerzen an der Halswirbelsäule.
    GBR 2023
