  title: Kings Of Cash - Die Pfandleiher
  subtitle: Die Spargel-Flatrate
  description: |-
    Daniela Löschner beendet im Ruhrpott eine Negativserie. Ihre Kunden waren schon mehrfach da. Bis dato mussten sie in Bochum aber immer mit leeren Händen nach Hause gehen. Dieses Mal kommen beide Seiten ins Geschäft. In Karlsruhe beeindruckt ein Sammler mit seinem umfassenden Wissen über Goldmünzen aus dem Kaiserreich. Und Niklas Bode nimmt mit seiner Tochter Angelina bei einem Außentermin eine Schälmaschine unter die Lupe. Nach erfolgreichem Praxistest werden 4500 Euro ausbezahlt - und für den Pfandleiher gibt es sechs Wochen lang frischen Spargel.
    DEU 2025
  widescreen: true
- eventId: 1306808
  start: 2026-10-01T17:15:00Z
  stop: 2026-10-01T18:15:00Z
  title: Kings Of Cash - Die Pfandleiher
  subtitle: 179.000 Euro und ein Strafmandat
  description: |-
    Ein Kunde verkauft in Karlsruhe hundert kleine Goldbarren und kann sich über eine ansehnliche Rendite freuen. Im Souterrain geht es später um ganz andere Dimensionen - diskret, routiniert und in Rekordtempo. In Berlin werden in dieser Folge von "Kings of Cash" nicht nur ein Strafmandat, sondern auch Mut und schwierige Entscheidungen auf einem sehr persönlichen Lebensweg zum Gesprächsthema. Und Pam muss in Nürnberg klare Grenzen setzen. Ein Kunde, der bereits am Vortag mit einem problematischen Fahrrad aufgefallen war, bringt nun eine Boombox ins Pfandhaus.
    DEU 2026
