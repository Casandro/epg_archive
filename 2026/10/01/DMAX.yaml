  title: 'Notaufnahme: Samstagnacht'
  subtitle: Akut psychisch
  description: |-
    Ein Mann hat sich mit seinem Wagen bei überhöhter Geschwindigkeit auf der Autobahn viermal überschlagen. Im Schockraum des Elisabeth-Krankenhauses in Mönchengladbach-Rheydt kristallisiert sich heraus: Der Pkw-Fahrer hatte offenbar großes Glück im Unglück. Der Rettungsdienst bringt zudem eine psychisch auffällige Patientin in die Notaufnahme. Die Untersuchung der Frau erweist sich als schwierig. Und im Sana-Klinikum in Lübeck wird in dieser Folge die Beatmung einer Patientin zu einer echten Herausforderung. Der Sauerstoff entweicht an einer Öffnung an der Luftröhre.
    DEU 2027
  widescreen: true
- eventId: 1306863
  start: 2026-10-01T19:15:00Z
  stop: 2026-10-01T20:15:00Z
  title: 'Notaufnahme: Samstagnacht'
  subtitle: Wir sind sowieso nett
  description: |-
    Der Rettungsdienst bringt einen betrunkenen Patienten in Begleitung der Polizei ins Sana-Klinikum in Lübeck. Die Sanitäter haben die Beamten zu ihrem eigenen Schutz angefordert. Auch in der Notaufnahme lässt sich der Mann mit 3,7 Promille Blutalkohol nur mit polizeilicher Unterstützung unter Kontrolle halten. Und im Petrus-Krankenhaus in Wuppertal behandelt das medizinische Personal in der Samstagnachtschicht eine junge Frau, die sich mit einer Überdosis an Medikamenten das Leben nehmen wollte. Aktivkohle soll das Gift binden, damit es über den Darm ausgeschieden werden kann.
    DEU 2027
  widescreen: true
