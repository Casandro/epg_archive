  title: Goldfieber Down Under
  subtitle: Episode 1
  description: |-
    Gold scheffeln im Outback? Das ist leichter gesagt als getan. Denn in der menschenfeindlichen Wildnis bekommt man nichts geschenkt. Bereits auf der Fahrt ins Camp sind Gordon und sein kleines Team gefordert. Die Schatzsucher sind auf einer Straße unterwegs, die diesen Namen nicht verdient. Und das nächste Krankenhaus ist mehr als drei Stunden entfernt. Ein Unfall auf der unwegsamen Piste käme einer Katastrophe gleich. Auch ihr Equipment müssen die Männer sorgfältig festzurren, damit es unterwegs keinen Schaden nimmt. Erreichen die Abenteurer unversehrt ihr Ziel?
    DEU 2026
  widescreen: true
- eventId: 1306532
  start: 2026-10-01T01:00:00Z
  stop: 2026-10-01T01:50:00Z
  title: Treasure Hunters Down Under
  subtitle: Der Strandausflug
  description: |-
    Während des Victorianischen Goldrauschs im 19. Jahrhundert strömten Tausende Glücksritter nach Yapeen. Heute findet man in der Umgebung nur noch Ruinen. Trotzdem machen sich Michelle und Andrew hoch motiviert mit ihren Detektoren ans Werk. Denn an solchen Spots findet man oft alte Münzen. Hannah und Camille haben ebenfalls recherchiert. Im Buschland bei Canberra existierte früher eine Siedlung. Deshalb rechnen sich die Sondengängerinnen dort gute Erfolgschancen aus. Und was liegt im Sand am Moana Beach verborgen? Der Strand ist ein beliebtes Urlaubsziel
    AUS 2024
  widescreen: true
