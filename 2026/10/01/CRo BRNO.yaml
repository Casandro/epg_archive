  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: Kateřina Bolečková a Dagmar Fetterová o anketě Strom čtvrtstoletí. Které moravské stromy jsou do jubilejního ročníku nominovány? Jakými legendami jsou opředeny a jak se do hlasování může aktivně zapojit každý z nás? Zavzpomínáme i na to, jakým způsobem se v počátcích ankety oslovovali hlasující a budeme typovat letošního vítěze. Moderuje Jarka Vykoupilová.'
