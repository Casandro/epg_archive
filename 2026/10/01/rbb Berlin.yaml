  description: Linda Tillmann sitzt seit einem Motorradunfall vor einigen Jahren im Rollstuhl. In einem Leipziger Park hat sie der Hund von Malte Westphal gebissen. Durch eine Zeitungsanzeige hat der junge Mann sie wiedergefunden, und die beiden sind seither ein Paar. Da Lindas Hand schmerzt, bringt Malte sie in die Sachsenklinik. Die Infektion der Wunde hat sich stark ausgebreitet, und Lindas Hand ist in Gefahr - eine Katastrophe für die junge Frau, die nicht nur im Rollstuhl sitzt, sondern als Stadtplanerin obendrein viel zeichnen muss. Malte macht sich schreckliche Vorwürfe und will jede Minute für Linda da sein.
