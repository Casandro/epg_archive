  start: 2026-10-01T06:30:00Z
  stop: 2026-10-01T07:00:00Z
  title: Norway at its Limit
  subtitle: Tourists Flood the North
  description: "At a campsite in Stavanger, Per Arne Haarr is often forced to turn away tourists during the high season. Because reservations can’t be made in advance, Robert, Yvonne, and their son Paul have arrived extra early. They hope to secure a spot at this campground in central Stavanger.\nThe family from Germany is on its second visit to Norway and hoping to explore the south of the country. It quickly becomes apparent that since their last visit, things have gotten much more crowded here.\nThose who like hustle and bustle will get their money's worth along the Fargegaten pedestrian street, in the center of Stavanger. Then there’s the harbor promenade - and, of course, the cruise ships. Up to three of these can moor here at the same time, bringing thousands of tourists to the city every day. This is a nuisance for residents who live in the old town. The ships right outside their front doors don’t just obstruct the view. They also damage historic buildings and residents’ health.\nJust 40 minutes from Stavanger the crowds can be even more intense. This is the location of the Preikestolen or Pulpit Rock. Most tourists come to take a photo at the edge of the rock, which drops steeply, some 604 meters, into the fjord. When the weather’s good, queues are almost guaranteed.\nBernt Hårvard Øyen, director of the Bryggen Foundation in Bergen, wants to find a better balance when it comes to tourism. His coastal city’s historic harbor district is a UNESCO World Heritage Site -- and one of the most popular places to visit. In July, the tourist high season, it’s sometimes so crowded here that walking is difficult. And not everyone behaves respectfully. Øyen says options for limiting the number of visitors are currently under discussion.\nMany residents of the small town of Flåm on the Aurlandsfjord would probably welcome a visitor limit. When a cruise ship is in port, this village of 288 people turns into a kind of Disneyland. One of the main draws for tourists, in addition to the picturesque surroundings, is the Flåm Railway. It’s considered one of the most beautiful train journeys in the world and attracts some 450,000 tourists to Flåm every year. \nYvonne, Robert and their son Paul have traveled here to see it. But is so much tourism really worth it?"
  widescreen: true
