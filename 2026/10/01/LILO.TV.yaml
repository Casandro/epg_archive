  title: So schmeckt die Welt - Arlberg
  subtitle: So schmeckt die Welt - Arlberg
  description: Eine kulinarische und kulturelle Expedition durch die Arlberg-Region. Der Arlberg wird auch als die Wiege des Skifahrens bezeichnet. Und tatsächlich wurde hier der erste Skiclub und die erste Skischule gegründet. Am Arlberg wurden auch die ersten Lifte und Seilbahnen weltweit errichtet. Kein Wunder also dass der Arlberg auch das attraktivste Skigebiet für anspruchsvolle Skifahrer ist. Und im Sommer zeigt sich die Region nicht nur sportlich, sondern vor allem auch kulturell.
  genre:
  - '129'
  widescreen: true
- eventId: 1189107
  start: 2026-10-01T19:40:00Z
  stop: 2026-10-01T20:35:00Z
  title: So schmeckt die Welt - Athen
  subtitle: So schmeckt die Welt - Athen
  description: Ein und kultureller und stylischer Streifzug durch Athen. Athen ist mehr als Akropolis und Parlamentswache. Vielmehr und diese 45 min. Dokumentation zeigt auch warum. Trotz zahlreicher Krisen ist es den Athenern immer wieder gelungen die Lust am Leben nicht zu verlieren. Diese unfassbare Emotion und Hingabe, diese Freude und Gastfreundschaft, dieser Hunger nach Harmonie ist unbeschreiblich und wird in dieser unterhaltsamen 45 Min. Dokumentation mit Menschen und ihren Geschichten festgehalten.
  genre:
  - '129'
  widescreen: true
