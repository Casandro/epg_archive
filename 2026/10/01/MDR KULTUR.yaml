  stop: 2026-10-01T07:35:00Z
  title: Jetzt, wo du ein Held bist (Folge 4 von 15)
  subtitle: von Thilo Krause
  description: "Dresden Sommer 1989: Toni versucht zu ergründen, warum er eine Schwester hat, die nur er sehen kann. Zwischen Familienschweigen und dem Stumpfsinn eines im Untergang begriffenen Systems schlägt er sich durch. Fahnenappelle, vom Tagebau verschlungene Dörfer, verschwundene Cousins, die Kriegsschwere der Eltern und Großeltern bilden ein dunkel flackerndes Kaleidoskop. Es bleibt Toni rätselhaft, bis er sich mit dem Sitzenbleiber Maik anfreundet. Als Toni ihn vor dem Zorn eines systemtreuen Lehrers rettet, beginnt ihre Flucht zu sich selbst. Mit Wärme und Witz erzählt Thilo Krause vom Aufwachsen in den letzten Monaten der DDR und dem Trost der Freundschaft.\n\n\"Es ist eine 'Erziehung des Herzens', die Thilo Krause in seinem zweiten Roman beschreibt, einige Sommerwochen im Jahr des Mauerfalls, in denen für die zwei Schüler Toni und Maik nicht viel zu geschehen scheint und sich doch alles verändert.\" (Peter Stamm)\n\nThilo Krause, geboren 1977 in Dresden, lebt in Zürich. Seit 2005 veröffentlicht er literarische Texte in Zeitschriften (u.a. Akzente, Sinn und Form), Zeitungen und Anthologien. 2012 erhielt er für sein Debüt \"Und das ist alles genug\" den Schweizer Literaturpreis; 2016 den Clemens-Brentano-Preis. 2020 erhielt er für seinen Roman \"Elbwärts\" den Robert-Walser-Preis und den Nicolas-Born-Debütpreis. MDR Kultur produzierte den Roman als Lesung mit Nico Holonics. Im August 2026 erschien sein zweiter Roman \"Jetzt, wo du ein Held bist\", den MDR Kultur zusammen mit NDR Kultur als Lesung mit dem Schauspieler Oscar Hoppe produziert hat.\n\nRegie: Judith Ruyters\nProduktion: MDR/NDR 2026\n\nMitwirkende: \nOscar Hoppe"
- eventId: 713374
  start: 2026-10-01T07:35:00Z
  stop: 2026-10-01T10:00:00Z
  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Der Stichtag: 1876 \"Vorwärts\" erscheint\nTotgesagt war er schon mehrfach: Der \"Vorwärts\", das Zentralorgan der SPD. 1989 beschlossen die Genossen das Ende als Wochenzeitung. Seit diesem Jahr ist es mit der Printausgabe vorbei. Ein merkwürdiges Geburtstagsgeschenk, dass sich die SPDler da ausdachten. Denn vor 150 Jahren erschien die erste Ausgabe des \"Vorwärts\". Ein Stichtag von Hartmut Schade.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 10:40 Uhr - Highlights in ARD Sounds: Die besten Hörspiele im Oktober\nIn diesem Jahr beging die Literaturwelt die 100. Geburtstage von Erich Loest und Siegfried Lenz. Aus diesem Anlass blicken wir in ARD-Sounds  auf das Werk der beiden Autoren unter dem Titel: \"Loest und Lenz 100 - Chronisten aus Ost und West\". Mit dabei Erich Loests  Erzählung Haare , gelesen von Gert Haucke.\nErzählt wird von einer Pubertät in der DDR der 1970er Jahre. Der junge Horst Burghausen rebelliert, indem er sich die Haare lang wachsen lässt, was seine Eltern auf die Palme treibt. Ein familiärer Machtkampf entbrennt. \n\n* 10:50 Uhr - Das Gedicht: \"Vogelwolke\" von Ernst Meister\nErnst Meister - geboren 1911, gestorben 1979 - hat lange Jahre seinen Unterhalt als kaufmännischer Angestellter verdient. Studiert allerdings hatte er Germanistik, Kunstgeschichte, Theologie und Philosophie. Seine sprachlich höchst konzentrierte und stark verinnerlichte symbolistische und mit Traummotiven durchsetzte Lyrik ist in gängige germanistische Ablagen kaum einzuordnen. Die Tatsache, dass zu Lebzeiten immerhin sechzehn Gedichtbände von Ernst Meister erscheinen konnten, spricht gleichermaßen für den Dichter wie für sein Publikum. Nicholas Born und Peter Handke sorgten dafür, dass er den renommierten und zur Förderung der Poesie bestimmten Petrarca-Preis bekam. Im Herbst 1979 schließlich wurde Meisters Werk mit dem Büchner-Preis geehrt. Doch Meister konnte ihn nicht mehr entgegennehmen, er starb kurz zuvor. Bald darauf waren Autor und Werk vergessen. Aus den Gedichten von Ernst Meister liest Veit Schubert.\n\n* 11:15 Uhr - Feuilleton\nVon Jörg Schieke\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 11:45 Uhr - Neue Musik von Agnes Obel\nDie dänische Musikerin Agnes Obel ist Mutter geworden. Und das hat die Entstehung und Themen auf ihrem neuen Album \"The Meaning Of Flowers\" ordentlich beeinflusst. Es ist ein Album über die Zeit geworden, wenn ein anderes Lebewesen in das eigene Leben tritt. Und man nicht mehr selbst der Mittelpunkt der eigenen Welt ist. Um diesen Zustand zu verstehen, hat Agnes Obel viel gelesen und wurde bei einer Autorin fündig, die man bei diesem Thema nicht gleich erwartet hätte.\n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
