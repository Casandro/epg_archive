- eventId: 713385
  start: 2026-10-01T18:00:00Z
  stop: 2026-10-01T19:00:00Z
  title: MDR Kultur Café
  description: |-
    Andreas Dresen gehört schon seit langem zu den wichtigsten deutschen Regisseuren, Filme wie "Halbe Treppe", "Wolke 9" oder "Halt auf freier Strecke" haben den genauen Beobachter und einfühlsamen Geschichtenerzähler auch international bekannt gemacht. So unterschiedlich seine Themen und Herangehensweisen auch sind, immer ist seine menschliche Haltung, seine Liebe zu den Figuren erkennbar, der unverwechselbare "Dresen-Touch".
    Sein neuer Film "Alte Liebe", der im Oktober in den deutschen Kinos startet, bestätigt diesen Ruf erneut. Basierend auf dem Roman von Elke Heidenreich und Bernd Schroeder, gestaltet er warmherzig und humorvoll mit den glänzenden Darstellern Dagmar Manzel und Joachim Król Szenen einer langen Ehe. Für uns ein schöner Anlass, Andreas Dresen wieder in das MDR KULTUR Café einzuladen und mit ihm über die Kunst des Geschichtenerzählens, über das Altern, das Abschiednehmen und über die Kraft einer gereiften Liebe zu sprechen. Eine Sendung von Knut Elstermann.

    Redaktion: Gabriele Bischoff
