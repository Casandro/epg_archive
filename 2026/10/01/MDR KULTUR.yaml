  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau \n\n* 06:20 Uhr - Europasinfonie der Dresdner Sinfoniker nimmt Formen an\nImmer für ein außergewöhnliches Projekt zu haben, das sind die Dresdner Sinfoniker. Ihr letztes Aufsehen erregendes Konzert war die Uraufführung einer \"Robotersinfonie\", bei dem ein dirigierender Roboter vor dem Orchester stand und den Taktstock schwang. Das nächste spektakuläre Projekt wirft bereits seine Schatten voraus - die Europasinfonie, an der Orchester und Chöre in zwölf europäischen Metropolen beteiligt sein werden. Dafür hatten die Dresdner Sinfoniker eigens ein Kompositionswettbewerb ausgelobt. 220 Einreichungen aus 26 Ländern sind daraufhin eingegangen, aus der eine zwölfköpfige, international besetzte Jury jetzt drei Gewinnerstücke ausgewählt hat. Gestern wurden sie in Dresden bekannt gegeben, und Grit Krause war vor Ort und hat Details zu Komposition und geplantem Konzert.  \n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 06:40 Uhr - Der Stichtag: 1876 \"Vorwärts\" erscheint\nTotgesagt war er schon mehrfach: Der \"Vorwärts\", das Zentralorgan der SPD. 1989 beschlossen die Genossen das Ende als Wochenzeitung. Seit diesem Jahr ist es mit der Printausgabe vorbei. Ein merkwürdiges Geburtstagsgeschenk, dass sich die SPDler da ausdachten. Denn vor 150 Jahren erschien die erste Ausgabe des \"Vorwärts\". Ein Stichtag von Hartmut Schade.\n\n 06:50 Uhr - Andreas Dresen über die beiden Hauptdarsteller von Alte Liebe \nWas bleibt von der Liebe nach fast vierzig gemeinsamen Jahren? Elke Heidenreich und Bernd Schröder haben darüber schon 2009 den Roman \"Alte Liebe\" geschrieben. Andreas Dresen und Drehbuchautorin Laila Stieler haben die Geschichte nun fürs Kino adaptiert - und ihre Figuren dabei von West nach Ost versetzt, auch weil ihnen diese Lebenswelt aus eigener Erfahrung näher ist. Entstanden ist ein ebenso komischer wie melancholischer Film über das Altwerden zu zweit, der am 8. Oktober ins Kino kommt. Perfekt besetzt mit Dagmar Manzel und Joachim Król, die als altes Ehepaar wunderbar disharmonieren und über die Regissseur Andreas Dresen sagt.\n\n 07:10 Uhr - Bodo Ramelow/Nina Brunetto: Nie den Glauben verlieren\nBodo Ramelow, heute Bundestagsvizepräsident und ehemaliger Thüringer Ministerpräsident, in Niedersachsen geboren und in Hessen aufgewachsen ist ein bekennender protestantischer Christ. In seinem neuen Sach-Buch \"Nie den Glauben verlieren - Ein Gespräch über Demokratie und Religion\", das am 1. Oktober im Verlag bene! erscheint, beschäftigt sich der Politiker mit aktuellen politischen Themen von seinem ausdrücklich christlichen Standpunkt aus. Dieses Sachbuch - der Untertitel verrät es schon - ist ein Interviewbuch. Ramelow, Jahrgang 1956, spricht darin mit der 1991 geborenen Autorin und Sängerin Nina Brunetto. \n\n* 07:20 Uhr - Neue Musik von Stoppok\nDen 70. Geburtstag feierte Stefan Stoppok, den man eher unter seinem Nachnamen kennt, vor einigen Monaten. Unter anderem mit dem Tribute-Album \"26/70 - die Songs von Stoppok\", auf dem angesehene Kolleginnen und Kollegen seine Songs coverten. Doch das war nicht das Ende seiner Karriere, sondern wohl eher der Anfang für etwas Neues. \nDenn jetzt meldet sich Stoppok mit einem neuen Album zurück. \"Hoppla Hoppla\" heißt es, ist seine 21. Platte und erscheint nächste Woche. Es \"geht um Bodenhaftung in bodenlosen Zeiten\", schreibt seine Plattenfirma und was wir bisher gehört haben, zeigt, dass einer wie Stoppok auch im Alter nicht nachlässt."
- eventId: 713373
