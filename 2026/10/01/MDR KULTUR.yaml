  title: 'MDR KULTUR Spezial: KINO/FILM/TV/SERIE'
  description: |-
    Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen. Berichte über Filmprojekte und Filmfestivals.

    Themen der Sendung:

    * Knut Elstermann über "Frau Winkler verlässt das Haus"

    * Film der Woche: "Digger"
    Eine schwarze Komödie von Oscar-Preisträger Alejandro González Iñárritu mit Tom Cruise in der Hauptrolle als Erdölmagnat Digger Rockwell, der nach einer selbst verursachten Katastrophe die Menschheit retten will.

    * ZDF Serie "Nine to Five - Das Amt"
    Eine Mockumentary im Stil von "The Office" in einer deutschen Behörde. Von "Conny from the block".

    * Ein Kanal für KI im Fernsehen
    KI im Film kann mittlerweile eine Menge, aber gibt es dafür wirklich ein Publikum? Die kalifornische Firma Fairground Entertainment probiert das gerade aus, und lässt in den USA rund um die Uhr KI-generierte Inhalte im Fernsehen laufen.

    * Doku über Michael Schumacher bei Netflix
    Ein Film über Triumphe und Tragödien, Liebe und Hass, zwischen Leben und Tod, in dem vor allem Schumachers Frau Corinna eine tragende Rolle spielt. Unser Kollege Jens Gideon hat vor knapp 3 Jahren selbst eine Dokumentation über Michael Schumacher veröffentlicht. Er hat sich die neue Netflix-Doku schon mal angesehen.
