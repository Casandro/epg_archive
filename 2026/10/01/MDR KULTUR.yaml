  title: MDR KULTUR am Mittag
  description: "* 12:15 Uhr - Chor.COM startet heute \n700.000 Mitglieder in rund 13.000 Chören - das sind die stolzen Zahlen des Deutschen Chorverbandes. Er ist der größte Zusammenschluss von Chorsängerinnen und -sängern in Deutschland. Präsident ist Christian Wulff, der ehemalige Bundespräsident. Und das Schaufenster des Deutschen Chorverbandes ist alle zwei Jahre die chor.com, der ultimative Branchentreff in Deutschland. Die letzten Male hat sie in Hannover stattgefunden, nun kommt sie erstmals nach Leipzig. Heute geht's los - in der Kongreßhalle am Leipziger Zoo und in der ganzen Stadt. Welch hochkarätiges Programm die Besucherinnen und Besucher erwartet, weiß Claus Fischer.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ramon Zarges\n\n* 12:45 Uhr - Frauengefängnis Hoheneck: Zeitzeugin Margitta Becke\nDas ehemalige Frauengefängnis Hoheneck steht bis heute für ein dunkles Kapitel der DDR-Geschichte, die nun in einer Konzertinstallation behandelt wird. Darin treten Zeitzeuginnen auf. Eine von ihnen ist Margitta Becke. Sie wurde 1978 nach einem Fluchtversuch aus der DDR verhaftet, zu 18 Monaten Haft verurteilt und nach Hoheneck gebracht. Sie erlebte an diesem Ort ein sehr dunkles Kapitel.\nIn der Konzertinstallation \"Ich bin mir selber fremd geworden\" werden die Erfahrungen ehemaliger Häftlinge mit Musik, Texten und Bewegung auf die Bühne gebracht. Anschließend kommen Frauen zu Wort, die das selbst erlebt haben. Die Konzertinstallation ist noch heute in der Gedenkstätte Zuchthaus Cottbus zu sehen - und am 3., 4. und 5. Oktober im ZiMMT Leipzig zu erleben. Tickets gibt es auf der Seite von neuekammer.de\n\n* 13:15 Uhr - Serientipp: East of Eden \nAus dem Englischen übersetzt-\"Jenseits von Eden\" ist eine Miniserie von Zoe Kazan mit Florence Pugh in der Hauptrolle. Sie basiert auf John Steinbecks gleichnamigem Roman von 1952. Im Gegensatz zum weltbekannten Kinofilm mit James Dean von 1955 rückt die Netflix-Serie die Vorgeschichte und die Perspektive der manipulativen Antiheldin Cathy Ames in den Fokus. Die generationenübergreifende Saga beleuchtet die tiefen Gräben zwischen zwei Brüdern im Salinas Valley zu Beginn des 20. Jahrhunderts.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Anne Wihan\n\n* 13:45 Uhr - MDR KULTUR Fragebogen an Andreas Dresen\nAndreas Dresen gehört schon seit langem zu den wichtigsten deutschen Regisseuren, Filme wie \"Halbe Treppe\", \"Wolke 9\" oder \"Halt auf freier Strecke\" haben den genauen Beobachter und einfühlsamen Geschichtenerzähler auch international bekannt gemacht. So unterschiedlich seine Themen und Herangehensweisen auch sind, immer ist seine menschliche Haltung, seine Liebe zu den Figuren erkennbar, der unverwechselbare \"Dresen-Touch\". Sein neuer Film \"Alte Liebe\", der im Oktober in den deutschen Kinos startet, bestätigt diesen Ruf erneut. Basierend auf dem Roman von Elke Heidenreich und Bernd Schroeder, gestaltet er warmherzig und humorvoll mit den glänzenden Darstellern Dagmar Manzel und Joachim Król Szenen einer langen Ehe. Für uns ein schöner Anlass, Andreas Dresen wieder in das MDR KULTUR Café einzuladen und mit ihm über die Kunst des Geschichtenerzählens, über das Altern, das Abschiednehmen und über die Kraft einer gereiften Liebe zu sprechen.\n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
