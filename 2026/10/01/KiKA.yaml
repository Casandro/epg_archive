  title: Sesamstraße
  subtitle: Der fedrige Keks
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lernen mit Spaß für Kinder

    Der fedrige Keks

    In Rüdigers Quizshow "Welt des Wissens" ist mal wieder echtes Expertenwissen gefragt. Was hat Federn, legt Eier und gackert? Antwort Krümel: Ein Keks!

    Außerdem teilen sich Elmo und Julia einen Kuchen. Leider werden sie dabei vom kuchenfressenden Eichhörnchen beklaut. Aber gibt es das überhaupt?

    Ernie bringt als neues Haustier einen Hund mit nach Hause. Bert gibt sich als Hunde Experte, der weiß, wie man mit einem Hund spricht. Komisch nur, dass der Hund überhaupt nicht auf Bert hört - und auf Ernie schon.

    Antonia (7) macht unterschiedliche Gangarten von Tieren nach. Selbst den Schildkrötengang probiert sie aus. Und Schildkröten bewegen sich schneller, als man denkt.

    Kiwi liebt seine wunderschönen Blumen. Das Problem ist nur: die Waldkuh liebt auch Kiwis Blumen - zum Essen. Kiwi & Strit beschließen, die Waldkuh einzufangen, um die Blumen zu schützen. Ob das klappt?
    Regie: Dirk Nabersberg, Jojo Wolff, Dennis Jacobsen

    HD-Produktion
