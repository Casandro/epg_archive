    Ein Faultier für Lily

    Im Reservat ist Tag der offenen Tür. Alle Besucher dürfen sich ein Tier aussuchen, um das sie sich kümmern wollen. Auch Lily will sich ein Tier aussuchen. Aber kein Tier will in ihrer Nähe sein.

    Taylor und Tommy versuchen ein Tier für Lily zu finden, mit dem sie sich anfreunden kann. Das ist sehr schwierig, denn alle Tiere nehmen Reißaus vor ihrer lauten und überdrehten Art. Aber dann hat Taylor eine Idee, welches Tier mit Lily klarkommen könnte.
