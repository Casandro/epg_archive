  description: "Shutdown\n\nMoritz und Hakim beobachten, wie die 15-jährige Azra verdächtige Tütchen in der Schule vertickt. Selbst gemachte Bio-Gummibären, erklärt sie. Moritz glaubt ihr kein Wort. Azra droht ihm, seiner kleinen Schwester etwas anzutun, wenn er sie nicht in Ruhe lässt. Was ist wirklich in diesen Gummibären? Als Moritz nachts auf den Speicherboden schleicht, um das Laborergebnis zu checken, folgt seine Mutter ihm heimlich. Es kommt zum Shutdown des Hauptquartiers. Die Pfefferkörner sind am Boden zerstört, da nimmt der Fall eine unerwartete Wendung.\nDarsteller:\nMoritz Bruns - Jan Friedrichsen\nHakim Al-Khalil - Mads Albatros\nJasina Al-Khalil - Sophia Grande\nAmy Bruns - Melody Rose\nMira Elani Bruns - Zandile Darko\nLars Bruns - Tim Ehlert\nRegie: Lydia Bruna, Philipp Scholz\nBuch/Autor: Anja Jabs, Katharina Mestre, Andrea Katzenberger, Julia Thürnagel, Benjamin Hessler, Silja Clemens, \nKamera: Jonas Hentschel, Henri Nehlsen\nMusik: Mario Schneider\nHD-Produktion"
