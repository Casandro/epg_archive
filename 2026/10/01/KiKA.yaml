  audiodesc: true
  description: |-
    Vorschulserie, Deutschland 2018
    Ich will nicht auspacken!

    Lina (7) und ihr Vater Georg packen Umzugskisten aus. Ihre eigenen Kisten will Lina aber nicht auspacken. Lina und Georg beschließen erst einmal, essen zu gehen. Auf dem Weg zum Falafelladen sieht Lina zum ersten Mal die gleichaltrige Miray. Sie könnte eine Freundin werden, aber Miray starrt nur auf Georgs Rollstuhl und scheint kein Interesse zu haben. Kaum kommen Lina und Georg vom Essen zurück, klingelt es an der Tür. Es ist die Nachbarin Julia, mit einem Käfig und einer Ratte unter dem Arm. Ihre Oma ist krank geworden und sie bittet Georg, auf die Ratte Amadeus aufzupassen...
    Darsteller:
    Lina - Ellis Drews
    Linas Vater Georg - Christina Martin Schäfer
    Miray - Zara Rachel Schöneck
    Ertan - Tayfun Baydar
    Regie: Markus F. Adrian
    Buch/Autor: Anja Flade-Kruse

