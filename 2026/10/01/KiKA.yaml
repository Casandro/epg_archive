    Die Bienenkönigin

    Grisu hat seinen ersten Einsatz. Aber nicht als Feuerwehrmann, sondern als Imker. Bauer Gelleck braucht jemanden, der für ihn einen Bienenstock aufstellt - möglichst ohne große Aufregung. Aber auf dem Weg zur Wiese werden die Bienen doch unruhig, und Stella will sie mit dem Rauchbläser beruhigen. Nur kann Grisu kein Feuer spucken, um den Rauchbläser zu entzünden. Ob Fumé hilft? Oder hilft am Ende nur die Bienenkönigin?
