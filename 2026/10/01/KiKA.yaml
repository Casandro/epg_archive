    Im Mäusehaus findet eine Käsejagd für die Kinder statt. Dabei müssen sie Käsestücke erschnüffeln, die von der Käsefee im Haus versteckt wurden. Leider hat Julia an dem Tag einen Schnupfen.

    Julia ist traurig, weil sie durch den Schnupfen nichts riechen kann. Da fällt Sam ein, dass Onkel Lumpi einen Käse-Detektor hat, mit dem man Käse erschnuppern kann. Julia ist glücklich, aber der kleine Ben findet das unfair, weil sie dadurch im Vorteil ist.
