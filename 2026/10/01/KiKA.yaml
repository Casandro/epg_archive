    Grisu bekommt einen abenteuerlichen Auftrag: Er soll den neuesten Fund von Professor Smeraldo aus dem Urwald nach Drachenstadt transportieren: eine alte Drachen-Vase! Vorsicht, zerbrechlich! Leider kommt Grisu als erstes die Transportbox für die Vase abhanden. Dann mischt sich noch ein aufdringlicher Vogel ein und schließlich hat Grisu wieder einmal sein Feuer nicht im Griff. Ob die seltene Vase jemals in Drachenstadt ankommt?
