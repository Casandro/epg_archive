  title: Die Sendung mit dem Elefanten
  subtitle: Wie fühlt sich Freude an?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie fühlt sich Freude an?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Was macht mich glücklich? Charlotte ist froh, wenn sie im Sand Radschlag macht. Anke Engelke macht sich gerne selber Geschenke. Und Duggee und die Quirlies haben beim Singen viel Spaß, vielleicht fast schon etwas zu viel Spaß! Der kleine blaue Elefant und seine Freunde zeigen in dieser Folge gemeinsam mit Sängerin Eva Sauter und Zirkusdirektorin Annette Frier, wie sich Freude anfühlt und was es braucht, um glücklich zu sein.
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

