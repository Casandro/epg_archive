  title: Pip und Posy
  subtitle: Dummelitis
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dummelitis

    Beim "Verkleiden-Spielen" schlägt Pip ein bisschen über die Stränge. Er nennt sich Meister Vanillepudding und leidet plötzlich an Dummelitis, macht also viele verrückte Sachen.

    Das bedeutet, dass er sich wie ein echter Dummkopf aufführt. Als Frankie auftaucht, steckt er sie auch mit seiner Dummelitis an, und Posy findet das überhaupt nicht witzig. Sie bittet die beiden sogar, nach Hause zu gehen und sie allein zu lassen.

    Das will Pip auf gar keinen Fall, und er bittet Posy um ein Glas Milch, weil die ja supergut gegen Dummelitis helfen soll. Und es funktioniert perfekt. Als Pip die Milch getrunken hat, bekommt er plötzlich einen echten Ordnungsfimmel und steckt auch Frankie und Posy damit an. In Windeseile ist das Haus so aufgeräumt wie noch nie zuvor - und die drei Freunde sind wieder versöhnt und allerbester Laune.
    Regie: Seán McCormack
    Buch/Autor: Sam Barlow, Matt Baker
    Musik: Ellie Wyatt, Joss Peach
