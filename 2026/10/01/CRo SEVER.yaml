  title: Host Dopoledního expresu
  description: Před Klínovcem turistický ruch žije, za Klínovcem teprve ožívá. Dnes vám v Dopoledním expresu přiblížíme příběh bývalého kolegy, zahraničního zpravodaje Českého rozhlasu Štěpána Macháčka, který vrací život pátému nejvyýše položenému nádraží v České republice v Kovářské. Jak vznikla myšlenka zachránit chátrající nádražní budovu a co všechno to obnáší? To vše se dozvíte krátce po 11 hodině. Moderuje Robin Röhrich.
