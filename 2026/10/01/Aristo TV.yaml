  title: ANIXE auf Reisen - Taiwan mit Eva Habermann
  description: Mit der beliebten Schauspielerin Eva Habermann begibt sich Anixe zunächst auf eine kurzweilige Tour durch Taipeh, das wirtschaftliche und politische Herz Taiwans. In der Hauptstadt der Republik - wie im ganzen Land -  treffen jahrtausendealte chinesische Traditionen und japanische Kultur auf modernes Hightech-Zeitalter. Zahlreiche Tempel, Klöster und Märkte prägen die Stadt, in Taipeh pulsiert das Leben. Anders als in China sind in Taiwan zahllose religiöse Bauten erhalten geblieben. Religion und Spiritualität gehören hier seit jeher zum Alltag, eine Kulturrevolution wie in der Volksrepublik hat es nicht gegeben. So ist es nicht verwunderlich, dass Eva Habermann ihre Reise mit einem Besuch in einem der ältesten Tempel des Landes beginnt. Die Insel besticht aber nicht nur durch kulturellen Reichtum, sondern auch durch landschaftliche und kulinarische Vielseitigkeit. Die Schauspielerin wandert auf einsamen Wegen über Hängebrücken durch die Taroko-Schlucht und unternimmt eine Fahrradtour am Sonne-Mond-See. Begleiten Sie Eva Habermann auf ihren Streifzügen über die bunten Straßen- und Nachtmärkte Taiwans. Tauchen Sie ein in die Welt der japanischen Baderkultur und lassen Sie sich in die Jahrtausende alte chinesische Kunst der Kalligraphie einführen.
  widescreen: true
