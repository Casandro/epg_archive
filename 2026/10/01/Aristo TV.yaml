  title: So schmeckt die Welt - Usedom
  description: Ja, schon früher wusste man, dass ein Urlaub ohne Farbfilm auf Usedom zwar machbar ist, aber einem am Ende doch trostlos erscheint. Kaiser Wilhelm hat die Insel einst berühmt und begehrlich gemacht, er musste sich jedoch noch mit schwarz-weiß Bildernbegnügen. Heute kann die Pixelgrösse nicht groß genug sein um die Farbenpracht bei einem Selfie festzuhalten. Usedom ist die zweitgrößte Insel Deutschlands und zählt zu den traditionsreichsten Urlaubsorten. Schon im 19. Jahrhundert plantschte der Adel im Meer und vergnügte sich an den rund 40 Kilometer langen Sandstränden. Dieser feinen Klientel ist auch die für Usedom typische Bäderarchitektur zu verdanken.  Auf Usedomentschleunigt der rastlose urbane Mensch und stellt seinen Atem auf den Rhythmus der Wellen ein.
  widescreen: true
