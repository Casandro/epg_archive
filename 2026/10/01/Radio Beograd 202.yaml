  subtitle: Možda još nije vreme da se iz ormara izvuče sva ona garderoba za hladnije i kišne dane, jer leto se još uvek ne predaje.
  description: Možda još nije vreme da se iz ormara izvuče sva ona garderoba za hladnije i kišne dane, jer leto se još uvek ne predaje. Zato sve bež mantile, maslinaste i braon tanje džempere i neku džombastiju obuću, ostavite u zadnjem delu plakara da sačeka još neko vreme svoj trenutak da zablista. Iznenadno hladno vreme opet je na ulice izvelo jakne, pantalone, kabanice, kišobrane i sve one mirnije, tamnije nijanse braon, maslinaste, bež, crne ili sive. Ceo svet je zadnjih godina postao nekako suviše bezličan kada su boje u pitanju, pa nam u domovima, na ulicama, ekranima dominiraju isprane bež nijanse. Na sreću ima i pojedinaca koji, bez obzira na godišnje doba, smelo nose jarke boje i kičaste dezene. Primereno situacijama biramo i našu garderobu. Ali je sve mnogo veselije i radosnije kada dodamo neki "vrišteći" detalj, bile to pertle na patikama, marama oko vrata, šareni nakit ili zanimljive i šarene naočare. U jesen možda nosimo topliju garderobu, ali ne mora to nužno da podrazumeva i...
