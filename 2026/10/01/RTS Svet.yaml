  title: Edu global
  subtitle: Emisija počinje domaćim prilozima koji se bave ekološki trendovima u svetu o kojima počinje da se razmišlja i u našoj zemlji...
  description: U nedeljnom magazinu Redakcije ekološkog programa čućete šta su mogućnosti najsavremenije mobilne mreže. Videćete prvu eksperimentalnu baznu stanicu koja je postavljena u Naučnom parku u Beogradu. O drugoj strani medalje 5G mreže govoriće naučnici iz Evropskog centra za vremensku prognozu u Engleskoj. Oni tvrde da ta mreža ometa njihov rad što može da izazove katastrofalne posledice naročito kada znamo koliko je važna blagovremena najava velkih nepogoda. Biće reči i o novom satelitu koji Švedska šalje u orbitu nakon osamnaest godina od lansiranja prvog satelita ove države. Saznaćete i kako se sa posledicama klimatskih promena bore stanovnici Fidžija koji su konstantno izloženi velikim opasnostima. Objavićemo i veliko sitraživanje Svetske zdravstvene organizacije koje dovodi u direktnu vezu težinu bebe na rođenju sa njenim kompletnim zdravstvenim stanjem, predisponiranim bolestima i potencijalnim problemima. Biće predstavljeni i konkretni rezultati višegodišnje studije Američke...
- eventId: 1294729
