  title: Špína
  description: Co spojuje zběsilý grindcore, různé mutace metalu, zvuk devadesátkového memphiského rapu i jistou československou filmovou nostalgii? Společným jmenovatelem je bratislavský hudebník a producent Adam El Muflono, který krom toho, že víc jak dvacet let hraje na bicí v extrémních kapelách, vede label Calvos73 Records a především vydává dungeon rapové počiny pod hlavičkou Sniffah. Právě kvůli poslední zmíněné aktivitě za námi dorazil do studia, kde jsme probrali i jeho nejnovější split Gunsight Romance s projektem Vagary. Moderují Jan Šamánek a Judita Císařová.
