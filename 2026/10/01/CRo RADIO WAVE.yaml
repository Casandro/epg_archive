  title: Hotspot
  description: Podcastový doomscrolling, ale bez výčitek. Hotspot je pořad o trendech, které nás pálí. V rozhovorech s odbornicemi a odborníky dávají Barbora Součková a Sarah Abulkasim kontext vašemu feedu. Hotspot rozplétá to, co si zaslouží víc než tři vteřiny naší pozornosti. Reaguje na současné trendy na sociálních sítích a rozebírá je kriticky, ale s nadhledem.
