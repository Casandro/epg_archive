  title: On Air s Jardou Petříkem
  description: Teplicko-vršovické kytarové duo Kruh 19 tvoří kluci Damián a Vojta, kteří se potkali v Praze na Matfyzu. Už skoro tři roky skládají písničky o Praze, světě a okolí, kde mísí důvtipné texty a narážky s melancholií z postupného dospívání. Na debutový virální singl Dinosaur z roku 2024 navázali skladbami jako Nutrie, zmatený zprávy nebo noční tramvaj 93. Ty představí živě v našem proskleném studiu po 12. hodině. Moderuje Jarda Petřík.
