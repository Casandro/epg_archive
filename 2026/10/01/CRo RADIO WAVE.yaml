  title: Chudáčci
  description: Chudáčci jsou nekonečná série herců a kamarádů Petra Uhlíka a Adama Ernesta o tom, když se úplně nedaří. Sdílejí historky z osobního života i práce a zamýšlejí se nad vztahy, jídlem, dovednostmi a vším ostatním, co běžný život přináší. Půlhodinová promyšleně improvizovaná show za mikrofonem je pokaždé plná humoru, pochval i urážek, sporů a smíření, přátelství, ASMR a jiných zvuků, které jste zatím rozhodně neslyšeli. Moderují Petr Uhlík a Adam Ernest.
