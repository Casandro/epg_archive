  title: Čelisti
  description: Celoživotní příslušníci umpa-lumpenproletariátu Aleš Gdoule, Tonda Saltini a Martin Telekuk získali Wonkův zlatý kupón, a proto nový díl Čelistí vysílají z nitra továrny na čokoládu. Budou se k sobě během živého přenosu chovat Jako bratři, nebo si už dopředu řekli Proč bychom se nezabili? Vydá někdo z nich Temný zvuk? Používá Tom Cruise na zahrádce hloubkový kypřič Digger? A je vůbec krásný vzít si tátovy Kroboty? Willy Wonka / Lešek Wronka / Kunabomber. Moderují Aleš Stuchlý, Antonín Tesař a Martin Pleštil.
