  title: Hotspot
  description: Kdo vyhraje letošní Love Island? Kdy skončí válka na Blízkém východě? A vrátí se do konce roku Ježíš Kristus? Na predikčních trzích si můžete vsadit v podstatě na cokoliv. Platformy jako Kalshi nebo Polymarket se prezentují jako chytrý způsob, jak předpovídat budoucnost. Liší se ale vůbec od klasického hazardu? Je vůbec etické sázet na výsledek válečných konfliktů? A nezastiňuje to mnohem větší problém? O tom se bavíme v nové epizodě Hotspotu s novinářem a autorem podcastu Redneck Matějem Schneiderem.
