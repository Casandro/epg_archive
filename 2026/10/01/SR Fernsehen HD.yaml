  title: 'Japan: Achtung Erdbeben!'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In keinem anderen Land bebt die Erde so oft wie in Japan. Hundertausende Menschen kamen in den vergangenen mehr als hundert Jahren bei Erdbeben ums Leben oder wurden obdachlos. Warum bebt die Erde in Japan? Wie gehen die Japaner*innen mit der ständigen Gefahr um? Wie funktioniert das japanische Frühwarnsystem? Was bedeutet erdbebensicheres Bauen? Die beiden Schüler*innen Tomohiro und Saya in Tokio zeigen, wie sie mit dem Erdbeben leben.
