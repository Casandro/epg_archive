  description: "Ob auf einem Pferd, einem Kamel oder einem Rentier Dr. Shurentsetseg ist jederzeit einsatzbereit.Ihre Mission: die Nomaden in der Mongolei gesund zu halten. Ob Zahnschmerzen, Kinderkrankheiten oder andere gesundheitliche Beschwerden  sie reist den Nomaden nach, um ihnen zu helfen. Ihr Mann unterstützt sie dabei, bleibt zu Hause bei den drei kleinen Kindern und fährt sie manchmal, soweit es möglich ist, mit dem Auto. \n\nDies ist die Geschichte einer rastlosen Kämpferin, die selbst in einer Nomadenfamilie aufgewachsen ist."
