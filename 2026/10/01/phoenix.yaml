  title: Traumziele Südostasiens (2/4)
  subtitle: Von Myanmar bis Thailand
  widescreen: true
  hd: true
  description: |-
    Von Myanmar führt diese Folge durch Laos und Kambodscha bis nach Thailand. Landschaften, geprägt von alten Hochkulturen und den lebendigen Weltreligionen Buddhismus und Hinduismus.
    Einzigartige Baudenkmäler lassen sich in Südostasiens Norden entdecken: Paläste und Pagoden wie in Amarapura, einst Hauptstadt von Burma, heute Myanmar. In Kambodscha liegt die weltbekannte Tempelanlage von Angkor Wat im historischen Königreich der Khmer. Vor allem der Mekong und seine Nebenflüsse bilden die Lebensader dieser Länder Südostasiens.
