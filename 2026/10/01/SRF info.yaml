  title: mitenand in Gebärdensprache
  subtitle: Kinder lesen vor - Katzen hören zu
  description: |-
    Im Tierheim des Zürcher Tierschutzes lesen jeden Samstag Kinder Katzen vor. Besonders Kinder, denen das Lesen schwerfällt, können hier ohne Druck üben. Gleichzeitig lernen sie, die Körpersprache der Tiere zu verstehen und ihre Bedürfnisse zu respektieren. Ein Bericht von Elma Softic.
    Schweiz 2026
