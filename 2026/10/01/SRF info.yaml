  title: Einstein in Gebärdensprache
  description: |-
    Sie streiten, sie prägen, sie begleiten ein Leben lang: Geschwister. Doch wie stark formen Bruder und Schwester wirklich den Charakter? Sind Erstgeborene klüger, Einzelkinder einsam? «Einstein» geht mit Kathrin Hönegger und Tobias Müller den hartnäckigsten Geschwister-Mythen auf den Grund.
    Schweiz 2026
  genre:
