  title: Kingdom Manifesto - Manifest des Himmelreichs
  subtitle: Der Kontext der Predigt
  description: "Diese neue zehnteilige Serie befasst sich mit der Bergpredigt Jesu (Matthäus 5 - 7), die größte Predigt,die je gehalten wurde und in der Jesus anspruchsvolle, hohe und edle Grundsätze vorgibt. Die Bergpredigt ist einzigartig in ihrer Art, sie ist die Essenz aus altem und neuem Testament, sie fasst den Inhalt der Bibel zusammen. Jesus räumt mit den unbiblischen Traditionen auf die verdunkeln, was Gott im Alten Testament gesagt hat. \n\nEpisode 1 führt zu der Bergpredigt hin und zeigt, in welchem Zusammenhang sie im Mätthäusevangelium steht.\n\nWeitere Infos unter: hopetv.de"
  widescreen: true
