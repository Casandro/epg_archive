  title: Na pěknú notečku
  description: Kyjov hrál Kyjov. V létě roku 2019 se ukutečnil jubilejní 20. ročník národopisné slavnosti Slovácký rok. Jeden z hlavních programů slavností byl program s názvem "Kyjov hraje Kyjov". Zástupci nastupující hudební generace na Kyjovsku vzdali poctu výrazným hudebním upravovatelům kyjovského Dolňácka. Hraje velký cimbálový orchestr pod vedením Jaroslava Panáka a zpívají něpříklad Libor Macháček, Adam Procházka a další. Záznamem koncertu provází Markéta Ševčíková.
