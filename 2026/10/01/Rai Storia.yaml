  title: Dove sta Zazà (ep4)
  subtitle: '"Dove sta Zazà" andò in onda nel 1973 sul Programma Nazionale in 4 puntate. Girato a colori, andò in onda in bianco e nero (qui di seguito, per la prima volta, tutte le puntate integrali a colori). Il programma era condotto d'
  description: "a Gabriella Ferri, Enrico Montesano, Pippo Franco, Oreste Lionello e Pino Caruso. \"Dove sta Zazà\" era fondato sulle canzoni della Ferri e sugli sketch dei comici tratti dal repertorio del cabaret classico. La regia era di Antonello Falqui, autore del programma insieme a Mario Castellacci e Pier Francesco Pingitore. Quarta ed ultima puntata del varietà che racconta un pezzo di storia del cabaret italiano, siamo giunti agli anni Settanta: Pippo Franco ed il corpo di ballo si esibiscono in un pezzo sulle storture contemporanee, con Franco che inizialmente si finge paziente di un ospedale psichiatrico, poi si esibisce in uno sketch sulle rapine e in uno sui regimi alimentari. Pino Caruso parla invece del mondo della politica e dei personaggi dello spettacolo. Lo show si chiude con l'interpretazione di \"Tutti ar mare\" di Gabriella Ferri. - \n\nUn programma di Enrico Salvatori con la collaborazione di Lucia Ciancaglini Produttrice esecutiva Alessandra Giorgi Regia Agostino Pozzi, Fabrizio Marini"
