  title: Passato e presente Io sono il Duce 1922-
  subtitle: 'Passato e presente Io sono il Duce 1922-1924 - La distruzione dello Stato: è questo l''obiettivo dichiarato del fascismo quando conquista il potere con la forza, nell''ottobre del 1922. E mantenerlo irrevoca'
  description: 'bilmente a ogni costo è il programma di governo di Benito Mussolini. Da quel giorno, il terrorismo diventa prassi politica, i cittadini vengono suddivisi in una casta di dominatori e in una massa di dominati inermi, perché le armi appartengono esclusivamente al partito fascista che le usa per imporre la sua volontà di dominio assoluto. Nei primi anni di regime, tra la fine del 1922 e il 1924, il fascismo, sotto gli occhi di tutti, abbatte le istituzioni liberali una a una. Eppure in molti continuano a illudersi: il re e i partiti fiancheggiatori preferiscono credere alle promesse mussoliniane di restaurazione dell''ordine e della legalità, piuttosto che agli appelli accorati degli antifascisti come Giovanni Amendola, Luigi Sturzo, Lelio Basso, Antonio Gramsci che denunciano la realtà. Voci isolate contro la voce roboante e sfrontata di Mussolini. Ma il fascismo in quegli anni non è un coro unanime: è attraversato da settarismi, contrasti, risse. Voci dissonanti si elevano anche contro Mussolini e metterle a tacere, per lui, non sarà affatto facile. In studio con Paolo Mieli il Prof. Emilio Gentile - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  Ospite in studio il prof. Emilio Gentile Con la partecipazione di Matteo Marroni Regia di Davide Frasnelli Produttori esecutivi Vitilde D''Onofrio e Valentina Tassini'
