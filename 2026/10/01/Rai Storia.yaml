  title: Passato e presente Vitaliano Brancati. D
  subtitle: Passato e presente Vitaliano Brancati. Dal fascismo al liberalismo - Come pochi altri, racconta i vizi, le ambizioni e le ipocrisie dell'Italia tra fascismo e dopoguerra, con sguardo ironico e insieme fero
  description: "roce. Vitaliano Brancati, nato in Sicilia nel 1907, è tra i più importanti autori del Novecento italiano. La sua è una scrittura ironica, brillante, tagliente ma, al contempo, accessibile. I suoi romanzi e i suoi personaggi, sono lo specchio di un Paese che si illude, si mette in scena, fa sorridere e fa pensare. Giovane entusiasta dell'ascesa di Benito Mussolini, vede nel fascismo un simbolo di modernità, energia e cambiamento. Uomo maturo, alla fine degli anni 30 riconosce la distanza tra propaganda e realtà, e critica la retorica vuota del regime e il conformismo imposto agli intellettuali. La sua letteratura si trasforma in satira lucida e pungente contro i miti del fascismo, in particolare quello del maschio seduttore e conquistatore. Le sue opere sono state rappresentate a teatro, al cinema e in televisione. Tra queste Il bell'Antonio, capolavoro con cui Brancati smonta il mito della virilità maschile e dell'onore siciliano, rappresentando il divario tra apparenza social e verità intima. Incarnato nel film di Bolognini da Marcello Mastroianni che rese ancor più amaro quel ritratto di un'Italia prigioniera delle sue maschere. In studio con Paolo Mieli la professoressa Alessandra Tarquini. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio la prof.ssa Alessandra Tarquini \nCon la partecipazione di Maria Sole Sanasi \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
