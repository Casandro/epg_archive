  description: Tobi Dahmen ist Comiczeichner, scheut nicht vor schwierigen politischen Themen zurück und arbeitet meist autobiografisch. In seiner Graphic Novel "Columbusstraße"  hat er die Geschichte seiner Familie während der Nazi-Diktatur gezeichnet. Auch das jüngste Projekt des Comic-Künstlers ist keine leichte Kost. In "Al-Fazia - Das Grauen" hat er die Geschichte eines Syrers gezeichnet, der vom Assad-Regime gefoltert wurde.
