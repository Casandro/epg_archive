  description: Ich versuche im Moment, meine Tage so sinnvoll wie möglich zu gestalten - zwischen Baby, Homeoffice und meiner Tätigkeit als Aushilfslehrerin (oh Gott, wie überlebe ich das?) versuche ich mich darauf zu konzentrieren, dass es ein Leben nach Corona gibt. Und denke an Ostern, in 25 Tagen ist Ostersonntag und ich produziere die Geschenke für meine erwachsene Familie selbt. Eierlikör, the one and only, was für eine Delikatesse, vor allem selbstgemacht. Mit den richtigen Zutaten und ein paar Tricks ein Kinderspiel. AT 2020
- eventId: 1323625
  start: 2026-10-01T13:33:00Z
  stop: 2026-10-01T13:38:00Z
  title: Mein wunderbarer Kochsalon - Tomatensuppe mit gefüllten Käse-Croutons
  subtitle: Mein wunderbarer Kochsalon - Tomatensuppe mit gefüllten Käse-Croutons
  description: Meine Kinder dachten, sie liegen jetzt vier Wochen auf der faulen Haut. Weit gefehlt - neben dem Berg an Hausaufgaben für die Schule, den sie zu bezwingen haben, müssen meine zwei auch regelmäßig mit mir in der Küche stehen. Was bei uns auf den Tisch kommt, seht ihr ab sofort in kurzen Videos mit den Kindern. Wir starten mit dieser herrlichen Tomatensuppe, die ausnahmsweise bei mir jeder isst. AT 2020
- eventId: 1323626
  start: 2026-10-01T13:40:00Z
  stop: 2026-10-01T13:45:00Z
  title: Mein wunderbarer Kochsalon - Rindsgulasch im Thermomix
  subtitle: Mein wunderbarer Kochsalon - Rindsgulasch im Thermomix
  description: Ich bin ein bekennender Thermomix-Fan - er schafft für mich den perfekten Kompromiss zwischen hohen Ansprüchen, immer etwas Frisches zu kochen und wenig Zeit. Ich habe mich anfangs mit Händen und Füßen gegen das Gerät gewehrt, so etwas brauche ich nicht, ich rühre mein Risotto selbst... Mit drei Kindern und einem Job merkte ich schnell, dass mir wenig Wahl bleibt - entweder springe ich von meinem hohen Ross herunter und es gibt zum Mittagessen auch einmal ein Käsebrot oder ich muss eine Lösung finden. Ich rühre mein Risotto jetzt nur mehr fallweise selbst und das Gulasch macht mir auch mein Freund und Helfer. Mit der neuen Slow Cooking-Funktion wird das Fleisch extrem mürbe und die Sauce sämig. Genau, wie wir es gerne haben. Und ich habe 3 Stunden 20 Minuten Zeit, etwas Anderes zu tun. AT 2020
- eventId: 1323630
  start: 2026-10-01T13:45:00Z
  stop: 2026-10-01T13:50:00Z
  title: Mein wunderbarer Kochsalon - Tabbouleh mit Thunfisch
  subtitle: Mein wunderbarer Kochsalon - Tabbouleh mit Thunfisch
  description: |-
    Ich: "Louis, bitte komm in die Küche und hilf mir Mittagessen kochen."
    Louis: "Was gibt es denn?"
    Ich: "Etwas sehr Gutes."
    In der Annahme, ich koche das Einzige, was Louis bedingungslos in diese Kategorie einordnet, nämlich Nudeln, bequemte sich Mr. Lässig an meine Seite.
    Und dann das: Es gab Quinoa. Mit Gemüse. Und Thunfisch. Wäre die Kamera nicht gelaufen, hätte er mir eine Szene gemacht. So musste Louis da durch und hat sich tapfer geschlagen. Mein persönlicher Triumph: Er musste die Tabbouleh am Ende probieren und hat sie ehrlich für gut befunden. Erfolg auf der ganzen Linie. AT 2020
