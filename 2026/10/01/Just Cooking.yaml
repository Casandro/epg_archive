  title: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Patterson
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Patterson
  description: Die besten Köche der Welt - Zu Gast im Ikarus. Diesmal sind wir zu Gast bei Daniel Patterson in San Francisco. Der Amerikaner ist ein Denker, der sein Kochhandwerk stets mit neuen Ideen verfeinert, um damit seinen eigenen Ansprüchen gerecht zu werden. AT 2012
- eventId: 1323632
  start: 2026-10-01T14:20:00Z
  stop: 2026-10-01T14:45:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ikarus Team 2
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ikarus Team 2
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Jeden Monat schwingt ein anderer Spitzenkoch im Restaurant Ikarus den Kochlöffel - im Festspielmonat August ist alles anders. Kein Gastkoch, sondern Executive Chef Martin Klein und sein Team bekochen ihre Gäste in Salzburg mit einem eigens kreiierten 15-Gänge-Menü. Das Küchenteam präsentiert unter der Leitung von Executive Chef Martin Klein selbst eine herausragende Kombination aus ihren mannigfachen Erfahrungen, abwechslungsreichen Stilrichtungen sowie der großen Freude an neuen Kompositionen. Das Ergebnis: Ein fantastisches Menü mit unvergleichlicher kulinarischer Raffinesse. Ein Highlight ist der Fischgang, für den es diesmal hinausgeht zum Hallstättersee: Gemeinsam mit den Fischern macht sich das Team Ikarus auf die Jagd nach Reinanken. Die Besucher dürfen sich dieses Mal auf ein Menü aus 15 außergewöhnlichen Gängen freuen, das unter den fachkundigen Augen von Patron Eckart Witzigmann erdacht wurde. Kurz vorm ersten Abendservice steigt die Spannung: Werden die Köche im Hangar-7 die selbstgestellte Aufgabe bewältigen? AT 2018'
- eventId: 1323633
  start: 2026-10-01T14:50:00Z
  stop: 2026-10-01T15:15:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Mats Vollmer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Mats Vollmer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im schwedischen Malmö trifft Ikarus-Executive Chef Martin Klein auf einen ehrgeizigen Kollegen. Mats Vollmer hat mit seinem Restaurant Vollmers bereits zwei Michelin-Sterne erkocht - und sein nächstes Ziel ist ganz klar der Dritte. Ohne Investor im Rücken hat er es bereits in Skandinaviens kulinarische Oberliga geschafft und sein kleines Restaurant zur Attraktion seiner Heimatstadt gemacht. Grund genug für Martin Klein ihn zu besuchen und mit ihm ein Menü fürs Ikarus zu erarbeiten. Das ist gar nicht so einfach: Der junge Schwede benutzt Produkte aus dem allernächsten Umland, was den Küchenaustausch in Salzburg vor das eine oder andere Problem stellen könnte. AT 2018'
