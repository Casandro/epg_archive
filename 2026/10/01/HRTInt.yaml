- eventId: 1374017
  start: 2026-10-01T09:36:00Z
  stop: 2026-10-01T10:01:00Z
  title: Pogled preko granice - Hrvati u BiH
  subtitle: ' '
  description: U nedjelju 4. listopada održat će se opći izbori u Bosni i Hercegovini. Prvi put na biračkim mjestima primijenit će se nove tehnologije. Cilj je spriječiti krađu identiteta ili dopisivanje glasova. Koalicija nevladinih udruga upozorava da tehničke pripreme na biračkim mjestima kasne. Središnje izborno povjerenstvo tvrdi da sve ide prema planu. Gost emisije Zoran Krešić, novinar i politički analitičar iz Mostara. Zbog čega se u kampanji ne nude rješenja konkretnih problema? Hoće li Hrvati dobiti svojeg predstavnika? Što će donijeti upotreba novih tehnologija na ovim izborima? Kakvu izlaznost možemo očekivati? Proširuje se logistički centar u Posušju - Uskoro će biti izgrađena i nova zgrada koja će imati IT učionicu, konferencijsku dvoranu i pogon s CNC strojevima za praktičnu nastavu. Centar će biti prostor za razvoj novih ideja te poticaj mladim poduzetnicima. U Gornjem Vakufu-Uskoplju otvoren novi vrtić. Obilježeno 40 godina Caritasa u Banjaluci - Kako je tekao put od zabranjenog djelovanja do simbola solidarnosti i dostojanstva?
