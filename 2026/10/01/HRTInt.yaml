  stop: 2026-10-01T05:27:00Z
  title: Luda kuća (3), humoristična serija (28/34)
  subtitle: ' '
  description: 'Matilda je na Matematičkoj olimpijadi u Portugalu, a Miljenko piše kuharicu za muškarce čije su žene na službenom putu. Promocija kuharice, koju organizira Voloder, završi neuspješno radi Filipovog neopreza. Slavko se vraća iz Tupog Kuta s puno hrane, što spašava Miljenka i Filipa. Božena i Đuro kartaju i dobro zarađuju na turniru u staračkom domu, ali Božena nema mjere. Laci je zaljubljen u spremačicu Vericu i kvari sve planove bratiću Rudiju, koji se s njom želi zabaviti. Rudi to otkriva i "pomaže" Laciju u osvajanju Verice.  Gostuje: Igor Mešin Uloge: Ljubo Zečević, Ivan Glowatzky, Nada Gaćešić Livaković, Goran Grgić, Ljubomir Kapor, Jadranka Đokić, Pjer Meničanin, Marinko Prga Scenaristice: Zinka Kiseljak, Dora Delbianco, Tanja Kirhmajer Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
- eventId: 1294544
  start: 2026-10-01T05:27:00Z
  stop: 2026-10-01T06:18:00Z
  title: Romano Bolković - 1 na 1, talk show
  subtitle: ' '
  description: Gosti Romana Bolkovića su diplomati, državnici, znanstvenici, političari, svi koji sudjeluju u oblikovanju europskih i svjetskih politika te djeluju na političke procese.
- eventId: 1294545
  start: 2026-10-01T06:18:00Z
  stop: 2026-10-01T06:29:00Z
  title: 'Čarobna ploča - Školica: Ponavljanje slova H, G, LJ, NJ, Đ, DŽ (19/20)'
  subtitle: ' '
  description: 'Danas u Čarobnoj ploči ponavljamo, ne učimo, samo se zabavljamo. H, G, LJ, NJ, Đ, DŽ šest je slova, pisati smo ih naučili, nisu nam nova! Krešin je zadatak umjesto vas pisati, a ploča će hobotnicu, gusku i đurđice risati. No molimo za posebnu pozornost, upamtite, u učenju je najvažnije ponavljanje i upornost.   Autori: Ida Tomić i Dragutin Broz Uloge: Krešimir Mikić i Mila Elegović'
- eventId: 1294546
  start: 2026-10-01T06:29:00Z
  stop: 2026-10-01T06:54:00Z
  title: Amerikansko selo na Pelješcu, dokumentarni film
  subtitle: ' '
  description: 'Gotovo dva stoljeća traje iseljavanje iz malenoga pelješkog mjesta Duba. U potrazi za boljim životom uglavnom se odlazilo u Ameriku gdje se na rijeci Mississippi teško zarađivalo uzgajajući kamenice. Malo tko se vraćao u domovinu. Danas je u Dubi samo 39 stanovnika. Ovo je priča o njima i njihovu mjestu koje unatoč svojoj ljepoti i prirodnome bogatstvu koje ga okružuje, ipak, lagano umire.  Autorica: Milka Barišić Snimatelj: Tvrtko Mršić Montažer: Ivica Golik HTV, 2000.'
