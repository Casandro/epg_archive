  start: 2026-10-01T02:09:00Z
  stop: 2026-10-01T02:52:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Od velikih festivala i Zlatnih arena do malih ekrana - film "Proslava" stiže na Drugi program HTV-a. O nagrađivanom ostvarenju razgovaramo s redateljem Brunom Ankovićem i književnikom Damirom Karakašem. Na Međunarodni dan prevoditelja otvaramo pitanje može li umjetna inteligencija zamijeniti prevoditelje, ali i brojna druga zanimanja. Koji su poslovi najizloženiji promjenama, a koje će ljudske vještine u budućnosti dobivati na vrijednosti? Odgovore donosi stručnjak za umjetnu inteligenciju Aco Momčilović. Detour obilježava 20 godina djelovanja, predstavlja novi album i priprema veliki rođendanski koncert. Kako danas zvuči Detour i kako se bend mijenjao kroz dva desetljeća, otkrit će frontmen Nenad Borgudan.
