  description: U večerašnjem Artu tema nam je Odisej. Točnije, njegova popularnost i bezvremenost. Naime, gotovo tri tisuće godina nakon Homera, Odisej ponovno plovi, ovaj put u filmskom spektaklu Christophera Nolana, a njegovim tragovima, istočnim Jadranom, krenuo je još jednom Jasen Boko, putopisac i autor dopunjenog izdanja knjige "Tragovima Odiseja". Njega ćemo ugostiti u studiju i saznati brojne detalje, među ostalim, je li čarobnica Kirka doista živjela na Korčuli, Kalipso na Mljetu, a Lestrigonci u Omišu.
