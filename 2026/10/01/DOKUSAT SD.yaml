  description: Der Zweite Weltkrieg begann am 1. September 1939 als kriegerische Auseinandersetzung der Großmächte in Mitteleuropa und endete am 8. Mai 1945 als weltumfassende Katastrophe mit über 50 Millionen Toten und völlig verwüsteten Städten und Landschaften. Die Dokumentation erzählt die Chronik des Zweiten Weltkriegs anhand seltener Filmaufnahmen.
