  subtitle: Coast Guard Alaska - Im dichten Nebel
  description: 'In Old Harbor auf Kodiak Island zählt für einen 60-jährigen Schlaganfallpatienten jede Sekunde. Doch dichter Nebel erschwert dem Rettungshubschrauber der U.S. Coast Guard den Flug. Auch in der Region um Petersburg herrscht schlechte Sicht: Ein Flugzeug mit sieben Menschen ist dort über einem Waldgebiet abgestürzt. Bei der Suche nach Überlebenden fliegen Chris Enoksen und seine Kameraden mit ihrem Helikopter nur wenige Meter über die Baumwipfel.'
