  title: Tiere vor der Kamera - Die Unauffälligen der Rocky Mountains
  subtitle: Tiere vor der Kamera - Die Unauffälligen der Rocky Mountains
  description: 'Grizzly, Elch, Wapiti, Bighornschafe sind die Promis unter den Tieren der Rocky Mountains. In ihrem Schatten werden viele andere leicht übersehen: Streifenhörnchen, Goldmantelziesel, Rothörnchen, Murmeltiere, Baumstachler, Pfeifhasen und auch kleine Vögel, die meisterlich singen. Vom Tal bis in die Felsregion wuseln die unauffälligen Kleinen und sind mindest so unterhaltsam wie die Großen. Dazu grandiose Landschaft und ein bisschen Wildwestromantik.'
  genre:
  - '129'
  widescreen: true
- eventId: 1369148
  start: 2026-10-01T15:10:00Z
  stop: 2026-10-01T15:30:00Z
  title: Antarktis - Tage des Lichts
  description: Die Antarktis erlebt während der "Tage des Lichts" ihre magischsten Momente. Während des antarktischen Sommers strahlt die Landschaft in hellem Sonnenlicht, das das Eis in funkelnde Kristalle verwandelt. Robben sonnen sich auf Eisschollen, Pinguine watscheln über das Eis, und majestätische Wale durchqueren die glitzernden Gewässer. Diese Tage sind ein Fest für Forscher und Entdecker, die die einzigartige Schönheit und die Geheimnisse dieses faszinierenden Kontinents erleben möchten.
  widescreen: true
  subtitle: Antarktis - Tage des Lichts
  genre:
  - '129'
