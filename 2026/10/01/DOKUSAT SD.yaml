  description: An der Mündung des Colorado kommt kaum noch ein Tropfen Wasser an. Nach seiner Reise durch die Rocky Mountains und den Grand Canyon fällt er in Mexiko seit Jahrzehnten trocken. Zu groß ist der Wasserbedarf im Einzugsgebiet. Nun wollen Naturschützer seine Mündung wieder ergrünen lassen. Dafür müssen die Menschen entlang des Flusses dem Colorado einen Teil seines Wassers zurück geben.
