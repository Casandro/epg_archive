  title: Sea Patrol - Helden
  subtitle: Sea Patrol - Helden
  description: Die Crew der Hammersley entert ein Fischerboot. Es wird vermutet, dass Menschenschmuggler am Werk sind. An Bord wird schnell klar, dass die Crew radioaktiv verstrahlt ist. Die Besatzung erzählt, dass sich zwei Männer mit Koffern abgesetzt haben. Recherchen der Navcom ergeben, dass sich in den Koffern Cäsiumstangen befunden haben. AU 2011
  ageRating: 12
- eventId: 1323431
  start: 2026-10-01T01:30:00Z
  stop: 2026-10-01T02:14:00Z
  title: Sea Patrol - Willkommen an Bord
  subtitle: Sea Patrol - Willkommen an Bord
  description: Das Patrouillenboot "Hammersley" sichert die australischen Hoheitsgewässer. Außerdem ist ihre Besatzung für Hilfeleistungen jeder Art zuständig. Die Verantwortung für das Schiff trägt Lieutenant Commander Mike Flynn. Neu an Bord ist Lieutenant Kate McGregor. Die beiden hatten früher eine Affäre, doch nun wollen sie Privates von Beruflichem trennen. AU 2007
  ageRating: 12
- eventId: 1323432
  start: 2026-10-01T02:20:00Z
  stop: 2026-10-01T03:03:00Z
  title: Sea Patrol - Auf falschem Kurs
  subtitle: Sea Patrol - Auf falschem Kurs
  description: Durch eine minimale Kursabweichung verursacht Kate die Kollision mit einer Boje, die in keiner Karte verzeichnet ist. Um sich die Sache einmal genauer anzusehen, tauchen Swain und ET in die Tiefe. Die Boje ist mit einem hochwertigen Transponder versehen. AU 2007
  ageRating: 12
- eventId: 1323435
  start: 2026-10-01T03:10:00Z
  stop: 2026-10-01T03:53:00Z
  title: Sea Patrol - Geister der Vergangenheit
  subtitle: Sea Patrol - Geister der Vergangenheit
  description: Die Hammersley gerät in einen schweren Sturm. Nach einem Blitzeinschlag droht das Schiff zu kentern, doch die erfahrene Crew kann das Schlimmste verhindern. Chefo, Swain und Buffer ziehen Spider mit ihren Geschichten über Geisterschiffe auf. AU 2007
