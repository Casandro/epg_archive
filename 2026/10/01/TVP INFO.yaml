  title: Podróże z historią 3 (odc. 10)
  subtitle: Radosław Kotarski przemierza pola, restauracje i targi Ukrainy. Szuka odpowiedzi na pytanie, dlaczego o tym rejonie mówiono, że to spichlerz Europy.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Skoro pierogi ruskie nie pochodzą z Rosji, to skąd się wzięła ich nazwa? Czym różni się barszcz ukraiński od swojej polskiej wersji? Radek Kotarski przemierza pola, restauracje i targi Ukrainy. Szuka odpowiedzi na pytanie, dlaczego o tym rejonie mówiono spichlerz Europy. Razem ze swoimi przewodnikami po kresowych smakach przygotowuje potrawy w profesjonalnej restauracji, na polu i w zwykłym domu. Pokaże też, ile słodyczy znajdziemy w połączeniu ogórków i miodu.
  genre:
  - '149'
- eventId: 1184934
  start: 2026-10-01T01:20:00Z
  stop: 2026-10-01T01:56:00Z
  title: Polskie parki narodowe 1 (odc. 11)
  subtitle: Tematem programu będzie Poleski Park Narodowy, znany z rozległych torfowisk, bagien i jezior oraz wyjątkowej różnorodności ptaków i innych gatunków związanych z terenami podmokłymi.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
