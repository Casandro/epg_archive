  title: Podróże z historią 3 (odc. 10)
  subtitle: Radosław Kotarski przemierza pola, restauracje i targi Ukrainy. Szuka odpowiedzi na pytanie, dlaczego o tym rejonie mówiono, że to spichlerz Europy.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Skoro pierogi ruskie nie pochodzą z Rosji, to skąd się wzięła ich nazwa? Czym różni się barszcz ukraiński od swojej polskiej wersji? Radek Kotarski przemierza pola, restauracje i targi Ukrainy. Szuka odpowiedzi na pytanie, dlaczego o tym rejonie mówiono spichlerz Europy. Razem ze swoimi przewodnikami po kresowych smakach przygotowuje potrawy w profesjonalnej restauracji, na polu i w zwykłym domu. Pokaże też, ile słodyczy znajdziemy w połączeniu ogórków i miodu.
  genre:
  - '149'
