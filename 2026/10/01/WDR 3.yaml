- eventId: 714652
  start: 2026-10-01T20:03:00Z
  stop: 2026-10-01T21:00:00Z
  title: WDR 3 Jazz
  description: 'Was haben Tamara Lukasheva, Janning Trumann, Fabian Dudek oder Kollektive wie KLAENG oder The Dorf gemeinsam? Alle bringen ihre Musik unabhängig von Plattenfirmen auf eigenen Labels raus. Die Effekte sind vielfältig: Einerseits mehr künstlerische Freiheit, aber auch mehr Aufwand und Verantwortung. Und fürs Publikum eine lange Zeit ungeahnte Auswahl, die manchmal kaum noch zu überblicken ist.'
  subtitle: 'Auf eigene Rechnung: Musiker-Labels in NRW'
