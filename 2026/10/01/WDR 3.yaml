  title: WDR 3 Konzert
  subtitle: WDR 3 Kammerkonzert in NRW
  description: "Mit seinem Projekt \"Die Planeten\" startet das Morgenstern Trio in den Weltraum. Merkur als sonnennächster Planet inspiriert Márton Illés zur Komposition \"Mercury Spin\", in der er mit extremer Intensität eine einzige Drehung des Planeten illustriert. Das Morgenstern Trio kombiniert dazu Holsts \"Merkur\", flankiert von einem feurigen Beethoven- und einem leidenschaftlichen Mendelssohn-Trio.\n<strong>Franz Schubert<br/></strong>Adagio Es-Dur D897 \"Notturno\"\n<strong>Ludwig van Beethoven<br/></strong>Klaviertrio Es-Dur op. 1,1\n<strong>Márton Illés<br/></strong>Mercury Spin<br/>Uraufführung\n<strong>Gustav Holst<br/></strong>Bearbeitung: Georg Oyen<br/>Merkur, aus der Suite \"Die Planeten\" op. 32\n<strong>Felix Mendelssohn Bartholdy<br/></strong>Klaviertrio Nr. 1 d-Moll op. 49\n<strong>Morgenstern Trio:</strong> <br/>Catherine Kipfel, Klavier<br/>Stefan Hempel, Violine<br/>Emanuel Wehse, Violoncello \nAufnahme vom 19. März 2026 aus der Festhalle Viersen\nModeration: Kirsten Betke<br/>Redaktion: Simon Al-Odeh"
