- eventId: 714661
  start: 2026-10-01T21:03:00Z
  stop: 2026-10-01T22:00:00Z
  title: WDR 3 Open
  description: '"Diskurs" verhandelt die Themen des Musiklebens, die nicht Personen-, Jubiläums- oder Anlassgebunden sind. Weder Musiker noch Funktionäre stehen im Fokus, sondern Themen. Das Spektrum reicht von der (medienübergreifenden) Meinungsschau (von Autoren präsentiert) über Dreiergespräche, die durch relevante Musik gegliedert werden bis hin zu  spielerischen Dialogformaten wie dem Blindfoldtest.'
