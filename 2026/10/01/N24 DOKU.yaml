  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  description: 'Vor fünfundzwanzig Jahren kam es am Nachthimmel über Phoenix, Arizona, zu einer spektakulären UFO-Massensichtung. Eine Reihe faszinierender Lichtformationen überquerte lautlos die Himmel über dicht besiedelten Städten. Am Abend des 13. März 1997 ging um etwa neunzehn Uhr die erste Meldung ein: Etwas Ungewöhnliches geschehe am Nachthimmel. In den nächsten achtundvierzig Stunden erreichten die Behörden zahlreiche Anrufe. Könnten diese Sichtungen auf außerirdische Lebensformen hindeuten?'
  widescreen: true
