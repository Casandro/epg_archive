  title: In persona Christi - Das sakramentale Priestertum in der Kirche
  subtitle: Priesterliche Berufungspastoral
  description: 'Wie findet die Kirche für die Zukunft ihre Priester? - Die Sorge der Kirche um priesterliche Berufungen ist ein Herzensanliegen des Herrn selbst. Er bittet seine Jünger um das Gebet für Arbeiter in seinem Weinberg. Mit dem Gebet gilt es, ein wohlwollendes ''Klima der Berufung'' zu schaffen, das den Ruf Gottes ins menschliche Herz durchdringen und erkennen lässt: Ich bin vom Herrn gerufen und von der Kirche erbeten. Priesterliche Berufungspastoral ist also eine Verpflichtung der ganzen Kirche!'
