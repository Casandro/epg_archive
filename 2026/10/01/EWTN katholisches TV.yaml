  title: Bericht aus Genf - mit Christian Peschken
  subtitle: 'Flüchtlingsschutz in Gefahr: ICMC warnt vor einem Kurswechsel'
  description: |-
    Weltweit sind Millionen Menschen auf der Flucht - während gleichzeitig in vielen Ländern die politische Debatte über Migration und Flüchtlinge deutlich härter wird. Seit 75 Jahren setzt sich die Internationale Katholische Migrationskommission, ICMC, für Flüchtlinge und Migranten ein. Doch was kann sie heute noch bewirken - und welche Rolle spielt dabei der Heilige Stuhl?

    Christian Peschken (EWTN) spricht in diesem ersten Teil seines Interviews mit Davide Bernocchi General Sekretär der Internatiomnalen Katholischen Migrations Kommission (ICMC) in Genf.
  widescreen: true
- eventId: 1213505
  start: 2026-10-01T13:45:00Z
