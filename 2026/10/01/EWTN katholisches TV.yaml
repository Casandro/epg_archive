  title: Pater Johann
  subtitle: Der unbarmherzige Diener
  description: 'Uiuiui... Es gibt Streit! Unsere kleinen Freunde Renate, Tim und Leopold streiten sich. Was ist los? Werden sie sich versöhnen? Jetzt muss Pater Johann ihnen eine Geschichte erzählen: das Gleichnis von dem unbarmherzigen Diener. Kennst DU diese Geschichte? Komm mit und erfahre mehr mit Pater Johann!'
  widescreen: true
