- eventId: 1213556
  start: 2026-10-01T18:30:00Z
  stop: 2026-10-01T19:00:00Z
  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Eine abenteuerliche Reise
  description: |-
    Anna Diouf im Gespräch mit Joachim Rechholz

    Die erste Begegnung mit der evangelischen Landeskirche ist ernüchternd: Offenbar glaubt der Pfarrer selbst nicht, was er vermitteln soll. Ganz anders sieht das in der Freikirche aus. Aber vorerst führt Joachim Rechholz` Weg in eine andere Richtung. Bei den Zeugen Jehovas trifft er seine große Liebe. Doch sein Blick bleibt offen für die Welt um ihn herum, und schließlich zieht es ihn in eine evangelische Freikirche. Doch am Ziel ist er noch nicht! Erst in der Kirche, die auf den Felsen Petri gegründet ist, in inniger Gemeinschaft mit dem eucharistischen Herrn, findet er Heimat: Christus im Mittelpunkt.
  widescreen: true
- eventId: 1213557
  start: 2026-10-01T19:00:00Z
  stop: 2026-10-01T19:30:00Z
  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Feuerzungen auf dem Zion - Vom dritten Geheimnis des glorreichen Rosenkranzes
  description: Auf dem Gipfel des Zion verdichtet sich das Wirken Gottes. Hier hat Jesus Christus die Eucharistie eingesetzt. Hier ist fünfzig Tage nach der Auferstehung Christi der Heilige Geist in die Welt eingebrochen, der Beistand den Jesus angekündigt hatte. Hier war die Geburtsstunde der Kirche. Paul Badde folgt den Spuren Jesu und seines Wirkens im Heiligen Land.
  widescreen: true
- eventId: 1213558
  start: 2026-10-01T19:30:00Z
  stop: 2026-10-01T20:00:00Z
  title: Maria - Zwischen Himmel und Erde
  subtitle: Maria als "Miterlöserin"
  description: 'In der 12. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup über Maria als "Miterlöserin". Können wir Maria als Miterlöserin feiern? Johannes Paul II. sprach 1987 von der Mittlerschaft Mariens in Christus. Das Problem ist das Solus Christus der Neuzeit, das aus der Konkurrenz kommt. Wenn die Konkurrenz wegfällt, ist nicht nur Maria Miterlöserin, sondern jeder Mensch: Gott will dich nicht retten ohne dich. Das entspricht der Kirchenlehre von Lumen Gentium und der allgemeinen Berufung zur Heiligkeit in der Kirche.'
  widescreen: true
