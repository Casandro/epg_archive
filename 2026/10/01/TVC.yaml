    US, 2016
    Reżyseria: Andy Schlachtenhaufen
    Występują: Dan Nachtrab, Teddy Rodriguez, Ryan Boone, Demetrius Butler, Isabella Eisenpresser, Madeleine Falk
    Ludzkiej cywilizacji nieustannie zagraża atak z kosmosu. Nie chodzi jedynie o obiekty takie jak asteroidy. Do Błękitnej Planety z prędkością światła zbliża się bowiem czarna dziura. Jej oddziaływanie jest już teraz odczuwalne. To wzmożona aktywność wulkanów, trzęsienia ziemi i tsunami, których siła jest większa niż kiedykolwiek wcześniej.
