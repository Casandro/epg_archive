  subtitle: Ludzką cywilizację atakuje niewidzialne zagrożenie z kosmosu. Supermasywna czarna dziura zbliża się do planety. Ogromne siły grawitacyjne wywołują trzęsienia ziemi, wybuchy wulkanów i tsunami.
  description: |-
