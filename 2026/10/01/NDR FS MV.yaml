  description: 'Mit dem Eröffnungsspiel der FIFA Fußball-WM 2006 in München beginnt auch in Hamburg rund um die Davidwache auf St. Pauli eine riesengroße Fußballparty. Für die Hamburger Polizei ist das eine Herkulesaufgabe: Mehrere Hundert Beamte sollen verhindern, dass Frust und Verärgerung der Fans eskalieren. Hunderttausende Besucher feiern auf dem Kiez; beim FIFA-WM-Fest auf dem Heiligengeistfeld verfolgen pro Spiel mehrere Zehntausend Menschen die Live-Übertragungen. Reporter Sebastian Bellwinkel begleitet die Polizei zu Beginn der WM vier Tage lang bei ihren Streifen auf dem Kiez und an der Elbe.'
