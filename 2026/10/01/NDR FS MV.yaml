  description: Ein Umzug kann nervenaufreibend sein. Das ist schon bei einem einzelnen Haushalt eine Herausforderung, wie ist es dann, wenn zeitgleich 13 Kliniken umziehen müssen - inklusive sensibler Technik und mehr als 300 teils schwerstkranken Patienten? Die Nordreportage zeigt den Umzugsmarathon, dessen Verlauf mehr als zwei Jahre geplant wurde. Bei allen Beteiligten sind Flexibilität und gute Nerven gefragt.
