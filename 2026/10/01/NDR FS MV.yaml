  title: In aller Freundschaft (316)
  subtitle: Reine Nervensache
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: Thomas Kraft wird mit einem Schlaganfall in die Sachsenklinik eingeliefert. Eine angeborene Verengung der Halsschlagader wird festgestellt. Der Schlaganfall ist durch ein Blutgerinnsel ausgelöst worden, das operativ aufgelöst werden soll. Dr. Heilmann muss die Operation aber abbrechen, weil ihm die Hände zittern. Er übergibt an Dr. Martin Stein und beschließt, sofort mit Pia wegzufahren, um von seinem harten Job abzuschalten. Aber die Heilmanns kommen nicht weit. Sie übernachten in einer Scheune und erleben eine wunderschöne Nacht und einen unbeschwerten Tag. Endlich können sie über Alinas und Vladis Tod und ihre Trauer reden.
