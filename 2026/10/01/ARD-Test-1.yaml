    In der Nacht vernimmt Streifenpolizistin Ida Sörensen eindringliche Hilferufe vom Kirchturm. Gemeinsam mit ihrer jungen Kollegin Emma trifft die Polizistin am Dom von Ribe ein. Dort, hoch oben im Turm, bedroht ein Mann eine junge Frau mit einem Messer. Ida und Emma ziehen die Waffen, als die mächtige Glocke plötzlich laut schlägt. Im Eifer des Gefechts erschießt Emma den Angreifer Finn Eriksson - das Opfer Bente Bruun stürzt dabei in den Tod.
