  title: Daheim & Draußen (Wh.)
  subtitle: 50 Jahre Friedberger Wochenmarkt und Kräuter haltbar machen mit den Gartenfreunden
  description: In dieser Folge wird es gesund und lecker! Wir sprechen im Studio mit Roland Gerkens, dem Marktmeister der Stadt Friedberg, über den Friedberger Wochenmarkt und das anstehende 50-jährige Jubiläum. Außerdem werfen wir auch einen Blick hinter die Kulissen des Augsburger Startmarktes und wir lassen uns von den Gartenfreunden Tipps für haltbare Kräuter geben. Moderation Sabine Köppe
