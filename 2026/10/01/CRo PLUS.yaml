  title: Pro a proti
  description: Práce na živnost nebo zaměstnání? Vláda chce novou definicí změnit posuzování toho, kdy ještě člověk pracuje pro společnost na živnostenský list. Podle kritiků ovšem otevírá cestu k legalizaci "švarcsystému", zaměstnavatelé naopak mluví o potřebném zpřesnění pravidel. Přinese nová definice větší právní jistotu, nebo připraví část pracovníků o ochranu? A odpovídá vůbec dnešní zákoník práce tomu, jak se proměňuje pracovní trh? Hosty pořadu budou předseda ČMKOS Josef Středula a viceprezidentka Hospodářské komory Jaroslava Rezlerová. Moderuje Lukáš Matoška.
