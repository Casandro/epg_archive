  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (2/10. V mládí chtěl být středem pozornosti, dotován svým otcem se snažil zalíbit mladíkům z výše postavených rodin, rytířům, mezi které nepatřil. Pak ale nasedl na koně a vyjel do assisko-perugijské války, ve které padl do zajetí. Válka, věznění a následná dlouhá nemoc stály na počátku Františkova obrácení. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
