  title: Názory a argumenty
  subtitle: Den pohledem renomovaných komentátorů. Moderuje Ondřej Konrád.
  description: Debata ve sněmovně při mimořádné schůzi na téma vyslovení nedůvěry vládě. Potvrdí v komunálních volbách hnutí ANO minulý triumf? Co může vytěžit premiér Fico ze slovenské vládní krize. Spojené státy definitivně odcházejí z Iráku. Donald Trump se před kongresovými volbami potýká s republikánskou kritikou války s Íránem a deportační politiky. Středeční vydání Názorů a argumentů moderuje Ondřej Konrád.
