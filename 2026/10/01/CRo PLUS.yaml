  title: Přes Atlantik
  subtitle: Podcast Českého rozhlasu Plus o americké politice a každodenním životě v USA.
  description: Podpora prezidenta Donalda Trumpa podle několika sociologických agentur klesla na nejnižší úroveň jeho dosavadní politické kariéry. Kdo opouští trumpovskou voličskou koalici a kdo naopak dál stojí za prezidentem a Republikánskou stranou těsně před "midterms"?
