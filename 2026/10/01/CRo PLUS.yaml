  description: Terezie Kaslová, vnučka Ferdinanda Peroutky. "Ten pásek je bůhvíkde, nejspíš v archivu rozhlasu. Je mi tedy líto, že jsem vás trápil zbytečně," napsal v dopise Ferdinandu Peroutkovi Václav Havel rok poté, co s ním v roce 1968 natočil v Americe rozhovor o exilu. Nahrávka čekala na zveřejnění 58 let. Jak Havel na Peroutku vzpomínal a co se z rozhovoru o Ferdinandu Peroutkovi dozvěděla jeho vnučka? Moderuje Světlana Witowská.
