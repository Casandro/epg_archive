  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: Carolina Sidon je výtvarnice, metodička a lektorka Muzea Říčany, která spoluorganizuje konferenci Architektura dětem s podtitulem Hravé město pro všechny. V řadě evropských měst už existují strategie, které pomáhají plánovat, kde a jak vytvářet příležitosti ke hře a spolu s nimi i k setkávání, učení nebo budování komunit. V Česku se prostor pro hru zatím většinou řeší prostřednictvím jednotlivých dětských hřišť. Jak vypadá ideální město nebo prostředí, kde mají děti možnost svobodně si hrát, tvořit a objevovat svět vlastním tempem? Co bychom měli změnit v našem přístupu k plánování veřejných prostor, abychom dětem i dospívajícím nabídli víc než jen tradiční hřiště a umožnili jim zažít skutečné dobrodružství? Moderuje Markéta Vozková.
- eventId:
