  title: First Blood - Die Geburt eines Serienmörders
  subtitle: |-
    Arthur Shawcross - Der Genesee-River-Killer
    Doku-Reihe, USA 2022
    Altersfreigabe: ab 16
  description: Arthur Shawcross wuchs in einer Kindheit voller Kontrolle, Missbrauch und Gewalt auf, die früh sadistische Fantasien weckte. Als Jugendlicher quälte er Tiere, und als er in den Vietnamkrieg eingezogen wurde, wurde das Töten zur bitteren Realität. 1972 nahm er erstmals einem zehnjährigen Jungen das Leben. Bis 1990 folgten zwölf weitere Opfer, meist Prostituierte und Obdachlose, die er erdrosselte und am Genesee-River zurückließ.
  widescreen: true
