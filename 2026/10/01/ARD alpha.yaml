  title: TELEKOLLEG Französisch (7/39)
  subtitle: Bon Courage
  description: |-
    Fragewort "quel", "pouvoir" (können), "vouloir" (wollen)
    In Aix-en-Provence hat Jean Legrand eine Autopanne. Und er steht im Halteverbot! Da ist sofort eine eifrige Politesse mit einem Strafzettel zur Stelle. Es geht u. a. um die Verben "pouvoir", "vouloir" und das Fragewort "quel".
- eventId: 767989
  start: 2026-10-01T05:00:00Z
  stop: 2026-10-01T05:15:00Z
  title: GRIPS Mathe (32/42)
  subtitle: Umgekehrt-proportionale Zuordnungen
  subtitled: true
  description: Ein Fußballturnier steht an und dafür brauchen Mathelehrer Basti Wohlrab und seine beiden Schüler noch dringend Trikots. Damit die Trikots nicht so langweilig aussehen, möchte jede Mannschaft ihr eigenes Logo entwerfen. Das geht am besten mit Hilfe von geometrischen Formen - Dreiecken, Vierecken und Vielecken. Die beiden Schüler Josephine und Sascha lernen die Eigenschaften dieser geometrischen Formen kennen und Basti zeigt, wie man sie mit Zirkel und Geodreieck konstruiert. Zum Abschluss konstruieren die drei mit dem Bestimmungsdreieck ein regelmäßiges Achteck.
- eventId: 767990
  start: 2026-10-01T05:15:00Z
  stop: 2026-10-01T05:30:00Z
  title: GRIPS Mathe (33/42)
  subtitle: Funktionale Zusammenhänge
  subtitled: true
  description: Heute wird gerodelt. Doch welcher Tarif ist bloß am günstigsten? Ziemlich ratlos stehen Maurice und Julia vor der Preistafel. Als sie sich allerdings mit dem Zahlenwirrwarr beschäftigen, merken sie, dass die Preise eigentlich ganz leicht zu durchschauen sind. In dieser Lektion geht es um funktionale Zusammenhänge. Von einem funktionalen Zusammenhang spricht man, wenn man aus dem Wert einer Größe auf den Wert einer anderen (davon abhängigen) Größe schließen kann. Was das bedeutet, zeigen wir dir am Beispiel des Tarifsystems für eine Sessel- und Rodelbahn.
- eventId: 767991
  start: 2026-10-01T05:30:00Z
  stop: 2026-10-01T05:55:00Z
  title: Willi wills wissen
  subtitle: Wie schlau sind Tiere?
  subtitled: true
  description: 'Tiere können vieles besser als Menschen: Hunde haben eine super Spürnase, Affen sind unübertrefflich beim Klettern und gegen einen Geparden hat kein Hundertmeterläufer eine Chance. Wieviel Grips haben unsere tierischen Verwandten eigentlich?'
