  title: Unexpected Killer - Die Mörder von nebenan
  subtitle: |-
    Kein guter Freund
    Dokumentation, USA 2021
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 24.09.2026, 20:15 Uhr)
  description: Als ein liebervoller Großvater brutal ums Leben kommt, steht eine Kleinstadt unter Schock. Wer könnte das geschätzte Mitglied der Gemeinde auf dem Gewissen haben? Die Polizei ist sich sicher, dass der verschwundene Truck des Opfers der Schlüssel zum Fall ist. Die Wahrheit entpuppt sich schließlich als perfider Verrat aus nächster Nähe - und die Tatwaffe, ebenso unerwartet wie entsetzlich, offenbart das Ausmaß einer Tragödie.
  widescreen: true
