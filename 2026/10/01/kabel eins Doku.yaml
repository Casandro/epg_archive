  title: First Blood - Die Geburt eines Serienmörders
  subtitle: |-
    Anthony Sowell - Der Cleveland-Strangler
    Doku-Reihe, USA 2022
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 24.09.2026, 23:25 Uhr)
  description: 'In Cleveland verschwanden afroamerikanische Frauen spurlos. Bald offenbarte sich das grausame Geheimnis: Alle wurden Opfer eines Mannes mit einer von Gewalt gezeichneten Vergangenheit. Bereits mit elf Jahren vergewaltigte Anthony Sowell seine Cousine. Seine finsteren Fantasien ließen ihn nicht los - zwischen 2007 und 2009 entfachte er einen mörderischen Albtraum. Elf Frauen fielen seinem Horrorhaus zum Opfer, während ein fauliger Gestank die Nachbarschaft durchzog.'
  widescreen: true
