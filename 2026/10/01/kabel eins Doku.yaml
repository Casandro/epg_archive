  subtitle: |-
    Die ganze Wahrheit
    Dokumentation, GB 2025
    Altersfreigabe: ab 12
  description: Nach Peter Sutcliffes Verhaftung stellt die Polizei in West Yorkshire fest, dass sie an der Nase herumgeführt wurden. Drei weitere Menschen sterben. Um den Ruf der Behörde wiederherzustellen, macht sich der inzwischen zum Detective Chief Superintendent beförderte Chris Gregg auf die Suche. Wird es ihm gelingen, den Mann zu finden, der der Polizei so großen Schaden zugefügt hat, und ihn der Justiz zuzuführen?
  widescreen: true
