  ageRating: 6
  genre:
  - '16'
  description: |-
    Es gibt mal wieder richtig Krach auf der Wache, weil Edwin und Günter versäumt haben, die Tickets für den Polizeiball zu besorgen. Plocher kommt auf die grandiose Idee, einen Mediator zu engagieren, um den Frieden wieder herzustellen.
    Doch schon vor dem ersten Gespräch wird ein Attentat auf Jörg Fischer, den Mediator, verübt. Wer könnte ihm nach dem Leben trachten? Vielleicht die beiden Motoradclubs, die Knight-Riders und die Knightrider's, die sich wegen der Namensähnlichkeit in den Haaren lagen und zwischen denen Fischer vermitteln sollte? Nach der ersten Sitzung mit dem Mediator scheint das dem Team gar nicht mehr so abwegig.
- eventId: 561085
  start: 2026-10-01T13:10:00Z
  stop: 2026-10-01T14:00:00Z
  title: Rentnercops - 31. Wie man's macht
  subtitle: Deutschland 2018
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  genre:
  - '16'
  description: |-
    In Köln-Mühlheim bleibt der Polizeinachwuchs aus. Günter hat Rücken. So sehr, dass er sich kaum noch die Schuhe binden kann. Und Edwin müsste nach seinem Infarkt eigentlich auch noch eine Reha machen.
    Da trifft es sich gut, dass ihr nächster Fall sie in eine renommierte Sport- und Rehaklinik führt, in der Dr. Jamm tot aufgefunden wurde. Der Tatverdacht fällt auf den Gärtner der Klinik, mit dessen Frau Jamm offenbar ein Verhältnis hatte.
    Aber Edwin und Günter haben so ihre Zweifel und gehen inkognito als Patienten in die Klinik. Leider müssen sie ein Zimmer teilen.
