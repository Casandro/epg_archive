  description: 'Das Pelikanrevier wird umgebaut und damit hier keiner den Abflug macht, werden die Vögel für ein paar Tage umquartiert. Eine gefährliche Riesenschlange? Von wegen: Boa Anton ist lammfromm und bei Groß und Klein extrem beliebt. Fische kauft man im Fischladen, wo jedoch bekommt man gleich 15 Tonnen her? Elefantenbaby Ludwig trifft heute zum ersten Mal auf seine kleine Schwester. Ups - hat er etwa Angst vor ihr? Diese und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".'
- eventId: 561084
