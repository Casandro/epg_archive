  title: ArtCafé
  description: '"Kultura slovenského lidu má být slovenská a žádná jiná", prohlásila před časem slovenská ministryně kultury Martina Šimkovičová. Jak aktuální dění u našich sousedů vnímají slovenští i čeští autoři a autorky? To se dozvíme na velké výstavě pojmenované "?a žiadná iná!", kterou uspořádal brněnský Dům umění. O kulturně-společenské situaci na Slovensku i o záměrech brněnské přehlídky si bude Hana Slívová povídat s organizátory výstavy. E-mail: artcafe@rozhlas.cz'
