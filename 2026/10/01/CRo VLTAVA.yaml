  title: Četba na pokračování
  description: 'Julien Green: Bratr František (2/15). Biografický román francouzského prozaika líčí životní dráhu asi největší postavy středověkého mnišství od jeho zrození v rodině soukeníka z umbrijského městečka Assisi, přes bezstarostné mládí a zlomový okamžik, kdy se rozhodl opustit kariéru obchodníka a založit bratrstvo, které se vydalo cestou naprosté chudoby. Z překladu Anděly Janouškové připravila Alena Heroutová. Účinkuje Jan Hartl. Režie Hana Kofránková (26 min). Natočeno v roce 2003'
