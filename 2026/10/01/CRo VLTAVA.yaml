  title: Vizitka
  description: 'Alžběta Tichá, novocirkusová umělkyně, akrobatka. Miluje výšky a ráda se jich bojí. Akrobatka Alžběta Tichá patří k výrazným osobnostem současného českého nového cirkusu a někteří o ní mluví dokonce jako o úkazu. Ve své autorské inscenaci Frekvence zkoumá, co se s jejím tělem a srdcem děje při různých typech aktivit - a to všechno ve výškách, zavěšená na laně. Výkon Alžběty Tiché zaujal i porotu letošních Cen Thálie, která ji za Frekvenci nominovala v kategorii Alternativní divadlo. Ocenila především odvahu a náročnost jejího experimentu i jeho výraznou estetickou podobu. Jaký zážitek by si měli diváci z jejích performancí odnést? A kde je pro ni na laně hranice mezi kontrolou a odevzdáním se pohybu? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
