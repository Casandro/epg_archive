  title: Planet Weltweit - Kaviar, das schwarze Gold Italiens
  subtitle: Planet Weltweit - Kaviar, das schwarze Gold Italiens
  description: 'Kaviar gehört seit langem zur italienischen Küche und muss dafür nicht einmal importiert werden: Störe, deren Rogen die Grundlage für die Delikatesse bilden, schwimmen seit Jahrhunderten den Po, Italiens längsten Fluss, hinauf. Seit der Fisch unter Artenschutz steht, darf er nur noch von Zuchtfischen gewonnen werden. GEO Reportage hat einen der erfolgreichen Störzüchter Italiens besucht, dessen Kaviar inzwischen sogar bis nach Russland exportiert wird. Wohl jeder verbindet mit Kaviar unweigerlich Luxus und Russland. Doch dort, wo die kostbaren Fischeier des Störs zwar immer noch in großen Mengen verspeist werden, dürfen sie nicht mehr produziert werden. Seit der Stör durch Überfischung in Russland vom Aussterben bedroht ist und nicht mehr gefangen werden darf, muss die Delikatesse importiert werden. Unter anderem aus Italien. Dort wurde speziell in der weitläufigen Po-Ebene Norditaliens seit den 1990er Jahren in spezialisierten Betrieben die Zucht der empfindlichen Fische perfektioniert und seit einigen Jahren mit erheblichen finanziellen Aufwand die Wiederansiedlung des Störs im Po voran getrieben. Der 650 Kilometer lange Fluss war traditionell Wander- und Laichgebiet des Störs. Die Fischart wurde erst durch die Industrialisierung des Flusses in den 1930er Jahren vertrieben. Die Störzuchtanlage von John Giovannini und seinem Bruder Sergio liegt in Cassolnovo, 30 Kilometer westlich von Mailand. Auf einer Fläche von 35 Hektar wachsen hier 300.000 Störe heran. Getrennt nach Alter, Geschlecht und Fischart wie dem russischen und dem adriatischen Stör. Je nach Art benötigen weibliche Störe zwischen zehn und 20 Jahre, bis sie geschlechtsreif sind und die begehrten Fischeier produzieren. Schon der Vater der Brüder begann mit der Zucht der Störe. Heute ist die Familie erfolgreicher denn je. Und nicht nur sie: Nach China ist Italien heute der zweitgrößte Kaviarproduzent der Welt.  DE 2019'
  ageRating: 12
