  title: Planet Weltweit - Das Vermächtnis der Marquesas-Inseln
  subtitle: Planet Weltweit - Das Vermächtnis der Marquesas-Inseln
  description: "Nahezu verloren wirken die Marquesas im nördlichen Teil Französisch-Polynesiens: vulkanische Inseln inmitten des Pazifik, weit abgelegen von jedem Kontinent. Und doch prägte die Kultur ihrer Bewohner, ihre Kunst und Sprache, einst den gesamten südpazifischen Raum. \n\nDie Marquesaner behaupten, die Inseln seien so weit abgelegen, dass ihre nächsten Nachbarn die Götter sind. In der Tat sind es bis nach Neuseeland über 5000 Kilometer, nach Australien mehr als 6000. In dieser Abgeschiedenheit entstanden einst eine lebendige Kultur und Religion, die später den gesamten südpazifischen Raum beeinflusst haben. Auf der Suche nach neuen Lebensräumen besiedelten die Marquesaner etwa die Osterinseln oder Hawaii und brachten ihre Lebensweise, ihre Gesänge und Tänze, und ihre Religion mit. Auch die heute weltweit beliebten \"Tataus\", die Tätowierungen, stammen von den Marquesas. Als die Inseln jedoch Ende des 18. Jahrhunderts unter den Einfluss europäischer Eroberer und Missionare gerieten, wurden die Menschen gezwungen, ihre Jahrtausende alten Traditionen aufzugeben; ihre Kultur ging verloren. Erst in den vergangenen Jahren wurde deren Wert wiedererkannt, sowohl von den Einheimischen als auch von westlichen Wissenschaftlern. Einer von ihnen ist der französische Archäologe Pierre Ottino. Zusammen mit einheimischen Jugendlichen versucht er, das Leben auf den Inseln vor der Okkupation zu rekonstruieren: In mühevoller Kleinarbeit legen sie die Überreste einstiger Siedlungen frei, entdecken tief in die Erde gegrabene Opferstätten und steinerne Göttergestalten - so genannte Tiki. Kein leichtes Unterfangen, denn viele dieser Stellen liegen im dichten Dschungel oder an unzugänglichen Buchten. \n DE 2004"
  ageRating: 6
