  title: Planet Weltweit - Schignano, ein uralter Karneval in Italiens Bergen
  subtitle: Planet Weltweit - Schignano, ein uralter Karneval in Italiens Bergen
  description: 'Schignano. Seit Jahrhunderten feiern die Menschen hier mit einem archaischen, wilden Karneval das Ende des Winters. Sie spielen in bunten, selbstgenähten Kostümen die "Wilden", in einem Bergdorf hoch über dem Comer See. In den Straßen tanzen die "Belli" und die "Brutti". GEO Reportage hat die Menschen hinter den schaurigen Holzmasken besucht. Einmal im Jahr legen die Bewohner der Gemeinde Schignano ihre Identität ab, um einen rauschhaften, euphorischen, wild-ungezügelten Karneval zu feiern. Die meisten Bewohner hier fahren täglich zum Arbeiten in die benachbarte Schweiz. Schignano hat eine lange Migrationstradition. Schon Anfang des 20. Jahrhunderts suchten die Männer in Australien, Südamerika und den USA ihr Glück. Die Frauen blieben mit Kindern und Hof allein zurück. Damals wie heute waren jedoch einmal im Jahr alle wieder zu Hause: Zur Karnevalszeit. Nicht zuletzt deswegen ist in Schignano der Karneval eng an das Thema Auswanderung geknüpft, die "Belli", die Schönen und Erfolgreichen und die "Brutti", die Hässlichen und Erfolglosen liefern sich wilde, deftige Szenen, begleitet von viel Alkohol. Battista, ein alteingesessener, berühmter Maskenschnitzer der Region erklärt die Kostüme:" Der Schöne ist der, der die Welt bereist hat und zu Geld gekommen ist. Sein Bauch steht für Wohlstand, er trägt üppigen Schmuck, große, blumige Hüte, macht sich wichtig und gibt sich arrogant. Der Hässliche ist das exakte Gegenteil: Er symbolisiert einen schlechten Lebenswandel, trinkt viel und trägt zerschlissene Kleider. Er ist voller Wut gegenüber den Schönen und Reichen. Das ganze Jahr ist Battistas Frau mit dem Nähen und Besticken der schrillen Kostüme beschäftigt. Wie alle hier hofft sie, dass der Karneval auch in Zukunft weiterleben wird. DE 2020'
- eventId: 1323611
  start: 2026-10-01T20:15:00Z
  stop: 2026-10-01T21:07:00Z
  title: Planet Weltweit - Notruf Nordseeküste - Die Robben-Retter
  subtitle: Planet Weltweit - Notruf Nordseeküste - Die Robben-Retter
  description: 'Die Nordsee ist ihr Revier: Seehunde und Kegelrobben, zwei Robbenarten, die miteinander verwandt sind und zu den sogenannten "Hundsrobben" gehören. Sie sind perfekt an ein Leben über und unter Wasser angepasst. Aber wenn Menschen den Robbenbabys zu nah kommen, flüchten die Mütter und nehmen ihren Nachwuchs auch später nicht mehr an. Dann müssen die Robben-Retter ausrücken, um die kleinen "Heuler" mit ihren Kulleraugen vor dem sicheren Hungertod zu bewahren. Jedes Jahr im Frühsommer werden auf den Sandbänken und an den Stränden der Nordsee Hunderte Seehundbabys geboren. Manchmal werden diese Welpen von der Mutter getrennt und können nicht mehr gesäugt werden. Dies passiert zum Beispiel, wenn Menschen oder Hunde den Robbenbabys zu nah kommen oder sie sogar streicheln. Riecht ein Jungtier nach Mensch, wird es von der Mutter nicht mehr angenommen und zurückgelassen, dann heult es vor Hunger und Einsamkeit. Von Borkum bis Helgoland sammeln die Robben-Retter sie ein und bringen sie in die nächstgelegene Seehundstation. Dort werden die Babys tierärztlich versorgt, wieder aufgepäppelt und in den nächsten Wochen aufgezogen. Sie lernen vor allem, selbstständig Fisch zu fressen und den Konkurrenzkampf mit Artgenossen zu bestehen, bevor sie an einsamen Strandabschnitten wieder ausgewildert werden DE 2020'
- eventId: 1323617
  start: 2026-10-01T21:15:00Z
  stop: 2026-10-01T22:07:00Z
  title: Planet Weltweit - Baikalsee, ein Wintermärchen
  subtitle: Planet Weltweit - Baikalsee, ein Wintermärchen
  description: |-
    Ein See so groß wie Belgien und mit 1600 Metern tief wie ein Ozean: Das ist der Baikalsee in Sibirien. Bei minus 25 Grad bricht ein kleines Team um den Biologen Igor Chanajew zu einer Forschungsreise über das Eis auf. Sie sind auf der Suche nach dem Omul, dem berühmten Fisch, den es nur im Baikalsee gibt, und von dem die ganze Region um den See lebt. Kaum taucht Igor durch ein kleines Loch im Eis in die fantastische Unterwasserwelt des Sees ab, wird aus dem Forschungsauftrag ein gewagtes Abenteuer.

    Es ist März am Baikalsee, einer bizarren Landschaft aus Eis und Schnee. Ein kleiner Konvoi, bestehend aus einem Quad, einem Kleinbus und einem LKW, fährt vorsichtig übers Eis. Erst vor zwei Tagen ist hier ein LKW mit kompletter Ladung im Eis versunken - obwohl es um diese Jahreszeit einen Meter dick ist. Der Expeditionsleiter Igor Chanajew ist Biologe am Limnologischen Institut der Russischen Akademie und will den Baikal-Omul, einen endemischen Fisch, auf seine Gesundheit untersuchen. Dazu verbindet der Russe Igor seine Studien mit einem leidenschaftlichen Abenteuer: dem Eistauchen. Er ist einer von wenigen Russen, die sich aufgrund ihrer Erfahrung unter die Eisplatten wagen - ohne Orientierung ist jeder Weg zurück versperrt. Regelmäßig besucht Igor diese Unterwasserwelt, um Veränderungen im See feststellen zu können. Auf den Felsen unter Wasser wachsen korallenförmige Schwämme - hocheffektive Wasserfilter, die über eventuelle Verschmutzungen Aufschluss geben. Auch sie findet man an keinem anderen Ort der Erde. Die geschätzten 1,5 Millionen Omule im Baikalssee sind nach den aktuellen Studien nicht bedroht - sie leben in großen Tiefen, und die Selbstreinigungskraft des Sees ist ihr Garant fürs Überleben. Die Fischer rund um den See angeln zum Eigenbedarf, lediglich auf den Märkten der Region ist der Fisch zu erstehen, ein Geheimtipp für Besucher aus ganz Russland. DE 2010
  ageRating: 12
- eventId: 1323618
