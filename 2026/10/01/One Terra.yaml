  title: Planet Weltweit - Das Geheimnis der Schweizer Uhren
  subtitle: Planet Weltweit - Das Geheimnis der Schweizer Uhren
  description: Die Wiege der Uhrmacherei steht in den Bergen der Französischen Schweiz. La-Chaux-de-Fonds und Le Locle - mit den Namen beider Städtchen verbinden Kenner höchste Präzision. Denn hier entstand im 18. Jahrhundert der Weltruhm der Schweizer Uhren - auf höchst ungewöhnliche Weise. Im Winter, wenn auf den Höfen wenig Arbeit anfiel, begannen einige der Bauern komplizierte Uhren herzustellen. Ein Handwerk, das über die Jahrhunderte in dieser Region perfektioniert wurde. Handverlesen sind heute die Studenten, denen hier der Sprung vom einfachen Uhrmacher zum Uhren-Restaurator gelingt. Jener Qualifikation, um die sich die Luxusuhren-Labels wie zum Beispiel Cartier, Zenith oder Ulysse Nardin reißen.  In dem lichtdurchfluteten Atelier ist es still. Leise tickt und surrt es an den Arbeitspulten. Eine junge Frau springt auf, schaut verzweifelt auf den Boden. Emilie Choulat, Restaurationsstudentin im zweiten Studienjahr, hat eine unersetzbare Schraube verloren. Für ihre Diplomprüfung muss sie eine historische Uhr restaurieren und versuchen, die ursprünglichen Funktionen wiederherzustellen. Ersatzteile gibt es keine - jede Uhr ist ein Unikat, handgefertigt bis ins millimeterkleinste Rädchen. Doch zur Restauration einer Pendel- oder Taschenuhr gehört mehr - ihnen wohnt eine Philosophie, eine Einzigartigkeit in der Herstellung inne, die ein Restaurator ergründen muss. Komplikationen heißen jene Uhren, die neben Minuten und Stundenanzeigen weitere Funktionen haben. Sie können beispielsweise in Sekundenbruchteilen stoppen, das Datum oder astronomische Angaben anzeigen oder die Zeit durch akustische Signale wiedergeben. Auch Diego Azconegui gehört zu den sechs bis acht Nachwuchs-Restauratoren, die pro Jahr an der CIFOM, der Technischen Hochschule von Le Locle, aufgenommen werden. Wie Emilie kämpft er nicht nur mit der Uhr, sondern auch gegen die Zeit, um rechtzeitig vor Ablauf der Prüfung fertig zu sein. DE 2008
