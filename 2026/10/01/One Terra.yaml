  title: Planet Weltweit - Rum auf Guadeloupe
  subtitle: Planet Weltweit - Rum auf Guadeloupe
  description: "Die alten Herrschaften auf der französischen Karibikinsel Guadeloupe scherzen, dass sie heute nicht mehr wissen, was zuerst da war: Die Insel oder der Rum. Kein Wunder: Rum bildet bis heute die Grundlage für das gesamte Inselleben und ist tief in der Lebensphilosophie seiner Einwohner verwurzelt. Weltweit gilt Kennern der Rum aus Guadeloupe als der beste seiner Art, hat er doch nichts mit dem klassischen Rum zu tun, der ein reines Restprodukt der Zuckerproduktion war. Guadeloupes \"Rhum Agricole\" ist destilliert aus reinem, frisch gepresstem Saft aus Zuckerrohr, wie es einst von den Sklaven auf den Feldern geerntet wurde. \n\nDie Destillerie der Familie Longueteau ist die älteste auf Guadeloupe, die noch in Betrieb ist. Hier hat sich nichts geändert, die Fabrik funktioniert wie vor 100 Jahren: keine Elektrizität, kein Benzin, kein Öl. Der Kolben, der die Presse antreibt, funktioniert mit Dampf, der aus den Resten des zerquetschten Zuckerrohrs hergestellt wird. Leider versagt das alte Getriebe immer häufiger seinen Dienst. So auch ausgerechnet jetzt im März, wo die Zuckerrohrernte in vollen Gange ist und das Räderwerk auf Hochtouren laufen müsste! Firmenchef François Longueteau arbeitet deshalb seit Tagen mit seinem Techniker, um das Problem zu beheben. Für das Unternehmen steht viel auf dem Spiel: Jeder Tag bedeutet Verlust, und die Rumvorräte in den Fässern sind bald aufgebraucht. Zudem gibt es kaum alternative Verdienstmöglichkeiten auf Guadeloupe, die Insel lebt heute fast vollständig von der Verarbeitung des Zuckerrohrs. Es ist ihr wahrer Reichtum, mehr noch als Bananen oder zu früheren Zeiten Kaffee oder Kakao. Das Rohr wurde von Kolumbus eingeführt, der die Insel 1493 entdeckte und sie den Einheimischen nach und nach abspenstig machte. Seitdem hat sich das Zuckerrohr mit den französischen Kolonialherren und deren Wissen über die Brennereikunst zum wichtigsten Wirtschaftsgut weiterentwickelt. DE 2011"
