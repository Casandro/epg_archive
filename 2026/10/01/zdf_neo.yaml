  widescreen: true
  hd: true
  description: |-
    USA 2019
    Die Serienkillerin Rosalind Dyer soll ein geringeres Strafmaß bekommen, wenn sie verrät, wo sie ihre Opfer begraben hat. Ein Deal mit ungeahnten, sehr weitreichenden Folgen.

    Die erste Leiche ist schnell gefunden, doch liegt sie nicht allein in dem Grab, und die zweite Leiche wurde zu einem Zeitpunkt begraben, an dem Rosalind bereits im Gefängnis saß. Es wird ein erschreckendes Muster deutlich, und ein Wettlauf gegen die Zeit beginnt.
    Darsteller:
