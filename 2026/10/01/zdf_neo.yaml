  title: Sketch History
  subtitle: Neues von gestern
  genre:
  - '48'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland / Ungarn 2015
    Endlich wird der "Geschi-Unterricht" lustig. Die Sketchcomedy zeigt die großen und kleinen Ereignisse der Weltgeschichte aus neuem Blickwinkel. Satirisch, humorvoll und herrlich absurd.

    Die Reise geht von den Urzeitmenschen über die Renaissance, die wilden 70er bis hin zum Mauerfall. Die letzten Minuten im Bunker 1945 werden genauso beleuchtet wie die Hintergründe des Kennedy-Attentats oder die Umstände, die zur Meuterei auf der Bounty führten.
