    Reżyseria: Piotr Poraj-Poleski
    Egzotyczna Tunezja to tak lubiane przez turystów piękne plaże, ciepłe i turkusowe morze, ale również piaski Sahary i zielone, życiodajne oazy. Jednym z takich niesamowitych, zielonych ogrodów zachwycających bujnością i różnorodnością roślin jest oaza Touzer. Rośnie tam kilkanaście tysięcy palm daktylowych, ale oprócz daktyli można skosztować również granatów, bananów, oliwek czy fig. Dojrzewające w gorącym, tunezyjskim słońcu owoce są niezwykle soczyste i słodkie.
  ageRating: 12
  subtitle: W programie widzowie zobaczą tętniący gwarem, niezwykle barwny targ w starej części miasta Touzer. Będą mieli okazję zobaczyć, jak gotuje się tradycyjne tunezyjskie danie z kuskusem.
  genre:
  - '35'
