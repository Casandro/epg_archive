    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Konrad coraz więcej czasu spędza z Małgosią nad rozlewiskiem. Zastanawia się nawet nad tym, czy nie przeprowadzić się do niej na stałe. Marysia robi karierę w agencji reklamowej. Przygotowuje projekt razem z Agatą (Orina Krajewska), od powodzenia którego zależy jej przyjęcie do pracy. Coraz częściej natomiast zaczyna wspominać Krzysztofa i ich wspólny wakacyjny romans. Sprawy z Kubą zaczynają się komplikować. Kuba rzadko telefonuje i bywa w Warszawie.
  ageRating: 12
  genre:
  - '23'
  subtitle: Marysia nie może zapomnieć o Krzysztofie. Konrad buduje w Ostródzie most, który łączy miejscowość. Otrzymuje honorowe obywatelstwo i klucze do bram miasta. Wypadek Małgosi przerywa radość świętowania.
