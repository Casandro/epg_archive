    Małgosia oraz Mirka leżą w szpitalu. Ich życiu nie zagraża na szczęście nic złego. W czasie pobytu w szpitalu Małgosia i Mirka szczerze rozmawiają i wybaczają sobie dawne urazy. Wszyscy przyjaciele odwiedzają Małgosię w szpitalu. Po zrobieniu prześwietlenia okazuje się, że Małgosia może wyjść do domu. Mirka jest w gorszym stanie, ma problemy z kręgosłupem. Odwiedza ją Maciej organista i zaczyna z nią rozmawiać. Teraz przychodzi już każdego dnia.
  ageRating: 12
