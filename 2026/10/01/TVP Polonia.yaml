    Woliński Park Narodowy został utworzony w 1960 roku. Obejmuje środkową część wyspy Wolin, jeziora i 15-kilometrowy pas klifowego wybrzeża Bałtyku. Na terenach, na których dziś malowniczo położone miejscowości wkomponowane są w soczystą zieleń lokalnych lasów, przez setki lat toczyły się walki. Osadnictwo wczesnośredniowieczne trwało od schyłku VIII wieku. Schronienia tutaj szukali wikińscy banici.
