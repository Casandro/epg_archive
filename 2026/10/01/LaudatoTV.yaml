  title: Sveta Terezija iz Lisieuxa, The secret of Therese
  subtitle: Dokumentarni
  description: 'Obećanje sv. Male Terezije bilo je: Zaraditi Raj radeći dobro na Zemlji. Njena misija: Širiti Evanđelje diljem svijeta. Usprkos kratkom ovozemaljskom životu postigla je oboje. Njezin jednostavni način života prožet snažnom porukom, revolucionalizirao je 20. stoljeće. Njezin život i pismena ostavština i dalje nastavljaju oduševljavati milijune ljudi. Njezina tajna je tako snažna da udahnjuje život njezinoj misiji: ''Voljeti Isusa i učiniti da On bude voljen od drugih.'''
