  title: Superknjiga
  subtitle: Animirani
  description: Opušteno je popodne, Luka i Ela se dosađuju. Dok razgovaraju o tome koja je bila njihova najveća avantura sa Superknjigom, Superknjiga ih odvodi u vrijeme kad je živio Mojsije. On smatra da on nije najbolji vođa da izvede Izraelce iz Egipatskog ropstva. Nakon što je preživio pošasti, izlazak iz Egipta i na kraju razdvajanje Crvenog mora, čini se da je Mojsije ipak bio najboji vođa za plan koji je Bog imao za svoj narod. Kada Superknjiga vrati djecu kući, oni razmišljaju ako je upravo to možda bila najveća avantura sa Superknjigom koju su doživjeli.
