  title: Moj put do Neba - Caro Acutis i Euharistija
  subtitle: Dokumentarni
  description: |-
    My highway to heaven: Carlo Acutis and the Eucharist
    Može li jedan mladić pokazati put prema nebu? Carlo Acutis bio je tinejdžer koji je volio računala, nogomet i druženje s prijateljima. No, iznad svega volio je Isusa, a posebno Euharistiju, stvarnu Isusovu prisutnost. Njegova duboka vjera i ljubav prema Blaženoj Djevici Mariji ostavili su snažan trag u životima mnogih. Dokumentarni film ,,Moj put do neba - Carlo Acutis i Euharistija donosi priču o mladiću koji je pokazao da svetost nije nedostižna i da put prema nebu možemo početi živjeti već danas.
