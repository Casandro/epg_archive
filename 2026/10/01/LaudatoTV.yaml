  title: Život na stijeni
  subtitle: Religijski
  description: Gošća u ovoj emisiji Života na stijeni je Noelle Mering. Napisala je knjigu ,,Awake, Not Woke. Govori o 'woke' kulturi o kojoj danas toliko slušamo i u kojoj živimo, a ona će nam pomoći bolje razumjeti o čemu je riječ te će govoriti o kršćanstvu kao protulijeku. Ovo je prva od dviju emisija s njom.
- eventId: 1267794
