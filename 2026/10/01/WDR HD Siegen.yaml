- eventId: 557921
  start: 2026-10-01T20:15:00Z
  stop: 2026-10-01T21:00:00Z
  title: Gefangen im Schweigen - Leben mit selektivem Mutismus
  subtitle: aus der Reihe "Menschen hautnah"
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Nia ist 15 und steht jeden Morgen vor derselben Frage: Was, wenn mich heute jemand etwas fragt? In der Schule oder bei fremden Menschen bringt sie kein Wort heraus, obwohl sie zu Hause sprechen kann. Selektiver Mutismus heißt die Angststörung. "Es ist so wie zwei Messer in meinem Hals. Und sobald jemand, mit dem ich nicht so sicher bin, auf mich zukommt oder in der Nähe ist, geht dieses Messer zu", sagt Nia in einer Sprachnachricht.

    Genauso geht es auch Mary. In der Öffentlichkeit spricht sie fast nie. Wenn sie im Restaurant etwas bestellen möchte, muss ihre Schwester für sie sprechen. Zur Schule geht sie schon lange nicht mehr.
