  title: Better than Human? - Leben mit KI
  subtitle: Ein Film von Franka Schönwandt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Seit Ende 2022 ist Chat GPT frei zugänglich und hat den Menschen gezeigt, wie stark Künstliche Intelligenz die Welt verändern könnte. Sich die Bachelorarbeit schreiben lassen? Die Reise ans Mittelmeer planen? Eine Website programmieren? Das geht natürlich alles, aber kann KI auch unsere emotionalen Bezugspersonen ersetzen? \nMit dieser Frage beschäftigt sich die \"ARD-Wissen\"-Dokumentation \"Better than Human?\" von MDR und WDR."
