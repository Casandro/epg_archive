  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Im Jahr 2025 feiern die Steyler Missionare - die Gesellschaft des göttlichen Wortes, so der offizielle Name - ihr 150-jähriges Bestehen. Aus den bescheidenen Anfängen in Steyl an der Maas entstand einer der größten Orden der katholischen Kirche und ein weltweites Missionswerk. Von Beginn an waren die Missionare, die in die Ferne aufbrachen, mit der Frage konfrontiert, wie die Begegnung von unterschiedlichen Kulturen glücken kann. Über die Jahrzehnte entstanden Konzepte für interkulturelle Gemeinschaften und Erfahrungen, die heute für unsere Gesellschaften von Bedeutung sein können. (Teil 2 von 2)'
