  subtitle: Fühlt sich alles leer an? Werde zum Segen für andere
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wie oft gehen Sie im Alltag die zweite Meile? Das heißt: Wie oft tun Sie ein bisschen mehr, als nötig ist und von Ihnen erwartet wird? Genau dazu fordert Jesus uns heraus, weil es ihn ehrt und für andere zum Segen wird. In dieser Sendung zeigt Joyce Meyer Ihnen Wege auf, wie das ganz praktisch aussehen kann, und erklärt, wie es uns ad hoc aus unserer eigenen Leere und Unzufriedenheit herausholen kann.'
