  title: Luther heute
  subtitle: Heiner Geißler - Was müsste Luther heute sagen?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Film begleitet den ehemaligen Bundesminister, wie er auf einer Lesereise von Tübingen bis Wittenberg sein Buch "Was müsste Luther heute sagen?" vorstellt. Leidenschaftlich wirbt Geißler für einige zentrale Ideen Luthers, die nach seiner Ansicht gerade heute für eine Stärkung der Ökumene aktueller denn je sind. Pointiert fasst er seine Luther-Eindrücke zusammen: "Jeder intelligente Katholik ist im Innern auch immer ein Protestant." Heiner Geißler verstarb am 12.09.2017 im Alter von 87 Jahren.'
