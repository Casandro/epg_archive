  title: Bibel TV DIE SENDUNG
  subtitle: im Mai 2026
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Matthias Brender schaut auf die neuen Kirchenzahlen: über eine Million Menschen weniger in den großen Kirchen. Er ordnet ein, was wirklich kippt - und was nicht, und fragt: Was bleibt vom Christentum in Deutschland? Eine ehrliche Bestandsaufnahme - ohne Schönreden, ohne Panik.'
