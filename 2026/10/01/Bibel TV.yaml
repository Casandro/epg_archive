  title: Der grüne Fluss der Alpen - Der Inn
  subtitle: Vom Lunghinsee bis Altfinstermünz(1/4)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Inn ist einer der längsten und mächtigsten Alpenflüsse. Ausgehend von seiner ruhigen Quelle in den Albula-Alpen im Engadin führt die Dokumentation durch eine malerische Landschaft bis nach Altfinstermünz. Unterschiedliche Schauplätze zeigen, was der Inn zu bieten hat: Eine Welt voller Naturschönheiten, historischer Schätze und unvergesslicher Landschaften.'
