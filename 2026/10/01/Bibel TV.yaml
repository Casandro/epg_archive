  title: Fokus Jerusalem
  subtitle: Sendung vom 01.10.26
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Israel, das Land der Bibel, ist auch ein Land der Konflikte. Hierbei immer im Fokus ist die Stadt Jerusalem - und das im doppelten Wortsinn: Denn "im Fokus" zu sein bedeutet nicht nur, im Zentrum des Interesses zu stehen, sondern auch, Brennpunkt zu sein. Ob zwischen Palästinensern und Israelis oder zwischen Christen, Juden und Muslimen: Immer wieder kommt es in Jerusalem zu Auseinandersetzungen. Nirgendwo sonst sind Religion und Politik so eng miteinander verwoben wie hier. ''Fokus Jerusalem'' informiert mit aktuellen Beiträgen über Hintergründe, Entwicklungen und Chancen der Region.'
