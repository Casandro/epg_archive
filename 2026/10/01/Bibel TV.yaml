  title: Ein Hauch von Himmel
  subtitle: Das Weihnachtsgeschenk
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nur widerwillig kehrt Brianna Springbelt zurück nach East St. Louis, um ihre Schwiegermutter LaBelle an Thanksgiving zu besuchen. Brianna hat hart gekämpft, um aus dem Armenviertel wegzukommen und arbeitet ehrgeizig daran, sich mit ihrem Mann Robert ein gutes Leben in materieller Sicherheit aufzubauen. Dass diese Sicherheit trügerisch ist, muss die junge Frau auf furchtbare Weise lernen, als ihr Mann Opfer eines Überfalls wird und stirbt. Allein und mit einem Berg Schulden bleibt Brianna nichts anderes übrig, als bei LaBelle einzuziehen. Beide Frauen trauern um Robert und geben sich gegenseitig die Schuld an seinem Tod. Hilfreich zur Seite stehen ihnen die Engel Tess, Monica und Andrew und der arme, aber immer gut gelaunte alte Gabe. Können sie Brianna lehren, dass das Beste im Leben nicht aus Dingen besteht und ihr helfen, ihre Beziehung mit LaBelle zu kitten? Die Gaststars Ruby Dee (LaBelle) und Ossie Davis (Gabe) waren im echten Leben verheiratet. Die amerikanische Schauspielerin, Dichterin, Drehbuchautorin, Journalistin und Bürgerrechtsaktivistin starb 2014 im Alter von 91 Jahren.'
