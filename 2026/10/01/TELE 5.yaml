  title: Cloudy Mountain
  description: |-
    In den Bergen Chinas entsteht eine neue Zugstrecke. Auch der junge Tiefbautechniker Hong Yizhou (Yilong Zhu), dessen Vater (Zhizhong Huang) und die Geologin Lu Xiaojin (Junyan Jiao) sind im Bereich der Baustelle unterwegs, die zudem einen imposanten Tunnel umfasst. Allerdings befindet sich das Großprojekt an einer heiklen Stelle: Die Strecke verläuft in diesem Abschnitt durch eine tektonisch aktive Zone. Auch Felsstürze oder Schlammlawinen können jederzeit ins Tal donnern. Als ein Erdbeben die Region erschüttert, sind Menschenleben und die Bahninfrastruktur gleichermaßen in Gefahr. - Der chinesische Katastrophenfilm wurde u.a. mit dem Golden Angel Award ausgezeichnet.
