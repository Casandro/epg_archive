  title: Garten & Lecker (4)
  subtitle: Blumenkohlmousse unter Magnolien
  description: Die vierte Gartenreise führt in den mediterranen Garten von Petra Wichert und ihrer Familie im baden-württembergischen Sipplingen mit Blick auf den Bodensee. Natur-Pool, Zypressen, immergrüne Magnolien und exotische Gehölze prägen den Wohlfühlgarten. Das Hanggrundstück hat die Familie in einen Terrassengarten mit vier Ebenen umgestaltet, der "erweitertes Wohnzimmer" sein und Wildtieren ein Zuhause bieten soll.
  genre:
  - '144'
- eventId: 1387984
  start: 2026-10-01T09:10:00Z
  stop: 2026-10-01T09:55:00Z
  title: Expedition in die Heimat
  subtitle: Die schönsten Wanderungen zwischen Rhein und Lahn
  description: "Der Rhein-Lahn-Kreis zwischen Koblenz, Limburg und Bacharach ist für Reisende und Wandernde eine der schönsten Gegenden Deutschlands. Drei Unesco-Welterbestätten und zwei wundervolle, sehr unterschiedliche Flüsse finden sich in diesem außergewöhnlichen Stück Rheinland-Pfalz. SWR Moderator Arndt Reisenbichler begibt sich auf fünf der schönsten Wanderungen in dieser vielfältigen Wanderregion. \nEr besucht den Langhalsweg, den schönsten Wanderweg Deutschlands 2024, bei Osterspai. Er ersteigt die berühmte Ruppertsklamm und findet auf der Schmidtenhöhe Rinder in freier Natur."
- eventId: 1389111
  start: 2026-10-01T09:55:00Z
  stop: 2026-10-01T10:45:00Z
  title: Elefant, Tiger & Co. (422)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: Bei den Zebras hatten lange Zeit die Frauen das Sagen. Kein Wunder, es fehlte ganz einfach ein Hengst. Doch die Zeiten ohne richtigen Kerl sind vorbei. Seit Kurzem wohnt ein hoch aufgeschossener englischer Zebramann hinter den Kulissen - bislang allein. Jetzt wollen Stefan Lohmer und Daniel Volkmann ihn erstmals mit den Leipziger Stuten zusammenbringen. Die kamen bisher gut ohne ihn klar. Und seine Erfahrungen mit dem anderen Geschlecht sind gleich null, lebte er doch in England ausschließlich unter Hengsten. Beste Voraussetzungen also für ein spannendes erstes Rendezvous.
