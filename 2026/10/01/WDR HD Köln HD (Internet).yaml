  title: In aller Freundschaft (1021)
  subtitle: Gefangenes Herz
  description: |-
    Minna Ehrenfeld begleitet ihren Mann Ephraim in die Sachsenklinik, wo er eine Knieprothese erhalten soll. Als Minna plötzlich einen Zusammenbruch erleidet, bekommt sie Angst, dass sie nicht überlebt und beichtet Dr. Philipp Brentano ihr dunkles Geheimnis.
    Darren Macneil bekommt beim Fahrradfahren einen MS-Schub und stürzt schwer. Er schafft es gerade noch, sein Handy zu ertasten.
- eventId: 1385378
