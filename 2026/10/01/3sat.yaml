  title: Wildes Indien (2/3)
  subtitle: Wüsten
  description: |-
    Indiens Wüsten sind ein harter und erbarmungsloser Lebensraum. Raub- und Beutetiere kämpfen in den kargen Salzebenen und verbrannten Graslandschaften um Nahrung, Wasser und Territorium.

    Unter den extremen Bedingungen haben die Tiere Fähigkeiten entwickelt, um Hitze und Wassermangel zu überstehen. Der Indische Leopard ist hervorragend angepasst an die trockenen Bedingungen, seine Tarnung funktioniert im trockenen Gras genauso wie im Dschungel.
