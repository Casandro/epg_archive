  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Narges Mohammadi - Die Autobiografie der iranischen Friedensnobelpreisträgerin ist unter dem Titel "Eine Frau hört niemals auf zu kämpfen" erschienen.

    Roman "Alma und Anton" - Dana Vowinckel erzählt in ihrem zweiten Roman eine bittersüße Liebesgeschichte vor hochpolitischem Hintergrund. "Kulturzeit" spricht mit der Autorin.

    Jörg Immendorff Retrospektive - Mit der ersten umfassenden Retrospektive in Jörg Immendorffs Wahlheimatstadt Düsseldorf, wo er jahrzehntelang studierte, lehrte und arbeitete, rückt ihn der Kunstpalast zurück ins Blickfeld. Rund 120 Werke aus fünf Jahrzehnten zeichnen seinen Weg nach.

    Porträt Radka Denemarková - Tschechien ist 2026 Gastland der Frankfurter Buchmesse. Eine der Eröffnungsrednerinnen ist die wohl bekannteste tschechische Autorin der Gegenwart: Radka Denemarková. Ihre Bücher werden in 23 Sprachen übersetzt und sie ist vielfach ausgezeichnet.

    Buch "Der Reisende" - Georg Forster war Pazifik-Erkunder, Philosoph, Revolutionär und Begründer der deutschen Reiseliteratur. Andrea Wulf hat eine neue spannende Biografie geschrieben.

    Moderation: Cécile Schortmann
    HD-Produktion
