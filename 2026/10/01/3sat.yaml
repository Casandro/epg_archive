  subtitle: Die Perle des Pazifiks
  description: |-
    Moorea, die Nachbarinsel Tahitis, liegt wie ein grünes Juwel im Südpazifik: ein längst erloschener Vulkan mit von tropischem Regenwald bewachsenen Gipfeln, umringt von einem Korallenriff.

    Trotz der extremen Abgeschiedenheit von den nächsten Festlandküsten haben hier Pflanzen, Tiere und Menschen über Millionen von Jahren eine fragile, aber vielfältige Lebensgemeinschaft geschaffen. Schon unter Wasser beginnt das Wunder.
