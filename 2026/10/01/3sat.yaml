  title: 'Wildes Indien: Wälder'
  subtitle: Film von Paul Dennys
  description: |-
    Der indische Monsunwald ist ein Ort der Zuflucht und der Extreme. Von der langen Trockenzeit bis zu den erlösenden Monsunfluten sind alle Tiere den Gesetzen der Natur unterworfen.

    Dort herrscht Asiens größtes Raubtier: der Königstiger. Hungrig durchstreift er sein Revier auf der Suche nach Beute. Oft legt er 20 Kilometer am Tag zurück. Indische Elefanten ziehen auf den von ihren Vorfahren überlieferten Wanderrouten durch den Wald.
