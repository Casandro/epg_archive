  title: Australiens Wildnis (1/3)
  subtitle: Der Norden - Küste der Extreme
  description: |-
    Großbritannien 2023
    Biologin Lizzie Daly umrundet den australischen Kontinent und zeigt die einzigartige Tierwelt entlang der Küste. Ihre Reise beginnt im tropischen Norden und führt zum Great Barrier Reef.

    Dort kämpfen Meeresschildkröten ums Überleben, Salzwasserkrokodile werden zur Gefahr für Menschen, und der Epaulettenhai trotzt den extremen Bedingungen der Gezeitenzone. Höhepunkt der Reise ist der Tauchgang am artenreichen Great Barrier Reef.
    HD-Produktion
