  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Der Kolonialismus von heute wütet auch im Internet, in der Tiefsee und im Weltall. Wie dabei dieselben Mechanismen wie früher greifen, darüber diskutiert Stephanie Rohde mit ihren Gästen.

    Der moderne Kolonialismus unterscheidet sich kaum vom Kolonialismus der frühen Neuzeit. Auch wenn die Kolonialherren andere Namen tragen, bleiben die Mechanismen gleich: Es wird geraubt, ausgebeutet und Abhängigkeit geschaffen.
