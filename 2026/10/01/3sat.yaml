  title: Galapagos (1/2)
  subtitle: Neubeginn
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Im Pazifik liegt eine Welt wie keine andere. Ein Land voller seltsamer Kreaturen, die kaum irgendwo sonst auf der Erde zu finden sind, mit unberührter Wildnis und einer aufregenden Historie.

    Seit Charles Darwin 1835 einen Fuß auf die Galapagosinseln setzte, sind sie ein Ort des Staunens und der Faszination für Menschen auf der ganzen Welt. Eine Reise zu dem Archipel führte zu Darwins bahnbrechenden Werk über den Ursprung der Arten.
    HD-Produktion
