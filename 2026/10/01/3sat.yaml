  subtitle: Verstecktes Paradies
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Das Leben auf den Galapagosinseln bringt viele Herausforderungen mit sich. Durch den Ozean und die vulkanischen Böden wurden die Lebewesen hier tiefgreifend geprägt.

    Der zweite Teil der Dokumentation zeigt die Kämpfe und Erfolge der Tiere, die auf diesen einzigartigen Inseln geboren, aufgezogen und geschützt werden.
    HD-Produktion
