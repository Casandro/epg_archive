  title: Australiens Wildnis (2/3)
  subtitle: Der Süden - Ozean der Gegensätze
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Lizzie Daly erkundet die Unterwasserwelt Australiens. Im Süden treffen tropische und antarktische Meeresströmungen aufeinander und schaffen einen artenreichen Lebensraum.

    Die Biologin taucht mit Sandtigerhaien, folgt den Spuren einer einzigartigen Walfangtradition und erkundet die geheimnisvollen Kelpwälder. Außerdem besucht sie ein Schutzgebiet für Zwergpinguine sowie eine der größten Kolonie Australischer Seelöwen.
    HD-Produktion
- eventId:
