  title: Scrubs - Die Anfänger
  subtitle: Mein Freund Turk Comedy-Serie, USA 2004
  description: Folge 64, Turk soll die Einladungen zur seiner und Carlas Hochzeit verschicken, als er in eine heftige Torschlusspanik gerät. Die Angst vor der Trauung ist so groß, dass ihm während einer Operation ein Fehler unterläuft. Nur Carla kann ihm jetzt noch helfen, dafür gerade zu stehen. Indes sucht Elliot einen Clown für die Kinderstation - J.D. übernimmt den Job. Kurz darauf schläft sie mit ihm, weil sie glaubt, er sei der Richtige. Doch dann kommt Sean plötzlich wieder zurück.
- eventId: 1308396
  start: 2026-10-01T21:35:00Z
  stop: 2026-10-01T22:00:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine kniffligste Entscheidung Comedy-Serie, USA 2004
  description: Folge 65, Obwohl Elliot mit Sean zusammen ist, kommt J.D. nicht von ihr los. Nachdem er wieder einmal mit ihr geschlafen hat und ihr versprechen musste, Sean nichts zu verraten, tröstet er sich mit seiner Exfreundin Danni - obwohl die ihm immer stärker auf die Nerven geht. Sean jedoch merkt, dass etwas nicht stimmt und fragt J.D. direkt, ob etwas zwischen ihm und Elliot läuft... Währenddessen wird der Hausmeister zum Sicherheitsdienst befördert und geht mit Übereifer an die neue Arbeit.
- eventId: 1308397
  start: 2026-10-01T22:00:00Z
  stop: 2026-10-01T22:30:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine wahren Gefühle Comedy-Serie, USA 2004
  description: 'Folge 66, Dr. Cox kämpft gegen Kelsos Pläne, im "Sacred Heart" Ganzkörpertomographien anzubieten, und gegen einen Hypochonder, der sich dieser Untersuchung unbedingt unterziehen will. J.D. versucht sich inzwischen zu beweisen, dass Dannis Einschätzung, er wolle nur das Unerreichbare und sei sich über seine wahren Gefühle gar nicht im Klaren, falsch ist. Als Elliot und Sean zusammenziehen wollen, scheint J. D. endlich zu erkennen, was er will: Er gesteht Elliot seine Liebe.'
- eventId: 1308398
  start: 2026-10-01T22:30:00Z
  stop: 2026-10-01T22:55:00Z
  title: Scrubs - Die Anfänger
  subtitle: Mein Rückzieher Comedy-Serie, USA 2004
  description: 'Folge 67, Eigentlich sollte J.D. glücklich sein, hat er es doch endlich geschafft, Elliot zurückzuerobern. Aber leider hat er festgestellt, dass es in ihrer Beziehung ein erstes Problem gibt: Er liebt sie nicht. Das jedoch traut er sich ihr nicht zu sagen, vor allem, da Elliot einfach überglücklich mit ihm ist. Die Vorbereitungen zu Turks Hochzeit sind für ihn gerade deshalb eine Qual, weil er so täglich mit zwei Menschen zu tun hat, die scheinbar perfekt zueinander passen.'
