  title: Modern Family
  subtitle: Lust und Launen Comedy-Serie, USA 2015
  description: Folge 138, Im Mittelpunkt stehen drei miteinander verwandte Familien um den Patriarchen Jay Pritchett. Dieser lebt in zweiter Ehe mit der wesentlich jüngeren Kolumbianerin Gloria und ihrem Sohn Manny zusammen. Jays Kinder aus erster Ehe, Claire und sein homosexueller Sohn Mitchell, sind ebenfalls verheiratet und haben Kinder. Egal wie stressig, chaotisch und unberechenbar das Leben ist - die Mitglieder der Großfamilie können sich aufeinander verlassen.
