  title: Fluch der Karibik
  subtitle: Piratenfilm, USA 2003
  description: 'Regie: Gore Verbinski. Darsteller: Johnny Depp, Geoffrey Rush, Orlando Bloom. Das paradiesische Leben des charmanten Piraten Captain Jack Sparrow erhält einen jähen Dämpfer, als der finstere Captain Barbossa sein stolzes Schiff, die "Black Pearl", in seine Gewalt bringt und mit ihr die Hafenstadt Port Royal überfällt, wo er die bildhübsche Gouverneurstochter Elizabeth Swann entführt. Das kann der abenteuerlustige Waffenschmied Will Turner, Elizabeths Vertrauter seit Kindertagen, nicht auf sich beruhen lassen. Gemeinsam mit dem Haudegen Sparrow macht er sich auf die Jagd nach der mörderischen Piratenbande um Barbossa - und seiner verlorenen Liebe.'
