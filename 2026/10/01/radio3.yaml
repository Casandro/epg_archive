  title: radio3 Jazz
  subtitle: 'Moderation: Eva Garthe'
  description: |-
    XJazz! Reloaded - Die Herbst-Ausgabe des Festivals

    Erst abgesagt, dann in kleiner Form, nun aber mit großem Aufschlag wieder da: Das Xjazz!-Festival findet wieder statt - diesmal im Herbst. Unter anderem mit Nduduzo Makhathini aus Südafrika, der britischen Trompeterin und Produzentin Emma-Jean Thackray und aus Berlin dem Schlagzeuger Ludwig Wandinger. Was es zu bieten hat und wie sich das Festival nun neu aufstellt, erfahren wir in dieser Sendung.

    Moderation: Eva Garthe
