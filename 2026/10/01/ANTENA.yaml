  title: Winnice miłości 1 (odc. 150)
  subtitle: 'Wściekły na Anastasię Sifis żąda, by wróciła z nim na Kretę. Achilleas przybywa do Chanii. Znajduje sposób, by zbliżyć się do Meliny. Nie ma wątpliwości, że nadal są w sobie zakochani. '
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Wściekły na Anastasię Sifis żąda, by wróciła z nim na Kretę, a nawet wdaje się w kłótnię z Mattheosem. Achilleas przybywa do Chanii i znajduje sposób, by zbliżyć się do Meliny. Nie ma wątpliwości, że nadal są w sobie zakochani. Vasiliki chce zobaczyć, czy Minas jest jej wierny i prosi Evę, aby z nim flirtowała, aby go sprawdzić. Achilleas prosi Daphni o skontaktowanie się z Helgą, aby Nektarios i Patroklos mogli poznać swoją biologiczną matkę.
  ageRating: 12
