  subtitle: Natuurlijk Noord-Holland - Wat een verbeelding! S06 E124. De etalage voor het beste van de regionale omroepen met de mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen.
  description: 'In Natuurlijk Noord-Holland deze keer: de sloot. Je ziet het verschil tussen een gezonde sloot en een "dode" sloot in één oogopslag: een dode sloot is eigenlijk een lange bak met alleen maar water. In een gezonde sloot wemelt het van de planten en dieren. Sommige zie je in één oogopslag: zwanen, rietsigaren en waterlelies. In de openbare ruimte staan honderden beelden. Wie heeft het gemaakt en waarom? Wat vindt de buurt ervan? Er is veel te ontdekken. Deze keer staat de stad Zoetermeer centraal. (2026)'
