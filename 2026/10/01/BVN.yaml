  description: Historicus Maarten van Rossem vertelt over opmerkelijke gebeurtenissen uit andere tijden. Deze keer duikt hij in de vondst van de grootste muntschat die ooit is opgegraven in de regio Utrecht. Het klinkt als een spannend jongensboekverhaal. Maarten spreekt de vinders en bekijkt met hen de schat. In het natuurprogramma ROEG! bewondert boswachter Bart Zwiers de vogels uit de Onlanden. In een natuurgebied draait alles om balans. Boer Jurjen van der Goot is daarin, met zijn biologische boerderij, een belangrijke schakel. Willem van Manen vertelt over de broedende reigers. (2026)
