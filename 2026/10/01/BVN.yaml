  subtitle: S26. Aan de vooravond van de presentatie van het onderzoek naar het koloniale verleden van de Oranjes brengen we de momenten samen waarop Koning WIllem-Alexander excuses aanbood.
  description: Koning Willem-Alexander is vooral de laatste jaren opvallend transparant over de zwarte bladzijden van de Nederlandse geschiedenis. Aan de vooravond van de presentatie van het onderzoek naar het koloniale verleden van de Oranjes brengt de NOS de momenten samen waarop hij excuses aanbood. Saïda Maggé praat met koninklijk huisverslaggever Simone Tukker en een gast. Zo komen onder meer zijn excuses voor het Nederlandse geweld in Indonesië (2020) en het slavernijverleden (2023) aan bod, met beelden, uitleg en persoonlijke verhalen. (2026)
