  description: Der 16-jährige, entwicklungsverzögerte Marius Lechner stürzt beim Stangenklettern zu Boden und verletzt sich dabei anscheinend seine Hand. Sein Vater Olaf, ein zupackender Sportlehrer, bringt ihn in die Sachsenklinik. Als Dr. Philipp Brentano keine Verletzung feststellen kann, gibt Marius zu, nur simuliert zu haben, um bei der bevorstehenden Schulmeisterschaft nicht mitmachen zu müssen. Während Brentano für den leicht übergewichtigen Jungen Verständnis aufbringt, ist sein Vater über diese Notlüge sehr verärgert.
