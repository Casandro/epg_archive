  title: Panda, Gorilla & Co. (228)
  subtitle: Geschichten aus dem Zoo Berlin und dem Tierpark Berlin
  episodeUri: crid://onid-1/e/6a877be8d249e1c650284fc1
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein schlechtes Jahr für die Pinguine im Tierpark: Sechs Jungtiere wurden ausgebrütet, nur zwei von ihnen haben bislang überlebt. Einer davon ist Pinguin-Dobby, der tagsüber zusammen mit Flughundbaby Oskar im Pausenraum des Brehmhauses campiert. Das Pinguin-Kind von Cindy und Jürgen will einfach nicht zunehmen. Täglich wird sein Gewicht kontrolliert. Die magische Grenze liegt bei zweitausend Gramm, dann hat Dobby gute Chancen, zu überleben.'
