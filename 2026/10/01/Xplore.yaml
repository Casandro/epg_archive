  title: Sprintour - Vanlife in Kolumbien
  subtitle: Sprintour - Vanlife in Kolumbien
  description: Nach so vielen Monaten Vanlife in Süadamerika sind wir endlich in Kolumbien angekommen. Ein Land, das viele für gefährlich halten und deshalb vielleicht nie bereisen. Wir wagen uns in das Abenteuer Kolumbien und reisen von Ecuador nach Kolumbien ein. In Medellin holen wir einen Freund am Flughafen ab und bereisen zu dritt im Camper Kolumbien. Angekommen an der Karibikküse können wir es kaum glauben an so einem schönen Ort in Kolumbien zu sein. Was für ein Traum! Hier kann man das Vanlife voll und ganz genießen! Direkt an der schönsten Küste in Kolumbien in der Nähe von Santa Marta. Wir packen unsere Sachen und fahren zu einem wunderschönen Wasserfall. Dem Quebrada Valencia. Eine halbe Stunde wandern wir bis zu den Felsen und genießen das kühle Nass am Wasserfall. Was für eine Abkühlung, denn das Meer an der Karibik bietet bei den warmen Temperaturen keine Abkühlung. Und bei 33 Grad im Wohnmobil ist das Vanlife sehr herausfordernd. Danach geht es für uns weiter in das kleine Örtchen Palomino. Es befindet sich ebenfalls an dem wunderschönen Strand und wir erkunden den schönen Ort. Das Klima in der Karibik macht uns zu schaffen. Es ist heiß, schwül und es gibt viele Moskitos. Die Karibik in Kolumbien ist wunderschön, aber auch sehr herausfordernd! CO 2023
  ageRating: 12
