  description: |-
    Eine Erlebnisreise in den Vereinigten Staaten: Die Schauspielerin und Musikerin Jasmin Tabatabai nimmt Sie mit nach Orlando in den Bundesstaat Florida. In Begleitung ihrer Tochter geht sie auf die Suche nach unvergesslichen Abenteuern. Zum Glück sind diese in Orlando nicht schwer zu finden. Die Stadt ist bekannt für seine Erlebniswelten und Themenparks. Kein Wunder also, dass die Reise der Schauspielerin in der mystischen Welt des Harry Potter beginnt. Im nachgebildeten Hogwarts verschickt sie Postkarten mit der Eulenpost, kostet das aus den Büchern bekannte "Butterbeer" und fliegt mit der Hippogreif-Achterbahn um Hogwarts-Castle. Weitere Stopps auf ihrer Reise durch die Erlebnisparks sind die Themenwelt "Universal's Islands of Adventure" und Disney World: Hier trifft Jasmin Tabatabai mit ihrer Tochter auf den Superheld Spiderman und auf Micky Mouse. Außerhalb der vielen Freizeitparks warten jedoch viele weitere Abenteuer. In der Sumpflandschaft  von Boggy Creek gehen Mutter und Tochter auf die Suche nach Alligatoren. Ein besonderes Erlebnis für beide ist das Schwimmen mit Delphinen. Nach all den Attraktionen bildet das allabendliche Disney-Feuerwerk "Illuminations" einen gelungenen Abschluss der Reise.

