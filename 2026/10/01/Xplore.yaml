  title: Sprintour - Können wir nach Panama verschiffen?
  subtitle: Sprintour - Können wir nach Panama verschiffen?
  description: Wir planen unser Wohnmobil von Kolumbien nach Panama zu verschiffen. Zwischen Kolumbien und Panama befindet sich das Darien Gap. Das ist ein Naturschutzgebiet, indem es keine Straße gibt. Um den Camper von Kolumbien nach Panama zu schaffen, müssen wir unser Wohnmobil verschiffen. Allerdings ist das einfacher gesagt, als getan. Eigentlich hatten wir von unserer Verschiffungs Agentin die Zusage, dass der Camper in einer Woche verschifft werden kann. Und plötzlich kommt nichts mehr, keine Antwort mehr und Funkstille! Langsam machen wir uns sorgen und wissen nicht, was wir tun können. Wir möchten noch etwas an der Karibikküste in Kolumbien bleiben, allerdings auch unseren Camper verschiffen, damit as Vanlife auf der Panamericana weitergehen kann. So beschließen wir in den Tayrona Nationalpark in der Nähe von Santa Marta Halt zu machen und den Park anzuschauen. Der Tayrona Nationalpark ist ein Naturschutzgebiet in dem viele Tiere zu sehen sind. Es gibt dort einen Wanderweg entlang der Küste, der zu wunderschönen Sandstränden in der Karibik führt. Einer ist schöner als der andere. Aber es ist heiß und Vanlife bei dieser Hitze ist kaum möglich! Trotzdem haben wir den Aufenthalt sehr genossen und fahren mit dem Campervan weiter. Wir beschließen mit unserem Wohnmobil nach Cartagena zu fahren um herauszufinden was Sache ist und wann unsere Südamerikareise auf der Panamericana weitergehen kann. Cartagena ist zu der Zeit leicht überschwemmt und die Straßen sind sehr eng. Wir kommen mit unserem Kastenwagen kaum zurecht. Allerdings ist die Agentur so nett und schickt jemanden, der uns abholt und zur Verschiffungs Agentur bringt. Und es stellt sich heraus, dass unsere Verschiffungs Agentin super nett ist und bemüht ist allen Gerecht zu werden. Leider klappt unser Verschiffungsdatum für das Wohnmobil nicht und wir müssen knapp einen Monat warten. PA 2023
  ageRating: 12
- eventId: 1323549
