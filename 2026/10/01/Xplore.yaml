  title: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 2: Die Antarktis, kaum ein Ort der Welt wirkt so unwirklich und zugleich faszinierend wie der sechste Kontinent. Kommen Sie mit und begleiten sie den beliebten Schauspieler Richy Müller auf seiner Reise in die unendlichen Weiten der Antarktis. Der sechste Kontinent ist wahrlich kein alltägliches Touristenziel, so ist sogar die Anreise schon ein echtes Abenteuer. Da es am Ende der Welt natürlich keinen Flughafen gibt , reist das Team rund um Richy Müller per Boot an. Alleine diese Bootsfahrt bietet unwirkliche Panoramen , vorbei an gigantischen Eisschollen und noch größeren Eisbergen führt uns unsere Reise zur Mond Bucht. In dieser sichelförmigen Bucht verbringen wir eine unvergessliche Nacht unter der besonderen Lichtstimmungen des polar Himmels. Obwohl die Antarktis vor allem durch ihre Unberührtheit und Ruhe zu beeindrucken weiß , besitzt sie auch zahlreiche Bewohner , primär tierischer Natur. So wagen wir einen Abstecher zum Pinguin Island . Wie ihr Name verrät ist ,diese von Menschen unberührte Insel ,die Heimat zahlreicher Pinguine. Besonders interessant ist dabei zu beobachten wie die noch jungen Pinguine beharrlich auf ihre Eltern warten , die tagsüber auf Beutefang sind. Da die Antarktis vordergründig aus Wasser besteht , lässt es sich Richy Müller natürlich nicht nehmen die Umgebung auch vom Kajak aus zu erkunden. Dabei entdeckt er neben den bereits bekannten Pinguinen auch Robben und sogar den ein oder anderen Wal DE 2015'
