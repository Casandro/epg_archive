  title: Die Küsten der Ostsee - Polen
  subtitle: Die Küsten der Ostsee - Polen
  description: 'Die letzte Episode auf der Reise rund um die Ostsee startet am Frischen Haff. Hier trainiert die Vizeweltmeisterin im Freestyle-Kiten, Karolina Winkowska. Über ein Relikt aus den Zeiten der Industrialisierung, dem Oberländischen Kanal, führt die Helikopterroute nach Danzig. Die Geschichte ist in Danzig allgegenwärtig. Auf der Werft nahm die Solidarno-Bewegung ihren Anfang: die Geburtsstunde des demokratischen Polens. Fotograf Micha Szlaga dokumentiert den Wandel seines Landes anhand einer Langzeitstudie der Werft. Heute trifft er statt ölverschmierter Blaumänner Künstler, die sich auf dem Gelände am Hafen ihre Ateliers eingerichtet haben. In der Danziger Bucht betaucht Polens ältester Taucher, Lech Nowicz, die Wracks, die hier seit dem Zweiten Weltkrieg überall verstreut liegen. Weiter nördlich ist die Danziger Bucht die Heimat von Schweinswalen. Forscher sichern ihr Überleben durch Schallzäune, die sie von den Netzen der Fischer fernhalten. Entlang der Küste über die Dünen von eba und Ustka führt die Reise nach Rusowo und Stettin. Hier wird eine alte polnische Tradition gehegt: die Pferdezucht. Jan Bobiks Familie führt das Hannoveraner-Gestüt Nowielice schon in der vierten Generation. DE 2011'
