  title: Der Rhein von oben - Ruhrgebiet von oben
  subtitle: Der Rhein von oben - Ruhrgebiet von oben
  description: 'Das Ruhrgebiet, der größte Ballungsraum Deutschlands, ist eine einzigartige Kulturlandschaft: auf der einen Seite erschlossen und urban, auf der anderen Seite naturbelassenes Idyll. Die Vielfalt des Reviers erschließt sich am besten von oben. Das Team hat sich in die Luft begeben und atemberaubende Bilder mitgebracht. Der Film zeigt das Revier aus ungewohnten Perspektiven: mal aus großer Höhe für den Gesamtüberblick und dann wieder ganz nah dran an den Menschen. Halden, Zechen und Stahlwerke geben aus der Luft ihre bizarre Schönheit preis. Deutlich ist zu sehen, wie der Industriewald in Gelsenkirchen die Reste der Zeche RheinElbe überwuchert. Im Ruhrtal im Süden säumen uralte Ruinen und elegante Schlösser die Ufer, Wassersportler tummeln sich am und im Fluss. Die Menschen des Ruhrgebiets faszinieren. Zum Beispiel Britta Breitenstein: Sobald der Westwind durch das Revier pustet, startet sie mit ihrem Gleitschirm von der Halde Norddeutschland. Fischzüchter Adolf Braun kam in den 1950er Jahren aus Mecklenburg nach Duisburg. Direkt am Autobahnkreuz Kaiserberg, dem "Spaghettiknoten", hält er in selbst angelegten Teichen Aale und Forellen. Aus der Vogelperspektive scheint es, als hätte sich Adolf Braun hier seine ganz persönliche Seenplatte gebaut. Für ihn ist das Ruhrgebiet ""as Herz Deutschlands". Fotograf Hans Blossey hat den Blick von oben zu seinem Beruf gemacht, er spezialisierte sich auf Luftbilder. Hunderte Stunden verbringt er jedes Jahr in seiner Cessna über dem Revier, immer auf der Jagd nach neuen Perspektiven. Er weiß: Die Region hat sich in den letzten Jahren immens verändert. Das Ruhrgebiet: einst die Keimzelle der Industrialisierung, mächtiges Montanland. Später das Sorgenkind der Republik. Heute richtet man im Revier den Blick nach vorn. Erholung, Tourismus, Kultur, das sind die neuen Schlagworte. Das Nebeneinander der verschiedenen Epochen ist von oben gut zu entdecken. Der Wandel im Revier wird nirgends so deutlich wie aus der Luft. DE 2013'
