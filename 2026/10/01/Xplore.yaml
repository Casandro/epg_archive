  description: |-
    VIP Trip - Prominente auf Reisen 2: La Reunion - ein kleines, aber sehenswertes Inselparadies westlich von Madagaskar. Begleiten Sie den bekannten Fernsehkoch Steffen Henssler auf seiner Reise durch die faszinierenden Landschaften des französischen Überseegebiets, eine der wenigen Vulkaninseln in dieser Region. So beginnt Steffen Henssler seine Reise am Fuße des Piton de la Fournaise, eines noch immer recht aktiven Vulkans. Der Piton de la Fournaise, der zuletzt im Januar 2017 ausbrach, hat über die Jahrtausende hinweg eine atemberaubende schroffe Landschaft erschaffen. An vielen Stellen der Vulkanflanken treten heiße Gase und Wasserdampf aus. Nicht weit von dieser unwirklichen Szenerie liegt das Örtchen Zilaos. Hier entdeckt Steffen Henssler den ie ersten kulturellen und kulinarischen Einflüsse Frankreichs: Französische Weine, die mit Euro bezahlt werden. Diese werden sogar auf der Insel selbst angebaut und können durchaus mit denen vom Festland mithalten. Wie es sich für eine Insel gehört, ist das Wasser der Mittelpunkt ihrer Bewohner. So ist La Reunion ein echtes Wassersport Eldorado und bietet dank des Indischen Ozeans auch eine faszinierende Unterwasserwelt. Diese kann sich auch Steffen Henssler nicht entgehen lassen und begibt sich auf eine tierreiche Bootstour. Doch nicht nur das Wasser rund um die Insel ist einen Besuch wert, so lohnt es sich auch die Insel mal von einer anderen Perspektive zu beobachten, nämlich von oben. Deshalb hebt Steffen Henssler per Flugzeug ab und  gewinnt ganz neue Eindrücke von der Insel der Tausend Gesichter, so wird sie liebevoll den Einheimischen genannt.
    Als Koch sind die regionalen Zutaten einer Insel interessant. So lässt es sich Steffen Hennsler natürlich nicht nehmen, die Märkte der Insel zu erkunden und ihnen zum Abschluss seiner Reise noch die schmackhafte kreolische Küche einmal näher zu bringen. DE 2009
