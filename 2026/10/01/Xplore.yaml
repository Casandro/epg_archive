  stop: 2026-10-01T14:46:00Z
  title: Sprintour - Wir fliehen aus Kolumbien
  subtitle: Sprintour - Wir fliehen aus Kolumbien
  description: Wir befinden uns momentan mit dem Wohnmobil in Kolumbien in Cartagena und wir halten es bei 33°C im Camper nicht aus. Wir können kaum schlafen und finden bei der extremen Hitze in Kolumbien keine Ruhe! Hier ist Vanlife einfach nicht möglich. Deshalb beschließen wir vor der Hitze zu fliehen. Wir fliegen auf die Insel San Andres. Sie befindet sich in der Karibik und gehört zu Kolumbien, obwohl sie tausende von Kilometer weit weg von Kolumbien ist. Und es ist angenehm. Es weht immer ein frischer Wind auf der Insel und man kann die Hitze hier gut ertragen. Angekommen in San Andres schauen wir uns dort den Hauptstrand an. Der ist schön, aber auch sehr voll. Vor allem weil viele kolumbianische Touristen dort Urlaub machen. Für drei Tage haben wir uns auf der karibischen Insel ein Moped gemietet und genießen es auf der 12 Kilometer langen Insel herumzudüsen. Leider fegt ein Zyklon über die Nachbarinseln und wir bekommen Starkregen und Überflutungen ab. Zum Glück können wir hier auf der Insel in der Karibik gut online arbeiten und sitzen den Regen aus. Am nächsten Tag können wir sogar eine Tour zu Rose Cay, Acuario machen. Es ist eine wunderschöne kleine Insel, die umgeben ist von Sandbänken und vielen Fischen. Das ist ein Traum in der Karibik, wäre da nicht der Massentourismus. Auf Rose Cay Acuario sind so viele kolumbianische Touristen, dass man kaum einen Platz für sich auf der so kleinen Insel findet. Noch einmal würden wir es nicht machen. Deshalb genießen wir lieber die Zeit an einem der schönen Strände auf San Andres, dem Playas de San Luis. SO kann man die Karibik auf jeden Fall genießen. Der Ausflug zum Big Pond, der Lagune mitten auf der Insel, hat sich gar nicht gelohnt. Jetzt geht es für uns zurück nach Cartagena, in die stehende Hitze und wir freuen uns gar nicht. Es erwartet uns viel Arbeit am Camper. Denn wir müssen den Camper kleiner kriegen, damit er in den Container für die Verschiffung von Kolumbien nach Panama passt. CO 2023
