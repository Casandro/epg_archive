  subtitled: true
  hd: true
  audiodesc: true
  description: "Ausstrahlung auch im franko-kanadischen Originalton und mit französischen Untertiteln \n\nIsabelle hat genug von Männern. Mit ihren drei Kindern, ihrem stressigen Beruf und den dauernden Besuchen von Mutter Louise und Schwester Éliane hat sie ohnehin genug zu tun. Bei Jules' Fußballtraining wird sie von einem schleimigen Spielervater angesprochen, der ebenfalls getrennt lebt und sich an sie heranschmeißt.\n\nEmma bekommt Ärger in der Schule, wo sie mit Schimpfwörtern und Doppeldeutigkeiten für Aufsehen sorgt. Jules beginnt, unangenehme Fragen zu stellen und Jade will unbedingt ein Tattoo. Soll Isabelle sich doch mit einem Date ablenken?"
