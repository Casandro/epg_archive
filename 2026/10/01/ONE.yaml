  description: "Ausstrahlung auch im franko-kanadischen Originalton und mit französischen Untertiteln \n\nIsabelle, alleinerziehende Mutter von drei Kindern, erlebt den perfekten Sturm des Alltags. Sie bewältigt Erziehung, Arbeit, Freundschaft und die Suche nach der großen Liebe quasi mit links - wäre da nicht ihre frisch pensionierte Mutter, die zu viel Zeit hat, ihre Schwester, die beschlossen hat, einen Mann für sie zu finden, ihr Ex, den sie oft noch 'mitorganisieren' muss und dessen neue Freundin, die offenbar alles über Kindererziehung weiß, ohne selbst Kinder zu haben."
