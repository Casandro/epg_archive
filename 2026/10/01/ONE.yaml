  title: In aller Freundschaft (S10/E23)
  subtitle: Verlockungen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: "Christel Petry wird mit einer komplizierten Armfraktur eingeliefert. Sie wird eine Ellenbogenprothese brauchen. Außerdem zeigt sich, dass sie eine leichte Blutung im Hirn hatte. Sie wird mit Medikamenten behandelt, die Prothese wird ihr erfolgreich eingesetzt.\n\nChristels Sohn Andreas erfährt, dass sie bei einem Ladendiebstahl erwischt wurde und es deswegen zu einem Sturz kam. Plötzlich verschwinden in der Klinik verschiedene Gegenstände. Oberschwester Ingrid glaubt, Christel sei eine Kleptomanin. \n\nProfessor Simoni spricht mit Andreas darüber, was diesen in der Annahme bestärkt, seine Mutter müsse in ein Heim."
