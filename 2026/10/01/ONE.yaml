  title: In aller Freundschaft (S10/E22)
  subtitle: Vertrauensbruch
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 6
  description: "Der Patient Heinz Kluge, der Dr. Kaminski von früher kennt, hat den Befund eines Nierenkarzinoms lange wissentlich verschleppt. Jetzt will er von Kaminski operiert werden, doch eine Operation, die eine Dialyse zur Folge hat, lehnt er ab. Damit zwingt er Dr. Kaminski zu einer Entscheidung über Leben und Tod. \n\nKaminski fühlt sich bedroht, da Kluge über seine Vergangenheit Bescheid weiß. Nachdem Kaminski die Operation übernimmt, steht er tatsächlich vor der Entscheidung, den Patienten unbehandelt sterben zu lassen oder sich über dessen Willen hinwegzusetzen."
