  title: Progetto Scienza STEM - p. 20 - Mare
  subtitle: Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo della ricerca
  description: "e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. energie rinnovabili e di risorse ittiche sostenibili. Raccontano la loro esperienza e le loro ricerche alcuni ricercatori del Consiglio Nazionale delle Ricerche, Andrea De Felice, dell'Istituto per le Risorse Biologiche e le Biotecnologie Marine, Alessia Lucarelli, dell'Istituto di Ingegneria del Mare, Fantina Matricardo, dell'Istituto di Scienze Marine, e Pietro Ferraro, dell'Istituto di Scienze Applicate ai Sistemi Intelligenti; e Giuliana Mattiazzo, Vice Rettore per il Trasferimento Tecnologico del Politecnico di Torino. - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
- eventId: 1329489
  start: 2026-10-01T03:00:00Z
  stop: 2026-10-01T03:30:00Z
  title: 'Memex Nautilus - Antica e innovativa, è '
  subtitle: Memex Nautilus - Antica e innovativa, è la Ceramica - Nautilus - Antica e innovativa, è la Ceramica - L'informazione e l'approfondimento scientifico di Rai Cultura. Con l'astrofisico Luca Perri alla scope..
  description: "ta del mondo che ci circonda e delle sue regole. Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo della ceramica.Molti oggetti che utilizziamo nella nostra vita quotidiana possiedono componenti, magari invisibili a occhio nudo, di natura ceramica. Oggi infatti sentiamo sempre più parlare di ceramica tecnica, cioè di materiali ceramici avanzati: un mondo destinato ad assumere un ruolo sempre più rilevante per lo sviluppo di soluzioni e innovazioni nell'universo industriale: dall'elettronica all' energia, passando per la domotica e la meccatronica. Ma non solo. Ne parliamo con Anna Tampieri, Direttore dell'Istituto di Scienza e Tecnologia dei Materiali Ceramici del CNR di Faenza, e con Giovanni Baldi, Direttore di un Centro Ricerche dei materiali ceramici avanzati in Toscana, entriamo nei laboratori industriali alla scoperta di un'altra frontiera della ricerca nel campo dei materiali: la ceramica industriale per la salute dell'ambiente. La ceramica è anche in grado di narrarci l'esistenza dell'uomo. La sua storia, infatti, parte da molto lontano: ce la racconta Anna Pancaldi con un viaggio che comincia dodicimila anni fa e arriva fino alla vita di Johann Friedrich B ttger, passato alla Storia come 'l'alchimista che ha scoperto il segreto della porcellana cinese'. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
- eventId: 1329490
  start: 2026-10-01T03:30:00Z
  stop: 2026-10-01T04:00:00Z
  title: Progetto Scienza Newton Edu (pt. 05) Ani
  subtitle: 'Progetto Scienza Newton Edu (pt. 05) Animali: La convivenza con l''uomo. - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata del ciclo dedicato alla zoolo'
  description: "gia, Davide Coero Borga e il Professor Biagio D'Aniello, zoologo dell'Università Federico II di Napoli, ci conducono nel mondo della domesticazione e dei cambiamenti genetici nelle specie che sono entrate in relazione stretta di collaborazione e convivenza con la specie umana. Emanuela Prato Previde, psicologa dell'Università degli Studi di Milano spiega come i gatti regolano il proprio comportamento leggendo le reazioni dell'adulto umano di riferimento. Paolo Baragli, veterinario dell'Università di Pisa, individua il beneficio del rapporto tra esseri umani e cavalli attraverso l'uso di tessuti intelligenti, che tracciano le reazioni fisiologiche dell'animale per essere poi analizzate da bioingegneri che ne spiegano l'andamento e il significato. - \n\nUn programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Giuseppe Cembalo, Federica De Maria, Mario Ferrari, Daniela Mazzoli, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga con la partecipazione di Anna Pancaldi."
