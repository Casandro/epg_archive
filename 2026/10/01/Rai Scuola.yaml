  subtitle: 'Memex Doc - Vita da Ricercatore (p. 7): Massimo Labra, botanico - Con Davide Coero Borga andiamo alla scoperta della vita quotidiana di chi fa ricerca: storie di ordinario entusiasmo. Giovani curiosi, cora'
