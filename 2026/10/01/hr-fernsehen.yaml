  description: 'Im Morgengrauen findet eine Zeitungsfrau im Vorgarten der Villa Strauch eine Leiche. Wenig später trifft Kommissar Freytag mit seinem Stab am Tatort ein, um Spuren zu sichern: Glassplitter, Reifenabdrücke, Gewebefetzen von der Hose des Toten, die Zierleiste eines Autos. Also: Verkehrsunfall mit tödlichem Ausgang. Der Fahrer ist geflüchtet. Ein weiteres Beweisstück wird völlig zerbeult aus einer Kiesgrube geschleppt: der Wagen des Täters. Er gehört einem Architekten, der behauptet, der Wagen sei ihm am Abend der Tat gestohlen worden - eine Behauptung, der Kommissar Freytag misstraut und die er zu erschüttern versucht.'
