- eventId: 1350603
  start: 2026-10-01T09:04:00Z
  stop: 2026-10-01T09:40:00Z
  title: Radioporadna
  description: Martina Motshagen se dlouhodobě věnuje jako zástupkyně pacientů osvětě, prevenci a podpoře lidí se srdečněcévními onemocněními. Dlouhodobě se zasazuje o to, aby se téma Světového dne srdce dostávalo mezi širokou veřejnost a nezůstávalo pouze v prostředí nemocnic. Přibližuje lidem srozumitelnou formou význam prevence, včasného rozpoznání zdravotních obtíží i správné reakce ve chvíli, kdy je nutné přivolat odbornou pomoc. A právě na toto téma zavedeme řeč ve čtvrteční Radioporadně. Moderuje Jitka Slezáková.
