  title: Eco Spezial
  subtitle: Temu - Ramsch oder Revolution?
  description: "Vom Akkubohrer bis zur Zahnbürste: Die chinesische Online-Handelsplattform Temu lockt mit extremen Billigangeboten für Konsumgüter jeglicher Art. Für die Konsumenten in Europa gestaltet sich der Bestellprozess denkbar einfach: Ein Klick und die Ware wird direkt an die gewünschte Zustelladresse versendet. Transparenz zu Herkunft und Händlerunternehmen sucht man dabei vergebens. Was immer wieder aufscheint, sind täuschend echte Gütesiegel - angeblich von geprüften deutschen Laboren - aber die Produktqualität ist oft mangelhaft. \nIm letzten Jahr kamen täglich rund 16 Millionen Pakete aus China in der EU an, viele davon Temu-Bestellungen. Die EU und Österreich wollen nun die Flut an Billigprodukten eindämmen: Seit Juli hat die EU einen Zoll auf Kleinpakete aus China eingeführt und ab Oktober kommt in Österreich die Paketsteuer dazu. \nWird das reichen, um faire Wettbewerbsbedingungen zwischen Europa und China herzustellen? Was steckt hinter der Erfolgsformel von Temu und wie steht es wirklich um die Qualität der Produkte? \nEin ECO-Spezial von Julian Gräfe vom Südwestrundfunk (SWR)."
  genre:
  - '129'
- eventId: 1361012
  start: 2026-10-01T20:30:31Z
  stop: 2026-10-01T21:05:31Z
  title: Eco Spezial
  subtitle: Temu - Ramsch oder Revolution?
  description: "Vom Akkubohrer bis zur Zahnbürste: Die chinesische Online-Handelsplattform Temu lockt mit extremen Billigangeboten für Konsumgüter jeglicher Art. Für die Konsumenten in Europa gestaltet sich der Bestellprozess denkbar einfach: Ein Klick und die Ware wird direkt an die gewünschte Zustelladresse versendet. Transparenz zu Herkunft und Händlerunternehmen sucht man dabei vergebens. Was immer wieder aufscheint, sind täuschend echte Gütesiegel - angeblich von geprüften deutschen Laboren - aber die Produktqualität ist oft mangelhaft. \nIm letzten Jahr kamen täglich rund 16 Millionen Pakete aus China in der EU an, viele davon Temu-Bestellungen. Die EU und Österreich wollen nun die Flut an Billigprodukten eindämmen: Seit Juli hat die EU einen Zoll auf Kleinpakete aus China eingeführt und ab Oktober kommt in Österreich die Paketsteuer dazu. \nWird das reichen, um faire Wettbewerbsbedingungen zwischen Europa und China herzustellen? Was steckt hinter der Erfolgsformel von Temu und wie steht es wirklich um die Qualität der Produkte? \nEin ECO-Spezial von Julian Gräfe vom Südwestrundfunk (SWR)."
  genre:
  - '129'
