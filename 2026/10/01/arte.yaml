- eventId: 768189
  start: 2026-10-01T06:55:00Z
  stop: 2026-10-01T08:25:00Z
  title: Versailles - Palast des Sonnenkönigs
  subtitle: Frankreich 2018
  genre:
  - '112'
  subtitled: true
  description: 'Von den irrwitzigen barocken Fantasiegebilden über die Luxusgemächer der Höflinge bis zum Privatmuseum des Königs: Das heutige Versailles hat kaum noch Ähnlichkeit mit dem Schloss des Sonnenkönigs. Bereits unter seiner Herrschaft löschte es unaufhörlich seine eigene Geschichte aus. Zurzeit wird die versunkene Vergangenheit mit modernsten Mitteln wie Restaurierung und Digitalisierung Tausender von Schlossplänen erforscht. Durch die aufwendige Rekonstruktion der verschwundenen Räume kommen vergessene Bauabschnitte zum Vorschein, entfalten unbekannte Bauten ihren Reiz und offenbart sich die Nutzung der privatesten Räume des Schlosses.'
- eventId: 768190
  start: 2026-10-01T08:25:00Z
  stop: 2026-10-01T09:25:00Z
  title: Streifen durch die Wildnis
  subtitle: Die große Zebrawanderung
  description: Im Norden Tansanias liegt der Serengeti-Nationalpark mit einer Fläche von knapp 15.000 Quadratkilometern. Hier lassen sich die größten Herdenwanderungen der Welt beobachten. Von den 300.000 Zebras auf Wanderung widmet sich die Dokumentation besonders einem einzelnen Tier und gibt Einblick in die Strategien einer jungen Zebrastute, die ihr Neugeborenes am Leben zu halten versucht. In der flachen, weiten Savanne lauern Geparden, Löwen und Hyänen auf leichte Beute. Mit dem Neugeborenen in der Mitte der Herde zu bleiben, ist daher eine ausgezeichnete Strategie.
- eventId: 768540
