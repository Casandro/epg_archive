  title: 'Re: Bulgariens Tal der Rosen in der Krise?'
  subtitle: Deutschland 2026
  subtitled: true
  description: 'Bulgarien ist das Zentrum der globalen Rosenölproduktion. Jeden Frühling beginnt im Tal der Rosen ein Wettlauf gegen die Zeit: Innerhalb von vier Wochen müssen die Blüten jeden Morgen frisch geerntet werden. Doch Arbeitskräftemangel und steigende Kosten setzen die Branche unter Druck. ARTE Re: begleitet Pflücker und Rosenbauern und zeigt, wer den Preis für das kostbare Öl zahlt.'
