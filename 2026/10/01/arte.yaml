- eventId: 768095
  start: 2026-10-01T00:10:00Z
  stop: 2026-10-01T01:05:00Z
  title: Krank durch Plastik?
  subtitle: Deutschland 2021
  subtitled: true
  ageRating: 6
  genre:
  - '144'
  description: Könnte es sein, dass wir alle unfreiwillige Teilnehmer an einem globalen Experiment sind? Die Dokumentation untersucht den Zusammenhang zwischen einer wachsenden Zahl von Krankheiten und den Chemikalien, die zur Herstellung von Plastik verwendet werden. Immer mehr Frauen erkranken an Brustkrebs, viele Paare bleiben ungewollt kinderlos, und die Zahl der Menschen mit Aufmerksamkeitsstörungen nimmt zu. Forschungsergebnisse deuten darauf hin, dass Chemikalien in Kunststoffen das ungeborene Kind beeinträchtigen können, was im Laufe des Lebens zu negativen gesundheitlichen Folgen führen kann.
- eventId: 768096
  start: 2026-10-01T01:05:00Z
  stop: 2026-10-01T01:35:00Z
  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Singapur
  description: 'Der Katamaran "Nomade des mers" nimmt Kurs auf Singapur. Dort wollen Coline und Corentin ein Verfahren untersuchen, das landwirtschaftlichen Anbau auf kleinstem Raum und mit geringem Wasserverbrauch ermöglicht: Aquaponik - ein Verfahren, das Techniken der Aufzucht von Fischen in Aquakultur und der Kultivierung von Nutzpflanzen mittels Hydrokultur verbindet. Während Singapur 90 Prozent seiner Lebensmittel importiert, versuchen einige motivierte "urbane Landwirte", eine selbstständige Nahrungsversorgung im Stadtstaat zu ermöglichen. Coline und Corentin lassen sich von der revolutionären Anbautechnik überzeugen.'
- eventId: 768097
  start: 2026-10-01T01:35:00Z
  stop: 2026-10-01T01:45:00Z
  title: Mit offenen Augen
  subtitle: Friend - die nicht nur beliebte KI-Halskette
  description: Die im September 2025 in New York und Los Angeles und Anfang 2026 auch in Paris gelaunchte minimalistische Plakatkampagne für die KI-Halskette "Friend" löste feindselige Reaktionen aus; viele Plakate wurden mit dem Spruch "KI ist nicht dein Freund" verunstaltet. Die Zerstörungswut zeugt vom sichtbaren Widerstand der Öffentlichkeit gegen das Prinzip der allseits präsenten KI. Der Autor und Werbekritiker Jean-Luc Coudray analysiert die Reaktionen, während der Technologiejournalist Brian Merchant betont, dass es sich bei diesem Protest nicht um einen isolierten Akt handelt.
