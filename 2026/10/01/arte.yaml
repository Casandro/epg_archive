- eventId: 768167
  start: 2026-10-01T03:00:00Z
  stop: 2026-10-01T03:55:00Z
  title: Die Kanaren - Inseln am Tropf
  subtitle: Frankreich 2024
  subtitled: true
  description: Aufgrund begrenzter Süßwasservorkommen und eines steigenden Bedarfs entstand auf den Kanarischen Inseln vor 60 Jahren die erste Meerwasserentsalzungsanlage auf europäischem Gebiet. Diese Art der Wasseraufbereitung ist unverzichtbar für das Leben und die Wirtschaft vor Ort und wird häufig als Patentlösung gehandelt - aber ist sie mit den Grundsätzen einer nachhaltigen Entwicklung vereinbar?
- eventId: 768168
  start: 2026-10-01T03:55:00Z
  stop: 2026-10-01T04:50:00Z
  title: GEO Reportage
  subtitle: Pelota, die baskische Leidenschaft
  genre:
  - '144'
  subtitled: true
  description: Wohl kaum eine Sportart verbindet die Menschen im Baskenland so sehr wie Pelota. Gelegen auf der Grenze zwischen Frankreich und Spanien, sieht sich die Region bis heute als eigenständige Provinz mit einer gemeinsamen Kultur, Sprache und Identität. Immer wieder gab es Autonomiebestrebungen, auch gewaltsam. Heute gilt die Region als friedlich, die eigene Identität wird hier nach wie vor besonders betont. Das Pelota-Spiel, bei dem ein Ball gegen eine Hauswand geworfen wird, ist ein wichtiger Teil davon.
