  title: 'Japan: Die Kinder des Tsunami (2)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Doku rekonstruiert die dramatischen Ereignisse des Tsunamis aus der Sicht von Grundschulkindern, die ihn überlebt haben, sowie aus der Sicht der Familien, deren Kinder ums Leben kamen. Die Schüler:innen der Okawa-Grundschule sollten sich nach dem Erdbeben auf dem Hof versammeln, während die Lehrer:innen berieten, ob sie sie zu einem höher gelegenen Ort führen sollten. Die Entscheidung dauerte zu lange und die Tsunamiwelle verschlang 74 Kinder, die noch nicht von ihren Eltern abgeholt worden waren.
- eventId: 567586
  start: 2026-10-01T03:45:00Z
  stop: 2026-10-01T04:00:00Z
  title: 'Japan: Achtung Erdbeben!'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In keinem anderen Land bebt die Erde so oft wie in Japan. Hundertausende Menschen kamen in den vergangenen mehr als hundert Jahren bei Erdbeben ums Leben oder wurden obdachlos. Warum bebt die Erde in Japan? Wie gehen die Japaner*innen mit der ständigen Gefahr um? Wie funktioniert das japanische Frühwarnsystem? Was bedeutet erdbebensicheres Bauen? Die beiden Schüler*innen Tomohiro und Saya in Tokio zeigen, wie sie mit dem Erdbeben leben.
