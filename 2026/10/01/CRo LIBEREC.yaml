  title: Host Dopoledne pod Ještědem
  description: 'Ředitelka Mezinárodního festivalu Sportfilm Renata Balašová. Téma: Sportovní legendy očima filmařů. Bývalý český reprezentant a Mistr světa v běhu na lyžích Martin Koukal. Nadcházející 29. ročník Mezinárodního festivalu sportovních filmů Sportfilm Liberec přiveze padesát filmových projekcí, výstavy, besedy, přednášky na téma Mentální zdraví a galavečer vysílaný Českou televizí, kde budou oceněny vítězné filmy. V čem je letošní ročník výjimečný, které známé osobnosti se představí, to probereme s ředitelkou festivalu Renatou Balašovou. Pro změnu Martin Koukal nám prozradí, jak se cítí v roli moderátora a porotce.'
