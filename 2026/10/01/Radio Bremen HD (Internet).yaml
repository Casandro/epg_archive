  description: 'Kanupolo ist ein Sport für durchtrainierte Draufgänger wie Paul Schott. Als er bei einem Turnier auf dem Bodensee teilnimmt feuern ihn die Kollegin Julia sowie Nele mit ihren Kindern Johanna, Niklas und dessen Freund Josh an. Doch die Begeisterung schlägt in Entsetzen um als ein gegnerischer Spieler kopfüber tot in seinem Kajak treibt. Ausgerechnet Paul macht sich nun schlimme Vorwürfe, weil er den Gegner vorher hart attackiert hatte. Die Gerichtsmedizin weist allerdings eine neue Spur: Der Tote hatte Gift in der Trinkflasche, das den Gleichgewichtssinn manipuliert.'
