  description: Das Hurricane-Festival in Scheeßel zählt zu den größten und bedeutendsten Musikfestivals in Deutschland. Jedes Jahr im Juni kommen bis zu 78.000 Musikfans in die kleine niedersächsische Gemeinde. Und die Menschen in Scheeßel lieben "ihr" Festival. "die nordstory" blickt vor, auf und hinter die Bühne und zeigt, wie Macher und Bevölkerung gemeinsam aus anfänglicher Skepsis in 30 Jahren ein echtes Kultevent gemacht haben.
