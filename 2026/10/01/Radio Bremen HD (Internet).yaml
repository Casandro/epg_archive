  title: Leopard, Seebär & Co. (84)
  subtitle: Geschichten aus dem Tierpark Hagenbeck in Hamburg
  description: |-
    Hagenbecks Besucher können sich nur wundern, da geht Volker Friedrich doch tatsächlich mit einer gigantischen Zahnbürste "spazieren". Sein Ziel ist der Kamelhengst Sultan. Hat der Hengst Karies?
    Dr. Guido Westhoff erlebt sein blaues Wunder mit der Klippschlieferbande - unter Insidern auch "die Panzerknacker" genannt.
