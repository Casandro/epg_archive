- eventId: 1383450
  start: 2026-10-01T03:15:00Z
  stop: 2026-10-01T04:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Anna von Boetticher, Apnoetaucherin'
  description: "Auf der Suche nach den Geheimnissen und Schönheiten der Erde taucht Anna von Boetticher ohne technische Hilfsmittel mit nur einem einzigen Atemzug über 80 Meter tief. \nDie Apnoetaucherin gleitet unter das Eis eines gefrorenen Fjords in Grönland, erforscht geflutete Eisenerzminen und begegnet Blauhaien und Krokodilen. Die Ausnahmesportlerin hat 34 deutsche Rekorde aufgestellt und trägt eine unbändige Entdeckerfreude in sich. Ihr Motto: \"Es ist nie nichts\". \nAuf dem Roten Sofa schildert sie, welche Kraft sich in der Stille unter Wasser jedes Mal von Neuem entwickelt."
- eventId: 1383793
  start: 2026-10-01T04:00:00Z
  stop: 2026-10-01T04:20:00Z
  title: Sesamstraße
  description: Ernie bringt als neues Haustier einen Hund mit nach Hause. Bert gibt sich als Hundeexperte, der weiß, wie man mit einem Hund spricht. Komisch nur, dass der Hund überhaupt nicht auf Bert hört, aber auf Ernie schon. Elmo und Julia teilen sich einen Kuchen. Leider werden sie dabei vom kuchenfressenden Eichhörnchen beklaut. Aber gibt es das überhaupt? Antonia (7) macht unterschiedliche Gangarten von Tieren nach. Selbst den Schildkrötengang probiert sie aus. Und Schildkröten bewegen sich schneller als man denkt.
  genre:
  - '16'
