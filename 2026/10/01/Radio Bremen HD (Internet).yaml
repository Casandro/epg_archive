- eventId: 1384330
  start: 2026-10-01T04:35:00Z
  stop: 2026-10-01T05:20:00Z
  title: Unsere Geschichte
  subtitle: 1949 - in Ost & West - Zwei Familien und ihre Träume
  description: 'Als am 23. Mai 1949 das Grundgesetz in Bonn verabschiedet wird, ist in Bremen große Wäsche. Und in Petriroda wird am 7. Oktober 1949, dem Tag der Gründung der DDR, aus Strohsäcken eine Matratze gemacht. Mit Momentaufnahmen des Jahres 1949 aus dem Leben zweier Familien begleitet dieser Film Maria Bastille und Jördis Krey bei ihrer persönlichen Spurensuche, wie es ihren Familien 1949 ergangen ist, in einem Jahr, das für die Deutschen die wichtigste Zäsur für viele Jahrzehnte sein wird: die Teilung in zwei deutsche Staaten vor 75 Jahren.'
