  title: In aller Freundschaft - Die jungen Ärzte (259)
  subtitle: Konsequenz
  description: Der Kriminalpolizist Yusuf Mazin wird mit einer Schussverletzung in die Notaufnahme eingeliefert. Während er stolz auf seinen Einsatz zurückblickt und die Verletzung tapfer in Kauf nimmt, ahnt er noch nicht, dass er sich mit seiner waghalsigen Taktik gewaltigen Ärger mit seinem Vorgesetzten Marcus Breuner eingehandelt hat. Nachdem Mikko Rantala seine Fähigkeiten unter Beweis gestellt hat, legt Prof Dr. Karin Patzelt ihm einen Facharzt in der Gefäßchirurgie nahe. Für die Fachärzte Julia Berger, Dr. Ben Ahlbeck und Dr. Elias Bähr steht die Aussicht auf einen beruflichen Aufstieg im Raum.
  ageRating: 12
