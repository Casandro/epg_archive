  title: Wie geht das? Aluminium - Der Norden und das Leichtmetall
  description: 'Handygehäuse, Getränkedose, Joghurtdeckel oder Autokarosserie: Täglich haben die Menschen Kontakt mit Aluminium. Das Metall ist besonders leicht, rostet nicht und kann hart sein wie Stahl. Norddeutschland spielt bei der Herstellung eine wichtige Rolle. Aber Aluminium wird nicht immer nur positiv gesehen. Diese Folge aus der Reihe "Wie geht das?" erzählt, wie im Norden aus tropischer Erde das Metall für eine Getränkedose entsteht.'
