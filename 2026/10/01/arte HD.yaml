  description: Gudrun feiert ihren 60. Geburtstag in dem ehemaligen Waisenhaus, in dem sie zu DDR-Zeiten aufgewachsen ist. Zum Fest kommt auch ihre Tochter Lara, die schon früh nach Berlin gegangen ist. Die beiden Frauen haben ein eher schlechtes Verhältnis. Als Gudrun während der Feier erfährt, dass das Haus an einen Investor verkauft werden soll, will sie dies mit allen Mitteln verhindern. Während Gudrun störrisch ihre Mission ausführt, macht sich Lara auf die Suche nach ihrem leiblichen Vater, den sie nie kennengelernt hat.
