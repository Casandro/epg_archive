  audiodesc: true
  description: Wohl kaum eine Sportart verbindet die Menschen im Baskenland so sehr wie Pelota. Gelegen auf der Grenze zwischen Frankreich und Spanien, sieht sich die Region bis heute als eigenständige Provinz mit einer gemeinsamen Kultur, Sprache und Identität. Immer wieder gab es Autonomiebestrebungen, auch gewaltsam. Heute gilt die Region als friedlich, die eigene Identität wird hier nach wie vor besonders betont. Das Pelota-Spiel, bei dem ein Ball gegen eine Hauswand geworfen wird, ist ein wichtiger Teil davon.
