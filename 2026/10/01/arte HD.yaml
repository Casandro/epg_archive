  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Singapur
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Der Katamaran "Nomade des mers" nimmt Kurs auf Singapur. Dort wollen Coline und Corentin ein Verfahren untersuchen, das landwirtschaftlichen Anbau auf kleinstem Raum und mit geringem Wasserverbrauch ermöglicht: Aquaponik - ein Verfahren, das Techniken der Aufzucht von Fischen in Aquakultur und der Kultivierung von Nutzpflanzen mittels Hydrokultur verbindet. Während Singapur 90 Prozent seiner Lebensmittel importiert, versuchen einige motivierte "urbane Landwirte", eine selbstständige Nahrungsversorgung im Stadtstaat zu ermöglichen. Coline und Corentin lassen sich von der revolutionären Anbautechnik überzeugen.'
