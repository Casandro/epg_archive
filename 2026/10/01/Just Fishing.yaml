  title: Mission 50er Bass auf Topwater
  subtitle: Mission 50er Bass auf Topwater
  description: Ein Angeltag, der es in sich hat. Ganz in den frühen Morgenstunden geht es erst einmal mit dem Belly Boat auf die Jagd nach dem 50er Schwarzbarsch. Bereits im ersten Licht des Tages sind die Fische sehr aktiv und rauben an der Wasseroberfläche. Schnell ist der erste gelandet, jedoch fehlen noch ein paar Zentimeter, um die Mission zu erfüllen. Nach der Morgensession geht es dann mit dem lokalen Guide Marco auf sein Bassboat. Ein zäher Nachmittag mit relativ wenig Action ist nicht der beste Start. Wir fischen bis spät in die Abendstunden. Ob sich unsere Hartnäckigkeit doch noch auszahlt, seht ihr in diesem Film. IT 2023
- eventId: 1323368
  start: 2026-10-01T04:50:00Z
  stop: 2026-10-01T05:04:00Z
  title: Hechtangeln mit Köderfisch am Fireball
  subtitle: Hechtangeln mit Köderfisch am Fireball
  description: Hechtangeln heißt für die meisten Angler inzwischen Gummifische und andere Kunstköder wie Jerkbaits, Spinnerbaits, Wobbler, Streamer & Co zu werfen. Dabei ist ein Köderfisch in vielen Situationen ein echtes Ass im Ärmel. Dieser lässt sich klassisch beim Hechtangeln mit Pose oder an einer Grundmontage anbieten. Wer es aber aktiver mag, der kann den Köderfisch am Fireball servieren. Hechtangeln mit Köderfisch ist über die ganze Saison eine vielversprechende Methode. Egal ob im Sommer oder Winter - einem echten Fisch kann ein Hecht selten wiederstehen. Beim Angeln mit Fireball wird der Köderfisch an einem Jigkopf mit kurzem Haken sowie einem Stinger mit Drilling angeboten. Das System wird vertikal unterm Boot gefischt - und bietet sich auch super als tote Rute an. An diesem Tag waren Daniel Wnendt und Rute&Rolle-Redakteur Timo Keibel in Holland zum Hechtangeln im Sommer vom Boot. Dabei sollten Rotaugen in Größen um 15 Zentimeter Länge, die Hecht an die Köder locken - ob es geklappt hat? NL 2023
- eventId: 1323369
  start: 2026-10-01T05:05:00Z
  stop: 2026-10-01T05:18:00Z
  title: Flexibel zum Fisch
  subtitle: Flexibel zum Fisch
  description: 'Der Plan von Daniel Wnendt und Timo Keibel war eigentlich einen Film über das Barschangeln mit Finesse Methoden wie das Carolina Rig, Texas Rig, Free Rig zu drehen. Doch das Wetter war anders als die Vorhersage: Anstatt Flaute gab es Sturm in den Niederlanden. Daher waren die beiden Angler flexibel, schnappten sich die schwersten Barschruten an Bord, klinkten Jig Spinner in den Karabiner und retteten den Angeltag. Die Raubfische spielten mit und schnappten sich die Kunstköder beim Raubfischangeln. Jigspinner sorgte an diesem Tag für eine große Überraschung am Ende des Angeltages. Flexibel zum Fisch zahlte sich für die beiden Angler aus.  NL 2023'
- eventId: 1323370
  start: 2026-10-01T05:20:00Z
  stop: 2026-10-01T05:39:00Z
  title: Wolfsbarsch Action am Wild Atlantic Way
  subtitle: Wolfsbarsch Action am Wild Atlantic Way
  description: Beim Angeln in Irland geht es dieses Mal ins County Clare an der irischen Westeküste. An der Atlantikküste entlang des Wild Atlantic Way wird auf Wolfsbarsch und große Lippfische geangelt. Dabei schnappen sich einige Fische bei echt, irischem Wetter die Köder der Angler. Das County Clare lockt von der Galway Bay bis zur Mündung vom River Shannon mit zahlreichen Plätze zum Angeln im Atlantik. Die Westküste Irlands hält jede Menge Überraschungen parat und ist ein Toprevier zum Wolfsbarschangeln mit Kunstködern & Co. IE 2023
- eventId: 1323371
  start: 2026-10-01T05:45:00Z
  stop: 2026-10-01T06:08:00Z
  title: Angelabenteuer Island
  subtitle: Angelabenteuer Island
  description: |-
    Das Angeln auf Island ist ein unvergleichliches Abenteuer. Besonders wegen der großen Dorsche und kräftigen Seewölfe zieht es viele Angler hierher. Faszinierend ist aber auch die isländische Natur. Die unberührte Landschaft ist geprägt von Vulkankratern, Lavafeldern und Gletschern und bietet eine spektakuläre Kulisse. Besonders reizvoll ist das Angeln in den Sommermonaten. Insgesamt bietet Island nicht nur reiche Fischgründe, sondern auch eine unvergessliche Atmosphäre. Ein wahres Paradies für Angler, die Abenteuer und Entspannung in einer einzigartigen Umgebung suchen.

