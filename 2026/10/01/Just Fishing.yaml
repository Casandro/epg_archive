- eventId: 1323328
  start: 2026-10-01T00:00:00Z
  stop: 2026-10-01T00:10:00Z
  title: Norwegen Midnight Popping Madness
  subtitle: Norwegen Midnight Popping Madness
  description: 'Wenn Angler an Norwegen denken, geht es meistens ums Pilken oder Gummifischangeln. Was viele aber nicht wissen: Dass gerade Seelachse und Pollacks oft auch sehr nah an der Oberfläche rauben. Bereits beim ersten Versuch, diese auf Popper und Co. zu fangen, fliegen diese aggressiven Räuber durch die Lüfte und attackieren unsere Köder brutalst. Ausnahmezustand an Bord! NO 2023'
- eventId: 1323329
  start: 2026-10-01T00:15:00Z
  stop: 2026-10-01T00:25:00Z
  title: Speedpilken auf Seelachse in Norwegen
  subtitle: Speedpilken auf Seelachse in Norwegen
  description: Bevor es zur abendlichen Poppersession geht, sind wir auf der Suche nach Seelachsschwärmen, um diese mit unseren Pilkern zu beangeln. Sind die Fische erst mal lokalisiert, geht es Schlag auf Schlag. Mehrfachdrills mit diesen kampfstarken Meeresräubern, kreischende Bremsen und jede Menge Drillspaß sind vorprogrammiert. Die verwendete Angeltechnik, das Speedpilken ist an und für sich relativ einfach. Die Köder werden einfach am Boot heruntergelassen, bis sie sich unterhalb der Sicheln auf dem Echolot befinden. Bügel zu und schnell durch die Wassersäule gekurbelt bleiben sie dabei selten unentdeckt. NO 2023
- eventId: 1323330
  start: 2026-10-01T00:25:00Z
  stop: 2026-10-01T00:36:00Z
  title: Dorsche und Co. mit Gummiködern
  subtitle: Dorsche und Co. mit Gummiködern
  description: Gerade Dorsche halten sich sehr gerne am Gewässergrund auf und lassen sich somit hervorragend mit Jigs und Gummiködern beangeln. Diese werden bis zum Boden durchsacken gelassen und anschließend ähnlich wie beim Zanderangeln gejiggt. Aber nicht nur unser eigentlicher Zielfisch interessiert sich dafür, nein, auch eine Vielzahl an teils kuriosen Beifängen kommt an Bord. NO 2023
- eventId: 1323331
  start: 2026-10-01T00:40:00Z
  stop: 2026-10-01T00:53:00Z
  title: Topwaterangeln auf Blackbass in Italien
  subtitle: Topwaterangeln auf Blackbass in Italien
  description: Es gibt wohl kaum einen Zielfisch der so begehrt ist wie der Schwarzbarsch. Inzwischen gibt es in nahezu ganz Italien sehr gute Bestände dieser kampfstarken Fische. Einige Gewässer - wie beispielsweise der Lago die Bolsena - sind dafür bekannt, viele und große Basse zu beherbergen. Dieser klare, große Vulkankratersee ist somit eine Topadresse für Angler aus ganz Europa. Er hat riesige Krautfelder in denen sie sich sehr gerne aufhalten und auf Raubzug gehen. Kommt nun noch ein Oberflächenköder ins Spiel, wird es spannend. Hemmungslose Attacken und eine Fischerei der Extraklasse sind vorprogrammiert. IT 2023
