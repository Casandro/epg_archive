  start: 2026-10-01T08:50:00Z
  stop: 2026-10-01T09:03:00Z
  title: River Fighters - Episode 1
  subtitle: River Fighters - Episode 1
  description: "Wie der Name schon vermuten lässt, werden die Flüsse der Niederlande zum Austragungsort eines atemberaubenden Wettkampfes zwischen drei Teams. Jedes Team besteht aus zwei Mitgliedern, die niemandem den Sieg schenken wollen. Es wird in 3 Staffeln in drei verschiedenen Jahreszeiten (Winter, Sommer, Herbst) gefischt. \nStaffel 1 Winter Edition, Staffel 2 Sommer Edition und Staffel 3 Herbst Edition. \nDurch dieses außergewöhnliche Konzept, müssen die Teams ihr Können erst recht unter Beweis stellen. Es gehört einiges an Erfahrung, Wissen und ein Fünkchen Glück dazu, die jeweiligen Zielfische in den verschiedenen Jahreszeiten zu überlisten und sich unter den widrigsten Bedingungen an die Spitze der Tabelle zu angeln. \nEuch erwartet also eine spannendes von Taktik geprägtes Angelturnier der Superlative.  DE 2020"
- eventId: 1323399
  start: 2026-10-01T09:05:00Z
  stop: 2026-10-01T09:28:00Z
  title: River Fighters - Episode 2
  subtitle: River Fighters - Episode 2
  description: "Wie der Name schon vermuten lässt, werden die Flüsse der Niederlande zum Austragungsort eines atemberaubenden Wettkampfes zwischen drei Teams. Jedes Team besteht aus zwei Mitgliedern, die niemandem den Sieg schenken wollen. Es wird in 3 Staffeln in drei verschiedenen Jahreszeiten (Winter, Sommer, Herbst) gefischt. \nStaffel 1 Winter Edition, Staffel 2 Sommer Edition und Staffel 3 Herbst Edition. \nDurch dieses außergewöhnliche Konzept, müssen die Teams ihr Können erst recht unter Beweis stellen. Es gehört einiges an Erfahrung, Wissen und ein Fünkchen Glück dazu, die jeweiligen Zielfische in den verschiedenen Jahreszeiten zu überlisten und sich unter den widrigsten Bedingungen an die Spitze der Tabelle zu angeln. \nEuch erwartet also eine spannendes von Taktik geprägtes Angelturnier der Superlative. \nDas \nRegelwerk\nJede Staffel zieht sich über drei Tage. Geangelt wird im vorgegebenen Zeitrahmen. Es darf nur in Flüssen gefischt werden. Gewertet werden pro Tag ein Barsch, ein Hecht und drei Zander. \nDie Wertung:\ngrößter Barsch = 1 Punkt\ngrößter Hecht = 1 Punkt \nHöchste Gesamtlänge der 3 Zander = 1 Punkt\nGemessen wird in cm. \nAngelt ein Team alle fünf Zielfische (s.o.) bekommt es ebenfalls einen Punkt. \nMaximal können also pro Tag 4 \nPunkte erreicht werden. Pro Staffel insgesamt 12 Punkte.  DE 2020"
