  description: Erst eine ermordete Katze, dann ein angeschossener Pfarrer - in Wolfratshausen überschlagen sich wieder mal die Ereignisse. Natürlich konzentrieren Hubert und Girwidz sich auf den Mordversuch an dem Pfarrer und finden auch schnell ein Motiv. Aber war der langjährige Streit des Vorsitzenden des Schützenvereins Grasser mit Pfarrer Stein wirklich der Grund für den Schusswechsel auf dem Friedhof? Oder steckt etwas ganz anderes dahinter? Dass ausgerechnet Riedl zur Lösung des Falls beiträgt, obwohl er eigentlich nur den Katzenmord klären sollte, verwundert nicht nur ihn selbst.
