  description: Eine laue Sommernacht in Lübeck. Am Ufer der Trave feiert Suse Hausmann auf einem Restaurantschiff zusammen mit ihren Freundinnen ihren Junggesellinnenabschied. Am nächsten Tag wird ihr Exfreund Andi Schmidt, Betreiber eines Bowlingcenters, tot aus dem Wasser gefischt. Offensichtlich wurde er von Deck aus ins Wasser gestoßen, wie ein Fußabdruck auf der Leiche beweist. Im Fadenkreuz der Ermittlungen der Lübecker Kripo um Finn Kiesewetter und Lars Englen steht schnell Suses Verlobter Moritz von Dornhain, Sohn einer alteingesessenen Reederfamilie und einer der begehrtesten Junggesellen der Stadt.
