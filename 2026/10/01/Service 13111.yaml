  title: Man vs. Time - Im Wettlauf mit der Zeit
  subtitle: Geld
  description: |-
    Welchen Einfluss hat Geld auf unsere Zeit, unser Leben und unsere Gesellschaft? In einer Welt, in der Geld und Zeit untrennbar miteinander verwoben sind, stellen sich entscheidende Fragen: Wie finden wir zurück zu einer Balance zwischen finanziellen Zielen und einem erfüllten Leben? Wie hat Geld unser Verhalten, unsere Werte und unsere Wahrnehmung von Zeit geprägt? Und welche Wege gibt es, dem endlosen Streben nach Wohlstand zu entkommen?
    Ein Leben ohne Geld ist in unserer modernen Welt kaum vorstellbar. Doch anstatt uns von finanziellen Zwängen antreiben zu lassen, könnten wir lernen, Geld als Werkzeug zu betrachten - als Mittel, um Zeit, Freiheit und Lebensqualität zurückzugewinnen. Obwohl Geld allein nicht glücklich macht, kann ein gewisser Wohlstand doch zu mehr Unabhängigkeit und besseren Lebensbedingungen führen. Die Dokumentation hinterfragt, wie wir bewusster mit unserer Zeit und unserem Geld umzugehen können, um ein erfüllteres Leben zu gestalten: ein Leben, das nicht von der Jagd nach dem nächsten Gehaltsscheck oder von der Angst vor einer ungewissen Zukunft bestimmt wird.
    Dokumentarfilm, Kanada 2025, R: Leo Singer, Michel D.T. Lam  , Pierre-Luc Robillard
