  stop: 2026-10-01T18:10:00Z
  title: Quizmaster
  description: Wer sich den Fragen von Moderator Andreas Moravec stellt, kann täglich von Montag bis Freitag bis zu 5000.- Euro abräumen. Vier Herausforderer haben die Chance, in fünf Wissensgebieten gegen den Quizmaster anzutreten und ihn vom Thron zu stoßen. In den letzten beiden Runden duelliert sich der Quizmaster mit dem besten Herausforderer. Derjenige, der aus dem Duell als Sieger hervorgeht, nimmt das gesamte, erspielte Geld mit nach Hause und steigt in der nächsten Show als Quizmaster in den Ring. Setzt sich der Quizmaster gegen seine Konkurrenten durch, bleibt er im Spiel und spielt in der nächsten Sendung erneut um 5000.- Euro. Die TV Zuschauer können via App im "Live Modus" zeitgleich mit den Kandidaten im TV mitspielen und haben so die Möglichkeit, sich als Kandidat für das Studio zu qualifizieren und jeden Freitag den "App Jackpot" einzustreichen - das Geld, das während der Woche durch falsch beantwortete Fragen, nicht an den Quizmaster oder seine Herausforderer ausgespielt wurde.Österreich 2026
  widescreen: true
- eventId: 1262428
  start: 2026-10-01T18:10:00Z
  stop: 2026-10-01T18:15:00Z
  title: Servus Wetter
  subtitle: Das exklusive Wetter für den Alpenraum
  description: 'Die ServusTV-Meteorologen bereisen den Alpenraum und produzieren Ihr Wetter jeden Tag von den schönsten Plätzen in den Regionen. Außerdem erfahren Sie beim Servus Wetter nicht nur, wie das Wetter wird, sondern auch, warum es so wird.Österreich 2026,  M: Sebastian Weber'
  genre:
  - '33'
  widescreen: true
- eventId: 1262429
  start: 2026-10-01T18:15:00Z
  stop: 2026-10-01T19:15:00Z
  title: Herzensmarken
  subtitle: Montana Haustropfen
  description: Karli und Pascal bei Montana Haustropfen. In Gratwein bei Graz gehen die beiden dem Geheimnis der fast 100 Jahre alten Kult-Tropfen auf die Spur. Empfangen werden sie von Firmenchef Dr. Fischer, der nicht nur Apotheker, sondern auch passionierter Rallye-Fahrer ist. Im Rohstofflager entdecken sie unter 350 verschiedenen Zutaten die kostbaren Heilkräuter, im Labor müssen sie sich durchs Arzneibuch kämpfen und die bittere Enzianwurzel verkosten. Ein Blick ins fränkische Schwebheim zeigt, wo sechs der sieben Hauptdrogen tatsächlich wachsen und geerntet werden. Zurück in Gratwein dürfen Karli und Pascal beim traditionellen Ansatz selbst Hand anlegen und erfahren, warum aus einem alten Apothekerrezept von 1927 eine der bekanntesten heimischen Hausmittel-Marken wurde.Österreich 2026
  widescreen: true
- eventId: 1262430
  start: 2026-10-01T19:15:00Z
  stop: 2026-10-01T20:15:00Z
  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: |-
    "BLICKWECHSEL. Das Nachrichtenmagazin" ist jeden Donnerstag um 21.15 Uhr bei ServusTV zu sehen. Die Idee zum Format schließt nahtlos an jener der Servus Nachrichten an. "BLICKWECHSEL" unterscheidet sich jedoch durch seine hintergründigen und ausführlichen Beiträge von der Kompaktheit einer Nachrichtensendung. "BLICKWECHSEL" bietet einen tieferen Blick hinter die Kulissen des Zeitgeschehens - und nimmt dabei immer auch überraschende, womöglich unbekannte Positionen ein.
    "BLICKWECHSEL" berichtet über politische, wirtschaftliche und gesellschaftliche Themen, die die Menschen in Österreich bewegen. Mit freiem Geist und dem Ziel, mit jedem Beitrag einen BLICKWECHSEL vorzunehmen. Mit Themen und Aspekten, die woanders zu kurz, oder gar nicht vorkommen. Man blickt hinter die bekannten Schlagzeilen und vielfach gleichen Erzählungen. Mit Mut, aber sachlich und mit journalistischer Sorgfalt, unabhängig davon, ob die Positionen vermeintlich unerhört oder unkonventionell sein mögen.
    Durch die 30-minütige Sendung führt Katrin Prähauser live aus dem Studio in Salzburg. Gemeinsam mit einem Studiogast sollen das Thema der Woche erläutert und drängende Fragen beantwortet werden.Österreich 2026,  M: Katrin Prähauser
  genre:
  - '33'
  widescreen: true
- eventId: 1262431
  start: 2026-10-01T20:15:00Z
  stop: 2026-10-01T21:30:00Z
  title: Talk im Hangar-7
  description: |-
    Jede Woche diskutieren beim "Talk im Hangar-7" nationale und internationale Experten über relevante Fragen unserer Zeit. Dabei steht immer das Thema im Mittelpunkt: Brisant, hintergründig, lösungsorientiert - keine politischen Plattitüden und kein sinnloser Schlagabtausch. So wird die Sendung zum Forum für spannende Themen aus Wirtschaft, Wissenschaft und Gesellschaft - live aus einer einzigartigen Location.
    Diskussion, Österreich 2026,  M: Michael Fleischhacker
  genre:
  - '33'
  widescreen: true
