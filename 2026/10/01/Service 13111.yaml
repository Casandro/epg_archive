  title: Terra Mater - Die Lemuren-Bande
  subtitle: Die liebe Familie (1/3)
  description: 'In den außergewöhnlichen Wäldern Madagaskars beginnt das Leben der Lemuren mit der Familie. Schwarzmakis machen in lauten, von Weibchen angeführten Gemeinschaften, die Wälder von Nosy Komba unsicher. Hier lernt der junge Seb die Regeln des Lebens - von sozialer Rangfolge bis hin zum skurril anmutenden, berauschenden Einsatz von Tausendfüßern als Insektenschutzmittel. Entlang der Westküste ziehen Coquerel-Sifakas ihren seltenen Zwillingsnachwuchs an einem ungewöhnlichen Zufluchtsort groß: in einem Hotelgarten. Starke Winde, Feinde und die Gezeiten stellen dabei die Familie auf die Probe. Im Regenwald im Osten des Landes singt ein Indri-Paar eindringliche Duette in einer zerrissenen Landschaft. Ihre Bindung bleibt unerschütterlich, während ihr Lebensraum schrumpft. In drei sehr unterschiedlichen Welten offenbart jede Geschichte dieselbe Wahrheit: In einem sich wandelnden Madagaskar ist Familie nicht nur Verwandtschaft - sie bedeutet Überleben.Österreich 2026'
