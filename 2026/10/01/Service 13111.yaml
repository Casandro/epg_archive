  title: Bares für Rares
  subtitle: Finnisches Flair
  description: |-
    Zeit für eine Party? Das Bowle-Set, bestehend aus einer Karaffe und fünf Gläsern, steht bereits im Pulheimer Walzwerk bereit für die Feier! Doch wer ersteigert das Set mit äußerst kreativem Design und finnischem Flair? Gibt es zahlreiche Abnehmer im Händlerraum? Und: Wie taxiert der Experte Detlev Kümmel das Bowle-Set, das auch einige Chips aufweist?
    Bei dem Set handelt es sich um ein Design der finnischen Designerin Nanny Still, das sie für die niederländische Firma Raak in den späten 1960er bis frühen 1970er Jahren entworfen hat. Die Gläser und die Karaffe sind aus mundgeblasenem Glas gefertigt. Das Glas ist zudem in Kupfermanschetten eingebettet, die mit der Zeit eine Patina entwickelt haben.
    Wie wird der Verkaufspreis im Händlerraum ausfallen? Kommt es überhaupt zum erfolgreichen Verkauf? Stimmen Schätz- und Wunschpreis überein, sodass Horst Lichter die Händlerkarte überreichen kann, bevor es sodann in den Händlerraum zu den Verhandlungen geht? Es bleibt spannend!
