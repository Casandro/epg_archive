  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die Top Ten der außergewöhnlichen Kreaturen
  description: |-
    Dutzende von Berichten über Begegnungen mit seltsamen und mysteriösen Kreaturen wurden bisher gesammelt. Der Prä-Astronautik-Theoretiker Giorgio Tsoukalos untersucht nun die zehn außergewöhnlichsten Wesen - Kreaturen, die möglicherweise Beweise für außerirdische Besuche liefern könnten.
    Ist ein fliegendes Wesen in West Virginia ein außerirdischer Besucher? Könnte ein riesiges Tier im Himalaya ein verborgenes Reich der Götter beschützen? Und könnte eine achtarmige Muschel in unseren Ozeanen außerirdische DNA enthalten? Liefern diese geheimnisvollen Wesen den ultimativen Beweis für außerirdische Kontakte?
