  title: Heimatleuchten
  subtitle: Auf der Egger Alm in Kärnten
  description: "Hoch über Hermagor in Kärnten befindet sich die Egger Alm, eines der drei idyllischen Karnischen Almdörfer. Conny Bürgler verbringt mit Sennerin Elisabeth Buchacher einen Tag auf der Alm und hilft ihr beim Melken, Käsen und bei der Gästebewirtung. Außerdem begleitet sie den Jung-Förster Sepp Schwarzenbacher bei seinen Arbeiten im Revier. Danach hat sich Conny eine Belohnung verdient und trifft den Winzer Werner Holzfeind aus Kötschach-Mauthen. Er erzählt ihr, warum er als einziger in der Gegend erfolgreich Wein anbaut. Für die passende Musik sorgen diesmal die Mauthner Kirchtagsmusi, das Quintett Oisternig und das junge Quartett Oisternix. \nVolkskultur, Österreich 2017"
