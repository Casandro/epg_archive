  title: Hubert ohne Staller
  subtitle: Der Erlkönig
  description: "Ein viel zu schnell fahrender Erlkönig, der Prototyp eines E-Testwagens, durchbricht die Idylle, die Hubert und Girwidz bei einer Radarkontrolle genießen wollen. Der 14-jährige Wastl, der einen Artikel über die Arbeit der Polizei in seiner Schülerzeitung veröffentlichen soll, unterstützt sie dabei. Als Riedl den Erlkönig stoppt, finden die Ermittler die Leiche von Rosalie Motz darin. Sie ist ermordet worden, kann Dr. Fuchs feststellen. Beim Besuch des Vaters Ferdinand Motz erfahren Hubert und Girwidz, dass Rosalie Testfahrerin für das Start-Up von Gernot Schirrmeister war. Eben dieser Schirrmeister ist nicht besonders auskunftsfreudig. Er will eigentlich nur seinen Erlkönig wieder haben, um die technischen Geheimnisse darin zu schützen. Indes bekommt Revierchefin Sabine Kaiser ein Problem, als Tom Burgmüller seinen Artikel für die Schülerzeitung vorzeigt. Er hat etwas zu ehrlich die unorthodoxen und anarchistischen Ermittlungsmethoden von Hubert und Girwidz zu Papier gebracht. Und blöderweise ist Tom der Neffe des Polizeipräsidenten. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
