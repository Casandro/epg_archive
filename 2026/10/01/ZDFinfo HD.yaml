  title: Balkan in Flammen
  subtitle: Pulverfass Jugoslawien
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2019
    Die Sozialistische Föderative Republik Jugoslawien gilt als Titos Utopie eines Vielvölkerstaates. Nach dem Tod des Diktators aber zerbricht das Konstrukt mit rasender Geschwindigkeit.

    In dieser Folge der dreiteiligen Doku-Reihe "Balkan in Flammen" beginnt die Spurensuche in der Vorgeschichte von Jugoslawien. Unter dem Einfluss wechselnder Herrscher und Reiche formt sich über Jahrhunderte ein Ländergebilde mit fünf Nationalitäten und drei Sprachen.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
- eventId: 959135
  start: 2026-10-01T03:30:00Z
  stop: 2026-10-01T04:15:00Z
  title: Balkan in Flammen
  subtitle: Ein Land zerfällt
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2019
    Es ist das Schicksalsjahr 1990, als in Jugoslawien die ersten freien Wahlen seit dem Zweiten Weltkrieg abgehalten werden. Es ist die Stunde der Nationalisten.

    Der Zusammenbruch des Vielvölkerstaates ist nur noch eine Frage der Zeit. Als sich Slowenien und Kroatien für unabhängig erklären, versinkt Jugoslawien in einem blutigen Bürgerkrieg. In Kroatien und Bosnien kommt es zu Massenvertreibungen, Vergewaltigungen, Morden.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
- eventId: 960268
  start: 2026-10-01T04:15:00Z
  stop: 2026-10-01T05:00:00Z
  title: Balkan in Flammen
  subtitle: Jugoslawien in Trümmern
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2019
    Das Massaker von Srebrenica ist ein Weckruf für die internationale Gemeinschaft, die sich nach vier Jahren Krieg auf dem Balkan entschließt, einzugreifen.

    Noch im selben Jahr unterzeichnen die Kriegsparteien ein Friedensabkommen. Wenig später: wieder Krieg. Diesmal im Kosovo. Die NATO greift ein, beendet die Kämpfe. Ein umstrittener Einsatz ohne UN-Mandat. Noch immer gilt der Balkan als Pulverfass.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
