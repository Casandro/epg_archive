  description: |-
    Großbritannien 2025
    Bartholomew Roberts - er ist der letzte große Pirat des Goldenen Zeitalters und mit Abstand einer der erfolgreichsten. Mehr als 400 Schiffe hat er gekapert und dabei die halbe Welt umreist.

    Dabei ist Roberts - ein einfacher Seemann aus Wales - eher zufällig Pirat geworden. Als Howell Davis sein Schiff vor der Küste Afrikas angreift, wird Roberts gezwungen, sich dem walisischen Piraten anzuschließen. Nach dessen Tod wählt die Mannschaft ihn zum Kapitän.
