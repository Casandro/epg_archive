  title: Lost Places der Sowjetunion
  subtitle: Das Baltikum
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Drei Lost Places im Baltikum, Spuren von Annexion und Kaltem Krieg. Verlassene Forts in Litauen, eine geheime Militärinsel in Estland und eine vergessene Abhörstadt in Lettland.

    Im Baltikum sichern sowjetische Standorte Kontrolle über Land, See und Datenströme: vom Festungsring um Kaunas über die U-Boot-Anlage Hara und die Mineninsel Naissaar bis zur Abhörstation in Irbene. Annexion, Bedrohung und der Kalte Krieg - bis heute spürbar.
    HD-Produktion
- eventId: 956239
  start: 2026-10-01T01:30:00Z
  stop: 2026-10-01T02:15:00Z
  title: Lost Places der Sowjetunion
  subtitle: Ungarn, CSSR und Bulgarien
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Drei Orte, ein gemeinsamer Schatten: Fast fünf Jahrzehnte lang prägten die Sowjets das Leben im "Ostblock". In Ungarn, der Slowakei und Bulgarien sind ihre Spuren bis heute sichtbar.

    Von der Geisterstadt Szentkirályszabadja über den Grenzbahnhof Cierna nad Tisou bis zum Monument von Busludscha: eine Reise in die Schattenreiche des sowjetischen Imperiums - zu Ruinen, an denen Aufstand, Unterdrückung und Erinnerung eng miteinander verwoben sind.
    HD-Produktion
- eventId: 959133
