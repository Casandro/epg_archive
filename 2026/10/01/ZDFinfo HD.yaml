  audiodesc: true
  description: |-
    Deutschland 2023
    Britney Spears ist der Teenie-Star der Jahrtausendwende. Doch die schillernde Fassade bröckelt mit der Zeit und endet schlussendlich in einem jahrelangen Kampf um Selbstbestimmung.

    "The True Story of Britney Spears" analysiert die Biografie einer der größten Popikonen unserer Zeit. Bereits als Teenagerin schreibt Britney Spears Pop-Geschichte. Doch auf der Spitze ihres Erfolges verliert sie plötzlich die Kontrolle über ihr ganzes Leben.
