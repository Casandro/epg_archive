  title: Kraftvoll Leben - Der Selfie-Christ in Babylon
  subtitle: Kraftvoll Leben - Der Selfie-Christ in Babylon
  description: 'Wir leben in einer Zeit der Selbstzentriertheit und Zurschaustellung des eigenen Lebens in einer immer digitalisierteren Gesellschaft. In unserem Glaubensleben kann es sehr schnell nur um uns selbst gehen und wir können eine Art "Selfie-Christ"-Mentalität leben. Jesus hatte uns allerdings vorgelebt: "Vater, nicht mein Wille soll geschehen, sondern deiner". In der Predigt nimmt Andreas uns mit in die Gedanken hinein, ob wir im Selfie-Modus unseren Kaffee in Babylon trinken oder unserem Gott, der auf uns wartet, im Garten begegnen möchten? Selfie-Modus oder Jesus-Modus?'
