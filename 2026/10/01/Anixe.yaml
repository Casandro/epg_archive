  title: Der Missionsdienst von David Hathaway - Gott sieht dein Herz - und er möchte dein Leben verändern.
  subtitle: Der Missionsdienst von David Hathaway - Gott sieht dein Herz - und er möchte dein Leben verändern.
  description: 'Ich erinnere mich an ein Erlebnis in Sibirien vor etwa 30 Jahren. Wir hatten eine Antonow An-24 gechartert, mit 25 Mitarbeitern an Bord. Ich sagte zum Piloten: "Ich bezahle dafür, also will ich auch selbst fliegen!"  Er setzte mich auf den Pilotensitz, schaltete den Autopiloten aus und sagte: "Sie fliegen jetzt." Ich fand es großartig - aber die anderen Passagiere hatten panische Angst!  Daraus lässt sich eine spirituelle Lektion ableiten. Gott möchte die Kontrolle über dein Leben übernehmen. Er allein kann dich sicher durch jede Schwierigkeit führen.  Die Bibel sagt: "Gott ist Liebe." Er ist nicht nur Richter; er hat uns so sehr geliebt, dass er seinen Sohn sandte, um den Preis für unsere Sünden zu bezahlen und uns zu befreien. Doch Gott will mehr als unsere Vergebung - er will unser Herz. Er will unsere Liebe. Er will unser Leben.  Mit 21 Jahren lernte ich etwas über die Liebe. Ich predigte gerade auf meiner ersten großen Evangelisationsveranstaltung, als eine 18-jährige Musikerin ihr Leben Jesus übergab und sich meinem Team anschloss. Ich verliebte mich in sie und wollte sie heiraten. Aber ich musste sicher sein, dass sie mich genauso liebte wie ich sie.  Und das tat sie. Und all die Jahre ist ihre Liebe unverändert geblieben. Sie stand mir in meiner Krebserkrankung, im Gefängnis und während meiner Jahre im Dienst in der Sowjetunion zur Seite.'
