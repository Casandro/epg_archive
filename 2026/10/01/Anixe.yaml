  title: Faszination Israel - Sukkot, ein Fest für alle Völker
  subtitle: Faszination Israel - Sukkot, ein Fest für alle Völker
  description: Eines der jüdischen Hauptfeste ist Sukkot, das jährliche Laubhüttenfest. Es ist das einzige, dem eine Bedeutung über unser Zeitalter hinaus zugemessen wird. So sagt der Prophet Sacharija, dass im messianischen Zeitalter die Nationen nach Jerusalem kommen werden um Sukkot  zu feiern. Die ICEJ veranstaltet schon seit 1980 das Laubhüttenfest, zu welchem Tausende Teilnehmer aus aller Welt nach Israel pilgern.
