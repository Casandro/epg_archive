  title: Les humains malades du plastique
  subtitle: Le plastique est-il responsable de l'explosion des cancers du sein, de l'infertilité et des troubles neurologiques ? Etat des lieux des effets des perturbateurs endocriniens.
  genre:
  - '147'
  description: 'Alors que le plastique est omniprésent, le nombre d''affections comme le cancer du sein, l''infertilité ou les troubles déficitaires de l''attention explose. Faut-il y voir un lien de cause à effet ? Au début des années 1990, d''éminents scientifiques ont émis l''hypothèse que des substances chimiques présentes dans les matières plastiques dérégleraient le système hormonal. Depuis, de nombreuses études tentent d''évaluer l''impact des perturbateurs endocriniens sur la santé. Alors que ces derniers sont pointés du doigt dans la diminution de la qualité des spermatozoïdes, des chercheurs danois ont récemment pu observer des effets similaires sur la capacité reproductive féminine : lorsqu''elles sont en contact avec une association de produits chimiques répandus, les rates étudiées produisent moins d''ovules que leurs congénères non exposées. Réalisateur: Louise Kjeldsen. Des acteurs: Sofie Christiansen (elle-même), Barbara Demeneix (elle-même), Jean-Baptiste Fini (lui-même), Hanna Johansson (elle-même), Anders Juul (lui-même) (2021)'
