  title: 'Les Canaries : Des îles sous perfusion'
  subtitle: Les îles Canaries ont été les premières en Europe à produire leur eau potable par dessalinisation. Cette technique est-elle compatible avec le développement durable ?
  genre:
  - '35'
  description: 'Au large du Maroc, à 2 000 kilomètres au sud de la péninsule Ibérique, les îles volcaniques des Canaries constituent l''une des régions les plus arides d''Europe. Avec une pluviométrie huit fois plus faible que sur le continent, y trouver de l''eau douce a toujours été une priorité pour ses habitants, qui ont su pallier son insuffisance par d''ingénieux systèmes de collecte traditionnelle. Mais après une grave période de sécheresse, en réponse à la pénurie qui menaçait son développement humain et économique, l''archipel espagnol a installé, dès les années 1960, les premières usines de dessalement au monde. Soixante ans plus tard, la région est devenue celle qui en compte le plus au mètre carré par habitant. Et si le remède miracle n''était qu''un mirage trompeur ? Réalisateur: Yoann Périé. Des acteurs: Laurent Lederer (lui-même) (2024)'
