  start: 2026-10-01T18:30:00Z
  stop: 2026-10-01T18:57:00Z
  title: 'Labirint: Prvi red do otpada'
  subtitle: Sve je počelo kao velika priča o inovativnoj investiciji. Pojavila se tvrtka koja je u starom gospićkom silosu trebala reciklirati plastiku u građevinske blokove, bukobrane i lukobrane.
  ageRating: 4
  genre:
  - '160'
  description: 'Sve je počelo kao velika priča o inovativnoj investiciji. Pojavila se tvrtka koja je u starom gospićkom silosu trebala reciklirati plastiku u građevinske blokove, bukobrane i lukobrane. Mještani Gospića veselili su se novim radnim mjestima i najavljenom restoranu s pogledom na grad. No, vrlo su brzo shvatili da se u krugu silosa događa nešto čudno - umjesto ekološki osviještenoj inovaciji, svjedočili su čudnim radnjama... Godinama su, pred njihovim očima, brojni kamioni domaćih i stranih registracijskih oznaka dolazili danju i noću te istovarivali nepoznate, prašnjave smjese i materijale, koje su bageri potom zakopavali u zemlju. Građani su sve to dokumentirali, upozoravali i pisali institucijama, no one nisu odgovarale na njihove upite. Štoviše, lokalne su ih vlasti optuživale za širenje teorija zavjere i uvjeravali kako je sve u redu. Ignorirani i prestrašeni, mještani u međuvremenu su prestali piti vodu iz vlastitih slavina. U potrazi za istinom, sami su građani pokrenuli nezavisne analize u Hrvatskoj i Njemačkoj. Njihovi nalazi, a potom i službeni dokumenti Geotehničkog fakulteta objavljeni 6. kolovoza 2026. godine, potvrdili su njihove najgore strahove: tlo je kontaminirano teškim metalima i toksičnim antimonom, dok su u podzemnim vodama i privatnim bunarima izolirane iznimno opasne "vječne kemikalije" (PFAS) i mikroplastika. Gnjev mještana prerastao je u nacionalni bunt kada je građanska inicijativa "Gospić je naš dom" organizirala masovni prosvjed u Zagrebu pod sloganom "Hodaj za Liku, hodaj za Hrvatsku". Deseci tisuća građana preplavili su Trg bana Josipa Jelačića, zahtijevajući od Vlade hitno uklanjanje 37.000 tona opasnog otpada i hitnu sanaciju ličke prirode. Danas se oni koji žive u prvom redu do otpada s pravom pitaju: tko je dopustio da se dvije i pol godine skriva istina o opasnom otpadu? Tko je zakazao u sustavu koji je trebao zaštititi ljude? U Labirintu pod naslovom "Prvi red do otpada" donosimo potresnu priču o ekološkom zločinu, institucionalnoj šutnji i ljudima koji su svojom hrabrošću i upornošću razotkrili uvoznu ekološku bombu.'
