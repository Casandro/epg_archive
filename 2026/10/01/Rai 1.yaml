  description: "tore sanitario e di Giulia, ora primaria, costretti a ridurre medici e infermieri per sanare la disastrosa situazione economica dell'ospedale. - Qui e ora: Il morale in reparto è a terra: Martina deve fare i conti con l'ostilità di Riccardo, che non le ha perdonato la decisione di andare a Londra, mentre Matteo, abituato a lavorare da solo, fatica a entrare nelle dinamiche della squadra. Nel frattempo, tutti attendono il risultato dell'indagine interna per capire chi abbia commesso un grave errore.  - Regia di Nicola Abbatangelo \nCon Luca Argentero, Matilde Gioli, Pierpaolo Spollon, Marco Rossetti, Elisa Di Eusanio, Laura Cravedi, Elisa Wong, Alessandro Piavani, Gabriele Falsetta \nE con Sara Lazzaro e Giovanni Scifoni\nUna produzione Lux Vide, società del gruppo Fremantle, in collaborazione con RAI Fiction\n1^ puntata\n"
