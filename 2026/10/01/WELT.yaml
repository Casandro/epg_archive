  description: 'Monumental und uneinnehmbar: Die Festung Modlin in Polen wird im Ersten Weltkrieg zum Schauplatz eines waghalsigen Propagandacoups, als zwei amerikanische Filmemacher mitten ins Kriegsgeschehen geraten. Ihr Film über die Situation an der Ostfront hat das Potenzial, die Haltung der US-Bürger zum Krieg in Europa zu beeinflussen. Außerdem: Ein Gefängnis in New Jersey als Zündfunke sozialer Revolte. Und eine Diamantenstadt in Namibias Wüste, die kometenhaft aufstieg und dann im Sand versank.'
