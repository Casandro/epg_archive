  title: 'Mayday: Verschollener Fußballstar'
  subtitle: 'Mayday: Verschollener Fußballstar'
  description: 'Ein Privatflug über den Ärmelkanal endet plötzlich im Nichts: An Bord ein aufstrebender Fußballstar auf dem Weg in eine große Zukunft. Was zunächst wie ein rätselhaftes Verschwinden wirkt, entwickelt sich zu einer komplexen Spurensuche. Ermittler rekonstruieren die letzten Minuten des Fluges und stoßen auf fatale Entscheidungen, technische Risiken und unsichtbare Gefahren. Schritt für Schritt enthüllt sich ein Zusammenspiel aus menschlichem Versagen und verborgenen Mängeln.'
  widescreen: true
- eventId: 1353794
  start: 2026-10-01T18:50:00Z
  stop: 2026-10-01T19:33:00Z
  title: Mayday - Flug Germanwings 9525
  subtitle: Mayday - Flug Germanwings 9525
  description: Am 24. März 2015 bricht Germanwings-Flug 9525 überraschend den Funkkontakt ab und zerschellt kurz darauf in den südfranzösischen Alpen. Zuvor hatte der A320 rapide an Höhe verloren, trotz optimaler Wetterbedingungen. Was ereignete sich an Bord der Maschine? Die französische Untersuchungsbehörde ist zunächst ratlos, bis der Flugdatenschreiber tragische Details ans Tageslicht bringt, die nur einen Schluss zulassen. Damals involvierte Ermittler schildern die Aufklärung des verhängnisvollen Flugs.
  widescreen: true
