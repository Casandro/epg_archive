  stop: 2026-10-01T16:30:00Z
  title: Moci bez nemoci
  description: Speciál pořadu nás zavede přímo do mozku. A to ve společnosti jedné z nejvýraznějších osobností neurologie. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijal MUDr. Martin Jan Stránský, MD, FACP - neurolog a internista, mezinárodní publicista, vydavatel, pedagog a autor bestselleru Vzestup a pád lidské mysli. I on si přizval do studia člověka sobě z nejbližších. Jeho volba padla na nejstaršího syna Jana. Jaké to je vyrůstat v česko - americké rodině? Jak hluboké kořeny a historii jejich rodina v Česku má? Jaká je a byla výchova otce, který toho o mozku tolik ví? Premiéra.
