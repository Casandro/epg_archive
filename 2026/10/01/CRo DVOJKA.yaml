- eventId: 1350924
  start: 2026-10-01T20:00:00Z
  stop: 2026-10-01T20:30:00Z
  title: Četba na pokračování
  description: 'Alena Mornštajnová: Čas vos (13/14). Bářin život se nevyvíjel podle jejích představ a směr, který nabral, si sama nevybrala. Minulost už se napravit nedá, staré křivdy stále bolí, ale je třeba bojovat, aby se člověk dobral spravedlnosti a nenechal si vše líbit. Ani s Ptáčníkem se život nemazlil, stal se z něho samotář a podivín, který miluje víc ptáky než lidi. Když se jejich osudy protnou, ani jeden z nich netuší, kolik toho mají ve skutečnosti společného a jak moc si můžou navzájem pomoci. Pro rozhlas připravila Anna Smrčková. Dramaturgie Marina Feltlová. Účinkují Andrea Elsnerová a Kamil Halbich. Režie Dimitrij Dudík. Premiéra.'
- eventId: 1350925
  start: 2026-10-01T20:30:00Z
  stop: 2026-10-01T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Antonio Šoposki, herec. Inspirovala ho při výběru životní profese starší sestra Marika? Jak vzpomíná na filmový křest ohněm po boku Karla Rodena a Reginy Rázlové? A proč si myslí, že jedině skutečná výzva vás dokáže v kariéře posunout dál? Moderuje Jaroslav Sedláček.'
