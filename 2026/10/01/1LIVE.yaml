  title: 1LIVE Krimi
  subtitle: Der Atem der Katechana
  description: |-
    Es ist für Ernest die Chance seines Lebens: Die Fürstin Wassilska macht ihm posthum durch ihren Anwalt ein großzügiges Geldangebot - wenn er sich bereit erklärt, für ein Jahr ihren Katafalk in ihrem prächtigen Grabmal auf dem Pariser Friedhof zu hüten. Allerdings darf er in dieser Zeit mit niemandem sprechen, nicht einmal mit seiner Lebensgefährtin Marion.
