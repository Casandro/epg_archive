- eventId: 949624
  start: 2026-10-01T00:00:00Z
  stop: 2026-10-01T00:45:00Z
  title: Lost Places - Geheime Welten
  subtitle: Sowjetische Schatten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2020
    Drei Relikte einer untergegangenen Weltmacht, drei Monumente einer Zeit, in der die halbe Welt unter Hammer und Sichel stand. Überall finden sich bis heute die Spuren des Sowjetreiches.

    Die Autoren besuchen einen geheimen Bunker für Atomsprengköpfe im ostdeutschen Nirgendwo, das Kraftwerk Tschernobyl, das saubere Energie versprach, und Beelitz-Heilstätten, ein Hospital der deutschen Kaiserzeit, das zu einem sowjetischen Militärkrankenhaus wurde.
    HD-Produktion
- eventId: 956166
  start: 2026-10-01T00:45:00Z
  stop: 2026-10-01T01:30:00Z
  title: Lost Places der Sowjetunion
  subtitle: Das Baltikum
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Drei Lost Places im Baltikum, Spuren von Annexion und Kaltem Krieg. Verlassene Forts in Litauen, eine geheime Militärinsel in Estland und eine vergessene Abhörstadt in Lettland.

    Im Baltikum sichern sowjetische Standorte Kontrolle über Land, See und Datenströme: vom Festungsring um Kaunas über die U-Boot-Anlage Hara und die Mineninsel Naissaar bis zur Abhörstation in Irbene. Annexion, Bedrohung und der Kalte Krieg - bis heute spürbar.
    HD-Produktion
- eventId: 956167
  start: 2026-10-01T01:30:00Z
  stop: 2026-10-01T02:15:00Z
  title: Lost Places der Sowjetunion
  subtitle: Ungarn, CSSR und Bulgarien
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Drei Orte, ein gemeinsamer Schatten: Fast fünf Jahrzehnte lang prägten die Sowjets das Leben im "Ostblock". In Ungarn, der Slowakei und Bulgarien sind ihre Spuren bis heute sichtbar.

    Von der Geisterstadt Szentkirályszabadja über den Grenzbahnhof Cierna nad Tisou bis zum Monument von Busludscha: eine Reise in die Schattenreiche des sowjetischen Imperiums - zu Ruinen, an denen Aufstand, Unterdrückung und Erinnerung eng miteinander verwoben sind.
    HD-Produktion
- eventId: 959172
  start: 2026-10-01T02:15:00Z
  stop: 2026-10-01T02:45:00Z
  title: Lost Places der Sowjetunion
  subtitle: Polen und die DDR
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Drei verlassene Orte erzählen vom Erbe der Sowjetarmee in Polen und in der DDR: ein verlassenes Offizierscasino, ein alter Flugplatz und ein Ort, der durch eine Mauer geteilt ist.

    Die Militärstandorte in Polen und in der DDR dienen der sowjetischen Einflussnahme und dem Machterhalt in den sogenannten Satellitenstaaten. Es sind die westlichsten Standorte der Sowjetsoldaten während des Kalten Krieges.
    HD-Produktion
- eventId: 959173
  start: 2026-10-01T02:45:00Z
  stop: 2026-10-01T03:30:00Z
  title: Balkan in Flammen
  subtitle: Pulverfass Jugoslawien
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Die Sozialistische Föderative Republik Jugoslawien gilt als Titos Utopie eines Vielvölkerstaates. Nach dem Tod des Diktators aber zerbricht das Konstrukt mit rasender Geschwindigkeit.

    In dieser Folge der dreiteiligen Doku-Reihe "Balkan in Flammen" beginnt die Spurensuche in der Vorgeschichte von Jugoslawien. Unter dem Einfluss wechselnder Herrscher und Reiche formt sich über Jahrhunderte ein Ländergebilde mit fünf Nationalitäten und drei Sprachen.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
- eventId: 959174
  start: 2026-10-01T03:30:00Z
  stop: 2026-10-01T04:15:00Z
  title: Balkan in Flammen
  subtitle: Ein Land zerfällt
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2019
    Es ist das Schicksalsjahr 1990, als in Jugoslawien die ersten freien Wahlen seit dem Zweiten Weltkrieg abgehalten werden. Es ist die Stunde der Nationalisten.

    Der Zusammenbruch des Vielvölkerstaates ist nur noch eine Frage der Zeit. Als sich Slowenien und Kroatien für unabhängig erklären, versinkt Jugoslawien in einem blutigen Bürgerkrieg. In Kroatien und Bosnien kommt es zu Massenvertreibungen, Vergewaltigungen, Morden.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
- eventId: 960060
  start: 2026-10-01T04:15:00Z
  stop: 2026-10-01T05:00:00Z
  title: Balkan in Flammen
  subtitle: Jugoslawien in Trümmern
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2019
    Das Massaker von Srebrenica ist ein Weckruf für die internationale Gemeinschaft, die sich nach vier Jahren Krieg auf dem Balkan entschließt, einzugreifen.

    Noch im selben Jahr unterzeichnen die Kriegsparteien ein Friedensabkommen. Wenig später: wieder Krieg. Diesmal im Kosovo. Die NATO greift ein, beendet die Kämpfe. Ein umstrittener Einsatz ohne UN-Mandat. Noch immer gilt der Balkan als Pulverfass.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
