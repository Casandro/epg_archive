  title: The True Story of Sabrina Carpenter
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Sabrina Carpenter stellt die Popwelt auf den Kopf. Mit Humor, Charme und einer neuen Definition von Weiblichkeit und Sexualität setzt sie neue Maßstäbe für eine ganze Generation.

    "The True Story of Sabrina Carpenter" erzählt die Geschichte einer absoluten Selfmade-Ikone. Von vielen unterschätzt, kämpft sie sich mit Witz und der nötigen Schippe Provokation bis ganz nach oben.
