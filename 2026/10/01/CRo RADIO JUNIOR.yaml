  start: 2026-10-01T16:30:00Z
  stop: 2026-10-01T16:55:00Z
  title: Čtení na pokračování
  description: 'Malý chemický bestiář 3/5. Na základě sběru pradávných příběhů jednotlivých chemických prvků, rozhovorů s molekulami a zkoumání zbytků v kádinkách a zkumavkách vznikl tento Malý chemický bestiář. Chemie totiž nepatří jen do tabulek a učebnic. A proto se chemické prvky vydaly do světa, kde zažívají všeliká dobrodružství ale i všední trápení. Napsala a režíruje: Tereza Verecká. Natočeno v roce: 2020. Účinkují: Marie Štípková, Marek Mikulášek, Vojtěch Bartoš, Diana Toniková.'
