- eventId: 1351333
  start: 2026-10-01T13:00:00Z
  stop: 2026-10-01T14:00:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Markéta Vítková, spisovatelka, ilustrátorka. Věděli jste, že kromě plazení hadi také šplhají, plavou a někteří dokonce plachtí vzduchem? A to prosím bez nohou a rukou! Říká se, že na svatého Václava se hadi ukládají ke spánku, tak my je uložíme s autorkou nové krásné hadí encyklopedie "SSS Hraví hadi" Markétou Vítkovou. Repríza pořadu.'
