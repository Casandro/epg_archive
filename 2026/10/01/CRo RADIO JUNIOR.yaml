  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Martin Hlubocký, herec. Martin vystudoval Vyšší odbornou školu hereckou a momentálně ho můžete vidět na mnoha pražských scénách. Hraje třeba se společností 3D Company v Žižkovském divadle Járy Cimrmana nebo působí v Metropolitním divadle Praha a Spolku Šprajc. Mnohá představení, kde ho můžete vidět, jsou i pro děti. Na co nás Martin pozve? A co má na divadle nejradši? Moderuje Eva Sinkovičová.
