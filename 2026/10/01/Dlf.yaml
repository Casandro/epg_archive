  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\n80 Jahre Nürnberger Prozesse: Warum nur drei Juden als Zeugen aussagten\nAm 1. Oktober 1946 endeten die Nürnberger Prozesse. Dabei mussten sich 24 von den Alliierten aufgespürte Spitzenköpfe des Nazi-Regimes verantworten - und mehr als 100 Zeugen wurden gehört. Allerdings waren nur drei von ihnen Juden, obwohl die Nazis einen Völkermord an ihnen verübt hatten - den Holocaust.\n\nZum Gehorsam gezwungen: Katholische Erziehungsheime für Frauen im Franco-Regime\nSie waren eine der langlebigsten Einrichtungen der Franco-Diktatur in Spanien: In nationalkatholischen Umerziehungsanstalten wurden junge Frauen eingesperrt, drangsaliert und gequält. Zehn Jahre nach Francos Tod schlossen die letzten Heime, das Leid der Opfer erkannte die Regierung erst im vergangenen Jahr an. Nun bringt der Spielfilm ?Bitte für uns? (Ruega por nosotros) von Regisseur Daniel Monzón die Geschichten der Frauen auf die Leinwand.\n\nDrusen auf den Golanhöhen: Immer mehr werden israelische Staatsbürger\nAuf den von Israel besetzten Golanhöhen vollzieht sich ein Wandel: Jahrzehntelang fühlten sich viele der dort lebenden Drusen Syrien zugehörig und lehnten die israelische Staatsbürgerschaft ab. ..."
