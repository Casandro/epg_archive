  title: MareTV
  subtitle: Die Halbinsel Fischland-Darß-Zingst. Naturparadies an Ostsee und Bodden
  description: 'Brandung trifft auf Boddengewässer, Steilufer auf Sandstrände, Küstenurwald auf Schilfgürtel: Die 45 Kilometer lange Halbinsel Fischland-Darß-Zingst zwischen Rostock und Stralsund bietet großartige Landschaften. Die Boddeninsel Großer Kirr darf niemand betreten, sie steht unter Naturschutz. 300 Jungrinder halten hier im Auftrag des Naturschutzes Gras und Schilf kurz. Doch rechtzeitig vor den Herbststürmen müssen die Tiere runter von der Insel, denn der Kirr wird in den Wintermonaten überspült. Thomas Möhring, Leiter der Tierproduktion auf Gut Darß, und seine Helferinnen und Helfer haben die heikle Aufgabe, eine störrische Horde Vieh per Fähre ans Festland überzusetzen.'
