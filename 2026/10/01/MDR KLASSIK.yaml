  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Adrien François Servais: Fantaisie et Variations brillantes sur la Valse de Schubert, op. 4 (Wen-Sinn Yang, Violoncello; Münchner Rundfunkorchester: Terje Mikkelsen); Max Bruch: Konzert B-Dur (Simone Zgraggen, Katharina Schmitz, Violine; Lars Anders Tomter, Viola; Xenia Jankovic, Violoncello; Mandelring Quartett); Antonín Dvorák: Sinfonie Nr. 8 G-Dur (Symphonieorchester des Bayerischen Rundfunks: Mariss Jansons); Johannes Brahms: "Elf Zigeunerlieder", op.

    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Adrien François Servais: Fantaisie et Variations brillantes sur la Valse de Schubert, op. 4 (Wen-Sinn Yang, Violoncello; Münchner Rundfunkorchester: Terje Mikkelsen); Max Bruch: Konzert B-Dur (Simone Zgraggen, Katharina Schmitz, Violine; Lars Anders Tomter, Viola; Xenia Jankovic, Violoncello; Mandelring Quartett); Antonín Dvorák: Sinfonie Nr. 8 G-Dur (Symphonieorchester des Bayerischen Rundfunks: Mariss Jansons); Johannes Brahms: "Elf Zigeunerlieder", op. 103 (Justus Zeyen, Klavier; Chor des Bayerischen Rundfunks: Howard Arman); Saverio Mercadante: Klarinettenkonzert B-Dur (Rupert Kreipl, Klarinette; Münchner Rundfunkorchester: Peter Falk)

    2.03  Das ARD-Nachtkonzert (II)

    Franz Liszt: Klavierkonzert Nr. 2 A-Dur (Nareh Arghamanyan, Klavier; Rundfunk-Sinfonieorchester Berlin: Alain Altinoglu); Wolfgang Amadeus Mozart: "Così fan tutte", Harmoniemusik (Zefiro); Werner Haentjes: "Offenbachiana" (Kölner Rundfunkorchester: Jan Stulen); Mélanie Bonis: Klavierquartett B-Dur, op. 69 (Mozart Piano Quartet); Modest Mussorgskij/Boris Stokowski: "Boris Godunow", Symphonische Synthese (Bournemouth Symphony Orchestra: José Serebrier)

    4.03  Das ARD-Nachtkonzert (III)

    Franz Benda: Flötenkonzert e-Moll (Laurence Dean, Flöte; Hannoversche Hofkapelle); Joseph Haydn: Streichquartett F-Dur, op. 50, Nr. 5 (Angeles String Quartet); Hugo Alfvén: "Eine Legende der Skerries" (Island Symphonie Orchester: Petri Sakari)

    5.03  Das ARD-Nachtkonzert (IV)

    Francisco Antonio de Almeida: "La Giuditta", Sinfonia (Concerto Köln: René Jacobs); Franz Danzi: Sinfonia concertante B-Dur, Allegro moderato, op. 41 (James Galway, Flöte; Sabine Meyer, Klarinette; Württembergisches Kammerorchester: Jörg Faerber); Camille Saint-Saëns: "Introduction et Rondo capriccioso", op. 28 (Lidia Baich, Violine; Symphonieorchester des Bayerischen Rundfunks: Lorin Maazel); Leopold Mozart: Sinfonie D-Dur (London Mozart Players: Matthias Bamert); Ignaz Moscheles: Klavierkonzert Nr. 5 C-Dur (Tasmanian Symphony Orchestra, Klavier und Leitung: Howard Shelley); Franz Krommer: Flötenquartett D-Dur, op. 93 (Andreas Blau, Flöte; Christoph Streuli, Violine; Ulrich Knörzer, Viola; David Riniker, Violoncello)
