  title: Wild Ones - Junge Helden - Episode 5
  subtitle: Wild Ones - Junge Helden - Episode 5
  description: Motocross-Superstar Ken Roczen ist zurück in Kalifornien, um sich auf die neue AMA Supercross Saison vorzubereiten. Bevor es mit dem harten Training losgeht, besucht ihn sein bester Kumpel Tim Koch aus Deutschland und die beiden legen einen entspannten Tag mit Basketball spielen und Hot Tub ein. Kitesurferin Susi Mai verlässt die Strände Mauis und fliegt nach Tokio. Hier trifft sie ihren Freund, den britischen Rennfahrer James Rossiter, um ihn bei einem Rennwochenende in Japan zu begleiten. Freerunner Jason Paul fährt nach Köln ins TV Total-Studio. Sein Freerun-Video, das er vor ein paar Wochen in Hamburg gedreht hat, war mit über 6 Millionen Klicks auf YouTube so erfolgreich, dass es Jason eine Einladung von Stefan Raab eingebracht hat. Wakeboarder Dominik Gührs freut sich nach seinem Istanbul-Shooting auf den Schweinsbraten bei Mama zuhause - und für Freeskier Bene Mayr startet die Contest-Saison. Er fliegt nach London, um an seinem ersten Wettbewerb seit zwei Jahren teilzunehmen. Dort wartet eine riesige Überraschung auf ihn. DE 2013
- eventId: 1323342
  start: 2026-10-01T01:35:00Z
  stop: 2026-10-01T02:05:00Z
  title: Wild Ones - Junge Helden - Episode 6
  subtitle: Wild Ones - Junge Helden - Episode 6
  description: Ken Roczen, jüngster Motocross-Weltmeister aller Zeiten, trainiert in Kalifornien härter denn je für seine zweite AMA Supercross Saison. Kitesurferin Susi Mai feiert mit ihrem Freund James ihren Jahrestag mit einem Bummel durch Tokio. Freeskier Bene Mayr wird von seinem Kumpel Mitja mit einem genialen Trip durch London überrascht. Freerunner Jason Paul dreht mit seinen Freunden von Team Farang ein Freerun-Video über den Dächern von Bangkok - und Wakeboard-Weltmeister Dominik Gührs fliegt auf die Philippinen zur Wakeboard WM. Er will an diesem alles entscheidenden Wochenende seinen Titel verteidigen. Ausgerechnet kurz vor den Qualifikations-Läufen wird Dominik krank. DE 2013
- eventId: 1323343
