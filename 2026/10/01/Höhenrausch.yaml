  title: Symphonie auf Skiern
  subtitle: Symphonie auf Skiern
  description: Eine abenteuerliche Skitour von zwei Schwestern, die den Spuren ihres Vaters über die unberührte Naur von Neuseeland folgen. Vor 30 Jahren machte sich Gottlieb Braun-Elwert zu einer unglaublichen Expedition auf. Er durchquerte die gewaltigen Gletscher der Südalpen, die sich über eine Länge von 40 Kilometern und eine Höhe von 4000 Metern erstrecken, vom Herzen der Südinsel bis zu der Westküste in nur 18 Stunden. Eine Reise voll atemberaubender Schönheit, grenzenloser Freiheit, wunderschönen Ausblicken und der Herausforderung, sich mit der ungebändigten Wildnis auseinanderzusetzen. Er nannte die Reise "Symphonie auf Skiern". Jetzt beginnen seine Töchter Carla, Elke und ein kleines Team von Abenteurern die gleiche Tour. Dieser Film ist eine Hommage an ihren Vater, der das Gefühl von Liebe und ein Zuhause in den Südalpen von Neuseeland fand.  DE 2017
