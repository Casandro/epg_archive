  title: 'Rosamunde Pilcher: Płomień miłości 1 (odc. 49)'
  subtitle: Hanna i Peter od trzydziestu lat tworzą szczęśliwe małżeństwo, co pięć lat odnawiając przysięgę w gronie najbliższych. Na tegoroczną uroczystość nie chce jednak przyjechać Geraldine, siostra Hanny.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Flamme der Liebe
    DE, 2003
    Reżyseria: Michael Steinke
    Występują: Florentine Lahme, Angela Roy, Jens Knospe, Loni von Friedl, Gerhart Lippert, Simone Hanselmann
    Hanna i Peter są szczęśliwym małżeństwem już od trzydziestu lat. Co pięć lat, z potrzeby serca, odnawiają swoją przysięgę małżeńską i z tej okazji zapraszają do Castlewood rodzinę oraz przyjaciół. Jedynie Geraldine, najmłodsza siostra i jedyna krewna Hanny, stanowczo odmawia przyjazdu. Magnus, syn Hanny i Petera, robi wszystko, by nakłonić ciotkę do odwiedzin w Castlewood. Udaje mu się to dzięki drobnemu kłamstwu.
  ageRating: 12
  genre:
  - '22'
- eventId: 1173765
  start: 2026-10-01T19:50:00Z
  stop: 2026-10-01T21:35:00Z
  title: Rosamunde Pilcher - Królowa nocy 1 (odc. 60)
  subtitle: Po śmierci męża Lilly Brown postanawia zacząć wszystko od nowa. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie przy wsparciu ukochanej ciotki Valerie otwiera wymarzony butik.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Königin der Nacht
    AT,DE, 2005
    Reżyseria: Karsten Wichniarz
    Występują: Leonore Capell, Thomas Scharff, Christian Kohlund, Olivia Pascal, Barbara Lanz, Claudius Zimmermann
    Lilly Brown po śmierci męża postanawia całkowicie odmienić swoje życie. Opuszcza Londyn i przeprowadza się do Kornwalii, gdzie z pomocą ukochanej ciotki Valerie spełnia swoje marzenie o prowadzeniu własnego sklepu. W dniu otwarcia jej butik staje się niespodziewanym schronieniem dla młodego mężczyzny uciekającego przed natarczywymi dziennikarzami i fanami. Lilly nie wie, że jest nim John Fox - słynny angielski zawodnik polo.
  ageRating: 12
  genre:
  - '22'
