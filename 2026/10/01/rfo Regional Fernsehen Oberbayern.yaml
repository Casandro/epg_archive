  description: 'Vor dem zwölften Spieltag der Regionalliga Bayern lieferten sich TSV Buchbach und die SpVgg Unterhaching im Nachholspiel des neunten Spieltags ein Topduell Erster gegen Vierter, bei dem es um Buchbachs Serie und Hachings Sprung auf Rang zwei ging. +++ Im Mangfallpark schrieb Kool And The Gang beim Sommerfestival Rosenheim ein besonderes Kapitel: Gründungsmitglied und Bassist Robert Kool Bell (Jahrgang 1950) lieferte seit 1964 Funk, Soul und Disco mit Groove und Tanzlaune. +++ Eine Kaltfront zieht zum Start in den Oktober im Westen herein und bringt Regen, örtlich Gewitter und kaum 20 Grad. Am Freitag ziehen letzte Schauer ostwärts und anschließend setzt sich wieder Hochdruckeinfluss durch. Zum Wochenende steigt dann die Nebelgefahr an.'
