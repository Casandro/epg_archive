  description: 'In Rosenheim löste der Fund einer 250-Kilo-Fliegerbombe bei Bahnarbeiten einen Großeinsatz aus: 1500 Menschen wurden evakuiert, Straßen und Bahnstrecke gesperrt, am Abend entschärfte der Kampfmittelräumdienst den Blindgänger und transportierte ihn ab. +++ Obing stoppt das geplante Fernwärmeprojekt: Trotz Förderchancen lehnte der Gemeinderat wegen hoher Kosten und Risiken ab, Proteste blieben aus; vorerst müssen die Bürger selbst heizen, doch bei einem tragfähigen Konzept könnte Fernwärme wieder Thema werden. +++ Ab morgen sinkt die Energiesteuer auf Benzin und Diesel für drei Monate, rechnerisch um bis zu 17 Cent je Liter, doch weil alte Bestände und die Preisstrategie der Konzerne wirken, lohnt sich weiter der Vergleich per App und nach Uhrzeit.'
- eventId: 1059141
  start: 2026-10-01T13:10:00Z
  stop: 2026-10-01T13:20:00Z
  title: Süd Journal vom 30.09.2026 (Wh.)
  subtitle: Nachrichten kompakt +++ Thermentipp Herbstzeit ist Saunazeit +++ Festgottesdienst 100 Jahre Rupertuskirche Freilassing +++ Neue Kita für Traunreut-Traunwalchen
  description: "Die Nachrichten kompakt am 30. September mit den folgenden Themen:\n\n- Ausweichverkehr in Neubeuern sorgt für Probleme\nIn Neubeuern sorgt der zunehmende Ausweichverkehr von der A8 und der A93 für Probleme. Bürgermeister Christoph Schneider fordert deshalb mehr Kontrollen und eine bessere Beschilderung. Besonders Lastwagen bereiten Schwierigkeiten: Seit Samstag sind bereits dreimal LKWs an den engen Markttoren hängen geblieben. Schneider fordert deshalb unter anderem englischsprachige Hinweise. Auch die Navigationssysteme sieht er als Problem, wenn Lastwagen auf ungeeignete Straßen durch den Ort geführt werden.\n\n- Ohne Führerschein unterwegs - Mann wird festgenommen \nEin 49-jähriger Österreicher wurde bei einer Kontrolle an der A93 bei Kiefersfelden festgenommen. Der Grund: Er war ohne Führerschein unterwegs. Bei der Überprüfung stellten die Beamten außerdem fest, dass gegen ihn zwei Haftbefehle vorlagen - wegen Betrug und Diebstahls. Insgesamt hatte er Justizschulden von mehr als 11.000 Euro, die er nicht bezahlen konnte. Deshalb muss er nun eine Ersatzfreiheitsstrafe von rund sieben Monaten antreten. Die Bundespolizei brachte ihn in die Justizvollzugsanstalt Bernau. +++ Wenn die Tage kürzer werden und die Temperaturen fallen, steigt das Erkältungsrisiko, doch Saunieren kann das Immunsystem stärken, wie die Rupertustherme in Bad Reichenhall betont: Im Herbst ist Saunazeit. +++ Am 24. Mai 1926 weihte Erzbischof Michael von Faulhaber die neu errichtete Rupertuskirche in Freilassing, die heuer ihr 100-jähriges Bestehen feiert, beim Patroziniumsgottesdienst mit Weihbischof Rupert Graf zu Stolberg, der sie als steinernes Glaubenszeugnis würdigte. +++ Traunreut hat in Traunwalchen die Kita Mariä Geburt eröffnet: Für rund 100 Kinder, darunter 13 Krippenplätze, wurden für sechs Millionen Euro neue Räume und Außenanlagen geschaffen, die der Nachwuchs bei der Einweihung singend und spielend feierte."
