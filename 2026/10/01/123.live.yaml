  title: Alle Kätzchen naschen gern
  subtitle: Alle Kätzchen naschen gern
  description: Auf Schloss Portillon streiten ein Adeliger und ein Offizier um das Eigentum. Jeder hat seinen eigenen Teil des Schlosses eingerichtet und es gibt eine rote Linie im Hof, die keiner überschreitet. Beide Herren begehren die Wäschermädel Babette und Monique. Der Graf verführt Babette, während der Oberst Monique begehrt. Ein Plan entsteht, um die Wäschermädchen zu erobern. Hochzeitsverhandlungen beginnen, doch nächtliche Verwicklungen verwirren alles. Ge 1969
