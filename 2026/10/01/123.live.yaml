  title: Das große Heintje-Wunschkonzert
  subtitle: Das große Heintje-Wunschkonzert
  description: 'In dieser Folge "das große Wunschkonzert" geht es um den Kinderstar Hein Simons, alias Heintje. Klein Heintje nahm schon mit 11 Jahren an einem Talentwettbewerb teil und da wurde der niederländische Musiker und Produzent Addy Kleijngeld auf Heintje aufmerksam. Er nahm den Jungen unter Vertrag und noch im selben Jahr wurde in Amsterdam die erste Platte von Heintje auf Niederländisch aufgenommen, bald darauf wurde aus dem Lied "Mamma" eine Version für Heintje produziert: der Durchbruch! Ge 2015'
