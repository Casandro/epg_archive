  title: Mitreden! Deutschland diskutiert
  description: "19:00 \nDeutschland Nachrichten\n\n19:03 - 20:45\n\"Mitreden! Deutschland diskutiert\" -  \"TAG DER DEUTSCHEN EINHEIT\": Was hält uns zusammen?\nAm Samstag feiern wir zum 36. Mal den Tag der Deutschen Einheit. Doch von einer Einheit scheint unser Land weit entfernt. In den vergangenen Jahren sind Unterschiede zwischen Ost und West vor allem mit Blick auf die Wirtschaft wieder stärker deutlich geworden. Andererseits sind da Gefühle: Das Knattern von Trabbi und Simson klingt wie Musik in den Ohren vieler. Unsicherheit ruft die Sehnsucht nach \"der guten alten Zeit\" hervor. Und dann sind da die Wahlergebnisse der AfD. Darüber wollen wir in dieser Sendung reden und wissen: Was hält uns zusammen? Diskutieren Sie mit!\nModeration: Sabine Dahl \n\nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html"
