  title: SWR Kultur - Das Wissen
  subtitle: Sprachstörungen behandeln - Wem Logopädie nützen kann
  description: |-
    Von Mareike Gries
    Wer eine Logopädin sucht, muss mit langen Wartezeiten rechnen. Das liegt nicht nur an der steigenden Zahl von Kindern, bei denen eine Sprachentwicklungsstörung festgestellt wird. Auch unsere alternde Gesellschaft trägt dazu bei, denn alle Altersklassen können von Logopädie profitieren. Etwa der Säugling mit einer Fütterstörung oder der Hochbetagte, dem - zum Beispiel wegen Demenz - die Worte fehlen. Studien zeigen: Logopädie kann verschiedene Krankheitsbilder nicht immer heilen. Aber sie kann die Kommunikationsfähigkeit aufbauen oder erhalten und damit die Lebensqualität verbessern.
