  title: SWR Aktuell Langstrecke
  description: "14:00\nPlusminus - Humanoide Roboter: Wird das Deutschlands neue Autoindustrie?\nSchneller als Usain Bolt, stärker als viele Fachkräfte: Sind Humanoide Roboter der Hoffnungsträger für den Industriestandort Deutschland?\nHumanoide Roboter sollen Fachkräfte entlasten und Unternehmen effizienter machen. Doch noch ist offen, welche Hersteller sich durchsetzen werden. Für viele Investoren gilt die Technologie als der nächste Milliardenmarkt nach dem KI-Boom. Aber kann Deutschland mit den USA und China mithalten? Könnten humanoide Roboter sogar das Potenzial haben, zur nächsten Autoindustrie zu werden? Und welche Chancen hätte eine deutsche Produktion auf dem Weltmarkt?\nVon Anna Planken und David Ahlf\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/ \n\n14:30\nDie Justizreporter*innen\nChance oder Cringe? Kann die Justiz Social Media?\nImmer mehr Gerichte sind mit eigenem Social-Media-Kanal auf TikTok, Instagram und Co. vertreten. Sie wollen ihre Arbeit transparenter machen und Einblicke in den Rechtsstaat geben. Auch viele Justizministerien fördern inzwischen aktiv mehr Kommunikation über Social Media. Die Justiz soll sichtbarer werden. Doch gelingt die eigene Ansprache über die sozialen Medien? Wird dadurch mehr Vertrauen geschaffen oder geht es eher verloren? Muss die Justiz selbst in sozialen Medien ihre Urteile erklären bevor es andere tun? Die Justizreporter*innen Fabian Töpel und Alexandra Tadey sprechen mit Dr. Marc Petit, er ist Vorsitzender Richter am Landgericht Lübeck und leitet die Zentrale Online-Redaktion der Justiz Schleswig-Holstein. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-justizreporter-innen/urn:ard:show:8e3e202c41bc9ace/"
