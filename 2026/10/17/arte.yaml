  title: Wunderwelt Seegraswiesen - Klimaretter, Kinderstube, Küstenschutz
  subtitle: Deutschland 2023
  subtitled: true
  description: "Seegras speichert nicht nur die größten Zuckervorräte unseres Planeten - diese Pflanze schützt weltweit die Strände vor Erosion und ist mit ihren fast 80.000 Jahre alten Seegraswiesen das vielleicht älteste Lebewesen der Erde. Seegraswiesen sind Kinderstube und Lebensraum für unzählige Arten, sie reinigen das Meerwasser wie eine gigantische Kläranlage. Mit diesen Superkräften kann Seegras helfen, die Klimaerwärmung zu verlangsamen. \nDie Dokumentation begleitet führende Seegrasforscher vom Mittelmeer an die Ostsee."
