  title: Nevidljivi ljudi
  subtitle: Emisija o radiju i radiofonskom stvaralaštvu. Približava se ceo vek od rađanja akustičkog medija, koji i na našim prostorima ima relativno dugu tradiciju.
  description: Emisija o radiju i radiofonskom stvaralaštvu. Približava se ceo vek od rađanja akustičkog medija, koji i na našim prostorima ima relativno dugu tradiciju. Jedna od rubrika u emisiji posvećena je upravo etapama u razvoju radija, posebno onim manje poznatim. Deo pažnje usmeren je ka savremenim tehničkim usavršavanjima (digitalni radio, RDS, satelitski radio), ali i fenomenu ogromnog umnožavanja specijalizovanih kanala svuda u svetu, od all news stations do stanica profilisanih isključivo za etničke ili seksualne manjine. Centralni deo ovog nedeljnika je rubrika Iz istorije radija, u kojoj se razgovara sa gostima koji su u jednom delu života ili tokom cele karijere bili "nevidljivi ljudi". Emisija donosi i portrete svih značajnijih novinara radija i čuva njihove glasove.
