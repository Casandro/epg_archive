  description: Ein Abriss des Balzerteam Österreich über das Spinnfischen mit kleinen Kunstködern im Sommer. In den frühen Morgenstunden sind während der Hitzeperioden kleinere Hechte, Barsche, Zander und auch Rapfen zu fangen. Spinnangeln voll von Überraschungen. AT 2019
- eventId: 795422
  start: 2026-10-17T05:55:00Z
  stop: 2026-10-17T06:21:00Z
  title: Flussgeflüster - Kapitale Karpfen aus dem Strom
  subtitle: Flussgeflüster - Kapitale Karpfen aus dem Strom
  description: Sie sind mystisch und oft schwierig zu befischen. Deutsche Flüsse können launisch sein. Flüsse sind oft durch geringe Fischdichten geprägt. Befolgt man jedoch ein paar einfache Regeln, wird man am Fluss regelmäßig und nachhaltig erfolgreich sein. Wie es mir gelungen ist, auf einer Session von nur einer Nacht einen Fisch mit weit über 20kg am Fluss zu fangen? Das zeige ich dir in meinem Film Flussgeflüster.  NL 2022
- eventId: 795434
  start: 2026-10-17T06:25:00Z
  stop: 2026-10-17T06:51:00Z
  title: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  subtitle: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  description: Schwarzbarsche sind zum einen sehr neugierig, können aber auch extrem zickig und vorsichtig sein. Darum ist es wichtig zu wissen, wie sie gerade ticken, um den maximalen Fangerfolg zu erzielen. Je nach Tagesform beißen sie sehr gut auf geleierte Köder wie z. B. einen Propbait. Manchmal jedoch ist ein unregelmäßiger Lauf wie der des Poppers unschlagbar. Um dies herauszufinden, versuchen wir alle gängigen Modelle der Topwaterköder und stellen uns die frage, welcher wird die meisten und größten Fische bringen? DE 2022
