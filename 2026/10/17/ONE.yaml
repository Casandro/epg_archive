  description: |-
    Ausstrahlung auch im englischen Originalton

    Murdoch, Dr. Ogden und Constable Jackson untersuchen den Fund eines toten Mannes in einem Boot, dessen Gesicht Spuren von Lippenstift aufweist. Eine Karte mit einer provokanten Einladung deutet darauf hin, dass das Opfer zu einem heimlichen Treffen gelockt wurde. Die Witwe lehnt den Verdacht auf Untreue ab, doch das Gespräch mit einem Geschäftspartner bestätigt die Affäre.
    Ogden stellt bei der Autopsie fest, dass der Mann durch Zyanidvergiftung starb, vermutlich über den Lippenstift verabreicht. Die Ermittlungen führen zu einem Kosmetikladen.
