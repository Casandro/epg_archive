  title: Planet Weltweit - Polen,Winter in den Waldkarpaten
  subtitle: Planet Weltweit - Polen,Winter in den Waldkarpaten
  description: |-
    Die polnischen Vorkarpaten sind eine fast vergessene, verwunschen anmutende Region. Zwischen Bergen und Wäldern stehen immer wieder alte orthodoxe Holzkirchen. Die wenigen hier ansässigen Menschen sind oft ganz besondere Lebens- und Überlebenskünstler. Egal ob Musiker, Ikonenmalerin oder Glas-Handwerker.
    Die Woiwodschaft Karpatenvorland ist im Vergleich zum polnischen Landesdurchschnitt eher dünn besiedelt. Viele Bewohner zogen in den 1960er und 70er Jahren hierher. In der Einsamkeit der Wälder war der Staatskommunismus weniger spürbar. Heute ist es eine der ärmsten Regionen der Europäischen Union, und die Menschen ziehen wieder fort, vor allem die Jugend sieht wenig Perspektiven. Doch nahe den Grenzen zur Slowakei und der Ukraine floriert eine kleine Ikonen-Werkstatt.

    Das Karpatenvorland hat im Laufe seiner Geschichte viele Herrscher erlebt. Polnische Könige, Habsburger Kaiser, deutsche Besatzer, sowjetische Diktatoren. Was durch die Jahrhunderte hindurch Bestand hatte, war der starke Glaube seiner Bewohner. Die orthodoxen Bewohner vom Volksstamm der Lemken schlossen sich nie der russisch-orthodoxen Kirche an, sondern blieben griechisch-orthodox oder griechisch katholisch. Lemken leben inzwischen nur noch wenige im Karpatenvorland. Und doch haben sie viele alte Holzkirchen hinterlassen, die wie verzaubert in den Wäldern stehen und alle Veränderungen überdauert haben. Neben den Ikonen und den Kirchen steht die Region aber vor allem für die Tradition der Glasfertigung. Zwar befindet sich die großindustrielle Glasproduktion seit längerem im Niedergang - dafür aber blüht die Glaskunst im Kleinen. Das "Glasstudio Habrat" startet mit seinen kreativen Entwürfen gerade voll durch. DE 2015
