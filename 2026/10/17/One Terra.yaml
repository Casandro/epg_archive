  title: Planet Weltweit - Idjwi - Afrikas vergessene Insel
  subtitle: Planet Weltweit - Idjwi - Afrikas vergessene Insel
  description: |-
    Zwischen Ruanda und der Demokratischen Republik Kongo, inmitten des Kiwu-Sees, liegt die Insel Idjwi. Obwohl sie seit Jahren von Krieg und Leid umgeben sind, blieben die Insulaner stets von Gewalt verschont. Idjwi wurde so zu einem sicheren Zufluchtstort für Zehntausende. Den Frieden begreifen die Menschen auf Idjwi daher als höchstes Gut - auch wenn ihr Alltag von Armut und Mangel geprägt ist. Der alte Frachtkahn Nyamizi ist die einzig funktionierende Verbindungslinie zwischen der Insel und dem Festland. Nur mit diesem Schiff können die Insulaner ihre Ernte auf den Festlandmärkten verkaufen und Verbindung zur Außenwelt aufnehmen. In der Reportage wird der Frachter auf seinen Fahrten zwischen der vergessenen Insel und dem kongolesischen Festland begleitet.

    Zweimal die Woche legt der alte Frachtkahn Nyamizi von der Insel Idjwi in Richtung Festland ab. Schon mitten in der Nacht versuchen Bauern und Händler mit großen Bündeln einen Platz auf dem Schiff zu ergattern. Sie wollen ihre Waren auf dem Markt von Bukavu verkaufen und sich im Gegenzug mit Lebensmitteln versorgen. Denn auf Idjwi gibt es nur Ananas-, Maniok- und Bananenplantagen. Kapitän Bosco betreibt die einzige Fährverbindung zwischen der Insel und dem Festland. Das Schiff ist sein Leben - nicht nur, weil er mit der Arbeit seine fünf Kinder, Eltern und Geschwister ernährt. Er weiß auch, dass die Menschen auf der Insel ohne die Nyamizi von der Außenwelt abgeschnitten wären. Langsam versucht die kleine vergessene Insel, auf sich aufmerksam zu machen und Kontakte zu knüpfen - so wie mit Paulin Polepole, der für die kongolesische Hilfsorganisation AJAS regelmäßig mit der Nyamizi vom Festland herüberkommt, um Kriegsflüchtlinge im Gemüseanbau zu unterrichten und Saatgut zu bringen. Polepole kümmert sich auch um die Schulbücher von Waisenkindern und um bessere Arbeitsbedingungen in der Coltan-Mine von Idjwi.  DE 2009
