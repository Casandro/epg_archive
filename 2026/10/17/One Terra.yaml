  title: Planet Weltweit - Ein Dorfladen reist durch Lettland
  subtitle: Planet Weltweit - Ein Dorfladen reist durch Lettland
  description: "Lettgallen ist ein abgelegenes, ländliches Gebiet im Südosten Lettlands. Eine fast vergessene Region, in der die Zeit stehen geblieben zu sein scheint. Im \"Land der blauen Seen\", wie Lettgallen auch genannt wird, sind die Wege weit, es gibt kaum öffentliche Verkehrsmittel und nur wenige Läden, in denen es die Dinge des täglichen Lebens zu kaufen gibt. So haben die meisten jungen Leute diesen östlichen Winkel der EU schon längst verlassen. Geblieben sind die Alten - und diejenigen, die sich auf findige Weise durchschlagen, so wie Janis Cukmachs. Er hat einen klapprigen roten Kleinbus in einen gut bestückten Dorfladen umfunktioniert. Damit fährt er über die Dörfer, um Brot, Fische oder auch Gummistiefel unter die Leute zu bringen. Die Dokumentation hat ihn dabei begleitet. \n\nVor zehn Jahren hat Janis Cukmachs damit begonnen Zahnpasta, Brot, und andere Lebensmittel auf dem Land zu verkaufen. Selbst Sonderbestellungen wie Grabsteine oder Särge hat er den Kunden schon gebracht. Dreimal die Woche fährt er raus, egal ob es stürmt oder schneit. \"Alle wissen, dass ich komme, ich bin wie die Uhr\", sagt Janis und lächelt. Dabei stand der gelernte Maschinist zunächst vor dem Nichts, als das Milchkombinat, in dem er 25 lange Jahre gearbeitet hatte, in den 1990er Jahren dichtmachte. Heute ist er mit seinem Dorfladen auf Rädern eine Institution. Die Menschen kennen Janis, verlassen sich auf ihn, geben Bestellungen auf und fragen nach dem Neusten aus der Gegend. Der Weg übers Land ist alles andere als einfach: Pro Fahrt bewältigt Janis Cukmachs um die 150 Kilometer auf Schotterpisten und Feld- oder Waldwegen. Jede Fahrt ist eine Belastungsprobe für den alten Bus - die Schaltung klemmt schon seit Monaten! Hinzu kommt, dass viele von Janis Kunden mit einer kleinen Rente auskommen müssen, die noch dazu unregelmäßig ausgezahlt wird - Schulden sind damit an der Tagesordnung. DE 2007"
