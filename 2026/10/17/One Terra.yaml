  title: Planet Weltweit - Saphir-Fieber auf Madagaskar
  subtitle: Planet Weltweit - Saphir-Fieber auf Madagaskar
  description: |-
    Noch vor wenigen Jahren war Ilakaka ein unbedeutendes Dorf, so wie es viele in Madagaskar gibt. An der einzigen, unbefestigten  Straße reihten sich die Lehmhütten der Rinderzüchter, Fremde kamen nur selten vorbei. Heute dreht sich in Ilakaka alles um  Edelsteine, die Stadt hat schätzungsweise 30.000 Einwohner und täglich werden es mehr. Seit vor acht Jahren ein Hirte im Staub einen glitzernden Saphir fand und über Nacht ein reicher Mann wurde, kommen täglich Busladungen neuer Glücksritter, in der Hoffnung, ein Stück vom Reichtum abzubekommen.

    Bleiben wolle er nicht in dieser Stadt, sagt Nava Razafimaneky, und es ist ihm nicht zu verübeln: Ilakaka ist kein Ort, den sich ein Familienvater aussucht, um mit seiner schwangeren Frau und zwei Kindern ein neues Leben zu beginnen. Seit im roten Staub der Savanne vor acht Jahren Saphire gefunden wurden, erlebt das Dorf einen riesigen Boom. Anfangs kamen die Schürfer, dann Saphirhändler und Lebensmittelverkäufer, schließlich folgten Barbesitzer und Prostituierte. Zwischenzeitlich galt  Ilakaka als eines der gefährlichsten Pflaster Madagaskars - bis die Regierung einen Polizeiposten eröffnete. Bis heute  strömen die Glücksritter zahlreich nach Ilakaka - angezogen von den bis zu dreißig Meter tiefen Steinbrüchen, in denen  jeder hofft, auf Saphire zu stoßen. Auch Nava Razafimaneky ist in der Hoffnung auf einen großen Fund gekommen. In seinem  Heimatdorf lebte er als Bauer, konnte seine Familie kaum ernähren. Sein Ziel ist es, in zwei Jahren so reich zu sein, dass  er sich eine Herde von fünfzig Rindern kaufen und als reicher Mann in sein Dorf zurückkehren kann. Mit der Hilfe seines  Onkels Rengase findet die junge Familie eine Hütte, in der sie anfangs leben kann. Nava darf in einem alten Steinbruch sein  Glück zu versuchen, nur mit einer Schaufel und seiner Muskelkraft. DE 2006
