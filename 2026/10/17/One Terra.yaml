  title: Planet Weltweit - Die Polarbahn
  subtitle: Planet Weltweit - Die Polarbahn
  description: "Die Polarbahn auf der sibirischen Halbinsel Jamal bildet die Lebensader für die gigantische Erdgasförderstätte Bowanenko. Sie startet hinter dem Polarkreis und verläuft als nördlichste Eisenbahn der Welt über den 70. Breitengrad hinaus. Die 572 km lange Strecke muss um jeden Preis befahrbar bleiben, auch bei meterhohem Schnee und Temperaturen unter minus 50°C.\nDie Halbinsel Jamal liegt im Nordwesten Sibiriens und ragt weit in das Polarmeer hinein - eine karge Heimat für Nomaden und Rentiere. Seit 2011 durchqueren mehrmals pro Woche Züge der Polarbahnlinie die Ödnis der Tundra. Sie starten in der Station Obskaja und fahren 572 km über Permafrostböden und Moore immer weiter nach Norden bis zu den Erdgasfeldern von Bowanenko. Die Bahn ist Eigentum des russischen Energiekonzerns Gazprom, der über die Schienen Material und Mitarbeiter zur Gasförderstätte bringen lässt. Dafür dass die Züge stets verlässlich bei bis zu -60° C im Winter oder 30° C im Sommer rollen, sorgt ein enormer Aufwand an Technik - und der Einsatz des erfahrenen Streckenchefs Alexander Choroschailo. Die Reportage begleitet ihn und seine Kollegen auf dem Schneeräumzug hinter dem Polarkreis.\n\nDer 53-jährige Alexander Choroschailo ist Eisenbahningenieur und Herr über mehrere Schneeräumzüge auf der Jamal-Strecke der sibirischen Polarbahn. Die hochmodernen Züge wurden speziell für extreme Wetterbedingungen in der Arktis entwickelt. Sie sind vor allem im Winter pausenlos zwischen den Stationen im Einsatz. Mit riesigen Schaufelauslegern befreien Alexander Choroschailos Züge Gleise und Weichen von Schnee und Eis. Andere Spezialisten kontrollieren regelmäßig die Lage der Gleise auf dem Permafrostboden. Auch noch so starke Schneestürme und Temperaturschwankungen dürfen die Polarbahn nicht aufhalten, denn sie versorgt Tausende Menschen, die auf den Gasfeldern von Bowanenko arbeiten. Es ist ein permanenter Kampf zwischen Zivilisation und Natur. \n DE 2013"
  ageRating: 6
- eventId: 795384
  start: 2026-10-17T08:10:00Z
  stop: 2026-10-17T09:02:00Z
  title: Planet Weltweit - Überleben am Manila-Express
  subtitle: Planet Weltweit - Überleben am Manila-Express
  description: Der "Manila Express" hat seine Gleise nicht für sich allein. Menschen wie die Fischverkäuferin Editha Jayko leben, wohnen und arbeiten hier. Direkt auf und an den Gleisen haben sie Wohnungen und Verkaufsstände gebaut, betreiben Geschäfte - und überall flitzen die Kinder herum. Mitten durch diese ungewöhnliche Nachbarschaft fährt der Lokführer Cesar Capena täglich seine 30 Kilometer vom Zentrum der Metropole Manila in den Süden und zurück. Und immer hat er Angst im Nacken, jemanden zu überfahren. Cesar Capena kneift die Augen zusammen. Schweißperlen glänzen auf seiner Stirn. 42 Grad Celsius herrschen in dem engen Führerstand seiner Lok, als er die Geschwindigkeit drosselt. Capena ist vorsichtig, denn schon viermal hat sein Zug auf dieser Strecke einen Menschen erfasst. Editha Jayko lebt seit 15 Jahren an den Gleisen der Philippine National Railroad und verkauft Fisch. Als die Hupe der Lok ertönt, und die Eisenräder sich kreischend nähern, räumt sie in Sekundenschnelle ihre Fische zusammen, die Menschen huschen davon. Der Zug rattert vorbei und schon Augenblicke später lassen sich die Leute wieder auf den Schienen nieder. Siebzigtausend Menschen leben in den südlichen Ausläufern der Megacity Manila unmittelbar an den Schienen der einzigen noch existierenden Eisenbahnlinie. Sie haben das öffentliche Land besetzt. Dem Gesetz nach können sie nicht mehr ohne Weiteres verjagt werden, denn sie haben Gewohnheitsrechte. Vor einer Räumung müssten die Behörden ihnen ein Ersatzgelände zuweisen. Im Bankenviertel Manilas soll die Restaurierung der maroden Bahnlinie beginnen. Einige Anwohner sind bereits umgesiedelt worden, doch jetzt, kurz vor den Wahlen, sind die Behörden vorsichtig. Wahlkämpfer machen die Runde, versuchen die Menschen von den Umsiedlungsprogrammen der Regierung zu überzeugen - denn auch die Siedler sind Wähler. Editha Jayko wird ebenfalls zur Wahl gehen. Doch sie glaubt, dass die Bahn auch weiterhin den Rhythmus ihres Lebens vorgeben wird. DE 2004
