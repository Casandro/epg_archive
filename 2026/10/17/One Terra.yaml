  title: Planet Weltweit - Guano - Schatzinseln und Vogeldreck
  subtitle: Planet Weltweit - Guano - Schatzinseln und Vogeldreck
  description: "Millionen Seevögel nisten und brüten auf den Inseln an der Pazifikküste Perus. Der Kot der Tiere ist reich an  Nährstoffen und daher überaus wertvoll: Als Guano-Dünger wird er in die ganze Welt exportiert. Abgebaut wird  die Substanz noch heute per Hand - wie schon vor Jahrhunderten von den Inka. Nur die stärksten Männer ertragen  die harte Arbeit und monatelange Isolation auf den unbewohnten Inseln. Der bestialische Gestank des Vogelkots  setzt ihnen zu,  der Staub verätzt ihre Lungen. Die körperlichen Anstrengungen sind unter diesen extremen  Bedingungen noch schwerer zu ertragen. Wir haben die Guano-Arbeiter begleitet - entstanden ist  ein Portrait über Perus Inseln der Qualen. \n\nDer 44jährige Hildebrando Angeles de la Cruz ist einer der erfahrensten und besten Arbeiter auf den  Guanoinseln. Für ihn und seine Kollegen ist der Dünger ein wahrer Schatz in dem ansonsten armen Andenstaat  Peru. Dank des Vogelkots haben sie  eine regelmäßige und vergleichsweise gut bezahlte Arbeit. Mit einem  durchschnittlichen Monatslohn von etwa 1200 Soles - knapp 325 Euro - verdienen die Arbeiter pro Monat fast das  Doppelte des gesetzlichen Mindestlohnes in Peru. Essen und Unterkunft sind umsonst. \nDoch glücklich ist auf den Inseln kaum jemand. Neben der harten Arbeit nagt die Isolation an Hildebrando und  den anderen Männern. Besonders abends kommt die Sehnsucht nach der Frau und den Kindern auf. Die meisten  Guanoarbeiter stammen nicht von der Küste, sondern aus zwei sehr indigen geprägten Dörfern in den Anden: Caráz  und Yungay. So wie Hildebrandos Frau Angelica geht es vielen in der Region. Die Männer arbeiten an der Küste  oder in Minen in anderen Teilen Perus - die zurückgebliebenen Frauen kümmern sich um Haus, Ernte und Kinder.  In die Berge reist Hildebrando nur alle zwei bis drei Monate - wenn er genug freie Tage angesammelt und Geld  für die Reise gespart habt. Diesmal will Hildebrando nach Hause, um seinen 45. Geburtstag im Kreise seiner  Familie zu feiern.  DE 2011"
  ageRating: 6
- eventId: 795376
