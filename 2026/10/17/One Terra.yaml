  title: Planet Weltweit - China, Im Reich der Musuo-Frauen
  subtitle: Planet Weltweit - China, Im Reich der Musuo-Frauen
  description: "Am Lugu See im Südwesten Chinas lebt das Volk der Mosuo. Bei ihnen bestimmen die Frauen über alles, was wichtig ist: Sie tragen die Verantwortung für die Familie, wählen ihre Liebhaber, vererben Namen und Besitz an die Töchter. Auch die Schutzgöttin der Mosuo ist weiblich: Aus Berggöttin Gemus Tränen, so die Legende, entstand der See, der das Gebiet der Mosuo begrenzt. Die 29-jährige Lamu Mian Zhe ist am See aufgewachsen. Sie wird bald die Führung der Familie von ihrer Mutter übernehmen. \n\nLamu Mian Zhe und ihre Familie sind dieses Jahr vom Pech verfolgt. Sie selbst war schwer krank und musste operiert werden. Für die Behandlung machte sie Schulden. Dann kam ein Cousin bei einem Unfall ums Leben. Probleme, die bei den Mosuo stets die ganze Familie betreffen, vor allem aber die \"Ama\", das weibliche Oberhaupt der Familie. In Lamus Familie trägt ihre Mutter Zhima die Verantwortung und auch die Hauptlast der täglichen Haus- und Feldarbeit. Lamu versucht durch den Verkauf von Webarbeiten die Schulden abzutragen. Währenddessen kümmert sich ihr Bruder Sogna um ihre zwei Töchter, denn bei den Mosuo sind die Onkel für die Erziehung der Kinder zuständig. Der Vater lebt nicht bei ihnen, sondern bei seiner eigenen Mutterfamilie. Sogna wiederum verlässt abends das Haus, um die Nacht bei seiner Lebensgefährtin zu verbringen. \"Wanderehe\" nennen die Mosuo diese Art von Beziehung. Sie kann nur ein paar Nächte dauern, oder aber ein Leben lang.\nZum Volk der Mosuo gehören heute etwa 40.000 Menschen, die in den chinesischen Ausläufern des Himalajas von der Landwirtschaft leben. Auch wenn viele junge Mosuo inzwischen in den größeren Städten arbeiten oder im Tourismus am See, kommen sie zu den Familienfesten wieder zusammen. Eines der wichtigsten Feste im Leben einer Mosuo-Frau ist die Volljährigkeitszeremonie. DE 2012"
  ageRating: 6
