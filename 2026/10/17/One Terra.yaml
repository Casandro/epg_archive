  title: Rund um den Globus - Costa Rica - Leben wie die Faultiere
  subtitle: Rund um den Globus - Costa Rica - Leben wie die Faultiere
  description: Notfall in der Rettungsstation. Ein Ehepaar hat ein Faultier-Baby gefunden und sucht Rat bei Encar Garcia. An der Karibikküste im Osten Costa Ricas hat die Spanierin gemeinsam mit ihrem Ehemann die Rettungsstation für Tiere aller Art aufgebaut. Ihre Arche Noah hat mittlerweile mehr als 120 Bewohner, darunter ein Pferd, Klammer- und Brüllaffen, alle möglichen heimischen Schlangen und Echsen, Spinnen, Wildvögel, Gürteltiere - und Faultiere. Die Faultiere haben das Leben von Encar gehörig auf den Kopf gestellt. Genau darin sind Faultiere nämlich echte Profis. Tagelang baumeln sie rücklings an den Ästen. Nur faul - das sind die urzeitlich wirkenden Tiere ganz und gar nicht! DE 2011
