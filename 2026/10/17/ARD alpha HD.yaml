  title: 'alpha-retro: Bergbauern - Stiefkinder Europas (1968)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ein schöner und gleichzeitig sehr trauriger Film von Otto Guggenbichler aus dem Jahr 1968. Nur scheinbar stammt dieser Film aus alter Zeit, denn die Probleme, unter denen die Bergbauern heute leiden, sind dieselben wie damals. Die Landwirtschaft, wie sie in den Alpenregionen traditionellerweise betrieben wurde, rentiert sich nicht mehr - und der Wintertourismus ist wohl auch an sein Ende gekommen. Was sollen die Bergbauern also tun in ihrer Not?
