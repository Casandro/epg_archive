  title: TELEKOLLEG Französisch
  subtitle: Esquisses de France - Le Canal du Midi et ses villes
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 10 ausgewählte Regionen Frankreichs werden in diesen musisch-akzentuierten Dokumentationen in ihrer geographischen, gesellschaftlichen und kulturellen Besonderheit dargestellt. Ausgewählte Regionen Frankreichs werden in diesen musisch-akzentuierten Dokumentationen in ihrer geographischen, gesellschaftlichen und kulturellen Besonderheit dargestellt. Landschaftliche Schönheiten gehören ebenso dazu wie Zentren wirtschaftlicher Bedeutung, Stätten der bildenden Kunst oder Schauplätze der Literatur. Interviews mit Franzosen verschiedenster Lebensbereiche vermitteln zusätzlich ein authentisches Bild von "Frankreich heute".
- eventId: 1040637
  start: 2026-10-17T05:00:00Z
  stop: 2026-10-17T05:30:00Z
  title: 42 - Die Antwort auf fast alles
  subtitle: Fällt uns der Weltraumschrott auf die Füße?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Alles, was man hochwirft, fällt früher oder später wieder herunter. Das trifft auch auf die vielen Dinge zu, die wir seit Beginn der Raumfahrt ins Weltall befördert haben: Raketen etwa, oder Satelliten - Objekte, die mit der Zeit zu Weltraumschrott werden. Die Gefahr, dass wir auf der Erde von Weltraummüll getroffen werden, ist aber nicht das einzige Problem: Je voller es in den Erdumlaufbahnen wird, desto größer wird dort das Kollisionsrisiko - bis wir eines Tages keine Satelliten mehr nutzen können. Finden wir einen Ausweg, bevor uns der Weltraummüll sprichwörtlich auf die Füße fällt?'
