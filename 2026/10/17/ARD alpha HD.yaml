  title: Als Mutti in den Westen ging
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Film von Adrian-Basil Müller und Udo Müller
  genre:
  - '112'
  description: 'Es ist eines der dunkelsten Kapitel des Mauerfalls: Kinder, die nach dem 9.11. von ihren Eltern alleine gelassen wurden. So wie die drei Brüder, die ihre alleinerziehende Mutter im Prenzlauer Berg zurücklässt: Dem 8-jährigen schreibt sie noch einen Zettel, wie er die 4- und 3-Jährigen versorgen soll. Dann legt sie Frühstücksbrote für den nächsten Tag hin - und kommt nie wieder. Kein Einzelfall: In Berlin und Erfurt treffen die Filmemacher damals Kinder, die zur neuen Freiheit ihrer Eltern nicht passten. Und so stoßen wir nun, 30 Jahre später, auf Wunden, die nie geheilt, und Fragen, die nie beantwortet wurden.'
