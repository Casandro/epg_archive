  title: 'alpha-retro: Von Jenbach zum Schwarzenstein (1957)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Filmporträt aus dem Jahr 1957 entlang einer Fahrt von Jenbach nach Mayrhofen mit der Zillertalbahn, die 1902 fertiggestellt wurde und bis heute immer noch in Betrieb ist - allerdings nur mehr im Sommer. Damals sah das Zillertal logischerweise noch ganz anders aus als heute. Damals sprachen alle Bewohner dieses Tals noch reinstes Tirolerisch. Zu sehen ist eine Fahnenweihe, eine Gesangsgruppe im Wirtshaus und vieles mehr. Gegen Ende gibt es dann eine Gipfeltour auf den Schwarzenstein im Schnee.
