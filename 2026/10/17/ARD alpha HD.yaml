  title: 'alpha-retro: Der Bergführer (1981)'
  subtitle: '"I muaß eahm unterkriag''n" (Ich muss ihn besiegen)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Der Beruf des Bergführers, gezeigt am Beispiel einer Superbergwanderung über 14 Tage mit zehn Hütten und neun Dreitausendern: eine Tour von 16 Alpintouristen (sieben Männer, neun Frauen) durch die Stubaier Alpen in Tirol. Was muss ein Bergführer heute (1981) alles beherrschen? Sicherheit, Aufmunterung und Einschätzung der Leistungsfähigkeit der Gäste. Demokratie am Berg? Niemals.'
