  title: Host Lenky Vahalové
  description: Režisér David Ondříček se po letech vrací k poetice svých kultovních Samotářů. Jeho nový film Kluci to vidí jinak než holky vstoupí do kin 22. října. Jaký příběh nový snímek vypráví a koho uvidíme v hlavních rolích? Moderuje Lenka Vahalová
- eventId: 821597
  start: 2026-10-17T22:00:00Z
  stop: 2026-10-17T23:00:00Z
  title: Kriminálka
  description: 'Vinohradský řezník - Policie v Praze zaznamená několik hrůzných nálezů částí lidského těla. Podle soudního lékaře se jedná o jednoho člověka. Jaká je ale jeho totožnost? Proč nikdo nikoho nepohřešuje? A proč vrah svoji oběť rozřezal a nesnažil se tělo lépe ukrýt? Složité a zdlouhavé pátrání pražských kriminalistů. Případ, který vešel do dějin české kriminalistiky jako "Vinohradský řezník". Autor, dramaturgie: Dana a Mirek Vaňurovi.'
