  stop: 2026-10-17T01:15:00Z
  title: Die Deutschen II
  subtitle: Rosa Luxemburg und die Freiheit
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2010
    Sie stammte aus dem von Russland annektierten Teil Polens. Rosa Luxemburg (1871 bis 1919) wurde politische Aktivistin in einer Zeit, in der Frauen in Deutschland noch nicht wählen durften.

    Die Arbeiterbewegung in Europa befand sich im Aufbruch, Sozialisten wurden überall verfolgt. Schon in jungen Jahren kämpfte Rosa Luxemburg für die Rechte der Arbeiterschaft - ab 1898, nachdem sie die deutsche Staatsangehörigkeit angenommen hatte, in der SPD.
    Darsteller:
    Rosa Luxemburg - Tereza Brodská
    HD-Produktion
- eventId: 1439702
  start: 2026-10-17T01:15:00Z
  stop: 2026-10-17T02:00:00Z
  title: Die Deutschen II
  subtitle: Hildegard von Bingen und die Macht der Frauen
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2010
    Hildegard von Bingen (1098 bis 1179) ist die populärste Deutsche des Mittelalters - auf Augenhöhe mit den Mächtigen ihrer Zeit. Sie war Visionärin, Naturwissenschaftlerin und vieles mehr.

    So war sie auch Politikerin, Komponistin, Theologin und sogar Managerin zweier von ihr gegründeter Klöster. Viele ihrer Schriften, vor allem ihre Kenntnisse der Naturheilkunde, haben bis heute nichts von ihrer Aktualität eingebüßt.
    Darsteller:
    Hildegard von Bingen - Deborah Kaufmann
    HD-Produktion
- eventId: 1439703
  start: 2026-10-17T02:00:00Z
  stop: 2026-10-17T02:45:00Z
  title: Terra X
  subtitle: Alexander der Große - Auf dem Weg zur Macht
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2014
    Alexander der Große gilt als der Vorzeige-Weltherrscher der Geschichte. Kein Superlativ scheint dem jungen Makedonenkönig gerecht zu werden.

    In nur elf Jahren erobert er ein Gebiet, das sich von Griechenland über den Orient hinaus bis nach Indien erstreckt. 19 Staaten, drei Kontinente und unzählige Volksgruppen unterwirft er in einem einzigen gigantischen Feldzug.
    HD-Produktion
- eventId: 1441198
  start: 2026-10-17T02:45:00Z
  stop: 2026-10-17T03:30:00Z
  title: Terra X
  subtitle: Alexander der Große - Bis ans Ende der Welt
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2014
    Im Zentrum der zweiten Folge steht Alexanders gigantischer Eroberungszug. Er führt ihn durch Kleinasien, Ägypten, Persien und Pakistan bis nach Indien - ans Ende der damals bekannten Welt.

    Scheinbar mühelos hat der Makedone innerhalb von elf Jahren das größte Imperium der Antike geschaffen. Nach seinem frühen Tod im Jahr 323 vor Christus zerfällt das Alexanderreich binnen kürzester Zeit.
    HD-Produktion
- eventId: 1441200
  start: 2026-10-17T03:30:00Z
  stop: 2026-10-17T04:10:00Z
  title: Terra X
  subtitle: Magellans Reise um die Erde - Das Abenteuer der ersten Weltumsegelung
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2020
    Vor 500 Jahren setzen der portugiesische Kapitän Ferdinand Magellan und seine Männer im Auftrag der spanischen Krone Segel - zu einem der größten Seefahrt-Abenteuer der Geschichte.

    Ihre Weltumsegelung hatte damals eine vergleichbare Bedeutung wie die Raumfahrt im 20. Jahrhundert. Zum ersten Mal war es gelungen, die wahre Dimension unseres Planeten in Augenschein zu nehmen. Dabei war das ursprüngliche Ziel der Expedition ein ganz anderes.
    HD-Produktion
