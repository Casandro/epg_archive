  title: 'Wassyla Tamzali, Xavier Le Clerc, Nicolas Wadimoff '
  subtitle: 'Après « Un homme sans titre » et « Le Pain des Français », Xavier Le Clerc poursuit son exploration de l''héritage colonial avec «  '
  description: "Wassyla Tamzali, Xavier Le Clerc, Nicolas Wadimoff\n\nAprès « Un homme sans titre » et « Le Pain des Français », Xavier Le Clerc poursuit son exploration de l'héritage colonial avec « Le Garçon ébloui » (éditions Gallimard). 1959, un jeune instituteur, Sébastien, est appelé sous les drapeaux et envoyé en Algérie. Dans un village abandonné, il découvre Idir, qu'il adopte. \n  \nNicolas Wadimoff veut encore et toujours leur donner la parole. Dans son documentaire « Qui vit encore », il écoute et enregistre le témoignage de neuf Palestiniennes et Palestiniens réfugiés. Le film, qui traite de la perte, de la préservation de l'identité et de la vie malgré tout, représente la Suisse aux Oscars 2027.\n \nL'art contemporain algérien est à l'honneur de la Menart Fair de Paris (23-25 octobre 2026). À travers les oeuvres de douze artistes, la « Project Room » révèle une génération qui interroge son époque et son territoire. Wassyla Tamzali témoigne de la vitalité d'une scène artistique encore trop peu visible à l'international. \n \nLe Salon du livre de Beyrouth retrouve un format unifié et accueille plus de quarante écrivains et artistes venus de différents pays. Un reportage de Sophie Guignon et Wissam Charaf. \n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Wassyla Tamzali, écrivaine, fondatrice et directrice des Ateliers sauvages ; Xavier Le Clerc, romancier ; Nicolas Wadimoff, réalisateur et scénariste\n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
  ageRating: 7
  genre:
  - '47'
