  description: 'Der Podcast für alle Gaumenfreunde und Gaumenfreude. Carolin Courts und Uwe Schulz ist für den maximalen Genuss kein Weg zu weit. Dafür folgen sie kulinarischen Trends, sprechen mit Spitzenköchen und Herstellern, und probieren, was das Zeug hält. Konkrete Takeaways und Rezepte für eure Küche garantiert. Jeden Donnerstag gibt''s eine neue Folge. Wenn ihr einen Genuss-Tipp oder Fragen an uns habt, schreibt uns unter: allesinbutter@wdr.de'
