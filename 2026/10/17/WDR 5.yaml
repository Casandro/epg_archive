  title: Krimi am Samstag
  subtitle: 'ARD Radio Tatort: Mit dem Rücken zur Wand'
  description: "<markup type=\"cite\">\"Halten Sie mich nicht für verrückt, aber ich weiß, dass etwas Bösartiges passieren wird.\"</markup> Mit dieser unheilvollen Vorahnung steht die betagte Elisabeth Stein im Büro von Michel Paquet, noch Leiter der Mordkom\"ission Saarlouis. Ihr Wohnblock wird gerade aufwendig modernisiert, doch durch den vielen Dreck und Lärm vergrault Vermieter Alexander Junghans die Bewohner. Wenige Tage später liegt er tot im Straßengraben. Kein Unfall - hat sich Elisabeth Steins Vorahnung doch bewahrheitet? \nProduktion: SR <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"9.\" correspondent=\"neunten\">9.</markup> Oktober <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
