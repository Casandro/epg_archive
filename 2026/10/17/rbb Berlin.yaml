  title: Manfred Krug - Ich wollte echt sein
  subtitle: Ein Wiedersehen mit dem deutsch-deutschen Künstler - Zum Tode von Manfred Krug
  episodeUri: crid://onid-8468/e/6aa088589f3fb7e0ed08f44c
