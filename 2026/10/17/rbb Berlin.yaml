  description: 'Es war seine letzte Platte. Im September 2014 ging der 77-jährige noch einmal ins Studio, gemeinsam mit Uschi Brüning, der Grande Dame des Jazz. Von ihr sagte Manfred Krug:  "Sie ist aus meinem Herzen nicht mehr wegzudenken." Das Ergebnis ihrer gemeinsamen Arbeit: Selbstgeschriebene Texte und Evergreens neu interpretiert, Jazz und jazziger Schlager - und viel Manfred Krug. Das war sein Geheimnis seit nunmehr über 50 Jahren. In all seinen Rollen das sein, was er selbst ist, ob als Musiker oder als Schauspieler.'
