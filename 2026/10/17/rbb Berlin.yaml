  description: 'Staatsanwalt Heinrich Gruber und Reisejournalist Tom Gruber haben im Leben wenig gemeinsam. Umso mehr staunen die beiden Herren um die 60, als sie sich bei einer Testamentseröffnung kennenlernen - und zwar als Ehemänner der Verstorbenen! Die mit dem Auto verunglückte Sophia hat jahrzehntelang ein ebenso geheimes wie glückliches Doppelleben geführt. Während Tom seinen Nebenbuhler gerne kennenlernen möchte, schaltet Heinrich komplett auf stur. Der Jurist erkennt Sophias Las-Vegas-Trauung mit Tom genauso wenig an wie ihren letzten Willen: Sie bittet, dass ihre Asche in der Nordsee verstreut wird - von "ihren" Männern gemeinsam!'
