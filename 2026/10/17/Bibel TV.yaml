  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Auf der Straße leben und dennoch zufrieden sein, mit nur einem Bein und Armstümpfen. Das Fehlen wichtiger Gliedmaßen hinderte Muhammad Asroel nicht daran, seinen Weg zu gehen, eine Familie zu gründen und wirtschaftlich unabhängig zu sein. Er erkannte sein künstlerisches Talent und malte für sich und andere. Ihm gelang der Weg von der Straße hin zu einem geregelten Leben. Eine Erfolgsgeschichte aus Bali.'
