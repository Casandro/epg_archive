  title: Freude am Leben
  subtitle: Unbeschreiblich nah - aus Nähe wird Sieg
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Manchmal erkennen wir erst im Rückblick, wie nah Gott uns wirklich war. Gottes Nähe bedeutet nicht, dass der Kampf sofort ein Ende nimmt, sondern dass man ihn niemals alleine führt. Es lässt sich wie bei den Emmaus-Jüngern erleben, die neue Hoffnung fanden; wie bei Elia, der neue Kraft empfing; oder wie bei Paulus, der Stärke in seiner Schwäche entdeckte. Egal ob wir müde, enttäuscht oder voller Fragen sind: Jesus geht jeden Schritt mit. Der Sieg beginnt nicht erst am Ziel, sondern bereits auf dem Weg mit Gott.'
  genre:
  - '115'
  widescreen: true
  hd: true
