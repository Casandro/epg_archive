  title: Don Matteo
  subtitle: Alles ist verloren
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Viola Brizzi wendet sich verzweifelt an Don Matteo und Maresciallo Cecchini, da ihr schwer kranker Mann Rocco verschwunden ist. Zu ihrem großen Unglück bestätigt sich Violas Vorahnung, denn Rocco wird kurze Zeit später ermordet aufgefunden. Die Polizei nimmt daraufhin Roccos Sohn Giovanni fest, da Zeugen einen heftigen Streit der beiden beobachtet haben. Don Matteo glaubt nicht an Giovannis Schuld, denn es gibt gleich mehrere Personen, die ein Motiv gehabt hätten, um Rocco zu töten.'
