  title: ERF Jess Reportage
  subtitle: Ein Tag im Freizeitpark
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Freizeitparks erfreuen sich in Deutschland großer Beliebtheit. In einer Umfrage von 2021 gaben 20 Millionen Menschen an, mindestens einmal im Jahr einen Freizeitpark zu besuchen. Für den bevorstehenden Herbst gibt es in der Branche nur ein Thema: Halloween! Aber ein deutscher Freizeitpark grenzt sich bewusst davon ab: der Hansa-Park in Sierksdorf. Er lädt stattdessen zum Herbstzauber samt Erntedankfest ein. Was steckt hinter dieser Entscheidung? In der ERF Jess Reportage begibt sich Julian Schnaubelt auf die Suche nach Antworten.'
