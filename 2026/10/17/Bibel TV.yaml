  title: Ein Hauch von Himmel
  subtitle: Ein Lied für die Ewigkeit (1/2)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Monicas neue Aufgabe führt sie zu Diana, einem ehemaligen Mitglied der Winslow-Family-Gospelsänger. In den 60er und 70er Jahren fuhr die Großfamilie, die von Vater Carter mit strenger Hand geführt wurde, in einem Bus von Konzert zu Konzert und sang Lieder zur Ehre Gottes. Bis ein Zerwürfnis und ein schlimmer Unfall die Familie trennte und die Musik verstummen ließ. Diana hat ihr Gottvertrauen trotzdem nie verloren und lange gebetet, dass die Familie wieder versöhnt wird. Dabei soll Monica ihr helfen. Doch das stellt sich als schwerer heraus als gedacht, weil niemand weiß, wo manche Familienmitglieder sich mittlerweile aufhalten und weil Diana unter einem Posttraumatischen Stresssyndrom leidet. An die Ereignisse rund um den Unfall erinnert sie sich nur bruchstückhaft. Wird es Monica gelingen, die Puzzleteile und die Familie Winslow wieder zusammenzufügen? - Mit einem Gastauftritt von Faye Dunaway als Dianas Therapeutin. Teil 1 von 2.'
