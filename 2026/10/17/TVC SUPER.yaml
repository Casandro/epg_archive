  subtitle: Znaleziono zwłoki Matthiasa Wagnera, który uciekł z więzienia. Policjanci nie rozumieją, dlaczego mężczyzna uciekł, ponieważ miał wyjść na wolność dwa tygodnie później.
  description: |-
