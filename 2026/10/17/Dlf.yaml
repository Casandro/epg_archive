  title: Corso - Kunst & Pop
  description: "Cameron Winter: Ein Klavier reicht für die Carnegie Hall\n Wer mit 24 die New Yorker Carnegie Hall bespielt, weckt große Erwartungen. Cameron Winter stellte sich ihnen allein am Klavier, mit rätselhaften Texten und Mut zum Risiko. Sein Livealbum fängt einen Abend ein, bei dem man sich wünscht, man wäre dabei gewesen.\n\n Rockband Fontaines D.C. - Kein Entkommen aus der Gegenwart\n Auf dem Album ?Dopamine Chamber? öffnet die Band Fontaines D.C. ihren Rock für Synthesizer und Pop. Die irische Gruppe singt von digitaler Überforderung und der Suche nach dem nächsten Kick in einer kaputten Welt. Die Musik hat Wucht, doch aus ihrer düsteren Grundstimmung findet sie nur selten heraus.\n\n Endless Wellness: Hoffnung ist ein Kraftakt\n Gameboy-Klänge treffen auf ausgefranste Stimmen, düstere Gedanken auf Humor.\n Wie daraus das Album ?Domino Days? geworden ist, erzählt die Wiener Band im Interview. Und auch, warum es sich lohnt, an ein besseres Zusammenleben zu glauben.\n Philipp Auer und Adele Ischia im Corsogespräch \n\nAm Mikrofon: Mike Herbstreuth"
