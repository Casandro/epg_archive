  title: Hörspiel
  description: "Wir sind das Volk (3+4/4)\nNach dem Theaterstück am Deutschen Nationaltheater Weimar\nVon Eva Bormann und Luise Voigt\nRegie: Luise Voigt\nMit: Annelie Korn, Dascha Trautwein, Katharina Hackhausen, Calvin Noel Auer, Fabian Hagen, Nahuel Häfliger, Bastian Heidenreich, Marcus Horn, Nadja Robiné, Roxana Safarabadi und Janus Torp\nKomposition: Frederik Werth \nTon: Jean Szymczak\nRegieassistenz: Assunta Allegiani\nDeutschlandfunk 2026\nLänge: 50?26 (Teil 3) und 52?09 (Teil 4)\n\nWelche Menschen bilden heute ?das Volk?? Was verbindet und was trennt uns vom ?Wir?? 50 Personen aus Thüringen, systemkritisch, liberal, konservativ und fortschrittlich, erzählen von sich und üben Kritik. Entstanden ist ein vielstimmiges ?Wir?."
