  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: |-
    Das Bildungsmagazin

    Wechseljahre im Job: Wie gelingt der Umgang mit Veränderungen?
    Einige Länder, zum Beispiel Großbritannien, haben schon Maßnahmen umgesetzt, die Frauen unterstützen: Von flexiblen Arbeits- und Pausenzeiten, über Rückzugsmöglichkeiten bis hin zu atmungsaktiver Berufsbekleidung. Was tut sich diesbezüglich in Deutschland? Wie offen sind Führungskräfte, um den Bedürfnissen ihrer Mitarbeiterinnen in dieser Lebens- und Karrierephase besser entgegenzukommen? Und welche Erfahrungen machen Frauen in den Wechseljahren am Arbeitsplatz im Umgang mit diesem oft noch tabuisierten Thema?

    Gäste:
    Kerstin Hendricks, Ökonomin und Wechseljahresberaterin, Stuttgart
    Dr. Claudia Barthelmes, Fachärztin für Arbeitsmedizin, München
    Bárbara Sánchez Botella, Leiterin des Gesundheitsmanagements der Flughafen München GmbH
    Am Mikrofon: Dörte Hinrichs

    Hörertelefon: 00800 - 4464 4464
    campus@deutschlandfunk.de
    WhatsApp 0173 - 535 8089
