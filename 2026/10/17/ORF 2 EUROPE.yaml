  title: 'betrifft: uns - Reportagen ohne Filter'
  subtitle: 'Geflüchtete Frauen: Warum Ankommen schwerfällt'
  genre:
  - '35'
  description: Wenn es um Flucht geht, stehen oft Männer im Fokus. Dabei ist jede dritte Person, die in Europa Asyl beantragt, eine Frau. Ihre Fluchtgeschichten erzählen von Gewalt, Unterdrückung und dem Kampf um Selbstbestimmung. Häusliche Gewalt, Bildungsverbote und Einschränkungen ihrer persönlichen Freiheit zwingen viele Frauen und Mädchen dazu, gefährliche Fluchtrouten auf sich zu nehmen. Dabei sind sie häufig auch körperlicher und sexueller Gewalt ausgesetzt. Doch selbst mit der Ankunft in einem sicheren Land ist der Kampf für viele noch lange nicht vorbei. Bürokratische Hürden, der schwierige Zugang zum Arbeitsmarkt und Sprachbarrieren erschweren den Start in ein neues Leben.
