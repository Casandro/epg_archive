  title: Bürgeranwalt
  description: "- Verkehrsinsel direkt vor Einfahrt: Seit 250 Jahren befindet sich ein Fuhrwerkerhaus in der Schlachthausgasse 48 im 3. Bezirk in Wien. Die Räumlichkeiten im Hof sind an verschiedene Unternehmer vermietet, die ihre Produkte - vom Wein bis zu Reinigungsmitteln - ausliefern oder an Ort und Stelle direkt an Kunden weitergeben. Bis vor Kurzem kein Problem. Aber: Im Zuge der Neugestaltung der Straße wurde auf der Höhe der Einfahrt in den Hof des Fuhrwerkerhauses eine Verkehrsinsel errichtet. \n- Klage wegen Diskriminierung bei öffentlichen WC-Anlagen: 50 Cent kostet der Besuch der WC-Anlage am Wiener Rathausplatz, aber nur für die Frauenkabine, das Pissoir für Männer ist gratis. Begründet wird das von der zuständigen Wiener Magistratsabteilung 48 mit dem anwesenden Reinigungspersonal.  \n- Wer zahlt die Sanierung des alten Fernwärme-Netzes? 36 Hauseigentümer einer Siedlung in Linz erfahren im Herbst 2025, dass in naher Zukunft ihr Fernwärme-Netz abgedreht wird. Es sei so sanierungsbedürftig, dass sich die Weiterführung für ihren Energielieferanten, der Kärntner KELAG, nicht mehr rechnet - es sei denn, die Hauseigentümer zahlen je 30.000 ± für die Sanierung."
  genre:
  - '130'
