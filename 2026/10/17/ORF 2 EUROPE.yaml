  title: Zurück zur Natur
  subtitle: Gesäuse
  description: "Das Gesäuse in der Obersteiermark ist ein wildes Tal, geprägt vom glasklaren Wasser der Enns, den steilen Kalksteinwänden und dem Ort Admont mit seinem geschichtsträchtigen Benediktinerstift. \nAuf knapp 1000 m Seehöhe betreibt Familie Seidl eine Almwirtschaft. Tochter Eveline Seidl hat bereits den elterlichen Hof übernommen, Mutter Inge hilft weiter tatkräftig bei der Bewirtung der Wanderer mit. In Altlassing fertigt Sabine Spannring seit über 40 Jahren Kunstwerke aus Ton an. Und Maggie Entenfellner hilft Biologin Barbara Bock im Nationalpark bei ihrer Arbeit mit einer fast ausgestorbenen Pflanze, der Ufer-Tamariske.\nca.25"
  genre:
  - '116'
