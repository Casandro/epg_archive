  title: Land und Leute
  description: "Geniale Rezeptideen: das vielseitige Superfood \"Buchweizen\"\n\nVom einstigen Arme-Leute-Essen zum begehrten Superfood: Buchweizen hat in den letzten Jahren einen Imagewechsel vollzogen und nimmt wieder mehr Bedeutung im Speiseplan der Österreicherinnen und Österreicher ein. Buchweizen gilt als Superfood, weil er glutenfrei ist, alle wichtigen Aminosäuren enthält, wertvolle Antioxidantien wie Rutin liefert, alle wichtigen Mineralstoffe beinhaltet und reich an Vitalstoffen ist. \nIm Jauntal, in Unterkärnten, wird der Buchweizen auch Hadn genannt. Hier erlebt die alte Kulturpflanze durch den Verein \"Genussregion Jauntaler Hadn\" und die Gastronomie einen innovativen Aufschwung. Der Hadnwirt Peter Rupitz kocht für die \"Land und Leute\"-Serie \"Genial gekocht - nachhaltig versorgt\" ein Menü mit traditionellem Hauptgang und neuen Kreationen in der Vor- und Nachspeise: Buchweizenrisotto mit Pilzen, Jauntaler Hadnkranznudeln, Hadn-Walnuss-Torte mit Zwetschken.\n\nWeitere Themen von \"Land und Leute\" am 17. Oktober:\n\nUrlaub bei Pferden\nWahl des Publikumslieblings\nPunkte für die Gesundheit"
