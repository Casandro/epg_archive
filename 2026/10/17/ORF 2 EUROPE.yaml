  title: Da wo die Herzen schlagen
  description: |-
    (Moderner Heimatfilm, AUT/DEU 2004)
    Hansis Frau Regina verunglückt bei einer Wanderung in den Bergen tödlich. Um mit seinem Schmerz zurecht zu kommen, stürzt sich Hansi in seine Arbeit. Da taucht eine junge Frau, Christl Huber, im Ort auf. Hansi ist von ihr fasziniert, denn sie erinnert ihn stark an Regina. Hansi verliebt sich in Christl, sehr zum Leidwesen von Viktoria, die sich nach Reginas Tod Chancen bei Hansi ausgerechnet hat. Aber das bleibt nicht die einzige Irritation in dieser jungen Liebe, denn Christls Ähnlichkeit mit Regina hat einen Grund.
    Mit Hansi Hinterseer (Hansi Sandgruber), Anja Kruse (Viktoria Perterer), Karina Thayenthal (Regina Sandgruber), Ingrid Burkhard (Irmi Sandgruber), Evamaria Salcher (Kathi Sandgruber), Simone Heher (Christl Huber), Kurt Weinzierl (Felix), Laura Ferrari (Sonja Sandgruber), Günter Waidacher (Franz Sandgruber) u.a.
    Buch: Eduard Ehrlich
    Regie: Karl Kases
    Koproduktion ORF/Terra/Bavaria
    88:05
