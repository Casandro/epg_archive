  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Der Mensch ist von Natur aus religiös
  description: Spielt Gott im Leben der Menschen eine Rolle? In allen Kulturregionen der Welt treffen wir auf Verehrung von Göttern unterschiedlichster Art. Der Apostel Paulus findet dies auch in Athen vor und verkündet dort mutig den ihnen 'unbekannten Gott', der Jesus auf die Erde  gesandt hat, der von den Toten auferstanden ist.  Monsignore Schroedel beginnt seine Betrachtungen zur Heiligen Messe mit der Missionstätigkeit des Völkerapostels Paulus, der als erster die Wandlungsworte übermittelte, die Jesus im Abendmahlssaal gesprochen hat. Bis auf den heutigen Tag feiern Christen die Gegenwart Jesu Christi in Brot und Wein.
  widescreen: true
