  description: 'In Deutschland wachsen die meisten Kartoffeln der EU, und seit dem 18. Jahrhundert gehört sie fest zur hiesigen Ernährung. Aber die Kartoffel gerät unter Druck. Unser Essverhalten verändert sich, hin zu Reis oder Pasta. Salz- oder Pellkartoffeln kommen dagegen immer seltener auf den Tisch, und es werden immer weniger Kartoffeln gekauft. Es sei denn, sie sind verarbeitet: "Pommes" oder Chips boomen! Deshalb macht "Quarks" den Test: Wie gelingen perfekte Pommes frites - ohne gefährliches Acrylamid und zu viel Fett?'
