  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese fejeton Radka Štěpánka Těžko na cvičišti aneb O sebejistotě. Čte autor. Alena Blažejovská natočila rozhovor s Monikou Rychlíkovou o knize Vyprávět, abych mohl žít, věnované spisovateli Jiřímu Kratochvilovi. Desátou částí pokračuje četba z knihy Jany Soukupové Brněnské mordy. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Připomeneme si nedožité 85. výročí narození básníka Zena Kaprála.
