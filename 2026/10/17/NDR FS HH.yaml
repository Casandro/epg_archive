  audiodesc: true
  subtitle: 'Gast: Clara Lösel, Poetry-Künstlerin und Schriftstellerin'
  description: Nachdem sie Deutsch und Spanisch studiert hatte, um am Gymnasium zu unterrichten, entschied sich Clara Lösel doch anders. Bekannt wurde sie durch emotionale und gesellschaftskritische Gedichte auf Social Media. Ihre nahbare Poesie handelt von mentaler Gesundheit, Politik, dem Erwachsenwerden und baut Brücken zwischen den Generationen. Und so wuchs ihr Publikum schnell von Klassengröße in die Hunderttausende. Vor Kurzem ist ihr Buch "Ich dachte, sowas fühl nur ich" erschienen, in dem sie 101 Texte versammelt, die lebensverändernd wirken sollen. Das ist u.a. ein Thema, über das sie auf dem Roten Sofa spricht.
