    Legendarny hazardzista wpada w środek krwawego starcia z bandytami podczas wielkiego turnieju pokera. Gdy przestępcy próbują oszustwem utorować sobie drogę do finału, rewolwerowiec nie cofnie się przed niczym, by ochronić swoją wygraną i krwawo wymierzyć sprawiedliwość. Obsada: Terence Hill, Clare Carey, Maria P. Petruolo
