  title: Celnicy 1 (odc. 1)
  subtitle: W Portsmouth celnicy trafiają na autokary pełne pasażerów, którym oferowana jest darmowa podróż w zamian za zabranie przydziału tytoniu. Takie praktyki kosztują Skarb Państwa ponad 2 miliardy funtów rocznie.
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2008
    Reżyseria: Andrew Zikking
    Występują: Jon Rand, David Cole
    Na lotnisku Gatwick specjalnie wyszkolony pies znajduje podejrzaną walizkę. Okazuje się, że są w niej prawie 3 kg kokainy. Mark zatrzymuje dwie kobiety wracające z Karaibów. Sądzi, że udało mu się złapać szmuglerki. Funkcjonariusze w Bristolu łapią mężczyznę przemycającego papierosy - jego kłamstwa sprawiają, że ma coraz większe kłopoty.
  ageRating: 12
  genre:
  - '35'
- eventId: 684687
