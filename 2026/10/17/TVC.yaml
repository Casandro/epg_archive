  title: Celnicy 1 (odc. 2)
  subtitle: 'Na lotnisku służby celne łapią przemytnika kokainy, który twierdzi, że jest śledzony. W jednym z transportów ekipa odkrywa ogromne ilości narkotyków i amunicji. '
  description: |-
    Tytuł oryginalny: Nothing to Declare UK
    GB, 2008
    Reżyseria: Andrew Zikking
    Występują: Jon Rand, David Cole
    W Kornwalii załoga na pokładzie kutra celnego Searcher bada tajemnicze akcesoria doniczkowe. Podejrzewają, że są wykorzystywane do przemytu narkotyków. Na lotnisku Gatwick wykryta zostaje podejrzana torbę, pewni pasażerowie próbują się rozdzielić, aby przejść przez odprawę celną, ale funkcjonariusze obserwują każdy ich ruch, a Calvin podczas przeszukania odkrywa marihuanę o wartości 55 tys. funtów.
  ageRating: 12
  genre:
  - '35'
