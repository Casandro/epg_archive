  description: 'Markéta Hejkalová: Dům pod náměstím (8/10). Do města začínají pronikat supermarkety. Vojtěch Vlkovský se nakonec pod tlakem rozhodne zapojit krám do národního řetězce potravinářských prodejen. Krámu se však stále říká U Vlků. Četbu pro rozhlas připravila Blanka Kostřicová. Dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Zdeněk Bureš a Barbora Goldmannová.'
