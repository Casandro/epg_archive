  stop: 2026-10-17T09:45:00Z
  title: Raus aufs Land (31)
  subtitle: Familienumzug mit Risiko - All-in für den Traum vom Land
  description: |-
    Bei Clara und Tobias und dem befreundeten Paar geht es ans Eingemachte: Ihr Wohnzimmer müssen sie jetzt gemeinsam einrichten, und die ersten Meinungsverschiedenheiten lassen nicht lange auf sich warten.
    Für Jaquie wird es ernst auf dem Land. Kirmes! Ein traditioneller Umzug mit Kostümen, Ballermann-Musik und viel Alkohol. Die Einheimischen feiern das als ihre Jahrhunderte alte Tradition, doch Jaquie kann damit nicht recht was anfangen.
    Severin probiert sich an der Herstellung von Mirabellenmarmelade - mit Unterstützung einer erfahrenen Freundin.
- eventId: 865140
  start: 2026-10-17T09:45:00Z
  stop: 2026-10-17T10:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: Herbstküche - Rezepte für Genießer
  description: 'Heute feiern Martina und Moritz den Herbst. Die Jahreszeit, die die schönsten und besten Zutaten in die Küche liefert. Im Herbst quellen die Märkte geradezu über, Gemüse und Obst gibt es in allen Formen und Farben, die Wahl fällt schwer. Deshalb haben die beiden Lieblingsprodukte für ihre Rezepte ausgesucht. Da gibt''s ein Kartoffeldurcheinander der ganz neuen Art, mit Kohlröschen und Schwarzwurzeln. Sie backen Gemüse im Ofen: bunte Wurzeln - also Möhren und Bete in allen Farben - und servieren es als rein vegetarisches Gericht. Sie reichen aber denen, die Lust auf Fleisch haben, zartes Reh in köstlicher Rotweinsauce dazu.'
- eventId: 865400
