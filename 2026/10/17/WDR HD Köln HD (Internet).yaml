  description: In den Lach- und Sachgeschichten gibt es bunte Blumen und noch buntere Tiere zu bestaunen. Ein farbenprächtiger Hyazinthara schafft es mit seinem großen Schnabel die härteste Nuss der Welt zu knacken. Anke hat einen komischen Hubbel im Mund, dadurch spricht sie ziemlich undeutlich. Knallgelbe Sonnenblumen tanzen über den grünen Rasen und veranstalten ein Wettrennen.
