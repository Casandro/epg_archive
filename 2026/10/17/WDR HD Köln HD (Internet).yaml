- eventId: 864262
  start: 2026-10-17T09:05:00Z
  stop: 2026-10-17T09:45:00Z
  title: Raus aufs Land (31)
  subtitle: Familienumzug mit Risiko - All-in für den Traum vom Land
  description: |-
    Bei Clara und Tobias und dem befreundeten Paar geht es ans Eingemachte: Ihr Wohnzimmer müssen sie jetzt gemeinsam einrichten, und die ersten Meinungsverschiedenheiten lassen nicht lange auf sich warten.
    Für Jaquie wird es ernst auf dem Land. Kirmes! Ein traditioneller Umzug mit Kostümen, Ballermann-Musik und viel Alkohol. Die Einheimischen feiern das als ihre Jahrhunderte alte Tradition, doch Jaquie kann damit nicht recht was anfangen.
    Severin probiert sich an der Herstellung von Mirabellenmarmelade - mit Unterstützung einer erfahrenen Freundin.
