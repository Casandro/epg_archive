  title: Sehen statt Hören
  subtitle: Adoptiert - Auf der Suche nach meinen Wurzeln
  description: Vera wurde als Baby aus Brasilien adoptiert und ist taub. Liebevoll aufgewachsen, bleibt die Frage nach Herkunft und Zugehörigkeit. Der Film begleitet ihre Suche nach Identität und die behutsame Kontaktaufnahme zu ihrer Familie in Brasilien.
