  title: Wir werden Camper
  subtitle: Jasmin & Sven Ruby in NRW und an der Nordseeküste
  description: |-
    Jasmin (43) und Sven (43) Ruby aus Hamm-Bockum-Hövel sind seit fünf Jahren begeisterte Camper. Drei Kurzurlaube stehen dieses Jahr auf dem Programm:
    Es geht an die Nordsee auf einen Fünf-Sterne-Campingplatz nach Bensersiel.
    Für die nächste Campingreise müssen Jasmin und Sven gar nicht weit fahren. Sie bleiben im Ruhrgebiet und wollen hier im Erholungspark Wehlingsheide bei Datteln Svens 44. Geburtstag feiern.
