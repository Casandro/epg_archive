  title: MDR KULTUR Weltgeschichte vor der Haustür
  subtitle: Die Gensammler von Gatersleben / Eine Podcast - Folge von Hartmut Schade und Conny Wolter
  description: '"Zurück in die Zukunft", lautet ein bekannter Filmtitel, der auch als Motto für eine der größten und ältesten Genbanken der Welt zutreffen würde. Die Rede ist von der Genbank in Gatersleben im nördlichen Harzvorland, wo rund 150.000 Samenmuster von Kulturpflanzen aus allen Erdteilen eingelagert sind. Ein in die Zukunft gerichtetes Projekt, das dazu dienen kann, die großen landwirtschaftlichen Herausforderungen durch Klimawandel, Pflanzenkrankheiten und steigende Weltbevölkerung zu meistern. Hartmut Schade hat die Schatzkammer besucht. Es spricht Conny Wolter.'
