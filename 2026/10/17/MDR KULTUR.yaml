  title: 'MDR KULTUR Diskurs: Die famose Phantastik der Geschichte'
  subtitle: Die Schriftstellerin Christine Wunnicke im Gespräch mit Katrin Schumacher
  description: "Längst ist sie kein Geheimtipp mehr, auch wenn sie eine Ausnahmegestalt im deutschen Literaturbetrieb ist: Christine Wunnicke schreibt die schmalsten und dabei opulentesten Historienromane, aus denen Tragik und Komik und Wissen sprühen. Mit ihrem Roman \"Wachs\" erzählt sie die Geschichte der Apothekerstochter Marie Bihéron, geboren 1719 in Paris, die eine begabte Illustratorin ist und sich bereits als Kind Leichen besorgt, um deren Inneres zu malen. Marie Bihéron wird eine der größten Forscherinnen und Künstlerinnen ihrer Zeit, die in dieser Geschichte auf wundersame Weise gegenwärtig wird. \n\nDas vorrevolutionäre Paris Christine Wunnickes ist bevölkert von queeren Liebespaaren und dargestellt mit einem fabelhaften Detailwissen, mit krausen Volten, Lust am feinen Witz. Für ihr Werk wird die Schriftstellerin 2025 mit dem renommierten Jean Paul Preis, dem Bayerischen Staatspreis für Literatur ausgezeichnet. Jetzt, am 24. Oktober 2026, wird ihr in Darmstadt der Büchner-Preis 2026 überreicht, die Laudatio hält Judith Schalansky.\nIm Gespräch mit MDR Kultur Literaturredakteurin Katrin Schumacher erzählt Christine Wunnicke, was sie an Jean Paul seit Kindertagen fasziniert und wie sie ihre Figuren aus der Geschichte birgt.\n\nRedaktion: Katrin Wenzel\nMDR KULTUR 2025"
