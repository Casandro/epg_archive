  title: MDR KULTUR trifft... Anne Hahn
  subtitle: Autorin, Stadtschreiberin von Magdeburg
  description: "Noch bis zum 31. Oktober ist Anne Hahn Stadtschreiberin in Magdeburg. Dort wurde sie 1966 geboren. Dort unternahm sie als junge Frau einen Fluchtversuch, der 1989 im Gefängnis endete. Heute lebt Anne Hahn in Berlin und fühlt sich zu Hause in der deutschen Sprache, an den Flüssen und am Meer. Die Entscheidung für ein halbes Jahr als Stadtschreiberin nach Magdeburg zurückzukehren sei auch mit Ängsten verbunden gewesen. In den letzten Jahren aber habe sie bereits versucht sich der Stadt anzunähern, über ihre Liebe zum 1. FC Magdeburg. \n\nDas Stadtschreiber-Stipendium nutzte Anne Hahn, neben zahlreichen Lesungen und Diskussions-Veranstaltungen, um ihren begonnenen Roman abzuschließen, der sich zeitlich in die großen Veränderungen des Sommers 1989 einordnet. Da sie diesen selbst nicht in Magdeburg erlebte spürte Anne Hahn ihm in langen Stadtwanderungen nach, versuchte ihn über viele Gespräche zu ergründen. \"Ausfallschritt\" ist der Titel des Romans. Im kommenden Herbst wird er im Verlag Pfaueninsel erscheinen. \n\nAnne Hahn wurde 1966 in Magdeburg geboren. Nachdem die gelernte Krankenschwester mehrere Punk-Konzerte und Lesungen organisierte verlor sie ihren zugesagten Studienplatz für Kulturwissenschaften. Nach Erpressungsversuchen zur Mitarbeit für die Staatssicherheit plante Anne Hahn ihre Flucht nach Westdeutschland, versuchte im Mai 1989 über Aserbaidschan in den Iran zu gelangen. Sie wurde verhaftet und wegen versuchter Republikflucht zu einem Jahr und zehn Monaten Haft verurteilt. Den Mauerfall am 09. November 1989 erlebte sie im Gefängnis im thüringischen Hohenleuben und wurde im Rahmen einer Amnestie Ende November 1989 entlassen. Sie zog nach Berlin und studierte Kunstgeschichte, Geschichte und Germanistik.\n\nSeit 1999 ist Anne Hahn als Autorin tätig, publizierte zahlreiche Porträts und Rezensionen. In Ihrem Debütroman \"Dreizehn Sommer\", 2005 bei Schirmer/Graf in München erschienen, griff Anne Hahn ihre Erlebnisse von 1986 bis 1999 autobiographisch auf. In neuer Ausgabe kam er 2014 als \"Gegenüber von China\" im Ventil Verlag heraus. Es folgten Biographien, Sachbücher und Romane. 2007 erschien \"Stadionpartisanen\" über Fans und Hooligans in der DDR, 2008 \"Satan, kannst du mir nochmal verzeihen\" über den Punk-Musiker Dieter \"Otze\" Ehrlich. 2014 veröffentlichte der Ventil Verlag den Roman \"DreiTagebuch\" und 2017 \"Das Herz des Aals\". Zusammen mit Frank Willmann schrieb Anne Hahn 2021 \"Vereint im Stolz - Fußball, Nation und Identität im postjugoslawischen Raum\" für die Bundeszentrale für politische Bildung Bonn, 2021 das literarische Sachbuch \"Lebus - Ein Ortsporträt für culturcon medien, 2022 legte sie zusammen mit Frank Willmann \"negativ-dekadent: Punk in der DDR\" im Ventil Verlag vor und 2023 \"Anne Hahn träumt Christian Beck\" bei Volandt & Quist. 2024 arbeitete Anne Hahn als Beraterin an einer Ausstellung zu Punk in Ost-Berlin im Berliner Humboldt Forum mit. In verschiedenen Zeitzeugen-Foren und in Schulen gibt sie Auskunft über unangepaßte Jugendliche in der DDR, Flucht und Haft. \n21.10.2026 Wiederholung, 20.03 bis 21.00 Uhr\n\nModeration:   Thomas Bille\nRedaktion:     Angelika Zapf"
