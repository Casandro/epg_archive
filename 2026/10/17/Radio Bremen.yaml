  description: Ein alter Bahnhof im mecklenburgischen Kröpelin wird das neue Zuhause für Grit Steußloffs Backleidenschaft. Als Bäckerei-Betreiberin betritt die gelernte Pädagogin hier Neuland. Auch, was die Organisation und das Backen in großen Dimensionen angeht. 50 Kilo Brotteig muss Grit für die Eröffnung vorbereiten und in einem für sie neuen Produktionsofen verbacken. Wird ihr Brot darin auf Anhieb gelingen?
