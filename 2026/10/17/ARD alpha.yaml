  title: 42 - Die Antwort auf fast alles
  subtitle: Fällt uns der Weltraumschrott auf die Füße?
  subtitled: true
  description: 'Alles, was man hochwirft, fällt früher oder später wieder herunter. Das trifft auch auf die vielen Dinge zu, die wir seit Beginn der Raumfahrt ins Weltall befördert haben: Raketen etwa, oder Satelliten - Objekte, die mit der Zeit zu Weltraumschrott werden. Die Gefahr, dass wir auf der Erde von Weltraummüll getroffen werden, ist aber nicht das einzige Problem: Je voller es in den Erdumlaufbahnen wird, desto größer wird dort das Kollisionsrisiko - bis wir eines Tages keine Satelliten mehr nutzen können. Finden wir einen Ausweg, bevor uns der Weltraummüll sprichwörtlich auf die Füße fällt?'
