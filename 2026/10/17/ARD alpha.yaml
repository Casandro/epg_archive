  title: 42 - Die Antwort auf fast alles
  subtitle: Können wir uns ändern?
  description: Ist unsere Persönlichkeit von Geburt an festgelegt - oder können wir sie bewusst verändern? Lässt sich Gelassenheit lernen, Gewissenhaftigkeit trainieren und Kontaktfreudigkeit steigern? "Persönlichkeit ist nicht in Stein gemeißelt", sagt Persönlichkeitspsychologe Franz Neyer, und widerspricht dem lange vertretenen Dogma, dass der Charakter nach dem 30. Lebensjahr fest zementiert ist.
