  subtitle: Příběhy českých herců a komiků. Moderuje Patrik Rozehnal.
  description: Ve Hvězdných návratech si připomeneme ženskou hvězdu 30. a 40. let minulého století, která ovšem baví diváky v mnoha ztřeštěných komediích dodnes. Její život ale tak veselý zase nebyl. O Nataše Gollové bude mluvit i její velký obdivovatel Aleš Cibulka. Dozvíte se, jaké bylo její pravé jméno, kde bydlela a jaké móresy měla při natáčení filmů. To vše s humorem a archívními ukázkami. Připravuje Patrik Rozehnal.
