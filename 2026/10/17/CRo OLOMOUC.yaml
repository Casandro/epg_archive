  title: Mezi nebem a zemí
  description: V Kutné Hoře připomínají 400 let od příchodu jezuitského řádu do města. Karel Sladký o tom zjišťoval víc. Středověké malby v jindřichohradeckém kostele svatého Jana Křtitele ožívají díky moderním technologiím. Jak funguje nový audiovizuální průvodce, prozradíme v reportáži... A čeká nás i pravidelné zamyšlení. Dnes je od římskokatolického kněze Pavla Lazárka.
