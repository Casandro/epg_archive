  title: Hobby magazín
  description: Vaječné skořápky zajistí rostlinám vápník, banánové slupky jsou nejlepší přírodní hnojivo - to jsou jen dvě z tzv. babských rad. Ředitel Botanické zahrady v Teplicích Jan Ptáček to uvede na pravou míru. Úroda medu byla v letošním roce podle včelařů celkem dobrá. Jak se nyní postarat o včelstva? S pardubickým včelařem Evženem Báchorem na toto téma zavedla řeč naše hobby redaktorka Jitka Slezáková. Jak pečovat o autobaterii nejen v zimě, se zajímal Mirek Kobza.
