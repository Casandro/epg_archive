  title: Akcija, film
  subtitle: Action (2020) Akcija/Komedija
  description: "Američka akcijska zvijezda iz devedesetih snima film u Bugarskoj, dok trojica sad već odraslih obožavatelja pokušavaju upoznati svog idola iz djetinjstva. \nGrupa prijatelja saznaje da njihov akcijski junak iz djetinjstva upravo snima novi film u njihovom gradu. John Keller, istrošena i gotovo zaboravljena američka akcijska zvijezda iz devedesetih godina 20. stoljeća, svojedobno je postao poznat glumeći lik Turbo policajca u niskobudžetnim akcijskim filmovima. Prijatelji odlučuju upoznati svog idola iz djetinjstva i predstaviti mu ono što smatraju najboljim scenarijem za Turbo policajca ikada napisanim. Nakon niza loših odluka koje uključuju lokalnu i rusku mafiju, japanske yakuze koje krijumčare dijamante i još mnogo toga, trojica zaluđenih prijatelja odlučuju opljačkati producenta filma kako bi riješili sve svoje probleme..."
