  title: Passato e presente Il processo di Norimb
  subtitle: Passato e presente Il processo di Norimberga. Nazisti alla sbarra - 16 ottobre 1946. Nella palestra del carcere di Norimberga, davanti a una ristretta platea di giornalisti e osservatori, poco dopo l'una d
  description: |-
    i notte, si eseguono undici delle dodici condanne a morte decise dal tribunale militare internazionale contro i leader della Germania nazista. Hermann Goering sfugge all'impiccagione togliendosi la vita con una fiala di cianuro. E' l'epilogo di una vicenda cominciata nel periodo più buio della guerra scatenata da Hitler. Erano stati i rappresentanti in esilio dei paesi occupati dalla Wermacht i primi a chiedere che i responsabili del terrore nazista fossero costretti a rispondere pubblicamente dei loro crimini davanti a una corte di giustizia. Ma la strada che avrebbe portato al processo, alla nascita del diritto penale internazionale e alla codificazione di reati come la guerra di aggressione e il genocidio sarebbe stata lunga e tortuosa. Ai giuristi delle nazioni alleate era toccato l'arduo compito di immaginare gli strumenti legali necessari per portare in giudizio gli imputati di crimini senza precedenti, conciliando i diversi interessi politici e le diverse tradizioni giuridiche dei rispettivi paesi. In studio con Paolo Mieli, la prof.ssa Anna Foa. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio la prof.ssa Anna Foa Con la partecipazione di Matteo Marroni
