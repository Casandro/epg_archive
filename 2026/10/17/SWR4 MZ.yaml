  title: SWR4 Party
  subtitle: mit Jens Vogt
  description: "Sie feiern zuhause oder gemeinsam mit Ihren Freunden, Bekannten oder Verwandten? Wir liefern Ihnen die passende Partymusik!\n\nIhre Musikwünsche schnell und einfach per Mail ins Studio über SWR4.de oder die SWR4 App. Oder Sie rufen uns einfach an:\n\n0711 / 92 92 92 92   oder   06131 / 92 93 92 93 \n\nDer Südwesten tanzt und feiert: Jeden Samstag bis 23 Uhr mit der SWR4 Party."
