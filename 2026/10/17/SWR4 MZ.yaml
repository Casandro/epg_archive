  subtitle: 'Thema: Kochen'
  description: "Warum gelingt der Braten nicht? Wie blanchiere ich Gemüse richtig? Was muss ich beim \nFermentieren beachten? \n \nSie fragen, SWR4-Kochexperte Jörg Ilzhöfer antwortet und verrät Tricks und Kniffe. \n\nSie fragen, unsere Experten antworten.\n\nUnter der kostenlosen Telefonnummer  08000 70 4444  können Sie Ihre Fragen in der Sendung stellen.\n\nImmer samstags zwischen 10 und 12 Uhr geben Ihnen unsere Experten in der SWR4 Sprechstunde nützliche Tipps."
