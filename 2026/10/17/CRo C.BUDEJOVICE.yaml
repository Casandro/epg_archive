  title: Písničky z cizí kapsy
  description: Pavel Novák jako zpěvák uměl bigbít i balady, skladby dynamické i ty, které je třeba procítit v táhlých melodiích. Písnička Jen já vím vznikla v 60. letech, tedy v dekádě, jež se mu muzikantsky povedla asi nejvíc. A samozřejmě nejen jemu. Hity tenkrát rostly jako houby po dešti, což si lze připomínat i dnes, víc jak půl století od jejich vzniku. Patří mezi ně i skladba When A Man Loves A Woman, která se vedle mnoha úspěchů na hitparádových frontách, zařadila mezi písničky "trvalky". Vděčí za to především svému interpretovi, americkému soulovému zpěvákovi Percymu Sledgeovi. A právě u něj byl tenkrát Pavel Novák "nakupovat". Dodejme, že vůbec ne špatně. K poslechu zve Martin Schuster.
