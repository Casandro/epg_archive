  description: |-
    Horrorkomödie, USA 2025
    Während der Polizeichef endlich auf der richtigen Spur von Ryans Mörder zu sein scheint, versammelt Tracy die Gemeinde in der Kirche, um einen Exorzismus durchzuführen.

    Jordy und Spud haben herausgefunden, wie Ryan wirklich gestorben ist. Gemeinsam mit Dylan wollen sie die Gemeinde mit den wahren Ereignissen konfrontieren. Doch die Lage droht zu eskalieren. Es scheint, als sei niemand an der Wahrheit interessiert.
