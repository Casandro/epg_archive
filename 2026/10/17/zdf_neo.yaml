    Der Geologe Colin Devey begibt sich auf Spurensuche in Jordanien. Auf engstem Raum beherbergt das Wüstenland wichtige Rohstoffe für eine klimafreundliche Zukunft der Welt - allen voran Metalle.

    In Jordanien findet Colin Devey die "Großen Sechs", die wichtigsten Rohstoffe der Zukunft. Ob Windräder oder Elektroautos: Je mehr CO2 eingespart werden soll, umso stärker werden Metalle für grüne Technologien gebraucht.
