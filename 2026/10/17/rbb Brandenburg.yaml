  description: In Hengasch liegen die Nerven blank. Bei schönem Wetter donnern jedes Wochenende zig Motorräder mitten durch den Ort, denn wer auf seinem Bock eine Spritztour in die Eifel machen will, muss notgedrungen durch Hengasch. Den einen sind Besucher aus der Stadt willkommen, den anderen nicht. Denn wie das immer so ist, profitieren davon die Gastwirte, während sich die Bauern über den Lärm und zertrampelte Felder beschweren. Als eines Sonntagmorgens Anwalt Groll mit seiner Maschine unmittelbar vor dem Forsthaus tödlich verunglückt, ist schnell klar, dass der Unfall etwas mit der angespannten Lage im Dorf zu tun haben muss.
