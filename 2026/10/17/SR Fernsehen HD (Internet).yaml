- eventId: 863795
  start: 2026-10-17T07:45:00Z
  stop: 2026-10-17T08:15:00Z
  title: Sehen statt Hören
  subtitle: Fernsehen in Gebärdensprache
  description: 'Wiedersehen nach 30 Jahren: "Alice & der Aurifactor" - ein Film, der bis heute nachwirkt. Es ist ein außergewöhnlicher Kurzfilm, eine expressionistische Märchenfabel, die den Kampf der Gehörlosengemeinschaft in einer hörenden Welt untersucht. Regisseur Jörg Fockele thematisierte Ausgrenzung schon vor 30 Jahren in seinem Abschlussfilm der HFF München. Und bekam viel Aufmerksamkeit dafür. Es ist Zeit, sich an all das noch einmal zu erinnern - mit den SchauspielerInnen und MacherInnen von damals.'
- eventId: 864379
  start: 2026-10-17T08:15:00Z
  stop: 2026-10-17T08:45:00Z
  title: Junge Roma heute - zwischen Herkunft und Zukunft
  description: Wer sind die Sinti und Roma in unserer Gesellschaft, denen tief verwurzelte Vorurteile und Antiziganismus entgegenschlagen? Wir begleiten junge Roma, die mit Stereotypen aufräumen und für Selbstermächtigung einstehen; oft im Spagat zwischen Erbe, Identität und den Herausforderungen als Minderheit. Ihr Lernen, Arbeiten und Handeln sind angetrieben vom Ziel gelebter Vielfalt und echter Zugehörigkeit
- eventId: 864879
  start: 2026-10-17T08:45:00Z
  stop: 2026-10-17T09:00:00Z
  title: KlimaZeit
  subtitle: 'Moderation: Katha Jansen'
  description: "Geht KI auch klimafreundlich? Weltweit entstehen aktuell etliche Rechenzentren für künstliche Intelligenz. Mit immensem Energiehunger. Aber lässt sich der überhaupt nachhaltig decken? Wir sprechen mit Professor Wolfgang Maaß vom Deutschen Forschungszentrum für Künstliche Intelligenz darüber, wie der Energiebedarf von KI zukünftig gesenkt werden kann.  \nAußerdem: Macht eine Alge die Rinderzucht klimafreundlicher? In Australien wird genau daran geforscht. Denn die Alge sorgt dafür, dass die Kühe weniger Methan produzieren."
