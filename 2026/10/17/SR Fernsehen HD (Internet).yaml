    Im DFB-Pokal trafen beide Mannschaften zuletzt in der Saison 2019/20 aufeinander. Damals setzten sich die Saarländer im Elfmeterschießen durch. Diesmal sind die Gastgeber in der Favoritenrolle.

    Das sieht FCS-Trainer Giannikis auch so. Düsseldorf sei der größte Verein in der Liga und Aufstiegsfavorit Nummer 1.
