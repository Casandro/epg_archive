  title: Úžasné životy
  description: 'Karel Růžička podle Emila Viklického. Karel Růžička byl český klavírista, vynikající jazzový hudebník a pedagog. Mezi kolegy proslul tím, jak skvěle dokázal používat při hře intuici. Jazzový pianista a skladatel Emil Viklický patřil mezi jeho dlouhodobé spoluhráče a vzpomíná na něj jako na svůj hudební vzor i výborného partnera při koncertech. Autorka: Lenka Poláková Nechvátalová. Repríza.'
