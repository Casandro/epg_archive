  title: Awaken - Erwachen (Kirchenkonzert Teil 1)
  subtitle: Unterhaltung
  description: Unter der Leitung des Dirigenten Thomas Wolf spielt das Sinfonische Blasorchester Leutkirch mit Solist KMD Franz Günthner an der großen Orgel in der Kirche St. Marin in Leutkirch im Allgäu. Neben bereits bekannten Werken wie dem "Benedictus" des englischen Komponisten Karl Jenkins, der "Interstellarsuite" von Hans Zimmer oder der "Star Wars Suite" von John Williams kommen auch das "Concertino" von Thomas Trachsel oder die Symphony Nr. 3 "Planet Earth" des niederländischen Meisters Johan de Meij zur Aufführung. Unter dem Motto "Awaken - Erwachen" werden christliche Themen wie Dunkelheit, Hoffnung, Auferstehung, Leben" von Pastoralreferent Benjamin Sigg inhaltlich mit der symphonischen Musik verknüpft. Erster von zwei Teilen.
- eventId: 778706
  start: 2026-10-17T01:00:00Z
  stop: 2026-10-17T01:30:00Z
  title: Legt Zeugnis ab von der Hoffnung, die euch erfüllt! (Folge 9)
  subtitle: Spiritualität
  description: 'Hoffnung ist die wichtigste Kraftquelle, um das Leben bewältigen zu können. In jeder Situation verleiht sie Sinn, Trost und Freude. Als Christen schöpfen wir unsere Hoffnung aus den Verheißungen des Evangeliums. Die göttliche Tugend der Hoffnung befähigt uns, voll positiver Erwartung in die Zukunft zu blicken und auf die Ewigkeit zuzugehen. Der Hl. Papst Johannes Paul II. war von einer Vision der Hoffnung erfüllt: Entgegen allem Anschein bereitet Gott einen neuen Frühling für die Menschheit vor! Und er rief den Christen zu, ihre vordringliche Aufgabe sei es heute, Baumeister dieser Hoffnung zu sein. Exerzitien mit Pfr. Erich Maria Fink. Aufgezeichnet im November 2025, Kloster Brandburg  / Iller e.V..'
