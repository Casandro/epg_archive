  stop: 2026-10-17T02:45:00Z
  title: GRANDIOS zu Gast bei Frederik &  Gerrit Braun  (Teil 1)
  subtitle: Gespräch
  description: '"Wir sind in der glücklichen Lage, dass wir helfen können", meint Frederik Braun. Gemeinsam mit seinem Zwillingsbruder Gerrit hat er vor 25 Jahren das Miniatur Wunderland in Hamburg, die inzwischen größte Modelleisenbahn der Welt, gegründet. Warum es ihnen wichtig ist, von ihrem Erfolg etwas weiterzugeben, wie ein g u t e s M i t e i n a n d e r i n e i n e m Millionenunternehmen und in der eigenen Familie gelingen kann - darüber haben wir mit den beiden großen Träumern in Hamburg sprechen dürfen.'
- eventId: 778710
  start: 2026-10-17T02:45:00Z
  stop: 2026-10-17T03:15:00Z
  title: Mit Allem, was in mir ist
  subtitle: Dokumentation
  description: '"Mit allem, was in mir ist" - ist ein wundervolles Mosaik von sechs Seminaristen, die sich alle von tief geistlichen Motiven bewegt fühlen, ihre Leben als katholische Priester Gott zu weihen. Es sind sechs Geschichten von unterschiedlichen jungen Männern, die vor unterschiedlichen Herausforderungen stehen, ihrem Ruf treu zu bleiben, den sie in der tiefe ihres Herzens vernommen haben. Ein inspirierender Film, der zeigt, dass es Hoffnung auf eine Zukunft in der Kirche mit mutigen Männern gibt, die bereit sind, ihr Leben in der Nachfolge Christ hinzugeben.'
- eventId: 778711
  start: 2026-10-17T03:15:00Z
  stop: 2026-10-17T03:45:00Z
  title: 'Echt Jetzt?! - Highway To Heaven: Heilig werden'
  subtitle: Gespräch
  description: Echt Jetzt?! - das neue Format für junge Menschen. Was Jugendliche und junge Erwachsene bewegt - genau das ist Thema bei Chorherr Dirk, Tini und Samuel. Er kennt die beste Perspektive - bisher hinter der Kamera. Jetzt ist er selbst im Bild.
- eventId: 778712
  start: 2026-10-17T03:45:00Z
  stop: 2026-10-17T04:00:00Z
  title: Jesus Glauben (Folge 2)
  subtitle: Spiritualität
  description: 'Diese 15-teilige Reihe handelt von Jesus von Nazaret. Es ist aber kein Portrait  keine Beschreibung seiner Lehren  kein Überblick über sein Wirken. Wir wollen in diesen Episoden grundlegender fragen: Was kann man von Jesus wissen? Was kann man von ihm glauben? Wie verlässlich sind die Evangelien? Und wie stellen sie jenen jüdischen Rabbi dar, in dem Billionen von Menschen ihren Erlöser sahen und sehen? Das sind die Fragen, um die es hier gehen soll. Durch die Reihe führt Kpl. Johannes Maria Schwarz. Folge 02 - Über die Suche nach dem historischen Jesus.'
