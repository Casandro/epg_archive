  description: In Waalwijk geeft interieurstylist Theo-Bert de slaapkamer van Wendy en Jeffrey een complete make-over. En nu Theo-Bert toch bezig is, neemt hij ook het balkon even mee. * Chef-kok Ramon maakt zelf gnocchi met een romige saus van gemengde paddenstoelen, witte wijn en verse kruiden. Daarbij serveert hij een Siciliaanse cotoletta. * Ooit ontwierp Jos interieurs voor welgestelde klanten. Tegenwoordig brengt hij zijn dagen door in een oude kas in Arnhem, waar hij groenten en planten kweekt. * De 21-jarige Tess laat de mooiste plekken van haar stad Groenlo zien. Ze kanoot over de vestinggracht en neemt ons mee naar het plaatselijke carnaval. (2026)
