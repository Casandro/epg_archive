  description: 'Moeders die vooraf afspreken 49 uur kraamzorg te ontvangen, krijgen uiteindelijk vaak de helft of zelfs minder dan het wettelijk minimum van 24 uur. Maar liefst 69% van de kraamvrouwen uit het Radar Panel heeft hiermee te maken. Wat zijn de gevolgen hiervan? Sophie Hermans, minister van Volksgezondheid, Welzijn en Sport reageert. En: Bij Radar komen veel klachten binnen over verhuisbedrijf ''t Hoentje & Van der Zalm uit de regio Den Haag. Zelf presenteren ze zich als een betrouwbaar familiebedrijf, maar klanten klagen over kapotte meubels, zoekgeraakte spullen en niet-uitgekeerde schadevergoedingen. Fons gaat op zoek naar de eigenaren. (2026)'
