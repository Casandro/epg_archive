  title: ANIXE auf Reisen - Tansania
  description: Nyumbani bedeutet Zuhause. In dieser Reportage geben wir Ihnen einen Einblick in ein Projekt, dass es alleinerziehenden Müttern ermöglicht, in ein eigenes, gut versorgtes neues Zuhause zu ziehen, um sich und ihren Kindern eine bessere Zukunft zu ermöglichen. Also Hilfe zur Selbsthilfe. Tansania ist eines der ärmsten Länder der Welt. Vor allem Mütter, die ihre Kinder alleine groß ziehen müssen, haben es hier schwer. Häufig werden sie von ihrer Familie ausgestoßen. Die Hilfsorganisation DESWOS hat sich daher zum Ziel gesetzt, gegen Wohnungsnot und Armut in den Entwicklungsländern anzukämpfen. Das Projekt unterstützt nicht nur Mütter und ihre Kinder in Notsituationen, sondern schafft mit seinem Engagement auch Arbeitsplätze.
  widescreen: true
