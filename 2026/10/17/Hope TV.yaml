  title: Atem der Hoffnung
  subtitle: Aus dem Boot steigen
  description: |-
    Predigt mit Nils Dreiling


    In stürmischer See sind die Freunde Jesu in einem Fischerboot auf sich alleine gestellt. Wie gehen sie mit dieser Krise um? Welche Erfahrungen machen sie? Was kann der Mensch im 21. Jahrhundert daraus lernen?


