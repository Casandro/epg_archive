  title: Cliff!
  subtitle: Physik der Liebe
  description: |-
    Mit einer warmherzigen und zugleich tiefgründigen Analogie erklärt Cliff Goldstein, warum Gott den Menschen mit echter Entscheidungsfreiheit schuf - trotz aller Risiken von Leid und Sünde. Ausgehend von seiner persönlichen Erfahrung mit Haustieren vergleicht er einen echten Hund mit einem Roboterhund und zeigt: Wahre Liebe erfordert Freiheit. Goldstein verbindet diese Einsicht mit der biblischen Botschaft und dem Erlösungsplan, der im Kreuzestod Jesu gipfelt. Ein bewegender Vortrag über den Wert von Freiheit, die Kosten der Erlösung und die Hoffnung auf eine Welt ohne Leid.

    Weitere Infos unter: www.hopetv.de
