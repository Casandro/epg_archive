  title: Hope Gottesdienst
  subtitle: Öl ohne Ende! - Dominik Gelke
  description: |-
    Was tun, wenn die eigenen Kräfte und Möglichkeiten erschöpft sind? Die Geschichte einer Witwe aus 2. Könige 4 zeigt: Wo wir nur noch einen kleinen Rest sehen, kann Gott bereits großes Potenzial erkennen. Elisa fordert die Frau auf, das Wenige, das sie noch hat, einzusetzen - und Gott macht daraus etwas scheinbar Unmögliches.

    Diese Predigt ermutigt dazu, Gott auch in Situationen zu vertrauen, in denen wir selbst keinen Ausweg mehr sehen. Denn Gott kann mit dem, was uns klein und unbedeutend erscheint, mehr bewirken, als wir für möglich halten.

