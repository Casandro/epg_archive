  title: Mare Radio
  subtitle: mit Nikolas Golsch
  description: 'Wenn man die ganze kanadische Küstenlinie entlang laufen wollte und täglich 20 Kilometer schafft, dann würde das mehr als 30 Jahre dauern: Die kanadische Küste ist nämlich mehr als 200.000 Kilometer lang. Dieses riesige Land grenzt an den Pazifik, den Atlantik und das arktische Meer - und das Leben vieler Menschen ist von je her vom Meer geprägt. Wir nehmen Sie mit zum Whale Watching, besuchen die "Welthauptstadt" der Eisbären und entdecken nachhaltige Meerestechnologien.'
  genre:
  - '130'
