  title: 'Bike Mike: Traumtour Südafrika - Über den Tsitsikamma bis nach Plettenberg Bay'
  subtitle: 'Bike Mike: Traumtour Südafrika - Über den Tsitsikamma bis nach Plettenberg Bay'
  description: Um der kalten dunklen Jahreszeit zu entfliehen, haben wir uns in den Flieger gesetzt und auf der anderen Seite der Erde den sommerlichen westlichen Teil Südafrikas mit dem eBike erkundet. Hier seht ihr nun den Beginn der Reise mit den ersten beiden Fahrtagen. Nach unserer Ankunft in Südafrika gönnen wir uns zunächst einen Tag ohne Rad und besuchen sowohl den Addo Elefant National Park, als auch das Alexandria Dünenfeld. Besser kann die Reise nicht starten, denn jede Menge afrikanische Tiere und kilometerlange Sanddünen versetzen uns sofort in grenzenlose Urlaubsstimmung! Am zweiten Tag starten wir dann die Radreise mit einem famosen 60 km langen Teilstück der Garden Route entlang bis zum Tsitsikamma National Park. Wir haben uns hier in Südafrika erstmalig auf einen externen Partner verlassen, der uns Räder sowie einen Bus samt Fahrer zur Verfügung stellt, um die perfekte Route fahren zu können. D.h. wir fahren mit dem eBike nur die schönsten Strecken, die Überführungsetappen werden wir mit dem Bus geshuttelt. Das hat u.a. auch den Vorteil, dass wir kein Gepäck am Rad haben, denn unser Begleitfahrzeug ist immer kurz hinter uns. Nachdem wir uns die Mündung des Storms Rivers mit seiner atemberaubenden Hängebrücke angesehen haben, beginnen wir den zweiten Streckenabschnitt. Auf der alten R 102 geht es über den abenteuerlichen Bloukrans Pass ins sagenhafte Natures Valley. Dort gibt es einen kilometerlangen Sandstrand der Superlative, den wir ausgiebig genießen, bevor wir in Plettenberg Bay Episode 1 beenden. DE 2023
- eventId: 795605
  start: 2026-10-17T15:25:00Z
  stop: 2026-10-17T16:08:00Z
  title: 'Bike Mike: Traumtour Südafrika - Über die Garden Route in die kleine Karoo'
  subtitle: 'Bike Mike: Traumtour Südafrika - Über die Garden Route in die kleine Karoo'
  description: In dieser Episode seht ihr den faszinierenden Abschnitt von Plettenberg Bay bis nach Montagu. Wir starten mit einer einmaligen kleinen Küstenwanderung auf dem Robberg. Seehunde und atemberaubende Strandformationen säumen den Weg. Anschließend geht es in die wunderschöne Lagune von Knysna, wo wir sowohl an den Knysna Heads, als auch an der Waterfront kurz stoppen. Kurze Zeit später sitzen wir auf dem eBike und fahren über den Alten Phantom Pass nach Sedgefield. Am nächsten Tag verlassen wir die Küste und fahren in die Halbwüste der kleinen Karoo. Auf einer einsamen Piste durchqueren wir diese bizarre Schönheit, die uns komplett in ihren Bann zieht. Unser Ziel ist Oudtshoorn, die Straußenmetropole in Südafrika. Hier besuchen wir noch am gleichen Tag eine Straußenfarm und lassen den Tag bei einem schmackhaften südafrikanischen Braai (Grillabend) ausklingen. Am nächsten Morgen geht es bereits um 4 Uhr raus aus den Federn - die Erdmännchen rufen! Anschießend gibts ein kurzes Frühstück und schon sind wir wieder in der pittoresken Tropfsteinhöhlenlandschaft der Cango Caves unterwegs. Und Radgefahren wird auch noch, nämlich auf tollen Pfaden zurück nach Oudtshoorn. Ein Tag ist schöner, als der andere! DE 2023
- eventId: 795606
  start: 2026-10-17T16:15:00Z
  stop: 2026-10-17T16:42:00Z
  title: 'Bike Mike: Traumtour Südafrika - Aus der Weinregion zurück an den Atlantik'
  subtitle: 'Bike Mike: Traumtour Südafrika - Aus der Weinregion zurück an den Atlantik'
  description: In dieser Episode seht ihr den irren Abschnitt von Montagu bis Gordons Bay. Wir starten in Montagu und durchqueren zunächst einen pittoresken, Wind gepeitschten Slot Canyon, bevor wir im fruchtbaren Breede River Tal genussvoll durch die von unendlich vielen Trauben geschwängerten Weinreben hindurch cruisen. Nach einer lauschigen Bootsfahrt auf dem Breede River erreichen wir dann Robertson, unser heutiges Etappenziel. Am nächsten Tag starten wir dann nach einem kurzen Transfer zur Küste in Kleinmond. Die perfekt asphaltierte Küstenstraße bringt uns nach Betty's Bay, wo wir dekorativ posierende Brillenpinguine beobachten können. Anschließend erhaschen wir den ersten Blick auf das kolossale Tafelbergmassiv und krönen den Tag mit einer atemberaubenden Fahrt im warmen Nachmittagslicht auf der fantastischen Küstenstraße nach Gordons Bay. Ein Tag ist schöner, als der andere! Kommt mit mit uns! DE 2023
- eventId: 795619
  start: 2026-10-17T16:45:00Z
  stop: 2026-10-17T17:10:00Z
  title: 'Bike Mike: Traumtour Südafrika - Vom Kap der Guten Hoffnung nach Kapstadt'
  subtitle: 'Bike Mike: Traumtour Südafrika - Vom Kap der Guten Hoffnung nach Kapstadt'
  description: In dieser finalen, vierten Episode machen wir den Deckel drauf - wir erreichen nach 10 Tagen Kapstadt! Wir starten diese Etappe in Gordons Bay und besuchen zunächst ein von African Bikers unterstütztes Kindergarten Projekt. Anschließend gehts weiter in den Cape Point National Park, wo wir uns von den wind- und wellengepeitschten Felsen des süd-westlichsten Punkts Südafrikas faszinieren lassen. Wir stehen am berühmten Kap der Guten Hoffnung! Jetzt geht es auf die eBikes und wir cruisen gemütlich durch den weitläufigen National Park Richtung Norden. Auf einer famosen Küstenstraße geht es vorbei an quirligen Kite-Surfern nach Noordhoek und weiter auf den atemberaubenden Chapmans Peak Drive. Diese kurvenreiche Strecke gehört zu den spektakulärsten Küstenstraßen der Welt, denn sie windet sich entlang der Klippen, die steil zum Meer abfallen. Die Aussicht auf den Ozean und die Berge ist einzigartig, und es gibt viele Gelegenheiten, an Aussichtspunkten anzuhalten, die wir auch tüchtig nutzen. Angekommen in Kapstadt, genießen wir diese Weltmetropole bei perfektem Wetter in vollen Zügen. Ein ausführlicher Stadtrundgang bringt uns zur lebhaften Waterfront, ins farbenfrohe Bo-Kaap, die gesellige Innenstadt, auf den erhabenen Tafelberg, in den sagenhaften Botanischen Garten nach Kirstenbosch und zur grandiosen Badebucht der Camps Bay! Ein irrer Abschluss einer irren eBike Reise!!! Kommt mit mit uns! DE 2023
- eventId: 795620
  start: 2026-10-17T17:15:00Z
  stop: 2026-10-17T17:40:00Z
  title: VIP Trip - Prominente auf Reisen 7 - San Francisco mit Heino Ferch
  subtitle: VIP Trip - Prominente auf Reisen 7 - San Francisco mit Heino Ferch
  description: 'San Francisco: Stadt der steilen Straßen, viktorianischen Fassaden und Reiseziel des Schauspielers Heino Ferch. Zwischen den farbenfrohen Wandgemälden im Mission District, vielen weitläufigen Parks und dem einzigartigen und unkonventionellen Hippie-Flair von Haight-Ashbury spürt er dem Geist der 60er-Gegenkultur-Bewegung nach und taucht ein in die kreative Seele der Stadt. Die berühmten Hügel San Franciscos erkundet er mal zu Fuß, mal mit dem E-Bike - und wagt damit sogar die Fahrt über die eindrucksvolle Golden Gate Bridge, von wo sich ihm ein spektakulärer Blick auf die Bucht eröffnet. Eine Tour im bunt bemalten Hippie-Bus führt ihn zurück in die Zeit der Flower Power, dem freiem Lebensgefühl und der Spuren des "Summer of Love" 1967. Heino Ferch erlebt die Stadt aber nicht nur als Kulisse, sondern begegnet auch ihren Menschen, die San Francisco mit Herzblut prägen. So auch in Chinatown, wo Heino Ferch in eine Welt aus Tempeln, Garküchen und traditionellen Märkten eintaucht. Hier erzählt jede Straßenecke von Herkunft und Tradition, wie er unter anderem beim Besuch einer Glückskeksfabrik erfährt. Wenige Straßen weiter erlebt er einen anderen Rhythmus der Stadt: Die historischen Cable Cars rattern wie seit über hundert Jahren die Hügel hinauf, während autonome Fahrzeuge lautlos und fahrerlos durch den Verkehr navigieren. Vergangenheit und Zukunft teilen sich hier ganz selbstverständlich dieselben Straßen. Das alles und mehr in einer neuen Reisereportage von und mit Schauspieler Heino Ferch und seinen Streifzügen durch eine Stadt, die wie kaum eine andere für Aufbruch, Vielfalt und Lebensfreude steht. US 2026'
- eventId: 795642
  start: 2026-10-17T17:45:00Z
  stop: 2026-10-17T18:09:00Z
  title: VIP Trip - Prominente auf Reisen 7 - Macau mit Andrea Kiewel
  subtitle: VIP Trip - Prominente auf Reisen 7 - Macau mit Andrea Kiewel
  description: 'In dieser Folge reist die TV-Moderatorin Andrea "Kiwi" Kiewel in die chinesische Sonderverwaltungszone Macau. Es ist ihr erster Besuch in der ehemaligen portugiesischen Kolonie am Perlfluss-Delta, nur eine 45 Minuten dauernde Busfahrt vom Flughafen Hongkong entfernt. Auf etlichen Streifzügen erforscht die Moderatorin die Stadt, die sich mit ihren rund 750.000 Einwohnern gerade einmal über eine Fläche von der Größe Lindaus erstreckt. Ihren ersten Eindruck fasst "Kiwi" so zusammen: "Überall in der Stadt sehe ich wunderbar restaurierte und liebevoll gepflegte Gebäude aus der Kolonialzeit. Das trägt ungemein zum südländischen Charme bei, den Macau ausstrahlt. Beeindruckend ist auch, wie sehr chinesische und portugiesische Lebensart miteinander verwoben sind!" Doch Andrea Kiewels Interesse gilt auch Macaus Luxus-Hotellerie und der macanesischen Küche, die in der Stadt ein bedeutendes Kulturgut ist, das entsprechend liebevoll gepflegt und gehegt wird. Etwas "Action" darf in dieser Episode natürlich auch nicht fehlen. Der Bungee-Sprung von der Außenplattform des Macao-Towers in mehr als 220 Meter Höhe gilt allgemein als einer der spektakulärsten Nervenkitzel weltweit. "Kiwis können nicht fliegen", sagt die Moderatorin und war sich anfangs überhaupt nicht sicher, ob sie etwa beim "Indoor Fallschirmspringen" im Windtunnel teilnehmen soll. Hat sie es gewagt? Mehr dazu und noch weitere Erlebnisse in dieser sehr persönlichen Reisereportage von und mit Andrea Kiewel. CN 2025'
- eventId: 795646
  start: 2026-10-17T18:15:00Z
  stop: 2026-10-17T19:07:00Z
  title: Deutschlands Küsten - Sylt, Föhr und Amrum
  subtitle: Deutschlands Küsten - Sylt, Föhr und Amrum
  description: "Der fünfte Teil der Reise entlang der deutschen Küsten führt auf die Inseln Sylt, Föhr und Amrum, auch die drei Schwestern genannt. In Seebüll beginnt die fünfte Etappe der Reise entlang Deutschlands Küsten. Hier malte Emil Nolde seine schönsten Bilder, inspiriert durch seinen Blumengarten. Heute kümmert sich Gärtner Andreas Weber um das Erbe des Malers. Über den elf Kilometer langen Hindenburgdamm geht es nach Sylt, beliebteste Ferieninsel der Deutschen. Bei Ebbe werden die Anbaubänke der Sylter Royal sichtbar. Der Geschmack dieser Austern gilt als einzigartig. Weiter geht es über das Rote Kliff. Die 50 Meter hohe \nSteilküste ist gefährdet. Meter für Meter zieht sich das Land im Herbst unter dem Druck der Sturmfluten zurück. Den Sand, den das Meer fordert, holen sich die Sylter zurück und pumpen Millionen Kubikmeter wieder an den Strand. Im Süden von Sylt, bei Hörnum, arbeitet die Strandkorbmacherin Svenja Trautmann. Ihre Familie stellt die Körbe seit Generationen her. Heute gelangen Sylter Strandkörbe - in individueller Ausfertigung - in die ganze Welt. Auf der Nachbarinsel Föhr gibt es die typischen norddeutschen reetgedeckten Häuser. 30 Jahre hält das Reet, dann wird es brüchig, isoliert im Winter nicht mehr und muss ausgetauscht werden. Helga Wögens bewirtschaftet den einzigen Bio-Milchhof der Insel. Doch sie bewahrt sich neben der harten Arbeit Zeit für eine Leidenschaft, die Utersumer Trachtengruppe. Die Insel Amrum trägt an ihrer Westseite einen 15 Kilometer langen Schutzgürtel aus Sand, den  sogenannten Kniepsand. Vom Tonnenlegerhafen legt Wolfgang Stöck mit seiner Crew täglich ab zur Inspektion der Leuchttonnen und Leuchttürme vor Amrum. \"Die Menschen denken bei Seezeichen heute nur an die Romantik, vergessen aber, wie gefährlich die Küste heute noch ist\", sagt Stöck. DE 2010"
- eventId: 795654
  start: 2026-10-17T19:15:00Z
  stop: 2026-10-17T20:07:00Z
  title: Deutschlands Küsten - Flensburg nach Eckernförde
  subtitle: Deutschlands Küsten - Flensburg nach Eckernförde
  description: 'Ab der sechsten Folge führt die Reise entlang der Ostsee. Deutschlands nördlichster Ostseezugang liegt in Flensburg. Von hier brachen die Segler im 18. Jahrhundert in die Karibik auf, um das flüssige Gold Westindiens zu holen, den Rum. Für Martin Johannsen hat das Zuckerrohrdestillat immer noch, etwas Anrüchiges, ein reines "Seefahrergetränk". Doch es hat sich zur begehrten und edlen Spirituose entwickelt. Die Johannsens beliefern die Gastronomie der Stadt und vertreiben ihre raffinierten Rumsorten über das Internet. In der Flensburger Förde strahlt Schloss Glücksburg. Das Wasserschloss spiegelt die Machtentfaltung der dänischen Könige und Herzöge von Schleswig-Holstein wider. Hausherrin ist heute Prinzessin Elisabeth. Sie hat das Schloss für Besucher geöffnet. Entlang der Küste der Halbinsel Angelns geht es bis zur Geltinger Birk. Hier leben die einzigen Wildpferde Norddeutschlands. Sie teilen sich das renaturierte Land mit wildlebenden Rindern und seltenen Amphibien. Die Landschaft der Ostseeküste zieht bis heute Künstler in den Bann. Täglich malt der Kunstprofessor Klaus Fußmann im Sommer an der Steilküste von Kronsgaard. Nur wenige Kilometer weiter befindet sich Arnis, die "Perle der Schlei", mit 300 Einwohnern die kleinste Stadt Deutschlands. Entlang der Schlei geht es tief ins Landesinnere nach Schleswig. Aus der Luft entdeckt man schnell den Wall der alten Wikingersiedlung Haithabu. Reinhard Erichsen ist einer der "Wikinger", die hier im Sommer wohnen und die alten Zeiten zum Leben erwecken. Wieder quer durchs Land geht es nach Eckernförde zur Unterwassersuche nach leuchtenden Quallen. In riesigen Schwärmen suchen sie im Sommer die Strände heim und verderben so manchem mit ihrem brennenden Gift den Badespaß. Im Eckernförder Hafen liegt gerade eines der modernsten U-Boote der Welt: U-32. Karolin Peters ist neben 27 Männern die einzige Frau der Mannschaft. DE 2010'
