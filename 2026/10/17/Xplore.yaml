  title: 'Bike Mike: Verona - Venedig - Etappe 2: Von Vicenza nach Padua'
  subtitle: 'Bike Mike: Verona - Venedig - Etappe 2: Von Vicenza nach Padua'
  description: Hier seht ihr den zweiten Teil unserer tollen 3-Tages-Tour von Verona nach Venedig. Die zweite Etappe führt uns von der Palladio Stadt Vicenza auf einer sagenhaft schönen Radstrecke bis nach Padua. Inmitten der wärmenden Frühjahrssonne tuckern wir immer dem Fluss Bacchiglione folgend durch das ländliche Venetien. Vorbei an prunkvollen venezianischen Villen, majestätischen Burganlagen sowie einer altehrwürdigen Klosteranlage genießen wir diese fantastische Tour in vollen Zügen. Kommt einfach mit und seht selbst! DE 2022
