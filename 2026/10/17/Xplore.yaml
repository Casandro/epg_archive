  title: VIP Trip - Prominente auf Reisen 6 - Adschman mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 6 - Adschman mit Eva Habermann
  description: 'Das Emirat Adschman ist der Geheimtipp für einen unvergesslichen Urlaub am Persischen Golf. Das findet auch Schauspielerin Eva Habermann auf ihrer ganz persönlichen Entdeckungsreise durch das kleinste Emirat der Vereinigten Arabischen Emirate. In unmittelbarer Nachbarschaft zu Dubai erholt sie sich an den sauberen feinen Sandstränden im Osten der Arabischen Halbinsel. Sie gehören zu den Luxus-Hotels, die mit einem sehr guten Preis-Leistungsverhältnis punkten. Hier kann man sich so richtig verwöhnen lassen! Nicht weit entfernt taucht Eva Habermann in die arabische Kultur und die Vergangenheit Adschmans beim Besuch des "Ajman Museum" ein. Zusammen mit Gästeführer Tariq erkundet sie die alte Festung und erfährt dabei mehr über die Geschichte und die Fischerei des Emirats. Ein Besuch auf dem lokalen Fischmarkt macht deutlich, dass die Fischerei nicht nur früher ein wesentlicher Berufszweig war. Etwas weniger als 100 Kilometer entfernt liegen Adschmans Exklaven: die Oase Manama und weiter südlich die vom Hadschar-Gebirge umgebene Stadt Masfout. Dort besucht Eva mit Tariq die alte Burg, welche nun als Museum dient und die vor 200 Jahren zur Abwehr von Banditen aus dem nahegelegenen Oman errichtet wurde. Die Landwirtschaft prägt diese Gegend, wie Eva bei dem Besuch einer Palmen-Plantage erfährt. Die Landschaft um Adschman besteht größtenteils aus Sandwüste. Das lädt zu einer aufregenden Wüsten-Safari auf dem Weg zu einem Camp ein! Neben einem unterhaltsamen Showprogramm genießt Eva abends die unfassbare Stille inmitten von Sanddünen. Auch Kamelrennen kann man hier beobachten! Zurück in der Stadt taucht Eva in das Grün und Blau eines ausgedehnten Mangrovenwaldes ein, genießt die abwechslungsreiche arabische Küche und die Gastfreundlichkeit der Menschen bei einem würzigen arabischen Kaffee mit Datteln im Emirat Adschman. AE 2023'
- eventId: 795542
  start: 2026-10-17T05:50:00Z
  stop: 2026-10-17T06:15:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Umag mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 6 - Umag mit Falk-Willy Wild
  description: Sie wollen in der Nebensaison mal so richtig ausspannen? Aber auch Kultur und Kulinarik sollen nicht zu kurz kommen? Und eine Ferndestination kommt auch nicht infrage? Wie wäre es dann mit Kroatien, dem nördlichen Teil der Halbinsel Istrien? Das dachte sich auch Schauspieler Falk-Willy Wild und hat für Sie die Küste rund um die Stadt Umag, aber auch das Hinterland bei Brtonigla in Augenschein genommen. Dabei hat er so manch schönes Fleckchen Erde entdeckt. Auf seinen Ausflügen stößt er auf Spuren aus der Römerzeit und erkundet ausgedehnte Olivenhaine und Weinberge. Und natürlich auch die vielfältige mediterrane Küche! Radfahren, Wandern, Tennis und ein attraktives Wellness-Angebot runden sein Programm ab. So verbringt Falk-Willy Wild auch abseits der Hauptsaison eine abwechslungsreiche und entspannte Reise in Nordistrien. HR 2023
