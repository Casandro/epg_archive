  title: 'Bike Mike: Durch die Toskana - Teil 1: San Gimignano - Siena'
  subtitle: 'Bike Mike: Durch die Toskana - Teil 1: San Gimignano - Siena'
  description: Hier seht ihr die erste Etappe unserer Toskana Rundfahrt von San Gimignano nach Siena. Wir haben unsere Rad-Saisoneröffnung dieses Jahr mitten nach Italien gelegt. In 6 Etappen sind wir insgesamt 380 km mit jeder Menge Höhenmeter in einer Rundreise durch die traumhafte Toskana gefahren. Dabei haben wir neben der malerischen Landschaft mit ihren Zypressen, Olivenhainen und Weinreben übersäten Hügeln u.a. die kulturhistorischen Städte San Gimignano, Siena, Florenz, Lucca, Pisa und Volterra genossen. Auch dem Mittelmeer haben wir einen Besuch abgestattet und das leibliche Wohl kam natürlich auch nicht zu kurz. Alles in allem ein traumhafter Einstieg in die ereignisreiche Radsaison. Kommt einfach mit und begleitet uns auf dieser wunderschönen Reise! DE 2022
