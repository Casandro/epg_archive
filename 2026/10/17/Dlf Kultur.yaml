  title: Aus den Archiven
  description: |-
    Albert Camus
    Die Sinnsuche im Absurden
    Von Paul Schallück, Hans-Ekkehard Bahr
    RIAS 1960 und Deutschlandfunk 1966
    Vorgestellt von Isabella Kolar

    "Die höchste Form der Hoffnung ist die überwundene Verzweiflung? - sagte er über das Leben. Albert Camus (1913-1960) war ein wegweisender französischer Schriftsteller, Philosoph und Literaturnobelpreisträger, dessen Werke den Existenzialismus und die Philosophie des Absurden entscheidend prägten. Sein Mythos des Sisyphos (1942) fasst seine Philosophie des Absurden zusammen. Sisyphos rollt ewig einen Stein den Berg hinauf, der immer wieder herabrollt. Trotz dieser sinnlosen und endlosen Quälerei findet er Sinn im Kampf selbst und bejaht sein Schicksal.
