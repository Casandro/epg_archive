  title: P.M. Wissen
  subtitle: u.a. Wie lebendig ist Totholz? - Was die Forstwirtschaft von Urwäldern lernt
  description: 'Urwälder sind Ökosysteme, die Jahrtausende unberührt bleiben. Eins ihrer markanten Merkmale ist Totholz: Erreicht ein Baum sein Lebensende, stürzt er um und seine Überreste bleiben auf dem Waldboden. Doch genau in diesen Relikten bildet sich ein neuer Lebensraum für Insekten und Kleinstlebewesen. "P.M. Wissen" besucht einen der letzten Urwälder Europas, den Rothwald in Niederösterreich. Hier entdecken Insektenforscher auf einer nächtlichen Expedition, welches Leben aus gestorbenen Bäumen entsteht und was unsere Forstwirtschaft vom lebendigen Totholz lernen kann. // Die Zebramuschel misst nur wenige Zentimeter - und soll doch Großes für die Wissenschaft leisten. Forscher wollen die Muschel und andere Kleinstlebewesen nutzen, um die Wasserqualität von Seen und Flüssen zu bewerten. Wissenschafter beobachten das Öffnen und Schließen der Muschel, denn das dient ihr nicht nur zur Nahrungsaufnahme, sondern zeigt auch an, ob es ihr insgesamt im Gewässer gut geht. // Etwa 400.000 Tonnen Soja importiert Österreich jährlich: Der Großteil kommt aus den USA, Brasilien oder Argentinien. Doch in diesen Ländern gelten andere Anbauregeln: Hier darf mit genmanipulierten Pflanzen und Pestiziden gearbeitet werden, die in der EU nicht erlaubt sind. Deswegen setzt Österreich zunehmend auf nachhaltigen, heimischen Anbau - mittlerweile ist Soja auf Platz 4 der Anbauflächen. Aber wie züchtet man überhaupt eine "Super-Bohne" ohne Genmanipulation? // Wie wissen wir als Verbraucher, ob in unseren Lebensmitteln Genfood steckt? In Österreich müssen gentechnisch veränderte Lebensmittel ab einem Anteil von 0,9 Prozent in der Zutatenliste gekennzeichnet werden - bislang. Denn die EU-Kommission will die Kennzeichnungspflicht abschaffen. Warum?Österreich 2023'
  genre:
  - '144'
  widescreen: true
