  title: Ocean's Thirteen
  description: |-
    Reuben Tishkoff ist wieder hereingelegt worden. Diesmal ist es Willie Bank (Al Pacino), der den alternden Casinobesitzer über den Tisch zieht. Bank ist der Eigentümer eines neuen, riesigen Casinos in Las Vegas. Vor Kummer endet Reuben sogar im Krankenhaus. Um den alten Kompagnon zu rächen, vereint Danny Ocean (George Clooney) erneut die Mitglieder seiner Diebesbande, darunter Rusty Ryan (Brad Pitt) und Linus Caldwell (Matt Damon). Die Gangster wollen Banks Casino am Eröffnungstag komplett lahmlegen. Ziel ist vor allem ein Supercomputer im Untergeschoss. Dieser Computer kann überprüfen, ob die Gefühle des Gewinners echt sind und so Falschspieler überführen. Die Ocean-Bande gelingt es nicht, mit einem Tunnelbohrer zum Computer vorzudringen. Danny benötigt die Hilfe seines Erzfeindes Terry Benedict (Andy Garcia). Aber der Casino-Mogul fordert als Gegenleistung Banks Diamanten. Was den Coup noch gefährlicher macht.

    In "Ocean's Thirteen", dem dritten Teil der "Ocean"-Filmreihe, müssen Danny Ocean und Konsorten erneut ihre Fähigkeiten als Taschenspieler, Mechaniker, Trickdiebe und Sprengstoffexperten unter Beweis stellen. Die straffe Inszenierung von Regisseur Steven Soderbergh konzentriert sich primär auf die Durchführung des komplexen Raubzugs, wobei Selbstironie und Wortwitz die Handlung wiederum komödiantisch auflockern. Hochkarätig die Besetzungsliste, angeführt von George Clooney (Danny Ocean) und Brad Pitt (Rusty): Matt Damon (Linus), Andy Garcia (Terry Benedict) sowie erstmals in einem "Ocean"-Film Al Pacino als skrupelloser Bösewicht Willie Bank.
    Thriller, Vereinigte Staaten Von Amerika 2007, R: Steven Soderbergh
  widescreen: true
- eventId: 681070
