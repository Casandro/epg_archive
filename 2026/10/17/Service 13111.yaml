  description: "Warum scheint heute kaum noch etwas ohne Künstliche Intelligenz zu funktionieren? Wie durchdringt KI unser Leben? Von der Automatisierung alltäglicher Aufgaben bis hin zur Revolution ganzer Branchen: Wie verändert KI unsere Art zu arbeiten, zu denken und zu leben? \nKönnen Maschinen wirklich \"denken\"? Was unterscheidet menschliche Kreativität von der Mustererkennung der KI? Wie beeinflusst KI unsere Demokratie, unser Zeitgefühl und unsere Vorstellung von Fortschritt?\nFührende Experten diskutieren Chancen, Risiken und ethische Fragen rund um diese bahnbrechende Technologie. Sind wir bereit für eine Welt, in der Maschinen immer intelligenter werden?\nDokumentarfilm, Kanada 2025, R: Leo Singer, Michel D.T. Lam  , Pierre-Luc Robillard"
