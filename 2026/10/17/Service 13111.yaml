  stop: 2026-10-17T22:15:00Z
  title: Braven
  description: "Für den kanadischen Holzfäller und Unternehmer Joe Braven (Jason Momoa) wäre es eine gute Gelegenheit, dass zerrüttete Verhältnis zu seinem Vater Linden zu kitten. Der an Demenz erkrankte, zunehmend verwirrte Linden braucht unbedingt Pflege und Betreuung. Doch weder Joe noch seine Ehefrau Stephanie fühlen sich dazu in der Lage. Stephanie macht deshalb den Vorschlag, Vater und Sohn sollten zur familieneigenen Blockhütte in die schneebedeckten Blue Mountains fahren. Vielleicht kann Joe dort Linden davon überzeugen, sich in ein Pflegeheim einweisen zu lassen. Als die beiden ankommen, hat sich ihnen zur Überraschung Joes seine kleine Tochter Charlotte angeschlossen. Dann entdeckt Joe eine Tasche voller Kokain in der Hütte. Das Rauschgift wurde dort von einem seiner Lkw-Fahrer, dem Gelegenheits-Schmuggler Weston, deponiert. Die Lieferung ist für den Drogenboss Kassen bestimmt. Und der befindet sich mit seiner schwer bewaffneten Bande bereits auf dem Weg zur Blockhütte. Schon bald muss Joe mit seiner Familie ums Überleben kämpfen. \n\nRegisseur Lin Oeding hat seinen spannenden Action-Thriller \"Braven\" in der tief verschneiten, zerklüfteten Berglandschaft Neufundlands angesiedelt. Der tapfere Joe und seine Familie müssen deshalb nicht nur gegen eine brutale Drogenbande kämpfen, sondern auch meterhohen Schnee und eisige Temperaturen bewältigen. Die Hauptrolle des besorgten Familienoberhaupts Joe spielt erstaunlich facettenreich Action-Star Jason Momoa (\"Aquaman\", \"Dune\").\nAction, Kanada 2018, R: Lin Oeding"
  widescreen: true
