  title: Red Bull Cliff Diving - More than a Dive
  subtitle: Highlights aus Polignano a Mare
  description: |-
    Wenn ein Ort die Red Bull Cliff Diving World Series verkörpert, dann ist es Polignano a Mare. Die malerische Stadt in Apulien bietet mit ihren Kalksteinfelsen, privaten Balkonen und der einzigartigen Atmosphäre über der lebhaften Adria die perfekte Bühne für spektakuläre Sprünge. Zum 13. Mal in Folge gastiert die Weltelite des Klippenspringens an diesem traditionsreichen Ort - so oft wie an keinem anderen Stopp der Serie. Die Athletinnen und Athleten bahnen sich ihren Weg durch die belebten Gassen zur Plattform, von der aus sie sich in die Tiefe stürzen. Als vorletzter Wettkampf der Saison ist Polignano a Mare oft der entscheidende Moment im Titelrennen: Hier wurden schon Meisterschaften entschieden, und auch 2026 könnte dieser legendäre Ort wieder Geschichte schreiben.
    Dokumentarfilm, Österreich 2026
