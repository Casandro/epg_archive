  title: Australien - Magische Tierwelt
  subtitle: Zivilisation
  description: 'Schneebedeckte Berge, weitreichende Trockengebiete durchzogen Salzseen, herrliche Küstenlandschaften mit spektakulären Korallenriffen. Australien besitzt die wohl abwechslungsreichste Natur unseres Planeten. Doch um in dieser Natur zu überleben, haben sich bestimmte Tierarten zu wahren Überlebenskünstlern entwickelt. Die dreiteilige Blue Chip-Serie zeigt, dass einige ihrer Überlebensstrategien aus dem Reich der Magie stammen könnten. Denn in Australien scheinen die Tiere Musik zu machen, zu tanzen und sich wie Akrobaten durch die Luft zu schwingen. Dank hochmoderner Aufnahmetechniken kann der Zuschauer die ungewöhnlichen Verhaltensweisen in Australiens Tierwelt erstmals kennen lernen. Ein Reich von Zauberern, Verführern und Ganoven! Immer mehr Spezies suchen in Australien Schutz und Unterkunft in besiedelten Gebieten. Man schätzt sogar, dass mittlerweile mehr Wildtiere in den Städten und Dörfern anzutreffen sind als in freier Natur. Doch das Zusammenleben mit den Menschen gestaltet sich nicht immer einfach. Nur die anpassungsfähigsten Arten überleben - oder die trickreichsten, wie die tanzende Pfauenspinne.Australien 2019, R: Tosca Looby'
