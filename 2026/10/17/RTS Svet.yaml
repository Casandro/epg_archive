  title: NTC kviz
  subtitle: Sa jedne strane su učenici Osnovne škole "Đura Jakšić" iz Beograda, dok drugi tim čine učenici Osnovne škole "Rajak Pavićević" iz Bajine Bašte.
  description: Sa jedne strane su učenici Osnovne škole "Đura Jakšić" iz Beograda, dok drugi tim čine učenici Osnovne škole "Rajak Pavićević" iz Bajine Bašte. Beogradska škola nosi ime jednog svestranog čoveka i baš ta svestranost Ognjenu je zadala muke - za koji deo njegovog stvaralaštva da se opredeli. Đura Jakšić je bio čuveni pesnik. Pisao je brzo i lako, svedoci kažu da je u kafani mogao da napiše pesmu na salveti. Bio je i slikar, koji se na svojim delima poigravao senkom i svetlošću. Bio je i učitelj, jednostavno - heroj srpske kulture! I eto ideje, tim koji dolazi iz Beograda dobiće baš to ime - Heroji! I ekipa iz Bajine Bašte je bila inspirativna za davanje imena timu. U Bajinoj Bašti postoji reka Vrelo, koju meštani zovu Godina, jer ima onoliko metara koliko godina ima dana, a to je 365. Iako je informacija zanimljiva, Ognjen nastavlja da traga dalje. Dolazi do biografije čoveka po čijem imenu njihova škola nosi ime, a to je Rajak Pavićević. On se zalagao za obrazovanje naroda i posebno...
