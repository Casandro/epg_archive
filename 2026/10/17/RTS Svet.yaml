  description: Rodoslavci su oni dobri, vredni, hrabri, plemeniti, mudri, svom rodu posvećeni ljudi, koje smo slučajno, ili namerno zaboravili. Njihovo delo utemeljeno u poštenoj nameri, nastalo je iz dubokog uverenja. Ljudi , čije sudbine prati serijal Rodoslavci, najčešće su izvan glavne pozornice, ali nikako bez uticaja na nju. Ravnodušnost prema njihovim sudbinama, bila bi nepravda, a neznanje o njihovom delu, sužava naš kulturni vidokrug. Uz to, rodoslavci su uzori koji vraćaju veru i učvršćuju stavove, pomažu da se uzdignemo, shvatimo ko smo i šta nam je činiti.
