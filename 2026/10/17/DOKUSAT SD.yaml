  title: Tiere vor der Kamera - Kanarische Inseln - Heimat der Kanarienvögel
  subtitle: Tiere vor der Kamera - Kanarische Inseln - Heimat der Kanarienvögel
  description: 'Ernst Arendt und Hans Schweiger präsentieren in ihrem Film "Tiere vor der Kamera" Neues von den Kanarischen Inseln: wilde Kanarienvögel, Rieseneidechsen und einzigartige Landschaften. Die Vielfalt reicht von Meer bis Hochgebirge, von Wüste bis Nebelwald, mit einer einzigartigen Tier- und Pflanzenwelt. Vertraute Vögel wie Buchfink haben hier eigene Formen entwickelt, während exklusive Arten wie die Kanarische Rieseneidechse nur hier zu finden sind.'
