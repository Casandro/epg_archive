  title: Tiere vor der Kamera - Unser Sommer mit Mutter Bär
  subtitle: Tiere vor der Kamera - Unser Sommer mit Mutter Bär
  description: Ernst Arendt und Hans Schweiger verbrachten einen Sommer damit, das Leben einer Bärenfamilie in Nordamerikas Wäldern zu dokumentieren. Die Bärin zeigte erstaunliches Vertrauen, indem sie ihnen und ihrem Jungen nahe kam. Der Film zeigt das heranwachsende Bärchen, das von seiner Mutter beschützt wird und spielerisch die Welt erkundet. Die Landschaft der Nordwälder wird in ästhetischen Bildern eingefangen. Trotz häufiger Fragen nach Gefahr erlebten die Tierfilmer keine bedrohlichen Situationen.
