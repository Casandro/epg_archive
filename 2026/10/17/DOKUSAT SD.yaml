  subtitle: Tiere vor der Kamera - Highway in die Eiszeit - Zum kalten Ende Alaskas
  description: Der Dalton Highway im Winter ist eine Herausforderung für LKW-Fahrer von Fairbanks nach Prudhoe Bay. Arendt und Schweiger erkunden die winterliche Wildnis, leben unter Moschusochsen, Eisfüchsen und Schneehühnern. Sie staunen über deren Überlebenskunst in Kälte und Stürmen und beobachten Caribou, Gänseschwärme und Kleinvögel.
