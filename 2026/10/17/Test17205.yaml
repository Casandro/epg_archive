  title: 'On the Edge: World Cup Ski Racing'
  subtitle: Sous pression
  description: |-
    (2/5) Sur la légendaire piste Birds-of-Prey de Beaver Creek, nous suivons Ryan Cochran-Siegle qui met à profit son héritage olympique pour réaliser une descente époustouflante, terminant deuxième derrière le puissant Suisse Marco Odermatt, qui remporte sa toute première victoire sur ce parcours emblématique. Nous retrouvons également Vincent Kriechmayr et Odermatt, capturant leurs courses et les conditions de neige en constante évolution qui ont marqué le week-end.
