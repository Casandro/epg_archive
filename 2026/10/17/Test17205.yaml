  title: 'On the Edge: World Cup Ski Racing'
  subtitle: La victoire ou la chute
  description: |-
    (3/5) À l'approche de la date limite de sélection olympique, la pression s'intensifie sur l'ensemble du circuit. A Val d'Isère, le favori local Clément Noël porte le poids des attentes nationales. Il nous fait découvrir sa collection de médailles olympiques, réfléchissant à ce que signifie représenter la France, mais la pression s'avère trop forte et un abandon offre la victoire au Norvégien Timon Hagan. Nous suivons l'équipe norvégienne après sa victoire alors qu'elle se remet rapidement en selle, plie bagage et monte à bord d'un hélicoptère pour rejoindre sa prochaine course.

     (Etats-Unis d'Amérique-2026)
