  title: Neka nam Bog pomogne 5, serija
  subtitle: Komedija/Drama
  description: Sestra Angela istražuje medicinsku sestru s dvostrukim identitetom. Kada Nicova teta, koja je također časna sestra, dođe u samostan, Marija traži Ginevru da joj pomogne ostaviti dobar dojam. U međuvremenu, Valentina postaje prilično impresionirana Alessiom, njezinim novim fizioterapeutom, upravo kad joj Gabriele odluči reći što zapravo osjeća prema njoj. Athos pokušava nadoknaditi izgubljeno vrijeme s Azzurrom, ali je možda otišao predaleko.
- eventId: 773912
  start: 2026-10-17T08:45:00Z
