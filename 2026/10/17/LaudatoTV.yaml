  title: Prozor svetog Josipa
  subtitle: Religijski
  description: U emisiji gostuje Igor Pranić. Svetog Josipa i pobožnost prema ovom velikom svecu pobliže je upoznao u Nacionalnom svetištu svetog Josipa u Karlovcu, gdje je prisustvovao susretu voditelja molitvenih vjenčića, iako je on tada bio u svojstvu vozača. Promatrajući i slušajući sve sa strane, sveti Josip ga je oduševio i zapalio njegovo srce. Igor je i član Udruge svetog Vinka Paulskog, o čemu će također govoriti u emisiji. Svjedočit će kako je moguće uz obitelj i posao dati sebe za duhovni rast ljudi koji nas okružuju.
- eventId: 687463
