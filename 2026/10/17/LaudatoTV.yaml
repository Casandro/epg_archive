  subtitle: Religijski
  description: Pratimo uživo 13. Nacionalni susret štovatelja Božjega milosrđa u Hrvatskom nacionalnom svetištu Majke Božje Bistričke u Mariji Bistrici. Svečanu svetu Misu predslavit će mons. Marko Medo, gospićko-senjski biskup. Ovogodišnji susret održava se u znaku zahvale za 95. obljetnicu Velike objave Milosrdnoga Isusa svetoj Faustini Kowalskoj, a njime u Hrvatskoj ujedno svečano započinje Godina priprave za 25. obljetnicu posvete svijeta Božjemu milosrđu i obnovu te posvete.
