  title: Superknjiga
  subtitle: Animirani
  description: Isus (ili otac pun ljubavi) je uvijek spreman oprostiti. Dok Lukin prijatelj Aron planira pobjeći od kuće jer misli da je učinio nešto tako loše da mu otac nikada neće oprostiti, Superknjiga ih povede u Galileju gdje Isus mnoštvu govori prispodobu o izgubljenom sinu. Tijekom njihovog vremena s Isusom, djeca uče vrijednu pouku o moći opraštanja i vjernoj ljubavi jednog oca. Kada se vrate kući s ovom porukom, spremni su ohrabriti Arona da se suoči s onim što je učinio i traži oprost svoga oca, koji oprašta svome sinu i kojemu je drago da je dječak sretno stigao kući.
