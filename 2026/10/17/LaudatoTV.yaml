  title: Novo srce
  subtitle: Religijski
  description: Ususret Misijskoj nedjelji donosimo inspirativno svjedočanstvo vjere i misionarskog poziva. U ovoj epizodi fra Ivan Matić razgovara sa sestrom Marijom Veronikom Ćibarić, redovnicom Družbe sestara milosrdnica Vinka Paulskog i misionarkom na Salomonskim Otocima. Rođena je u Janjevu, a potom se s obitelji preselila u Kistanje gdje se počinje buditi njezin poziv na redovnički život. Iako su je misije oduvijek privlačile, ističe da je Bog odredio pravi trenutak za taj korak. Kako ona voli reći, misijski poziv je ,,poziv u pozivu. Pridružite nam se i saznajte kako izgleda život jedne misionarke, te otkrijte više o misijama na Salomonskim Otocima.
