  title: Baťovské dopravní projekty
  description: 'Po stopách dopravních projektů spjatých s působením a vizemi podnikatele Tomáše Bati nás provedou historikové z východní Moravy: Jan Herman, Zdeněk Pokluda, Pavel Zrna a Vojtěch Bártek. Projedeme se vlakem ze Zlína do Vizovic a budeme pátrat v pohoří Chřiby i nedaleko lázní Luhačovic. Nakonec navštívíme místo letecké tragédie v otrokovickém Baťově. Pořad připravil Petr Slinták.'
