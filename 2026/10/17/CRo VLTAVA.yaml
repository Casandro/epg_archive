  title: Znojmo v královském hávu 3/3
  description: Před 800 lety povýšil český král Přemysl Otakar I. město Znojmo na město královské. Významnou událost připomíná Jihomoravské muzeum mimořádnou výstavou Tváře města Znojma. Expozicí procházíme s historiky umění Monikou Frecerovou, Klárou Benešovskou a Liborem Šturcem, současnosti muzea se lehce dotkneme s jeho ředitelkou Vladimírou Durajkovou. Připravila Eva Ocisková.
