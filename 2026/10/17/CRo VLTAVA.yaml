  title: Povídka
  description: 'Tommaso Landolfi: Polibek, Sorrento. Tajemný noční polibek jako závan větru nebo dotyk křídla. Polibek, který budí zdání daru z nebes, ale je větrnou smrští, která z notáře D. vysává život. A příběh o osudové lásce ke starší ženě, před kterou se Antonio neschová v Sorrentu. Dva emotivně fantaskní příběhy pozoruhodného solitéra italské literatury z knižního výboru Rozprava o vyšších systémech aneb Švábí moře. Připravil Dominik Mačas. Překlad Anna Kareninová. Účinkuje Pavel Čeněk Vaculík. Režie Radim Nejedlý (23 min).'
