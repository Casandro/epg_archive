  title: Urbanismus jako vizualizovaná společnost
  description: Existují v historii urbanismu principy, které jsou pro kvalitní město nadčasové? Nejen o blízké budoucnosti Smíchova hovoří Michaela Vrchotová se svými hosty, spoluzakladatelem studia A69 - spoluautorem urbanistického konceptu Smíchov City, architektem Borisem Redčenkovem, a s historikem architektury a urbanismu Richardem Biegelem, výrazným hlasem ochrany památek, předsedou Klubu za starou Prahu a ředitelem Ústavu pro dějiny umění Filozofické fakulty Univerzity Karlovy.
