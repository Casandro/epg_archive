  title: 'Die Reportage: Serbien vor der Parlamentswahl'
  subtitle: Mündet die Studentenprotestwelle in einen Machtwechsel?
  description: In Serbien kommt es bei der Parlamentswahl am 25. Oktober, laut Umfragen, zu einem einzigartigen Duell um die Macht, zwischen der SNS-Partei des autoritären Noch-Präsidenten Aleksandar Vucic und der Studentenprotestwelle. Die Studenten treten zwar selbst nicht an bei der Wahl, doch sie haben eine unabhängige studentische Liste aufgestellt, mit Professoren, Kulturschaffenden, Gewerkschaftern und Akteuren aus der Zivilgesellschaft. Aleksandar Vucic ist zum ersten Mal seit 2012 in Gefahr, seine Macht zu verlieren. Er hat die vorgezogene Parlamentswahl ausgerufen und plant selbst Premierminister zu werden und seine Macht zu behalten. Denn bei der Präsidentschaftswahl, die turnusmäßig im Frühjahr 2027 stattfindet, darf Vucic nach zwei Amtszeiten nicht noch einmal antreten. Vucic war früher schon mal Premier und egal, ob er Präsident oder Premier war, er war immer der mächtigste Mann des Landes. Nun könnte sich das ändern. Wie ist die Stimmung in Serbien vor dieser spannenden Wahl und was sind die Herausforderungen einer Studentenbewegung, die politisch ziemlich heterogen ist und keinen klaren Anführer hat?
