  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Výskum ("Je iluzórne vyžadovať, aby vedecký výskum a jeho aplikácie boli morálne neutrálne. Na druhej strane orientačné kritériá sa nemôžu odvodzovať ani z čisto technickej účinnosti, ani z užitočnosti, ktorá z nich môže vyplývať pre jedných na škodu druhých, ani - čo by bolo ešte horšie - z prevládajúcich ideológií. Veda a technika už pre svoj vnútorný význam vyžadujú bezpodmienečné rešpektovanie základných kritérií morálnosti." (KKC 2294); Rešpektovanie ľudského života ("Keď náš Pán pripomína prikázanie Nezabiješ!, požaduje tým pokoj srdca a poukazuje na nemorálnosť vražedného hnevu a nenávisti. Ak hnev zachádza až do vedomej a dobrovoľnej túžby zabiť blížneho alebo ho ťažko zraniť, závažne protirečí láske; je smrteľným hriechom. Pán hovorí: Pred súd pôjde každý, kto sa na svojho brata hnevá." (KKC 2302) (2018)'
