  title: '12 podmienok dedičstva: Nekompromisný osud (2)'
  subtitle: Jason Stevens (Logan Bartholomew) splnil všetkých 12 úloh, ktoré mu starý otec Red zanechal v testamente ako podmienky pre získanie dedičstva.
  description: 'Jason Stevens (Logan Bartholomew) splnil všetkých 12 úloh, ktoré mu starý otec Red zanechal v testamente ako podmienky pre získanie dedičstva. Pre bezstarostného chlapca, zvyknutého na hýrivý život v blahobyte, to bola skutočná skúška reálnym životom, v ktorej mal spoznať, aký je rozdiel medzi bohatstvom a šťastím, a zistiť, či je schopný žiť ako zodpovedný muž. Jason zdedil po starom otcovi dar, ktorého súčasťou je aj správa miliardovej nadácie, čo však jeho rodina neustále spochybňuje a rieši žalobou. Na súde Jason prichádza o všetko. Táto okolnosť mu tiež bráni, aby požiadal svoju snúbenicu Alexiu Drummondovú (Ali Hillisová) o ruku skôr, než odíde na dlhší čas do zahraničia. Keď Jason získa od svojho právnika denník starého otca Reda, strávi celú noc čítaním príbehu o jeho vzostupe z chudoby k úspechu a bohatstvu. A ráno je z Jasona celkom iný človek. Je to muž, ktorý sa nevzdáva a berie svoj životný osud pevne do vlastných rúk. Réžia: Michael Landon Jr.. Účinkujú: Logan Bartholomew (Jason Stevens), Ali Hillisová (Alexia Drummond), Lee Meriwether (Slečna Hastings), Bill Cobbs (Pán Theophilus Hamilton), Austin James (Mladý Red Stevens) (2013)'
