  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der Sachsenklinik erwartet Dr. Ina Schulte ein medizinisches Wunder: Sie soll die Entbindung der an der Leber zusammengewachsenen Zwillinge von Hilda Renner per Kaiserschnitt durchführen. Doch die werdende Mutter ist in einem emotionalen Ausnahmezustand - die Trennung von ihrem Ehemann Lars belastet sie zusätzlich. Kurz vor der geplanten Entbindung flieht Hilda in Panik aus der Klinik. \n\nPJlerin Lisa Schroth hat es endlich geschafft, Dr. Ina Schulte davon zu überzeugen, bei der seltenen Entbindung dabei sein zu dürfen. Dann jedoch ignoriert sie ihren grippalen Infekt so lange, bis sie schließlich zusammenbricht."
