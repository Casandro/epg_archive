  description: 'Mit der Eröffnung des "Omen" und mit Sven Väth als Treiber der Szene wird Frankfurt in den 90er Jahren zur Techno-Hochburg. Raver und DJs aus ganz Europa reisen mit eigenen Bussen an, um in dem legendären Club zu feiern. In ganz Deutschland ist die Bewegung im Aufwind, man besucht sich am Wochenende gegenseitig: im "Ultraschall" in München oder im "Warehouse" in Köln und natürlich fahren alle zur Loveparade nach Berlin. Doch die Szene stößt auch auf Widerstände.'
