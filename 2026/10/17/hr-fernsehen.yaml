  description: In einem luxuriösen Seniorenheim stirbt Erika Brunner, die Mutter von Dr. Dirk Brunner. Der Staatsanwalt erfährt, dass Pflegedienstleiterin Kerstin Matthies seine Mutter offenbar misshandelt hatte. Was Brunner umso härter trifft, als er mit Frau Matthies noch bis vor Kurzem liiert war. Wenig später verschwindet die Pflegedienstleiterin - ein Gewaltverbrechen? Brunner gerät unter Tatverdacht. Unterstützung sucht der von Journalisten und Bloggern gestalkte Staatsanwalt ausgerechnet bei seiner Gegenspielerin Karin Lossow. Sie versteckt ihn - auf dem Areal des Wisent-Geheges, in dem sie arbeitet.
