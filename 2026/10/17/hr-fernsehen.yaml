  description: 'In seinem gelernten Bürojob fühlt sich Alexander Schmidt aus Burkhards im Vogelsberg nicht wohl. Er entscheidet sich dafür, eine Ausbildung zum Koch zu machen und den Familienbetrieb "Zum Niddertal" zu übernehmen. Mit Uroma, Opa und seinen Kindern leben und arbeiten im Dorfgasthaus vier Generationen. Das Zusammenspiel klappt erstaunlich gut: die Kinder bringen den Gästen die Speisekarte, Andreas kocht und die Uroma hilft in der Küche. Neben modernen Pokebowls gibt es auch Omas Gerichte für Stammgäste auf Anfrage. Und das macht sich bezahlt: das Dorfgasthaus wurde jetzt zu einem der besten in Hessen gekürt.'
