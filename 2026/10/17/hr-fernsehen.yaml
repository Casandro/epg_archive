  description: 'Ein harmloser Strafzettel aus Italien kann bisweilen gewaltige Folgen haben - diese Erfahrung muss Bauamtsleiter Otto Schlegel machen, als er nach einem romantischen Wochenende mit seiner heimlichen Geliebten Renate aus dem Süden zurückkehrt; dummerweise hatte er für den Kurzurlaub seinen Dienstwagen genommen. Es herrscht Wahlkampf in der Stadt, da darf sich niemand einen Fehltritt erlauben. Als wäre das nicht genug Ärger, hat Schlegel einen neuen Mitarbeiter, der sich als Vertuscher beweisen will: Renates Mann Michael.'
