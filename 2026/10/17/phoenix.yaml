  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Das Rennen um Berlin
  widescreen: true
  hd: true
  description: 'Hitlers Reich liegt längst in Trümmern, doch eine Kapitulation kommt für den Führer nicht infrage. Für die Alliierten geht es im Frühjahr 1945 vor allem darum, Berlin zu erobern. Während sich Briten, Amerikaner und Sowjets aus verschiedenen Richtungen der Hauptstadt nähern, entstehen völlig neue Fragen: Wie könnte eine Nachkriegsordnung in Europa aussehen? Und wem wird letztlich das Verdienst zukommen, den Krieg beendet zu haben? Über Fragen wie diese werden erste Risse im alliierten Bündnis erkennbar. Das Thema Berlin spielt dabei eine entscheidende Rolle.'
- eventId:
