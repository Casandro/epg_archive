  title: Die geheime Welt der Hunde
  subtitle: Der beste Freund des Menschen
  widescreen: true
  hd: true
  description: Sie sind die besten Freunde des Menschen seit Tausenden von Jahren. Es gibt sie in über 400 unterschiedlichen Rassen. Aber wieviel weiß der Mensch wirklich über seinen besten Freund, den Hund, und woher er abstammt? Die Doku-Reihe zeigt die einzigartigen Eigenschaften von Hunden und entdeckt dabei ihre bemerkenswerte Physiologie, ihre emotionale Bindung zum Menschen und ihre außergewöhnlichen Sinne.
- eventId:
