  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Invasion in Nordafrika
  widescreen: true
  hd: true
  description: Während Nazi-Deutschland weite Teile Europas besetzt hat, glaubt Churchill, dass letztlich die Kontrolle über das Erdöl über Sieg oder Niederlage entscheidet. Dabei hat er vor allem den Nahen Osten und den Suezkanal im Blick. Anfang 1941 landet das deutsche Afrikakorps unter Erwin Rommel in Libyen. Ihnen gelingt es tatsächlich, Richtung Nil vorzurücken. 1942 erobern sie nahe der ägyptischen Grenze die Stadt Tobruk. Doch dann kommt es zu den Schlachten von El Alamein und damit für die Deutschen zum Anfang vom Ende.
- eventId:
  - 1043336
  - 1258926
  start: 2026-10-17T00:45:00Z
  stop: 2026-10-17T01:30:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Schlacht von Kursk
  widescreen: true
  hd: true
  description: Nach der Niederlage von Stalingrad Anfang 1943 ist Hitler fest entschlossen, alles auf eine Karte zu setzen. Seinem Gegner Josef Stalin soll eine entscheidende Niederlage beigebracht werden, um so die Kontrolle an der Ostfront zurückzugewinnen. In der Nähe der russischen Stadt Kursk will er zuschlagen. Doch Hitler zögert, was Stalin Zeit verschafft. Er erhält detaillierte Warnungen vor einer bevorstehenden deutschen Offensive und lässt Vorbereitungen treffen. Außerdem gibt es massive Unterstützung seitens der Alliierten.
- eventId:
  - 1043337
  - 1258927
  start: 2026-10-17T01:30:00Z
  stop: 2026-10-17T02:15:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Invasion in Italien
  widescreen: true
  hd: true
  description: "Nach ihrem Sieg über die Deutschen in Nordafrika, planen Briten und Amerikaner im Sommer 1943 den nächsten Schritt im Kampf gegen Hitler. \n\nDie USA erwägen, die Befreiung Europas mit einer Landung in Frankreich zu beginnen. In Großbritannien befürchtet man allerdings ein schreckliches Blutbad und plädiert für eine Invasion Siziliens. Dieser Plan setzt sich letztlich durch und bereits im Juli beginnt die entsprechende Offensive. Auch mit Hilfe der örtlichen Mafia gelingt es den Alliierten, die Insel zu erobern. \n\nKurz darauf wird Hitlers Verbündeter Benito Mussolini von den Italienern selbst abgesetzt."
- eventId:
  - 1043338
  - 1258928
  start: 2026-10-17T02:15:00Z
  stop: 2026-10-17T03:00:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Die Befreiung von Paris
  widescreen: true
  hd: true
  description: 'Im Sommer 1944 befindet sich Frankreich seit vier Jahren unter deutscher Besatzung. Der Widerstand der Bevölkerung ist ungebrochen, doch das Land steht mittlerweile vor dem Kollaps. Dann kommt der 6. Juni: Die Alliierten landen in der Normandie, und plötzlich kehrt die Hoffnung zurück. In Erwartung der von Briten und Amerikanern geführten Truppen plant die Resistance in Paris einen Aufstand. Allerdings kommen die Befreier nur langsam voran. Die Gegenwehr der Besatzer ist zu stark für einen Durchmarsch. Schließlich befiehlt Hitler, Paris zu halten oder in Schutt und Asche zu legen.'
- eventId:
  - 1043372
  - 1260178
  start: 2026-10-17T03:00:00Z
  stop: 2026-10-17T03:45:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Iwo Jima
  widescreen: true
  hd: true
  description: Zwei Jahre nach dem Überfall auf Pearl Harbor rückt die US Navy unaufhaltsam auf das japanische Mutterland zu. Um den Krieg möglichst rasch und siegreich zu beenden, benötigen die Amerikaner jedoch neue Operationsbasen. Dabei geraten mehrere Inseln ins Visier, von denen aus die Luftwaffe ihre Angriffe fliegen könnte. Im Juni 1944 beginnen die US-Truppen mit der Eroberung der Marianen-Inseln. Sie liegen rund 2.400 Kilometer von Japan entfernt. Kaiser Hirohito befiehlt seiner Armee, die Stellungen zu halten koste es, was es wolle.
- eventId:
  - 1043373
  - 1260179
  start: 2026-10-17T03:45:00Z
  stop: 2026-10-17T04:30:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Das Rennen um Berlin
  widescreen: true
  hd: true
  description: 'Hitlers Reich liegt längst in Trümmern, doch eine Kapitulation kommt für den Führer nicht infrage. Für die Alliierten geht es im Frühjahr 1945 vor allem darum, Berlin zu erobern. Während sich Briten, Amerikaner und Sowjets aus verschiedenen Richtungen der Hauptstadt nähern, entstehen völlig neue Fragen: Wie könnte eine Nachkriegsordnung in Europa aussehen? Und wem wird letztlich das Verdienst zukommen, den Krieg beendet zu haben? Über Fragen wie diese werden erste Risse im alliierten Bündnis erkennbar. Das Thema Berlin spielt dabei eine entscheidende Rolle.'
- eventId:
  - 1043374
  - 1260180
  start: 2026-10-17T04:30:00Z
  stop: 2026-10-17T05:00:00Z
  title: Der Zweite Weltkrieg in Farbe - Der Weg zum Sieg
  subtitle: Okinawa
  widescreen: true
  hd: true
  description: Gegen Ende des Krieges versuchen die Amerikaner, in größtmöglicher Nähe zu Japan eine Basis zu errichten. Von hier aus sollen ihre neu entwickelte B29-Bomber das Kaiserreich angreifen. Als Ziel nehmen sie die bereits zum japanischen Mutterland gehörende Insel Iwojima ins Visier. Dort landen schließlich im Februar 1945 zehntausende US-Marineinfanteristen. Sie stoßen allerdings auf eine unerwartet heftige Gegenwehr. Die Japaner agieren aus einem gut ausgebauten und bislang verborgenen System von Bunkern, Tunneln und Höhlen. Die Verluste auf beiden Seiten sind enorm.
