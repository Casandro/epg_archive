  title: Krieg im Busch
  subtitle: Kampf um Afrikas Nashörner
  widescreen: true
  hd: true
  description: Sechs Jahre ist es her, dass Wilderer Seha attackierten, sie schossen ihn in die Brust, trennten beide Hörner ab. Die meisten Nashörner überleben so einen Angriff nicht, doch Seha schon. Die Wunde in seinem Gesicht ist bis heute nur teilweise verheilt. Die Organisation Saving the Survivors versorgt ihn seit Jahren medizinisch. Sie kämpfen nicht nur um die verletzten Tiere, sondern sorgen auch für Nachwuchs, in der Hoffnung, der Wilderei etwas entgegenzusetzen. Jeden Tag töten Wilderer in Südafrika mindestens ein Nashorn. Ihr Horn ist auf dem Schwarzmarkt heiß begehrt, es ist mehr wert als Gold.
