  title: Die geheime Welt der Hunde
  subtitle: Das Arbeitstier
  widescreen: true
  hd: true
  description: "Hunde haben eine ausgeprägte emotionale Bindung zum Menschen und ihre außergewöhnlichen und hervorragenden Sinne können ihre Besitzer im Alltag unterstützen. Das erklärt auch, wieso und auf welche Weise gerade der Hund ein so gewichtiger Teil im Leben der Menschen ist. \n\nDiese Episode zeigt Geschichten aus dem wahren Leben: einen Mischling, der mit seinem Besitzer Gleitschirmfliegen geht; eine deutsche Dogge, die einem neunjährigen Mädchen dabei half, zum ersten Mal zu gehen; ein Team von Huskys im Training für das längste Rennen ihres Leben und einen surfenden Hund, der Menschen mit Autismus hilft."
