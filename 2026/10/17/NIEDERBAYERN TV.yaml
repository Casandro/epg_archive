  description: "Potentielle Nobelpreisträgerausbildung? - Schülervorträge bei der Langen Nacht der Wissenschaft\nErinnern Sie sich noch an ihre Schulzeit zurück, genauer wenn Sie irgendwelche Präsentationen halten mussten? Haben Sie später im Job welche halten müssen und hätten sich gewünscht das vorher mehr geübt zu haben? Genau das versuchen die Beruflichen Schulen Schönbrunn mit ihrer langen Nacht der Wissenschaft zu erzielen. Hier präsentierten die 13. Klassen am gestrigen Abend ihre Seminararbeiten vor einem fremden Publikum. Die Hochschule Landshut sieht bei diesem Abend vor allem noch mehr Zukunftschancen, als nur besser präsentieren zu können. \n\nPsychische Krankheiten im Fokus - Aktionswoche der seelischen Gesundheit (LA)\nDie bundesweite Woche der seelischen Gesundheit steht unter dem Motto Miteinander statt nebeneinander - für eine Gesellschaft, in der jede Psyche zählt. Das BKH Landshut verteilt dazu aktuell grüne Schleifen, als Zeichen für mehr Offenheit im Umgang mit psychischen Erkrankungen und gegen Ausgrenzung. Wie wichtig es ist, darauf aufmerksam zu machen, und warum es Betroffenen oft schwerfällt, offen darüber zu sprechen, hat unser Reporter Daniel Schleinkofer im Gespräch mit Uwe Böttcher, dem Direktor des BKH, geklärt.\n\nBühne frei für Doktor X - Theater Konrad probt schwarze Komödie \nEine steile Karriere, jede Menge Turbulenzen und eine ordentliche Portion schwarzer Humor - das verspricht das neue Theaterstück Die Wahnsinnskarriere des Doktor X.\nBeim Theater Konrad in Landshut laufen dafür gerade die letzten Vorbereitungen. Am 17. Oktober feiert das Stück dann große Premiere. Wir haben den Regisseur Michael Deppisch bei einer Probe besucht und schon mal einen Blick auf die Inszenierung geworfen."
