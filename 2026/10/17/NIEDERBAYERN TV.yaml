  subtitle: Das NIEDERBAYERN TV Deggendorf-Straubing Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYER..
  description: "Die neue Nagerlbrücke - Ein Schwergewicht schwebt an seinen Platz\nDie Deutsche Bahn erneuert seit März letzten Jahres die Nagerlbrücke, die zwischen Plattling und Bayerisch Eisenstein über den Schwarzen Regen führt. Durch den Neubau verspricht sich die Deutsche Bahn einen schnelleren, stabileren Zugverkehr. Und ganz wichtig: Pünktlich soll er sein. In Zeiten, in denen die Bahn sich immer wieder harter Kritik ausgesetzt sieht, mal positive Nachrichten. Wir waren beim finalen \"Einschub\" der neuen Nagerlbrücke hautnah mit dabei.  \n\nFilmtage bayerischer Schulen - Film ab für den Nachwuchs\nKlappe, die 49. - und Action! In Straubing dreht sich aktuell alles um die ganz großen Emotionen, packende Geschichten und jede Menge Kreativität. Die FOSBOS Straubing hat sich nämlich wieder in das Epizentrum der jungen bayerischen Filmszene verwandelt.\nHier laufen die 49. Filmtage bayerischer Schulen. Wir waren bei der feierlichen Eröffnung dabei. Film ab für die Filmemacher von morgen!\n\nBayerische Witzemeisterschaft - Lachen ausdrücklich erwünscht\nWann haben Sie zuletzt über einen richtig guten Witz gelacht? Im Alltag sind es oft eher die kleinen, witzigen Situationen, die uns zum Schmunzeln bringen. Einen Witz aber so zu erzählen, dass am Ende wirklich alle lachen - das ist schon eine Kunst für sich. Und wie bei jeder Kunst gibt es auch hier Menschen, die besonders gut darin sind. Und eben die können sich bei der Bayerischen Witzemeisterschaft miteinander messen. Die steht bald wieder an - meine Kollegin Denise Kick hat mit dem Erfinder und Veranstalter gesprochen."
