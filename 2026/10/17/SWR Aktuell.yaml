  description: "12:00\nAktuelles & Sport\n\n12:30     \nDie Schule brennt - der Bildungspodcast mit Bob Blume \nDeutscher Schulpreis - Was machen die Gewinner-Schulen richtig? | Armin & Bob über aktuelle Debatten\nGute Schulen sehen von außen aus wie andere Schulen auch, erzählt Table-Bildung-Redakteur Armin Himmelrath - aber schon wenn man reinkommt, spüre er gleich eine besondere Atmosphäre. Armin kennt auch die Schule, die beim Deutschen Schulpreis jetzt mit dem Hauptpreis ausgezeichnet wurde: die Bertha-von-Suttner-Schule in Mörfelden-Walldorf. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-schule-brennt-der-bildungspodcast-mit-bob-blume/urn:ard:show:0798e0e66b576457/\n \n13:00 \nARD Interview der Woche ~ \nJan Zimmermann im Gespräch mit Katherina Reiche (CDU), Bundesministerin für Wirtschaft und Energie\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - Was können die Schülerproteste in Frankreich ändern?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nMAFIA LAND\nKoks und Küsschen - Passwort: Pecora - Die Codes der Mafia\nWie funktioniert eigentlich das System  _Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n14:30 \nARD Klima Update - Das Weltrekord-Windrad - Chancen und Risiken \nHöher? Schneller? Effizienter? Das höchste Windrad der Welt ist fertig und steht in Schipkau in der Lausitz. Mit seinen 365 Metern Höhe übertrifft es alle bisher installierten Windkraft-Anlagen. Perspektivisch soll es vergleichbar viel Windkraft liefern wie Offshore Windkraft Anlagen auf dem Wasser. Warum es bis dahin noch ein weiter Weg ist, dieses Forschungsprojekt aber trotzdem wichtig ist, darum gehts in diese Ausgabe vom ARD Klima Update mit Theresa Brenner.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/"
