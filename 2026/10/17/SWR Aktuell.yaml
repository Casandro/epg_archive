  description: "seit 17:30\nAktuelles & Sport\n\n18:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n19:00 \nDer Tag- Die Vermessung der Stille - Wenn aus Alleinsein Einsamkeit wird\nEs ist ein stilles Gefühl, das doch ohrenbetäubend laut sein kann: Einsamkeit. Obwohl wir in einer hypervernetzten Welt leben, fühlen sich immer mehr Menschen isoliert. Wir blicken hinter die Fassade eines Tabus. Was passiert im menschlichen Gehirn, wenn soziale Kontakte fehlen? Warum wirkt sich Einsamkeit messbar auf die physische Gesundheit aus, und welche gesellschaftlichen Entwicklungen verstärken die Isolation? Warum sehen wir Einsamkeit immer noch als persönliches Versagen statt als biologisches Warnsignal und gesellschaftliche Herausforderung?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-tag-ein-thema-viele-perspektiven/urn:ard:show:cd24ec031ec87a00/"
