  title: SWR Aktuell am Vormittag
  description: "Seit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nAus dem Leben -  Förster und Naturschützer Peter Wohlleben\nPeter Wohlleben hat mit seinen Büchern unseren Blick auf unseren Wald verändert. Genauso will er jetzt mit seinem aktuellen Buch \"Bakterien - Die heimlichen Helden\" unseren Blick auf die kleinsten Lebewesen verändern, die für ihn die Erfinder des Lebens sind. Bei den Recherchen für das Buch haben Bakterien ihn im positiven Sinn vom Stuhl gehauen. Denn Bakterien seien oft unterschätzte Wunderwesen, ohne die wir nicht leben können, sagt Peter Wohlleben. Seine Begeisterung für Biologie, die Natur und deren Schutz wurde bereits in seiner Kindheit geweckt. 1964 in Bonn geboren, später in Sinzig am Rhein mit mehreren Geschwistern als Sohn eines Finanzbeamten und einer medizinisch-technischen Assistentin aufgewachsen, ist er bereits als Kind viel draußen in der Natur, sammelt Spinnen im Glas, hält Wasserschildkröten im Aquarium auf seinem Schreibtisch, brütet auf dem Heizkissen seiner Oma ein Küken aus und beobachtet schon damals unter dem Mikroskop seiner Mutter Bakterien. Als \"grünes Schaf\" der Familie studiert Peter Wohlleben nach dem Abitur Forstwissenschaft und arbeitet danach 30 Jahre als Förster. Dabei setzt er schon früh statt auf konventionelle Forstwirtschaft auf naturnahe Waldwirtschaft, was nicht allen Kollegen gefällt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/\n\n10:30 \nKultur - Erschreckend bis heute\" - Das Adorno-Experiment\nWie antisemitisch sind die Deutschen? Und wie sehr sind ihre Haltungen noch vom Nationalsozialismus geprägt? Diesen Fragen ging 1950/51 das Frankfurter Institut für Sozialforschung nach. Unter der Leitung von Theodor W. Adorno, der gerade erst aus dem Exil nach Frankfurt zurückgekehrt war, wurde ein \"Gruppenexperiment\" durchgeführt. Tausende Befragte sollten sich in Diskussionsrunden äußern zu NS-Diktatur und Holocaust, zu Judenfeindlichkeit und zur Verantwortung der Deutschen. Die Ergebnisse waren so erschreckend, dass Adorno sie nicht veröffentlichen wollte. Jetzt macht sich eine Gruppe von jungen Forscherinnen darin, die Protokolle auszuwerten und zu veröffentlichen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nBin ich zu teuer?\nDie IG Metall will mehr Lohn, Unternehmen klagen über zu hohe Kosten. Ist Arbeit in Deutschland wirklich zu teuer? Beschreibung: Deutschlands Wirtschaft schwächelt, viele Unternehmen müssen sparen. Aber muss es am Gehalt sein? Wir prüfen, ob hohe Löhne wirklich das Problem sind, welche Rolle Produktivität und Standortkosten spielen und warum ihr trotz Krise nicht automatisch ein schlechtes Gewissen haben müsst, wenn ihr mehr Geld fordert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
