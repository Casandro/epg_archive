  title: Einfach und köstlich
  subtitle: 'Zitronenhuhn und Caesar Salad: Alexander Herrmann kocht mit Jaspar Wcislo'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Einen Klassiker aus Omas Küche bringt Jaspar Wcislo mit zu Alexander Herrmann: Zitronenhuhn mit Backkartoffeln. Außerdem verrät der junge Koch aus einem Düsseldorfer Sternerestaurant seine Lieblingsversion vom legendären \"Caesar Salad\".\n\n\"Einfach und köstlich\"-Gastgeber Alexander Herrmann zieht es kulinarisch ans Mittelmeer: Rosa gebratener Lammrücken mit schwarzem Knoblauch und Auberginencreme - beste Levante-Küche und ein würzig-harmonischer Gaumenschmaus. \n\nDie Spitzenköche schnappen sich am Ende die Überbleibsel und machen daraus einen schnellen, aber ganz besonderen Burger."
