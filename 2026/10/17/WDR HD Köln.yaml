  title: Land & lecker - Kulinarische Schätze von der Schwäbischen Alb (4/6)
  subtitle: Dorf-Backhaus und Boeuf Cidre
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die vierte Reise geht auf die schwäbische Alb zu Laura Alena Schmid. Die 34-Jährige hält Galloway-Rinder, Hühner und Ziegen und hat einige Pensionspferde. Ihre Mutter und ein Mitarbeiter helfen bei der täglichen Arbeit und Lebensgefährte Simon bei allem, was gebaut werden muss. Wenn es darauf ankommt, hat Laura sogar das ganze Dorf hinter sich, denn der Zusammenhalt in Unterböhringen ist stark. Das zeigt sich auch beim Besuch der Landfrauen. Im historischen Dorf-Backhaus bereitet Laura als Vorspeise Unterböhringer Blätzle zu und auch ihr Boeuf Cidre vom Galloway-Rind. Als Dessert gibt es gefüllte Waffeln und eigenen Eierlikör.
