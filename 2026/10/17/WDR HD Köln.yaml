  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: "Wenn Ludwig \"Lucki\" Maurer aus dem Süden Deutschlands anreist, dann ist das ein wahres Fest für den Gaumen und auch ein riesiger Spaß. Denn der umtriebige \"Lucki\" hat viele spannende Geschichten auf Lager und bei seinem altbayrischen Krenschnitzel - flankiert von einem Kartoffelsalat nach Familienrezept - kommt Björn Freitag ins Schwärmen!\nDer Profikoch aus Dorsten revanchiert sich mit einem Farben- und Aromen-Spektakel. Die Kartoffelwaffel-Sandwiches mit Obazda à la Björn Freitag lassen die Bayerische Küche mit der Nordrhein-Westfalens verschmelzen. \nAus den restlichen Zutaten komponieren Björn und \"Lucki\" dann ein Pfannengyros."
