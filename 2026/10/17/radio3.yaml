  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: |-
    Ilsey Juber

    Ilsey Juber aus Kalifornien hat schon vielen anderen Stars (Beyoncé, Miley Cyrus, Jake Sinclair) mit ihrem Songwriting-Talent geholfen. Aber wenn sie ihre eigenen Songs singt, hört und fühlt man ihre Poesie noch viel besser raus. Ihre eigenwillige Stimme ist ein Hinhörer, auch bei ihrer Version von Neil Youngs 'Heart of Gold'.

    Moderation: Susanne Papawassiliu
- eventId: 1196852
  start: 2026-10-17T18:00:00Z
  stop: 2026-10-17T21:00:00Z
  title: ARD Oper
  description: "\"La Reine de Saba\"\nGrand Opéra in fünf Akten\nvon Charles Gounod\nLibretto: Jules Barbier und Michel Carré\n\nBalkis, Königin von Saba: Liana Aleksanyan (Sopran)\nAdoniram: Sébastien Guèze (Tenor)\nKönig Soliman: Bogdan Talo_ (Bass)\nBénoni: Annabel Kennedy (Mezzosopran)\nAmrou: Andrés Sulbarán (Tenor)\nPhanor: Jake Muffett (Bariton)\nMéthousaël: Valentin Ruckebier (Bass)\nSarahil: Charlotte Langner (Sopran)\nSadoc: Jacob Harrison (Bassbariton)\n\nChor der Deutschen Oper am Rhein \nDuisburger Philharmoniker\nLeitung: Hendrik Vestmann\n\nAufzeichnung vom 15. Mai 2026 aus der Deutschen Oper am Rhein, Düsseldorf)\n\nCharles Gounods \"La Reine de Saba\": klangvolle Grand Opéra mit Liana Aleksanyan und den Duisburger Philharmonikern.\nPflicht oder Liebe? Vor dieser Frage steht Balkis, die Königin von Saba, als sie zu ihrem Verlobten, König Soliman, nach Jerusalem reist. Doch schon bald hat sie nur noch Augen für dessen Baumeister Adoniram. Er soll mit einem Bronzeguss ein Wunderwerk erschaffen. Unaufhaltsam sind die Gefühle zwischen Adoniram und Balkis, während Soliman vor Eifersucht glüht. Als Adoniram Opfer einer blutigen Intrige durch seine Arbeiter wird, schwört Balkis ihm über den Tod hinaus ewige Treue.\nEine Königin, die einen Künstler einem Herrscher vorzieht: Das sorgte bei der Uraufführung von Gounods \"La Reine de Saba\" im Jahr 1862 für Irritationen. Dabei ist es gerade dieses Liebesdreieck, verbunden mit der Geschichte eines Künstlergenies, das den Stoff für Gounods musikalische Umsetzung so faszinierend macht. Die Deutsche Oper am Rhein hat diese selten gespielte Grand Opéra in einer aufwendig erarbeiteten neuen Fassung wieder auf die Bühne gebracht. Klangvolle Arien, prächtige Chöre und eine farbenreiche Orchestrierung machen Gounods \"La Reine de Saba\" zu einer echten Entdeckung neben \"Faust\" und \"Roméo et Juliette\"."
