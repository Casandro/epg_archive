  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: "Die Entscheidung. Momente, die alles verändern\nGefangen in der DDR (2/3) I Papas Stasi-Akten\n\nThomas Nolte ist auf der Suche nach seiner eigenen Vergangenheit. 1987 sind es ein paar Parolen gegen die DDR und Melodien auf seiner Mundharmonika, die ihm zum Verhängnis werden. Nolte ist damals 18. Die Stasi nimmt ihn plötzlich zu Hause in Heiligenstadt fest, es folgen fünf harte Monate in Gefängnissen in Erfurt und Chemnitz. Auch seine Mutter Elisabeth Nolte versucht verzweifelt, sich gegen den Psycho-Krieg der Stasi zu behaupten. Lange hat Thomas Nolte das alles verdrängt, doch jetzt liest er mit seiner Tochter, der BR-Journalistin Marie Müller, in Erfurt in seinen Stasi-Akten. Sie finden heute Groteskes wie Noltes Einstufung als \"negativdekadenter Jugendlicher\". Doch sie stoßen auch auf Aussagen, die Thomas Nolte irritieren und an sich selbst zweifeln lassen. \n\nHost: Jasmin Brock\nReporterin: Marie Müller\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
