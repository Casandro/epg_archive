  title: The Joy of Music - SACRED FAVORITES I
  subtitle: The Joy of Music - SACRED FAVORITES I
  description: 'Diane begins a series of programs from the great organs  and churches of the world with guest artists and ensembles.  Guests:  Pierre Kremer, Piccolo Trumpet;  Rachel Priest O''Hara, Soprano; Bagpipe Band;  Maria Goldschmidt, flute. Music: Bruckner  "Old Hundredth" from St. Florian Monastery; C. Franck "Panis Angelicus" ; T. DuBois "Fait Lux" from  Berlin Cathedral; "Amazing Grace"; "On Jordan''s Stormy Banks (or I am Bound for the Promised Land") from Muri, Switzerland; Gluck "O Savior Hear Me"; and "Just a Closer Walk with Thee" from the St. Louis Cathedral in New Orleans.'
