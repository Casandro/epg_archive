  title: Missionswerk Karlsruhe - Unbeschreiblich nah - aus Nähe wird Sieg
  subtitle: Missionswerk Karlsruhe - Unbeschreiblich nah - aus Nähe wird Sieg
  description: 'Manchmal erkennst du erst im Rückblick, wie nah Gott dir wirklich war. Gottes Nähe bedeutet nicht, dass der Kampf sofort ein Ende nimmt, sondern dass du ihn niemals alleine führst. Erlebe es wie die Emmaus-Jünger, die neue Hoffnung fanden; wie Elia, der neue Kraft empfing; oder wie Paulus, der Stärke in seiner Schwäche entdeckte. Egal ob du müde, enttäuscht oder voller Fragen bist: Jesus geht mit dir! Der Sieg beginnt nicht erst am Ziel, sondern bereits auf dem Weg mit Gott.'
