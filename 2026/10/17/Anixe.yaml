  title: Kraftvoll Leben - Ergebnisbooster - Das Geheimnis effektiven Fastens und Betens
  subtitle: Kraftvoll Leben - Ergebnisbooster - Das Geheimnis effektiven Fastens und Betens
  description: In der dieser Predigt teilt Andreas ein paar wichtige Gedanken rund um das Thema "Gebet und Fasten". Im Gebet hat uns Jesus einen ultimativen Booster für unser Leben mitgegeben. Die meiste Zeit lehrte er über das Thema Gebet, da es eine ultimative Kraft für unseren Alltag freischaltet, die wir täglich erleben dürfen.
