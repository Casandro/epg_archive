  title: Der Missionsdienst von David Hathaway - The Das Tal der Entscheidung | und der kommende Regen
  subtitle: Der Missionsdienst von David Hathaway - The Das Tal der Entscheidung | und der kommende Regen
  description: 'Das Tal der Entscheidung und der kommende Regen  Oft blicken wir auf unsere Welt und fragen uns, wo die Kraft geblieben ist. Im gesamten Westen sind die Fundamente der Familie brüchig geworden, der Respekt vor geistlichen Ältesten ist geschwunden, und Millionen junger Männer wachsen ohne Väter auf, die sie leiten oder für sie beten könnten. Doch dort, wo menschliche Institutionen versagen, bleibt Gottes ursprüngliche Verheißung vollkommen ungebrochen.  Der Prophet Joel sprach von zwei verschiedenen Regenfällen: dem Frühregen und dem Spätregen. Während die erste Zeit die frühe Gemeinde durch die Kraftentfaltung des Evangeliums begründete, ist die verheißene letzte Ausgießung grenzenlos. In der Landwirtschaft lässt der Spätregen das Getreide unmittelbar vor der Ernte noch einmal kräftig anschwellen. Gott bereitet eine letzte, wunderbare Ernte unter allen Völkern vor, noch vor der Wiederkunft Jesu Christi.  Lebendiger Beweis der Auferstehungskraft'
