    Mit einer speziellen Kamera macht "Quarks" ein Experiment und testet, ob Fenster- oder Autoscheiben vor UV-Strahlung schützen. Wie viel Strahlung bekommen wir an einem Sommertag überhaupt ab? Und auch das macht die Spezial-Kamera sichtbar: Was bringt Sonnencreme?
