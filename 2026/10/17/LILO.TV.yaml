  title: So schmeckt die Welt - Bordeaux
  subtitle: So schmeckt die Welt - Bordeaux
  description: Eine kulinarische Rundreise durch eines der berühmtesten Weinanbaugebiete der Welt. Schon zu Zeiten der Römer wurden hier Rebstöcke kultiviert. Die 45 Min. Dokumentation erzählt die Geschichte von Bordeaux aus der Sicht von vier völlig unterschiedlichen Winzern die mit Ihrem Streben und Wissen zur Vielfalt aber auch Qualität beitragen. Das Ergebnis sind über 1000 verschiedene Weine doch jeder steht für das Markenzeichen Bordeaux. Ein Film von und Für echte Weinliebhaber.
