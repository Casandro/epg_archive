  title: So schmeckt die Welt - Bier
  subtitle: So schmeckt die Welt - Bier
  description: Die TV-Doku befasst sich mit dem Kulturgut Bier in Bayern. Kein anderes Bundesland ist auch historisch so eng mit süffigen Gebräu verbunden und kein andere Region weißt eine höhere Brauereidichte auf. Beides spiegelt sich auch in der Vielfalt und den unterschiedlichen Facetten der Braukunst wieder. Und in Bayern befinden auch die ältesten Brauereien weltweit Bier aus Bayern isr von höchster Güte und unverwechselbar daher wird es seit 2001 auch als Marke geschützt.
  genre:
  - '129'
  widescreen: true
