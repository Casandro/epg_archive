  title: So schmeckt die Welt - Berner Oberland
  subtitle: So schmeckt die Welt - Berner Oberland
  description: Eine kulinarische und kulturelle Expedition durch das Berner Oberland. Wer alle schweizer Klischees auf einem Fleck erleben will, fährt ins Berner Oberland. Vom berühmten Käse bis zum berühmten Jungfraujoch und seiner Bahn hat man de wichtigsten Motive und Sehenswürdigkeit auf einem Fleck. Die Doku berichtet auch über den Ort Spiez in dem sich einst die deutsche Nationalmannschaft bei der Fußball WM 1954 vorbereitet hat. Das Ergebnis kennen wir.
  genre:
  - '129'
  widescreen: true
