  title: Linea Verde Discovery - Lungo il Trattur
  subtitle: 'Linea Verde Discovery - Lungo il Tratturo - RUBRICA - Un viaggio a passo lento, seguendo una delle più antiche vie d''Italia: i tratturi del Molise. Camminare lungo il Tratturo Celano-Foggia significa attra'
  description: |-
    versare secoli di storia. Ridurlo a un semplice sentiero sarebbe impossibile: questa straordinaria via erbosa, lunga oltre duecento chilometri, ha collegato per millenni gli altipiani dell'Appennino alle pianure della Puglia, diventando l'asse portante della transumanza e degli scambi tra popolazioni, territori e culture. - Conduce Livio Beshir
    Ideato da Gian Marco Mori
    Scritto da Federica Petruccioli
    Una Produzione TVCOM
    Produttore Esecutivo TVCOM Elisa Masiero
    Delegato Rai Milvia Licari
    Regia di Gian Marco Mori
- eventId: 812424
  start: 2026-10-17T10:00:00Z
  stop: 2026-10-17T10:30:00Z
  title: Linea verde Start - Cuneo
  subtitle: RUBRICA - Per conoscere e raccontare l'Italia nella sua essenza, occorre seguire due percorsi che si affiancano. Da un lato, le immagini di una natura potente, tra paesaggi e scenari fiabeschi, espressione di una bellezz
  description: "a e di una biodiversità uniche e irripetibili. Dall'altro, la sapienza degli artigiani, nelle cui botteghe si custodisce il genio italiano: uno dei tratti identitari più profondi e radicati del Paese. Qui il passato nutre il presente e guarda al futuro; mani, mente e cuore trovano la loro sintesi in un mondo antico e moderno al tempo stesso, che attende di essere raccontato e valorizzato. - Un programma di Gian Marco Mori\nCondotto da Federico Quaranta \nScritto conFabiana Ruggiero e Marco Ghighi\nUna produzione Raccontami \nProduttore esecutivo Raccontami Jolanda De Palma\nDelegato RAI Milvia Licari\nRegia di Gian Marco Mori\n"
- eventId: 812425
  start: 2026-10-17T10:30:00Z
  stop: 2026-10-17T11:30:00Z
  title: Linea Verde Italia - Bergamo
  subtitle: 'RUBRICA - Bergamo protagonista di questa puntata. Andiamo alla scoperta di una città dinamica e virtuosa, capace di valorizzare il proprio patrimonio storico-culturale guardando a un futuro sempre più sostenibile. Un '
  description: "viaggio tra eccellenze e sociale, che mette al centro l'inclusione attraverso la straordinaria storia di resilienza e successo della campionessa paralimpica Martina Caironi, per poi proseguire con il racconto della romantica bellezza del borgo di Lovere, sul Lago d'Iseo. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore Esecutivo Daniela Rainaldi\nRegia di Michele Penelope\n"
