  title: Bar centrale
  subtitle: 'RUBRICA - Il programma racconta l''Italia attraverso cinque notizie della settimana, tra costume, spettacolo e società. Ospiti in studio e collegamenti con bar e circoli di paese danno voce alla gente comune, intrecciando attualità e '
  description: |
    storie di comunità. La provincia diventa così una lente per comprendere il Paese. Uno specchio dell'Italia più autentica, fatta di relazioni vere, buon senso, e una straordinaria capacità di adattarsi, resistere, immaginare. - Conduce Elisa Isoardi
