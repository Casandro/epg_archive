  title: Passaggio a Nord-Ovest
  subtitle: DOCUMENTARIO - In questa puntata:- Partiamo alla volta della Mongolia, per seguire la storia di una giovane ragazza, di nome Aibota, che sogna di cacciare con le aquile reali;- Ci trasferiamo in un luogo dove si respira sto
  description: |
    ria, saggezza e tranquillità: visitiamo l'imponente Basilica di Assisi, dedicata a San Francesco;- Pompei è la città sepolta dall'eruzione del Vesuvio del 79 d.C. Ma prima di diventare "romana" a tutti gli effetti, è stata governata da altri popoli dell'antichità;- Ci rechiamo ad Arezzo che, nell'ottavo centenario della morte di San Francesco, celebra il Patrono d'Italia organizzando una grande mostra a carattere iconografico... - Un programma di Alberto Angela
