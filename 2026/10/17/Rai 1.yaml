  description: 'assicurandoli sui piccoli disturbi quotidiani attraverso la voce di medici autorevoli del nostro SSN. Parole d''ordine: prevenzione, corretto stile di vita e benessere a 360 gradi. I telespettatori potranno dialogare con gli esperti in studio scrivendo una mail e ponendo loro delle domande sulla salute, nel pieno spirito del servizio pubblico. - Conduce Vira Carbone'
