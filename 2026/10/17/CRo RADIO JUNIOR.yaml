- eventId:
  - 820805
  - 826002
  start: 2026-10-17T17:00:00Z
  stop: 2026-10-17T17:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: nadporučík David Vedral, policejní psovod. O letošních prázdninách se policejní psi vyznamenali při několika velkých pátráních po ztracených lidech a vystopovali i pěknou řádku zlodějů. Jejich práci a statečnost vám přiblížíme s naším hostem, a možná s ním přijde i slavná fenka Pita. Repríza pořadu.'
- eventId:
  - 820806
  - 826003
  start: 2026-10-17T17:50:00Z
  stop: 2026-10-17T18:00:00Z
  title: Hajaja
  description: 'Sladké a slané cestování 6/7 - Princeznin dort. Jsou dvě věci, které Emilka miluje ze všeho na světě nejvíc: jídlo a cestování. Kromě téhle veliké lásky má navíc obrovskou představivost, která ji dokáže přenést do dávných dob a dalekých krajů, kde vznikly její oblíbené recepty. Sedm sladkých a slaných příběhů o cestách za jídlem a dobrodružstvím napsala Antonie Rašilovová. Dramaturg Vojtěch Bohuslav. Režie Bela Schenková. Natočeno v roce 2026. Vypráví Eva Hacurová. PREMIÉRA.'
