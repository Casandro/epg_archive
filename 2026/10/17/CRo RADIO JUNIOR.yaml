  title: Velká pohádka
  description: Orlí kámen. Kamínek z orlího hnízda prý dokáže zázraky a mohl by pomoct Tonince, nevěstě zemana z Boří, které se to v hlavě trochu popletlo. Jenže kouzlo pohádek spočívá mimo jiné i v tom, že nic není tak, jak se na první pohled zdá. Napsal Karel Šiktanc, režie Jaroslav Kodeš, natočeno v roce 2004. Účinkují Valérie Zawadská, Svatopluk Schuller, Vladimír Brabec, Miloš Hlavica, Andrea Elsnerová a další.
