  title: Rozhlasová hra
  description: 'Lokis.Tajuplný a strašidelný příběh, který ve vyprávění profesora Wittenbacha, skvělého znalce žmuďštiny, postupně odhalí mladému Theodorovi tajemství ukryté za jménem Lokis. Jeho pouhopouhé vyslovení prý bývá předzvěstí čehosi strašlivého. Na motivy povídky Prospera Mérimée pro rozhlas napsala Martina Drijverová. Režie: Karel Weinlich. Natočeno v roce 2002. Účinkují: František Němec, Miroslav Šimůnek, Boris Rösner, Klára Sedláčková - Oltová, Jaroslava Adamová a další.'
