  title: Velká pohádka
  description: Malý Muk. Pohádka o tom, že mocní, bohatí a krásní by nikdy neměli pohrdat těmi malými a ošklivými. Strastiplné příhody osamělého a nepříliš hezkého chlapce na dvoře vznešeného sultána a jeho pyšné dcery. Na motivy pohádky Wilhelma Hauffa napsala Jitka Škápíková, režie Maria Křepelková, natočeno v roce 1996. účinkují Ivan Trojan, Viola Zinková, Martina Hudečková a další.
