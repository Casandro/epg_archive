  title: Dolina sunca, serija (26/210)
  subtitle: ' '
  description: 'Lovro na spoju ugodno iznenadi Ladu poljupcem. Nikola se požali Ivanu na svoj financijski problem s pivnicom uzrokovan Ružinim nepromišljenim odlukama. Otto pokušava biti ljubazan prema Sonji, koja ga hladno ignorira. Ivan se zabrine što je Otto došao u njegov dom, te da nije slučajno nekome spomenuo njegov zdravstveni problem. Juran napominje Sonji da će možda trebati njezinu pomoć pri prikrivanju njegove suradnje s Tomekom za koju nitko ne smije saznati. Otto uvjerava Ivana da njegov problem nije fizički, već psihički i da bi trebao pokušati s nekim vježbama. Nikola ne uspijeva urazumiti Ružu da odustane od proširenja posla. Otto na odlasku sretne Adelu i zahvali joj što su primili Sonju jer nije imala lako djetinjstvo. Lovro uvjerava Ladu u motive svoje odluke da je pozove na spoj i ona mu napokon vjeruje. Sonji teško pada slušati i gledati Juranovu i Natašinu bračnu sreću. Julija pokušava razgovarati s Ružom i uvjeriti je da će se morati pomiriti s činjenicom da ima konkurenciju. Juran se pohvali Sonji novim motorom koji je kupio i pozove ju na vožnju. Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
