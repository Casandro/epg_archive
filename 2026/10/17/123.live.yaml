  title: Unvergessene Legenden - Kirmesmusikanten
  subtitle: Unvergessene Legenden - Kirmesmusikanten
  description: Das erfolgreichste Akkordeon-Duo Europas "Die Kirmesmusikanten" waren gern gesehene Gäste in ganz Europa. Ihre Musik zaubert uns noch heute gute Laune. "Herzlichkeit und Lebenslust kann man nicht so einfach erfinden. Volksmusik kommt aus dem Bauch des Volkes" sagten die Kirmesmusikanten über das Geheimnis ihrer Erfolge. Alle Hits und viel Spannendes aus ihrem Leben  gibt es in dieser Sendung. Die Kirmesmusikanten waren von 1972 - 2000 aktiv und veröffentlichten über 1000 Titel. Ge 2020
