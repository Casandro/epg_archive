  description: Die erfolgreiche Eurovisionssendung "Musikantenstadl" wurde weltweit legendär. Der "Musikantenstadl" war ein Erfolgsformat, das seit 1981 ein Millionenpublikum begeisterte. Der "Musikantenstadl" gastierte tatsächlich auf fünf Kontinenten. Außerdem sahen den "Musikantenstadl" in den über  30 Jahren seines Bestehens rund zweieinhalb Milliarden Fans. Freuen Sie sich auf die schönsten Anekdoten aus 3 Jahrzehnten und die schönsten Auftritte der Stars. Ge 2022
