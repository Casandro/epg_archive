  title: 'Naši ljudi, njihova mjesta: Rosario'
  subtitle: ' '
  description: Južna Amerika, kontinent s tisuću lica od kojih jedno pripada potomcima Hrvata. Pridružite nam se da zajedno saznamo kako žive naši ljudi na ovoj strani svijeta i upoznamo mjesta koja su ih obilježila. Argentina je dom najveće hrvatske iseljeničke zajednice u Južnoj Americi. U četiri epizode dopisnik HRT-a iz Argentine Matija Jerković vodi nas kroz četiri velika argentinska grada, u potrazi za mjestima, ljudima i pričama koje ih povezuju s Hrvatskom. Od Rosarija i La Plate, preko Buenos Airesa pa sve do Córdobe, susrećemo potomke hrvatskih iseljenika ondje gdje danas žive i rade. Otkrivamo tragove i spomenike koje su ostavile prethodne generacije - od klesara, redovnica i poljoprivrednika pa sve do velikana poput izumitelja daktiloskopije Ivana Vučetića. No prije svega pokušavamo otkriti što je od njihova nasljeđa ostalo danas i što njihove potomke, nakon toliko generacija, još povezuje s Hrvatskom. --- Rosario, grad na obali rijeke Paraná, izrastao je zahvaljujući luci, plodnoj zemlji i ljudima koji su u njega pristizali iz različitih krajeva svijeta. Među njima su od samih početaka bili i Hrvati. Jedan od prvih bio je pomorac Matija Nikolorić. U Rosario je stigao početkom 19. stoljeća, kada grad kakav danas poznajemo još nije ni postojao. Njegova neobična životna priča vodi nas do samih početaka razvoja grada. Gotovo dva stoljeća poslije upoznajemo Sol Ivancich, potomkinju hrvatskih iseljenika čija je obitelj generacijama povezana s poljoprivredom i Anamariju Sučec, lektoricu hrvatskog jezika i književnosti s kojom otkrivamo reference na hrvatske obitelji u argentinskim književnim memoarima.
- eventId: 789414
