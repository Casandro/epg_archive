  description: U ranu jesen 1991. godine, nakon tragičnog pada poljoprivrednog dobra Orlovnjak, dijela nekadašnje prve crte bojišta kod Osijeka, poginulo je osam hrvatskih branitelja i civila, a trojica se još vode kao nestali. O obilježavanju tog događaja izvještava naša kolegica Marina Gantar. Kolega Sani Lukić donosi priču o prvom ratnom radiju u Hrvatskoj, osnovanom u Grubišnom Polju. U studiju ćemo se prisjetiti i već legendarne bitke za Novi Farkašić. O njezinu tijeku i značenju razgovarat ćemo s njezinim sudionicima, Ivicom Mužićem i Sašom Kladnikom, pripadnicima 1. bojne 2. brigade Zbora narodne garde, poznate kao Crne mambe.
