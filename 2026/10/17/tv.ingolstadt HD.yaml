  title: Socrates Club (Wh.)
  subtitle: 'Im Sokrates-Club geht es um die großen, philosophischen Fragen unserer Zeit: Was ist Vertrauen?", KI und Menschlichkeit, Klimawandel und individuelle FreiheitDer deutsche Philosoph Julian Nida-Rümelin und ein thematisch passend..'
  description: 'Im Sokrates-Club geht es um die großen, philosophischen Fragen unserer Zeit: Was ist Vertrauen?", KI und Menschlichkeit, Klimawandel und individuelle FreiheitDer deutsche Philosoph Julian Nida-Rümelin und ein thematisch passender Gast reflektieren gemeinsam: Nicht hitzig, aber temperamentvoll. Komplex, aber verständlich. Philosophisch, aber lebensnah. Die Autorin und Dozentin Nathalie Weidenfeld, führt durch die Sendung, gibt Impulse und behält die Zuschauer im Blick. So ermöglicht das Format Tiefe und gibt den Zuschauern Raum zum Mitdenken.'
