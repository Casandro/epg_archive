  subtitle: Zwischen Acker, Aronia und Aufbruch
  description: 'Ein Hof mit Geschichte: Seit 17 Generationen bewirtschaftet Familie Schuhmacher ihren Hof bei Springe, unweit von Hannover. Jetzt steht der Generationswechsel an: Die junge Landwirtin Charlotte übernimmt den Ackerbaubetrieb ihrer Eltern. Zwischen Büro, Hof und Feld wächst sie Schritt für Schritt in ihre neue Rolle hinein. Mit der Aroniabeere hat Charlotte vor einigen Jahren eine neue Kultur auf den Hof gebracht. Die ursprünglich aus Nordamerika stammende Beere gilt als extrem gesund und ist Charlottes ganzer Stolz.'
