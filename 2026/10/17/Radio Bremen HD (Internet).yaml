  title: 'Die Nordreportage: Hofgeschichten'
  subtitle: Nachwuchs im Schweinestall
  description: |-
    Auf Hof Sonnenschein im niedersächsischen Aurich sind gerade 18 Sauen hochtragend. Hermann Poppen sieht täglich mehrfach nach ihnen, um sich davon zu überzeugen, dass es ihnen gut geht.
    In Schleswig-Holstein ist Urte Schulz-Möllgaard im Stress. Ihr Mann Jörg fällt zurzeit wegen einer Erkrankung mit Gürtelrose aus.
    Auf dem Sophienhof beginnt der Tag holprig. Eigentlich will Klauenpfleger Mirko Eichmann mit seiner Arbeit beginnen, aber dafür braucht er Strom. Und das Dieselaggregat läuft nicht rund.
    Im Harzer Herrhausen geht die Weinlese weiter. Nach den roten Cabaret Noir-Trauben sind jetzt die weißen Muscaris-Trauben reif.
- eventId: 865214
  start: 2026-10-17T10:00:00Z
