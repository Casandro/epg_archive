  title: 'Die Nordreportage: Backen, Bluesrock, Bruderherzen'
  subtitle: Generationswechsel am Ofen
  description: 'Kreativ durch die Krise: Das ist das Motto von Daniel Lorenzen, Bäckermeister in vierter Generation. In wenigen Monaten übernimmt er gemeinsam mit seinem Bruder Jasper den elterlichen Betrieb im nordfriesischen Joldelund. Schon als kleine Kinder spielten Daniel und Jasper in der Backstube. Aber können sie sich als Chefs der 60 Angestellten behaupten?'
