  description: |-
    Einmal mit dem Fahrrad durch die Wüste fahren, bei Sonne, Hitze und mit wenig Wasser. Der Abenteurer und Filmemacher Anselm Pahnke hat eine Reise hinter sich, die ihm viel abverlangte. Für die neue Folge der NDR Reihe "Young Adventurers" durchquerte er gemeinsam mit seinem Freund Raphael Bitsos Marokko vom tiefsten Süden bis in die Königsstadt Fès.
    Bewegende Begegnungen, gemeinsames Fastenbrechen im Ramadan und Gespräche über Freiheit, Frieden und Identität prägen die Reise. Auf dem Roten Sofa verrät der Schleswig-Holsteiner, wie wichtig Freundschaft bei so einer Tour ist und warum er sich zu Hause im sozialen Wohnungsbau engagiert.
