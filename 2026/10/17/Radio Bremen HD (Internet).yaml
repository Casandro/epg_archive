  title: Unsere Geschichte - Die letzten ihrer Art
  subtitle: Berufe von damals
  description: Der Dorfschmied, der Wanderschäfer, der Kohlenhändler, viele solcher alten Berufe sind heute nahezu vergessen. Andere sind ganz verschwunden wie das sogenannte "Fräulein vom Amt", der Milchmann oder der Köhler. Früher prägten diese Handwerksberufe den Alltag. Wenn sie jedoch wegfallen, gehen altes Wissen, Können und Traditionen verloren. Norddeutsche, die traditionelle Berufe ergriffen haben, wie es früher war und mit welchen Hoffnungen sie in die Zukunft sehen.
  genre:
