  title: Unsere legendären Schauspielstars
  subtitle: Von Mario Adorf bis Romy Schneider
  description: Die große Leinwand und der rote Teppich wie in Hollywood - ist das ist auch in Deutschland möglich? Ja, denn die Auswahl an bedeutenden deutschen Schauspielstars ist riesengroß. Bereits vor vielen Jahrzehnten begannen die Schauspielkarrieren von zum Beispiel Romy Schneider aus Bayern, Heinz Rühmann aus Nordrhein-Westfalen oder Hildegard Knef aus Baden-Württemberg! Und die Liste namhafter Stars von heute wie Mario Adorf aus Rheinland-Pfalz, Bjarne Mädel aus Hamburg oder Jan Josef Liefers aus Dresden hört damit noch lange nicht auf. Der Film zeigt 16 legendäre deutsche Schauspielstars.
