  title: Ostseereport - Riga Fashion Week
  subtitle: 'Moderation: Linnéa Kviske'
  description: Paris, Seoul, Tokio und New York. Alles Städte, die sich in Sachen Mode einen Namen auf dem internationalen Markt gemacht haben. Aber auch Riga spielt in dieser Liga mit. Lettlands Hauptstadt ist immer wieder eine Überraschung, denn sie ist eines der bedeutendsten Zentren europäischer Mode! 1920 ist Riga eine lebendige, unabhängige Stadt im Aufschwung, eine eigene Modewelt entsteht. Nach dem Zweiten Weltkrieg gehört Lettland zur Sowjetunion. Der Blick der Modebegeisterten geht Richtung Westen. Nach 1991 wird Lettland unabhängig. Eine wechselvolle Geschichte.
