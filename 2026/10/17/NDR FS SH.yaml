  description: 'Eine "Costa" ohne Bettenburgen oder Ballermann-Flair: Die Costa de la Luz ist der wilde Westen von Andalusien. Hier tauchen Thunfischfänger zwischen tonnenschweren Fischen, macht eine Meeresbiologin aus Braunalgen nachhaltige Verpackungen und nutzt eine 19-jährige Wingfoilerin im Surferparadies Tarifa den düsenartigen Ostwind Levante für spektakuläre Sprünge. Und dann sind da noch die Cowboys: An der Costa de la Luz heißen sie Yegüeros und treiben Wildpferde - ein nasser Knochenjob. Denn der Ritt führt nicht durch staubige Prairie, sondern durch das sumpfige Flussdelta des Guadalquivir.'
