  title: 'Entrechtete Frauen: Die Arbeitslager der irischen Kirche'
  subtitle: Irland 2020
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Versklavt und ausgebeutet: Das war das Schicksal von mehr als 10.000 \"gefallener Mädchen\" und lediger Mütter in Irland, die zwangsweise in den berüchtigten Magdalenen-Wäschereien arbeiten mussten.\nDer Dokumentarfilm rekonstruiert anhand der Aussagen von betroffenen Frauen, die wahre und schockierende Geschichte eines beschämenden Systems - ein System, das vom irischen Staat geschaffen und von weiten Teilen der irischen Gesellschaft unterstützt wurde. \nDie Frauen erzählen in eigenen Worten von ihrem Leben vor, während und nach der Zeit im Arbeitslager. Der Beitrag zeigt auch, wie bis heute versucht wird, sie zum Schweigen zu bringen."
