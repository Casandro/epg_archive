  title: Myšlenka na den
  subtitle: Být blíž 1017 - Když nechce být blíž (291. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Setkala jsem se s jednou paní. Stěžovala si mi na velké potíže se svým manželem. Usilovně se modlila za vyřešení těch potíží, ale nic se nedělo. Ptala se mne, jak se má modlit? Co z duchovní zbroje může použít, aby jej získala zpět? Připadalo mi to jako moc těžká otázka.Z našeho rozhovoru vyplynulo, že ona sama netouží být nějak zvlášť Bohu blízko. Nezdálo se, že by o tom přemýšlela. Chtěla jen zpátky svého vzdalujícího se manžela. Když jsem jí vyprávěla něco o tom, že se mohou znovu setkat, když se oba budou přibližovat k Bohu, kroutila hlavou. To její manžel určitě nebude chtít. Sama za sebe si tím také nebyla jistá. Opravdu jsem nevěděla, co jí poradit. Neměla jsem v rukávu žádná kouzla, která by přitáhla odcházejícího manžela. Neměla jsem ani žádnou naději pro jejich vztah, i kdyby se nakrásně vrátil. Co jí zaručí, že neodejde někdy příště? Já moc nevěřím ve stabilitu vztahů, které nestojí na Bohu. Ne že by nemohly existovat, jistě, že jsou. A také ne že by se nemohly hroutit vztahy, které na Bohu někdy založeny byly. Jen většinou se ten rozklad děje navzájem?'
