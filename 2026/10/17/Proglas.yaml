  description: 'Autor a interpret: Milan Tesař * Milan Tesař vás v týdeníku Slyšte, lidé! zve na hudební výlet do Německa. Zazní jazz, world music, soul, folk i písničkářská tvorba v podání umělců z různých částí země, od Kolína nad Rýnem přes Mnichov a Bavorsko až po Hamburk. Představíme například skupiny Quadro Nuevo a The Cat’s Table, zpěvačku Hannah Köpf, kytaristy Paula Morella a Noru Buschmann nebo hamburskou skupinu Angels of Libra.[mjúzik] [kvadro nuevo] [d kets tejbl] [hana kepf] [paula morela] [noru bušman] [ejndžls of libra]'
