  description: 'Autor: Milan Tesař; Interpret: Dana Chytilová; Premiéra: 22.9.2026 * Zpěvačka Dana Chytilová vydala album V mladé duši spoutaná, na kterém se vrací k několika známým šansonům z repertoáru Hany Hegerové a doplňuje je písněmi, které přímo pro ni napsala Lenka Marková. Kromě toho album obsahuje také dvě skladby od autorské dvojice Richard Pogoda a Pavel Dostál. O svém osobním vztahu k šansonům a o různých hudebních spolupracích bude zpěvačka hovořit v našem pořadu Jak se vám líbí. Moderuje Milan Tesař. '
