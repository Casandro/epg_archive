  description: 'Autor: Štěpán Graffe; Interpret: Vojtěch Jakl, Štěpán Graffe; Premiéra: 16.10.2026 * Hostem Oktávy je houslista a zakladatel souboru Rýnský Vojtěch Jakl. V pořadu představí debutovou desku, která vychází u vydavatelství Da Vinci Classics a obsahuje kompletní nahrávku sonát pozapomenutého italského barokního skladatele Ignazia Albertiniho. Zazní také hudební ukázky z alba, které obsahuje  skladby natočené ve světové premiéře. Oktávu připravil a moderuje Štěpán Graffe.'
