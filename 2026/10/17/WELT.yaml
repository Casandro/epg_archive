  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 4'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 4'
  description: In dieser Folge begleitet die Serie die US-Grenzschutzbeamten an der belebtesten Grenze der Welt. Nachts kontrollieren sie Reisende, darunter einen Mann, der seit 20 Jahren nicht zurückgekehrt ist, einen Fahrer, der 15kg Kokain schmuggelt, und einen Truck mit auffälliger, modifizierter Kabine. Spannende Einsätze, überraschende Geschichten und riskante Kontrollen zeigen, wie Grenzschutz täglich für Sicherheit sorgt.
  widescreen: true
- eventId: 776083
  start: 2026-10-17T00:59:00Z
  stop: 2026-10-17T01:46:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 5'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 5'
  description: 'An der US-mexikanischen Grenze ist Wachsamkeit Alltag. In dieser Folge kontrollieren Beamte einen Geschäftsmann aus Mexiko in einem fabrikneuen Wagen - schnell entsteht Verdacht. Auf der Juarez-Lincoln-Brücke schlägt ein Spürhund an, doch die Drogenmenge ist ungewöhnlich gering. Geht es um ein Ablenkungsmanöver eines Kartells? Und: Ein Passant erlebt einen Schreckmoment, als er mit einem bewaffneten Gesuchten verwechselt wird.'
  widescreen: true
- eventId: 776084
  start: 2026-10-17T01:46:00Z
  stop: 2026-10-17T02:32:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 6'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 6'
  description: Die Grenze zwischen den USA und Mexiko ist die meistfrequentierte der Welt. Diese Serie begleitet die Arbeit der US-Zoll- und Grenzschutzbehörde im Kampf gegen Terroristen, Drogen und illegale Waffen. In Hidalgo hofft eine junge Frau aus Kuba auf politisches Asyl. In Laredo machen drei Biologiestudenten mit ungewöhnlicher Fracht im Kofferraum Schlagzeilen. Und ein Neuling erzielt einen der größten Drogenerfolge in der Geschichte der Juarez-Lincoln-Brücke.
  widescreen: true
- eventId: 776085
