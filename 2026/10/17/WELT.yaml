  title: 'Border Patrol Neuseeland: Weißes Pulver aus Brasilien'
  subtitle: 'Border Patrol Neuseeland: Weißes Pulver aus Brasilien'
  description: Am Flughafen Auckland endet eine Reise abrupt, als bei einem Brasilianer eine große Menge Kokain im Koffer entdeckt wird. Währenddessen bringt eine Frau mit nicht deklarierten Samen die Biosecurity-Beamten an ihre Grenzen. Bei der Einwanderungsbehörde versucht eine Ehefrau verzweifelt, den illegalen Aufenthalt ihres Mannes zu vertuschen. Die Folge zeigt, wie schnell Routine in brisante Entscheidungen umschlägt.
  widescreen: true
- eventId: 776114
  start: 2026-10-17T14:09:00Z
  stop: 2026-10-17T14:37:00Z
  title: 'Border Patrol Neuseeland: Fischfang auf Ukrainisch'
  subtitle: 'Border Patrol Neuseeland: Fischfang auf Ukrainisch'
  description: 'Bei der Einwanderungsbehörde sorgt ein chinesischer Staatsbürger mit gefälschtem Pass für Aufruhr. Gleichzeitig stoßen Zollbeamte auf eine große Menge Meth, raffiniert versteckt in scheinbar harmlosen Haushaltsgegenständen. Und: ein Charterflug mit ukrainischen Fischern entwickelt sich zum Großfall, als Zigaretten und Alkohol in einem Ausmaß entdeckt werden, das selbst erfahrene Grenzschützer überrascht.'
  widescreen: true
- eventId: 776115
  start: 2026-10-17T14:37:00Z
  stop: 2026-10-17T15:06:00Z
  title: 'Border Patrol Neuseeland: Der griechische Ex-Häftling'
  subtitle: 'Border Patrol Neuseeland: Der griechische Ex-Häftling'
  description: 'In dieser Folge beginnt der Einsatz bereits bei der Ankunft eines Griechen in Auckland. Er reist ohne Geld ein, bringt jedoch eine bewegende Vergangenheit mit, die Fragen aufwirft. Parallel nehmen die Behörden die Trophäen eines Jägers genau unter die Lupe - darunter auch geschützte Arten. Und auch beim Zoll trügt der erste Eindruck: Jeans mit scheinbar harmlosen Etiketten entpuppen sich als raffinierte Tarnung.'
  widescreen: true
- eventId: 776116
  start: 2026-10-17T15:06:00Z
  stop: 2026-10-17T15:35:00Z
  title: 'Border Patrol Neuseeland: Die goldene Banane'
  subtitle: 'Border Patrol Neuseeland: Die goldene Banane'
  description: 'Ein litauischer Reisender mit ungewöhnlichen Urlaubsplänen gerät ins Visier der Beamten. An der Air Cargo Inspection Facility stoßen Beamte auf eine ausgeklügelte Schmuggelmethode: eine große Menge unverzollter Zigaretten, geschickt verborgen zwischen üblicher Fracht. Währenddessen sorgt im International Mail Centre eine riskante Sendung für Alarm. Zwischen Routine und Risiko kämpfen die Einsatzkräfte gegen illegale Ware und unsichtbare Gefahren - wachsam, entschlossen und unter Zeitdruck.'
  widescreen: true
- eventId: 776117
  start: 2026-10-17T15:35:00Z
  stop: 2026-10-17T16:30:00Z
  title: Traumzüge - Rocky Mountaineer
  subtitle: Traumzüge - Rocky Mountaineer
  description: Kanadas Rocky Mountains sind mit mehr als neun Millionen Besuchern jährlich eine touristische Top-Attraktion. Seit 1990 bietet die Eisenbahngesellschaft Rocky Mountaineer Zugreisen durch die Gebirgsregion des Ahornstaats an. Eine der bekanntesten Strecken ist die von Vancouver nach Banff. Wer es sich leisten kann, genießt für 2.500 Dollar die Landschaft entlang des Fraser Rivers vom Panoramadeck des Premium-Waggons mitsamt Gourmetmenü.
  widescreen: true
- eventId: 776118
  start: 2026-10-17T16:30:00Z
  stop: 2026-10-17T17:22:00Z
  title: Traumzüge - Der AVE 103
  subtitle: Traumzüge - Der AVE 103
  description: Mit bis zu 350 Kilometern pro Stunde - so schnell wie ein Formel-1-Wagen - rast der AVE 103 über Spaniens Highspeed-Strecken. Und hat damit den spanischen Schienenverkehr revolutioniert. Die wichtigste und meistgenutzte Verbindung ist die zwischen Madrid und Barcelona. Schienen und Bahnsteige wurden in jahrelangen Umbaumaßnahmen den hohen Geschwindigkeiten des AVE 103 angepasst. Die 621 Kilometer lange Strecke meistert der Zug in nur zweieinhalb Stunden, sogar Unwettern zum Trotz.
  widescreen: true
- eventId: 776119
  start: 2026-10-17T17:22:00Z
  stop: 2026-10-17T18:15:00Z
  title: Das große Backen - Milliardengeschäft mit Brot und Gebäck
  subtitle: Das große Backen - Milliardengeschäft mit Brot und Gebäck
  description: Jana Beller gewann 2011 die TV-Show "Germany's Next Topmodel". Heute ist sie Geschäftsfrau und führt in Bochum zwei Filialen einer der modernsten Backshop-Ketten Europas. Modelmaße und Gebäck - passt das denn zusammen? Und wie! Die Jungunternehmerin gibt Einblicke ins Geschäft mit den süßen und salzigen Snacks. Schockgefrostet werden die Brote und Süßspeisen aus einer zentralen Produktion in die einzelnen Shops geliefert und an hungrige Laufkundschaft verkauft.
  widescreen: true
- eventId: 776120
  start: 2026-10-17T18:15:00Z
  stop: 2026-10-17T19:10:00Z
  title: Burger-Alarm - Der Siegeszug des Hamburgers
  subtitle: Burger-Alarm - Der Siegeszug des Hamburgers
  description: 'Schnell soll es gehen, lecker und günstig sein - Fast Food. Der Burger ist der Klassiker unter den Snacks auf die Hand. Neben bekannten Ketten durchdringen inhabergeführte Burger-Restaurants zunehmend den Markt. Wie sieht es hinter den Bedientheken deutscher Fast-Food-Läden aus? Systemgastro-Riese Burger King gewährt im Vergleich zu kleineren Burger-Bratern Einblicke in Produktion und Service. Massenware oder Handarbeit: Welches Geschäftsmodell überzeugt am ehesten?'
  widescreen: true
- eventId: 776121
  start: 2026-10-17T19:10:00Z
  stop: 2026-10-17T20:05:00Z
  title: Besser als das Original - Ford Mustang Restaurierung
  subtitle: Besser als das Original - Ford Mustang Restaurierung
  description: Der Ford Mustang ist der Inbegriff des American Way of Life auf vier Rädern. Angetrieben von einem 8-Zylinder-Motor, umweht den Klassiker immer noch das Image von unbändiger Kraft und Freiheit. Die US-Autolegende aus den 60er Jahren lebt und die Nachfrage nach perfekt erhaltenen Exemplaren ist groß. Das V8-Werk, eine auf Pony-Cars wie den Mustang spezialisierte Oldtimerschmiede im sächsischen Pirna, lässt die Träume von Automobil-Nostalgikern wahr werden.
  widescreen: true
- eventId: 776122
  start: 2026-10-17T20:05:00Z
  stop: 2026-10-17T21:05:00Z
  title: Power auf Achsen - Der Schwerlast-Selbstfahrer
  subtitle: Power auf Achsen - Der Schwerlast-Selbstfahrer
  description: Schwerlast-Selbstfahrer gelten als Transportwunder. Ihre Motoren haben mehr als fünfhundert PS und ihr wendiges Fahrwerk besitzt acht Räder pro Achslinie. Damit können sie nicht nur vorwärts und rückwärts, sondern auch seitwärts und diagonal fahren. Ob starke Steigungen, steile Gefälle oder schwierige Untergründe, sie sind wahre Geländeprofis. Sie ermöglichen es, Lasten bis zum Siebenfachen ihres Eigengewichts zu bewegen. Zum Einsatz kommen sie dann, wenn andere Transportsysteme versagen.
  widescreen: true
- eventId: 776123
  start: 2026-10-17T21:05:00Z
  stop: 2026-10-17T22:00:00Z
  title: PS-Riesen im Einsatz - Landmaschinen
  subtitle: PS-Riesen im Einsatz - Landmaschinen
  description: 'Moderne Landwirtschaft ist ohne sie undenkbar: Riesige Erntemaschinen wie Rüben- und Kartoffelroder, tonnenschwere Traktoren und PS-starke Häcksler. Agrartechnik made in Germany spielt auf dem Weltmarkt ganz vorne mit. Wie funktionieren die leistungsstarken Ernteriesen? Wo werden sie hergestellt? Die Reportage sieht sich auf der Landtechnikmesse Agritechnica in Hannover um, ist bei einem Ernteeinsatz in Vorpommern dabei und zeigt, mit welchem Aufwand die XXL-Maschinen transportiert werden.'
  widescreen: true
- eventId: 776124
  start: 2026-10-17T22:00:00Z
  stop: 2026-10-17T22:56:00Z
  title: Vom Passagierjet zum Cargo-Flieger
  subtitle: Vom Passagierjet zum Cargo-Flieger
  description: Das Passagieraufkommen steigt und immer modernere Flugzeuge werden in kurzer Zeit in Dienst gestellt. Gleichzeitig wächst der Bedarf, Waren per Luftfracht zu verschicken. Und so werden Passagierflugzeuge in Cargoflieger umgebaut. Diese "Passenger to Freighter"-Umwandlungen sind mittlerweile ein wichtiges Mittel zur Bewältigung der Nachfrage an Frachtmaschinen. Die 24h-Lieferangebote diverser Onlinehändler benötigen eigene größere Flotten an Flugzeugen und kurbeln damit den Umbaumarkt an.
  widescreen: true
- eventId: 776125
