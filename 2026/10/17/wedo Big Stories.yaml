  title: 'Diana: Eine Prinzessin als Vorbild'
  subtitle: Show / Game show 2008
  description: '2008 Der Modegeschmack von Lady Diana wurde oft unter die Lupe genommen. Sie hatte ein Händchen dafür, Outfits auszuwählen, die sowohl stilvoll als auch raffiniert waren und immer Aufmerksamkeit erregten. Ihre Hüte waren ein weiteres herausragendes Merkmal; sie trug oft elegante Modelle, die ihrem Look einen Hauch von Anmut verliehen. Auch ihre Frisur war ikonisch: Sie war meist ordentlich gestylt, ihr Haar hatte einen leichten Schwung und umrahmte ihr Gesicht perfekt. Show / Game show 2008'
