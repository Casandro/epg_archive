  title: Xena
  subtitle: Vorhang auf für Gabrielle
  description: |-
    Piräus: Als die Halunkin Zehra (Jennifer Ward-Lealand) und ihr Kompagnon Milo (Mark Hadlow) in den Besitz von Gabrielles Schriften gelangen, kommt dem Duo eine verwegene Idee. Sie geben sich als Kunstschaffende aus und überreden die Autorin, ihre Geschichte als Theaterstück zu inszenieren. Überzeugt davon, dass das Projekt ein grandioser Flop werden wird, will das Betrügerpaar das Geld der Sponsoren kurzerhand in die eigene Tasche stecken. Gerade als Gabrielle die Tücken des Theaters erkennt, betritt Xena die Bühne, um den Bösewichten die Show zu stehlen.
