  title: The Legend of Hercules
  description: "Hercules (Kennan Lutz), Spross einer heimlichen Liebesnacht zwischen Göttervater Zeus und Königin Alkmene, muss ins Exil. Der rach- und herrschsüchtige Stiefvater König Amphitryon (Scott Adkins) verbannt den Jungen als Sklaven nach Ägypten. Dort entdeckt Hercules seine wahren Fähigkeiten. Und seine wirkliche Lebensaufgabe, für die er planvoll gezeugt worden ist. - Regisseur Renny Harlin ist in einem Cameo-Auftritt selbst im Film zu sehen. Er spielt einen Hauptmann, der dem König Amphitryon gegen Ende des Films Meldung macht, dass Hercules wieder im Lande sei. \nUSA, , DEU 2014"
