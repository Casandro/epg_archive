  title: Hercules
  subtitle: Ein unerklärlicher Traum
  description: |-
    Iolaus hat einen seltsamen Traum, der ihn dazu veranlasst, nach Norden zu reisen. Auch wenn zunächst unklar ist, was es mit der mystischen Vision auf sich hat, beschließt Hercules, seinen Freund bei dem Abenteuer ins Ungewisse zu begleiten. In der Provinz Bethos, die auf dem Weg der Helden liegt, schmieden derweil König Polonius (Edward Newborn) und dessen Frau Maliphone (Denise O'Connell) einen perfiden Plan: Da das Orakel von Delphi prophezeit hat, dass der nächste Thronfolger nicht aus der Abstammungslinie der Herrschenden entspringt, wollen sie alle männlichen Babys des einfachen Volks töten!
