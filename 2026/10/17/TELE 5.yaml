  title: Xena
  subtitle: Der Weg des Lebens
  description: |-
    Als ihr Freund, der Geistheiler Eli, von dunklen Kräften bedroht wird, holen die Heldinnen zum Gegenschlag aus. Gabrielle versucht - ganz wie es ihrem Wesen entspricht - den Konflikt auf friedliche Weise zu lösen. Xena hingegen wählt den kämpferischen Weg: Sie verbündet sich mit der hinduistischen Gottheit Krishna (Rajeev Varma), um den Dämonenangriff abzuwehren. Auch der Affengott Hanuman (Jake McKinnon) steht ihr zur Seite. Als es zum Showdown mit dem berüchtigten Indrajit (Rajneel Singh) kommt, wird Xena im Kampf schwer verwundet. Jetzt kann die Kriegerprinzessin Krishnas göttlichen Beistand sehr gut gebrauchen.
    USA 1999
