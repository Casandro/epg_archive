  title: Bayern 1 Heute im Stadion
  subtitle: Mit Philipp Eger
  description: "Mit Philipp Eger\nDie Bayern 1 Bundesligashow - Kult!\nGeballte Fußballkompetenz und jede Menge Leidenschaft - Moderator Philipp Eger trägt sein Fußballherz auf der Zunge.\nUnsere Bayern 1 Reporterinnen und Reporter berichten live für Sie aus den Stadien in ganz Deutschland. Natürlich auch immer mit Blick auf die Bundesliga der Frauen und die bayerischen Mannschaften in der 2. und 3. Liga.\nExperteninterviews und Stimmen aus den Stadien runden den Bayern 1 Fußballsamstag ab.\nWerden Sie ein Teil von Heute im Stadion. Tippen Sie gegen einen Promi im Bayern 1 Kicktipp:\nhttps://www.br.de/radio/bayern1/sendungen/heute-im-stadion/kick-tipp/index.html \n\n\nab 18.30 mit Live-Einblendungen vom Bundesliga-Topspiel\nFC Bayern München - RB Leipzig\n16.00 / 18.00 / 19.00 / 20.00 Nachrichten, Wetter, Verkehr"
