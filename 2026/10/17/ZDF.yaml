  audiodesc: true
  description: |-
    Deutschland 2024
    Nikola Tesla, seine Ideen prägten unsere Stromnetze, Fernseher und Telefone. Die "Terra X"-Dokumentation zeigt den exzentrischen Lebensweg des Erfinders.

    Für seine Mitmenschen galt er stets als Sonderling, ausgestattet mit einem großen Selbstbewusstsein. Sein unbändiger Forschergeist, seine genialen Ideen und ein gewisses Showtalent führten ihn aus der Provinz in die High Society New Yorks zum Ende des 19. Jahrhunderts.
    HD-Produktion
