  description: |-
    Drama, Deutschland 2023
    Die Konfrontation mit seinem ehemaligen Fußballtrainer, der ihn als Kind missbrauchte, stürzt den beruflich erfolgreichen Frank in eine Lebenskrise.

    Frank hat sich nie jemandem anvertraut. Als er auf Drängen seiner Frau in sein Heimatdorf zurückzieht, überkommen ihn die jahrelang unterdrückten Schuld- und Schamgefühle.
