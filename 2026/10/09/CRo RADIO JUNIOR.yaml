  start: 2026-10-09T15:01:00Z
  stop: 2026-10-09T15:30:00Z
  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Ludvík Píza, programový manažer Signal Festivalu. Jak se z obyčejné pražské ulice může stát obrovská světelná galerie? A co všechno se skrývá za instalacemi, které během Signal Festivalu rozzáří Prahu? Do Rádia Junior dorazí programový manažer Signal Festivalu a také jeden z umělců, kteří světelné instalace vytvářejí. Prozradí nám, jak takové dílo vůbec vzniká, kolik lidí na něm pracuje a co všechno musí umělec a jeho tým zvládnout, než se instalace poprvé rozsvítí. Odkud světelní umělci berou inspiraci? Může vlastní světelnou instalaci vytvořit třeba i dítě. A protože i letos Signal Festival spolupracuje s Českým rozhlasem, zjistíme, co vznikne, když se spojí světlo, zvuk a rozhlasové vysílání. Moderuje Jiří Kohout.
