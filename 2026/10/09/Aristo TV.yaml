  title: ANIXE auf Reisen - Teneriffa mit Eva Habermann
  description: 'Die kanarische Ferieninsel als Badedestination muss allgemein sicherlich nicht mehr vorgestellt werden. Sonne satt, Strandleben und beste Unterhaltung: Teneriffa erfreut sich bei deutschen Urlaubern großer Sympathie. In der Sendung "Anixe auf Reisen - Teneriffa" entführt die Schauspielerin Eva Habermann diesmal die Zuschauer an jene Flecken der Insel, die bisher nur vergleichsweise wenigen Reisenden geläufig waren. Die Reiseroute führt unter anderem zu den ökologisch reizvollen Regionen abseits der Touristenströme und in den Naturpark rund um den Vulkan Pico del Teide. Ausflüge zu kulinarischen Spezialitäten auf dem Land und an heimelige Rückzugsorte zur Ruhesuchende gehören ebenfalls zu Eva Habermanns Reiseprogramm. Mit dieser Folge "Anixe auf Reisen-Teneriffa" beweist die Schauspielerin, dass sich die Kanareninsel in den vergangenen Jahren mit ihrer Flora und Fauna auch zu einem Top-Ziel des nachhaltigen Tourismus gemausert hat.'
  widescreen: true
