  title: OnlineKirche mit Pastor Gert Hoinle - Die Augen des Glaubens verändern dein Leben
  description: 'Ein Millionär sieht die Welt mit anderen Augen als ein Bettler, ein Gesunder mit anderen wie ein Kranker. Augen sind Wahrnehmungsfilter: Lots Augen der Geldliebe sorgten für Augen der Hoffnungslosigkeit bei seinen Töchtern. Es gibt Augen der Gier, Lust, Neid, Bequemlichkeit... und auch des Glaubens. So veränderte sich Davids Leben ganz gewaltig, als er nach der Salbung durch Samuel mit den Augen eines Königs auf die Welt blickte. Das ließ ihn Gleichgültigkeit und Ablehnung durch Familie und Regierung ertragen. Denn er wusste: in ihm steckt ein König. Auch Mose, Johannes der Täufer, Judas und natürlich Jesus blickten mit ganz eigenen Augen auf die Welt.'
  widescreen: true
