  description: "Quellschüttungen sinken weiter - Wasserressourcen in Freyung zunehmend belastet\nIm Stadtgebiet Freyung gehen die Quellschüttungen weiter kontinuierlich zurück. Die Stadt gibt bekannt, dass dadurch die eigenen verfügbaren Wasserressourcen zunehmend belastet sind. Damit die Trinkwasserversorgung von Kreuzberg-Dorf sichergestellt werden kann, wird eine zusätzliche fliegende Wasserleitung installiert werden, über die Wasser aus Mauth zugeliefert werden kann. Und auch in Winkelbrunn ist eine Versorgung mit Fernwasser erforderlich.\n\nGorilla Tag in Passau - Freestyle Sport an der Wirtschaftsschule\nDass ausreichend Bewegung und gesunde Ernährung wichtig für einen funktionierenden Körper sind, ist wohl den meisten bekannt. Trotzdem gelingt es vielen nicht, empfohlene Richtwerte einzuhalten. Genau hier setzt das sogenannte Gorilla-Schulprogramm an. Am Montag war das Team des Programms an der Staatlichen Wirtschaftsschule Passau zu Besuch. Wir haben das Ganze mit der Kamera begleitet.\n\nKontrastprogramm bei den Passau Black Hawks - Erst beim Vorletzten, dann beim Tabellenführer \nZumindest den zweiten Saisonsieg konnten die Passau Black Hawks am vergangenen Wochenende einfahren. Aber es läuft weiter längst noch nicht alles perfekt. Das zeigte auch wieder das letzte Drittel in Selb. Deshalb soll dieses Wochenende eine Steigerung her."
