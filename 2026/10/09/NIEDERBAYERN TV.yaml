  title: NIEDERBAYERN TV Journal Deggendorf-Straubing vom 8.10.2026 (Wh.)
  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit eine..
  description: "Kita-Gebühren - Keine Mehrbelastung für Eltern in Straubing\nDer Freistaat Bayern hat sich dazu entschieden, Kitas finanziell besser zu unterstützen. Das ist eigentlich eine gute Nachricht, wäre da nicht ein kleiner Haken: Dafür wird nämlich in Zukunft der bisherige 100-Euro-Zuschuss für die Eltern umgeleitet. Das heißt, die 100 Euro kommen in Zukunft direkt den Kitas zugute, den Eltern fehlen sie dann aber im Portemonnaie. Ob und inwiefern die Träger der Einrichtungen das Geld wieder auf die Eltern umlegen, indem sie die Gebühren senken, bleibt ihnen selbst überlassen. Ein Dilemma, das auch in Straubing schon diskutiert wird. \n\nFlugsicherheitsübung - Luftretter trainieren für den Ernstfall\nWenn es irgendwo im Wald brennt, kann der Blick von oben entscheidend sein. In Niederbayern übernehmen diese Aufgabe speziell geschulte Luftbeobachter gemeinsam mit den Piloten der Luftrettungsstaffel. Damit Meldungen, Funk und Zusammenarbeit im Ernstfall funktionieren, wird regelmäßig geübt. Am Flugplatz Straubing-Wallmühle kamen dafür diesmal knapp 40 Teilnehmer und zehn Flugzeuge zusammen.\n\nNach vier Siegen in Folge - Straubing Tigers wollen Serie gegen Iserlohn fortsetzen\nAuf den vierten soll der fünfte Sieg folgen! Die Straubing Tigers wollen am Wochenende ihre Serie weiterführen und an den starken Leistungen zuletzt anknüpfen. Die Aufgaben dafür könnten kaum unterschiedlicher sein: Am Freitag geht es gegen den Vorletzten Iserlohn, am Sonntag gegen Top-Team Mannheim."
