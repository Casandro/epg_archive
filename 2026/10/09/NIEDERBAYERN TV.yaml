  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit eine..
  description: "Ein Sommernachtstraum - Komödie von William Shakespeare am Landshuter Theater\nFrischer Wind am Landestheater Niederbayern: Mit Astrid Großgasteiger hat das Haus eine neue Intendantin - und die startet ihre erste Spielzeit in Landshut mit einem Klassiker. Ein Sommernachtstraum von William Shakespeare macht den Auftakt. Wir waren bei der Vorpremiere dabei und haben uns angeschaut, wie der Neustart auf der Bühne aussieht.\n\nWo was los ist - Die Veranstaltungshinweise für die kommende Woche \nDas Wetter wird zunehmend kühler und auch die Tage werden langsam kürzer. Langweilig wird es in der Region Landshut aber trotzdem nicht. Wer in der kommenden Woche noch Ideen für Ausflüge oder Freizeitaktivitäten braucht, kann sich auf eine große Auswahl freuen. Von kulinarischen Highlights auf dem Fischmarkt bis Grusel-Stimmung im Bayern Park, ist für jeden was dabei. Aber auch Theater- und Musikfans kommen an diesem Wochenende auf ihre Kosten.\n\nDEL 2 - Vorbericht EV Landshut\nFreitag hui, Sonntag pfui - so sah es bisher an den ersten drei Spielwochenenden der neuen DEL2-Saison für den EV Landshut aus. Die bisherigen Freitagsspiele konnte die Krupp-Truppe allesamt gewinnen, doch am Sonntag setzte es jeweils eine Niederlage. Das soll nun an diesem Wochenende besser werden."
