  description: "Erinnerung an Stalag: Autor Robert Miller kehrt für Buchvorstellung nach Moosburg zurück\nIn Moosburg setzen sich engagierte Bürgerinnen und Bürger seit Jahren dafür ein, die verbliebenen Überreste des ehemaligen Kriegsgefangenenlagers des zweiten Weltkriegs zu erhalten - als Mahnmal und als Ort der Erinnerung. Ein dunkles Kapitel der Moosburger Geschichte, das bis heute seine Spuren hinterlassen hat. Einer unter den zehntausende Menschen, die im Stalag 7A untergebracht waren war der Vater des US-Amerikaners Robert Miller. Seine Erlebnisse hielt er damals in einem Tagebuch fest. Auf Grundlage dieser Aufzeichnungen entstand das Buch Hidden Hell, das Miller jetzt in Moosburg vorgestellt hat. \n\nStarke Familien, starke Zukunft: Fachtag in Moosburg stellt Familiengesundheit in den Fokus\nFamilie kann wunderschön sein - aber eben auch ganz schön herausfordernd. Zwischen Alltag, Arbeit, Schule, Terminen und den ganz normalen kleinen Reibereien kann es manchmal schwierig werden, alles unter einen Hut zu bekommen. Genau da setzt die Familiengesundheit an: Wie können Familien gestärkt werden? Was hilft, wenn es stressig wird? Und wie lässt sich auch mit Konflikten gut umgehen? Um diese Fragen ging es bei einem Fachtag in Moosburg.\n\nImmer dieser Zirkus - Generalprobe der Kleinen Komödie Kumhausen\nEin Bürgermeister, der seine ganz eigenen Vorstellungen von guter Politik hat, eine resolute alte Dame und eine Zirkuschefin mit magischen Fähigkeiten - das sind die Zutaten für jede Menge Turbulenzen auf der Theaterbühne. Bei der Kleinen Komödie Kumhausen geht es im neuen Stück um fragwürdige Geschäfte, geheimnisvolle Zauberei und ein Rathaus, in dem plötzlich nichts mehr so läuft wie geplant. Wir haben bei der Generalprobe vorbeigeschaut und zeigen Ihnen, was das Publikum erwartet."
