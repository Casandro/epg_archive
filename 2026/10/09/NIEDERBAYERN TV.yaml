  description: "Besonderes Gütesiegel - Beste Arbeitgeber Niederbayerns ausgezeichnet\nWas macht einen guten Arbeitgeber aus? Ein faires Gehalt, ein gutes Betriebsklima oder die Möglichkeit, sich weiterzuentwickeln? Mit dieser Frage beschäftigte sich gestern die Veranstaltung Beste Arbeitgeber Niederbayern. Dabei wurden Unternehmen für ihre Arbeitsbedingungen und Personalkonzepte ausgezeichnet. Als Kooperationspartner war auch NIEDERBAYERN TV mit dabei. Und durch den Abend führte ein Gesicht, das Sie aus unserem Programm kennen.\n\nFachkräfte von morgen - Nachwuchs-Handwerkertag an der Mittelschule Bogen\nHandwerk hat goldenen Boden - heißt es so schön. Doch vom goldenen Handwerksboden bis zu den angehenden Handwerkern von morgen ist es oft ein langer Weg, vor allem angesichts des anhaltenden Fachkräftemangels. Die Kreishandwerkerschaft Donau-Wald geht deshalb einen direkten Weg: Sie bringt das Handwerk direkt dorthin, wo der Nachwuchs sitzt - nämlich in die Schulen. Beim Nachwuchs-Handwerkertag kamen neun Betriebe in die Mittelschule Bogen und gewährten den Jugendlichen einen Blick in die Welt des Handwerks. \n\nKartons und Querflöte - Grundschüler entdecken die Welt der Musik\nWie klingt Regen? Womit lässt sich eigentlich alles Musik machen? Und was passiert, wenn eine Querflöte auf gleich drei Schlagzeuger trifft? Antworten auf diese durchaus ungewöhnlichen Fragen bekamen kürzlich die Schüler der Abt-Utto-Grundschule in Metten. Und dabei durften die Kinder nicht nur zuhören, sondern auch selbst mitmachen. Was es genau damit auf sich hat? Wolfgang Jester und Lina Schreiner wissen mehr."
