    Doch Anna leidet schon länger an einer psychischen Erkrankung und das Gremium hat Zweifel daran, ob sie der Mission gewachsen ist. Erst als die Ingenieurin Reva die Lichtsignale der ISS mit "Send Anna only" entschlüsseln kann, fällt die Entscheidung, Anna mitzunehmen.
