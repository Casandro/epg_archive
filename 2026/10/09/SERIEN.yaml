  title: Cedar Cove - Das Gesetz des Herzens - Alte Flamme, neuer Funke
  subtitle: Cedar Cove - Das Gesetz des Herzens - Alte Flamme, neuer Funke
  description: Stan und Olivia machen einen Spaziergang zu einem nahen See mit vielen Erinnerungen an ihren Sohn und führen ein langes Gespräch über das Geschehene. Jack, der Olivia sucht,  beobachtet ungewollt das vertraute Miteinander der beiden, ist verunsichert und kehrt um. Auch zwischen Grace und Will, Maryellen und John sowie zwischen Justine und Seth entstehen neue, unübersichtliche Situationen.  US 2012
- eventId: 1526821
  start: 2026-10-09T07:15:00Z
  stop: 2026-10-09T07:20:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Interessenskonflikte
  subtitle: Cedar Cove - Das Gesetz des Herzens - Interessenskonflikte
  description: Olivia hat einen leichten Auffahrunfall ohne weitere Schäden, aber der Betroffene will sie verklagen und lässt sie vorladen. Jack hat eine wunderbare Idee und erteilt dem offensichtlich traumatisierten Mann eine Lektion. Der lässt daraufhin die Klage fallen. Olivia ist glücklich, doch nicht nur deswegen - zwischen ihr und Jack läuft es wunderbar. US 2012
- eventId: 1526822
  start: 2026-10-09T07:20:00Z
  stop: 2026-10-09T07:25:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Verletzte Gefühle
  subtitle: Cedar Cove - Das Gesetz des Herzens - Verletzte Gefühle
  description: Stan unternimmt alles, um sich bei seiner Tochter und bei Olivia in ein gutes Licht zu setzen. Er hat beschlossen, sich von seiner Frau Melanie zu trennen und nach Cedar Cove zurückzukehren. Olivia ist überwältigt. Jack trifft unterdessen eine schwere Entscheidung. Er sagt ein traumhaftes Jobangebot ab, um bei Olivia zu bleiben und ist froh darüber. Da erfährt er durch Stan von dessen Plänen. US 2012
- eventId: 1526823
