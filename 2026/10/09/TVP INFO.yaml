  title: Wenecja, miasto wyrosłe z bagien
  subtitle: Wenecja zbudowana została w bardzo niesprzyjającym terenie. Budowniczowie i naukowcy szukają sposobów na ratowanie miasta coraz bardziej zapadającego się w grząskim gruncie laguny.
  description: |-
    Tytuł oryginalny: Venice: Building Beauty from a Swamp
    FR, 2022
    Reżyseria: Guilain Depardieu
    Film dokumentalny o Wenecji. To jedno z najpiękniejszych miast świata, narodziła się z osobliwego pomysłu: pragnienia zbudowania miasta pośrodku wody. Wyłoniona 1500 lat temu z błota bagiennej laguny, Wenecja od tamtej pory zdołała wznieść się ponad wyzwania stawiane przez morze. Założyciele miasta wiedzieli, co robią: nieustanne zagrożenie ze strony wody jest również źródłem fortuny miasta i światowego wpływu. Ale wymaga to ciągłej czujności.
  ageRating: 12
  genre:
  - '35'
