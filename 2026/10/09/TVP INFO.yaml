  title: Podróże z historią 4 (odc. 3)
  subtitle: Widzowie poznają tajniki historycznej produkcji papieru. Radosław Kotarski rusza do Dusznik Zdroju. Zastanawia się, dlaczego produkcję papieru nazywa się czerpaniem i jak wykonuje się znak wodny.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Papier to rzecz na tyle zwyczajna, że właściwie nie zwracamy na niego większej uwagi na co dzień. Jednak nie wyobrażamy sobie życia bez papieru. Dlatego warto poznać tajniki jego historycznej produkcji. W tym celu Radosław Kotarski rusza do Dusznik Zdroju i sam ręcznie wytwarza arkusze papieru. Przy tej okazji zastanawia się, dlaczego produkcję papieru nazywamy czerpaniem i jak możliwe jest wykonanie znaku wodnego. Nie obędzie się bez wytężonej pracy!
  genre:
  - '149'
