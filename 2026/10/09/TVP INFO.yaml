  title: Podróże z historią 3 (odc. 5)
  subtitle: Podróżowanie stało się elementem codzienności. Kilkaset lat temu ktoś, kto wybierał się w daleką podróż, musiał pokonać wiele trudności. Nieodłącznym elementem podróży było spisywanie wspomnień.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Dziś podróżowanie rowerem, samochodem czy samolotem jest tak powszechne, że nie wymaga większej uwagi. Dwieście czy trzysta lat temu, gdy ktoś wybierał się w liczącą kilkaset kilometrów podróż, musiała z tej wyprawy powstać książka ze wspomnieniami. Tym razem Radosław Kotarski przenosi się właśnie w dawne czasy, aby przekonać się, jak wyglądało przemieszczanie się naszych pradziadów. Zapraszamy w niezwykłą podróż w czasie.
  genre:
  - '149'
- eventId: 1438883
  start: 2026-10-09T01:30:00Z
  stop: 2026-10-09T02:03:00Z
  title: Polskie parki narodowe 1 (odc. 2)
  subtitle: Tematem programu będzie Wigierski Park Narodowy, jeden z najcenniejszych obszarów przyrodniczych Polski, słynący z jezior, lasów i bogatej fauny.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dariusz Gross, dziennikarz zafascynowany przyrodą, pokazuje parki narodowe, które znamy jako turyści, z innej, zaskakującej strony, przez pryzmat pracy naukowców zgłębiających sekrety ekosystemów i pracujących nad ich zachowaniem. To program pokazujący osobliwości przyrody i ukazujący wyjątkowość poszczególnych parków narodowych w Polsce, w którym spotykają się nowoczesne technologie badawcze z odwiecznym dziełem natury.
  genre:
  - '35'
