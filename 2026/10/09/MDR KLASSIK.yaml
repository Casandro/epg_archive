  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Christoph Willibald Gluck: Sinfonie F-Dur (L'Orfeo Barockorchester: Michi Gaigg); Johann Sebastian Bach: Präludium und Fuge D-Dur, BWV 532 (Ákos Hernádi, Klavier); Johannes Brahms: "Drei Fest- und Gedenksprüche", op. 109 (Südfunk-Chor Stuttgart: Rupert Huber); Joachim Raff: Klaviertrio D-Dur, op. 158 (Trio Opus 8); Richard Strauss: "Aus Italien", op. 16 (SWR Sinfonieorchester Baden-Baden und Freiburg: François-Xavier Roth)

    2.03  Das ARD-Nachtkonzert (II)

    Antonín Dvorák: "Dimitrij", Ouvertüre (Rundfunk-Sinfonieorchester Berlin: Hans E. Zimmer); Frederick Delius: Sonate in einem Satz (Michael Schlechtriem, Violoncello; Noriko Kitano, Klavier); John Field: "Irish Concerto" (Benjamin Frith, Klavier; Royal Scottish National Orchestra: Andrew Mogrelia); John Parry: Sonate H-Dur (Andrea Vigh, Harfe); Gustav Mahler: Sinfonie Nr. 1 D-Dur - "Der Titan" (SWR Symphonieorchester: Christoph Eschenbach)

    4.03  Das ARD-Nachtkonzert (III)

    Franz Schubert: Fünf Tänze (Münchner Rundfunkorchester: Stefano Ranzani); Georg Friedrich Händel: Suite G-Dur, HWV 441 (Evgeni Koroliov, Klavier); Percy Grainger: "In a Nutshell" (City of Birmingham Symphony Orchestra: Simon Rattle)

    5.03  Das ARD-Nachtkonzert (IV)

    Marie Jaëll: Violoncellokonzert F-Dur, Allegro moderato (Xavier Phillips, Violoncello; Brussels Philharmonic: Hervé Niquet); Antonio Vivaldi: Violinkonzert D-Dur, RV 210 (Enrico Onofri, Violine; Il Giardino Armonico: Giovanni Antonini); Georg Friedrich Händel: Suite B-Dur, HWV 440 (Ragna Schirmer, Klavier); Gustav Holst: "St. Paul's Suite", op. 29, Nr. 2 (London Festival Orchestra: Ross Pople); Bernhard Henrik Crusell: Klarinettenkonzert Nr. 2 f-Moll, Andante pastorale (Martin Fröst, Klarinette; Göteborger Sinfoniker: Okko Kamu); Joseph Haydn: Sinfonie Nr. 104 D-Dur, Finale spirituoso (Orchestra della Svizzera Italiana: Howard Shelley)
