- eventId: 802195
  start: 2026-10-09T05:55:00Z
  stop: 2026-10-09T06:40:00Z
  title: 'Quarks: Mehr Wildnis wagen - Wie nah darf sie uns kommen?'
  subtitle: 'Moderation: Thomas Ranft'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wilde, scheinbar unberührte Natur fasziniert viele Menschen. Sie verspricht Freiheit, Abenteuer und eine Welt, die ihren eigenen Regeln folgt - und uns daran erinnert, dass nicht alles geplant, geordnet und kontrolliert sein muss. Deshalb wünschen sich viele mehr Wildnis. Doch was passiert, wenn sie nicht nur Sehnsuchtsort ist - sondern plötzlich ganz nah?
    Wenn Füchse durch Wohngebiete streifen, Waschbären durch unsere Städte ziehen oder Wölfe wieder Teil unserer Kulturlandschaften werden, zeigt sich: Unsere Begeisterung für "wilde" Natur endet oft dort, wo sie unseren Alltag betrifft. Wie kann das Zusammenleben gelingen?
