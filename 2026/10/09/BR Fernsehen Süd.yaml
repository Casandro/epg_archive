  description: |-
    Im hohen Gras der Karoo lauert der erfolgreichste Jäger unter den Katzen Afrikas: ein Serval! Seine extrem langen Beine, der lange Hals und sein exzellentes Gehör machen ihm zum perfekten Jäger auf diesem Terrain.
    Nicht Löwen oder Leoparden sind Südafrikas erfolgreichste Raubtiere, die seltenen Wildhunde jagen im Rudel deutlich effizienter als ihre Konkurrenz. Von mehreren Seiten gleichzeitig greifen sie eine Herde Gnus an, versuchen ein einzelnes Beutetier zu isolieren. Doch die Gnus wissen sich zu wehren. Instinktiv bleiben sie dicht zusammen. So haben die Angreifer kaum eine Chance.
