  title: Best of DW Podcasts
  widescreen: true
  subtitle: Germany's Next Tech Champions?
  description: |-
    With humanoid robots, climate-friendly chocolate and next-generation semiconductors, they just might transform entire industries. David Reger, founder of NEURA Robotics, is developing intelligent humanoid robots with his team in Metzingen, Germany — not to replace people, but to assist them: in the home, in caregiving and in dangerous situations.
    Speed and efficiency are the focus for brothers Sebastian and Daniel Schall, the minds behind Black Semiconductor. Their chip technology combines electrical and optical data transmission — a small revolution in the semiconductor market. In a purpose-built high-tech production facility in Aachen, Germany, international experts are laying the foundations for tomorrow's energy efficiency — creating a cornerstone for artificial intelligence, autonomous driving and the digital transformation.
    Twins Sara and Max Marquart, founders of Planet A Foods, are exploring the future of what we eat. Their goal: to complement cocoa and coffee — crops increasingly affected by climate change — with sustainable alternatives. Their innovative chocolate alternative, ChoViva, is already being used in a wide range of foods.
