  title: Mallorca - Zu Gast bei Michael Standor
  subtitle: Mallorca - Zu Gast bei Michael Standor
  description: Kapitän Michael Standor hat die Baleareninsel Mallorca für das Big Game entdeckt. Wenn das Wetter es zulässt, fährt der Kapitän jeden Tag aufs offene Meer und erfüllt Anglerträume. Von dem Potenzial Mallorcas konnte sich Redakteur Peter Wahl im Sommer 2017 selbst überzeugen. In nur wenigen Stunden fing er zusammen mit zwei weiteren Gästen feiste Goldmakrelen, große Blauflossenthune und einen Schwertfisch.  DE 2017
