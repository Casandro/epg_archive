  description: Wird Bjorn Riley in seiner Heimat den Sieg davontragen können? Der US-Amerikaner belegte in diesem Jahr unter anderem den dritten Platz in Saalfelden-Leogang. Im vergangenen Jahr landete er in Lake Placid schließlich auf Platz 14. Den Sieg holte sich damals sein Landsmann Christopher Blevins. (2026)
