  subtitle: Eintagesrennen der Herren. 2024 konnte sich der Italiener Giulio Ciccone nach einer schwierigen Saison über Platz drei freuen.
  description: Die Lombardei-Rundfahrt ist ein Radrennen mit langer Tradition. Es wurde erstmals 1905 ausgetragen und zählt zu den fünf "Monumenten des Radsports". Über die vielen Jahrzehnte wechselten die Start- und Zielorte häufig, aber seit 2014 führt die Strecke immer von Como nach Bergamo oder umgekehrt. Das Rennen zählt zur UCI WorldTour und ist in die höchste Kategorie 1. UWT eingestuft. (2025)
