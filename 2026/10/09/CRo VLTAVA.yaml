  title: Akcent
  description: Nezvaní hosté, Kanály, Popel a démant, Země zaslíbená, Člověk z mramoru a Člověk ze železa, Danton nebo taky Katyň - to jsou názvy filmů, které spojuje jméno polského režiséra Andrzeje Wajdy. Dnes je tomu deset let od jeho úmrtí, letos v březnu jsme si ale také připomněli 100 let od jeho narození. Co nám Wajdovo dílo říká dnes? Saša Michailidis se ptá Iwony Łyko-Plos a Petra Vlčka. Repríza z 5. 3. 2026.
