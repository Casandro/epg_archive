- eventId: 1565682
  start: 2026-10-09T08:02:00Z
  stop: 2026-10-09T09:00:00Z
  title: Vizitka
  description: 'Pavla Sceranková, sochařka. Co všechno může socha dokázat, když se jí dotkneme, rozhýbeme ji nebo do ní sami vstoupíme? Pro Pavlu Scerankovou není socha nehybným objektem, ale prostorem pro prožitek, hru a fyzickou zkušenost. Její nápadité a často vtipné instalace překračují tradiční představu o sochařství a vznikají v těsném vztahu ke konkrétnímu prostoru i člověku, který se s nimi setká. Právě za svou tvorbu se Sceranková stala čtvrtou laureátkou Ceny Medy Mládkové pro současné výtvarné umělce. Co může umění člověku nabídnout v době, kdy má tolik jiných možností, jak svou energii využít? A kde jsou jeho hranice? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
