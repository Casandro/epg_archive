  title: ArtCafé
  description: 'Poslechněte si průřez tím nejlepším ze světa world music uplynulých dvanácti měsíců v ArtCafé Jiřího Moravčíka. Platforma Transglobal World Music Chart zveřejnila výroční přehled 2025-2026. Platformu tvoří desítky odborníků a publicistů z celého světa, mezi které patří také autor pořadu. Nezvyklé období zveřejnění souvisí se říjnovým konáním prestižního hudebního veletrhu Womex, kde jsou výsledky slavnostně vyhlášeny. E-mail: artcafe@rozhlas.cz'
