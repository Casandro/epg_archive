  title: Die 80er - Das explosive Jahrzehnt
  subtitle: '1980-83: Kalter Krieg und heißer Rock'
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2017
    Die 80er-Jahre haben ein Hauptthema: die Angst vor einem dritten Weltkrieg, das Wettrüsten zwischen Ost und West, sowjetische SS-20 versus Pershing II und Cruise Missiles.

    Der NATO-Doppelbeschluss vom 12. Dezember 1979 gibt das Startsignal für den Rüstungswettlauf der 80er. Der Kalte Krieg sollte das Jahrzehnt bis fast zum Ende bestimmen. Zu Beginn der 80er-Jahre teilen viele Menschen die Angst vor einem apokalyptischen Inferno.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
