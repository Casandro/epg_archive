  subtitle: 1977-1979 - Deutscher Herbst und kalter Winter
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Die Terrorwelle der RAF erreicht 1977 während des "Deutschen Herbstes" ihren Höhepunkt. Ein Jahr später sorgt ein Katastrophenwinter für eisige Kälte.

    Ende der 70er rollt die Disco-Welle ihrem Höhepunkt entgegen. "Saturday Night Fever" kommt in die Kinos. In Westdeutschland protestieren Tausende gegen den Bau von Kernkraftwerken. Das Jahr endet mit einem Katastrophenwinter. Deutschland versinkt im Schnee.
    HD-Produktion
