  title: Lang lebe der Adel?!
  description: |-
    Adel gibt es in Deutschland seit über 100 Jahren nicht mehr - zumindest offiziell. Mit der Weimarer Verfassung von 1919 wurden Adelstitel abgeschafft und aus Grafen, Freiherren und Prinzessinnen schlicht Bürger mit ungewöhnlich langen Nachnamen.
    Und trotzdem ist der Adel nicht verschwunden. Bis heute leben Menschen in Schlössern, pflegen exklusive Netzwerke, Namen öffnen Türen und manche lassen sich sogar adoptieren, um einen Titel tragen zu können.
  subtitled: true
