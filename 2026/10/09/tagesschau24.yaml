  description: "1989 bildeten fast zwei Millionen Menschen in den baltischen Sowjetrepubliken eine über 600 Kilometer lange Menschenkette - von Tallinn in Estland über Riga in Lettland bis nach Vilnius in Litauen. Sie trug dazu bei, dass Estland, Lettland und Litauen 1991 ihre Unabhängigkeit erlangten. \nDie Dokumentation erzählt die bewegende Geschichte dieser friedlichen Revolution."
