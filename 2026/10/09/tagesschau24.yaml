  title: Unfälle am Berg - Unterschätzen wir die Gefahr?
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: 'Abstürze, Notrufe, Rettungsaktionen: Bergsport boomt und damit auch die Zahl der Einsätze für die Bergwacht. Längst geht es dabei nicht nur um Hochgebirgstouren. Auch in den heimischen Mittelgebirgen geraten Wanderer und Kletterer in teils lebensgefährliche Situationen. Seit 2019 hat sich die Zahl der Bergwachteinsätze nach Wanderunfällen in der Sächsischen Schweiz fast verdoppelt. "Leute, die hier wandern gehen, sind häufig unvorbereiteter, als sie es früher waren. Früher waren sie sich der Sache ein bisschen mehr bewusst," beobachtet Anne Lochschmidt von der Sächsischen Bergwacht.'
