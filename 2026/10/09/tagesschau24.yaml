  description: 'Valencia erlebt die Folgen des Klimawandels zunehmend zwischen zwei Extremen: Rekordhitze und Trockenheit auf der einen, Starkregen und Überschwemmungen auf der anderen Seite. Die Flutkatastrophe im Herbst 2024 machte eindrücklich sichtbar, wie verletzlich die Region gegenüber Extremwetterereignissen ist. Valencia steht damit vor der dringenden Aufgabe, Stadt, Infrastruktur und Bevölkerung an die neuen klimatischen Bedingungen anzupassen.'
