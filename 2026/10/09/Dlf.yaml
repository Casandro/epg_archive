  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nKatholischer Missbrauchs-Beirat: ?Tag und Nacht melden sich Betroffene bei uns?\nDer Betroffenenbeirat der katholischen Kirche hat gestern bei einer Pressekonferenz in Köln einen besseren Umgang mit Betroffenen von sexualisierter Gewalt gefordert. Konkret fordern die Vertreter schnellere Verfahren für Anerkennungsleistungen und dass der Beirat stärker bei der Aufarbeitung beteiligt wird. \n\nIsrael: Streng-orthodoxe Juden erziehen Jungen und Mädchen grundverschieden\nMädchen lernen Mathe, Jungen studierenden die Tora. So sieht der Alltag vieler Kinder in streng-orthodoxen jüdischen Familien in Israel aus. Damit sollen die Kinder auf grundverschiedene Geschlechterrollen vorbereitet werden, wie sie in streng-orthodoxen Familien praktiziert werden. An dieser Ungleichbehandlung von Jungen und Mädchen gibt es viel Kritik. \n\nBuddhist und Achtsamkeitslehrer: Vor 100 Jahren wurde Thích Nhat H?nh geboren\nSeine Botschaft der Achtsamkeit war ebenso radikal wie einfach: Um zu einem liebe- und friedvollen Menschen zu werden, so lehrte der buddhistische Mönch Thích Nhat H?nh, müsse man zuerst Seelenruhe in sich selbst finden. ..."
