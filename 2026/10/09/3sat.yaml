  title: Sansibar - Trauminseln zwischen Armut und Aufbruch
  subtitle: Film von Melanie Haack
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Vor der Küste Tansanias im Indischen Ozean liegt ein Archipel mit einem verheißungsvollen Namen: Sansibar. Doch seine Geschichte ist düster. Über Jahrhunderte blühte dort der Sklavenhandel.

    Davon zeugen noch heute verfallende Paläste aus Kolonialzeiten, aber auch Museen und Gedenkstätten. Zu den neuen Einnahmequellen der Inseln gehört der Anbau von Algen. Die Ernte ist Frauenarbeit, doch den Profit mit den in Europa begehrten Pflanzen machen andere.
    HD-Produktion
