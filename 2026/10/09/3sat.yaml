  title: Tierische Superhelden (2/6)
  subtitle: Meister der Kommunikation
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Tanzen, pfeifen und vibrieren: Ob im Ozean, in der Luft oder unter der Erde, Tiere nutzen verblüffend komplexe Systeme, um Informationen auszutauschen und ihr Überleben zu sichern.

    Ein Universum aus verschlüsselten Botschaften und Geheimcodes, die sich über Millionen von Jahren entwickelt haben. Tiere sind wahre Kommunikationsgenies und nutzen eine Bandbreite an Signalen: visuelle Gesten und Mimik, akustische Laute und chemische Duftstoffe.
    HD-Produktion
