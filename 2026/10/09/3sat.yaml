  title: nano
  subtitle: Die Welt von morgen
  description: |-
    Deutschland 2026
    Neues vom Schwarzen Tod - Ein interdisziplinäres Forschungsteam untersucht ein Massengrab der Pestzeit bei Erfurt. Es handelt sich dabei um den ersten durch systematische Suche gefundenen Begräbnisort der Opfer des "Schwarzen Todes" in Europa. Die Analysen zeigen: Die Erreger unterscheiden sich kaum von heute vorkommenden Peststämmen.

    Rückkehr zum Mond - Ab 2028 sollen wieder Menschen auf dem Mond landen. Dieses Ziel verfolgt die US-Raumfahrtbehörde NASA. Am neuen Wettlauf zum Mond beteiligen sich auch Schweizer Forschende mit Erkundungsrobotern, Fahrzeugen und Konzepten für den Aufbau einer Mondstation.

    Eltern-Burnout - Perfektionismus, Leistungsdruck, widersprüchliche Erziehungsratgeber und ungleich verteilte Care-Arbeit können Eltern langfristig erschöpfen. Rund fünf Prozent entwickeln ein Burnout. Häufig betroffen sind gut informierte Eltern, die wissenschaftliche Erkenntnisse als unverrückbare Vorgaben verstehen. Das Stresssyndrom kann schwere körperliche und psychische Beschwerden auslösen.

    Wie Oktopusse ihre Arme nutzen - Forschende haben beobachtet, dass Oktopoden bevorzugte Arme nutzen. Je nach Aufgabe kommen die acht Arme unterschiedlich häufig zum Einsatz. Vor allem die vorderen vier Arme werden zum Tasten und Greifen genutzt und übernehmen knapp zwei Drittel aller Aktionen. Die hinteren Arme dienen überwiegend der Fortbewegung. Alle acht Arme werden selten gleichzeitig genutzt.

    Moderation: Ingolf Baur
