  description: |-
    Mit Ferienbeginn kommen Hunderte Kinder und Jugendliche aus ganz Deutschland nach Ribnitz-Damgarten, um das Reiten zu erlernen. Für die Reitlehrer heißt das: Stress von morgens bis abends.

