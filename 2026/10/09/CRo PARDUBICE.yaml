  title: Máme hosty
  description: S pátečním ranním hostem pozveme na koncert do pardubického Divadla 29. Duo akordeonisty Jakuba Jedlinského a houslisty Pavla Fischera přináší originální spojení folklóru, klasické hudby a jazzu. Z jejich muzikantské souhry vzniká hudba čerpající z moravských, balkánských, židovských, irských i romských vlivů. Hostem koncertu bude kytarista Norbi Kovács. Moderuje Jakub Malý.
