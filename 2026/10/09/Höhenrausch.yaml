  title: Entdecker der Welt - Citadel
  subtitle: Entdecker der Welt - Citadel
  description: Citadel is a stunning 3,000m peak in one of the remaining untouched corners of the Great Alaskan Range, the Neacola Mountains. They are beautiful but deadly, plagued by bad weather and prone to avalanches. Matt Helliker and Jon Bracey are one the UK's most formidable partnerships in alpine climbing, aim to make the first ascent of the extraordinary 1,200m long north-west ridge., Citadel ist ein atemberaubender 3.000 m hoher Gipfel in einer der noch unberührten Ecken der Great Alaskan Range, den Neacola Mountains. Sie sind wunderschön, aber tödlich, werden von schlechtem Wetter heimgesucht und sind anfällig für Lawinen. Matt Helliker und Jon Bracey sind eine der beeindruckendsten Partnerschaften Großbritanniens im Alpinklettern und haben sich zum Ziel gesetzt, die Erstbesteigung des außergewöhnlichen 1.200 m langen Nordwestgrats zu schaffen. US 2015
