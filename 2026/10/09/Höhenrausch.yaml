- eventId: 1526780
  start: 2026-10-09T00:40:00Z
  stop: 2026-10-09T01:30:00Z
  title: Faszination Heimat - Der Falkenflüsterer
  subtitle: Faszination Heimat - Der Falkenflüsterer
  description: Leo Mandlsperger ist eine lebende Legende. Der Vogelmann, wie er respektvoll genannt wird, ist einer der erfolgreichsten Falkner der Welt. Sein Name hat sogar im Nahen Osten Klang. Die von ihm trainierten Tiere stehen auf der Wunschliste reicher Scheichs ganz oben. Kein Wunder, denn Leo Mandlsperger versteht die sensiblen Vögel wie kaum ein anderer. Der Vogelmann aus dem bayerischen Odelzhausen ist mit den Raubvögeln untrennbar verbunden. AT 2013
- eventId: 1526781
  start: 2026-10-09T01:35:00Z
  stop: 2026-10-09T02:22:00Z
  title: Heimatleuchten - Das Ötztal - Das Beste aus zwei Welten
  subtitle: Heimatleuchten - Das Ötztal - Das Beste aus zwei Welten
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2018'
- eventId: 1526782
  start: 2026-10-09T02:25:00Z
  stop: 2026-10-09T02:54:00Z
  title: Cerro Kishtwar - Eine eiskalte Geschichte
  subtitle: Cerro Kishtwar - Eine eiskalte Geschichte
  description: Die Berge von Kashmir in Asien waren lange Jahre für auswärtige Alpinisten gesperrt. Die Sperrung wurde 2010 aufgehoben, woraufhin Stephan Siegrist, Denis Burdet und David Lama sich im darauffolgenden Jahr zu ihrem ersten Abenteuer in diese Region aufmachten, um den Cerro Kishtwar im Alpinstil zu erklimmen. Sie erreichten den Gipfel über die Nordwest-Seite des Berges. Siegrist entdeckte auf der Stirnseite einen neuen Weg und kehrte 2017 mit Huber und Zanker zurück, aber die Schwierigkeiten waren größer als erwartet und erforderten eine komplexe Klettertechnik.  DE 2018
- eventId: 1526783
  start: 2026-10-09T02:55:00Z
  stop: 2026-10-09T03:19:00Z
  title: Ultimate Rush - Ends of the Earth
  subtitle: Ultimate Rush - Ends of the Earth
  description: 'Ultimate Rush: Wir begleiten einige begnadete Freeskier an Orte, die zu den bestgehüteten Geheimnissen der Welt zählen: Kashmir, Indien und Hokkaido, Japan. Die Extremsportler Mark Abma und Mike Wilson begeben sich zum Himalaya, während Sean Pettit, Jacob Wester und Henrik Windstedt in Japan scheinbar endlosen Tiefschnee erleben. AT 2012'
- eventId: 1526786
  start: 2026-10-09T03:20:00Z
  stop: 2026-10-09T03:44:00Z
  title: Ultimate Rush - The Primal Climb
  subtitle: Ultimate Rush - The Primal Climb
  description: Die Bergsteiger Leo Houlding, Jason Pickles und Sean Leary wagen den Aufstieg auf den beeindruckenden Cerro Autana und wandern in einer Reise voller Risiko und Erleuchtung tief in den Amazonas und entdecken die Gründe, warum dieser Gipfel nie von Osten aus erreicht wurde. AT 2014
- eventId: 1526787
  start: 2026-10-09T03:45:00Z
  stop: 2026-10-09T04:09:00Z
  title: Ultimate Rush - The Winter Peak
  subtitle: Ultimate Rush - The Winter Peak
  description: Mindestens 16 Expeditionen haben versucht, im pakistanischen Winter den 8.000 m hohen Gipfel namens Gasherbrum II zu besteigen. Alle sind gescheitert. Entschlossen, die Statistik zu schlagen, dokumentiert der Bergsteiger und Filmemacher Cory Richards die schicksalhafte Besteigung seines Teams. AT 2014
- eventId: 1526788
  start: 2026-10-09T04:10:00Z
  stop: 2026-10-09T04:34:00Z
  title: Ultimate Rush - Summit of Antarctica
  subtitle: Ultimate Rush - Summit of Antarctica
  description: In ihrem Bestreben, als erste den Ulvetanna Peak in der Antarktis zu besteigen, benötigen die Bergsteiger Leo Houlding, Jason Pickles und Sean Leary kooperatives Wetter, eine wasserdichte Expedition und all ihre Erfahrung, um eine 2.931 Meter hohe Herausforderung zu meistern. AT 2014
- eventId: 1526789
  start: 2026-10-09T04:35:00Z
  stop: 2026-10-09T05:22:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen
  description: |-
    Entstehung der Alpen - Unsere Alpen - Die Pässe der Alpen: Seit tausenden Jahren trennen die imposanten Gipfel der Alpen Nord und Süd in Mitteleuropa - und scheinen dabei schier unüberwindlich. So bauten sich die Menschen Wege über die Alpen und perfektionierten die einfachen Pfade zu dem ausgeklügelten Verkehrsnetz das wir heute kennen. In den Pässen der Alpen sehen sie wichtigsten Routen, die die Geschichte Europas prägten und zum Aufstieg und Fall großer Persönlichkeiten führten.
     AT 2015
- eventId: 1526790
  start: 2026-10-09T05:25:00Z
  stop: 2026-10-09T06:12:00Z
  title: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  subtitle: Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn
  description: 'Entstehung der Alpen - Unsere Alpen - Die Semmeringbahn: Das 19. Jahrhundert war eine Zeit bedeutender Veränderungen. Die Industrialisierung, die Arbeiterbewegung und bahnbrechende neue Erfindungen. In diese Zeit fällt der Bau der revolutionierenden Semmeringbahn. Geplant und ausgeführt von Carl Ghega, einem großen Visionär, dessen Bahnprojekt der Gegend am Semmering Wohlstand brachte und in ganz Europa bekannt machte. So wurde der Semmering Anziehungsort der Reichen und Schönen, der Dichter und Denker. AT 2015'
- eventId: 1526801
  start: 2026-10-09T06:15:00Z
  stop: 2026-10-09T07:18:00Z
  title: Down Days
  subtitle: Down Days
  description: Down Days ist ein Dokumentarfilm, der den Lebensstil, die Gedanken und Gefühle des Big-Mountain-Extremskifahrers verfolgt. Die Reise führt uns zu einem einmonatigen Filmdreh in Haines, Alaska. Erfahren Sie, was es braucht, um ein professioneller Skifahrer zu sein, der steigende Risiken bekämpft, um Sponsoren zufrieden zu stellen und den Sport voranzubringen, während er gleichzeitig die berüchtigten Wetterbedingungen Alaskas bewältigt. Erleben Sie diese emotionale Achterbahnfahrt aus der einzigartigen Perspektive der Menschen, die daran beteiligt waren, von den Helikopter-Guides über das Filmteam bis hin zu Spitzensportlern wie Daron Rhalves, Cody Townsend, Enak Gavaggio, Jamie Pierre, Reggie Crist und Lynsey Dyer , Richard Permin, Elyse Saugstad, Corey Felton und Tom Wayes. CA 2008
- eventId: 1526802
  start: 2026-10-09T07:25:00Z
  stop: 2026-10-09T08:12:00Z
  title: Entstehung der Alpen - Race Around Austria
  subtitle: Entstehung der Alpen - Race Around Austria
  description: 'Entstehung der Alpen - Race Around Austria: Der 32jährige Grazer Fahrradbote Lukas Kienreich nimmt zum ersten Mal den Solo-Bewerb des "Race Around Austria" in Angriff. Dabei muss er eine Strecke von insgesamt 2.200 Kilometern zurücklegen und unglaubliche 30.000 Höhenmeter überwinden - entlang der grenznahen Straßen, einmal rund um Österreich, nonstop. 4 Tage Schlaflosigkeit, 4 Tage Schmerz, 4 Tage Siegeswille: Die TV-Doku "Bis an die Grenzen - Das härteste Radrennen Österreichs" ist hautnah dabei, wenn der Langstreckenradfahrer weit über sich hinaus wächst, um sein gestecktes Ziel zu erreichen: durchzukommen. AT 2015'
