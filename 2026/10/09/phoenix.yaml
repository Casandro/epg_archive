  title: Der Amazonas
  subtitle: Die größten Flüsse der Erde
  widescreen: true
  hd: true
  description: Amazonas das größte Flusssystem unseres Planeten. Er durchquert über eine Länge von 7.000 Kilometern den südamerikanischen Kontinent. Über 1.000 Seitenarme hat allein der Hauptstrom, 17 davon sind länger als der Rhein. Ein Fünftel allen Süßwassers fließt hier und nährt den größten Regenwald der Erde.
- eventId:
  - 1010872
  - 800217
  start: 2026-10-09T19:00:00Z
  stop: 2026-10-09T19:45:00Z
  title: Der Nil
  subtitle: Die größten Flüsse der Erde
  widescreen: true
  hd: true
  description: 'Um den Rang des weltweit längsten Flusses wetteifert der Nil mit dem Amazonas je nach Art der Definition. Eines steht fest: Mit über 6.800 Kilometern Länge gehört er zu den Giganten. Sein Weg führt durch ganz Nordafrika vom Äquator bis zum Mittelmeer. Erst seit Ende des 19. Jahrhunderts ist bekannt, dass der Fluss aus einer Vielzahl von Oberläufen gebildet wird.'
- eventId:
