  title: Terra X Harald Lesch
  widescreen: true
  hd: true
  subtitle: '... und die Welt in Angst'
  description: "Kriege, Klima, Inflation - wir leben im Zeitalter der Angst. Was macht das mit uns, und wer nutzt sie aus? Harald Lesch zeigt, wie wir die Angstspirale durchbrechen können. \n\nAngst schein zum Grundgefühl unserer Zeit geworden zu sein. Medien und Politik verstärken sie - teils bewusst, denn Angst ist ein Machtinstrument. Doch es gibt Wege, die Kontrolle zurückzugewinnen und der ständigen Verunsicherung etwas entgegenzusetzen.\n\nAngst ist ein starkes Gefühl, das sich instinktiv einstellt, sobald wir Bedrohung wahrnehmen. Früher sicherte das unser Überleben, ließ uns vor Raubtieren fliehen oder vor Abgründen zurückweichen."
- eventId:
  - 1010843
  - 800179
  start: 2026-10-09T16:30:00Z
  stop: 2026-10-09T17:15:00Z
  title: Die Wahrheit über Eigenmarken
  widescreen: true
  hd: true
  description: "Eigenmarken wie \"Gut &amp; günstig\", \"Ja!\" oder \"K-Classic\" landen immer häufiger im Einkaufswagen. Sie sind in der Regel deutlich günstiger als entsprechende Markenprodukte. Aber wie ist die Qualität? \n\nWir zeigen: Bei einigen Produkten schneidet No Name sogar besser ab als Marke, zum Beispiel bei den von uns getesteten Geschirrspültabs. Im Labor war das Markenprodukt klarer Testverlierer. Überraschend gut hat auch eine Discounter-Schokolade abgeschnitten: Sie schmeckte unseren Testern am besten. \n\nReiner Zufall? Wohl kaum. In vielen No-Name-Lebensmitteln stecken sogar exakt dieselben Zutaten wie im Markenprodukt."
