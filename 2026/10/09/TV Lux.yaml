  title: Spojení vierou XXVI (15)
  subtitle: Objaviť živého Ježiša. Andrea Breja dnes žije so svojou rodinou vo Švajčiarsku.
  description: Andrea Breja dnes žije so svojou rodinou vo Švajčiarsku. V relácii Spojení vierou hovorí o náročných začiatkoch v cudzej krajine, o hľadaní nového domova aj o svojej ceste od tradičnej viery k osobnému a živému vzťahu s Ježišom. Silným momentom sa pre ňu stal sen jej trinásťročného syna Jakuba, ktorý jej pomohol uvidieť, že Ježiš nie je len postavou z minulosti, ale živým Bohom, ktorý túži po našej blízkosti. (2026)
