  description: In Ystad macht ein unbekannter Scharfschütze Jagd auf Gangster, die mit einem Juwelenraub in Zusammenhang stehen. Bei den Ermittlungen wird vor Wallanders Augen eine Zeugin erschossen. Weitere Probleme bereitet der unerfahrene Polizist Pontus, der sich durch Unachtsamkeit in Lebensgefahr bringt. Wallander erkennt jedoch die verborgenen Qualitäten des jungen Kollegen. Dank Pontus' Mithilfe findet er heraus, dass der Scharfschütze für eine Verbrecherorganisation arbeitet, die sich in Ystad wie ein Krake ausgebreitet hat. Über das Motiv des eiskalten Killers ist am Ende sogar der erfahrene Kommissar überrascht.
