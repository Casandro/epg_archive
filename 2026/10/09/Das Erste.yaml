  description: Panisch sucht Mariam Kalkus am späten Abend Schutz im Polizeirevier der Kripo Lübeck. Die junge Frau hat in der Wohnung gegenüber einen Mord beobachtet. Und der Mörder hat sie gesehen! Doch in der Wohnung finden die Ermittler nichts. Mit ungutem Gefühl bringen Finn und Lars die junge Frau zurück in ihre Wohnung. Hat sich die labil wirkende Mariam Kalkus das alles nur ausgedacht? Als am nächsten Morgen eine tote Frau im Lübecker Hafen gefunden wird, die auf Kalkus' Beschreibung des Opfers passt, bestätigt sich deren Beobachtung. Doch Kalkus ist verschwunden. Das Team der Kripo Lübeck setzt alles daran, die junge Frau zu finden.
