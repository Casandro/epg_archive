  title: Lohnt sich das?
  subtitle: Was verdient ein Feuerkünstler?
  subtitled: true
  description: 'Chris ist Feuer & Flamme für seinen Job: Denn er ist Feuerkünstler aus der Nähe von Leipzig. Gemeinsam mit seinem Freund René tritt er mit Feuershows auf Firmenfeiern, Weihnachtsmärkten, Hochzeiten, Sommerfesten und sogar in Freizeitparks auf. Eigentlich war die Feuerakrobatik für die beiden als Jugendliche nur ein Hobby - mittlerweile haben sie daraus ein richtiges Business entwickelt: Seit über zehn Jahren können René und Chris von ihrem Beruf leben. Für ihre Shows reisen sie sogar ins europäische Ausland.'
