  title: RESPEKT - Demokratische Grundwerte für alle!
  subtitle: Stammtischparolen - Was tun gegen blöde Sprüche?
  subtitled: true
  genre:
  - '128'
  description: "Sogenannte \"Stammtischparolen\" kommen zwar auch am Stammtisch vor, aber nicht nur dort und vor allem nicht immer. Stammtischparolen sind meist vorurteilsbeladene, aggressiv vorgetragene Sprüche, auf die es oft sehr schwer fällt zu antworten oder überhaupt eine angemessene Reaktion zu finden. \nRESPEKT-Moderatorin Christina Wolf macht sich auf die Suche -  nach der perfekten Reaktion, nach der richtigen Antwort auf Stammtischparolen und dumme Sprüche."
