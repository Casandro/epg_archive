- eventId: 1010309
  start: 2026-10-09T03:30:00Z
  stop: 2026-10-09T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Autumn Palette
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 1010310
  start: 2026-10-09T04:00:00Z
  stop: 2026-10-09T04:30:00Z
  title: Portugal - Land, Leute und Sprache
  subtitle: Madeira
  description: |-
    In Porto arbeitet, in Braga betet, in Coimbra studiert und in Lissabon lebt man, heißt es nach einem alten portugiesischen Sprichwort. Algarve, Estremadura, Beira und Madeira sind bei den Touristen bekannt.

    Von den Regionen Alentejo, Trásos-Montes und der Provinz Minho dagegen haben die wenigsten etwas gehört. In 13 Folgen stellt die Reihe "Portugal - Land, Leute und Sprache" das Land und seine Menschen vor.
- eventId: 1010311
  start: 2026-10-09T04:30:00Z
  stop: 2026-10-09T05:00:00Z
  title: TELEKOLLEG Französisch (12/39)
  subtitle: Bon Courage
  description: Die Lebenswege der Menschen unterscheiden sich ganz erheblich. Oft stehen unvorhersehbare Hürden einer geradlinigen Schulausbildung im Wege. Aber eine fundierte Ausbildung ist als solide Basis für ein erfülltes Berufsleben wichtig. Das Telekolleg eröffnet Ihnen die Möglichkeit, Wissen aufzufrischen oder staatlich anerkannte Schulabschlüsse nachzuholen - auch später und neben Job und Familie.
- eventId: 1010312
  start: 2026-10-09T05:00:00Z
  stop: 2026-10-09T05:15:00Z
  title: GRIPS Deutsch
  subtitle: Der Schreibprozess
  subtitled: true
  description: Auch wenn man nicht gerne schreibt - man kommt eigentlich nicht um das Schreiben und Verfassen von Texten herum! In der Schule braucht man Erzählungen, Berichte, Zusammenfassungen. Privat schreibt man SMS, E-Mails, Briefe, Einkaufszettel oder Notizen. Wenn es um einen längeren Text geht, der sich mit einem Thema befasst, geht das Schreiben aber nicht einfach so. Solch ein Text wird nach und nach entwickelt. Wie? Das kannst du dir im Video anschauen - und du kannst auch ausprobieren, was du über den sogenannten Schreibprozess gelernt hast. Viel Spaß dabei!
- eventId: 1010313
  start: 2026-10-09T05:15:00Z
  stop: 2026-10-09T05:30:00Z
  title: GRIPS Deutsch
  subtitle: Erzählen & Beschreiben
  subtitled: true
  description: Wenn du deiner Freundin eine Geschichte erzählst, dann ist nicht nur wichtig was, sondern auch wie du erzählst. Da wirken dein Körper, deine Mimik, deine Art zu sprechen. Wie du eine Geschichte aufbaust und erzählst, damit dir deine Zuhörer gebannt lauschen, kannst du dir im Folgenden anschauen. Dabei erfährst du, warum ein Bericht ganz anders als eine Erzählung ist. Und du kannst Übungen machen, einer tollen Geschichte zuhören und sehen, was auf echten Ritterspielen geboten wird.
- eventId: 1010314
  start: 2026-10-09T05:30:00Z
  stop: 2026-10-09T05:55:00Z
  title: Willi wills wissen
  subtitle: Wie kommt das Geld in die Welt?
  subtitled: true
  genre:
  - '144'
  description: Wer Geld einzahlen oder abheben will, geht ganz einfach zur Bank. Aber was passiert dann mit dem Geld? Und wo kommt es eigentlich her? Warum heißt die Bank eigentlich Bank? Keiner weiß es, aber Willi findet auch das für uns heraus.
- eventId: 1010315
  start: 2026-10-09T05:55:00Z
  stop: 2026-10-09T06:00:00Z
  title: Shaun das Schaf
  subtitle: Oben ohne
  genre:
  - '16'
  description: 'Shaun wundert sich: Warum reagieren die Schafe so merkwürdig, als er morgens aus der Scheune kommt? Timmy bricht sogar in Tränen aus. Ein Blick in Bitzers Spiegel bringt die Antwort: Shauns Fellhütchen fehlt. Keiner erkennt ihn! Shaun muss es schleunigst wiederhaben. Aber wo könnte es sein? Eine fieberhafte Suche beginnt.'
