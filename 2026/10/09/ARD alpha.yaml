  description: "Mit Madagaskar, Borneo und Hawaii erkundet die Doku-Reihe drei der faszinierendsten Inseln der Erde und zeigt, wie sich dort in Jahrmillionen der Abgeschiedenheit einzigartige Tier- und Pflanzenwelten entwickelt haben. \nDiese Folge führt uns auf die mit 90 Mio. Jahren älteste Insel der Welt - Madagaskar. Sie beherbergt Ökosysteme wie Dornsavannen, Kalksteinformationen und Regenwälder mit nur hier vorkommenden Tierarten. Aber auch die Menschen haben sich an die besonderen Bedingungen angepasst."
