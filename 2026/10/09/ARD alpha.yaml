  title: Sneaker - Der große Deal mit Turnschuhen
  genre:
  - '130'
  description: '"Ihr macht jetzt sofort die Straße frei", ruft ein Mitarbeiter des Berliner Ordnungsamtes. Aus einer Menschenmenge ertönt lautes Geschrei, Security hält die Massen an Jugendlichen und Erwachsenen in Schach. "Die kamen aus allen Ecken angerannt, haben ihre Autos einfach auf der Straße stehenlassen", erzählt eine fassungslose Anwohnerin. Sogar die Polizei rückt an. Doch heute ist hier keine Demo, sondern lediglich der Verkaufsstart eines gewöhnlichen Sportschuhs. Hunderte sind gekommen, um sich ein Exemplar zu sichern. Im Laden kostet der Sneaker 200 _ - eine Stunde später wird er für über 1.000 _ im Internet gehandelt.'
