  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Sifis jest oburzony i nadal szuka Meliny i Achilleasa w Londynie. Para robi wszystko, aby Sifis stracił ich z oczu i aby mogli uciec. Aggeliki znajduje swój pamiętnik pod łóżkiem córki. Próbuje ją wypytać i dowiedzieć się, co wie o swoim ojcu. Minas zostaje aresztowany, a Daphni na próżno próbuje przekonać Vasiliki, by nie zeznawała przeciwko niemu. Markos zestawia w całość pewne wydarzenia i ma zamiar ujawnić Sifisowi tożsamość mężczyzny, który od roku mieszka z Meliną.
