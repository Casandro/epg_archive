  description: |-
    Tytuł oryginalny: Profilage
    FR, 2017
    Reżyseria: Fouad Benhammou
    Występują: Jean-Michel Martial, Raphaël Ferret, Philippe Bas, Juliette Roudet, Diane Dassigny, Sophie De Fürst
    Przebywająca na kilkudniowym seminarium ekipa śledcza znajduje na skraju drogi nieprzytomną i ciężko ranną kobietę w ciąży. Agresor naznaczył jej ciało znakiem, którym znajdująca się nieopodal winnica znaczy winorośle do wyrwania. Właściciele winnicy nie rozpoznają kobiety, co więcej, twierdzą, że od miesięcy sami są nękani przez nieznanego sprawcę. Ktoś chce się na nich zemścić. Ten ktoś zdaje się wiedzieć, co łączy ich z ofiarą, a jego gniew jest coraz bardziej gwałtowny.
