  title: Temps présent
  description: |-
    Israël, des guerres et des fractures Le 27 octobre prochain, les Israéliens se rendront aux urnes. C'est la première fois depuis le massacre du 7 octobre 2023, encore dans tous les esprits, qu'ils auront l'opportunité de faire barrage, ou pas, à la politique militaire du Premier ministre Benjamin Netanyahou, qui maintient des lignes de front offensives à toutes les frontières d'Israël et conduit le pays à l'isolement sur la scène internationale. Mais ce n'est pas le premier enjeu pour les citoyens de l'État-nation du peuple juif. La société israélienne révèle aujourd'hui des divisions intérieures profondes entre tentative de radicalisation religieuse et économie frappée par la guerre. La mobilisation des recrues et des réservistes pendant ces trois dernières années a vampirisé les forces de travail, alors que les touristes étrangers désertent les sites autrefois prisés.

    Un reportage d'Isabelle Ducret (Suisse Romande-2026)
