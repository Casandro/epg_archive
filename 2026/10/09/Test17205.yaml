  title: Objectif Monde L'hebdo
  description: |-
    Hindouisme, cuisine, traditions... Qu'est-ce que vivre en Inde au quotidien ? L'Inde connaît l'une des croissances les plus fortes au monde (7,8 % en 2026) et se classe troisième pôle mondial de milliardaires. Mais cette richesse n'est pas partagée par tous : derrière les chiffres globaux, la société se polarise fortement. Les économistes parlent d'une trajectoire en « K » - la branche du haut s'enrichit très vite, celle du bas stagne. S'ajoutent à cela le poids des castes et de l'hindouisme, religion majoritaire utilisée comme outil de cohésion sociale. Des routes de l'Himalaya à plus de 3 000 m d'altitude jusqu'à Haridwar, l'une des sept villes saintes, Angélique Forget fait découvrir l'Inde d'aujourd'hui. Un reportage diffusé dans le Grand Format du JT de 20H sur France 2.
     (Suisse Romande-2026)
  genre:
  - '32'
  widescreen: true
  subtitled: true
  hd: true
