  title: Tierisch München - Wildtiere im Tierheim (Wh.)
  subtitle: |-
    - Warum man Igel besser gar nicht füttern sollte
    - Warum jedes Jahr rund 1.000 Tauben im Tierheim landen
    - Warum die Mauser bei Rabenkrähen bis zu 1,5 Jahre dauert
  description: 'Das Tierheim München beherbergt nicht nur halterlose Haustiere - in einer eigens dafür ausgestatteten Station werden auch verletzte oder verwaiste Wildtiere aufgenommen. Besorgniserregend daran: Die Zahl der Wildtiere übersteigt die der Haustiere inzwischen immer mehr. Die Gründe: Klimawandel, Lebensraumverlust durch Bebauung, aber auch Nahrungsknappheit durch Versiegelung, Verletzungen beim Flug gegen Fensterscheiben, durch Rasenmäher oder im Straßenverkehr.'
- eventId: 1281100
