  description: |-
    In seiner TV-Show "Johann König findet" widmet sich der Gastgeber Woche für Woche einem großen Thema. Unterstützt wird der Humorarbeiter der Extraklasse von einer hochkarätigen Riege großartiger Comedians. In der Folge "Johann König findet: Tiere sind was Wunderbares" sind zu Gast: Jan van Weyde, Luisa Charlotte Schulz, Rasmus Syman, Johannes Flöck und Simon Stäblein.

