  title: Legendäre Prachtstraßen - Zwischen Opulenz, Modernität und Zukunft
  subtitle: Andrássy út in Budapest, Ungarn
  subtitled: true
  description: 'Die Reihe "Legendäre Prachtstraßen" zeigt monumentale Orte zwischen architektonischem Erbe, Kultur und Nachhaltigkeitskonzepten. In dieser Folge: Budapests schönste Straße, die Andrássy út. Eine schnurgerade Allee, die von der Innenstadt zum Stadtwäldchen führt. Angelegt wird sie im 19. Jahrhundert und soll Budapest endlich zu einer Weltstadt machen. Vorbilder: Wien und Paris.'
