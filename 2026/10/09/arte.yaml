  title: Das Haus am Hang (4/6)
  subtitle: Serie Japan 2019
  genre:
  - '16'
  description: Durch den Prozess beunruhigt und erschöpft beginnt Risako, ihrer Tochter Ayaka gegenüber ihre Wut zu zeigen. Yoichiro dramatisiert dies, da er sich Sorgen macht, was die Leute wohl darüber sagen könnten. Tatsächlich taucht bald eine Mitarbeiterin der Erziehungsberatungsstelle unangemeldet bei ihnen zu Hause auf. Risako verliert immer mehr den Halt, als die Persönlichkeit der Angeklagten mit ihrer eigenen zu verschmelzen scheint. Und dann versucht ihr Ehemann, sie gegen ihren Willen in eine psychiatrische Klinik einweisen zu lassen.
- eventId: 1010686
  start: 2026-10-09T01:20:00Z
  stop: 2026-10-09T01:30:00Z
  title: Mit offenen Augen
  subtitle: Marschierende Zulu-Krieger - Tradition im Zeichen von Fremdenhass
  description: 'Zulu-Kultur als Protest gegen Ausländer in Südafrika: Am 30. April 2026 organisierten die Anführer der fremdenfeindlichen Bewegung "March and March" in Johannesburg einen Aufmarsch von Zulu-Kriegern in traditioneller Kampfausrüstung. Der Kommunikationswissenschaftler Nkululeko Sibiya analysiert die Triebkräfte hinter den Protesten. Der Geograf und Südafrika-Experte Philippe Gervais Lambony beleuchtet die Instrumentalisierung ethnischer Zugehörigkeit in dem lange Zeit von Apartheid geprägten Land.'
- eventId: 1010687
  start: 2026-10-09T01:30:00Z
