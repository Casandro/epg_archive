  description: 'Natálie Kocábová je spisovatelka, publicistka a zakladatelka aktivistického projektu Radio Free America: "Havel byl součástí naší rodiny, protože kolem něj se točilo mnohé. Pro mě je Havel znovu nalezený apel, v těchto dnech například ve Spojených státech amerických znovu ožívá, kvůli hybridním válkám, informačnímu chaosu a dalším potížím světa, ve kterém žijeme." Proč má pocit, že nejde svět popisovat v knihách nebo filmech? Co znamená Havlův odkaz pro generaci lidí, kteří ve svobodné demokratické společnosti zažívají větší část svého života? Byl by Havel v depresi ze stavu současné společnosti? Moderuje Renata Kalenská.'
