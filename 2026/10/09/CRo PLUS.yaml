  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Mají malé a velké nemocnice dostávat za stejnou péči stejně? Ministerstvo chce dál zmenšovat rozdíly v platbách mezi nemocnicemi. Velké nemocnice se přitom s pojišťovnami na úhradách pro příští rok nedohodly. Zároveň se vybrané nejnáročnější operace postupně přesouvají do specializovaných center. Zlepší změny péči o pacienty, nebo oslabí menší nemocnice v regionech? Hosty Pro a proti budou předseda Asociace nemocnic České republiky Aleš Herman a předseda Asociace českých a moravských nemocnic Michal Čarvaš. Moderuje Lukáš Matoška.
