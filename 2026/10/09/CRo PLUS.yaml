  title: Radiokniha
  description: 'Franco Cardini: František z Assisi (10/10). Písemností spojených s Františkem z Assisi není mnoho. Zachoval se například dopis bratru Lvovi a několik textů poezie. Píseň tvorstva je považována za první básnické dílo italské literatury. Poslední dopis posílá František paní Jakubě. 3. října 1226 budoucí světec umírá. Knihu z překladu Vítězslava Pavlíka pro rozhlas připravila Blanka Kostřicová, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Michal Bumbálek a Jiří Valůšek.'
