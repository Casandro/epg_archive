  description: Ornitolog, vědec a fotograf profesor Tomáš Grim nerad dělá z přírody katastrofický příběh. Dává do souvislostí zprávy o každoročném vymírání druhů, vysvětluje, proč úbytek ptáků na jedné zahradě nemusí znamenat vůbec nic - a dokáže překvapit i tím, co všechno ví o intimním životě pěvušek. Hovory moderuje Tatiana Čabáková.
