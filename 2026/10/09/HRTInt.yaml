  title: Izvan formata
  subtitle: ' '
  description: One su fotografkinje i vizualne umjetnice. Fasciniraju ih priroda, ljudi i različite kulture. Velik dio života provele su izvan Hrvatske, a bez njihova rada hrvatska bi fotografska i umjetnička scena danas zasigurno bila mnogo siromašnija. Darija Jelinčić i Jelena Janković nedavnim su izložbama u zagrebačkoj Galeriji "Kranjčar" pokazale da fotografija zauvijek ostaje prostor za igru i eksperiment, ali i umjetnost koja neprestano propituje način na koji promatramo svijet. S Darijom Jelinčić i Jelenom Janković razgovaramo u studiju, a o njihovu radu i posljednjim izložbama govore galeristica Elvira Kranjčar i kustosica Lea Vene.
