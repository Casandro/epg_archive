  title: Dolina sunca, serija (22/210)
  subtitle: ' '
  description: 'Adela bezuspješno pokušava probuditi ugaslu strast između nje i Ivana. Kristijan skriva nervozu dok mu Irena izlaže planove za vjenčanje. Sofija je zabrinuta za Natašu, pa pokušava saznati od Karla što se zbilo između nje i Lade. Kristijan se ljuti na Juliju što planira s Irenom vjenčanje, a on ne zna ništa o tome. Sofija posjedne Natašu i prisili je na razgovor, ali ona je ljutito zamoli da joj se ne upleće u brak. Adela je tužna zbog cijele situacije s Ivanom. U potrazi za Natašom, Lada naleti na Jurana i bijesno se istrese na njega. Doktor Otto sugerira zabrinutom Ivanu da bi bilo bolje da ide na pregled u Zagreb. Julija se iznenadi kad joj Kristijan spomene da želi s njom razgovarati o svom vjenčanju. Nataša je na rubu i odluči sve priznati Ladi... Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
