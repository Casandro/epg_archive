  title: 'Labirint: Sve boje Jadrana'
  subtitle: ' '
  description: Pjevamo o plavom Jadranu, no naše je more sve manje plavo. Kanalizacija koju ispuštamo u more, betonizacija, nasipavanje plaža, sve to uništava podmorje i zagađuje more. Ponavljamo grešku koju su napravili Španjolci i Talijani kada su se okrenuli masovnom turizmu, živeći su zabludi da će se priroda sama oporaviti. Da bi se more i život u njemu vratio na staro, trebala proći stotinjak i više godina. U međuvremenu, podmorje je pusto, a smeće koje je završilo u moru, kroz ribu i morske plodove vraćamo natrag u sebe. Profit je važniji od prirode.
