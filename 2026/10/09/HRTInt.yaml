  stop: 2026-10-09T08:39:00Z
  title: 'Priče s končom iz borše Stanka Ferića: Zagora glasno zove nas, pučka i predajna kultura'
  subtitle: ' '
  description: 'Područje dalmatinske, odnosno šibenske Zagore za mnoge je tijekom prošlosti bilo simbolom izoliranosti i zaostalosti. Naravno, njezini stanovnici imaju o tome drukčiji stav, pogotovo u novije vrijeme, kada su shvatili kako suvremeni društveni trendovi tehnološku ili komunikacijsku izoliranost pretvaraju u prednost, otvarajući mogućnosti za ekološku poljoprivredu i seoski turizam, daleko od gradske vreve i zagađenja. Činilo se, dakle, da će to za Zagoru napokon biti priča sa sretnim krajem. Međutim, dogodio se iznenadni obrat, tj. zaplet - idejom izgradnje Centra za gospodarenje otpadom Splitsko-dalmatinske županije, na lokaciji unutar Općine Lećevica, koja se nalazi na samoj granici s Općinom Unešić, u Šibensko-kninskoj županiji. Naravno, stanovnici Općine Unešić toj se ideji burno protive, bojeći se mogućih zagađenja, koja bi, ako se dogode, potencijalno upropastila njihove OPG-ove i seoski turizam, ali što je još gore, možda i - također prema njihovom strahovanju - zatrovala tokove podzemnih voda, koje protiču ispod Zagore, a kojima se napajaju i Split i Šibenik. I što sad? Da sve bude zanimljivije, taj zaplet, tj. početak priče od izgradnji CGO-a Lećevica, dogodio se prije gotovo već dvadeset godina, a da se niti danas, dvadeset godina poslije, kraj, tj. konačni rasplet još uvijek ne nazire... Istraživač: Stanko Ferić'
