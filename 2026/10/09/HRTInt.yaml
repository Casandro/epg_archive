  title: Kod nas doma
  subtitle: ' '
  description: U goste nam stižu Roko Crnić i Hrvoje Klemenčić iz grupe Porto Morto. Razgovaramo o hvaljenom albumu Minimum, velikom koncertu u Tvornici i svemu onome što njihov glazbeni svijet čini tako posebnim. S nama je i Daniela Trbović, koja predstavlja novu emisiju Ponovno zajedno, televizijsko putovanje kroz emisije, serije i ljude koje smo godinama gledali i pamtili. Listopad je mjesec borbe protiv raka dojke, u rubrici Razgovor s razlogom naša je gošća psihologinja Ljiljana Vukota iz udruge Sve za nju. Govorit ćemo o bolesti ne samo iz stručne, nego i iz osobne perspektive, jer je i sama prošla iskustvo raka. No najprije, može li ples doista pomoći da se nakon teškog liječenja ponovno osjetiš dobro u vlastitom tijelu? Iva Miljković donosi priču o plesu kao terapiji.
