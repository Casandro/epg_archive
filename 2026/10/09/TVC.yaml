    Przełomowy film dokumentalny przygotowany z okazji rocznicy pierwszej eksplozji broni jądrowej w czasie wojny. Wykorzystano w nim nigdy wcześniej nie publikowane materiały archiwalne, m.in. kolorowy film z bezpośrednich następstw wybuchu bomby oraz nagrania z głównymi bohaterami i ofiarami. Opowiedziany w całości z perspektywy przywódców, fizyków, żołnierzy i ocalałych, dokument przedstawia moralne, naukowe i wojskowe aspekty tego dramatu.
