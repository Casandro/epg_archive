  title: Gottes Häuser
  subtitle: Alte Erlöserkirche Neuss-Reuschenberg
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nach dem Zweiten Weltkrieg versammelten sich die evangelischen Christen von Neuss-Reuschenberg in einer Schulbaracke, um ihre Gottesdienste zu feiern. 1951 bekamen die Gemeindeglieder ihren eigenen, wenn auch bescheidenen Kirchenraum: die Alte Erlöserkirche. Das Gebäude wurde zum Zentrum des Gemeindelebens. Doch schon bald war sie für die vielen Kirchenbesucher zu klein, sodass die Neue Erlöserkirche gebaut wurde. Die alte hölzerne Notkirche mit verschließbarem Altar wird heute u.a. für Kunstausstellungen genutzt.'
