  title: Bibel TV Das Gespräch
  subtitle: 'Philipp Mickenbecker: So real ist Gott für mich'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Laut seinen Ärzten ist Philipp Mickenbecker sterbenskrank. Trotzdem geht es dem 23-Jährigen zur Zeit gut, sagt er. Philipp ist einer der Köpfe hinter dem Youtube-Kanal The Real Life Guys. Mit seinem Zwillingsbruder Johannes und ihren Freunden werden dort Erfindungen wie ein motorisiertes Bobby-Car und ein selbstgebautes U-Boot vorgestellt. Diese Erfindungen stammen aus dem Abenteuerdrang und der Entdeckungsfreude der Brüder. Dabei haben sie schon heftige Schicksalsschläge hinter sich. Philipp ist zum dritten Mal an Lymphdrüsenkrebs erkrankt. Angesichts seiner Krankheit fordert er Gott heraus, sich zu beweisen. Bei Bibel TV Das Gespräch erzählte Philipp im November 2020 von seinen Begegnungen mit Gott. Eine ungekürzte Version dieses Gesprächs gibt es exklusiv auf dem Bibel TV Youtube-Kanal und Bibel TV Facebook. Philipp Mickenbecker verstarb am 9. Juni 2021 im Alter von 23 Jahren.'
