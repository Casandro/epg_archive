  subtitle: Leben & genießen
  description: |-
    Eine Ausgabe des Traditionsformates "Best of ARD-Buffet" mit den besten Rezepten der Saison. Florian Weber zeigt seine liebsten Schnellgerichte: Lachsmedaillons mit Apfel und Meerrettich, Tomaten-Paprika-Polenta mit grünem Salat, gebratener Reis mit grünen Bohnen und Chorizo und gedämpfter Zander mit Pak Choi und Sojasoße.
