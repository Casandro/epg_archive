  title: Einfach & köstlich
  subtitle: Dreierlei Buchweizen-Crêpes und Rosenkohlauflauf mit Kasseler
  description: 'Buchweizenmehl, Wasser, grobes Salz - fertig sind die bretonischen Crêpes von Sternekoch Fréderic Morel. Mit drei verschiedenen Belägen sorgt er für Abwechslung auf dem Teller. Der Gastgeber und Karlsruher Spitzenkoch Sören Anders serviert einen Klassiker: Rosenkohl mit Käse überbacken und rauchig-aromatisches Kasseler. Aus den übrig gebliebenen Zutaten kreieren die beiden Kochprofis dann zusammen eine Tortilla - natürlich mit Buchweizenmehl. Käse und Zwiebeln peppen den Fladen auf, der schließlich bunt belegt wird: mit Rosenkohl, Tomatensauce, Kasseler und Kräutertopping.'
