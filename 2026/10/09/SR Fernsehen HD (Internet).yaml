  title: Oma ist verknallt
  subtitle: Fernsehfilm Deutschland 2018
  description: 'Matthias ist heillos überfordert, als plötzlich seine Mutter Gisela vor der Tür steht. Nach einem Oberschenkelhalsbruch sitzt sie im Rollstuhl und ist auf Hilfe angewiesen. Als Matthias erfährt, dass sich Gisela selbst aus der Reha-Klinik entlassen hat, wird ihm klar, dass sie neuen Lebensmut braucht, und sucht händeringend nach einer Lösung. Die kommt ganz unerwartet von Tom, Giselas zehnjährigem Enkel: Oma braucht einen Verehrer! Der ungewöhnliche Plan geht auf: Die anonymen Liebesbriefe, die Matthias selbst verfasst, verzaubern seine Mutter. Doch als sie den Unbekannten treffen will, droht der ganze Schwindel aufzufliegen.'
