  subtitle: '"Пробуждение" с пастором Этом Бошоффом -- №291 Вы - соль земли'
  description: 'Пастор Эт Бошофф известен своей верой и целеустремленностью. Его цель - нести вдохновляющее послание о жизни в свободе и силе Духа Святого, которое меняет жизни тысяч людей по всему миру. В передачах "Пробуждение" вы найдете Библейский взгляд на любые жизненные ситуации! Бог хочет, чтобы внутри мы переживали мир, праведность и радость в Святом Духе. Но что, если кто-то причинил нам боль? Если мы пережили насилие, предательство или травму, внешне мы можем выглядеть благополучно, но глубоко внутри горечь и непрощение продолжают отравлять нашу жизнь. Мы отстраняемся от людей и живем словно за стеной. Поэтому, если мы хотим получить то, что Бог приготовил для нас, мы должны разобраться с этой болью, освободиться от обиды, прежде чем сможем начать двигаться дальше. Пастор Эт Бошофф уверен: многие болезни возникают из-за эмоциональных проблем. Библия говорит: "Веселое сердце благотворно, как врачевство, а унылый дух сушит кости" (Притчи 17:22).'
