  title: '"Обет верности" - х/ф 12+'
  subtitle: '"Обет верности" - х/ф 12+'
  description: По книге Деборы Рэйни. Фильм рассказывает о семье Джона и Элен Брайтон. Их дети повзрослели. Сын окончил колледж и собирается жениться. Дочке почти шестнадцать и её "сложный" возраст даёт о себе знать. Джон Брайтон является руководителем солидной компании, которой он руководит вместе со своим братом. Фил Брайтон, брат Джона и его партнер по бизнесу, живет сегодняшним днем, вечные ценности любви и верности не слишком занимают его. Так бы все и продолжалось, если бы у Элен не обнаружили серьёзную болезнь, которая привела к потере памяти. Сначала "лучшая учительница" забывает имена своих учеников, затем перестаёт следить за порядком в доме, а потом и вовсе перестаёт узнавать своих собственных детей. Для Джона наступает тяжёлый период. Непреходящее чувство одиночества навязывает мысли о том, чтобы всё бросить. Ситуация на работе требует его присутствия. Его брат Фил советует отдать Элен на попечение специалистам-медикам. В этот же период Джон знакомится с красивой одинокой женщиной, Джулией Синклер. Их совместное времяпрепровождение приводит к установлению между ними тесных дружеских отношений. В результате, дома Джон появляется редко. В его голову то и дело приходят мысли уйти к другой женщине.
