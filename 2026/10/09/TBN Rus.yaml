  description: '"Люди дела" - проект, посвященный людям, которые любят и полностью отдаются своему призванию. Профессионалы из разных сфер жизни расскажут, как их ремесло связано с Богом, и вдохновят вас на новые открытия! "Люди дела" - серия документальных фильмов, в которых о своей жизни, вере, победах и профессиях рассказывают: фотограф, педагог, скрипач, резчик по дереву, физик, керамист и другие герои, преданные своему делу. Как биолог может познавать Бога через познание Его творений? Почему успешный блогер хочет отдать славу и хвалу за свой успех Господу? Что может помочь переводчику передать евангелие детям на их языке? Каким образом Библия повлияла на решение повара стать именно шоколатье? Это взгляд на жизнь от разных людей. Их мышление. Их принципы. Их призма восприятия реальности.'
