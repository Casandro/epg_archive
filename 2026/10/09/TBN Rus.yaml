  description: Эта программа посвящена чудесам Христа, которые иногда не понимают не только неверующие, но и христиане. Иногда под чудесами, мы понимаем нечто необычное. Но то, что раньше было необычно, то после нескольких лет становится привычным, так происходит со всеми изобретениями научными. Ректор РХГА Дмитрий Богатырев объясняет, что такое чудо. Почему множество чудес Христа было связано с исцелениями? В чем значение разных чудес? О чем нам говорит чудо воскрешения Лазаря? В чем смысл преображения на Горе Фавор? Ответы в программе.
