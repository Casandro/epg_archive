  title: Der Vormittag
  description: "In der Werkstatt, im Geschäft, im Büro oder zuhause - Bremen Eins passt eigentlich immer. Kein anderer Musikmix ist so abwechslungsreich und bietet so viele \"Aha-Momente\". Dazu gibt's interessante Service-Tipps für den Alltag. \nUn wi snackt Platt: Die plattdeutschen Nachrichten hören Sie montags bis freitags um 10:30 Uhr. Die Rundschau bringt Sie um 12 Uhr auf den neuesten Stand."
