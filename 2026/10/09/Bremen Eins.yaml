  title: Die ARD Hitnacht
  description: Schlaflos im Bett? Konzentriert bei der Arbeit? Allein im Auto unterwegs? Wir sind bei Ihnen. Mit guter Musik zum Wachbleiben. Dafür sorgt die ARD Hitnacht vom MDR. Dabei wechseln sich die Studios in Thüringen, Sachsen-Anhalt und Sachsen wochenweise ab. Dazu kommen von NDR Info Nachrichten, Verkehrshinweise und der Wetterbericht für Deutschland zur vollen Stunde.
  genre:
