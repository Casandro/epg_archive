  title: Universum History
  subtitle: Expedition Petra - Wüstenstadt im Fels
  description: "Sie ist eines der Neuen Sieben Weltwunder und laut Lawrence von Arabien \"der herrlichste Ort der Welt\": Die Wüstenstadt Petra im heutigen Jordanien. Die ehemalige Hauptstadt des Nabatäer-Reichs fasziniert seit ihrer Wiederentdeckung 1812 Archäologinnen, Literaten und Millionen Touristen. Riesige Grabmäler und Tempel, die direkt aus dem Fels gemeißelt wurden, die Mischung antiker Baustile und der Umstand, dass die Bauwerke Tausende von Jahren überdauert haben, machen Petra so einzigartig. Eine Archäologin macht sich auf den Weg der einstigen Handels-Karawanen von Medina in die Wüstenstadt, über die in der Antike Myrrhe und Weihrauch von Indien ins Römische Reich transportiert wurde. Die Reise auf der Weihrauchstraße - einer der ältesten Handelsrouten der Welt - erzählt von der alten Kultur der Nabatäer, die Petra erbaut haben und im 1. Jhd. n. Chr.  den Handel auf der arabischen Halbinsel kontrollierten. In fiktiven Spielszenen mit historischem Background wird das Leben eines Gewürzhändlers, seiner Frau und eines Kaufmannes in Petra nachgezeichnet. \nRegie: Nathalie Neville"
  genre:
  - '129'
