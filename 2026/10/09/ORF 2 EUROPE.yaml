  title: WeltWeit
  subtitle: Wohn(t)räume in der Krise. Wie sollen wir in Zukunft leben?
  description: |-
    Die Mieten steigen stetig, die Finanzierung von Eigentum sprengt oft den finanziellen Rahmen junger Familien. In immer mehr Städten fehlt es an leistbarem Wohnraum. Dabei stehen viele Wohnungen leer oder werden über Plattformen wie Airbnb nur als Ferienunterkünfte vermietet. Wer endlich was gefunden hat, bekommt am privaten Mietmarkt häufig nur einen befristeten Vertrag. Wohnen wird zunehmend zur sozialen und finanziellen Belastungsprobe und im Alter zur Einsamkeitsfalle. Die WeltWeit-Reporter:innen sind unterwegs, auf der Suche nach alternativen Modellen des Zusammenlebens, die Wohnen wieder leistbar machen und die Menschen in den Mittelpunkt stellen.
    In Schweden verzichten immer mehr Menschen auf den Traum vom klassischen Einfamilienhaus - und das nicht nur aus finanziellen, sondern auch aus ökologischen Gründen: Mehr Neubauten bedeuten mehr Bodenversiegelung. Die Idee: Alter Immobilienbestand wird für ein nachhaltiges Zusammenleben genützt. Lena Hager trifft in Stockholm die Architektin Anna Sundham, die sich sowohl privat als auch beruflich mit dem Thema beschäftigt: Sie hat ein 100 Jahre altes Haus co-living-gerecht renoviert und lebt dort nun mit mehreren Menschen unter einem Dach. In den USA ist im Sunshine-State Kalifornien die Zahl der Menschen, die in einem Wohnmobil leben, stark gestiegen. Der Grund: Die extrem hohen Immobilien- und Mietpreise. Ein Drittel der Häuser und Wohnungen am Markt kostet über eine Million Dollar. Selbst Doppelverdiener können sich kaum noch leisten, in innerstädtischen Gebieten zu leben. Patrick A. Hafner trifft Familie Hernandes aus Los Angeles, die in einen Wohnwagenpark gezogen ist, weil sie trotz eines Einkommens von 5.000 Dollar im Monat eine Mietwohnung kaum bezahlen können. Doch das Leben zu dritt in einem 30 Quadratmeter großer Camper ist herausfordernd. In Spanien überzieht eine veritable Wohnungskrise inzwischen das ganze Land. Maren Häußermann trifft in Barcelona Elinor, die das erste kooperative Wohnprojekt für ältere Menschen umsetzt. Es soll ein Zuhause werden, in dem sie gemeinsam mit anderen selbststimmt und aktiv altern kann. Es geht darum, Gemeinschaft zu leben, um drohende Einsamkeit im Keim zu ersticken, und darum, die von Übertourismus und Immobilienspekulation geprägte Stadt wieder zurückzuerobern für ein lebenswertes Älterwerden.
  genre:
  - '129'
