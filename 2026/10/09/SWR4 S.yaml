- eventId: 951460
  start: 2026-10-09T17:00:00Z
  stop: 2026-10-09T18:00:00Z
  title: SWR4 - 70er nach 7
  subtitle: mit Daniel Pesch
  description: |-
    Lava-Lampen, Disco-Kugeln, Dauerwelle, Schallplatten & Schlaghosen. Die 70er waren da, als das Leben zum ersten Mal laut wurde. Die Musik der 70er war frech, wild, romantisch, politisch, cool - und sie hatten Stil: Soul, Disco, Rock und Funk & Folk. Und genau das holen wir zurück. Mit legendären Klassikern, echten Geschichten und Songs, die das Herz noch auswendig kennt.

    Jeden Abend. Nach sieben. Von Montag bis Freitag.
