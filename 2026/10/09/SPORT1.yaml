  title: Auftrag Auto
  subtitle: Auftrag Auto
  description: 'Große Klappe - viel dahinter: Alex Wesselsky, den Zuschauern auch bekannt als "DER Checker" ist ab sofort jeden Donnerstag mit dem neuen Format "Auftrag Auto" auf SPORT1 zu sehen. Zusammen mit der Rennfahrerin Cyndie Allemann beantwortet der PS-Fachmann kompetent und launig die Zuschauerfragen, die die Auto-Nation bewegen, und kürt in jeder Sendung aus jeweils drei vorgestellten Fahrzeugen den Sieger.  Robin ist das Einsatzauto von Cyndie und Alex. Es hat nur drei Räder, ist sehr kippelig - mindestens einmal pro Folge fällt Alex damit auf die Seite. Beifahrerin Cyndie hasst den Robin, Alex liebt ihn. SPORT1-Zuschauerin Isabel fürchtet deshalb, dass sich die beiden verletzen könnten und fragt, ob Alex nicht ein Fahrertraining im Robin machen könnte. Rennfahrerin Cyndie schlägt ein MINI-Fahrertraining vor, damit Alex endlich lernt, mit einem Sportwagen im Allgemeinen und dem Robin im Speziellen umzugehen. Der Haken: Am Ende muss Alex sein Können unter Beweis stellen und in einem Rennen gegen Cyndie antreten.'
  widescreen: true
