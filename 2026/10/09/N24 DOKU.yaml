  title: Mayday - Bruchlandung in Amsterdam
  subtitle: Mayday - Bruchlandung in Amsterdam
  description: Im April 1994 startet der KLM-Cityhopper-Flug 433 vom Amsterdamer Flughafen Shiphol ins walisische Cardiff. Um den Passagieren eine ruhige Fahrt zu bereiten, entscheidet sich der Pilot, das aufkommende Gewitter zu überfliegen. Er erhält eine Freigabe auf 20.000 Fuß zu steigen. Nach einer Triebwerkswarnung muss er wenden und zurück zum Amsterdamer Flughafen steuern. Kurz vor der Landung gerät die Maschine außer Kontrolle. Können die Ermittler das Schicksal des abgestürzten Fliegers aufklären?
