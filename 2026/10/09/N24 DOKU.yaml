  title: Mayday - Flug Germanwings 9525
  subtitle: Mayday - Flug Germanwings 9525
  description: Am 24. März 2015 bricht Germanwings-Flug 9525 überraschend den Funkkontakt ab und zerschellt kurz darauf in den südfranzösischen Alpen. Zuvor hatte der A320 rapide an Höhe verloren, trotz optimaler Wetterbedingungen. Was ereignete sich an Bord der Maschine? Die französische Untersuchungsbehörde ist zunächst ratlos, bis der Flugdatenschreiber tragische Details ans Tageslicht bringt, die nur einen Schluss zulassen. Damals involvierte Ermittler schildern die Aufklärung des verhängnisvollen Flugs.
  widescreen: true
