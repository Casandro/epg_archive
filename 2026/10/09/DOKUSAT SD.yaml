  title: Hitler - Eine deutsche Tragödie
  subtitle: Hitler - Eine deutsche Tragödie - Der Führer
  description: Hitlers Popularität steigt dank des wirtschaftlichen Aufschwungs, auch bei Nicht-Parteimitgliedern. Er fördert den Autobahnbau und verspricht den Deutschen ein bezahlbares Auto, den Volkswagen, für dessen Produktion eine neue Stadt entsteht. Die Nürnberger Parteitage werden zu beeindruckenden Schauveranstaltungen für Hitlers Macht und das wiedererstarkte Deutschland. Sein Privatleben bleibt geheim, während er in Benito Mussolini einen Vertrauten findet.
  genre:
  - '129'
  widescreen: true
- eventId: 1441569
  start: 2026-10-09T22:20:00Z
  stop: 2026-10-09T23:25:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Hitler - Eine deutsche Tragödie - Ein Staatsmann
  description: Hitlers Macht ist unbestritten, unterstützt von Göring. Er droht mit dem Einmarsch in Österreich, der Kanzler beugt sich dem Druck und erlaubt die Besetzung. Eine Volksabstimmung befürwortet den Anschluss Österreichs an das Deutsche Reich, was Hitler ermutigt, die Taktik in der Tschechoslowakei zu wiederholen.
  genre:
  - '129'
  widescreen: true
- eventId: 1441570
  start: 2026-10-09T23:25:00Z
  stop: 2026-10-10T00:35:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Hitler - Eine deutsche Tragödie - Ein Brandstifter
  description: Nach dem Münchener Abkommen von Oktober 1938 erhält das Deutsche Reich das Sudetenland. Das deutsche Volk jubelt über Hitlers kampflose Erfolge, während er insgeheim einen Krieg plant. Der Bruch des Abkommens und die Besetzung der Tschechoslowakei sowie des Memellands schockieren das Ausland. Die Welt fragt sich, ob Hitler den Frieden in Europa riskieren wird. Er ist überzeugt, dass England und Frankreich einem Krieg aus dem Weg gehen wollen.
  genre:
  - '129'
  widescreen: true
