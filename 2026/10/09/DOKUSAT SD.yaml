  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Dünkirchen'
  description: Im Frühjahr 1940 wird eine britische Armee in Dünkirchen eingeschlossen, bereit, von der deutschen Wehrmacht vernichtet zu werden. Doch Hitler entscheidet anders. Churchill organisiert eine spektakuläre Evakuierung nach England, bei der alles Schwimmfähige zum Einsatz kommt. Hunderttausende kämpfen ums Überleben, während die Luftwaffe angreift. Die Briten sehen die Schlacht als Verlust, aber Dünkirchen stärkt ihre Entschlossenheit, den Krieg gegen Nazi-Deutschland zu gewinnen.
