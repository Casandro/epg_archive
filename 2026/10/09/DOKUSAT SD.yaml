  title: Tiere vor der Kamera - Der schnellste Vogel im Wilden Westen
  description: 'Roadrunner, es gibt ihn nicht nur als Comicfigur, es gibt ihn wirklich. Und rennen kann er so schnell und wendig, dass man fast vergisst, dass er als Vogel eigentlich fliegen müsste. In Südarizona, haben Arendt/Schweiger gefilmt, wie es bei Roadrunners so zugeht: Was macht er, um bei seiner Angebeteten zu landen? Wie wärmt er sich nach einer durchfrorenen Nacht auf? Vom Nestbau bis zum Ausfliegen waren Arendt/Schweiger mit ihrer Kamera dabei. Dramatischer Höhepunkt: Der Kampf mit einer Klapperschlange.'
  widescreen: true
- eventId: 1423990
  start: 2026-10-09T15:20:00Z
  stop: 2026-10-09T16:30:00Z
  title: Tiere vor der Kamera - Im Land der Riesenkakteen
  description: In Südarizona ersetzen Riesenkakteen die Bäume. Spechte meißeln Höhlen, Greifvögel bauen Horste. Die trockene Landschaft beheimatet erstaunliche Tiere wie Wüstenschildkröten, Krötenechsen und das beeindruckende Gilamonster. Einige Tiere meiden die Hitze des Tages und aktivieren sich nachts, darunter der Kaktuskauz, die Colorado-Kröte und Känguruhratten. Die Kakteenblüte lockt bunte Vögel an, ein Farbenrausch für die Kamera.
  widescreen: true
