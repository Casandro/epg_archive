  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Die Atlantikschlacht'
  description: Die Atlantikschlacht war eine entscheidende Phase des Zweiten Weltkriegs. Sie begann im September 1939 und dauerte bis zum Kriegsende. Die Alliierten kämpften gegen die deutsche U-Boot-Flotte, um die Versorgungsrouten über den Atlantik offen zu halten. Durch den Einsatz von Konvois, Geleitschutz und neuen Anti-U-Boot-Taktiken gelang es den Alliierten schließlich, die U-Boot-Bedrohung einzudämmen. Die Atlantikschlacht war ein wichtiger Beitrag zum Sieg der Alliierten und zur Eindämmung der deutschen Seemacht.
  genre:
  - '129'
  widescreen: true
- eventId: 1412210
  start: 2026-10-09T02:45:00Z
  stop: 2026-10-09T04:00:00Z
  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: 'Der zweite Weltkrieg: Der Weg zum Sieg - Die Invasion Nordafrikas'
  description: Die Invasion Nordafrikas im November 1942 markierte einen wichtigen Wendepunkt im Zweiten Weltkrieg. Unter dem Decknamen "Operation Torch" landeten alliierte Streitkräfte in Marokko und Algerien, um die Achsenmächte zu bekämpfen. Obwohl es anfänglich einige Rückschläge gab, gelang es den Alliierten, die deutschen und italienischen Truppen zu besiegen. Diese Invasion eröffnete den Weg für die Befreiung Nordafrikas und ebnete den Weg für weitere Erfolge der Alliierten im Mittelmeerraum.
  genre:
  - '129'
  widescreen: true
