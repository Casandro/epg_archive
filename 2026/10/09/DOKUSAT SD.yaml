  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Windige Aussichten
  description: 'Alaska ist ein Ort voller Extreme: mehr Tiere als Menschen, endlose Wildnis und brutales Wetter. Schneestürme, meterhohe Wellen und eisige Kälte machen das Leben hier zum Überlebenskampf. In Notlagen zählt jede Sekunde - deshalb ist die US-Küstenwache rund um die Uhr im Einsatz. Mit Helikoptern, Flugzeugen und Schiffen retten sie Menschen aus gefährlichen Situationen auf See und in den Bergen. Diese Serie begleitet die Heldinnen und Helden hautnah bei ihren riskanten Missionen'
  widescreen: true
  genre:
  - '129'
