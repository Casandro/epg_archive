  title: Wildes Überleben - Natürliche Verführer
  subtitle: Wildes Überleben - Natürliche Verführer
  description: '"Natürliche Verführer" beobachtet Tiere und ihre verschiedenartigen Strategien zur Partnersuche. Nur wer sich von der Masse abhebt, erreicht das oberste Ziel: die Art zu erhalten. Meist ist es Imponiergehabe, wenn es darum geht, die geeignete Gefährtin zu finden. Aber in der Natur gibt es bei der Liebeswerbung unzählige Techniken: Tanzen, Singen, Präsente für die Angebetete oder alle Nebenbuhler verprügeln - selbst tödliche Jäger können da erstaunlich charmante Liebhaber sein...'
  genre:
