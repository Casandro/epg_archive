  title: SWR Aktuell Langstrecke
  description: "14:00\nDie Justizreporter*innen\nWohnen für alle?! Das Mietrecht unter der Lupe\nDeutschland ist Mieterland: Mehr als die Hälfte der Menschen leben hier zur Miete. Und zugleich ächzen viele unter den Wohnkosten. 5,4 Millionen Menschen rutschen in Deutschland laut Paritätischem Wohlfahrtsverband wegen hoher Wohnkosten unter die Armutsgrenze. Das betrifft Familien und Student:innen, Alleinerziehende und Rentner:innen. Die vielzitierte Lösung dagegen lautet \"Bauen, bauen, bauen!\" - aber hilft das wirklich gegen den fehlenden bezahlbaren Wohnraum in Ballungszentren? Und welche Rollte spielt das Recht für das Ziel \"Wohnen für alle\"? \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-justizreporter-innen/urn:ard:show:8e3e202c41bc9ace/\n\n14:30\npunktEU: Trump bekämpft Europas Richter - wie schützt die EU ihre Werte?\nDer Internationale Strafgerichtshof steht unter Beschuss von US-Präsident Trump: Er nennt Richter in Den Haag korrupt und lässt sie sanktionieren. Wie kann sich die EU wehren und demokratische Werte schützen? Mit Kathrin Schmid und Jean-Marie Magro.\nAutoren: Kathrin Schmid und Jean-Marie Magro\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/"
