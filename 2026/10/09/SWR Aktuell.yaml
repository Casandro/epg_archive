- eventId: 950279
  start: 2026-10-09T16:30:00Z
  stop: 2026-10-09T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Organisierte Kriminalität in Europa (2/3) - Die vielen Komplizen
  description: |-
    Von Beate Krol
    Die organisierte Kriminalität weitet sich aus. Das liegt auch an ihren vielen Komplizen, an uns. Clubgänger ordern Drogentaxen, Influencerinnen bestellen gefälschte Markenprodukte, Männer besuchen Zwangsprostituierte. Andere stellen ihr Konto für Geldwäsche zur Verfügung. Die organisierte Kriminalität (OK) spannt außerdem geschickt Menschen für ihre Zwecke ein, die die OK ablehnen. Im schlimmsten Fall ist man bei ihr angestellt oder hat eine Wohnung bei ihr gemietet. Die OK zu erkennen und sich gegen sie zu stellen, ist schwer, aber wichtig. Nur wie? (SWR März 2026)
    (Teil 3: Organisierte Kriminalität in Europa - Die EU-Ermittler, Samstag, 10. Oktober 2026, 8.30 Uhr)
- eventId: 950280
  start: 2026-10-09T17:00:00Z
  stop: 2026-10-09T18:00:00Z
  title: Der Tag
  description: "19:00\nAus dem Leben\nBuchautorin Nele Neuhaus\nNele Neuhaus ist eine der erfolgreichsten Krimiautorinnen Deutschlands. Auch ihr 12. Taunuskrimi \"Alles wird Asche\" landete direkt wieder auf Platz 1.\nDarüber und über ihren Weg zur Bestsellerautorin plaudert sie in Aus dem Leben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/ \n\n19:30\nKultur - Gemeinsames Singen - was ist der Reiz von Chören?\nEs gibt in Deutschland etwa 60.000 Chöre. In manchen wird es jazzig, andere singen Pop, Gospel oder auch klassische WErke. Manche sind hochprofessionell, im Verband organisiert, es gibt Chöre mit einem Anliegen, einer Botschaft, welche, die sich ganz spontan zusammentun und wieder andere wollen vor allem ihren Verein unterstützen. Über 3 Millionen Menschen singen in Deutschland regelmäßig zusammen. Aber warum? Was ist der Reiz von Chören? Das finden wir heute raus!\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/"
