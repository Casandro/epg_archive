  description: 'Die Fütterung der Leistenkrokodile ist eine Sensation in der Wilhelma, denn Revierleiter Harry Aberle lässt seine Krokodile dafür "springen". Ein wöchentliches Highlight für ihn und die vielen Besucher - und alles andere als ungefährlich. Eine Wohngemeinschaft der besonderen Art: In der Wilhelma teilen Faultiere, Agutis und kleine Äffchen ein Gehege. Azubi Angela lernt heute alles über die außergewöhnliche WG und geht mit den Faultieren auf Tuchfühlung. Nachwuchs in der Wilhelma: Die Okapis haben ein Jungtier. Jetzt gilt es, die drei Monate alte Lumara für ein gutes Tier-Mensch-Verhältnis immer mehr an ihre Tierpfleger zu gewöhnen.'
