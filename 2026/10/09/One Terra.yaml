  title: Planet Weltweit - Auf der Spur des spanischen Luchses
  subtitle: Planet Weltweit - Auf der Spur des spanischen Luchses
  description: |-
    Der Iberische Pardelluchs steht kurz vor dem Aussterben. Es wäre die erste Raubkatzenart seit dem Säbelzahntiger vor 10.000 Jahren, die von der Erde verschwindet - ausgerechnet in Europa, im südspanischen Andalusien. Seit der Jahrtausendwende kämpfen Tierschützer mit allen Mitteln um den Erhalt der Tiere. Nun tritt die Rettung der seltensten Großkatzenart der Welt in eine entscheidende Phase: Nach und nach setzen die spanischen Experten des Artenschutzprogramms "Lince Life" einige Luchse in einem neuen Revier aus. Gelingt es ihnen, dort eine neue, stabile Population zu gründen? Planet Weltweit hat über ein halbes Jahr lang den Kampf um Spaniens letzte Luchse begleitet.

    Um die Jahrtausendwende wäre die kleine Schwesterart des eurasischen Luchses um ein Haar ausgestorben. Bevölkerten noch vor wenigen Jahrzehnten über 5000 Iberische Luchse unzählige Landstriche Portugals und Spaniens, kommen die Tiere heute in freier Wildbahn nur noch in zwei kleinen Revieren im südspanischen Andalusien vor: in den Wälder der Sierra de Andújar und in Doñana, im Mündungsdelta des Guadalquivir am Atlantik. Doch Europas teuerstes Schutz- und Zuchtprogramm zeigt Wirkung: Die Population des Pardelluchses konnte sich in den letzten Jahren fast wieder verdoppeln, auf rund 250 Tiere. Trotzdem ist diese Zahl noch immer zu niedrig, um den Genpool der Katzenart dauerhaft als gesund zu bezeichnen. Aufklärungsarbeit, Bau von Luchsbrücken und Tunneln - all dies und etliche Freilandmaßnahmen kosten viel Geld, sollen aber helfen, mittelfristig neue Siedlungsgebiete zu erschließen und die Abwanderung der Luchse zu ermöglichen. Denn das Hauptproblem, speziell der Doñana-Luchse, ist die Inzucht. Schon seit 1997 kämpft Miguel Ángel Simón als Direktor für das Überleben der Iberischen Luchse. Nun will er mit seinen Mitarbeitern Luchse in einem Gebiet aussetzen, in dem die Tiere heute nicht mehr vorkommen. DE 2011
