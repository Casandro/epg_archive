  title: Planet Weltweit - Bahamas - unverfälscht!
  subtitle: Planet Weltweit - Bahamas - unverfälscht!
  description: 'Die Bahamas - legendenumwoben und malerisch. Die mehr als 700 Inseln und über 2000 Korallenriffe im Nordatlantik sind ein Sehnsuchtsort. Nur 30 der Inseln sind bewohnt. Doch wie leben die Einwohner abseits von der Hauptinsel, und damit jenseits von Tourismus und Steueroase? Auf der sehr ursprünglichen traumhaften Insel Cat Island, die 2011 vom Hurrikan Irene verwüstet wurde, zeigt sich das andere Leben der Bahamas. Hier reicht der Verdienst immer gerade zum Überleben, Arbeitslosigkeit und Perspektivlosigkeit hat viele Einwohner in Lethargie verfallen lassen. Doch ein paar hochmotivierte Frauen versuchen, für die nächste Generation eine Zukunft zu bauen. Die Reportage blickt hinter die Kulissen von Traumstränden und Luxuslinern auf das wirkliche Leben auf den Outer Bahamas. Das 388 Quadratkilometer große Cat Island ist eine der ursprünglichsten Inseln der Bahamas. Daisymae Hunter ist Abgeordnete der örtlichen Regierung, fünffache Mutter und zu energiegeladen, um den Zuständen auf ihrer Insel noch weiter tatenlos zuzusehen: Es gibt kaum Tourismus, keine Industrie und wenige Arbeitsplätze. Dazu kommen die Schäden durch Hurrikan Irene, die noch lange nicht behoben sind. Die meisten Männer sind entweder auf kriminelle Abwege geraten, untreu oder lethargisch. So ziehen die Frauen ihre Kinder alleine groß, bauen Obst und Gemüse an und stellen Kunsthandwerk her. Und sie planen Aktionen zur Aufklärung und Motivation für die junge Generation. Als Vizepräsidentin der Kunsthandwerker-Vereinigung reist Daisymae zur Nachbarinsel Long Island. Dort will sie nicht nur neue Muster für Sisalarbeiten erkunden, sondern vor allem auch herausfinden, warum die Nachbarinsel sich nach den Verwüstungen durch Hurrikan Irene weitaus besser entwickelt hat als Cat Island. Außerdem will sie den Besuch der amtierenden Miss Gospel Bahamas 2011, Lavette Smith, organisieren. DE 2012'
  ageRating: 6
