  title: Planet Weltweit - Kung Fu - Chinas neue Kämpferinnen
  subtitle: Planet Weltweit - Kung Fu - Chinas neue Kämpferinnen
  description: 'Seit vier Jahren besucht die 18-jährige Guo Jia die einzige reine Mädchenschule für Kung Fu in China: ein Internat für 70 Schülerinnen, einsam gelegen in einem zerklüfteten Tal des heiligen Shongshan-Gebirges. Mit der Yongtai-Schule lebt eine lang vergessene Tradition wieder auf: Schon vor 1500 Jahren haben an diesem Ort Frauen Kung Fu gelernt, Nonnen des ersten buddhistischen Frauenklosters in China, dem heute die Schule angeschlossen ist. Schon als Kind träumte Guo Jia davon, Kung-Fu-Kämpferin zu werden - über Mauern und Dächer zu springen, ganz so, wie ihre Heldinnen im Kino. Die Dokumentation zeigt wie Guo Jias Traum jetzt in Erfüllung geht. In der Yongtai-Mädchen-Schule für Kampfkunst beginnt Guo Jias Tag um 5:30 Uhr mit Konditionstraining. Nach dem Frühstück folgen Dehnübungen und Kung-Fu-Kämpfe mit verschiedenen Waffen wie Säbeln, Speeren und Schwertern - und auch ganz normaler Schulunterricht. Nur am Sonntag hat Guo Jia frei - und in den einwöchigen Frühjahrsferien. Die harte Ausbildung empfindet Guo Jia als Privileg. Außerdem lebt sie gerne mit so vielen Mädchen zusammen. Das Zimmer teilt sie sich mit zehn anderen; warmes Wasser oder gar Badezimmer gibt es nicht. Zum Duschen fahren die Mädchen sonntags mit dem Bus zu einem Badehaus in die nächste Stadt, nach Dengfeng. Diese Stadt trägt den Namen "Kung-Fu-City", denn hier gibt es über 80 Kampfsport-Schulen, mit mehr als 60.000 Schülern aus ganz China. Der Schulabschluss an einer Kung-Fu-Schule ist hoch angesehen. Doch nur sehr wenige Mädchen trainieren in diesen gemischten Schulen. Umso spannender ist für Guo Jia und ihre Mitschülerinnen das bevorstehende Sportfest, bei dem sie auch gegen Schüler einer anderen Schule antreten werden. Als besondere Vorbereitung und Ehre dürfen die Mädchen mit einem Mönch aus dem nahe gelegenen Shaolin-Tempel trainieren - jenem weltberühmten Kloster, in dem einst Zen- Buddhismus und Kung Fu entstanden sind. DE 2011'
