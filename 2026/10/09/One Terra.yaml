  title: Planet Weltweit - Auf den Dächern von Kairo
  subtitle: Planet Weltweit - Auf den Dächern von Kairo
  description: "Wer durch die Straßen von Kairo läuft, sieht nur die Hälfte der Stadt. Auf den Dächern der Metropole existiert eine  Parallelwelt, die so bunt und vielschichtig ist, wie die Stadt am Boden. Kairos ältere Hochhäuser sind nämlich so  konzipiert, dass deren Bewohner ihren Bediensteten kleine Hütten auf dem Dach errichten lassen können. Wo immer das geschah, holten die Hausangestellten ihre Familien und Bekannten nach, und es entstand eine Stadt über der Stadt. Mit Menschen, die dort oben kochen, essen und schlafen. Einige halten sogar Ziegen oder Kaninchen. \n\nKinder treiben lachend eine Ziege vor sich her, vorbei an kleinen Wellblechhütten und frisch gewaschener Wäsche. Was aussieht, wie eine Szene aus dem Alltag eines Dorfes, spielt sich in, oder besser gesagt über der Millionenmetropole Kairo  ab. In einer Dachsiedlung, wie es sie auf fast jedem der alten Wohnhäuser der Innenstadt gibt. Die Mutter der spielenden  Kinder ist die energische Rabab. Sie ist froh, dass ihre Kinder so frei aufwachsen können, wie sie es selbst in ihrer  Kindheit auf dem Land erlebt hat. Auch sonst liebt sie ihr Leben auf dem Dach: Die Ruhe und der weit reichende Blick aus der Höhe lassen die Hektik und die Gefahren des lauten, überfüllten Kairo fast vergessen. Besonders die enge Gemeinschaft der Dachbewohner will Rabab nicht missen. In der Großfamilie wird zusammen gekocht und gegessen. Die Menschen teilen ihre Sorgen, und wenn jemand Hilfe braucht, sind die anderen für ihn da. Hier findet die kinderlose Witwe genauso Halt, wie der Steuerberater. Doch wie alles, hat auch dieses Leben zwei Seiten: Die Siedlungen auf den Dächern sind nur geduldet -  Mietverträge gibt es kaum. Und so schwingt ständig die Angst mit, dass das Dach von einen auf den anderen Tag geräumt wird, denn kleinere oder größere Konflikte gibt es immer. Mal beschweren sich die Hausbewohner über die schreienden Kinder auf  dem Dach, mal verlangt der Hausbesitzer den teuren Kauf neuer Wassertanks.  DE 2006"
