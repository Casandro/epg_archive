  title: Disneys Lilo & Stitch
  subtitle: Der Dreck muß weg! Zeichentrick-Serie, USA 2004
  description: Folge 33, Van Hamsterdam schickt völlig entnervt Experiment 010 an Gantu zurück, und schließlich landet es bei Lilo und Stitch, die erst total begeistert sind. Experiment 010 ist ein Reinlichkeitsfanatiker und räumt in Windeseile jeden Schmutz weg. Doch 010 räumt nicht nur den normalen Dreck weg, sondern auch jede Art von Keimen. Dazu gehören alte, wertvolle Teppiche und Kunstwerke und letztlich auch menschliche Wesen. Jamba kämpft darum, das Experiment neu zu programmieren. Doch dummerweise programmiert er 010 um hundertachtzig Grad, und der kleine Putzteufel wird zu einem richtigen Dreckspatz.
