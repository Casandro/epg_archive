  description: Muzikál expres pozve na premiéru muzikálu Obyčejná holka do Divadla Lucie Bílé v Praze a na nové nastudování muzikálu Rent do Londýna. Připomene 20. výročí světové premiéry krimi-muzikálu Rebecca a ve druhé části pogratuluje k životnímu jubileu Monice Absolonové. Samozřejmě zazní nejznámější melodie z z inscenací, ve kterých bylo možné ji spatřit. Uvádějí Michael Prostějovský a Pavel Bár. Repríza ze 4.10.
