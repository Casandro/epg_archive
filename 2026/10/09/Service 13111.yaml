  title: Hubert und Staller
  subtitle: Bleifrei in den Tod
  description: "Hubert und Staller geht der Sprit aus und sie müssen einen unfreiwilligen Spaziergang zur nächsten Tankstelle machen. Auf der Suche nach einem Ersatzkanister stolpern die beiden in einer Tankstelle über einen schrecklichen Fund: Martin Geier liegt erstochen in seiner Werkstatt. Weder Angestellte, Freunde, noch Ines Geier, die Ehefrau des Toten, können sich erklären, wer den unbescholtenen Tankstellenbesitzer umgebracht haben könnte. Als Hubert und Staller in der Tankstelle jedoch ein geheimes Lager mit geklauten Airbags und Navigationsgeräten entdecken, erscheint das Opfer in einem ganz anderen Licht. Offenbar war der Mann im großen Stil als Hehler tätig. War ein Streit unter Kriminellen Auslöser für den Mord? \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2016, R: Sebastian Sorger"
  widescreen: true
