  title: Terra Mater - NaturTalente
  subtitle: Meister der Täuschung (3/3)
  description: "Das Tier- und Pflanzenreich ist voll von ihnen: den Meistern der Täuschung. Ob Camouflagetaktiken, Fallensteller oder Verhaltenskünstler: Täuschung wird von vielen zu ihrem eigenen Vorteil eingesetzt. Ein Oktopus wird am Meeresgrund beinahe unsichtbar, um einerseits seine eigene Beute nicht zu verschrecken, andererseits selbst nicht zum Opfer zu werden. Im dichten Blätterwerk Brasiliens verschwinden Jaguare dank ihrer Fellmusterung - unentdeckt  schlagen sie im richtigen Moment zu. Schneehasen wechseln zweimal jährlich ihr Fell, um sich optisch den Gegebenheiten anzupassen. Und gewisse Spinnenarten geben einfach vor, Ameisen zu sein, um von ihren eigenen Fressfeinden übersehen zu werden. Dabei täuschen nicht nur Tiere, selbst Pflanzen sind gekonnte Fälscher und Betrüger. In \"NaturTalente - Meister der Täuschung\" sind clevere Strategien und kreative Anpassung gefragt, um im täglichen Kampf ums Überleben zu bestehen.   \nNatur, Österreich 2016"
