  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: |-
    "BLICKWECHSEL. Das Nachrichtenmagazin" ist jeden Donnerstag um 21.15 Uhr bei ServusTV zu sehen. Die Idee zum Format schließt nahtlos an jener der Servus Nachrichten an. "BLICKWECHSEL" unterscheidet sich jedoch durch seine hintergründigen und ausführlichen Beiträge von der Kompaktheit einer Nachrichtensendung. "BLICKWECHSEL" bietet einen tieferen Blick hinter die Kulissen des Zeitgeschehens - und nimmt dabei immer auch überraschende, womöglich unbekannte Positionen ein.
    "BLICKWECHSEL" berichtet über politische, wirtschaftliche und gesellschaftliche Themen, die die Menschen in Österreich bewegen. Mit freiem Geist und dem Ziel, mit jedem Beitrag einen BLICKWECHSEL vorzunehmen. Mit Themen und Aspekten, die woanders zu kurz, oder gar nicht vorkommen. Man blickt hinter die bekannten Schlagzeilen und vielfach gleichen Erzählungen. Mit Mut, aber sachlich und mit journalistischer Sorgfalt, unabhängig davon, ob die Positionen vermeintlich unerhört oder unkonventionell sein mögen.
    Durch die 30-minütige Sendung führt Katrin Prähauser live aus dem Studio in Salzburg. Gemeinsam mit einem Studiogast sollen das Thema der Woche erläutert und drängende Fragen beantwortet werden.Österreich 2026,  M: Katrin Prähauser
  genre:
  - '33'
  widescreen: true
- eventId: 1579872
  start: 2026-10-09T07:05:31Z
  stop: 2026-10-09T07:55:00Z
  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: "SPÖ-Machtkampf: Ein Schrecken ohne Ende? \nFliegen der SPÖ nun wieder die Wählerherzen zu? Der unter Beschuss stehende Parteichef Andreas Babler bekommt mit Eva-Maria Holzleitner und Philipp Kucher zwei - laut Meinung der Genossen - beliebtere Gesichter zur Seite gestellt. Und bleibt der Partei erhalten. Die will so aus dem Umfragetief von 15 Prozent kommen. Ob das wirklich reicht? Das erzählen uns die Bürger von Villach. Und was bedeutet das rote Personalchaos für die Koalition? Droht jetzt ein Stillstand in der Regierung? \n\nMillionen für Sprachförderung in Arabisch und Bosnisch - bleibt Deutsch auf der Strecke? \n26 Millionen Euro Steuergeld pro Jahr gibt das Bildungsministerium für Muttersprachenunterricht an Österreichs Schulen aus. Am häufigsten wird der in Türkisch, Bosnisch-Kroatisch-Serbisch, Arabisch und Tschetschenisch angeboten. Für das Ministerium gut investiertes Geld, für Kritiker volle Verschwendung. 60 Prozent der Schüler in Wien beherrschen die deutsche Sprache nicht gut genug, um dem Unterricht folgen zu können. Setzt das Ministerium die falschen Prioritäten? Dazu eine Schaltung zu Thomas Walach, Lehrer an einer Brennpunktschule in Wien. \n\nProteste in Frankreich eskalieren: Treiben Migranten und Ultralinke die Gewalt an? \nBrennende Barrikaden, Angriffe auf Polizei, Feuerwehr und Lehrer, verwüstete Schulen. Seit Tagen kommt es in ganz Frankreich immer wieder zu schweren Ausschreitungen. Mittendrin sind immer wieder vermummte Linksradikale und junge Männer mit offenbar migrantischem Hintergrund zu sehen. Was hat das noch mit maroden Schulen und fehlenden Lehrern zu tun, gegen die sich der Protest ursprünglich gerichtet haben soll? Wir sind in Paris und fragen: Wer steckt hinter den Krawallen, wer treibt die Gewalt an?Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
- eventId: 1423968
