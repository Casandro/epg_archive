  title: Hunde in den Bergen
  description: "Hunde stehen auch in den Bergen als furchtlose Begleiter den Menschen stets zur Seite. Vor mehreren tausenden Jahren haben wir einen emotionalen Pakt mit den Vierbeinern geschlossen - ein Pakt, der bis heute ungebrochen ist. \n\"Jedes intensive Bergerlebnis vertieft eine Partnerschaft und so ist es auch mit dem Hund\", erzählt Bergführer Michael Dorn, wenn er gemeinsam mit Schlittenhundmischling Snoopy den 2.150 Meter hohen Höllentorkopf am Zugspitz-Massiv besteigt. \nDass ein konfliktarmes Zusammenleben zwischen Mensch, Hund und Wolf möglich ist, beweist der Hirte Daniel Paratscha. Gemeinsam mit seinen Hunden hütet er bereits in dritter Generation Schafe und Ziegen am Monte Stivo am Gardasee. \nTreuer Weggefährte, Familienmitglied und Trainingspartner: Auch für die Profiathletin und Trailrunnerin Johanna Hiemer und ihren Vater, den Marathonläufer Wolfgang Erhart ist Hund Robby weit mehr als nur ein Haustier. Seit 10 Jahren trainieren Vater und Tochter gemeinsam mit dem Magya Viszlar in den Bergen. \nIn den Hohen Tauern will Jäger und Förster Christoph Oberreiter seinen jungen Hannoverschen Schweißhund Diego zum Jagdhund ausbilden. Die Rasse gilt als ausdauernd, zäh und beharrlich. Dass eine Partnerschaft zwischen Mensch und Hund sogar Leben retten kann, zeigt Bergretterin und Polizistin Anna Meixner gemeinsam mit ihrem Australian Shepherd Buddy. \nEine der wohl schönsten, wenn auch anspruchsvollsten Hunderassen ist der Husky. Bernd Spießberger züchtet die Rudeltiere in Offensee und teilt diese Leidenschaft seit 16 Jahren mit Ehefrau Christa. Das Faszinierende an Huskys: Sie können das 9-fache ihres Körpergewichts ziehen, haben einen besonders guten Orientierungssinn und können Temperaturen von bis zu minus 50 Grad standhalten.\nDokumentarfilm, Österreich 2021, R: Stefan Gavac, Monika Roidmayr"
  genre:
  - '145'
  widescreen: true
