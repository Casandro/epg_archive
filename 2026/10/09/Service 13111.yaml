  title: P.M. Wissen
  subtitle: Alles in Ordnung? - Wie uns Aufräumen glücklich machen kann
  description: 'Unordnung entsteht schnell - und dass sie uns stresst, ist sogar wissenschaftlich belegt. Unser Gehirn schüttet bei Unordnung vermehrt das Stresshormon Kortisol aus. Ein chaotisches Umfeld beeinflusst uns zudem negativ: In verschmutzten Küchen neigen wir zu schlechten Ernährungs-Gewohnheiten, in alter Bettwäsche schlafen wir schlecht und wichtige Entscheidungen schieben wir am unordentlichen Arbeitsplatz auf. Aber Aufräumen fällt oft schwer. "P.M. Wissen" begleitet einen Aufräum-Coach bei einem Einsatz in Wien und klärt, mit welchen Tipps und Tricks wir unser Chaos wieder in den Griff bekommen.Österreich 2023'
