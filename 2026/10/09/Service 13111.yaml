  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die Geheimnisse der Sumerer
  description: |-
    Vor über 7.000 Jahren entwickelten die Sumerer eine der ersten Hochkulturen der Welt. Sie führten Innovationen wie das Rad, die Landwirtschaft und die Mathematik ein und hinterließen zahlreiche Schriften über die Anunnaki, eine Gruppe mächtiger Götter. Die Sumerer betrachteten die Anunnaki als reale Wesen. Während die Göttergeschichten lange als Mythologie angesehen wurden, gibt es Hinweise darauf, dass einige erwähnte Orte, wie bestimmte Tempel, tatsächlich existierten. Könnten die Geheimnisse der Sumerer Aufschluss über unsere möglicherweise außerirdische Vergangenheit geben?
