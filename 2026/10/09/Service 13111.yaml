  title: Talk im Hangar-7
  description: |-
    Trotz Putschversuch und Umfragekrise sitzt Vizekanzler und SPÖ-Chef Andreas Babler noch immer im Sattel; wie es langfristig weitergeht, wird erst ein Parteitag im Frühjahr zeigen. Während sich die SPÖ für die "geordnete Übergabe" feiert, mahnen die Koalitionspartner ÖVP und NEOS volle Konzentration auf die gemeinsame Regierungsarbeit ein. Doch ÖVP-Kanzler Christian Stocker ist selbst mit Rücktrittsforderungen konfrontiert, und der Ruf nach Neuwahlen wird immer lauter. Ist die Regierung überhaupt noch handlungsfähig? Sind die Machtkämpfe in der SPÖ jetzt Geschichte? Oder unternimmt Medienmanager Gerhard Zeiler, der die aktuelle Krise ausgelöst hat, einen neuen Übernahmeversuch?
    Diskussion, Österreich 2026,  M: Michael Fleischhacker
