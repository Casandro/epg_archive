  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Gastköche
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Gastköche
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Jeden Monat kreiert im Salzburger Zwei-Sterne-Restaurant Ikarus ein anderer internationaler Spitzenkoch das Menü - ein weltweit einzigartiges Konzept. Hangar-7 Executive Chef Martin Klein besucht dafür die Besten der Besten, wirft einen Blick hinter die Kulissen der Haute Cuisine und wird eingeweiht in kulinarischen Geheimnisse. Doch die aktuellen Ereignisse erfordern neue Ideen und so kommt es im Juni zu einer einzigartigen Premiere in der Geschichte des Restaurant Ikarus. Nach 17 Jahren Gastkoch-Konzept dürfen nun die Gäste mitentscheiden was auf den Tisch kommt. Per Onlineentscheid wurden die Favoriten der Gäste gewählt und Martin Klein und sein Team kreieren daraus ein 12-gängiges Menü für den Juni: Das Best of Gastköche-Menü. Wir blicken zurück und erinnern uns gemeinsam mit dem Team an unterhaltsame, schöne, aber auch knifflige Momente, die die gewählten Gastköche und ihre Menüs für das Ikarus-Team parat hielten. AT 2020'
- eventId: 1526953
  start: 2026-10-09T14:10:00Z
  stop: 2026-10-09T14:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Marco Müller
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Marco Müller
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Als der Guide Michelin 2020 seine Auszeichnungen verlieh, war die Sensation in Berlin perfekt: Als erster Koch überhaupt holte Marco Müller die begehrten drei Sterne in die deutsche Hauptstadt. Genau genommen erhielt er sogar vier: Mit dem neuen grünen Stern belohnen die Juroren Müllers Engagement für nachhaltige Küche. Mit seinem Restaurant Rutz hat sich Marco Müller schon früh von klassischen Luxusprodukten und französischer Zubereitungsweise abgewandt. Ihn interessieren Hölzer, Nadeln, ätherische Öle und Fermentierungsprozesse. Dabei schaut er sich in seinem näheren Umfeld um: Regionalität ist für ihn kein Trend, sondern eine logische Entwicklung. Mit diesem Konzept begeistert der gebürtige Babelsberger nicht nur seine Gäste und die internationale Gastro-Kritik, sondern auch Zwei-Sterne-Koch Martin Klein, der sich mit der Einladung Müllers nach Salzburg ein echtes Highlight ins kulinarische Jahr im Ikarus gesichert hat. Bei seinem Besuch in Berlin lernt der Besucher aus Österreich die raffinierte Küche seines deutschen Kollegen genauer kennen - und sieht sich mit der sprichwörtlichen Berliner Schnauze konfrontiert! AT 2020'
- eventId: 1526954
  start: 2026-10-09T14:40:00Z
  stop: 2026-10-09T15:05:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ikarus Team 4
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ikarus Team 4
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Erfolgsrezept Weltoffenheit: Die Inspiration aus fernen Ländern ebenso wie aus heimischen Gefilden prägt den Facettenreichtum der Kochkunst im Restaurant Ikarus jeden Monat neu. Elf Monate im Jahr bringt das Ikarus Team die Geschmäcker, Philosophien und Techniken internationaler Spitzenköche auf die Teller der Gäste. Das Ergebnis ist stets eine außergewöhnliche kulinarische Reise - traditionell findet im Monat August die Reise in den eigenen vier Wänden statt. Unter der Leitung von Executive Chef Martin Klein entstehen im Hangar-7 Speisen mit höchstem Anspruch an Produktbewusstsein und Authentizität. Auch dieses Jahr ist es wieder spannend, welche Inspirationen und Ideen das Team aufgreift und wie das Menü am Ende für den Gast aussehen und vor allem schmecken wird. AT 2020'
