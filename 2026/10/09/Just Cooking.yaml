  title: Mein wunderbarer Kochsalon - Schulsnacks
  subtitle: Mein wunderbarer Kochsalon - Schulsnacks
  description: 'Jetzt ist wieder Schluss mit Lustig, früh aufstehen ist angesagt, Jause machen und in letzter Sekunde irgendwelche zerknitterten Formulare unterschreiben. Mit einem Wort: Schule. Obwohl ich gestehen muss, dass ich die Routine auch sehr schätze, nach unzähligen Koffer-ein-und-auspacken bin ich ganz zufrieden damit, dass jetzt alles wieder an seinem Platz ist. Die Jausenstrategie hat sich allerdings geändert. Meine Teenager-Kinder haben plötzlich erkannt, dass in meinen jahrelangen Obst- und Gemüsepredigten doch ein Körnchen Wahrheit steckt und erbitten gesunde Snacks. Das Beste daran: Sie durften/mussten sie selbst machen. AT 2021'
