  title: ECHT?
  subtitle: Schnapper oder Risiko? Das große Geschäft mit Fake-Sneakern -
  description: |-
    Sneaker von Nike, Puma oder Adidas kosten normalerweise einhundert Euro, manchmal sogar über tausend! Wie wäre es mit einem Fake-Sneaker für dreißig Euro? Kaum zu unterscheiden vom Original. Ob Sneaker-Experten, Designerinnen oder Produzierende - selbst sie müssen schon genau hinsehen, um Unterschiede auszumachen.

    Die Nachfrage nach Fakes steigt. Sie online zu kaufen ist kein Problem, wäre da nicht der Zoll. Denn Fakes sind illegal. Woher kommen sie und warum sind sie so günstig? Und was ist dran an dem Gerücht, dass die "Billig-Replicas" gesundheitsschädlich - weil schadstoffbelastet - sein sollen?

    ECHT?
