- eventId: 1602394
  start: 2026-10-09T05:20:00Z
  stop: 2026-10-09T06:10:00Z
  title: Rote Rosen (4394)
  subtitle: Deutschland 2026
  description: |-
    Lou bietet Richard überraschend die Doppelspitze der EmKa an. Richard ist glücklich, endlich im Vorstand zu sitzen. Doch Victoria ist fassungslos: Lou bricht mit der Tradition, dass nur Frauen die EmKa führen dürfen.
    Zwischen Carla und Michael droht der Konflikt um den Pferdehof zu eskalieren. Carla will um den Hof kämpfen, doch für Michael ist die Lage aussichtslos.
    Simon und Mo teilen ein Krankenzimmer - und stoßen dabei an ihre Grenzen. Ein offenes Wort schafft Klarheit.
    Jess findet zufällig einen Arbeitsvertrag für Lou als Footballcoach in München. Als Daniel Lou darauf anspricht, winkt Lou ab: Der Vertrag war eine Schnapsidee.
