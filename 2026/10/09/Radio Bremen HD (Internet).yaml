  title: die nordstory - Phoenix aus der Elbe
  subtitle: Die 7 Leben des Hamburger Lotsenschoners
  description: Der Lotsenschoner "No. 5 ELBE" hätte schon vor 130 Jahren im Sturm vor Helgoland sinken können, 1925 hätte er in Hamburg abgewrackt, verfeuert werden können. Er hätte an der US-amerikanischen Ostküste aufgegeben, vor Kap Hoorn Opfer einer Monsterwelle werden können. Am 8. Juni 2019 sank er vor Stadersand. Aber im Spätsommer 2026 schiebt sich ein weißer Schatten vor die Landungsbrücken, zieht die Blicke auf sich. Ja, da ist er! Lotsenschoner "No. 5 ELBE"! Gerade beginnt sein siebtes Leben!
