- eventId: 1588793
  start: 2026-10-09T00:15:00Z
  stop: 2026-10-09T00:45:00Z
  title: Die Nordreportage
  subtitle: Lebensspender und Lebensretter - Unser Blut
  description: Unser Blut - eine Mischung aus Wasser, Salzen und Milliarden kleiner Zellen und Teilchen, das uns am Leben hält. Es erfüllt unzählige Aufgaben, versorgt unsere Organe und unser Gewebe. Zusammensetzung und Struktur sind so komplex, dass es bisher noch nicht möglich ist, Blut künstlich herzustellen. Es muss durch Spenden generiert werden - und das in so hoher Zahl, dass jederzeit genügend Blutkonserven verfügbar sind. Die Nordreportage verfolgt den Kreislauf des Blutes von der Spende bis hin zum lebensrettenden Einsatz der Spende.
  genre:
  - '144'
