  title: Katoličanstvo
  subtitle: Religijski
  description: U ovoj epizodi, biskup Barron majstorski povezuje svjedočanstvo Katoličke vjere u Boga koji se otkrio u Isusu Kristu sa živom praksom štovanja prema Isusovoj majci. Marija se objašnjava kao stalna prisutnost u životu Crkve. Biskup Barron putuje do ruševnih skromnih ostataka Marijine kuće u Nazaretu, do ruševina drevnog grada Efeza te do velikih marijanskih svetišta u Lourdesu i Guadalupe kako bi što jasnije prikazao Crkveno učenje o Mariji kao Majci Božjoj, o Bezgrješnom Začeću i dogmi Uznesenja.
