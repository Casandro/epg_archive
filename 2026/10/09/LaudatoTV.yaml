  title: Susret u riječi
  subtitle: Religijski
  description: U novoj emisiji ugošćujemo istaknutog povjesničara dr. sc. Trpimira Vedriša, profesora na Odsjeku za povijest Filozofskog fakulteta u Zagrebu. Ovaj rođeni Zagrepčanin diplomirao je povijest i etnologiju, a doktorat je stekao na Srednjoeuropskom sveučilištu u Budimpešti. U svom znanstvenom radu primarno se bavi poviješću kršćanstva te hrvatskim srednjovjekovljem. Autor je brojnih znanstvenih radova i suurednik zapaženih zbornika o kultovima svetaca
- eventId: 1440547
  start: 2026-10-09T08:55:00Z
