  title: odaziv
  subtitle: Magazin
  description: Zaboravljeni Gospodar, prava drama vinogradara, slugu i novih podstanara, napetost između pohlepe i odgovornosti teme su na koje nas potiče Riječ Božja 27. nedjelje kroz godinu. Kako ih čitati u vlastitom životu? U kojem vinogradu radimo mi i kako to činimo? Zašto smo u napasti "posjedovati vinograd" umjesto služiti u njemu? I kako to prepoznati u svojem životu? Kako pobijediti pohlepu i njegovati zdrave odnose prema Bogu i bližnjima? U emisiji o tome govori bibličar vlč. Ivan Benaković.
