  title: More milosrđa
  subtitle: Religijski
  description: 'More milosrđa ulazi u novu sezonu s novim voditeljem: mons. Antunom Senteom! Uz zanimljive goste i razgovore o temama koje nas se svih tiču, u pojedinim emisijama mons. Sente bit će sam s gledateljima i otvarati važna životna i duhovna pitanja te odgovarati na ono što ih zanima. Telefonske linije i dalje su otvorene u svakoj emisiji jer More milosrđa želi biti mjesto susreta, razgovora, pitanja, svjedočanstava i blizine s našim gledateljima. Novo More milosrđa - od oluje do bonace, vođeni Božjom rukom.'
- eventId: 1440519
  start: 2026-10-09T02:28:00Z
  stop: 2026-10-09T02:57:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Euharistijska liturgija je prožeta prisutnošću Duha Svetoga. Od trenutka kada si odlučio ići na Misu, Duh Sveti je aktivan i živ. Nažalost, mnogo ljudi ne doživljava Duha Svetoga, i prisustvovanje Misi njima postaje odrađivanje, a ne život, susret s Isusom. U ovoj epizodi gledat ćemo neke od mnogih načina na koje je Duh Sveti prisutan u Svetoj Misi, a omogućuju nam da susretnemo živoga Boga u Liturgiji.
- eventId: 1440520
  start: 2026-10-09T02:57:00Z
  stop: 2026-10-09T03:37:00Z
  title: Nova misija
  subtitle: Dokumentarni
  description: 'Dvoje branitelja. Trideset godina braka. Troje djece. I stotine kilometara najtežih svjetskih pustinja. Kad su mnogi mislili da je nakon rata vrijeme za odmor, oni su odlučili pokazati kako se pomiču granice - i u sportu i u životu. Kako izgraditi sretnu obitelj i ostati neslomljivi nakon svega? Renata i Zorislav - supružnici koji pomiču granice mogućeg i poručuju: "Nismo generacija koja je prošla. Sreća je naša zajednička odluka." Dok je Renata u radnom odnosu i snažna čuvarica obitelji, Zorislav kao umirovljeni branitelj niže svoje nove pobjede. Postao je poznat po nevjerojatnim ultramaratonskim pothvatima - poput zahtjevnog Maratona pijeska u Saharskoj pustinji i Tenzing-Hillary Everest Maratona, jedne od najtežih trail utrka na svijetu. Zorislav i prijatelji Martin i Zlatko postali su prva trojica Hrvata u povijesti koji su uspješno istrčali ovaj legendarni maraton.'
