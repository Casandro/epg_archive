  description: "Hochwertige Livekonzerte aus den Konzertsälen aus aller Welt \n\nMDR Studiokonzert - Soundtrack meines Lebens\n\nEdvard Grieg: \"Morgenstimmung\" aus: Peer-Gynt-Suite Nr. 1 op. 46\nABBA: \"Mamma Mia\" \nWolfgang Amadeus Mozart: Divertimento für Streicher D-Dur KV 136 (= 125a) \nAnton Wilhelm von Zuccalmaglio:  \"Kein schöner Land\"\nJohann Sebastian Bach: Toccata d-Moll BWV 565 (orch. von Jakob Brenner)\nFranz Liszt: Liebestraum G-Dur (orch. von Juri Lebedev)\nDepêche Mode: Enjoy the silence  (arr. Sebastian Hensel)\nDmitri Schostakowitsch: Walzer aus der Suite für Jazzorchester Nr. 2 (orch. von Michail Jurowski)\nGiacomo Puccini: \"Nessun Dorma\" aus \"Turandot\"\nNick Kamen: I promised myself\nWir sind Helden: \"Nur ein Wort\" für Sinfonieorchester und Kinderchor (orch. von Andres Reukauf)\nModest Mussorgski:  \"Das große Tor von Kiew\" aus \"Bilder einer Ausstellung\" (orch. von Maurice Ravel)\nSergej Prokofjew: \"Die Montagues und die Capulets\" aus der Ballettsuite \"Romeo und Julia\" Nr. 2 op. 64b\nPeter Tschaikowski: Finale aus \"Schwanensee\" op. 20 (Ballett in vier Akten)\nJohn Lennon: Imagine (arr. für Kinderchor und Orchester von Felix Raffel)\n\nMDR Kinderchor \nMDR-Sinfonieorchester \nRicardo Marinello, Tenor \nDirigent: Christian Schumann\n\nModeration: Julia Menger\n\n(Aufnahme v. 09.10.2026, Leipzig, MDR-Studio)"
