  title: Quest
  description: 'V dnešním Questu se Jarda, Lukáš a Šárka vracejí ke hře, o níž mnozí nejspíš ani netušili, že si ji chtějí zahrát znovu. Assassin''s Creed IV: Black Flag se po třinácti letech dočkal přepracované verze s podtitulem Resynced, která znovu otevírá stavidla do pirátského Karibiku. A přestože se od vydání originálu herní svět v lecčems výrazně proměnil, v některých aspektech funguje stejně dobře jako tehdy. Moderují Jaromír Möwald, Šárka Tmějová a Lukáš Grygar. (repríza)'
