  description: |-
    Der Herbst-Ausflug

    Der kleine Hase und die kleine Feldmaus suchen noch ein ganz besonderes Blatt für die Herbstblätter-Sammlung der kleinen Feldmaus. Das glauben sie bei einem außergewöhnlichen Baum zu finden, der tief im Wald steht. Sie müssen also den Wald durchqueren und fürchten, vielleicht den Weg zurück zur Wiese nicht zu finden. Schließlich kann man sich im Wald leicht verlaufen. Doch der kleine Hase hat eine Idee: Wenn sie unterwegs Eicheln als Wegmarkierung auslegen, kann ihnen die Spur der Eicheln den Weg nach Hause weisen. Sie laufen bis zu dem Baum und legen unterwegs Eicheln auf ihren Weg. Die kleine Feldmaus freut sich gerade über ihr schönes, neues Blatt als die beiden Freunde Gesellschaft bekommen. Das kleine Grauhörnchen erscheint und trägt eine ganze Menge Eicheln mit sich. Die hat es unterwegs gesammelt. Seine Freude über den tollen Fund verschwindet schlagartig als klar wird, dass diese Eicheln die Wegmarkierung für den Rückweg waren. ...
    HD-Produktion
