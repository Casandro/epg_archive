    Pip und Posy wollen in ausgehöhlten und mit Gesichtern bemalten Eierschalen Kresse züchten, damit ihre kleinen Eierfreunde dann richtig tolle Haare aus Kresse haben.

    Die Kresse auf Pips Eibert wächst und gedeiht wie wild, aber auf Posys Kressy Bessy ist auch nach Tagen nur ein einziges Hälmchen zu sehen. Posy tauscht die beiden Kresseköpfchen heimlich aus und Pip ist begeistert, wie toll ihre Kresse gewachsen ist.

    Die beiden spielen mit den Eierfiguren und Pip ist schon ein wenig traurig, dass sein Eibert keine richtigen Kressehaare bekommen hat. Da gesteht ihm Posy, dass sie die Köpfchen vertauscht hat und schlägt vor, dass sie einfach wieder zurücktauschen. Pip ist jedoch ziemlich enttäuscht, dass Posy ihn hinter seinem Rücken ausgetrickst hat. Aber er kann ihr nicht lange böse sein.

    Am Ende schlägt er vor, dass sie seinem Eibert die gleiche Frisur verpassen sollen, wie Kressy Bessy. ...
