  start: 2026-10-09T13:00:00Z
  stop: 2026-10-09T13:10:00Z
  title: Süd Journal vom 8.10.2026 (Wh.)
  subtitle: Bad Aibling verhängt Haushaltsperre +++ Der Kulturförderpreis der Stadt Rosenheim für Kaffkiez +++ Ein Update zur Insolvenz von GALERIA +++ Wirtschaftsempfang der Sparkasse Traunstein
  description: 'Bad Aibling fehlen wegen schwacher Gewerbesteuer rund 3,2 Millionen Euro bei steigenden Ausgaben, daher gilt 2026 eine Haushaltssperre: Geprüft werden vor allem freiwillige Leistungen und Zuschüsse, während Verträge weiterlaufen; für 2027 drohen weitere Kürzungen. +++ Die Rosenheimer Indie-Rock-Band KAFFKIEZ wird deutschlandweit gefeiert, bleibt aber in der Heimat am beliebtesten und erhielt gestern Abend den Kulturförderpreis der Stadt Rosenheim, wie Philipp Kuffler berichtet. +++ Die Chancen für Insolvenzgeld für die 12.000 Beschäftigten der Galeria-Filialen könnten besser sein, da die Geschäftstätigkeit auf eine rechtlich eigenständige Einheit übertragen wurde, die nicht unter Planüberwachung steht. Der vorläufige Insolvenzverwalter hat die Vorfinanzierung des Insolvenzgeldes über eine Bank beantragt, um eine schnellere Auszahlung zu ermöglichen.  +++ Beim sechsten Wirtschaftsforum der Kreissparkasse Traunstein-Trostberg im k1 Traunreut stand Cyber-Sicherheit im Fokus: Referent Marco Di Filippo warnte mit Praxisbeispielen vor ständiger Hackergefahr und riet zu Sensibilisierung sowie zu neuen, einzigartigen Passwörtern.'
- eventId: 1280957
  start: 2026-10-09T13:10:00Z
  stop: 2026-10-09T13:20:00Z
  title: Süd Journal vom 8.10.2026 (Wh.)
  subtitle: Mario Kornhass ist Weltmeister +++ Mitgliederversammlung der ROSIK 2026 +++ Rauchentwicklung in der Heilig-Geist-Straße  +++ Haus für Kinder in Reichenhall eingeweiht
  description: 'Mario Kornhass verteidigte zum zweiten Mal seinen WM-Titel der World Kickboxing and Karate Union im K-1, während rund 600 Zuschauer im Festzelt zwölf Kämpfe der Kampfsportschule Kornhass gegen Gäste sahen und die erfolgreiche Fightnight erneut fürs Irschenberg-Festival gesetzt ist. +++ In Kolbermoor tagte die ROSIK, das 1999 gegründete IKT-Netzwerk mit rund 250 Mitgliedern, bei Gastgeber ACP Oberbayern, der Digitalisierung und IT-Sicherheit unterstützt und Einblicke in zukunftssichere, unabhängige IT-Infrastrukturen gab, bevor Rundgang und Imbiss den Austausch förderten. +++ In der Heilig-Geist-Straße führte ein technischer Defekt am Vormittag zu leichter Rauchentwicklung im Treppenhaus; Praxen evakuierten vorsorglich, Einsatzkräfte kontrollierten und lüfteten, Gefahr bestand nicht, verletzt wurde niemand und es entstand kein größerer Schaden. +++ Das integrative Haus für Kinder an der Zenostraße in Bad Reichenhall ist seit Mai in Betrieb und wurde nun offiziell eröffnet: Der moderne Holzbau für knapp neun Millionen Euro bietet mit vier Kindergarten- und zwei Krippengruppen Platz für bis zu 124 Ein- bis Sechsjährige.'
