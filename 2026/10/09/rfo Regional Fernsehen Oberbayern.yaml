  subtitle: Derby-Kracher im DBBL-Pokal! In der zweiten Pokalrunde empfängt der TSV 1880 Wasserburg den TS Jahn München in der heimischen Badria-Halle. Zwei bayerische Rivalen kämpfen um den Einzug ..
  description: Bayerisches Derby mit K.-o.-Charakter! In der zweiten Runde des deutschen Basketball-Pokals der Frauen empfängt der TSV 1880 Wasserburg den TS Jahn München. Für beide Mannschaften geht es um den Einzug in die nächste Pokalrunde - der Verlierer scheidet aus. Beide Teams spielen in der 2. Damen-Basketball-Bundesliga Süd und sind mit jeweils einem Sieg und einer Niederlage in die neue Saison gestartet. Während der Aufsteiger aus München auf Tabellenplatz sechs steht, belegt Wasserburg aktuell Rang neun. Die Gastgeberinnen wollen ihren Heimvorteil in der Badria-Halle nutzen und ihre Pokalreise fortsetzen. Ein spannendes bayerisches Duell, bei dem es um alles geht!
