  title: Best of ARD-Buffet
  subtitle: Schnelle Küche mit Florian Weber
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: |-
    Eine Ausgabe des Traditionsformates "Best of ARD-Buffet" mit den besten Rezepten der Saison. Florian Weber zeigt seine liebsten Schnellgerichte: Lachsmedaillons mit Apfel und Meerrettich, Tomaten-Paprika-Polenta mit grünem Salat, gebratener Reis mit grünen Bohnen und Chorizo und gedämpfter Zander mit Pak Choi und Sojasoße.
    Dazu gibt es nützliche Küchentipps im Schnellformat: Wie verarbeitet man frischen Meerrettich und was macht man mit dem Rest der langen Rübe? Wodurch unterscheiden sich Salamisorten aus aller Welt? Und seit wann gibt es überhaupt Schnellgerichte?
