  title: Beziehungskiste
  subtitle: Alle schwanger außer ich!
  description: "Ungewollte Kinderlosigkeit ist für viele Paare ein sehr schmerzhaftes Thema. \nAuch für Magali Cassar und ihren Mann. Als sie sich entscheiden, ein Baby zu bekommen, ist die Vorfreude groß. Doch das Wunschkind lässt auf sich warten. \nMonat für Monat beginnt immer wieder aufs Neue eine Achterbahnfahrt der Gefühle voller Hoffnung - und Enttäuschung.\nDoch auf dieser Achterbahnfahrt macht sie ihre stärksten Gotteserfahrungen und kommt ihrer ganz persönlichen Berufung auf die Spur. 2016 hat sie HOPE Kinderwunschzeit gegründet und leitet heute ein Netzwerk aus Kinderwunsch-Support Groups im deutschsprachigen Raum. \nBuchtipp: Hopeful. Wie ich auf mein Wunschkind wartete und Gott mir meine Berufung schenkte. Von Magali Cassar. Herder, 2020.\nhttps://www.hope-kinderwunschzeit.com/\n\nWeitere Informationen: www.hopetv.de"
  widescreen: true
  hd: true
