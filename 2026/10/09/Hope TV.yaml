  subtitle: Gesundheit ganzheitlich erleben
  description: "Jeder kennt das erleichternde Gefühl, nach einer Krankheit wieder zu Kräften gekommen zu sein.  Doch weshalb geht uns dieses leichtere Lebensgefühl leider in der Regel schnell wieder verloren? \nIn der Sendereihe \"Gesundheit erleben\" beschreiben vier Gesundheitsexperten, wie wir Symptomen in einem Zusammenwirken verschiedener Ansätze am wirksamsten begegnen können. Darüber hinaus geht es darum, wie wir uns so gesund wie möglich fühlen können und somit auch unsere Gesundheit stärken. \n\nWeitere Infos unter : www.hopetv.de"
