  title: Immanuel - Jesus folgen
  subtitle: Neu anfangen
  description: |-
    Viele Menschen wünschen sich positive Veränderung in ihrem Leben - doch die beginnt selten nur mit guten Vorsätzen.
    Biblische Geschichten erzählen von Menschen, deren Begegnung mit Jesus ihr Leben umgewandelt hat. Die Taufe erscheint dabei als sichtbarer Ausdruck einer persönlichen Entscheidung, Jesus nachzufolgen. Gleichzeitig wird deutlich, welche Rolle der Heilige Geist dabei spielt, Menschen auf ihrem Weg zu begleiten und zu verändern.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

