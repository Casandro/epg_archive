  title: Sabbat - Das Gebot der Freiheit
  subtitle: Der biblische Sabbat
  description: |-
    Warum feiern manche Christen den Samstag, andere den Sonntag? Paulin Giurgi folgt den Spuren des biblischen Ruhetages von der Schöpfung über Jesus und die ersten Christen bis zu späteren Entscheidungen in Kirche und Politik. Dabei begegnet er verbreiteten Einwänden und fragt, welche Rolle Bibel, Tradition und Vertrauen spielen. Eine sachliche Spurensuche zu einer Frage, die Christen bis heute bewegt.

