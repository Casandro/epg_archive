  title: ungeschminkt. family
  subtitle: Verbringen wir zu viel Zeit mit unseren Kindern?
  description: |-
    Eltern verbringen heute mehr Zeit mit ihren Kindern als frühere Generationen. Gleichzeitig ist der Anspruch hoch, Kinder bestmöglich zu begleiten, zu fördern und zu beschützen. Aber brauchen Kinder wirklich so viel elterliche Aufmerksamkeit? Wir sprechen darüber, woher der Druck kommt, ständig präsent zu sein, warum Loslassen so schwerfällt und wie viel Freiheit Kinder brauchen, um selbstständig und selbstbewusst zu werden.

