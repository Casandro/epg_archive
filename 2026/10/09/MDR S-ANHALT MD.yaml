  title: DER 80er-Club
  description: |-
    Die Musik der 80er drückt ein ganz besonderes Lebensgefühl aus, das sich bei unzähligen unserer Hörer fest in die Erinnerung eingebrannt hat. "MDR Sachsen-Anhalt - Mein Radio. Mein Zuhause" lässt sie wieder aufleben, diese Zeit, als Popperwelle und Vokuhila mit Action Haarspray in Form gebracht wurden. Als wir Netzhemden mit Buttons pflasterten, Neonleggins und weiße Knöchelturnschuhe dazu trugen. Die Musik zum "Mitrumtragen" kam vom Walkman.  Auf Kassetten hatte man sich die Songs aus dem Radio mitgeschnitten.

    Die Musik der 80er drückt ein ganz besonderes Lebensgefühl aus, das sich bei unzähligen unserer Hörer fest in die Erinnerung eingebrannt hat. "MDR Sachsen-Anhalt - Mein Radio. Mein Zuhause" lässt sie wieder aufleben, diese Zeit, als Popperwelle und Vokuhila mit Action Haarspray in Form gebracht wurden. Als wir Netzhemden mit Buttons pflasterten, Neonleggins und weiße Knöchelturnschuhe dazu trugen. Die Musik zum "Mitrumtragen" kam vom Walkman.  Auf Kassetten hatte man sich die Songs aus dem Radio mitgeschnitten. Unser Moderator Frank Eberlein spielt die größten Hits der 1980er-Jahre; Höhepunkte dabei: Die besondere Maxi-Single, die unsere Hörer im Laufe der Sendung voten können und Musik aus bekannten Filmen und TV-Serien der 1980er-Jahre.
