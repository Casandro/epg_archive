  description: Matea Vanjorek Show moderan je talk show koji okuplja najzanimljivije osobe iz svijeta pop kulture, prostora koji danas obuhvaća mnogo više od estrade. U opuštenoj atmosferi i kroz iskrene razgovore, Matea vanjorek sa svojim gostima otvara teme koje oblikuju suvremeni život, trendove i društvo. U emisiji gostuju glumci, glazbenici, influenseri, kreatori sadržaja, gameri, poduzetnici, sportaši, dizajneri i kreativci koji svojim radom pomiču granice i imaju što reći. Svaka epizoda donosi priče o uspjehu, izazovima, inspiraciji i životu iza reflektora, ali i pogled na aktualne teme koje obilježavaju današnju pop kulturu. Matea Vanjorek Show mjesto je susreta različitih generacija, ideja i industrija, potvrđujući da pop kultura više nije samo zabava, ona je dio svakodnevnice, poslovanja i načina na koji živimo. Emisija spaja aktualnost, autentičnost i dobre razgovore u formatu koji informira, inspirira i zabavlja.
