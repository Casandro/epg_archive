  start: 2026-10-09T19:03:00Z
  stop: 2026-10-09T20:00:00Z
  title: WDR 5 - Lies mir was vor
  subtitle: 'Ulrike Draesner: Penelope + Sasha Marianna Salzmann: Bloß nicht Japan'
  description: "<strong>Ulrike Draesner: Penelope </strong>\nDie Odysee aus der Sicht von Penelope: In ihrem Text bricht Draesner mit dem klassischen Mythos und erzählt, wie Penelope sich von Odysseus befreit und selbst auf große Reise begibt. Als Odysseus traumatisiert und brutalisiert aus dem Krieg zurückkehrt, macht sie sich zusammen mit <markup type=\"abbr\" abbreviation=\"100\" correspondent=\"einhundert\">100</markup> Frauen auf ihren eigenen Weg und sticht in See. \nVon: Ulrike Draesner <br/>Mit Ulrike Draesner <br/>BR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"11.\" correspondent=\"elften\">11.</markup> September <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> in ARD <markup type=\"language.en\">Sounds</markup>.\n<strong>Sasha Marianna Salzmann: Bloß nicht Japan</strong>\n<markup type=\"abbr\" abbreviation=\"1990\" correspondent=\"neunzehnhundertneunzig\">1990</markup> fielen die innerdeutschen Grenzen und für viele Menschen veränderte sich der Horizont, plötzlich und unerwartet. Im Zentrum von Salzmanns Geschichte steht eine Reise, die von der postsowjetischen Realität geprägt ist - unter anderem der der Hauptstadt Moskau und des berühmten Kaufhauses GUM. Der Titel ist dabei als Warnung oder Wunsch der Figuren zu verstehen, nicht in die Ferne, sondern vor den eigenen Realitäten zu fliehen.\nVon: Sasha Marianna Salzmann<br/>Mit Sasha Marianna Salzmann<br/>BR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"25.\" correspondent=\"fünfundzwanzigsten\">25.</markup> September <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
