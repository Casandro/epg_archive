  description: 'Téma: Záludnosti instantních potravin. Nutriční terapeutka Irena Šedivá. Nakoupíme, rozbalíme, vložíme do mikrovlnky a do pěti minut si už pochutnáváme, ať už jde o pizzu, guláš nebo svíčkovou. Nedostatek času často řešíme instantními polévkami, omáčkami nebo různými kašemi. Na výživovou hodnotu těchto potravin se zaměříme hodinu před polednem.'
