- eventId: 953259
  start: 2026-10-09T18:00:00Z
  stop: 2026-10-09T20:00:00Z
  title: too many tabs
  description: 'Carolin Worbs und Miguel Robitzky sind zu viel im Internet. Und meistens auch zu tief: Als Autor:innen für das ZDF Magazin Royale klicken sich die beiden von einem Fakt zum nächsten und betreten im nächtlichen Recherche-Rausch neue Welten. Inspiriert von vergessenen Dokus auf YouTube, bizarren Gerüchten auf Twitter oder Instastories gealterter Schlagerstars haben sie regelmäßig einfach zu viele Tabs geöffnet. Deshalb kommen sie ab jetzt jeden Mittwoch vor dem Mikrofon zusammen, um ihre Tabs gemeinschaftlich zu schließen - aber natürlich nicht, ohne sie noch einmal ausgiebig zu besprechen.'
