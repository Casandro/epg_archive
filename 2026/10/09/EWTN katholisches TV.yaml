  title: Alle sollen eins sein - 6. Staffel
  subtitle: 'Themen: Abtreibungspillen- Umkehr: Hilfe oder Gefahr? / "Leihmutterschaft": Keine Folgen für die Kinder?'
  description: |-
    Magazin mit Alexandra Linder

    Abtreibungspillen-Umkehr: Frauen im SchwangerschaBskonflikt, die die Abtreibungspille eingenommen haben und das bereuen, suchen nach einer Möglichkeit, den begonnenen Abtreibungsprozess rückgängig machen zu können. Dies ist grundsätzlich möglich.

    Leihmutterschaft: Wenn von vornherein absichtlich und geplant eine Familienkonstellation ausgesucht wird, die für das Kind nachteiliger sein kann als eine natürliche Schwangerschaft und das Aufwachsen in der eigenen Familie, werden die Wünsche von Erwachsenen über das Kindeswohl, über die seelische und körperliche Gesundheit und über die Rechte des Kindes gestellt. Damit ist die sogenannte "Leihmutterschaft" nicht nur eine Ausbeutung von Frauen, sondern auch eine Verzweckung von Kindern und sollte weltweit in jeder Form verboten werden.

    "Perspektive Leben" informiert kompakt und kompetent über die relevanten bioethischen Fragen und Themen unserer Zeit.
  widescreen: true
