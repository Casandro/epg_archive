  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Ein Weinberg der Toten - Vom vierten Geheimnis des glorreichen Rosenkranzes
  description: Die leibliche Aufnahme Mariens in den Himmel wurde am 1. November 1950 von Papst Pius XII. feierlich zum Dogma erklärt. Das war nur möglich, weil sich die ganze katholische Kirche darüber einig war. In der Bibel wird die Aufnahme Mariens in den Himmel nicht erwähnt, aber die Orte der Entschlafung Mariens auf dem Zion und ihrer Grablegung im Garten Gethsemani sind durch Ortstraditionen und Berichte belegt. Paul Badde folgt diesen Spuren im Heiligen Land.
  widescreen: true
