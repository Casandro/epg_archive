  title: Katholizismus
  subtitle: Die Kirche - der Mystische Leib Christi
  description: In seiner klaren Antwort auf die Frage 'Was ist die Kirche?' stellt Bischof Barron die Realität der Kirche als die 'eine, heilige, katholische und apostolische Kirche' dar, wie sie das Nizänischen Glaubensbekenntnis bekennt. Der Leib Christi ist überall auf der Welt sichtbar. Und dennoch entzieht er sich dem vollständigen Verständnis als die mystische Vereinigung zwischen Christus und seiner Kirche.
  widescreen: true
- eventId: 1412216
  start: 2026-10-09T01:30:00Z
  stop: 2026-10-09T02:00:00Z
  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Ein Weinberg der Toten - Vom vierten Geheimnis des glorreichen Rosenkranzes
  description: Die leibliche Aufnahme Mariens in den Himmel wurde am 1. November 1950 von Papst Pius XII. feierlich zum Dogma erklärt. Das war nur möglich, weil sich die ganze katholische Kirche darüber einig war. In der Bibel wird die Aufnahme Mariens in den Himmel nicht erwähnt, aber die Orte der Entschlafung Mariens auf dem Zion und ihrer Grablegung im Garten Gethsemani sind durch Ortstraditionen und Berichte belegt. Paul Badde folgt diesen Spuren im Heiligen Land.
  widescreen: true
- eventId: 1412217
  start: 2026-10-09T02:00:00Z
  stop: 2026-10-09T02:30:00Z
  title: Maria - Zwischen Himmel und Erde
  subtitle: Alle Christen sind "Miterlöser"
  description: In der 13. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup darüber, inwiefern alle Christen "Miterlöser" sind. Auf dem Konzil fand 1964 eine Abstimmung statt. Etwa 1050 Väter waren gegen eine eigene Mariologie, etwa 1000 dafür. Ratzinger hat wohl zurecht von einem Kollaps der Marienverehrung gesprochen. Aber man kann in dem Entscheid auch einen Wink des Heiligen Geistes sehen für die Miterlösung Mariens, aber nicht im Gegensatz zu allen Gläubigen, sondern ekklesiologisch eingebettet in der allgemeinen Berufung zur Heiligkeit in der Kirche.
  widescreen: true
