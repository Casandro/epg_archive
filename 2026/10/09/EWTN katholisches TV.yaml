  title: Katholizismus
  subtitle: Die Kirche - der Mystische Leib Christi
  description: In seiner klaren Antwort auf die Frage 'Was ist die Kirche?' stellt Bischof Barron die Realität der Kirche als die 'eine, heilige, katholische und apostolische Kirche' dar, wie sie das Nizänischen Glaubensbekenntnis bekennt. Der Leib Christi ist überall auf der Welt sichtbar. Und dennoch entzieht er sich dem vollständigen Verständnis als die mystische Vereinigung zwischen Christus und seiner Kirche.
