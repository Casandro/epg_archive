  title: Kirche in Not - Thema
  subtitle: Was ist unsere Identität als Christen?
  description: |-
    Mit Dr. Ricardo Febres Landauro, Missionar bei "Feuerstrom", Portal für Mission und Jüngerschaft

    Im Zentrum des christlichen Glaubens steht keine Idee und kein Regelwerk, sondern eine Person: Jesus Christus. Wer ihm nachfolgt, gewinnt eine Identität, die trägt und Orientierung schenkt - auch in einer Zeit voller Unsicherheiten und Anfechtungen. Wie dieses christliche Selbstverständnis heute gelebt werden kann, erläutert der Arzt und Missionar Dr. Ricardo Febres Landauro in seinem Vortrag.
