  description: Warum beteiligen sich Frauen an den Verbrechen organisierter Kriminalität? Welche Rolle spielen sie dabei? Investigativ-Reporter Thilo Mischke trifft Frauen, die in den männerdominierten Welten der mexikanischen Kartelle und der italienischen Mafia ihren Platz gefunden haben. Eine Waffenhändlerin, eine Auftragsmörderin und zwei verurteilte Mafiosas gewähren Einblicke in ihren kriminellen Alltag, erzählen von den Gefahren, denen sie sich aussetzen, und ihren brutalen Verbrechen.
