    Reportage, D 2023
    Altersfreigabe: ab 12
  description: 4.000 verschwundene oder ermordete Frauen in den letzten Jahrzehnten. Eine Gewaltserie an indigenen Frauen erschüttert Kanada. Thilo Mischke begibt sich für "UNCOVERED." auf die Spuren der vermissten Ureinwohnerinnen. Dabei bekommt der Investigativ-Reporter seltene Einblicke in die Kolonialgeschichte des Landes. Und erfährt auch, warum Kanadas Vergangenheit die Gesellschaft bis heute tief spaltet und warum besonders indigene Frauen darunter leiden müssen.
