  subtitle: 'Border Patrol Südamerika: Das Risiko reist mit'
  description: Eine junge Frau auf dem Weg nach Europa gerät ins Visier der Anti-Drogen-Einheit - ihre unvorbereitete Reise und ein manipulierter Koffer wecken Verdacht. Zeitgleich kehrt eine aus den USA abgeschobene Chilenin zurück, doch ihre Heimkehr nimmt eine unerwartete Wendung. Und ein brasilianischer Passagier sorgt mit gefundenen Patronen für einen gefährlichen Zwischenfall.
