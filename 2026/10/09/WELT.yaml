  title: 'Border Patrol Südamerika: Der doppelte Boden'
  subtitle: 'Border Patrol Südamerika: Der doppelte Boden'
  description: 'Am Flughafen von Santiago de Chile stoßen die Beamten auf rätselhafte Fälle: Ein Tourist aus Kolumbien verhält sich auffällig, und eine unscheinbar schwere Tasche offenbart ein brisantes Geheimnis. Kurz darauf sorgt ein zehnjähriger Junge mit einer gefundenen Patrone für Aufsehen - und Tränen. Währenddessen entdeckt die Frachtkontrolle ein verdächtiges Paket mit seltsamer Flüssigkeit.'
  widescreen: true
- eventId: 1523997
  start: 2026-10-09T18:36:00Z
  stop: 2026-10-09T19:05:00Z
  title: 'Border Patrol Südamerika: Auf Krawall gebürstet'
  subtitle: 'Border Patrol Südamerika: Auf Krawall gebürstet'
  description: 'Am Flughafen von Santiago de Chile stehen die Grenzschützer vor gleich mehreren Herausforderungen: Ein Haitianer verliert die Fassung, als ihm wegen fehlender Visa der Weiterflug verweigert wird. Zeitgleich sorgt eine verdächtige Lieferung aus Mexiko für Alarm bei der Zollkontrolle, und zwei junge Reisende geraten ins Visier der Sicherheitskameras, als sie ein Souvenir entwenden wollen. Drei Situationen, die zeigen, wie schnell Routine zur Bewährungsprobe wird.'
  widescreen: true
