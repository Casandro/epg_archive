  title: Na pěknú notečku
  description: Slova z Podkrkonoší, Hané i Slovácka. Dnešní pořad nás hudebně, ale výjimečně také nářečními ukázky zavede do Podkrkonoší, poslechneme si hanáckou Čuháčtinu a veselo bude i se slováckým stařečkem Pagáčem. Hraje Brněnský rozhlasový orchestr lidových nástrojů s primášem Jindřichem Hovorkou. Pořad připravil Jaroslav Kneisl a slovem provází Markéta Ševčíková.
