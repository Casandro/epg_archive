  title: Noord-Zuid-Oost-West
  subtitle: 'Margreet - 80 Prachtig! - Route C S06 E161. Margreet: het azc in Leersum. 80 Prachtig!: Henk Stok (83) werkt als vrijwilliger in de stallen van een concours hippique. Route C: Marc Geelen is een van de laatste trompetbouwers.'
  description: 'In Margreet: er gaat geen dag voorbij of er is nieuws over een azc, maar wat gebeurt er nou eigenlijk echt in een asielzoekerscentrum? Het azc in Leersum is het oudste asielzoekerscentrum van de provincie Utrecht. Er wonen ruim 500 mensen. Hoe houd je zo''n "dorp in een dorp" leefbaar voor iedereen? 80 Prachtig! vertelt het verhaal van 80''ers die zich niet laten weerhouden door hun leeftijd om te doen wat ze willen doen. Henk Stok (83) werkt als vrijwilliger in de stallen van het concours hippique-evenement De Wolden in Veeningen. Deze keer in het cultuurmagazine Route C: Marc Geelen is een van de laatste trompetbouwers. (2026)'
  genre:
