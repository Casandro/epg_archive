  description: Expert Martijn Akkerman krijgt een juweel te zien dat hij herkent als een ontwerp van Bert Nienhuis. Martijn bezoekt huizen in Amsterdam-Zuid, waar tegels van Nienhuis aan de buitenkant te zien zijn. Tevens gaat hij naar het Rijksmuseum, waar conservator juwelen Suzanne van Leeuwen erg verheugd is deze broche te zien. In het museum zijn colliers en broches van Nienhuis aanwezig en deze toont zij aan Martijn. (2024)
