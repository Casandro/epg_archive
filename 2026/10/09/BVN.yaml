  description: Midden in Haarlem huurt Iris een monumentaal huis uit 1608. In dit pand met prachtige trapgevel woont Iris met haar vriend en zoontje. * Chef-kok Geneal maakt een heerlijk couscous gerecht met krokante courgette, paprikasaus en als topping kaas kletskoppen. * In de regeneratieve tuin van Luc en Joey groeien onbespoten groenten en bloemen. Het duo laat de tuin meegaan in het ritme van de natuur. * Kunstkenner Suzanne Swarts bezoekt de studio van Simone Post in Rotterdam. Ze maakt kunst met en van restpartijen textiel die anders weggegooid zouden worden. Ook is Simone bekend van haar snoepkunst waarmee ze internationaal exposeert. (2026)
