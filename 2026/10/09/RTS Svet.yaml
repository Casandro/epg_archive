  title: Vi i mi
  subtitle: 'Veštačka inteligencija danas stoji na raskrsnici između najveće tehnološke revolucije u istoriji i jednog od najvećih izazova za čovečanstvo: dok jedni u njoj vide alat koji će lečiti bolesti,.'
  description: 'Veštačka inteligencija danas stoji na raskrsnici između najveće tehnološke revolucije u istoriji i jednog od najvećih izazova za čovečanstvo: dok jedni u njoj vide alat koji će lečiti bolesti, ubrzati razvoj nauke i olakšati svakodnevni život, drugi upozoravaju na gubitak poslova, etičke dileme i rizike koje još uvek ne razumemo niti možemo da zamislimo u potpunosti. Gde smo tu mi? Kuda ide ovaj svet? Treba li da se radujemo ili da strahujemo? Pitali smo eksperte iz različitih oblasti koji u svom svakodnevnom radu upotrebljavaju ovu tehnologiju ili se bave razvojem veštačke inteligencije.'
