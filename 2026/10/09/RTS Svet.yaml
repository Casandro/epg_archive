  subtitle: Na poziv Malteško srpske zajednice koju predvodi dr Predrag Andrejević, ekipa Programa za dijasporu posetila je tokom leta ovo mediteransko ostrvo i družila se sa našim ljudima koji ovde žive.
  description: Na poziv Malteško srpske zajednice koju predvodi dr Predrag Andrejević, ekipa Programa za dijasporu posetila je tokom leta ovo mediteransko ostrvo i družila se sa našim ljudima koji ovde žive. Valeta Malta je ostrvo u središtu Mediterana, na raskršću puteva između Evrope, Afrike i Bliskog istoka. To je zemlja u kojoj kontrasti žive u neobičnoj harmoniji. Filozofi bi rekli - dijalektika, jer raznolikost čini srž malteškog identiteta. Uočljiva je na svakom koraku, kroz arhitekturu, saobraćaj, kulturna obeležja, duboku religioznost, a pre svega kroz melodiju i pismo neobičnog jezika. Njegova istorija svedoči o burnim smenama imperija u ovom delu Evrope. Naš domaćin, dr Predrag Andrejević jedan je od vodećih stručnjaka na Malti. Tamo je osnovao Internacionalnu hiruršku školu i uveo moderne metode lečenja gojaznosti, a u rodnom Leskovcu godinama obučava kolege i donosi najsavremeniju opremu, čime je značajno podigao kvalitet lečenja u Jablaničkom okrugu. Predrag i Hermion Andrejević...
