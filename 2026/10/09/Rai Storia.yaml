  title: Rai FVG Il medico del Vajont
  subtitle: Sono passati 62 anni dalla terribile notte del 9 Ottobre del 1963, che ha segnato per sempre un'intera area del Nord Est e l'Italia intera, ammutolita di fronte alle immagini desolanti provenienti da Longarone, Erto e
  description: "Casso. Il disastro, di matrice umana, viene ricostruito a partire dai ricordi di alcuni testimoni e grazie a un folto materiale di archivio, per rendere un doveroso omaggio alle tante - troppe - vittime innocenti e restituire alle giovani generazioni la conoscenza di un evento spesso e a lungo dimenticato. Il racconto del Vajont di ieri viene poi sfumato per dare il giusto rilievo al Vajont attuale, abitato - oggi come allora - da persone semplici e fiere, avvezze alle scomodità e all'oblio spesso riservato alle genti di montagna. Da qualche tempo, tuttavia, una figura atipica è sopraggiunta a fornire l'ascolto e il sostegno sovente mancati: un medico di base dalla vita singolare che in tarda età ha cercato - e trovato - il suo riscatto personale proprio nel servizio reso negli ambulatori del Vajont e della Valcellina. - \n\ndi Silvia Rossetto"
