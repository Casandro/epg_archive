  title: 'Zurück zu Dir: Er hielt es für einen Keks. Dann saß er die halbe NACHT davor'
  subtitle: Gespräch
  description: Für Sascha war die Hostie nur ein Stück Brot. Als Kind hatte er aufgehört, an Gott zu glauben, mit etwa 20 trat er aus der Kirche aus, Jahre später ließ er sich in einer Freikirche taufen.Er erzählt, wie zwei Straßenevangelisten für ihn beteten, warum er vier Jahre lang Regeln hinterherrannte und Jesus ihm doch fern blieb, und weshalb man ihm ausgerechnet in der katholischen Kirche sagte, es sei egal, ob er katholisch wird.Eines Abends sprach er vor dem Einschlafen ein kurzes Gebet. Um 1:44 Uhr war er plötzlich hellwach. Was dann passierte, veränderte sein ganzes Leben.
