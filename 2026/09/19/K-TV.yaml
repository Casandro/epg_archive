  title: Hochsensibilität (Folge 4)
  subtitle: Spiritualität
  description: Hochsensibilität ist eine Gabe - für sich selbst und für die anderen. Doch gilt es zu lernen, gut mit dieser umzugehen. Die Unterscheidung der Geister und der Bezug zum lebendigen Gott ist gerade bei hochsensiblen Menschen entscheidend, da der Grad der persönlichen Komfortzone schmäler als bei anderen ist und sie daher leichter angreifbar sind. In dieser Vortragsreihe setzen wir uns mit Stärken und Herausforderungen dieses Wesenszuges auseinander und erfahren wertvolle Einsichten und Hilfestellungen. Ezerzitien mit Mag. Dr. Reinhard Pichler (Theologe und Psychotherapeut). Aufgezeichnt im Juni 2026, Haus St. Ulrich in Hochaltingen.
