  title: 'ROM: Das Römische Pilgerwerk'
  subtitle: Gespräch
  description: Rom. Sehen - Verstehen - LiebenDas Römische Pilgerwerk (ital. Opera Romana Pellegrinaggi) ist das Pilgerbüro des Vatikans. Es wurde 1933 von Papst Pius XI. ins Leben gerufen, um den Tourismus und Wallfahrten für die Evangelisierung zu nutzen. Das Büro organisiert vor allem Pilgerreisen zu bedeutenden christlichen Zielorten wie Lourdes, Fatima, Santiago de Compostela, Tschenstochau, dem Heiligen Land und vielen weiteren wichtigen Stätten.
- eventId: 938545
  start: 2026-09-19T10:30:00Z
  stop: 2026-09-19T11:00:00Z
  title: Kuba - Missionar auf Kuba
  subtitle: Dokumentation
  description: Ein Missionar, der sich für minderjährige Prostituierte auf den Philippinen einsetzt, ein anderer der für die Rechte der Urbevölkerung einer Insel im Pazifik kämpft, ein weiterer, der Asylbewerbern in Deutschland Kirchenasyl gewährt. Begleitet wurden sie und viele andere Steyler Missionare durch das Kamerateam von steyl medien - auf allen Kontinenten dieser Welt. Dabei entstanden die mittlerweile über 50 Episoden der Serie "grenzenlos'.
