  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nFrüher testen, gezielter fördern - was brauchen Kinder vor der Schule?\n\nIn Campus & Karriere fragen wir: Wie spielerisch oder wie verschult sollte frühkindliche Förderung sein? Was sollte eine Kita neben Betreuung an Bildung und Förderung leisten? Und welche Rahmenbedingungen braucht sie dafür? Welche Erfahrungen machen Sie als Eltern oder Fachkräfte? \n\nGäste:\nProf. Dr. Renate Zimmer, Erziehungswissenschaftlerin und Expertin für frühkindliche Bildung und Sprachförderung \nStefan Spieker, Vorsitzender des Vorstands des Fröbel e.V., Geschäftsführer der Fröbel Bildung und Erziehung gGmbH\nAyten Teke, Abteilungsleiterin und Förderkoordinatorin an der Schule Wielandstraße in Hamburg-Eilbek\nAm Mikrofon: Regina Brinkmann \n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de \nWhatsApp 0173 - 535 8089"
