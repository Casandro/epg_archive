  title: Corso - Kunst & Pop
  description: "Das Musikmagazin\n\nSister*Queens - das feministische Rap-Kollektiv wird 10 Jahre alt\nIn Workshops und auf Veranstaltungen gibt das Kollektiv Sister*Queens um Künstlerinnen wir Haszcara oder Ebow Mädchen, Frauen und queeren Personen im Rap eine Stimme. Ein Gespräch über Fortschritte in der Szene und das zwiespältige Genre Female Rap\nHaszcara im Gespräch mit Mike Herbstreuth\n \nSchwermut und Theatralik - der romantische Pop von Nachtkinder\nDie Band Nachtkinder aus Nürnberg blasen Emotionen überlebensgroß auf - mit einem Sound, der auf der neuen EP ?Viel zu ernst? zwischen Tears For Fears, Joy Division und The Smiths pendelt. \nNoah Friebel im Gespräch mit Mike Herbstreuth\n \nDie schwierigen Zwanziger - der rohe Pop von LEILA\nManche kriegen Kinder, manche kaufen Autos, manche ziehen in eigene Wohnungen - die Schweizer Musikerin LEILA steckt mit Mitte Zwanzig dagegen irgendwie fest. Dieses Gefühl verarbeitet sie auf ihrem Album ?Twenty Something? mit punkigem Pop.\nLeila Surkovic im Gespräch mit Mike Herbstreuth \n\nAm Mikrofon: Mike Herbstreuth"
