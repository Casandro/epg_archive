  title: Auf Streife
  subtitle: |-
    Schlechtes Versteck
    Scripted Reality, D 2015
    Altersfreigabe: ab 12
  description: Eine Hausfrau stürzt mit ihrem Fahrrad, weil ein Gulli offenliegt. Ein 19-Jähriger sitzt über sie gebeugt neben ihr. Hat er etwas mit dem geöffneten Gulli zu tun? - Ein Betreiber einer Badeanlage entdeckt ein Pärchen beim Sex und schlägt sofort Alarm. Als die Polizei den Sachverhalt aufklärt, entdeckt die Beschuldigte einen Spanner mit Kamera im Gebüsch. - Ein 40-Jähriger verhält sich wie ein wildgewordener Hund und verletzt dabei die Passanten vor einem Bekleidungsgeschäft.
  widescreen: true
- eventId: 988515
  start: 2026-09-19T10:01:05Z
  stop: 2026-09-19T10:58:50Z
  title: Richter Alexander Hold
  subtitle: |-
    Der Tote im Abbruchhaus
    Gerichtsshow, D 2007
    Altersfreigabe: ab 12
  description: 'Heute sitzt der 18-jährige Sebastian auf der Anklagebank, der mit seiner Clique in einem Abbruchhaus lebt. Er soll den Elektroladen seines verhassten Bruders ausgeraubt haben. Und nicht nur das: Sebastian soll kurz darauf seinen angeblichen Komplizen Axel im Streit um ein Mädchen totgeschlagen haben. Ist Sebastian zu so etwas fähig? Oder gibt es wirklich den mysteriösen Jungen namens "Joe", auf den er die Taten schiebt?'
- eventId: 988516
  start: 2026-09-19T10:59:34Z
  stop: 2026-09-19T11:58:09Z
  title: Richter Alexander Hold
  subtitle: |-
    Richter Alexander Hold
    Gerichtsshow, D 2007
    Altersfreigabe: ab 12
    (WH vom Montag, 14.09.2026, 11:00 Uhr)
  description: Natalie Bierwald ist angeklagt, die Geliebte ihres Mannes erschossen zu haben. Hat wirklich die eifersüchtige Ehefrau den Mord an Bärbel Hacker begangen oder war es vielleicht ein guter Freund des Opfers, der sie vor zwei Jahren maskiert vergewaltigt haben soll? Hat Bärbel kurz vor ihrem Tod herausgefunden, wer sich damals an ihr vergangen hat und den Täter zur Rede gestellt?
- eventId: 988517
  start: 2026-09-19T11:58:36Z
  stop: 2026-09-19T12:57:23Z
  title: Richter Alexander Hold
  subtitle: |-
    Richter Alexander Hold
    Gerichtsshow, D 2007
    Altersfreigabe: ab 12
    (WH vom Montag, 14.09.2026, 11:55 Uhr)
  description: Inszenierter Einbruch oder vertuschter Mord? Sonja soll in die Wohnung von Lilly eingebrochen sein und ihr unter anderem ihren Anrufbeantworter gestohlen haben. Lilly vermutet, dass auf dem AB eine Nachricht sein könnte, die den mysteriösen Tod ihrer besten Freundin Astrid aufklären könnte. Oder macht Lilly Sonja aus Rache zum Sündenbock für einen Einbruch, den sie in Wahrheit selber inszeniert hat, weil sie Geld von der Versicherung wollte?
