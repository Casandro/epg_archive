    Gerichtsshow, D 2007
    Altersfreigabe: ab 12
    (WH vom Montag, 14.09.2026, 12:55 Uhr)
  description: Phillip Mertens soll zwei Wochen lang das Haus der Familie Köcke observiert haben, um schließlich dort einzubrechen. Während er sich gerade im Wohnzimmer zu schaffen machte, wurde er von Simone Köcke überrascht. Um Zeit für die Flucht zu gewinnen, soll Phillip Mertens sie in einen Glastisch gestoßen haben, wobei sie sich schwere Schnittverletzungen zuzog. War Phillip Mertens lediglich an den Wertgegenständen der Köckes interessiert?
