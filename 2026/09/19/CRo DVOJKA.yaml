  title: Úžasné životy
  description: 'Radoslav Brzobohatý podle Jiřího Adamce. Charismatický herec Radoslav Brzobohatý patřil k hvězdám jeviště, filmového plátna i televizních obrazovek od 60. let. Režisér Jiří Adamec obsadil Radoslava Brzobohatého ve svých seriálech Rodáci, Dlouhá míle nebo v televizní inscenaci Klec. Kdyby mohl vrátit čas, viděl by ho rád v roli Shakespearova Romea nebo Hamleta. V Úžasných životech na něj vzpomíná jako na báječného muže silného charakteru, profesionála a skvělého kamaráda. Autorka: Lenka Nechvátalová. Repríza.'
