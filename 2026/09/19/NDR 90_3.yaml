- eventId: 546861
  start: 2026-09-19T16:00:00Z
  stop: 2026-09-19T19:00:00Z
  title: Die Songs unseres Lebens
  subtitle: Mit Andreas Kuhnt
  description: |-
    Übernahme von NDR 1 Niedersachsen

    Die großen Hits der 80er-Jahre stehen im Mittelpunkt dieser Stunden.
    Irgendwo zwischen 70er-Disco und 90er-Techno ist dieses Jahrzehnt musikalisch verortet. Mit ganz neuen Klängen und Soundelementen war die Zeit der Schulterpolster und Löwenmähnen ein aufregendes Jahrzehnt. NDR 1 Welle Nord, NDR 1 Niedersachsen und NDR 90,3 widmen den Samstagabend in erster Linie dieser Dekade. Die Moderatorinnen und Moderatoren präsentieren die großen Hits der Achtziger und erinnern an die eine und andere in Vergessenheit geratene Perle aus jenen Jahren.
