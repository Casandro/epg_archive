  title: Traumhäuser von Innen
  subtitle: Traumhäuser von Innen - Gründerzeitvilla oder ungewöhnlicher Umbau
  description: Wer die Villa Charlotte in Bad Harzburg betritt, findet sich plötzlich in der Gründerzeit wieder. Hohe Decken, schwere Möbel, glitzernde Leuchter, jedes Detail wirkt, als sei es einer alten Fotografie entsprungen. Doch was aussieht wie ein Museum, ist das Zuhause von Michael und seinem Mann Sven.
