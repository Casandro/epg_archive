  title: 'Die Nordreportage: Wohnturm mit Meerblick'
  subtitle: Hausmeister im höchsten Wohnhaus von M-V
  description: 'Martin Lange ist Hausmeister in Rostock. Hier, in Mecklenburg-Vorpommerns höchstem Wohnhaus, ist er täglich auf 23 Etagen der "Ordnungshüter vom Dienst", aber auch Moderator zwischen Rentnern und Studenten-WG, Nothelfer bei zugefallenen Türen und Stau-Logistiker von Paketdienst bis Umzugs-LKW. Wer hat das schon: Einen Arbeitsplatz mit Ausblick zur Ostsee in rund 80 Metern Höhe? Der Film folgt Martin Lange bis aufs Dach des "Windmühlen"-Hochhauses in Rostock.'
