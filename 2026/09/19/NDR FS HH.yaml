  title: Kaum zu glauben! XXL
  subtitle: 'Moderation: Kai Pflaume'
  description: 'Es gibt Entdeckungen, Rekorde und Sensationen, die einfach nur unglaublich sind! Und dann gehören sie in diese Sendung. Kai Pflaume präsentiert in einer großen XXL-Ausgabe wieder eine bunte Mischung aus Alltäglichem, medizinischen Sensationen oder einfach nur Geschichten von Mut und Wagnis, die beim Ratepanel zu Kopfzerbrechen und bei Publikum und Zuschauern zu größtem Vergnügen führt. Im Ratepanel sind dabei: Bernhard Hoëcker, Hubertus Meyer-Burckhardt, Stephanie Stumph und Wincent Weiss.'
