  title: die nordstory Spezial - MV von oben
  subtitle: Zwischen Wind und Wellen
  description: 'Mecklenburg-Vorpommern: flaches Land, weiter Blick, beeindruckende Natur, Idylle, Ruhe und fast 2.000 Kilometer zum Teil schroffe Küstenlinie. Im Landesinneren erstrecken sich weite grüne Felder und sanfte Hügel und immer wieder auch Landschaften, die man hier im Norden nicht erwarten würde. "die nordstory" trifft Menschen, die hier gern leben und arbeiten. Und man erlebt sie alle aus einer völlig ungewöhnlichen Perspektive: Mecklenburg-Vorpommern von oben.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
