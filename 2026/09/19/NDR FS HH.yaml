  title: Unterwegs auf der Luftlinie
  subtitle: Zwischen Warnemünde und Binz
  description: 'Sie kennen das Ziel, aber der Weg dahin wird ein Abenteuer, bei dem der Zufall die Regie führt. Die Reporter Vanessa Kossen und Thilo Tautz machen sich zu Fuß auf den Weg: 100 Kilometer durch Mecklenburg-Vorpommern abseits ausgetretener Pfade. Konsequent eine Luftlinie zu laufen ohne Geld und Zelt, immer schnurstracks geradeaus, wie soll das funktionieren? Thilo Tautz startet in Binz, Vanessa Kossen in Warnemünde, ihr Ziel: Bussin bei Velgast.'
