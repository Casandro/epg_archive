  title: Velká pohádka
  description: 'Kolo se zlatými ráfky. Kdo se rád diví, ať se s námi vydá do divného království. Je šlapací a tiché a nikdo v něm nesmí nahlas říct, co si myslí, jinak ho čeká vězení. Seznámíme se elektrikářem Karlem i s princeznou Bohunkou, která pravidelně jezdí na svém kole se zlatými ráfky na hodiny tichého zpěvu. Jak se osudy Karla a Bohunky prolnou? A jakou změnou projde tiché šlapací království a proč? Napsal: Zdeněk Svěrák. Režie: Karel Weinlich. Účinkují: Josef Kemr, Boris Rösner, Jiří Langmajer ml. a další.'
