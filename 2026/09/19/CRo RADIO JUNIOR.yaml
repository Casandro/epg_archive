  title: Velká pohádka
  description: 'Putování za švestkovou vůní. Dobrodružný příběh plný vtipu vypráví o dlouhém putování skřítka Pitrýska, který se vydal do světa hledat spřízněnou duši. Na motivy známé pohádkové knihy Ludvíka Aškenazyho napsala Kristýna Kosová a Adam Svozil. Režie: Kristýna Kosová a Adam Svozil. Hrají: Eva Hacurová, Nataša Mikulová, Dita Kaplanová, Miloslav König, Jan Hájek, Miroslav Hanuš a další.'
