  title: Hajaja
  description: Bleší pohádky 6/7 - Meda a Rouzí. Bylo nebylo pět kamarádů, kteří nebyli větší než blechy. No, ony to vlastně byly blechy. Spokojeně se vozily v kožíšku malého voříška a vypadalo to, že je nic nerozdělí. Jenže pak si pejsek našel nové paničky a bleší pětku čeká stěhování. Sedm veselých příhod, ve kterých spolu s bleškami seznámíme s nejrůznějšími psy a jejich lidmi. Napsala Markéta Nekolová. Dramaturgie a režie Renata Venclová. Natočeno v roce 2026. Vypráví Michal Bednář. PREMIÉRA.
