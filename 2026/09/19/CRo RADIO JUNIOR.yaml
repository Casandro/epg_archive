  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Hosté: Marek, Kateřina a Tomáš Ždánští. Naši známí cestovatelé tentokrát nejeli do tepla Afriky za gorilami, ale rozhodli se trochu zchladit na Aljašce. Jenomže bez zvířat to nepůjde. Marek, Káťa a Tomáš se vypravili pozorovat medvědy a do Rádia Junior přijedou se svými zážitky skoro rovnou z letiště. Repríza pořadu.'
