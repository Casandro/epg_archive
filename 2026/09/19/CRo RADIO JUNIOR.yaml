  title: Velká pohádka
  description: 'Princezna z nejlepšího království. Pohádka o princezně Anně, která podnikne složitou cestu, aby získala zkušenosti pro svou vladařskou budoucnost. Napsal: Marek Horoščák. Režie: Lukáš Kopecký. Účinkují: Barbora Goldmannová, Michal Bumbálek, Jana Kaločová, Zdeněk Trčálek a další.'
