  title: Bayern 1 Heute im Stadion
  subtitle: Mit Philipp Eger
  description: "Die Bayern 1 Bundesligashow - Kult!\nGeballte Fußballkompetenz und jede Menge Leidenschaft - Moderator Philipp Eger trägt sein Fußballherz auf der Zunge.\nUnsere Bayern 1 Reporterinnen und Reporter berichten live für Sie aus den Stadien in ganz Deutschland. Natürlich auch immer mit Blick auf die Bundesliga der Frauen und die bayerischen Mannschaften in der 2. und 3. Liga.\nExperteninterviews und Stimmen aus den Stadien runden den Bayern 1 Fußballsamstag ab.\nWerden Sie ein Teil von Heute im Stadion. Tippen Sie gegen einen Promi im Bayern 1 Kicktipp:\nhttps://www.br.de/radio/bayern1/sendungen/heute-im-stadion/kick-tipp/index.html \n\nBundesliga, 4. Spieltag\nWerder Bremen - FC Augsburg   \nHamburger SV - 1. FC Köln    \nEintracht Frankfurt - SC Freiburg   \nBorussia Mönchengladbach - 1. FSV Mainz 05  \n\n2. Bundesliga, 6. Spieltag\nKarlsruher SC - 1. FC Nürnberg \n\n3. Liga, 6. Spieltag\nVfB Stuttgart II - Jahn Regensburg\nFC Viktoria Köln - FC Ingolstadt 04\n\nHalbzeitgespräch mit Andreas Retiig, ehemaliger Fußballspieler und seit September 2023 DFB-Geschäftsführer Sport.\n\n16.00 Nachrichten, Wetter, Verkehr"
