  description: |-
    Sébastien Tellier : Many Lives Doc Portrait  De son premier album sorti du fin fond de son âme et composé dans une chambre de bonne jusqu'à son passage à l'Eurovision, de ses premières apparitions scéniques en clochard céleste à ses récentes postures bling bling décomplexées, Sébastien Tellier n'a cessé de surprendre, dérouter, déranger, sans pour autant s'éloigner de l'essentiel : l'authenticité toujours renouvelée de son univers musical qui, vingt ans après, reste l'un des plus forts de la scène pop contemporaine.

