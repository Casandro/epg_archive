  title: Archivschätze
  subtitle: Gespräche am Schreibtisch - Max Frisch und Friedrich Dürrenmatt
  description: Eine Terrasse in Rom, getrunken wurde Campari und Whisky. Für seine Interviewreihe "Gespräche am Schreibtisch" besuchte Horst Bienek im Mai 1961 Max Frisch in Rom und kurz später Friedrich Dürrenmatt in seinem Arbeitszimmer in Neuchâtel. Horst Bienek (1930-1990) war selbst Schriftsteller und ab 1957 als Literaturredakteur für den Hessischen Rundfunk tätig. Seine Interviews faszinieren deshalb, weil er den Interviewten sehr nahe kommt.
