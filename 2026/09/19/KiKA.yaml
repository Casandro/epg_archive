  title: Peter Pan - Neue Abenteuer
  subtitle: Die Nimmerland-Prophezeiung
  description: |-
    Die Nimmerland-Prophezeiung (1)

    Michael ist beleidigt und verzieht sich in den Wald. Dort trifft er auf Sienna, die Hook eine Schrifttafel geklaut hat. Um den Text zu übersetzen, braucht sie das Große Buch. Michael holt es ihr.

    Auf der Tafel steht die Geschichte des schrecklichen Barrum, der vor Urzeiten über Nimmerland geherrscht hat, bis ihn die Altvorderen in einer Muschel gefangen setzten. Wer die Muschel findet und Barrum aufweckt, soll dessen Macht erhalten.

    Auf diese Macht sind Sienna und Hook aus. Peter, John und Wendy, denen Michael die Geschichte erzählt hat, wollen dafür sorgen, dass Barrum nicht geweckt wird. Alle landen bei Pick, dem Wächter der Höhle, in der die Muschel sein soll. Pik freut sich, endlich Besuch zu bekommen und veranstaltet mit ihnen verschiedene Wettbewerbe. Beim letzten Wettbewerb dürfen die Kandidaten nacheinander eine Muschel aussuchen. Alle denken, dass in einer von ihnen Barrum ist. Sienna, die als erste wählen darf, sucht sich die falsche Muschel aus. Auch Peter und die Darlings wählen leider nicht Barrums Muschel. Bleibt noch eine für Hook.
    Regie: Augusto Zanovello
    Buch/Autor: James Matthew Barrie
    Musik: Frédéric Talgorn
