  title: Lassie
  subtitle: Der verletzte Kondor
  description: |-
    Der verletzte Kondor

    Zoé und Harvey schleppen einen verletzten Kondor in die Tierrettungsstation. Als Lassie ihnen signalisiert, dass im Nest ein Kondorjunges zurückgeblieben ist, machen sie sich auf den Weg.

    Ohne seine Mutter ist das Junge großen Gefahren ausgesetzt. Gerade als Harvey es aus dem Nest holen will, werden sie von einer Eule angegriffen. Wird es den Kindern gelingen, den kleinen Kondor in Sicherheit zu bringen? Zum Glück können sie sich auf Lassie verlassen.
    Regie: Jean-Christophe Roger
