  title: Lassie
  subtitle: Der Waldbrand
  description: |-
    Der Waldbrand

    Als Zoé und Harvey unterwegs sind, um Rotwild zu beobachten, werden sie durch einen plötzlichen Waldbrand eingeschlossen. Mit Lassies Hilfe können sie sich in eine Notstation retten.

    Von dort aus gelingt es ihnen, die Ranger über den Brand zu informieren. Doch statt auf Hilfe zu warten, schrecken die Kinder nicht vor der Gefahr zurück und retten eine Rotwildfamilie aus den Flammen. Das gelingt ihnen natürlich nur mit Lassie an ihrer Seite.
    Regie: Jean-Christophe Roger
    Buch/Autor: Jill Brett, Natalie Altmann, Valerié Baranski, andere

