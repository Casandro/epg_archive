    Die Umwelt-Detektive

    Im Nationalpark wird eine Anzahl kranker Tiere gefunden, die alle blaue Flecken am Schnabel oder am Maul haben. Zoé ist sehr besorgt, auch um Lassie. Mit Harvey geht sie der Sache nach.

    Handelt es sich um eine Art Epidemie oder haben Umweltsünder ihre Hände im Spiel? Zoé hegt schnell einen Verdacht und drängt darauf zu handeln. Harvey pocht darauf, erst stichhaltige Beweise zu sammeln. Damit stellt er Zoés Geduld auf eine harte Probe.
