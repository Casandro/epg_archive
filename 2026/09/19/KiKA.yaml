  title: Sam & Julia im Mäusehaus
  subtitle: Julias Insel
  description: |-
    3D-Animationsserie, Deutschland / Frankreich / Niederlande / Schweiz 2023
    Julias Insel

    Sam fällt es schwer, sich Julias Leben auf der tropischen Insel vorzustellen, auf der sie wohnte, ehe sie vor Kurzem ins Mäusehaus gezogen ist. Auch Julias Beschreibungen helfen nicht.

    Da hat Julia eine Idee. Zusammen mit ihrer Mutter und ihren Freunden bereitet sie auf dem Spielplatz eine künstliche Strandszene vor. Nun kann Sam im Strandstuhl sitzen, die Füße im Wasser baumeln lassen und einen kühlen Saft genießen. Ganz wie auf ihrer Insel.
