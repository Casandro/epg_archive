    Der Prinz lässt Piccolo auf der Stelle verhaften, aber Robin und seine Freunde finden schnell heraus, dass jemand anderes hinter dem Diebstahl steckt. Sie statten Landrin, Piccolos Assistenten, einen Besuch ab und geraten dabei in eine missliche Lage.
