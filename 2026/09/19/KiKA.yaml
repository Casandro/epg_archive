  title: Lassie
  subtitle: Der geheime Garten
  description: |-
    Der geheime Garten

    Biff, der Mops, hat von Giftpflanzen genascht. Jetzt geht es ihm sehr schlecht. Ein Gegenmittel vermutet Mrs. Lee im geheimen Garten von Frances. Doch diese spricht mit niemandem.

    Es scheint da zwischen Frances und Mrs. Lee etwas vorgefallen zu sein, das die beiden vor Jahren entzweit hat. Zoé und Harvey machen sich mit Lassie auf den Weg zu ihr und wollen sie um Hilfe bitten. Können sie auch das Missverständnis zwischen den beiden Damen klären?
    Regie: Jean-Christophe Roger
