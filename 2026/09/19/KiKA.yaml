    Tatsächlich gelingt es ihm gleich Little John zu erwischen, wofür Prinz John ihn zu einem Festmahl einlädt. Marians Versuch Bruno, den Bärenstarken, zurück zu verwandeln, geht gründlich schief. Da bringt der kleine Pieps Robin auf eine geniale Idee.
