  title: Die Pfefferkörner und der Fluch des Schwarzen Königs
  description: |-
    Kinderkrimi, Deutschland 2016
    Die Pfefferkörner Mia und Benny sind auf Klassenfahrt in den Südtiroler Bergen. Rund um den idyllischen Bergbauernhof, in dem die Klasse übernachtet, passieren seltsame Dinge: Eine Scheune brennt, Quellwasser färbt sich pechschwarz, und der Einheimische Luca hat das untrügliche Gefühl, den Hof seines Vaters treffe gerade ein unheimlicher Fluch. Die Pfefferkörner, mittlerweile erweitert durch den Klassenneuzugang Johannes , ermitteln auf Hochtouren. Sie glauben fest daran, dass es eine ganz logische Erklärung für die Vorfälle gibt und entdecken schnell, dass der Hamburger Lebensmittelkonzern Levartis ein extrem großes Interesse an dem Wasser der Region hat. Wie gut, dass Mias kleine Schwester Alice gerade im Hauptquartier der Pfefferkörner in Hamburg sitzt und sich langweilt.
