    Der Schmetterling

    Ein Schmetterling hat sich ins Mäusehaus verirrt und findet nicht mehr heraus. Sam und Julia haben Mitleid mit ihm und versuchen, ihn mit unterschiedlichen Methoden aus dem Haus zu locken.

    Der Schmetterling scheint jedoch nicht zu verstehen, was Sam und Julia von ihm wollen. Er flattert immer wieder davon. Erst als die beiden eine große Stoffblume basteln, auf der sich der Schmetterling niederlässt, scheint eine Rettung möglich.
