  title: Peter Pan - Neue Abenteuer
  subtitle: Wendy verzettelt sich
  description: |-
    Wendy verzettelt sich

    Peter und die Verlorenen Kinder spielen Hook einen Streich. Sie bringen Fässer mit Schwarzpulver außen an der Jolly Roger an. Als Hook auf die Kinder schießen will, explodieren die Fässer.

    Das Schiff hebt ab und landet im Wald. Wendy bekommt davon nichts mit, sie ist unter einer Trauerweide eingeschlafen. Sie träumt davon, viele Wendys zu sein. In Nimmerland werden Träume wahr, die man unter einer Trauerweide hat. So tauchen mehrere Wendys auf.
    Regie: Augusto Zanovello
    Buch/Autor: James Matthew Barrie
    Musik: Frédéric Talgorn
