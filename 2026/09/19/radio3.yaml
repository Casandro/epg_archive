  title: Die Absolventen
  subtitle: Mit Christian Schruff
  description: |-
    Die Celloklasse von Jens-Peter Maintz
    Aufzeichnung des radio3-Kultursalons im Studio 14 vom 15. April 2026

    Die "Absolventen" veranstaltet radio3 gemeinsam mit den Berliner Musikhochschulen. Junge Musikerinnen und Musiker sowie Studierende sollen die Gelegenheit bekommen, sich zu präsentieren. Am 15. April war die Klasse des Cellisten Jens-Peter Maintz von der Universität der Künste Berlin mit einem exklusiven Konzert zu Gast. Zu erleben gab es viel Leidenschaft für Musik und ungewöhnliche Geschichten. Moderiert wurde das Konzert im "STUDIO 14 - DIE rbb-DACHLOUNGE" von Christian Schruff.

    Moderation: Christian Schruff
