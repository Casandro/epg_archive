- eventId: 809032
  start: 2026-09-19T09:57:00Z
  stop: 2026-09-19T10:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 0919 - Chci se učit (263. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Jako dítě jsem byla pochopitelně naivní a všechno jsem se ráda učila. Nepochybně jsem každou novou zvládnutou dovedností rostla a nabývala osobní hodnoty. Jinými slovy řečeno, měla jsem se čím chlubit. A já se chlubila ráda. Postupně jsem zjistila, že nové dovednosti nejsou vždycky jenom zisk. Když se člověk něco už jednou naučí, musí to pak po zbytek života dělat.S jakou pýchou jsem šla poprvé, podruhé a asi i potřetí úplně samostatně pro mléko, chleba a rohlíky. Mohla jsem prasknout, že už to sama dokážu. Jenže když se to stalo mou běžnou povinností, přestalo mi to tak atraktivně připadat. Musím skočit pro nákup, no a co? O samostatném mytí nádobí nebo umývání schodů v domě se ani nebudu rozepisovat. Princip byl stejný, vývoj mého přístupu rovněž.S touto zkušeností mě zarazilo jedno místo v Písmu. Píše se tam, že komu bylo mnoho dáno, od toho bude také mnoho požadováno. My křesťani se mezi sebou pořád o něčem vyučujeme a já bych se toho skoro bála. Když totiž o něčem nevím, nikdo mi nemůže vyčítat, že to nedělám. Když ale vyslechnu vyučování na nějaké téma, pak už nemám výmluvu.Vím dokonce, že to ode mne bude vyžadováno. A to není jen tak. Tohle zjištění mnou docela otřáslo.Od té doby si vážně dávám pozor, na jaký seminář, na jaké konferenci se přihlásím. Vím už, že naučit se něco nového není jen tak. Bude se to ode mne vyžadovat.'
