  title: Filmana Talks
  subtitle: Prozření
  description: 'Autor: Jan Perout; Interpret: Juraj Ondruš; Premiéra: 28.2.2026 * Filmana Talks - pořad o filmech, které dává smysl vidět. Film Prozření - Sight od amerického studia Angel je životopisný příběh špičkového očního chirurga, který se narodil v Číně, dostal se do Ameriky a tam skrze slepého sirotka sám prozřel. S filmovým střihačem Jurajem si povídáme tom, kde všude je možné Boha vidět.'
