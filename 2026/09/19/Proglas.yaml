  title: Knihovnička
  subtitle: Tvorba Petry Klabouchové
  description: 'Autor a interpret: Iva Horká * Když se řekne Petra Klabouchová, většině čtenářů se dnes vybaví především Šumava. Ne ta turistická, zalitá sluncem, ale Šumava drsná, tajemná, plná zapomenutých příběhů, starých křivd a míst, kde minulost nikdy úplně neumřela. Přitom sama autorka začínala zcela jinak. Vystudovala žurnalistiku, pracovala v médiích a dnes se kromě psaní věnuje také hudebnímu průmyslu. Právě zkušenost novinářky je v jejích knihách a také úryvek z románu Vona.'
