- eventId: 809058
  start: 2026-09-19T20:30:00Z
  stop: 2026-09-19T21:25:00Z
  title: Tip týdne
  subtitle: Podpora Ukrajině
  description: 'Autor a interpret: Daniel Blažke, Adam Blažke, Petr Stavinoha; Premiéra: 15.9.2026 * Před druhou světovou válkou byla část Ukrajiny - Podkarpatská Rus - součástí Československa. V roce 1936 vznikl v Bratislavě Klub přátel Podkarpatské Rusi, na jehož odkaz navázalo po revoluci občanské sdružení Společnost přátel Podkarpatské Rusi. Hosty cyklu Na stole je téma jsou dva členové této společnosti Adam Blažke a Petr Stavinoha, kteří také od začátku války na Ukrajině začali organizovat pomoc napadené zemi. Na Proglasu hovoří o své vazbě na území bývalé části vlasti, o humanitární podpoře, kterou opakovaně přivážejí, a o setkáních s lidmi zasaženými válkou.'
