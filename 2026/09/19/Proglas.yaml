- eventId: 809048
  start: 2026-09-19T17:15:00Z
  stop: 2026-09-19T18:15:00Z
  title: Slyšte, lidé!
  subtitle: Hudební výlet do Brazílie 2026/3
  description: 'Autor a interpret: Milan Tesař * V týdeníku Slyšte, lidé! se Milan Tesař v letošním roce už potřetí vydává na hudební výlet do Brazílie a představuje novinky z alb i aktuální singly z platformy Brasil Calling. Zazní současná brazilská hudba od elektroniky a alternativního rocku přes sambu a písničkářství až po afro-brazilské rytmy, mimo jiné v podání Disstantes, Pedra Volty, Ellen Oléri, Marcose Jobima nebo Janine Mathias. Vedle hudby pořad přibližuje také společenská a kulturní témata, která se v tvorbě brazilských umělců odrážejí ? od sociální nerovnosti a kulturní identity přes tradici a generační dialog až po otázky lásky, paměti a vztahu člověka k přírodě.[brazil kólin] [dyštančis] [markuse žobima] [žanyn matyas] '
  genre:
  - '96'
- eventId: 809055
  start: 2026-09-19T18:15:00Z
  stop: 2026-09-19T19:00:00Z
  title: ChariTALK
  subtitle: Lucie Bílá
  description: 'Autor: Charita ČR; Interpret: Lucie Bílá, René Kekely - moderátor; Premiéra: 1.7.2023 * ?Nepotřebuju, aby se mi vracely peníze, ale aby se mi vracelo něco, co se nedá penězi měřit, a to je dobrý pocit." V prvním díle pořadu ChariTALK uslyšíte zpěvačku Lucii Bílou. V rozhovoru prozradila, proč má potřebu pomáhat, co je jejím hnacím motorem, ale třeba i to, jak bojovala o život a jak se loučila s maminkou.ChariTALK je podcast Charity České republiky o tématech, ke kterým lidé z Charity nebo lidé spojeni s Charitou, mají co říct, a které hýbou společností. Ať je to potravinová pomoc, migrační politika nebo paliativní péče. Moderátor René Kekely se ptá hostů na odborné otázky i na jejich osobní příběhy. Podcasty vznikají v pražském studia Radia Proglas.'
