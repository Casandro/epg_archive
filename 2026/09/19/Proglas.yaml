  title: Za 5 pět
  subtitle: Komunikace jako superschopnost
  description: 'Autor: Hana Scharffová; Interpret: Vendula Krejčová, novinářka a odbornice na komunikaci * Komunikace ve všech jejích podobách je téma, které někdejší moderátorku České televize Vendulu Krejčovou zajímá a baví natolik, že se mu věnuje profesionálně. Jak zatočit s trémou? Co o nás a o našem okolí prozrazují drobná gesta? A umíme spolu vůbec v rychlé době internetu a sociálních sítí ještě mluvit? I na to se zaměříme Za 5 pět. Zve vás Hana Scharffová.'
