  title: Große Erfindungen
  subtitle: Industrieroboter
  description: |-
    Die Erfindung der Industrieroboter hat die Spielzeug-, Elektronik- und Autoindustrie revolutioniert! Industrieroboter übernehmen seither auch oft gefährliche Aufgaben, die der Mensch nun nicht mehr selbst ausführen muss. Doch gefährdet diese bahnbrechende Erfindung auch unsere Arbeitsplätze?
    Heutzutage sind die futuristisch wirkenden Maschinen nicht mehr aus den Fabriken und Produktionsstätten wegzudenken. Bis jetzt sind schätzungsweise 2 Millionen Roboter im Einsatz, rund 50 Prozent davon in Japan. Aber auch in anderen Ländern ersetzen Maschinen zunehmend menschliches Personal.
    Über menschenähnliche Maschinen ist bereits in frühen Zivilisationen, wie etwa im antiken China und Griechenland, nachgedacht worden. Doch erst im 20. Jahrhundert wurden die komplexen Maschinen von heute entwickelt.
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Hannah Rogers
