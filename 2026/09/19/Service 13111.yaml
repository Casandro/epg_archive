  title: Die Geschichte von Pferd und Mensch
  description: |-
    Vor 6.000 Jahren wurde das Pferd vom Menschen gezähmt: Diese Beziehung von Mensch und Tier sollte die Welt maßgeblich verändern. Diese Entwicklung nachzuverfolgen, ist eine Reise in die Geschichte der Menschheit, aber auch in die Biologie des Menschen. Zwei Jahre lang war das Filmteam mit der Kamera auf der ganzen Welt unterwegs und besuchte die letzten noch lebenden Reiternomaden im Altai-Gebirge, archäologische Stätten im heutigen Kasachstan sowie Rancher in den USA. So zeigt der Dokumentarfilm etwa auch, wie Evolutionsbiologen nun zum ersten Mal die versteinerten Überreste des Urpferdchens virtuell zum Leben erwecken. Zudem konnten Genetiker mittlerweile darlegen, dass vor ungefähr 5000 Jahren eine zentralasiatische Reiterkultur auf dem Rücken von Pferden nach Europa kam. Eben jene Völkerwanderung sollte vieles nach Europa bringen, was wir heutzutage als ureuropäisch betrachten. Die Zähmung des Pferdes sollte somit Europa, Asien und die ganze Welt für immer verändern.
    Dokumentarfilm, Kanada 2019, R: Niobe Thompson, Dennis Wells
