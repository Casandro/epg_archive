  title: A Haunting in Venice
  description: |-
    Nur seine Freundin, die Krimiautorin Ariadne Oliver (Tina Fey), schafft es, den belgischen Meisterdetektiv Hercule Poirot (Kenneth Branagh) aus dem Ruhestand zu bewegen. Poirot hat sich im Jahr 1947 in Venedig verkrochen. Ariadne möchte das Medium Joyce Reynolds (Michelle Yeoh) als Hochstaplerin überführen. Reynolds hält Séancen ab, bei denen sie angeblich mit Toten Verbindung tritt. Gemeinsam mit Ariadne beteiligt sich Poirot im Palazzo der Opernsängerin Rowena Drake an einer dieser paranormalen Sitzungen. Reynolds will mit Rowenas verstorbener Tochter Alicia sprechen. Poirot kann tatsächlich den "Kontakt" als Inszenierung entlarven. Dann überstürzen sich die Ereignisse. Auf Poirot wird ein Mordanschlag verübt, wenig später kommt Joyce Reynolds ums Leben. Mord oder Selbstmord? Der Meisterdetektiv beginnt, die Anwesenden zu verhören.

    "A Haunting in Venice" ist bereits die dritte Agatha-Christie-Verfilmung von Regisseur und Oscargewinner Kenneth Branagh ("Belfast"). Als Vorlage diente der Krimi "Die Halloween-Party" (früher: "Die Schneewittchen-Party"). Um das Geschehen zusätzlich mit Mystery- und Horror-Elemente anzureichern, hat Drehbuchautor Michael Green ("Alien: Covenant", "Blade Runner 2049") die Handlung von London nach Venedig verlegt. Gedreht wurde an Originalschauplätzen, so auf dem Canal Grande, an der Seufzerbrücke und auf dem Markusplatz. Wie schon in den Vorgängerfilmen spielt Branagh die Hauptfigur des brillanten Ermittlers Hercule Poirot. Weitere Rollen wurden besetzt mit Tina Fey (die Autorin Aridane Oliver) und Oscargewinnerin Michelle Yeoh (als Medium Joyce Reynolds).
    Krimi, Vereinigte Staaten Von Amerika 2023, R: Kenneth Branagh
  widescreen: true
- eventId: 966183
  start: 2026-09-19T20:10:00Z
  stop: 2026-09-19T22:14:20Z
  title: R.E.D. 2
  description: |-
    Einer von Frank Moss (Bruce Willis) besten Freunden, der ehemalige CIA-Agent Marvin Boggs (John Malkovich), ist tot. Das Auto, in dem er saß, ist plötzlich explodiert. Frank und Marvin waren früher Kollegen im Geheimdienst. Nach der Beerdigung wird Frank seltsamerweise vom FBI verhört. Dann werden die Agenten jedoch überfallen und getötet. Frank gelingt mit Hilfe des totgeglaubten Marvin die Flucht. Von seinem Kompagnon erfährt er, dass eine Geheimdienst-Operation während des Kalten Krieges dahintersteckt. Dabei ging es um eine nach Russland geschmuggelte Nuklearwaffe. Frank und sein Ex-Team werden dafür verantwortlich gemacht und sind nun des Terrorismus verdächtigt. Marvin und Frank verfolgen die Spur der Attentäter bis nach Moskau. Währenddessen soll ihre einstige Weggefährtin, die Profikillerin Victoria Winslow (Helen Mirren), die beiden im Auftrag des MI6 ausschalten. Verfolgt von Victoria und einer Horde von CIA- und KGB-Agenten, versuchen Frank und Marvin die Strippenzieher der Verschwörung ausfindig zu machen.

    Schwarzhumorig wie sein Vorgänger präsentiert sich die Actionkomödie "R.E.D. 2 - Noch Älter, Härter, Besser". Was exotische Schauplätze, spektakuläre Stunts und atemberaubende Verfolgungsjagden angeht, hat Regisseur Dean Parisot allerdings noch eine Schippe draufgelegt. Mit dabei erneut Actionlegende Bruce Willis als Frank Moss sowie John Malkovich (Marvin Boggs) und Helen Mirren (Victoria Winslow). Die Oscar-Preisträger Anthony Hopkins und Catherine Zeta-Jones sind in Nebenrollen zu sehen.
    Action, Vereinigte Staaten Von Amerika 2013, R: Dean Parisot
  widescreen: true
