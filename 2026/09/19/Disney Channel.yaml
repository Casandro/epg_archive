  title: Susi und Strolch
  subtitle: Zeichentrickfilm, USA 1955
  description: 'Regie: Hamilton Luske, Clyde Geronimi, Wilfred Jackson. Darsteller: Barbara Luddy, Larry Roberts, Peggy Lee. Die charmante Cockerdame Susi lebt in einem liebevoll behüteten Zuhause. Als allerdings eines Tages Tante Sarah mit den heimtückischen Katzen Si und Am zum Babysitten kommt, sind für Susi die harmonischen Zeiten vorbei. Sie reißt aus und trifft den frechen Vagabunden Strolch. Bei einem unvergesslichen romantischen Spaghettiessen kommen sich die beiden näher und gemeinsam mit Strolch lernt Susi das abenteuerliche und ungebundene Leben auf der Straße kennen. Doch auf Susi warten ein Zuhause und eine Familie, die sie beschützen muss.'
  widescreen: true
- eventId: 1014297
  start: 2026-09-19T13:55:00Z
  stop: 2026-09-19T15:15:00Z
  title: Alice im Wunderland
  subtitle: Zeichentrickfilm, USA 1951
  description: 'Regie: Clyde Geronimi, Hamilton Luske, Wilfred Jackson, Jack Kinney. Darsteller: Kathryn Beaumont, Ed Wynn, Richard Haydn. Als Alice eines schönen Tages einem sprechenden weißen Kaninchen mit einer großen Uhr folgt, landet sie prompt in einer außergewöhnlichen Welt, dem Wunderland. Auf ihrer Reise durch diese fröhlich bunte, aber auch sehr eigenartige Welt, begegnet sie einer gestiefelten Raupe, einem verrückten Hutmacher und sie ist zu Gast bei einer Nichtgeburtstagsparty. Einer zwielichtigen Tigerkatze hat es das Mädchen schließlich zu verdanken, dass es den Zorn der Herzkönigin auf sich zieht.'
- eventId: 967050
  start: 2026-09-19T15:15:00Z
  stop: 2026-09-19T16:35:00Z
  title: Gnomeo und Julia
  subtitle: Animationsfilm, USA/GB/CDN/IRL 2011
  description: 'Regie: Kelly Asbury. Darsteller: James McAvoy, Emily Blunt, Ashley Jensen. Eine nur scheinbar idyllische Vorgartenzwergidylle: Denn die Knirpse von Graf Zinnoberrot auf der einen und die kleinen Kerle von Gräfin Blaublut auf der anderen Seite des Zauns sind total zerstritten und tragen ihre Konflikte in wilden Rasenmäherwettrennen aus. Als aber der blaue Gnomeo eines Nachts die rote Julia erspäht, ist es Liebe auf den ersten Blick. Von nun an versuchen sie, Eintracht unter den Zwergenparteien zu säen. Doch der Weg dorthin ist gesäumt von gekappten Zipfelmützen und Tausenden von Tonscherben.'
  widescreen: true
- eventId: 967051
  start: 2026-09-19T16:35:00Z
  stop: 2026-09-19T18:15:00Z
  title: Ralph Reichts
  subtitle: Animationsfilm, USA 2012
  description: 'Regie: Rich Moore. Darsteller: John C. Reilly, Sarah Silverman, Jack McBrayer. Das Leben ist für Ralph richtig hart, denn keiner mag die bösen Jungs. Doch Ralph muss in seinem Computerspiel die Rolle des Zerstörers übernehmen, obwohl er lieber einmal der große Held sein möchte. Also haut er einfach ab, um es in ''Hero''s Duty'', einem actiongeladenen Sci-FI-Shooter, allen so richtig zu zeigen! Doch sein "Game Hopping" bringt das System total durcheinander und droht alle Spielewelten zu zerstören. Da bekommt er unverhofft Unterstützung von Vanellope von Schweetz, einem Fehler im System. Die beiden Außenseiter tun sich zusammen und vereinen ihre ganzen Kräfte!'
  widescreen: true
