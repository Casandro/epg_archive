  title: Cinderella
  subtitle: Märchenfilm, USA 2015
  description: 'Regie: Kenneth Branagh. Darsteller: Lily James, Cate Blanchett, Richard Madden. Ella verliert früh ihre Mutter, führt aber ein zufriedenes Leben mit ihrem liebevollen Vater. Als der sich eine neue Frau nimmt, heißt Ella sie mitsamt ihren Töchtern willkommen. Doch als der Vater ebenfalls stirbt, zeigt die Stiefmutter ihr wahres Gesicht. Fortan lebt Ella als Dienstmädchen und wird Cinderella genannt. Abwechslung verspricht eine Balleinladung, die an alle unverheirateten Damen gerichtet ist, denn der Prinz sucht eine Braut. Ella möchte teilnehmen, ihre Stiefmutter verbietet es jedoch. Ihr künftiges Glück hängt nun davon ab, ob es ihr gelingt, doch zu dem Fest zu gelangen...'
