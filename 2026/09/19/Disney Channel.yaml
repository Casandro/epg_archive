  title: Bernard und Bianca - Die Mäusepolizei
  subtitle: Zeichentrickfilm, USA 1977
  description: 'Regie: Art Stevens, Wolfgang Reitherman, John Lounsbery. Darsteller: Bob Newhart, Eva Gabor, Geraldine Page. Eine Flaschenpost alarmiert die internationale Rettungsgesellschaft, zu der auch die Mäusedame Bianca gehört. Der Hilferuf stammt von Penny, die von der skrupelosen Madame Medusa aus einem Waisenhaus entführt wurde. Ohne zu zögern, startet die mutige Bianca zu einer Rettungsaktion, auf die sie der schüchterne Mäuserich Bernard begleitet. Eine heiße Spur führt die beiden in die unheimlichen Sümpfe der Teufelsbucht...'
  widescreen: true
