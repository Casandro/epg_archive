  title: Bambi
  subtitle: Zeichentrickfilm, USA 1942
  description: 'Regie: David Hand, James Algar, Samuel Armstrong, Graham Heid, Bill Roberts, Paul Satterfield, Norman Wright, Arthur Davis, Clyde Geronimi. Darsteller: Donnie Dunagan, Hardie Albright, John Sutherland. Mitten in einem Wald wird ein kleiner Hirsch namens Bambi geboren. Noch klein und tapsig, macht er seine ersten vorsichtigen Schritte auf einer Blumenwiese und lernt dabei das pfiffige Kaninchen Klopfer und das schüchterne Stinktier Blume kennen. Gemeinsam entdecken die jungen Waldbewohner die geheimnisvollen Wunder der Natur und werden so zu unzertrennlichen Freunden. Und selbst als die Herausforderungen des Lebens nahen, halten die ungleichen Freunde fest zusammen...'
- eventId: 967010
  start: 2026-09-19T10:00:00Z
