  title: TinkerBell - Die Suche nach dem verlorenen Schatz
  subtitle: Animationsfilm, USA 2009
  description: 'Regie: Klay Hall. Darsteller: Mae Whitman, Jesse McCartney, Jane Horrocks. Die Fee TinkerBell erhält die ehrenvolle Aufgabe, das prachtvolle Herbst-Zepter zu entwerfen. Denn ohne das Zepter kann die neue Jahreszeit, der Herbst, nicht eingeleitet werden. In einem unachtsamen Moment geht jedoch der unentbehrliche magische Mondstein zu Bruch. Um den Herbst trotzdem pünktlich beginnen zu lassen, muss TinkerBell für Ersatz sorgen und begibt sich auf eine abenteuerliche Suche. Die Fee TinkerBell wird auserwählt, das prachtvolle Herbst-Zepter zu entwerfen, welches nötig ist, um den kommenden Herbst einzuleiten. Denn dieses Jahr fällt der Herbstanfang auf die Nacht des blauen Mondes. Durch diesen Mond und den Mondstein, welcher auf die Spitze des Herbst-Zepter kommt, gewinnen die Feen blauen Feen-Staub. Dieser ist unglaublich wichtig für die Feen, den er kann normalen Feen-Staub vervielfältigen. Königen Clarion, der Herbstminister und Fee Mary übergeben daher TinkerBell den Mondstein. Als dieser jedoch in einem unachtsamen Moment zu Bruch geht, muss sich die Fee auf eine abenteuerliche Suche nach einem Ersatz machen. Begleitet wird sie auf diesem Abenteuer von einem neuen Freund und lernt dabei den wahren Wert von Freundschaft.'
  widescreen: true
