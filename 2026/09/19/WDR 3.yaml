- eventId: 546641
  start: 2026-09-19T14:04:00Z
  stop: 2026-09-19T15:00:00Z
  title: WDR 3 Lesung
  subtitle: 'Fjodor M. Dostojewski: Weiße Nächte (3/3)'
  description: "Durch die abendleeren Straßen <markup type=\"abbr\" abbreviation=\"St.\" correspondent=\"Sankt\">St.</markup> Petersburgs, die in Sommernächten nie ganz dunkel werden, flaniert ein Träumer - und begegnet einer jungen Frau. Beide sind einsam. Sie treffen sich wieder, vier Nächte lang, um zu reden. Über ihr Leben, ihre Hoffnungen und Träume, ihren Kummer. Eine der schönsten Liebesgeschichten der Weltliteratur.\n<strong>Teil 3</strong>\nDer Erzähler schwankt zwischen Verzweiflung und Hoffnung. Er gesteht Nastenka seine Liebe. Sie ringt mit sich. Wird ihre Liebe zu ihrem Verlobten, der sie vergessen zu haben scheint, mit der Zeit verblassen? \nVon Fjodor M. Dostojewski <br/>Übersetzung: Alexander Eliasberg <br/>Mit Benno Schulz <br/>Bearbeitung: Dina Netz <br/>Regie: Petra Feldhoff <br/>Produktion: WDR <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup>\nZum Download in ARD <markup type=\"language.en\">Sounds</markup>."
