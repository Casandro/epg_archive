  title: Buchty
  description: Buchty tentokrát bez hosta o dvojnících, záměnách lidí a kopiích. Ivana a Zuzana se tentokrát sešly samy ve studiu a připravily díl až filozofického vyznění. Bavily se třeba o tom, proč chce být každý výjimečný a kde je hranice mezi novým a starým. Nevíte, co přesně od toho dílu čekat? Tak si ho poslechněte a budete se cítit minimálně jako Sokrates. Moderují Zuzana Fuksová a Ivana Veselková. (repríza)
