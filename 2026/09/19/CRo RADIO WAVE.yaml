  stop: 2026-09-19T20:40:00Z
  title: Pot
  description: Bystrík Klčo je slovenská intermediální umělkyně, modelka a fanynka smaženého sýra, která žije a tvoří v Praze, kam se přestěhovala za studiem na UMPRUMce. V hotcastu Pot mluvila o svém dětství, umění i cestou za autentickou genderovou expresí. "Člověk před sebou nikdy neuteče. Jak říká Nan Goldin, tak když se děti narodí, vědí všechno, a různé socializační procesy je donutí zapomenout." Proč nemá ráda termín coming out? Se kterou postavou ze Sexu ve městě se ztotožňuje? A jak identitu, tranzici a vyrůstání na Slovensku reflektuje ve svém umění? Moderují Eliška Soukupová a Karel Vladyka.
