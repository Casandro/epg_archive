  title: Psycho
  description: Když kontroluje, žárlí a překračuje hranice, je to ještě romantika? Karolína a Pavel v Psychu rozebírají, jak knihy a BookTok můžou vydávat násilí za důkaz lásky. A proč některá tabu potřebujeme, jako společnou hranici toho, co ve vztazích nepřipouštíme. Co se stane, když se tahle hranice začne posouvat? Poslechněte si nový díl. Moderují Pavel Šebesta a Karolína Faberová. (repríza)
