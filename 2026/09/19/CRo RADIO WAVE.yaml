  title: Startér
  description: Startér je hitparáda pro nové naděje domácí hudební scény. Pošlete nám svoje skladby na starter@rozhlas.cz a zkuste, co na vaše první singly řeknou moderátoři Martin s Filipem, odborná porota a hlavně posluchači Radia Wave. Vítěz s námi nahraje profesionální videosingl, live video a finálová trojka se potká na Startér Showcasu. Všichni účastníci Startéru mají šanci objevit se na několika spřátelených festivalech, Radio Wave Studio nebo na pravidelných letních koncertech na pražském Stalinu. Moderují Filip Černý a Martin Šolc.
