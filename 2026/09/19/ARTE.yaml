  title: Le compositeur Antonio Salieri - Le mythe du meurtrier de Mozart
  description: |-
    Documentaire de Max Jacobi (2024, 53mn) La légende populaire le considère comme un rival envieux de Mozart, voire comme son assassin. Ces rumeurs, reprises notamment dans le scénario du film "Amadeus" de Milos Forman, ont totalement occulté la véritable histoire d'Antonio Salieri, compositeur acclamé dans toute l'Europe, qui a marqué la scène musicale viennoise et formé toute une génération d'artistes, dont Beethoven et Schubert.

