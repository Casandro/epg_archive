- eventId: 937305
  start: 2026-09-19T23:00:00Z
  stop: 2026-09-19T23:45:00Z
  title: Küche, Garten, wunderschön!
  subtitle: Ein Anbau der Extraklasse
  description: "Mitch und Elliot wollen ihr Haus vor den Toren Londons komplett umbauen und in ein modernes Zuhause mit offenem Wohnkonzept verwandeln. Doch kurz nach dem Kauf sorgt ein massiver Wasserschaden dafür, dass aus dem geplanten Renovierungsprojekt eine riesige Baustelle wird. Architekt George Clarke entwickelt einen mutigen Entwurf mit großzügigem Anbau, eleganten Rundbögen und fließenden Übergängen zwischen Wohnbereich und Garten. Parallel gestaltet Landschaftsarchitekt Luke Millard den weitläufigen Außenbereich neu und schafft verschiedene Zonen zum Entspannen und Zusammensein.  \nGBR 2025"
- eventId: 937306
  start: 2026-09-19T23:45:00Z
  stop: 2026-09-20T00:30:00Z
  title: Küche, Garten, wunderschön!
  subtitle: Mehr Barrierefreiheit für Ben
  description: "In Matlock in Derbyshire braucht Rollstuhlfahrer Ben dringend eine Küche und einen Garten, die besser auf den Alltag seiner Familie abgestimmt sind. Architekt George Clarke und Gartendesigner Luke Millard entwickeln zwei unterschiedliche Konzepte und helfen dabei, die beste Lösung für das vorhandene Budget zu finden. Dabei stehen Funktionalität und Barrierefreiheit im Mittelpunkt. \nGBR 2024"
