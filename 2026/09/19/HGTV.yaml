- eventId: 937281
  start: 2026-09-19T08:55:00Z
  stop: 2026-09-19T09:55:00Z
  title: Unser Traum vom Schloss
  subtitle: Dachbodenschätze
  description: |-
    Die Eventsaison hat begonnen und Angel hat alle Hände voll zu tun. Die Hochzeit von zwei guten Freunden steht an und die Familie plant eine Geburtstagsfeier für Angels Mutter. Aber vorher wartet auf Dick noch ein Job ganz oben im Schloss. In den ehemaligen Bediensteten-Zimmern möchte Angel ihr eigenes Reich zum Nähen und Basteln schaffen. Eine Dachboden-Schatzkammer, in der sie in Ruhe arbeiten kann, umgeben von vielen Erinnerungsstücken. Dafür macht die ganze Familie einen Ausflug auf den Flohmarkt. Für den Dachboden upcyceln die beiden Schlossbesitzer alte Vintage-Möbel vom Flohmarkt und von den Scheunen, die bis oben hin mit alten Möbeln vollgestopft sind.
    GBR 2018
- eventId: 937283
  start: 2026-09-19T09:55:00Z
  stop: 2026-09-19T10:55:00Z
  title: Unser Traum vom Schloss
  subtitle: Von Türmen, Blumen und Wassermelonen
  description: "Zwischen Hochzeiten und Gourmet-Wochenenden verbringen Dick und Angel in den Sommerferien so viel Zeit wie möglich mit ihren Kindern Arthur und Dorothy. Nebenbei will sich Angel das Obergeschoss in Turm Nummer zwei vornehmen. Sie plant eine weitere Gästesuite unter dem Motto Blumen und Gartenparadies. Doch zuerst nimmt sie alles genau in Augenschein. Als sie eine Vintage-Tapete mit orientalischen Rosen entdeckt, bringt sie das auf eine Idee: Angel lässt sich von dem Muster inspirieren, um eine eigene Tapete für die Garten-Suite zu entwerfen. Außerdem möchte sie Dicks harte Arbeit im Garten wertschätzen und presst Blüten für die Dekoration. \nGBR 2018"
- eventId: 937284
  start: 2026-09-19T10:55:00Z
  stop: 2026-09-19T11:55:00Z
  title: Unser Traum vom Schloss
  subtitle: Das Treppenhaus in neuem Glanz
  description: |-
    Im Schloss hat Angel große Pläne für das Treppenhaus. Mit fünf Metern Höhe soll die hölzerne, mehrläufige Treppe in neuem Glanz erstrahlen. Und das so schnell wie möglich, denn die nächste Hochzeit findet in knapp zwei Wochen statt. In letzter Minute findet Angel eine Firma, die ihr einen burgunderroten Teppich anfertigt. Dick baut für die Kinder währenddessen ein eigenes Boot, mit dem sie sich eine Abkühlung gönnen. Dann steht die Hochzeit an und die beiden haben alle Hände voll zu tun - mit Logistik, Catering und Dekoration.
    GBR 2018
- eventId: 937285
  start: 2026-09-19T11:55:00Z
  stop: 2026-09-19T13:00:00Z
  title: Gärtner mit Herz
  subtitle: Der Geheimgarten
  description: "In Wakefield zeigen Alan Titchmarsh, Frances Tophill und Danny Clarke, wie man den ultimativen Geheimgarten voller bunter Pflanzen, versteckter Ecken und magischer Elemente für ein kleines Mädchen im Rollstuhl und ihre Familie anlegt.  Von einer halb gebauten Burg bis hin zu einem Wasserspiel und einer Streichelecke mit Sinnespflanzen bietet der besondere Garten alles, was klein und groß erfreut. In Swansea beweist Katie Rushworth, dass der altmodische Stil eines geheimen Gartens nicht die einzige Lösung ist, denn sie hat einen durch und durch modernen, eleganten, versunkenen Garten für eine Frau im Sinn, die Partys für ältere Menschen veranstaltet, um die Einsamkeit zu lindern.  \nGBR 2021"
  widescreen: true
- eventId: 937287
  start: 2026-09-19T13:00:00Z
  stop: 2026-09-19T14:05:00Z
  title: Gärtner mit Herz
  subtitle: Nottingham
  description: |-
    Alan und sein Team brechen nach Nottingham auf, um sich um den Garten des 32-jährigen Landschaftsbauers Daniel zu kümmern. Denn nach Daniels unerwarteter Alzheimer-Diagnose fällt dem jungen Familienvater das Sprechen, die Bewegung und Koordination leider zunehmend schwer. Alan legt sich daher mächtig ins Zeug, um für Daniel und seine Familie einen modernen Garten zu gestalten.
    GBR 2019
- eventId: 937288
  start: 2026-09-19T14:05:00Z
  stop: 2026-09-19T15:05:00Z
  title: Der Farmhaus-Retter
  subtitle: Von Kalifornien aufs Land
  description: |-
    Eine Familie aus Los Angeles kauft unbesehen ein Bauernhaus von 1798 in New Hampshire. Jon trifft sich mit dem Paar, während er in L.A. für die bevorstehende Tournee mit "New Kids on the Block" probt. In den nächsten Wochen verwandeln er und Kristina die alte, dunkle Villa in ein lebendiges und junges Zuhause, das perfekt für eine wachsende Familie ist. Sie designen im Bauernhaus eine strahlend weiße Küche, ein großzügiges Badezimmer und einen von Santa Monica inspirierten Hühnerstall. Außerdem setzen sie auf einen rustikalen Design-Hack mit Kartoffeln.
    USA 2022
- eventId: 937291
  start: 2026-09-19T15:05:00Z
  stop: 2026-09-19T16:15:00Z
  title: Der Farmhaus-Retter
  subtitle: Endlich echte Farmer
  description: "Zum ersten Mal renovieren Jon und Kristina ein Haus auf einer bewirtschafteten Beerenfarm. Mit wiederverwendeten Materialien vom Hof gestalten sie außergewöhnliche Designelemente wie eine Wand aus Glasflaschen und dekorative Pflanzeninstallationen. So entsteht ein modernes Farmhaus, das den Charme des Hofes bewahrt und gleichzeitig zeitgemäßen Wohnkomfort bietet. \nUSA 2024"
- eventId: 937292
  start: 2026-09-19T16:15:00Z
  stop: 2026-09-19T17:15:00Z
  title: Die Beckenbauer - Pools der Superlative
  subtitle: Der Ozean-Garten
  description: |-
    Florida-Kalkstein und Sand auf dem Grund: Lucas Congdon und sein Team entwerfen für ihre Kundschaft im historischen Fischerdorf Cortez am Golf von Mexiko eine Badelandschaft mit Ozean-Flair. Dort haben sich Craig und Cat Scherer ein Traumhaus gekauft. In ihrem neuen Pool haben bis zu 20 Leute Platz - ohne, dass es eng wird. Dort kann das Paar zukünftig ultracoole Partys feiern. Absoluter Blickfang der Konstruktion ist eine Fels-Wasserwand. Außerdem gibt es Sitzgelegenheiten mit Massagedüsen.
    USA 2016
- eventId: 937293
  start: 2026-09-19T17:15:00Z
  stop: 2026-09-19T18:15:00Z
  title: Die Beckenbauer - Pools der Superlative
  subtitle: Patchwork-Pool
  description: |-
    Jennifer Helling und Kirby Huestis verbringen die Ferien mit ihren Kindern gerne in Mexiko. Deshalb bauen Lucas Congdon und sein Team in Venice, Florida, eine Badelandschaft, in der sich die Patchworkfamilie das ganze Jahr über wie im Urlaub fühlt. Wandmalereien und Mosaike greifen das Südamerikathema auf. Außerdem gibt es in der neuen Wohlfühloase einen Wasserfall, eine Feuerstelle und einen Koiteich. Dort haben bis zu 40 Fische Platz. Die tropischen Pflanzen in der Anlage werden zudem alle automatisch bewässert.
    USA 2016
- eventId: 937295
