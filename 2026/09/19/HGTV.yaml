  title: House Hunters Australien
  subtitle: Junges Glück im Gemüsegarten
  description: "Die frisch verheirateten Bec und Ben leben noch mit ihrer 12-köpfigen Großfamilie zusammen und suchen dringend ihr erstes eigenes Zuhause nahe Richmond. Mit einem Budget von 950.000 AUD wünschen sie sich Renovierungspotenzial, Garten und Nähe zur Familie. Haus Nummer eins bietet viel Platz und Gestaltungsspielraum - genau Becs Ding. Während sie schon Farben und Grundrisse im Kopf verändert, sieht Ben vor allem die Kosten und die Verantwortung einer ersten großen Hypothek. \nAUS 2024"
- eventId: 937298
  start: 2026-09-19T20:35:00Z
  stop: 2026-09-19T21:05:00Z
  title: House Hunters Australien
  subtitle: Griechen, Gärten, Gipfelstürmer
  description: "Christine und Stelios wollen ihre Apfelplantage in Canberra hinter sich lassen und an die Küste nach Berry ziehen - näher bei Christines Enkel und mit mehr Lebensqualität. Sie träumt von einem Haus mit atemberaubender Aussicht und großem Hauptschlafzimmer, er von Bergen, Meerblick und einem Garten, der ihn an seine griechische Heimat erinnert.  \nAUS 2024"
- eventId: 937301
  start: 2026-09-19T21:05:00Z
  stop: 2026-09-19T21:35:00Z
  title: Caribbean Life - Traumhaus gesucht
  subtitle: Golfclub inklusive
  description: "Ein Ehepaar aus Tennessee mit acht Kindern ist bereit für einen kompletten Tapetenwechsel - von ihrem stressigen Alltag hin zur karibischen Gelassenheit. Da sie regelmäßig aus beruflichen Gründen in der Dominikanischen Republik sind, soll ihr neues Zuhause in Juan Dolio stehen, einer entspannten Küstenstadt mit viel Potenzial für das Familienleben. Gesucht wird ein weitläufiges Haus mit großem Garten, Pool, Badewanne und möglichst in der Nähe eines Golfclubs - denn trotz Familienalltag soll auch Zeit für kleine Fluchten bleiben. \nUSA 2018"
- eventId: 937302
  start: 2026-09-19T21:35:00Z
  stop: 2026-09-19T22:05:00Z
  title: Caribbean Life - Traumhaus gesucht
  subtitle: Vom Big Apple in die Karibik
  description: "Nach Jahren im hektischen New York sehnt sich ein Paar nach Meer, Sonne und einem langsameren Alltag - am liebsten auf der kleinen, ruhigen Insel Vieques vor der Küste Puerto Ricos. Während er sich nach einem Leben direkt am Wasser sehnt, möchte sie lieber weiter im Inselinneren wohnen - fernab von Wetterkapriolen und Tourismus. Beide sind sich aber einig: Das Haus soll auch vermietbar sein, damit sich der Karibiktraum langfristig trägt. \nUSA 2018"
- eventId: 937303
  start: 2026-09-19T22:05:00Z
  stop: 2026-09-19T22:30:00Z
  title: Caribbean Life - Traumhaus gesucht
  subtitle: Die Bärenhöhle
  description: "Ein junges Paar möchte dem eiskalten Pittsburgh den Rücken kehren und auf der karibischen Insel Vieques ein neues Kapitel beginnen. Sie wünschen sich ein entspanntes Leben in einer kleinen Gemeinde mit leeren Stränden, Platz für ihre Hunde und einem guten Blick aufs Meer. Da sie sich mit Renovierungen auskennen, ist auch ein Fixer Upper kein Hindernis. \nUSA 2018"
- eventId: 937304
  start: 2026-09-19T22:30:00Z
