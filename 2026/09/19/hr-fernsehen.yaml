  title: Mit Herz am Herd
  subtitle: Lammkoteletts mit Kräuterkruste und Ratatouille
  description: 'Das Team um Sternekoch Cliff Hämmerle kocht auf Gut Lindenfels in Blieskastel-Alschbach. Auf dem Speiseplan steht Bliesgaulamm mit feiner Kräuterkruste und Ratatouille-Gemüse. Cliff Hämmerle präsentiert nicht nur ein leckeres regionales Rezept, sondern auch tolle Kochtipps: Tomaten lassen besser schälen, wenn sie nach einem kurzen Bad in kochend heißem Wasser eiskalt abgeschreckt werden und Auberginenscheiben behalten ihren Biss, wenn man sie vor dem Braten beidseitig salzt und für ein paar Minuten auf Küchenpapier legt. Cliff Hämmerle, Verena Sierra und Michel Koch wünschen guten Appetit.'
