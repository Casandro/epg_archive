  title: Gartenzeit
  subtitle: 'Moderation: Ulrike Finck'
  description: Die Gartenzeit ist zu Gast im berühmten Max Liebermann-Garten in Berlin-Wannsee. Der Maler ließ sich 1909 dort sein "Schloss am See" errichten und seinen Garten direkt am Wannsee anlegen. 24 Jahre lang verbrachte er hier die Sommermonate bis zu seinem Tod 1935. Über 120 Gemälde, die den Garten in all seiner Vielfalt abbilden, entstanden in dieser Zeit. Nach Liebermanns Tod erlebten Haus und Garten eine wechselvolle Geschichte. Der Garten verfiel. Dank des Engagements der Max Liebermann-Gesellschaft konnte der Garten ab Mitte der 90er Jahre rekonstruiert und 2006 für Besucher geöffnet werden.
