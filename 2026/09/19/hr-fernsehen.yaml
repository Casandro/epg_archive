  description: Susanne denkt über eine Adoption nach. Christoph hingegen hat mit dem Thema "Kinder" bereits abgeschlossen. An ein Kind aus dem Kinderheim hat er noch nie gedacht. Bei ihrem ersten Termin beim Jugendamt erfahren die beiden allerdings, dass verheiratete Paare bessere Chancen beim Adoptionsverfahren haben. Christoph und Susanne erlauben Christophs Tochter Rebecca, eine große Geburtstagsparty mit Freunden zu schmeißen - ganz ohne elterliche Aufsicht. Im Zoo unterläuft unterdessen Fährmanns neuer Assistentin Nicole Sommer ein grober Fehler, durch den Tierpfleger Conny in Lebensgefahr gerät.
