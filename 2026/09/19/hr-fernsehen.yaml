  title: Wolfsland - 20 Stunden
  subtitle: Fernsehfilm Deutschland 2022
  description: Ein sonniger später Nachmittag. Kein Grauen, keine Krähen, kein Unheil weit und breit. Burkhard "Butsch" Schulz hat seine schwere Verletzung auskuriert und fühlt sich vitaler als je zuvor. Und auch Viola Delbrück hat ihre Dämonen gut genug im Griff, um beinahe optimistisch und lebensfroh zu wirken. Gemeinsam schleppen die beiden Möbel in Butschs neue Wohnung, frotzeln über dies und jenes, als ein gellender Schrei durch das Treppenhaus schallt. Der Beginn eines Albtraums, der 20 Stunden dauern soll.
