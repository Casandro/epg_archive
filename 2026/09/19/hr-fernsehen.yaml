  title: Wohnen mal anders
  description: 'Ein Herrenhaus mit geschichtsträchtigem Turm, ein Haus auf einer Brücke, eine ehemalige Kirche - in Hessen lässt es sich außergewöhnlich wohnen. In der Reportage besucht das hr-fernsehen hessische Wohngeschichten, die zeigen: Das eigene Zuhause kann weit mehr sein als vier Wände und ein Dach. Acht kurze Episoden zeigen ganz individuelle Wohnkonzepte.'
