- eventId: 463398
  start: 2026-09-19T22:00:00Z
  stop: 2026-09-19T22:10:00Z
  title: Süd Blick Teil 1 (Wh.)
  subtitle: Tag der Demokratie in Rosenheim +++ Prozessstart in einem grausamen Fall am Landgericht Traunstein +++ Die Brotprüfung 2026
  description: 'Beim Demokratietag in Rosenheim betonten die Omas gegen Rechts, dass Demokratie nur durch Beteiligung im Alltag trägt: Engagement in Schule und Verein, respektvoller Umgang, verlässliche Medien und Gleichberechtigung sollen Grundrechte sichern. +++ Vor dem Landgericht Traunstein hat am Dienstag der Prozess gegen eine 55-Jährige aus dem Landkreis Rosenheim begonnen: Sie soll die Tochter einer Freundin vergewaltigt, kinderpornografisches Material gesammelt und sexuelle Handlungen mit einem Hund vorgenommen haben. +++ In Rosenheim werden heute und morgen Brote regionaler Bäckereien streng geprüft: Experten bewerten Form, Farbe, Kruste und Krume, riechen und kosten, bevor Zertifikat und Urkunde vergeben werden.'
- eventId: 641532
  start: 2026-09-19T22:10:00Z
  stop: 2026-09-19T22:20:00Z
  title: Süd Blick Teil 2 (Wh.)
  subtitle: Zahlen Daten Fakten zum Schulbeginn in Bayern +++ Eine heiße Freibadsaison endet +++ Das Attler Herbstfest 2026 - Inklusion trifft auf Tradition
  description: 'In Bayern startet das Schuljahr mit 1,8 Millionen Schülern, darunter 132.000 Erstklässler: Ministerin Anna Stolz setzt auf Basiskompetenzen, neue Leistungsformen neben Tests, eine praxisnähere Mittelschule, digitale Balance mit Handyverbot bis Klasse 7, mehr Sportgrundschulen und 4. +++ Nach dem heißen Sommer endet die Rosenheimer Freibadsaison mit Rekord: 117.104 Gäste bis 7. September, viele Familien und gut besuchte Wettkämpfe inklusive; nahtlos geht es weiter, denn heute öffnet das Hans-Klepper-Hallenbad. +++ Mit Böllerschüssen der Edlinger Schützen ist am Freitag das 53. Attler Herbstfest eröffnet worden, danach zog der Festzug ins Zelt, wo der neue Stiftungschef Jan Wiedemann bei seinem ersten Herbstfest gemeinsam mit Schirmherr Sepp Schauer anzapfte.'
