- eventId: 519663
  start: 2026-09-19T10:00:00Z
  stop: 2026-09-19T10:10:00Z
  title: Süd Journal Teil 1 (Wh.)
  subtitle: Spatenstich für Campus K-RO 14 +++ Die Trockenheit im Sommer und unsere Fluesse +++ Nachrichten kompakt
  description: 'In Großkarolinenfeld entsteht an der Aiblingerstraße 14 mit K-RO 14 ein Campusgebäude der TH Rosenheim mit smarten, teils barrierefreien Appartements und Gemeinschaftsräumen, das auch dank Unterstützung aus Politik und Wirtschaft zügig vorankommt. +++ Der Sommer hat Bayern ausgedörrt: In Passau erreichte die Donau laut Gewässerkundlichem Dienst den niedrigsten Pegel seit Messbeginn und unterbot den Rekord von 1962, auch im Alpenraum wie in Ramsau bei Berchtesgaden ist die Trockenheit deutlich sichtbar. +++ Beim dritten ÖPNV-Gipfel der Euregio Inntal in Kufstein berieten 60 Vertreter aus Bayern und Tirol über bessere grenzüberschreitende Mobilität, während in Lampoding ein Stall neben einem Wohnhaus brannte, 120 Kräfte Schlimmeres verhinderten und zwei Verletzte ins Krankenhaus kamen.'
- eventId: 640991
  start: 2026-09-19T10:10:00Z
  stop: 2026-09-19T10:20:00Z
  title: Süd Journal Teil 2 (Wh.)
  subtitle: Tag der Zivilcourage am 19. September +++ Ein Jahr Verkehrsfreigabe der Westtangente
  description: Zum Tag der Zivilcourage erinnert die Aktion daran, in Notlagen hinzuschauen und zu helfen, doch viele sind bei Erster Hilfe oder Eskalationen unsicher, weshalb wir mit Johanniter-Sprecher Gerhard Bieber aus Oberbayern Südost über richtiges Handeln sprechen. +++ Ein Jahr Verkehrsfreigabe der Westtangente
- eventId: 640992
  start: 2026-09-19T10:20:00Z
  stop: 2026-09-19T10:30:00Z
  title: Süd Journal Teil 3 (Wh.)
  subtitle: Gedenken an Opfer des Faschismus in Bad Reichenhall +++ Hommage an die wilden Blüten - Lesung einer Fotografin +++ Wetter für das Sendegebiet
  description: Der Verein Berchtesgadener Land gegen Recht rief in Bad Reichenhall zum Gedenken an die Opfer des Faschismus auf und stellte regionale Schicksale von Verfolgten und Ermordeten in den Mittelpunkt, unter dem Motto Nie wieder ist jetzt. +++ Was passiert, wenn man einer Wiese über Jahre hinweg beim Wachsen und Vergehen zusieht? Genau dieser Frage widmet sich die Fotografin Verena von Gagern-Steidle. In Burghausen verbindet sie ihre fotografischen Beobachtungen nun mit einem bislang unveröffentlichten Text über die wilden Blüten. +++ Der 100-jährige Wetterkalender verspricht zur Septembermitte freundliche, fast spätsommerliche Tage, ist aber keine verlässliche Prognose, sondern ein charmanter Blick auf alte Ordnungssuche im Jahreszeitenwechsel, passend zum Licht über Voralpen und Seen in Südostoberbayern.
- eventId: 640993
  start: 2026-09-19T10:30:00Z
  stop: 2026-09-19T10:45:00Z
  title: Süd Kultur Teil 1 (Wh.)
  subtitle: Welthits mit The Frontmen
  description: 'Nach dem Rosenheimer Herbstfest startet Bad Aibling mit dem Gitarrenfestival Saitensprünge: Die Frontmen, Ex-Sänger von Sweet, Hollies und 10cc, spielen Welthits und eigene Songs akustisch mit drei Gitarren und dreistimmigem Gesang.'
