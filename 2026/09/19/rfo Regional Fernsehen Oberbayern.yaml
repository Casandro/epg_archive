  description: 'In Bayern startet das Schuljahr mit 1,8 Millionen Schülern, darunter 132.000 Erstklässler: Ministerin Anna Stolz setzt auf Basiskompetenzen, neue Leistungsformen neben Tests, eine praxisnähere Mittelschule, digitale Balance mit Handyverbot bis Klasse 7, mehr Sportgrundschulen und 4. +++ Nach dem heißen Sommer endet die Rosenheimer Freibadsaison mit Rekord: 117.104 Gäste bis 7. September, viele Familien und gut besuchte Wettkämpfe inklusive; nahtlos geht es weiter, denn heute öffnet das Hans-Klepper-Hallenbad. +++ Mit Böllerschüssen der Edlinger Schützen ist am Freitag das 53. Attler Herbstfest eröffnet worden, danach zog der Festzug ins Zelt, wo der neue Stiftungschef Jan Wiedemann bei seinem ersten Herbstfest gemeinsam mit Schirmherr Sepp Schauer anzapfte.'
