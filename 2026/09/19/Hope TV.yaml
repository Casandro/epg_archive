  title: Bibelkompass
  subtitle: Die beste Nachricht der Welt
  description: |-
    Gute Nachrichten sind selten geworden. Doch die Bibel spricht von einer Botschaft, die unabhängig von Krisen und Umständen immer gute Nachricht bleibt: dem Evangelium. Schon die Propheten kündigten die Ankunft des Messias an, der Rettung, Vergebung und Hoffnung bringen würde. Jesus verkündigte diese gute Nachricht und zeigte durch sein Leben, seinen Tod und seine Auferstehung, was Gottes Reich bedeutet. Das Evangelium schenkt Vergebung, Freiheit und einen Neuanfang - und hat bis heute die Kraft, Leben zu verändern. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Mediathek. Um 20:15 Uhr auf Hope TV. Moderation: Pastor Michael Dörnbrack.

