  title: Charakterwerkstatt
  subtitle: Wieder gut sein | Vergebung und Friedfertigkeit
  description: |-
    Was bedeutet es, nach einem schweren Fehler wirklich neu anzufangen? Und warum wartet Gott nicht einfach, sondern kommt uns entgegen?

    Anhand des Gleichnisses vom verlorenen Sohn in Lukas 15 spricht diese Folge über Scham, Reue und die erstaunliche Liebe des Vaters. Sie zeigt, dass echte Vergebung Wiederherstellung bedeutet und dass Gottes Gnade größer ist als unser Versagen.

    Gleichzeitig richtet sich der Blick auf den älteren Bruder, dessen verletzte Gefühle und fehlende Wertschätzung deutlich machen, wie wichtig unser Gottesbild für den Umgang mit anderen ist. Die Gesprächsrunde ermutigt dazu, den ersten Schritt zur Versöhnung zu wagen, Bitterkeit loszulassen und selbst dort Liebe zu zeigen, wo Beziehungen zerbrochen sind.

    Weitere Infos unter: www.hopetv.de
