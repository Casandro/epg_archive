  title: Bürgeranwalt
  description: "Einzelbett für ALS-Patient verweigert\nHerr W. leidet seit mehreren Jahren an amyotropher Lateralsklerose (kurz ALS). Der 74jährige kann nicht mehr sprechen und wird in der Nacht von heftigen Hustenanfällen geplagt. Auf Anraten seines behandelnden Arztes will Herr W. eine Reha besuchen, allerdings wurde ihm von der PVA nur ein Doppelzimmer genehmigt - obwohl seine Frau für ihn ein Einzelzimmer in einer entsprechenden Einrichtung in der Steiermark organisieren konnte und die Familie auch den Einzelzimmerzuschlag bezahlen würde.\n\nNun doch Assistenz für Kinder mit Diabetes-Typ-1\nAn Diabetes-Mellitus-Typ-1 erkrankte Kleinkinder bekamen in der Steiermark nicht mehr überall eine 1:1 Betreuung, die ihnen den Besuch von öffentlichen Kindergärten sichern würde. Die zuständigen Behörden argumentierten, dass es sich um eine \"chronische, noch beeinflussbare Erkrankung\" handle und - dass die \"gesetzlichen Voraussetzung für die Anerkennung als Mensch mit Behinderung im Sinne des Steiermärkischen Behindertengesetzes nicht erfüllt werden\". \n\nKonflikt um Balkonverglasung\nSusanne S. will den Balkon ihrer Eigentumswohnung mit Sonnenschutzglas verbauen. Eine Beschattungsmaßnahme, für die die Niederösterreicherin nach dem Wohnungseigentumsgesetz, kurz WEG, die Zustimmung aller Miteigentümer und Eigentümerinnen der Wohnhausanlage braucht. In ihrem Fall sind das 61 Parteien - drei sind dagegen."
  genre:
  - '130'
