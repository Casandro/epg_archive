  title: Polt muss weinen
  description: |-
    (Fernsehfilm, AUT 2000)
    Nach dem gleichnamigen Roman von Alfred Komarek
    Simon Polt ist Gendarm. Die kleine Welt in seinem Dorf im Weinviertel ist in Ordnung, bis plötzlich ein Todesfall die Zeit der Weinlese überschattet. War es ein Unfalltod durch Gärgas oder Mord? Polt hat Zweifel.
    Mit Erwin Steinhauer (Simon Polt), Hans-Michael Rehberg (Friedrich Kurzbacher), Hans Clarin (Karl Brunner), Fritz Egger (Ernst Höllenbauer), Peter Faerber (Josef Schachinger), Michou Friesz (Grete Hahn), Heidy Forster (Frau Hahn), Monica Bleibtreu (Aloisia Habesam) u.a.
