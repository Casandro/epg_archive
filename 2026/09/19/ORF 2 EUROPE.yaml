  title: Erwin Steinhauer - Ein Roadmovie zum Geburtstag
  description: "Erwin Steinhauer, einer der beliebtesten Schauspieler im deutschsprachigen Raum, wird 75 Jahre alt und aus diesem Anlass zeigt der ORF ein unterhaltsames Portrait des Ausnahme-Künstlers. \nGemeinsam mit seinem Sohn und Schauspielkollegen Matthias Franz Stein macht er sich auf den Weg, um wichtige Stationen seines Lebens zu besuchen. Die beiden treffen auch bekannte WeggefährtInnen und FreundInnen - wie Ulrike Beimpold, Rupert Henning und Alfred Komarek. Es ist aber nicht nur eine gemeinsame Reise durch Erwin Steinhauers Vergangenheit, sondern auch ein Vater-Sohn-Roadmovie, denn gezeigt wird nicht nur der Künstler, sondern auch der Privatmensch dahinter, der Familienvater, Kollege und Freund. Die filmische Reise geht von Wien über das Weinviertel, Bad Ischl, Salzburg an den Millstätter See, Grado bis nach Valun, wo mit der Serie \"Der Sonne entgegen\" alles begann..."
  genre:
  - '35'
