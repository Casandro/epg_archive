  title: ZAPP
  subtitle: 'Plagiate in den Medien: Wer kontrolliert den Plagiatsjäger?'
  description: 'Ob die ehemaligen Spitzenpolitiker Annalena Baerbock, Robert Habeck, Thüringens Ministerpräsident Mario Voigt oder die heiß diskutierte Kandidatin für das Bundesverfassungsgericht Frauke Brosius-Gersdorf: Ihnen allen wurden Plagiate unterstellt. Und hinter all diesen Vorwürfen steckt der selbsternannte Plagiatsjäger Stefan Weber. Der Kommunikationswissenschaftler bietet seit Jahren die Erstellung seiner Gutachten gegen Bezahlung an. Zwar inszeniert sich Weber als unabhängiger Wissenschaftler, lässt sich jedoch gleichzeitig für politische Kampagnen einspannen. Zu seinen Auftraggebern gehören das rechte Medienportal NIUS und die AfD.'
