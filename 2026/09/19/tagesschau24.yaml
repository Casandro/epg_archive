  title: Der Schmerzkiller
  subtitle: Arzt mit neuer Therapie
  description: 'Kurt Mosetter will kein abgehobener Promiarzt sein, sondern ein Therapeut "aus der Mitte des Volkes". Seinen Kampf gegen den Schmerz trat der "Painkiller vom Gutachtal" vom Elternhaus aus an: Als sein Vater 24 Jahre - angeblich wegen MS - im Rollstuhl saß, studierte er nicht nur Medizin, sondern auch chinesische Heilmethoden in Nepal und entwickelte seine Myoreflextherapie, bei der bestimmte Druckpunkte massiert werden, um Verspannungen zu lösen.'
