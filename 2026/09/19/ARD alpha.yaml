  title: Gesundheit!
  subtitle: Die Bewegungs-Docs
  description: "* Bluthochdruck\nZwei Medikamente täglich - und trotzdem zu hoher Blutdruck: Anja Nicke fühlt sich erschöpft, kurzatmig und nach der Arbeit völlig ausgelaugt. \n* Bandscheibenvorwölbung\nStarke Rücken- und Beinschmerzen, hervorgerufen durch eine Bandscheibenvorwölbung, bestimmen Cathrine Peters Alltag. Mit Dehnübungen, manueller Therapie und gezieltem Muskelaufbau startet Cathrine ein konsequentes Trainingsprogramm. Die Schmerzintensität sinkt, Energie und Lebensfreude kehren zurück."
  subtitled: true
