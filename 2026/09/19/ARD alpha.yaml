  title: Expedition in die Heimat
  subtitle: Unterwegs in der Bregenzer Bucht
  description: 'Annette Krause erkundet die Bregenzer Bucht und ist zu Gast in den drei Anrainerländern: Schweiz, Österreich und Bayern. In der Schweiz macht sie eine Dampfzugfahrt ins malerisch gelegene Heiden. Dessen Bewohner kleiden sich gerne im Stil der Biedermeierzeit und feiern alle vier Jahre ein großes Fest. In Staad zeigt Nicole Stettler-Lindemann ihr das einzige Hundertwasserhaus der Schweiz. Ihr Vater hat das als Markthalle konzipierte Gebäude gemeinsam mit dem berühmten Architekten realisiert.'
- eventId: 529458
  start: 2026-09-19T13:15:00Z
  stop: 2026-09-19T14:00:00Z
  title: Wohnen mal anders
  description: 'Ein Herrenhaus mit geschichtsträchtigem Turm, ein Haus auf einer Brücke, eine ehemalige Kirche - in Hessen lässt es sich außergewöhnlich wohnen. In der Reportage besucht das hr-fernsehen hessische Wohngeschichten, die zeigen: Das eigene Zuhause kann weit mehr sein als vier Wände und ein Dach.'
