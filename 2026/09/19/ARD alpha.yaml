- eventId: 529876
  start: 2026-09-19T20:35:00Z
  stop: 2026-09-19T21:15:00Z
  title: 'alpha-retro: Oktoberfest 1959'
  description: Fritz Straßner sitzt am Vormittag im Garten eines Bierzelts auf dem Oktoberfest und lädt die Zuschauer ein, mit ihm einen Tag lang über die Wiesn zu wandern. Davor jedoch verweist Straßner auf den berühmten Trachtenumzug durch die Münchner Innenstadt am ersten Wiesn-Sonntag. Danach geht es auf das Landwirtschaftsfest und von dort aus auf die eigentliche Wiesn mit Fahrgeschäften, Vogel-Jakob, Schießbuden, Bierzelten... Ein Film, der wunderbar die Wiesn-Atmosphäre Ende der 50er-Jahre vermittelt.
- eventId: 530946
  start: 2026-09-19T21:15:00Z
  stop: 2026-09-19T21:55:00Z
  title: 'alpha-retro: Wiesnfreud, Wiesnleid (1960)'
  subtitle: Elfie Pertramer auf der Wiesn
  description: 'Elfie Pertramer schlüpft auf der Wiesn in verschiedene Rollen, um zeigen, wie hart die Arbeit dort ist. Sie ist u.a. Bedienung, Breznverkäuferin, Opfer in der Geisterbahn, Rekommandeurin und Hochseilartistin. Und eine kleine Marilyn-Monroe-Persiflage gibt sie auch. Sie ist also frech wie immer und am Ende arg geschafft. Ein aufwendig gemachtes Feature, kurzweilig und humorvoll: Die wilde Elfie Pertramer ist nicht nur Darstellerin, sondern schrieb sich auch die herrlich ironischen Texte selbst.'
- eventId: 530947
  start: 2026-09-19T21:55:00Z
  stop: 2026-09-19T22:10:00Z
  title: 'alpha-retro: Hinter den Kulissen der Wiesn 1960'
  subtitle: Vierundzwanzig Stunden Wiesn
  description: 'Nicht alle Menschen, die sich in diesen 16 Tagen auf dem Münchner Oktoberfest befinden, vergnügen sich dort auch. Der Dokumentarbericht aus dem Jahr 1960 zeigt, wer alles zum Arbeiten auf der Wiesn ist: Straßenkehrer, Budenbesitzer, Polizisten, Hendlbrater ...Und wer damals klug genug war, sich nach etlichen Maß Bier nicht mehr mit dem Auto auf den Heimweg zu begeben, der konnte den Lotsendienst rufen und wurde mitsamt dem eigenen Auto nach Hause gebracht.'
- eventId: 530948
  start: 2026-09-19T22:10:00Z
  stop: 2026-09-19T22:25:00Z
  title: 'alpha-retro: Wiesn-Abschied 1966'
  description: Zum Abschied von der Wiesn 1966 bummeln die Münchner Abendschau in Person von Anneliese Fleyenschmidt, Ruth Kappelsberger, Wolf Mittler und Georg Lohmeier ein letztes Mal für dieses Jahr über die Wiesn. Es geht in die Bräurosl hinein und gleich wieder hinaus zum Kettenkarussell und die Geisterbahn. Lohmeier dirigiert die Bierzeltkapelle und fährt danach mit Frau Fleyenschmidt Achterbahn. Am Schluss des Films schimpft er mehrmals, dass sie in acht Bierzelten noch gar nicht drin gewesen seien.
- eventId: 530949
  start: 2026-09-19T22:25:00Z
  stop: 2026-09-19T22:35:00Z
  title: 'alpha-retro: Oktoberfest - Trachtenumzug (1958)'
  subtitle: Deutschland 1958
