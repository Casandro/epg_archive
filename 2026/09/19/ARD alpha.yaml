  title: SMS - Schwanke meets Science
  subtitle: Der menschliche Zellatlas
  description: Warum werden wir krank? Und was hält uns gesund? Das Helmholtz-Zentrum München untersucht, welche Bedeutung Umweltfaktoren, Lebensstil und individuelle genetische Disposition bei der Entstehung von Krankheiten haben. Daraus entwickeln die Forscherinnen und Forscher Möglichkeiten zur Prävention, Diagnose und Therapie. Besonders im Fokus stehen weit verbreitete Volkskrankheiten wie Diabetes, Allergien und chronische Lungenerkrankungen.
  genre:
  - '144'
- eventId: 529615
  start: 2026-09-19T15:00:00Z
  stop: 2026-09-19T15:45:00Z
  title: MERYNS sprechzimmer
  subtitle: Im Takt des Lebens - Unser Herz
  description: Ein gesundes Herz ist die Grundlage für ein langes und vitales Leben. Doch es ist auch ein sensibles Organ, das auf Stress und ungesunde Gewohnheiten reagiert. Herz-Kreislauf-Erkrankungen zählen in Österreich und Deutschland zu den häufigsten Todesursachen. Daher ist es essenziell, das Herz zu pflegen - wie hält man sein Herz also gesund?
