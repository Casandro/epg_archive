  subtitle: Von Ravenna nach Parma
  description: '"Der Bauch Italiens" wird die Emilia Romagna gerne genannt. Denn aus der Region stammen zahlreiche Spezialitäten, die weltweit bekannt sind: Schinken aus Parma und der ebenfalls nach der Stadt benannte Parmesan und die Pasta Bolognese, die in Bologna ganz anders heißt. Tamina Kallert reist im Norden Italiens von Ravenna bis nach Parma. Ravenna war in der frühchristlichen Zeit eine Metropole und ist auch heute noch voll von aufwendigen Kunstschätzen.'
