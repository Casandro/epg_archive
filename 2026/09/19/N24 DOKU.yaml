  title: Nur die Harten kommen in den Garten - Hightech-Gartengeräte
  subtitle: Nur die Harten kommen in den Garten - Hightech-Gartengeräte
  description: Die Auswahl an Heckenscheren, Kettensägen und Rasenmähern im Baumarkt ist enorm. Groß oder klein, elektrisch oder manuell - wie gelingt es Gärtnern und Heimwerkern bei all den verschiedenen Modellen den Überblick zu behalten? Die Reportage setzt verschiedene Gartengeräte auf den Prüfstand und zeigt, worauf es in Sachen Handhabung, Belastbarkeit und Sicherheit ankommt.
