  title: Im Schinkenhimmel - Spezialitäten aus Deutschland
  subtitle: Im Schinkenhimmel - Spezialitäten aus Deutschland
  description: 'Geräuchert, gepökelt oder luftgetrocknet: In ganz Deutschland sind variationsreiche Schinkenspezialitäten zu finden. Einige Sorten, wie der Schwarzwälder Schinken, erfreuen sich weltweiter Beliebtheit, während andere nur unter wahren Kennern verbreitet sind. In dieser Reportage wird die Kunst der Schinkenproduktion begleitet, vom traditionellen westfälischen Knochenschinken, der gerne zum frischen Spargel gereicht wird, bis hin zum Regnitztaler Schinken, der als echte Rarität gilt.'
  widescreen: true
