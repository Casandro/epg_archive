  title: 'Dreamcars: Porsche Taycan Turbo S'
  subtitle: 'Dreamcars: Porsche Taycan Turbo S'
  description: 'Mit diesem Modell will sich Porsche an die Spitze der E-Mobilität katapultieren: dem Taycan Turbo S. Vier Jahre Entwicklung stecken in dem Sportwagen, der mit seinen 761 PS eine Geschwindigkeit von 260 Kilometern pro Stunde erreichen kann - angetrieben von einem 800-Volt-Bordnetz. Über drei Etagen erstrecken sich die Produktionsstraßen für die Herstellung des leistungsstarken E-Autos. Die Reportage gewährt einen Einblick in den modernen Fertigungsprozess im Porsche-Stammwerk Zuffenhausen.'
