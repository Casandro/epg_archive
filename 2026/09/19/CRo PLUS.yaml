  title: Mezi námi
  description: 'Magazín o národnostních menšinách v Česku. Libor Kukal zjišťoval, jaká je momentální situace s možným zmírněním vízových sankcí pro Bělorusy, jejichž nejbližší příbuzní žijí v Česku, a to v rozhovoru s Krystynou Šyjanok, ředitelkou Kanceláře demokratických sil Běloruska v Česku. Ngo Xuan Thang si povídal s podnikatelem Quang Luongem, a to o jeho coming-outu a o tom jak na queer identitu nahlíží zdejší vietnamská komunita, a jak Vietnamci žijící ve Vietnamu. Oleksandra Simochko oslovila lektorku a překladatelku Nataliu Shamrai, která mezi jiným učí ukrajinštinu české policisty a vysokoškolské studenty na UK. Moderuje: Iveta Demeterová. Připravila: Tajana Mančalová.'
