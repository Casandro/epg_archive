  title: Téma Plus
  description: Terorismus - Brigate Rosse. V březnu 1978 zastavila skupina mužů v Římě automobil, ve kterém jel někdejší italský premiér Aldo Moro. Zatímco jeho jeho ochranka byla postřílena, expremiér zmizel neznámo kam. Za dramatickými události stály takvané Rudé brigády. Italské teroristické organizaci, která se hlásila ke krajní pravici a v 70. letech vyhlásila válku italskému státu, se ve třetím dílu speciální série Téma Plus věnuje Jan Sedmidubský.
