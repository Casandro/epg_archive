  title: Radiokniha
  description: 'Vladimír Škutina: Český šlechtic František Schwarzenberg (5/5). Prince Františka Schwarzenberga, šlechtice, politika a diplomata, představuje ve své knize český humorista, a publicista Vladimír Škutina. Zaznamenal například jeho názory na vznik československého státu nebo na prohlášení české šlechty v době Mnichovské dohody. Ale také vzpomínky na prvorepublikové politiky Tomáše Garrigue Masaryka, Jana Masaryka, nebo Edvarda Beneše. A uslyšíte i rodinné historky a humorné příběhy ze života ostatních šlechtických rodů. Pro rozhlas připravila Petra Hynčíková. V režii Miroslava Buriánka účinkuje René Přibil.'
