  title: Archiv Plus
  description: Havel se ptá Peroutky - to je příběh nepravděpodobného rozhovoru z roku 1968. Jeho záznam čekal přes třicet let na objevení a téměř šedesát let na odvysílání. Rozhovor natočil tehdejší dramatik a budoucí prezident Václav Havel v New Yorku s novinářskou legendou Ferdinandem Peroutkou. O čem si povídali začínající dramatik a dlouholetý novinář? O tom je speciál Archivu Plus, který připravil David Hertl.
