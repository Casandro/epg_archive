  description: Od roku 2022 plodnosť na Slovensku výrazne klesá a nie je to problém iba našej krajiny. Až 45 percent žien je ešte vo veku 30 rokov bezdetných. Pre generáciu po roku 2000 je vraj problém nájsť si vhodného partnera na založenie rodiny. Na jedného seniora dnes robia traja ľudia, ale tento pomer sa môže zásadne zmeniť. Dá sa demografická kríza ešte zvrátiť, alebo budeme nútení pracovať až do sedemdesiatky? Odpovie demograf Branislav Šprocha. (2026)
