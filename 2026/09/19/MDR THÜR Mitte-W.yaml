- eventId: 543069
  start: 2026-09-19T12:00:00Z
  stop: 2026-09-19T17:00:00Z
  title: Der Nachmittag
  subtitle: mit Toby Bräuer
  description: |-
    MDR THÜRINGEN - DAS RADIO unterhält Sie am Wochenende mit viel Musik, berichtet von sportlichen Höhepunkten und regionalen Ereignissen.
    Stündlich Nachrichten, dazu um 14.30, 15.30, 16.30, 17.30 und 18.30 Uhr aktuelle Meldungen, Stimmen und Live-Berichte von den wichtigsten Sportereignissen. Im Wettergespräch gegen 13:45 Uhr erfahren Sie, ob sich ein Ausflug lohnt oder ob Sie die Zeit besser gemütlich zu Hause verbringen sollten.


