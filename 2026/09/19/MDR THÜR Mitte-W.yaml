- eventId: 542797
  start: 2026-09-19T08:00:00Z
  stop: 2026-09-19T12:00:00Z
  title: Der Radiogarten
  subtitle: mit Amelie Urbanczyk
  description: |-
    Der Radiogarten ist Ihre Gartensendung bei MDR THÜRINGEN. Jeden Samstag von 10 bis 14 Uhr bekommen Sie wertvolle Gartentipps, Ideen für ein neues Do-It-Yourself-Projekt oder Infos zu Blumen, Sträuchern und Bäumen für Garten und Balkon. Außerdem berät Sie einmal im Monat MDR THÜRINGEN GARTEN Expertin Brigitte Goss am "Grünen Telefon". Egal, ob Sie im Kleingarten, in der Wohnung oder auf dem Balkon gärtnern, der Radiogarten ist Ihr informativer Begleiter durch den Samstagvormittag und hat auch für Bastler so einiges zu bieten.

