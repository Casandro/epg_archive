  title: Passato e Presente - talo Calvino il lab
  subtitle: Passato e Presente - talo Calvino il labirinto del mondo - Intellettuale impegnato e lucido e, Calvino è stato uno dei narratori più significativi del Novecento. Scrittore multiforme, ha sviluppato negli a
  description: "nni una narrativa innovativa che ha saputo combinare fantasia, riflessione filosofica e rigore strutturale. Una produzione, la sua, sempre curiosa del mondo, che ha fuso insieme sperimentazione e leggerezza e che, dall'esordio nel dopoguerra con opere legate al neorealismo, si è trasformata nei lunghi decenni della sua attività. Alla fine del secondo conflitto mondiale, Calvino, trasferisce nel campo culturale e politico l'esperienza della lotta partigiana e nel 1947 esce ''Il sentiero dei nidi di ragno'' ambientato durante la Resistenza. Iscritto al Partito comunista italiano, scrive sul quotidiano l'Unità. Poi, nel 1957, a seguito dell'invasione sovietica dell'Ungheria, esce dal Pci. E' il periodo dei suoi romanzi di critica sociale, ambientati durante il boom economico, un sistema che elargisce benessere e inganno, promesse e nevrosi. Nel 1967 si trasferisce a Parigi dove entra in contatto con un gruppo di intellettuali promotori di una letteratura fondata su vincoli matematici o giochi enigmistici. Per Calvino la letteratura è uno strumento per penetrare decodificare e interpretare la realtà, rendendo universali temi complessi come il rapporto tra realtà e immaginazione, scienza e poesia, ordine e caos. Grande anticipatore di riflessioni contemporanee sul linguaggio sull'identità e sulla percezione della realtà. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli \nCon la consulenza di Cristoforo Gorno \nProduttore esecutivo Valentina Tassini \nRegia Davide Frasnelli  \nOspite in studio la prof.ssa Barbara Berruti\nCon la partecipazione di Charlotte Marincola"
