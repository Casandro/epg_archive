  title: 'Dreamcars: Rimac CTwo'
  subtitle: 'Dreamcars: Rimac CTwo'
  description: 'Dass Supercars keinen Verbrennungsmotor brauchen, um zu Hochform aufzulaufen, hat Tesla bereits demonstriert. Auch der Rimac C Two ist rein elektrisch unterwegs, und er überzeugt mit beeindruckenden Werten: 97 km/h erreicht er in nur 1,85 Sekunden, seine offizielle Spitzengeschwindigkeit beträgt 415 Kilometer pro Stunde. Der kroatische Autobauer Rimac hat mit dem eleganten C Two ein erstaunliches Stück Technik vorgelegt, das obendrein mit modernsten Fahrerassistenzsystemen ausgestattet ist.'
  widescreen: true
- eventId: 985945
  start: 2026-09-19T15:31:00Z
  stop: 2026-09-19T16:23:00Z
  title: 'Legenden auf Rädern: Rolls-Royce - Die Kunst der Perfektion'
  subtitle: 'Legenden auf Rädern: Rolls-Royce - Die Kunst der Perfektion'
  description: 'Rolls-Royce steht wie keine andere Marke für Luxus, Perfektion und Ingenieurskunst. Die Reportage blickt hinter die Fassade des Mythos und erzählt die Geschichte eines Unternehmens, das weit mehr ist als ein Autohersteller. Zwischen Tradition und Innovation geht sie der Frage nach: Ist ein Rolls-Royce nur ein Fahrzeug oder das Versprechen von Vollkommenheit? Eine faszinierende Reise durch Vergangenheit, Gegenwart und Zukunft einer Legende.'
  widescreen: true
- eventId: 985946
  start: 2026-09-19T16:23:00Z
  stop: 2026-09-19T17:21:00Z
  title: Meisterwerke am Handgelenk - Kunst und Kult der Luxusuhren
  subtitle: Meisterwerke am Handgelenk - Kunst und Kult der Luxusuhren
  description: 'Wenn aus Zeit Kunst wird: Diese Reportage taucht ein in die faszinierende Welt der Luxusuhren. In der traditionsreichsten Manufaktur Patek Philippe spricht CEO Thierry Stern über den besonderen Herstellungsprozess. Bei Wempe in Glashütte wirft WELT einen Blick hinter die Kulissen der anspruchsvollen Ausbildung zum Uhrenmacher. Und: Ein leidenschaftlicher Sammler zeigt seine exklusivsten Stücke. Ein Uhrenmacher sein Labyrinth aus filigranen Mechanismen und ikonischen Modellen.'
  widescreen: true
- eventId: 985947
  start: 2026-09-19T17:21:00Z
  stop: 2026-09-19T18:17:00Z
  title: Man spricht Deutsch - Der größte Campingplatz Italiens
  subtitle: Man spricht Deutsch - Der größte Campingplatz Italiens
  description: Einen Katzensprung von Venedig entfernt liegt das Ferienidyll Marina di Venezia, der größte Campingplatz Europas. 12.000 Gäste können hier gleichzeitig dem Alltagstrott entfliehen - ein Großteil davon Deutsche. Client Manager Massimo und sein Team versuchen täglich, allen Urlaubern den Aufenthalt so erholsam wie möglich zu gestalten. Keine einfache Aufgabe, denn schon unglückliche Wetterbedingungen können Feiern und Events unter dem offenen Himmel Italiens buchstäblich ins Wasser fallen lassen.
  widescreen: true
- eventId: 985948
  start: 2026-09-19T18:17:00Z
  stop: 2026-09-19T19:09:00Z
  title: Power auf Achsen - Der Schwerlast-Selbstfahrer
  subtitle: Power auf Achsen - Der Schwerlast-Selbstfahrer
  description: Schwerlast-Selbstfahrer gelten als Transportwunder. Ihre Motoren haben mehr als fünfhundert PS und ihr wendiges Fahrwerk besitzt acht Räder pro Achslinie. Damit können sie nicht nur vorwärts und rückwärts, sondern auch seitwärts und diagonal fahren. Ob starke Steigungen, steile Gefälle oder schwierige Untergründe, sie sind wahre Geländeprofis. Sie ermöglichen es, Lasten bis zum Siebenfachen ihres Eigengewichts zu bewegen. Zum Einsatz kommen sie dann, wenn andere Transportsysteme versagen.
  widescreen: true
- eventId: 985949
  start: 2026-09-19T19:09:00Z
  stop: 2026-09-19T20:04:00Z
  title: BELL 429 - Alleskönner der Lüfte
  subtitle: BELL 429 - Alleskönner der Lüfte
  description: Die Bell 429 ist ein vielseitiger Hubschrauber, seit 2008 in Kanada gebaut und weltweit im Einsatz. Mit zwei 635-PS-Triebwerken kann sie in verschiedenen Ausführungen genutzt werden - von Rettungs- und Polizeieinsätzen bis hin zum VIP-Transport in Luxus-Ausstattung. Das Hauptwerk von Bell befindet sich in Mirabel, Kanada, wo alle zivilen Modelle gefertigt werden. WELT TV erhält als erster europäischer Sender Einblick in die Produktion der Bell 429.
  widescreen: true
- eventId: 985950
  start: 2026-09-19T20:04:00Z
  stop: 2026-09-19T21:08:00Z
  title: Heavy Metal - Panzerknacker im Einsatz
  subtitle: Heavy Metal - Panzerknacker im Einsatz
  description: Im verschlafenen 200-Seelen-Dorf Rockensußra in Nordthüringen werden einsatzfähige Panzer zu recyclebarem Schrott verwertet. Seit 1992 wurden dort bereits rund 17.000 Panzer und gepanzerte Fahrzeuge "demilitarisiert". Doch wie lassen sich diese Maschinen verschrotten, wenn sie gerade mit der Absicht gebaut wurden, unzerstörbar zu sein? Die Dokumentation wirft einen Blick hinter die Kulissen und begleitet die Panzerknacker bei ihrer schweißtreibenden und nicht minder gefährlichen Arbeit.
  widescreen: true
- eventId: 985951
  start: 2026-09-19T21:08:00Z
  stop: 2026-09-19T22:01:00Z
  title: NATO TIGER MEET - Raubkatzen der Lüfte
  subtitle: NATO TIGER MEET - Raubkatzen der Lüfte
  description: 'Das NATO Tiger Meet ist mehr als ein Manöver: Seit den 1960er-Jahren vereint es Flugstaffeln mit Raubkatzen im Wappen zu Training, Wettkampf und gelebtem "Tiger Spirit". Aus einem Treffen wurde eine komplexe Übung mit internationaler Dimension. Im Mittelpunkt stehen deutsche Crews des Taktischen Luftwaffengeschwaders 51 "Immelmann", die in Portugal anspruchsvolle Missionen fliegen. Der Film zeigt eindrucksvoll, wie Tradition, Teamgeist und modernste Technik ineinandergreifen.'
  widescreen: true
- eventId: 985952
  start: 2026-09-19T22:01:00Z
  stop: 2026-09-19T22:53:00Z
  title: Die Waffenkammer der Bundeswehr
  subtitle: Die Waffenkammer der Bundeswehr
  description: Seit der Gründung der Bundeswehr Mitte der Fünfzigerjahre haben sich die Waffen der Truppe enorm verbessert. Heute können die Soldaten auf modernste Feuerwaffen zurückgreifen. Von Handfeuerwaffen über Granatmaschinen bis zur Panzerfaust und noch größeren Geschützen gibt die Dokumentation einen Überblick über das Arsenal der deutschen Streitkräfte. Ein Blick in die Waffenkammer der Bundeswehr erklärt die Technik der Waffen und stellt ihre Einsatztaktiken vor.
  widescreen: true
- eventId: 985953
  start: 2026-09-19T22:53:00Z
  stop: 2026-09-19T23:36:00Z
  title: Die Deutsche Luftwaffe - Technik, Einsatz, Geschichte
  subtitle: Die Deutsche Luftwaffe - Technik, Einsatz, Geschichte
  description: Die Gründung der deutschen Luftwaffe liegt mehr als sechs Jahrzehnte zurück. Die jungen Jetpiloten werden damals in den USA auf den modernsten Strahlflugzeugen ausgebildet - und durchleben harte Lehrjahre. Mit der deutschen Wiedervereinigung verändert sich auch die Luftwaffe. Aus einer Verteidigungsarmee wird eine Einsatztruppe. Die Luftwaffe ist hochmobil und wird auch im Ausland eingesetzt. Bei Hilfs-, Rettungs- und Evakuierungseinsätzen, aber auch im Konfliktfall.
  widescreen: true
