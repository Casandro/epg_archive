- eventId: 819456
  start: 2026-09-19T21:00:00Z
  stop: 2026-09-19T22:00:00Z
  title: Pokochaj lub sprzedaj - Finlandia 1 (odc. 1)
  subtitle: Rodziny muszą zdecydować, czy remontować stary dom, czy kupić nowy. Architekt i agent nieruchomości rywalizują, przedstawiając im swoje wizje, co prowadzi do emocjonującej decyzji.
  description: |-
    Tytuł oryginalny: Remppa vai muutto Suomi
    FI, 2021
    Fińskie rodziny stają przed trudnym wyborem - odnowić dotychczasowy dom czy przeprowadzić się do nowego. Projektant wnętrz i agent nieruchomości rywalizują, by przekonać uczestników do swojej wizji idealnego miejsca do życia. Emocje narastają, gdy nadchodzi chwila ostatecznej decyzji.
  ageRating: 12
  genre:
  - '49'
- eventId: 819457
  start: 2026-09-19T22:00:00Z
  stop: 2026-09-19T22:50:00Z
  title: Gdzie tu coś zjeść? 1 (odc. 9)
  description: |-
    Tytuł oryginalny: Gdzie tu coś zjeść?
    PL, 2026
    Agnieszka i Ewa w wielkiej trasie po Polsce sprawdzają lokale polecane przez mieszkańców, w internecie ale też sprawdzają miejsca "w ciemno". W odcinku z Leszna bliźniaczki przeżyją chwile rozkoszy na antresoli, spróbują pierogów jak u mamy, dostaną nie tylko figę z makiem ale tez niebiańską pizzę z kroplą oliwy!
  ageRating: 12
  genre:
  - '35'
