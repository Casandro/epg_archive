  title: MDR KULTUR trifft Fridtjof Florian Dossin
  subtitle: Industriedenkmalpfleger, Projektleiter Reallabore des Instituts für Graue Energie e.V. Oßmannstedt
  description: "Fridtjof Florian Dossin treibt der Wunsch an, historische Orte neu zu beleben, leerstehende Immobilien als Ressource zu nutzen. Vor fünf Jahren kaufte der Industriedenkmalpfleger und Wissenschaftler Fridtjof Florian Dossin in dem Dorf Oßmannstedt in der Gemeinde Ilmtal-Weinstraße, nahe Apolda gelegen, einen 1939 erbauten und 25 Meter hohen Getreidespeicher. Zusammen mit Freunden und Kommilitonen aus Architektur und Denkmalpflege gründete er das Institut für Graue Energie e.V., übernahm den Vorsitz und ist Projektleiter der Reallabore. 13 Mitglieder gehören zum Verein, der inzwischen mit seinen Reallaboren auch in Sachsen-Anhalt, Sachsen und Brandenburg agiert, sich um den Erhalt und die nachhaltige Weiterentwicklung bestehender Gebäude, insbesondere von Industrie- und Bestandsbauten im ländlichen Raum einsetzt. \"Graue Energie\", betont Fridtjof Florian Dossin, ist kein Kunstwort. \"Graue Energie\" kommt aus dem Baumanagement und beschreibt die Energie, die in unserer Umwelt durch Gestaltungs- und Bauprozesse gebunden ist. Man habe den Begriff entlehnt, um auf ihn zu verweisen, um ihn bekannter zu machen und ihn mit dem Thema Bestandsgebäude zu verbinden, führt der Industriedenkmalpfleger aus. In Gebäuden steckt am meisten Energie, weil der Bauprozeß so energieaufwendig ist. Die Baustoffe müssen abgebaut, bearbeitet und auf die Baustelle transportiert werden. Energie, die man nicht sieht, daher \"Graue Energie\". Aber sie steckt im Gebäude, sagt Fridtjof Florian Dossin, und kann sie nachhaltig nutzen, wenn man das Gebäude erhält oder einer neuen Nutzung zuführt, das Kulturdenkmal, den Erinnerungsort als Ressource nutzt. Das Gelände rund um den Getreidespeicher Oßmannstedt war lange ein Schandfleck im Ort, eine große Brombeerhecke hatte alles komplett überwuchert. Inzwischen ist ein kleines Idyll entstanden, mit Sitzplätzen unter blühenden Bäumen. Der gelegte Wasser- und Stromanschluss fand seinen Platz in einem vorgelagerten Trafohäuschen. Das Erdgeschoss des Getreidespeichers wird als Vereinsraum genutzt in dem bald eine kleine Fachbibliothek einziehen soll. Im Keller wird eine Werkstatt entstehen. Schon jetzt wird zu Erzähl-Cafés geladen, Anfang September geschah dies in Zusammenarbeit mit der Gesellschaft zur Erforschung der Demokratiegeschichte. Am 13. 09. öffnete das Reallabor Getreidespeicher Oßmannstedt zum vierten Mal seine Türen zum Tag des offenen Denkmals, am 21.09 lädt das Institut für Graue Energie e.V. zur Sommerakademie in Hohenmölsen ein und präsentiert sich am 08.10 beim Forum Industriekultur Berlin. \n\nIn Jena wurde Fridtjof Florian Dossin 1995 geboren. Nach dem Abitur studierte er von 2014 bis 2018 Urbanistik an der Bauhaus-Universität Weimar und von 2018 bis 2021 Denkmalpflege an der Universität Bamberg. 2016 absolvierte Fridtjof Florian Dossin ein Praktikum im Thüringischen Landesamt für Denkmalpflege und 2017 im Bundesdenkmalamt Österreich, wurde studentischer Mitarbeiter u.a. an der Bauhaus-Universität Weimar, im Keramik Museum Bürgel und in der Bauhaus-Keramikwerkstatt Dornburg, war 2019 Werkstudent bei einem Kirchenmaler- und Restauratorenfachbetrieb in der Fränkischen Schweiz. Seit 2020 ist Fridtjof Florian Dossin wissenschaftlicher Mitarbeiter an der Bauhaus-Universität Weimar, forscht zu Fragen des industriellen Erbes, der Baukultur, der Transformation von Bestandsgebäuden und schreibt an seiner Promotion mit dem Arbeitstitel \"Erinnerung an Arbeit. Die Betriebsmuseen der VEB in der DDR\". "
- eventId: 542937
  start: 2026-09-19T10:00:00Z
  stop: 2026-09-19T12:00:00Z
  title: MDR KULTUR am Mittag
  description: "* 12:15 Uhr - O _zapft is! Der Hype ums Oktoberfest \nHeute Mittag startet das Münchner Oktoberfest - wir fragen den Kulturwissenschaftler Prof. Gunther Hirschfelder von der Uni Regensburg nach dem globalen Hype um das Volksfest.\n\n* 12:30 Uhr - Wetter & Verkehr\n\n* 12:45 Uhr - MDR Kulturtipps \nVon Anne Sailer\n\n* 12:50 Uhr - Start der neuen MDR Kultur Studiosessions\nHeute startet die neue Staffel der MDR Kultur Studiosessions. Zu Gast bei Jan Kubon ist nach den 16:00 Uhr Nachrichten  die deutsch - nigerianische Soul und Folksängerin Tokunbo.\n\n* 13:15 Uhr - Krimi des Monats: Michael Idov \"Das Riga Komplott\"\nHeute gibt es eine absolut zeitgemäßen Krimi des lettisch-amerikanischen Autors Michael Idov - geboren in Riga, lebt er mittlerweile als Autor und Regisseur in Berlin und Los Angeles. Sein erster Krimi The Collaborators erschien 2024 und liegt nun in deutscher Übersetzung vor: Das Riga-Komplott ist unser Krimi des Monats, vorgestellt wie immer von Stefan Maelck .\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Neues Album von Pokey La Farge\nPokey LaFarge, der aus dem amerikanischen Bundesstaat Illinois stammt und heute in Maine lebt, gehört wie Jack White oder Dan Auerbach zu jenen Musikern, die mit alten Mitteln amerikanischer Popmusik einen erfrischenden Sound kreieren. Und Pokey LaFarge verkörpert diese Hinwendung zu Retro-Klängen auch mit seinem Aussehen. Jetzt hat dieser originelle Typ sein neues Album \"Rent Money\" heraus gebracht, das sich Freunde waschechter Americana mal anhören sollten. Andreas Dewald hat mit Pokey LaFarge darüber gesprochen.\n\n\nAktuelle Empfehlungen für das Wochenende."
- eventId: 543064
  start: 2026-09-19T12:00:00Z
  stop: 2026-09-19T14:00:00Z
  title: MDR KULTUR am Nachmittag
  description: "* 14:10 Uhr - Die großen Fragen: Ist der Öffentlich-Rechtliche Rundfunk neutral\"\n65 Prozent der Deutschen - so eine Umfrage aus dem letzten Jahr - halten den Öffentlich-Rechtlichen Rundfunk für glaubwürdig. D.h. aber auch, dass ein großer Teil der Bevölkerung das eben nicht tut. Ein großer Teil der Skeptiker kommt aus dem Lager der AFD und dem BSW. Die zentralen Vorwürfe sind Staatsnähe und Einseitigkeit. Aber stimmt das? Ist das wirklich so? Oder kommt das den Skeptikern nur so vor, ist das nur ein Bauchgefühl. Wissenschaftsjournalist Karsten Möbius will das genauer wissen und wie will er das machen? Natürlich mit Hilfe der Wissenschaft. Karsten Möbius fragt: Ist der Öffentlich-Rechtliche Rundfunk neutral? \n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Vorschau: DISKURS mit Jens Balzer\nUnd nun der Blick aufs weitere Programm, das uns heute Abend ab 19:05 Uhr zurück führt in die sogenannten Nullerjahre. Zunächst sah damals alles nach Vergnügen aus: Man ölte die Bärte und trug bauchfrei, Großstädter zelebrierten den \"Bionade-Biedermeier\", via Facebook wurden weltweite soziale Netzwerke geknüpft. In den Nullerjahren lebt der Mensch des Westens die maximale Selbstbestimmung, sorglos, befriedet. Doch die Feier der Freiheit zeigt bald ihre Schattenseiten. TV-Formate wie \"Big Brother\" bejubeln den gläsernen Menschen; das Ich wird zur Performance. Aus dem Silicon Valley heraus entwickelt sich eine neue Kultur des entgrenzten Konsums und der Monopolbildung; Peter Thiel und Elon Musk beginnen ihre Karrieren, Donald Trump steigt auf. Die offene Gesellschaft gerät unter Druck: 2001 beginnt der War on Terror, 2008 bricht die Weltwirtschaft ein und lässt die globale Ordnung erbeben. Brüche und Widersprüche standen dicht an dicht. Der Journalist Jens Balzer, bereits erprobter Analyst früherer Dekaden, hat mit \"Confusion Is Next - Das Jahrzehnt des Umbruchs\", eine detaillierte und pointierte Betrachtung all der Ereignisse zwischen 2000 und 2010 vorgelegt. Dabei schafft er es, Verbindungen zwischen großer und kleiner Politik, Kultur und gesellschaftlichen Debatten zu beleuchten und zu erklären. Was hat zum Beispiel \"Der Schuh des Manitu\" mit der Debatte um die Leitkultur zu tun? Hier schon mal ein kleiner Eindruck aus dem Gespräch. Von Hendrik Proske\n\n* 15:15 Uhr - Serie \"Babylon Berlin\" in TV \nEs ist ein Mammutprojekt, einmalig im deutschen Fernsehen: Zehn Jahre lang hat \"Babylon Berlin\" die Weimarer Republik zum Leben erweckt - das Nachtleben, die politischen Kämpfe, die Armut, den Größenwahn. Und mittendrin Kommissar Gereon Rath und die junge Charlotte Ritter, die für ihren Traumjob als Kommissarin kämpft. Jetzt kommt die fünfte und letzte Staffel. Sie nimmt die Zuschauer mit ins Jahr 1933. Hitler ist Reichskanzler, die Demokratie zerfällt - und der Tanz von \"Babylon Berlin\" ist endgültig vorbei. ARD-Kultur-Serienkritikerin Alexander Soyez über die finale Staffel von \"Babylon Berlin\".\n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:45 Uhr - Wie erforscht man alte Parfüms? - Woman in science Förderpreis für Dorit Brixius\nWie roch die Welt vor 300 Jahren? Und was erzählen Parfums und Schönheitsrezepte über deren Schöpfer und den Wissenstand der damaligen Zeit? Die Historikerin Dorit Brixius sucht Antworten darauf. Sie studierte in Potsdam, promovierte am Europäischen Hochschulinstitut in Florenz und forschte in Cambridge und Paris."
