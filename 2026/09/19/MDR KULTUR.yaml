  description: "Der Start der neuen Staffel der MDR Kultur Studiosessions.\n\nHeute zu Gast bei Jan Kubon, die deutsch - nigerianische Soul und Folksängerin Tokunbo (spr Tokumbo).\nMit der Neosoulband Tok Tok Tok feierte sie weltweite Erfolge. \n\nIn der Studiosession spricht sie über ihr neues 4. Solo - Album \"Lost and Found\", über die Lust am genauen Erzählen, die Musikstadt Hannover und natürlich gibt es Songs in speziellen Studiosessionversionen vom aktuellen Album."
- eventId: 543066
  start: 2026-09-19T14:30:00Z
  stop: 2026-09-19T16:00:00Z
  title: MDR KULTUR am Nachmittag
  description: "* 16:30 Uhr - Wetter & Verkehr\n\n* 16:45 Uhr - Michael Pedersen \"Der letzte Leuchtturm\"\nDer Sommer geht zu Ende, und wer dieser Zeit und diesem Gefühl noch ein wenig nachhängen möchte, dem sei der Roman \"Der letzte Leuchtturm\" vom Michael Pedersen empfohlen. Es ist das Debüt des Autors, sein erster Roman. Dabei ist Michael Pederson, Jahrgang 1984 gar nicht mehr so jung und als Autor alles andere als ein unbeschriebenes Blatt. Der Schotte ist ein bekannter Lyriker und insofern außerordentlich populär, als er ein begabter Performer seiner Texte ist.\nSein Romandebut ist bei uns unter dem Titel \"Der letzte Leuchtturm\" erschienen, im Original heißt das Buch \"Muckle Flugga\" das ist der Name der Insel, auf dem besagter Leuchtturm steht und auf dem sich die Handlung des Buches zuträgt. Sabine Frank hat es für uns gelesen.\n\n* 17:03 Uhr - MDR KULTUR Spezial Musik mit Petra Rieß\nDie Musikredakteure von MDR KULTUR stellen Neuerscheinungen aus dem aktuellen Musikmarkt vor. \nDie Auswahl reicht von Jazz, Pop, Weltmusik und Chanson bis Folk und Elektronik.\n\n\nAktuelle Empfehlungen für das Wochenende."
- eventId: 543261
  start: 2026-09-19T16:00:00Z
  stop: 2026-09-19T17:00:00Z
  title: MDR KULTUR Unter Büchern
  subtitle: Eine Sendung von Katrin Schumacher
  description: |-
    Unter Büchern schaut auf neue experimentelle Texte: Lyrik, Prosa und Poem - neue Formen locken in den Bücherherbst.

    * Kerstin Preiwuß: Rodeo. Der neue Gedichtband der Leipziger Dichterin und Professorin am Deutschen Literaturinstitut führt in die Biografie von Kay. Daraus entsteht ein irrer Ritt mit Vokabeln aus Politik, Geschichte, heutigem Medienbetrieb und sehr vielen Pop-Zitaten. Jörg Schieke stellt den Gedichtentwurf vor, der sehr wagemutig aufs Große und Ganze geht - auf das, was in deutscher Lyrik heute an Brüchigkeit, an Assoziationskraft, auch an Rücksichtslosigkeit möglich ist.

    * Siri Ranva Hjelm Jacobsen: Meeresbriefe. In ihrem ökozentrischen Prosapoem zieht uns die dänische Autorin in eine Korrespondenz zwischen den beiden Schwestermeeren Atlantik und Mittelmeer. In den Briefen erfahren wir vom Plan: endlich wieder zu einer einzigen Wassermasse zusammenzuwachsen, die dann die Erde bedeckt. Zart und klar kommt diese maritime Poesie daher - Katrin Schumacher stellt sie vor.

    * Wagnis Verlagsgündung: Wasser publishing. Einen Verlag zu gründen ist ein mutiges Unterfangen, das Stefanie Jaksch vor anderthalb Jahren gewagt hat und nun ihr drittes Programm vorlegt. Über dieses und über das Verlegen überhaupt ist sie im Gespräch bei Unter Büchern.

    * Björn Hayer (Hg.): Aus einer geschützten Ecke heraus lässt du den Raum entstehen. In diesem Band versammelt sich utopische Dichtung der Gegenwart - Zeitgenössische Lyriker*innen suchen nach Hoffnungspoetiken. Sie hinterfragen die Verantwortung des Menschen für seine Umwelt, kreieren neue Welten und scheuen nicht vor Kritik am Utopischen zurück. Jörg Schieke stellt die Anthologie vor.

    Aktuelle Buchbesprechungen, Interviews mit Autoren, Neues vom deutschen und internationalen Buchmarkt und von Büchermenschen aus Sachsen, Sachsen-Anhalt und Thüringen.
