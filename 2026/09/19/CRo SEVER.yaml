  title: Svět zvířat
  description: Krabice nad zlato, mléko raději bez laktózy. Hostem Světa zvířat dnes bude Lucie Oravcová, předsedkyně Spolku na ochranu zvířat Litoměřicko. Vysvětlí proč je pro kočky tak důležitý kvalitní masitý jídelníček a jaké škody dokáže napáchat zdánlivě nevinná miska klasického mléka. Dozvíte se, jak dopřát kočkám tu nejlepší péči. Přidáme i praktické tipy pro zdraví, péči a zábavu našich kočičích mazlíčků. Moderuje Slávka Brádlová.
