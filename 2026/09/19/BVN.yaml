  subtitle: Finland, Helsinki S20 E04. Jurre Geluk, Raïsha Zeegelaar, Max Terpstra, Sahil Amar Aïssa en Eva Eikhout laten zien hoe mooi onze planeet is en hoe je als reiziger met een duurzame en inclusieve instelling een verschil kunt maken.
  description: 'Eva Eikhout maakt een reis naar het hoge noorden: Finland. Een land dat bekendstaat om de stilste mensen ter wereld, maar Eva gelooft daar niks van. In Helsinki zoekt ze uit wat er achter die Finse stilte schuilgaat. Ze bezoekt een van de meest veelbelovende modeontwerpers van Finland in het Design District, maakt kennis met runolaulu, de oudste muzikale traditie van Finland, en sluit de avond af in de rebelse wijk Kallio, waar ze wordt uitgenodigd voor een rave in het bos. Ze eindigt haar bezoek aan Helsinki bij de jaarlijkse Pride-parade. (2026)'
