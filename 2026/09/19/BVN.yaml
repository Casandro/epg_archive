  title: Pointer Checkt
  subtitle: Hoe ziek word je van zonnebloemolie? S14 E02. Een onderzoeksjournalistiek programma dat mis- en desinformatie checkt die op sociale media wordt verspreid.
  description: 'Bakken, braden of frituren we gebruiken het allemaal: plantaardige oliën. Van zonnebloemolie tot koolzaadolie: ze staan in praktisch elke keuken. Maar volgens sommige influencers zijn ze slecht voor je. De oliën zouden hyperbewerkt zijn, te veel omega-6 bevatten en snel oxideren, waardoor je chronische ontstekingen, kanker en hartziekten zou krijgen. Hoe kan het dat de influencers die deze ideeën verspreiden en de wetenschappers die hen bekritiseren zich allebei op wetenschap baseren? We onderzoeken de feiten met voedingswetenschapper Coen Dros, die actief misinformatie over voeding bestrijdt op sociale media. (2026)'
  genre:
  - '32'
