  title: Vroege vogels
  subtitle: Springendal S23 E14. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: 'Kabbelende beekjes, velden vol orchideeën en statige bossen: dat is Springendal in Noord-Oost Twente. Natuurfilmer Stijn steekt zijn lens in het kraakheldere water en filmt de wonderenwereld van platwormen en haftenlarven. Bovenwater is de strijd losgebarsten voor het vliegend hert; mannetjes van deze enorme keversoort knokken elkaar uit de boom. De vrouwtjes leveren ook strijd. Zij eten het voedzame sap uit een boomwond en moeten daarbij hoornaars op afstand houden. Wanneer de avond valt, verschijnen de houtsnippen en de nachtzwaluwen ten tonele, die op slechts enkele meters van de filmcrew rond blijven dansen. (2026)'
