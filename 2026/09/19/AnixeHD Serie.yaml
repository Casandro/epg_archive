  title: Das Waisenhaus für wilde Tiere - Folge 86
  subtitle: Das Waisenhaus für wilde Tiere - Folge 86
  description: 'Die Wildhunde Tom und Jabu sollen mit einem Fußball dazu gebracht werden, ihre Kondition zu verbessern. Im Kampf um den Ball kriegen sie sich jedoch in die Haare. Tom hat an einem Vorderlauf eine große Wunde. Große Aufregung, beide Wildhunde müssen eingefangen werden. Raphael und Florian haben für die Zirkustruppe der Zebra-Mangusten ein verrücktes Experiment ausgearbeitet: ein Labyrinth aus Schläuchen und Karton, in dem rohe Eier versteckt werden. Die Mangusten sollen sie finden und selbst aufschlagen - was am Ende mehr oder weniger auch klappt.'
