  description: 'Das Legacy Hotel in Heraklion bietet 12 einzigartige Suiten, die jeweils das Leben und Werk berühmter Künstler der Stadt feiern: den Maler El?Greco, den Dichter Vitsentzos Kornaros und den Schriftsteller Nikos Kazantzakis. Eleganz, Komfort und kretische Kultur verbinden sich hier zu einem inspirierenden Erlebnis im Herzen von Heraklion. Mehr unter: www.kreta.de'
