  title: Unterwegs auf Europas Pilgerwegen (3)
  subtitle: Zum Klosterberg Mont-Saint-Michel
  description: 'Im Norden Frankreichs führt ein Pilgerweg von der Stadt Rouen zum Mont-Saint-Michel: einem Felsen im Atlantik, auf dem ein Kloster thront, das über Jahrhunderte eines der wichtigsten Pilgerzentren der christlichen Welt war. Seit dem 8. Jahrhundert preisen Gläubige hier den Erzengel Michael. Heute ist die historische Route von Rouen beinahe vergessen. Nur langsam wird sie von modernen Pilgern wiederentdeckt.'
