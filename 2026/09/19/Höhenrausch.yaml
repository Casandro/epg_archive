  title: Entdecker der Welt - Ein Date mit der Meerenge
  subtitle: Entdecker der Welt - Ein Date mit der Meerenge
  description: |-
    Die Bass Strait ist ein Wasserstreifen, der das australische Festland von Tasmanien trennt. Seeleute staunen über die starken Strömungen, da sie wissen, dass wilde Stürme die Meerenge doppelt so rau machen wie den Ärmelkanal. In einem todesmutigen Akt versuchen drei mutige Aussies, die gesamten 300 km über die Bass Strait von Ufer zu Ufer zu paddeln, kniend auf ihren Brettern. Das Abenteuer dauert mehrere Tage mit Zwischenstopps auf kleinen Inseln auf dem Weg. Zeb Walsh, Brad Gaul und Jack Bark müssen sich mit Krankheit, Muskelkater und Dehydrierung auseinandersetzen, abgesehen von Haien, Strömungen und bedrohlichen Wellen.
     AU 2015
