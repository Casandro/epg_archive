  title: Borgia - Ein heiliger Schwur
  subtitle: Borgia - Ein heiliger Schwur
  description: Rodrigo schickt Juan nach Spanien und Cesare zum Studium nach Pisa. Lucrezia, die schwer am Fieber erkrankt, wird von ihrer Mutter Vannozza gepflegt. Während im Konklave gestritten wird, bringt Cesares Geliebte einen Sohn zur Welt. Um Gottes Segen für Rodrigo zu erwirken und sein eigenes Leben nach Rodrigos Willen der Kirche weihen zu können, setzt Cesare den Neugeborenen auf einem Berggipfel aus. FR 2011
