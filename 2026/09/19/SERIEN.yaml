  title: Cedar Cove - Das Gesetz des Herzens - Wieder vereint
  subtitle: Cedar Cove - Das Gesetz des Herzens - Wieder vereint
  description: 'Jack, der Herausgeber des Lokalzeitung, und Olivia sind sich einig, Berufliches und Privates zu trennen, und es als Paar miteinander zu versuchen. Da platzt ein Besucher mitten in einen romantischen Abend: Jacks Sohn Eric. Er braucht Hilfe und Jack will - diesmal - alles richtig machen mit ihm. Doch dies erweist sich als schwieriger als gedacht. US 2012'
