  title: Die besondere Aufnahme
  description: |-
    Leopold Anton Kozeluch
    Klaviertrios
    Trio 1790
    Produktion: Deutschlandfunk / cpo 2026

    Leopold Anton Kozeluch war im späten 18. Jahrhundert einer der erfolgreichsten Komponisten Wiens und europaweit gefragt. Allein 60 Klaviertrios hat er komponiert. Das Trio 1790 setzt seine Kozeluch-Aufnahmen mit drei Klaviertrios fort, die auf schottischen, irischen und walisischen Volksliedern basieren.
