  title: Planet Weltweit - Chartres, die Farben des Himmels
  subtitle: Planet Weltweit - Chartres, die Farben des Himmels
  description: 'Weniger als 100 Kilometer südwestlich von Paris, inmitten der großen Ebene von Beauce, bekannt als die "Kornkammer" Frankreichs, ist die Kathedrale Notre-Dame de Chartres weithin sichtbar. Der Bildhauer Auguste Rodin nannte sie die "Akropolis von Frankreich". Auch die kunstvollen Glasmalereien der Kathedrale beeindrucken Besucher seit jeher. Im Schatten des Riesenbaus beherbergt die Gegend noch immer Werkstätten für Glasmalereien. Die "Maison Lorin" ist eine der letzten aus dem 19. Jahrhundert, die heute noch in Betrieb sind. Sie wird von Elodie Vally geführt, einer Meisterin ihres Fachs. Elodie Vally wuchs direkt an der Kathedrale auf und entwickelte bereits in ihrer Jugend eine Leidenschaft für die Glasmalerei. Heute leitet sie die "Maison Lorin" und erhält damit ein wichtiges Kulturerbe am Leben. Glasmalerei ist für Elodie eine Herausforderung an sich, ein Balanceakt zwischen den verschiedenen Eigenschaften von Glas: Glanz, Transparenz, Steifheit, Farbenvielfalt. Dazu kommt die Zerbrechlichkeit des Materials. In ihrer Werkstatt gewährt Elodie einen Blick zurück, fast so etwas wie einen Zeitsprung hinein ins Mittelalter. Auch für Jacques Loire ist die Glasmalkunst Berufung. Selbst mit seinen über 80 Jahren ist er noch immer äußerst kreativ im "Atelier Loire". Zusammen mit seinem Vater Gabriel schuf er schon vor Jahrzehnten beeindruckende Glaskunstwerke. So gestalteten beide Anfang der 1960er-Jahre die imposanten blauen Glassteine für den Neubau der Berliner Gedächtniskirche. Aktuell ist Jacques Loire mit der Glasarbeit für eine Krankenpflegeschule im japanischen Osaka beschäftigt. Wir verfolgen die einzelnen Arbeitsschritte bis das Gesamtkunstwerk schließlich in voller Schönheit erstrahlt.  DE 2011'
- eventId: 971865
  start: 2026-09-19T10:10:00Z
