  title: Planet Weltweit - Die Schwestern der Erde
  subtitle: Planet Weltweit - Die Schwestern der Erde
  description: In 1.000 Metern Höhe, auf dem Berg Ossa in Griechenland, liegt ein christlich-orthodoxes Kloster, das ausschließlich von Nonnen bewohnt wird. Sie stammen aus vielen Ländern und haben sich hier zusammen gefunden, um gemeinsam ein Leben in Eintracht und Gleichklang mit der Natur zu führen. GEO Reportage hat die Schwestern besucht. Das Kloster auf dem Berg Ossa wurde im 16. Jahrhundert gegründet. Ende des 20. Jahrhundert verfiel es und wurde erst Anfang des neuen Jahrtausends von Nonnen wieder entdeckt. In mühevoller Kleinarbeit renovierten sie das alte Gemäuer und bauten es bis heute zu einem kleinen, florierenden Landwirtschaftsbetrieb aus. Sie haben 30 Hektar Land und seine Gebäude in ein kleines Paradies verwandelt. Bevor ihnen das gelang, mussten sie roden, pflanzen, wiederaufbauen und das Kloster neu ausstatten. Da dieses auch das Haus Gottes ist, half ihnen, neben dem Tatendrang, ihre Liebe und der Glaube. Heute leben und arbeiten hier 20 Schwestern aus insgesamt 13 Ländern. Neben dem Anbau ihres eigenen Gemüses züchten die Frauen Schafe, Hühner und Kühe, von denen sie mit Milche, Käse und Eiern versorgt werden. Was sie nicht selbst benötigen, verkaufen sie. Bevor man in die Kloster-Gemeinschaft aufgenommen wird, muss man Prüfungen ablegen, vor den anderen und vor sich selbst. Eine Berufung zum Klosterleben sollte jedoch reiflich überlegt werden. Immer wieder kommen junge freiwillige Helferinnen ins Kloster, die das einfache und bescheidene Leben für sich testen möchten und sehen, wie sie mit der Enthaltsamkeit zurechtkommen. Auch Catherine gehörte einst zu ihnen. Die junge Amerikanerin kehrte nach ihrer Zeit als Praktikantin zurück und absolviert derzeit ihr Noviziat. Noch hat sie sich nicht für einen Lebensweg entschieden, hofft aber, durch die Zeit bei den Schwestern den rechten Pfad für sich zu entdecken. Mindestens zwei Jahre soll die Zeit bei den Nonnen dauern. Danach wird Catherine vielleicht ein Leben auf dem Berg Ossa führen. DE 2019
- eventId: 971919
  start: 2026-09-19T19:15:00Z
  stop: 2026-09-19T20:07:00Z
  title: Planet Weltweit - Island, von strickenden Männern und Pullovern
  subtitle: Planet Weltweit - Island, von strickenden Männern und Pullovern
  description: 'Island, das karge Land am Polarkreis, wo Menschen und Tiere ganz und gar ungerührt den Elementen wie Wind und Kälte trotzen. In den langen und kalten Wintern ziehen sich die Bewohner in ihre Häuser zurück und frönen einer uralten Leidenschaft: Sie stricken, und zwar Frauen und Männer! GEO Reportage hat den strickenden Isländern über die Schulter geschaut und feiert das Comeback des Islandpullovers. Musikmanager Petur Oddbergur Heimisson ist 35 Jahre alt und strickt seit seinem 12. Lebensjahr. Mit großer Leidenschaft fertigt er den traditionellen Islandpullover mit seinen Jacquard-Mustern und aus einer Wolle, die nur von isländischen Schafen stammt. Um mehr über die Geschichte des Islandpulllovers zu erfahren, begibt er sich auf eine Reise durch das Land, um dem Ursprung der Wolle, der einzigartigen Muster und der wundervollen Farben nachzugehen. Dabei entdeckt er, wie viel der legendäre Pullover mit den Wikingern, der atemberaubenden Landschaft und seinen Vorfahren zu tun hat. Und so verwundert es nicht, dass man in der Hauptstadt Reykjavík abends in den Cafés eine drollige Szenerie antrifft: Verheiratete Männer, Familienväter, Singles aller Berufsgruppen stricken beim Bier, manche begleitet von ihren Frauen. Sie bewegen sich auf den Spuren ihrer Vorfahren, denn Stricken war nicht nur unter Seeleuten, sondern auch unter Männern auf dem Land weit verbreitet. Die Freude, etwas Kreatives und zugleich Praktisches mit den eigenen Händen zu erschaffen, einer beruhigenden Tätigkeit nachzugehen und zeitgleich mit Freunden zu plaudern, sein Bier zu trinken oder fernzuschauen: Das macht Stricken so einzigartig. Die Nachfrage nach dem Original führt das kleine Land und seine strickenden Hände an seine Grenzen, woher die vielen Pullover nehmen, und wie vermeiden, dass auch hier die asiatischen Kopien den Markt erobern? Die Isländer hatten eine Idee... DE 2019'
- eventId: 971930
  start: 2026-09-19T20:15:00Z
  stop: 2026-09-19T21:07:00Z
  title: Planet Weltweit - Slowenien, Land des Honigs
  subtitle: Planet Weltweit - Slowenien, Land des Honigs
  description: 'Honig, die einheimische "Krainer Biene", die farbenfrohen Bienenkästen: All dies sind feste Bestandteile der Kultur Sloweniens. Der Imker Erik Luznar will die traditionellen Pfade des Hobbyimkerns verlassen und mit Bienen und Honig auch wirtschaftlich erfolgreich sein. Doch ausgerechnet dieses Jahr beginnt kalt und regnerisch. Eine Katastrophe für den Jungimker. GEO Reportage hat ihn besucht. Apis mellifera Carnica, die "Krainer Biene" ist der Stolz slowenischer Bienenzucht. Ihr Ursprung liegt in dem kleinen Balkanland. Vielfältige Landschaften sorgen für Pflanzenreichtum, ausreichend Nektar und sortenreinen Honig von höchster Qualität. Seit Jahrhunderten wird in Slowenien Bienenzucht betrieben. Die Imker engagieren sich mit Enthusiasmus für den Erhalt ihrer indigenen Honigbienen. Für die meisten Züchter bedeutet slowenische Imkerei ausschließlich Folklore und Tradition, keinesfalls aber ein kommerzielles Gewerbe. Eine neue Generation möchte dies nun ändern. Auch Erik Luznar möchte als Vollerwerbsimker durchstarten und hat dafür 300 Bienenvölker von Vater Janez übernommen. Bereits in vierter Generation stellt Familie Luznar aus dem slowenischen Oberkrain Honig her. Doch nach den ersten verheißungsvollen Jahren beginnt diese Saison kalt und regnerisch. Viele Bienen verhungern, und Erik muss sich etwas einfallen lassen, um die Tiere und sein Geschäft zu retten. So begibt er sich mit einem Teil seiner Völker auf Wanderschaft, um sie an anderer Stelle Pollen sammeln zu lassen. Eine Aufgabe, die durch die große Konkurrenz und den begrenzten Platz nicht einfach ist. Auch gibt es weitere Probleme, mit denen sich Erik herumschlagen muss: Die angestrebte Artenreinheit der Krainer Biene ist durch benachbarte italienische Bienen bedroht. Und auch Bären bereiten den Imkern zunehmend Sorgen. Wird es Erik schaffen, trotz dieser Herausforderungen sein Geschäft auch in dieser Saison am Leben zu erhalten? DE 2019'
