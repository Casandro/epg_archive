  title: Im Portrait
  subtitle: Lobpreis-Sänger Gunnar Sornek
  description: Gunnar Sornek, Lobpreis-Sänger aus Münster, spricht offen und persönlich über seinen Weg zum katholischen Glauben. In einem tiefgründigen Gespräch erzählt er, wie Musik ihn begleitet und der Lobpreis ein zentrales Element seines geistlichen Lebens wurde. Er schildert, warum der Glaube für ihn mehr als nur Tradition ist - nämlich eine lebendige Beziehung zu Gott, die seinen Alltag und seine Musik prägt. Eine inspirierende Sendung über Berufung, Musik und die Kraft des Glaubens.
