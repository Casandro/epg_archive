  title: Kirche in Not - Gesichter der Weltkirche
  subtitle: In Tansania sind die Menschen frei.
  description: 'Der Priesterseminarist Simon Kinyota stammt aus Tansania und brennt dafür, Muslime mit dem Christentum vertraut zu machen. Für diesen Zweck hat er sogar Arabisch gelernt, wundert sich über die europäische Scheu vor der Mission und sagt: "In Tansania darf jeder selbst über seinen Glauben entscheiden." Ein Gespräch über Glaubensfreude, respektvollen interreligiösen Austausch und die innere Unfreiheit im äußerlich freiheitlichen Europa.'
