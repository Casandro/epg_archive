  title: Himmel, Herz & Hirn
  subtitle: Sollten Christen Sport machen?
  description: "Ist es pure Eitelkeit, sich um seinen Körper zu kümmern und sportlich sein zu wollen? Oder ist Sport treiben vielleicht sogar eine christliche Tugend und Pflicht? \n\nIn dieser Folge besprechen wir ein Thema, bei dem viele Menschen kein gesundes Maß finden: Sport! \n\nUnsere Tipps:\n1. Mach einen Sport, der dir Spaß macht!\n2. Überlege: Was kann man vom Äußeren über mein Inneres ablesen? \n3. Einen fixen wöchentlichen Tag  für Sport wählen und gesunde Rezepte suchen!"
  widescreen: true
- eventId: 820226
  start: 2026-09-19T10:00:00Z
  stop: 2026-09-19T10:21:29Z
  title: EWTN Galerie - Leben im Kloster Mariendonk
  description: "Hinter Klostermauern verbirgt sich eine Welt voller Tiefe, Stille und überraschender Lebendigkeit. In der Abtei Mariendonk, einem Benediktinerinnenkloster nahe Kempen im Bistum Aachen, leben heute 20 Schwestern, die in dieser Dokumentation auf beeindruckend persönliche Weise ihre Geschichte erzählen.\nDie Schwestern berichten von ihrer Berufung, ihren inneren Wegen und den Entscheidungen, die ihr Leben geprägt haben. Er gewährt einen intimen Einblick in einen Alltag, der von Stundengebeten, Gemeinschaft und Arbeit getragen ist - und voller erfüllter, menschlicher Momente steckt. Geführt von der Regel des Heiligen Benedikt bezeugen sie Christus in der Welt.  \n\nFür den Heiligen Benedikt ist die Heilige Schrift bzw. das Evangelium die eigentliche Regel und Richtschnur für das klösterliche Leben. Deshalb reserviert er im Tagesablauf feste Zeiten für das Lesen und Meditieren der Heiligen Schrift und für das Studium theologischer Literatur, die dabei hilft, das Wort Gottes immer besser und tiefer zu verstehen. \nEine Dokumentation, die nicht nur informiert, sondern berührt. Sie zeigt, wie gelebter Glaube heute aussehen kann, und lädt dazu ein, die stille, aber kraftvolle Welt Mariendonks ganz neu zu entdecken."
  widescreen: true
