  title: Katholizismus
  subtitle: Das unerschöpfliche Geheimnis Gottes
  description: Bischof Barron reflektiert über die Aussage des heiligen Anselm, dass Gott derjenige sei, 'über den hinaus nichts Größeres gedacht werden kann' und erläutert die Argumente des heiligen Thomas von Aquin, die die Behauptung unterstützen, dass Gott wirklich existiert. Er spricht in dieser Folge auch über die Natur Gottes sowie über das herausfordernde Problem des Bösen, das dem Wesen Gottes widerspricht.
