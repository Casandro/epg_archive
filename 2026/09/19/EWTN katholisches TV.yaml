  title: Ehe gut - alles gut Staffel II
  subtitle: Nein sagen lernen
  description: "Wenn die Kinder selbständiger geworden sind oder gar schon das Haus verlassen haben, ergeben sich für Eltern neue Freiräume.\nNun müssen sie erkennen: Im jeweils anderen steckt ein größeres Potential, als im Erdenleben verwirklicht werden kann. \nWie können die Ehepaare nun einen Lebensstil entwickeln, der Zeit und Energie als begrenzte Ressource bejaht? Und wie können sie sich mit Rücksicht auf ihre Partnerschaft weiterentwickeln und auch ihren jeweiligen Hobbys und Neigungen in angemessener Freiheit nachgehen? \nWie finden sie da das richtige Maß? Da heißt es auch Nein sagen lernen.\nChristina Link-Blumrath und Schönstatt-Pater Elmar Busse diskutieren über dieses Thema mit dem Ehepaar Astrid Meier-Krei und Michael Krei."
  widescreen: true
