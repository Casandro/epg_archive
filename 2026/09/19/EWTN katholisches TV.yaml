  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: Die Bewahrung der Schöpfung
  description: |-
    Diese Woche bei Vaticano:
    Ein Jahr nach seiner Einweihung besuchen wir den Borgo Laudato Si' und zeigen, wie die Prinzipien der Enzyklika Laudato Si' dort in die Praxis umgesetzt werden. Anschließend blicken wir auf die globale Arbeit des Malteserordens und sprechen mit dem Augustinerpater John Abubakar über die Papst-Leo-XIV.-Nachhaltigkeitsmedaille. Schließlich werfen wir einen Blick in die Vatikanischen Gärten und treffen die Menschen, die diese historischen Anlagen pflegen und ihren Wandel hin zu einer ökologischen Bewirtschaftung vorantreiben.
