  title: Damals... Ein Jahrhundert im Wiesnrausch
  subtitle: Deutschland 2002
  description: "Die ältesten Filmaufnahmen vom Münchner Oktoberfest datieren aus dem Jahr 1910 und befinden sich im Archiv des Bayerischen Fernsehens. \nDie Filmautorin verfolgt die Geschichte der Wiesn von 1900 an, in ihr spiegelt sich der jeweilige Zeitgeist. In Interviews reflektieren und erinnern sich Schausteller von heute. Zu sehen ist unter anderem der Ehrengast Prinzregent Luitpold in Galauniform, dem seine bayerischen Untertanen vor dem Königszelt noch ihre Huldigungen darbrachten. Seither ist ein Jahrhundert im Wiesnrausch vergangen und es hat sich viel auf dem größten und berühmtesten Volksfest der Welt geändert."
