  title: Vatertage - Opa über Nacht
  subtitle: Fernsehfilm Deutschland 2012
  description: |-
    Basti, 36-jähriger Lebenskünstler, Rikschafahrer und Vollblut-Münchner, fällt aus allen Wolken: Vor seiner Haustür steht unerwartet die 17-jährige Dina und behauptet, seine Tochter zu sein. Unter dem Arm trägt sie ihr Baby Paul. Über Nacht vom Junggesellen zum Großvater mutiert, muss Basti weitere Turbulenzen fürchten. Denn Dina braucht keinen Vater, sondern einfach nur Geld. Davon aber jede Menge - und zwar sofort.
    Nur von Basti selbst oder seinem Rikscha-Unternehmen, den Wadlbeißern, ist nichts zu holen. So muss Basti sich plötzlich ganz schön abstrampeln, denn das ist erst der Anfang vom Chaos, das noch auf ihn wartet.
