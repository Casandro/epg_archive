  title: Die normale Wiesn
  subtitle: Deutschland 2017
  description: Ein Film über die Wiesn? Der Filmemacher Klaus Röder drehte viele Jahre auf dem Oktoberfest, vor allem in den 1990er Jahren. Eigentlich wollte er nie mehr dorthin. Doch dann hat er es noch einmal getan, auf der Suche nach der "normalen" Wiesn, so, wie er sie als Kind und Jugendlicher erlebt hat. Wo man noch durch die Straßen schlendern konnte, ohne hindurchgedrückt zu werden, gefangen in einer zäh fließenden Menschenmenge, der man nicht entrinnen kann.
