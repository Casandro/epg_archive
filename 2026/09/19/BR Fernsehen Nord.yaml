  title: 'Quarks: Regional und saisonal - was steckt hinter dem Trend?'
  subtitle: 'Moderation: Florence Randrianarisoa'
  description: |-
    Endlich Erntezeit! Beste Zeit für regionale und saisonale Lebensmittel! Diese sind im Trend. Denn sie sollen nicht nur die lokale Wirtschaft stärken, sondern auch der Umwelt guttun und sogar besser für unsere Gesundheit sein. Aber stimmt das alles?
    Viele wollen sich bewusster ernähren und sind bereit, dafür auch mehr Geld auszugeben. Marketing-Experten nutzen das und kleben immer öfter das Label "regional" auf die Tomate oder Heidelbeere. Dabei ist das kein geschützter Begriff. Ist die Tomate vielleicht sogar nur in der Region verpackt worden?
