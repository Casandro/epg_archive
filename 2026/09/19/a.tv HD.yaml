  title: Zeit zu Reden (Wh.)
  subtitle: mit Koch und Visionär Stefan Fuß
  description: 'Stefan Fuß betreibt den Goldenen Stern im Wittelsbacher Land. Ein Koch und Visionär: zwischen Bodenständigkeit, Tradition und Moderne. Traditionell, aber mit modernem Twist - dafür steht der Goldene Stern in Rohrbach nahe Friedberg. Stefan Fuß interpretiert bayerisch-schwäbische Gerichte neu und verwendet dafür ausschließlich regionale Produkte von Lieferanten aus der Region. 1903 wurde der Goldene Stern erstmals offiziell dokumentiert, jedoch bestehe der Gasthof in Rohrbach nahe Friedberg eigentlich schon seit 400 bis 500 Jahren, betont Stefan Fuß. Sein Opa sei der erste Besitzer aus der Familie gewesen. Nach zahlreichen Jobs in namenhaften Restaurants in München, London und Friedberg übernahm Stefan Fuß 2012 das Geschäft komplett und baute erstmal alles um, von der Außenfassade über die innere Struktur bis hin zur Vinothek, die 2017 dazukam. Dennoch ist es nach wie vor ein Familienbetrieb und alle helfen tatkräftig mit. Mit Angie Stifter'
