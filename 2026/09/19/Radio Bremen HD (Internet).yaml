  title: 'Die Nordreportage: Hofgeschichten'
  description: "Die Rinder sind los \nAuf Hof Sonnenschein im niedersächsischen Aurich hält Familie Poppen neben 400 Schweinen auch einige Rinder. Die sind aus ihrem Gehege ausgebrochen, denn auf dem Zaun war kein Strom mehr drauf. Bei den Tieren handelt es sich um Dexter, die kleinste Rinderrasse Europas. Hermann und Nadja Poppen halten die Miniaturrinder zur Grünlandpflege und demnächst möchten sie auch das Fleisch in ihrem Hofladen vermarkten. Jetzt müssen sie die unternehmungslustigen Tiere wieder einfangen und das Gehege wieder ausbruchsicher machen."
- eventId: 1027784
  start: 2026-09-19T10:00:00Z
  stop: 2026-09-19T10:45:00Z
  title: Unsere Geschichte - Made in Norddeutschland
  subtitle: Flensburger - Das Bier mit dem "Plopp"
  description: "Es gilt als das Bier mit dem herben Aroma - Flensburger. Gebraut in der nördlichsten Brauerei Deutschlands, abgefüllt in traditionellen Bügelflaschen, die beim Öffnen \"ploppen\". Bekannt wurde das Bier durch die Bölkstoff trinkende Comicfigur \"Werner\". \nSeit 125 Jahre ist das Unternehmen im Familienbesitz. Und entgegen dem Trend - bundesweit geht der Bierkonsum seit Jahren zurück - wächst der Umsatz. Wie kam es zu diesem kleinen Wunder im Norden? Der Film rekonstruiert die erstaunliche Geschichte des Unternehmens."
  genre:
  - '130'
