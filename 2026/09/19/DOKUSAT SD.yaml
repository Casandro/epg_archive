  title: Das Leben und Schicksal des Schwarzbuchs - Teil 2
  subtitle: Das Leben und Schicksal des Schwarzbuchs - Teil 2
  description: '"Das Werk wird Berichte von überlebenden Juden und Zeugen der Grausamkeiten enthalten. Die Tiefe der Tragödie darf nicht durch offizielle Dokumente oder Protokolle dargestellt werden, sondern durch lebendige Erzählungen.", so einer der Autoren des Schwarzbuchs.'
