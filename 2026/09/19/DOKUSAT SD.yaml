  title: Ben Cropp - Geheimnisvolles Australien
  subtitle: Ben Cropp - Geheimnisvolles Australien - Versunken im Südpazifik
  description: In diesem Dokumentarfilm sucht der Abenteurer und Naturfilmer Ben Cropp mit seinem Team nach den versunkenen Überbleibseln aus den Gefechten des Zweiten Weltkrieg im Südpazifik. Nachdem unzählige Wracks von Kriegsschiffen und Flugzeugen in den Kämpfen zwischen den USA und Japan auf dem Meeresgrund um die Salomon-Inseln ihre letzte Ruhestätte gefunden haben, hat Ben Cropp es sich zur Aufgabe gemacht, diese versunkenen Geheimnisse wieder ans Licht zu bringen.
