  title: Helden der Evolution - Schildkröten
  description: Schildkröten mögen langsam sein - langweilig sind sie auf keinen Fall. "Helden der Evolution" taucht ein in die geheimnisvolle Welt dieser besonderen Reptilien, die seit mehr als 220 Millionen Jahren die Erde bevölkern. Die rund 300 heute existierenden Arten haben sich perfekt an ihre jeweilige Umgebung angepasst. Sie leben an Land sowie in Flüssen und Meeren. Auch hinsichtlich Musterung oder Größe gibt es viele Variationen. Doch allen gemeinsam ist der Panzer. Er macht sie zu Ikonen des Tierreichs.
  widescreen: true
- eventId: 980389
  start: 2026-09-19T15:15:00Z
  stop: 2026-09-19T15:30:00Z
  title: Die Streuobstwiese - Herbst und Winter
  description: Im Herbst und Winter verwandelt sich die Streuobstwiese in ein ruhiges und malerisches Paradies. Die Blätter färben sich in leuchtenden Farben und fallen langsam zu Boden, während die Früchte reif sind und zur Ernte bereitstehen. In der winterlichen Stille bieten die kahlen Bäume und die mit Schnee bedeckte Landschaft einen zauberhaften Anblick. Die Streuobstwiese ist auch in den kalten Jahreszeiten ein Ort der Schönheit und des Rückzugs.
  widescreen: true
- eventId: 980390
  start: 2026-09-19T15:30:00Z
  stop: 2026-09-19T16:35:00Z
  title: Helden der Evolution - Krokodile
  description: Unter den Raubtieren dieser Erde genießen Krokodile nicht gerade den besten Ruf. Sie gelten als kaltblütige und vor allem hinterhältige Killer. Dabei folgen sie nur ihren biologischen Bedürfnissen und tragen damit zum ökologischen Gleichgewicht ihres jeweiligen Lebensraums bei. "Helden der Evolution" begibt sich ins kaum erforschte Reich der unterschiedlichsten Panzerechsen. Zu den weltweit über 20 Arten gehören Nilkrokodile, amerikanische Alligatoren und Kaimane sowie die riesigen indischen Gaviale.
  widescreen: true
