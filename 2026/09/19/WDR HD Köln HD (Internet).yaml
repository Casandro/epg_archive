  title: Einfach und köstlich
  subtitle: Anchovis-Carbonara & Hähnchen mit Graupen - Björn Freitag kocht mit Clara Hunger
  description: 'La Dolce Vita bei "Einfach & köstlich": Clara Hunger interpretiert die Carbonara neu - mit Anchovis statt Speck. Björn Freitag serviert ein knuspriges Mailänder Hähnchenschnitzel in Parmesan-Marinade, begleitet von Graupen-Risotto und Zucchini-Tagliatelle. Gemeinsam zeigen die beiden, wie sich italienische Lebensfreude und moderne Alltagsküche genussvoll verbinden lassen - in einem dritten, ganz besonderen Gericht mit Zucchini und Zitrone - fruchtig, herzhaft.'
