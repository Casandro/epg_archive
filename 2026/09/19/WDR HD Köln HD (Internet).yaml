  title: Kochen mit Martina und Moritz (10)
  subtitle: Länderküche Elsass - Schlemmen wie Gott in Frankreich
  description: "Die WDR-Fernsehköche Martina und Moritz sind heute wieder auf kulinarischer Reise. Dieses Mal geht es in die direkte Nachbarschaft nach Frankreich, genauer gesagt ins Elsass. \nAus Linsen wird zum Beispiel eine elegante Vorspeise, mit saftig gebratenen Kalbsnierchen. Es gibt den berühmten Coq au Riesling, einen in Riesling geschmorten Hahn. Die original Elsässer Fleischtorte servieren Martina und Moritz zu einem knackigen Salat aus fein gehobeltem Spitzkohl. Es gibt eine herzhafte Kartoffelpfanne mit Munsterkäse und zum Abschluss auch noch den besten Käsekuchen der Welt. Überprüfen Sie, ob dieser Superlativ stimmt."
