  title: Land & lecker - Kulinarische Schätze aus dem Teutoburger Wald (1/6)
  subtitle: Lippischer Pickert und Smashed Potatoes
  description: Am Rand des Teutoburger Waldes, in Lage, setzt Leonie Froböse auf moderne Landwirtschaft. Voller frischer Ideen ist die 25-Jährige in die Landwirtschaft ihrer Eltern eingestiegen. Zusammen mit ihrem Mann Janis kümmert sich die Junglandwirtin um Schwäbisch-Hällische Landschweine. Sie sind auch ihr kulinarischer Schatz. Zudem hält die Familie Angus Rinder in einem Rundstall, der zu allen Seiten offen ist. Von einer Plattform unter dem Dach lassen sich die Tiere gut beobachten. Hier serviert Leonie ihren Gästen Lippischen Pickert mit Zuckerrübensirup und Leberwurst vom Schwäbisch-Hällischen Schwein.
- eventId: 1033709
  start: 2026-09-19T15:45:00Z
