  title: Haus gesucht in Alaska
  subtitle: Episode 30
  description: |-
    Der Ausdehnung von Juneau sind natürliche Grenzen gesetzt, denn Alaskas Hauptstadt liegt in einem Tal, umgeben von Gletschern und Wasser. Freier Baugrund ist dort Mangelware, dementsprechend hoch sind die Immobilienpreise. Finden Bryan Ryder und Amy Kadinger in der Umgebung trotzdem ein gemütliches Zuhause? Makler Mike Ban hat für seine Kunden drei vielversprechende Eigenheime aufgetan. Das erste Objekt befindet sich auf Douglas Island, nur zehn Autominuten vom Stadtzentrum entfernt.
    USA 2014
  widescreen: true
- eventId: 953863
  start: 2026-09-19T11:30:00Z
  stop: 2026-09-19T12:30:00Z
  title: Sliders
  subtitle: Im Namen der Wissenschaft
  description: |-
    Archäologische Artefakte und ein göttlicher Superstar: Die "Sliders" erreichen eine Paralleldimension, in der jede Menge Überraschungen warten. Als sich die Gruppe mit Professor Jack Bigelow (Ken Jenkins) anfreundet, erfährt sie vom traurigen Schicksal der Metropole Los Angeles. Vor langer Zeit ist die Stadt einer tödlichen Naturkatastrophe zum Opfer gefallen. Heute zeugen nur noch Fundstücke im Erdreich von der fast vergessenen Ära. Rembrandts Double wurde damals als göttliche Stimme "The Voice" verehrt und sogar ein archaischer Timer taucht bei den Ausgrabungen auf.
    USA 2000
  widescreen: true
- eventId: 953914
  start: 2026-09-19T12:30:00Z
  stop: 2026-09-19T13:30:00Z
  title: Hercules
  subtitle: Die Rückkehr des blauen Priesters
  description: |-
    Hercules' Mutter Alkmene wird in Kürze König Jason von Korinth heiraten. Da der Regent seine Krone niederlegen muss, wenn er die unadelige Alkmene ehelicht, steht zudem der Posten als König zur Disposition. Nachdem Hercules dankend ablehnt, soll sein Halbbruder Iphicles den Thron von Korinth besteigen. Aber im Hintergrund droht ein feiges Mordkomplott: Hera hat den blauen Priester (Nathaniel Lees) losgeschickt, der Hercules im Zuge der Hochzeitsfestivitäten töten will. Zur Unterstützung hat der unheilige Priester ein Killerkommando angeheuert und das Seeungeheuer Perfidia heraufbeschworen.
    USA 1996
  widescreen: true
- eventId: 953915
  start: 2026-09-19T13:30:00Z
  stop: 2026-09-19T14:30:00Z
  title: Hercules
  subtitle: Eine besondere Gabe
  description: |-
    Der einfache Fischer Deon (David Drew Gallagher) hat unglaubliche Kräfte entwickelt. Offenbar ist der junge Mann in der Lage, anderen Menschen Befehle zu erteilen, die sie ohne Widerspruch ausführen müssen! Hercules findet heraus, dass göttliches Blut durch die Adern des Fischers fließt. Da Aphrodite seine Mutter ist, hat Deon die bislang unbekannte Superkraft hervorgebracht. Als ein Familienzwist entbrennt, in den auch Deons Onkel Karis (Grant Bridger) und seine Freundin Sirene (Greer Robson) verwickelt sind, übernimmt Hercules die Rolle des Mentors, damit Deon lernt, seine göttliche Macht für das Gute einzusetzen.
    USA 1996
  widescreen: true
- eventId: 953916
  start: 2026-09-19T14:30:00Z
  stop: 2026-09-19T15:30:00Z
  title: Hercules
  subtitle: Gleiches Recht für alle
  description: |-
    Als ein sinnloser Krieg zwischen Zentauren und Menschen bevorsteht, soll Hercules in dem Konflikt vermitteln. Im Fokus der Streitigkeiten befindet sich eine Trinkwasserquelle, zu der die Mischwesen bislang keinen Zugang haben. Während Ceridian (Tony Blackett) - Hercules' einstiger Mentor, der nun im Sterben liegt - für Frieden plädiert, schart Cassius (Julian Arahanga) eine bewaffnete Zentauren-Gruppe um sich, die er in die Schlacht führen will. Auch auf der Seite der Menschen gibt es Kriegstreiber, die im Geheimen ihre eigene Agenda verfolgen.
    USA 1996
  widescreen: true
- eventId: 953965
  start: 2026-09-19T15:30:00Z
  stop: 2026-09-19T16:25:00Z
  title: Xena
  subtitle: Familie Munster
  description: |-
    Auf der Suche nach ihrer Freundin Gabrielle reisen Xena und Joxer ins Heimatdorf der Bardin. Als das Duo Potidea erreicht, macht es eine erschreckende Entdeckung. Dort gibt sich Gabrielles totgeglaubte Tochter Hope als ihre Mutter aus. Auch Gabrielles Eltern und ihre Schwester Lila (Willa O'Neill) geraten dadurch in Gefahr. Zudem hat Hope eine grausige Bestie mit tödlichen Stacheln entfesselt. Der so genannte "Zerstörer" hat bereits Schafe gerissen und einen Mann im Wald getötet! Xena und die echte Gabrielle ziehen in den Kampf, um Hope und das Monstrum auszuschalten.
    USA 1998
  widescreen: true
- eventId: 953966
  start: 2026-09-19T16:25:00Z
  stop: 2026-09-19T17:20:00Z
  title: Xena
  subtitle: Bis dass die Laus uns scheidet!
  description: |-
    Das nomadische Reitervolk der Skythen bedroht einige Dörfer. Xena, Gabrielle und Joxer vereinen ihre Kräfte, um die Angreifer abzuwehren. Doch plötzlich tauchen unerwartete Probleme auf: Die Heldinnen werden von Läusen, Hautausschlägen und Fußpilz geplagt! Zum Juckreiz gesellen sich auch Verdauungsprobleme, was die Situation noch unangenehmer macht. Unterdessen gelingt es dem Kriegsfürsten der Skythen Xenas Pferd Argo zu stehlen. Nun hört der Spaß für die Kriegerprinzessin endgültig auf.
    USA 1998
  widescreen: true
- eventId: 953967
  start: 2026-09-19T17:20:00Z
  stop: 2026-09-19T18:15:00Z
  title: Xena
  subtitle: Krieg und Frieden
  description: |-
    Die Streitkräfte von Julius Caesar und Gnaeus Pompeius (Jeremy Callaghan) verwüsten ganze Landstriche. Als auch griechisches Territorium mitsamt unschuldigen Dorfbewohnern bedroht wird, spitzt sich die Lage weiter zu. Xena mobilisiert die Landbevölkerung und verbündet sich mit einem Söldner, um die Invasoren abzuschmettern. Angesichts der heranrollenden Übermacht schmiedet die clevere Kriegerprinzessin zudem einen Plan, wie sie die ohnehin zerstrittenen Römer gegeneinander ausspielen kann. Auch Gabrielle steht Xena im Kampf tapfer zur Seite, damit das Blutvergießen schnellstmöglich beendet wird.
    USA 1998
  widescreen: true
- eventId: 954010
  start: 2026-09-19T18:15:00Z
  stop: 2026-09-19T20:00:00Z
  title: Red Machine - Hunt or Be Hunted
  description: |-
    In den Wäldern Alaskas ist ein riesiger Grizzlybär unterwegs. Er hasst die Menschen, liebt ihr Fleisch. Sheriff und Bärenhüter Beckett Moore (Thomas Jane) muss grausam verstümmelte Personen bergen. Nach Jahren kehrt sein Bruder Rowan (James Marsden) in die heimatliche Wildnis zurück - auf der Suche nach seinem Freund Johnny. Dann verschwindet Becketts Frau Michelle. - Bart the Bear 2, ein im Jahr 2000 geborener  Grizzly Bär aus Alaska, spielte nach seinem Auftreten u. a. in "Game of Thrones" (2013) und Filmen wie "Dr. Doolittle 2" (2001) und "Into the Wild" (2007) die Tier-Rolle in "Red Machine".
    USA, CAN 2015
  widescreen: true
- eventId: 954011
