- eventId: 546884
  start: 2026-09-19T16:00:00Z
  stop: 2026-09-19T17:00:00Z
  title: Eine Stunde reden
  subtitle: mit Mario Neumann
  description: 'Tom Turner (67) ist Amerikaner und hat sein Leben lang als Orchestermusiker an der Bratsche gearbeitet. Sein Job hat ihn immer glücklich gemacht: "When I go to work, I go to play". Schon als Kind weiß er, dass er Musiker werden will - auch wenn er im Schulorchester absichtlich schlechter spielt, um nicht aufzufallen, erzählt Tom Turner im Bremen-Zwei-Podcast "Eine Stunde reden". Aufgewachsen in Detroit, führt ihn sein Weg über Philadelphia, Berlin und Minnesota nach Bremen in die Heimat seiner zweiten Frau. Jetzt beginnt für den ehemaligen Solobratscher ein neues Kapitel: Nach langer Pause greift er wieder zur Bratsche und spielt im Neuen Kammerorchester Bremen, diesmal ganz bewusst in der letzten Reihe.'
- eventId: 546885
  start: 2026-09-19T17:00:00Z
  stop: 2026-09-19T20:00:00Z
  title: Sounds
  subtitle: mit Till Lorenzen
  description: 'Das laut Eigenaussage größte Clubfestival Europas findet dieses Wochenende in Hamburg statt: das Reeperbahnfestival. Wir stellen ein paar der dort spielenden Bands vor. Außerdem: Conor Oberst, seine Musik und sein Einfluss auf jüngere Generationen. Und: Gretchen Parlato hat ein neues Album, ihr sechstes Studioalbum, veröffentlicht: "The Wise Ones" sowie neue Alben weiterer Musikerinnen und Musiker.'
  genre:
  - '96'
