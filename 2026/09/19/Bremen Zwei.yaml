  description: 'Zweimal hat Dominique Fils-Aimé den deutschen Nordwesten bereits begeistert: bei der Jazzahead 2023 und beim Kultursommer Oldenburg 2024. Nun kommt sie am 24. Oktober 2026 in die Bremer Glocke - präsentiert von Bremen Zwei.'
