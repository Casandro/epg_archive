  title: Live-Gäste
  subtitle: mit Tom Grote
  description: Pasquale Aleardi ist international gut aufgestellt. Den Pariser Kommissar "Dupin", den es wider Willen in die Bretagne verschlägt, spielt der Schweizer mit griechisch-italienischen Wurzeln so überzeugend, dass sogar Franzosen diese deutsche Serie gerne gucken. So schwer man ihn auf eine Nationalität festlegen kann, so vielseitig ist Pasquale Aleardi beruflich. Er spielt in deutschen Komödien genauso wie im US-Blockbuster oder am Broadway. Und tourt neben der Schauspielerei noch als Musiker.
