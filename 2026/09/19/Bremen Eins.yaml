- eventId: 552517
  start: 2026-09-19T11:00:00Z
  stop: 2026-09-19T16:00:00Z
  title: Das Wochenende
  subtitle: mit Anja Kwijas und Ariane Wirth und Michelle Brückner  und Severino Melchiorre
  description: "So klingt Wochenende: Alle Tore, Werder Bremen pur, mehr Regionalsport und alles was am Wochenende sonst noch wichtig ist.\n\nWir bleiben für Sie an Werder Bremen dran: Bremen Eins berichtet live aus der Fußball-Bundesliga und überträgt wie gewohnt die legendäre Schlusskonferenz der ersten Liga. \n \nDazu gibt es mehr Sport aus der Region und alles was für Ihr Wochenende in Bremen und Nordwest-Niedersachsen wichtig ist."
  genre:
  - '32'
- eventId: 546888
  start: 2026-09-19T16:00:00Z
  stop: 2026-09-19T18:00:00Z
  title: Die 80er Chart-Show
  subtitle: mit Roland Kloos
  description: "Einmal zurückspulen, bitte! Jeden Samstag begeben wir uns mit Ihnen auf eine Zeitreise zurück in die Charts der 1980er Jahre. Welche Songs waren in genau dieser Kalenderwoche in den deutschen Single Charts? Wir spielen sie für Sie! Zum Nochmal-Erleben und Neu-Entdecken. \nVon ikonischen Synth-Pop-Hymnen über legendäre Rockklassiker bis hin zu unvergesslichen Dance-Tracks. Titel, die eine ganze Generation geprägt haben und die heute wieder total angesagt sind. Dazu vergessene Schätze, die es neu zu entdecken gilt. \"Die 80er Chart-Show\", immer samstags von 18 bis 20 Uhr auf Bremen Eins."
  genre:
  - '32'
- eventId: 560296
  start: 2026-09-19T18:00:00Z
  stop: 2026-09-19T22:00:00Z
  title: Musikclub Party
  subtitle: mit Dörte Tebben
  description: '80er, 90er, 2000er oder die neuesten Party-Kracher - hier zählt nur eins: Spaß und gute Laune! Von Whitney Houston bis Black Eyed Peas, von AC/DC bis Avicii, von Backstreet Boys bis Dua Lipa - wir bringen die perfekte Mischung aus Kult-Hits und aktuellen Chartstürmern. Egal ob Rock-Klassiker, Dance-Hymnen oder Mitsing-Nummern - im Musikclub Party ist für jeden etwas dabei. Schmeißt die Anlage an und feiert mit uns!'
- eventId: 553096
