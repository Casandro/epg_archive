  title: Neumann und Böhling
  subtitle: mit Ansgar Langhorst
  description: |-
    Andreas Neumann und Dirk Böhling sind dran, an den Themen, die gerade en vogue sind!  Unerbittlich beantworten sie endlich all die Fragen, die zu Recht nie gestellt werden - investigativ, knallhart und nicht ganz ernst gemeint!
    Dazu gibt es ein Soundcheck-Spiel, Einblicke in gesellschaftliche und politische Zustände im Land, das eine oder andere Nostalgie-Quiz und die Krimireihe "Fünf Worte und ein Mord", bei dem die beiden Wortakrobaten aus fünf Begriffen, die ihnen von der Hörerschaft geliefert werden, einen Kurzkrimi basteln....
