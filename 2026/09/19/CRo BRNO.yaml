  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese povídku z knihy Mojmíra Vlašína Zase ty příhody ochránce přírody. Text Ukrajina třikrát jinak nám přečte Vladimír Hauser. Zazní literární pásmo věnované poezii zemřelé básnířky Lucie Slivečkové. Pod názvem Až skončím, vytesám si housle je připravil Radek Štěpánek, V režii Radima Nejedlého účinkuje Zdislava Pechová. Četba z knihy Jany Soukupové Brněnské mordy pokračuje šestou částí. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Arnoštu Goldflamovi popřejeme k 80. narozeninám.
