  description: Švedske škole ukidaju tablete i vraćaju se na tiskane knjige, tiho čitanje i vježbanje rukopisa. New York uvodi zabranu korištenja AI-ja od predškole pa do osmog razreda. Zašto zemlje koje su predvodile digitalizaciju obrazovanja naglo mijenjaju smjer?  "Postoje jasni znanstveni dokazi da digitalni alati oštećuju, a ne poboljšavaju učenje učenika", objavio je švedski Institut Karolinska u priopćenju o nacionalnoj strategiji digitalizacije u obrazovanju u zemlji. Je li hiperdigitalizirani pristup obrazovanja u zemlji, uključujući uvođenje tableta u vrtiće, doveo do pada osnovnih vještina? Šveđani planiraju ići i dalje i potpuno ukinuti digitalno učenje za djecu mlađu od 6 godina.  A što je s Hrvatskom? Dok Hrvatska integrira AI u nastavu, New York novom školskom politikom uvodi zabranu korištenja AI-ja od predškole pa do osmog razreda. Uvode i stroža pravila za korištenje tehnologije u nastavi. Zašto zemlje koje su prve uvodile digitalne alate u obrazovanje i zagovarale vrli novi svijet nakon petnaest godina tvrde da to ne valja?  Jesmo li imali 15 godina obrazovnog eksperimenta na živim ljudima bez statističke potpore, a koji je propao? Odgovore zna dr. Dinko Smilović, docent na Hrvatskom institutu za istraživanje mozga Medicinskog fakulteta Sveučilišta u Zagrebu.
