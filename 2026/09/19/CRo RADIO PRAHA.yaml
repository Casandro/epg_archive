  title: Kriminálka
  description: 'Poslední výstřel - Případ středočeské kriminálky, který nakonec neskončil u soudu, přestože se jednalo o vraždu. Kdo mohl zastřelit ženu ve dne přímo v jejím domě? A jak to, že výstřel neslyšela přítelkyně oběti, která v té době pracovala u domu na zahradě? Souvisela vražda s podnikáním zastřelené, anebo se skutečností, že si už delší dobu hledala známost přes seznamovací agentury? Kde hledat vraha, kterého nikdo neviděl přijít ani odejít? Autor, dramaturgie: Dana a Mirek Vaňurovi.'
