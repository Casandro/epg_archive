- eventId: 546894
  start: 2026-09-19T15:30:00Z
  stop: 2026-09-19T16:00:00Z
  title: 'Die Reportage: Marokko: Wie viel Macht hat das Volk?'
  subtitle: Wahlen im Land der zwei Geschwindigkeiten
  description: In Marokko wird am 23.09.2026 ein neues Parlament gewählt. Es steht zu erwarten, dass anschließend eine neue Koalition mit der Regierung betraut wird. Es steht außerdem zu erwarten, dass nur ein verschwindender Teil der Erstwählerinnen und -wähler an der Abstimmung teilnehmen wird, da viele junge Menschen die Hoffnung aufgegeben haben, dass sich durch die Politik etwas zu ihren Gunsten verändern wird. Die GenZ-Proteste von 2025 oder der Massengrenzübertritt in Ceuta Ende Juli können kaum als Vertrauensbeweis für das herrschende Regime gedeutet werden. Marokko ist eine konstitutionelle Monarchie, die sich wirtschaftlich rasant entwickelt und im Vergleich zu den Verhältnissen vor zehn Jahren an vielen Orten kaum wiederzuerkennen ist. Doch wer profitiert davon? Warum sprechen wir von einem "Marokko der zwei Geschwindigkeiten"? Und wie viel Einfluss haben die Wähler wirklich?
