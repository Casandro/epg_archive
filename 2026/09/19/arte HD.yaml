  title: Brahms in Timi_oara
  subtitle: Cristian M_celaru__, Simon Trpceski und das WDR Sinfonieorchester in der europäischen Kulturhauptstadt
  description: Mit 17 Jahren hat er Rumänien verlassen und sein Glück in den USA und Europa gesucht. Als Geiger und Dirigent machte Cristian M_celaru schnell Karriere. Er ist heute Chefdirigent des WDR Symphonieorchesters und zugleich Musikdirektor des Orchestre National de France. Jetzt kehrt er zusammen mit seinem Kölner Orchester zurück in die Geburtsstadt Timi_oara. Mit dem gefeierten Simon Trpceski hat M_celaru sich einen Freund und Weggefährten als Pianisten auserkoren, der das 2. Klavierkonzert von Johannes Brahms interpretiert.
