  title: 'Hiba Tawaji, Ibrahim Maalouf, Abdellah Taïa, Sarah El Younsi '
  subtitle: 'En duo sur scène comme dans la vie, Hiba Tawaji et Ibrahim Maalouf sortent « À la française ». Un enfant pleure, assis sur un trot '
  description: "Hiba Tawaji, Ibrahim Maalouf, Abdellah Taïa, Sarah El Younsi\n\nEn duo sur scène comme dans la vie, Hiba Tawaji et Ibrahim Maalouf rendent un hommage à la chanson française dans « À la française », leur premier album commun. « La Bohème », « Fais-moi une place », « Les Mots bleus »... Les deux artistes revisitent ces standards en croisant musique classique, jazz et influences orientales. La voix puissante et sensible d'Hiba Tawaji rencontre la trompette jazzy d'Ibrahim Maalouf dans un voyage entre des sensibilités artistiques complémentaires. En tournée à travers la France en novembre et décembre 2026. \n\nUn enfant pleure, assis sur un trottoir, un jeune homme à ses côtés. Pourquoi le soupçonner ? Pourquoi un étudiant d'origine arabe ne pourrait-il pas être un super baby-sitter dans une famille bourgeoise ? Une famille elle tolérante et accueillante...\nL'ouverture de « Debout dans tes rêves », d'Abdellah Taïa, en dit long sur les difficultés de trouver sa place dans la grande ville qu'est Paris, de gérer ses angoisses, de rencontrer l'amour. Le roman est en lice pour le Prix Renaudot et le Renaudot des lycéens.\n\nAprès son film « Keeping the Music alive », c'est en cases et en bulles que Sarah El Younsi raconte l'histoire merveilleuse et triste d'un orchestre exclusivement féminin d'Afghanistan. Dans « La Symphonie de Kaboul », elle montre comment la musique peut être un outil d'émancipation mais aussi une menace. Début des années 2010, Ahmad Sarmast fonde une école de musique, mixte et gratuite, dont l'orchestre fait le tour d'Europe, jusqu'à l'arrivée des talibans à Kaboul. Se pose alors une question : faut-il faire de la musique au péril de sa vie et de celle de sa famille ? Sarah El Younsi est au festival « Histoire de lire » de Versailles, les 21 et 22 novembre 2026.\n\nDans le Vieux-Caire, de nombreux bâtiments anciens sont aujourd'hui délaissés ou mal entretenus. Un patrimoine qui pose la question de sa préservation et de la manière de faire revivre ces quartiers historiques. Reportage de Zineb El Ouadi.\n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Hiba Tawaji, chanteuse et actrice ; Ibrahim Maalouf, trompettiste et compositeur ; Abdellah Taïa, écrivain et cinéaste ; Sarah El Younsi, journaliste et réalisatrice\n \nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
