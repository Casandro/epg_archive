  title: Traumorte
  subtitle: Die Normandie
  description: |-
    Alabasterküste, Blumenküste, Perlmuttküste - über 600 Kilometer erstreckt sich die Küste der Normandie entlang des Ärmelkanals. Ein fruchtbares Land, mit Wiesen, Obstplantagen und Weiden.
    Steilklippen, Sandstrände und Seebäder prägen die Küste der Normandie. Abteien, Schlösser und idyllische Dörfer erzählen von ihrer bewegten Geschichte. Der Film führt vom Mont St. Michel über die Landungsstrände der Alliierten bis zur Halbinsel Cotentin.
