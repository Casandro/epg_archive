  title: ARD-Opernabend
  description: |-
    ARD-Opernabend

    "Vec Makropulos" (Die Sache Makropulos)
    Oper in 3 Akten
    von Leos Janácek

    Emilia Marty: Marlis Peterson (Sopran)
    Albert Gregor: Pavel Cernoch (Tenor)
    Kanzleivorsteher Vitek: Lukas Schmidt (Tenor)
    Krista, seine Tochter: Alma Neuhaus (Mezzosopran)
    Jaroslav Prus: Bo Skovhus (Bariton)
    Janek Prus, sein Sohn: Carlos Osuna (Tenor)
    Advokat Dr. Kolenaty: Wolfgang Bankl (Bassbariton)
    Maschinist: Marcus Pelz (Bass)
    Aufräumerin: Teresa Sales Rebordão (Alt)
    Hauk-Sendorf: Matthäus Schmidlechner (Tenor)
    Kammermädchen: Anita Monserrat (Alt)

    Chor und Orchester der Wiener Staatsoper
    Musikalische Leitung: Tomás Hanus

    (Aufnahme v. 06.12.2025, Wien, Staatsoper)

    Ein philosophischer Krimi auf der Opernbühne. Die Sehnsucht nach der Unsterblichkeit

    Die Operndiva Emilia Marty ist jung, schön und begehrenswert - und zugleich 330 Jahre alt. Ihre ungewöhnliche Lebensspanne verdankt sie der "Sache Makropulos", einem geheimnisvollen Lebenselixier. Mit ihrem unerklärlichen Wissen über die Vergangenheit bringt sie einen seit Jahren schwelenden Erbschaftsprozess gehörig durcheinander. In den alten Prozessakten sucht sie jedoch nur nach dem Rezept, das ihr Leben erneut verlängern soll. Um dieses Ziel zu erreichen, schreckt sie vor nichts zurück. Doch als sie das ersehnte Dokument endlich in den Händen hält, erkennt sie den wahren Preis der Unsterblichkeit.
    Die "Sache Makropulos" basiert auf der gleichnamigen Komödie von Karel Capek. Janácek schrieb das Libretto selbst und verwandelte die ironische Vorlage in eine Tragödie. Die Uraufführung fand 1926 im Tschechischen Nationaltheater in Brünn statt. In der Sendung "ARD Oper" präsentieren wir den Mitschnitt aus der Wiener Staatsoper vom vergangenen Dezember - in Originalsprache, mit der Sopranistin Marlis Peterson als Emilia Marty und dem Bariton Bo Skovhus als einen ihrer Verehrer.
