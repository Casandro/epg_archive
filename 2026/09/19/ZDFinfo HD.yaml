  title: Terra X History
  subtitle: Krawatte war gestern. Mode in Ost und West
  description: |-
    Dokumentation, Deutschland 2025
    Anzug und Krawatte: Symbol erfolgreicher Männer? Das war einmal! Schlips darf sein, auch bei Frauen, muss aber nicht. Von den 50ern bis heute lockern die Deutschen ihren Dresscode.

    Ludwig Erhards "Jedermann-Programm" kleidet die Westdeutschen 1948 neu ein: Staatlich subventionierte Mode ersetzt die Nachkriegslumpen. Zum Mann gehört ein Hut, zur Frau der "Verwandlungspullover". In der DDR gilt zweckmäßige Kleidung als "sozialistisch".
