  description: |-
    Deutschland 2026
    Jahrelanges Training, eiserne Disziplin und ein Leben fernab der DDR-Normalität: So sah jahrzehntelang der Alltag für Nachwuchstalente im DDR-Leistungssport aus.

    "Terra X History" zeigt die Geschichte eines einzigartigen Fördersystems, das Mädchen und Jungen in abgeschotteten Kinder- und Jugendsportschulen (KJS) zu Spitzensportlern formen sollte - und dabei nicht selten über deren körperliche und seelische Grenzen hinausging.
