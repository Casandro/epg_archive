  description: |-
    Deutschland 2024
    "Licht aus, Spot an!" - so lautet der Schlachtruf, der in den 70er-Jahren eine ganze Generation elektrisiert. Die legendäre TV-Sendung bringt ein neues Lebensgefühl auf den Punkt: Disco!

    "Dancing Queen" oder "Saturday Night Fever" sind die Hymnen der "Generation Disco". Am Wochenende heißt es: aufbrezeln und abtauchen in die glitzernde Welt unter der rotierenden Discokugel. Zumindest in Westdeutschland. Doch wie sieht das Nachtleben Ost aus?
