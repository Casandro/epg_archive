  title: Die schwersten Unglücke der DDR
  subtitle: Nur die Stasi kennt die Wahrheit
  description: |-
    Deutschland 2020
    Großbrände, ein Zugunglück, ein Brückeneinsturz. ZDFinfo widmet sich einem wenig beachteten Thema der DDR-Geschichte: Wie kam es zu solchen Unfällen, und wie ging man damit um?

    Anhand von Augenzeugenberichten, Archivmaterial und privaten Filmaufnahmen ermöglicht die Doku einen neuen Blick auf die oft geheimen oder vertuschten Fakten. Historiker und Technik-Experten schildern die damaligen Ermittlungen nach schweren Unglücken.
