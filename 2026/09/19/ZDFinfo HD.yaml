  title: Tödliches Erbe der DDR - Deutsches Uran für Moskaus Bomben
  subtitle: Strahlende Gefahr
  description: |-
    Dokumentationsreihe, Deutschland 2026
    Bis 1990 liefert die DDR Uran für Moskaus Atombomben - mit drastischen Folgen für Mensch und Umwelt: Dörfer verschwinden, Landschaften werden radioaktiv verseucht, Bergleute erkranken.

    Die "Wismut" im Erzgebirge ist zeitweise der größte Uranbergbaubetrieb der Welt. Die Jagd nach dem radioaktiven Metall bezahlen viele Kumpel mit dem Leben. Die Sanierung der strahlenden Altlasten kostet bis heute Milliarden. Eine Mammutaufgabe für Generationen.
    HD-Produktion
