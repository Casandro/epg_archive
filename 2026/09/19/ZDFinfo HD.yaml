  title: Mysteriöse Kriminalfälle der DDR
  subtitle: Habgier unter Genossen
  description: |-
    Deutschland 2018
    Verbrechen durfte es im Osten eigentlich nicht geben. Die DDR wollte ein Staat ohne Mord, Totschlag und Diebstahl sein. Die Realität sah anders aus.

    In dieser Folge geht es unter anderem um den systematischen Klau von Trabis, quasi direkt vom Fabrikband. Und um eine lange ungeklärte Raubserie bei der Leipziger Messe - bis sich herausstellte, dass Stasi-Leute selbst dahintersteckten.
