  subtitle: Speis und Trank in Ost und West
  description: |-
    Dokumentation, Deutschland 2023
    Essen im geteilten Deutschland: Toast Hawaii oder Karlsbader Schnitte? Hamburger oder Grilletta? Hotdog oder Ketwurst? Wie sah es aus auf deutschen Tellern in Ost und West?

    In der Bundesrepublik herrschen ein Jahrzehnt nach dem Krieg Wirtschaftswunder und Überfluss: Die Deutschen im Westen schlemmen und gönnen sich wieder was. Im Osten hingegen wird "Konsumsozialismus" propagiert. Die Banane wird zum Symbol des Mangels.
