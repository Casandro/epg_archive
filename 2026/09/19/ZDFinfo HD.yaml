  title: Mysteriöse Kriminalfälle der DDR
  subtitle: Tödliche Tabus
  description: |-
    Deutschland 2017
    Die Kriminalitätsstatistiken der beiden deutschen Staaten unterschieden sich kaum voneinander. Hüben wie drüben wurde betrogen, geklaut und getötet. Doch die DDR wollte der bessere Staat sein.

    Verbrechen passten nicht in den Sozialismus, denn das sozialistische Menschenbild ist ein friedliches. Deshalb war auch die Berichterstattung in der Presse spärlich. Die DDR-Bürger sollten glauben, dass ihr Land frei von Kriminalität sei.
