  title: Verlorene Kindheit - weggesperrt in der DDR
  description: |-
    Deutschland 2022
    Jugendliche, die nicht ins Raster des DDR-Regimes passten, wurden oft jahrelang eingesperrt. In den sogenannten Jugendhäusern herrschten Willkür, Gewalt und militärischer Drill.

    Die Jugendhäuser sind ein bisher unbekanntes, kaum erforschtes und besonders finsteres Kapitel der DDR-Geschichte. Betroffene leiden noch heute unter den traumatischen Folgen ihrer Inhaftierung.
