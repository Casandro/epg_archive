  title: Die schwersten Unglücke der DDR
  subtitle: Im Wettkampf mit dem Klassenfeind
  description: |-
    Deutschland 2022
    Die beiden deutschen Staaten stehen in ständiger Konkurrenz. Mit dem Strahlflugzeug "152" will die DDR ihre technologische Macht demonstrieren. Doch der zweite Testflug endet tragisch.

    Mitte der 1950er-Jahre forciert die DDR-Führung unter Walter Ulbricht den DDR-eigenen Flugzeugbau. In Dresden wird ein neues Flugzeugwerk aus dem Boden gestampft. Das Prestigeprojekt - die Entwicklung des ersten deutschen Passagierstrahlflugzeuges, der "152".
    HD-Produktion
