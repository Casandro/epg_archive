  title: Mein wunderbarer Kochsalon - Hendl in Surlemoni
  subtitle: Mein wunderbarer Kochsalon - Hendl in Surlemoni
  description: Ich sammle schon seit Jahren historische Kochbücher, es fasziniert mich, wie man sich vor hundert Jahren ernährt hat, was man für gut und wertvoll befand und welche Techniken zum Erfolg führten. Ein Paar vom Attersee brachte ihm ein Kochbuch aus dem Jahr 1779, er brachte es zu mir und wir probierten spontan ein Rezept aus. Hendl mit Zitronensaft. Das ist das Ergebnis. AT 2017
  ageRating: 6
