  subtitle: Mein wunderbarer Kochsalon - Kim's Gemüse-Omelett
  description: Ein Koch kam in die Küche und stahl der Hausfrau ein Ei. Oder besser gesagt zwei und es war eine Köchin. Kim Sohyi, energiegeladene Haubenköchin mit koreanischen Wurzeln, macht meinen Kochsalon unsicher. Und so nebenbei ein sensationell einfaches Gemüse-Omelett mit Mehrwert. AT 2017
