  subtitle: Mein wunderbarer Kochsalon - Fette Sau mit Schokolade-Marinade und glasiertem Bierradi
  description: Als mir Adi Bittermann sagte, er würde im Kochsalon gerne eine Fette Sau mit Schokolade kochen, dachte ich, ich hätte mich verhört. Aber nachdem der Wirt und Koch aus Göttlesbrunn ein alter Hase im Geschäft ist, vertraute ich. Zum Glück, denn selten habe ich so eine saftige Sau mit so spannenden Aromenkombinationen bekommen. Klingt eigenartig, schmeckt sensationell. AT 2017
  ageRating: 6
