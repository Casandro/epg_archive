  title: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Ligthner in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Matthew Ligthner in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im Gastkochkmenü von Matthew Lightner treffen lokale Produkte auf moderne Kochtechniken: Lightner serviert eine neue, westliche Version der traditionellen Kaiseki-Küche. Dabei werden nur frische Zutaten entsprechend der jeweiligen Jahreszeit verwendet und so zubereitet, dass vor allem ihr Eigengeschmack hervorgehoben wird. Das vorrangige Ziel von Chef Matthew Lightner: die Gäste sollen etwas Neues entdecken. Unter diesem Motto kreiert er zusammen mit der Küchencrew des Ikarus im September ein Menü, das die unglaubliche Vielseitigkeit seiner Wahlheimat New York widerspiegelt. AT 2014'
- eventId: 971582
  start: 2026-09-19T14:40:00Z
  stop: 2026-09-19T15:05:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Kirketerp & Kliim
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Kirketerp & Kliim
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Was herauskommt, wenn sich zwei Spitzenköche mit grünem Daumen treffen, zeigen Jesper Kirketerp und Rasmus Kliim im Restaurant "Radio" in Kopenhagen. Die Zutaten für die auf das Vegetarische fokussierte Nordic Cuisine bezieht das Kochduo Kirketerp und Kliim von kleinen Betrieben rund um Kopenhagen. Mit den dort wachsenden Gemüsesorten orientieren sich die beiden Chefs kompromisslos an der Saison. Und selbst während der Wintermonate verwenden sie fast ausschließlich nordische Produkte. Das Restaurant Radio ist Teil des kulinarischen Imperiums von Claus Meyer, dem Begründer der New Nordic Cuisine und Eigentümer des Noma. Das Radio wird als eine Art Bistro-Variante des Noma gehandelt. Eine Bezeichnung, welche die Küchenchefs Jesper Kirketerp und Rasmus Kliim zwar ehrt, mit der sie aber dennoch nicht ganz einverstanden sind. Sie sind darauf bedacht ihre ganz eigene, bodenständige, aber dennoch raffinierte Version der New Nordic Cuisine zu kreieren. AT 2014'
- eventId: 971592
  start: 2026-09-19T15:10:00Z
  stop: 2026-09-19T15:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Kirketerp & Kliim in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Kirketerp & Kliim in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Die Indie-Stars der dänischen Küche Rasmus Kliim und Jesper Kirketerp sind zu Gast im Salzburger Restaurant Ikarus. Konventionen der nordischen Küche gelten nicht für sie. Originelle Einfachheit ist ihr Markenzeichen. AT 2014'
