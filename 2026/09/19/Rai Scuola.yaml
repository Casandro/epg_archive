  subtitle: Progetto Scienza 2022 Newton - p.17 - La vita oltre la Terra - In questa puntata parliamo della ricerca di vita extraterrestre e di quali siano gli strumenti che, oggi, abbiamo per tentare a scovarla nei c
  description: orpi celesti intorno a noi e nel cosmo. L'astrobiologa dell'Università di Roma Tor Vergata, Daniela Billi, ci parla di organismi estremofili. Sono i batteri che vivono in ambienti estremi del pianeta Terra, luoghi con caratteristiche simili a quelle di Marte o di alcune lune ghiacciate di Saturno e Giove e che quindi rappresentano un modello per la ricerca di forme di vita in contesti extraterrestri. Dalle solfatare nei dintorni di Napoli, Beatrice Cobucci Ponzano dell'Istituto di Bioscienze e Biorisorse del CNR ci fornisce un esempio di ambienti terrestri estremi e dei microorganismi che vi abitano, e ci spiega perché è utile studiarli per comprendere l'origine della vita, non solo sulla Terra. Al Mufant, il Museolab del fantasy e della fantascienza di Torino, Andrea Bernagozzi, astrofisico dell'Osservatorio Astronomico della Valle d'Aosta, attraverso un percorso storico tra scienza e fantascienza, ci mostra come si è evoluto il nostro rapporto con gli alieni. L'astrobiologo John Robert Brucato dell'Osservatorio Astronomico di Arcetri dell'Inaf descrive poi quali siano le prospettive future nella ricerca di vita extraterrestre e illustra le missioni Osiris Rex e Mars 2020 che mirano a trovare tracce biologiche di vita passata o presente sull'asteroide Bennu e sotto la superficie di Marte. L'astrofisica Giovanna Tinetti dello University College London ci parla invece della caccia ai pianeti potenzialmente abitabili al di fuori del Sistema Solare, mentre l'astrofisico Andrea Possenti dell'Osservatorio Astronomico di Cagliari, ci spiega in che modo la radioastronomia cerchi di captare segnali radio da forme di vita intelligenti fuori dalla Terra. - un programma di Davide Coero Borga, Diego Garbati, Pino Roggero, con la collaborazione di Maria Agostinelli, Silvia Bencivelli, Giuseppe Cembalo, Pierluigi Pantini, Alberto Polimanti, a cura di Eleonora Ottaviani, Caterina Mazzuoli, progetto a cura di Diego Garbati, regia Alberto Polimanti, conduce Davide Coero Borga
