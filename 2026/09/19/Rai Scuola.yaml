  description: 'e e che lo fa da subito con estrema facilità, anche prima di imparare a leggere e scrivere. Questo suo naturale talento si unisce a un carattere allegro e volitivo, che la porta rapidamente a laurearsi, insegnare, continuare a studiare, fare calcoli che serviranno a mandare il primo americano sulla Luna. Quello in cui vive è un momento storico difficile per la comunità afroamericana a cui appartiene: la lotta per il riconoscimento dei diritti civili è ancora in corso e viaggia contemporanea a quella della conquista dello spazio. Katherine assiste e partecipa alla vittoria di entrambe, divenendo un grande esempio per le giovani generazioni. Chiara Buratti racconta gli anni dellinfanzia, della scuola, gli amori della sua vita, due mariti e tre figlie, la solidarietà della famiglia e la sorellanza tra studentesse, fino agli ultimi anni dedicati ai viaggi e alle lezioni di pugilato. Racconti di Scienza - Profili è il programma di Progetto Scienza di Rai Cultura che ci avvicina ai grandi fondatori e innovatori della scienza. Ogni puntata tratteggia il profilo di una figura emblematica del suo tempo, che ha dedicato la propria vita alla ricerca, alla scoperta di nuovi codici e teorie per decifrare il nostro mondo.'
