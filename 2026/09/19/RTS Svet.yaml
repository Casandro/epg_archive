  description: '"Tv lica ?kao sav normalan svet" je na programu RTS-a deset sezona. Za to vreme oko 300 ličnosti iz javnog života pokazalo je da uspeh i popularnost nisu uspeli da ih promene. Koncepcija emisije, jedan dan u životu, dakle mnogo lokacija na kojima se snima, brojna putovanja po zemlji i inostranstvu, zanimljivi događaji, koncerti, premijere i pozorišne predstave, stvorili su specifičan žanr - intervju u dokumentarnoj formi.'
