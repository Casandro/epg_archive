  description: '"Kvadratura kruga" bavi se ljudima koji su ostavili trag više u odnosu na okruženje: stvaraocima, inovatorima, kreativnim, talentovanim, plemenitim i neobičnim ljudima i njihovim sudbinama. Urednik emisije Branko Stanković autor je 18 dokumentarnih filmova i dve drame koje su ekranizovane na RTS-u, a i mnoštva dokumentarnih emisija, koje su, kao i filmovi, nagrađivane na domaćim i međunarodnim festivalima.'
