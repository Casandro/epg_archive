  title: NTC kviz
  subtitle: Takmičari druge epizode ovogodišnje sezone "NTC kviza" spajaće logiku sa maštom, činjenice sa kreativnošću, pitanja sa razmišljanjem, razmišljanje sa odgovorima, a odgovore... sa novim izazovima.
  description: Takmičari druge epizode ovogodišnje sezone "NTC kviza" spajaće logiku sa maštom, činjenice sa kreativnošću, pitanja sa razmišljanjem, razmišljanje sa odgovorima, a odgovore... sa novim izazovima. Jedan od izazova za takmičare je da spajaju reč i... reč! Pomoći ne sme, odmognuti neće, ali će biti sa takmičarima - Ognjen Mićović! Budite sa nama u premijernom terminu 19. septembra u 11:00č na Prvom programu. Sa jedne strane su učenici Osnovne škole "Aca Aleksić" iz Aleksandrovca, a sa druge strane učenici iz Osnovne škole "Jovan Jovanović Zmaj" iz Novog Kneževca. Takmičari koji dolaze iz Aleksandrovca znaju, a sada mogu da saznaju i svi ostali, da se Aleksandrovac nalazi u kraju koji se zove Aleksandrovačka Župa i, između ostalog, poznata je po uzgoju grožđa i proizvodnji vina. Znamo da je biljka na kojoj rađa grožđe vinova loza, a biljka koja rađa grožđe od koga se pravi vino se zove čokot. I zato Ognjen, bez dileme, ovom timu daje ime - Čokoti. Drugi tim dolazi iz mesta koje se...
- eventId: 962899
  start: 2026-09-19T12:20:00Z
  stop: 2026-09-19T12:46:00Z
  title: Put pobednika
  subtitle: Andrija Kostić je prvi Srbin posle Miloša Pavlovića koji je došao do Formule 3.
  description: Andrija Kostić je prvi Srbin posle Miloša Pavlovića koji je došao do Formule 3. Ovaj neustrašivi tinejdžer je za kratko vreme prošao put od kartinga do Formule i pokazao da se upornošću i snagom volje sve postiže. Želja mu je da postane vozač Formule 1, i za sada je na odličnom putu, budući da se takmiči za Trident, tim koji je poznat po rigoroznim kriterijumima ali i vrhunskim vozačima. Mnogo je odricanja, discipline, treninga, rada na sebi potrebno da bi se došlo do samog vrha. Mesta za sumnju i loše misli- nema. Formula 1 je među najskupljim sportovima na svetu. Ulaganja su od samog početka ogromna, pa ja zato na tom putu finansijski momenat veliki kamen spoticanja. Uprkos svemu, Andrija nije obeshrabren. Nada da će uspeti da pronađe sponzore, a kako sam ističe, sebe već vidi u Formuli 1 za 3,4 godine.
