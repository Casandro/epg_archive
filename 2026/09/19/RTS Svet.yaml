  description: Krativni distrikt je naslov novog serijala od 15 epizoda u produkciji Redakcije za kulturu i umetnost RTS - a. Serijal ima nameru da našoj publici predstavi izuzetne umetnike poreklom iz naše zemlje koji su svojim delima postigli veliki uspeh u svetu. Svaka epizoda posvećena je jednom od njih, a čitav serijal predstavlja kreativnu zajednicu naših umetnika koje povezuje život i stvaralaštvo van zemlje. Na vizuelno atraktivan način predstavljamo njihova dela, njihovu profesionalnu i životnu filozofiju, njihov put do uspeha, nostalgiju za domovinom, odnos prema svom poreklu i sredini u kojoj stvaraju. Snimali smo ih u ambijentima u kojima stvaraju, u gradu i zemlji u kojoj žive i rade.
