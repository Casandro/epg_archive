  title: Babylon Berlin (1/8)
  subtitle: Deutschland 2026
  description: 'Berlin, Januar 1933: Mit Hitlers Ernennung zum Reichskanzler beginnt das dunkelste Kapitel der deutschen Geschichte. Charlotte Ritter ermittelt in einer Mordserie an ehemaligen Frontsoldaten. Verbindungen und Motive reichen in das Jahr 1918 zurück. Eine brisante Akte ist verschwunden, die Hitlers Zeit als Soldat im Ersten Weltkrieg in ein neues Licht rückt. Politischer Sprengstoff - und die Betroffenen scheinen vor nichts zurückzuschrecken, um die Akte in ihren Besitz zu bringen, auch nicht vor Mord. Als Gereon Rath plötzlich spurlos verschwindet, weiß Charlotte nicht, ob sie ihn je wiedersehen wird.'
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
