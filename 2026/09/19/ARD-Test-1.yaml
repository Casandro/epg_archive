  subtitle: Deutschland 2026
  description: 'Dr. Forster hütet brisante Details über seinen Lazarett-Patienten Hitler. Charlotte ahnt: Die Nazis wollen den Psychiater aus dem Weg schaffen. So wie alle ihre Gegner. Immer mehr Menschen verschwinden. In der Burg übernehmen "nationale Kräfte". Zu Hause entdeckt Charlotte Gereons explosive Hinterlassenschaft. Noch immer fehlt jede Spur von ihm. Auf der Bühne der Mikado-Bar tanzt Charlotte gegen ihre Ängste an.'
