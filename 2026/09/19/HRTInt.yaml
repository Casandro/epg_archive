  title: Dolina sunca, serija (14/210)
  subtitle: ' '
  description: 'Andrija pokušava spriječiti Nikolu da udari Jurana, ali Juran tada iskoristi priliku da uzvrati. Prisiljena Sonjinom ucjenom, Adela se žali Ivanu na Andrijino ponašanje i traži od njega da poduzme nešto. Sonja se pohvali Juranu kako je uspjela nagovoriti Adelu da otpusti Andriju, ali Juran je previše nervozan i izdere se na nju. Eva sretne Juliju koja joj kaže da će povući tužbu samo ako ona zauvijek ode iz Jablanova. Juran se žali Kristijanu na Andriju kad u tom trenu ulazi Andrija i nasrne na Jurana. Karlo pred Natašom kaže Sofiji za Juranov incident u gostionici. Brižna Lada nagovori Lovru da odu u Zagreb na dodatne pretrage. Ivan je smirio sukob između Jurana i Andrije. Julija sretne Andriju pokraj rijeke i on je nakon žustrog razgovora o njihovoj prošlosti odluči poljubiti. Ivan se dolazi ispričati Nikoli što je dao Andriji otkaz. Nada se da to neće utjecati na njihovo prijateljstvo. Juran slučajno sruši Natašinu torbicu iz koje ispadne kutija s kontracepcijskim pilulama. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
