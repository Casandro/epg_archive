  title: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  description: 'Weite Sandstrände, ein klarer blauer Himmel, idyllische Ortschaften. So stellen sich viele Menschen die Karibik vor. Doch das Gleiche gilt auch für die sogenannte "friesische Karibik" vor der Westküste Schleswig-Holsteins. Die Rede ist von der Insel Föhr. Das kleine Eiland ist schon seit vielen Jahren ein Eldorado für Erholungssuchende, die das milde und gesunde Klima auf der Insel schätzen. Doch Föhr ist auch ein attraktiver Flecken für Aktivurlauber und Wassersportenthusiasten. Gerade deshalb hat sich der Schauspieler Falk-Willy Wild auf den Weg gemacht, um auf Föhr allerlei touristische Highlights aufzuspüren und mehr über Land und Leute zu erfahren. Auf dem Fahrrad erkundet der Schauspieler erst einmal das dortige Naturparadies. Neben Kirchen- und Museumsbesuchen treffen wir auch auf die Tradition des Reet-Dachdeckens. Haben Sie gewusst, dass auf Föhr und so weit im Norden Deutschlands ein schmackhafter Wein angebaut wird? Die Reisereportage zeigt, wie abwechslungsreich und belebend ein Urlaub auf Föhr sein kann: Egal, ob aufregender Segeltörn, Wellness am Wattenmeer oder - als neue Trendsportart - Standup Paddel Polo auf dem Wasser. Es muss ja nicht immer die echte Karibik sein! DE 2019'
  ageRating: 6
