  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: "17.05 Die Entscheidung. Politik, die uns bis heute prägt\nSchengen einklagen | Hannah gegen die Bundesregierung\nHannah kämpft für ein Europa ohne Grenzkontrollen. Und zieht vor Gericht. Die Grenzkontrollen, die seit vielen Jahren an der deutsch-österreichischen Grenze stattfinden, verstoßen ihrer Meinung nach gegen das Schengen-Abkommen. Davon haben wir Euch in einer unserer ersten Staffeln von \"Die Entscheidung\" im Juni 2024 erzählt: \"Die EU, Schengen und der Kampf um Grenzkontrollen\". Inzwischen ist die Bundespolizei an allen deutschen Grenzen präsent und kontrolliert die Reisenden ohne Anlass. Bundesinnenminister Alexander Dobrindt will so irreguläre Migration verhindern und lässt sogar Asylsuchende an deutschen Grenzen zurückweisen. Die Klage von Hannah hat viel Zeit gebraucht. Aber jetzt ist sie entschieden. Wie es ausgegangen ist, erzählen wir Euch in diesem Update. Hannah ist zufrieden - und wütend zugleich.\nHost: Jasmin Brock\nReporter: Johannes Leininger\n\nWiederholung vom 30. Mai 2026\n\n17.30 Bayern 2 Breitengrad\nARD Auslandsreportage\n\nVon Chicago an den Pazifik - die Route 66 wird 100\nVon Samuel Jackisch, Nina Barth, Reinhard Spiegelhauer und Antje Sieb\nDie Route 66 in den USA ist ein Sehnsuchtsort für Millionen Menschen weltweit - voller ikonischer Wahrzeichen, die an den alten amerikanischen Traum von grenzenloser Freiheit erinnern. Motels, Diner und Tankstellen entlang der Route 66 lassen bis heute an vielen Stellen jeden Roadtrip gen Westen zum unvergesslichen Erlebnis werden. Andernorts ist nicht mehr viel übrig vom einstigen Mythos, den Filme wie Easy Rider begründet haben. In diesem Jahr feiert \"Amerikas Highway\" zwischen Chicago und\nSanta Monica seinen 100. Geburtstag. Samuel Jackisch, Nina Barth, Reinhard Spiegelhauer und Antje Sieb aus den ARD-Studios Washington und Los Angeles haben sich auf den Weg gemacht. \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
