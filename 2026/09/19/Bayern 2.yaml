  title: ARD Radio Tatort
  subtitle: '"Einer von uns" von Dirk Schmidt'
  description: |-
    Ein tödlicher Schusswechsel führt die Taskforce Hamm zu einem abgelegenen Tatort. Der Tote ist kein Unbekannter, sondern der legendäre Polizeispürhund Benno. Doch wer hat auf ihn geschossen? Zunächst glaubt niemand an ein echtes Verbrechen. Doch als Bennos Kollege Kilian Daldrup verschwindet, sieht sich die Taskforce plötzlich in einer großangelegten Ermittlung. Korruption, Drogen, Sicherheitsdatendiebstahl - immer tiefer graben sich Latotzke, Scholz und Co. in den Fall. Wurde Daldrup entführt oder steckt mehr hinter der ganzen Sache?

    Von Dirk Schmidt
    Mit Matthias Leja, Sönke Möhring, Christine Prayon, Uwe Ochsenknecht, Pinar Erincin, Nic Romm, Hans-Martin Stier und Volkan Isbert
    Regie: Martin Zylka
    WDR 2026

    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2.
