  title: 'Unforgettable: Zapisane w pamięci'
  subtitle: Carrie Wells ma doskonałą pamięć, potrafi zapamiętać wszystko nawet w najmniejszych szczegółach. Bohaterka powraca do pracy w policji, którą porzuciła parę lat wcześniej.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2011
    Występują: Poppy Montgomery, Dylan Walsh, James Hiroyuki Liao, Daya Vaidya, Tawny Cypress
    Psychologicznty i emocjonujący serial kryminalny! Carrie Wells (Poppy Montgomery) powraca do nowojorskiej policji. Posiada zdolność hipermnezji, dzięki której jest w stanie zapamiętać niemalże każdy szczegół ze swojego życia. Sprawia to, że jest niezastąpionym detektywem. Jednakże jej niesamowita zdolność jest dla niej także przekleństwem, gdyż nie może zapomnieć o tragicznych wydarzeniach z przeszłości, w tym o śmierci swojej siostry.
  ageRating: 16
- eventId: 811251
  start: 2026-09-19T17:20:00Z
  stop: 2026-09-19T18:15:00Z
  title: 'Unforgettable: Zapisane w pamięci 1 (odc. 5)'
  subtitle: Były partner Carrie zostaje postrzelony, a wyniki śledztwa sugerują, że jako policjant nie zasłużył sobie na nienaganną opinię. Carrie musi znaleźć sposób, by mu pomóc.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2011
    Reżyseria: Peter Werner
    Występują: Poppy Montgomery, Dylan Walsh, Michael Gaston, Kevin Rankin, Daya Vaidya, Gary Basaraba
    Carrie Wells ma niezwykły dar zapamiętywania szczegółów otaczającej rzeczywistości. Bohaterka, która pracowała kiedyś w wydziale zabójstw, ponownie podejmuje współpracę z policją, a jej fenomenalna pamięć staje się kluczowym elementem wspierającym ją w prowadzeniu skomplikowanych śledztw.
  ageRating: 12
- eventId: 811344
  start: 2026-09-19T18:15:00Z
  stop: 2026-09-19T19:15:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 1 (odc. 5)'
  subtitle: Candice otrzymuje pilne wezwanie w sprawie upadku jednego z klientów hotelu. Z pomocą swoich bliźniaków i ich znajomości futbolu, kobieta próbuje rozwiązać sprawę.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2013
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab, Alexandre Varga
    Pewnego wieczoru, w samym środku spotkania z Hervé, Candice otrzymuje pilne wezwanie w sprawie upadku jednego z klientów hotelu. Mężczyzna poruszał się na wózku inwalidzkim i został zepchnięty ze schodów. Wkrótce ekipa dochodzeniowa dowiaduje się, że był on otoczony szczególną opieką ze strony personelu hotelowego, a niedawno jego stan znacznie się pogorszył, doprowadzając do paraliżu i uniemożliwiając mu chodzenie.
  ageRating: 16
- eventId: 811345
  start: 2026-09-19T19:15:00Z
  stop: 2026-09-19T20:35:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 1 (odc. 6)'
  subtitle: Candice pracuje nad sprawą 40-letniej kobiety, która zmarła za kierownicą z powodu niewydolności oddechowej. Jako znawczyni botaniki, policjantka natychmiast wyczuwa w ustach ofiary truciznę.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2013
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab, Alexandre Varga
    Ku uciesze swoich dzieci, a niechęci przyszłej byłej żony, Laurent Renoir wraca na łono rodziny. Tymczasem Candice pracuje nad sprawą 40-letniej kobiety, która zmarła za kierownicą z powodu niewydolności oddechowej. Jako znawczyni botaniki, policjantka natychmiast wyczuwa w ustach ofiary zapach kwiatów zimowitu, trucizny równie śmiertelnej, co dyskretnej. Okazuje się, że po powrocie z Singapuru kobieta leczyła się roślinami.
  ageRating: 16
