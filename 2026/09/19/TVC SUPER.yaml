  stop: 2026-09-19T21:50:00Z
  title: Balthazar 4 (odc. 6)
  subtitle: Eros i Tanatos. Dowody znalezione na wyłowionym z rzeki szkielecie wskazują, że na wolności może przebywać zabójca, gustujący w ludzkim mięsie. (S4,Ep6)
  description: |-
    Tytuł oryginalny: Balthazar
    FR, 2022
    Reżyseria: Franck Brett
    Występują: Tomer Sisley, Constance Labbé, Yannig Samot, Philypa Phoenix, Côme Levin, Nicolas Delys
    Raphaël Balthazar jest utalentowanym patologiem sądowym. Błyskotliwy, czarujący mężczyzna bywa też irytujący. Jest lekkoduchem, który żyje pełnią życia, często wbrew normom i konwencjom. Jego metody pracy i zjadliwy dowcip kolidują z rozsądnym podejściem nowo mianowanej komendant policji Hélene Bach. Balthazara wciąż prześladuje morderstwo jego żony sprzed dwunastu lat. Nowe dowody sugerują, że jej zabójca wciąż może być na wolności.
  ageRating: 12
