  title: Żar tropików 1 (odc. 9)
  subtitle: Charyzmatyczny Nick Slaughter zakłada biuro detektywistyczne na Hawajach, gdzie razem z przebojową i bystrą Sylvie Gerard wpada w sam środek mrocznych zagadek, intryg i tajemnic.
  description: |-
    Tytuł oryginalny: Sweating Bullets
    CA,MX, 1991
    Reżyseria: Mario Azzopardi
    Występują: Rob Stewart, Carolyn Dunn, Gwynyth Walsh, Len Birman, Booth Savage, Pedro Armendáriz Jr.
    Nick Slaughter to charyzmatyczny były agent wydziału narkotykowego, który zawsze gra według własnych reguł. Po porzuceniu pracy w FBI, zakłada biuro detektywistyczne na słonecznych Hawajach, gdzie razem z przebojową i niezwykle bystrą Sylvie Gerard wpadają w sam środek mrocznych zagadek, intryg i tajemnic.
