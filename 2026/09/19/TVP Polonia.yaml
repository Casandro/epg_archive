    Pan Samochodzik i jego mali pomocnicy o wdzięcznych przezwiskach Wilhelm Tell, Wiewiórka i Sokole Oko zaprzyjaźnili się, szukając wspólnie zbiorów dziedzica Dunina (powieść Zbigniewa Nienackiego "Wyspa złoczyńców" sfilmował w 1965 r. Stanisław Jędryka). Teraz wyruszają na wyprawę w poszukiwaniu skarbu templariuszy. Pan Tomasz, historyk sztuki, pracownik Centralnego Zarządu Muzeów, jest wściekły, że prasa ujawniła tajemnicę, nad którą pracował od dawna.
