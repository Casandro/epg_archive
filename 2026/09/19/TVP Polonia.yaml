  subtitle: Martyna z Piotrem jadą do luksusowego SPA. Voucher jest sekretnym prezentem od pracowników stacji. Alek walczy z kłamstwami na jego temat w sieci. Góra pomaga kobiecie, która zachowuje się jak pod wpływem narkotyków.
- eventId: 809248
  start: 2026-09-19T13:35:00Z
  stop: 2026-09-19T14:05:00Z
  title: Okrasa łamie przepisy - Soczewiaki, czyli soczewica na talerzu
  description: |-
    Tytuł oryginalny: Okrasa łamie przepisy
    PL, 2025
    Reżyseria: Tomasz Rostworowski
    W kolejnym odcinku Karol Okrasa wyruszy na Suwalszczyznę. Ten rejon Podlasia posiada bardzo charakterystyczną i bogatą kuchnię regionalną. Któż nie słyszał o sycących kartaczach z mięsnym farszem, zwanych tu także zeppelinami albo o sławnej babce czy kiszce ziemniaczanej. Są to potrawy oparte o ziemniaka, który dziś jest królem podlaskiej kuchni. Ale przecież aż do połowy XIX wieku ziemniaków na tych terenach nie uprawiano na masową skalę.
  genre:
  - '165'
  subtitle: W tym odcinku Karol Okrasa wyruszy na Suwalszczyznę i przygotuje dania z czerwonej soczewicy, m.in. pierogi z soczewicowego ciasta z ziemniaczanym farszem.
