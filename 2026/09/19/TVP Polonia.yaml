  title: Na sygnale - odc. 666 "Lawendowy bzyk"
  description: |-
    serial fabularno-dokumentalny (Polska, 2025) odc.666, Lawendowy bzyk
    Występują: Tomasz Piątkowski, Dariusz Wieteska, Lea Oleksiak, Monika Mazur, Dariusz Wieteska, Kamil Wodka, Edyta Bełza, Anna Wysocka-Jaworska, Wojciech Zygmunt, Anna Wysocka
    Martyna i Piotr wybierają się do luksusowego spa. Nie wiedzą, że voucher zafundowali im koledzy ze stacji, którzy chcą ich pogodzić. Na miejscu Strzeleccy trafiają na ciężko chore dziecko i znów muszą wkroczyć do akcji. Ekipa Góry próbuje pomóc kobiecie, która wjechała autem do rowu. Pacjentka ma wysoką gorączkę.
    Reżyser: Paweł Wróbel
    Od lat: 12
  ageRating: 12
  genre:
