  title: Archiwista - odc. 1 (seria I, odc. 1) Na wieki moja
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
    Występują: Henryk Talar, Paulina Gałązka, Maria Gładkowska, Mirosław Zbrojewicz, Mateusz Kmiecik, Rafał Mohr
    W żyrardowskiej komendzie rozpoczyna pracę aspirantka Zuza Wasiluk (Paulina Gałązka). Na skutek zbiegu okoliczności zostaje przydzielona do archiwum. Prowadzący je Henryk Mikos (Henryk Talar) powinien odejść na emeryturę, ale bardzo tego nie chce i wie, co zrobić, by tak się nie stało? Wkrótce okazuje się, że elektroniczne archiwum nie działa i ostatecznie Mikos wraca do pracy, a komendant przydziela mu do pomocy nową funkcjonariuszkę. Początki ich znajomości są trudne.
  ageRating: 12
  genre:
  - '18'
  subtitle: Aspirantka Zuza Wasiluk zaczyna pracę w żyrardowskiej komendzie i wskutek zbiegu okoliczności zostaje przydzielona do archiwum. Wraz z Henrykiem Mikosem pracuje nad sprawą zaginięcia modelki.
- eventId: 809285
  start: 2026-09-19T19:10:00Z
  stop: 2026-09-19T20:00:00Z
  title: Archiwista - odc. 2 (seria I, odc. 2) Mój przyjaciel psychopata
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
    Występują: Henryk Talar, Paulina Gałązka, Mirosław Zbrojewicz, Rafał Mohr, Maria Gładkowska, Mateusz Kmiecik
    Tomasz (Mateusz Kmiecik) przychodzi do archiwum po akta dotyczące Pawła Woźniaka (Miron Jagniewski), który wdał się w zatarg z dilerami. Przy okazji wychodzi na jaw, że cztery lata wcześniej był on świadkiem w sprawie zabójstwaJustyny Poltz (Martyna Peszko). Kobieta zginęła w hotelu w czasie imprezy integracyjnej firmy Carlson, w której piastowała wysokie stanowisko. O jej uśmiercenie oskarżono Ireneusza Rułkowskiego (Wojciech Urbański), znalezionego nieprzytomnego w pokoju denatki.
  ageRating: 16
  genre:
  - '18'
  subtitle: Henryk rozmawia z Tomaszem o sprawie Ireneusza Rułkowskiego, który został skazany za zabicie kobiety podczas imprezy integracyjnej. Sprawa budzi wątpliwości. Zuza i Tomasz postanawiają je wyjaśnić.
- eventId: 809286
  start: 2026-09-19T20:00:00Z
  stop: 2026-09-19T20:45:00Z
  title: 'Daję słowo - Maciej Orłoś 2: Ewa Wiśniewska: odc.42'
  description: |-
    Tytuł oryginalny: Daję słowo - Maciej Orłoś
    PL, 2026
    Reżyseria: Agnieszka Krotki-Żmijewska
    W klimacie klubu jazzowego, podbitym przez występujący na żywo band, Maciej Orłoś prowadzi rozmowy z wybitnymi osobistościami świata polskiej kultury i sztuki. Rozmowy pełne uśmiechu i zabawy, ale też refleksji i łez wywołanych przez, być może zatarte już w pamięci, wydarzenia zarówno z życia prywatnego, jak i zawodowego. Przywołać je pomogą wyjątkowi goście: koledzy ze szkolnych ławek, sąsiedzi, znajomi z podwórka, którzy wraz z publicznością zasiądą przy kawiarnianych stolikach.
  ageRating: 12
  genre:
  - '112'
  subtitle: Bohaterką odcinka jest jedna z najbardziej rozpoznawalnych polskich aktorek.
