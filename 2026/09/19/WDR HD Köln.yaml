  title: Wilfried Schmickler - Das Allerbeste aus 6 Soloprogrammen
  description: "Wilfried Schmickler steht seit fast 40 Jahren für exquisites politisches Kabarett. Seine politischen und gesellschaftspolitischen Analysen beeindrucken durch Scharfsinn und Wortwitz. \n\nDer WDR hat Schmicklers künstlerisches Schaffen über viele Jahre begleitet, sowohl bei den Mitternachtsspitzen als auch bei seinen Soloprogrammen. Mit einer Best-of-Ausgabe aus seinen letzten sechs Soloprogrammen würdigt der WDR einen der größten und bekanntesten Kabarettisten Deutschlands."
