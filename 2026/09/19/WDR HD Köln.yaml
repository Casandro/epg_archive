  title: Lecker an Bord
  subtitle: mit Björn Freitag und Frank Buchholz
  description: "In der neunten Staffel der beliebten WDR-Sommerreihe \"Lecker an Bord\" setzen die Spitzenköche Björn Freitag und Frank Buchholz erneut Kurs auf die niederländische Provinz Friesland. \nDie Köche erreichen ihren dritten und letzten Liegeplatz: den Zuiderhaven in Harlingen. Als erstes besucht Björn den Biobauern Jochum de Boer in Kimswerd, der in seinem Gewächshaus ein vielfältiges Gemüsesortiment anbaut. Björn hilft beim Bestäuben der Zucchiniblüten und erfährt, wie wichtig Jochum ein gesunder Boden ist."
  widescreen: true
  subtitled: true
