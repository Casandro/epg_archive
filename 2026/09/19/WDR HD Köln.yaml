  title: Mitternachtsspitzen
  subtitle: Aus dem Wartesaal am Dom unter dem Kölner Hauptbahnhof
  description: |-
    Mit den Gästen Alfons, Katie Freudenschuss, Mareike Richter und Wilfried Schmickler sowie natürlich mit Gastgeber Christoph Sieber, mit Karen Dahmen, Martin Maier-Bode und Philip Simon
    Dürre, Hitze, Krieg, Rechtsextremismus, Werksschließungen, Zollstreit und so weiter und so fort. Gibt es sie denn gar nicht mehr, die guten Dinge? Doch!
    Die "Mitternachtsspitzen" starten nach der Sommerpause und am Vorabend der Wahlen in Berlin und Mecklenburg-Vorpommern ins 39. Jahr ihres Bestehens und heben umgehend die Stimmung.
