  title: Krimi am Samstag
  subtitle: 'ARD Radio Tatort: Einer von uns'
  description: |-
    Ein tödlicher Schusswechsel führt die <markup type="language.en">Taskforce</markup> zu einem abgelegenen Tatort. Der Tote ist kein Unbekannter, sondern der legendäre Benno, Spürhund der Hammer Polizei. Doch wer hat auf ihn geschossen? Zunächst glaubt niemand an ein echtes Verbrechen. Doch bald findet sich die <markup type="language.en">Taskforce</markup> in einer großangelegten Ermittlung wieder: Korruption, Drogen, Sicherheitsdatendiebstahl - Latotzke, Scholz und Co. mittendrin.
    Regie: Martin Zylka<br/>Produktion: WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
    Ab dem <markup type="abbr" abbreviation="11." correspondent="elften">11.</markup> September <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
