  title: De publieke tribune
  subtitle: Op weg naar school word je van je fiets geduwd. Op school maak je geen deel uit van de groep en uitgescholden worden is dagelijkse kost. Soms belanden er plakken kaas in je haar of worden er peuken naar je gegooid.
  description: 'Op weg naar school word je van je fiets geduwd. Op school maak je geen deel uit van de groep en uitgescholden worden is dagelijkse kost. Soms belanden er plakken kaas in je haar of worden er peuken naar je gegooid. Wat je ook doet of laat, alles is voor pesters een aanleiding om nog harder tekeer te gaan. Hoe voelt het om jarenlang gepest te worden? Hoelang duurt het voor je gaat twijfelen aan jezelf en wat draag je mee na die ellendige periode? In "De publieke tribune" gaat Coen Verbraak in gesprek met drie mensen die jarenlang gepest werden. Te gast: Zoë Bergmans, Zoë May Moleman en Jaser Husseini Presentatie: Coen Verbraak Redactie: Nico Kuppens Eindredactie: Steven Albers ?? Meer info? human.nl/dpt ?? Reageren? depublieketribune@human.nl Het HUMAN-radioprogramma "De publieke tribune" met presentator Coen Verbraak komt wekelijks live vanuit de Tolhuistuin in Amsterdam. De toegang is gratis. Bezoekers kunnen zich aanmelden via de website van Tolhuistuin. (2026)'
- eventId: 818664
  start: 2026-09-19T14:00:00Z
  stop: 2026-09-19T15:00:00Z
  title: Goed Ingelichte Kring
  description: 'In Goed Ingelichte Kring, een knipoog naar de radioklassieker Welingelichte Kringen, zet PowNed een panel van vijf prominenten aan tafel om in gesprek te gaan over de actualiteit en de luisteraar deelgenoot te maken van hun bijeenkomst. De panelleden zijn allen personen met bewezen expertise, die op hun vakgebied een bijzondere prestatie hebben geleverd. De herkenningsmuziek van Goed Ingelichte Kring is van de Franse 19e-eeuwse Louise Farrenc. Zij had een grote reputatie als componist, pianist, docent en auteur. Presentator Chazia Mourali: "Een vrouwelijke kunstenaar die ten onrechte door het grote publiek is vergeten, is voor altijd erelid van de Goed Ingelichte Kring!" (2026)'
