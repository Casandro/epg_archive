  description: In De Wereld van BNNVARA hoor je wekelijks Nederlanders die in het buitenland wonen. Zij reageren op de actualiteit in eigen land en in Nederland, en bieden zo een levendig inkijkje in de overeenkomsten en verschillen tussen hun moederland en hun nieuwe vaderland. De wereld is soms groter en soms kleiner dan je denkt. (2026)
