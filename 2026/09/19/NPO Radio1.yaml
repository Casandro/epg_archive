  description: 'Pointer is het tweewekelijkse onderzoeksprogramma van KRO-NCRV op NPO Radio 1. Pointer brengt om de week een reportage over een onderwerp dat nieuwe feiten en nieuwe inzichten oplevert, waarbij de burger centraal staat. In de rubriek Pointer Regio besteden we aandacht aan regionale onderzoeksjournalistiek samen met onze mediapartners. Onderzoeksjournalistiek over onderwerpen die voor iedereen relevant en herkenbaar zijn, op een toegankelijke manier. Eens in de twee weken op zaterdag tussen 14.00 en 15.00 uur. Reacties, vragen en tips: pointer@kro-ncrv.nl of tel: 035-6719787. (2026)'
