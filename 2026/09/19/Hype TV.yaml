- eventId: 849803
  start: 2026-09-19T14:00:00Z
  stop: 2026-09-19T15:30:00Z
  title: A.R.C.H.I.E. 2, film
  subtitle: A.R.C.H.I.E. 2 Komedija
  description: Arči, umjetno stvoren robotizirani pas s iznimnom inteligencijom, vraća se u uzbudljivom nastavku ove zabavne obiteljske pustolovine. Na početku nove avanture Arči, ujak Poli i njihov prijatelj Sidni odlaze avionom u obiteljsku kolibu kako bi ondje proveli ljeto. Sidni nagovori Arčija da glumi njegovu trbuhozborsku lutku tijekom nastupa na gradskom karnevalu. Na karnevalu Arči upoznaje Gregorija, sina zaposlenika lunaparka, koji mu otkriva da netko potkrada karneval. Zauzvrat, Arči mu priznaje da je umoran od toga što je drugačiji te razmišlja o pritisku na gumb za brisanje podataka na svom tvrdom disku, čime bi postao sasvim običan pas. Arči i njegovi prijatelji kreću u veliku pustolovinu kako bi razriješili tajanstvene krađe na Magičnom karnevalu. Hoće li uspjeti otkriti krivca i pritom pomoći Arčiju da pronađe svoje mjesto u svijetu?
