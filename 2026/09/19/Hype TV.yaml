  title: Toma, ep. 1. mini-serija
  subtitle: Biografski/Drama/Glazbeni
  description: Godina je 1991. Nakon nastupa u Domu sindikata, Tomi Zdravkoviću naglo pozli te ga odmah prebace u bolnicu. Dok se liječnici se bore za njegov život, Tomi se priviđa djetinjstvo u Pečenjevcu i mladost u Leskovcu. Prisjeća se kada je upoznao Silvanu Armenulić ispred kafića 'Radan', prvog nastupa i odlaska u Tuzlu, gdje je upoznao svoju prvu ljubav Slavicu, kojoj je posvetio prvu autorsku pjesmu 'Buket belih ruža'.
