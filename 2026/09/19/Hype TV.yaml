  title: Crna svadba, ep. 10. serija
  subtitle: Crna svadba (2021) Drama
  description: |-
    Prva regionalna horor-serija upoznat će vas s vlaškom magijom i okultnim običajima. Serija nas vodi u malo selo u istočnoj Srbiji, gdje mještanin Mitar (Slavko Štimac), inače miran čovjek, iznenada i na brutalan način ubije dvanaestero svojih susjeda. Petar Ćirić (Uliks Fehmiu), pregovarač sigurnosne agencije, pokušava uvjeriti Mitra da se preda. Nakon što izgovori riječ ,,katabaza, Mitar si pred Petrovim očima puca u glavu. Pokušavajući rasvijetliti motive zločina, Petar i inspektori Tomić (Nikola Kojo) i Blagojević (Nebojša Milovanović) pozivaju psihologinju Natašu Janković (Jelena Đokić) da kao sudska vještakinja utvrdi je li Mitar psihički obolio ili se iza zločina krije neki drugi motiv. Je li u pitanju bolest, magija ili religija?
    Svaku nedjelju pratite nove epizode ekskluzivno na PLAY Premiumu.
