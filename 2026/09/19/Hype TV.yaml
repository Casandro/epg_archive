  title: Kvar, film
  description: 'Nakon niza stresnih situacija na poslu i u braku, novinar obolijeva od neobične kožne bolesti. Liječnici mu preporučuju boravak u prirodi kako bi se oslobodio stresa. Ondje upoznaje ženu koja se suočava sa sličnim problemima, a taj mu susret vraća snagu i volju da se uhvati ukoštac sa svojim životnim poteškoćama. Novinar vodi naizgled sređen građanski život sa suprugom koja potječe iz ugledne obitelji. Međutim, sukobi sa šefom na poslu i bračna kriza samo su odraz njegovih unutarnjih nemira, koji se očituju kroz neobičnu kožnu bolest. Liječnici mu preporučuju odmor u prirodi i preispitivanje vlastitog života. U planinskoj kolibi uz jezero upoznaje ženu koja je poput njega, usamljena i neprilagođena. Njihov susret djeluje isceljujuće - ponovno postaje sposoban voljeti, pronalazi moralnu snagu, a simptomi bolesti postupno nestaju. Odlučuje prekinuti veze sa supruginom obitelji i odbaciti malograđanski način života. Suprotstavlja se šefu i izlazi kao pobjednik, svjestan da je to tek prva pobjeda na putu prema novom početku. Uloge: Aleksandar Berček, Neda Arnerić, Milena Dravić...'
