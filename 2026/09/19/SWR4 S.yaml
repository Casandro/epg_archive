  title: SWR4 Sprechstunde
  subtitle: 'Thema: Kochen'
  description: "Warum gelingt der Braten nicht? Wie blanchiere ich Gemüse richtig? Was muss ich beim \nFermentieren beachten? \n \nSie fragen, SWR4-Kochexperte Jörg Ilzhöfer antwortet und verrät Tricks und Kniffe. \n\nSie fragen, unsere Experten antworten.\n\nUnter folgenden Telefonnummern können Sie Ihre Fragen in der Sendung stellen:\n0711 / 92 92 92 92  oder  06131 / 92 93 92 93\n\nImmer samstags zwischen 10 und 12 Uhr geben Ihnen unsere Experten in der SWR4 Sprechstunde nützliche Tipps."
