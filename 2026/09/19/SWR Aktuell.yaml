- eventId: 559770
  start: 2026-09-19T16:00:00Z
  stop: 2026-09-19T18:00:00Z
  title: SWR Aktuell am Abend
  description: "seit 17:30\nAktuelles & Sport\n\n18:30 \nKultur - Motive, Moves und Musik-Samples - Wieviel Zitat darf sein?\nDie Dusche läuft, eine Frau seift sich ein, hinter dem Duschvorhang eine Bewegung, ein Schatten kommt näher, hebt den Arm und reißt den Vorhang zur Seite - Na, erkannt? Sofort die Duschszene aus dem Film 'Psycho'  von Alfred Hitchock im Kopfkino gehabt? Dabei hab ich die Szene nur mit Worten beschrieben. Hab ich diese bekannte Film-Szene jetzt zitiert? Oder geklaut?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n19:00 \nDer Tag- \nMehr als Bier und Kafka - unser Nachbar Tschechien\nTschechien ist Ehrengast der Frankfurter Buchmesse Anfang Oktober und wird ein \"Meer der literarischen und kulturellen Vielfalt\" präsentieren. So kündigt es die Messe an und wir ahnen: Da ist mehr als nur Bier und Kafka. Höchste Zeit also, mal über die Grenze zu schauen und mehr zu erfahren von unserem Nachbarn. Welche literarischen Traditionen gibt es und was treibt die jungen Autoren um? Aber auch: Wie geht es den Tschechen wirtschaftlich und schauen sie zufrieden auf gut zwei Jahrzehnte Mitgliedschaft in der EU? Und dann ist da noch die Sache mit dem Kulturerbe der Braukunst - und damit wir sind doch wieder beim Bier.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-tag-ein-thema-viele-perspektiven/urn:ard:show:cd24ec031ec87a00/"
