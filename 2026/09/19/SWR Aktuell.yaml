- eventId: 552158
  start: 2026-09-19T07:00:00Z
  stop: 2026-09-19T10:00:00Z
  title: SWR Aktuell am Vormittag
  description: "Seit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nREICH - Das Geschäft mit dem Zweifel\nDas Fenster im Flugzeug (3/5)\nIm Sommer 1988 schmilzt der Asphalt auf New Yorks Straßen. Der NASA-Forscher James Hansen spricht vor dem US-Senat aus, was viele längst wissen: Die Erde heizt sich auf und der Mensch trägt eine Verantwortung daran. Die Welt scheint aufzuwachen - sogar die Ölindustrie. Doch hinter den Kulissen gründet sie die Global Climate Coalition und plant den Gegenangriff.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/reich-das-geschaeft-mit-dem-zweifel/urn:ard:show:f5091cc57904afb9/ \n\n10:30 \nKultur - Trends und Hintergründe aus der Kulturszene\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nEnergiemärkte am Kipppunkt\nBlockierte Seerouten treiben die Preise für Öl, Gas und Sprit. Benzin und Diesel könnten bald drei Euro pro Liter oder mehr kosten. Bleibt das jetzt so? Politiker scheinen keine neuen Ideen zu haben. Dabei könnte die Entwicklung nun eigentlich den Blick freimachen für einen Weg in die Zukunft der Energieversorgung.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nDie Wahlen und der Kanzler \nSchon wieder steht ein Wahlsonntag bevor. Und schon wieder sind alle nervös. Nachdem die AfD in Sachsen-Anhalt haushoch gewonnen hat, schaut das Land jetzt nach Mecklenburg-Vorpommern und Berlin. Da geht es um viel - auch für den Kanzler. Der steht unter Druck. Es wird bereits über Nachfolger gesprochen. Und Merz selbst sagt sogar eine wichtige Auslandsreise ab - um in Berlin zu bleiben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
- eventId: 552549
  start: 2026-09-19T10:00:00Z
  stop: 2026-09-19T13:00:00Z
  title: SWR Aktuell am Mittag
  description: "12:00\nAktuelles & Sport\n\n12:30     \nSWR Kultur Das Wissen - TALK\nPeter Spork Epigenetik - Wie beeinflusst die Umwelt unsere Gene?\nWerden wirklich Traumata und schlechte Ernährungsgewohnheiten \"vererbt\"? So einfach, wie oft dargestellt, sind die Vorgänge nicht. Und doch: Die Epigenetik hat die Biologie revolutioniert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n13:00 \nARD Interview der Woche ~ \nNicole Markwald im Gespräch mit Anne Rabe, Schriftstellerin und politische Essayistin\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - Wie gehen andere Demokratien mit rechten Parteien um?\nWie umgehen mit rechtspopulistischen Parteien, die nach der Macht greifen? Anlässlich des Wahlsiegs der AfD in Sachsen-Anhalt blickt der Weltspiegel Podcast nach Frankreich und Ungarn: In Frankreich ist die rechtspopulistische Partei Rassemblement National eine der stärksten politischen Kräfte und treibt den Diskurs an. Ungarn hat wiederum den ultrarechten Regierungschef Viktor Orbán im April abgewählt. Wie gehen die Länder mit Rechtsaußen-Parteien um?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nSWR1 Leute mit Nele Neuhaus | Krimiautorin\nMit über 12 Millionen verkauften Büchern gilt Nele Neuhaus als Deutschlands erfolgreichste Krimiautorin. Ihre Bücher erscheinen in über 30 Ländern, viele Verfilmungen ihrer Krimis waren Quotenrenner. In ihrem neuen Taunuskrimi \"Alles wird Asche\" spielt KI eine wichtige Rolle\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/\n\n14:30 \nARD Klima Update \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/"
