    Als Pilot Frank Murphy (Roy Scheider) bei einem Testflug mit dem "fliegenden Auge" die Abhörgeräte testet, bekommt er ein brisantes Gespräch mit. Armee und Geheimdienst haben ganz spezielle Pläne für den "Blue Thunder", doch sie haben die Rechnung ohne Frank gemacht.
