    Die Völkerwanderung ist einer der epochalen Einschnitte in der europäischen Geschichte. Ein halbes Jahrtausend lang hatten die Römer weite Teile des Kontinents kontrolliert. Doch zwischen dem 5. und 6. Jahrhundert wurde die "Ewige Stadt" Rom gleich zweimal geplündert.
