    Die Dokumentation begleitet den niederländischen Eiszeit-Experten Dick Mol bei seinen Expeditionen. Er trifft auf Forscher in Europa, Kanada und den USA: Neue Funde belegen, dass die Kombination von Mensch und Klima viele Tiere an einen Kipppunkt trieb.
