  title: Das große Roy-Black-Wunschkonzert
  subtitle: Musikshow, Deutschland 2020
  description: 'Darsteller: Roy Black. Heute werden viele Wünsche nach besonderen Hits von Roy Black erfüllt, der bis heute unvergessen ist. Seine Stimme hat einen großen Wiedererkennungswert, sein oft schüchtern wirkender Augenaufschlag betörte vor allem die weiblichen Fans und seine Musik übersteht tatsächlich die Zeit. Der junge Gerhard Höllerich wurde seiner schwarzen Haarfarbe "Blacky" gerufen - und Blacky liebte Hits, vor allem von Roy Orbison: So kam es zu dem Künstlernamen. Mehr Storys seines Lebens gibt es in der Sendung.'
