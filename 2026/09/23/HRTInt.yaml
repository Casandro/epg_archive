  title: 'Emocije - sluge i gospodari: Strah od straha, dokumentarna serija (2/4)'
  subtitle: ' '
  description: 'Strah je prva emocija koja se evolucijski razvila i datira još od prije 500 milijuna godina. Unatoč godinama nije izgubila na svojoj važnosti i moći. Mehanizam straha jako je složen, no nije uvijek ugođen tako da primjereno reagiramo na određenu situaciju. Kao da se nešto u mozgu poremetilo. Znanstvenici nam pomažu da shvatimo što se događa s tim mehanizmom i kako da liječimo pretjerani strah. Gledajte nas bez straha. Stručni suradnici: prof. dr. sc. Nataša Jokić-Begić, prof. dr. sc. Zdravko Petanjek  Voditelj: Marko Makovičić Scenaristica i redateljica: Tihana Kopsa Koscenaristica i urednica serije: Eleonora Korošić Knez Glumci: Marko Makovičić i Jelena Vukmirica Direktor fotografije: Siniša Galar Montažerka: Davorka Feller Autor glazbe: Srđan Sekulović'
