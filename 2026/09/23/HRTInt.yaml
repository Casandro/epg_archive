  title: '50. Samoborska glazbena jesen: Zagrebački solisti i Božo Paradžik - Župna crkva sv. Anastazije, 26.09.2025, snimka'
  subtitle: ' '
  description: Samoborska glazbena jesen festival je koji već pet desetljeća promiče vrhunsku glazbenu umjetnost te pretvara Samobor u glazbeno središte u kojemu se idealno sjedinjuju klasična glazba i povijesne znamenitosti grada. Tijekom godina, festival se opsegom, kvalitetom i raznolikošću programa razvio u manifestaciju koja svojim sadržajem predstavlja kulturnu vrijednost od nacionalnoga značaja. Pred oltarom župne crkve sv. Anastazije, 26. rujna 2025., u jubilarnoj 50. festivalskoj godini, na svečanom otvorenju nastupili su renomirani ansambl Zagrebački solisti, a u vrhunskoj razini komornog muziciranja pridružio im se jedan od međunarodno najtraženijih kontrabasista Božo Paradžik. Repertoar Zagrebačkih solista obuhvaća skladbe baroknog, klasičnog i romantičnog razdoblja, ali i djela suvremenog žanra, a tom prigodom izveli su skladbe J. S. Bacha, J. Brahmsa, F. Schuberta, D. Pejačević, G. Puccinija, A. Vivaldija i O. Respighija.
