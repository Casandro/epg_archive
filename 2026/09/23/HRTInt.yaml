  title: Vijesti na engleskom jeziku
  subtitle: ' '
  description: 'ABBA stiže u Lisinski - i to u velikom simfonijskom izdanju! Četvero sjajnih domaćih vokala, Zagrebačka filharmonija i najveći hitovi koji već desetljećima ne izlaze iz glave. Franka, Damir Kedžo i Sven Pocrnić otkrit će nam kako zvuči kada se ABBA spoji sa simfonijskim orkestrom i što nas čeka na pozornici Lisinskog! Kredit danas, otplata godinama - shema poznata, ali uvjeti se mijenjaju. Toni Milun i financijska analitičarka Petra Posedel Šimović objasnit će nam tko će moći do kredita, koliko možemo posuditi i što će banke ubuduće gledati. Obilježavamo Svjetski dan bez automobila. Mnogi će reći: teško izvedivo. Ali što ako ga ostavimo samo na jedan dan? Možda shvatimo da nam automobil nije potreban baš za sve. Zašto nam je toliko važan i što dobivamo kada ga ostavimo u garaži, provjerili smo. Voditeljica: Barbara Kolar Redateljica: Anamaria Corazza Autorica i scenaristica: Eli Lazarova Sladić'
