  title: Helden der Evolution - Affen
  subtitle: Helden der Evolution - Affen
  description: Diese Folge spürt rund um den Globus einige unserer nächsten Verwandten auf. Primaten jeder Größe haben ihren Auftritt, vom Zwergseidenäffchen im Amazonasbecken bis hin zum imposanten Mandrill in den Tropen Afrikas. Hier dient Körperpflege der Friedensstiftung, Gähnen ist ein Zeichen der Aggression, und manche Affen heben in ihren Backentaschen einen Snack für später auf.
