  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Unwetterchaos
  description: Ein Sturm bringt Jake Smith und seine Crew über der Kenai-Halbinsel in Alaska in große Gefahr. Der Hubschrauber der US Coast Guard gerät in starke Turbulenzen, und bei schlechter Sicht kann der Pilot den Kurs nicht halten. Der Rettungseinsatz muss abgebrochen werden. Zeitgleich wird ein Jäger in den Bergen von Kodiak Island vermisst. Er hat einen Herzschrittmacher und ist offenbar zu weit ins unwegsame Gelände vorgedrungen - sein Zustand ist ungewiss.
