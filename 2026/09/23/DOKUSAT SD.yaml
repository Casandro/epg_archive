  title: 'Explosiv - Männer in gefährlicher Mission: Explosives Erbe unter Wasser'
  subtitle: 'Explosiv - Männer in gefährlicher Mission: Explosives Erbe unter Wasser'
  description: 'Unter Wasser liegen noch immer unzählige Relikte vergangener Kriege - Bomben, Minen und Munition. Für die Spezialtaucher beginnt ein riskanter Einsatz: Sie müssen die explosiven Altlasten aufspüren, bergen und unschädlich machen. Jeder Tauchgang birgt höchste Gefahr, denn im Wasser sind Sicht und Bewegungsfreiheit stark eingeschränkt. Die Doku begleitet die Männer in gefährlicher Mission bei ihrer Arbeit im unsichtbaren Minenfeld unter der Wasseroberfläche.'
