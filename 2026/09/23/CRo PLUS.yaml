  title: Ex libris
  description: Kdo je Gopnik neboli zmetek Veliký? Ruský spisovatel Viktor Vladimírovič Jerofejev ve svých Zápiscích o živém i mrtvém Rusku v tom má naprosto jasno. Knihu představí Libor Dvořák.
