  description: Jan Sýkora, výkonný ředitel Asociace malých inovativních škol. Vláda zvýšila výdaje plánované na příští rok o šest miliard korun a hlavní zvýšení se týká škol. Dostává se vláda k odpovědné podpoře učitelů a škol? Včetně škol soukromých a církevních, jejichž státní podporu nedávno Andrej Babiš zpochybňoval? Moderuje Pavlína Nečásková.
