  description: Výjimečný humanista, pedagog, pacifista a zachránce stovek dětí ohrožených hrůzami druhé světové války a poválečného bezpráví. Tím vším byl pražský kazatel Přemysl Pitter. Jeho pozoruhodný život přiblíží repríza druhé části dvoudílného dokumentárního pásma Jana Sedmidubského.
