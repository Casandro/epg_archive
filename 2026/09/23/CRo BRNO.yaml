  start: 2026-09-23T09:04:00Z
  stop: 2026-09-23T10:00:00Z
  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Poradna pro zdraví: lékařka Šárka Kunzová o odvykání kouření. Jak vzniká závislost na tabáku a proč jí podléháme, i když víme, že kouření škodí zdraví? Jak v současné době probíhá léčba a pomoc lidem závislým na nikotinu? Jakou perspektivu při odvykání kouření nabízí podpůrné prostředky, např. nikotinové žvýkačky? Moderuje Sandra Silná.'
