  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Johann Mattheson: "Die geheimen Begebenheiten Henrico IV.", Ouvertüre (Elbipolis Barockorchester Hamburg); Robert Schumann: Streichquartett F-Dur, op. 41, Nr. 2 (Marietta Kratz, Frank Wedekind, Violine; Friedrich Stenger-Lutz, Viola; Ute Sommer, Violoncello); George Onslow: Sinfonie Nr. 3 f-Moll (NDR Radiophilharmonie: Johannes Goritzki); Francis Poulenc: Sonate (Charles-Antoine Duflot, Violoncello; Martin Klett, Klavier); Louis Spohr: Konzert a-Moll, op. 131 (Bastiaan-Quartett; Rundfunkorchester Hannover des NDR: Willy Steiner)

    2.03  Das ARD-Nachtkonzert (II)

    Peter Tschaikowsky: "Dornröschen", Suite (San Francisco Symphony Orchestra: Seiji Ozawa); Leopold Anton Kozeluch: Bläsersinfonie D-Dur (Consortium Classicum); Alice Mary Smith: Sinfonie a-Moll (London Mozart Players: Howard Shelley); Wolfgang Amadeus Mozart: Sonate F-Dur, KV 533 (Evgeni Koroliov, Klavier); Henri Vieuxtemps: Violinkonzert Nr. 4 d-Moll (Henryk Szeryng, Violine; SWR Sinfonieorchester Baden-Baden und Freiburg: Hans Rosbaud)

    4.03  Das ARD-Nachtkonzert (III)

    Henry Purcell: "King Arthur", Suite (The Parley of Instruments Baroque Orchestra: Roy Goodman); Ralph Vaughan Williams: "The Lark Ascending" (Sarah Chang, Violine; London Philharmonic Orchestra: Bernard Haitink); Franz Ignaz Beck: Sinfonia D-Dur, op. 4, Nr. 1 (Czech Chamber Philharmonic Orchestra Pardubice: Marek Stilec)

    5.03  Das ARD-Nachtkonzert (IV)

    Mario Castelnuovo-Tedesco: Gitarrenkonzert Nr. 1 D-Dur, Ritmico e cavalleresquo (Narciso Yepes, Gitarre; London Symphony Orchestra: Luis Antonio García Navarro); Felix Mendelssohn Bartholdy: Variations concertantes D-Dur, op. 17 (Sol Gabetta, Violoncello; Bertrand Chamayou, Fortepiano); Joseph Bologne de Saint-Georges: Sinfonie G-Dur, op. 11, Nr. 1 (Le Parlement de Musique: Martin Gester); Ludwig van Beethoven: Septett Es-Dur, Tema. Andante con variazioni, op. 20 (Linos Ensemble); Johann Nepomuk Hummel: Rondo alla polacca A-Dur (James Ehnes, Violine; London Mozart Players: Howard Shelley); Carl Philipp Emanuel Bach: Klavierkonzert d-Moll, Allegro di molto, Wq 22 (Michael Rische, Klavier; Kammersymphonie Leipzig)
