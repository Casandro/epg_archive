  title: Elvis - Aufstieg und Fall des King
  subtitle: Teil 2, Magazines / Reports / Documentary 2005, Season:1 Episode:2
  description: '2005 ● S1 E2 ● FSK: 6 Ende 1957 wird Elvis Presley zum Militärdienst einberufen. Am 14. August 1958 stirbt seine geliebte Mutter. Ab 1. Oktober 1958 dient er bei der 3. US-Panzerdivision in Friedberg in Deutschland. In Bad Nauheim, wo er wohnt, lernt er die 14-jährige Priscilla kennen, die Stieftochter eines Army-Captains. Sie folgt ihm später nach Amerika. Elvis nimmt bereits jede Menge Tabletten. Das verschärft sich, als er Anfang März 1960 nach Amerika zurückkehrt. Magazines / Reports / Documentary 2005, Regie: James Sadwith,  Mit: Jonathan Rhys-Meyers, Randy Quaid, Rose McGowan, Season:1 Episode:2'
