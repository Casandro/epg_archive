  title: 'Radsport: Straßen-Weltmeisterschaften'
  subtitle: Straßenrennen der Herren. Im vergangenen Jahr schnitt Georg Zimmermann von den deutschen Teilnehmern am besten ab. Der gebürtige Augsburger belegte am Ende Platz 15.
  description: Mit am Start bei der aktuellen Ausgabe wird auch Georg Zimmermann sein. Der Augsburger belegte im Vorjahr schließlich den 15. Platz mit einem Rückstand von 3:52 Minuten auf den Erstplatzierten. Florian Lipowitz musste sich mit Platz 28 zufriedengeben. Den Sieg holte sich Tadej Pogacar. Für den Slowenen war es nach Bronze 2023 die zweite Medaille in Folge. Hinter ihm landeten der Australier Ben O'Connor und der Niederländer Mathieu van der Poel. (2025)
