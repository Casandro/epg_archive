  title: Close up
  subtitle: |-
    Rivers Under Pressure

    Where Is Germany’s Water Going?
  description: "This documentary follows people who are fighting to secure the future of water resources in three German states. They range from scientists to farmers, to environmental groups, and politicians. \nWe discover the consequences of decades of river straightening and hear why floodplains are so important for flood protection, drinking water supply, and climate adaptation. Using the examples of the Unstrut, Mulde, and Elbe rivers, the film illustrates the opportunities offered by renaturation projects as well as the divisions they can cause. Amid the tensions between nature conservation, agriculture, and political interests, one central question arises: How can Germany ensure more water is retained in the land in future?"
  widescreen: true
