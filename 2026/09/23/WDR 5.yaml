  description: '"Politikum - Der Meinungspodcast" legt eine kleine Sommerpause ein. Am 24.08. sind wir wieder mit neuen Folgen für Sie da. Politikum ist der Podcast für alle, die Lust auf echte Diskussionen haben, auf Argumente statt Lagerdenken. Wir bieten Orientierung, Impulse und verschiedene Perspektiven auf Politik und Gesellschaft - immer mit dem Humor, der die Welt erträglicher macht.'
