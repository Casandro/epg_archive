- eventId: 1053236
  start: 2026-09-23T00:29:00Z
  stop: 2026-09-23T01:12:00Z
  title: Spacetime
  subtitle: Die Sonne - Lebensspender und Todesstern
  description: Die Sonne ist die Quelle des Lebens auf unserer Erde. Sie bestimmt die Tageszeiten und steuert das Klima. Aber wie ist dieser Stern von scheinbar unendlicher Energie entstanden? Wissenschaftler untersuchen Winde, Eruptionen und die schwarzen Flecke auf der Sonne und welche Auswirkungen diese Phänomene auf unseren Heimatplanten haben. Wir betrachten Doppelsternsysteme und lernen, wie Licht entsteht. Und was passieren würde, wenn der gigantische Gasball erlischt.
  widescreen: true
- eventId: 1053237
  start: 2026-09-23T01:12:00Z
  stop: 2026-09-23T01:52:00Z
  title: Ariane - Europas Rakete
  subtitle: Ariane - Europas Rakete
  description: 'Die europäischen Ariane-Raketen sind ein Projekt mit großer Geschichte: In etwa 40 Jahren hat die Ariane-Serie mehr als 300 Satelliten im All platziert. Allein die Ariane 5 wurde Ende 2020 mit bis dahin 91 erfolgreichen Starts zur zuverlässigsten Trägerrakete überhaupt. Doch die Konkurrenz im Weltraum ist groß und wächst durch private Unternehmen wie SpaceX. Kann die Ariane 6 mithalten? Die Dokumentation gewährt einen Einblick in die Historie der europäischen Raketenbaureihe und deren Zukunft.'
  widescreen: true
- eventId: 1053238
  start: 2026-09-23T01:52:00Z
  stop: 2026-09-23T02:34:00Z
  title: Erde an Aliens
  subtitle: Erde an Aliens
  description: Wie aussichtsreich sind Nachrichten an Außerirdische? Was würde ein solcher Kontaktversuch beinhalten, wie sähe er aus? Bereits in den 1970er Jahren diskutieren Wissenschaftler verschiedener Nationen, wie mit extraterrestrischen Wesen kommuniziert werden könnte und schickten die erste Botschaft ins All - bisher ohne Antwort. Die Dokumentation erzählt von der Suche nach intelligenten Lebensformen jenseits der Erde und erklärt, welche Bedingungen für einen Fund erfolgversprechend sein könnten.
  widescreen: true
- eventId: 1053239
  start: 2026-09-23T02:34:00Z
  stop: 2026-09-23T03:16:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Pentagon'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Pentagon'
  description: 'Trotz zahlreicher Beweise und Aussagen von Augenzeugen über UFOs hielt sich das US-Militär jahrzehntelang bedeckt. Doch die Ereignisse während einer Navy-Übung am 14. November 2004 änderten diesen Kurs: Die Piloten zweier Super-Hornets erhielten plötzlich den ungewöhnlichen Befehl, eine unmittelbare Bedrohung aus der Luft vor der Küste San Diegos abzufangen. Sie fanden ein kleines Flugobjekt über den brechenden Wellen vor. Es war zwölf Meter lang, weiß, glatt und oval.'
  widescreen: true
- eventId: 1053240
  start: 2026-09-23T03:16:00Z
  stop: 2026-09-23T03:59:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Rendelsham'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Rendelsham'
  description: In den letzten fünfzig Jahren wurden UFOs immer mehr mit Militärpersonal und -einrichtungen in Verbindung gebracht. Tief im Wald von Rendlesham, Suffolkin kam es im Jahr 1980 zum berüchtigten Rendlesham-Vorfall. Zahlreiche Augenzeugen der amerikanischen Luftwaffe behaupten ein außerirdisches Flugobjekt beobachtet zu haben, welches im naheliegenden Wald gelandet sei. In dieser Episode versuchen Craig Charles und Sarah Cruddas, den faszinierenden Vorfall zu entschlüsseln.
  widescreen: true
