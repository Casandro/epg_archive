  title: Boeing in der Krise - Absturz eines Giganten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2025
    Boeing ist einer der größten Flugzeughersteller der Welt. Nach schweren Unfällen kommen Zweifel an der Sicherheit der Flugzeuge auf. Ist es gefährlich, mit einer Boeing zu fliegen?

    Mitarbeiter und Whistleblower berichten exklusiv von systematischen Qualitätsmängeln, mangelhafter Kontrolle und einer Unternehmenskultur, die wirtschaftliche Interessen über die Sicherheit stellt. Besonders die Produktion der "737 MAX" ist davon betroffen.
    HD-Produktion
