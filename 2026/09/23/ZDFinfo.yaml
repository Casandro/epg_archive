  title: 'planet e.: Kamtschatka - Im Bann der roten Fische'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Umweltdokumentation, Deutschland 2020
    Nach Jahren im Pazifik zieht es sie zum Ort ihrer Geburt zurück: Rotlachse wandern zu Tausenden flussaufwärts. Spektakuläre Momente in den Wasserläufen Kamtschatkas. Doch es lauern Gefahren.

    Ursprüngliche Natur als Lebensraum: ein Wohlfühlfaktor für den Lachs. So wie das russische Kamtschatka, das Reich der Vulkane, eine der wildesten Regionen überhaupt. Doch die imposante Landschaft trügt: Wilderei und kommerzieller Fischfang gefährden die Bestände.
    HD-Produktion
- eventId: 721644
  start: 2026-09-23T05:00:00Z
  stop: 2026-09-23T05:30:00Z
  title: Hightech Revolution - Sternstunden der Technik
  subtitle: Flugzeug
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien / Deutschland 2019
    Der Traum vom Fliegen ist alt. Und es gab viele Versuche, ihn zu verwirklichen - oft mit unglücklichem Ausgang. Bis zwei Brüder aus Ohio das Geheimnis des stabilen Fluges entdecken.

    Wilbur und Orville Wright führen die Erkenntnisse vieler Flugpioniere zusammen und konstruieren ein Flugzeug, das 1903 den ersten stabilen Motorflug ermöglicht. Seither erobern die Menschen den Himmel. Heute ist die ganze Welt nur eine Tagesreise entfernt.
    HD-Produktion
- eventId: 721645
