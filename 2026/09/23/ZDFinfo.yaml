  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Südamerika
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Südamerika ist der artenreichste Kontinent der Erde und die Heimat farbenfroher und erfinderischer Tiere.

    Von den Gipfeln der Anden bis zum größten Regenwald der Welt am Amazonas müssen sich die Tiere in Südamerika für ihr Überleben spezialisieren. Das treibt die Andenbären in enorme Höhen und die Mauersegler zu todesmutigen Flügen durch einen Wasserfall.
    HD-Produktion
- eventId: 717731
  start: 2026-09-23T00:45:00Z
  stop: 2026-09-23T01:30:00Z
  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Nordamerika
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Nordamerika ist der Kontinent des Wandels, auf dem Pioniere der Tierwelt das Beste aus überraschenden Chancen und wechselnden Angeboten machen.

    Nordamerika ist geprägt von Wetterextremen. Tornados donnern über die Prärie, arktische Luft fegt bis zu den südlichen Sümpfen. Luchse durchstreifen im Winter das verschneite Yukon-Territorium, Floridas Seekühe suchen heiße Quellen, um der Kälte zu entkommen.
    HD-Produktion
- eventId: 717732
  start: 2026-09-23T01:30:00Z
  stop: 2026-09-23T02:15:00Z
  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Afrika
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Afrika ist der Kontinent der großen Wildtiere. Noch. Denn auch dort steht die Natur vor extremen Herausforderungen. Für die Tiere Afrikas ist die größte Bedrohung der Mensch.

    In der Natur haben die Wildtiere eigene Strategien. Eine Hyänen-Mutter hütet ihre Jungen in einer Geisterstadt in der Wüste Namib, und im Tanganjikasee trickst der Kuckuckswels Buntbarsch-Mütter aus, damit sie seinen Nachwuchs ausbrüten.
    HD-Produktion
- eventId: 720796
  start: 2026-09-23T02:15:00Z
  stop: 2026-09-23T03:00:00Z
  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Antarktika
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Die große "Terra X"-BBC-Koproduktion "Sieben Kontinente - Ein Planet" startet mit der Folge "Antarktika". In den Hochglanzdokumentationen führt die Reise einmal um die Welt.

    Antarktika ist der kälteste Kontinent der Erde. Nur die Härtesten können dort überleben. Wie die Weddellrobben, die das Eis für ihre Atemlöcher mit den Zähnen zurückschleifen, oder die bunten Seesterne, die den eiskalten Meeresboden bedecken.
    HD-Produktion
- eventId: 720797
  start: 2026-09-23T03:00:00Z
  stop: 2026-09-23T03:45:00Z
  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Europa
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Europa ist der Kontinent, den die Menschen am meisten verändert haben. Die Tiere mussten sich anpassen und haben sich an teils ungewöhnliche Orte zurückgezogen.

    Europa ist Heimat für über 700 Millionen Menschen. Dennoch offenbart dieser überfüllte Kontinent eine unerwartete Tierwelt in den verbliebenen Rückzugsgebieten. In Gibraltar lebt Europas einziger Primat, und Wiens Friedhöfe sind fest in der Hand des Hamsters.
    HD-Produktion
- eventId: 720798
  start: 2026-09-23T03:45:00Z
  stop: 2026-09-23T04:30:00Z
  title: Terra X
  subtitle: Sieben Kontinente - Ein Planet - Australien
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Australien ist der isolierte Kontinent. Vor mehr als 70 Millionen Jahren trennte er sich von seinen geologischen Nachbarn, und seine Spezies führen seither ein evolutionäres Eigenleben.

    Die Tierwelt Australiens und Ozeaniens ist reich an bizarren Kreaturen. Durch die Dschungel Neuguineas streift der Kasuar - einer der gefährlichsten Vögel der Welt. Im Landesinneren Australiens trotzen Kängurus und Wombats Schneestürmen.
    HD-Produktion
- eventId: 721643
  start: 2026-09-23T04:30:00Z
