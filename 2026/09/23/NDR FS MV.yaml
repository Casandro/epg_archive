  description: "Hunderte von Schuhen hängen quer über der Straße, Cafés, Kunstateliers und inhabergeführte Läden prägen die Norderstraße in Flensburg. Die Straße hat sich in den vergangenen Jahren von einer Durchgangsstraße zu einem kleinen Kiez im Norden entwickelt. Die Entwicklung zum Szeneviertel gibt es nicht nur in Millionenstädten wie Berlin oder Hamburg, sondern auch in der 100.000- Einwohner-Stadt Flensburg. \n\"Die Nordreportage\" begleitet Menschen, die in der Norderstraße leben oder arbeiten, bei ihren täglichen Herausforderungen und zeigt positive wie negative Beispiele der Gentrifizierung."
