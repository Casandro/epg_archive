  description: "Noch nie mussten die Klinkermacher aus Kehdingen in Niedersachsen so viel Material auf einmal liefern: 250.000 Klinkersteine aus Elbmarschton, davon Tausende in Spezialform, für ein Großprojekt in Hamburg. Erde, Feuer, Wasser, Luft, viel mehr brauchen Ziegelsteine eigentlich nicht. Seit Ende des vergangenen Jahrhunderts werden sie wieder vermehrt verbaut und prägen das Bild in Norddeutschland. \n\"Die Nordreportage\" begleitet die Klinkermacher bei ihrem Großauftrag vom Tonabbau im Kehdinger Land bis zum Vermauern der Steine am Tichelhaus in Hamburg."
