  title: Die Nordreportage
  subtitle: Trend zu bunter Haut - Hamburgs Tattoo-Szene
  description: Tattoos sind mehr als nur ein Trend - sie sind Ausdruck von Individualität. In Hamburg versammeln sich über 75.000 Tattoo-Begeisterte auf der größten Tattoo-Messe Norddeutschlands, um Kunstwerke für die Haut zu erleben. "Die Nordreportage" zeigt, wie Hamburger Tattoo-Künstlerinnen aus Sehnsüchten bleibende Kunstwerke schaffen und ob sie ihre Kunden mit ihren einzigartigen Designs auch glücklich machen.
