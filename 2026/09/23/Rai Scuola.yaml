  title: 'Memex Nautilus - Tavola Periodica degli '
  subtitle: Memex Nautilus - Tavola Periodica degli Elementi, ordinata da 150 anni - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri and
  description: 'iamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo di una ''invenzione'' che ha cambiato per sempre il modo con cui guardiamo la realtà: la Tavola Periodica degli Elementi. Con Maurizio Peruzzini, Direttore del Dipartimento di Chimica del CNR, ne ripercorriamo la storia, da Dmitrij Ivanovic Mendeleev fino ai nostri giorni, scoprendo come funziona e come si evoluta. Con Lidia Armelao, rappresentante italiano allo IUPAC, l''organizzazione internazionale della chimica che ''custodisce'' la tavola, vediamo nei dettagli cosa succede ogni volta che si aggiunge un Elemento alla Tavola e con quali procedure se ne decide il nome scientifico. Mentre Mario Malinconico, dell''Istituto per i Polimeri Compositi e dei Biomateriali del CNR, ci racconta dell''utilizzo della Tavola nella ricerca e della sua possibile evoluzione. Con Anna Pancaldi, infine, andiamo a scoprire alcuni dettagli poco noti della biografia di Mendeleev ma entriamo anche in una zona di confine tra Chimica e Letteratura per parlare del libro più bello di sempre scritto sull''argomento: ''Il Sistema Periodico'' di Primo Levi. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
