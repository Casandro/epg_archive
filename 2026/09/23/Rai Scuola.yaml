  title: L' archipendolo - Speciale Sergio Musume
  subtitle: L' archipendolo - Speciale Sergio Musumeci Speciale Sergio Musmeci - seconda parte - Il progetto di Sergio Musmeci per il ponte sullo stretto di Messina vince il primo premio. Finalmente il geniale ingegne
  description: "rie ottiene il prestigio e la notorietà che merita. Il suo corso di Ponti e Grandi Strutture presso la facoltà di Architettura di Roma viene riconfermato. Musmeci conquista una autonomia progettuale che gli consente di realizzare la sua opera costruita più famosa: il ponte sul Basento a Potenza, da molti definito il ponte più bello del mondo. Proprio in questa struttura unica e rivoluzionaria, Musmeci mette in pratica la sua teoria del Minimo Strutturale, risultato delle sue decennali ricerche nel campo della statica delle strutture. Al culmine della carriera, a soli 54 anni, Musmeci muore per una malattia incurabile, lasciando sul tavolo di lavoro tante idee originali da sviluppare. - \n\n"
- eventId: 1079863
  start: 2026-09-23T02:30:00Z
  stop: 2026-09-23T03:00:00Z
  title: Progetto Scienza 2023 Racconti di Scienz
  subtitle: Progetto Scienza 2023 Racconti di Scienza - Profili - p. 12 - Rita Levi Montalcini - Una bambina cresciuta agli inizi del secolo scorso, in un mondo che cambia e che apre alle donne la possibilità di studi
  description: "are, di affermarsi, di scegliere. Con molte difficoltà e con grande coraggio, Rita Levi Montalcini si fa spazio in una Università dove le ragazze sono ancora poche e, anche se con una fredda approvazione paterna, decide di seguire la sua passione per la biologia, rinunciando a sposarsi e ad avere figli. Giovanissima, lavora in America insieme ai colleghi Dulbecco e Luria e, anche dopo essere rientrata in Italia, vive un'esistenza di libertà e di entusiasmo per le proprie ricerche. A lei si deve la scoperta del Nerve Growth Factor, una piccola proteina coinvolta nello sviluppo del sistema nervoso, che le varrà, molti anni dopo la scoperta, il premio Nobel. Chiara Buratti racconta l'educazione rigida della famiglia Levi Montalcini, il rapporto profondo con la gemella Paola, la volontà di affermazione e la carriera complessa di Rita, l'enorme generosità di una donna simbolo del Novecento italiano. Racconti di Scienza - Profili è il programma di Progetto Scienza di Rai Cultura che ci avvicina ai grandi fondatori e innovatori della scienza. Ogni puntata tratteggia il profilo di una figura emblematica del suo tempo, che ha dedicato la propria vita alla ricerca, alla scoperta di nuovi codici e teorie per decifrare il nostro mondo. - \n\n"
- eventId: 1079864
  start: 2026-09-23T03:00:00Z
  stop: 2026-09-23T03:30:00Z
  title: 'Memex Nautilus - Tavola Periodica degli '
  subtitle: Memex Nautilus - Tavola Periodica degli Elementi, ordinata da 150 anni - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri and
  description: "iamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo di una 'invenzione' che ha cambiato per sempre il modo con cui guardiamo la realtà: la Tavola Periodica degli Elementi. Con Maurizio Peruzzini, Direttore del Dipartimento di Chimica del CNR, ne ripercorriamo la storia, da Dmitrij Ivanovic Mendeleev fino ai nostri giorni, scoprendo come funziona e come si evoluta. Con Lidia Armelao, rappresentante italiano allo IUPAC, l'organizzazione internazionale della chimica che 'custodisce' la tavola, vediamo nei dettagli cosa succede ogni volta che si aggiunge un Elemento alla Tavola e con quali procedure se ne decide il nome scientifico. Mentre Mario Malinconico, dell'Istituto per i Polimeri Compositi e dei Biomateriali del CNR, ci racconta dell'utilizzo della Tavola nella ricerca e della sua possibile evoluzione. Con Anna Pancaldi, infine, andiamo a scoprire alcuni dettagli poco noti della biografia di Mendeleev ma entriamo anche in una zona di confine tra Chimica e Letteratura per parlare del libro più bello di sempre scritto sull'argomento: 'Il Sistema Periodico' di Primo Levi. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
- eventId: 1079865
