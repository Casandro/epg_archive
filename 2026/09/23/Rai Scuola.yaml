  title: 'Memex CambiaMenti - p. 06: Città'
  subtitle: Scienza e tecnologia stanno cambiando in modo sempre più veloce e radicale la nostra vita quotidiana. Ogni gesto, dal più semplice al più complesso, viene continuamente ridefinito e ricollocato in un contesto a s..
  description: "a volta mutato. Memex Doc 'CambiaMenti' raccoglie questa sfida: comprendere e raccontare il cambiamento, la tensione tra presente e futuro, attraverso la lente della ricerca scientifica e tecnologica. In questa puntata il conduttore Davide Coero Borga ci porta a scoprire la città del futuro, analizzando gli orizzonti della progettazione urbanistica. Le più recenti stime ci dicono che nel 2050 il 70% dell'umanità sarà urbanizzato, dunque, come verranno progettate le città? E quali saranno le nuove futuristiche modalità di spostamento? Per rispondere a queste e altre numerose domande, incontriamo Stefano Boeri, architetto urbanista di fama internazionale, e Piero Pelizzaro, giovane interprete di una nuova figura di amministratore urbano: il 'Resilience Manager'. - \n\nUn programma di Massimo Bongiorno, Davide Coero Borga, Diego Garbati, Alberto Polimanti - Testi di Massimo Bongiorno - Produttori esecutivi Diego Garbati e Livia Lauriola - Regia Alberto Polimanti - Conduce Davide Coero Borga"
