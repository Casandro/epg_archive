  subtitle: 'Progetto Scienza Newton (pt. 27) "Mutazioni genetiche e errori del DNA" - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita il '
  description: professor Luigi Naldini, direttore dell'Istituto San Raffaele Telethon SR-Tiget di Milano. Quando il DNA umano commette un errore, si possono verificare gravi conseguenze come lo sviluppo di malattie genetiche rare. Per curarle sono state sviluppate tecniche sempre più efficaci come la terapia genica o tecnologie avanzate come il sistema CRISPR/cas9 che permette di modificare permanentemente i geni all'interno del DNA con promettenti ma anche controverse ricadute sulla salute pubblica. I ricercatori Alessio Cantore e Michela Milani ci portano nei laboratori dell'Istituto San Raffaele Telethon SR-Tiget di Milano e ci mostrano la ricerca sulla terapia genica per la cura dell'emofilia, malattia rara che colpisce il fegato. Pietro Greco smaschera infine la truffa scientifica di Alexis Carrel che nel secolo scorso ha convinto mezzo mondo di aver trovato il segreto dell'immortalità. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga.
