  title: Progetto Scienza STEM - p. 19 - Logistic
  subtitle: Progetto Scienza STEM - p. 19 - Logistica - Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcun
  description: "i tra i maggiori esperti del mondo della ricerca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna alla scoperta dei segreti della logistica moderna. Ogni giorno migliaia di navi scaricano su decine di migliaia di camion e di treni centinaia di migliaia di container, con merci destinate a milioni di magazzini e negozi per soddisfare le esigenze di miliardi di consumatori. Raccontano la loro esperienza e le loro ricerche il professor Vittorio Marzano, che insegna all università Federico II di Napoli; Maurizio Cociancich, amministratore delegato di Adriafer; Carla Marino, una giovane ingegnere che si occupa di distribuzione dell'energia elettrica all'Enel; Massimo Marciani, uno statistico consulente del ministero dei Trasporti; Ennio Cascetta, professore al Mit di Boston; e Simone Fiorenti, un ingegnere che ha progettato e sta sviluppando un drone a guida autonoma per la consegna delle merci nelle città e nelle zone disagiate. - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
