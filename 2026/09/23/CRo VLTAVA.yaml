- eventId: 1101898
  start: 2026-09-23T08:02:00Z
  stop: 2026-09-23T09:00:00Z
  title: Vizitka
  description: 'Kristýna Kočová, ředitelka Kreativní Prahy + festival Poznej Vltavu. Praha podruhé ožije multižánrovým městským festivalem Poznej Vltavu. Akce ve sváteční den, v pondělí 28. září rozproudí aktéry i návštěvníky od nového Dvoreckého mostu až po Podbabu a představí Vltavu jako významnou součást identity Prahy - jako řeku, která propojuje město nejen geograficky, ale taky kulturně a společensky. Festival Poznej Vltavu pořádá městská organizace pro rozvoj kultury Kreativní Praha. Její ředitelkou je Kristýna Kočová. Co může městu přinést, když začne kulturu vnímat jako důležitou součást svého rozvoje? A jak se osvědčil projekt Židle a stolky, který je ve veřejném prostoru hlavního města už deset let? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
