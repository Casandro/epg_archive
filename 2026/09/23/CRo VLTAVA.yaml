  title: Betonový lidi
  description: Snění. Na Vltavě startuje nová audiosérie s názvem Betonový lidi. Rapper a umělec Vladimir 518 v ní odkrývá myšlenky, které formovaly česká sídliště. A přibližuje oficiální i neoficiální kulturu, která na nich vyrostla. První epizoda je věnovaná snění, tedy utopickým myšlenkám, které stály u zrodu nejen českých sídlišť. Na dokument naváže bonusový rozhovor s teoretikem a historikem architektury Rostislavem Koryčánkem.
