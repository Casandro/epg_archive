    Wer schreibt Lara Briefe?

    Lara will mal wieder nur über sich reden: wie schön sie ist und wie toll sie alle finden. Doch niemand interessiert sich dafür, keiner hört ihr zu. Alle wollen viel lieber Wiesenball spielen.

    Um die Aufmerksamkeit zu erhöhen, zeigt Lara den anderen auf Rosenblättern geschriebene Liebesbriefe und behauptet, sie wüsste nicht, wer ihr heimlicher Verehrer ist. Maja nimmt Lara ernst und will ihr helfen, herauszufinden, wer die anonymen Briefe schreibt.

    Doch die Schriftproben der Freunde ergeben, dass es keiner von ihnen war. Auch sich auf die Lauer zu legen, führt nicht zum Erfolg. Als Maja und Willi die Postameise interviewen, finden sie schließlich des Rätsels Lösung: Lara schreibt sich die Briefe selbst! Maja formuliert einen letzten Liebesbrief, in dem der anonyme Schreiber die Korrespondenz mit Lara beendet.
    Regie: Daniel Duda
