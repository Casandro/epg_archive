    Eine Frage der Größe

    Koks ist eine Winzigkeit gewachsen und gehört nun zur Kategorie "wirklich gefährliche Drachen". Um seinem Freund zu helfen, bezeichnet Rösti ihn als harmloses "Haustier". Damit beleidigt er Koks zutiefst. Da er sowieso die Eiserne Burg wegen seiner neuen Größe verlassen muss, zieht er zu den Feuerzangenbrüdern. Von ihnen will er sich zu einem echten Diplom-Drachen ausbilden lassen. Ist er dafür sogar bereit, einen Ritter zu "rösten"?
