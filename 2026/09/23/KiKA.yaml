    Der beste Film der Welt

    Grisu soll die Feuerwehr bei der Arbeit filmen! Das macht er sofort und ersetzt den verletzten Regisseur Ratatino. Aber alles, was der Kameramann Grisu filmt, ist Ratatino zu langweilig. Als die Feuerwehr zu einem echten Einsatz gerufen wird, scheint es für Ratatino endlich spannend zu werden. Aber auch ein Vogelnest auf einem Schornstein ist Ratatino zu langweilig. Da platzt Grisu der Kragen und er spuckt plötzlich aus Versehen Feuer.
