    Als Jasina für ein Foto-Projekt der Schule eine Hafenrundfahrt mit ihrer Lieblingskapitänin Anja macht, hat ihre Barkasse plötzlich einen Motorschaden und droht, gegen ein Containerschiff zu prallen. Jasina und Anja können Schlimmeres verhindern, aber schnell ist klar: dies ist ein Fall von Sabotage und offenbar nicht der erste: auf Anjas Kassenhaus prangt in großen Lettern und auf Plattdeutsch: Du widerliche Betrügerin. Die einzige Spur führt Jasina zu einem Seniorenheim. Dort lebt ein ehemaliger Kapitän zur See, dessen Enkel Janne alles tun würde, um seinem Opa den größten Wunsch zu erfüllen: eine letzte Fahrt am Steuerrad durch den Hamburger Hafen. Aber warum richtet sich so viel Zorn ausgerechnet gegen Anja und ihr Barkassenunternehmen? Und welche Rolle spielt die Agentur, die Janne versprochen hatte, den Wunsch seines Opas zu erfüllen?
