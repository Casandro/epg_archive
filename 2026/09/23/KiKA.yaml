    Als Bö auf ihrer Laute ein kleines Lied spielt, kontert Rösti mit seinem "Rostonium". Mit seiner Melodie schafft er es bis nach ganz oben in die Hitliste. Dann aber dreht sich der Wind. Denn nun wollen seine Fans einen neuen Song. Doch die kleine Drehorgel hat nur eine einzige Melodie. Da kommt Bös Song gerade recht. Nur dumm, dass niemand sie um Erlaubnis fragt, ihn zu verwenden. Das gibt Ärger!
