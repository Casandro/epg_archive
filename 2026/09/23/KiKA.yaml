  title: Pip und Posy
  subtitle: Magico Mystico
  description: |-
    Magico Mystico

    Zac freut sich auf die Zaubervorstellung, die Frankie für all ihre Freunde plant, und beobachtet sie beim Üben. In seinem Enthusiasmus verrät er jedoch während der Show Frankies Tricks.

    Das gefällt Frankie natürlich gar nicht, und sie hat keine Lust mehr, zu zaubern. Pip und Posy müssen vermitteln, und wie immer finden sie eine optimale Lösung: Frankie, die Zac nicht lange böse sein kann, ernennt ihn kurzerhand zu ihrem Zauberassistenten.

    Die Vorstellung kann nun ohne weitere Störungen über die Bühne gehen.
