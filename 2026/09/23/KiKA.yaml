  title: Die Biene Maja
  subtitle: Die Verschwörung
  description: |-
    Die Verschwörung

    Willi und Maja finden das Notizbuch von Richter Bienenwachs und entnehmen seinen Aufzeichnungen, dass er die Königin vom Thron stürzen und selbst die Macht im Bienenstock übernehmen will.

    Die beiden ziehen Frau Kassandra ins Vertrauen, doch kurz darauf werden sie verhaftet und ins Gefängnis geworfen. Maja ist entsetzt, dass Frau Kassandra anscheinend gemeinsame Sache mit dem Richter macht. Sie flieht aus dem Gefängnis, um die Königin zu warnen.

    Sie berichtet ihr von der Verschwörung gegen sie, und beide fliehen. Zusammen verbringen sie eine Nacht in der Wiese, doch am Morgen kommt Willi zu ihnen, begleitet von zwei Wachen, und lässt die Königin und Maja erneut festnehmen. Maja glaubt, dass der Richter nun auch noch Willi auf seine Seite gezogen hat, doch zum Glück irrt sie.
