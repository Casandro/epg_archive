  title: Pip und Posy
  subtitle: Die gruselige Lizzy
  description: |-
    Die gruselige Lizzy

    Pip und Posy malen zusammen. Plötzlich macht sich eine freche Krähe über Pips Erdbeeren im Garten her. Pip verscheucht sie und zeigt Posy dann sein fertiges Bild.

    Posy findet das Bild so toll, dass Pip es ihr schenkt. Und Posy möchte ihr Bild Pip schenken. Es ist eine ziemlich finstere Figur, die Posy Lizzy genannt hat. Pip findet das Bild unheimlich. Posy soll davon aber nichts merken.

    Die Freunde hängen Lizzy gemeinsam auf. Doch als Posy gegangen ist, nimmt Pip das Bild schnell wieder von der Wand ab. Leider kommt Posy noch einmal zurück, weil sie Froschi vergessen hat und wundert sich, warum ihr Bild nicht mehr an seinem Platz hängt. Nach einigem Hin und Her gesteht Pip, dass ihm das Bild einfach zu unheimlich ist, weil die Augen von Lizzy ihm überall hin zu folgen scheinen und ihn anstarren.

    Posy gibt ihrem Freund recht und sie suchen zusammen nach einem geeigneteren Platz für Lizzy. Sie finden keine gute Alternative. Doch als sie sehen, dass die freche Krähe sich schon wieder über Pips Erdbeeren hermacht, hat Posy eine geniale Idee.
    Regie: Seán McCormack
    Buch/Autor: Joe Sellman-Leava, Matt Baker
    Musik: Ellie Wyatt, Joss Peach
