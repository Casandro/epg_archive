  description: |-
    2D-Animationsserie, Frankreich / Spanien 2017
    Mysteriöse Mosaiken

    Mirette will in Barcelona Fotos von den berühmten Mosaiken im Park Güell machen, aber jemand hat die Kunstwerke unter Webteppichen versteckt. Wer war das? Und warum? Schon sind Mirette und Jean Cat mitten in den Ermittlungen und auch Mops Don Carlos ist wieder mit von der Partie. Verräterische Reifenspuren führen zu einem Rentnerclub. Hat der alte Herr im Rollstuhl etwas gegen Mosaiken? Oder die reizende alte Dame, die Jean Cats Herz mit Choomalloos erobert? Doch wie es sich zeigt, ist es gar nicht so leicht, mit den älteren Herrschaften Schritt zu halten...
