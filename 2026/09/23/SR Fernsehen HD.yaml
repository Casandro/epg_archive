  title: 'Abenteuer Diagnose: Fatale Entzündung (3)'
  description: |-
    Medizin als Detektivgeschichte. Für Nicole M. ist Sport ihr Leben. Sie leitet ein Fitnessstudio - bis plötzlich heftige Gelenkschmerzen in Knien, Händen, Schultern und Rücken auftreten. Physiotherapie hilft nicht, dann kommen Durchfall, Bauchschmerzen und Fieber hinzu. Ist es eine Infektion? Oder gibt es einen anderen Grund für ihre zunehmende Schwäche? An Heiligabend spitzt sich die Lage dramatisch zu: Atemnot, glühender Kopf, steifer Nacken - die Familie ruft den Rettungswagen.
