- eventId: 553171
  start: 2026-09-23T21:03:00Z
  stop: 2026-09-23T22:00:00Z
  title: WDR 3 Open
  subtitle: 'Airto Moreira: Trommelwirbel zum 85.'
  description: "Geboren am 5. August 1941 begann Airto Moreira mit Samba, Bossa Nova und brasilianischem Jazz, spielte bald mit Weltstars wie Miles Davis, John McLaughlin, Herbie Hancock, Joni Mitchell, Carlos Santana und gewann mit Mickey Harts Album \"Planet Drum\" einen Grammy. Seine Alben mit seiner Frau Flora Purim sind Kult. 2026 erschien \"Maracanós\", ein Album, das sich zwischen MPB, Jazz und Rock bewegt. \nDas nächste Mal feiert Antje Hollunder in Open World von WDR 3 sozusagen mit einem Trommelwirbel den 85. Geburtstag von Airto Moreira, einem der profiliertesten Perkussionisten Brasiliens des letzten halben Jahrhunderts mit legendärer Weltkarriere. \n<strong>Tombo in 7/4</strong> | 6:20<br/>Airto Moreira\n<strong>Samblues</strong> | 2:12<br/>Sambalanço Trio\n<strong>Misturada</strong> | 4:15<br/>Quarteto Novo\n<strong>Xibaba</strong> | 4:36<br/>Airto Moreira\n<strong>Toque de Cuíca</strong> | 3:55<br/>Airto Moreira\n<strong>Udu Chant</strong> | 3:44<br/>Mickey Hart feat. Sikiru Adepoju, Zakir Hussain, Airto Moreira\n<strong>Lua</strong> | 7:55<br/>Fourth World\n<strong>Ritmo do Mundo</strong> | 5:48<br/>Airto Moreira\n<strong>Pau Rolou</strong> | 3:37<br/>Airto Moreira"
