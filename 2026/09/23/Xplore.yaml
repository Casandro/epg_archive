  title: Foodwise - Shaoguan
  subtitle: Foodwise - Shaoguan
  description: Tianran und Hannah befinden sich in der malerischen Stadt Shaoguan in der Provinz Guangdong in Südchina. Sie probieren Tee aus der Danxia-Landschaft und genießen Bergprodukte, bevor sie in einem von einer Mauer umgebenen Hakka-Dorf selbst Reisnudeln zubereiten. Sie erfahren mehr über die Südwanderung der Hakka und ihre Auswirkungen auf den lokalen Tee und die lokale Küche. Ihre Reise endet in einem tausend Jahre alten buddhistischen Tempel. Dort erleben sie, wie die Mönche ihre Praxis in ihren Alltag integrieren und erfahren, warum Tee für Zen so wichtig ist. CN 2023
