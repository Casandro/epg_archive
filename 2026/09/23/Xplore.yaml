  title: VIP Trip - Prominente auf Reisen 2 - Antarktis 2 mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Antarktis 2 mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 2: Die Antarktis und die südamerikanische Millionenmetropole Buenos Aires: Unterschiedlicher könnten zwei Ziele auf einer Reise nicht sein. Begleiten Sie den bekannten Tatort-Kommissar Richy Müller auf einer Reise voller Gegensätze. Die Expedition beginnt in Buenos Aires im Bundesstaat Palermo, der Stadt mit ihrer überschäumenden Lebensfreude und dem besonderen südamerikanischen Flair. So lässt es sich Richy Müller nicht nehmen, einmal ein echtes und saftiges argentinisches Rindersteak zu kosten, so wie es die Argentinier lieben. Ein perfekter Start für eine abenteuerliche Reise. Wer isst, der brauch auch Bewegung! Wie gut, dass Buenos Aires quasi die Hauptstadt des Tangos ist. Was liegt da näher für Richy Müller als eine kleine Lektion? In Argentinien ist der Polo-Sport sehr populär. Daher schwingt sich auch Richy Müller aufs Pferd und versucht sich in einer Partie mit und gegen die Einheimischen. Von Buenos Aires geht es dann zunächst nach Ushuaia und dann mit dem Schiff südlich quer durch den Südatlantik und die gefürchtete, stürmische Drake-Passage. Vorbei an bläulich schimmernden Eisbergen gelangen Richy Müller und die Kameracrew schließlich in die fast unwirkliche Welt der Antarktis. Das Reich der Pinguine und des ewigen Eises. Hier steht übrigens die südlichste Poststelle der Welt und auch eine polare polnische Forschungsstation, die Richy Müller anlockt und die er einfach besuchen muss.   DE 2015'
  ageRating: 12
- eventId: 1065345
  start: 2026-09-23T17:25:00Z
  stop: 2026-09-23T17:45:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Nordirland mit Ralf Bauer
  subtitle: VIP Trip - Prominente auf Reisen 2 - Nordirland mit Ralf Bauer
  description: 'Begleiten Sie den Schauspieler Ralf Bauer ins malerische Nordirland.  Erleben Sie mit ihm das Wechselspiel von windigen, durchs raue Meer geformten Küsten und sanften idyllischen  Landschaften im Landesinneren. Durch beschaulich harmonische Fischereidörfer, vorbei an unzähligen Schafen, die auf den grünen Wiesen grasen, führt uns unser erster Stopp zum Dunluce Castle, der größten Burg in ganz Nordirland. Gelegen an den steilen Hängen der Küste fügt sie sich nicht nur harmonisch in die Landschaft ein, sondern erzählt zugleich noch etwas über die Geschichte Nordirlands. Neben der Schauspielerei pflegt Ralf Bauer auch noch eine andere Leidenschaft: Das Motorradfahren. So ist es nicht verwunderlich, dass uns unsere Reise auch zur größten Sportveranstaltung des Landes führt, dem "North West 200 - Rennen". Einem Motorradrennen, bei dem sich die Fahrer bei bis zu 300 km/h wahrlich alles abverlangen. Selbstverständlich führt uns unsere Reise auch nach Belfast. Die Hauptstadt Nordirlands ist nicht nur der Ort, an dem die weltberühmte "Titanic" gebaut wurde, sondern sie ist zudem eine junge, durch ihre wechselvolle Geschichte geformte Stadt. Das aufstrebende Belfast bietet neben viktorianischer Architektur auch zahlreiche Freizeitaktivitäten. So darf für Ralf Bauer ein Besuch beim Golf, Irlands Volksport Nummer 1 und eine Fahrradtour durch den Park von Belfast auf keine, Ausflugsprogramm fehlen. Natürlich gehören auch die zahlreichen pittoresken Pubs zum absoluten Muss. Also: Begleiten Sie doch Ralf Bauer in den angesagtesten Pub von Belfast und lernen Sie zugleich noch etwas über die Geschichte des Whiskeys. DE 2011'
  ageRating: 6
- eventId: 1065346
  start: 2026-09-23T17:50:00Z
  stop: 2026-09-23T18:10:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Tasmanien mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Tasmanien mit Richy Müller
  description: Seien Sie dabei, wenn der beliebte Schauspieler Richy Müller  Australiens südlichsten Bundesstaat  Tasmanien erkundet. Seine Reise beginnt dabei in Hobart. Die größte Stadt der Insel ist nicht nur das kulturelle und wirtschaftliche Zentrum Tasmaniens, sondern kann sich aufgrund ihres Gründungsjahres 1804 auch mit dem Titel ,,zweitälteste Stadt Australiens'' schmücken. Landesweit ist die Stadt vor allem für den 'Salamanca Market' bekannt. Dieser Straßenmarkt ist fest in der Geschichte der Stadt verankert und lockt an Wochenenden bis zu 25.000 Besucher an. Tasmaniens  heimliches Wappentier ist der 'Tasmanische Teufel'. Dieses sehr scheue und zugleich faszinierende Tier, kommt ausschließlich auf Tasmanien vor und kann bisweilen - mit etwas Glück ' auch von Touristen beobachtet werden.  Darüber hinaus bietet die Insel unzählige Möglichkeiten für sportliche Betätigung. Immerhin gelten die Australier allgemein als äußerst sportbegeistert. So lädt die Bucht von Hobart auch Richy Müller zu einer entspannten Tour mit dem Kajak ein. Vorbei an traumhaft gelegenen Häusern und zahlreichen Booten, zeichnet sich hier von der Seeseite aus ein ganz besonders Stadtbild ab. Doch nicht nur die Küste lädt zum Verweilen ein. Das nächste Ziel des Tatort-Kommissars ist der Lake Dove. Dieser im Inneren der Insel gelegene See bietet mit seinen zahlreichen Wanderwegen am Ufer reichlich Platz, um die Seele baumeln zu lassen. Dabei schaffen die Wälder der Landschaft eine melancholische, fast schon märchenhafte Atmosphäre. DE 2012
