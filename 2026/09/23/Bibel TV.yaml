  title: Ein Hauch von Himmel
  subtitle: Der verlorene Kompass
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Normandie im Juli 1944: Fünf amerikanische Soldaten sind hinter den feindlichen Linien gefangen; überall lauert Gefahr. In einem eroberten Unterstand der Deutschen stoßen sie auf Monica, die als Kriegskrankenschwester arbeitet. Die Soldaten halten Monica für eine gegnerische Spionin und nehmen sie gefangen. Als dann noch ihr Sergeant von einer deutschen Kugel erschossen wird, scheint die Lage für die führungslose Einheit aussichtslos. Den nahen Tod vor Augen schreibt jeder der Männer einen Abschiedsbrief an seine Lieben in der Heimat. Jeder verspricht, die Briefe der Kameraden an die Adressaten weiterzuleiten, falls er als Einziger überleben sollte. Nur Private Joe Faraday macht nicht mit. Er ist egoistisch und rücksichtslos und hat nie den Wert von Liebe und Opferbereitschaft kennengelernt. Kann Monica ihm helfen, sein Leben auf die gute Bahn zu bringen, bevor es für Joe zu spät ist? - Della Reese glänzt mit ihrer Interpretation des berühmten Liedes "Always" von Irving Berlin.'
