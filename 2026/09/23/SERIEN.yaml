  title: Cedar Cove - Das Gesetz des Herzens - Alles auf Anfang
  subtitle: Cedar Cove - Das Gesetz des Herzens - Alles auf Anfang
  description: Grace geht gegen ihren Ex-Mann Dan vor Gericht und Olivia führt die Verhandlung. Sie entwickelt einen Plan, um ihrer Freundin zu helfen. Jack gerät in inneren Konflikt, als sein Boss ihn beauftragt,, einen lobenden Artikel über den Baulöwen Warren Saget schreiben. Justine ist dabei, sich selbst zu überfordern, als sie versucht, ihren neuen Freund Luke zu unterstützen, einen Neuanfang zu finden.  US 2013
  ageRating: 6
