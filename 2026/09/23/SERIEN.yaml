  title: Borgia - Pfingsten
  subtitle: Borgia - Pfingsten
  description: Rodrigo und Giulia sind dem Vitriolo verfallen. Während Alessandro seine Schwester aufs Land schickt, hält Rodrigos Sekretär Gacet im Vatikan die Fäden in der Hand. Erneut plant Della Rovere, Gacet auszuschalten. Cesare holt Lucrezias Sohn Giovanni zurück nach Rom. Er gibt sich als dessen Vater aus, übergibt den Kleinen aber in Lucrezias Obhut, da er zum französischen Hof in Lyon aufbricht. FR 2012
  ageRating: 16
- eventId: 1065303
  start: 2026-09-23T22:50:00Z
  stop: 2026-09-23T23:44:00Z
  title: Borgia - Die Heilige Dreifaltigkeit
  subtitle: Borgia - Die Heilige Dreifaltigkeit
  description: Während Rodrigo sich einen Entzug vom Vitriolo auferlegt und Lucrezia Alfonso D'Este einen Posten in Rom sichert, hofft Cesare, in Lyon Carlotta zu erobern. Beim Jeu de Paume spielen Cesare und König Karl VIII um die junge Hofdame. Cesare gewinnt, doch Karl verletzt sich und stirbt bald darauf. Um sein Ziel zu erlangen, macht er sich Karls Nachfolger Ludwig zum Verbündeten. FR 2012
