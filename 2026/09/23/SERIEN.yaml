  title: Cedar Cove - Das Gesetz des Herzens - Der Schlüssel zum Glück
  subtitle: Cedar Cove - Das Gesetz des Herzens - Der Schlüssel zum Glück
  description: Olivia ist in großer Sorge um ihre Freundin, als sich herausstellt, dass ihr Ex-Mann Dan Grace bei der Scheidung betrogen hat. Als sie Grace drängt, erneut vor Gericht zu gehen, erwartet sie eine große Überraschung. Derweil kämpft Justine schwerer als gedacht mit ihrer Trennung von Seth, der nach Alaska gegangen ist. Durch Ian und Cecilia lernt sie Luke kennen, der ein tiefes Geheimnis hat. US 2013
  ageRating: 6
