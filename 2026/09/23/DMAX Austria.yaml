    Eine Reisende aus Ägypten hat am Flughafen Sabiha Gökçen in Istanbul angeblich Schwierigkeiten, sich an den Schlosscode zu erinnern. Doch als eine Beamtin androht, den Koffer aufzubrechen, fällt ihr die Zahlenkombination plötzlich wieder ein. Die Dame wirkt sichtlich angespannt. Eine Frau aus Kasachstan hat sich nicht über die Einfuhrbestimmungen informiert. Ihr Fleisch wird kontrolliert entsorgt. Und im Gepäck eines Passagiers aus Dubai wecken Armbänder das Interesse des Zolls. Die große Anzahl deutet darauf hin, dass sie für gewerbliche Zwecke bestimmt waren.
