  title: Bondi Beach - Die Rettungsschwimmer von Sydney
  subtitle: Die Supermond-Challenge
  description: |-
    Die Rippströme am Bondi Beach sind tückisch. Heute geraten mehrere Personen zeitgleich in den gefährlichen Meeressog. Als Lifeguard Beardy ausrückt, um zu helfen, sieht er sich im Wasser mit einer Überzahl an Menschen konfrontiert. Zum Glück sind Chappo sowie aufmerksame Surfer zur Stelle, um das nötige Backup zu geben. Später starten die Rettungsschwimmer:innen beim Team-Wettkampf im Laufen, Schwimmen und Paddeln durch. Das kilometerweite Kräftemessen wird dieses Jahr zur Supermond-Challenge mit heftigen Windböen, starker Strömung und üblen Wellen.
