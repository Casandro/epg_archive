  widescreen: true
  subtitled: true
  description: |-
    Auch im dicht besiedelten Europa gibt es noch wilde Naturlandschaften. Eine solche ist die Hohe Tatra an der Grenze zwischen der Slowakei und Polen.

    Mit einer Grundfläche von nur 30 mal 20 Kilometern nennt man die Hohe Tatra auch "das kleinste Gebirge der Welt". Diese Bezeichnung ist jedoch irreführend: Viele der 300 Gipfel sind über 2500 Meter hoch. Der höchste Berg - die Gerlachspitze - misst 2655 Meter.
