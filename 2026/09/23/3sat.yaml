  description: |-
    Dichter Bergwald, darüber sanftes Wiesen und Almgelände: Die bayerischen Voralpen sind im Vergleich mit den hohen Alpengipfeln ein eher unspektakuläres Gebirge.

    Abgesehen von ein paar markanten Felsen, die wie Riffe aus dem Meer einer idyllischen Landschaft emporragen: Roß- und Buchstein, der Leonhardstein, die Daffensteine und der Blankenstein. Die schroffen Felswände dieser Berge eignen sich hervorragend zum Klettern.
