  title: Host Dopoledního expresu
  description: Zámeckým pánem na vlastní pěst. Hostem Dopoledního expresu dnes bude historik a univerzitní pedagog doc. PhDr. Janem Kiliánem, který historií nejen zkoumá a vyučuje, ale také jí zachraňuje. Se svou partnerkou v roce 2018 zakoupili zchátralý a opuštěný pozdně barokní zámek v Krásném Lese na Ústecku. S pomocí doborovolníků a neutuchající vášní ho postupně opravují a probouzejí k životu. Jak se z akademické půdy přechází k náročné rekonstrukci památky a co všechno obnáší záchrana historického objektu? Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Lenka Šobová.
