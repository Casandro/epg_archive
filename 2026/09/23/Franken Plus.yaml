  title: TVO - Grüß Gott Oberfranken
  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen Sie Ein..
  description: 'Menschen aus Oberfranken, die Berührendes mit uns teilen. Kirchengemäuer, die Geschichten erzählen oder Orte, die das Potenzial zum Lieblingsplatz haben: Grüß Gott Oberfranken widmet sich alle vier Wochen einem anderen Thema aus der Region. Ob die soziale Arbeit der Diakonie, die Sanierung von Pfarrhäusern, Kunst und Kirchenmusik, Schöpfung und Pilgerwege oder christliche Tradition und Veränderung - das regionale evangelische Kirchenmagazin berichtet über Menschen, Aktionen und Themen, die uns bewegen, beschäftigen und ans Herz gehen. Moderatorin Maike Stark führt Sie durch die Sendung. Die Sendung läuft jeden zweiten und vierten Mittwoch im Monat. Weitere Wiederholungen laufen von Donnerstag bis Sonntag. Franken Plus strahlt die Sendung via Satellit zeitversetzt jeweils eine Stunde später aus.'
