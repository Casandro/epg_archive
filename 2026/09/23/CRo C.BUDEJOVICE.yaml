  title: Melodie podvečera
  description: 'Pořad písničkových gratulací, přání a pozdravů, v němž zní nejoblíbenější melodie české populární hudby posledních 50 let. Do pořadu můžete telefonovat na číslo 221 55 44 11, posílat SMS na telefonní číslo 9001103 (ve tvaru: CB MP text) či psát prostřednictvím webového formuláře, který se zobrazí, když kliknete na název pořadu, anebo posílat poštou na adresu: Český rozhlas, U Tří lvů 1, 370 01 České Budějovice'
- eventId:
  - 1101244
  - 1111951
  start: 2026-09-23T16:30:00Z
  stop: 2026-09-23T17:00:00Z
  title: Kulatá muzika
  description: Jedna z prvních dam ušlechtilého popu v písničkách, které proslavili jiní a jiné. Tak lze nadepsat hudební půlhodinku, které bude dominovat brilantní interpretace songů patřících do šuplíku klasiky popu, jazzu a rhythm-and-blues. V roce 2014 ji pod příznačným názvem Nostalgia vydala anglická zpěvačka Annie Lennox. Většina posluchačů si ji pamatuje jako hlas kapely Eurythmics, která zářila v 80. letech. Zpěvačka na úspěšnou éru, kdy tvořila v tandemu s kolegou Davem Stewartem, navázala neméně pozoruhodnou sólovou kariérou. V ní se více otevřela dalším žánrům a vycizelovala svůj vokální výraz na úroveň, kterou oceňují jak posluchači, tak i profesní kolegové a zasvěcení odborníci. K poslechu zve Martin Schuster.
