    PL, 2021
    Reżyseria: Konrad Zagórski
    Cykl reportaży niewiele mający wspólnego z typowym przewodnikiem turystycznym. Dunaj to druga najdłuższa rzeka w Europie oraz północna granica Bałkanów. Razem z Leną wybierzemy się w podróż wzdłuż tej granicy i odwiedzimy rozlewisko Dunaju w Rumunii, Nowy Sad w Serbii czy miejsce, w którym Dunaj spotyka się z Drawą w Chorwacji. W każdym miejscu poznamy lokalnych bohaterów, którzy pokażą nam trzy różne perspektywy życia przy tej niesamowitej rzece.
  ageRating: 12
