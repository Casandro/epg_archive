    W dniu osiemnastych urodzin Ewy Romeo jest zazdrosny o kontakt ze strony Aleksa. Tymczasem poszukujący tożsamości ojca Broda odkrywa, że jego matka przed laty przyjęła od mężczyzny pieniądze za obietnicę zniknięcia z kraju. Z kolei Aldona i Borys wpadają w panikę po znalezieniu trujących lisówek w partii suszonych grzybów, która częściowo trafiła już do pana Bogumiła.
