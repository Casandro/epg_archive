  subtitle: Dunaj to druga najdłuższa rzeka w Europie oraz północna granica Bałkanów. Widzowie odwiedzą rozlewisko w Rumunii, Nowy Sad w Serbii i miejsce, gdzie Dunaj spotyka się z Drawą w Chorwacji.
