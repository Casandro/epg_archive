    PL, 2025
    Reżyseria: Rafał Kotomski
    Występują: Piotr Sierecki
    Podróż przez polskie miasta i miasteczka - niegdyś tętniące życiem ośrodki społeczności żydowskiej - inspirowana książką Mordechaja Canina "Wśród ruin i popiołów". To wyprawa śladami pamięci, zapomnianej historii i pozostawionego dziedzictwa. Serial dokumentalny, zainspirowany kontrowersyjnym reportażem Mordechaja Canina "Wśród ruin i popiołów", zabiera widzów w poruszającą podróż po dziesiątkach polskich miast i miasteczek, które niegdyś stanowiły prężne ośrodki żydowskiego życia i kultury.
  ageRating: 12
  genre:
  - '149'
  subtitle: Serial przedstawia dokumentalną podróż przez polskie miasta niegdyś żywo związane z kulturą żydowską.
