    odc. 6 Jurek proponuje Marysi wspólne mieszkanie, dopóki nie uda jej się znaleźć innego bezpiecznego miejsca. Irka w trakcie wykonywania jednego z zadań konspiracyjnych zauważa, że ktoś ją śledzi. Okazuje się, że to Stefan, przyjaciel Kamila z wojska. Uciekł z obozu i szuka pomocy. To spotkanie znów daje Irce nadzieję, że jej narzeczony żyje. Zabiera Stefana do domu, by zamieszkał z jej rodziną.
