  subtitle: W dniu osiemnastych urodzin Ewy Romeo jest zazdrosny o kontakt ze strony Aleksa. Broda dowiaduje się, że jego matka wzięła pieniądze za obietnicę zniknięcia z kraju. Aldona i Borys panikują, bo trujące grzyby trafiły do Bogumiła.
