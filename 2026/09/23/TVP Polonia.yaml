  title: Życie nad rozlewiskiem - odc. 13/13
  description: |-
    Tytuł oryginalny: Życie nad rozlewiskiem
    PL, 2011
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Joanna Fertacz
    Mieszkańcy postanawiają rozwiązać sprawę uciążliwego quadowiska. Znajdują sposób, by pozbyć się Mirki. Piszą do nadleśnictwa petycję w sprawie zatruwania środowiska naturalnego oraz hałasu, jak powodują klienci quadowiska. Skarga zostaje rozpatrzona pozytywnie i biznes Mirki przestaje istnieć. Marysia nadal romansuje z Krzysztofem. Niespodziewanie zjawia się Kuba, który wrócił z Francji. Przeprasza żonę, a ona mu wybacza.
  ageRating: 12
  genre:
  - '23'
  subtitle: Kuba wraca z Francji i prosi żonę o wybaczenie. Oskarżony o oszustwa matrymonialne Krzysiek jest przesłuchiwany przez policję. Małgosia boryka się z problemami finansowymi. Musi sprzedać pensjonat.
- eventId: 923342
  start: 2026-09-23T19:15:00Z
  stop: 2026-09-23T20:10:00Z
  title: Nad rozlewiskiem... - odc. 1/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Antoni Królikowski, Olga Frycz, Małgorzata Braunek, Jerzy Schejbal, Jarosław Borodziuk, Krzysztof Kamiński
    Serial "Nad rozlewiskiem..." jest kontynuacją losów bohaterów "Domu nad rozlewiskiem", "Miłości nad rozlewiskiem" i "Życia nad rozlewiskiem". Dalszy ciąg opowieści o życiu i miłości trzech pokoleń kobiet: Barbary, jej córki Gosi oraz wnuczki Marysi. Akcja serialu toczy się na tle malowniczych mazurskich krajobrazów. Nad rozlewiskiem Małgosia i Konrad, odpoczywając na leżakach w promieniach słońca, wspominają zeszłą zimę, święta Bożego Narodzenia i narodziny bliźniaków Wrońskich.
  ageRating: 12
  genre:
  - '23'
  subtitle: Dalszy ciąg opowieści o życiu i miłości trzech pokoleń kobiet. Nad rozlewiskiem trwają przygotowania do Wigilii. Wszyscy czekają na przyjazd Marysi i Kuby, którym zwalone drzewo tarasuje przejazd.
