  description: Berlin von unten, das ist eine Welt für sich. Die Geschichten aus dem Untergrund erzählen von Spionagetunneln und dramatischen Fluchten unter der Erde, von der Angst, die geheimnisvolle Welt unter dem Pflaster der Stadt könne für feindliche Aktionen genutzt werden. Die Doku wechselt von oben nach unten, erforscht ein fremdes Berlin, erkundet Spuren der wechselhaften Vergangenheit.
