  title: Naturparadies Armenien
  subtitle: Nationalpark Arevik
  description: "Im Süden Armeniens liegt der Arevik-Nationalpark. Nahezu unberührte Natur auf mehr als 340 Quadratkilometern. Es ist das größte Naturschutzgebiet des Landes. Die Gebirgstäler des Arevik-Nationalparks sind auch Heimat für etliche Tiere, die anderswo längst selten geworden sind. \n\nEiner, der das Gebiet in- und auswendig kennt, ist Ranger Mkrtich Boyajyan. Er kümmert sich um den Schutz der gefährdeten Bezoarziegen. Am südlichen Rand des Nationalparks liegt die Stadt Meghri, nur wenige Kilometer von der iranischen Grenze entfernt.\n\nHier lebt Shahane Khachikyan mit ihrem kleinen Sohn. Meghri war einst die wichtigste armenische Stadt."
  widescreen: true
