  title: Geheimnisvolle Orte
  subtitle: Der Fernsehturm
  description: Der Fernsehturm ist das Wahrzeichen Berlins - der Höhepunkt der Skyline, von überall zu sehen. Mit seinen 368 Metern ist er nicht nur das höchste Gebäude Deutschlands, sondern auch ein Symbol für den Wandel der Stadt. Einst als Prestigeprojekt der DDR gebaut, zieht er heute jährlich über eine Million Besucher an und steht wie kein anderes Bauwerk für das wiedervereinigte Berlin.
