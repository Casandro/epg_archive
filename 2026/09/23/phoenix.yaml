  title: 'Geheimnisvolle Orte: Das verlorene Alt-Berlin'
  subtitle: Das verlorene Alt-Berlin
  description: "Jede Metropole hat ihre Wiege, ihren alten Kern, auch die deutsche Hauptstadt. Was aber ist vom historischen Alt-Berlin geblieben, welche Spuren hat es hinterlassen? \nDie Dokumentation rekonstruiert die Chronik des Verschwindens von Alt-Berlin und lässt durch aufwendige 3-D-Animationen, zum Teil neuentdecktes Archivmaterial und lebendigen Erinnerungen den alten Kern Berlins wiederauferstehen."
