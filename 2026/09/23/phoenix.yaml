  title: KI-Boom und Rechenzentren in Deutschland
  subtitle: Das sind die Folgen
  description: 'Künstliche Intelligenz (KI) braucht vor allem eins: leistungsstarke Rechenzentren. Auch in Deutschland werden etliche neue Rechenzentren für KI gebaut. Für Wirtschaftsministerin Katherina Reiche geht es um einen Wettbewerb um Rechenleistung und Daten. Doch der KI-Ausbau hat Folgen: Viele Rechenzentren verbrauchen Unmengen an Wasser zur Kühlung und auch in Deutschland werden sogar neue Gaskraftwerke gebaut extra für die Energieversorgung von Rechenzentren. Die Bundesregierung hat sogar ein wichtiges Gesetz auf die Bedürfnisse der Tech-Konzerne angepasst. Kommen Klimaziele und Nachhaltigkeit im KI-Boom unter die Räder?'
  widescreen: true
