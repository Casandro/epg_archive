  description: 'U emisiji Putevi proze, od ponedeljka 21. do nedelje 27. septembra, možete slušati delove romana norveškog pisca Simona Strangera "Leksikon svetlosti i tame". Simon Stranger je još jedno čudo norveške književnosti i još jedan prevodilački poduhvat neumornog prevodioca Radoša Kosovića. Abecednim redom Stranger kreće u razvijanje priče o jevrjskoj porodici u Norveškoj pod nacizmom i roman počinje na sledeći način: "A kao apsurdna optužba. A kao arijevska pravda. A kao agonija", čime jasno ocrtava putanju kojom će se kretati. Potom piše: "A kao ambis zaborava u koji sve tone", a odmah zatim "ambisu zaborava" suprotstavlja pisanje kao ono što čuva sećanje. Jedan od glavnih zapleta je što će preživeli iz jevrejske porodice, odnosno potomci, da kupe kuću u kojoj su se norveški nacisti iživljavali nad ljudima i ubijali ih. Taj motiv otvara pitanja sujeverja, poštovanja uspomena, zajednice koja se okuplja ne samo oko pozitivnih, već i oko negativnih sećanja i događaja. U živom pripovedanju...'
