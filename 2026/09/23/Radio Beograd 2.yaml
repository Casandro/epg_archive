  title: Imaginarna edicija
  subtitle: Emisija "Imaginarna edicija" donosi čitanja prevedenih eseja, članaka, poglavlja i studija autora koji se bave raznim društvenim fenomenima i pojavama.
  description: U emisiji Imaginarna edicija, od ponedeljka 21. do petka 25. septembra, možete slušati novi prevod teksta Mišela Fukoa "Poredak diskursa". U jednom od najslavnijih tekstova Mišela Fukoa "Poredak diskursa" - pristupnoj besedi na najprestižnijoj francuskoj akademskoj instituciji Kolež d Frans - Fuko sažima dosadašnja svoja istraživanja i ocrtava putanje budućeg svog rada. U središtu teksta je pojam diskursa koji se ne može svesti na govor, ali ga podrazumeva. Diskurs je, dakle, i govor i pisanje, jezik kao režim znakova, ali i prakse koje obeležavaju jednu epohu, ideološke perspektive, odnosi moći, dakle sve ono što bi se moglo nazvati iskustvom specifičnim za određeno doba. Posebnu pažnju Fuko obraća pojmu istine utvrđujući, još jednom, da je istina učinak odnosa moći, a arheologija i genealogija ostaju povlašćene Fukoove metode.
