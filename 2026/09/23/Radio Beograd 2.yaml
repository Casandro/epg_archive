  description: Predstavljamo album "Live at Kachara" Predraga Okiljevića i Lava Kovača, objavljen početkom septembra za nezavisnu novosadsku etiketu Horz Music. Ljubaznošću autora, slušaćemo needitovanu, četrnaest minuta dužu verziju zvaničnog izdanja. Saksofonista Predrag Okiljević i bubnjar Lav Kovač već godinama su oslonac nekoliko novosadskih džez formacija, kao što su Dragon's Fuel i PALM Trio, ali i nezavisne izdavačke kuće Horz pod čijim okriljem objavljuju svoje albume. Pored bubnjeva, Lav Kovač svira i klavir - kao pijanista je 2020. godine objavio solo album "Mapping the Unknown", a na još nekoliko izdanja svira klavir ili Fender Rhodes klavijature. Upravo ćemo ga u ovoj ulozi i čuti na albumu "Live at Kachara". Materijal je snimljen je u istoimenom studiju u Bukovcu kraj Novog Sada i predstavlja dvojicu muzičara u novom kontekstu. Za razliku od albuma u njihovim najpoznatijim sastavima koji imaju čvrstu ritmičku strukturu, poletne teme i aranžmane, Okiljević i Kovač ovde funkcionišu u...
