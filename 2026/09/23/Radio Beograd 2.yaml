  description: Naš gost je Nebojša Rakonjac, umetnik čiju samostalnu izložbu pod nazivom "Svetlokazi" možemo da pogledamo u Ustanovi kulture Parobrod, do 29. septembra. Nebojša Rakonjac je diplomirao 1997. i magistrirao 2000.godine na FLU u Beogradu, na odseku za slikarstvo, u klasi prof Jovana Sivačkog. Nagrađen je nagradom "Nadežda Petrović" koju dodeljuje Fakultet likovnih umetnosti, za pejzaž "Autoput", 1996. U Klubu 2 razgovaramo nastanku ovog ciklusa slika i crteža, prizorima sa juga Jadrana i uspomenama koje nose optimizam i setu, o tehnici i temama, iskustvu stvaranja u savremenom, sve digitalnijem okruženju,pređenom putu od završetka studija na Fakultetu likovnih umetnosti, o ome šta radi danas i kako vidi položaj umetnika u eri društvenih mreža...
