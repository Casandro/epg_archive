  description: U današnjoj emisiji razgovaramo sa tri gosta. Sa nama su Mijat Mihajlović, slikar Dejan Bogojević i multimedijalni umetnik Danko Đurić. Mijat Mihajlović predstavnik je i suosnivač Fondacije Mihajlović Feniks u čijoj organizaciji je, u saradnji sa Kolarčevom zadužbinom, pre nekoliko dana otvorena izložba "Svet fantastike na papiru". Izloženi radovi deo su zbirke ove fondacije. Fondacija je istovremeno i veliki dobrotvor Kolarčeve zadužbine. Sa Mijatom Mihajlovićem razgovaramo o ovoj izložbi i o velikom doprinosu fondacije Kolarčevoj zadužbini i likovnom životu kod nas. Slikar Dejan Bogojević izlaže na grupnoj izložbi "Ekolibrijum" u Kući Kralja Petra, od 21. septembra do 1. oktobra. Izložba je posvećena likovnim prikazima životinja. Sa Dejanom Bogojevićem razgovaramo o ovoj izložbi i o nekoliko drugih na kojima će uskoro izlagati. Multimedijalni umetnik Danko Đurić, član Slikarsko-grafičke sekcije ULUPUDS-a, od petka izlaže svoje radove u Galeriji Singidunum. On ovom izložbom...
