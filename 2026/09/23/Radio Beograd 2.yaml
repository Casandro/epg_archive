  subtitle: U emisiji Naučni skupovi od 21. do 25. septembra možete slušati snimke sa 10. interdisciplinarne konferencije sekcije za filozofiju medija Estetičkog društva Srbije o temi "Mediji i utopija".
  description: 'U emisiji Naučni skupovi od 21. do 25. septembra možete slušati snimke sa 10. interdisciplinarne konferencije sekcije za filozofiju medija Estetičkog društva Srbije o temi "Mediji i utopija". Na početku treće emisije ovog ciklusa možete pratiti izlaganje Sonje Tomović Šundić "Postutopijski diskurs i mediji: između nade, krize i digitalne stvarnosti", a potom će o temi "Utopija posle traume: transmedijsko pripovedanje kao prostor etičke imaginacije u savremenoj književnosti i filmu" govoriti Tamara Bradić. Sonja Tomović Šundić istražuje postutopijski diskurs u savremenim medijima, polazeći od pretpostavke da su velike utopijske vizije društvenog napretka zamenjene narativima neizvesnosti, krize i fragmentacije. Kroz teorijske uvide Ernsta Bloha i Žana Bodrijara, autorka analizira način na koji mediji oblikuju percepciju budućnsoti u digitalnom dobu. Posebna pažnja je posvećena ulozi digitalnih platformi u proizvodnji postutopijskih imaginarijuma, gde se tradicionalne ideje progresa...'
