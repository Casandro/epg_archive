    serial obyczajowy (Niemcy,Austria, 2007), Höhenangst - Teil 2
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Hansa dręczą wyrzuty sumienia. Czuje się bowiem odpowiedzialny za wypadek Lisy. Okazuje się, że jeżeli dojdzie do odwołania kosztownej uroczystości ślubnej, pani Tamm zażąda od niego odszkodowania. Tymczasem noga Lisy puchnie coraz bardziej i grozi jej amputacja.
