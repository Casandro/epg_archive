  title: Rosamunde Pilcher - Gwiazdy spadają w sierpniu 1 (odc. 47)
  subtitle: Spokojne życie Mandy Trevors komplikuje powrót Johna Higginsa, jej dawnej miłości. Przypadkowe spotkanie po latach budzi uśpione uczucia i wystawia jej małżeństwo na próbę.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Sternschnuppen im August
    DE,GB, 2003
    Reżyseria: Dieter Kehler
    Występują: Elena Uhlig, Oliver Bootz, Nicki von Tempelhoff, Heide Keller, Bernd Stephan, Johanna Christine Gehlen
    Mandy i Roger Trevors są małżeństwem i mieszkają na rodzinnym majątku. Poza tym, że Mandy wolałaby, by Roger dołączył do firmy maklerskiej ojca Herny'ego niż hodował konie wyścigowe, małżeństwo wydaje się nienaruszone. Idealny świat Mandy zaczyna się chwiać, gdy pewnego dnia weterynarz John Higgins, wielka miłość Mandy, wraca do swojej ojczyzny. Lata wcześniej John był Szkocja, bo nie mógł znieść, że Mandy podjęła inną decyzję.
  ageRating: 12
  genre:
  - '21'
- eventId: 930384
  start: 2026-09-23T19:50:00Z
  stop: 2026-09-23T21:35:00Z
  title: 'Rosamunde Pilcher: A jutro pomarzymy razem 1 (odc. 44)'
  subtitle: Susan próbuje odnaleźć córkę, którą piętnaście lat wcześniej, wbrew własnej woli, oddała do adopcji.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Morgen träumen wir gemeinsam
    DE, 2001
    Reżyseria: Rolf Von Sydow
    Występują: Susanne Michel, Dirk Mierau, Karl Heinz Vosgerau, Bruno Eyron, Eva Pflug, Elea Geissler
    Susanne (Susan Turner) postanawia odnaleźć córkę, którą piętnaście lat temu, wbrew woli, oddała do adopcji. Zamierza również rozwieść się z mężem, Rupertem (Bruno Eyron), dla którego liczą się tylko jej pieniądze. Kobieta zatrzymuje się w posiadłości swojego wuja Charlesa (Karl Heinz Vosgerau) w Dorset, gdzie spotyka miłość z młodzieńczych lat, Patricka (Dirk Mierau). Ten przypadek wpływa na losy ich obojga.
  ageRating: 12
  genre:
  - '22'
