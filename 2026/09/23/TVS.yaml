  description: |-
    serial kryminalny (Austria, 2019) odc.12, In medias res
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair, Simon Hatzl
    Lukas, Nina i Kroisleitner biorą pod swoje skrzydła troje praktykantów z akademii policyjnej. Wkrótce młodzi inspektorzy mają szansę uczestniczyć w pierwszym śledztwie w sprawie morderstwa. Znalezione zostają zwłoki nauczyciela, Chrisa Feldnera. Stażyści przekonują się na własnej skórze, jak łatwo popełnić błąd.
    Reżyser: Martin Kinkel
    Od lat: 12
