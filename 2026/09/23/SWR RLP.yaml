  title: 'Tatort: National feminin'
  subtitle: Fernsehfilm Deutschland 2020
  description: Im Göttinger Stadtwald wird die Leiche einer jungen Frau gefunden. Die Identität der Toten setzt das Team um Charlotte Lindholm und Anaïs Schmitz unter großen Druck. Marie Jäger, eine kluge und attraktive Jura-Studentin, war mit ihrem erfolgreichen Blog "National feminin" ein Star der jungen, rechten Szene und Aushängeschild der "Jungen Bewegung". In den sozialen Netzwerken beginnt eine unkontrollierbare Stimmungsmache gegen die Polizei, gegen den Staat, gegen die Demokratie. Wurde Marie von einem unbekannten Stalker getötet, war es eine politisch motivierte Tat - oder hat der Mord doch etwas mit ihrem engsten Freundeskreis zu tun?
