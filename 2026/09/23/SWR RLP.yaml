  description: 'Wenn der Bauch plötzlich wächst. Es passiert oft schleichend: Die Waage zeigt mehr an, obwohl sich an Ernährung und Bewegung kaum etwas geändert hat. In den Wechseljahren verlagert sich das Fett zur Körpermitte - selbst bei schlanken Frauen. Dieses Bauchfett kann das Risiko für Diabetes und Herz-Kreislauf-Erkrankungen erhöhen. Was hilft gegen den Hormonbauch?'
