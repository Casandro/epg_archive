  title: Radioreport
  subtitle: pOODcast ostravsko-opavské diecéze - fotograf Jindřich Štreit
  description: 'Autor: Monika Pustovková; Interpret: Jindřich Štreit * Jindřich Štreit je legendou české fotografie. Nejznámější jsou jeho černobílé snímky z venkova, dnes už ale fotí i barevně. Zaměřuje se na náročná témata jako jsou umírající, postižení či těžké profese. Jaké je pozorovat blížící se smrt skrze hledáček fotoaparátu? Liší se od smrti blízkého člověka? Jak se bývalý kantor Jindřich Štreit vyrovnával s totalitním vězením a následně s prací na státním statku? Poslechněte si v novém díle pOODcastu. V tomto pořadu jsou použity zvukové ukázky ze skladby Rhapsody for flute and organ by John Weaver, interpreti: Monika Štreitová a Marek Vrábel. Nahrávka je z CD Brána Naděje, které vyšlo zároveň se stejnojmennou knihou J. Štreita. Fotografie i hudba se věnují duchovní tematice.pOODcast ostravsko-opavské diecéze'
