  title: Jak se vám líbí
  subtitle: S Petrem Linhartem o knize Autobus do Sudet
  description: 'Autor: Milan Tesař; Interpret: Petr Linhart; Premiéra: 18.8.2026 * Hostem Milana Tesaře je písničkář Petr Linhart. Představí nám knižní rozhovor Autobus do Sudet, který mapuje jeho hudební i osobní cestu od začátků v 80. letech přes kapely Čp. 8 a Majerovy brzdové tabulky až po sólovou tvorbu. Hovořit budeme také také o CD, které je součástí knihy a které obsahuje Linhartovy raritní nahrávky. Na závěr Linhart představí své další plány, mimo jiné připravované oratorium podle románu Šikmý kostel Karin Lednické.[čé pé osm]'
