  title: Fahndung Spezial
  subtitle: Der Wilderer von Annaberg
  description: 'Am 17. September 2013 verwandelt sich das beschauliche Mostviertel in den Schauplatz einer der größten Menschenjagden der österreichischen Kriminalgeschichte. Innerhalb weniger Stunden erschießt der 55-jährige Alois Huber einen Cobra-Beamten, zwei Polizisten und einen Rettungssanitäter. Hunderte Einsatzkräfte, Cobra-Beamte, Scharfschützen, Panzer und Soldaten des Bundesheeres umstellen schließlich seinen Hof in Annaberg. Doch die Geschichte beginnt Jahre zuvor: Die Ermittler suchen jahrelang nach einem mysteriösen Wilderer - ohne zu ahnen, dass der Täter mitten unter ihnen lebt. Als die Polizei dem Mann schließlich auf die Spur kommt, eskaliert die Situation völlig. Wer war Alois Huber wirklich? Ein trauernder Witwer, der den Tod seiner Frau nie überwunden hat? Ein besessener Wilderer mit einem gefährlichen Doppelleben? Oder ein Mörder, der über Jahre immer tiefer in seine eigene Welt abgleitet? Fahndung Spezial rekonstruiert die dramatischen Ereignisse von Annaberg, zeigt die verhängnisvolle Tatnacht und beleuchtet die Hintergründe eines Falles, der Österreich bis heute beschäftigt.Österreich 2026'
  widescreen: true
