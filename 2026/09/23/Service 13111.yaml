  title: The Great Way - zu Fuß um die Welt
  subtitle: Lykischer Weg, Türkei
  description: "Die beiden Filmemacher Alba Prol Cid und Raúl García sind in der Türkei, um auf dem Lykischen Weg zu wandern, einem 540 Kilometer langen Fernwanderweg entlang der Mittelmeerküste zwischen den Städten Fethiye und Antalya. Etwa einen Monat lang erleben die beiden Wanderer idyllische Strände, hohe Berge, üppige Wälder und viele archäologische Stätten der lykischen, byzantinischen und griechischen Zivilisation. Der Lykische Weg ist einer der attraktivsten Fernwanderwege der Welt. Trotzdem gilt dieser Wanderweg immer noch als Geheimtipp. Denn viele Sommertouristen aus Europa haben noch nie von ihm gehört. \nDer Lykische Weg ist perfekt für Wanderer, die lieber wild zelten, als in der Sonne zu liegen, die einsame Strände lieben und die sich nicht scheuen, Gipfel zu erklimmen. Auch faszinierende und außergewöhnliche Orte wie Chimaira erhöhen die Attraktivität dieses Wanderwegs. In Chimaira schießt immer wieder Feuer aus dem Felsen, ein Naturphänomen, um das sich viele Legenden ranken. Aber es ist auch eine anstrengende Wanderung, vor allem im Sommer. Zur Belohnung gibt es für Alba und Raúl eine Ballonfahrt über Kappadokien.\nDokumentarfilm, Spanien 2023, R: Raúl García , Alba Prol Cid"
  widescreen: true
