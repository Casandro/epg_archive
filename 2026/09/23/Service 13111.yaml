  title: Hubert und Staller
  subtitle: Ein schmutziges Geschäft
  description: |-
    Als ein Angler einen auffälligen Ölfleck auf der Loisach entdeckt, sollen Hubert und Staller der Sache auf den Grund gehen. Sie finden jedoch keine defekte Abwasserleitung, sondern eine Leiche - an Gewichten im Fluss versenkt. Ganz offensichtlich war der Mann durch Messerstiche umgekommen, denn sein Körper ist von Einstichen übersäht. Die Ermittlungen ergeben, dass es sich bei dem Toten um Tom Rösler handelt, dem Produktionschef der Textilfabrik Kutschner. Als die Polizisten schließlich dem Firmenleiter die traurige Nachricht vom Tod seines Mitarbeiters überbringen, reagiert der auffallend sachlich. Über Röslers Privatleben kann Kutschner keine Auskunft geben, als Mitarbeiter sei er jedenfalls zuverlässig und pflichtbewusst gewesen. Bei der Durchsuchung von Röslers Wohnung entdecken die Polizisten Videoaufnahmen einer geheimnisvollen Frau. Deutlich zu erkennen ist sie allerdings nicht, nur ihr auffallendes Tattoo bietet einen Anhaltspunkt. Steckt sie hinter dem Verbrechen?

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.

    Krimi, Deutschland 2014, R: Jan Markus Linhof
  widescreen: true
- eventId: 998071
  start: 2026-09-23T00:49:32Z
  stop: 2026-09-23T02:28:03Z
  title: Der Teufelshauptmann
  description: |-
    Nur wenige Tage verbleiben Kavallerie-Hauptmann Nathan Brittles (John Wayne) bis zu seiner Pensionierung. Darüber ist der alte Haudegen alles andere als erfreut, ist die US-Armee doch das Einzige, was ihm nach dem Tod seiner Familie geblieben ist. Zudem wird das kleine abgelegene Fort, in dem Brittles seinen Dienst ableistet, durch Indianer-Aufstände bedroht. Als letzte große Aufgabe soll Brittles mit seiner Truppe die Frau und die Nichte des Kommandeurs des Forts in Sicherheit bringen und zu einer Postkutschen-Station begleiten. Doch als sie dort ankommen, finden sie die Station völlig niedergebrannt vor. Die Bewohner wurden bis auf wenige Ausnahmen von Indianern brutal getötet. So ist Brittles gezwungen, seine Schützlinge erneut durch gefährliches Indianergebiet zurück zum Fort zu führen.

    "Der Teufelshauptmann" stammt von John Ford, dem größten Western-Regisseur aller Zeiten. Die Hauptrolle des alternden Raubeins Nathan Brittles spielt auf unnachahmliche Art Fords Lieblingsschauspieler John Wayne - obwohl damals erst 42 Jahre alt. In Nebenrollen sind Joanne Dru, Victor McLaglen und Ben Johnson zu sehen. Gedreht hat Ford wie so oft auf dem Colorado-Plateau im Monument Valley, das später zum "John-Ford-Land" deklariert wurde. Kameramann Winton C. Hoch wurde für seine grandiosen, malerischen Landschaftsaufnahmen mit einem Oscar ausgezeichnet. (OT: She Wore a Yellow Ribbon)
    Western, Vereinigte Staaten Von Amerika 1949, R: John Ford
