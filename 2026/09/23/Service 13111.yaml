  title: Michael Martin - Gesichter der Erde
  subtitle: Rift Valley
  description: "Die Plattentektonik hebt nicht nur mächtige Gebirge heraus oder lässt mittelozeanische Rücken entstehen, sondern führt weltweit auch zu Grabenbrüchen. Der Ostafrikanische Grabenbruch zieht sich vom Roten Meer quer durch Ostafrika und prägt die Länder Äthiopien, Kenia und Tansania. Erste Stationen der Reise von Michael Martin quer durch den afrikanischen Kontinent sind das legendäre Afar-Dreieck, das ethnologisch interessante Omo-Gebiet, der Turkanasee als Wiege der Menschheit und der Vulkan Ol Doinyo Lengai, der heilige Berg der Massai. \nDokumentarfilm, Deutschland 2021, R: Viktor Stauder"
  genre:
