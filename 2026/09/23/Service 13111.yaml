    Im Osten Afrikas, nahe dem Äquator, hebt sich das Äthiopische Hochland mehr als 4.000 Meter in den Himmel. Eisiger Wind peitscht über die weiten Ebenen und wenn die Nächte Frost bringen, erinnert nichts mehr an Afrika. Äthiopiens Hochland ist einzigartig. Hier treffen die Landmassen Eurasiens auf den afrikanischen Kontinent. Die eindrucksvolle Landschaft ist einer der artenreichsten Lebensräume der Erde. Viele Tier- und Pflanzenarten kommen ausschließlich hier vor. Wie kein anderer Bewohner der Hochplateaus steht der Äthiopische Wolf für die Einzigartigkeit, aber auch für die Verletzlichkeit dieser Region. Äthiopische Wölfe erinnern eher an Füchse und Schakale, und doch sind sie eng mit dem Europäischen und dem Amerikanischen Wolf verwandt. Im Laufe der Jahrtausende haben sich die "Wölfe mit dem roten Fell" perfekt an ihren extremen Lebensraum angepasst. Ihre Hauptnahrung sind die bis zu ein Kilo schweren Riesenmaulwurfsratten. Auch sie gibt es nur im Hochland von Äthiopien.
    Natur, Deutschland 2017, R: Henry Mix , Yann Sochaczewski
