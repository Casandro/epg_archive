  title: Der große Trip - Wild
  description: "Auf Cheryl (Reese Witherspoon) warten 1.600 Kilometer Fußweg durch die Wildnis, von der Wüste Kaliforniens bis zur Grenze Kanadas. Die 26-Jährige will den Weitwanderweg Pacific Crest Trail bewältigen, obwohl sie keine Vorkenntnisse und Erfahrungen im Wandern besitzt. Tatsächlich merkt sie bald, dass sie einen viel zu großen Rucksack mitschleppt und den falschen Brennstoff dabeihat. Trotz aller Widrigkeiten und Strapazen lässt Cheryl sich nicht von ihrem Ziel abbringen. Denn die Wanderung ist auch eine Auseinandersetzung mit sich selbst. Nach dem Krebstod ihrer geliebten Mutter, Drogenabhängigkeit, wahllosem Sex und einer gescheiterten Ehe will Cheryl ein neues Leben beginnen. Bei der Wanderung erinnert sie sich an die gemeinsamen Erlebnisse mit ihrer Mutter Bobbi (Laura Dern), an den gewalttätigen Vater, ihre zunächst erfolgreiche Studienzeit, und den Absturz nach dem Tod Bobbis. Voller Wut und Verzweiflung kämpft sich Cheryl durch die Wildnis. Doch dann fällt ungewöhnlich viel Schnee. \n\nEine Frau ohne Mann, ohne Geld, ohne Familie und ohne Perspektiven, so definierte Hauptdarstellerin und Produzentin Reese Witherspoon die Protagonistin Cheryl in dem Drama \"Der große Trip - Wild\". Um diese Rolle spielen zu können, sicherte sich die Oscar-Preisträgerin (\"Walk The Line\") frühzeitig die Filmrechte an den Memoiren von Cheryl Strayed mit dem Titel \"Wild\". Der kanadische Regisseur Jean-Marc Vallée hat den Bestseller im Stil einer klassischen Läuterungsgeschichte verfilmt. Beeindruckend Reese Witherspoon als unerfahrene, aber hartnäckige Wanderin Cheryl. Oscargewinnerin Laura Dern (\"Marriage Story\") spielt Cheryls sympathische Mutter Bobbi.\nDrama, Vereinigte Staaten Von Amerika 2014, R: Jean-Marc Vallée"
  widescreen: true
