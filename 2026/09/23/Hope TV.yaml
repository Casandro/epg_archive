  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Sebastian Ortler: "Kirche muss wieder stärker ''in der Welt'' sein!"'
  description: |-
    Kirche muss wieder stärker "in der Welt" sein - davon ist Sebastian Ortler überzeugt. Gemeinsam mit Freunden aus einer kreativen Kirche entwickelt er deshalb eine App, die Menschen digital vernetzt und neue Türen zu Gemeinden öffnen soll. Heute gehört "Communi" zu den größten christlichen Community-Plattformen im deutschsprachigen Raum. Über 800 Organisationen nutzen inzwischen eigene Apps auf rund 800.000 Geräten. Mit Anfang 20 hatte Sebastian Ortler bereits seine erste Firma gegründet. Aufgewachsen in einem charismatischen Pastorenhaushalt treiben den Unternehmer bis heute Freiheit, Neugier und die Frage an, wie Menschen wirklich miteinander in Verbindung kommen. Warum ihn besonders die Geschichten, Meinungen und der Glaube anderer Menschen faszinieren, erzählt er in dieser Sendung.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
