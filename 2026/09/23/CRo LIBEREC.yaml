- eventId: 1101062
  start: 2026-09-23T09:05:00Z
  stop: 2026-09-23T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Tanec, tanec. Odborný pracovník Národního institutu pro kulturu, útvaru Artama Jiří Lössl. Padesát let scénického tance a čtyřicátý ročník přehlídky Tanec, tanec? Právě tato dvě výročí si připomenou od 25. do 27. září v Jablonci nad Nisou, a to v rámci letošní jubilejní přehlídky. Zajímavou historií scénického tance nás provede pedagog Jiří Lössl, se kterým nahlédneme do bohatého víkendového programu.'
