  title: Setkání u mikrofonu
  description: Zatímco ortopedie u dospělých řeší většinou následky, dětská ortopedie pracuje preventivně. Umožňuje malým pacientům, aby v dospělosti žili co nejlépe a nejdéle bez deformit. Modeluje jim klouby, nohy, klenby, osy dolních končetin a podobně. Právě o svém oboru a s čím vším může pomoct, vyprávěl v Setkání u mikrofonu dětský ortoped Jan Charvát. Pozvala ho lékařka z Lázní Bělohrad a jedna z moderátorek pořadu Jitka Ferbrová.
