  title: Wer kann das bezahlen? Wenn Lebensmittel zum Luxus werden
  subtitle: Mehrteilige Reihe mit Anna Planken
  description: "Anna Planken trifft Menschen in NRW und spricht mit ihnen über Geld. Während die Hälfte der Menschen in Deutschland weniger als 2.000 Euro netto verdient, gibt es gleichzeitig immer mehr Einkommensmillionäre. Viele spüren, dass sie auf ihrem Konto am Monatsende weniger übrig haben. \nAnna Planken: \"Alles wird teurer, egal in welchen Bereich wir gucken: Essen, Trinken, Klamotten, Möbel. Und wir wollen uns ja nicht nur versorgen. Wie schaffen wir es, den kleinen Luxus in den Alltag zu bringen? Wir suchen nach Strategien, sich trotzdem noch was gönnen zu können.\""
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
