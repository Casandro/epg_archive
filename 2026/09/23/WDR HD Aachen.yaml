  description: Letzte Bastion der Meinungsfreiheit oder straffreie Spielwiese für Extremisten und Kriminelle? Am Messenger-Dienst Telegram scheiden sich die Geister. Genau wie an seinem mysteriösen Gründer, dem in Russland geborenen Tech-Milliardär Pawel Durow. Ist dieser Mann ein kompromissloser Verfechter radikaler Freiheit oder ein Komplize von Verbrechern aller Art? Drängende Fragen, denen der Autor Aleksandr Urzhanov in Paris, St. Petersburg, Dubai und Berlin nachgeht.
