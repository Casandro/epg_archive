  title: Blackout - Wie sicher ist unser Stromnetz?
  description: 'Billigste Mittel erreichen größte Wirkung. Selbsternannte Aktivisten können mit einem verhältnismäßig kleinen Anschlag in Berlin rund 45.000 Haushalte und 2.200 Betriebe vom Stromnetz abschneiden. Wenn das so einfach geht: Wie sicher ist unsere Stromversorgung? Können Anschläge auch größere Teile Deutschlands oder Europas lahmlegen? Welche Folgen hätte das? Gibt es Wege aus dieser Verletzlichkeit?'
