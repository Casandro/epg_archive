  title: Plenarsitzung des Nationalrates
  description: |-
    Nach der Sondersitzung zum Klimaschutz startet der Nationalrat mit einem regulären Plenartag in den Herbst. Auf der Tagesordnung stehen unter anderem das Gesetzespaket "Arbeiten im Alter" mit steuerlichen Begünstigungen für Erwerbstätige im Pensionsalter und Änderungen bei der betrieblichen Altersvorsorge. Beschlossen werden sollen außerdem weitere Sondermittel zur Förderung der Beschäftigung von Menschen mit Behinderungen. Neu geregelt werden die Familienleistungen für Vertriebene aus der Ukraine und subsidiär Schutzberechtigte. Auch der Bundesrechnungsabschluss 2025 steht zur Debatte. Nach Abschluss der Beratungen im Verfassungsausschuss könnte zudem der Weg für mehr Digitalisierung in Verwaltungsverfahren frei werden. Änderungen im Verwaltungsverfahrens- und Verwaltungsstrafgesetz schaffen die rechtlichen Grundlagen für den Einsatz von Chatbots und vollständig automatisierten schriftlichen Erledigungen. Zum Auftakt stehen eine Aktuelle Stunde der SPÖ und eine Europastunde der NEOS auf dem Programm. Die FPÖ bringt in Erster Lesung zwei Anträge ein: zur Befreiung von Blaulichtorganisationen von der Mineralölsteuer und zu einer Änderung der Straßenverkehrsordnung. Letztere richtet sich unter anderem gegen Regenbogen-Zebrastreifen.

    Kommentar: Claus Bruckmann
