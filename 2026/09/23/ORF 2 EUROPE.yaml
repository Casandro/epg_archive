  title: 2 in Tirol - Heimat grenzenlos entdecken
  description: "Ein neues Moderationsduo macht sich heuer  in \"2 in Tirol\" auf eine vergnügliche Reise durch Tirol, Südtirol und das Trentino. Schauspielerin Kristina Sprenger und Wettermann Sigi Fink lernen ihre Heimat einmal von einer ganz anderen Seite kennen, und da bleibt kein Auge trocken. Die zwei stürzen sich mit viel Witz und Leidenschaft in die Sendung, die heuer über Grenzen geht. Ihr erster Treffpunkt ist 1400 Meter unter der Erde, was Kristina gar nicht und Sigi sehr lustig findet. Und das ist erst der Anfang.  \nMitwirkende: Lena Schaur (Musikerin), Tel Tipes (Musiker), Max von Milland (Musiker)"
  genre:
  - '116'
