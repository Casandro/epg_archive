  title: WELTjournal
  subtitle: Deutschland - Der Aufstieg der AfD
  description: "Deutschland steht vor einer politischen Zäsur: in Sachsen-Anhalt hat sich die als rechtsextrem eingestufte AfD bei den Wahlen Anfang September mehr als verdoppelt und erzielte ein Rekordergebnis von 44% der Stimmen. Auch bei den kommenden Wahlen in Mecklenburg-Vorpommern könnte die \"Alternative für Deutschland\" stärkste Kraft werden.\n\nDas WELTjournal analysiert die Gründe für den enormen Zuspruch zur völkisch-nationalistischen Agenda der AfD. Auf Social Media wie Instagramm und Tiktok dominiert die AfD die politische Diskussion und zielt mit emotionalisierten Kurzvideos vor allem auf junge Wähler und Wählerinnen. Beleuchtet werden auch die Rolle Russlands und der USA unter Trump, die den Aufstieg der AfD von außen massiv befeuern. Ein hochaktueller Blick auf die gegenwärtigen Herausforderungen für die Demokratie in Deutschland. \nGestaltung: Evan Williams"
  genre:
  - '129'
