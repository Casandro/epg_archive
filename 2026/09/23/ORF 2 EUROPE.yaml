  title: Tierisch prominent
  description: 'Die ORF-Kräuterexpertin Uschi Zezelitsch lebt mit vier Katzen in ihrer Villa Himmelrot: dem ängstlichen Fraser, Schmuser Nelson, dem zugelaufenen Bobby und der frechen Luisa. Die Burgenländerin verbindet Tierliebe mit Kräuterheilkunde und stellt natürliche Zeckensprays aus Kokosöl und Duftblattpelargonie her.'
