  title: Seehund, Puma & Co. (148)
  subtitle: Zoogeschichten von der Küste
  description: 'Verzückte Sprünge - die Alpakas kommen aus dem Winterlager, verwunderte Polarfüchse - Was soll bloß die Kiste? und Hering mit Mayo: Eisbär Lloyd wird überlistet ... und noch viele weitere Zoogeschichten von der Nordsee.'
- eventId: 1149560
  start: 2026-09-23T11:50:00Z
  stop: 2026-09-23T12:20:00Z
  title: Nashorn, Zebra & Co.
  subtitle: Zoogeschichten aus München
  description: 'Ob Weißstirnamazone oder Allfarb-Lori: Jede Vogelart darf im Dschungelzelt dort brüten, wo sie will. Doch Matthias und Nele wollen es heute genauer wissen. Löwin Inka versteht die Welt nicht mehr: Warum wird für den Chinesischen Leoparden der halbe Zoo umgebaut? Haben Elefanten- und Menschenkinder etwas gemeinsam? Wie Schimpanse Toni seinen 50. Geburtstag feiert und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".'
- eventId: 1150181
  start: 2026-09-23T12:20:00Z
  stop: 2026-09-23T13:10:00Z
  title: Rentnercops (18)
  subtitle: Gute Nacht Freunde
  description: Edwin ist wieder eingestellt. Günter und er werden an einen Tatort gerufen. In der Wohnung zweier Studentinnen wird ein toter Mann gefunden. Die Frauen geben an, er sei ein amerikanischer Medizinstudent im Austauschsemester und sie hätten ihn erst am Abend zuvor kennengelernt. Dr. Schmidt kommt zu dem Schluss, dass der Mann an einem Herzinfarkt gestorben ist - aber keineswegs sei er Mitte 20, wie die Frauen angegeben haben, sondern mindestens Ende 30. Da außer seinem Vornamen "Connor" nichts über ihn bekannt ist ,und man auch an der Uni keinen Austauschstudenten namens Connor kennt, wird die Sache für Edwin und Günter knifflig.
  genre:
  - '16'
- eventId: 1152119
  start: 2026-09-23T13:10:00Z
  stop: 2026-09-23T14:00:00Z
  title: Rentnercops (19)
  subtitle: Freiheit
  description: 'An seinem 70. Geburtstag sterben Achim Wagner und sein Schwiegersohn zeitgleich: beide fallen während des Essens tot in ihr Grillfleisch. Vicky denkt sofort an eine Lebensmittelvergiftung, doch die beiden Frauen der Toten sind kerngesund. Würde Vickys Theorie stimmen, wären die beiden ebenfalls mausetot. Als sich herausstellt, dass die Mutter und ihre schwangere Tochter Vegetarier sind, fällt der Verdacht zunächst auf sie. Allerdings findet sich kein Motiv für die Tat. Erst als Edwin und Günter herausfinden, dass Achim Wagner seinen Schwiegersohn durch einen Privatdetektiv beobachten ließ, kommen sie der Lösung des Falls näher.'
  ageRating: 6
  genre:
  - '16'
