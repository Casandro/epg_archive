  title: In aller Freundschaft (1013)
  subtitle: Abflug
  description: Sarah Marquardt bietet Dr. Kaminski an, interimsmäßig Dr. Martin Steins Nachfolge als Klinikleiter zu übernehmen. Kaminski aber hat weder Lust noch Bedarf, seinen Status als Belegarzt ohne weitere Verpflichtungen aufzugeben. Doch dann übernimmt er die Behandlung der jungen Abeba Mehari, die kurz vor ihrer Abschiebung am Flughafen kollabiert ist. Kaminski diagnostiziert eine akute Harnwegsinfektion aufgrund einer brutalen Genitalverstümmlung, die bei Abeba als kleines Mädchen vorgenommen wurd
- eventId: 1144201
  start: 2026-09-23T06:25:00Z
