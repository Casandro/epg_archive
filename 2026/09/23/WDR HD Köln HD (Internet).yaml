  title: In aller Freundschaft (1014)
  subtitle: Falsch gedacht
  description: Bei einem Besuch auf dem Reiterhof beklagt sich Cosmo bei Hanna, dass sich seine Pflegemütter Miriam und Rieke sehr viel streiten. Weil er befürchtet, dass er zurück ins Heim muss, bietet ihm Hanna zur Ablenkung eine Zigarette an. Dabei verursachen die beiden unbewusst einen Schwelbrand im Pferdestall. Cosmo will die Pferde retten, wird aber dann mit einer Reizgasvergiftung in die Klinik eingeliefert.
