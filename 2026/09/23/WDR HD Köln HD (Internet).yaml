- eventId: 1147332
  start: 2026-09-23T09:55:00Z
  stop: 2026-09-23T10:45:00Z
  title: Elefant, Tiger & Co. (416)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    * Aufregender Ausflug
    Lippenbärin Lina ist vor einigen Monaten Mutter geworden. Jetzt sollen die quirligen Bärenkinder endlich die große, weite Welt kennenlernen.
    * Smart im Rückwärtsgang
    Bei der Zwergplumplori-Familie steht ein Abschied an. Smart, Zögling von Mercedes und Benz, ist inzwischen ein großer Kerl. Ein Zoo in Frankreich erwartet ihn bereits. Allerdings legt Smart schon vor Abreise den Rückwärtsgang ein.
    * Hör mal, wer da ruft
    Bei den Pinguinen läuft die Brutsaison auf Hochtouren. Alle Gelege sind mit Eiern gefüllt. Und der erste Nachwuchs ist auch schon da. Zarte Ruflaute wurden bereits von den Pflegern vernommen.
