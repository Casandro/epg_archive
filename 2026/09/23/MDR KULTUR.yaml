  title: 'MDR Kultur Trifft: Fridtjof Florian Dossin'
  description: "Fridtjof Florian Dossin treibt der Wunsch an, historische Orte neu zu beleben, leerstehende Immobilien als Ressource zu nutzen. Vor fünf Jahren kaufte der Industriedenkmalpfleger und Wissenschaftler Fridtjof Florian Dossin in dem Dorf Oßmannstedt in der Gemeinde Ilmtal-Weinstraße, nahe Apolda gelegen, einen 1939 erbauten und 25 Meter hohen Getreidespeicher. Zusammen mit Freunden und Kommilitonen aus Architektur und Denkmalpflege gründete er das Institut für Graue Energie e.V., übernahm den Vorsitz und ist Projektleiter der Reallabore. 13 Mitglieder gehören zum Verein, der inzwischen mit seinen Reallaboren auch in Sachsen-Anhalt, Sachsen und Brandenburg agiert, sich um den Erhalt und die nachhaltige Weiterentwicklung bestehender Gebäude, insbesondere von Industrie- und Bestandsbauten im ländlichen Raum einsetzt. \"Graue Energie\", betont Fridtjof Florian Dossin, ist kein Kunstwort. \"Graue Energie\" kommt aus dem Baumanagement und beschreibt die Energie, die in unserer Umwelt durch Gestaltungs- und Bauprozesse gebunden ist. Man habe den Begriff entlehnt, um auf ihn zu verweisen, um ihn bekannter zu machen und ihn mit dem Thema Bestandsgebäude zu verbinden, führt der Industriedenkmalpfleger aus. In Gebäuden steckt am meisten Energie, weil der Bauprozeß so energieaufwendig ist. Die Baustoffe müssen abgebaut, bearbeitet und auf die Baustelle transportiert werden. Energie, die man nicht sieht, daher \"Graue Energie\". Aber sie steckt im Gebäude, sagt Fridtjof Florian Dossin, und kann sie nachhaltig nutzen, wenn man das Gebäude erhält oder einer neuen Nutzung zuführt, das Kulturdenkmal, den Erinnerungsort als Ressource nutzt. Das Gelände rund um den Getreidespeicher Oßmannstedt war lange ein Schandfleck im Ort, eine große Brombeerhecke hatte alles komplett überwuchert. Inzwischen ist ein kleines Idyll entstanden, mit Sitzplätzen unter blühenden Bäumen. Der gelegte Wasser- und Stromanschluss fand seinen Platz in einem vorgelagerten Trafohäuschen. Das Erdgeschoss des Getreidespeichers wird als Vereinsraum genutzt in dem bald eine kleine Fachbibliothek einziehen soll. Im Keller wird eine Werkstatt entstehen. Schon jetzt wird zu Erzähl-Cafés geladen, Anfang September geschah dies in Zusammenarbeit mit der Gesellschaft zur Erforschung der Demokratiegeschichte. Am 13. 09. öffnete das Reallabor Getreidespeicher Oßmannstedt zum vierten Mal seine Türen zum Tag des offenen Denkmals, am 21.09 lädt das Institut für Graue Energie e.V. zur Sommerakademie in Hohenmölsen ein und präsentiert sich am 08.10 beim Forum Industriekultur Berlin. \n\nIn Jena wurde Fridtjof Florian Dossin 1995 geboren. Nach dem Abitur studierte er von 2014 bis 2018 Urbanistik an der Bauhaus-Universität Weimar und von 2018 bis 2021 Denkmalpflege an der Universität Bamberg. 2016 absolvierte Fridtjof Florian Dossin ein Praktikum im Thüringischen Landesamt für Denkmalpflege und 2017 im Bundesdenkmalamt Österreich, wurde studentischer Mitarbeiter u.a. an der Bauhaus-Universität Weimar, im Keramik Museum Bürgel und in der Bauhaus-Keramikwerkstatt Dornburg, war 2019 Werkstudent bei einem Kirchenmaler- und Restauratorenfachbetrieb in der Fränkischen Schweiz. Seit 2020 ist Fridtjof Florian Dossin wissenschaftlicher Mitarbeiter an der Bauhaus-Universität Weimar, forscht zu Fragen des industriellen Erbes, der Baukultur, der Transformation von Bestandsgebäuden und schreibt an seiner Promotion mit dem Arbeitstitel \"Erinnerung an Arbeit. Die Betriebsmuseen der VEB in der DDR\". "
  subtitle: Industriedenkmalpfleger, Projektleiter Reallabore des Instituts für Graue Energie e.V. Oßmannstedt
