  title: MDR KULTUR am Nachmittag
  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 14:45 Uhr -  Kulturtipps \n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - Digitale Resilienz. Informatik-Festival in Dresden\nWenn Erpresser ins Computersystem einer Stadt- oder Kreisverwaltung eindringen, hat das oft verheerende Folgen. Sensible Daten von Einwohnern landen im Darknet, oder monatelang können keine Sozialleistungen gezahlt werden. All das ist in Deutschland schon passiert. Was man braucht, um auf solche Angriffe vorbereitet zu sein, nennt man \"digitale Resilienz\". \n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 15:40 Uhr - Film: \"Das geträumte Abenteuer\"\nvorgestellt von Lars Meyer\n\n* 15:50 Uhr - Programmhinweis: Unter Büchern mit Heike Geißler\n\n* 16:00 Uhr - Nachrichten\n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 16:40 Uhr - 20 Jahre MET live im Kino\nKeine Frage, die Metrolpolitan Opera in New York bietet Opernaufführungen der Weltklasse. Aber wer schafft es schon, zeitlich und finanziell, die regelmäßig zu besuchen - von Deutschland aus? Man kann aber tatsächlich live dabei sein - die Technik machts möglich, und zwar seit 20 Jahren - im Kino. Über 185 Übertragen sind dabei schon zusammengekommen. Alexandra Maria Dielitz über die 20 jährige Geschichte der Met-Übertragungen im Kino. \n\n* 16:50 Uhr - In ARD Sounds: Die 1990er Jahre - Anatomie einer Zäsur\n\n* 17:00 Uhr - Nachrichten\n\n* 17:10 Uhr - Josef Mengele und die Schweiz\nJosef Mengele war einer der meistgesuchten NS-Verbrecher. Der KZ-Arzt von Auschwitz konnte trotzdem bis zu seinem Tod unbehelligt leben. \n\n* 17:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 17:40 Uhr - Krimi des Monats: Michael Idov - Das Riga Komplott\nDer brillante, junge Ari Falk leitet eine CIA-Abteilung in Riga. Die Weltlage ist 2021 angespannt... vorgestellt von Stefan Maelck.\n\n* 17:50 Uhr - Folk & Welt-Teaser: Sondorgo - Kind of Bela \nWir feiern den European Folk Day mit Söndörg_ aus Ungarn, Grit Friedrich sprach mit Áron Eredics über die Tambura, Béla Bartok und das neue Müpa-Live-Album, die Band bekommt den Folkpreis Eisernen Eversteiner in Plauen.\n\n\nDer Blick in die Welt bei MDR KULTUR international, aktuelle Berichte aus dem kulturellen und politischen Leben.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
- eventId: 543264
  start: 2026-09-23T16:00:00Z
