  title: 'MDR KULTUR Spezial: Unter Büchern!'
  description: "Das Dresdner Festival Literatur JETZT! startet mit einem Warm up. Und lädt zusammen mit dem Societätstheater Dresden und MDR Kultur zu einem Abend mit der Leipzigfer Schriftstellerin Heike Geißler ein. \"Das Rechtgefühl machte ihn zum Räuber und Mörder.\" So erzählt es Heinrich von Kleist in seiner gleichnamigen Novelle über den Pferdehändler Michael Kohlhaas, der nach erlittenem Unrecht blutige Vergeltung übt. Sein Rachefeldzug ist noch zweihundert Jahre später Vorbild und Handlungsanweisung für Michaela Kohlhaas, eine stellvertretende Friedhofsverwalterin. Befeuert von erfahrener Willkür und Ohnmacht, wird sie zur Aufsässigen. \n\nDoch wo Michael Kohlhaas mordet und brandschatzt, agiert sie vorrangig mit Worten: mit Zuspitzung, Übertreibung, Sabotage und Show. Einer vermeintlichen Hexe gleich, zieht sie fluchend und Verwünschungen aussprechend durchs Land. Und muss feststellen: Es ist von Nachteil, eine Frau zu sein. Es ist von Nachteil, sich zu wehren. Doch selbst wenn alle Welt sie für wahnsinnig erklärt - sie geht \"mit wehenden Fahnen\" ihrem Ende entgegen, auf ein gutes Ende hoffend, und doch ahnend: Ein solches Ende wird es vielleicht nicht geben.\n\nHeike Geißlers Roman \"Michaela Kohlhaas\" ist eine tollkühne Überschreibung der berühmten Novelle von Heinrich von Kleist. Ihre Michaela ist eine Schimpfende, eine Stinkende, eine Zärtliche. Eine große Liebende, die nicht bloß Verbesserung will - sie verlangt Wiedergutmachung und Sühne. Und eine gänzlich andere Einrichtung der Welt. Heike Geißler, die im Herbst den Sächsischen Literaturpreis bekommen wird, denkt gemeinsam mit Moderatorin und Unter-Büchern-Host Katrin Schumacher darüber nach und vertont einen Teil ihres Textes.\n\nEine Aufzeichnung aus dem Societätstheater vom 16.9.2026"
  subtitle: mit Heike Geißler und ihrem Roman "Michaela Kohlhaas" / Eine Sendung von Katrin Schumacher
