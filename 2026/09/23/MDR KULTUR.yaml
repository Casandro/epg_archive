  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Neues Album von Agnes Obel \nDie dänische Musikerin Agnes Obel erkundet auf ihrem neuen Album \"The Meaning Of Flowers\" die Sprache der Blumen.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1926 John Coltrane geboren\nMit seinem Saxophonspiel beeinflusst John Coltrane bis heute Jazzmusiker.\nVon Bernd Scheßelmann\n\n* 06:50 Uhr - Kulturtipp: Lennart Schilgen in Jena {23.9.26}\nLennart Schilgen 1988 in Westberlin geboren ist Autodidakt, was die Musik und die Poesie angeht. Aber es liegt ihm eben.. das mit dem Humor übrignes auch.. sonst wird man vielleicht auch kein Kabarettist. Unser Kutlurtipp heute von Ben Garit Hernandez\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - \"Robyn _s\" in Leipzig - Wenn KI durch den Magen geht\nAm Leipziger Hauptbahnhof ist KI gewissermaßen in aller Munde. Seit voriger Woche kocht dort der erste Koch aus Stahl und Software deutschlandweit, wie es heißt. Werden er und seinesgleichen das Gastgewerbe revolutionieren? Annette Militz mit ersten Eindrücken aus Robyn _s Robotikrestaurant:\n\n* 07:20 Uhr -  Literaturfestival JETZT\nIn Dresden beginnt das große Literaturfestival JETZT. Der spezielle Anspruch besteht auch darin, nicht nur ein paar Bestsellerautoren nach Dresden zu holen - sondern auch ungewöhnliche Orte und Lesungsformen zu entwickeln. Welche Ideen es da gibt, erzählt Helge Pfannenschmidt, einer der Organisatoren.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Folk & Welt-Teaser  Sinem - Asla!\nSinem kommt nach Leipzig am 1. November ins Conne Island. Sie hat eigene Songs geschrieben über Mut und Selbstermächtigung, und sie singt anatolische Rockklassike.\nFolk und  Welt  gibt's auch als Podcast bei Ard Sounds.\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Sachbuch der Woche: Yuval Noah Harari: Sapiens. Die Zauberlehrlinge. Von Kolumbus bis KI \nEine Tour de Force durch die Geschichte der wissenschaftlichen und industriellen Revolutionen, vorgestellt von Sabine Frank. \n\n* 08:20 Uhr - Unter Büchern mit Heike Geißler\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - 35 Jahre nach dem Pogrom - Gedenkparcours durch Hoyerswerda\nMit einem Gedenkparcours durch die Hoyerwswerdaer Neustadt wird an die rassistischen Ausschreitungen und das Pogrom 1991 erinnert. Grit Krause hat die einzelnen Stationen vorab aufgesucht.\n\n* 08:50 Uhr - MDR Kultur trifft {vom 19.09.} Fridtjof Florian Dossin\nAm Sonnabend war Fridtjof Florian Dossin zu Gast. Der in Berlin lebende Industriedenkmalpfleger ist auch Projektleiter der Reallabore des Instituts für Graue Energie e.V. Oßmannstedt, mit dem er innerhalb eines Vereins einen ehemelaigen Getreidesilo vor dem Abriss gerettet hat. MDR Kultur trifft...zu hören auch in ARD Sounds und heute Abend ab 20.00 Uhr bei MDR Kultur Radio. \n\n \nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter & Verkehr."
