  title: 'ROM: Das Römische Pilgerwerk'
  subtitle: Gespräch
  description: Rom. Sehen - Verstehen - LiebenDas Römische Pilgerwerk (ital. Opera Romana Pellegrinaggi) ist das Pilgerbüro des Vatikans. Es wurde 1933 von Papst Pius XI. ins Leben gerufen, um den Tourismus und Wallfahrten für die Evangelisierung zu nutzen. Das Büro organisiert vor allem Pilgerreisen zu bedeutenden christlichen Zielorten wie Lourdes, Fatima, Santiago de Compostela, Tschenstochau, dem Heiligen Land und vielen weiteren wichtigen Stätten.
