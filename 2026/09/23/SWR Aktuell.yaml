  title: SWR Aktuell Langstrecke
  description: |-
    14:00 - 15:00
    Alles Geschichte - Der History-Podcast
    DER VERBOTENE VATER (1/3) - Schicksal eines französischen Besatzungskinds
    Seit Katharina denken kann, hat sie das Gefühl, "nicht richtig zu sein". In ihrem Leben fehlt der Vater und ihre Familie schweigt über die Vergangenheit am Bodensee am Ende des Zweiten Weltkriegs. Doch da gibt es dieses winzige, alte Foto: Es zeigt einen Mann neben ihrer Mutter. Wer ist das?

    DER VERBOTENE VATER (2/3) - Das Phantom taucht auf
    Katharinas lebenslange Suche nach ihrem Vater beginnt. Sie erfährt, dass sie ein Besatzungskind ist - ihr Vater ein französischer Soldat. Und ihr wird klar, dass sie deshalb schon als Baby in großer Gefahr war.
    Zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/sendung/alles-geschichte-der-history-podcast/urn:ard:show:fdb83c5530d71150/
