- eventId: 559772
  start: 2026-09-23T16:30:00Z
  stop: 2026-09-23T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Echte Pausen - Warum Abschalten für unser Gehirn so wichtig ist
  description: |-
    Von Clemens Sarholz
    Viele Menschen sehnen sich nach Erholung - und können trotzdem kaum abschalten. Für Dauergestresste kann selbst der Yogakurs zum belastenden To-Do werden. Kaum entsteht Leerlauf, greifen viele zum Smartphone - im Durchschnitt rund 60-mal am Tag. Auch im Job kommen echte Pausen zu kurz. Ein Drittel der Beschäftigten lässt sie häufig ausfallen. Dabei zeigt die Hirnforschung: Unser Gehirn braucht das Nichtstun. Erst dann verarbeitet es Erlebnisse, wird kreativ oder reguliert Emotionen. Ob bei der Arbeit oder in der Freizeit: Pausen sind eine Voraussetzung für psychische Gesundheit und Leistungsfähigkeit.
- eventId: 559773
  start: 2026-09-23T17:00:00Z
  stop: 2026-09-23T18:00:00Z
  title: Der Tag
  description: Gerade erst sind spezielle gesundheitliche Risiken und Bedürfnisse des weiblichen Körpers in den Fokus gerückt. Es gibt mehr Forschung dazu, wie Medikamente bei Frauen wirken; die Wechseljahre und was die hormonellen Veränderungen mit sich bringen, werden umfassend thematisiert und Ärzte sind vermehrt sensibilisiert dafür, dass zum Beispiel ein Herzinfarkt bei Frauen ganz andere Symptome hervorruft als bei Männern. Das GKV- Beitragssatz-Stabilisierungsgesetz könnte die medizinische Versorgung von Frauen allerdings zurückwerfen. Wird der Gender Health Gap wieder größer statt kleiner?
  subtitle: Diese entsetzliche Lücke ... mehr Frau in der Medizin!
