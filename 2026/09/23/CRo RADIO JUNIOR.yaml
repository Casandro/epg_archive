  title: Velká pohádka
  description: 'Košile štěstí. Panu králi neschází nic, ale šťastný stejně není. A to i přesto, že je zdravý, má krásnou ženu a fůru peněz. Čím to? A jsou vůbec na světě šťastní lidé? Král se svým šaškem se rozhodli vyrazit do světa najít alespoň jednoho šťastlivce. Napsala: Věra Provazníková. Režie: Karel Weinlich. Účinkují: Jiří Klem, Jan Kanyza, Gabriela Vránová, Antonín Hardt, Oldřich Vlach a další.'
