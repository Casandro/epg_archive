  title: Klub Rádia Junior
  description: 'Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Lollipopz - dívčí skupina. Seznamte se s novou generací Lollipopz! Skupina loni oslavila už 10 let a s letošním létem přichází nová čtveřice: Gigi, Emča, Anička a Jasmínka. A stejně jako jejich předchůdkyně budou mít každá svou typickou barvu: Gigi růžovou, Emča zelenou, Anička žlutou a Jasmínka modrou. Jaké je dostat se do Lollipopz? Jak probíhal výběr nových členek? Jak si užily prázdninové natáčení a vystupování s bývalou sestavou Amy, Anet, Míšou a Nelly? A co všechno novou generaci čeká? Moderuje Klára Nováková.'
