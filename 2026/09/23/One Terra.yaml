  title: Planet Weltweit - Die schwimmenden Dörfer der Ha Long Bucht
  subtitle: Planet Weltweit - Die schwimmenden Dörfer der Ha Long Bucht
  description: 'Die Ha Long Bucht im Norden Vietnams wirkt im Februar mystisch. Zwischen Nebelschwaden ragen große, bizarr geformte Felsen aus dem Wasser. Einer Legende nach hat hier einst ein riesiger Drache die Menschen gegen Eindringlinge verteidigt. Im Kampf zerteilte er mit seinem Schwanz das Land, das dann vom Wasser umspült wurde. Es entstanden etwa 2000 kleine Inseln - fast alle unbewohnt und unbewohnbar. Trotzdem haben sich hier rund 1600 Menschen angesiedelt. Sie leben in kleinen schwimmenden Dörfern auf und von dem Wasser des Meeres. Wenn drei Stunden vom Festland entfernt, mitten in der Ha Long Bucht abends die Lichter angehen, dröhnt ein ohrenbetäubendes Knattern über das Wasser - Strom gibt es hier nur über Diesel- Generatoren. Bei Einbruch der Dunkelheit schalten viele Menschen des schwimmenden Dorfes Vong Vieng den Fernseher an. Dann sehen sie Dinge, die aus einer für sie fremden Welt stammen: Städte mit Straßen und Autos oder Tiere wie Schweine und Kühe. Ein kurzer, abendlicher Ausflug in ungewohnte Welten. Dann gewinnt das Plätschern der Wellen, die gegen Häuser und Boote schlagen, wieder die Oberhand. Die Generatoren werden abgeschaltet, denn Diesel ist teuer - wie alles, was nicht aus dem Wasser kommt. Das bedeutet oft Entbehrungen. Aber die Menschen hängen an ihrer Art zu leben: "Wenn ich auf dem Festland wohnen würde, dann würde ich das Fischen sehr vermissen. Ich könnte ohne das nicht leben." sagt Khuyen Van Vu. Den Beruf des Fischers hat er von seinem Vater gelernt und auch sein einundzwanzigjähriger Sohn Luu lebt vom Fischfang. Gerade hat Luu für sich, seine Frau Mai und seinen kleinen Sohn ein eigenes Haus gekauft. Doch die Freude ist getrübt: der Fang war in letzter Zeit schlecht und die letzte Rate ist noch nicht bezahlt. Wenn die Familie nicht schnell zu mehr Geld kommt, werden sie das neue Heim wieder verlieren. DE 2006'
