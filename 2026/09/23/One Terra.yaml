  title: Planet Weltweit - Kanadas Buschpiloten im Einsatz
  subtitle: Planet Weltweit - Kanadas Buschpiloten im Einsatz
  description: 'Wind, Schnee und Kälte bis zu minus 40 Grad Celsius - und das fast neun Monate im Jahr. Nunavik, im hohen Norden Kanadas, ist eine unwirtliche Region. Doch auch hier leben Menschen. In kleinen Gemeinden, Hunderte Kilometer voneinander entfernt. Unter teilweise schwierigen Flugbedingungen sichern Piloten jeden Tag die Verbindung der Dörfer mit dem Rest der Welt. Die 34-jährige Anouk Alarie fliegt eine robuste kleine "Twin Otter" über die Weiten der arktischen Tundra. "Wir sind die Busse des Nordens", sagt Anouk, "überall steigen Leute ein und aus". Und die widerstandsfähigen Buschflugzeuge leisten noch mehr: Mit ihrer Hilfe gelangen Lebensmittel bis in die entlegensten Winkel des Landes, Kranke werden ausgeflogen oder einfach nur Baumaterialien transportiert.  Nunavik ist der nördlichste Teil der kanadischen Provinz Québec. 9.000 Einwohner vom Volk der Inuit leben hier in einem Gebiet, das so groß ist wie ganz Frankreich. Vor knapp 40 Jahren lebte die Mehrzahl von ihnen noch als Nomaden, doch in den 1970er Jahren drängte die kanadische Regierung die Inuit massiv dazu, sesshaft zu werden. Seitdem kämpfen sie darum, ihre Sprache, das Inuktit, und die alten Traditionen zu bewahren. Bis heute gehen die Männer mehrmals die Woche zum Eisfischen nach Lachsen und jagen Wölfe, Elche oder Robben - wenn auch nicht mehr mit Hunden- sondern mit Motorschlitten. Selbst Pilotin Anouk Alarie hat sich über die Jahre einige Sprachkenntnisse angeeignet. "Kangiqsualujjuaq", der Name des östlichsten Ortes Nunaviks, geht ihr inzwischen problemlos über die Lippen. Der entlegenste und mit 1.000 Einwohnern zugleich größte Ort auf Anouks Flugroute hat allerdings einen einfacheren Namen: Salluit. Hier lebt die Französischlehrerin Mélanie Legare. Eigentlich wollte sie nur ein Jahr bleiben, doch dann verliebte sie sich in ihren heutigen Ehemann Charlie und blieb. Das war vor vier Jahren. DE 2008'
