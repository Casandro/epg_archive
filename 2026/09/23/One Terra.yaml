  title: Planet Weltweit - Auf den Spuren der Wikinger
  subtitle: Planet Weltweit - Auf den Spuren der Wikinger
  description: |-
    Henryk Wolski ist begeisterter Seefahrer. Schon neun Mal ist er um den Erdball gesegelt. Zusammen  mit einer siebenköpfigen Mannschaft möchte er nun in die Vergangenheit reisen und eine alte  Wikingerroute neu erkunden. Ausgangspunkt der Expedition ist Polens Hafenstadt Danzig. Dort wird  die "Welet", der originalgetreue Nachbau eines Wikingerschiffs, ablegen und Kurs auf Odessa  nehmen. Insgesamt beträgt die Strecke zwischen Ostsee und Schwarzem Meer 2.500 Kilometer - eine  Strecke, für die die gefürchteten Seemänner aus dem Norden einst fast zwei Jahre brauchten. Wolski  hingegen will sein Ziel schon in drei Monaten erreichen.

    "Dass die Wikinger durch die Ozeane der Welt gesegelt sind, verdient Respekt." sagt Wolski. Aber  auch wie sie die Flüsse bezwangen, fasziniert ihn. Ihre Route zwischen Danzig und Odessa möchte er  unter möglichst ursprünglichen Bedingungen erkunden. Immer wieder muss die Mannschaft der "Welet"  ihre Muskelkraft einsetzen - jeden Tag wird mindestens fünf Stunden gerudert, allen Schwielen und  Blasen an den Händen zum Trotz. Beinahe täglich stößt die Mannschaft an ihre körperlichen Grenzen  - und auf Hindernisse. So setzt das Boot immer wieder auf flachem Grund auf. Gesprungene Planken  und gefährlich tief hängende Fährseile sind nur kleinere Probleme. Die erste große Herausforderung  wartet bereits an der Landesgrenze zur Ukraine: In Przemysl muss das Boot über Land auf den Fluss  Dnjestr übergesetzt werden. Statt nach Wikingerart Holzrollen und Zugvieh zu gebrauchen wird  hierfür allerdings ein Kran eingesetzt, der es vorsichtig aus dem Wasser hebt. Eine schwierige  Operation, da sich das Boot mit Wasser vollgesogen und enorm an Gewicht zugelegt hat. Doch damit  nicht genug - am Grenzübergang soll Wolski auch noch eine Kaution von mehreren tausend Dollar  hinterlegen, um einreisen zu dürfen. Kann er nicht zahlen, ist seine Reise hier zu Ende. DE 2007
