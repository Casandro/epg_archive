  title: Planet Weltweit - Tibetische Medizin - Heilkraft der Seele
  subtitle: Planet Weltweit - Tibetische Medizin - Heilkraft der Seele
  description: 'Abgeschieden im Himalaya entwickelte sich im Laufe von Jahrhunderten eine Hochkultur, der tibetische Buddhismus, und mit ihm die tibetische Medizin. Es ist die buddhistische Tugend des Mitgefühls, die Seele, die die tibetische Medizin auszeichnet, und die der Medizin im Westen manchmal fehlt. GEO Reportage war mit einem der Leibärzte des Dalai Lama und seinen Patienten in Dharamsala, im Norden Indiens, unterwegs. Tenzin Thaye ist einer von fünf Ärzten und Ärztinnen am Men-Tsee-Khang Institut für tibetische Medizin in Dharamsala. Eine Behandlung hier kostet nicht viel, für Bedürftige ist sie sogar kostenlos. Ob Urindiagnose oder Pillen aus Heilpflanzen, in der tibetischen Medizin sind Diagnose und Therapie in eine komplexe Theorie eingebettet. "In der Philosophie der tibetischem Medizin gilt Unwissenheit als Wurzel aller Krankheiten, durch die drei Geistesgifte entstehen: Hass, Neid und Ignoranz", sagt der Arzt Tenzin Thaye. Auch eine falsche Ernährung, ein ungesundes Klima oder seelischer Stress können den Menschen aus dem Gleichgewicht bringen. Ein Ungleichgewicht von Lung, Tripa und Beken, den drei Elementen für Bewegung, Wärme und kühlende Energie im Organismus kann entstehen und krank machen. Neben der Herstellung von traditionellen Arzneien ist bis heute die Verabreichung von Juwelenpillen, Akupunktur, das blutige Schröpfen oder die Moxibustion, das Verbrennen von ätherischen Kräutern auf der Haut, als Heilmethoden erhalten. Selbst die Ärzte des Krankenhauses von Dharamsala, in dem Medizin nach westlichen Maßstäben betrieben wird, pflegen einen regen Austausch mit den Ärzten für tibetische Medizin. Den Menschen als Ganzes zu betrachten, als eine Einheit aus Körper und Geist: Das ist der Erfolg der tibetischen Medizin. DE 2019'
