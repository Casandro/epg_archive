  title: Planet Weltweit - Sibirien, die Eischneider von Jakutsk
  subtitle: Planet Weltweit - Sibirien, die Eischneider von Jakutsk
  description: 'In Jakutien, im östlichen Teil Sibiriens, herrschen im Winter extrem tiefe Temperaturen. Auf dem Fluss Lena wird die Flotte dann "tiefgekühlt" repariert! Es ist eine Technik, mit der Schiffe direkt im Eis überholt werden, ohne sie ans Ufer zu bringen. Wenn die Temperatur tief genug sinkt, fräsen die sogenannten "Eisschneider" ein Eislabyrinth von Tunneln unter die Schiffe nur mit Hacke und Motorsäge. GEO Reportage war mit ihnen im Eis der Lena. Russland, ein Land der klimatischen Gegensätze. Von den Subtropen im Süden bis zur Arktis im Norden. Auch in Jaktusk, am mächtigen Fluss Lena, haben Menschen gelernt zu überleben und sie versuchen, aus den harten Bedingungen im Winter ihrem Vorteil zu ziehen. Die Schiffe der Lena-Flotte frieren monatelang ein. Gewartet werden sie trotzdem: unter dem Eis, das erspart den Bau von Trockendocks. Zum Einsatz kommen dafür die harten Männer Sibiriens, zu denen auch Michail und Sascha gehören. Sie haben den Auftrag, einen Tunnel unter einem der großen Schlepper ins Eis zu schneiden, damit eine Inspektion an der Schiffsschraube durchgeführt werden kann. Das Problem ist nicht die Kälte, im Gegenteil. Im ausgehenden Winter herrschen inzwischen teils Temperaturen über minus 30 °C. Das Eis friert dann weniger stabil. Außerdem kämpfen Michail und Sascha immer wieder mit gefährlichen Gasblasen im Eis. Als Folge eines natürlichen, organischen Zersetzungsprozesses bilden sich diese permanent am Boden des Flusses. Im Winter sammeln sich die Blasen im Eis und bilden manchmal sogar vertikale Gasröhren, die auch "Luftschläuche" genannt werden. Wenn einer der Eisschneider eine solche Röhre durchbohrt oder ansägt, bricht das warme Flusswasser oft unter hohem Druck an die Oberfläche, wodurch die Eistunnel schnell völlig überflutet werden und teils wochenlange Arbeit umsonst war! Werden Michail und Sascha ihre Tunnel rechtzeitig vor Einbruch des Frühlings fertig bekommen? DE 2019'
