  title: Planet Weltweit - Die Ostsee, Sehnsuchtsort der Kraniche
  subtitle: Planet Weltweit - Die Ostsee, Sehnsuchtsort der Kraniche
  description: 'Die deutsche Ostseeküste ist von der Halbinsel Fischland-Darß-Zingst bis hinüber nach Rügen eine einzigartige Küstenlandschaft, mit verträumt-schönen Landschaften, Dörfern und einer einzigartigen Vogelwelt. Jedes Jahr im Herbst machen hier Zehntausende Kraniche Rast auf ihrem Weg in den Süden. GEO Reportage war den Kranichen auf der Spur. Es ist eine geografische Besonderheit hier auf dem Darß, die diesen Küstenabschnitt für Kraniche attraktiv macht: Der Bodden. Dieses durch Landzungen und Inseln entstandene Lagunengewässer ist ein wahres Vogelparadies. Die großen Schreitvögel bewohnen normalerweise Sumpf- und Moorlandschaften im gesamten nördlichen und östlichen Europa sowie im Norden Asiens. Doch jedes Jahr im Herbst finden sich unzählige dieser Vögel hier an der Ostseeküste ein und sorgen für ein Spektakel, das Vogelliebhaber und Wissenschaftler gleichermaßen begeistert: die Kranichrast. Zehntausende Kraniche aus Deutschland, vor allem aber aus Skandinavien und dem Baltikum machen zwischen September und November Rast entlang der Boddenkette, engmaschig überwacht von Ornithologen und begeistert beobachtet von zahlreichen Vogelbegeisterten. Wie bedroht der Kranich durch Landwirtschaft, Klimawandel und natürliche Feinde ist, soll die aktuelle Zählung zeigen. Einzigartig sind jedoch nicht nur der Vogelzug hier oben im Norden oder die kilometerlangen, breiten Sandstrände. Auch altes Handwerk lebt hier weiter, wie die farbenfrohen Darßer Türen, handgefertigt und mit den typischen Motiven verziert, auch der Kranich findet sich darauf wieder. In der Werkstatt der Brüder Rohloff in Prerow werden neue Türen gebaut und alte saniert. Sie stammen oft aus dem 19. Jahrhundert, alte Kapitänstüren, durch deren Opulenz und Größe der Wohlstand der Bewohner zum Ausdruck kam. Die Charakteristik und das Flair der Ostseeküste zu erhalten: mit ihren Menschen, den Tieren, der Landschaft und Architektur. Das ist der große Wunsch der Einheimischen. DE 2019'
  ageRating: 12
- eventId: 1065234
