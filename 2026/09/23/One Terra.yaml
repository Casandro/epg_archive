  title: Planet Weltweit - Mustang - Flucht aus den Bergen
  subtitle: Planet Weltweit - Mustang - Flucht aus den Bergen
  description: 'Im Himalaya, zwischen den höchsten Bergen der Welt, liegt es versteckt: Das ehemalige Königreich Mustang. Es ist berauschend schön, aber auch sehr trocken im Land der Lo-Pa. Viele Jahrhunderte lang hatten sie trotzdem genügend Wasser zum Leben. Doch jetzt hat sich das Klima gewandelt, viele Felder vertrocknen. Die Bewohner des in 4000 Meter Höhe gelegenen Dörfchens Samzong müssen umziehen - und starten in eine ungewisse Zukunft. Wie von Gott geschaffen, liegt Mustang zwischen den höchsten Bergen der Welt: Bilder von atemberaubender Schönheit prägen das ehemalige Königreich Mustang. Die Lo-Pa leben hier, abgeschieden von der Welt, von Ackerbau und Viehzucht. Seit die Winter wärmer geworden sind und es regnet statt zu schneien, wird das Wasser immer knapper, Besonders vom Klimawandel betroffen sind die 61 Menschen in Samzong, einem Dorf in 4000 Metern Höhe. Hier wird jede Ernte zur Überlebensfrage. Hilfe kommt aus dem Hauptort Mustangs, Lo Manthang. Der buddhistische Mönch Lama Ngawang organisiert einen von ausländischen Wissenschaftlern empfohlenen Plan: Den Umzug des ganzen Dorfes in die Nähe eines Flusses.  Lama Ngawang kommt gerade aus dem Ausland zurück, wo er Spenden für das gewagte Projekt gesammelt hat: "Unser erstes Ziel war es, Samzong zu erhalten, indem wir die Wasserversorgung verbessern. Doch dann haben wir eine Forschungsstudie gemacht. Die Wissenschaftler kamen zu dem Schluss, dass ein Weiterleben in Samzong nicht möglich ist. Der Gletscher ist wegen der Klimaerwärmung bereits geschmolzen. Wir müssen nun das alte Samzong umsiedeln." Kein einfaches Unterfangen - die Menschen verlieren das Land ihrer Ahnen. Wer hier oben lebt und aufgewachsen ist, hat kaum Kontakt zur Außenwelt. Der Zusammenhalt des Dorfes und die Familienbande sind das Wichtigste. DE 2013'
