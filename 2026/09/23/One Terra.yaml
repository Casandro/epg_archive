  title: Planet Weltweit - Polarschule der Nomadenkinder
  subtitle: Planet Weltweit - Polarschule der Nomadenkinder
  description: "Jedes Jahr im August warten die Kinder der Rentierhirten auf der russischen Polarhalbinsel Jamal  auf den Hubschrauber, der sie zum Ende der Sommerferien in die Schule bringt. 600 Nomaden-Kinder  vom Volk der Nenzen leben und lernen den größten Teil des Jahres getrennt von ihren Eltern. Ihre Heimat Jamal ist eineinhalb Mal größer als Österreich und war bislang ein von der Zivilisation  vergessener Flecken Russlands. Bis unter der Tundra die größten Gasvorkommen der Welt entdeckt  wurden! Inzwischen treffen die Nomaden auf ihren Wanderungen immer öfter auf zerstörte Natur und  gigantische Industrieanlagen. Doch nicht alle Nenzen sind darüber unglücklich. Denn ihren Kindern eröffnen sich nun auch neue Chancen. \nDie Nenzen-Nomaden ziehen während des ganzen Jahres über die russische Halbinsel Jamal: Im Herbst  wandern sie rund 1.000 km Richtung Süden bis an die Hänge des Uralgebirges, im Frühjahr wieder  zurück in den Norden bis ans Polarmeer. Im Sommer bei Temperaturen von + 15°C und im Winter bei  bis zu - 55° C. Über 6000 Nenzen leben so auf Jamal - seit Menschengedenken. Es sind die letzten  echten Nomaden auf unserer Erde, die diese Wirtschafts- und Lebensweise noch ganzjährig pflegen. Die 45 Jahre alte Nenzin Ludmilla Chudy lebt dagegen nur noch im Sommer mit den Nomaden. Den Rest  des Jahres arbeitet sie als Erzieherin in der einzigen größeren Siedlung auf Jamal, in Yar-Sale.  Dort befinden sich auch das Internat und die Schule, wo die Kinder der Nenzen leben und  unterrichtet werden. In den großen Ferien, bevor das Schuljahr beginnt, hilft Ludmilla Chudy ihrer  Nomadenfamilie bei den beschwerlichen Wanderungen durch die Weiten der Tundra: sie treibt die Rentierherden zusammen, versorgt die Kinder, kocht Essen und baut die Zelte auf und wieder ab. Sie  beobachtet auch, wie die Erschließung von Erdgas-Quellen das naturnahe Leben der Nomaden zusehends  verändert. Bowanenko, die bald schon größte Gasförderstätte der Welt, entsteht heute auf Jamal. DE 2011"
