  title: Wielkie konstrukcje 1 (odc. 7)
  subtitle: Technologia, która przeczy prawom fizyki! Gigantyczne projekty, które miały być niemożliwe do zbudowania - a jednak powstają! Krok po kroku, jak rodzą się prawdziwe inżynieryjne cuda!
  description: |-
    Tytuł oryginalny: Megastructures
    US,GB,NZ, 2009
    Reżyseria: Ian Holt
    Występują: Tom Goodman-Hill
    Twórcy przedstawiają największe i najbardziej zdumiewające maszyny i budowle, począwszy od rodzaju materiału, z którego je zbudowano, aż po metody pracy i naukowe zaplecze mające zapewnić trwałość konstrukcji. W programie znajdują się wywiady z projektantami i kierownikami budowy. Prezentują oni problemy, z którymi musieli zmierzyć się konstruktorzy i budowniczowie.
  ageRating: 12
  genre:
  - '35'
- eventId: 930255
  start: 2026-09-23T14:00:00Z
  stop: 2026-09-23T15:00:00Z
  title: 'Charlie Luxton: domy nad morzem 1 (odc. 1)'
  subtitle: Charlie Luxton, znany brytyjski architekt i projektant odwiedza nadmorskie posiadłości w Wielkiej Brytanii.
  description: |-
    Tytuł oryginalny: Charlie Luxton's Homes By the Sea
    GB, 2014
    Domy nad morzem to marzenie każdego. Niektórzy Brytyjczycy je spełnili i właśnie ich odwiedzi Charlie Luxton - znany brytyjski architekt i projektant. Odwiedza domy Brytyjczyków mieszkających nad morzem. W każdym odcinku odwiedza cztery posiadłości i stara się odpowiedzieć na pytanie, co czyni posiadłość nad morzem idealną.
  ageRating: 12
  genre:
  - '35'
