  title: Srpske svetinje na KiM
  subtitle: Serijal Srpske svetinje na Kosovu i Metohiji, koji prikazuje celokupno srpsko duhovno i umetničko pravoslavno nasleđe ? manastire poput Visokih Dečana, Gračanice, Pećke patrijaršije, crkve i.
  description: Serijal "Srpske svetinje na Kosovu i Metohiji", prikazuje kosovsko - metohijsko srpsko duhovno i umetničko pravoslavno nasleđe. Kapitalni projekat Filmskih novosti, sniman je tri godine i okupio je 70 istoričara, istoričara umetnosti, arheologa, antropologa, teologa i etnologa. Snimljeno je 179 crkava i crkvišta, manastira i manastirišta na KiM. Sve to uz sugestije republičkog Zavoda za zaštitu spomenika kulture, podršku Ministarstva kulture i Uneska, i blagoslov tadašnjeg patrijarha Irineja i vladike raško - prizrenskog Teodosija. Đorđe Kadijević, konsultant na serijalu, kaže da serijal skreće pažnju na poreklo baštine, budući da Arbanasi žele da dokažu da su oni autori spomenika koji se nalaze na teritoriji koju smatraju svojom i da su snimili filmove o srpskim manastirima predstavivši ih kao - svoje.
