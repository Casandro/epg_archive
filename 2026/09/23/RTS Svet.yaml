  title: Kraljevo Tozovcu
  subtitle: Veliki koncert narodne muzike posvećen Predragu Živkoviću Tozovcu prenosimo na sa Trga srpskih ratnika u Kraljevu.
  description: Veliki koncert narodne muzike posvećen Predragu Živkoviću Tozovcu prenosimo na sa Trga srpskih ratnika u Kraljevu. Novi festival harmonike okupio je vrsne harmonikaše koji su želeli da odaju počast ovom velikom narodnom umetniku u njegovom rodnom gradu. Čak tri orkestra harmonike nastupiće na sceni na trgu u Kraljevu - Orkestar Miše Mijatovića, Nikola Peković i Ansambl "Umetnička porodica" I Narodni orkestar pod upravom Vlade Panovića, a specijalno uključenje imaće i Orkestar Aleksandra Sofronijevića. Najlepše Tozovčeve pesme izvešće Miroslav Ilić, Slavko Banjac, Aleksandar Tirnanić, Jovan Mihaljica, Snežana Kopunović, a specijalni gost je Lepa Lukić. Voditelj programa je Bojana Marković.
