  title: Winnice miłości 1 (odc. 13)
  subtitle: Kiedy Mattheos zdaje sobie sprawę, że Achilleas jest zdeterminowany, by zdobyć Melinę, między braćmi dochodzi do konfliktu.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Kiedy Mattheos zdaje sobie sprawę, że Achilleas jest zdeterminowany, by zdobyć Melinę, między braćmi dochodzi do konfliktu. Zagraża to nie tylko ich wspólnym interesom z rodziną Giannakakis, ale może spowodować inne, tragiczne skutki. Achilleas jednak nie poddaje się i dalej próbuje zbliżyć się do Meliny, mimo że ta zachowuje się wobec niego chłodno. Kiedy Anastasia dowiaduje się, że Mattheos wrócił na Kretę, wpada w furię i prosi Minasa, by znalazł jej broń.
