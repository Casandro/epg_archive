  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Die letzte Grenze, Education / Science / Factual topics, Season:1 Episode:1
  description: 'S1 E1 ● FSK: 0 Im Herbst ereignet sich im nördlichen Pazifik ein Naturschauspiel. Tausende Lachse kehren in die Laichgebiete des Katmai-Nationalparks zurück. Braunbären nutzen die Migration aus und schlagen sich vor dem Winterschlaf den Bauch voll. Education / Science / Factual topics,  Mit: Casey Anderson, Season:1 Episode:1'
- eventId:
  - 1002191
  - 992474
  start: 2026-09-23T04:31:00Z
  stop: 2026-09-23T04:56:59Z
  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Fischen wie ein Bär, Education / Science / Factual topics, Season:1 Episode:2
  description: 'S1 E2 ● FSK: 0 Casey Anderson folgt Bärenfamilien, die während der Lachsmigration fischen gehen. Tausende Lachse kehren in ihre Laichgebiete zurück und die Bären haben viele verschiedene Techniken entwickelt, um an die begehrten Fische zu gelangen. Education / Science / Factual topics,  Mit: Casey Anderson, Season:1 Episode:2'
- eventId:
