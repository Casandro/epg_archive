  start: 2026-09-23T05:26:00Z
  stop: 2026-09-23T05:55:59Z
  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Die Spur des Wolfes, Education / Science / Factual topics, Season:1 Episode:4
  description: S1 E4 Die Crew entdeckt in der Ferne einen einsamen Wolf und nimmt seine Fährte auf. Dabei stoßen sie auf eine altbekannte Bärenfamilie. Durch sie gelangen sie an einen beliebten Ort zum Fischen, wo es vor hungrigen Bären nur so wimmelt. Education / Science / Factual topics, Season:1 Episode:4
