  title: Survive the Wild
  subtitle: Die Kunst des Überlebens von Fleischfressern, Magazines / Reports / Documentary 2017, Season:1 Episode:5, FSK 12
  description: '2017 ● S1 E5 ● FSK: 12 Für Fleischfresser wächst das Futter bekanntlich nicht auf den Bäumen. Um satt zu werden, müssen sie deshalb über ein beachtliches Repertoire an Fähigkeiten verfügen - denn ihre Beutetiere haben einen ebenso großen Lebenswillen wie sie selbst. Strategisches Know-how ist dabei meist wesentlich wichtiger als körperliche Überlegenheit. Magazines / Reports / Documentary 2017, Season:1 Episode:5, FSK 12'
- eventId:
  - 1002195
  - 992478
  start: 2026-09-23T06:56:00Z
  stop: 2026-09-23T07:55:59Z
  title: Survive the Wild
  subtitle: Künstliche Intelligenz verstehen, Magazines / Reports / Documentary 2017, Season:1 Episode:6, FSK 12
  description: '2017 ● S1 E6 ● FSK: 12 Wildtiere verfügen über eine erstaunlich große Bandbreite an Verteidigungsstrategien, um eine Attacke abzuwehren. Einige suchen den Schutz und die Sicherheit ihrer Herde, andere verstehen sich auf die perfekte Tarnung, wieder andere nutzen die Angriff-ist-die-beste-Verteidigung-Strategie und noch andere bauen ganze Festungen, um Eindringlingen von vorneherein keine Chance der Annäherung zu bieten. Um in der freien Wildbahn zu überleben, geht jedes Tier bis zum Äußersten. Magazines / Reports / Documentary 2017, Season:1 Episode:6, FSK 12'
- eventId:
  - 1000540
  - 1002196
  start: 2026-09-23T07:56:00Z
  stop: 2026-09-23T08:26:59Z
  title: Wild Ones
  subtitle: Die Schnellsten, Nature / Animals / Environment 2014, Season:1 Episode:13
  description: '2014 ● E13 Im Kampf ums Überleben ist die Geschwindigkeit oft ein wichtiger Faktor. Die Tiere können auf der Flucht enorme Geschwindigkeiten erreichen. Doch wer ist das schnellste Tier der Welt? Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:13'
- eventId:
  - 1000541
  - 1002197
  start: 2026-09-23T08:27:00Z
  stop: 2026-09-23T08:56:59Z
  title: Wild Ones
  subtitle: Die Größten, Nature / Animals / Environment 2014, Season:1 Episode:10
  description: '2014 ● E10 In der Welt der Tiere entscheiden Kleinigkeiten über Leben und Tod. Neben Schnelligkeit und Stärke macht manchmal die Körpergröße den entscheidenden Unterschied. Ist der Elefant wirklich das wuchtigste Tier der Welt? Oder ist es der massige Polarbär, der bis zu 500 Kilogramm schwer werden kann? Gewinnt den Kampf der Kolosse am Ende die stolz und elegant anmutende Giraffe oder doch der gigantische Buckelwal? Die Dokumentation verrät es. Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:10'
- eventId:
  - 1000542
  - 1002198
  start: 2026-09-23T08:57:00Z
  stop: 2026-09-23T09:27:59Z
  title: Wild Ones
  subtitle: Die Klügsten, Nature / Animals / Environment 2014, Season:1 Episode:6
  description: '2014 ● E6 Tiere haben oftmals besondere Fähigkeiten und sind intelligenter, als wir annehmen. Wer ist das intelligenteste Tier? Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:6'
- eventId:
  - 1000543
  - 1002199
  start: 2026-09-23T09:28:00Z
  stop: 2026-09-23T09:58:59Z
  title: Wild Ones
  subtitle: Die Stärksten, Nature / Animals / Environment 2014, Season:1 Episode:7
  description: '2014 ● E7 Der gewaltige Grizzlybär oder doch die winzige Ameise? In der Welt der Tiere kommt es manches Mal gar nicht auf die Größe an. Schon kaum, wenn es um die Verteidigung des eigenen Reviers geht. Gewinnt der Fangschreckenkrebs am Ende gegen das Krokodil? Die Dokumentation zeigt die stärksten Tiere der Welt. Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:7'
