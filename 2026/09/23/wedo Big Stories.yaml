  - 992475
  start: 2026-09-23T04:57:00Z
  stop: 2026-09-23T05:25:59Z
  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Alaskas Ökosystem, Education / Science / Factual topics, Season:1 Episode:3
  description: S1 E3 Im Herbst wandern Tausende von Lachsen aus dem nördlichen Pazifik zurück zum Katmai-Nationalpark. Die große Population der Braunbären schlägt sich dann die Bäuche mit Fisch voll, um sich auf den Winterschlaf vorzubereiten. Education / Science / Factual topics, Season:1 Episode:3
- eventId:
