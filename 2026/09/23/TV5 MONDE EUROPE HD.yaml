  description: "Au sommaire : \n\nC'est que le début : le prix des F35\nFocus sur le prix des F35, un prix annoncé comme fixe, argument de campagne maintes fois répété avant d'être finalement démenti...\n\nDésunion de banque suisse\nComment protéger la Suisse d'une crise majeure si l'UBS devait vaciller?? Renforcer les fonds propres ou laisser les rênes libres à la banque ?\n\nMerco pas si sûr\nS'il inquiète grandement les producteurs suisses de viandes, l'accord sur le Mercosur faciliterait aussi l'arrivée de boeuf d'Amérique du Sud, élevé en parc d'engraissement. \nInvité : Léandre Duggan, journaliste, auteur du reportage sur le Mercosur.\n\nSauver les meubles\nLe pillage d'une partie du mobilier de Chandigarh, la ville conçue par Le Corbusier et son cousin Pierre Jeanneret en Inde. Les chaises destinées aux étudiants et fonctionnaires sont devenus des trésors et s'échangent à prix d'or, malgré les efforts pour protéger ce patrimoine.\n\nPrésentation : Catherine Sommer\n "
