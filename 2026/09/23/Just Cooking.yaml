  title: Mimilicious - Spargelcremesuppe
  subtitle: Mimilicious - Spargelcremesuppe
  description: |-
    Mimilicious: Spargelcremesuppe

    Zutaten

    500 g Spargel (weiß oder grün)
    500 ml Gemüsebrühe oder Spargelfond
    30 g Butter
    1 Prise Zucker
    2 EL Mehl
    100 ml Weißwein
    1 Eigelb
    200 ml Schlagobers
    1/2 Zitrone
    3 Prisen Muskatnuss
    3 Prisen weißer Pfeffer
    1 TL Salz

    Zubereitung
    - Den Spargel schälen und die Spitzen abschneiden.
    - Die Brühe oder den Spargelfond zum Kochen bringen, 1 TL Butter und eine Prise Zucker hinzufügen.
    - Die Spargelstangen (ohne Spitzen) in 2 cm lange Stücke schneiden und in der Brühe etwa 20 Minuten kochen, bis sie weich sind. Dann die Suppe vom Herd nehmen.
    - Den gekochten Spargel in der Suppe mit einem Pürierstab gut pürieren.
    - In einem separaten Topf die restliche Butter bei niedriger Hitze zerlassen, das Mehl darüber stäuben und unter ständigem Rühren goldgelb anschwitzen.
    - Den Weißwein langsam unter Rühren hinzufügen, dann die pürierte Spargelsuppe dazugeben. Alles aufkochen lassen und die Spargelspitzen hinzufügen. Etwa 12 Minuten sanft köcheln lassen.
    - In einer Schüssel das Eigelb mit 100 ml Schlagobers verquirlen. Den restlichen Schlagobers steif schlagen. Die Ei-Schlagobers-Mischung vorsichtig in die Suppe einrühren.
    - Die Zitrone auspressen und den Saft zur Suppe geben. Mit Muskatnuss, weißem Pfeffer und Salz DE 2024
  ageRating: 6
