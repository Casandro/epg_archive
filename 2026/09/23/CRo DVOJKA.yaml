  title: Kriminálka
  description: Tyrani na pervitinu - Přišel na policii nahlásit vraždu. Jeho dva známí prý mladého muže ještě před tím unesli, věznili, bili, mučili a týrali. Těla se potom zbavili hrůzným způsobem. Ale byla to vůbec pravda? Proč by někdo udával své kumpány? Co všechno musela zjistit pardubická mordparta, než soud vynesl rozsudek? Premiéra.
