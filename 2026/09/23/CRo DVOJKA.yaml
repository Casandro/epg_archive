  description: Martina Helešicová, ředitelka školy Jaroslava Ježka. Jak po 40 letech péče o děti se zrakovým postižením vnímá jejich svět? V čem se zásadně za poslední desítky let proměnila výuka žáků se zrakovým handicapem? A zůstává pro děti ze školy Jaroslava Ježka tento skladatel dodnes vzorem? Moderuje Ondřej Kepka.
