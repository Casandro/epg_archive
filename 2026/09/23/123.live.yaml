  title: Das große Captain-Cook-Wunschkonzert
  subtitle: Das große Captain-Cook-Wunschkonzert
  description: 'Nach Ihren Zuschriften und Wünschen wurden die beliebtesten Musik-Aufnahmen mit "Captain Cook und seinen singenden Saxophonen" ausgewählt. Die Erfolgsgeschichte der Instrumentalband begann1993: Der Textdichter aus Regensburg, Günther Behrle, entschloss sich, in Verehrung für den verstorbenen Bandleader Billy Vaughn ein Ensemble zusammenzustellen, dessen Melodiestimmen von Saxophonen gespielt werden. Der Erfolg ließ nicht lange auf sich warten... Ge 2015'
