  title: Josefine Mutzenbacher
  subtitle: Josefine Mutzenbacher
  description: 'Wien um die Jahrhundertwende: Bis jetzt war Josefine ein Mädchen, das die Liebe um der Liebe willen trieb. Erst ein gewisser Rudolf, der Vater und Tochter einmal überraschte und sie damit erpreßte, machte Josefine zur Hure. Sie lernt rasch, das Angenehme mit dem Nützlichen zu verbinden und wird zur bekanntesten und begehrtesten Praterdirne, der nichts, aber auch gar nichts fremd ist. Und sie wird reich, sehr reich. Vielleicht, weil sie trotz allem auch noch Herz hat. Ge 1970'
