  title: Hein Simons - Heintje und Ich
  subtitle: Hein Simons - Heintje und Ich
  description: In diesem TV Special dreht sich alles rund um - Hendrik - das war der eigentliche Rufname von Heintje. In der Gaststätte seiner Eltern stand eine gute alte Jukebox, die den kleinen Heintje faszinierte. Besonders das Lied "Mamma" gesungen von Robertino. Der Junge sang es so stimmgewaltig mit, dass der Bar-Keeper den Jungen zu einem Talentwettbewerb anmeldete.  Dort in der Jury saß der damals sehr bekannte Sänger Willy Alberti, bekannt für seine Version des italienischen Hits "Come Prima", er war von dem neunjährigen Heintje begeistert und sagte ihm eine große Zukunft voraus. Ge 2018
