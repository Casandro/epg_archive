  title: Josefine Mutzenbacher - Mein Leben für die Liebe
  subtitle: Josefine Mutzenbacher - Mein Leben für die Liebe
  description: 'Bei einem Gelage in der russischen Gesandtschaft in Wien lernt Josefine Mutzenbacher den jungen Grafen Wanja kennen und lieben. Doch die Romanze endet tragisch: Wanja wird bei einem Duell tödlich getroffen. Da begegnet Josefine dem reichen, aber älteren Bankier Blumenschein, der sie sogar malen lässt. Josefine verführt den in der Liebe unerfahren Maler Ferdinand, doch dieser "Seitensprung" bleibt nicht ohne folgen. 1985'
