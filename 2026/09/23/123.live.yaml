  title: Der Bettelstudent
  subtitle: Der Bettelstudent
  description: 'Im Krakau des 18. Jahrhunderts macht der selbstherrliche Statthalter Ollendorf der verarmten Gräfin Palmatica einen ungewöhnlichen Heiratsvorschlag für ihre Tochter Laura. Laura jedoch weist ihn energisch zurück, woraufhin Ollendorf Rache plant: Laura soll einen armen Studenten heiraten und in Armut leben. Symon Rymanowicz, vermeintlicher Bettelstudent, wird für das Spiel ausgewählt. Unwissend um Symons wahre Identität stimmt dieser zu. Ge 1956'
