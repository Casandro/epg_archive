  title: Morden im Norden (55)
  subtitle: Im Netz
  description: 'Die 17-jährige Nadine Bomke wird von ihrer Schwester Paula mit einem Kopfschuss tot im Wald aufgefunden. Dabei schien das Leben von Nadine perfekt zu sein: Sie hatte einen Freund, gute Noten und eine Zusage für ihren Traumjob. Doch die weiteren Ermittlungen bringen die Wahrheit ans Licht: Nacktbilder von ihr im Internet haben Nadine das Leben zur Hölle gemacht. Kurz vor ihrem Tod machte sie in einem heftigen Streit ihren Exfreund Sascha Lubig dafür verantwortlich. Für Finn Kiesewetter und Lars Englen ist Sascha sofort der Hauptverdächtige. Doch dann verschafft ihm ausgerechnet Paula ein Alibi.'
