  description: Die Polizeipsychologin Johanna kommt in das thüringische Städtchen Dreileben, um ihre Kollegen vom LKA bei der Suche nach dem entflohenen Mörder Molesch zu unterstützen. Doch ihr Aufenthalt wird weniger von dem Fall geprägt als vom Aufeinandertreffen mit ihrer langjährigen Freundin Vera, bei der sie für die Dauer der Ermittlungen wohnt. Das Verhältnis der beiden Frauen ist noch immer sehr vertraut, wird aber zusehends belastet, als sich herausstellt, dass sie vor vielen Jahren in denselben Mann verliebt waren.
