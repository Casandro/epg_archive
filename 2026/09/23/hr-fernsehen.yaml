  description: David G. gibt sich als Mediziner aus. Er nimmt Kontakt zu jungen Frauen auf, die mit Kleinanzeigen auf Jobsuche sind und fragt sie, ob sie Teil einer wissenschaftlichen Studie werden wollen. Es soll um Schmerzempfindlichkeit bei Stromschlägen gehen. David G. verspricht eine Aufwandsentschädigung. Die Frauen sollen sich mit einer selbstgebauten Apparatur Elektroschocks verpassen. Über Skype gibt er ihnen Anweisungen, schaut zu, filmt sie. 5 Jahre lang. Dann fliegt er auf. Die Staatsanwaltschaft klagt ihn schließlich am Landgericht München II wegen versuchten Mordes in 88 Fällen an. Ende 2019 beginnt der Prozess gegen den 30-Jährigen.
