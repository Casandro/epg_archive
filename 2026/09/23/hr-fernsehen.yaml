  title: Meine Mutter traut sich was
  subtitle: Fernsehfilm Deutschland 2020
  description: Zu einer romantischen Traumhochzeit gehören mehr als zwei! Das erleben Diana Amft und Stephan Luca in der Komödie "Meine Mutter traut sich was" - denn ihre Mamas machen es ihnen nicht leicht. Während Margarita Broich gegen den Willen der Braut heimlich eine Riesenfeier plant, möchte Sabine von Maydell ihren Sohn in letzter Sekunde vor einem schweren Fehler bewahren. Bei so viel schwiegermütterlichem Zündstoff steht die Hochzeit unter keinem guten Stern. Auf dem Weg zum Traualter müssen die Liebenden im dritten Film der beliebten Reihe noch weitere Hürden nehmen.
