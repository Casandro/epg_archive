  description: Ein rätselhafter Mord an einer transsexuellen Prostituierten beschäftigt Marco Giallini alias Rocco Schiavone im dritten Film der neuen Staffel "Der Kommissar und die Alpen". In "Staub und Schatten" kommt der Ermittler einer perfekt ausgeführten Vertuschung auf die Spur, die er schonungslos aufdecken möchte - auch wenn er sich damit mächtige Feinde macht. Neben seinem jungen Assistentenduo Italo und Caterina - gespielt von Ernesto D'Argenio und Claudia Vismara - verstärkt Lorenza Indovina das Ermittlerteam der Questura in der Rolle der skurrilen Kollegin Michela Gambino.
