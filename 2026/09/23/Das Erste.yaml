  title: Hubert ohne Staller (154)
  subtitle: Harte Landung
  description: 'Eine hupende Alarmanlage führt Hubert und Girwidz in einen Campingpark am Starnberger See. Erst vermuten die beiden Einbruch oder Fehlalarm. Dort entdecken sie den Besitzer des Campingparks: tot. Laut Pathologin Dr. Fuchs handelt es sich bei dem Absturz um keinen klassischen Arbeitsunfall. Spuren an der Leiche deuten auf einen Zweikampf hin. Die Polizisten erfahren, dass das Gelände des Parks verkauft werden sollte. Alle Hinweise führen zum Bruder des Toten, der den Verkauf mit aller Macht verhindern wollte. Doch welche Rolle spielt der Käufer des Geländes, von dem der Tote ein zerrissenes Foto in der Tasche hatte?'
