    Für Kai und Knossi geht es in den Westen Mexikos: nach Guadalajara! Hier sind sie zu einer echten Charro-Hochzeit eingeladen! Neben dem Versuch, auf dem Weg zur Kirche nicht vom Pferd zu fallen, der Suche nach dem passenden Outfit und der Frage, was ein Lasso mit einer mexikanischen Hochzeitstradition zu tun hat, erleben die beiden Freunde eine ganz besondere Liebesgeschichte! Arisbé und der 13 Jahre jüngere Daniel haben sich trotz aller Widerstände, die es gegen ihre Beziehung gibt, entschieden zu heiraten, und fiebern nun ihrem großen Tag entgegen!
