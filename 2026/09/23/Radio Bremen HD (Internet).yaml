  title: Tierärztin Dr. Mertens (85)
  subtitle: Alles auf Anfang
  description: "Susanne Mertens hat sich nach Christophs Tod vor fast einem Jahr beruflich neu aufgestellt. Sie arbeitet jetzt als mobile Tierärztin. Das bringt allerdings diverse Schwierigkeiten mit sich: stockende Zahlungen der Kunden, finanzielle Außenstände, Ärger mit der Bank. Es ist der tägliche Kampf einer Freiberuflerin. \nIhre Tochter Luisa wohnt immer noch zu Hause und hat mittlerweile eine Freundin: Isabel. Die beiden planen zusammenzuziehen, wovon Susanne erst mal besser nichts wissen soll."
- eventId: 1160570
  start: 2026-09-23T20:50:00Z
  stop: 2026-09-23T21:35:00Z
  title: Tierärztin Dr. Mertens (86)
  subtitle: Das schöne Haus
  description: Susanne Mertens hat zwar die erhoffte Festanstellung nicht bekommen, wird aber in Zukunft für den Zoo als freie Tierärztin arbeiten. Die Familie hofft mit ihr, dass die vielen anfallenden Kosten, auch für das renovierungsbedürftige Wochenendhaus, zu bewältigen sind. Susanne muss endlich ihre Außenstände einfordern, denn die Bank drängt. Als sie von Hof zu Hof fährt, um offene Rechnungen anzumahnen, trifft sie auf Mike Redmann, den Betreiber einer Alpaka-Farm. Die beiden sind sich sofort sympathisch - nicht mehr, aber auch nicht weniger.
