  title: a.tv Gesundheit (Wh.)
  subtitle: Konservative Therapie der Lendenwirbelsäule
  description: Bei Schmerzen im unteren Rücken und Lendenwirbelbereich muss nicht immer gleich an eine OP gedacht werden. Konservative Behandlungsmethoden wie Physiotherapie oder Schmerzmittel sind meist die erste Wahl. Und in den vielen Fällen können die Beschwerden damit für auch gelindert werden. Welche konservativen Behandlungsmethoden es gibt und bei welchen Erkrankungen im Lendenwirbelbereich diese sinnvoll sind, erklärt der Wirbelsäulenspezialist Dr. Matthias Oertel
