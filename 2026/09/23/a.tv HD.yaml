  title: Heimatzeit
  subtitle: Wochenmarkt in Neusäß und Honig-Prinzessin aus Monheim
  description: 'Herbstzeit ist Erntezeit - und frische Lebensmittel aus der Region bekommt man in unseren Landkreisen auf zahlreichen Wochen- und Bauernmärkten. Einer davon findet immer samstags in Neusäß statt. Wir begleiten die Fieranten und befragen die Wochenmarkteinkäufer. Im Landkreis Donau-Ries gibt es außerdem eine neue Honig-Prinzessin, wir treffen sie in Monheim beim Lehrbienenstand. Sportlich wird es auch noch, und zwar in Krumbach: dort lassen wir uns vom 14-jährigen Nachwuchs-Klettertalent Benedikt in die Kunst des Kletterns einweihen. Und dann haben wir auch noch eine neue Folge von den Gartenfreunden im Programm. Mit Claudia Markert'
