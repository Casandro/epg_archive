  title: Ungewollt schwanger in Deutschland - Der Paragraf und ich
  description: Abtreibung ist noch immer ein gesellschaftliches Tabu. Der § 218 ist in Deutschland bis heute im Strafgesetz verankert. Während die Politik debattiert und das höchste Gericht urteilt, wehren sich die Frauen. Stimmen aus drei Generationen erzählen von dunklen Zeiten, Befreiung und Rückschlägen, von schwierigen Lebensentscheidungen im Schatten des Paragrafen.
