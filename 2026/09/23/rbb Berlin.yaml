  title: Zweite Chance für Marco A. - Vom Täter zum Helfer
  description: 'Marco kämpft, seit er denken kann. Zuerst mit Fäusten, jetzt mit Worten. Marco war Schwerverbrecher und saß in Haft. Nun hat er eine Ausbildung zum Life Coach gemacht und möchte anderen Ex-Häftlingen helfen, einen Weg zurück in die Gesellschaft zu finden. Er erlebt, wie schwer das ist. Aber er ist überzeugt: Jeder Mensch verdient eine zweite Chance.'
