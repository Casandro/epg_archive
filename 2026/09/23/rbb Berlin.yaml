  title: Panda, Gorilla & Co. (222)
  subtitle: Geschichten aus dem Zoo Berlin und dem Tierpark Berlin
  description: Dank intensiver Pflege haben sich die zwei kleinen Binturong-Kinder aus dem Alfred-Brehmhaus mittlerweile gut erholt. Aufgrund einer Gaumenentzündung konnten die beiden nicht bei ihrer Mutter trinken und sind deshalb lange Zeit untergewichtig gewesen. Sieben Wochen sind die Schleichkatzengeschwister jetzt alt. Täglich wird ihr Gewicht kontrolliert und über die weitere Zufütterung entschieden.
