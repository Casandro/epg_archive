  description: 'Vor gut einem Jahr passierte es: Die gesamte Erdmännchen-Gruppe im Frankfurter Zoo wurde verschüttet. Sie hatten wohl zu tief gebuddelt. Statiker kamen und entwarfen ein neues, buddelsicheres Gehege. Nun hat das Warten ein Ende: Die neuen Erdmännchen dürfen einziehen. Kurator Dr. Stefan Stadler kümmert sich höchstpersönlich um seine Schützlinge. Wie werden sie ihr neues Zuhause annehmen? Ganz andere Probleme haben die Mufflons im Opel-Zoo in Kronberg: Ihre Klauen benötigen einen Nachschnitt, und dafür müssen die Tiere erst mal eingefangen werden.'
