  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Auf der Suche nach dem Logos
  description: |-
    Anna Diouf im Gespräch mit Xaver Spörl

    Ein junger Mann macht sich Gedanken über den Sinn des Lebens. Ist die Existenz eines höheren Wesens vernunftgemäß? Und falls ja, wie ist dieses Wesen beschaffen? Kann Gott Mensch geworden sein? Wohl eher nicht, denkt Xaver Spörl. Doch die Begegnung mit Focus-Missionaren auf seinem Campus in Passau setzt in ihm eine Bewegung in Gang, die ihn schließlich in die Einheit mit der Kirche führt.

    Auf der einen Seite die intellektuell unbestechliche Suche nach der Wahrheit, auf der anderen die echte Begegnung: Der Glaube braucht beides.
