  title: Generacija plus
  subtitle: Magazin
  description: 'Jesu li apostoli bili vrhunski odabrani superjunaci, duhovni atlete bez mane... ili sasvim obični ljudi koji se spotiču, boje, sumnjaju i griješe -- baš poput nas? U novoj epizodi Generacije Plus otkrivamo tko su zapravo apostoli: ribari, carinik, skeptik, dva brata ,,sinovi groma, jedan koji će iznevjeriti... ali svi poslani da mijenjaju svijet. Zašto ih zovemo temeljem Crkve? Tko su njihovi nasljednici danas? Što ih čini apostolima, a ne samo učenicima? I što mi možemo naučiti iz njihove vjernosti, ali i njihovih padova?'
