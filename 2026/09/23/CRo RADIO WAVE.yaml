  start: 2026-09-23T19:00:00Z
  stop: 2026-09-23T20:15:00Z
  title: 'Ztělesnění 2: Gym Bro'
  description: Jaký je ideál mužského těla na sociálních sítích? A co snaha o jeho dosažení mladé kluky stojí? Druhá epizoda série Ztělesnění je o trendu Gym bros. Uslyšíte v ní několik mužů, kterým touha po velkých svalech zásadně zasáhla do života. Na epizodu navazuje doprovodný rozhovor s psychiatričkou Hanou Papežovou, ve kterém mluvíme o bigorexii, posedlosti svaly a cvičením a užívání anabolik.
