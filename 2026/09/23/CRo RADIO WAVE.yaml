  title: Slejvák
  description: Je už "překotkováno"? Odstartovali noví Zrádci a máme z nich překvapivě rozporuplné dojmy. Míra se ve studiu opět sešel s Aničkou a společně dohnali resty z posledních týdnů. Kromě Zrádců dojde taky na úspěšné debutové album Adély nebo start nových sérií Love Islandu nebo Ano šéfe! Má cenu je sledovat? Dozvíte se v novém Slejváku! Moderují Miroslav Harant a Ana Vavanová.
