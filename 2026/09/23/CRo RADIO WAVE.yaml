  start: 2026-09-23T18:00:00Z
  stop: 2026-09-23T19:00:00Z
  title: Flám
  description: 'FLÁM zve LDSB! Loudsilentboys (LDSB) je hudební label, platforma pro pořádání akcí a především komunita se sídlem v Praze. Tvoří ji devítičlenný tým mladých umělců, kteří se prostřednictvím svého labelu a pořádaných akcí zaměřují na propojování různých hudebních žánrů. Label se zaměřuje především na rapová alba, zatímco jeho eventová činnost se dělí na dvě hlavní linie: živá vystoupení zaměřená na rap a DJ sety zaměřené na elektronickou hudbu, především UK garage, breaks a dubs.'
