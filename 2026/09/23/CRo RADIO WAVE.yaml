  title: Houpačky
  description: Gynekoložka Ester Hladíková navštíví Houpačky v dvojepizodě. Začneme gynekologickým zdravím ženy, ať už má, či nemá děti. Na co všechno by se váš gynekolog měl ptát a jaké otázky by mu naopak měly pacientky klást? Jak vypadá zdravá menstruace a proč není v pořádku, když ženu každý měsíc paralyzuje její PMS? Dozvíte se v Houpačkách ve středu odpoledne. Moderuje Michaela Sladká.
