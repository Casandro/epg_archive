  description: 'Moskau ist ein Sehnsuchtsort für alle, die von einer kommunistischen Gesellschaft träumen. Intellektuelle und Freiheitskämpfer:innen aus ganz Europa pilgern hierher. Doch wird das Gesellschaftsexperiment vor allem mit Gewalt vorangetrieben. Deutschlands Wirtschaft liegt am Boden, der Staat ist pleite. Frankreich besetzt 1923 wegen ausbleibender Reparationszahlungen das Ruhrgebiet. Um den Verpflichtungen nachzukommen, wirft Deutschland die Notenpressen an: Eine Hyperinflation ist die Folge.'
