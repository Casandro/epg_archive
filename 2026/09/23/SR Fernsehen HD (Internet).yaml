- eventId: 1143201
  start: 2026-09-23T04:40:00Z
  stop: 2026-09-23T05:10:00Z
  title: Wir im Saarland - Service
  subtitle: 'Moderation: Celina Fries'
  description: |-
    Themen u.a.:
    * Rettungsdienste: In ganz Deutschland gibt es vor allem am Wochenende immer mehr Bagatelleinsätze, steigende Kosten und überfüllte Notaufnahmen. Wir gehen der Frage nach, ob es Alternativen gibt und wie diese aussehen könnten.
    * Digitales Bezahlen: Es ist mittlerweile kinderleicht - mit wenigen Klicks eine Rechnung bezahlen oder Freunden Geld überweisen. Besonders beliebt sind amerikanische Anbieter wie Visa oder Paypal. Kaum bekannt sind deutsche und europäische Alternativen. Wir zeigen, welche das sind und wie sie funktionieren.
- eventId: 1143506
  start: 2026-09-23T05:10:00Z
  stop: 2026-09-23T07:10:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
