  title: Wer weiß denn sowas? (1135)
  subtitle: 'Gäste: Marijke Amado und Mike Krüger'
  description: |-
    Show-Duell: Ohne Rudi Carrell gäbe es dieses Rateduell wahrscheinlich gar nicht ... In den 70er Jahren entdeckte der legendäre Showmaster auf einer Kreuzfahrt die damalige Reiseleiterin Marijke Amado. Sie wurde seine Assistentin in dem Showklassiker "Am laufenden Band" und moderierte von 1990 bis 1998 die "Mini Playback Show".
    Ihr Rategegner Mike Krüger gehörte an der Seite von Rudi Carrell von 1996 bis 2005 zur Stammbesetzung der Show "7 Tage, 7 Köpfe".
- eventId: 1152188
  start: 2026-09-23T13:10:00Z
  stop: 2026-09-23T14:00:00Z
  title: Hubert und Staller (58)
  subtitle: Fit in den Tod
  description: |-
    Weil Staller bei der Verfolgung eines Flüchtigen  an seine körperlichen Grenzen gerät, meldet er sich im Fitnessstudio Springer & Springer an. Kollege Hubert soll davon natürlich nichts erfahren, und so kommt Staller schnell in die Bredouille, als sich herausstellt, dass Mordopfer Dennis Westermann ausgerechnet in eben diesem Studio gearbeitet hat.
    Mia Sperling, die Freundin des Opfers, sagt aus, dass ihr Lebensgefährte von Problemen am Arbeitsplatz berichtet habe. Staller stößt bei einem seiner Besuche im Fitnessklub auf verdächtige Tütchen. Hat das Mordmotiv mit unerlaubten Dopingmachenschaften zu tun?
