  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Sobotný deň ("Tretie prikázanie Desatora pripomína posvätnosť soboty. Siedmy deň je Pánova svätá sobota, deň odpočinku. V tejto súvislosti Písmo pripomína stvorenie: Lebo za šesť dní Pán utvoril nebo a zem, more a všetko, čo je v nich, v siedmy deň však odpočíval. Preto Pán požehnal sobotný deň a zasvätil ho (Ex 20,11). " (KKC 2168, 2169); Nedeľný odpočinok ("Ako Boh v siedmy deň odpočíval od všetkých diel, aj ľudský život má svoj rytmus práce a odpočinku. Ustanovenie Pánovho dňa (nedele) prispieva k tomu, aby všetci mali dostatočný odpočinok a voľný čas, ktorý by im umožnil pestovať rodinný, kultúrny, spoločenský a náboženský život." (KKC 2184) (2018)'
