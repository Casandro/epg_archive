  title: Doma je doma
  subtitle: Popoludňajšie stretnutie sa "doma v obývačke".
  description: Harmónia hodnôt prináša pokoj do chaosu dní. Téma, ktorá mnohých trápi a je prameňom neistôt je práve narábanie s financiami. Preto sa s Ing. Zuzanou Viktorovou z OZ Biblia a financie o čosi hlbšie pozrieme na biblické princípy hospodárenia s peniazmi. Práve tie vnášajú hlbokú múdrosť a skutočnú slobodu do našich dní, pričom nám pomáhajú pretvárať materiálne bohatstvá na nástroj pokoja a zodpovedného správcovstva. Z racionálneho sveta čísiel a morálnych hodnôt sa prenesieme do sféry čistého umenia a vznešenosti, v ktorej ožijú kamenné múry starobylého chrámu. Tretia časť relácie totiž bude patriť Katedrálnemu organovému festivalu v Nitre, ktorý premení majestátne tóny kráľovského nástroja na neutíchajúcu modlitbu očisťujúcu nepokojnú ľudskú dušu. O dramaturgii festivalu, ale aj o duchovnom odkaze skladieb starej i modernej hudby nám porozpráva jeho zakladateľ a dramaturg, hlavný organista Nitrianskej diecézy doc. Mgr. art. Vladimír Kopec, ArtD., ktorý divákom priblíži, ako sa tóny dotýkajú neba a vlievajú živú dušu do historických priestorov chrámov. (2026)
  genre:
  - '32'
