  subtitle: Vier Frauen und ein Todesfall - Totalschaden
  description: Die Bürgermeisterwahl steht an in Dorf Ilm und Peppi Nothdurfter ist mehr als besorgt über das rege Interesse der Dorf Ilmer am neuen Kandidaten Wörrister. Doch dann erledigen sich seine Sorgen wie von Geisterhand, denn der Kandidat wird von seinem eigenen Auto überrollt und dass das kein Unfall gewesen sein kann, versteht sich von selbst. Doch wer könnte außer Bürgermeister Nothdurfter noch ein Motiv gehabt haben, den lästigen Konkurrenten aus dem Weg zu räumen? Es herrschen große Unruhe und Entsetzen im Dorf, vor allem weil auch Sabi schwer verletzt wurde und noch immer nicht aus dem Koma erwacht ist. Am Ende hat Dorf Ilm zwar keinen Mörder, dafür aber einen ganz neuen Bürgermeister, und damit hätte nun wirklich niemand gerechnet.
