  title: OnlineKirche mit Pastor Gert Hoinle - Glaube wird durch Liebe wirksam. Wie? | Galater 5
  subtitle: OnlineKirche mit Pastor Gert Hoinle - Glaube wird durch Liebe wirksam. Wie? | Galater 5
  description: 'Paulus sagt: In Christus Jesus hat weder Beschneidung noch Unbeschnittenheit irgendeine Kraft, sondern der durch Liebe wirksame Glaube. Glaube wird durch Liebe wirksam? Wer sowieso immer denkt, er habe zu wenig Glauben, der fühlt sich nun möglicherweise erst recht überfordert, wenn er liest, dass Glaube allein nicht reicht, sondern Liebe quasi als Anlasser auch noch nötig ist. Wird das wirklich immer komplizierter? Was meint Paulus genau? Pastor Gert öffnet die Bibel und schaut nach. Die Sache ist einfacher als gedacht.'
