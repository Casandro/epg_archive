  title: Schnell Ermittelt - Carlo Michalek
  subtitle: Schnell Ermittelt - Carlo Michalek
  description: Ein Fünfer in Mathe kann wehtun, ein Zirkel in der Stirn aber noch mehr. Der Mathematiklehrer Carlo Michalek wird erschossen und mit dem Zeichengerät im Kopf aufgefunden. Angelika und Franitschek entdecken, dass das Mordopfer beschuldigt wurde, eine Schülerin vergewaltigt zu haben, doch der Fall verlief im Sand. Außerdem erregt ein sicherheitsfanatischer Oberst und Nachbar des Opfers die Aufmerksamkeit der Ermittler. Er hat nämlich einige, wie er sagt fremdländische Nachhilfeschüler des Opfers im Visier. Privat ist Angelika gefordert, denn Jan ist endlich bereit sein Wissen über den Mord an Nico Schnabel preiszugeben.
