  start: 2026-09-23T15:00:00Z
  stop: 2026-09-23T15:10:00Z
  title: Süd Journal vom 22.09.2026 (Wh.)
  subtitle: Zahl der Obdachlosen in Rosenheim steigt +++ Verkehrsminister beim Tag der Schiene in der Lokwelt Freilassing +++ Einigung auf neuen Tankrabatt und Spritpreisdeckel
  description: 'In Rosenheim sind über 600 Menschen wohnungslos, die Diakonie-Unterkünfte sind fast ständig voll; Ursachen reichen von Jobverlust, Krankheit und Trennung bis Sucht, während Streetwork, geförderter Wohnraum und mehr Schlafplätze Abhilfe schaffen sollen. +++ Der bundesweite Tag der Schiene startete in Freilassing, wo die Lokwelt ihr 20-jähriges Jubiläum feiert: Verkehrsminister Christian Bernreiter drehte auf der über 100 Jahre alten Drehscheibe eine Ehrenrunde, lobte Bahnbeschäftigte und forderte mehr Geld für die Modernisierung. +++ Die Bundesregierung will Sprit ab 1. Oktober durch 14 Cent weniger Energiesteuer plus MwSt-Effekt bis zu 17 Cent je Liter verbilligen und ab Januar einen Preisdeckel prüfen, doch Kritiker nennen die 2,5-Milliarden-Euro-Entlastung mit Länderanteil Gießkannenpolitik.'
- eventId: 847078
  start: 2026-09-23T15:10:00Z
  stop: 2026-09-23T15:20:00Z
  title: Süd Journal vom 22.09.2026 (Wh.)
  subtitle: Alkoholverbot am Salzstadel  +++ Haupt- und Finanzausschuss berät über Straßenbauprojekte +++ Wasserwacht und BRK bereiten sich auf Überschwemmungen vor  +++ 70 Jahre Christliches Sozialwerk +++ Neue Kinder und Jugendpsych..
  description: 'Am Salzstadel in Rosenheim steht wegen Anwohnerbeschwerden über Lärm, Schlägereien und weitere Vorfälle sowie Berichten der Streetworker über problematischen Alkoholkonsum ein Alkoholverbot zur Debatte, über das der Haupt- und Finanzausschuss heute berät und das ab 1. Oktober gelten könnte. +++ Der Haupt- und Finanzausschuss Rosenheim berät heute über Straßenbauvorhaben, darunter mehr Geld für die Parkplatzsanierung am Friedhof im Kapuzinerweg und den Ausbau von Geh- und Radwegen an der Kufsteiner Straße sowie eine mögliche Zweitwohnsitzsteuer. +++ Am Floriansee probten Wasserwacht Rosenheim und BRK-Bereitschaften mit rund 80 Ehrenamtlichen den Ernstfall, darunter Bus-Evakuierung, Verletztenversorgung und Inselrettung; die Bilanz ist positiv, für künftige, häufiger drohende Überflutungen sieht man sich gut gerüstet. +++ In Flintsbach feierte das Christliche Sozialwerk sein 70-jähriges Bestehen: Aus der Hauskrankenpflege von 1956 wurde ein breites Hilfsangebot, das beim Fest am Mehrgenerationenhaus mit Musik, Schmankerln und Dank an Helfer und über 1.000 Mitglieder gewürdigt wurde. +++ Seit März behandelt die CJD-Klinik Buchenhöhe bei Berchtesgaden auch Kinder, Jugendliche und junge Erwachsene mit psychosomatischen Erkrankungen: Eine neu geschaffene Abteilung wurde nun offiziell eröffnet und schließt mit 18 Planbetten eine Versorgungslücke in der Region. +++ Bundesliga-Auftakt für den SV DJK Kolbermoor - und gleich ein Kracher gegen den amtierenden Deutschen Meister. Der ttc berlin eastside kam ohne seine beiden Topspielerinnen nach Kolbermoor. Vor 150 Zuschauern in der B2X-Arena entwickelte sich eine umkämpfte Partie über mehr als drei Stunden.'
- eventId: 847079
  start: 2026-09-23T15:20:00Z
  stop: 2026-09-23T15:30:00Z
  title: Süd Journal vom 22.09.2026 (Wh.)
  subtitle: INN Grenzen II - Neue Ausstellung in Burghausen +++ Wetter für das Sendegebiet
  description: Die Ausstellung INN Grenzen II im Liebenweinturm der Burghauser Burg fragt, ob Grenzen trennen oder verbinden, zeigt Werke der Künstlergruppe DIE BURG von beiden Innseiten und lädt dazu ein, Kunst während der Laufzeit neu zu denken. +++ Ein Höhentief bringt am Donnerstag kräftigen Wind mit Sturmböen an der Nordsee sowie Schauer und Gewitter, bevor sich zum Freitag hin aus Südwesten bereits ein Spätsommerhoch ankündigt. Die Temperaturen bewegen sich meist zwischen 16 und 25 Grad.
