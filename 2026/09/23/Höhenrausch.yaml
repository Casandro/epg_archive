  title: The Wingman Meets - Red Bull Art Of Motion
  subtitle: The Wingman Meets - Red Bull Art Of Motion
  description: Der charismatische Moderator Ed Leigh führt die Zuschauer auf eine Entdeckungsfahrt, bei der er Aufschluss über die Geschichte sowie die Entwicklung jeder Disziplin gibt -die sich in einem unglaublichen, aktuellen Event gipfelt. Unterwegs reist Ed in die Schlüssel-Länder und zu den wichtigsten Sehenswürdigkeiten, wo er Leute kennenlernen wird, die beim Wachstum und in der Entwicklung jedes Events eine zentrale Rolle gespielt haben. Außerdem wird er gemeinsam mit den besten Athleten jeder Disziplin trainieren. Er wird alles anwenden, was er auf seiner Reise lernt, um sich selbst - mit einem gewissen Können - in der Sportart zu versuchen. Kann er den Mut aufbringen, die Technik zu lernen und sein ganzes Wissen anwenden, das er sich angeeignet hat, um die Aufgabe erfolgreich auszuführen? In 48-minütigen Sendungen stellt jede Episode ein Event und dessen Hintergründe vor und erklärt diese einem neuen Publikum durch atemberaubende Bilder und eine fesselnde Geschichte, die den Kern des Wesens jedes Sports einfängt, wie das Red Bull Air Race, Red Bull Cliff-Diving oder Red Bull X-Fighters. US 2010
