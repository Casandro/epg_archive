  title: Heimatleuchten - Flussgeschichten - Entlang der Traisen
  subtitle: Heimatleuchten - Flussgeschichten - Entlang der Traisen
  description: Die Traisen ist einer der größten Flüsse Niederösterreichs. Bis zu ihrer Mündung in die Donau legt sie rund 80 Kilometer zurück, vorbei an Aulandschaften, Dörfern und Städten, die dem Fluss mitunter auch ihrem Namen verdanken. Der Film begleitet die Traisen von ihren Quellen in den Kalkalpen bis hin zur Donau. Auf dieser Reise treffen wir Menschen, die ihre Lebensgrundlage dem Fluss verdanken und Menschen, die sich in ihrer Nähe ihren Lebenstraum erfüllt haben. Menschen, die so unterschiedlich sind, wie die Landschaft, durch die die Traisen fließt. AT 2023
