  title: Bergwelten - Tirols Dreiländereck - Kaunertal-Nauders-Tiroler Oberland
  subtitle: Bergwelten - Tirols Dreiländereck - Kaunertal-Nauders-Tiroler Oberland
  description: 'Bergwelten: "Im Westen Tirols erhebt sich eine atemberaubende Berglandschaft. Gekennzeichnet von den schroffen Felsen des Kaunergrats bis hin zur hochalpinen Gletscherzone. "Der Blick von den Gipfeln Richtung Süden schweift bis zum Südtiroler Reschensee. Am Oberlauf des Inns führen seit jeher Handelswege durch die Grenzregion. Bis hinauf ins ewige Eis reicht dieses alpine Paradies für Naturliebhaber, aber auch Abenteurer.  AT 2020'
