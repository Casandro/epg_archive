  title: Ultimate Rush - Ein Reiter in der Geisterstadt
  subtitle: Ultimate Rush - Ein Reiter in der Geisterstadt
  description: "Epecuén in Argentinien war wegen seines Salzsees früher ein beliebtes Urlaubsziel. Der Ort florierte, bis er aufgrund verheerender Regenfälle unter einer zehn Meter hohen Salzwasserflut begraben wurde. Die Stadt konnte rechtzeitig evakuiert werden, die Menschen kehrten aber niemals zurück. \n\nNun reist der schottische Trial- und Mountainbike-Profi Danny MacAskill an diesen vor Jahren verlassenen Ort. Auf seiner ständigen Suche nach neuen Schauplätzen für seine atemberaubenden Stunts hatte Danny Epecuén im Internet entdeckt. Als er zum ersten Mal dorthin reiste, erkannte er sofort, dass es einer der faszinierendsten Orte war, die er je gesehen hatte. Er wollte das Terrain mit seinem Bike erkunden und dabei die Landschaft mit der Kamera einfangen.\n\nVon all seinen Projekten war Epecuén jedoch auch das gefährlichste. Zwischen dem Beton und den Stahlteilen musste Danny höllisch aufpassen. Denn wenn er sich verletzt hätte, wäre der Dreh sofort beendet gewesen. AT 2017"
  ageRating: 12
- eventId: 1065149
  start: 2026-09-23T09:30:00Z
  stop: 2026-09-23T09:54:00Z
  title: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  subtitle: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  description: |-
    Mit Geschwindigkeiten von über 100 km/h gehört Downhill Skateboarding zu den schnellsten und gefährlichsten Rennsportarten. Die Jagd nach Rekorden begann in den 70er Jahren mit den ersten Downhill-Rennen im kalifornischen Signal Hill. 40 Jahre später ist der Wettbewerb globaler, aber nicht weniger unerbittlich.



    Der kalifornische Küstenort Encinitas ist mit seinen glatten Straßen ein beliebter Treffpunkt für Skateboarder. Von hier aus wird der ehemalige Downhill-Weltmeister Erik Lundberg seine Mission in Angriff nehmen: einen neuen Geschwindigkeitsrekord im Downhill Skateboarding aufstellen. Die Abfahrt, die auf ihn wartet, liegt im kanadischen Quebec, in Les Eboulements. Durch den glatten Asphalt und der 800 Meter langen Gerade ist es die perfekte Strecke. 2012 hat Mischo Erban dort mit 130,08 km/h den aktuellen Geschwindigkeits-Weltrekord aufgestellt. AT 2016
  ageRating: 12
