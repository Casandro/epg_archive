  title: Ruhe nach dem Sturm
  subtitle: Ruhe nach dem Sturm
  description: 'Die Ausrichtung auf Konsum ist in unserer Gesellschaft zum neuen Standard geworden. Die Spitze dieses irrationalen Konsummonsters ist die Zeit vor Weihnachten. Die Zeit, in der wir unseren Geliebten mit dem Wert der Geschenke zeigen, wie gern wir sie doch haben. Das ist der Punkt, an dem das Freeride Abenteuer beginnt: Um auf Abstand mit dem Konsumtaumel zu kommen, starten die Freerider ihren Simple Life Roadtrip mit nichts Weiterem im Kopf, außer jeden Tag aufs Neue, den schönsten Skitag der Saison zu genießen. In diesem Time-Out vom Leben bekommt Zeit einen anderen Stellenwert, 9 Uhr ist jetzt einfach hell und 19Uhr einfach dunkel, nichts weiter.  DE 2019'
