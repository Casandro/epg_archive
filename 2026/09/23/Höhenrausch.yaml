  description: 'Nachdem er den Helmcken-Wasserfall in British Columbia geklettert ist und auch die einzigartigen Eisfelder des Mount Kilimanjaro bezwungen hat, begibt sich der weltweit bekannte Eiskletterer Will Gadd auf eine neue Expedition: Er will der Schwerkraft ein Schnippchen schlagen und einen der beeindruckendsten Wasserfälle der Welt erklettern, die Niagarafälle. Denn zur Wintersonnenwende frieren sogar die Niagarafälle ein. / Nach der Bezwingung der Helmcken Falls (British Columbia) und des Aufstiegs der einzigartigen Eisfelder auf dem Kilimandscharo, will der international bekannteste Eiskletterer Will Gadd nun der Schwerkraft trotzen und einen der weltweit beeindruckendsten Wasserfälle, den Niagara Wasserfall, unter gefrorenen Bedingungen bezwingen. AT 2015'
