  description: 'Einmal quer um die Welt auf fünf Kontinenten, in über 30 Orten, mit fünf ganz unterschiedlichen Charakteren. Auch in der dritten Staffel der Real-Life-Doku "Wild Ones - Junge Helden" geben wieder fünf Ausnahmeathleten des Action-Sports einen hautnahen Einblick in ihr außergewöhnliches Leben. Sasha DiGiulian (Climbing), Pete Henke (Slopestyle MTB), Philip Köster (Windsurfing), Billy Morgan (Snowboarding) und Ken Roczen (Motocross) wirken auf den ersten Blick wie ganz normale junge Menschen, allerdings teilen sie eine gefährliche und außergewöhnliche Leidenschaft: Sie sind Extremsportler und stehen in den Weltranglisten ganz oben. DE 2013'
