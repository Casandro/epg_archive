  title: Objectif Monde
  description: "Espagne : malgré la croissance, un gouvernement en pleine tempête ! Avec son plan de régularisation d'un million de migrants, l'Espagne de Pedro Sánchez fait figure d'exception. Sa croissance de 2.6 pour cent en dépit d'une inflation de 3.2 pour cent confirme sa place d'économie la plus dynamique de la zone euro. Mais après 3 années sans avoir voté de budget, faute de majorité au Parlement ; en raison des scandales et des affaires judiciaires qui éclaboussent son épouse et le parti socialiste, le Premier ministre espagnol se retrouve en grande difficulté.  La droite, le parti d'extrême droite Vox mais aussi plusieurs partis de gauche réclament des élections anticipées. Fort à l'étranger, affaibli en Espagne, Pedro Sánchez qui a fêté ses huit ans à la Moncloa va-t-il pourvoir rester au pouvoir ? \n (France-2026)"
