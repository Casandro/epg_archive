  title: Temps présent
  description: 'Sans toit ni droits Ce sont des hommes et des femmes que l''on ne voit pas et qui pourtant vivent dans nos rues, particulièrement vulnérables aux températures extrêmes, grosses chaleurs ou grands froids : les sans-abris. Une population composée d''égarés de la vie, de sans-papiers, de marginaux abîmés par des épreuves ou la maladie mentale. Ces sans-abris qui vivent dans une grande précarité recourent tant bien que mal aux dispositifs mis en place par les services d''urgence sociale et d''hébergement. Mais la précarité augmente plus vite que les infrastructures, surtout depuis la crise du COVID. Le réseau d''hébergement est saturé et chaque jour, des centaines de SDF dorment dans la rue. Offrir un toit, un repas, des moments de répit et d''écoute, c''est le défi que relèvent jour et nuit les équipes disparates de l''aide d''urgence. Travailleurs sociaux et bénévoles luttent pour préserver leur dignité humaine et tenter de leur faire retrouver le chemin de l''insertion et faire ...'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
