  title: MareTV
  subtitle: Lanzarote. Feuer, Lava, Licht
  description: 'Die Energie und die Magie sind überall spürbar: Lanzarote präsentiert sich sowohl rau und karg, aber strotzt vor Charakter. Rot, braun, schwarz. Lava, die erstarrt ihren Weg ins Meer fand, hat der nördlichsten der acht bewohnten Kanarischen Inseln bei Vulkanausbrüchen vor fast 300 Jahren ihr gemeinsames und unverwechselbares Gesicht verliehen. Die Bewohner haben sich auf die bestmögliche Weise mit der bizarren Landschaft und den rauen Gewässern des Atlantiks arrangiert. Simon Turner verwendet einen Rechen, um riesige Muster auf die verlassenen Strände zu schaffen: faszinierende Kunstwerke, die nur bis zur nächsten Flut überleben. Seit mehr als 50 Jahren baut Antonio Rodriguez Alemenara sogenannte "Jolateros", bunt bemalte kleine Boote, die er geschickt aus alten Ölfässern formt, ideal geeignet für spontane Wohlfühl-Regatten. Mit einem hochsensiblen Unterwassermikrofon verfolgen Yvette, Mar und Vidal Meeressäugetiere und kartieren dabei ihre Wege durch das Meer.'
