  title: MareTV
  subtitle: Die Vesterålen - Norwegens fantastische Inseln
  description: 'Die Vesterålen werden oft als "die kleinen Schwestern der Lofoten" bezeichnet, aber sie sind tatsächlich viel größer als ihre legendären Nachbarinseln, geräumiger, attraktiver und ebenso landschaftlich spektakulär: mit imposanten Bergen, fast karibisch weißen Stränden und wilder Natur. Mitternachtssonne im Sommer, Nordlichter im Winter. Die Inselwelt ist ein Paradies für Wale, Seeadler und Papageientaucher. Der Vesterålen-Archipel liegt 300 Kilometer nördlich des Polarkreises. Die "Hurtigruten", Norwegens traditionelle Postschifflinie, hält hier nicht nur, sondern die Reederei wurde sogar auf den Vesterålen gegründet. Michel Jürgensen kam vor mehr als 20 Jahren hierher. Er macht zweimal täglich seine Runden mit der Hochgeschwindigkeitsfähre und transportiert Passagiere und Waren aller Art. Ellen Marie Hansteensen, die auf der einsamen Leuchtturminsel Litløya lebt, ist ebenfalls auf diesen Service angewiesen.'
  genre:
  - '145'
  widescreen: true
  hd: true
