  stop: 2026-09-23T20:00:00Z
  title: ARD Konzert
  description: |-
    Christian Tetzlaff und Matthias Kirschnereit spielen Violinsonaten in Kempen
    Violinsonaten von Janácek, Dvorák und Brahms

    Sie sind nicht nur Meister ihres Fachs, sondern auch gut befreundet. Violinist Christian Tetzlaff und Pianist Matthias Kirschnereit haben sich in der Paterskirche in Kempen für ein besonderes Kammerkonzert getroffen.

    Um Freundschaft geht es auch im ersten Stück auf dem Programm. Albert Dietrich, Robert Schumann und Johannes Brahms komponierten die F.A.E.-Sonate "in Erwartung der Ankunft des verehrten und geliebten Freundes Joseph Joachim". In Erwartung der russischen Truppen schrieb der slawische Patriot Leos Janácek seine Sonate. Sein tschechischer Landsmann Antonín Dvorák widmete seine Sonatine seinen Kindern und verarbeitete darin Elemente amerikanischer Musikkulturen. Ungarisch beeinflusst ist Brahms' Violinsonate Nr. 3, in der er dem Klavier einen sehr prominenten Part einräumt.

    Aufnahme vom 3. Juni 2026 in der Paterskirche, Kempen

    Christian Tetzlaff, Violine
    Matthias Kirschnereit, Klavier

    Johannes Brahms
    Scherzo aus der "F.A.E.-Sonate"

    Leos Janácek
    Sonate

    Antonín Dvorák
    Sonatine G-Dur, op. 100

    Johannes Brahms
    Sonate Nr. 3 d-Moll, op. 108
