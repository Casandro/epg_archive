  title: Tagesschau in Einfacher Sprache
  description: |-
    Etwa 17 Millionen Erwachsene in Deutschland haben Probleme damit, komplexe Texte zu verstehen. Damit auch sie sich über aktuelle Themen informieren können, strahlt die tagesschau ab sofort Fernsehnachrichten in Einfacher Sprache aus.
    Vertrauenswürdige tagesaktuelle Nachrichten für alle - die sind nicht nur wichtig, um sich informieren zu können - sondern auch, um am gesellschaftlichen Diskurs teilzuhaben. Doch die klassischen Nachrichten sind nicht immer für alle Menschen verständlich. Deshalb gibt es die tagesschau jetzt auch in Einfacher Sprache.
