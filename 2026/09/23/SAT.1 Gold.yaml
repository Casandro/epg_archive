  title: Dr. Quinn - Ärztin aus Leidenschaft
  subtitle: |-
    In tödlicher Gefahr (1)
    Western, USA 1993
    Altersfreigabe: ab 12
  description: |-
    Dr. Quinn bringt sich in größte Gefahr: Als sie und Sully im Reservat vorbeischauen, beobachten sie, wie zwei Soldaten von abtrünnigen Indianern umgebracht werden. Mike verspricht Sully, kein Wort darüber zu verlieren und lügt General Custer an, als er sie zu dem Vorfall befragt. Doch Custer findet heraus, dass Mike ihm etwas verschweigt und bringt sie dazu, die Wahrheit zu sagen. Das finden die abtrünnigen Indianer heraus und entführen sie.

