  title: Blue Bloods - Crime Scene New York
  subtitle: |-
    Die Lehrstunde
    Krimi, USA 2022
    Altersfreigabe: ab 12
  description: |-
    Frank entscheidet sich, Erin nicht öffentlich bei ihrer Kandidatur zu unterstützen, was diese verärgert. Schon bald merkt sie aber, dass ihr Vater ihr damit im Hinblick auf ihre Gewinnchancen einen Gefallen tut. Danny und Baez werden zu einer Blutlache in einem Hotelzimmer gerufen und folgen der Spur eines bekannten Schlafspezialisten. Sie finden heraus, dass dieser sich heimlich mit Prostituierten getroffen hat, was dem Täter missfiel ...

