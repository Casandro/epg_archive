  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\n?Witchtok?: Erfolg und Gefahren von Internet-Hexen \nBei TikTok, Instagram und Co. bieten zahlreiche selbsternannte Hexen ihre Dienste an und erreichen damit tausende Menschen. Warum manche Internet-Hexen so erfolgreich sind und wo mögliche Gefahren liegen, erklärt der evangelische Theologe Fabian Maysenhölder im Live-Interview. \n\n Yoga-Serie Teil 3: Worum geht es in Mantras?\nIn indischen Religionen werden Mantras rezitiert oder gesungen, heilige Silben oder Formeln. Ihnen wird eine besondere Wirkung nachgesagt. Auch im Yoga können Mantras eine zentrale Rolle spielen. \n\nBesuch in der Kirche, die den Jazzmusiker John Coltrane als Heiligen verehrt\nDie Jazz-Legende John Coltrane wäre heute 100 Jahre alt geworden. Nach seinem Tod begann in den 1960er Jahren eine Glaubensgemeinschaft in San Francisco, ihn als ?menschgewordenen Gott? zu verehren. In der ?St. John Coltrane African Orthodox Church? werden Coltranes Musik und seine Liedtexte als Gebete in die Liturgie integriert. \n\nAm Mikrofon: Christian Röther"
