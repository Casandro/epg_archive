  title: 'Sportfreunde Stiller auf Geburtstagstour: "30 wunderbaren Jahren"'
  description: '30 Jahre ist es her: 1996 fanden sie sich erstmals zusammen und kamen mit dem Titel "Wunderbaren Jahren" aus dem Proberaum raus, ein "schnoddriges Manifest unseres adoleszenten Daseins", sagt Drummer Flo. Peter Brugger (Gesang und Gitarre), Rüdiger Linhof (Bass) und Florian Weber (Schlagzeug) sind Sportfreunde Stiller. Ihr Name setzt sich aus ihrer Begeisterung für Leibesertüchtigung und dem Namen ihres Bezirksligatrainers Hans Stiller (SV Germering) zusammen. Ihr deutschsprachiger Spaß-Indierock wartet mit eingängigen Refrains auf, daher sind ihre ausverkauften Gigs stets vom gemeinsamen Feiern und lautstarken Mitsingen geprägt.'
