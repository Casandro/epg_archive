  title: Sportfreunde Stiller - Mit dem Herz in der Hand
  subtitle: Deutschland 2026
  description: |-
    "Ein Kompliment", "Ich, Roque" oder "Applaus, Applaus" - ihre Songs gehören zum allgemeinen Liedgut und zum Soundtrack für das Lebensgefühl einer ganzen Generation. Die "Sportfreunde Stiller" sind damit eine der prägendsten deutschsprachigen Bands der letzten Jahrzehnte geworden. Nach 30 Jahren voller Erfolge, dem Beinahe-Aus und dem ewigen Ringen um Kreativität stehen sie jetzt an einem Wendepunkt. Zum ersten Mal ohne große Plattenfirma produzieren sie ihr nächstes Album selbst.
    Der Film begleitet die "Sportfreunde" Peter Brugger, Florian "Flo" Weber und Rüdiger "Rüde" Linhof bei dem Wagnis dieses leidenschaftlichen Neustarts.
