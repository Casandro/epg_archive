  title: 'Das Rennen um Olympia: Münchens Traum von den Spielen'
  description: |-
    Der Film beleuchtet, wie München Olympische Spiele der Zukunft organisieren möchte und welchen Nutzen Menschen in München, Bayern und ganz Deutschland davon haben könnten. Dabei fußt das Münchner Konzept auf dem olympischen Erbe von München 1972. Der Olympiapark ist wieder das Zentrum und Olympia könnte nach über 60 Jahren in einen bis heute nachgenutzten Olympiapark zurückkehren.
    An der TU München arbeiten Fachleute an Konzepten für die "Stadt der Zukunft", bei deren Umsetzung Olympische Spiele eine wichtige Rolle spielen könnten. Die Doku thematisiert neben Chancen und Potenzialen auch Zweifel und Risiken.
