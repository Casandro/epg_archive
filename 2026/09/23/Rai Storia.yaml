  title: Passato e presente Hugo Pratt, la letter
  subtitle: 'Passato e presente Hugo Pratt, la letteratura disegnata - Avventuriero, narratore, visionario: Hugo Pratt ha trasformato il fumetto in letteratura, mescolando storia e immaginazione come pochi altri. Con C'
  description: |-
    orto Maltese, marinaio ironico e solitario, senza patria e senza pace, Pratt ha dato vita ad un eroe colto e malinconico, libero e inquieto che attraversa il 900 inseguendo orizzonti, misteri e libertà, passando accanto a guerre, rivoluzioni, imperi in declino e personaggi reali o leggendari. Fedele solo al mare e a sè stesso, fa dell'avventura una forma del destino. I disegni di Pratt dal tratto essenziale e le sue storie visionarie ha restituito una sorta di atlante dell'anima del 900. Ma chi era davvero l'uomo dietro Corto Maltese? In studio con paolo Mieli, il professor Mauro Canali. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

    Ospite in studio il prof. Mauro Canali Con la partecipazione di Matteo Marroni Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
