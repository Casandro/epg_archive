  title: Mein Körper. Meine Persönlichkeit
  subtitle: Kann ich mich verändern?
  description: 'Einmal so, immer so? Kann ich eine Charaktereigenschaft, die nervt und stört, ändern? Vanessa will endlich gelassener leben und ihre Unsicherheit loswerden. Jörg muss nach einem Schlaganfall mit einem neuen "Ich" klarkommen. Und auch die Persönlichkeiten der eineiigen Zwillinge Julia und Nina werden auf die Probe gestellt: erstmals gehen sie getrennte Wege. Was macht uns wirklich aus - und wie viel Veränderung ist möglich? Dabei schauen wir auf das OCEAN-Modell - die fünf zentralen Persönlichkeitsmerkmale, aus denen sich unser Wesen zusammensetzt.'
