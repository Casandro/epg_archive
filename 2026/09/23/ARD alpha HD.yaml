  title: Wissen vor acht - Erde
  subtitle: Wie verhindern wir den Flussinfarkt?
  description: 'Wie ein Fisch im Wasser - so möchte man sich inzwischen nicht mehr fühlen, wenn man an die deutschen Flüsse denkt. Denn nur rund acht Prozent von ihnen gelten als gesund. Das hat verschiedene Gründe: Nitrat und Pestizide aus der Landwirtschaft, Salz aus der Industrie, Chemikalien und Mikroplastik aus unseren Abwässern gelangen über verschiedene Wege in unsere Flüsse. Droht uns bald der Flussinfarkt? Mehr dazu bei "Wissen vor acht - Erde".'
