  title: Länder - Menschen - Abenteuer
  subtitle: Im Herzen Balis - Tempel, Tropen, Traditionen
  description: "Bali ist bekannt für Traumstrände, doch das Herz der indonesischen Insel offenbart sich in ihrem grünen Inneren: tropischer Regenwald, imposante Tempelanlagen, Reisterrassen, eine einzigartige hinduistische Kultur und aktive Vulkane. Zusammen mit seinen freundlichen Einwohnerinnen und Einwohner eine Mischung mit ganz eigener Magie. \nBali ist die Insel der Götter und Rituale. Galungan ist das bedeutendste religiöse Fest im 210 Tage umfassenden balinesischen Kalender. Dann wird der Sieg des Guten über das Böse gefeiert."
