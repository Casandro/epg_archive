  description: Ob ein Stoff fest, flüssig oder gasförmig ist, hängt von seiner Temperatur ab. Allerdings "kochen" viele Stoffe schon weit unter dem Gefrierpunkt, während andere auch im glühenden Hochofen nicht schmelzen. In der fünften Folge der neuen Schulfernsehreihe zur Wärmelehre geht es um Alltagserfahrungen etwa beim Kochen in der Küche, aber auch um die abenteuerliche Welt der sehr tiefen und sehr hohen Temperaturen. Und wer will, kann am Schluss wieder Tobi Tüftler bei der Lösung einer kniffligen Aufgabe helfen.
