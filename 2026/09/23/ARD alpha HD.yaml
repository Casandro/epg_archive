  title: Unwiderstehlich - Säuren in der Industrie
  description: |-
    Säuren werden von der Waschmittelindustrie als Reinigungsmittel angeboten. Beim Hausputz helfen Säuren bei der Entfernung von Kalkrändern in Waschbecken. Auch bei der Konservierung von Lebensmittel wie Sauerkraut oder bei der Produktion von Joghurt kommen diese chemischen Verbindungen zum Einsatz. Spielszenen wechseln sich ab mit Realszenen aus Industriebetrieben und Trickfilmsequenzen. In der Autobatterie ist Schwefelsäure nötig, damit Strom entsteht. Der Film zeigt auch die Wirkung von Säuren auf Metalle und organische Stoffe in Laborexperimenten.
    Ein Beitrag zum PCB-Unterricht ab der 8. Jahrgangsstufe Hauptschule und Realschule.
