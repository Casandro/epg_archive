  title: Können wir unsere Gene austricksen?
  subtitle: 42 - Die Antwort auf fast alles
  description: Ob wir dick oder dünn sind, groß oder klein, blaue Augen haben oder braune, ob wir musikalisch sind oder nicht - das alles bestimmen unsere Gene. Aber wenn wir schon unsere Gene nicht beeinflussen können, vielleicht können wir ihre Steuermechanismen beeinflussen, die bestimmte Gene aktivieren oder deaktivieren? Ist die Epigenetik, wie die Wissenschaft von diesen Mechanismen genannt wird, eine Möglichkeit aus unserem "Gen-Gefängnis" auszubrechen? Werden wir bald klüger, gesünder und musikalischer, indem wir einfach die richtigen Gene an- oder ausknipsen?
