  title: Wo Hessen oben ist - Unsere Mittelgebirge
  description: Einzigartig, waldreich und Millionen von Jahre alt. Das sind unsere Mittelgebirge. Plattentektonik oder vulkanische Aktivität haben sie in den Himmel wachsen lassen. Und seither leben wir mit ihnen. Mit ihren Gesteinen, ihrer erkalteten Lava, ihren Pflanzen, Gipfeln, ihren Tieren und ihren Besonderheiten. In Hessen ist die landschaftliche Vielfalt besonders groß. Die Basaltvorkommen sind die größten in Europa. Unsere Mittelgebirge - wir begeben uns auf Spurensuche. Was macht diese Landschaft aus? Wie lebt es sich mit ihnen? Eine bergige Faszination in Hessen.
