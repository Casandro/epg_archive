  description: 'Četiri faze sanacije ilegalno odloženog otpada u Gospiću, najdulji zasad poznati rok za pojedinu fazu - 13 mjeseci za zakopani otpad. Kad će sav otpad biti uklonjen iz Gospića? Hoće li se radovi obavljati istovremeno? Nosi li predobrada otpada na samom mjestu onečišćenja dodatne rizike? Hoće li izmjene Zakona o gospodarenju otpadom spriječiti bezakonje? GOSTI: Marija Vučković, ministrica zaštite okoliša i zelene tranzicije, Luka Balen, direktor Fonda za zaštitu okoliša, Dušica Radojčić, predsjednica saborskog Odbora za zaštitu okoliša i prirode (Možemo!), Vjekoslav Bušić, Građanska inicijativa "Gospić je naš dom".'
