  title: Invitation au voyage
  subtitle: E15. Bougival, un jardin à soi pour Berthe Morisot - Le bandana, un foulard qui raconte le Gujarat - Au Panama, le poisson à l'escabèche de Doris - En Ecosse, touche pas à mon loyer.
  genre:
  - '116'
  description: Bougival, un jardin à soi pour Berthe Morisot\n\nPour Berthe Morisot, Bougival est le temps de la félicité. Parisienne issue d'une grande bourgeoisie sensible à l'art, la peintre y prend ses quartiers d'été avec son mari et sa fille. Bougival, au coeur de la géographie impressionniste, l'inspire. Loin des salons officiels et des combats à mener pour l'émancipation, Berthe Morisot y réalise une quarantaine de toiles. L'espace public étant réservé aux hommes, elle doit innover, une détermination chevillée au corps. L'artiste travaille dans son jardin, où elle invente une peinture troublante.\n\n\n\nLe bandana, un foulard qui raconte le Gujarat\n\nDes petits points minutieusement noués par milliards ont installé l'État indien du Gujarat sur la carte des grands empires textiles. D'abord méthode de teinture, le bandhani désigne bientôt le motif traditionnel qui en résulte. Exporté puis copié par les colons anglais, ce morceau de tissu, désormais appelé "bandana", se retrouve au XXe siècle sur les têtes et autour des cous du monde entier, comme le foulard des rebelles.\n\n\n\nAu Panama, le poisson à l'escabèche de Doris\n\nÀ Portobelo, Doris part pêcher la bonite pour préparer son poisson à l'escabèche. De retour en cuisine, elle découpe et assaisonne le poisson avec du piment et du citron, avant de le faire frire. Enfin, elle prépare une sauce dont elle nappe le tout. Un plat introduit au Panama par les Jamaïcains et transmis depuis de génération en génération.\n\n\n\nEn Écosse, touche pas à mon loyer\n\nEn parcourant les cinquante-six quartiers de Glasgow, impossible de passer à côté de l'une des nombreuses fresques qui font de la métropole écossaise un haut lieu du street art. À Govan, l'un des secteurs les plus populaires, une création murale raconte l'un des combats féministes les plus importants d'Écosse. (2026)
