  description: Im zeitigen Frühjahr sind die Wassertemperaturen oft noch tief im Keller, die Karpfen wenig aktiv und der Angelplatz und der Futtereinsatz muss wohl überlegt sein. Wie ich mit meinem Team in diesen Situationen an kleinen Gewässer vorgehe und wie es uns gelingt auch zu diesen unkomfortablen Situationen zielsicher die Karpfen zu fangen, zeige ich in diesem Video. Neben Spots beleuchten wir die Angeltiefe, Umweltfaktoren, das Finden der Angelstelle und die Futtermengen. DE 2019
