  description: "Blick hinter die Kulissen: Vorschau auf Unternehmen erleben in Landshut \nAm Freitag heißt es: Türen auf und neugierig sein! Bei Unternehmen erleben können Interessierte, verschiedene Betriebe in Stadt und Landkreis Landshut besuchen und dabei mehr sehen als nur die Eingangstür. Es gibt Einblicke in den Arbeitsalltag, Gespräche mit Mitarbeitern und teilweise darf sogar selbst mit angepackt werden. Insgesamt 40 Unternehmen sind mit dabei. Was hinter der Aktion steckt, wurde im Rahmen einer Pressekonferenz vorgestellt.\n\nAnmelderekord - Der diesjährige Dingolfinger Halbmarathon\nIn Dingolfing hieß es wieder: Laufschuhe an und ab an die Startlinie. Rund 1.600 Läuferinnen und Läufer waren bei der 22. Auflage des Dingolfinger Halbmarathons dabei. Dass der Lauf auch in diesem Jahr auf großes Interesse stoßen würde, hatte sich bereits im Vorfeld gezeigt - alle Startplätze waren vergeben, die Anmeldung deshalb geschlossen. Bei besten Bedingungen warteten die Teilnehmer schließlich auf den Startschuss. Und dann war es soweit: Das Feld setzte sich in Bewegung und die 21,1, 10 oder 5 Kilometer konnten beginnen.\n\nCulture & Beat -  Die Dingolfinger Kulturnacht \nWer am Wochenende in Dingolfing unterwegs war, musste nicht lange nach Unterhaltung suchen. In der ganzen Innenstadt war etwas geboten: Musik, Tanz, Magie und jede Menge Kultur. Dazu konnten die Besucher auch noch länger durch die geöffneten Geschäfte bummeln. Wir waren vor Ort und haben viele Eindrücke aufsammeln können. \n\nSouveräner Auftaktsieg: TG Mipa Landshut startet mit 37:31 gegen Rimpar in die neue Saison\nDie Hallensportarten stehen wieder in den Startlöchern. Neben den Eishockeycracks des EV Landshut sind am Wochenende beispielsweise auch die Handballer der TG Mipa in die neue Saison gestartet. Und zwar mit einem Heimspiel gegen die Jungwölfe Rimpar."
