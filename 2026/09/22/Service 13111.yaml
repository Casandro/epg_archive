  title: Hubert ohne Staller
  subtitle: Tod des Sokrates
  description: "Hubert und Girwidz klingeln bei Arno Heinrich, der am Vortag seine Geldbörse als gestohlen gemeldet hat. Es ist der fünfte Portemonnaie-Diebstahl binnen kürzester Zeit, und alle haben sich im Umkreis der Bäckerei Rattlinger ereignet. Obwohl niemand öffnet, betritt Girwidz in der Hoffnung, eine Toilette zu finden, das Anwesen. Stattdessen entdeckt er allerdings die Leiche des Hausbesitzers auf der Couch. Vor ihm steht ein Whiskey-Glas mit den Resten einer stechend riechenden Flüssigkeit. Kurz darauf kommt die junge Janina Schulz zur Tür herein und gibt an, hier zu wohnen, aber nur platonisch mit dem Verstorbenen verbunden zu sein. Er war ihr Professor und der berühmteste Philosoph Deutschlands. Selbstmord ist für sie ausgeschlossen. Dies bestätigt kurz darauf Dr. Fuchs, die auf dem Glas mit der tödlichen Flüssigkeit im Labor keine Fingerabdrücke ausfindig machen kann. Das Gift darin war dasselbe, mit dem auch der Philosoph Sokrates zu Tode kam. War es ein Mord unter Gelehrten? \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
