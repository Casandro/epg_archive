  title: Terra Mater
  subtitle: Namibia - Im Land der letzten Riesen
  description: |-
    Namibia ist mehr als doppelt so groß wie Deutschland, hat aber nur zwei Millionen Einwohner, kein Land in Afrika hat mehr Platz für wilde Tiere.  Doch der Schein trügt, denn die Rinderfarmen mit ihren gigantischen Weideflächen aber auch hunderttausenden Kleinbauern beanspruchen immer mehr Platz: Der Konflikt zwischen Menschen und Wildtieren verschärft sich, dazu kommt in jüngster Zeit die grassierende Wilderei. Nashorn und Elefant stehen daher buchstäblich auf der Abschussliste. Doch es gibt berechtigte Hoffnung:  Um diese Ikonen des wilden Afrikas zu retten, haben Experten der zuständigen Ministerien, Biologen und findige Privatiers faszinierende Strategien entwickelt.



    Eines der letzten Gebiete mit freilebenden Spitzmaulnashörnern liegt in der kaum bewohnten Halbwüste Kunene. Hier versucht ein Expertenteam der Organisation "Save the Rhino" die Nashörner zu beobachten und vor Wilderei zu schützen. Spitzmaulnashörner sind scheue Einzelgänger. Sie reagieren sehr aggressiv, wenn sie sich bedroht fühlen, sind also keine einfachen Zeitgenossen. Die Tiere tragen keine GPS Sender, kein Signal, keine Information nicht der kleinste Hinweis soll den Wilderern ihren Standort verraten.  Also gehen die Ranger, die an strategischen Punkten im Gelände campieren täglich zu Fuße auf Patrouille. Der harte Weg lohnt sich: Kunene beherbergt heute gut die Hälfte aller frei lebenden Spitzmaulnashörner Afrikas. Von dieser Erfolgsgeschichte sollen nun auch die Wüstenelefanten profitieren.


    Natur, Österreich 2016, R: Harald Pokieser
