  title: Hubert ohne Staller
  subtitle: Marderschaden
  description: "Eigentlich freuen sich Hubert und Girwidz auf einen ruhigen Streifendienst. Doch dann entdecken sie einen verunfallten Motorradfahrer in einer Wiese. Als sie anhalten wollen, versagen die Bremsen des Streifenwagens und die beiden landen ebenfalls neben der Straße. Während sie mit dem Schrecken davonkommen, sieht es für Motorradfahrer Martin Fritz nicht gut aus. Er überlebt schwer verletzt und kommt auf die Intensivstation. Die Untersuchungen der verunfallten Fahrzeuge bringen Erstaunliches zu Tage: Während bei Motorradfahrer Martin Fritz jemand die Bremsschläuche durchgeschnitten hat, hat sich am Streifenwagen ein Marder zu schaffen gemacht. Riedl wird beauftragt, sich um das Marder-Problem zu kümmern, denn Hubert weiß: ein Marder wird sowas immer wieder tun! Weil im Fall des Motorradfahrers nun ein Mordversuch im Raum steht, wollen er und Girwidz aber nicht auf die Reparatur des Streifenwagens warten und leihen sich kurzerhand den beschlagnahmten Wagen eines Rasers aus. Mitten in den Ermittlungen verliert Hubert plötzlich sein Gehör, was er zunächst vor den Kollegen zu verbergen versucht. Nur Dr. Fuchs gegenüber outet er sich. Die glaubt, der Marderschreck, den Riedl am Streifenwagen angebracht hat, ist die Ursache für Huberts Hörverlust. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
  widescreen: true
