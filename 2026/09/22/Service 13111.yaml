  title: Heimatleuchten
  subtitle: Das Leben mit Reben - Mit Sarah Pernerstetter in Straß im Straßertale
  description: |-
    Im Straßertael dreht sich fast alles um den Wein - doch hinter den Reben verbirgt sich weit mehr als guter Geschmack. Sarah Pernerstetter besucht den Weinort Straß im Hochsommer, wenn der Jahrgang noch auf den Rebstöcken wächst und dennoch schon über seine Zukunft entschieden wird. Zwischen traditionsreichen Winzerfamilien, Kellergassen, Jagdrevieren und Dorfgeschichten erzählt der Film von Gemeinschaft und Konkurrenz, vom Loslassen und Weitergeben sowie von Menschen, deren Leben untrennbar mit ihrer Heimat verbunden ist. Ein stimmungsvolles Porträt eines Dorfes, das seinen Charakter aus Boden, Geschichte und Zusammenhalt schöpft.
