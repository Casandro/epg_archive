  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die Top Ten der übersinnlichen Influencer
  description: 'Im Laufe der Geschichte wurde die Menschheit von geheimnisvollen Lehrern geführt. Nun wirft der Prä-Astronautik-Theoretiker Giorgio Tsoukalos einen Blick auf einflussreiche Persönlichkeiten, von denen er überzeugt ist, dass sie Besucher aus einer anderen Welt waren. Hat ein biblischer Patriarch Anweisungen von 200 Engeln über der Erde erhalten? Haben die alten Griechen von einem Volk von Fischmenschen gelernt, wie man Metall bearbeitet? Und könnte Ägyptens umstrittenster Pharao ein Außerirdischer gewesen sein? Giorgio Tsoukalos wird auf diese und andere mysteriöse Lehrer zurückkommen, die im Laufe der Geschichte aufgetaucht sind - und er wird die historischen Figuren enthüllen, die seiner Meinung nach den ultimativen Beweis für außerirdische Kontakte liefern.Vereinigte Staaten Von Amerika 2024, R: Mitch Marcus'
