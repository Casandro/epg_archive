  title: Sport und Talk aus dem Hangar-7
  description: "Extremsport: Arda Saatci - der Marathon-Mann. \nEr lief und lief und lief ... und die Welt fieberte mit. Mehr als 123 Stunden lang begeisterte Arda Saatci Anfang Mai die Welt mit seinem Lauf vom tiefsten Punkt der USA bis zur Pier von Santa Monica - ein Projekt der Red Bull Cyborg Season 2026. Die 604 Kilometer haben nicht nur Sportgeschichte geschrieben. Im Anschluss an die Dokumentation \"Arda Saatci läuft und läuft und läuft\" ist der Extremsportler live bei Sport und Talk aus dem Hangar-7 zu Gast. Er berichtet, wie dieser Lauf sein Leben verändert hat. Begleitet wird der 29-Jährige von Gzim Ferizi, seinem Vertrauten und Betreuer während der Tage in den USA, Sport-Influencerin Imke Salander und US-Open-Sieger Dominic Thiem. Gemeinsam sprechen sie auch über die Frage, was Mentalität im Sport und im Leben verändern und bewegen kann. \nGäste: Arda Saatci (Extremsportler), Gzim Ferizi (Physiotherapeut Arda Saatci), Dominic Thiem (Sieger US Open), Imke Salander (Sport-Influencerin), Paul Miller (Mental Performance Specialist Red Bull)Österreich 2026"
