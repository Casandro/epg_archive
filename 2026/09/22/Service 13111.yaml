  title: Hubert und Staller
  subtitle: Das Haus am Moor
  description: "Hubert und Staller werden gerufen, um eine jämmerlich schreiende Kuh zu retten, die sich im nahegelegenen Moor verlaufen hat. Doch von dem verirrten Tier fehlt jede Spur. Stattdessen machen die Polizisten einen grausigen Fund - die Leiche einer jungen Frau. Würgemale an ihrem Hals lassen sofort auf ein Verbrechen schließen. Schnell ist klar, dass das Opfer nicht im Moor starb, sondern nur die Leiche darin versenkt wurde. Erste Spuren an den Schuhen des Opfers führen zu einem nahegelegenen Bauernhof. Neben einem alten Paar, dem unangenehmen Gutsbesitzer Manfred Weiss und seiner Frau Helmine, die von einem Schlaganfall schwer gezeichnet ist, wohnt noch deren Sohn mit Frau und Kind auf dem Hof. Zur Überraschung von Hubert und Staller belastet Helmine Weiss ihren eigenen Mann schwer. Auf einer Kreidetafel, ihre einzige Möglichkeit sich mitzuteilen, bezichtigt sie ihn vor den Augen der Polizisten als Mörder. Aber kann man den Worten der alten und verwirrten Frau trauen? \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2014, R: Werner Siebert"
  widescreen: true
