  title: Hubert und Staller
  subtitle: Ein schmutziges Geschäft
  description: |-
    Als ein Angler einen auffälligen Ölfleck auf der Loisach entdeckt, sollen Hubert und Staller der Sache auf den Grund gehen. Sie finden jedoch keine defekte Abwasserleitung, sondern eine Leiche - an Gewichten im Fluss versenkt. Ganz offensichtlich war der Mann durch Messerstiche umgekommen, denn sein Körper ist von Einstichen übersäht. Die Ermittlungen ergeben, dass es sich bei dem Toten um Tom Rösler handelt, dem Produktionschef der Textilfabrik Kutschner. Als die Polizisten schließlich dem Firmenleiter die traurige Nachricht vom Tod seines Mitarbeiters überbringen, reagiert der auffallend sachlich. Über Röslers Privatleben kann Kutschner keine Auskunft geben, als Mitarbeiter sei er jedenfalls zuverlässig und pflichtbewusst gewesen. Bei der Durchsuchung von Röslers Wohnung entdecken die Polizisten Videoaufnahmen einer geheimnisvollen Frau. Deutlich zu erkennen ist sie allerdings nicht, nur ihr auffallendes Tattoo bietet einen Anhaltspunkt. Steckt sie hinter dem Verbrechen?

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.

    Krimi, Deutschland 2014, R: Jan Markus Linhof
