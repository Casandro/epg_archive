  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: "Stänkern, Schimpfen, Streiten: Wie rau geht's auf unseren Bergen zu? \nEin Bergführer verliert am Großglockner die Nerven und geht auf einen Bergsteiger los. Der Fall sorgt weit über Österreich hinaus für Aufsehen. Doch ist das nur ein extremer Einzelfall? Volle Klettersteige, Staus vor dem Gipfel. Wie rau geht es mittlerweile in Österreichs Bergen zu, und was macht der Massenandrang mit dem Miteinander am Berg? Dazu ein Gespräch mit Extrembergsteiger Alexander Huber. \n\nKampf gegen die Teuerung: Was hat die Regierung wirklich geschafft? \nDer Einkauf bleibt teuer, der Frust an der Kassa ist groß. Dabei hat die Regierung im vergangenen Jahr eine Maßnahme nach der anderen versprochen: Mehrwertsteuer runter, Preise unter Beobachtung, Schluss mit dem Österreich-Zuschlag. Doch was davon spüren die Kunden wirklich? Blickwechsel macht den Preis-Check, in Österreich und nur wenige hundert Meter weiter in Bayern. Und der zeigt: Die gleichen rosa Schnitten kosten in Deutschland rund ein Viertel weniger. Und sie sind längst nicht das einzige Produkt, bei dem die Österreicher tiefer in die Tasche greifen. \n\nJung. Wütend. Gewalttätig: Österreichs Jugend außer Kontrolle? \nBlut auf dem Asphalt, ein Jugendlicher mit Verdacht auf Kieferbruch. Kontrollinspektorin Lisa wird zu einer brutalen Schlägerei in Graz gerufen. Die Hemmschwelle sinkt, die Gewaltbereitschaft steigt. Ein Blick in die Kriminalitätsstatistik zeigt: Bei Jugendgewalt fallen überdurchschnittlich oft ausländische Tatverdächtige auf. Warum nimmt die Jugendgewalt seit Jahren zu?Österreich 2026,  M: Katrin Prähauser"
