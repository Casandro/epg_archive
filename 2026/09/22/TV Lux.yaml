  title: Poslovia svetla (7)
  subtitle: Príbeh George Müllera.
  description: 'George Müller žije na základe radikálnej modlitby a spolieha sa na to, že Boh uspokojí všetky jeho potreby bez toho, aby od kohokoľvek žiadal čo i len cent - dokonca ani od zboru, ktorému je pastierom! Keď sa dostane do kontaktu so zanedbanými deťmi ulice v anglickom Bristole, zistí, že pracovné domovy nútia tieto zúfalé siroty k neplatenej práci. George a jeho manželka Mary otvoria prvé sirotince, ktoré sú podporované výlučne modlitbou, a Boh zázračne zabezpečí všetky ich potreby. Ale nepriatelia ich práce vymyslia plán, ako sirotince nadobro zatvoriť. Zostane Georgeova dôvera v Boha silná tvárou v tvár ľstivým protivníkom a zúfalým okolnostiam? Deti aj dospelí uvidia radikálnu vieru v akcii v tejto epizóde seriálu poslovia svetla. Réžia: Robert Fernandez. Účinkujú: Steven Daltry, Alison Pettit, Jeffrey Wright III (Charlie) (2020)'
