  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Úcta k Pánovmu menu ("Druhé prikázanie prikazuje mať v úcte Pánovo meno. Podobne ako prvé, aj druhé prikcloveka a kresťan dostáva svoje meno v Cirkvi. Môže to byť meno niektorého svätca, čiže učeníka, ktorý žil životom príkladnej vernosti voči svojmu Pánovi. Patronát svätca poskytuje vzor lásky a zabezpečuje jeho orodovanie. "Krstné meno" môže vyjadrovať aj niektoré kresťanské tajomstvo alebo kresťanskú čnosť. (KKC 2156) (2018)'
