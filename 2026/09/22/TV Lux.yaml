  description: Nikola Strenk vyrastala vo veľkej gréckokatolíckej rodine, kde bola viera prirodzenou súčasťou každodenného života. Počas dospievania však prišli pochybnosti, túžba žiť po svojom a obdobie, keď sa od Boha vzdialila. V relácii Spojení vierou hovorí o svojom návrate k viere, sile modlitby a o tom, ako jej Pompejská novéna zmenila život, manželstvo aj pôsobenie vo Švajčiarsku.
