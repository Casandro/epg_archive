  title: Naturparadies Armenien
  subtitle: Nationalpark Sewan
  description: "Seine türkisblaue Farbe erinnert an die Karibik. Und doch liegt er fernab von Meeren und Ozeanen mitten im Landesinneren Armeniens. Der Sewansee liegt am Südrand des Kleinen Kaukasus in 1.900 Meter Höhe. Er ist mehr als doppelt so groß wie der Bodensee und eingebettet in eine einzigartige Hochgebirgslandschaft. \n\nDie Armenier nennen ihn mit Stolz das armenische Meer. Der Sewansee ist ein einzigartiges Symbol für die Natur, die Kultur und die Geschichte Armeniens. An seinen Ufern stehen stumme Zeugen der Vergangenheit. Eine tausend Jahre alte Zyklopenfestung ist das Überbleibsel des stolzen Königreichs Etiuni."
