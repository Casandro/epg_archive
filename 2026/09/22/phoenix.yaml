  title: Auswärtsspiel
  subtitle: Die Toten Hosen in Ost-Berlin
  description: 'Schon kurz nach ihrer Gründung Ostern 1982 führt die Düsseldorfer Punkband "Die Toten Hosen" die Stasi an der Nase herum: Die Musiker Campino, Andi, Breiti, Kuddel und Trini geben ein Geheimkonzert in einer Kirche, mitten in der damaligen DDR. In "Auswärtsspiel - Die Toten Hosen in Ost-Berlin" wird dieses einzigartige Ereignis nun zum ersten Mal umfassend erzählt. Inzwischen eine der erfolgreichsten deutschen Bands überhaupt, begeben sich "Die Toten Hosen" 40 Jahre später noch einmal auf die Spuren einer für sie bis heute unvergessenen Reise.'
