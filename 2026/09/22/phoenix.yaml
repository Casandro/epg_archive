  description: 'Seine türkisblaue Farbe erinnert an die Karibik. Und doch liegt er fernab von Meeren und Ozeanen mitten im Landesinneren Armeniens: der Sewansee am Südrand des Kleinen Kaukasus in 1.900 Meter Höhe. Er ist mehr als doppelt so groß wie der Bodensee und eingebettet in eine einzigartige Hochgebirgslandschaft. Die Armenier nennen ihn mit Stolz das armenische Meer. Der Sewansee ist ein einzigartiges Symbol für die Natur, Kultur und Geschichte Armeniens.'
