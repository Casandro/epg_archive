  title: Naturparadies Armenien
  description: Der türkisblaue Sewansee in Armenien ist mehr als doppelt so groß wie der Bodensee. Er liegt in 1.900 Meter Höhe, eingebettet in eine einzigartige Hochgebirgslandschaft. Der See steht einzigartig für die Natur, die Kultur und die Geschichte Armeniens. Der Sewan ist das größte Süßwasserreservoir der Kaukasusregion. Deshalb sind der See und seine Uferzone seit 1978 Nationalpark. Er ist Biotop für endemische Tierarten wie die seltene gepunktete Sewanforelle oder die Armeniermöwe.
