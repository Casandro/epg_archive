  description: Tko su redovnici koji već stoljećima pozivaju na potpunu posvetu Isusu po Marijinim rukama? U novoj emisiji ,,Izdvojeno vodimo vas u svijet Družbe monfortanaca - Družbe Marijine, zajednice duboko ukorijenjene u duhovnost svetog Ljudevita Montfortskog. Otkrijte kako je upravo njihova karizma nadahnula jedno od najpoznatijih papinskih gesla u povijesti - Totus Tuus svetog Ivana Pavla II. Razgovaramo o njihovoj povijesti, pučkim misijama i 50 godina djelovanja u Hrvatskoj. Gost emisije je o. Mihovil Filipovi, poglavar zajednice Misionara Monfortanaca u Hrvatskoj.
