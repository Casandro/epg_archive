  subtitle: Religijski
  description: Ivana i Goran Kanceljak zajedno su prošli put ispunjen ljubavlju, radošću, ali i velikim životnim kušnjama. Kako sačuvati brak kroz gotovo tri desetljeća? Kako podizati veliku obitelj, nositi se s gubitkom i pronaći snagu za svaki novi dan? Njihova priča nije priča o savršenom životu, nego o ljubavi koja ostaje - i onda kada je najteže. Upoznajte bračni par Kanceljak i poslušajte njihovo iskreno svjedočanstvo o braku, obitelji, vjeri, gubitku i nadi.
