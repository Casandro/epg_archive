  title: Superknjiga
  subtitle: Animirani
  description: Ela se osjeća osramoćeno zbog videa na kojem 'proždire' hranu, koji je djevojka po imenu Barbara objavila na internetu. Govori Luki i Gizmu kako će joj se osvetiti tako što će objaviti video na kojem Barbara radi ponižavajuće nespretni okret na probi za navijačice, pri čemu završi u kanti za smeće. Baš kada se spremala objaviti video, Superknjiga odvodi djecu u vrijeme proroka Elizeja. Djeca svjedoče različitima čudima koja Elizej napravi i za dlaku izbjegnu opasnost od sirijskih vojnika koji su trebali zarobiti proroka. Luka shvaća da nas Božja sila štiti u svakom trenutku, čak i onda kada nismo svjesni opasnosti. A kada Elizej privremeno oslijepi sirijske vojnike i preda ih u ruke izraelskom kralju, te pritom zahtjeva od kralja da se prema njima ophodi ljubazno i samilosno, Ela uspoređuje prorokovo ponašanje s vlastitom željom da se osveti djevojci koja se prema njoj ponijela loše. Po povratku u sadašnjost, Ela izbriše ponižavajući video s Barbarom i ne objavi ga, a njih dvije naprave prve korake prema tome da se sprijatelje.
