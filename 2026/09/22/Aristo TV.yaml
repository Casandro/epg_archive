  title: ERF Mensch Gott - Gott gibt _s echt! - Was wird aus meinem Kind, wenn ich sterbe?
  description: Sie ist erst 27 Jahre, als sie die Diagnose akute myeloische Leukämie bekommt. Doch  Rabea hat nicht nur Angst um ihr eigenes Leben. Die alleinerziehende Mutter macht  sich große Sorgen, was mit ihrer zweijährigen Tochter passiert, wenn sie den Blutkrebs  nicht überlebt. Rabea kämpft sich durch qualvolle Behandlungen. Die Prognose der  Ärzte ist düster. Und obwohl sie irgendwann mit dem Leben abschließt, ist da immer  wieder eine besondere Zusage, die ihr Hoffnung gibt.
