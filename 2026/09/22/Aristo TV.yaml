  title: Kraftvoll Leben - Lass dein Problem deiner Bestimmung dienen
  description: Wie kann ich ein Segen für so viele Menschen sein, aber leer und kraftlos meinen eigenen Problemen gegenüber ausgeliefert sein? Gott benutzt oft Situationen im Leben, die dich am meisten herausfordern, um dich an den Ort der Bestimmung zu bringen, denn Probleme dienen viel öfters als man denkt, der eigenen Bestimmung. Wenn Gott also Probleme in deinem Leben zulässt, dann sind sie das Sprungbrett in deine Bestimmung. Es lohnt sich durchzuhalten, denn das, was Gott für dich bereithält ist größer, als das, was du bisher sehen kannst.
