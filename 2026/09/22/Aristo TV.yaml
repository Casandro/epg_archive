  description: Der Tegernsee. Eine der beliebtesten, begehrtesten und gewiss exclusivsten Regionen in Deutschland.  Für viele Münchner das Ausflugsziel Nummer eins und für fast alle ein Herzenswunsch an diesen Ufern zu leben und Zu wohnen. Meistens bleibt es ein Traum.
