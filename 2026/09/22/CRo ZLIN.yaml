  title: Srdcovky Zdeňka Junáka
  description: Zdeněk Junák připomíná aktuální jmeniny oblíbenými veršíky, plní vaše písničková přání a předává vzkazy z lásky, k výročím sňatků nebo jen tak pro radost. Má pro vás také celotýdenní soutěž "Kdo? Kdy? Kde?". Den bez aut připomíná, že někdy může cesta vypadat jinak než obvykle. Ne každý se bez auta obejde, ale tam, kde to jde, může být příjemné vyrazit pěšky, autobusem, vlakem nebo tramvají. Moderuje Zdeněk Junák.
