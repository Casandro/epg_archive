  subtitle: Legendarny rewolwerowiec rusza tropem bandytów, którzy ukradli jego pokerową wygraną. Po awanturze trafia do aresztu, gdzie ujawniają się ślady jego mrocznej przeszłości.
  description: |-
    Tytuł oryginalny: Doc West
    IT,US, 2009
    Reżyseria: Terence Hill
    Występują: Terence Hill, Paul Sorvino, Boots Southerland, Clare Carey, Benjamin Petry, Adam Taylor
    Legendarny rewolwerowiec rusza w pościg za bandytami, którzy ukradli jego wygraną z pokera. W wyniku awantury trafia do aresztu, gdzie na jaw wychodzi jego mroczna przeszłość. Gdy w mieście wybucha krwawa wojna, Doc West musi zdecydować, czy stanie po stronie prawa. Obsada: Terence Hill, Clare Carey, Alessio Di Clemente
  ageRating: 16
