    US, 2021
    Występują: David C. Schweizer
    HSI przeprowadza kontrolowaną dostawę metamfetaminy, próbując złapać międzynarodowego przemytnika narkotyków. Pasażer w Miami wpada w tarapaty, gdy odmawia odpowiedzenia na rutynowe pytania na temat swojej podróży. Na lotnisku JFK agenci przeszukują magazyn w poszukiwaniu małych ilości narkotyków ukrytych w przetworzonej żywności.
