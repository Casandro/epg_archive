    Reżyseria: Michael McNamara
    Występują: Matthew Thomas Gaus, Jason R. Hughes, John Kunkle, Deana Molle'
    Amerykańskie show, którego akcja toczy się w portach handlowych. Serial przybliża bezwzględny świat aukcji i licytacji. Ludzie o stalowych nerwach gotowi są podjąć ogromne ryzyko, by zdobyć towar, który w ich wyobrażeniu może przynieść ogromny zysk. Nigdy jednak nie wiadomo, co znajduje się w morskich kontenerach. Czy handlowcy wrócą do domu z wielką wygraną, czy z pustymi rękami?
