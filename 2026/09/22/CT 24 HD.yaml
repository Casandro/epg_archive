  title: Na dosah
  subtitle: Témata, která mění společnost pohledem odborníků... významných osobností různých oborů. Diskuzním pořadem provází mod...
  description: 'Témata, která mění společnost pohledem odborníků... významných osobností různých oborů. Diskuzním pořadem provází moderátor Daniel Stach. Tentokrát na téma: České mozky. V unikátním prostoru Planetária Praha se svými hosty probere, co mají společného Češi, kteří se umějí prosadit ve světě a co se od nich mohou naučit ti, kteří jsou teprve na začátku. Pozvání přijali mimo jiné filantropové Katarína a Ondřej Vlčkovi, biochemik Jan Konvalinka, sociální psycholožka Iva Poláčková Šolcová nebo neurovědec Aleš Stuchlík, (spravodajstvo)'
