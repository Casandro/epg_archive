  subtitle: Das Erfindermagazin
  description: Nachdem Andre Kriwet aus Köln jahrelang für die Global-Player der Turnschuh-Branche gearbeitet hat, hängt er seinen Job an den Nagel und will gemeinsam mit seinem ehemaligen Uni-Prof, dem renommierten Sportwissenschaftler Prof. Dr. Gert-Peter Brüggemann, einen verletzungsreduzierenden Laufschuh entwickeln. Denn noch immer zieht sich jeder zweite Jogger einmal pro Jahr eine Verletzung zu. Mit ihrem gemeinsamen Know-how erfinden die beiden eine Dämpfung, die sich an der Funktionsweise der Ferse orientiert und die Form eines Hufeisens hat. So soll die Krafteinwirkung beim Joggen schonender für die Gelenke umgeleitet werden.
