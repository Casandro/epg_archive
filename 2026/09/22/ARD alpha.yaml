  description: |-
    Vom Juristen im Schweinestall und dem Traum vom glücklichen Arbeiten:
    In ihrem früheren Leben haben sie als Innenarchitektin gearbeitet, als Elektroingenieur oder als Wirtschaftsjurist: Jetzt bauen sie Gitarren, machen Siebdruck oder züchten Weideschweine. Statt auf KI und Digitalisierung zu setzen, haben sie ganz bewusst entschieden, sich die Hände schmutzig zu machen. Und stellen ihre eigene Schaffenskraft in den Mittelpunkt ihres Arbeitslebens.
