  title: Akcent
  subtitle: Akcentujeme to, co hýbe kulturou. Každý všední den jedno téma z více úhlů pohledu.
  description: Dům MAT na pražském Karlově náměstí, Winternitzova vila v Praze na Smíchově, Volmanova vila v Čelákovicích, Budilova letní vila v Kostelci nad Černými lesy. To je pár příkladů nejen architektonicky zajímavých budov, které se probudily znovu k životu. Jaké jsou jejich příběhy? Jak do nich nalákat publikum? Saša Michailidis se ptá Jana Mattlacha a Zuzany Kadlečkové.
