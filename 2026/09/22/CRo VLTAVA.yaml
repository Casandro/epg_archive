  title: Vizitka
  description: 'Magdaléna Gurská, ilustrátorka. Největší přehlídka současné autorské ilustrace - to je Mezinárodní festival ilustrace a komiksu LUSTR, který začíná už tento čtvrtek. Jednou z autorek hlavní výstavy Krajina 2.0. bude Magdaléna Gurská. Je původem ze Slovenska, už nějaký čas žije v Ústí nad Labem a zajímá se právě o krajinu, zejména právě tu severočeskou. Co ji z hlediska tvorby zajímá na krajině v Severních Čechách, která je poznamenaná těžbou? A jak do její ilustrace vstupuje to, že je taky grafickou designérkou? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
