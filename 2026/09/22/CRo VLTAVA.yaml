  title: Akademie
  description: 120.výročí narození Dmitrije Šostakoviče, největšího ruského skladatele 2. poloviny 20. století - a nahrávky s těmi, kteří uváděli jeho díla ve světové premiéře. Byli to nejvýraznější umělci 20. století, mimo jiné David Oistrach, Svjatoslav Richter, Mstislav Rostropovič... byli to jeho obdivovatelé a přátelé. Jeho hudbě a jeho duši rozuměli tak jako málokdo, často se jedná doslova o nesmrtelné nahrávky. Připravil Jindřich Bálek.
