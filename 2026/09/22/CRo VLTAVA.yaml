  title: ArtCafé
  description: 'Se školou do divadla. Kolikrát za dobu povinné školní docházky se do divadla podíváme? Jak tyto zážitky ovlivňují naší představu o divadle později? Čím se mohou učitelé při výběru inscenací řídit? A proč by to návštěvou divadla nemělo končit? O tom bude ArtCafé Dominiky Mithofer, jehož hosty budou divadelní lektorky a pedagožky Jana Nechvátalová a Anna Hrnečková. E-mail: artcafe@rozhlas.cz'
