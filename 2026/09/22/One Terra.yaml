  title: Planet Weltweit - Rattenjagd im Südpolarmeer
  subtitle: Planet Weltweit - Rattenjagd im Südpolarmeer
  description: 'Team Rat - das "Team Ratte" - startet zu einer einzigartigen Rettungsaktion. Ihr Einsatzgebiet: die menschenleere Insel Südgeorgien im Südpolarmeer, eine der abgelegensten und stürmischsten Inseln der Erde - und eines ihrer wichtigsten Vogelbiotope. Das Ziel: die größte Rattenausrottung aller Zeiten, um Millionen von Seevögel zu schützen. Im Einsatz: ein Schiff, drei Hubschrauber und ein internationales Team von 25 Leuten. Haben sie im Kampf gegen die eingeschleppten Nager eine Chance? Der Neuseeländer Peter Garden gilt als der erfahrenste Pilot für Rattenausrottungen weltweit. Doch noch nie waren die Herausforderungen so groß wie auf der subantarktischen Insel Südgeorgien. Schneestürme, hohe Berge und technische Probleme behindern den Luftangriff auf die Vogelräuber, die einst von Robbenschlägern und Walfängern eingeschleppt wurden. Jetzt soll die Insel in ihren Urzustand zurückversetzt werden. Planet hat das Team bei seinem Anti-Ratten-Einsatz am Ende der Welt begleitet. Nirgendwo sind die Gewässer des Südlichen Ozeans nährstoff- und artenreicher als rund um Südgeorgien. Die britische Insel von der Größe Mallorcas ist wichtigster Treffpunkt für Meeressäuger weltweit und Brutplatz für bis zu 60 Millionen Seevögel, darunter Arten, die nirgendwo sonst vorkommen. Doch das ist nur noch ein Bruchteil des einstigen Lebens. Denn viele der Bodenbrüter sind hilflos Ratten und Mäusen ausgeliefert, die einst mit Robben- und Walfängern an Land kamen. Mit einem acht Millionen Euro teuren Projekt einer britischen Privatstiftung sollen die Räuber nun ausgerottet werden. Per Schiff werden drei Hubschrauber, 200 Tonnen Rattengift, 700 Fässer Treibstoff sowie Essen für mehrere Monate auf die unbewohnte Insel gebracht. Das Einsatzgebiet umfasst 58.000 Hektar - und ist damit fünfmal größer als jede Fläche, auf der je zuvor eine Rattenausrottung versucht wurde. DE 2013'
