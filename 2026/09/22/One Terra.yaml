  title: Planet Weltweit - Der Lachszähler von Kamtschatka
  subtitle: Planet Weltweit - Der Lachszähler von Kamtschatka
  description: 'Am äußersten Zipfel Russlands, zwischen Asien und Alaska, liegt Kamtschatka - eine Halbinsel mit glasklaren Flüssen, kochenden Seen und bis zu 4000 Meter hohen feuerspeienden Vulkanen. Es ist eines der letzten Naturparadiese der Welt, eine unvergleichlich schöne aber auch raue Landschaft. Wer in dieser Abgeschiedenheit lebt, muss vieles entbehren und hat oft einen ungewöhnlichen Beruf: So wie Alexej Maslow, der Lachszähler von Kamtschatka. Rund 200 Flüsse fliegt er pro Saison im Hubschrauber ab, um zu schätzen, wie viele Lachse darin ziehen. Fische zählen im Flug - wie geht das? Die Dokumenation begleitet Alexej Maslow auf seinen Flügen durch die Wildnis und lüftet das Geheimnis des Lachszählers. Kamtschatka ist noch heute wild und unberührt. Das verdankt es seiner geographischen Abgeschiedenheit und der Tatsache, dass die Halbinsel zu Sowjetzeiten verbotenes Land war, Sperrgebiet. Straßen und Wege gibt es noch heute kaum. Tagelang ist Alexej mit dem Hubschrauber unterwegs, ohne auf eine Stadt oder eine Siedlung zu stoßen. Jährlich kehren die Lachse in riesigen Schwärmen aus dem Pazifik hierher auf die Halbinsel zurück, um sich zu paaren und dann zu sterben. Es ist Alexejs Aufgabe, aus der Luft zu schätzen, wie viele es genau sein werden. Seine Schätzungen beeinflussen die staatliche Fangquote und damit auch die Preise an den amerikanischen Warenterminbörsen, wo der Pazifiklachs hoch gehandelt wird. Der Lachs ist auf Kamtschatka aber nicht nur Lebensgrundlage vieler Menschen, sondern auch der riesigen Braunbären. Bis zu 50 Kilogramm Lachs fressen erwachsene Kamtschatka-Bären am Tag, und wagen sich bei ihren Fischzügen auch schon mal bis in die Siedlung der Forscher vor. So hat Alexej Maslow extra den Bärenjäger Wassili für den Schutz der Forschungsstation engagiert. Er duldet lediglich die Bärenwaisen Mischa und Mascha, die regelmäßig die Nähe der Menschen und Schutz vor ihren großen Artgenossen suchen. DE 2007'
