  title: Planet Weltweit - In acht Meilen um die Welt
  subtitle: Planet Weltweit - In acht Meilen um die Welt
  description: 'Die Roosevelt Avenue führt mitten durch das New Yorker Einwandererviertel Queens. Menschen aus etwa 130 verschiedenen Nationen leben hier offiziell. Mit der Journalistin Elizabeth Mora-Mass tauchen wir in diesen Mikrokosmos ein und begleiten sie bei ihren Recherchen. Vor den Backsteinfassaden mit Ladenschildern in unterschiedlichsten Sprachen stehen Garküchen, aus denen Dampfwolken von Chilihuhn-Tamales und Curry-Reis quellen. Mariachi-Melodien, indische Filmmusik, thailändische Schlager hallen zu einer wilden Kakophonie zusammen. Aus den ewig hupenden schwarzen Limousinen-Taxen "La mexicana" steigen in Saris oder Kimonos gehüllte Frauen und federgeschmückte amazonische Heiler. Und in kleinen Gärten der Sehnsucht wachsen Bohnenpflanzen, Korianderbüsche, Mais und Bananen. Die Roosevelt Avenue wird auch Korridor genannt: Vorhof der USA, Asphaltufer, auf das neue Emigrantenwellen schwappen. Seit zwei Dekaden ist diese Straße der Spiegel lokaler Turbulenzen auf dem Globus, nach jeder Katastrophe kommen Geflohene im Korridor an und kapseln sich in dessen Nischen ein. Italiener, Griechen und Deutsche aus der ersten Einwanderungswelle haben das Viertel schon längst in Richtung Manhattan verlassen. Elizabeth Mora-Mass kam vor 17 Jahren aus Kolumbien hierher. Wegen eines brisanten Artikels wurde sie mit dem Tode bedroht worden und hatte Zeit ihr Land verlassen müssen. Doch sie beschreibt weiterhin in schonungslosen Reportagen das Leben der Einwanderer im Korridor und prangert Ungerechtigkeiten an. So stieß Elizabeth Mora-Mass etwa auf das Schicksal einer jungen Ecuadorianerin, die wie viele andere Einwanderer auf ihrer Suche nach dem amerikanischen Traum zum Opfer eines "Kojoten" wurde - eines Menschenschleppers, der sie mit falschen Versprechungen und für Tausende von Dollar illegal nach New York gebracht hat. Auf der Fährte des Kojoten durchquert die Journalistin die Welt der Roosevelt Avenue und stößt dabei auf immer neue Schicksale und Geschichten. DE 2004'
