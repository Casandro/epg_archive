  title: Planet Weltweit - Die einsamen Mönche von Oelenberg
  subtitle: Planet Weltweit - Die einsamen Mönche von Oelenberg
  description: Im Jahr 1825 sind die Trappistenmönche in das Kloster Oelenberg im südlichen Elsass eingezogen. Seitdem verläuft das Leben hier nach den gleichen strengen Regeln des Heiligen Benedikt. "Ora et labora - Bete und arbeite" lautet der Grundsatz für die Benediktinermönche. Ende des 19. Jahrhunderts gehörten über 200 Geistliche der Abtei von Oelenberg an. Heute sind sie nur noch 14. DE 2008
