  title: Planet Weltweit - Auf Schlangenjagd in Bangkok
  subtitle: Planet Weltweit - Auf Schlangenjagd in Bangkok
  description: Bangkok, Thailand. Jährlich rufen über 35.000 Menschen die Rettungsdienste, um eine Schlange aus ihrem Haus zu holen. Pinyo Pukpinyo von der Feuerwache Bang Khen ist einer der bekanntesten Schlangenfänger der Stadt und hat einen ganz eigenen Stil im Umgang mit den Reptilien entwickelt. GEO Reportage hat ihn bei seinen Einsätzen begleitet. Für die meisten Einwohner Bangkoks gehören Schlangen und andere Reptilien zum Alltag. Gefährliche wie Pythons oder Kobras ebenso wie ungiftige Regenbogenschlangen oder Warane. Sie verhalten sich ihrer Natur gemäß als Jäger, die ihren Beutetieren nachstellen und folgen Ratten, Katzen oder Hühnern bis in die Behausungen der Menschen. Abflussleitungen, gekippte Fenster oder kleinste Auslassungen in Dächern und Wänden reichen den wendigen Tieren, um in Häuser und Schuppen zu dringen. Speziell geschulte Schlangenfänger der Feuerwehr entfernen die Tiere dann, um sie an weit entfernten Orten wieder in die Freiheit zu entlassen. Da die Tiere unter Schutz stehen, dürfen sie nicht getötet werden. Einer von ihnen ist Pinyo Pukpinyo, der sich im Laufe der letzten Jahre einen ganz besonderen Ruf erworben hat. Viele Menschen glauben, Pinyo würde mit den Tieren "reden", wenn er selbst hochgiftige Kobras scheinbar gefahrlos in die Hand nimmt. Dabei beruht Pinyos Prinzip nur auf "Beobachten und Verstehen". Dieses Motto versucht er auch seinen Schülern nahezubringen. Einer von ihnen ist Ton, der sich noch in der Ausbildung befindet und Pinyo unterstützen soll, wenn er etwa einen vier Meter langen Python aus dem Schlafzimmer einer Familie oder eine Kobra aus der Waschmaschine eines Altersheimes holt. Immer wieder ermuntert Pinyo seinen Schützling, sich den Tieren ohne Angst zu nähern. Doch der Umgang mit den Reptilien ist nicht einfach und erfordert neben der richtigen Technik auch Mut und Entschlusskraft. Eine Einstellung, die sich schwer erlernen lässt. DE 2011
