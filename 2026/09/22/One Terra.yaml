  title: Planet Weltweit - Indien, ein Himmel voller bunter Drachen
  subtitle: Planet Weltweit - Indien, ein Himmel voller bunter Drachen
  description: Am Neujahrsfest verwandelt sich die westindische Stadt Ahmadabad in die Hauptstadt der Drachen. Tausende Papierdrachen steigen in die Luft, begleitet von Feuerwerk und guten Wünschen. Wie die meisten Einwohner fiebert auch der 15-jährige Mohit monatelang auf dieses Fest hin. Einen ganzen Stapel neuer Drachen hat er dafür gekauft, die länger in der Luft bleiben sollen als die der Konkurrenz. Dafür präpariert Mohit sie auf ganz besondere Weise. GEO Reportage hat ihn bei seinen Vorbereitungen begleitet. Drachensteigen gehört zu den beliebtesten Freizeitbeschäftigungen im westindischen Bundesstaat Gujarat. Es ist Wettkampf und Leidenschaft. Besonders deutlich wird dies am Neujahrsfest, dem sogenannten Uttarayan, das traditionell im Januar stattfindet. Tausende von Flugkörpern steigen dann in den Himmel und ringen um die Lufthoheit. Doch die Drachen sollen nicht nur hoch steigen und möglichst lange in der Luft bleiben. Durch speziell mit Glaspulver präparierte Schnüre sollten sie auch die Halterungen der anderen Drachen kappen und diese zum Absturz bringen. Einer der diese Kunst zu einer besonderen Fertigkeit gebracht hat, ist der 15-jährige Mojit Prajapati aus der Stadt Ahmedabad. Das Drachensteigen lernte er von seinem zwei Jahre älteren Bruder Nikhil. Drachen lassen die Geschwister das ganze Jahr steigen. Nun vor dem großen Fest verbringen sie jede freie Minute auf dem Dach ihres Hauses, um ihre Flugtechniken zu perfektionieren. Auch wollen sie, wie die meisten Einwohner Ahmedabads neue Drachen kaufen, die sie am Tag vor den Festlichkeiten aufwendig präparieren. Tausende kleine Werkstätten richten sich ein, um sie herzustellen, Millionen Drachen werden in den Tagen vor Uttarayan verkauft. Zwei Tage dauert das Ereignis, bei dem die Flugdrachen bis in die Nacht hinein den Himmel über Ahmedabad bevölkern. Und Mojit hofft, dass seine Modelle bis zuletzt oben bleiben werden. DE 2019
