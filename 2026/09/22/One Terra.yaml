  title: Planet Weltweit - Highway durch die Arktis
  subtitle: Planet Weltweit - Highway durch die Arktis
  description: |-
    Wer unbedingt mit dem Auto nach Tuktoyaktuk will, muss Geduld haben - falls er Pech hat, neun Monate lang. Das Inuit-Dorf an der Küste von Kanadas Beaufort Sea ist nur wenige Winterwochen lang über eine Straße zu erreichen - sonst gibt es nur eine sehr teure Flugverbindung. Wenn das Eis auf dem Mackenzie River mehr als einen Meter dick ist, beginnt die Straßenwacht mit einem spektakulären Projekt - dem Bau einer knapp 200 Kilometer langen Eisstraße.

    Merven Gruben leitet den Bau der Eisstraße. Der Unternehmer aus Tuktoyaktuk - kurz Tuk genannt - und seine Crews sorgen im ganzen Nordwesten Kanadas für freie Eispisten. Die knapp 200 Kilometer lange Winterpiste zwischen dem Dorf Inuvik und Grubens Heimatort ist eine der nördlichsten und gefährlichsten Straßen der Welt: Sie ist äußerst glatt und im Dunkel der Polarnacht nur schwer erkennbar. Immer wieder kommt es zu Unfällen. Dennoch fiebert das ganze Dorf ihrer Eröffnung entgegen. Die vergängliche Straße ermöglicht den knapp 1000 Einwohnern endlich, einmal rauszukommen. Und das mit dem Auto, nicht mit dem teuren Flugzeug, wie im Rest des Jahres. Dann werden Lebensmittel eingekauft, die auf dem Festland billiger sind - in Tuks Supermarkt kostet eine Packung Müsli knapp 16 Dollar. Es sollen Geschäfte getätigt, Freunde und Verwandte besucht werden. Die örtliche Eishockeymannschaft wartet auf das erste Auswärtsspiel seit neun Monaten. Und nicht zuletzt müssen Weihnachtsgeschenke eingekauft werden. Es sind nur noch wenige Wochen bis Heiligabend.

    Doch in diesem Jahr scheint sich der Bau erstmals zu verzögern. Wegen Schneefall und zu hoher Temperaturen ist das Eis ist noch nicht dick genug, um schwere Fahrzeuge zu tragen. Jeden Tag wird die Eisschicht neu vermessen - die Zeit läuft davon. Merven Gruben und seine Männer stehen mit Schneeschiebern bereit. Bisher konnten sie die Straße immer rechtzeitig zu Weihnachten fertig stellen - sollten sie in diesem Jahr erstmals scheitern?

     DE 2006
