  title: Rund um den Globus - Das Kinderparlament von Rajasthan
  subtitle: Rund um den Globus - Das Kinderparlament von Rajasthan
  description: Tagsüber hütet die 13-jährige Inderin Neraj Jath Ziegen in der dürren, ausgetrockneten Felslandschaft am Rand der Wüste Thar. Nach Sonnenuntergang besucht sie die Abendschule ihres kleinen Dorfes. Und in ihrer knappen Freizeit ist sie Ministerin für Ackerbau und Viehzucht im Parlament der Kinder von Rajasthan. Es wurde gegründet, damit die Kinder das im indischen Rajasthan typische Kastendenken überwinden und die Bedeutung von Demokratie und Rechtsstaatlichkeit erfassen. Etwa 3.000 Kinder aus 150 Schulen wählen das Parlament aus ihren Reihen. In ihrem Amt kümmert sich Neraj zum Beispiel um die Ausstattung der Schulen und die Wasserversorgung in den Dörfern. Das derzeitige Hauptproblem der Menschen der Region ist jedoch die langanhaltende Dürre. Deshalb hat Neraj den Einfall, das traditionelle rajasthanische Puppentheater für ihre Ziele einzusetzen. Doch in der traditionsverhafteten Gesellschaft Rajasthans zählt das Wort einer Frau wenig. Wird es da ein dreizehnjähriges Hirtenmädchen schaffen, die alten Männer für ihre Idee zu gewinnen? DE 2011
