  title: 'Planet Weltweit - Tanganjikasee: Vom Kanonenboot zum Passagierschiff'
  subtitle: 'Planet Weltweit - Tanganjikasee: Vom Kanonenboot zum Passagierschiff'
  description: 'Der Tanganjikasee ohne die "Liemba", das wäre undenkbar. Seit rund zwei Jahrzehnten steuert Kapitän Titus Benjamin das uralte Passagierschiff. Es wurde vor fast 100 Jahren auf der Meyerwerft im norddeutschen Papenburg als Fracht- und Truppentransporter "Graf von Goetzen" entwickelt und gebaut. Die Menschen am ostafrikanischen Tanganjikasee vertrauen Kapitän und Schiff, ohne die alte "Liemba" wäre auf dem längsten Süßwassersee der Welt kein Transport möglich. Alle zwei Wochen startet die "Liemba" zu ihrer Reise von Tansania nach Sambia. Sie fährt von der tansanischen Kleinstadt Kigoma am Nordostufer bis zum sambischen Hafen Mpulungu am Südende des Sees und wieder zurück. Fast 1.000 Kilometer mit über 30 Stopps auf dem offenen See. Häfen gibt es nicht, die Passagiere klettern über Ruder- und Motorboote an und von Bord. Über Fünf Tage und vier Nächte dauert die Reise, wenn alles gut geht. Manchmal aber auch länger: zu viel Fracht, zu viele Passagiere oder ein technischer Defekt - Ursachen für Verzögerungen gibt es genug. Planet ist auf der "Liemba" mitgefahren, hat Besatzung und Passagiere auf ihrer Reise begleitet, und zeigt, warum die "Liemba", dieses eigentlich schon museumsreife, aber immer noch funktionierende Überbleibsel deutscher Kolonialgeschichte, für die Menschen am Tanganjikasee unverzichtbar ist. Der 60jährige Chefmaschinist Mathias Masalu Joseph hält die "Liemba" am Laufen. Während Kapitän Titus Benjamin auf der Brücke das Sagen hat, ist sein Reich der dreckige und laute Maschinenraum, die Herzkammer der Liemba: und das seit 30 Jahren. Eigentlich war er schon in Pension, doch dann holte ihn die Reederei zurück, zumindest für ein Jahr, denn er kennt das Schiff und seine Macken am besten. Doch wie lange können Kapitän Titus Benjamin und Maschinist Mathias Masalu Joseph die "Liemba" noch fit halten? DE 2012'
  ageRating: 6
