  description: „Gorączka w mieście” to dynamiczny serial kryminalny, który zabiera widzów na ulice Los Angeles, gdzie dwaj detektywi Chester "Chase" McDonald (w tej roli Wolf Larson) i August Brooks (grany przez Stevena Williamsa) zmagają się z najtrudniejszymi sprawami kryminalnymi. W duecie balansującym między niebezpieczeństwem a humorem, Chase i August wykorzystują swoją odwagę, charyzmę i błyskotliwość, by rozwiązywać zagadki przestępcze w jednym z najniebezpieczniejszych miast Ameryki. Serial pełen jest akcji, dynamicznych pościgów i emocji, które przyciągają zarówno fanów kryminałów, jak i wielbicieli silnych postaci.
