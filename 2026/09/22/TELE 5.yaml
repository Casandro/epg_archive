  title: Sliders
  subtitle: Das Experiment
  description: |-
    Der abtrünnige Quantenforscher Dr. Oberon Geiger hat die "Sliders" in eine gefährliche Welt geholt. Spezielle Energiebarrieren rund um das Chandler Hotel sollen den eigens geschaffenen Bereich stabilisieren. Aber nun droht das Konstrukt zu kollabieren! Außerdem räumt der Wissenschaftler ein, dass sein Experiment der Quantenverschmelzung im makroskopischen Maßstab nicht funktioniert. Unter dem Vorwand, die Verschmelzung von Mallory und Quinn rückgängig zu machen, verfolgt Geiger erneut eine geheime Agenda, die lediglich seiner Selbsterhaltung dient.
    USA 2000
