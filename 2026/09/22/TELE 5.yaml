  title: Sliders
  subtitle: Der letzte Slide
  description: |-
    Die "Sliders" erreichen eine Paralleldimension, in der ihre Abenteuer und Heldentaten frenetisch gefeiert werden. Marc "der Seher" LeBeau (Roy Dotrice) hat sogar eine TV-Show über die Vortex-Reisenden ins Leben gerufen. Rund um Quinn Mallory und die anderen "Sliders" ist eine beachtliche Fangemeinde entstanden! Allerdings macht LeBeau eine düstere Prophezeiung, die das Ende der Gruppe bedeuten könnte. Da eine gemeinsame Weiterreise kaum kalkulierbare Risiken birgt, entscheidet sich Rembrandt zu einem letzten Akt der Selbstlosigkeit: Er transportiert alleine eine tödliche Biowaffe in die Welt der Kromaggs.
    USA 2000
  widescreen: true
