  title: Hechtangeln mit Oberflächenködern im kleinen Bach
  subtitle: Hechtangeln mit Oberflächenködern im kleinen Bach
  description: Kleinste Bäche halten oft die ein oder andere dicke Überraschung für uns Angler bereit. Neben Forellen und Döbeln sind es vor allem Hechte die hier ihr unwesen Treiben. Selbst der kleinste Unterstand kann von einem dicken Esox genutzt werden um auf Jagt zu gehen und Beute zu machen. Gerade diese Gewässer sind prädestiniert um sie mit Oberflächenködern zu befischen. Egal ob Flachwasser, Pflanzenfelder oder Totholz, diese Stellen sind die absoluten Hotspots. Die Attacken der Hechte sind Brachial, sie haben in diesen kleinstgewässern gelernt ihre Nahrung direkt an der Oberfläche zu schlagen. Wie aus dem nichts schiessen sie mit voller Gewalt auf die Stickbaits welche durch ihren verführerischen links - rechts lauf die druckwellen im ganzen Gewässer verteilen. Das macht gerade diese Fischerei unfassbar spannend und effektiv. DE 2019
