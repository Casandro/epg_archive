  title: Sind Wespen Gamechanger der Evolution?
  subtitle: 42 - Die Antwort auf fast alles
  description: 'Auf der Picknickdecke ist sie unsere natürliche Antagonistin: die Wespe. Doch wer sie nur als Plagegeist abtut, unterschätzt sie gewaltig. Wespen zählen zu den ersten sozialen Arten der Erde und helfen uns, eines der größten Rätsel der Evolution zu lösen: Warum gibt es Altruismus? Laut Charles Darwin und seinem Prinzip "Survival of the fittest" dürfte er eigentlich gar nicht existieren - doch Wespen beweisen das Gegenteil. Warum sie mehr können als nur stören, zeigt diese Folge von "42 - Die Antwort auf fast alles".'
