  title: rbb24 - Der Talk
  subtitle: Berlin hat gewählt - und jetzt?
  description: |-
    Die Berlinerinnen und Berliner haben gewählt. Gewinner und Verlierer stehen fest. Aber die eigentlich spannende Frage beginnt erst nach dem Wahlsonntag: Was wird jetzt aus Berlin? Wer bestimmt die nächsten fünf Jahre den Kurs in der Hauptstadt? Welche Parteien können miteinander regieren? Und vor allem: Mit welchem Plan für Wirtschaft, Mobilität, Sicherheit und Wohnen?
    Volker Wieprecht diskutiert bei "rbb24 - Der Talk" mit:
    * Julia Reuschenbach (Politikwissenschaftlerin)
    * Sven Weickert (UVB Berlin Brandenburg)
    * Boris Hermel (rbb, Journalist)
