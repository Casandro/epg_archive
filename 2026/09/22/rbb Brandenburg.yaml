  title: Giraffe, Erdmännchen & Co. (221)
  subtitle: Zoogeschichten aus Frankfurt und Kronberg
  description: 'Große Aufregung im Frankfurter Zoo: Tigerbaby Berani darf mit seiner Mutter Malea zum ersten Mal ins Freie. Alle sind da: der Zoodirektor, die Presse, Besucher. Pfleger Daniel Höflich verstreut Curry, um Mutter und Kind ins Außengelände zu locken. Endlich ist es soweit. Die Schieber werden geöffnet. Mutter Malea kommt sofort - doch Berani ist schüchtern. Wo bleibt die Kleine? Auch im Opel-Zoo in Kronberg wird ein Gehege belagert: Die Tragopane, eine asiatische Fasanenart, werden geimpft, und Tierärztin Dr. Uta Westerhüs gibt ihren neugierigen Zuschauern eine kleine Lehrstunde.'
