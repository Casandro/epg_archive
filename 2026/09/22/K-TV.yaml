  title: Hochsensibilität (Folge 5)
  subtitle: Spiritualität
  description: Hochsensibilität ist eine Gabe - für sich selbst und für die anderen. Doch gilt es zu lernen, gut mit dieser umzugehen. Die Unterscheidung der Geister und der Bezug zum lebendigen Gott ist gerade bei hochsensiblen Menschen entscheidend, da der Grad der persönlichen Komfortzone schmäler als bei anderen ist und sie daher leichter angreifbar sind. In dieser Vortragsreihe setzen wir uns mit Stärken und Herausforderungen dieses Wesenszuges auseinander und erfahren wertvolle Einsichten und Hilfestellungen. Ezerzitien mit Mag. Dr. Reinhard Pichler (Theologe und Psychotherapeut). Aufgezeichnt im Juni 2026, Haus St. Ulrich in Hochaltingen.
- eventId: 1029747
  start: 2026-09-22T02:00:00Z
  stop: 2026-09-22T02:15:00Z
  title: Was ist das geistige Erbe von Benedikt XVI.?
  subtitle: Spiritualität
  description: Univ.-Prof. em. DDr. Hanna-Barbara Gerl-Falkovitz ist Philosophin, Sprach- und Politikwissenschaftlerin. Nach ihrer Tätigkeit als Studienleiterin auf Burg Rothenfels/Main, akademische Oberrätin am Seminar für Christliche Weltanschauung, Religions- und Kulturtheorie der Universität München, sowie als Privatdozentin in Bayreuth, Tübingen und Eichstätt, folgte eine Professur für Philosophie an der Pädagogischen Hochschule in Weingarten/Bodensee. Von 1993 bis 2011 war sie Lehrstuhlinhaberin für Religionsphilosophie und vergleichende Religionswissenschaft an der Technischen Universität Dresden. Seit 2011 ist sie Leiterin des EUPHRat (Europäisches Institut für Philosophie und Religion) in Heiligenkreuz bei Wien. Prof. Gerl-Falkovitz ist u.a. Trägerin des Joseph-Pieper Preises, des Edith-Stein-Preises, des Augustin-Bea-Preises sowie des Ratzinger Preises. Die Tagespost beschreibt Hanna-Barbara Gerl-Falkovitz passend als "ein Leuchtfeuer im Nebel der postmodernen Landschaft" und "eine der wichtigsten katholischen Stimmen in Europa".
- eventId: 1029748
  start: 2026-09-22T02:15:00Z
  stop: 2026-09-22T02:45:00Z
  title: 'Über Gott und die Welt: Beichte & Buße'
  subtitle: Gespräch
  description: Wieso und wie oft sollte man beichten gehen? Was hat es mit der Bußübung auf sich? Und welche Sünden sind eigentlich am Schlimmsten? Pater Dominicus Trojahn OCist im Gespräch mit Studenten der Phil.-Theol. Benedikt XVI. Heiligenkreuz.
- eventId: 1029749
  start: 2026-09-22T02:45:00Z
  stop: 2026-09-22T03:15:00Z
  title: 'Kambodscha: Die erste Generation'
  subtitle: Dokumentation
  description: 'Kambodscha: Die erste GenerationLun Kimleang (Tänzerin), Oum Samean (Musiker) and Bang Sovanna (Journalist) sind drei junge Kambodschaner, die erlebt haben, wie der katholische Glaube ihre Leben verändert hat.Sie leben in schwierigen und herausfordernden Lebensumständen. Der Glaube jedoch gibt ihnen eine Vision, die voll Hoffnung und Liebe ist. "Die erste Generation" präsentiert die Früchte der katholischen Kirche, die auch eine Wiedergeburt dieser Nation repräsentieren.Es sind bereits Jahrzehnten vergangen, seit das verheerende Regime von Pol Pot die berühmt berüchtigten Felder des Todes hervorbrachte, die Auswirkungen einer solchen Brutalität jedoch belasten jedoch nach wie vor die Seele dieses asiatischen Landes.'
- eventId: 1029750
  start: 2026-09-22T03:15:00Z
  stop: 2026-09-22T03:45:00Z
  title: Ich werde angegriffen, weil ich die Wahrheit sage
  subtitle: Gespräch
  description: Abt Nikodemus Schnabel OSB, Dormitio Abtei in Jerusalem, im Gespräch mit Pfarrer Dr. Thomas Maria Rimmel. Aufgezeichnet im Rahmen des deutschen Katholikentages 2026 in Würzburg.
- eventId: 1029751
  start: 2026-09-22T03:45:00Z
  stop: 2026-09-22T04:00:00Z
  title: 'Spirit: Engel an meiner Seite: Glaube, Schutz und Begleitung'
  subtitle: Gespräch
  description: 'Mit Pater Engelbert Recktenwald FSSP, Autor und Mitgründer der Priesterbruderschaft St. PetrusModeration: Volker NiggewöhnerGibt es Engel wirklich oder sind sie nur schöne religiöse Bilder? Warum sprechen so viele Menschen von unerklärlichen Bewahrungen, inneren Eingebungen oder dem Gefühl, nicht allein zu sein? Gemeinsam mit Pater Engelbert Recktenwald geht diese Ausgabe von SPIRIT der Frage nach, was die Kirche über Engel und Schutzengel lehrt - und welche Rolle sie im geistlichen Leben spielen. Dabei wird deutlich: Engel sind keine harmlosen Dekofiguren, sondern Boten Gottes und Begleiter des Menschen auf seinem Weg durchs Leben.'
