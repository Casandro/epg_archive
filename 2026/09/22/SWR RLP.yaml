  description: AnnPhie Fritz führt ein Leben zwischenzwei Metropolen. Von der Schauspielerei in Wien führte sie ein Erasmus-Stipendium nach Berlin. Aktuell moderiert und spielt sie beim Wiener Kultursommer. Dieses Jahr begeisterte sie bereits bei der St. Ingberter Pfanne. Auf dem Plan stand eine unterhaltsame Comedy aus feministischer Perspektive und pointierten Beobachtungen des Alltags. Auf der Bühne spielt sie theatralisch mit Themen der Identität und Selbstzweifel. Die Pointen kommen keinesfalls zu kurz. Das Erfolgsrezept von AnnPhie Fritz ist und bleibt dabei Sympathie.
