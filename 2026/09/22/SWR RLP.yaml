  description: 'Viele träumen vom Eigenheim, doch das Bauen in Deutschland ist so anspruchsvoll wie selten zuvor: Materialpreise schwanken, Fachkräfte fehlen, Zeitpläne geraten ins Wanken. Auch deshalb erleben Fertighäuser einen Boom - denn sie versprechen Tempo, Planbarkeit und scheinbare Kostensicherheit. In "Ausgerechnet Fertighaus" will Reporter Daniel Aßmann wissen, was ein Fertighaus tatsächlich kostet und inwiefern die Versprechen der Anbieter der Realität standhalten.'
