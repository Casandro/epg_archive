  title: Seriál týdne pod Ještědem
  description: Rehabilitace. V Seriálu týdne se věnujeme našemu zdraví, konkrétně rehabilitaci. Tentokrát z trochu jiného pohledu než běžného lázeňského pobytu. Doktorka Jitka Ferbrová z Rehabilitačního ústavu Bělohrad nám vysvětluje mnohé pojmy, se kterými se můžeme v rámci lázeňské péče setkat.
