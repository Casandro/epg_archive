  title: Rentnercops (16)
  subtitle: Immer wieder geht die Sonne auf
  description: 'Der Galerist Patrick Wilke wird erschlagen in seiner Wohnung aufgefunden. Anika, die Frau des Toten, gerät durch die Aussage von Wilkes Kompagnon Melsheimer unter Mordverdacht, kann sich aber an die Tatnacht überhaupt nicht mehr erinnern. Sie kann daher nicht ausschließen, tatsächlich die Täterin zu sein. Für Edwin eine klare Sache: Eigenmächtig verhaftet er die Frau und zieht damit nicht nur Günters, sondern vor allem auch Vickys Unmut auf sich. Und das wird Konsequenzen haben.'
