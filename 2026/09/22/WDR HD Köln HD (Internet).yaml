  title: Wer weiß denn sowas? (873)
  subtitle: 'Gäste: Mario Kotaska und Ralf Zacherl'
  description: Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.
- eventId: 1117177
  start: 2026-09-22T08:25:00Z
  stop: 2026-09-22T09:10:00Z
  title: Garten & Lecker
  subtitle: Schrebergarten mal anders in Dortmund
  description: Die dritte Gartenreise führt ins Ruhrgebiet. Im Schatten des Fußballstadions hat Psychologin Nabila Pelz aus einem kleinen Schrebergarten ein grünes Zuhause geschaffen. Mit ihrem Mann Thomas und ihren Töchtern Ida (5) und Charlotte (1) verbringt sie jede freie Minute in ihrem Kleingarten. Nabila baut Gemüse, Obst und Kräuter an. Das Staudenbeet ist ein Schlaraffenland für Insekten und aus Dahlien und selbst gezogenen Schnittblumen gestaltet sie üppige Sträuße. Nabilas Party-Motto lautet "Orient meets Ruhrgebiet".
  genre:
  - '144'
- eventId: 1117810
  start: 2026-09-22T09:10:00Z
  stop: 2026-09-22T09:55:00Z
  title: 'Expedition in die Heimat: Mit dem Hausboot auf dem Saarkanal'
  subtitle: 'Moderation: Arndt Reisenbichler'
  description: Ob in die Nordsee oder ins Mittelmeer, auf Frankreichs Kanälen kommt man überall hin. Ein kleines Stück dieses großen, fließenden Systems ist der Saarkanal. Früher hieß er Saar-Kohle-Kanal, denn sein Zweck war der Transport der Kohle aus dem Saarland zu den Industriestandorten in Frankreich. Heute ist der Kanal mit seinen 27 Schleusen ein Paradies für Freizeitkapitän:innen. Arndt Reisenbichler begleitet einen Freizeitkapitän auf dessen historischem Hausboot.
- eventId: 1118521
  start: 2026-09-22T09:55:00Z
  stop: 2026-09-22T10:45:00Z
  title: Elefant, Tiger & Co. (415)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: Giraffenbulle Max hat ein Geheimnis - sein Gewicht. Bisher können die Pfleger nur schätzen, wie viel der Langhals wiegt. Und die Prognosen schwanken sehr. Darum soll Max nun auf die Waage. Das ist gar nicht so leicht mit langen Beinen. Mit einer Attrappe wird die Gewichtskontrolle vorbereitet. Fehlt bloß noch Max. Wird der ansonsten brave Musterschüler mitspielen?
