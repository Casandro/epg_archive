  start: 2026-09-22T12:00:00Z
  stop: 2026-09-22T13:00:00Z
  title: SWR Aktuell Langstrecke
  description: "14:00\nDer KI - Podcast: GPT6-Astra - und: Müssen wir KI aufhalten?\nDas neue ChatGPT beeindruckt mit selbstgebauten Spielen und fertig eingerichteten Wohnungen. Gleichzeitig kommt heraus, wie OpenAIs KI-Agenten heimlich zusammenarbeiten und fremde Webseiten kapern. Marie und Fritz diskutieren: Wird KI so gut, dass wir ihre Entwicklung stoppen sollten?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n \n14:30\nSWR1 Leute mit Dr. André T. Nema | Mediziner\nSo hilft Künstliche Intelligenz in der Medizin\nNicht alles, was technisch legal ist, ist im Umgang mit Daten und Technologie auch legitim. Genau an dieser Schnittstelle zwischen rasanter Digitalisierung, Künstlicher Intelligenz und menschlicher Verantwortung bewegt sich Dr. André T. Nemat. Er ist Herz- und Thoraxchirurg sowie Gründer des Institute for Digital Transformation in Healthcare (IDiH) an der Universität Witten/Herdecke. Als einer der führenden Köpfe im Bereich der digitalen Ethik plädiert er leidenschaftlich für ethische Leitplanken im menschenzentrierten Umgang mit Daten und Algorithmen.\nAber auch wenn mit Hilfe von KI Diagnosen präziser gestellt werden als vom menschlichen Auge oder OP-Roboter in der Chirurgie bei millimetergenauen Schnitten helfen - André T. Nemat betont, dass der letzte Schritt immer analog bleibt. Er hat die Vision einer empathischen Tech-Medizin und erklärt, warum der digitale Wandel im Krankenhaus uns alle betrifft.\nModeration: Jens Wolters\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
