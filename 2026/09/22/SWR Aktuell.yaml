- eventId: 546078
  start: 2026-09-22T16:30:00Z
  stop: 2026-09-22T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Transrapid, Flugtaxis, Hyperloop - Warum es neuartige Verkehrstechnik so schwer hat
  description: |-
    Von Dirk Asendorpf
    In Deutschland soll eine nationale Hyperloop-Referenzstrecke entstehen - so steht es im schwarz-roten Koalitionsvertrag. Passagiere und Fracht sollen in magnetisch angetriebenen Kabinen im Flugzeugtempo durch ein Vakuum-Rohr flitzen. Die schon vor 200 Jahren erdachte Technik hat viele Vorteile - in der Theorie. Praktisch wurde sie noch nie verwirklicht. Auch andere Fortbewegungstechnologien wie Transrapid, Flugtaxis oder Fracht-Zeppeline haben sich in der Breite bisher nicht durchgesetzt. Warum ist es so schwer, neue Verkehrstechnik neben Straße, Schiene, Flugzeug und Schiff zu etablieren?
- eventId: 546079
  start: 2026-09-22T17:00:00Z
  stop: 2026-09-22T18:00:00Z
  title: Der Tag
  description: Die Alzheimer-Demenz bleibt eine der größten gesundheitlichen und gesellschaftlichen Herausforderungen unserer Zeit. Allein in Deutschland leben derzeit rund 1,8 Millionen Menschen mit einer Demenzerkrankung, der Großteil davon leidet an Alzheimer. Doch das Verständnis der Krankheit hat sich in den letzten Jahren grundlegend gewandelt - weg von der reinen Verwaltung des Verfalls, hin zu präziser Früherkennung und deutlich unterstützenden Therapien. Trotz des medizinischen Fortschritts aber bleibt der Versorgungsalltag eine Mammutaufgabe.
  subtitle: Was bleibt, wenn die Erinnerung geht? Leben mit Demenz
