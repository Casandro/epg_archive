  title: Notre-Dame de Paris, le chantier du siècle
  subtitle: La quête de la hauteur S01 E01. Comment reconstruire Notre-Dame pour les générations futures ? Début d'un chantier d'une envergure inédite.
  genre:
  - '32'
  description: 'Comment reconstruire Notre-Dame pour les générations futures ? Quels secrets a-t-elle à nous livrer sur son histoire et sur les savoir-faire anciens utilisés pour son érection et sa conservation au fil des siècles ? Après l''incendie qui a failli la détruire, la phase de consolidation de l''édifice étant achevée, les trois volets de la série documentaire réalisée par Vincent Amouroux (L''odyssée interstellaire, Notre véritable 6e sens) nous emmènent auprès des archéologues, des historiens de l''art, des géologues, des ingénieurs structure et numérique, mais aussi des spécialistes du verre, du bois, du métal et de l''acoustique, mobilisés par ce chantier d''une envergure inédite. Une aventure humaine et scientifique exceptionnelle, au cours de laquelle sont explorés pour la première fois, de la flèche aux fondations, des espaces de la cathédrale restés cachés pendant plus de huit siècles. Réalisateur: Vincent Amouroux. Des acteurs: Sarah-Jane Sauvegrain (la narratrice), Marc Viré (lui-même), Dorothée Chaoui-Derieux (elle-même), Pascal Prunet (lui-même), Yves Gallet (lui-même) (2023)'
