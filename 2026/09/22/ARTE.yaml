  title: Notre-Dame de Paris, le chantier du siècle (1/3) - La quête de la hauteur
  description: |-
    Série documentaire de Vincent Amouroux (France, 2022, 53mn) Dans la nuit du 15 au 16 avril 2019, le feu a ravagé Notre-Dame de Paris. Passé l'effroi et la phase de consolidation de l'édifice, scientifiques, ingénieurs et artisans d'art ont entamé un spectaculaire travail. Premier volet : les experts en charge de la restauration sauront-ils retrouver un savoir-faire vieux de 800 ans et le préserver pour les siècles à venir ?

