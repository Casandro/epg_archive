  description: 'Après les premiers temps de l''inquisition, l''Eglise, pour continuer à asseoir son pouvoir, doit trouver de nouveaux opposants. La sorcellerie apparaît comme une coupable idéale, objet de témoignages particulièrement imagés (en réalité rédigés par les inquisiteurs eux-mêmes) et d''une foule de procès. A l''inquisition médiévale succèdent les inquisitions espagnole et portugaise, déployant leur arsenal répressif avec une conviction sans égale. Le système s''incarne désormais dans un tribunal central qui fonctionne plus efficacement que la justice séculière. Après avoir ciblé les juifs et les musulmans convertis, la notion d''hérésie s''étend à des domaines sans rapport avec la religion, comme la fabrication de fausse monnaie, la contrebande ou l''homosexualité. Réalisateur: Stan Neumann. Des acteurs: Denis Lavant (le narrateur) (2026)'
