  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    DNA-Experte Dr. Harald Schneider vom Hessischen Landeskriminalamt kann den Mord an der zweijährigen Elora im hessischen Babenhausen aufklären.

    Als Dr. Harald Schneider eingeschaltet wird, ist ihm klar: Er muss die gesamte Palette der Kriminaltechnik aufbieten, um den Beschuldigten die Tat nachweisen zu können.
    HD-Produktion
- eventId: 692996
  start: 2026-09-22T05:30:00Z
  stop: 2026-09-22T06:15:00Z
  title: Ermittler!
  subtitle: Im Kopf der Täter
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Keine Mordermittlung ist wie die andere. Es gibt Fälle, bei denen Täter aus ungewöhnlichsten Motiven töten. Die Ermittler versuchen daher, sich in den Kopf der Mörder zu versetzen.

    In Frankfurt am Main vermuten Timo Bürstell und Florian Frank, dass ein Mann seine Ehefrau ermordet und ihre Leiche im Müll entsorgt hat. Dieser ist schon auf einer Mülldeponie verbrannt worden. Die Ermittler geben nicht auf und durchforsten die Schlacke nach Knochen.
    HD-Produktion
- eventId: 694502
  start: 2026-09-22T06:15:00Z
  stop: 2026-09-22T07:00:00Z
  title: Ermittler!
  subtitle: Tödliche Habgier
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Es ist eines der häufigsten Mordmotive überhaupt: die Gier, sich an anderen zu bereichern. Die Habgier als Triebfeder eines brutalen Verbrechens.

    Im November 2020 alarmiert ein 37-jähriger Mann im niedersächsischen Helmstedt die Rettungskräfte: Seine Frau liege tot in der Wohnung. Sie sei von einem Einbrecher ermordet worden. Die Ermittler sind skeptisch, ob es den Einbrecher wirklich gab.
    HD-Produktion
- eventId: 694503
  start: 2026-09-22T07:00:00Z
  stop: 2026-09-22T07:43:00Z
  title: Ermittler!
  subtitle: Tödliche Begegnung
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Eine Frau wird erschossen, eine andere erstickt - und eine dritte verschwindet spurlos. Die Ermittler versuchen bei drei Morden, Licht ins Dunkel zu bringen und die Täter zu fassen.

    Düsseldorf 1993: Andrea B. wird in ihrer Videothek ermordet. In Berlin wird Doris K. an ihrem Arbeitsplatz erschossen - vor den Augen ihrer geschockten Kollegen. In Limburg verschwindet Rahel M. plötzlich an Weihnachten 2022. Drei lange ungeklärte Fälle.
    HD-Produktion
