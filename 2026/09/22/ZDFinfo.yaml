- eventId: 695040
  start: 2026-09-22T07:45:00Z
  stop: 2026-09-22T08:30:00Z
  title: Ermittler!
  subtitle: Ausgeliefert
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Hilflos ausgeliefert zu sein, ist eines der schlimmsten Gefühle, die Opfer bei Straftaten empfinden. Täter haben oft keine Empathie, umso mehr kämpfen die Ermittler für eine gerechte Strafe.

    In Rheinland-Pfalz haben Ermittler einen ungeheuerlichen Verdacht: Haben Pfleger ihre Patienten nicht nur gedemütigt, sondern getötet? In Aurich wird eine Frau offenbar wegen Bargeld ermordet. Doch die Untersuchung bringt für die Ermittler eine unerwartete Wende.
    HD-Produktion
- eventId: 697011
  start: 2026-09-22T08:30:00Z
  stop: 2026-09-22T09:15:00Z
  title: Ermittler!
  subtitle: Eiskalt geplant
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Die 43-jährige Susanne F. wurde zu Tode gequält. Ins Visier der Ermittler gerät schnell ein Ehepaar, das auf einem Bauernhof in Höxter-Bosseborn lebt. Wurde die Frau dort gefangen gehalten?

    Norbert Freier von der Polizei Bielefeld übernimmt den Fall. Gemeinsam mit seinen Kollegen fährt er in den Saatweg 6 nach Höxter, um Angelika und Wilfried W. festzunehmen. Die nun folgenden Ermittlungen führen ihn tief hinab in die Abgründe der menschlichen Psyche.
    HD-Produktion
- eventId: 697012
  start: 2026-09-22T09:15:00Z
  stop: 2026-09-22T10:00:00Z
  title: Schuld & Sühne mit Paulina Krasa
  subtitle: 'Ein düsterer Verdacht: Der Fall Dorota G.'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Nach einem Streit mit ihrem Ehemann verschwindet Dorota G. spurlos. Die Polizei sucht mit Hundertschaften und Spürhunden nach ihr. Doch die Mutter scheint wie vom Erdboden verschluckt.

    Die Aachener Mordkommission geht bald von einem Tötungsdelikt aus. Schnell fällt der Verdacht auf Dorotas Ehemann. Doch der schweigt, und handfeste Beweise, dass er mit dem Verschwinden zu tun hat, gibt es nicht. Der Fall droht zu einem Cold Case zu werden.
    HD-Produktion
- eventId: 697013
  start: 2026-09-22T10:00:00Z
  stop: 2026-09-22T10:45:00Z
  title: Schuld & Sühne mit Paulina Krasa
  subtitle: Der Mann mit der Maske
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Der Rentner Rainer M. verschwindet spurlos. Als ein Maskierter Geld von dessen Konto abhebt und ein fragwürdiges Testament auftaucht, verdichten sich die Hinweise auf ein Verbrechen.

    Im Haus des Vermissten entdeckt die Polizei zahlreiche Blutspuren. Wurde Rainer M. dort ermordet? Die Kriminalpolizei Wiesbaden beginnt eine aufwendige Spurensuche. Doch belastbare Beweise fehlen, und von dem allein lebenden Rentner fehlt weiterhin jede Spur.
    HD-Produktion
- eventId: 700257
  start: 2026-09-22T10:45:00Z
  stop: 2026-09-22T11:30:00Z
  title: Panzer!
  subtitle: Der Erste Weltkrieg
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2017
    Der Panzer ist eine Idee, so alt wie der Krieg. Welcher Soldat wünscht sich nicht, unverwundbar zu sein, beweglich - und trotzdem kämpfen zu können?

    Anlässlich des 100. Jahrestages der ersten großen Panzerschlacht am 20. November 1917 begibt "Panzer!" sich auf die Spur dieser Idee - von den Ursprüngen bis heute - und wagt einen Blick in die Zukunft.
    HD-Produktion
- eventId: 700258
  start: 2026-09-22T11:30:00Z
  stop: 2026-09-22T12:15:00Z
  title: Panzer!
  subtitle: Der Zweite Weltkrieg
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2017
    Der Panzer ist die prägende Waffe des 20. Jahrhunderts. Entworfen aus den Erfahrungen der Grabenkämpfe des Ersten Weltkrieges, wurde er im Zweiten Weltkrieg zum entscheidenden Faktor.

    Doch die Wirklichkeit für die Panzerbesatzungen der kriegsführenden Nationen war weit entfernt von den heroisierenden Darstellungen der Propaganda. Qualvolle Enge, Angst und ohrenbetäubender Lärm prägten den Dienst in den stählernen Kolossen.
    HD-Produktion
- eventId: 700259
  start: 2026-09-22T12:15:00Z
  stop: 2026-09-22T13:00:00Z
  title: Panzer!
  subtitle: Werkzeug der Unterdrückung
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2017
    Im Kalten Krieg müssen sich Panzer mit Waffen wie Raketen und Atombomben die Hauptrolle teilen. Doch kaum ein anderes Kriegsgerät wirkt so furchteinflößend wie ein rollender Panzer.

    Obwohl in Schlachten leicht angreifbar, sind Panzer im Kalten Krieg ein wichtiger Teil der Abschreckungsstrategie. Doch die rollenden Ungetüme dienen häufig der Unterdrückung von zivilem Ungehorsam und werden nicht selten auch gegen die eigene Bevölkerung eingesetzt.
    HD-Produktion
- eventId: 701963
  start: 2026-09-22T13:00:00Z
  stop: 2026-09-22T13:45:00Z
  title: Krieg der Zukunft
  subtitle: Kampf am Boden
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Europa ist beunruhigt. Wie bedrohlich ist Putins Armee? Die Militärs sind in Alarmbereitschaft. Jetzt wird wieder aufgerüstet - aber wie könnte er aussehen, der Krieg der Zukunft?

    Drohnen, künstliche Intelligenz, automatisierte Waffensysteme, beim Militär wird an ganz neuen Waffen gearbeitet. Das Schlachtfeld der Zukunft wird vom Computer aus gesteuert. Lassen sich so Kriege gewinnen? Worauf kommt es wirklich an?
    HD-Produktion
- eventId: 704113
  start: 2026-09-22T13:45:00Z
  stop: 2026-09-22T14:30:00Z
  title: Krieg der Zukunft
  subtitle: Schlacht über den Wolken
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Es herrscht wieder Krieg in Europa. Russlands Angriff auf die Ukraine zeigt, dass die Fähigkeit zu konventioneller Kriegsführung in der Verteidigung eine Rolle spielt.

    Am Himmel bestimmen zukünftig Drohnen und moderne Kampfjets die Möglichkeiten, eine Attacke wirksam zu unterbinden. Luftüberlegenheit und die Abwehr von Attacken mit Gleitbomben und Raketen bestimmen die Überlegungen etwa der NATO.
    HD-Produktion
- eventId: 704114
  start: 2026-09-22T14:30:00Z
  stop: 2026-09-22T15:15:00Z
  title: Krieg der Zukunft
  subtitle: Kampf im Weltall
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2026
    Was einst reine Science-Fiction war, rückt zunehmend in den Fokus globaler Machtpolitik: ein möglicher Krieg im Weltall. Wie gut ist die Bundeswehr auf solch ein Szenario vorbereitet?

    Anti-Satelliten-Tests, Cyberangriffe und die Militarisierung des Weltraums zeigen: Der nächste Krieg könnte weit über unseren Köpfen stattfinden. Die großen Mächte investieren schon jetzt Milliarden Dollar in die Aufrüstung des Orbits.
    HD-Produktion
- eventId: 704115
  start: 2026-09-22T15:15:00Z
  stop: 2026-09-22T16:00:00Z
  title: Krieg der Zukunft
  subtitle: Drohnen - Kampf der Maschinen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2026
    Sie schweben nahezu lautlos über Städte, Landschaften und Grenzen hinweg: Drohnen. Sie stellen eine ganz neue Gefahr dar. Sie können aufklären, aber auch bewaffnet sein.

    Im Ukrainekrieg zeigt sich die tödliche Gefahr, die von Drohnen ausgeht. Seitdem sind auch die Militärs im Westen alarmiert. Jetzt wird nachgerüstet. Drohnen jeder Art stehen nun auch auf dem Einkaufszettel der Bundeswehr. Die Zeit drängt.
    HD-Produktion
- eventId: 705256
  start: 2026-09-22T16:00:00Z
  stop: 2026-09-22T16:45:00Z
  title: Killerroboter - Wie Maschinen töten lernen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2025
    Drohnen jagen ihre Ziele selbstständig, Algorithmen analysieren das Schlachtfeld in Sekunden - und immer häufiger entscheiden Maschinen über Leben und Tod.

    Was wie Science-Fiction klingt, ist längst Realität. Der Krieg wird digital, automatisiert und unberechenbar. Neue Technologien verschieben das Kräfteverhältnis - und treiben ein globales Wettrüsten um militärische KI voran.
    HD-Produktion
- eventId: 705257
  start: 2026-09-22T16:45:00Z
  stop: 2026-09-22T17:30:00Z
  title: Terra X
  subtitle: Überleben! - Unser Erbe
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Warum hat sich ausgerechnet der Homo sapiens durchgesetzt? In der "Terra X"-Reihe "Überleben!" untersucht die Systemforscherin Antje Boetius das Geheimnis unserer Erfolgsgeschichte.

    Sie analysiert, mit welchen Strategien es unseren Vorfahren gelang, in allen Naturräumen des Planeten heimisch zu werden. Auf der abgelegensten Forschungsstation Grönlands erforscht sie die Klimageschichte unseres Planeten.
    HD-Produktion
- eventId: 705258
  start: 2026-09-22T17:30:00Z
  stop: 2026-09-22T18:15:00Z
  title: Die Erben der Dinos
  subtitle: Aufstieg der Vögel
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2025
    Vögel sind die vielfältigste Gruppe der Landwirbeltiere und direkte Nachfahren der Dinosaurier. Ihre genaue Entwicklung zu modernen Vögeln ist lange ein Rätsel, das nun entschlüsselt wird.

    Die Suche nach Vogel-Fossilien gestaltet sich als besonders schwierig, da ihre dünnen, zerbrechlichen Knochen selten erhalten bleiben. Doch seit den 1990er-Jahren ermöglichen außergewöhnliche Funde die Rekonstruktion der Evolution und der Flugfähigkeit der Vögel.
    HD-Produktion
- eventId: 706143
  start: 2026-09-22T18:15:00Z
  stop: 2026-09-22T19:00:00Z
  title: Die Erben der Dinos
  subtitle: Herrscher der Lüfte
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2025
    Vor 66 Millionen Jahren beendete ein Asteroideneinschlag das Zeitalter der Dinosaurier. Vögel überlebten dank ihrer Anpassungsfähigkeit und entwickelten schnell eine große Artenvielfalt.

    Heute haben ihre 11.000 Arten fast alle Lebensräume erobert, auch die Lüfte. Dafür entwickelten sie Flügel und ein angepasstes Gehirn zur Navigation in drei Dimensionen. Ihre Intelligenz erweist sich als ein weiterer Erfolgsschlüssel.
    HD-Produktion
- eventId: 706144
