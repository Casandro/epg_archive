- eventId: 969251
  start: 2026-09-22T00:40:00Z
  stop: 2026-09-22T01:20:00Z
  title: Geniale Bauwerke der Geschichte
  subtitle: Superbauten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Kanada 2026
    Seit Jahrtausenden errichten Menschen Gebäude in gewaltigen Dimensionen. Von den Prachtbauten des alten Rom bis zu künstlichen Wasserstraßen, die ganze Gebirge überwinden.

    Über dem Pantheon in Rom spannt sich seit fast 2000 Jahren eine monumentale Betonkuppel, ein gigantisches Kanalbauwerk durchschneidet die Landenge von Panama, und nördlich von Madrid ragt das größte Kreuz der Welt: Monumente des Willens und der Macht.
    HD-Produktion
- eventId: 969252
  start: 2026-09-22T01:20:00Z
  stop: 2026-09-22T02:05:00Z
  title: Geniale Bauwerke der Geschichte
  subtitle: Infrastruktur
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Kanada 2026
    Rund um den Globus entstehen Bauwerke der Superlative - höher, länger, tiefer als alles zuvor. Sie überwinden Tiefen, durchstoßen Berge und verschieben die Grenzen des technisch Machbaren.

    In Frankreich spannt sich das Viadukt von Millau Hunderte Meter über dem Boden einer Schlucht, in China erklimmt der höchste Außenaufzug der Welt eine Felswand, und tief unter den Alpen verläuft der Gotthard-Basistunnel nahezu schnurgerade durch das Gebirge.
    HD-Produktion
- eventId: 969253
  start: 2026-09-22T02:05:00Z
  stop: 2026-09-22T02:45:00Z
  title: Wunderwerke der Weltgeschichte
  subtitle: Hagia Sophia - Heilige Stätte von Istanbul
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2020
    Am Schnittpunkt von Europa und Asien liegt ein Wunderwerk spätantiker Baukunst: die Hagia Sophia in Istanbul - Weltkulturerbe mit einer 1500-jährigen Geschichte voller Geheimnisse.

    Worauf beruht ihre unglaubliche Standfestigkeit? Wie haben die Bauherren die gigantische Kuppel gebaut, die scheinbar frei in der Luft schwebt? Und warum scheinen die massiven Wände des Gebäudes überraschend leicht und lichtdurchlässig?
    HD-Produktion
- eventId: 692102
  start: 2026-09-22T02:45:00Z
  stop: 2026-09-22T03:30:00Z
  title: Wunderwerke der Weltgeschichte
  subtitle: Angkor Wat - Kambodschas antike Tempelstadt
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2020
    Versteckt im Dschungel von Kambodscha steht der größte religiöse Bau der Welt: die Tempelanlage von Angkor Wat. Moderne Technik hilft den Forscherteams bei der Studie des Bauwerks.

    Im kambodschanischen Dschungel arbeiten sie daran, die letzten Geheimnisse von Angkor Wat zu lüften. Das Bewegen tonnenschwerer Steine, unterirdische Schächte oder das schiere Ausmaß der Tempelanlage stellen die Archäologinnen und Archäologen vor immer neue Rätsel.
    HD-Produktion
- eventId: 692103
  start: 2026-09-22T03:30:00Z
  stop: 2026-09-22T04:15:00Z
  title: Wunderwerke der Weltgeschichte
  subtitle: Petra - Felsentempel in der Wüste
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2018
    Beeindruckende Felsformationen und mächtige Fassaden - mitten in der jordanischen Wüste fasziniert die antike Felsenstadt Petra Archäologen, Historiker und Touristen.

    Die Wissenschaftler nutzen Techniken wie Fotogrammmetrie und 3-D-Rekonstruktion, um die Arbeit der antiken Baumeister zu erforschen. Indem sie Petra aus verschiedenen Perspektiven betrachten, finden sie Hinweise, die bisher verborgen waren.
    HD-Produktion
- eventId: 692857
  start: 2026-09-22T04:15:00Z
  stop: 2026-09-22T05:00:00Z
  title: Wunderwerke der Weltgeschichte
  subtitle: Mont-Saint-Michel - Klosterfestung am Atlantik
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2018
    Die Silhouette des meisterhaften Mont-Saint-Michel in der Normandie ist weltweit bekannt. Doch längst hat die Inselfestung nicht all ihre Geheimnisse preisgegeben.

    Was verbergen die Steine dieser skulpturalen Abtei? Wie ist der Berg in der Mitte der völlig flachen Bucht entstanden? Wissenschaftler setzen die modernsten Techniken ein, um die Lücken in der faszinierenden Geschichte des Mont-Saint-Michel zu schließen.
    HD-Produktion
