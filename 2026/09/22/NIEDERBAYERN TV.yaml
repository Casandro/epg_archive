  description: "Polizei ermittelt - Ein brennender Kleinbus, eine Leiche und viele offene Fragen\nEin brennender Kleinbus, eine Leiche im Fahrzeuginneren und ein schwer verletzter Mann in einem nahegelegenen Waldstück. Was sich in der Nacht zum Sonntag in Bayerisch Eisenstein abgespielt hat, gibt der Polizei Rätsel auf. Die Ermittler versuchen, die genauen Umstände des Geschehens zu rekonstruieren. \n\nDialekt im Rampenlicht - Gstanzl-Crashkurs begeistert Mundart-Fans in Deggendorf\nHaben Sie heute schon gereimt? Und ich meine nicht irgendeinen Reim, sondern die Königsdisziplin der bayerischen Wirtshauskultur: das Gstanzl! Schnell, humorvoll und gerne auch mal ein bisschen frech. In Deggendorf drehte sich am vergangenen Wochenende beim 27. Bairischen Mundarttag alles um unseren Dialekt. Ein absolutes Highlight war dabei ein ganz besonderer Crashkurs.\n\nPackung gegen den Aufsteiger - Straubing Tigers verlieren 3:6 gegen Krefeld\nDie Straubing Tigers haben auch das zweite Saisonspiel in der Penny DEL verloren. Zuhause setzte es gegen Aufsteiger Krefeld eine 3:6-Niederlage. Vor allem defensiv offenbarten die Gäubodenstädter dabei große Schwächen."
