  description: "650 Jahre Stadterhebung - Passau-Hals feiert Jubiläum\nDie älteste Stadt Deutschlands - welche das genau ist, ist bis jetzt nicht abschließend geklärt. Doch werden in Diskussionen immer wieder die Städte Trier, Neuss, Worms oder Augsburg genannt. Auch in Niederbayern gibt es Orte, die schon mehrere Jahrhunderte auf dem Buckel haben. So auch der Passauer Stadtteil Hals. Dort wurde am Wochenende ein besonderes Jubiläum gefeiert.   \n\nPremiere in Vilshofen - US Car Freunde laden zum Dogde Charger und Challenger Treffen\nOb Sport, Musik, Handwerk oder Sammelleidenschaft - Hobbys können ganz unterschiedlich aussehen. Besonders schön wird es aber, wenn aus einer persönlichen Leidenschaft ein gemeinsames Erlebnis wird. Genau das hat sich am Wochenende im Landkreis Passau gezeigt: Bei einer Premiere in Vilshofen kamen die US-Car-Freunde zusammen - mit viel Chrom, Motorenklang und jeder Menge PS.\n\nZugunsten des Tierschutzvereins - Benefizveranstaltung der Rottaler Oldtimerfreunde\nTierheime sind Zufluchtsorte für Tiere in Not. Sie geben ihnen ein vorübergehendes Zuhause, versorgen sie und versuchen ihnen ein Gefühl der Geborgenheit zu vermitteln. Doch sind viele Tierheime in Deutschland an ihrer Belastungsgrenze. Steigende Personal-, Energie- und Tierarztkosten und immer mehr Tiere mit medizinischem oder verhaltensbezogenem Betreuungsbedarf. Um genau hier zu unterstützen, haben die Rottaler Oldtimerfreunde eine Benefizveranstaltung auf die Beine gestellt. Bedacht werden sollten der Tierschutzverein Rottal-Inn und das Tierheim Benk in Pfarrkirchen. Wir waren am Samstag vor Ort."
