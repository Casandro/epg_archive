  description: 'Seegras kann mehr Kohlenstoff speichern als jeder Wald, Fische nutzen es als Kinderstube und im Winter schützt es die Küsten. Auf den Balearen steht die Superpflanze unter Naturschutz - und wird doch durch viele Schiffe bedroht, deren Anker den Meeresboden aufreißen. Zeit für die Seegras-Retter: Patrouillenboote und Meeresbiologen, die beschädigte Zonen wieder aufforsten.'
