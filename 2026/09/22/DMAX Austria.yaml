  title: 'Border Control: Türkei - Grenzschützer im Einsatz'
  subtitle: Episode 76
  description: |-
    Ein Transitcontainer aus Serbien mit Zielhafen in Russland trifft in Istanbul im Zollbereich ein. Laut Anmeldung enthält er Calciumcarbonat. Doch möglicherweise befinden sich darin illegale Stoffe. Daher werden die Säcke stichprobenartig geprüft. Die Beamten entnehmen Proben und analysieren diese mit einem Testkit. Und am Flughafen Sabiha Gökçen hievt ein Passagier aus Belgien einen schweren Koffer auf den Kontrolltisch. Darin kommen Schachteln mit Trinkgläsern und Flakons zum Vorschein. Die zulässige Freimenge für Parfüm beträgt pro Person 600 Milliliter.
    TUR 2025
