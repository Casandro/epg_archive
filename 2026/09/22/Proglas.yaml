  title: Slyšte, lidé!
  subtitle: Hudební výlet do Brazílie 2026/3
  description: 'Autor a interpret: Milan Tesař; Premiéra: 19.9.2026 * V týdeníku Slyšte, lidé! se Milan Tesař v letošním roce už potřetí vydává na hudební výlet do Brazílie a představuje novinky z alb i aktuální singly z platformy Brasil Calling. Zazní současná brazilská hudba od elektroniky a alternativního rocku přes sambu a písničkářství až po afro-brazilské rytmy, mimo jiné v podání Disstantes, Pedra Volty, Ellen Oléri, Marcose Jobima nebo Janine Mathias. Vedle hudby pořad přibližuje také společenská a kulturní témata, která se v tvorbě brazilských umělců odrážejí ? od sociální nerovnosti a kulturní identity přes tradici a generační dialog až po otázky lásky, paměti a vztahu člověka k přírodě.[brazil kólin] [dyštančis] [markuse žobima] [žanyn matyas] '
