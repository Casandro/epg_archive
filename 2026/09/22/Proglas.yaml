- eventId: 896024
  start: 2026-09-22T03:57:00Z
  stop: 2026-09-22T04:00:00Z
  title: Myšlenka na den
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Zákon lásky, narušující zákon kalkulace, dává radostMilí bratři a sestry, krásný den!V nedělní liturgii nám Pán ústy proroka Izaiáše dává velký důvod k naději: říká, že jeho myšlenky nejsou našimi myšlenkami a jeho cesty nejsou našimi cestami. Ano, Boží plány jsou nekonečně větší, a řekněme dokonce, že i ?lidštější“ než ty, které my lidé, poznamenaní hříchem, můžeme vymyslet a uskutečnit. Proto je zde prorokova výzva aktuálnější než dřív: opustit pokřivené způsoby jednání a vrátit se k Pánu, který sám je milosrdenství a odpuštění.Ježíšova podobenství v evangeliu popisují novost toho, co pro nás má Pán schováno, ale také všeobecně poukazují na odpor, který jsme připravení klást šlechetnější spravedlnosti a větší lásce ? zvláště dnes, když nasloucháme příběhu o dělnících povolaných k práci na vinici; jedni na celý den, jiní jen na jednu či pár. V centru pozornosti tohoto podobenství však stojí moment odměny: hospodář plní slovo dělníkům první hodiny a platí jim podle dohody, chce však, aby viděli jeho dobrotu - a přímo před jejich očima jedná s těmi posledními zcela stejným způsobem.Je zde jeden detail, který by nám neměl uniknout. Hospodář dává svému správci přesné instrukce, v jakém pořadí má postupovat: dělníci byli vypláceni ?od posledních k prvním“. Negativní reakci těch, kdo pracovali celý den, by se tedy dalo snadno vyhnout, jenže právě naopak je součástí plánu, jelikož zjevení Boží dobroty je tu pro každého, nejen pro někoho. Všichni získáváme radost, porozumění a budoucnost, kdzit jeho Království spravedlnosti a pokoje ? to je milost! Tam, kam se vlamuje Boží novost, není prostor pro závist a rozpor. Hledejme tedy Pána, když se dává nalézt, vzývejme ho, když je blízko.Pohleďme na naši přesvatou Matku: je stvořením jako my, je však bez poskvrny, a proto nám pomáhá doufat v Boha a svěřovat se jeho milosrdenství, aby se tak jeho cesty staly našimi cestami a jeho myšlenky aby se staly našimi myšlenkami.překlad - zd -, úprava - mh -https://www.vaticannews.va/cs/papez/news/2026-09/lev-xiv-kdyz-zakon-lasky-narusi-zakon-kalkulace.html'
  subtitle: Zákon lásky, narušující zákon kalkulace, dává radost
