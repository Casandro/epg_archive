  title: Z archivu hudebních pořadů
  subtitle: Raphael De Cock a Oscar Beerten ? nejen o kapele Enara Navaira
  description: 'Autor: Milan Tesař; Interpret: Raphael De Cock, Oscar Beerten; Premiéra: 15.7.2026 * Belgická skupina Enara Navaira propojuje ve své tvorbě inspirace tradiční hudbou z různých koutů Evropy s autorskou tvorbou a improvizací. Houslista Oscar Beerten a hráč na dudy a dechové nástroje Raphael de Cock budou hovořit nejen o tomto novém projektu, ale také o svých dalších kapelách a mezinárodních spolupracích. Přiblíží vznik Enara Navaira, své hudební kořeny i cestu k originálnímu zvuku, v němž se setkávají hardangerské housle, irské loketní dudy, maďarská citera nebo vícehlasý zpěv. Řeč bude také o respektu k lidovým tradicím a hledání inspirace v belgických dialektech.[enara navajra] [oskar bérten] [rafael de kok] '
