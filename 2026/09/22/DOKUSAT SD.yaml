  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Reanimation nonstop
  description: Ein Herzinfarktpatient wird in Pelican per US-Coast-Guard-Hubschrauber evakuiert. Nach erfolgreicher Reanimation stabilisiert sich sein Zustand zunächst, doch auf dem Flug nach Sitka kollabiert der 63-Jährige erneut. Die Retter kämpfen im Helikopter um sein Leben. Parallel dazu gerät nahe den Fairweather Grounds ein Fisch-Trawler in Seenot. Bei eisiger Kälte droht auch dort Lebensgefahr für die Crew. Zwei dramatische Einsätze für die Rettungskräfte.
