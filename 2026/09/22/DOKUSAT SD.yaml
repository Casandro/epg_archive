  title: Der Auschwitz-Prozess - Das Ende des Schweigens
  subtitle: Der Auschwitz-Prozess - Das Ende des Schweigens
  description: Frankfurt am Main, Dezember 1963. Erstmals stehen Deutsche, die sich an Verbrechen in Auschwitz-Birkenau beteiligten, vor deutschen Richtern. 22 ehemalige SS-Soldaten sind angeklagt. Politiker und die Öffentlichkeit lehnen den Prozess ab. Er wird zwei Monate lang die Verbrechen aufdecken und Deutschland zwingen, sich seiner Kriegsverantwortung zu stellen. Fast 200 Überlebende können aussagen und Journalisten aus aller Welt von ihren Erlebnissen im Lager berichten.
