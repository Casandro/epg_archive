  title: Malcolm Douglas - Suche nach dem Warabi
  subtitle: Malcolm Douglas - Suche nach dem Warabi
  description: In diesem Dokumnetarfilm begibt sich der Naturfilmer und Abenteurer Malcolm Douglas auf die Suche nach dem Warabi, dem kleinsten Känguru Australiens, welches erst 1978 entdeckt wurde und nur in einer Region im Nordwesten lebt. Um es zu finden und vielleicht auch ein Foto von diesem Tier in freier Wildbahn machen zu können, begibt sich Malcolm Douglas mitsamt seiner Begleiter nach Bigge Island, einer Insel, die vor der Nordwestküste Australiens liegt.
