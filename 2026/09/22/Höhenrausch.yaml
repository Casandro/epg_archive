  title: Heimatleuchten - Ein Sommer wie damals - Flussjuwelen
  subtitle: Heimatleuchten - Ein Sommer wie damals - Flussjuwelen
  description: 'Baden im Fluss ist oft nicht nur ein gnadenloser Kampf gegen die Gänsehaut. Es ist eine radikale Begegnung mit dem Element Wasser und dem "Gatsch" am Ufer und am Flussboden. Manchmal ist es auch ein Erlebnis abseits von Öffnungszeiten und Baderegeln. Der Film "Flussjuwelen" verbringt einen Tag mit ganz besonderen Menschen an drei Flüssen, die zu den schönsten in Österreich gehören: An der wilden Traun, der trägen Thaya und der gewaltigen Donau. Eine Reise vom Salzkammergut bis ins Waldviertel. AT 2022'
