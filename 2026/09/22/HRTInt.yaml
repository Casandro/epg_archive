  description: 'Ekipa serije Lijepom našom ovoga nas puta vodi u Splitsko-dalmatinsku županiju, u općinu Jelsa na otoku Hvaru gdje su snimljene dvije emisije. Program je započeo Hvarskih tancima koje su otplesali članovi KUD "Jelsa" i FD "Šaltin"iz Hvara, a zatim su nastupili: FS "Starogrojčica" - Starigrad, KUD "Jelsa", CZ "Sv. Cecilija" - Jelsa, Zbor "Stella maris", solist Mario Lušić - Hvar, zatim klape "Frecija" - Jelsa, "Bodulke" - Hvar, Kaštilac" - Vrboska, "Veli Kamik" - Svirče, "Kumpanija" - Vela Luka te "Fumari" - Lastovo. Nastupili su zatim Džentlmeni iz Osijeka, a uz njih i brojni solisti: Dario Belić, Gego, Dino Petrić, Duško Mucalo, Nenad Vetma, Ivo Gamulin Gianni, Tonči Huljić, Matko Jelavić, Stjepan Jeršek - Štef, Vlatka Kopić - Tena, Alen Nižetić, Goran Karan, Zorica Kondža i Dražen Zečić.  Jelsa, gradić nasrid Hvara, Na me pogled svoj obrati, Murtelica, Dobro jutro, Vrati se, mili ćale, Dvije duše, Zapivat ću jednu po starinsku, Vilo moja, Ribar plete mrižu svoju, Dalmacija u mom oku, Hvare moj - neke su od skladbi koje ćemo čuti u emisiji, a redovite rubrike upoznaju nas s tradicijom ovoga kraja.'
