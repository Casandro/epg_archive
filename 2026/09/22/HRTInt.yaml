  subtitle: ' '
  description: Radost življenja i dobro Ivino raspoloženje gotovo nitko i ništa ne može pokvariti. Iako su svi oko njega zapali u posvemašnju depresiju, Ive se osjeća odlično. No iznenadni posjet Šime Pancete, Ivinog najboljeg prijatelja iz djetinjstva, malo će pomutiti Ivino dobro raspoloženje. Šime je narkoleptičar bez posla, a kako je Ive sad na položaju, red je da pronađe posao i prijatelju u nevolji....
