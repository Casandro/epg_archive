- eventId: 1044666
  start: 2026-09-22T06:23:00Z
  stop: 2026-09-22T07:14:00Z
  title: Djeca sunca, dokumentarna serija (2/7)
  subtitle: ' '
  description: Znanstveno-popularni serijal "Djeca sunca" na osebujan način prikazuje odnos sunca i ljudi kroz povijest, kakav je on danas i kakav će biti u budućnosti. Serijal se sastoji od sedam pedesetominutnih epizoda, a pripreman je nekoliko godina i sniman na nekoliko kontinenata. Budućnost nosi nove tehologije, kao što su svemirsko solarno jedro, svemirske solarne elektrane, automobili na sunčevu energiju i slično. Već i danas se na nekim mjestima primjenjuju futurističke tehnologije vezane uz sunce. Utjecaj sunca na zdravlje je nemjerljiv, a ta je spoznaja danas pomalo potisnuta jer se izlaganju suncu obično daje negativan ton. Serija prikazuje povijest helioterapije i sve suvremene, manje ili više poznate, spoznaje o dobrobiti sunca za zdravlje, do pojedinaca kojima jedinu hranu predstavlja sunčevo zračenje. Potom, Sunce je imalo velik utjecaj na društvo i politku - primjerice, slabljenje Sunčeve aktivnosti u 17. stoljeću pokrenulo je velike društvene i geopolitičke promjene, a Sunce je i središnje mjesto velikih religija, kultova i kalendara. Od brojnih svjetskih stručnjaka koji sudjeluju u seriji treba istaknuti britanskog astronoma Davida Whitehousea koji nas vodi kroz povijest istraživanja i promišljanja o Suncu, od starih Grka do najnovijih otkrića. Djeca sunca sinonim je čovječanstva u cjelini, a kroz igrane dijelove serije dokumentarni materijali isprepleteni su i čarobnim slikama i bajkovitom pričom o zamišljenom drevnom narodu Djeca sunca, u vještoj režiji i dramaturgiji Mislava Hudoletnjaka.  Scenaristi serijala su Mislav Hudoletnjak i Krešimir Mišak.
- eventId: 1044667
  start: 2026-09-22T07:14:00Z
  stop: 2026-09-22T07:44:00Z
  title: Samo lagano
