  description: 'Mit 37 Jahren machte sie sich selbstständig. Mit einem zwei Wochen alten Baby, einem Telefon und einer Überzeugung gegen den Zeitgeist: Eine Insolvenz ist kein Existenzverlust. Seither hat Sigrun Römer etwa 10.000 Unternehmen durch Krisen begleitet und viele von ihnen gerettet. Als Insolvenzverwalterin blickt sie auch hinter die Fassaden: Oft folgt auf eine Firmenpleite der Zerfall der Familie - weil über Geld, Schuld und Scham geschwiegen wird.'
