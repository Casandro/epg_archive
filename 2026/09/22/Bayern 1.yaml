  title: Bayern 1 am Morgen
  subtitle: Mit Philipp Eger
  description: "Philipp Eger hat alles, was Bayern für einen guten Morgen braucht: gute Laune, gute Musik, gute Geschichten und ein gutes Gefühl für alles, worüber die Menschen in Bayern sprechen. Als gebürtiger Schwabe, der jetzt in Mittelfranken wohnt und in Oberbayern arbeitet kennt er sich perfekt in Bayern aus und fordert den Freistaat mit seiner täglichen Schätzfrage heraus. Im wöchentlichen Wechsel mit Marcus Fahn macht Philipp Eger aus einem alltäglichen Morgen einen guten Morgen! Von 5 bis 9 auf Bayern 1.\n\n6000 Euro! Die holen Sie sich bei den 6 Richtigen auf Bayern 1 - wenn Sie sich für Alles oder nichts entscheiden. Philipp Eger spielt Ihnen 6 kurze Ausschnitte aus Bayern 1 Hits vor: Sie nennen ihm Sängerin, Sänger oder die Band. Sind alle Ihre 6 Antworten richtig, gibt's 6000 Euro. \nOder Sie spielen auf Nummer sicher: Dann gibt's für jede richtige Antwort 100 Euro, für alle 6 Richtigen 600 Euro. \n\nSpielen Sie gerne mit! Um kurz nach 6, kurz nach 7 und kurz um nach 8 Uhr. Sie erreichen Philipp Eger telefonisch unter unserer Quiz-Hotline 0137-111 111 1.\n(Für 14 Cent pro angenommenen Anruf)   \n\n5.10 Philipps besondere Morgennummer auf Bayern 1\n5.30 Nachrichten-Schlagzeilen\n5.56 Gedanken zum Tag *\n6.00 / 7.00 / 8.00\nNachrichten, Wetter, Verkehr\n6.30 / 7.30 / 8.30 \nDas Wichtigste aus Ihrer Region\nGetrennte Ausstrahlung\nüber die fünf UKW-Sendergruppen\nOberbayern, Niederbayern/Oberpfalz, \nMittel- und Oberfranken, Mainfranken, Schwaben\n7.50 \"Die Superbayern\" - Comedy mit Wolfgang Krebs *\n8.50 Philipps finale Frage\n\n* Als Podcast verfügbar in der App ARD Sounds"
