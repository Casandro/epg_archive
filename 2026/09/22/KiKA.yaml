  title: Pip und Posy
  subtitle: Das Superball-Spiel!
  description: |-
    Das Superball-Spiel!

    Die Freunde haben einen Ball zum Spielen mit in den Park gebracht und Pip erfindet das Superballspiel. Posy denkt sich ein ganz besonderes Fangkunststück aus, eines mit Purzelbaum.

    Aber das Kunststück gelingt ihr nur ein einziges Mal - und die anderen wollen lieber weiterspielen, anstatt ihr beim Üben zuzusehen. Enttäuscht übt sie ihr Kunststück für sich und findet dabei heraus, dass Jamila ganz toll im Radschlagen ist.

    Sie fragt Jamila, warum sie das Radschlagen noch nie den anderen vorgeführt hat. Jamila erklärt, dass es ihr reicht, wenn sie von sich selbst begeistert ist. Sie braucht die Anerkennung der anderen nicht unbedingt. Da wird Posy plötzlich klar, dass es ihr eigentlich auch genügt, wenn sie selber weiß, wie toll sie ihr kleines Kunststück beherrscht.
