  description: |-
    Was kann man alles mit Kartoffeln machen?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen . extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" dreht sich heute alles um Kartoffeln. Titus zeigt, wie man Kartoffeln einpflanzt und erntet. Die Monster erklären, was Fische mit Kartoffeln zu tun haben und wer die Pommes frites erfunden hat. Lustige Kartoffeln singen einen Kartoffel-Song - und egal ob sie geschält, geschnitten, gebraten oder zermatscht sind: lecker sind sie immer!
