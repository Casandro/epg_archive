    Taylor und Tommy wollen Pirat spielen, und Gorilla Jack soll der Schiffsjunge sein. Aber Jack scheint keine Lust darauf zu haben. Taylor kann das nicht glauben, bis Jack am Ende wegläuft.

    Taylor versucht alles, um Jack zum Spielen zu motivieren. Was sie auch versucht, der Gorilla wirkt abwesend und lustlos. Taylor beginnt sich Sorgen zu machen: Ist Jack vielleicht krank? Oder will er nicht mehr mit Taylor befreundet sein. Das wäre das Schlimmste.
