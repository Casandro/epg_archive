    Eine Entführung am helllichten Tag mitten in der Stadt? Amy behauptet, gesehen zu haben, wie ein älterer Herr vor den Augen seiner Frau in einen Van gezerrt wurde. Die anderen Pfefferkörner sind skeptisch, recherchieren dann aber, Amy zuliebe, gemeinsam. Zuerst machen sie die Frau des Opfers ausfindig, die allerdings behauptet, es habe gar keine Entführung stattgefunden. Noch verwirrender wird die Sache, als die vermeintlichen Kidnapper in der Villa des Ehepaars auftauchen und der Frau einen Koffer voll Geld anbieten. Die Pfefferkörner bleiben dran und finden sich schließlich in einem Casino wieder, wo der offenbar demenzkranke Ehemann gegen seinen Willen festgehalten wird. Hakim verspricht ihm, ihn so schnell wie möglich zu befreien, doch plötzlich tauchen die Entführer auf und das Opfer verplappert sich.
