  subtitle: Theklas Restaurant
  description: |-
    Theklas Restaurant

    Thekla hat ein Restaurant aufgemacht und bewirtet die Wieseninsekten ganz wunderbar. Alle sind begeistert, nur Maja traut der Spinne nicht über den Weg und will dort lieber nichts essen.

    Doch Willi und den anderen scheint alles, was Thekla ihnen serviert hat, gut zu bekommen. Maja wagt sich schließlich auch in Theklas Restaurant und ändert danach ihre Meinung. Theklas Fruchtsalat war exzellent, und die Spinne hat Maja auch wieder gehen lassen.

    Thekla scheint es doch nicht auf ihre Restaurantgäste abgesehen zu haben, wie Maja zunächst vermutet hatte. Doch dann stellt sich heraus, Theklas Plan ist gemeiner, als befürchtet: Ihr Restaurant hat nur den Zweck, die Wieseninsekten zu mästen, damit die Suppe, die Thekla am Ende aus ihnen kochen will, umso besser schmeckt.

    Als Maja die Wahrheit herausfindet, sitzen die Freunde bereits in der Falle.
