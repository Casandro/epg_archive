    Während eines Unwetters wurde das Panda-Gehege eines Zoos überflutet. Huan, ein Riesenpanda, der in dem Gehege lebte, muss deshalb vorläufig ein neues Zuhause finden. Bei Taylor im Reservat?

    Sonia, die beste Zoologin der Gegend, erklärt sich bereit, Huan aufzunehmen. Allerdings wacht Huans "Aufpasser" Dietmar genau darüber, dass der Panda exakt nach Vorschrift behandelt wird. So ist es sehr schwierig für Sonia und Taylor, Huans Vertrauen zu gewinnen.
