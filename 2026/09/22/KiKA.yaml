  title: PUR+
  subtitle: Mission Luchs - zurück in die Wildnis
  description: |-
    Mission Luchs - zurück in die Wildnis

    Gelingt die Auswilderung des jungen Luchses Nero im Schwarzwald? "PUR+"-Moderator Eric Mayer erlebt, was alles getan werden muss, um den kleinen Luchs in die Wildnis zu entlassen.

    Dabei sind viele Fachleute gefragt, die eine intensive Vorarbeit leisten. Aber auch der Luchs selbst muss Voraussetzungen mit sich bringen, damit eine Auswilderung überhaupt möglich ist. Er muss Gesundheits- und Verhaltenstests bestehen, um sicher zu überleben.

    Eric begleiten den Prozess, von der Untersuchung durch Tierarzt Marco Roller vom Zoo Karlsruhe bis hin zur eigentlichen Auswilderung im Schwarzwald, die von Biologin Eva Klebelsberg und ihrem Team vom Projekt "Luchs Baden-Württemberg" vom FVA-Wildtierinstitut - Forstliche Versuchs- und Forschungsanstalt durchgeführt wird.
    Moderation: Eric Mayer

