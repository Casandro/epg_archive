  description: |-
    Lara, die Wahrsagerin

    Lara behauptet, sie könne nicht nur das Wetter vorhersagen, sondern auch die Zukunft jedes Wieseninsekts. Rufus ist begeistert. Er hat gemäß ihrer Weissagung ein großes Blatt gefunden.

    Alle anderen glauben, was Lara ihnen prophezeit, und finden sich bestätigt. Nur Maja ist skeptisch. Sie durchschaut Lara, die jedem erzählt, was er gern hören will. Um die anderen von Laras Schwindel zu überzeugen, lässt sich Maja ebenfalls die Zukunft vorhersagen.

    Lara bescheinigt Maja, dass dieser Tag eine Wende in ihrem Leben bedeutet. Maja nimmt den Ball auf und macht daraus, dass sie die Wiese verlassen wird. Als die anderen das hören, sind sie entsetzt und versuchen Maja auszureden, auf die Weissagung zu hören.
