  title: Jak to bylo doopravdy
  description: Od husitů k jezuitům. Jak to bylo dopravdy s působením jezuitů, tedy Tovaryšstva Ježíšova, v Čechách a na Moravě? Otázka pro reprízu pořadu Ivany Chmel Denčevové a pro historičku Evu Doležalovou. Režie Michal Bureš.
