  title: Pro a proti
  description: Zkrotí vláda ceny benzínu a nafty? Jaká opatření by měla na pondělním jednání přijmout? Mělo by jít Česko stejnou cestou jako Německo, kde tamní vláda snižuje spotřební daň na pohonné hmoty a zavádí cenové stropy? A jak je Babišův kabinet připravený na další energetickou krizi, která podle vicepremiéra a ministra průmyslu a obchodu Karla Havlíčka přichází do celé Evropy? Debatovat budou místopředseda sněmovního hospodářského výboru Ivan Adamec z ODS a člen zmíněného výboru poslanec hnutí ANO Roman Kubíček. Moderuje Lukáš Matoška.
