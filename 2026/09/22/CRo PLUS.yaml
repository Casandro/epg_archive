  description: Místo velkých úspor jen kosmetická změna. Menší strany vládní koalice chtěly snížit plánovaný schodek rozpočtu na příští rok. Nakonec vláda našla úsporu pouze tři miliardy. Do sněmovny tak posílá rozpočet s deficitem 386 miliard. Je taková změna dostatečná? A je reálný vládní plán snížit schodek v průběhu roku o dvacet miliard? Hosty Pro a proti budou poslanci z rozpočtového výboru Patrik Pařil z hnutí ANO a Jan Papajanovský z hnutí STAN. Moderuje Lukáš Matoška.
