  subtitle: Den pohledem renomovaných komentátorů. Moderuje Ondřej Konrád.
  description: Když se z nejbližšího souseda stane nespolehlivý spojenec. 'Déja vu' na trzích aneb návrat regulace pohonných hmot. Zvláštnosti ruského volebního dění. Trumpův boj s centrální bankou a realitou. Pondělní vydání Názorů a argumentů moderuje Ondřej Konrád.
