  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: Návaly horka, dospělé děti, stárnoucí rodiče a k tomu zjištění, že některé věci už člověk opravdu nemá zapotřebí řešit. Padesátka zkrátka může být pěkná jízda. Herečka Lenka Krobotová o tom mluví s nadhledem v novém audioseriálu Nesnesitelná horkost bytí - a také o tom, co všechno může ženě přinést věk, kdy už přesně ví, kdo je a co od života nechce. Moderuje Naděžda Hávová.
