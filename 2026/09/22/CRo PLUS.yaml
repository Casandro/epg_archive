  title: Kniha dne
  description: 'Borjana Dodova: Hostina (Dokořán). Autorka je česká umělkyně s bulharskými kořeny. Studovala scénáristiku a dramaturgii na FAMU a matematiku na MFF UK. V roce 2014 debutovala knihou povídek Inverzní kyvadlo, spolupracovala s Českým rozhlasem. Její texty byly přeložny do bulharštiny a polštiny. V románu Hostina se příprava bulharské slavnostní večeře proplétá s rodinným, rodovým i národním příběhem. Připravila Michaela Vetešková.'
