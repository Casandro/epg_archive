  title: In aller Freundschaft (1012)
  subtitle: Am offenen Herzen
  description: Die junge Alina Neumeier ist zu Dr. Ina Schulte in die Sprechstunde gekommen, weil sie einen Knoten in der Brust ertastet hat. Mitten in die Untersuchung platzt ihr Vater Bernd Neumeier (51), voller Angst, seine Tochter zu verlieren, nachdem schon an seine Frau an Brustkrebs gestorben ist. Alina hat die genetische Veranlagung geerbt, deswegen haben Tochter und Vater beschlossen, eine Mastektomie bei ihr durchführen zu lassen. Ina möchte Alina und ihrem Vater die Angst nehmen. Dabei gerät sie allerdings mit Dr. Ilay Demir aneinander.
