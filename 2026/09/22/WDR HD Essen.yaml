  title: 'Tatort: Glück allein'
  subtitle: Fernsehfilm Österreich 2018
  description: 'Für das Wiener Ermittlerteam Moritz Eisner und Bibi Fellner ist es nicht ungewöhnlich, an übergeordneter Stelle anzuecken. Dass sie der Innenminister persönlich von einem Fall fernhalten möchte, spornt die beiden erst recht an: Sie überhören einfach die Anweisung ihres Chefs Ernst Rauter und fahren zum Haus des Politikers Raoul Ladurner, in dem sich ein Blutbad abgespielt hat. Für dessen Frau kommt jede Hilfe zu spät, die zehnjährige Tochter liegt schwerverletzt im künstlichen Koma. Kommissarin Julia Soraperra, die auf Geheiß des Ministers den Fall aufklären soll, erscheint Eisner und Fellner ebenso überfordert wie befangen.'
