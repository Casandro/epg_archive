  title: Steirerangst
  subtitle: Fernsehfilm Österreich/Deutschland 2023
  description: 'Eine Flasche Champagner im Kühler, ein benutztes und ein unbenutztes Glas - und eine Leiche auf dem Boden des Hotelzimmers! Was die Grazer Ermittler Sascha Bergmann und Anni Sulmtaler am Tatort vorfinden, lässt vermuten: Die ermordete Unternehmerin Katrin Fischer hat den Täter gekannt - und womöglich sogar freudig erwartet! War es vielleicht jemand aus dem Kuschelseminar des geschäftstüchtigen Ehepaars Breuer, das Katrin zuvor besucht hatte? Um mit dem Kreis möglicher Verdächtiger auf Tuchfühlung zu gehen, mischt sich Bergmann zusammen mit seiner Chefin Nicole Sturm unter die Nähe-Suchenden.'
