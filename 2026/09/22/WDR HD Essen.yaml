  title: Rentnercops (17)
  subtitle: Im Wagen vor mir
  description: Edwin wurde wegen seines Handelns suspendiert und wartet darauf, dass sein Disziplinarverfahren abgeschlossen wird und er wieder in den Dienst zurück darf. Seine Neugier treibt ihn nahezu täglich zu Günter und Heidrun - angeblich wegen des Abendessens. Günter ist entsprechend genervt, erst recht als Edwin beginnt, sich in den aktuellen Fall eines erstochenen Vergewaltigers einzumischen. Durch den Anruf eines alten Bekannten, der eine Frau angefahren hat und nun Edwins Hilfe erbittet, gelangt er an ein Messer, das die Tatwaffe in Günters aktuellem Fall zu sein scheint. Aber was hat das alles mit dem toten Vergewaltiger zu tun?
