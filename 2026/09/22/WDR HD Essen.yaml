  title: Steirerschuld
  subtitle: Fernsehfilm Österreich/Deutschland 2023
  description: Das Böse kann überall lauern - auch hinter den Mauern eines altehrwürdigen Klosters! In "Steirerschuld" stößt das Ermittler:innen-Duo Bergmann und Sulmtaler, gespielt von Hary Prinz und Anna Unterberger, nicht nur auf eine Leiche, sondern auch auf einige weitere dunkle Geheimnisse. Während sich der Grazer Chefinspektor in seiner Skepsis gegenüber jeder Form von Enthaltsamkeit bestätigt sieht, fordert ein Geheimcode aus mittelalterlichen Schriften den Scharfsinn seiner Kollegin heraus.
