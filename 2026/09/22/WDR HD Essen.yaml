  title: In aller Freundschaft (1011)
  subtitle: Menschen ändern sich
  description: Georg Feldhusen, gerade auf Drogenentzug, wird nach einem Treppensturz in die Sachsenklinik eingeliefert. Als seine erwachsene Tochter Emily zu ihm kommt, fürchtet sie zunächst, ihr Vater sei wieder rückfällig geworden. Doch Georg streitet dies vehement ab und schickt Emily weg. Obwohl Georg nach außen hin unauffällig wirkt, hat Pflegerin Arzu Ritter den Verdacht, dass er sich heimlich spritzt.
