  subtitle: Mein Katalysator Comedy-Serie, USA 2004
  description: 'Folge 62, Das Sacred Heart Krankenhaus bekommt Besuch. Der hoch angesehene Dr. Kevin Casey lehrt als Gastprofessor, und J.D. ist sofort von dem genialen Arzt begeistert. Er sieht in ihm den Mentor, der Dr. Cox für ihn nie sein wird. Das lässt Cox natürlich nicht kalt: Er fordert Dr. Casey zu einem Duell heraus. Obwohl der Gastprofessor eindeutig als Sieger hervorgeht, hat auch er einen wunden Punkt: seine Zwangsneurosen.'
