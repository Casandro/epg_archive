  title: Scrubs - Die Anfänger
  subtitle: Meine Schuld Comedy-Serie, USA 2004
  description: 'Folge 61, Der erste Geburtstag von Dr. Cox'' kleinem Sohn steht an, und die gesamte Verwandtschaft trifft zur Feier ein - auch Cox'' leukämiekranker Schwager Ben. Als er erfährt, dass sich Ben schon jahrelang keiner Untersuchung mehr unterzogen hat, verdonnert er ihn zu einem ordentlichen Gesundheits-Check. Doch zu spät: Ben stirbt noch am selben Tag in der Klinik. Cox gibt sich die Schuld an Bens Tod und flüchtet sich in die Arbeit.'
