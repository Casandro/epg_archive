  title: Scrubs - Die Anfänger
  subtitle: Meine Offenbarung Comedy-Serie, USA 2004
  description: Folge 63, Als sich immer mehr Patienten über ein seltsames Geräusch beschweren, geht J.D. der Sache nach. Dabei stößt er auf eine geheime Toilette auf dem Dach, die vom Hausmeister dort als Oase der Ruhe aufgestellt wurde. Indes ist Elliotts Selbstwertgefühl, nachdem sie einen Patienten falsch intubiert hat, ganz am Boden. Sie sucht Rat bei Dr. Casey, doch der interessiert sich - wie der Rest der Belegschaft auch - nur noch für die geheime Dach-Toilette.
