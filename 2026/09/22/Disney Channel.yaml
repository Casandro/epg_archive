  subtitle: Mein sauberer Abgang Comedy-Serie, USA 2004
  description: Folge 57, Für J.D. steht fest, dass er mit Danni Schluss machen muss, doch ihm fehlt der Mut. Da kommt es ihm gelegen, dass Danni ihm durch ihre Schwester sagen lässt, ihre Beziehung sei beendet. Indes hat Dr. Cox Probleme mit seiner Nettigkeit, denn nun nimmt ihn keiner mehr ernst. Er beschließt, wieder zu seiner bewährten Methode des "Schrecken-Verbreitens" zurückzukehren. Eine Methode, die Dr. Kelso bereits praktiziert, denn er zwingt Elliot dazu, sich fortan weniger zu schminken.
