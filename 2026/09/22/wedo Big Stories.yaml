  description: '2018 ● S1 E1 Eine neue Braut steht vor dem Eintritt in die Monarchie, eine geschiedene und gemischtrassige Schauspielerin aus Amerika. Noch vor einer Generation hätte jeder dieser Faktoren ausreichen können, um sie an der Heirat mit einem Königlichen zu hindern. Magazines / Reports / Documentary 2018, Regie: Katherine Kelly,  Mit: Jeremy Paxman, Season:1 Episode:1'
