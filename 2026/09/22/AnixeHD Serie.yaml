  title: Vier Frauen und ein Todesfall - Hirnverbrannt
  subtitle: Vier Frauen und ein Todesfall - Hirnverbrannt
  description: 'Manchmal gehen Interessen auseinander: Während Pepperl auf der Suche nach einer neuen Bleibe bei der ehemaligen Operettensängerin Uschi Spatz landet und sich aufgrund ihrer verblüffenden Ähnlichkeit mit seiner verstorbenen Mitzi näher für sie interessiert, entdeckt der frisch bei der "Drey von der Tankstelle" einquartierte Franzi seine Leidenschaft für den Beruf des Tankwarts. Und Julie, die sich ohne einschlägige Beschäftigung zu langweilen beginnt, bekommt ein überraschendes Geschenk,als ihr der Kapitän der Ilmer Dampfschifffahrt, Josef Seidlhuber, ein Geständnis macht. Der alte Kapitän will jemanden ermordet haben, jedoch scheint er so verwirrt zu sein, dass er sich an keine Details erinnern kann.'
