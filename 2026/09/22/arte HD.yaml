  title: Adoptivkinder - Skandal ohne Grenzen
  subtitle: Frankreich 2024
  description: Seit den 1980er Jahren hat sich das internationale Adoptionswesen hinter der Fassade der Wohltätigkeit zu einem lukrativen Markt entwickelt. Grenzüberschreitende Adoptionen bleiben undurchsichtig - trotz des 1993 durch das Haager Übereinkommen geschaffenen Regulierungsrahmens. Kriminelle Praktiken wie die Entführung von Babys, als Waisen ausgegebene Kinder, Druck auf die Mütter und Urkundenfälschungen begünstigen den Kinderhandel. Die Dokumentation recherchiert in Südkorea, "Versuchslabor" des internationalen Adoptionswesens, und Schweden, dem adoptionsfreudigsten Land überhaupt. Haben internationale Adoptionen noch eine Zukunft?
  widescreen: true
