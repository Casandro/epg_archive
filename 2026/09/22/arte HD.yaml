  description: 'Gastlichkeit, Plattensee und Puszta - durchquert wird Ungarn mit dem Zug von West nach Ost, von Nationalpark zu Nationalpark. Die größte Büffelherde Ungarns wartet im Nationalpark Balaton-Oberland. Das Filmteam macht Halt an der Balatoner Riviera in Balatonfüred, wo einst die Hautevolee kurte. In Budapest wird das größte Musikfestival des Landes besucht. Weiter ostwärts, am Fuße des malerischen Bükk-Gebirges, gibt es ein einzigartiges Höhlenschwimmbad. Dort erfährt das Team, warum die Ungarn Weltmeister im Wasserball sind. Endstation ist das größte Steppengebiet Mitteleuropas: die Puszta.'
