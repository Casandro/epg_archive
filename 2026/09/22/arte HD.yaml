  title: Die Inquisition (2/2)
  subtitle: Kirche, Tod und Teufel
  description: 'Zu Beginn der Inquisition handelten die Gesandten der katholischen Kirche noch unabhängig voneinander in den Gebieten, für die sie vom Papst eingesetzt worden waren. Gegen Ende des 15. Jahrhunderts änderte sich das: Spanien, Portugal und Italien schufen zentralisierte und hierarchisch organisierte Behördenapparate. Und die Liste der Verfolgten wurde immer länger.'
