  title: 360° Reportage
  subtitle: Cholitas, die fliegenden Frauen Boliviens
  description: Mit ihren gewagten Sprüngen und Pirouetten brettern sie gegen hartnäckig fortbestehende Klischees. Ihre Tracht soll provozieren und zeigen, dass den Cholitas heute alles offensteht. Dass sie sich dabei ausgerechnet auf Skateboards schwingen, löst Erstaunen aus. Doch die jungen Frauen haben diesen Sport mit Bedacht gewählt. Denn noch immer müssen sie auf ihrem Weg nach oben über Hindernisse und kulturelle Widerstände springen. In wenigen Tagen feiert die eingeschworene Gruppe ihr dreijähriges Jubiläum. Eine gute Gelegenheit, um noch lauter auf sich aufmerksam zu machen.
