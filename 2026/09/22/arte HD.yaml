  title: GEO Reportage
  subtitle: Die raue Schönheit
  description: Ganz an der Spitze der bretonischen Halbinsel liegt das Departement Finistère - übersetzt bedeutet das so viel wie "Das Ende der Welt". Es ist eine urwüchsige Landschaft mit rauer Küste. Felsige Landspitzen und einsame, sagenumwobene Leuchttürme trotzen der tobenden See. Der Atlantik mit seinem Reichtum an Arten sicherte den Fischern traditionell ein gutes Auskommen, aber die Bestände gehen immer weiter zurück. Auch die Jagd nach dem Wolfsbarsch wird immer schwieriger. Doch die Menschen hier lieben ihre Bretagne, sie sind stolz auf ihre Kultur und ihre Identität - und sie haben bis heute ihre bretonische Lebensart bewahrt.
