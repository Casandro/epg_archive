  description: Seit etwa 200 Jahren gibt es die Eisenbahn - sie ist ein bahnbrechendes Transportmittel der Menschheit geworden. Ihr Siegeszug hat Gesellschaften, Landschaften und Städte verändert und ganze Länder ins Industriezeitalter katapultiert. Sie revolutionierte den Transport und demokratisierte das Reisen. Doch sie war auch ein Werkzeug der Kolonialmächte zur Ausbeutung und transportierte Menschen in den geplanten Tod in Auschwitz.
