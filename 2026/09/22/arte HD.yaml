  title: Der Orient-Express
  subtitle: Vintage auf Schienen
  description: Als Zug der Könige, Diplomaten, Schriftsteller und legendärer Passagiere wie Mata Hari, Marlene Dietrich und "Mord im Orient-Express"-Autorin Agatha Christie revolutionierte der Orient-Express das Reisen. 1883 begann mit ihm eine neue Verbindung zwischen Okzident und Orient. Die Dokumentation lässt Historiker sowie Sammler und Restauratoren alter Eisenbahnwaggons zu Wort kommen, folgt von Paris bis Istanbul den Spuren dieses Palastes auf Schienen und beleuchtet die Geheimnisse des prunkvollen und ruhmreichen Zuges, der Revolutionen und Kriege miterlebte.
