  title: Notre-Dame, die Jahrhundertbaustelle (3/3)
  subtitle: Ein Raum aus Klang und Licht
  description: 'Die Kathedrale Notre-Dame gilt zu Recht als architektonisches Wunderwerk: Höhe, Licht und Akustik spielten so harmonisch ineinander, dass der Besucher in den Genuss eines wahren Sinneserlebnisses gelangte. Im Innenraum der Kirche stand zudem eine der kostbarsten Orgeln der Welt. Doch auch in der Tiefe offenbart die Kathedrale einen Teil ihrer Geschichte: Bei Bodenuntersuchungen im Rahmen des Wiederaufbaus von Notre-Dame haben Archäologen mittelalterliche Gräber unter der Kathedrale entdeckt. Sie fanden auch einen antiken Bleisarg - mitsamt Leichnam.'
