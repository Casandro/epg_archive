  title: Langs de Lijn en omstreken
  subtitle: In Langs de Lijn En Omstreken hoor je naast live sport ook bijzondere verhalen. Je kunt genieten van spannende wedstrijden maar ook van boeiende gesprekken met interessante gasten.
  description: 'In Langs de Lijn En Omstreken hoor je naast live sport ook bijzondere verhalen. Je kunt genieten van spannende wedstrijden maar ook van boeiende gesprekken met interessante gasten. En ondertussen praten we je bij over het nieuws van de avond. Het programma maken we samen met de EO en de NOS. Presentatie NOS: Robbert Meeder, Jeroen Stomphorst, Jeroen Stekelenburg, Gert van ''t Hof, Edwin Cornelissen, Ghislaine Plag of Suze van Kleef. Presentatie EO: Jan-Willem Wesselink, Joram Kaat, Margje Fikse of Hans van der Steeg. (2026)'
- eventId: 900120
  start: 2026-09-22T21:00:00Z
  stop: 2026-09-22T22:00:00Z
  title: NOS Met het Oog op Morgen
  subtitle: Het Oog brengt aan het eind van de dag een overzicht van het nieuws, de ochtendkranten en journalistieke interviews met mensen in en achter het nieuws, omlijst door mooie muziek.
  description: Het Oog brengt aan het eind van de dag een overzicht van het nieuws, de ochtendkranten en journalistieke interviews met mensen in en achter het nieuws, omlijst door mooie muziek. Elke dag van de week heeft zijn eigen presentator. Door deze vaste dag, de persoonlijke opening van het programma en de manier van interviewen, drukt de presentator een eigen stempel op de uitzending. We noemen NOS Met het Oog op Morgen ook wel een 'journalistieke personality show'. De ijzersterke formule en de persoonlijkheid en kwaliteit van de presentatoren zorgen ervoor dat het programma al sinds 1976 een uniek radioprogramma is dat zeer goed beluisterd en hoog gewaardeerd wordt. (2026)
- eventId: 900121
  start: 2026-09-22T22:00:00Z
  stop: 2026-09-22T23:00:00Z
  title: Nooit Meer Slapen
  subtitle: Femke van der Laan ontvangt een inspirerende gast uit de kunst, cultuur of actualiteit, die vertelt over werk & leven. Nooit Meer Slapen is hét nachtelijke cultuurprogramma van de VPRO.
  description: Michiel van Erp is regisseur, producent en schrijver. Hij brak door met 'Lang Leve.', waarin hij gewone Nederlanders op een bijzondere en humoristische manier portretteerde. Daarna maakte hij onder meer 'Pretpark Nederland', over de manier waarop Nederlanders hun vrije tijd beleven, en 'I Am a Woman Now', over transgender vrouwen die in Casablanca een operatie ondergingen. Met de dramaserie "Ramses" won hij onder andere een Gouden Kalf, de Nipkowprijs en de Prix Europa. Ook won hij Gouden Kalveren voor 'Vergeet mij niet', "Niemand in de Stad" en 'Een van ons'. Dit jaar opent het Nederlands Film Festival met zijn nieuwe film 'Downtown'. Het is een verhaal over drie vrienden die in het Amsterdamse uitgaansleven van de jaren tachtig de aidsepidemie meemaken. Femke van der Laan gaat met Michiel van Erp in gesprek. (2026)
- eventId: 900122
  start: 2026-09-22T23:00:00Z
  stop: 2026-09-23T00:00:00Z
  title: MISCHA!
  subtitle: Een uur lang met een bekende gast de diepte in, een reis langs inzichten en kwetsbaarheden.
  description: 'Gelukkig zijn ze er nog, de mensen die hun mond opendoen, hun visie, gedachten en dromen met ons delen, zich mengen in het publieke debat of zonder enige terughoudendheid het openbare toneel betreden. Ze trotseren de haat op twitter, de steen door de ruit, de onder de gordel-opmerkingen van reaguurders, terwijl ze weten dat ze ieder moment gecanceld kunnen worden. Toch gaan ze door. Wat beweegt hen? In MISCHA! gaat presentator Mischa Blok op zoek naar de drijfveren van deze mensen. Dat doet ze met haar kenmerkende stijl van interviewen: een echt en gelijkwaardig gesprek. Oprechte interesse. Dus geen draaiboek, geen enkele vraag op papier. Een uur lang met één gast de diepte in, een reis langs inzichten en kwetsbaarheden. Persoonlijke gesprekken met verrassende wendingen die zowel de gast als de presentator ontregelen.'' MISCHA! Iedere maandag- t/m donderdagnacht om 01:00 uur op NPO Radio 1 en daarnaast natuurlijk op ieder gewenst moment te beluisteren in alle podcast-apps! (2026)'
