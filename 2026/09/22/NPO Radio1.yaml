  description: Een gevarieerde talkshow met Natasja Gibbs of Stephan Komduur, met een originele kijk van de redactie op het nieuws van die dag, met antwoord op vragen waarvan je nog niet wist dat je ze had. Verdiepende gesprekken met gasten uit de wereld van cultuur, media, politiek en sport, in samenwerking met andere journalistieke platforms. (2026)
