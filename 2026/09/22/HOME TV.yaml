  title: Tajemnice zwykłych rzeczy 1 (odc. 3)
  subtitle: 'Przedmioty codziennego użytku. Niby nic specjalnego, ale jak je zrobić? '
  description: |-
    Tytuł oryginalny: How to Make
    GB, 2020
    Reżyseria: Darren Coates
    Szczotka i pasta do zębów; buty sportowe; słuchawki. Zoe Laughlin, dociekliwa pani inżynier, używa ich na co dzień. Wiedziona naukową ciekawością postanawia sprawdzić, z czego i jak zostały zrobione, a następnie wykonać je samodzielnie. To będzie fascynujący proces, pełen prób i błędów, a także niespodzianek. Bo zwykłe przedmioty wcale nie są takie proste.
  ageRating: 12
  genre:
  - '35'
