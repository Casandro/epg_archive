  title: Ein Hauch von Himmel
  subtitle: Der falsche Engel
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Guy Garfield ist ein Schauspieler, der für seine Sendung bekannt ist, in der er einen Rache-Engel namens Gabriel spielt. Monica ist nicht sonderlich begeistert davon, dass er ihr neuer Auftrag ist. Doch schnell zeigt sich, dass es um etwas Wichtiges geht: In Oregon lebt der kleine Mickey. Seit seine Mutter ums Leben gekommen ist, leben er und sein großer Bruder Ryan bei ihrer Tante. Weil Mickey jeden Tag trauert, hat Ryan eine Idee. Mickey ist großer Fan vom Rache-Engel und zufälligerweise ist Guy Garfield gerade in der Stadt. Ryan bittet ihn darum, Mickey zu besuchen. Als Guy Mickey besucht, erzählt er ihm folgenschwere Lügen über den Himmel und seine Mutter.'
