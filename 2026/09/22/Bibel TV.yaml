  title: Ein Hauch von Himmel
  subtitle: Sklavenhandel
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Senatorin Kate Cooper hat ihre politische Laufbahn voller Träume und Ideale begonnen. Im Lauf der Jahre musste sie lernen, dass Idealismus allein einen nicht weiterbringt und stets Kompromisse nötig sind. Auch privat musste sie für ihre Karriere Opfer bringen: Für ihren Mann James und den kleinen Sohn Thomas hat Kate nur wenig Zeit. Mitten im Wahlkampf beanspruchen nun auch noch Menschenrechtsaktivisten ihre Aufmerksamkeit: Monica, Andrew und Dr. Joe Acot wollen ihre Hilfe gewinnen, um öffentlich auf die schlimme Situation im Sudan aufmerksam zu machen. Dort werden immer noch Menschen als Sklaven verkauft. Kate fürchtet, dass ihr Engagement für den Sudan sie die Wiederwahl kosten könnte.'
