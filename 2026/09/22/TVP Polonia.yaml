  title: Polacy Światu - Rudolf Weigl
  description: |-
    Tytuł oryginalny: Polacy światu
    PL, 2023
    Rudolf Weigl, polski biolog urodził się 2 września 1883 roku na Morawach w rodzinie austriackiej. Po śmierci ojc, jego matka związała się z polskim profesorem Józefem Trojnarem. Weigl ukończył studia przyrodnicze w 1907 roku, został asystentem w Zakładzie Zoologii i Anatomii Porównawczej. W 1912 roku rozpoczął studia medyczne. Po wybuchu I wojny światowej pracował w laboratorium bakteriologicznym w Przemyślu w Pracowni Badań nad Tyfusem Plamistym. Jako pierwszy do badań wykorzystał wszy.
