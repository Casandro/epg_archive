    Komedia romantyczna w gwiazdorskiej obsadzie. Linda i Vanda przyjaźnią się od lat i wspólnie prowadzą małą księgarnię. Linda jest odpowiedzialna i praktyczna, po rozwodzie samotnie wychowuje córkę. Vanda to szalona, wesoła i spontaniczna piękność, która ciągle przyciąga niewłaściwych mężczyzn. Choć różni je prawie wszystko obydwie marzą o romantycznej miłości.
