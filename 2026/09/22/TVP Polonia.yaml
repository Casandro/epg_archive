    Po śmierci ojca podkomisarz Zosia Dobosz postanawia odejść z zespołu, w którym pracowała. Wiadomość ta jest przykrym zaskoczeniem zarówno dla komisarza Alexa, jak i dla pozostałych policjantów. Tymczasem w Jeziorku Czerniakowskim zostaje znalezione ciało młodej kobiety. Na miejsce przybywają komisarz Alex wraz z Kozerą i Gutkiem. Ku zaskoczeniu tego ostatniego ofiarą okazuje się Kamila Białobrzeska, którą Gutek spotkał poprzedniego wieczoru na imprezie speed-datingowej.
  ageRating: 12
  genre:
  - '18'
  subtitle: Po śmierci ojca podkomisarz Zosia Dobosz decyduje się odejść z zespołu. W Jeziorku Czerniakowskim zostaje odnalezione ciało młodej kobiety. Na miejsce przybywają komisarz Alex oraz Kozera i Gutek.
