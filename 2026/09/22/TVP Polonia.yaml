  title: Barwy szczęścia - odc. 3380
  description: |-
    Tytuł oryginalny: Barwy szczęścia
    PL, 2026
    Reżyseria: Grzegorz Waller
    Występują: Anna Gzyra, Marek Molak, Natalia Zambrzycka, Olaf Staszkiewicz, Grażyna Zielińska, Elżbieta Romanowska
    Hubert z irytacją obserwuje skuteczność taktyki Wilka w momencie, gdy kolejny mieszkaniec Zacisznej decyduje się na sprzedaż domu. Jego frustrację potęguje odkrycie, że ofertą dewelopera interesuje się również Agata, co brat odbiera jako cios w plecy. Broda niespodziewanie zwierza się z dojmującego poczucia samotności oraz braku wiedzy o tożsamości własnego ojca. Aleks tuż przed wyjazdem do Londynu informuje matkę, że przygotowuje wystawę, na której zamierza zaprezentować właśnie jej portrety.
  ageRating: 12
  genre:
  - '23'
  subtitle: Hubert jest sfrustrowany sukcesami Wilka, zwłaszcza gdy dowiaduje się, że Agata również rozważa sprzedaż domu deweloperowi. Broda zwierza się z poczucia samotności oraz braku wiedzy o tożsamości ojca.
