  title: Komisarz Alex s.XXIV - odc. 295 (seria XXIV odc. 1) "Szybka randka, szybka śmierć"
  description: |-
    Tytuł oryginalny: Komisarz Alex
    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Jakub Aleksander, Joanna Koc, Marcin Rogacewicz, Mateusz Chruściel, Piotr Bondyra, Pola Błasik
    Po śmierci ojca podkomisarz Zosia Dobosz postanawia odejść z zespołu, w którym pracowała. Wiadomość ta jest przykrym zaskoczeniem zarówno dla komisarza Alexa, jak i dla pozostałych policjantów. Tymczasem w Jeziorku Czerniakowskim zostaje znalezione ciało młodej kobiety. Na miejsce przybywają komisarz Alex wraz z Kozerą i Gutkiem. Ku zaskoczeniu tego ostatniego ofiarą okazuje się Kamila Białobrzeska, którą Gutek spotkał poprzedniego wieczoru na imprezie speed-datingowej.
  ageRating: 12
  genre:
  - '18'
  subtitle: Po śmierci ojca podkomisarz Zosia Dobosz decyduje się odejść z zespołu. W Jeziorku Czerniakowskim zostaje odnalezione ciało młodej kobiety. Na miejsce przybywają komisarz Alex oraz Kozera i Gutek.
- eventId: 896205
  start: 2026-09-22T01:05:00Z
  stop: 2026-09-22T02:50:00Z
  title: Wszystko albo nic
  description: |-
    Tytuł oryginalny: Všetko alebo nič
    SK,CZ,PL, 2017
    Reżyseria: Marta Ferencová
    Występują: Tatiana Pauhofová, Klára Issová, Michał Żebrowski, Ľuboš Kostelný, Ondřej Sokol, Paweł Deląg
    Komedia romantyczna w gwiazdorskiej obsadzie. Linda i Vanda przyjaźnią się od lat i wspólnie prowadzą małą księgarnię. Linda jest odpowiedzialna i praktyczna, po rozwodzie samotnie wychowuje córkę. Vanda to szalona, wesoła i spontaniczna piękność, która ciągle przyciąga niewłaściwych mężczyzn. Choć różni je prawie wszystko obydwie marzą o romantycznej miłości.
  ageRating: 16
  genre:
  - '20'
  subtitle: Linda i Vanda przyjaźnią się od lat i wspólnie prowadzą księgarnię. Choć różnią się charakterami, obydwie marzą o romantycznej miłości. Gdy w ich życiu pojawią się James i Aldar, wszystko się zmienia.
