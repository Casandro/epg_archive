  title: Szlakiem miejsc niezwykłych - Pomniki Historii s.I - Łańcut, Leżajsk
  description: |-
    Tytuł oryginalny: Szlakiem miejsc niezwykłych - pomniki historii
    PL, 2016
    Reżyseria: Tomasz Drozdowicz
    W cyklu najciekawsze pomniki i zabytki polskiej kultury, tym razem to: Łańcut i Leżajsk. Te zwaśnione miasta na początku XVII wieku były świadkami wielkiego sporu dwóch magnatów. Słynny awanturnik Stanisław Stadnicki, zwany "Łańcuckim Diabłem", prowadził prywatną wojnę ze starostą leżajskim Łukaszem Opalińskim. Ich potyczki skutkowały spaleniem Łańcuta i zniszczeniem Leżajska, ostatecznie jednak "Łańcucki Diabeł" poniósł klęskę.
  ageRating: 12
  genre:
