    Pod wpływem wydarzeń i wpływu proboszcza wikary przechodzi wewnętrzną ewolucję. Uświadamia sobie, że grzeszył brakiem miłości do ludzi. Ponieważ jest naturą ideową, z zapałem przystępuje do naprawiania krzywd i w sojuszu z drugą społecznikowską naturą, Lucy, zabiera się za likwidację bezrobocia, organizując pośrednictwo pracy i nawet wysyłając chętnych do Hiszpanii, ale tylko do pracy sezonowej, żeby nie uszczuplać substancji narodowej.
