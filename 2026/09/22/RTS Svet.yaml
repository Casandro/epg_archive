  title: Jezik i identitet
  subtitle: '"Gde je ljudima zavičaj?", odgovor na to pitanje pronašla je Isidora Sekulić u jeziku. Bez jezika, zapisala je, nema ni korena ni identiteta.'
  description: '"Gde je ljudima zavičaj?", odgovor na to pitanje pronašla je Isidora Sekulić u jeziku. Bez jezika, zapisala je, nema ni korena ni identiteta. Gde smo ukorenjeni i kakva je priroda veze između, s jedne strane jezika, a s druge - pojedinca i zajednice, kulture i tradicije, prošlosti, sadašnjosti i budućnosti? Zamišljenost nad tim pitanjima odvela nas je do onih za koje pouzdano znamo da su svoj životni poziv posvetili upravo fenomenima jezika i identiteta. "Um je jezik, logos", pisao je nemački filozof Johan Georg Haman, "to je ona kost puna srži koju glođem i koju ću glodati do smrti. Za mene su ove dubine još mračne; još čekam da dođe apokaliptički anđeo sa ključem za ovaj ponor". Isti filozof pisao je da je poezija maternji jezik čovečanstva. Tako i svaki narod ima sebi svojstven izraz i svoju maternju melodiju, o kojoj piše Momčilo Nastasijević kada kaže: "Nem je Bog u svetu bilja i životinja; kroz čoveka promuca; kroz umetnika progovori, čujemo mu glas: sušta je melodija."...'
- eventId: 1095672
  start: 2026-09-22T20:16:00Z
  stop: 2026-09-22T20:39:00Z
  title: Pravo na sutra
  subtitle: Imovina nije pitanje politike, već prava. Bar bi tako trebalo da bude.
  description: Imovina nije pitanje politike, već prava. Bar bi tako trebalo da bude. Ali da je taj pravni put dug i krivudav svedoče desetine hiljada raseljenih koji do svojih poseda na Kosovu i Metohiji ne mogu da dođu godinama. Imanja su morali da napuste, a ko ih i šta sprečava da ponovo njima raspolažu, mnogi od njih svedoče u novom serijalu Radio-televizije Srbije "Pravo na sutra". Kancelarija za Kosovo i Metohiju i kancelarije pravnih timova projekta "Besplatna pravna pomoć", koji se sprovodi uz podršku Evropske unije, adrese su na kojima zainteresovani građani mogu da potraže pomoć. U kojim slučajevima, pod kojim okolnostima? Kako ti procesi izgledaju i šta vlasnici zatiču kada konačno dođu do svoje imovine? Svedočenja, problemi, nada u pravdu i rešenja, sve to u 6 emisija serijala "Pravo na sutra", realizovanim u saradnji sa Projektom Evropske unije "Besplatna pravna pomoć" i Kancelarijom za Kosovo i Metohiju.
