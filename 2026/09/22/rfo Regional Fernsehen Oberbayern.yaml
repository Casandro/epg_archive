  description: 'Die neue PISA-Studie zeigt: Deutschlands Schülerinnen und Schüler erreichen so schlechte Werte wie nie, besonders in den Naturwissenschaften; der Bayerische Lehrer- und Lehrerinnenverband kritisiert die Bildungspolitik scharf und verlangt echte Konsequenzen. +++ Der TSV Buchbach bleibt nach dem 3:1 gegen Schweinfurt durch zwei späte Treffer mit dem fünften Sieg in Serie ungeschlagen und trifft am Dienstag im Toto-Pokal-Viertelfinale erneut auf den Gegner, während Burghausen Augsburg II 5:2 schlug. +++ Die Starbulls Rosenheim sind mit zwei Niederlagen in die DEL2 gestartet: Nach dem 2:3 daheim gegen Ravensburg und einem 3:4 in Kassel nach 0:4-Rückstand warten sie weiter auf die ersten Punkte und stehen auf Rang 13. +++ Zum Bundesliga-Start im Tischtennis besiegte der SV DJK Kolbermoor Meister ttc berlin eastside trotz 0:2 nach den Doppeln mit 6:4, angeführt von Annett Kaufmann und Debütantin Chi-Shiuan Chen, während Berlin ohne Topspielerinnen patzte und Kolbermoor auf Rang zwei kletterte.'
- eventId: 848019
  start: 2026-09-22T09:20:00Z
  stop: 2026-09-22T09:30:00Z
  title: Süd Journal vom 21.09.2026 (Wh.)
  subtitle: Kinopremiere von Bonnie in Rosenheim +++ Lokwelt feiert 20 Jahre Museumsgeschichte +++ Wetter für das Sendegebiet
  description: 'Bonnie - Eine Münchner Action-Komödie tourt durch die Kinos und machte im Kinopolis Rosenheim Halt: Hannah und Layla geraten wegen Rucksack und Bombe in eine wilde München-Jagd, mit Corinna Blädel; nächster Stopp ist am 27. September Wasserburg. +++ Freilassing feierte am Wochenende 20 Jahre Lokwelt: Das Museum blickt auf zwei Jahrzehnte Eisenbahngeschichte mit historischen Loks und Bahntechnik zurück, erhielt ein neues Fahrzeug für die Sammlung und bot ein Jubiläumsprogramm mit Nachts im Museum, Modellbahnschau und Fundsachenauktion. +++ Nach dem heißen Sommer kommt der Herbst spürbar an. Am Dienstag und Mittwoch zeigt sich vielerorts die Sonne, die Nächte sind kühl und im Süden gibt es örtlich den ersten Frost. Am Donnerstag bringt ein Tief Schauer und Gewitter.'
- eventId: 848020
  start: 2026-09-22T09:30:00Z
  stop: 2026-09-22T09:45:00Z
  title: HOAMSPUI - Sportsendung - Teil 1 (Wh.)
  subtitle: Spieltag 10 - TSV Buchbach gegen 1 FC Schweinfurt 05 +++ Tabelle der Regionalliga Bayern nach Spieltag 10 +++ Face of the week - Feldhockeyspieler Leon Duibjohann
  description: Der TSV Buchbach verteidigte in der Regionalliga Bayern mit einem 3:1 gegen Schweinfurt vor 720 Fans die Tabellenführung, drehte nach dem 1:1 zur Pause durch Piwarnetz das Spiel spät via Zimmerer (90.) und Muteba (90.+4) und eröffnete die BV-Respekt-Aktionstage. +++ In der Regionalliga Bayern führt Buchbach mit zwei Punkten vor Memmingen, dahinter drängen vier Teams um Eichstätt, während Bayern II das Mittelfeld anführt und der Keller nach Ansbachs Sieg enger ist; zudem laufen Toto-Pokal-Viertelfinals, der 11. Spieltag startet Freitag, Löwen live in Burghausen. +++ Face of the week - Feldhockeyspieler Leon Duibjohann
- eventId: 848021
  start: 2026-09-22T09:45:00Z
  stop: 2026-09-22T10:00:00Z
  title: HOAMSPUI - Sportsendung - Teil 2 (Wh.)
  subtitle: 'Feldhockey in Rosenheim: Leon Duibjohann vom SB DJK spricht bei Hoam Spui über den Aufschwung des Sports, die Mannschaft und die Nachwuchsarbeit.'
  description: Feldhockey hat in Rosenheim eine lange Tradition - und beim SB DJK ist ordentlich Bewegung drin. Die Herren sind inzwischen in der 2. Regionalliga Süd unterwegs, gleichzeitig setzt der Verein stark auf die Nachwuchsarbeit. Bei **Hoam Spui** sprechen wir mit Leon Duibjohann darüber, wie sich der Rosenheimer Hockeysport entwickelt, was die Mannschaft ausmacht und warum Feldhockey in Rosenheim definitiv mehr Aufmerksamkeit verdient.
- eventId: 572768
  start: 2026-09-22T10:00:00Z
  stop: 2026-09-22T10:10:00Z
  title: Süd Journal vom 21.09.2026 (Wh.)
  subtitle: Smartwatch als Hausnotruf +++ Demonstration aufgrund von Bodenmesswerten in Burgkirchen +++ 70 Jahre Christliches Sozialwerk +++ Bulldogtreffen in Prien +++ Verkehrsunfall in Seebruck im Landkreis Traunstein
  description: 'Mobilnotruf per Smartwatch soll auch allein unterwegs Sicherheit geben: Per Knopfdruck oder Sturzerkennung verbindet sie zur Notrufzentrale, übermittelt per GPS den Standort und ermöglicht Freisprechen; die Johanniter bieten dazu vom 14.9. bis 2.11.2026 einen vierwöchigen Gratis-Test. +++ Wegen möglicher PFAS-Belastung der Böden im Landkreis Altötting demonstrierten am Freitag in Burgkirchen rund 70 Mitglieder der Bürgerinitiative Netzwerk Trinkwasser und forderten die vollständige Veröffentlichung aller aktuellen Bodenmesswerte. +++ Das Christliche Sozialwerk Degerndorf-Brannenburg-Flintsbach feierte am Samstag 70 Jahre: Aus dem 1956 gegründeten Hauskrankenpflegeverein wurde ein Netzwerk mit über 1.000 Mitgliedern, geprägt von Demenzhilfe, Essen auf Rädern, Mehrgenerationenhaus und Tagespflege. +++ Am Samstag, 3. +++ Bei Seebruck starb am Sonntagnachmittag ein 85-jähriger Pedelec-Fahrer, als er beim Überqueren der Staatsstraße 2095 mit seiner Frau von einem Motorroller erfasst wurde; der 84-jährige Rollerfahrer kam lebensgefährlich verletzt per Hubschrauber nach Rosenheim, die Straße war gesperrt und die.'
