  title: Das Gipfeltreffen
  subtitle: Schubert, Sträter und König retten die Welt
  description: Liebe Trauergemeinde, wir haben uns heute hier beim Gipfeltreffen versammelt, um nachträglich den Rohrbruch von Dieter Bohlen zu beweinen. Olaf Schubert, Torsten Sträter und Johann König senden genitale Tränen und ein aufrichtiges "Happy Aua". Wir möchten uns außerdem bei allen Hühnern entschuldigen, die nach der Folge therapeutische Hilfe benötigen. Johann muss den Unterschied zwischen "mit Hühnern aufstehen" und "auf Hühner stehen" noch lernen. Mit Fragen von Ruth Moschner, Wincent Weiss, Louis Klamroth, Alexandra Popp, 2RaumWohnung, Sasha und Marleen Lohse.
