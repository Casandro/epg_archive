  title: 'Quarks: Aua! Die Wissenschaft vom Schmerz'
  subtitle: 'Moderation: Ralph Caspers'
  description: Schmerzen sind ein wichtiges Warnsignal des Körpers. Wie entsteht Schmerz, welche Rolle spielt das Gehirn und warum reagieren manche Menschen viel empfindlicher auf Schmerzen als andere? Millionen Menschen in Deutschland leben mit chronischen Schmerzen - oft über Jahre. Warum sollte man Schmerz nicht einfach aushalten  - und wie können Placebos und sogar die eigene Haltung Schmerzen lindern?
