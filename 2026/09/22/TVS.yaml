  title: 'Doktor z alpejskiej wioski - nowy rozdział: odc.13'
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007) odc.13, Getrennte Wege - Teil 1
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Martin denerwuje się, kiedy u pracującej u niego pielęgniarki z Białorusi występują niewytłumaczalne objawy chorobowe. W końcu okazuje się, że kobieta zażywa szkodliwe leki, żeby uniknąć deportacji. Eriana musiałaby opuścić kraj razem ze swoją 14-letnią córką.
    Reżyser: Oliver Muth
    Od lat: 12
  ageRating: 12
