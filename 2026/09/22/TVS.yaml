  title: 'Doktor Kleist - lekarz rodzinny: odc.9'
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    Tytuł oryginalny: Familie Dr. Kleist
    DE
    Reżyseria: Peter Weissflog
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser
    Doktor Christian Kleist, główny bohater, po śmierci żony Susanne przenosi się z szesnastoletnią Lisą i dwunastoletnim Peterem do spokojnego Eisenach, by zacząć nowy etap życia. Na miejscu otwiera własny gabinet lekarski, a dzięki życzliwości i empatii szybko zdobywa sympatię mieszkańców oraz burmistrza. Poznaje nowych ludzi, a po latach odnawia też kontakty z dawnymi kolegami i przyjaciółmi.
  ageRating: 12
- eventId: 900615
  start: 2026-09-22T17:50:00Z
  stop: 2026-09-22T19:50:00Z
  title: 'Rosamunde Pilcher: Kwiaty w deszczu 1 (odc. 42)'
  subtitle: Lavinia i John zaręczają się. Wkrótce w ich życie wkracza tajemnicza dziennikarka. Sheila doskonale rozumie się z Johnem, co sprawia, że Lavinia jest coraz bardziej zazdrosna o narzeczonego.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Blumen im Regen
    DE,AT, 2001
    Reżyseria: Ralf Gregan
    Występują: Karina Kraushaar, Oliver Hörner, Winnie Markus, Katja Woywood, Wolf Roth, Andrea L'Arronge
    Lavinia (Karina Kraushaar) i John (Oliver Hörner) zaręczają się. Wkrótce w ich życiu pojawia się tajemnicza Sheila (Katja Woywood), która twierdzi, że jest dziennikarką i autorką książki o kwiatach. Zatrzymuje się u ciężko chorej babci Johna. Lavinia jest coraz bardziej zazdrosna o ukochanego, tym bardziej że John i Sheila doskonale się rozumieją. Rozgoryczona kobieta nie wie jednak, że nieznajoma skrywa sekret, którego źródła należy szukać w odległej przeszłości.
  ageRating: 12
  genre:
  - '22'
- eventId: 900692
