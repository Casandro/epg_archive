  title: 'Rosamunde Pilcher: Kwiaty w deszczu 1 (odc. 42)'
  subtitle: Lavinia i John zaręczają się. Wkrótce w ich życie wkracza tajemnicza dziennikarka. Sheila doskonale rozumie się z Johnem, co sprawia, że Lavinia jest coraz bardziej zazdrosna o narzeczonego.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Blumen im Regen
    DE,AT, 2001
    Reżyseria: Ralf Gregan
    Występują: Karina Kraushaar, Oliver Hörner, Winnie Markus, Katja Woywood, Wolf Roth, Andrea L'Arronge
    Lavinia (Karina Kraushaar) i John (Oliver Hörner) zaręczają się. Wkrótce w ich życiu pojawia się tajemnicza Sheila (Katja Woywood), która twierdzi, że jest dziennikarką i autorką książki o kwiatach. Zatrzymuje się u ciężko chorej babci Johna. Lavinia jest coraz bardziej zazdrosna o ukochanego, tym bardziej że John i Sheila doskonale się rozumieją. Rozgoryczona kobieta nie wie jednak, że nieznajoma skrywa sekret, którego źródła należy szukać w odległej przeszłości.
  ageRating: 12
  genre:
  - '22'
- eventId: 900692
  start: 2026-09-22T19:50:00Z
  stop: 2026-09-22T21:35:00Z
  title: Rosamunde Pilcher - Aż po krańce świata 1 (odc. 46)
  subtitle: Młoda nauczycielka Sheila O'Connor przyjeżdża do posiadłości rodziny Carmichaelów, by uczyć dziesięcioletnią Louise, córkę Roberta.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Bis ans Ende der Welt
    DE, 2002
    Reżyseria: Dieter Kehler
    Występują: Lara-Joy Körner, Philippe Brenninkmeyer, Max Gertsch, Doreen Dietel, Monika Peitsch, Manfred Zapatka
    Sheila O'Connor, młoda, ładna nauczycielka, przyjeżdża na wiejski majątek braci Roberta i Paula Carmichaelów, właścicieli firmy tekstylnej Carmichael-Tweeds, aby uczyć dziesięcioletnią córkę Roberta. Sheila od razu dogaduje się z samotną po rozwiedzeniu Louise i zakochuje się w ojcu. Jednak Robert wykluczył miłość ze swojego życia od czasu rozstania z matką Louise i prawie nie zwraca uwagi na Sheilę.
  ageRating: 12
  genre:
  - '22'
