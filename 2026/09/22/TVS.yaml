  title: 'Wydział kryminalny Kitzbühel: odc.11'
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2019) odc.11, Worst Case Scenario
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair, Simon Hatzl
    Policjanci z Kitzbühel wkraczają w świat preppersów po tym, gdy znalezione zostają zwłoki Ernsta Fricka w jego bunkrze przeciwatomowym. Gospodyni mężczyzny jest zdruzgotana. Syn zmarłego zaś jest zaskakująco spokojny. Do grona podejrzanych o zabójstwo dołącza też przyjaciel ofiary. Wkrótce następuje przełom w sprawie.
    Reżyser: Martin Kinkel
    Od lat: 12
