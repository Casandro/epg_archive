  title: Doktor z alpejskiej wioski - nowy rozdział
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007), Höhenangst - Teil 1
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Lisa i jej narzeczony, Christian Tamm, wybierają się na wędrówkę po górach. Ich przewodnikiem ma być Hans. Lisa chciałaby przy okazji pozbyć się leku wysokości. Spada z urwiska i doznaje urazu nogi. Martin zaleca bezzwłoczną operację. Lisa ulega jednak namowom przyszłej teściowej i przesuwa termin zabiegu.
