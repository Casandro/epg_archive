  description: |-
    Als ein Wissenschaftler der Marine tot in einem Luxushotel in Sydney aufgefunden wird, ermitteln DeShawn und JD vor Ort. Gleichzeitig geraten Mackey, Evie und Blue bei einem exklusiven Tech-Launch in ernste Gefahr: Eingeladen vom Rüstungsministerium, finden sie sich in einem versiegelten Weltkriegsbunker wieder - mit schwindendem Sauerstoff, einem Mörder in ihrer Mitte und einer hochschwangeren Frau, die ihre Hilfe braucht.

