  title: Tu ich's ...? Lasse ich mir den Magen verkleinern?
  description: "Jeanine ist alleinerziehende Mutter und lebt mit ihrem dreijährigen Sohn in einem kleinen Ort in Oberbayern. Die 35-Jährige hat ein Problem: Adipositas. Das Übergewicht wirkt sich bei ihr besonders schlimm aus, weil sie seit einem Trampolin-Unfall in der Jugend unter Knie-Arthrose leidet. \nWenn sie einen Ausflug mit ihrem kleinen Sohn macht, kommt sie ihm auf seinem Laufrad kaum hinterher. Janine befürchtet, dass sie ihrem Kind nicht gerecht werden kann, auch ihr Selbstwertgefühl ist angeschlagen. Deshalb ringt Jeanine mit einer schweren Entscheidung: Soll sie sich einer Magenverkleinerung unterziehen, um endlich abzunehmen?"
