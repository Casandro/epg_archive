  title: Endlich sichtbar - Von Vietnam nach Deutschland
  description: Trong Hieu kennen alle in Vietnam unter dem Spitznamen "German Hot Guy", vor allem die zahlreichen weiblichen Fans sind verrückt nach ihm. In Vietnam ist er ein Superstar - und das als Deutscher. Sein größter Traum ist es, auch in seiner deutschen Heimat erfolgreich zu werden. Wir begleiten seinen Weg zwischen zwei Welten, zwei Karrieren, zwei Identitäten, und tauchen gleichzeitig in die Herkunftsgeschichten der in Deutschland lebenden Vietnamesen und Vietnamesinnen ein.
