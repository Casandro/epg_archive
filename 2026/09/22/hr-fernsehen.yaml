  title: Meine Mutter spielt verrückt
  subtitle: Fernsehfilm Deutschland 2019
  description: |-
    Ein Landgasthof bekommt irrtümlicherweise den Stern eines namensgleichen Gourmetrestaurants zugeschrieben - auf dieser wahren Begebenheit beruhte die Erfolgskomödie "Meine Mutter ist unmöglich".
    Im zweiten Film machen "Eifelwirtin" Diana Amft und Margarita Broich in der Rolle ihrer Mutter Heidi gemeinsam Urlaub an der Ostsee. Statt der langersehnten Erholung kommt es dort allerdings zu unerwarteten Turbulenzen. Unterdessen arbeitet Stephan Luca als degradierter Starkoch Rufus in der heimischen "Kupferkanne" an seinem Comeback.
