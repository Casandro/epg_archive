- eventId: 541922
  start: 2026-09-22T18:00:00Z
  stop: 2026-09-22T19:00:00Z
  title: Kombo
  subtitle: 'Moderation: Grit Schulze'
  description: "Kombo ist eine Sendung, die aus der Freude an der Kombination entsteht. Moderatorinnen gehen im Wechsel ihre je eigenen Wege durch das große Gebiet der klassischen Musik und darum herum. ROM - Wo Steine ewig klingen\n\nRom ist eine Stadt, in der Musik Geschichte hat und Geschichte immer wieder zu Musik wird. \nVon den Klängen der Antike und der päpstlichen Kapelle über Palestrinas Vokalpolyphonie, Corellis barocke Klangpracht und Händels römische Jahre bis zu Puccinis unsterblicher \"Tosca\": eine musikalische Reise durch die Ewige Stadt - und hinein in die römischen Sommernächte, wenn in den Caracalla-Thermen, im Circus Maximus, bei Jazzfestivals und in der Römischen Oper die Stadt ganz in Musik aufgeht. Grit Schulze nimmt Sie mit durch ihre Lieblingsstadt - inzwischen längst mehr als ein Sehnsuchtsort, ein zweites Zuhause.\n\nModeration: Grit Schulze"
- eventId: 541923
  start: 2026-09-22T19:00:00Z
  stop: 2026-09-22T20:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Steve Reich zum 90. Geburtstag

    Er gilt als einer der Pioniere der Minimal Music und veränderte damit ab Mitte der 1960er-Jahre nicht nur die amerikanische Neue Musik-Szene. Einflüsse afrikanischer, balinesischer und jüdischer Musik finden sich in seinen Kompositionen. Seine "Music for 18 Musicians" von 1976 wiederum beeinflusste auch Teile der Rockmusik und der Filmmusik. Am 3. Oktober ist der 90. Geburtstag von Steve Reich, der seinen Zugang zur Musik einmal mit den Worten beschrieb: "Als ich anfing zu komponieren, tat ich das, weil ich Bach, Strawinsky und Bebop liebte." Ein universeller Komponist jenseits aller stilistischen Scheuklappen.

    Moderation: Andreas Göbel
- eventId: 541924
  start: 2026-09-22T20:00:00Z
  stop: 2026-09-22T21:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Holger Zimmer'
  description: "Konzert: Jazzfest Berlin 2025: Felix Henkelhausen: \"Deranged Particles\" \n\nDas Jazz Institut Berlin bringt immer wieder Überraschungen hervor. Ein weiterer Zugang in der Berliner Szene ist der aus Oldenburg stammende Bassist und Komponist Felix Henkelhausen. Er hat gute Verbindungen in die aktuelle Musiklandschaft und brachte zur Eröffnung des Jazzfests Berlin ein Septett auf die Bühne im Haus der Berliner Festspiele: \"Deranged Particles\". Der Name ist Programm und unter diesen Teilchen finden sich so unterschiedliche Musiker wie unter anderem Elias Stemeseder, Evi Filippou oder Philip Dornbusch. Eine Konzertsendung vom 30. Oktober 2025.\n\nModeration: Holger Zimmer"
