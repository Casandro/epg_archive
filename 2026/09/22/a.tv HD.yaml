  title: Land & Leute
  subtitle: Profisport, Weltkulturerbe und Naturschutz - Bad Hindelang hat viele Geschichten zu erzählen
  description: 'Wir sprechen mit dem ehemaligen Hammerwerfer Tristan Schwandke über seinen Weg vom Profisport zurück ins normale Leben und darüber, was er aus seiner Karriere mitnehmen konnte. Außerdem geht es um ein besonderes Jubiläum: Vor zehn Jahren wurde die Alpwirtschaft in Bad Hindelang zum immateriellen Weltkulturerbe erklärt - Tourismusdirektor Max Hillmeier hat den gesamten Prozess begleitet. Wir besuchen einen Musikladen und erfahren mehr über die Faszination für Akkordeons und Harmonikas. Außerdem treffen wir eine Naturschutzwächterin und sprechen darüber, wie sie zwischen Natur, Besuchern und Behörden vermittelt.'
