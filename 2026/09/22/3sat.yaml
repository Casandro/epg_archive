  description: |-
    Deutschland 2013
    Die Polizei von Stralsund ist schockiert: Ein Kronzeuge, der vor dem Staatsanwalt aussagen wollte, ist auf dem Weg dorthin in einen Hinterhalt geraten und erschossen worden.

    Das Pikante: Die Informationen über die Wegstrecke und ihre Stationen waren streng geheim. Und sie kamen aus der Datenbank des Präsidiums. Es muss eine undichte Stelle im Apparat geben. Schnell wird der Fall vom LKA zur Landessache erklärt.
