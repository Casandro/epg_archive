  title: Natur im Garten (2/10)
  genre:
  - '144'
  widescreen: true
  subtitled: true
  description: |-
    "Natur im Garten" führt diesmal zum neugestalteten Nibelungenplatz in Tulln an der Donau. Karl Ploberger widmet sich farbenfrohen Blattschmuckpflanzen, Uschi stellt die Aroniabeere vor.

    Der Nibelungenplatz wurde von einer versiegelten Fläche zum klimaresilienten Stadtraum umgestaltet. Staudenbeete, Gräser, klimafitte Bäume und rund 70.000 Zwiebelpflanzen schaffen mit dem Schwammstadt-Prinzip einen nachhaltigen Begegnungsort mitten in der Stadt.
    Moderation: Karl Ploberger

