  title: 'Gefängnisse: Mandaluyong City, Philippinen'
  subtitle: 'Gefängnisse: Mandaluyong City, Philippinen'
  description: Mandaluyong City liegt im Großraum Manila. Rund fünfundzwanzig Prozent der Einwohner der Philippinen leben in Armut. Viele Schicksale führen in die Kriminalität. Die häufigsten Straftaten sind Betrug, Prostitution und Drogen. Weibliche Straftäterinnen, die erwischt werden, landen oft in der Correctional Institution for Women, dem ältesten und größten Frauengefängnis der Philippinen. Die Bandbreite der Häftlinge reicht von Kleinkriminellen bis hin zu Mörderinnen und Gangmitgliedern.
  widescreen: true
- eventId: 1025638
  start: 2026-09-22T02:33:00Z
  stop: 2026-09-22T03:14:00Z
  title: Das Hochsicherheitsgefängnis Anamosa
  subtitle: Das Hochsicherheitsgefängnis Anamosa
  description: Mehr als tausend Häftlinge sitzen im Hochsicherheitsgefängnis Anamosa im mittleren Westen der USA ein. Kriminelle Gangs stehen hier im Fokus. Doch für keinen Schwerverbrecher gibt es ein vorzeitiges Entkommen aus der historischen Haftanstalt, die "Weißer Palast des Westens" genannt wird. Seit 60 Jahren gab es keinen Ausbruch, die Insassen werden rund um die Uhr von 200 Wärtern überwacht. Etwa 20 Prozent der Insassen wird Anamosa nie verlassen, denn sie verbüßen eine lebenslange Freiheitsstrafe.
  widescreen: true
