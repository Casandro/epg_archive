  title: Der Zoll - Auf Schmugglerjagd (2)
  subtitle: Der Zoll - Auf Schmugglerjagd (2)
  description: 'Das dunkle Geschäft der Waffenschieber und Drogendealer an den deutschen Grenzen wächst bedrohlich. Seit 2012 führt der Deutsche Zoll in den Brennpunkten daher Autobahnkontrollen mithilfe sogenannter Vollmobilen Röntgenanlagen durch: Dabei durchleuchtet ein mit einem Röntgenarm aufgerüsteter LKW verdächtige Fahrzeuge zentimetergenau. Der Vorteil: Die Beamten können aus sicherer Entfernung Schmuggler und Dealer schneller entlarven und hochnehmen.'
