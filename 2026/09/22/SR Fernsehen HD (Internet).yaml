  title: Krieg der Träume - 1918-1939
  subtitle: Entscheidungen
  description: 'Die wirtschaftliche Lage in Europa ist prekär: Inflation und Arbeitslosigkeit steigen. Breite Teile der Bevölkerung leiden Hunger. In Italien kommt es zu schweren Unruhen, in Deutschland besetzen kommunistische Kämpfer Fabriken, um gegen die Arbeitsbedingungen zu protestieren. Rechte Freikorps und die Reichswehr gehen brutal gegen Arbeiter vor. Während die Kluft zwischen Arm und Reich wächst, boomt in Berlin die Unterhaltungsindustrie.'
