- eventId: 1126265
  start: 2026-09-22T16:50:00Z
  stop: 2026-09-22T17:20:00Z
  title: Wir im Saarland - Service
  subtitle: 'Moderation: Celina Fries'
  description: |-
    Themen u.a.:
    * Rettungsdienste: In ganz Deutschland gibt es vor allem am Wochenende immer mehr Bagatelleinsätze, steigende Kosten und überfüllte Notaufnahmen. Wir gehen der Frage nach, ob es Alternativen gibt und wie diese aussehen könnten.
    * Digitales Bezahlen: Es ist mittlerweile kinderleicht - mit wenigen Klicks eine Rechnung bezahlen oder Freunden Geld überweisen. Besonders beliebt sind amerikanische Anbieter wie Visa oder Paypal. Kaum bekannt sind deutsche und europäische Alternativen. Wir zeigen, welche das sind und wie sie funktionieren.
