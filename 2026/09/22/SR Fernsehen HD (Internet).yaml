  title: Wir im Saarland - Grenzenlos extra
  subtitle: 'Fahr mal hin: Das Schieferland rund um Kaisersesch'
  description: "An manchen Orten wird Landschaft noch natürlich gepflegt. Hier kommen die Menschen noch etwas knorzig daher. Es geht ins Land des Schiefers rund um Kaisersesch in der Eifel. \nDie Reporter der Sendung sind unterwegs nördlich der steilen Flanken des Mosel- tals, wo die Eifelhöhen sich ganz allmählich aufschwingen. Kleine Dörfer liegen verstreut. \nEs ist eine Gegend, wo man Zeit für kleine Entdeckungen hat, wie im Kirchturm von Müllenbach. Das Schieferland lädt ein, in ihm eine kurze Ewigkeit zu verbringen."
