  title: Die besten Köche der Welt - Zu Gast im Ikarus - Jorge Vallejo
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jorge Vallejo
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein reist nach Mexico City, um von Jorge Vallejo in seinem Restaurant "Quintonil" dessen beste Rezepte zu studieren. Der aufstrebende Spitzenkoch Jorge Vallejo gilt als Revolutionär der mexikanischen Küche. Martin Klein will diese exotischen Gerichte im Ikaurs umsetzen, und muss dafür viel lernen: von der richtigen Würzung von Ameiseneiern bis hin zur Vorbereitung essbarer Kakteen. AT 2017'
- eventId: 1044096
  start: 2026-09-22T19:10:00Z
  stop: 2026-09-22T19:56:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Nicolai Norregard
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Nicolai Norregard
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Seit Jahren setzt die skandinavische Küche, die Nordic Cuisine, konsequent Trends in der internationalen Gastro-Szene. Im Kadeau legt Starkoch Nicolai Nørregaard besonders großen Wert auf lokale Produkte - insbesondere jene, die sich nicht sofort als typisch dänisch aufdrängen. Nørregaard eröffnete sein erstes Restaurant in seiner Heimat, der dänischen Sommerinsel Bornholm, und Bornholm ist immer noch in der DNA seiner Küche. Obst, Kräuter und Beeren werden gepickelt, getrocknet und eingesalzt und gesellen sich zu gegrillten Austern und geräuchertem Lachs. Ein Fest für alle Sinne, nicht zuletzt für das Auge. Das gilt nicht nur für die sensationellen Kreationen auf dem Teller, sondern auch für das Kadeau als solches: Martin Klein, Executive Chef des Salzburger Restaurant Ikarus, ist überrascht, als er sich dem Haus zum ersten Mal nähert. Eine kleine blaue Holztür in einer kleinen Kopfsteinpflastergasse - das soll es sein? Doch dahinter verbirgt sich ein liebevoll gestaltetes Restaurant, das allen Erwartungen an skandinavisches Design gerecht wird. Die Küche steht mitten im Raum, jeder Gast muß sie auf dem Weg zum Tisch durchqueren. Martin Klein ahnt: Es wird wieder abenteuerlich. Nur drei Tage Zeit, um gemeinsam ein Menü zu kreiieren, das den Monat Oktober im Ikarus bespielt - wird Martin Klein es wieder schaffen? AT 2017'
- eventId: 1044097
  start: 2026-09-22T20:00:00Z
  stop: 2026-09-22T20:46:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Quique Dacosta
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Quique Dacosta
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Kleins kulinarische Reise führt an die spanische Küste, wo er im Örtchen Dénia auf seinen renommierten Kollegen Quique Dacosta trifft. Über die Jahre hat Quique Dacosta eine innovative neue valencianische Küche etabliert. It is a new style, a contemporary Mediterranean style, where every part of what we are is encapsulated, with or without references. We are free, and we are rewriting the rulebook.Was wie ein Werdegang aus dem Märchen klingt, ist für Quique Dacosta wahr geworden: Denn bereits als Jugendlicher begann er in dem Restaurant als Küchenhilfe zu arbeiten, das heute seinen Namen trägt. Seit 2009 betreibt er das mit drei Michelin-Sternen ausgezeichnete Quique Dacosta Restaurante. Die Regeln dort sind seit mehr als 15 Jahren dieselben: qualitativ hochwertige Produkte, perfektes Handwerk und Respekt vor der Natur. Inspiriert von den schönen Künsten entwickelten sich Dacostas Kreationen stetig weiter - er setzt dabei, ganz dem Trend entsprechend, auf Produkte aus der Umgebung, nichts wird hier verarbeitet was weiter als 75 Kilometer entfernt geerntet, gefischt oder erlegt wurde. Die im Restaurant servierten Tapas erzählen eine Geschichte, sie stehen für Dynamik, Kreativität und Geschwindigkeit.  Ein Wirbelwind an Geschmäckern, Texturen und Emotionen! Die schlichte Eleganz auf den Tellern spiegelt sich auch im Interieur des Restaurants wider. Das hat natürlich auch das Interesse von Martin Klein - Executive Chef des Hangar-7 - geweckt. Wie so oft hat Martin Klein nur wenige Tage Zeit um in das komplexe Küchenuniversum einzutauchen. Gemeinsam wird verkostet, getüftelt und gekocht. AT 2017'
- eventId: 1044098
