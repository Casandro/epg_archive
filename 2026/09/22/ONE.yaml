  description: "Thomas dementiert die Hochzeitsgerüchte mit Aylin, beginnt aber zu spüren, dass Aylin einer Heirat gegenüber alles andere als abgeneigt wäre. Obwohl sie sich nüchtern gibt, erträumt sie sich Thomas _ Heiratsantrag.\n \nIn Theo wächst leise Hoffnung, dass Frauke seine Gefühle doch noch erwidern könnte, als sie sich öffnet und erstmals über ihre Bindungsängste spricht.\n \nDie verliebten Nathalie und Fabian beschließen zusammenzuziehen, aber Nathalie ist irritiert, als Fabian die Karriere in Japan für sein Familienglück opfern will.\n \nJustus sagt einem ominösen Komplizen zu, Gunters 'Brueghel' so bald wie möglich aufzutreiben."
