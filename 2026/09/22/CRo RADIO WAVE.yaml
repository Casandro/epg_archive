  title: Impakt
  description: '"Komunální volby jsou podle mě úplně krásný příklad toho, jak politický je úplně naprosto všechno," říká novinářka Tereza Povolná. Přesto v nich volí jen asi polovina voličů - z mladých pak plánuje podle průzkumu Ipsos k letošním komunálním volbám určitě přijít 47 procent. Proč by mělo dvacetiletého člověka zajímat, kdo sedí v jeho rodném městě na radnici? A pomohlo by snížení věku voličů na 16 let? Poslechněte si nový díl Impaktu na Radiu Wave. Moderuje Adéla Šponerová.'
