  title: Modeláři
  description: Hrát primitivní hudbu bylo vědomé rozhodnutí - a bylo to rozhodnutí dobré. Kapela Pakosteň teď vydala album Spevy smutných lotrov a do Modelářů přišla v kompletní sestavě promluvit nejen o zálibě ve špinavé hudbě, ale i přetrvávajícím spojení se sídlištní poetikou a o tom, jak moc vnímají svou vlastní hudbu jako temnou. Moderují Banán a Viktor Palák.
