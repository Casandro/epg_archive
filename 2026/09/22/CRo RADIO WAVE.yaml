  title: Podhoubí
  description: 'Kdo miluje Šumavu a místní přírodu? To ví nejlíp Richard Brož z projektu #WeLoveSumava, která má za cíl propagovat krásy Šumavy a zároveň poukazovat na její problémy. O tom, jak se dá přírodě komunitně pomáhat a šířit osvětu, se s ním na Festivalu Vimperk bavila Magdalena Kořenová. Poslechněte si více v záznamu z živého Podhoubí! Moderuje Magdaléna Kořenová. (repríza)'
- eventId:
  - 1075665
  - 1077481
  start: 2026-09-22T16:00:00Z
  stop: 2026-09-22T17:00:00Z
  title: Šatníky
  description: Poslechněte si, jaké kolekce zazářily na Mercedes-Benz Prague Fashion Weeku v klubu Sasazu. Vedu byla na MBPFW poprvé, Veronika Ruppert zase byla na všech dosavadních vydáních od začátků v roce 2010. V podcastu uslyšíte o kolekcích od Tomáše Višňovského, Hany Valtové, On The Boat nebo Valerie Jurčíkové. Moderují Veronika Ruppert a Veronika Dušková.
- eventId:
  - 1075666
  - 1077482
  start: 2026-09-22T17:00:00Z
  stop: 2026-09-22T17:30:00Z
  title: Nádech
  description: Udržovat přátelství - nebo dokonce navazovat nová - může být v dospělosti dost těžké. "Vyžaduje to pravidelnost a konzistenci, je to investice. A když jsme v práci, potom s rodinou nebo partnerem, tuhle investici často odkládáme na později," říká psychoterapeutka ve výcviku a lektorka Katarína Bieliková. Proč je v dospělosti tak těžké dělat si nové kamarády? Kde nové přátelé hledat a proč mohou pomoci společné zájmy? Jaké dovednosti z nás vůbec dělají dobré přátele a jak začínající přátelství prohlubovat? Uslyšíte v nové epizodě Nádechu! Moderuje Lucie Zajda.
