  title: Reportéri (22)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: DOTOVANÝ SMRAD:Neznesiteľný zápach a bezmocné úrady. Obyvatelia obce Úbrež v okrese Sobrance hovoria o nočnej more, ktorú prežívajú už osem rokov pre miestnu slepačiu farmu. Michalovský podnikateľ tu ročne odchová viac ako pol milióna brojlerov. Problémy farmy pritom opakovane riešili úrady a padli aj pokuty. Napriek tomu chov pokračuje. Priamo za halami sme okrem zápachu našli aj uhynuté kurčatá.XXXOHOLENÝ SYNDIKÁT 2Dom novinárov v centre Bratislavy už Slovenskému syndikátu novinárov nepatrí. Pred rokmi ho vtedajšie vedenie založilo v prospech nevýhodnej pôžičky od súkromnej firmy. Po rokoch súdnych sporov sa lukratívna nehnuteľnosť dostala do rúk neznámeho občana Kanady. Z jej predaja novinárska organizácia dodnes nevidela ani cent. V pozadí predaja sú schránkové firmy s nastrčenými konateľmi. Najnovšie sa syndikát obáva aj návrhu na vyhlásenie konkurzu. (2026)
  genre:
  - '32'
- eventId: 1127746
  start: 2026-09-22T19:30:00Z
  stop: 2026-09-22T20:00:00Z
  title: Cez lupu (28)
  subtitle: Sankcie prišli, problémy zostali. Kauzy, kriminálne prípady, životné situácie, udalosti. Témy, o ktorých je dobré vedieť viac.
  description: Státisíce kurčiat, neznesiteľný zápach, mŕtve zvieratá a opakované pokuty. Ako je možné, že farma môže napriek zisteniam úradov fungovať ďalej? A kde sa končia právomoci veterinárov a inšpektorov životného prostredia? (2026)
  genre:
  - '35'
