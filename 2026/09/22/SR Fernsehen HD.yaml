  title: Hannes und der Bürgermeister
  subtitle: Fremdenverkehr / Chancengleichheit
  description: 'Durch Fremdenverkehr soll das Städtchen attraktiv gemacht werden. Die Frage ist nur: Was ist in der eigentlich langweiligen Stadt attraktiv? Auch da weiß Hannes Rat und überredet den Bürgermeister, einen Werbespot zu drehen. Dass dies im Chaos endet, ist vorhersehbar. Der Bürgermeister fühlt sich benachteiligt, doch die Chancengleichheit stellt sich sofort anders dar, wenn es um die Wahlen geht. Da überspringt der Bürgermeister schon mal Abmachungen, aber sein schlitzohriger Amtsbote, der Chancengleichheit wahren will in demokratischer Gesinnung, löst auch dieses Problem.'
