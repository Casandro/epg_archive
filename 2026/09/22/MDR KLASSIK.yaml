  stop: 2026-09-22T19:00:00Z
  title: MDR KLASSIK - Kombo
  description: "Kombo\nMusik trifft Bücher, Kunst und Küche. Drei Moderatorinnen mit drei Kombinationen. \nUnerhört, unterhaltsam und überraschend.\n\nKombo mit Grit Schulze \n\nROM - Wo Steine ewig klingen\nRom ist eine Stadt, in der Musik Geschichte hat und Geschichte immer wieder zu Musik wird. \nVon den Klängen der Antike und der päpstlichen Kapelle über Palestrinas Vokalpolyphonie, Corellis barocke Klangpracht und Händels römische Jahre bis zu Puccinis unsterblicher \"Tosca\": eine musikalische Reise durch die Ewige Stadt - und hinein in die römischen Sommernächte, wenn in den Caracalla-Thermen, im Circus Maximus, bei Jazzfestivals und in der Römischen Oper die Stadt ganz in Musik aufgeht."
- eventId: 541915
  start: 2026-09-22T19:00:00Z
  stop: 2026-09-22T20:00:00Z
  title: MDR KLASSIK - Neue Musik
  description: "Neue Musik aktuell\n\nSteve Reich zum 90. Geburtstag\n\nKurztext: Er gilt als einer der Pioniere der Minimal Music und veränderte damit ab Mitte der 1960er-Jahre nicht nur die amerikanische Neue Musik-Szene. Einflüsse afrikanischer, balinesischer und jüdischer Musik finden sich in seinen Kompositionen. Seine \"Music for 18 Musicians\" von 1976 wiederum beeinflusste auch Teile der Rockmusik und der Filmmusik. Am 3. Oktober ist der 90. Geburtstag von Steve Reich, der seinen Zugang zur Musik einmal mit den Worten beschrieb: \"Als ich anfing zu komponieren, tat ich das, weil ich Bach, Strawinsky und Bebop liebte.\" Ein universeller Komponist jenseits aller stilistischen Scheuklappen.\n\nAutor: Andreas Göbel\n\n1 \nKom:  Steve Reich  04'09\nTit: Desert Music   \nSatz: Nr. 5. Viertel = c.192 (Ausschnitt)   \nInt: Tonkünstler-Orchester Niederösterreich \nChorus sine nomine \nLeitung: Kristjan Järvi \n                 \n2 \nKom:  Steve Reich  03'28\nTit: Clapping Music   \nInt: Steve Reich, Händeklatschen \nKristjan Järvi, Händeklatschen \n                 \n3 \nKom:  Steve Reich  03'07\nTit: Come Out (Ausschnitt)   \n                 \n4\nKom:  Steve Reich  04'07\nTit: Piano phase (Ausschnitt)   \nInt: GrauSchumacher Piano Duo \nI-Bem: Mitschnitt Ultraschall Berlin 2014 \n                 \n5 \nKom:  Steve Reich  02'15\nTit: Piano Phase. Bearbeitet für Cembalo solo (Ausschnitt)   \nInt: Mahan Esfahani, Cembalo \n                 \n6 \nKom:  Steve Reich  05'05\nTit: Piano Phase. Remix   \nInt: DJ D*Note \n                 \n7 \nKom:  Steve Reich  04'06\nTit: Drumming   \nSatz: Part One (Ausschnitt)   \nInt: Steve Reich, Perkussion \nEnsemble Modern \nLeitung: Sian Edwards \n                 \n8 \nKom:  Steve Reich  04'59\nTit: Proverb (Ausschnitt)   \nInt: Mitglieder des Steve Reich Ensemble \nTheatre of Voices \nLeitung: Paul Hillier \n                 \n9\nKom:  Steve Reich  07'54\nTit: Music For 18 Musicians   \nSatz: Section VII und VIII   \nInt: Steve Reich Ensemble \n                 \n10 \nKom:  Steve Reich  08'59\nTit: Different trains   \nSatz: Nr. 1. America-Before the War   \nInt: Kronos Quartet \n\nFüllstück:\nAusschnitt aus dem \"New York Counterpoint\" von Steve Reich"
