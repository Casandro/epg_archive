  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Johann Christian Ludwig Abeille: Grand Concerto D-Dur, op. 6 (Kölner Klavier-Duo; Kölner Rundfunkorchester: Florian Merz); Joseph Haydn: Sinfonie Nr. 96 D-Dur - "The Miracle" (Cappella Coloniensis: Bruno Weil); Gaetano Brunetti: Streichquartett B-Dur (Schuppanzigh-Quartett); Johan Wagenaar: "Saul en David", op. 24 (Nordwestdeutsche Philharmonie: Antony Hermus); Johann Wenzel Kalliwoda: Sinfonie Nr. 7 g-Moll (Das Neue Orchester: Christoph Spering)

    2.03  Das ARD-Nachtkonzert (II)

    Wolfgang Amadeus Mozart: Sinfonie C-Dur, KV 425 - "Linzer" (Symphonieorchester des Bayerischen Rundfunks: Mariss Jansons); John Field: Klavierkonzert Nr. 7 c-Moll (Benjamin Frith, Klavier; Northern Sinfonia: David Haslam); Joseph Haydn: Streichtrio B-Dur, Hob. XVI/41 (Wiener Streichtrio); Johan Peter Emilius Hartmann: "Coreggio", op. 59 (Sinfonieorchester des Dänischen Rundfunks: Thomas Dausgaard); Nikolaj Rimskij-Korsakow: "Der goldene Hahn", Suite (Seattle Symphony: Gerard Schwarz)

    4.03  Das ARD-Nachtkonzert (III)

    Jules Massenet: Fantasie (Truls Mørk, Violoncello; Orchestre de la Suisse Romande: Neeme Järvi); Ludwig van Beethoven: Sonate Es-Dur, op. 12, Nr. 3 (Viktoria Mullova, Violine; Kristian Bezuidenhout, Kavier); Domenico Cimarosa: Flötenkonzert G-Dur (James und Jeanne Galway, Flöte; London Mozart Players)

    5.03  Das ARD-Nachtkonzert (IV)

    Ludwig van Beethoven: Klaviertrio Es-Dur, Allegro, op. 1, Nr. 1 (Trio Fontenay); Josef Myslivecek: Sinfonie C-Dur (London Mozart Players: Matthias Bamert); Johan Svendsen: Sinfonie Nr. 1 D-Dur, Molto allegro (Bournemouth Symphony Orchestra: Bjarte Engeset); Carl Millöcker: "Der Bettelstudent", Ouvertüre (Nürnberger Symphoniker: Christian Simonis); Marianna von Martines: Klavierkonzert G-Dur, Adagio (Idith Meshulam Korman, Klavier; Oxford Philharmonic Orchestra: Cayenna Ponchione-Bailey); Gioacchino Rossini: "Il barbiere di Siviglia", Ouvertüre (Münchener Kammerorchester: Alexander Liebreich)
