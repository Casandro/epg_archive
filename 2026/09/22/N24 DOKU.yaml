  start: 2026-09-22T14:50:00Z
  stop: 2026-09-22T15:44:00Z
  title: Lost Places - Folge 95
  subtitle: Lost Places - Folge 95
  description: 'Faszinierende Überreste vergangener Zeiten: Im schottischen Edinburgh erzählen unterirdische Gewölbe eine Geschichte von Aufbruch, Niedergang und Elend. Außerdem: Ein Fort an Kroatiens Küste, erbaut von einem vergangenen Reich zum Schutz einer mächtigen Flotte. Eine verlassene Fabrik in Island, die mit flüssigem Gold für wirtschaftlichen Aufschwung sorgte. Und: die Spuren einer Schlacht auf amerikanischem Boden, die die USA erschütterte.'
  widescreen: true
- eventId: 1048129
  start: 2026-09-22T15:44:00Z
  stop: 2026-09-22T16:23:00Z
  title: Lost Places - Folge 97
  subtitle: Lost Places - Folge 97
  description: Wie ein Spinnennetz aus Stahl schweben die Seilbahnen über Tschiatura, Georgiens einst blühender Bergbaustadt. Ehemals pulsierende Adern, die Arbeiter zu den Minen brachten, sind sie heute stille Zeugen des Niedergangs. Viele Einwohner verließen die Stadt, und das "Venedig der Lüfte" verfiel zur Geisterstadt. Was geschah mit diesem einzigartigen Ort?
  widescreen: true
