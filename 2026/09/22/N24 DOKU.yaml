  title: 'Gefängnisse: Mandaluyong City, Philippinen'
  subtitle: 'Gefängnisse: Mandaluyong City, Philippinen'
  description: Mandaluyong City liegt im Großraum Manila. Rund fünfundzwanzig Prozent der Einwohner der Philippinen leben in Armut. Viele Schicksale führen in die Kriminalität. Die häufigsten Straftaten sind Betrug, Prostitution und Drogen. Weibliche Straftäterinnen, die erwischt werden, landen oft in der Correctional Institution for Women, dem ältesten und größten Frauengefängnis der Philippinen. Die Bandbreite der Häftlinge reicht von Kleinkriminellen bis hin zu Mörderinnen und Gangmitgliedern.
