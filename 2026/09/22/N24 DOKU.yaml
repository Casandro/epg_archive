  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 19'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 19'
  description: 'An der Grenze spitzen sich die Ereignisse zu: Auf einer Brücke fleht eine venezolanische Familie um Einlass und stellt die Beamten vor eine menschlich wie rechtlich extreme Entscheidung. In Progreso führt eine routinemäßige Kontrolle zu einem brisanten Fund, der mehr offenbart als nur geschmuggelte Pillen. In Laredo endet eine Verkehrskontrolle mit dem Fund von Crystal Meth im Millionenwert, während andere ihr Leben riskieren, um den Rio Grande zu durchqueren.'
  widescreen: true
- eventId: 1048131
  start: 2026-09-22T17:12:00Z
  stop: 2026-09-22T18:15:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 20'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 20'
  description: 'An der World Trade Bridge machen Zöllner einen spektakulären Fund: 140 Kisten voller Drogen sind in einem völlig unerwarteten Fahrzeug versteckt. In Progreso versucht ein mutmaßliches Gangmitglied unauffällig die Grenze zu passieren, während zwei Teenager mit Angstlösern erwischt werden - und ihre Geschichte eine tragische Wendung nimmt. In Laredo stoßen Ermittler auf ein raffiniert gebautes Geheimfach in einem Pick-up. Nur mit Köpfchen lässt sich der Code knacken.'
  widescreen: true
