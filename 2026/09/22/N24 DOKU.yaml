  title: Das Hochsicherheitsgefängnis Anamosa
  subtitle: Das Hochsicherheitsgefängnis Anamosa
  description: Mehr als tausend Häftlinge sitzen im Hochsicherheitsgefängnis Anamosa im mittleren Westen der USA ein. Kriminelle Gangs stehen hier im Fokus. Doch für keinen Schwerverbrecher gibt es ein vorzeitiges Entkommen aus der historischen Haftanstalt, die "Weißer Palast des Westens" genannt wird. Seit 60 Jahren gab es keinen Ausbruch, die Insassen werden rund um die Uhr von 200 Wärtern überwacht. Etwa 20 Prozent der Insassen wird Anamosa nie verlassen, denn sie verbüßen eine lebenslange Freiheitsstrafe.
