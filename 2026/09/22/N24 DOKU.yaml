  title: Frauen in Russlands Gefängnissen
  subtitle: Frauen in Russlands Gefängnissen
  description: In Russland gibt es 35 Straflager für Frauen. Hinter Mauern und Sperrringen aus Stacheldraht, überwacht von Videos und Bewegungsmeldern sitzen Kleinkriminelle zusammen mit Mörderinnen ein. Mehrmals täglich kontrollieren Wachen, ob die Zäune beschädigt wurden oder jemand womöglich einen Ausbruch vorbereitet. WELT-Reporter Christoph Wanner hat einen Blick ins Innere der Lager geworfen und zeigt den Alltag der weiblichen Strafgefangenen in ihren Wohn- und Arbeitsbaracken.
