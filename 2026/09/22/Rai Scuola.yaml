  title: L' archipendolo - Speciale Sergio Musume
  subtitle: 'L'' archipendolo - Speciale Sergio Musumeci Sergio Musmeci - prima parte - Sergio Musmeci è stato uno dei protagonisti della scuola italiana di ingegneria del Novecento. Nasce a Roma nel 1926, si laurea in '
  description: ingegneria civile e dopo una breve collaborazione con Morandi e Nervi, apre il suo studio in casa coinvolgendo nell' attività professionale la moglie Zenaide Zanini. Collabora con i più importanti architetti del tempo, che si affidano alla genialità delle sue soluzioni. Nascono così molte opere innovative, dove sperimenta nuove forme strutturali, forme talmente nuove che non esistono ancora parole per definirle. Musmeci si dedica anche a studi teorici, diventa ricercatore presso la facoltà di Architettura di Roma e successivamente insegnante del corso Ponti e Grandi Strutture.
