  title: 'Progetto Scienza Storie della Scienza - '
  subtitle: 'Progetto Scienza Storie della Scienza - ep.01 Biodiversità - Progetto Scienza Storie della Scienza è il programma condotto dal filosofo della scienza Telmo Pievani, con la partecipazione della giornalista '
  description: "scientifica Silvia Bencivelli, che approfondisce come e perché la scienza sia diventata così centrale nel mondo di oggi. Le puntate raccontano la storia e l'evoluzione del pensiero scientifico, con le scoperte, le intuizioni, gli esperimenti, le invenzioni, l'applicazione del metodo scientifico. Storie della scienza che ci hanno svelato le regole del mondo e fondato la nostra civiltà. Da sempre filosofi e scienziati guardano al mondo che li circonda col desiderio di conoscere e catalogare gli esseri che lo abitano. In questo episodio raccontiamo il modo in cui ci siamo dedicati a questo obiettivo. A partire dalle osservazioni più empiriche, con Aristotele, la catalogazione delle specie animali e vegetali del pianeta è passata poi attraverso la convinzione che esistessero animali fantastici e erbe magiche, per arrivare solo attraverso le teorie evoluzionistiche e la genetica a una comprensione più precisa della ricchezza e della diversità che ci circondano, e che non abbiamo il diritto di estinguere. Percorriamo questa storia della scienza con Barbara Continenza - Storica della Scienza e delle Tecniche, Università Tor Vergata, Piero Genovesi - Zoologo, ISPRA, Renato Bruni - Botanico, Università di Parma. - \n\nun programma di Telmo Pievani, Silvia Bencivelli, Diego Garbati, Mario Ferrari, Daniela Mazzoli, Edwige Pezzulli, Francesco Linguiti a cura di Serena Patrignanelli, Eleonora Ottaviani e Caterina Mazzuoli progetto a cura di Diego Garbati regia Mario Ferrari conduce Telmo Pievani con la partecipazione di Silvia Bencivelli"
