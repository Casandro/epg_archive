  description: "rie ottiene il prestigio e la notorietà che merita. Il suo corso di Ponti e Grandi Strutture presso la facoltà di Architettura di Roma viene riconfermato. Musmeci conquista una autonomia progettuale che gli consente di realizzare la sua opera costruita più famosa: il ponte sul Basento a Potenza, da molti definito il ponte più bello del mondo. Proprio in questa struttura unica e rivoluzionaria, Musmeci mette in pratica la sua teoria del Minimo Strutturale, risultato delle sue decennali ricerche nel campo della statica delle strutture. Al culmine della carriera, a soli 54 anni, Musmeci muore per una malattia incurabile, lasciando sul tavolo di lavoro tante idee originali da sviluppare. - \n\n"
