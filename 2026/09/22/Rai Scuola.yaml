  title: Memex Nautilus - Attratti dalla Luna
  subtitle: Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. Il tema di q
  description: 'uesta puntata è l''Astro d''argento, l''unico satellite naturale del pianeta Terra, oggetto di culto e adorazione fin dalla notte dei tempi e oggi più che mai al centro dei piani strategici delle agenzie spaziali più importanti: la Luna. A tenerci per mano in questo ''viaggio'' sono due donne: la planetologa dell''Inaf Maria Cristina de Sanctis e la responsabile dell''Unità Esplorazione e Osservazione dell''Universo dell''Agenzia Spaziale Italiana, Barbara Negri. Al Dipartimento di Scienze e Tecnologie Aerospaziali del Politecnico di Milano, scopriamo poi con la professoressa Michéle Lavagna alcune delle meraviglie tecnologiche (sonde e lander) che si stanno sviluppando in Italia per le prossime missioni sulla Luna. Anna Pancaldi ci racconta invece la storia di un piccolo libro (appena 56 pagine) che ha segnato una svolta epocale nella nostra storia: il ''Siderus Nuncius'' di Galileo Galilei. Ci svela anche alcuni curiosi retroscena della famosissima frase pronunciata da Neil Armstrong, appena messo piede sulla Luna: Un piccolo passo per un uomo, un grande passo per l''umanità. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
