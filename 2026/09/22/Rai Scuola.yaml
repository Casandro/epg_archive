  title: Progetto Scienza STEM - p. 15 - Motori
  subtitle: Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo della ricer
  description: 'ca e dell''innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna alla scoperta della tecnologia più importante e in evoluzione del settore automotive: il motore. Siamo di fronte a una tecnologia che sta cambiando e promette di mutare il mondo in cui viviamo. Ci raccontano la frontiere della ricerca e della nuova mobilità Davide Barana, direttore tecnico di Ducati Corse; Laura Cozzi, chief energy modeller all''Agenzia internazionale dell''Energia, a Parigi; Giulia Marchisio, chimica industriale e oggi program manager per l''area additive manufacturing al CIM 4.0, il Competence Center di Torino; Francesca Soavi, che all''Università di Bologna e al nuovo Centro di Ricerca Ambiente Energia e Mare del Tecnopolo di Ravenna sta lavorando a un''innovativa batteria, a ricarica ''liquida''; Dino Brancale e Federico Ferrero, che a Cavriago di Reggio Emilia progettano la tecnologia necessaria a realizzare un motore ibrido per grandi automezzi e veicoli commerciali, un motore a combustione interna alimentato a idrogeno. - un programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga'
