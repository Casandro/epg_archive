  title: Progetto Scienza Newton (pt. 26) 'Mutazi
  subtitle: Progetto Scienza Newton (pt. 26) 'Mutazioni genetiche e OGM' - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita la professores
  description: sa Giulia De Lorenzo del Dipartimento di Biologia e Biotecnologie Molecolari 'Charles Darwin', dell'Università Sapienza di Roma. Assieme ci conducono alla scoperta della genetica applicata al mondo vegetale, dai primi tentativi che risalgono agli albori dell'agricoltura, fino alle moderne tecniche dell'editing del DNA. Scopriamo con loro quali sono le tecnologie, le innovazioni positive o le eventuali controindicazioni relative agli organismi geneticamente modificati e ingegnerizzati. Presso l'Istituto di Bioscienze e Biorisorse del CNR di Portici, la dott.ssa Maria Stefania Grillo ci presenta la 'ricetta' del pomodoro OGM. Luca Perri ci porta invece a scoprire le numerose bufale e false credenze legate al mondo OGM. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga.
