  subtitle: Naša poslednja Letnja bašta u ovoj sezoni biće ispunjena premijerama. Najavljujemo premijeru filma "Kengur se vraća kući" Miroslava Momčilovića, sa Andrijom Kuzmanovićem u naslovnoj ulozi.
  description: 'Naša poslednja Letnja bašta u ovoj sezoni biće ispunjena premijerama. Najavljujemo premijeru filma "Kengur se vraća kući" Miroslava Momčilovića, sa Andrijom Kuzmanovićem u naslovnoj ulozi. Iako nije nastavak filma "Kad porastem biću kengur" postoje neke poveznice, koje vam otkrivamo u emisiji. Deca iz programa Muzika nade objavila su svoju prvu autorsku pesmu "Probudi se!", nastalu iz njihovih stvarnih iskustava i izjava o tome šta im muzika znači u borbi za bolju budućnost. Pesma "Probudi se!" govori o izazovnoj svakodnevici, trenucima kada nije lako i onome što decu koja odrastaju sa manjkom prilika pokreće da nastave: muzici, prijateljstvu, ekipi, upornosti i osećanju pripadanja. Tekst pesme nastao je na osnovu autentičnih izjava dece iz programa Muzika nade, o čemu razgovaramo sa Dijanom Opačić Nikolić iz organizacije "Muzika nade". Premijerno slušamo novu pesmu grupe "Neverne bebe" - "Ovo je kraj". O njoj i predstojećem koncertu benda u MTS dvorani 2. oktobra, razgovaramo sa...'
