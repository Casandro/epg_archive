- eventId: 1016649
  start: 2026-09-22T22:00:00Z
  stop: 2026-09-23T02:00:00Z
  title: Širom zatvorenih očiju
  subtitle: Usred srede, pa ne baš, ali u sredu u ponoć zavrtećemo još jedan krug noćnog programa "Širom zatvorenih očiju".
  description: Svet kakav smo poznavali potpuno je promenjen pojavom interneta - na jedan klik smo od onlajn kurseva, tutorijala, knjiga u elektronskom obliku, dokumentarnih programa, fotografija. Uz sve snažnije prodiranje društvenih mreža u realne živote počinje i priča o usamljenosti pojedinca - dok pratimo takozvane onlajn prijatelje i gledamo detalje iz njihovih života, sami postajemo sve nesigurniji. Međutim, da li je zaista tako, ili smo i ranije bili podjednako usamljeni? Internet je otvorio i pitanja smanjene privatnosti, onlajn zlostavljanja i razlike između stvarnog i virtuelnog "ja".
