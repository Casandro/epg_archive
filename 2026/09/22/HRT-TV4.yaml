  title: 'Romano Bolković - 1 na 1: Davor Ivo Stier, talk show'
  subtitle: S gostom Davorom Ivom Stierom razgovaramo o Srbiji nakon pogreba Ratka Mladića, političkoj ulozi Srpske pravoslavne crkve, odnosima Beograda s Moskvom, Pekingom i Parizom te o tome može li Srbija.
  ageRating: 4
  genre:
  - '160'
  description: S gostom Davorom Ivom Stierom razgovaramo o Srbiji nakon pogreba Ratka Mladića, političkoj ulozi Srpske pravoslavne crkve, odnosima Beograda s Moskvom, Pekingom i Parizom te o tome može li Srbija doista napredovati prema članstvu u Europskoj uniji bez jasnog geopolitičkog opredjeljenja. Razgovaramo i o Kosovu, Crnoj Gori i vjerodostojnosti politike proširenja, ali i o pitanju može li se Europska unija dalje širiti bez promjene vlastitog načina odlučivanja. U širem europskom kontekstu govorimo o ratu u Ukrajini, budućem odnosu Europe i Rusije, mogućoj novoj sigurnosnoj arhitekturi kontinenta, ulozi Britanije i Kanade, odnosu Europske unije i NATO-a te o tome što bi europska strateška autonomija zapravo trebala značiti. Otvaramo i pitanje ubrzanog europskog naoružavanja, nove vojne uloge Njemačke, odnosa Europe prema Sjedinjenim Državama i Kini te, na kraju, mjesta Hrvatske u Europi koja se politički i sigurnosno iznova oblikuje. Davor Ivo Stier je hrvatski europarlamentarni zastupnik (HDZ) u trenutačnom sazivu Europskog parlamenta, izabran na tu dužnost do 2029. godine. Rođen je 6. siječnja 1972. u Buenos Airesu (Argentina). Završio je studij političkih znanosti i međunarodnih odnosa na Papinskom katoličkom sveučilištu Argentina, a potom i Diplomatsku akademiju u Zagrebu te je 1996. primljen u hrvatsku diplomatsku službu. Radio je na završetku pregovora za punopravno članstvo RH u Sjevernoatlantskom savezu i Europskoj uniji i od 2016. do 2017. bio potpredsjednik Vlade i ministar vanjskih i europskih poslova.
