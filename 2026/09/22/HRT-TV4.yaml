  ageRating: 4
  genre:
  - '160'
  description: 'Donosimo životnu i glazbenu priču Gorana Rukavine koji se nakon studija u Grazu skrasio u Ljubljani. Dijelimo isto more i stoljetnu povijest, a koliko se zapravo poznajemo?  Hrvatsku zajednicu u Srbiji uskoro očekuju izbori za njezino zastupničko tijelo - Hrvatsko nacionalno vijeće. Već 103 godine održava se hodočašće gradišćanskih Hrvata u marijansko svetište u Celju. Folklorno društvo Poljanci iz Vulkaprodrštofa organiziralo je tamburaški kamp za mlađe naraštaje. Urednik: Zvonko Božinović'
