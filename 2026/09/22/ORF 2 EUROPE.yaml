  title: Universum
  subtitle: Der Superfisch - Wie der Lachs die Welt bewegt
  description: "Wildlachs scheint allgegenwärtig - und doch ist er in seiner Existenz weltweit bedroht. Dieser bildgewaltige Film führt in einige seiner ganz besonderen Lebensräume, von den Küsten Alaskas, nach Island und von dort weiter nach Patagonien, zu den Gletscherflüssen in Argentinien. \nEr zeigt spektakuläre Naturereignisse, aber auch die dramatischen Folgen von Klimawandel, Überfischung und industrieller Lachszucht.\nIm Mittelpunkt stehen außergewöhnliche Lachse, die mit aller Kraft um ihren Verbleib in Flüssen und Ozeanen ringen, und damit auch das Überleben vieler andere Tierarten sichern. Ihre erstaunliche Anpassungsfähigkeit wird zur Hoffnung in einer Zeit ökologischer Krisen. Ein eindrucksvolles Porträt eines Schlüsseltieres - und eine Reise durch einige der letzten großen Wildnisregionen unseres Planeten.\nEine Dokumentation von Rick Rosenthal"
  genre:
  - '144'
