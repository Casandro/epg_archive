  title: Ohne Grenzen Spezial
  subtitle: Das Behindertensportmagazin
  description: |-
    Zum Internationalen Tag der Gebärdensprachen zeigt "Ohne Grenzen - Das Behindertensportmagazin" im Zeichen des Gehörlosensports die Premiere der ersten österreichischen Dokumentation über die gehörlose Spitzensportlerin Katrin Neudolt, gedreht und gestaltet vom gehörlosen Dokumentarfilmer Christoph Kopal.

    Der Film begleitet Österreichs erfolgreichste Badminton-Spielerin auf ihrem Weg zu einer Medaille bei den Deaflympics 2025 in Tokio und zeigt einen Einblick in eine visuelle und lebendige Sportwelt.

    Die Dokumentation zeigt die Höhen und Tiefen auf dem Weg zur Medaille: die Spannung vor entscheidenden Matches, den Trainingsalltag bei den Deaflympics, die Rückschläge und die Momente des Triumphs.
