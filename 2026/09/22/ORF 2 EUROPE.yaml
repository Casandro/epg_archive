  title: Hinter den Schlagzeilen
  subtitle: '"Ursula Strauss wird Chefinspektorin in Tirol"'
  description: "Die Schauspielerin Ursula Strauss ist mit ihrer Rolle als Kommissarin Angelika Schnell in der ORF-Serie \"Schnell Ermittelt\" zum Publikumsliebling geworden. Im Oktober schlüpft sie erneut in eine Ermittlerrolle, sie spielt die Fanny Gruber in der neuen ORF-Krimireihe \"Tiroler Blut\". \nBei Mariella Gittler erzählt die heute 52-Jährige auch, warum sie das Thema Tod seit ihrer Kindheit begleitet, von den Vorzügen des Älterwerdens und warum sie ihr schwerer Autounfall 2014 angstfrei gemacht hat."
