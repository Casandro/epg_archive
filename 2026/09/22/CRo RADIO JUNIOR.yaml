- eventId: 1074945
  start: 2026-09-22T11:00:00Z
  stop: 2026-09-22T12:00:00Z
  title: Velká pohádka
  description: 'Chibyčky. Říká se, že chybovat je lidské. Přemýšleli jste ale o tom, proč lidé chyby dělají? Proč tak často zakopávají, koktají, pletou si slova, lžou, podvádějí, zapomínají? Můžou za to Chibyčky, bytosti, které ztělesňují chyby. Jejich úkolem je udělat lidi lepší. Chybami se totiž člověk učí! Co se ale stane, když jedna taková Chibyčka zůstane za krkem malého Adolfa pětatřicet let? Napsala: Barbora Haplová. Režie: Petr Vodička. Hrají: Veronika Lazorčáková, Tereza Švejdová, Marek Lambora, Pavel Čeněk Vaculík, Tereza Bebarová a další.'
