  stop: 2026-09-22T14:00:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Vladimír Hanzal, zoolog. Možná vzpomínáte na velká prázdninová setkání s malými bytostmi. Pozorovali jste veverku, bobra nebo třeba i nebojácnou myšici křovinnou? A víte, že norník není jen pes, ale taky roztomilá myška s hnědým kožíškem? V růžovém nebo žlutém to není "paní norníková", ale další zajímavé zvířátko - plšík lískový. Poslouchejte naše povídání o drobných hlodavcích se zoologem Vladimírem Hanzalem a dozvíte se více.'
