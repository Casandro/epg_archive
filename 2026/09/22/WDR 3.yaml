  title: WDR 3 Open
  description: "Viel passiert in den drei Monaten Sommerpause bei Ex&amp;Pop. Nicht alles eignet sich für die Rubrik \"Mein schönstes Ferienerlebnis.\" Einmal mehr hat der long hot summer bewiesen: Wer über Pop redet, kommt nicht herum um die leidige Politik in dieser Zeit, auch wenn er sein Festival \"Glücksgefühle\" nennt und das Reden über Politik verbieten will. Wer Dolly Parton bloß für einen lebenden Blondinenwitz hielt, muss in den Nachrufen lernen, dass sie eine, ja, doch, politisch wache Feministin war. Und selbst ein Konzert der Zeit ihres Künstlerlebens politisch enthaltsamen Düsseldorfer Elektropioniere Kraftwerk kommt nicht um die vermaledeite Politik herum, wenn es in Dessau stattfindet, am Bauhaus. \n<strong>F*ck as friends</strong> | 2:23 <br/>Mykki Blanco\n<strong>Foxes</strong> | 6:30 <br/>Mykki Blanco Ft. Tama Gucci\n<strong>If I was your girlfriend </strong>| 3:42<br/>Prince\n<strong>(Like) High School Never Ends </strong>| 5:34<br/>Mykki Blanco\n<strong>Trans Europa Express</strong> | 6:40<br/>Kraftwerk\n<strong>An den Reglern </strong>| 6:25 <br/>Kamerun Qrella Group \n<strong>Sommermärchen</strong> | 3:10<br/>Apsilon\n<strong>Glanz</strong> | 3:14<br/>Apsilon\n<strong>Souvenir</strong> | 3:37 <br/>Apsilon (feat. Ikkimel)\n<strong>Hold The Road</strong> | 2:27<br/>Reg Tilsley \n<strong>Feelingz Go Numb </strong>| 2:43<br/>Nia Archives\n<strong>Dance With Me 2Nite</strong> | 3:27 <br/>Nia Archives\n<strong>Dumb Blonde</strong> | 2:29<br/>Dolly Parton\n<strong>Bauch Beine Po </strong>| 2:45 <br/>Shirin David\n<strong>Early Morning Breeze </strong>| 2:53<br/>Dolly Parton\n<strong>Breezy</strong> | 3:22<br/>Erykah Badu &amp; The Alchemist"
