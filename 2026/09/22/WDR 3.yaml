  title: WDR 3 Jazz
  subtitle: André Penazzi - Orgão Samba Percussão
  description: |-
    Ein Musiker aus der großen Show-Samba-Tradition der 1930er und 1940er Jahre wird zu einem brasilianischen Pionier der Hammondorgel: André Penazzi. Seine Langspielplatten aus den 1960er Jahren zeigen einen Mann, der einerseits den typischen Orgel-Bossa-Sound geprägt hat, andererseits aber einen Hauch zu spät kam, um den Vorsprung seiner Schüler im Bewusstsein des Publikums noch einholen zu können.
