  title: WDR 3 Konzert
  subtitle: 'Aires Tropicales: Newcomer aus Kuba'
  description: "Mit den \"Aires Tropicales\" von Paquito D'Rivera begann 2021 der Weg des Ensembles. Fünf Musiker:innen, klassisch ausgebildet, aufgewachsen mit kubanischer Improvisationsfreude, entwickeln innovative Konzertprogramme. In Gütersloh hält eine afrokubanische Gottheit die Fäden in der Hand und führt über die Schwellen westlicher Musiktradition hinweg. \n<strong>Maurice Ravel<br/></strong>Boléro<br/>(Bearbeitung: Jorge Ruiz)\n<strong>Ernesto Burgos<br/></strong>Malagueña \n<strong>Claude Debussy<br/></strong>La fille aux cheveux de lin\n<strong>George Gershwin<br/></strong>Summertime<br/>(Bearbeitung: Ernesto Burgos)\n<strong>Paquito D'Rivera<br/></strong>Contradanza\n<strong>Traditional<br/></strong>Elegguá<br/>(Bearbeitung: Jorge Ruiz)\n<strong>Dizzy Gillespie<br/></strong>Manteca<br/>(Bearbeitung: Ernesto Burgos)\n<strong>Paquito D'Rivera<br/></strong>Afro\n<strong>Compay Segundo<br/></strong>Chan Chan\n<strong>Franz Ignaz Danzi<br/></strong>Allegretto aus dem Bläserquintett op. 56 Nr. 2\n<strong>Chucho Valdés<br/></strong>La Explosion<br/>(Bearbeitung: Jorge Ruiz)\n<strong>Moisés Simons<br/></strong>El Manisero<br/>(Bearbeitung: Abraham Castillo<strong> </strong>Moreno)\n<strong>Aires Tropicales Quintet </strong><br/>Claudia Veloso Alvarez, Flöte <br/>Ninián Rodríguez Rego, Klarinette <br/>Ramon Alejandro Màrquez Ramos, Fagott <br/>Jorge Daniel Ruiz Peña, Oboe <br/>Karla Hernàndez Reyes, Horn \nAufnahme vom 3. Mai 2026 aus dem Theater Gütersloh\nModeration: Ida Hermes<br/>Redaktion: Simon Al-Odeh"
