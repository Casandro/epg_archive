  title: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  subtitle: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  description: Die zweite Etappe führt von Bad Tölz an der grünen Isar entlang zunächst nach Lenggries. Hier drehen wir nach Westen ein und folgen nun der Jachen in gleichnamige Jachenau. Sonnendurchflutet geht es ganz langsam bergauf, bis wir den majestätischen Walchensee erreichen. Auf den folgenden 8 km umrunden wir das fantastisch türkisfarbenen Berggewässer an seiner Südseite. In Wallgau treten wir in die Ferienregion Karwendel ein, die uns mit spektakulären Ausblicken auf über 2000m hohe Berge begrüßt. Mit einer kleinen Panoramafahrt über die "Buckelwiesen" erreichen wir Mittenwald, wo wir, bevor wir den heutigen Tag beschließen, die grandiose Leutascher Geisterklamm erkunden. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
