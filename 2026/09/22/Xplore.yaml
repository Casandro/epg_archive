  description: Die erste Etappe führt vom Marienplatz in der Weltstadt München zunächst die Isar stromaufwärts entlang. Ein fast perfekter Radweg geleitet uns aus der Stadt hinaus bis nach Grünwald. Hier haben wir auch die ersten Höhenmeter zu bewältigen, bevor wir am Mühltalkanal wieder ruhig dahingleiten. Unseren ersten wirklichen Stopp legen wir am Benediktiner Kloster Schäftlarn mit seiner imposanten Klosterkirche ein. Weiter geht's durch die Pupplinger Au zum Ickinger Wehr Richtung Wolfratshausen. Nun lassen wir die Isar alleine weiter fließen und fahren ins wunderschöne kupierte bayerische Voralpenland. Nach einem weiteren Stopp am kleinen Badesee Harmatinger Weiher genießen wir noch die letzten wunderbaren Kilometer bis nach Bad Tölz. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
