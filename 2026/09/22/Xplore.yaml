  title: Die Ostküste der USA - Im Herzen Neuenglands
  subtitle: Die Ostküste der USA - Im Herzen Neuenglands
  description: "Von New York führt die Reise entlang der Küste in das Herz Neu-Englands - bis nach Boston, der Hauptstadt von Massachusetts mit seinen bekanntesten Inseln Nantucket und Martha's Vineyard. New Haven in Connecticut wird dominiert von der Yale University, die zu den besten Bildungsinstitutionen der Welt zählt. Neben ihrem Studium ist Maddie Lips auch Captain des prestigeträchtigen Ruder-Achters. Zweimal täglich trainiert sie mit ihrer Crew. Die Gegend um Newport in Rhode Island hat im 19. Jahrhundert der amerikanische Geldadel für die Sommerfrische entdeckt. Noch heute finden sich hier einige der mondänsten Villen des ganzen Landes - und die Farm von Ann Targasian, die Alpakas hält. Martha's Vineyard ist einer der begehrtesten Urlaubsorte in den USA, gern besucht auch von Präsidenten. Nantucket hingegen ist als Walfängerinsel berühmt geworden. Heute wird vor Cape Cod aber lieber auf Jakobsmuscheln gefischt. Bessere Fangmethoden sorgen für gesunde Bestände, aber seit der Handel mit den Lizenzen erlaubt wurde, sorgen sich kleine Unternehmer wie Bob Keese um ihre Existenz. Auch die Robbenbestände konnten sich erholen, seit die Tiere unter Schutz gestellt wurden. Zu Tausenden tummeln sie sich auf den Sandbänken vor Cape Cod. Die Pathobiologin \nAndrea Bogomolni zieht von den Tieren Rückschlüsse auf den Gesamtzustand des maritimen Lebensraums. Und in Boston hat Jessie Banhazl ein grünes Imperium geschaffen: sie betreibt Gemüseanbau im großen Stil, auf den Dächern der Stadt. US 2014"
