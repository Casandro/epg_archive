  title: Höhenflüge - Im Ballon über die Mongolei
  subtitle: Höhenflüge - Im Ballon über die Mongolei
  description: Internationale Ballonfahrer-Teams treffen sich in Ulan Bator, um die Mongolei mit Heißluftballons zu erkunden. Dazu gehören nicht nur Wettfahrten über den Sanddünen der Wüste Gobi, über spektakulären Berg- und Steppenlandschaften und über malerischen Orten, sondern auch Begegnungen mit den Einheimischen, die in der Einsamkeit der Steppe wohnen. Straßen gibt es selten und so werden die Bergungsmanöver oft abenteuerlich und sind nur mit Hilfe der Steppenbewohner möglich. Abenteuer pur. Die Ballonstarts werden noch vor dem ersten Sonnenlicht vorbereitet. Nur an den kühlen Vormittagen, wenn der Unterschied von Außenluft zum heißen Balloninneren groß ist, kann ein Ballon Piloten und Passagiere in die Höhe tragen. Heißluftballons lassen sich nicht lenken - der Wind allein bestimmt ihre Richtung und so können die Ballonfahrer unversehens über unzugängliche Schluchten und Felsen getrieben werden. Eine Herausforderung für die Piloten und ihr Team, das sie am Boden begleitet. Und manche Landung endet gefährlicher als geplant. Ebenso unvergesslich wie die Fahrten mit dem Ballon sind auch die Begegnungen mit den Menschen der Mongolei. Nirgendwo sonst in der Welt gibt es Reiter, die einen nahe am Boden schwebenden Ballon begleiten, denn Pferde haben normalerweise panische Angst vor den fauchenden Ungetümen. Die Riesenballons sind weithin sichtbar und so strömen alle, die in der Nähe sind, herbei. Auf Pferden, Kamelen, mit Mopeds und Geländewagen verfolgen sie die Ballons am Boden und beobachten mit Spannung ihre Landung. Kinder stürmen den Ballonkorb, vor allem wenn die Aussicht besteht, mal kurzzeitig nach oben zu schweben.  DE 2012
