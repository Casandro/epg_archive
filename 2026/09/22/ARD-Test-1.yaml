  title: Morden im Norden (54)
  subtitle: Eiskind
  description: 'Als die 16-jährige Ira Jakobi erfährt, dass sie mit Hilfe einer Samenspende gezeugt wurde, begibt sie sich auf die Suche nach ihrem biologischen Vater. Kurz darauf wird sie tot aufgefunden. Finn Kiesewetter und Lars Englen finden am Tatort einen Flyer der Reproduktionsklinik. Mit Hilfe des IT-Technikers der Firma, Jens Giersch, können sie den leiblichen Vater Hannes Conrad ausfindig machen, der für die Ermittler schnell zum Hauptverdächtigen wird. Gleichzeitig geht Lars einer anderen Spur nach: Iras beste Freundin Janne behauptet, dass sie einen heimlichen Freund hatte - doch niemand kennt ihn.'
