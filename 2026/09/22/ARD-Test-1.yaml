  description: 'Hubert zieht beim Angeln an der Loisach eine Leiche an Land. Zunächst sieht alles nach einem Unfall aus, aber im Haus des Toten finden sich Spuren eines Einbruchs. Auch der Befund aus der Pathologie gibt Rätsel auf: Der alte Mann ist zwar ertrunken, das Wasser in seiner Lunge enthält aber Reinigungsmittel und stammt gewiss nicht aus der Loisach! DNA-Spuren aus dem Garten des Toten führen zu dem der Polizei bekannten Timo Brühl. Laut Akten sitzt Brühl in Haft. Riedl soll dem noch einmal nachgehen, und schnell stellt sich heraus: Brühl befindet sich bereits im offenen Vollzug ...'
