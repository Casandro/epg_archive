  title: Wissen vor acht - Natur
  subtitle: 'Moderation: Thomas D'
  description: "Thema: Technischer Höhenflug dank tierischer Vorbilder \nDie Windkraft ist ein wichtiger Baustein zur Energiewende. Leider stört viele Menschen die Geräuschbelastung durch die Windradflügel. Um den Lärm zu reduzieren, haben Forschende ein tierisches Vorbild genau beobachtet: die lautlos fliegende Schleiereule. Wie ihre Flügel das geräuschlose Abgleiten der Luft ermöglichen und ob diese Fähigkeit auch auf zu laute Windräder übertragen werden kann, erklärt Thomas D in \"Wissen vor acht - Natur\"."
