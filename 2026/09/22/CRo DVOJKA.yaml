  title: Úžasné životy
  description: 'Rudolf Zahradník podle Pavla Hobzy. Rudolf Zahradník je jedna nejvýraznějších osobností české vědy. Jeho student a později spolupracovník Pavel Hobza o něm mluví jako o gentlemanovi a váženém člověku, díky kterému přežil nelehkou éru komunismu. Zahradník mu také určil téma disertační práce, čímž nasměroval jeho celoživotní kariérní dráhu. Autorka: Lenka Poláková Nechvátalová. Premiéra.'
