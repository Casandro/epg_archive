  stop: 2026-09-22T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Filip Jevič, fyzioterapeut, herec a režisér. Proč by si přál, aby v dětské nemocnici byla odrážedla oficiálním dopravním prostředkem? Jak vznikl nápad vytvořit projekt RehaSÍŤ dětské onkologie? A o čem si povídal se svojí pratetou, slavnou herečkou Zitou Kabátovou? Moderuje Barbora Chuecos.'
