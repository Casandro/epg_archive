  title: Noční proud
  description: Meadow Talks je sólový projekt Lindy Paškové. Je zakořeněný ve folku a formovaný intimním psaním písní. Linda objevuje nové zvukové postupy - od bluesových vlivů až po jemné elektronické a filmové prvky. Píše a skládá jak samostatně, tak ve spolupráci s hudebníky z celého světa. Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.
