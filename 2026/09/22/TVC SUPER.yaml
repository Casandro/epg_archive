  description: |-
    Tytuł oryginalny: Profilage
    FR, 2015
    Reżyseria: Karim Ouaret
    Występują: Odile Vuillemin, Jean-Michel Martial, Raphaël Ferret, Philippe Bas, Sophie De Fürst, Valérie Dashwood
    Chloe odzyskuje przytomność u porywacza. Ponieważ nic nie pamięta, porywacz mówi jej, że jest jego żoną, Alice, oraz że usiłują uciec od byłego partnera Alice, brutalnego policjanta - Thomasa Rochera. Tymczasem Thomas jest przesłuchiwany w związku ze śmiercią pułkownika Ferranta, zasztyletowanego kilka dni wcześniej. Wkrótce potem musi zbadać przyczyny śmierci młodego strażaka, którego spalone ciało znaleziono w samochodzie.
