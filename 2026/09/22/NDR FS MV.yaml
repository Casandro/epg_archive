- eventId: 573353
  start: 2026-09-22T22:00:00Z
  stop: 2026-09-22T23:30:00Z
  title: Schon lange kein Frühling - Mein Vater, Rumänien und ich
  description: |-
    Es ist Weihnachten, als Alexandra Bidian ihrer Mutter einen Brief schenkt - die Einladung zu einer Reise, die zur gemeinsamen Spurensuche wird. Im Sommer macht sie sich zusammen mit ihrer Schwester Maria und ihrer Mutter auf den Weg: von Wiesbaden nach Rumänien, auf der Route, die sie früher Jahr für Jahr mit dem mittlerweile verstorbenen Vater gefahren sind.
    Der Dokumentarfilm erzählt von einem Vater, der unter den rumänischen Kommunisten politisch verfolgt wurde, nach Deutschland ins Exil floh - und dort mit den Geistern der Vergangenheit lebte.
  widescreen: true
  subtitled: true
