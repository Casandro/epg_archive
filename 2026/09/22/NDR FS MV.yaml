  title: 'Die Nordreportage: Leben retten im Verborgenen'
  subtitle: Die unsichtbaren OP-Helfer
  description: Wenn Rita Gretzler und ihr Team einen Fehler machen, kann das für Patienten lebensgefährlich werden. Die Reinigungskräfte der Universitätsmedizin Rostock sorgen dafür, dass OP-Säle, Betten und medizinische Instrumente keimfrei bleiben. Unter Zeitdruck reinigen sie blutverschmierte Operationssäle, bereiten Betten für neue Patienten auf und sorgen dafür, dass benutzte Instrumente wieder sicher eingesetzt werden können. Ihre Arbeit bleibt meist unsichtbar, dabei wäre ohne sie kein Krankenhausbetrieb möglich. Eine Reportage über die Menschen hinter den Kulissen, die jeden Tag dazu beitragen, Leben zu retten.
