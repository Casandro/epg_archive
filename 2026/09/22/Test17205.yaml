  title: A bon entendeur
  description: |-
    (Rediffusion) IA et voyages : ne suivez pas le guide aveuglément Alors que 80% de la population suisse utilise l'intelligence artificielle, nombreux sont ceux qui lui confient désormais leurs projets d'évasion. Pourtant, derrière la facilité apparente se cachent des écueils bien réels. En testant sept agents conversationnels, ABE explore aussi l'envers du décor !
     (Suisse Romande-2026)
