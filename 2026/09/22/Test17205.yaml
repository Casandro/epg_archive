  start: 2026-09-22T19:10:00Z
  stop: 2026-09-22T20:10:00Z
  title: Sacha
  description: 'Sacha: Épisode 4/6 Les procureurs hésitent : Anne a-t-elle vraiment été la victime de Teissier?  Les inspecteurs Hoffman et Shaqiri ont vu Patrick, le frère d''Anne, dans un bar avec Teissier. S''il est le monstre qu''Anne décrit, pourquoi son frère semble l''apprécier? Interrogé, Patrick donne une autre version des faits. (Suisse-2021)  "Audio description"'
  ageRating: 10
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
- eventId: 1002918
  start: 2026-09-22T20:10:00Z
  stop: 2026-09-22T21:05:00Z
  title: Sacha
  description: 'Sacha: Épisode 5/6 Touchée par les aveux d''Anne, Carla commence à la croire quand l''analyse balistique révèle qu''Anne a tiré deux balles sur Teissier, signe d''une volonté de tuer plutôt que d''une perte de contrôle. Carla soupçonne alors Anne d''avoir agi avec préméditations et dans l''intention de se venger.   (Suisse-2021)  "Audio description"'
  ageRating: 10
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
- eventId: 1002929
  start: 2026-09-22T21:05:00Z
  stop: 2026-09-22T22:03:00Z
  title: Sacha
  description: 'Sacha: Épisode 6/6 Les procureurs sentent qu''Anne n''a pas tout dit, mais ils décident de la relâcher pour attendre son procès. Une fois sortie, Anne doit affronter les vraies raisons qui l''ont poussée à tirer sur Teissier. Alors qu''elle pense que tout est fini avec l''inspecteur Hoffman, il l''aide de façon inattendue.  (Suisse-2021)  "Audio description"'
  ageRating: 10
  genre:
