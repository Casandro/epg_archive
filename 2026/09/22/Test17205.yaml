  title: Des trains pas comme les autres
  description: "13 (5/7) Japon Le Japon en hiver, tout au nord, sur l'île d'Hokkaido, est un spectacle  complètement dépaysant. Malgré les conditions climatiques parfois extrêmes, les trains sont toujours en activité avec une précision très nippone. C'est ce que va découvrir notre globe trotter, Philippe Gougler en voyageant du sud au nord de l'île. \n\n\n (France-2023)"
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
