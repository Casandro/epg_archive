  title: Nocturne
  description: Fortuna Fortuna, 14 ans, une jeune adolescente éthiopienne, sans nouvelles de ses parents depuis son arrivée à Lampedusa en Italie, est accueillie en Suisse avec d'autres réfugiés dans un hospice à plus de 2000m d'altitude pour passer l'hiver. Une communauté de religieux catholiques les héberge en attendant que leur sort soit régularisé par les institutions suisses. C'est là que Fortuna rencontre Kabir, 26 ans, un jeune réfugié africain, dont elle tombe éperdument amoureuse. Leur relation se construit à l'abri des regards jusqu'au jour où Kabir disparaît.  (Suisse-2016)  "Audio description"
