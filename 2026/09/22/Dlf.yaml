  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nInterview mit Bastian Eclercy\nHeilige und Sünderin: Frankfurter Ausstellung zeigt Bilder von Maria Magdalena\nSünderin, Büßerin und enge Gefährtin von Jesus. Um die biblische Frauenfigur Maria Magdalena aus dem Neuen Testament ranken sich viele Legenden. Kurator Bastian Eclercy erklärt im Gespräch wie die neue Ausstellung im Frankfurter Städel-Museum den religiösen Wandel Maria Magdalenas thematisiert.  \n\nYoga-Serie Teil 2: Wieviel Religion steckt im Yoga? \nYoga steht auch in Deutschland mit seinen Körperübungen und Atemtechniken hoch im Kurs. Doch Yoga ist weit mehr als eine Fitnessidee. Es handelt sich um eine alte philosophische Lehre aus Indien, die auch religiöse Aspekte und einen spirituellen Hintergrund hat. \n\nAm Mikrofon: Susanne Fritz"
