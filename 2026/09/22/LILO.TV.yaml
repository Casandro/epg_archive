  subtitle: So schmeckt die Welt - Sieben Meere
  description: Eine kulturell und kulinarische Entdeckungsreise auf dem Kreuzfahrtschiff durch sieben Meere. Wann kann man schon mal sieben Meere auf einer Schiffsfahrt durchkreuzen. Von Mallorca geht die Fahrt durch Mittelmeer Atlantik Nordmeer Ostsee und Nordsee. Mit jedem Meer entdecken wir neue Länder, Kulturen und Menschen. Kreuzfahrt von seiner schönsten Seite.
