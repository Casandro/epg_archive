  title: So schmeckt die Welt - Sizilien
  subtitle: So schmeckt die Welt - Sizilien
  description: Eine kulturell und kulinarische Entdeckungsreise durch Sizilien. Sizilien ist nicht Italien und das stimmt auch. Wenn man die Mittelmeer-Insel besucht entdeckt man schnell, dass Sizilien von allem etwas mehr hat. Es ist lauter, hektischer, emotionaler, aber auch schöner, faszinierender und erlebnisreicher als der Rest von Italien. Und das Essen, ja auch Sizilien hat hier seine eigenen Gerichte beeinflusst von der arabischen wie auch türkischen Küche.
  genre:
  - '129'
