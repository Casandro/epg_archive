  description: Eine kulturelle und kulinarische Entdeckungsreise durch das Stubaital in Österreich. Das Stubaital steht zunächst im Zeichen des Stubaier Gletschers. Aber das Stubaital ist mehr als nur Gletscherskifahren und Snowboarden. Erleben sie in dieser Doku eines der reizvollsten Wanderund Bike-Areale im Alpenraum. Und durch seine verkehrsgünstige Anbindung und die unmittelbare Nähe zu Innsbruck ist das Tal vor allem für Kurzentschlossene eine reizvolle Urlaubsalternative.
