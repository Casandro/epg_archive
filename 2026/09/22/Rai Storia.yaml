  title: Viaggio in Sicilia Catania tra acqua e f
  subtitle: 'Viaggio in Sicilia Catania tra acqua e fuoco - Il viaggio della scrittrice Simonetta Agnello Hornby e del suo amico illustratore Massimo Fenati prosegue verso Catania. Prima emozionante tappa: l''Etna e il '
  description: |+
    suo paesaggio lunare. Ai piedi dell'Etna, spostandosi sul versante sud-est, Simonetta e Massimo raggiungono l'antico palmento di storici produttori di vini dell'Etna e scoprono antichi riti e tradizioni dei viticoltori della zona. Il fuoco e l'acqua caratterizzano la città di Catania. Simonetta e Massimo ritrovano questi due elementi nelle strade del centro storico. - Con Simonetta Agnello Hornby e Massimo Fenati

