  subtitle: Cedar Cove - Das Gesetz des Herzens - Loslassen aus Liebe
  description: Die schwangere Shelly wird mit schweren Symptomen ins Krankenhaus eingeliefert. Olivia und Jack stehen ihr zur Seite. Und auch Jacks Sohn Eric, der Vater von Shellys ungeborenem Kind, will helfen. Die Situation weckt in Olivia Erinnerungen an den Tag, als ihr Sohn starb. Dennoch versucht sie, Shelly eine Stütze zu sein, die ihr daraufhin enthüllt, dass sie ihr Baby zur Adoption freigeben möchte.  US 2013
