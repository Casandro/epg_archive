  subtitle: Die Karibikinsel St. Lucia - Palmen unter britischer Krone
  description: Normalerweise freuen sich Fischer über reichlich G28 der Rotfeuerfisch vor St. Lucia ist jedoch eine Plage. Die imposanten Tiere kamen aus Florida in die sie haben dort keine natürlichen Feinde und breiteten sich aus. Keither Prospere geht nach dem Aktionsplan "Eat them to beat them" regelmäßig auf Jagd nach ihnen. Abnehmer gibt es genug, "Lion Fish" steht auf den Speisekarten der gehobenen Inselrestaurants, dessen zartes, weißes Fleisch vorzüglich schmeckt. Bei der Zubereitung müssen jedoch erst die giftigen Stacheln entfernt werden. Terence McFalan interessiert der Rotfeuerfisch nicht. Er taucht nach Lambis, der Spinnenschnecke. Bis zu 75 Kilo von ihnen holt er am Tag aus dem Wasser. Keiner taucht so oft und so tief wie er und keiner kann so lange unten bleiben. Sein Gehör hat Terence McFalan beim Tauchen fast gänzlich eingebüßt.
