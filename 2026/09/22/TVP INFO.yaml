  title: Podróże z historią 4 (odc. 7)
  subtitle: Radosław Kotarski opowie o mennonitach, którzy przez kilka wieków mieszkali na ziemiach polskich. Ich kultura i budowle wzbogaciły krajobraz Żuław i terenów położonych blisko Wisły.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Od wieków na polskich ziemiach mieszkała niesamowicie ciekawa społeczność, którą nazywano mennonitami. Przez całe stulecia wzbogacała swoją kulturą oraz budowlami krajobraz Żuław i terenów położonych blisko Wisły. Dlaczego przybyli do Polski? Co sprawiło, że nieustannie musieli walczyć z powodziami? Jak radzili sobie z żuławską depresją? Na te pytania odpowie Radosław Kotarski w najnowszym odcinku "Podróży z historią".
  genre:
  - '149'
- eventId: 970006
  start: 2026-09-22T01:25:00Z
  stop: 2026-09-22T01:53:00Z
  title: Polskie parki narodowe 1 (odc. 5)
  subtitle: Tematem programu będzie Bieszczadzki Park Narodowy, słynący z rozległych połonin, dzikiej przyrody oraz niezwykłych krajobrazów, które czynią go jednym z najcenniejszych obszarów chronionych w Polsce.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
- eventId: 970007
  start: 2026-09-22T01:53:00Z
  stop: 2026-09-22T02:36:00Z
  title: Kwiatki polskie
  subtitle: Prowadzący wraz z innymi dziennikarzami komentują poruszające opinię publiczną tematy, zachowując zdrowy rozsądek i trzeźwość oceny wobec wszystkich stron życia społecznego w Polsce.
  description: |-
    magazyn (Polska, 2024)
    Przegląd wydarzeń. Prowadzący oraz ich goście komentują bieżące tematy, które aktualnie poruszają opinię publiczną. Uzupełnieniem audycji są rozmowy z politykami i ekspertami, sondy uliczne oraz autorskie reportaże. Program prowadzą znani ze swojego poczucia humoru dziennikarze: Grzegorz Markowski i Katarzyna Kasia.
  genre:
  - '34'
