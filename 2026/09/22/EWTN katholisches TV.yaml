  title: Venezuela - Eindrücke von der Orinoco Mission
  subtitle: EWTN Galerie - Dokumentation
  description: "Der Orinoco: Drittgrößter Fluss der Welt. Unter den Warao, die im Mündungsdelta des Flusses leben, haben die Kapuziner-Missionare 1925 ihre erste Missionsstation gegründet. Zuerst errichten sie eine Schule. Aber sie lehren nicht nur: Ebenso setzen sie sich für die Kultur der Warao ein, helfen, sie zu wahren und zu schützen:\n\n\"Als ich ankam - an meinem ersten Tag, nahm ich mir ein Notizbuch und fragte: \"Wie sagt man dies, wie sagt man das?\", denn es war immer jemand da, der ein wenig Spanisch sprach. Und ich machte Notizen. Nun, ich sagte mir: \"Ich lerne jeden Tag einen Satz. Einen, das ist nicht viel und ich wiederhole ihn.\" Ich wiederholte ihn und nach einem Jahr hatte ich 350 Sätze zusammen. Bis dahin sprach ich Warao.\", erzählt Pater Julio. \n\nEin eindrückliches Zeugnis über die Mission, über die Hingabe der Missionare an das Volk, dem sie die Botschaft Jesu Christi überbringen, über das Leben, das sie mit den Ärmsten der Armen teilen, und über unerschütterliches Vertrauen in die Fürsorge Gottes"
  widescreen: true
