  title: 'Kultur Regional: Werkstatt'
  subtitle: Die Kunst des Staunens oder Wie das Wort seinen Ort in der Welt sucht
  description: |-
    Lutz Rathenow hinterfragt Zusammenhänge von Poesie und Politik, praktischem Handeln, Weltbeeinflussungsplänen, Sachsen, Berlin, dem Glück des Staunens und der Worte, die dies weitertragen wollen. Warum Aufklärung eher wirkt, wenn sie sich nicht als solche verkündigt. Und welcher Teil aus dem Werk Gotthold Ephraim Lessings den Redner Rathenow intensiv beeinflusst hat - eher nicht Nathan der Weise.

    Lutz Rathenow wurde 1952 in Jena geboren, wo er Geschichte und Germanistik studierte. Er gründete und leitete zwei Jahre lang den »Arbeitskreis Literatur und Lyrik« bis zu dessen Verbot 1975. Erste Veröffentlichungen in der Schweiz, der DDR, in Rumänien, der Bundesrepublik, den USA. Literarischer und politischer Netzwerker zwischen literarisch-künstlerischen Szenen und der politischen Opposition in der DDR. Von 2011 bis 2021 war er Sächsischer Landesbeauftragter zur Aufarbeitung der SED-Diktatur. In Dresden ging er eigene Wege, versuchte Kunst, Buchförderung, Theater, Film und Literatur einzubeziehen, um Erfahrungen in, mit und nach der DDR wirksamer und vielschichtiger zu gestalten.

    Eine Veranstaltung der Arbeitsstelle für Lessing-Rezeption Kamenz.
