- eventId: 541753
  start: 2026-09-22T16:00:00Z
  stop: 2026-09-22T17:00:00Z
  title: 'MDR KULTUR Spezial Gesellschaft: "Corregio: Berührend menschlich"'
  description: "Eine Sonderausstellung in der Dresdner Gemäldegalerie widmet sich dem italienischen Maler Antonio Allegri, genannt Correggio. Er gehört zu den wichtigen Malern der italienischen Hochrenaissance und des Frühbarock. Trotz seines historischen Rangs neben Leonardo, Raffael oder Michelangelo ist sein Name heute allerdings weniger geläufig. Zu Unrecht, wie die Schau zeigt, zumal Corregio ein Meister in der Darstellung von Emotionen ist. Damit haben sich auch Dresdner Schülerinnen und Schüler beschäftigt und parallel zu \"Corregio: Berührend menschlich\" eine Ausstellung kuratiert, in der sie Werke aus den Dresdner Sammlungen zusammengetragen haben, in denen sie sich mit ihren Gefühle wiederfinden. \n\nAber nicht nur die Gemäldegalerie, sondern auch das Kupferstichkabinett kann auf eine beachtliche Sammlung italienischer Altmeisterzeichnungen aus der Renaissance blicken. Ein Forschungsprojekt mit internationaler Beteiligung hat sich dieses Bestands in den vergangen acht Jahren angenommen und eine Auswahl ihrer Entdeckungen sind nun in der Ausstellung \"Unbekanntes aus Italien\" zu sehen.\n\nDaran zeigt sich wiederum, dass Dresden und Italien eine jahrhundertelange Kulturgeschichte verbindet. Bereits die sächsischen Kurfürsten begeisterten sich für italienische Kunst und holten Maler, Bildhauer und Architekten aus Italien nach Dresden. Insofern wird sich das Spezial auch damit beschäftigen, ob und warum der Name Elbflorenz durchaus verdient ist und möglicherweise Dresden, und nicht München, auch den Titel als die nördlichste Stadt Italiens verdient.\n\nRedaktion: Eva Gaeding, Grit Krause, Kristin Unverzagt"
  subtitle: Ein Spezial zum italienischen Herbst in den Staatlichen Kunstsammlungen Dresden
