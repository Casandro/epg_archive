  title: American Poltergeist 4 - The Curse of the Joker
  subtitle: Science fiction / Fantasy / Horror 2016, FSK 18
  description: '2016 ● FSK: 18 Es ist rund ein Jahr vergangen, seitdem ein Amokläufer im Clownskostüm bei der Horrorfilmpremiere von Joker''s Wild in einem kleinen Kino in einer US-Vorstadt ein Blutbad anrichtete. Nun möchte die Tochter des Besitzers, Aurora, das Kino trotz Protesten der Angehörigen der Opfer wiedereröffnen. Sogar der Kongressabgeordnete Arthur Butler möchte die Neueröffnung mitfeiern. Doch die Geister der Opfer des Amoklaufs haben das Diesseits noch nicht verlassen. Science fiction / Fantasy / Horror 2016, Regie: Christopher S. Lind,  Mit: Eric Roberts, Martin Kove, Lacy Marie Meyer, FSK 18'
