  description: '2022 ● FSK: 12 Nach einem Notruf von einem Forschungsschiff schickt die U.S. Space Force ein Team zum Saturn-Mond Pandora. Beim Versuch zu landen, entdeckt die Mannschaft jedoch, dass Pandora bereits von einer hoch entwickelten humanoiden Spezies bewohnt wird. Bereits kurz nach ihrer Ankunft werden sie von einer rätselhaften Kreatur angegriffen, die aus dem Wasser steigt und aus einem flüssig-silbrigen Element zu bestehen scheint. Science fiction / Fantasy / Horror 2022, Regie: Noah Luke,  Mit: Tom Sizemore, Kristos Andrews, Natalie Storrs, FSK 12'
