  title: Buchty
  description: Do Buchet tentokrát přišla Vlaďka, která pracuje v oblasti udržitelnosti a její kamarádka o ní v nominačním mailu napsala, že je vybroušený drahokam. Vlaďka povyprávěla o tom, že ráda fermentuje a do práce si k obědu občas nosí čočky. Probrali jsme tedy fermentování, ale taky to, že se Vlaďka chystá na cestu do Santiaga. Moderují Zuzana Fuksová a Ivana Veselková. (repríza)
