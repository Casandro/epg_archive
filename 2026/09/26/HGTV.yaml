  title: Küche, Garten, wunderschön!
  subtitle: Ein emotionaler Umbau
  description: "Nach dem Tod ihres Mannes David beschließt Shaz, mit ihren Kindern im gemeinsamen Haus zu bleiben und ihm neues Leben einzuhauchen. Das verwinkelte Erdgeschoss mit der dunklen Küche und den umständlichen Wegen entspricht längst nicht mehr dem Familienalltag. George Clarke plant deshalb einen lichtdurchfluteten Seitenanbau mit Oberlichtern, offener Küche und direkter Verbindung zum Garten. Letzteres gestaltet Luke Millard behutsam um, damit er modernisiert wird und zugleich ein Ort bleibt, an dem David weiterhin präsent ist.  \nGBR 2025"
