  title: Küche, Garten, wunderschön!
  subtitle: Mammutprojekt mit Hürden
  description: "Andrew und Katherine haben sich mit ihrem Haus nahe Manchester eigentlich einen Traum erfüllt. Doch hinter der schönen Fassade verbirgt sich ein unpraktischer, verwinkelter Grundriss mit voneinander getrennten Wohnbereichen und einer Küche, die kaum mit dem Familienleben funktioniert. Gemeinsam mit George Clarke wagen sie deshalb einen umfassenden Umbau: Wände verschwinden, große Glasfronten öffnen den Blick in den Garten und ein neuer, offener Wohnbereich soll die Familie wieder näher zusammenbringen. Gleichzeitig wird auch der steile Garten mit seinen Höhenunterschieden und Sicherheitsrisiken komplett neu gestaltet.  \nGBR 2025"
