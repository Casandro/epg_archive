  description: "Ein Ehepaar aus Utah kehrt dem schnellen Rhythmus des Westens den Rücken und sehnt sich nach einem ruhigeren Leben auf der kleinen Insel Utila vor der Küste von Honduras. Schon vor sieben Jahren hatten sie sich während eines Urlaubs in die entspannte Atmosphäre und das karibische Lebensgefühl verliebt - jetzt möchten sie ihren Traum vom dauerhaften Inselleben endlich verwirklichen. Während sie sich ein lichtdurchflutetes Haus mit großzügigen Fensterfronten und Panoramablick wünscht, träumt er von einem einladenden Außenbereich unter freiem Himmel. Doch für beide ist klar: Wirklich perfekt wird ihr neues Zuhause erst, wenn auch Platz für Besuche aus der Heimat ist.  \nUSA 2018"
