  subtitle: 'RUBRICA - Un percorso attraverso l''Italia delle coste, delle comunità e delle tradizioni, alla scoperta del profondo legame tra il mare e la vita delle persone. Da Cesenatico al Salento, dall''Abruzzo al Veneto, fino alle '
  description: |-
