  title: Date Night - Gangster für eine Nacht
  description: "Phil (Steve Carell) und Claire Foster (Tina Fey) führen ein geruhsames Eheleben in New Jersey. Vielleicht zu geruhsam. Denn selbst ihre \"Date Night\", ihr wöchentlicher Ausgehabend, ist zum starren Ritual verkommen. Diesmal jedoch will Phil seine Gattin in das angesagteste Restaurant von Manhattan ausführen. Natürlich finden die biederen Vorstädter in dem Lokal ohne Reservierung keinen Tisch. Doch dann bekommt Phil mit, dass mehrmals das Ehepaar Tripplehorn ausgerufen wird. Die Gelegenheit für Phil und Claire, die sich prompt auf die Plätze der Tripplehorns setzen. Auf einmal tauchen die Gangster Collins und Armstrong auf. Die beiden verlangen die Herausgabe eines USB-Speichersticks, der Mafiaboss Joe Miletto gehört. In seiner Not behauptet Phil, die Ganoven zum Versteck des Speichermediums zu führen. Dabei gelingt es Phil und Claire, auf eine Polizeistation zu flüchten. Dort müssen sie feststellen, dass es sich bei Collins und Armstrong um korrupte Polizisten handelt. Dem Ehepaar wird klar: Nur wenn sie selbst die echten Tripplehorns ausfindig machen, wird die wilde Hetzjagd quer durch das nächtliche New York ein Ende nehmen. \n\nGewöhnliche Menschen, die von einer ausweglosen Situation in die nächste stolpern, ist das Rezept vieler erfolgreicher Komödien. In \"Date Night - Gangster für eine Nacht\") erlebt dieses Schicksal das ahnungslose Vorstadtehepaar Phil (dargestellt von Steve Carell) und Claire Foster (die Golden-Globe- und Emmy-Preisträgerin Tina Fey). Der Blockbuster-Regisseur und Produzent Shawn Levy (\"Nachts im Museum\", \"Free Guy\", \"Deadpool & Wolverine\") hat seinen Film mit viel Wortwitz und zahlreichen absurden Slapstick-Momenten angereichert. Mark Wahlberg, James Franco und Mark Ruffalo sind in Nebenrollen zu sehen.\nComedy, Vereinigte Staaten Von Amerika 2010, R: Shawn Levy"
  widescreen: true
- eventId: 1060876
  start: 2026-09-26T19:50:00Z
  stop: 2026-09-26T21:50:00Z
  title: Colombiana
  description: "Nach dem Mord an ihren Eltern musste Cataleya (Zoe Saldana) als kleines Mädchen in die USA fliehen. 15 Jahre sind seitdem vergangen, doch sie kennt weiterhin nur ein Ziel: Rache zu nehmen an Don Luis, dem Auftraggeber des Gemetzels. Bei ihrem Onkel Emilio, einem Gangsterboss in Chicago, lässt sie sich zur Profikillerin ausbilden. Ein Mitglied nach dem anderen aus der Bande von Drogenbaron Don Luis fällt ihr zum Opfer. Cataleyas Markenzeichen ist die Skizze einer Orchidee, die sie am Tatort hinterlässt. Fieberhaft forscht CIA-Agent James Ross nach der Identität des Skizzenkillers. Don Luis beginnt zu ahnen, wer hinter den Morden an seinen Handlangern steht. Als Vorwarnung lässt er acht von Emilios Männern in Miami töten. Aus Angst um seine Familie fordert Emilio, dass Cataleya ihren Rachefeldzug stoppt. Zudem steht Don Luis unter dem Schutz der CIA. Inzwischen ist Agent Ross auf die Spur von Cataleya gekommen. Sie kann im letzten Moment einer Festnahme entgehen. Aber Cataleya wird nicht ruhen, bis Don Luis unter dem Erdboden liegt. \n\nDer Franzose Olivier Megaton gehört zu den Schützlingen von Meister-Regisseur Luc Besson. Dessen Drehbuch diente auch als Vorlage für den Action-Reißer \"Colombiana\". Im Mittelpunkt steht die versierte Elite-Killerin Cataleya, die ähnlich wie in Bessons modernem Klassiker \"Nikita\" ihre Opfer auf trickreiche Art aus dem Weg räumt. Zoe Saldana (bekannt als Gamora aus dem Superhelden-Team Guardians of the Galaxy) verkörpert die lebendige Tötungsmaschine Cataleya. Megaton wird in der Folge seinen Ruf als einer der besten Action-Regisseure Europas mit \"96 Hours - Taken 2\" und \"96 Hours - Taken 3\" festigen.\nAction, Frankreich 2011, R: Olivier Megaton"
  widescreen: true
- eventId: 1060886
  start: 2026-09-26T21:50:00Z
  stop: 2026-09-26T23:20:00Z
