  title: Grüne Zukunft - Helden des Alltags
  subtitle: Asien (2/2)
  description: |-
    In Asien, einem überbevölkerten Kontinent mit vielen Gesichtern, entwickelt sich langsam ein ökologisches Bewusstsein. Kambodscha, koreanische Megacitys und ein thailändisches Inselparadies sind Schauplätze von Umweltschutz-Initiativen. Nachhaltige Projekte in der Landwirtschaft, im Tourismus und im Bausektor, verfolgen alle ein Ziel: die vier Milliarden Bewohner des Kontinents für den Umweltschutz zu sensibilisieren und damit zum Erhalt der gefährdeten Natur beizutragen.
    In Seoul, der Hauptstadt Südkoreas, haben Architekten einen auf der Welt einzigartigen Universitätscampus geschaffen. Es ist ein extrem energieeffizientes Bauprojekt, das internationale Anerkennung gefunden hat. In Kambodscha leben Bauern, die ökologische Landwirtschaft betreiben und auf diese Weise armen Dörfern zum Aufschwung verhelfen. Und in Thailand gibt es ein Hotel, das Pionierarbeit auf dem Gebiet des grünen Tourismus leistet. Umweltfreundlicher Tourismus ist weltweit zur Notwendigkeit geworden.
    Dokumentarfilm, Frankreich 2021, R: Frédéric Planchenault
