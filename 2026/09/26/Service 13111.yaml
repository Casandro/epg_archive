  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Pionier des Multiversums
  description: |-
    Kein UFO-Forscher genießt mehr Ansehen als Dr. Jacques Vallée. Als Internet-Pionier, Investor, Autor und Astronom mit einem Doktortitel in Informatik und Wirtschaftsingenieurwesen genießt Vallée den Respekt der wissenschaftlichen und akademischen Gemeinschaft - und ist einer der wenigen Wissenschaftler, die den Mut haben, offen über das UFO-Phänomen zu diskutieren und zu schreiben.
    Vallée wurde in den 1960er Jahren als Berater des Project Blue Book bekannt, einem ehemaligen UFO-Forschungsprojekt der US Air Force, und stellte gewagte neue Theorien auf, um die seltsamen Dinge zu erklären, die sich seit Tausenden von Jahren am Himmel über der Erde abspielen. Er baute auch eine der weltweit größten Datenbanken über UFO-Begegnungen auf. Könnten wir in einer neuen Ära, in der die etablierte Wissenschaft UFOs ernst nimmt, feststellen, dass die Arbeit von Jacques Vallée den Schlüssel zur Lösung des UFO-Rätsels birgt?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2024, R: Mitch Marcus
  widescreen: true
