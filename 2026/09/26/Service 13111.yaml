  title: TM Wissen
  subtitle: Das G'wand der Inkas - Alpakawolle im Härtetest
  description: "Diesmal bei TM Wissen: \nAlpakawolle war einst der Stoff der Inka-Könige. Heute testen ein Textiltechniker und eine Designerin, ob die edle Naturfaser im Outdoor-Markt gegen Merino und Polyester bestehen kann. Ein Extrem-Bergläufer nimmt den Härtetest auf sich: drei Shirts, drei Anstiege, drei Materialien - und die Frage, ob das \"Vlies der Götter\" wirklich überlegen ist. // Spaghetti Bolognese kennt man weltweit - aber nicht in Italien. Dort isst man Tagliatelle al Ragù, ein Gericht mit Pancetta, Karotten, Sellerie und Milch, das stundenlang schmoren muss. Küchenchef Francesco Tedesco erklärt das Original und warum es sich so sehr vom globalen Klischee unterscheidet. // In Roseldorf enthüllen Archäologen die keltischen Ursprünge des Geldes. Mit einfachen Mitteln prägten sie Silbermünzen - nicht nur als Zahlungsmittel, sondern auch als Macht- und Kultsymbole. Pferdemotive und Fälschungen zeigen: Diese kleinen Stücke Metall hatten große Bedeutung. // Wie wurde das Feuerwerk erfunden? Warum wächst Mais fast überall? Was macht manche Vogelnester zu wahren Bauwundern? Und wie lässt sich ein ganzes Haus recyceln?Österreich 2025"
