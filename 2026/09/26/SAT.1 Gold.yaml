  description: In einem Stundenhotel werden die Klienten beim Seitensprung heimlich gefilmt und anschließend erpresst. Wer steckt hinter dieser betrügerischen Masche? Eine Frau meldet einen Einbruch in ihre Wohnung. Jedoch wurde nur das Zimmer ihrer Tochter verwüstet und sie stellt fest, dass diese verschwunden und nicht erreichbar ist. Ein Versteckspiel bei einem Junggesellenabschied endet für zwei Männer auf einem Schrottplatz. Jedoch sind sie nicht freiwillig dorthin verfrachtet worden.
