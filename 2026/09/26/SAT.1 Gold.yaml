  title: Auf Streife
  subtitle: |-
    Kinder, Kinder!
    Scripted Reality, D 2018
    Altersfreigabe: ab 12
    (WH vom Freitag, 25.09.2026, 21:40 Uhr)
  description: Eine Nanny wird von zwei Kindern in die Mangel genommen. Als sie von der Polizei befreit wird, sind die beiden Kinder spurlos verschwunden. Die Beamten erhalten einen Hilferuf aus einer Autowerkstatt und finden vor Ort nicht nur eine verletze Person vor, sondern auch einen Karton mit Nummernschildern geklauter Autos. Als ein junger Mann erfährt, dass er überraschend Besuch seiner Mutter bekommt, handelt er unüberlegt im Affekt. Was hat er zu verbergen?
  widescreen: true
