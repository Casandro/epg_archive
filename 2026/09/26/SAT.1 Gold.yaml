    Charlie Schlatter (Dr. Jesse Travis)
    Harry J. Lennix (Ron Wagner)
    Steven Anderson (Ted Sherman)
    Dey Young (Diane Trent)
    Cliff De Young (Lyle Guthrie)
    Endre Hules (Serge Otrasky)
