    (WH vom Mittwoch, 23.09.2026, 05:45 Uhr)
  description: 'Die gehörlose Eva und ihr Mann Rolf sind schockiert: Ihre 16-jährige Tochter Julia ist Mitglied einer berüchtigten Mädchengang und steht jetzt sogar vor Gericht. Zusammen mit Ganganführerin Michelle soll sie Hip-Hop-Tänzerin Simone krankenhausreif geprügelt haben - angeblich hat die eine Affäre mit Julias Freund Daniel. Ist Julia wirklich zur brutalen Schlägerbraut mutiert? Oder ging der Angriff ganz alleine auf Michelles Konto?'
  widescreen: true
