  title: Sehen statt Hören
  subtitle: Schläge statt Sprache - Erinnerungen an eine Kindheit im Heim
  description: 'So war das noch bis in die 70er Jahre: Ordensschwestern sollten und wollten für gehörlose Kinder da sein, ihnen ein Zuhause, regelmäßige Mahlzeiten und Zugang zu Bildung bieten. Doch in Wirklichkeit wurden viele Heime zu Orten von Gewalt. Auch im Kloster Hohenwart haben die Kinder Traumatisches erlitten. Wie konnte das geschehen? Lässt sich solch eine Geschichte aufarbeiten? Sehen statt Hören hat Kloster Hohenwart mit den Kindern von damals besucht. Auf den Sehen statt Hören-Sendungsseiten finden Sie zusätzlich Experteninterviews in Gebärdensprache und weiterführende Informationen.'
- eventId: 1239158
  start: 2026-09-26T08:15:00Z
  stop: 2026-09-26T08:45:00Z
  title: Die Kinderdorfmutter
  description: |-
    Kinderdorfmutter Susanne aus Hohenlohe hat ein Jahr voller Veränderungen vor sich. Seit 15 Jahren bewohnen sie und ihr Mann Moritz mit sieben ihnen anvertrauten Kindern eine "Villa Kunterbunt". Doch bald wird es ruhiger werden im Haus, denn die ersten ziehen aus.
    Der 17-jährige Kai beginnt eine Ausbildung zum Polizisten 200 km weit weg. Wird er diesen Weg durchhalten? Das wäre ein echter Erfolg nicht nur für Kai, sondern auch für Susanne. Die 16-jährige Sandra zieht in ein Heim für Menschen mit kognitiver Einschränkung. Die jüngeren Kinder bleiben vorerst in ihrer Obhut.
  genre:
  - '112'
- eventId: 1239627
  start: 2026-09-26T08:45:00Z
  stop: 2026-09-26T09:00:00Z
  title: KlimaZeit
  subtitle: 'Moderation: Janina Schreiber'
  description: |-
    Themen:
    * Extremwetter trifft Armut: die Millionenmetropole Manila auf den
    Philippinen wird immer wieder von Stürmen und Überflutungen heimgesucht. Was macht das mit den Menschen, wie können sie sich schützen?
    * Frank Böttcher hat den jährlichen Extremwetterkongress in Hamburg gegründet. Auch dieses Jahr findet er wieder vom 23.-25. September statt. Wir sprechen mit dem Klimaspezialisten über Extremwetter, Folgen und Forderungen.
    * Wärmepumpen sind mit die klimafreundlichsten Heizungen. Ihr Einbau erfolgt in Deutschland aber oft sehr langsam. Wie die Umstellung durch gemeinsame Planung leichter fällt, zeigen zwei Projekte in Bremen.
