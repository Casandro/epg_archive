  title: Wir im Saarland - Saar nur!
  subtitle: 'Moderation: Michael Friemel'
  description: "Mit Leine und Engagement: Damit ihre Hunde regelmäßig Auslauf kriegen, baut das Tierheim Linxbachhof in St.Wendel auf ehrenamtliche Unterstützung und bietet regelmäßig Gassigeher-Schulungen an. Mit Nadel und Wolle: Oma-Hobbys wie Häkeln und Stricken erleben ein wahres Comeback, gerade auch bei jungen Menschen. \nGearbeitet wird nicht im stillen Kämmerlein, sondern bei besonderen Events. Auf diesen Trend setzen auch Milena und Shawn aus dem Mandelbachtal. In ihrem Concept-Store verkaufen sie gehäkelte Accessoires und Dekoartikel. Außerdem bieten sie Häkelkurse an."
- eventId: 1236149
  start: 2026-09-26T05:10:00Z
  stop: 2026-09-26T07:05:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
