  title: Damals in Amerika
  subtitle: Die Geschichte der Arbeiter
  description: Amerika als wilder Westen, als weites Land der Cowboys und ihrer Viehherden - dieses Bild ändert sich mit Beginn des 20. Jahrhunderts, als die Metamorphose der USA zur größten Industrie- und Konsumkultur der Welt Fahrt aufnimmt. Elektrokonzerne wie Westinghouse legen mit der Bereitstellung von Strom den Grundstein für die technische und industrielle Entwicklung. Allein im Hauptwerk sind 10.000 Menschen beschäftigt. Arbeitssicherheit und Entlohnung der Arbeiter*innen hat die boomende Produktion dabei nicht im Blick.
