  title: Damals in Amerika (10/17)
  subtitle: Die Geschichte der Mächtigen
  description: "Im 20. Jahrhundert bauten sich Familien wie die Rockefellers und die Vanderbilts ein enormes Vermögen auf.\n\nPolitische Dynastien wie die Roosevelts mischten sich unter diese vermögenden Eliten und der Pressebaron William Randolph Hearst füllte seine Zeitungen mit Geschichten über sie. Der junge Joseph Kennedy, dessen Sohn John F. Kennedy Amerika für immer verändern würde, plante seinen Aufstieg in die Reihen des amerikanischen Adels.\n\nMithilfe seltener Archive und Heimvideos wird die Geschichte der Mächtigen Amerikas nun zum ersten Mal in Farbe gezeigt.\n\nSendehinweis: \n\n26.09.2026, 05:45 Uhr"
