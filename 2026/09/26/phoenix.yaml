  title: Gustave M. Gilbert
  subtitle: Meine Geschichte - Nach dem Krieg
  widescreen: true
  hd: true
  description: "Gustave M. Gilbert, ein Kind österreichisch-jüdischer Einwanderer, war amerikanischer Gefängnispsychologe und wurde während der Nürnberger Hauptkriegsverbrecherprozesse als Übersetzer und Psychologe eingesetzt.. Er führte dabei Gespräche mit NS-Funktionären wie Hermann Göring, Joachim von Ribbentrop, Wilhelm Keitel, Rudolf Heß und Ernst Kaltenbrunner. 1947 erschien sein 'Nürnberger Tagebuch' über diese Tätigkeit. \nGilbert war 1961 auch Sachverständiger im Eichmann-Prozess in Jerusalem."
