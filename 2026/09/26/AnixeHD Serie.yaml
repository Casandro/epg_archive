  description: 'Der Traum von Franz Unterholzer wird wahr: Eine überdimensional riesige Figur seiner selbst wird in Oberilm errichtet. Allerdings ist diese zum Einsturz verurteilt: Badman treibt sein Unwesen in der Stadt und manipuliert, erpresst und droht wo er nur kann. So haben bald alle in Oberilm Lebenden einen bösen Brief bekommen, der sie in Angst, Schrecken und Aufruhr versetzt. Toni wird zwar zunächst für den Täter gehalten, verdächtigt sich sogar selber - erweist sich aber relativ bald als unfähig zu solch einer Tat. Für Julie ist bald klar: Wer so viele Informationen hat, kann kein Fremder sein, der Bösewicht ist unter ihnen!'
