  title: Druga strana
  subtitle: Geopolitičke napetosti rastu. Središnje banke Amerike i Europe dižu kamatne stope, a investitori ne slijede stara, utabana pravila.Zašto ne kupuju obveznice koje nude veći prinos nego prije?
  description: 'Geopolitičke napetosti rastu. Središnje banke Amerike i Europe dižu kamatne stope, a investitori ne slijede stara, utabana pravila.Zašto ne kupuju obveznice koje nude veći prinos nego prije? Tko se boji vrtoglavog rasta državnog duga i inflacije? Hoće li na cijenu zlata više utjecati Hormuz ili indijska sezona vjenčanja? I zašto Europska središnja banka prati cijenu piva na Oktoberfestu? Kako je to davne 2008 govorio politolog Daniel Drezner: "Kada Sjedinjene Države duguju Kini stotine milijardi dolara, onda je to američki problem. No, kad joj duguju 600 tisuća milijardi dolara, onda je to kineski problem." Kina i Amerika zaglavile su u nužnoj ravnoteži i balansu međusobnog financijskog terorizma. Iz koje nema izlaza... barem ne lakog. Globalni investitori to su prepoznali. I ne daju se uvući u igru. A američki dug raste kao nikada do sada. I tu dolazimo do prvog tržišnog paradoksa. Amerika obećava više kamate, a to je uvijek značilo pad cijene zlata. Jer, zašto riskirati na tržištu kad američka država nudi sigurnu i stabilnu zaradu? Ove godine to se ne događa! Investitori pokazuju veći apetit prema zlatu od središnjih banaka do ETF-ova. Slijedi li oporavak ili novi tržišni zlatni balon, odgovara Vladimir Potočki, ekonomski analitičar i stručnjak za tržište plemenitih metala.'
