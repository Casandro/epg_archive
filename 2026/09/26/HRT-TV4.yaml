  title: Veterani mira
  subtitle: Tjedna emisija, u razgovoru u studiju i reportažama rasvjetljava i nastoji riješiti probleme s kojima se susreću branitelji te senzibilizirati javnost.
  description: Ova emisija posvećena je bitci za Šibenik koja se odigrala u rujnu 1991. Jastrebovi su rođeni točno godinu dana prije napada na Šibenik. Bili su prva oružana postrojba u Dalmaciji. Jezgru postrojbe činilo je 25 ljudi koji su položili tečaj Prvog hrvatskog redarstvenika. Početak otvorene agresije na Hrvatsku 1991. dočekali su na nekoliko položaja.  O tim dramatičnim događajima u studiju govore Nikola Vukošić, tada načelnika Policijske uprave Šibenik te Ivica Ajduković Jastreb, zapovjednika Specijalne jedinice policije Policijske uprave Šibenik.  U emisiji se prisjećamo i osvajanja vojarne i drugih objekata JNA u Osijeku. Nakon izlaska tenkova JNA iz vojarne i gaženja crvenoga fiće 27. lipnja 1991. neprijatelj je u Osijeku pokazao svoje lice. JNA je straže s puškama uperenima u građane mjesecima držala na svim prozorima "bijele vojarne", a bolnica im je bila nasuprot. Stoga je oslobađanje vojnih objekata JNA bilo ključno za normalan život u Osijeku.
