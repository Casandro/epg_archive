  title: 'Hrvatska moj izbor: Obitelj Grbeša'
  subtitle: Iako je rođen u Belgiji, Claude Grbeša oduvijek je sanjao o životu u Hrvatskoj.
  description: Iako je rođen u Belgiji, Claude Grbeša oduvijek je sanjao o životu u Hrvatskoj. Devedesetih godina prošlog stoljeća želja mu se ostvarila - doselio se u Zagreb i započeo karijeru u hrvatskoj diplomaciji.Tisućama kilometara dalje, u Argentini, živjela je Adriana Veronica Ostojić, koju je ljubav prema Hrvatskoj također dovela u domovinu. A onda su se njihovi životni putevi spojili. Što ih je povezalo i zašto su došli u Hrvatsku, otkrivamo u novoj epizodi serijala "Hrvatska moj izbor".
