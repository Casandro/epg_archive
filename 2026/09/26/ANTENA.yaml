    Reżyseria: Tim Green
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    Załoga Poseidon próbuje odnaleźć złoto na terenie o powierzchni ponad dwustu hektarów. Jej uczestnicy muszą się jednak spieszyć, żeby zdążyć przed zamarznięciem wody na kilka dni, a nawet tygodni. Dust Devils podejmują ryzykowną decyzję i kupują kruszarkę za 150 tysięcy dolarów. Drużyna Jacqui i Andrew ma nadzieję na udane poszukiwania w stanie Queensland. Jednak mają poważny problem z mocno zmineralizowaną ziemią. Udają się w nowe miejsce pięcioma ciężarówkami pełnymi nowego sprzętu górniczego.
