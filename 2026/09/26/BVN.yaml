  description: De buurtbewoners van Zin in Zappelin weten van elke dag een feestje te maken. De kinderen die op bezoek komen, worden getrakteerd op een spannend voorleesverhaal, leren over dieren of verbazen zich over goocheltrucs. En natuurlijk wordt er ook gedanst. Dans je thuis of op school ook mee? (2026)
