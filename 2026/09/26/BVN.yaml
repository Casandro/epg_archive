  description: In huize Bauer is het altijd een zoete inval. Frans Jr. viert het einde van het voetbalseizoen met zijn team tijdens een poolparty. Ook Frans' moeder, die sinds enkele maanden vanwege haar dementie in een verzorgingstehuis woont, is erbij en geniet zichtbaar van alle gezelligheid. Naast jong geluk en nieuw leven hoort ook afscheid nemen bij deze levensfase. De woonwagen van Frans' moeder staat al een tijd leeg en krijgt nieuwe bewoners. Het is het einde van een tijdperk en een beladen moment dat Frans bewust alleen beleeft. Hij filmt zelf hoe de woonwagen wordt weggehaald en op weg gaat naar zijn nieuwe bestemming. (2026)
