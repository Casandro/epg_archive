  title: 3 op reis
  subtitle: Jamaica S20 E05. Jurre Geluk, Raïsha Zeegelaar, Max Terpstra, Sahil Amar Aïssa en Eva Eikhout laten zien hoe mooi onze planeet is en hoe je als reiziger met een duurzame en inclusieve instelling een verschil kunt maken.
  description: Raïsha vervolgt haar reis in het Caribisch gebied en is dit keer op Jamaica. Ze onderzoekt hoe de inwoners hun eigen draai geven aan de Jamaicaanse cultuur die wereldwijd zoveel impact heeft. Ze begint in Kingston, waar ze de dancehallscene induikt. Daarna rijdt ze de bergen in en ontmoet ze een Marron-gemeenschap die haar eigen cultuur en tradities in leven houdt. Ze sluit haar reis af in de straten van Kingston tijdens het Jamaicaanse carnaval. (2026)
