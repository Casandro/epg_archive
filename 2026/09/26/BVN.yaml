  title: Vroege vogels
  subtitle: Oostelijke Mijnstreek S23 E15. In de Oostelijke Mijnstreek laat grondstofwinning sporen achter in de natuur. Zwavel borrelt op uit de bodem en de kleine ijsvogelvlinder fladdert door het oude naaldbos.
  description: 'Levendbarende hagedissen schieten weg tussen zonnedauw en beenbreek in het laagveen van de Oostelijke Mijnstreek. Uit een van de vele poeltjes borrelt plots de geur van rotte eieren op: er zit hier zwavel in de bodem. Een restant van de grootschalige grondstofwinning in dit deel van Limburg. In het oude naaldbos, aangeplant om de steenkoolmijnen te stutten, ziet Menno Bentveld de kleine ijsvogelvlinder fladderen. Op de Breukberg wordt alles uit de kast gehaald om de bodem te vernatten, zodat de veenpiraat, kamsalamander en zeldzame veenorchis zich kunnen handhaven. (2026)'
