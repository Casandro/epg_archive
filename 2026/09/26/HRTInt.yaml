  stop: 2026-09-26T06:32:00Z
  title: Urban & 4 i Simfonijski orkestar HRT-a, Arena Zagreb 10.6.2023. 1.dio
  subtitle: ' '
  description: Oko osam tisuća ljudi okupilo se u zagrebačkoj Areni kako bi svjedočilo više od tri desetljeća dugoj karijeri Damira Urbana, sažetoj u 23 pjesme za koje je većinu aranžmana napravio Ante Gelo. Izbor je obuhvatio Urbanovo stvaralaštvo od prve polovice 1990-ih i sastava Laufer (s legendarnom pjesmom Budi moja voda) preko solo projekata pa sve do danas. Devet mjeseci nakon očaravajućeg koncerta Urban & 4 i Simfonijskog orkestra HRT-a na Prisavlju, održanog u sklopu Sunčane strane Prisavlja, isti sastav impresionirao je i u zagrebačkoj Areni 10. lipnja 2023. Damir Urban i njegova Četvorka - Luka Toman (gitara), Marko Bradaschia (bubnjevi), Sandi Bratonja (bas gitara, harmonika) i Saša Markovski (klavijature) - te Simfonijski orkestar HRT-a pod ravnanjem Alana Bjelinskog, ovaj su put izveli još više pjesama i još snažnije zadivili svojom sinergijom.
