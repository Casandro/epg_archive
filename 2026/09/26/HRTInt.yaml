  start: 2026-09-26T04:47:00Z
  stop: 2026-09-26T05:29:00Z
  title: Dolina sunca, serija (17/210)
  subtitle: ' '
  description: 'Lada se ljuti na Natašu govoreći joj da želi sve, i bogatog muža i Lovru za ljubavnika sa strane. Kristijan uvjerava Ivana kako bi bilo dobro da se prebace na ekološku poljoprivredu, ali on i dalje u tome vidi samo rizik. Eva ostane zatečena kada joj Julija priopći kako je odlučila odustati od parnice. Juran je bijesan što se Nataša usudila uzimati pilule bez njegovog znanja, ali ga Sonja umiruje činjenicom kako je sada ima u šaci. Kristijan se ispričava Ireni što ne može s njom u kupovinu jer mora obaviti neke stvari, a ustvari želi potajno Evi srediti dozvolu za obnovu. Julija kaže Evi da iako je odlučila povući tužbu, za njih dvije bilo bi najbolje da se izbjegavaju. Adela sve teže skriva svoju tugu zbog Nikole. Sonja namjerno izazove zabrinutost kod Irene spomenuvši Evi njezino često druženje s Kristijanom. Sofija zabrinuto, ali oprezno upita Jurana je li sve u redu između njega i Nataše. Juran kaže Nataši da je čuo njezin i Ladin razgovor. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1132372
  start: 2026-09-26T05:29:00Z
  stop: 2026-09-26T06:32:00Z
  title: Urban & 4 i Simfonijski orkestar HRT-a, Arena Zagreb 10.6.2023. 1.dio
  subtitle: ' '
  description: Oko osam tisuća ljudi okupilo se u zagrebačkoj Areni kako bi svjedočilo više od tri desetljeća dugoj karijeri Damira Urbana, sažetoj u 23 pjesme za koje je većinu aranžmana napravio Ante Gelo. Izbor je obuhvatio Urbanovo stvaralaštvo od prve polovice 1990-ih i sastava Laufer (s legendarnom pjesmom Budi moja voda) preko solo projekata pa sve do danas. Devet mjeseci nakon očaravajućeg koncerta Urban & 4 i Simfonijskog orkestra HRT-a na Prisavlju, održanog u sklopu Sunčane strane Prisavlja, isti sastav impresionirao je i u zagrebačkoj Areni 10. lipnja 2023. Damir Urban i njegova Četvorka - Luka Toman (gitara), Marko Bradaschia (bubnjevi), Sandi Bratonja (bas gitara, harmonika) i Saša Markovski (klavijature) - te Simfonijski orkestar HRT-a pod ravnanjem Alana Bjelinskog, ovaj su put izveli još više pjesama i još snažnije zadivili svojom sinergijom.
- eventId: 1132373
  start: 2026-09-26T06:32:00Z
  stop: 2026-09-26T06:38:00Z
  title: 'Bajkovita Hrvatska: Šibenska katedrala'
