  title: Plötzlich Prinzessin
  subtitle: Komödie, GB/USA 2001
  description: 'Regie: Garry Marshall. Darsteller: Julie Andrews, Anne Hathaway, Hector Elizondo. Tollpatschig, mit Hornbrille und Struwwelpeterfrisur wenig attraktiv, ist die 15-jährige Mia auf ihrer Eliteschule Zielscheibe für Hänseleien. Ihr Leben wird gründlich auf den Kopf gestellt, als ihre Großmutter aus Europa aufkreuzt und sich als Königin von Genovia zu erkennen gibt. Mia ist die einzige Thronerbin und soll die Regierung des Ministaates übernehmen. Vorher muss sie aber herausfinden, wer ihre wahren Freunde sind. Mit dem modernen Märchen "Pretty Woman" konnte Regisseur Garry Marshall ein Millionenpublikum begeistern. Erfuhr Julia Roberts'' Protagonistin allerdings lediglich eine sinnbildliche Aschenputtel-Wandlung, dreht sich die Geschichte von "Plötzlich Prinzessin!" um ein echtes Blaublut. Die sympathische Ann Hathaway spielt das ungelenke Schulmädchen Mia, das unerwartet von ihrer Großmutter in Gestalt von Julie Andrews ("Mary Poppins") erfährt, die Kronprinzessin des fiktiven Genovia zu sein. Die romantische Komödienfantasie zieht mit ihrem geradlinigen Charme vor allem das Familienpublikum in ihren Bann, was sich in einen königlichen US-Start mit 22,9 Mio. Dollar Einspiel äußerte. Das Drehbuch von Gina Wendkos basiert auf dem Roman von Meg Cabot und ist der Stoff, aus dem rosarote Mädchenträume gewoben sind. Marshalls Inszenierung versucht dabei eine ausgewogene Balance zwischen Märchenhaftigkeit und Alltag zu finden. Als Traumkulisse dient Hollywoods Paris-Nachfolger San Francisco, das in immer mehr romantischen Komödien eine prominente Nebenrolle einnimmt. Die 15-jährige Mia lebt mit ihrer geschiedenen Mutter (Caroline Goodall) in einer umgebauten Feuerwehrstation und besucht eine exklusive Privatschule. Tollpatschig, mit Hornbrille und Struwwelpeterfrisur wenig attraktiv, ist sie Zielscheibe für allerlei gemeiner Hänseleien. Mia nimmt dies jedoch relativ gelassen hin. Ihre beste Freundin Lily (Heather Matarazzo aus "Willkommen im Tollhaus") ist ebenfalls ein...'
  widescreen: true
