  title: Die Unglaublichen
  subtitle: Animationsfilm, USA 2004
  description: 'Regie: Brad Bird. Darsteller: Craig T. Nelson, Holly Hunter, Samuel L. Jackson. Einmal den Falschen gerettet und schon ist''s passiert! Der Superheld Mr. Incredible hat eine Klage wegen "unerwünschter Lebensrettung" am Hals und muss fortan sein Dasein als Versicherungsangestellter fristen - gut getarnt hinter wachsendem Bauchansatz. Als er die Gelegenheit wittert, wieder aktiv zu werden, hängt nicht nur der Haussegen schief, sondern auch der Weltfrieden ist in höchster Gefahr! Zum Glück ist seine Frau Helen flexibel. Mit ihrem außergewöhnlichen Nachwuchs, dem kleinen Flitzer Flash und der scheinbar unscheinbaren Violetta, macht sie sich auf, mal eben die Welt zu retten...'
  widescreen: true
