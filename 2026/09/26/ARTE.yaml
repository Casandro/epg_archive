  title: 'Animaux : Le rythme dans la peau ?'
  subtitle: Des chants des baleines aux déhanchés du cacatoès Snowball, star d'Internet, panorama des recherches concernant le rapport des animaux à la musique.
  genre:
  - '146'
  description: 'Les animaux ont-ils le rythme dans la peau ? Depuis une décennie environ, des scientifiques du monde entier cherchent à savoir s''il existe des caractéristiques musicales communes aux humains et aux animaux. Au Japon, la primatologue Yuko Hattori étudie les capacités rythmiques des chimpanzés, qui ont spontanément tendance à adapter leurs mouvements aux sons qu''ils entendent. Aniruddh Patel s''est, lui, penché sur le cas du cacatoès Snowball, star de Youtube. Le neuroscientifique a pu établir que l''oiseau à huppe jaune maîtrise quatorze mouvements de danse différents, mais aussi qu''il ajuste sa chorégraphie à la vitesse de la musique. L''apprentissage de la parole, dont sont capables certains perroquets, influence-t-il leur faculté à se trémousser en rythme ? De son côté, le musicien et chercheur écossais Alex South s''intéresse aux chants des baleines, qui contiennent un grand nombre de sons. Il a découvert que tous les mâles d''un groupe donné reproduisent précisément le même chant, preuve que les cétacés s''écoutent et apprennent de leurs congénères. Expériences ludiques La sensibilité à la musique est-elle innée ou acquise ? À Amsterdam, le professeur Henkjan Honing a testé la perception du tempo chez les nouveau-nés. Résultat : ceux-ci comprennent la mélodie et anticipent la suite, ce qui tendrait à démontrer le fondement biologique de la musique, et donc son partage par différentes espèces. Cochons de lait grognant en cadence au moment de la tétée, diamants mandarins déployant deux qualités de chant. : s''il reste encore beaucoup à découvrir, ce fascinant tour d''horizon des recherches actuelles révèle, au gré d''expériences ludiques, les secrets de certaines espèces animales quant à leur manière d''appréhender la musique et même d''en composer. Réalisateur: Connie Edwards (2022)'
- eventId: 1235371
  start: 2026-09-26T03:51:21Z
  stop: 2026-09-26T04:39:42Z
  title: Animaux - Le rythme dans la peau ?
  description: |-
    Documentaire de Connie Edwards (Royaume-Uni, 2022, 47mn) Sommes-nous la seule espèce sensible à cet enchaînement de sons que nous appelons musique ? Des chants des baleines aux déhanchés du cacatoès Snowball, star d'Internet, ce documentaire entraînant dresse un panorama international des recherches menées sur le sujet depuis une dizaine d'années.

