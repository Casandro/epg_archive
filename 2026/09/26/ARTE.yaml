  title: 'Versailles : Le palais retrouvé du Roi-Soleil'
  subtitle: Une exploration inédite du château de Versailles tel que l'avait voulu Louis XIV, grâce aux dernières avancées archéologiques, technologiques et scientifiques.
  genre:
  - '32'
  description: 'Dans les années 1660, le jeune Louis XIV, désormais seul aux commandes du royaume, prend l''habitude d''investir les jardins du domaine de Versailles pour y donner des fêtes somptueuses. Au fil de son ascension, le monarque va métamorphoser le château bâti par son père, modeste gentilhommière difficile d''accès, en palais éblouissant, devenu résidence permanente de la cour à partir de 1682. Chantier ininterrompu au cours de son règne, Versailles n''a ensuite cessé d''être remodelé par ses occupants successifs. Plus de trois siècles après le crépuscule du Roi-Soleil, les chercheurs recomposent peu à peu la genèse du château et ressuscitent les espaces disparus, en s''appuyant sur la numérisation des plans de l''époque, de récentes découvertes archéologiques et de minutieuses modélisations en 3D. Instrument de domination En suivant dans leurs recherches les meilleurs spécialistes, Marc Jampolsky (Mont-Saint-Michel - Le labyrinthe de l''archange) propose une exploration inédite de Versailles tel que l''a conçu Louis XIV. Matérialisations symboliques de son pouvoir absolu et de ses rêves, le fabuleux bosquet du labyrinthe, agencé par André Le Nôtre autour des fables de Charles Perrault, la grotte artificielle de Téthys, animée par la féerie des jets d''eau, les luxueux appartements des courtisans ou encore la galerie Mignard, le musée privé de Sa Majesté, reprennent ainsi vie sous nos yeux. Entrelaçant témoignages d''experts, séquences de fiction et reconstitutions en 3D, ce documentaire plonge dans le passé architectural du château et éclaire les visées politiques qui ont préludé aux différentes étapes de sa construction. Réalisateur: Marc Jampolsky. Des acteurs: Douglas Joyman (Louis XIV), Jean-Noël Martin (Louis XIV âgé), Armand Eloi (Colbert), Donat Guibert (Charles Perrault), Hervé Masquelier (Dangeau) (2019)'
