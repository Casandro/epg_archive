  title: 'Les Blackfoot de l''Alberta : Sur la piste des peuples premiers'
  subtitle: Dans la province canadienne de l'Alberta, le peuple autochtone Blackfoot, victime d'une politique d'extinction culturelle au XIXe siècle, s'attelle à faire revivre ses traditions.
  genre:
  - '146'
  description: 'Dans la province canadienne de l''Alberta, le territoire des Blackfoot, peuple historiquement nomade de chasseurs et de cavaliers, s''étendait jadis sur plus de 160 000 kilomètres carrés. Il a été réduit comme peau de chagrin au XIXe siècle, à la suite d''un traité inique signé sous la pression des colons. Alors considérés comme des "sauvages" à rééduquer, les Blackfoot ont été victimes d''une vaste politique d''assimilation et d''extinction culturelle menée par le gouvernement canadien. Malgré les persécutions, les cultures autochtones des Premières Nations ne se sont jamais éteintes. Entre traditions séculaires et nouveaux enjeux, les Blackfoot de l''Alberta ont aujourd''hui à coeur de faire vivre leur héritage, de l''Indian Relay, une dangereuse course de chevaux, au Sundance, une intense cérémonie de danse qui dure quatre jours. Réalisateur: Rosvita Dransfeld (2024)'
- eventId: 1235370
  start: 2026-09-26T03:06:00Z
  stop: 2026-09-26T03:51:21Z
  title: Les Blackfoot de l'Alberta - Sur la piste des peuples premiers
  description: |-
    Documentaire de Rosie Dransfeld (Canada, 2023, 44mn) Dans la province canadienne de l'Alberta, le peuple autochtone Blackfoot, victime d'une politique d'extinction culturelle au XIXe siècle, s'attelle aujourd'hui à faire revivre son patrimoine et ses traditions.

