  title: 'OnlineKirche mit Pastor Gert Hoinle - Dein Gebet aktiviert Gottes Engel: Schutz und Kraft | Engel 1'
  description: 'Du betest wenig, weil dir im Grunde die Zuversicht mangelt, erhört zu werden? Dann erkenne: Auf dein Gebet hin schickt Gott Engel los. Es tut sich was, auch wenn du es nicht gleich siehst. Engel bringen Betern neue Kraft und werden zu Schutzengeln, wenn für die Schutzbedürftigen gebetet wird. Geschieht das nicht, kann es sein, dass selbst die Besten in Nöte geraten. Denn für den Apostel Jakobus wurde nicht gebetet und er wurde hingerichtet. Für Petrus wiederum geschah ein anhaltendes Gebet und er wurde von einem Engel aus dem Gefängnis befreit. Und der Prophet Elisa ruhte in sich als er von einem ganzen Heer belagert wurde. Denn ein anderes, unsichtbares Heer, griff auf seiner Seite ein und machte den Angriff zunichte.'
  widescreen: true
