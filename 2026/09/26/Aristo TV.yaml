  title: ERF Mensch Gott - Gott gibt _s echt! - Krise nach Beziehungsaus
  description: 'Sie fühlt sich wie ausgesaugt, alles erscheint sinnlos. Das Ende einer Beziehung stürzt  Thao in eine Krise. Lange verdrängte Erinnerungen sind plötzlich wieder da. Um aus  ihrer Erstarrung rauszukommen, geht sie regelmäßig tanzen. Bei lauter Techno-Musik  kann sie ihre Wut zulassen. Zurück im Alltag muss sie wieder funktionieren - doch der  Schmerz wird immer schlimmer. Innerlich schreit sie: "Irgendwer muss mir helfen."  Kurz darauf hat sie in der Disco eine lebensverändernde Begegnung.'
  widescreen: true
