  title: ErlebtTV - Ich betete um das Leben meines Kindes
  description: 'Wenn das Leben des eigenen Kindes bedroht ist, sind die Eltern einer großen Belastung ausgesetzt. Drei Paare berichten, wie sie mit dieser Situation umgegangen sind: Für Nicole Longoria erfüllt sich ein großer Wunsch, als sie mit Zwillingssöhnen schwanger ist - doch schon im Mutterleib sind die Babys in Lebensgefahr. Grant und Nikki Carroll werden mit ihren drei Kindern in einen schweren Autounfall verwickelt, bei dem ihr ältester Sohn lebensgefährlich verletzt wird. Der Sohn von Leanne und Mike Gunderson wird mit einer seltenen Darmerkrankung geboren und es gibt keine Hoffnung auf Heilung.. (Moderation: Marzia Plichta / Andreas Waldmann)'
