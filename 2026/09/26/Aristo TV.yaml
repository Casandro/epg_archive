  title: Entdecke die Welt - Bozen
  description: Südtirol ist nicht Italien. Diesen Widerspruch erlebt man nirgendwo intensiver als in der Provinzhauptstadt Bozen. Hier prallen italienisches Temperament auf südtiroler Tradition und Bodenständigkeit.Pasta auf Knödel und Weissbrot auf Schüttelbrot. Parmesan auf Bergkäse.Aber nicht nur kuliniarisch, auch menschlich macht diese ungewollteMischung gerade den Reiz in der Alpenmetropole aus. Bozen ist überschaubar, hat man die Laubengasse im Zentrum erreicht, hat man die Stadt fast schon entdeckt. Und irgendwann trifft man dann auf den Mann aus dem Eis, der jetzt im Archäologiemuseum in einer Röhre liegt und bis zur letzten Hautschuppe vermarktet wird. Und dabei gibt es wahrlich spannendere Orte, Menschen und ihre Geschichten zu entdecken.
  widescreen: true
