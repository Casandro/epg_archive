  title: Gunst der Stunde mit Heiko Bräuning - Zeigt her eure Schuhe
  description: 'Ich weiß nicht, welche Schuhe sie gerade anhaben. Hausschuhe, weil Sie es sich gemütlich gemacht haben zuhause? Wanderstiefel, weil ein weiter Weg hinter Ihnen liegt. Gummistiefel, weil es ganz schön nass und matschig gerade auf ihrem Wegesabschnitt ist? Turnschuhe, weil die nächste Etappe sportlich zu meistern ist? Egal, welche Schuhe sie gerade tragen: Getragen werden Sie von Gott, der sagt: Ihr werdet seit langer Zeit von mir getragen. Ich halte euch! Das hat auch unser heutiger Gast erlebt: Andreas Sittner. Wie er gehalten wurde, obwohl der Lebensweg teilweise unglaublich schwer und steil war, das erzählt er uns heute als Zeuge des allmächtigen Gottes!'
  widescreen: true
