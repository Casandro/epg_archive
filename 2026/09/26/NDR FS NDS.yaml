  title: Hanseblick - So wild ist Mecklenburg
  subtitle: Zwischen Wisent und Fledermaus
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Der "Hanseblick" ist unterwegs im Naturpark Nossentiner/Schwinzer Heide. Im Herzen Mecklenburgs gelegen ist es ein Refugium für wilde Tiere, Fledermäuse und Naturfreunde. 60 Seen mit klarem Wasser gibt es hier. Die größten Säugetiere Europas, die Wisente, leben im Reservat Dammerower Werder. Und die leichtesten Säugetiere, die Fledermäuse, rund um die Dörfer Bossow und Wooster Teerofen in alten Bunkern und Nistkästen. Seeadler, Gänse, die zu Tausenden durchziehen, und Kraniche locken Naturliebhaber auf die Aussichtstürme und -plattformen.
