  title: Unsere Geschichte
  subtitle: Als die Ökos in den Norden kamen
  description: 'Spinner oder langhaarige Gammler wurden sie genannt: Junge Männer und Frauen, die vor 40 Jahren anders leben wollten. In Kommunen, Wohngemeinschaften und vor allem Einklang mit der Natur. Den Boden nicht ausbeuten, nachhaltig wirtschaften - auch als Landwirt. Viele Alteingesessene schüttelten oft den Kopf, über Biogemüse, Tierwohl und Windenergie. Nur im dünnbesiedelten, norddeutschen Wendland war es etwas anders. Zwar wurden die Latzhosenträger auch dort nicht von allen freundlich empfangen, aber der Kampf gegen das atomare Endlager in Gorleben einte mehr, als er trennte.'
