- eventId: 1192016
  start: 2026-09-26T08:04:00Z
  stop: 2026-09-26T09:00:00Z
  title: Hobby magazín
  description: Dne si řekneme co udělat proto, aby vám vykvetla klívie. Dozvíme se, že přibývá žen myslivkyň, jak zjistila Slávka Brádlová od Lady Dolejšové, jednatelky Okresního mysliveckého spolku Českomoravské myslivecké jednoty v Litoměřicích. Více si řekneme o pálení v pálenicích - množství se sčítá a eviduje digitálně, vidí na to Celní zpráva, jak pálenku uskladnit, právní otázky - rodina žije v jednom domku - vypálit dané množství může jenom jeden, mají dva elektroměry, vypálit si mohou obě rodiny. Jak by mělo ovoce vypadat při přívozu do pálenice. V čem a jak uskladnit. Jde hned pít čerstvě vypálený ovocný destilát? Na to vše se bude Jiří Šobr vyptávat emeritního prezidenta Unie destilatérů a majitele Parního lihovaru v Blatné, Václava Šitnera.
