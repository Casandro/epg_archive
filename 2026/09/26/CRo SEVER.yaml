  start: 2026-09-26T09:04:00Z
  stop: 2026-09-26T10:00:00Z
  title: Svět zvířat
  description: Host Světa zvířat Miroslav Machala se věnuje myslivosti desítky let, lov a trofeje jsou pro něj však druhořadé. Hlavní je pro něj láska k přírodě, která při každé návštěvě lesa dokáže překvapit něčím novým. Významnou částí jeho života jsou i lovečtí psi, od barvářů přes norníky až po specialisty na práci ve vodě. Dozvíte se jak vypadá jejich výcvik a co všechno obnáší složení náročných loveckých zkoušek. Moderuje Slávka Brádlová.
