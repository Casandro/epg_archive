    Prowadzą: Katarzyna Kasia
    Prowadząca w rozmowie z wybitnym językoznawcą poruszy tematy związane z mową codzienną, idiomami czy debatą publiczną. W programie znajdą się elementy edukacyjne i rozrywkowe. Nie zabraknie tematów trudnych. Profesor Bralczyk podzieli się swoją wiedzą oraz doświadczeniem, komentując niepoprawne formy.
    Od lat: 12
  ageRating: 12
  genre:
