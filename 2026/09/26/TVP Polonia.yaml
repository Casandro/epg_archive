  title: Samochodzik i templariusze - odc. 2/5 Fałszywy brodacz
  description: |-
    Tytuł oryginalny: Samochodzik i templariusze
    PL, 1971
    Reżyseria: Hubert Drapella
    Występują: Stanisław Mikulski, Grażyna Marzec, Lech Ordon, Ewa Szykulska, Zygmunt Apostoł, Tadeusz Gwiazdowski
    Obawy pana Tomasza zaczynają się sprawdzać - skarbu templariuszy poszukuje coraz więcej osób. Pan Samochodzik i jego mali pomocnicy spotykają na szlaku nie tylko Karen i jej ojca, kapitana Petersena. Niespodziewanie pojawia się młoda dziewczyna, która pilnie śledzi poczynania poszukiwaczy, w pobliżu kręcą się też jakieś podejrzane typy. Petersen próbuje nawiązać kontakt z tajemniczym osobnikiem, który podobno jest w posiadaniu dokumentu umożliwiającego dotarcie do skarbu.
  ageRating: 7
  genre:
  - '18'
  subtitle: 'Obawy pana Tomasza się sprawdzają - skarbu templariuszy poszukuje coraz więcej osób. Pan Samochodzik i jego pomocnicy spotykają na szlaku Karen i jej ojca, kapitana Petersena. '
- eventId: 1018397
  start: 2026-09-26T10:40:00Z
  stop: 2026-09-26T11:15:00Z
  title: Samochodzik i templariusze - odc. 3/5 Tajemnica Bahometa
  description: |-
    Tytuł oryginalny: Samochodzik i templariusze
    PL, 1971
    Reżyseria: Hubert Drapella
    Występują: Stanisław Mikulski, Grażyna Marzec, Ewa Szykulska, Tadeusz Gwiazdowski, Alina Janowska, Danuta Szaflarska
    Wędrówka po Pojezierzu Suwalskim nie przynosi spodziewanych rezultatów. Pan Samochodzik i harcerze nie zdołali trafić na żaden ślad, który przybliżyłby ich do skarbu templariuszy. Postanawiają jechać do Malborka. Mają nadzieję, że na miejscu uda im się rozszyfrować sens słów "Tam skarb twój, gdzie serce twoje" - przecież Krzyżacy nazywali swoją stolicę "Serce Twoje".
  ageRating: 7
  genre:
  - '18'
  subtitle: Pan Tomasz i chłopcy udają się do Malborka, aby tam rozszyfrować zagadkę. Podczas zwiedzania Samochodzik otrzymuje wiadomość. Nadawca ostrzega go, że jeśli nie wyjedzie, będzie miał kłopoty.
- eventId: 1018398
