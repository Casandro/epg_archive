  title: Ranczo s.III - odc. 38 (seria III, odc. 12) - Złoty deszcz
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2008
    Reżyseria: Robert Brutter
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Franciszek Pieczka, Dorota Nowakowska, Jacek Kawalec
    Hadziuk chodzi po wsi jak ranny łoś, widząc w każdym mężczyźnie sprawcę swego nieszczęścia, natomiast polonista przeprowadza kolejne rozmowy o kobiecej duszy, działając na każdą interlokutorkę podobnie jak na Hadziukową. Wójt dostaje nagle wezwanie do województwa. Nie znając przyczyn wezwania, jest przekonany, że czeka go odwołanie, a może nawet zostanie zakuty w kajdanki, jak to jest w modzie. Wójt wyrusza zatem w swoją ostatnią drogę służbową.
  ageRating: 12
  genre:
  - '23'
  subtitle: Hadziuk poszukuje sprawcy swojego nieszczęścia. Wójt dostaje wezwanie na rozmowę do województwa, obawia się, że zostanie odwołany z funkcji albo nawet aresztowany.
- eventId: 1018354
  start: 2026-09-26T01:10:00Z
  stop: 2026-09-26T01:40:00Z
  title: Tańcząca ze światem - Tunezja - Kairuan
  description: |-
    Tytuł oryginalny: Tańcząca ze światem
    PL, 2023
    Reżyseria: Piotr Poraj-Poleski
    W tym odcinku prowadząca zawita do świętego miasta islamu, Kairuan. Postara się dowiedzieć czegoś więcej o jednej z największych światowych religii monoteistycznych. Będzie robić tradycyjne słodycze Makrut i odwiedzi typowy islamski plac, gdzie tka się dywany kairuańskie.
  ageRating: 12
  subtitle: Program lifestylowo-podróżniczy, w którym prowadząca, Edyta Herbuś, pokazuje widzom piękno odwiedzanych miejsc.
  genre:
  - '35'
- eventId: 1018355
  start: 2026-09-26T01:40:00Z
  stop: 2026-09-26T02:40:00Z
  title: Ekstradycja 2 - odc. 2/9
  description: |-
    Tytuł oryginalny: Ekstradycja
    PL, 1996
    Reżyseria: Wojciech Wójcik
    Występują: Marek Kondrat, Maria Pakulnis, Paweł Wilczak, Piotr Fronczewski, Krzysztof Kolberger, Beata Tyszkiewicz
    Halski zaczyna współpracować z Piłatowem. Dzięki pomocy pana Henia i ekspertki współpracującej z Kulskim ustala, że w interesy z Iwanowem zamieszani są czołowi polscy politycy. Olgierd postanawia ujawnić wyniki swego dochodzenia prasie. Jednak jego rewelacje wywołują reakcję odwrotną do spodziewanej. Na Olgierda sypią się oskarżenia o współudział w przestępczych machinacjach. Padają pytania o związki jego siostry z rosyjską mafią.
  ageRating: 16
  genre:
  - '18'
  subtitle: Sabina wyjeżdża za granicę. Halski ujawnia prasie, że polscy politycy są uwikłani w interesy z mafią. Na rozkaz szefa Jurij zabija Nadieżdę i Sachara. Mafia wpada na trop Saszy Piłatowa.
