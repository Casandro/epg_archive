    Występują: Tomasz Piątkowski, Lea Oleksiak, Dariusz Wieteska, Kamil Wodka, Edyta Bełza, Anna Wysocka-Jaworska, Wojciech Zygmunt, Anna Wysocka, Amelia Radecka, Justyna Sieniawska
    Wanda grozi bronią kurierowi, którego wzięła za włamywacza. Benio jest w szoku. Banach opiekuje się studentką medycyny, która straciła przytomność w akademiku. Pacjentem ekipy Vicka jest licealista, który zaczął się dziwnie zachowywać i ma problemy z oddychaniem. Lekarz zauważa na plecach chłopaka ślad po urazie.
