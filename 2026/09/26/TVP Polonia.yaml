- eventId: 1018368
  start: 2026-09-26T03:05:00Z
  stop: 2026-09-26T03:35:00Z
  title: Na sygnale - odc. 668 "W cywilu nie ma życia"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Milena Dutkowska
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Anna montuje o poranku w domu ukrytą kamerę - by sprawdzić, co robi Czarek, gdy ona i Wiktor są w pracy. Na dyżurze lekarka jedzie ze swoim zespołem na basen - do nastolatka, u którego mogło dojść do wstrząśnienia mózgu - i zauważa przy okazji, że znajomy ratownik Rafał ma niepokojące objawy. Z kolei doktor Banach z Romkiem odpowiadają na wezwanie do wypadku i trafiają na agresywnego włóczęgę, który wyciąga nagle nóż - gotów do walki.
  ageRating: 12
  genre:
  - '23'
  subtitle: Anna montuje w domu ukrytą kamerę, by sprawdzić, co robi Czarek, gdy zostaje sam. Basia wychodzi ze szpitala i odwiedza Michała. Odkrywa, że jej ukochany zaginął.
- eventId: 1018369
