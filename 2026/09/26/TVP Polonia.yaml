  title: Podróże z historią s.II - Historia wśród fal
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Jak wygląda życie na morzu, na statku z prawdziwego zdarzenia? Radosław Kotarski sprawdza to na własnej skórze! Opowiada o codziennym życiu, przesądach i trudach pracy marynarzy pokonujących setki mil morskich. Porównuje historyczne polskie statki szkoleniowe do tych współczesnych i odkrywa zaskakującą prawdę. Zapraszamy na pokład polskiej legendy - Daru Młodzieży!
  genre:
  - '149'
  subtitle: Radosław Kotarski opowiada o codziennym życiu, o przesądach i trudach pracy marynarzy pokonujących codziennie setki mil morskich. Porównuje historyczne i współczesne jednostki szkoleniowe.
