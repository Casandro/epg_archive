  title: De publieke tribune
  subtitle: De Publieke Tribune van HUMAN valt op door zijn diepgang, rust en eigenzinnige keuze van onderwerpen. Elke zaterdagmiddag draait het om ervaringen, niet om meningen.
  description: In De Publieke Tribune hoor je elke zaterdagmiddag de meest indrukwekkende verhalen uit de haarvaten van de samenleving. Onder leiding van Coen Verbraak delen iedere week weer nieuwe gasten hun ervaringen over maatschappelijke onderwerpen die hen bezighouden of belemmeren in het dagelijks leven. Wilt u reageren op een van onze uitzendingen? Of heeft u zelf een tip of idee voor ons programma? Laat het dan vooral weten via <depublieketribune@human.nl> of stuur HUMAN een bericht via Instagram, Facebook of X. (2026)
- eventId: 1030295
  start: 2026-09-26T14:00:00Z
  stop: 2026-09-26T15:00:00Z
  title: Goed Ingelichte Kring
  description: 'In Goed Ingelichte Kring, een knipoog naar de radioklassieker Welingelichte Kringen, zet PowNed een panel van vijf prominenten aan tafel om in gesprek te gaan over de actualiteit en de luisteraar deelgenoot te maken van hun bijeenkomst. De panelleden zijn allen personen met bewezen expertise, die op hun vakgebied een bijzondere prestatie hebben geleverd. De herkenningsmuziek van Goed Ingelichte Kring is van de Franse 19e-eeuwse Louise Farrenc. Zij had een grote reputatie als componist, pianist, docent en auteur. Presentator Chazia Mourali: "Een vrouwelijke kunstenaar die ten onrechte door het grote publiek is vergeten, is voor altijd erelid van de Goed Ingelichte Kring!" (2026)'
