  title: dr Kelder en Co
  subtitle: Dr Kelder en Co, uw wekelijkse radiotherapie tegen hypes en hysterie.
  description: Dr Kelder en Co, uw wekelijkse radiotherapie tegen hypes en hysterie. Met gasten van wetenschappelijk allooi onderzoekt Jort Kelder opvattingen die in de media rondgaan op feitelijke onjuistheden, live vanuit de UvA op zaterdagmiddag tussen 13.00 tot 14.00 uur. Gesprekken op niveau waarbij rede en ratio de hoofdrol spelen. Wil je een uitzending van dr Kelder en Co bijwonen? Kom dan voor 12.45 uur naar het café van het Allard Pierson aan de Oude Turfmarkt 127-129 te Amsterdam. De toegang is gratis. Aanmelden is niet nodig, maar de deur sluit om 12.55 uur. (2026)
