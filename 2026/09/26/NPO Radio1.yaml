  title: De taalstaat
  subtitle: Is het wilden of wouden? De spits afbijten of het spits afbijten? Welke taal kwamen we deze week in de media tegen en welke Nederlandstalige plaat is zo mooi dat hij gedraaid moet worden?
  description: Is het wilden of wouden? De spits afbijten of het spits afbijten? Welke taal kwamen we deze week in de media tegen en welke Nederlandstalige plaat is zo mooi dat hij gedraaid moet worden? U hoort het in de Taalstaat, een vrolijk en informatief programma dat wil vertellen hoe het met onze taal staat. Presentator Ronald Giphart interviewt bekende schrijvers en dichters. Ingewikkelde taalkwesties worden beantwoord. En u kunt "vergeten" woorden insturen. Daarnaast vaste rubrieken zoals de Digitaalstaat en de TNA van een BN'er met taalwetenschapper René Appel. (2026)
