  description: 'Argos vertelt je al 30 jaar hoe de macht werkt. Achter de schermen van beleid, systemen en instituten onthullen we wat machthebbers liever verborgen willen houden. Altijd grondig, altijd nieuwsgierig, en altijd met een goed verteld verhaal. De onderzoeksjournalistiek van Argos is er in vele gedaanten: podcastseries, NPO Start-series, radio en TV. (2026)'
