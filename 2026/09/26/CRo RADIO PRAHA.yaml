  title: Host Lenky Vahalové
  description: Do studia tentokrát přijde zpěvačka Bára Basiková. V kinech je nový časosběrný dokument režisérky Heleny Třeštíkové, která Báru natáčela téměř 30 let. Co Báru v roce 1996 přesvědčilo, aby si filmový štáb pustila do svého soukromí? Plánovala nějakou citlivou scénu z dokumentu vystřihnout? Proč pro ni byl muzikál Jesus Christ Superstar tak zásadní? Moderuje Lenka Vahalová
- eventId:
