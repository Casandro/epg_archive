  - 1200191
  start: 2026-09-26T22:00:00Z
  stop: 2026-09-26T23:00:00Z
  title: Kriminálka
  description: 'Kriminálka speciál - Záznam ze setkání posluchačů pořadu se skutečnými legendami české kriminalistiky. Mirek Vaňura zpovídá někdejšího šéfa pražské mordparty Josefa Lottese, operativce Jana Štočka a kriminalistu Miroslava Hyhlíka. Připomínají legendární případy - například orlické vraždy, odhalení Ivana Roubala nebo dopadení vražedkyně Fabiánové - a přidají osobní postřehy z vyšetřování i méně známé okolnosti proslulých zločinů. Ředitel Muzea Policie Radek Galaš navíc prozradí, které případy, policejní spisy a kuriozity ve svých archivech ukrývají a jaké se rozhodli zveřejnit. "Kriminálka" na Dvojce touto speciální veřejnou nahrávkou děkuje posluchačům a zároveň startuje premiérovou čtvrtou sérii. Autor, dramaturgie: Dana a Mirek Vaňurovi.'
