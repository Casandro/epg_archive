  title: Soul Shift (8)
  subtitle: Planet der Primaten
  description: Tau-Blau, inzwischen zur normalen Seele degradiert, begibt sich auf Inkarnationsreisen auf die Erde. Sonnengelb merkt besorgt an, dass sein Freund zunehmend mitgenommener aussehe. Nach den katastrophalen Ereignissen auf der Erde und auf Conglom, breitet sich eine düstere Stimmung unter den Seelen aus. Vor den Portalen zu den Planeten kommt es zu Protesten. Glitzer und Spinell stellen entsetzt fest, dass Spinells Haus von Junkies eingenommen wurde, die von Zobelbrauns Emulsion abhängig sind. Und in der Zentrale der Erde wird festgestellt, dass immer mehr Seelen von ihren Inkarnationen nicht mehr zurückkommen und spurlos verschwinden.
