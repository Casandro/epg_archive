  title: Soul Shift (5)
  subtitle: Glückwunsch! Es ist ein Asteroid
  description: Auf der Erde hat es die Evolution bis zur Dinosaurier-Bevölkerung gebracht. In brutalen Auseinandersetzungen verfolgen wir die darwinistische Auslese, die den Stärksten überleben lässt. Tau-Blau rechtfertigt gegenüber Sonnengelb, dass diese Phase in absehbarer Zeit überwunden wird zugunsten einer hochentwickelten, friedfertigen Zivilisation. Verheerendes Unheil zeichnet sich ab, als die Steinmonster von Eisengrüns Conglom einen Asteroiden auf den Weg zur Erde schicken.
