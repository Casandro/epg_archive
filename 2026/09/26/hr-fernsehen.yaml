  title: Soul Shift (6)
  subtitle: Das Ende naht
  description: Die Evolutionsmanager präsentieren dem Allmächtigen den Zwischenstand der Evolution auf ihrem jeweiligen Planeten. Calendula mit den niedlichen, pinken Fellwesen und Abutilon mit seinen furchteinflößenden Aliens fallen beide beim Allmächtigen wegen mangelnder Fortpflanzungsfähigkeit durch. Tau-Blau will voller Stolz vom harmonischen und friedfertigen Stand seiner Dino-Bevölkerung berichten. Aber der Blick durch das geöffnete Weltenfenster zeigt die durch einen Asteroiden völlig zerstörte Erde. Tau-Blau verliert die Fassung und Intrigant Eisengrün kann vor Schadenfreude kaum an sich halten.
