  title: Soul Shift (7)
  subtitle: Degradiert und absorbiert
  description: 'Tau-Blau verliert nach der Verwüstung auf der Erde seinen Job. Der Planet Conglom ist beim Asteroiden-Feldzug vollständig pulverisiert worden. Um sicherzugehen, dass sein Mitwirken an der Intrige vertuscht wird, entscheidet sich der Allmächtige, Eisengrün zu absorbieren. Auf der zerstörten Erde kämpfen die letzten Echsen ums Überleben; der Planet steht kurz vor dem Aus. Bei Sonnengelb und Glitzer gibt es zum ersten Mal Streit: Sonnengelb akzeptiert ihren neuen Freund Spinell nicht, und so zieht die empörte Glitzer kurzerhand aus.'
