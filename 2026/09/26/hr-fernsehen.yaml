  title: Soul Shift (1)
  subtitle: Ein kleiner Steinling
  description: In der Zentrale des Allmächtigen, dem Herrscher über alle Seelen, wird die Entdeckung fünf neuer Planeten verkündet. Der Allmächtige beruft daher fünf Evolutionsmanager ein, die mithilfe der Seelen die Welten beleben sollen. Tau-Blau, der Held unserer Geschichte, bekommt die Erde zugeteilt - ein Planet, der am wenigsten vielversprechend ist. Wird er es schaffen, mit seinen Schöpfungen am besten abzuschneiden? Mithilfe seines Freundes Sonnengelb nimmt er die Herausforderung an.
