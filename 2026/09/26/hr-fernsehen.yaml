  title: Soul Shift (10)
  subtitle: Die Show muss weitergehen
  description: Tau-Blau absorbiert inzwischen alles Leben auf den verbliebenen Planeten. Sonnengelb, der Tau-Blau selbst als Gefahr erkannt hat, wird vom Allmächtigen überredet, Tau-Blau mit dem Allmachts-Zepter zu vernichten. Ein Treffen zwischen Sonnengelb und den anderen Evolutionsmanagern endet mit der Absorption der Beteiligten durch Tau-Blau. Wie wird der Kampf zwischen Tau-Blau und dem Allmächtigen ausgehen? Und wer wird als der Herrscher des Universums hervorgehen?
