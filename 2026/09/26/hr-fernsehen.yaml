  title: Deutschrap ideal
  subtitle: Kalim im Interview mit Simon
  description: 'In diesem Tribute-Interview erzählt Kalim, warum Xatar für ihn schon immer viel mehr als nur ein Rapper oder Labelchef war. Er erinnert sich an den Moment, als plötzlich das Telefon klingelte und einer seiner größten Idole ihn signen wollte. Für Kalim war sofort klar: AON ist das einzige Label, bei dem er unterschreiben will. Er erinnert sich daran, wie Xatar Künstlern geholfen hat, die kein Dach über dem Kopf hatten, wie er Menschen eine Plattform gegeben und eine ganze Generation von Migranten und Straßenrappern inspiriert hat. Gleichzeitig spricht Kalim auch über unbeantwortete Nachrichten und warum ihn das bis heute beschäftigt.'
