  title: Soul Shift (9)
  subtitle: Die Schatten
  description: Die Ereignisse überstürzen sich. Tau-Blau wird auf Befehl des Allmächtigen überwältigt und in die Schattenwelt transportiert. Auf der Suche nach der verschwundenen Glitzer wird Sonnengelb in Zobelbrauns höhlenartige Zentrale gelockt. An diesem Ort wird die Droge verbreitet, die Schuld am Verschwinden der süchtigen und willenlosen Seelen ist. Als Sonnengelb zu flüchten versucht, wird er überwältigt und in der Schattenwelt isoliert.
