  title: XATAR - Ein Leben ist nicht genug (3/3)
  subtitle: Baba aller Babas
  description: |-
    Nach seiner Haftentlassung wird alles, was Xatar anfasst, zu Gold. Er chartet mit zwei Alben auf Platz eins, entdeckt immer neue Top-Künstler und schließt einen Rekord-Deal mit einem New Yorker Musikkonzern ab. Mitten in Köln eröffnet Xatar anschließend den Goldmann Tower: sieben Etagen, 30 Mitarbeitende, in den ersten sechs Monaten sollen 100 Artists unter Vertrag genommen werden.
    Jetzt scheint alles möglich: Xatar betätigt sich auf immer neuen Geschäftsfeldern, während sein Leben von Fatih Akin fürs Kino verfilmt wird. Schon bald fordert das schiere Tempo von Xatars Leben seinen gesundheitlichen Preis.
