  title: 'Unforgettable: Zapisane w pamięci 1 (odc. 8)'
  subtitle: Carrie i Al są na tropie zabójcy adwokata. Wkrótce odkrywają, że sprawca planuje kolejną zbrodnię.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2011
    Reżyseria: John F. Showalter
    Występują: Poppy Montgomery, Dylan Walsh, Michael Gaston, Kevin Rankin, Daya Vaidya, Gillian Alexy
    Carrie Wells ma niezwykły dar zapamiętywania szczegółów otaczającej rzeczywistości. Bohaterka, która pracowała kiedyś w wydziale zabójstw, ponownie podejmuje współpracę z policją, a jej fenomenalna pamięć staje się kluczowym elementem wspierającym ją w prowadzeniu skomplikowanych śledztw.
  ageRating: 12
- eventId: 1019145
  start: 2026-09-26T17:20:00Z
  stop: 2026-09-26T18:15:00Z
  title: 'Unforgettable: Zapisane w pamięci 1 (odc. 9)'
  subtitle: Carrie i jej zespół mają przeprowadzić śledztwo w sprawie samobójczej śmierci licealistki. Carrie próbuje odnowić stosunki z ciotką Edie, słynną piosenkarką, która przyjechała do miasta w interesach.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2011
    Reżyseria: Paul Holahan
    Występują: Poppy Montgomery, Dylan Walsh, Michael Gaston, Kevin Rankin, Daya Vaidya, Derek Cecil
    Al i Carrie prowadzą śledztwo w sprawie zabójstwa nastolatka, który wydawał się nie mieć wrogów. W tym samym czasie Carrie szuka wsparcia u swojej ciotki, z którą nie utrzymuje kontaktu, aby pomogła w dochodzeniu dotyczącym morderstwa jej siostry.
  ageRating: 12
- eventId: 1019230
  start: 2026-09-26T18:15:00Z
  stop: 2026-09-26T19:20:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 1)'
  subtitle: Candice prowadzi dochodzenie w sprawie ataku na trenera rugby oraz próbuje dociec, kim jest dziewczynka, której liczne zdjęcia znaleziono w mieszkaniu ofiary. Oficjalnie trener nie miał dzieci.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Clara Antoons, Etienne Martinelli, Alexandre Ruscher, Paul Ruscher
    Candice prowadzi dochodzenie w sprawie ataku na trenera rugby. Kto mógł się dopuścić tak brutalnego ataku na powszechnie lubianego przez wszystkich człowieka? Dochodzenie początkowo wskazuje na osobę byłego gracza, usuniętego z drużyny za doping. Szybko jednak wychodzi na jaw, że ofiara skrywała przed wszystkimi wiele tajemnic dotyczących jej życia. Candice próbuje dociec, kim jest dziewczynka, której liczne zdjęcia znaleziono w mieszkaniu ofiary. Oficjalnie trener nie miał dzieci.
  ageRating: 16
- eventId: 1019231
  start: 2026-09-26T19:15:00Z
  stop: 2026-09-26T20:35:00Z
