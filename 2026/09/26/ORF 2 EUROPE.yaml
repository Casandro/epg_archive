  title: Universum - Die Show
  description: |-
    "Universum - die Show" lädt zum großen Primetime-Quiz. In der bildgewaltigen Familienshow bittet Moderatorin Mirjam Weichselbraun Natur- und Geschichtsfans zum spielerischen Duell. Das Konzept verspricht Hochspannung: Drei engagierte "Universum"-Fans kämpfen an der Seite prominenter Teamkapitäne um eine absolute Traumreise. Das TV-Studio verwandelt sich dafür in spektakuläre Erlebnislandschaften, basierend auf den Natur- und History-Dokumentationen des ORF.
    Folgende drei Duos treten in packenden Wissens- und Sortierrunden gegeneinander an:
    Team 1: Comedian Michael Mittermeier sorgt für die humorvolle Note am Ratepult. Er unterstützt Anna Reichenpfader, die gebürtig aus der Steiermark stammt und heute in Niederösterreich lebt.
    Team 2: Schauspielerin Hilde Dalik bringt vollen Einsatz für ihr Team. Sie geht gemeinsam mit Marius Schneider aus Niederösterreich auf Punktejagd.
    Team 3: Schilegende Fritz Strobl tauscht die Rennpiste gegen das TV-Studio. Er bildet ein starkes alpines Duo mit Brigitte Treichl-Krätschmer aus Tirol.
  genre:
  - '48'
