  title: 'betrifft: uns - Reportagen ohne Filter'
  subtitle: Kopftuch
  description: |-
    Warum gibt es so viel Streit um das Kopftuch?

    Seit mehr als zwei Jahrzehnten wird in Österreich über das Kopftuch diskutiert. Seit September gilt nun ein neues Kopftuchverbot für Schülerinnen unter 14 Jahren. Doch warum sorgt ein Stück Stoff in Österreich für so viel Streit?

    Marianne Puši? trifft in der neuen Folge von "betrifft: uns" Frauen mit ganz unterschiedlichen Erfahrungen und Positionen. Frauen, die das Kopftuch aus religiöser Überzeugung und Liebe tragen. Frauen, die Zwang erlebt und hautnah erfahren haben, welche Auswirkungen er haben kann. Und sie trifft Kritikerinnen, die darin ein Symbol patriarchaler Strukturen sehen und auch den Rückgang der feministischen Errungenschaften aus den 70er Jahren.

    Sehr oft wurde bei dieser Debatte über muslimische Frauen gesprochen, nicht mit ihnen. Doch wie erleben sie selbst diese Diskussionen, in der ihre Kleidung immer wieder zum politischen und gesellschaftlichen Streitpunkt wird? Marianne Puši? fragt nach religiöser Freiheit und Selbstbestimmung, nach Diskriminierung und Islamfeindlichkeit, aber auch nach familiärem Druck, Zwang und der Angst vor Radikalisierung.
    Die Reportage blickt auch darauf, wie sich der politische Umgang mit dem Kopftuch in Österreich entwickelt hat und was das neue Verbot für betroffene Mädchen bedeutet.
  genre:
  - '35'
