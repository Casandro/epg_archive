  title: Heimat zu verkaufen
  description: |-
    (Fernsehfilm, AUT/DEU 2010)
    Kinder, Familien, Frauen ganz besonders - alle lieben Max, Kärntner Hotelier mit Leib und Seele. Dann stellt die Bank den Kredit fällig und ein Finanzhai geht daran sein Hotel mit Seeblick zu schlucken. Der findige Max setzt sich zur Wehr und muss herausfinden, dass ausgerechnet seine neue Flamme auf der Seite des Feindes steht.
    Mit Fritz Hammel (Max), Ingrid Burkhard (Aloisia), Ulrike Beimpold (Maria), Hary Prinz (Vinzenz), Henriette Richter-Röhl (Sarah), Wolf Bachofner (Seewirt), Fritz von Friedl (Investor), Hartmut Becker (Investor), Stefan Paryla (Bankvorstand), Nikolaus Paryla (Beamter), Udo Schenk (Groth) u.a.
