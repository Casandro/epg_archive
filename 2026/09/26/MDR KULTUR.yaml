  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Ausstellung: \"Das Steinmetzhandwerk zwischen Tradition und Moderne\"\nDas Theater in Zwickau erkundet auf Robert Schumanns Spuren romantisch-deutsche Mythen.\nAnna Hoffmeister hat bei den Proben vorbeigeschaut.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:45 Uhr - Der Stichtag: 2006 Gerhard Behrendt gestorben\nMit dem Sandmännchen erfand Gerhard Behrendt eine der erfolgreichsten Figuren für das Fernsehen.\nVon Axel Rowohlt\n\n* 06:50 Uhr - Kulturtipp\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Neuer ARD-Podcast: Die Kaulitz-Story\nSie sind die wohl bekanntesten Zwillinge aus Magdeburg: Bill und Tom Kaulitz. Ihre Karriere war auch stets von Ausgrenzung, Hass und ständiger Selbstbehauptung geprägt - aufgezeigt im neuen ARD-Podcast \"die Kaulitz-Story\".\n\n* 07:30 Uhr - Medienschau mit Wetter & Verkehr\n\n* 07:45 Uhr - Leben mit Behinderung im Diakonissenhaus Borsdorf \nGemeinschaftlich leben und doch individuell: Wohnformen für Menschen mit Behinderungen.\nKristin Hendinger war im Diakonissenhaus Borsdorf\n\n* 07:50 Uhr - MDR KULTUR trifft...   Christian Waltenberg\nChristian Waltenberg ist Verbandschorleiter des Chorverbands Sachsen-Anhalt und musikalischer Leiter des Chors Carmina Mundi.\nVon Angelika Zapf\n\n* 08:00 Uhr - Nachrichten\n\n* 08:15 Uhr - Premiere: \"FASTNACHTS-LUST\" vom Hof Augusts des Starken\n\n* 08:30 Uhr - Feuilleton mit Wetter & Verkehr\n\n* 08:45 Uhr - Besser essen: Masterplan gegen Alzheimer?\nAlzheimer - für viele Menschen ist das eine der größten Ängste im Alter. Die Forschung geht inzwischen davon aus, dass sich ein erheblicher Teil des Demenzrisikos beeinflussen lässt durch einen besseren Lebensstil. Der Medizinjournalist Andreas Jopp beschreibt in seinem neuen Buch \"Masterplan gegen Alzheimer\", wie wir die Leistungen unseres Gehirns erhalten und sogar verbessern können. Seine These: Alzheimer ist kein Schicksal! Elvira Birgit Speer hat mit dem Buchautor gesprochen. \n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
