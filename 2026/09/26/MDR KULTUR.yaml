  title: MDR KULTUR Weltgeschichte vor der Haustür
  subtitle: Von Hartmut Schade und Conny Wolter
  description: "Am 3. Oktober 1226 starb einer der interessantesten und einflussreichsten Menschen des Mittelalters: Franz von Assisi.\n\n Der Sohn aus wohlhabendem Hause predigte ein Leben in Armut und im Einklang mit der Natur. \"Bruder Sonne, Schwester Mond\": das Sonnengebet des heiligen Franziskus inspiriert die Christenheit bis heute. \n\nDoch während die Armen und Mittellosen ihn verehrten, fühlte sich der hohe weltliche Klerus damals herausgefordert. Denn mit seiner Forderung, allem Besitz zu entsagen, stellte Franz die Grundsatz-Frage: \"Was für eine Kirche wollen wir und für wen soll die Kirche da sein?\" Und traf damit einen Nerv. \n\nRasch verbreitete sich der Orden der Franziskaner im gesamten abendländischen Europa. Dabei folgte auch manch hochgeborene Person dem heiligen Franziskus nach. So die Landgräfin auf der Eisenacher Wartburg, die später heiliggesprochene Elisabeth von Thüringen. Welche Spuren haben die Franziskaner in Mitteldeutschland hinterlassen? \n\nEs spricht Conny Wolter"
