  title: 'MDR KULTUR im Konzert: Dorflindenpop und Folk konzertant'
  description: "Tworna hat demnächst drei Konzerte. Doch vorher läuft bei MDR KULTUR das Konzert von Tworna vom Rudolstadt-Festival 2018, damals noch mit der ersten Sängerin dieser Band, Katherina Johannson. Frieder Zimmermann und Catherina Other gehören nach wie vor zu Tworna.\n\nDas Popfolktrio aus Sachsen, jetzt mit Jessica Jäckel (Waldzither und Gesang) können Sie bald live erleben, auch mit dem Liebeslied Kume, kum Geselle mîn.\nTworna in Graupa bei Dresden am 2. Oktober, am 17. Oktober beim NordfolkFestival in Hamburg und am 18. Oktober auf Schloss Goseck in Sachsen-Anhalt. \n\nAm Ende gibt es einige Volkslieder von Deitsch mit den Thüringer Symphonikern Saalfeld-Rudolstadt. \n\n\nEine Sendung von Grit Friedrich"
