  title: MDR KULTUR am Nachmittag
  description: "* 16:30 Uhr - Wetter & Verkehr\n\n* 16:45 Uhr - \"Fühlst du's?\" - Wie Jugendliche Correggios Bilder sehen\nWie kann man Jugendliche für Gemälde Alter Meister begeistern, die schon vor Jahrhunderten entstanden sind? Die Staatlichen Kunstsammlungen Dresden haben Schülerinnen und Schüler der Universitätsschule in Dresden im Rahmen der Correggio-Ausstellung eingeladen, selbst eine Ausstellung dazu zu entwickeln. Entstanden ist im Semper-Kabinett der Gemäldegalerie Alte Meister die Sonderausstellung \"Fühlst du's?\" - als junger Blick auf die Alten Meister. Heike Schwarzer hat die Jugendlichen getroffen.\n\n* 17:00 Uhr - Nachrichten\n\n* 17:05 - 18:00 MDR KULTUR Spezial Musik mit Tobias Kluge\nDie Musikredakteure von MDR KULTUR stellen Neuerscheinungen aus dem aktuellen Musikmarkt vor. \nDie Auswahl reicht von Jazz, Pop, Weltmusik und Chanson bis Folk und Elektronik.\n\nUnter anderem mit diesen Alben:\n\n* Lotte: Lotte\n* Donata: Strength\n* Beck: Ride Lonesome\n* Oskar Haag: Lost Cause\n* Danger Dan: Keine Angst\n* Kings of Leon: Oh My Beloved\n* Danielle Ponder: Everything Has Changed"
