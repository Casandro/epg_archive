  title: MDR KULTUR am Mittag
  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Autonomie: Jahresthema der Leopoldina\nAutonomie und unsere Gesellschaft - nach der Leopoldina-Jahrestagung\nIm Gespräch mit Kognitionswissenschaftler Bernhard Hommel\n\n* 12:30 Uhr - Wetter & Verkehr\n\n* 12:45 Uhr - Kulturtipps\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Deutsches Fotomuseum in Markkleeberg schließt\nDas Deutsche Fotomuseum Markkleeberg schließt an diesem Wochenende seine Pforten.\nUlrike Thielmann war vor Ort.\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:4o Uhr - Das Lucas Museum für Narrative Art hat eröffnet\nIn Los Angeles hat das Lucas Museum für Narrative Art geöffnet - was übersetzt so viel wie Erzählkunst \nbedeutet - gemeint sind damit Bilder, die Geschichten erzählen. Star Wars Regisseur George Lucas plant das Projekt seit Jahren, und macht dort jetzt Teile seiner Privatsammlung für die Öffentlichkeit zugänglich.\nAntje Sieb war vor Ort.\n\n* 13:5o Uhr - MDR KULTUR bei ARD Sounds: Dresden und Italien. Eine Liebe nicht nur im Herbst\nDie berühmte \"Madonna des Heiligen Sebastian\" des italienischen Renaissancemeisters Antonio Allegro, besser bekannt als \"Correggio\" befindet sich im Besitz der Galerie Alte Meister in Dresden und wurde in vierjähriger Restaurierungsarbeit in der Schauwerkstatt der Galerie von Staub und Ablagerungen der Zeit befreit. Und nun erstrahlt das Altarbild des für seine besonderen Farbeffekte berühmten Correggio wieder in voller Schönheit."
- eventId: 542507
  start: 2026-09-26T12:00:00Z
  stop: 2026-09-26T14:00:00Z
  title: MDR KULTUR am Nachmittag
  description: "* 14:00 Uhr - Nachrichten\n\n* 14:10 Uhr - Die großen Fragen: \"Welchen Medien vertrauen wir und warum?\"\nWir alle ticken anders beim Medienkonsum. Junge und Alte, Männer und Frauen, Fußballfans werden auch eher die Sportschau gucken als hardcore Angler. Wissenschaftsjournalist Karsten Möbius hat sich mit der Frage beschäftigt, wie unsere Sicht auf die Welt unser Urteil auf Medien beeinflusst. Also: Welchen Medien vertrauen wir und warum?     \n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr -  Was alle Sprachen verbindet\nÜber die Komplexität von Sprachen, die Frage, was Universalien sind im Zusammenhang mit Fremdsprachen, und was alle Sprachen verbindet, nämlich das Wort \"Mama\" -  dazu im Gespräch ist Julia Nestlen mit dem Linguisten Johann-Mattis List. \n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - MDR KULTUR Fragebogen an Andreas Dresen\nAndreas Dresen gehört schon seit langem zu den wichtigsten deutschen Regisseuren, Filme wie \"Halbe Treppe\", \"Wolke 9\" oder \"Halt auf freier Strecke\" haben den genauen Beobachter und einfühlsamen Geschichtenerzähler auch international bekannt gemacht. Sein neuer Film \"Alte Liebe\" kommt im Oktober in die deutschen Kinos.\nVon Knut Elstermann\n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:40 Uhr - Sonderausstellung in Bonn: Beethoven by Warhol\nDer US-amerikanische Künstler Andy Warhol gilt als Ikone der Pop-Art. Er ist vor allem mit seinen bunten Darstellungen von Alltagsgegenständen bekannt geworden, aber auch durch seine Porträts. Und eines davon ist kurz vor seinem Tod im Jahr 1987 entstanden. Darauf zu sehen: Ludwig van Beethoven nach dem historischen Porträt von Joseph Karl Stieler. Das Original hängt im Bonner Beethoven-Haus, wo jetzt eine neue Sonderausstellung eröffnet worden ist: \"Beethoven by Warhol\" heißt sie. \nJan Ritterstaedt hat sich die neue Ausstellung angeschaut.\n\n* 15:50 Uhr - Ergebnisse Thüringer Studie: Christen und Wehrdienstverweigerung in der DDR\nChristen in der DDR sind diskriminiert worden - zum Bespiel, wenn sie den Kriegsdienst verweigerten oder als Jugendliche gegen die Wehrerziehung protestierten. Wie das SED-Regime in solchen Fällen gegen Christen vorging, das hat eine Studie untersucht, die von 2020 bis 2023 an der Universität Jena erstellt wurde. \nIm Gespräch Christopher Spehr"
