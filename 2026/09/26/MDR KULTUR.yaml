  title: MDR KULTUR Diskurs
  subtitle: Der Linguist Johann-Mattis List im Gespräch mit Julia Nestlen
  description: Wenn es weh tut, sagt man "au", "ah" oder "ai" - praktisch überall auf der Welt. Die Wörter für die eigene Mutter haben in allen bekannten Sprachen einen "m"-Laut. Die Forschung kennt viele solcher sprachlichen Universalien. Was folgt daraus für die Natur der Sprache und des Sprechens? Julia Nestlen im Gespräch mit dem Linguisten Johann-Mattis List.
