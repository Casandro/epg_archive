  title: Jihočeši
  description: Profesní kariéru odstartovala Lenka Vlachová po maturitě na střední pedagogické škole umístěnkou na učiliště a základní školu ve Větřní. Dálkově pak vystudovala na Karlově univerzitě obor speciální pedagogika. Po listopadu 1989 začala pracovat pro Mezinárodní hudební festival Český Krumlov, pak působila například v Bruselu v diplomatických službách pro Středočeský kraj. Povídala si s ní Mirka Nezvalová.
