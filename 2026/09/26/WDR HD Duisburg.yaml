  title: Die Sendung mit dem Elefanten
  subtitle: Wie baut eine Spinne ihr Netz?
  description: "In den Lach- und Sachgeschichten wird heute ganz genau hingeschaut. André zeigt, wie man aus einem Bogen Papier eine stabile Brücke baut. Eine kleine Spinne webt mit viel Fleiß ein Netz und die Kamera ist ganz nah dabei. Petzi und seine Freunde finden eine Brille und suchen nach ihrem Besitzer, der sie bestimmt schon vermisst. Und die Schnecken zeichnen heute wieder ein Schleimspurbild auf die Straße. Was, das wird noch nicht verraten. \n\nDie Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder."
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
