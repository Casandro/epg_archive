  stop: 2026-09-26T10:00:00Z
  title: Knižní pól
  description: Setkání s knihami napříč prostorem a časem. Ze své knihovny vybírá básník, publicista a překladatel z polštiny Bogdan Trojak. Pořad připravil Petr Šrámek.
- eventId: 1192019
  start: 2026-09-26T10:00:00Z
  stop: 2026-09-26T10:05:00Z
  title: Zprávy
- eventId: 1192020
  start: 2026-09-26T10:05:00Z
  stop: 2026-09-26T11:30:00Z
  title: Polední koncert
  description: Nová sezóna a sólisté Janáčkovy filharmonie Ostrava (1/2). Flétnistka Zofia Neugebauer, houslistka Alena Baeva, klavíristka Anna Vinnitskaya a violoncellista Johannes Moser ve skladbách W. A. Mozarta, L. van Beethovena, F. Chopina a É. Lalo. Připravila Renáta Spisarová a Tvůrčí skupina Hudba.
- eventId: 1192021
  start: 2026-09-26T11:30:00Z
  stop: 2026-09-26T12:00:00Z
  title: Povídka
  description: 'Jaromír Tomeček: Vlkodlak. Pro rozhlas upravil Jaromír Šlosar. Čte Stanislav Šárský. Režie Tomáš Jirman. Natočeno v roce 1996 (29 min).'
- eventId: 1192108
  start: 2026-09-26T12:00:00Z
  stop: 2026-09-26T13:00:00Z
  title: Staří mistři
  description: Hudli za Havla. Které světové ansámbly orientované na "early music" se představily v Praze za časů prezidentování Václava Havla? Jak bohatá epocha to byla na koncerty průkopníků autentické interpretace? Napoví Akademie Svatého Martina v polích, Ensemble Villancico, Circa 1500, Fretwork a další. V rámci projektu Slyšet Havla připravil a uvádí Vojtěch Babka.
- eventId: 1192109
  start: 2026-09-26T13:00:00Z
  stop: 2026-09-26T14:40:00Z
  title: Sobotní drama
  description: 'Václav Havel: Vyrozumění. Hra o moci jazyka, o jazyku moci, ale především o moci. Rozhlasová adaptace jedné z nejznámějších her Václava Havla. Hudba Jiří Strohner. Dramaturg Martin Velíšek. Režie Lukáš Hlavica. Účinkují: Martin Myšička, Ivan Trojan, Martha Issová, David Novotný, Václav Neužil, Stanislava Jachnická, Lenka Krobotová, Jan Přeučil, Jiří Knot, Jaroslav Plesl a Jan Vondráček. Natočeno v roce 2013.'
- eventId: 1192110
  start: 2026-09-26T14:40:00Z
  stop: 2026-09-26T15:00:00Z
  title: Josef Vejvoda & Karel Růžička
  description: Závody na kolonádě & Medové koláčky. Koncertní záznam dvou skladeb z jeskyně Balver Höhle v Německu ze dne 26. 6. 1976. Hraje a zpívá Jazz Cellula.
- eventId: 1192212
  start: 2026-09-26T15:00:00Z
  stop: 2026-09-26T15:40:00Z
  title: Promyslet Havla
  description: Pravda. Je Havlova představa života v pravdě přežitá, nebo dokonce mrtvá? Jak dnes obstojí jeho pojetí autenticity z úhlu politické filozofie, současné etiky a jazyka? To rozebírají Tomáš Koblížek a Matěj Cíbik v rozhovoru s moderátorkou Karolínou Koubovou.
- eventId: 1192213
  start: 2026-09-26T15:40:00Z
  stop: 2026-09-26T16:00:00Z
  title: Václav Havel a Eva Olmerová
  subtitle: Různá setkání Václava Havla se zpěvačkou Evou Olmerovou. Připravil a uvádí Václav Vraný.
- eventId: 1192214
  start: 2026-09-26T16:00:00Z
  stop: 2026-09-26T16:30:00Z
  title: Jazzový podvečer
  description: Jazzové principy napříč hudebními žánry s Otakarem Svobodou. Každou sobotu uvádí Otakar Svoboda.
- eventId: 1192215
  start: 2026-09-26T16:30:00Z
  stop: 2026-09-26T17:00:00Z
  title: Četba na pokračování
  description: 'Bohumil Hrabal: Obsluhoval jsem anglického krále (11/14). Román českého prozaika, esejisty a básníka líčí od dvacátých do padesátých let 20. století, tedy v době velkých politických zvratů, životní dráhu číšníka Jana Dítěte, později hoteliéra a nakonec cestáře. Pro rozhlas připravil Jiří Červenka. Účinkuje Ladislav Mrkvička. Režie Markéta Jahodová (28 min). Natočeno v roce 2004.'
- eventId: 1192216
  start: 2026-09-26T17:00:00Z
  stop: 2026-09-26T18:00:00Z
  title: Sedmé nebe
  subtitle: s Jakubem Königem. Osobnosti české hudební scény vybírají a komentují hudbu svého srdce.
- eventId: 1192339
  start: 2026-09-26T18:00:00Z
  stop: 2026-09-26T21:00:00Z
  title: Operní večer
  description: 'Petr Iljič Čajkovskij: Piková dáma. Získá mladý důstojník tajnou formulku k pohádkovým výhrám v kartách? Tříaktovou operu na libreto podle Puškina uvádíme na vzácné nahrávce ze Smetanova divadla v Praze v roce 1973, kdy ji v rámci Pražského jara sehrál ansámbl Velkého divadla v Moskvě s dirigentem Jurijem Simonovem. V hlavních rolích účinkují Andrej Fedosejev, Vladimir Atlantov, Tamara Milaškina, Larisa Avdějeva, Jurij Grigorjev a další. Připravil a uvádí Vojtěch Babka.'
- eventId: 1192474
  start: 2026-09-26T21:00:00Z
  stop: 2026-09-26T21:30:00Z
  title: Četba s hvězdičkou
  description: 'Jack Black: Nemáte šanci (10/10). Strhující autobiografie tuláka a lupiče zaznamenává třicet let na cestě americkým podsvětím počátku dvacátého století. Bestseller, který ovlivnil celou generaci beatniků. Připravila Petra Hynčíková. Překlad Tomáš Míka. Účinkuje Tomáš Drápela. Režie Jakub Doubrava. Natočeno v roce 2022 (28 min).'
- eventId: 1192475
  start: 2026-09-26T21:30:00Z
  stop: 2026-09-26T22:00:00Z
  title: Soudobá hudba
  description: 'Franziska Wilhelm (2003): Diametralspiele. - Petr Cígler (1978): Echolocations pro pět hráčů na bicí. Ostravskou bandu a sólisty sekce bicích nástrojů diriguje Jiří Rožeň a Bruno Ferrandis. Připravila Renáta Spisarová.'
