- eventId: 1191828
  start: 2026-09-26T04:00:00Z
  stop: 2026-09-26T06:00:00Z
  title: Partitury
  description: 'P. I. Čajkovskij: Symfonie č. 3 D dur op. 29. Hraje Státní filharmonie Brno, řídí František Jílek. - Antonín Dvořák: Legendy pro orchestr op. 59 (výběr). Hraje Státní filharmonie Brno, řídí Jiří Pinkas. - Antonín Rejcha: Fugy pro klavír op. 36 (výběr). Hraje Milan Langer. - F. V. Kramář: Koncert pro klarinet a orchestr č. 3 e moll op. 86. Hraje Emil Drápela a Státní filharmonie Brno, řídí Leoš Svárovský. - Václav Pichl: Divertimento C dur. Hrají Hana Bartoníková (hoboj), Emil Drápela (klarinet) a Roman Novozámský (fagot). (Brno)'
- eventId: 1191898
  start: 2026-09-26T06:00:00Z
  stop: 2026-09-26T06:05:00Z
  title: Víkendová příloha
  description: Kulturně-publicistický týdeník. 180 minut reportáží, rozhovorů, glos, fejetonů, dokumentů, literárních ukázek a hudby jazzové i vážné připravila a uvádí Milena M. Marešová.
- eventId: 1191899
  start: 2026-09-26T06:05:00Z
  stop: 2026-09-26T06:20:00Z
  title: Esej
  description: 'Eugéne Delacroix: Deník. Fragmenty z deníkových záznamů francouzského malíře. Z překladu Věry Smetanové připravil Petr Turek. Účinkuje Ivan Řezáč. Režie Natália Deáková (12 min). Natočeno v roce 2013.'
- eventId: 1191900
  start: 2026-09-26T06:20:00Z
  stop: 2026-09-26T06:30:00Z
  title: Katedrála, jak ji neznáte 14/15
  description: Prizmatem Julia Zeyera a Jiřího Karáska ze Lvovic na Bílkův Krucifix. Postupem doby se stala, bez ohledu na její duchovní obsah i funkci, celonárodním symbolem a pražskou dominantou, přesto všeobecně vyznívá jako architektonická ikona, o níž máme průměrné znalosti. Cyklus Mariuse Winzelera a Ivana Hartmanna se pokusí přiblížit pražský Svatovítský chrám běžnému návštěvníkovi coby model světa a vesmíru, tak, jak by ho sám pro sebe neobjevil a marně by našel smysl některých částí.
- eventId: 1191901
  start: 2026-09-26T06:30:00Z
  stop: 2026-09-26T07:20:00Z
  title: Vitraje aneb Cítit světlo 3/3
  description: Skrze okna středověkých katedrál - jejich skleněné výplně připomínaly zářící drahokamy - sestupovala nebeská krása na zem, k věřícím. Vitráže byly nezbytnou součástí sakrální architektury, působily na široké publikum nejen coby informace, živé obrazy čerpající z náboženských textů i z každodenního života, ale především jako "zázračné prostředí" ovlivňující city člověka. Za tajemstvím vitráží (vitrají) se za odborníky i uměleckými řemeslníky vydáme s Janou Davidovou Kracíkovou.
- eventId: 1191902
  start: 2026-09-26T07:20:00Z
  stop: 2026-09-26T08:05:00Z
  title: O talentu a radosti
  description: S potěšením objevujeme a opěvujeme mladé talenty. Méně uvažujeme například o "bedrech" jejich rodičů. Osmiletý akordeonista Ládík už má na svém "kontě" nemalý počet cen ze soutěží doma i v zahraničí. A ukazuje se, že talentů má vícero. S Ládíkem a jeho maminkou, Nikolou Lipowskou, natáčela Eva Ocisková.
- eventId: 1191903
  start: 2026-09-26T08:05:00Z
  stop: 2026-09-26T09:00:00Z
  title: V měsíčním svitu
  description: O stejnojmenné výstavě českých výtvarníků Martina Salajky a Jaroslava Valečky a fotografky Kristýny Erbenové v galerii Czech China. Contemporary (CCC) v prestižní umělecké čtvrti Sung-čuang na východním předměstí Pekingu. Budovu této unikátní česko-čínské instituce zaměřené na kulturní výměnu mezi Evropou a Asií navrhl český architekt Zdeněk Fránek. Vedle umělců, kteří v galerii CCC vystavovali, v pořadu mluví její zástupce sinolog a malíř Jiří Straka a kurátorka výstavy Veronika Marešová. Pořad připravil Jiří Kamen.
- eventId: 1192017
  start: 2026-09-26T09:00:00Z
  stop: 2026-09-26T09:30:00Z
  title: Jazzové dopoledne
  subtitle: Klasický jazz od New Orleans až po swing. Připravil a uvádí Jan Pospíšil.
- eventId: 1192018
