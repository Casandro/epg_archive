  title: Zelný rynk
  description: Kulturní magazín Zelný rynk tentokrát připravila a moderuje Eva Schulzová. Přinese Malou úvahu o střetu zájmů, kterou napsal Petr Šotnar a čte Michal Bumbálek. Zazní reportáž z uvedení nového televizního cyklu Literární místopis. V brněnském studiu České televize jej připravily dramaturgyně Nora Obrtelová se scenáristkou Markétou Sárou Valnohovou. V režii Petra Smělíka cyklem provází Jaroslav Rudiš. Četba z knihy Jany Soukupové Brněnské mordy pokračuje sedmou částí. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. A připomeneme 140. výročí narození malíře Jindřicha Pruchy.
