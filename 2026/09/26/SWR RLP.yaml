- eventId: 1155591
  start: 2026-09-26T11:45:00Z
  stop: 2026-09-26T12:50:00Z
  title: Olympia für Deutschland
  subtitle: Berlin, KölnRheinRuhr oder München - wer geht ins Rennen?
  description: |-
    Heute wird gegen 13.45 Uhr in Baden-Baden verkündet, ob NRW oder München sich für die Olympischen Sommerspiele 2036, 2040 oder 2044 bewerben darf. Die Entscheidung fällt die Mitgliederversammlung des Deutschen Olympische Sportbundes (DOSB). Die Gewinnerregion oder -stadt muss sich dann gegen die internationale Konkurrenz durchsetzen.
    Erst ab 2029 entscheidet das Internationale Olympische Komitee (IOC), wo die Spiele von 2036 bis 2044 stattfinden werden. Die Sendung stellt die Konzepte aller Bewerber vor und fängt in Live-Schalten die Stimmung überall vor Ort ein - sowohl vor der Verkündung als auch direkt nach der Entscheidung.
