  description: Eine Gefängnistherapeutin soll versucht haben, die Ehefrau eines Ex-Patienten zu erschießen - sie soll krankhaft in den ehemaligen Häftling verliebt sein. Wollte sie seine Frau wirklich aus dem Weg räumen, um freie Bahn zu haben? Oder konnte ihr Ehemann es nicht ertragen, dass sie einen neuen Liebhaber hat?
