  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Thailand, Phuket
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Fahrt über den Golf von Bengalen war sportlich, aber jetzt liegt die atemberaubende Südküste Thailands mit der Postkarteninsel Phuket vor den Augen der Crew. Auf dieser Etappe wird die Mannschaft von Olivier Guy begleitet. Er ist Techniklehrer und großer Lowtech-Fan. Der Katamaran "Nomade des Mers" ankert vor Phuket-Stadt.
    Thailand ist nicht nur ein beliebtes Reiseziel, sondern auch der weltweit größter Produzent von Speiseinsekten. Insekten sollen die Nahrung der Zukunft sein, das ihre Zucht wenig Platz und Ressourcen benötigt.
