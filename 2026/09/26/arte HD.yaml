  title: Don Juan, tot und lebendig
  subtitle: Frankreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Abenteurer, Schürzenjäger, Frauenheld: Don Juan durchzieht als Figur die europäische Literatur- und Musikgeschichte. Während der Verführer im 19. Jahrhundert noch positiv gesehen wurde, wird sein Frauenbild spätestens seit #MeToo kritisch hinterfragt. Mozarts "Don Giovanni" oder Molières "Don Juan" ziehen immer noch das Publikum in ihren Bann. Woher kommt die anhaltende Faszination?'
