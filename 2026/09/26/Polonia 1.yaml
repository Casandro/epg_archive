  description: Tajemniczy kamień zwany Dokuro dawno temu połamał się na kawałki rozrzucone po całej Ziemi. Podobno artefakt ma moc ujawnienia lokalizacji największego złoża złota na świecie. Dokurobei pragnie skompletować cały kamień i bierze do pomocy bandę Drombo, której obiecuje część skarbu. Przed każdą wyprawą Dronio, Boyakki i Tonzler zakładają kolejny przestępczy biznes, aby zebrać fundusze na nowego robota bojowego. Poszukiwania artefaktu nie są bowiem łatwe; informacje od Dokurobeia są często błędne, a na dodatek w pogoni za nimi bierze udział prawy duet zwany „Yattaman”.
