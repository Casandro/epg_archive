  title: 'LEGENDÄR: Unsere Schlagerhits der 90er - Die Countdown-Show'
  subtitle: Die 25 größten Schlager der 90er mit Musik und Gästen!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Verdammt, ich lieb'' dich" oder "Herzilein", so heißen zwei der unvergessenen Schlagerklassiker der 90er Jahre. Stars von Wolfgang Petry bis Michelle starten in diesem Jahrzehnt mit ihren Hits in eine Karriere, die bis heute anhält! In unserer Countdown-Show begibt sich eine prominente neunköpfige Jury aus Showbiz und Entertainment auf eine Zeitreise in die Schlagerwelt der 90er.'
- eventId: 555187
  start: 2026-09-26T19:45:00Z
  stop: 2026-09-26T21:15:00Z
  title: Die verrückten 90er - Das Turbo-Jahrzehnt der Deutschen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Es geht alles rasend schnell; kaum ist die Mauer gefallen, wird die ehemalige DDR vom Westen aus "bundesrepublikanisiert": mit D-Mark, mit wummernden Techno-Beats, schriller Mode und seltsamen Körperbemalungen, die man nicht mehr abwaschen kann. In den 90ern jagt ein epochemachender Trend den anderen. Die verrückten 90er haben aber leider noch mehr zu bieten: Während im Nahen Osten der Golfkrieg tobt - dem andere folgen werden -, kriechen aus diversen Löchern Neonazis hervor. Der WDR lässt die 90er Jahre noch einmal Revue passieren. Jahr für Jahr durch ein Jahrzehnt.'
- eventId: 556540
  start: 2026-09-26T21:15:00Z
  stop: 2026-09-26T22:45:00Z
  title: Klammerblues, Kuschelrock und Herzschmerz
  subtitle: Rockballaden und ihre Geschichten
  genre:
  - '97'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wer erinnert sich nicht an die Partys der Jugend? Anfangs wurde wild getanzt, doch der Abend erreichte seinen Höhepunkt, wenn der Klammerblues aufgelegt wurde - ob als Schallplatte oder CD. Eng umschlungen schwebten die frisch Verknallten zur melancholischen Stimmung von Rockballaden über die Tanzfläche.
    In einer emotionalen Zeitreise präsentieren und kommentieren prominente Gäste ihre ganz persönlichen Lieblings-Rockballaden. Mit dabei: Marco Schreyl, Janine Kunze, Dirk Budach, Ann-Kathrin Kramer, Sonya Kraus, Lisa Ortgies, Frauke Ludowig, Peter und Stephan Brings sowie Christine Sommer und Martin Brambach.
