  title: Podróże z historią 4 (odc. 7)
  subtitle: Radosław Kotarski opowie o mennonitach, którzy przez kilka wieków mieszkali na ziemiach polskich. Ich kultura i budowle wzbogaciły krajobraz Żuław i terenów położonych blisko Wisły.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Od wieków na polskich ziemiach mieszkała niesamowicie ciekawa społeczność, którą nazywano mennonitami. Przez całe stulecia wzbogacała swoją kulturą oraz budowlami krajobraz Żuław i terenów położonych blisko Wisły. Dlaczego przybyli do Polski? Co sprawiło, że nieustannie musieli walczyć z powodziami? Jak radzili sobie z żuławską depresją? Na te pytania odpowie Radosław Kotarski w najnowszym odcinku "Podróży z historią".
  genre:
  - '149'
- eventId: 1019403
  start: 2026-09-26T01:30:00Z
  stop: 2026-09-26T02:00:00Z
  title: 'Stacja Arktyka: Co mieszka w lodzie?'
  subtitle: Wyprawa na biegun to jedna z najbardziej skomplikowanych operacji naukowych. Życie kilka tygodni na odludziu i poświęcenie się bez reszty badaniom naukowym to historia, którą chcemy opowiedzieć i pokazać.
  description: |-
    Tytuł oryginalny: Stacja Arktyka
    PL, 2023
    Reżyseria: Sambor Wilk
    Arktyczne wyprawy należą do najbardziej skomplikowanych operacji naukowych. Od naukowców wymaga się poświęcenia bez reszty badaniom oraz życia na kompletnym odludziu. Serial zaprezentuje widzom, jak wygląda życie w Arktyce i jak się do niego przygotować. Poza tym twórcy opowiedzą o początkach polskiego polarnictwa.
  ageRating: 12
  genre:
  - '35'
