  title: Archivschätze
  subtitle: 80 Jahre Hessen/ Zur Geschichte der Frankfurter Buchmesse
  description: 'Frankfurter Buchmesse 1949. Peter Suhrkamp, Ernst Rowohlt und Kurt Desch diskutierten: preiswerte Taschenbücher oder lieber die hochwertige gebundene Ausgabe? Zu wenige Leserinnen und Leser? Krise des Buches? Kann Literatur aus dem Ausland Lücken füllen? Die Verleger dreier großer Verlage sprachen über den deutschen Buchmarkt, das Kaufverhalten des Lesepublikums und die aktuellen Themen der Literatur.'
