  title: Aus den Archiven
  description: |-
    Sophie Scholl und die "Weiße Rose"
    "Man muss etwas tun und zwar heute noch!"
    Von Eva-Maria Bohle
    Deutschlandsender Kultur 1991
    Vorgestellt von Isabella Kolar

    Am 22. Februar 1943 wurden die Geschwister Hans und Sophie Scholl in München von Nationalsozialisten hingerichtet. Die beiden Mitglieder der Widerstandsgruppe "Weiße Rose" hatten Flugblätter gegen den Nationalsozialismus verteilt. Das Feature zeichnet anhand von Briefen und Tagebucheintragungen das Leben der Sophie Scholl und ihre Entwicklung zur Widerstandkämpferin in der "Weißen Rose" nach.
