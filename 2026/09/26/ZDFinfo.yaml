- eventId: 813915
  start: 2026-09-26T05:00:00Z
  stop: 2026-09-26T05:45:00Z
  title: Faszination Weltall
  subtitle: Die Milchstraße
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien 2022
    Die Milchstraße, unsere Heimatgalaxie, ist ein schwaches Lichtband, das sich über den Nachthimmel zieht. Schon die alten Griechen haben davon geträumt, ihre Geheimnisse zu verstehen.

    Nach Kollisionen mit anderen Galaxien entwickelte sich die Milchstraße in zahllosen Wachstumsschüben. Seit Kurzem können wir dank modernster Weltraumteleskope ihre dramatische Geschichte enthüllen. Und auch ihre katastrophale Zukunft vorhersagen.
    HD-Produktion
- eventId: 815495
  start: 2026-09-26T05:45:00Z
  stop: 2026-09-26T06:30:00Z
  title: Faszination Weltall
  subtitle: Fremde Welten
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien 2022
    Die große Frage: Sind wir allein im Universum, oder gibt es irgendwo anders Leben? Unsere Teleskope durchkämmen das All. Entdecken bizarre Welten. Werden wir jemals eine zweite Erde finden?

    In den letzten 50 Jahren sind unsere Raumsonden zu jedem Planeten des Sonnensystems vorgedrungen. Beweise für außerirdisches Leben gibt es keine. Die Erkundung geht weiter. Neue Missionen erforschen nun Exoplaneten, die außerhalb unseres Sonnensystems liegen.
    HD-Produktion
- eventId: 815496
  start: 2026-09-26T06:30:00Z
  stop: 2026-09-26T07:13:00Z
  title: Faszination Weltall
  subtitle: Die Sonne
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien 2022
    Die Sonne - vertraut und doch unbekannt. Sie ist die Königin unseres Sonnensystems und Herrscherin über Masse und Energie. Wir beginnen gerade erst, die Sonne aus der Nähe zu erforschen.

    Unsere Sonne gehört zu einer langen Linie von Sternen, die bis in den Anfang der Zeit zurückreicht. Von den ersten Blauen Riesen, die das Universum erhellten, über spätere Generationen, deren Sterben den Kosmos mit den Elementen des Lebens anreicherte.
    HD-Produktion
