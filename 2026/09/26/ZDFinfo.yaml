- eventId: 815498
  start: 2026-09-26T07:15:00Z
  stop: 2026-09-26T08:00:00Z
  title: Faszination Weltall
  subtitle: Der Urknall
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien 2022
    Von unserem kleinen Planeten aus machen wir uns auf, das Universum zu erforschen. Auf der Suche nach Antworten auf große Menschheitsfragen: Wie fing alles an? Gab es etwas vor dem Urknall?

    Hochmoderne wissenschaftliche Missionen führen zurück an den Anfang: 13,8 Milliarden Jahre in die Vergangenheit, zum Ursprung des Universums. Weltraumteleskope wie Hubble und Planck helfen, den Moment des Urknalls zu bestimmen und die Geschichte des Kosmos zu erzählen.
    HD-Produktion
- eventId: 817300
  start: 2026-09-26T08:00:00Z
  stop: 2026-09-26T08:45:00Z
  title: Faszination Weltall
  subtitle: Schwarze Löcher
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien 2022
    In der Dunkelheit des Universums lauern Schwarze Löcher. Es sind unsichtbare Orte, an denen die Schwerkraft so stark ist, dass nichts entkommen kann und sich sogar Raum und Zeit verformen.

    In der Milchstraße wimmelt es von Hunderten von Millionen Schwarzer Löcher. Sie kreisen zwischen den Sternen. Und im Zentrum unserer Galaxie liegt ein Riese, ein supermassereiches Schwarzes Loch, Millionen Mal schwerer als seine kleineren Verwandten: Sagittarius A*.
    HD-Produktion
- eventId: 817301
  start: 2026-09-26T08:45:00Z
  stop: 2026-09-26T09:15:00Z
  title: Terra X Harald Lesch
  subtitle: '... und das Rätsel des Urknalls'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2026
    Der Urknall soll aller Anfang sein: des Universums, unserer Erde, von uns Menschen. Doch noch ist längst nicht alles geklärt. Harald Lesch macht sich auf die Suche nach dem wahren Big Bang.

    Wissenschaft und Kirche ringen seit Jahrhunderten um die Frage nach dem Ursprung des Universums. Trotz Widersprüchen gibt es mehr Übereinstimmungen, als man denkt. Doch ein Rätsel bleibt: Welche Rolle spielt die geheimnisvolle Dunkle Materie?
    HD-Produktion
- eventId: 817302
  start: 2026-09-26T09:15:00Z
  stop: 2026-09-26T09:45:00Z
  title: Terra X Harald Lesch
  subtitle: '...und warum wir nach den Sternen greifen'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Dank neuster Technik blicken wir so tief ins All wie noch nie zuvor. Faszinierende Welten - doch es hat auch seinen Preis. Was hat das Universum mit uns zu tun?

    Das James-Webb-Weltraumteleskop zeigt uns den Kosmos in einem völlig neuen Licht. Die Bilder begeistern Millionen. Gleichzeitig konkurrieren Nationen und Privatunternehmen um die Macht im All. Prof. Harald Lesch zeigt die Chancen und Gefahren des Alls.
    HD-Produktion
- eventId: 818352
  start: 2026-09-26T09:45:00Z
  stop: 2026-09-26T10:15:00Z
  title: Leschs Kosmos
  subtitle: Space Race 2.0 - Was passiert im All?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Immer mehr Nationen drängen in den Weltraum. Was sind die Ziele, wer macht das Rennen, finden wir endlich außerirdisches Leben? Harald Lesch zeigt die Tragweite des neuen Wettlaufs im All.

    China, Russland, USA und Europa planen die Rückkehr zum Mond und die Reise zum Mars. Israel, Saudi-Arabien, Indien - die Liste internationaler Player wächst. Und Weltraumagenturen bringen immer größere Teleskope ins All. Welche Hoffnung steckt hinter diesem Ansturm?
    HD-Produktion
- eventId: 818353
  start: 2026-09-26T10:15:00Z
  stop: 2026-09-26T10:45:00Z
  title: Leschs Kosmos
  subtitle: Asteroiden - Abwehrmission im All
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Millionen Asteroiden treiben durch unser Sonnensystem. Der nächste Einschlag ist nur eine Frage der Zeit. Doch es gibt Ideen, uns zu schützen: Die Raumsonde DART probt den Ernstfall.

    Vor rund 65 Millionen Jahren führt ein Asteroideneinschlag zur Katastrophe: Bis zu 75 Prozent der damaligen Arten, darunter ein Großteil der Dinosaurier, sterben aus. Einschlagkrater auf der ganzen Welt bezeugen: Auch heute könnte ein Asteroid Kurs auf die Erde nehmen.
    HD-Produktion
- eventId: 818354
  start: 2026-09-26T10:45:00Z
  stop: 2026-09-26T12:15:00Z
  title: Rätsel des Kosmos - Ist die Erde einzigartig?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2021
    Astronomen suchen seit Jahrzehnten in der Galaxie nach Planeten, die der Erde ähnlich sind. Bisher bietet kein anderes Sonnensystem die passenden Bedingungen dafür. Ist die Erde einzigartig?

    Vieles spricht dafür - das Leben auf der Erde ist das Ergebnis einer Verkettung glücklicher Zufälle. Die Wissenschaft hat felsige, flüssige, gasförmige, eisige und glühend heiße Planeten in anderen Sonnensystemen entdeckt. Aber keiner davon ähnelt unserer Erde.
    HD-Produktion
- eventId: 820773
  start: 2026-09-26T12:15:00Z
  stop: 2026-09-26T13:00:00Z
  title: Asteroiden - Gefahr aus dem All
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2024
    Millionen von Asteroiden gibt es in unserem Sonnensystem. Manche von ihnen drohen in Zukunft auf die Erde zu stürzen. Wissenschaftlerinnen und Wissenschaftler machen Jagd auf sie.

    Astronomen in aller Welt suchen den Himmel ab, um Asteroiden zu identifizieren. Die NASA schickt Satelliten auf Kollisionskurs mit Himmelskörpern, um ihre Umlaufbahn zu verändern. So sollen in Zukunft Einschläge erdbahnkreuzender Objekte verhindert werden.
    HD-Produktion
- eventId: 820774
  start: 2026-09-26T13:00:00Z
  stop: 2026-09-26T13:45:00Z
  title: Eine Reise durch das Sonnensystem
  subtitle: Dunkle Welten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2025
    Jenseits der Planeten verbergen sich Welten, eingehüllt in Dunkelheit. Außerhalb der Reichweite selbst der stärksten Teleskope liegen kaum erforschte, geheimnisvolle dunkle Orte.

    Unser Sonnensystem besteht nicht nur aus Himmelskörpern in der Nähe der Sonne. Es ist vielmehr ein riesiges Gebilde, das sich weit ins All erstreckt. Und es umschließt Welten, die wir uns nicht einmal vorstellen können.
    HD-Produktion
- eventId: 822107
  start: 2026-09-26T13:45:00Z
