  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Senegal, Dakar
  description: Der Katamaran "Nomade des Mers" setzt seine Reise über den Atlantik fort und nimmt Kurs nach Süden. Die Sahara-Küsten und Saint-Louis im Senegal wurden erfolgreich umschifft, nun legt Abenteurer Corentin einen Zwischenstopp in Dakar ein. Er will ein Mittel zur Stromversorgung finden - und zwar mit Lowtech-Verfahren. Im Senegal ist der Zugang zu Elektrizität ein Riesenproblem.
  genre:
