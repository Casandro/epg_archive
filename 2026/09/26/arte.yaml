  title: 50 Shades of Greek
  subtitle: Der Video-Chat
  description: 'Die Zeichentrickserie transportiert die großen Mythen der Antike in die heutige Zeit. In dieser Folge: Die Götter wollen in einer Zoom-Konferenz über die Auswirkungen der Pandemie diskutieren. Das kann allerdings nur klappen, wenn die Sirenen ihre Mikros stumm schalten und Zeus aufhört, mit den Filtern der neuen Metamorphose-App herumzuspielen.'
