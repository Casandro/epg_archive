  title: Die schwarzen Schmetterlinge (4/6)
  subtitle: Frankreich 2021
  description: Nachdem Albert Carrel zu Boden geschlagen und im Keller versteckt hat, beseitigt er alle Spuren. Carrel ist der kleine Junge, den Albert in den 70ern ausgesetzt hat. Solange hat es das Herz gebrochen, den Jungen zurückzulassen. Sie hat keine Lust mehr auf das Spiel. Albert will jedoch weiter morden und vergreift sich an einer Frau. Dabei wird er schwer verletzt und landet im Krankenhaus. Nach der letzten Sitzung erreicht Adrien Albert plötzlich nicht mehr. Adrien und Nastya kommen sich inzwischen gefährlich nahe, doch die Verbindung zwischen ihr und Albert ist Adrien nach wie vor ein Rätsel.
  ageRating: 16
  genre:
