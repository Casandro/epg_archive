  title: Mit offenen Karten
  subtitle: Shanghai, Chinas wirtschaftliches Aushängeschild
  description: '"Mit offenen Karten" richtet den Blick auf Shanghai - die Metropole, die wie keine andere für Chinas Aufstieg unter Staatschef Xi Jinping steht. Die Stadt gilt als Aushängeschild der Volksrepublik, als Symbol für wirtschaftlichen Fortschritt und globalen Einfluss. Doch hinter der glänzenden Fassade zeigt sich eine Stadt, die massiv gegen die Folgen des Klimawandels kämpfen muss.'
