  title: Baishanzu - Chinas unbekanntes Naturjuwel
  subtitle: China 2024
  description: Der Nationalpark Baishanzu in der chinesischen Provinz Zhejiang beheimatet eine seltene und artenreiche Tierwelt. In dem nebelverhangenen Urwald mit seinen zahlreichen Flüssen tummelt sich eine Vielzahl endemischer und bedrohter Tierarten. Die Dokumentation erkundet einen einzigartigen Ort mit besonderen Bewohnern.
- eventId: 619283
