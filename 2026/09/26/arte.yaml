  title: Kanada - Die Rückkehr der Blackfoot
  subtitle: Deutschland 2024
  description: In der Provinz Alberta in Kanada ist die Landschaft in vielen Regionen noch unberührt und von atemberaubender Schönheit. Hier sind die Blackfoot zu Hause. Sie gehören zu den First Nations in Kanada. Ihr Stammesgebiet erstreckte sich einst über 160.000 Quadratkilometer, eine Fläche fast halb so groß wie Deutschland. Aufgrund eines umstrittenen Vertrages mit den Weißen behielten sie aber nur noch das Wohnrecht in drei kleinen Reservaten. Die Blackfoot waren Jäger, Sammler und begnadete Reiter.
- eventId: 619284
  start: 2026-09-26T04:45:00Z
  stop: 2026-09-26T05:35:00Z
  title: Rhythmus im Blut - Sind Tiere musikalisch?
  subtitle: Großbritannien 2022
  description: 'Musik ist ein Rätsel der Evolution. Menschen singen, tanzen, fühlen den Beat: Diese Fähigkeit, Musik wahrzunehmen, zu genießen und selbst zu produzieren, nennt man Musikalität. Doch ist der Homo sapiens die einzige musikalische Spezies? Die Dokumentation gibt Einblicke in die bisherige Erforschung von Musikalität und Rhythmus in Natur und Tierwelt auf der Suche nach ihren Ursprüngen.'
  subtitled: true
- eventId: 619285
  start: 2026-09-26T05:35:00Z
  stop: 2026-09-26T06:30:00Z
  title: 'Vagusnerv: Wie das Hirn zum Herzen spricht'
  subtitle: Deutschland 2024
  description: 'Der Vagusnerv wird in der Medizin auch der Schlüssel zur Gesundheit genannt. Dieser bedeutende Nerv, der Gehirn und Körper verbindet, beeinflusst Atmung, Herzschlag und Verdauung. Wird er aktiviert, bietet er innovative Ansätze für die Forschung. Viele Menschen können davon profitieren: Zur Stressbewältigung, zur verbesserten Leistungsfähigkeit beim Sport oder bei Long Covid. Experten zeigen, wie dieser Nerv jetzt schon bei der Therapie weit verbreiteter chronischer Krankheiten hilft. Wird er die Medizin und unser Verständnis von Gesundheit revolutionieren?'
  subtitled: true
- eventId: 619318
  start: 2026-09-26T06:30:00Z
  stop: 2026-09-26T07:00:00Z
  title: Wo ist die Antimaterie hin?
  subtitle: 42 - Die Antwort auf fast alles
  description: 'Das größte Rätsel unseres Universums lautet: Es dürfte in ihm keine Materie geben. Unseren besten Theorien zufolge ist nach dem Big Bang neben Materie auch eine identische Menge Antimaterie entstanden. Erwartetes Ergebnis: völlige beidseitige Zerstörung. Doch wir sind hier. Und die Antimaterie weg. Haben wir sie nur noch nicht entdeckt? Oder sind unsere besten Theorien falsch?'
  subtitled: true
- eventId: 619319
  start: 2026-09-26T07:00:00Z
  stop: 2026-09-26T07:55:00Z
  title: 360° Reportage
  subtitle: 'Brasilien: Neue Hoffnung für die Hyazintharas'
  description: 'Sie sind die größten Papageien des brasilianischen Regenwalds - und gelten als seine schönsten: Hyazintharas. Mit ihrem leuchtend blauen Gefieder und den gelben Schnäbeln sind sie schon von weitem sichtbar. Doch während der letzten Jahrzehnte sind die spektakulär wirkenden Papageien seltener geworden. Durch die Abholzung des Regenwaldes und der Umwandlung der Flächen in Viehweiden gingen den Vögeln ihre Hauptnistplätze verloren, die großen Mandovi-Bäume. Nun jedoch gibt es Hoffnung für die Aras.'
  genre:
  - '112'
  subtitled: true
- eventId: 619320
  start: 2026-09-26T07:55:00Z
  stop: 2026-09-26T08:45:00Z
  title: 360° Reportage
  subtitle: Tatianas Tanz, Akrobatik auf dem Hochseil
  description: 'Eine Hochseiltänzerin versetzt die siebenjährige Tatiana-Mosio Bongonga in tiefgreifendes Erstaunen, indem sie in großer Höhe zwischen zwei Gebäuden balanciert. "Ich werde Seiltänzerin!", sagte sich das kleine Mädchen. Inzwischen ist sie selbst ein Star dieser Disziplin und eine der wenigen Frauen, die sich mehr als 30 Meter über dem Boden auf einem 300 Meter langen Drahtseil bewegen. Und das ohne Sicherheitsseil. Unlängst stellte sich Tatiana einer außergewöhnlichen Herausforderung: eine spektakuläre Performance in unmittelbarer Nähe des riesigen "Stade de France" in Saint-Denis bei Paris.'
  subtitled: true
- eventId: 619321
