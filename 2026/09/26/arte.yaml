  title: Zu Tisch
  subtitle: Rhön
  description: 'Die Rhön erstreckt sich über das Dreiländereck Hessen, Thüringen und Bayern und wird wegen seiner weiten Ausblicke auch das "Land der offenen Fernen" genannt. Im Naturschutzgebiet Lange Rhön hält Julia Djabalameli eine der ältesten Schafrassen der Welt: das Rhönschaf. Gemeinsam mit der Hofgemeinschaft nebenan feiert die Schäferin das Erntedankfest - mit Lammkeule und dem Rhöner Blechkuchen Ploatz.'
  genre:
