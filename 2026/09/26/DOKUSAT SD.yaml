  title: D-Day Tag der Entscheidung - Die Landung
  subtitle: D-Day Tag der Entscheidung - Die Landung
  description: Generalfeldmarschall Erwin Rommel gab sein Bestes, den Atlantikwall fertigzustellen, um die alliierte Invasion abzuwehren. Er glaubte, dass der Strand der entscheidende Ort sein würde. Die Vorbereitungen für die größte Militäraktion aller Zeiten liefen auf der anderen Seite des Ärmelkanals auf Hochtouren. General Dwight D. Eisenhower stand unter enormem Druck, die Invasion erfolgreich zu führen. Auch die französische Widerstandsbewegung "Resistance" war involviert.
  genre:
