  title: Ben Cropp - Geheimnisvolles Australien
  subtitle: Ben Cropp - Geheimnisvolles Australien - Die gefährlichste Qualle der Welt
  description: In diesem Dokumentarfilm klärt der Naturforscher Ben Cropp über die größte Gefahr auf, die Badenden an den Stränden von Australien begegnen kann. Die Feuer - oder auch Würfelqualle, deren hochgiftige Fangarme bei selbst kleinster Berührung unglaubliche Schmerzen auslösen. In vielen Fällen führt eine Begegnung mit diesem unscheinbaren Tier sogar zum Tod. Ben Cropp hat die Lebensbedingungen der gefährlichsten Qualle der Welt genau erforscht, um zu erfahren, wie man sich vor ihr schützen kann.
  widescreen: true
