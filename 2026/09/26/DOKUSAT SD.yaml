  title: Helden der Evolution - Wildhunde
  subtitle: Helden der Evolution - Wildhunde
  description: 'Hunde in freier Wildbahn: Diese Folge zeigt die Gruppe der Canidae in ihrer ganzen Vielfalt, von heulenden Wölfen über schlaue Füchse und jaulende Kojoten bis hin zu ihren weniger bekannten Verwandten, den Marderhunden, Mähnenwölfen und Rothunden. Ihr vielfältiges Verhalten kann in einem Moment beängstigend und imposant, aber schon im nächsten putzig und liebenswert wirken.'
  genre:
