  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Überlebenstraining
  description: 'Angoon ist nur per Wasserflugzeug, Fähre oder Helikopter erreichbar. Ein 72-jähriger Patient mit starker Atemnot wird per Rettungshubschrauber ins Krankenhaus geflogen. Die Crew um Lieutenant Chris Enoksen versorgt ihn mit Sauerstoff - doch der Vorrat geht zur Neige. Gleichzeitig trainiert David White mit der Coast Guard in Alaskas eisiger Wildnis für den Ernstfall: hartes Überlebenstraining unter extremen Bedingungen.'
