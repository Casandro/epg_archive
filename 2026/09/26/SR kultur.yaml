- eventId: 551971
  start: 2026-09-26T15:30:00Z
  stop: 2026-09-26T16:00:00Z
  title: 'Die Reportage: Sudan'
  subtitle: Krieg als Normalität, Normalität im Krieg
  description: "Seit mehr als drei Jahren herrscht Krieg im Sudan, ein Ende ist nicht in Sicht. Berichte über Massaker aus dem nordostafrikanischen Land gehören inzwischen fast zur Normalität. Leid und Tod gehören für fast alle Menschen im Land zum Alltag. Sie nutzen aber auch immer Kampfpausen, um sich im täglichen Leben ihre Würde zu bewahren. \nARD-Korrespondent Moritz Behrendt war unterwegs und hat Menschen getroffen, die in jeder Hinsicht weiterkämpfen - ob sie wollen oder nicht."
