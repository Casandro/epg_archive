  title: The Banishing - Im Bann des Dämons
  description: |-
    1938: Als der junge Geistliche Linus Forster (John Heffernan) mit seiner Familie ein nobles Anwesen bezieht, steht der Neubeginn in der britischen Provinzgemeinde unter keinem guten Stern. Bald schon häufen sich seltsame Ereignisse in den heimischen vier Wänden, und der streng gläubige Vikar muss feststellen, dass in dem Spukschloss düstere Geheimnisse der übernatürlichen Art lauern. Die dämonischen Kräfte werden sogar zur realen Bedrohung für Linus, seine Frau Marianne (Jessica Brown Findlay) sowie die kleine Tochter Adelaide (Anya McKenna-Bruce). - Für ihre Rolle in "Albatross" erhielt Jessica Brown Findlay eine Nominierung für den British Independent Film Award.
    GBR 2020
  widescreen: true
