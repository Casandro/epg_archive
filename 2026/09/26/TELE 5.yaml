  description: |-
    Eine rustikale Berghütte, ein Eigenheim auf Stelzen im Denali State Park oder ein ehemaliger Saloon, der zum Wohnhaus umgebaut wurde: James Kirkland und seine Frau Erin haben in Alaska die Qual der Wahl. Das Ehepaar sucht in der Nähe von Talkeetna ein neues Zuhause. Die Immobilie darf maximal 275 000 Dollar kosten und es stehen drei Objekte zur Auswahl. Die Entscheidung fällt den Naturliebhaber:innen nicht leicht. Bevor sie den Kaufvertrag unterschreiben, wägen sie Vor- und Nachteile ab.
