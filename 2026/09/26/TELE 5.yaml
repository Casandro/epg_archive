  title: Xena
  subtitle: Dirty Dancing
  description: |-
    Xena und Gabrielle kommen gerade noch rechtzeitig, um zu verhindern, dass im Dorf Paleos eine junge Frau öffentlich ausgepeitscht wird. Der Grund für die harte Strafe? Sie hat getanzt! Die Heldinnen staunen nicht schlecht, als sie bemerken, dass es sich bei der jungen Frau um Tara handelt, eine rebellische Teenagerin, die sie bereits bei einem anderen Abenteuer kennengelernt haben. Während der Dorfvorsteher Istafan (John Givens) seine Bürgerwehr mobilisiert, um das Gesetz durchzuboxen, schmieden Xena, Gabrielle und Autolycus einen anderen Plan. Das Trio will einen Weg finden, das strikte Tanzverbot für die Jugend auszuhebeln.
    USA 1998
