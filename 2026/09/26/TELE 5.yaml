    Auf dem Gefangenenschiff "Enyalios" spielen sich dramatische Szenen ab. Das Schiff gerät in einen schweren Sturm und kentert. Zu den wenigen Überlebenden des Unglücks zählen Hercules und der Straftäter Derkus Petronicus (Jeremy Roberts), den der Halbgott nach Sparta vor Gericht bringen soll. Bevor es soweit ist, müssen die Männer jedoch weitere Gefahrensituationen gemeinsam überstehen. Denn auf der Insel, auf der sie gestrandet sind, lauern neben monströsen, menschenfressenden Sandrochen auch Piraten!
