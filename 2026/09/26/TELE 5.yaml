  title: Xena
  subtitle: Najara, Botin des Lichts
  description: |-
    Gleichgesinnte oder gefährliche Extremistin? Xena und Gabrielle treffen Najara (Kathryn Morris), eine mutige Frau, die gegen das Böse kämpft und die Menschen zum Licht führen will. Aber bei genauerer Betrachtung verbirgt sich hinter der schillernden Fassade ein tödliches Geheimnis. Die vermeintlich wohlgesonnene Glaubensrichtung ist viel radikaler, als zunächst angenommen: Wer sich nicht bekehren lässt und der Botin des Lichts bedingungslos folgt, läuft nämlich Gefahr, von der radikalen Missionarin höchstpersönlich ins Jenseits befördert zu werden.
