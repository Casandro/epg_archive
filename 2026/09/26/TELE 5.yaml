  title: Hercules
  subtitle: Daedalus' grosser Irrtum
  description: |-
    Der griechische Erfinder Daedalus (Derek Payne) ist von tiefer Trauer ergriffen. Er gibt sich selbst die Schuld für den Tod seines Sohnes Ikarus. Hercules und seine Begleiterin Katrina (Rebecca Hobbs) reisen nach Euboea, um Daedalus einen Besuch abzustatten. Unterwegs stellen sie fest, dass der geschickte Erfinder nun offenbar im Dienst des zwielichtigen Königs Nikolas (Frankie Stevens) steht. Für den Regenten baut der Ingenieur überlegene Waffen und anderes Kriegsgerät! Hercules und Katrina stellen Daedalus zur Rede und bringen ihn dazu, seinen genialen Intellekt wieder für das Gute einzusetzen.
    USA 1996
