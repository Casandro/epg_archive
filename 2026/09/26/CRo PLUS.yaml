  title: Zaostřeno
  description: Končí astronomické léto, které znovu přepsalo historii. Čtyřicetistupňová vedra trvala na měřicích stanicích v Česku bezprecedentně dlouhé hodiny. V zemích Evropské unie zemřelo v horkých dnech nejméně o 35 tisíc lidí víc, než je běžné. Pokud jde o ekonomické škody v důsledku horka a sucha, EU je průběžně odhadla v přepočtu na víc než čtyři biliony korun. Jak uplynulé léto prožívali Češi a co naznačilo o budoucím vývoji klimatu? Téma pro klimatického zpravodaje Jana Kalibu.
