  subtitle: Výběr z komentářů, analýz a reportáží zahraničních médií
  description: Evropa potřebuje navrátit svůj velmocenský status, míní hnutí Evropská silová iniciativa. - Datová centra v Evropské unii budou muset prokazovat energetickou udržitelnost. - V jednom z berlínských okrsků se volilo v mešitě a výsledky nemile překvapily. - Asijské země se připravují na projevy klimatického jevu El Nino. - Čína se stala jedničkou v oblasti humanoidní robotiky. Dnešní výběr z komentářů, článků a reportáží zahraničních médií připravil Jakub Rerich.
