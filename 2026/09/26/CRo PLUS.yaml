  title: Reportáže zahraničních zpravodajů
  subtitle: Zvukové pohlednice od zpravodajů Českého rozhlasu ze všech koutů světa
  description: Na speciální párty pro ženy s názvem "Mama je späť" vás do Bratislavy pozvou Reportáže zahraničních zpravodajů. V New Yorku s nimi navštívíte dirigentskou premiéru Gustavo Dudamela před tamní filharmonií. Představí japonského konzula v Litvě - Čiune Sugiharu dlouho nikdo neznal, přestože právě on zachránil před německým nacismem falešnými vízy tisíce Židů. A ve Francii vás zavedou na populární bleší trhy.
