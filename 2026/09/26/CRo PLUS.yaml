  title: Osobnost Plus
  description: Karel Kolitsch, adiktolog. "Poslední fáze závislosti byla vyloženě destruktivní. Pil jsem a bral cokoliv, co přišlo pod ruku, a najednou jsem cítil, že buď přestanu, nebo umřu," říká o své bývalé závislosti, která ho nakonec přivedla ke studiu adiktologie a dnes působí jako terapeut. Jak se dokázal vyléčit? A rozumí díky tomu líp svým klientům? Moderuje Světlana Witowská.
