  description: Kráska proti Hitlerovi aneb Dva životy Hedy Lamarrové. To je název dnešního dílu cyklu Stopy, fakta, tajemství. Příběh hollywoodské herečky a sexsymbolu doby, proslavený skandálně v Československu filmem Extase. Jenže ona byla taky vědkyně. Za druhé světové války se podílela na převratném vynálezu, který se týkal navádění námořních torpéd. A její zásluhou dnes můžete používat mobilní telefony. Po detailech pátral Stanislav Motl.
