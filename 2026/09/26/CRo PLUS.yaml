  title: Mezi námi
  description: 'Magazín o národnostních menšinách v Česku. Libor Kukal se v Praze setkal s běloruskou televizní reportérkou Kaciarynou Bachvalavou, která pět let strávila ve vězení a nedávno byla propuštěna a deportována z Běloruska. Tatiana Čabáková se zajímala o složitý a inspirující životní příběh Gruzínky Lely Kukavy. Tomáš Pilát si popovídal se známým dramatikem a spisovatelem Milanem Uhdem o jeho slavné hře Balada pro banditu. Moderuje: Tatiana Čabáková. Připravila: Tajana Mančalová.'
