  title: Řečí peněz
  description: Národní rozpočtová rada kritizuje vládu za návrh rozpočtu na příští rok, který počítá se schodkem přes 380 miliard korun a dalšími 30 miliardami na dostavbu jaderné elektrárny v Dukovanech. Přiblíží se tak k rekordnímu zadlužení z covidového roku 2021 a pro to ekonomové nevidí důvod. Proč je to špatně i přes ohlášené investice do infrastruktury? Václav Pešička se ptá předsedy Národní rozpočtové rady Mojmíra Hampla.
