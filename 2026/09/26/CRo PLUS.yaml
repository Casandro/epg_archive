  subtitle: Přehled kulturních událostí týdne
  description: Ne prezident, ne disident, ani dramatik světového jména - prostě Vašek. Taková je divadelní inscenace o životě Václava Havla. V Brně se nově hrají Letnice podle knižního bestselleru, v Praze můžete vidět Sweeney Todd a v Liberci Cirkus Humberto. Autorka kulturního týdeníku Michaela Vetešková se zaměří na novou divadelní sezonu a premiéry v českých divadlech.
