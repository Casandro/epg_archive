  title: Hlasy paměti
  description: Děti by neměly trpět za hříchy svých rodičů. Přesto se to často děje. Marianna Tomašovská se narodila v roce 1947 do německé rodiny v Československu. Celé dětství jí Češi nadávali do fašistických spratků, v dospělosti ji nutili, aby se vzdala německého občanství. Nejen nad jejím příběhem, ale i nad komplikovanými vztahy mezi Čechy a Němci se zamýšlí autoři Hlasů paměti.
