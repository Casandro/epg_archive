    Diese Welten mögen weit entfernt und lebensfeindlich sein, aber die Kräfte, die sie beherrschen, ähneln denen, die einst auch die Erde formten. Die Gewalttätigkeit dieser Orte bildet einen Kontrast zu dem empfindlichen Gleichgewicht, das bei uns Leben ermöglicht.
