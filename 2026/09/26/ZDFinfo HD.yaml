  title: Rätsel des Kosmos - Ist die Erde einzigartig?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2021
    Astronomen suchen seit Jahrzehnten in der Galaxie nach Planeten, die der Erde ähnlich sind. Bisher bietet kein anderes Sonnensystem die passenden Bedingungen dafür. Ist die Erde einzigartig?

    Vieles spricht dafür - das Leben auf der Erde ist das Ergebnis einer Verkettung glücklicher Zufälle. Die Wissenschaft hat felsige, flüssige, gasförmige, eisige und glühend heiße Planeten in anderen Sonnensystemen entdeckt. Aber keiner davon ähnelt unserer Erde.
    HD-Produktion
- eventId: 820965
  start: 2026-09-26T12:15:00Z
  stop: 2026-09-26T13:00:00Z
  title: Asteroiden - Gefahr aus dem All
  genre:
