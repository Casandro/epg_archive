  audiodesc: true
  description: |-
    Frankreich 2024
    Millionen von Asteroiden gibt es in unserem Sonnensystem. Manche von ihnen drohen in Zukunft auf die Erde zu stürzen. Wissenschaftlerinnen und Wissenschaftler machen Jagd auf sie.

    Astronomen in aller Welt suchen den Himmel ab, um Asteroiden zu identifizieren. Die NASA schickt Satelliten auf Kollisionskurs mit Himmelskörpern, um ihre Umlaufbahn zu verändern. So sollen in Zukunft Einschläge erdbahnkreuzender Objekte verhindert werden.
    HD-Produktion
