    Unser Sonnensystem besteht nicht nur aus Himmelskörpern in der Nähe der Sonne. Es ist vielmehr ein riesiges Gebilde, das sich weit ins All erstreckt. Und es umschließt Welten, die wir uns nicht einmal vorstellen können.
