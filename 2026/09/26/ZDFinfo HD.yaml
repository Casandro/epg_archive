    Kosmische Strahlen sind subatomare Teilchen, die sogar Astronauten in Raumanzügen gefährden können. Sie stammen von Supernovae, Schwarzen Löchern oder der Sonne selbst. Ihr Ursprung ist rätselhaft, ihre Energie enorm. Experten nutzen Teleskope, um sie zu erforschen.
