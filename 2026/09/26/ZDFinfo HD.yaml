    Gibt es intelligentes Leben da draußen, oder sind wir wirklich allein im Kosmos? Seit Enrico Fermi fragte: "Wo sind sie alle?", rätseln Forschende über das Schweigen des Alls. SETI, Exoplaneten und das "Wow!"-Signal liefern zwar Hinweise - doch bisher fehlt ein Beweis.
