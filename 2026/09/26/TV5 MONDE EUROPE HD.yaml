  title: 'Meryem Aboulouafa, Jadd Hilal, Mourad Merzouki '
  subtitle: 'Révélée par un premier album éponyme en 2020, Meryem Aboulouafa revient avec « Family », où elle explore la cellule familiale comm '
  ageRating: 7
  description: "Meryem Aboulouafa, Jadd Hilal, Mourad Merzouki\n\nRévélée par un premier album éponyme en 2020, Meryem Aboulouafa revient avec « Family », où elle explore la cellule familiale comme premier espace social et cocon émotionnel. L'occasion pour elle de tisser des liens entre traditions marocaines, rock et modernité électro. Meryem Aboulouafa est à L'Aéronef de Lille (27 septembre 2026), au Nancy Jazz Pulsations (8 octobre) et à Visa for Music de Rabat (5 novembre).\n \nL'histoire d'une vie, celle d'Aïda, une enfant née en Palestine et devenue mère puis grand-mère, contrainte de vivre loin de chez elle, de ses terres, des siens... Dans « Ici commence la terre » (éditions Elyzad), Jadd Hilal raconte l'exil et ses conséquences sur la vie d'une famille et l'esprit d'une femme, revisitant l'existence de sa grand-mère et lui donnant la parole. Sélectionné pour?le prix de la littérature arabe 2026 de l'IMA, Jadd Hilal participe au festival Maillage (27 septembre 2026).   \n \nMourad Merzouki a toujours voulu mêler les styles et traverser les frontières artistiques. Aujourd'hui, il propose une adaptation de « Mozaïk », en collaboration avec le danseur Bilal Allaf. Une version pensée lors d'une résidence à la Villa Hegra d'AlUla, où les interprètes croisent l'héritage chorégraphique de la compagnie Käfig avec les sensibilités et les parcours d'une nouvelle génération d'artistes saoudiens. À voir au festival Karavel de Bron (27 septembre 2026) et à la Gaîté lyrique de Paris (20 octobre).\n \nDepuis 1993 et son célèbre « Palestine », Joe Sacco a publié quatre livres BD sur Gaza. Il dévoile « Requiem pour Gaza », écrit en collaboration avec Chris Hedges. Une rencontre signée Laure de Matos, Virgile Tron, Clémentine Bardet. \n \n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Meryem Aboulouafa, chanteuse et poétesse ; Jadd Hilal, écrivain ; Mourad Merzouki, danseur et chorégraphe \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
  genre:
  - '63'
