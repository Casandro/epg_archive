  description: '2026 ● S5 E23 Veel plekken in Nederland die vroeger werden gebruikt als afvalstortplaats zijn inmiddels geen vuilnisbelt meer. Een groot deel van deze locaties heeft tegenwoordig een andere, soms verrassende bestemming. Net boven Amsterdam ligt de Volgermeerpolder, ooit een van de grootste vuilnisbelten van Nederland. De familie van Arie maakte van dichtbij mee hoe de vuilnisbelt groeide en hoe de zorgen toenamen toen er chemisch afval werd ontdekt. Variety show 2026,  Actors: Carrie ten Napel, Bert Haandrikman, Season:5 Episode:23'
