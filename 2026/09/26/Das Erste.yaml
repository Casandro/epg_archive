  title: Anna und die Haustiere
  subtitle: Schulhund Lunka im Einsatz
  description: "Anna drückt wieder die Schulbank. Und das aus einem ganz bestimmten Grund: Sie möchte Schulhündin Lunka kennenlernen und herausfinden, was ein Schulhund überhaupt ist und was genau er in einem Klassenzimmer macht. Das zeigen der Tierreporterin Lunka, die Lehrerin Frau Hösl und ihre Klasse im Englischunterricht. \nDenn schon allein durch ihre Anwesenheit bringt Lunka Ruhe ins Klassenzimmer. Die Schüler nehmen Rücksicht, wenn sich die Hündin auf ihrer Decke ausruht. Und sie nehmen motivierter am Unterricht teil, wenn Lunka beim Buchstabenspiel zum Einsatz kommt. In den Pausen ist Schulhund-Zeit für alle Schüler."
