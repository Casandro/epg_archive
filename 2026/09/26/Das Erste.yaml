  description: Als sich Madame Birgit versehentlich in einem Schrank einsperrt, nutzt Guinevere die Gelegenheit für einen Ausflug auf einem königlichen Greifen mit Arthur. Doch als sie schließlich zum Schrank zurückkommt, um ihre Zofe zu befreien, ist dieser verschwunden. Er wurde in der Zwischenzeit durch einen neuen Schrank ersetzt und an die Dorfbewohner gespendet. Arthur und Guinevere eilen schuldbewusst ins Dorf. Doch sie kommen bereits zu spät. Ein Oger hat das Dorf überfallen und den Schrank in seine Höhle verschleppt. Nun müssen Arthur und Guinevere Madame Birgit vor dem Oger retten, bevor sie zu seinem Abendessen wird.
