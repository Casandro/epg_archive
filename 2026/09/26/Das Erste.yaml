  title: Dein großer Tag (3/11)
  subtitle: Bianca auf Höhlentour
  description: Bianca ist zwölf Jahre alt und möchte unbedingt mal eine echte Höhlentour machen. Gemeinsam mit Biancas Eltern hat Johannes eine Kanufahrt organisiert und überrascht Bianca beim Bootsausflug auf der Rednitz. Bianca ist begeistert und reist mit Johannes zur Attahöhle, einer der schönsten Tropfsteinhöhlen Deutschlands. Dort bekommt sie eine exklusive Führung, taucht ein in die märchenhaften Grotten, erfährt viel über die Entstehung von Höhlen und darf sogar in die Nebengänge hinein, wo sonst kein Besucher hinkommt ... Am nächsten Tag lernt sie Stefan Voigt kennen, einen der bekanntesten und erfolgreichsten Höhlenforscher Deutschlands.
