  title: Anna und die wilden Tiere
  subtitle: Im Revier der Tiger
  description: Anna ist auf der Suche nach einer der größten Raubkatzen der Erde, dem Tiger. Genauer gesagt, dem Sumatra-Tiger. Der Regenwald der indonesischen Insel Sumatra ist sein Zuhause. Doch die majestätischen Tiere zeigen sich nur selten. Erstens sind sie sehr scheu, und zweitens gibt es nur noch knapp 400 Tiere dieser Unterart. Sumatra-Tiger sind vom Aussterben bedroht. Die Raubkatzen werden aus ihren Wäldern vertrieben und wegen ihres Fells und der Knochen gejagt. Was man für ihren Schutz tun kann, erfährt Anna von Alex. Zusammen mit dem Biologen stellt sie im Dschungel von Sumatra eine Kamerafalle auf.
