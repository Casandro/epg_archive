  subtitle: Überraschender Beifang beim Schwarzbarschangeln - Der italienische Hecht
  description: Im Lago di Bolsena soll es eigentlich auf Schwarzbarsch gehen. Nach dem ein oder anderen gefangenen Zielfisch ist auf einmal die Rute richtig krumm. Was jedoch am anderen Ende der Schnur hängt, ist eine Riesige Überraschung. Ein italienischer Hecht, Esox Cisalpinus hat sich den Köder geschnappt. Dies ist eine endemische Fischart, welche nur in Nord und Mittelitalien vorkommt. Die wunderschöne Zeichnung dieser Gattung macht ihn zu einem ganz besonderen, unvergesslichem Fang auf unserer Angeltour. DE 2022
