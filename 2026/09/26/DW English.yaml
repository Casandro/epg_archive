  title: San Michele
  subtitle: Venice's Cemetery Island
  description: "Since the early 19th century, not only native Venetians have been buried here, but also famous visitors such as Ezra Pound, Luigi Nono, Sergei Diaghilev, Igor Stravinsky, Joseph Brodsky, and Emilio Vedova. They have their graves there, in the city they loved.\n \nBut the island is not just a place of death and silence. Every day, people come here to care for the cemetery. Visitors also arrive regularly, including members of the association \"La laguna nel bicchiere” or \"The Lagoon in a Glass.” The association's goal is to revive forgotten vineyards in Venice and on its islands. One of these is located in the novitiate garden of the former Camaldolese monastery on San Michele."
  widescreen: true
