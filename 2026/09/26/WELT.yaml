  title: Der Traum vom eigenen Pool - Vom Eigenbau bis zum Luxus-Schwimmbad
  subtitle: Der Traum vom eigenen Pool - Vom Eigenbau bis zum Luxus-Schwimmbad
  description: 'Keine Möglichkeit zu reisen? Kein Problem. Wer es sich leisten kann, der legt sich seinen persönlichen Wellness-Bereich einfach im eigenen Garten an. Swimmingpools gibt es in zahlreichen Ausführungen, Größen und Preisklassen. Planung, Aufbau, Badespaß: Die Reportage begleitet eine junge Familie, die ihren Traum vom eigenen Schwimmbad selbst in die Hand nimmt. Reichen ihr Laienwissen und das knappe Budget für Montage und Installation eines voll funktionstüchtigen und stabilen Bassins aus?'
  widescreen: true
- eventId: 1171441
  start: 2026-09-26T16:29:00Z
