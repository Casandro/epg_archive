  title: 140.000 Quadratmeter Wellness - Die größte Therme der Welt
  subtitle: 140.000 Quadratmeter Wellness - Die größte Therme der Welt
  description: Mit einem Gelände so groß wie zwanzig Fußballfelder ist die Therme Erding das größte Thermalbad der Welt. Bis zu zehntausend Besucher pro Tag vergnügen sich hier in neunundzwanzig Becken, fünfundzwanzig Saunen oder auf sechsundzwanzig Rutschen. Die Reportage wirft einen Blick hinter die Kulissen des Thermenkomplexes vor den Toren Münchens und zeigt die verborgene Technik, die aufwendigen Wartungs- und Reinigungsarbeiten und die Features, ohne die der Betrieb der Mega-Anlage nicht möglich wäre.
  widescreen: true
- eventId: 1145378
