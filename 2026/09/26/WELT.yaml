  title: Schrauben, schmieren, schuften - Boxenstopp für Züge
  subtitle: Schrauben, schmieren, schuften - Boxenstopp für Züge
  description: Etwa 88 Millionen Fahrgäste werden jedes Jahr von 280 ICE transportiert. Allein von der Deutschen Bahn werden in Deutschland und seinen Nachbarländern täglich rund 1.500 Zugfahrten durchgeführt. Natürlich geht da auch mal etwas kaputt. Drehgestelle abmontieren, Klimaanlagen tauschen, Frontscheiben aus- und einbauen - wie sorgen die 700 Arbeiter im Münchener Betriebswerk dafür, dass die Schnellzüge wieder Fahrt aufnehmen?
