    ARD-Opernabend

    Staatsoper für Alle 2026

    Giuseppe Verdi: Nabucco

    Nabucco: Ariunbaatar Ganbaatar
    Ismaele: Andrés Moreno García
    Abigaille: Lidia Fridman
    Fenena: Elena Maximova
    Zaccaria: Tareq Nazmi
    Anna: Clara Nadeshdin
    Abdallo: Junho Hwang
    Hohepriester des Baal: Hanseong Yun

    Staatskapelle Berlin
    Staatsopernchor Berlin

    Leitung: Francesco Lanzilotta

    (Aufnahme v. 23.05.2026, Berlin, Staatsoper)


    Zum 19. Mal heißt es dieses Jahr auf dem Berliner Bebelplatz wieder: Staatsoper für Alle. Auf
    dem Programm steht die Oper "Nabucco" von Giuseppe Verdi, sein erster großer Opernerfolg.
    Das Werk- mit musikalischen Glanzpunkten, wie dem Gefangenenchor "Va pensiero"- kam
    1842 in der Mailänder Scala so gut an, dass es in der kommenden Spielzeit ganze 57 Mal
    wiederholt wurde. In den vier Akten der Oper wird die Geschichte des babylonischen Königs
    Nabucco erzählt, der nach seinem Sieg über die Israeliten einen ausgewachsenen Gottkomplex
    entwickelt und schließlich wahnsinnig wird. Er entgeht nur knapp einer Katastrophe- gerettet,
    durch die Einsicht, dass er nicht Gott ist und ein Gebet zum Gott der Israeliten. An der
    Staatsoper wird "Nabucco" vom russischen Bariton Ariunbaatar Ganbaatar gesungen,
    Francesco Lanzilotta dirigiert die Staatskapelle und den Staatsopernchor.
