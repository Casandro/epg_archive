  title: Sprintour - Extremsituation in Bolivien auf 5000m
  subtitle: Sprintour - Extremsituation in Bolivien auf 5000m
  description: |-
    Nach 9 Monaten Van life in Südamerika sind wir mit unserem VW Crafter Wohnmobil in der Atacama Wüste in Chile angekommen. Das ist der Startpunkt für eins der größten Abenteuer unseres Lebens.
    Seit Monaten bereiten wir uns auf eine ganz besondere Strecke durch Bolivien vor: Die Lagunen Route. Sie ist eine der schönsten aber auch eine der härtesten Offroadpisten in Bolivien. Auch wenn uns jeder davon abgeraten hat die Strecke mit dem eignen Camper zu fahren, wagen wir das Abenteuer. Es geht los mit der Laguna Verde, der Laguna Blanca bis hin zur Laguna Colorada.
    Und eins ist klar: Es ist die härtest Route die wir je mit unserem VW Crafter Camper gefahren sind.
    Straßen gibt es da oben keine. Es geht nur querfeldein über Sandfelder und große Steine. Da wir kein Allrad Fahrzeug haben, stellt uns die Lagunen Route in Bolivien vor eine sehr große Herausforderung. Zudem befindet sich diese Offroad Piste auf über 4000 Hm. Wir kämpfen mit der Höhe und vor allem mit der Kälte. Nachts sinkt das Thermometer auf -20 Grad. Da auf der Lagunen Route unsere Standheizung im VW Crafter Camper kaputt gegangen ist, wird es für uns persönlich zu einer richtigen Herausforderung. BO 2023
