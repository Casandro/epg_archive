  description: |-
    Deutschland 2026
    "Wunschlos unglücklich" heißt das Programm der österreichischen Künstlerin Irina, bekannt als "Toxische Pommes". Sie verbindet scharfe Gesellschaftskritik mit ihrem eigenen Selbstbild.

    Denn wenn Ideale auf die Wirklichkeit treffen, entstehen oft die lustigsten Widersprüche. Eine Wohnung zu erben ist eigentlich etwas Schönes - aber nicht, wenn die eigenen Privilegien plötzlich nicht mehr mit den politischen Überzeugungen übereinstimmen.
