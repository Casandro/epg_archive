  description: |-
    Deutschland 2026
    Eva Karl Faltermeier beleuchtet in ihrem neuen Programm auf der 3sat-Bühne die alltägliche Zerreißprobe zwischen verrosteten Traditionen und den Herausforderungen der modernen Welt.

    Zum Glück macht die Komikerin daraus richtig gute Comedy. Mit "Ding Dong" verwandelt sie gesellschaftliche Beobachtungen und persönliche Erfahrungen in humorvolle Geschichten, die zeigen: Auch die Ohnmacht der Moderne lässt sich mit einem Lachen besser ertragen.
