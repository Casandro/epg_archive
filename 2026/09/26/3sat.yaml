  description: |-
    Deutschland 2026
    In ihrem neuen Programm "Romantik - Aber Zack Zack!" zeigt sich Barbara Ruscher von ihrer verletzlichen Seite und plädiert für mehr Zärtlichkeit im Alltag. Modernes Kabarett im 3sat-Zelt!

    Die preisgekrönte Komikerin erzählt von ihrer Alkoholabstinenz, erforscht die Erotik von Heißluftfritteusen und rappt über E-Bikes. Wie es ihr gelingt, selbst in diesen Dingen Romantik zu entdecken, sei ihr überlassen. Eins ist sicher: Lustig wird es bestimmt!
