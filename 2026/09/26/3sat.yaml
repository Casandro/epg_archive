  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  description: |-
    Deutschland 2026
    Buch "Die Zukunft ist Frieden" - Der Israeli Maoz Inon und der Palästinenser Aziz Abu Sarah gehen gemeinsam auf Friedenstour. Inons Eltern wurden von Hamas-Terroristen ermordet, Abu Sarahs Bruder starb nach Folter in einem israelischen Gefängnis. Jetzt erscheint ihr gemeinsames Buch auf Deutsch.

    Netanjahu vor der UN - Der israelische Ministerpräsident Benjamin Netanjahu hat bei einer Rede vor der UN-Vollversammlung am 24. September den New Yorker Bürgermeister, westliche Regierungschefs sowie Katar und die Türkei scharf angegriffen. Zuvor hatten Dutzende Diplomaten aus Protest den Saal verlassen. "Kulturzeit" spricht mit dem Journalisten Ronen Steinke.

    Deutscher Kulturpolitikpreis - Iris Berben hat den Deutschen Kulturpolitikpreis des Kulturrats erhalten für "ihren beharrlichen Einsatz gegen Antisemitismus, Rassismus und Rechtsextremismus sowie für Erinnerungskultur, jüdisches Leben und gesellschaftlichen Zusammenhalt ein", wie es in der Begründung des Kulturrats heißt.

    Schweizer Neutralitätsinitiative - Am 27. September entscheiden die Schweizer Stimmberechtigten über die Volksinitiative "Wahrung der schweizerischen Neutralität".

    50 Jahre U2 - Die irische Rockband um Frontmann Bono wird 50 Jahre alt und feiert das mit einem neuen Musikalbum, das im November erscheinen wird.

    Moderation: Vivian Perkovic
