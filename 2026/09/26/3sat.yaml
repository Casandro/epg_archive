    Ihre Wundertüte an Unfug und kruden Pointen nimmt die Zuschauer mit auf einen wilden Ritt aus Musik, Satire, Sketch, Kabarett und Stand-up-Comedy, der das Internetzeitalter virtuos auf die Bühne bringt. Die Devise ist und bleibt: Je absurder, desto besser!
