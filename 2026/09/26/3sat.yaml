  audiodesc: true
  description: |-
    Deutschland 2026
    Zwölf Jahre Suchtpotenzial, vier Programme und unzählige Ohrwürmer: Julia und Ariane feiern ihre musikalische Reise im 3sat-Zelt. Ein ganz besonderer (S)Hitstorm erwartet das Publikum.

    Mit bissigen Songs, schrägen Dialogen und jeder Menge Selbstironie zelebrieren die beiden ihr bisheriges Schaffen. Laut, ehrlich und herrlich albern zeigen sie, wie schmal der Grat zwischen Kult und Chaos ist. Ganz nach dem Motto: Genauso scheiße, nur besser.
