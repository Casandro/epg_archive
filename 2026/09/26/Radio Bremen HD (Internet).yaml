  title: DAS! Rote Sofa
  subtitle: Prof. Dr. Henning Kunter, Osteoporose-Experte
  description: |-
    Wenn sich jemand mit porösen Knochen auskennt, dann
    er. Prof. Dr. Henning Kunter ist ein renommierter Facharzt für Orthopädie, Unfallchirurgie und Chirurgie und gilt auf dem Gebiet Osteoporose als Koryphäe. Mindestens sechs Millionen Menschen leiden hierzulande am Knochenabbau - vor allem Frauen. Spezifische Ernährung und gezieltes Kraft- und Koordinationstraining können allerdings helfen, die Erkrankung zu bremsen. Welche Übungen genau helfen und welches Essen sinnvoll ist, erklärt Prof. Kunter
    auf dem Roten Sofa.
- eventId: 1232793
  start: 2026-09-26T04:00:00Z
  stop: 2026-09-26T04:30:00Z
  title: 'Die Nordreportage: Ewige Baustelle Nord-Ostsee-Kanal'
  description: Der 130 Jahre alte Nord-Ostsee-Kanal ist eine der wichtigsten Verkehrsadern Europas. Doch das Bauwerk aus der Kaiserzeit ist stark beansprucht. Schiffe werden größer, Brücken und Schleusen sind veraltet. Deshalb laufen entlang des Kanals zahlreiche gigantische Instandsetzungs- und Neubauprojekte. Darunter die Erweiterung der Oststrecke, bei der der Schwimmbagger "Peter the Great" enorme Erdmassen versetzt und den Kanal verbreitert. Auch die riesigen Schleusentore, die noch aus der Kaiserzeit stammen, müssen ersetzt werden.
- eventId: 1235594
  start: 2026-09-26T04:30:00Z
  stop: 2026-09-26T05:00:00Z
  title: 'Die Nordreportage: Auf Fangfahrt mit Hochseefischern'
  description: 'Kapitän Fritz Flindt und seine Männer sind die letzten Hochseefischer Deutschlands. Ihr Schiff "Iris" ist das Neueste in der Flotte der Reederei Kutterfisch aus Cuxhaven, mit moderner Fangtechnik und einer eigenen Fischfabrik im Rumpf. Die erste Winterfahrt auf hoher See mit dem neuen Schiff: Zwischen Norwegen und den Shetlandinseln wollen die Fischer Seelachs fangen. Der Film begleitet sie eine Woche lang auf ihrer ersten Winterfahrt mit ihrem neuen Fischkutter.'
  genre:
  - '112'
