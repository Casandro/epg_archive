- eventId: 1240304
  start: 2026-09-26T10:00:00Z
  stop: 2026-09-26T10:45:00Z
  title: Unsere Geschichte
  subtitle: Als die Ökos in den Norden kamen
  description: 'Spinner oder langhaarige Gammler wurden sie genannt: Junge Männer und Frauen, die vor 40 Jahren anders leben wollten. In Kommunen, Wohngemeinschaften und vor allem Einklang mit der Natur. Den Boden nicht ausbeuten, nachhaltig wirtschaften - auch als Landwirt. Viele Alteingesessene schüttelten oft den Kopf, über Biogemüse, Tierwohl und Windenergie. Nur im dünnbesiedelten, norddeutschen Wendland war es etwas anders. Zwar wurden die Latzhosenträger auch dort nicht von allen freundlich empfangen, aber der Kampf gegen das atomare Endlager in Gorleben einte mehr, als er trennte.'
- eventId: 1240576
  start: 2026-09-26T10:45:00Z
  stop: 2026-09-26T11:15:00Z
  title: Weltbilder
  subtitle: Die Seegras-Retter von den Balearen
  description: 'Seegras kann mehr Kohlenstoff speichern als jeder Wald, Fische nutzen es als Kinderstube und im Winter schützt es die Küsten. Auf den Balearen steht die Superpflanze unter Naturschutz - und wird doch durch viele Schiffe bedroht, deren Anker den Meeresboden aufreißen. Zeit für die Seegras-Retter: Patrouillenboote und Meeresbiologen, die beschädigte Zonen wieder aufforsten.'
- eventId: 1241302
  start: 2026-09-26T11:15:00Z
  stop: 2026-09-26T12:00:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Wilde Wege - Türkei
  description: Von der Schwarzmeerküste der Türkei führt der "Highway D915" durch steile Täler und hochalpine Pässe in das anatolische Hochland. Gegensätzlicher könnten die Gegenden, die die Straße verbindet, kaum sein. Der Highway ist eine gefährliche Straße durch das Pontische Gebirge, vor dem die Menschen vor Ort Respekt haben. Aber sie lieben ihre D915, ist sie doch für sie die einzige Verbindung in den hohen Norden der Türkei.
- eventId: 1242448
  start: 2026-09-26T12:00:00Z
  stop: 2026-09-26T13:30:00Z
  title: Landpartie
  subtitle: Artland
  description: Wie klingt das Artland von oben? Heike Götz findet es heraus bei einem Segelflug über eine der geschichtsträchtigsten Kulturlandschaften Norddeutschlands. Mit dem Fahrrad erkundet sie Dörfer, Flüsse und Höfe, trifft leidenschaftliche Menschen, die mit Herz und Hand Geschichte bewahren und Zukunft gestalten.
- eventId: 1243814
  start: 2026-09-26T13:30:00Z
  stop: 2026-09-26T14:00:00Z
  title: 'Die Nordreportage: Der Bauernretter'
  subtitle: Einsatz auf fremden Höfen
  description: Landwirt Geert-Simon Oosterveld aus dem niedersächsischen Uplengen hat ein Problem. Er muss ins Krankenhaus und seine Hände operieren lassen. Mehrere Wochen wird er ausfallen. Doch wer wird sich dann um seinen Betrieb und seine 140 Milchkühe kümmern? Ein Fall für Betriebshelfer Kim Köhler. Der junge Landwirt übernimmt auf dem fremden Hof von heute auf morgen die Leitung, ohne den Betrieb zu kennen. Die Nordreportage zeigt die große Herausforderung.
  genre:
  - '112'
- eventId: 1246968
  start: 2026-09-26T14:00:00Z
  stop: 2026-09-26T14:30:00Z
  title: Auf'm Trecker
  subtitle: Neues auf Hof Barslund
  description: 'Rund 1.200 Rinder, Hühner und sogar Wasserbüffel gehören zu Hof Barslund. Thomas Andresen führt den Hof mit Leidenschaft, Innovationsgeist und einer ordentlichen Portion norddeutschem Humor. Gemeinsam mit seiner Frau Tina, Sohn Nikolai und seinem Hofteam meistert er den Alltag zwischen Stall, Feld und Familie. Für ihn ist klar: "Das haben wir schon immer so gemacht" gilt hier nicht. Er probiert Neues aus, denkt unkonventionell und wagt Experimente.'
- eventId: 1247830
  start: 2026-09-26T14:30:00Z
  stop: 2026-09-26T15:15:00Z
  title: Unterwegs auf der Luftlinie
  subtitle: Zwischen Cuxhaven und Buchholz in der Nordheide
  description: 'Sie kennen das Ziel, aber der Weg dahin wird ein Abenteuer, bei dem der Zufall die Regie führt. Die Reporter Vanessa Kossen und Thilo Tautz machen sich zu Fuß auf den Weg: 100 Kilometer durch Niedersachsen, abseits ausgetretener Pfade. Konsequent eine Luftlinie zu laufen ohne Geld und Zelt, immer schnurstracks geradeaus, wie soll das funktionieren? Thilo Tautz startet auf dem Bungsberg bei Buchholz in der Nordheide, Vanessa Kossen in Cuxhaven. Ihr Ziel: die Gemeinde Himmelpforten.'
- eventId: 1248224
  start: 2026-09-26T15:15:00Z
  stop: 2026-09-26T16:00:00Z
  title: Hanseblick - So wild ist Mecklenburg
  subtitle: Zwischen Wisent und Fledermaus
  description: Der "Hanseblick" ist unterwegs im Naturpark Nossentiner/Schwinzer Heide. Im Herzen Mecklenburgs gelegen ist es ein Refugium für wilde Tiere, Fledermäuse und Naturfreunde. 60 Seen mit klarem Wasser gibt es hier. Die größten Säugetiere Europas, die Wisente, leben im Reservat Dammerower Werder. Und die leichtesten Säugetiere, die Fledermäuse, rund um die Dörfer Bossow und Wooster Teerofen in alten Bunkern und Nistkästen. Seeadler, Gänse, die zu Tausenden durchziehen, und Kraniche locken Naturliebhaber auf die Aussichtstürme und -plattformen.
