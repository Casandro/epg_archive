  stop: 2026-09-26T07:00:00Z
  title: Tietjen campt - der Roadtrip
  subtitle: Kanäle, Käse, Küstenwind - Campingparadies Südholland
  description: '"Tietjen campt - der Roadtrip" führt dieses Mal von der Nordseeinsel Norderney durch das Emsland nach Amsterdam und weiter durch Südholland bis an die Nordseeküste Zeelands. Gastgeberin und Camping-Enthusiastin Bettina Tietjen wird dieses Mal von Schauspieler Sven Martinek, Boxlegende Regina Halmich, Moderator und Podcaster Jochen Schropp, Olympiasieger im Gewichtheben Matthias Steiner und Buchautorin und Moderatorin Evelyn Weigert begleitet. Diese Etappe führt von Amsterdam bis nach Südholland.'
