  description: 'Autor a interpret: Natálie Feitová, Alena Rubášová; Premiéra: 22.9.2026 * V dalším díle Barvínku nás čeká dobrodružná výprava do světa plného zajímavostí! Společně s Naty a Alčou prozkoumáme tajemný svět zvířat, odhalíme záhady nekonečného vesmíru, a také nahlédneme do úžasného fungování lidského těla. Které zvířátko ochutnává nohama? Kolik svalů potřebujeme k mluvení? Na jaké planetě prší diamanty a proč astronauti nesmějí jíst ve vesmíru chleba? Na tyto a spoustu dalších otázek si odpovíme v dnešním pořadu. Vydejte se s námi, startujeme v úterý v 17.10 a v sobotu v 11.00.'
