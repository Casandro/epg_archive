  title: Knihovnička
  subtitle: 'Knihovnička speciál: knihy o svatém Václavovi'
  description: 'Autor a interpret: Iva Horká; Premiéra: 28.9.2024 * Den české státnosti je český státní svátek, který připadá na 28. září. Toto datum je zároveň svátkem sv. Václava, přemyslovského knížete, patrona Čech a Moravy a jednoho z as přehled vybraných knih, které se tímto tématem zabývají. Uslyšíte například o knihách: Svatý Václav - Příběh českého knížete, Legenda o svatém Václavovi, Svatý Václav - s podtitulem Vraždou to nekončí a další.Pořadem provází Iva Horká.'
