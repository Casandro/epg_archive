  description: 'Autor: Jana Rambousková; Interpret: Eva Lorenc; Premiéra: 25.9.2026 * Proč se učit hrát na hudební nástroj? Jak začít a neztratit chuť po prvních neúspěších? S klavírní pedagožkou, klavíristkou a skladatelkou Evou Lorenc se podíváme na různé přístupy k výuce (nejen) hry na klavír, nejčastější obavy začátečníků i na to, co může pomoci, aby radost z hraní zůstala i při učení. Eva Lorenc je autorkou klavírní školy Můj klavír, jejíž dva díly vyšly v nakladatelství Bärenreiter. Vytvořila také vlastní systém online výuky, který už přivedl ke klavíru tisíce začátečníků.'
