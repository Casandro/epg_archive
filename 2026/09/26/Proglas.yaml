  title: Tip týdne
  subtitle: Skryté křesťanské poselství v dílech J. R. R. Tolkiena
  description: 'Autor: Martin Weisbauer; Interpret: Pavel Hošek; Premiéra: 16.9.2026 * Když se řekne "Pán prstenů", většině lidí se vybaví velkolepé dobrodružství. Málokdo si ale uvědomuje, že jeho autor, John Ronald Reuel Tolkien, považoval svou katolickou víru za jeden z nejdůležitějších pilířů svého života. Napsal i další méně známá díla. O skrytém křesťanském odkazu v jeho knihách si budeme povídat s předním znalcem Tolkiena - prof. Pavlem Hoškem, Ph.D., který nám velmi poutavou formou problematiku přiblíží. Působí na Katedře filosofie a religionistiky Evangelické teologické fakulty UK v Praze a vyučuje předměty zaměřené na religionistiku a filosofii a náboženství.'
