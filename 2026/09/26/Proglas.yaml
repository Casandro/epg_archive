  title: Slyšte, lidé!
  subtitle: Hudební výlet na Britské ostrovy 2026
  description: 'Autor a interpret: Milan Tesař * Pořad Slyšte, lidé! vám nabídne hudební výlet na Britské ostrovy, konkrétně do Anglie, Skotska, Irska a Walesu. Zazní současná hudba inspirovaná místními lidovými tradicemi ? od písničkářství přes skotské dudy a irské housle až po velšskou trojitou harfu. Představíme například Jima Causleyho, Brighde Chaimbeul, irsko-bretonské trio Harper/McCrohan/Barou, skupinu Landless nebo velšské hráčky na harfu Catrin Finch a Cerys Hafana. Výběr ukazuje, jak různorodými způsoby lze dnes pracovat s tradiční hudbou, od věrného uchovávání melodického dědictví až po experiment, improvizaci a propojení s dalšími žánry. Pořadem provází Milan Tesař. [vejlsu] [džima kózliho] [bríče chambel] [hárper mek krohen baru] [lendles] [ketrin finč] [kerys havana]'
