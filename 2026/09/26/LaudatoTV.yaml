  title: Modrave, tamo gdje Bog ljetuje - 2. dio, Tematski prilozi
  description: Najveći duhovni ljetni kamp za mlade u organizaciji zagrebačkog SKAC-a ove godine obilježava dvadeset godina postojanja. Kako izgledaju i što predstavljaju Modrave pojašnjavaju modravski sudionici u dvodijelnom dokumentarnom filmu. Ovaj mali poluotok kroz dva desetljeća pohodilo je 6.700 sudionika i 1.100 volontera koji su doživjeli susret sa sobom, prirodom i Bogom. Gledatelji mogu vidjeti kakav je raspored programa i koji su plodovi ove jedinstvene modravske priče o duhovnom i tjelesnom postanku i opstanku.
- eventId: 1061434
  start: 2026-09-26T02:53:00Z
