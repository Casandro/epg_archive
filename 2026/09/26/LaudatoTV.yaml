  title: Novo srce
  subtitle: Religijski
  description: Gošća fra Ivana Matića je profesorica pedagogije i sociologije Mara Čović. U emisiji će se prisjetiti svoga djetinjstva i vremena kada se nije smjelo otvoreno ići u crkvu, niti javno ispovijedati svoju vjeru. Kroz humanitarno djelovanje tijekom i nakon Domovinskog rata, te profesorsku struku, organizirala je brojne udruge za pomoć marginalnim skupinama poput socijalno ugroženih obitelji i djece. Njezina briga i ljubav prema ljudima na rubu egzistencije prepoznata je i putem nagrade "Josipa Vancaš - dobrotvorka godine". Brojni susreti s ljudima nagnali su je da svoja iskustva prenese i na papir, te je tako napisala nekoliko knjiga koje će predstaviti u emisiji.
