  title: Novo srce
  subtitle: Religijski
  description: U goste fra Ivanu Matiću dolazi Josip Deglin koji je animator u Kursilju. Početkom srednje škole, nakon bezbrižnog i lijepog djetinjstva, dijagnosticiran mu je osteosarkom (tumor kosti) zbog čega je morao amputirati ruku. U emisiji svjedoči kako je, nakon što je saznao za dijagnozu, imao prvi osobni i iskreni susret s Bogom te kako danas izgleda njegov život. Josipovo svjedočanstvo pravi je primjer kako čovjek kroz trpljenje i bolest može otkriti istinski smisao života i postojanja.
