  title: Babičini recepti, Babičini recepti
  subtitle: Kulinarski
  description: U prvoj epizodi druge sezone otputujte s nama u Ljubešćicu, gdje nas dočekuje babica Štefanija Vragović i kuhinja preplavljena toplinom domaćih jela. Otkrijte mirise i okuse juhe od hajdine kaše s buncekom i slatke zlijevke bogate sirom i vrhnjem - recepte koji čuvaju uspomene na djetinjstvo i okupljanja za obiteljskim stolom. Uključite se i doživite istinsku tradiciju varaždinskog kraja, prikazanu kroz priče, okuse i ljubav naših babica.
