  title: Neka nam Bog pomogne 5, serija
  subtitle: Komedija/Drama
  description: Sestra Angela je u "trzavicama" s liječnikom, ali nakon nekog početnog sukoba otkriva da joj je on mnogo sličniji nego je mislila. Zajedno uspijevaju Eugeniju, djevojčicu koja se godinama bori s tumorom, ponovno nasmijati. A mala Eugenia pomaže Valentini ponovno pronaći radost življenja. U međuvremenu, Nico i Ginevra se neprestano svađaju, a Nico se, u trenutku slabosti, okreće Mariji. Hoće li sestra Costanza uistinu ispuniti svoj san o ulasku u show Ples sa zvijezdama? A što je s Azzurrom? Hoće li smoći hrabrosti reći Athosu koja ih tajna povezuje?
