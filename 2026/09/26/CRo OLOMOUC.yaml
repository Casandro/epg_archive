  title: Olomoucké kašny
  description: Novodobé kašny v areálu Klášterního Hradiska. Soubor šesti barokních kašen v Olomouci je evropským unikátem. Přesto kolem nich často jen projdeme. V prázdninovém seriálu odhalíme příběhy nejen této národní kulturní památky. Představíme i novodobé kašny, které jsou s Olomoucí neodmyslitelně spjaté. Poslouchejte každou prázdninovou sobotu v 15.45, v repríze pak v neděli v 9.45.
