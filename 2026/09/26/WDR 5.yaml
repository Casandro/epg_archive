  title: MausLive
  subtitle: Doktor Proktors Pupspulver
  description: |-
    Bulle, ein zu klein geratener Junge mit verbeulter Trompete und verrückten Ideen unterm roten Schopf, muss umziehen. Direkt neben seinem neuen Zuhause wohnt der Erfinder Doktor Proktor, ein genialer Erfinder mit gebrochenem Herzen, der so zugewachsen und struppig ist, wie sein Garten. Lise wohnt gegenüber, ist vielleicht nicht so vorlaut wie Bulle, aber dafür sehr gut im Nachdenken. Gemeinsam vollenden die drei die Rezeptur für ein Pupspulver...
    Regie: Annette Kurth<br/>Produktion: WDR <markup type="abbr" abbreviation="2015" correspondent="zweitausendfünfzehn">2015</markup>
