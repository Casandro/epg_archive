  title: Memex Nautilus - La Specie Umana - Noi S
  subtitle: Memex Nautilus - La Specie Umana - Noi Sapiens - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri andiamo alla scoperta del m
  description: "ondo che ci circonda e delle sue regole. In questa puntata ci occupiamo di noi, della Specie Umana. Siamo Homo Sapiens. Sette miliardi e mezzo di individui, tutti imparentati. Veniamo dall'Africa e siamo la specie con il più forte impatto sul Pianeta. Per descriverci sono con noi in studio Telmo Pievani, professore di Filosofia delle Scienze Biologiche all'Università di Padova, e Massimo Delledonne, professore di Genetica all'Università di Verona. In Sardegna con Francesco Cucca, direttore dell'istituto di Ricerca Genetica e Biomedica del CNR, e con l'archeologo Luca Lai scopriamo che i geni dei sardi raccontano anche la storia dei nostri antenati. Anna Pancaldi ci parla di una vera e propria rock star della genetica e di una spedizione molto discutibile. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
