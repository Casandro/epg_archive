  title: 'Memex Donne di Scienza - p. 06: Marcella'
  subtitle: 'Memex Donne di Scienza - p. 06: Marcella Frangipane - Le donne che sono diventate icone dell''universo scientifico non sono certo le sole che hanno operato con successo nel mondo della scienza, ma sono quel'
  description: "le che hanno aperto la strada alle altre, con la loro volontà, la loro abilità, con talento e protervia, in un mondo a volte apertamente ostile. In questo programma incontriamo le ricercatrici italiane più affermate di oggi e raccontiamo le storie delle grandi protagoniste della scienza del passato. Protagonista di questa puntata è Marcella Frangipane. - \n\nUn programma di Silvia Bencivelli, Francesco Linguiti, Diego Garbati e Armando Traverso - Produttore esecutivo Diego Garbati e Livia Lauriola - Regia di Nicoletta Piu e Giancarlo Russo - Interviste di Silvia Bencivelli - Condotto da Chiara Buratti"
- eventId: 1171986
