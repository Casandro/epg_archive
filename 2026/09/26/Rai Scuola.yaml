  subtitle: 'Progetto Scienza 2022 Le Nostre Domande - p. 05 - Peter Ratcliffe: Cos''è la malattia? - Peter Ratcliffe: Cos''è la malattia? Le Nostre Domande è il programma di Rai Cultura che affronta alcuni dei grandi te'
  description: "mi del nostro tempo attraverso una serie di incontri con personaggi di primo piano del mondo culturale, scientifico e artistico del nostro presente. È il filosofo della scienza dell'Università di Padova, Prof. Telmo Pievani, a porre ''le nostre domande'' a premi Nobel, scienziati, scrittori, artisti di fama internazionale, per conoscere il loro punto di vista, la loro visione del mondo, per aprire con loro la discussione sulle nuove domande per il futuro e comprendere chi potrà fornire le nuove risposte. Nella storica Sala dei Giganti di Palazzo Liviano, sede dell'Università di Padova, in questa puntata Telmo Pievani incontra Sir Peter Ratcliffe. Professore, scienziato e medico britannico, Sir Peter Ratcliffe nel 2019 è stato insignito del premio Nobel per la Medicina e la Fisiologia per le scoperte su come le cellule percepiscono e si adattano alla disponibilità di ossigeno. Dirige il Centro per la ricerca clinica dell'Istituto Francis Crick di Londra ed è membro dell'Istituto Ludwig per la ricerca sul cancro e della Royal Society. Ed è a lui che chiediamo: cos'è la malattia? - \n\nUn programma di Nicoletta Piu e Telmo Pievani, con la collaborazione di Diego Garbati e Giuseppe Cembalo, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Nicoletta Piu, conduce Telmo Pievani"
