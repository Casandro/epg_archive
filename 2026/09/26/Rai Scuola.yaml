  title: Progetto Scienza Newton (pt. 30) Oltre i
  subtitle: Progetto Scienza Newton (pt. 30) Oltre il cielo, le orbite attorno alla Terra - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospi
  description: "ta Marina Ruggieri, ingegnere aerospaziale. Insieme a lei facciamo un viaggio attorno alla Terra, esplorando le orbite che ospitano i satelliti e non solo. Scopriamo quanti sono gli oggetti che abitano lo spazio intorno al nostro pianeta, come sono fatti, a cosa servono e secondo quali leggi si muovono. Parliamo della vocazione italiana per lo spazio e cosa ci attende nel futuro dell'esplorazione delle orbite terrestri. Luca Perri, astrofisico e cacciatore di bufale scientifiche, rivela cosa c'è dietro gli investimenti nella ricerca aerospaziale e risponde alla domanda: cosa andiamo a fare nello spazio? - \n\nUn programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga."
