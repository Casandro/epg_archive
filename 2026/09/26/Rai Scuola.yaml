  title: Progetto Scienza STEM - p. 08 - Crimine
  subtitle: Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo della rice
  description: "rca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna in un viaggio nel mondo del crimine, perché anche la ricerca della soluzione di un crimine coinvolge sempre di più le Scienze. Gli esperti che analizzano le tracce dei crimini collaborano con le Procure di tutta Italia per fare chiarezza e restituire un racconto oggettivo dei fatti criminosi. Le Scienze Forensi stanno facendo passi da gigante, anche grazie alle nuove tecnologie. Ci raccontano il loro lavoro sul campo il Colonnello Sergio Schiavone, Comandante dei R.I.S. (Reparti Investigazioni Scientifiche) di Roma, Cristina Cattaneo, Medico Legale a capo del Laboratorio di Odontologia e Antropologia Forense LABANOF dell'Università degli Studi di di Milano, Danilo De Angelis, Odontologo Forense, Giulia Caccia, Naturalista, Marco Faimali, Direttore dell'Istituto per lo studio degli impatti Antropici e Sostenibilità in ambiente marino IAS del CNR, Mario Venturi Imprenditore e ideatore di un software di pre-crimine e Maurizio Sanarico Chief Data Scientist. - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
