  description: "e operano i ricercatori e degli ambienti naturali oggetto delle loro ricerche. Il racconto è affidato alla conduttrice Chiara Buratti che esplora i luoghi della scienza italiana svelandone l'orizzonte culturale e naturalistico, ma anche la passione per la scienza dei protagonisti dei più importanti progetti di ricerca. In questa puntata dedicata alle navi oceanografiche in Italia, andiamo in Friuli-Venezia Giulia, a Trieste, per salire a bordo della rompighiaccio 'Laura Bassi' dell'Istituto Nazionale di Oceanografia e Geofisica Sperimentale e conoscere l'attività scientifica portata avanti durante le sue missioni. A raccontarci la storia di questa importante e unica imbarcazione e dei progetti di ricerca che ospita sono Franco Coren, Direttore Infrastrutture Navali dell'OGS, e alcuni ricercatori dell'OGS: l'oceanografo Manuel Bensi, il geologo marino Michele Rebesco e la glaciologa Florence Colleoni. Ci spostiamo poi in Liguria dove naviga la 'Alliance', la nave oceanografica del CMRE, l'unico centro di ricerca e sperimentazione marittima della NATO, che ha sede a La Spezia all'interno della base della Marina Militare Italiana. A bordo della nave oceanografica ci fanno conoscere gli strumenti e le attività il Comandante della Nave Alliance Pasquale Perrina (Marina Militare Italiana), l'Ufficiale di Staff Paolo Lombardi (NATO STO-CMRE), insieme all'oceanografo Sandro Carniel (Capo Divisione Ricerca NATO STO-CMRE) e all'ingegnere Alain Maguer (Capo Divisione Ingegneria NATO STO-CMRE). - \n\nUn programma di Federica De Maria, con la collaborazione di Giuseppe Cembalo, e Diego Garbati, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Mario Ferrari, conduce Chiara Buratti"
