  title: Memex Nautilus - Attratti dalla Luna
  subtitle: Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. Il tema di q
  description: "uesta puntata è l'Astro d'argento, l'unico satellite naturale del pianeta Terra, oggetto di culto e adorazione fin dalla notte dei tempi e oggi più che mai al centro dei piani strategici delle agenzie spaziali più importanti: la Luna. A tenerci per mano in questo 'viaggio' sono due donne: la planetologa dell'Inaf Maria Cristina de Sanctis e la responsabile dell'Unità Esplorazione e Osservazione dell'Universo dell'Agenzia Spaziale Italiana, Barbara Negri. Al Dipartimento di Scienze e Tecnologie Aerospaziali del Politecnico di Milano, scopriamo poi con la professoressa Michéle Lavagna alcune delle meraviglie tecnologiche (sonde e lander) che si stanno sviluppando in Italia per le prossime missioni sulla Luna. Anna Pancaldi ci racconta invece la storia di un piccolo libro (appena 56 pagine) che ha segnato una svolta epocale nella nostra storia: il 'Siderus Nuncius' di Galileo Galilei. Ci svela anche alcuni curiosi retroscena della famosissima frase pronunciata da Neil Armstrong, appena messo piede sulla Luna: Un piccolo passo per un uomo, un grande passo per l'umanità. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
- eventId: 1180767
  start: 2026-09-26T07:00:00Z
  stop: 2026-09-26T08:00:00Z
  title: Oceani del sistema solare
  subtitle: Gli oceani definiscono la Terra. Sono fondamentali per la vita e un tempo pensavamo che fossero un'esclusiva del nostro pianeta azzurro. Ma ci sbagliavamo. Recentemente è stato scoperto che esistono oceani in tutto il no
  description: "stro sistema solare, molto simili ai nostri. Ora gli scienziati stanno intraprendendo un viaggio alla ricerca di nuove forme di vita in luoghi che ritenevamo inadatti. La NASA sta persino progettando di immergersi con un sottomarino nelle profondità di un lontano oceano. la caccia agli oceani nello spazio sta segnando l'alba di una nuova era nella ricerca. - \n\n"
- eventId: 1180768
  start: 2026-09-26T08:00:00Z
  stop: 2026-09-26T08:35:00Z
  title: Progetto Scienza STEM - p. 15 - Motori
  subtitle: Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo della ricer
  description: "ca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna alla scoperta della tecnologia più importante e in evoluzione del settore automotive: il motore. Siamo di fronte a una tecnologia che sta cambiando e promette di mutare il mondo in cui viviamo. Ci raccontano la frontiere della ricerca e della nuova mobilità Davide Barana, direttore tecnico di Ducati Corse; Laura Cozzi, chief energy modeller all'Agenzia internazionale dell'Energia, a Parigi; Giulia Marchisio, chimica industriale e oggi program manager per l'area additive manufacturing al CIM 4.0, il Competence Center di Torino; Francesca Soavi, che all'Università di Bologna e al nuovo Centro di Ricerca Ambiente Energia e Mare del Tecnopolo di Ravenna sta lavorando a un'innovativa batteria, a ricarica 'liquida'; Dino Brancale e Federico Ferrero, che a Cavriago di Reggio Emilia progettano la tecnologia necessaria a realizzare un motore ibrido per grandi automezzi e veicoli commerciali, un motore a combustione interna alimentato a idrogeno. - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
