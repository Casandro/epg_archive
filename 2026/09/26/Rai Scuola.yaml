  title: Paesaggi Vitivinicoli Langhe Roero e Mon
  subtitle: 'Paesaggi Vitivinicoli Langhe Roero e Monferrato Ep. 2 - Le dolci colline -Il sito UNESCO dei Paesaggi vitivinicoli del Piemonte: Langhe-Roero e Monferrato - Dalla tenuta di Fontanafredda, a Serralunga d''A'
  description: "lba, nel cuore del Piemonte, Chiara Buratti ci accompagna in un viaggio alla scoperta dei \"Paesaggi vitivinicoli Langhe-Roero e Monferrato\", dichiarati Patrimonio mondiale dell'Umanità dall'Unesco nel 2014. A dieci anni dal riconoscimento universale, quest'area geografica che si estende per circa 11.000 ettari nella parte meridionale del Piemonte, continua a essere oggetto di studio e di valorizzazione per la sua tutela culturale, economica, sociale e ambientale. Lo scopriamo in modo dettagliato grazie alle testimonianze di Luca Mercalli, Presidente della Società Meteorologica, e di Mario Tozzi, Primo ricercatore CNR e divulgatore scientifico. Conosciamo anche i protagonisti del territorio impegnati in prima linea tra tradizione e innovazione in campo vitivinicolo, come Attilio Pecchenino, viticoltore in Dogliani e Michela Adriano, vignaiola in Alba, insieme al professore Antonio Potenza dell'Istituto Nicola Pellati di Nizza Monferrato e alla biotecnologa Antonella Costantini del CREA - Consiglio per la ricerca in agricoltura e l'analisi dell'economia agraria - di Asti. Gli economisti Irene Rotellini e Guido Guerzoni si soffermano sulla ricerca dedicata agli impatti socioeconomici del titolo Unesco prodotta in occasione del decennale, cui si aggiungono le riflessioni di Giovanna Quaglia e Bruno Bertero, rispettivamente Presidente e Direttore del sito UNESCO \"Paesaggi Vitivinicoli del Piemonte: Langhe-Roero e Monferrato\", e dell'antropologo Piercarlo Grimaldi. - \n\n"
