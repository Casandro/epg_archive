  title: Planet Weltweit - Australien - Wenn Kunst auf Silos trifft
  subtitle: Planet Weltweit - Australien - Wenn Kunst auf Silos trifft
  description: 'Ein Projekt der Superlative: In Australien verwandeln Künstlerinnen und Künstler riesige Weizensilos in gigantische Leinwände. Es ist die größte Freiluft-Galerie der Welt, die Leben und Farbe dorthin zurückbringt, wo es immer weniger davon gab: in kleinen, fast vergessenen Ortschaften. Als die kleine australische Stadt Northam vor ein paar Jahren beschloss, ihre großen, leerstehenden Weizensilos von einem lokalen Künstler bemalen zu lassen, ahnte noch niemand, was für ein Erfolg dies werden würde. Plötzlich strömten Touristen und Besucher aus allen Teilen des Landes herbei, und der kleine Ort war plötzlich in aller Munde. Kein Wunder, dass bereits ein Jahr später eine andere Stadt nachzog und ihre Silos ebenfalls mit Alltagsszenen gestalten ließ. Inzwischen gibt es schon 44 dieser Riesenkunstwerke, die meisten davon auf einer fast 200 km langen Route, dem Silo Art Trail, dem Silo-Kunst-Pfad. Auch die Stadt Goroke will jetzt dazugehören. Die Motive haben die Einwohnerinnen und Einwohner selbst ausgesucht: einen Kookaburra oder Jägerliest und eine Australische Elster. Als Künstler entschied sich die Stadt für Geoffrey Carran, der bekannt ist für seine lebensechten Vogelporträts. Ein solch großes Gemälde hat Geoffrey bisher noch nie gemalt, und so ist dieser Open-Air-Auftrag auch für ihn eine Herausforderung. Nicht nur die Größe der stillgelegten Weizensilos muss nämlich in Betracht gezogen werden, sondern auch die Komposition der Bilder ist wichtig. Schnell merkt Geoffrey, dass er mit den beiden Vögeln allein nicht auskommt. Und so will er nun noch einen dritten Vogel malen: einen Rosakakadu, der sich harmonisch zwischen die anderen beiden einfügt. Aber das ist nur eine von vielen Überraschungen und Unwägbarkeiten, die solch ein Projekt mit sich bringt, wenn Kunst auf Silos trifft.  DE 2020'
