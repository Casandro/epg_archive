  title: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  subtitle: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  description: "Bachit ist ein cleverer Hirte. Längst hat der 40-jährige Kirgise begriffen, dass sich etwas  Entscheidendes verändert in seiner Heimat, dem an der Grenze zu China gelegenen Tien Shan Gebirge:  Die bis zu 7000 Meter hohen Gipfel tauen rasant im Vergleich zu früheren Jahrzehnten. Eine Folge  der Klimaerwärmung, mit noch ungeahnten globalen Auswirkungen. Bachit hat sich auf die neue  Situation eingestellt: Seit mehreren Jahren treibt er im Mai seine riesige Viehherde aus dem Dorf  auf eine 3000 Meter hohe Sommeralm - und ist dabei zunehmend Schwierigkeiten ausgesetzt. \n\nDer Kirgise Bachit lebt von der traditionellen Weidewirtschaft. Die Wiesen rund um die Dörfer sind  nach dem Winter abgefressen und die Tiere müssen auf neues Land geführt  werden. Darum treibt  Bachit jedes Jahr im Mai seine Herden aus Kühen, Schafen, Pferden und Yaks zusammen, und zieht auf  eine 3000 Meter hoch gelegene Sommerweide. Denn Dank der Klimaerwärmung sind heute auch die hoch  gelegenen Almen begrünt. Auf zwei uralten, voll beladenen LKW, die dem langsamer ziehenden  Viehtreck vorausfahren, ist der gesamte Hausrat verschnürt. Bachit und seine Männer geleiten die  Herde über 120 Kilometer   bergauf.  Viele der Jungtiere verletzen sich auf der Strecke und müssen  den Rest des Weges auf dem LKW transportiert werden. Besonders gefährlich ist die Überquerung der  reißenden Gebirgsströme, deren Wassermassen wegen der rasant schmelzenden Gletscher von Jahr zu  Jahr zunehmen. Vier Monate lang lässt der Hirte seine Herden auf den Hochalmen des Tien Shan  Gebirges weiden, bevor der ganze Treck wieder hinab ins Tal steigt, um im Dorf zu überwintern. Für  Bachit macht sich das Nomadenleben nach alter kirgisischer Tradition bezahlt.  Er hat die  klimatischen Veränderungen als Chance gesehen und ist darüber ein wohlhabender Mann geworden. Doch  auch er fragt sich: Wie wird sich das Fortschreiten der Gletscherschmelze zukünftig auswirken?  DE 2009"
