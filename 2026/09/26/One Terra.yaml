  title: Planet Weltweit - Die Vespa-Rebellen in Indonesien
  subtitle: Planet Weltweit - Die Vespa-Rebellen in Indonesien
  description: 'Indonesien schwingen sich Tausende junge Leute auf alte, umgebaute Vespa-Roller, um auf friedliche Art zu rebellieren. Gegen Langeweile und Chancenlosigkeit. Sie sind Anhänger der sogenannten "Extrem-Vespa-Szene", tätowiert, gepierct, tragen womöglich Dreadlocks. Höhepunkt ist das große Vespa-Roller-Jahrestreffen in der Stadt Kediri auf der Hauptinsel Java. Hier muss alles passen. Denn es geht nicht nur um Spannung und Spaß. Es geht auch ums Gewinnen. GEO Reportage war vor Ort. Vespas, die Italo-Roller von Piaggio, wurden lange auch in der Hauptstadt Jakarta hergestellt. Heute kostet eine alte Vespa umgerechnet 20 Euro, so viel kann sich ein junger Indonesier leisten. Im Gegensatz zu anderen Rollern wird bis heute an Vespas kein Kunststoff verbaut. Sie sind aus Metall und lassen sich gut umschweißen. Ideal für die Anhänger der "Extrem-Vespa-Szene". Sie fahren keine gewöhnlichen Motorroller wie Millionen andere Indonesier. Extrem-Vespa-Fans schweißen und schrauben Tag und Nacht an ihren Fahrzeugen. Vor allem jetzt, wo der Höhepunkt des Jahres ansteht: das große Szene-Treffen in Kediri, in Ost-Java. Das Festival lockt bis zu 50.000 Besucher aus ganz Indonesien an. Die Entfernungen sind teils erheblich. Viele sind Tage oder sogar Wochen unterwegs zum Event. Nicht so weit haben es Tajab und sein Freund Blablu, die selbst in Kediri leben. Sie wollen eine ganz besondere Vespa an den Start bringen: für die Wettbewerbskategorie "Schönheit", bei der das kreativste Gefährt gekürt wird. Aber was soll das Besondere ihrer Vespa sein? Die beiden durchforsten Werkstätten und Ersatzteilmärkte, um sich inspirieren zu lassen. Werden sie auf gute Ideen kommen? Und wie groß ist die Konkurrenz auf dem diesjährigen Festival? DE 2019'
- eventId: 1150506
  start: 2026-09-26T20:15:00Z
