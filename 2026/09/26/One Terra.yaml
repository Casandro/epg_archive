  title: Rund um den Globus - Indien - Haare für die Götter
  subtitle: Rund um den Globus - Indien - Haare für die Götter
  description: Die Rasiermesser schaben ununterbrochen, legen Stück für Stück die darunter liegende Kopfhaut frei. Die Friseure arbeiten im Akkord, die Wartenden werden im Minutentakt auf die flachen Bretter bugsiert, die als provisorische Schemel dienen. Unter ihnen sind heute der zehnjährige Balaji und seine Mutter Sumati Jayapathi. Sie sind in die Tempelanlage von Palani gekommen, um ihr Haar zu opfern. Im Gegenzug dafür erhoffen sie sich von Gott Murugan Segen für den Bau eines eigenen kleinen Hauses. Mehrere Millionen Menschen pilgern jedes Jahr nach Palani. Zurück lassen sie Tonnen von geopfertem Haar, das der Tempel verkauft. Seit sich Haarverlängerungen und Echthaarperücken weltweit zunehmender Beliebtheit erfreuen, boomt das Geschäft. Die Reportage hat Balaji und seine Mutter begleitet.  DE 2013
