  title: Rund um den Globus - Die ungewöhnliche Großfamilie
  subtitle: Rund um den Globus - Die ungewöhnliche Großfamilie
  description: "In Russland, am Fuße des Südurals, lebt die Familie von Nikolai Stremski. Zu ihr zählen 60 Kinder, die aus den unterschiedlichsten Winkeln des Landes stammen. Alle tragen einen gemeinsamen Familiennamen - Priester Nikolai Stremski hat sie alle adoptiert. Damit der Haushalt der Stremskis funktioniert, kümmern sich die Großen um die Kleinen - und jedes Kind übernimmt Aufgaben. \n DE 2011"
