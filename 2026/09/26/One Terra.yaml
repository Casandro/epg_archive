  title: Planet Weltweit - Der Exzentriker der Düfte
  subtitle: Planet Weltweit - Der Exzentriker der Düfte
  description: "Parfüm - ein Produkt, ein Zauber, eine Kultur, untrennbar verbunden mit Frankreich, den riesigen Blumenfeldern von Grasse, den Pariser Salons, Namen wie Chanel, Dior und Guerlain. Eine weltweit operierende Parfümindustrie kreiert immer neue Düfte und verdient Milliarden. Doch es gibt noch Spezialisten abseits der großen Namen und des Massenumsatzes.\n\nDer ehemalige Kreativdirektor von Guerlain, Gilles Thévenin, hat Lubin, eines der ältesten Parfümhäuser Frankreichs, vor dem Untergang bewahrt. Nun kreiert er gemeinsam mit Delphine Thierry, einer unabhängigen Parfümeurin aus der Provence, einen orientalischen Duft für die Luxusmarke, inspiriert vom sagenhaften Mesopotamien, der Göttin Ischtar und dem Herrscher Sargon. \n\nGilles Thévenin sitzt in seinem Pariser Büro im Viertel Les Halles. Hier regiert der Schick der 30er Jahre, die eine ruhmreiche Epoche für das Parfümhaus Lubin waren. Große Düfte wie 'Nuit de Longchamp' entstanden in dieser Zeit und gingen in die Geschichte ein. Diese Geschichte begann vor mehr als 200 Jahren mit Pierre-François Lubin. Sein Porträt hängt heute in Gilles' Büro, direkt über seinem Arbeitstisch, auf dem es nur so wimmelt von glitzernden Fläschchen mit geheimnisvollen Flüssigkeiten.\n\n\"Ein Parfüm zu kreieren, dazu bedarf es zweier Begabungen: Man muss ein Architekt sein, aber auch ein Dichter\", so Gilles Thévenin. Entscheidend sind auch die Rohstoffe, von denen einige der kostbarsten noch immer aus den Blüten der provenzalischen Felder gewonnen werden. Am Tisch sitzt außer Gilles Thévenin, dem kreativen Kopf Lubins, noch Thomas Fontaine, eine seiner \"Nasen\". Vor ihnen liegt ein uraltes Buch von unschätzbarem Wert: das handgeschriebene, über 200 Jahre alte Formelbuch von Pierre-François Lubin. Wird der neue Duft aus Weihrauch, Kardamom und Muskatellersalbei den Markt erobern können? DE 2012"
