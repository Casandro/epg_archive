  title: Planet Weltweit - Finnland, die rasenden Schrottkisten
  subtitle: Planet Weltweit - Finnland, die rasenden Schrottkisten
  description: Mitten im Sommer findet im nordfinnischen Örtchen Pello ein ganz besonderes Autorennen statt. Vier Tage lang dröhnen dann die Motoren in der sonst eher stillen und friedlichen Landschaft. Mit hoch motorisierten, farbenfrohen Blechkisten voller Beulen und Schrammen geht es wieder und wieder an den Start. 750 Rennfahrer wetteifern um die Gunst des Publikums und Siegerpokale. Jeder kann teilnehmen, unabhängig von seiner Erfahrung und seinen Möglichkeiten. Das Spektakel zieht massenhaft Besucher an. Es ist eine Instanz in Skandinavien. GEO Reportage war vor Ort. Timo ist einer dieser Rennbegeisterten, der sogenannten "Jokkis". Getreu den Idealen des Landes bedeutet der Begriff wörtlich "jedermanns Welt", denn jeder ist willkommen auf dem Renn-Fest. Die Form des nicht-exklusiven Rallycross stammt aus Finnland und ist heute in allen nordischen Ländern sehr beliebt. Und Pello ist das Mekka für alle Rallyfans. Die Rennen finden auf einer Strecke im Wald statt. Jeden Sommer versammeln sich dort Tausende von Enthusiasten, um diese spektakulären Rennen zu verfolgen. Die vielen Kurven und unterschiedlichen Bodenbeläge werden sorgfältig vorbereitet, um den Autofahrern das Leben schwer und das Rennen spannend zu machen. Gemeinsam mit seinem Freund Mika hat Timo im vergangenen Herbst einen alten Volvo gekauft, der jetzt für die große Rally aufgemotzt werden soll. Timo ist auch Mitglied im "Pello Motor Sports Club", der die Veranstaltung seit über dreißig Jahren organisiert. Mit an den Start gehen aber auch andere Einwohner von Pello. Vor allem auf Anne-Mari freuen sich viele. Sie ist ein ehemals sehr erfolgreicher Star in der Rally-Szene. Viele Jahre ließ sie alle Konkurrentinnen hinter sich. Nach längerer Pause will sie es nun wieder einmal wissen. Hoch motiviert geht auch sie an den Start.  DE 2019
- eventId: 1150514
  start: 2026-09-26T21:15:00Z
  stop: 2026-09-26T22:07:00Z
  title: Planet Weltweit - Spitzbergen - eisige Insel
  subtitle: Planet Weltweit - Spitzbergen - eisige Insel
  description: |-
    Der arktische Herbst ist kurz. Bereits Ende September bereiten sich die Bewohner Spitzbergens auf den langen, dunklen Winter vor. Wer kann, verlässt jetzt die Inseln. Eine kleine Gruppe von Menschen bleibt jedoch. Es sind vor allem Studenten, Wissenschaftler und Logistiker: Zu ihnen gehört Rupert Krapp. Seit Ende der 1990er Jahre lebt er in Longyearbyen, dem größten Ort auf der  Hauptinsel. Von hier aus beliefert er all jene, die in einsamen Stationen und auf  Forschungsschiffen  versorgt werden müssen.

    Abende wie dieser, an denen er Freunde treffen und gemeinsam kochen kann, sind während der  geschäftigen Sommermonate selten in Rupert Krapps Alltag. Zwischen Mai und Ende September versorgt der Logistiker Kreuzfahrtschiffe, Transportfrachter der Kohleindustrie, Forschungsstationen oder  Feriencamps. Denn wer auf Spitzbergen lebt, hat immer einen Auftrag und muss seine kostbare Zeit  zum Arbeiten, zum Studieren oder Forschen nutzen. Erst im Winter rücken die wenigen Bewohner, die  auf der Hauptinsel bleiben, zusammen. Einer von Rupert Krapps Gästen, der es schon sechs Jahre auf  Spitzbergen aushält, ist der Geologe Malte Jochmann. Im Auftrag eines norwegischen Konzerns  untersucht er die reichen Kohlevorkommen der Inselgruppe. In diesem Herbst machte der Münchner in einem Flöz Hunderte Meter unter der Erde einen besonderen Fund: er entdeckte Fußabdrücke eines Dinosauriers. An zwei freien Tagen zieht es Malte Jochmann hinaus in die Weite der arktischen  Tundra. Zusammen mit seiner Freundin geht er auf Rentierjagd - ein Privileg, das auf Spitzbergen jedem Einwohner nach einigen Jahren zugestanden wird. Es ist vielleicht ihre letzte Chance in diesem Jahr, bevor sich die "Kalte Küste" - wie die Norweger die Inselgruppe nennen - in eine menschenfeindliche Gegend verwandelt.  DE 2010
  ageRating: 6
