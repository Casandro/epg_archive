  title: Planet Weltweit - Arnika - Von der Kraft einer Heilpflanze
  subtitle: Planet Weltweit - Arnika - Von der Kraft einer Heilpflanze
  description: 'Das Vertrauen in die Heilkraft der Pflanzen ist so alt wie die Menschheit, und in den letzten Jahren erlebt die Kräutermedizin in ganz Europa eine Arte Renaissance. In den Vogesen, im Osten Frankreichs, gibt es zahlreiche wild wachsende Heilpflanzen wie auch die eigenwillige Arnika montana. Tinkturen und Salben aus Arnika helfen gegen Prellungen, Ödeme, Muskel- und Gelenkschmerzen. Labors aus ganz Frankreich warten jedes Jahr voller Ungeduld auf die wenigen Erntetage für die kleine Blume. GEO Reportage wandelte einen Sommer lang auf ihren. Seit einigen Jahren trägt Clément Urion die Bürde, das offizielle Pflück-Datum für die Arnikaernte freizugeben. Der Kräutersammler, der mit seinem sechsköpfigen Team auf seinem Bauernhof La Ferme du Bien-être aus Kräutern und Heilpflanzen ätherische Öle, Blütenwasser und Kräutertees herstellt, ist einer der wenigen, die die Pflanze offiziell ernten dürfen. Tausende Wildpflanzen wachsen heute noch in den Vogesen, doch nur 148 Arten dürfen von den Kräutersammlern gepflückt und weiterverarbeitet werden. Jedes Jahr im Juni gehört seine ganze Aufmerksamkeit der Arnika montana. Den Großteil der Ernte bekommt das bekannte Natur-Kosmetikunternehmen Weleda, dessen Chef Denis Graeffly erklärt, warum die Arnika so wichtig ist: "Sie ist eine führende Pflanze. Das heißt, sie ist Teil vieler Weleda-Produkte. Sie ist auch auf therapeutischer Ebene wichtig, sie hat viele Wirkungen auf dieser Ebene. Und auch für Kosmetika, besonders für eine externe Anwendung, hauptsächlich in der Form von Öl". Kräutersammler zu sein, ist nicht nur eine Kunst sondern auch ein Beruf. Doch jede Menge Hürden und Gesetzgebungen machen Leuten wie Clément Urion das Leben schwer.  DE 2018'
