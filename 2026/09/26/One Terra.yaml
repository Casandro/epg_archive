  title: Planet Weltweit - Lust auf Liebe in Lisdoonvarna
  subtitle: Planet Weltweit - Lust auf Liebe in Lisdoonvarna
  description: 'An der Westküste Irlands liegt der Ort Lisdoonvarna, berühmt für seine heilenden Quellen und urigen Kneipen - und als Treffpunkt einsamer Herzen. Hier werden seit über 150 Jahren Paare verkuppelt, eine Tradition, die der Heiratsvermittler Willie Daly noch heute mit Begeisterung praktiziert. Im September findet das Matchmaking-Festival statt. Ohne Zweifel sind die Pubs in Lisdoonvarna seit jeher die wichtigsten Orte, um Kontakte zu knüpfen. Doch nicht nur Guinness und Whisky sprudeln hier, Heilquellen haben Lisdoonvarna vor über 150 Jahren zum einzigen Kurbad Irlands gemacht. Das brachte damals viele Kurgäste und zog die Farmer der entlegenen Höfe an. Im Herbst nach der Ernte, kamen sie in den Ort auf der Suche nach einer Frau. Unterstützung bekamen sie dabei von Heiratsvermittlern. Schon der Vater von Willie Daly, sein Großvater und sein Urgroßvater waren solche "Matchmaker", wie die Iren hier sagen. Die Tradition wird auch heute noch weitergeführt. In diesem Jahr übergibt Willie Daly die Aufgabe an seine Tochter Marie. Wie ihr Vater setzt auch sie auf die alten Matchmaker-Fähigkeiten: Menschenkenntnis, Intuition und den sanften Schubs im richtigen Moment. "Paare zusammenbringen ist hier leicht", sagt Willie Daly, "wo ist es denn romantischer als bei uns!" Die berauschend schöne Landschaft der Westküste Irlands mit der bergigen Karstlandschaft, den sanften Hügeln in ihrem satten Grün, mit den weiten Stränden und wilden Klippen ist in der Tat bestens geeignet, um Herzen zu öffnen. Traditionell wird in Lisdoonvarna jedes Jahr im September das "Matchmaking-Festival" veranstaltet. In den Pubs und Tanzsälen treffen sich heute nicht mehr nur Singles aus Irland, sondern aus aller Welt. DE 2005'
