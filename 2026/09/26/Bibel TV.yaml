  title: Don Matteo
  subtitle: Wo ist unsere Tochter?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sofia Lotieri soll von einem mehrtägigen Ausflug zurückkehren, jedoch müssen ihre Eltern bei der Ankunft des Busses erschrocken feststellen, dass Sofia den Ausflug gar nicht mitgemacht hat. Daraufhin beginnt eine großangelegte Suchaktion, bei der allerdings nur ihr blutverschmierter Motorroller gefunden wird. Erst als Severino auf ihrem Computer einen versteckten Account für ein soziales Netzwerk findet, kann Don Matteo Sofia anhand ihres Namens finden. Sie ist allerdings schwer verletzt und wurde anscheinend stümperhaft operiert. Dank eines unbewussten Hinweises von Natalina kann Don Matteo die Polizei schließlich auf die richtige Spur zur Lösung des Falles bringen.'
