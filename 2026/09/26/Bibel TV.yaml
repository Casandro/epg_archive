  title: Ein Hauch von Himmel
  subtitle: Bilder eines Vaters
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Fotografieren ist die große Leidenschaft des 17-jährigen Jason Harris. Er hat einen hervorragenden Blick für das richtige Motiv und arbeitet fleißig an seinen Fähigkeiten, um später einmal Fotojournalist zu werden. Dabei ist es schon ein kleines Wunder, dass er überhaupt noch sehen kann. Ein Sportunfall im Alter von zwölf Jahren hätte ihn fast das Augenlicht gekostet. Nur durch das Geschick seines Vaters Will, eines Augenarztes von großem Ruf, wurden Jasons Augen damals gerettet. Der Junge verehrt seinen Vater wie einen Helden. Umso schwerer trifft ihn der Schlag, als er herausfindet, dass sein großes Vorbild ein schlimmes Geheimnis verbirgt. Jason kann mit der Last dieses Wissens nicht leben; enttäuscht und wütend beginnt er mit zerstörerischem Verhalten, das ihn und seine Familie an den Rand des Abgrunds führt. Können die Engel Monica, Tess und Andrew der Familie Harris helfen, bevor das Geheimnis sie zerstört?'
  genre:
