  title: Das große Rudy-Giovannini-Wunschkonzert
  subtitle: Das große Rudy-Giovannini-Wunschkonzert
  description: Die beliebtesten Wunsch-Hits des Tenors aus Südtirol, Rudy Giovannini, werden in dieser Sendung erfüllt. Mit strahlenden Tönen, die Rudy mit Leichtigkeit auch ohne technische Unterstützung singt, begeistert er seit über 20 Jahren seine Fans in ganz Europa. Aber auch Rudys große Liebe, mit leisen zärtlichen Tönen, mit Herz und Gefühl Emotionen zu wecken, kommt in dieser Sendung nicht zu kurz. Erfahren Sie viel Wissenswertes über Privates sowie die Karriere des Ausnahme-Interpreten Rudy Giovannini. Ge 2021
