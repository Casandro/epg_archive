  title: Muss i denn zum Städtele hinaus
  subtitle: Muss i denn zum Städtele hinaus
  description: Dr. Werner Koch rettet seinem Freund Ronald Brown während einer Bergtour mit einer Notoperation das Leben. Er lässt sich daraufhin in seinem Heimatdorf Herdingen nieder und verliebt sich dort in die junge Waise Heidi. Obwohl sie seine Gefühle erwidert, ist sie immer noch ihrem verschwundenen Studenten nach. Als Ronald Brown ins Dorf zurückkehrt, wird klar, dass er der Student ist, dem Heidi nachtrauerte. Ge 1962
