  description: Michael und Tara haben gerade frisch geheiratet, als sie mit ihrem Auto in einer entlegenen Landschaft ein stilles Plätzchen suchen. Ohne es zu merken bewegen sie sich auf dem Gelände eines heruntergekommenen Frauengefängnisses. Sie werden abgeführt und zu der Knastchefin gebracht. Diese erkennt in Tara ein wegen Drogenmissbrauchs verhaftetes Mädchen und behält sie gleich da. Michael flüchtet und versucht Hilfe zu holen. In der Zeit wird seine Frau aber an einen schmierigen Gouverneur verkauft.. Ge 1980
