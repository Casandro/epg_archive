  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Mit Leib und Seele lieben - Das Sakrament der Ehe
  description: |-
    Das Sakrament der Ehe beleuchten Tobias und Maria Riegger in der elften Folge des Kath-Kurses. Ist es überhaupt möglich, ein ganzes Leben lang nur einen Menschen zu lieben? Sind Hingabe und Treue mehr als nur romantische Fiktion? Wie kann es praktisch aussehen, die Liebe lebendig zu halten?

    Der Kath-Kurs, ein katholischer Glaubenskurs, der die Schönheit des Glaubens und der Kirche nicht nur vom Verstand her, sondern auch fürs Herz erfahrbar macht: Dies ist in Gänze nur möglich, wenn der Kurs vor Ort in der Pfarrei stattfindet, da die persönliche Begegnung untereinander und die Gemeinschaft sonst nicht ganz so intensiv spürbar werden. Über die Chancen, die dennoch auch ein Online-Kath-Kurs bietet, spricht Rudolf Gehrig mit dem Online-Kleingruppenleiter Anselm Blumberg im "Kath-Kurs konkret"-Interview.
  widescreen: true
