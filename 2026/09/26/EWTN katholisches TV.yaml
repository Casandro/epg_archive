  stop: 2026-09-26T11:30:00Z
  title: GRANDIOS (4. Staffel)
  subtitle: Christian Heiß
  description: '"Musik ist die Sprache, die direkt ins Herz geht" sagt Domkapellmeister Christian Heiß zu GRANDIOS. Bei den Regensburger Domspatzen geschieht Glaubensvermittlung auf ganz natürliche und zwanglose Weise über die Musik. Christian Heiß fördert die Talente seiner Schülerinnen und Schüler, welche oft über die musikalische Begabung hinaus gehen. Doch dafür ist es wichtig, eine persönliche Beziehung zu jedem Einzelnen aufzubauen. Für ihn war immer klar, was er beruflich weitergeben will: die Freude am Glauben, vermittelt über die Musik.'
