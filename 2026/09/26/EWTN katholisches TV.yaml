  title: EWTN präsentiert (2026)
  subtitle: Erzbischof Fulton J. Sheen - Diener aller
  description: |-
    Servants of all - Englischer Dokumentarfilm mit deutschen Untertiteln

    Fulton J. Sheen war ein Priester, der Millionen berührte. Über Jahrzehnte war Erzbischof Sheen ein außergewöhnlicher Zeuge des Glaubens. Mit seiner Fernsehsendung "Life is Worth Living" erreichte er jede Woche bis zu 30 Millionen Zuschauer. Doch nicht nur seine Worte bewegten die Menschen: Es war vor allem die Art, wie er seinen Glauben lebte und seine persönliche Beziehung zu Gott bezeugte.

    Dieser Dokuemntarfilm stellt diesen faszinierenden Priester einer neuen Generation vor. Menschen, die ihn persönlich kannten, erzählen von seinem Leben und seinem Wirken - und davon, wie er ihr eigenes Leben verändert hat.

    Seine Botschaft ist bis heute aktuell: Ein Leben im Dienst an Gott und den Menschen kann die Welt verändern.
  widescreen: true
