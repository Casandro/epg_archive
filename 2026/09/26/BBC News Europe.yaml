    Tytuł oryginalny: China's Greatest Treasures
    GB
    Compelling documentary series in which host, BBC Art Critic Alastair Sooke, embarks on an adventure of a lifetime, travelling through modern day China to examine how China's most important historic artefacts housed in museum collections across the country still influence and define the nation today. Subjects covered in the series include family and ancestors, calligraphy, food, technology, China's links with the rest of the world, and much more.
