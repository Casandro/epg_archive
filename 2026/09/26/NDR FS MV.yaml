  audiodesc: true
  description: Schon immer war dem ergrauten Polizeibeamten Karl Mattau der Herzensbrecher Hermann Rüter ein Dorn im Auge. Im Alter begegnen sie einander in einem kleinen norddeutschen Kurort wieder. Und erneut findet Mattau Grund, sich über seinen ehemaligen Mitschüler zu ärgern. Denn Rüter ist zwar älter, aber keineswegs - so scheint es jedenfalls Mattau - solider geworden. Er versucht, Rüter als Heiratsschwindler zu enttarnen. Hoffentlich lohnen sich die Mühen wie tägliche Anwendungen und gymnastische Übungen. Nicht, dass sich Rüter wider Erwarten als Ehrenmann entpuppt.
