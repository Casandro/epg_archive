  description: 'Der elegante Sir George McDowell hat einen ganz besonderen Plan ausgeheckt, um eine Bank auszurauben: Er will die Angestellten des Geldinstituts entführen und durch Doppelgänger ersetzen. Diese sollen dann unbemerkt den Direktor der Filiale überwältigen und den prall gefüllten Tresor ausräumen. Zunächst scheint alles wie am Schnürchen zu laufen - bis den eingesperrten Bankleuten die Flucht gelingt und plötzlich die Polizei bei McDowell anklopft.'
