  description: Sascha Zacharias alias "Rebecka Martinsson" bekommt es mit einem Fall zu tun, der die tiefen Wunden ihrer Kindheit schmerzen lässt. In "Lange Schatten" muss die Staatsanwältin ein ungeklärtes Verbrechen aufrollen, bei dem ein Kind seine Mutter verloren hat. Vernarbte Traumata, ihre Sehnsucht nach Geborgenheit und die lähmende Angst, sich auf Beziehungen einzulassen, geben der Figur der Titelheldin eine faszinierende Vielschichtigkeit, die sich unter der Fassade der lebenshungrigen Karrierejuristin befindet. Zu den Stärken der Nordic-Noir-Reihe gehört es, alle Charaktere des exzellenten Darstellerensembles zur Geltung zu bringen.
