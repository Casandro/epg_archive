  title: Süd Blick vom 26.09.2026 (Wh.)
  subtitle: |-
    Smartwatch als Hausnotruf +++ Einigung auf neuen Tankrabatt und Spritpreisdeckel
     +++ Tageskurbeitrag in Bad Aibling - Abschaffung oder Anpassung? +++ 70 Jahre Christliches Sozialwerk
  description: 'Mobilnotruf per Smartwatch soll Menschen auch allein unterwegs absichern: Per Knopfdruck oder Sturzerkennung verbindet sie zur Notrufzentrale, übermittelt per GPS den Standort und ermöglicht Freisprechen; die Johanniter bieten dazu vom 14. September bis 2. +++ Die Bundesregierung will Sprit ab 1. Oktober per Steuersenkung bis Jahresende um bis zu 17 Cent je Liter verbilligen, ab Januar einen Preisdeckel prüfen und 2,5 Milliarden Euro mit den Ländern teilen, doch Experten kritisieren geringe Wirkung und teure Gießkannenpolitik. +++ In Bad Aibling sorgt der seit Januar fällige Euro-Tageskurbeitrag für Streit: Die Therme meldet rund elf Prozent weniger Gäste, die Stadt verweist auf leere Kassen und zweckgebundene Einnahmen, nun berät der Stadtrat am Donnerstag über Abschaffung, Beibehalt oder Reform. +++ Das Christliche Sozialwerk feierte in Flintsbach sein 70-jähriges Bestehen: Aus der Hauskrankenpflege von 1956 wurde ein breites Hilfsangebot, das beim Fest am Mehrgenerationenhaus mit Musik, Programm und Dank an Haupt- und Ehrenamtliche gewürdigt wurde.'
- eventId: 846817
  start: 2026-09-26T19:10:00Z
  stop: 2026-09-26T19:20:00Z
  title: Süd Blick vom 26.09.2026 (Wh.)
  subtitle: Süd-Blick2 +++ Jonah Werner über Drohnenangriffe in der Ukraine +++ Wasserburg bewegt sich - Premiere für das "Sporty Weekend"
  description: 'Seit Jahren prägt der Ukraine-Krieg den Alltag und verändert die Kriegsführung, in der Drohnen immer wichtiger werden, wie Jonah Werner vom Verein Athletes for Ukraine nach mehreren Reisen berichtet und im Gespräch schildert, was sich wandelte und welche Begegnungen ihn bewegten. +++ Wasserburg am Inn wurde am Wochenende zur Sportbühne: Beim ersten Sporty Weekend mit Tag der Vereine, Jugend-DM im Rasenkraftsport, Ü35-Basketball und der Premiere von Badria Run and Ride trafen Vereine, Nachwuchs und Familien aufeinander.'
