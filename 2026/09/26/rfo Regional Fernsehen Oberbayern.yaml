- eventId: 573543
  start: 2026-09-26T16:00:00Z
  stop: 2026-09-26T16:10:00Z
  title: Süd Blick vom 26.09.2026
  subtitle: |-
    Smartwatch als Hausnotruf +++ Einigung auf neuen Tankrabatt und Spritpreisdeckel
     +++ Tageskurbeitrag in Bad Aibling - Abschaffung oder Anpassung? +++ 70 Jahre Christliches Sozialwerk
  description: 'Mobilnotruf per Smartwatch soll Menschen auch allein unterwegs absichern: Per Knopfdruck oder Sturzerkennung verbindet sie zur Notrufzentrale, übermittelt per GPS den Standort und ermöglicht Freisprechen; die Johanniter bieten dazu vom 14. September bis 2. +++ Die Bundesregierung will Sprit ab 1. Oktober per Steuersenkung bis Jahresende um bis zu 17 Cent je Liter verbilligen, ab Januar einen Preisdeckel prüfen und 2,5 Milliarden Euro mit den Ländern teilen, doch Experten kritisieren geringe Wirkung und teure Gießkannenpolitik. +++ In Bad Aibling sorgt der seit Januar fällige Euro-Tageskurbeitrag für Streit: Die Therme meldet rund elf Prozent weniger Gäste, die Stadt verweist auf leere Kassen und zweckgebundene Einnahmen, nun berät der Stadtrat am Donnerstag über Abschaffung, Beibehalt oder Reform. +++ Das Christliche Sozialwerk feierte in Flintsbach sein 70-jähriges Bestehen: Aus der Hauskrankenpflege von 1956 wurde ein breites Hilfsangebot, das beim Fest am Mehrgenerationenhaus mit Musik, Programm und Dank an Haupt- und Ehrenamtliche gewürdigt wurde.'
- eventId: 846718
  start: 2026-09-26T16:10:00Z
  stop: 2026-09-26T16:20:00Z
  title: Süd Blick vom 26.09.2026
  subtitle: Süd-Blick2 +++ Jonah Werner über Drohnenangriffe in der Ukraine +++ Wasserburg bewegt sich - Premiere für das "Sporty Weekend"
  description: 'Seit Jahren prägt der Ukraine-Krieg den Alltag und verändert die Kriegsführung, in der Drohnen immer wichtiger werden, wie Jonah Werner vom Verein Athletes for Ukraine nach mehreren Reisen berichtet und im Gespräch schildert, was sich wandelte und welche Begegnungen ihn bewegten. +++ Wasserburg am Inn wurde am Wochenende zur Sportbühne: Beim ersten Sporty Weekend mit Tag der Vereine, Jugend-DM im Rasenkraftsport, Ü35-Basketball und der Premiere von Badria Run and Ride trafen Vereine, Nachwuchs und Familien aufeinander.'
- eventId: 846719
  start: 2026-09-26T16:20:00Z
  stop: 2026-09-26T16:30:00Z
  title: Süd Blick vom 26.09.2026
  subtitle: Tischtennis Bundesligastart in Kolbermoor +++ Lokwelt feiert 20 Jahre Museumsgeschichte +++ Reichenhaller Kunstakademie und VHS unter einem Dach
  description: 'Bundesliga-Auftakt für den SV DJK Kolbermoor - und gleich ein Kracher gegen den amtierenden Deutschen Meister. Der ttc berlin eastside kam ohne seine beiden Topspielerinnen nach Kolbermoor. Vor 150 Zuschauern in der B2X-Arena entwickelte sich eine umkämpfte Partie über mehr als drei Stunden.  +++ Freilassing feierte am Wochenende 20 Jahre Lokwelt: Das Museum blickt auf zwei Jahrzehnte Eisenbahngeschichte mit historischen Loks zurück, erhielt ein neues Fahrzeug als Geschenk und bot zum Jubiläum ein Programm mit Nachts im Museum, Modellbahnshow und Fundsachenauktion. +++ Seit Jahresbeginn arbeiten Kunstakademie Bad Reichenhall und Volkshochschule eigenständig unter dem gemeinsamen Dach KUB, sparen durch digitalisierte Abläufe Kosten zur Entlastung des Stadthaushalts und bündeln passende Kunstkurse sowie Vorträge.'
- eventId: 846720
  start: 2026-09-26T16:30:00Z
  stop: 2026-09-26T16:45:00Z
  title: Süd Blick vom 26.09.2026
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: Franz und Veronika Kirchmaier aus Schützing am Chiemsee haben ihren Hof mit Milchkühen, Fünf-Sterne-Urlaub, Laden, Café und eigener Energieversorgung modern aufgestellt; Franz steht 2026 im CERES-Awards-Finale, Veronika zeigte den Betrieb in der BR-Landfrauenküche.
- eventId: 846721
  start: 2026-09-26T16:45:00Z
  stop: 2026-09-26T17:00:00Z
  title: Süd Blick vom 26.09.2026
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: Judith Wenzl aus Rattenkirchen (Landkreis Mühldorf) ist zweifache Europameisterin im 3-D-Bogensport, in dem Konzentration, Erfahrung und Nervenstärke zählen, und spricht mit Reporterin Corinna Blädel über ihren Weg an die Spitze und die Faszination der Disziplin.
