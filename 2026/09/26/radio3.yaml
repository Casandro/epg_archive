- eventId: 542536
  start: 2026-09-26T17:00:00Z
  stop: 2026-09-26T18:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Cécile McLorin Salvant mit neuem Album

    Die US-amerikanische Jazz-Sängerin und Komponistin kann mit ihrer Stimme sehr intensive Geschichten erzählen: Mal klingt sie mädchenhaft, mal intim, blues-durchtränkt, theatralisch oder bitter ironisch. Drei Grammys hat sie so schon gewonnen.
    Für ihr neues Album "With Every Breath I Take" hat sie sich jetzt das erste Mal von einem Orchester begleiten lassen - dem Metropole Orkest unter der Leitung von Jules Buckley. Gemeinsam interpretieren sie zeitlose Songs in Arrangements filmischen Ausmaßes - von Cy Coleman, Noël Coward, Duke Ellington, Stephen Sondheim, Billy Strayhorn und nicht zuletzt von Cécile McLorin Salvant selbst.

    Moderation: Ortrun Schütz
- eventId: 542712
  start: 2026-09-26T18:00:00Z
  stop: 2026-09-26T21:00:00Z
  title: ARD Oper
  description: "Staatsoper für Alle 2026\nGuiseppe Verdi: Nabucco\n\nZum 19. Mal hieß es dieses Jahr auf dem Berliner Bebelplatz wieder: Staatsoper für Alle. Auf dem Programm stand die Oper \"Nabucco\" von Giuseppe Verdi, sein erster großer Opernerfolg. Das Werk - mit musikalischen Glanzpunkten, wie dem Gefangenenchor \"Va pensiero\" - kam 1842 in der Mailänder Scala so gut an, dass es in der kommenden Spielzeit ganze 57 Mal wiederholt wurde. In den vier Akten der Oper wird die Geschichte des babylonischen Königs Nabucco erzählt, der nach seinem Sieg über die Israeliten einen ausgewachsenen Gottkomplex entwickelt und schließlich wahnsinnig wird. Er entgeht nur knapp einer Katastrophe - gerettet durch die Einsicht, dass er nicht Gott ist, und ein Gebet zum Gott der Israeliten. An der Staatsoper wurde \"Nabucco\" vom russischen Bariton Ariunbaatar Ganbaatar gesungen, Francesco Lanzilotta dirigierte die Staatskapelle und den Staatsopernchor.  \n \nGiuseppe Verdi: Nabucco\nNabucco: Ariunbaatar Ganbaatar\nIsmaele: Andrés Moreno García\nAbigaille: Lidia Fridman\nFenena: Elena Maximova\nZaccaria: Tareq Nazmi\nAnna: Clara Nadeshdin\nAbdallo: Junho Hwang\nHohepriester des Baal: Hanseong Yun\n \nLeitung: Francesco Lanzilotta\n\nStaatskapelle Berlin\nStaatsopernchor Berlin\nModeration: Fanny Tanck\n\nAufnahme vom 23.05.2026 in der Staatsoper Berlin"
