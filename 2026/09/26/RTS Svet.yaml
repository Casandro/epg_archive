  description: U pričama nema naratora ? ne čitamo tekst koji mi, novinari, nazivamo ofom. Priču pričaju sagovornici, dok slika i način montaže pomažu da se dočaraju atmosfera i kontekst. Iz svakog razgovora se uzima suština, da gledalac oseti, razume i promisli ? ne zato što mu je rečeno, već zato što mu je prikazano. Verujem da se naše umeće ne vidi samo na papiru, već i u slici. A u tome je baš čar televizije.
