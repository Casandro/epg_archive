  title: Svet. Uživo
  subtitle: Sve je teže razumeti svet koji se svakodnevno menja. Odluke koje menjaju tok istorije donose se preko noći. Savezi pucaju. Granice se pomeraju ? jedna emisija povezuje sve tačke.
  description: 'Trgovina, Tajvan, poluprovodnici, retki zemni metali i veštačka inteligencija - susret Donalda Trampa i Si Đinpinga u Vašingtonu otvara pitanja šira od odnosa dve zemlje. Koliko prostora za saradnju ostaje između ekonomskog nadmetanja i bezbednosnih interesa? Šta jdonosi dogovor o carinama, šta se govori o pristupu tehnologiji, a gde počinju političke granice kompromisa? Može li veštačka inteligencija, istovremeno predmet rivalstva i zajedničke zabrinutosti, postati razlog za saradnju? O susretu američkog i kineskog predsednika i njegovom značaju za ostatak sveta razgovaramo sa profesorom Sinišom Vukovićem sa Univerziteta "Džons Hopkins" u Vašingtonu. A šta veštačka inteligencija može da uradi za nas ili i šta može da uradi nama, ako pođe po zlu?Od pomoći nauci i medicini do pitanja ljudske kontrole: razumemo li dovoljno sisteme koje razvijamo i kako ih usklađujemo sa svojim namerama? Može li se istovremeno ubrzavati tehnološka trka i graditi pouzdana zaštita od rizika? Za...'
- eventId: 1133957
  start: 2026-09-26T11:30:00Z
  stop: 2026-09-26T12:19:00Z
  title: NTC kviz
  subtitle: Da li Koloseum može biti neparan, a planeta Mars parna? Dobro došli na mesto gde je to moguće! Dobro došli na mesto gde odgovor ne zavisi samo od onoga što vidimo, već od načina na koji razmišljamo.
  description: Da li Koloseum može biti neparan, a planeta Mars parna? Dobro došli na mesto gde je to moguće! Dobro došli na mesto gde odgovor ne zavisi samo od onoga što vidimo, već od načina na koji razmišljamo. Kroz treću epizodu "NTC kviza", kao i do sada, vodiće nas Ognjen Mićović. Sa jedne strane su učenici Osnovne škole "Andra Savčić" iz Valjeva, dok drugi tim čine učenici Osnovne škole "Moma Stanojlović" iz Kragujevca. Kroz Valjevo protiču dve reke ? reka Kolubara i reka Gradac. Reka Gradac je hladna, brza i bistra reka, pa samim tim u njoj živi riba koja voli baš takvo okruženje. U pitanju je riba pastrmka. Ime jednog našeg tima tako će asocirati na njihov Grad-ac i zvaće se Pastrmke. Drugi tim dolazi iz grada koji je u srcu Šumadije. Jasno je odakle dolazi ime Šumadija, ali možda ne svima poznato da je nekada tu bila ogromna hrastova šuma. Otuda nimalo slučajno što je ime drugog tima ? Žirevi!
