  description: Televizijski serijal kreiran od strane ekološke redakcije, donosi nam razgovore sa vrhunskim stručnjacima iz oblasti očuvanja životne sredine i ekologije. Ova emisija pruža priliku da naučimo važne stvari o odnosu čoveka i prirode, o neophodnosti podizanja ekološke svesti kod ljudi, kao i o potrebi za boljim uslovima života i očuvanjem planete.
