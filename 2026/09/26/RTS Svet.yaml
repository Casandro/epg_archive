  title: 44/20
  subtitle: Nekada su bili mesta susreta, izlazaka i važan deo gradskog života.
  description: Nekada su bili mesta susreta, izlazaka i važan deo gradskog života. Danas, u vreme striming platformi i filmova dostupnih na jedan klik, postavlja se pitanje - zašto i dalje odlazimo u bioskop? Da li se publika vraća u bioskopske sale? Zašto mlade generacije, odrasle uz telefone, društvene mreže i striming servise, ponovo biraju veliko platno? Šta bioskop može da ponudi što gledanje filma kod kuće ne može? O promenama bioskopske kulture, publici nekada i danas, opstanku starih sala i novom životu bioskopa govore ljudi koji film stvaraju, prikazuju i proučavaju - i oni koji ga gledaju. Kroz njihove priče, bez naratora, "44/20" istražuje šta smo izgubili promenom navika, a šta je ostalo nezamenljivo u trenutku kada se svetla ugase i film počne.
