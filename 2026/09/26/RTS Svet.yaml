  description: U novoj epizodi Fantastične planete saznajemo koliko je prisustvo čoveka na planeti uticalo na životinjski svet. Kako i zašto Australiji milioni životinja uključujući kengure, oposume, koale i zmije nastrada zbog prisustva čoveka. U prenaseljenom Hong Kongu se bore za opstanak roze delfina i retkog sečuanskog majmuna, ali muku muče sa previše makakija. U Holandiji ponovo naseljavaju odavno iščezlu vrstu - evropskog bizona.
