  description: Specijalna izdanja emisije ovog vikenda,slavimo veliki jubilej instutucije koja život,običaje,verovanja i kulturu čuva za budućnost. Jubilarna 125-ta godina Etnografskog muzeja u Beogradu uz priče o čuvanju nasleđa,uz riznicu sa više od 120 hiljada muzealija,više od 52 hiljade predmeta koji svedoče vremenu. Naši domaćini otvaraju depoe u koje publika nema priliku da zaviri,pa ćete ekskluzivno videti predmete iz Zbirki nakita,narodnih nošnji,do Gradskog salona. Šta je preklad,a sta zubun i koja je važnost pesme kao nematerijalnog nasleđa. Uz vez i zlatovez,mozaik,pletenje grivne,na radionicama Manakove kuće. Posebnu pažnju posvećujemo izložbi "Srpske svadbe pre 125 godina". Kako je ovaj običaj oblikovao odnose,verovanja i zašto je svadba dragocen prozor iz prošlosti ka budućem. Šta je biserni tepeluk i kako izgleda kolekcija kašika u Zbirci predmeta ruskog srebra,najbogatijoj kolekciji u Evropi. Sa nama KUD Stanko Paunović,Neda Nikolić,Vesna Dimić,Ansambl Narakord,Darko...
