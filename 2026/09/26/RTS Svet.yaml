  title: NTC kviz
  subtitle: '"NTC kviz" nastao je prema sistemu učenja osnivača Mense Jugoslavije - dr Ranka Rajovića.'
  description: U četvrtoj sezoni učestvuje 16 timova koje čine učenici četvrtog i petog razreda osnovnih škola iz cele Srbije. U kvizu će se, tako, pojaviti đaci iz Aleksandrovca, Sremske Mitrovice, Novog Kneževca, Novog Pazara, Beograda, Valjeva, Novog Sada, Kragujevca, Bajine Bašte, Lazarevca, Topole, Pančeva, Kraljeva i Stare Pazove. Timovi će se nadmetati idejama u pet stalnih igara i jednoj igri iznenađenja, koja je posebna u svakoj epizodi. "NTC kviz" i ovoga puta spaja zabavu i učenje, pokazujući da razmišljanje i učenje nisu igra, ali mogu ličiti na igru. Kao i prethodne, i četvrta sezona "NTC kviza" imaće 16 epizoda. Nakon osam kvalifikacionih epizoda sledi četvrtfinale, zatim polufinale, borba za treće mesto i finalni duel.
- eventId: 1133959
  start: 2026-09-26T12:20:00Z
  stop: 2026-09-26T12:30:00Z
  title: Pregrizi jezik
  subtitle: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku ? u.'
  description: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku - u razgovorima, porukama, raspravama i druženjima. Glavni junaci su buntovna i nepoverljiva Una, koja ne prihvata lako tuđa objašnjenja, zatim njena najbolja drugarica Anastazija, romantična i uvek spremna da vidi nešto više od običnog razgovora, Bogdan, pomalo misteriozan poznavalac jezika koji se bavi različitim poslovima, i Unina mlađa sestra Sonja, koja ih posmatra sa dozom ironije jer i sama odlično poznaje gramatiku i pravopis.'
