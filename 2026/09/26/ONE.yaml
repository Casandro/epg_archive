  description: |-
    Anlässlich des 90. Geburtstages von Jean Pütz zeigt ONE die erste Folge der legendären WDR-Sendung 'Hobbythek', die am 22. Dezember 1974 erstmals ausgestrahlt wurde.
    Mit 'Hobbythek' prägte Jean Pütz über drei Jahrzehnte das deutsche Fernsehen: verständlich, neugierig, verbrauchernah und immer mit dem berühmten Motto 'Wir haben da mal was vorbereitet'. Ob Kosmetik, Ernährung, Umwelt oder Alltagstechnik - Pütz machte komplexe Themen anschaulich und gab seinem Publikum praktische Tipps zum Selbermachen.
