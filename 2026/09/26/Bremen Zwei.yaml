- eventId: 551966
  start: 2026-09-26T16:00:00Z
  stop: 2026-09-26T17:00:00Z
  title: Eine Stunde reden
  subtitle: mit Mario Neumann
  description: 'Sechzehn Jahre alt war Martina Kahrs, als sie zum ersten Mal Crack genommen hat - auf der Reeperbahn in Hamburg. "Das war die größte Schande meines Lebens", sagt sie. Dabei hat in Wirklichkeit jemand anders große Schande auf sich geladen: Ihr Onkel, der sie als kleines Kind sexuell missbraucht hat. Die heute 41-Jährige entwickelte danach eine Psychose und konnte im Leben nie richtig Fuß fassen. Nachdem sie in den letzten Jahren mehrmals in kritischem Zustand ins Krankenhaus eingeliefert werden musste, fürchtet sie jetzt um ihr Leben. Und hat nach 25 Jahren Drogenkonsum und Prostitution nur bescheidene Wünsche: Eine funktionierende Waschmaschine. Ein Haustier, am liebsten einen kleinen Hund. Und, am wichtigsten: Nicht am Crack zugrunde gehen.'
- eventId: 551967
  start: 2026-09-26T17:00:00Z
  stop: 2026-09-26T20:00:00Z
  title: Sounds
  subtitle: mit Till Lorenzen
  description: 'Im September wäre der Saxofonist und Jazzkomponist John Coltrane 100 Jahre alt geworden. Bis heute schreiben auch Pop- und Rockmusiker Songs über ihn. Außerdem: Fünf von sechs Gruppen haben ihre Auftritte im women in (e)motion-Festival bereits absolviert. Es waren jeweils auf gute Art unterschiedliche Abende, die von Bremen Zwei aufgenommen wurden. Wir hören erste Livetöne. Und: Botticelli Baby meldet sich mit neuer Single zurück und die Kanadierin Dominique Fils-Aimé spielt in der Glocke.'
  genre:
  - '96'
- eventId: 552435
  start: 2026-09-26T20:00:00Z
  stop: 2026-09-26T22:00:00Z
  title: Sounds in concert
  description: Wer ans Jazz-Saxophon denkt, denkt unmittelbar an John Coltrane. Unzweifelhaft war der 1926 geborene "Trane" einer der einflussreichsten Saxophonisten und eine prägende Figur des sogenannten Spiritual Jazz. Am 23. September wäre er 100 Jahre alt geworden.
  subtitle: mit Till Lorenzen
