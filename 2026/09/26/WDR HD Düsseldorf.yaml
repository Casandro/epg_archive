  title: Kochen mit Martina und Moritz
  subtitle: 'Erntedank: Wir feiern den Herbst'
  description: Wenn die Märkte von den herrlichsten Gemüsesorten, Kürbissen in allen Größen, Kohlköpfen, Kartoffeln, unterschiedlichen Wurzelarten, Obst in allen Formen und Farben überquellen, dann schwärmen die Fernsehköche Martina und Moritz aus. Kräuter, Früchte, Rüben, die Entscheidung fällt schwer. In dieser Sendung servieren die beiden ihre Lieblingsgerichte zu dieser üppigen Jahreszeit. Natürlich gibt es dazu Vorschläge für passende Getränke und wie immer jede Menge praktische Kochtipps.
