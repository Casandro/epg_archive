  title: Die verrückten 90er - Das Turbo-Jahrzehnt der Deutschen
  subtitle: mit Wetter
  widescreen: true
  subtitled: true
  hd: true
  description: 'Es geht alles rasend schnell; kaum ist die Mauer gefallen, wird die ehemalige DDR vom Westen aus "bundesrepublikanisiert": mit D-Mark, mit wummernden Techno-Beats, schriller Mode und seltsamen Körperbemalungen, die man nicht mehr abwaschen kann. In den 90ern jagt ein epochemachender Trend den anderen. Die verrückten 90er haben aber leider noch mehr zu bieten: Während im Nahen Osten der Golfkrieg tobt - dem andere folgen werden -, kriechen aus diversen Löchern Neonazis hervor. Der WDR lässt die 90er Jahre noch einmal Revue passieren. Jahr für Jahr durch ein Jahrzehnt.'
