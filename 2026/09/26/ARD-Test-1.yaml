  description: Von psychoanalytischer Traumabewältigung hält die brillante Kriminaltechnikerin Dr. Viktoria Wex ebenso wenig wie von prophetischen Albträumen. Deshalb sieht sie wenig Handlungsbedarf, als die 15-jährige Halbwaise Lucja den Mord an ihrer Therapeutin Dr. Jolanta Wieczorek vorhersagt. Als aber nach dem Marzanna-Fest die Leiche der Therapeutin im nahegelegenen See treibt und eine Schädelfraktur auf Fremdeinwirkung schließen lässt, muss das Ermittlerteam aus Kommissarin Kowalska, Dorfpolizist Leon und Kriminaltechnikerin Dr. Wex bei der Aufklärung der Gewalttat delikate Geheimnisse und komplexe Zusammenhänge freilegen.
