  hd: true
  description: Der Untergang der sagenumwobenen Stadt Rungholt gibt bis heute Rätsel auf - und tangiert Marlene Tanczik und Anton Spieker als Ermittlerduo in ihrem vierten Fall. Was hat die Geschichte über das reiche, aber gottlose "Atlantis des Nordens" mit dem gewaltsamen Tod eines angeblich unkeuschen Geistlichen zu tun? Mit der Hilfe von Charlotte Schwab als Kennerin der düsteren Ballade, die Gottes Zorn und das menschliche Ringen mit der Urgewalt der See besingt, taucht die Kripo Husum in ein Spannungsfeld mystischer Spekulationen und jetztzeitlicher Konflikte ein.
