  description: Od První k Osmé. 25. září 1906 se narodil skladatel, do jehož patnáctidílného symfonického reliéfu se obtiskly dějiny říše, jejíž temné stíny mnohokrát padly i na naši krajinu. V pořadu zazní i průvodní slovo skladatele Otomara Kvěcha, znalce Šostakovičovy tvorby. Připravil a uvádí Lukáš Hurník.
