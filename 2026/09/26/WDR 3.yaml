  description: |-
    Ein Mal im Jahr prämieren die Mitglieder der European Broadcasting Union ein Hörstück, das im Auftrag von Radiostationen produziert wurde. 2026 ging der Prix Palma Ars Acustica an James Welburns "Longyearbyen". Realisiert für den ORF. Longyearbyen ist das Verwaltungszentrum der Inselgruppe Spitzbergen. Welburn dokumentiert das überlappende Treiben von Zivilisation, Wildnis, Industrie und Tourismus.
    <strong>Longyearbyen</strong> | 50:29<br/>James Welburn
