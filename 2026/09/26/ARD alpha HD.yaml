  description: 'Saftig grüne Almwiesen, blau glitzernde Seen, goldgelb leuchtende Bäume und die schiefergrauen Dolomiten mit schneeweißen Gipfeln: Im herbstlichen Südtirol genießt Tamina Kallert die farbenfrohe Natur, die ihr atemberaubende Panoramen beschert. Ihre Reise beginnt auf dem Kronplatz und endet in Meran, wo ihr Kaiserin Sisi auf Schritt und Tritt begegnet. Unterwegs lernt sie traditionsbewusste und fortschrittliche Südtiroler kennen: In St. Ulrich fährt sie mit einem Holzkünstler auf die Seiser Alm; im Gardatal wandert sie zusammen mit zwei Musikerinnen; im touristisch wenig erschlossenen Sarntal hilft sie bei der Latschenkiefer-Ernte.'
