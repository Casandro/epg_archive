  title: 42 - Die Antwort auf fast alles
  subtitle: Wie viel Mathematik steckt im Universum?
  description: 'Mathematik gilt vielen als abstraktes Schulfach - trocken, schwierig, weltfremd. Doch was, wenn sie in Wahrheit die verborgene Ordnung hinter allem ist? Mathematik ist verblüffend präsent in unserem Alltag: Sie steckt in den Blättern und Blüten von Pflanzen. Selbst Bienen - das zeigt die neueste Forschung - haben so etwas wie einen Sinn für Mathematik. Pflanzen etwa orientieren sich häufig an der sogenannten Fibonacci-Folge - einer Zahlenreihe, die entsteht, indem man immer wieder die Summe der beiden vorhergehenden Zahlen addiert.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
- eventId: 535823
  start: 2026-09-26T03:30:00Z
  stop: 2026-09-26T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Back-Country Path
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
