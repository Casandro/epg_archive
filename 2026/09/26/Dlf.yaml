  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nEU-Kids Act - Werden soziale Medien durch die EU-Regeln für Kinder sicherer? \n\nIn Campus & Karriere fragen wir: Sind die EU-Regeln der richtige Weg, um gegen Social-Media-Sucht und psychische Erkrankungen bei Kindern vorzugehen? Lassen sich die Regeln überhaupt um - und durchsetzen? Und kommt damit auch eine flankierende Social-Media-Bildung? \n\nGäste: \n-Nina Kolleck, Bildungsforscherin und Politikwissenschaftlerin an der Uni Potsdam\n-Erik Sczygiol, stellvertretender Generalsekretär der Bundesschülerkonferenz\n-Alexandra Geese, MdEP der Grünen, Expertin für Digitales\n  \nAm Mikrofon: Manfred Götzke\n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de\nWhatsApp 0173 - 535 8089"
