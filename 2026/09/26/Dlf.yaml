  stop: 2026-09-26T14:00:00Z
  title: Corso - Kunst & Pop
  description: "Nichtseattle über ?Große Liebe?: ?Liebe ist ein Gefühl - und nicht ein Mensch?\n Nichtseattle alias Katharina Kollmann hat früh gelernt, wie eng romantische Liebe und patriarchale Rollenbilder zusammenhängen. Auf dem Album ?Große Liebe? sucht sie nach anderen Formen von Nähe jenseits der Zweierbeziehung - und findet sie in Freundschaf ten und Hunden.\n Katharina Kollmann im Corsogespräch \n\n Julia Jacklin: ?Ich mag mich heute viel mehr?\n Die Singer-Songwriterin Julia Jacklin hat lange ihr Innenleben vermessen. Heute interessiert sich die Australierin stärker dafür, was zwischen Menschen passiert. Ein Gespräch über Autonomie und Gott, Friedhofsspaziergänge und den Wert des Imperfekten.\n Julia Jacklin im Interview \n\n?Out Into? von Son Lux - Soundtrack für die unruhige Gegenwart\nNach sechs Jahren meldet sich Son Lux mit dem neunten Album ?Out Into? zurück - zwischen aufwendigen Filmscores und Oscar-Nominierungen für ?Everything Everywhere All at Once? und ?Thunderbolts?. Die Band erzählt, warum ihr komplexer Avantgarde-Pop diesmal zugänglicher, atmosphärischer und stärker auf den Hintergrund ausgerichtet ist.\n\nAm Mikrofon: Christoph Reimann"
