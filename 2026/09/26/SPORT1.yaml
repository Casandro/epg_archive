  title: 'Oliver Pocher Its my Life: Aus dem Leben eines B-Promis'
  subtitle: 'Oliver Pocher Its my Life: Aus dem Leben eines B-Promis'
  description: Oliver Pocher kehrt mit seiner neuen Show "It's My Life" auf die Bühne zurück und nimmt sein Publikum mit auf eine humorvolle Reise durch den ganz normalen Wahnsinn des Lebens. Mit gewohnt spitzer Zunge, Selbstironie und jeder Menge Improvisation beleuchtet er aktuelle Themen, persönliche Erlebnisse und gesellschaftliche Eigenheiten. Dabei mischt er Stand-up-Comedy mit spontanen Publikumsaktionen und sorgt für einen Abend voller Überraschungen, Lacher und direkter Ansprache.
