  title: Hra na sobotu
  description: 'Ring Lardner: Mistr velterové váhy. Příběh z prostředí profesionálního boxu. Přeložil Martin Hilský. Dramatizace Miloš Petana. Hudba Petr Kodl. Dramaturgie Marie Říhová. Režie Ivan Holeček. Účinkují: Pavel Rímský, Jiří Prager, Naděžda Vicenová, Vladimír Ráž, Zuzana Bydžovská, Rudolf Hrušínský st., Ladislav Mrkvička, František Husák, Miroslav Nohýnek, Karel Malina, Pavel Pípal, Miloš Vávra, Jiří Schwarz, Vladimír Čech, Jaroslav Tomsa, Vladimír Čumpelík, Vladimír Fišer, Karel Hamr a Ivan Holeček. Natočeno v roce 1987 (53 minut). Repríza.'
