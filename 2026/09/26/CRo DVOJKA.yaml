  title: Lenoška Iva Šmoldase
  description: Dnešní Lenoška je natáčená na 67. ročníku Chopinova festivalu v Mariánských Lázní. Hosty moderátora Iva Šmoldase jsou předseda CHopinovy společnosti klavírní virtuos Ivan Klánský a umělecký ředitel festivalu Martin Kasík. Ti dva jsou jaksi tradiční hosté a přizvali si koncertního mistra České filharmonie houslového virtuosa Jiřího Vodičku. Společně zavzpomínají i na dirigenta Jiřího Bělohlávka. Repríza.
