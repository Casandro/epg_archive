  title: Noční Mikrofórum
  description: 'Host: Jana Hojdová, kameramanka a režisérka. Jak vzpomíná na svého dědečka, legendárního režiséra Bořivoje Zemana? Čím si vysvětluje obrovský úspěch svého dokumentu o fenomenálním kameramanovi Robertu Richardsonovi? A proč je tak málo žen-kameramanek? Moderuje Jaroslav Sedláček. Repríza.'
