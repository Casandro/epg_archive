  subtitle: Borgia - 1496
  description: 'Nach einem epileptischen Anfall lässt Rodrigo Giulia nach Rom zurückkehren, doch ihr Liebesverhältnis ist beendet: Er genießt nun die Gegenwart von Yuisa, einer Frau aus der Neuen Welt. Vorerst verschonen Cesares Truppen Florenz. Als er Pesaro einnimmt und Lucrezias früheren Ehemann Giovanni Sforza tötet, schwört Alfonso Di Calabria Lucrezia, eher Cesare zu töten, als Sforzas Schicksal zu teilen. FR 2013'
