- eventId: 541825
  start: 2026-09-26T10:00:00Z
  stop: 2026-09-26T15:00:00Z
  title: AM WOCHENENDE
  description: |-
    Samstag:  Darin 12 Uhr "Der Tag in Sachsen-Anhalt"- alle Nachrichten und alle Themen die heute im Land wichtig sind.
    Unsere Moderatoren und die Kollegen aus der Sportredaktion bringen Ihnen gute Laune und die wichtigsten Informationen aus den Stadien zu gehör. Wir spielen die Hits unseres Lebens und dazu berichten wir über alle Tore aus der Bundesliga und von den Spielen des 1. FC Magdeburg. Natürlich informiert Sie "MDR Sachsen-Anhalt - Mein Radio. Mein Zuhause" auch über alle anderen interessanten Sportereignisse in Sachsen-Anhalt. In den Nachrichten zur vollen Stunde halten wir Sie über alles Wichtige in Sachsen-Anhalt, Deutschland und der Welt auf dem Laufenden.

    "Der Tag in Sachsen-Anhalt": Unsere Nachrichtenredakteure und Reporter fassen für Sie die Ereignisse des Tages kompakt zusammen. Egal, ob in Sachsen-Anhalt, in Deutschland oder in der Welt etwas Wichtiges passiert ist, bei MDR Sachsen-Anhalt hören Sie es. In Interviews, Statements, Berichten und Reportagen erfahren Sie alles, was Sie wissen müssen. Die Redakteure erläutern Ihnen Zusammenhänge, Hintergründe und Entwicklungen. Außerdem bekommen Sie die neuesten Wetter- und Verkehrsinformationen.
