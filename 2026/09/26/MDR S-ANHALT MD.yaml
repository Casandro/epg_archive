  description: "\"Der ARD Abend - Radio für alle\" ist eine gemeinsame Abendsendung der ARD Landesprogramme. Es gibt die beste Musik zum Tagesausklang von den 80ern bis heute sowie regionale Nachrichten. Die Sendung wird täglich von 20-23Uhr im wöchentlichen Wechsel von den MDR Landesprogrammen in Thüringen, Sachsen und Sachsen Anhalt produziert. \nDas Programm wird ab 21Uhr von den NDR Landesprogrammen, von WDR 4, SR3 und RBB Antenne Brandenburg übernommen und gesendet."
