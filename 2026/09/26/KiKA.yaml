  subtitle: Die Bodenwelle
  description: |-
    Die Bodenwelle

    Um endlich den neuen Dorfplatz einweihen zu können, beschließt Magnus selbst Hand anzulegen. Er beendet die Arbeiten etwas holperig und übrig bleibt ein kleiner Straßenhügel mitten auf dem Dorfplatz. Alle Einwohner bleiben mit den Füßen hängen und stürzen. Aber Magnus will nichts davon wissen. Der Platz ist gut, so wie er ist! Die Dorfbewohner beauftragen wie immer ihren Superhelden mit der Lösung des Problems.
