    Das Käferhotel

    Alle Campbewohner sammeln Blumen, die Bert und Luis zu hübschen Gestecken arrangieren. Doch die Campleiterin fällt aus Versehen auf einen morschen Baumstumpf, der die Behausung einer Käferkolonie war. Odo hat die Idee, ihnen ein Insektenhotel zu bauen. Schon bald ziehen begeistert erste Bewohner ein. Doch Luis und Bert ekeln sich ausgesprochen vor den Krabbeltieren und bringen das Insektenhotel heimlich ans andere Ende des Waldes.
