  title: Nitso und das zottelige Alphabet
  subtitle: Der Buchstabe L
  description: |-
    Der Buchstabe L

    Nitso hat in der Schule das L gelernt. L wie Lolli. In seinem ABC-Buch ist auch ein Lolli abgebildet. Der sieht so lecker aus! Nitso kann nicht anders und schleckt an der Buchseite. Dann ist das L aber plötzlich weggeschleckt. Wie sah das L gleich nochmal aus? Die weise und lustige Madame Tebahpla hilft Nitso das L zu finden. Er trifft ein Lamm und fährt zu einem Leuchtturm, dessen Licht kaputt ist. Aber wo ist denn jetzt das L?
