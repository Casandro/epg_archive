  title: Ludzkość - historia nas wszystkich 1 (odc. 7)
  subtitle: Hiszpanie otwierają największą na świecie, bardzo dochodową kopalnię srebra. Kwitnie handel. Do Nowego Świata przybywają niewolnicy i pielgrzymi poszukujący wolności.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Sam Sheridan, Brian Williams, Judith Lindbergh, Mike Loades, Richard Machowicz, Sabine Hyland
    Aztekowie budują potężne imperium, które dominuje w Ameryce Środkowej. 12 tysięcy kilometrów dalej wielkie centrum handlu, Konstantynopol, zostaje podbite przez armię islamską. Europejczycy starają się jak najszybciej znaleźć nową drogę prowadzącą na obfitujący w przyprawy wschód. Krzysztof Kolumb odkrywa Amerykę. W Andach Hiszpanie zakładają największą kopalnię srebra, gdzie wybijają miliony pesos de ocho. Wraz z rozwojem handlu tysiące ludzi przybywają do Nowego Świata jako niewolnicy.
  ageRating: 7
  genre:
