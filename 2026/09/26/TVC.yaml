  title: Pierwsi ludzie 1 (odc. 3)
  subtitle: Program opowiada o pierwszych Australijczykach, o tym jak przetrwali i zaludnili kontynent. Współczesne i starożytne opowieści przeplatają się tam jak nigdzie indziej na świecie.
  description: |-
    Tytuł oryginalny: First Peoples
    GB,US,FR, 2015
    Reżyseria: Nicolas Brown
    Występują: Kerry Shale, Huw Barton, Jim Bowler, Tanya Charles, Bruno David, Josh Griffiths
    W jaki sposób pierwsi Australijczycy przetrwali i zaludnili kontynent? Współczesne i starożytne opowieści przeplatają się tu jak nigdzie indziej na świecie. Tajemnicą tej ciągłości jest różnorodność. synopsis: Dziś na Ziemi żyje siedem miliardów ludzi. Jak nasi przodkowie zdobywali kolejne kontynenty? Ten program to globalna opowieść detektywistyczna, wykorzystująca najnowsze odkrycia i badania genetyczne.
  genre:
  - '35'
- eventId: 1019783
  start: 2026-09-26T08:25:00Z
  stop: 2026-09-26T09:45:00Z
  title: Pierwsi ludzie 1 (odc. 4)
  subtitle: Kiedy pierwsi Homo sapiens pojawili się w prehistorycznej Europie, zastali tam Neandertalczyków - i szybko pokazali im, kto tu rządzi. Od tego czasu mieliśmy całą Europę i resztę świata dla siebie...
  description: |-
    Tytuł oryginalny: First Peoples
    GB,US,FR, 2015
    Reżyseria: Nicolas Brown
    Występują: Nicholas Conard, Katerina Harvati, John Hawks, Wulf Hein, Jean-Jacques Hublin, Rhys Hughes
    Na Ziemi żyje siedem miliardów ludzi. Seria dokumentalna to globalna opowieść detektywistyczna wykorzystująca najnowsze odkrycia i badania genetyczne. Największym wyzwaniem stojącym przed naszymi przodkami było zasiedlenie Ameryki. Droga wiodła przez tereny pokryte lodem.
  genre:
  - '35'
