- eventId: 1023011
  start: 2026-09-26T04:00:00Z
  stop: 2026-09-26T04:30:00Z
  title: Einsatz leben
  subtitle: Ein Krankenhaus in Zeiten der Pandemie
  description: |-
    Während der Corona - Pandemie musste ein neues Klinikgebäude gebaut  und alle Patienten dorthin verlegt werden. Besonders für Patienten der Intensivstation ist dies ein gefährliches Manöver. Es erfordert ein Team, das Hand in Hand arbeitet.
    Auch finanziell wird es für das Krankenhaus in Loma Linda knapp. Wird Gott für die Finanzierung des neuen Gebäudes Sorgen? Werden die Fachkräfte es schaffen alle Patienten in das neue Gebäude zu transportieren? Die Ärzte des Krankenhauses sind voller Hoffnung und vertrauen auf die Hilfe Gottes.
  widescreen: true
  hd: true
