- eventId: 1016793
  start: 2026-09-26T00:50:00Z
  stop: 2026-09-26T01:20:00Z
  title: Songs of Hope
  subtitle: Wenn sich alles verändert
  description: |-
    Der Herbst macht sichtbar, was unser ganzes Leben prägt: Veränderung. Blätter fallen, Farben wandeln sich und eine neue Jahreszeit beginnt. Auch in unserem Leben bleibt vieles nicht, wie es ist. Doch während sich um uns herum ständig etwas verändert, bleibt einer derselbe: Gott. In dieser Songs of Hope-Sendung geht es um Abschied und Neubeginn, um Veränderung und die Gewissheit, dass Gottes Liebe und Treue bleiben - gestern, heute und für immer.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1020542
  start: 2026-09-26T01:20:00Z
  stop: 2026-09-26T02:05:00Z
  title: Hope Gottesdienst
  subtitle: Wenn Jesus danke sagt - Harri Rollgaiser
  description: |-
    Jesus spricht nur selten ausdrücklich Dank aus - und doch offenbart gerade sein Dank eine tiefe Haltung des Vertrauens. Anhand der Speisung der 5000, der Freude über Menschen, die Gottes Wahrheit annehmen, und des letzten Abendmahls zeigt diese Predigt drei Facetten echter Dankbarkeit: Dank im Mangel, Dank für Gottes Wirken in Menschen und Dank für Gottes Erlösungsplan. Dabei wird deutlich: Dankbarkeit ist mehr als eine Reaktion auf gute Umstände. Sie entspringt dem Vertrauen auf Gottes Handeln und verändert nicht nur unsere Sicht auf das Leben, sondern auch unser Denken und unseren Charakter.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
