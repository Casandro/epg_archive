  title: Ursprünge
  subtitle: Dinosaurier und die Sintflut
  description: |-
    Das Verständnis der vergangenen Zeit durch das Studium der im Fossilbericht hinterlassenen Spuren bedeutet, über die Fossilien selbst hinauszublicken. In der Art und Weise, wie sie eingebettet sind, und in der Beschaffenheit der Sedimente, die sie enthalten, lassen sich weitere Hinweise auf die Phänomene erkennen, die stattgefunden haben müssen, damit sie heute so vorliegen.

    Weitere Infos unter: www.hopetv.de
