  subtitle: 'Alexa Willems: Wie wir in Krisen Orientierung finden'
  description: |-
    Was trägt, wenn Sicherheiten wegbrechen und das Leben seinen Sinn zu verlieren scheint? Die Logotherapeutin und Autorin Alexa Willems begleitet seit vielen Jahren Menschen und Organisationen durch Krisen und Umbrüche. Dabei verbindet sie psychologische Ansätze mit Naturerfahrungen und der Frage, was Menschen Sinn, Orientierung und innere Stabilität gibt. Auch ihr eigener christlicher Glaube spielt dabei eine wichtige Rolle. In dieser Sendung spricht Alexa Willems darüber, wie Menschen ihre Persönlichkeit entwickeln, neue Perspektiven finden und schwierige Lebensphasen bewältigen können.

