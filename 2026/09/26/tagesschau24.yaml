  subtitle: Das Abrisshaus von Hamburg - Wer hat Schuld?
  widescreen: true
  hd: true
  audiodesc: true
  description: Man stelle sich vor, man müsse innerhalb weniger Minuten das Zuhause verlassen. Was würde man selbst mitnehmen? Für die Bewohner in einem Hamburger Mietshaus wurde dieser Albtraum zur Realität. Ihr Wohnhaus muss plötzlich abgerissen werden - mitsamt der Einrichtung und persönlichen Erinnerungsstücken. Hätte der Abriss verhindert werden können? Und welche Schuld trifft den Eigentümer, der sonst mit Luxusimmobilien auf Sylt wirbt? "Panorama"-Reporter Manuel Biallas und Gunnar Krupp begeben sich auf die Suche nach Antworten.
