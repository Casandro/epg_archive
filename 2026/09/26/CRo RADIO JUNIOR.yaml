  title: Velká pohádka
  description: 'O vysoké věži. Poručit dešti, větru. To by si přál každý, a přitom stačí tak málo, postavit věž na počasí, která je "to pravé terno". Takhle balamutí obyčejné lidičky z Krkonoš Fernando Grando alias Ferda z Kozí Lhoty. Sedne našinec na lep mluvkovi nebo ne? Napsala: Božena Šimková. Režie: Jaroslav Kodeš. Hrají: David Novotný, Stanislav Oubram, Ladislav Županič, Martin Písařík a další.'
