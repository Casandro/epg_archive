  - 1199279
  start: 2026-09-26T17:00:00Z
  stop: 2026-09-26T17:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Vladimír Hanzal, zoolog. Možná vzpomínáte na velká prázdninová setkání s malými bytostmi. Pozorovali jste veverku, bobra nebo třeba i nebojácnou myšici křovinnou? A víte, že norník není jen pes, ale taky roztomilá myška s hnědým kožíškem? V růžovém nebo žlutém to není "paní norníková", ale další zajímavé zvířátko - plšík lískový. Poslouchejte naše povídání o drobných hlodavcích se zoologem Vladimírem Hanzalem a dozvíte se více. Repríza pořadu.'
- eventId:
  - 1192717
  - 1199280
  start: 2026-09-26T17:50:00Z
  stop: 2026-09-26T18:00:00Z
  title: Hajaja
  description: Pohádky z letní zahrádky 6/8 - Tajemstvcí hradu Květnice. Máte rádi květiny? Kdo by neměl, viďte. K rozkvetlým kytkám si každý rád přivoní, ale kdo k nim občas přiloží ucho? Možná byste to měli zkusit. Květiny z letní zahrádky totiž umějí vyprávět pohádkové příběhy? Osm pohádek z letní zahrádky napsala Melita Denková. Natočeno v roce 1998. Režie Vladimír Gromov. Vypráví Daniela Kolářová.
- eventId:
  - 1192852
  - 1199447
  start: 2026-09-26T18:00:00Z
  stop: 2026-09-26T18:55:00Z
  title: Velká pohádka
  description: 'Košile štěstí. Panu králi neschází nic, ale šťastný stejně není. A to i přesto, že je zdravý, má krásnou ženu a fůru peněz. Čím to? A jsou vůbec na světě šťastní lidé? Král se svým šaškem se rozhodli vyrazit do světa najít alespoň jednoho šťastlivce. Napsala: Věra Provazníková. Režie: Karel Weinlich. Účinkují: Jiří Klem, Jan Kanyza, Gabriela Vránová, Antonín Hardt, Oldřich Vlach a další.'
