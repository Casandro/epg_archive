  title: Bayern 2 Radiokrimi
  subtitle: '"Wahn" von Patrick Findeis'
  description: "Ein Psychogramm des historischen Massenmörders Ernst Wagner, der 1913 seine Familie und mehrere Dorfbewohner tötete und als unzurechnungsfähig eingestuft in die \"Heilanstalt Winnental\" eingewiesen wurde. Fast zwanzig Jahre später, im Jahr 1932, wird der Fall plötzlich politisch brisant: Eine mögliche Freilassung Wagners steht im Raum - als Teil einer ideologischen Agenda. Wagner ist glühender Antisemit. Im Zentrum steht das spannungsgeladene Dreieck zwischen dem behandelnden Arzt Dr. Wittmann, dem einflussreichen Ministerialrat Kirschler und der aufstrebenden Doktorandin Fräulein Schüle. Während Wittmann um wissenschaftliche Integrität ringt, versuchen Kirschler und Schüle, Wagner umzudeuten: vom paranoiden Mörder zum verkannten Dichter und vermeintlichen Opfer einer \"Verschwörung\". Mithilfe historischer Dokumente, Gutachten und Originalzitaten verwebt Findeis seinen Text zu einem Kammerspiel über Wahn und Wirklichkeit. \n\nVon Patrick Findeis\nMit Michael Kranz, Thomas Schmauser, Martin Feifel, Heinz-Josef Braun, Annika Neugart, Kathrin von Steinburg und Felicia Chin-Malenski\nKomposition: Tarwater\nRegie: Kai Grehn\nBR 2026\nUrsendung\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
