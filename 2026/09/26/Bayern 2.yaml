  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: |-
    17.05 Die Entscheidung. Politik, die uns bis heute prägt
    Warum geht jemand zurück in den Krieg?
    Als Russland die Ukraine angreift, flieht die Journalistin Maryna Osipova mit ihren beiden kleinen Kindern nach Frankreich. Dort sind sie in Sicherheit. Doch dann trifft sie eine Entscheidung, die alles verändert: Sie kehrt zurück in die Ukraine. Zurück in den Krieg. Zurück ausgerechnet in eine Region nahe der Front, die ihre Heimat ist. Warum verlässt jemand einen sicheren Ort und geht freiwillig zurück in Gefahr?
    Die Frage "Gehen oder bleiben?" begleitet in der Ukraine Millionen Menschen jeden Tag. Marynas Geschichte zeigt, wie schwer diese Entscheidung sein kann. Host Christine Auerbach erzählt von dem Moment, der Maryna zur Rückkehr bewegt hat. Und spricht mit ARD-Korrespondent Florian Kellermann, der in Kiew lebt, darüber, wie wichtig die Antwort auf diese Gehen-oder-Bleiben-Frage für den Ausgang des Kriegs ist.
    Host: Christine Auerbach; Reporter: Florian Kellermann, ARD-Korrespondent in Kiew

    17.30 Bayern 2 Breitengrad
    ARD Auslandsreportage
    RESET - Ungarns Medien nach Orbán
    16 Jahre lang herrschte Viktor Orbán ununterbrochen in Ungarn. Auch Dank der Kontrolle über den Medienmarkt. 500 Medien (Nachrichtenagentur MTI, Zeitungen, ÖRR, Fernsehen, Onlineportale, Influencer) sangen sein Lied, zusammengefasst unter dem Dach einer Stiftung (KESMA), der Anzeigenmarkt funktionierte nicht nach den Regeln des Marktes, sondern nach dem Prinzip der Loyalität. Ein Regierungskommissar bestimmte die inhaltlichen Leitlinien im ÖRR, ohne offizielles Amt. Nur wenige unabhängige Medien widersetzten sich dem - entgegen aller Widrigkeiten. Mit dem Regierungswechsel im April 2026 findet ein dramatischer Umbruch in den Medien statt. Der ÖRR wird neu organisiert. Orbáns Medienimperium bricht in atemberaubender Geschwindigkeit zusammen - denn die staatlichen Gelder bleiben aus. Das hat dramatische Folgen. Werden die unabhängigen Medien, die 16 Jahre durchgehalten haben, jetzt zum Opfer der Wende? Ungarn hat derzeit keine einzige gedruckte Tageszeitung mehr, allenthalben finden Entlassungen statt, kleine Portale wie Debreciner stehen vor der Pleite. Und wer stellt frühere Orban-Propagandisten ein? Und auch die Neuordnung des ÖRR bleibt nicht ohne Pannen. Stephan Ozsváth über eine Medienlandschaft im Umbruch.
    Von Stephan Ozsváth

    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar.
