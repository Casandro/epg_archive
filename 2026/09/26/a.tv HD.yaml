  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: Hitze und Trockenheit setzen der Region zu - Landwirtschaft, Wasserversorgung und Fischerei stehen vor Herausforderungen
  description: 'Die heißen und trockenen Sommer machen sich zunehmend bemerkbar. Wir schauen auf die Folgen für die Landwirtschaft: sinkende Erträge, fehlendes Wasser und die Frage, wie sich die Betriebe an veränderte Bedingungen anpassen können. Außerdem geht es um die Wasserversorgung und darum, wie gut die Systeme mit hohen Verbrauchsspitzen und längeren Trockenperioden umgehen können. Auch die Fische leiden unter steigenden Wassertemperaturen und niedrigen Pegeln - wir sprechen über aktuelle Maßnahmen und mögliche langfristige Folgen für die Bestände.'
- eventId:
  - 1022602
  - 1022609
  start: 2026-09-26T03:45:00Z
  stop: 2026-09-26T04:00:00Z
  title: Vom Westallgäu bis zum Bodensee (Wh.)
  subtitle: Ausbildung im Allgäu - drei Betriebe, viele Wege in den Beruf
  description: Welche Chancen bietet eine Ausbildung heute und wie sieht der Arbeitsalltag von Auszubildenden aus? Wir sprechen mit der Arbeitsagentur in Kempten über die aktuelle Situation und begleiten anschließend Azubis bei Baldauf Käse in Lindenberg und bei Buhmann Systeme in Weiler. Dabei lernen wir verschiedene Ausbildungsberufe kennen - Vom Industriemechaniker über die Kauffrau im Einzelhandel bis zum Fachinformatiker für Systemintegration. Außerdem erzählen die Auszubildenden, wie sie ihren Beruf gefunden haben und wie der Einstieg ins Arbeitsleben für sie läuft.
