  title: Zeit zu Reden (Wh.)
  subtitle: mit der Augsburger Bildungs- und Kulturreferentin Tatjana Dörfler
  description: 'Sanierungsstau und Raumnot an den Schulen, marode Freilichtbühne und eine immer teurer werdende Staatstheatersanierung:  die Liste der Aufgaben ist lang für die neue Bildungs- und Kulturreferentin in Augsburg Tatjana Dörfler. Seit 1. August ist sie nun im Amt, nachdem sie aufgrund einer Klage ihres Vorgängers noch etwas länger warten musste. Wie sie an ihre neue Aufgabe ran geht und welche Projekte bei ihr in Zeiten knapper Kassen Priorität haben, darüber spricht sie diese Woche mit Moderatorin Andrea Horn .'
