  description: Eva Färber erfährt von ihrer in Südafrika lebenden Schwester Hanna, dass ihr Vater schwer erkrankt ist. Sofort bucht sie den nächsten Flug. Als sie noch schnell ihrem Mann Paul Bescheid geben will, findet sie heraus, dass dieser sie betrügt. In Afrika angekommen, gerät Eva mit dem raubeinigen, aber charmanten Ranger Alex aneinander. Aus den Reibereien entwickelt sich bald eine stürmische Affäre, die Eva vor schwerwiegende Entscheidungen stellt - zumal Paul ihr nachreist und um sie kämpft.
