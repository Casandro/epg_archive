  title: Joachim Deckarm - Meine Reise nach Tatabánya
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Er war, zu seiner Zeit, der wohl beste Handballspieler der Welt: Joachim Deckarm. 1978 wurde er, auf dem Höhepunkt seiner Karriere, Handball-Weltmeister. Ein Jahr später, am 30. März 1979, verunglückte er beim Europapokalspiel im ungarischen Tatabánya. An diesen Ort kehrt Joachim Deckarm zurück. Nicht einfach so, er trifft sich mit Lajos Panovics, dem Spieler, mit dem er damals so unglücklich zusammenprallte. Ebenso mit dabei Heiner Brand, sein damaliger Mitspieler, der den Pass zu Joachim Deckarm spielte.'
