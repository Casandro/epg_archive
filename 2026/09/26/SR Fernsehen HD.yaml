  description: 'Für viele ist der Urlaub die schönste Zeit im Jahr - ob Sommer, Sonne und Strand oder Schnee und Berge: Hauptsache, man kann dem Alltag entfliehen. Doch was passiert, wenn Urlaubserwartungen nicht erfüllt werden, der Urlaub zum Stress wird oder ein Unfall das Leben für immer verändert? "Urlaub - Traum oder Alptraum" - ist das Thema bei SWR Talkshow-Moderator Michael Steinbrecher und seinen Gästen.'
