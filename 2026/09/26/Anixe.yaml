  description: Mittlerweile gibt es viele Anhänger exotischer Gerichte. Diese bestechen nicht nur durch Farbe, Gewürze und die Vielfalt der Zubereitungsmöglichkeiten, sondern schmecken auch noch fantastisch. Zudem sind sie gut verträglich, auch wenn es mal etwas schärfer wird. Unser TV Koch war schon diverse Male auf der Welt unterwegs. In Indien war er sogar über einen längeren Zeitraum. Dementsprechend hat er Insiderwissen bezüglich der Zubereitung von Currys. Und unsere Moderatorin kommt als Vegetarierin voll auf ihre Kosten.  Hier das komplette Rezept!
