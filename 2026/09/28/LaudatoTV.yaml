  title: Svi za stol, Svi za stol
  subtitle: Kulinarski
  description: U novoj emisiji družimo se s Magdalenom Biličić, talentiranom mladom glazbenicom koja predstavlja budućnost hrvatske glazbene scene. Za jelovnik se brine chef Tomislav Vraga, a priprema salatu od kozica s povrćem, zatim lungić s kruškom i krumpirom, a za kraj osvježavajući desert, juhu od jagode i mente.
