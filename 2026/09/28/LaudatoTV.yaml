  title: odaziv
  subtitle: Magazin
  description: Zadivljuju li Boga naše titule, formalne molitve i vanjski dojam? Jesmo li društvo lajkova i deklarativne podrške? Kako biti jasan u odgovoru 'da' ili 'ne'? Kada se i čemu smijemo predomisliti? Kako Bog mjeri našu vjernost? O ovim pitanjima razgovaramo slijedeći Riječ Božju 26. Nedjelje kroz godinu. S nama je stručni suradnik u emisiji vlč. Odilon Singbo.
- eventId: 1118913
  start: 2026-09-28T21:00:00Z
  stop: 2026-09-28T21:30:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Bog je Ljubav i Gospodnja Ljubav jest savršena, strastvena i bezuvjetna. Ne možemo ništa učiniti čime bi potakli Boga da nas voli više, niti možemo učiniti išta da nas voli manje. Sposobni smo kušati ljepotu i slobodu Božje Ljubavi po Duhu Svetome. Božji Duh objavljuje nam Ljubav Oca koja nas mijenja. Kada doživljavamo Božju ljubav, na silovit način dolazimo do spoznaje da smo u stvari 'stvoreni biti ljubljeni'.
