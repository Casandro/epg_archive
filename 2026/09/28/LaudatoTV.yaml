  title: Generacija plus
  subtitle: Magazin
  description: Isus u Otkrivenju snažno upozorava kršćane na opasnost duhovne mlakosti. Tko se zadovoljava površnom vjerom, miri se s grijehom, ne želi rasti u ljubavi prema Bogu i izlaže se ozbiljnoj duhovnoj opasnosti. No mlakost nije isto što i ljudska slabost, umor ili razdoblje duhovne suhoće. Kako ponovno probuditi gorljivost i živjeti vjeru koja nije samo običaj, nego stvaran odnos s Kristom?
