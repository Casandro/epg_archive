  title: Superknjiga
  subtitle: Animirani
  description: Luka nije poslušao oca i ušuljao se u laboratorij profesora Kvantuma i gotovo uništio super tajni projekt. Superknjiga odvodi Luku, Elu i Gizma na putovanje da vide pad Lucifera s neba i njegovu preobrazbu u Sotonu. Sotona je zbačen na zemlju gdje dobiva oblik zmije i gdje prevari Adama i Evu da i oni budu neposlušni Bogu. Luka, Ela i Gizmo gledaju uništenje savršenog svijeta Adama i Eve koji se dogodio zbog njihove neposlušnosti. Superknjiga vraća naše junake kući, ali ih ostavlja sa vrlo važnom porukom o Božjoj ljubavi i oproštenju.
