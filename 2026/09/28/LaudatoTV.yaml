  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: Iz životnog iskustva, ali i stručnog znanja o ovome govori Matej Čuljak, psiholog i logoterapeut, suprug i otac šestero djece. Koliko nas rane definiraju i kako ih iscijeliti? Postoji li škola za očeve? Smije li otac pogriješiti? Što djeca zapravo trebaju od tate? Saznajte u emisiji ,,Kako dalje?.
- eventId: 1118616
