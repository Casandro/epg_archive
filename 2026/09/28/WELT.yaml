  title: Lost Places - Folge 63
  subtitle: Lost Places - Folge 63
  description: In Arkansas in den Ozarks befindet sich eine seltsame kleine Siedlung. Dies ist Dogpatch USA, einst einer der ungewöhnlichsten Freizeitparks des Landes. Heute stehen nur Überreste davon, die eine faszinierende Geschichte erzählen. Nahe der englischen Großstadt Birmingham liegt ein weiterer Ort versteckt in der Natur. Eine Tür mitten im Wald führt hinab in ein unterirdisches Labyrinth. Dies sind die Drakelow Tunnel, die zur Zeit des Nationalsozialismus als geheimes Flugzeugwerk genutzt wurden.
  widescreen: true
- eventId: 1203776
  start: 2026-09-28T01:04:00Z
  stop: 2026-09-28T01:49:00Z
  title: Hitlers Helferinnen - Frauen im NS-Staat (1)
  subtitle: Hitlers Helferinnen - Frauen im NS-Staat (1)
  description: Lange galten Frauen als passive Zeuginnen eines von Männern verübten Völkermordes, dabei dienten mehr als hunderttausende Frauen dem Dritten Reich. Wie wurden sie zu Hitlers Komplizinnen und in einigen Fällen sogar zu Mörderinnen? Und warum verschloss die Justiz der Nachkriegszeit ihre Augen vor ihren Verbrechen?
  widescreen: true
- eventId: 1203777
  start: 2026-09-28T01:49:00Z
  stop: 2026-09-28T02:35:00Z
