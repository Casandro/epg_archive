  subtitle: Lewwerknepp mit Sauerkraut und Kartoffelpüree
  description: |-
    "Mit Herz am Herd" startet in eine neue Staffel mit köstlichen, bodenständigen und pfiffigen Rezepten aus Cliff Hämmerles Sterneküche.

    Cliff verrät Tipps und Tricks und legt die Rezepte so an, dass sie einfach und leicht nachkochbar sind. Darunter sind viele saarländische Rezepte, wie etwa die berühmte saarländische Eierschmeer oder Lewwerknepp. Ein kulinarisches Highlight der Cliffschen Heimatküche ist das Heckengemüse mit Schmorbäckchen.
