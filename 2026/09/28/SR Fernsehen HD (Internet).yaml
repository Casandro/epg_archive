- eventId: 1302972
  start: 2026-09-28T08:20:00Z
  stop: 2026-09-28T08:50:00Z
  title: Eisenbahn-Romantik (848)
  subtitle: Kamerun in einem Zug
  description: '"Afrika en miniature" wird Kamerun gerne aufgrund seiner vielfältigen Kulturen genannt. Besonders abenteuerlich ist die Entdeckung dieses zentralafrikanischen Landes mit der Eisenbahn. Gebaut wurde sie während deutscher Kolonialzeit und später unter französischem Mandat. Noch heute gehen manche Kameruner zum "Banop", zum Bahnhof. Die Reise auf der sogenannten Mittellandbahn führt vom Wirtschaftszentrum Douala, unweit des Atlantiks, hinauf nach Yaoundé, der Hauptstadt Kameruns. Die Eisenbahn ist der ideale Ort, die Menschen und die Kultur des Landes zu entdecken.'
