- eventId: 1260204
  start: 2026-09-28T17:50:00Z
  stop: 2026-09-28T18:00:00Z
  title: Hajaja
  description: Pohádky z letní zahrádky 8/8 - Matylda a tulipánový skřítek. Máte rádi květiny? Kdo by neměl, viďte. K rozkvetlým kytkám si každý rád přivoní, ale kdo k nim občas přiloží ucho? Možná byste to měli zkusit. Květiny z letní zahrádky totiž umějí vyprávět pohádkové příběhy? Osm pohádek z letní zahrádky napsala Melita Denková. Natočeno v roce 1998. Režie Vladimír Gromov. Vypráví Daniela Kolářová.
