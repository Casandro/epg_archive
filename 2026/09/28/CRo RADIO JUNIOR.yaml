  title: Velká pohádka
  description: Hadrnička. Zlá královna prokleje princeznu Johanku, aby zapomněla na všechny, které má ráda, aby zmizela v temném lese a provázela ji samota a aby se všechny šaty na jejím těle okamžitě proměnily v hadry. Aby toho nebylo málo, přičaruje si královna dívku navlas stejnou, jako je Johanka. A tahle "loutka" poslechne zlou panovnici na slovo. Dokáže šašek spolu s princem Radovanem najít skutečnou princeznu a vysvobodit ji ze zakletí? Napsala Anna Jurásková, režie Jan Berger. Natočeno v roce 1983. Účinkují Miroslav Masopust, Zlata Adamovská, Viktor Preiss a další.
