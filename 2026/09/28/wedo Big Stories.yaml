  description: 2019 ● S1 E8 Die Sonne treibt die Maschinerie der Natur und unser Wetter an. Sie fördert und erhält das Leben an Land und auf See. Wenn sie im Westen untergeht, enthüllt sie uns ihre vielen Milliarden Geschwistersterne, die den Nachthimmel bevölkern. Education / Science / Factual topics 2019, Season:1 Episode:8
