  subtitle: Exo Planets, Education / Science / Factual topics 2019, Season:1 Episode:9
  description: 2019 ● S1 E9 Während Wissenschaftler und Astronomen immer genauer auf nahe gelegene Sterne schauen, entdecken sie gleichzeitig auch Exoplaneten. Es sind Welten außerhalb unseres eigenen Sonnensystems. Dank des technologischen Fortschritts und verbesserter Techniken entdecken die Wissenschaftler jeden Tag mehr und mehr Welten. Wissenschaftler sind sich sicher, dass es allein in unserer Milchstraßengalaxie bis zu 40 Milliarden erdähnliche Planeten geben könnte. Education / Science / Factual topics 2019, Season:1 Episode:9
