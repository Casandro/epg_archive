  description: |-
    Tomáš Kačo a Pokáč
    Portréty inspirativních osobností. Narodil se v Novém Jičíně jako čtvrté z dvanácti dětí. Tomáš Kačo miloval muziku a když chtěl odejít studovat konzervatoř do Ostravy, rodičům připadalo, že to je moc daleko. Prosadil si svou, pak vystudoval ještě AMU v Praze a Berklee College of Music v Bostonu. Pokáč (neboli Jan Pokorný) vystudoval softwarové inženýrství na ČVUT, měl pracovní nabídku ze zahraničí, ale dal přednost skládání písniček. Tomáš koncertoval v Carnegie Hall, Pokáč dvakrát vyprodal O2 Arénu, (spravodajstvo)
