- eventId: 1299279
  start: 2026-09-28T04:20:00Z
  stop: 2026-09-28T04:50:00Z
  title: Wie geht das? Kartoffelvielfalt
  subtitle: Von Pommes bis Papier
  description: Die Kartoffel ist ein Grundnahrungsmittel. So hat es sich der Kartoffelpionier Friedrich der Große in seinem "Kartoffelbefehl" aus dem Jahre 1756 für seine Untertanen gewünscht. Niedersachsen ist das mit Abstand größte Kartoffelanbaugebiet in Deutschland. Im Westen Niedersachsens, in der Grafschaft Bentheim, steht Europas größte kartoffelverarbeitende Stärkefabrik. Die Dokumentation aus der Reihe "Wie geht das?" besucht den Kartoffelbauern auf dem Acker bei der Ernte der "Erdäpfel" und blickt hinter die Kulissen der Kartoffelindustrie.
