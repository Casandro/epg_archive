- eventId: 1295182
  start: 2026-09-28T02:40:00Z
  stop: 2026-09-28T03:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  description: "In Kölau in Niedersachsen möchte Christine Bremer eine selbst geschneiderte Spezialanfertigung testen: Putensättel. Die sollen als eine Art Schutzkleidung für den Paarungsakt mit den Hähnen dienen. Denn das Federkleid der Puten ist zum Teil schon so abgenutzt, dass die Tiere bereits kleinere Hautverletzungen davongetragen haben. Aber die Sättel sitzen nicht so wie Christine sich das vorgestellt hat. \n\nAuf Hof Schmidt in Sarnekow (Schleswig-Holstein) ist Erntezeit für die Frühkartoffeln. Auf dem Roder hat Landwirt Marko Ladewig tatkräftige Unterstützung von seinen Schwiegereltern."
- eventId: 1297607
  start: 2026-09-28T03:10:00Z
  stop: 2026-09-28T03:55:00Z
  title: DAS! Rote Sofa
  subtitle: Michaela Benthaus, Astronautin, Luft- und Raumfahrtingenieurin
  description: Als erster Mensch mit Querschnittslähmung flog Michaela Benthaus im Dezember 2025 auf einem Parabelflug ins All und erlebte den Zustand der Schwerelosigkeit. Auf dem Roten Sofa erzählt die Astronautin von ihrem außergewöhnlichen Lebensweg zwischen Wissenschaft, Technik und persönlicher Stärke. In ihrem demnächst erscheinenden Buch "Zwischen Schwerkraft und Schwerelosigkeit" berichtet sie auch über ihr Leben mit einer Querschnittslähmung, die ihren Weg nachhaltig geprägt hat.
- eventId: 1298704
  start: 2026-09-28T03:55:00Z
  stop: 2026-09-28T04:20:00Z
  title: Elefant, Tiger & Co. (961)
  subtitle: Afrika von A bis Z
  description: In den "Afrika"-Revieren gibt es jede Menge zu sehen. Allein die Kiwara-Savanne bietet mit 25.000 Quadratmetern ein riesiges Areal. Die Artenvielfalt reicht von A wie Antilope bis Z wie Zebra. Bei den Elefanten startet das Jahr mit verheißungsvollen Nachrichten, denn die noch recht jungen Elefantenkühe Pantha und Thuza erwarten Nachwuchs. Bei den Erdmännchen wird eine aus Feuerwehrschläuchen gebastelte Hängematte als Wohlfühloase installiert.
