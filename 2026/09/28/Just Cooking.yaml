  title: Mein wunderbarer Kochsalon - Bananen-Heidelbeer-Muffins
  subtitle: Mein wunderbarer Kochsalon - Bananen-Heidelbeer-Muffins
  description: Meine zwölfjährige Tochter Lilly liebt Einhörner (ja, noch immer), bauchfreie T-Shirts (sorry Lilly, ein klares Nein von deiner verzopften Mutter) und alles, was mit Banane zu tun hat (hier gehe ich vollinhaltlich mit). Aus diesem Grund kaufe ich immer Bananen, natürlich viel zu viele, sodass die arme Lilly gar nicht mit dem Essen fertig wird und ich mir als Strafe immer wieder Rezepte ausdenken muss, um die nicht mehr ganz so ansehnlichen Exemplare zu verarbeiten. Diese Bananen-Heidelbeer-Muffins sind ideal dafür, man spart an raffiniertem Zucker, bekommt einen herrlich fruchtigen Geschmack und ein glückliches Kind. Volltreffer! AT 2019
