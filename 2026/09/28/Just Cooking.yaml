  title: Mein wunderbarer Kochsalon - Tortilla Espanola
  subtitle: Mein wunderbarer Kochsalon - Tortilla Espanola
  description: Tortilla Española ist ungefähr das emotionale Äquivalent zu unserem Schnitzel. Begibt man sich im Internet auf die Rezept-Suche, bekommt man 2.650.000 Treffer. Das wollen wir nicht, sondern einfach nur das beste Rezept. Ich bin überzeugt, dass ich es gefunden habe - dank der Winzerin Adriana González vom Weingut Lichtenberger-González im Burgenland. Sie ist der Liebe wegen nach Österreich gezogen, bis dahin hat sie mit ihrer Mutter an der besten Version der Erdäpfel-Ei-Flade gefeilt. Das war es wert. Und wie. AT 2019
  ageRating: 6
- eventId: 1235056
