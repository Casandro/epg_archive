  subtitle: Mein wunderbarer Kochsalon - Nutella-Kekse mit Cranberries
  description: 'Es gibt einen gemeinsamen Nenner all unser Kindheitserinnerungen: Nutella. Diese haselnussige Crème gab es bei uns nur am Sonntag aufs Brot und schon beim Schlafengehen am Vorabend freute ich mit darauf. Ich habe ein bisschen experimentiert und kinderleichte Nutella-Cookies erfunden, die den Geschmack gemeinsam mit getrockneten Cranberries besonders gut rüberbringen. Einziges Problem: schweres Suchtpotenzial. AT 2019'
