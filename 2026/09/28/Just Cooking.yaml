  title: Mein wunderbarer Kochsalon - Kärntner Ritschert mit Forelle
  subtitle: Mein wunderbarer Kochsalon - Kärntner Ritschert mit Forelle
  description: Ritschert, das schmeckt für mich nach Kindheit. Meine Mutter kochte geselchte Würsteln und im Sud dann Gerste, Zwiebeln, Karotten, bis es sich zu einem geschmacksdichten Eintopf verband. Mit Nostalgie und einem Touch Rührung schaute ich Drei-Hauben-Koch Hannes Müller (Forelle/Weißensee) beim Ritschert-Kochen über die Schulter. Das Ergebnis war schlicht und ergreifend köstlich und wie so oft danach frage ich mich, warum ich so selten mit Rollgerste koche. AT 2019
  ageRating: 6
- eventId: 1235057
  start: 2026-09-28T13:30:00Z
  stop: 2026-09-28T13:33:00Z
  title: Mein wunderbarer Kochsalon - Nutella-Kekse mit Cranberries
  subtitle: Mein wunderbarer Kochsalon - Nutella-Kekse mit Cranberries
  description: 'Es gibt einen gemeinsamen Nenner all unser Kindheitserinnerungen: Nutella. Diese haselnussige Crème gab es bei uns nur am Sonntag aufs Brot und schon beim Schlafengehen am Vorabend freute ich mit darauf. Ich habe ein bisschen experimentiert und kinderleichte Nutella-Cookies erfunden, die den Geschmack gemeinsam mit getrockneten Cranberries besonders gut rüberbringen. Einziges Problem: schweres Suchtpotenzial. AT 2019'
  ageRating: 6
- eventId: 1235058
  start: 2026-09-28T13:35:00Z
  stop: 2026-09-28T13:39:00Z
  title: Mein wunderbarer Kochsalon - Bananen-Heidelbeer-Muffins
  subtitle: Mein wunderbarer Kochsalon - Bananen-Heidelbeer-Muffins
  description: Meine zwölfjährige Tochter Lilly liebt Einhörner (ja, noch immer), bauchfreie T-Shirts (sorry Lilly, ein klares Nein von deiner verzopften Mutter) und alles, was mit Banane zu tun hat (hier gehe ich vollinhaltlich mit). Aus diesem Grund kaufe ich immer Bananen, natürlich viel zu viele, sodass die arme Lilly gar nicht mit dem Essen fertig wird und ich mir als Strafe immer wieder Rezepte ausdenken muss, um die nicht mehr ganz so ansehnlichen Exemplare zu verarbeiten. Diese Bananen-Heidelbeer-Muffins sind ideal dafür, man spart an raffiniertem Zucker, bekommt einen herrlich fruchtigen Geschmack und ein glückliches Kind. Volltreffer! AT 2019
  ageRating: 6
