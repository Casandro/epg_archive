  stop: 2026-09-28T05:30:00Z
  title: Mein wunderbarer Kochsalon - Garnelen-Temoura mit Kopfsalat und Yuzu-Trüffel-Dressing
  subtitle: Mein wunderbarer Kochsalon - Garnelen-Temoura mit Kopfsalat und Yuzu-Trüffel-Dressing
  description: 'Mochis, das sind eigentlich kleine Reisteigküchlein, die in Japan vor allem zu Neujahr gegessen werden. Oder man lebt in Wien, da erzeugen diese zwei kleinen Silben schwärmerische Blicke. Seit sieben Jahren schaffen es die Betreiber des japanischen Restaurants, mit Witz, Charme und Qualitätsfanatismus, die Mochi-Fans so nachhaltig mit Suchtgefühlen zu infizieren, dass man es hinnimmt, drei Monate auf einen Tisch zu warten. Ich fühle mich heute sehr privilegiert - das bleibt mir erspart, weil das Mochi kommt in den Kochsalon. Einer der Betreiber, Eddi Dimant, zeigt mir einen meiner liebsten Mochi-Standards: Salat mit Yuzu-Trüffel-Dressing mit Garnelen-Tempura. AT 2019'
