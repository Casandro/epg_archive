  title: Die besten Köche der Welt - Zu Gast im Ikarus - Pino Lavarra
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Pino Lavarra
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Das Ristorante ROSSELLINIS im Palazzo Sasso zählt zu den Besten Italiens. Chef Pino Lavarra ist nach vielen Jahren in Asien und England nach Italien zurückgekehrt und führt dort seit der Eröffnung im Jahre 1997 das preisgekrönte Rossellinis. AT 2012'
- eventId: 1235075
  start: 2026-09-28T14:10:00Z
  stop: 2026-09-28T14:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Pino Lavarra in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Pino Lavarra in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein klassischer Italiener, der eine Menge Frische in die Haute Cuisine bringt. Zwei-Sternekoch Pino Lavarra aus Ravello in Süditalien ist zu Gast im Ikarus-Restaurant des Salzburger Hangar-7. Lavarra wirkt bescheiden und bodenständig. Er arbeitet wie ein Künstler mit Farbe und Pinsel, aber auch mit traditionellen Rezepten und ungewöhnlichen Kochutensilien.   AT 2012'
- eventId: 1235076
  start: 2026-09-28T14:35:00Z
  stop: 2026-09-28T14:59:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Paolo Casagrande
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Paolo Casagrande
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Paolo Casagrande ist der offiziell beste Koch von Barcelona! Sein luxuriöses "Lasarte" ist als einziges Restaurant der Stadt mit drei Michelin-Sternen ausgezeichnet worden, und das kommt nicht von ungefähr. Der Küchenchef verarbeitet Außergewöhnliches aus dem Meer zu exquisiten Genüssen, von der Seeanemone bis zum Planktonpulver. Trotz des gewaltigen Erfolgs ist der gebürtige Italiener am Boden geblieben. Für ihn ist Bescheidenheit die wichtigste Zutat seines ganz persönlichen Erfolgsrezepts. Martin Klein taucht tief in die maritime Aromenwelt von Paolo Casagrande ein, und erkundet die appetitlichsten Seiten Barcelonas zwischen trendigen Tapasbars und dem Fang des Tages frisch vom Fischkutter!  AT 2018'
