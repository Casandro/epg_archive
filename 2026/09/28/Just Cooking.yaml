  description: Dieser Fisch darf nochmals schwimmen, und zwar im Öl. Ich finde es schade, dass Fisch meistens nur in der Pfanne landet, es gibt so viele einfache und risikoarme Methoden, ihm sein rohes Wesen auszutreiben. Zuletzt habe ich ihn en papilotte, also mit Gemüse in Backpapier, gepackt, heute wird er konfiert. Was im Klartext einfach bedeutet, dass er in warmem Olivenöl langsam gar zieht.  AT 2017
