  title: Vier Frauen und ein Todesfall - Untergriff
  subtitle: Vier Frauen und ein Todesfall - Untergriff
  description: 'Franzi und Sabi sind verliebt wie am ersten Tag. Aber auch beruflich gehen sie gemeinsame Wege und übernehmen die Tankstelle von der Drey. Diese wiederum ist wieder vereint mit Frosti, der aus der Reha entlassen zurück nach Oberilm kommt. Gemeinsam planen sie die Eräffnung eines neuen Ladens: "Die Drey von der Eisdiele". Kämpferisch geht es dagegen bei Julie zu, die beim traditionellen "Oberilmer Brunzstein-Keilern" gegen den Vater des Vizebürgermeisters Unterholzer antritt. Ilmer gegen Oberilmer heißt es hier. Doch die Entscheidung wird vorzeitig gefällt: Nicht nur Julies Kontrahent, sondern auch seine beiden Kumpanen Vukowitsch und Schrack gehen der Reihe nach zu Boden. Dass hier etwas nicht mit rechten Dingen zugeht, ist nicht nur Julie klar.'
