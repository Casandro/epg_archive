  title: Kampfdrohnen - Waffen der Zukunft
  subtitle: |-
    Kampfdrohnen - Waffen der Zukunft
    Dokumentation, CH 2023
    Altersfreigabe: ab 12
  description: |-
    Autonome Kampfdrohnen und intelligente Waffensysteme revolutionieren die moderne Kriegsführung. Angetrieben von künstlicher Intelligenz, hat ein globales Wettrüsten längst begonnen. Ganze Schwärme sollen künftig den Gegner überrollen und ihn chancenlos machen. Das wirft entscheidende ethische Fragen auf: Wie viel Kontrolle behält der Mensch noch, wenn am Ende ein Algorithmus über Leben und Tod entscheidet und lässt sich diese Entwicklung überhaupt noch regulieren?

    Drehbuch: Andrea Hauner
    Kamera: Axel Thiede, Till Haener
    Schnitt: Petra Beck
