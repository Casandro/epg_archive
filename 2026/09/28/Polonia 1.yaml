  description: Pierwszy sezon głośnego komediodramatu. Piper Chapman (Taylor Schilling) wiedzie spokojne i wygodne życie w Nowym Jorku, przygotowując się do ślubu. Przeszłość jednak ją dogania – za przemyt pieniędzy dla swojej byłej kochanki i dilerki narkotyków, Piper zostaje skazana na 15 miesięcy więzienia. Zmuszona do założenia pomarańczowego drelichu, trafia do zakładu karnego Litchfield, gdzie musi nauczyć się przetrwania wśród barwnej i nieprzewidywalnej społeczności współosadzonych.
