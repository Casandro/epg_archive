  description: "20:00\nTagesschau - Die Themen des Tages aus Deutschland und der Welt erfahren Sie kompakt zusammengefasst in 15 Minuten.\n\n20:15 - 22:00\n\"Mitreden! Deutschland diskutiert\" - Tankrabatt und Preisdeckel - wie teuer darf der Sprit sein?\nWer tanken will, überlegt sich das gerade oft zweiml. Denn die Preise an den Tankstellen sind seit Beginn des \nIran-Krieges deutlich angestiegen. \nViele, wie Pendler oder Spediteure, sind allerdings aufs Auto angewiesen. Die Bundesregierung will jetzt gegensteuern unter anderem\nmit einem Tankrabatt. Ist das der richtige Weg oder wären andere Maßnahmen sinnvoller?\nUnd: muss die Regierung überhaupt eingreifen bei den Spritpreisen?\n\nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html"
