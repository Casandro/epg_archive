- eventId: 619616
  start: 2026-09-28T16:30:00Z
  stop: 2026-09-28T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Gefahren für den Fötus - Was unsere Gesundheit vor der Geburt prägt
  description: |-
    Von Alexandra Duong
    Alkohol und Nikotin sind tabu, klar. Aber Schwangere sollen auch gesund essen, eine lange Liste von Schadstoffen meiden, sich genug bewegen und sich bei all dem nicht stressen. Schon im Mutterleib wirken sich Umwelteinflüsse auf die lebenslange Gesundheit des ungeborenen Kindes aus. Unser Erbgut, das Genom und das Exposom, alle inneren und äußeren Einwirkungen von der Befruchtung bis zum Tod, entscheiden darüber, wie gesund das Kind ist und woran es erkranken wird. Neben dem Einfluss der Eltern zeigt die Exposomforschung auch, dass es eine gesellschaftliche Aufgabe ist, Krankheiten vorzubeugen.
- eventId: 619617
  start: 2026-09-28T17:00:00Z
  stop: 2026-09-28T18:00:00Z
  title: Der Tag
  description: Ob Erdbestattung und Urnengrab, Wald-, See- oder Luftbestattung - der Umgang mit dem Lebensende und der Bestattung von Verstorbenen hat sich in den letzten Jahren stark verändert. In der Kulturgeschichte der Menschheit gilt die Bestattung der Toten als einer der fundamentalsten Meilensteine. Sie ist kein rein praktischer Akt, sondern das älteste Zeugnis für abstraktes Denken, Mitgefühl und die Frage nach dem, was nach dem Tod kommt. Schon die Neandertaler nahmen vor über 70.000 Jahren Bestattungen vor. Sie gaben ihren Toten Blütenpollen oder Werkzeuge bei, um sie für ein unbekanntes Jenseits zu wappnen. Wie aber hat die Moderne den Umgang mit dem Tod verändert?
  subtitle: Die Leiche im Keller
