  title: SWR Aktuell Langstrecke
  description: "14:00\nSWR Kultur Das Wissen\nOrgane aus dem 3D-Drucker - Wie weit ist die Medizin?\nHerzen oder Nieren auf Knopfdruck: Medienberichte über Organe aus dem 3D-Drucker klingen nach einer schnellen Lösung für Menschen, die auf ein Spenderorgan warten. Ganz so weit ist die Forschung noch nicht. Doch im Kleinen tut sich etwas: etwa bei Nervenzellen oder mitwachsenden Herzklappen für Babys. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n14:30\n11KM: der tagesschau-Podcast\nRendite statt Reha? Wenn die Klinik für Patienten zur Gefahr wird\nDeutschland altert, und das Geschäft mit Rehakliniken für ältere Menschen boomt. Während Investoren auf hohe Renditen aus sind, kann es für Patienten offenbar gefährlich werden. BR-Investigativ-Reporterin Claudia Gürkov erzählt in dieser 11KM-Folge von zwei Rehakliniken in Bayern und wie Finanzinvestoren mit solchen Einrichtungen viel Geld verdienen wollen. Die Folgen für die hochbetagten Patienten sind zum Teil dramatisch. \nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/"
