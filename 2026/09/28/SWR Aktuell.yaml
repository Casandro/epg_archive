  description: Jeden Tag ein wichtiges Thema - von Montag bis Donnerstag. Eines, das Fragen aufwirft. "Der Tag" sucht Antworten, beleuchtet Hintergründe und ordnet ein. Und spricht mit Menschen, die zum Thema etwas zu sagen haben. Monothematisch, aber facettenreich entsteht so ein Bild aus vielen Perspektiven.
