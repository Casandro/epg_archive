  title: 'Frontmen - Die größten Rockstars aller Zeiten:'
  subtitle: Ozzy Osbourne - Black Sabbath - Film von Steve Tappin und Dee Hendry
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Er schuf mit Black Sabbath ein eigenes Genre und wurde zur Ikone des Heavy Metal: Ozzy Osbourne faszinierte über Jahrzehnte mit Exzessen, Abstürzen und spektakulären Comebacks.

    Die Dokumentation zeichnet den Weg des legendären Frontmanns nach - von seiner schwierigen Kindheit über den Aufstieg mit Black Sabbath bis zu seiner Entlassung wegen Alkohol- und Drogensucht. Freunde und Weggefährten erinnern sich an seinen außergewöhnlichen Lebensweg.
    HD-Produktion
