  title: Nordmazedonien erleben
  subtitle: Film von Nina Heins
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Etwa 80 Prozent der Landschaft Nordmazedoniens ist von hohen Bergen und Gebirgszügen geprägt - ein ideales Reiseland für Outdoor-Begeisterte.

    Ob Wandern, Reiten oder Paragliding - die Filmemacher Nina Heins und Jens Benner lassen kaum etwas aus, um die unberührte Natur des Balkanlands zu erleben. Einen Zugang zum Meer gibt es in dem Land nicht, aber der Ohridsee liefert Urlaubsfeeling pur.
    HD-Produktion
- eventId:
