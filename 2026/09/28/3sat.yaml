  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "An Bord eines Segelboots geht es aufs Mittelmeer zwischen Sardinien und Korsika. Dabei legt sich Michael Friemel natürlich nicht auf die faule Haut. Er muss mit anpacken - wie alle anderen.\n\nDafür sorgt Skipper Arnold, der den Anfängern die Segelgrundlagen beibringt und sie in eines der bezauberndsten Segelreviere des Mittelmeers entführt. \nVon Olbia auf Sardinien geht es Richtung Bonifacio auf Korsika und wieder zurück.\nHD-Produktion"
