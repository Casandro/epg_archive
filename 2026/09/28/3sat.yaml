  title: Sinfonie der Alpenseen
  subtitle: Film von Hans Jöchler
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Filmemacher Hans Jöchler macht sich auf zu den schönsten Alpenseen in ganz Tirol. Mehr als 600 Weiher, Teiche und Seen fügen sich dort wie bunte Diamanten in die Gebirgsketten ein.

    Hans Jöchler besucht unter anderem den Brechsee oberhalb von St. Leonhard im Pitztal, den touristischen Vilsalpsee im Tannheimer Tal sowie den Rifflsee, den größten See in den Ötztaler Alpen.
    HD-Produktion
- eventId:
  - 679552
  - 686199
  start: 2026-09-28T09:00:00Z
  stop: 2026-09-28T09:45:00Z
  title: 'Wüste der Alpen: Lebendiges Totes Gebirge'
  subtitle: Film von Markus Raich
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das Tote Gebirge erstreckt sich von der Eisenwurzen bis in das Salzkammergut. Es gilt mit seiner Fläche von über 1100 Quadratkilometern als das größte hochalpine Karstplateau Mitteleuropas.

    Filmemacher Markus Raich hat über ein Jahr hinweg eine Vielzahl an spektakulären Stimmungen und Bergpanoramen im Toten Gebirge mit seiner Kamera eingefangen und weit über 50.000 Höhenmeter zu Fuß zurückgelegt. Schauspieler Cornelius Obonya ist Erzähler des Films.
    HD-Produktion
- eventId:
