  title: Wydział kryminalny Kitzbühel
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2001)
    Występują: Kristina Sprenger, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Hans Sigl, Anja Stöhr, Marion Rottenhofer, Harald Windisch, Cornelius Obonya, Monika Finotti
    Policjanci z wydziału kryminalnego w kurorcie Kitzbühel prowadzą dochodzenia w sprawach zbrodni burzących idylliczny wizerunek miasta. Odkrywają tajemnice za fasadą luksusu, często związane z wpływowymi mieszkańcami. Każda sprawa ujawnia mroczne aspekty świata wyższych sfer, ukazując skomplikowane relacje i sekrety.
    Od lat: 12
  ageRating: 12
