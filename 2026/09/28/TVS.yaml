  title: Rosamunde Pilcher - Aż po krańce świata 1 (odc. 46)
  subtitle: Młoda nauczycielka Sheila O'Connor przyjeżdża do posiadłości rodziny Carmichaelów, by uczyć dziesięcioletnią Louise, córkę Roberta.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Bis ans Ende der Welt
    DE, 2002
    Reżyseria: Dieter Kehler
    Występują: Lara-Joy Körner, Philippe Brenninkmeyer, Max Gertsch, Doreen Dietel, Monika Peitsch, Manfred Zapatka
    Sheila O'Connor, młoda, ładna nauczycielka, przyjeżdża na wiejski majątek braci Roberta i Paula Carmichaelów, właścicieli firmy tekstylnej Carmichael-Tweeds, aby uczyć dziesięcioletnią córkę Roberta. Sheila od razu dogaduje się z samotną po rozwiedzeniu Louise i zakochuje się w ojcu. Jednak Robert wykluczył miłość ze swojego życia od czasu rozstania z matką Louise i prawie nie zwraca uwagi na Sheilę.
  ageRating: 12
  genre:
  - '22'
- eventId: 1080505
  start: 2026-09-28T19:50:00Z
  stop: 2026-09-28T21:35:00Z
  title: 'Rosamunde Pilcher: Pióra na wietrze 1 (odc. 52)'
  subtitle: Kobieta spędza z chorą na astmę córką wakacje nad morzem, gdzie zaprzyjaźnia się z tajemniczym sokolnikiem. Panie odkrywają, że jego wspólnik próbuje wywieźć ptaki za granicę.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Federn im Wind
    DE,AT, 2003
    Reżyseria: Michael Faust
    Występują: Julia Bremermann, Julia Krombach, Erol Sander, Mark Keller, Thomas Fritsch, Antje Hagen
    Kobieta przyjeżdża z chorą na astmę córką nad morze, licząc na spokojne wakacje i poprawę jej zdrowia. Na miejscu poznaje tajemniczego sokolnika i szybko się z nim zaprzyjaźnia. Sielanka kończy się, gdy odkrywają, że jego wspólnik potajemnie wywozi klatki z ptakami na statek, by przemycić je za granicę. Postanawiają pokrzyżować mu plany. Akcja ratunkowa wymyka się spod kontroli, a sytuacja staje się dramatyczna, gdy dziewczynce zaczyna grozić poważne niebezpieczeństwo.
  ageRating: 12
  genre:
  - '22'
