  title: Sváteční host Jindřich Chmelař
  description: Spolek Cesta Česka má za sebou více než deset let činnosti, během nichž vytyčil známé poutní stezky Blaník-Říp a Říp-Blaník. Organizace se dlouhodobě věnuje pořádání dětských táborů a každoroční Pouti Českého anděla, která prochází i Ústeckým krajem. Významný milník své práce spolek mapuje také prostřednictvím speciálního kalendáře s fotografiemi z obou poutních tras. O uplynulé dekádě úspěšných projektů a hodnotách spolku si Slávka Brádlová povídala s jeho předsedou, našim svátečním hostem, Jindřichem Chmelařem.
