  description: Dnes bude nabízet scénky a ukázky z pořadů herečka, zpěvačka, konferenciérka a televizní i rozhlasová moderátorka Pavlína Filipovská. Společně s Pavlem Kučerou vám nabídnou vždy nějakou scénku a vy rozhodnete, jestli chcete slyšet stejného komika nebo někoho jiného. Vyberte si i dnes humor podle svého gusta pomocí smsek.
