  title: Na pěknú notečku
  description: Zpívající Václavové. Na svátek sv. Václava si poslechněme pěvce tohoto jména. Konkrétně to budou Václav Švík, Harnoš, Kovářík, Horák a také třeba Vašek z Prodané nevěsty. Pány zpěváky doprovodí Plzeňský lidový soubor, Brněnský rozhlasový orchestr lidových nástrojů, cimbálová muzika Friška nebo orchestr Národního divadla v Praze. Pořad připravil Jaroslav Kneisl a Vaškům popřeje Markéta Ševčíková.
