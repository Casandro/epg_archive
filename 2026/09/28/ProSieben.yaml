    Die Werkstatt hat mehr Gewinn gemacht als erwartet und Georgie möchte das Geld sinnvoll nutzen. Der Rest der Familie drängt ihn jedoch, sich selbst etwas zu gönnen. Er ist es nicht gewohnt, Geld für sich auszugeben, und tut sich damit schwer, bis er eine Sache sieht, die er schon immer haben wollte. Währenddessen erzählt Jim Audrey, dass er sich einst ein Ticket für den Super Bowl gekauft hatte. Sie ist außer sich, dass er sie damals nicht mitgenommen hat.

