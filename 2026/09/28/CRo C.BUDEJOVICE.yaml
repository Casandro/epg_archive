  title: Jihočeské odpoledne
  description: Jak se žilo v jeskyni před desítkami tisíc let? Na Den lovců mamutů v Dobrkovické jeskyni na Českokrumlovsku si návštěvníci vyzkoušejí pravěké lovecké dovednosti, rozdělají oheň bez zápalek nebo si vyrobí vlastní nástroj. Přímo na místě bude naše reportérka Eliška Kotlínová. Představíme také dvacetiletého kytaristu Jana Dudáka, který se po náročných talentových zkouškách dostal na prestižní Berklee College of Music v Bostonu. Zajímá nás i to, jak se podle odborníků bude v dalších letech měnit hospodaření s vodou v době častějšího sucha a povodní. Brněnští astronomové chtějí středoškolákům otevřít cestu k výzkumu vesmíru a ukázat jim, že k němu vede řada různých oborů - od astronomie přes programování až po konstrukci přístrojů.
