  title: OnlineKirche mit Pastor Gert Hoinle - Gottes Engel helfen dir | Engel 2
  description: Pastor Gert listet die biblischen (!) Engelkategorien und ihre Aufgaben kurz auf und erklärt sie. Dabei klären sich Mythen wie die über Schutzengel auf. Cheruben verschließen bestimmte Türen und öffnen andere. Außerdem tragen sie Gottes Thron. Seraphen hantieren schmerzfrei mit glühenden Kohlen. Andere Engel wirken im Hintergrund und führen glückliche Fügungen herbei. Wenn wir sterben, holen sie uns ab. Und dann gibt es noch den geheimnisvoll-einzigartigen "Engel des Herrn", der etwa Abraham oder Mose erschien--und auch Hagar. Alles sehr interessant. Die Bibel sagt übrigens viel mehr über Engel als über Dämonen und selbst den Heiligen Geist.
  widescreen: true
- eventId: 1237904
  start: 2026-09-28T04:00:07Z
  stop: 2026-09-28T04:31:17Z
  title: OnlineKirche mit Pastor Gert Hoinle - Die Stunde der Abrechnung kommt | Galater 6
  description: Jede Tat ist eine Saat und das Gesetz von Saat und Ernte ist dein bester Freund oder dein schlimmster Feind. Mit allem, was wir tun, säen wir entweder aufs Fleisch, von dem wir dann Verderben ernten, wie Absalom, oder auf den Geist, von dem wir ewiges Leben ernten, wie Kornelius. Doch Gott hilft Leuten, deren fragwürdige Taten sie in problematische Situationen brachten, wie die Ehebrecherin im Tempel. Man muss sich aber helfen lassen, damit man zum Schluss nicht auch noch unerlöst stirbt.
  widescreen: true
- eventId: 1237905
  start: 2026-09-28T04:31:17Z
  stop: 2026-09-28T05:00:04Z
  title: Gunst der Stunde mit Heiko Bräuning - Wenn Gott unsre Herzen wärmt (mit Abendmahl)
  description: 'Was für ein schönes Herz, ein Plüschherz. Hab ich geschenkt bekommen. Wenn wir an das Herz denken, meinen wir oft mehr als nur ein Organ. Das Herz steht für Gefühle, Entscheidungen, Sehnsucht und Mut. Es ist das Zentrum des Menschen. Dieses Plüschherz ist weich, verletzlich und o?en - genau wie unser eigenes Herz. Es zeigt: Im Herzen sammeln sich Freude und Schmerz, Liebe und Angst, Vertrauen und Zweifel. Wir feiern Gott in unserem Herzen, der es sich aufs Herz gelegt hat, uns zu herzen. Er will unser Bestes! Und das feiern wir gemeinsam auch im Abendmahl!'
  widescreen: true
