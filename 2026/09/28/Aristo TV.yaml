  title: ANIXE auf Reisen - Antarktis mit Richy Müller Teil 1
  description: Der bekannte Schauspieler und Tatort-Kommissar Richy Müller nimmt Sie mit auf eine erlebnisreiche Reise durch das ewige Eis des sechsten Kontinents. In der wohl abgelegensten Region der Erde ist der private Expeditions-Tourismus erst vor knapp 50 Jahren angekommen. Ein recht neues Phänomen für ein Gebiet, das deutlich größer ist als Europa. Erfahren Sie im ersten Teil der Antarktis-Reportage, welche Regeln für Touristen beim Zelten im ewigen Eis bestehen und was es beim Kontakt mit Pinguinen zu beachten gibt. Haben Sie gewusst, dass Pinguine in der Antarktis immer Vorfahrt haben? Heften Sie sich an die Fersen von Richy Müller bei einer Schneeschuhwanderung und beim Besuch einer polaren Forschungsstation. Natürlich will der Schauspieler auf dem antarktischen Festland eine Nacht verbringen. Kein Problem, könnte man meinen...., aber unter den harschen Wetterbedingungen ist schon das Aufschlagen des Zeltes eine Herausforderung.
  widescreen: true
