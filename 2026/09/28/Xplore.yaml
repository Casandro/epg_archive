  title: Sprintour - Vanlife auf 4100m in Bolivien
  subtitle: Sprintour - Vanlife auf 4100m in Bolivien
  description: 'Willkommen in der höchsten Stadt der Welt! Sie ist chaotisch, laut und faszinierend zugleich. Willkommen in La Paz in Bolivien! Wir mussten mit unserem Wohnmobil durch den verrücktesten Verkehr durch, den wir je erlebt haben um in La Paz in Bolivien auf den Campingplatz zu kommen. La Paz befindet sich auf knapp 3700 Meter und unser Campingplatz auf 4100 Meter in El Alto. Und diese Höhe merken wir! Sie schlaucht uns so sehr, dass wir zwei Tage lang im Wohnmobil verbringen und uns ausruhen müssen. Aber dann geht es endlich nach La Paz! Die drittgrößte Stadt und Regierungssitz in Bolivien. Um ins Zentrum zu kommen, nutzen wir Mi Teléferico. Das ist die Seilbahn in La Paz, die seit 2014 den schlimmen Verkehr in der Stadt entlasten soll. Allein deshalb lohnt es sich dorthin zu kommen. Die Aussicht aus der Seilbahn in La Paz ist grandios. In der Nähe von La Paz gibt es außerdem die bekannte Todesstraße in Bolivien: Deathroad oder auch Estrada de Morte genannt. Wir wagen uns auf die Deathroad und bezwingen Sie mit Fahrrädern. Die Deathroad galt bis 2007 als gefährlichste Straße der Welt. Unser Campingplatz in El Alto ist zwar super gelegen, allerdings auch sehr betroffen von Straßenblockaden, Paraden oder Märkten, die die Straßen unpassierbar machen. So können wir erst später als geplant los und nehmen zum Glück den größten Straßenmarkt der Welt in El Alto mit. Eine ganz tolle Erfahrung! Und am Abend geht es noch zur Cholita Wrestling Show in La Paz. Eine sehr interessante Wrestling Show, bei der Cholitas (indigene Frauen in Bolivien und Peru) gegeneinander kämpfen. Natürlich hat sich keiner dabei verletzt und die Erfahrung war mehr als interessant. BO 2023'
  ageRating: 12
