  title: VIP Trip - Prominente auf Reisen 3 - Singapur mit Katharina Schubert
  subtitle: VIP Trip - Prominente auf Reisen 3 - Singapur mit Katharina Schubert
  description: 'Unterwegs im Stadtstaat Singapur. Seien Sie dabei, wenn die Schauspielerin Katharina Schubert die Metropole an der Südspitze der Malay-Halbinsel durchstreift. Bekannt ist die ''Stadt der Löwen'' heute vor allem für ihren Status als innovatives Handelszentrum in Asien. Jedoch gibt es wohl auch keine andere Stadt auf dem Kontinent, in der Tradition und Moderne so stark aufeinandertreffen. Die Schauspielerin startet ihre Reise im Zentrum der Stadt, in dem Migranten verschiedener Kulturen schon vor über einem Jahrhundert siedelten, um am Wirtschafts-Boom der damaligen britischen Kolonie teilzuhaben. Im Schatten der Wolkenkratzer prägen Relikte der indischen, malaiischen, chinesischen  und europäischen Kultur das Stadtbild, vor allem die koloniale Architektur der Briten. Im viktorianischen Raffles Hotel etwa, das nach dem Gründer der Stadt, Sir Stamford Raffles, benannt ist, folgt Katharina Schubert den Spuren früherer illustrer Persönlichkeiten: Charlie Chaplin oder William Somerset Maugham. Beim Besuch der Long Bar, Geburtsstätte des beliebten Cocktails ''Singapore Sling'', lässt die Schauspielerin die einzigartige Atmosphäre des Hotels auf sich wirken. Weitere kulinarische Spezialitäten findet sie in den Restaurants der Stadt. Die Peranakan-Küche zum Beispiel ist eine Fusion der malaiischen und der chinesischen Küche. Hier kommt die Schauspielerin in den Genuss leckerer Dumplings. Von den Restaurants aus führt ihr Weg zum ''Tempel der Glückseligkeit'' und weiter auf die Shoppingmeile der Orchard Road. Schließlich hat Katharina Schubert das große Glück, mit den Einheimischen das chinesische Neujahr feiern zu können.   DE 2008'
