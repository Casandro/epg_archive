  title: VIP Trip - Prominente auf Reisen 3 - Singapur mit Katharina Schubert
  subtitle: VIP Trip - Prominente auf Reisen 3 - Singapur mit Katharina Schubert
  description: 'Unterwegs im Stadtstaat Singapur. Seien Sie dabei, wenn die Schauspielerin Katharina Schubert die Metropole an der Südspitze der Malay-Halbinsel durchstreift. Bekannt ist die ''Stadt der Löwen'' heute vor allem für ihren Status als innovatives Handelszentrum in Asien. Jedoch gibt es wohl auch keine andere Stadt auf dem Kontinent, in der Tradition und Moderne so stark aufeinandertreffen. Die Schauspielerin startet ihre Reise im Zentrum der Stadt, in dem Migranten verschiedener Kulturen schon vor über einem Jahrhundert siedelten, um am Wirtschafts-Boom der damaligen britischen Kolonie teilzuhaben. Im Schatten der Wolkenkratzer prägen Relikte der indischen, malaiischen, chinesischen  und europäischen Kultur das Stadtbild, vor allem die koloniale Architektur der Briten. Im viktorianischen Raffles Hotel etwa, das nach dem Gründer der Stadt, Sir Stamford Raffles, benannt ist, folgt Katharina Schubert den Spuren früherer illustrer Persönlichkeiten: Charlie Chaplin oder William Somerset Maugham. Beim Besuch der Long Bar, Geburtsstätte des beliebten Cocktails ''Singapore Sling'', lässt die Schauspielerin die einzigartige Atmosphäre des Hotels auf sich wirken. Weitere kulinarische Spezialitäten findet sie in den Restaurants der Stadt. Die Peranakan-Küche zum Beispiel ist eine Fusion der malaiischen und der chinesischen Küche. Hier kommt die Schauspielerin in den Genuss leckerer Dumplings. Von den Restaurants aus führt ihr Weg zum ''Tempel der Glückseligkeit'' und weiter auf die Shoppingmeile der Orchard Road. Schließlich hat Katharina Schubert das große Glück, mit den Einheimischen das chinesische Neujahr feiern zu können.   DE 2008'
  ageRating: 6
- eventId: 1235302
  start: 2026-09-28T11:40:00Z
  stop: 2026-09-28T12:00:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Macau mit Nina Ruge
  subtitle: VIP Trip - Prominente auf Reisen 3 - Macau mit Nina Ruge
  description: Nur knapp eine Stunde mit der Schnellfähre von Hongkong entfernt liegt eine ehemalige portugiesische Kolonie. In der dicht besiedelten südchinesischen Sonderverwaltungszone Macau geht die deutsche Fernsehmoderatorin und Journalistin Nina Ruge auf Entdeckungsreise. Dabei stößt sie auf das Erbe der hier mehr als 450 Jahre herrschenden Portugiesen. Erst 1999 gab Portugal seine Kolonie Macau an die Volksrepublik China zurück. Vor allem in der Altstadt, die mittlerweile zum UNESCO-Weltkulturerbe gehört, sind die Relikte der portugiesischen Kolonialmacht und  ihres christlichen Glaubens nicht zu übersehen. Zahlreiche Kirchen zieren das Stadtbild und mischen sich dabei mit taoistischen Tempelanlagen. Die Verschmelzung von chinesischer und portugiesischer Kultur spiegelt sich in vielen weiteren Lebensbereichen wieder. Die macanesische Küche zum Beispiel ist praktisch eine Fusion beider Landesküchen. Zusammen mit dem deutschen Journalisten und Macau-Insider Harald Bruning verkostet Nina Ruge verschiedenste kulinarische Spezialitäten. Nach einigen Tagen lässt die Moderatorin das "koloniale" Macau hinter sich. Seit der Übergabe an China präsentiert sich Macau in einem gänzlich anderen Licht. Mega-Hotels, Kasinos, Unterhaltungskomplexe und selbst künstlich angelegte Kanäle im venezianischen Stil bestimmen das Bild des "Las Vegas des Ostens". Heinz Rölz, der Hoteldirektor des Hotel Galaxy lädt Nina Ruge ein, mehr über sein Luxus-Resort und den Wirtschaftsboom der Stadt zu erfahren. Ein aus purem Blattgold bestehendes Hotel-Dach und das höchstgelegene Wellenbad der Welt sind dabei nur zwei der Themen. DE 2012
