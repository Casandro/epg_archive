  title: Wanderlust! - Der Trockenmauerweg auf Mallorca, Spanien
  subtitle: Wanderlust! - Der Trockenmauerweg auf Mallorca, Spanien
  description: Abseits des Massentourismus hat Mallorca eine unbekannte Seite, eine Wanderseite! An seiner Westküste lädt ein Gebirgszug zum mediterranen Wandern ein. Durch die Serra de Tramuntana führt der "Trockenmauerweg" über 150 Kilometer von Port Andratx über das Städtchen Sóller bis nach Pollenca im Nordwesten der Ferieninsel. Bradley, Profi-Traveller und Autor von Reise- und Trekkingführern, sucht Europas schönste Wanderwege und Mallorcas Trockenmauerweg gehört gewiss dazu. In sechs Etappen führt er entlang des Küstengebirges, durch Steineichenwälder und Olivenhaine, über Felsgrate und durch schöne Dörfer, immer mit bester Aussicht auf Berge und Meer. Meist folgt die "Ruta de pedra en sec", der "Weg aus trocken verlegten Steinen" den alten Post- und Reitwegen Mallorcas. Sie führen durch alte Kulturlandschaft und die Geschichte der Insel. Das Dorf Banyalbufar liegt inmitten steiler Terrassen über dem Meer, wo die Malvasia-Weintraube wächst. Von Valdemossa bis ins Künstlerdorf Deia wandert Bradley auf den Spuren des "Archiduc". Erzherzog Ludwig Salvator von Österreich-Toskana ließ im 19. Jahrhundert entlang Felsabstürzen mit grandiosen Ausblicken einen Reitweg anlegen, auf dem es sich heute wandern lässt. Die Küste entlang geht es bis zum Leuchtturm von Cap Gros. Von hier fährt eine alte Straßenbahn hoch nach Sóller, Stadt der Orangenhändler. Durch die Schlucht von Biniaraix geht es 800 Höhenmeter hoch auf das Dach der Serra de Tramuntana. Steil bergab führt der "Torrent de Pareis", eine spektakuläre Schlucht, direkt ans Meer. Auf einem "Schneesammlerweg" wandert Bradley zum "Sanktuarium von Lluc", dem heiligen Kloster Mallorcas. Hier wird die Schutzheilige der Insel, eine Schwarze Marienstatue aufbewahrt. Ihr zu Ehren singt ein Chor jeden Tag das Salve Regina. Auf der Placa Major von Pollenca endet der Hike. Abgesehen vom Airport hat Bradley nichts von Ballermann-Tourismus mitbekommen. Mallorca ist wanderbar! DE 2014
