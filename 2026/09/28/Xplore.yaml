  title: Sprintour - Deutscher Einfluss in Paraguay
  subtitle: Sprintour - Deutscher Einfluss in Paraguay
  description: 'Nach einem Unfall in Brasilien haben wir in Paraguay den Unfallschaden am Wohnmobil reparieren lassen. In Hohenau wurde der Schaden zu unserer Zufriedenheit behoben und wir können endlich Paraguay mit unserem Camper erkunden. In Hohenau haben wir bemerkt, dass dort viele Deutsche wohnen. In der letzten Zeit sind auch viele deutsche Auswanderer in Hohenau angekommen. Vor allem Familien. Das wirft viele Fragen auf: Warum finden Deutsche Paraguay als Auswanderungsland so interessant? Nach vielen Gesprächen mit Einheimischen haben wir einige Theorien dazu. Nach der Stadt Hohenau geht es für uns in die Hauptstadt von Paraguay, nach Asuncion. Da merken wir bereits den Unterschied von der großen Hauptstadt zu dem eher dörflichen Erscheinungsbild von Hohenau. Asuncion ist auf den ersten Blick stressig und voll. Als wir jedoch mitten in der Stadt angekommen sind, wundern wir uns was für eine Ruhe und Zufriedenheit diese Stadt ausstrahlt. Sie ist nicht so voll und stressig. Asuncion hat vielleicht nicht so viele Highlights wie andere Hauptstädte in Südamerika, allerdings ist Asuncion sehr angenehm. Zudem gibt es zahlreiche deutsche Schulen, Krankenhäuser und deutsche Geschäfte sowie Bäckereien. Für deutsche Auswanderer vielleicht sehr wichtig, da sie so ihre Gebräuche und Traditionen im fremden Land Paraguay nicht ganz aufgeben müssen. So finden auch wir eine deutsche Bäckerei in Paraguay! Nach so vielen Monaten mit dem Camper durch Südamerika haben wir das Weissbrot einfach nur satt. Deshalb freuen wir uns sehr über Sauerteigbrot und Brezeln. Nach einem sehr entspannten Tag in Asuncion geht es für uns zurück zu dem Wohnmobil Übernachtungsplatz mitten in der Stadt. Wir freuen uns auf die Weiterreise mit unserem Camper durch Paraguay und die Erkundung des Hinterlandes. PY 2023'
  ageRating: 12
- eventId: 1235254
  start: 2026-09-28T07:45:00Z
  stop: 2026-09-28T08:06:00Z
  title: Sprintour - Deutsche Kolonien in Paraguay
  subtitle: Sprintour - Deutsche Kolonien in Paraguay
  description: Letzte Woche waren wir mit unserem Wohnmobil in der Hauptstadt von Paraguay, Asuncion, unterwegs. Jetzt geht es mit unserem Wohnmobil endlich in den Norden von Paraguay, durch den Chaco. Allerdings läuft dort nicht alles nach Plan und wir hängen wieder in der Werkstatt fest. Der westliche Chaco in Praguay besteht aus sumpfigen Palmensavannen, wohingegen der nördliche Teil des Chacos sehr trocken ist. Wir fahren auf der Ruta Transchaco mit unserem Wohnmobil in die Richtung von Filadelfia in Paraguay. Aber zuerst machen wir Halt in einem Naturschutzgebiet, in Campo Maria. Dort entfliehen wir der Hitze, machen uns einen schönen Vanlife Grillabend und können endlich mal ausschlafen. Auch wenn es teilweise sehr trocken ist, kann man dort viele unterschiedliche Vogelarten beobachten. Einmal die Hängematte aufspannen und voll und ganz das Vanlife genießen. Die Ruta Transchaco ist asphaltiert und gehört eher zu den guten Straßen in Paraguay. Die Hauptstraßen in Paraguay sind generell in einem guten Zustand. Wenn man allerdings nach links und rechts abbiegt, dann kann man sehr schnell auf einer schlechten Schotterpiste landen. So auch wir. Wir fahren durch zahlreiche Mennonitensiedlungen und staunen über den deutschen Einfluss in Paraguay. Damals sind viele (Ursprungs-) Deutsche nach Paraguay ausgewandert und haben im Norden deutsche Kolonien gegründet unter der Voraussetzung den Chaco urbar zu machen. Diesen deutschen Einfluss merkt man überall in der Region um Filadelfia und Loma Plata herum. Die deutsche Sprache ist dort weit verbreitet. Es sind auch einige Deutsche in diese Gegend ausgewandert. Zudem haben die Mennoniten dort zahlreiche Geschäfte, in denen wir endlich die Ersatzteile für unser Wohnmobil kaufen können, nach denen wir sehr lange in Südamerika gesucht haben. PY 2023
  ageRating: 12
