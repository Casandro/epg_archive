  title: Tierärztin Dr. Mertens (S06/E13)
  subtitle: Wege zum Glück
  ageRating: 6
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Susanne hat sich entschieden, sie bleibt in Leipzig. Amal verbucht dies als ihren persönlichen Sieg über die Konkurrenten in Wien. Das Verhältnis zwischen Direktorin und Tierärztin entspannt sich leicht, zumal Amal nun endlich ihr Herzensprojekt in trockenen Tüchern weiß. Und so wird der erste Spatenstich für die neue Südamerika-Anlage gefeiert.

    Die tierischen Aufgaben meistert Susanne souverän: Elefantenkuh Rani kann nicht schlafen und die komplette Herde bleibt aus Solidarität mit der alten Dame wach - ein Rätsel für die Tierärztin und Karoline. Außerdem leidet Alpaka Pedro unter einer Gelenkentzündung.
