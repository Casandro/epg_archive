  description: Die Knochenmarktransplantation bei Dr. Roland Heilmann steht kurz bevor. Sein Sohn Jakob soll für ihn spenden, doch er wird plötzlich krank und fällt somit als Spender aus. Fieberhaft wird nun nach einem neuen passenden Spender gesucht. Professor Simoni wendet sich an die globale Datenbank, und selbst in der Klinik lassen sich alle testen. Doch niemand kommt infrage. Die Zeit drängt, und Roland geht es immer schlechter. Sein Enkel Jonas könnte ihn retten. Obwohl ein Kind in seinem Alter normalerweise für eine Spende nicht in Betracht kommt, gehen die Ärzte das Risiko der Transplantation ein.
