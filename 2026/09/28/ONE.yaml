  description: "Drechsler bereitet seine Rache an Sebastian vor. Während er vorgaukelt, ihm die Affäre mit Jeanette nicht nachzutragen, deponiert er einen Brandsatz im Forsthotel, um Sebastians App-Präsentation zu sabotieren. Er ahnt jedoch nicht, dass Sebastian sich zur Brandzeit dort aufhält ...\n \nThomas und Aylin freuen sich auf ihre heimliche Hochzeit am nächsten Tag, doch Erika bekommt Wind davon. Prompt mobilisiert sie Freunde und Bekannte, das Brautpaar mit einer kleinen Feier zu überraschen.\n \nMerle und Justus schmieden Zukunftspläne. Justus ist fest entschlossen, seine Karriere als Meisterdieb an den Nagel zu hängen."
