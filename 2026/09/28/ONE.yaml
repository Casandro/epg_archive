  description: Seit zwei Jahren leben Dr. Susanne Mertens und Lebensgefährte Dr. Christoph Lentz wieder glücklich zusammen und schmieden Zukunftspläne. Sobald die gemeinsame Adoptivtochter Luisa aus dem Haus ist, wollen sie für sechs Monate nach Borneo gehen. Susanne möchte sich in einem Hilfsprojekt für Orang-Utans engagieren, Christoph in einem nahegelegenen Krankenhaus als Humanmediziner arbeiten. Bis es aber soweit ist, gestaltet sich der Alltag im Hause Mertens aufregend wie eh und je. Luisa kämpft mit einer Tierschutzgruppe gegen ein neues Bauprojekt im Zoo und erlebt eine Hochphase der rebellischen Pubertät.
