  title: How I Met Your Mother
  subtitle: Jugendliebe Comedy-Serie, USA 2008
  description: Folge 60, Robins Jugendliebe Simon ist in New York und Robin möchte ihn ihren Freunden vorstellen. Simon, der einst ein ebenfalls gefeierter Star war, verhält sich immer noch unhöflich und arrogant, sodass die Freunde Robin von ihm abraten - diese ist aber immerhin der verliebte Teenager wie vor 15 Jahren. Erst als sie merkt, dass er sie nur ausnutzt und schließlich seine Ex verlässt, ist es Barney, der ,Robin Sparkles' wieder aufmuntern kann.
  widescreen: true
- eventId: 1210060
  start: 2026-09-28T21:40:00Z
  stop: 2026-09-28T22:05:00Z
  title: How I Met Your Mother
  subtitle: Die Ziege Comedy-Serie, USA 2008
  description: Folge 61, Nachdem Barney und Robin die Nacht miteinander verbracht haben, beschließen die beiden, niemandem etwas zu erzählen, schließlich hat Barney gegen den ,Bro-Kodex' verstoßen. Das von ihm verfasste Regelwerk besagt, dass man nie etwas mit der Ex eines Kumpels anfangen darf - nun muss er jedoch einen Weg finden, seinen Ausrutscher Ted zu gestehen. Auf dem Weg zu Teds Überraschungsparty platzt diesem nun der Kragen und er kündigt Barney nach all den Jahren die Freundschaft.
  widescreen: true
- eventId: 1210061
  start: 2026-09-28T22:05:00Z
  stop: 2026-09-28T22:35:00Z
  title: How I Met Your Mother
  subtitle: Der Lückenfüller Comedy-Serie, USA 2008
  description: Folge 62, Ted und Stella sind bereits seit zwei Monaten zusammen, hatten aber noch keinen Sex. Stella, die seit fünf Jahren keinen Sex hatte, und Ted wollen es nun miteinander versuchen, allerdings bekommt Ted Angst, dass er ihre Erwartungen nicht erfüllen kann. Und so blasen sie das gemeinsame Wochenende in einem Hotel ab und Ted lernt stattdessen Stellas Tochter Lucy kennen. Barney befindet sich auf der Suche nach einem neuen ,Bro', was sich als gar nicht so einfach darstellt.
  widescreen: true
- eventId: 1210062
