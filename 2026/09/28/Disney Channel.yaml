  title: Disneys Lilo & Stitch
  subtitle: Die Zeitmaschine Zeichentrick-Serie, USA 2003
  description: Folge 34, Lilo rutscht in einer Pfütze aus und erzählt Keoni, der genau in dem Moment vorbeikommt, dass sie einen Schlammonster-Hulatanz einstudiert. Da sie alles am liebsten ungeschehen machen würde, benutzt sie Jambas Zeitmaschine. Damit richtet sie viel Unheil an, da man zwar die Vergangenheit rückgängig machen kann, aber damit auch die Zukunft verändert. Eines der Probleme ist das Experiment Schmelzi, das alles Mögliche zum Schmelzen bringen kann. Jamba erklärt Lilo, sie müsste noch mal in der Zeit zurückfahren, und Lilo erfährt, dass Keoni ganz begeistert von der Schlammonster-Hula-Idee ist.
