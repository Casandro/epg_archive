  subtitle: Zimmer ohne Aussicht Comedy-Serie, USA 1995
  description: Folge 108, Randy ist von seinem kleinen Bruder Mark genervt, mit dem er ein Zimmer teilen muss. Als er wieder einmal nicht schlafen kann, weil Mark so laut schnarcht, stürmt er das Schlafzimmer seiner Eltern und fordert endgültig ein eigenes Zimmer. Aus Platzmangel entscheidet Tim, den Hobbykeller für ihn auszubauen. Jill ist alles andere als begeistert, sie möchte ihren Sohn lieber näher bei sich wissen. Als das Zimmer fertig ist, zieht Randy unter den neidischen Blicken seines älteren Bruders Brad ein. Doch schon die erste Nacht in der neuen Behausung wird zu einem Horrortrip...
