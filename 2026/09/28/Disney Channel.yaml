  subtitle: Mit den Waffen der Frauen Comedy-Serie, USA 1995
  description: Folge 107, Als Tim für zwei Sätze an Saisonkarten für die Spiele des Basketballteams der Pistons mehrere tausend Dollar ausgibt, reagiert Jill wütend, da sie das Geld eigentlich für größere Anschaffungen im Haus vorgesehen hat. Mit ihrem "bösen Blick" verlangt sie von Tim, die Karten zurückzugeben. Als Tim seinen Freunden mitteilt, dass er die Karten zurückgibt, bemerkt er wie die Frau seines Harry ebenfalls den bösen Blick anwendet. Tim will sich ein derartiges Verhalten nicht länger von Jill gefallen lassen und schließlich kommt es zum Riesenkrach zwischen den beiden.
