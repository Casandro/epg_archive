  title: How I Met Your Mother
  subtitle: Alles muss raus Comedy-Serie, USA 2008
  description: Folge 63, Marshall und Lily brauchen dringend Geld für die Reparatur ihres Holzbodens. Lily versucht ihre Bilder an den Mann zu bringen - und findet schließlich über Umwege eine neue Absatzquelle ... Barney ist seiner Rächerin auf der Spur, die ihm in letzter Zeit des Öfteren die Tour mit den Mädels verdorben hat - es ist Abby. Gemeinsam ziehen die beiden eine Wahnsinnsshow ab, da Abby ja eigentlich Ted eifersüchtig machen will.
  widescreen: true
