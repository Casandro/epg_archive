  title: AS FM jutarnji show
  subtitle: Kome se dan po AS FM jutru poznaje, taj ne trubi u saobraćaju, ne gubi živce u redovima i ne gleda stalno na sat, zato što uz sebe ima dobro društvo koje stane u džep, časkom iskoči na internetu.
  description: Kome se dan po AS FM jutru poznaje, taj ne trubi u saobraćaju, ne gubi živce u redovima i ne gleda stalno na sat, zato što uz sebe ima dobro društvo koje stane u džep, časkom iskoči na internetu ili iz radio-aparata. Sagovornici uz prvu kafu, informator i podrška kroz šumu obaveza, uz pažljivo odabranu plejlistu koja će vas lansirati u novi dan. AS FM jutarnji show kao podrška iz zvučnika stiže svakog dana od 6 do 10h.
- eventId: 1194941
  start: 2026-09-28T08:00:00Z
  stop: 2026-09-28T12:00:00Z
  title: Dan uz AS FM
  subtitle: Šaljemo pozitivne vibracije i zajedno prolazimo kroz najveću gužvu na poslu ili zevanje nad dosadnim zadatkom.
  description: Nemojte živeti samo vikendima, precrtavajući dane od ponedeljka do petka. Tu smo da vam damo dobru energiju, ispratimo vaše aktivnosti dinamičnom muzikom i promenimo perspektivu radnog dana. AS FM je jači od glasa džangrizavog kolege, gradske buke i negativnih misli, zato je mnogima neophodan u zahtevnom periodu od 10 do 14h.
- eventId: 1194986
  start: 2026-09-28T12:00:00Z
  stop: 2026-09-28T16:00:00Z
  title: Popodne uz AS FM
  subtitle: Završetak radnog dela dana ispraćamo uz muziku, a probijamo se kroz gradsku gužvu bez nervoze. Čekanje ćemo iskoristiti za planiranje slobodno vreme I predloge koji vas mogu odvesti na razna mesta.
  description: Završetak radnog dela dana ispraćamo uz muziku, a probijamo se kroz gradsku gužvu bez nervoze. Čekanje ćemo iskoristiti za planiranje slobodno vreme I predloge koji vas mogu odvesti na razna mesta. Ako ste popodnevna smena na poslu, uz jaku kafu imamo još recepata za preživljavanje. Jedna od neiscrpnih razbibriga su rasprave o muško-ženskim odnosima. Istovremeno, popodne uz AS FM je svojevrstan vodič kroz kulturna dešavanja.
- eventId: 1195028
