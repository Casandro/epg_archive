  title: Veče uz AS FM
  subtitle: Savršeno veče počinje kada konačno odahnete od svih obaveza ili počnete sa pripremama za izlazak.
  description: Savršeno veče počinje kada konačno odahnete od svih obaveza ili počnete sa pripremama za izlazak. Uživanje ćemo začiniti muzikom i osmehom, preporučiti novi singl, spot i album, novi film ili seriju. Najbolje znamo kad je pravo vreme za pauzu od učenja, kada da vas odvedemo na žurku, a kada da je napravimo u vašoj sobi. Radio je najbolje društvo na kraju napornog radnog dana.
