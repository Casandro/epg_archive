  title: Fasády
  description: Dá se stěhovat každý rok, a přitom si byt zařídit hezky? A co když seženu bydlení v centru za přijatelnou cenu, ale je tam záchodový prkýnko se zalitou škeblí? V novém dílu Fasád architektka Adéla Křížková radí, do čeho se v pronajatém bytě vyplatí investovat a co tzv. "udělá největší parádu". Moderuje Alena Harciníková. (repríza)
