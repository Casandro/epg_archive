- eventId: 1259540
  start: 2026-09-28T18:00:00Z
  stop: 2026-09-28T19:00:00Z
  title: Startér
  description: Finalisté Startéru 2023/2024 a vítězové letošního ročníku exportní soutěže Radia Wave Czeching zavítají za námi do studia, aby pohovořili o jimi vydlážděné cestě pro kohokoliv dalšího, kdo se snaží uspět s kytarovou hudbou nejen u nás, ale i za hranicemi. Plzenští Ida The Young mají venku čerstvý singl Dragon Head, chystají nové album, koncertují ostošest a hlavně se z nich stále nevytrácí hluboká láska k hudbě a společnému hraní. Jaký mají recept na pěstování společné chemie? Co se změnilo po veškerém uznání v souvislosti s předchozí deskou? A jak obrážet Evropu a nezbláznit se z toho? Laďte rozhovorový speciál Startéru. Moderují Filip Černý a Martin Šolc. (repríza)
- eventId: 1259541
  start: 2026-09-28T19:00:00Z
  stop: 2026-09-28T20:00:00Z
  title: Stage
  description: Na Stagi si dnes poslechneme koncert dua Eremen a Petijee, který odehráli v rámci koncertní série Pohoda_FM. Eremen a Petijee je slovenské rapové duo, které ve své tvorbě propojuje hip hop, soul a různé formy elektronické hudby. Jejich zvuk staví na propracované produkci, ve které se samplování potkává s živými nástroji. Společně vydali v roce 2014 album Únikový východ, na které navázali pokračováním jménem Únikový východ 2 v roce 2021. Na pódiu je doprovází bratislavské trio Space Cats, které elektronickou hudbu hraje naživo. Stage laďte v pondělí ve 21:00.
