  title: Einstand
  description: |-
    Héritage
    Elias David Moncado (Violine) und Mirabelle Kajenjeri (Klavier)

    Der deutsch-spanisch-malaysische Geiger Elias David Moncado gewann Preise bei internationalen Wettbewerben. Er ist Stipendiat der Anne-Sophie Mutter Stiftung und studiert derzeit an der Kronberg Academy. Auf dem aktuellen Album "Héritage", das im Rahmen der Förderungen junger KünstlerInnen der Fondation Gautier Capuçon entstand, präsentiert der junge Geiger mit der französischen Pianistin Mirabelle Kajenjeri poetische wie auch sehr virtuose Werke, u.a. von Lili Boulanger, Maurice Ravel, Viktor Kosenko und Manuel Ponce.
