  title: Newsroom ČT24
  subtitle: Trump omezil médiím přístup do Bílého domu. Jiné televize ho na protest odmítly natáčet, spor řeší soud. Co všechno způsobil zákaz vstupu do Bílého domu třem světovým médiím? Andrej Babiš a jeho slova o
  description: |-
