    Nachdem sich der vermeintliche Sprengkörper als harmloses Feuerwerk entpuppt hat, müssen Lana und Joel jedoch den mutmaßlichen Bombenbauer Andy von einem Sprengsatz an seinem Körper befreien. Doch auf dem Parkplatz des Viertels lauert noch eine tödliche Gefahr.
