- eventId: 1259386
  start: 2026-09-28T15:00:00Z
  stop: 2026-09-28T16:00:00Z
  title: Host pro sváteční odpoledne
  description: Biolog, popularizátor vědy a dlouholetý ředitel Botanické zahrady Přírodovědec fakulty Univerzity Karlovy v Praze, Václav Větvička, zemřel v posledních červencových dnech letošního roku. K jeho odborným aktivitám i vlídnému pohledu na přírodu kolem nás, patřila také spolupráce s Českým rozhlasem. Do studia ČRo Hradec Králové přišel Václav Větvička v říjnu roku 2006 jako host redaktorky Elišky Pilařové. Jejich rozprávění doplňují příběhy z jeho knihy Moje květinová dobrá jitra, která zazní v autorské interpretaci.
- eventId: 1259387
