- eventId: 1258815
  start: 2026-09-28T04:00:00Z
  stop: 2026-09-28T06:00:00Z
  title: Partitury
  description: Sváteční notování z Ostravy. Na vlnách Partitur Vás soubory Collegium Marianum a Ensemble FLAIR potěší folklorně laděnými skladbami Georga Philipa Telemanna a k lidovým inspiracím německého barokního mistra rádi přidají i lidové taneční motivy z Brněnska, Hané a z Valašska z takzvané Guberniální sbírky. Ve víru svátečního rána si na vltavských vlnách za doprovodu Brněnského rozhlasového orchestru lidových nástrojů a Cimbálové muziky TECHNIK můžete rovněž užít nadčasových hlasů českých, moravských i slezských legendárních zpěváků, ohlédneme se také za jedním významných folklorním výročím a kouzelným proutkem rozhlasového času otevřeme historické edice hudebního cyklu Zpěvem k srdci. Závěrem pořadu si připomeneme magický zvuk jednoho z nejstarších hudebních nástrojů světa - Panovy flétny. To vše v zářijovém Svátečním notování z Ostravy s Janem Rokytou.
- eventId: 1259018
  start: 2026-09-28T06:00:00Z
  stop: 2026-09-28T07:05:00Z
  title: 'Jaroslav Vrchlický: Bratři'
  description: Tragédie. Rozhlasová úprava a režie Josef Melč. Hudba Jiří Smutný. Dramaturg Ivan Škapa. Účinkují Jana Hlaváčová, Pavel Soukup, Petr Štěpánek, Jiří Klem, Petr Haničinec, Petr Kostka, Milena Steinmasslová, Soběslav Sejk a další. Natočeno v roce 1983.
- eventId: 1259019
  start: 2026-09-28T07:05:00Z
  stop: 2026-09-28T08:00:00Z
  title: Neumí spojit pátej a šestej!!!
  description: Poprask na kompoziční hodině u profesora Křičky, způsobený chybným harmonizačním krokem, je jen jednou z mnoha vzpomínek dirigenta Václava Smetáčka na jeho hudební kořeny. Václav Smetáček, kterého poznal celý svět od Japonska až po Island, se narodil před 120 lety. Na vzácných záznamech povykládá nejen o svých studiích, ale i o zázemí v rodině, o práci v Československém rozhlase a České filharmonii, o svých uměleckých cestách a o šéfdirigentské taktovce u Pražských symfoniků. Hostem ve studiu bude Smetáčkova vnučka, muzikoložka a terapeutka Petra Součková, z archivu promluví i dirigentova choť Míla Smetáčková. Připravil a uvádí Vojtěch Babka.
- eventId: 1259020
  start: 2026-09-28T08:00:00Z
  stop: 2026-09-28T09:30:00Z
  title: Bohoslužba
  description: Přímý přenos z Národní svatováclavské pouti ve Staré Boleslavi. Bohoslužbě sloužené pod širým nebem na Mariánském náměstí předsedá Stanislav Příbyl, arcibiskup pražský. Slovem provází Eva Hazdrová-Kopecká.
