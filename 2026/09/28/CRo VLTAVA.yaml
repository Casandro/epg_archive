  description: 'Bohuslav Reynek: Vlaštovek modř teď bolí. Literárně-hudební pásmo z básní a dopisů básníka, grafika a překladatele doplněné textem Jiřího Reynka. Připravila Jana Doležalová. Účinkují Jana Franková, Ivan Martin Jirous a Ladislav Mrkvička. Klavírní skladby Henriho Dutilleuxe hraje Robert Levin. Hudbu vybrala Wanda Dobrovská. Režie Markéta Jahodová (56 min). Natočeno v roce 2011.'
