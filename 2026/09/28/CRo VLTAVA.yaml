  title: Hra
  description: 'Jaromír Ptáček: Tmavomodrý svět. Dramatická koláž o životě a díle Jaroslava Ježka. Stereoscénář Jiří Fuhrman a Ivan Holeček. Scénická hudba Jaroslav Ježek. Dramaturgie Marie Říhová. Režie Ivan Holeček. Osoby a obsazení: Jaroslav Účinkují: Viktor Preiss, Alois Švehlík, Martin Stropnický, Marta Vančurová, Pavel Rímský, František Husák, František Fröhlich a další. Natočeno v roce 1989.'
