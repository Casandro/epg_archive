  title: Rapa Nui - Geheimnisse der Osterinsel
  description: |-
    Wie und warum wurden die monumentalen Steinstatuen von Rapa Nui, auch Osterinsel genannt, gemeißelt und aufgestellt? Die Europäer kamen vor mehr als 300 Jahren auf der abgelegenen Pazifikinsel an. Seither gibt es Kontroversen um die riesigen Figuren aus Stein, die Moai, und um die Geschichte der Menschen, die sie erschaffen haben. Eine neue Generation von Forschern stellt alte Theorien in Frage, enthüllt die reiche Geschichte, die Innovationskraft und die Widerstandsfähigkeit des Volkes der Rapa Nui. Faszinierende neue Erkenntnisse über den Ursprung dieser Kolossalfiguren!
