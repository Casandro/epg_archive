  title: TM Wissen
  subtitle: Des Wolfs kleiner Bruder - Die Rückkehr des Schakals ins Alpenland
  description: Die Rückkehr des Goldschakals nach Österreich sorgt für Aufmerksamkeit. Seit 2007 wird die ursprünglich in Afrika und Asien beheimatete Art vermehrt in heimischen Wäldern gesichtet. Biologin Dr. Jennifer Hatlauf erforscht mithilfe von akustischem Monitoring und einer Spürhündin sein Verhalten. Der Goldschakal gilt dabei nicht als invasive Art, sondern als natürlicher Rückkehrer - doch birgt seine Ausbreitung Gefahren für Mensch und Tier? // Ein Blick in die Welt der Parapsychologie führt zu Séancen, Gedankenübertragung und CIA-Experimenten. Historiker Prof. Rudolf Simek beleuchtet historische Fälle und erklärt, warum Phänomene wie Telepathie bis heute wissenschaftlich umstritten bleiben - etwa am Beispiel des Österreichers Rudi Schneider, der einst mit angeblichen Fähigkeiten Schlagzeilen machte. // In Wien stellt sich Reporterin Iris Pohl der Frage, ob eine künstliche Intelligenz Parfum kreieren kann. Mit Hilfe eines Parfümeurs und einem KI-System entsteht ein persönlicher Duft auf Basis eines Fragebogens - doch wie "menschlich" kann ein Algorithmus wirklich riechen? // Ökoakustik macht hörbar, was unser Blick nicht erfassen kann. Mit Hilfe von künstlicher Intelligenz horcht sie tief ins Dickicht und entdeckt Tiere, die wir sonst nie zu Gesicht bekommen. Was die leisen Stimmen der Natur über das Leben um uns herum verraten //  Die überraschende Geschichte der Stadttaube und die Physik des GuglhupfsÖsterreich 2025
