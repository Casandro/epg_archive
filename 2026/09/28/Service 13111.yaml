  title: Paula kocht
  subtitle: Wiener Küche reloaded
  description: "Robert Brodnjak, der Pionier der Marktgärtnerei, ist mit seinem Gemüsestand \"Krautwerk\" jeden Samstag am Karmelitermarkt. Dass seine Hände nicht nur Gemüse ziehen können, stellt er unter Beweis: beim Strudelteig ausziehen.Die Liebe zum Gemüse hat er seiner Tochter Saskia Detz vererbt. Im Feierabendgarten ist Saskia Chefgärtnerin, mit Fokus auf seltene Sorten, wie 20 verschiedene Paradeiser.\nEin Keller im zweiten Wiener Gemeindebezirk als Landwirtschaft. Die beiden Nebenerwerbslandwirte Otto und Martin Kammerlander, auch bekannt als \"Pilzbrüder\", züchten im 200 Jahre alten Gemäuer Bio-Pilze.\nVon der Oma in Schwaben hat Till Wörner zwei Dinge mit nach Wien genommen: den Namen für sein Lokal - \"Rosi\" - und die Maultaschen. Das ist das einzige Gericht mit Fleisch im \"Rosi\". Till Wörner denkt das klassische Wiener Eckbeisl radikal neu und kocht vorrangig vegetarisch. \nClara Aue, eine der besten Köchinnen Österreichs, kocht ohne Schnörkel, aber mit Leidenschaft im Bistro \"Heu und Gabel\" am Meidlinger Markt. Ihr Fokus liegt klar auf traditionellen Gerichten der ehemaligen Kronländer.\nWas wäre die Wiener Küche ohne ihre Mehlspeisen? An keinem geringeren Ort als der ehrwürdigen K. und K. Hofzuckerbäckerei Demel wird Paula Bründl Konditormeisterin Paula Hartung in die Geheimnisse des angeblich besten Kaiserschmarrens von Wien eingeweiht.\nDer Wiener Würstelstand von Mike Lanner gilt als erster bio-zertifizierter Würstelstand weltweit. Die Würste kommen vom Biobauer Andreas Seiser und auch das vegane Angebot kann sich sehen lassen. \n\nÖsterreich 2026, R: Brigitte Erhart M: Paula Bründl"
