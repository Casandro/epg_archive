  title: Hubert und Staller
  subtitle: Der Winter kommt
  description: |-
    Polizeirat Girwidz ordnet eine akribische Rundumüberwachung an. Das Objekt der Observierung: Der nach langjähriger Haftstrafe nach Wolfratshausen zurückgekehrte Bernd Winter. Auf das Konto des Sträflings geht ein Bankraub mit Geiselnahme, bei der eine Kassiererin zu Tode kam. Girwidz vermutet, dass der Zuchthäusler zurück an den Tatort kommt, um seine Beute zu holen. Denn von dieser fehlt auch heute noch jede Spur. Doch Winter ist kein leichter Gegner. Er enttarnt nicht nur die Beschattungsversuche der Wolfratshauser, sondern scheint auch ein undurchsichtiges Spiel mit der Polizei zu spielen. Girwidz muss seine Strategie ändern: Von verdeckter Überwachung zur Zermürbungstaktik. Er hofft, wenn Winter permanent die Polizei vor Augen hat, wird er irgendwann aufgeben und freiwillig die Beute verraten. Doch Winter hat ganz andere Pläne.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.
    Krimi, Deutschland 2016, R: Philipp Osthus
