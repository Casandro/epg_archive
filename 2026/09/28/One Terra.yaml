  title: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  subtitle: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  description: 'Am Tag arbeiten sie hart wie Männer. Am Abend verwandeln sie sich in das, als was sie sich fühlen: in Frauen. In ihren Gemeinden wurden sie verachtet und verstoßen. Erst in 1.600 Metern Höhe, auf den Kaffeeplantagen der kolumbianischen Anden, haben sie ein Refugium gefunden, in dem sie frei und sie selbst sein können. Dennoch muss die Gemeinschaft von Transfrauen bis heute um ihre Anerkennung sowohl vor dem Gesetz als auch in der noch stark traditionell geprägten Bevölkerung kämpfen. Das Land der "Embera Chami", der Kordilleren-Bewohner, erstreckt sich in den kolumbianischen Anden, wo edler Kaffee wächst. Das Geschäft mit der Hochlandbohne ist noch fest in der Hand von Weißen und den Nachfahren von Europäern und Ureinwohnern. Seitdem es nicht mehr so rentabel ist, ziehen immer mehr Indigene als billige Arbeitskräfte auf die Plantagen. Die Kaffee-Felder stellen auch für Embera-Transfrauen eine Nische dar. Hier finden sie nicht nur einen Lebensunterhalt, sondern auch Schutz. Denn bis heute sind sie Repressalien und Unterdrückung ausgesetzt - nicht nur innerhalb der breiten Bevölkerung, sondern auch in ihren indigenen Gemeinden: In der Vorstellung vieler Embera gilt Transsexualität als ein von Weißen eingeschlepptes Übel, das hart bekämpft werden muss. Auch Bella Wasorna hat in dieser Enklave ein neues Leben begonnen. Auf den Namen Jesus Stiven wurde sie vor 19 Jahren getauft, einen Namen, gegen den sie unermüdlich kämpft, da er für sie das sichtbarste Zeichen ihrer gesetzlichen - für sie falschen - Identität ist. Nun ist ihr Ziel, eine gesetzliche Änderung ihres Namens zu erreichen, in greifbare Nähe gerückt. Doch die angestrebte Namensänderung wird teuer, Bella wird umso härter auf der Plantage schuften müssen. Zeitgleich wird dort ein großer Auftritt vorbereitet, bei dem die Transfrauen im Zentrum der Provinzhauptstadt tanzen wollen. Um auf sich und ihr Schicksal aufmerksam zu machen. DE 2022'
- eventId: 1234937
  start: 2026-09-28T07:10:00Z
  stop: 2026-09-28T08:02:00Z
  title: Planet Weltweit - Indien - Das Geschäft mit dem Tempelhaar
  subtitle: Planet Weltweit - Indien - Das Geschäft mit dem Tempelhaar
  description: 'Unser Haar -Spiegel und Aushängeschild der Persönlichkeit. Kräftig, voll und glänzend soll es sein. Oft fehlt es jedoch an der Menge oder der Länge. Deshalb helfen immer mehr Menschen nach - mit fremdem Haar. Die künstliche Haarpracht stammt größtenteils aus Indien, gefertigt aus Haaren, die in den Tempeln von Gläubigen geopfert werden. Wir haben eine Inderin und ihren Sohn begleitet, die ihr Haar in einem Tempel opfern. Sie verfolgte, was weiter mit diesem Haar passiert - und hat so erfahren, wie es wirklich funktioniert: Das Geschäft mit dem Tempelhaar.  Die Rasiermesser schaben ununterbrochen, legen Stück für Stück die darunter liegende Kopfhaut frei. Die Friseure arbeiten im Akkord, die Wartenden werden im Minutentakt auf die flachen Bretter bugsiert, die als provisorische Schemel dienen. Unter ihnen sind heute Sumati Jayapathi und ihr zehnjähriger Sohn Balaji. Sie sind den weiten Weg in die Tempelanlage von Palani gegangen, um ihr Haar zu opfern. Im Gegenzug dafür erhoffen sie sich von ihrem Gott die Zustimmung zum Bau eines eigenen kleinen Häuschens. Vor zehn Jahren war Sumati zum letzten Mal in Palani. Seitdem hat sich vieles verändert, das Geschäft mit dem Haar hat den Ort wachsen und gedeihen lassen. Mehrere Millionen Pilger kommen inzwischen jedes Jahr nach Palani. Zurück lassen sie Tonnen von geopfertem Haar. Es ist ein einvernehmliches Geben und Nehmen - und ein offenes Geheimnis, dass der Tempel die Haare weiter verkauft. Schließlich muss er sich finanzieren. Seit sich Haarverlängerungen und Echthaarperücken weltweit zunehmender Beliebtheit erfreuen, boomt das Geschäft. Weit über 50 indische Firmen konkurrieren um das Haar, welches als das weltweit schönste und strapazierfähigste gilt. Abnehmer gibt es in der ganzen Welt, und es ist durchaus möglich, dass das Haar welches Sumati Jayapathi heute opfert, demnächst auf dem Kopf einer europäischen Kundin landet, in Form von Verlängerungen oder als Perücke. DE 2008'
  ageRating: 6
- eventId: 1234938
