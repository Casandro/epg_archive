  title: Planet Weltweit - Die scharfen Klingen der Auvergne
  subtitle: Planet Weltweit - Die scharfen Klingen der Auvergne
  description: 'Einst gehörte es in die Hosentasche jedes Mannes, in Frankreich wie anderswo, handgefertigt und unverwüstlich, ein markanter und eigenwilliger Alltagsgegenstand: Das Taschenmesser. Das legendäre und unverkennbare Laguiole-Messer hat hier in Zentralfrankreich seine Wurzeln - und seine Meister.  "Die Jungen im Alter meiner Kinder, die pfeifen auf Messer und Messermacher, die haben kein Messer in ihrer Tasche, die haben ihre I-phones, und solche Dinge - das ist ein anderes Leben. Ich erinnere mich noch: als wir früher im Stadion waren, um ein Spiel zu sehen, da hatten wir unser Laguiole und Proviant dabei und haben in der Halbzeit unsere Wurst gegessen. Das kann man heute nicht mehr machen" sagt Charles Couttier, eine Berühmtheit unter den Messermachern der Auvergne. Das Traditionshandwerk von Thiers bewegt sich ,auf Messers Schneide'' - verlassen sind die schiefen Gassen mit ihren einst üppigen Schaufensterauslagen, viele ehemals florierende Traditionsbetriebe stehen still. Und doch kämpft eine Handvoll großer Meister um die Zukunft des Taschenmessers - in der Stadt Thiers und auch in Laguiole. Der 43-jährige Cyrill Ganivet ist ein Quereinsteiger in der Branche - noch vor Jahren war er ein hochbezahlter Manager, bis er seinen Job an den Nagel hängte, einen maroden Messerbetrieb übernahm und zu neuer Blüte führte. Längst sind die hochwertigen Messer nicht nur als Alltagsgegenstand sondern auch unter extravaganten Sammlern und Fans wieder in Mode gekommen. Messer, die manchmal in wochenlanger Arbeit handgefertigt werden, mit Klingen aus Damaszenerstahl, kunstvollen Griffen und Gravuren. Jahrelang tobte schwelte ein heimlicher Konflikt zwischen den Messermachern in Laguiole und Thiers um den Ursprung des berühmten Messers - doch inzwischen eint beide Städte ein neuer Feind: das Billigimitat aus Asien. DE 2012'
