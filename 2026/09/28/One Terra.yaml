  title: Planet Weltweit - Die Herren des Lavendels
  subtitle: Planet Weltweit - Die Herren des Lavendels
  description: 'Es sind diese Landschaften, die Besucher seit jeher in ihren Bann ziehen. Postkarten-Motive, fast zu schön um wahr zu sein. Frankreichs berühmte Lavendel-Felder. Jahr für Jahr strömen Besucher hierher, angezogen von diesem besonderen Licht, diesem Blau und Lila. Eine Szenerie wie im Traum. Doch hinter der faszinierenden Kulisse ist längst nicht alles perfekt. Wie steht es in Wahrheit um den französischen Lavendel-Anbau? GEO Reportage war vor Ort. Michel Blanc ist einer der französischen Lavendel-Bauern. Mit seiner Familie bewirtschaftet er eine Fläche von rund 200 Hektar. Vor allem das Herrenhaus ihres Gutes atmet Geschichte. Es ist ursprünglich eine alte militärische Festung aus dem 13. Jahrhundert, eine Bastide, von der Familie 1838 erworben und in den 1960er Jahren renoviert. Danach schufen sie hier einen großen landwirtschaftlichen Betrieb; vor allem der Lavendel hat es den Blancs angetan. Immer wieder jedoch müssen sie sich auf neue Herausforderungen einstellen. Nachdem die traditionelle Schafzucht vor einigen Jahren aufgegeben wurde musste, weil Wölfe die Gegend als ihren Lebensraum zurück eroberten, richtet nun ein anderes, viel kleineres Tier immensen Schäden an. Klitzekleine Insektenschädlinge, so genannte Zikaden, übertragen Bakterien, die viele Lavendelpflanzen vernichten. Die Zikaden sind nur zwei Millimeter groß, mit dem bloßen Auge kaum zu erkennen, und doch so verheerend. Während die Bauern in Frankreich mit diesem kleinen Feind kämpfen, geht es mit dem Lavendelanbau in einem anderen Land steil bergauf: in Bulgarien. Hier werden inzwischen riesige Lavendelmengen angebaut, verarbeitet und vor allem in der Hauptstadt Sofia gehandelt. Droht dem französischen Lavendel etwa nun das Aus? DE 2019'
