  title: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  subtitle: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  description: 'In Costa Rica, in den Bergen der Provinz Heredia liegt ein einzigartiges Tierheim, das Territorio de Zaguates, "das Land der Streuner". Über tausend Hunde leben zeitweilig auf dem 150 Hektar großen Gelände unter freiem Himmel und ohne Zwingerhaltung. Bei Lya Ballte und ihrem Mann Alvaro Saumet haben schon zigtausende Hunde Zuflucht gefunden, die Verstoßenen, Kranken und Alten, aber auch viele gesunde und junge Hunde, die ihr Leben auf der Straße fristen. Mit einer ausgeklügelten Idee versucht das Team die Tiere zu vermitteln. Im Fokus steht dabei die Einzigartigkeit der Mischlinge, denn kein Hund gleicht dem anderen. GEO Reportage hat das "Paradies der Streuner" besucht. Umgegeben von Farmland liegt das Territorio de Zaguates. 600 Kilogramm Futter fressen die über tausend Hunde jeden Tag, dazu kommen Tierarztkosten und unvorhersehbare Ausgaben für immer neue Baumaßnahmen, die staatlichen Behörden ihnen auferlegen. Bis zu 45.000 Dollar braucht das Tierheim pro Monat. Kein Tier wird abgewiesen oder eingeschläfert, Weitervermittlung in ein liebevolles Zuhause steht im Vordergrund der Bemühungen. Wer nicht vermittelt wird, bleibt. In Costa Rica gilt ein Hund nicht viel: Viele leben von Geburt an auf der Straße, ebenso viele werden ausgesetzt oder zurückgelassen. Weil der Staat nichts unternimmt, gibt es viele private Initiativen, vor allem wenn es um Kastrationsprojekte geht, um die Population der Straßenhunde einzudämmen. Auch den Initiatoren des Territorio de Zaguates geht es in erster Linie um Hilfe für die Tiere, aber auch um ein Umdenken in der Bevölkerung. Und darum, ein Bewusstsein für das Leid der Straßenhunde zu schaffen. So entstand die Idee einer einzigartigen Imagekampagne: "Razas Unikas". Die Kampagne erfindet neue Hunderassen: Aus den besonderen und oft einzigartigen Merkmalen der Mischlinge entstehen die lustigsten Namen, und viele traurige Hundegeschichten fanden so ein Happy End. DE 2019'
- eventId: 1234991
  start: 2026-09-28T19:15:00Z
  stop: 2026-09-28T20:07:00Z
  title: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  subtitle: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  description: 'Ein Vogel, der so viel kostet wie ein Auto, ja sogar ein Haus. In Singapur ist das keine Seltenheit. Singvogel-Liebhaber scheuen dort weder Kosten noch Mühen für die Stars der Szene: Sperbertauben, Schama- und Dajaldrosseln, Bülbüls und Brillenvögel. Je schöner ein Vogel singt, desto teurer ist er. Singvogel-Wettbewerbe demonstrieren diesen Status. Doch die Liebe zu den gefiederten Stimmathleten hat auch Schattenseiten, denn sie befeuert den illegalen Vogelhandel. Die GEO Reportage taucht mit Vogelzüchtern und Umweltaktivisten in den Kosmos von Singapurs Singvögeln. Seine Schamadrosseln, Bülbüls und Finken sind Amirs ganzer Stolz. Am Wochenende trifft er sich mit Gleichgesinnten im Kebun Baru Singing Bird Club in Singapur. Dort steht bald der nächste Wettkampf an. Amir und sein Bülbül Ramdan müssen trainieren. Außer Prestige gibt es dabei nicht viel für Amir zu gewinnen. Denn Wetten und Glücksspiel sind in Singapur verboten. Doch als Züchter will sich Amir einen Namen machen. Das hat in Singapur allerdings seine Tücken: Nur Zoohandlungen dürfen gezüchtete Jungtiere verkaufen. Aber kaum jemand kann nachverfolgen, ob die dort angebotenen Vögel wirklich aus Zuchten stammen. Wildfänge findet man dort ebenso wie in privaten Sammlungen häufig. Ein großes Problem im Stadtstaat, das sowohl Behörden als auch private Umweltverbände herausfordert. Amir ist davon überzeugt: private Züchter können dazu beitragen, der Wilderei den Nährboden zu entziehen, wenn der Handel unter den Vogelzüchtern legalisiert würde. Auch er selber könnte davon profitieren, denn seine Tiere brüten seit Jahren erfolgreich. Deshalb überlegt er, Singapur in Richtung Indonesien zu verlassen. Dort ist der Handel mit den Zuchtvögeln legal. Zuvor müssen er und sein Champion Ramdan jedoch im nächsten Wettbewerb bestehen. DE 2020'
- eventId: 1234994
  start: 2026-09-28T20:15:00Z
