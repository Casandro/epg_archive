  title: Planet Weltweit - Mechaniqueros - Nichts ist unmöglich in Havanna
  subtitle: Planet Weltweit - Mechaniqueros - Nichts ist unmöglich in Havanna
  description: 'Havannas Mecaniqueros sind private Jungunternehmer im Land des real existierenden Sozialismus. Sie entwickeln skurrile, aber erfolgreiche Geschäftsideen wie etwa ein Restaurant im heimischen Wohnzimmer oder Lichtschalter aus Deo-Dosen. Dabei agieren sie sehr geschickt im Verborgenen, wandeln immer noch gerade an der Grenze der Legalität. Planet Weltweit zeigt Ariél und seine Freunde, die dem strengen Castro-Regime auf Kuba mit viel Witz und Organisationstalent immer wieder ein Schnippchen schlagen. Kuba: Bröckelnde Kolonialfassaden, amerikanische Oldtimer, rauchende Dandys - eine Kulisse zwischen tropischen Palmen, Sonnenuntergängen und Massenaufmärschen. Doch der Alltag der Menschen wird von dem Wirtschaftsembargo der USA und der Misswirtschaft der Castro-Regierung erschwert. Arbeit für den Staat ist Pflicht. Ariél etwa prüft offiziell als Kontrolleur der Gesundheitsbehörde private Wasserbehälter auf Larven der Dengue-Mücken. Weil er, wie viele, von sozialistischer Arbeit allein nicht leben kann, arbeitet er mit seinen Freunden César und Tommy nebenbei als "Mecaniquero": Mit Hilfe aller möglichen "Mecánicas" - Techniken, Tricks, Tauschgeschäften und Kontakten - treiben sie Dinge auf, die in den staatlichen Geschäften nicht zu bekommen sind. Dabei müssen sie flexibel sein. Was heute noch erlaubt ist, kann schon morgen bei Strafe verboten sein. An Nachfrage mangelt es ihnen nicht. Jeder aus der Gegend, der etwas dringend braucht und nicht finden kann, wendet sich an die Mecaniqueros: Gold für Zahnverblendungen, ein Kleid für eine Party, Ersatzteile für einen Fernseher - die drei charmanten Kubaner beschaffen alles. Einige ihrer privaten Nebenbeschäftigungen finden auch als Familienunternehmen statt. Je nach Bedarf wird so etwa das Wohnzimmer in einen Beautysalon oder ein Restaurant umgewandelt. DE 2005'
  ageRating: 6
