  title: Planet Weltweit - In den Smaragdbergen von Bahia
  subtitle: Planet Weltweit - In den Smaragdbergen von Bahia
  description: "Acht Uhr morgens, es ist schon heiß in Salvador da Bahia, doch in die vornehme Altstadtvilla weht ein frischer Wind vom Meer. Hier residiert der gebürtige Schweizer Daniel Kläy. Er kam vor 20 Jahren nur mit einer Gitarre nach Brasilien. Heute ist er einer der angesehensten Juwelenhändler. Seine Liebe gilt vor allem den Smaragden, doch die Jagd nach dem unergründlich moosgrünen Juwel  wird immer schwieriger. Vor kurzem wurde eine von Daniel Kläys Minen überraschend von der  Regierung geschlossen. \n\nDer Karneval steht vor der Tür, aber so richtig nach Feiern ist Daniel Kläy nicht zumute. Seine  Mine ist von der Regierung geschlossen worden. Jahrzehntelang konnte man ohne besondere  Genehmigungen Smaragde schürfen. Im Zuge der Globalisierung will sich Brasilien internationalen Standards anpassen und die Wildwestmethoden im Hinterland nicht länger tolerieren. Daniel Kläy wurde überrascht von der Entschlossenheit der Behörden und fährt ins 400 Kilometer entfernte Socotó. Socotó ist nur in der Welt der Smaragdexperten ein Begriff. In dem verschlafenen 400- Seelen-Nest, fernab jeder Stadt und nur über Schotterpisten zu erreichen, dreht sich alles um  Edelsteine. Seit dem Förderverbot herrscht Arbeitslosigkeit. Kläy sind die Hände gebunden - eine behördliche Genehmigung könnte Jahre dauern. Also muss er sich auf die anderen Minen konzentrieren, an denen er sich beteiligt hat - etwa in der Bergarbeiterstadt Carnaiba, zwei  Autostunden von Sokotá entfernt. Vielversprechend sind die grünen Färbungen in der Wand des  Stollens. Ob sich jedoch tatsächlich hochwertige Steine aus dem Gestein gewinnen lassen entscheidet sich erst nach einer riskanten Sprengung. Die Arbeitsbedingungen der Smaragdschürfer sind heikel. Gefährlich ist die Methode der Sprengung durch einen Stromstoß und Grundwasser kann  den Stollen jederzeit einstürzen lassen. Doch die Männer hier mögen ihren Job, die Besitzer tolerieren eine gewisse \"Selbstbeteiligung\" der Männer, was den Job lukrativ macht. DE 2011"
