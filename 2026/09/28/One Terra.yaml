  stop: 2026-09-28T09:02:00Z
  title: Planet Weltweit - Die blinde Primaballerina von Sao Paulo
  subtitle: Planet Weltweit - Die blinde Primaballerina von Sao Paulo
  description: 'Sao Paulo. Die größte Stadt der Südhalbkugel. Hier lebt die einzige blinde Primaballerina der Welt: Geyza Pereira. Ihr Leben als Tänzerin fand vor einem Jahr durch eine schwere Krankheit ein jähes Ende: sie fiel ins Koma und erlitt mehrere Hirnschläge. Jetzt kämpft Geyza für ihre alte Perfektion und die Rückkehr auf die Bretter, die für sie die Welt bedeuten. GEO Reportage hat Geyza und das Blindenballett von Sao Paulo mehrere Wochen lange begleitet. Im Stadtteil Vila Madalena im Norden von Sao Paulo befinden sich die Trainingsräume des "Ballet de Cegos", des Blindenballetts. Fernanda Bianchini hat diese Ballettschule vor 25 Jahren gegründet. Verschiedene Altersgruppen von Ballerinen trainieren hier, sie sind entweder von Geburt an oder durch Krankheit erblindet bzw. sehbehindert. Das Ballett gibt ihnen Selbstbewusstsein und eine ganz neue Körperhaltung, doch das Training dafür ist hart: Wie erfasst man die Schritte und Bewegungen, wenn man sich nicht im Spiegel sehen und korrigieren kann? Wie lernt man neue Choreografien, ohne den Ballettlehrer zu sehen? Wie studiert man Pirouetten ein, ohne einen Fixpunkt zu haben? Geyza Pereira war der gefeierte Star des Blindenballetts. Im Alter von neun Jahren erblindete sie in Folge einer Meningitis. Doch mit eisernem Willen ging sie unbeirrt ihren Weg und schaffte es, die erste blinde Primaballerina der Welt zu werden. Dann vor einem Jahr ein herber Rückschlag: Geyza fällt ins Koma, ausgelöst durch eine erneute Infektion. Wie durch ein Wunder kämpft sie sich mit Hilfe ihrer Lehrerin und Freundin Fernanda Bianchini zurück in den Tanzsaal. Ihr Wunsch: im Ballettklassiker "La Esmeralda" in vier Wochen wieder in der alten Form auf der Bühne zu stehen. Doch noch ist der Stand bei Pirouetten und Sprünge wackelig. Auch die Frage nach ihrer weiteren Karriere und beruflichen Zukunft steht damit im Raum. DE 2019'
- eventId: 1234944
  start: 2026-09-28T09:15:00Z
  stop: 2026-09-28T10:07:00Z
  title: Planet Weltweit - Indien - Kampf den Scharlatanen
  subtitle: Planet Weltweit - Indien - Kampf den Scharlatanen
  description: 'Planet Weltweit: Indien, das Land der Spiritualität. Heiler und Gurus, sogenannte Babas, tausende im ganzen Land und einige berühmt und reich, berufen sich auf höhere Mächte. Doch es gibt Widerstand gegen den gefährlichen Aberglauben und die Geschäftemacherei mit der oft verzweifelten Hoffnung auf Gesundheit. Die Rationalisten haben sich zusammengeschlossen, mit ihrem Science-Van touren sie durch das Land und klären auf. Rationalisten glauben nicht an Götter und Geister, sondern an Vernunft und Wissenschaft. Die Organisation hat fast zehntausend Mitglieder, sie machen ehrenamtlich mit, sind aufgeklärt und arbeiten als Anwälte, Lehrer, Handwerker oder Hochschulprofessoren. Von harmlosen Trickbetrügereien bis zu schweren seelischen Misshandlungen und ruinöser Abhängigkeit reicht das Spektrum der Opfer. Frauen sind durch ihre untergeordnete Position in der Familie und im gesellschaftlichen Leben oft willfährige Opfer, mangelnde Bildung ist fast immer der Grund dafür, dass die Menschen den Gurus blind vertrauen. Parvin Sherka ist eines der Baba-Opfer. Der Ingenieur litt unter schwerem Rheuma. Mit Hilfe von Ärzten wurde er zwar gesund, hatte aber große Angst, dass das Rheuma zurückkehren würde. Hilfesuchend wandte er sich an einen Wunderheiler und blieb sechs Jahre lang in seinen Fängen. Die Anhänger des Babas "opferten" Autos, Smartphones, Bargeld.. Parvin Sherka vermachte dem Baba seine gesamten Ersparnisse. Hilfe fand er bei der Anwältin Tubki Patil und einer Psychologin. Die Organisation der Rationalisten hatte es in jahrelanger Lobbyarbeit geschafft, dass in Indien ein einzigartiges Gesetz erlassen wurde, das "Schwarze-Magie-Gesetz". Demzufolge können Heilsversprechen mit Verweis auf höhere Mächte strafrechtlich von der Justiz als Betrug geahndet werden. Die Rationalistin und Anwältin kämpft, zusammen mit vielen tausend anderen Rationalisten in Indien, gegen den Missbrauch von Hilfesuchenden durch Aberglauben und überkommene Traditionen. DE 2022'
