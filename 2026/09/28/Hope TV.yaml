  title: 3 Minuten Andacht
  subtitle: Einsamkeit, was hilft?
  description: 'Alleine sein ist schön, solange man sich für das "ALLEIN SEIN" entscheiden kann. Aber was ist wenn ich plötzlich realisiere das ich wirklich alleine bin. Die schlimmste Form der Einsamkeit für mich persönlich, drücke ich unter dem Sprichwort "Gemeinsam einsam" aus. Obwohl ich viele Menschen und in Gesellschaft bin, fühle ich mich einsam. Niemand ist da der einen versteht, niemand der wirklich Interesse an mir zeigt, niemand der mich ernst nimmt. Dann wird von dem "ALLEIN SEIN" auf einmal EINSAM. Und oft ist es so, dass wir keine Auswege aus dieser Einsamkeit finden. Durch das Video mache ich dir Mut, deiner Einsamkeit ins Gesicht zu schauen, weil du mit Jesus nie wirklich einsam bist. Auch wenn wir Ihn nicht sehen oder spüren, wissen wir durch den Glauben, dass er bei uns ist. Jesus sagt: "Und siehe, ich bin bei euch alle Tage bis an der Welt Ende." (Matthäus 28,20) Das ist kein billiger Trost sondern erfahrbare Wirklichkeit. Aber natürlich können und sollen wir auch ganz Praktisch etwas gegen unsere Einsamkeit unternehmen. Es mag dich Überwindung kosten den ersten Schritt zu gehen, aber mit Gottes Hilfe ist es möglich die Einsamkeit zu überwinden.'
  widescreen: true
  hd: true
