- eventId: 1077046
  start: 2026-09-28T00:45:00Z
  stop: 2026-09-28T01:15:00Z
  title: Bibelkompass
  subtitle: Gute Nachricht für dich
  description: |-
    Die Bibel erzählt die Geschichte einer guten Nachricht, die jeden Menschen persönlich betrifft. Anhand eines einfachen Bildes wird nachvollziehbar, warum die Welt zerbrochen ist, wie die Sünde ihren Anfang nahm und weshalb Menschen aus eigener Kraft keinen Ausweg finden. Gleichzeitig zeigt sich Gottes Antwort auf dieses Problem: Jesus Christus. Durch seinen Tod und seine Auferstehung eröffnet er den Weg zu Vergebung, Frieden und ewigem Leben. Wer dieses Geschenk annimmt, darf mit neuer Hoffnung und einer neuen Perspektive leben. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Mediathek. Um 20:15 Uhr auf Hope TV. Moderation: Pastor Michael Dörnbrack.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1078530
  start: 2026-09-28T01:15:00Z
  stop: 2026-09-28T01:45:00Z
  title: Songs of Hope
  subtitle: Wenn sich alles verändert
  description: |-
    Der Herbst macht sichtbar, was unser ganzes Leben prägt: Veränderung. Blätter fallen, Farben wandeln sich und eine neue Jahreszeit beginnt. Auch in unserem Leben bleibt vieles nicht, wie es ist. Doch während sich um uns herum ständig etwas verändert, bleibt einer derselbe: Gott. In dieser Songs of Hope-Sendung geht es um Abschied und Neubeginn, um Veränderung und die Gewissheit, dass Gottes Liebe und Treue bleiben - gestern, heute und für immer.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
