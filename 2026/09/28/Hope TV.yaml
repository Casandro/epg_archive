- eventId: 1085453
  start: 2026-09-28T06:45:00Z
  stop: 2026-09-28T07:00:00Z
  title: Geschichten der Hoffnung
  subtitle: '"Wenn du mir nicht hilfst, dann..." Interview mit David Kleinbruckner'
  description: |-
    Manchmal spürt man innerlich, dass etwas nicht stimmt, lange bevor es offensichtlich wird. David Kleinbruckner beschreibt in diesem intensiven Interview genau dieses Gefühl: Den ganzen Tag hatte er ein ungutes Bauchgefühl, bis der Anruf kam, der die "vollkommene Eskalation" zu Hause bestätigte. Was passiert, wenn das Chaos im eigenen Leben ausbricht und man am Ende seiner Kräfte ist? David spricht offen darüber, wie er diesen Tiefpunkt erlebt hat und welche verzweifelten Fragen ihn zu einem Wendepunkt führten, der ihm letztlich die dringend benötigte Hilfe brachte. Ein bewegender Beitrag über innere Kämpfe, die Macht der Intuition und die Rettung in der Krise.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
