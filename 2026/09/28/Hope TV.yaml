- eventId: 1082854
  start: 2026-09-28T03:00:00Z
  stop: 2026-09-28T03:15:00Z
  title: Open Doors Magazin
  subtitle: Wenn der Glaube Leben kostet
  description: |-
    Wie leben Christen, wenn jede Nacht zur Gefahr wird? Im Norden Kameruns fliehen Familien bei Einbruch der Dunkelheit in die Berge - aus Angst vor den Angriffen von Boko Haram. Und doch gibt es Orte, an denen Hoffnung stärker ist als Hass: In Äthiopien baut Pastor Docho nach Jahren der Verfolgung eine Schule für christliche und muslimische Kinder, um Brücken des Friedens zu schlagen. Wie ist solch ein Glaube möglich? Was bewegt Menschen, trotz Bedrohung zu bleiben und zu lieben? Erleben Sie bewegende Geschichten von Mut, Versöhnung und gelebtem Glauben im Open Doors Magazin. Schauen Sie rein, teilen Sie die Sendung und setzen Sie ein Zeichen der Solidarität.

    Weitere Infos unter www.opendoors.de
  widescreen: true
  hd: true
- eventId: 1082855
  start: 2026-09-28T03:15:00Z
  stop: 2026-09-28T03:45:00Z
  title: auserlesen
  subtitle: 'Alexa Willems: Wie wir in Krisen Orientierung finden'
  description: |-
    Was trägt, wenn Sicherheiten wegbrechen und das Leben seinen Sinn zu verlieren scheint? Die Logotherapeutin und Autorin Alexa Willems begleitet seit vielen Jahren Menschen und Organisationen durch Krisen und Umbrüche. Dabei verbindet sie psychologische Ansätze mit Naturerfahrungen und der Frage, was Menschen Sinn, Orientierung und innere Stabilität gibt. Auch ihr eigener christlicher Glaube spielt dabei eine wichtige Rolle. In dieser Sendung spricht Alexa Willems darüber, wie Menschen ihre Persönlichkeit entwickeln, neue Perspektiven finden und schwierige Lebensphasen bewältigen können.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
