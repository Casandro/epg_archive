  description: |-
    Nadiya Hussain interpretiert den klassischen Sonntagsbraten neu und zeigt, dass festliche Gerichte nicht kompliziert oder fleischlastig sein müssen. Mit überraschenden Aromen aus Asien und französischen Einflüssen kreiert sie moderne Wohlfühlgerichte, die Tradition und Innovation verbinden. So wird der Sonntagsbraten zum besonderen Highlight für die ganze Familie.


