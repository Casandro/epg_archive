  title: Über den Wolken - Leben in den Bergen
  subtitle: Anden
  widescreen: true
  hd: true
  description: Die Anden durchziehen den südamerikanischen Kontinent von der Karibik bis nach Feuerland. Auf rund 7500 Kilometern finden sich windumtoste Sechstausender, brodelnde Vulkane, karge Hochebenen und menschenleere Wüsten. Und neben dem landschaftlichen Reichtum besitzt die gesamte Andenregion riesige Vorkommen an Bodenschätzen.
- eventId:
  - 575375
  - 681686
  start: 2026-09-28T01:00:00Z
  stop: 2026-09-28T01:45:00Z
  title: Das Wunder der Wiederkehr
  widescreen: true
  hd: true
  description: Was bestimmt die inneren Kräfte der Erde? Was verbindet Mensch, Tier und Natur miteinander? Wie funktionieren die natürlichen Netzwerke und Kreisläufe, die im stetigen Wandel sind? Fragen, denen der Film nachgeht. Die jährliche Reise der Buckelwale um die halbe Erde und die Wanderungen der Zebras im südlichen Afrika sind nur zwei Beispiele des stetigen Weggangs und der Wiederkehr.
- eventId:
  - 575376
  - 681687
  start: 2026-09-28T01:45:00Z
  stop: 2026-09-28T02:30:00Z
  title: Wow! Überraschende Tiergeschichten
  widescreen: true
  hd: true
  description: Die Außenseiter der Tierwelt erwecken eher Abscheu als Sympathie. Wahre Freaks der Tierwelt haben Reißzähne, Tentakel, viele Beine, struppiges Fell oder zeigen bizarres Verhalten. Der Film stellt einige dieser Gestalten vor, die es weitaus schwerer haben, Aufmerksamkeit und Wohlwollen zu erregen, als niedliche Katzenbabys oder flauschige Schlappohren.
- eventId:
  - 575377
  - 681688
  start: 2026-09-28T02:30:00Z
  stop: 2026-09-28T03:15:00Z
  title: Tierisch gute Eltern
  widescreen: true
  hd: true
  description: Wie ziehen die Eltern des Tierreichs ihren Nachwuchs groß? Da gibt es unterschiedliche Strategien. Nicht immer kümmert sich das Muttertier allein um die Kleinen, auch die Väter des Tierreichs übernehmen erzieherische Aufgaben.
