  title: Durchstarten im Alter
  widescreen: true
  hd: true
  description: "Mit 77 als Servicekraft arbeiten, mit 65 ein Lokal übernehmen - geht das? Bis 2036 werden laut Statistischem Bundesamt 13 Millionen Erwerbstätige das Renteneintrittsalter überschritten haben. \n\nSchauplatz ist ein Gasthaus im strukturschwachen Stadtteil Essen-Borbeck. Hier treffen Gunther und Jörg aufeinander. Etwas Sinnhaftes tun und noch einmal in ihrem Leben durchstarten, davon träumen die beiden und lassen sich auch nicht von Hindernissen beirren.\n\nEngagiert im Alter\n\n\"Ich kann die Hände nicht in den Schoß legen\", beteuert Gunther Linges. Der 77-Jährige ist ein waschechtes Essener Urgestein."
