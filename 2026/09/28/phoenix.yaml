  title: Besteuert uns!
  widescreen: true
  hd: true
  subtitle: Wie Millionäre gegen Armut kämpfen wollen
  description: "Während viele Briten kaum über die Runden kommen, wächst der Wohlstand der Superreichen. Eine Gruppe von Millionären will das ändern per Steuer. \n\nDas Vereinigte Königreich zählt zu den reichsten Ländern der Welt. Doch für Millionen Menschen fühlt sich das Leben immer ärmer an: Etwa jeder Fünfte lebt in Armut, die Lebenshaltungskosten steigen, viele Familien müssen bei Essen, Heizung oder Strom sparen. \n\nGleichzeitig hat der Reichtum im Land zugenommen. Die Zahl der Milliardäre ist seit Mitte der 1990er Jahre deutlich gestiegen. In London, besonders in Vierteln wie Mayfair, ist dieser Wohlstand besonders sichtbar."
