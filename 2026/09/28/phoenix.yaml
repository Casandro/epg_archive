  title: Die Haie von Hawaii
  widescreen: true
  hd: true
  description: Etwa 40 verschiedene Haiarten leben in den Gewässern vor Hawaii. Manche haben hier ein Verhalten entwickelt, wie es nirgendwo sonst zu beobachten ist. An der Küste von Big Island gibt es Höhlen unter Wasser, in denen Weißspitzen-Riffhaie zu schlafen scheinen. Doch die Hohlräume dienen eher als Versteck vor größeren Tigerhaien, die auch Riffhaie attackieren. Tigerhaie greifen normalerweise keine Tiere an, die größer sind als sie selbst doch vor Hawaii beobachten Forscher, dass Tigerhaie auch Buckelwal-Kälber anfallen.
