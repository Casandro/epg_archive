  title: 'Pêche / Pont de l''Île-d''Orléans / Saint-Laurent '
  subtitle: 'Au sommaire : Pêche en mer récréative ; pont de l''Île-d''Orléans, un chantier sous haute surveillance écologique ; le fleuve Saint- '
  description: "Au sommaire :\n\nPêche en mer récréative\nDes centaines de Québécois qui habitent au bord de l'estuaire du Saint-Laurent et de la baie des Chaleurs aimeraient pêcher des espèces comme le homard, les pétoncles et le flétan pour leur consommation personnelle. Mais des pêcheurs commerciaux et le gouvernement fédéral s'y opposent. \n\nPont de l'Île-d'Orléans : un chantier sous haute surveillance écologique\nDepuis plus d'un an, les activités entourant la construction du pont de l'Île-d'Orléans à Québec, sont sous haute surveillance écologique. Des biologistes travaillent à ce que les habitats des espèces vulnérables soient préservés des conséquences de la construction.\n\nLe fleuve Saint-Laurent et ses poissons se portent mieux\nMalgré sa mauvaise réputation, le fleuve Saint-Laurent se porte mieux qu'il y a une trentaine d'années. La qualité de l'eau s'améliore et les poissons y seraient aussi comestibles que ceux du Lac-Saint-Jean ou des lacs de l'Abitibi.\n\nLes crevettes nordiques du Québec, une denrée rare\nPrès du deux tiers des crevettes nordiques vendues au Québec ne viennent pas de la province. Dilemme pour les consommateurs : devrait-on prioriser un produit local, même s'il est menacé, ou se procurer celui qui vient d'aussi loin que de la Norvège ?\n\nLe homard des Îles-de-la-Madeleine entre tradition et défis\nAux Îles-de-la-Madeleine, l'année 2025 marquait le 150e anniversaire de la première mise à l'eau des cages à homard. Aujourd'hui de jeunes capitaines sont prêts à prendre des risques financiers dans un contexte de menaces tarifaires. Comment entrevoir l'avenir de cette industrie lucrative mais fragile ?\n\nPrésentation : Catherine Gauthier\n "
  ageRating: 7
- eventId: 1212230
  start: 2026-09-28T15:01:00Z
  stop: 2026-09-28T15:52:00Z
  title: 'Pêche / Pont de l''Île-d''Orléans / Saint-Laurent '
  subtitle: 'Au sommaire : Pêche en mer récréative ; pont de l''Île-d''Orléans, un chantier sous haute surveillance écologique ; le fleuve Saint- '
  description: "Au sommaire :\n\nPêche en mer récréative\nDes centaines de Québécois qui habitent au bord de l'estuaire du Saint-Laurent et de la baie des Chaleurs aimeraient pêcher des espèces comme le homard, les pétoncles et le flétan pour leur consommation personnelle. Mais des pêcheurs commerciaux et le gouvernement fédéral s'y opposent. \n\nPont de l'Île-d'Orléans : un chantier sous haute surveillance écologique\nDepuis plus d'un an, les activités entourant la construction du pont de l'Île-d'Orléans à Québec, sont sous haute surveillance écologique. Des biologistes travaillent à ce que les habitats des espèces vulnérables soient préservés des conséquences de la construction.\n\nLe fleuve Saint-Laurent et ses poissons se portent mieux\nMalgré sa mauvaise réputation, le fleuve Saint-Laurent se porte mieux qu'il y a une trentaine d'années. La qualité de l'eau s'améliore et les poissons y seraient aussi comestibles que ceux du Lac-Saint-Jean ou des lacs de l'Abitibi.\n\nLes crevettes nordiques du Québec, une denrée rare\nPrès du deux tiers des crevettes nordiques vendues au Québec ne viennent pas de la province. Dilemme pour les consommateurs : devrait-on prioriser un produit local, même s'il est menacé, ou se procurer celui qui vient d'aussi loin que de la Norvège ?\n\nLe homard des Îles-de-la-Madeleine entre tradition et défis\nAux Îles-de-la-Madeleine, l'année 2025 marquait le 150e anniversaire de la première mise à l'eau des cages à homard. Aujourd'hui de jeunes capitaines sont prêts à prendre des risques financiers dans un contexte de menaces tarifaires. Comment entrevoir l'avenir de cette industrie lucrative mais fragile ?\n\nPrésentation : Catherine Gauthier\n "
