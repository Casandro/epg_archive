  title: Zembla
  subtitle: Hulp in nood S35 E12. Sinds Trump de Amerikaanse ontwikkelingshulp terugschroeft, worden wereldwijd humanitaire programma's geraakt. Tijdens een reis door Kenia wordt zichtbaar wat deze bezuinigingen precies betekenen.
  description: Sinds president Trump in januari 2025 het mes in de Amerikaanse ontwikkelingsorganisatie USAID heeft gezet, worden wereldwijd humanitaire programma's stopgezet. Volgens Trump moet ontwikkelingshulp voortaan de belangen van zijn America First-beleid dienen. Ook in Europa wordt bezuinigd op ontwikkelingshulp. Maar wat betekenen die bezuinigingen voor de mensen die deze hulp het hardst nodig hebben? Tijdens een reis door Kenia wordt onderzocht wat de gevolgen zijn voor mensen die afhankelijk zijn van voedselhulp en voor hiv-patiënten die door de bezuinigingen hun toegang tot medicijnen en behandeling dreigen te verliezen. (2026)
