  description: In Ons Dorpje Overeind in Schalkwijk delen verschillende huishoudens een erf rondom een monumentale boerderij. Op een prachtige groene plek zorgen ze voor de natuur en voor elkaar. Het is een klein dorp waar mensen naar elkaar omkijken. * In het Friese Makkinga ziet chef-kok Samuel Levie hoe Joeke uniek zuurdesembrood bakt. Op eeuwenoude traditionele manier kneedt hij het deeg in een oude trog. Joeke bewijst dat traditie en technologie perfect samengaan. * In Almkerk ziet Marieke Eyskoot hoe Arend een slimme AI-robot heeft ontwikkeld, die onkruid herkent en verwijdert. Daardoor zijn chemische bestrijdingsmiddelen niet langer nodig. (2026)
