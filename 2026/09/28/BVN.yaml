  description: Af en toe komt er naakt langs. Ook deze keer in het Spoorwegmuseum. Joseph Estié krijgt dit achttiende-eeuwse doosje met erotische afbeelding aan tafel. Een aquarel geschilderd op ivoor. Het werd niet openlijk getoond en was typisch voor de "mancave" van toen. Een goede aanleiding om Joseph Estié, Willem Jan Hoogsteder, Martijn Akkerman en Mieke Zilverberg te vragen voorbeelden te laten zien van erotiek door de eeuwen heen. (2024)
