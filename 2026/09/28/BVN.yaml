  description: 'Tijdens het onderzoek ontdekt Joke dat de begraafplaats bij het klooster in Zoeterwoude is geruimd door militairen. Zij deden destijds een opmerkelijke vondst, waar bijna niemand van weet. Een Canadese professor, Rie Croll, komt naar Nederland. Ze wil het verband aantonen tussen wantoestanden in de Goede Herder-kloosters wereldwijd. De schaduwen uit het verleden drukken nog steeds zwaar op het gemoed van de vrouwen, de huidige leiding van de congregatie en de paar nonnen die nog leven. In de rechtszaal spelen zich emotionele taferelen af. Regisseur: Britta Hosman (2022)'
