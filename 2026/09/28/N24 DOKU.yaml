  title: Lost Places - Folge 58
  subtitle: Lost Places - Folge 58
  description: Eine Sanatorium in den USA, das wegen einer Pandemie errichtet wurde, ein unterirdisches Labyrinth, in dem ein schrecklicher Mord stattfand, ein in die Klippe geschlagenes Meisterwerk und ein Leuchtfeuer, das eine der berüchtigtsten Botschaften der amerikanischen Geschichte zeigt. Diese verlassenen Orte sind heruntergekommen durch Naturkatastrophen und kriegerische Auseinandersetzungen. Die Ruinen zeugen von Tod und Zerstörung, aber auch von menschlichem Einfallsreichtum und Fortschritt.
  widescreen: true
