  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 8'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 8'
  description: Seit fast 20 Jahren liefern sich mexikanische Drogenkartelle einen blutigen Kampf um die lukrativsten Schmuggelrouten in die USA. Da Waffen und Munition in Mexiko streng kontrolliert sind, besorgen sie sich ihr Arsenal in Amerika. Beamte decken den Schmuggel von 5.000 Schuss über die Hidalgo-Brücke auf, während in Laredo ein Elite-Team die Auslieferung eines gefürchteten Kartell-Killers vorbereitet, der in seiner Heimat wegen Mordes gesucht wird.
