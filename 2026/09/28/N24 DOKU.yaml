  description: 'Heinrich Himmler war einer der mächtigsten und einflussreichsten Männer des NS-Regimes, und einer der grausamsten. Als Vordenker der rassistischen Nazi-Ideologie, Gestapo-Leiter und Chefstratege der Konzentrationslager gehört er zu den Hauptverantwortlichen des Holocaust. Die Dokumentation zeichnet seinen zielstrebig-karrieristischen Weg vom Bürgersohn aus katholischem Elternhaus an die Spitze des Dritten Reiches nach und widmet sich dabei der ewigen Frage: Wie kommt das Böse in den Menschen?'
