  description: 'Ein Trubel ist das heute wieder: Je näher der Winter rückt, umso größer ist bei den Mähnenrobben der Kohldampf! Hoffentlich hat Tierpflegerin Juliane genügend Proviant dabei. Nach Wochen treibt sich Eisbärin Yowannah plötzlich im Außenrevier herum: Was ist denn da passiert? Wenn die Affen nicht zum Schnee kommen, dann muss der Schnee eben zu den Affen gebracht werden. Diese und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".'
