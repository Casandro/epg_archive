  start: 2026-09-28T18:03:00Z
  stop: 2026-09-28T20:00:00Z
  title: ARD Konzert
  subtitle: Schleswig-Holstein Musik Festival
  description: |-
    Als Ray Chen beim Eröffnungskonzert 2025 spontan für die erkrankte Solistin einsprang, erspielte er sich stürmischen Applaus. Nun ist er erneut zu Gast beim Schleswig-Holstein Musik Festival, diesmal an der Seite des Festivalorchesters unter der Leitung von Katharina Wincor. Gemeinsam reisen sie durch nordische Klanglandschaften, von Finnland - mit Sibelius' Violinkonzert - nach Schweden, wo Britta Byström, die Komponistin des "Walk to Beethoven", lebt. Virtuosität und Spielfreude sind garantiert, wenn das Orchester mit Zoltán Kodály "Tänzen aus Galánta" den Abend beschließt.
    <strong>Ludwig van Beethoven</strong>:<br/>Ouvertüre zu "Coriolan", op. 62
    <strong>Jean Sibelius<br/></strong>Violinkonzert d-Moll, op. 47
    <strong>Britta Byström<br/></strong>Walk to Beethoven
    <strong>Zoltán Kodály<br/></strong>Tänze aus Galánta
    <strong>Ray Chen</strong>, Violine <br/><strong>Schleswig-Holstein Festivalorchester</strong><br/>Leitung: <strong>Katharina Wincor</strong>
    Aufnahme vom 02. August 2026 aus dem Messe &amp; Congress Centrum in Husum
