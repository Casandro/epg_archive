  title: WDR 3 Open
  subtitle: 'MPB Highlights: Frisches aus Brasilien'
  description: Pop und Folklore sind in Brasilien keine Gegensätze, sondern fließen in der Música Popular Brasileira selbstverständlich zusammen. Eine Trennung zwischen E- und U-Musik ist unüblich. Und so prägen regionale Roots Musik, Bossa Nova, Samba und indigene Rhythmen seit Jahrzehnten mit, was in die Charts kommt. Auch junge Gen-Z-Musikerinnen beziehen sich auf das reichhaltige kulturelle Erbe des Landes.
