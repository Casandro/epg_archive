  title: Občan za dverami (23)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Klimatizácia už nie je luxusom, ale pre mnohých aj nevyhnutnosťou. V historických budovách však môže byť jej montáž problémom. Svoje o tom vedia aj obyvatelia jedného bytového domu v bratislavskom Starom Meste. Po obnove fasády im pamiatkari zakázali klimatizácie namontovať späť, lebo by špatili pohľad z ulice.... Kúpite si motorku, za ktorú zaplatíte nemalé peniaze a tri roky si na nej plníte svoje sny. Až do dňa kým vám na dvore nezazvoní kriminálka a po preverení VIN čísla ju musíte odovzdať. Dôvod nepoznáte vy ani inštitúcie, na ktoré sa obraciate a tak vám neostáva iné len čakať a dúfať, že sa všetko vysvetlí.... Plot znamená pre mnohých majiteľov rodinných domov viac než len hranicu pozemku. Vytvára pocit bezpečia a súkromia a dotvára aj celkový vzhľad stavby. Aj pánovi Jánovi záležalo na plote - aby bol funkčný, aj pekný. Nový plot však začal po niekoľkých mesiacoch praskať. Kto alebo čo je na vine, je však veľkosť záhadou. Staviteľ? Materiál? Základy? Počasie? Alebo niečo úplne iné?... (2026)
  genre:
  - '34'
