  subtitle: Dans l'un des derniers fiefs français du vitrail, Chartres, rencontre avec des maîtres verriers passionnés qui perpétuent cet art. Parmi eux, Jacques Loire n'a rien perdu de sa créativité à 80 ans passés.
  genre:
  - '116'
  description: 'La cathédrale Notre-Dame de Chartres impressionne par sa monumentalité et par la magnificence de ses vitraux. Des ateliers de peinture sur verre peuplent toujours les abords de l''édifice, à l''instar de la Maison Lorin, l''un des derniers établissements du XIXe siècle encore en activité. À sa tête, Élodie Vally contribue à la sauvegarde d''un patrimoine culturel inestimable. Pour Jacques Loire, maître verrier, l''art du vitrail représente aussi une vocation. À 80 ans passés, celui qui a conçu avec son père Gabriel les imposants vitraux bleus de l''église du Souvenir de Berlin n''a rien perdu de sa créativité. Il se consacre aujourd''hui à un projet destiné à une école d''infirmières au Japon. 360° Reportage a suivi les différentes étapes de son travail. Réalisateur: Jean-Baptiste Mathieu (2020)'
