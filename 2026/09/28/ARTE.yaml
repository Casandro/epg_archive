  title: Voyage gourmand
  subtitle: Les champignons S02 E06. Ni animal ni végétal, le champignon fournit mets recherchés et substances médicinales. Il pourrait également livrer des solutions novatrices.
  genre:
  - '32'
  description: 'Ni animal ni végétal, le champignon est un être vivant bien mystérieux. Cet organisme inclassable qui fournit mets recherchés et substances médicinales pourrait également livrer des solutions novatrices. En Grèce, dans la forêt du massif du Pinde, Katerina Tsagaropolou et Ilias Efthimiou chassent des variétés sauvages aussi rares que savoureuses. En région parisienne, Julie-Lou Dubreuilh les récolte dans la champignonnière de Bruno Zamblera. En cuisine, la cheffe Lucie Fischer-Chapalain les utilise en poudre parfumée pour rehausser l''umami - la cinquième saveur -, ou en \" cuisse d''oie \" végane. Autant de façons de redécouvrir cet aliment décidément sous-estimé, qui pourrait également être l''allié d''une agriculture plus durable. D''ailleurs, saviez-vous que le plus grand organisme vivant de la planète n''est autre que le champignon Armillaria solidipes ? Réalisateur: Marit Christenfeldt (2025)'
