- eventId: 1112674
  start: 2026-09-28T07:15:00Z
  stop: 2026-09-28T08:00:00Z
  title: Hospitals at Breaking Point
  subtitle: A Reliance on Doctors from Abroad
  description: "Germany is training more doctors than ever before - but the shortfall in hospitals still runs to thousands. The reason for this lies less in the absolute figures than in their distribution. Many specialists are drawn to urban centers, while rural areas face a shortage of skilled staff. Furthermore, many doctors are set to retire in the coming years, and an increasing number of them are working part-time. This is creating a noticeable shortage despite the high density of doctors, a problem exacerbated by a hospital system that's under financial pressure in many places. \nAlthough Germany has many hospitals by international standards, these include numerous small clinics in rural areas that are often barely profitable. To counteract this trend, a comprehensive hospital reform was launched at the end of 2024: fewer sites, greater specialization, and more outpatient treatment. While the Joint Federal Committee sees opportunities for greater efficiency in this move, the German Hospital Association warns that new gaps in care could arise in rural areas.\nThe documentary follows Mohamed Cherbagi, an internist from Syria who most recently worked at a hospital in Freiberg, Saxony, and Ina Viaroukina from Belarus, a junior doctor at the Harzklinikum in Quedlinburg. Both are taking on roles in places where their German colleagues are becoming increasingly hard to find. Through their personal stories, along with insightful commentary from experts, the documentary shows just how dependent many hospitals are on doctors from abroad, and how this dependence is linked to the structural challenges facing the German hospital system."
  widescreen: true
