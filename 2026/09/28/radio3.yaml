- eventId: 624941
  start: 2026-09-28T18:00:00Z
  stop: 2026-09-28T20:00:00Z
  title: ARD Konzert
  description: "Ludwig van Beethoven:\nOuvertüre zu \"Coriolan\" op. 62\nJean Sibelius:\nViolinkonzert d-Moll, op. 47\nBritta Byström: \nWalk to Beethoven\nZoltán Kodály: \nTänze aus Galánta\n \nRay Chen, Violine \nSchleswig-Holstein Festivalorchester\nKatharina Wincor, Dirigentin\n \nAufzeichnung vom 02.08.26 im Messe & Congress Centrum in Husum\n\n\nDie junge Dirigentin Katharina Wincor dirigiert beim Schleswig-Holstein Musik Festival Werke von Beethoven, Byström, Kodály und Sibelius, mit dem Geiger Ray Chen als Solisten. Als Ray Chen beim Eröffnungskonzert 2025 spontan für die erkrankte Solistin einsprang, erspielte er sich stürmischen Applaus. Nun ist er erneut zu Gast beim Schleswig-Holstein Musik Festival, diesmal an der Seite des Festivalorchesters unter der Leitung von Katharina Wincor. Gemeinsam reisen sie durch nordische Klanglandschaften, von Finnland - mit Sibelius' Violinkonzert - nach Schweden, wo Britta Byström, die Komponistin des \"Walk to Beethoven\", lebt. Virtuosität und Spielfreude sind garantiert, wenn das Orchester mit Zoltán Kodály \"Tänzen aus Galánta\" den Abend beschließt."
- eventId: 624942
  start: 2026-09-28T20:00:00Z
  stop: 2026-09-28T21:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Jürgen Schwab'
  description: |-
    The Sky is the Limit: Darius Blair und Finn Heine

    Für die Frankfurter Darius Blair (Saxofon) und Finn Heine (Gitarre) geht es steil nach oben. Seit 2020 ein Team, haben sie gemeinsam sowie jeder für sich schon viel erreicht: u. a. zwei Mal den Future-Sound Wettbewerb der Leverkusener Jazztage gewonnen, im Vorprogramm großer Künstler gespielt, am "Composers Fellowship Program" der WDR Bigband teilgenommen. Am 18.09. erscheint das Debutalbum ihres "Discovery Collective". Für ihr Konzert beim Dt. Jazzfestival am 16.10. haben sie eine Hommage an die Stadt Frankfurt geschrieben: mit einer neuen Band feat. Sasha Berliner (Vibrafon) plus Vokalensemble.

    Moderation: Jürgen Schwab
