  audiodesc: true
  description: Als erster Mensch mit Querschnittslähmung flog Michaela Benthaus im Dezember 2025 auf einem Parabelflug ins All und erlebte den Zustand der Schwerelosigkeit. Auf dem Roten Sofa erzählt die Astronautin von ihrem außergewöhnlichen Lebensweg zwischen Wissenschaft, Technik und persönlicher Stärke. In ihrem demnächst erscheinenden Buch "Zwischen Schwerkraft und Schwerelosigkeit" berichtet sie auch über ihr Leben mit einer Querschnittslähmung, die ihren Weg nachhaltig geprägt hat.
