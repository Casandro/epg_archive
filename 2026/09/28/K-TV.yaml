  title: '"Ich hörte Gottes Stimme" Berufungszeugnis von P. Jakob Wegscheider OFM'
  subtitle: Gespräch
  description: 'Bereits als 4-Jähriger durfte der heutige Franziskaner Jakob Wegscheider Gott in einem mystischen, tief ergreifenden Erlebnis begegnen. Gott enthüllte ihm seine Berufung: "Mir war, als hätte ich ein Stück des Himmels in mir erfahren." Mit diesem Geheimnis im Herzen begann ein Weg des inneren Ringens, begleitet vom "Aber" des Selbstzweifels. Sogar auf sein "Jein" antwortete Gott. Im Gespräch mit Athinea Andryszczak teilt der Filialvikar des Franziskanerklosters Brixen seine Erfahrung einer Dimension jenseits von Raum und Zeit, in der einzig Wahrheit und Ewigkeit existieren. Er erlebte die Glossolalie, spürte das Blut des Lammes Jesu Christi auf seiner Seele und den Liebesbrand der vollkommenen Reue. Auch die Erfahrung einer tiefen Nacht suchte ihn heim, "denn im Feuer wird Gold geprüft" (Jesus Sirach 2, 5).'
