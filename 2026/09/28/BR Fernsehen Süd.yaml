  description: |-
    Im Südtiroler Unterland, in der Gegend rund um Kurtatsch, geht es um die Geschichten rund um die Südtiroler Keller. Versteckt, inmitten der Weinberge, liegt der Auhof. Hier reift nicht Wein, sondern Essig. Hans Peter Widmann hat viel Erfahrung darin, wie bester Essig gemacht wird.
