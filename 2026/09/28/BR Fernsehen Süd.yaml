  description: 'München um 1900: Der Auftakt zum turbulenten 20. Jahrhundert zwischen Provinz und Pomp, zwischen Bohème und Bierboazn. Brigitte Hobmeier, die Darstellerin der Colina Kandl in der Event-Serie "Oktoberfest 1900", führt in der dazugehörigen Dokumentation "München 1900" zurück in die spannende Zeit, in der nichts mehr so ist, wie es einmal war. Eine Zeit, in der München als liberalste Stadt Deutschlands gilt, in der eine neue Frauenbewegung das Fenster in die Moderne aufstößt, in der aber auch der Monarch das gesellschaftliche Leben bestimmt.'
