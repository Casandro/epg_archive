  title: freizeit
  subtitle: Schmidt Max und der fränkische Silvaner
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Es ist eine wunderbare Rebsorte, die wir in Bayern haben. Und niemand kann besser damit umgehen wie die Franken. Eigentlich kam sie ja aus Österreich und hieß "Österreicher-Rebe". Im April 1659 begann ihr Siegeszug, der bis jetzt anhält. Eine Traube, die praktisch alles kann: von trocken bis edelsüß, von konventionellem Anbau bis hin zu Naturwein. Von Supermarkt bis Highend-Weinen. Und das Schönste: Der Silvaner passt, je nach Ausbau, zu praktisch allen Gerichten am Tisch.'
