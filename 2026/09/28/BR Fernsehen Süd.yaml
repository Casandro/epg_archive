  description: |-
    Auf dem Funkenhof im Ostallgäu hat Junglandwirt Simon Stöckle neben Alpakas, Pferden und Schafen vor allem Milchkühe. Als jüngster von fünf Brüdern hat er den Familienbetrieb in sechster Generation übernommen und seitdem viele Ideen eingebracht.
    Von Melkrobotern und Internetvideos ist man in Haidmühle weit entfernt. Hier leben und arbeiten Hubert Müller und Jürg Sommer. Seit nunmehr 30 Jahren erfüllen sich die beiden hier ihren Traum vom eigenen Biohof und einem gemeinsamen Leben auf dem Land. Die Erzeugnisse ihres Hofes verarbeiten sie überwiegend in ihrem eigenen bayrisch-arabischen Restaurant in Passau.
