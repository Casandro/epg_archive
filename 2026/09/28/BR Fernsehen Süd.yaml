  title: puzzle
  subtitle: Was ist eigentlich Natur? Was kommt uns in den Sinn, wenn wir an sie denken?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Was ist eigentlich Natur? Was kommt uns in den Sinn, wenn wir an sie denken?
    "Natur ist ein Kampfbegriff", "ein Weg zum Verständnis des Universums", "die vom Kosmos geschaffene Möglichkeit, wirklich zu werden", "dass man zwischen Bergen und Bäumen laufen kann und nicht so viel Beton und Asphalt unter den Füßen hat", "Vielfalt, Schönheit und eine Herzensangelegenheit" - diese Antworten geben Menschen, die sich auf vielfältigste Weise mit der Natur auseinandergesetzt haben.

    Wir brauchen die Natur, wir prägen und gestalten sie. Gleichzeitig beuten wir sie aus und zerstören sie.
