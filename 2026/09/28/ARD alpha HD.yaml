  title: Willi wills wissen
  subtitle: Wer biegt den Achter in die Bahn?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Willi ist in der höchsten Achterbahn Europas, dem Silver Star im Europapark Rust. 73 Meter ist die Bahn hoch! Mit 130 Sachen saust Willi über die Gleise, hinein in die nächste Kurve! Aber Willi will mehr erleben: Jeden Morgen, bevor der Betrieb losgeht, macht Sicherheitsingenieur Walter Mitternacht eine Kontrolltour. Und dreimal im Jahren werden die über 10.000 Schrauben kontrolliert. Höhenangst darf man bei diesem Job nicht haben! Doch wo werden Achterbahnen eigentlich entwickelt und gebaut? Zum Beispiel bei einer Firma in Waldkirch.'
