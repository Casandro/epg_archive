  title: 'alpha-retro: Erinnerungen an die Wiesn (1985)'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sigi Sommer alias Blasius der Spaziergänger führt 1985 anlässlich des 175-jährigen Bestehens des Münchner Oktoberfestes über die Wiesn. Zunächst aber gibt es einen historischen Rückblick auf deren Entstehung 1810: Es wurde damals aus Anlass der Hochzeit zwischen Kronprinz Ludwig (der spätere König Ludwig I.) und Therese von Sachsen-Hildburghausen auf der Theresienwiese ein Pferderennen ausgerichtet mitsamt Festbuden etc. Dieses Fest wurde von da an jedes Jahr wiederholt und weil es ursprünglich immer im Oktober stattfand, war es eben das "Oktoberfest".'
- eventId: 556084
  start: 2026-09-28T13:35:00Z
  stop: 2026-09-28T14:20:00Z
  title: 'alpha-retro: Bedienungen auf der Wies''n (1989)'
  subtitle: '"A bisserl was geht immer"'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Fünf Frauen aus Rosenheim und Umgebung fahren während des Oktoberfests 16 Tage lang nach München, um dort auf der Wiesn zu bedienen. Einige der porträtierten Frauen haben gerade das große Volksfest in Rosenheim, das Herbstfest, hinter sich und nun die Wiesn vor sich. Da sie im Garten des Löwenbräuzeltes von Wiggerl Hagn arbeiten, sind sie natürlich vom Wetter abhängig, aber "a bisserl was geht immer", sagen sie. Und das Härteste sei ohnehin nicht die Arbeit an sich sondern die tägliche Fahrerei: eine Stunde hin am Vormittag, eine Stunde zurück in der Nacht.'
- eventId: 556085
  start: 2026-09-28T14:20:00Z
  stop: 2026-09-28T15:15:00Z
  title: 'alpha-retro: Oktoberfest (1985)'
  subtitle: Rückschau anlässlich 175 Jahren Wies'n
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Warum gibt es eigentlich am ersten Wiesnsonntag immer einen sogenannten Trachtenumzug durch München? Warum fand neben dem Oktoberfest bis vor einigen Jahren noch jährlich (seit 2010 nur mehr alle vier Jahre) ein Landwirtschaftsfest statt? Warum gibt es Bierzelte und Wiesnwirte und seit wann? Und seit wann Fahrgeschäfte? Der Film gibt nicht nur darauf Antworten und zeigt älteste Filmaufnahmen vom Oktoberfest vom Beginn des 20. Jahrhunderts.
