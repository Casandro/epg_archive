- eventId: 1228930
  start: 2026-09-28T03:03:00Z
  stop: 2026-09-28T04:27:00Z
  title: Svjedoci, hrvatski film (12)
  subtitle: ' '
  description: 'Drama. Radnja se događa u 48 sati u jednom hrvatskom gradiću za vrijeme Domovinskog rata i tematizira problem krivnje pojedinca i gubitka duše u ratu. Nelinearna struktura priče omogućuje uvid u nekoliko ljudskih drama, ispričanih iz vizure krvnika, a ne žrtve, kako bi se propitalo funkcioniranje zla i spirala mržnje. Priča se odmotava svaki put iz nove vizure, a sve započinju u istom trenutku - trenutku istrage ubojstva, i svaka daje novu sliku onoga što se doista dogodilo... Scenarij za "Svjedoke" nastao je prema motivima romana Jurice Pavičića "Ovce od gipsa". Film "Svjedoci" (2003.) osvojio je 5 Zlatnih arena i "Oktavijan" - nagradu kritike u Puli 2003., nominiran je za "Zlatnog medvjeda" 2004., te nagrađivan na festivalima u Berlinu, Karlovym Varyma, Vlissingenu, Motovunu, Rimu i Jeruzalemu, a Europska filmska akademija uvrstila je film "Svjedoci" među 42 najbolja europska filma 2004. godine. Urednica: Maja Gregl'
- eventId: 1228931
  start: 2026-09-28T04:27:00Z
  stop: 2026-09-28T04:37:00Z
  title: 'Abeceda zdravlja: Kronična bol'
  subtitle: ' '
  description: U deset minuta govori se o jednoj bolesti i načinima liječenja te mogućnostima koje nude suvremena dijagnostika i terapija.
- eventId: 1228932
  start: 2026-09-28T04:37:00Z
  stop: 2026-09-28T04:47:00Z
  title: 'Studio 4: Kultura'
  subtitle: ' '
  description: Najnoviji informativni sadržaji iz zemlje i svijeta. Prijenosi, javljanja uživo, analize i razgovori s gostima iz svih područja javnog djelovanja. Politika, kultura, sport i aktualnosti iz društvenog života. Prvi, najbrži i najrelevantniji - Studio 4.
- eventId: 1228933
  start: 2026-09-28T04:47:00Z
  stop: 2026-09-28T05:45:00Z
  title: Nedjeljom u 2
  subtitle: ' '
  description: Tema emisije su vitalni umirovljnici. Može li starost biti dostojanstvena i lijepa, kako se nositi s odlascima najdražih ljudi, te što nam je najvažnije u trećem životnom dobu neke su od tema emisije. Gosti su bivša profesorica tjelesne kulture Đurđica Krčmar i novinar Miroslav Rede.
- eventId: 1228934
  start: 2026-09-28T05:45:00Z
  stop: 2026-09-28T06:13:00Z
  title: 'Mostovi: Hrvatski identitet - Mediteranci, dokumentarni film'
  subtitle: ' '
  description: U drugoj epizodi istražujemo koliko su neprestani ratovi na području današnje Hrvatske utjecali na identitet stanovništva ovih područja. Prateći povijest nekadašnje ličke Vojne krajine, preko Osijeka pa do Vukovara, vidjet ćemo da ponos na ratničku i vojnu prošlost Hrvata predstavlja jednu od najznačajnijih odlika suvremenog hrvatskog identiteta tih krajeva.
