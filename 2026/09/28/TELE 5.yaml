  title: Torchwood
  subtitle: Der Unbekannte Feind
  description: |-
    Da Rex und Esther fälschlicherweise wegen Spionage angeschwärzt worden sind, gehen die in Ungnade gefallenen CIA-Mitarbeitenden eine Allianz mit dem Torchwood-Team ein. Bei ihrer Spurensuche nach den Hintergründen des "Miracle Day" deckt die Gruppe erste Puzzleteile auf. Offenbar hat CIA-Direktor Brian Friedkin (Wayne Knight) Befehle von einer kriminellen Geheimorganisation erhalten. Durch Informationen der Ärztin Dr. Vera Juarez stößt das unkonventionelle Ermittlungsteam zudem auf ein Lager der Firma "PhiCorp", wo gigantische Mengen von Schmerzmedikamenten gebunkert sind.
