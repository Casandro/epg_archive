  description: "Vor der Küste Floridas liegt ein unermesslicher Schatz am Meeresgrund. Die Geschichte beginnt 1715, als König Philipp V. mehrere Schiffe von Havanna nach Europa beordert, um das Spanische Reich vor dem finanziellen Ruin zu retten. An Bord waren Gold, Silber, Juwelen und kostbare Artefakte. Doch elf der zwölf Schiffe sind in einem Tropensturm gesunken! Josh Gates hat bereits vor Jahren versucht die Reichtümer aufzuspüren - ohne Erfolg. Jetzt gibt es neue Hinweise auf den Verbleib der wertvollen Fracht. Sollte es den Schatzsuchern gelingen, die Wracks im Atlantik zu finden, wäre das eine archäologische Sensation... \nUSA 2019"
