  subtitle: Strączek wzywa do gabinetu Zuzę i Henryka i informuje, że archiwum zostanie zamknięte. Wzburzony archiwista przypomina sobie o sprawie śmierci Jana Gołka. Uważa, że Mirosław popełnił błąd.
