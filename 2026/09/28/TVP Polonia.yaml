    Występują: Bogusław Linda, Cezary Pazura, Artur Żmijewski, Magdalena Dandourian, Valeri Priyomykhov, Sergey Shakurov
    O tym, że "Psy 2" mogą stać się kinowym przebojem, wiadomo było już w chwili rozpoczęcia zdjęć. Sensacyjny scenariusz, znani z części pierwszej realizatorzy i oczywiście aktorzy z Bogusławem Lindą i Cezarym Pazurą na czele gwarantowali kasowy sukces. Rzeczywistość spełniła oczekiwania. W pierwszych tygodniach wyświetlania frekwencja była mniej więcej taka, jak na "Liście Schindlera". Cezary Pazura na MFF w Valenciennes we Francji w 1995 r. otrzymał nagrodę za rolę drugoplanową.
