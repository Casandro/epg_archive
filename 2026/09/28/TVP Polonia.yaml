    Obok Majaków, we wsi Pyrzyce, na dużej fermie padają kury. Miejscowi myślą, że to ptasia grypa. Sylwia ma pełne ręce roboty. Od jej diagnozy zależy czy cała hodowla będzie musiała zostać zutylizowana. Doktor Kubus wysyła do laboratorium próbki organów i paszy. Właściciel hodowli, Dawidowicz, teść wójta Steca, próbuje przekupić Sylwię, żeby wyniki były właściwe. W leśniczówce choruje też strusica Auguścików. Auguścikowa podnosi alarm, bo myśli, że jej podopieczna padła.
