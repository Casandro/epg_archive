    Strączek zostaje nominowany na stanowisko zastępcy komendanta. Postanawia od razu wykorzystać swoją władzę i wzywa do gabinetu Zuzę i Henryka. Oświadcza, iż archiwum ma być niebawem zamknięte. W tej sytuacji Wasiluk trafi do patrolu, a Mikos przejdzie na emeryturę. Po powrocie do swojego królestwa wzburzony archiwista zaczyna intensywnie myśleć. Po chwili przypomina sobie pewną sprawę, którą prowadził Mirosław.
