  title: Acqua da proteggere
  subtitle: ' '
  description: With Marco Faimali, director of the CNR's Institute for the Study of Marine Sustainability, we explore the ocean's fragile ecosystem and the need for protection. Anna Pancaldi visits marine protected areas, including the Smart Bay of Santa Teresa and the port of La Spezia, where researchers study "alien species". Finally, we learn about the underwater internet, an innovation from Sapienza University of Rome led by Professor Chiara Petrioli and the WSENSE team.
