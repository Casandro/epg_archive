  title: The tapestries of the Grand Master Restoration
  subtitle: ' '
  description: Towards the end of summer 1710, a precious cargo was unloaded on the shores of the Grand Harbour. Whoever opened that merchandise and laid eyes on it for the first time must surely have been astonished by its beauty. The tapestries of the Grand Master’s Palace had arrived in Malta. Watch their 300-year-old story unfold in this documentary by Heritage Malta.
