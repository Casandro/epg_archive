  title: Dokument
  description: V polovině září zemřela Ludmila Javorová, žena tajně vysvěcená na kněze. Bylo jí 94 let. Za komunistické totality se stala jednou z nejvýraznějších postav československé skryté církve. Byla blízkou spolupracovnicí biskupa této církve Felixe Maria Davídka, který ji v prosinci 1970 vysvětil nejprve na jáhna a následně na kněze. Dokument Ona je kněz o ní natočil katolický duchovní a dokumentarista Jan Hanák v roce 2021.
