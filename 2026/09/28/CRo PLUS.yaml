  title: Portréty
  description: Před pětaosmdesáti lety podepsali představitelé evropských mocností takzvanou Mnichovskou dohodu. Postoupení části československého území, tedy Sudet, Německu, odsouhlasili předseda francouzské vlády Édouard Daladier, italský diktátor Benito Mussolini, německý vůdce Adolf Hitler a ministerský předseda Velké Británie Neville Chamberlain. Právě jeho jméno je s konferencí v Mnichově nejčastěji spojováno. V jeho životě to ale byla jen jedna z mnoha epizod. V Portrétech ho představí historik Jan Adamec. Připravil a moderuje David Hertl.
