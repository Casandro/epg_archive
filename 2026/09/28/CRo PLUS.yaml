  description: Kde se vzalo nepřátelství mezi Čechy a Němci? Podle historika Josefa Pekaře žily na československém území přinejmenším tři národy - Češi, Slováci a Němci. Mnoho staletí spolu vycházeli bez problémů, ale to se postupem času změnilo. S historikem Petrem Pithartem o tom mluví Ivana Chmel Denčevová. Spolupráce Hynek Pekárek, režii měl Michal Bureš.
