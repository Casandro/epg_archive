  description: Jakub Železný. Dlouhé roky byl tváří hlavní zpravodajské relace České televize, pak z Událostí zmizel. Dnes moderuje slovy jednoho bývalého radního "bezvýznamný pořad", ten nese název Historie.cs. Dá se pohledem do minulosti říct o současnosti víc než přes aktuální zpravodajství? A co udělaly sociální sítě s mocí novinářského rozhovoru? Moderuje Barbora Tachecí.
