  title: Hovory
  description: 'Spisovatel a novinář Leoš Kyša vydává sci-fi Zápisky ze světa gerontokracie: "Žili jsme ve světě, který se jevil bezpečný, naše generace je v půlce života, v mládí toho tolik řešit nemusela, zato mladí to dneska mají jinak. Žijí v extrémně komplikovaném světě, mají před sebou jinou budoucnost," říká a popisuje, co ho inspirovalo k tématu světa v roce 2060: "Lidé, kteří touží odložit technologie a vypadnout z křeččího kolečka, jsou pro mě velkou inspirací," říká. "Zajímají mě obyčejní lidé ve světě roku 2060 a jejich příběhy ve velkém světě, třeba ten, kdo se postaví vládnoucím autoritám." Jak budou žít děti našich dětí ve světě, kde převládnou senioři a seniorky? Jak se změní svět? Jaké filtry našim životům dává digitální svět a proč se ve světě AI generované kultury máme připravit na samotu? Moderuje Petr Vizina.'
