  title: Dvacet minut Radiožurnálu
  description: Hostem je Michal Malý, politolog z Institutu politologických studií Fakulty sociálních věd Univerzity Karlovy. V nadcházejících komunálních volbách mohou voliči hlasovat pro mnoho známých politických tváří. Je zcela v pořádku, když ministři, poslanci či dokonce europoslanci kandidují v místních volbách? Co všechno rozhoduje o volebním úspěchu či neúspěchu? Zeptá se Vladimír Kroc.
