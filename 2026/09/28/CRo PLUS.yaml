  title: Hovory
  description: 'Katolický kněz a salesián Michael Martínek pracuje s mládeží a publikuje edukační videa na sociálních sítích: "Zaměřuji se především na lidi, kteří jsou schopni víru nahlížet kriticky," říká. "Církev si myslí, že má dobré jméno, ale já si tím nejsem úplně jist. Hlavní cesta je podle mě v kontaktu s lidmi, kdy vnímám, nejen u křesťanů, co si myslí, nad čím přemýšlí." Co ho vede k otevřenosti? Co může církev nabídnout lidem, kteří v Boha nevěří? Kdy člověk potřebuje být sám? A co ho naučila jízda na kole v různých koutech světa? Moderuje Petr Vizina.'
