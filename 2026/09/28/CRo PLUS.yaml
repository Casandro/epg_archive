  title: Historie Plus
  description: Historie Plus představí jednu z našich nejstarších literárních památek. Spis o počátcích křesťanství na Velké Moravě a v Čechách a o prvních českých světcích - svatém Václavu a svaté Ludmile - se běžně nazývá Kristiánova legenda. A váže se k ní také nejdéle trvající spor českých historiků. Provede vás jím Naďa Reviláková.
