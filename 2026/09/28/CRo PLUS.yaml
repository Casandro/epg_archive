  title: Reparát
  description: Dobrovolnické spolky rodičů dnes hrají ve školách mnohem významnější roli než dříve. Aktivně se podílejí na budování školní komunity, ovlivňují kvalitu života ve škole i smysluplnost vzdělávání. Jak vypadá škola otevřená rodičům? Základem je dobře nastavená spolupráce mezi rodiči a školou, shodují se hosté pořadu. Moderuje Markéta Vozková.
