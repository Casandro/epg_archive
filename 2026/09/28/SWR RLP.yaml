  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In Deutschland herrscht Vollbeschäftigung. 1935 verabschiedet die NS-Regierung die Nürnberger Gesetze, die jüdische Bürger diskriminieren. Frankreich wählt eine sozialistische Regierung, worauf eine Kapitalflucht einsetzt, die die wirtschaftlichen Probleme verschärft. In Spanien putschen rechte Generäle unter Francisco Franco gegen die linke Regierung. 1936 bricht der Bürgerkrieg aus. Hitler und Mussolini unterstützen Franco, während junge Freiwillige aus ganz Europa für die Republik kämpfen. In der Sowjetunion lässt Josef Stalin Konkurrenten als "Volksfeinde" brutal verfolgen und ermorden
