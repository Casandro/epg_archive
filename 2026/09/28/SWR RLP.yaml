  description: Die 2014 in Afghanistan ermordete Fotografin Anja Niedringhaus prägte mit ikonischen Bildern ein Vierteljahrhundert lang die Titelseiten der internationalen Presse. Im Fokus steht das dramatische Leben einer starken Frau, die gegen viele Widerstände ankämpfen musste. Eine kriminalistische Spurensuche wirft ein völlig neues Licht auf die Umstände ihres Todes und belegt die Mitschuld des Westens.
