  title: 'Uwe Ochsenknecht präsentiert: die 7 Todsünden'
  subtitle: |-
    Uwe Ochsenknecht präsentiert: die 7 Todsünden
    Kriminal-Reihe, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Uwe Ochsenknecht

    Ein Arzt in Halberstadt betäubt im Jahr 2018 eine Frau beim Sex heimlich mit Kokain. Ein paar Tage später stirbt sie an Herzversagen. Sie ist nicht die Einzige, die der Mediziner mit Drogen sexuell gefügig machen wollte. Im Schloß Holte-Stukenbrock bringen ebenfalls im Jahr 2018 versteckte Kameras ein grausames Verbrechen ans Licht. Klaus O. versetzt über Jahre die Pausenbrote und Getränke seiner Kollegen mit Chemikalien. Eine Person stirbt an den Folgen der Vergiftung.
