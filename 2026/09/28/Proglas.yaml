  title: Den české státnosti
  subtitle: Svatý Václav včera a dnes
  description: 'Autor: Jan Krbec; Interpret: prof. PhDr. Jiří Hanuš, Ph.D, Jan Krbec - moderátor; Premiéra: 27.9.2021 * Máme důvěryhodné zdroje informací o sv. Václavu, nebo se můžeme spoléhat jen na legendy? Kdo byl tento světec ve své době a čím může být inspirativní pro dobu dnešní? Jak bychom popsali svatováclavskou tradici a její vývoj v průběhu let? Jaké jsou mýty a zkreslené informace o sv. Václavovi? A co velmi jeho diskutovaný vztah k Sasku? Hostem Dopoledne s Proglasem bude tentokrát prof. Jiří Hanuš z Filozofické fakulty Masarykovy univerzity v Brně. K poslechu zve Jan Krbec.'
