  title: Debaty z Dominikánské 8
  subtitle: Simone Weil ? žena, která se nehodila nikam
  description: 'Autor: Dominikánská 8; Interpret: Marina Barabas, Daniel Pastirčák, Alena Roreitnerová, Petr Fischer; Premiéra: 5.1.2026 * Byla mystička, filozofka i sociální reformátorka. Velmi civilně a současně formulovala hluboké postřehy o člověku ve světě a jeho vztahu k Bohu. U přijímacích zkoušek na pařížskou École normale supérieure se umístila první před Simone de Beauvoir. Pracovala v továrnách, aby pochopila podmínky dělníků. Během druhé světové války se připojila k francouzskému odboji a zemřela v Anglii na tuberkulózu, zhoršenou dobrovolným hladověním na protest proti okupaci Francie. Co ještě nevíme o Simone Weil?[simon vejl] [ekol normal superier] [simon de buvoár]'
