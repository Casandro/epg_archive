  title: Jak se vám líbí
  subtitle: Koncert skupiny Nonsen ze studia Proglasu
  description: 'Autor: Jannis Moras * Pražská alternativně jazzová kapela Nonsen vystoupí živě v našem Koncertním studiu. V rozhovoru je řeč o tom, jak vznikají skladby, jak se na jejich výsledné podobě podílejí jednotliví muzikanti a jak pracují s takzvanou ?řízenou“ neboli ?zodpovědnou“ improvizací. Řeč bude také o neobvykle pestrém nástrojovém obsazení kapely, které vedle kytar, klarinetů a bicích zahrnuje například příčnou flétnu, syntezátor, turecký drnkací nástroj saz nebo indiánskou flétnu. Nonsen představí také rozdíl mezi studiovou a živou podobou svých skladeb a vysvětlí, jak do výsledného zvuku promlouvají různé sestavy kapely. Moderuje Jannis Moras. '
