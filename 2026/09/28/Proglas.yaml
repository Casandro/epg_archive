  subtitle: Sedm Janků a Drak Sedmihlavec - Tři zlaté pávice
  description: 'Autor: František Lazecký; Interpret: Vypravěč - Marcela Kopecká; nejmladší syn - Jan Novotný; nejstarší syn, sluha, kůň a sedlář - Vašek Ambrož; král, prostřední syn, sluha, skladník, kovář, staříček - Dušan Baur; nejmladší princezna - čarodějnice, nejstarší princezna - Adriana Růžičková; liška - Magda Hauserová; prostřední princezna - Kateřina Kovaříková; Premiéra: 17.11.2014 * Dnešní sváteční pohádka bude z pera Františka Lazeckého. Uslyšíte v ní některé nářeční výrazy ze Slezska, takže byste měli předem vědět, že liška, o které někdo řekne, že je "boraska" znamená, že je chudinka, nikoli holka od slova "borec". Věřím, že i tak budete s vyprávěním o statečném mládenci, zakletých princeznách a drakovi spokojení!'
