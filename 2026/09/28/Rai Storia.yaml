  title: Passato e presente - La teologia della L
  subtitle: Passato e presente - La teologia della Liberazione - A partire dalla seconda metà degli anni '60, l'America Latina è sconvolta da una serie di colpi di stato che, con l'appoggio degli Stati Uniti, instaura
  description: "no dei governi militari. Le terribili condizioni di povertà della popolazione suscitano una risposta forte da parte della Chiesa Cattolica che assume la forma di un nuovo pensiero teologico: la Teologia della Liberazione. Una liberazione non solo spirituale, ma anche dalle disumane condizioni di sottosviluppo. Si contesta il capitalismo occidentale, poiché basato sullo sfruttamento indiscriminato delle risorse del Terzo Mondo. I governi latinoamericani reagiranno con violenza uccidendo molti prelati e la Chiesa di Giovanni Paolo II condannerà la nuova teologia, ritenendo che corra il rischio di trasformare il messaggio cristiano in un mero programma politico. In studio, con Paolo Mieli, il professor Massimo Di Giuseppe. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio il prof. Massimo De Giuseppe \nCon la partecipazione di Gregorio Staglianò \nRegia Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
