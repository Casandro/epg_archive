  title: Dove sta Zazà (ep.1)
  subtitle: '"Dove sta Zazà" andò in onda nel 1973 sul Programma Nazionale in 4 puntate. Girato a colori, andò in onda in bianco e nero (qui di seguito, per la prima volta, tutte le puntate integrali a colori). Il programma era condotto ..'
  description: "a Gabriella Ferri, Enrico Montesano, Pippo Franco, Oreste Lionello e Pino Caruso. \"Dove sta Zazà\" era fondato sulle canzoni della Ferri e sugli sketch dei comici tratti dal repertorio del cabaret classico. La regia era di Antonello Falqui, autore del programma insieme a Mario Castellacci e Pier Francesco Pingitore. Prima puntata di \"Dove sta Zazà\", con una Gabriella Ferri che fra balli, canzoni e cabaret, si ripropone di raccontare gli spettacoli di cabaret del passato. Nei panni di un pagliaccio, la bionda e romanissima cantante interpreta fra le altre \"Reginella\", \"Affaccete Nunziata\", \"Gita a li castelli\". Enrico Montesano si esibisce in uno sketch sulla comicità degli anni Venti. - Un programma di Enrico Salvatori \nCon la collaborazione di Lucia Ciancaglini \nProduttrice esecutiva Alessandra Giorgi \nRegia Agostino Pozzi, Fabrizio Marini"
