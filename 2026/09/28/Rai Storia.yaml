  title: 'Passato e presente - La riforma agraria '
  subtitle: Passato e presente - La riforma agraria del 1950, la terra ai contadini - Dopo il crollo del fascismo e la progressiva liberazione della penisola dall'occupazione nazifascista, le campagne italiane vengono
  description: "percorse da nuove ondate di agitazioni e proteste. Si chiede la terra, a cominciare da quella incolta e abbandonata, tante volte promessa e mai concessa dai governi dello stato unitario. Sono proprio le lotte contadine, nel contesto della nuova Italia repubblicana e democratica, a rendere possibile la parziale realizzazione di quell'antica aspirazione. E' il sesto governo De Gasperi, con Antonio Segni al ministero dell'agricoltura, a varare i provvedimenti che portano alla più grande redistribuzione di ricchezza mai avvenuta nella storia d'Italia: 800.000 ettari di terra passano di mano, espropriati alle grandi proprietà e riassegnati a decine di migliaia di piccoli coltivatori. In studio, con Paolo Mieli, il prof. Agostino Giovagnoli. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio Agostino Giovagnoli \nCon la partecipazione di Carla Oppo \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
