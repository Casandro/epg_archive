  title: Sappada
  subtitle: Sappada è un borgo alpino unico nel panorama delle Dolomiti al confine con il Veneto, un'isola linguistica germanofona con una sua forte identità culturale e ricca di tradizioni tramandate di generazione in generazione. Questo piccolo pae
  description: 'se di 1.300 abitanti ha un primato: può contare su ben dieci medaglie olimpiche e ventisette medaglie d''oro tra sci alpino, sci nordico, biathlon e snowboard.L''ultima atleta, originaria di Sappada, a conquistare il gradino più alto del podio è stata Lisa Vittozzi alle Olimpiadi invernali Milano Cortina 2026, la prima campionessa olimpica italiana nella storia del biathlon. Tutto questo rappresenta un punto di forza per il movimento degli sport invernali, non solo per il Friuli Venezia Giulia, ma anche per tutta Italia.'
