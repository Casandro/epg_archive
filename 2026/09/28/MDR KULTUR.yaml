- eventId: 618958
  start: 2026-09-28T18:00:00Z
  stop: 2026-09-28T19:00:00Z
  title: Die Macht lag auf der Strasse
  subtitle: Die DDR-Bürgerrechtsbewegung und ihr Blick auf die Wiedervereinigung / Von Norbert Lang; Julia Illmer
  description: |-
    Jubel, Freudentränen und Feuerwerke am Brandenburger Tor - der Mauerfall und die Wiedervereinigung gelten vielen als glückliche Momente der deutschen Geschichte. In der Oppositionsbewegung der DDR dominierte jedoch Skepsis bis Ablehnung. Ihr mutiger Widerstand in den Kirchen und an Runden Tischen sowie ihr Engagement bei den großen Massendemonstrationen waren entscheidend für das Ende der SED-Diktatur.

    Doch schon bald nach dem Mauerfall zersplitterten die Gruppen und viele verschwanden enttäuscht von der politischen Bühne. Heute sind sie trotz dieser historischen Bedeutung in der Öffentlichkeit nur wenigen bekannt. Warum ist das so? Wie ist die Widerstandsbewegung der DDR entstanden und wie blicken die Oppositionellen von damals heute auf die Politik und das deutsch-deutsche Verhältnis?

    Das Feature "Die Macht lag auf der Straße" basiert auf Interviews der amerikanischen Psychologin Molly Andrews. Seit der Wende hat sie mehr als ein Dutzend führende Bürgerrechtler*innen mehrfach interviewt - etwa zu frühen Momenten der Politisierung, ihrem Widerstand gegen die Stasi und SED, den Konflikten innerhalb der Bewegung oder dem Ostdeutschland von heute. Aus über 70 Stunden Tonbandmaterial entsteht eine vielstimmige Biographie der DDR-Opposition, von ihren Anfängen bis heute.

    Julia Illmer studierte Kulturwissenschaften und ästhetische Praxis mit dem Schwerpunkt Medien an der Universität Hildesheim sowie der Queen Mary University in London und der RMIT University in Melbourne. Sie arbeitet als Autorin, Producerin, Redakteurin und Medienpädagogin unter anderem für den öffentlich-rechtlichen Rundfunk, Streaming-Dienste und Museen.

    Norbert Lang lebt und arbeitet als freier Radiomacher und Soundkünstler in Berlin. Er studierte Kulturwissenschaften und ästhetische Praxis mit den Schwerpunkten Musik und Medien an der Universität Hildesheim. Von 2010 bis 2015 war er Mitarbeiter der Redaktion Hörspiel und Medienkunst des Bayerischen Rundfunks und produzierte im Rahmen der Sendung "hör!spiel!art.mix" Interviews, Sound-Dokumentationen und Radio Essays. Als Soundkünstler komponiert er für Rundfunk, Tanz und Theater, realisiert Sound Lectures, Audiowalks und Klanginstallationen.

    Produktion: HR 2025
