  title: Die gelbe Tapete (Folge 1 von 3)
  subtitle: Von Charlotte Perkins Gilman
  description: "\"Es gibt eine sich wiederholende Stelle, wo sich das Muster wie ein gebrochenes Genick krümmt und wo mich zwei herausquellende Glupschaugen verkehrt herum anstarren. Ihr unverfrorenes und unverwandtes Glotzen macht mich richtig wütend. Rauf und runter und seitwärts kriechen sie, und diese absurden, starren Augen sind überall ...\"\n\nHeute würde man vielleicht von Burn out sprechen. Oder schlicht von postnataler Depression. Das Baby ist da, die Mutter ist nicht glücklich. Der Patientin wird Ruhe verordnet, eine Liegekur im Zimmer mit der gelben Tapete im neuen Landhaus. Schreiben darf sie nicht, das wühlt sie auf - aber Schreiben ist das einzige, was sie will. Sie muss aufschreiben, was mit dieser Tapete passiert, denn in der Wand lebt eine andere Frau  Die Erzählung \"Die gelbe Tapete\" stammt von 1892 und packt bis heute durch ihre suggestive Perspektivenverschiebung. Der Leser kann nicht anders, seine Wirklichkeit ist die der Hautfigur - die der lebenden Ornamente. Die Amerikanerin Charlotte Perkin Gilman (1860-1935) schilderte eigene Krisenerfahrungen und löste mit ihrem Text eine Debatte über rollenfixierte Psychiatrie aus. Die Schauspielerin Valery Tscheplanowa schlüpft in die Rolle der Erzählerin und zieht ihre Hörer unwiderstehlich hinter die verschlossenen Türen des gelben Zimmers.\n\nÜbersetzung: Elke Link\nProduktion: BR 2014\n\nMitwirkende: \nValery Tscheplanowa"
