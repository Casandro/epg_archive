  title: Universum History
  subtitle: Wo die Sonne niemals unterging - Das Weltreich des Karl V.
  description: "Das Doku-Drama \"Karl V. - Macht und Ohnmacht eines Kaisers\" ist die vergessene Geschichte eines ehrgeizigen Herrschers, der keinen Krieg scheute, um seine humanistischen Ideale und seine religiöse Überzeugung durchzusetzen - finanziert mit geraubtem Gold aus den Kolonien. Doch die Kirche in Europa spaltet sich. Das Weltreich zerfällt, denn Karl V. wirft am Ende resigniert Krone und Zepter weg und zieht sich zurück. Ein Schock für die Menschen, viele sahen sogar den nahenden Weltuntergang. \nEin Film über den ersten \"Weltherrscher\" der Neuzeit vor 500 Jahren, seine visionäre Anmaßung und sein - sowohl politisches als auch menschliches - Fiasko, das ebenso ein Spiegelbild der globalen Welt und \"Mächtigen\" unserer Tage sein könnte."
  genre:
  - '129'
