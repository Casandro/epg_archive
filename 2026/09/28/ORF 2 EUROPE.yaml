  title: kulturMONTAG
  description: "Bruno Kreiskys Weg zum Polit-Superstar\nWie wurde aus dem Buben, der 1911 in eine reiche, jüdische Wiener Familie hinein geboren wurde, ein eingefleischter Sozialdemokrat und linker Polit-Superstar? Dieser Frage geht Regisseur Harald Sicheritz in seinem neuen Spielfilm \"Bruno - der junge Kreisky\" nach. Nestroy-Gewinner Nils Arztmann spielt diesen jungen Rebellen, der sich mit aller Kraft gegen den stetig wachsenden Faschismus auflehnt und dabei auch sein Leben riskiert.  \nDie soeben erschienene Pisa-Studie zeichnet ein erschütterndes Bild in Sachen Lesekompetenz: Schülerinnen und Schüler weltweit und in Österreich können immer schlechter lesen. Und auch am Buchmarkt herrscht Alarmstimmung: Immer weniger Jugendliche greifen zum Buch, zuletzt sind die Buchverkäufe in dieser Zielgruppe um 30 Prozent zurückgegangen. \nDas RSO Wien hat einen neuen Chefdirigenten - Markus Poschner übernimmt das renommierte Orchester. Live im Studio erzählt der gebürtige Münchner von seinen Plänen.\nModeration: Clarissa Stadler"
  genre:
  - '122'
- eventId: 1098842
  start: 2026-09-28T21:15:00Z
  stop: 2026-09-28T21:59:48Z
  title: Der Klang Europas
  subtitle: Bosnien und Herzegowina
  description: |-
    (Dokumentation, AUT 2026)
    Die neue Sendereihe "Der Klang Europas" stellt außergewöhnliche Sänger:innen, Ensembles und Musiker:innen in unterschiedlichen Regionen Europas vor, die von der Tradition ausgehend Eigenes, Neues und Modernes kreieren. In der ersten Ausgabe begibt sich Regisseurin Heidi Neuburger-Dumancic auf der Suche nach dem Klang Europas nach Bosnien, wo es insbesondere die Sevdah oder Sevdalinka zu erkunden gibt - die wohl typischste lokale Musikrichtung, die auch oft als "bosnischer Fado" oder "bosnischer Blues" bezeichnet wird. In den von Melancholie und tiefer Emotionalität geprägten Balladen werden oft Themen wie Liebe und Herzschmerz, Tod und Verlust besungen. Einer der eindrucksvollsten Sevdah-Interpreten der Gegenwart ist Božo Vreco, der alten Traditionen mit modernem Zeitgeist verbindet und dabei auch bewusst mit Geschlechterklischees bricht. Er geht auch der Frage nach, was die kulturellen Wurzeln dieser Musik sind, was sie im Heute bedeutet und welches Lebensgefühl die Gesänge zum Ausdruck bringen.
  genre:
  - '112'
