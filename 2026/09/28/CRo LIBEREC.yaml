  title: Host Dopoledne pod Ještědem
  description: 'Téma: Život a smrt knížete Václava. Arcibiskup Stanislav Přibyl. 28. září si Česká republika připomíná svatého Václava, patrona českého národa a jednoho z nejvýznamnějších světců naší historie. Den české státnosti, jak se svátek oficiálně nazývá, je státním svátkem a připomíná nejen život a mučednickou smrt knížete Václava, ale i jeho odkaz míru, křesťanské víry a spravedlivé vlády. Tuto významnou osobnost našich dějin nám připomene velice vzácný host, pražský arcibiskup Stanislav Přibyl, kterého si k mikrofonu pozvala redaktorka Českého rozhlasu Liberec Ivana Bernáthová.'
