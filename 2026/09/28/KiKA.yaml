    Wurm Glitsch und Küken Karla liefern sich einen "Mutigkeitswettbewerb". Doch als die Mutproben immer riskanter werden, erkennen beide: Auch Nein-Sagen kann äußerst mutig sein!

    Glitsch und Karla versuchen sich in immer waghalsigeren Aufgaben zu überbieten. Die ganze Klasse feuert sie dabei lautstark an. Nur Wichtel Bob hat Bedenken. Doch Karla hört nicht auf ihn. Erst als es für Karla und Glitsch richtig brenzlig wird, denken sie um.
