  description: |-
    Ein Blättlein fein für Posylein

    Beim "Ich sehe was, was du nicht siehst"-Spiel entdecken Pip und Posy einen Baum mit wunderschönen roten Blättern. Und sie beschließen, "Wer fängt die meisten Blätter" zu spielen.

    Leider hat Posy gar kein Glück beim Fangen - sie erwischt nicht ein einziges Blatt. Den anderen Freunden hingegen fällt das Fangen total leicht - und Posy versucht es auf deren Art, was ihr aber auch nicht gelingt.

    Pip will ihr eins von seinen Blättern schenken - aber sie möchte lieber ihr eigenes Blatt fangen. Da wendet Pip einen Trick an und lenkt Posy ab, bevor er ihr etwas zuwirft. Und siehe da - plötzlich kann Posy richtig gut fangen. Weil sie gar nicht viel darüber nachgedacht hat.
