  description: |-
    Die Ukulele

    Als Pip gerade "Spinne" spielt, kommt Posy mit ihrer Ukulele zu ihm und präsentiert ihm stolz die kleine Melodie, an der sie den ganzen Morgen geübt hat. Pip möchte es auch mal versuchen.

    Posy sagt ihm gleich, dass es ganz schön knifflig sei, Ukulele zu spielen. Doch schon nach wenigen Anläufen kriegt Pip es ziemlich gut hin, was Posy irgendwie gar nicht toll findet. Sie will lieber "Spinne" mit Pip spielen und auf keinen Fall Ukulele!

    Als Pip sie fragt, warum, gibt sie zu, dass sie sauer sei, dass er immer alles so schnell schaffe und sie eben nicht. Da erklärt Pip ihr liebevoll, dass er das Ukulelespielen ohne ihre Hilfe niemals hinbekommen hätte - Posy ist wieder versöhnt, und die beiden musizieren fröhlich und vergnügt gemeinsam als die "musikalischen Spinnen".
    Regie: Seán McCormack
    Buch/Autor: Matt Baker
    Musik: Ellie Wyatt, Joss Peach
