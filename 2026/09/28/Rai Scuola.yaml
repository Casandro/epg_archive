  title: Progetto Scienza 2024 Racconti di Scienz
  subtitle: Progetto Scienza 2024 Racconti di Scienza - Missione Artico - L'Oceano Artico è uno degli ecosistemi più vulnerabili ai cambiamenti climatici. L'aumento medio delle temperature è maggiore rispetto al resto
  description: del pianeta e ne influenza il clima incrementando l'intensità degli eventi meteorologici estremi. Monitorare e studiare le masse dacqua dell'Oceano Artico è quindi fondamentale per poter affrontare il cambiamento climatico a livello globale. Dal 30 giugno al 12 luglio 2024 la nave oceanografica "Alliance", di proprietà della NATO, è stata operativa nello stretto di Fram e nel Mar di Norvegia settentrionale, per condurre la campagna ACO24, "Arctic Climate Observatory". A bordo della nave i militari della Marina Militare Italiana, i ricercatori del Consiglio Nazionale delle Ricerche, dell'Istituto Nazionale di Oceanografia e di Geofisica Sperimentale e del Centre for Maritime Research and Experimentation (CMRE) ci raccontano la vita a bordo, i metodi e i risultati della spedizione scientifica. "Alliance", che dal 2017 effettua ogni anno una spedizione in Artide per studiare il clima nell'Oceano Artico, è tra le navi da ricerca più silenziose al mondo ed è gestita dalla Marina Militare italiana, mentre il CMRE è l'unico centro di ricerca e sperimentazione marittima della Nato e ha sede da oltre 60 anni a La Spezia, all'interno della base della Marina Militare Italiana. Storicamente il centro viene collocato in questa realtà per occuparsi di acustica nell'oceano, ma dagli anni `90 ha cominciato a fare ricerca anche nell'ambito di discipline più ampie, come lo studio del clima del pianeta.
