  description: 'ini, geologo dell'' Istituto di Geoscienze e Georisorse del CNR di Pisa, invece entriamo in galleria per scoprire cosa può trovare un geologo in un luogo del genere; scopriamo le tecniche e gli strumenti di indagine di un geologo quando si analizza un sito, mentre a Firenze, all''Istituto Nazionale di Fisica Nucleare, viene messa a punto un''altra tecnica che sfrutta l''energia cosmica con la quale è stata mappata la miniera del Temperino e sono state effettuate nuove scoperte: Lorenzo Bonechi e Vitaliano Ciulli, fisici dell'' Istituto, raccontano le difficoltà e i risultati ottenuti, ma le miniere non sono solo il passato: la transizione energetica richiede l''utilizzo di numerose materie prime, cosiddette ''critiche''; oggi arrivano per lo più da paesi extracomunitari, ma l''Unione Europea ha deciso per i prossimi anni di aumentarne la produzione e la trasformazione sul suolo continentale. In questa ottica, in provincia di Cagliari, sta riaprendo dopo anni una miniera di fluorite: con il direttore Alessandro Murroni e il responsabile della sicurezza Andrea Melis scendiamo in profondità per vedere quali caratteristiche deve avere una miniera moderna in termini di sicurezza e sostenibilità ambientale. Le vecchie miniere hanno spesso lasciato complicate situazioni ambientali. Stefano Naitza e Giovanni De Giudici, geologi dell''università di Cagliari, studiano alcuni di questi siti dismessi per verificarne la sicurezza e sviluppare metodi per la bonifica e allo stesso tempo per capire come recuperare i materiali ancora preziosi celati in quelle discariche. Sempre in un''ottica di sostenibilità ambientale, un altro sito minerario toscano abbandonato, incontriamo Chiara Boschi dellIstituto di Geoscienze e Georisorse del CNR di Pisa. - un programma di Maria Agostinelli, Giuseppe Cembalo, Davide Coero Borga, Federica De Maria, Mario Ferrari, Diego Garbati, Nicoletta Piu, Alberto Polimanti, Pino Roggero a cura di Eleonora Ottaviani capo progetto Diego Garbati conduce Davide Coero Bor'
