  title: Progetto Scienza Newton Edu (pt. 02) Ani
  subtitle: 'Progetto Scienza Newton Edu (pt. 02) Animali: La relazione fra i sessi. - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata del ciclo dedicato alla Zoolo'
  description: gia, Davide Coero Borga e il Professor Biagio D'Aniello, zoologo dell'Università Federico II di Napoli, ci conducono alla scoperta delle differenze sessuali, morfologiche e di comportamento, delle varie specie, parlando di competizione spermatica e di scelte femminili, di paternità multiple e di variazioni emotive tra maschi e femmine. Andrea Pilastro, zoologo dell'Università di Padova, mostra i pesci Guppy corteggiarsi e accoppiarsi e le femmine operare una scelta spermatica successiva all'accoppiamento, e descrive quali sviluppi la ricerca pura offra a quella applicata e alla vita di noi tutti, studiando i casi di fertilità e infertilità in questi piccoli pesci da acquario. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Giuseppe Cembalo, Federica De Maria, Mario Ferrari, Daniela Mazzoli, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga con la partecipazione di Anna Pancaldi
