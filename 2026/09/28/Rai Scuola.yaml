  description: 'mondo che ci circonda e delle sue regole. Con l''astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo di Robotica.I robot industriali attivi sono più di due milioni e mezzo. I robot sono dispositivi utilizzati in numerosi ambiti, dalla chirurgia allo spazio, e destinati a svolgere compiti spesso gravosi, operando al servizio dell''uomo. La vera rivoluzione della robotica, la scienza che si occupa della costruzione di macchine dotate di capacità di movimento, percezione e cognizione, è rappresentata dall'' avvento di una nuova branca della robotica che guarda alla Natura come modello da imitare e riprodurre: la robotica bioispirata. Ne parliamo con Barbara Mazzolai, Direttrice del Centro di Micro-BioRobotica dell''Istituto Italiano di Tecnologia di Pontedera, e con il designer Lorenzo Frangi del Polihub di Milano, che insieme al suo team ha sviluppato un robot per ''fresatura 4.0'', la prima macchina autonoma e portatile per operazioni su grandi aree. Con Anna Pancaldi il viaggio nell'' universo della robotica si addentra nella storia degli automi, senza dimenticare la curiosa storia della parola ''robot''. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
