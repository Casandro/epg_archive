  description: 'ta del mondo che ci circonda e delle sue regole. Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l''astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo della ceramica.Molti oggetti che utilizziamo nella nostra vita quotidiana possiedono componenti, magari invisibili a occhio nudo, di natura ceramica. Oggi infatti sentiamo sempre più parlare di ceramica tecnica, cioè di materiali ceramici avanzati: un mondo destinato ad assumere un ruolo sempre più rilevante per lo sviluppo di soluzioni e innovazioni nell''universo industriale: dall''elettronica all'' energia, passando per la domotica e la meccatronica. Ma non solo. Ne parliamo con Anna Tampieri, Direttore dell''Istituto di Scienza e Tecnologia dei Materiali Ceramici del CNR di Faenza, e con Giovanni Baldi, Direttore di un Centro Ricerche dei materiali ceramici avanzati in Toscana, entriamo nei laboratori industriali alla scoperta di un''altra frontiera della ricerca nel campo dei materiali: la ceramica industriale per la salute dell''ambiente. La ceramica è anche in grado di narrarci l''esistenza dell''uomo. La sua storia, infatti, parte da molto lontano: ce la racconta Anna Pancaldi con un viaggio che comincia dodicimila anni fa e arriva fino alla vita di Johann Friedrich B ttger, passato alla Storia come ''l''alchimista che ha scoperto il segreto della porcellana cinese''. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
