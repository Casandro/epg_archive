  title: ARD Konzert
  subtitle: 'Ray Chen und Katharina Wincor beim Schleswig-Holstein Musik Festival   '
  description: "Als Ray Chen beim Eröffnungskonzert 2025 spontan für die erkrankte Solistin einsprang, erspielte er sich stürmischen Applaus. Nun ist er erneut zu Gast beim Schleswig-Holstein Musik Festival, diesmal an der Seite des Festivalorchesters unter der Leitung von Katharina Wincor. Gemeinsam reisen sie durch nordische Klanglandschaften, von Finnland - mit Sibelius' Violinkonzert - nach Schweden, wo Britta Byström, die Komponistin des \"Walk to Beethoven\", lebt. Virtuosität und Spielfreude sind garantiert, wenn das Orchester mit Zoltán Kodály \"Tänzen aus Galánta\" den Abend beschließt.\n\nLudwig van Beethoven\nOuvertüre zu \"Coriolan\" op. 62\n\nJean Sibelius\nViolinkonzert d-Moll op. 47\n\nBritta Byström\nWalk to Beethoven\n\nZoltán Kodály\nTänze aus Galánta\n \nRay Chen, Violine \nSchleswig-Holstein Festivalorchester\nKatharina Wincor, Dirigentin\n \nAufzeichnung vom 2. August 2026 im Messe & Congress Centrum in Husum"
