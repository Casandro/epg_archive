  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Tunichtgut und Gefreiter
  description: Die Dokumentation beleuchtet die frühen Jahre Adolf Hitlers, seine Entwicklung vom gescheiterten Künstler zum radikalen Politiker und Aufstieg zum Führer der NSDAP. Die Dokumentation zeigt die gesellschaftlichen Umstände, die seinen Aufstieg begünstigten, und die verheerenden Folgen, die sein Weg für Deutschland und die Welt hatte. Ein intensiver Blick auf die Ursprünge eines der dunkelsten Kapitel der Geschichte.
  widescreen: true
- eventId: 1110273
  start: 2026-09-28T22:20:00Z
  stop: 2026-09-28T23:25:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Revolutionär und Ideologe
  description: Der zweite Teil der Dokureihe beleuchtet den Aufstieg Adolf Hitlers und den Weg in den Zweiten Weltkrieg. Die Dokumentation zeigt, wie politische Manipulation und Propaganda zur Machtergreifung führten und wie Hitlers Ideologie die Welt in den Abgrund zog. Historische Aufnahmen und Expertenanalysen bieten einen tiefen Einblick in die Geschehnisse, die Europa veränderten.
  widescreen: true
- eventId: 1110274
  start: 2026-09-28T23:25:00Z
  stop: 2026-09-29T00:35:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Parteiführer und Volksredner
  description: Der Aufstieg Adolf Hitlers zum Diktator wird beleuchtet. Von der Machtübernahme 1933 bis zu den ersten Jahren des NS-Regimes zeichnet der Film die verhängnisvolle Entwicklung nach. Gezeigt wird, wie Hitlers Ideologie und politische Entscheidungen Deutschland und die Welt in die Katastrophe des Zweiten Weltkriegs führten. Interviews und historische Aufnahmen geben einen tiefen Einblick in diese düstere Zeit.
  widescreen: true
