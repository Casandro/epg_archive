  title: Tiere vor der Kamera - Singende Vögel
  description: 'In den 70er Jahren starteten Ernst Arendt und Hans Schweiger ein ehrgeiziges Projekt: Sie wollten die bekanntesten heimischen Vögel in bester Bild- und Tonqualität präsentieren. Trotz der damaligen technischen Herausforderungen gelang es ihnen nach zwei Jahren harter Arbeit, die richtigen Geräte zu finden und improvisieren, um den Gesang ihrer gefiederten Stars authentisch einzufangen.'
  widescreen: true
- eventId: 1110227
  start: 2026-09-28T15:20:00Z
  stop: 2026-09-28T16:30:00Z
  title: Tiere vor der Kamera - Die Geier der spanischen Sierra
  description: Arendt und Schweiger zeigen in "Tiere vor der Kamera" das wahre Verhalten von Gänsegeiern. Ihre Expedition führt sie von den Alpen bis nach Südspanien, wo sie das Privatleben der Geier in felsigen Klüften festhalten. Geier sind liebevolle Eltern, die sogar Schatten spenden. Interessant ist ihr Verhalten bei der Nahrungsaufnahme, ohne feste Rangordnung. Ihr majestätischer Flug über die weite Landschaft Südspaniens ist von berückender Schönheit.
