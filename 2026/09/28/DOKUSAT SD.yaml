  title: Schwere Lasten
  subtitle: M.O.S.E. - Venedigs Rettung vor dem Untergang?
  description: |-
    Venedig steht das Wasser bis Hals - wie schützt man Stadt und Tourismus vor dem Untergang?
    Um Venedig vor dem Untergang zu bewahren, wurde beinahe vierzig Jahre lang an einem gigantischen Sperrwerk im Meer gearbeitet. Im Meer vor der Stadt ist es inzwischen seit 2020, und bis auf einen Ausfall, erfolgreich in Betrieb. Wir blicken zurück auf die Entstehung dieses maritimen Meisterwerks der Ingenieurskunst und zeigen, wie die Flutbarriere vor Venedig funktioniert.
