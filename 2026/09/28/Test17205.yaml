  title: Signes
  description: 'Découvrir Genève en langue des signes La ville de Genève se dote désormais de visites guidées en langue des signes. Grâce à un projet original initié par Genève Tourisme et l''association S-5 qui proposent depuis peu des visites guidées inversées : pendant qu''une personne sourde guide en langue des signes, un interprète la traduit en français ou en anglais à l''intention du public entendant. Pour la première visite du genre, Giovanni Palama, un des guides récemment formés, emmène son public à la découverte des sourds qui ont marqué Genève. (Suisse Romande-2025)  "Langue des signes"'
