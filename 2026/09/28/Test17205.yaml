  description: basik 2026 - Signé basik explore et explique l'économie. Modes de vie, pouvoir d'achat, rapport à l'argent... Salarié ou patron, accro au boulot ou adepte du temps partiel, basik raconte les romand.e.s qui façonnent l'économie et cherchent des solutions face aux défis sociétaux et environnementaux. Chaque lundi, la rédaction investit les rues, les usines et les commerces. Avec un grand reportage, un feuilleton, une interview et une chronique un peu décalée, jamais l'économie n'a été aussi proche de vous !  "Langue des signes"
