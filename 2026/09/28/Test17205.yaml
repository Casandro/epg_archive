  title: Ramdam
  description: 'Silence on tourne Quand on danse,les corps tournent, s''élèvent et dessinent un espace entre terre et ciel. On vous propose une immersion dans l''art de filmer la danse : comment saisir l''élan, le souffle et la présence des corps en mouvement? À travers un film, l''émission interroge la capacité du cinéma à rendre visible ce qui se joue dans l''expérience intime du geste dansé.'
