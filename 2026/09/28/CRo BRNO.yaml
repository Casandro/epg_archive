  title: Sváteční premiéra nových nahrávek BROLNu
  description: V březnu tohoto roku vznikly v brněnském studiu Českého rozhlasu zbrusu nové nahrávky Brněnského rozhlasového orchestru lidových nástrojů. Toto těleso už od svého založení v roce 1952 staví svůj repertoár především na interpretační preciznosti všech svých členů a také na výjimečných pěveckých talentech z regionů. Stejně tak je tomu doposud. V nových nahrávkách si s BROLNem, tedy rezidenčním orchestrem Českého rozhlasu, zazpívali například Kamila Tomšejová, Alexandra Pokorná, Michal Janošek, Aleš Smutný či Ondřej Kocourek. Sváteční hudební hodinka s lidovou muzikou bude doplněna nahrávkami nejlepších mladých zpěváků z letošního finále soutěže Děti a píseň. Studiové snímky vznikly v hudební režii Martina Zemana za spolupráce mistra zvuku Michala Zelinky. Brněnský rozhlasový orchestr lidových nástrojů hraje pod vedením Petra Varmuži.
