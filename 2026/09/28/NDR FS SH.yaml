  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hermanns Begeisterung hält sich in Grenzen, als plötzlich Frau Markhardt-Siegel in der Fallerschen Küche steht. Sie hat unglaubliche Nachrichten für den Altbürgermeister: Im Heimatmuseum steht ein verkanntes Objekt von unschätzbarem Wert. Während Frau Markhardt-Siegel schier atemlos von ihrer Entdeckung berichtet, bleibt Hermann relativ emotionslos ob dieser Verkündung. Sollte Frau Markhardt-Siegel allerdings Recht haben, wäre nicht nur Schönwald, sondern auch Hermann Faller schlagartig berühmt.'
