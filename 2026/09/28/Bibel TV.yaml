  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Geboren in Polen und aufgewachsen in Augsburg war der Weg zum Priestertum für Matthäus Hilus, der heute als Hochschulseelsorger tätig ist, alles andere als geradlinig. Eine geistliche Heimat fand er schließlich in der Gemeinschaft des Neokatechumenalen Wegs. Besonders faszinieren ihn an dieser Spiritualität die internationale Ausrichtung und das ausgeprägte missionarische Selbstverständnis, die er auch in seiner jetzigen Funktion zu leben versucht.'
