  title: Ein Hauch von Himmel
  subtitle: Die Stimme des Neides
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Was für einen Sinn hat es, ein Engel zu sein, wenn man nicht wie einer singen kann, fragt sich Monica. Seit Jahren träumt sie davon, eine wunderbare Singstimme zu haben und hat Gott zahllose Male darum gebeten. Wie erschüttert ist sie, als sie bei einer Konzertprobe in der Carnegie Hall plötzlich die Stimme ihrer Träume hört und feststellen muss, dass sie einer ungezogenen Göre gehört: Die 13-jährige Alice (Charlotte Church) kaut beim Singen Kaugummi, ist sehr unhöflich und weiß die Musik überhaupt nicht zu schätzen. Warum hat Gott ausgerechnet diesem Mädchen so eine besondere Gabe verliehen? Zu allem Überfluss stellt sich Alice auch noch als Monicas neuer Auftrag heraus, doch Monica weigert sich, ihr zu helfen. Zu groß ist ihr eigener Schmerz. Erst bei einem unfreiwilligen Gefängnisaufenthalt macht Monica eine Erfahrung, die ihr eine neue Sicht auf die Dinge gibt. - Mit einem Gastauftritt der Band NSYNC als Straßenmusiker.'
