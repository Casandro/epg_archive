  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND In einer lauten und von Reizen überfluteten Welt stellt sich die Frage neu: Spricht Gott heute überhaupt noch - und wenn ja, wie? Im Gespräch mit der Theologin Margarete Eirich geht es um die verschiedenen Weisen, wie Gott zum Menschen spricht - in der Heiligen Schrift, im Gewissen und im Alltag. Zugleich wird deutlich, was das Hören auf Gott oft erschwert und wie es neu eingeübt werden kann. Eine Einladung, Gottes Stimme im eigenen Leben bewusster wahrzunehmen.'
