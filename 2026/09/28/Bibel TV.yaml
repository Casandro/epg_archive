  title: Weltbeweger
  subtitle: Veränderung - Um die Welt zu verändern
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Auf Gran Canaria im GoGlobal Jüngerschaftszentrum "Cambio" durchlaufen junge Menschen aus Spanien und Deutschland gemeinsam eine persönliche Wachstumszeit. Mitarbeitende und Teilnehmende erzählen von ihren Erlebnissen, von einer Lovestory, vom eigenen Café-Projekt bis hin zur Taufe im Meer. Sie sehen sich mit den sozialen Hausforderungen der Canarios sowie den beiden aufeinandertreffenden Kulturen konfrontiert. Hier lernen junge Christen mit Hoffnung und Hingabe Nachfolge zu leben und entdecken Gottes Berufung für sich.'
