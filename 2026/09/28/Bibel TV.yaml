  title: Ein Engel auf Erden
  subtitle: Das Lied vom kleinen Glück
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Auf ihrer Reise durchs Land treffen Engel Jonathan und Mark das junge Mädchen Sarah. Sie würde gern Countrysängerin werden wie ihre Mutter, die bereits verstorben ist. Zumindest nach Aussage ihres Vaters. In einer etwas fragwürdigen Kneipe will Sarah nun gegen den Willen ihres Vaters bei einem Talentwettbewerb ihrem Traum, Sängerin zu werden, ein Stückchen näher kommen. Hier trifft sie auf die Sängerin Patsy Maynard, mit der sie mehr zu verbinden scheint als nur die Liebe zur Musik. Für Jonathan und Mark gibt es also in der Bar richtig viel zu tun. Denn neben Sarah und Patsy gibt es noch einige Menschen, denen sie in dieser Bar helfen möchten.'
