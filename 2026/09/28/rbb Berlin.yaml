  title: rbb24 Reportage
  subtitle: Berlins Trinkwasser - wie sicher ist unsere Versorgung?
  episodeUri: crid://onid-8468/e/6a862a60360187e23a49a40b
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Sauberes Trinkwasser aus dem Hahn: Darauf vertrauen Millionen Menschen in Berlin. Das Leitungswasser ist eines der am besten kontrollierten Lebensmittel - heißt es. Doch ist das wirklich so? Medikamentenrückstände, PFAS und andere Stoffgruppen belasten zunehmend das Wasser.
    Die Reportage erzählt von einem System, das zuverlässig funktioniert - aber zunehmend an seine Grenzen stößt: Wie steht es um die Qualität des Berliner Trinkwassers und wie zukunftsfähig ist das bestehende System?
