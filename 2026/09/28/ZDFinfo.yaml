  description: |-
    Großbritannien 2025
    In der goldenen Ära des Orient-Express konnten Reisende mit nur einem Ticket von London bis nach Istanbul reisen. Die erste Etappe führte von London an die Südküste Englands.

    Zubringerzüge brachten die feine Gesellschaft bis an den Hafen. Danach ging es mit der Fähre nach Frankreich - wo eine Nacht in der damals aufregendsten Metropole der Welt auf die Passagiere wartete.
