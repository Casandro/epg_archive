  description: |-
    Großbritannien 2025
    Die nächste Etappe der Reise führte von Paris nach Salzburg. Der Film erzählt vom Glanz und den Abgründen des Orient-Express: Luxusdesign, Automobilvisionen und Europas dunkelstem Kapitel.

    Von Pforzheim ging es über Stuttgart und München bis nach Salzburg. Der Orient-Express wurde zum Spiegel einer Epoche. Er prägte die Schmuckindustrie, inspirierte das Design deutscher Automobile und wurde als politisches Symbol instrumentalisiert und bekämpft.
