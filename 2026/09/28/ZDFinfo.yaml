    Auf den Spuren des Orient-Express von München über Wien bis nach Budapest: Diese Etappe vereint Ingenieurskunst und politische Geschichte - ein Zug als Spiegel Europas in Krisenzeiten.

    Der Orient-Express machte Station in Wien. Dort traf kaiserlicher Glanz auf politische Umbrüche: Sigmund Freud flüchtete 1938 mit dem Zug ins Exil. In Ungarn wurde die Route 1931 Schauplatz eines Attentates mit 22 Toten.
