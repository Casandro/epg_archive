- eventId: 621008
  start: 2026-09-28T16:00:00Z
  stop: 2026-09-28T17:00:00Z
  title: Gesprächszeit
  subtitle: mit Christine Gorny
  description: Kunsthistoriker und Kurator Nils Ohlsen hat an der Kunsthalle Emden gearbeitet, bevor es ihn ins Land der Fjorde verschlagen hat. In Norwegen hat der gebürtige Oldenburger am Nationalmuseum in Oslo gearbeitet und zuletzt das Kunstmuseum in Lillehammer geleitet. Die Natur und Landschaft im hohen Norden hat ihn auch selbst zu Aquarell-Kunstwerken inspiriert. Auf Touren mit dem See-Kajak am Nordkap hat er gerade erst Papageientaucher und Orca-Gruppen beim Jagen erlebt.
