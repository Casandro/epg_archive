  title: Rockle
  description: Září je plné zajímavých novinek, mnohdy albových. K mání už je nové LP Vypsané fixy Ideál, která k ní rozjela turné a staví se i v Olomouci, což platí také o skupině Laura a její tygři a novince Most. Jako víno zraje Kvietah, deska Rozkousanej svět je zase o kus dál a určitě u nás dostane i větší prostor. Svůj debut oprášila frontwoman skupiny Skyline Natálie Míšová alias Cindy Marso a přihodila chytlavou novinku Yeah Yeah. Poslouchejte ve sváteční pondělí Rockli plnou novinek. Moderuje Jiří Matějů.
