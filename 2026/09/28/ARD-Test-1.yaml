  description: Nahe einem Weiher entdecken Hubert und Girwidz einen nackten Toten im Kofferraum eines Wagens. Ätherische Öle am Körper der Leiche führen zum Wellness- und Biohotel "Im Einklang". Tatsächlich hatte der Tote am Vortag in dem Hotel des Ehepaars Sonner eingecheckt, reiste aber bereits in der Nacht wieder ab. Die Gründe dafür bleiben ein Rätsel, dafür aber weiß das Zimmermädchen von einem heftigen Streit zu berichten, den der Ermordete mit einem anderen Gast hatte.
