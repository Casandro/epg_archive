  title: Tele-Gym (1/8)
  subtitle: Starker Rücken
  genre:
  - '144'
  subtitled: true
  description: "Rückenschmerzen sind die Zivilisationskrankheit Nummer Eins. Die beste Therapie besteht in der aktiven Vorbeugung durch gezieltes Training! Um den Rücken komplett zu trainieren braucht der Übende allerdings von Zeit zu Zeit neue Herausforderungen. Johanna Fellner zeigt effektive Trainingseinheiten für einen starken und gesunden Rücken. \n\nBeugende, streckende und rotierende Bewegungen sowie statische Ganzkörperpositionen und Balanceübungen ergeben ein optimales Gesamtpaket. Der Zuschauer lernt die Positionen sicher auszuführen und die Atmung sinnvoll zu integrieren."
