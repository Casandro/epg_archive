  title: Alle sollen eins sein - 6. Staffel
  subtitle: Das tragische Paradoxon von Pater Leonhard Roth - Teil 2
  description: |-
    Im Gespräch mit Moderator Nick Gorjachlin zeichnet der Theologe, Philosoph und Historiker Norbert Göttler das eindrucksvolle Lebensbild von Pater Leonhard Roth nach - katholischer Priester und Häftling im KZ Dachau.

    Roth blieb als einziger ehemaliger Gefangener bis 1960 am Ort des Lagers. Dort diente der Pallottinerpater nach Kriegsende ausgerechnet jenen, die an diesen Ort zurückkehrten: früheren Aufsehern, Vertriebenen aus dem Osten und Arbeitern beim Wiederaufbau. Sein Leben steht für ein radikales christliches Zeugnis der Versöhnung - jenseits von Feindbildern und Grenzen.
  widescreen: true
- eventId: 1110258
  start: 2026-09-28T18:15:00Z
  stop: 2026-09-28T18:30:00Z
  title: Himmel, Herz & Hirn
  subtitle: Darf ich als Christ reich sein?
  description: 'Die Armen werden in der Bibel selig gepriesen und Jesus fordert dazu auf, das zweite Hemd abzugeben. Da stellt sich die Frage: Wie sollen Christen eigentlich mit Geld umgehen? Ist sparen erlaubt? Und investieren?'
  widescreen: true
- eventId: 1110259
  start: 2026-09-28T18:30:00Z
  stop: 2026-09-28T19:00:00Z
  title: Von Herzen mit Mutter Angelica - Staffel II
  subtitle: Gefühle, Gebete und der Tod
  description: 'In dieser Katechese spricht Mutter Angelika über die Notwendigkeit des Gebets und warum wir meist dann beten, wenn wir ein Problem haben. Und das ist das Gebet des Kummers. Warum aber nicht einfach ganz ruhig Jesus in der Anbetung betrachten? Kontemplation ist einfach dazusitzen und zu sagen: Herr, hier bin ich. Ich liebe Dich. Und das ist ganz einfach. Und in der Stille hört man dann die Präsenz Gottes. Diese Stille seiner Präsenz ist Liebe. Das zweite große Thema der Sendung ist der Tod. Wie bereiten wir uns darauf vor? Und wie werden wir sterben Was erwartet uns dann nach dem Tod?'
  widescreen: true
