  description: 'Hl. Martín de Porres: Der demütige Heilige mit dem Besen, geboren im 16. Jahrhundert in Lima, Peru, als Sohn einer Sklaventochter und eines Edelmanns, erhält die Gabe, Menschen zu heilen. Unbeirrt von Vorurteilen und Erniedrigungen geht er seinen Weg ins Kloster und zu den Kranken. Noch heute wird er besonders von den ''Kleinen'' geliebt und verehrt. / Sel. Charles de Foucauld: Lebemann, Soldat, Abenteurer, gefeierter Forscher, Priester, Mönch und Eremit - der Heilige der Wüste, dessen Traum sich erst nach seinem Tod in Gemeinschaften auf der ganzen Welt verwirklichen sollte.'
