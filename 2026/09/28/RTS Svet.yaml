  description: 'Živimo u kolotečini svoje svakodnevice. Melju nas ordinarne, repetitivne aktivnosti usled kojih susrete ne doživimo onako kako bi bilo korisno, i potrebno - kao mogućnost da nešto spoznamo. Ovakve prilike mašimo čak i u slučaju kada nam budu, nekom prilikom, dostupni neki pametni, životno i profesionalno ostvareni likovi. Ne postavimo prava pitanja. Nestrpljivi smo da saslušamo odgovor. A ko bi još otćutao, i dao sebi komocije da ga na pravi način razume? Mi smo ih zato pozvali. Ne po bilo kakvim drugim kriterijumima, osim po proceni da će iskreno i argumentovano obrazlagati svoje stavove. Pa su tako sledile opservacije na varijaciju prustovskog upitnika, širokog spektra, od recimo Kako ste? preko: Treba li roditelj detetu biti drug? Kako se uči kako da se uči? U kojim situacijama lažete? Može li ružno da bude lepo? Kako prevazilazite stid? Šta vas prosto izbezumljuje? Mogu li manje inteligentniji da budu duhoviti? Vredi li zbilja Ronaldo toliko miliona? do duboko filozofskog Gde se...'
