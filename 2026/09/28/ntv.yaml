  title: Anwälte der Toten - Im Kopf des Mörders
  subtitle: Heriberto Seda
  description: 1989 erreicht die New Yorker Polizei ein Brief, in dem jemand behauptet, der ZODIAC-Killer aus San Francisco zu sein und nun in New York zu morden. Die Polizei steht vor einem Rätsel, bis die Briefe des Killers ihn verraten.
  genre:
