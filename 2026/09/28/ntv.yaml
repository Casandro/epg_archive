  stop: 2026-09-28T03:35:00Z
  title: Anwälte der Toten - Verbrechen, die Deutschland bewegten
  subtitle: In einem kleinen Ort wird ein Mädchen erdrosselt
  description: In einem Ort an der Nordsee wird ein zwölfjähriges Mädchen erdrosselt. Die Dorfbewohner stehen unter Schock - der Täter ist einer von ihnen. Fünf Rentner entführen ihren Anlageberater, um an der Börse verlorenes Geld zurückzubekommen,
