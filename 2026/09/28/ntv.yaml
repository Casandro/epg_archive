- eventId: 1090405
  start: 2026-09-28T01:25:00Z
  stop: 2026-09-28T02:10:00Z
  title: Anwälte der Toten - Im Kopf des Mörders
  subtitle: Diane Downs
  description: Diane Downs ist verliebt, doch ihr Traummann will keine Verantwortung für ihre drei Kinder (8, 7 und 3) übernehmen. Im Mai 1983 fährt Downs mit den Kindern an einen abgelegenen Ort, hält am Straßenrand und schießt auf die drei.
  genre:
  - '129'
- eventId: 1090406
  start: 2026-09-28T02:10:00Z
  stop: 2026-09-28T02:50:00Z
  title: Anwälte der Toten - Im Kopf des Mörders
  subtitle: Karol Kot
  description: Der polnische Schüler Karol Kot wurde als "Vampir von Krakau" bekannt. Mit 19 ersticht Kot zwei Menschen, eine 86 Jahre alte Frau und einen 11-jährigen Jungen. Karol wird zum Tode verurteilt und am 16. Mai 1968 gehängt.
  genre:
  - '129'
