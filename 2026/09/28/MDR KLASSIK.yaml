  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Richard Wagner: "Lohengrin", Vorspiel (Brandenburgisches Staatsorchester Frankfurt; Orchester der Philharmonie Zielona Góra: Czeslaw Grabowski); Frédéric Chopin: Klavierkonzert Nr. 2 f-Moll (Nikolai Tokarew, Klavier; Deutsches Symphonie-Orchester Berlin: Tugan Sokhiev); Franz Schubert: "Große C-Dur-Sinfonie", D 944 (Berliner Philharmoniker: Semyon Bychkov); Robert Schumann: "Abegg-Variationen", op. 1 (Volker Banfield, Klavier); Gustav Mahler: Symphonisches Präludium (Rundfunk-Sinfonieorchester Berlin: Vladimir Jurowski)

    2.03  Das ARD-Nachtkonzert (II)

    Joseph Haydn: Sinfonie Nr. 6 D-Dur - "Le matin" (Münchner Rundfunkorchester: Christoph Poppen); Henriette Renie: Harfenkonzert c-Moll (Emmanuel Ceysson, Harfe; Orchestre régional Avignon-Provence: Samuel Jean); Maurice Ravel: "Gaspard de la nuit" (Florian Uhlig, Klavier); Hector Berlioz: "La mort de Cléopâtre" (Urszula Kryger, Sopran; hr-Sinfonieorchester: Eiji Oue); Jean-Philippe Rameau: "Dardanus", Suite (Orchestra of the 18th Century: Frans Brüggen)

    4.03  Das ARD-Nachtkonzert (III)

    Edward Elgar: "The Wand of Youth", Suite Nr. 1 (Orchestra of the Welsh National Opera: Charles Mackerras); Alexander von Zemlinsky: Vier Balladen (Silke Avenhaus, Klavier); Jean Françaix: "15 portraits d'enfants d'Auguste Renoir" (Orchestre de Chambre National de Toulouse: Alain Moglia)

    5.03  Das ARD-Nachtkonzert (IV)

    Johann Gottlieb Graun: Violinkonzert d-Moll, Allegro (Ilja Korol, Violine; Wiener Akademie: Martin Haselböck); Antonín Dvorák: Legende As-Dur, op. 59 (WDR Sinfonieorchester: Cristian Macelaru); Emilie Mayer: Klavierkonzert B-Dur, Allegro (Ewa Kupiec, Klavier; Neubrandenburger Philharmonie: Sebastian Tewinkel); Georg Philipp Telemann: Konzert e-Moll (Ensemble Amarillis); Marcel Grandjany: Fantaisie über ein Thema von Haydn, op. 31 (Xavier de Maistre, Harfe); Joseph Haydn: Sinfonie Nr. 47 G-Dur, Finale (Il Giardino Armonico: Giovanni Antonini)
