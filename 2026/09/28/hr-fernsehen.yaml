  start: 2026-09-28T03:30:00Z
  stop: 2026-09-28T03:55:00Z
  title: Story Time
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Amelie ist 15 Jahre alt und seit fast zwei Jahren nicht mehr in der Schule. Der Gedanke an ein Klassenzimmer reicht aus, um Panik auszulösen. Was mit Mobbing begann, hat sich zu einer Angststörung mit regelmäßigen Panikattacken entwickelt. Während andere Jugendliche ihren Alltag leben, kämpft Amelie jeden Tag mit sich selbst. Trotzdem hat sie einen klaren Wunsch: Nach den Sommerferien will sie zurück in die Schule.'
- eventId:
