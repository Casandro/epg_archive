  title: Giraffe, Erdmännchen & Co. (329)
  subtitle: Ende gut, alles gut!
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Ein wunderbarer Tag beginnt für das neue Zebrafohlen Lucia im Kronberger Opel-Zoo. Endlich darf es aus dem Stall und zum allerersten Mal auf die große Afrika-Savanne. Ein Stückchen weiter gibt es glückliche Gesichter beim Pflegerteam der Pinguin-Anlage: Es gibt Nachwuchs. Die Pinguinpaare bauen Bruthöhlen, und schon bald können sich die Besucher auf süße Mini-Pinguine freuen. Auch im Frankfurter Zoo läuft alles bestens: Eddy heißt das Tamandua-Baby, bei dem Pflegerin Astrid Parys einen Besuch macht. Und auch bei Flash, dem Faultier-Kind, schaut sie vorbei.'
