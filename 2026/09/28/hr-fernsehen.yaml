  start: 2026-09-28T01:50:00Z
  stop: 2026-09-28T02:40:00Z
  title: Tierärztin Dr. Mertens (29)
  subtitle: Alt und Jung
  ageRating: 6
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Susanne und Christoph sind sich einig: Sie wollen heiraten. Nur in Bezug auf die Ausrichtung haben die beiden ganz unterschiedliche Vorstellungen. Christoph wünscht sich eine Feier im kleinen Kreis, während Susanne von einer Märchenhochzeit träumt. Auch bei Georg und Charlotte Baumgart kommt es zu Differenzen: Charlotte blüht auf, denn sie kümmert sich unter anderem fürsorglich um eines ihrer männlichen Aktmodelle - sehr zum Leidwesen von Ehemann Georg. Er ist eifersüchtig und leidet darunter, dass seine Frau häufig nicht daheim ist. Bis ihn seine Nachbarin Frau Marschke in Anspruch nimmt.'
- eventId:
