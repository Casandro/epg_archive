  description: Ein Erbschaftsstreit sorgt für Unruhe bei dem krisenerprobten Mutter-Tochter-Duo. Bei einer offenen Rechnung von Tante Claudia geht es nicht nur um Geld, Recht und Gerechtigkeit, sondern auch um eine weit zurückliegende Schuld, der sich Pensionswirtin Heidi stellen muss.
- eventId:
