  title: Unter unserem Himmel
  subtitle: Südtiroler Kellergeheimnisse
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im Südtiroler Unterland, in der Gegend rund um Kurtatsch, geht es um die Geschichten rund um die Südtiroler Keller. Versteckt, inmitten der Weinberge, liegt der Auhof. Hier reift nicht Wein, sondern Essig. Hans Peter Widmann hat viel Erfahrung darin, wie bester Essig gemacht wird.
    Nicht weit davon, im Weingut von Baron Widmann im Zentrum von Kurtatsch, wird der neue Wein in Flaschen gefüllt. Am Ortsrand von Kurtatsch wohnt Alfred Mayr. Schon die Zufahrt unter den Weinreben hindurch verrät, was er im Keller lagert.
