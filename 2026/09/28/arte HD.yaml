  stop: 2026-09-28T04:55:00Z
  title: GEO Reportage
  subtitle: Chartres, die Farben des Himmels
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Weniger als 100 Kilometer südwestlich von Paris, inmitten der großen Ebene von Beauce, bekannt als die "Kornkammer" Frankreichs, ist die Kathedrale Notre-Dame de Chartres weithin sichtbar. Der Bildhauer Auguste Rodin nannte sie die "Akropolis von Frankreich". Auch die kunstvollen Glasmalereien der Kathedrale beeindrucken Besucher seit jeher. Im Schatten des Riesenbaus beherbergt die Gegend noch immer Werkstätten für Glasmalereien. Die "Maison Lorin" ist eine der letzten aus dem 19. Jahrhundert, die heute noch in Betrieb sind. Sie wird von Elodie Vally geführt, einer Meisterin ihres Fachs.
