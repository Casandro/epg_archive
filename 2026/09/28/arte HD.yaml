  audiodesc: true
  description: Noch vor wenigen Jahren waren Esel in Montenegro akut vom Aussterben bedroht. Dass es die einst auf dem Balkan zahlreichen, treuen Helfer der Bauern noch immer im Land gibt, ist vor allem Darko Saveljic zu verdanken. 2015 rettete der Biologe die erste Eselstute; die Besitzer hielten sie unter elenden Verhältnissen.
- eventId: 568557
