  title: Neros Stadt der Lüste
  subtitle: Deutschland 2017
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im Golf von Neapel befindet sich die erste "Wellness-Oase" der Weltgeschichte: die Stadt Baiae. Römische Kaiser wie Nero und Claudius haben dort mit den Reichsten der Reichen ihrer Zeit geschlemmt und zügellose Orgien gefeiert. Nero hat dort sogar seine Mutter Agrippina ermordet. Unterwasserarchäologen erforschen intensiv die einstige Stadt des Luxus und des Lasters.'
- eventId: 568447
