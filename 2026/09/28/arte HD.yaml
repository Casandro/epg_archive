  title: Neros Stadt der Lüste
  subtitle: Deutschland 2017
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im Golf von Neapel befindet sich die erste "Wellness-Oase" der Weltgeschichte: die Stadt Baiae. Römische Kaiser wie Nero und Claudius haben dort mit den Reichsten der Reichen ihrer Zeit geschlemmt und zügellose Orgien gefeiert. Nero hat dort sogar seine Mutter Agrippina ermordet. Unterwasserarchäologen erforschen intensiv die einstige Stadt des Luxus und des Lasters.'
- eventId: 568447
  start: 2026-09-28T01:30:00Z
  stop: 2026-09-28T02:15:00Z
  title: Mit dem Zug entlang der irischen Ostküste
  subtitle: Deutschland 2022
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Lange Strände, spektakuläre Klippen, einsame Berge: Von Rosslare im Südosten über die Hauptstadt Dublin bis zur Halbinsel Howth führt die wohl schönste Zugstrecke der Republik Irland. Die Gegend wurde geprägt von Normannen, Wikingern und der bewegten Geschichte der Insel mit England.'
- eventId: 568448
  start: 2026-09-28T02:15:00Z
  stop: 2026-09-28T03:00:00Z
  title: Bist Du psychopathisch?
  subtitle: 42 - Die Antwort auf fast alles
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Wir kennen sie vor allem als Serienmörder aus Hollywoodfilmen - Psychopathen. Doch nur die wenigsten von ihnen morden tatsächlich, die meisten leben mitten unter uns. Ein bis zwei Prozent der Bevölkerung gelten als psychopathisch. Ist das gefährlich? Und woran erkennen wir sie überhaupt? \nDer amerikanische Neurowissenschaftler James Fallon stellte bei Hirnscans fest, dass die Hirnstruktur Psychopathen verrät. Der Kriminologe Martin Rettenberger beschäftigt sich mit den \"erfolgreichen\" Psychopathen, die ein ganz normales Leben führen."
- eventId: 568555
  start: 2026-09-28T03:00:00Z
  stop: 2026-09-28T03:25:00Z
  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Malaysia, Rawang
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vor ein paar Monaten hat Corentin seine bretonische Heimat verlassen. Nun sticht er zum zweiten Teil seiner Weltreise mit dem Katamaran "Nomade des mers" (deutsch: Nomade der Meere) in See - begleitet von Coline, einer Spezialistin für Kompostierung. Sie hat ein System ins Leben gerufen, bei dem Nahrungsabfälle von Restaurants eingesammelt, kompostiert und anschließend an die Gemüsebauern der Stadt verteilt werden: eine Kreislaufwirtschaft, die Bioabfälle wiederverwertet. In Malaysia entdecken Corentin und Coline eine sehr wirksame Methode, die Abfälle aufzubereiten: durch Fliegenlarven, die organische Stoffe zersetzen.'
