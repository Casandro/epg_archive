  title: Fuck the Planet (1/3)
  subtitle: Ist unser Klima noch zu retten?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In Jakarta zeigen sich die dramatischen Folgen des Klimawandels: Der steigende Meeresspiegel droht die Millionenmetropole auszulöschen. Dabei warnen Wissenschaftlerinnen und Wissenschaftler schon lange vor den Folgen der Erderwärmung. Doch die alarmierenden Erkenntnisse wurden oft in den Wind geschlagen - aus wirtschaftlichen, energiepolitischen und geopolitischen Interessen.'
- eventId: 568707
  start: 2026-09-28T07:45:00Z
  stop: 2026-09-28T08:30:00Z
  title: Fuck the Planet (2/3)
  subtitle: Ist unser Klima noch zu retten?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ende der 1970er Jahre bestätigte die Wissenschaft, dass eine Erderwärmung um etwa drei Grad wahrscheinlich ist. Mit dem Amtsantritt von US-Präsident Ronald Reagan bremsten wirtschaftliche Interessen die Klimapolitik jedoch zunächst aus. Erst durch eine Anhörung des Klimaforschers James Hansen vor dem US-Kongress 1988 wurde der Klimawandel zum politischen Thema.
- eventId: 568708
  start: 2026-09-28T08:30:00Z
  stop: 2026-09-28T09:25:00Z
  title: Fuck the Planet (3/3)
  subtitle: Ist unser Klima noch zu retten?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Nach den Warnungen des Klimaforschers James Hansen und der Gründung des Weltklimarats im Jahr 1988 fürchtete die fossile Energiewirtschaft um ihr Geschäftsmodell. Im Vorfeld des Umweltgipfels von Rio de Janeiro 1992, auf dem sich die Staaten zu einem gemeinsamen Vorgehen verpflichteten, gründeten führende Öl-, Kohle- und Energieunternehmen die Global Climate Coalition.
