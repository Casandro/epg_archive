  description: 'Nach drei Wochen auf hoher See erreicht der Katamaran "Nomade des Mers" endlich Brasilien. Sie legen in Recife im Norden des Landes an und quartieren sich für einige Tage im Öko-Schulungszentrum Serta ein. Hier werden einfache Lowtech-Lösungen für existenzielle Probleme wie den Zugang zu Wasser oder Energie angeboten. Der Garten des Zentrums ist eine wahre Lowtech-Fundgrube. Roberto Ferrera und andere Lehrer zeigen den dreien ihre selbst entworfenen Schätze: Solaröfen, Wasserpumpen, eine Obstdarre und sogar eine Biogasanlage, mit der aus Kuhfladen Gas und Biodünger gewonnen werden.'
