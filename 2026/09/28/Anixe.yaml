  description: Ein alter Bekannter kehrt zurück nach Dorf Ilm, Aufsichtsjäger Pfeiffer, den unsere Begräbnisweiber vor einigen Jahren wegen des Mordes an Frau Hofrat Dötschinger dingfest machen konnten, ist aus dem Gefängnis ausgebrochen und sinnt nach Rache. Und sein perfider Plan scheint aufzugehen, denn tatsächlich tappen nicht nur die Damen in seine Falle. Die können sich zwar selbständig aus ihrem Verlies befreien, doch ihre tapferen Helden kommen zu früh und so kann Pfeiffers grausames Spiel beginnen. Aber niemand hat mit dem tapferen Paulmichl und seiner jungen Kollegin Petra gerechnet.
