  title: RealTime
  subtitle: RealTime
  description: Sechs Monate Ski-Action. Viel Schnee. Wochenlanger Regen. Sonne. Wolken. Nebel. Blaue Himmel. Unnachgiebiger Beton. Unverfolgte Landungen. Niedriger Druck. Gib fünf. Dreifache Knicke. Doppelt zupacken. Zu viel Geschwindigkeit. Eine chronologische Darstellung der Prüfungen, Wirrungen und Triumphe der Jahre 2006 und 2007 genau so, wie sie sich ereigneten. Unter der Regie des preisgekrönten Filmemachers Josh Berman, fängt Realtime die Saison ein, während sie sich für eine Crew aus den größten Namen und den besten Nachwuchstalenten im Skisport abspielt. In einem Winter, der bisher seinesgleichen sucht. US 2007
