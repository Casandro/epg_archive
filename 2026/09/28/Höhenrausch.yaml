  description: Ken Roczen ist mit gerade mal 18 Jahren der jüngste Motocross-Weltmeister aller Zeiten. Nach einer beispiellosen Karriere in Deutschland ging er vor einem Jahr in die USA, um seinen Erfolg in der amerikanischen AMA SX Lites-Serie fortzusetzen. Doch ein Sturz, bei dem er sich das Handgelenk brach, legte seinen großen Traum erstmal auf Eis. Trotz Trainingsstress und Verletzungshandicap kehrt Ken jetzt für ein Rennen in seine alte Heimat in Thüringen zurück. DE 2013
