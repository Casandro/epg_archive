  title: Trails Across the Steppe
  subtitle: Trails Across the Steppe
  description: 'In diesem Film geht es um die Träume und Chancen junger mongolischer Langlaufsportler, um ihre Bemühungen, alle Hindernisse auf dem Weg zur Teilnahme an der weltweiten Gesellschaft des Profisports zu überwinden. Drei junge Mongolen träumen von einer internationalen Karriere als Langläufer. Ihr oberstes Ziel ist die Teilnahme an den Olympischen Spielen. Für Gerelt-Od (27 Jahre) scheint dieser Traum in greifbare Nähe zu geraten, aber entweder er oder sein bester Freund werden es sein. Die 11-jährige Oyunchimeg, das kleine Mädchen mit den schwarzen Zöpfen und dem breiten Lächeln, lebt noch immer mit ihrer Mutter in einer traditionellen Jurte - und ist die größte Hoffnung ihres Trainers. Usukhbayar (17 Jahre), der aus einer Familie von Viehzüchtern stammt, nahm bereits an den Olympischen Jugendspielen in Österreich teil, doch angesichts der schwierigen Zukunftsaussichten in der Mongolei ist er unsicher, ob er sich auf eine Karriere als Profisportler einlassen soll. Wir erfahren mehr über sie und ihre Familien, über die Rolle, die Aspekte wie Tierhaltung, nomadische Tradition und buddhistischer Glaube in ihrem Leben spielen. Mit atemberaubenden Landschaften und herzerwärmenden Menschen zeigt der Film, wo der olympische Traum seinen Anfang nimmt. Im Vergleich zur High-Tech-Welt des internationalen Sports mangelt es der Mongolei an Fachwissen, Material und Trainingsmöglichkeiten. Georg Zipfel, ehemaliger Olympiateilnehmer und deutscher Bundestrainer, versucht, diese Probleme anzugehen. Im Auftrag des Internationalen Skiverbandes und mit großer persönlicher Begeisterung hat er sich für den mongolischen Skisport eingesetzt. Offizielle Auswahl 2014: VIMFF, Banff Mountain Filmfestival, Internationales Dokumentarfilmfestival München und Filmfestival Kitzbühel. DE 2014'
