  title: Wild Ones - Junge Helden - Episode 2
  subtitle: Wild Ones - Junge Helden - Episode 2
  description: 'Auch wenn es für Ken Roczen bei der Motocross-WM in Teutschenthal um keinen wichtigen Titel geht: für den 18-Jährigen zählt immer nur der Sieg. Und dafür kämpft er um jeden Preis.Freerunner Jason Paul hat sich nach dem anstrengenden Videodreh einen "day off" zuhause in Frankfurt verdient. Zusammen mit Freundin Nadine und Kumpel Anan aus Thailand schaut er sich den ersten Rohschnitt des Videos an. Kitesurferin Susi Mai kommt schon seit 10 Jahren regelmäßig nach Hawaii - aber heute klettert sie zum ersten Mal gemeinsam mit Freunden auf den höchsten Berg Mauis. Auf dem Haleakala erlebt sie einen der spektakulärsten Sonnenaufgänge ihres Lebens. Bei Wakeboard-Weltmeister Dominik Gührs wird es privat: er zeigt uns sein Zuhause in München und lässt es anschließend auf dem Oktoberfest so richtig krachen. Freeskier Bene Mayr ist gespannt, wie sein neuester Film beim Festival-Publikum in Innsbruck ankommt. Anschließend wartet eine fette After-Show-Party mit DJ Harris auf die Jungs. DE 2013'
