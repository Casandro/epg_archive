  title: Niederdeutsches Hörspiel
  subtitle: Geheemnissen
  description: "Von Frank Grupe\nMusik: Bernd Keul\nRegie: Ilka Bartels\nRB/NDR 2021\n\nDie Bank in dem Park ist für die gerade verwitwete Sandra ein Ort der Erholung und des Innehaltens. Hier versucht sie, ihre Gedanken zu ordnen und das Geschehene zu verarbeiten. Zum Reden ist ihr nicht zumute, doch ihr Wunsch nach Ruhe wird von dem Pensionär Herbert durchkreuzt. Schließlich kann Sandra ihm nicht verbieten, sich zu ihr zu setzen.  \n \nWas anfangs wie eine zufällige Begegnung anmutet, entpuppt sich zusehends als Blick in das Seelenleben einer verzweifelten Frau, die ein unsagbares Geheimnis in sich trägt."
