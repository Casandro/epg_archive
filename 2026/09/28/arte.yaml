  title: Bist Du psychopathisch?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: "Wir kennen sie vor allem als Serienmörder aus Hollywoodfilmen - Psychopathen. Doch nur die wenigsten von ihnen morden tatsächlich, die meisten leben mitten unter uns. Ein bis zwei Prozent der Bevölkerung gelten als psychopathisch. Ist das gefährlich? Und woran erkennen wir sie überhaupt? \nDer amerikanische Neurowissenschaftler James Fallon stellte bei Hirnscans fest, dass die Hirnstruktur Psychopathen verrät. Der Kriminologe Martin Rettenberger beschäftigt sich mit den \"erfolgreichen\" Psychopathen, die ein ganz normales Leben führen."
