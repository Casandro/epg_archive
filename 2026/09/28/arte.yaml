  title: Mit dem Zug entlang der irischen Ostküste
  subtitle: Deutschland 2022
  subtitled: true
  description: 'Lange Strände, spektakuläre Klippen, einsame Berge: Von Rosslare im Südosten über die Hauptstadt Dublin bis zur Halbinsel Howth führt die wohl schönste Zugstrecke der Republik Irland. Die Gegend wurde geprägt von Normannen, Wikingern und der bewegten Geschichte der Insel mit England.'
