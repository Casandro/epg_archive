  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: Malaysia, Rawang
  description: 'Vor ein paar Monaten hat Corentin seine bretonische Heimat verlassen. Nun sticht er zum zweiten Teil seiner Weltreise mit dem Katamaran "Nomade des mers" (deutsch: Nomade der Meere) in See - begleitet von Coline, einer Spezialistin für Kompostierung. Sie hat ein System ins Leben gerufen, bei dem Nahrungsabfälle von Restaurants eingesammelt, kompostiert und anschließend an die Gemüsebauern der Stadt verteilt werden: eine Kreislaufwirtschaft, die Bioabfälle wiederverwertet. In Malaysia entdecken Corentin und Coline eine sehr wirksame Methode, die Abfälle aufzubereiten: durch Fliegenlarven, die organische Stoffe zersetzen.'
