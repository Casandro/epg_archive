  title: Radioporadna
  description: S mykoložkou Terezou Tejklovou se vydáme po stopách václavek, které dostaly jméno právě proto, že se vyskytují v lesích v době kolem svátku svatého Václava. Je to tak i letos? To zjistíme během procházky v lesích okolo Býště. A pokud václavky nenajdeme, určitě nebude nouze o jiné houby, které profesionálně určí známá mykoložka. Moderuje Jitka Slezáková.
