  title: 'Trolls World: Voll Vertrollt!'
  subtitle: Science fiction / Fantasy / Horror 2019, FSK 12
  description: '2019 ● FSK: 12 Zur Zeit des dunklen Mittelalters ergreift ein böser Troll Besitz von der Seele der Markgräfin von Baden. Mit ihrer Hilfe öffnet der Troll ein Tor zur Unterwelt und versucht, die Menschheit mit einer Armee von Trollen ins Verderben zu stürzen. Nur dank eines Zauberbanns kann er im letzten Moment aufgehalten werden und zu Stein verwandelt werden. Seit dem geriet die Geschichte in Vergessenheit, jedoch wird die Statue zufällig entdeckt und er wird zum Leben erweckt. Science fiction / Fantasy / Horror 2019, Regie: Eric Dean Hordes,  Mit: Eva Habermann, Helmut Krauss, Katy Karrenbauer, FSK 12'
