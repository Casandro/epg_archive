  title: Across the Tracks
  subtitle: Movie / Drama 1991
  description: '1991 ● TMS Rating: ★★★☆☆ Billy Maloney, ein jugendlicher Autoknacker, kehrt nach seiner Entlassung aus der Besserungsanstalt nach Hause zurück. Mit seinem älteren Bruder Joe geht er nun auf dieselbe High-School. Joe nutzt dort sein läuferisches Talent, um an ein Stipendium für die Universität zu gelangen. Er ist sehr beliebt und gilt als Star an der Schule, während Billy ein Außenseiter bleibt. Joe überredet Billy, der sich auch als laufbegabt herausstellt, sich ebenfalls in einer Laufgruppe anzumelden. Movie / Drama 1991, Regie: Sandy Tung,  Mit: Rick Schroder, Brad Pitt, David Anthony Marshall'
