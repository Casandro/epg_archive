  title: 'Teen Star Academy: Wir machen aus Dir einen Star!'
  subtitle: Comedy 2016
  description: '2016 ● FSK: 6 Die Teen Star Academy ist eine angesehene Schule für Musik, Tanz und Mode. Nur besonders talentierte und ehrgeizige Schüler erhalten die Möglichkeit, diese zu besuchen. Doch wenn sie es bis dahin geschafft haben, wird ihnen eine Karriere als Superstar versprochen. Am Ende wartet ein wichtiger Talentwettbewerb auf sie, den nur einer gewinnen kann. Bis dahin üben alle für das große Event. Dabei entstehen Freundschaften, doch es zerbrechen auch einige. Comedy 2016, Regie: Cristian Scardigno,  Mit: John Savage, Blanca Blanco, Bret Roberts'
