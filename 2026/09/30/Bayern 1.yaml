  title: Bayern 1 am Abend
  subtitle: Die 80er Show mit Jerry Gstöttner
  description: "Wir lieben die 80er.\nDeshalb entführen wir Sie an diesem Abend in unser Lieblingsjahrzehnt. Von Superstars wie Bryan Adams oder Depeche Mode, über One Hit Wonders wie Michael Sembello und Kajagoogoo bis zur Neuen Deutschen Welle. Dieser Abend ist so bunt, abwechslungsreich und zeitlos wie die 80er.\nWas sind Ihre 80er Favoriten? Verraten Sie es uns per Mail an studio@bayern1.de oder schicken Sie gerne eine Sprachnachricht aufs Studiohandy: 0151-19589000 (WhatsApp)\n\n21.00 / 22.00 \nNachrichten, Wetter\n22.55 Auf ein Wort *\n22.57 Bayern-, Deutschland- und Europahymne\n* Als Podcast verfügbar in der App ARD Sounds"
