  title: Izdvojeno
  subtitle: Religijski
  description: Što povezuje krakovsko Svetište Božjega milosrđa, trgove naših gradova i srce Marije Bistrice? Iz domovine svete Faustine Kowalske u Hrvatsku je stiglo važno priznanje - ,,Beati misericordes - Blago milosrdnima! No, to je tek početak jeseni prepune milosrđa i ove drage pobožnosti koja nas sve više povezuje svakodnevno u 15:00, u satu Božjega milosrđa. Kako je Hrvatska postala prepoznatljiva po ovoj pobožnosti? I kako u vremenu nemira upaliti iskru nade? O tome iz Koordinacije štovatelja Božjega milosrđa govore koordinator p. Andrija Wosko i tajnica Jelena Vuković.
