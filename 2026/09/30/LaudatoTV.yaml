  description: Za vrijeme jedne žestoke borbe vodom, Ela je slučajno smočila Gizmove unutrašnje dijelove i on počinje misliti da pripada Eli. Luka to ne može popraviti i govori Eli da joj to nikad neće oprostiti. Superknjiga odvodi djecu u vrijeme Jakova i Ezava. Kad se Ezav odrekne svog prvorodstva, i Jakov prevari oca za blagoslov, oni se posvađaju i ne pričaju dugi niz godina. Kad Jakov konačno ode do Ezava i njegov brat pronađe snagu da oprosti Jakovu od svega srca, Luka u tome vidi znak za sebe i oprašta Eli. Zajedno na kraju pokušavaju popraviti Gizma kojem je još uvijek pokvaren mikročip.
