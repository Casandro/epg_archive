  description: Tema današnje emisije je PREŽIVLJAVANJE NOVOROĐENČETA - NAJNOVIJA DOSTIGNUĆA. Novorođenče može biti prerano rođeno sa malom porođajnom težinom, sklono je infekcijama, sepsi, krvarenju i još mnogo toga, ali vrhunski liječnici, primjenjujući najnovija medicinska dostignuća postižu velike uspjehe i omogućuju takvoj djeci kasniji normalan razvoj. O najnovijim dostignućima u liječenju takve djece u emisiji razgovaramo s prof. dr. sc. Borisom Filipovićem - Grčićem, dr. med., specijalistom pedijatrije i subspecijalistom neonatologije u Klinici za pedijatriju KBC-a Zagreb.
