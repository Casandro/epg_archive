  description: U novom izdanju emisije Blagoslovljen tek družimo se s mladim ljudima velikog srca, a oni su volonteri projekta 72 sata bez kompromisa. Podijelit će iskustva nesebičnog služenja, svjedočanstva o solidarnosti i radosti koju pronalaze u pomaganju drugima. Otkrivamo što ih motivira, kako ih volontiranje obogaćuje i zašto je važno darovati svoje vrijeme, ruke i srce te tako pružiti nadu tamo gdje je najpotrebnije. U kulinarskom dijelu mladi volonteri pripremaju carbonaru te palačinke.
