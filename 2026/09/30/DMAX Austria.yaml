  title: Goldrausch in Alaska
  subtitle: Verkracht und versöhnt
  description: |-
    Harte Arbeit und schwierige Bedingungen: Das Leben als Goldgräber ist kein Zuckerschlecken. Sechs Monate im Jahr stellen sich die Teams im Yukon einer gnadenlosen Wildnis. Die Minenbosse stehen unter großem Druck, doch die hohen Erwartungen werden nicht immer erfüllt. Wenn Träume zerplatzen und die Zuversicht schwindet, kippt mitunter die Stimmung. Frustration macht sich breit und es kommt zu offenen Streitigkeiten. Dabei gehen manchmal auch Freundschaften zu Bruch. Dieses Special zeigt emotionale Ausnahmesituationen, in denen die Nerven blank lagen.
    GBR 2025
  widescreen: true
- eventId: 1310764
  start: 2026-09-30T19:15:00Z
  stop: 2026-09-30T20:15:00Z
  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Gefahr in Afrika
  description: |-
    Ein neuer Kontinent, eine neue Mission: Andreas Macherey und seine Söhne stürzen sich in ein Abenteuer, bei dem es um weit mehr als Schatzsucher-Romantik geht. Sie wollen einer Farmerfamilie helfen, die um ihre Existenz kämpft. Chris und sein Sohn hoffen mitten in der Goldgräberregion von Barberton auf ein verborgenes Edelmetallvorkommen, das ihre Zukunft sichern soll. Ob sich dieser Traum erfüllt, ist jedoch ungewiss. Und für das Trio aus Deutschland ist Südafrika Neuland. Dort droht nicht nur Gefahr durch Schlangen, sondern offenbar auch durch bewaffnete Goldsucher.
    DEU 2026
  widescreen: true
