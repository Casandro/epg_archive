  title: Kings Of Cash - Die Pfandleiher
  subtitle: Außerirdisch gute Geschäfte
  description: |-
    Ein Kunde möchte in Nürnberg ein Bajonett zu Geld machen, doch der Faktencheck sorgt für Ernüchterung. Das Fundstück bringt am Ende weniger ein als erwartet. In Karlsruhe gilt es in dieser Folge von "Kings of Cash", Sprachbarrieren zu überwinden. In Siegburg wecken Modellautos Kindheitserinnerungen. Ein Mercedes-Benz 600 Pullman hat es Niklas besonders angetan. Und in Bochum zeigt sich, wie lohnend eine Wertanlage sein kann. Ein Stammkunde verkauft dort Goldmünzen, die er einst selbst im Pfandhaus erworben hat - heute sind sie mehr als doppelt so viel wert.
