  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Anhand von Keksen erklärt Abby dem Krümelmonster das Minusrechnen. Zu Krümels großem Bedauern verschwinden die abgezogenen Kekse einfach. Außerdem übernachten Ernie und Bert im Zelt. Plötzlich hört Ernie draußen ein Geräusch. Er geht hinaus, um sich umzusehen. Und tatsächlich: Überall sind Tiere, die Geräusche machen - rechts, links, oben und unten. Der Blaue möchte einen Kaffee trinken. Im Coffee-Shop trifft er auf Grobi, der dort als Verkäufer arbeitet. Da ahnt er: Das mit dem Kaffee wird dauern.'
