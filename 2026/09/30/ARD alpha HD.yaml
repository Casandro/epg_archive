  title: Die Frage
  subtitle: 'Klimawandel, Katastrophen, Zukunftsangst: Was lernt man im Klimakollaps-Camp?'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Was passiert, wenn Strom, Wasser oder Kommunikation plötzlich komplett ausfallen? Was mache ich in einem Katastrophenfall? All das ist Thema im "Kollapscamp": Hier treffen sich Menschen, die sich solidarisch auf die Folgen der Klimakrise und einen möglichen gesellschaftlichen Kollaps vorbereiten wollen. Lisa-Sophie besucht das Camp und spricht mit Menschen, die sich Sorgen um Klima, Demokratie und gesellschaftliche Krisen machen. Dabei steht eine Frage im Mittelpunkt: Hilft diese Vorbereitung gegen die Angst vor der Zukunft oder verstärkt sie sie sogar?'
