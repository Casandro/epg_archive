  title: Die größten Rätsel der Wissenschaft
  subtitle: Die Rückseite des Mondes
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. In dieser Episode geht es um die Rückseite des Mondes. Als die russische Raumsonde Luna 3 im Jahr 1959 die ersten Aufnahmen von ihr machte, war die Welt der Wissenschaft regelrecht schockiert, denn die Fotos zeigten, dass die erdabgewandte Seite des Mondes völlig anders aussieht als die uns bekannte Vorderseite. Trotz intensiver Forschung konnte das Rätsel bis heute nicht gelöst werden. Warum?
- eventId: 546192
  start: 2026-09-30T19:50:00Z
  stop: 2026-09-30T20:40:00Z
  title: Die größten Rätsel der Wissenschaft
  subtitle: Gibt es Leben auf dem Mars?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. In dieser Episode geht es um eine Frage, die die Wissenschaft seit mehr als 100 Jahren beschäftigt. Gibt es Leben auf dem Mars? Und was würde es für uns bedeuten, wenn es Leben auf dem Mars gab oder noch immer gibt? Folgen Sie uns auf eine der spannendsten wissenschaftlichen Expeditionen, auf der Suche nach Antworten zu einem der großen Rätsel der Wissenschaft.
- eventId: 546193
  start: 2026-09-30T20:40:00Z
  stop: 2026-09-30T21:10:00Z
  title: 42 - Die Antwort auf fast alles
  subtitle: Sind wir fit für den Mars?
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein paar Millionen Jahre hat es gedauert, bis unser Körper zu dem wurde, was er heute ist. Wir können laufen, tanzen, klettern - extreme Beschleunigungen aushalten. Doch was geschieht mit uns, wenn wir die Bedingungen ändern? Zum Beispiel, wenn wir auf einmal alle ins Weltall könnten und dort der Schwerelosigkeit ausgesetzt sind. Was passiert mit unserem Körper, wenn wir die Erde verlassen? Und: Ist es wirklich sinnvoll, sich damit zu beschäftigen?'
- eventId: 546497
  start: 2026-09-30T21:10:00Z
