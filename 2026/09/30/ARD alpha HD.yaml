  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Allergien gehören weltweit zu den häufigsten Erkrankungen - und die Zahl der Betroffenen steigt kontinuierlich. In Deutschland leiden bereits mehr als 30 Millionen Menschen darunter. Bis 2050 könnte sogar die Hälfte der europäischen Bevölkerung von allergischen Erkrankungen betroffen sein, in Deutschland also jeder Zweite. Doch warum nehmen Allergien so dramatisch zu? Welche Rolle spielen Umwelt, Klimawandel, Ernährung und Lebensstil? Und wie weit ist die Forschung?
