    Mutters Kinder
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Weil ihr die Schulden über den Kopf gewachsen sind, soll Unternehmerin Johanna rund 2000 Liter Giftmüll im See entsorgt haben. In ihrem Dorf herrscht seitdem Lynchstimmung - nicht zuletzt weil ein Kind durch das "Giftwasser" zu Schaden kam. Ist Johanna wirklich eine skrupellose Geschäftsfrau, die wissentlich Mensch und Natur in Gefahr gebracht hat? Oder wollte sich ihr Bruder an ihr rächen, weil sie an seiner Stelle zur Unternehmensleiterin ernannt wurde?
