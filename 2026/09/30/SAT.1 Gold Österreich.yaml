    Altersfreigabe: ab 12
  description: Die 27-jährige Emily behauptet, dass der verstorbene Adrian Tesche der Vater ihres Kindes sei. Eltern und Witwe des Toten halten Emily für eine Lügnerin, die nur das Erbe des Verstorbenen will. Jetzt steht Emily vor Gericht, weil das Grab des Toten aufgebrochen wurde. Ist sie tatsächlich so weit gegangen, um mithilfe eines DNA-Tests zu beweisen, dass sie die Wahrheit sagt?
