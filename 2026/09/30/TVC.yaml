  title: Papież. Najpotężniejsze narzędzie Kościoła 1 (odc. 6)
  subtitle: Spojrzenie na rolę papieża w teraźniejszości i jak papiestwo mierzy się z kontrowersyjnymi tematami w zmieniającym się świecie.
  description: |-
    Tytuł oryginalny: Pope: The Most Powerful Man In History
    US, 2018
    Reżyseria: David Schaye
    Występują: Liam Neeson, Alexandru Aldea, Kasey Vincent
    Pewien światowy przywódca, którego wpływy obejmują armię, politykę i religię, wciąż pozostaje jedną z najbardziej tajemniczych postaci. W Archiwach Watykańskich piętrzą się dokumenty poświęcone każdemu kolejnemu papieżowi, a mimo to informacje dotyczące zwierzchnika Kościoła katolickiego są skrzętnie skrywane przed światem zewnętrznym. W bezprecedensowej produkcji wyjawione zostaną sekrety, które dopiero niedawno ujrzały światło dzienne.
