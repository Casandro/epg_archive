  title: Papież. Najpotężniejsze narzędzie Kościoła 1 (odc. 5)
  subtitle: Zaciekły spór o to, jaką rolę odegrał papież w czasie II wojny światowej, ma szansę na rozwiązanie dzięki odtajnieniu watykańskich archiwów z tego okresu.
  description: |-
    Tytuł oryginalny: Pope: The Most Powerful Man In History
    US, 2018
    Reżyseria: Alec Michod
    Występują: Gregory Cole, Paul Dake, Dennis P. Marburger, Liam Neeson, Sean Patrowich, Nick Raffaele
    W odcinku będzie mowa o tym, co zrobił papież w czasie II wojny światowej. Zagadnienie to od dekad wywołuje kontrowersje. Jedni oskarżają panującego wówczas Piusa XII o współpracę z Hitlerem, inni snują niepoparte dowodami opowieści o niesieniu Żydom pomocy przez Watykan. Zaciekły spór o to, jaką rolę odegrał papież w czasie wojny, ma szansę na rozwiązanie dzięki odtajnieniu watykańskich archiwów z tego okresu.
