  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Teolog František Štěch přeložil encykliku Magnifica Humanitas jako Vznešené lidství: "Téma umělé inteligence je od konce roku 2022 veřejné, patří nejenom všem vědám, ale nám všem. Snažím se být technorealistou - je třeba vidět přínosy i rizika. My jako lidé si musíme říct, k čemu chceme tuto technologii použít a určit, co je lidské, kde už ji nevyužijeme a podle toho se chovat." Jak AI zrychluje práci na překladech? Co přinesla do debaty encyklika papeže LVA XIV. z května 2026 Magnifica Humanitas? Jak se liší lidská komunikace a konverzace s velkým jazykovým modelem? A stává se kvůli AI mírou vznešeného lidství to, jak se umíme postarat o nejzranitelnější osoby? Moderuje Petr Vizina.'
