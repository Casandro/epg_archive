  title: Pro a proti
  description: Neplatiči alimentů zpátky za mříže? Se zpřísněním trestů počítá novela vládních poslanců, kterou aktuálně projednává sněmovna. Přiměje hrozba vězení nezodpovědné rodiče k placení výživného, nebo naopak povede k růstu dluhu na alimentech? A pomůže novela dětem, nebo jim naopak ublíží? Debatovat budou ředitelka Asociace neúplných rodin Iveta Novotná a předsedkyně výboru Asociace organizací v oblasti vězeňství Jana Smiggels Kavková. Moderuje Lukáš Matoška.
