  title: Podróże z historią 4 (odc. 1)
  subtitle: Radosław Kotarski wyrusza do Bochni, aby odpowiedzieć nurtujące go pytania dotyczące soli i przekonać się, jak trudna była praca dawnych górników, którzy z narażeniem życia walczyli o jej wydobycie.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Dlaczego ceny słone to ceny wysokie? Jak ciężka była beczka soli, którą musieliśmy z kimś zjeść, aby dobrze go poznać? Czym jest tajemniczy kłapeć? Radosław Kotarski wyrusza do Bochni, aby odpowiedzieć na te pytania i przekonać się, jak trudna była praca dawnych górników, którzy z narażeniem życia walczyli o wydobywanie soli. Poza tym, przejeżdża podziemną kolejką przez sam środek bocheńskiej kaplicy. Eksploruje również podziemne korytarze i wczołguje się w nieczynne komory górnicze.
  genre:
  - '149'
