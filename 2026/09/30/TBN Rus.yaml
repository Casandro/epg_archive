  description: 'Ведущая Евгении Бранде: "Моя авторская программа "Беседы у камина" создана для того, что бы вдохновлять людей жить, идти вперед и не сдаваться в это сложное время для нашей страны. Идея названия заимствована у радио ?передач Франклина Рузвельта, которые так и назывались "Беседы у камина". В тяжелое время великой депрессии 1938 года президент США выступал перед своим народом, находя простые слова для вдохновения и ободрения американцев. "Беседы у камина" ? это моя первая работа в качестве автора текстов и телеведущей. Искренне надеюсь, что мои беседы у камина будут полезными и вдохновляющими для вас".'
