  subtitle: '"В поисках духовного пробуждения" -- 16+ №9'
  description: Представляем вашему вниманию премьеру нового документального сериала "В поисках духовного пробуждения", где известный христианский деятель, писатель и миссионер Юджин Бах проследит путь Евангелия - от его зарождения до наших дней - чтобы понять, как Бог действовал через Свой народ на протяжении всей истории! Вместе мы отправимся в Израиль, Италию, США, Китай, Африку и Малую Азию, чтобы рассказать о ключевых лидерах и влиянии исторических, политических и социальных событий на духовное возрождение людей. В погоне за правдой мы узнаем о роли преследований, вызовах гордости и искажения Писания, а также о современном пробуждении в Китае и миссионерских усилиях по всему миру.
