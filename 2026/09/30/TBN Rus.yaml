  subtitle: '"Евангельская Истина с Вильямом Кумуйи" -- №33'
  description: 'Стремление к свету, жажда по Божьему Слову, хождение в святости - это результаты глубокого преображения души и разума. Иисус однажды сказал: "познаете истину, и истина сделает вас свободными" (от Иоанна 8:32). Бог приглашает каждого из нас в это удивительное путешествие свободы! Представляем вашему вниманию цикл программ "Евангельская Истина" с Вильямом Кумуйи, пастором библейской церкви "Глубокая Христианская Жизнь", который будет делиться тем, как стоять в благословениях, быть исполненным Духа Святого, приносить добрый плод и ходить в настоящей свободе. Перестаньте идти на компромисс с образом и идеями этого мира! Многие христиане пали от пагубного влияния дьявола, потому что не позволили Божьей благодати проникнуть в глубину сердца и укоренить его в истине. Позвольте Духу Святому преобразить ваше настоящее! Познайте истину без ложных примесей и "стойте в свободе, которую даровал нам Христос" (Галатам 5:1). Как выглядят плоды "худого дерева" (от Матфея 7:17) в наши дни? Что его ожидает? Какие алгоритмы приводят к неправильным поступкам? Как достичь свободы, о которой говорил Христос? Стойте в благословении, ходите в истине и будьте исполнены Духом Святым!'
