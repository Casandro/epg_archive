  stop: 2026-09-30T11:15:00Z
  title: Temps présent
  description: 'La Suisse face à l''invisible menace du frelon asiatique C''est une nouvelle menace invisible : le frelon asiatique se déploie en Suisse de manière exponentielle et inquiétante. De jolis petits cocons blancs et beiges apparaissent un peu partout, même dans nos villes. Ce sont, en fait, des nids d''un redoutable insecte à ne surtout pas toucher. Arrivé en 2017 par le Jura, le frelon asiatique est un grand destructeur d''abeilles et autres pollinisateurs, et ses attaques sur l''homme peuvent entraîner des réactions imprévisibles. Pourtant, la Confédération peine à prendre la mesure de la menace et laisse les cantons gérer ce nouveau fléau comme ils peuvent. Reportage au c_ur de la lutte en Suisse romande.  (Suisse Romande-2026)'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
