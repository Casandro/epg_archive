- eventId: 1184497
  start: 2026-09-30T12:35:00Z
  stop: 2026-09-30T13:25:00Z
  title: Mise au point
  description: "(Suisse Romande-2026)  - Retards sur le rail Alors que plusieurs tronçons romands sont saturés, et que l'argent tarde pour développer la ligne Lausanne-Genève, des voix s'élèvent contre le tunnel ferroviaire du Grimsel. Le projet, déclaré prioritaire, est pourtant sévèrement critiqué par le contrôle fédéral des finances, reportage. \n - En Suisse, on n'a jamais mangé autant de poulet 16,5 kg par personne chaque année. Ça représente une augmentation de 83% en 25 ans, alors que la consommation de toutes les autres viandes stagnent ou baissent. Un succès qui s'explique par son prix abordable et par la mode du fameux (ou pas) poulet croustillant.\n - Glacier : ne me quitte pas Il a rejoint les dizaines de glaciers suisses disparus, l'été caniculaire a eu raison du glacier de Bella Tolla. Des disparitions qui pèsent lourd sur le moral de ceux qui vivent dans les montagnes valaisannes, même si sous la glace, d'autres perspectives s'ouvrent, reportage."
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
