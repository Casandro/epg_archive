  description: 'Autor: Marcela Kopecká; Interpret: Anežka Tesařová * Anežka Tesařová studuje japanologii v Olomouci. V rámci svých studií pobývala několik měsíců v Japonsku. Pracovala tam pro České centrum, poznávala zemi a její obyvatele. Co bychom si z japonské kultury mohli vzít i my? A čemu věří mladí obyvatelé této země? O japonské kultuře, jídle, přírodě a mezilidských vztazích budeme mluvit na Proglasu.'
