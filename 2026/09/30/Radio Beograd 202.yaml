  description: Od divljih konja i maca koje zavode, do ptica koje najavljuju jutro - probudite se uz najbolje hitove inspirisane šarolikim životinjskim carstvom. Muzika i priroda oduvek govore istim, jasnim jezikom, a ovog jutra Dvestadvojka postaje pravo malo muzičko životinjsko carstvo. Pred vama su tri sata pažljivo odabranih hitova u čijim se naslovima, skrivenim stihovima ili samim rifovima kriju naše omiljene životinje.Bilo da su u pitanju nežni leptiri, slobodne ptice koje krstare nebom, odani psi ili lavovi čija se snaga oseća kroz moćne gitarske soloe, pripremili smo vam plejlistu koja garantuje neverovatno dinamično i zabavno buđenje. Otvorite širom prozore, pustite divljinu i prirodu u svoje domove ili automobile, i dozvolite da vas ove "raspevane životinje" u svom prepoznatljivom ritmu povedu u još jedan sjajan jesenji dan.Pišite nam - koja je vaša omiljena pesma sa životinjskim motivima i da li vaš kućni ljubimac možda ima neku numeru uz koju najviše voli da se budi?Vaše poruke...
