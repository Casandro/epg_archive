  title: Buchty
  description: Záznam Buchet Live na Letní filmové škole v Uherském Hradišti. Ivana a Zuzana vyrazily mimo rozhlasové studio a na LFŠ si před publikem poklábosily s houslistou Petrem Štulírem z cimbálky Harafica. Kolik stojí cimbál a proč na něj Petr nehraje? Proč je hraní v cimbálce nejlepší a jak s ním souvisí zavařování? Všechno uslyšíte v záznamu živého vystoupení Buchet v Uherském Hradišti.
