  title: 'Ztělesnění 3: Sebe-optimalizace'
  description: Chtějí být svou nejlepší možnou verzí. Zdokonalují svá těla s pomocí léků na hubnutí nebo estetické chirurgie. Ve snaze o sebeoptimalizaci se ale mohou zacyklit a bez lékařského dohledu riskují zdraví. V třetí epizodě podcastové série Ztělesnění si poslechněte, proč není snadné přestat.
