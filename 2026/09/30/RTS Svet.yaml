  description: 'Novi serijal pariske produkcije Mediapont ponovo na Satelitskom programu RTS. "Povratna karta" je dopisnički magazin koji se bavi aktuelnostima u srpskoj dijaspori Francuske i okolnih zemalja. Tokom narednih emisija pratićete aktuelnosti naših iseljenika i zemlje - domaćina, a biće otvarane i teme od suštinskog značaja za odnos Srbije i njenog rasejanja: odliv mozgova, mogućnosti ekonomske i kulturne razmene, promocija i prijatelji Srbije u svetu... U prvoj emisiji, "Biti Srbin u Parizu", videćete istorijski presek delovanja srpske dijaspore u Gradu svetlosti od kraja devetnaestog veka do danas. Na pitanje "kako organizovati Srbe Francuske u skladu sa zahtevima koje nameće XXI vek", odgovaraće ličnosti iz Saveza Srba Francuske koje su dale najveći doprinos na polju kulturnog, političkog i ekonomskog organizovanja. Posebno su istaknute teme obeležavanja stogodišnjice Velikog rata i organizovanja obrazovanih ljudi koji do sada nisu imali bitnijeg učešća u onome što prepoznajemo pod...'
