  title: Hitler - Eine deutsche Tragödie
  subtitle: Hitler - Eine deutsche Tragödie - Ein Diktator
  description: Von 1934 bis 1936 festigt Hitler seine Macht als Kanzler und Reichspräsident auf Lebenszeit. Er wird oberster Befehlshaber der Streitkräfte, setzt Gesetze nach seinem Willen durch und schwächt das Parlament. Trotz seiner Selbstdarstellung als "Kanzler des Friedens" stärkt er das Militär, indoktriniert die Jugend in der Hitlerjugend und das Volk akzeptiert die Diktatur, während die Nürnberger Rassengesetze verabschiedet werden und die Verfolgung von Minderheiten voranschreitet.
  genre:
