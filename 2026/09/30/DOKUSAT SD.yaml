  title: Adolf Hitler - Die Machtergreifung
  subtitle: Adolf Hitler - Die Machtergreifung
  description: Teil zwei beginnt mit Hitlers Ernennung zum Reichskanzler im Januar 1933. Kurz darauf ordnet er die Aufrüstung der Wehrmacht an, um seinen aggressiven Expansionskurs zu verfolgen. Sein Weltanschauungskrieg richtet sich gegen den Kommunismus und die jüdische Bevölkerung. Am 1. September 1939 überfällt die Wehrmacht Polen, was den Zweiten Weltkrieg auslöst.
