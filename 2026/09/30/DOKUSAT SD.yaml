  title: Die wilden Flüsse Afrikas - Nil
  description: 'Mit einer Länge von fast 7.000 Kilometern ist der Nil die unangefochtene Nummer 1 unter Afrikas Flüssen. Von seinen Quellen im Osten des Kontinents wälzt sich dieser Strom der Superlative durch elf Länder gen Norden, bevor er schließlich in einem gigantischen Delta ins Mittelmeer mündet. Auf seiner Reise begegnen ihm unberührte Urwälder und Wüstenlandschaften ebenso wie pulsierende Metropolen. Fest steht: In seinem Einzugsgebiet ist der Nil die zentrale Lebensader für Menschen und Tiere.'
  widescreen: true
  subtitle: Die wilden Flüsse Afrikas - Nil
