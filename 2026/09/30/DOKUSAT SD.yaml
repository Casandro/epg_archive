  description: Die erste Folge skizziert Hitlers persönliche Entwicklung von seiner Kindheit bis zum Aufstieg zum Führer der NSDAP. Sie beleuchtet seine Zeit in Wien, den Ersten Weltkrieg, die Entstehung von "Mein Kampf" und seine Machtübernahme als Reichskanzler. Hitler propagierte eine ultranationalistische und antisemitische Ideologie, die zur Grundlage seiner Herrschaft wurde.
