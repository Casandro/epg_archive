  title: WELTjournal
  genre:
  - '129'
  subtitle: Lula - Brasiliens Ikone der Armen
  description: 'Brasiliens legendärer Präsident Ignacio Lula da Silva könnte bei den kommenden Präsidentschaftswahlen für eine vierte Amtszeit gewählt werden. Lula liegt in den Umfragen vor seinem Herausforderer Flavio Bolsonaro, dem Sohn des wegen Putschversuchs verurteilten früheren Präsidenten Jair Bolsonaro. Das WELTjournal beleuchtet Lulas politische Biografie und spannt den Bogen von seiner Kindheit in ärmlichsten Verhältnissen, über seine prägende Rolle als Gewerkschaftsführer während der Militärdiktatur, bis hin zu den dramatischen Wendepunkten der jüngeren Vergangenheit: Lulas Verurteilung im Rahmen eines umstrittenen Korruptionsprozesses, seiner vollständigen Rehabilitierung durch das Oberste Gericht und seiner Rückkehr ins höchste Amt des Staates. Wegen seines beständigen Kampfes gegen die massive soziale Ungleichheit gilt er als Ikone der Armen. Seine Biografie spiegelt die Geschichte Brasiliens über mehr als sieben Jahrzehnte, in der das größte Land Südamerikas zwischen Diktatur und Demokratie, zwischen reformorientierten Linken und wirtschaftslibertären Rechten, und zwischen Modernisierung und weitverbreiteter Armut schwankte.'
