- eventId: 1183666
  start: 2026-09-30T21:25:00Z
  stop: 2026-09-30T22:12:44Z
  title: WELTjournal +
  subtitle: Amazonas - Bäume statt Regenwald
  description: Die riesigen Wald- und Flussgebiete des Amazonas in Brasilien spielen eine wichtige Rolle im globalen Klimasystem - und sie sind gefährdeter denn je. Abholzung, illegaler Bergbau, Brandstiftung und Dürren bedrohen den Regenwald ebenso wie industrielle Monokulturen, etwa Eukalyptus-Plantagen zur Zellstoff- und Papierproduktion. Das WELTjournal + begibt sich auf Lokalaugenschein und zeigt, wie Monokulturen die biologische Artenvielfalt verdrängen, die Böden austrocknen und den Lebensraum indigener Völker beschneiden. Außerdem befeuern sie Waldbrände - ein Problem, das auch in Portugal und Spanien besteht. Die allgemein beliebten, von Politik, Wirtschaft und NGOs initiierten Baumpflanz-Aktionen und Aufforstungsprojekte fürs Klima tragen ebenfalls zu weiteren Monokultur-Plantagen bei und gelten aus wissenschaftlicher Sicht als wenig zielführend. Und auch Co2-Kompensationszahlungen für Flüge sind höchst umstritten, wenn damit Bäume in Monokulturen gepflanzt werden.
  genre:
  - '129'
