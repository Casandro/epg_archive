  start: 2026-09-30T21:03:00Z
  stop: 2026-09-30T22:00:00Z
  title: WDR 3 Open
  subtitle: 'Meister des Balafons: Aly Keita'
  description: Aly Keïta aus Abidjan/Berlin ist bekannt für außergewöhnliches Balafonspiel. Als Musiker, der seine Instrumente selbst baut, öffnet er sich verschiedenen musikalischen Kontexten. Das ursprünglich pentatonische Balafon hat er zu einem chromatischen Instrument entwickelt, mit dem er traditionelle Wurzeln mit einer modernen Klangsprache verbindet. Jüngstes Beispiel ist sein Album "Balafon Evolution".
