  stop: 2026-09-30T20:00:00Z
  title: ARD Konzert
  description: "Seine Inspiration als Komponist zieht der Australier Brett Dean zum einen aus seiner 14-jährigen Orchestertätigkeit als Solobratscher der Berliner Philharmoniker, zum anderen aus Rockbands, in denen er gespielt hat. Seine Musik klingt vor allem farbenreich, ergänzt häufig Elektronik und Samples. Während seiner kreativen Partnerschaft in Saarbrücken hat der sympathische und offenherzige 64-jährige mit der Deutschen Radio Philharmonie sein eigenes Bratschenkonzert gespielt, kombiniert mit HK Grubers Frankenstein-Pandämonium und Cerhas Wiener Kaleidoskop. \n<strong>Brett Dean</strong><br/>Violakonzert\n<strong>Friedrich Cerha </strong><br/>\"Wiener Kaleidoskop\" für Orchester (Auswahl)\n<strong>HK Gruber</strong><br/>\"Frankenstein!!\", Pandämonium <br/>für Chansonnier und Orchester nach Kinderreimen von H. C. Artmann\n<strong>Brett Dean</strong>, Viola<br/><strong>Deutsche Radio Philharmonie</strong><br/>Dirigent und Chansonnier:<strong> HK Gruber</strong>\nAufnahme vom 19.04.2026 aus der Saarbrücker Congresshalle\n<strong>Brett Dean</strong><br/>Pastoral Symphony für Kammerorchester und Tonband\n<strong>Deutsche Radio Philharmonie </strong><br/><strong>Martyn Brabbins</strong>, Dirigent\nAufnahme vom 19.06.2026 aus dem SR Sendesaal\n<strong>Ralph Vaughan Williams</strong><br/>Fantasie über Themen von Thomas Tallis für doppeltes Streichorchester\n<strong>Deutsche Radio Philharmonie </strong><br/><strong>Brett Dean</strong>, Dirigent\nAufnahme vom 29.02.2024 aus dem SR Sendesaal"
