    Während Zac und Jamila erfolgreich zusammenarbeiten, hat Pip das Gefühl, dass Posy nur Unsinn im Kopf hat und ihm nicht wirklich bei der Suche hilft. Trotzdem steht es am Ende 3 zu 3, und Frankie verkündet, dass sie noch das große goldene Ei versteckt hat.

