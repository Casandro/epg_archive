  title: Die Sendung mit dem Elefanten
  subtitle: Wie fühlt sich Traurigkeit an?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie fühlt sich Traurigkeit an?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Manchmal gibt es Tage, da will einfach nichts klappen und nichts macht Spaß. So geht es Elisabeth in der Kita, denn keiner möchte mit ihr spielen. "Ich fühle was, was du nicht fühlst" singt Eva für Knolle, der sein ungutes Gefühl nicht in Worte fassen kann. Aber wie fühlt sich traurig sein an und was kann man dagegen tun? Diese elefantastische Folge zeigt kleinen Kindern einfühlsam, was helfen kann, wenn man traurig ist.
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

