  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Vorschulserie, Norwegen 2012
    Der Wirbelstab

    Agnes und ihre Freundin haben es gut: Sie dürfen beim Spielmannszug mitlaufen und einen Tambourmajor-Stab wirbeln. Das würde Elsa auch gern tun und übt mit einem Stöckchen. Aber dann findet sie einen echten Wirbelstab auf der Straße. Elsa ist überglücklich - bis sie sieht, dass das Nachbarsmädchen Frida verzweifelt danach sucht. Soll Elsa den Stab zurückgeben?

    Der Sommer hält viele neue Erlebnisse und Erfahrungen für Elsa bereit. Jede Folge erzählt ein kleines, alltägliches Abenteuer, das die fünfjährige gemeinsam mit ihrer älteren Schwester Agnes erlebt. Mit einer großen Schwester ist es nicht immer leicht, besonders dann, wenn man mitspielen, dazugehören und wahrgenommen werden möchte. Die Älteren haben oft mehr Rechte und sind gegenüber den Jüngeren nicht immer freundlich. Und mit ihrer Schwester kann Elsa nur toll spielen, wenn Agnes' Freundin Lilly nicht mit da ist. ...
