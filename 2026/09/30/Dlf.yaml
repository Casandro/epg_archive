  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nEine Hymne, die die Welt veränderte: Franz von Assisis Sonnengesang\nAm 3. Oktober begeht die römisch-katholische Kirche den 800. Todestag des Heiligen Franz von Assisi. Er ist einer der beliebtesten Heiligen und der Schutzpatron Italiens, seine Ideen und Gedanken sind bis heute aktuell und strahlen weit über die katholische Kirche hinaus. Der Sonnengesang ist sein bekanntestes Gebet: Es ist der älteste überlieferte Text in italienischer Volkssprache und eine Hymne auf die Schöpfung, die bis heute viele inspiriert. \n\nVereinnahmung von allen Seiten: Wem gehört Franz von Assisi?\nKaum ein Heiliger ist so populär wie Franz von Assisi. Seine radikale Armut und Hingabe zur Natur und zu den Tieren inspiriert Menschen bis heute. Das hat aber auch seine Schattenseiten: Das kleine Städtchen Assisi in Umbrien leidet vor allem in diesem Jubiläumsjahr unter dem Massen- und Pilgertourismus. Und die Beliebtheit führt auch zur Vereinnahmung: Politiker von rechts und links versuchen, den Heiligen mit seinen revolutionären Ideen für sich zu nutzen. \n\nAm Mikrofon: Ina Rottscheidt"
