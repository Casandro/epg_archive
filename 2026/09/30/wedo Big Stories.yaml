  title: 'Königliche Kinder: Prinz William und Prinz Harry'
  subtitle: Show / Game show 1999
  description: '1999 Zwei junge Männer mussten mit außergewöhnlichen Herausforderungen und Umständen umgehen und haben gemeinsam das Gesicht der britischen Königsfamilie verändert. Sie haben sich bedeutende Rollen in der modernen Welt geschaffen. Dieser ursprüngliche und berührende Dokumentarfilm, der 1999, zwei Jahre nach dem Tod ihrer Mutter, Prinzessin Diana, gedreht wurde, untersucht das Leben der königlichen Prinzen, das Erbe ihrer Mutter und ihre Verantwortung. Show / Game show 1999, Regie: Alan Scales'
- eventId:
