  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Die Spur des Wolfes, Education / Science / Factual topics, Season:1 Episode:4
  description: S1 E4 Die Crew entdeckt in der Ferne einen einsamen Wolf und nimmt seine Fährte auf. Dabei stoßen sie auf eine altbekannte Bärenfamilie. Durch sie gelangen sie an einen beliebten Ort zum Fischen, wo es vor hungrigen Bären nur so wimmelt. Education / Science / Factual topics, Season:1 Episode:4
- eventId:
  - 1201912
  - 1216215
  start: 2026-09-30T04:29:00Z
  stop: 2026-09-30T04:57:59Z
  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Alte und neue Bekannte, Education / Science / Factual topics, Season:1 Episode:5
  description: 'S1 E5 In der Nacht findet Casey ein verlassenes Bärenjunges. Am nächsten Tag beginnt er die Suche nach der Familie des kleinen Bären in der Hoffnung, sie wiederzuvereinigen. Auf dem Weg findet er Riedgras, was eine tolle Nahrungsquelle für Bären ist. Education / Science / Factual topics,  Mit: Casey Anderson, Season:1 Episode:5'
- eventId:
  - 1211416
  - 1216216
  start: 2026-09-30T04:58:00Z
  stop: 2026-09-30T05:24:59Z
  title: 'The Tracker''s Diary: Bears of Katmai'
  subtitle: Trautes Heim, Glück allein, Education / Science / Factual topics, Season:1 Episode:6
  description: 'S1 E6 Casey und seine Crew wandern durch den Katmai-Nationalpark. Dort entdecken sie die Knochen eines Buckelwals, der an Land gespült wurde. Doch die Wettervorhersage sieht schlecht aus, weshalb sie ihr Abenteuer womöglich vorzeitig abbrechen müssen. Education / Science / Factual topics,  Mit: Casey Anderson, Season:1 Episode:6'
- eventId:
