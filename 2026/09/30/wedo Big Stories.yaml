  start: 2026-09-30T09:28:00Z
  stop: 2026-09-30T09:58:59Z
  title: Wild Ones
  subtitle: Wildes Australien, Nature / Animals / Environment 2014, Season:1 Episode:15
  description: '2014 ● E15 Australien - das ist die Heimat von zahlreichen besonderen Tierarten. Zu den wohl bekanntesten zählen die Kängurus. Tausende hüpfen täglich über die weiten Felder. Ebenfalls für Australien steht der Koalabär. Obwohl er sich meist auf Bäumen versteckt, verkörpert wohl kaum ein anderes Tier die Wildnis des Landes besser. Die Dokumentation macht einen spannenden Streifzug durch Australien und zeigt, welchen Tieren man hier sonst noch begegnet. Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:15'
