  start: 2026-09-30T01:59:00Z
  stop: 2026-09-30T02:59:59Z
  title: Die neuen Royals
  subtitle: Show / Game show 2001
  description: '2001 Die Prinzessinnen Beatrice und Eugenie standen aufgrund der öffentlichen Trennung ihrer Eltern stark im Fokus der Medien. Trotz dieser schwierigen Situationen bleiben sie der Monarchie verpflichtet und engagieren sich weiterhin gemeinnützig. Show / Game show 2001, Regie: Alan Scales,  Mit: Martin Crocker'
