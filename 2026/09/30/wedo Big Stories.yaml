  title: 'The Tracker''s Diary: Tigers of Nepal'
  subtitle: Lage des Landes, Magazines / Reports / Documentary, Season:1 Episode:1
  description: S1 E1 Casey kommt zusammen mit seinem Kamerateam in Nepal an und trifft sich mit dem lokalen Tigerführer Rajan Chadhary. Rajan ist ein erfahrener Fährtenleser und führt das Team durch den Lebensraum der Tiger im Bardiya-Nationalpark. Magazines / Reports / Documentary, Season:1 Episode:1
- eventId:
  - 1211418
  - 1216218
  start: 2026-09-30T05:56:00Z
  stop: 2026-09-30T06:25:59Z
  title: Tracker Diaries - Die Tiger von Nepal
  subtitle: Auf der Spur, Magazines / Reports / Documentary, Season:1 Episode:2
  description: S1 E2 Bei einem Marsch durch den Dschungel stößt Casey mit seinem Team auf einen Tiger. Viele Spuren verlaufen im Nichts, doch auf der Suche begegnen sie zahlreichen anderen Wildtieren und erleben die Vielfalt des Lebensraums hautnah. Magazines / Reports / Documentary, Season:1 Episode:2
- eventId:
  - 1211419
  - 1216219
  start: 2026-09-30T06:26:00Z
  stop: 2026-09-30T06:57:59Z
  title: 'The Tracker''s Diary: Tigers of Nepal'
  subtitle: Im Schlafzimmer der Tiger, Magazines / Reports / Documentary, Season:1 Episode:3
  description: 'S1 E3 Casey und Rajan diskutieren ihre Taktik bei der Tigersuche: Geduldig am Wasser warten oder aktiv durch den dichten Dschungel pirschen. Am Ende stehen sie den seltenen Großkatzen an einem Flussbett aus nächster Nähe gegenüber. Magazines / Reports / Documentary, Season:1 Episode:3'
