  title: Erinnerung an Diana, Prinzessin von Wales
  subtitle: Show / Game show 2008
  description: '2008 Erinnerungen an Diana zeigen Szenen von ihrem Staatbegräbnis und herzliche Worte von ihren Freunden. Es ist ein nachdenklicher Blick auf Diana sowohl als Person als auch als öffentliche Figur: die Prinzessin, die für immer in Erinnerung bleiben wird. Show / Game show 2008, Regie: Alan Scales'
