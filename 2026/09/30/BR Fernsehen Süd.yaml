  description: |-
    Vor fast sechs Jahren kaufte der Designer Dave Hakkens mit Gleichgesinnten in Zentralportugal ein Stück Land. Hier gründete er "Project Kamp" - ein Labor für eine nachhaltige Zukunft. Neben seinem Kernteam arbeiten hier im Sommer Freiwillige aus aller Welt gemeinsam an Brandschutz und Wiederaufbau der Ruinen.
    Auch in der Stadt Porto finden Hakkens' Ideen Unterstützer. Die Initiative VivaLab bietet jedem die Gelegenheit, seinen Plastikmüll kreativ wiederzuverwerten - dank Hakkens Recycling-Maschinen und seiner offenen Baupläne.
    Dass seine Erfindungen kopiert werden, freut Hakkens - denn so kommen seine Ideen in die Welt.
