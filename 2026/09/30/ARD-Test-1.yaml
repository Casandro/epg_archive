  widescreen: true
  subtitled: true
  hd: true
  description: Die vier Kandidat:innen Ivo Schweikhart, Theresia Borrmann, Stephan Chrzescinski und Charlie Sarbach müssen in Einzelrunden eine Minute lang Fragen gegen die Uhr beantworten. Pro richtige Antwort wird ihnen Geld gutgeschrieben. In Einzelduellen gegen den "Jäger" müssen sie dann ihr Geld verteidigen. Werden sie dabei von ihm eingeholt, scheiden sie aus. Wenn die Kandidaten aber gegen den "Jäger" gewinnen, retten sie sich und ihr Geld ins Finale.
