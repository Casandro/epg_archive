  start: 2026-09-30T06:33:00Z
  stop: 2026-09-30T07:03:00Z
  title: 'Emocije - sluge i gospodari: Život nije cvjetna livada, dokumentarna serija (3/4)'
  subtitle: ' '
  description: 'Svatko od nas ima neki brodolom u životu i stalno se bori s lošim i teškim događajima. Realan život stalna je borba i izazov, a tuga i bol sastavni su dio života. Te smo emocije doživjeli svi. Problem nastaje kad nas negativne emocije toliko obuzmu da ne osjećamo ništa drugo. Tada dolazi do poremećaja raspoloženja - depresije i manije. Kako izaći iz tog negativnog, začaranog kruga? Treća emisija serije "Emocije - sluge i gospodari" nudi odgovor na to pitanje. Stručni suradnici: prof. dr. sc. Nataša Jokić-Begić i prof. dr. sc. Zdravko Petanjek  Autor glazbe: Srđan Sekulović Koscenaristica: Eleonora Korošić Knez'
