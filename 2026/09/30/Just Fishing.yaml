  title: Fliegenfischen am Rißbach
  subtitle: Fliegenfischen am Rißbach
  description: In Deutschland nächtigen und in Österreich Fliegenfischen - das hieß es für Elmar Elfers und seine Frau Simone. Die beiden reisten Anfang Juli von Hamburg in den Süden der Republik. Ziel war ein Gasthof direkt an der Isar. Direkt gegenüber wohnt Pächter und Guide Anderl Ganslmaier. Er ist für das Revier vom Rißbach, der in die Isar mündet, und seine Nebengewässer verantwortlich. In den alpinen Bächen kommen keine Regenbogenforellen vor. Wilde Bachforellen fanden ihre Heimat in den klaren Gewässern. Bachsaiblinge kommen vereinzelt vor, werden aber entnommen. So soll der Lebensraum allein für die Bachforelle erhalten bleiben. Leichte Fliegenruten in Klasse 3 und eine bunte Auswahl an Trockenfliegen bildeten das Set-up am Rißbach. Schwarze Rehhaar-Sedge und Chernobyl Ant trumpften im schnellen Wasser besonders auf und verführten so manche Bachforelle. Für tief stehende Fische knoteten die Fliegenfischer auch gerne den sogenannten Koppen-Killer ans Vorfach. Der Streamer bringt aufgrund von Tungsten-Kopf ordentlich Gewicht auf die Waage und sinkt schnell Richtung Grund - wo die Forellen lauern. Neben den vielenExemplaren in Durchschnittsgröße fing Simone ein echtes Bachmonster. Eines abends stieg die Forelle direkt vor ihren Füßen. Wieder kam die schwarze Rehhaar-Sedge zum Einsatz. Kaum landete sie vor einer flachen Kiesbank auf der Oberfläche, durchbrach auch schon das Forellenmaul das Wasser und schlürfte das Muster genüsslich ein. An der feinen Rute bekam Simone mächtig was zu tun und hatte Glück, dass die große Bachforelle nicht stromab flüchtete. Alles ging gut und ein Traumfisch rutschte in die Keschermaschen. Schnell machte ihr Fang die Runde und zeigte mal wieder, dass auch kleine Bäche echte Großfische bieten können. Eine Woche mit erholsamen Stunden am Wasser ging viel zu schnell vorbei. Eine Wiederkehr zum Fischen im Karwendel ist nicht ausgeschlossen, es gibt noch viel zu entdecken. DE 2023
  ageRating: 12
- eventId: 1276524
  start: 2026-09-30T01:05:00Z
  stop: 2026-09-30T01:20:00Z
  title: Angeln am Forellensee
  subtitle: Angeln am Forellensee
  description: Hochsommer am Forellensee, keine einfache Zeit. Doch Timo Keibel und Elmar Elfers erwischten einen top Tag im Juli. Die beiden Angler besuchten eine Kiesgrube bei Lemwerder. Die niedersächsische Anlage ist immer einen Besuch wert, wenn Regenbogenforellen Zielfisch sind. Das glasklare und tiefe Gewässer ist sehr gut besetzt. Wie an anderen Tag auch, zogen die Forellen in kleinen Schwärmen ihre Kreise. Meist 10 bis 15 Fische. Angeln auf Sicht macht besonders viel Spaß. Timo setzte von Anfang an auf einen kleinen schwarzen Spinner in Größe 2 und konnte damit immer wieder Fische an den Haken locken. Elmar angelte hauptsächlich mit einer Schleppposenmontage und Naturködern. Nicht ganz so viele Forellen wie Timo entlockte er dem hübschen See. An der Tabellenspitze der quirligen Happen standen auch diesmal Bienenmaden. In L-Form zog er die beliebten Köder auf den vierer Haken. Beim Einholen rotieren die Naturköder um die eigene Achse und locken die Regenbogenforellen aus der Reserve. Nebenbei warfen die beiden Forellenangler noch jeder eine Montage mit schwimmendem Sbiro und Pilotkugeln aus. Mehlwürmer und Forellenteig in Braun oder Chartreuse sowie Bienenmaden trieben aufgrund leichten Windes übers Wasser. Dank der schwimmenden Pilotkugeln konnten sie die Tiefe der angebotenen Köder ganz einfach anpassen. Es stellte sich heraus, dass die Fische in 20  bis 30 Zentimetern Tiefe den Köder nahmen. Neben den Portionsforellen zwischen 300 und 500 Gramm schwimmen auch große Exemplare in der Kiesgrube. Elmar erwischte eine davon, die ordentlich Gas im Drill gab. Immer wieder zog sie einige Meter Schnur von der Rolle. Leider blieb Elmar zweiter Sieger. Nach einigen Minuten schlitzte sie aus. Vielleicht beißt sie ja das nächste Mal. Denn die beiden werden sicher im Herbst erneut ihre Köder auf Regenbogenforellen auswerfen. DE 2023
