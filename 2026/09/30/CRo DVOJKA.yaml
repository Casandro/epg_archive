  stop: 2026-09-30T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: prof. MUDr. David Feltl, vedoucí Národního onkologického centra FN Motol a Homolka Co všechno tato instituce pacientům nabízí? Je u nás výskyt rakoviny častější, než v jiných zemích? A jak profesor Feltl rozděluje svůj čas mezi manažerskou pozici a odbornost onkologa? Moderuje Marie Retková.'
