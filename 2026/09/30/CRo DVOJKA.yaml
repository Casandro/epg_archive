  title: Kriminálka
  description: 'Bezbranný - Případ ústecké kriminálky, který vyvolal zděšení nejen u všech, kteří se na jeho vyšetřování podíleli, ale také u široké veřejnosti. Proběhly veřejné demonstrace za práva zvlášť zranitelných obětí, zvedla se vlna zájmu o ochranu dětí do patnácti let a zesílil potom apel na potřebu zabývat se zvýšením ochrany těchto obětí před jakýmkoliv domácím násilím. dramaturgie: Dana a Mirek Vaňurovi. Premiéra.'
