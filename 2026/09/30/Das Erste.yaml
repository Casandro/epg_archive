  title: Die Briefe meiner Mutter
  subtitle: Spielfilm Deutschland 2014
  ageRating: 12
  genre:
  - '16'
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Einen Tag vor ihrem 18. Geburtstag findet Laura Hellmer durch Zufall heraus, dass ihre Mutter Katharina sie jahrelang belogen hat: Lauras Vater war kein spanischer Kriegsfotograf, der vor ihrer Geburt starb, sondern lebt und befindet sich vermutlich in Chile. Kurzerhand macht sich Laura auf nach Südamerika, um ihren wahren Vater zu finden.
    Während sie sich in Santiago auf die Spuren ihrer Mutter begibt, die einst über die Opfer der Pinochet-Diktatur berichtete, reist Katharina ihrer Tochter hinterher. Nachdem sie das zutiefst enttäuschte Mädchen gefunden hat, versucht sie, ihr die Gründe für ihre Geheimniskrämerei zu erklären.
