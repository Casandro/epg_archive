  description: Die Crew der Hammersley entert ein Fischerboot. Es wird vermutet, dass Menschenschmuggler am Werk sind. An Bord wird schnell klar, dass die Crew radioaktiv verstrahlt ist. Die Besatzung erzählt, dass sich zwei Männer mit Koffern abgesetzt haben. Recherchen der Navcom ergeben, dass sich in den Koffern Cäsiumstangen befunden haben. AU 2011
