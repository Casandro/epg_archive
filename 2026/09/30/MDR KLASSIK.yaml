  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Wolfgang Amadeus Mozart: Konzert D-Dur, KV 315 f (Midori, Violine; NDR-Sinfonieorchester, Klavier und Leitung: Christoph Eschenbach); Alexander von Zemlinsky: Klarinettentrio d-Moll, op. 3 (Franz Bumann, Klarinette; Carsten Jaspert, Violoncello; Ruth Müller, Klavier); Claude Debussy: "Trois chansons de Charles d'Orleans" (NDR Chor: Philipp Ahmann); Georg Philipp Telemann: Quartett G-Dur (Bernd Osten, Flöte; Malte Lammers, Oboe; Katrin Scheitzbach, Violine; Sven Forsberg, Violoncello; Jürgen Lamke, Cembalo); Charles Villiers Stanford: Drei lateinische Motetten, op. 38 (NDR Chor: Ralf Popken); Julius Röntgen: Sinfonie Nr. 15 fis-Moll (Trio Parnassus; NDR Radiophilharmonie: David Porcelijn)

    2.03  Das ARD-Nachtkonzert (II)

    Felix Mendelssohn Bartholdy: Klavierkonzert Nr. 1 g-Moll (Martin Stadtfeld, Klavier; Academy of St. Martin in the Fields: Neville Marriner); Johann Sebastian Bach: Sonate h-Moll, BWV 1030 (Paul Meisen, Flöte; Rudi Spring, Klavier); Ludwig August Lebrun: Oboenkonzert Nr. 6 F-Dur (Bart Schneemann, Oboe; Niederländisches Radio Kammerorchester: Jan Willem de Vriend); Camille Saint-Saëns: Klavierquintett a-Moll, op. 14 (Andrea Lucchesini, Klavier; Quartetto di Cremona); Johannes Brahms: "Sieben Ungarische Tänze", WoO 1 (London Philharmonic Orchestra: Marin Alsop)

    4.03  Das ARD-Nachtkonzert (III)

    Richard Wagner: "Eine Faust-Ouvertüre" (Philadelphia Orchestra: Wolfgang Sawallisch); Johann Adolf Hasse: Salve Regina Es-Dur (Barbara Bonney, Sopran; Bernarda Fink, Mezzosopran; Musica Antiqua Köln: Reinhard Goebel); Richard Strauss: Oboenkonzert D-Dur (Simon Dent, Oboe; Polnische Kammerphilharmonie: Wojciech Rajski)

    5.03  Das ARD-Nachtkonzert (IV)

    Edvard Grieg: Sinfonischer Tanz über norwegische Motive, op. 64, Nr. 3 (Bergen Philharmonic Orchestra: Ole Kristian Ruud); Antonio Vivaldi: Konzert D-Dur, RV 93 (Avi Avital, Mandoline; Venice Baroque Orchestra); Louis Spohr: Sinfonie Nr. 3 c-Moll, Finale (NDR Radiophilharmonie: Howard Griffiths); Clara Schumann: Romance variée, op. 3 (Caroline Fischer, Klavier); Gabriel Pierné: "Ramuntcho" (BBC Philharmonic: Juanjo Mena); August Duranowski: Violinkonzert A-Dur, Rondo (Chouchane Siranossian, Violine; Orkiestra Historyczna: Martyna Pastuszka)
