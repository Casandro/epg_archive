  title: Jihočeské odpoledne
  subtitle: Odpolední živě moderovaný radioproud plný hudby a informací z regionu.
  description: Ve Vodňanech na Strakonicku pracovníci v těchto dnech označují nádoby na směsný odpad čipy. Jak nový systém funguje a proč má městu pomoct lépe třídit a hlavně snižovat množství směsného odpadu? Vysvětlíme v odpoledním vysílání. České Budějovice nejsou jen městem piva, ale také dobré kávy. Dokládá to Budějovický kávový týden, který nabídne program ve vybraných kavárnách, kávové workshopy i přednášky místních baristů. Podíváme se na to, jak správně kávu připravit a proč se z ní stal jeden z nejoblíbenějších nápojů. Letošní velmi suché léto vybízí k otázce, jak bude vypadat dostupnost vody v dalších letech. S hydrologem se ohlédneme za letošním suchem a probereme také to, proč se podle odborníků Češi v hospodaření s vodou zlepšují. A chybět nebude ani Řidičská abeceda. Tentokrát si připomeneme pravidla pro situaci, která může být za volantem velmi stresující - můžeme projet křižovatku na červenou, když potřebujeme uvolnit cestu záchranářům?
