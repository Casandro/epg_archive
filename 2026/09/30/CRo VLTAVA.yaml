  title: Večer na téma
  description: Václav Havel mezi Hrádečkem a Afrikou. Pořad nás provede světem Havlovy dramatické tvorby z tradičních i nečekaných úhlů. V první části se režisér Andrej Krob v dokumentu Jak hrát a přitom nehrát Havlovy hry přináší svůj pohled na kouzlo, tajemství i úskalí inscenování Havlových textů. Následně se přeneseme do srpna roku 2006 na legendární Hrádeček. kde s Václavem Havlem natáčel Martin Velíšek. Závěr pořadu nabídne pohled za hranice evropského kontextu v podcastu Lucie Němečkové a zamyíšlení nad tím, jak Havlův odkaz rezonuje na africkém kontinentu. (115 min).
