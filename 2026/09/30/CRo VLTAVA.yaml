  title: Akcent
  description: Kniha VISIT Czechoslovakia! Příběhy českých a slovenských cestovatelských plakátů prochází právě prostřednictvím plakátů dějinami Československa od roku 1918 až do jeho zániku v roce 1992. Co plakáty o naší zemi vypověděly? Co jsme chtěli turistům ukázat a co jsme naopak neukazovali? A může nám reklamní obraz pomoci porozumět vlastní historii lépe než fotografie nebo učebnice? Saša Michailidis se ptá Lindy Kudrnovské a Martina Bedřicha.
