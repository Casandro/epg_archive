  title: Vizitka
  description: Filip Kaňkovský, herec. Za roli Tesmana - manžela Hedy Gablerové v inscenaci Národního divadla je Filip Kaňkovský nominovaný na Cenu Thálie. "Hraje ho jako by to byl ten nejnormálnější a nejběžnější muž na světě," píše se na stránkách divadelních cen. "Ale jeho umění v okamžiku změnit milého popletu v bezcharakterní monstrum, které je za chvíli opět vzorem banálního manžela, propůjčuje roli nevšední dynamiku." Co se v něm jako herci při těchto přechodech v charakteru odehrává? A co všechno se může skrývat za tváří nejnormálnějšího muže na světě? Ptá se Karolína Koubová. vizitka@rozhlas.cz
