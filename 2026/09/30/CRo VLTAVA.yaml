  title: Betonový lidi
  description: Degradace. Druhá epizoda z autorské audio série Vladimíra 518 s názvem Betonový lidi. Zaměřuje se na degradaci a postupný úpadek ve své době futuristických a do značné míry utopických myšlenek o budoucnosti bydlení na panelákových sídlištích. Uslyšíte v ní teoretiky a historiky architektury, ale také architekty i urbanisty, kteří česká sídliště realizovali. Na dokument navazuje bonusový rozhovor s historikem a teoretikem umění a architektury, Rostislavem Šváchou.
