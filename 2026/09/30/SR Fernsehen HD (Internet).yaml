  title: Krieg der Träume
  subtitle: Das Making-of
  description: 'Wie macht man vergangene Zeiten erlebbar und bleibt dabei so nahe wie möglich an den historischen Quellen? Dieser Aufgabe hat sich die dokumentarische Dramaserie "Krieg der Träume" gestellt: Sie zeichnet das Leben realer Personen nach und verwebt Spielszenen eng mit historischem Bildmaterial. Die unterschiedlichen Lebenssituationen der Menschen in Europa, ihre Perspektiven und politischen Utopien werden genauestens rekonstruiert. Welche Recherchearbeit darin steckt und wie Kamera und Musik eingesetzt werden, zeigt dieses Making-of.'
