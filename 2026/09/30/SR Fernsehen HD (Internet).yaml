  title: Wir im Saarland - Service
  subtitle: 'Moderation: Marcel Lütz-Binder'
  description: "Themen:\n* Dreister Betrug mit Fake Autohäusern: Mit Hilfe von KI erstellen Betrüger in kürzester Zeit täuschend echte Webseiten von angeblichen Autohäusern mit echten Namen, Angaben und Fahrzeugen.\n* Abnehmen mit Tablette statt Spritze: Der aus der Abnehmspritze bekannte Wirkstoff Semaglutid soll künftig auch in Deutschland als Tablette zur Behandlung von Adipositas verfügbar sein. \n* Neo-Banken im Check: Neo-Banken wie Trade Republic oder Revolut sind bei Verbrauchern immer beliebter. Wo sind diese im Vergleich zu klassischen Banken besser, wo aber auch schlechter?"
- eventId: 1358477
  start: 2026-09-30T05:10:00Z
  stop: 2026-09-30T07:10:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
