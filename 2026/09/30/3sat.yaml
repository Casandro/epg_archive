  title: Die Zugereisten - Erfurt und die deutsche Einheit
  subtitle: Film von Ute Gebhardt und Jana Herold
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wer gehört wirklich dazu? Fünf Zugezogene erzählen vom Ankommen, vom Fremdsein und vom Leben in Erfurt - und werfen dabei einen Blick auf die innere Einheit Deutschlands.

    Eine Ärztin, ein Unternehmer, eine Gastronomin, ein Kulturmacher und eine Logopädin sind in Erfurt heimisch geworden. Ihre Geschichten erzählen von Ost und West, von Gemeinsamkeiten, Unterschieden und vom Wandel der vergangenen Jahrzehnte.
    HD-Produktion
