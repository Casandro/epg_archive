  description: |
    Deutschland 2014
    Die beiden Streifenpolizisten Sabine Lieber und Uwe Berger schieben Dienst bei einer Verkehrskontrolle. Reine Routine, wie sie denken, und gleich ist ja auch Feierabend. Doch es kommt anders.

    Klaus Ewert, den sie wegen eines defekten Rücklichts angehalten haben, rastet völlig aus. Ewert schießt Berger nieder und flüchtet mit Sabine. Nina Petersen besucht währenddessen ihren Exfreund Benjamin Lietz im Gefängnis. Doch der weigert sich beharrlich, Nina zu sehen.
    Darsteller:
    Nina Petersen - Katharina Wackernagel
