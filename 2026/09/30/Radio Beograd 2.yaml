  title: Studije i ogledi
  subtitle: U emisiji Studije i ogledi, od ponedeljka, 28. septembra, do četvrtka, 1. oktobra, možete slušati tekst Mihaela Antolovića "Recepcija 'škole Anala' u srpskoj istoriografiji".
  description: U emisiji Studije i ogledi, od ponedeljka, 28. septembra, do četvrtka, 1. oktobra, možete slušati tekst Mihaela Antolovića "Recepcija 'škole Anala' u srpskoj istoriografiji". Polazeći od činjenice da je francuska "škola Anala" predstavljala najznačajniji pravac u istorijskom mišljenju 20. veka i da je uticala na glavne tokove evropske i svetske istoriografije, Mihael Antolović analizira njenu srpsku recepciju tokom prethodnih sedam decenija - dinamiku kojom se ona odvijala, njene najznačajnije aktere (autore, prevodioce i izdavače), kao i prihvatanja i otpore koji su pratili njenu adopciju u srpskoj istoriografiji. Naposletku, u vidu zaključka, autor navodi srpske istoričare i istoričarke u čijem radu je uticaj "škole Anala" najprimetniji.
