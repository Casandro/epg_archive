  title: So schmeckt die Welt - Wein
  subtitle: So schmeckt die Welt - Wein
  description: Wein, eine der ältesten und vielfältigsten alkoholischen Getränke der Welt, wird durch die Fermentation von Trauben hergestellt. Von trocken bis süß, von rot über weiß bis rosé, bietet Wein eine enorme Bandbreite an Geschmacksrichtungen und Stilen. Er ist nicht nur ein Genussmittel, sondern auch ein kulturelles Symbol, das gesellschaftliche Zusammenkünfte und Feiern begleitet. Weinanbau prägt Landschaften weltweit und ist oft eng mit der Geschichte und Tradition einer Region verbunden.
  genre:
  - '129'
  widescreen: true
- eventId: 1160603
  start: 2026-09-30T19:40:00Z
  stop: 2026-09-30T20:35:00Z
  title: So schmeckt die Welt - Whiskey
  subtitle: So schmeckt die Welt - Whiskey
  description: Whiskey ist ein vielseitiges Destillat, das aus Getreidemaische hergestellt wird und in Eichenfässern gereift wird. Ursprünglich in Irland und Schottland entwickelt, wird Whiskey heute weltweit produziert und genossen. Die verschiedenen Sorten, wie Scotch, Bourbon und Irish Whiskey, bieten eine breite Palette an Aromen und Geschmacksrichtungen. Whiskey ist nicht nur ein Getränk, sondern auch ein kulturelles Symbol und wird oft mit Tradition, Handwerkskunst und Genuss verbunden.
  genre:
  - '129'
  widescreen: true
