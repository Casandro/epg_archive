  description: '2026 ● S6 E124 In Natuurlijk Noord-Holland deze keer: de sloot. Je ziet het verschil tussen een gezonde sloot en een ''dode'' sloot in één oogopslag: een dode sloot is eigenlijk een lange bak met alleen maar water. In een gezonde sloot wemelt het van de planten en dieren. Sommige zie je in één oogopslag: zwanen, rietsigaren en waterlelies. In de openbare ruimte staan honderden beelden. Wie heeft het gemaakt en waarom? Wat vindt de buurt ervan? Er is veel te ontdekken. Deze keer staat de stad Zoetermeer centraal. Show / Game show 2026, Season:6 Episode:124'
