  description: |-
    Wenn Sie die Bibel aufmerksam lesen, werden Sie feststellen, dass kein geografischer Ort in den Evangelien häufiger erwähnt wird als der berühmte See Genezareth. Viele Wunder ereigneten sich entlang dieses Gebietes, denn es war die wichtigste Wasserstraße zwischen den Städten, in denen Jesus seine Botschaft verkündete. Der Archäologe und Theologe Rodrigo Silva lädt Sie heute wieder ein, mit ihm auf dem See nach der göttlichen Begegnung mit den Menschen zu suchen.

