  title: Beweg dich!
  subtitle: 'Fit in den Tag: Sanfte Morgenübungen für einen aktiven Start'
  description: |-
    Diese Folge von Beweg dich! ist ideal für alle, die morgens schwer in Gang kommen. Mit gezielten Mobilisations- und Dehnübungen im Liegen, Sitzen und Stehen wird der Kreislauf aktiviert, Morgensteifigkeit gelöst und die Muskulatur sanft geweckt. Ob direkt nach dem Aufstehen oder als kurze Bewegungseinheit später am Tag - diese Übungen bringen den Körper in Schwung und sorgen für einen energievollen Start. 15 Minuten sanfte Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Eka Ninow-Woysch ist Sportlehrerin im "Ruhestand".
