  title: Hope Gottesdienst
  subtitle: '... wie Asaf es tat - Sven Fockner'
  description: |-
    Die Bibel ist voll von außergewöhnlichen Menschen: Mose, der das Meer teilt. Abraham, der Gottes Stimme hört. Propheten, die Visionen empfangen. Eine Handvoll Ausnahmegestalten aus Jahrtausenden - und sie sind unsere geistlichen Vorbilder. Aber was macht das mit uns? Wenn diese Ausnahmemenschen zum Maßstab für ein normales Glaubensleben werden, entstehen Erwartungen, die kaum jemand erfüllen kann. Und wer sie nicht erfüllt, fragt sich schnell: Stimmt etwas mit meinem Glauben?
    Asaf kannte dieses Gefühl. In Psalm 77 beschreibt er offen und ehrlich, wie es sich anfühlt, wenn Gott schweigt. Eine Stille, die schwer zu ertragen ist.
    Und Christen heute fragen sich: Was darf und soll ein normaler Gläubiger im Alltag des Glaubens erwarten? Was erwartet Gott wirklich - und was erwartet er eben nicht? Und wie hält man fest an einem Gott, der sich nicht immer so zeigt, wie er es bei den großen Helden der Bibel getan hat?

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
