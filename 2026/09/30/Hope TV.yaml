  title: auserlesen
  subtitle: 'Alexa Willems: "Der Wald ist ein Schatz vor unserer Haustür."'
  description: |-
    Schon Hippokrates beschrieb die wohltuende Wirkung der Natur. Heute zeigen Studien, dass Aufenthalte im Wald Stress reduzieren und das Wohlbefinden fördern können. Die Autorin und Logotherapeutin Alexa Willems hat selbst erlebt, wie wichtig Natur gerade in schwierigen Lebensphasen sein kann. In ihrem Ratgeber verbindet sie persönliche Erfahrungen mit sieben Fragen rund um Sinn, Orientierung und das eigene Leben. In dieser Folge erzählt sie, wie Natur dabei helfen kann, zur Ruhe zu kommen, neue Perspektiven zu gewinnen und auch den eigenen Glauben neu wahrzunehmen.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1138484
  start: 2026-09-30T01:00:00Z
  stop: 2026-09-30T01:30:00Z
  title: Leben und Gesundheit
  subtitle: Das Geheimnis der Bluezones
  description: |-
    Was macht Menschen an bestimmten Orten der Welt besonders gesund und langlebig? In den sogenannten "Blue Zones" - z. B. in Loma Linda (USA), Okinawa (Japan) oder Sardinien (Italien) - leben auffallend viele Menschen über 90 oder sogar 100 Jahre alt - und das erstaunlich fit. Was ist ihr Geheimnis? Was essen sie? Wie bewegen sie sich? Welche Rolle spielen Glaube, Beziehungen oder ein aktiver Alltag? Und was können wir von diesen Menschen lernen? Darum geht es in dieser Folge von Leben & Gesundheit.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
