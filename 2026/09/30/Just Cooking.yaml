  stop: 2026-09-30T13:43:00Z
  title: Mein wunderbarer Kochsalon - Philly-Cheesesteak
  subtitle: Mein wunderbarer Kochsalon - Philly-Cheesesteak
  description: 'Auf Fotos aus meiner Amerika-Zeit erkennt mich mein Mann nicht. Das hat einen gewichtigen Grund: 20 Kilo mehr. Danke, Philly-Cheesesteak. Das Verhängnis meines Gap years ist kurz gebratenes Beiried mit Zwiebeln, Paprika und Käse überbacken, zwischen zwei knusprigen Scheiben Weißbrot. Ihr versteht mich, oder? AT 2017'
  ageRating: 6
- eventId: 1276613
  start: 2026-09-30T13:45:00Z
  stop: 2026-09-30T13:48:00Z
  title: Mein wunderbarer Kochsalon - Pasta Carbonara
  subtitle: Mein wunderbarer Kochsalon - Pasta Carbonara
  description: Manche glauben an die Legende, dass dieses italienische Nationalgericht auf die Köhler zurückgeht, die sich in den Apenninen während der Pausen Penne mit gebratener Pancetta (luftgetrockenetem Bauchspeck) und Pecorino gekocht haben sollen. Andere wiederum vertreten die Ansicht, dass amerikanische Soldaten Eier und Speck zu den Einheimischen brachten und sie baten, etwas daraus zu kochen. Und was macht ein ordentlicher Italiener? Er gibt Pasta, Parmesan und Prezzemolo dazu, und das ganze wurde zum kulinarischen Superstar. Hier meine Lieblingsvariante. AT 2019
- eventId: 1276614
  start: 2026-09-30T13:48:00Z
  stop: 2026-09-30T14:13:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Johannes King
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Johannes King
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Johannes King führt auf der exklusiven Ferieninsel Sylt eines der diskretesten Luxusdomizile Deutschlands: den Sölring Hof. In dem reetgedeckten Haus direkt am endlosen Nordseestrand kredenzt der 2-Sterne-Koch exklusive Gerichte ganz im Zeichen der Region: Austern aus dem Wattmeer, Krabben frisch vom Kutter und dazu Kräuter mit Meeresaroma direkt von der Salzwiese. Martin Klein wird diese nordischen Genüsse fangfrisch ins Salzburger Restaurant Ikarus holen. Dafür reist er nach Sylt um die Zutaten der Insel und Johannes Kings Küchenphilosophie hautnah zu erleben, und ein wenig von der berühmten Sylter Champagnerluft zu schnuppern.  AT 2018'
- eventId: 1276634
  start: 2026-09-30T14:15:00Z
  stop: 2026-09-30T14:40:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Jari Vesivalo
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jari Vesivalo
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Jari Vesivalo gilt als DER Star der jungen, finnischen Küche. Puristisch, elegant und naturverbunden sind seine Kreationen, die im Restaurant Olo direkt am Hafen von Helsinki aufgetischt werden. Martin Klein wird diese Gerichte im Restaurant Ikarus einen Monat lang im Hangar-7 präsentieren. Keine leichte Aufgabe, denn nicht nur ungewohnte Zutaten wie Rentierherz und Fichtennadeln spielen bei dieser Küche eine zentrale Rolle, auch eine ausgefeilte Präsentation ist in dem designverliebten Land unverzichtbar. Beim Erkunden des kulinarischen Angebots von Helsinki stolpert Martin Klein auch über manche Skurrilität: von Bärensalami bis Elchfleisch... AT 2018'
- eventId: 1276635
  start: 2026-09-30T14:45:00Z
  stop: 2026-09-30T15:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Sven Wassmer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Sven Wassmer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sven Wassmer bringt die Alpen auf den Teller! In der imposanten Bergwelt von Graubünden definiert der erst 31-jährige Sternekoch die alpine Küche neu. Seine Zutaten sammelt der Schweizer am liebsten selbst, seiner Experimentierlust sind dabei keine Grenzen gesetzt: was er liebevoll als Bergzitrone bezeichnet, entpuppt sich beispielsweise als aromatische Waldameise. Martin Klein, Executive Chef des Restaurants Ikarus im Salzburger Hangar-7, reist nach Vals, um die Küche des Shooting Stars zu studieren. Gemeinsam erkunden die beiden Köche den Kanton auf der Suche nach den besten alpinen Zutaten, die ins Ikarus mitgenommen werden. Dort kocht Sven Wassmer im Juli 2018 auf. AT 2018'
