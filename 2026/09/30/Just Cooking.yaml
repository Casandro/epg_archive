  title: Mein wunderbarer Kochsalon - "Seeviche" vom Seesaibling
  subtitle: Mein wunderbarer Kochsalon - "Seeviche" vom Seesaibling
  description: Wenn sich schon die besten Köche unter einem Dach versammeln, dann wollen wir ihnen auch auf die Finger schauen. Vergangene Woche veranstalteten wir die dritte Gault&Millau Genussmesse im Kursalon in Wien und erstmals war ich auch mit meinem Kochsalon vertreten - in Form einer Kochschule. Vertreter der jungen Haubenköche-Vereinigung "Jeunes Restaurateurs" zeigten ihre besten Tricks und Techniken aus der Profiküche für uns zu Hause zum Nachmachen. Den Beginn machte Lukas Nagl vom Restaurant Bootshaus am Traunsee und gab eine Lehrstunde im Umgang mit rohem Fisch - filetieren, häuten, entgräten. Das Ganze dann zu einer "Seeviche" verarbeitet. Sehr spannend. AT 2019
- eventId: 1276552
  start: 2026-09-30T05:30:00Z
  stop: 2026-09-30T05:38:00Z
  title: Mein wunderbarer Kochsalon - Seesaibling "Hausfrauen-Art"
  subtitle: Mein wunderbarer Kochsalon - Seesaibling "Hausfrauen-Art"
  description: Als meine Tochter noch kleiner war, fragte sie mich, ob jeder Fisch braun und knusprig durch das Meer schwimmt. Nein, Lilly, Fische kommen nicht mit Panier auf die Welt. Aber wie bekommt man sie richtig hin? Fisch hat mir immer schon gehörigen Respekt eingejagt, dabei braucht man nur etwas Gefühl - für Zeit und Fingerspitzen - und dann kann nicht viel schiefgehen. Vor allem mit dieser Methode, die mir Sören Herzig zeigte. Nach Hausfrauen-Art. Also diese Hausfrau wäre ich gerne. AT 2019
- eventId: 1276553
