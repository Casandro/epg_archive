  description: From Malta to Brussels and beyond, Vanessa Macdonald sits down with the European Commissioner responsible for Youth, Culture, Sport and Intergenerational Fairness to talk about the issues shaping the future of Europe and the Mediterranean. From protecting artistic freedom and investing in culture to creating more opportunities for young people, the conversation explores why these areas should be seen as an investment in people rather than simply a cost.
