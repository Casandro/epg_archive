  subtitle: ' '
  description: Malini explores Calabria, a hidden gem in Southern Italy. While its coastal towns like Tropea and Scilla boast turquoise seas, Calabria’s true charm lies in its rural interior, where traditions like handmade pasta, cheese, and salami are still alive. She visits ghost villages like Pentedattilo in the Aspromonte mountains and experiences authentic Calabrian culture, food, and hospitality, hosted by Calabria Etnica.
