  title: Tra Reggio e Messina lo Stretto necessario
  subtitle: ' '
  description: Valentina Caruso and Francesco Gasparri explore the Strait of Messina, where unique underwater currents create an oceanic ecosystem within the Mediterranean. Diver Domenico Majolino and marine biologist Simona Ratti explain its natural wonders, while Vincenzo Annuario tells the story of the Cariddi ferry, reborn after serving in the navy. At the National Archaeological Museum of Reggio Calabria, we discover the legacy of Magna Grecia and the famous Riace Bronzes. The 1908 earthquake that devastated Messina and Reggio Calabria is commemorated at the Regional Museum of Messina with the exhibition "1908 City Museum".
