  title: Historic Homes - Unser neues altes Zuhause
  subtitle: Auf den Spuren großer Künstler
  description: "Für Nik ist es eine Herzensangelegenheit, ein verfallenes Cottage auf Guernsey zu restaurieren. Trotz heftiger Regenfälle und unwegsamen Geländes kämpft er unermüdlich, um das historische Gebäude wiederherzustellen. Das Cottage, einst eine Kaserne aus dem 18. Jahrhundert, hat eine faszinierende Geschichte und diente als Aussichtspunkt während der Napoleonischen Kriege. Nik verwendet recycelte Materialien und traditionelle Techniken, um die Authentizität zu bewahren. Unterstützt wird er von Steinmetz Matt und Schreiner Mark, die ihm helfen, das Dach und die Kaminwand zu bauen. Ziel ist es, das Cottage als Ferienhaus für Paare und kleine Familien zu vermieten. \nGBR 2023"
