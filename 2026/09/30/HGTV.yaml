  title: 'Familie Holmes: Die Hausretter'
  subtitle: Ein Aufzug für Noah
  description: "Iwan und Ivona erlebten einen schweren Rückschlag, als ein betrügerischer Bauunternehmer ihnen eine chaotische Küche hinterließ, während Ivona kurz vor der Entbindung stand. Die Situation eskalierte weiter, als ihr Sohn Noah an Krebs erkrankte und seine Beine nicht mehr nutzen konnte. Bevor die Familie Holmes das Haus barrierefrei gestalten kann, müssen sie zunächst die gefährlichen baulichen Mängel beseitigen, die durch den schlechten Bauunternehmer verursacht wurden. Gleichzeitig kämpfen Mike, Michael und Sherry damit, dass vom Wasser durchfeuchtete Zuhause von Marc und Helene wiederherzustellen. \nCAN 2021"
  widescreen: true
- eventId: 1282839
  start: 2026-09-30T23:05:00Z
  stop: 2026-09-30T23:25:00Z
  title: 'Familie Holmes: Die Hausretter'
  subtitle: Freie Bahn für Noah
  description: "Hausbesitzerin Angela, eine furchtlose Motorradrennfahrerin, hat beim Thema Renovierungen die weiße Fahne geschwenkt. Nach einer herausfordernden Erfahrung mit einem einschüchternden Bauunternehmer fühlt sie sich nicht mehr bereit, sich dem Renovierungsstress alleine zu stellen. Mike, Michael und Sherry stehen vor der Aufgabe, ihr zu helfen, während sie sich mit gefährlichen Gaslecks, schlampiger Arbeit und einem Hauptgeschoss auseinandersetzen müssen, das in den 80er-Jahren stehen geblieben ist. Parallel dazu schenkt die Familie Holmes dem fünfjährigen Noah und seinen Eltern ein barrierefreies Zuhause, das ihr Leben für immer verändern wird. \nCAN 2021"
  widescreen: true
