  description: 'Dr. Roland Heilmann möchte seine Frau Pia mit einer Höhlenbesichtigung überraschen. Auf der Fahrt dorthin kommen sie allerdings von der Route ab und sind plötzlich ganz in der Nähe ihres Traumhauses: ein altes romantisches, jedoch sehr baufälliges Haus. Roland und Pia fahren noch einmal hin und entscheiden sich schweren Herzens gegen das alte Haus und für die vernünftigere Alternative: einen Neubau. Endlich an der Höhle angekommen, lernen sie Valerie Hoppe und ihren Verlobten Uwe Fink kennen. Während der Besichtigung kommen die Vier ins Plaudern, doch plötzlich ist Uwe verschwunden.'
