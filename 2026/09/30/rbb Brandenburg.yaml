  description: |-
    Bertram Möbius wird nach einem Sturz in die Sachsenklinik eingeliefert. Dort lernt er den etwas mürrischen Elektriker Karl-Heinz Griese kennen. Als Karl-Heinz entlassen wird, bittet ihn Bertram, in seiner Wohnung nach seinem Hamster zu sehen. Dort findet Karl-Heinz eine Schachtel mit sehr viel Geld, von der Bertram ihm erzählt hat. Zeitgleich erfährt Bertram, dass Karl-Heinz Griese verschuldet ist und hat nun Angst, bestohlen zu werden. Er verlässt die Klinik und bringt sich in Lebensgefahr.
