  title: Sprintour - Eine Reise zum Machu Picchu
  subtitle: Sprintour - Eine Reise zum Machu Picchu
  description: Machu Picchu, eine von den Inkas erbaute Stadt in den Anden in Peru, die man unbedingt auf der Bucket List haben sollte. Einen Monat im Voraus muss man die Tickets für den Machu Picchu in Peru buchen. Es ist die Touristenattraktion schlecht hin. Wir reisen normalerweise mit unserem Wohnmobil durch Peru. Für dieses Ziel in Peru haben wir allerdings einen Bus von Cusco nach Hidroelectrica genommen. Dort ausgestiegen kann man die Bahn nach Aguas Calientes nehmen, was wir aber nicht machen. Wir laufen den kompletten Weg von Hidroelectrica zum Campingplatz, welcher direkt am Eingang zum Machu Picchu ist. Der Weg ist wunderschön und führt durch den Wald immer an den Bahngleisen entlang.Wir haben circa drei Stunden dafür gebraucht. Am Camping Municipal angekommen, breiten wir zuerst unser Zelt aus und essen zu Abend. Am nächsten Morgen klingelt unser Wecker recht früh und wir laufen eine Stunde hoch durch ein im Nebel versunkenes Gebiet. Oben folgt eine sehr anstrengende Wanderung auf den Berg. Es führen gefühlt mehrere tausende Treppen hoch auf den Gipfel. Leider haben wir auch Pech mit dem Wetter und der Berg versinkt in Wolken und Nebel. Normalerweise kann man von dem Waynapicchu eine wunderbare Aussicht auf den Machu Picchu genießen. Leider nicht an diesem Morgen. Danach folgt der zweite Rundgang an dem Tag. So besuchen wir Terrassen, von den man den besten Blick auf den Machu Picchu hat. Danach folgt die Inka-Brücke und wir machen uns nach dem anstrengenden Tag auf den Weg nach unten. Wieder ganz schön viele Treppen! Es folgt eine weitere Übernachtung auf dem Campingplatz bevor wir dann zurück nach Hidroelectrica entlang der Bahngleise laufen und von dort aus den Bus zurück nach Cusco nehmen. PE 2024
  ageRating: 12
