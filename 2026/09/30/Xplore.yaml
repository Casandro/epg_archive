  title: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  description: Begleiten Sie den beliebten Schauspieler Jürgen Heinrich in den tropischen Teil Australiens, nach Queensland. Dieser Teil des 5. Kontinents ist besonders für seine vielfältige Flora und Fauna bekannt. Die  Reise beginnt im kleinen Städtchen Noosa Heads. Mit seinen rund 4.000 Einwohnern ist Noosa Heads ein wahres Surferparadies und lädt mit seiner belebten Innenstadt und seinen herrlichen Stränden zum Verweilen ein. Per Schiff gelangt Jürgen Heinrich schließlich in die Noosa Everglades. Ein Wasser- und Sumpfgebiet in das sich Tausende von Vögeln und Reptilien wie Warane zurückgezogen haben. Das Great Barrier Reef mit seiner einzigartigen, aber auch höchst gefährdeten  Unterwasserwelt ist das nächste größere Ziel. Ein Helikopter setzt Jürgen Heinrich und sein Team auf Hayman Island ab.  Schon beim Flug dorthin werden die ersten Ausläufer des rund 2300 km langen Riffs deutlich.  Schon allein die Korallenformationen, welche sich durch das türkisblaue Wasser schlängeln, zeichnen ein aus der Luft erkennbares, atemberaubendes Bild. Am nächsten Tag geht es per Boot endlich ins Zentrum des Great Barrier Reefs und hier kann Jürgen Heinrich endlich in die weltberühmte Unterwasserwelt abtauchen. DE 2014
