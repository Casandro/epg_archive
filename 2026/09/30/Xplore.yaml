  stop: 2026-09-30T14:30:00Z
  title: Sprintour - Ist Vanlife in Ecuador gefährlich?
  subtitle: Sprintour - Ist Vanlife in Ecuador gefährlich?
  description: Wir reisen mit unserem Wohnmobil durch Ecuador und erkunden zuerst einen typischen Markt in Ecuador in Otavalo. Dieser Ort befindet sich nicht weit weg von dem Äquator in Ecuador. Und es ist so ein typischer Markt in Ecuador, auf dem man alles findet, nur keine Touristen. So kaufen wir uns einen Pullover aus Schafwolle und probieren endlich gegrillte Bananen aus. Super lecker und sättigend! Weiter geht es mit unserem Wohnmobil zu einer Hängemattenmanufaktur, die tatsächlich aus einem Ein-Mann-Betrieb besteht. Er macht alles selber, weshalb wir uns auf alle Fälle eine Hängematte aus Ecuador gönnen. Unser Wohnmobil kämpft sich dann schlechte Straßen bis zu einem Campingplatz hoch. Am nächsten Morgen wandern wir entlang der Laguna de Cuicocha. Ein wunderschöner Wanderweg um die Lagune herum. In der Nähe gab es allerdings einen bewaffneten Überfall auf einen Camper. Das liest man leider nicht so selten in Ecuador. In dem Lang kommt es vor allem an wilden Stellplätzen zu Überfällen. Das ist auch der Grund warum wir mit unserem Wohnmobil auf einen Campingplatz gegangen sind. Wir haben uns immer sehr sicher gefühlt in Ecuador, allerdings ist es nur unsere Momentaufnahme. Man muss alles in allem sehr vorsichtig sein, vor allem bei Übernachtungen im Wohnmobil! EC 2023
