  title: Sprintour - Härteste Offroadpiste in Peru
  subtitle: Sprintour - Härteste Offroadpiste in Peru
  description: Wir sind mit unserem Wohnmobil in Peru unterwegs und planen zu dem Huascarán Nationalpark zu fahren. Die Fahrt dorthin wird ganz schnell zum Albtraum! Das Navi schickt uns einen Weg hoch, den wir ohne Allrad und genug Bodenfreiheit einfach nicht fahren können. Die Straße wird immer enger und steiler. Zudem kommen uns permanent Fahrzeuge entgegen. An einer Stelle kommen wir mit unserem VW Crafter Wohnmobil gar nicht mehr weiter und müssen umdrehen. Leichter gesagt als getan. Wendemöglichkeiten sind bei dieser Offroadstrecke eher Fehlanzeige! So wird diese Strecke zu einer richtigen Herausforderung! Irgendwann kommen wir in dem Huascarán Nationalpark an und können die wunderschöne Wanderung zu der Laguna 69 machen. Wir sind umgeben von schneebedeckten 6000ern und können die Schönheit der Natur nicht in Worte fassen. Weiter geht es für uns auf der Panamericana in Peru in Richtung Ecuador. Wir folgen mit unserem Camper allerdings nicht dem typischen Weg der Panamericana. Wir fahren lieber den Weg durch die Berge in Peru und Ecuador. Es ist ein Traum! Die Straßen sind zum größten Teil asphaltiert und Ecuador verzaubert uns mit den wunderschönen, grünen Bergen. Nachts kommen wir im Podocarpus Nationalpark an und müssen uns zuerst einmal nach der langen Fahrt im Wohnmobil ausruhen. Was für eine Natur! Ecuador, wir kommen! PE 2023
