  title: Sprintour - Härteste Offroadpiste in Peru
  subtitle: Sprintour - Härteste Offroadpiste in Peru
  description: Wir sind mit unserem Wohnmobil in Peru unterwegs und planen zu dem Huascarán Nationalpark zu fahren. Die Fahrt dorthin wird ganz schnell zum Albtraum! Das Navi schickt uns einen Weg hoch, den wir ohne Allrad und genug Bodenfreiheit einfach nicht fahren können. Die Straße wird immer enger und steiler. Zudem kommen uns permanent Fahrzeuge entgegen. An einer Stelle kommen wir mit unserem VW Crafter Wohnmobil gar nicht mehr weiter und müssen umdrehen. Leichter gesagt als getan. Wendemöglichkeiten sind bei dieser Offroadstrecke eher Fehlanzeige! So wird diese Strecke zu einer richtigen Herausforderung! Irgendwann kommen wir in dem Huascarán Nationalpark an und können die wunderschöne Wanderung zu der Laguna 69 machen. Wir sind umgeben von schneebedeckten 6000ern und können die Schönheit der Natur nicht in Worte fassen. Weiter geht es für uns auf der Panamericana in Peru in Richtung Ecuador. Wir folgen mit unserem Camper allerdings nicht dem typischen Weg der Panamericana. Wir fahren lieber den Weg durch die Berge in Peru und Ecuador. Es ist ein Traum! Die Straßen sind zum größten Teil asphaltiert und Ecuador verzaubert uns mit den wunderschönen, grünen Bergen. Nachts kommen wir im Podocarpus Nationalpark an und müssen uns zuerst einmal nach der langen Fahrt im Wohnmobil ausruhen. Was für eine Natur! Ecuador, wir kommen! PE 2023
  ageRating: 12
- eventId: 1276521
  start: 2026-09-30T06:55:00Z
  stop: 2026-09-30T07:16:00Z
  title: Sprintour - Ist Ecuador das schönste Land der Welt?
  subtitle: Sprintour - Ist Ecuador das schönste Land der Welt?
  description: Nach Peru sind wir mit unserem Wohnmobil nach Ecuador eingereist. Bereits an der Grenze waren wir sehr überrascht von der wunderschönen Natur und den guten Straßen in Ecuador. Wir starten dieses Vanlife Video in Banos und fahren mit unserem Camper zu einem wunderschönen Wasserfall auf der sogenannten Wasserfall-Route. Das ist eine Straße die mitten durch das Amazonasgebiet führt und einige Wasserfälle auf dem Weg ausgewiesen sind. Hier ist die Natur in Ecuador grün und saftig und die Weite des Amazonas beeindruckt uns sehr. Das ist eindeutig eine der schönsten Straßen, die wir mit unserem Wohnmobil überhaupt gefahren sind. Wir machen Halt auf einem Campingplatz mitten im Dschungel und haben leider keine so gute Nacht, weil es die ganze Nacht gewittert. Das Baden im Naturpool im Amazonas entschädigt uns für die unruhige Nacht und wir genießen den Regenwald in Ecuador. Danach geht es für uns zu einer Kakaoplantage, die nicht weit weg von dem Campingplatz ist. Dort stellen sie biologisch angebauten Kakao her. Hier machen wir eine tolle Führung durch Kakaoplantagen und gehen den Prozess der Schokoladenherstellung von der Pflanze bis zur fertigen Schokolade durch. Und dann können wir die leckere und selbst gemachte Schokolade aus Ecuador probieren. Ein Traum! Am selben Tag dürfen wir eine Höhle im Amazonasgebiet besuchen, was zu einer großartigen Erfahrung wird und genießen noch das Vanlife auf dem wunderschönen Campingplatz in Ecuador. So haben wir Ecuador nicht erwartet und sind sehr positiv überrascht. Vor allem mit dem Camper war es eine tolle Erfahrung! EC 2024
  ageRating: 12
- eventId: 1276529
  start: 2026-09-30T07:20:00Z
  stop: 2026-09-30T07:35:00Z
  title: Sprintour - Ist Vanlife in Ecuador gefährlich?
  subtitle: Sprintour - Ist Vanlife in Ecuador gefährlich?
  description: Wir reisen mit unserem Wohnmobil durch Ecuador und erkunden zuerst einen typischen Markt in Ecuador in Otavalo. Dieser Ort befindet sich nicht weit weg von dem Äquator in Ecuador. Und es ist so ein typischer Markt in Ecuador, auf dem man alles findet, nur keine Touristen. So kaufen wir uns einen Pullover aus Schafwolle und probieren endlich gegrillte Bananen aus. Super lecker und sättigend! Weiter geht es mit unserem Wohnmobil zu einer Hängemattenmanufaktur, die tatsächlich aus einem Ein-Mann-Betrieb besteht. Er macht alles selber, weshalb wir uns auf alle Fälle eine Hängematte aus Ecuador gönnen. Unser Wohnmobil kämpft sich dann schlechte Straßen bis zu einem Campingplatz hoch. Am nächsten Morgen wandern wir entlang der Laguna de Cuicocha. Ein wunderschöner Wanderweg um die Lagune herum. In der Nähe gab es allerdings einen bewaffneten Überfall auf einen Camper. Das liest man leider nicht so selten in Ecuador. In dem Lang kommt es vor allem an wilden Stellplätzen zu Überfällen. Das ist auch der Grund warum wir mit unserem Wohnmobil auf einen Campingplatz gegangen sind. Wir haben uns immer sehr sicher gefühlt in Ecuador, allerdings ist es nur unsere Momentaufnahme. Man muss alles in allem sehr vorsichtig sein, vor allem bei Übernachtungen im Wohnmobil! EC 2023
