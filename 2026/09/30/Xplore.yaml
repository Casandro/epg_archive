  title: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  subtitle: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  description: Dieses Mal präsentiert die TV-Moderatorin Andrea Kiewel das Land Israel. Auf ihrer Reise erforscht sie eine facettenreiche Reisedestination, die neben einer jahrtausendealten Kultur und vielen religiösen Heiligtümern zahlreiche weitere Attraktionen aufweisen kann. Erstes Ziel der Reise ist die Altstadt Jerusalems. Hier leben 45000 Muslime, Juden und Christen auf engstem Raum zusammen. Um diesen besonderen Lebensraum besser kennenzulernen, besucht Andrea Kiewel die wichtigsten Stätten der drei Weltreligionen. Dazu gehören unter anderen die Klagemauer und die Grabeskirche. Einer der bedeutendsten und eindrücklichsten Orte israelischer Erinnerungskultur ist die Gedenkstätte Yad Vashem. Sie erinnert an die Judenvernichtung im Holocaust. Zurück auf den gepflasterten Wegen der historischen Altstadt kann die Moderatorin den kleinen Geschäften und Souvenirständen kaum entkommen. Nach mehreren gescheiterten Versuchen, ein Andenken für zuhause zu 'erhandeln', verlässt sie schließlich die Stadt und macht sich auf den Weg zum Toten Meer. Eine lange Reise ist dies jedoch nicht. Nach eineinhalb Stunden Fahrzeit gönnt sich Andrea Kiewel ihr erstes Bad im stark salzhaltigen Gewässer ' natürlich ohne im Wasser unterzugehen. Das nächste Reiseziel ist die Weltstadt Tel Aviv. Die größte Stadt des Landes ist das Zentrum modernen israelischen Lebens. Zusammen mit dem deutschen Starkoch Tom Franz, der seit 2004 in der Stadt lebt, entdeckt sie die mediterrane Küche auf den vielen Märkten der Stadt. Zum Abschluss unternimmt sie einen Abstecher zu einem der vielen Strände, bevor sie in das Nachtleben der jungen und lebensfrohen Metropole eintaucht. DE 2016
