  title: Sprintour - Ist Ecuador das schönste Land der Welt?
  subtitle: Sprintour - Ist Ecuador das schönste Land der Welt?
  description: Nach Peru sind wir mit unserem Wohnmobil nach Ecuador eingereist. Bereits an der Grenze waren wir sehr überrascht von der wunderschönen Natur und den guten Straßen in Ecuador. Wir starten dieses Vanlife Video in Banos und fahren mit unserem Camper zu einem wunderschönen Wasserfall auf der sogenannten Wasserfall-Route. Das ist eine Straße die mitten durch das Amazonasgebiet führt und einige Wasserfälle auf dem Weg ausgewiesen sind. Hier ist die Natur in Ecuador grün und saftig und die Weite des Amazonas beeindruckt uns sehr. Das ist eindeutig eine der schönsten Straßen, die wir mit unserem Wohnmobil überhaupt gefahren sind. Wir machen Halt auf einem Campingplatz mitten im Dschungel und haben leider keine so gute Nacht, weil es die ganze Nacht gewittert. Das Baden im Naturpool im Amazonas entschädigt uns für die unruhige Nacht und wir genießen den Regenwald in Ecuador. Danach geht es für uns zu einer Kakaoplantage, die nicht weit weg von dem Campingplatz ist. Dort stellen sie biologisch angebauten Kakao her. Hier machen wir eine tolle Führung durch Kakaoplantagen und gehen den Prozess der Schokoladenherstellung von der Pflanze bis zur fertigen Schokolade durch. Und dann können wir die leckere und selbst gemachte Schokolade aus Ecuador probieren. Ein Traum! Am selben Tag dürfen wir eine Höhle im Amazonasgebiet besuchen, was zu einer großartigen Erfahrung wird und genießen noch das Vanlife auf dem wunderschönen Campingplatz in Ecuador. So haben wir Ecuador nicht erwartet und sind sehr positiv überrascht. Vor allem mit dem Camper war es eine tolle Erfahrung! EC 2024
  ageRating: 12
- eventId: 1276571
