- eventId: 1319759
  start: 2026-09-30T09:05:00Z
  stop: 2026-09-30T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Hravá angličtina. Spoluzakladatel jazykové školy a ředitel britského nakladatelství Wattsenglish Marek Kadlec. Začít s výukou angličtiny už od raného věku dítěte, nebo až od třetího ročníku? Zatímco názory rodičů a odborníků se různí, spoluzakladatel jazykové školy a ředitel britského nakladatelství Wattsenglish Marek Kadlec, který má s výukou dvacetiletou zkušenost, nám prozradí, v čem spočívá metodika, podle níž se úspěšně učí děti už od mateřských škol.'
