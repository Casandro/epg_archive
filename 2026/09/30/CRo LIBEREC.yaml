  stop: 2026-09-30T17:00:00Z
  title: Setkání u mikrofonu
  description: Natáčela rozhovory s Václavem Havlem, Lucií Bílou, Davidem Vávrou nebo třeba s Ozzym Osbournem či Sinéad O'Connor. Při práci na rozhlasovém pořadu například strávila noc v jablonecké věznici Rýnovice, těžké chvíle zažila při natáčení během ničivých povodní na Lužické Nise v roce 2010 a pomáhala také zakládat současné studio Českého rozhlasu Liberec. Nejen o své reportérské práci, ale i o začátcích samostatného krajského rozhlasového vysílání vyprávěla v pořadu Setkání u mikrofonu Ivana Bernáthová. Ptal se jí Pavel Kudrna.
