  title: Ik vertrek
  subtitle: Wouter en Michelle S27 E07. Nederlanders die hun geluk in het buitenland gaan beproeven, worden gevolgd. De zon, vrijheid, mentaliteit of ouderwets ondernemerschap spelen een rol in deze verstrekkende beslissing.
  description: Ondernemers Wouter (39) en Michelle (33) verruilen Haarlem voor het Zweedse buitengebied. In Årsunda hebben ze een oude schapenboerderij gekocht, omringd door rust, natuur en paarden. Ze willen er retraites met en zonder paarden organiseren en een B&B beginnen. Al snel komen verborgen gebreken en onverwachte kosten aan het licht. Ook de Zweedse winter stelt het stel voor de nodige uitdagingen. Ondertussen wil Michelle de laatste 150 kilometer naar hun nieuwe thuis te voet afleggen. Lukt het Wouter en Michelle om de boerderij de winter door te helpen? (2026)
