  description: 'Marinella en haar man hebben hun Arnhemse huis door de jaren heen voortdurend verbouwd. Zo groeide de plek mee met hun gezin. Inmiddels zijn de jongens groot en woont alleen nog jongste zoon Binc thuis. Hij heeft een eigen muziekstudio in zijn kamer. * Chef-kok Sharon maakt knapperige nacho''s: kleine pakketjes van wrap, gevuld met krab en kruidige roomkaas. Ze serveert er een frisse salade bij. * Boswachter Marieke is in Zuid-Limburg voor Operatie Peperboompje. Het peperboompje is een zeldzame struik die met uitsterven wordt bedreigd en staat symbool voor ruim 100 ernstige bedreigde Zuid-Limburgse planten die dreigen uit te sterven. (2026)'
