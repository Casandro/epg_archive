  title: Scrubs - Die Anfänger
  subtitle: Mein Rückzieher Comedy-Serie, USA 2004
  description: 'Folge 67, Eigentlich sollte J.D. glücklich sein, hat er es doch endlich geschafft, Elliot zurückzuerobern. Aber leider hat er festgestellt, dass es in ihrer Beziehung ein erstes Problem gibt: Er liebt sie nicht. Das jedoch traut er sich ihr nicht zu sagen, vor allem, da Elliot einfach überglücklich mit ihm ist. Die Vorbereitungen zu Turks Hochzeit sind für ihn gerade deshalb eine Qual, weil er so täglich mit zwei Menschen zu tun hat, die scheinbar perfekt zueinander passen.'
- eventId: 1277717
