  title: Plötzlich Prinzessin 2
  subtitle: Teenagerkomödie, USA 2004
  description: 'Regie: Garry Marshall. Darsteller: Anne Hathaway, Julie Andrews, Hector Elizondo. Vor fünf Jahren hat der amerikanische Teenager Mia Thermopolis erfahren, dass sie eine europäische Prinzessin ist. Nun hat sie ihren College-Abschluss in der Tasche und ist bereit, ihr Amt in der kleinen europäischen Monarchie Genovien anzutreten. Kaum dort angekommen, muss sie jedoch erfahren, dass ihr ein Adelsvertreter versucht, die Krone streitig zu machen. Außerdem sieht ein genovisches Gesetz vor, dass die Thronanwärterin verheiratet sein muss, um Königin zu werden. Also muss Mia innerhalb von 30 Tagen einen adäquaten Bräutigam auftreiben. Anne Hathaway spielt in dem modernen Märchen "Plötzlich Prinzessin 2" erneut die tollpatschige Prinzessin Mia, für die es diesmal gilt - nicht ohne eine Reihe von komödiantischen Hindernissen - ein Herz und eine Krone zu erobern. Die Story knüpft fünf Jahre nach den Ereignissen im Original an, in dem die ungelenke Teenagerin Mia aus heiterem Himmel erfuhr, die Thronerbin des (fiktiven) europäischen Ministaates Genovien zu sein. Inzwischen hat Mia ihr Princeton-Studium abgeschlossen und begibt sich nun nach Genovien, um an ihrem 21. Geburtstag die Krone ihrer abdankenden Großmutter Clarissa Renaldi (Julie Andrews) zu übernehmen. Doch der machtgierige und intrigante Parlamentsabgeordnete Mabrey (John Rhys-Davies) möchte seinen Neffen Nicholas (Chris Pine in seinem Debüt) zum neuen König krönen. Daher besteht er auf dem Gesetz, dass eine weibliche Thronfolgerin verheiratet sein muss, um Königin zu werden. Mia hat 30 Tage Zeit, um einen angemessenen Bräutigam zu finden. Als adäquaten Heiratskandidaten einigt man sich schließlich auf den sympathischen, jedoch etwas farblosen Duke of Kenilworth (Callum Blue). Gleichzeitig befindet sich auf Einladung Mias auch ihr Rivale Nicholas im Schloss, von dessen Charme sie sich geradezu magisch angezogen fühlt. Die entscheidende Frage ist also, für wen sie sich entscheiden wird?!'
  widescreen: true
