  title: 'Franz von Assisi: Mit den Augen eines Verliebten sehen'
  subtitle: Der kostbare Schatz
  description: Franziskus ist der Mann des Evangeliums, der einen Schatz gefunden hat, um dessen Willen er alles verkauft. Er gleicht dem Kaufmann, der um einer kostbaren Perle Willen alles hingibt. Für ihn sind Gehorsam und Ehelosigkeit nicht Defizite sondern Zeichen einer größeren Freiheit. Wer gehorcht, verzichtet auf seinen Eigenwillen und vertraut ganz dem liebenden Willen Gottes - wer ehelos lebt, hat die größere Liebe entdeckt, die jede menschliche Beziehung weit übersteigt.
