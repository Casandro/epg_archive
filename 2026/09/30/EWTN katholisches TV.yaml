  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Ihr seid gesendet!
  description: '''Ite, missa est'', so lautet die sogenannte Entlassungs- oder Sendungsformel am Ende jeder Heiligen Messe. Die deutsche Übersetzung ''Gehet hin in Frieden!'' gibt nicht wirklich wieder, was der lateinische Text besagt. Dem Sinn nach bedeutet er vielmehr: ''Gehet! Ihr seid gesendet''. Vom ''missa est'', vom Gesendet-Sein, hat die Messe ihren Namen. Aus der Begegnung mit Christus in der heiligen Eucharistie folgt mit stringenter Notwendigkeit der Auftrag zur Mission. Monsignore Schroedel erläutert warum. Wir sind gesendet, jedem mit Verstand und Herz Antwort zu geben, der nach dem Grund unserer Hoffnung fragt.'
  widescreen: true
