  title: GRANDIOS (4. Staffel)
  subtitle: Alexa und Christof Gaspari
  description: 'Alexa und Christof Gaspari wissen, dass sie sich immer aufeinander verlassen können. Jede Ehe durchlebt Krisen, Spannung und Harmonie, dessen sind sie sich bewusst und sind überzeugt: Es geht nicht ohne Vorbilder. Es braucht Vertrauen in Vertrauenspersonen. Deshalb sei es auch wichtig, den Kindern zuliebe in Krisen um die Ehe zu kämpfen und zu zeigen: "Es ist schön. Es geht." Ob sich das lohnt, das erzählen sie GRANDIOS in einem exklusiven Interview.'
  widescreen: true
