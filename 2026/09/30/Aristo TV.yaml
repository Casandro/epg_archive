  title: ERF Mensch Gott - Gott gibt _s echt! - Keine Kraft zum Leben
  description: Es ist kalt und dunkel als Lena Johanna einsam auf die Brücke zugeht. Der Kampf gegen den Krebs hat sie viel Kraft gekostet und in der Pandemie hat sie ihren Zweitjob in der Gastronomie verloren. Obwohl sie sich in der Zeit auch als Friseurin selbständig macht und ihre Kunden zuhause besucht, liegt die Depression wie eine schwarze Decke auf ihrer Seele. Jeder Tag kostet sie mehr Energie, als sie aufbringen kann. Dann springt sie.
