  title: ERF - Jess Talkwerk - Woraus ziehst du deinen Selbstwert?
  description: 'Dero Goi war Frontmann der Band "Oomph!", die Band stand für "neue deutsche Härte". Nach über 30 Jahren hat er die Band verlassen. Sein Sohn war mit 3 Jahren an Krebs erkrankt und Dero suchte nach dem Sinn im Leben. Tina Tschage liebt die persönliche Arbeit mit ihren Klienten. Sie sollen sprachfähiger und sich selbst bewusster werden. Manuel Bühler wolle Profifußballer werden. Die Chancen dazu standen sehr gut, bis ihm in einem Testspiel ein fatalen Fehler unterlief. Zudem kamen noch diverse Verletzungen und schließlich blieb nichts Anderes übrig: Viel zu früh musste er seine Karriere an den Nagel hängen. Mittlerweile begleitet er Fußballprofis.'
  widescreen: true
