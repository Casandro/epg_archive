  title: So schmeckt die Welt - Sizilien
  description: Von den Göttern erschaffen, von Menschen oft geplündert und vom Vulkan Etna stets bedroht. Sizilien ist mehr als nur eine Insel im Mittelmeer, Sizilien ist sichtbare Geschichte, greifbare Geologie und erlebbares grossesganzgrosses Drama.Gewiss der Italiener liebt die explosiven Gesten und Worte, doch der Sizilianer scheint bis in die kleinste Nervenzelle von seinem Vulkan Etna befeuert zu sein. Die Sizilianer sind von allem ein bisschen mehr als der Rest des Landes. Ein bisschen lauter, ein bisschen leidenschaftlicher, ein bisschen stolzer ja und vielleicht auch ein bisschen ärmer. Aber nicht an Gastfreundschaft hier glühen sie wieder auf und geben die Wärme an jeden Besucher weiter.Mag es daran liegen, dass die Sizilianer selbst keine richtigen Wurzeln haben, geprägt von griechischen, spanischen wie auch byzantinischen Einflüssen und das Fremde daher auch Symbol für Heimat ist.
  widescreen: true
