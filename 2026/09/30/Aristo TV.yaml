  title: ANIXE auf Reisen - Sabah/Malaysia mit Richy Mueller
  description: Heute begleitet Anixe den Schauspieler und Tatort-Kommissar Richy Müller auf seiner Reise durch den malaysischen Teil der Insel Borneo. Im Bundesstaat Sabah, in den Tiefen des Dschungels, begegnet er uralten malaysischen Traditionen, kaum berührt vom Leben der Moderne. Auch sportliche Aktivitäten, sowie körperliche und geistige Entspannung gehören zu einer Reise durch Sabah dazu. River Rafting und Tauchgänge in der spektakulären Unterwasserwelt Malaysias sind die Highlights der Reportage. In Sabah trifft Richy Müller auf einen Teil des ältesten und ursprünglichsten Regenwaldes der Welt.  An einem anderen Tag hilft er bei der Teeernte und erfährt viel Wissenswertes über das wohl berühmteste Getränk Asiens. Begleiten Sie den Schauspieler in die letzten Rückzugsgebiete der Orang-Utans und erfahren Sie, warum diese Menschenaffen vom Aussterben bedroht sind.
