  title: Entdecke die Welt - Nürnberg
  description: 'Nürnberg - Tradition trifft Moderne. Die Doku blickt hinter die Kulissen der fränkischen Metropole: vom Museum im Stadtzentrum über die Gießerei Lenz, wo Denkmäler entstehen, bis zur Werkstatt für Blechblasinstrumente. Dazu eine Kaffeerösterei mit Leidenschaft, Fußballgeschichte beim 1. FC Nürnberg und kulinarische Höhenflüge mit Sternekoch Felix Schneider. Ein facettenreiches Porträt der Stadt zwischen Handwerk, Kultur und Genuss.'
