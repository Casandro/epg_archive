  title: GRIPS Englisch (16)
  subtitle: 'Wiederholungszahlen: once, twice, three times'
  subtitled: true
  description: Einmal am Tag eine Stunde Sport und das dreimal die Woche. So wirst du fit - nicht nur körperlich, sondern auch im Umgang mit Wiederholungszahlen. Wir zeigen dir, wie du "einmal" und "dreimal" auf Englisch sagst.
- eventId: 739175
  start: 2026-09-30T05:15:00Z
  stop: 2026-09-30T05:30:00Z
  title: GRIPS Englisch (17)
  subtitle: 'Adjektive vergleichen: as'
  subtitled: true
  description: Du bist so groß wie dein Freund, dafür aber nicht so schnell wie er? Beruhigend, dass wenigstens dein Handy so toll wie seines ist ... Das alles sind Vergleiche. In dieser Lektion lernst du, wie du sie im Englischen bildest.
- eventId: 739176
  start: 2026-09-30T05:30:00Z
  stop: 2026-09-30T05:55:00Z
  title: Willi wills wissen (126)
  subtitle: Was geht im Rollstuhl?
  subtitled: true
  description: "Viel geht im Rollstuhl! Zum Beispiel Basketballspielen. Bei der Kindermannschaft des USC München darf Willi heute mittrainieren. Natürlich auch im Rollstuhl, Fußgänger sind nicht erlaubt! Willi lernt dort Claudio kennen. Er sitzt von Geburt an im Rollstuhl und weiß gar nicht, wie es ist, zu laufen. \nViele Menschen werden durch einen Unfall querschnittgelähmt. Willi besucht Oberarzt Jürgen im SRH Klinikum Karlsbad-Langensteinbach. Er erklärt ihm, was Querschnittlähmung genau bedeutet und wie sie entsteht."
- eventId: 739177
