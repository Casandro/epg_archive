  title: Planet Weltweit - Cranberrysaison auf Cape Cod
  subtitle: Planet Weltweit - Cranberrysaison auf Cape Cod
  description: "Die Halbinsel Cape Cod an der Ostküste  der USA: Mit ihren endlosen Stränden und buntgefärbten Wäldern im Indian Summer ist sie ein beliebtes Urlaubsziel. Auch die Schönen und Reichen Amerikas haben auf der sichelförmigen Landzunge ihre Sommerresidenzen. Für die Einheimischen bestimmte der Walfang Jahrhunderte lang den Alltag. Heute sind dagegen Cranberries der größte Wirtschaftsfaktor der Region. Die roten Beeren werden weltweit immer beliebter, ihr Anbau bleibt jedoch kompliziert. \n\nKein Thanksgiving ohne Cranberries! Das gilt zumindest für die USA, wo das Erntefest und Cranberries - zu deutsch Kran- oder Moosbeeren -  einfach  zusammengehören. Der Legende nach haben die Pilgerväter der Mayflower, die im November 1620 die Küste von Cape Cod erreichten, auch dank des Verzehrs der sauren roten Beeren den ersten harten Winter überstanden. Für heutige Cranberry-Farmer wie Keith und Monica Mann ist der Anbau und die Ernte der kleinen Kraftpakete auf ihren rund 60 Hektar nicht einfach. Die Früchte sind überaus anspruchsvoll und sehr wetterfühlig. Um sie während der kurzen Erntephase pflücken zu können, werden die Felder unter Wasser gesetzt und die Beeren mit eigens entwickelten Maschinen von den Sträuchern gekrault. Kleine Luftkammern lassen die reifen Früchte an die Wasseroberfläche steigen, wo sie sich zu einem farbenprächtigen roten Meer verdichten. Das Ehepaar Mann und ihre Erntehelfer waten im hüfttiefen kalten Wasser, wenn sie die sanft schaukelnden Beeren einsammeln. Um den Absatz ihrer Cranberries müssen sich die Farmer keine großen Sorgen machen. Seit Wissenschaftler herausgefunden haben, dass die roten Beeren auch vor Krankheiten wie Krebs und Diabetes schützen können, ist die Nachfrage noch gestiegen. Noch während der Ernte verbringen Monika Mann und ihre Tochter Maggie die Abende bereits mit der Zubereitung von Cranberry-Kompott, Cranberry- Punsch und allen möglichen Cranberry-Soßen, denn die nass geernteten Beeren sind nicht lange haltbar.\n\n DE 2010"
