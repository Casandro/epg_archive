  title: Planet Weltweit - An den Ufern der Loire
  subtitle: Planet Weltweit - An den Ufern der Loire
  description: |-
    Die Loire im Herzen Frankreichs ist einer der letzten wilden Flüsse Europas. Staudämme und  Flussbegradigungen konnten bis heute verhindert werden, der Fluss windet sich über seine gesamten 1020 Kilometer durch ein natürlich geschaffenes Bett. Die Menschen an seinen Ufern haben sich eine  eigene Kultur bewahrt, leben in Tuffsteinhäusern, ziehen Wein und züchten alte andernorts längst  verschwundene Gemüsesorten. Ihr Leben verteidigen sie standhaft gegen moderne Einflüsse. Der Maler Jean-Jack Martin ist einer dieser Menschen, die im Rhythmus dieses längsten Flusses Frankreichs  leben.

    Das ganze Jahr ist der Maler und Zeichner Jean-Jack Martin an den Ufern der Loire unterwegs, um  die schönsten Motive für seine Werke zu finden. Der Herbst ist jedoch auch für ihn eine ganz  besondere Jahreszeit: Der Wein wird geerntet, die Vögel sammeln sich für den Flug gen Süden, und  die Herbsthochwasser lassen den Fluss über die Ufer treten. In manchen Nächten um einen guten Meter. Ohne Kanal oder Staudämme verteilt sich das Wasser schnell in die toten Nebenarme. Dadurch  nimmt es Schlamm und organische Stoffe in sich auf, die als Nährstoffe für die Fische dienen. Viele gibt es heute davon wieder im Fluss, etwa Welse und Meeräschen, die aus dem Atlantik gewandert kommen. Ein Segen für die Fischer. Sie liefern ihren Fang an die Restaurants der Region. Dort werden für die Loire typischen Fischspezialitäten zubereitet. Das gesamte Leben entlang des Flusses blüht und gedeiht, auch wenn es auf den ersten Blick eher ruhig und beschaulich wirkt. Viele einheimische Bräuche und Riten haben sich bis heute gehalten, wie etwa das Boule-de-Fort- Spiel, das von den Schifferleuten der Loire erfunden wurde. Die Spielbahn ist inspiriert vom Rumpf  der Schiffe, die den Fluss hinauffuhren. Jean-Jack Martin lebt im sogenannten "Tal der Könige",  jenem Flussabschnitt zwischen Tours und Candes St. Martin, der von der UNESCO Jahr 2000 zum Weltkulturerbe erklärt wurde. DE 2008
