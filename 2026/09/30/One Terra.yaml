  title: Planet Weltweit - Indien, heilendes Ayurveda
  subtitle: Planet Weltweit - Indien, heilendes Ayurveda
  description: "Ayurveda ist 'Die Reinigung des gesamten Körpers, innerlich und äußerlich, um Abfall-Produkte aus dem Körper auszuleiten, um Stoffwechsel-Gifte und chemischen Rückstände zu beseitigen', so Dr. Shrivastava, Oberarzt an der Universitätsklinik in Varanasi. Das ayurvedische Wissen wird seit Jahrhunderten in den Familien der Vaidijas bewahrt - und auch von der Schulmedizin akzeptiert und praktiziert.\nKrankheiten wie Arthritis oder Diabetes entstehen gemäß 'Ayurveda' durch toxische Stoffe, wenn die drei biophysiologischen Kräfte des Körpers - die sogenannten 'Doshas' - aus dem Gleichgewicht geraten. Diese strömen dann in fremde Körperareale und lagern mitgeführte Giftstoffe ab. Die Banaras Hindu University im indischen Varanasi lehrt neben moderner auch ayurvedische Medizin. Medizin-Studenten lernen hier die Errungenschaften der modernen Medizin mit der jahrtausende alten Ayurveda-Lehre zu verknüpfen. Wir haben einen jungen Ayurveda-Arzt und seine Patienten begleitet.\nAmrit Godbole arbeitet als Assistenzarzt der Ayurveda-Fakultät an der Universitätsklinik in Varanasi. Seine Patientin Aruna leidet an chronischer Arthritis, Körper und Gelenke sind schwer gezeichnet. Die moderne Schulmedizin hat darauf keine Antwort. Krankheiten entstehen laut der Ayurveda-Medizin wenn die drei Säulen der physiologischen Regulation sämtlicher Körperfunktionen, die sogenannten Doshas, aus dem Gleichgewicht geraten. Dieses Ungleichgewicht beginnt im Magen-Darm-Trakt, darum beginnen die ayurvedischen Behandlungen mit einer Darmentleerung, daran schließt sich eine intensiven Wärmebehandlung an um den Stoffwechsel anzuregen, unterstützt von Massagen und bestimmten Kräutermixturen. Die Behandlungen bei Aruna zeigen erstaunliche Erfolge. \n DE 2016"
