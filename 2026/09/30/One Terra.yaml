  title: Planet Weltweit - Kaviar - Der Schatz aus dem Iran
  subtitle: Planet Weltweit - Kaviar - Der Schatz aus dem Iran
  description: |-
    Echter Wildkaviar aus dem Kaspischen Meer gehört zu den teuersten Delikatessen überhaupt. Feinschmecker in Europa zahlen bis zu 1400 Euro für 100 Gramm echten "Chaviar". Das Wort bedeutet "Kuchen der Freude". Seit Jahrtausenden ernährt das Kaspische Meer seine Anwohner. Aber damit könnte es bald vorbei sein. Denn der Störbestand im größten Binnensee der Erde nimmt beständig ab. Die Reportage begleitet ansässige Fischer bei ihrer Jagd nach dem Gold des Meeres, hinaus auf die lebensgefährliche See.

    Akbar Tshasaks Fanggründe liegen in der Provinz Gilan bei Bandar Anzali, einer traditionellen Fischerstadt an der Südwestküste des Kaspischen Meeres. Akbar Tshasak befischt sie zusammen mit zwei Kollegen im Auftrag der staatlichen Fischereibehörde. Für jedes Kilogramm erbeuteten Kaviars erhalten sie umgerechnet circa 300 Euro. Früher konnten die Störfischer sich und ihre Familien damit gut ernähren. Das Kaspische Meer beherbergt 90 Prozent des weltweiten Störbestands. Zusehends aber sterben die Fische aus. Vor zehn Jahren zogen die iranischen Fischer jährlich noch 123 Tonnen Kaviar an Land, heute sind es keine zehn. Neben der Umweltverschmutzung bedroht vor allem die Störwilderei den Fischbestand. Obwohl die staatlichen Patroullien auf Schwarzfischer zuweilen scharf schießen, ziehen viele Wilderer im Schutz der Dunkelheit hinaus auf See, in der Hoffnung auf den großen Fang. Die Wilderer ziehen aber auch Jungtiere aus den Netzen. So kann sich der Bestand nicht mehr erholen. Der Stör benötigt je nach Art zwischen sieben und 20 Jahre, um geschlechtsreif zu sein und Eier zu produzieren. Als Folge müssen auch die legal arbeitenden Fischer länger auf volle Netze warten und weiter auf das Meer hinaus. Weil das Wetter am Kaspischen Meer aber sehr schnell umschlagen kann, geraten viele Störfischer immer wieder in schwere Stürme. So mancher schafft es dann nicht mehr zurück an das rettende Land: Allein 2008 ertranken mehr als 20 Fischer vor Irans rauer Küste. DE 2008
