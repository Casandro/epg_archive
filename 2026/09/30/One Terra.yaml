  title: Planet Weltweit - Kyuchu - Wo Japans grüner Tee wächst
  subtitle: Planet Weltweit - Kyuchu - Wo Japans grüner Tee wächst
  description: "Grüner Tee ist in Japan viel mehr als ein Getränk. Er ist der Schlüssel zur japanischen Kultur - Genuss, Philosophie und Lebenskunst in einem. Grünen Tee zu trinken, gilt in Japan als Kunst. Im Frühjahr wartet ganz Japan auf den First Flush - die erste Ernte des edlen Sencha-Tees von der Insel Kyushu. Hier liegt das größte Bioteeanbaugebiet des Landes. Die Reportage begleitet den Herstellungsprozess von Japans legendärem Grüntee, forscht nach dem Geheimnis seiner heilenden Kräfte und zeigt auch, wie tief das Getränk inzwischen Japans Gesellschaft durchdrungen hat.\n\nDer 60-jährige Kazuo Watanabe hat sein Leben dem grünen Tee gewidmet, wie sein Vater, sein Großvater, seine ganze Familie. Der Biofarmer ist Teebauer und hat seit Jahren einen großen Traum - er will den besten Tee Japans produzieren. Wie nah er seinem Ideal kommt, zeigt sich auch dieses Jahr erst wieder bei der Ernte. Zehn Tage dauert es vom Beginn des Pflückens bis zur trinkfertigen Teeportion. Der Farmer setzt auf Herstellungsmethoden ohne Pestizide. Seine Plantagen liegen inmitten der Vulkanlandschaft auf der Insel Kyushu. Der nährstoffreiche Boden, das saubere Quellwasser und das subtropische Klima schaffen ideale Voraussetzungen für das Wachstum der Teepflanzen. \nIn Japans Teephilosophie geht es um den Fluss der Lebensenergie Ki, die alles durchströmt. So, wie man eine Tasse Tee zubereitet, so will man leben. Die Teekunst sucht wie alle japanischen Künste die tiefe Verbindung zwischen Mensch und Universum. \nObwohl der grüne Tee von Kazuo Watanabe zu den Besten des Landes gehört, wird der Konkurrenzdruck immer härter. Das zeigt sich jedes Jahr an der Tee-Börse von Kagoshima, Japans größtem Umschlagplatz für grünen Tee. Auf den Auktionsterminen bestimmen Geschmack und Nachfrage den Wert jeder einzelnen Sorte. Während der ersten Frühjahrspflückung werden hier 50 Prozent der Jahresproduktion umgeschlagen. Der größte Teil davon bleibt im Land, denn aus Japans Alltag ist Grüntee nicht wegzudenken. DE 2008"
