  title: Planet Weltweit - Die Krabbenflut
  subtitle: Planet Weltweit - Die Krabbenflut
  description: 'Sie sehen aus wie ein aufgeklapptes Taschenmesser auf acht Beinen: tellergroß, rot gepanzert und bewaffnet wie Gladiatoren. Dabei sind die Roten Landkrabben ausgesprochen friedlich - und eine Rarität. Sie sind nur auf der Weihnachtsinsel im Indischen Ozean zuhause, dort allerdings in Massen: Bis zu 120 Millionen Tiere bevölkern das Archipel. Sechs davon versucht der britische Forscher Steve Morris einen Monat lang im Auge zu behalten - indem er ihnen Sender auf den Panzer montiert. Er will untersuchen, wie die Krabben ihren Weg vom Regenwald an die Küste finden, wo sie sich alljährlich zur Paarung treffen. Auf ihrem Weg über steile Klippen, Straßen und Gärten riskieren sie immer wieder ihr Leben: bei Begegnungen mit Autos, hungrigen Riesenkrabben und giftigen Ameisen. Die 1600 Einwohner von Christmas Island freuen sich auf das alljährliche Naturschauspiel, wenn die Krabbenflut die einzige Ortschaft überschwemmt und den Strand in einen roten Teppich verwandelt. Schon die Kinder wissen, dass die Landkrebse die eigentlichen Hüter des Inselparadieses sind: Sie kultivieren den Boden und bestimmen, was im Wald wächst. Der Wissenschaftler Steve Morris ist jedoch nervös: Es ist bereits Mitte November, und die Wanderung hätte längst beginnen müssen. Doch der Monsun lässt auf sich warten, und nur er verwandelt die Roten Landkrabben von schläfrigen Höhlenbewohnern im Regenwald zu Marathon-Läufern. Bis zu acht Kilometer weit ist ihr Weg an der Küste, wo die Männchen Paarungshöhlen bauen. Zwölf Tage nach der Befruchtung laichen die Weibchen im Meer - pünktlich kurz vor Neumond. Morris will all diese Aktivitäten mit einem Team von Assistentinnen verfolgen: Er hat einige Krabben mit Sendern ausgestattet, um zu verstehen, wie sie den kürzesten Weg zum Wasser finden. Ein riskanter Weg. DE 2007'
