  title: Rund um den Globus - Island - Leben auf dem Pulverfass
  subtitle: Rund um den Globus - Island - Leben auf dem Pulverfass
  description: Island liegt im Nordatlantik, zwischen Großbritannien und Grönland und ist die größte Vulkaninsel der Erde. Das Leben der circa 330.000 Einwohner Islands wird bis heute von den feuerspuckenden Bergen beherrscht. Im Frühjahr 2010 brach der Eyjafjallajökull aus und legte mit einer mächtigen Aschewolke den Flugverkehr in ganz Europa nahezu lahm. Diese Reportage befragt die Menschen, die im Schatten des Vulkans den Ausbruch hautnah miterlebten. Die Bewohner des Örtchens Vik im Süden des Landes leben mit der ständigen Angst eines noch größeren Vulkanausbruches. Denn neben dem Eyjafjallajökull liegt der noch viel gefährlichere Vulkan Katla. In Vik lernen Kinder bereits in der Schule viel über Vulkane und vor allem, was zu tun ist, wenn Katla ausbrechen sollte. Denn dann muss alles ganz schnell gehen, im Katastrophenfall wird der gesamte Ort evakuiert. DE 2013
