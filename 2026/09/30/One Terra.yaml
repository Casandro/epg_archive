  title: Planet Weltweit - Die versunkenen Flugzeuge
  subtitle: Planet Weltweit - Die versunkenen Flugzeuge
  description: 'Holger Steinle ist ein Sammler: Im Auftrag des Deutschen Technikmuseums Berlin reist er um die Welt, um historische Flugzeuge aufzuspüren, zu bergen und zu restaurieren. Besonders interessiert er sich dabei für die Deutsche Luftfahrtsammlung, die in den Wirren des Zweiten Weltkrieges verschwunden ist. Steinle durchforstet ganz Europa nach den vermissten Fliegern; sucht in Wäldern, Gebirgen und vor allem in Seen.  Deutsche Ingenieure haben bis zum Zweiten Weltkrieg entscheidend zur Entwicklung der Luftfahrt beigetragen. Im Berlin der 1930er Jahre fand die größte Luftfahrtausstellung der Welt statt - hauptsächlich mit Maschinen, die vor oder während des Ersten Weltkrieg gebaut worden waren. Während des Zweiten Weltkrieges verschwand die berühmte Sammlung, die unter anderem Otto Lilienthals Fluggerät, Richthofens roten Dreidecker oder Ernst Udets Kunstflugzeug beherbergte, aus der umkämpften Stadt. Über Jahrzehnte galt sie als verschollen. Erst 40 Jahre nach Kriegsende stieß Holger Steinle zufällig auf Reste dieser außergewöhnlichen Ausstellung. Seitdem ist die Suche nach den Flugzeugen für ihn zur Lebensaufgabe geworden. Er inseriert weltweit in Zeitungen, geht Hinweisen von Zeitzeugen nach und befragt die Hinterbliebenen ehemaliger Piloten. Seine jüngsten Einsätze führen ihn nach Norwegen und Polen: In der Nähe von Prechlau soll einst vor den Augen der Dorfbewohner eine alte Rohrbach in einem Dorfsee versenkt worden sein. Steinle organisiert eine Suchaktion, bei der Taucher den Grund des Sees absuchen. Läge im Prechlauer See wirklich die Rohrbach-Roland, wäre das eine kleine Sensation! Viel Zeit hat Holger Steinle in Pommern jedoch nicht, denn ein anderer Auftrag wartet bereits auf ihn: In einem See nahe dem norwegischen Trondheim will er eine spektakuläre Bergung aus 60 Meter Wassertiefe durchführen. DE 2004'
