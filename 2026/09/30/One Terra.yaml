  title: Planet Weltweit - Vietnam, Kobra auf dem Teller
  subtitle: Planet Weltweit - Vietnam, Kobra auf dem Teller
  description: 'In dem kleinen vietnamesischen Dorf Vinh Son lebt ein Großteil der Einwohner von der Schlangenzucht: Kobras, Gebänderte Rattenschlangen und sogar die extrem großen und giftigen Königskobras werden hier gehalten und verkauft - zumeist ins Nachbarland China. In fast jedem Hinterhof des Dorfes leben Dutzende Schlangen. Das zumindest schätzt Kim Van Trung, der wie so viele im Dorf Schlangen züchtet, um sie nach China und inzwischen auch an vietnamesische Feinschmeckerrestaurants zu verkaufen. Das Geschäft boomt, besonders seit in Vietnam die Mittelschicht wächst, und sich immer mehr Menschen Schlangengerichte leisten können. Deswegen möchte auch kein Dorfbewohner auf den Gewinn, der mit den Tieren gemacht wird, verzichten. Vorsitzender des örtlichen Züchtervereins ist der mittlerweile 75-jährige Kim Van Hoc. Bereits Ende der 70er Jahre begann er mit der Schlangenzucht im Dorf, ermutigte Freunde und Nachbarn, es ihm gleichzutun. Heute gilt das Dorf als Vietnams Schlangenproduzent Nummer eins. Die Tiere werden für Medikamente, Schlangenwein oder verschiedene Speisen verwendet. Doch nun möchte Kim Van Trung sein Amt abgeben und einen Nachfolger suchen. Nur will keiner das Erbe antreten. Weder Kims eigene Söhne noch ein anderer Züchter. Zu groß scheinen die Fußstapfen, die Kim hinterlässt. Selbst der Bürgermeister, der als einer der Wenigen im Dorf die hochgefährlichen Königskobras züchtet, verzichtet nur ungern auf seinen langjährigen Berater und Weggefährten. DE 2014'
  ageRating: 6
