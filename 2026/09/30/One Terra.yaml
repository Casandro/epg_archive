  title: Planet Weltweit - Kastanien, Das Brot der Korsen
  subtitle: Planet Weltweit - Kastanien, Das Brot der Korsen
  description: 'Ohne die Kastanienbäume und vor allem die Esskastanien wäre Korsika nicht das, was es ist: eine Insel voller Traditionen, voller Stolz und Würde. Hunderte Bauern haben hier einst die legendären Kastanienwälder bewirtschaftet. Heute ist eine Handvoll übriggeblieben, die gegen das Aussterben der Kastanienproduktion kämpft. Und das erst recht, seit die Gallwespe die Bäume zu vernichten droht. Die Reportage hat die wenigen verbliebenen Kastanienproduzenten eine Saison lang begleitet und ihr faszinierendes Handwerk kennengelernt. Jean-Paul Vincensini ist Korse aus Leidenschaft. Er ist ein "Pionier", er war der Erste, der in den 1970iger Jahren auf Korsika den Anbau der Kastanien und die Produktion des Kastanienmehls wiederaufnahm und so die traditionelle Lebensweise der Kastanienbauern wiederentdeckte. Wo früher Hunderte Menschen im Dorf von der Viehzucht und der Kastanie lebten, teilen sich heute ein paar freilebende Esel und Schweine den Lebensraum mit den letzten Einwohnern. Jean-Pauls Firma produziert nun wieder Kastanienmehl, das zur Herstellung des berühmten korsischen Biers, von Konfitüren, glasierten Maronen und Keksen genutzt wird. Auch die berühmte korsische Schweinerasse züchtet die Familie. Uralte Familienrezepturen kommen bei der Herstellung der Produkte zum Einsatz - doch in diesem Jahr macht allen die Gallwespenplage schwer zu schaffen. Der Schädling wurde vermutlich durch Jungpflanzen aus dem benachbarten Italien eingeschleppt und frisst sich seitdem durch die Kastanienwälder. Das bedroht nicht nur die Existenz der korsischen Kastanienbauern sondern es droht damit auch eine ganze Kultur und das Erbe Korsikas zu verschwinden. "Unsere Ahnen waren weise. Sie haben sich dem Boden angepasst, irgendwie waren sie schon genial, sie haben die richtigen Lösungen gefunden, in diesen Bergen, mit diesen Felsen. DE 2014'
