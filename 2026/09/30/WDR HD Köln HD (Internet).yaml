  stop: 2026-09-30T21:00:00Z
  title: Trotzdem Hagen - Eine Stadt kämpft gegen den Niedergang
  description: "Hagen ist eine Stadt, deren Ruf ordentlich ramponiert ist. Verschuldung, Arbeitslosigkeit, Schrottimmobilien, in den letzten Jahren jagte eine Elendsreportage die nächste und die Medienwelt ist sich einig: Hagen ist schlimm! Wirklich? \nDie Fernsehjournalistin Gesine Enwaldt will es nicht glauben und kehrt zurück in ihre Heimatstadt auf der Suche nach denjenigen, die trotzdem an Hagen glauben und an der Zukunft der Stadt arbeiten."
- eventId: 1373060
  start: 2026-09-30T21:00:00Z
  stop: 2026-09-30T21:40:00Z
  title: Die Küblböck-Story - Eure Lana Kaiser (1/3)
  subtitle: Born in Bavaria
  description: "Die 2000er Jahre markierten mit \"Deutschland sucht den Superstar\" den Beginn einer neuen TV-Ära und zeitgleich den Beginn der Karriere von Lana Kaiser, damals bekannt als Daniel Küblböck. \n\nDie Doku-Serie zeigt den damals für nicht-heterosexuelle Menschen häufig schwierigen Zeitgeist und begleitet ein Leben im Rampenlicht mit allen Höhen und Tiefen einer medialen Instant-Karriere. Der Teenager aus Niederbayern brach unerschrocken Regeln und wurde dafür geliebt - aber auch gehasst. Wie schafft man es, als so junger Mensch dennoch immer wieder aufzustehen?"
- eventId: 1373378
  start: 2026-09-30T21:40:00Z
  stop: 2026-09-30T22:20:00Z
  title: Die Küblböck-Story - Eure Lana Kaiser (2/3)
  subtitle: Liebe Nation
  description: Im Mittelpunkt der zweiten Folge steht der gewaltige Hype rund um Lana Kaiser, ehemals Daniel Küblböck, und die Zeit nach dem DSDS-Ruhm. Fast alles, was der Star anfasste, wurde zum Kassenschlager. Lana markierte mit unzähligen Fans, aber genauso vielen Hatern, den Beginn des Social-Media-Zeitalters. Selbstbewusst queer, erfand sich Lana immer wieder neu, trotzte der Kritik, wandelte ihr Image und sorgte mit geschulter Jazz-Stimme für Furore.
- eventId: 1373549
  start: 2026-09-30T22:20:00Z
  stop: 2026-09-30T23:00:00Z
  title: Die Küblböck-Story - Eure Lana Kaiser (3/3)
  subtitle: Ich gehöre nicht jedem
  description: Lana fand ihre neue Wahlheimat auf Mallorca und durch eine Erwachsenenadoption ihre neue Familie. Das Glück schien perfekt, als sie auch noch ihrer großen Liebe begegnete. Doch die Schauspielausbildung in Berlin, die ein Neuanfang abseits des Musik-Business sein sollte, lief nicht wie geplant und sie entfernte sich von Freund:innen und Familie. Die dritte Folge der Doku-Serie nähert sich sensibel dem letzten Kapitel in Lanas Leben und lässt wilde Spekulationen rund um ihr Verschwinden 2018 aus.
- eventId: 1373714
  start: 2026-09-30T23:00:00Z
  stop: 2026-09-30T23:45:00Z
  title: Arcadia - Du bekommst was du verdienst (15)
