  description: |-
    * Bärenglück: Lippenbärin Lina umsorgt ihre kleinen Zwillinge liebevoll und mit inniger Hingabe. Von Ausflügen auf die Anlage hält sie nichts. Zu gefährlich!
    * Schwerer Rüssel: Das kleine Elefantenmädchen hat die OP erfolgreich überstanden. Doch die Anstrengung der Operation nimmt es ganz schön mit. Die Erholung geht nur langsam voran.
    * Neuer Mann im Haus: Endlich ist er da, der neue Zebrahengst. Henri heißt er und ist Engländer. Nun soll der Brite die sächsische Mädels-WG beglücken.
