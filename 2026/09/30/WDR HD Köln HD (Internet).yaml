  title: Rentnercops (28)
  subtitle: Gut für die Gerechtigkeit
  description: |-
    Mitten in Köln wird Lisa, eine junge radikale Feministin, ermordet, die im Stil von Femen gegen Sexismus protestiert hatte. Vicky, Plocher und Hui versuchen, Edwin und Günter aus den Ermittlungen herauszuhalten, aus Angst, die beiden könnten beim Thema Feminismus in ihrer unverblümten Art einen PR-GAU für die Polizei verursachen. Natürlich sind beide beleidigt, dass man ihnen so wenig Sensibilität im Umgang mit heiklen Themen zutraut - aber sie fügen sich unter Protest.
    Bei den weiteren Ermittlungen werden sie auf einen Stalker hingewiesen, der Lisa angeblich schon länger beobachtet. Aber ist er auch der Täter?
