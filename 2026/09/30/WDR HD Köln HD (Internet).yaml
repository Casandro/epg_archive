- eventId: 1363904
  start: 2026-09-30T13:10:00Z
  stop: 2026-09-30T14:00:00Z
  title: Rentnercops (29)
  subtitle: Ein Schuss, zwei Treffer
  description: |-
    Auf ein Liebespaar, das in einem Auto zur Sache kommt, wird geschossen: Der Mann überlebt den Anschlag, die Frau wird tödlich getroffen. Wie sich herausstellt, ist der verletzte Liebhaber ein gut beschäftigter Callboy, der in dem Viertel allerdings nur bei den Damen sehr beliebt war.
    Offenbar wurde seine Telefonnummer unter den Frauen des Viertels munter weitergereicht. Günter ist empört über diese Unmoral. Mehrere eifersüchtige Ehemänner kommen als Täter infrage. Aber wer war eigentlich das Ziel: der Callboy oder seine Kundin?
  ageRating: 6
  genre:
