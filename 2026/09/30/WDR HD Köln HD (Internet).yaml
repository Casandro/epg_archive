  stop: 2026-09-30T08:25:00Z
  title: Wer weiß denn sowas?
  subtitle: mit Kai Pflaume
  description: |-
    Gäste: Peter Urban und Malik Harris

    Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.

    Beide Teams spielen um Bares für ihre Unterstützer. Zu Beginn des Wissensspiels müssen sich die Zuschauer im Studio entscheiden: Setzen sie sich auf die Seite von Superhirn Bernhard Hoëcker oder von Quizmaster Elton?
- eventId: 1360327
  start: 2026-09-30T08:25:00Z
  stop: 2026-09-30T09:10:00Z
  title: Garten & Lecker (27)
  subtitle: Kohlrabi-Carpaccio aus dem 70er Jahre-Garten
  description: Die dritte Gartenreise führt nach Baden-Württemberg. Axl Jansen hat als Fotograf in Berlin und Paris gelebt und den 800 Quadratmeter großen Garten seiner Eltern in Besigheim bei Stuttgart geerbt. Für ihn bedeutet der Erb-Garten Heimat, die er bewahren und klimafit für die Zukunft machen will. Er experimentiert mit neuen, trockenheitsresistenteren Rasenmischungen. Prachtstück ist ein großer alter Kirschbaum, unter dem gefeiert wird. Alphornbläser auf dem Dach seines Bungalows spielen zur Begrüßung ein Ständchen. Mit frischen Austern aus Paris und Kohlrabi aus dem Garten will Axl kulinarisch punkten.
  genre:
  - '144'
