    Offenbar wurde seine Telefonnummer unter den Frauen des Viertels munter weitergereicht. Günter ist empört über diese Unmoral. Mehrere eifersüchtige Ehemänner kommen als Täter infrage. Aber wer war eigentlich das Ziel: der Callboy oder seine Kundin?
