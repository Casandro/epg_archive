  title: Arcadia - Du bekommst was du verdienst (16)
  subtitle: Score Null
  description: Alle Pläne, die Hüterin zu stoppen, scheitern - sie ist allen immer einen Schritt voraus. Das Schicksal der Familie und Arcadias liegt nun in den Händen von Marco, Luz und Cato.
