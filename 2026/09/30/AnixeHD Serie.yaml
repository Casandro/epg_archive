  title: Vier Frauen und ein Todesfall - Dankeschön
  subtitle: Vier Frauen und ein Todesfall - Dankeschön
  description: 'Julie hat die Koffer doch wieder gepackt. Sie muss zu ihrer Tochter, deren Mann Lasse und zu ihrem Enkel. Der Abschied von Sabi und Franzi fällt schwer. Als Julie sich mit dem von Franzi geliehenen Einsergolf auf den Weg macht, passiert, was noch nie passiert ist: Ein Unfall! Julie überfährt zwei Herren, doch der Versuch, den Unfall zu vertuschen, misslingt, als die verwirrte Maria die Leichen entführt. Die Identität der Toten stellt sich bald heraus. Untergebracht in der Pension von Uschi schrieben dort die zwei Autoren Rup Brenning und Ullrich Hennert an einer Fernseherie deren Konzept Julie auf dem Schreibtisch der Autoren gefunden hat: "Vier Frauen und ein Todesfall"!'
