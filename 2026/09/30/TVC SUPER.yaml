    Ciało tancerki flamenco odnalezione w jaskini wraz z martwym wężem zmusza śledczych do analizy symboliki tego zabójstwa. Doświadczony detektyw i przenikliwa psycholog muszą zmierzyć się z czasem oraz powracającymi echami własnej przeszłości. Każdy ślad prowadzi ich głębiej w labirynt niebezpiecznych ludzkich namiętności. Obsada: Barbara Cabrita, Quentin Faure, Tom Hygreck
