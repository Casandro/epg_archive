  description: |-
    Tytuł oryginalny: Profilage
    FR, 2016
    Reżyseria: Vincent Jamain
    Występują: Philippe Bas, Jean-Michel Martial, Raphaël Ferret, Sophie De Fürst, Valérie Dashwood, Juliette Roudet
    Zespół musi potwierdzić zgon potrąconej przez samochód staruszki. Doc zauważa, że denatka została najpierw otruta, a później trzykrotnie ugodzona nożem. Emma jest oburzona skalą przemocy wobec starszej osoby. Adele udaje się do domu ofiary. Na miejscu znajduje kilka teleskopów wymierzonych w okna sąsiadów oraz stos anonimowych donosów. Okazuje się, że starsza pani donosiła na sąsiadów. Adele i Rochera intryguje jeden anonim dotyczący "najgorszego z potworów". Chcą spotkać się z adresatką listu.
