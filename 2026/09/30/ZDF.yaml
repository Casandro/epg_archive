    Dokumentation, Deutschland 2026
    Der Kanzler rutscht weiter in die Krise, die AfD überholt die Merz-CDU in den Umfragen. Sven Schulze und Philipp Amthor versuchen, ein Debakel im Osten zu verhindern.

    Dann entzweit Jens Spahns Vaterglück die Unions-Familie. Mithilfe einer Leihmutter werden er und sein Partner Eltern. Die dritte Folge der Polit-Doku-Reihe schaut auch nach Sachsen-Anhalt, wo Sven Schulze gegen Ulrich Siegmund von der AfD antritt.
