  description: |-
    Krimireihe, Belgien / Deutschland 2023
    In den Dünen vor De Haan wird ein Mann ermordet aufgefunden. Die Spuren führen in den nahe gelegenen Ferienpark Canteclaer.

    Jeffrey hatte sich in De Haan ein Chalet gemietet, in unmittelbarer Nachbarschaft zu seinem früheren Chef Saïd. Von ihm war er wegen vermeintlichen Diebstahls entlassen worden. Warum suchte Jeffrey nun die Nähe zu Saïd und dessen Familie?
