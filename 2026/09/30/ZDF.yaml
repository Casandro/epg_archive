  description: |-
    Irland / Australien / Großbritannien / Deutschland 2023
    Helen und Elliot reisen nach Irland in der Hoffnung, mehr über die Vergangenheit Elliots zu erfahren. Schnell stellt sich heraus, dass das wohl nicht die brillanteste Idee der beiden war.

    Kaum in der Heimat angekommen, wird Elliot entführt. Helen ruft die Polizei, die sich in Form eines netten Garda manifestiert. Leider wird dessen Freundlichkeit durch mangelndes Ermittlungsgeschick kompensiert. Helen muss die Dinge wohl selbst in die Hand nehmen.
