- eventId: 1058466
  start: 2026-09-30T15:00:00Z
  stop: 2026-09-30T15:10:00Z
  title: Süd Journal vom 29.09.2026 (Wh.)
  subtitle: 720000 Euro Förderung für Hans-Klepper-Hallenbad +++ Ausbildungsstart am bfz +++ Klingender Chiemsee mit viel Besuchern, Blasmusik und Sonne +++ Bundespolizei fasst flüchtigen Häftling
  description: 'Rosenheim saniert das Hans-Klepper-Hallenbad mit 720.000 Euro Bundesförderung: Wegen sichtbarer Schäden wie tropfender Decken und veralteter Technik soll die Modernisierung etappenweise erfolgen, damit Schulen, Vereine und Badegäste das Bad möglichst weiter nutzen können. +++ An der bfz-Berufsschule für Pflege und Alterspflegehilfe beginnen in der Region rund 85 Jugendliche ihre Ausbildung, während bayernweit 300 an 48 bfz-Fachschulen starten, denn wegen demografischem Wandel fehlen in Kliniken, Heimen und Diensten Fachkräfte. +++ Beim Aktionstag Klingender Chiemsee sorgten Blasmusik und Sommerwetter für beste Stimmung: Schon am Vormittag spielten Kapellen aus Prien, Söchtenau und Kolbermoor Standkonzerte, die auf Herren- und Fraueninsel sowie bei Schlossfahrt und Klosterwirt viele Zuhörer anzogen. +++ Ein 57-jähriger Italiener, der wegen eines Verstoßes gegen das Betäubungsmittelgesetz in Haft saß und geflohen war, wurde am Sonntag bei einer Grenzkontrolle nahe Kiefersfelden an der Inntalautobahn gefasst und muss voraussichtlich bis April 2027 ins Gefängnis.'
- eventId: 1058467
  start: 2026-09-30T15:10:00Z
  stop: 2026-09-30T15:20:00Z
  title: Süd Journal vom 29.09.2026 (Wh.)
  subtitle: Obacht Volksmusik in Neuötting +++ Großer Parkinson-Tag in Traunstein  +++ Der erste Mind-Sport-Day in Rosenheim +++ Apfelfest im Sortenerhaltungsgarten Haberland
  description: 'Bei Obacht - Volksmusik in Neuötting (10. bis 18. Oktober) eröffnen am 10. Oktober Stefan Murr und Heinz-Josef Braun im Stadtsaal mit dem Bayerischen tapferen Schneiderlein und dem Live-Hörspiel Jennerwein samt Musik des Art Ensemble of Passau. +++ Parkinson ist mehr als Zittern: Beim Großen Parkinson-Tag in Traunstein informiert das Parkinson Netz Südostbayern am 17. Oktober im Landratsamt mit Vorträgen und Erfahrungsberichten über Herausforderungen der Krankheit und Hilfen für Betroffene und Angehörige. +++ Beim ersten Mind Sport Day in Rosenheim stand im Aicherpark am Wochenende Denksport im Mittelpunkt: Interessierte testeten Schach, Bridge und Tabletop, unabhängig von Erfahrung. Wir waren vor Ort und zeigen, wie das Angebot ankam und was dahintersteckt. +++ Im Berchtesgadener Land, einem von sechs Alpenvorland-Kreisen, wird seit elf Jahren im Projekt Apfel.Birne.Berge nach seltenen Apfel- und Birnensorten gesucht, woraus der Sortenerhaltungsgarten in Haberland bei Surheim entstand, der beim zweiten Apfelfest viele Besucher anzog.'
- eventId: 1058468
