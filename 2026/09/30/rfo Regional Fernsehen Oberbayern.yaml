- eventId: 1058668
  start: 2026-09-30T20:45:00Z
  stop: 2026-09-30T21:00:00Z
  title: Süd Leben vom 30.09.2026 (Wh.)
  subtitle: Nachholspiel in der Regionalliga Bayern - TSV Buchbach gegen SpVgg Unterhaching +++ Kool And The Gang lassen die Mangfallpark tanzen +++ Wetter Subregionen
  description: 'Vor dem zwölften Spieltag der Regionalliga Bayern lieferten sich TSV Buchbach und die SpVgg Unterhaching im Nachholspiel des neunten Spieltags ein Topduell Erster gegen Vierter, bei dem es um Buchbachs Serie und Hachings Sprung auf Rang zwei ging. +++ Im Mangfallpark schrieb Kool And The Gang beim Sommerfestival Rosenheim ein besonderes Kapitel: Gründungsmitglied und Bassist Robert Kool Bell (Jahrgang 1950) lieferte seit 1964 Funk, Soul und Disco mit Groove und Tanzlaune. +++ Eine Kaltfront zieht zum Start in den Oktober im Westen herein und bringt Regen, örtlich Gewitter und kaum 20 Grad. Am Freitag ziehen letzte Schauer ostwärts und anschließend setzt sich wieder Hochdruckeinfluss durch. Zum Wochenende steigt dann die Nebelgefahr an.'
- eventId: 1058722
  start: 2026-09-30T21:00:00Z
  stop: 2026-09-30T21:10:00Z
  title: Süd Journal vom 30.09.2026 (Wh.)
  subtitle: Weltkriegsbombe in Rosenheim entdeckt - Entschärfung erfolgreich +++ Fernwärmeprojekt für Obing gestoppt +++ Tankrabatt startet - wann lohnt sich das Tanken?
  description: 'In Rosenheim löste der Fund einer 250-Kilo-Fliegerbombe bei Bahnarbeiten einen Großeinsatz aus: 1500 Menschen wurden evakuiert, Straßen und Bahnstrecke gesperrt, am Abend entschärfte der Kampfmittelräumdienst den Blindgänger und transportierte ihn ab. +++ Obing stoppt das geplante Fernwärmeprojekt: Trotz Förderchancen lehnte der Gemeinderat wegen hoher Kosten und Risiken ab, Proteste blieben aus; vorerst müssen die Bürger selbst heizen, doch bei einem tragfähigen Konzept könnte Fernwärme wieder Thema werden. +++ Ab morgen sinkt die Energiesteuer auf Benzin und Diesel für drei Monate, rechnerisch um bis zu 17 Cent je Liter, doch weil alte Bestände und die Preisstrategie der Konzerne wirken, lohnt sich weiter der Vergleich per App und nach Uhrzeit.'
