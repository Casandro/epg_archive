  title: Ultimate Rush - The Winter Peak
  subtitle: Ultimate Rush - The Winter Peak
  description: Mindestens 16 Expeditionen haben versucht, im pakistanischen Winter den 8.000 m hohen Gipfel namens Gasherbrum II zu besteigen. Alle sind gescheitert. Entschlossen, die Statistik zu schlagen, dokumentiert der Bergsteiger und Filmemacher Cory Richards die schicksalhafte Besteigung seines Teams. AT 2014
- eventId: 1276743
  start: 2026-09-30T00:55:00Z
  stop: 2026-09-30T01:24:00Z
  title: Wild Ones - Junge Helden - Episode 3
  subtitle: Wild Ones - Junge Helden - Episode 3
  description: Motocross-Superstar Ken Roczen muss unters Messer. Er hat sich bei einem Trainingssturz vor einem knappen Jahr das Handgelenk gebrochen. Nun wird ihm im Krankenhaus eine Metallplatte aus dem linken Arm entfernt. Auch Freeskier Bene Mayr kämpft mit alten Verletzungen. Nach mehreren Kreuzbandrissen trainiert er regelmäßig im Gym, um seinen Körper optimal auf die kommenden Wettkämpfe vorzubereiten. Benes großes Ziel ist die Qualifikation für Olympia 2014. Bei Freerunner Jason Paul hat die Contest-Saison bereits begonnen. Er macht sich auf den Weg nach Griechenland - zum Art of Motion Wettbewerb in Santorin. Jason hat den Titel schon drei Mal gewonnen und will auch in diesem Jahr aufs Podium. Kitesurferin Susi Mai wird auf Maui von den größten Wellen der Welt überrascht - und Wakeboarder Dominik Gührs fliegt nach Istanbul für ein Fotoshooting. DE 2013
  ageRating: 12
- eventId: 1276744
  start: 2026-09-30T01:30:00Z
  stop: 2026-09-30T01:59:00Z
  title: Wild Ones - Junge Helden - Episode 4
  subtitle: Wild Ones - Junge Helden - Episode 4
  description: 'Für Freerunner Jason Paul steht der wichtigste Contest des Jahres an: der Art of Motion in Santorin. Kann er sich gegen seinen besten Freund und zugleich stärksten Konkurrenten Pasha Petkuns aus Lettland durchsetzen? Wakeboard-Weltmeister Dominik Gührs boardet gemeinsam mit seinem besten Kumpel Freddy von Osten für ein Fotoshooting im Versunkenen Palast von Istanbul. Die Kulisse ist spektakulär, schon James Bond wurde hier gedreht. Aber das Wasser ist für Wakeboard-Tricks viel zu niedrig - und Freddy stürzt. Motocross-Superstar Ken Roczen hat Heimaturlaub. Er hängt mit seinen besten Kumpels im hauseigenen Clubheim im thüringischen Mattstedt ab. Es ist ihr letzter gemeinsamer Abend, denn am nächsten Morgen fliegt Ken in die USA zurück; die Supercross-Saison startet in wenigen Monaten. Auch Kitesurferin Susi Mai muss sich von ihren Freunden auf Maui verabschieden: sie ist auf dem Weg nach Tokio, um ihren Freund James, einen britischen Rennfahrer, beim Sechs-Stunden-Rennen in Fuji zu begleiten. Und Freeskier Bene Mayr, der die letzten zwei Jahre mit unzähligen Verletzungen zu kämpfen hatte, feiert sein Comeback beim Big Air Contest in London. DE 2013'
  ageRating: 12
- eventId: 1276745
