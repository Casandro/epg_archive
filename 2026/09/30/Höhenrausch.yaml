  description: Die Bergsteiger Leo Houlding, Jason Pickles und Sean Leary wagen den Aufstieg auf den beeindruckenden Cerro Autana und wandern in einer Reise voller Risiko und Erleuchtung tief in den Amazonas und entdecken die Gründe, warum dieser Gipfel nie von Osten aus erreicht wurde. AT 2014
- eventId: 1276742
  start: 2026-09-30T00:30:00Z
