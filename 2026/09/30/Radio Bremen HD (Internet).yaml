  title: Die Braut, ihr Mann, die Eltern & Wir! (2/5)
  subtitle: 'Kai und Knossi auf Hochzeitsreise: Indien'
  description: 'Vier Tage Hochzeit in Indien! Das bedeutet: jede Menge faszinierende Traditionen und Rituale, die Kai und Knossi staunen lassen. 400 Gäste, viel Glanz und Glamour und ein spektakuläres Hochzeitsprogramm! Die Feier von Aarushi und Mehul in Delhi übertrifft alle Erwartungen von Kai und Knossi. Hennabemalung, Tanzen wie in Bollywood, das Bestreichen der Braut mit Kurkuma und eine fulminante Parade zum Einzug des Bräutigams: Die beiden erleben eine Hochzeit wie im Film! Und als wäre das nicht aufregend genug, wird Knossi auch noch im Tuk-Tuk durch die Megametropole kutschiert. Am Steuer: Kai Pflaume!'
