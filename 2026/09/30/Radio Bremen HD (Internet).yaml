  title: In aller Freundschaft - Die jungen Ärzte (258)
  subtitle: Vertrauensverlust
  description: |-
    Die Fachärzte Dr. Ben Ahlbeck und Dr. Elias Bähr bekommen es mit einem streitsüchtigen Ehepaar zu tun. Georg und Jessica Vonderhagen wohnen zwar noch unter einem Dach, führen aber einen Rosenkrieg. Was die beiden nicht wahrhaben wollen, ist für Elias und Ben umso klarer: Was sich neckt, das liebt sich.
    Unterdessen unterstützt Dr. Julia Berger Oberärztin Dr. Leyla Sherbaz bei der Behandlung des zynischen Schuhmachers Thomas Tambach. Als sich neben seiner arteriellen Verletzung plötzlich ungewöhnliche Symptome entwickeln, ahnen Julia und Leyla nichts Gutes.
