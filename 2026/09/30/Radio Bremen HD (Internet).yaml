  title: DAS! Rote Sofa
  subtitle: 'Gast: Dr. Ahsanullah Madad Fassli, Herzchirurg'
  description: "Dr. Ahsanullah Madad Fassli behandelt seit Jahren herzkranke Kinder in seinem Heimatland Afghanistan. Von dort war der heutige Herzchirurg 1990 als Zehnjähriger mit seinen Eltern nach Schleswig-Holstein geflohen. Er schafft das Abitur, studiert Medizin in Heidelberg und Kiel und avanciert zum renommierten Herzspezialisten. Vor gut drei Jahren kehrte er nach Afghanistan zurück und baute in Kandahar die erste Herzchirurgie außerhalb der Hauptstadt Kabul auf. \nAuf dem Roten Sofa spricht der Herzchirurg über sein Engagement in Afghanistan und erklärt, warum die \"Herzbrücke\" für ihn zu einer Lebensaufgabe geworden ist."
