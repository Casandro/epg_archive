  title: Tierärztin Dr. Mertens (87)
  subtitle: Ein kleiner Wolf
  description: Im Zoo gerät Dr. Mertens bei der Behandlung einer depressiven Elefanten-Kuh mit der Cheftierärztin Dr. Elif Sahin aneinander. Dabei werden die unterschiedlichen Ansätze der beiden Tierärztinnen deutlich - ebenso wie der Umstand, dass Susanne sich erst daran gewöhnen muss, nicht mehr die Chefin zu sein. Die Situation wird durch den Besuch von Elifs Vater noch pikanter. Er findet Susanne Mertens höchst sympathisch und stimmt als ehemaliger Tierarzt Susanne fachlich zu. Susanne entscheidet sich dann auch noch dafür, Elifs Anordnung zu umgehen, was zum Konflikt führt.
- eventId: 1373025
  start: 2026-09-30T20:50:00Z
  stop: 2026-09-30T21:35:00Z
  title: Tierärztin Dr. Mertens (88)
  subtitle: Der Jahrestag
  description: |-
    Es ist der Jahrestag des Unfalls, bei dem ihr Mann Christoph starb und Susanne das ungeborene Baby verloren hat. Trotz alledem hat Susanne Mertens es geschafft, neuen Mut zu fassen und meistert ihr Leben den Umständen entsprechend gut.
    Im Zoo geraten Dr. Susanne Mertens und die Cheftierärztin aneinander, weil Dr. Elif Sahin eine schwierige Untersuchung an Susannes Tochter Luisa und einem anderen Praktikanten delegiert hat.
    Susannes Eltern Charlotte und Georg möchten Susanne nun doch Geld für das Haus leihen. Inspiriert von Luisa startet Charlotte ihren ersten Video-Blog, der zunächst jedoch wenig Erfolg versprechend startet.
- eventId: 1373272
