  title: In aller Freundschaft (315)
  subtitle: Stille Versprechen
  description: |-
    Marianne Albrecht, eine emeritierte Botanikprofessorin, ist im Wald ausgerutscht und wird in die Sachsenklinik eingeliefert. Dort trifft sie auf Sebastian Maier und freundet sich mit ihm an.
    Otto Stein schenkt Charlotte Gauss einen Tangokurs. Charlotte will zuerst nicht mitmachen. Aber Ottos Vorwurf, Angst zu haben, will sie nicht auf sich sitzen lassen und macht mit. Schwester Arzu hört davon und meldet ihren Ehemann Philipp und sich auch kurzerhand in der Tanzschule an. Der Kurs droht für Philipp und Charlotte ein Fiasko zu werden.
