  description: 'Er ist schneeweiß, hat gelbe Beine und blaue Augen: "Horst" - einer von mehr als 200 Nandus, die in Westmecklenburg für reichlich Wirbel sorgen. Die einen sagen: Sie richten nur Schaden an. Für andere sind die flugunfähigen Straußenvögel eine Touristenattraktion. Ein NDR-Fernsehteam hat "Horst" und seine gefiederten Freunde vom Herbst 2017 bis in den Sommer 2018 beobachtet und Erstaunliches über die Nandus herausgefunden.'
