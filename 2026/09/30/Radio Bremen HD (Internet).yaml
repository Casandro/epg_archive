  title: Rasch durch den Garten
  subtitle: Der goldene Oktober kommt
  description: Millionen Hobbygärtner in Deutschland machen sich freiwillig und gern die Hände schmutzig. Sie säen und ernten, fachsimpeln über umweltverträgliche Schädlingsbekämpfung, historische Rosensorten und altes Saatgut. Die Menschen in Deutschland entdecken ihren "grünen Daumen". Gartenexperte Peter Rasch zeichnet aus, dass er immer einfache Lösungen für noch so kompliziert erscheinende Probleme hat, die nicht aufwendig und noch dazu kostengünstig sind. Der Servicegedanke steht dabei an erster Stelle.
