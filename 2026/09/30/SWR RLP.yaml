- eventId: 566904
  start: 2026-09-30T03:30:00Z
  stop: 2026-09-30T04:00:00Z
  title: Krieg der Träume
  subtitle: Das Making-of
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wie macht man vergangene Zeiten erlebbar und bleibt dabei so nahe wie möglich an den historischen Quellen? Dieser Aufgabe hat sich die dokumentarische Dramaserie "Krieg der Träume" gestellt: Sie zeichnet das Leben realer Personen nach und verwebt Spielszenen eng mit historischem Bildmaterial. Die unterschiedlichen Lebenssituationen der Menschen in Europa, ihre Perspektiven und politischen Utopien werden genauestens rekonstruiert. Welche Recherchearbeit darin steckt und wie Kamera und Musik eingesetzt werden, zeigt dieses Making-of.'
- eventId: 566905
  start: 2026-09-30T04:00:00Z
  stop: 2026-09-30T05:55:00Z
  title: SWR3 Morningshow
  subtitle: Visual Radio
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Video-Livestream der "SWR3 Morningshow", unter SWR3.de zu sehen, wird auch im SWR Fernsehen ausgestrahlt. Während der Musikstrecken ergänzen aktuelle Nachrichten in kompakter Form zum Nachlesen auf dem Fernsehbildschirm die Live-Bilder aus dem Studio. Aufnahmen der Autobahnkameras veranschaulichen die Verkehrsmeldungen, Live-Bilder zeigen die aktuelle Wetterlage im Sendegebiet.
- eventId: 566906
  start: 2026-09-30T05:55:00Z
  stop: 2026-09-30T07:00:00Z
  title: Panoramablick
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
- eventId: 566952
  start: 2026-09-30T07:00:00Z
  stop: 2026-09-30T08:20:00Z
  title: Landesschau Rheinland-Pfalz
  subtitle: 'Moderation: Svenja Kaiser'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Bonefeld liegt mit seinen rund 1000 Einwohner:innen im Landkreis Neuwied in der Verbandsgemeinde Rengsdorf-Waldbreitbach. Vor gut 700 Jahren wurde es erstmals urkundlich erwähnt, wahrscheinlich war es aber schon viel früher bewohnt. Davon zeugen Grabhügel, die gut 500 Jahre vor Christus entstanden sind. Das Dorf überzeugt heute durch ein reges Vereinsleben und zahlreiche Sportmöglichkeiten.
- eventId: 566953
  start: 2026-09-30T08:20:00Z
  stop: 2026-09-30T08:50:00Z
  title: Eisenbahn-Romantik (846)
  subtitle: Die Sauschwänzlebahn - Strategie auf Schienen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Sauschwänzlebahn ist eine Bahn wie aus dem Bilderbuch: Ihre Gleise schlängeln sich durch die Landschaft, Tunnels durchbrechen Hügel, stattliche Brücken überwinden Täler und die Züge fahren unter Dampf. Der Streckenführung durch einen Kehrtunnel lässt an den Ringelschwanz eines Schweins denken. Die auch Wutachtalbahn genannte Strecke führt 25 Kilometer von Blumberg-Zollhaus nach Weizen, über vier Brücken, durch sechs Tunnels, und sie überwindet dabei 231 Höhenmeter. Die Fahrt in stilgerechten historischen Garnituren ermöglicht Blicke in die Wutachschlucht, in den Schwarzwald und bei gutem Wetter sogar bis zu den Alpen.'
