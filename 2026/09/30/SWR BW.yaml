  title: Eisenbahn-Romantik (846)
  subtitle: Die Sauschwänzlebahn - Strategie auf Schienen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Sauschwänzlebahn ist eine Bahn wie aus dem Bilderbuch: Ihre Gleise schlängeln sich durch die Landschaft, Tunnels durchbrechen Hügel, stattliche Brücken überwinden Täler und die Züge fahren unter Dampf. Der Streckenführung durch einen Kehrtunnel lässt an den Ringelschwanz eines Schweins denken. Die auch Wutachtalbahn genannte Strecke führt 25 Kilometer von Blumberg-Zollhaus nach Weizen, über vier Brücken, durch sechs Tunnels, und sie überwindet dabei 231 Höhenmeter. Die Fahrt in stilgerechten historischen Garnituren ermöglicht Blicke in die Wutachschlucht, in den Schwarzwald und bei gutem Wetter sogar bis zu den Alpen.'
