  description: |-
    Im Meer vor Sri Lanka lebt eine spezielle Gruppe von Blauwalen, die das ganze Jahr über hier bleibt - die einzigen Blauwale, die "singen". Meeresschildkröten kehren an Sri Lankas Strände zurück, um am Ort ihrer Geburt selbst Eier abzulegen. In den Mangroven jagen Schützenfische nach Beute, über Land und Meer kreisen Weißbauchseeadler, Schiffswracks am Meeresgrund bieten Lebensraum für Korallen und Rotfeuerfische.
