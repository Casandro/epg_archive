  title: Der Tod ritt dienstags
  description: "Zwischen dem kaltblütigen Revolverhelden Talby (Lee Van Cleef) und Scott (Giuliano Gemma), dem Sohn einer Prostituierten, entspannt sich eine ungewöhnliche Freundschaft. Nachdem Talby zu Scotts Verteidigung einen Mann erschießt, werden die beiden unzertrennlich. Unter der Anleitung seines neuen Freundes und Lehrmeisters wird aus Scott ein brutaler Bandit wie Talby. Gemeinsam verbreiten sie Angst und Schrecken. Wer sich ihnen in den Weg stellt, wird erschossen. Als Talby erkennt, dass Scott zum besseren Schützen wird als er selbst, beschließt er, seinen Partner aus dem Weg zu räumen. \n\n\"Der Tod ritt dienstags\" von Tonino Valerii besitzt alles, was einen klassischen Italo-Western ausmacht: Eine Welt ohne Moral und Gesetz; einsame Kämpfer, die brutal und listig jeden Gegner besiegen; und eine Handlung, die durchsetzt ist mit ironischen Elementen. Der italienische Regisseur Tonino Valerii war Assistent von Sergio Leone, und beweist mit diesem Film, wie viel er von Leone gelernt hat. In den Hauptrollen zwei große Stars des Italo-Western, Lee Van Cleef und Giuliano Gemma.\nWestern, Italien 1967, R: Tonino Valerii"
