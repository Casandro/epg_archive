  title: Hubert ohne Staller
  subtitle: Urlaub in der Hölle
  description: "Hubert und Girwidz wollen einen völlig betrunkenen Oktoberfest-Touristen vom S-Bahnhof abholen. Der Mann soll die anderen Fahrgäste belästigt haben. Der Schuldige ist zwar schnell gefunden, doch der griechische Staatsbürger namens Spyros Karamanlis ist kaum ansprechbar, weshalb ihn Hubert und Girwidz persönlich bei seiner Unterkunft absetzen wollen. Dort finden die Polizisten eine tote Griechin im Dirndl. Von Nachbar Mischmeier erfahren die Polizisten, dass die Eigentümer das Haus während der Oktoberfestzeit stets an Touristen aus dem Ausland - in dem Fall an einen Griechen und zwei Griechinnen - vermietet haben. Bleibt die dringende Frage, wo die zweite Griechin ist und ob sie etwas mit dem Tod der Freundin zu tun hat. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
