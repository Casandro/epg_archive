  title: Land of Bad
  description: "Obwohl die Delta-Force-Soldaten nicht viel von ihm halten, ist der junge Sergeant JJ Kinney (Liam Hemsworth) bei Lufteinsätzen immens wichtig. Als so genannter Fliegerleitoffizier gibt er entscheidende Tipps und Hinweise über militärische Zielobjekte. Doch die letzte Mission auf den Philippinen läuft schief. Ein CIA-Spion sollte aus den Händen islamistischer Terroristen befreit werden. Alle am Einsatz beteiligten US-Soldaten werden getötet, nur Kinney kann entkommen. Der erfahrene Drohnenpilot Eddie \"Reaper\" Grimm (Russell Crowe) hat die missglückte Mission über Bildschirme in einem Air Force-Stützpunkt verfolgt. Reaper leitet Kinney für eine Evakuierung zu einem Landeplatz. Doch der Flüchtende wird von den Terroristen erneut angegriffen und diesmal auch gefangengenommen. Plötzlich taucht Captain John \"Sugar\" Sweet auf und befreit Kinney. Nicht nur der Captain hat den Einsatz überlebt, ebenso ein weiterer Soldat sowie der vermisste CIA-Agent. Mit der Unterstützung von Reapers Kampfdrohnen könnte die Rettungsaktion von Kinney und Sugar gelingen.      \n\n\"Land of Bad\" ist ein knallharter Actionthriller mit Starbesetzung. Straff und effektvoll inszeniert von dem US-Amerikaner William Eubank, liefert der Film einen authentischen Einblick über das Zusammenwirken von Bodentruppen und Drohnen bei brisanten Militäreinsätzen. Die Hauptrollen spielen Oscargewinner Russell Crowe (der kurz vor der Pension stehende Drohnenoffizier Captain Eddie \"Reaper\" Grimm) und Liam Hemsworth (\"Die Tribute von Panem\") als in die Enge getriebener Sergeant JJ Kinney.\nAction, Vereinigte Staaten Von Amerika 2024, R: William Eubank"
  widescreen: true
