  title: Terra Mater - Die Lemuren-Bande
  subtitle: Immer diese Nachbarn (2/3)
  description: 'In der trockenen Jahreszeit bleibt keine der Begegnungen der Lemuren ohne Folgen. Unter den Schwarzmakis ist die Anspannung groß. In der trockenen Jahreszeit ist nicht nur Wasser immer schwieriger zu finden, es hat auch die Paarungszeit begonnen. Lea führt die Gruppe als starke Matriarchin durch die aufreibende Zeit - und steht dabei selbst im Fokus männlicher Avancen. Ihr Sohn, Seb, erkundet langsam - und chaotisch - das Leben außerhalb der Familie. Die Sifakas erleiden einen schmerzhaften Verlust und begegnen Menschen, die ihnen alles andere als wohlgesonnen sind. Der Regenwald des Indri-Paares Fara und Gastel wird immer weiter abgeholzt - doch es gibt einen überraschenden Verbündeten, der für die beiden kämpft. Als die Nacht hereinbricht, taucht ein weiteres Tier auf: Ein Aye-Aye. Der Legende nach sind die Lemuren mit den langen Fingern als Vorboten des Todes verschrien - dabei leisten sie einen wichtigen Beitrag für die Wälder. Österreich 2026'
