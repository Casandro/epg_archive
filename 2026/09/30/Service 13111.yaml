  title: TM Wissen Spezial
  subtitle: Von Korn und Milch
  description: 'Milchprodukte von Kühen mit Hörnern liegen im Trend: Hornkäse aus deren Milch soll bekömmlicher sein, vor allem für Menschen mit Unverträglichkeiten. Landwirtin Brigitte Kern aus dem Zillertal ist überzeugt, dass behornte Kühe ausgeglichener sind - ob das die Milchqualität verbessert, bleibt jedoch umstritten. Klar ist: Hornkäse steht für nachhaltige Tierhaltung und schmeckt. Auch beim Getreide erlebt Altbewährtes ein Comeback: Urkorn wie Dinkel gilt als nährstoffreicher als moderner Weizen. Die Bäckerinnen Lena und Laura Kasses setzen auf lange Teigführung - bis zu 72 Stunden - um die Verträglichkeit zu erhöhen. Ihr Brot vereint Tradition, Zeit und Qualität. Mit der richtigen Verarbeitung kann auch Weizen wieder ein wertvolles Nahrungsmittel sein. Zum Beispiel als Sauerteig? Der sorgt für intensiveren Geschmack, bessere Haltbarkeit und mehr Bekömmlichkeit. Seine Ursprünge reichen bis ins alte Ägypten, und Bäcker wie Josef Weghaupt setzen auf jahrelang gezüchteten Teig. Verbessern alte Methoden und nachhaltige Produktion Geschmack, Verträglichkeit und Qualität unserer Lebensmittel?Österreich 2024'
