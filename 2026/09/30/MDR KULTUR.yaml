  title: 'MDR Kultur trifft: Christian Waltenberg'
  subtitle: Verbandschorleiter des Chorverbands Sachsen-Anhalt, / musikalischer Leiter des Chors Carmina Mundi, Magdeburg
  description: "Christian Waltenberg ist Gymnasiallehrer für Mathematik und Musik und Fachseminarleiter in Magdeburg, zudem seit 2022 Verbandschorleiter des Chorverbands Sachsen-Anhalt und er liebt es, Menschen durch das Singen zusammenzubringen. Das konnte einmal mehr unter Beweis gestellt werden zum 3. Internationalen Chorfest vom 16. bis 20. September in Magdeburg mit 50 Chören, hunderten Sängern aus Deutschland, der Region, sowie aus Ländern wie Kroatien, Norwegen, Lettland, Malaysia, Ghana, Brasilien und Internationalem Wettbewerb unter dem Motto \"Fühelnd verbunden - Sing with emotion\". Unter der Corona-Pandemie hatte Christian Waltenberg in Magdeburg das \"Stimmfit in den Sommer\" - Projekt ins Leben gerufen. 100 Teilnehmer standen da in ihren Wohnzimmern und folgten in einer Videokonferenz übers Internet seinen Stimmübungen. \n\nDie Nachwuchsförderung und die Stärkung der Chorlandschaft in Sachsen-Anhalt liegt Christian Waltenberg am Herzen. Neben dem schulischen Kontext gelingt ihm das als musikalischer Leiter des generationenübergreifenden Chors \"Carmina Mundi\". \nKunst kann nicht von gesellschaftlichen Themen und Diskursen getrennt sein, so seine Überzeugung. \"Carmina Mundi\" ist der Projektchor des Chorverbands Sachsen-Anhalt. Einmal im Jahr kommen die Sängerinnen und Sänger aus ganz Sachsen-Anhalt mit einem programmatischen Schwerpunkt zusammen. In diesem Jahr erarbeiteten sie ein Konzert zum Thema Demokratie und Meinungsfreiheit. \n\nDer Chorverband Sachsen-Anhalt e.V. wiederum brachte am 30. Juni 2026 zusammen mit dem Verein Völkerverständigung und Toleranz Hannover und weiteren internationalen Partnern ein außergewöhnliches Konzert in den Magdeburger Dom zur Aufführung. \"The Night Konzert\", als Zeichen gegen Hass und Antisemitismus, verband Musik, Erinnerung und gesellschaftliches Engagement. Im Mittelpunkt stand liturgische Synagogalmusik von Leib Glantz in der Orchesterfassung von Joseph Nee aus den USA, kontrastiert mit Texten des Holocaust-Überlebenden Elie Wiesel aus seinem Werk \"Die Nacht\". Begleitet wurde die Konzert-Lesung von der Magdeburgischen Philharmonie, dem MDR Rundfunkchor und zwei Synagogalchören. Es war die zweite Deutschland-Aufführung, sechseinhalb Jahre nach der Premiere in Hannover. Das begleitende pädagogische Konzept für Schulprojekte wurde zuvor vom Verbandschorleiter des Chorverbands Sachsen-Anhalt Christian Waltenberg und der Fachkoordinatorin Constanze Voigt entwickelt.\n\nVom 01. bis 04. Oktober ist Leipzig erstmals Gastgeber der chor.com. Auch da wird Christian Waltenberg mit dem Chorverband Sachsen-Anhalt e.V. vor Ort sein. Nach Dortmund und Hannover ist nun Leipzig fortan neue Heimat für das alle zwei Jahre vom Deutschen Chorverband ausgerichtete Fachtreffen der Vokalmusikszene. Seit 2011 hat sich das Veranstaltungsformat zur zentralen Plattform für Chorleiter, Chormanager, Musikpädagogen, Kirchenmusiker, Verleger, Säger und Chorinteressierte entwickelt. In Leipzig wird zu mehr als 150 Workshops, drei hochkarätigen Masterclasses und 20 Konzerten geladen. \n\nIn Bernburg wurde Christian Waltenberg 1988 geboren. Mit sieben Jahren entschied er sich in der Musikschule für das Akkordeon und nahm an mehreren Landeswettbewerben \"Jugend musiziert\" teil. Von 2007 bis 2012 studierte Christian Waltenberg in Leipzig an der Hochschule für Musik und Theater Felix Mendelssohn Bartholdy Musik und Mathematik für gymnasiales Lehramt mit den instrumentalen Fächern Akkordeon, Gesang und Klavier."
