  title: Dom - odc. 3/25 - Warkocze naszych dziewcząt będą białe
  description: |-
    Tytuł oryginalny: Dom
    PL, 1980
    Reżyseria: Jan Łomnicki
    Występują: Tomasz Borkowy, Wacław Kowalski, Jolanta Żółkowska, Anna Ciepielewska, Zbigniew Kryński, Stanisław Zaczyk
    Andrzej Talar zostaje studentem Politechniki. Jego uczciwość i prostolinijność nie zawsze znajdują uznanie i nastręczają mu wielu kłopotów. Ale Andrzej nie poddaje się. Nie rezygnuje też ze starań o względy Basi Lawinówny. Obserwując narastającą tęsknotę dziewczyny, Andrzej podejmuje desperacką decyzję, aby utwierdzić ją w przekonaniu, że Łukasz nie żyje. Skutki są fatalne - Basia próbuje popełnić samobójstwo.
  ageRating: 12
  genre:
