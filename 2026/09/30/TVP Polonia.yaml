  title: Gra słów. Krzyżówka - /1147/
  description: |-
    Tytuł oryginalny: Gra słów. Krzyżówka
    PL, 2026
    Reżyseria: Małgorzata Kosturkiewicz
    Gra słów. Krzyżówka - to format telewizyjny z gatunku codziennego teleturnieju wiedzowego skoncentrowany na ugruntowanym i niesłabnącym od lat fenomenie popularności krzyżówek. Poprzez masowo rozpoznawalny atrybut krzyżówki format w sposób naturalny eksploruje powszechne zamiłowanie widzów do współzawodnictwa bazującego na wiedzy, refleksie i umiejętności kojarzenia. W wersji telewizyjnej walory te rozszerzone zostają o elementy rywalizacji, strategii rozgrywki i szczęścia.
  ageRating: 12
  genre:
  - '112'
  subtitle: Codzienny teleturniej sprawdzający wiedzę, oparty na formule krzyżówki. Czworo uczestników zmierzy się ze sobą, by zdobyć tytuł finalisty dnia i uzyskać możliwość wzięcia udziału w finale tygodnia.
