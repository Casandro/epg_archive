- eventId: 1139261
  start: 2026-09-30T03:00:00Z
  stop: 2026-09-30T03:35:00Z
  title: Barwy szczęścia - odc. 3385
  description: |-
    Tytuł oryginalny: Barwy szczęścia
    PL, 2025
    Reżyseria: Tomasz Szreniawa
    Występują: Karolina Chapko, Marek Krupski, Anna Mrozowska, Gabriela Ziembicka, Jacek Tyszkiewicz, Marta Dąbrowska
    Sebastian wywiera presję na Dominikę, aby ostatecznie zakończyła współpracę z mierzącą się z nałogiem Renatą. Z kolei podczas pobytu w Las Vegas Bruno niespodziewanie proponuje Karolinie zawarcie ekspresowego małżeństwa. W tym samym czasie Justin potajemnie wynajmuje Oliwce pokój hotelowy po obniżonej cenie, co natychmiast wykorzystuje Kajtek, podejmując próbę rozmowy z byłą partnerką. Za to Romeo i Ewa uczestniczą w wymarzonej studniówce.
  ageRating: 12
  genre:
  - '23'
  subtitle: Sebastian naciska Dominikę, by zerwała współpracę z uzależnioną Renatą. W Las Vegas Bruno proponuje Karolinie szybki ślub. Justin wynajmuje Oliwce pokój. Kajtek to wykorzystuje i próbuje z nią porozmawiać.
- eventId: 1139262
  start: 2026-09-30T03:35:00Z
