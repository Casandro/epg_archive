    odc. 7 Jurek śledzi Marysię, która wybiera się do mieszkania Dietricha, gdzie zaczyna służbę. Podejrzewa dziewczynę o kolaborację lub romans z Niemcem. Marysia przeszukuje gabinet Dietricha i znajduje sejf ukryty za obrazem. Irka spotyka się z matką Kamila, Henryką Brodzką. Mówi jej, że dowiedziała się o śmierci narzeczonego. Brodzka nie wierzy w śmierć syna. Irka i Brodzka jadą do Tomaszowa, gdzie ostatnio widziano Kamila żywego.
  ageRating: 12
