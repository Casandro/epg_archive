  subtitle: Andrzej zostaje studentem politechniki. Wciąż stara się o względy Basi. Widząc tęsknotę dziewczyny, postanawia utwierdzić ją w przekonaniu, że Łukasz nie żyje. Basia próbuje popełnić samobójstwo.
- eventId: 1139243
  start: 2026-09-30T02:30:00Z
  stop: 2026-09-30T02:45:00Z
  title: Polscy szpiedzy - Pułkownik Vincent V. Severski
  description: |-
    Tytuł oryginalny: Polscy szpiedzy
    PL, 2026
    Wioletta Firlej rozmawia z byłymi oficerami polskiego wywiadu. Przez lata działali w cieniu, tam gdzie stawką były państwowe tajemnice, bezpieczeństwo i ludzkie życie. Teraz opowiedzą o kulisach operacji, decyzjach podejmowanych pod presją i świecie, którego na co dzień nie widać. W TVP Info wyjątkowy cykl rozmów ze szpiegami i ludźmi wywiadu. W tej rozmowie nie padną żadne nazwiska, no może poza jednym, Putin. Nie wszystkie daty będą mogły być zweryfikowane.
  ageRating: 12
  genre:
