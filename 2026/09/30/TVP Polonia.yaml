- eventId: 1139264
  start: 2026-09-30T04:30:00Z
  stop: 2026-09-30T05:00:00Z
  title: Przyrodnik na tropie - Jaszczurka
  description: |-
    Tytuł oryginalny: Przyrodnik na tropie
    PL, 2020
    Reżyseria: Małgorzata Kosturkiewicz
    Łukasz Bożycki, biolog i fotograf przyrody, omawia w programie różne aspekty życia zwierząt w kontekście ich wzajemnych powiązań i oddziaływań. Przyrodnik obserwuje wybrane gatunki w ich naturalnym środowisku, komentując różne wydarzenia w lekki i przystępny sposób. Seria propaguje wiedzę o polskiej przyrodzie, uzupełniając ją o nieznane, często zaskakujące fakty na temat relacji między zwierzętami.
  ageRating: 12
  genre:
  - '145'
  subtitle: Odcinek o jaszczurkach żyworodnych. Widzowie dowiedzą się, jakich mechanizmów obronnych używają te zwierzęta, gdzie można je spotkać oraz jakie są zależności między nimi a kotami domowymi.
- eventId: 1139265
  start: 2026-09-30T05:00:00Z
  stop: 2026-09-30T05:30:00Z
  title: Okrasa łamie przepisy - Suszone wspomnienia z Borów Tucholskich
  description: |-
    Tytuł oryginalny: Okrasa łamie przepisy
    PL, 2025
    Reżyseria: Tomasz Rostworowski
    Karol Okrasa kontynuuje poszukiwania polskiego smaku. A kiedy już ten smak odnajduje, z pożytkiem dla konserwatywnej polskiej widowni, próbuje go przełamać. Bo wbrew powszechnym wyobrażeniom polska kuchnia to nie tylko pierogi i schabowy. Mamy wielowiekową tradycję podawania ryb, szczególnie słodkowodnych, a polskie mięsa i wędliny biją jakością większość europejskiej produkcji. Od 1989 roku w najdalszych zakątkach Polski wytwarza się smakowite produkty warte zaprezentowania szerokiej widowni.
  genre:
  - '165'
  subtitle: Karol Okrasa zaprosi widzów w Bory Tucholskie. W tym rejonie popularne jest przygotowywanie potraw opartych na suszonym grochu, owocach i grzybach.
