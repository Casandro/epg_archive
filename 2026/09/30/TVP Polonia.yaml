  title: Wodecki Twist - Tylko w kinie
  description: |-
    Tytuł oryginalny: Wodecki Twist - Tylko w kinie
    PL, 2026
    Reżyseria: Maciej Sobociński
    Zbigniew Wodecki był artystą niezwykle wszechstronnym: śpiewał piosenki filmowe, użyczał głosu bohaterom animacji, ale przede wszystkim komponował niezapomniane melodie. Jedna z nich ukryta jest w piosence "Tylko w kinie" - to wokół niej zbudowany jest tegoroczny koncert galowy festiwalu "Wodecki Twist", który odbywa się dorocznie w połowie czerwca w Krakowie.
  ageRating: 7
  genre:
