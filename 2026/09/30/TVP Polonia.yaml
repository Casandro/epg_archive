    PL, 2021
    Reżyseria: Konrad Zagórski
    Cykl reportaży, niewiele mający wspólnego z typowym przewodnikiem turystycznym. Tym razem Lena zabierze nas w kulinarną podróż po Bałkanach. W Serbii odwiedzimy miasto papryki, gdzie zobaczymy, jak wytwarza się słynny ajvar. Pojedziemy też śladami produkcji rakiji i skosztujemy bałkańskiego wina w Chorwacji. Wybierzemy się także na typowy streetfood w Podgoricy i zobaczymy, jak przygotowuje się słynny bałkański burek.
  ageRating: 12
  genre:
  - '161'
  subtitle: Lena zabiera widzów w podróż kulinarną po Bałkanach. Będzie to okazja, by dowiedzieć się, jak jest wytwarzany ajvar, gdzie produkuje się rakiję i jak smakuje bałkańskie wino w Chorwacji.
