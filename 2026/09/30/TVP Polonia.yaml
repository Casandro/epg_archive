    Rodzina Winnych cieszy się z powrotu Antoniego. Bronia ma nadzieję, że już niebawem do ojca dołączą Roman i Kajetan. W Europie szaleje hiszpanka, śmiertelna grypa nie oszczędza rodziny Winnych. Stanisław dowiaduje się od Ignacego o ciąży Władzi. Bronia zaczyna służbę u Stanisława Lilpopa. Dziedzic Podkowy Leśnej wkrótce poznaje Anię i obdarza dziewczynkę wielką sympatią. Do Brwinowa docierają wieści o Bitwie Warszawskiej i wygranej Wojska Polskiego pod wodzą Piłsudskiego.
  ageRating: 12
