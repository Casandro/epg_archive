  title: Die PS Profis - Im Einsatz Roccos Punto
  subtitle: Die PS Profis - Im Einsatz Roccos Punto
  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann. Heute überrascht Sidney Student Rocco. Der heißblütige Italiener fährt einen Fiat Punto, Baujahr 2007,  und liebt Tuning-Treffen. Das Problem: Rocco schämt sich für seinen Serien-Fiat. Weil er kein Geld zum Tunen übrig hat, fährt er zu den Treffen stets in den getunten Karren seiner Kumpels mit. Das will Sidney ändern. Ein rassiger Italiener soll auch einen rassigen Fiat fahren, ist seine Devise. Deshalb beauftragt er Folierer Daniel mit einem außergewöhnlichen Design. Wenn schon Italien, dann aber richtig. Natürlich sorgt auch Sidneys Crew wieder dafür, dass der Fiat wie geschmiert läuft, aber ob die gewagte Folierung wirklich bei Rocco ankommt? Diesen Wagen wird es künftig auf Deutschlands Straßen nur einmal geben.'
  widescreen: true
