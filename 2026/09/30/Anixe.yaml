  title: Kochen mit Anixe - Lasagne- mal anders verpackt
  subtitle: Kochen mit Anixe - Lasagne- mal anders verpackt
  description: Die Lasagne stammt aus Bologna und wird dort kurz Pasticcio genannt. In Deutschland ist sie eher als Lasagne al forno bekannt. Das Gericht besteht aus mehreren abwechselnden Schichten von Nudelplatten, Ragù alla Bolognese, Béchamelsauce und geriebenem Parmesan und wird im Ofen gebacken. Unserem TV Koch ist das zu langweilig. Deshalb hat er diesem beliebten Gericht kurzerhand eine andere Grundlage gegeben. Blätterteig kennt unsere Moderatorin Tanja Götemann eigentlich eher im Zusammenhang mit etwas Süßem. Doch diese Kombination hat das Zeug, die klassische Lasagne zu entthronen.  Hier das komplette Rezept!
