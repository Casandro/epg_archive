  title: Dove sta Zazà (ep3)
  subtitle: '"Dove sta Zazà" andò in onda nel 1973 sul Programma Nazionale in 4 puntate. Girato a colori, andò in onda in bianco e nero (qui di seguito, per la prima volta, tutte le puntate integrali a colori). Il programma era condotto d'
  description: "a Gabriella Ferri, Enrico Montesano, Pippo Franco, Oreste Lionello e Pino Caruso. \"Dove sta Zazà\" era fondato sulle canzoni della Ferri e sugli sketch dei comici tratti dal repertorio del cabaret classico. La regia era di Antonello Falqui, autore del programma insieme a Mario Castellacci e Pier Francesco Pingitore. La terza puntata è incentrata sulla comicità dell'Italia del secondo dopoguerra e Montesano strappa un sorriso amaro con un monologo sulla povertà dilagante in quegli anni. \"La nuova compagnia di canto popolare\" interpreta \"Tammurriata nera\" e Gabriella Ferri si esibisce con la celebre \"Simm' 'e Napule paisa'\". Pippo Franco è un irresistibile rigattiere emigrato e Caruso è impegnato nel ruolo di un carcerato. - \n\nUn programma di Enrico Salvatori con la collaborazione di Lucia Ciancaglini Produttrice esecutiva Alessandra Giorgi Regia Agostino Pozzi, Fabrizio Marini"
