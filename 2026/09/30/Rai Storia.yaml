  description: "l'illuminazione elettrica della Scala grazie alla prima centrale termoelettrica dell'Europa continentale progettata dall'ingegnere Giuseppe Colombo. Un'avventura che tra ricerche, intuizioni e scoperte, prosegue lungo i primi decenni del 900 con la costruzione dei bacini idroelettrici di Paderno d'Adda, la nascita dell'Agip, fino ad arrivare al secondo dopoguerra segnato dalla straordinaria capacità operativa e strategica del fondatore dell'ENI, Enrico Mattei. Ma oltre che al passato si guarderà anche al futuro dell'energia, spinti dal vento del primo parco eolico offshore del Mediterraneo realizzato nel golfo di Taranto. Una vicenda avvincente e di grande attualità che Mario Sechi racconterà insieme all'Ad dell'Eni Giovanni Descalzi, allo storico dell'economia Giulio Sapelli e alla economista Valeria Termini. - Conduce Mario Sechi, di Mario Sechi, Enrico Salvatori Clemente Volpini e di Roberto Fagiolo, Fabrizio Marini e Gian Maria Tavanti; coordinamento editoriale Anna Lisa Guglielmi, regia Claudio Del Signore\n\ncon Mario Sechi, un programma di Mario Sechi, Clemente Volpini, Enrico Salvatori, scritto con Roberto Fagiolo, Fabrizio Marini, Gian Maria Tavanti e con Elena Milani, coordinamento editoriale Anna Lisa Guglielmi, a cura di Lucia De Angelis, produttore esecutivo Germana Mudanò, regia Claudio Del "
