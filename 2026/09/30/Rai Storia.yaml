  title: Passato e Presente La strage di Marzabot
  subtitle: Passato e Presente La strage di Marzabotto - Monte Sole - Tra il 29 settembre e il 5 ottobre del 1944, si compie a Monte Sole la più sanguinosa strage compiuta dai nazifascisti durante l'occupazione tedesc
  description: 'a. La strage viene spesso ricordata come strage di Marzabotto, ma le violenze subite dalla popolazione civile hanno riguardato non solo il comune di Marzabotto ma tutta l''area. I tedeschi asserragliati sulla Linea Gotica, con gli Alleati che avanzano verso nord e i partigiani che rappresentano una spina nel fianco, decidono di rispondere attuando la strategia della ''''terra bruciata'''': annientare interi territori e la popolazione che ci vive. A Monte Sole è una settimana di fuoco che distrugge per sempre 115 località. Alla fine, il bilancio è di 770 morti, di cui quasi un terzo al di sotto dei dodici anni. E'' la più grande strage di civili di tutta l''Europa occidentale. Emanuela Lucchetti racconta gli eventi direttamente dai luoghi in cui si sono svolti mentre in studio, con Paolo Mieli, c''è la storica Isabella Insolvibile. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno  Ospite in studio la prof.ssa Isabella Insolvibile Con la partecipazione di Emanuela Lucchetti Regia Davide Frasnelli Produttore Esecutivo Valentina Tassini'
- eventId: 1307803
  start: 2026-09-30T04:40:00Z
  stop: 2026-09-30T05:25:00Z
  title: Viaggio in Sicilia Siracusa e il mito gr
  subtitle: Viaggio in Sicilia Siracusa e il mito greco - L'ultima tappa del viaggio della scrittrice Simonetta Agnello Hornby e del suo amico illustratore e fumettista Massimo Fenati è Siracusa. L'emozione e la sorpr
  description: |+
    esa accompagnano Simonetta e Massimo nellarea archeologica di Siracusa, il parco archeologico della Neapolis, quando entrano nel famoso Orecchio di Dionisio e nel Teatro Greco vuoto, riempito da suoni e ricordi delle rappresentazioni a cui Simonetta aveva assistito in passato. Sulla via del ritorno verso Agrigento, Simonetta decide di mostrare a Massimo uno dei luoghi che hanno ispirato il suo romanzo 'Il veleno dell'oleandro': Pantalica. Un'antica necropoli, risalente al XIII secolo a.C., sito archeologico divenuto nel 2005 Patrimonio dell'Umanità. Simonetta e Massimo tornano finalmente a casa, a Mosè. Attorno alla tavola imbandita la famiglia si riunisce per condividere i ricordi di questo straordinario viaggio. - Con Simonetta Agnello Hornby e Massimo Fenati

