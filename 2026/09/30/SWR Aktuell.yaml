  description: |-
    14:00
    SWR Kultur Das Wissen
    Versteckte Botschaften auf Social Media - Was hinter Algospeak steckt
    S_x, s&lt;hwul und kweer: Wer durch Instagram oder TikTok scrollt, begegnet Algospeak. Emojis und Buchstaben-Verdreher sollen die Inhaltsfilter bei Social Media umgehen und Aufklärungs-Content, aber auch Hassbotschaften verbreiten.
    Von Sophie Wannenmacher (SWR 2026)
    Gibt es auch zum Nachhören in ARD Sounds:
    https://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/

    14:30
    SWR1 Leute mit Jörg Friedrich | Computerspiel-Entwickler
    Zocken mit Geschichte(n): So spannend kann Gaming sein
    Computerspiele, die Wissen vermitteln sollen oder sogar eine Art "Lehr-Auftrag" haben, sind eher schwierig an die Gaming-Community zu bringen. "Serious Games", in denen gesellschaftliche Themen behandelt werden, sind bei den Nutzerzahlen nicht ganz oben in den Hitlisten. Der Spieleentwickler Jörg Friedrich ist trotzdem ganz bewusst in diesem Bereich aktiv.
