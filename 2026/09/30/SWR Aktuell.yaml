  start: 2026-09-30T16:30:00Z
  stop: 2026-09-30T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Franz von Assisi - Radikaler Prophet der Armut
  description: |-
    Von Rolf Cantzen
    Freiwillige Armut statt Kirchenprunk, Frieden statt Kreuzzüge, mystische Gotteserfahrung statt erstarrter Frömmigkeit: Franz von Assisi radikalisierte kirchenkritische Reformbewegungen seiner Zeit. Nach seinem Tod 1226 wurde er zur Projektionsfigur: Die Kirche entschärfte seine Armutsbotschaft zur systemkonformen Armenfürsorge, seine Kritik an Macht und Gewalt zu Demut und Volksnähe. Mussolini stilisierte ihn zum Symbol nationaler Größe. Heute gilt Franz von Assisi vielen als "Ökoheiliger" und Vordenker spirituell begründeter Ökologie.
- eventId: 682797
  start: 2026-09-30T17:00:00Z
  stop: 2026-09-30T18:00:00Z
  title: Der Tag
  description: 'Lebensmittel sind teuer geworden. Das Gute daran: Wegen der hohen Preise schmeißen wir weniger weg. Und trotzdem ist der Müllberg immer noch riesig. Elf Millionen Tonnen Lebensmittel verschwendet Deutschland jährlich. Den Großteil davon schmeißen private Haushalte weg. Rund 75 kg - meist Obst und Gemüse - kauft jeder zu viel ein. Der Aktionstag "Zu gut für die Tonne!" vom Bundeslandwirtschaftsministerium will darauf aufmerksam machen. Wir sollen unseren Wocheneinkauf besser planen und Reste verwerten.'
  subtitle: Gekauft, vergessen, weggeschmissen - verschwendete Lebensmittel
