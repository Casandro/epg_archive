  title: Luxury Driving
  subtitle: Auftrag Luxus
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Wo kaufen Pop- und Rockstars, Profisportler und Scheichs ihre Luxusfahrzeuge? Bei Omid Mouazzen. In seinem exklusiven Autohaus, das er gemeinsam mit einem Jugendfreund gegründet hat, stehen Hypercars im Wert von über 50 Millionen Euro - vom seltenen Supersportwagen bis zur maßgeschneiderten Einzelanfertigung. Ein Erfolg, der alles andere als selbstverständlich ist: Mouazzen kam als Kind mit seinen Eltern aus dem Iran nach Deutschland und wuchs in einfachen Verhältnissen auf. Heute bewegt er sich in einer Welt aus PS, Prestige und Perfektion - und zeigt, dass Luxus manchmal aus Leidenschaft entsteht.'
