  description: 'Wir erinnern uns an das große Finale der zweiten Staffel: Sophies standesamtliche Hochzeit endet ohne Trauung, aber dafür in einer wilden Verfolgungsjagd, denn es stellt sich heraus, dass die Standesbeamtin niemand anders ist als "Marilyn", jene Juwelendiebin, die Sophie bereits mehrmals entwischt ist. Und mitten in dieser Verfolgungsjagd beginnt die dritte Staffel von "Mord mit Aussicht". Für Sophie ist ihre Hochzeit mit einem Schlag zweitrangig. Sie, Bärbel und Dietmar heften sich an Marilyns Fersen, die ihnen jedoch entkommt. So einfach lassen sich die Polizeikollegen aber von der Provinzkriminellen nicht abschütteln.'
