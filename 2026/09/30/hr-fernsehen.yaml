  description: Ein Amtsinspektor aus der Verwaltung des Deutschen Bundestags verliert offenbar häufig seine Koffer. Immer auf interkontinentalen Flügen, immer am Frankfurter Flughafen. Er meldet zwischen 1991 und 1997 mindestens 80 Gepäckstücke als verloren - und erhält am Ende insgesamt 240 000 DM Schadenersatz von 39 verschiedenen Fluggesellschaften. Doch dann fällt der 43-Jährige den Mitarbeitenden am Lost- and Found-Schalter auf. Die Kripo ermittelt und 1998 steht der Bundestags-Mitarbeiter vorm Frankfurter Landgericht wegen Betruges.
