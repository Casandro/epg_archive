  title: 'Tobis Urlaubstrip: Bergstraße'
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Moderator Tobi Kämmerer erkundet bei seinem "Urlaubstrip" die Bergstraße - von einem historischen Bergwerk über den schwierigsten Klettersteig nördlich der Alpen bis zu einem Rittermahl im Schloss Auerbach. Dabei begegnet er unter anderem der Deutschen Weinprinzessin Katja Simon, einem traditionsreichen Eiscafé und einer Hofgut-Chefin, die Whiskey brennt.
