  description: |-
    Deutschland 2022
    Eine Giftgas-Insel, eine tödliche Mine und ein verwunschenes Hotel. Drei vergessene Orte in Japan - Symbole eines imperialen Größenwahns und eines rassistischen Menschenbildes.

    Zwischen 1933 und 1940 steigt Hideki Tojo zum mächtigsten Politiker des Kaiserreichs auf. Seine Vision: ein japanisches Imperium in Asien. Die drei verlassenen Orte erzählen noch heute von der Härte und Grausamkeit, mit der Tojo sein Ziel erreichen wollte.
    HD-Produktion
