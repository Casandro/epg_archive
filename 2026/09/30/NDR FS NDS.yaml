  description: 'Das Unternehmen "Entrümpelungen mit Herz" bietet nachhaltige Haushaltsauflösungen. Das Konzept ist so einfach wie nachhaltig: so wenig wie möglich soll weggeworfen, so viel wie möglich wiederverwertet werden. Möbel, Gartengeräte, Geschirr oder Teppiche, alles was brauchbar ist, wird gespendet, sei es an gemeinnützige Vereine, Sozialkaufhäuser, Frauenhäuser, Kitas, Personen mit geringem Einkommen, Pflegeeinrichtungen oder Tierheime. Dabei ist es für die Gründerin Michaela Jeric und ihr Team nicht immer leicht, alle Fundstücke und Überbleibsel zu vermitteln.'
