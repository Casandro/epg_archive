  description: Im Zoo gerät Dr. Mertens bei der Behandlung einer depressiven Elefanten-Kuh mit der Cheftierärztin Dr. Elif Sahin aneinander. Dabei werden die unterschiedlichen Ansätze der beiden Tierärztinnen deutlich - ebenso wie der Umstand, dass Susanne sich erst daran gewöhnen muss, nicht mehr die Chefin zu sein. Die Situation wird durch den Besuch von Elifs Vater noch pikanter. Er findet Susanne Mertens höchst sympathisch und stimmt als ehemaliger Tierarzt Susanne fachlich zu. Susanne entscheidet sich dann auch noch dafür, Elifs Anordnung zu umgehen, was zum Konflikt führt.
