  title: Hans Hass - Pionier der Tiefe
  subtitle: Deutschland 2022
  subtitled: true
  genre:
  - '112'
  description: Die Unterwasserwelt hat für viele Menschen eine magische Anziehungskraft. Die ersten Aufnahmen von farbenprächtigen Korallenriffen und imposanten Haien verdanken wir Hans Hass. Er machte in den 1930er Jahren als Erster dem großen Publikum die Welt der Meere mit seinen Filmen und Forschungsexpeditionen zugänglich - zu einer Zeit, in der das noch fast unmöglich schien.
- eventId: 741939
