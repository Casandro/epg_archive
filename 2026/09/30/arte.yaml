  title: 360° Reportage
  subtitle: 'Georgien: Welcome teacher!'
  subtitled: true
  genre:
  - '112'
  description: Swanetien ist eine der faszinierendsten und auch abgelegensten Regionen Georgiens. Doch viele Bergbewohner verlassen ihre Heimat, um in den Städten ein besseres Leben zu suchen. Betroffen ist auch Kala, ein kleines, fast 2.000 Meter hoch gelegenes Dorf. Der örtliche Schuldirektor befindet sich in einer heiklen Lage. Nur noch 17 Schüler besuchen seine Schule. Trotzdem gilt hier, wie überall im Land, die Schulpflicht. Fachlehrer für Naturwissenschaften und vor allem für Englisch sind kaum zu finden.
