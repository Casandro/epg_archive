  title: Memex Nautilus - Tutta l'energia del Sol
  subtitle: 'Memex Nautilus - Tutta l''energia del Sole - Nautilus - Tutta l''energia del Sole - L''informazione e l''approfondimento scientifico di Rai Cultura. Con l''astrofisico Luca Perri alla scoperta del mondo che ci '
  description: 'circonda e delle sue regole. Con l''astrofisico e divulgatore Luca Perri andiamo alla scoperta del mondo che ci circonda e delle sue regole. In questa puntata parliamo del Sole, la nostra stella madre. Una stella giovane, che ha soltanto 4 miliardi e mezzo di anni e appartiene all''ultima generazione di stelle apparse nella nostra Galassia. Il Sole è artefice della nostra esistenza e in parte del nostro vivere quotidiano, anche nel mondo tecnologico. Produce energia convertendo idrogeno in elio attraverso reazioni nucleari: per ora si stima che abbia consumato metà dell''idrogeno a sua disposizione e che terminerà di bruciarlo nei prossimi 5 miliardi di anni. E a quel punto che cosa accadrà? Ne parliamo con Roberto Ragazzoni, Direttore dell''Osservatorio Astronomico di Padova, e con l''astronoma dell''INAF, Ilaria Ermolli, entriamo nell''Osservatorio Astronomico di Roma per scoprire come si osserva il Sole tramite uno strumento precisissimo: il Precision Solar Photometric Telescope. Altrettanto precisi sono i disegni delle macchie solari che Galileo Galilei raffigura tra il 1610 e il 1612: ce li racconta Anna Pancaldi, in un altro affascinante capitolo del lungo romanzo della conoscenza svelato dal Sole. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
