  description: "ndo che ci circonda e delle sue regole. Il tema di questa puntata è la Meteorologia (da non confondere con la Climatologia!). Due gli ospiti in studio: il professor Roberto Buizza, appena arrivato alla scuola superiore Sant'Anna di Pisa dopo quasi 30 anni di lavoro in uno dei centri di ricerca di eccellenza mondiale in questo settore: l'European Centre for Medium Range Weather Forecasts (ECMWF) di Reading, nel Regno Unito; e il dottor Carlo Cacciamani, meteorologo a capo del Centro Funzionale Centrale della Protezione Civile. Con Luca Mercalli, presidente della Società Italiana di Meteorologia, entriamo all'interno di una delle più antiche stazioni meteo del mondo, ancora oggi in funzione a Moncalieri, a due passi da Torino. Mentre il meteorologo Pascal Gilles, alla sede italiana dell'Agenzia Spaziale Europea (l'ESRIN di Frascati) ci spiega i segreti dei satelliti meteorologici e dell'osservazione della Terra dallo spazio. Anna Pancaldi, infine, ci tiene per mano in un viaggio attraverso la preistoria della meteorologia e ci racconta poi la storia di John Neumann e del primo 'supercomputer' che permise negli anni '50 l'emissione regolare dei primi bollettini meteo negli Stati Uniti. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Catia Barone, Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
