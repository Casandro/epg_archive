  description: "sua volta mutato. Memex Doc \"CambiaMenti\" raccoglie questa sfida: comprendere e raccontare il cambiamento, la tensione tra presente e futuro, attraverso la lente della ricerca scientifica e tecnologica. In questa puntata scopriamo come il futuro della medicina, sempre più personalizzata e preventiva, nonché quello delle terapie riabilitative sia in gran parte già cominciato. E vediamo quanto centrali siano in questo senso le nuove tecnologie: computer science e big data prima di tutto. Come e perché ce lo spiega Roberto Cingolani, direttore scientifico dell'Istituto Italiano di Tecnologia. Per capire i nuovi scenari della farmacopea incontriamo invece Silvio Garattini, fondatore dell'Istituto Mario Negri. - \n\nUn programma di Massimo Bongiorno, Davide Coero Borga, Diego Garbati, Alberto Polimanti - Testi di Massimo Bongiorno - Produttori esecutivi Diego Garbati e Livia Lauriola - Regia Alberto Polimanti - Conduce Davide Coero Borga"
