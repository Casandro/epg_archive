    Tytuł oryginalny: Candice Renoir
    FR, 2017
    Reżyseria: Adeline Darraux
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, Delphine Rich, Nora Camargo
    Komendant Renoir i jej zespół badają tragiczne losy zamordowanej kobiety, której matka prostytutka została zabita latem 1975 roku. Fun, ukochany pies rodziny, rani Candice, która zapada śpiączkę. Jej rodzina i zespół, a w szczególności Antoine, są przybici. Pogrążona w śpiączce Candice przenosi się do roku 1975, aby kontynuować śledztwo. Z tą różnicą, że nie jest szefową, a zwykłą asystentką od pisania i robienia kawy!
