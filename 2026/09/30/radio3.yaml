  title: 'ARD Jazz: Das Magazin'
  description: 'Das wöchentliche Jazz-Update, präsentiert von Eurer ARD: außergewöhnliche Veröffentlichungen, relevante Ereignisse und aktuelle Debatten. Wir diskutieren Jazz in allen seinen Facetten und suchen auch deutschlandweit die Orte auf, an denen er zu Hause ist. Nicht verpassen!'
