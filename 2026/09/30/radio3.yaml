- eventId: 688794
  start: 2026-09-30T18:00:00Z
  stop: 2026-09-30T20:00:00Z
  title: ARD Konzert
  description: "Die Deutsche Radio Philharmonie und Creative Partner Brett Dean\nDer Australier Brett Dean zu Gast in Saarbrücken\n\nDer australische Bratscher, Komponist und Dirigent Brett Dean pflegt eine ganze Saison seine kreative Partnerschaft mit der Deutschen Radio Philharmonie, mit eigenen Werken, als Kammermusiker und Solist\n\nSeine Inspiration als Komponist zieht der Australier Brett Dean zum einen aus seiner 14-jährigen Orchestertätigkeit als Solobratscher der Berliner Philharmoniker, zum anderen aus Rockbands, in denen er gespielt hat. Seine Musik klingt vor allem farbenreich, ergänzt häufig Elektronik und Samples. Während seiner kreativen Partnerschaft in Saarbrücken hat der sympathische und offenherzige 64-jährige mit der Deutschen Radio Philharmonie sein eigenes Bratschenkonzert gespielt, kombiniert mit HK Grubers Frankenstein-Pandämonium und Cerhas Wiener Kaleidoskop. \n\nAufnahme vom 19.04.2026 aus der Saarbrücker Congresshalle\n\nBrett Dean, Viola\nDeutsche Radio Philharmonie\nHK Gruber, Dirigent und Chansonnier\n\nBrett Dean: \nViolakonzert\nFriedrich Cerha: \n»Wiener Kaleidoskop« für Orchester (Auswahl)\nHK Gruber: \n\"Frankenstein!!\", Pandämonium für Chansonnier und Orchester nach Kinderreimen von H. C. Artmann\n\nBrett Dean:\nPastoral Symphony für Kammerorchester und Tonband\nDeutsche Radio Philharmonie \nMartyn Brabbins, Dirigent\n\nAufnahme vom 19.06.2026 aus dem SR Sendesaal\n\nRalph Vaughan Williams:\nFantasie über Themen von Thomas Tallis für doppeltes Streichorchester\nDeutsche Radio Philharmonie \nBrett Dean, Dirigent\n\nAufnahme vom 29.02.2024 aus dem SR Sendesaal"
