  start: 2026-09-30T06:00:00Z
  stop: 2026-09-30T06:51:00Z
  title: Airport Security USA - Folge 003
  subtitle: Airport Security USA - Folge 003
  description: 'Bei den Sicherheitskontrollen amerikanischer Flughäfen gleicht kein Tag dem anderen: In dieser Folge entdecken die Beamten in Newark Marihuana in Kinderspielzeug und in dem Gepäck eines Fluggastes in San Francisco die halluzinogene Droge DMT. Bei der Kontrolle von Jägern aus Afrika sorgen ungewöhnliche Waffen für Aufsehen. Und: Ein Mann, der vor seiner Asylanhörung nach Ghana zurückkehren will, wird aufgehalten.'
