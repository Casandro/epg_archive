  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Stetig sinkende Mitgliedszahlen in den Landeskirchen - was tun? Tobi Wörner plädiert dafür, lieber die Zukunft zu gestalten, statt den Untergang zu verwalten. Er hat es bereits vor Jahren mit der Gründung der jesustreff-Gemeinde in Stuttgart vorgemacht. Heute wirkt er als Projektreferent aktiv an neuen Formen christlichen Gemeindelebens mit und unterstützt Christen bei der Umsetzung ihrer innovativen Ideen. Aber wie können auch bestehende Gemeinden die Zukunft mitgestalten? Moderation: Wolfgang Severin'
