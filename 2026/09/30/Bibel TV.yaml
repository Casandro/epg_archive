  subtitle: Wie glaubwürdig ist das Neue Testament?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der christliche Glaube ist nicht blind, sondern beruht auf historischen Belegen, sagt der Althistoriker Dr. Jürgen Spieß. Klar datierbare und lokalisierbare Fakten sind für den christlichen Glauben von großer Bedeutung, was sich schon am Glaubensbekenntnis ablesen lässt. Auf welcher Quellenlage das Neue Testament beruht und warum die Arbeitsweise eines Historikers der eines Juristen gleicht, erklärt dieses informative Interview.'
