  title: Jahrhundertzeugen
  subtitle: Margot Friedländer
  widescreen: true
  hd: true
  description: Margot Friedländer war eine der letzten Überlebenden der Shoah. 2021 wurde sie 100 Jahre alt ein Jahrhundertleben. Aus diesem langen, besonderen Leben, das sie schon früh selbst in die Hand nehmen musste, um es zu retten, berichtete Margot Friedländer seit ihrer Rückkehr als Zeitzeugin des Holocausts jungen Menschen in Deutschland.
