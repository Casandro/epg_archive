  title: Nürnberg 45 - Im Angesicht des Bösen
  subtitle: Meine Geschichte - Nach dem Krieg
  widescreen: true
  hd: true
  description: Am 20. November 1945 beginnt der erste der sogenannten Nürnberger Prozesse. Auf der Anklagebank des Internationalen Militärgerichtshofes sitzen Hermann Göring und 23 weitere ranghohe Nazis, wie Franz von Papen, Wilhelm Keitel oder Albert Speer. Nach monatelangen Verhandlungen verhängt das Militärtribunal zehn Todesurteile und sieben Freiheitsstrafen. Drei Angeklagte werden freigesprochen.
