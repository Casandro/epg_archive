  stop: 2026-09-30T19:45:00Z
  title: Wer kann das bezahlen? Preisschock - Alles wird teurer!
  subtitle: Mehrteilige Reihe mit Anna Planken
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Anna Planken trifft Menschen in NRW und spricht mit ihnen über Geld. \nWährend die Hälfte der Menschen in Deutschland weniger als 2000 Euro netto verdient, gibt es gleichzeitig immer mehr Einkommens-Millionäre. Viele spüren, dass sie auf ihrem Konto am Monatsende weniger übrig haben. \n\nAnna Planken: \"Alles wird teurer, egal in welchen Bereich wir gucken:  Essen, Trinken, Klamotten, Möbel. Und wir wollen uns ja nicht nur versorgen. Wie schaffen wir es den kleinen Luxus in den Alltag zu bringen? Wir suchen nach Strategien, sich trotzdem noch was gönnen zu können.\""
