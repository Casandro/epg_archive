  title: In aller Freundschaft (1020)
  subtitle: Alles aus Liebe
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Friedrich Müggels und seine Freundin Irina Belova werden nach einem schweren Autounfall in die Sachsenklinik eingeliefert. Friedrich muss die Milz entfernt werden. Irina hat zwei gebrochene Rippen und eine Prellung im Gesicht. In einem vertraulichen Gespräch deutet Irina gegenüber Pflegerin Jasmin an, dass sie sich kurz vor dem Unfall mit ihrem Freund gestritten hat. Jasmin bespricht sich mit Dr. Lilly Phan, da sie einen Fall von häuslicher Gewalt vermutet. Doch nach außen hin suggeriert das Paar völlige Harmonie
