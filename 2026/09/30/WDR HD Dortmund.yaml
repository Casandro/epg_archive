  title: 'Expedition in die Heimat: Der Limes Wanderweg in Rheinland-Pfalz'
  subtitle: mit Anna Lena Dörr
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Eine Wanderung entlang des Unesco-Welterbes Limes ist eine Wanderung in die Geschichte und in die Moderne. Zwar trifft SWR Moderatorin Anna Lena Dörr auf ihrem Weg überall auf Reste der römischen Besatzung, aber auch auf eine einzigartige Landschaft mit grandiosen Tälern und unendlich wirkenden Höhenzügen. Tipp: unbedingt nachwandern.'
