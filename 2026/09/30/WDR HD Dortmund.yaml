  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der hochgradig schwerhörige Joshua Keller wird nach einem Skateboard Unfall mit Verdacht auf eine Schlüsselbeinfraktur in die Klinik eingeliefert. Der Junge ist Philipp gut bekannt, nimmt er doch schon seit Monaten Untersuchungen bei Joshua vor, um ihm ein Cochlea Implantat zur Verbesserung seines Gehörs einsetzen zu können. Doch Joshuas Mutter weiß davon nichts und lehnt den Eingriff vehement ab.
- eventId: 553693
  start: 2026-09-30T06:25:00Z
