  title: Rentnercops (28)
  subtitle: Gut für die Gerechtigkeit
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mitten in Köln wird Lisa, eine junge radikale Feministin, ermordet, die im Stil von Femen gegen Sexismus protestiert hatte. Vicky, Plocher und Hui versuchen, Edwin und Günter aus den Ermittlungen herauszuhalten, aus Angst, die beiden könnten beim Thema Feminismus in ihrer unverblümten Art einen PR-GAU für die Polizei verursachen. Natürlich sind beide beleidigt, dass man ihnen so wenig Sensibilität im Umgang mit heiklen Themen zutraut - aber sie fügen sich unter Protest.
    Bei den weiteren Ermittlungen werden sie auf einen Stalker hingewiesen, der Lisa angeblich schon länger beobachtet. Aber ist er auch der Täter?
- eventId: 554326
  start: 2026-09-30T13:10:00Z
  stop: 2026-09-30T14:00:00Z
  title: Rentnercops (29)
  subtitle: Ein Schuss, zwei Treffer
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Auf ein Liebespaar, das in einem Auto zur Sache kommt, wird geschossen: Der Mann überlebt den Anschlag, die Frau wird tödlich getroffen. Wie sich herausstellt, ist der verletzte Liebhaber ein gut beschäftigter Callboy, der in dem Viertel allerdings nur bei den Damen sehr beliebt war.
    Offenbar wurde seine Telefonnummer unter den Frauen des Viertels munter weitergereicht. Günter ist empört über diese Unmoral. Mehrere eifersüchtige Ehemänner kommen als Täter infrage. Aber wer war eigentlich das Ziel: der Callboy oder seine Kundin?
