  subtitle: 'Erika Freeman zu: "Meine persönliche Rache an Hitler"'
  description: |-
    Mit zwölf Jahren musste Erika Freeman als jüdisches Mädchen vor den Nationalsozialisten in die USA fliehen, heute lebt sie wieder in Wien und setzt sich als Zeitzeugin gegen Antisemitismus und das Vergessen ein.
    Bei Patrick Budgen spricht die erfolgreiche Psychoanalytikerin über ihr außergewöhnliches Leben in den USA, ihre Begegnungen mit Hollywood-Stars und darüber, wie sie heute mit 99 Jahren auf die Welt blickt.
