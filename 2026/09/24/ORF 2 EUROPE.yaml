  title: Fit mit den Stars
  subtitle: Corinna Kamper-Campisi
  description: "\"Fit mit den Stars\" bringt täglich frische Motivation für einen aktiven Start in den Tag! Das ORF-Fitnessformat läuft von Montag bis Freitag um 9:10 Uhr auf ORF 2.\nOb Tanzprofi, Sportlegende oder TV-Star - jede prominente Person bringt seine oder ihre persönliche Note in die Fitnessübungen ein. Neben wechselnden Gästen sorgen Fixstarter Conny Kreuter und Corinna Kamper mit ihren abwechslungsreichen Übungen für Schwung und gute Laune. \n\"Fit mit den Stars\" richtet sich an alle Altersgruppen."
