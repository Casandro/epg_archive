  title: Mord mit Aussicht (12)
  subtitle: Mikado
  description: 'Baumarktinhaber Pfaff wird beim Nordic Walking vor den Augen seiner Frau und eines Angestellten erschossen. Pfaff führte seinen Baumarkt mit eiserner Hand - doch ist der Täter wirklich im weiteren Umfeld zu suchen? Denn die besten Motive für die Tat haben eigentlich die Menschen, die bei dem Mord dabei waren. Aber wie sollten die das angestellt haben? Während Sophie also versucht, die Geheimnisse zweier nicht wirklich gut funktionierender Ehen zu entschlüsseln, funktioniert eine Partnerschaft furios: Heike und Dietmar sind im Wohnmobil nach Holland gefahren und erleben dort trotz strömenden Regens wunderbare zweite Flitterwochen.'
