  title: In aller Freundschaft - Die jungen Ärzte (120)
  subtitle: Versteckte Wunden
  description: 'Dr. Niklas Ahrend und Ben Ahlbeck operieren gemeinsam Egon Garowski. Dem älteren Herren ist der Nachbarsjunge auf die Nase gefallen. Der einfache Eingriff wird jedoch zu einem Medizin-Krimi, als die Ärzte eine Entdeckung machen, die das Leben ihres Patienten von Grund auf verändert. Um Egon zu helfen, holt Niklas sich deswegen Unterstützung. Zu Bens Leidwesen niemand anderen als seinen Vater: Prof. Dr. Richard Ahlbeck. Wird das Zusammentreffen der beiden reibungslos verlaufen? Und können die Ärzte Egon retten?'
