  title: Giraffe, Erdmännchen & Co. (223)
  subtitle: Zoogeschichten aus Frankfurt und Kronberg
  description: 'Es heißt wieder Abschied-Nehmen für die Pfleger: Die Seebären Nabi und Chico verlassen den Frankfurter Zoo. Ihr neues Zuhause: Ein Zoo in Polen. Doch bis dahin ist es noch ein langer Weg. Auch das Einfangen der Tiere erweist sich als komplizierter als gedacht. Nabi und Chico wollen ihr altes Zuhause einfach nicht verlassen. Das heißt für die Pfleger: viel Geduld und Feingefühl. Das brauchen auch Stefan von Gemünden und seine Pfleger im Opel-Zoo. Heute wollen sie zum ersten Mal die Gibbon-Weibchen zusammen lassen. Ob das gut geht?'
