  title: Mord mit Aussicht (11)
  subtitle: Tödlicher Lehrstoff
  description: 'Sophie wundert sich - und Bärbel klärt sie auf: Der Grund, warum Heike und Dietmar in letzter Zeit so abgelenkt sind, ist die Hochbegabung ihres Sohnes Kevin. Und da dieser dank seines überdimensionierten IQ''s Probleme mit der "normalen" Schule hat, soll er ins Eliteinternat Lobberich einziehen, das ganz in der Nähe von Hengasch liegt. Noch bevor Kevin dort als Stipendiat aufgenommen wird, fällt dummerweise sein künftiger Lehrer Dr. Kroy tot um: Herzinfarkt - sagt jedenfalls Dr. Bechermann, der Gynäkologe des Landkreises, der nur allzu oft im Notdienst tätig ist.'
