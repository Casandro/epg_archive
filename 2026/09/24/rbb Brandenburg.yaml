  title: In aller Freundschaft (591)
  subtitle: Sirenengesang
  description: Cornelia Voss bringt ihren Mann Wolfgang in die Sachsenklinik. Er leidet seit längerem unter diffusen Stresssymptomen. Wolfgang macht seine Frau dafür verantwortlich, die nach der Erziehung der Kinder Betriebswirtschaft studiert hat und vor einem halben Jahr in Wolfgangs Knopfmanufaktur eingestiegen ist. Während Cornelia betriebswirtschaftlich denkt, besteht Wolfgang auf der Exklusivität seiner Knöpfe. Dr. Philipp Brentano kann keine klare Diagnose stellen. Wolfgang scheint von allem ein bisschen zu haben. Sein Zustand verschlechtert sich immer weiter.
