  title: In aller Freundschaft (592)
  subtitle: Berührungsangst
  description: Die Fischzüchterin Maja Jäger beliefert täglich den Fischladen von Paul Menke, den dieser zusammen mit seinem Freund und Angestellten Torben Unger führt. Seit Maja das erste Mal den Laden betreten hat, ist Torben in sie verliebt und um sicher zu gehen, hat er Paul gebeten, die Finger von Maja zu lassen. Bei einer Routinekontrolle durch das zuständige Amt kommt der Verdacht auf, dass das Eis in der Auslagetheke verschmutzt und somit der Fisch kontaminiert ist. Als Paul kurz darauf mit Magenproblemen zusammenbricht, scheint sich der Verdacht zu bestätigen.
