  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: výtvarník a spisovatel Pavel Čech o obrázcích k básním. Jaká byla cesta od profesionálního hasiče k ilustracím a obrazům? Jak vznikají náměty pro komiksy určené dětem a dospívajícím? Proč ho tak fascinují staré zahrady, labyrinty, tajemné uličky vymyšlených měst a legendární Rychlé šípy? Moderuje Jarka Vykoupilová.'
