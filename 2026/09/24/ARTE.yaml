  description: 'Cap au sud, le Nomade des mers continue son périple à travers l''Atlantique. Après avoir longé les côtes du Sahara, le navire mouille à Dakar. Corentin et ses amis ont l''objectif d''équiper le bateau d''une source d''énergie électrique - un problème majeur au Sénégal, où seulement 40 % de la population sénégalaise y a accès. Dans un fablab local de "makers", ces rois du recyclage qui bricolent des appareils astucieux face à la pénurie, ils rencontrent Abdulaye, un jeune réparateur de télévisions venu du Mali. Passionné par le sujet, il va aider les voyageurs à transformer l''énergie éolienne en électricité. Réalisateur: Laurent Sardi (2018)'
