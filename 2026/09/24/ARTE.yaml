  description: 'A ses débuts dans les années 80, avec son énergie, sa virilité juvénile et son désir de conquête, Tom Cruise fait figure de candidat idéal d''un Hollywood sous influence reaganienne. Le jeune homme se coule avec aisance dans des rôles de fils à papa, lui qui a grandi sans père dans un milieu populaire. Ambitieux et déterminé, Tom Cruise connaît une ascension fulgurante. Cependant, malgré son talent et sa réussite, l''acteur s''aliène une partie de la critique. Son adhésion totale à la scientologie a fini par le desservir. Mais, depuis les années 2000, il se réinvente dans le cinéma d''action et séduit le public avec des rôles toujours plus physiques. Réalisateur: Régis Brochier. Des acteurs: Tom Cruise (lui-même), Nicole Kidman (elle-même), Paul Newman (lui-même), Rebecca De Mornay (elle-même), Matt Dillon (lui-même) (2020)'
