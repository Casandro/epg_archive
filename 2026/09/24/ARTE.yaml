  title: 'La "folie" de Louis II : Neuschwanstein, le château enchanté'
  subtitle: Entre génie architectural et féerie kitsch, le château de Neuschwanstein est intimement lié au destin tragique de Louis II de Bavière, le "roi fou".
  genre:
  - '116'
  description: 'Situé sur la commune de Schwangau, le château de Neuschwanstein, perle d''architecture perchée sur une saillie rocheuse, attire chaque année plus d''un million de visiteurs : une fierté pour la Bavière et l''Allemagne tout entière. Si sa silhouette blanche et fuselée évoque les contes de fées, l''édifice est pourtant indissociable du destin tragique du roi Louis II de Bavière, déclaré fou et mort dans des circonstances mystérieuses le 13 juillet 1886, au lendemain de son internement. Lancée en 1869, la construction représente un défi de taille pour les architectes Eduard Riedel et Christian Jank : aux difficultés engendrées par l''emplacement en altitude s''ajoutent les exigences du souverain, qui passe en revue les moindres détails au risque de ralentir les travaux. Pour satisfaire ses voeux souvent excentriques, les architectes remanient sans cesse leurs plans et utilisent des techniques modernes en contraste avec l''éclectisme historique de la décoration - mélange d''éléments gothiques, romans, byzantins et rococos. Le souverain s''inspire des légendes du Graal et des opéras de Richard Wagner, dont de nombreuses scènes sont représentées sur des fresques, à l''instar de l''apparition de Lohengrin, le chevalier au cygne. Fuir la réalité Loin d''être conçu comme un édifice de prestige ou une démonstration de pouvoir, le château naît de la volonté de Louis II de fuir la terne réalité de la monarchie constitutionnelle bavaroise pour mieux se réfugier dans l''imaginaire. Au fil des éclairages d''experts et d''historiens passionnés, les rêveries d''un roi incompris se révèlent derrière le kitsch de cette splendide forteresse de la solitude. Réalisateur: Oliver Halmburger. Des acteurs: Gabi Hinterstoisser (la narratrice) (2023)'
- eventId: 1172747
  start: 2026-09-24T09:28:24Z
  stop: 2026-09-24T11:00:00Z
  title: 'La "folie" de Louis II : Neuschwanstein, le château enchanté'
  description: |-
    Documentaire d'Oliver Halmburger (Allemagne, 2023, 1h29mn) Entre génie architectural et féerie kitsch, le château de Neuschwanstein est intimement lié au destin tragique de Louis II de Bavière (1845-1886), le "roi fou". Retour sur l'histoire d'un édifice peuplé de rêves et de légendes.

