  title: 28 minutes
  subtitle: E28. Présenté par Élisabeth Quin du lundi au jeudi et Renaud Dély les vendredi et samedi, le rendez-vous quotidien consacré à l'actualité et au débat.
  genre:
  - '34'
  description: 'Il a recensé les mythes de plus de 1300 peuples à travers le monde ! L''anthropologue, mythologue et préhistorien Jean-Loïc Le Quellec publie le "Dictionnaire critique de mythologie" aux éditions du CNRS. Dans cet ouvrage de 1553 pages, il explore une diversité de mythes de tous les continents, issus de plus de 1300 peuples, de la mythologie grecque aux mythes transmis par l''art rupestre. Avec ce dictionnaire, dont l''ambition est de "présenter la mythologie comme discipline scientifique d''ensemble", Jean-Loïc Le Quellec s''interroge sur l''utilité des mythes dans les sociétés humaines. Super El Niño : le monde est-il prêt à affronter cette bombe climatique ? Cette année, le phénomène El Niño est de retour. Identifié au XIXe siècle par des pêcheurs péruviens, il s''agit d''un courant chaud venu du Pacifique qui fait tomber les vents, réchauffe l''océan, provoque une hausse des températures et entraîne des catastrophes naturelles en série comme des inondations, des sécheresses et des incendies. Si El Niño réapparaît tous les 2 à 7 ans, il est question cette fois-ci d''un "Super El Niño", une occurrence plus intense du phénomène. Le pic d''El Niño est attendu pour décembre 2026 : l''anticipation du phénomène permet de se préparer à ses nombreuses conséquences climatiques, d''autant que de nombreux climatologues prédisent que l''année 2027 sera la plus chaude jamais enregistrée. L''abandon du projet de transformation de la tour Montparnasse a été annoncé hier : Xavier Mauduit revient sur l''histoire du quartier Montparnasse, nommé d''après une montagne grecque qui serait le refuge du dieu Apollon et de neuf muses. Théophile Cossa lève le tabou autour du phénomène d''incontinence fécale qui touche de nombreux athlètes pendant l''effort sportif. (2026)'
