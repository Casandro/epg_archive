  title: MDR KLASSIK - Konzert
  description: |-
    KONZERT

    Im Walde

    Ralph Vaughan Williams: Folk Songs of the Four Seasons
    Joachim Raff: Sinfonie Nr. 3 F-Dur op. 153 "Im Walde"

    MDR-Kinderchor
    Damen des MDR-Rundfunkchores
    MDR-Sinfonieorchester
    Leitung Michael Francis

    (Aufnahme vom 30.08.2026, Meiningen, Staatstheater - MDR Musiksommer)

    Joachim Raffs Sinfonie Nr. 3 "Im Walde", entstanden 1869, gehört zu den erfolgreichsten und wirkungsvollsten Werken der deutschen Romantik.

    KONZERT

    Im Walde

    Ralph Vaughan Williams: Folk Songs of the Four Seasons
    Joachim Raff: Sinfonie Nr. 3 F-Dur op. 153 "Im Walde"

    MDR-Kinderchor
    Damen des MDR-Rundfunkchores
    MDR-Sinfonieorchester
    Leitung Michael Francis

    (Aufnahme vom 30.08.2026, Meiningen, Staatstheater - MDR Musiksommer)

    Joachim Raffs Sinfonie Nr. 3 "Im Walde", entstanden 1869, gehört zu den erfolgreichsten und wirkungsvollsten Werken der deutschen Romantik. Raff, ein Zeitgenosse und Freund Liszts und Mendelssohns, entfaltet hier ein musikalisches Naturgemälde - vom erwachenden Wald am Morgen über lebhafte Jagdszenen bis hin zu einem geheimnisvoll-mystischen Nachtstück, in dem Feen und Naturgeister erscheinen. Raffs meisterhafte Instrumentation lässt dabei den Wald in all seinen Stimmungen und Klangfarben lebendig werden. Zusammen mit Ralph Vaughan Williams' grandiosen "Folk Songs of the Four Seasons" vermittelt das Programm ein faszinierendes Panorama kompositorischer Naturschilderungen.
