  stop: 2026-09-24T14:05:00Z
  title: unterwegs - Inselwelt Thailand
  subtitle: Von Similan über Phuket zu den Phi-Phi-Islands
  genre:
  - '144'
  widescreen: true
  description: |-
    Moderator Roland Luder reist für die Reihe "unterwegs" durch die Inselwelt von Thailand. Seine Reise beginnt im Tauchparadies Similan.

    Dieser aus neun Inseln bestehende tropische Archipel ist heute ein Nationalpark und daher nur per Boot erreichbar. Auf der Insel Surin besucht Roland Luder am nächsten Tag echte Seenomaden, die sogenannten Moklen. Sie leben noch größtenteils auf ihren Booten.
    Moderation: Roland Luder

    HD-Produktion
  hd: true
  audiodesc: true
- eventId:
