  description: |-
    Deutschland 2026
    Cortison ist eins der stärksten entzündungshemmenden Medikamente, hat aber Nebenwirkungen. Forschende entschlüsseln den Wirkmechanismus, um neue Therapien zu entwickeln.

    Die Nebenwirkungen können gravierend sein: Bluthochdruck, Osteoporose und das berüchtigte Vollmondgesicht. Sogar Psychosen können auftreten. Doch bislang sind Glukokortikoide unverzichtbar. Wie weit ist die Suche nach neuen, verträglicheren Medikamenten?
