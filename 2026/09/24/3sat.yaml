  title: unterwegs - Rajasthan
  subtitle: Wüste, Wasser und Paläste
  genre:
  - '144'
  widescreen: true
  description: |-
    Die Reise durch Rajasthan beginnt in Jaipur, der Hauptstadt des indischen Bundesstaats. Dort taucht Andrea Jansen in das chaotische Verkehrsgetümmel ein und besucht den Palast der Winde.

    Außerdem trifft sie in Jaipur einen jungen Musiker, der mit seiner Band traditionelle indische Musik mit modernen Beats mischt. Zusammen besuchen sie den Kamelmarkt von Pushkar. Im kleinen Tilonia lernt sie den Gründer eines indischen Selbsthilfeprojekts kennen.
    Moderation: Andrea Jansen

    HD-Produktion
  hd: true
  audiodesc: true
- eventId:
