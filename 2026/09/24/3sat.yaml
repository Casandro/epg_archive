  stop: 2026-09-24T15:25:00Z
  title: unterwegs - Mauritius
  subtitle: Traumstrände, Glück und Honeymoon
  genre:
  - '144'
  widescreen: true
  description: |-
    Die schönsten Strände der Welt, ein äußerst angenehmes Klima, Hotellerie und Gastronomie auf Spitzenniveau und überall freundliche Menschen - so kennt man Mauritius.

    All dies hat die Insel im Indischen Ozean auch zur perfekten Hochzeits- und Honeymoon-Destination gemacht. Und viele, die dort waren, sagen, Mauritius mache glücklich. Die Reise beginnt an einem der schönsten Strände der Insel bei Le Morne.
    Moderation: Roland Luder

