  title: Sagenhaftes Südtirol - Mystische Berge und Legenden
  subtitle: Film von Martina Juda
  genre:
  - '144'
  widescreen: true
  subtitled: true
  description: |-
    Geheimnisvolle Steinmänner, versunkene Reiche und rot glühende Felsen: Die Südtiroler Dolomiten sind nicht nur eine beeindruckende Bergwelt, sondern auch Schauplatz uralter Sagen.

    Die schroffen Gipfel inspirierten seit Jahrhunderten Geschichten über Könige, Hexen und übernatürliche Kräfte. Zu den bekanntesten zählen die Sage von König Laurins Rosengarten und die Legenden um die "Stoanernen Mandln" auf der Hohen Reisch.
    HD-Produktion
