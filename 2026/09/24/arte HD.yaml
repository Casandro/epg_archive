  title: 'Globalisierung der Natur: Invasive Arten'
  subtitle: Fluch oder Segen?
  description: Mit dem Menschen, der mehr und mehr in andere Regionen einreiste, siedelten auch viele Pflanzen und Tiere um. Manche Arten haben die Fähigkeit, auch in ihnen fremden Lebensräumen zu überleben und sich zu vermehren. Zu anfangs meist größer, stärker und mit weniger Fressfeinden können die exotischen Arten ganze Ökosysteme aus dem Gleichgewicht bringen oder tödliche Krankheiten übertragen. Doch können die gebietsfremden Tiere und Pflanzen auch ein Segen für die verschiedenen Regionen sein? Oder muss die Verbreitung dieser Arten gestoppt werden?
