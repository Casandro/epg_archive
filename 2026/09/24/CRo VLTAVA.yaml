  stop: 2026-09-24T09:00:00Z
  title: Vizitka
  description: 'Lucie Lankašová, zakladatelka organizace KOKOZA. "V Praze funguje téměř sedmdesát komunitních zahrad. I když už dnes nejsou jejími zakladateli jen sousedé, jsou to právě oni jako komunitní zahradníci, kteří se o zahrady starají," říká Lucie Lankašová, která založila společensky prospěšný podnik KOKOZA. Ten inspiruje a pomáhá lidem ve městech kompostovat a pěstovat. Jsou pro obyvatele měst komunitní zahrady důležitější kvůli pěstování nebo spíš sousedskému setkávání? V čem všem ovlivňují kvalitu života a možná i kulturu bydlení? A obrací se na KOKOZU také lidé z jiných měst v České republice? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
