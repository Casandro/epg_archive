- eventId: 1135660
  start: 2026-09-24T18:15:00Z
  stop: 2026-09-24T20:25:00Z
  title: Koncert SOČR
  description: Přímý přenos slavnostního zahajovacího koncertu k 100. sezóně Symfonického orchestru Českého rozhlasu z Dvořákovy síně pražského Rudolfina vzdá poctu programu historicky prvního koncertu Orchestru Radiojournalu před 100 lety. Zazní předehra z opery Bedřicha Smetany Prodaná nevěsta, Romance pro housle a orchestr č. 1 G dur, op. 40 a č. 2 F dur, op. 50 Ludwiga van Beethovena, po přestávce pak výběr z cyklu Legendy, op. 59 Antonína Dvořáka (č. 6, 2, 10, 3) a na závěr Symfonie č. 2 Es dur, op. 38 Zdeňka Fibicha. Dirigovat bude nový šéfdirigent SOČR Elias Grandy a jako sólista vystoupí Jan Mráček. Přímý přenos uvádí Jana Trojanová. Koncert vysílá živě ČRo Vltava a ČRo D-dur.
