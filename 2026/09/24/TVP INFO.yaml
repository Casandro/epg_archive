  title: Podróże z historią 4 (odc. 5)
  subtitle: Radosław Kotarski wybiera się do Łodzi, by poznać tajniki historycznych produkcji filmowych. Dowie się, jak tworzono filmy fabularne i gdzie wyświetlano pierwsze ruchome obrazy.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Nie byłoby polskiego kina bez miasta, które określa się mianem Hollyłódź. Dlatego Radosław Kotarski przybywa do Łodzi, gdzie poznaje tajniki historycznych produkcji filmowych. Przygląda się temu, jak tworzono filmy fabularne, gdzie wyświetlano pierwsze ruchome obrazy i tworzy własną animację w legendarnym studiu Se - Ma - For. Będzie to podróż pełna dawnych, filmowych wspomnień.
