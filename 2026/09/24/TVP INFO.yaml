  title: Polskie parki narodowe 1 (odc. 7)
  subtitle: Tematem programu będzie Białowieski Park Narodowy, jeden z najcenniejszych przyrodniczo obszarów Europy, słynący z pierwotnej puszczy, żubrów i unikalnych ekosystemów.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Cykl prowadzi Dariusz Gross, dziennikarz, zafascynowany przyrodą poszukiwacz - odkrywca. Parki narodowe, które znamy jako turyści, pokazuje z innej, zaskakującej strony przez pryzmat pracy naukowców zgłębiających sekrety ekosystemów i pracujących nad ich zachowaniem dla przyszłych pokoleń. To program przedstawiający osobliwości przyrody i ukazujący wyjątkowość poszczególnych parków narodowych w Polsce. Nowoczesne technologie badawcze spotykają się z odwiecznym dziełem natury.
