  start: 2026-09-24T11:30:00Z
  stop: 2026-09-24T12:00:00Z
  title: Heimspiel vom 22.09.2026 (Wh.)
  subtitle: 'Heute im Heimspiel: Regionalliga-Fußball, Profi-Fußball & Talk mit Sportler Maximilian Schwarzhuber.'
  description: |-
    Regionalliga-Fußball
    Der VfB Eichstätt hat die zweite Mannschaft der SpVgg Greuther Fürth empfangen und wollte die perfekte Englische Woche krönen. Der VfB machte zunächst ordentlich Druck und drehte nach der Pause nochmal richtig auf. In der Schlussphase kam es zu einem Platzverweis und einer nervenaufreibenden Nachspielzeit.
    Profi-Fußball
    Die Schanzer waren zum Abschluss der Englischen Woche bei Viktoria Köln gefordert und erwischten dabei einen vielversprechenden Start. Lange blieb die Partie offen, doch nach der Pause nahm die Begegnung eine entscheidende Wendung.
    Und ein Talk mit einem besonderen Sportler
    Mit gerade einmal zwei Jahren veränderte eine schwere Erkrankung sein Leben - 22 Jahre lang folgten Operationen, Krankenhausaufenthalte und Einschränkungen. Dann traf Maximilian Schwarzhuber eine mutige Entscheidung, die alles veränderte und ihm etwas zurückgab, das lange unmöglich schien: die Freiheit zu laufen. Wir haben mit ihm über seinen außergewöhnlichen Weg und seine Liebe zum Sport gesprochen.
- eventId: 848885
  start: 2026-09-24T12:00:00Z
  stop: 2026-09-24T12:45:00Z
  title: Bayern Agenda vom 23.09.2026 (Wh.)
  subtitle: Das Politmagazin für ganz Bayern.
  description: Was planen die Ministerien für uns? Wie steht es um unser Oberbayern? Wir laden die Kabinettsmitglieder ein, um Rede und Antwort zu stehen - auch Social-Media-Zuschauerfagen werden beantwortet.
- eventId: 848886
  start: 2026-09-24T12:45:00Z
  stop: 2026-09-24T13:00:00Z
  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 848887
  start: 2026-09-24T13:00:00Z
  stop: 2026-09-24T13:45:00Z
  title: Record 0841 (Wh.)
  subtitle: Der Musik-Talk mit Alexander Onken
  description: |-
    In der 45-minütigen Sendung trifft Alexander Onken Musikerinnen und Musiker zum Dialog in einer angesagten Location. Pro Ausgabe können das nacheinander mehrere Gäste sein - oder auch mal nur einer. In jedem Fall sind es spannende Newcomer oder bereits etablierte Künstler.
    Um eine intime Atmosphäre zu schaffen, verzichten wir ganz bewusst auf ein großes Setting. In der Postproduktion wird das Gespräch mit dem jeweiligen Musikvideo vereint, lockert so den Talk auf, treibt das Thema voran und hält gleichzeitig die Stimmung des Songs.
- eventId: 848888
