  title: nachgefragt vom 21.09.2026 (Wh.)
  subtitle: Das Talkmagazin - Gäste sagen ihre Meinung!
  description: Die alte Feder - so kann der Name des Urvogels Archaeopteryx übersetzt werden. Der Abdruck einer Feder war der erste Hinweis zu ihm, der im Altmühltal entdeckt wurde. Bei Nachgefragt spricht Michelle Milewski mit Christina Ifrim, der Wissenschaftlichen Leiterin des Jura-Museums Eichstätt. Es geht darum, wie das Altmühltal vor 150 Millionen Jahren aussah und um das Jubiläums-Jahr im Jura-Museum.
