  title: In aller Freundschaft (1015)
  subtitle: Die Guten und die anderen
  description: Lilly Phan und Kris Haas sind nach Feierabend auf dem Weg ins Restaurant, als Kris brutal zusammengeschlagen wird. Aufgrund eines anderen Notfalls werden er und Schläger Marlon Fessner in die Klinik eingeliefert. Marlon hat sich einen Arm gebrochen, Kris muss ins künstliche Koma versetzt werden. Ausgerechnet Ilay Demir, noch geschockt vom Zustand seines Freundes Kris, muss Fessner behandeln.
- eventId: 1176404
  start: 2026-09-24T06:25:00Z
  stop: 2026-09-24T07:10:00Z
  title: In aller Freundschaft - Die jungen Ärzte (210)
  subtitle: Der nächste Schritt
  description: Prof. Dr. Karin Patzelt kommt endlich aus ihrem Urlaub zurück. Doch leider betritt die Chefärztin das Klinikum durch die Notaufnahme. Sie hatte zusammen mit einem Freund einen Motorradunfall. Während Patzelt ein gebrochenes Bein davonträgt, ist der Zustand ihres Partners viel schlechter. Karin fühlt sich für ihren Freund verantwortlich und möchte ihn am liebsten selbst behandeln. Vor allem als bei der Nachuntersuchung deutlich wird, dass sein Herz nicht kräftig genug schlägt. Sie stürzt sich in die Arbeit und begibt sich so in eine komplette Überanstrengung.
