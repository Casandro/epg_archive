  title: 'Expedition in die Heimat: Der Rheinburgenweg von Bingen nach Koblenz'
  subtitle: mit Arndt Reisenbichler
  description: Moderator Arndt Reisenbichler durchwandert das Obere Mittelrheintal mal nicht auf dem berühmten Rheinsteig, sondern auf dem gegenüberliegenden und etwas unbekannteren "Rheinburgenweg". Der ist mindestens so spektakulär wie der Wanderweg auf der anderen Rheinseite - jedoch weniger überlaufen. Die vielen auf dem Weg liegenden Burgen und Schlösser spielen eine zentrale Rolle bei dieser sechstägigen Wandertour. Arndt Reisenbichler trifft auch auf blühende Rosengärten, entdeckt die Geburtsstätte der berühmten Thonet-Möbel und besucht den Klettersteig bei Boppard.
