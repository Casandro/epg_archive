  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Das Geheimnis einer Piratenlegende
  description: "Freibeuter, Abenteurer, Weltumsegler: Sir Francis Drake gilt als Ikone der englischen Kolonialgeschichte. Im 16. Jahrhundert erlangte der Kapitän und Vizeadmiral vor allem durch seine Raubzüge und Seeschlachten gegen die Spanier Berühmtheit. Jetzt begibt sich Josh Gates auf die Spuren des berüchtigten Freibeuters. Gemeinsam mit Historiker Michael Turner und Schatzjäger Caleb Duckworth versucht das Forscherteam Drakes verschollene Reichtümer sowie seine letzte Ruhestätte ausfindig zu machen. Die Fährte führt von Plymouth in England über den Atlantischen Ozean bis tief in den Dschungel von Panama. \nUSA 2019"
