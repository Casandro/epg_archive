  title: Čaj do páté
  subtitle: Rytmy dějin - Rok 1976 (13. díl)
  description: 'Autor a interpret: Roman Kabelka; Premiéra: 21.9.2026 * Po odmlce je tu zpět občasník Rytmy dějin, který tentokrát odstartuje poměrně zostra propagandistickou tiskovou konferencí. Tento pořad v rámci cyklu Čaj do páté se bude totiž vunava nejen z propagandy, ale i z terorismu a ropné krize. Události doprovodí populární písně ze švýcarské singlové hitparády, které jasně ilustrují trend melodického evropského popu a šlágru. Jedná se o singly dobře známé, neimém rozporu s hudební kritikou.'
