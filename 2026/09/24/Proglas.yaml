- eventId: 954107
  start: 2026-09-24T03:57:00Z
  stop: 2026-09-24T04:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 0924 - Hodnota kárání (268. díl)
  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Bible říká, že člověk by si měl více vážit kárání od přítele než lichotek od pochlebovačů. Je to ale těžké. Já si moc ráda poslechnu, jak jsem skvělá, hodná, krásná a šikovná. A asi jako každému se mi nechce naslouchat, jak jsem měla spíš mlčet než mluvit, jak jsem byla necitlivá a zranila jsem něčí city. Jak jsem reagovala pyšně a prchlivě, no prostě nechci slyšet pravdu.Nevím, jestli je možné se to nějak naučit. Pořád ještě se mi kroutí uši a lehce se mi svírá žaludek, když dojde na ono slavné kárání od přítele. Už jsem dost stará na to, abych to dokázala pokorně a ochotně vyslechnout, nebránit se a neprotestovat. Tím bych jen dala najevo, že zase tolik rozumu jsem ještě nepobrala. Cožpak o to, rozumem vím spoustu věcí. Učila jsem se nazpaměť některé verše z bible a tenhle z knihy přísloví mezi nimi byl také. Když přijde ta situace a mně se chce brečet, protože vidím, že můj kárající přítel má pravdu a já jsem to zase zvorala a je mi to líto, zkouším si v duchu ten verš připomenout. Je lepší, abych věděla, že něco nebylo v pořádku, než kdyby mi lhali, že jsem skvělá a pak za dveřmi jen pokrčili rameny. Je to s ní marné, nesnese pravdu, není schopná přijmout napomenutí. Je to nejspíš to nejtěžší učení, co může být. A nevím, jestli s ním budu kdy hotová. Nemám ráda bolest, kterou mi působí zklamání z vlastních selhání a stud za vlastní nedokonalost, kterou vidí někdo druhý. Jenže bez některé bolesti se nelze posunout. A tak kdybyste na mně něco viděli, přátelé, přijďte mi to říct. Dobře vím, že ani vaše část není snadná. Jak to zformulovat, abychom se jí nedotkli a nezranili ji? Však se známe.'
