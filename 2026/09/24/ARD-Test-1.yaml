  title: Morden im Norden (56)
  subtitle: Tödliches Vertrauen
  description: Aus dem Lübecker Hansemuseum wird die wertvolle Störtebeker-Kette gestohlen. Als die zuständige Projektleiterin der Sicherheitsfirma, Nadine Dorn, am nächsten Tag nicht erreichbar ist, fangen Finn Kiesewetter und Lars Englen an, sich in ihrem Umfeld umzusehen. Doch Finn kann nicht glauben, dass Nadine, die er noch von der gemeinsamen Polizeiausbildung kennt, zur Diebin geworden ist. Auch der Kurator des Museums, Tjard Theißen, gerät in den Fokus der Ermittler, als Nadine sich Hilfe suchend an Finn wendet. Sie fordert die Unterbringung in einem Zeugenschutzprogramm, denn Theißen werde von der russischen Mafia bedroht.
