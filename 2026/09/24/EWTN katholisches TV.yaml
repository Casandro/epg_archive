  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Auf der Suche nach dem Logos
  description: |-
    Anna Diouf im Gespräch mit Xaver Spörl

    Ein junger Mann macht sich Gedanken über den Sinn des Lebens. Ist die Existenz eines höheren Wesens vernunftgemäß? Und falls ja, wie ist dieses Wesen beschaffen? Kann Gott Mensch geworden sein? Wohl eher nicht, denkt Xaver Spörl. Doch die Begegnung mit Focus-Missionaren auf seinem Campus in Passau setzt in ihm eine Bewegung in Gang, die ihn schließlich in die Einheit mit der Kirche führt.

    Auf der einen Seite die intellektuell unbestechliche Suche nach der Wahrheit, auf der anderen die echte Begegnung: Der Glaube braucht beides.
  widescreen: true
- eventId: 980358
  start: 2026-09-24T19:00:00Z
  stop: 2026-09-24T21:00:00Z
  title: 'LIVE: Heilige Messe und Seligsprechung von Erzbischof Fulton J. Sheen'
  description: |-
    Kardinal Luis Antonio Tagle steht der feierlichen Seligsprechungsmesse für den ehrwürdigen Erzbischof Fulton J. Sheen vor. Die Liturgie findet im "The Dome at America's Center" in St. Louis im US-Bundesstaat Missouri statt.

    Fulton J. Sheen war Erzbischof, Prediger und einer der bekanntesten katholischen Medienpersönlichkeiten des 20. Jahrhunderts. Mit seinen Radio- und Fernsehsendungen erreichte er über viele Jahre hinweg Millionen von Menschen und verkündete den christlichen Glauben einer breiten Öffentlichkeit.
  widescreen: true
