  title: Chronik des Dritten Reichs - Der Weg zum Krieg
  description: 'Deutschlands Rohstoffknappheit wird immer offensichtlicher, das Land steht kurz vor der Insolvenz, auch wenn es nach außen hin nach einem Wirtschaftsaufschwung aussieht. Doch außenpolitische Erfolge lenken von den innenpolitischen Problemen ab: Deutsche Soldaten kämpfen im Spanischen Bürgerkrieg mit, marschieren in Österreich ein und besetzen im März 1939 die Slowakei. Der 2. Weltkrieg steht vor der Tür.'
  widescreen: true
  subtitle: Chronik des Dritten Reichs - Der Weg zum Krieg
