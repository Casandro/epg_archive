  title: Helden der Evolution - Huftiere
  subtitle: Helden der Evolution - Huftiere
  description: Im Galopp um die Welt zu den Lebensräumen der Huftiere, fachsprachlich Ungulata. Zu ihnen gehören nicht nur Publikumslieblinge wie Giraffen, Rotwild, Zebras und Kamele, sondern auch weniger bekannte Vertreter wie Tapire, Vikunjas und Okapis. Vom robusten "Wüstenschiff" bis hin zum höchsten Tier der Welt haben Huftiere so einiges zu bieten.
