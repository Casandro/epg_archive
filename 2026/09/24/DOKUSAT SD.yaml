  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Das Wettschwimmen
  description: Bereit zum Abseilen! Rettungsschwimmer Ryan Gann kämpft sich im eiskalten Wasser Alaskas zu drei Schiffbrüchigen auf einem Rettungsfloß vor. Währenddessen sucht der Helikopterpilot per Infrarotsensor nach einem noch vermissten Besatzungsmitglied des verunglückten Fischtrawlers. Zeitgleich trainieren in Kodiak Einsatzkräfte der US Coast Guard (USCG) für den Ernstfall - bei einem sportlichen Wettkampf stellen sie ihre Fähigkeiten unter Beweis.
