  title: Helden der Evolution - Reptilien
  subtitle: Helden der Evolution - Reptilien
  description: 'Von Mythen umrankt und beladen mit Vorurteilen: Die Gruppe der "kaltblütigen" Reptilien umfasst Tausende von Spezies, die sich kriechend, schlängelnd oder schwimmend fortbewegen. Nach den Krokodilen, Meeres- und Landschildkröten sind nun Schlangen, Eidechsen und die geheimnisvollen Brückenechsen Neuseelands interessant. Ein Ausflug in die Welt der Teufel, Vipern, Monster und Drachen.'
  genre:
