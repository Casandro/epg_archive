  title: Wasser ist unsere Zukunft - Spanien
  subtitle: Wasser ist unsere Zukunft - Spanien
  description: In Andalusien, dem trockenen Süden Spaniens, bestimmt das Wasserseitjeher das Leben der Menschen. Ein knappes Gut, von den Mauren "flüssiges Silber" genannt. Heute arbeiten Bauern, Wissenschaftler und Naturschützer daran, den Schatz Andalusiens in die Zukunft retten. Sie greifen auf Jahrhunderte altes Wissen zurück und nutzen modernste Technologien, um einzigartige Landschaften zu bewahren
