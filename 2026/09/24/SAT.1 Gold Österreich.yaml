  title: Richterin Barbara Salesch
  subtitle: |-
    Rote Lippen soll man küssen
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: 'Michael behauptet, dass er seine geliebte Frau tot im gemeinsamen Wochenendhaus aufgefunden hat - erdrosselt. Lüge oder Wahrheit? Fest steht: Von Anbeginn der fünfjährigen Ehe steigerte sich Michaels rasende Eifersucht immer mehr. Musste seine Frau sterben, weil sie sich von ihm trennen wollte? Oder hat der Nachbar, der Sandra ständig bespannte, etwas mit ihrem Tod zu tun?'
  widescreen: true
- eventId: 1026599
  start: 2026-09-24T04:32:43Z
  stop: 2026-09-24T05:25:48Z
  title: Richterin Barbara Salesch
  subtitle: |-
    Lass mich los!
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Verlassen über Nacht und nur ein Zettel auf dem Kopfkissen als Abschiedsgruß - für Theresa steht sofort fest, dass ihre Mutter Annemarie ihren neuen Freund genötigt hat, sie zu verlassen. Schließlich wäre Robert nicht der erste Freund, den die Löwenmutter nach Theresas lebensgefährlicher Magersucht in die Flucht geschlagen hat. Doch ist Theresa dieses Mal wirklich dermaßen ausgeflippt, dass sie mit einer Axt die neue Praxis ihrer Mutter kurz und klein geschlagen hat?
  widescreen: true
- eventId: 1026600
  start: 2026-09-24T05:25:48Z
  stop: 2026-09-24T06:20:22Z
  title: Richter Alexander Hold
  subtitle: |-
    Notwehrszenen einer Ehe
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
    (WH vom Sonntag, 20.09.2026, 12:50 Uhr)
  description: Die 45-jährige Christin Brauer soll ihren Mann aus Wut brutal mit einem Fleischhammer erschlagen haben. War ihr Motiv Eifersucht, weil er ihr zuvor eröffnet hatte, dass er sie wegen einer anderen Frau verlassen wird? Doch Christin beharrt darauf, dass sie aus Notwehr gehandelt hat. Angeblich soll ihr Mann seine Aggressionen im Suff oftmals an ihr ausgelassen haben. Und am Tatabend soll er sie sogar mit einem Messer bedroht haben ...
  widescreen: true
- eventId: 1026601
  start: 2026-09-24T06:20:22Z
  stop: 2026-09-24T07:15:24Z
  title: Richter Alexander Hold
  subtitle: |-
    Die rebellierende Papiertüte
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: Die mittlerweile arbeitslose Mutter Marie Neuwirth ist angeklagt, ihren damaligen Chef, den Filialleiter Johannes Schmirnau, nach einem wiederholten Streit in den Aufenthaltsraum des Drogeriemarktes eingesperrt zu haben, um daraufhin die Filiale zu verwüsten. Auf der Aufnahme einer Überwachungskamera kann man sehen, wie jemand mit einer Papiertüte über dem Kopf die Regale im Laden zerstört. Steckt wirklich Marie hinter der Tat?
  widescreen: true
- eventId: 1026602
  start: 2026-09-24T07:15:24Z
  stop: 2026-09-24T08:10:27Z
  title: Richter Alexander Hold
  subtitle: |-
    Shooting Gun
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
  description: David Zinnbeck soll seinen einzigen Bruder Gregor bei einem Streit in seiner Jagdhütte erschossen haben, weil Gregor ihre an Alzheimer erkrankte Mutter in ein Heim schicken wollte. David streitet verzweifelt alles ab. Verdächtigt wird auch der Waffennarr Lutz Grünwald, der von Gregor aus der Bundeswehr geworfen wurde. Doch Lutz hat ein wasserfestes Alibi.
  widescreen: true
