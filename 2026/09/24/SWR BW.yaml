  description: 'Während eine kleine Oberschicht die "Goldenen Zwanziger" des 20. Jahrhunderts genießt, leben in den Armenvierteln Millionen Menschen im Elend. Ende 1927 kommt ein neues Finanzprodukt aus Amerika nach Europa: der Konsumentenkredit. Die Menschen kaufen massenhaft auf Pump und spekulieren mit Aktien. Mit dem Schwarzen Freitag 1929 zerplatzt der Traum vom Aufschwung für alle. Die US-Banken ziehen ihr Geld ab und verlangen die Kredite zurück. Banken brechen zusammen, es folgen Warenhäuser und Betriebe.'
