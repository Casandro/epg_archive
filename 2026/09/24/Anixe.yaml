  title: 'Der Missionsdienst von David Hathaway - Gott ist dein Vater: Gib ihm dein Herz'
  subtitle: 'Der Missionsdienst von David Hathaway - Gott ist dein Vater: Gib ihm dein Herz'
  description: '(Gedreht in Almaty, Kasachstan, 2026)  Ich habe im Laufe meines Lebens etwas gelernt: Gott möchte dein Herz.  Ich erinnere mich an die Erziehung meiner jüngsten Tochter und die Kämpfe, die wir manchmal ausfochten. Ich musste sie erziehen, aber heute liebt sie mich von ganzem Herzen und arbeitet Vollzeit in der Mission. Das hat mir etwas über das Herz eines Vaters beigebracht.  In 5. Mose 4,29 heißt es:  "Wenn ihr aber von dort den HERRN, euren Gott, sucht, werdet ihr ihn finden, wenn ihr ihn von ganzem Herzen und von ganzer Seele sucht."  Gott war mir wie ein Vater. Manchmal musste er mich erziehen, aber seine Liebe ist immer gleich geblieben. Und genau das möchte Gott auch für dich sein - ein Vater, der dich liebt, dich führt und dich manchmal auch zurechtweist.  Eine weitere Lektion über das Vertrauen in Gott lernte ich, als ich mit 90 Jahren endlich fliegen lernte. Der Fluglehrer hatte die Hand am Steuer, und alles schien in Ordnung. Doch als er die Hand wegnahm und sagte: "Du fliegst!", bekam ich Angst!  Das hat mich über unsere Beziehung zu Gott nachdenken lassen. Solange wir versuchen, unser Leben selbst zu kontrollieren, werden wir kämpfen. Doch wenn wir Jesus vertrauen und ihm die Führung überlassen, ändert sich alles.'
