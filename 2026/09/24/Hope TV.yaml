  title: Geschichten der Hoffnung
  subtitle: '"Ich hab immer diese Masken getragen" - Tano'
  description: |-
    Tano führte ein Doppelleben: Für seine Freunde war er der unantastbare "Harte", der für Anerkennung jedes Risiko einging. Zu Hause war er der loyale Sohn, der die Fassade des braven Jungen aufrechterhielt. Doch der Spagat zwischen diesen Welten wurde zur unerträglichen Last.

    In dieser Folge von Geschichten der Hoffnung erzählt Tano, wie ihn die ständige Angst, entlarvt zu werden, innerlich zerfraß. Er spricht offen über den Moment, in dem er erkannte, dass er keine Masken mehr braucht, um geliebt zu werden. Eine bewegende Geschichte über wahre Identität, die Freiheit der Ehrlichkeit und einen Neuanfang ohne Rollenspiele.

