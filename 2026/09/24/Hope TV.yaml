  title: 3 Minuten Andacht
  subtitle: Gott verändert die Natur
  description: 'Wenn es einen Anspruch auf dieser Welt gibt der alles verändern würde, dann ist es das Wort Jesu in Matthäus 5,44  "Ich aber sage euch: Liebet eure Feinde, segnet, die euch fluchen, tut wohl denen, die euch hassen, und betet für die, die euch beleidigen und verfolgen, ..." In keiner anderen Religion wird diese radikale Veränderung unserer menschlichen Natur so gelehrt oder gefordert. Ja es geht um deine Natur, um dein Herz!    Wenn du schonmal gehasst wurdest, oder noch schlimmer, selber gehasst hast, dann weißt du dass diese Einstellung zum anderen - nämlich ihn zu lieben - kaum möglich ist.  Meinen Feind lieben?! Aber das ist es was eine Verbindung mit Jesus in dir ändern wird. Nicht mehr dein Ich und deine Gefühle sind der Meister aller Taten und Denkens sondern ein von Jesus erfülltes Herz.  Verändert durch die Kraft seiner Gnade und Vergebung wird sich zuerst deine Einstellung ändern und dann folgt der Unterschied mit denen du im Konflikt stehst.  Würden wir Menschheit nur diesen einen Ausspruch Jesu aus der Bibel beherzigen, würde es keine Kriege, Morde und Zerstörung durch Menschen geben! Nimm dir Zeit einmal deine Natur zu beobachten? Bist du da wo Jesus sagt das du sein sollst? Brauchst du noch ein neues Herz? Ein Herz voll Liebe wie nur Gott sie geben kann? Gehe zu Jesus im Gebet und sag es Ihm! Ließ seine Worte und vertraue auf seine Versprechen denn egal wie kaputt deine Natur ist, Jesus lebt und Er ist stärker als deine Natur!'
  widescreen: true
  hd: true
