  title: Bibelkompass
  subtitle: Darum ist das Evangelium eine gute Nachricht
  description: |-
    Das Evangelium ist mehr als eine einzelne Aussage. Es ist die umfassende Botschaft von Gottes Liebe zu den Menschen. Diese Sendung zeigt die wichtigsten Bausteine des Evangeliums: Gott als Schöpfer, die Würde und Zerbrochenheit des Menschen, die Realität der Sünde, die Rettung durch Jesus Christus, die Bedeutung von Gnade und Glauben sowie das Wirken des Heiligen Geistes. Erst im Zusammenspiel dieser Wahrheiten wird sichtbar, warum das Evangelium Menschen Hoffnung, Vergebung und neues Leben schenken kann. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Mediathek. Um 20:15 Uhr auf Hope TV. Moderation: Pastor Michael Dörnbrack.

