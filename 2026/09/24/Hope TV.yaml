  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Dr. Armin Trummer:  Die Bibel kennt kein Rentnerdasein'
  description: |-
    Während andere den Ruhestand genießen, reist Dr. Armin Trummer regelmäßig in den Südsudan - eines der ärmsten Länder der Welt. Dort lehrt der promovierte Wirtschaftsingenieur ehrenamtlich Management, ermutigt Studierende, ein eigenes "Business" zu gründen, und versucht, Wertschöpfung und Hoffnung in Gang zu bringen.
    Über Jahrzehnte arbeitete er international als Controller, Sanierer, Geschäftsführer und strategischer Planer - oft in schwierigen Verhandlungen und Krisensituationen. Der Glaube begleitet ihn dabei seit seiner Kindheit. Als Dr. Armin Trummer im Ruhestand die Worte aus dem Propheten Jesaja hört: "Wen soll ich senden?", trifft ihn das tief. Für ihn wird klar: Die Bibel kennt kein Rentnerdasein. Heute versteht er sich als Missionar und Evangelist im Hörsaal - und erzählt, wie Glaube, Wirtschaft und Verantwortung für ihn zusammengehören.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

