  title: Open Doors Magazin
  subtitle: Glaube, der trägt - Vergebung, Mut und Hoffnung
  description: |-
    Was gibt verfolgten Christen die Kraft, trotz Ablehnung, Gefahr und Leid standhaft zu bleiben? Moryom wächst in einer mehrheitlich muslimischen Umgebung auf und begegnet täglich Anfeindungen - doch sie entscheidet sich für Gebet, Vergebung und Vertrauen auf Jesus Christus. Rooble wiederum suchte das Paradies mit eigenen Werken und fand es überraschend im Glauben an Jesus - ein Weg, der sein Leben dramatisch veränderte. Wie hält man fest am Glauben, wenn alles dagegensteht? Woher kommt diese Hoffnung? Entdecken Sie bewegende Zeugnisse von Mut, Gnade und lebendigem Glauben im Open Doors Magazin. Schauen Sie rein, lassen Sie sich berühren und teilen Sie die Sendung.

