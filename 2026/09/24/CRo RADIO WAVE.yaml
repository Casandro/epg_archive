  title: Psycho
  description: Psycho je pořad o temných i méně temných zákoutích lidské mysli s lidmi, co tomu rozumí. Propojuje aktuální popkulturní fenomény s poznatky vědecké psychologie a hledajá, co nám říkají o nás samotných. Každá epizoda sleduje, jak se dnešní trendy odrážejí naší psychice - odborně, srozumitelně a s nadhledem. Moderují Karolína Faberová a Pavel Šebesta.
