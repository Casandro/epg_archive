  title: Špína
  description: Jolene, I will always love you, 9 to 5, Coat of many colors - to je jen střípek z nejznámějších skladeb z pera country superhvězdy Dolly Parton, která zemřela minulý týden. Špína vzdává hold této svébytné autorce pomocí punkových a nezávislých coverů jejích skladeb a především připomene, jakým způsobem se snažila dělat ze světa lepší místo. Neobvyklá témata skladeb, neústupnost v postojích, podpora marginalizovaných skupin, nezkrotný humor a nepřehlédnutelná vizuální stylizace. Dolly byla v jádru víc punk, než se na první pohled mohlo zdát! Moderují Jan Šamánek a Judita Císařová.
