  title: EXCALIBURR playlist
  description: Tématický playlist k nejostřejší rapové show široko daleko EXCALIBURR. Nalaďte se rapovým playlistem na aktuální díl, odebírejte EXCALUBURR v audioportálu mujRozhlas a sledujte ho i s videem ve vašich oblíbených podcastových aplikacích nebo na YouTube kanálu Radia Wave.
- eventId: 1135737
  start: 2026-09-24T20:00:00Z
  stop: 2026-09-24T21:00:00Z
  title: EXCALIBURR
  description: Nejostřejší rapová show široko daleko. Hodina v plné zbroji pro všechny rytíře ukáže, kdo je král a kdo páže. Každé dva týdny čekejte příjezd karavany plné aktualit z bitevního pole, k tomu vybroušené rozhovory s hlavními hybateli i šedými eminencemi scény. O rapu a všem okolo něj, to je vaše pravidelné rapové ostří! Oslava kamilství i těch nejvytříbenějších skills, od rapperů přes producenty a grafiky až po fashion designéry nebo zlatníky. Zbojníci Jardič, Don Chain a Casablanka každého z hostů zapojí do tématických speciálů, nabitých rubrik a vybaví vás do plné polní svým rapovým přehledem.
- eventId: 1134111
  start: 2026-09-24T21:00:00Z
  stop: 2026-09-24T21:30:00Z
  title: Chudáčci
  description: Chudáčci jsou nekonečná série herců a kamarádů Petra Uhlíka a Adama Ernesta o tom, když se úplně nedaří. Sdílejí historky z osobního života i práce a zamýšlejí se nad vztahy, jídlem, dovednostmi a vším ostatním, co běžný život přináší. Půlhodinová promyšleně improvizovaná show za mikrofonem je pokaždé plná humoru, pochval i urážek, sporů a smíření, přátelství, ASMR a jiných zvuků, které jste zatím rozhodně neslyšeli. Moderují Petr Uhlík a Adam Ernest.
