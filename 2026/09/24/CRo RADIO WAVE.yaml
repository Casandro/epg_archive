  title: On Air s Jardou Petříkem
  description: Jak souvisí historie naší země uplynulých čtyřiceti let s nejúspěšnějšími domácími popovými hity? Hudební publicista Karel Veselý vypráví ve své nové knize Touhy a sny s podtitulem Ideologie českého postsocialistického popu příběh posledních čtyř dekád České republiky prostřednictvím písní, které okupovaly české prodeje, žebříčky a playlisty. O originálním historickém a popkulturním exkurzu do našich polistopadových dějin budeme s Karlem Veselým mluvit ve studiu po 12 hodině. Moderuje Jarda Petřík.
