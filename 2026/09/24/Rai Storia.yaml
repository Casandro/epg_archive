  title: Passato e presente La battaglia di Verdu
  subtitle: 'Passato e presente La battaglia di Verdun, il grande massacro - E'' il simbolo estremo della guerra di logoramento. Tra il febbraio e il dicembre 1916, per dieci mesi, a Verdun, il fronte francese e quello '
  description: |-
    tedesco si affrontano in una delle battaglie più lunghe e distruttive della Prima guerra mondiale, destinata a segnare profondamente la memoria europea. Il fronte diventa un sistema di trincee instabili, dove la sopravvivenza quotidiana prevale su qualsiasi logica di avanzata. Quando la battaglia si esaurisce, nel dicembre 1916, il bilancio è impressionante: centinaia di migliaia di vittime da entrambe le parti e nessun risultato strategico decisivo. Ma il significato di Verdun va oltre la dimensione militare. Dalle poesie di soldati come Apollinaire o Cendrars, emerge una narrazione frammentata, un'istantanea della disillusione che sostituisce l'eroismo romantico con l'esperienza nuda del dolore. Verdun diventa così uno dei laboratori della guerra totale e, insieme, l'origine di una memoria collettiva destinata a durare. In studio con Paolo Mieli il prof. Gilles Pecout. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

    Ospite in studio il prof. Gilles Pecout Con la partecipazione di Charlotte Marincola Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
