  title: Effetto Nicholas
  subtitle: 29 settembre 1994, autostrada Salerno-Reggio Calabria. Un'esplosione fa saltare il finestrino laterale di una Y10, l'auto in cui viaggia la famiglia Green. Nicholas, un bambino americano di sette anni, viene colpito da un proiett
  description: |+
    ile mentre dorme sul sedile posteriore dell'auto, accanto alla sorellina minore. Una vacanza alla scoperta delle bellezze dell'Italia si trasforma in un episodio di cronaca nera sconvolgente ma è anche l'inizio di una rivoluzione culturale. 'Effetto Nicholas' è il primo documentario che racconta l'evoluzione dei trapianti di organi nel nostro Paese, partendo dal caso mediatico che ha sdoganato il tabù della donazione in Italia: l'omicidio del piccolo Nicholas. Nel trentesimo anniversario dalla tragedia e dalla scelta della famiglia Green di donare gli organi di Nicholas, il documentario racconta l'onda lunga di quel gesto di generosità che diventò esempio e ispirazione in Italia, oggi eccellenza medica nel campo dei trapianti. - di Lorenzo Avola Regia di Edoardo Anselmi

