  title: Bondi Beach - Die Rettungsschwimmer von Sydney
  subtitle: Jules schwierigster Einsatz
  description: |-
    Heute rückt die 30-jährige Rettungsschwimmerin Jules zu einem heiklen Einsatz aus. Eine junge Frau wurde von einer heftigen Welle erwischt. Der Aufprall war so stark, dass sie sich eine schwere Rückenverletzung zugezogen hat! Jetzt ist Eile geboten, damit die Frau sicher - sowie in einer stabilen Lage - an Land gebracht wird. Dort übernehmen die Lifeguards die Erstversorgung, bis der alarmierte Krankenwagen eintrifft. Außerdem meistert der neue Trainee Lachlan seinen ersten Einsatz, und Singlets nutzt den Gurtretter, um einen Mann aus der Strömung zu ziehen.
    AUS 2018
