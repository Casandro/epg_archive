  subtitle: 'Wandern mit Motor: Exoskelette erobern den Alltag'
  description: |-
    Der ewige Menschheitstraum von Superkräften wird real. Sogenannte Exoskelette erobern unseren Alltag. Anzüge, bestückt mit Motoren und Federn, helfen uns beim Laufen oder beim Heben von schweren Gegenständen. «Einstein» macht den Test und zeigt, wie gut sie wirklich sind.
