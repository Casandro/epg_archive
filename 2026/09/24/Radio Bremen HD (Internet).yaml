  title: Gertrud Stranitzki
  subtitle: Die Weltreise
  description: 'Der Tod der alten Kollegin Müller stimmt Gertrud Stranitzki nachdenklich. Plötzlich wird ihr bewusst, dass auch sie sich in ihrem bisherigen Leben wenig gegönnt hat. Mit leuchtenden Augen beschließt sie: Wir machen eine Weltreise! Wenige Tage später schrumpft die Reise, was die Ziele angeht. Nicht mal bis nach Helgoland kommt die seekranke Getrud. Aus der Weltreise wird ein Urlaub im Wochenendhaus an der Havel.'
