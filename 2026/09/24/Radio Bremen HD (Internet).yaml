  title: Wie geht das? Mit dem Zoll auf Streife
  subtitle: Film von Jon Mendrala
  description: Die meisten Bürger erleben die Arbeit der Mitarbeiterinnen und Mitarbeiter des Zolls nach Rückkehr aus ihrem Urlaub am Flughafen. Genauso fallen die Bekämpfung der Schwarzarbeit sowie die des Waffen- und Rauschgiftschmuggels in die Zuständigkeit der deutschen Zöllner. Die NDR Reportage zeigt, wie die große Bundesbehörde operiert. Das Filmteam schaut Zollbeamten bei Passagier- und Grenzkontrollen über die Schulter und ist dabei wenn Zöllner im Hamburger Hafen Container aus Übersee auf illegale Inhalte prüfen.
