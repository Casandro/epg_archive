- eventId: 1180732
  start: 2026-09-24T10:25:00Z
  stop: 2026-09-24T11:10:00Z
  title: In aller Freundschaft (311)
  subtitle: Auf der Suche nach dem Glück
  description: Stefan Beck wird mit einem Oberarmbruch in die Klinik eingeliefert und von Dr. Martin Stein behandelt. Er findet Stefan zunächst sehr sympathisch. Doch dann begegnet Dr. Stein am Krankenbett Stefans seiner Ex-Frau Valerie. Sie ist mit Stefan seit mehreren Monaten zusammen. Die Begegnung mit dem neuen Freund seiner Ex-Frau wird für Martin zunehmend belastend. Hat er doch das Gefühl, dass seine Tochter Marie mit der neuen Beziehung nicht glücklich ist.
- eventId: 1180997
  start: 2026-09-24T11:10:00Z
  stop: 2026-09-24T12:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (254)
  subtitle: Kleine Veränderungen
  description: 'Am Johannes-Thal-Klinikum soll Medizingeschichte geschrieben werden und Assistenzarzt Mikko Rantala darf dabei sein: Es besteht die Möglichkeit, den Patienten Bodo Herling aus dem Wachkoma zu holen. Schon jahrelang hat sich dessen Lebensgefährtin Saskia auf diesen Moment gefreut, ihn aufopferungsvoll gepflegt. Alle Hoffnungen liegen auf dieser Operation. Doch Dr. Leyla Sherbaz, Mikko und das OP-Team müssen aufgrund einer drastischen Verschlechterung abbrechen. Als eine andere Option im Raum steht, zögern Bodos Angehörige Saskia und sein Bruder Marcel. Die beiden haben offensichtlich ein Geheimnis und Mikko will es herausfinden!'
  ageRating: 6
