  title: Unsere Geschichte
  subtitle: Verschollen im Zweiten Weltkrieg - Die lange Suche nach den Vermissten
  description: Was wurde aus dem Wehrmachtsoldaten Otto Waischwillat? Das letzte erhaltene Dokument ist ein Todesurteil gegen ihn. Ausgestellt von der Roten Armee. Aber wann und wo wurde es vollstreckt? Sein Enkel Harald Walter aus Peine sucht heute noch nach Antworten. Elfie Barthel wurde als Vierjährige von der Wehrmacht aus Bratislava verschleppt, wuchs später bei einer Pflegefamilie auf. Wer ist ihre Mutter? Wo ist ihre Familie? Millionen solcher Schicksale sind auch 80 Jahre nach Ende des Zweiten Weltkrieges noch ungeklärt. Die Katastrophe wirkt immer noch nach und bewegt viele Menschen und Familien.
