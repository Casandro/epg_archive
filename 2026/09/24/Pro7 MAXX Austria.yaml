    Seit über sechs Jahrzehnten hält "Star Trek" die Menschheit in seinem Bann - und macht auch auf der großen Leinwand eine gute Figur. Diese Folge der Dokumentarserie beleuchtet die turbulente Entstehung von "Star Trek: Generations": den Stabwechsel von Kirk zu Picard, den Kampf ums Budget, den Streit um Kirks Tod und die Frage, ob die "Next Generation"-Crew das Kinoformat stemmen kann - ganz ohne die Unterstützung der Originalserie.

