  title: MareTV
  subtitle: Die Türkische Riviera - Antikes Flair, türkises Meer
  description: 'Mit einer Küste mit kilometerlangen Badestränden, türkisfarbenen Gewässern, atemberaubenden Klippen und reicher Geschichte war die türkische Riviera sogar ein Favorit der alten Griechen, Römer und Osmanen, die alle das milde Klima und die üppige Landschaft liebten. In der Nähe der Ruinen der antiken Stadt Side arbeitet Menderes Akdemir an der neuesten Attraktion für Riviera-Urlauber: Sein gruseliges Piratenschiff "Big Kral" soll das Trockendock verlassen und aufs Meer hinausfahren. Mehmet Özata hatte eine sehr kluge Idee: Um mit der im Grunde ruinösen Kugelfischplage entlang der Küste fertig zu werden, produziert er eine Auswahl von Lederutensilien aus ihrer Haut. Die Inseln, die die versunkene Stadt Simena umgeben, sind sehr beliebt, trotz der sehr bescheidenen Infrastruktur und des Mangels an Einkaufsmöglichkeiten. Deshalb haben Fatma und Ahmet Mazili ihr kleines Ruderboot in eine schwimmende Snackbar verwandelt.'
  genre:
