  title: MareTV
  subtitle: Norderney - Raue Schönheit im Wind
  description: 'Norderney, die zweitgrößte der Ostfriesischen Inseln, hat schon immer verstanden, wie man Gäste mit ihrem rauen Charme, Wind und Wetter anlockt: schon im frühen 19. Jahrhundert verbrachten Prominente, Adel und sogar der Kaiser selbst hier im ältesten deutschen Seebad an der Nordsee qualitätsvolle Zeit. "Der Wind ist unsere Sonne", strahlt Karin Ross, eine echte Insulanerin. Stürmische Hochzeiten sind Lisa-Marie Müllers Spezialität: In ihrer Eigenschaft als Hochzeitsplanerin kümmert sie sich um liebevolle Paare und sorgt dafür - auch bis weit in den Winter hinein -, dass sie den schönsten und winddichtesten Tag ihres Lebens erleben. Inke Lührs und ihre Bossel-Gruppe (Bossel ist ein Ballspiel, das außerhalb Norddeutschlands völlig unbekannt ist) werden sich freuen, wenn der Herbst kommt. Denn dann wird die einzige Straße, die nach Osten in das Naturschutzgebiet führt, für den obskuren Sport geöffnet.'
