  title: WDR 3 Konzert live
  subtitle: 'Vorhang auf: Wiedereröffnung der Kölner Oper!'
  description: |-
    Endlich ist es so weit: In neuer Schönheit erstrahlt das Opernhaus nach langen Jahren der Sanierung am Offenbachplatz in Köln. Das Ensemble der Sängerinnen und Sänger, der Chor und auch das Gürzenich-Orchester: sie alle sind wieder zurück und freuen sich auf eine vielfältige Spielzeit im modernisierten Zuhause. Zur Wiedereröffnung führt Bettina Böttinger durch eine Operngala, die den neuen Glanz des Hauses mit einem rauschenden Abend feiert.
    Moderation: <strong>Bettina Böttinger</strong>
    <strong>Alina Wunderlin</strong>, Sopran<br/><strong>Mitglieder des Ensembles der Oper Köln</strong><br/><strong>Chor Oper Köln Gürzenich-Orchester Köln </strong><br/>Leitung: <strong>Andrés Orozco-Estrada</strong>
    Live aus der Oper Köln
    Moderation: Daniel Finkernagel, Susanne Herzog <br/>Redaktion: Dr. Michael Breugst
