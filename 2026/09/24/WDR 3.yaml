  title: WDR 3 Jazz
  description: "Das 2025 mit dem Deutschen Jazzpreis ausgezeichnete PENG-Festival feiert zudem in Essen sein 10. Jubiläum und setzt sich ausdrücklich mit gesellschaftlichen Machtverhältnissen und solidarischer Kulturpraxis auseinandersetzt. In Viersen steht schon die 38. Ausgabe auf dem Programm, und \"New Colours\" in Gelsenkirchen spielt erneut mit der Architektur der Stadt. Thomas Mau mit einer Vorausschau.\n<strong>Snow crack</strong> | 5:00  <br/>Eivind Aarset Quartett       \n<strong>Breezy Johnson</strong> | 3:59  <br/>Bruce     \n<strong>Life will go on</strong> | 6:19  <br/>Tingvall Trio     \n<strong>Post-Democracy</strong> | 5:57  <br/>Hanno Busch     \n<strong>Fissa Psichi Mou</strong> | 5:29  <br/>Mother     \n<strong>Woken Dreams</strong> | 5:02  <br/>Simin Tander     \n<strong>Il trucido e lo sbirro</strong> | 4:46  <br/>Till Brönner     \n<strong>Everytime you leave</strong> | 4:30  <br/>So sorry     \n<strong>Eyes of wind</strong> | 5:30  <br/>Fabiana Striffler/Aki Takase     \n<strong>Something to ride your bicycle with</strong> | 4:56  <br/>SVM3"
