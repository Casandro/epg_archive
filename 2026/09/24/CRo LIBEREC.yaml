  title: Host Dopoledne pod Ještědem
  description: 'Téma: Ne(zájem) mladých voličů. Ředitelka IPPM Alice Mikulášová. Ředitel Institutu a iniciativy Nezájem Štěpán Smatana. Mladí lidé často prohlašují, že volit chtějí, ke komunálním volbám v roce 2022 jich ale přišla jen přibližně čtvrtina. O čem vypovídá nový výzkum agentury Ipsos pro Institut politické participace mladých, a jakým způsobem chce nalákat Institut a iniciativa Nezájem mladé lidi k volbám, to probereme hodinu před polednem s ředitelkou IPPM Alicí Mikulášovou.'
