- eventId: 1090221
  start: 2026-09-24T00:35:00Z
  stop: 2026-09-24T01:20:00Z
  title: Gärtner mit Herz
  subtitle: Englischer Landgarten mit Hochbeeten
  description: "Alan und sein Team reisen nach Hinckley, um den 96-jährigen Weltkriegsveteranen Gordon zu überraschen - einen der wenigen noch lebenden Helden der D-Day-Landungen. Mit viel Respekt und Fingerspitzengefühl gestalten sie einen klassischen englischen Landgarten mit Hochbeeten, der sowohl pflegeleicht als auch würdevoll ist. Das Ergebnis soll auch ein Zeichen der Anerkennung sein. \nGBR 2022"
- eventId: 1090222
  start: 2026-09-24T01:20:00Z
  stop: 2026-09-24T02:05:00Z
  title: Gärtner mit Herz
  subtitle: Der Garten als Ort der Heilung
  description: "In Hertfordshire gestaltet Alan für Yvonne einen besonderen Garten. Nach dem tragischen Verlust ihres Sohnes engagiert sie sich gegen Messergewalt und für junge Menschen. Der neue Garten soll ein Ort der Erinnerung und der Heilung werden - ein geschützter Raum, in dem die Familie und Gemeinschaft wieder zusammenfinden können. \nGBR 2022"
- eventId: 1090223
  start: 2026-09-24T02:05:00Z
  stop: 2026-09-24T02:55:00Z
  title: Gärtner mit Herz
  subtitle: Barrierefreier Familiengarten
  description: "Alan und die Jungs stehen vor der Herausforderung, einen karibisch inspirierten Garten für die Gemeindearbeiterin Jules Richards zu schaffen, inspiriert von ihrer Liebe zu Barbados. Alans erste Aufgabe besteht darin, die schmale Seitengasse, die zum Garten führt, in ein leuchtend gelbes Gemüse- und Kräuterbeet zu verwandeln und so einen dramatischen Eingang zu schaffen. David Domoney nimmt den hinteren Teil des Gartens in Angriff und baut eine beeindruckende Strandbar, die von bunten Sträuchern umgeben ist. Danny Clarke kümmert sich um die Mitte des Gartens, wo er ein atemberaubendes, warmes Beet mit roten, orangefarbenen und gelben Pflanzen anlegt. In einem anderen Garten zeigt Frances, wie man mit hellen Farben, schattenliebenden Blumen und Skulpturen eine dunkle Ecke verschönern kann. \nGBR 2022"
- eventId: 1090224
