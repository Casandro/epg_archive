    Stacey und Bryan erfüllen sich einen Lebenstraum und ziehen in die Nähe des Strandes auf St. Simons Island, Georgia. Sein Kleinstadtcharme und die malerischen Strände machen die Insel besonders bei jungen Familien mit Kindern attraktiv. Auch Stacey und Bryan lieben die Geschichte der Insel und wollen ihre beiden Kinder in einer eng verbundenen Gemeinschaft großziehen. Stacey hofft, ein renovierungsbedürftiges Haus mit altem Charme zu finden, aber Bryan hat Sorge vor einem großen Renovierungsprojekt und möchte lieber ein neues Haus nach den gemeinsamen Vorstellungen bauen.
