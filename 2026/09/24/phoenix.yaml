  title: Schicksalsmomente der Republik
  subtitle: Wie ein Gericht das Land verändert hat
  description: "Seit 75 Jahren schreibt das Bundesverfassungsgericht Geschichte deutsche Geschichte. Gleichberechtigung, Meinungsfreiheit, Abtreibung, Kopftuchverbot. Karlsruhe hat das letzte Wort: Wenn es ums Grundgesetz geht, um die Grundrechte  um die Verfasstheit des Landes. \n\nWie wir wurden, wer wir sind, ist eine Frage, die auch am Bundesverfassungsgericht beantwortet wird. Als Hüter des Grundgesetzes vermisst das Gericht die Regeln des Zusammenlebens immer wieder neu. Die Dokumentation Schicksalsmomente der Republik  wie ein Gericht das Land verändert hat reist durch Deutschland."
