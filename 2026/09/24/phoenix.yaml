  title: Die Volunteer-Masche
  widescreen: true
  hd: true
  description: |-
    Nur mal kurz die Welt retten. Das versprechen kommerzielle Anbieter von Freiwilligenarbeit jungen Menschen nach dem Schulabschluss. Für mehrere tausend Euro reisen sie nach Kambodscha, Mali oder Tansania, um dort zu helfen. Im Unterschied zum staatlich geprüften FSJ (Freiwilliges Soziales Jahr) geht das bei privaten Anbietern auch nur für wenige Wochen.
    Was nach sinnvoller Arbeit klingt, bedeutet vor Ort oft eher: Strand genießen und Bilder für Social Media sammeln. Nach einem Hinweis aus der Y-Kollektiv-Community meldet sich unser Filmteam undercover für ein kommerzielles Freiwilligenprojekt an.
