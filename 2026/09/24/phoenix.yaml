  title: Legendäre Zugabenteuer
  subtitle: Kanadas VIA Rail
  description: Die Strecke von Winnipeg nach Churchill ist eine lebenswichtige Verbindung zu den abgelegenen Gemeinden im hohen Norden Kanadas. Doch Schnee und Eis sind eine ständige Herausforderung. Mit einem Zug der VIA Rail geht es durch karge Schneelandschaften, dichten Nadelwald und über zugefrorene Seen auf die zweitägige Reise bis zum nördlichen Polarkreis. Unermüdliche Wartungscrews sorgen mit teils ungewöhnlichen Mitteln für eine stets befahrbare Strecke.
