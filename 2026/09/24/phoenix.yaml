  title: Australiens wilde Wälder
  description: Abgeschieden vom Rest der Welt gibt es in Australien eine beeindruckende Vielfalt an außergewöhnlichen und wundersamen Lebewesen, die nirgendwo sonst auf der Erde zu finden sind. Von üppigen, tropischen Regenwäldern bis hin zu trockenen, gigantischen Eukalyptuswäldern beheimaten die diversen Ökosysteme unzählige Spezies, die alle ihre Besonderheiten haben.
