  title: 'Detective Demery: Mord ist sein Metier'
  subtitle: Falsches Spiel
  description: |-
    In Shreveport, Louisiana, entdeckt ein Pärchen beim Angeln einen toten Körper im Wasser. Es ist die Leiche der 18-jährigen Tavia Sills, die kurz zuvor als vermisst gemeldet wurde. Als Rod Demery zum Tatort kommt, sieht er die Einschusswunde am Rücken des Mädchens, das außerdem schwanger war. Ein Unfall oder Selbstmord ist demnach auszuschließen. Der Ermittler sucht nach Spuren, Patronenhülsen und Anzeichen eines Kampfes, aber in der schwarzen Nacht ist zunächst nichts zu finden. Als der Mordermittler jedoch von einem fürchterlichen Geheimnis erfährt, das mit allen Mitteln verborgen werden sollte, tun sich völlig neue Erkenntnisse auf.
    USA 2016
  widescreen: true
