  description: Nemojte živeti samo vikendima, precrtavajući dane od ponedeljka do petka. Tu smo da vam damo dobru energiju, ispratimo vaše aktivnosti dinamičnom muzikom i promenimo perspektivu radnog dana. AS FM je jači od glasa džangrizavog kolege, gradske buke i negativnih misli, zato je mnogima neophodan u zahtevnom periodu od 10 do 14h.
