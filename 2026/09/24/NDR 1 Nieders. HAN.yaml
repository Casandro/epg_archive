  subtitle: Transrapid - Ein Unfall und seine Folgen (2)
  description: Vor 20 Jahren verunglückt im Emsland ein Transrapid bei einer Testfahrt. Mit fast 170 km/h prallt er auf einen Werkstattwagen. 23 Menschen sterben bei dem Unfall. Auch Ingenieur Dirk Dinnus sitzt an diesem Tag im TR 08 und überlebt. Danach ist auf der Teststrecke aber nichts mehr wie zuvor. Die Sendung berichtet über den Unfall und die Folgen.
