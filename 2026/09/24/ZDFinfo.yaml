- eventId: 755777
  start: 2026-09-24T09:15:00Z
  stop: 2026-09-24T10:00:00Z
  title: Coca-Cola und das Plastikproblem
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2022
    Die Getränkeindustrie stellt jedes Jahr 470 Milliarden Plastikflaschen her, von denen die meisten nur einmal verwendet und dann weggeworfen werden.

    Coca-Cola, der weltweit größte Hersteller von Erfrischungsgetränken, hat sich ehrgeizige Ziele gesetzt, um zu verhindern, dass seine Plastikflaschen die Umwelt verschmutzen. Doch das Unternehmen hat seine Ziele zur Verringerung des Plastikmülls schon oft verfehlt.
    HD-Produktion
- eventId: 756635
  start: 2026-09-24T10:00:00Z
  stop: 2026-09-24T10:45:00Z
  title: Giftige Teppiche - Gefahr durch PFAS
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    USA 2026
    Geruchlos, farblos, hochgiftig und langlebig: sogenannte PFAS-Chemikalien. Das Trinkwasser im US-Bundesstaat Georgia ist stark belastet - und hat viele Anwohner schwer krank gemacht.

    Über Jahrzehnte setzt die amerikanische Teppichindustrie PFAS in der Produktion von schmutzabweisenden Textilien ein. Die toxischen Stoffe, die auch "forever chemicals" genannt werden, gelangen in Flüsse, Böden und letztlich ins Trinkwasser Hunderttausender Menschen.
    HD-Produktion
