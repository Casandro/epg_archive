  description: |-
    Deutschland 2021
    Die Taiga: das größte Waldgebiet der Erde und wertvoller Sauerstofflieferant. Ein Ökosystem in Not: Erderwärmung und der Abbau von Rohstoffen zerstören riesige Flächen.

    Jahr für Jahr produzieren Russlands Wälder rund 1,3 Milliarden Tonnen Sauerstoff. Nach Angaben von Greenpeace Russland werden jedoch jährlich fünf bis zehn Millionen Hektar Wald durch Brände zerstört, zwei bis drei Millionen Hektar gerodet.
