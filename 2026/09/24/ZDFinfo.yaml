  title: Mythos Ramses II.
  subtitle: Sethos I. - Vater und Vorbild
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Als Ramses I. stirbt, wird Sethos I. sein Nachfolger. Gelingt es dem neuen Pharao, die Herrschaft auf ein stabiles Fundament zu stellen und seinem Sohn den Weg zur Macht zu ebnen?

    Als Sethos I. den Thron besteigt, ist Ramses II. noch ein Kind. Sethos setzt alles daran, seine Herkunft abzuschütteln, seine Macht auszubauen und seinen Sohn, den künftigen Pharao, auf seine Aufgaben vorzubereiten.
    HD-Produktion
- eventId: 748602
  start: 2026-09-24T00:45:00Z
  stop: 2026-09-24T01:30:00Z
  title: Mythos Ramses II.
  subtitle: Der junge Pharao
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Nach dem unerwarteten Tod von Pharao Sethos I. im Jahr 1279 vor Christus folgt ihm sein Sohn Ramses II. auf den Thron. Was damals niemand ahnt: Er wird Ägypten für nahezu 67 Jahre regieren.

    Ramses der Große führt das Land in ein goldenes Zeitalter und wird zu einem der berühmtesten Pharaonen Ägyptens. Er lässt monumentale Bauwerke errichten, darunter den beeindruckenden Hathor-Tempel für seine Große königliche Gemahlin Nefertari in Abu Simbel.
    HD-Produktion
- eventId: 748603
  start: 2026-09-24T01:30:00Z
  stop: 2026-09-24T02:15:00Z
  title: Mythos Ramses II.
  subtitle: Der Kriegerkönig
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2026
    Als junger Pharao zieht Ramses der Große in den Kampf, um die wichtige Festung Kadesch im heutigen Syrien zu erobern. Er scheitert - und dennoch wird der Feldzug zum Triumph.

    Die verfeindeten Hethiter bieten ihm einen Waffenstillstand an, und Ramses lässt sich im Anschluss als Sieger darstellen. Reliefs mit seinen Heldentaten zieren Tempelwände, und Boten verbreiten die Geschichte vom gefürchteten Kriegerpharao in ganz Ägypten.
    HD-Produktion
