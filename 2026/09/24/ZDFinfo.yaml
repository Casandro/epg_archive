  title: Krank durch Plastik?
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Sind wir alle unfreiwillige Teilnehmer eines globalen unkontrollierten Experiments mit unserer Gesundheit? Dies zumindest meinen angesehene Forscher in aller Welt.

    Während Plastik im Laufe der Jahre immer mehr Einzug in unser Leben gehalten hat, kam es parallel zu einer unerklärlichen Zunahme einer Reihe von Krankheiten. Früher erkrankte eine von 20 Frauen an Brustkrebs - heute ist es jede Achte.
