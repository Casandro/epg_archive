  title: Bares für Rares
  subtitle: Kunstvolle Lichtspiele
  description: "Eine atemberaubende Glasleuchte aus dem malerischen Murano in Italien soll einen neuen Besitzer finden! Doch wird das im Pulheimer Walzwerk erfolgreich von statten gehen? Die 1971 von der Designerin Giovanna Noti Massari entworfene Leuchte trägt den klangvollen Namen \"Tinta\". Dieses handgefertigte Meisterwerk besticht durch eine dunkle äußere Glaskuppel, die eine strahlend weiße Innenkuppel umschließt. Die netzartige Struktur der Lampe, verziert mit großen, bunten Glaselementen, erinnert an die exquisite Millefiori-Glasherstellungstechnik.\nProduziert von der renommierten Firma Leucos, ist diese Leuchte ein wertvolles Sammlerstück aus der Art-Déco-Ära. Trotz einiger kleiner Gebrauchsspuren ist der Zustand der Lampe gut, was ihren authentischen Charakter noch verstärkt. Die \"Tinta\" ist nicht nur ein funktionales Lichtobjekt, sondern auch ein kunstvolles Statement, das jeden Raum mit seinem einzigartigen Charme erhellt. Doch besticht die Glaslampe auch im Händlerraum? Wer schnappt sich dieses kunstvolle Lichtspiel? Es bleibt spannend! \nShow, Deutschland 2024, R: Ingo Monitor, Andre Spauke  M: Horst Lichter"
