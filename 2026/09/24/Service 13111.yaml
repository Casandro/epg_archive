  title: Herzensmarken
  subtitle: Westbahn
  description: Karli und Pascal bei der Westbahn. Die beiden verstehen anfangs nur Bahnhof, tauchen aber schnell ein in den Kosmos eines modernen Bahnunternehmens. Sie sind live dabei, wenn der Triebzugführer mit 200 km/h von Wien nach Salzburg fährt, und erleben nachts, wie die Westbahn-Züge in der riesigen Halle gewartet und gereinigt werden. Am Ende dürfen sie sogar selbst die Fahrkarten im Zug kontrollieren. Exklusive Einblicke gibt es auch in die Leitzentrale, wo alle Züge 24 Stunden am Tag überwacht werden, sowie im Fahrsimulator, wo Karli und Pascal hautnah erleben, wie sich ein Hochgeschwindigkeitszug steuern lässt. Die Zuseher erfahren außerdem, wie sich das Streckennetz der Westbahn in den letzten 15 Jahren entwickelt hat und welche Zugtypen jährlich mehr als 10 Millionen Kilometer zurücklegen.Österreich 2026
