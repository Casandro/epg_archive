  title: TM Wissen
  subtitle: Zweites Leben für Beton - Österreichische Pioniere binden CO2 in Bauschutt
  description: 'Die Bauindustrie verursacht massiv CO2 - doch ein Pilotprojekt in Mannersdorf will das ändern. Aus recyceltem Beton entsteht ein Pulver, das CO2 bindet und in Kalkstein umwandelt. Dieser wird wiederverwendet und spart so pro Werk bis zu 250 Tonnen CO2 jährlich. Ein vielversprechender Ansatz für klimafreundlicheres Bauen. // Der Schlammpeitzger, wegen seiner Darmatmung "Furzfisch" genannt, lebt in einem renaturierten Feuchtgebiet in Niederösterreich. Was kurios klingt, ist ein Vorzeigeprojekt für Artenschutz. Forscher und Vereine arbeiten mit Hightech und Leidenschaft für den Erhalt eines einzigartigen Lebensraums - mit einem unscheinbaren Fisch als Symbolfigur. // Schon in den 1920ern träumte Max Valier vom Weltraum. Der Südtiroler entwickelte Raketenautos mit Fritz von Opel, testete waghalsig auf Eis und Asphalt - bis er in München mit Flüssigraketen experimentierte. Seine Vision: Raumfahrt mit Schubkraft. Sein Pioniergeist wirkt bis heute in der Raumfahrttechnik nach. // Wie ruinierte eine falsche Theorie die Landwirtschaft einer Nation? Wo liegt der größte natürliche Spiegel der Welt? Stirbt die Prärie ohne Bisons? Und: Ist unser Sonnensystem wirklich einzigartig?Österreich 2025'
