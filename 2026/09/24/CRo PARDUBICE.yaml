  start: 2026-09-24T15:30:00Z
  stop: 2026-09-24T15:42:00Z
  title: O čem se mluví v Pardubickém kraji
  description: Pardubice čekají tento víkend krajské dožínky. Jak budou na letošní sezónu vzpomínat zemědělci? Našli by v historii nějakou horší? Jaké dopady ještě bude mít dlouhotrvající sucho? Co pro ně znamenají vysoké ceny nafty? A nemůžou někdy v očích veřejnosti působit jako věční stěžovatelé? Zeptáme se ředitelky Regionální agrární komory Pardubického kraje Vandy Rektorisové. Moderuje Jakub Malý.
