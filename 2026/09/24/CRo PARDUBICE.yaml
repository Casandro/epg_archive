  title: Kdo umí, ten umí
  description: Vinařství bylo za dob Pernštejnů poměrně běžnou součástí života i v Pardubickém kraji, dnes si s produkcí vína spojuje náš region málokdo. Přesto se réva na východ Čech znovu vrací. Svůj průkopnický podíl na tom má i host pořadu Kdo umí ten umí Michal Maryška. Připravila Milena Vápeníková.
