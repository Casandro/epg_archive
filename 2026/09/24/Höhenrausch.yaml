  title: Ultimate Rush - Menschlicher Pfeil
  subtitle: Ultimate Rush - Menschlicher Pfeil
  description: Als ehemaliger Navy Seal und Ausbilder für Fallschirmspringer hat Andy Stumpf tausende Flüge im freien Fall absolviert. Nun will Andy den Weltrekord für den weitesten Flug in einem Wingsuit brechen. Es ist nicht das erste Mal, dass Andy ein großes Risiko eingeht. Doch dieses Mal ist er sich der Gefahr wirklich bewusst. Er rechnet mit allen möglichen Szenarien. Nur wenige versuchen den Distanz-Rekord zu brechen. Beim Fallschirmspringen zählen vor allem Gruppensprünge, akrobatische Tricks und Formationen. Beim Basejumping geht der Trend dahin, möglichst nah an Objekten oder am Boden entlangzufliegen. Andy will dagegen versuchen, so hoch wie möglich aus einem Flugzeug abzuspringen. Er will die maximale Distanz erreichen. AT 2016
