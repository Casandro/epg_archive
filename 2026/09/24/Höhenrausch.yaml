  title: Heimatleuchten - Rund um die Lavanttaler Alpen
  subtitle: Heimatleuchten - Rund um die Lavanttaler Alpen
  description: |-
    Wenn Keramikerin Petra Imkert über die Koralpe reitet, genießt sie nicht nur einen traumhaften Ausblick, sondern taucht mitten in das Herz dreier Kulturen ein, die eines verbindet: der Mut, neue Wege zu gehen. Sie und die Winzerin Sabine David sind die Freigeister dieser Region, die uraltem Handwerk neues Leben einhauchen. Petra formt mit der jahrtausendealten Raku-Brenntechnik faszinierende Tonkunstwerke, während Sabine mit ihren preisgekrönten Weinen das alte Vorurteil widerlegt, dass Wein aus Kärnten angeblich nicht schmeckt. In dieser Region wird auch das Erbe der Urgroßväter lebendig gehalten. Thomas Reinbold, ein Galanteriespengler in der vierten Generation, fertigt kunstvolle Kirchenkreuze, die noch seine Urenkel überdauern werden. Familie steht hier im Mittelpunkt, und der Zusammenhalt ist oft der Schlüssel zum Erfolg. Bei der Zirbenernte der Manufaktur Müller packt jeder mit an - vom Jüngsten bis zum Ältesten. Das Ergebnis? Schnäpse und Essig, schon über 100 Mal mit Gold prämiert.
    Die Offnerhütte auf der Saualpe liegt nicht nur in beeindruckender Bergkulisse, sie bietet auch hausgemachte Spezialitäten aus der eigenen Jagd, und ist der ideale Ort für einen lustigen Polterabend. Die vielfältigen Geschichten dieser Region finden sich auch auf dem Hof von Hans und Christa Muster, der genau an der Grenze zu Slowenien liegt. Für Hans war diese Grenze als Kind eine unsichtbare Mauer. Heute erkundet er die slowenische Seite noch immer neugierig. Seine 130 Zwergzebus, die "heiligen Kühe" aus Indien, sind Grenzgänger, die in Österreich und Slowenien grasen. Es sind Geschichten über Pioniere, Heimkehrer und Grenzgänger, die rund um die Lavanttaler Alpen erzählt werden. Und einige werden in dem wahrscheinlich charmantesten Dialekt weitergegeben - dem "lovntolerischen". AT 2024
