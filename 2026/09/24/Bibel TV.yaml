  title: Avonlea - Das Mädchen aus der Stadt
  subtitle: So ein Frauenzimmer
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Provokationen ihrer Cousine Felicity verleiten Sara dazu, durch ein Fenster in das Haus des Eigenbrötlers Alexander Abraham zu klettern. Auch ihr Cousin Felix ist durch ein Missgeschick mit von der Partie. Als dann auch noch die gefürchtete und für ihre Strenge bekannte Mrs. Lynche bei Mr. Abraham auftaucht und buchstäblich mit der Tür ins Haus fällt, ist das Chaos komplett. Denn anders als von den Kindern angenommen ist Mr. Abraham nicht nur zu Hause. Er steht zu allem Überfluss außerdem wegen eines Pockenfalls unter strenger Quarantäne. Nicht nur für Sara und Felix ist das dumm gelaufen. Auch Mrs. Lynche muss jetzt mehrere Wochen gemeinsam mit den Kindern und Mr. Abraham in dessen Haus bleiben. Für keinen eine schöne Vorstellung. Wird sich das ungleiche Quartett zusammenraufen?'
