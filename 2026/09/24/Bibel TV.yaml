  title: Antworten mit Bayless Conley
  subtitle: Jesus - Herr über Körper, Seele und Geist
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Menschen sind weit mehr als das, was man von außen sieht: ein einzigartiges Zusammenspiel aus Geist, Seele und Körper. In dieser Predigt über drei außergewöhnliche Geschichten aus Markus 5 zeigt Bayless Conley, dass Jesus der Herr über alle drei Bereiche des Lebens ist. Bayless Conley erklärt: Jesus schenkt Freiheit für die Seele von mentaler Belastung, Heilung sowie neues Leben für den Geist, das bis in die Ewigkeit reicht. Keine Situation liegt außerhalb der Reichweite von Gottes verändernder Kraft.'
