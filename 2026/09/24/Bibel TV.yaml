  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Leben der Familie Morante ist hart. Als Wanderarbeiter ziehen sie von Farm zu Farm und auch die Kinder müssen auf dem Feld helfen. Der älteste Sohn, Tino, hat ein großes musikalisches Talent, das nie gefördert wurde. Tess bringt ihm das Klavierspielen bei und Monica ermutigt ihn, sich um ein Stipendium an der Musikschule zu bewerben. Doch Tinos Vater ist gegen solch brotlose Kunst. Außerdem wird Tino benötigt, um zum Familieneinkommen beizutragen, besonders nachdem sich sein Vater am Rücken verletzt hat. Die Engel sind aber fest entschlossen, nicht zuzulassen, dass das Talent, das Gott Tino geschenkt hat, einfach verloren geht.'
