  title: Rodzinka.pl s.XVII - odc. "Duch" sezon 17
  description: |-
    Tytuł oryginalny: Rodzinka.pl
    PL, 2025
    Reżyseria: Patrick Yoka
    Występują: Adam Zdrójkowski, Emma Pokromska, Helena Englert, Klara Bielawka, Maciej Musiał, Magdalena Stużyńska
    Nowa dziewczyna ironizuje na temat Kuby, żartując z jego zbyt bliskiej relacji z matką. Zachowanie Soni nieco przeraża chłopaka. Natalia coraz częściej ma wrażenie, że Ludwik daje się wykorzystywać przez Tomka i Magdę - niepokoi ją, że każdą wolną chwilę poświęca opiece nad Majką. Babski wieczór również nie przynosi Natalii ukojenia - zamiast relaksu, czuje się wykorzystana przez własną przyjaciółkę.
  ageRating: 12
