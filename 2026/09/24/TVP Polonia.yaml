  title: Kapłan z Suchedniowa
  description: |-
    Tytuł oryginalny: Kapłan z Suchedniowa
    PL, 2003
    Filmowy portret i droga kapłańska księdza infułata Józefa Wójcika, obecnie proboszcza parafii w Suchedniowie, który z wielkim heroizmem przeciwstawiał się działaniom socjalistycznych władz zmierzających do wyeliminowania Boga i religii z życia Polaków. Najbardziej bohaterskim i spektakularnym wyczynem księdza Wójcika było odebranie w 1972 roku zarekwirowanej przez władze PRL kopii obrazu Matki Boskiej Częstochowskiej.
