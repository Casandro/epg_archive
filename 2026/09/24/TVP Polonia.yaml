  title: Ranczo s.III - odc. 38 (seria III, odc. 12) - Złoty deszcz
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2008
    Reżyseria: Robert Brutter
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Franciszek Pieczka, Dorota Nowakowska, Jacek Kawalec
    Hadziuk chodzi po wsi jak ranny łoś, widząc w każdym mężczyźnie sprawcę swego nieszczęścia, natomiast polonista przeprowadza kolejne rozmowy o kobiecej duszy, działając na każdą interlokutorkę podobnie jak na Hadziukową. Wójt dostaje nagle wezwanie do województwa. Nie znając przyczyn wezwania, jest przekonany, że czeka go odwołanie, a może nawet zostanie zakuty w kajdanki, jak to jest w modzie. Wójt wyrusza zatem w swoją ostatnią drogę służbową.
  ageRating: 12
  genre:
  - '23'
  subtitle: Hadziuk poszukuje sprawcy swojego nieszczęścia. Wójt dostaje wezwanie na rozmowę do województwa, obawia się, że zostanie odwołany z funkcji albo nawet aresztowany.
