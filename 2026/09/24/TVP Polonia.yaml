  subtitle: Dziewczyna Kuby żartuje z jego relacji z matką. Natalia ma wrażenie, że Ludwik daje się wykorzystywać Tomkowi. Terapeuta radzi Natalii, by odcięła emocjonalną pępowinę łączącą ją z dorosłymi synami.
