  title: Wies Leben so spielt
  subtitle: mit Yogalehrerin Sandra Riedel
  description: Yoga ist ein riesiger Trendsport, der schon lange seinen Weg aus den großen Städten in die kleineren Orte gefunden hat. Auch Yogalehrerin Sandra Riedel hat es aus Berlin ins überschaubare Burgberg im Allgäu verschlagen. Hier möchte sie ihren Schülerinnen Ruhe bringen und in schwierigen Zeiten unterstützen, denn sie selbst fand trotz eines schweren Schicksalsschlags Halt im Yoga. Herr Braun spricht mit ihr über ihre Krebserkrankung und wie man mentale Stärke durch Yoga gewinnen kann.
