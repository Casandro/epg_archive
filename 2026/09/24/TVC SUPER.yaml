  title: Jednostka do zadań specjalnych 7 (odc. 12)
  subtitle: Martin Bernier staje się świadkiem śmiertelnej strzelaniny i ratuje dziecko. W następstwie tych wydarzeń spotyka porucznika Lucasa Auriola i rozważa objęcie szefostwa nad jego zespołem.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2014
    Reżyseria: Eric Le Roux
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Félicité Chaton, Julie Fournier, Stéphane Soo Mongo
    Minął rok od czasu rozwiązania zespołu detektywów z Bordeaux. Kapitan francuskich sił policyjnych - Martin Bernier - przebywa w uroczej nadmorskiej mieścinie na południu Francji. Jednak nie jest mu dane odpocząć, ponieważ mimowolnie staje się świadkiem śmiertelnej strzelaniny i ratuje dziecko z samochodu. W następstwie tych wydarzeń spotyka porucznika Lucasa Auriola i rozważa objęcie szefostwa nad jego zespołem. Sama sprawa strzelaniny zaskakuje: spadki, zdrady, rodzinne koneksje i kłótnie.
