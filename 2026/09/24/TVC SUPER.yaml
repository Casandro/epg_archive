  title: Jednostka do zadań specjalnych 7 (odc. 16)
  subtitle: Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2013
    Reżyseria: Olivier Barma
    Występują: Xavier Deluc, Virginie Caliari, Chrystelle Labaude, Jean-Pascal Lacoste, Vincent Primault, Manon Azem
    Serial śledzi pracę specjalnej jednostki policji w Bordeaux, stawiającej czoła złożonym i niebezpiecznym sprawom kryminalnym. Równocześnie uwaga skupiona jest na skomplikowanych relacjach między członkami zespołu, gdzie lojalność, napięcia i przyjaźnie splatają się w codziennym życiu. Obsada: Xavier Deluc, Chrystelle Labaude, Franck Semonin
  ageRating: 12
