    Krimiserie, Großbritannien / Deutschland 2023
    Ein Galeriemanager wird nach einer Vernissage in Chelsea ermordet aufgefunden. Das Team um Detective Inspector Max Arnold ermittelt im beruflichen und privaten Umfeld des Opfers.

    Aus den Ausstellungsräumen ist das wertvolle Gemälde "Im blauen Zimmer" gestohlen worden. Ein Versicherungsbetrug scheint nicht ausgeschlossen. Die Polizisten nehmen Galeriebesitzerin Rebekah Chaban und deren Mann Benoit genauestens unter die Lupe.
