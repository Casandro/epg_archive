  title: Pogled preko granice - Hrvati u BiH
  subtitle: ' '
  description: Tjedna emisija, donosi kratke reportaže o svakodnevici Hrvata u BiH, prati tamošnju političku scenu, događaje u hrvatskoj zajednici, podsjeća na velikane hrvatske kulture, znanosti i povijesti.
- eventId:
  - 1085032
  - 1160670
  start: 2026-09-24T01:36:00Z
  stop: 2026-09-24T02:01:00Z
  title: Pogled preko granice - Hrvati u BiH
  subtitle: ' '
  description: '- Nakon dva tjedna predizborne kampanje u Bosni i Hercegovini, Koalicija "Pod lupom" predstavila je rezultate praćenja predizbornog procesa. Zabilježene su 794 izborne nepravilnosti, ali i primjeri kršenja izbornih pravila - S Danijelom Vidovićem, politologom iz Mostara, razgovaramo o kvaliteti ovogodišnje predizborne kampanje u Bosni i Hercegovini, novoj tehnologiji te o tome kakva se izlaznost očekuje u odnosu na prije - Kada će hrvatski učenici dobiti svoju školu u Bugojnu? Gotovo 30 godina traži se trajno rješenje za školu koju polaze hrvatska djeca u Bugojnu. Pred roditeljima i učenicima nova je neizvjesnost - preseljenje škole. Dok lokalne vlasti govore o rješavanju dugogodišnjeg problema, roditelji poručuju da se djecu ne smije seliti bez jasnog odgovora na pitanje - gdje će i pod kojim uvjetima nastaviti školovanje? - Otvorena novoizgrađena sportska dvorana Osnovne škole u Odžaku - U 24 svjedočanstva, knjiga "Sicanje" donosi priče žena o tradiciji tetoviranja, običaju karakterističnom za katolkinje iz Bosne i Hercegovine - U povodu 140. obljetnice dolaska Silvija Strahimira Kranjčevića u Mostar, otvorena je izložba "Kranjčević u Mostaru - Dijalog između riječi i slike". Izložba povezuje književnu baštinu velikog hrvatskog pjesnika sa suvremenim likovnim izrazom izborom njegovih knjiga i umjetničkih djela - 18. Dani kazališta "Vitez 2026" otvoreni su predstavom "Nedostajem sama sebi" teatra "Maska" iz Münchena. Prije nekoliko godina taj je teatar osnovao Vitežanin Marin Bikić. Provjerili smo kako je bilo na otvorenju.'
