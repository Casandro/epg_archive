  title: 'Čarobna ploča - Školica: Slova Đ i DŽ (18/20)'
  subtitle: ' '
  description: 'U Čarobnu ploču svi ste dobrodošli, puno smo slova već zajedno prošli. Slova Đ i DŽ učimo danas, Mila će otpjevati pjesmice za vas. Krešo će pokazati koliko crta koje slovo krije, i ravne i zakrivljene naučili ste prije. Slovom Đ počinje đak koji učiti voli, zato nam se pridružite u veseloj školi. I svakako na kraju emisije zaplešite s nama. Ples je najbolji početak dana! Autori: Ida Tomić i Dragutin Broz Uloge Krešimir Mikić i Mila Elegović'
