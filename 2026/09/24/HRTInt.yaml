  title: Murano i Hrvatska, dokumentarni film (2013.)
  subtitle: ' '
  description: Otkad su potkraj 13. stoljeća venecijanske vlasti odlučile staklare iz grada preseliti na Murano, taj je otok usred lagune stoljećima bio najvažnije središte proizvodnje stakla. Proizvodi od čvrstog i istodobno krhkog svjetlucavog materijala bili su jedan od važnijih venecijanskih izvoznih proizvoda.  Mnoga remek-djela staklarskog umijeća čuvaju se u Muzeju stakla na Muranu, ali i fundusi onih naših, mogu se, kako ćemo vidjeti, pohvaliti zavidnim zbirkama upotrebnih i ukrasnih predmeta nastalih na Muranu.
