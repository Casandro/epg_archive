  title: Luda kuća (3), humoristična serija (27/34)
  subtitle: ' '
  description: 'Slavkova mama Ruža dolazi u Zagreb radi operacije mrene na očima. Iako je u strahu i piše oporuku, nakraju sve dobro završi. S razlogom se odluči i za operaciju drugog oka. Dok Verica posprema kod Slavka i Lacija, a Filip i Miljenko popravljaju krov kuće Miljenkove mame u Karlobagu, Matilda priprema dijetne juhe i maltretira Đuru. Božena svaki dan dobiva buket cvijeća i čokoladice od tajnog obožavatelja i sumnja na Volodera, a Voloder na njezinog ljubavnika. Kao iskusni bivši policajac Đuro otkriva pravog obožavatelja s osvetničkim namjerama. Gostuje Marija Kohn. Uloge: Jelena Miholjević, Nada Gaćešić Livaković, Goran Grgić, Ljubomir Kapor, Marinko Prga, Jadranka Đokić, Pjer Meničanin Scenaristice: Zinka Kiseljak, Dora Delbianco, Tanja Kirhmajer Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
