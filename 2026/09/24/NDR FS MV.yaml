  title: Großstadtrevier (405)
  subtitle: Ausnahmezustand
  description: Was ist los mit Dirk Matthies? Als Ingrid Lüders, die Chefin der Coconut-Bar, sein Konterfei in Hamburg plakatieren lässt, und damit das gesamte Kommissariat 14 als untätig in Sachen Schutzgelderpressung durch die Kiezgröße Johan König anprangert, winkt Dirk nur müde ab. Die Presse greift den Fall jedoch gleich auf. Der Polizeipräsident macht Druck. Und Kommissariatsleiterin Küppers fordert von ihrem Team schleunigst Beweise gegen König. Dirk aber bleibt weiterhin fast teilnahmslos. Selbst als Ingrid Lüders Dirk vor Journalisten bezichtigt, von den Schutzgelderpressern Schmiergeld kassiert zu haben, wehrt er sich nicht.
