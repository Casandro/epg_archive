  title: Gertrud Stranitzki
  subtitle: Kinderkrankheiten
  description: 'Krankheitsfälle lähmen den Betrieb der Zwischenmeisterei. Irmgard Benthjen liegt mit Virusgrippe im Bett. Elsbeth Sommer fällt wegen Hexenschuss aus. Und die Schneiderin Prittwitz meldet, dass ihre Tochter Manuela "Ziegenpeter" hat. Während Albert Stranitzki seine Lieblingsfernsehsendung beäugt, klagt die Ehefrau über Ohrenschmerzen. Dr. Wernickes Diagnose lautet auch bei ihr: "Ziegenpeter". Das heißt strikte Bettruhe. Kurz darauf leidet auch Albert an "Ziegenpeter".'
