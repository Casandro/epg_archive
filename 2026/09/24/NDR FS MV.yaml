  description: Karin nimmt eine Frau und deren angeblichen Sohn bei sich auf, die in einem auf der Insel wütenden Unwetter verletzt wurden. In Karin erwacht sofort der Ermittlungsinstinkt, da die Frau auch Anzeichen heftiger Misshandlungen hat. Unterdessen ermittelt Rainer Witt in einem Raubüberfall, bei dem der Antiquitätenhändler Christian Zoschitz angeschossen wurde. Als der Sturm immer weiter zunimmt, müssen sich alle verbarrikadieren. Während Karin und Merle mit den Gästen Schutz im Hause Witt suchen, sitzt Rainer ohne Unterstützung am Tatort fest. Unterdessen herrscht Im Präsidium Chaos, als auch noch der Strom ausfällt ...
