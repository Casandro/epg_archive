  description: "Jeanette lehnt Drechslers Angebot ab, Jana auszubooten und ihr 'Menara' zu kaufen. Die beiden Frauen entwickeln einen Plan, wie Jeanette sich von Drechsler lösen kann. Doch dieser tappt nicht in die Falle. Da entschließt sich Jeanette zu einem radikalen Schritt, mit allen Konsequenzen ...\n \nMerle konfrontiert Justus mit dem gestohlenen Bild in seinem Koffer. Betroffen gibt er alles zu, beschwört Merle, dass seine Gefühle für sie echt sind. Doch Merle wirft ihn hinaus. Bevor sie jedoch Gunter reinen Wein einschenken kann, erlebt sie eine Überraschung.\n \nAylin und Thomas geraten bei ihrer Hochzeitsplanung zunehmend in Stress."
