  description: "Konstantin warnt Natascha davor, durch unüberlegte Aktionen das letzte Vertrauen bei Marlene zu verspielen. Natascha wird von Veit in seiner Suite erwischt, als sie nach Beweisen sucht, dass sein Auftauchen etwas mit seiner Krankheit zu tun hat. Tatsächlich findet sie entsprechende Unterlagen. Veit gibt sein Kalkül zu und bietet Natascha an, ihrer Karriere einen großen Schub zu verpassen, wenn sie ihr Wissen für sich behält...\n \nUm seinen und Hildegards guten Ruf besorgt, schlägt Alfons das Erbe aus und klärt Zwick auf, dass er Hildegard niemals betrogen hat."
