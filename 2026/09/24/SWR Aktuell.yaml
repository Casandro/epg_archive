  title: SWR Kultur - Das Wissen
  subtitle: Opfer von Gewaltverbrechen - Was ihnen wirklich hilft
  description: |-
    Von Eva Hoffmann
    Ein Gewaltverbrechen verändert das Leben der Betroffenen für immer. Häufig leiden sie nicht nur unter den physischen Konsequenzen der Tat, sondern kämpfen auch mit psychischen Langzeitfolgen. Psychologisch und kriminologisch sind die Bedürfnisse dieser vulnerablen Gruppe gut erforscht. Aber nicht immer bekommen Opfer auch den Zugang zu Hilfsangeboten, der ihnen rechtlich zusteht. Während die wohl berühmteste Hilfsorganisation für Opferschutz "Weißer Ring" im September 2026 ihr 50-jähriges Bestehen feiert, kämpfen kleinere Initiativen wie der "Verein Opferperspektive" und andere Gewaltschutzprojekte um Gelder und ihre Existenz.
