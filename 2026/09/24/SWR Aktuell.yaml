  title: Mitreden! Deutschland diskutiert
  subtitle: Volle Gipfel, wenig Schnee - Wie schützen wir die Alpen?
  description: "19:00 \nDeutschland Nachrichten\n\n19:03 - 20:30\n\"Mitreden! Deutschland diskutiert\" - Volle Gipfel, wenig Schnee - Wie schützen wir die Alpen?\nUrlaub in den bayerischen Alpen boomt. Die Menschen suchen ein Naturerlebnis, Erholung oder eine sportliche Herausforderung. Doch je voller die Gipfel werden, desto mehr wird diskutiert: Zu viele Leute an einzelnen Hot Spots, zu wenig Schnee in Skigebieten und Gefahren durch den Klimawandel. Wir fragen uns: Wie schützen wir unsere Berge - und was bedeutet das für alle, die dort Urlaub machen oder leben?  - live aus Lenggries.\nModeraation: Christian Orth \n\nGäste:\n-Hilde Gerg | Ehemalige Skirennläuferin, Olympiasiegerin und Weltmeisterin\n-Stefan Klaffenbacher | Erster Bürgermeister der Gemeinde Lenggries\n-Antonia Asenstorfer | Geschäftsführerin der Bergbahnen Brauneck und Wallberg\n-Thomas Wanner | Berg- und Skiführer \n\nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html\n\n\n20:30\nInfoblock"
