  title: SWR Aktuell Langstrecke
  description: "14:00\nAlles Geschichte - Der History-Podcast\nDER VERBOTENE VATER (3/3) - Entscheidung in der Nacht\nErst spät in ihrem Leben nimmt Katharina all ihren Mut zusammen und folgt einer heißen Spur nach Frankreich. Sie stößt auf immer mehr Hinweise und einen Liebesbrief. Es ist eine Reise voller absurder Zufälle und unerwarteter Wendungen. Hat das Besatzungskind Katharina eine Familie in Frankreich?\nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/alles-geschichte-der-history-podcast/urn:ard:show:fdb83c5530d71150/\n\n14:30\nSWR1 Leute mit Ulrich Schneider | Soziologe\n\"Wir kommen gern mal von Höcksken auf Stöcksken.\" So sagt es Ulrich Schneider über die \"Ruhris\" oder die \"Ruhrpottler\", wie die Menschen aus dem Ruhrgebiet genannt werden. Ulrich Schneider ist so ein Mensch: In seiner Biografie erzählt er von seiner Arbeiterkindheit im Revier - von Eltern, die sich aufrieben, von Müttern, die alles zusammenhielten, von Vätern, die früh verschlissen wurden, von Stolz, Solidarität, Härte und bescheidener Großzügigkeit. \nUlrich Schneider studierte Erziehungswissenschaften, arbeitete in der Familienhilfe und begann 1988 beim Paritätischen Wohlfahrtsverband, dessen Hauptgeschäftsführer er 25 Jahre lang war. Er wurde als Deutschlands bekanntester Soziallobbyist bezeichnet. Heute ist er als Autor, Berater und Sozialexperte aktiv und politisch im Parteivorstand bei DIE LINKE engagiert. In SWR1 Leute berichtet Ulrich Schneider über seine Arbeiterkindheit im Ruhrgebiet.\nModeration: Nicole Köster\nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
