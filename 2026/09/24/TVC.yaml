  title: Łapizbiry
  subtitle: Brawurowa komedia kryminalna, w której seria nieporozumień prowadzi dwóch bezdomnych prosto do policyjnego munduru. Zmuszeni do podjęcia służby w policji Miami, trafiają w sam środek śledztwa.
  description: |-
    Tytuł oryginalny: I due superpiedi quasi piatti
    IT,US, 1977
    Reżyseria: Enzo Barboni
    Występują: Terence Hill, Bud Spencer, Laura Gemser, David Huddleston, Luciano Catenacci, Riccardo Pizzuti
    Przypadkowy napad na komisariat zmusza dwóch pechowych włóczęgów do wstąpienia w szeregi policji w Miami. Zamiast ucieczki czeka ich twarda służba i walka z potężnym gangiem narkotykowym. Ta pełna humoru komedia kryminalna pokazuje, jak dwaj ekscentryczni rekruci i ich nieszablonowe metody stają się największym zagrożeniem dla mafii. Obsada: Terence Hill, Bud Spencer, David Huddleston
  ageRating: 16
  genre:
