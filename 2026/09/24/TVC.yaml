  title: Ludzkość - historia nas wszystkich 1 (odc. 8)
  subtitle: Hiszpanie otwierają w Andach największą kopalnię srebra na świecie. Z kruszcu powstają miliony pesos. Monety zmieniają oblicze światowej ekonomii. Wypełniają skrzynie piratów i napędzają giełdę.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Mike Loades, Richard Machowicz, George Wunderlich, Charles Mann, James Meigs, Santhi Hejeebu
    Hiszpanie otwierają w Andach największą kopalnię srebra na świecie i biją miliony pesos. Monety te zmieniają oblicze światowej ekonomii. Wypełniają skrzynie piratów, napędzają boom na giełdzie, po części finansują budowę Taj Mahal. Podczas gdy handel kwitnie, do Nowego Świata miliony ludzi trafiają jako niewolnicy. Ten sam kontynent dla innych - takich jak purytanie, znani później jako ojcowie pielgrzymi - jest ziemią obiecaną i drogą do wolności.
