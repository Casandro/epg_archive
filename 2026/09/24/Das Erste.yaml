  subtitle: Mord aus zweiter Hand
  description: Auf einer Brücke im bayerischen Oberland entdecken Hubert und Girwidz ein herrenloses Auto. Der Fahrer des Wagens, Frank Giebel, liegt tot am Fuß der Brücke. Alles deutet auf Selbstmord unter Alkoholeinfluss hin. Ein Besuch in Giebels Wohnung offenbart allerdings ganz andere Hinweise, die auf Tod durch Fremdeinwirkung schließen lassen. Hubert und Girwidz sehen sich daraufhin im Umfeld des Toten um und erfahren, dass er als Fahrer in einer Altkleiderverwertung angestellt war. Sehr schnell finden sie heraus, dass dort nicht alles mit rechten Dingen zugeht.
