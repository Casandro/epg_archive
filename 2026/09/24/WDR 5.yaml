  description: "Eine Gießerei in Norddeutschland will weg von der Kohle und einen klimafreundlicheren Elektro-Ofen anschaffen. Doch auf den nötigen Anschluss ans Stromnetz musste das Industrieunternehmen jahrelang warten. Und so geht es vielen Industrieunternehmen. \nIn dieser 11KM-Folge erzählt NDR-Journalist Nils Naber vom harten Kampf um die Anschlüsse ans deutsche Starkstromnetz. Droht die Energiewende ausgerechnet am Stromnetz zu scheitern? Und wie sehr schadet das dem Wirtschaftsstandort Deutschland?"
  subtitle: Wie das überlastete Stromnetz Energiewende und Industrie ausbremst
