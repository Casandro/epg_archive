  title: Pip und Posy
  subtitle: Die kleine Ente
  description: |-
    Die kleine Ente

    Als die Freunde das sogenannte Entenspiel spielen, gesellt sich eine Babyente zu ihnen und weicht Pip nicht mehr von der Seite. Pip findet das irgendwie gar nicht witzig.

    Er möchte seinen Verfolger loswerden. Leider hilft es auch nicht, sich zu verstecken - die Babyente findet Pip überall. Da taucht plötzlich Jamila auf, die die kleine Ente mit Namen kennt und sich wundert, warum Derek nicht bei seinen Entenfreunden ist.

    Posy erklärt Jamila, dass Pip sich von Derek verfolgt fühlt - und Jamila hat prompt eine Erklärung dafür: Da Pip auch ein Wackelschwänzchen hat, denkt das Entchen, er sei ebenfalls eine Ente! Posy schlägt vor, dass Pip sie mithilfe seines Wackelschwänzchens und einem Ententänzchen - bei dem natürlich alle mitmachen - zurück zu ihren Entenfreunden locken soll. Und das funktioniert auch ganz hervorragend!

    Doch als Derek sich wieder seinen Freunden anschließt, ist Pip ein bisschen traurig - er hatte sich nämlich inzwischen an die Gesellschaft der süßen kleinen Ente gewöhnt.
    Regie: Seán McCormack
    Buch/Autor: James Walsh, Matt Baker
    Musik: Ellie Wyatt, Joss Peach
