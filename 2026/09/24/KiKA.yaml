  title: Pip und Posy
  subtitle: Kein Zwilling für Zac
  description: |-
    Kein Zwilling für Zac

    Beim Schere-Stein-Papier-Spiel stellen Pip und Posy fest, dass sie sich immer für genau dasselbe Motiv entscheiden. Pip glaubt, sie müssten deshalb so etwas wie Zwillinge sein.

    Zac kommt heran gerollert und entdeckt, dass Mo haargenau den gleichen Roller hat wie er. "Vielleicht seid ihr ja auch Zwillinge", sagt Posy und Zac findet den Gedanken supertoll. Aber leider stellt sich schnell heraus, dass er und Mo so gar keine Gemeinsamkeiten haben.

    Zac ist furchtbar enttäuscht - aber Pip und Posy können ihn davon überzeugen, dass man nicht unbedingt ein Zwilling sein muss, um allerbeste Freunde zu sein.
