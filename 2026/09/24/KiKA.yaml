    Sie, Willi und die Bienenschüler müssen sich nur danebenbenehmen, damit der Richter sie ebenfalls ins Gefängnis schickt. Gesagt getan, und alle atmen auf. Das macht die Runde, und bald wird es eng im Gefängnis. Als auch der Richter ...
