  subtitle: Kürzere Sommerferien - ja oder nein?!
  description: |-
    Kürzere Sommerferien - ja oder nein?!

    Sollten die Sommerferien kürzer sein, oder sind sie jetzt schon viel zu kurz? Darüber diskutieren sechs Schülerinnen und Schüler in der dritten Folge von Staffel 3 bei logo! no.front.

    Die Sommerferien: Das sind sechs kurze Wochen, um sich vom Schulstress zu erholen. Es können aber auch sechs lange Wochen Langeweile sein. In dieser Zeit wird vieles, was man so im Schuljahr gelernt hat, einfach vergessen.

    Nach den Ferien heißt es dann: von vorne anfangen und der Stress geht direkt wieder los. Die einen sagen deshalb: Lass die Sommerferien kürzen und stattdessen lieber mehr kürzere Ferien im Jahr haben! So gibt es mehr Pausen zur Erholung und nicht eine lange, in der man irgendwann nur noch rumhängt. Die anderen finden: Sechs Wochen braucht's mindestens, um runterzukommen. Außerdem ist es im Sommer eh so heiß, dass keiner in der Schule klar denken kann. Frei haben ist da die einzig sinnvolle Lösung.

    Kürzere Sommerferien - ja oder nein?! ...
