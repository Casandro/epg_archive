  title: Die Biene Maja
  subtitle: Maja und Willi im Trainingscamp
  description: |-
    Maja und Willi im Trainingscamp

    Richter Bienenwachs entdeckt im Nest der Blaumeise zwei Jungvögel. Er denkt weiter und stellt sich vor, wie die Kleinen groß werden und eine Gefahr für die Bienen im Bienenstock darstellen.

    Der Richter setzt bei der Königin durch, dass zwei Bienen in ein Trainingscamp der Ameisen kommen, damit sie spezielle Kampftechniken gegen die Vögel lernen. So geschieht es, dass Maja und Willi Rekruten bei den Ameisen werden. Doch leider nicht bei Oberst Paul.

    Er ist gerade auf einem Einsatz und kann die Ausbildung der beiden nicht übernehmen. Deshalb nehmen sich die Ameisen Emil und Egon der beiden Azubis an. Doch nicht umsonst sind die beiden Soldaten zweiter Klasse, denn ihre Ausbildung lässt zu wünschen übrig. Maja und Willi reicht es irgendwann, und sie ziehen los, um Oberst Paul und den Rest der Truppe zu suchen. Emil und Egon folgen ihnen. ...
