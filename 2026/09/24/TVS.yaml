- eventId: 955797
  start: 2026-09-24T00:35:00Z
  stop: 2026-09-24T01:30:00Z
  title: 'Emeryci na tropie: odc.43'
  subtitle: W policji brakuje personelu, dlatego byli komisarze Edwin i Günter zostają przywróceni do służby przez komendanta. Obaj cieszą się, że mogą uciec od emerytury i z zapałem zabierają się do pracy.
  description: |-
    Tytuł oryginalny: Rentnercops
    DE
    Reżyseria: Thomas Durchschlag
    Występują: Tilo Prückner, Katja Danowski, Wolfgang Winkler, Aaron Le, Verena Plangger, Michael Prelle
    "Emeryci na tropie" to niemiecki serial kryminalny (Rentnercops), który łączy lekki humor z zagadkami śledczymi. Akcja serialu toczy się w Kolonii, gdzie z powodu braków kadrowych szefowa lokalnego komisariatu prosi o pomoc dwóch emerytowanych detektywów wydziału zabójstw. Mimo że obaj mają już swoje lata i inną wizję pracy, decydują się wrócić do służby i wspólnie rozwiązywać sprawy kryminalne, często napotykając różnice pokoleniowe, śmieszne sytuacje i niekonwencjonalne metody pracy.
  ageRating: 12
- eventId: 955798
  start: 2026-09-24T01:30:00Z
  stop: 2026-09-24T02:30:00Z
  title: 'Wydział kryminalny Kitzbühel: odc.13'
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2019) odc.13, Ein neues Leben
    Występują: Jakob Seeböck, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Julia Cencig, Veronika Polly, Felix Kreutzer, Eva Maria Marold, Martin Niedermair, Simon Hatzl
    Zamordowana zostaje jedna z kursantek Pauline Meersburg, która prowadziła szkolenie dla kobiet chcących zdobyć majętnych mężczyzn. Lukas otrzymuje intratną propozycję pracy w Wiedniu. Musi dokonać trudnego wyboru, którego nie ułatwia mu Nina. Policjantka, ku swojemu zaskoczeniu, bardzo to przeżywa.
    Reżyser: Martin Kinkel
    Od lat: 12
