  title: Rosamunde Pilcher - Pewność serca 1 (odc. 50)
  subtitle: Po 33 latach Dorothy Mellows wraca z Kanady do Anglii i ponownie staje w progu posiadłości Billa Chapmana, którą niegdyś opuściła bez słowa wyjaśnienia. Powrót ożywia dawne wspomnienia.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Gewissheit des Herzens
    DE,AT, 2003
    Reżyseria: Dieter Kehler
    Występują: Nicole Heesters, Michael Degen, Johannes Brandrup, Sonsee Neu, Francis Fulton-Smith, Doris Kunstmann
    Ogłoszono gościa na wiejskiej posiadłości Billa Chapmana: Dorothy Mellows, kuzynka żony Billa, która zmarła w młodym wieku, wraca do swojej dawnej ojczyzny Anglii po 33 latach. W tym czasie opuściła majątek Billa bez wyjaśnienia, wyjechała do Kanady i została odnoszącą sukcesy handlarzem dzieł sztuki. Powrót Dorothy jest dla Billa zaskoczeniem. Pomimo wielu lat, podczas spotkania wyraźnie widać ekscytację i niepewność.
  ageRating: 12
  genre:
  - '22'
