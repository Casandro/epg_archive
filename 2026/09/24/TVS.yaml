    Pacjentka Lisy Maren Schumann ma zostać poddana procedurze zapłodnienia in vitro. Komórkę jajową chce oddać jej przyjaciółka Stefanie. Tymczasem Lisa mówi Michaelowi o swoim romansie z doktorem von Hatzfeldem. Prowadzi to do kryzysu w ich związku. Także między Christianem i Anną dochodzi do nieporozumień.
