    Martin ma okazję zobaczyć się z dawnymi przyjaciółmi, Heiko i Herminą, których dawno temu poznał w Nowym Jorku. Para w końcu wróciła do Niemiec. Hans i jego brat planują wyprawę na narty z przyjaciółmi. Wycieczka kończy się jednak tragicznie, ponieważ dwóch członków ekipy zostaje przysypanych przez lawinę śnieżną.
