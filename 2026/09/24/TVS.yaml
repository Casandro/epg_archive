  title: 'Doktor Kleist - lekarz rodzinny: odc.10'
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    serial obyczajowy (Niemcy, 2004) odc.10, Blind
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser, David Bode, Teresa Weissbach, Martin Goeres, Aline Hochscheid, Alexandra Scheidt
    Do Lisy zgłasza się kobieta z objawami menopauzy. Gdy dolegliwości pacjentki nasilają się, lekarka wraz z Christianem szuka przyczyn jej złego samopoczucia. Lekarka zmaga się też z osobistymi problemami. Postanawia zakończyć romans z doktorem von Hatzfeldem. Kleist natomiast nie radzi sobie z uzależnieniem od leków.
    Reżyser: Stefan Bühling
    Od lat: 12
  ageRating: 12
