  title: Rosamunde Pilcher - Pewność serca 1 (odc. 50)
  subtitle: Po 33 latach Dorothy Mellows wraca z Kanady do Anglii i ponownie staje w progu posiadłości Billa Chapmana, którą niegdyś opuściła bez słowa wyjaśnienia. Powrót ożywia dawne wspomnienia.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Gewissheit des Herzens
    DE,AT, 2003
    Reżyseria: Dieter Kehler
    Występują: Nicole Heesters, Michael Degen, Johannes Brandrup, Sonsee Neu, Francis Fulton-Smith, Doris Kunstmann
    Ogłoszono gościa na wiejskiej posiadłości Billa Chapmana: Dorothy Mellows, kuzynka żony Billa, która zmarła w młodym wieku, wraca do swojej dawnej ojczyzny Anglii po 33 latach. W tym czasie opuściła majątek Billa bez wyjaśnienia, wyjechała do Kanady i została odnoszącą sukcesy handlarzem dzieł sztuki. Powrót Dorothy jest dla Billa zaskoczeniem. Pomimo wielu lat, podczas spotkania wyraźnie widać ekscytację i niepewność.
  ageRating: 12
  genre:
  - '22'
- eventId: 955496
  start: 2026-09-24T19:50:00Z
  stop: 2026-09-24T21:35:00Z
  title: 'Rosamunde Pilcher: Płomień miłości 1 (odc. 49)'
  subtitle: Hanna i Peter od trzydziestu lat tworzą szczęśliwe małżeństwo, co pięć lat odnawiając przysięgę w gronie najbliższych. Na tegoroczną uroczystość nie chce jednak przyjechać Geraldine, siostra Hanny.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Flamme der Liebe
    DE, 2003
    Reżyseria: Michael Steinke
    Występują: Florentine Lahme, Angela Roy, Jens Knospe, Loni von Friedl, Gerhart Lippert, Simone Hanselmann
    Hanna i Peter są szczęśliwym małżeństwem już od trzydziestu lat. Co pięć lat, z potrzeby serca, odnawiają swoją przysięgę małżeńską i z tej okazji zapraszają do Castlewood rodzinę oraz przyjaciół. Jedynie Geraldine, najmłodsza siostra i jedyna krewna Hanny, stanowczo odmawia przyjazdu. Magnus, syn Hanny i Petera, robi wszystko, by nakłonić ciotkę do odwiedzin w Castlewood. Udaje mu się to dzięki drobnemu kłamstwu.
  ageRating: 12
  genre:
  - '22'
