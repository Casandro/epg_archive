  title: Na Východ!
  subtitle: Podcast Českého rozhlasu Plus zaměřený na postsovětský prostor
  description: Letos v říjnu uplyne 20 let od vraždy nejznámější ruské novinářky Anny Politkovské. Jak Ondřej Soukup, tak Josef Pazderka se s ní při své práci v Rusku a na severním Kavkaze setkávali. Jak na ni vzpomínají? A co její násilná smrt ukázala o měnícím se Rusku pod Vladimirem Putinem?
