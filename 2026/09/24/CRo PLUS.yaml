  title: Pro a proti
  description: Nedůvěra vládě? Opozice chce ještě do říjnových voleb vyvolat další hlasování sněmovny o vyslovení nedůvěry kabinetu Andreje Babiše. Argumentuje tím, že koalice neplní programové prohlášení ohledně zadlužování státu a že premiér Andrej Babiš nevyřešil střet zájmů. Je k takovému hlasování důvod? Nebo jde o politické divadlo před volbami vzhledem k tomu, že koalice má ve sněmovně pohodlnou většinu? Zeptáme se komentátorky deníku Fórum 24 Johany Šafrové a komentátora lidovek Martina Zvěřiny. Moderuje Lukáš Matoška.
