  start: 2026-09-24T18:00:00Z
  stop: 2026-09-24T19:00:00Z
  title: 'MDR Kultur Café: mit Rotraut Susanne Berner'
  description: |-
    Ihre Jahreszeiten-Bücher findet man in fast jeder Arztpraxis und in jedem Kinderzimmer. Rotraut Susanne Berner hat eine bunte Wimmelwelt voller Menschen und Tieren geschaffen, mit der Millionen von Kindern weltweit groß geworden sind. Obwohl sie es damit zu einer der bekanntesten Kinderbuch-Illustratorinnen Deutschlands gebracht und viele Preise erhalten hat, steht sie selbst selten im Rampenlicht. In mehr als 30 Sprachen wurden sie bereits übersetzt und millionenfach verkauft - die Jahreszeitenwimmelbücher - beginnend mit dem Winter-Wimmelbuch können Kinder durch die Jahreszeiten wimmeln und sogar eine Sommernacht in Wimmlingen erleben. Viele Details können entdeckt und zahlreiche Geschichten erzählt werden, damit helfen die Wimmelbücher beim Spracherwerb und schulen die Konzentration auf spielerische Weise.

    Redaktion für MDR KULTUR: Gabriele Bischoff
  subtitle: Eine Sendung von Katharina Lohmeyer/Bremen 2
