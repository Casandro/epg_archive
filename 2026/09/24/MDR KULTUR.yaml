  description: "* 06:40 Der Stichtag: 1826 Goethe erhält Schillers Schädel \nDass Dichter nicht nur Bücher sammeln, zeigt sich heute vor 200 Jahren: da bekommt Goethe den Schädel Schillers geschenkt und verwahrt ihn wohl in seiner Sammlung.\nVon Sven Hecker\n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
- eventId: 535820
  start: 2026-09-24T07:00:00Z
  stop: 2026-09-24T07:35:00Z
  title: Unser Haus mit Rutsche (Folge 14 von 15)
  subtitle: von Safia Al Bagdadi
  description: "Eine Paradiesvogelfamilie, das sind sie zu Anfang. Layla und ihr Bruder Nouri führen mit ihren Eltern Amir und Claire ein unbeschwertes Leben im Saarbrücken der 1980er Jahre. Es wird Arabisch gesprochen, Französisch und Deutsch und wenn das Geld fehlt - improvisiert. Die Geschwister wachsen zwischen verschiedenen Sprachen und Kulturen auf. Was die junge Layla, aus deren Sicht die Geschichte in weiten Teilen erzählt wird, noch nicht wirklich greifen kann: es gibt Spannungen zwischen dem Vater, \"Babe\", dem Überlebenskünstler aus Bagdad, und der bourgeoisen Schwiegerfamilie im Elsass. Außerdem ist die Situation in Babes irakischer Heimat alles andere als stabil. Als dann der zweite Golfkrieg ausbricht, wird der Vater ein anderer und die Familie gerät ins Wanken.\n\nDie Eindrücke der kleinen Layla alternieren mit der Perspektive der erwachsenen Erzählerin, die in Paris lebt und auf ihre Kindheit zurückblickt. Sie steckt in einer Lebenskrise und ruft sich Träume und traurige Momente in Erinnerung. Safia Al Bagdadi erzählt leicht und lakonisch, blickt mit viel Humor auf schwierige Zeiten und erschafft Szenen, die unter die Haut gehen. \n\nSafia Al Bagdadi, geboren 1979 in Saarbrücken, hat Schauspiel am Konservatorium der Stadt Wien und Kommunikationswissenschaft an der LMU München studiert. Unter dem Pseudonym Safia Monney hat sie die Romane \"Am Ende ist noch längst nicht Schluss\" (2016), \"Harte Zeiten für echte Kerle\" (2018) und \"Ich traf Gott und sie heißt Miranda\" (2021) im Rowohlt Verlag veröffentlicht. Sie lebt als Schriftstellerin und Schauspielerin in Paris. \"Unser Haus mit Rutsche\" ist im Hanser Verlag erschienen, das Hörbuch, gelesen von der Autorin, bei speak low in Kooperation mit HR, MDR NDR und SR entstanden.\n\nProduktion: speak low, SR/MDR/HR/NDR 2026\n\nMitwirkende: \nSafia Al Bagdadi"
