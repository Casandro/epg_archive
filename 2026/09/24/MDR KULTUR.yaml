  title: 'MDR KULTUR Spezial: KINO/FILM/TV/SERIE'
  description: |-
    Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen. Berichte über Filmprojekte und Filmfestivals.

    Themen der Sendung:

    * Knut Elstermann über...

    * Film der Woche: "Das geträumte Abenteuer"
    Das preisgekrönte europäische Drama der Regisseurin Valeska Grisebach verbindet Elemente von Noir, Western und Kriminalfilm und spielt im politisch wie sozial aufgeladenen Dreiländereck zwischen Bulgarien, Griechenland und der Türkei.

    * Die Comedyserie: "Brothers"
    Die Hauptdarsteller Matthew McConaughey und Woody Harrelson sind im wahren Leben enge Freunde. In der Serie zieht Woodys Familie auf Matthews Ranch in Texas ein. Ihre enge reale Freundschaft gerät ins Wanken, als ein Familiengeheimnis den Verdacht aufwirft, dass die beiden tatsächlich leibliche Brüder sein könnten.
