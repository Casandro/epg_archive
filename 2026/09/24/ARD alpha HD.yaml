  title: Willi wills wissen
  subtitle: Was geht auf der Alpe ab?
  description: Melkmaschinen gibt es auf der Ornach Alpe nicht, also Melkschemel umschnallen und ran an die Euter! Willi ist zu Gast bei Josef und Doris Schneider. Auf knapp 1400 Meter bewirtschaften sie einen Bauernhof auf Zeit - eine Alpe, wie man im Allgäu sagt. In anderen Regionen sagt man Alm. Über drei Monate kümmern sich die Schneiders um 40 Milchkühe. Nicht ihre eigenen, sondern Tiere von Bauernhöfen aus dem Tal. Die Bauern schicken sie auf die Alpe, um selbst weniger Arbeit zu haben. Und vor allem, damit die Kühe die ungefähr 100 verschiedenen Kräuter fressen, die auf den Bergwiesen wachsen.
