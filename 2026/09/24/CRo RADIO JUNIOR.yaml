  title: Čtení na pokračování
  description: 'Já to nechápu 3/7. "Já to nechápu," říká dvanáctiletá Tony a myslí tím doslova všechno: rodinu, kamarády a především LÁSKU. Ta je totiž často složitější než milion čtvrtletek z matematiky. Stačí ale kámoška na telefonu, pár trapných poznámek, potrhlé prase jménem Morfeus, a ten pravý je rázem na světě! Napsala: Hana Lehečková. Režie: Tereza Verecká. Natočeno v roce: 2020. Čtou: Veronika Lazorčáková, Tereza Dočkalová, Vojtěch Bartoš, Diana Toniková.'
