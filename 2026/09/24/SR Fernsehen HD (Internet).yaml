  title: Alles was recht ist - Väter, Töchter, Söhne
  subtitle: Fernsehfilm Deutschland 2011
  description: 'Zwei Väter kämpfen um ein Kind: Franz Bergen, Leiter eines Kirchenchors, will das Umgangsrecht mit dem kleinen Sohn des Kneipiers René Dörfler erstreiten. Zunächst räumt Richterin Lena Kalbach der Klage keine Chancen ein - bis sich herausstellt, dass Bergen als Samenspender der leibliche Vater des Kindes ist. Ein heikler Fall, für den Lena mit viel Fingerspitzengefühl eine Lösung finden muss. Aber auch persönlich ist sie vom Thema Vaterschaft betroffen: Ihre erwachsene Tochter Nike will endlich wissen, wer ihr Vater ist.'
