  description: Bei einer Flugschau für Modellflugzeuge fällt der Schirmherr der Veranstaltung, Anton Stark, plötzlich tot um. Der Spielzeughersteller war auf einen Herzschrittmacher angewiesen und Pathologin Dr. Anja Licht geht von Herzversagen aus. Doch Starks Witwe ist anderer Meinung. Sie ist felsenfest überzeugt, dass es sich um Mord handelt und die Rüstungsindustrie dahintersteckt. "Hubert und Staller" belächeln ihre Verschwörungstheorie. Glaubwürdig finden sie Marianne Stark, die meistens alkoholisiert ist, nicht. Doch dann stellt Dr. Licht fest, dass der Herzschrittmacher von Anton Stark manipuliert wurde.
