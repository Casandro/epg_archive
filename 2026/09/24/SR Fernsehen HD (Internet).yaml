  description: Peter und Regine lieben ihr japanisches Haus. Für sie ist es ein Lebensprojekt, das Kultur, Tradition und persönliche Geschichte verbindet. "Dieses Haus ist Ausdruck unseres Lebens zwischen zwei Kulturen - wir möchten es bewahren und weiterleben." Von den Tatami-Böden bis zu den Shoji-Schiebetüren erzählt jedes Detail seine eigene Geschichte und spiegelt ihre tiefe Leidenschaft für Japan wider.
