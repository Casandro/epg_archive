  description: 'Monika kennt keine Liebe. Ihre Mutter trinkt, schlägt und vernachlässigt sie. Einmal wird  sie sogar fremden Männern zum sexuellen Missbrauch überlassen. Als Erwachsene  sucht sie verzweifelt nach echter Liebe und Annahme. Nach außen ist sie jahrelang  stark und funktioniert - doch mit 27 bricht sie zusammen. Das Grauen ihrer  traumatischen Kindheit kommt mit Macht an die Oberfläche. Sie bekommt keine Luft  mehr und ruft immer wieder denselben Satz: "Ich will doch einfach nur geliebt werden."'
