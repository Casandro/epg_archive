  title: So schmeckt die Welt - So schmecken die Malediven
  description: 'Das Paradies auf Erden: die Malediven. Der Mittelpunkt der Erde umgeben von anderen traumhaften Inseln. Sehen und staunen Sie nicht nur über die Schönheit dieser Insel, sondern auch über die kulinarische Vielfalt der maledivischen Küche. Ausgezeichneter Rum, den man auch gerne mit anderen Gemschmackintensiven Mitteln, wie Minze oder Pfeffer zusammen genießt und den Rum noch intensiver und überraschend neu schmecken lässt. Natürlich kommt die Kokosnuss nicht zu kurz und ist präsent vertreten in der kulinarischen Küche. Ebenfalls präsent und wohl eher eine Nationalität, ist die maledivische Chili. In ihr schmeckt man das Feuer der Malediven und wird in den verschiedensten Gerichten verwendet. Weniger feurig und mehr entspannend, erholt man sich auch gerne mal im Wellness und Spa Center. Auch wird Yoga auf der Insel gerne praktiziert. Im Zusammenhang mit einer leichten und fettarmen Köstlichkeit, findet Yoga viele begeisterte Anhänger.'
  widescreen: true
