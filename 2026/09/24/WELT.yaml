  subtitle: Baumaschine auf vier Beinen - Schreitbagger im Einsatz
  description: Der Schreitbagger M 545 X der Schweizer Firma Menzi Muck ist ein Allrounder, der sogar in 2,50 Meter tiefem Wasser arbeiten kann. Er kann an steilen Hängen operieren, auf Schienen fahren und selbstständig auf LKWs klettern. Außerdem besitzt der allradgetriebene Bagger einen Teleskop-Arbeitsarm, der mit diversen Werkzeugen ausgestattet werden kann. Die Herstellung und spektakuläre Einsätze des Baggers werden in dieser Reportage dargestellt.
