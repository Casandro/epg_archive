  title: 'Mayday: Elf entscheidende Sekunden'
  subtitle: 'Mayday: Elf entscheidende Sekunden'
  description: 'Ein Routineanflug wird zur Katastrophe: Flug 676 gerät in ein tödliches Zusammenspiel aus Stress, Fehlentscheidungen und fehlender Kommunikation im Cockpit. Während ein aufziehendes Gewitter den Druck erhöht, verliert die Crew in entscheidenden Sekunden die Kontrolle über das Flugzeug. Ermittler aus aller Welt rekonstruieren akribisch die letzten Momente und stoßen auf eine fatale Kette menschlicher Fehler, die in nur elf Sekunden alles verändert.'
  widescreen: true
- eventId: 1140354
  start: 2026-09-24T18:53:00Z
  stop: 2026-09-24T19:38:00Z
  title: 'Mayday: Fatale Entscheidung'
  subtitle: 'Mayday: Fatale Entscheidung'
  description: 'Saudia Flight 163 gerät kurz nach dem Abheben in eine lebensbedrohliche Lage: Ein Feuer breitet sich unbemerkt im Inneren aus. Die Crew entscheidet sich zur Umkehr und landet die Maschine sicher. Doch wertvolle Minuten verstreichen, ohne dass die Passagiere das Flugzeug verlassen. Die Rekonstruktion zeigt, wie fehlende Dringlichkeit, technische Grenzen und folgenschwere Entscheidungen eine Katastrophe unausweichlich machen.'
  widescreen: true
- eventId: 1140355
  start: 2026-09-24T19:38:00Z
  stop: 2026-09-24T20:09:00Z
  title: 'Mayday: Unter Druck'
  subtitle: 'Mayday: Unter Druck'
  description: 'Im August 1985 zerschellte die Maschine des Japan-Airlines-Flugs 123 nach nur 32 Minuten Flugzeit an einem Berg. 520 Menschen sterben - es ist das schwerste Einzelunglück der Luftfahrtgeschichte. Eine Katastrophe, die selbst den Jumbo-Jet infrage stellt. Die Ermittlungen zeigen: Der Grund für diese Tragödie liegt nicht im Take-off, sondern beginnt sieben Jahre früher.'
  widescreen: true
- eventId: 1140356
  start: 2026-09-24T20:09:00Z
  stop: 2026-09-24T21:02:00Z
  title: Lost Places - Folge 119
  subtitle: Lost Places - Folge 119
  description: 'Ein Schiff trotzt den Wellen - und dem Gesetz. Jahrzehntelang funkt der legendäre Piratensender Radio Caroline von Bord der "Ross Revenge" gegen die musikalische Einfalt in Großbritannien an - bis zum brutalen Zugriff der Behörden. Außerdem: ein Luxushotel in Beirut wird zum Schlachtfeld, Stockwerk für Stockwerk, jahrelang. Dazu: Ein russisch-orthodoxes Freizeitdorf mit Zwiebelturmkirche, verlassen in der japanischen Pampa. Und ein arabischer Traum aus 1001 Nacht, der zum Albtraum wurde.'
  widescreen: true
- eventId: 1140357
  start: 2026-09-24T21:02:00Z
  stop: 2026-09-24T21:55:00Z
  title: Lost Places - Folge 120
  subtitle: Lost Places - Folge 120
  description: 'An den Stränden von Namibias Skelettküste sind verrostete Gerätschaften und bleiche Knochen die makabren Überbleibsel einer Industrie, die einst Licht in die Welt brachte - und dafür ganze Walbestände auslöschte. Zwischen Sand, Nebel und tödlicher Brandung wirken sie wie Mahnmale für unseren rücksichtslosen Umgang mit der Natur. Außerdem: Ein irisches Arbeitshaus, das zum Sinnbild der Großen Hungersnot wurde. Und: das magische Märchenland einer Hollywood-Kultikone im US-Bundesstaat Alabama.'
  widescreen: true
- eventId: 1140358
  start: 2026-09-24T21:55:00Z
  stop: 2026-09-24T22:47:00Z
  title: Lost Places - Folge 121
  subtitle: Lost Places - Folge 121
  description: 'Eine geheime Mission in der Wüste, ein legendärer Nazi-General und eine unterirdische Festung: In Tunesien gelingt es den Alliierten 1943, Rommels "unüberwindbare" Mareth-Linie zu umgehen - dank der Long Range Desert Group, einer Truppe von Abenteurern mit Wüsten-Know-how. Außerdem: Ein Prachtbau in Beirut wird zum Symbol einer Katastrophe. Ein Ballsaal in Alabama, der einst das Herz der schwarzen Bürgerrechtsbewegung war. Und: Griechenlands Elite-Schule mit Eton-Ambitionen und Alcatraz-Flair.'
  widescreen: true
- eventId: 1140359
  start: 2026-09-24T22:47:00Z
  stop: 2026-09-24T23:27:00Z
  title: Lost Places - Folge 122
  subtitle: Lost Places - Folge 122
  description: 'Fort Amador in Panama-Stadt ist lange Zeit eine beschauliche Wohnsiedlung für US-Armeeangehörige in der Kanalzone - bis CIA-Machenschaften, Drogenkartelle und ein wildgewordener Diktator das tropische Idyll in eine Kampfzone verwandeln. Außerdem: Die unglaubliche Geschichte der italienischen Unternehmerfamilie Olivetti, das beklemmende Vermächtnis des Mokotow-Gefängnisses in Warschau - und ein dem Kolosseum nachempfundenes Amphitheater in Tunesien, errichtet als Machtsymbol des Römischen Reichs.'
  widescreen: true
- eventId: 1140360
