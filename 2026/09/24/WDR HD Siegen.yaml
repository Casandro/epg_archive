  title: Garten & Lecker (5)
  subtitle: Garten-Dekotraum in Saarbrücken
  description: '"Deko-Queen" Alexandra Straßburger aus Saarbrücken lädt in ihren Garten. Auf 2000 Quadratmetern lebt die begeisterte Flohmarktbesucherin ihren Gartentraum. "Der Garten ist so vielfältig wie wir", sagt Alexandra und hat neun unterschiedlich gestaltete grüne Zimmer erschaffen - von der Wellness-Oase über einen streng geometrisch bepflanzten "Klostergarten" bis zum romantisch verspielten Rosengarten. Ihre Lieblingspflanzen sind Funkien (Hosta) von denen sie mehr als 100 Sorten kultiviert - einige in ausrangierten Backformen oder Suppenschüsseln.'
