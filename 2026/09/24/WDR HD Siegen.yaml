  description: "New York, 1997: Aus Manhattan wurde ein Hochsicherheitsgefängnis gemacht, in dem drei Millionen Insassen in einem Mikrokosmos leben. Die Insel ist durch eine Mauer und Sprengstoff vom Rest der Stadt abgeschottet. Ausschließlich Gefangene leben dort. \nAls der US-amerikanische Präsident Opfer eines Attentats wird, stürzt das Flugzeug, in dem er sitzt, mitten über Manhattan ab und er wird von den Gefangenen als Geisel genommen. \nSnake Plissken, ein Hochkrimineller, der nach Manhattan verlegt werden soll, wird beauftragt, den Präsidenten zu retten. Im Gegenzug wird Snake die Freiheit versprochen, doch ihm bleiben nur 24 Stunden Zeit."
