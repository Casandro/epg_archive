  title: Od Pradědu na Hanou
  description: Obec Křivá leží na jižních svazích Nízkého Jeseníku na klikaté silničce z Dlouhé Loučky do Tvrdkova. Stačí vyjít jen pár metrů nad vesnici a vidíte daleko do kraje od Mohelnice až po Svatý Hostýn. Hlavně v zimě sem není jednoduché vyjet, a tak vás na malou návštěvu této osady pozveme v další rozhlasové pohlednici. Připravuje Miroslav Kobza.
