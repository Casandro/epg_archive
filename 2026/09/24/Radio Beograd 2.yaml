  title: Hoću da znam
  subtitle: Emisija "Hoću da znam", posvećena je popularnoj nauci, koja će donositi pregled vesti i zanimljivosti iz sveta nauke, razgovore sa istraživačima i odgovore na pitanja slušalaca.
  description: 'Emisija "Hoću da znam", posvećena je popularnoj nauci, koja će donositi pregled vesti i zanimljivosti iz sveta nauke, razgovore sa istraživačima i odgovore na pitanja slušalaca. Razotkriva kako izgleda proces istraživačkog rada i deliti sa slušaocima uzbudljive priče o dolasku do novih otkrića. Posvetiće pažnju ulozi nauke u svakodnevnom životu - od senzora i pametnih uređaja u stanovima, preko molekularne gastronomije do prilagođavanja na klimatske promene. Slušaoci Radio Beograda 2 imaće priliku i sami da postave pitanja iz bilo koje oblasti popularne nauke, posredstvom mejl adrese: hocudaznam@rts.rs ili profila Radio Beograda 2 na tviteru, fejsbuku ili instagramu. Autor emisije "Hoću da znam" je Tomica Mišljenović.'
