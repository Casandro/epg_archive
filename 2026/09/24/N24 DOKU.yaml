  title: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  subtitle: Die Snackgiganten - Hinter den Kulissen der Süßwarenhersteller
  description: Der hohe Konsum von Naschzeug und Süßigkeiten in Deutschland hält die Produzenten auf Trab. In Viersen produziert der Konsumgigant Mars jeden Tag 10 Millionen Keks-Schoko-Riegel - und jeder davon muss absolut identisch aussehen und schmecken. In Erdmannhausen entstehen in der ersten Württembergischen Brezelfabrik Huober Snack-Brezeln. Und die Lübecker Marzipanmanufaktur Niederegger will mit traditionellen Produktionsverfahren das nach eigenen Angaben beste Marzipan der Welt produzieren.
  widescreen: true
- eventId: 1093835
  start: 2026-09-24T01:15:00Z
  stop: 2026-09-24T01:58:00Z
  title: 'Genuss-Welten: Tomaten - Vom Feld in die Fabrik'
  subtitle: 'Genuss-Welten: Tomaten - Vom Feld in die Fabrik'
  description: 'Sie ist rot, unscheinbar und weltweit ein Star: die Tomate. Doch ihr Weg vom vermeintlichen Giftapfel zum Herzstück unzähliger Gerichte ist eine erstaunliche Erfolgsgeschichte. Die Dokumentation blickt hinter die Kulissen einer milliardenschweren Branche, begleitet Erntehelfer, Familienunternehmen und Landwirte und zeigt, warum die Zukunft der Tomate längst auch vom Klimawandel abhängt.'
  widescreen: true
- eventId: 1093836
  start: 2026-09-24T01:58:00Z
  stop: 2026-09-24T02:43:00Z
  title: Die Küchenmacher - Von Maßarbeit bis Massenware
  subtitle: Die Küchenmacher - Von Maßarbeit bis Massenware
  description: 'Mittelpunkt jedes Eigenheims: die Küche. Kochen, Essen, Socializing - hier spielt sich das Familienleben ab. Die moderne Küche soll schick, modern und repräsentativ sein. Dabei sind die Grundzüge der verschiedenen im Handel erhältlichen Modelle gleichermaßen einander ähnlich wie simpel. Küchen werden nach einem Baukastenprinzip aus mehreren Schranktypen und E-Geräten zusammengestellt. Wie eins zum anderen findet - die Reportage begleitet Planung und Umsetzung unterschiedlicher Küchenkonzepte.'
  widescreen: true
- eventId: 1093837
  start: 2026-09-24T02:43:00Z
  stop: 2026-09-24T03:31:00Z
  title: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  subtitle: Die Havarie der Ever Given - Globale Lieferketten vor dem Kollaps
  description: Am 23. März 2021 bohrt sich eines der größten Containerschiffe der Welt ins sandige Ufer des Suezkanals. Fast eine Woche lang blockiert die Ever Given die vielbefahrene Handelsroute in Ägypten. Nie zuvor ist ein Frachter dieser Größe so auf Grund gelaufen, dass es zu einer vergleichbaren, globalen Lieferkrise gekommen gekommen wäre. War es eine Verkettung unglücklicher Umstände? Oder zeigt der Megastau auf See einen gefährlichen Schwachpunkt in der weltweiten Versorgungskette auf?
  widescreen: true
- eventId: 1093855
  start: 2026-09-24T03:31:00Z
  stop: 2026-09-24T04:15:00Z
  title: Baumaschine auf vier Beinen - Schreitbagger im Einsatz
  subtitle: Baumaschine auf vier Beinen - Schreitbagger im Einsatz
  description: Der Schreitbagger M 545 X der Schweizer Firma Menzi Muck ist ein Allrounder, der sogar in 2,50 Meter tiefem Wasser arbeiten kann. Er kann an steilen Hängen operieren, auf Schienen fahren und selbstständig auf LKWs klettern. Außerdem besitzt der allradgetriebene Bagger einen Teleskop-Arbeitsarm, der mit diversen Werkzeugen ausgestattet werden kann. Die Herstellung und spektakuläre Einsätze des Baggers werden in dieser Reportage dargestellt.
  widescreen: true
- eventId: 1093856
  start: 2026-09-24T04:15:00Z
  stop: 2026-09-24T05:08:00Z
  title: Der Mega-Kipper - 55 Tonnen auf einen Rutsch
  subtitle: Der Mega-Kipper - 55 Tonnen auf einen Rutsch
  description: Der Volvo A60 ist der größte knickgelenkte Muldenkipper der Welt. Er kann bis zu 55 Tonnen Material mühelos transportieren. Sein Gesamtgewicht beträgt bei voller Beladung fast 100 Tonnen. Gebaut wird der XXL-Dumper im südschwedischen Braås. Hier fertigen rund 550 Mitarbeiter sechs verschiedene Dumper-Modelle. Er ist das größte Fahrzeug, das in dem Werk gefertigt wird, und aufgrund ihres Gewichts können nur die wenigsten Teile ohne Kran verbaut werden.
  widescreen: true
- eventId: 1093857
  start: 2026-09-24T05:08:00Z
  stop: 2026-09-24T06:02:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 13'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 13'
  description: An der Grenze zwischen Texas und Mexiko prallen gegensätzliche Welten aufeinander. Grenzbeamte stehen vor der täglichen Aufgabe, Sicherheit und Menschlichkeit in Einklang zu bringen. In dieser Folge bittet eine von einer berüchtigten Gang aus Honduras vertriebene Familie um Asyl. Gleichzeitig decken Beamte einen großen Drogenschmuggel auf und stoßen bei einer Kontrolle auf ein perfides Schleusernetz, das von einer schwangeren Mutter angeführt wird.
  widescreen: true
