  subtitle: Das NIEDERBAYERN TV Deggendorf-Straubing Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYER..
  description: "Das Herz von Frauenau - Gistl-Anwesen vor seiner Wiedergeburt\nEin Gasthaus, ein legendärer Jugendstil-Saal und jede Menge Kulturgeschichte: Das Gistl-Anwesen in Frauenau war viele Generationen lang das schlagende Herz der Region. Doch der Zahn der Zeit hat gewaltig an dem historischen Denkmal genagt. Seit Monaten läuft hier nun eines der ambitioniertesten und teuersten Sanierungsprojekte im Bayerischen Wald.  \n\nJunge Medien für junge Menschen - Das Jugendmagazin \"Frei!stunde\"\nDonald Trump verbietet bestimmten Medien die Berichtertsattung aus dem Weißen Haus. Dabei ist eine freie Presse ein wichtiger Eckpfeiler einer gesunden Demokratie. Das gilt auch für junge Menschen. Kinder und Jugendliche haben ebenso wie Erwachsene einen Anspruch auf unabhängige und qualitativ hochwertige Berichterstattung. In der Attenkofer Akademie in Straubing wird dieses Kredo mit dem Jugendmagazin \"Frei!stunde\" umgesetzt. Das heißt: Junge Themen für ein junges Publikum. Warum das auch in Zeiten von vermeintlicher Lesefaulheit und digitalen Medien immer noch funktioniert, hat Anton Maurer in der Attenkofer Akademie herausgefunden.\n\nEnde der Freibad-Saison - Hunde-Schwimmtag in Viechtach\nViele Menschen gehen den ganzen Sommer über gerne ins Freibad. Hunde müssen draußen bleiben! Nicht so in Viechtach - zumindest am vergangenen Freitag. Denn dort hat man sich zum Ende der regulären Freibadsaison dazu entschieden, die Tore für Vierbeiner zu öffnen. Zumindest für einen Nachmittag. Und siehe da: Aus Nah und Fern kamen die Fellnasen und vergnügten sich im kühlen Nass. Bei den Hunden ist es wie bei den Menschen: Es gibt richtige Schwimm-Profis und eben auch Landratten. Alles eine Frage des Charakters."
