  title: Progetto Scienza 2022 Newton - p.21 - Sc
  subtitle: Progetto Scienza 2022 Newton - p.21 - Scrivere e leggere - Silvia Ferrara, filologa dell'Università di Bologna ci aiuta a scoprire com'è nata la scrittura e qual è lo stato dell'arte della nostra comprensi
  description: "one degli alfabeti del passato. A Firenze, presso il LABEC, il Laboratorio di tecniche nucleari per l'Ambiente e i Beni Culturali dell'Infn, la fisica Mariaelena Fedi e la conservation scientist Chiara Ruberto ci mostrano gli strumenti di ricerca più avanzati nel campo della fisica per studiare gli antichi manoscritti. Al Centro di Consulenza Tiflodidattica di Assisi e alla Fondazione Nazionale Prociechi di Roma, con la tiflologa Francesca Piccardi e il responsabile libri tattili della Federazione Nazionale ProCiechi Pietro Vecchiarelli, scopriamo come nascano e come vengano utilizzati i libri tattili, e cosa sia e come si impara il Braille. Davide Crepaldi, neuroscienziato della SISSA di Trieste, la Scuola Internazionale Superiore di Studi Avanzati, ci parla di quanti modi esistano per leggere e scrivere; mentre Silvia Di Vincenzo, docente di Storia della filosofia medievale alla Scuola IMT Alti Studi di Lucca, ci spiega cosa succeda ai manoscritti copiati a mano lungo i secoli, e Malvina Nissim, linguista computazionale all'Università di Groeningen nei Paesi Bassi, ci fa vedere come i computer possono imparare (se possono imparare) a leggere e scrivere come noi. - \n\nun programma di Davide Coero Borga, Diego Garbati, Pino Roggero, con la collaborazione di Maria Agostinelli, Silvia Bencivelli, Giuseppe Cembalo, Pierluigi Pantini, Alberto Polimanti, a cura di Eleonora Ottaviani, Caterina Mazzuoli, progetto a cura di Diego Garbati, regia Alberto Polimanti, conduce Davide Coero Borga"
