  title: Pinguini Una spia nel gruppo - Ep. 2
  subtitle: Telecamere segrete svelano un lato inedito del mondo dei pinguini. Osservati dalle telecamere spia, i pulcini si stanno schiudendo ovunque. Gli imperatori maschi formano una parata di identità prima di consegn
  description: 'are i loro neonati alle femmine di ritorno. Le madri si raggruppano per proteggere la loro prole da una tormenta di neve. Fuori, un piccolo pulcino non ce la fa e giace congelato dalla madre. La telecamera per pulcini filma i piccoli che camminano sui piedi delle loro madri e muovono i loro primi passi incerti. Le femmine senza piccoli cercano di rapire i nuovi arrivati e le procellarie giganti costringono i pulcini a raggrupparsi per proteggersi. Alle Falkland, i pulcini di salterella incontrano dei vicini indisciplinati: i cormorani reali. Gli avvoltoi predatori vengono allontanati da un esercito di pinguini. Gli uccelli caracara prendono una eggcam e filmano le riprese aeree della colonia! I genitori fanno una doccia di roccia e persino una "scalata del camino" per raggiungere la loro spa privata. I pulcini affrontano altri predatori e i genitori in lutto programmano un pisolino. In Perù, i pulcini di Humboldt emergono nel deserto. Gli adulti lasciano la loro tana ricoperta di fango e hanno bisogno di un bagno. Vengono raggiunti tra le onde da Humboltcam e da chiassose otarie. Soli a casa, i pulcini sparano proiettili di cacca ai gabbiani e la colonia affronta un''enorme invasione di cormorani. I pulcini stanno imparando a diventare pinguini adulti.'
