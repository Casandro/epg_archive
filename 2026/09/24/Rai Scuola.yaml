  title: Memex Nautilus - Polveri Sottili, killer
  subtitle: 'Memex Nautilus - Polveri Sottili, killer nell'' aria - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l''astrofisico e divulgatore Luca Perri andiamo alla scoperta '
  description: del mondo che ci circonda e delle sue regole. In questa puntata parliamo di Polveri Sottili. Il 'particolato' è un killer silenzioso e invisibile. In un anno uccide più delle sigarette o degli incidenti stradali. Si presenta sotto forma di una miscela di particelle solide e liquide disperse nell'atmosfera. Minore è la dimensione della particella, maggiore è la sua capacità di penetrazione nel sistema respiratorio. E allora che fare? Ne parliamo con Giorgio Cattani, responsabile sezione monitoraggio e qualità dell'aria dell'Ispra, e con Saverio De Vito, coordinatore scientifico del progetto Air-Heritage dell'Enea. Incontriamo anche Gian Paolo Gobbi e Francesca Barnaba, dell'Istituto di Scienze dell'Atmosfera e del Clima del Cnr, per raccontare la scienza del monitoraggio ambientale, e Marcello Vitale responsabile del laboratorio di modellistica ambientale dell'Università di Roma Sapienza, che ha da poco mappato il ruolo della vegetazione urbana nella cattura del PM10 in un quartiere di Roma. Anna Pancaldi ci racconta infine il grande smog di Londra del 1952 e la drammatica storia dell'Ilva Football Club. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Catia Barone, Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi
