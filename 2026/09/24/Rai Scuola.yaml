  title: Progetto Scienza Newton (p. 28) Il nostr
  subtitle: Progetto Scienza Newton (p. 28) Il nostro Cielo, la Troposfera - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita Giampietro C
  description: 'asasanta, ricercatore dell''Istituto di Scienze dell''Atmosfera e del Clima (ISAC-CNR) per scoprire cosa è e come funziona l''atmosfera terrestre. In particolare, di quella porzione con la quale la vita sulla Terra è costantemente a contatto: la cosiddetta Troposfera. Per studiarla e per analizzare tutti quei fenomeni che coinvolgono anche il nostro benessere e la nostra salute Casasanta è stato anche un anno in Antartide, il più grande laboratorio a cielo aperto al mondo. La ricercatrice Elisa Adirosi, dai laboratori del CNR-ISAC parla invece di precipitazioni: dall''analisi sulla singola goccia, agli eventi precipitativi catturati dal radar. Luca Perri smaschera infine le false credenze sui fulmini dal suo osservatorio sulle bufale. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga.'
