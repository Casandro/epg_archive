  title: Pinguini Una spia nel gruppo - Ep. 1
  subtitle: I pinguini come non li avete mai visti prima. Dal gelido Antartico ai roventi tropici, 50 telecamere spia catturano filmati unici di tre specie straordinarie. I pinguini imperatori attraversano un pericoloso m
  description: "are ghiacciato per raggiungere i loro luoghi di riproduzione e lungo il cammino uno si perde in una tormenta di neve. Una volta lì, le femmine volano con le pinne sopra i maschi e quelle che ci riescono camminano a passo di lumaca con i loro partner. Devono deporre le uova senza toccare il ghiaccio, ma sono i maschi ad affrontare la sfida più grande: svernare da soli nel posto più freddo della terra. I Rockhoppers sfidano i mari più tempestosi del mondo, solo per arrivare a riva e affrontare un assalto scoraggiante su una scogliera di 300 piedi, saltando per la maggior parte del percorso. Dopo aver deposto le uova, questi coraggiosi uccelli affrontano attacchi aerei da parte di stercorari e avvoltoi. Gli Humboldt sono degli strani pinguini tropicali che sono stati raramente filmati. Per raggiungere i loro nidi nel deserto devono superare 20.000 leoni marini predatori, schivare pipistrelli vampiri e combattere mezzo milione di uccelli marini dal becco affilato. Il duro lavoro di tutti i pinguini viene finalmente ricompensato quando i loro piccoli e vulnerabili pulcini cominciano a schiudersi. Tra le telecamere spia che catturano comportamenti unici c'è una novità tecnologica: pinguini robotici con telecamere al posto degli occhi. - \n\n"
