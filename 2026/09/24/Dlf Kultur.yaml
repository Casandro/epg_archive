    Wie wirkt Musik im Gehirn?
    Von Iris Proff

    Musik bewegt Menschen emotional. Aber warum ist das so? Die Gehirnforschung versucht, das mithilfe von etablierten Modellen des menschlichen Bewusstseins zu erklären. Und das könnte auch der Therapie von Parkinson oder Alzheimer dienen.
