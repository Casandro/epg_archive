- eventId: 1135748
  start: 2026-09-24T20:00:00Z
  stop: 2026-09-24T20:30:00Z
  title: Četba na pokračování
  description: 'Alena Mornštajnová: Čas vos (06/14). Bářin život se nevyvíjel podle jejích představ a směr, který nabral, si sama nevybrala. Minulost už se napravit nedá, staré křivdy stále bolí, ale je třeba bojovat, aby se člověk dobral spravedlnosti a nenechal si vše líbit. Ani s Ptáčníkem se život nemazlil, stal se z něho samotář a podivín, který miluje víc ptáky než lidi. Když se jejich osudy protnou, ani jeden z nich netuší, kolik toho mají ve skutečnosti společného a jak moc si můžou navzájem pomoci. Pro rozhlas připravila Anna Smrčková. Dramaturgie Marina Feltlová. Účinkují Andrea Elsnerová a Kamil Halbich. Režie Dimitrij Dudík. Premiéra'
- eventId: 1135749
  start: 2026-09-24T20:30:00Z
  stop: 2026-09-24T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Benedikt Renč, fotograf. V čem je rozdíl mezi tím, když fotí osoby neznámé a lidi, které zná? Proč se rozhodl vydat fotografickou knihu o Káhiře vlastním nákladem? A jak ho v dětství ovlivnilo prostředí umělecké rodiny? Moderuje Joachim Dvořák.'
