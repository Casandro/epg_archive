  title: Giftige Teppiche - Gefahr durch PFAS
  description: |-
    USA 2026
    Geruchlos, farblos, hochgiftig und langlebig: sogenannte PFAS-Chemikalien. Das Trinkwasser im US-Bundesstaat Georgia ist stark belastet - und hat viele Anwohner schwer krank gemacht.

    Über Jahrzehnte setzt die amerikanische Teppichindustrie PFAS in der Produktion von schmutzabweisenden Textilien ein. Die toxischen Stoffe, die auch "forever chemicals" genannt werden, gelangen in Flüsse, Böden und letztlich ins Trinkwasser Hunderttausender Menschen.
