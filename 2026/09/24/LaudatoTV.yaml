    Sveta Misa beatifikacije nadbiskupa Fultona J. Sheena: St. Louis, Missouri, SAD
    24. rujna, iz St. Louisa u Sjedinjenim Američkim Državama donosimo izravan prijenos svečane Mise beatifikacije nadbiskupa Fultona J. Sheena. Jedan od najpoznatijih katoličkih propovjednika 20. stoljeća, čovjek čiji su glas i poruke putem radija i televizije dopirali do milijuna ljudi diljem svijeta, bit će proglašen blaženim. Svečanu Misu u The Dome at America's Center predslavit će papin izaslanik, kardinal Luis Antonio Tagle. Doživimo zajedno ovaj veliki dan za Crkvu i sve štovatelje čovjeka koji je vjeru približio milijunima ljudi. Pratimo zajedno izravan prijenos beatifikacije nadbiskupa Fultona J. Sheena.
