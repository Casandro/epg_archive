  description: Godine 2002. Vatikan je proglasio svetim indiosa Juana Diega kojemu se u Meksiku prije 5 stoljeća ukazala Majka Božja. Taj čudesni događaj odlučno je utjecao na evangelizaciju Meksika i čitave Južne Amerike. Ovaj dokumentarac govori o tilmi Juana Diega na kojoj je čudesno nastao otisak slike Gospe, a radi se o aheropiti - slici koja nije načinjena ljudskom rukom. Film otkriva nevjerojatne i čudesne činjenice o slici, a sve je potkrijepljeno komentarima stručnjaka iz raznih područja. Otkriće Amerike značilo je potpuni preokret svjetovne povijesti Meksika i Amerike, a ukazanje Gospe na Tepeyacu 12. prosinca 1531. obilježilo je i drugačije usmjerilo njihovu religioznu povijest. Kolumbovo otkriće značilo je susret Amerike i Europe, a pojava Gospe Guadalupske susret s Bogom biblijske objave u kojem je Gospa odigrala presudnu ulogu.
