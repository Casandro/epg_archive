  title: Sprintour - Auf der Panamericana in Chile
  subtitle: Sprintour - Auf der Panamericana in Chile
  description: Wir haben unser Wohnmobil nach Südamerika verschifft um das Abenteuer Südamerika zu wagen. Vanlife haben wir bereits in Europa ausprobieren können. Unser großer Traum war allerdings Südamerika mit dem Camper kennen zu lernen. Die Länder hier, die Menschen und die Natur sind so spannend, dass wir mit unserem Camper Van viel zu entdecken haben. Das Wohnmobil Reisen gefällt uns hier sehr gut. Wir können wunderschöne Nationalparks besichtigen und mitten in wunderschöner Natur übernachten. Ein paar Allrad Passagen machen uns ab und zu Schwierigkeiten. Allerdings meistert unser VW Crafter Camper die herausfordernden Strecken sehr gut und wir können ohne weiteres unsere Panamericana Tour durch Chile fortfahren. Die Vulkane in Chile sind atemberaubend schön und prägen den Conguillio Nationalpark mit seiner Artenvielfalt und den dort vorkommenden Andentannen. Kommt mit uns mit und entdecke die wundervolle Natur in Südchile! CL 2023
