  stop: 2026-09-24T05:08:00Z
  title: Sprintour - Die härteste Straße in Chile
  subtitle: Sprintour - Die härteste Straße in Chile
  description: 'Unser kleines Vanlife Abenteuer in Chile ist ein Traum und ein Albtraum zugleich! Die Carretera Austral in Chile begeistert viele Offroadfahrer. Ob mit dem Camper, dem Motorrad oder sogar mit dem Fahrrad. Sie ist eine der Traumstraßen Patagoniens. Wir reisen bereits seit über 5 Monaten mit unserem Camper durch Südamerika und haben bislang hauptsächlich nur Wüsten gesehen. Die Carretera Austral führt durch das Land Chile und ist bekannt für ihre wunderschönen Aussichten, aber auch für die gefährlichen Straßen. Zum einen ist es die Straßenqualität und zum anderen sind es die engen Kurven, die einen manchmal verzweifeln lassen. Der ständige Regen macht alles nicht einfacher. So machen auch wir Bekanntschaft mit der wunderschönen, aber auch sehr gefährlichen Straße in Chile. Da wir mit dem Camper unterwegs sind, können wir uns ausgiebig Zeit lassen und nehmen den ein oder anderen schön gelegenen Stellplatz auf dem Weg mit. Und das muss man schon sagen: Das Vanlife in Chile ist ein Traum! CL 2023'
  ageRating: 12
- eventId: 1105566
  start: 2026-09-24T05:15:00Z
  stop: 2026-09-24T05:35:00Z
  title: Sprintour - Eine Reise durch Chile
  subtitle: Sprintour - Eine Reise durch Chile
  description: Es war keine einfache Zeit für uns in Südamerika. Vanlife in Argentinien war wunderschön, keine Frage. Allerdings mussten wir in den letzten fünf Monaten in Argentinien viel mitmachen. Deshalb sind wir jetzt überglücklich, dass wir die Stadt Bariloche mit unserem Camper verlassen können und endlich ohne weitere Vorkommnisse weiterreisen können. Für uns geht es mit dem Wohnmobil nach Chile. Wir haben das Vanlife in Chile sehr vermisst. Das Land Chile ist vor allem im Süden sehr grün. Dort gibt es noch kalte Regenwälder mit unglaublich schöner Natur. Das Wildstehen ist dort auch gar kein Problem. Ein Stellplatz ist schöner als der andere. Und die Straßenqualität ist einfach nur gut. Deshalb freuen wir uns sehr auf das beginnende Abenteuer Chile und vor allem auf die zahlreichen Vanlife Abenteuer in Südamerika. CL 2023
  ageRating: 12
