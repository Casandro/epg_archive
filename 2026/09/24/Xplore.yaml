  title: VIP Trip - Prominente auf Reisen 3 - Jamaika mit Wolke Hegenbarth
  subtitle: VIP Trip - Prominente auf Reisen 3 - Jamaika mit Wolke Hegenbarth
  description: 'Begleiten Sie die bekannte Schauspielerin Wolke Hegenbarth auf die karibische Insel Jamaika. Die Reise beginnt an der Nordküste, in der Stadt Falmouth. Bis 1838 lebte Falmouth vom Handel mit Zuckerrohr und Sklaven aus Afrika. Auf den bunten Märkten und in den Straßen ist das afrikanische Erbe und die Lebensfreude der heutigen Bewohner allgegenwärtig. Ob jamaikanischer Apfel oder frische Kokosmilch: An den exotischen Früchten kann die Schauspielerin nicht einfach vorbeigehen, sie muss sie verkosten. In Rose Hall Great House gelangt sie an einen Ort, an dem sie  mehr über das unsägliche Leid der Sklaven während der britischen Kolonialherrschaft erfährt. Damals gehörte das Anwesen dem Zuckerrohr-Baron John Palmer, der auf seinen Plantagen mehr als 2000 Sklaven hielt. Das heutige Museum veranschaulicht diese düstere Zeit. Wenig später erkundet Wolke Hegenbarth auf dem Pferderücken die Mangrovenküste und Teile der immergrünen Berglandschaft im Landesinneren. Auf einer Fahrradtour im ''Blue Mountains''-Nationalpark und abseits der Touristenpfade entdeckt die Schauspielerin einen traumhaft gelegenen Wasserfall. Hier  genehmigt sie sich eine kleine Pause und ein ausgiebiges Bad im glasklaren Wasser. Im weiteren Verlauf ihrer Reise geht die Schauspielerin einem interessanten Thema nach: Denn im renommierten Hotel Jamaica Inn bewegt sie sich bereits auf den Spuren früherer VIPs. In den 50er Jahren war das Hotel bereits der Rückzugsort für Hollywood-Stars wie Marilyn Monroe, Errol Flynn und Katherine Hepburn. Auch Winston Churchill verbrachte hier entspannte Tage. Übrigens auch Ian Fleming. An der Bar des Jamaica Inn saß der geistige Vater des Super-Agenten James Bond recht häufig und und erfand dabei den echten ''Wodka Martini''. ''Geschüttelt, nicht gerührt!'' DE 2017'
  ageRating: 6
- eventId: 1105584
  start: 2026-09-24T09:30:00Z
  stop: 2026-09-24T09:55:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Hongkong mit Anja Kruse
  subtitle: VIP Trip - Prominente auf Reisen 2 - Hongkong mit Anja Kruse
  description: 'Hongkong, eine Stadt voller Gegensätze, geprägt durch das Wechselspiel von westlichen und asiatischen Einflüssen. Die als Tor nach China bekannte Millionenmetropole mit ihrer atemberaubenden Skyline hat sich in den vergangenen Dekaden zu einem wahren Kultur- und Shopping-Mekka gemausert. Die beliebte Schauspielerin Anja Kruse hat sich Hongkong unter diesen Gesichtspunkten genauer angesehen. So führt sie ihr erster Stopp in eine der modernsten Shopping Malls im Zentrum Hongkongs. Diese lässt wahrlich keine Wünsche offen und bietet alles, was das Herz begehrt. Kein Wunder: Hier sind alle Top-Marken und Labels der Welt vertreten und bieten günstige Preise. Doch auch ein Blick abseits der modernen Boutiquen kann lohnenswert sein. So besuchen wir auch eine junge Modedesignerin.. Wer es lieber etwas einfacher und preiswerter mag, sollte einen der zahlreichen Straßenmärkte Hongkongs besuchen, in denen es zwischen vielem Krimskrams auch noch kleine, echte Schätze zu entdecken gibt. Schließlich landet Anja Kruse bei ihrem Streifzug im Laden eines chinesischen Künstlers und lernt dabei gleich noch etwas über die traditionelle chinesische Malerei, die seit mehr als 3500 Jahren durch ihre Präzision beeindruckt. Dass in Hongkong Tradition und Moderne oft unmittelbar nebeneinander liegen können, das lässt sich beim Wong Tai Sin Tempel erkennen. Dieser Tempel, umringt von Wolkenkratzern, ist nicht nur ein Stück altes, beschauliches China, sondern er zeigt auch den unglaublichen Wandel, den Hongkong in seiner Kultur  und im Lebensstil vollzogen hat... was sich schließlich auch beim Karneval deutlich wird. DE 2005'
  ageRating: 6
- eventId: 1105592
  start: 2026-09-24T10:00:00Z
  stop: 2026-09-24T10:20:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Südtirol mit Mirko Reeh
  subtitle: VIP Trip - Prominente auf Reisen 3 - Südtirol mit Mirko Reeh
  description: 'Mirko Reeh begibt sich auf eine kulinarische Reise in die nördlichste Provinz Italiens, Südtirol. Der beliebte Fernsehkoch startet in Bozen und merkt sehr bald, wie stark die mediterrane Lebensart die Kulinarik in der alpinen Region beeinflusst. Bei einem prämierten Gelatiere in der Stadt und beim Kochen in der Sofie Hütte auf der 2450 Meter hohen Seceda-Alm testet er die Besonderheiten der Südtiroler Küche, zum Beispiel den Tiroler Schlutzkrapfen. Im  Archäologiemuseum begutachtet der Starkoch die Überreste des wohl berühmtesten Südtirolers, Ötzi. Über 5000 Jahre lang hatte der ''Gletschermann'' im Eis gelegen und bis heute wird über die Umstände seines Todes gerätselt. Hier weitere Stationen auf Mirkos Reise: Im mächtigsten Burgenbau Südtirols, dem Schloss Sigmundskron, trifft Mirko Reh einen der wohl berühmtesten Bergsteiger unserer Zeit, Reinhold Messner. Dieser nutzt das imposante Schloss, um interessierten Besuchern die Auseinandersetzung zwischen Berg und Mensch näherzubringen. Im ''Messner Mountain Museum'' erzählt der frühere Extrembergsteiger von seiner Vision und dem dringenden Bedarf einer nachhaltigen Entwicklung im Bergtourismus. Schließlich unternimmt auch Mirko Reeh eine Klettertour in den Südtiroler Bergen. Beim Aufstieg zu der kleinen Cirspitze in den Dolomiten kommt der gelernte Koch ganz schön ins Schwitzen. DE 2013'
  ageRating: 6
- eventId: 1105593
