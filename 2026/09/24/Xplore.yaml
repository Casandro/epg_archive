  title: Die Küsten der Ostsee - Baltikum
  subtitle: Die Küsten der Ostsee - Baltikum
  description: 'In Estland startet die Reise in Tallinn. Von hier aus geht es zu zwei außergewöhnlichen Inseln, die unterschiedlicher nicht sein könnten. Auf Saaremaa werden Luxus-Yachten für den europäischen Markt gebaut, während auf Kihnu die Zeit stehen geblieben zu sein scheint. Hier leben Frauen, die ihre eigene Sprache, ihre eigenen Trachten und ihre ganz eigenen Transportmittel haben: alte Motorräder, M72, aus Sowjetzeiten. Aivar Ruukel wohnt im Soomaa Nationalpark, einer einzigartigen Wasserwelt, die er am liebsten mit seinem selbst gebauten Einbaum erkundet. Kurz hinter der Grenze nach Lettland fängt ein Fischer eine Delikatesse: Neunaugen, aalartige Wirbeltiere, die selten geworden sind in Europa. Im Hafen von Riga bildet die Seefahrts-Akademie die Schlepper für die großen Fähren aus Skandinavien aus. In Litauen werden Auerochsen eingefangen. Das Projekt rettet die Tiere vor dem Aussterben und erforscht die besten Aufzuchtmethoden. Die Reise endet auf der Kurischen Nehrung, einer zwei Kilometer langen Wanderdüne, auf der die Grenze zum russischen Kaliningrad verläuft. Eine junge Grenzerin kontrolliert das weitläufige Gebiet mit dem Quad und soll mit ihren Kollegen den Schmuggel nach Europa verhindern. DE 2011'
