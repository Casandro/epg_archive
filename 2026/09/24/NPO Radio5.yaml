  title: De Avondstart
  subtitle: Elke werkdag neemt De Avondstart aan het begin van je avond mee op een muzikale reis, grasduint door legendarische archieven en duikt iedere week in de muziek en de verhalen van een Avondster.
  description: 'Jouw avond start met Simone Walraven. Van maandag tot en met donderdag neemt Simone je in De Avondstart aan het begin van je avond mee op een muzikale reis. Ze grasduint door de archieven van het legendarische Countdown en duikt iedere week in de muziek en de verhalen van de Countdown Artiest van de Week. Van soul en pop tot country en funk: Laat je muzikaal verrassen en meevoeren naar toen, vertel welke plaat jíj vroeger hebt grijsgedraaid of speel mee met de Notenkraker! Want je avond begint pas écht met heel veel lekkere muziek! Maandag-vrijdag 18:00 - 20:00 bij MAX op NPO Radio 5. (2026)'
