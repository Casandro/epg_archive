  title: Poslovia svetla (8)
  subtitle: Príbeh sv. Patrika. Mladý Patrik, ktorý je ďaleko od domova a vydaný napospas pirátom, ktorí ho uniesli, trávi dni pastvou oviec a bojom s divými zvieratami. Až kým nezavolá Boha svojej mladosti.
  description: 'Mladý Patrik, ktorý je ďaleko od domova a vydaný napospas pirátom, ktorí ho uniesli, trávi dni pastvou oviec a bojom s divými zvieratami. Až kým nezavolá Boha svojej mladosti. Dlhé dni strávené túžbou po domove sa stávajú dlhými dňami rozhovorov s Ježišom. Po šiestich rokoch otroctva Patrik počuje Ducha Svätého, ktorý ho nabáda, aby sa odvážne pokúsil o útek z írskeho kmeňa a od druidského kňaza, ktorý ovláda ich cesty. Po návrate domov sa Patrik stáva kňazom a neskôr biskupom, ale čoskoro urobí ohromujúce vyhlásenie: Vráti sa k svojim únoscom ako misionár! Zistite, prečo sa mužovi známemu ako svätý Patrik pripisuje zásluha za prinesenie evanjelia do Írska v tejto akčnej epizóde poslovia svetla. Réžia: Robert Fernandez. Účinkujú: Max Marshall (Mladý svatý Patrik), David Thorpe (2020)'
