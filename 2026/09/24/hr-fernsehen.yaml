  description: "Im Opel-Zoo in Kronberg ist Naseputzen angesagt. Das Näschen gehört Marabu Bubu, und das Putzen ist schon etwas anderes, als sich mal kurz zu schnäuzen. Zum Glück kennen sich Pflegerin Ronja Kupzog und Bubu schon lange. Doch Bubus Mitbewohner Marabu Uwe ist alles andere als glücklich über den Menschenbesuch. \nWer hätte gedacht, dass Ameisenbären so niedlich sein können? Sechs Wochen ist das kleine Tamandua-Baby jetzt alt und den Pflegern und der Tierärztin schmilzt das Herz, wenn sie das Kleine versorgen. Einen Namen hat es noch nicht, denn noch weiß keiner, ob es ein Mädchen oder ein Junge ist."
