  title: Drei Schwedinnen in Oberbayern
  subtitle: Erotikfilm, Deutschland 1977
  description: 'Darsteller: Alexander Grill, Beate Hasenau, Uschi Russegger. In einem malerischen Alpendorf betreibt Otto mit seiner Frau Olga ein Hotel und kümmert sich intensiv um den Fremdenverkehr. Doch eines Tages werden ihm die Kredite gekündigt, die er vor seiner Frau verheimlicht hat. Zusammen mit seinem Freudn Alois versucht er, in Schweden den Geldgeber von seiner Kompetenz zu überzeugen. Ganz nebenbei erlebt er so manches Abenteuer mit drei kessen Schwedinnen.'
