  title: Planet Weltweit - Fremdenlegion, die Hölle im Regenwald
  subtitle: Planet Weltweit - Fremdenlegion, die Hölle im Regenwald
  description: 'Französisch-Guyana ist Europas Außenposten in Südamerika. Das Land zwischen Brasilien und Surinam gehört seit 1946 als Übersee-Département zu Frankreich und ist fast so groß wie Portugal. Mehr als 90 Prozent der Fläche sind von tropischem Regenwald bedeckt. Bei 30 Grad im Schatten und 90 Prozent Luftfeuchtigkeit werden hier jedes Jahr fast 2000 Soldaten gedrillt, davon rund 800 Französische Fremdenlegionäre aus aller Welt. Die meisten davon suchen bei der Legion den Absprung aus ihrem alten Leben. In ihrer neuen Heimat lautet die Devise: Abhärtung bis zur totalen Erschöpfung. Die Französische Fremdenlegion, 1831 gegründet, war schon immer ein Auffangbecken für Menschen, die ihre Heimat verlassen wollten oder mussten. Zahlreiche Berühmtheiten kämpften in der berüchtigten Legion: darunter der amerikanische Jazzsänger Cole Porter, der umstrittene deutsche Schriftsteller Ernst Jünger oder ein Nachfahre Napoleons, Prince Louis Bonaparte. Im ersten Weltkrieg kämpften 44.000 Legionäre aus 100 Nationen gemeinsam, allein im Zweiten Weltkrieg starben mehr als 9.000 Männer dieser Einheit. Ende der 1960er Jahre stationierte die französische Regierung zur Sicherung des Weltraumbahnhofs in Kourou die ersten Fremdenlegionäre in Französisch-Guyana. Seit den 1980er Jahren unterhält die Legion nahe dem Dorf Régina ein Trainingszentrum, in dem Legionäre zum Regenwaldkämpfer ausgebildet werden. Der Kanadier Sebastien Terrot und der Russe Nikolay Potapov sind erst wenige Monate in der Truppe - für die beiden Junglegionäre ist der Einsatz im südamerikanischen Regenwald eine gewaltige Herausforderung. Zusammen mit 15 weiteren Legionären absolvieren sie einen Ausbildungskurs, der die Männer abhärten soll - physisch und psychisch. Ihr Ziel ist es, zwei Jahre lang für guten Sold an der grünen Grenze zwischen Brasilien und Französisch-Guyana eingesetzt zu werden. DE 2011'
