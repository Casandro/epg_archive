  title: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  subtitle: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  description: 'Die Strände der Kapverdischen Inseln zählen zu den wichtigsten Nistplätzen für Meeresschildkröten weltweit. Tausende Weibchen legen hier jedes Jahr ihre Eier ab, aus denen Millionen von Schildkrötenbabys schlüpfen. Brutale Wilderei gefährdet dieses Idyll. Zwei extra in der Schweiz ausgebildete Spürhunde sollen helfen, den Wilderern jetzt das Handwerk zu legen. GEO Reportage war bei der Ankunft der beiden Labradore Kelo und Karetta auf den Kapverden dabei. Die zweijährigen Hundegeschwister verdanken ihre Namen Kelo und Karetta den wissenschaftlichen Bezeichnungen der Unechten Karettschildkröte und der Grünen Meeresschildkröte Chelodina. Marlene Zähner hat sie in der Schweiz ausgebildet. Nun sollen sie auf den Kapverden Wilderer überführen. Ivan und Valdir, zwei Kapverdier und Mitglieder der Schutzorganisation "Turtle Foundation" werden sie übernehmen, die Befehle von Marlene erlernen und auf dem Archipel weiter mit ihnen arbeiten. Die Jagd Einheimischer auf die Schildkröte ist eine brutal: Um an das Fleisch zu kommen, schlitzen sie die Tiere bei lebendigem Leib auf. Seit ca. einem Jahr fliegt auch ein Drohnenteam der Organisation nachts die Niststrände mit Infrarotdrohnen ab, um die Wilderer in flagranti zu erwischen. Mit beeindruckendem Erfolg, die Fälle von Wilderei gingen massiv zurück. Doch fassen konnte man die Täter nicht. Das sollen nun die beiden Hunde übernehmen. Sie sollen die Täter am Geruch der am Strand zurückgelassenen Werkzeuge und Gegenstände überführen. Wie werden Kelo und Karetta die ersten Wochen auf den Kapverden meistern? Kommen sie mit ihren neuen Hundeführer klar und werden es in diesem Jahr genügend Babyschildkröten schaffen, das Meer zu erreichen? DE 2019'
- eventId: 1105574
  start: 2026-09-24T20:15:00Z
  stop: 2026-09-24T21:07:00Z
  title: Planet Weltweit - Die Herren des Lavendels
  subtitle: Planet Weltweit - Die Herren des Lavendels
  description: 'Es sind diese Landschaften, die Besucher seit jeher in ihren Bann ziehen. Postkarten-Motive, fast zu schön um wahr zu sein. Frankreichs berühmte Lavendel-Felder. Jahr für Jahr strömen Besucher hierher, angezogen von diesem besonderen Licht, diesem Blau und Lila. Eine Szenerie wie im Traum. Doch hinter der faszinierenden Kulisse ist längst nicht alles perfekt. Wie steht es in Wahrheit um den französischen Lavendel-Anbau? GEO Reportage war vor Ort. Michel Blanc ist einer der französischen Lavendel-Bauern. Mit seiner Familie bewirtschaftet er eine Fläche von rund 200 Hektar. Vor allem das Herrenhaus ihres Gutes atmet Geschichte. Es ist ursprünglich eine alte militärische Festung aus dem 13. Jahrhundert, eine Bastide, von der Familie 1838 erworben und in den 1960er Jahren renoviert. Danach schufen sie hier einen großen landwirtschaftlichen Betrieb; vor allem der Lavendel hat es den Blancs angetan. Immer wieder jedoch müssen sie sich auf neue Herausforderungen einstellen. Nachdem die traditionelle Schafzucht vor einigen Jahren aufgegeben wurde musste, weil Wölfe die Gegend als ihren Lebensraum zurück eroberten, richtet nun ein anderes, viel kleineres Tier immensen Schäden an. Klitzekleine Insektenschädlinge, so genannte Zikaden, übertragen Bakterien, die viele Lavendelpflanzen vernichten. Die Zikaden sind nur zwei Millimeter groß, mit dem bloßen Auge kaum zu erkennen, und doch so verheerend. Während die Bauern in Frankreich mit diesem kleinen Feind kämpfen, geht es mit dem Lavendelanbau in einem anderen Land steil bergauf: in Bulgarien. Hier werden inzwischen riesige Lavendelmengen angebaut, verarbeitet und vor allem in der Hauptstadt Sofia gehandelt. Droht dem französischen Lavendel etwa nun das Aus? DE 2019'
- eventId: 1105581
  start: 2026-09-24T21:15:00Z
  stop: 2026-09-24T22:07:00Z
  title: Planet Weltweit - Die größte Kupfermine der Welt
  subtitle: Planet Weltweit - Die größte Kupfermine der Welt
  description: "Dunkelgrau ist der Himmel über dem bergigen Gebiet der Atacamawüste im Norden Chiles. Eine riesige  Staubwolke liegt über Chuquicamata, der größten Kupfermine der Welt, 15.000 Bergarbeiter arbeiten  dort rund um die Uhr: Sie sprengen Felswände, transportieren tonnenweise Geröll mit gigantischen  Lkws und schmelzen Kupfer bei glühenden Temperaturen. Auf der ganzen Welt wird das Leichtmetall  immer begehrter, so dass sich das 120 km² große Abbaugebiet immer weiter ausbreitet. Alles muss  der Mine weichen, selbst die benachbarte Bergarbeiterstadt. Wo einst Leben blühte, verschütten nun  nach und nach riesige Schutthalden die Straßen und Häuser der ehemals 22.000 Einwohner großen  Stadt. Die Familie von Bergarbeiter Raul Alfaro ist eine von vielen, die ihr Heim verlassen  müssen.\n\nAus dem Bauch der Kupfermine ertönt ein lautes Gewitter: Maschinen hämmern, Felswände explodieren, donnernd wird das Gestein verladen. Die Bergarbeiter von Chuquicamata müssen sich diesem Lärm Tag  für Tag aussetzen. Raul Alfaro arbeitet seit 18 Jahren als Lkw-Fahrer in der Kupfermine. 3300 PS sind nötig, um sein Arbeitsgerät in Gang zu setzen. Über schmale Serpentinen transportiert er das  Gestein zu den Schmelzöfen, wo aus dem glühenden Erz reines Kupfer gewonnen wird. \nMit seiner Frau Victoria und drei Kindern lebt Raul in der Bergarbeiterstadt am Rande der  Kupfermine. Bis vor einiger Zeit fühlten sich hier alle wohl. \"Chuquicamata war wie eine große  Familie\", erinnert sich seine Frau Victoria. Der Minenbetreiber Codelco übernahm für die  Bergarbeiter und ihre Familien nicht nur die Mietkosten, sondern baute auch Schulen, Kindergärten  und Sportstätten. Doch mit dem chilenischen Staatskonzern kam nicht nur Segen sondern auch Fluch  über Chuquicamata. Die Gesundheit der Einwohner ist durch den giftigen Mineralienstaub, der  überall in der Luft liegt, gefährdet. Und da sich die Kupfermine immer weiter ausbreitet,  verlieren viele Menschen ihre langjährige Heimat. DE 2006"
  ageRating: 6
- eventId: 1105582
  start: 2026-09-24T22:15:00Z
  stop: 2026-09-24T23:07:00Z
  title: Planet Weltweit - Auf den Spuren der Wikinger
  subtitle: Planet Weltweit - Auf den Spuren der Wikinger
  description: |-
    Henryk Wolski ist begeisterter Seefahrer. Schon neun Mal ist er um den Erdball gesegelt. Zusammen  mit einer siebenköpfigen Mannschaft möchte er nun in die Vergangenheit reisen und eine alte  Wikingerroute neu erkunden. Ausgangspunkt der Expedition ist Polens Hafenstadt Danzig. Dort wird  die "Welet", der originalgetreue Nachbau eines Wikingerschiffs, ablegen und Kurs auf Odessa  nehmen. Insgesamt beträgt die Strecke zwischen Ostsee und Schwarzem Meer 2.500 Kilometer - eine  Strecke, für die die gefürchteten Seemänner aus dem Norden einst fast zwei Jahre brauchten. Wolski  hingegen will sein Ziel schon in drei Monaten erreichen.

    "Dass die Wikinger durch die Ozeane der Welt gesegelt sind, verdient Respekt." sagt Wolski. Aber  auch wie sie die Flüsse bezwangen, fasziniert ihn. Ihre Route zwischen Danzig und Odessa möchte er  unter möglichst ursprünglichen Bedingungen erkunden. Immer wieder muss die Mannschaft der "Welet"  ihre Muskelkraft einsetzen - jeden Tag wird mindestens fünf Stunden gerudert, allen Schwielen und  Blasen an den Händen zum Trotz. Beinahe täglich stößt die Mannschaft an ihre körperlichen Grenzen  - und auf Hindernisse. So setzt das Boot immer wieder auf flachem Grund auf. Gesprungene Planken  und gefährlich tief hängende Fährseile sind nur kleinere Probleme. Die erste große Herausforderung  wartet bereits an der Landesgrenze zur Ukraine: In Przemysl muss das Boot über Land auf den Fluss  Dnjestr übergesetzt werden. Statt nach Wikingerart Holzrollen und Zugvieh zu gebrauchen wird  hierfür allerdings ein Kran eingesetzt, der es vorsichtig aus dem Wasser hebt. Eine schwierige  Operation, da sich das Boot mit Wasser vollgesogen und enorm an Gewicht zugelegt hat. Doch damit  nicht genug - am Grenzübergang soll Wolski auch noch eine Kaution von mehreren tausend Dollar  hinterlegen, um einreisen zu dürfen. Kann er nicht zahlen, ist seine Reise hier zu Ende. DE 2007
  ageRating: 6
- eventId: 1105585
  start: 2026-09-24T23:15:00Z
  stop: 2026-09-25T00:07:00Z
  title: Planet Weltweit - Kenia - Das Dorf der Frauen
  subtitle: Planet Weltweit - Kenia - Das Dorf der Frauen
  description: 'Am Rande des Samburu-Nationalparks in Kenia liegt Umoja - auf den ersten Blick ein ganz normales Dorf in der afrikanischen Savanne: Einfache Lehmhütten auf trockener roter Erde, Kinder spielen, Ziegen meckern. Und doch ist hier alles anders: In Umoja leben ausschließlich Frauen! Seit 1990 finden sie hier Zuflucht vor Zwangsehe, Männergewalt oder Genitalverstümmelung. Gemeinsam haben sich die Frauen hier eine neue Existenz aufgebaut und übernehmen ganz selbstverständlich auch traditionell männliche Aufgaben wie Viehzucht oder Schlachten. Eine Provokation für die patriarchal geprägte Gesellschaft der Samburu! Naporas Geschichte ist beispielhaft für das Schicksal vieler Frauen im Umoja. Bei der Suche nach Feuerholz wurde sie von einem Fremden vergewaltigt. Als sie ihrem Ehemann davon erzählte, schlug und verjagte er sie. Verstoßen und gedemütigt fand sie schließlich in Umoja Zuflucht. Heute bietet ihr die Frauengemeinschaft Sicherheit, doch Naporas seelische wie körperliche Wunden heilen nur langsam. Umoja bedeutet "Einheit" auf Suaheli und das ist es auch, was die Frauen hier finden. Im Gemeinschaftshaus oder unter der großen Akazie im Zentrum des Dorfes kommen sie regelmäßig zusammen, um sich auszutauschen. Gemeinsam versuchen sie, das Schreckliche, was jede einzelne von ihnen erlebt hat, zu verarbeiten. "Wir wollen, miteinander Spaß haben, so vergessen wir den Ärger", sagt Rebecca Lolosoli, die Gründerin des Dorfes. "Keine Demütigung mehr für diese Frauen. Nur noch Respekt!" Niemals wieder sollen Frauen missachtet oder misshandelt werden - so ihre Forderung. Das Zusammenleben im Dorf verläuft nach selbst definierten Regeln: Sämtliche Güter werden geteilt. Außerdem besitzen die Frauen in Umoja Haus und Land, züchten Vieh und schlachten es auch selbst - alles Rechte und Aufgaben, die ihnen außerhalb der Grenzen ihres Dorfes verwehrt bleiben. DE 2007'
  ageRating: 6
