  description: Im Königreich Bhutan, mitten im Himalaya, gelten Kraniche als "Vögel des Glücks". Das Phobjikha-Tal, tief im Inneren des Landes, ist ihr Winterquartier. Seit Monaten war kein Ruf der Tiere zu hören. Der elfjährige Karma, der mit seiner Familie im Phobjikha-Tal lebt, wartet schon sehnsüchtig auf die Zugvögel. Er ist ein wahrer Kranich-Fan. Dann sind die beliebten Kraniche endlich da! Karma verbringt jede freie Minute mit dem Biologen Jigme und beobachtet die Tiere.  DE 2011
