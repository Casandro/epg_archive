  title: Planet Weltweit - SOS in den Rocky Mountains
  subtitle: Planet Weltweit - SOS in den Rocky Mountains
  description: "Wenn der Notruf eingeht, sitzen George Field und seine Männer nach wenigen Minuten im Hubschrauber. Die Bergretter in den kanadischen Rocky Mountains müssen Wunden versorgen, Schmerzen lindern und Menschen aus großer Gefahr befreien. Häufig blicken die Kollegen dabei auch dem Tod in die Augen. \n\nEin Wochenanfang im August. In den letzten Tagen ist in den Bergen der Kananaskis-Naturparks viel Regen gefallen. Doch jetzt herrscht wieder das spätsommerliche Wetter, das Tausende Menschen her lockt. Das bedeutet für die Bergretter aus Canmore wieder mehr Einsätze. Seit 1982 hat der Chef der Bergretter George Field sein dreiköpfiges Profiteam zum berühmtesten in den Rocky Mountains gemacht. Zusammen mit 25 Rangern kämpft es fast jeden Tag in den Bergen Kanadas um Menschenleben. George Field bekommt eben den ersten Funkspruch des Tages. Wenig später sitzen er und seine Kollegen Mike Koppang und Burke Duncan im Hubschrauber. Aus der Luft betrachten sie die Kette der vereisten Bergspitzen und die weitenläufigen grün bewaldeten Täler. Obwohl Georg diesen Blick schon Hunderte Male genießen durfte, gibt es für ihn nichts Schöneres als über das Bow Valley zu fliegen, über die smaragdgrünen Seen und schroffen Gipfel. Es ist zugleich die Ruhe vor dem Sturm. Denn sein Job erfordert höchste Konzentration und Flexibilität. Nach einer Rettung, die glücklich endet, folgt häufig gleich danach das pure Entsetzen: ein tödlicher Absturz bei einem Spaziergang in den Bergen oder ein vermisster Jungendlicher, vermutlich ertrunken. Mit viel Hubschraubergetöse erreichen sie schließlich ihr Zielgebiet. In einer Steilwand sehen sie Freizeitsportler, die Hilfezeichen geben. Gibt es Verletzte oder haben sich die Männer nur verirrt? Was wird die Retter erwarten? \n DE 2010"
