  title: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  subtitle: Planet Weltweit - Eishockey - Mädchentraum im Himalaya
  description: 'In der indischen Himalaja-Provinz Ladakh auf 3500 Metern Höhe wird seit Jahrzehnten Eishockey gespielt - vor allem von Männern aus der Armee, die die Grenzen zu China und Pakistan sichern. Seit einigen Jahren trainieren in dieser abgelegenen Bergregion auch immer mehr Frauen und Mädchen Eishockey. Mit Erfolg: Die 20-jährige Tsewang Chuskit ist eine der besten Spielerinnen in Ladakh.  Ladakh im Nordwesten Indiens ist ein Gebiet der Extreme. Auf einer Höhe zwischen 2500 und fast 7700 Metern herrscht monatelang klirrende Kälte, es gibt kaum Niederschläge. So ist Ladakh eine Gebirgswüste mit wenig Vegetation, aber strategisch wichtig durch die Lage an der Grenze zu Pakistan und China. Neue Entwicklungen oder gar moderne Umbrüche halten nur sehr zögerlich Einzug. Umso verwunderlicher, dass es seit einiger Zeit in Ladakh sogar Frauen- und Mädcheneishockey gibt. Diese Reportage hat das aussichtsreichste Frauenteam besucht, mitten im Himalaja. Übersetzt bedeutet Ladakh: Land der hohen Pässe. Direkt hinter der Hauptstadt Leh windet sich die Straße die Gebirgskette hoch bis auf 5600 Meter, und führt in ein Tal an der Grenze zu China. 20 Kilometer außerhalb der Stadt, am Ufer des Indus, liegt das Secmol-Internat, in dem Tsewang Chuskit lebt und lernt. SECMOL steht für: Students Educational and Cultural Movement of Ladakh - übersetzt: Studenten- und Schülerbewegung von Ladakh. Eine private Schulinitiative, die Kindern und Jugendlichen aus armen Dorffamilien den Zugang zu Bildung ermöglichen will. Eishockey ist wichtiger Teil des Erziehungsprogramms. Chuskit wohnt seit zwei Jahren hier und trainiert, wie die anderen Mädchen, jeden Morgen auf dem schuleigenen, selbst gebauten Eishockeyfeld. Von Mitte Dezember bis Ende Februar sind Schul- und Universitätsferien. Dann wird jeden Morgen und jeden Abend Eishockey trainiert und gespielt. Nach dem gewonnen Halbfinale bereitet sich das Team jetzt auf das kommende Endspiel vor. DE 2014'
