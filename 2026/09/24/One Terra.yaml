  title: Planet Weltweit - Hai-Alarm in Polynesien
  subtitle: Planet Weltweit - Hai-Alarm in Polynesien
  description: 'Haie - lautlose Jäger der Meere, von Menschen seit jeher gefürchtet. Doch die Realität sieht anders aus: Längst bedroht der Mensch das Überleben der Haie. Weil Haifischsuppe als Delikatesse in Asien gilt, müssen Millionen der Meerestiere ihre Flossen und damit ihr Leben lassen. Auch auf den Südsee-Inseln Französisch-Polynesiens steigen immer mehr Fischer in das lukrative Geschäft mit Haifischflossen ein. Mit fatalen Folgen für die unvergleichliche Unterwasserwelt. Rangiroa ist das größte Atoll Französisch-Polynesiens und das zweitgrößte der Welt: Traumstrände, tropische Natur und vor allem eine einzigartige Unterwasserwelt. Yves Lefèvre lebt seit 25 Jahren in diesem Paradies, betreibt einen Tauchclub und nimmt Fremde wie auch Einheimische mit auf seine Ausflüge hinab in die glasklaren, türkis schimmernden Tiefen der südpazifischen Inselwelt. Hier unten tummeln sich Schildkröten und Delfine; Mantarochen gleiten lautlos über die Korallen. Unzählige Haie kreisen im dunklen Blau. Doch die bisher kaum berührte Schönheit der Unterwasserwelt ist in Gefahr. Fischen ist auf Rangiroa zwar Tradition, doch Haie wurden bislang in Ruhe gelassen. Früher zollte man ihnen gar großen Respekt, da sie als Führer und Beschützer der Familien angesehen wurden. Seitdem jedoch der Handel mit ihren Flossen boomt, gehen auch polynesische Fischkutter im großen Stil auf Haijagd. Bis zu 100 Millionen Haie werden jährlich durch die industrielle Fischerei getötet, ein großer Teil davon vor der polynesischen Küste. Weil die Populationen in anderen Meeren wie dem nördlichen Atlantik bereits drastisch dezimiert wurden, sind die Gewässer um das Rangiroa-Atoll nun ein bevorzugtes Terrain für die Haijäger und ihre asiatischen Handelspartner. Bei lebendigem Leib werden den Haien die Flossen abgeschnitten. Das verstümmelte Tier wird anschließend zurück ins Meer zurückgeworfen, wo es kläglich verendet. DE 2007'
