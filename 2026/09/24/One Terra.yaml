  title: Planet Weltweit - Nepal - Die Krieger vom Dach der Welt
  subtitle: Planet Weltweit - Nepal - Die Krieger vom Dach der Welt
  description: 'Das Himalaja-Massiv von Nepal ist die Heimat der wohl gefürchtetsten Krieger der Welt: der Gurkhas. Ihr hartes Leben auf dem Dach der Welt macht sie zu zähen und mutigen Persönlichkeiten. Seit Generationen stehen sie im Dienst der britischen Armee. Für die heranwachsende Jugend aus den abgelegenen Bergdörfern ist ein Leben als Soldat auch heute noch ein heiß begehrtes Lebensziel. Der Sold auf europäischem Niveau ermöglicht es den Gurkhas, ihre Familien finanziell zu unterstützen und damit auch deren Ansehen zu erhöhen. Die Reportage begleitet einen so genannten Galla Wallah - einen Gurkha-Scout - auf seiner Suche nach neuen Gurkha-Kämpfern. Der pensionierte Ex-Gurkha ist mit der Auswahl der aussichtsreichsten Bewerber betraut. Sein Weg führt ihn in entlegene Bergdörfer, quer durch die atemberaubende Landschaft des Himalajas.  Der junge Santosh aus dem Bergdorf Tangting hat einen Traum: Er möchte als Gurkha in den Militärdienst der britischen Armee aufgenommen werden. Ein solcher Posten ist für die in Armut lebenden Nepalis in den entlegenen Provinzen wie ein Lottogewinn: Ca. 1.500 Euro Monatssold bedeuten hier ein sorgenfreies Leben für die ganze Familie. Außerdem huldigen Gurkhas mit ihrem Dienst an der Waffe auch ihren Ahnen. Die Krieger aus dem Himalaja sind gefürchtete Gegner und werden schon seit Generationen von der englischen Krone rekrutiert. Gurkhas in britischen Uniformen gewannen unter schweren Verlusten entscheidende Schlachten in beiden Weltkriegen und sind auch weiterhin für die Briten weltweit in vorderster Front im Einsatz. Um selbst Gurkha zu werden, muss Santosh mehrere Auswahlstufen durchlaufen. Die erste wird von einem Galla Wallah veranstaltet - einem Gurkha-Scout. In einem benachbarten Bergdorf müssen die Bewerber unter seinen Augen optimale körperliche Leistungen und beste Gesundheit vorweisen können. Nur dann geht es zur nächst höheren Auswahlstufe: nach Pokarah in das Camp der britischen Armee. DE 2008'
  ageRating: 6
- eventId: 1105552
  start: 2026-09-24T16:15:00Z
  stop: 2026-09-24T17:07:00Z
  title: Planet Weltweit - Johannesburg - Eine Stadt macht dicht
  subtitle: Planet Weltweit - Johannesburg - Eine Stadt macht dicht
  description: 'Wer es sich leisten kann, zieht sich hinter Mauern und Elektrozäune zurück: In Johannesburg hat die Angst vor Kriminalität in den letzten Jahren bizarre Formen angenommen und ein neues Stadtbild entstehen lassen - abgeschottete Hochsicherheitsburgen vornehmlich weißer Afrikaner existieren neben den Townships der Armen. "360° - Die GEO-Reportage" begleitet in der geteilten Stadt zwei Bewohner, die täglich von einer Seite auf die andere wechseln. Lil de Freitas lebt mit seiner Familie in Sandton, dem reichsten Stadtteil Johannesburgs. Seine Kinder haben das Grundstück noch nie allein verlassen, denn jeder Schritt nach draußen ist gefährlich. De Freitas Frau legt fast 400 km pro Woche mit dem Auto zurück, nur um die Kinder zur Schule zu fahren oder zum Spiel mit den Nachbarskindern. Lil de Freitas ist der einzige in der Familie, der regelmäßig die behütete Welt Sandtons verlässt. Er ist Manager eines Gemüsemarktes am Rande des ausschließlich von Schwarzen bewohnten Townships Alexandra. Jeden Morgen erreicht er sein Geschäft durch den bewachten Hintereingang. Seine Kundin Christinah Nkwe geht jeden Morgen den umgekehrten Weg: Die allein erziehende Mutter von sechs Kindern arbeitet - wie viele ihrer Nachbarinnen - als Putzfrau in den Villen der reichen Einwohner Sandtons. Sie ist eine von ca. 850.000 Bewohnern Alexandras, des ältesten Townships Johannesburgs. Auch hier herrscht Angst vor der allgegenwärtigen Kriminalität. Deshalb hat sich Christinah Nkwe jetzt einer Bürgerwehr angeschlossen, die versucht, das Chaos zwischen den Wellblechhütten zu bekämpfen. Christinah Nkwe weiß: "Solange Alexandra Hunger hat, kann Sandton nicht ruhig schlafen." Nur eine Schnellstraße trennt die beiden Stadtteile. Die Brücke, die über sie hinweg führt, überquert nur, wer es unbedingt muss - wie Lil de Freitas und Christinah Nkwe. DE 2004'
