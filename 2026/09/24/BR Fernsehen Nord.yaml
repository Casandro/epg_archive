  description: Jolle ist eine der spannendsten neuen Stimmen im deutschen Pop. Mit ihrer einzigartigen Mischung aus Melancholie, Stärke und einem Hauch Rebellion berührt die Hamburgerin Herz und Verstand gleichermaßen. Bei "PULS Startrampe" performt Jolle ihren gefeierten Song "Alle Märchen sind gelogen", der sich in kürzester Zeit zum Fanliebling entwickelt und ihr Cro als Feature-Gast eingebringt. Als besonderes Highlight präsentiert sie außerdem ein intimes Cover des Tokio-Hotel-Hits "Spring nicht". Jetzt reinschauen, zuhören und mitfühlen.
