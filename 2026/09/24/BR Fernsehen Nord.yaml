  description: '"Best of Night of the Proms 2025": Pop meets Classic - mit dabei: Soul Lady Joss Stone, 80er Legende Midge Ure, Singer Songwriter Michael Schulte, Powerstimme Vanessa Amorosi, die Pop Band Safri Duo und Rock-Gigant Alice Cooper. Im Zentrum steht traditionell das Antwerp Philharmonic Orchestra mit dem Chor Fine Fleur, geleitet von der brasilianischen Dirigentin Alexandra Arrieche. Joss Stone: Die britische Soul Sängerin mit der kraftvollen, warm-rauchigen Stimme gilt als eine der prägendsten Künstlerinnen ihrer Generation.'
