  start: 2026-09-24T09:04:00Z
  stop: 2026-09-24T09:35:00Z
  title: Host Dopoledního expresu
  description: 'Podzimní houbaření je v plném proudu. Radost z plných košíků hub a krásného pobytu v lese však může snadno překazit malý, ale nebezpečný parazit: klíště. Jak se před ním účinně chránit, na co si dát pozor při návratu domů a jaké jsou první příznaky obávané boreliózy či klíšťové encefalitidy? O tom všem si dnes budeme povídat s MUDr. Janou Pazderkovou z Infekčního oddělení Masarykovy nemocnice v Ústí nad Labem. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Lenka Šobová.'
