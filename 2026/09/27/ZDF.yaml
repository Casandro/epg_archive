  description: |-
    Belgien / Deutschland / Niederlande 2021
    Der Albtraum beginnt, als Polizeitaucherin Kiki im trüben Wasser eines Brüsseler Kanals eine einzelne menschliche Hand findet. Es existiert keine Leiche, und es gibt keine Zeugen.

    Der Fall wird immer rätselhafter, denn kurz darauf wird eine weitere Hand entdeckt. Verbirgt sich ein blutiges Ritual dahinter? Und wie sind Kikis verstorbene Eltern in das Verbrechen verstrickt? Kriminalkommissar Cafmeyer nimmt die Ermittlungen auf.
