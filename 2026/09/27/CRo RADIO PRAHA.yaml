  title: Až na dřeň
  description: Vystudovala pedagogiku i konzervatoř, etablovala se jako herečka, zpěvačka i autorka. Je maminkou dvou holčiček, chystá se na další sraz optimistů a také na premiéru prvního vlastního filmu Brigáda. Jak ji proměnilo mateřství a proč už se dnes nebojí odkrývat ve svých textech? I o tom promluví v pořadu Až na dřeň Olga Lounová. Moderuje Kateřina Kubalová
