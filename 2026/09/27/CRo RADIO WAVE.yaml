  description: Další Zlomové okamžiky nejen pro Generaci 11. září přináší nový díl Čelistí, který tentokrát zastihne Aleše, Vítka a Tomáka V srdci divočiny. Podobaly by se kariéry Aleše a Vítka ve vrcholovém sportu spíš Raygun nebo Mr. T? K jakému nápoji chová Tomák takřka Mateřský pud? Je pořád nejoblíbenějším programovacím jazykem Báry Basikové Basic? A když se dopouštíme něčeho zlého, odkud to přichází? Holubi / zlato / kuna. Moderují Aleš Stuchlý, Vít Schmarc a hosté. (repríza)
