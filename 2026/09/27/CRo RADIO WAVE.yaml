  description: Věrní posluchači Casablanky Tereza a Martin Kinclovi cestují do východní Asie, do střední Ameriky a k některým cestám je přímo inspiroval právě cestovatelský podcast Radia Wave. Martin má za sebou kapitánské zkoušky a přeplavbu z Grónska na Island a z Islandu na Azorské ostrovy. V nové epizodě vyprávějí Pavlovi Sladkému své nejsilnější zážitky ze světa. Moderuje Pavel Sladký.
