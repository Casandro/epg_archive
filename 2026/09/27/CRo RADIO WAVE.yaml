  description: Hergot! na neděli chystá rozhovor se středoškolským učitelem s více než dvacetiletou meditační praxí Františkem Tichým, kterému nedávno vyšla kniha Meditace je i legrace. V ní se snaží představit meditaci mladým lidem bez náboženského kontextu, s důrazem na odborné porozumění a osobní zkušenost. Moderují Petr Wagner, Dominik Čejka a Fatima Rahimi.
