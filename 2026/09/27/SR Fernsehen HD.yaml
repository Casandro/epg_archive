  title: Süßer September
  subtitle: Fernsehfilm Deutschland 2015
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Männer haben einen schweren Stand bei Rebecca, Paare sowieso. In einer Bar trifft sie auf den Seelenverwandten Bruno, der auch mit der Liebe abgeschlossen zu haben scheint. Rebecca und er werden Freunde. Im sicheren Glauben, jeweils nicht der Typ des anderen zu sein, philosophieren sie über die Liebe und die unzumutbaren Opfer, die eine Paarbeziehung fordert. Nur, können Männer und Frauen wirklich einfach Freunde sein? \nBevor sie die Frage abschließend klären können, mischt sich die Vergangenheit ein: Brunos Ex tritt wieder in sein Leben und Rebecca kommt mit ihrem \"besten Freund\" Johann zusammen. Aber irgendetwas stimmt nicht."
- eventId: 552427
