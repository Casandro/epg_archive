  title: Billy Kuckuck - Aber bitte mit Sahne!
  subtitle: Fernsehfilm Deutschland 2020
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Zum dritten Mal ist Aglaia Szyszkowitz als engagierte Mainzer Gerichtsvollzieherin Billy Kuckuck im Einsatz. Diesmal mit dem guten Vorsatz, ganz korrekt ihre Aufgaben zu erfüllen und sich nicht mehr ins Leben ihrer Klienten einzumischen. Und ihr neuer Schuldner macht es ihr leicht - er hat offenbar Waren im Internet bestellt und nie bezahlt. Ein klassischer Fall? Nur auf den ersten Blick, wie Billy Kuckuck bald feststellen muss.
