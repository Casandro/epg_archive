  description: Paul André ist Mitte 40, Single und genauso reich wie einsam. Letzteres will er nun ändern. Als er mitbekommt, dass Violette aufgrund akuter finanzieller Probleme droht, das Sorgerecht für ihre beiden Kinder zu verlieren, hat Paul André eine zündende Idee, um auch mal in den Genuss von Familienglück zu kommen. Er unterbreitet der alleinerziehenden Mutter ein Angebot, das sie nicht ablehnen kann.
