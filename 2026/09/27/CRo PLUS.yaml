  title: Leonardo Plus
  description: Přijdou velké povodně - a od expertů slyšíme, že je potřeba lépe zadržovat vodu v krajině. Nastane sucho - a odborníci znovu připomínají totéž - musíme se naučit lépe zadržovat vodu v krajině. Dva velmi odlišné projevy člověkem způsobené změny klimatu mají společné řešení. Proč vodu v krajině zadržet zatím moc neumíme. Co se v tomto směru v Česku děje? A jak by opravdu účinné zadržování vody v krajině mělo vlastně v praxi vypadat?
