  title: Za obzorem
  description: Co má společného Donald Trump, starý khmérský chrám a online kriminalita? To všechno se stalo součástí nejnovější kapitoly ve starém sporu mezi Kambodžou a Thajskem. Obě země se přou o přesný průběh společné hranice a tyto spory už několikrát přerostly v otevřený konflikt. Naposledy právě před rokem, kdy výbuch nášlapné miny odstartoval několikaměsíční střety. Boje definitivně ukončilo až třetí příměří na samotném konci loňského roku. Příčinu sporů se ale odstranit nepodařilo a konflikt se tak může snadno rozhořet znovu. Příčiny vzájemné řevnivosti hledá tento díl pořadu Za obzorem.
