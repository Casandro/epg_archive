  title: Vertikála
  description: Už před více než sto lety hlubinní psychologové Freud a Jung upozorňovali na procesy uvnitř člověka, kterých si lidé nejsou vědomi. I současná věda ví, že náš mozek zpracovává obrovské množství informací, aniž bychom si jich všimli. Jak v současnosti chápeme vědomí a nevědomí? Jakou roli hrají v našich životech? A má sebepoznávání limity? I na to se ptá debata Vertikály s psychoterapeutem Borisem Rafailovem a neurologem a neurovědcem Rastislavem Šumcem. Moderuje Karolina Antlová.
