  description: Kids Act a povinné ověřování věku s cílem ochránit děti a mladistvé v online světě podkopává podle organizace na ochranu digitálních lidských práv Electronic Frontier Foundation některé základní svobody. Jak nařízení, které je v průběhu projednávání, popisuje Evropská komise. Jak evropské nařízení ochrání děti v online světě? Jak bude fungovat rodičovská kontrola? A jak daleko je vývoj bezpečnostního zajištění ověřování věku v digitálních prostředích? Moderuje David Slížek.
