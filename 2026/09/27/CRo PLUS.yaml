  title: Hovory
  description: Hostem Hovorů je architekt Milan Kopeček. Letos v září se mu dostalo prestižního ocenění Architekt obci 2026, a to za práci mětského architekta v Libčicích nad Vltavou. Kolik odbornosti, a zkušeností potřebuje člověk, aby dokázal sladit často protichůdné zájmy obecních zastupitelů, developerů, občanů a třeba i památkářů? Kolik potřebuje rozvahy, trpělivosti, nadhledu a diplomatických schopností? Musí být vizionářem s výhledem do daleké budoucnosti a musí mít technické znalosti, aby mohl vědět, co je reálné a co ne. Práce architekta je zajímavá, tvůrčí a leckdy i dobrodružná činnost a Milan Kopeček o ní vypráví v Hovorech. Moderuje Eva Hůlková.
