  title: 'Opowieści obozowe: odc.1'
  subtitle: Film realizowany w pięciu obozach koncentracyjnych pokazuje nagrania więźniów, którzy przeżyli stworzone na terenach okupowanych hitlerowskie obozy zagłady.
  description: |-
    Tytuł oryginalny: Opowieści obozowe
    PL, 2022
    Reżyseria: Mirosław Basaj
    Film dokumentalny ukazujący życie i śmierć w obozach koncentracyjnych. Niepublikowane nagrania ludzi /więźniów/, którzy przeżyli hitlerowskie obozy, stworzone przez Niemców na terenach okupowanych. Film ukazuje zachowania osób oraz ich charaktery w zderzeniu z obozową rzeczywistością, dokonywanie wyborów, aby czasami zachować człowieczeństwo. Niekiedy wyborem było rzucenie się na druty kolczaste, aby decyzję o swoim życiu pozostawić sobie, a nie oprawcom.
  ageRating: 12
  genre:
  - '35'
