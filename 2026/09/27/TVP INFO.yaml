- eventId: 1050046
  start: 2026-09-27T03:43:00Z
  stop: 2026-09-27T03:58:00Z
  title: Rok w ogrodzie extra
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    Tym razem zaprosimy widzów do niezwykle kolorowego ogrodu pani Justyny, który znajduje się w Nowym Dworze, w Wielkopolsce i królują w nim róże. Rośnie tu blisko 1000 krzewów z różnorodnych grup, form i odmian. Pani Justyna zakochała się w tych roślinach i przekonuje, że wcale nie są chimeryczne. Ogród jest prowadzony ekologicznie, nie stosuje się tu chemii, a róże wyglądają fantastycznie. Drugie kwitnienie w tym roku jest chyba nawet ładniejsze niż to czerwcowe.
