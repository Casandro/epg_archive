- eventId: 650788
  start: 2026-09-27T15:35:00Z
  stop: 2026-09-27T16:00:00Z
  title: Einfach genial
  subtitle: Das Erfindermagazin
  subtitled: true
  description: |-
    Ein ganzes Haus aus Holz-Bausteinen bauen? Was erstmal wie ein Kinder-Traum klingt, soll nach Max Wörner. Gemeinsam mit Architekt Werner Grosse hat er ein modulares Holzbausystem entwickelt. Die einzelnen Holz-Bausteine, die sogenannten Bricks, werden wie herkömmliche Mauersteine übereinander gestapelt. Ein Stecksystem sichert die Stabilität: So wird ein Brick auf den anderen gesteckt und anschließend mit mehreren Holz-Dübeln fixiert. Künftig sollen so Gebäude jeder Größe entstehen können.
    Um Ressourcen zu schonen, will Max für seine Bausteine nur Schad- und Schwachholz verwenden - also Holz, das ansonsten verbrannt werden würde.
- eventId: 650789
  start: 2026-09-27T16:00:00Z
  stop: 2026-09-27T16:45:00Z
  title: 'Quarks: Die Zukunft der Kartoffel - Pommes-Boom oder Klimastress?'
  subtitle: 'Moderation: Ralph Caspers'
  subtitled: true
  description: 'In Deutschland wachsen die meisten Kartoffeln der EU, und seit dem 18. Jahrhundert gehört sie fest zu unserer Ernährung. Aber die Kartoffel gerät unter Druck. Unser Essverhalten verändert sich, hin zu Reis oder Pasta. Salz- oder Pellkartoffeln kommen dagegen immer seltener auf den Tisch, und es werden immer weniger Kartoffeln gekauft. Es sei denn sie sind verarbeitet: Pommes oder Chips boomen! Deshalb macht Quarks den Test: Wie gelingt die perfekte Pommes, ohne gefährliches Acrylamid und zu viel Fett.'
- eventId: 650790
  start: 2026-09-27T16:45:00Z
  stop: 2026-09-27T17:00:00Z
  title: Prisma
  description: 'Kopftuchverbot, Sterbehilfe, religiöse Symbole im Wahlkampf: Religion und Ethik spielen in der öffentlichen Diskussion immer wieder eine zentrale Rolle. "Prisma", das neue ORF-TV-Format informiert über aktuelle Geschehnisse im Zusammenhang von Gesellschaft und Wissenschaft. Die Sendung liefert Zusammenhänge, diskutiert verschiedene Standpunkte und analysiert religionspolitische und ethische Entwicklungen im In- und Ausland. Durch die Sendung führen Judith Fürst, Konstantin Obermayr und Sandra Szabo.'
- eventId: 650791
  start: 2026-09-27T17:00:00Z
  stop: 2026-09-27T17:30:00Z
  title: RESPEKT - Demokratische Grundwerte für alle!
  subtitle: Recht auf Wasser
  subtitled: true
  description: Hahn auf und wir haben Wasser. So viel wir nur wollen, in bester Qualität. Dafür sorgen Gesetze, ein hochentwickeltes Versorgungsnetz und strenge Kontrollen. Das Menschenrecht auf Wasser ist - zumindest in Deutschland - perfekt verwirklicht. So schien es jedenfalls lange. Nach mehreren Dürre-Sommern zeigt sich aber, dass die Trinkwasserversorgung auch hier gefährdet ist. Von der Klimakrise, aber auch von Industrieproduktion und Landwirtschaft, die einerseits zu viel Wasser brauchen und andererseits zu viele Schadstoffe ins Wasser abgeben.
