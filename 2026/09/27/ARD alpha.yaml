  title: Länder - Menschen - Abenteuer
  subtitle: Schlesiens Schätze - Zwischen Riesengebirge und Oderlauf
  subtitled: true
  description: Bali ist die Insel der Götter und Rituale. Galungan ist das bedeutendste religiöse Fest im 210 Tage umfassenden balinesischen Kalender. Dann wird der Sieg des Guten über das Böse gefeiert. In prächtigen Prozessionen ziehen die Menschen durch die Straßen, die traditionell von Penjors gesäumt sind, langen gebogenen Bambusstangen, an deren Ende Opfergaben hängen. Das Filmteam folgt Erna und ihrer typischen Großfamilie durch die farbenfrohen Feiertage.
- eventId: 650628
  start: 2026-09-27T08:30:00Z
  stop: 2026-09-27T09:15:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Im Herzen Balis - Tempel, Tropen, Traditionen
  subtitled: true
  description: "Bali ist bekannt für Traumstrände, doch das Herz der indonesischen Insel offenbart sich in ihrem grünen Inneren: tropischer Regenwald, imposante Tempelanlagen, Reisterrassen, eine einzigartige hinduistische Kultur und aktive Vulkane. Zusammen mit seinen freundlichen Einwohnerinnen und Einwohner eine Mischung mit ganz eigener Magie. \nBali ist die Insel der Götter und Rituale. Galungan ist das bedeutendste religiöse Fest im 210 Tage umfassenden balinesischen Kalender. Dann wird der Sieg des Guten über das Böse gefeiert."
- eventId: 650663
  start: 2026-09-27T09:15:00Z
  stop: 2026-09-27T10:00:00Z
  title: Wunderschön
  subtitle: Südtirol im Herbst
  subtitled: true
  description: 'Saftig grüne Almwiesen, blau glitzernde Seen, goldgelb leuchtende Bäume und die schiefergrauen Dolomiten mit schneeweißen Gipfeln: Im herbstlichen Südtirol genießt Tamina Kallert die farbenfrohe Natur, die ihr atemberaubende Panoramen beschert. Ihre Reise beginnt auf dem Kronplatz und endet in Meran, wo ihr Kaiserin Sisi auf Schritt und Tritt begegnet. Unterwegs lernt sie traditionsbewusste und fortschrittliche Südtiroler kennen: In St. Ulrich fährt sie mit einem Holzkünstler auf die Seiser Alm; im Gardatal wandert sie zusammen mit zwei Musikerinnen; im touristisch wenig erschlossenen Sarntal hilft sie bei der Latschenkiefer-Ernte.'
- eventId: 650664
  start: 2026-09-27T10:00:00Z
  stop: 2026-09-27T10:45:00Z
  title: Michael Martin - Mit der Kamera um die Welt (2/4)
  subtitle: Rift Valley und Arabische Halbinsel
  description: In der zweiten Folge seiner Dokumentarreihe "Mit der Kamera um die Welt" bereist Michael Martin das Rift Valley und die Arabische Halbinsel. Die Plattentektonik bringt nicht nur mächtige Gebirge hervor, sondern auch weltweit Grabenbrüche. Der über 6.000 Kilometer lange Ostafrikanische Grabenbruch oder Rift Valley prägt die Länder Äthiopien, Kenia und Tansania. Stationen auf Michael Martins Reise sind das einzigartige Geothermalgebiet Dallol, ein Dorf des Hamer-Volkes tief im Buschland, der Turkanasee, der als "Wiege der Menschheit" gilt, und der Vulkan Oldoniyo Lengai, der heilige Berg der Massai.
- eventId: 650665
  start: 2026-09-27T10:45:00Z
  stop: 2026-09-27T11:30:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: 'Mit dem Zug durch Neuseeland (1/2): Die Nordinsel - Das vulkanische Herz'
  subtitled: true
  description: Aotearoa, Land der langen weißen Wolke, so nannten die Maori ursprünglich Neuseeland. Mit dem himmlischen Schauspiel könnten die dampfenden Vulkane im Norden und schneebedeckten Gebirge im Süden gemeint sein. Durch diese ursprünglichen Landschaften fahren die neuseeländischen Züge. Eine Panoramareise ohne Pünktlichkeitsgarantie. Denn die Launen der Natur geben den Takt an.
- eventId: 650666
  start: 2026-09-27T11:30:00Z
  stop: 2026-09-27T12:00:00Z
  title: Eisenbahn-Romantik (1001)
  subtitle: Hakata Station - Highspeed, Luxus, Höflichkeit
  subtitled: true
  description: Die Millionenmetropole Hakata/Fukuoka auf Japans Südinsel Kyushu hat einen überaus spannenden Bahnverkehr. Neben Shinkansen-Hochgeschwindigkeitszügen verkehren die unterschiedlichsten Nahverkehrszüge und nicht zuletzt der Luxuszug "Seven Stars". Spitzenköche servieren im "Seven Stars" Köstlichkeiten Kyushus in einem Belle Époque-Ambiente - die schon legendäre Höflichkeit in Japan kann hier in Vollendung genossen werden. Hakata Station ist ein Ort, der die ganze Vielfalt von Japans Eisenbahn in sich vereint.
- eventId: 650720
  start: 2026-09-27T12:00:00Z
  stop: 2026-09-27T12:45:00Z
  title: Nordtour
  description: 'Landschaften und Sehnsuchtsorte, originelle Typen, Lifestyle, Kultur und kulinarische Köstlichkeiten: Mit der Nordtour entdecken Sie die schönen Seiten von Norddeutschland. Und das in ihrer ganzen Vielfalt in Niedersachsen, Schleswig-Holstein, Hamburg und Mecklenburg-Vorpommern. Das wöchentliche Magazin bietet einen unterhaltsamen Mix aus Service und Inspiration für die abwechslungsreiche Freizeitgestaltung. Nadja Babalola und Thilo Tautz moderieren die Sendung im wöchentlichen Wechsel.'
- eventId: 650721
  start: 2026-09-27T12:45:00Z
  stop: 2026-09-27T13:30:00Z
  title: In der steirischen Toskana
  subtitled: true
  description: Jedes Jahr im Herbst zieht die steirische Toskana die Menschen in ihren Bann - die steilen Hügel des Sausals, die prächtigen Farben, die neuen Weine der Saison, die Kastanien und der Sturm. Die Gegend an der Grenze zu Slowenien ist mit Sonnenstunden gesegnet wie nur wenige andere Flecken in Österreich. Zypressen gleich ragen Pappeln in die Höhe und verleihen dem Land das Flair der Toskana, wenn auch die meisten Bewohner der Region die Bezeichnung nicht lieben.
