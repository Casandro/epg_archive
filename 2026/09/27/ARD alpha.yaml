  subtitle: Moore - Zurück in die Zukunft
  subtitled: true
  description: Um die Klimaziele zu erreichen, müssten bis zum Jahr 2045 in Deutschland rund 50.000 Hektar Moore pro Jahr wiedervernässt werden. Eine Herausforderung, vor allem für Landwirte. Denn mit nassen Böden kommen die meisten Nutztiere nicht zurecht. Und auch Kartoffeln oder Getreide gedeihen nicht. Was also sollen die Landwirte dann anbauen?
