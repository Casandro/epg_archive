  title: Klassik am Odeonsplatz mit den Münchner Philharmonikern und Lahav Shani
  subtitle: 'Sergej Rachmaninow: Symphonische Tänze'
  genre:
  - '112'
  description: "Die Münchner Philharmoniker bei \"Klassik am Odeonsplatz\" 2025!\nRegelmäßig im Juli verwandelt sich der Münchner Odeonsplatz mit der historischen Feldherrnhalle sowie der Residenz zur einen und der Theatinerkirche zur anderen Seite in eine Konzertarena mit mehreren tausend Besuchern. \nDas Werk, eine hochvirtuose, äußerst vielfältige und farbige Komposition, ist der Höhe- und Schlusspunkt in Rachmaninows Schaffen. Die \"Symphonischen Tänze\" zeichnen mit hintergründigen Anspielungen Eckpunkte seines Leben nach, bis schließlich der letzte Satz die Sequenz \"Dies irae\" zitiert, ein wiederkehrendes Motiv in Rachmaninows Oeuvre."
