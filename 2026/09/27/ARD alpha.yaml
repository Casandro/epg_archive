- eventId: 650996
  start: 2026-09-27T00:05:00Z
  stop: 2026-09-27T00:20:00Z
  title: Die Tagesschau vor 20 Jahren
  description: Mit der Tagesschau vor 20 Jahren hat ARD-alpha eine "Daily", die in Fan-Kreisen längst Kultstatus besitzt. Täglich kann man 20 Jahre zurückblicken und die jüngste Zeitgeschichte noch einmal hautnah nachempfinden. Durch den Vergleich mit der aktuellen Tagesschau begibt sich der Zuseher gleichsam auf eine Zeitreise. Dies gilt einerseits für die behandelte Materie, andererseits aber auch für die mediale Aufbereitung des Nachrichten-Genres selbst.
- eventId: 650997
  start: 2026-09-27T00:20:00Z
  stop: 2026-09-27T00:45:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Wilderness Day
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 650998
  start: 2026-09-27T00:45:00Z
  stop: 2026-09-27T01:45:00Z
  title: Space Night
  subtitle: Flight through the Skies
  description: '"Gesättigt von den wunderschönen Bildern fallen die Augen irgendwann ganz von alleine zu. Sie schweben zurück ins Bett und träumen von einem Planeten, den Sie am liebsten erobern würden. Gleich morgen!" So schwärmt die "Süddeutsche Zeitung" von der Space Night - dem Nachtprogramm im BR Fernsehen.'
- eventId: 650999
  start: 2026-09-27T01:45:00Z
  stop: 2026-09-27T02:00:00Z
  title: alpha-centauri
  subtitle: Wohin bewegt sich die Erde?
  description: 'Geschichtenerzählen und Astrophysik - das sind seine beiden großen Leidenschaften: Harald Lesch ist Professor für theoretische Astrophysik an der Ludwig-Maximilians-Universität München und unterrichtet Naturphilosophie an der Hochschule für Philosophie S.J. in München. Außerdem ist er Mitglied der Kommission "Astronomie in Unterricht und Lehramt". Seine Hauptforschungsgebiete sind kosmische Plasmaphysik, Schwarze Löcher und Neutronensterne. In der Sendereihe "alpha-Centauri" erklärt Professor Lesch die Grundzüge des Universums, untersucht ferne Galaxien und bringt uns unser Sonnensystem näher.'
