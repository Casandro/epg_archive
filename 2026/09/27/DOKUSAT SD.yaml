  title: Irischer Kompass - E03 Grüner Süden
  subtitle: Irischer Kompass - E03 Grüner Süden
  description: Der Süden Irlands kommt mit seiner mystischen, grünen Landschaft und verträumten Seen dem Klischeebild der "Grünen Insel" am nächsten. Das macht die Region, wo mehrere bergige Halbinseln in den Atlantik ragen, zur beliebtesten Urlaubsregion des Landes. Der irische Südwesten beherbergt auch verschiedenste Tierarten wie Wild, Bienen, Schafe, Finnwale und Riesenhaie. Das Mikroklima ermöglicht auf natürliche Weise eine Art gemäßigten Regenwald von hohem ökologischem Wert.
