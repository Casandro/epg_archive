  title: Blackout - Wie sicher ist unser Stromnetz?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Erst wenn der Strom fehlt, merken wir, wie abhängig wir von ihm sind: Das Licht erlischt, Fahrstühle bleiben stecken, Ampelausfall führt zum Verkehrschaos, schon nach wenigen Stunden funktioniert kein Handy mehr - die Kommunikation bricht zusammen. Es gibt kein Geld mehr am Automaten, auch Kartenzahlung funktioniert nicht und an der Tankstelle kann kein Sprit mehr gezapft werden. Spätestens wenn die Kühlketten und die Wasserversorgung zusammenbrechen, merken wir: Ohne Strom funktioniert nichts in diesem Land. Doch: Wie sicher ist unser Stromnetz?'
