  description: 'Nach dem Zweiten Weltkrieg wurde eine schnelle Abwicklung gebraucht: wohin mit der Nazimunition? Die einfache Lösung: ab damit ins Meer! In Nord- und Ostsee haben die Alliierten 1,6 Millionen Tonnen verklappt. 80 Jahre später lösen sich aus den Sprengstoffen krebserregende Gifte und kommen in die Nahrungskette. In Muscheln und Fischen sind sie schon nachgewiesen worden. Die Altlasten müssen schnell aus dem Meer. Wie das in großem Maßstab gelingen kann, wird in einem Pilotprojekt vor Boltenhagen untersucht.'
