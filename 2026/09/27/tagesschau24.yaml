  description: Am frühen Morgen des 9. September 2006 wird das 'Hells-Angels'-Mitglied Nils Christian H. nicht in eine Frankfurter Diskothek hereingelassen. Der 24-Jährige sucht Hilfe bei einem einflussreichen Mitglied der Rockergruppierung. Dieser interveniert, und er kommt doch noch rein. Doch die Abfuhr ärgert ihn so sehr, dass er auf den Türsteher einsticht, flüchtet und untertaucht - unterstützt von seinen Rocker-Brüdern. Vier Monate später stellt er sich. Die Staatsanwaltschaft klagt ihn wegen Totschlags an, das Frankfurter Landgericht verurteilt ihn zu neuneinhalb Jahren Haft. Sein Verteidiger spricht von einem Fehlurteil.
