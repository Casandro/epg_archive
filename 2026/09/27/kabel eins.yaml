  description: |-
    Am letzten Wettkampftag treffen sich die Gastronomen in Österreich beim Andi im "Gasthaus Klobenstein". In einer kleinen Schlucht unweit des berühmten Schmugglerwegs gelegen, lädt der junge Österreicher bei atemberaubender Kulisse zu schönen Stunden ein. Bei köstlichem Bier und leckeren Tiroler Spezialitäten, kommt es zum Showdown in der Biergarten-Spezial Woche. Wer bekommt die meisten Punkte und zieht an den anderen noch vorbei Siegertreppchen?

