    "Mesnerwirt St. Johann", Siegsdorf
    Koch-Doku, D 2026
    Altersfreigabe: ab 6
  description: |-
    Die Junggastronomin Julia führt ihr Wirtshaus mit Biergarten in Siegsdorf (St.Johann), das ca. 30 Minuten von Prien am Chiemsee entfernt ist. Die selbstbewusste und starke Frau schwingt in der kleinen Küche die Pfannen und backt ihre berühmten Schnitzel im Akkord. Der alte Holzofen, der auch als Herd fungiert, heizt dabei die kleine Küche auf bis zu 70 Grad auf, sodass man sehr ins Schwitzen kommt. Kommen auch die Mitstreiter gehörig in Schwitzen?

    Gastgeber: Robin Pietsch
