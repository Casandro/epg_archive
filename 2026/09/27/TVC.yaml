  title: Winnetou i Apanaczi
  subtitle: Apanaczi, córka białego osadnika i Indianki, zostaje porwana przez szefa sławnej w całym Teksasie bandy. Winnetou, Old Shatterhand oraz narzeczony dziewczyny, Jeff, wyruszają na ratunek.
  description: |-
    Tytuł oryginalny: Winnetou und das Halbblut Apanatschi
    DE,IT,YU, 1966
    Reżyseria: Harald Philipp
    Występują: Pierre Brice, Lex Barker, Götz George, Uschi Glas, Walter Barnes, Ralf Wolter
    Winnetou, dzielny Indianin z plemienia Apaczów i jego niepokonany w walce na pięści, białoskóry przyjaciel Old Shatterhand, wspólnie występują w obronie czci pięknej Metyski Apanaczi. Obaj bronią jej przed strasznymi desperados, którzy chcą ograbić ją z odziedziczonych bogactw. Wielu z nich zjednoczyło się pod wodzą siejącego grozę Curly Billa. Bandyci, jak zjawy, przemierzają prerię, szerząc strach i przerażenie.
  ageRating: 12
  genre:
  - '18'
- eventId: 1046266
  start: 2026-09-27T09:25:00Z
  stop: 2026-09-27T11:30:00Z
  title: Winnetou i Old Firehand
  subtitle: Winnetou i biały pionier zwany Stara Ognista Pięść próbują doprowadzić do pokoju na ziemiach odebranych Indianom.
  description: |-
    Tytuł oryginalny: Winnetou und sein Freund Old Firehand
    DE,YU, 1966
    Reżyseria: Alfred Vohrer
    Występują: Pierre Brice, Rod Cameron, Marie Versini, Viktor de Kowa, Harald Leipnitz, Todd Armstrong
    "Winnetou i Old Firehand" to kolejna część przygód dzielnego wodza Winnetou. Bohater filmu, szlachetny Apacz Winnetou, wraz z białym pionierem zwanym Old Firehand walczą o pokój na ziemiach odebranych Indianom. Banda Sillersa napada na ludność zamieszkującą obszar na granicy między Teksasem a Nowym Meksykiem. Atakują czerwonoskórych, dla rozrywki zabijając kilku z nich.
  ageRating: 12
  genre:
  - '83'
