  title: Ludzkość - historia nas wszystkich 1 (odc. 7)
  subtitle: Hiszpanie otwierają największą na świecie, bardzo dochodową kopalnię srebra. Kwitnie handel. Do Nowego Świata przybywają niewolnicy i pielgrzymi poszukujący wolności.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Sam Sheridan, Brian Williams, Judith Lindbergh, Mike Loades, Richard Machowicz, Sabine Hyland
    Aztekowie budują potężne imperium, które dominuje w Ameryce Środkowej. 12 tysięcy kilometrów dalej wielkie centrum handlu, Konstantynopol, zostaje podbite przez armię islamską. Europejczycy starają się jak najszybciej znaleźć nową drogę prowadzącą na obfitujący w przyprawy wschód. Krzysztof Kolumb odkrywa Amerykę. W Andach Hiszpanie zakładają największą kopalnię srebra, gdzie wybijają miliony pesos de ocho. Wraz z rozwojem handlu tysiące ludzi przybywają do Nowego Świata jako niewolnicy.
  ageRating: 7
  genre:
  - '35'
- eventId: 1046534
  start: 2026-09-27T23:00:00Z
  stop: 2026-09-28T00:05:00Z
  title: Ludzkość - historia nas wszystkich 1 (odc. 8)
  subtitle: Hiszpanie otwierają w Andach największą kopalnię srebra na świecie. Z kruszcu powstają miliony pesos. Monety zmieniają oblicze światowej ekonomii. Wypełniają skrzynie piratów i napędzają giełdę.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Mike Loades, Richard Machowicz, George Wunderlich, Charles Mann, James Meigs, Santhi Hejeebu
    Hiszpanie otwierają w Andach największą kopalnię srebra na świecie i biją miliony pesos. Monety te zmieniają oblicze światowej ekonomii. Wypełniają skrzynie piratów, napędzają boom na giełdzie, po części finansują budowę Taj Mahal. Podczas gdy handel kwitnie, do Nowego Świata miliony ludzi trafiają jako niewolnicy. Ten sam kontynent dla innych - takich jak purytanie, znani później jako ojcowie pielgrzymi - jest ziemią obiecaną i drogą do wolności.
  ageRating: 7
  genre:
  - '35'
