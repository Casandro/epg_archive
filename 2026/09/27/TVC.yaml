  title: Złapać przemytnika 1 (odc. 8)
  subtitle: Agencje wchodzące w skład Departamentu Bezpieczeństwa Krajowego USA zajmują się ochroną amerykańskich lotnisk. Agenci wykorzystają każdy możliwy sposób, by powstrzymać przemyt.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2020
    Występują: David C. Schweizer
    Wspólna operacja HSI i CBP w Nowym Jorku prowadzi do znalezienia białego proszku w torbie przechwyconej podczas inspekcji po locie międzynarodowym. Po anonimowym zgłoszeniu policjanci i agenci przeszukują terminal w poszukiwaniu potencjalnego przemytnika z Kolumbii. Po prześwietleniu ładunku kawy celnicy z Miami podejrzewają, że przesyłka skrywa tajemnice.
  ageRating: 12
  genre:
  - '35'
- eventId: 1046350
  start: 2026-09-27T14:55:00Z
  stop: 2026-09-27T15:55:00Z
  title: Złapać przemytnika 2 (odc. 1)
  subtitle: Nowojorskie lotnisko JFK cieszy się popularnością wśród przestępców. Tutejsi funkcjonariusze mają jednak sprawdzone sposoby na przemytników.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    HSI przeprowadza kontrolowaną dostawę metamfetaminy, próbując złapać międzynarodowego przemytnika narkotyków. Pasażer w Miami wpada w tarapaty, gdy odmawia odpowiedzenia na rutynowe pytania na temat swojej podróży. Na lotnisku JFK agenci przeszukują magazyn w poszukiwaniu małych ilości narkotyków ukrytych w przetworzonej żywności.
  ageRating: 12
  genre:
  - '35'
- eventId: 1046421
  start: 2026-09-27T15:55:00Z
  stop: 2026-09-27T16:55:00Z
  title: Złapać przemytnika 2 (odc. 4)
  subtitle: W Miami celnicy udaremniają przemyt zwierząt. Pewien pasażer ukrywa w spodniach żywe ptaki. Znaleziony zostaje też ładunek 1400 żółwich skorup.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Na lotnisku w Atlancie zostaje znaleziona walizka, w której przemycano kokainę w paczkach kawy. Inne bagaże, przylatujące z tego samego kraju, również skrywają kontrabandę. W Miami celnicy udaremniają przemyt zwierząt. Okazuje się, że jeden z pasażerów ukrywa w spodniach żywe ptaki. Przechwycony zostaje też ładunek 1400 skorup żółwi zagrożonych wyginięciem. W ręce nowojorskich służb wpada przemytnik pracujący na lotnisku JFK. Staje się on cennym źródłem informacji dla policji.
  ageRating: 12
  genre:
  - '35'
- eventId: 1046422
  start: 2026-09-27T16:55:00Z
  stop: 2026-09-27T18:00:00Z
  title: Złapać przemytnika 2 (odc. 2)
  subtitle: Wśród turystów lecących do Miami kryje się wielu przemytników. Służby graniczne namierzyły transport kokainy oraz argentyńskich handlarzy bronią.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Funkcjonariusze HSI przygotowują spotkanie agenta przykrywkowca z przemytnikiem, dostarczającym do Atlanty duże ilości metamfetaminy. Celnicy w Nowym Jorku zatrzymują pasażerkę, która ma na ciele i w pochwie paczuszki z kokainą. Jednej z nich nie da się wyjąć, więc podejrzana zostaje przewieziona do szpitala. Aresztowany w Miami przemytnik kłamie. Agenci starają się zmusić go do wyznania prawdy.
  ageRating: 12
  genre:
  - '35'
