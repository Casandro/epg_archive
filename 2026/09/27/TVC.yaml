  title: Przyjaciele to prawdziwy skarb
  subtitle: Dwóch przyjaciół postanawia wybrać się na bezludną wyspę, aby tam w spokoju poszukać ukrytego skarbu. Zamiast beztroskiej przygody znajdują wrogo nastawionych tubylców oraz japońskiego żołnierza.
  description: |-
    Tytuł oryginalny: Chi trova un amico trova un tesoro
    IT,US, 1981
    Reżyseria: Sergio Corbucci
    Występują: Terence Hill, Bud Spencer, John Fujioka, Louise Bennett, Salvatore Borghese, Kainowa Lauritzen
    Alan zdobywa mapę prowadzącą do skarbu ukrytego przez armię japońską na jednej z wysp Pacyfiku pod koniec II wojny światowej. Uciekając przed gangsterami, potajemnie zmienia kurs statku Charliego i wyrusza na poszukiwania. Na miejscu odkrywa jednak, że wyspa nie jest bezludna. Na straży tajemniczego łupu stoją zarówno miejscowi mieszkańcy, jak i japoński żołnierz.
  genre:
