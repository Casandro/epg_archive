  title: 'Dzień zagłady: odliczanie 1 (odc. 3)'
  subtitle: Analiza hipotetycznej sytuacji, gdyby otoczona pierścieniami planeta wielkości Neptuna znalazła się na kursie kolizyjnym z Ziemią. Zaledwie cztery godziny wystarczyłyby do nastania zupełnej zagłady.
  description: |-
    Tytuł oryginalny: Doomsday: 10 Ways the World Will End
    US, 2016
    Reżyseria: James Grant Goldin
    Występują: Dan Nachtrab, Bernard Bullen, Joe Girard, Ana Lopes, Ben McGee, Dina Renee
    W tym odcinku kolejny scenariusz możliwego końca Ziemi. Tym razem realizatorzy rozważają zderzenie z obiektem wielkości Neptuna, który wejdzie na kurs kolizyjny z Błękitną Planetą. W ciągu czterech godzin życie na naszej planecie zginie z powodu potężnych trzęsień ziemi i erupcji wulkanicznych. Na koniec Ziemia zostanie rozerwana na kawałki.
