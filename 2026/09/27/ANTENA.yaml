  title: 'Detektyw Candice: Niezawodny instynkt 5 (odc. 3)'
  subtitle: Grupa komendant Renoir jest odpowiedzialna za rozwikłanie sprawy strzelaniny na tarasie kawiarni. Liceum w Sete, a dokładniej młody seryjny kochanek, szybko znajduje się na celowniku.
  description: |-
