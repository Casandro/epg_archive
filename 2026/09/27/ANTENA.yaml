  title: 'Unforgettable: Zapisane w pamięci 1 (odc. 15)'
  subtitle: W 2009 r. w miasteczku City Island zginęła kobieta. Sprawa pozostała nierozwiązana. Al śledził jej postępy. Gdy dochodzi do procesu znika kluczowy świadek - przyjaciółka zamordowanej.
