    Tytuł oryginalny: Candice Renoir
    FR, 2017
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Yeelem Jappain, Nathalie Boutefeu, Guillaume Faure
    W środku nocy Candice i jej zespół zostają wezwani do naszpikowanej najnowszymi systemami bezpieczeństwa willi, której właściciel postrzelił się paralizatorem. Na miejscu zaskoczona Candice odkrywa, że to Phil, nieznośny siostrzeniec prefekta. Wylany z policji kilka miesięcy po swoim przydziale mężczyzna pracuje dla dużej prywatnej firmy ochroniarskiej "Sud Securite". Ten pozornie błahy incydent skieruje grupę Renoir na trop seryjnego mordercy, który umykał jej od dawna.
