  title: Sekret siostry
  subtitle: Dla dwóch bliźniaczek zamiana ról była od zawsze niewinną grą. Wszystko zmienia się, gdy jedna z nich pada ofiarą morderstwa. Zrozpaczona siostra postanawia zataić prawdę i przejąć tożsamość zmarłej.
  description: |-
    Tytuł oryginalny: A Sister's Secret
    US, 2018
    Reżyseria: D.J. Viola
    Występują: Margaret Anne Florence, Donny Boaz, Paula Abdul, Josh Ventura, Catherine Dyer, David Alexander Kaplan
    Dla dwóch bliźniaczek zamiana ról była tylko niewinną zabawą, aż do dnia, w którym jedna z nich zostaje brutalnie zamordowana. Ocalała siostra decyduje się na niebezpieczną grę: ukrywa prawdę przed najbliższymi i wciela się w zmarłą kobietę. Tylko w ten sposób może przeniknąć do otoczenia ofiary i odkryć tożsamość mordercy, który wciąż poluje. Obsada: Margaret Anne Florence, Paula Abdul, Donny Boaz
