  title: 'Detektyw Candice: Niezawodny instynkt 5 (odc. 6)'
  subtitle: W środku nocy Candice zostaje wezwana do willi, której właściciel postrzelił się paralizatorem. Okazuje się, że poszkodowany to Phil, nieznośny siostrzeniec prefekta, zwolniony z policji.
