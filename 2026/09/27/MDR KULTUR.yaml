- eventId: 544132
  start: 2026-09-27T10:00:00Z
  stop: 2026-09-27T11:00:00Z
  title: MDR KULTUR Café
  description: "Andreas Dresen gehört schon seit langem zu den wichtigsten deutschen Regisseuren, Filme wie \"Halbe Treppe\", \"Wolke 9\" oder \"Halt auf freier Strecke\" haben den genauen Beobachter und einfühlsamen Geschichtenerzähler auch international bekannt gemacht. So unterschiedlich seine Themen und Herangehensweisen auch sind, immer ist seine menschliche Haltung, seine Liebe zu den Figuren erkennbar, der unverwechselbare \"Dresen-Touch\". \nSein neuer Film \"Alte Liebe\", der im Oktober in den deutschen Kinos startet, bestätigt diesen Ruf erneut. Basierend auf dem Roman von Elke Heidenreich und Bernd Schroeder, gestaltet er warmherzig und humorvoll mit den glänzenden Darstellern Dagmar Manzel und Joachim Król Szenen einer langen Ehe. Für uns ein schöner Anlass, Andreas Dresen wieder in das MDR KULTUR Café einzuladen und mit ihm über die Kunst des Geschichtenerzählens, über das Altern, das Abschiednehmen und über die Kraft einer gereiften Liebe zu sprechen. Eine Sendung von Knut Elstermann.\n\nRedaktion: Gabriele Bischoff"
  subtitle: 'Zu Gast: Andreas Dresen'
