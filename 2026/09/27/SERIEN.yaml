  stop: 2026-09-27T02:34:00Z
  title: Borgia - 1500
  subtitle: Borgia - 1500
  description: Della Rovere setzt Alidosi auf Rodrigos Sekretär Gacet an, um diesen endgültig zu vernichten. Rodrigo entlässt Gacet, als er sieht, wie dieser Alidosi küsst. Cesare überzeugt Lucrezia, nach Rom zurückzukehren und Alfonso D'Este zu heiraten.  FR 2013
  ageRating: 16
- eventId: 1235027
  start: 2026-09-27T02:40:00Z
