  title: Borgia - 1499
  subtitle: Borgia - 1499
  description: Während sowohl Federigo von Aragon als auch Ludwig Anspruch auf den Thron von Neapel erheben, erobert Cesare Faenza kampflos. Alfonso Di Calabria will Cesare töten lassen, doch der Plan fliegt auf. Nachdem Alfonso in einem Hinterhalt schwer verletzt wird, kehrt Cesare nach Rom zurück. Lucrezia entdeckt einen Maskierten, der Alfonso tötet. Von Trauer überwältigt, zieht sie sich aufs Land zurück. FR 2013
  ageRating: 16
- eventId: 1235026
