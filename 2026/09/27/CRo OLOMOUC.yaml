  title: Hvězdné návraty
  description: Je krásné, když někdo umí pobavit, potěšit, rozesmát a ještě to dělá jakoby nic. Právě takový je Pavel Zedníček. A proto mu věnujeme celý další díl oblíbeného veselého pořadu o českých hercích a komicích. Dozvíte se, co Pavel Zedníček původně studoval, kdo ovlivnil jeho cestu k divadlu, s jakými hvězdami chodil do školy i jak vznikaly legendární filmy, seriály a televizní pořady. Bavte se s námi. Připravuje Patrik Rozehnal.
