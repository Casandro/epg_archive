    Gibt die Expertin Wendela Horz grünes Licht für den Wunschpreis der beiden Verkäufer? Die zum Verkauf stehende Brosche kann auf jeden Fall mit Gold, handgemachten Gravuren und hohem Alter aufwarten. Bei den beiden Verkäufern herrscht purer Optimismus. Doch ist dieser denn tatsächlich gerechtfertigt? Ab geht es zur Expertise durch Wendela Horz, die zahlreiches Spannendes und Interessantes zur Brosche erzählen kann. So wurde diese Brosche um 1900 aus 585er Gold gefertigt. Zudem ziert ein großer Stein aus Bristol Glas das wunderbare Schmuckstück. Auch wenn die Expertin begeistert ist von dem Goldschatz aus dem Schmuckkästchen, kann sie nichtsdestotrotz ein Veto beim Wunschpreis der beiden Verkäufer einlegen. Doch ist dem so? Und was bedeutet ein solches Veto für die Verhandlungen im Händlerraum? Es bleibt spannend!
    Show, Deutschland 2024, R: Ingo Monitor, Michaela Hülkenberg M: Horst Lichter
