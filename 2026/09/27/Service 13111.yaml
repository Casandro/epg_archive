  title: Ich, Bauer
  subtitle: Von Schlossbesitzern und Minimalisten
  description: |-
    Fritz Mayr-Melnhof bewirtschaftet in Kogl bei St. Georgen im Attergau ein mächtiges Stück Wald und lebt mit seiner Familie auf den ersten Blick in noblen Verhältnissen. Der junge Waldbauer erfüllt die Funktion des Grundbesitzers, Erfinders, Unternehmers, Hausbesitzers und Familienvaters - so wie jeder Bauer. Doch reichen diese Parallelen schon aus, um in der aristokratischen Familie Mayr-Melnhof auf Schloss Kogl wahre Bauern zu erkennen? Oder macht der Maßstab selbst den Vergleich unmöglich?

    Yvonne und Andreas Roider haben sich einen Lebenstraum erfüllt. Ihr Hof, der Oberhof in Seekirchen, wurde zu einer Arche Noah, einer Arche für bedrohte Tier- und Pflanzenarten. Die beiden sind Vollerwerbsbauern - und Idealisten. Sie versuchen, ihr Konzept einer nachhaltigen Lebensweise mit dem wirtschaftlichen Erfolg eines Bauernhofs im 21. Jahrhundert in Einklang zu bringen. Das Grauvieh wird in Herdenhaltung gehalten, die Kälber dürfen, solange sie gesäugt werden, mit ihren Müttern auf der Wiese leben. Die Hühner sind nicht gezwungen, Eier im Akkordbetrieb zu legen, die Wollschweine toben auf der riesigen Wiese, und der kräftige Noriker hilft beim Pflügen.Österreich 2025, R: Martin Maria Leckert, Hannes Schuler
  genre:
  - '116'
  widescreen: true
