  title: Heimatleuchten
  subtitle: So feiern wir - beim Rupertikirtag in Salzburg
  description: 'Es ist Rupertikirtag. Der 24. September ist in Salzburg kein Tag wie jeder andere - nein, denn dieser Tag ist dem Heiligen Rupert, dem Salzburger Landespatron, geweiht. Und das wird Jahr für Jahr gebührend gefeiert. Jung und Alt packen Dirndlkleider und Lederhosen aus dem Schrank und mischen sich gut gelaunt unters Volk. Die prächtigen Plätze der Salzburger Altstadt verwandeln sich in einen Rummelplatz mit Retro-Chic. Karussell, Riesenrad und Sturmsegler drehen sich im Schatten ehrwürdiger Kirchen um die Wette. In der Geisterbahn wird so manchem das Fürchten gelehrt, und zwischen flitzenden Autodrom-Autos und picksüßer Zuckerwatte taucht Richard Deutinger ein in das faszinierende Milieu der Schausteller.Österreich 2025, R: Brigitte Erhart M: Richard Deutinger'
