  title: Gottesdienst am Sonntag LIVE
  subtitle: Heilige Messe aus der Pfarre Wien-Trautmannsdorf
  description: Der heutige TV-Gottesdienst führt nach Trautmannsdorf an der Leitha in Niederösterreich. Die Pfarrkirche ist der heiligen Katharina geweiht und wurde zwischen 1718 und 1722 errichtet. Ihre überwiegend barocke Ausstattung stammt aus dem späten 17. und frühen 18. Jahrhundert. Heute ist die Pfarre Teil des Pfarrverbands der Salvatorianerpfarren, zu dem neben Trautmannsdorf auch die Gemeinden Margarethen am Moos, Gallbrunn, Sarasdorf und Stixneusiedl gehören. Trautmannsdorf zählt rund 1.000 Einwohnerinnen und Einwohner. Die kleine, traditionsreiche Gemeinde lebt von einem vielfältigen Vereinsleben und vom großen Engagement zahlreicher Ehrenamtlicher. Diese Verbundenheit und der Zusammenhalt der Menschen prägen auch das kirchliche Leben vor Ort. Geleitet wird der Gottesdienst von P. Franz Werner Tree. Der Salvatorianerpater ist als Pfarrvikar im Pfarrverband Salvatorianerpfarren tätig und zugleich Superior und Ökonom der Kollegien Margarethen/Moos und Mistelbach. Darüber hinaus ist er Provinzsekretär und Religionslehrer. Für die musikalische Gestaltung sorgt die Trachtenkapelle Trautmannsdorf. Gemeinsam mit der Gemeinde wird sie dem Erntedankgottesdienst einen festlichen und zugleich bodenständigen musikalischen Rahmen geben.Österreich 2026
