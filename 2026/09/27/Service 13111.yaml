  title: Auf den Spuren von Paul Preuß - Eine Zeitreise in Altaussee
  description: 'Die Seewiese Altaussee im Salzkammergut. Hier, am Originalschauplatz der legendären Erstbesteigung der Trisselwand 1911 durch Paul Preuß, verschmelzen Schauspiel, Tanz und Naturkulisse zu einem alpinen Kammerspiel. Der Salzburger Regisseur Hubert Lepka schickt einen Kletterer und drei Schauspieler auf eine szenische Wanderung. Im Mittelpunkt stehen die Tage vor der Erstbesteigung der Trisselwand. Paul Preuss erkundet mit Freunden aus München und Wien eine mögliche Route. Die Bergkameraden werden von Zweifeln und Ängsten geplagt. Alle Szenen spielen in der Landschaft. Eine Initiative von TAUROA in Zusammenarbeit mit lawine torrèn. Österreich 2025, R: Stefan Aglassinger'
