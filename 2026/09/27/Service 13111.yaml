  title: Die Erde - Entstehung des Lebens
  subtitle: Pflanzen
  description: |-
    Man meint vermeintlich, dass Eis, Feuer oder andere Elemente die Erde geformt und verändert haben, aber es gibt einen Einflussfaktor, der die Erde maßgeblich verändert hat: Pflanzen. Wie verwandelte sich die Erde von einer unwirtlichen, kargen Felsenlandschaft in ein grünes Paradies? Die ersten Pflanzen verlassen den Schutz des Wassers, um sich an Land aus der Struktur der Erde zu nähren, Böden zu bilden, und neue Landschaften entstehen zu lassen. Eine Geschichte, in der unwahrscheinliche Verbündete zusammenfinden und die Erde sich von einer fremdartigen Welt in den grünen Planeten verwandelt, den wir heute kennen.
    Dokumentarfilm, Vereinigtes Königreich 2023, R: Kiki Lawrance, James Tovell
