  title: TM Wissen
  subtitle: Tigermücke im Anflug? - Was eingewanderte Gelsen so gefährlich macht und mehr
  description: 'TM Wissen mit Gernot Grömer liefert erneut spannende Einblicke in Wissenschaft und Alltag: Die asiatische Tigermücke breitet sich zunehmend in Österreich aus - vor allem in Wien und Graz. Sie kann gefährliche Krankheiten übertragen und wird deshalb genau beobachtet. Expert:innen wie Dr. Karin Bakran-Lebl und Erwin Wieser bekämpfen sie mit Eiablagefallen, App-Meldesystemen und gezielter Aufklärung. Doch ist die Plage noch aufzuhalten? // Ein scheinbar harmloser Würstelstreit sorgt für Verwirrung: In Deutschland "Wiener", in Österreich "Frankfurter" - wer hat nun recht? TM Wissen geht der Geschichte der berühmten Brühwurst nach und zeigt, wie sie durch Metzger Johann Georg Lahner ihren Weg nach Wien fand. Trotz Namensstreit bleibt der Genuss gleich - ob am Würstelstand oder als Sacherwürstel im Kaffeehaus. // Nachhaltigkeit trifft Innovation: In einem Forschungsprojekt der TU Graz werden alte Baumwolltextilien zu stabilem Papierkarton verarbeitet. Das Verfahren von Thomas Harter könnte Textilmüll reduzieren und gleichzeitig der Verpackungsindustrie umweltfreundliche Alternativen bieten. // Österreichs Wälder stehen durch Klimawandel, Stürme und Brände unter Druck. Die Folgen des Sturmtiefs Vaia oder der Brand in Hirschwang an der Rax zeigen: Hitze, Trockenheit und Borkenkäfer setzen den Wäldern zu. Förster setzen auf klimaresistente Mischwälder, doch wie lange dauert die Erholung der Natur? // Weitere Fragen der Sendung: Was passiert mit der Prärie ohne Bisons? Wie nah sind wir außerirdischem Leben? Und: Woher kommt eigentlich die Redewendung "Aus dem Schneider sein"?Österreich 2025'
  genre:
  - '144'
  widescreen: true
- eventId: 1074011
  start: 2026-09-27T22:00:00Z
  stop: 2026-09-27T23:00:00Z
  title: Rapa Nui - Geheimnisse der Osterinsel
  description: |-
    Wie und warum wurden die monumentalen Steinstatuen von Rapa Nui, auch Osterinsel genannt, gemeißelt und aufgestellt? Die Europäer kamen vor mehr als 300 Jahren auf der abgelegenen Pazifikinsel an. Seither gibt es Kontroversen um die riesigen Figuren aus Stein, die Moai, und um die Geschichte der Menschen, die sie erschaffen haben. Eine neue Generation von Forschern stellt alte Theorien in Frage, enthüllt die reiche Geschichte, die Innovationskraft und die Widerstandsfähigkeit des Volkes der Rapa Nui. Faszinierende neue Erkenntnisse über den Ursprung dieser Kolossalfiguren!
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2023, R: Mike Ibeji
  widescreen: true
