  title: TM Wissen
  subtitle: Jungbrunnen Wald? - Das Comeback der alten Heilpflanzen und mehr
  description: 'In den Wäldern von Murau sammelt Kräuterpädagogin Tina Rosenkranz Moose, Harze und Lärchentriebe - alte Heilpflanzen mit neuer Wirkung. Ihre natürlichen Inhaltsstoffe helfen gegen Entzündungen und fördern die Hautregeneration. Auch Forscher entdecken zunehmend die Kraft des Waldes: Von Bartflechte bis Ameisensäure - vielleicht liegt das wahre Anti-Aging-Geheimnis tatsächlich in der Natur. // Vergesslich? Das liegt oft nicht am Alter, sondern an der Lernmethode. Neurowissenschaftlerin Dr. Manuela Macedonia zeigt: Wer mit Bewegung, Sinneseindrücken und Emotionen lernt, behält Inhalte besser. Zwei Probanden testen einfache Tricks für effektiveres Lernen - und was unser Gehirn von Kleinkindern lernen kann. // Ein Pilotprojekt im Pinzgau zeigt, wie künstliche Intelligenz die Tierhaltung verändert. Statt Chips oder Sensoren überwachen Kameras das Verhalten von Kühen. Die Software erkennt Auffälligkeiten in Echtzeit und liefert Gesundheitsdaten per App. Auch Verbraucher könnten künftig per QR-Code nachvollziehen, wie ihre Milch entstanden ist. // Fluchen ist mehr als Frustabbau - es kann Schmerzen lindern, Gemeinschaft stiften und kulturelle Unterschiede zeigen. Sprachwissenschaftlerin Dr. Oksana Havryliv erklärt, warum der gepflegte "Auszucker" wichtige Funktionen erfüllt und warum ein gutes Schimpf-Vokabular durchaus nützlich sein kann. // Wie kam Sauerstoff in unsere Atmosphäre? Warum ist die Erde ein Glücksfall? Und: Welche Vögel sind die klügsten?Österreich 2025'
  genre:
  - '144'
  widescreen: true
