  title: Terra Mater
  subtitle: Wildes Uganda
  description: "Die Berggorillas sind wohl die berühmtesten Bewohner Ugandas. Im Regenwald des Bwindi Nationalparks lebt die Hälfte aller existierender Berggorillas, etwa vierhundert Tiere. Eine Langzeitstudie der Wissenschaftler des Max-Planck-Institutes bietet erstmals fundierte Fakten über diese kaum erforschten Gorillaclans und erlaubt Einblicke in ihr Familienleben. Und Ugandas Wildnis hütet weitere kaum bekannte Schätze: an den Flanken des Mount Elgon führen zahlreiche Höhlen ins Innere des Vulkanberges. Einige von ihnen dienen als Salzlecken für Elefanten. Sie marschieren nach Einbruch der Dunkelheit in die Höhlen, um dort mit ihren Stoßzähnen wie Minenarbeiter nach Salzen zu schürfen.  \nNatur, Österreich 2018, R: Harald Pokieser"
