  title: Bergwelten - Unterwegs am Luchstrail
  subtitle: Bergwelten - Unterwegs am Luchstrail
  description: 'Der naturnahe und herausfordernde ''Luchs Trail'' führt nicht nur durch drei Bundesländer, sondern auch durch das größte zusammenhängende Waldgebiet Österreichs, dessen Buchenwälder von der UNESCO 2017 zum  Weltnaturerbe erklärt wurden. Das Credo des Trails lautet ,Wandern, wo die Luchse wohnen''. Die Naturfilmer und Fotografen Christine Sonvilla und Marc Graf tauchen auf dem Weg tief ins Land der Luchse ein. In der faszinierenden ,Wilden Mitte'' Österreichs treffen die beiden auf Luchsforscher Christian Fuxjäger, der in der urigen Bergwelt des Reichraminger Hintergebirges lebt. Vom Klettersteig auf den Hexenturm und dem Admonter Haus blickt man auf eine der weltweit schönsten Bibliotheken: Die Stiftsbibliothek Admont hat spannende historische Belege für die Luchse in diesem Gebiet. Der Weg führt weiter über die Oberst Klinke-Hütte und vorbei am Johnsbacher Bergsteiger-Friedhof, der an die Tragödien der Klettergeschichte im Gesäuse erinnert. Weiter geht es durchs Johnsbachtal zum Großen Buchstein, wo Christine auf alte Freunde trifft: Marlies Czerny und Andreas Lattner. Die beiden klettern über eine herausfordernde Route auf den Großen Buchstein, der imposante Ausblicke auf die Hochtor-Gruppe bietet. Gudrun Lackmaier wiederum ist Rafting-Guide auf der Salza, einem der schönsten Gebirgsflüsse der Alpen. Eine Rafting-Tour unter ihrer Führung ermöglicht Christine Sonvilla nicht nur ein erstaunliches Naturerlebnis, sondern führt auch in die bewegte tektonische Vergangenheit der Salzaschluchten. Mit Kathrin Zettel nimmt sie schließlich den letzten Abschnitt des ,Luchs Trails'' in Angriff. Für die ehemalige Ski-Rennläuferin ist es eine sentimentale Wanderung durch die Berge ihrer Jugend und die Anfänge ihrer großen Ski-Karriere. AT 2024'
  ageRating: 6
- eventId: 1235252
