  title: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  subtitle: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  description: Als Kajakfahrerin hat Nouria Newman noch viele Ziele. Die 24-jährige Französin gehört momentan zu den anerkanntesten Nachwuchstalenten im Kajak. Ihre jetzige Mission ist der berüchtigte Upper Cherry Creek in Kaliforniens Sierra Nevada. Die ohnehin sehr anspruchsvolle Strecke ist nach einem Jahrzehnt der Dürre kaum noch befahrbar. Jeder Wildwasser-Kajakfahrer träumt von einem Klassiker wie dem Upper Cherry. Schon als Neunjährige wollte Nouria dorthin. Sie hätte nie gedacht, dass es eines Tages klappt. Doch der Fluss birgt viele Gefahren, vor denen sich auch eine so erfahrene Kajakfahrerin wie Nouria in Acht nehmen muss. AT 2018
  ageRating: 12
- eventId: 1235354
  start: 2026-09-27T20:20:00Z
  stop: 2026-09-27T20:43:00Z
  title: Ultimate Rush - Brandon Semenuk will Geschichte schreiben
  subtitle: Ultimate Rush - Brandon Semenuk will Geschichte schreiben
  description: 'Der Kanadier Brandon Semenuk ist in der Kategorie Hindernisparcours momentan der beste Mountainbiker der Welt. Durch internationale Wettbewerbe und tausende Trainingseinheiten ist er Druck gewöhnt. Er weiß, wie man neue Tricks entwickelt, und im richtigen Moment abruft. Die perfekte Fahrt ist wie ein Fluss, ein Gefühl der Freiheit, ein Ineinandergreifen der Tricks. Doch wie kann man dieses Gefühl auf Film verewigen? Für den surrealen Mountainbike-Film "UnReal", haben sich Brandon Semenuk und seine Filmcrew etwas vorgenommen, dass es so noch nicht gab: Einen ganzen Parcours in nur einer Einstellung zu drehen. Normalerweise nimmt man auf der gesamten Strecke bis zu 80 Takes auf. Brandon ist klar, dass es riskant ist, alles in einer drei Minuten langen Einstellung zu drehen. Zudem dauert eine Wettkampfstrecke oft gerade mal 45 Sekunden. Die Strecke sollte also dreimal so lang werden. Brandon muss nicht nur eine perfekte Fahrt abliefern, auch die Aufnahme musste gelingen. Eine Einstellung mit nur einer Kamera: das ist verdammt schwer. AT 2016'
  ageRating: 12
- eventId: 1235355
  start: 2026-09-27T20:45:00Z
  stop: 2026-09-27T21:05:00Z
  title: Ultimate Rush - Menschlicher Pfeil
  subtitle: Ultimate Rush - Menschlicher Pfeil
  description: Als ehemaliger Navy Seal und Ausbilder für Fallschirmspringer hat Andy Stumpf tausende Flüge im freien Fall absolviert. Nun will Andy den Weltrekord für den weitesten Flug in einem Wingsuit brechen. Es ist nicht das erste Mal, dass Andy ein großes Risiko eingeht. Doch dieses Mal ist er sich der Gefahr wirklich bewusst. Er rechnet mit allen möglichen Szenarien. Nur wenige versuchen den Distanz-Rekord zu brechen. Beim Fallschirmspringen zählen vor allem Gruppensprünge, akrobatische Tricks und Formationen. Beim Basejumping geht der Trend dahin, möglichst nah an Objekten oder am Boden entlangzufliegen. Andy will dagegen versuchen, so hoch wie möglich aus einem Flugzeug abzuspringen. Er will die maximale Distanz erreichen. AT 2016
  ageRating: 12
- eventId: 1235384
  start: 2026-09-27T21:05:00Z
  stop: 2026-09-27T21:29:00Z
  title: Ultimate Rush - Reifen auf dem Wasser
  subtitle: Ultimate Rush - Reifen auf dem Wasser
  description: Der Freestyle-Motocross-Fahrer Robbie Madison gilt als der "Evil Knievel der Gegenwart". Er hat die meisten, die höchsten und die weitesten Sprünge vollführt, und das an einzigartigen Schauplätzen. Er sucht ständig nach spannenden Herausforderungen mit dem Motorrad. Kreativität ist ihm dabei sehr wichtig. In der Luft und am Boden ist Robbie ein Meister. Sein nächster Stunt soll aber auf dem Wasser stattfinden. An der Südspitze der Insel Tahiti, in Teahupoo, gibt es die mächtigsten Wellen der Welt. Die Fahrt auf dem Ozean stellt Robbie vor große Herausforderungen, für die er und sein Team noch keine Lösung haben. Robbie weiß, dass es ein großes Wagnis ist, doch in Teahupoo sind die Wellen ideal für seine Zwecke. AT 2016
  ageRating: 12
- eventId: 1235385
  start: 2026-09-27T21:35:00Z
  stop: 2026-09-27T21:59:00Z
  title: 'Ultimate Rush - Alles auf Schiene: Danny MacAskill "Wee Day Out"'
  subtitle: 'Ultimate Rush - Alles auf Schiene: Danny MacAskill "Wee Day Out"'
  description: Die Hügel der schottischen Highlands waren nicht nur der erste Spielplatz für den Street-Trial-Profi Danny MacAskill. Sie verdeutlichen auch, wie weit er schon gekommen ist, und was er noch erreichen will. Sein Erfolg als innovativer Bike-Akrobat erhöht den Druck, immer neue und bessere Tricks zu zeigen. So wie in seinem neuesten Projekt. Er möchte es mit einem gefährlichen Stunt abschließen, der ihm schon seit Jahren durch den Kopf geht. Danny und sein Team wollen für das neue Video grüne Hügelketten und eine Dampfeisenbahn, um eine Geschichte zu erzählen, mit einem Höhepunkt und einem Ausklang. Der Film soll nicht nur Spaß und Lebensfreude zeigen, sondern Radfahrkünste, die auch diejenigen ansprechen, die noch nie auf einem Mountainbike gesessen sind. Doch die lockere Stimmung beim Aufbau des Filmsets täuscht darüber hinweg, dass Danny eine Reihe hochriskanter Tricks plant. Viele wurden noch nie zuvor versucht. AT 2016
  ageRating: 12
