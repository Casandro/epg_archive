- eventId: 556062
  start: 2026-09-27T14:04:00Z
  stop: 2026-09-27T15:00:00Z
  title: WDR 5 - Lies mir was vor
  subtitle: 'Karl Emil Franzos: Verschollene Fürstenstadt Zerbst - Dessau - Wörlitz (3/3)'
  description: |-
    Im August <markup type="abbr" abbreviation="1901" correspondent="neunzehnhunderteins">1901</markup> packt der Berliner Schriftsteller und Journalist Karl Emil Franzos seinen Koffer, um Richtung Frankfurt am Main über Land zu fahren. Ein Ziel? Das hat er nicht. Eine Route? Die bestimmt der Zufall. Nach Zerbst führt Franzos das Lob von Brägenwurst und Bitterbier, nach Dessau die Regie des Fahrplans und nach Wörlitz Goethes Schwärmerei, dort sei es <markup type="cite">"unendlich schön... wie ein Märchen"</markup>.
    <strong>Teil 3</strong>
    Zum Ende seiner Reise widmet sich Karl Emil Franzos der Ankunft in Wörlitz. Der österreichische Autor schildert zunächst seine Enttäuschung über das anfangs ärmlich und unscheinbar wirkende märkische Städtchen. Dieser Eindruck weicht jedoch purer Faszination, sobald er den Wörlitzer Park und das Schloss betritt. Er feiert die Anlage als einen der schönsten Gärten der Welt und als gebautes Ideal der Aufklärung, in dem Natur, Kunst und Menschlichkeit perfekt miteinander harmonieren.
    Mit: Ilja Richter <br/>MDR <markup type="abbr" abbreviation="2013" correspondent="zweitausenddreizehn">2013</markup>
    Ab dem <markup type="abbr" abbreviation="17." correspondent="siebzehnten">17.</markup> Juli <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> in ARD <markup type="language.en">Sounds</markup>.
