  title: Svjedoci, hrvatski film (12)
  subtitle: ' '
  description: 'Drama. Radnja se događa u 48 sati u jednom hrvatskom gradiću za vrijeme Domovinskog rata i tematizira problem krivnje pojedinca i gubitka duše u ratu. Nelinearna struktura priče omogućuje uvid u nekoliko ljudskih drama, ispričanih iz vizure krvnika, a ne žrtve, kako bi se propitalo funkcioniranje zla i spirala mržnje. Priča se odmotava svaki put iz nove vizure, a sve započinju u istom trenutku - trenutku istrage ubojstva, i svaka daje novu sliku onoga što se doista dogodilo... Scenarij za "Svjedoke" nastao je prema motivima romana Jurice Pavičića "Ovce od gipsa". Film "Svjedoci" (2003.) osvojio je 5 Zlatnih arena i "Oktavijan" - nagradu kritike u Puli 2003., nominiran je za "Zlatnog medvjeda" 2004., te nagrađivan na festivalima u Berlinu, Karlovym Varyma, Vlissingenu, Motovunu, Rimu i Jeruzalemu, a Europska filmska akademija uvrstila je film "Svjedoci" među 42 najbolja europska filma 2004. godine. Urednica: Maja Gregl'
- eventId: 1167644
  start: 2026-09-27T03:40:00Z
  stop: 2026-09-27T04:36:00Z
  title: Parni valjak feat. Igor Drvenkar, Tvornica Kulture 10.10.2023., 1. dio
  subtitle: ' '
  description: '"Naš Zagreb, srce ste nam ispunili. Kada se ovako nešto dogodi, poželimo vam pojedinačno svakome zahvaliti i čvrsto vas zagrliti." Nakon što su u posljednjih nekoliko mjeseci održali više od 15 koncerata diljem regije, Parni Valjak je 10. listopada 2023. stigao i pred zagrebačku publiku. U prepunoj Tvornici kulture održali su prvi nastup u Zagrebu u svom novom poglavlju s Igorom Drvenkarom te su zajedno sa svojom publikom priredili vrhunsku koncertnu atmosferu i, prema reakcijama, nadmašili sva očekivanja. Riječ je ujedno i o prvom snimljenom koncertu Parnog valjka s Igorom, čiji su 1. dio započeli s energičnom "Ljubav" te nastavili sa "Suzama se vatre ne gase" i "Ljubavna". Setlista je i u nastavku sastavljena od nezaobilaznih svevremenskih klasika, poput "Zastave", "Zagreb ima isti pozivni", "Moja glava, moja pravila", "Ostani s njim", "Prolazi sve, zar ne?", s Tinom Kresnik izveden je duet "Dok je tebe", "Vrijeme ljubavi" je izvedena u akustičnoj varijanti, a slijedile su "Kada me dotakne" i "Jesen u meni". Parni Valjak je ovom prilikom uživo predstavio svoj izniman koncertni spektakl koji su od svibnja 2023. izvodili diljem regije - od klupskih prostora i proljetne turneje u Zadru, Rijeci, Ljubljani i Mariboru pa sve do open-air pozornica i nastupa u ljetnim mjesecima pred desecima tisuća ljudi.'
- eventId: 1167645
  start: 2026-09-27T04:36:00Z
  stop: 2026-09-27T05:20:00Z
  title: Dolina sunca, serija (18/210)
  subtitle: ' '
  description: 'Juran spretno uvjeri Natašu u svoju ljubav prema njoj, što se nimalo ne sviđa Sonji. Andrija započinje posao oko restauriranja, ali se na njemu vidi da je bolestan, što brine Evu. Ruža je zabrinuta za Nikolu i za posao koji im u zadnje vrijeme baš i ne ide najbolje. Nikola se slaže s njom da bi možda trebali raditi na proširenju gostionice i poslovanja. Eva sretne Kristijana i slučajno sazna da je on taj koji joj je sredio dozvolu za obnovu. Nije sretna što joj se Vitezovići upleću u sve čega se primi. Nikola je ljut na Karla što ne radi dobro posao koji mu je dao, ali ne želi to reći Sofiji da je ne povrijedi. Karlo je za to vrijeme potajno s Augustinom. Nikola mu kaže da će mu samo zbog njegove majke pružiti još jednu priliku. Eva odluči otići do Vitezovića i zahvaliti Kristijanu na trudu, ipak je preburno reagirala, ali kada dođe, stvari ne krenu najboljim putem. Karlo se povjeri Lovri kako je zabrinut jer će Augustina uskoro morati u Zagreb na faks. Kristijan se ispričava Evi za ponašanje njegove obitelji, ali njihov razgovor čuje Irena. On joj kasnije prizna da je lagao. Doktor Otto savjetuje Juliji da bi malom Petru možda trebala neka muška figura. Julija, Sofija i Eva prestrave se kad ugledaju na podu Andriju u groznici. Julija za to krivi Evu.  Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
