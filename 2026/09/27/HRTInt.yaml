  title: Svjedoci, hrvatski film (12)
  subtitle: ' '
  description: 'Drama. Radnja se događa u 48 sati u jednom hrvatskom gradiću za vrijeme Domovinskog rata i tematizira problem krivnje pojedinca i gubitka duše u ratu. Nelinearna struktura priče omogućuje uvid u nekoliko ljudskih drama, ispričanih iz vizure krvnika, a ne žrtve, kako bi se propitalo funkcioniranje zla i spirala mržnje. Priča se odmotava svaki put iz nove vizure, a sve započinju u istom trenutku - trenutku istrage ubojstva, i svaka daje novu sliku onoga što se doista dogodilo... Scenarij za "Svjedoke" nastao je prema motivima romana Jurice Pavičića "Ovce od gipsa". Film "Svjedoci" (2003.) osvojio je 5 Zlatnih arena i "Oktavijan" - nagradu kritike u Puli 2003., nominiran je za "Zlatnog medvjeda" 2004., te nagrađivan na festivalima u Berlinu, Karlovym Varyma, Vlissingenu, Motovunu, Rimu i Jeruzalemu, a Europska filmska akademija uvrstila je film "Svjedoci" među 42 najbolja europska filma 2004. godine. Urednica: Maja Gregl'
