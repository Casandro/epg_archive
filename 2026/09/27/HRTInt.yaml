  title: 'Tata i ja (2): Na pecanju (1/10)'
  subtitle: ' '
  description: Nastavak igranog serijala koji se zasniva na kreativnom druženju roditelja i djece. Serijal prikazuje kako je druženje u obitelji iznimno važan dio odrastanja svakog djeteta. U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu postati vrijedna uspomena na vrijeme koje su proveli zajedno.
