- eventId: 1256168
  start: 2026-09-27T14:06:00Z
  stop: 2026-09-27T14:11:00Z
  title: 'Jojo i lijepe riječi: Dobar dan (5/10)'
  subtitle: ' '
  description: 'U svakoj od epizoda novoga serijala "Jojo i njegovi prijatelji" družeći se na farmi kroz svladavanje različitih situacija i "problema" uče i upoznaju značenje i važnost LIJEPIH RIJEČI i njihovo korištenje u svakodnevnom životu. Tako će naučiti zašto je važno pozdraviti i nekome poželjeti dobro jutro (dobar dan ili laku noć), koliko je vrijedan osmijeh ili zbog čega nikada ne smijemo zaboraviti reći - oprosti, hvala i molim! Jojo i njegovi prijatelji kroz igru i pjesmu najmlađe uče ljubaznosti, poštovanju (svakoga pojedinca), empatiji, brižnosti... Uče ih koliko je važno voljeti kako sebe, tako i sve oko sebe!  Producentica: Blanka Barlović Scenarist, autor pjesama i animacija: Bojan Jambrošić Dramaturginja: Ivana Gudelj Redateljica: Ivana Radovčić Urednica: Silva Skender'
