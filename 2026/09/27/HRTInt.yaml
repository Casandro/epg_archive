- eventId: 1256169
  start: 2026-09-27T14:11:00Z
  stop: 2026-09-27T14:21:00Z
  title: 'Najbolji dan: Ana i Ema'
  subtitle: ' '
  description: Sestrice Ana i Ema odrastaju u posebnoj obitelji. Njihovi su roditelji umjetnici. Ivana i Bruno pišu i ilustriraju knjige za djecu, a mama Ivana autorica je i crtanih filmova. Anini i Emini roditelji rade kod kuće, a kad rade, trebaju mir. Ani i Emi teško je razumjeti da se Ivana i Bruno ne mogu neprestano s njima zabavljati i zbog toga su tužne. Digidigijev je zadatak objasniti djevojčicama da to ne znači da ih njihovi roditelji manje vole ili da se ne žele igrati s njima. Ana i Ema trebaju naučiti da postoji vrijeme za igru i vrijeme za rad ili učenje. I važno je poštovati to vrijeme. Jer nakon toga opet dođe vrijeme za igru. Djevojčice se mogu i same zabaviti na mnogo načina jer imaju jedna drugu. Mogu se igrati u vrtu, crtati poput mame i tate, a od sada i slušati glazbu i plesati uz Digidigi radio. Digidigi je strastveni plesač i zna da uz ples naš svijet postaje veselije mjesto.
