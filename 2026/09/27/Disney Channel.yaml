  description: Folge 80, Delia stiehlt Jambas Nachfolge-Modell Powerchip, um das mächtigste teuflische Experiment des Universums zu erschaffen. Van Hamsterdam verfolgt indessen seinen eigenen Plan und schickt das transmutierte Experiment Doppli auf die Erde, um Stitch zu klonen. Als schließlich von Doppli der Stitch Boss erschaffen wird, wird die Sache brenzlig, denn der will vor allem Chaos und Zerstörung anrichten. Nur der Original-Stitch kann ihm beibringen, dass es besser ist, seine Kräfte für das Gute einzusetzen.
