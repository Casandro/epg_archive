  description: Folge 102, Tim plant für Jill eine Überraschungsparty, die er zwei Wochen vor ihren tatsächlichen Geburtstag legt. Alles funktioniert nach Plan, die Gäste sind da - doch Jill taucht nicht auf. Sie ist auf dem Weg nach Toledo, um ihren Cousin Henry zu besuchen und ein altes Klavier abzuholen. Der will es allerdings nicht hergeben - und Jill muss aufgeben und erscheint niedergeschlagen und ganze vier Stunden zu spät auf der Party. Tim und ihre Söhne lassen sich etwas einfallen, um sie wieder aufzumuntern.
