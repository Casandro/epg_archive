  title: Host Radiožurnálu
  description: Divadlo Járy Cimrmana slaví v Příchovicích začátek 60. sezony! A také devadesátiny jednoho z jeho zakladatelů Miloně Čepelky. Mimo jiné v přímém přenosu Radiožurnálu pokřtí novou knihu připomínající neuvěřitelných šest dekád souboru. Co přinesla ta zatím poslední a jaká bude nová sezona? Debatují Zdeněk Svěrák, Miloň Čepelka, Petr Brukner, Marek Šimon, Petr Reidinger, Miroslav Táborský, Michal Weigel a Josef Čepelka. Moderuje Vladimír Kroc. (repríza)
