  title: The Incredible Journey - Wissenswertes aus aller Welt
  subtitle: Die Sträflinge von Sidney
  description: |-
    Es mag viele überraschen, aber die ersten Europäer, die sich in Australien niederließen, waren Kleinkriminelle oder, wie sie damals genannt wurden, Sträflinge. Es mag wie ein tragischer Anfang erscheinen, aber diese Gefangenen nutzten tatsächlich die Gelegenheit, in ein fernes Land verbannt zu werden, um ein neues Leben zu beginnen. Aus einer kämpfenden und hungernden Strafkolonie begannen sie, eine Nation aufzubauen. Es gibt viele Geschichten über Mut, Unverwüstlichkeit und Einfallsreichtum, die davon erzählen, wie Menschen ein neues Leben fanden.

