  title: Auf den Spuren großer Komponisten
  subtitle: Russland
  description: |-
    Inspiriert von russischen Volksliedern, trotzten die großen russischen Komponisten Tschaikowski, Borodin, Rachmaninow und Schostakowitsch nach der Machtergreifung durch die Bolschewiki in Russland den vielen politischen Unruhen und der heftigen Unterdrückung im eigenen Land. Ihre künstlerische Freiheit wurde eingeschränkt und ihre Werke teilweise verboten. Sie brachten die Frustrationen und Krisen ihrer Zeit und der Menschen durch ihre Musik zum Ausdruck und gaben diese nie auf. Dank dessen können wir uns auch heute noch an den vielen Werken dieser großen Musiker erfreuen.

