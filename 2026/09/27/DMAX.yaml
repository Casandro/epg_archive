  title: Police Interceptors - Auf Verfolgungsjagd
  subtitle: Harrison holt alle ein
  description: |-
    Paul Bertram verfolgt mit einem Kollegen in der Nähe von Manchester ein gestohlenes Auto. Der Eigentümer hatte das Fahrzeug mit laufendem Motor stehen gelassen. Der Dieb nutzte die Chance und sprang kurzerhand in den Wagen. Und jetzt gibt der Missetäter Vollgas. Doch der Raser überschätzt am Lenkrad seine Fähigkeiten. Deshalb endet die Flucht vor der Polizei in einem Crash. Und Harrison Beverly macht in dieser Folge von "Police Interceptors" einen mutmaßlichen Straftäter dingfest. Der Mann wurde wegen schwerer Körperverletzung zur Fahndung ausgeschrieben.
    GBR 2024
  widescreen: true
- eventId: 1187368
  start: 2026-09-27T01:05:00Z
  stop: 2026-09-27T01:50:00Z
  title: Police Interceptors - Auf Verfolgungsjagd
  subtitle: Mit Geduld und Spucke
  description: |-
    Ein Autofahrer kommt der Aufforderung, anzuhalten, nicht nach. Er ignoriert Sirene, Blaulicht und rote Ampeln. Welche Straßenseite er benutzen muss, scheint der Mann auch nicht zu wissen. Dafür, dass er nur ohne Versicherungsschutz unterwegs sein könnte, geht er enorme Risiken ein. Gibt es noch andere Gründe für seine Flucht? Und in einem Reihenhaus wird offenbar Cannabis angebaut. Die Polizei verschafft sich in Rushden mit schwerer Ausrüstung Zugang zu dem Gebäude und stellt rund 80 Pflanzen sicher. Eine verdächtige Person wird im Arrestwagen untergebracht.
    GBR 2024
  widescreen: true
- eventId: 1187369
  start: 2026-09-27T01:50:00Z
  stop: 2026-09-27T02:45:00Z
  title: Asphalt-Cowboys
  subtitle: Fichte für die Welt
  description: |-
    Thorsten Eckert transportiert Langholzfichten in ein Sägewerk nach Hessen. Dort erwartet man qualitativ hochwertige Ware. Doch wie sich herausstellt, ist einer der Stämme fast auf kompletter Länge verfault. Francis Stirn bereitet sich derweil im kanadischen Chilliwack auf ihre Tour in die USA vor. Denn wer sich unterwegs gesund ernähren will, der muss vorsorgen. Und Manuel Feigl hat die Firma gewechselt. Für den "Asphalt Cowboy" steht in dieser Folge eine Premiere an. Der Trucker ist mit seiner Partnerin Christina Franke zum ersten Mal im Konvoi unterwegs.
    DEU 2024
  widescreen: true
- eventId: 1187370
  start: 2026-09-27T02:45:00Z
  stop: 2026-09-27T03:35:00Z
  title: Asphalt-Cowboys
  subtitle: Schubboden-Schlappe
  description: |-
    Francis Stirn muss auf den letzten Kilometern ihrer Tour in Nordamerika besonders wachsam sein. Denn in der Dunkelheit sind auf den Landstraßen viele Kaninchen unterwegs. Am nächsten Tag soll die deutsche Auswanderin eine Ladung Wassermelonen abholen. Doch die sind noch nicht geerntet. "Asphalt Cowboy" Oli Korb kommt mit seinem 40-Tonner in Karlsruhe weder vor noch zurück. Und Christina Franke hadert mit dem Schubboden. Beim Be- und Entladen verschlechtert sich zunehmend ihre Laune. Auch ein romantischer Grillabend am Parkplatz kann die Stimmung nicht heben.
    DEU 2024
  widescreen: true
