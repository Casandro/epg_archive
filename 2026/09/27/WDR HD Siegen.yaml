  title: Wunderschön! Chiemsee - Wasserwelt und Alpenzauber
  subtitle: 'Moderation: Judith Rakers'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Chiemsee, auch "Bayerisches Meer" genannt, ist der größte See Bayerns und ein wahres Paradies für Natur- und Wasserliebhaber. Er liegt eingebettet in die Hügel des Chiemgaus und bietet eine beeindruckende Kulisse mit den Alpen im Hintergrund. Neben atemberaubender Natur steht die Region für gelebte Tradition und Familienzusammenhalt. Für Wunderschön begibt sich Judith Rakers  auf Spurensuche. Sie will herausfinden, was das besondere Lebens- und Urlaubsgefühl dieser beliebten Ferienregion ausmacht.
- eventId: 556634
  start: 2026-09-27T01:45:00Z
  stop: 2026-09-27T02:30:00Z
  title: Land & lecker - Kulinarische Schätze aus Oberbayern (2)
  subtitle: Grunzochsen und wilde Kräuter
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die zweite Reise geht nach Oberbayern. Die gebürtige Münsterländerin Andrea Meßmer ist der Liebe wegen in die Jachenau im Voralpenland gezogen und hat sich hier mit ihrem Mann Josef eine Yakzucht aufgebaut. Über die Beobachtung der weidenden Yaks hat Andrea ihre Leidenschaft für Wildkräuter entdeckt. Neben den Wildkräutern als kulinarischem Schatz präsentiert sie asiatisches Rind in allen Gängen ihres Landmenüs: Kurzgebratenes vom Yak mit Gute-Heinrich-Gersten-Orzotto und Fichtenspitzen-Topfenknödel an Beeren-Ragout mit Yakherz-Parmesan.'
