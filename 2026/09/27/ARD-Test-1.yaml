  hd: true
  description: 'Die Biografie des Schauspielers und Schriftstellers Christian Berkel ist eine Geschichte zwischen den Welten: Seine Mutter war Jüdin und floh vor den Nationalsozialisten von Berlin über Madrid nach Paris. Sie wurde in das Internierungslager Gurs in den Pyrenäen verschleppt, entging nur knapp der Deportation. Sein Vater war als Arzt beim Roten Kreuz an der Front und verbrachte lange Jahre in russischer Kriegsgefangenschaft. Aufgewachsen zwischen deutscher und französischer Kultur, zwischen Christentum und Judentum, im Berliner Nachkriegsalltag und mit einer traumatisierten Mutter, wusste Berkel lange nicht, wohin er gehörte.'
