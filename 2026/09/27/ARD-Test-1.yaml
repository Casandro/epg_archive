  hd: true
  description: "In Australien lebt das Dromedar Humphrey zusammen mit vielen anderen Tieren auf einer Pflegefarm. Als eines Nachts sintflutartiger Regen fällt und die Deiche brechen, sendet Humphrey einen ohrenbetäubenden Schrei aus, der die Farmbesitzer in Alarmbereitschaft versetzt. In letzter Sekunde können sie die Tiere aus den Ställen holen und vor den Fluten schützen. Wollte das Dromedar bewusst einen Hilfeschrei aussenden? Oder war es einfach in Panik? \nBoris und Milan recherchieren auf der einzigen niederländischen Kamelfarm, während Layla im Netz nach wertvollen Hinweisen sucht und Lina und Jamey einen ziemlich lauten Hörtest machen."
