  description: ​In May 2021, pianist Alexander Malofeev joined conductor Fabio Luisi and the Orchestra Sinfonica Nazionale della Rai for a performance at Turin's Auditorium RAI Arturo Toscanini. The program featured Franz Liszt's Piano Concerto No. 1 in E-flat major and Pyotr Ilyich Tchaikovsky's Symphony No. 6 in B minor, "Pathétique." Malofeev's interpretation of Liszt's concerto was particularly noted for its expressive depth and technical prowess.​
