  title: Die PS Profis - Mehr Power aus dem Pott HotRod mit Stargast Alex Wesselsky, Kurzversion
  subtitle: Die PS Profis - Mehr Power aus dem Pott HotRod mit Stargast Alex Wesselsky, Kurzversion
  description: 'Jean Pierre und Sidney machen ab sofort wieder gute Laune beim Autocheck: Auch in der neuen Staffel von "Die PS PROFIS - mehr Power aus dem Pott" erhält das Ruhrpott-Duo in jeder Sendung den Auftrag von SPORT1-Zuschauern, einen passenden Gebrauchten zu finden. Dabei geben sie Tipps und Tricks, nennen die spezifischen Schwachstellen einzelner Modelle, verraten die Kniffe der Verkäufer und zeigen, wie man für wenig Geld gute gebrauchte Autos kaufen kann.'
