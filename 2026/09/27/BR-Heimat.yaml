  title: BR Heimat - Musiksalon
  subtitle: 'Moderation: Simone Wichert'
  description: |-
    Das Beste aus der Laienmusikszene
    Ob Barock oder Rock, ob Salonmusik oder Swing, ob Blues oder Bigband - gestrichen, geblasen, gezupft - die bayerische Laienmusikszene ist vielfältig, und so ist auch der Musiksalon: Von Studiogästen über Ensembleporträts bis hin zu Berichten von Festivals, Wettbewerben oder aus Musikschulen - wer auch immer zwischen Fladungen und dem Haldenwanger Eck auf hohem Amateur- oder Semiprofi-Niveau musiziert, hat hier ein Forum.
    Mit Simone Wichert
