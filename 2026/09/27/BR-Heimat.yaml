  title: BR Heimat - Heimat lesen
  subtitle: 'Ludwig Thoma: Juristen (1)'
  description: |-
    Ludwig Thoma: Juristen (1)

    "Der an sich so einfache Vorgang des Prügelns" ist Gegenstand der Gerichtsverhandlung im Amtsgericht. Melkstühle, Mistgabeln, Stuhlbeine und Hacklstecken sind die Beweismittel, mit denen die Huglfinger aufwarten. Wie das Urteil in diesem konkreten Fall auch ausfallen mag: Ludwig Thoma hat es jedenfalls verstanden, die Absonderlicheiten des königlich-bayerischen Rechtslebens aufs Korn zu nehmen. "Juristen", unter diesem Titel steht ein kleines Kompendium an Kurzgeschichten aus der Feder des großen bayerischen Literaten und einstigen Anwalts.

    Es liest Christian Jungwirth.

    Als Podcast verfügbar
