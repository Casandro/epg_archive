  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Diesmal dreht sich alles um grünes Gemüse. Viele grüne Lebensmittel gelten als besonders gesund, zudem enthalten sie Chlorophyll. Wie so viele andere sekundäre Pflanzenstoffe leistet auch Chlorophyll einen wichtigen Bestandteil für eine gesunde Ernährung. Grüne Gemüse rangieren in der Beliebtheitsskala bei den Menschen in Deutschland aber eher auf den unteren Rängen. NDR Fernsehkoch Tarik Rose und Ernährungs-Doc Matthias Riedl stellen einige der gesündesten Produkte unter den grünen Gemüsen vor und zeigen, wie man daraus leckere Rezepte zubereiten kann.
