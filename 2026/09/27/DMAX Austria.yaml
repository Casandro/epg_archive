  title: Die Pythonjäger - Einsatz in den Everglades
  subtitle: Im Liebesrausch
  description: |-
    Im Winter ziehen sich die Pythons in Florida bei deutlich niedrigeren Temperaturen in Erdlöcher und Baumhöhlen zurück. Dort legen sie oft auch ihre Eier ab. Und wenn sich die Reptilien weiter ungehindert vermehren, gerät im "Sunshine State" das Ökosystem aus dem Gleichgewicht. Deshalb wollen Dusty Crum und seine Mitstreiter vor der Paarungszeit so viele Würgeschlangen wie möglich einfangen. Die Abenteurer halten im Big-Cypress-Reservat Ausschau nach der invasiven Spezies. Um das Ergebnis des Vorjahres zu toppen, fehlen dem Team noch vier ausgewachsene Exemplare.
    USA 2020
