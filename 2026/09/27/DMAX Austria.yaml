  title: Fare Dodgers - Die Kontrolleure
  subtitle: Die doppelte Gratisfahrt
  description: |-
    Kontrolleure und Sonderermittler nehmen Londons Schwarzfahrer ins Visier. Ein Mann steht besonders im Fokus: Er nutzt immer wieder die Freifahrtkarte einer älteren Frau und bestreitet hartnäckig jede Schuld. Mithilfe von Videoaufnahmen und Fahrtdaten verfolgen die Ermittler seine Route durch die Stadt, um ihn auf frischer Tat zu ertappen. Gleichzeitig geraten die Teams bei Kontrollen immer wieder in schwierige Situationen: Fahrgäste versuchen zu entkommen, verstecken sich, machen widersprüchliche Angaben zu ihrer Identität oder reagieren aggressiv, wenn sie ohne gültiges Ticket erwischt werden.
