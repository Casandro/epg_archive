  title: The Last Woodsmen - Holzfäller am Limit
  subtitle: Hop oder Top
  description: |-
    Neun Wochen konnten Jared Douglas und seine Crew wegen der hohen Waldbrandgefahr nicht arbeiten. Nun bricht der Herbst an und der Betrieb läuft wieder auf Hochtouren. Jim Gardner und Rob Winger haben einen Riesen-Lebensbaum ausgemacht, der hohe Einnahmen verspricht. Die Thuja wiegt mehr als 100 Tonnen. Sie zu fällen, wird eine Herausforderung. Jared verhandelt unterdessen mit Chief Jerry Jack von der Mowachaht-Muchalaht First Nation. Sein Volk sucht jemanden, der eines ihrer Gebiete abholzt. Erhält Jareds Forstunternehmen im Pazifischen Nordwesten den Zuschlag?
    USA 2025
