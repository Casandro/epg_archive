  title: The Last Woodsmen - Holzfäller am Limit
  subtitle: Volltreffer
  description: |-
    In gut sechs Wochen wird der Pazifische Nordwesten in Dauerfrost versinken. Um seine Ziele bis dahin zu erreichen, teilt Jared Douglas seine Crew auf zwei Erntegebiete auf. Neben dem Forever Claim sollen seine Männer nun auch am Kachelot Creek Bäume fällen und abtransportieren. Die 2.000 Hektar Wald gehören zum Gebiet der Mowachaht-Muchalaht First Nation. Dort sind hohe Einnahmen zu erwarten. Doch die Infrastruktur in der Region ist veraltet. Eine instabile Brücke könnte unter dem Gewicht der schweren Maschinen zusammenbrechen. Das will der Forstunternehmer nicht riskieren.
    USA 2025
  widescreen: true
