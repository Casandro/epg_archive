  title: 'Naked Survival Special: Überleben im Doppelpack'
  description: "Kein Wasser, keine Nahrung, keine Kleidung: Zwei zufällig zusammengewürfelte Paare stellen sich in Panama dem ultimativen Survival-Test und schlagen sich 21 Tage lang durch die Wildnis. Bei dieser Herausforderung geht es für die Kandidaten sprichwörtlich ums nackte Überleben, denn im düsteren Mangrovensumpf lauern an jeder Ecke Gefahren. Bei extrem hoher Luftfeuchtigkeit bekommen es die Männer und Frauen auf der Tour mit Insekten und Giftschlangen zu tun, und an der Küste lauern angriffslustige Riffhaie. Die fehlende Garderobe wird dabei schnell zur Nebensache, denn diese Prüfung können die Abenteurer nur dann bestehen, wenn sie sich von Anfang an auf das Wesentliche konzentrieren. \nUSA 2014"
