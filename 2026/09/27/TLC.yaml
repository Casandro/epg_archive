  stop: 2026-09-27T23:05:00Z
  title: Tierisch verschluckt - Rettung für Fellnasen
  subtitle: Mitgehangen, mitgefangen!
  description: |-
    Ein Angelausflug endet für Husky-Dame Tinkerbell beinahe in einer Katastrophe: Ein Angelköder mit scharfen Widerhaken steckt in ihrem Magen und muss millimetergenau geborgen werden, bevor er lebensgefährliche Verletzungen verursacht. Kaum ist dieser heikle Einsatz geschafft, wartet schon die nächste Geduldsprobe auf Dr. G: Boston-Terrier Billie niest ununterbrochen - und tatsächlich entdeckt der Endoskopie-Spezialist erst einen stacheligen Grashalm tief im Ohr und dann einen zweiten Fremdkörper in der Nase. Präzisionsarbeit auf engstem Raum, bei der selbst kleinste Fehler große Folgen haben können.
    CAN 2024
