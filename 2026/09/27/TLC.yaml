  title: 'Cake Boss: Buddys Tortenwelt'
  subtitle: Die Enten sind los!
  description: "Jedes Jahr bringt das beliebte Gummienten-Wettrennen Hunderte von Leuten am Ufer eines Flusses in New Jersey zusammen. Und in diesem Jahr wird die Zieleinfahrt besonders süß, weil Buddy dort mit einer gigantischen Enten-Torte auf die Teilnehmer wartet! Joe und Grace nehmen inzwischen eine Kuchenbestellung aus Montreal, Kanada, entgegen: Die Kunden, ein junges Mädchen und ihre Familie, veranstalten eine Gala, um Spendengelder für Diabetes bei Kindern zu sammeln und das Bewusstsein für diese Krankheit zu erhöhen. Den Event möchten sie mit einer ganz besonderen Torte krönen. Doch als das Kunstwerk nach Montreal geliefert wird, läuft nicht alles glatt.  \nUSA 2018"
