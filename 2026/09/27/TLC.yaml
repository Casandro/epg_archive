  title: My Strange Addiction
  subtitle: Glibber, Schuppen und Gras
  description: |-
    In dieser Folge treiben drei außergewöhnliche Leidenschaften erstaunliche Blüten: Cassy setzt beim Dating auf "Vabbing" und nutzt dabei körpereigene Pheromone als ganz persönliches Parfüm. Ob das Männer wirklich anlockt, soll eine Sexualtherapeutin klären. Socratis dagegen teilt sein Zuhause mit 130 Schlangen, die für ihn zur Familie gehören. Sehr zum Entsetzen seiner Mutter, die um die Sicherheit der Enkel fürchtet. Und Kaylyn bevorzugt Grünzeug direkt von der Wiese: Die 18-Jährige isst täglich haufenweise Gras und peppt damit ihren Speiseplan auf, was bei der Verwandtschaft auf größtes Unverständnis stößt.
    USA 2025
  widescreen: true
