  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Angie - Teil 1
  description: |-
    Essen ist das Einzige, worauf sich Angie noch freuen kann. Sie weiß, dass sie bei ihrem extremen Übergewicht dringend Hilfe braucht und hat sich einen Termin bei Dr. Now geben lassen. Und der Experte redet Klartext: Mit ihren 292 Kilo befindet sich die 39-Jährige in einer lebensgefährlichen Situation und muss ab sofort strenge Diät halten. Doch mitten in der Kur macht sich Angies Mann Justin aus dem Staub, weil die beiden wegen seiner Drogenabhängigkeit in Streit geraten waren. Angie bricht die Diät ab und meldet sich erst drei Monate später wieder bei Dr. Now. Wird er sie weiterbehandeln?
    USA 2021
  widescreen: true
- eventId: 1183205
  start: 2026-09-27T16:20:00Z
  stop: 2026-09-27T18:15:00Z
  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Angie - Teil 2
  description: |-
    Mit fast 300 Kilo stand Angie kurz davor, sich zu Tode zu essen und versuchte, ärztliche Hilfe zu bekommen. Nach einem gescheiterten Diätversuch bei Dr. Now hat sich die 39-Jährige von ihrem Mann Justin getrennt und möchte nun eine weitere Chance, um zu einer Magen-OP zugelassen zu werden. Der Adipositas-Facharzt willigt ein, verordnet aber eine toxikologische Untersuchung, die ergibt, dass Angie Betäubungsmittel konsumiert. Sie muss einen Entzug machen und außerdem einen Psychotherapeuten aufsuchen, der herausfindet, dass Angie Suizidgedanken hat. Kann ihr neuer Freund Dave sie wieder aufbauen?
    USA 2021
  widescreen: true
- eventId: 1183227
  start: 2026-09-27T18:15:00Z
  stop: 2026-09-27T19:15:00Z
  title: 'Die Pfund-Schwestern: Unser Leben mit 500 kg'
  subtitle: Mit roten Augen zum Altar?
  description: |-
    Kurz vor ihrer Hochzeit setzt Amy alles auf eine Karte: Sie lässt ihre Augenfehlstellung operieren und erfährt erst beim Arzt, dass ein Eingriff an beiden Augen nötig ist. Die OP gelingt, doch die Heilung verläuft langsamer als erhofft. Zwei Tage vor dem Ja-Wort hat sie immer noch Schmerzen und entzündete Bindehaut. Zur Ablenkung gibt es pinke Haare und Hochzeitsvorbereitungen mit reichlich Chaos. Während Amys Söhne bei der Probe lieber ihr eigenes Programm fahren, bleibt eine entscheidende Frage offen: Wird Tammy trotz des Streits zur Hochzeit kommen? Amy hofft, dass weder Augen, Kinder noch Familie Ärger machen.
    USA 2025
  widescreen: true
- eventId: 1183228
  start: 2026-09-27T19:15:00Z
  stop: 2026-09-27T20:10:00Z
  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Chuck und Paula
  description: |-
    Vor der Magenbypass-OP wog Chuck rund 317 Kilo, nach dem Eingriff nahm er binnen eines Jahres 193 Kilo ab und ist von seinem Wunschgewicht nicht mehr weit entfernt. Der 46-Jährige wollte vor allem weiter abnehmen, um seine Ehe mit Nissa zu retten. Doch der Versuch ist gescheitert: Nissa hat die Scheidung vollzogen und das Sorgerecht für ihren gemeinsamen Sohn erhalten. Seine Familie war Chucks Ein und Alles. Sie zu verlieren, bricht ihm das Herz. Trotzdem versucht er, sein Leben alleine auf die Reihe zu bekommen. Doch die Versuchung ist groß, aus Frust wieder zu Kalorienbomben zu greifen. Wird Chuck es trotzdem schaffen?
    USA 2014
  widescreen: true
- eventId: 1183229
