  stop: 2026-09-27T22:40:00Z
  title: Tierisch verschluckt - Rettung für Fellnasen
  subtitle: Der goldene Zopf
  description: |-
    Als Hündin Ava plötzlich das Futter verweigert, ahnt niemand, was sich in ihrem Magen versteckt. Dr. G geht mit seinem Video-Endoskop auf Spurensuche - und fördert einen Strumpf nach dem anderen zutage. Am Ende sind es fünf, sehr zur Überraschung ihrer Besitzer. Wenig später wartet der nächste Notfall: Bei Pitbull-Mischling Thor sieht auf den Röntgenbildern alles nach einem Tumor aus. Doch dann entdeckt Dr. G einen langen, goldblonden Fremdkörper, der bis in den Dünndarm reicht. Ob sich das rätselhafte Fundstück ohne Operation bergen lässt, entscheidet sich in einem nervenaufreibenden Eingriff.
    CAN 2024
  widescreen: true
