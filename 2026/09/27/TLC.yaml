  title: Dating ohne Grenzen - Auswandern für die Liebe
  subtitle: Das Herz spricht die Wahrheit
  description: |-
    Arielas Eltern sind seit zwei Tagen in Äthiopien, doch es läuft nicht gut. Eigentlich wollte die frischgebackene Mutter ihre Probleme mit Biniyam nicht erwähnen und zeigen, dass sie eine glückliche Familie sind. Doch Mama Janice ahnt, dass etwas nicht stimmt. Außerdem ist sie entsetzt über die Wohnung, in der Ariela und ihr Enkel leben. Sie ist winzig, spartanisch ausgestattet, und die Küche quasi nicht vorhanden. In Jordanien scheinen sich die Wogen zu glätten. Obwohl Brittany ihren Verlobten gar nicht treffen und eigentlich Schluss machen wollte, hat sie sich nun doch zu einer Aussprache entschlossen.
    USA 2020
