  title: Abgründe - Unfassbare Verbrechen
  subtitle: Tod in der Notaufnahme
  description: |-
    An einem Sommerabend in Cleveland, Ohio, liegt Matthew Podolak zuhause, weil ihn schreckliche Rückenschmerzen plagen. Seine Verlobte Holly findet ihn auf dem Boden und ruft die Sanitäter, die ihn sofort in die Notaufnahme bringen. In der Klinik wirkt Mat wie betrunken, obwohl der 31-jährige Naturbursche nie Alkohol anrührt. Die Erstellung eines Blutbildes lässt auf eine starke Übersäuerung und Infektion schließen - doch sein Zustand verschlechtert sich rapide, und die Ärzte sind ratlos. Plötzlich versagen Mats Organe. Der junge Mann bekommt Krämpfe, bevor sein Körper schließlich aufgibt.
    DEU 2019
  widescreen: true
- eventId: 1183182
  start: 2026-09-27T13:25:00Z
  stop: 2026-09-27T14:25:00Z
  title: Abgründe - Unfassbare Verbrechen
  subtitle: Tödlich verbunden
  description: "Als Wall Street-Motivationscoach Jeffrey Locker seine Frau Lois anruft, um von einer Autopanne zu berichten, hört sie seine Stimme zum letzten Mal. Am nächsten Morgen findet die Polizei Jeffs Leiche in East Harlem. Er wurde mit einem Kabel stranguliert und hat sechs Stichwunden in der Brust. Zunächst geht die Polizei von einem verunglückten Überfall aus, denn seine Bankkarte fehlt, doch die Vorgehensweise ist für einen Straßenraub sehr merkwürdig. Noch merkwürdiger ist das Verhalten seiner Frau, als ihr zwei Ermittler die Schreckensnachricht überbringen. Statt zusammenzubrechen, zeigt Lois keine Regung, und auch die Kinder lässt der Tod ihres Vaters vollkommen kalt.  \nDEU 2019"
  widescreen: true
- eventId: 1183183
