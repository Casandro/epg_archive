  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Jagd nach den Schlangenkönigen
  description: "Tief im Dschungel von Guatemala liegt eine mysteriöse Maya-Metropole verborgen: die Ruinenstadt \"El Mirador\". Forscher gehen davon aus, dass es sich dabei sogar um die größte Siedlung der westlichen Hemisphäre handelt. Auch die Gräber der legendären Schlangenkönige sollen sich hier befinden. Gemeinsam mit Archäologe Dr. Richard Hansen, der die Arbeiten in \"El Mirador\" leitet, geht Abenteurer Josh Gates der Frühphase der Maya-Kultur auf den Grund. Eine Spurensuche mit Hindernissen, denn die gesamte Stätte mitsamt Pyramiden ist seit rund 2.000 Jahren von dichtem Regenwald überwuchert. \nUSA 2019"
  widescreen: true
