  title: Summit Fever
  description: |-
    Die jungen Bergsteiger Jean-Pierre (Michel Biel) und Michael (Freddie Thorp) haben sich ein großes Ziel gesteckt. Im Grenzgebiet zwischen Frankreich, Italien und der Schweiz wollen sie drei berühmte Alpengipfel bezwingen: den Eiger, das Matterhorn und den Mont Blanc. Auch die erfahrenen Alpinisten Leo (Ryan Phillippe) und Natascha (Hannah New) sind Teil der Seilschaft. Aber das ambitionierte Kletter- und Skitourenabenteuer nimmt eine dramatische Wendung. In eisiger Höhe gerät die Gruppe in ein heftiges Unwetter! Da eine Rettung aus der Luft vorerst unmöglich ist, müssen sich die Bergsportler selbst aus der lebensbedrohlichen Lage befreien. - Berg-Thriller aus britischer Produktion.
    GBR 2022
