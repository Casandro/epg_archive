  title: Xena
  subtitle: Teuflische Taten aus früherer Zeit
  description: |-
    Als Xena und Gabrielle dabei helfen, die Stadt Actus zu verteidigen, kommen der Kriegerprinzessin die Kampftechniken sowie die strategische Vorgehensweise der feindlichen Gruppe verblüffend bekannt vor. Aber wie ist das möglich? Einmal mehr wird Xena mit den Schatten ihrer gewalttätigen Vergangenheit konfrontiert. Auch der schmerzhafte Tod von Xenas Ex-Geliebtem Borias (Marton Csokas) und ein längst vergangener Kampf gegen die Zentauren sind indirekt mit der aktuellen Situation verstrickt. In Flashbacks kommen darüber hinaus prekäre Details zu Xenas Bluttaten aus früherer Zeit ans Licht...
    USA 1999
  widescreen: true
