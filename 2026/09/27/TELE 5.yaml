- eventId: 1187365
  start: 2026-09-27T02:05:00Z
  stop: 2026-09-27T02:45:00Z
  title: Xena
  subtitle: Hinter Gittern
  description: |-
    Die Kriegerprinzessin wird von einem dunklen Kapitel ihrer Vergangenheit eingeholt. Für den Mord an Thalassa (Katrina Browne) soll Xena lebenslang hinter Gitter. Während sich Xena reumütig ihrem Schicksal im Kerker zu ergeben scheint, setzt Gabrielle Himmel und Hölle in Bewegung, um ihre Freundin aus der ausweglosen Situation zu befreien. Die Bardin gibt sich als Heilerin aus, um Zugang zum berüchtigten Gefängnis von "Shark Island" zu erlangen. Dort decken die Heldinnen eine Verschwörung auf, die Xenas Rettung bedeuten könnte: Offenbar lebt Thalassa noch!
    USA 1998
  widescreen: true
