- eventId: 1187362
  start: 2026-09-27T00:05:00Z
  stop: 2026-09-27T00:45:00Z
  title: Hercules
  subtitle: Die Höhle der Echos
  description: |-
    Melina (Mandy Gillette) ist in der Höhle der Echos verschwunden. Hercules und Iolaus ziehen los, um die verschollene Tochter zu retten. Begleitet werden die Männer von dem jungen Poeten Parentheses (Owen Black). Der Dichter und Schriftsteller ist ein großer Fan von Hercules und Iolaus. Bei der Bergungsaktion hängt er seinen Idolen wie eine Klette an den Fersen, wobei er im Gespräch jede Menge Stoff für neue Abenteuergeschichten sammelt. Als das Trio schließlich Melina findet, gibt es eine große Überraschung, wer sich tatsächlich hinter dem vermeintlich brüllenden Monstrum in der Höhle verbirgt.
    USA 1996
  widescreen: true
