- eventId: 551445
  start: 2026-09-27T05:30:00Z
  stop: 2026-09-27T05:55:00Z
  title: Wissen macht Ah!
  subtitle: Wie sieht's denn hier aus!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Ralph kann so nicht arbeiten! Das Studio ist ihm viel zu aufgeräumt. Und deshalb nutzt er die Gelegenheit und bringt ein bisschen mehr Chaos hinein. Und - was für ein Zufall: Auch inhaltlich geht es heute um Chaos und Ordnung. Das gibt es nämlich auch in der Physik. Mit einem Versuch zeigen Clarissa und Ralph das verblüffende Verhalten von fließendem Wasser. Außerdem:
    * Wie funktioniert ein Schrittzähler
    * Warum bewegen Hasen/Kaninchen ihre Nasen so oft?
    * Wieso spritzt es, wenn man ins Wasser springt?
    * Ist man beim Laufen mit dem Hoch- oder dem Tiefstart schneller und warum?
    * Was ist eine Sisyphusarbeit?
