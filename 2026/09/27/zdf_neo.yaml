  description: |-
    Deutschland / Großbritannien 2016
    "Terra X" geht gemeinsam mit der BBC auf eine atemberaubende Weltreise, um extreme Lebensräume und ihre Bewohner in ihrer Einzigartigkeit zu dokumentieren.

    In dieser Folge geht es um die Inseln. Vom Meer umgeben, entwickelten sie Welten für sich. Sie sind Heimat hoch spezialisierter Wildtiere. Ob Wüsteneiland, Gletscher- oder Vulkaninsel: Durch ihre Isolation sind eigenständige Lebensformen entstanden.
