  description: |-
    Deutschland 2024
    Norman wurde in der Schule gemobbt und leidet noch heute. Wissenschaftsjournalist Eric Mayer trifft Norman und stellt sich die Frage: Wie schaffen es andere Menschen in unseren Kopf?

    Beim Mobbing kommen Gruppendynamiken zum Tragen, die auch in anderen Kontexten stattfinden: Menschen schließen sich der Gruppe an, obwohl sie vielleicht anderer Meinung sind. Dem geht Eric Mayer im Gespräch mit der Sozialpsychologin Selma Rudert nach.
