  description: |-
    USA 2016
    Lee Gates ist ein bekannter Finanzmoderator, der mit seiner Show Börsentipps gibt. Als Zuschauer Kyle durch eine Empfehlung sein gesamtes Geld verliert, stürmt er das Studio.

    Kyle nimmt Gates als Geisel und fordert, dass sich der Aktienkurs noch am selben Tag erholt - andernfalls droht er mit tödlicher Gewalt. Doch kann ein verzweifelter Anleger so Gerechtigkeit erzwingen?
