  title: Progetto Scienza Stem - ep.4 Cemento
  subtitle: Stem - ep.4 Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo d
  description: "ella ricerca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
- eventId: 1196731
