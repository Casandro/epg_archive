  subtitle: Progetto Scienza 2022 I luoghi della Scienza - p. 01 - Alla ricerca della Biodiversità - Un viaggio attraverso l'Italia della ricerca e della sperimentazione scientifica. Un racconto che evidenzia lo stret
  description: "to rapporto tra scienza e territorio e ci porta alla scoperta dei luoghi dove operano i ricercatori e degli ambienti naturali oggetto delle loro ricerche. Il racconto è affidato alla conduttrice Chiara Buratti che esplora i luoghi della scienza italiana svelandone l'orizzonte culturale e naturalistico e presentando le storie di passione per la scienza dei protagonisti dei più importanti progetti di ricerca. In questa puntata dedicata alla biodiversità, cominciamo con il conoscere il nostro patrimonio marino e terrestre costiero visitando l'Area Marina Protetta di Punta Campanella in Campania. Lo facciamo attraverso il racconto del Direttore, Alberico Simioli, del biologo marino dell'area marina, Domenico Sgambati, e del botanico ambientale e docente all'Università di Napoli Federico II, Veronica De Micco. Per analizzare la biodiversità delle specie selvatiche andiamo poi in Sardegna, a Bonassai in provincia di Sassari, dove incontriamo Marco Roberto Muzzeddu, veterinario di Agenzia Forestas, che ci racconta l'attività del Centro Allevamento e Recupero Fauna Selvatica. Ancora in Sardegna, ma questa volta nel territorio di Bosa, in provincia di Oristano, scopriamo infine come l'Istituto Superiore per la Protezione e la Ricerca Ambientale porta avanti, insieme a diversi partner, tra cui Grefa e Forestas, il progetto \"Aquila a-Life\" per la reintroduzione in Sardegna dell'aquila di Bonelli. - \n\nUn programma di Federica De Maria, con la collaborazione di Giuseppe Cembalo, e Diego Garbati, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Mario Ferrari, conduce Chiara Buratti"
