  title: 'Il Tutto e il Nulla (2a parte): Il Nulla'
  subtitle: 'Jim Al-Khalili ci conduce in un viaggio epico per scoprire la vera dimensione di tutto e la straordinaria scienza dietro lo spazio vuoto. Questo episodio si occupa della scienza ai limiti della percezione '
  description: "umana, dove giacciono i misteri più profondi dell'universo. Si propone di rispondere a una domanda molto semplice: che cos'è il nulla? Il suo viaggio termina forse con la più profonda intuizione sulla realtà che l'umanità ha fatto. Tutto è venuto dal nulla. - \n\n"
