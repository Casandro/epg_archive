  description: "nze, Stati Uniti e Unione Sovietica, ma anche quella tra due scienziati. Inizialmente l'Unione Sovietica sembra prendere il sopravvento, grazie al geniale ingegnere missilistico Sergei Korolev, ma il presidente americano Kennedy è deciso a portare l'uomo sulla Luna e si affida al brillante scienziato tedesco Wernher Von Braun. Quest'ultimo è considerato l'artefice della missione spaziale Apollo 11 che sancirà definitivamente la superiorità tecnologica americana in questo campo. - \n\n"
