  title: Progetto Scienza Newton Edu (pt. 01) Ani
  subtitle: 'Progetto Scienza Newton Edu (pt. 01) Animali: Convivere con i parassiti. - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata del ciclo dedicato alla Zool'
  description: "ogia, Davide Coero Borga e il Professor Biagio D'Aniello, zoologo dell'Università Federico II di Napoli, ci conducono alla scoperta delle simbiosi in natura, dei rapporti di parassitismo e mutualismo che caratterizzano le varie specie. Scopriamo anche come le specie aliene introducono nuovi parassiti in altri ambienti e come funziona la manipolazione del parassita sulla specie ospite, pratica che può arrivare fino all'induzione al suicidio. Donato Grasso, zoologo dell'Università di Parma spiega come operano le formiche schiaviste, che colonizzano e predano uova di altri formicai. A Varese, con Adriano Martinoli, zoologo dell'Università degli Studi dell'Insubria, mostriamo invece il caso dello scoiattolo grigio americano, i cui parassiti rischiano di far estinguere lo scoiattolo rosso italiano. - \n\nUn programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Giuseppe Cembalo, Federica De Maria, Mario Ferrari, Daniela Mazzoli, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga con la partecipazione di Anna Pancaldi"
