- eventId: 1196734
  start: 2026-09-27T02:00:00Z
  stop: 2026-09-27T03:00:00Z
  title: Progetto Scienza 2023 Racconti di Scienz
  subtitle: Progetto Scienza 2023 Racconti di Scienza - p. 07 - Natura non facit saltus - Registrato in occasione del Festival della Scienza di Roma 2015, "Natura non facit saltus, Scientia facit" è un particolare esp
  description: "erimento teatrale in cui l'astrofisico Giovanni Bignami, con l'aiuto degli attori Marta Vitalini e Concetto Cafiore, conduce il pubblico lungo un percorso di scienza e conoscenza, fatto di balzi, intuizioni, accelerazioni, quello che ha portato l'essere umano a conoscere le vastità dell'universo di cui rappresenta una piccolissima, infinitesimale parte. La meraviglia dell'intelletto e le conquiste della ricerca. Un'occasione particolare in cui l'arte della scienza e quella teatrale trovano un punto d'incontro, di dialogo. Il titolo (in italiano, \"La natura non procede per salti, la scienza sì\") fa il verso a Linneo e Leibniz. Se l'evoluzione umana ha un cammino piano e costante, che va di pari passo all'evoluzione dell'universo, la conoscenza dell'uomo procede invece per balzi, intuizioni, accelerazioni, portando l'essere umano a conoscere le vastità dell'universo di cui rappresenta una piccolissima, infinitesimale parte. È la meraviglia dell'intelletto. Nell'astronomia e nell'astrofisica questo è particolarmente evidente perché l'uomo è arrivato a concepire e poi a provare ipotesi che sono più grandi, molto più grandi, dell'uomo stesso. - \n\nUn programma di Diego Garbati e Daniela Mazzoli, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Alberto Polimanti, conduce Anna Pancaldi"
- eventId: 1196735
  start: 2026-09-27T03:00:00Z
  stop: 2026-09-27T03:30:00Z
  title: Memex Nautilus - Polveri Sottili, killer
  subtitle: 'Memex Nautilus - Polveri Sottili, killer nell'' aria - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l''astrofisico e divulgatore Luca Perri andiamo alla scoperta '
  description: "del mondo che ci circonda e delle sue regole. In questa puntata parliamo di Polveri Sottili. Il 'particolato' è un killer silenzioso e invisibile. In un anno uccide più delle sigarette o degli incidenti stradali. Si presenta sotto forma di una miscela di particelle solide e liquide disperse nell'atmosfera. Minore è la dimensione della particella, maggiore è la sua capacità di penetrazione nel sistema respiratorio. E allora che fare? Ne parliamo con Giorgio Cattani, responsabile sezione monitoraggio e qualità dell'aria dell'Ispra, e con Saverio De Vito, coordinatore scientifico del progetto Air-Heritage dell'Enea. Incontriamo anche Gian Paolo Gobbi e Francesca Barnaba, dell'Istituto di Scienze dell'Atmosfera e del Clima del Cnr, per raccontare la scienza del monitoraggio ambientale, e Marcello Vitale responsabile del laboratorio di modellistica ambientale dell'Università di Roma Sapienza, che ha da poco mappato il ruolo della vegetazione urbana nella cattura del PM10 in un quartiere di Roma. Anna Pancaldi ci racconta infine il grande smog di Londra del 1952 e la drammatica storia dell'Ilva Football Club. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Catia Barone, Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
- eventId: 1196736
  start: 2026-09-27T03:30:00Z
  stop: 2026-09-27T04:00:00Z
  title: Progetto Scienza Newton Edu (pt. 01) Ani
  subtitle: 'Progetto Scienza Newton Edu (pt. 01) Animali: Convivere con i parassiti. - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata del ciclo dedicato alla Zool'
  description: "ogia, Davide Coero Borga e il Professor Biagio D'Aniello, zoologo dell'Università Federico II di Napoli, ci conducono alla scoperta delle simbiosi in natura, dei rapporti di parassitismo e mutualismo che caratterizzano le varie specie. Scopriamo anche come le specie aliene introducono nuovi parassiti in altri ambienti e come funziona la manipolazione del parassita sulla specie ospite, pratica che può arrivare fino all'induzione al suicidio. Donato Grasso, zoologo dell'Università di Parma spiega come operano le formiche schiaviste, che colonizzano e predano uova di altri formicai. A Varese, con Adriano Martinoli, zoologo dell'Università degli Studi dell'Insubria, mostriamo invece il caso dello scoiattolo grigio americano, i cui parassiti rischiano di far estinguere lo scoiattolo rosso italiano. - \n\nUn programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Giuseppe Cembalo, Federica De Maria, Mario Ferrari, Daniela Mazzoli, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga con la partecipazione di Anna Pancaldi"
