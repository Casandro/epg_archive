  description: 'e un esperimento, provando e riprovando. Con gli esperimenti la scienza ha compiuto tutti i suoi passi fin qui, ed è in fondo il metodo sperimentale a distinguerla dalle altre discipline umane. In questa puntata di "Prospettive", la giornalista scientifica Silvia Bencivelli racconta cinque esperimenti che ci hanno fatto progredire nella conoscenza del nostro mondo. Con lei, gli esperti: Mauro Capocci, storico della scienza dell''Università di Pisa, Patrizia Guarnieri, storica dell''Università di Firenze, Antonio Zoccoli, presidente dell'' Istituto Nazionale di Fisica Nucleare, Alessandro Volpone, storico della scienza dell''Università di Bari e Matteo Cerri, neurofisiologo dell'' Università di Bologna. "Prospettive" è il programma scientifico di Progetto Scienza di Rai Cultura che in ogni puntata ci presenta le scoperte, le invenzioni, le idee di scienziati famosi e misconosciuti che con le loro teorie e i loro esperimenti hanno cambiato il mondo in cui viviamo e ci hanno aiutato a capirlo meglio. Gli episodi narrati in ogni puntata sono parte del patrimonio di conoscenza e progresso scientifico ma raccontano anche le vicende e la natura di quegli esseri umani che guardando il cielo o le profondità della Terra, il dito che indica la Luna e anche la Luna, sono riusciti ad ampliare il nostro orizzonte. - un programma di Silvia Bencivelli, Daniela Mazzoli con la collaborazione di Fiorella Cappelli, Diego Garbati, Pierluigi Pantini; a cura di Eleonora Ottaviani; capo progetto Diego Garbati; regia Pierluigi Pantini; conduce Silvia Bencivelli'
