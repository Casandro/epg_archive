  title: Progetto Scienza 2023 Racconti di Scienz
  subtitle: 'Progetto Scienza 2023 Racconti di Scienza - p. 03 - I ragazzi di Fermi - Dal Festival della scienza di Genova: I ragazzi di Fermi. I ragazzi di Fermi è uno spettacolo teatrale di narrazione scientifica ide'
  description: "ato e condotto da Eugenio Coccia, professore ordinario di fisica sperimentale e Rettore del Gran Sasso Science Institute, che narra la leggenda dei giovani italiani che hanno fatto la storia della scienza moderna. Nell'Italia degli anni Trenta, all'Istituto di Fisica di via Panisperna a Roma, Enrico Fermi riunisce un gruppo di giovani fisici le cui scoperte rivoluzioneranno la fisica nucleare. Ma chi erano questi ragazzi? E di cosa si occupavano? Il professor Eugenio Coccia, rettore della nuova Scuola Universitaria Superiore \"Gran Sasso Science Institute\", ci accompagna in un affascinante viaggio nelle grandi scoperte della fisica che hanno segnato la storia del Novecento. Sul palco insieme a lui la band Crazy Stumpin'Club, che interpreta i più grandi successi musicali degli anni '20 e '30, e gli alunni della Scuola Primaria \"P. Santullo\" - Istituto Comprensivo \"Molassana\" di Genova, che impersonano protoni, elettroni e neutroni, in una coinvolgente rappresentazione dei più complessi processi della fisica. - \n\nUn programma di Diego Garbati e Daniela Mazzoli, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Alberto Polimanti, conduce Anna Pancaldi"
