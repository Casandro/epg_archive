  description: "egnato dalle strade sterrate rosse e sabbiose, asciutto e ventoso. Una terra che cambia costantemente per via dell'erosione degli agenti atmosferici, una costellazione di aree faunistiche, geologiche e climatiche tutte diverse ed estreme. Un enorme spazio vuoto che rappresenta anche una ricchezza dal punto di vista scientifico. - \n\n"
