  title: Pearl Harburg - Deutschland nach 9/11
  subtitle: Im Visier (3/5)
  description: Wer am 11. September 2001 alt genug war, erinnert sich an den Moment, als man von den Anschlägen erfahren hat. Als die Welt die Bilder von den brennenden Türmen live im Fernsehen verfolgt hat. Podcast-Host Konstanze Nastarowitz ist 2001 sieben Jahre alt. Sie bekommt zwar mit, dass die Erwachsenen mit gedämpften Stimmen reden und ständig der Fernseher läuft. Doch erst viel später wird ihr klar, dass sich an diesem Nachmittag die Welt verändert.
