  title: vertikal - horizontal. Glaubens- und Gewissensfragen
  subtitle: Das Magazin aus Religion und Gesellschaft
  description: |-
    Sterbebegleitung und assistierter Suizid - Eine Sendung von Brigitte Lehnhoff und Florian Breitmeier

    Seit dem Urteil des Bundesverfassungsgerichts im Februar 2020 wird in einer breiteren Öffentlichkeit über die Möglichkeit zum assistierten Suizid diskutiert. Prominente Beispiele wie das der Kessler-Zwillinge machen immer wieder deutlich: Menschen wollen für sich das Recht in Anspruch nehmen, selbstbestimmt aus dem Leben zu gehen. Das steht jedoch im Widerspruch zum Selbstverständnis christlicher Sterbebegleitung.
