  title: Na nedělní vlně z Pardubic
  description: Na nedělní vlně z Pardubic vám během září představíme čtyři pomyslné životní křižovatky. Uslyšíte příběhy, ve kterých hlavní roli hrály povodně, stěhování celé rodiny do zahraničí, ale i zdraví a nemoci. A v každém vyprávění najdete momenty síly a odhodlání. Každou zářijovou neděli po 18. hodině s Milenou Vápeníkovou.
