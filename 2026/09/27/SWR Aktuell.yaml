  description: "15:00\nAktuelles & Sport\n\n15:30\nSWR1 Leute - Spurensuche: So erging es den jüdischen Vorfahren. Mit Adam Klein und Thomas Koch\nWie erging es meinen jüdischen Vorfahren? Und wer hat früher in meiner Wohnung gelebt? Diese Fragen brachten Adam Klein und Thomas Koch zusammen.\nAls Abschlussarbeit auf dem Gymnasium in Zürich hat Adam Klein die Geschichte seiner jüdischen Vorfahren aufgeschrieben. Ausgangspunkt war ein Koffer auf dem Dachboden seiner Großmutter in Zürich. Als er zum Haus seiner Urgroßeltern in der Stuttgarter Hölderlinstraße fährt, begegnet er zufällig Thomas Koch.\nModeration: Nicole Köster\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - \nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
