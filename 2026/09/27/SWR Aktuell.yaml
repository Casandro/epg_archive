  description: "12:00\nAktuelles & Sport\n\n12:30\nMariniæ's FREIHEIT\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n13:00 \nCamino - Religionen auf dem Weg\nDie Kinder kamen nicht zurück - Das Trauma der \"Residential Schools\" in Kanada\nRund 150.000 indigene Kinder wurden in Kanada über Generationen hinweg ihren Familien entrissen. In meist kirchlich geführten Internaten sollten sie ihre Sprache, ihre Kultur und ihre Herkunft vergessen. Viele erfuhren Vernachlässigung und Gewalt. Tausende überlebten die Einrichtungen nicht.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nLissy Kaufmann im Gespräch mit Monika Schnitzer, Wirtschaftsweise\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
