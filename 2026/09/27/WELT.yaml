  title: 'Hitlers Komplizen: Joseph Goebbels'
  subtitle: 'Hitlers Komplizen: Joseph Goebbels'
  description: Im Garten der Berliner Reichskanzlei entdeckten sowjetische Soldaten im Mai 1945 die sterblichen Überreste von Dr. Joseph Goebbels und seiner Frau Magda, im nahegelegenen Führerbunker die Leichname ihrer sechs Kinder. Nach dem Untergang des NS-Regimes sah Hitlers Propagandachef keinen anderen Ausweg als den Freitod. Was brachte den Akademiker dazu, der faschistischen Ideologie des Nationalsozialismus bedingungslos zu folgen? Die Dokumentation beleuchtet Leben und Werdegang des Nazi-Rhetorikers.
  widescreen: true
- eventId: 1197393
  start: 2026-09-27T22:47:00Z
  stop: 2026-09-27T23:33:00Z
  title: 'Hitlers Komplizen: Heinrich Himmler'
  subtitle: 'Hitlers Komplizen: Heinrich Himmler'
  description: 'Heinrich Himmler war einer der mächtigsten und einflussreichsten Männer des NS-Regimes, und einer der grausamsten. Als Vordenker der rassistischen Nazi-Ideologie, Gestapo-Leiter und Chefstratege der Konzentrationslager gehört er zu den Hauptverantwortlichen des Holocaust. Die Dokumentation zeichnet seinen zielstrebig-karrieristischen Weg vom Bürgersohn aus katholischem Elternhaus an die Spitze des Dritten Reiches nach und widmet sich dabei der ewigen Frage: Wie kommt das Böse in den Menschen?'
  widescreen: true
- eventId: 1178145
