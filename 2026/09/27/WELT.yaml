  title: 'Mayday: Elf entscheidende Sekunden'
  subtitle: 'Mayday: Elf entscheidende Sekunden'
  description: 'Ein Routineanflug wird zur Katastrophe: Flug 676 gerät in ein tödliches Zusammenspiel aus Stress, Fehlentscheidungen und fehlender Kommunikation im Cockpit. Während ein aufziehendes Gewitter den Druck erhöht, verliert die Crew in entscheidenden Sekunden die Kontrolle über das Flugzeug. Ermittler aus aller Welt rekonstruieren akribisch die letzten Momente und stoßen auf eine fatale Kette menschlicher Fehler, die in nur elf Sekunden alles verändert.'
  widescreen: true
- eventId: 1197385
  start: 2026-09-27T13:42:00Z
  stop: 2026-09-27T14:32:00Z
  title: 'Mayday: Fatale Entscheidung'
  subtitle: 'Mayday: Fatale Entscheidung'
  description: 'Saudia Flight 163 gerät kurz nach dem Abheben in eine lebensbedrohliche Lage: Ein Feuer breitet sich unbemerkt im Inneren aus. Die Crew entscheidet sich zur Umkehr und landet die Maschine sicher. Doch wertvolle Minuten verstreichen, ohne dass die Passagiere das Flugzeug verlassen. Die Rekonstruktion zeigt, wie fehlende Dringlichkeit, technische Grenzen und folgenschwere Entscheidungen eine Katastrophe unausweichlich machen.'
  widescreen: true
- eventId: 1178135
