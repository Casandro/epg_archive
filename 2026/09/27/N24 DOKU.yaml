  description: Wenn es um das Abschleppen von tonnenschweren Fortbewegungsmitteln geht, sind PS-starke Fahrzeuge gefragt. Diese Spezial-Abschlepper bergen gewaltige Militärfahrzeuge, schieben die größten Flugzeuge der Welt oder transportieren riesige Raketen. Die Konstruktion der XXL-Zugmaschinen ist ihrem Einsatzgebiet optimal angepasst und erlaubt ihnen, das Dreißigfache ihres Eigengewichts zu bewegen. Die Reportage begleitet Profis bei der Arbeit und zeigt, warum ihr Beruf auch lebensgefährlich sein kann.
