  title: Lost Places - Folge 62
  subtitle: Lost Places - Folge 62
  description: 'Die Golanhöhen im Nahen Osten: eine Ansammlung von Ruinen und immer wieder Schauplatz heftiger kriegerischer Auseinandersetzungen. Die früheren Hauptbefestigungsanlagen des syrischen Militärs werden heute von Israel verwaltet. Während um die Region heute noch gekämpft wird, interessiert ein verfallenes Werk in der amerikanischen Stadt Buffalo wenige. In der zweiten Hälfte des 20. Jahrhunderts wurde dort ein Grundnahrungsmittel der Amerikaner hergestellt: das Toastbrot der Marke Wonder Bread.'
