  title: Lost Places - Folge 57
  subtitle: Lost Places - Folge 57
  description: In Kobe, Japan stehen die Häuser dicht an dicht. Ein verlassenes Gebäude aber ragt heraus. Von der Seilbahnstation auf dem Berg Mayasan führt ein einsamer Weg zum verlassenen Gebäude. Ursprünglich war der Mayasan eine religiöse Stätte. Später wurde er zum attraktiven Ausflugziel mit Restaurants, Theater und öffentlichen Bädern - bis die Stadt zerstört wurde. Im Norden Sardiniens erhebt sich das imposante Granitmassiv des Monte Limbara. Hier wurde einst ein großes Kommunikationszentrum gebaut.
