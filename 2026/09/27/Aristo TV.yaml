  title: ANIXE auf Reisen - Steiermark mit Johann Lafer
  description: Der bekannte Fernsehkoch Johann Lafer geht mit Anixe auf Entdeckungsreise in seine wunderschöne Heimat - die Steiermark. Dort reist er durch "das grüne Herz Österreichs" und erkundet dabei die Vorzüge der Region. Auf dem Weg begegnen ihm prächtige Schlösser und Burgen, sowie die einmalige Architektur des Künstlers Hundertwasser. Für Graz verlässt er schließlich die idyllischen Wälder und Wiesen. Dort wird er überwältigt von der Begegnung aus Moderne und Tradition. Das wunderschöne Weinland beeindruckt den Koch mit seiner Schönheit. Besonders eingenommen wird er von dem Blick auf die 3000 Meter hohen Gipfel. Unvergesslich ist der kunstvolle Eispalast, der inmitten eines Gletschers errichtet wurde. Ein Highlight sind selbstverständlich die kulinarischen Delikatessen der Region, auf die sich Johann Lafer besonders freut.
  widescreen: true
