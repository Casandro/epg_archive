  description: 'Autor: Milan Tesař; Interpret: Maija Pokela; Premiéra: 13.2.2026 * V pořadu Jak se vám líbí vám Milan Tesař představí finskou hudebnici Maiju Pokela, se kterou hovořil na hudebním veletrhu WOMEX v Tampere ve Finsku. Řeč bude o jejím sólovém albu Lohdun sanoja, Slova útěchy, a také o kapelách Kardemimmit a Enkel, ve kterých Maija hraje na tradiční finský nástroj kantele. Rozhovor se dotkne hledání vlastního hudebního hlasu, práce s tradicí i tématu útěchy, které prostupuje její současnou tvorbou.[majju] [majja] [vomeks] [lohdun sanoja] '
