  description: 'Autor: Kateřina Graffová; Interpret: 1 * Podzimní díly měsíčníku Soaré uvedou další alba nizozemského vydavatelství Pentatone. V září v pořadu zazní hudební ukázky s arménskou klavíristkou Nareh Arghamanyan nebo s australskou flétnistkou Ana de la Vega. Představím  také nahrávky souboru The percussion collective a duchovní skladby v podání nizozemského rozhlasového sboru Groot Omroepkoor.  K poslechu jsou připravena díla Arama Chačaturjana, Francise Poulenca, Garthe Neustadtera, Josefa Rheinbergera a Felixe Mendelssohna Bartholdyho. Pořadem provází Kateřina Graffová'
