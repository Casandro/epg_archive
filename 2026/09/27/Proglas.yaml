  title: Nedělní pohádka
  subtitle: 'Pohádky o potrestaném zlu a odměněné dobrotě - O drakovi, který se naučil hrát mariáš '
  description: 'Autor: Milan Kynčl; Interpret: vypravěč - Irena Kintrová, radní - Václav Ambrož, Milan Kynčl, Roman Lang, drak - Vladimír Kintr, kočí Francek - Václav Ambrož; Premiéra: 11.12.2011 * Byl žil jednou jeden sedmihlavý drak, přiletěl a jak to bývá, požadoval mladé holky, na co, to nikdo neví. Když došlo na královskou dceru, statečný kočí Francek zjistil, že všechno je jinak. A z toho plyne, že mariáš v kruhu přátel je lepší než banda ufňukaných ženských doma v jeskyni. '
