  subtitle: Vzdělávací platforma Dominikánská 8 a představení nové sezony
  description: 'Autor: Jana Rambousková; Interpret: Benedikt Mohelník, Zuzana Matisovská; Premiéra: 21.9.2026 * Dominikánská 8 je veřejný intelektuální a kulturní prostor, který vyrůstá z prostředí českých dominikánů a snaží se vést dialog mezi křesťanstvím, akademickým světem, kulturou a současnou společností. S ředitelem platformy Benediktem Mohelníkem a Zuzanou Matisovskou z propagačního týmu se mimo jiné také dotkneme toho, jak pracují s kontroverzními tématy a co je to tabu, kdy nám slouží a kdy už se může stát nebezpečným. Pokusíme se o reflexi uplynulé sezony a představíme sezonu nadcházející.'
