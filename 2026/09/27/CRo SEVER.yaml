  title: Planetárium
  description: Jakým stylem jsou psány eposy, připisované Homérovi, a kudy vedla Odysseova cesta z Tróje? Na homérské téma si opět budeme povídat s klasickou filoložkou Sylvou Fischerovou. Planetku Kamo'oalewa, zdánlivý satelit naší Země, kolem níž od léta obíhá čínská sonda Tchien-wen 2, navštívíme s popularizátorem astronomie Pavlem Gabzdylem.
