- eventId: 1227008
  start: 2026-09-27T08:04:00Z
  stop: 2026-09-27T09:00:00Z
  title: Pochoutkový rok
  description: Za chvíli tu bude další díl narozeninového Pochoutkového roku. V něm vás čeká recept, který se stal druhým nejlepším v roce 2025 podle poroty. V rámci letošního jubilejního desátého roku vysílání naší soutěže jsme totiž požádali osobnosti Pochoutkového roku, aby recepty, které kdysi vyhrály, uvařily a upekly podle svého. A tak dnes bude péct legendární chodské koláče ve své zjednodušené úpravě herečka Naďa Konvalinková. Kromě toho si dnes připomeneme, jak jsme s vámi oslavili 10. narozeniny Pochoutkového roku v Kostelci nad Orlicí třeba i s šéfkuchařem Jan Punčochářem a také vám více řekneme o podzimním knižním překvapení a to o knížce Vánoční pečení s Josefem Maršálkem a Patrikem Rozehnalem. Víc se dozvíte na webu pochoutkovyrok.cz nebo dnes po 10. hodině v našem vysílání.
