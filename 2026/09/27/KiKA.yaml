    Seeadler sind die Könige der Lüfte. Wegen ihrer Größe, den berühmten Adleraugen und der unglaublichen Kraft ihrer Fänge gehören sie zu den beeindruckendsten Greifvögeln der Erde. Vor nicht einmal 40 Jahren waren sie fast ausgestorben. Heute haben sich die Bestände etwas erholt. Für Tierreporterin Anna ist die Sache klar: Seeadler will sie aus nächster Nähe sehen.

    Ihr erster Halt: die Ostseeinsel Usedom. Dort nisten an die 80 Seeadlerpärchen. Die Tierschützer Torsten und Mario halten seit 15 Jahren nach ihnen Ausschau und beringen im Frühjahr die Jungtiere. Aus 25 Metern Höhe werden die Adler aus ihren Horsten zu Boden gebracht, beringt und zurück ins Nest gesetzt. Anna ist bei diser spektakulären Aktion dabei.

    In Nordamerika lebt der verwandte Weißkopf-Seeadler, das Wappentier der Vereinigten Staaten von Amerika. Im Adlerzentrum von Tennessee besucht Anna Chief Al und seine wunderschönen Adler. ...
