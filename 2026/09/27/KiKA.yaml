  description: |-
    Das Käferbot-Rennen

    Diesmal soll beim Rennen ein Roboter-Käfer eingefangen und ins Ziel gebracht werden. Dafür werden die Drohnen mit einer Fang-Vorrichtung ausgestattet. Enki hat sich inzwischen in Flora von ihren nächsten Gegnern, den Bees, verguckt. Im Gespräch mit ihr plaudert er unbedacht Geheimnisse des eigenen Teams aus. Corto und Mouse sind darüber ziemlich sauer. Als Flora diese Geheimnisse auch noch für ihr eigenes Team nutzen will, kommt es zum Streit im Team Tiki.
