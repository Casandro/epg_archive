  title: Tashi
  subtitle: Tashi & das Goldene-Geschichten-Großmaul
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    3D/2D-Animationsserie, Deutschland / Australien 2014
    Tashi & das Goldene-Geschichten-Großmaul

    Graf Ling möchte unbedingt das diesjährige Goldene-Geschichten-Großmaul gewinnen. In den letzten Jahren ging der Preis immer an Tashi. Um Tashi eine Geschichte abzugewinnen, lockt Graf Ling Tashi und Jack in einen Hinterhalt. Das Problem ist nur, dass Tashis Kopf so voll mit alten Geschichten ist, dass ihm gar keine neue einfällt. Nur durch Zufall entsteht ein neues Abenteuer, mit vielen einzigartigen Begegnungen und spektakulären Vorfällen. Diese Geschichte wird Graf Ling aber bestimmt nicht erzählen.
    Darsteller:
    Tashi - Robert Kotulla
    Jack - Henning Nöhren
