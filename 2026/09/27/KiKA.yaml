    Die Schule der magischen Tiere: Buch, Film, Tiere

    Warum ist "Die Schule der magischen Tiere" so beliebt? Team Timster geht dem Erfolgsgeheimnis auf den Grund und zeigt, wie aus einer Idee eine Welt wird, in die man sofort eintauchen will: mit starken Figuren, Humor, Freundschaft - und natürlich den magischen Tieren. Dafür trifft Moderator Tim die Autorin Margit Auer, die Erfinderin der magischen Tiere. In München spricht Tim mit ihr darüber, wie die Geschichten entstehen und woher die Inspiration für die Tiere kommt. Die Folge blickt außerdem hinter die Kulissen der Kinofilme zu Buchreihe. Im Berliner VFX-Studio Lumatic zeigt das Team, wie die "Magischen Tiere" animiert werden - und warum sie im Film so lebensecht wirken. Schauspielerin Emilia Maier erzählt außerdem, wie es ist, mit Tieren zu spielen, die beim Dreh noch gar nicht "da" sind. ...
