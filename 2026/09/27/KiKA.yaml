    Wer hat die verletzte Taube vor den Bauwagen gelegt? Fritz übernimmt ihre Pflege und muss herausfinden, woher sie kommt. Vorher kann er den Vogel nicht wieder in die Freiheit entlassen. Fritz bewundert seine neue Mitbewohnerin: Tauben sind sehr schlau, super schnell, haben einen guten Orientierungssinn und verbringen ihr Leben mit nur einem Partner. Komisch, dass sich plötzlich auch Nachbar David sehr für die Taube interessiert.
