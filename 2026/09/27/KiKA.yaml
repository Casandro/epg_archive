  title: Die Abenteuer des jungen Marco Polo
  subtitle: Gefangen im Sand der syrischen Wüste
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Gefangen im Sand der syrischen Wüste

    Endlich Wasser! Auf dem Weg durch die syrische Wüste stoßen Marco Polo und seine Freunde endlich auf einen Brunnen. Doch ein Sarazenenkrieger beschuldigt sie des Wasser-Diebstahls und gräbt Marco, Luigi und Shi La zur Strafe in den Sand ein. Rettung kommt ausgerechnet von einem Furcht erregenden Löwen. Der kann aber nicht richtig brüllen und gehört zu einem Zirkus, dem die Zuschauer fehlen. Marco hat eine Idee, wie sie als Wanderzirkus erfolgreich werden könnten. Und als erste Station müssen sie ausgerechnet ins Lager der Sarazenen ziehen... Hier "findet" der Löwe seine Stimme wieder.
    Darsteller:
    Vater Niccolo - Boris Aljinovic
    Marco - Elia Francolino
    Luigi - Linus Drews
    Shi La - Sarah Tkotsch
    Regie: Lutz Stützne, Tony Loeser, Dave Barton Thomas

    HD-Produktion
