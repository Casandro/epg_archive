  title: Lebenswelten
  description: "\"Görlitz Cousins\"\nWie aus den Nachfahren Görlitzer Juden ein weltweites Netzwerk wurde \nEine Sendung von Michael Frantzen \n\n\"All diese Namen.\" Als Lauren Leiderman 2019 das erste Mal den Jüdischen Friedhof in Görlitz besuchte, war die US-Amerikanerin gerade in die sächsische Grenzstadt gezogen. Lauren ging auf Spurensuche. Wer waren \"Amanda\" und all die anderen? Was wurde aus ihnen und ihren Nachfahren? Sie fing an, mehr als 130 Lebensläufe Görlitzer Juden, darunter auch der einer Freundin Anne Franks, zusammenzutragen. Und sie rief die \"Görlitz Cousins\" ins Leben - eine WhatsApp-Gruppe, in der sich Nachfahren Görlitzer Juden austauschen. Die \"Görlitz Cousins\" leben weitverstreut: In den USA, Australien, Israel. Im Sommer 2026 waren 130 von ihnen anlässlich der \"jüdischen Erinnerungswoche\" zu Besuch in Görlitz, zur Stolperstein-Legung und um auf den Spuren ihrer Vorfahren zu wandeln."
