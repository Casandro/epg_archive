- eventId: 544379
  start: 2026-09-27T18:00:00Z
  stop: 2026-09-27T21:00:00Z
  title: radio3 Konzert
  subtitle: 'Moderation: Shelly Kupferberg'
  description: |-
    l i v e aus der Berliner Philharmonie:
    Eva Ollikainen dirigiert das Deutsche Symphonie-Orchester Berlin


    Gil Shaham, Violine

    Sergej Prokofiew
    Violinkonzert Nr. 2 g-Moll

    John Williams
    Thema aus der Filmmusik zu Schindlers Liste (Violinkonzert)

    Thomas Larcher
    Sinfonie Nr 2. "Kenotaph"

    Das Deutsche Symphonie-Orchester Berlin präsentiert unter der Leitung von Eva Ollikainen ein Programm, das Brücken schlägt zwischen Vergangenheit und Gegenwart, zwischen Hoffnung und Tragik. Im Mittelpunkt steht Sergej Prokofjews Zweites Violinkonzert, ein Werk, das den Weg des Komponisten zu einer "neuen Einfachheit" markiert und mit seiner melodischen Klarheit fasziniert. Als Solist ist der vielfach ausgezeichnete Geiger Gil Shaham zu erleben, der zudem mit dem ergreifenden Thema aus John Williams' Filmmusik zu "Schindlers Liste" berührt - eine Hommage an Menschlichkeit in Zeiten der Barbarei. Den Abschluss bildet Thomas Larchers Zweite Symphonie "Kenotaph", ein kraftvolles, zeitgenössisches Werk, das den Opfern der Flucht über das Mittelmeer gewidmet ist und in seiner expressiven Tonsprache die existenziellen Fragen unserer Zeit aufgreift.

    Moderation: Shelly Kupferberg
- eventId: 545138
  start: 2026-09-27T21:00:00Z
  stop: 2026-09-27T22:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Cécile McLorin Salvant mit neuem Album

    Die US-amerikanische Jazz-Sängerin und Komponistin kann mit ihrer Stimme sehr intensive Geschichten erzählen: Mal klingt sie mädchenhaft, mal intim, blues-durchtränkt, theatralisch oder bitter ironisch. Drei Grammys hat sie so schon gewonnen.
    Für ihr neues Album "With Every Breath I Take" hat sie sich jetzt das erste Mal von einem Orchester begleiten lassen - dem Metropole Orkest unter der Leitung von Jules Buckley. Gemeinsam interpretieren sie zeitlose Songs in Arrangements filmischen Ausmaßes - von Cy Coleman, Noël Coward, Duke Ellington, Stephen Sondheim, Billy Strayhorn und nicht zuletzt von Cécile McLorin Salvant selbst.

    Moderation: Ortrun Schütz
