- eventId: 547972
  start: 2026-09-27T16:00:00Z
  stop: 2026-09-27T17:00:00Z
  title: Niederdeutsches Hörspiel
  description: Die Bank in dem nahe gelegenen Park ist für die gerade verwitwete Sandra ein Ort der Erholung und des Innehaltens. Hier versucht sie, ihre Gedanken zu ordnen und das Geschehene zu verarbeiten. Zum Reden ist ihr nicht zumute, doch ihr Wunsch nach Ruhe wird von dem redseligen Pensionär Herbert durchkreuzt. Schließlich kann Sandra ihm nicht verbieten, sich zu ihr zu setzen. Was anfangs wie eine zufällige Begegnung anmutet, entpuppt sich zusehends als Blick in das Seelenleben einer verzweifelten Frau, die ein unsagbares Geheimnis in sich trägt.
- eventId: 547973
  start: 2026-09-27T17:00:00Z
  stop: 2026-09-27T20:00:00Z
  title: Klassikwelt
  subtitle: mit Wilfried Schäper
  description: DiesmaI mit Instrumentalkonzerten von Camille Saint-Saens, Kammer- und Orchestermusik des Hamburger Komponisten Joachim Schweppe, Klaviermusik von Johannes Brahms mit der Pianistin Jimin Oh-Havenith und den Debüt-Alben des Cellisten Simon Tetzlaff und des "Trio Brontë" - alles neue CDs der letzten Wochen und Monate, die zeigen, dass dieses Medium gerade in der Klassik noch sehr lebendig ist.
- eventId: 548382
  start: 2026-09-27T20:00:00Z
  stop: 2026-09-27T22:00:00Z
  title: Klassikwelt in concert
  subtitle: mit Wilfried Schäper
  description: Das Bremer Debüt des in Moskau geborenen Pianisten Andrey Gugnin hatte alle Züge einer musikalischen Sensation. Der jetzt 38-jährige Künstler hatte ein extrem ungewöhnliches Programm mit in den Bremer Sendesaal gebracht. Kein einziges originales Klavierwerk war in diesem Konzert zu hören, sondern ausschließlich Bearbeitungen berühmter Ballettmusiken von Tschaikowsky und Strawinsky - ein ganz besonderer "Klavierabend ohne Klaviermusik".
