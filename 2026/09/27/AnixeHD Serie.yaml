  title: Das Waisenhaus für wilde Tiere - Folge 75
  subtitle: Das Waisenhaus für wilde Tiere - Folge 75
  description: 'Volontärin Jessica will heute einen alten Bekannten zum Laufen bewegen: den Faulpelz Nr. 1 -  Geparden Atheno. Doch was anfangs noch sehr zögerlich beginnt, wird zu einer rasanten Jagd. Annika und Morgan bereiten ebenfalls ein Fitnessprogramm vor und zwar für die Karakale Samar und Aviel. Die Kleinkatzen können unglaublich hoch springen und fangen in der freien Natur Vögel aus der Luft. Damit ihnen dieses Geschick nicht verloren geht, werden sie heute mit Attrappen trainiert. Auf der Schutzstation REST darf Volontärin Beate Bekanntschaft mit einem sehr seltenen Tier machen, einem Schuppentier. Maria Diekmann erklärt ihr die Besonderheiten dieses Tieres und warum sie sich glücklich schätzen kann ihm so nahe zu kommen'
