  title: 'city church Karlsruhe - Toxisch - Oder: Bin ich der Mensch, vor dem ich andere warnen würde?'
  subtitle: 'city church Karlsruhe - Toxisch - Oder: Bin ich der Mensch, vor dem ich andere warnen würde?'
  description: 'Wir reden oft über toxische Menschen - über diejenigen, die manipulieren, kontrollieren, kleinmachen oder ständig Drama auslösen. Menschen, vor denen wir andere warnen und von denen wir uns schützen. Aber was, wenn Jesus uns eine viel tiefere Frage stellt: Was, wenn ich selbst manchmal toxisch bin - ohne es zu merken? In dieser Predigt geht Jonas ehrlich, herausfordernd und hoffnungsvoll der Frage nach, warum wir so schnell andere beurteilen, aber so langsam unser eigenes Herz prüfen.'
