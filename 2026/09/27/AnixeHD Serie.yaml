  title: Gunst der Stunde mit Heiko Bräuning - Wenn Gott unsre Herzen wärmt (mit Abendmahl)
  subtitle: Gunst der Stunde mit Heiko Bräuning - Wenn Gott unsre Herzen wärmt (mit Abendmahl)
  description: 'Was für ein schönes Herz, ein Plüschherz. Hab ich geschenkt bekommen. Wenn wir an das Herz denken, meinen wir oft mehr als nur ein Organ. Das Herz steht für Gefühle, Entscheidungen, Sehnsucht und Mut. Es ist das Zentrum des Menschen. Dieses Plüschherz ist weich, verletzlich und o?en - genau wie unser eigenes Herz. Es zeigt: Im Herzen sammeln sich Freude und Schmerz, Liebe und Angst, Vertrauen und Zweifel. Wir feiern Gott in unserem Herzen, der es sich aufs Herz gelegt hat, uns zu herzen. Er will unser Bestes! Und das feiern wir gemeinsam auch im Abendmahl!'
