  title: Výjimeční
  description: Jaroslav Róna - Sochař, malíř a bývalý člen skupiny Tvrdohlaví Jaroslav Róna patří k nejvýraznějším osobnostem současného českého umění. Jeho díla jsou součástí řady veřejných a soukromých sbírek u nás i v zahraničí. Poslední výstava monumentálních soch s názvem Ticho a mýty je k vidění v Litomyšli do konce října. Poslouchejte další díl cyklu Výjimeční. Autorka pořadu - Lenka Poláková Nechvátalová.
- eventId: 1227568
  start: 2026-09-27T16:30:00Z
  stop: 2026-09-27T17:00:00Z
  title: Historie českého zločinu
  description: 12. díl - Stopy ve sněhu. Všechno ze začátku vypadalo jako loupežné přepadení, ale četníci z Černošína, Chebu a Plané brzy přišli na to, že situace tak vypadat jen má. Případ vraždy Anny Maierové, manželky váženého lékaře z roku 1931, se zapsal do učebnic kriminalistiky tím, jak perfektní práci tehdy četnické týmy odvedly, aniž by měly k dispozici současné moderní kriminalistické metody. Scénář případu, v němž podstatnou roli hrají stopy ve sněhu, podle skutečnosti napsala Bronislava Janečková. Odborná spolupráce Dr. Petr Švec. Cyklus Historie českého zločinu je připravován ve spolupráci s Muzeem Policie České republiky. Repríza.
- eventId: 1227569
  start: 2026-09-27T17:00:00Z
  stop: 2026-09-27T17:50:00Z
  title: Muzikál expres
  description: Jak si vedou Cenami Tony ověnčené muzikály Broadwaye v divácké úspěšnosti? Na tuto otázku odpoví příští Muzikál expres. Zmínka bude úspěchu muzikálu Ďábel nosí Pradu v Londýně a o chystanému uvedení Fantoma Opery v Šanghaji. Druhá část bude věnována Jiřímu Suchému, který počátkem října oslavuje 95. narozeniny. Zazní přitom skladby ze Zlaté éry Semaforu. Mimo jiné melodie z inscenací Dobře oplacená procházka a Jonáš a tingl-tangl. Reprízu pořadu vysíláme v pátek 2. října od 21. hodiny. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
