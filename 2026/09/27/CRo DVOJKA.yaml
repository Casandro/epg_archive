  title: Dokument
  description: Na co nelze zapomenout. Portrét herečky Daniely Kolářové. V září roku 2026 oslavila herečka Daniela Kolářová významné životní jubileum (80 let). V rozhlasovém dokumentu se před mikrofonem pokouší znovu prožít vlastní minulost a zpětně ji reflektovat. Dokument Jakuba Horáčka postupně odkrývá životní příběh známé herečky a taky způsob, jakým se z minulosti rodí naše postoje a hodnoty. (premiéra)
