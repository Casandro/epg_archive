  title: Pohádka
  description: 'Tove Janssonová: Muminci a čarodějův klobouk. Muminek, Šňupálek a Čenich na začátku jednoho kouzelného léta naleznou černý cylindr. A protože v muminím údolí se nic neodehraje jen tak, můžete si být jisti, že se začnou dít věci! Klobouk totiž patří mocnému čaroději - jenže to nikdo v údolí netuší, a tak se budou hodně divit, co všechno s ním zažijí! Přeložil Libor Štukavec. Dramatizace Marie Špalová. Dramaturgie Lenka Veverková. Režie Izabela Schenková. Účinkují: Ondřej Brousek, Miloslav König, Ivana Chýlková, Petr Stach, Václav Neužil, Jiří Roskot, Petra Kosková, Michal Sieczkowski, Kateřina Marie Fialová, Kryštof Krhovják, Filip Kaňkovský, Izabela Schenková a Dana Reichová. Natočeno v roce 2024 (55 minut). Repríza.'
