  description: 'Láska je dobrej matroš (3/3). Komediální seriál o tom, jak je těžké získat lásku za každou cenu. Scénář a režie Petr Vodička. Hudba Filip Veret. Dramaturgie Kateřina Rathouská. Účinkují: Šárka Vaculíková, Ivan Trojan, Lucie Polišenská, Jan Meduna, Natália Drabiščáková, Luboš Veselý, Jaroslav Plesl, Marek Němec, Lukáš Příkazký, Radovan Klučka, Miloš Mazal, Gustav Hašek, Vasil Fridrich, Tereza Dočkalová, Tomáš Dianiška, Martina Hudečková, Veronika Lazorčáková, Anna Theimerová, Eva Leinweberová, Naděžda Mečířová, Lubor Šplíchal, Dalimil Klapka, Tomáš Černý, Martin Bohadlo, Martin Pechlát a Tomáš Turek. Natočeno v roce 2018 (40 minut). Repríza.'
