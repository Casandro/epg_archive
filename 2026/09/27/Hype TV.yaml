  description: Matea Vanjorek Show moderan je talk show koji okuplja najzanimljivije osobe iz svijeta pop kulture, prostora koji danas obuhvaća mnogo više od estrade. U opuštenoj atmosferi i kroz iskrene razgovore, Matea vanjorek sa svojim gostima otvara teme koje oblikuju suvremeni život, trendove i društvo. U emisiji gostuju glumci, glazbenici, influenseri, kreatori sadržaja, gameri, poduzetnici, sportaši, dizajneri i kreativci koji svojim radom pomiču granice i imaju što reći. Svaka epizoda donosi priče o uspjehu, izazovima, inspiraciji i životu iza reflektora, ali i pogled na aktualne teme koje obilježavaju današnju pop kulturu. Matea Vanjorek Show mjesto je susreta različitih generacija, ideja i industrija, potvrđujući da pop kultura više nije samo zabava, ona je dio svakodnevnice, poslovanja i načina na koji živimo. Emisija spaja aktualnost, autentičnost i dobre razgovore u formatu koji informira, inspirira i zabavlja.
- eventId: 1091039
  start: 2026-09-27T14:00:00Z
  stop: 2026-09-27T15:41:00Z
  title: Veliki gazda, film
  description: "Cheng Chao-an (B. Lee) mladi je Kinez iz Guangdonga kojemu ujak nađe posao u tvornici leda na Tajlandu gdje radi s brojnim rođacima. Cheng oko vrata nosi majčinu ogrlicu koja ga podsjeća na obećanje da se nikada neće tući. I doista, Cheng izbjegava nasilje i popušta čak i kad je izazvan. Jednom zgodom u tvornici se odlomi veliki komad leda iz kojega ispadne vrećica s bijelim prahom. Dvojicu Chengovih rođaka koji su to pronašli zadrži poslije posla predradnik (C. Chen) i ponudi im, u zamjenu za šutnju, bolji posao. Oni odbiju i kriminalci ih ubiju i zalede. Šef bande - \"veliki gazda\" - Hsiao Mi (Y. Chieh Han) pokušava zataškati ubojstva, ali Cheng i njegovi preostali rođaci postaju sumnjičavi. Dvojica rođaka, Hsu Chien (J. Tien) i Ah Pei (B. Chan Wu-Ngai), sami odlaze velikom gazdi Miu i pitaju ga što je s dvojicom nestalih rođaka. Mijevo ponašanje im je sumnjivo pa odluče pozvati policiju, no Mijevi ljudi ih ubiju. U jednom sukobu s Mijevim ljudima Cheng je slučajno povrijeđen i izgubi kontrolu, umiješa se i premlati nekoliko Mijevih ljudi, dok ostali pobjegnu. Svjestan Chengove snage i autoriteta, Mi odluči potkupiti Chenga boljim poslom, alkoholom i prostitutkama. Cheng nasjedne na to i ostali rođaci su razočarani, preziru ga i izbjegavaju. Cheng nalazi drogu i leševe ubijenih rođaka u ledu, te se upušta u veliki obračun s Mijevim ljudima, ubije ih većinu - kao i njegova sina. No, kad se vrati kući, nađe cijelu obitelj poubijanu... \n\nOvo je prvi film Brucea Leeja snimljen početkom sedamdesetih u produkciji tvrtke \"Golden Harvest\" i producenta Raymonda Chowa, s malim budžetom i bez prevelikih očekivanja. Glavni glumac je trebao biti James Tien - koji u filmu glumi rođaka Hsu Chiena - a tada je bio velika hongkonška zvijezda, no Bruce Lee se nametnuo kao glavni glumac svojim načinom glume i kung fua - jednostavno je bilo jasno da se radi o iznimnoj glumačkoj osobnosti."
  subtitle: Tang shan da xiong (1971) Akcija
