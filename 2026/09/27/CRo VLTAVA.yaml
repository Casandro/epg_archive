  title: Radioseriál
  description: 'Honoré de Balzac: Otec Goriot - (2/2). Anastazie a Delfína. Dramatizace slavného románu, ve kterém se v malém penzionu setkávají existence z okraje společnosti, v čele s mužem, který vše obětoval svým dcerám. Přeložila Božena Zimová. Dramatizace Zuzana Kočová. Hudba Josef Pech. Dramaturgie Jaroslava Strejčková. Režie Jiří Horčička. Účinkují: Martin Růžek, Alena Vránová, Marie Vášová, Miloš Nedbal, Viktor Preiss, Miloš Hlavica, Drahomíra Fialková, Pavla Maršálková, Eduard Dubský, Jana Andresíková, Ladislav Boháč, Jana Drbohlavová, Ladislav Kazda, Oldřich Janovský a Růžena Merunková. Natočeno v roce 1974.'
