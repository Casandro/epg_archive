  title: Österreich-Bild aus dem Landesstudio Oberösterreich
  subtitle: Wein aus 4 Vierteln - Wenn aus oö. Landwirten Spitzenwinzer werden"
  description: Grüner Veltliner, Chardonnay und Sauvignon Blanc zählen zu den wichtigsten Rebsorten, die in Oberösterreich angebaut werden, doch auch mit neuen pilzresistenten Trauben werden hier Qualitätsweine erzeugt. Bis Ende des 17. Jahrhunderts hatte der Weinbau in Oberösterreich eine lange Tradition, die aber von der darauffolgenden "kleinen Eiszeit" beendet wurde. Vor rund 30 Jahren starteten die ersten Pioniere wieder mit dem Anlegen neuer Weingärten. Auch wenn der Klimawandel diesen jungen Weinbau begünstigt und Rebstöcke inzwischen in allen 4 Vierteln des Landes zu finden sind, so zeugt diese Entwicklung auch von einer enormen Risikobereitschaft der Landwirte. Gestalter Wolfgang Marecek und Markus Fischer porträtieren die meist jungen, gut ausgebildeten, zielstrebigen Winzer und Winzerinnen, die sich der enormen Wein-Konkurrenz im In- und Ausland mit großem Engagement stellen.
  genre:
  - '33'
