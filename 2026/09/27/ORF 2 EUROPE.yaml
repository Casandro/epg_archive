  title: Erlebnis Österreich
  subtitle: Von der Vision zur Wirklichkeit
  description: |-
    Der weltberühmte ungarisch-österreichische Pianist und Komponist Franz Liszt wurde 1811 in der kleinen Ortschaft Raiding, seinerzeit Komitat Ödenburg, geboren.
    Mit knapp über 900 Einwohnern ist die heutige Marktgemeinde im burgenländischen Bezirk Oberpullendorf noch immer klein, sie verfügt aber seit 20 Jahren über ein außergewöhnliches Konzerthaus: Das Liszt Zentrum Raiding. Unter der Intendanz der Brüder Eduard und Johannes Kutrowatz, einem international renommierten Klavierduo, wird seither am Geburtsort von Franz Liszt ein hochkarätiges Programm mit musikalischer Vielfalt geboten.
    Ausgehend vom Liszt Festival im Oktober rund um den Geburtstag des Meisters hat sich über die Jahre ein ganzjähriger Museums- und Konzertbetrieb im Liszt Zentrum Raiding entwickelt.
    Ganz unter dem Motto "Le concert c _est moi", dem wohl berühmtesten Ausspruch von Franz Liszt: "Das Konzert bin ich!"
    Franz Liszt, gespielt von Schauspieler Michael Dangl, besucht das Liszt Zentrum Raiding 20 Jahre nach seiner Eröffnung.
  genre:
  - '34'
