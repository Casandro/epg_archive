  title: Magie der Museen
  subtitle: Das Solomon R. Guggenheim Museum, New York
  description: |-
    (Dokumentation, AUT/DEU/FRA 2018)
    Die New Yorker Künstlerin Julie Mehretu, Schöpferin abstrakter Großgemälde, lotet im New Yorker Solomon R. Guggenheim Museum die gesellschaftliche Bedeutung ihrer radikalen Vordenker wie Jackson Pollock aus, der mit seiner expressiven Malerei das propagierte Gefühl amerikanischer Freiheit ausdrückt. Die Meisterwerke "Komposition VIII" von Kandinsky, "Alchemy" von Pollock und "Portrait of Chess Players" von Duchamp stehen im Fokus ihrer Aufmerksamkeit.
    Regie: Ralf Pleger
