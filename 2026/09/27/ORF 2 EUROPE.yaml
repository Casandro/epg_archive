  title: Zurück zur Natur
  subtitle: Dunkelsteinerwald
  description: 'Zwischen dem Mostviertel und der Wachau liegt eine ursprüngliche Region im Herzen Niederösterreichs - der Dunkelsteinerwald. Hier bringt Herta Falkensteiner eine fast vergessene Frucht auf den Teller: die Hagebutte. Auch Elke Wallner-Zeinzinger nutzt natürliche Zutaten aus dem Wald - aus Kräutern, Moosen und Flechten wird heute bei ihr Wohltuendes für die Kopfhaut. Und Klaus Kamleitner schmiedet wie vor Generationen: Mit Feuer. Mit Eisen. Mit der Kraft des Wassers. Und diesmal gemeinsam mit Maggie Entenfellner.'
