  title: kreuz & quer reportage
  subtitle: Die Mönche von nebenan - Ein Schloss für Buddha
  description: |-
    Im oberösterreichischen Kremsmünster bekommen Buddhistinnen und Buddhisten ein neues Zuhause: Nur wenige hundert Meter vom katholischen Benediktinerstift entfernt entsteht in Schloss Kremsegg ein internationales Bildungszentrum des tibetischen Buddhismus: vom Kindergarten bis zur buddhistischen Universität. Ein Novum für Österreich. Für Kremsmünster bemerkenswert: Denn seit mehr als tausend Jahren prägt das Benediktinerstift den Ort: mit Stiftskirche, Gymnasium, Bibliothek und Sternwarte.
    Die Reportage begleitet die Buddhistinnen und Buddhisten über mehrere Monate, besucht die Mönche im Stift und fragt im Ort nach: Wie kommt es an, dass ausgerechnet hier, im Herzen der oberösterreichischen Klosterlandschaft, ein neues religiöses Bildungszentrum entsteht? Zwei Mönchsgemeinschaften, zwei Traditionen - und nur ein paar hundert Meter dazwischen.
    Im "kreuz & quer plus": Was im Leben zählt: Konfuzius -  Warum immer weiter lernen?
  genre:
  - '115'
