  title: 'Soundtrack of Arts:'
  subtitle: Louvre - Da Vinci - Will.I.Am
  description: "(Dokumentation, DEU 2023)\nMona Lisa ist ein Popstar und der Louvre ein Filmset. Musikvideos von Madonna, Lady Gaga, Beyoncé, Kendrick Lamar oder Jay-Z zeigen in bildgewaltigen Settings berühmte Museen und Ikonen der Kunstgeschichte. Sie spielen mit magischen Bildwelten von Leonardo da Vinci, van Gogh, Renoir, Seurat, Dali oder Hopper. Worin liegt der Zauber der bildenden Kunst? Was machte sie zu allen Zeiten für Musiker:innen so attraktiv? Und was vereint bildende Kunst mit Pop und Klassik? \nIm ersten Teil dieser Dokuserie verewigt Stephen Sondheim das Leben des Malers Georges Seurat am Broadway in einem Musical. Der Komponist Henri Dutilleux lässt in van Goghs Sternennacht die Winde wirbeln und im Louvre inszenieren Beyoncé und Jay-Z ihr \"black empowernment\". Diese enge Verknüpfung zwischen bildender Kunst und Musik hat eine Jahrhunderte alte Tradition. Regisseur Axel Fuhrmann begibt sich auf eine spannende Reise zu den \"Soundtracks of Arts\"."
  genre:
  - '112'
