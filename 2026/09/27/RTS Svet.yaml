- eventId: 1167687
  start: 2026-09-27T20:30:00Z
  stop: 2026-09-27T21:00:00Z
  title: Edu global
  subtitle: Klimatske katastrofe su širom sveta u poslednje vreme raselile mnogo više ljudi nego ratovi.
  description: Klimatske katastrofe su širom sveta u poslednje vreme raselile mnogo više ljudi nego ratovi. Klimatolozi zato upozoravaju na ozbiljnost situacije i apeluju na svetske lidere da preduzmu korake u borbi protiv humanitarnih posledica globalnog zagrevanja. Jer milioni ljudi su već raseljeni, a u budućnosti će ih biti još više. Pored ostalog, u emisiji ćete videti kako klimatske promene izazivaju pustoš u Istočnoj Africi, ali i kako u Velikoj Britaniji erozija obale, izazvana baš klimatskim primenama, primorava ljude da napuste svoje domove. Glavno pitanje na klimatskom samitu KOP28, koji se održao u Dubaiju, bilo je kako da ograničimo globalno zagrevanje. Kljluč je u prestanku korišćenja fosilnih goriva i prelasku na obnovljive izvore energije. Medjutim, zbog velikog otkrića nafte sa jedne strane i klimatskih posledica koje ona izaziva sa druge, siromašna Gvajana se našla na klackalici i sada mora da bira ? profit ili klima.
