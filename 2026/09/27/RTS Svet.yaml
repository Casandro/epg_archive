  title: Znanje imanje
  subtitle: Paprika, grožđe i konji su simboli jeseni, seoskog života i naše bogate tradicije. Godina je rodna slažu se svi, a ko će sirovinu preraditi i kome i za koliko prodati.
  description: 'Paprika, grožđe i konji su simboli jeseni, seoskog života i naše bogate tradicije. Godina je rodna slažu se svi, a ko će sirovinu preraditi i kome i za koliko prodati. Na ove teme i o ljubavi prema konjima ovoj emisiji Znanja imanja govore: Miloš Marjanović iz sela Nakrivanj zajedno sa porodicom proizvodi čuvenu papriku kurtovku - o kvalitetu, jedinstvenom proizvodu i tržištu. Jovan Stojković iz sela Donja Lokošnica, ovaj 90-godišnjak govori zašto samo u ovom selu uspeva seme paprike "koziji rog" od koje nastaje začin za svako jelo. Saša Jović, vinar i vinogradar iz sela Potrkanje - zašto je okolina Knjaževca pogodna za sortu vranac. Jovan Pecić iz sela Tobolac kod Trstenika o konjarstvu koje spaja tradiciju, turizam i humanost. Bora Jovanović, predsednik Udruženja odgajivača lipicanerske rase konja Srbije - šta izložba lipicanera u Surduku znači za odgajivače i sa kakvim izazovima se suočavaju.'
