  description: Osvedočeni i nagrađivani stvaralac, autor Rokenrolera, TV filmova Ruski umetnički eksperiment i Šumanović - komedija umetnika, kreirao je dokumentarnu TV seriju - svojevrsni televizijski eksperiment, Fabrika šećera. To je privatna istorija jedne zemlje koje više nema i priča o jednom neobičnom mestu i ljudima koji su ga obeležili. Od pripovedačevog oca Petra, koji je na mnogo načina povezan sa sudbinom Egipta i Jugoslavije, kao i sa kućom u kojoj se danas nalazi ambasada Republike Srbije u Kairu, preko samog pripovedača, Borisa Miljkovića, koji se zatekao u toj istoj kući 1991. godine, na početku raspada Jugoslavije, sve do kairskih prijatelja i njihovih iskustava, u kojima su i Egipat i Jugoslavija važne stanice na životnom putu. Naizgled nepovezani događaji, posle izvesnog vremena počinju da dobijaju svoj pravi redosled, bez obzira na vreme u kojem su se pojavljivali u kaleidoskopu doživljaja. Tako, određene stvari za koje mislimo da su izmišljotina i apsolutni plod naknadnog...
