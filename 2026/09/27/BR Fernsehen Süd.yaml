  title: Wiesn Platzkonzert 2026
  subtitle: 'Moderation: Dominik Glöbl'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Moderator Dominik Glöbl begrüßt die Zuschauerinnen und Zuschauer mit rund 300 Blasmusikerinnen und Blasmusikern sowie bekannten Persönlichkeiten rund um die Wiesn. Münchner Politiker und Wiesn-Persönlichkeiten, die sich rund um das Oktoberfest besonders verdient gemacht haben, übernehmen dabei den Taktstock.
    Erstmals ist auch der berühmte Tölzer Knabenchor auf der Platzkonzert-Bühne zu Gast.
