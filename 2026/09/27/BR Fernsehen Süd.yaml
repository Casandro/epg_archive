  title: Wiesn-Gschichten
  subtitle: Unterwegs mit Susanne Wiesner
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Mit historischen Fahrgeschäften, traditionellen Tänzen, Volksmusik in den Bierzelten und Biergärten bietet die Oide Wiesn den Oktoberfest-Besuchern eine kleine Oase. Hier werden Tradition und der Brauch der bayerischen Gemütlichkeit noch gelebt und zelebriert. BR-Moderatorin Susanne Wiesner taucht tief in diese bunte und beschauliche Seite des Oktoberfests ein und entdeckt dabei so manch altes Handwerk, skurrile Geschichten und typisch bayerische Traditionen. Dabei blickt sie hinter die Kulissen, trifft auf so einige Wiesn-Urgesteine und zeigt, was die Oide Wiesn so besonders macht.
