  title: Stanzls Wiesn Bummel
  subtitle: Das erste Mal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Alles nochmal so erleben, als wäre es zum ersten Mal. Diesen Gedanken verfolgt Constanze Lindner bei ihrem diesjährigen Wiesn-Bummel auf dem Oktoberfest. Auf ihrem Weg über die Theresienwiese stürzt sich die BR-Moderatorin in das bunte Treiben rund um Fahrgeschäfte, Festzelte und Wiesnbesucher. Gemeinsam mit lieben Gästen und absoluten Wiesn-Neulingen erlebt die gebürtige Münchnerin die Wiesn nochmal aus der Perspektive eines Wiesn-Neulings. Mit all dem Staunen, der Vorfreude und vielleicht auch der leichten Überforderung, die man hat, wenn man das größte Volksfest der Welt zum ersten Mal besucht.
