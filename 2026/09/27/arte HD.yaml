  title: Italiens unbekannter Norden
  subtitle: Das Ossolatal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im Norden des Piemont erstreckt sich vom Lago Maggiore bis zur Schweizer Grenze das Ossolatal. Wasser hat hier den Fels geformt und spektakuläre Landschaften entstehen lassen - geprägt von Wasserfällen, Schluchten und Canyons. Die Reichtümer des Landes, wie etwa Marmor, und Gold, nutzen Menschen seit Jahrhunderten. Der wahre Schatz der Region ist aber das Wasser.
- eventId: 567551
