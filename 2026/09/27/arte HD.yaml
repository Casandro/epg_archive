- eventId: 567593
  start: 2026-09-27T03:10:00Z
  stop: 2026-09-27T03:40:00Z
  title: Die Mythen der Wikinger (1/10)
  subtitle: Odins Visionen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Um zu erfahren, was die Zukunft für die Götter Asgards und die anderen Kreaturen des Universums bereithält, muss Göttervater Odin eine schreckliche Prüfung bestehen: Neun Tage und neun Nächte lang wird er am Weltenbaum Yggdrasil hängen, ohne zu essen oder zu trinken. Wenn er Wissen erlangen will, muss er zudem sein linkes Auge opfern. Als er wieder zu sich kommt, hört er ein Wort, das das Schicksal des Universums besiegeln wird: "Ragnarök".'
- eventId: 567594
  start: 2026-09-27T03:40:00Z
  stop: 2026-09-27T04:05:00Z
  title: Die Mythen der Wikinger (5/10)
  subtitle: Kvasir und der Dichtertrank
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Odin versucht, den drohenden Untergang Asgards hinauszuzögern, und stellt mit den Walküren in Valhalla eine grausame Armee der Toten auf. Unterdessen durchstreift der Dichtergott Kvasir die neun Welten, um sein Wissen zu lehren. Zwei Zwerge locken ihn in eine Falle und erschaffen aus seinem Blut einen magischen Trank. Besorgt macht Odin sich auf die Suche nach Kvasir und überlässt seiner Frau die Herrschaft über Asgard. Frigg entdeckt, dass Freya einen heimlichen Geliebten hat und ihm zuliebe einer Riesin Zutritt nach Asgard verschafft hat. Wütend befiehlt Odin Loki, Freyas Halsband Brisingamen zu stehlen.
- eventId: 567595
