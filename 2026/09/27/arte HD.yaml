  description: Der französische Pianist, Komponist und Arrangeur Jacques Loussier (1934-2019) löste im Jahr 1959 mit seinem Album "Play Bach" einen handfesten Skandal aus. Er arrangierte die Musik Johann Sebastian Bachs neu und setzte sie in ein Gewand aus jazzigen Klängen und Rhythmen. Der damals 24-Jährige war der erste Musiker, der konsequent klassische Musik mit Jazz verband.
