  hd: true
  audiodesc: true
  description: Die Avenue des Champs-Élysées ist eine der berühmtesten Straßen der Welt. Sie steht für Luxus und französischen Lebensstil, ist zugleich Bühne nationaler Identität und Ort öffentlicher Debatten. Bis 2030 soll die Allee für rund 250 Millionen Euro wieder zur Flaniermeile werden. Trotz aller Kontroversen sehen die Menschen, die hier täglich arbeiten, die reiche Geschichte dieser Straße.
