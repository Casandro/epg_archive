  title: Das rote Haus (1/2)
  subtitle: Überleben in Grönland
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Robert Peroni war in den 1980er Jahren als Extremsportler bekannt. Der Südtiroler Abenteurer verliebte sich jedoch so sehr in Grönland und die Menschen dort, dass er beschloss, sein Leben zu ändern. Er gab die Jagd nach Geld und Ruhm auf und zog in den Hohen Norden. Seine Mission: Er will das letzte Jägervolk Europas vor dem Untergang retten.'
- eventId: 567596
  start: 2026-09-27T04:50:00Z
  stop: 2026-09-27T05:35:00Z
  title: Das rote Haus (2/2)
  subtitle: Zukunft in Grönland
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    "Das rote Haus" ist das Projekt des Südtiroler Abenteurers Robert Peroni, der in Grönland dem letzten Jägervolk Europas in die Zukunft hilft. Seit Seehundfelle nicht mehr gehandelt werden dürfen, haben die Menschen dort ihre Existenzgrundlage verloren. Viele aus der jungen Generation bringen sich um. Peroni hat eine Lösung gefunden, mit der er das verhindern will.
    Der Film begleitet Robert Peroni bei seiner selbstgewählten Lebensaufgabe und zeigt im "Roten Haus", was es bedeuten kann, Menschen etwas zurückzugeben.
