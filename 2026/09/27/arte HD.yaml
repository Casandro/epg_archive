  description: Seit 1506 schützt die Schweizer Garde, die kleinste Armee der Welt, den Papst und seine Residenz. Verändert haben sich jedoch die Methoden der Auftragserfüllung und das Umfeld, in dem sich die Gardisten bewegen. In der traditionellen Uniform steckt heute ein junger, moderner und gut ausgebildeter Schweizer.
