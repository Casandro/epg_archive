  description: Mit "La Boum - Die Fete" begann 1980 die Karriere der damals 14-jährigen Sophie Marceau, die seither in Autorenfilmen und Blockbustern zu überzeugen weiß - und dabei stets sie selbst blieb. Schon früh zeigte Sophie Marceau, dass sie sich von niemandem in der Filmbranche etwas diktieren lässt, und wurde mit ihrer charmanten Authentizität zu einem der beliebtesten Stars Frankreichs.
- eventId: 570088
