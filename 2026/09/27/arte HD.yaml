  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Barbie ist ein Phänomen. Es gibt sie in allen Hautfarben, im Rollstuhl, sie ist divers und inklusiv. Keine wird so geliebt und gehasst. Im Juli kommt Barbie mit einer Hollywoodkomödie ins Kino. Erfunden von der Geschäftsfrau Ruth Handler, 1959 erstmals in New York präsentiert, ein Kassenschlager. Die erste erwachsene Puppe mit eigener Karriere - ein Vorbild. Mit Millionen Followern auf Instagram ist sie heute auch Influencerin. Die Dokumentation taucht ein in die Welt der Barbie-Content-Kreatorinnen, trifft die mit 18.500 Puppen berühmteste Sammlerin und spricht mit Feministinnen und Fans.
