  title: Vroege vogels
  subtitle: 'Radioprogramma over natuur, milieu, klimaat en duurzaamheid. Presentatie: Menno Bentveld.'
  description: 'Nog vijf titels zijn in de race voor de prijs voor het beste Natuurboekenprijs van 2026! Tijdens de extra feestelijke uitzending maken we de winnaar bekend vanaf Landgoed Oostbroek in de Bilt waar aansluitend het Vroege Vogels Festival plaats vindt. En verder in de uitzending: De publieksprijs, Neanderthalers, Street Bird Art, Utrechts landschap bijna 100 jaar, Bodemdierendagen, Paardenmosselen op de Doggersbank en de fenolijn. De columns zijn van Bibi Dumon Tak en Laura van Dolron. Vroege Vogels Radio op NPO Radio 1 wordt zondag gepresenteerd door Menno Bentveld van 7.00 tot 10.00 uur. Lees meer over de gehele uitzending. (2026)'
