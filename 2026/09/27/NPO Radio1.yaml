  subtitle: 'Op zaterdag- en zondagochtend luister je tussen 06.00 tot 07.00 uur naar het cultuurprogramma van de VPRO: Een Uur Cultuur.'
  description: 'Op zaterdag- en zondagochtend luister je tussen 06.00 tot 07.00 uur naar het cultuurprogramma van de VPRO: Een Uur Cultuur. Elk weekend ontvangen Teddy Tops en Eva Koreman een spraakmakende cultuur-gast, die spannende, ontroerende en gratis tips deelt. Wat moet je de komende tijd luisteren, lezen of bezoeken? Deze ochtend stamp je je agenda vol met de beste muziek, boeken, films, concerten, exposities, theater- en dansvoorstellingen - althans volgens onze gast. Èn je leert deze maker, muzikant, ontwerper of schrijver, beter kennen aan de hand van diens eigen werk en persoonlijke tips. (2026)'
