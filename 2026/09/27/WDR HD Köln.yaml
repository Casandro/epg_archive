- eventId: 557619
  start: 2026-09-27T14:15:00Z
  stop: 2026-09-27T14:30:00Z
  title: Faszination Party-Schlager - Wenn NRW feiert
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Überall in NRW wird gefeiert, aber nirgendwo so groß wie bei den Schlager-Festivals im Westen. Wir blicken hinter die Kulissen von "Mönchengladbach Olé" und zeigen die echte Arbeitsrealität abseits der großen Bühne. Mitten im Trubel begleiten wir die Künstlerin Frenzy, deren Alltag zwischen dem ruhigen Leben im Rheinland und dem wöchentlichen Pendeln nach Mallorca eine ständige Gratwanderung ist. Während Julian Sommer auf der Fahrt zum Auftritt ganz offen darüber spricht, wie viel Disziplin und harte Arbeit hinter seinem Party-Image stecken, laufen im Hintergrund bereits alle Fäden bei Produktionsleiterin Kim zusammen.
- eventId: 557620
  start: 2026-09-27T14:30:00Z
  stop: 2026-09-27T15:15:00Z
  title: Japans Garten Eden - Die Insel Iriomote
  subtitle: Deutschland/Japan 2023
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Zwischen dem Chinesischen Meer und dem Pazifik, im äußersten Süden Japans, liegt die Insel Iriomote: ein Juwel, von dichten tropischen Wäldern bedeckt, die Küsten von Mangroven geschützt. Hier leben einige der seltensten Tiere der Erde. Darunter die Iriomote-Katze, die Schlangenweihe und der Ryukyu-Flughund. Iriomote ist ein Hotspot der Artenvielfalt und zählt daher zum UNESCO-Weltnaturerbe.'
- eventId: 557751
  start: 2026-09-27T15:15:00Z
  stop: 2026-09-27T16:00:00Z
  title: 'Erlebnis Erde: Giganten im Mittelmeer - Pottwalen auf der Spur'
  subtitle: Ein Film von Heiko De Groot
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sie sind die größten Raubtiere der Erde. Ihr Revier liegt in den Untiefen der Ozeane: Pottwale waren schon im Altertum ein Mythos und sie sind es bis heute. Lange glaubten Wissenschaftler, dass es sich bei Pottwalen im Mittelmeer um verirrte Tiere handeln muss - denn wo sollen die Meeresriesen außerhalb der Polargewässer jagen? Ihre Lieblingsspeise, die Riesenkalmare, scheint es hier nicht zu geben. Griechische Forscher konnten jedoch beweisen, dass Pottwale auch im Mittelmeer heimisch sind.'
- eventId: 557752
  start: 2026-09-27T16:00:00Z
  stop: 2026-09-27T16:45:00Z
  title: Tiere suchen ein Zuhause
  subtitle: 'Moderation: Simone Sombecki'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In jeder Folge stellen nordrhein-westfälische Tierschutzvereine ausgesetzte oder in Tierheimen abgegebene Tiere vor, um sie an tierliebe Zuschauer zu vermitteln. Im Mittelpunkt stehen die beliebtesten Haustiere, Hunde und Katzen, aber auch Vögel, Kleintiere, Pferde und Hausschweine suchen via Bildschirm ein gutes und vor allem dauerhaftes, neues Zuhause.
