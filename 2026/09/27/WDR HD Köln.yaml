  title: Slime - Rock Hard Festival 2026
  subtitle: Aufzeichnung vom 23. Mai 2026 aus dem Amphitheater, Gelsenkirchen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Slime aus Hamburg sind eine der einflussreichsten und beliebtesten Punkbands Deutschlands. 1979 gegründet, wurden sie innerhalb kürzester Zeit zu einer treibenden Kraft in der Szene. Und der Einfluss von Slime in der deutschen Musikszene ist enorm: Ob Punkrock-Bands wie Die Toten Hosen, Alternative- und HipHop-Acts wie Casper, Absolute Beginner und Antilopen Gang oder Metalbands wie Kreator - sie alle sind im Laufe ihrer Karriere von Slime beeinflusst worden.'
