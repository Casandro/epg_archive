  title: Wunderschön! Chiemsee - Wasserwelt und Alpenzauber
  subtitle: 'Moderation: Judith Rakers'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Chiemsee, auch "Bayerisches Meer" genannt, ist der größte See Bayerns und ein wahres Paradies für Natur- und Wasserliebhaber. Er liegt eingebettet in die Hügel des Chiemgaus und bietet eine beeindruckende Kulisse mit den Alpen im Hintergrund. Neben atemberaubender Natur steht die Region für gelebte Tradition und Familienzusammenhalt. Für Wunderschön begibt sich Judith Rakers  auf Spurensuche. Sie will herausfinden, was das besondere Lebens- und Urlaubsgefühl dieser beliebten Ferienregion ausmacht.
- eventId: 556753
