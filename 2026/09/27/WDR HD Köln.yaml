  title: Die Ärzte der Ägäis
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Griechenland hat über 200 bewohnte Inseln, von denen viele nicht über eine medizinische Versorgung verfügen. Glücklicherweise gibt es Ärzte, die solche entlegenen Ägäis-Inseln besuchen, um ehrenamtlich zu helfen. "Re:" begleitet die Mission eines Ärzteteams auf die Kykladen-Insel Serifos. Dort wird mit zwei Lkw voll medizinischem Equipment für ein paar Tage ein provisorisches Krankenhaus errichtet.
- eventId: 557475
