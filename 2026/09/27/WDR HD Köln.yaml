  stop: 2026-09-27T13:10:00Z
  title: WaPo Bodensee (37)
  subtitle: Vom Fischer und seiner Frau
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Fang eines riesigen Welses birgt für zwei Angler eine unangenehme Überraschung. Im Bauch des Fisches findet sich ein abgetrennter Frauenfinger mit einem Ehering. Die Suche nach der dem Finger zugehörigen Frau gestaltet sich für die WaPo Bodensee schwierig. Schließlich findet Julia eine erste Spur. Sie führt zu einem Berufsfischer, Johannes. Dieser will, seit seine Frau Greta mit ihrem neuen Freund nach Australien gegangen ist, nichts mehr von ihr gehört haben. Der gemeinsame Sohn Michael reagiert offensichtlich verstört. Sein Onkel Martin reagiert abweisend auf den Besuch der Polizei und lenkt den Verdacht auf Johannes.
- eventId: 557617
  start: 2026-09-27T13:10:00Z
  stop: 2026-09-27T14:00:00Z
  title: WaPo Bodensee (38)
  subtitle: Harter Stoff
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Auf diese Situation waren Julia und Jakob nicht vorbereitet: Sie müssen ihre Chefin Nele bitten, ihnen Dienstausweis und die Waffe auszuhändigen. Denn Nele ist bis auf Weiteres vom Dienst suspendiert. Die Chefin der Dienststelle steht immer noch unter Schock: Sie hat bei einer missglückten Festnahme den kleinkriminellen Junkie Kevin Krause angeschossen. Alle Wiederbelebungsversuche mit Hilfe von Notarzt Martin Dillinger blieben wirkungslos. Nele macht sich schwere Vorwürfe, am Tod von Kevin Schuld zu sein. Nur gut, dass der attraktive Dillinger Nele Hilfe anbietet, die über das normale Maß hinausgeht.'
