  audiodesc: true
  description: Der junge Musiker Daniel Gerber lebte zuletzt auf der Straße. Jetzt wurde seine Leiche am Rheinufer gefunden. Eine Spur führt die Kommissare Max Ballauf und Freddy Schenk zu einem Wohnhaus in der Nähe des vermeintlichen Tatorts. Dort entdeckt die Spurensicherung im Hausflur einen Blutfleck. Die Bewohner des Hauses erweisen sich jedoch als wenig hilfsbereit.
- eventId: 558002
  start: 2026-09-27T19:45:00Z
  stop: 2026-09-27T21:10:00Z
  title: Mordkommission Istanbul - Club Royal
  subtitle: Fernsehfilm Deutschland 2015
  ageRating: 12
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im Krankenhaus wartet ein 19-jähriges Vergewaltigungsopfer auf Kommissar Özakin. Die Studentin behauptet, ihr Exfreund Birol habe sich nach einer ausgedehnten Partynacht an ihr vergangen. Doch als Özakin und sein Kollege Tombul Birol aufsuchen wollen, finden sie nur dessen Leiche - er wurde offensichtlich ermordet! Es deutet alles darauf hin, dass Birols dubiose Drogengeschäfte den Mann das Leben kosteten. Für die Polizei bestehen außerdem kaum Zweifel, dass Nachtklubbesitzer Baschtir seine Finger mit in dem schmutzigen Spiel hatte.
