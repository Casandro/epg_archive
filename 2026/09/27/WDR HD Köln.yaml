  stop: 2026-09-27T02:30:00Z
  title: Land & lecker - Kulinarische Schätze aus Oberbayern (2)
  subtitle: Grunzochsen und wilde Kräuter
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die zweite Reise geht nach Oberbayern. Die gebürtige Münsterländerin Andrea Meßmer ist der Liebe wegen in die Jachenau im Voralpenland gezogen und hat sich hier mit ihrem Mann Josef eine Yakzucht aufgebaut. Über die Beobachtung der weidenden Yaks hat Andrea ihre Leidenschaft für Wildkräuter entdeckt. Neben den Wildkräutern als kulinarischem Schatz präsentiert sie asiatisches Rind in allen Gängen ihres Landmenüs: Kurzgebratenes vom Yak mit Gute-Heinrich-Gersten-Orzotto und Fichtenspitzen-Topfenknödel an Beeren-Ragout mit Yakherz-Parmesan.'
