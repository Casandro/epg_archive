  title: Rozhlasové listování
  description: Léto 1945. Anuška se stále nevzdává naděje, že najde ztraceného syna, Ženka se proto vydává do Ostravy do sídla Červeného kříže. To Wojtek má jiné starosti, stává se karvinnským radním. První schůze, které se účastní, je velmi bouřlivá. Pátá část četby ze závěrečného dílu trilogie Karin Lednické Šikmý kostel.
