  description: (Inédit) Fogo do vento (Feu du vent) Soraia travaille aux vendanges et est la protagoniste d'un rituel presque perdu. Elle fait face à un taureau noir qui s'est échappé. Au sommet des arbres, la communauté partage le pain avec les ancêtres. Nous entrons dans la grande nuit onirique, où la nature parle aussi. II brûle, c'est le feu du vent qui amène la canicule. (Suisse Romande-2024)
