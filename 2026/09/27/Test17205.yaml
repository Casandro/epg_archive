  title: Dîner à la ferme
  description: |-
    Nouvelles Graines : Natacha Sottas, Vaud Avant de créer son exploitation sur les hauteurs de Glion avec son mari Julien, Natacha a eu une première vie comme coureuse automobile ! Cousine de Sébastien Buemi, elle a rivalisé avec le champion de F1 dans des courses de karting alors qu'ils étaient enfants. Natacha a aussi participé à des courses de Formule 3 et Formule 2 et elle a aussi participé deux fois aux 24h du Mans. Après avoir abandonné la compétition, elle a fait un sacré virage avec son mari Julien. Ancien bûcheron, il se rêvait agriculteur depuis tout petit.

     (Suisse Romande-2026)  "Audio description"
