  title: Documentaires
  description: Le temps des femmes ? Qu'est-ce qui a vraiment changé pour les femmes depuis les années 1960? Porté par la voix d'Agnès Jaoui, ce film drôle et émouvant retrace les grandes étapes de la vie des femmes. À travers des archives réjouissantes et les témoignages de quatorze femmes, célèbres ou anonymes, il raconte leurs combats, leurs conquêtes et les inégalités qui persistent. (France-2025)
