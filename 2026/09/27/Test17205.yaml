  title: Histoire vivante
  description: Les usines de Staline face aux armées d'Hitler Attaquée en 1941 par le IIIe Reich, l'URSS a sauvé son industrie militaire en la délocalisant loin des combats. Mobilisés dans les usines et dans les kolkhozes, les civils ont été durement mis à contribution. Ce documentaire dévoile une page méconnue de l'histoire de la Seconde Guerre mondiale côté soviétique. (France-2024)
