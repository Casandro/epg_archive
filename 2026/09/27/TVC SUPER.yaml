  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 3)'
  subtitle: Policjanci otrzymują e-maila, w którym anonimowy nadawca informuje, że o godzinie 11:11 pan Van der Vaeren umrze. Niejasna groźba zostaje potraktowana poważnie, a Candice znajduje mężczyznę.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Olivier Laneurie
    Występują: Cécile Bois, Raphaël Lenglet, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab
    Dziś rano, o 11:11, pan Van der Vaeren umrze" - oto treść e-maila, który otrzymali śledczy. Ta niejasna groźba została potraktowana z całą powagą przez Candice i jej zespół. Przedsiębiorcę udaje im się zlokalizować na placu budowy. Mężczyzna, nie rozumiejąc zagrożenia, początkowo jest podenerwowany całą sytuacją. Wkrótce umiera na zawału serca. Godzina jego śmierci odpowiada dokładnie tej, która została podana w wiadomości.
  ageRating: 12
- eventId: 1050372
  start: 2026-09-27T19:25:00Z
  stop: 2026-09-27T20:35:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 2 (odc. 4)'
  subtitle: Pablo, młody i błyskotliwy przedsiębiorca, zostaje zepchnięty z mostu. Candice podejrzewa, że mężczyzna padł ofiarą grafficiarza i postanawia złapać znanego w mieście artystę, nieuchwytnego Kota.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2014
    Reżyseria: Etienne Leduc
    Występują: Cécile Bois, Raphaël Lenglet, Mhamed Arezki, Gaya Verneuil, Alix Poisson, Samira Lachhab
    Pablo, młody i błyskotliwy przedsiębiorca, zostaje zepchnięty z mostu. Candice podejrzewa, że mężczyzna padł ofiarą grafficiarza, postanawia więc zapolować na znanego w całym mieście artystę, nieuchwytnego Kota, który w ciągu ostatnich dwóch lat nie raz już dał nauczkę służbom usiłującym go złapać. Tymczasem rachunki za jego wandalizm idą w dziesiątki tysięcy euro.
  ageRating: 16
- eventId: 1050373
