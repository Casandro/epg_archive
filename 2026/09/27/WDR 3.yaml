  title: WDR 3 Oper live
  subtitle: Der Rosenkavalier - Oper von Richard Strauss
  description: |-
    Die Oper Köln kehrt zurück an ihren angestammten Platz: Mit Richard Strauss' "Der Rosenkavalier" startet das Opernhaus am Offenbachplatz seine erste Spielzeit im umfassend sanierten Haus. WDR 3 begleitet dieses herausragende Ereignis live und sendet den ganzen Nachmittag direkt aus der Oper Köln.
    Schon ab 15 Uhr stimmen wir auf die Premiere ein. Mit Opernintendant Hein Mulders blicken wir auf die Eröffnung des Hauses und die Festwoche zurück. Außerdem sprechen wir über die Bedeutung der Oper Köln für das kulturelle Leben der Stadt und ihre Strahlkraft weit über die Region hinaus.
    Ab 16 Uhr folgt die Live-Übertragung von Richard Strauss' "Der Rosenkavalier" in der Inszenierung der französischen Regisseurin Marie-Ève Signeyrole. Im Mittelpunkt der Oper steht die Feldmarschallin, die ihren jungen Geliebten Octavian loslassen muss, als dieser sich in die junge Sophie verliebt. Zwischen Verwechslungen, Rollenspielen und feinem Wiener Humor setzt sich am Ende die Liebe gegen Standesdünkel und Eigennutz durch. Mit ihrer schillernden Orchesterpracht, ihrer unvergesslichen Walzerseligkeit und ihren großen Gefühlen ist Strauss' Musik wie geschaffen für diesen festlichen Anlass.
    In den Pausen sprechen wir mit Künstlerinnen und Künstlern der Produktion, entdecken die Neuerungen des Opernhauses und erfahren, wie es sich für langjährige Ensemblemitglieder und Mitarbeitende anfühlt, wieder an ihren vertrauten Wirkungsort zurückzukehren. Ein außergewöhnlicher Tag für Köln und alle Opernfreundinnen und Opernfreunde.
    <strong>"Der Rosenkavalier"</strong> <br/>Komödie für Musik ist eine Oper in drei Aufzügen<br/>von <strong>Richard Strauss<br/></strong>Libretto:<strong> Hugo von Hofmannsthal</strong>
    Feldmarschallin Fürstin Werdenberg: <strong>Magdalena Hinterdobler</strong> (Sopran)<br/>Octavian: <strong>Bianca Andrew</strong> (Mezzosopran)<br/>Sophie: <strong>Giulia Montanari</strong> (Sopran)<br/>Baron Ochs auf Lerchenau: <strong>Patrick Zielke</strong> (Bass)<br/>Herr von Faninal:<strong> Christian Miedl</strong> (Bariton)<br/>Valzacchi: <strong>Martin Koch</strong> (Tenor)<br/>Annina: <strong>Dalia Schaechter</strong> (Mezzosopran)<br/>Jungfer Marianne Leitmetzerin: <strong>Claudia Rohrbach</strong> (Sopran)<br/>Ein Sänger: <strong>Young Woo Kim</strong> (Tenor)<br/>Polizeikommissar / Notar: <strong>Lucas Singer</strong> (Bass)<br/><br/><strong>Chor der Oper Köln</strong><br/><strong>Knaben und Mädchen der Kölner Dommusik</strong><br/><strong>Gürzenich-Orchester Köln</strong><br/>Leitung: <strong>Andrés Orozco-Estrada</strong>
    Moderation: Susanne Herzog<br/>Redaktion: Christian Schnitzler
