  title: WDR 3 Studio Neue Musik
  description: "Seine Musik versetzt in Trance, ein mäandernder Klangstrom. 1994 traf Autor Sven Ahnert den Komponisten in New York. Von den frühen Phasing-Experimenten über den Skandal in der Carnegie Hall bis zur engen Künstlerpartnerschaft mit dem Ensemble Modern beleuchtet die Sendung das Universum einer eigensinnigen Stimme der Neuen Musik. Am 3. Oktober 2026 feiert Steve Reich seinen 90. Geburtstag. \n<strong>Steve Reich: \"It's Gonna Rain\"</strong><br/>Steve Reich, Loops. Brother Walter, Voice Shem Guibbory<br/>Elektra Nonesuch 9 79169-2\n<strong>Steve Reich: \"Violin Phase\"</strong><br/>Shem Guibbory, Violine<br/>ECM 1168\n<strong>Steve Reich: \"Drumming\"</strong><br/>Steve Reich and Musicans<br/>Deutsche Grammophone: 2740 106\n<strong>Steve Reich: \"Music for 18 Musicians\"</strong><br/>Ensemble Modern<br/>BMG Classics 09026 68672 2\n<strong>Steve Reich: \"Proverb\"</strong><br/>Theatre of Voices, Paul Hillier<br/>Nonesuch 7559-79430-2\n<strong>Steve Reich: \"Different Trains\"</strong><br/>Kronos Quartet<br/>Nonesuch 7559-79287-5\n<strong>Musik \"WTC 9/11\"</strong><br/>Kronos Quartet<br/>Nonesuch 528236-2\n<strong>Musik \"Tehillim\"</strong><br/>Jay Clayton (Alto), Lewis Paer (Bass), Chris Finckel (Cello), Virgil Blackwell (Clarinet/Flute), Mort Silver (Clarinet/Piccolo), George Manahan (Conductor), Ellen Bardekoff (English Horn), Vivian Burdick (Oboe), Edmund Niemann &amp; Nurit Tilles (Electric Organ), Pamela Wood* (High Soprano), Rebecca Armstrong (Lyric Sopano), Bob Becker, Garry Kvistad, Gary Schall, Glen Velez, Russ Hartenberger, Steve Reich (Percussion), Ruth Siegler (Viola), Robert Chausow &amp; Shem Guibbory (Violin).<br/>ECM 2540-42"
  subtitle: 'Am Puls der Ewigkeit: Steve Reich 90'
