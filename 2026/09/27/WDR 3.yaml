  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: "Zu den besonderen Hörerwünschen dieser Ausgabe der WDR 3 Lieblignsstücke gehört Johann Georg Albrechtsbergers ungewöhnliches Konzert für Maultrommel und Mandora, ein ebenso virtuoses wie originelles Werk der Wiener Klassik. Einen ganz anderen Klangraum eröffnet Howard Brubecks \"Dialogues for Jazz Combo and Orchestra\", in dem Leonard Bernstein Jazz und Sinfonik auf eindrucksvolle Weise zusammenführt. \nDie Rumänische Rhapsodie Nr. 1 von George Enescu steht für die Begeisterung, die ein außergewöhnliches Konzerterlebnis hinterlassen kann. Mit Sergej Rachmaninows Oper \"Der geizige Ritter\" erklingt zudem ein Werk, das viele Hörerinnen und Hörer erst durch die Neugier auf unbekannte Seiten eines vertrauten Komponisten entdecken.\nDie Meisterstücke widmen sich anschließend Gabriel Fauré und zeigen mit dem späten Klaviertrio, der \"Élégie\" und weiteren Kammermusikwerken die feinsinnige, lyrische Welt des französischen Meisters.\n<strong>Die Musikstücke der Sendung</strong>\n<strong>Jan Dismas Zelenka</strong><br/>Capriccio Nr. 4 A-Dur: Allegro assai<br/>Camerata Bern<br/>Leitung: Alexander van Wijnkoop<br/>(6'05'')\n<strong>Johann Georg Albrechtsberger</strong><br/>Konzert F-Dur<br/>Fritz Mayr, Maultrommel<br/>Dieter Kirsch, Mandora<br/>Münchner Kammerorchester<br/>Leitung: Hans Stadlmair<br/>(18'26'')\n<strong>Howard Brubeck</strong><br/>Dialogues for Jazz Combo and Orchestra<br/>ad-hoc Jazz Combo<br/>New York Philharmonic<br/>Leitung: Leonard Bernstein<br/>(21'51'')\n<strong>George Enescu</strong><br/>Rumänische Rhapsodie Nr. 1<br/>BBC Philharmonic Orchestra<br/>Leitung: Gennady Rozhdestvensky<br/>(12'55'') [260927 Lie...ke FH - NF | Word]\n<strong>Sergej Rachmaninow</strong><br/>Der geizige Ritter op. 24<br/>Göteborgs Symfoniker<br/>Leitung: Neeme Järvi<br/>(58'33'') \n<strong>Jan Dismas Zelenka</strong><br/>Capriccio Nr. 4 A-Dur (Auswahl)<br/>Camerata Bern<br/>Leitung: Alexander van Wijnkoop\n<strong>12:00 - 12:04 Nachrichten</strong>\ndanach\n<strong>Meisterstücke</strong>\ndanach:\n<strong>Gabriel Fauré</strong><br/>Trio d-Moll op. 120<br/>Pierre Colombet, Violine<br/>François Salque, Violoncello<br/>Éric Le Sage, Klavier<br/>(21'06'') \n<strong>Gabriel Fauré</strong><br/>Après un rêve op. 7 Nr. 1<br/>Raphaël Merlin, Violoncello<br/>Éric Le Sage, Klavier<br/>(2'16'') \n<strong>Gabriel Fauré</strong><br/>Andante op. 75<br/>Daishin Kashimoto, Violine<br/>Éric Le Sage, Klavier<br/>(5'24'')\n<strong>Gabriel Fauré</strong><br/>Élégie op. 24<br/>François Salque, Violoncello<br/>Éric Le Sage, Klavier<br/>(5'58'')\nModeration: Nele Freudenberger<br/>Redaktion: Frank Hilberg"
