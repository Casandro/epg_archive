  subtitle: John Coltrane 100 - Gigant des Jazz
  description: Für diese Geburtstagsparty hat Chefdirigent Bob Mintzer den Starsaxofonisten Chris Potter eingeladen, der sich "Tranes" Werk mit stilistischer Offenheit nähert und den Einfluss des Jahrhundertmusikers auf den modernen Jazz hörbar macht, natürlich inklusive vieler Coltrane-Meilensteine wie "Giant Steps" oder "Blue Train". Ein feierlicher Big Band-Abend live aus Köln für den Giganten des Jazz.
