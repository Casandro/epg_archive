    W przypowieści o dwóch synach Jezus odnosi się do religijnej pewności siebie: nie wolno zakładać, że moja sprawiedliwość jest nie do ruszenia, ani że grzesznicy na zawsze pozostaną poza Królestwem. Jezus wie, że nie jeden raz powiemy "nie chcę", ale pokazuje, że pod wpływem łaski możemy zmienić myślenie i sposób działania. O nawracaniu się każdego dnia o. Mateusz Stachowski porozmawia z Barbarą Karską - Woźniak, chrześcijańskim coachem.
