    Turystyczna sielanka zamienia się w dramat, gdy wiadomość o wybuchu wojny odcina bohaterów od domu. "Pod wulkanem" to kameralna historia o rodzinie, która w jednej chwili traci stabilność i musi odnaleźć się w nowej rzeczywistości. Pod Wulkanem - opis filmu Film opowiada o ukraińskiej rodzinie Kowalenków, która spędza wakacje na Teneryfie. Ostatniego dnia pobytu dowiadują się o rosyjskiej inwazji na Ukrainę, co uniemożliwia im powrót do kraju.
  ageRating: 12
  genre:
  - '23'
  subtitle: Ukraińska rodzina spędza wakacje na Teneryfie. Kiedy wybuch wojny uniemożliwia im powrót do kraju, zostają uwięzieni na wyspie, zmuszeni stawić czoła izolacji i niepewności dotyczącej własnej przyszłości.
