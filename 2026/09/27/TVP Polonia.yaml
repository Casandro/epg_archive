  subtitle: Maria Kirłowa postanawia wyswatać Justynę Teofilowi Różycowi. Panna Orzelska i syn Benedykta, Witold, coraz częściej odwiedzają zaścianek. Jan prowadzi Justynę na grób powstańców.
