    Występują: Teresa Lipowska, Krystian Wieczorek, Mikołaj Roznerski, Maurycy Popiel, Ilona Janyst, Adriana Kalska
    Magda nadal niepokoi się o Paulinę przekonana, że Jabłoński musiał żonę uwięzić. Tymczasem przyjaciółka nagle zjawia się u Budzyńskich, gotowa nie tylko na walkę z mężem, ale też na współpracę z prokuraturą i policją. Z kolei Mateusz jedzie z kolegami do Ostrowa na wesołą parapetówkę u Winiarów, a gdy znów spotyka dzięki temu Bognę, kończy się to ich pierwszym pocałunkiem. Tymczasem Ewelina z Michałem mają dla studentów radosną nowinę.
  ageRating: 12
  genre:
