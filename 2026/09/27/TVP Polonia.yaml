    Występują: Adam Zdrójkowski, Emma Pokromska, Helena Englert, Maciej Musiał, Mateusz Pawłowski, Olga Kalicka
    Kacper prezentuje rodzicom swoją twórczość artystyczną, jednak nie spotyka się ona z ich zrozumieniem. Tymczasem Majka zaprasza koleżankę na nocowankę. Natalia i Ludwik, próbując odnaleźć się w nowej domowej rzeczywistości i uniknąć kolejnych kłótni o porządek, decydują się na zatrudnienie pomocy domowej - sprzątaczki Adeli. Agata, dawna przyjaciółka Kuby z dzieciństwa, zostaje nową szefową Ludwika.
