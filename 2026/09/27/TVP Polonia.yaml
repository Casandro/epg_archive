  title: Komisarz Alex s.XXIV - odc. 296 (seria XXIV odc. 2) "Walizka"
  description: |-
    Tytuł oryginalny: Komisarz Alex
    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Marek Kaliszuk, Marcin Rogacewicz, Michał Surma, Olaf Lubaszenko, Olga Bołądź, Piotr Bondyra
    Przed komendą Alex wyczuwa nadchodzący atak cukrzycy u podenerwowanej kobiety. To Roma Jasińska. Przyjechała do Warszawy szukać zaginionej córki, Agaty. Kobieta trafia do szpitala, a nowa w wydziale policjantka - komisarz Monika - postanawia jej pomóc. Podobno Agata niedawno kogoś poznała, ale matka nic o tym mężczyźnie nie wie. Trop prowadzi do Niemiec. Tam zlokalizowano komórkę zaginionej. Przedzierając się przez cyfrowe dane, Gutek odtwarza ostatnie dni Agaty.
  ageRating: 12
  genre:
  - '18'
  subtitle: Roma Jasińska przyjeżdża do Warszawy, by odnaleźć zaginioną córkę, Agatę. Nowa funkcjonariuszka wydziału, komisarz Monika, postanawia zaangażować się w sprawę. Trop prowadzi do Niemiec.
