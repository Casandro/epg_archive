  title: Nad Niemnem - odc. 1/4
  description: |-
    Tytuł oryginalny: Nad Niemnem
    PL, 1986
    Reżyseria: Zbigniew Kuźmiński
    Występują: Iwona Katarzyna Pawlak, Janusz Zakrzeński, Marta Lipińska, Ewa Decówna, Bożena Rogalska, Michał Pawlicki
    Ekranizacja powieści Elizy Orzeszkowej. Autorka zawarła w niej zróżnicowany obraz nadniemeńskiej szlachty w obliczu nowych, popowstaniowych warunków politycznych i społeczno - ekonomicznych. Powieść, opisująca dzieje rodów Korczyńskich i Bohatyrowiczów, wzywała do wierności ziemi i przeszłości, gloryfikowała patriotyczną ofiarność i ideowe dziedzictwo minionych lat, głosiła niezachwianą wiarę w siłę i wartość człowieka. Korczyn, mała wioska nad Niemnem, lata 80. XIX wieku.
  ageRating: 12
  genre:
  - '23'
  subtitle: Teofil Różyc, dziedzic podupadłej fortuny, ubiega się o względy Justyny Orzelskiej, siostrzenicy pana na Korczynie. Benedykt ciężko pracuje, mimo to ma kłopoty finansowe.
- eventId: 1045723
