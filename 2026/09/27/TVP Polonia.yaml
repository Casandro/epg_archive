    Zygmunt Korczyński chciałby uczynić z Justyny swoją kochankę. Ona tymczasem zakochuje się, z wzajemnością, w Janku Bohatyrowiczu. Jej pierwsza wizyta w zaścianku staje się wielkim wydarzeniem - jedni okazują jej życzliwość, drudzy wylewają przed nią pretensje do dworu. Anzelm i Jan Bohatyrowiczowie prowadzą Justynę na grób legendarnych przodków rodu, Jana i Cecylii, a także mogiłę, w której leżą brat Benedykta Korczyńskiego i brat Anzelma Bohatyrowicza.
