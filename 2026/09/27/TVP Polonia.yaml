  subtitle: Kacper pokazuje rodzicom swoje dzieła. Agata zostaje szefową Ludwika. Boscy decydują się na zatrudnienie pomocy domowej. Zapraszają Marię z Markiem na zakrapianą kolację. Poznają nową dziewczynę Kuby.
- eventId: 1045669
