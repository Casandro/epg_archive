  title: Alternatywy 4 - odc. 3/9 - Pierwsza noc
  description: |-
    Tytuł oryginalny: Alternatywy 4
    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Zofia Czerwińska, Bożena Dykiel, Kazimierz Kaczor, Wojciech Pokora, Mieczysław Voit, Roman Wilhelmi
    Radni debatują nad nazwą ulicy. Kandydatury związane z nazwiskami zasłużonych osób nie znajdują uznania - ostatecznie ulica zostaje nazwana Alternatywy. Wprowadzają się kolejni lokatorzy. Nauczycielkę przeprowadza cała klasa, każdy z uczniów niesie jakiś mebel lub sprzęt. W domu nauczycielka zaprzyjaźnia się z docentem Furmanem, który opowiada jej o swoich wyczynach łowieckich. Podsłuchują ich tajniacy, którzy biorą Furmana za Dąb-Rozwadowskiego i uznają za terrorystę.
  ageRating: 12
  genre:
  - '20'
  subtitle: 1987 Nagroda Przewodniczącego Komitetu d/s Radia i Telewizji - Witold Pyrkosz za wieloletnią współpracę artystyczną z TVP, w tym za rolę w serialu.
