  subtitle: Fühlst du Gott nicht? Warum er trotzdem da ist und dich führt
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gott hat uns Menschen so erschaffen, dass wir fähig sind, eine Bandbreite von Gefühlen zu erleben. Diese haben eine wichtige Funktion und können uns sowohl beleben als auch auf unsere Bedürfnisse hinweisen. Schwierig wird es, wenn sie uns - und nicht wir sie - im Griff haben. In dieser Sendung erklärt Joyce Meyer, wie Sie sich in jeder Gefühlslage Gottes Führung anvertrauen und im Glauben wachsen können.'
