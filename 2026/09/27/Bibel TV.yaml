  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sorgen rauben Frieden, Kraft und Vertrauen. "Jesus lädt dazu ein, den Blick nicht auf Mangel, Angst oder mögliches Unheil zu richten, sondern auf Gottes Treue", erklärt Bobby Schuller. Wer Gottes Wort immer wieder hörst, dessen Glaube wächst und er lernt, seine Gedanken bewusst neu auszurichten. Gott ist der Versorger, Heiler und der, der unser Leben trägt. Wir sollen unsere Sorgen loslassen und durch Vertrauen auf Gott ersetzen.'
