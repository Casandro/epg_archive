  title: Jesenji muzički maraton 202
  subtitle: Da li još uvek maštate o toplom pesku i moru ili se radujete planinskoj jesenjoj idili? Spremite se za četiri sata najbolje muzike koja briše granice između godišnjih doba.
  description: Da li još uvek maštate o toplom pesku i moru ili se radujete planinskoj jesenjoj idili? Spremite se za četiri sata najbolje muzike koja briše granice između godišnjih doba. Pred nama su četiri sata pažljivo odabranih numera posvećenih večitoj dilemi - letnji ili jesenji odmor? Za sve vas koji odbijate da odložite letnje stvari i u mislima ste i dalje na nekoj sunčanoj obali, pripremili smo vrele ritmove koji produžavaju leto. Sa druge strane, za ljubitelje romantičnih jesenjih putovanja, stižu melodije koje savršeno prate miris prve kafe i planinskog vazduha. Spajamo nespojivo i muzikom putujemo direktno od egzotičnih plaža do ušuškanih planinskih brvnara.Pišite nam - da li ste tim "kasno letovanje na moru" ili više volite jesenji beg iz grada i uživanje u prirodi? Koja vas pesma u ovom periodu najviše inspiriše na pakovanje kofera?Vaše poruke očekujemo putem Vajbera ili SMS-a na broj 064-0-202-200.
