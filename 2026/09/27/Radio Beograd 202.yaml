  description: Pred vama je specijalno, četvoročasovno izdanje Raspevanog Kućnog saveta. Čućete najbolje dosadašnje učesnike Raspevanog kviza, ali i voditelje Dvestadvojke koji su se oprobali u ulozi slušalaca koji pogađaju zadate pesme.Na gitari će vas pratiti Janko Jekić i Mihailo Ristić. Prijavite se, pokloni su spremni! Naš broj je 011 3249 202.
