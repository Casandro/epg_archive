- eventId: 1069885
  start: 2026-09-27T01:05:00Z
  stop: 2026-09-27T04:55:00Z
  title: Tonart
  subtitle: Urban
  description: |-
    Urban
    Moderation: Carsten Rochow

    Die Tonart Urban bewegt sich diesmal zwischen experimenteller Elektronik, Jazz und ziemlich eigenwilligem Pop. Wir machen einen kleinen Streifzug durch die jüngsten Veröffentlichungen von International Anthem aus Chicago - einem Label, auf dem sich Jazz und elektronische Experimente auf besonders spannende Weise begegnen. Dazu gibt es einige Neuerscheinungen: The Homesick aus den Niederlanden haben ihre Indie-Rock-Vergangenheit inzwischen fast hinter sich gelassen und Gitarren weitgehend gegen Synthesizer, E-Orgeln und Drumcomputern eingetauscht. Button Masher macht schwindelerregenden elektronischen Jazz. Und wir hören in die neuen Alben von Bonobo und Sylvan Esso rein. Vier Stunden Musik mit Synthesizern - und allem, was sich daraus machen lässt.
    04:00-04:05 Nachrichten

    05:00-05:05 Nachrichten

    06:00-06:05 Nachrichten
