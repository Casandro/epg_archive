    Ein Fellknäuel namens Heimweh
    Von Hartmut El Kurdi
    Gelesen vom Autor
    Ab 6 Jahre
    Deutschlandradio Kultur 2011
    Moderation: Fabian Schmitz

    Es sind Sommerferien. Parzival Hübner ist aus dem Internat nach Hause gekommen. Doch schon am ersten Ferientag weckt ihn Baulärm vor seinem Kinderzimmer.
    Und Lilly findet Heimweh doof. Ihre Mama hat gesagt, das beste Mittel dagegen wäre, mit ihrem Heimweh zu reden. Aber was, wenn das Heimweh Lilly antwortet?
