  title: PODCAST Yvonne Petschow
  subtitle: PODCAST Yvonne Petschow
  description: 'Folge 5 zum Thema: Mein Werdegang: Yvonne persönlich. Diese Folge ist persönlich: Wer ist Yvonne Petschow, warum tut sie was sie tut und für wen? Sie erzählt von ihrem Weg als Mutter, Unternehmerin und Beraterin, von Mut, Familie und Erfahrungen, die sie geprägt haben. Denn viele Themen, zu denen sie heute als Expertin für finanzielle Bildung, Vorsorge und Sicherheit berät, kennt sie aus ihrem eigenen Leben. Genau das macht den Austausch mit ihr so authentisch.'
