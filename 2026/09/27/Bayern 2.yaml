  title: Bayern 2 Hörspiel
  subtitle: '"Ladies im Hotel" von Dorothy Parker'
  description: "Das berühmte \"Marlowe\" in New York hat seine besten Tage gesehen, so auch seine Dauergäste: vorwiegend alleinstehende Damen unbestimmbaren Alters: Witwen, Geschiedene oder Abgeschobene. Auf den Fluren des Hotels schwärmen sie von reizenden Männern, terrorisieren ihre Kinder, spionieren sich gegenseitig aus und pflegen ihre Lebenslügen. Dorothy Parker gilt als Virtuosin des Dialogs und der gesprochenen Rede. Frech, geistreich, kompromisslos und tragikomisch wie ihre Erzählungen, die sie berühmt gemacht haben, ist auch ihr 1953 uraufgeführtes Bühnenstück \"Ladies im Hotel\". Die amerikanische Schriftstellerin kannte sich aus im New York der 30er und 40er Jahre und seinen Frauen: in den schäbigen, tapferen, sehnsüchtigen Frauen der unteren Klassen wie in den leblosen und leeren aus der Welt der Reichen. \n\nVon Dorothy Parker\nAus dem Amerikanischen von Friederike Roth\nMit Helmut Stange, Renate Grosser, Mario Andersen, Barbara Nüsse, Christa Brendl, Krista Posch, Margrit Carls, Elisabeth Endriss, Ruth Hausmeister, Louise Martini, Angelika Thomas, Markus Boysen, Andreas Wimberger, Detlef Kügow und Wolfried Lier\nKomposition: Peter Zwetkoff \nRegie: Irene Schuck \nBR 1991\n \nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
