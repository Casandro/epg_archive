  title: Bayern 2 Weltempfänger
  subtitle: Happier than ever - Wenn Musik uns glücklich macht
  description: "Happier than ever - Wenn Musik uns glücklich macht\nmit Musik von Theodor Shitstorm, Nina Simone, Oehl und vielen anderen\n\nModeration: Tobias Ruhland \n\nMusik kann trösten, inspirieren, therapieren und im Optimalfall glücklich machen. Der Popjournalist Michael Behrendt hat genau darüber ein Buch geschrieben: \"Playlist zum Glück. 99 1/2 Songs für ein erfülltes Leben\". Wir reden mit dem Autor über Glücksdimensionen im Pop und hören Musik von Theodor Shitstorm, Nina Simone, Oehl und Bob Dylan.\n\nWiederholung um 23.03 Uhr"
