  title: MDR KLASSIK - Konzert
  description: "Konzert\n\nMDR-Musiksommer - Abschlusskonzert \n\nCarl Maria von Weber: Ouvertüre zur Oper \"Euryanthe\"\nCarl Maria von Weber: Jagdchor aus dem 3. Akt \"Die Tale dampfen\"\nEthel Smyth: Prolog aus der Oper \"Der Wald\"\nRobert Schumann: Vom Pagen und der Königstochter op. 140 - Vier Balladen von Emanuel Geibel für Solostimmen, Chor und Orchester.\nCarl Maria von Weber: Ouvertüre zu \"Der Freischütz\"\nCarl Maria von Weber: \"Der Freischütz\", daraus Jägerchor \"Was gleicht wohl auf Erden\"\nCarl Maria von Weber: Ouvertüre zu \"Turandot\" Bühnenmusik zum gleichnamigen Schauspiel von Friedrich Schiller op. 37 (J.\n\nKonzert\n\nMDR-Musiksommer - Abschlusskonzert \n\nCarl Maria von Weber: Ouvertüre zur Oper \"Euryanthe\"\nCarl Maria von Weber: Jagdchor aus dem 3. Akt \"Die Tale dampfen\"\nEthel Smyth: Prolog aus der Oper \"Der Wald\"\nRobert Schumann: Vom Pagen und der Königstochter op. 140 - Vier Balladen von Emanuel Geibel für Solostimmen, Chor und Orchester.\nCarl Maria von Weber: Ouvertüre zu \"Der Freischütz\"\nCarl Maria von Weber: \"Der Freischütz\", daraus Jägerchor \"Was gleicht wohl auf Erden\"\nCarl Maria von Weber: Ouvertüre zu \"Turandot\" Bühnenmusik zum gleichnamigen Schauspiel von Friedrich Schiller op. 37 (J. 75)\nPaul Hindemith: Sinfonische Metamorphosen über Themen von Carl Maria von Weber\n\nLeevke Hambach - Sopran\nSewon Kim - Sopran\nSusanne Veeh - Alt\nAlexandra Schmid - Alt\nYongkeun Kim - Tenor\nTobias Ay - Bass\nGun-Wook Lee - Bass\nManuel Helmeke - Bass\nJae-Hyong Kim - Bass\n\nMDR-Rundfunkchor\nMDR-Sinfonieorchester\nDennis Russel Davies, Dirigent\n\n(Aufnahme v. 05.09.26, Suhl, Congresscentrum)\n\n\nIm Juni 2026 gedenkt die Musikwelt Carl Maria von Webers 200. Todestag. Sein Werk ist untrennbar mit einer neuen musikalischen Ästhetik verbunden, in der die Natur und speziell der Wald eine zentrale Stellung einnimmt. Der Freischütz gilt dabei als Schlüsselwerk - mit dem Wald als Bühne des Unheimlichen und Übernatürlichen. Hier und in zahlreichen weiteren Werken des 19. Jahrhunderts entwickelt sich das Sujet des Waldes in eine Chiffre, die das Unsichtbare hörbar macht und das Hören selbst in einen Akt des Staunens verwandelt. Chefdirigent Dennis Russell Davies verbindet in diesem Programm Webers unsterbliche Musik mit Erweiterungen und Reflexionen auf sein Werk - und garantiert dabei überraschende Entdeckungen."
