  title: MDR KLASSIK - Orgelmagazin
  description: "Berichte aus der weltweit einmaligen Orgellandschaft Mitteldeutschlands, \nGespräche mit Menschen, die für die Orgel leben und Musik, die die schönsten \nOrgeln aus der Region erklingen lässt.\n\nErstmals seit 15 Jahren wieder dabei - die Orgel beim Internationalen Musikwettbewerb \nder ARD in München\n\nClaus Fischer im Gespräch mit Preisträgerinnen und Preisträgern\n(Aufnahmen aus dem Preisträgerkonzert vom 18.09.2026)\n\nBerichte aus der weltweit einmaligen Orgellandschaft Mitteldeutschlands, \nGespräche mit Menschen, die für die Orgel leben und Musik, die die schönsten \nOrgeln aus der Region erklingen lässt.\n\nErstmals seit 15 Jahren wieder dabei - die Orgel beim Internationalen Musikwettbewerb \nder ARD in München\n\nClaus Fischer im Gespräch mit Preisträgerinnen und Preisträgern\n(Aufnahmen aus dem Preisträgerkonzert vom 18.09.2026)"
