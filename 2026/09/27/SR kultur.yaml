- eventId: 548384
  start: 2026-09-27T18:03:00Z
  stop: 2026-09-27T21:00:00Z
  title: Musik aus der Region
  subtitle: La chanson à l'école
  description: "Marie Cheyenne, Gesang & Akustik-Gitarre \nSie besingt die Weiten des ursprünglichen Amerikas und präsentiert dabei einen einzigartigen Stil aus Textchanson, Folk, Swing und Instrumentalmusik. Mit ihren humanistischen und poetisch-rebellischen Chansons, zeitlosen Melodien und ihrer frechen Bühnenpräsenz begeistert die Künstlerin seit 2018 ihr Publikum \n\nSarah Maison, Gesang & E-Gitarre \nSie präsentiert sich als Pop-Diva à la Dalida. Ihr Musikstil ist eine Mischung aus französischem Chanson, ägyptischer Musik, Disco der 70er-Jahre, Brit- und Synthie-Pop. Nach ihrer Ausbildung an der École Nationale Supérieure d'Art de la Villa Arson in Nizza hat sie 2025 ihr erstes Album \"DIVAD\" veröffentlicht.  \n\nAufnahme vom 29. Januar 2026 aus der Aula der Universität des Saarlandes \n22:30 - 23:00 anschließend: Couleurs\nDie Sendung mit einem Schwerpunkt auf französischer Musik von Klassik über Pop bis Chanson, mit Interpreten und Komponisten aus Frankreich"
