  stop: 2026-09-27T16:01:00Z
  title: 'Hörspielzeit:  ARD Radio Tatort -  Einer von uns'
  subtitle: von Dirk Schmidt  (WDR 2026)
  description: |-
    Ein tödlicher Schusswechsel führt die Taskforce zu einem abgelegenen Tatort. Der Tote ist kein Unbekannter, sondern der legendäre Benno, Spürhund der Hammer Polizei. Doch wer hat auf ihn geschossen?
    Zunächst glaubt niemand an ein echtes Verbrechen. Doch als Bennos Kollege Kilian Daldrup verschwindet, sieht sich die Taskforce plötzlich in einer großangelegten Ermittlung. Korruption, Drogen, Sicherheitsdatendiebstahl -  immer tiefer graben sich Latotzke, Scholz und Co in den Fall. Wurde Daldrup entführt oder steckt mehr hinter der ganzen Sache?
