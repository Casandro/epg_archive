  title: Rozhlasová hra
  description: 'Tajemný hrad v Karpatech. Podivuhodné a vzrušující dobrodružství v polozříceném hradu v sedmihradských Karpatech. Na motivy Julesa Verna pro rozhlas napsal Zdeněk Kovář. Režie: Ivan Holeček. Natočeno v roce 1986. Účinkují: Vladimír Ráž, František Němec, Josef Kroupa, Rudolf Straka, Ladislav Čejka a další.'
