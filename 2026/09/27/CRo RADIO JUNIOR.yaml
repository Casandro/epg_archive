  title: Velká pohádka
  description: 'O té sani z Vojtěšské ulice. Nalezené vejce velikosti melounu způsobí poprask v Praze! Sedmihlavá saň je nepřijatelná jak pro ochránce zvířat, tak pro pana domácího jednoho pražského činžáku. Jak to dopadne? Na motivy pohádky Karla Čapka napsal František Pavlíček. Režie: Karel Weinlich. Účinkují: Michal Pešek, Jiří Samek, Vlastimil Brodský, Alois Švehlík a další.'
- eventId:
