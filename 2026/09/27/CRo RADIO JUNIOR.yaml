  title: Pohádkové poklady
  description: 'O černé princezně. Chudému rybáři a jeho ženě se narodí syn Radovid. Když vyroste, je unesen černým pánem do podzemního království, kde žije zakletá černá princezna. Podaří se Radovidovi díky odvaze a lásce tajemnou kletbu zlomit? Napsala: Božena Němcová. Natočeno v roce 1967. Režie: Josef Svátek. Vypráví: Bohumil Záhorský.'
- eventId:
  - 1227722
  - 1233592
  start: 2026-09-27T17:26:43Z
  stop: 2026-09-27T17:50:00Z
  title: Pohádkové poklady
  description: 'Látací jehla. Příběh jedné pyšné látací jehly, která chtěla být jehlou šicí. Byla tak jemná a tenká, že jednoho dne zlomila vejpůl, dál však bojovala za svůj cíl. Pohádka Hanse Christiana Andersena o tom, že pýcha předchází pád. Autor: Hans Christian Andersen. Natočeno v roce 1967. Režie: Josef Svátek. Vypráví: Ljuba Hermanová.'
- eventId:
  - 1227723
  - 1233593
  start: 2026-09-27T17:50:00Z
  stop: 2026-09-27T18:00:00Z
  title: Hajaja
  description: Pohádky z letní zahrádky 7/8 - Noční život. Máte rádi květiny? Kdo by neměl, viďte. K rozkvetlým kytkám si každý rád přivoní, ale kdo k nim občas přiloží ucho? Možná byste to měli zkusit. Květiny z letní zahrádky totiž umějí vyprávět pohádkové příběhy? Osm pohádek z letní zahrádky napsala Melita Denková. Natočeno v roce 1998. Režie Vladimír Gromov. Vypráví Daniela Kolářová.
