  - 1235513
  start: 2026-09-27T11:00:30Z
  stop: 2026-09-27T12:00:30Z
  title: Velká pohádka
  description: 'Johana a továrna na sny. Zdají se vám často sny? Pamatujete si nějaké? A už jste se někdy zamysleli nad tím, kdo vaše sny vyrábí? Pohádka o dívce, která stojí před rozhodnutím, zda zůstat v dokonalé krajině snů nebo se vrátit zpátky ke své rodině. Napsala: Hana Lehečková. Režie: Petr Vodička. Hrají: Alice Bransten, Marek Holý, Vanda Hybnerová, Simona Vrbická, Václav Kopta, Radovan Klučka a další.'
- eventId:
