  - 1233517
  start: 2026-09-27T12:00:30Z
  stop: 2026-09-27T13:00:00Z
  title: Rozhlasová hra
  description: 'Pouť za královnou Navajů. Kdysi se spolu zúčastnili bojového tažení proti jednomu indiánskému kmeni. Teď se tito dva muži setkali znovu. Co se bude dít? Na motivy románu Thomase Mayne-Reida připravila Věra Eliášová. Režie: Vladimír Gromov. Natočeno v roce 2012. Účinkují: Jaroslav Plesl, Petr Oliva, Pavel Rímský, Anna Suchánková, Pavla Dostálová a další.'
