  title: Jihočeské odpoledne
  description: Vrátíme se do Volyně na Dřevadny. Festival připomíná stará dřevozpracující řemesla i moderní průmysl, lesnictví a odborné školství a ukazuje, jak spolu mohou tradice s inovacemi fungovat v jednom regionu. Budeme mluvit o tom, proč česká krajina stále nedokáže dostatečně zadržovat vodu a co může pomoci proti suchu i povodním. A připomeneme si 85 let od příjezdu Reinharda Heydricha do Prahy a jeho působení v Protektorátu Čechy a Morava.
- eventId: 1227593
  start: 2026-09-27T12:07:00Z
  stop: 2026-09-27T12:40:00Z
  title: Čtení na neděli
  description: Na poslední zářijovou neděli jsme pro vás připravili výlet na podzimní Šumavu. O podruhé vykvetlých petrklíčích, krásně zbarveném bukovém lese, posledních běláscích, odlétajících ptácích, dešti, mlze i romantické lásce umí poeticky vyprávět churáňovský meteorolog a spisovatel Roman Szpuk. Rozhlasovou podobu dal jeho textu s názvem Podzim? v režii Jakuba Doubravy herec Ivan Řezáč. Natočeno v ČRo Plzeň v roce 2023.
- eventId: 1227594
