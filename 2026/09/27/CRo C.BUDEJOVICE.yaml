  start: 2026-09-27T12:07:00Z
  stop: 2026-09-27T12:40:00Z
  title: Čtení na neděli
  description: Na poslední zářijovou neděli jsme pro vás připravili výlet na podzimní Šumavu. O podruhé vykvetlých petrklíčích, krásně zbarveném bukovém lese, posledních běláscích, odlétajících ptácích, dešti, mlze i romantické lásce umí poeticky vyprávět churáňovský meteorolog a spisovatel Roman Szpuk. Rozhlasovou podobu dal jeho textu s názvem Podzim? v režii Jakuba Doubravy herec Ivan Řezáč. Natočeno v ČRo Plzeň v roce 2023.
