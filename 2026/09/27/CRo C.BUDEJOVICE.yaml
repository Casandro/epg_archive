  title: Jihočeské odpoledne
  description: Vrátíme se do Volyně na Dřevadny. Festival připomíná stará dřevozpracující řemesla i moderní průmysl, lesnictví a odborné školství a ukazuje, jak spolu mohou tradice s inovacemi fungovat v jednom regionu. Budeme mluvit o tom, proč česká krajina stále nedokáže dostatečně zadržovat vodu a co může pomoci proti suchu i povodním. A připomeneme si 85 let od příjezdu Reinharda Heydricha do Prahy a jeho působení v Protektorátu Čechy a Morava.
- eventId:
