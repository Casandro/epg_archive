  title: Edgar, das Super-Karibu
  subtitle: Ein Lied für Gina
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Henry, der Röhrer, der berühmte Sänger, wird von Gina, der Kameldame verarztet. Nun beschließt Henry, der Kameldame einen Song zu schreiben, um sich bei ihr zu bedanken. Super-Edgar ist eifersüchtig und beschließt, auch einen zu schreiben! Und der wird ganz bestimmt besser als der des professionellen Sängers, der schon seit vielen Jahren komponiert! Oder doch nicht?
- eventId: 551759
  start: 2026-09-27T04:55:00Z
  stop: 2026-09-27T05:10:00Z
  title: Edgar, das Super-Karibu
  subtitle: Das Joghurtofon
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Super-Edgar hat Albert, dem Eisbären, versprochen mit ihm zum Angeln zu gehen. Aber er hat auch Bürgermeister Magnus versprochen, ihm das Drachensteigen lassen beizubringen. Und Super-Edgar bringt nicht den Mut auf, einem der beiden eine direkte Absage zu erteilen und ihn damit zu kränken. Frank, der Ameisenbär hat die Lösung: Super-Edgar braucht nur seine neue Erfindung zu nutzen: das Joghurtofon. Damit kann Super-Edgar die Wahrheit von Weitem eingestehen. Von sehr weit sogar.'
- eventId: 551760
  start: 2026-09-27T05:10:00Z
  stop: 2026-09-27T06:00:00Z
  title: Hofgeschichten - Ackern zwischen Alpen und Ostsee (37/37)
  subtitle: Endlich Mais-Ernte!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Auf Hof Bremehr in Ostwestfalen steht einer der Höhepunkte des Jahres an: die große Maisernte. Der Mais dient im Winter als Futter für die Tiere auf dem Hof. Ludger Bremehr koordiniert das Team und alles läuft gut, doch plötzlich stehen alle Maschinen still: Der Maishäcksler steckt im matschigen Boden fest. Kann er mit dem Traktor herausgezogen werden? Die Zeit drängt, denn es ist Regen angekündigt.'
