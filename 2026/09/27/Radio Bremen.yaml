  title: DAS! Rote Sofa
  subtitle: Matthias Reim, Musiker mit neuem Album + Tour
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Zusammen mit Matthias Reim blicken wir auf eine außergewöhnliche Karriere zurück. Mit Hinnerk Baumgarten spricht er aber auch über aktuelle Projekte, seine vielköpfige Familie, seine Begeisterung für Motorräder und seine Liebe zum Bodensee. Der mittlerweile 68-Jährige schrieb 1990 mit "Verdammt, ich lieb' Dich" Musikgeschichte. Der Song wurde zu einem der größten deutschsprachigen Hits aller Zeiten. Persönliche Krisen und gesundheitliche Rückschläge konnten seinen Weg nicht dauerhaft bremsen. Auf dem Roten Sofa gibt er zudem Einblicke in die Entstehung seines neuen Albums und seine kreativen Pläne für die kommenden Monate.
- eventId: 551757
  start: 2026-09-27T04:00:00Z
  stop: 2026-09-27T04:45:00Z
  title: Nordtour
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Landschaften und Sehnsuchtsorte, originelle Typen, Lifestyle, Kultur und kulinarische Köstlichkeiten: Mit der Nordtour entdecken Sie die schönen Seiten von Norddeutschland. Und das in ihrer ganzen Vielfalt in Niedersachsen, Schleswig-Holstein, Hamburg und Mecklenburg-Vorpommern. Das wöchentliche Magazin bietet einen unterhaltsamen Mix aus Service und Inspiration für die abwechslungsreiche Freizeitgestaltung. Nadja Babalola und Thilo Tautz moderieren die Sendung im wöchentlichen Wechsel.'
- eventId: 551758
