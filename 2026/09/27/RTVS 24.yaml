  description: Vymkli sa nám sociálne siete s pod kontroly? Deti a mládež sú na nich závislé, strácajú pozornosť a v krajných prípadoch tam sledujú násilie, sexuálny obsah a témy, ktoré ich radikalizujú. Dokážu štáty nevhodný obsah účinne kontrolovať? Na Slovensku smerujeme na budúci rok k obmedzovaniu sociálnych sietí pre deti a mládež do 16 rokov. Aké s tým majú skúsenosti v iných krajinách a je na to jednotný názor medzi rodičmi? (2026)
