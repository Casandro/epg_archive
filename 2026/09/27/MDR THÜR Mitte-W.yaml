- eventId: 624977
  start: 2026-09-27T16:00:00Z
  stop: 2026-09-27T18:00:00Z
  title: Kultur am Sonntag
  subtitle: mit Nadine Witt
  description: |-
    Zwei Stunden Kultur kompakt sendet MDR THÜRINGEN am Sonntagabend. Was waren die wichtigsten Kulturereignisse der Woche, welche Premieren gab es, wo haben neue Ausstellungen geöffnet? Dazu gibt es Buch- und Hörbuchtipps, meist auch mit Verlosungen. Und wir blicken voraus auf Konzerte, Lesungen, Aufführungen und andere Kulturveranstaltungen, deren Besuch sich lohnt.

