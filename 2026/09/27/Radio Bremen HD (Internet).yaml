  title: Rund um den Michel
  subtitle: Hamburgs goldene Seite
  description: "Wenn die Sonne tiefer steht, die Luft noch warm ist und Hamburg in goldenes Licht getaucht wird, zeigt die Stadt ihre vielleicht schönste Seite. In der neuen Ausgabe von \"Rund um den Michel\" begibt sich Moderatorin Dina Hille auf eine spätsommerliche Entdeckungsreise zwischen Elbe, Alster und Heide.\n Jäger der Nacht: Fledermaussuche auf Hamburgs Kanälen \nKapitänshaus mit Aussicht: Sonnenuntergang inklusive \nStreetfishing in der Hafencity Streetfishing\nEnde der Open-Air-Saison: letztes Konzert im Stadtpark \nSommerendspurt in der Neustadt \nZum Lachen aufs Dach: Rooftop Comedy \nMobile Apfelmosterei \nVoller Einsatz von Dünen bis Heide"
- eventId: 1284024
  start: 2026-09-27T16:45:00Z
  stop: 2026-09-27T17:30:00Z
  title: DAS! Rote Sofa
  subtitle: Michaela Benthaus, Astronautin, Luft- und Raumfahrtingenieurin
  description: Als erster Mensch mit Querschnittslähmung flog Michaela Benthaus im Dezember 2025 auf einem Parabelflug ins All und erlebte den Zustand der Schwerelosigkeit. Auf dem Roten Sofa erzählt die Astronautin von ihrem außergewöhnlichen Lebensweg zwischen Wissenschaft, Technik und persönlicher Stärke. In ihrem demnächst erscheinenden Buch "Zwischen Schwerkraft und Schwerelosigkeit" berichtet sie auch über ihr Leben mit einer Querschnittslähmung, die ihren Weg nachhaltig geprägt hat.
