  title: 'Die Nordreportage: Planten un Blomen'
  subtitle: Oase in der Großstadt
  description: In Hamburgs "Central Park" zwitschern Vögel, summen Bienen, Eichhörnchen toben durchs Geäst. Weiße Holzstühle laden zum Ausruhen ein, durchatmen, loslassen. Stille Ecken in japanischen Gärten unter blühenden Bäumen, Spielplätze für Kinder zum Toben, Cafés, Eisbuden, ein Musikpavillon für Tango, Jazz und Klassik. Planten un Blomen ist die 45 Hektar große, "grüne Lunge" in Hamburgs City, die ihren Ursprung im Alten Botanischen Garten hat. Dieser wurde genau vor 200 Jahren am historischen Stadtgraben, dem sogenannten Wallgraben, gegründet. Heute ist hier eine Oase im Herzen der Millionenstadt.
  genre:
  - '112'
- eventId: 1274440
  start: 2026-09-27T10:10:00Z
  stop: 2026-09-27T10:55:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Kappadokien - Im Herzen der Türkei
  description: Eine Tuffsteinlandschaft voll skurriler Felsen, Sonnenaufgänge, bei denen sich täglich 160 Heißluftballons am Himmel drängeln, dazu uralte Höhlenkirchen und kulinarische Extravaganzen - die türkische Region Kappadokien ist märchenhaft. Die Dokumentation begleitet einen wagemutigen Ballonpiloten, eine junge Familie, die in einer Felsenpyramide lebt, und einen Töpfermeister, der Testi-Kebab-Gefäße herstellt, in denen die Leibspeise der Gegend gekocht wird. Außerdem startet die Kürbisernte und eine Witwe weigert sich hartnäckig, ihr altes Haus an Hotelketten zu verkaufen.
- eventId: 1274877
  start: 2026-09-27T10:55:00Z
  stop: 2026-09-27T12:25:00Z
  title: Die Diebin und der General
  subtitle: Fernsehfilm Deutschland 2005
  description: Wegen Ladendiebstahls und Sachbeschädigung wird Jessie Fischer, eine allein erziehende Mutter mit einer ziemlich großen Klappe, zu gemeinnütziger Arbeit in einem Altenpflegeheim verurteilt. Dort lernt sie Walter Voss, genannt "der General", kennen. Das Schicksal des griesgrämigen Pensionärs, der von seinen erwachsenen Kindern entmündigt und ins Heim abgeschoben wurde, berührt sie, und sie beschließt, für ihn zu kämpfen. Doch als die teure Taschenuhr des Generals verschwindet, wird die bereits wegen Diebstahls verurteilte Jessie verdächtigt.
  genre:
  - '16'
- eventId: 1275317
  start: 2026-09-27T12:25:00Z
  stop: 2026-09-27T12:50:00Z
  title: Polizeifunk ruft
  subtitle: Die Konservendose
  description: Das Gangsterpärchen Karin und Herbert Schweiger stiehlt den Wagen eines dänischen Ehepaars. Das Auto war nicht abgeschlossen. Damit die beiden nicht auffallen, geben sie sich als Dänen aus. Karin und Herbert wollen sich zwischen Blankenese und Söldau mit dem Hehler Benno Clement, bei der Polizei als "Brillen-Benno" bekannt, treffen und ihm das Auto verkaufen. Doch dazu kommt es nicht. In dem Wäldchen wird auf Herbert Schweiger geschossen. Damit fliegt der Schwindel auf, zumal Schweiger, der sich als Däne ausgab, in der Narkose fließend Deutsch sprach. Die Kriminalpolizei übernimmt den Fall. Die erste Spur führt zu "Brillen-Benno".
  genre:
  - '16'
- eventId: 1276460
  start: 2026-09-27T12:50:00Z
  stop: 2026-09-27T13:15:00Z
  title: Polizeifunk ruft
  subtitle: Auf glühenden Kohlen
  description: 'Auf den Juwelier Willing wird frühmorgens, als nur der Verkäufer Richard und die Verkäuferin Pohland anwesend sind, ein Raubüberfall verübt. Die Täter entkommen, nachdem sie Herrn Richard niedergeschlagen haben, mit 30.000 Mark Bargeld und Schmuck im Wert von rund 70.000 Mark. Kommissar Castorp und sein Team nehmen sich des Falles an. Walter Hartmann hat allerdings andere Sorgen: Seine Frau Inge liegt mit Wehen im Krankenhaus, und er wartet sehnsüchtig auf die Geburt seines Kindes! Gerade als er von einer Kneipe aus im Krankenhaus anruft, macht er zufällig eine seltsame Beobachtung, die zur Klärung des Falles führt.'
  genre:
  - '16'
- eventId: 1277102
  start: 2026-09-27T13:15:00Z
  stop: 2026-09-27T14:00:00Z
  title: Expeditionen ins Tierreich
  subtitle: Faszination Mallorca - Die geheimnisvolle Tierwelt der Insel
  description: 'Jenseits seiner beliebten Strände verbirgt sich Mallorcas ungezähmte Seite. Im Norden thront das schroffe Tramuntana-Gebirge, die Heimat der majestätischen Mönchsgeier, die über den nebelverhangenen Bergen kreisen. Auch unter Wasser zeigt sich die Insel überraschend wild: Im marinen Schutzgebiet der Insel Sa Dragonera tummeln sich heute wieder Schwärme von Barrakudas und imposante Zackenbarsche. Die Seegraswiesen sind dank Biologin Deborah Morrison wieder Heimat bedrohter Seepferdchen. "Faszination Mallorca" zeigt die unbekannte Seite eines scheinbar vertrauten Ferienparadieses.'
- eventId: 1277874
  start: 2026-09-27T14:00:00Z
  stop: 2026-09-27T14:30:00Z
  title: Björn Freitag kocht grenzenlos köstlich
  subtitle: Alkmaar und Egmond aan Zee in Nord-Holland
  description: |-
    In seinem kulinarischen Reisemagazin "grenzenlos köstlich" kitzelt Spitzenkoch Björn Freitag in lukullischer Hinsicht die aufregendsten Gerichte aus einer Stadt oder Region heraus und sorgt so für viele spannende Entdeckungen. Diesmal macht er sich auf in den Norden der Niederlande, in die Provinz Nord-Holland. Im beschaulichen Städtchen Alkmaar will er den Niederländern in die Töpfe gucken.

    Wie wird eine richtig gute holländische Käsesuppe zubereitet? Eine kreative Köchin lüftet für Björn Freitag das Geheimnis. Die Zutaten gibt's stilecht auf dem traditionellen Käsemarkt.
  genre:
  - '144'
- eventId: 1281794
  start: 2026-09-27T14:30:00Z
  stop: 2026-09-27T15:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: Diesmal dreht sich alles um grünes Gemüse. Viele grüne Lebensmittel gelten als besonders gesund, zudem enthalten sie Chlorophyll. Wie so viele andere sekundäre Pflanzenstoffe leistet auch Chlorophyll einen wichtigen Bestandteil für eine gesunde Ernährung. Grüne Gemüse rangieren in der Beliebtheitsskala bei den Menschen in Deutschland aber eher auf den unteren Rängen. NDR Fernsehkoch Tarik Rose und Ernährungs-Doc Matthias Riedl stellen einige der gesündesten Produkte unter den grünen Gemüsen vor und zeigen, wie man daraus leckere Rezepte zubereiten kann.
