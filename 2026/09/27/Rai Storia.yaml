  title: Passato e Presente Cola di Rienzo l'ulti
  subtitle: Passato e Presente Cola di Rienzo l'ultimo tribuno - La figura di Cola di Rienzo campeggia sulla Roma della metà del XIV secolo. La città eterna che nel 1300 aveva visto il primo giubileo della Storia, ora
  description: "abbandonata dal pontefice trasferitosi ad Avignone e dall'imperatore che da tempo risiede in terra germanica, è una città cupa, dilaniata dalla guerra tra le fazioni rivali, dalla recessione economica, dalla miseria. Cola di Rienzo intende restituirla all'ordine e alla grandezza perduti. Il mito del tribuno del popolo e del suo progetto visionario, tra alterne fortune, ha attraversato i secoli lasciando ancor oggi irrisolto l'enigma che l'avvolge: Nicola di Lorenzo, questo il suo vero nome, è stato un abile politico o un megalomane? Un sincero capopopolo o un abile affabulatore? Un alfiere della libertà o uno stratega senza scrupoli? In studio, con Paolo Mieli, lo storico Tommaso di Carpegna. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli \nCon la consulenza di Cristoforo Gorno  \nOspite in studio il prof. Tommaso Di Carpegna \nCon la partecipazione di Michela Ventriglia \nRegia Davide Frasnelli \nProduttore Esecutivo Valentina Tassini"
- eventId: 1216237
  start: 2026-09-27T04:40:00Z
  stop: 2026-09-27T05:35:00Z
  title: Gulag Pt.3 1945-57
  subtitle: 'La prima grande produzione su uno degli episodi più tragici e meno rappresentati del secolo scorso: i campi di lavoro sovietici, meglio conosciuti come gulag. Basato su documenti mai resi noti in precedenza, su molte fonti e tes'
  description: "timonianze, con l'ausilio di oltre 1000 immagini fotografiche (molte delle quali inedite), la serie racconta la realtà del sistema dei campi di concentramento punitivi del regime. - \n\nDi Patrick Rotman, Nicolas Werth e François Aymé"
