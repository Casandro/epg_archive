  subtitle: Passato e Presente Cola di Rienzo l'ultimo tribuno - La figura di Cola di Rienzo campeggia sulla Roma della metà del XIV secolo. La città eterna che nel 1300 aveva visto il primo giubileo della Storia, ora
  description: |-
    abbandonata dal pontefice trasferitosi ad Avignone e dall'imperatore che da tempo risiede in terra germanica, è una città cupa, dilaniata dalla guerra tra le fazioni rivali, dalla recessione economica, dalla miseria. Cola di Rienzo intende restituirla all'ordine e alla grandezza perduti. Il mito del tribuno del popolo e del suo progetto visionario, tra alterne fortune, ha attraversato i secoli lasciando ancor oggi irrisolto l'enigma che l'avvolge: Nicola di Lorenzo, questo il suo vero nome, è stato un abile politico o un megalomane? Un sincero capopopolo o un abile affabulatore? Un alfiere della libertà o uno stratega senza scrupoli? In studio, con Paolo Mieli, lo storico Tommaso di Carpegna. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno

