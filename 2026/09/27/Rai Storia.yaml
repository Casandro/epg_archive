  description: "oro iniziative, spesso notevolmente innovative. Che magnifica impresa racconta le vicende delle imprenditrici italiane, dalla pioniera Luisa Spagnoli alle top manager degli anni 80 agli scenari più attuali che mettono insieme tradizione ed innovazione. Ad accompagnare Mario Sechi nel racconto di questa vera e propria epopea dell'imprenditoria femminile, l'imprenditrice Emma Marcegaglia, la Vice Direttrice Generale della Banca d'Italia Alessandra Perrazzelli e la storica Adriana Castagnoli. - Conduce Mario Sechi\nDi Mario Sechi, Enrico Salvatori Clemente Volpini e di Roberto Fagiolo, Fabrizio Marini e Gian Maria Tavanti Coordinamento editoriale Anna Lisa Guglielmi\nRegia Claudio Del Signore  \nCon Mario Sechi\nA cura di Lucia De Angelis, \nProduttore esecutivo Germana Mudanò, \nRegia Claudio Del Signore"
