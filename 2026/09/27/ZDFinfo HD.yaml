  description: |-
    Großbritannien 2024
    Uns Menschen ist die Welt vertraut, die wir sehen können, vom riesigen Gebirge bis zum winzigen Staubkorn. Doch jenseits dieser Skala geht es noch sehr viel weiter - im Großen wie im Kleinen.

    Lange hielten wir Atome für die kleinste Einheit der Dinge, doch dann fand die Forschung noch viel kleinere Teilchen. Viele Forschende gehen mittlerweile davon aus, dass das unendlich Kleine ebenso existiert wie das unendlich Große.
