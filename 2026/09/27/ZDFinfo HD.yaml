  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2024
    Der Urknall gilt lange als Beginn von Raum, Materie und Zeit aus dem absoluten Nichts. Neuere Forschungen stellen diese Theorie nun infrage: Was war vor dem sogenannten Big Bang?

    Entstand die Zeitrechnung mit dem Urknall? Oder hat die Zeit bereits davor existiert? Forschende kommen beim Versuch, den Beginn des Universums zu erklären, an die Grenzen der uns bekannten Physik und in die Welt der Quantentheorie.
