  audiodesc: true
  description: |-
    Großbritannien 2025
    Jenseits der Planeten verbergen sich Welten, eingehüllt in Dunkelheit. Außerhalb der Reichweite selbst der stärksten Teleskope liegen kaum erforschte, geheimnisvolle dunkle Orte.

    Unser Sonnensystem besteht nicht nur aus Himmelskörpern in der Nähe der Sonne. Es ist vielmehr ein riesiges Gebilde, das sich weit ins All erstreckt. Und es umschließt Welten, die wir uns nicht einmal vorstellen können.
    HD-Produktion
- eventId: 838947
  start: 2026-09-27T02:15:00Z
