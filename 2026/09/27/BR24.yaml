  description: "Was begann 2001, das wir bis heute spüren? \"Pearl Harburg - Deutschland nach 9/11\" taucht in die Geschichte - und schlägt den Bogen bis ins Heute. Die Erinnerungen an die Anschläge vom 11. September führen uns nach Hamburg, woher drei der Todespiloten kamen. Die Jagd auf Al-Kaida bedeutet auch Druck auf die Sicherheitsbehörden hier. Mit den Attentaten 2001 beginnt die Fokussierung auf islamistische Netzwerke. Hamburg wird Vorreiter bei der umstrittenen Rasterfahndung. Menschen mit Einwanderungsgeschichte, gerade aus Afghanistan und arabischen Ländern, wähnen sich damals und seitdem unter Generalverdacht. \n\nWiederholung um 17.05 Uhr\n\nAls Podcast verfügbar in ARD Sounds"
