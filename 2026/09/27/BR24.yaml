  title: Podcast "Mission Artenvielfalt"
  subtitle: Folge 1 - Die trickreiche Quagga-Muschel
  description: "Zwei Drittel aller Ökosysteme haben sich in den letzten 50 Jahren verschlechtert. Die Welt wird heißer, Wasser wird knapp - und damit auch die Lebensräume von Tieren und Pflanzen. In \"Mission Artenvielfalt\" begleiten wir Menschen, die es anders machen wollen. Unsere Helden der Artenvielfalt erzählen von den Versuchen, bedrohte Arten zu retten, von den Bemühungen, die Biodiversität zu erhalten, vom Sinn, den auch ungeliebte Tiere für die Natur haben, und vom Versuch, invasive Arten einzudämmen.\n\nAls Podcast verfügbar in ARD Sounds\n\n\"Mission Artenvielfalt\" - Folge 1 - Die trickreiche Quagga-Muschel\nQuagga-Muscheln kommen ursprünglich aus der Region ums Schwarze Meer und sind wahrscheinlich über Frachtschiffe zu uns gelangt. Jetzt breiten sie sich in Bayerns Seen ziemlich schnell aus und machen Probleme. \nAutorin: Helene Köck\nRedaktion: Jeanne Turczynski und Simon Plentinger"
