  description: "Unsere Radioreporter im weltweiten ARD-Netz und in Deutschland erklären, was warum passiert. Weil sie sich auskennen. Weil sie die richtigen Fragen stellen, mit dem Reportermikrofon in der Hand. Weil sie die Krisenherde dieser Welt schon lange gut kennen, bevor die anderen erst einfliegen. Unsere Reporter/innen lassen uns die Revolutionen der Welt besser verstehen, weil sie wissen, was im Volk schon lange gärt. Sie wissen, wohin sie gehen, wen sie fragen, wem sie zuhören müssen. Sie beobachten, analysieren und nehmen uns mit, wenn Nachrichten gerade erst entstehen. \nAls Podcast verfügbar in ARD Sounds"
