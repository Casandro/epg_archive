  title: Radar
  subtitle: S22 E22. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: Er duiken veel verhalen op van wooncomplexen waar liften langdurig uitvallen. Van de 6000 ondervraagde panelleden die in een gebouw met lift wonen gebeurt dat bij maar liefst 75%. Daarnaast krijgen bewoners vaak nul op rekest wanneer ze klagen bij de verhuurder en duurt het lang voordat de lift gemaakt wordt. Welke rechten heb je als bewoner? En wat moet er gebeuren om verhuurders aan te sporen de problemen eerder op te lossen? Fons confronteert de mensen achter de webshop jouwklimaatkast.nl. De winkel belooft "splinternieuwe retourproducten" te verkopen, maar de producten zijn vaak stuk bij levering. En je geld terugkrijgen lijkt onmogelijk. (2026)
