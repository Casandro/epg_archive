  title: Pointer Checkt
  subtitle: Blijf je met collageen jong en fit? S14 E03. Een onderzoeksjournalistiek programma dat mis- en desinformatie checkt die op sociale media wordt verspreid.
  description: 'Elke drogisterij en supermarkt heeft ze tegenwoordig in de schappen staan: dure poeders, pillen of crèmes met collageen. Voor mensen die op zoek zijn naar een rimpelloze huid of soepele gewrichten. Maar doen die producten wat ze beloven? We proberen een maand lang collageenpoeder uit en analyseren de resultaten met een dermatoloog. Die waarschuwt ook voor risico''s: collageenpoeders zijn bijna altijd afkomstig van dierlijke bronnen, zoals kraakbeen, huid en botten van koeien of visschubben, en kunnen dus zware metalen bevatten. We checken verder wetenschappelijke onderzoeken en kijken naar alternatieven voor deze collageenproducten. (2026)'
