  title: Expeditie Nederland
  subtitle: Vuilnisbelten in de regio S05 E23. Veel plekken in Nederland die vroeger werden gebruikt als afvalstortplaats zijn inmiddels geen vuilnisbelt meer. Een groot deel van deze locaties heeft tegenwoordig een andere bestemming.
  description: Veel plekken in Nederland die vroeger werden gebruikt als afvalstortplaats zijn inmiddels geen vuilnisbelt meer. Een groot deel van deze locaties heeft tegenwoordig een andere, soms verrassende bestemming. Net boven Amsterdam ligt de Volgermeerpolder, ooit een van de grootste vuilnisbelten van Nederland. De familie van Arie maakte van dichtbij mee hoe de vuilnisbelt groeide en hoe de zorgen toenamen toen er chemisch afval werd ontdekt. Anton uit Leeuwarden kijkt heel anders naar afval. Waar anderen rommel zien, ziet hij grondstoffen en handel. En inmiddels delen zijn dochters die passie. De één net iets meer dan de ander. (2026)
