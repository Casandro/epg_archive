  description: 'Desray is de hoofdgast. Als frontvrouw van 2 Brothers on the 4th Floor liet ze in de jaren 90 een hele generatie dansen. Zoë Livay vertaalt de wereldhit Never Alone naar Nooit Meer Alleen. Yves Berendse maakt van My House de regelrechte kroegknaller Kom Vanavond Naar Mij Toe, terwijl Fay Claassen zorgt voor een grootse en meeslepende uitvoering van Desrays solonummer You Can Be Loved. Zowel bekende hits van 2 Brothers on the 4th Floor als haar solowerk komen voorbij. Acteurs: Yves Berendse (Self), Fay Claassen (Self), Zoë Livay (Self), Jeangu Macrooy (Self), Désirée Manders (Self) (2026)'
