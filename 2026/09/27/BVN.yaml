  title: Rutger en de buitenlanders
  subtitle: Jong en op drift E01. Rutger ontmoet drie jonge Syrische vluchtelingen. Hun vlucht eindigde in Nederland, maar de strijd om een toekomst blijkt minstens zo zwaar als de reis die ze aflegden.
  description: Rutger ontmoet drie jonge Syrische vluchtelingen die ieder op hun eigen manier proberen een bestaan op te bouwen in Nederland. Majid staat onder intensieve begeleiding nadat zijn leven volledig ontspoorde. Badr kwam als tiener alleen naar Nederland om zijn familie in veiligheid te brengen, maar belandde na het wegvallen van hulp op straat. Achmed wacht zonder verblijfsvergunning op een laatste kans om in Nederland te mogen blijven en probeert zijn uitzichtloze situatie vol te houden. Hun verhalen laten zien hoe dun de scheidslijn is tussen hoop en wanhoop. (2026)
