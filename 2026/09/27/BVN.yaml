  title: Metropolis
  subtitle: 'Het perfecte cadeau S14 E16. Van een berg bier tot een gezongen telegram en een nagemaakte overleden hond: wereldwijd geven mensen elkaar de meest bijzondere cadeaus. Wat geven we elkaar cadeau over de grens?'
  description: 'Een boek, een paar sokken of een cadeaubon: zo laten we in Nederland zien hoeveel iemand voor ons betekent. Maar wat geven mensen elkaar cadeau in de rest van de wereld? Van een berg bier tot een gezongen telegram en een nagemaakte overleden hond: overal zijn er bijzondere manieren om iemand te verrassen. In Vietnam wordt op een verlovingsfeest de familie het hof gemaakt met een berg bier, in de Verenigde Staten krijgt iemand een gezongen telegram en in Argentinië laat iemand een overleden hond namaken. (2026)'
