  title: 'NPO Doc: De man met de glimlach'
  subtitle: Vijftig jaar na het overlijden van zijn vader stuit regisseur Paul Cohen bij toeval op een dagboek van de reis die zijn Joodse vader door het naoorlogse Europa maakte.
  description: 'Vijftig jaar na het overlijden van zijn vader stuit regisseur Paul Cohen bij toeval op een dagboek van de reis die zijn Joodse vader door het naoorlogse Europa maakte. Aan de hand van het reisverslag, zijn vaders dagboekaantekeningen uit het Jappenkamp waaruit hij net was teruggekeerd en niet eerder vertoond archiefmateriaal schetst Cohen een beeld van het Europa na de Tweede Wereldoorlog, gezien door de ogen van zijn vader. Een poëtische documentaire over schuld, schaamte, vergeving en compassie, met universele betekenis. Regisseur: Paul Cohen (2023)'
