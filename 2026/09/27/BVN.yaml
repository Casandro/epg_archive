  title: Het klokhuis
  subtitle: Plasticvervuiling S40 E5020. Plastic is overal om je heen. Het materiaal is ontzettend handig. Alleen we moeten er voorzichtig mee zijn, want als het in het milieu terechtkomt dan blijft het daar heel lang rondgaan.
  description: Plastic is overal om je heen. Het materiaal is ontzettend handig. Alleen we moeten er voorzichtig mee zijn, want als het in het milieu terechtkomt dan blijft het daar heel lang rondgaan. Dan is het zwerfplastic. Maar hoeveel zwerfplastic is er precies? Waar komt het vandaan? Dat weten we niet. Daarom wordt op zo'n 1000 verschillende plekken in Nederland gekeken hoeveel zwerfplastic er is. Bart telt een dagje mee. Ard en Fjodor openen een visrestaurant zodat ook vissen gezond kunnen eten. (2026)
