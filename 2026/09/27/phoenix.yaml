  title: Das Wunder der Wiederkehr
  widescreen: true
  hd: true
  description: |-
    Was bestimmt die inneren Kräfte der Erde? Was verbindet Mensch, Tier und Natur miteinander? Wie funktionieren die natürlichen Netzwerke und Kreisläufe, die im stetigen Wandel sind? Das sind die Fragen, denen der Film nachgeht.
    Die jährliche Reise der Buckelwale um die halbe Erde und die Wanderungen der Zebras im südlichen Afrika sind nur zwei Beispiele des stetigen Weggangs und der Wiederkehr.
