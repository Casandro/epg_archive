  title: Nürnberg 45
  subtitle: Im Angesicht des Bösens
  widescreen: true
  hd: true
  description: "Als Ernst Michel (22) zum ersten Mal die Pressetribüne im Saal 600 des Nürnberger Justizpalastes betritt, hält er die Nähe zu den Angeklagten kaum aus. Keine zehn Meter sitzt er, der Auschwitz-Überlebende, von Hermann Göring und den anderen entfernt. \n\nAls die polnische Zeugin Seweryna Smaglewska (29) zum ersten Mal das Nürnberger Grand-Hotel betritt, in dem sie für die Dauer ihres Aufenthalts untergebracht ist, kann sie nicht begreifen, wieso die Richter und Staatsanwälte des Nürnberger Prozesses in der Nacht zuvor einen rauschenden Ball gefeiert haben."
