  subtitle: Verfassungsfeinde im Namen Gottes
  description: "Sie stellen die Bibel über das Grundgesetz: Christlich-fundamentalistische Gruppen kämpfen gegen demokratische Institutionen. Der Verfassungsschutz ordnet einzelne Freikirchen als verfassungsfeindlich ein. Reporterin Kyra Funk folgt den Netzwerken vom Südwesten Deutschlands bis in die USA. \n\nDie \"SWR Story\" zeigt: Die religiöse Rechte wächst auch in Deutschland nach US-Vorbild. Christlich-fundamentalistische Gruppen kämpfen gegen demokratische Institutionen, queere Menschen und Frauenrechte. Der Verfassungsschutz ordnet einzelne Freikirchen als verfassungsfeindlich ein, wegen \"Delegitimierung des Staates\"."
