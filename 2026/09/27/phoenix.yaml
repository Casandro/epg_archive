  subtitle: Indonesische Inselwelten
  widescreen: true
  hd: true
  description: "Indonesiens Inselwelt ist reich an Traumzielen vom Taucherparadies Raja Ampat über die von Tempeln geprägten Inseln Bali und Java mit ihren gewaltigen Vulkanen bis hin zu den Urwäldern Borneos. \n\nMit Indonesiens Hauptstadt Jakarta und anderen Millionenstädten zählt die Insel Java zu den am dichtesten besiedelten Regionen der Erde. Mit fast 360 verschiedenen Bevölkerungsgruppen ist die Anzahl der Völker und Ethnien in Indonesien so hoch wie nirgends sonst."
