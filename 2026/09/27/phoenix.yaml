  title: 'Terra X-History: Die verrückte Suche nach dem Nazischatz'
  widescreen: true
  hd: true
  description: Es ist die wohl größte, konspirativste, aufwendigste und verrückteste Suche nach einem Nazischatz seit dem Zweiten Weltkrieg, und sie blieb bislang unbekannt. Das streng geheime internationale Kommandounternehmen spielte sich Ende der 1980er-Jahre, im Zeitraum um den Fall des Eisernen Vorhangs, in der noch kommunistisch regierten CSSR ab. Neuere Quellenfunde geben umfassend darüber Aufschluss. Zu den Hauptakteuren zählten ein kanadisch-amerikanisches Konsortium, Geheimdienstleute und Sicherheitskreise der damaligen Tschechoslowakei und der Sohn des Generalsekretärs der Kommunistischen Partei.
