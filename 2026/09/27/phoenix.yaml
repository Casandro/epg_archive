  description: "Nach dem teils desaströsen Abschneiden von CDU und SPD und den überragenden Gewinnen der AfD steht jetzt eine Leitfrage im Mittelpunkt der Auseinandersetzung: Was passiert mit dem vor der Sommerpause vereinbarten Reformpaket? Ziehen die Partner weiter an einem Strang oder kommt es jetzt zum finalen Bruch über die Frage, ob die Reformen aufgeschnürt oder unbeirrt realisiert werden müssen? \nDarüber diskutiert ARD-Moderator und Wahlexperte Jörg Schönenborn mit den Gästen:\n* Nikolaus Blome, RTL / ntv  \n* Karin Christmann, Der Tagesspiegel\n* Karina Mößbauer, The Pioneer \n* Hermann-Josef Tenhagen, Finanztip"
