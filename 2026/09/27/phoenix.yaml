  subtitle: Wie ein Gericht das Land verändert hat
  description: "Meinungsfreiheit, Kopftuchverbot, Corona-Maßnahmen - was Karlsruhe entscheidet, prägt das Land. Seit 75 Jahren wacht das Bundesverfassungsgericht über das Grundgesetz und verhandelt, was die Deutschen bewegt. \"Wie wir wurden, wer wir sind?\". Die Dokumentation reist durch Deutschland. Dabei blickt sie auf wegweisende Entscheidungen des Gerichts. \n\nZu Wort kommen u.a. die ehemalige Richterin des Bundesverfassungsgerichts Susanne Baer, der ehemalige Bundesinnenminister Thomas de Maizière, die Bürgerrechtlerin und Politikerin Marianne Birthler, ARD-Rechtsexperte Frank Bräutigam und der Journalist und Publizist Deniz Yücel."
