    Ein kleines Fleckchen Erde, aber große Pläne: 'Liberland' will Heimat sein für alle Freigeister, die sich von staatlichen Strukturen eingeengt fühlen. Steuern freiwillig, kaum Auflagen für Unternehmen und ein schicker Personalausweis, 'Liberland' lockt neue Bürger mit einem Versprechen: Bei uns lebt es sich freier als anderswo. So mancher Unternehmer, Wissenschaftler oder Esoteriker fühlt sich davon angezogen und erwirbt die liberländische 'Staatsbürgerschaft'.

