  title: 'Terra X-History: Die verrückte Suche nach dem Nazischatz'
  widescreen: true
  hd: true
  description: Es ist die wohl größte, konspirativste, aufwendigste und verrückteste Suche nach einem Nazischatz seit dem Zweiten Weltkrieg und sie blieb bislang unbekannt. Das streng geheime internationale Kommandounternehmen spielte sich Ende der 1980er-Jahre, in der damals noch kommunistisch regierten CSSR ab. Zu den Hauptakteuren zählten ein kanadisch-amerikanisches Konsortium, Geheimdienstleute und Sicherheitskreise der damaligen Tschechoslowakei sowie der Sohn des Generalsekretärs der Kommunistischen Partei. Die ungleichen Partner machten sich auf die Suche nach unterirdischen Einlagerungen im Wert von angeblich 28 Milliarden Dollar.
