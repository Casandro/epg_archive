  title: Calmeyers Dilemma
  subtitle: Juden retten im Schatten der Nazis
  widescreen: true
  hd: true
  description: "Hans Georg Calmeyer war ein deutscher Jurist aus Osnabrück, der während des Zweiten Weltkrieges als \"Rassereferent\" der nationalsozialistischen Verwaltung in Den Haag über Leben und Tod von tausenden Menschen entschied. Die Dokumentation beleuchtet die Frage: Hat Calmeyer niederländische Juden aktiv gerettet? Oder hat er lediglich einige vor der Verfolgung verschont? \n\"Calmeyers Dilemma\" bietet keine einfachen Antworten auf komplexe moralische Fragen der NS-Geschichte, sondern lädt zur Selbstreflexion ein: Wie hätte ich während der Judenverfolgung gehandelt? Und wie handele ich heute angesichts von Ungerechtigkeit und Unterdrückung?"
