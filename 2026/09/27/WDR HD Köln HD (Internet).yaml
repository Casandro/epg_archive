  stop: 2026-09-27T10:45:00Z
  title: Wir werden Camper
  subtitle: Sandra und Klaus in Spanien und Andorra
  description: |-
    Klaus (59) und Sandra (50) sind mit Hündin Lotte auf dem Weg nach Spanien. Ihr Ziel: Salou an der Costa Daurada. Aus dem Ruhrpott geht's für die drei über die Pyrenäen. Erster Halt: Andorra. Sandra hat große Erwartungen an die höchste Hauptstadt Europas - sie soll ein echtes Shoppingparadies sein.
    In Salou erwartet sie nicht nur ein luxuriöser Fünf-Sterne-Campingplatz, sondern auch der größte Freizeitpark Spaniens. Abseits der Touristenströme entdecken sie, was das Inland zu bieten hat. Eine unvergessliche Reise voller Action, Abwechslung und Abenteuer - und ein Paar, dass sich nach 20 Jahren Beziehung noch mal ganz neu entdeckt.
