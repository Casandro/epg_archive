  title: Die Ärzte der Ägäis
  subtitle: Deutschland 2026
  description: Griechenland hat über 200 bewohnte Inseln, von denen viele nicht über eine medizinische Versorgung verfügen. Glücklicherweise gibt es Ärzte, die solche entlegenen Ägäis-Inseln besuchen, um ehrenamtlich zu helfen. "Re:" begleitet die Mission eines Ärzteteams auf die Kykladen-Insel Serifos. Dort wird mit zwei Lkw voll medizinischem Equipment für ein paar Tage ein provisorisches Krankenhaus errichtet.
- eventId: 1275375
  start: 2026-09-27T11:30:00Z
  stop: 2026-09-27T12:20:00Z
  title: Henker & Richter (11)
  subtitle: Abführmittel
  description: "Ein Erpresser bedroht die Büdringhausener Wasserwerke. In der Tat sind schon etliche Bürger erkrankt - an dem Gift, das der Erpresser ins Wasser getan haben will? \nSaskia Henker und Kommissar Schulte kommen einige Details verdächtig vor: Warum wollte Anne Kamphuis, die Chefin der unter dubiosen Umständen privatisierten Wasserwerke, unbedingt verhindern, dass die Polizei über die Erpressung informiert wird? Und wieso waren die Messwerte des Wassers, das die Büdringhausener vergiftet hat, angeblich ganz normal? \nFür die Lösung des Rätsels muss Schulte schließlich einer Dame aus seiner Vergangenheit beherzt gegenübertreten ..."
  genre:
  - '16'
