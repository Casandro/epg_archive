  subtitle: Wie ein Haus wieder zum Leben erwacht
  description: '14 Jahre Warten. 14 Jahre Provisorium. Und jetzt soll es wirklich losgehen. Die Oper Köln kehrt zurück in den Bau von Wilhelm Riphahn: raus aus dem vierten, etwas verschämten Interim, zurück in die Fußgängerzone. Eine Doku über Aufwand, Komplikationen und Emotionen eines Umzugs im laufenden Betrieb.'
