  title: Planet Weltweit - Gitarren und Flamenco in Granada
  subtitle: Planet Weltweit - Gitarren und Flamenco in Granada
  description: 'Gitarrenmusik, Instrumentenbau und Flamenco sind bedeutende Teile der andalusischen Kultur. So wie die 12jährige Claudia Calle, möchten viele junge Menschen im Süden Spaniens durch die Musik berühmt werden: Als Tänzer, Musiker oder Instrumentenbauer. Das Zentrum des handwerklichen Gitarrenbaus weltweit ist Granada. Und der dienstälteste von rund 40 Gitarrenbauern in der Stadt ist Francisco Manuel Díaz. Àlvaro Pérez, genannt El Martinete, lebt in Granada. Der 23jährige spielt seit seinem sechsten Lebensjahr Gitarre. Er hat bereits einige Nachwuchs-Wettbewerbe gewonnen und plant gerade die nächsten Karriereschritte: ein Konzert im ältesten Flamenco-Verein Spaniens und den Kauf einer neuen Flamenco-Gitarre. Die bestellt er bei Francisco Manuel Díaz, der in einer kleinen Straße unterhalb der Alhambra seit 1976 Gitarren baut, repariert und verkauft. Von der Musik der Stadt begeistert ist auch die 12jährige Claudia Calle. Besonders der Flamenco, der in ganz Andalusien noch immer ein lebendiger Teil der Kultur ist, hat es ihr angetan. Claudia tanzt seit ihrem vierten Lebensjahr. Unter Anleitung ihrer Lehrerin Lucía Guarnido, die jahrelang in weltberühmten Ensembles aufgetreten ist, und zum Gitarrenspiel von Àlvaro Pérez, lernt sie die verschiedenen Flamenco-Stile. Weil sie so ehrgeizig und begabt ist, hat sie in ihrer Tanzschule schon einige Altersstufen übersprungen. Sie trainiert mindestens viermal pro Woche, zusätzlich übt sie derzeit nebenher zusammen mit Àlvaro das Repertoire für den Auftritt im Flamenco-Verein ein, bei dem sie tanzen wird. Dass sich Granada zu einem Zentrum des Gitarrenbaus und der Gitarrenmusik entwickelte, ist kein Zufall: die Mauren, die mehr als 700 Jahre hier herrschten, brachten im 8. Jahrhundert den Vorläufer der Gitarre, die arabische Oud, mit auf die iberische Halbinsel. GEO Reportage begleitet Claudia Calle und Àlvaro Pérez auf ihrem Weg zum Auftritt in der "Peña La Platería", im ältesten Flamenco-Verein Spaniens. DE 2018'
- eventId: 1234848
  start: 2026-09-27T17:15:00Z
