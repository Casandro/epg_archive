  title: Planet Weltweit - Norwegen, Försterinnen auf dem Vormarsch
  subtitle: Planet Weltweit - Norwegen, Försterinnen auf dem Vormarsch
  description: "Das Land der Fjorde, Berge und Wälder - Norwegens spektakuläre Natur ist weit über seine Landesgrenze bekannt. Jedoch ist auch hier eine moderne umweltverträgliche Forstwirtschaft nicht leicht umsetzbar. Försterin Merete Larsmon bestimmt in Sogn og Fjordane die Aufforstung. Am zweitlängsten Fjord der Welt, dem Sognefjord, erstellt sie Pflanzprogramme, überwacht Fällungen und prüft den Zustand der Baumsubstanz. Ihr Credo: den Wald nutzen, ohne die Biodiversität aus den Augen zu verlieren. Auch als Chefin der norwegischen Frauenförsterinnen will sie die Waldwirtschaft voranbringen. \n DE 2016"
