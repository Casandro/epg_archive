  title: Planet Weltweit - Florenz, Fußball bis aufs Blut
  subtitle: Planet Weltweit - Florenz, Fußball bis aufs Blut
  description: 'Florenz, die Wiege der Renaissance, ist alljährlich Reiseziel für Millionen von Touristen aus aller Welt. Die toskanische Metropole läuft dadurch Gefahr, ihre Ursprünglichkeit und Identität zu verlieren. Die Florentiner haben sich jedoch eine uralte Tradition bewahrt, an der nur Einheimische teilnehmen und die mit ihrer Stadt untrennbar verbunden ist: den "Calcio Storico Fiorentino" - Florentinischer Fußball. Das Spiel ist hart, brachial, primitiv und seit dem späten Mittelalter in Florenz populär. Für ihr Kräftemessen in Kostümen und nach Regeln aus dem 16. Jahrhundert erhalten die Spieler weder Geld noch dauerhaften Ruhm. Was zählt ist die Ehre, das eigene Stadtviertel im Kampf zu repräsentieren. Jedes Jahr im Juni versammeln sich die stärksten und mutigsten Florentiner Männer in farbenprächtigen Kostümen auf der Piazza Santa Croce zum Fußballspielen. Vier Teams repräsentieren die vier mittelalterlichen Stadtviertel: Santa Croce, Santa Maria Novella, Santo Spirito und San Giovanni. In diesem Jahr ist Biagio Cingolani der Anführer des Roten Teams und Marino Vieri der Chef der Weißen. Die Teilnehmer am Calcio Storico Fiorentino sind allesamt aktive Sportler, sie trainieren Rugby, Boxen oder Kampfsportarten - was hilft, denn der Florentiner Fußball ist eine Mischung aus alldem. Regeln gibt es so gut wie keine, Prügeleien sind zwar verboten, doch was man als Außenstehender sieht, ist nicht immer schön anzusehen: Die Nahkämpfe beim Calcio Storico sind fast immer brutal und blutig. Die Spieler ziehen, raufen, schlagen sich mit den Fäusten ins Gesicht, ringen miteinander am Boden oder sind ineinander verkeilt - angefeuert von den enthusiastischen Rufen der Zuschauer. Außer der Leidenschaft für das Spiel verbindet Marino und Biagio nicht viel - der eine ist Unternehmer, der andere Mosaikleger. Auch Ärzte oder Rechtsanwälte spielen mit beim harten Florentiner Fußball - doch die weitaus meisten sind Vertreter des traditionellen Handwerks. DE 2011'
