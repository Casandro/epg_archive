  title: Planet Weltweit - Brasilien - Büffel auf Streife
  subtitle: Planet Weltweit - Brasilien - Büffel auf Streife
  description: 'Die Einwohner der Amazonas-Insel Marajo nutzen außergewöhnliche Reittiere, um die sumpfigen Mangrovenwälder ihrer Heimat zu durchdringen: asiatische Wasserbüffel, eine halbe Tonne schwer, mit stolzen Rundhörnern bestückt und meist friedlich gesinnt. Einer Legende nach soll im Jahr 1920 ein Schiff vor der Küste der Insel untergegangen sein. Einige Büffel, die als Fracht geladen waren, schafften es an Land und vermehrten sich so prächtig, dass heute über eine halbe Million Tiere die Insel bevölkern. Sie dienen als Nutz-, Haus- und Arbeitstiere, und sogar die Polizei greift auf sie zurück - als einzige berittene Büffelstaffel der Welt.  Es ist Nacht in Soure, der Hauptstadt der Insel Marajo. Die Polizei hat einen Tipp erhalten, dass zwei Jugendliche einen Einbruch planen. Hauptmann Roberto Absalao kann die beiden kurz vor der Tat stellen - Dank seines kräftigen schwarzen Vierbeiners mit den großen Hörnern: Der Büffel hat sich unauffällig und leise an die Verdächtigen herangeschlichen. Viel leiser als ein Geländewagen oder Pferd das hätten tun können. Das ist nur einer der Vorteile eines Büffels; außerdem bewegt er sich trittsicher auf festem und schlammigen Boden, ist ein guter Schwimmer und gibt sich am Feierabend mit einem Ballen Heu zufrieden. Weil inzwischen einige Tiere der Truppe zu alt sind, um ihren Dienst bei der Polizei zu verrichten, wurde Hauptmann Roberto Absalao damit beauftragt, neue Rekruten für die Büffeltruppe zu finden. Per Boot fährt er auf eine Fazenda, eine einheimische Ranch, um dort ein junges Tier auszusuchen. Die Wahl fällt auf einen etwa zweijährigen Büffel namens Rambo, der nun die Chance auf eine Polizeikarriere erhält - statt wie die meisten Artgenossen als zartes Biofleisch zu enden. Etwa einen Monat wird das Tier geschult, um die Aufgaben eines Polizeibüffels zu lernen: Dazu gehört das Patrouillieren auf den Straßen der Hauptstadt genauso wie entlang der malerischen Sandstrände und den unwegsamen Mangrovensümpfen der Insel. DE 2007'
  ageRating: 6
