  title: Planet Weltweit - Der Kosakenpriester vom Don
  subtitle: Planet Weltweit - Der Kosakenpriester vom Don
  description: Nachdem das Kosakentum 70 Jahre lang in der Sowjetunion verboten war, ist es nun in Russland wieder da. An den Ufern des Don erklingen wieder die alten Lieder. Erwachen soll auch das alte Bündnis der Kosaken mit der russisch-orthodoxen Kirche. Für den russischen Erzpriester Oleg ist das nach Jahrzehnten des Atheismus im Land eine wahre Herausforderung. In einem Ikonenbus ist Vater Oleg immer wieder für einige Tage zwischen Wolga und Don unterwegs. Der Wirkungskreis des Kosakenpriesters das gesamte Wolgograder Gebiet. Es ist von weiten Steppenlandschaften geprägt und liegt rund 1000 km von Moskau entfernt im Süden Russlands. Durch sein Zentrum fließen die beiden geschichtsträchtigen Ströme Wolga und Don. An den Ufern des Flusses Don hatten sich im 15. Jahrhundert, an den einstigen Grenzen des Russischen Reiches, entlaufene russische Leibeigene angesiedelt und sich mit hier lebenden Steppenvölkern vermischt. Sie schützten ihre Dörfer und später auch die Grenzen des Zarenreichs. So entstand eine eigene Volksgruppe, die der Kosaken. Heute soll es in Russland über 5 Mio. Kosaken geben, aber nur die wenigsten haben noch einen direkten Bezug zu ihrer Herkunft und ihren Traditionen, wie die Kosaken vom Don. Und doch erklingen sie wieder überall, die alten Lieder. Mal melancholisch, mal beschwingt. Vater Oleg ist neben Gottesdiensten auch für die geistliche und geistige Führung der Kosaken zuständig. Wie einst zu Zarenzeiten sollen auch heute wieder die ethisch-moralischen Werte der christlichen Religion das Denken und Handeln der Kosaken prägen und leiten. Dazu fährt er über 100 Kilometer weit in die Steppe, zu den Kosaken des Reitsportklubs der Staniza Surowikino. Sie versuchen die traditionelle Reitkunst der Kosaken wieder zu beleben, die Dshigitowka. DE 2016
