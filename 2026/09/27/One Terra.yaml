  title: Planet Weltweit - Nopal, der Alleskönner aus Mexiko
  subtitle: Planet Weltweit - Nopal, der Alleskönner aus Mexiko
  description: 'Planet Weltweit: Der Feigenkaktus Nopal ist Mexikos Wahrzeichen und in der mexikanischen Küche allgegenwärtig. In engen Reihen wächst er zum Beispiel an den Hängen von Milpa Alta, dem südlichsten Bezirk von Mexiko-Stadt. Seine Heilkräfte gelten als belegt, das könnte ihn international zum Superfood machen. Aber auch junge Kreative entdecken am Nopal immer neue Seiten: Veganes Kaktus-Leder ist der letzte Schrei. Steht der Lederindustrie eine Zeitenwende bevor? Consuelo Laras Felder liegen an den Hängen von Milpa Alta, dem südlichsten der 16 Bezirke von Mexiko-Stadt. "Milpa Alta" bedeutet in der vorspanischen Sprache Nahuatl "hohes Kornfeld". Auf über 2000 Metern über dem Meeresspiegel wächst hier ein Großteil der frischen Nahrungsmittel für die Millionenmetropole. 80 Prozent davon ist Nopal. Consulo ist eine der wenigen Frauen, die Kaktusfelder besitzt und so ihr eigenes Geld verdient - mit der Gründung ihrer kleinen Kooperative hat sie mehreren Frauen Arbeit verschafft. Das rief in der traditionell geprägten Gegend viel Missgunst hervor. Sie will ihren Bio-Nopal zu einer eigenen Marke machen, mit regionalem Herkunftslabel. Wenn sich die Bauern zusammenschließen würden, könnten sie das Superfood zu Festpreisen verkaufen, was für alle ein Gewinn wäre. Der Feigenkaktus hat jedoch noch mehr "grüne" Qualitäten, er kommt auch urban, hip und chic daher: Die beiden Jungunternehmer  Adrián López und Marte Cazarez tüfteln seit Jahren an einer umweltfreundlichen Alternative zu tierischem und synthetischem Leder. Und genau die liefert ihnen Nopal-Leder. Die Mode- und auch die Automobilindustrie sind den beiden schon auf den Fersen, das Interesse an ihren Produkten ist groß. Doch immer wieder stellt sich die bange Frage, ob die Ernte gut genug ist und ausreichend Material für kommende Aufträge liefert.  DE 2022'
