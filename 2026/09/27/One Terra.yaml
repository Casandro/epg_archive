  title: Planet Weltweit - Kanada - Mit der Hebamme durch die Badlands
  subtitle: Planet Weltweit - Kanada - Mit der Hebamme durch die Badlands
  description: 'Die kanadischen Badlands im Südosten Albertas: Prärie, soweit das Auge reicht, staubtrockene Canyons und bizarre Felstürme, genannt "Hoodoos". Eine faszinierende, unwirklich scheinende Landschaft. Auf fast 90.000 Quadratkilometern leben nur noch wenige, sehr bodenständige Menschen, auch junge Familien. Hebamme zu sein im "schlechten Land" ist mehr als ein Abenteuer. Inmitten dieser Landschaft lebt und arbeitet die Hebamme Terrie Shaw. 250 Kilometer zu einer Kundin zu fahren ist für sie Alltag. In Medicine Hat, einer Kleinstadt inmitten der kanadischen Badlands, wohnt die Hebamme. Terrie hat selbst fünf erwachsene Kinder und ihr Beruf ist ihre Passion. Terrie ist fast immer unterwegs, denn ihre Kundinnen wohnen oft weit im Land verteilt, Stunden entfernt. Die meisten der Frauen hier wollen ihre Kinder zu Hause entbinden und schätzen die Begleitung einer Vertrauensperson. Doch längst nicht alle kommen in diesen Genuss, denn das Budget für die selbstständige Hebamme ist begrenzt. DE 2018'
  ageRating: 6
- eventId: 1234855
  start: 2026-09-27T18:15:00Z
  stop: 2026-09-27T19:07:00Z
  title: Planet Weltweit - Arapaima, der Riesenfisch vom Amazonas
  subtitle: Planet Weltweit - Arapaima, der Riesenfisch vom Amazonas
  description: 'Wenn im Oktober die Schonzeit vorbei ist, ziehen die brasilianischen Fischer am oberen Amazonas los. In wackeligen Kanus und mit Harpunen machen sie Jagd auf den größten Süßwasserfisch Südamerikas: den Arapaima, in Brasilien Pirarucú genannt. GEO Reportage war mit im Boot. Die größten Exemplare des Arapaima sind bis zu drei Meter lang und 200 Kilogramm schwer, die Art hat viele Millionen Jahre Evolution weitgehend unverändert überdauert. In weiten Teilen Brasiliens ist der Fisch heute ausgestorben oder akut bedroht. Ganz anders in den Fanggründen der Gemeinde Itapuru. In den rund 300 Seen, gelegen im eine Million Hektar großen Naturschutzgebiet Piagaçu-Purus, tummeln sich um die 20.000 Exemplare. Zu verdanken ist dies Irailton Bastos da Silva. Er hat früher selbst als illegaler Fischer gearbeitet - und setzt sich heute für den Schutz der Arapaima-Bestände ein. Das Amazonasbecken ist ein gigantisches Labyrinth aus Flüssen, Seen und Kanälen. Es ist das zweitgrößte Feuchtgebiet der Erde. Die Arapaima-Fischerei hat hier eine lange Tradition. Mittlerweile steht der Fisch in Brasilien jedoch unter Schutz, die Jagd auf ihn wurde 1996 komplett verboten. Die illegale Fischerei ging trotzdem weiter. Die vor Ort ansässigen Uferbewohner erhielten deshalb für bestimmte Gebiete eine Sondererlaubnis und wurden gleichzeitig im nachhaltigen Umgang mit der Fisch-Population geschult. Ein voller Erfolg: Wo vor zwei Jahrzehnten kaum mehr ein Fisch gesichtet wurde, werden heute jede Saison Hunderte Arapaimas gefangen. Auch in Itapuru steigen die Bestände seit Einführung des Schutzprogramms stetig. Heute bringt die Arapaima-Fischerei der 300-Seelen-Gemeinde um die 400.000 Reais im Jahr, umgerechnet rund 100.000 Euro. Ein wichtiger Ansporn für die Fischer, gut über die Fanggründe zu wachen.  DE 2018'
  ageRating: 12
- eventId: 1234856
  start: 2026-09-27T19:15:00Z
  stop: 2026-09-27T20:07:00Z
  title: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  subtitle: Wasser ist Zukunft - Der Colorado - Ein Fluss sucht seine Mündung
  description: 'Es ist ein Fluss der Superlative: Der Colorado entspringt in den Rocky Mountains und fließt durch den berühmten Grand Canyon. Doch in Mexiko, wo der Strom über Jahrtausende ins Meer mündete, kommt kaum noch ein Tropfen Wasser an. Die Mündung liegt seit Jahrzehnten trocken, eine Wüstenlandschaft. Zu groß ist der Wasserbedarf der Menschen im Einzugsgebiet des Colorados. Angesichts des Wassermangels erscheint verwegen, was mexikanische und amerikanische Naturschützer vorhaben: Die Mündung des Colorados soll wieder Wasser führen und ergrünen. Dabei sind die Herausforderungen groß. Seit 15 Jahren schneit und regnet es im Quellgebiet des Colorados in den Rocky Mountains weniger als zuvor. Der Wasserspiegel am Lake Mead, einem der größten Wasserreservoire der USA, sinkt. Dadurch muss ausgerechnet die Stadt Las Vegas Wasser sparen. Aus der verschwenderischen Wüstenmetropole ist eine Stadt mit Vorbildcharakter geworden: Sie verbraucht immer weniger Wasser, obwohl ihre Einwohnerzahl steigt. Anders in Arizona: Rund um die Stadt Yuma fließen weiterhin Milliarden Liter Coloradowasser in die Wüste, um die USA mit Salat und Gemüse zu versorgen. Die Dokumentation begleitet Menschen, deren Leben eng mit dem Wasser des berühmten Flusses verbunden sind. Sie zeigt Wasserpolizisten und Wüstengärtner in Las Vegas, die Bewohner zum bewussten Umgang mit dem kostbaren Nass bewegen. Das Kamerateam folgt Farmern in die Wüste Arizonas und kreativen Umweltschützern in das spektakuläre Coloradodelta. Ihre Geschichte zeigt, dass eine ausgedorrte Landschaft wieder erblühen kann, wenn der Mensch dem Fluss einen Teil seines Wassers zurückgibt. DE 2017'
  ageRating: 6
- eventId: 1234877
  start: 2026-09-27T20:15:00Z
  stop: 2026-09-27T21:07:00Z
  title: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  subtitle: Planet Weltweit - Das Gerichtsschiff vom Amazonas
  description: 'Planet Weltweit: Viele Menschen am Amazonas leben in schwer zugänglichen Gebieten, abseits großer Städte ohne jede Infrastruktur und ohne Zugang zu Behörden und Ämtern. Für Recht und Ordnung sorgt ein schwimmendes Gerichtsschiff, welches sechsmal pro Jahr die Flussarme des Amazonas befährt und Streitfälle in den Gemeinden schlichtet. An Bord sind neben einer Richterin und einem Staatsanwalt mehrere Sozialarbeiter. Fast siebzig Mitarbeiter teilen sich während dieser Zeit die wenigen Waschbecken und Hängematten. Eine logistische Herausforderung. Sorgerechtsstreitereien, Unterhaltsforderungen oder kleinere Diebstähle - all das, was in größeren Städten zur täglichen Routine von Gerichten und Ämtern gehört, stellt an den Flussufern des Amazonas eine besondere Herausforderung dar. Denn oft liegen die kleinen Dörfer und Gemeinden an unzugänglichen Uferstellen, an denen nur Schiffe anlanden können. Feste Wege oder gar Straßen gibt es nicht.  Dennoch unterstehen auch jene Ortschaften der brasilianischen Gerichtsbarkeit, und die Menschen haben ein Recht auf Unterstützung bei Amtsfragen und Streitfällen. Sechsmal im Jahr fährt deshalb das Gerichtschiff Joao Bruno für jeweils eine Woche die Regionen ab, um den Menschen in jenen abgelegenen Orten diese Serviceleistung des Staates anzubieten. Höchste Instanz dabei ist eine amtliche Richterin oder ein Richter. Diesmal ist es Laura Costeira. Der 42jährigen ist es ein Anliegen, ihre Dienste den Menschen auch abseits der Städte nahezubringen. Einfach wird die Reise nicht: An Bord gibt es für die insgesamt 70köpfige Reisegemeinschaft gerade einmal vier Waschmöglichkeiten. Die meisten Passagiere schlafen in Hängematten. Eine einzige Köchin ist für die Verpflegung der Mannschaft zuständig. Und dennoch hat sich das Projekt zu einem Erfolgsmodell entwickelt, bei der Mannschaft und den Menschen am Amazonas. So soll es auch diesmal sein. DE 2022'
- eventId: 1234883
