  title: VIP Trip - Prominente auf Reisen 3 - Jamaika mit Wolke Hegenbarth
  subtitle: VIP Trip - Prominente auf Reisen 3 - Jamaika mit Wolke Hegenbarth
  description: 'Begleiten Sie die bekannte Schauspielerin Wolke Hegenbarth auf die karibische Insel Jamaika. Die Reise beginnt an der Nordküste, in der Stadt Falmouth. Bis 1838 lebte Falmouth vom Handel mit Zuckerrohr und Sklaven aus Afrika. Auf den bunten Märkten und in den Straßen ist das afrikanische Erbe und die Lebensfreude der heutigen Bewohner allgegenwärtig. Ob jamaikanischer Apfel oder frische Kokosmilch: An den exotischen Früchten kann die Schauspielerin nicht einfach vorbeigehen, sie muss sie verkosten. In Rose Hall Great House gelangt sie an einen Ort, an dem sie  mehr über das unsägliche Leid der Sklaven während der britischen Kolonialherrschaft erfährt. Damals gehörte das Anwesen dem Zuckerrohr-Baron John Palmer, der auf seinen Plantagen mehr als 2000 Sklaven hielt. Das heutige Museum veranschaulicht diese düstere Zeit. Wenig später erkundet Wolke Hegenbarth auf dem Pferderücken die Mangrovenküste und Teile der immergrünen Berglandschaft im Landesinneren. Auf einer Fahrradtour im ''Blue Mountains''-Nationalpark und abseits der Touristenpfade entdeckt die Schauspielerin einen traumhaft gelegenen Wasserfall. Hier  genehmigt sie sich eine kleine Pause und ein ausgiebiges Bad im glasklaren Wasser. Im weiteren Verlauf ihrer Reise geht die Schauspielerin einem interessanten Thema nach: Denn im renommierten Hotel Jamaica Inn bewegt sie sich bereits auf den Spuren früherer VIPs. In den 50er Jahren war das Hotel bereits der Rückzugsort für Hollywood-Stars wie Marilyn Monroe, Errol Flynn und Katherine Hepburn. Auch Winston Churchill verbrachte hier entspannte Tage. Übrigens auch Ian Fleming. An der Bar des Jamaica Inn saß der geistige Vater des Super-Agenten James Bond recht häufig und und erfand dabei den echten ''Wodka Martini''. ''Geschüttelt, nicht gerührt!'' DE 2017'
  ageRating: 6
