  title: 'Reiseeuphorie: Roadtrip Dominikanische Republik - Ins zentrale Bergland rund um Jarabacoa'
  subtitle: 'Reiseeuphorie: Roadtrip Dominikanische Republik - Ins zentrale Bergland rund um Jarabacoa'
  description: 'Wir brechen wir auf, um das unbekannte Innere der Dominikanischen Republik zu erkunden: Es geht in die Bergwelt nach Jarabacoa! Leider verpassen wir die richtige Ausfahrt und müssen direkt durch das Verkehrsgetümmel von Santo Domingo. Hier sind starke Nerven gefragt, aber wir schaffen es durch die Stadt und tauchen sofort in eine atemberaubend grüne, tropische Landschaft ein! DO 2024'
