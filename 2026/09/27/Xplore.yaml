  title: VIP Trip - Prominente auf Reisen 2 - Tasmanien mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Tasmanien mit Richy Müller
  description: Seien Sie dabei, wenn der beliebte Schauspieler Richy Müller  Australiens südlichsten Bundesstaat  Tasmanien erkundet. Seine Reise beginnt dabei in Hobart. Die größte Stadt der Insel ist nicht nur das kulturelle und wirtschaftliche Zentrum Tasmaniens, sondern kann sich aufgrund ihres Gründungsjahres 1804 auch mit dem Titel ,,zweitälteste Stadt Australiens'' schmücken. Landesweit ist die Stadt vor allem für den 'Salamanca Market' bekannt. Dieser Straßenmarkt ist fest in der Geschichte der Stadt verankert und lockt an Wochenenden bis zu 25.000 Besucher an. Tasmaniens  heimliches Wappentier ist der 'Tasmanische Teufel'. Dieses sehr scheue und zugleich faszinierende Tier, kommt ausschließlich auf Tasmanien vor und kann bisweilen - mit etwas Glück ' auch von Touristen beobachtet werden.  Darüber hinaus bietet die Insel unzählige Möglichkeiten für sportliche Betätigung. Immerhin gelten die Australier allgemein als äußerst sportbegeistert. So lädt die Bucht von Hobart auch Richy Müller zu einer entspannten Tour mit dem Kajak ein. Vorbei an traumhaft gelegenen Häusern und zahlreichen Booten, zeichnet sich hier von der Seeseite aus ein ganz besonders Stadtbild ab. Doch nicht nur die Küste lädt zum Verweilen ein. Das nächste Ziel des Tatort-Kommissars ist der Lake Dove. Dieser im Inneren der Insel gelegene See bietet mit seinen zahlreichen Wanderwegen am Ufer reichlich Platz, um die Seele baumeln zu lassen. Dabei schaffen die Wälder der Landschaft eine melancholische, fast schon märchenhafte Atmosphäre. DE 2012
