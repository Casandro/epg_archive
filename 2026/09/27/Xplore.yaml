  title: Die Ostküste der USA - Big Apple und Meer
  subtitle: Die Ostküste der USA - Big Apple und Meer
  description: 'Von Delaware geht es entlang der Küste bis nach New Jersey, dem Vorort der großen Stadt, bis ins Herz von Manhattan. Delaware ist bekannt als Steuerparadies, aber an seiner Küste wachsen auch ausgezeichnete Weine. Peggy Raley fing mit wenigen Rebstöcken an und musste erst noch dafür sorgen, dass Weinanbau in dem puritanischen Bundesstaat legalisiert wurde. Heute ist ihr Hof an der gesamten Ostküste bekannt. In New Jersey macht sich die Nähe zu New York City bemerkbar, die Strände nicht nur von Atlantic City sind beliebte Badeplätze für Großstädter. Auf der Barnegat Halbinsel bei Toms River macht Lindsay Harrington Jagd auf kleine Krabbler für einen Insektenzoo und die Wissenschaft. Und dann weist die Freiheitsstatue den Weg ins Herz des Big Apple. Die wahren Kennzeichen von Manhattan sind für manche New Yorker jedoch die Wassertanks, ein typischer Wolkenkratzer hat mindestens einen. Clive Bushay sorgt für ihre Instandhaltung. Ein lebensgefährlicher Job in der Höhe. Auch Austin Horse muss hellwach sein, für den Fahrradkurier sind 100 Kilometer Strecke ein ganz normales Tagespensum, und das in einer Stadt, die ständig im Verkehrschaos steckt. Außerdem hat Austin einen Ruf zu verteidigen: als schnellster und bester Radkurier. Auf Long Island geht es wieder ruhiger zu, hier werden Austern gezüchtet. Ganz am Ende der Insel liegen die Hamptons, das Erholungsgebiet der Upper Class. Angela Boyer-Stump bringt dort Luxusimmobilien an den Mann. US 2014'
  ageRating: 6
- eventId: 1235049
  start: 2026-09-27T06:05:00Z
  stop: 2026-09-27T06:57:00Z
  title: Die Ostküste der USA - Im Herzen Neuenglands
  subtitle: Die Ostküste der USA - Im Herzen Neuenglands
  description: "Von New York führt die Reise entlang der Küste in das Herz Neu-Englands - bis nach Boston, der Hauptstadt von Massachusetts mit seinen bekanntesten Inseln Nantucket und Martha's Vineyard. New Haven in Connecticut wird dominiert von der Yale University, die zu den besten Bildungsinstitutionen der Welt zählt. Neben ihrem Studium ist Maddie Lips auch Captain des prestigeträchtigen Ruder-Achters. Zweimal täglich trainiert sie mit ihrer Crew. Die Gegend um Newport in Rhode Island hat im 19. Jahrhundert der amerikanische Geldadel für die Sommerfrische entdeckt. Noch heute finden sich hier einige der mondänsten Villen des ganzen Landes - und die Farm von Ann Targasian, die Alpakas hält. Martha's Vineyard ist einer der begehrtesten Urlaubsorte in den USA, gern besucht auch von Präsidenten. Nantucket hingegen ist als Walfängerinsel berühmt geworden. Heute wird vor Cape Cod aber lieber auf Jakobsmuscheln gefischt. Bessere Fangmethoden sorgen für gesunde Bestände, aber seit der Handel mit den Lizenzen erlaubt wurde, sorgen sich kleine Unternehmer wie Bob Keese um ihre Existenz. Auch die Robbenbestände konnten sich erholen, seit die Tiere unter Schutz gestellt wurden. Zu Tausenden tummeln sie sich auf den Sandbänken vor Cape Cod. Die Pathobiologin \nAndrea Bogomolni zieht von den Tieren Rückschlüsse auf den Gesamtzustand des maritimen Lebensraums. Und in Boston hat Jessie Banhazl ein grünes Imperium geschaffen: sie betreibt Gemüseanbau im großen Stil, auf den Dächern der Stadt. US 2014"
  ageRating: 6
- eventId: 1235050
  start: 2026-09-27T07:10:00Z
  stop: 2026-09-27T08:02:00Z
  title: Die Ostküste der USA - New Hampshire und Maine
  subtitle: Die Ostküste der USA - New Hampshire und Maine
  description: Von Boston aus führt die Reise durch New Hampshire und Maine bis zur kanadischen Grenze. Über 3.000 Inseln gibt es hier, ein Paradies - nicht nur für Hummer. Im geschützten Hafen von Rye zielt Shauna Fraser mit Yoga auf dem Paddelboard auch auf die innere Haltung. New Hampshire hat nur 19 Kilometer Küste und kurze Sommer, umso mehr nutzt Shauna jede Gelegenheit am Meer zu sein. Im südlichen Maine produziert Mike LaVecchia Surfbretter, und zwar vollständig aus Holz. Für gute Fahreigenschaften übernimmt er Verfahren aus dem Bootsbau. Mit Holzhändler Allan Higgins geht es in die ausgedehnten Wälder Maines, und dann in Moody's Diner, für dessen Spezialitäten Stammgäste hundert Kilometer und mehr fahren. Die abgeschiedene Bucht von Penobscot wird täglich von Tomàs Sowles angeflogen. Ob Post, Baumaterial oder Hunde - alles, was auf die Inseln muss, nimmt er in seiner Cessna mit. Die Bucht ist ein Paradies für Hummer, die hier so zahlreich leben wie nirgendwo sonst in den USA. Das ist nicht zuletzt den strengen Fangvorschriften zu verdanken, wie Geneviève Kurilec-McDonald erklärt. Als Köder schwört sie auf Salz-Heringe. Und dann ist da noch David Moses Bridges, der ein altes Handwerk seines Stammes wiederaufleben lässt. Er baut Kanus aus Birkenrinde, so wie seine Vorfahren. Mittlerweile hat der "Indian Summer" Einzug gehalten. Warme Spätsommertage, die trockene klare Luft und der gelegentliche Nachtfrost geben den Blättern eine unvergleichliche Farbe. Zu keiner anderen Zeit ist der Zauber der amerikanischen Ostküste so gegenwärtig. US 2014
  ageRating: 6
- eventId: 1235063
  start: 2026-09-27T08:10:00Z
  stop: 2026-09-27T09:02:00Z
  title: Der Rhein von oben - Der Alpenrhein
  subtitle: Der Rhein von oben - Der Alpenrhein
  description: 'Die Reise startet an der wichtigsten Quelle des Vorderrheins, dem Tomasee in Graubünden. Hier trainiert Ernst Bromeis, er will den Rhein von der Quelle bis zur Mündung durchschwimmen. Das Wasser fließt in den Alpen in scheinbar unendlichen Strömen. Aber dieses Glück, dieses Privileg verpflichtet auch zum sorgsamen Umgang mit der Ressource - so lautet die Botschaft des Extremsportlers. Im Kloster Disentis zeigt Abt Daniel Schönbächler, was die Menschen vom Rhein lernen können. Weiter talabwärts liegt das eindrücklichste Beispiel für die Kraft des Vorderrheins: die Ruinaulta. In Jahrtausenden fraß der Strom seinen Weg durch Gesteinsmassen und formte eine Schlucht von seltener Schönheit. Bei Reichenau vermischt sich der Vorderrhein mit seinem Bruder, dem Hinterrhein. Er entspringt am Ostfuß des höchsten Bergs im Tessin, dem Rheinwaldhorn. Hier oben verläuft die europäische Wasserscheide, hier entscheidet sich, ob das Wasser Richtung Mittelmeer oder Nordsee fließt. In einem der ursprünglichen Seitentäler verbringt Laura Helbling ihre Sommer und sorgt für über 2000 Schafe, Kühe und Pferde. Der harte Alpsommer ist für die junge Frau Erholung vom Stadtleben und eine lang gehegte Familientradition. Tief aus den Bündner Bergen eilt das Wasser talabwärts. Bald darf der Rhein nur über kurze Strecken noch unverbaut fließen, hinter Chur wird er in einem regulierten Bett strikt nach Norden gelenkt, pfeilschnell und schnurgerade. Hier wird er zum ersten Mal Grenzfluss, zwischen der Schweiz und Liechtenstein, zwischen Österreich und der Schweiz. Von oben ist deutlich zu sehen, wie sich der mit Sand, Kies und Geröll gesättigte Rhein in den Bodensee ergießt. Nicht zuletzt wegen der besonderen Vielfalt an Pflanzen und Tieren wurden die Streckung und das alte Delta zum Naturschutzgebiet erklärt. Die Biologin Agnes Steininger teilt ihr Wissen und ihre Begeisterung für diesen Lebensraum mit Kindern. DE 2013'
  ageRating: 6
- eventId: 1235068
  start: 2026-09-27T09:10:00Z
  stop: 2026-09-27T10:02:00Z
  title: Der Rhein von oben - Der grüne Rhein
  subtitle: Der Rhein von oben - Der grüne Rhein
  description: "Vom Bodensee aus geht es über Basel und Straßburg bis nach Mainz. Im Schweizer Städtchen Stein am Rhein ist der Rhein im Sommer ein einziger großer Badeplatz. Das Wasser ist kalt, aber sauber. Als Schwimmtrainerin in der Schweizer Lebensrettungsgesellschaft kennt und respektiert Jennifer Glogg die starke Strömung. Trotzdem gehört das Bad im Rhein für sie zum Alltag. Allzuweit darf sie sich jedoch nicht mittreiben lassen. Denn bei Schaffhausen zeigt der Rhein deutlich, wie viel Kraft in ihm steckt: der Rheinfall ist mit 23 Metern Europas höchster Wasserfall. Für Schiffe ist er unpassierbar. Das brachte Schaffhausen einst den Wohlstand, die Schiffe wurden vor dem Rheinfall entladen. Auch Basel hat vom Rhein als schnellem Verkehrsweg bis hinauf zur Nordsee enorm profitiert. Doch die Stadt hat dem Rhein nicht immer gut getan. Nach dem Unfall in einem Chemie-Werk 1986 verseuchten 20 Tonnen Gift den Fluss. Eine Katastrophe, gleichzeitig aber ein Weckruf gegen den Missbrauch der Ressource Wasser. Für dieses Umdenken steht das \nRhybadhysli, ein historisches Schwimmbad auf einer Plattform direkt auf dem Fluss. Badechef Hugo Buser möchte die Baseler näher an ihren Fluss bringen und macht aus dem Badhysli einen Kultort. Am Hafen von Lauterbourg steht das \"Au Bord du Rhin\", das Restaurant der Familie Schwartz - mitten in der Risikozone. Knapp ein Dutzend Mal wurde das Haus schon von Hochwasser überflutet. Wenn der Pegel steigt, stehen auch am Illinger Altrhein die Weiden unter Wasser, wie ein Schwamm saugen die Auen die Wassermassen auf. Ein Paradies für Wasservögel und für den Fotografen Arno Helfer. Er dokumentiert, wie der Rhein sein ursprüngliches Gesicht zurückgewinnt. Den Flussgrund hält Thomas Bach sauber, der Kapitän der \"Carl Straat\". Sein Schiff kann eine stählerne Tauchglocke absenken, die durch Überdruck das Wasser vom Rheinboden verdrängt. Thomas Bach kann dann trockenen Fußes unten arbeiten und zum Beispiel verloren gegangene Anker bergen. DE 2013"
  ageRating: 6
- eventId: 1235069
