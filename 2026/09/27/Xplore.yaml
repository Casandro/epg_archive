  title: VIP Trip - Prominente auf Reisen 3 - Steiermark mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 3 - Steiermark mit Johann Lafer
  description: In dieser Folge reist Johann Lafer zurück in seine Heimat. In der Steiermark, dem "grünen Herzen Österreichs" genießt er die unverfälschte Natur, kulinarische Delikatessen und den Kontakt mit seinen Landsleuten. Die Reise beginnt im Thermenland, im Süden der Steiermark, Hier in der Nähe ist Johann Lafer aufgewachsen. Im Korb eines Heißluftballons blickt er hinunter auf die Landschaft, die für ihre heißen Quellen und urigen Dörfer bekannt ist. Zurück auf festem Boden besucht der Fernsehkoch eine Ölmühle. Hier wird demonstriert, wie Kürbiskerne gemahlen, geröstet und zu Speiseöl verarbeitet werden. Das Kürbiskernöl ist eine steirische Spezialität und kann sehr vielfältig verwendet werden. Später schlendert Johann Lafer durch Graz, das urbane Zentrum der Steiermark mit seiner historischen Altstadt, die von der UNESCO sogar als Weltkulturerbe ausgezeichnet worden ist. Als Gegenstück zu den pittoresken alten Gebäuden findet auch moderne Architektur ihren Platz in der Stadt. Im weiteren Verlauf seiner Reise besucht Johann Lafer unter anderem das Weinland mit seinen schmackhaften Weinen. Bei so viel Genüssen wird schnell klar, warum die Region auch als "Toskana der Steiermark" bezeichnet wird. Das Highlight seiner Entdeckungstour erlebt der gelernte Koch schließlich während eines Frühstücks bei Sonnenaufgang auf dem höchsten Berg der Steiermark. Gerade morgens ist die Aussicht vom Dachstein atemberaubend. DE 2007
  ageRating: 6
