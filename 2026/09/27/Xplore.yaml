  subtitle: 'Reiseeuphorie: Roadtrip Dominikanische Republik - Die Nordküste der Dominikanischen Republik'
  description: Wir sind endlich im Norden angekommen! Nach der Fahrt aus dem Gebirge erreichen wir die Gegend um Cabarete, das ultimative Surferparadies der Dominikanischen Republik! Hier gibt es hohe Wellen und echtes Karibik-Feeling. Wir nutzen die Zeit in unserer Unterkunft über Silvester, um am wunderschönen Pool zu entspannen und in Sosúa unseren Großeinkauf zu erledigen. DO 2024
