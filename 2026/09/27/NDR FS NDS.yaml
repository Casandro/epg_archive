  title: Expeditionen ins Tierreich
  subtitle: Faszination Mallorca - Die geheimnisvolle Tierwelt der Insel
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Jenseits seiner beliebten Strände verbirgt sich Mallorcas ungezähmte Seite. Im Norden thront das schroffe Tramuntana-Gebirge, die Heimat der majestätischen Mönchsgeier, die über den nebelverhangenen Bergen kreisen. Auch unter Wasser zeigt sich die Insel überraschend wild: Im marinen Schutzgebiet der Insel Sa Dragonera tummeln sich heute wieder Schwärme von Barrakudas und imposante Zackenbarsche. Die Seegraswiesen sind dank Biologin Deborah Morrison wieder Heimat bedrohter Seepferdchen. "Faszination Mallorca" zeigt die unbekannte Seite eines scheinbar vertrauten Ferienparadieses.'
