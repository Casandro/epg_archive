  title: Länder - Menschen - Abenteuer
  subtitle: Kappadokien - Im Herzen der Türkei
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Eine Tuffsteinlandschaft voll skurriler Felsen, Sonnenaufgänge, bei denen sich täglich 160 Heißluftballons am Himmel drängeln, dazu uralte Höhlenkirchen und kulinarische Extravaganzen - die türkische Region Kappadokien ist märchenhaft. Die Dokumentation begleitet einen wagemutigen Ballonpiloten, eine junge Familie, die in einer Felsenpyramide lebt, und einen Töpfermeister, der Testi-Kebab-Gefäße herstellt, in denen die Leibspeise der Gegend gekocht wird. Außerdem startet die Kürbisernte und eine Witwe weigert sich hartnäckig, ihr altes Haus an Hotelketten zu verkaufen.
