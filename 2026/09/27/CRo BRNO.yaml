  title: Toulky Josefa Veselého
  description: Jméno Věnceslava Metelky už nejspíš zmizelo z obecného povědomí, ale my vám jeho dílo a dobu představíme i ukázkou z dřívějšího pořadu. Jen dodáme, že Metelka má mnoho společného s učitelováním, muzicírováním a románem Zapadlí vlastenci. Pokud chcete poté poznávat další osobnost, tu neznámou, máte šanci v soutěži Kdotobyl. Nabídneme řadu indicií ze života onoho (neznámého) pána. Chybět nebude ani další díl Toulek českou minulostí, který se ohlédne především za prací Josefa Thomayera, což byl nejen lékař, ale (a to možná nevíte) i prozaik a fejetonista.
