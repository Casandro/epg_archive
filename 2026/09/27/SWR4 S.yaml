- eventId: 553951
  start: 2026-09-27T08:00:00Z
  stop: 2026-09-27T10:00:00Z
  title: SWR4 Promitalk
  subtitle: 'Gast: Matthias Reim'
  description: |-
    Vom Millionenrausch zur Pleite

    Die erste Single war ein Flop, dann kam "Verdammt, ich lieb dich" und Matthias Reim wurde über Nacht zum Star. Matthias Reim erlebt einen kometenhaften Aufstieg - und verliert dabei völlig die Bodenhaftung. Yacht, Autos, Haus in Kanada: Er lässt es krachen, bis er schließlich mit Millionenschulden dasteht. Im Promitalk mit Jörg Assenheimer erzählt er von seinem größten Absturz, dem Weg zurück und warum er heute viel vorsichtiger lebt.

    SWR4 Moderator Jörg Assenheimer ist jede Woche im Gespräch mit prominenten Talkgästen. Den SWR4 Promitalk gibt es auch kompakt zum Hören in ARD Sounds und zum Anschauen in der ARD Mediathek.
