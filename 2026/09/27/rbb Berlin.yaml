  title: Nationalparks der Zukunft
  subtitle: Patagonien
  episodeUri: crid://onid-8468/e/6a862a5f99dcb1ba40e52516
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Jahrzehntelang träumten Umweltschützer in Südamerika von einem zusammenhängenden System von Nationalparks durch eine der letzten großen Wildnisse des Planeten: von den gemäßigten Regenwäldern Patagoniens bis zur windumtosten Südspitze des Kontinents bei Feuerland. Und dieser Traum wurde Wirklichkeit. Über Jahre kaufte das US-amerikanische Milliardärsehepaar Doug und Kris Tompkins mehr als eine Million Hektar Land, um dort die Natur zu schützen. Viele Chilenen betrachteten sie zunächst als unerwünschte Eindringlinge, doch spätestens als das Land an den chilenischen Staat übergeben wurde, setzte ein Umdenken ein.'
- eventId:
