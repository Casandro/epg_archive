  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: "Johann König macht im Privatleben Pläne und scheitert. Was er im Berufsleben davon erzählt, kommt beim Publikum an. Wenn es sein Plan war, zu Lachsalven und frenetischem Applaus zu animieren, dann ist dieser Plan definitiv nicht gescheitert. \nIn seinem aktuellen Bühnenprogramm stellt sich Johann König erneut drängende Fragen: Wird das Haus wirklich kleiner, wenn die Kinder größer werden? Wie gendert man ein herrenloses Damenfahrrad? Gilt das Limit fürs Tempo auch für Taschentücher?\nWieder mal gelingt es dem mehrfachen Vater mit Wohnsitz in Köln, das Tiefe an der Oberfläche zu verstecken."
