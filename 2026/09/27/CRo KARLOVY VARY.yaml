- eventId: 1226906
  start: 2026-09-27T01:00:00Z
  stop: 2026-09-27T02:00:00Z
  title: Pochoutkový rok
  description: 'Vaříme podle vašich receptů. Dnes: Čeká vás recept, který se stal druhým nejlepším v roce 2025 podle poroty. V rámci letošního jubilejního desátého roku vysílání naší soutěže jsme totiž požádali osobnosti Pochoutkového roku, aby recepty, které kdysi vyhrály, uvařily a upekly podle svého. A tak dnes bude péct legendární chodské koláče ve své zjednodušené úpravě herečka Naďa Konvalinková.'
