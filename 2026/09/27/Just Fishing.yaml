  title: Karpfenangeln im Ruhrgebiet
  subtitle: Karpfenangeln im Ruhrgebiet
  description: Wir haben die beiden Kanal-Freaks Sven Ihne und Andreas Hetzmannseder über eine gesamte Saison hinweg bei ihrer Kampagne begleitet und zeigen authentisch, wie sich die beiden Top-Angler der Challenge Kanalangeln stellen, wie sie in den Jahreszeiten Frühling, Sommer und Herbst taktisch vorgehen und mit welchen Schwierigkeiten sie im Laufe des Jahres zu kämpfen haben. Sven und Andreas müssen wirklich vollen Einsatz zeigen, denn der Kanal zeigt sich immer wieder von seiner rauen Seite. Neben Strömung, Schifffahrt und einem überschaubaren Fischbestand macht ihnen der heftige Krautbewuchs des Gewässers zu schaffen. Die beiden legen unzählige Kilometer zurück und spüren die Fische immer wieder auf. Sie beangeln den Kanal in gut geplanten Kurzsessions und kommen auf Fisch. Tatsächlich fangen die beiden sogar einige der Topfische aus dem Gewässer. Wie sie es anstellen die Fische zu finden, wie viel Hingabe für erfolgreiches Kanalangeln wirklich notwendig ist und wie sie taktisch vorgehen - all das erwartet Euch in diesem einzigartigen Streifen unseres talentierten Filmemachers Christian Keßler. DE 2021
