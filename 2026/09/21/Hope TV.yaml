  description: "Wenn Kinder kommen, bleibt in der Ehe nicht mehr viel Zeit für Romantik. Aber wie sieht es aus, wenn die Kinder aus dem Haus sind? Wird sie dann wieder mehr? Wie geht man mit äußerlichen Veränderungen an sich und am Partner um? Und was ist der Schlüssel für eine lange, glückliche Ehe? In diesem Großeltern-Spezial tauschen Marion, Reingard, Dragan und Norbert ihre Erfahrungen aus. \n\nWeitere Infos: www.hopetv.de"
