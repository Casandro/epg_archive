  title: 3 Minuten Andacht
  subtitle: Sind alle Menschen gleich?
  description: |-
    Inspiriert durch Worte von J.C. Rayle habe ich diese Andacht um Gleichheit und Gerechtigkeit aufgenommen. Rassismus, Gender-Gap, Frauenquote, um nur einige Schlagwörter zu nennen. Die Gegenwart der westlichen Nationen ist gespickt mit diesen Themen! Ja, sie gehen soweit das für Frieden und Gleichheit, Gewalt und ungleiche Mittel eingesetzt werden.

    Des Mensch Traum, Gleichberechtigung und somit Gerechtigkeit zu erlangen, klammert bei jedem Versuch, dies durch Gesetze oder Politik umzusetzen, eine Tatsache aus; der Mensch lebt in einer sündigen Welt und ist selber ein Sünder. Hierhin ist die humane Rasse vereint, man kann sagen "gleich". Denn alle haben gesündigt und die Herrlichkeit Gottes verloren. Doch werden sie allein durch seine Gnade ohne eigene Leistung gerecht gesprochen und zwar aufgrund der Erlösung die durch Jesus Christus geschehen ist (Römer 3,23-24).

    Auch hier lohnt es sich das gesamte 3. Kapitel des Röme riefes zu lesen. Weiter sagt Gott uns durch die Bibel: "Und seid nicht gleichförmig dieser Welt, sondern werdet verwandelt durch die Erneuerung [eures] Sinnes, daß ihr prüfen möget, was der gute und wohlgefällige und vollkommene Wille Gottes ist." (Römer 12,2) Was kannst du nun zur Gerechtigkeit auf dieser Welt beitragen? Setze dich für das Gute ein, mach dich für die geringen und schwachen stark, sei nicht faul sondern fleißig im lernen, denn dadurch kannst du größeren Einfluss für das gute ergreifen. Doch zuallererst setze dich mit der erlösenden Botschaft von Jesus auseinander! Du bist wertvoll in Gottes Augen, doch so wie wir sind (Sünder) können wir nicht vor Gott bestehen. Sind wir perfekt? Sicher nicht, aber vor Gott gelten nur absolute! Und Gott ist absolut gerecht! Er schenkt dir eine neue Besinnung, ein neues Herz aus Fleisch und Blut und nimmt dein steinernes Herz weg. Dieser Wandel in dir, durch Gott gewirkt, wirkt Gerechtigkeit in deiner Umwelt.
  widescreen: true
  hd: true
