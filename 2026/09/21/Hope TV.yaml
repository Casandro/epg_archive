  title: Wissenswert
  subtitle: Die ersten Schritte des Christentums
  description: |-
    Wie konnte das Christentum zu einer Bewegung werden, die das Römische Reich erschütterte und bis heute Menschen bewegt? Dr. Johannes Hartlapp nimmt uns mit auf eine faszinierende Reise zu den Anfängen der christlichen Geschichte: von Petrus und Paulus in Rom über die ersten historischen Zeugnisse in den Katakomben bis hin zur Frage, warum der Glaube für so viele Menschen so attraktiv war. Doch es gab auch Herausforderungen - Gnostische Lehren und die Gefahr für das Evangelium. Erfahren Sie, wie die Apostel mit Schriften und mündlicher Weitergabe das Fundament für eine der größten Bewegungen der Geschichte legten.

