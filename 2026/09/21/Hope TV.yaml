  title: auserlesen
  subtitle: 'Dr. Arne Hofmann: Depression - Gibt es einen Weg raus?'
  description: |-
    Depressionen gehören zu den häufigsten psychischen Erkrankungen weltweit - und dennoch fühlen sich viele Betroffene allein. Dr. Arne Hofmann, Trauma-Forscher, leitete eine der ersten spezialisierten Stationen zur Behandlung psychisch traumatisierter Patienten in Deutschland und hat zahlreiche Menschen auf ihrem Weg aus der Depression begleitet. Er erklärt, wie unverarbeitete Erinnerungen und "vergrabene Stress-Batterien" depressive Episoden auslösen können - und welche Rolle die Selbstheilungskräfte dabei spielen. In seinem Buch beschreibt er die Behandlung von Depressionen mit EMDR - einer Methode zur Verarbeitung belastender Erinnerungen. Die Sendung gibt Einblicke in Ursachen und Wege zur Heilung - und zeigt, warum selbst in dunklen Zeiten Hoffnung möglich ist.

    Weitere Infos unter: www.hopetv.de
