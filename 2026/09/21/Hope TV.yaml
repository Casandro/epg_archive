  title: inBindung - Der Erziehungstalk
  subtitle: »Nein, nein, nein!« - Autonomiephase verstehen
  description: "Mit etwa zwei Jahren beginnt die sogenannte \"Trotzphase\": Das Kind sagt zu allem einfach Nein! Häufig kommen Eltern während dieser intensiven Phase an ihre emotionalen Grenzen. Dieser Widerstand des Kindes (Gegenwille), so anstrengend er auch sein mag, ist jedoch wichtig für eine gesunde Entwicklung des eigenen Selbst und er begleitet uns unser Leben lang. Wie eine friedvolle, elterliche Führung trotz Rebellion, Wutausbrüchen und Weigerung geschehen kann, erfährst du hier. Der Podcast zur Sendung \"InBindung\" ist auf allen gängigen Streaming-Plattformen zu finden. Anna Born, Julia Wanitschek und  Junita Horch gehören zum Team von \"InBindung\" und sind Exptertinnen für bindungs- und bedürfnisorientierter Erziehung. \n\nMehr Informationen gibt es auf www.inbindung.de."
