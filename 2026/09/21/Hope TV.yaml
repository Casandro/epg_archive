  title: Geschichten der Hoffnung
  subtitle: Gibts noch mehr, als ich kenne? - Thomas Wakolbinger
  description: 'Suchen Sie auch nach mehr im Leben? Mit 24 Jahren stellte sich Thomas Wakolbinger aus Niederkappel die entscheidende Frage: Gibt es auf dieser Welt noch mehr, als das, was ich kenne? Sein Eindruck von jungen Christen war damals, sie hätten nur Probleme oder seien Teil einer Selbsthilfegruppe. Doch bei seiner intensiven Suche nach dem Sinn des Lebens machte Thomas eine unerwartete Entdeckung, die sein Weltbild komplett auf den Kopf stellte und ihm eine neue Perspektive eröffnete. Lassen Sie sich in diesem ehrlichen Interview inspirieren, das zeigt, dass die größten Antworten oft dort warten, wo wir sie am wenigsten vermuten.'
