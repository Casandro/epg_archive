  stop: 2026-09-21T03:23:00Z
  title: Finess
  subtitle: Finess
  description: Finess ist ein atemberaubendes Kunstwerk, das die wunderschönen Bewegungen des Körpers beim Skifahren auf Schnee einfängt. Nachdem sich The Bunch in Far Out von ihrer exzentrischen Seite gezeigt haben, wollen sie in ihrem neuen Film etwas Finesse zeigen. Finess ist ein anderer, düstererer Skifilm, in dem ... Sie können einer Gruppe junger Menschen folgen und gleichzeitig einen Blick in ihre verwirrten Gedanken werfen. Der Film ist eine Sammlung von Selbstporträts, die zu einem Ganzen zusammengestellt wurden. Sie versuchen nicht nur, ihre Tricks und ihren Skistil zu zeigen, sondern sie äußern sich auch selbst darin Themen wie Leben, Liebe und wie es ist, ein junger Mensch in der heutigen Gesellschaft zu sein. Offizielle Auswahl IF3 2014 und High Five Festival 2014. SE 2014
- eventId: 1004251
  start: 2026-09-21T03:25:00Z
  stop: 2026-09-21T04:28:00Z
  title: Down Days
  subtitle: Down Days
  description: Down Days ist ein Dokumentarfilm, der den Lebensstil, die Gedanken und Gefühle des Big-Mountain-Extremskifahrers verfolgt. Die Reise führt uns zu einem einmonatigen Filmdreh in Haines, Alaska. Erfahren Sie, was es braucht, um ein professioneller Skifahrer zu sein, der steigende Risiken bekämpft, um Sponsoren zufrieden zu stellen und den Sport voranzubringen, während er gleichzeitig die berüchtigten Wetterbedingungen Alaskas bewältigt. Erleben Sie diese emotionale Achterbahnfahrt aus der einzigartigen Perspektive der Menschen, die daran beteiligt waren, von den Helikopter-Guides über das Filmteam bis hin zu Spitzensportlern wie Daron Rhalves, Cody Townsend, Enak Gavaggio, Jamie Pierre, Reggie Crist und Lynsey Dyer , Richard Permin, Elyse Saugstad, Corey Felton und Tom Wayes. CA 2008
