  title: Vom Wert der Zeit
  subtitle: Vom Wert der Zeit
  description: 'Hermann Huber betrachtet sein Leben als Bergsteiger seit jeher als Teil eines Puzzles - erst dann vollständig, wenn Familie, Freundschaften, Beruf, Weltoffenheit, Neugier und Liebe darin ihren Platz finden. Geboren am 20. September 1930, aufgewachsen in München und den bayerischen Alpen, begann er im Alter von 15 Jahren bei der Firma "Salewa Lederartikel" zu arbeiten. Er baute die Bergsportsparte kontinuierlich aus, bis er 1972 Geschäftsführer wurde und international bekannt wurde als "Mr. Salewa". Neben seiner Profikarriere verzeichnete Hermann weltweit Klettererfolge. Das Besondere an ihm ist, dass er sich auch im hohen Alter seinen Enthusiasmus, seine Neugier und seinen Tatendrang bewahrt hat - und so nicht nur zu einer Legende in der Welt des alpinen Bergsteigens, sondern auch zu einem Vorbild für viele geworden ist. Bester Erkundungs- und Abenteuerfilm - Fort William Mountain Festival 2022. Preisträger - Oniros Film Awards New York 2021. Gewinner - New York International Film Awards 2021. Beste Originalgeschichte - Cannes Shorts 2021. Awards of Excellence - Accolade Global Film Competition 2021. Offiziell Auswahl 2021: Mountainfilm Internationales Filmfestival Graz, Bergsichten Berg + Outdoor Film Festival, Bergfilm Tegernsee Internationales Bergfilmfestival, Krokower Bergfilmfestival, Alpen Film Festival. DE 2021'
- eventId: 1004238
  start: 2026-09-21T02:35:00Z
  stop: 2026-09-21T02:53:00Z
  title: Roadtrip durch den Süden Afrikas Teil 1 - Botswana & Namibia
  subtitle: Roadtrip durch den Süden Afrikas Teil 1 - Botswana & Namibia
  description: In Teil 1 unseres Roadtrip-Abenteuers durch Botswana und den Norden Namibias halten wir u.a. an der Spitzkoppe, machen uns auf die Suche nach Leoparden und Nilpferden, besuchen ein Waisenhaus für gerettete Elefantenbabys im Okavango-Delta und fahren über ausgetrocknete Salzseen zu einer Erdmännchenkolonie, bevor wir uns auf den Weg zum Chobe-Nationalpark begeben. AU 2025
  ageRating: 6
- eventId: 1004249
