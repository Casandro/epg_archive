  title: Kultúra SK (25)
  subtitle: Magazín o premiérach, vernisážach, koncertoch a ďalších aktuálnych udalostiach zo slovenskej kultúry.
  description: Divadlo Nová scéna v Bratislave uviedlo premiéru rodinného muzikálu Matilda. Kultúra SK zachytila skúšobný proces a nazrela do zákulisia. Činohra Slovenského národného divadla začala túto sezónu premiérou inscenácie Hlovík medzi vzbúreným ľudom autora Jonáša Záborského. Herečka Zuzana Kocúriková rozpráva o svojom 55-ročnom pôsobení na našej prvej scéne. Vyšli dva albumy legendárneho Mira Žbirku, Special a anglické pesničky pre tých najmenších. V Bulharskom kultúrnom inštitúte vystavuje svoje fotografie Michaela Conzarová. Výtvarník a reštaurátor Štefan Kocka predstavuje svoje obrazy v galérii Peter-Mária v Turzovke na Kysuciach. V Piešťanoch sa konal 21. ročník Medzinárodného filmového festivalu Cinematik. Predstavujeme finálovú päťku prestížnej slovenskej literárnej ceny Anasoft litera 2026. (2026)
