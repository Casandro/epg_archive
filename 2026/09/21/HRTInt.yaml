  description: 'Igrani film redatelja Branka Schmidta intimna je priča o starenju, poraću, ljubavi i gubitku. Stariji bračni par pokušava se ponovno uklopiti u svakodnevnicu na svom imanju na osami ratom razorenog sela, a čiju je skromnu obnovu kuće i popravak krova financirao njihov sin. Starica i starac uz fotografije iz svoje mladosti, rad u voćnjaku i u kući prepušteni su jedno drugome i odlučni nastaviti život tamo gdje ga je rat prekinuo. Njihovu surovu svakodnevicu pratimo kroz sva četiri godišnja doba. Iz dana u dan starica se ponaša sve odsutnije i izgubljenije. Starac tijekom njihove komunikacije postaje sve grublji, no kada shvati što joj se događa, potpuno mijenja svoj odnos prema njoj... Dugometražni igrani film snimljen je produkciji Hrvatske radiotelevizije na lokaciji Gorica Jamnička u okolici Zagreba, a prema izvornom scenariju Josipa Mlakića.  Nagrade  Pulski filmski festival 2015: Zlatna arena za scenarij Josipu Mlakiću, Zlatna arena za montažu Vesni Lažeti i Hrvoju Mršiću Nagrada Žirija stranih filmskih kritičara Avvantura Film Festival Zadar - najbolja glumica Nada Đurevska Vukovar Film Festival - specijalno priznanje žirija Cottbus Film Festival - Ekumenska nagrada Golden Apricot, 13. armenski filmski festival - Grand prix i FIPRESCI, nagrada žirija filmskih kritičara. Josip Mlakić, književnik i scenarist (Bugojno, 1964.). Njegovi romani Kad magle stanu i Živi i mrtvi na anonimnim natječajima za neobjavljeni roman osvojili su prve nagrade, a Živi i mrtvi i nagradu Gjalski za najbolje prozno djelo objavljeno u Hrvatskoj u 2002., poslužio mu je kao scenaristički predložak za istoimeni igrani film u režiji Kristijana Milića 2007. Radio je i kao koscenarist filma Tu redatelja Zrinka Ogreste, a scenarist je i igranog filma Branka Ištvančića Most na kraju svijeta (prema svom romanu Čuvari mostova objavljenom 2007.) Redatelj Branko Schmidt (Osijek, 1957.) diplomirao je filmsku režiju na Akademiji dramske umjetnosti u Zagrebu 1982. Filmografija: Sokol ga nije volio (1988.) (nagrada za najboljeg redatelja debitanta), Đuka Begović (1991.), Vukovar se vraća kući (1994.), Božić u Beču (1997. Zlatna arena za scenarij), Srce nije u modi (1999.), Kraljica noći (2001. dvije Zlatne arene), Put lubenica (2006. tri Zlatne arene i nagrada kritike Oktavijan, 7 Grand prixa na inozemnim festivalima), Metastaze (2009. Velika zlatna arena, 2 Zlatne arene, 2 Grand prixa na inozemnim festivalima). Dobitnik je godišnje nagrade Vladimir Nazor za režiju filma Metastaze, a igrani film Ljudožder vegetarijanac osvojio je pet Zlatnih arena u Puli 2012. te više međunarodnih priznanja među ostalim nagrada za režiju Portugalu.'
