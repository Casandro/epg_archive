  stop: 2026-09-21T14:10:00Z
  title: 'Mostovi: Zagreb grade!... na pragu modernog doba..., dokumentarni film'
  subtitle: ' '
  description: Film prikazuje urbanistički, kulturno-umjetnički i društveni život, razvoj Zagreba na pragu modernog doba - od otvaranja Sveučilišta do otvaranja Sveučilišne knjižnice u osvit Prvog svjetskog rata 1913., čime je zaključena izgradnja javnih ustanova kulturne i prosvjetne namjene na potezu Zelene potkove uz pomoć i stranih projektnih ureda i arhitekata, primarno austrijskih i mađarskih. Bilo je to razdoblje fulminantnog razvoja grada u urbanističkom i komunalnom smislu koje je pratila i profesionalizacija umjetničke scene. Pod okriljem Društva hrvatskih umjetnika, a uz financijsku potporu mecena kao što su Vraniczanyjevi ili bračni par Miletić, umjetnički život od hobija postaje profesijom. Dočaravamo plemićka druženja, soareje na kojima su oživljavali prizori grandioznih likovnih djela, vrijeme velikih promjena u školstvu, vrijeme kad se počela njegovati kultura kavana te razdoblje u kojemu je nobilitet Gornjega grada s podozrivošću gledao na pretvaranje Donjega grada iz pustopoljine i sajmišta u urbanističku jezgru metropole, čime se Zagreb tada jako primakao svome velikom uzoru - Beču. Dokumentarni film "Zagreb grade!... na pragu modernog doba" dio je "Mostova", serije o fenomenima, osobnostima i događajima koji su primarno na području kulture, povijesti umjetnosti i znanosti povezivali Hrvatsku i svijet.
