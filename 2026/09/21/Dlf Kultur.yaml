  description: "HAJR\nMit Misagh Joolaee (Kamancheh) und Bakr Khleifi (Oud) \nVon Carola Malter\n(Wdh. v. 09.02.2026)\n\nWeltmusik als Kunstmusik. Musiktraditionen als Inspiration. Bakr Khleifi und Misagh Joolaee haben sich in Berlin kennengelernt. Auf ihrem Debütalbum ?Hajr? erkunden der palästinensische Oud- und der iranische Kamanchehspieler mit Eigenkompositionen und Improvisation die Verbindungen zwischen der persischen und arabischen Musik."
