  title: kulturMONTAG
  description: "Zwei Jahrhundertkünstler im Dialog \nDie Wiener Albertina zeigt die Werke der zwei bekanntesten figurativen Maler des 20. Jahrhunderts: Pablo Picasso und Francis Bacon. Beide waren sie Chronisten ihrer Zeit und vom menschlichen Körper fasziniert, haben ihn dekonstruiert und radikal neu erfunden. Bacon war sichtbar von Picasso beeinflusst, Picasso wiederum verfolgte Bacons Karriere mit großem Interesse. Mit dieser Gegenüberstellung der Werke der beiden Jahrhundertkünstler startet die Albertina in den Ausstellungsherbst. \nMarie Kreutzer zählt zu den wichtigsten heimischen Filmschaffenden, mit ihrem jüngsten Drama \"Gentle Monster\" war sie im Wettbewerb von Cannes und hat die Kritik begeistert. Die Filmemacherin ist zu Gast im Studio. \nUnd: nicht weniger als 50 Klaviere werden im Großen Saal des Wiener Konzerthauses gleichzeitig erklingen, wenn Komponist Georg Friedrich Haas sein Projekt \"11.000 Saiten\" umsetzt. Zeitgenössische Musik als immersives Klangerlebnis.\nModeration: Clarissa Stadler"
  genre:
  - '122'
- eventId: 887529
  start: 2026-09-21T21:15:00Z
  stop: 2026-09-21T22:01:02Z
  title: Jugend und ihre Codes - Von Poppern, Punks & Co.
  description: |-
    (Dokumentation, AUT 2026)
    Wien in den späten 1970er- und frühen 1980er-Jahren. Die lange Zeit so graue Stadt ist bunter geworden und zeigt ein jugendlicheres Gesicht. Teenager haben prominente Plätze im öffentlichen Raum gekapert, um ihre Reviere abzustecken. Am Donnerbrunnen in der City lungern jeden Nachmittag Dutzende Mods herum, kenntlich an ihren Vespas samt Fuchsschwanz und dem obligaten Parker. Beim "Eissalon" im noblen Döbling werfen Popper ihre Haartolle aus dem Gesicht und warten - worauf eigentlich? Noch bis vor Kurzem lagerten an der Mariahilfer Straße Punks - Markenzeichen: die durch das Ohrläppchen gestochene Sicherheitsnadel und die Irokesen-"Frisur". Mods waren gegen Popper, Popper gegen "Prolos" und scheinbar alle gegen Rocker. Das politische Spektrum der Gruppen war breitgefächert und reichte von Null (Popper) bis No Future-Totalopposition (Punks). Heute scheinen sich Gesinnung wie Grabenkämpfe junger Menschen in den Weiten der Social Media zu verlieren...
    Regie: Karin Schiller
  genre:
  - '112'
