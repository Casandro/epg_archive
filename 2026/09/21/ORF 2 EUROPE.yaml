  description: "Drei Wochen im Monat weckt sie ganz Österreich auf. Jetzt wird sie bald selbst von ihrem \"kleinen Wunder\" wachgehalten werden: Ö3-Star Gabi Hiller ist schwanger und wird Anfang 2027 zum ersten Mal Mutter. \nBei Mariella Gittler erzählt die Niederösterreicherin von ihrem langen, teilweise schmerzvollen Weg zum Baby. Denn der Kinderwunsch hat sich für die 41-Jährige länger nicht erfüllt. Außerdem spricht sie über die Herausforderungen, die der Job als Ö3-Wecker Host mit sich bringt."
