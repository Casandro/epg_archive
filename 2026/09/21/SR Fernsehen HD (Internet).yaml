  title: Eisenbahn-Romantik (854)
  subtitle: Boliviens Andenbahn
  description: Eine Eisenbahnfahrt durch Bolivien ist atemberaubend. Manchmal sogar im wortwörtlichen Sinn. Wo in Europa die Berge aufhören, fahren in Bolivien immer noch die Eisenbahnen durch die Anden. Die Schienen der Strecke Oruro - Villazon liegen die meist in mehr als 3.000 Metern Höhe. Eine Fahrt mit der Eisenbahn in Bolivien gehört zu den schönsten Erlebnissen. Auch deshalb, weil man mit der Bahn Landschaft und Geschichte des Andenlandes gleichzeitig erleben kann.
