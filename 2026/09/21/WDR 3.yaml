  title: ARD Konzert
  subtitle: Ludwigsburger Schlossfestspiele
  description: "Die spanische Geigerin Maria Dueñas war 18, als sie den Internationalen Menuhin-Wettbewerb gewann. Die Folgen: Exklusivvertrag bei der Deutschen Grammophon, Stradivari-Geige und ein Generalschlüssel für die großen Konzertbühnen Europas. Den besitzt auch die Dirigentin Elim Chan. In Hong Kong gebürtig, in den USA ausgebildet, übernimmt sie ab 2027 als Chefdirigentin das San Francisco Symphony Orchestra - nachdem sie in London u. a. die First und Last Night of the Proms dirigiert hat. Bei der \"Last Night\" der Ludwigsburger Schlossfestspiele steht sie an der Spitze des European Union Youth Orchestras; hier spielen 120 junge Musiker*innen aus allen EU-Mitgliedsstaaten. Altersgrenze: 26. \n<strong>Johannes Brahms<br/></strong>Violinkonzert D-Dur, op. 77\n<strong>Sergei Rachmaninow<br/></strong>Sinfonie Nr. 2 e-Moll, op. 27\n<strong>Maria Dueñas</strong>, Violine<br/><strong>European Union Youth Orchestra </strong><br/>Leitung: <strong>Elim Chan </strong>\nAufnahme vom 5. August 2026 aus dem Forum am Schlosspark, Ludwigsburg"
