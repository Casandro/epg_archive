  title: WDR 3 Open
  subtitle: 'Impressionen: Festival Gnaoua Essaouira'
  description: "Essaouira an Marokkos Atlantikküste wird zu einer großen Festivalbühne. Typisch sind Fusion-Konzerte, bei denen Gnawa-Meister, gemeinsam mit internationalen Acts auftreten. Mit dabei waren 2026 neben Gnawa-Maâlems wie Hamid El Kasri und Houssam Gania u.a. der französische Flötist Sylvain Barou, der brasilianische Perkussionist Carlinhos Brown und die indisch-amerikanische Sängerin Ganavya. \nBeim nächsten Mal in Open World von WDR 3 bringt Babette Michel Ihnen Eindrücke aus Marokko mit, wo sie in der Atlantikstadt Essaouira das 27. Festival für Gnawa-Musik und Musik der Welt erlebt hat. Sie stellt Gnawa-Meister und -Meisterinnen vor, und internationale Gäste. \n<strong>Matinba</strong> | 4:56<br/>Maalem Houssam Guinia\n<strong>Parade</strong> | 3:03<br/>Maalems of Gnaoua Festival Essaouira 2026\n<strong>Jd's Reels</strong> | 3:35<br/>Sylvain Barou\n<strong>Concert d'ouverture</strong> | 1:10<br/>Mehdi Nassouli feat. Sara Moullablad, Ganavya, Troupe I Buhoro et Sylvain Barou\n<strong>The Bee</strong> | 4:46<br/>Ganavya &amp; Jahnavi Harrison\n<strong>Wone Wanesa</strong> | 3:30<br/>Selamnesh Zéméné\n<strong>Marhba Radio Edit</strong> | 4:08<br/>Souhail Artwork feat. Laila El Akkaf &amp; Mohamed Montari\n<strong>Foulani</strong> | 2:13<br/>Asmaa Hamzaoui &amp; Bnat Timbouktou\n<strong>Gembri-Song </strong>| 3:14<br/>Fatima Ezzra Jebli\n<strong>Gwagwa O De</strong> | 2:40<br/>Bahiha Black feat. Carlinhos Brown\n<strong>Lmima</strong> | 5:50<br/>Maâlem Hamid El Kasri\n<strong>Chabakro. The Wild Child Remix</strong> | 5:40<br/>Gnawa State 7 feat. Mohamed Koyo\n<strong>Mohamed Kouyou in Essaouira</strong> | 1:16<br/>Mohamed Kouyou\n<strong>Nomade </strong>| 5:23<br/>Maalem Hassan Boussou"
