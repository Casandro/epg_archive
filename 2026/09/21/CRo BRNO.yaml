  description: Zpívání z Valašska, Hané a Lašska. V hudebním výběru se dnes představí hanácká cimbálová muzika Luňák ze Sazovic, cimbálová muzika Valašsko se zpěvačkami Martou Santovjákovou Gerlíkovou a Zuzanou Šulákovou či muzika souboru Valašský vojvoda z Kozlovic. Hudební perličkou budou třeba Gajdoši Tryhuci či muzika Folklorního klubu Fogáš z Ostravy. Pořad připravil Jaroslav Kneisl a slovem provází Markéta Ševčíková.
