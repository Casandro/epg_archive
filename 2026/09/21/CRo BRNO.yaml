  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Dobré rady: Helena Továrková o předcházení vzniku odpadu. Jak prodloužit život věcem? Proč to, co je rozbité nemusí hned do koše? Své nové spokojené majitele může najít vaše oblečení, ale i pokojové květiny. Zvát vás budeme na brněnský Repair Day a připomeneme tím Evropský týden udržitelného rozvoje. Moderuje Jarka Vykoupilová.'
