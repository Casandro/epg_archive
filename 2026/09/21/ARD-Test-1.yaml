  title: 'Tatort: Die letzten Menschen von Köln'
  subtitle: Spielfilm Deutschland 2026
  description: |-
    Im 96. "Tatort" aus Köln versetzt die Bergung einer Weltkriegsbombe die Domstadt in einen Ausnahmezustand. Zur gleichen Zeit müssen Max Ballauf und Freddy Schenk den kaltblütigen Mord an einem jungen Berufsschullehrer aufklären: Linus Makris wurde in einem Park mit einem Jagdmesser getötet.
    Die Ermittlungen der Hauptkommissare führen zu Elara Schmidtke, der Schwester des Mordopfers. Doch die Frau ist spurlos verschwunden.  Es gibt Hinweise darauf, dass sie an einem Prepper-Workshop teilnimmt, der von dem Überlebenstrainer Moritz Zechmann geleitet wird. Das Treffen findet an einem geheim gehaltenen Ort statt.
