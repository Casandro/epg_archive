  description: 'Sudan, der Jüngste im Stall, soll den Zoo verlassen, um in England eine eigene Familie zu gründen. Zwei Wochen haben die Nashornpfleger auf diesen Tag hingearbeitet. Nun muss alles sitzen. Für den Umzug braucht es allerlei Logistik und vor allem: starke Nerven. Das gilt sowohl für Sudan als auch für die Umzugshelfer. Schweres Gerät rollt da auf den Hof. Nun kommt es auf den jungen Bullen an. Wagt er den Schritt ins Unbekannte?'
