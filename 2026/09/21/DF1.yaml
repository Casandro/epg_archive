  title: MareTV
  subtitle: Irlands schönste Klippen - Die Cliffs of Moher
  description: 'Mattie Shannon, Chef einer Einheit der ''Irish Coast Guard'', hat viel zu tun. Seine Truppe ist in ständiger Alarmbereitschaft. Es kommt vor, dass Wanderer auf den Felsen mit dem Fuß umknicken oder einen Schwächeanfall erleiden. Das sind die harmlosen Fälle. Jedes Jahr gibt es aber auch Todesopfer an den Klippen. Dann sucht die Küstenwache manchmal zwei Wochen lang nach den Leichen. Trotz aller Gefahren liebt Mattie Shannon die steilen Cliffs. Nur er und ein paar Eingeweihte kennen den Zugang zur großen Grotte, die an wenigen Tagen im Jahr in ein geheimnisvolles Licht getaucht ist, immer dann, wenn die Sonne im perfekten Winkel steht... - Ein paar Kilometer vor den sagenumwobenen Klippen liegen die kargen Aran-Inseln im Atlantik: Inishmore, Inishmaan und Inisheer. Stiofan Joyce ist ein typischer Insulaner: er hat gleich vier Jobs, damit er sich auf Inisheer über Wasser halten kann...'
  genre:
  - '145'
  widescreen: true
  hd: true
