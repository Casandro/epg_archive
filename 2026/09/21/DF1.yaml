  title: MareTV
  subtitle: Kapstadt - Traumstadt der Tafelbucht
  description: Zwischen Tafelberg und Tafelbucht bestimmt das Meer den Lebensrhythmus. Kapstadt, einst kleiner Handelsposten am Atlantik auf halber Strecke zwischen Indien und Europa, entwickelte sich schnell zur pulsierenden Hafenmetropole. "Mothercity" nennen die Südafrikaner ihre Traumstadt am Kap noch heute. Hier werden Pinguine mit der Hand aufgezogen und Sardinen gleich schwarmweise von Land aus ins Netz getrieben. Haiwächter schlagen Alarm, wenn der "Große Weiße" am Strand auftaucht. Dann tauschen die Surfer ihre Bretter gegen Longboards und rasen auf Rollen die steile Küstenstraße hinunter... - Über die weltberühmte Küstenstraße 'Chapman's Peak Drive' erreicht man Hout Bay. Die kleine Gemeinde im Süden hat ein riesiges Problem, eine gewaltige Sanddüne! Sie wird größer und größer und wächst in den Ort hinein...
