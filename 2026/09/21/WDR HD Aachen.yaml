    Jean Pütz, geboren 1936 in Köln, besuchte die Handwerkerschule Luxemburgs, studierte Naturwissenschaften und Soziologie in Köln, wurde seiner didaktischen Fähigkeiten wegen zu einer Instanz der Populärwissenschaft.
    Mit der von ihm erfundenen "Hobbythek" avancierte er im Fernsehen zur Kultfigur - preisgekrönt, verehrt und nicht nur wegen seiner Ähnlichkeit zu Albert Einstein gerne persifliert.
