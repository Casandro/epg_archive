  subtitle: 'FICTION - Salvo e Livia stanno per trasferirsi a Genova. Una volta risolto un caso di morte apparentemente accidentale, Salvo è pronto: un''ultima nuotata nel suo mare, un ultimo addio alla casa sul lungomare'
  description: "... Ma quel pomeriggio di maggio del 1992, e quel che è successo sull'autostrada A29 per Capaci, Montalbano lo scopre quando trova Vigata ridotta a città fantasma e il commissariato ammutolito davanti alla TV, con le lacrime agli occhi. Salvo sa quello che deve fare. Anche Livia lo sa e sa anche che continuerà ad amare quest'uomo complicato e coerente... - Regia di Gianluca Maria Tavarelli\nCon Michele Riondino, Alessio Vassallo, Andrea Tidona, Fabrizio Pizzuto, Beniamino Marcone \nE con Sarah Felberbaum\nE in questa puntata Lucia Cammalleri, Claudio Castrogiovanni, Adriano Chiaramida, Roland Litrico, Roberto Mantovani, Serena Ganci, Osvaldo Livio Alzari, Alessio Piazza, Maurilio Leto, Alessandro Giuggioli, Giuseppe Santostefano, Massimo De Rossi e Luciano Messina\nUna coproduzione Rai Fiction - Palomar\n6^ ed ultima puntata\n"
