  title: Koch und Pasteur
  subtitle: Duell im Reich der Mikroben
  description: Robert Koch und Louis Pasteur - der eine Deutscher, der andere Franzose - waren schon zu Lebzeiten Legenden. Der erbitterte Wettbewerb der beiden Rivalen mit großem Ego und Nationalbewusstsein bescherte der Menschheit bahnbrechende Fortschritte im Kampf gegen Milzbrand, Tuberkulose, Tollwut, Pest, Cholera und Diphterie. Im Mittelpunkt des Dokudramas steht die ausschlaggebende Erkenntnis der Medizin, dass Krankheiten durch Keime übertragen werden können.
