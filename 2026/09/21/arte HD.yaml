  subtitle: Australien - Wenn Kunst auf Silos trifft
  description: 'Ein Projekt der Superlative: In Australien verwandeln Künstlerinnen und Künstler riesige Weizensilos in gigantische Leinwände. Es ist die größte Freiluft-Galerie der Welt, die Leben und Farbe dorthin zurückbringt, wo es immer weniger davon gab - in kleinen, fast vergessenen Ortschaften. Auch die Silos in der Stadt Goroke sollen nun einen Neuanstrich bekommen. Eine Herausforderung für Geoffrey Carran - denn auch für ihn, der sonst nur im Atelier malt, ist dieses Werk eine ganz besondere Premiere.'
