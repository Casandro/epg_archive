  title: Das schwarze Quadrat
  subtitle: Spielfilm Deutschland 2021
  description: "Die Kunstdiebe Vincent und Nils haben das berühmte russische Gemälde \"Das schwarze Quadrat\" gestohlen. Das Bild soll auf einem Kreuzfahrtschiff an den Käufer übergeben werden. Um auf das Schiff zu kommen, überwältigen sie kurzerhand zwei Passagiere. Dummerweise waren die beiden Teil des Showprogramms - und so besteht Vincents und Nils' Tarnung darin, als David Bowie- und Elvis Presley-Imitatoren aufzutreten. \nTrotz ihrer Bemühungen, nicht aufzufliegen, bekommen bald mehrere Crewmitglieder Wind von ihrer wahren Identität und ihrem wertvollen Diebesgut. An Bord entbrennt ein Katz-und-Maus-Spiel."
