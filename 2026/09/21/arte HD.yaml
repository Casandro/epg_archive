  title: Wunderstoffe (2/3)
  subtitle: Von Holz zu Bambus
  description: Die Reihe stellt neue Konzepte des Bauens altem Wissen gegenüber und fragt, wie die Städte von morgen beschaffen sein müssen, damit sie lebenswert bleiben. Überraschend dabei ist, wie viele traditionelle Werkstoffe - zum Beispiel aus Indien, Thailand und Afrika - wiederentdeckt werden. Auch Salzkristalle, Pilzkulturen und Bambus gelten als Werkstoffe der Zukunft. Eine visuell spannende Bilderreise durch die faszinierende Architektur von morgen. Im Zentrum der zweiten Folge stehen nachwachsende Baustoffe.
