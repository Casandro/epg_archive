  title: Host Dopoledne pod Ještědem
  description: 'Téma: Poúrazová péče. Fyzioterapeutka Jana Svatošová. Poúrazová péče z pohledu fyzioterapeuta není pouhým pasivním čekáním na zahojení tkání, ale aktivním a řízeným procesem obnovy kompletní funkce těla. Jak nám připomene fyzioterapeutka Jan Svatošová, cílem po úrazech nebo operacích je nejen odstranit bolest a obnovit plný rozsah pohybu, ale i vrátit pacienta do běžného života i sportu.'
