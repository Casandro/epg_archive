  description: 'Auch eine gottgleiche Gourmet-Instanz kann sich mal irren: Aus heiterem Himmel bekommt Eifel-Wirtin Toni einen Stern für ihre Kochkünste. Dabei gibt es in ihrer "Kupferkanne" nur einen Mittagstisch mit bürgerlicher Hausmannskost. Natürlich handelt es sich um einen Fehler des renommierten Restaurantführers, der den Star-Koch Rufus teuer zu stehen kommt: Ohne den prestigeträchtigen Stern droht seinem namensgleichen Gourmettempel das Aus! Als seine versnobten Stammgäste zu Tonis "Kupferkanne" umschwenken, bekommt die Wirtin kalte Füße: Im Gegensatz zu ihrer Mutter Heidi will sie den Irrtum so schnell wie möglich aus der Welt schaffen.'
