  title: Hitler und der Wolf - Rassenwahn im Dritten Reich
  subtitle: Hitler und der Wolf - Rassenwahn im Dritten Reich
  description: 'Adolf Hitler, Hermann Göring, Heinrich Himmler: Die drei bedeutendsten Führer des NS-Regimes und Hauptverantwortliche für den Holocaust legten eine fast schon bizarre Tierliebe an den Tag: In der Zoologie glaubten sie eine Rechtfertigung ihrer Rassenlehre zu finden; ein Deutscher Schäferhund an der Seite des Führers diente der Profilierung. Die Dokumentation zeigt, wie die Nationalsozialisten die Tierwelt für ihre menschenverachtende Ideologie und Propaganda missbrauchten.'
