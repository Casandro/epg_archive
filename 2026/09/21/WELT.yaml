  title: 'Gefängnisse: Mandaluyong City, Philippinen'
  subtitle: 'Gefängnisse: Mandaluyong City, Philippinen'
  description: Mandaluyong City liegt im Großraum Manila. Rund fünfundzwanzig Prozent der Einwohner der Philippinen leben in Armut. Viele Schicksale führen in die Kriminalität. Die häufigsten Straftaten sind Betrug, Prostitution und Drogen. Weibliche Straftäterinnen, die erwischt werden, landen oft in der Correctional Institution for Women, dem ältesten und größten Frauengefängnis der Philippinen. Die Bandbreite der Häftlinge reicht von Kleinkriminellen bis hin zu Mörderinnen und Gangmitgliedern.
  widescreen: true
- eventId: 1004355
  start: 2026-09-21T21:54:00Z
  stop: 2026-09-21T23:00:00Z
  title: Das Hochsicherheitsgefängnis Anamosa
  subtitle: Das Hochsicherheitsgefängnis Anamosa
  description: Mehr als tausend Häftlinge sitzen im Hochsicherheitsgefängnis Anamosa im mittleren Westen der USA ein. Kriminelle Gangs stehen hier im Fokus. Doch für keinen Schwerverbrecher gibt es ein vorzeitiges Entkommen aus der historischen Haftanstalt, die "Weißer Palast des Westens" genannt wird. Seit 60 Jahren gab es keinen Ausbruch, die Insassen werden rund um die Uhr von 200 Wärtern überwacht. Etwa 20 Prozent der Insassen wird Anamosa nie verlassen, denn sie verbüßen eine lebenslange Freiheitsstrafe.
  widescreen: true
- eventId: 1004356
  start: 2026-09-21T23:00:00Z
  stop: 2026-09-21T23:43:00Z
  title: Frauen in Russlands Gefängnissen
  subtitle: Frauen in Russlands Gefängnissen
  description: In Russland gibt es 35 Straflager für Frauen. Hinter Mauern und Sperrringen aus Stacheldraht, überwacht von Videos und Bewegungsmeldern sitzen Kleinkriminelle zusammen mit Mörderinnen ein. Mehrmals täglich kontrollieren Wachen, ob die Zäune beschädigt wurden oder jemand womöglich einen Ausbruch vorbereitet. WELT-Reporter Christoph Wanner hat einen Blick ins Innere der Lager geworfen und zeigt den Alltag der weiblichen Strafgefangenen in ihren Wohn- und Arbeitsbaracken.
  widescreen: true
- eventId: 1004357
  start: 2026-09-21T23:43:00Z
  stop: 2026-09-22T00:24:00Z
  title: Rollende Festungen - Sonderwagen der Polizei
  subtitle: Rollende Festungen - Sonderwagen der Polizei
  description: Der geschützte Transport von Einsatzkräften ist ihr wichtigster Einsatzzweck. Darüber hinaus sind Polizei-Sonderwagen auch für das Durchbrechen von Barrikaden und anderen Hindernissen konstruiert. Das aktuelle Modell ist der Survivor R. Das 340 PS starke Fahrzeug transportiert bis zu elf Personen, fährt bis zu 100 Kilometer in der Stunde und kann Steigungen von bis zu 60 Prozent bewältigen. Die Reportage stellt den Survivor R vor und blickt zurück auf die Geschichte der Sonderwagen.
  widescreen: true
