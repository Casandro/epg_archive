  title: Magda Goebbels - Fanatisch bis in den Tod
  subtitle: Magda Goebbels - Fanatisch bis in den Tod
  description: Als Gattin des Propagandaministers und Vertraute Hitlers gehörte Magda Goebbels zu den wichtigsten Personen des Dritten Reiches. In ihrer Rolle als siebenfache Mutter wurde sie als Vorbild der deutschen Frau vielfach in der Öffentlichkeit präsentiert. Wie kam es, dass sich die Stieftochter eines Juden der NS-Ideologie verschrieb? Die Dokumentation gewährt Einblicke in das Leben von Magda Goebbels und zeigt, wie aus der einst aufgeschlossenen Frau die fanatischste Anhängerin des Führers wurde.
  widescreen: true
