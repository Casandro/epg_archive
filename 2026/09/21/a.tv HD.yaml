  title: Land & Leute (Wh.)
  subtitle: Kunst, Erfindergeist und neue Ideen - unterwegs in Eggenthal
  description: 'Wir besuchen Künstler, die neue Wege gehen: Walter Bachauer hat den Meißel gegen das Schreiben eingetauscht, während Sven und Jusha Mueller sich bewusst vom klassischen Kunstmarkt abgewendet haben. In Eggenthal schauen wir außerdem ein Jahr nach der Auszeichnung als Heimatdorf darauf, welche Projekte inzwischen umgesetzt wurden - darunter eine neue Künstlerbühne und das geplante Bürgerhaus. Zum Abschluss treffen wir einen Tüftler, der seit mehr als 50 Jahren Landmaschinen weiterentwickelt und dabei bereits rund 20 Patente gesammelt hat.'
