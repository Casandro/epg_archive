  title: Aus dem Oberallgäu und Kempten (Wh.)
  subtitle: Neuer ÖPNV - Wie "Mobil 365" den Landkreis verändern soll
  description: Das lange Warten auf den nächsten Bus - Im Oberallgäu könnte das in Zukunft Geschichte sein. Mit dem Projekt Mobil 365, das 2024 erstmals öffentlich vorgestellt wurde, will der Landkreis den ÖPNV im großen Stil umbauen. Engere Taktungen, einfachere Fahrpläne und Linien, die an die Zeiten der deutschen Bahn angepasst sind. Nach schier endlosen Diskussionen ist mittlerweile klar, dass das Projekt zum Jahresbeginn 2029 in die Tat umgesetzt wird.
- eventId:
  - 908226
  - 908233
  start: 2026-09-21T03:15:00Z
  stop: 2026-09-21T03:30:00Z
  title: Aus dem Ostallgäu und Kaufbeuren (Wh.)
  subtitle: Unfälle im Ostallgäu - wo passieren sie und was geschieht danach?
  description: Wir schauen auf die Verkehrsunfallbilanz im Ostallgäu und fragen nach, warum es gerade hier besonders viele Unfälle gibt und welche Unfallstellen auffällig sind. Außerdem begleiten wir die Feuerwehr Marktoberdorf bei ihrer Arbeit und zeigen, was nach einem schweren Verkehrsunfall passiert - von der Alarmierung bis zum Einsatz. Dabei sprechen wir auch darüber, wie solche Einsätze die Helfer persönlich beschäftigen können. Zum Abschluss geht es um ältere Menschen am Steuer und die Frage, welche Präventionsmaßnahmen für mehr Sicherheit im Straßenverkehr sorgen können.
- eventId:
  - 908227
  - 908234
  start: 2026-09-21T03:30:00Z
  stop: 2026-09-21T03:45:00Z
  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: Hitze und Trockenheit setzen der Region zu - Landwirtschaft, Wasserversorgung und Fischerei stehen vor Herausforderungen
  description: 'Die heißen und trockenen Sommer machen sich zunehmend bemerkbar. Wir schauen auf die Folgen für die Landwirtschaft: sinkende Erträge, fehlendes Wasser und die Frage, wie sich die Betriebe an veränderte Bedingungen anpassen können. Außerdem geht es um die Wasserversorgung und darum, wie gut die Systeme mit hohen Verbrauchsspitzen und längeren Trockenperioden umgehen können. Auch die Fische leiden unter steigenden Wassertemperaturen und niedrigen Pegeln - wir sprechen über aktuelle Maßnahmen und mögliche langfristige Folgen für die Bestände.'
- eventId:
  - 908228
  - 908235
  start: 2026-09-21T03:45:00Z
  stop: 2026-09-21T04:00:00Z
  title: Vom Westallgäu bis zum Bodensee (Wh.)
  subtitle: Ausbildung im Allgäu - drei Betriebe, viele Wege in den Beruf
  description: Welche Chancen bietet eine Ausbildung heute und wie sieht der Arbeitsalltag von Auszubildenden aus? Wir sprechen mit der Arbeitsagentur in Kempten über die aktuelle Situation und begleiten anschließend Azubis bei Baldauf Käse in Lindenberg und bei Buhmann Systeme in Weiler. Dabei lernen wir verschiedene Ausbildungsberufe kennen - Vom Industriemechaniker über die Kauffrau im Einzelhandel bis zum Fachinformatiker für Systemintegration. Außerdem erzählen die Auszubildenden, wie sie ihren Beruf gefunden haben und wie der Einstieg ins Arbeitsleben für sie läuft.
