  title: 'Doktor Kleist - lekarz rodzinny: odc.8'
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    serial obyczajowy (Niemcy, 2004) odc.8, Fremdkörper
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser, David Bode, Teresa Weissbach, Martin Goeres, Aline Hochscheid, Alexandra Scheidt
    Nora zauważa, że z gabinetu znikają leki. Informuje o tym doktora. Nie wie, że tak naprawdę to Kleist stoi za brakami w apteczce. Lekarz przechodził ciężkie chwile. Teraz szuka sposobu na utrzymanie sprawy w tajemnicy. W przychodni zjawia się kobieta zmagająca się z dziwnymi bólami. Kleist udziela jej pomocy.
    Reżyser: Jan Bauer
    Od lat: 12
