  title: Rosamunde Pilcher - Wiatr nad rzeką 1 (odc. 41)
  subtitle: Jenny Fairburn wraca do rodzinnego domu na urodziny matki, lecz zamiast świętowania zastaje firmę na skraju bankructwa.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wind über dem Fluss
    DE, 2001
    Reżyseria: Dieter Kehler
    Występują: Floriane Daniel, Nadja Tiller, Matthias Schloo, Joachim Kretzer, Alexander Kerst, Chrissy Schulz
    Jenny Fairburn (w tej roli Floriane Daniel) wraca z Londynu do rodzinnego domu z okazji urodzin swojej matki, Anne. Konflikt: Zamiast radosnego świętowania okazuje się, że przedsiębiorstwo żeglugowe należące do matki stoi na skraju bankructwa z powodu nieuczciwości dyrektora zarządzającego. Wątek miłosny: Na miejscu na Jenny czeka jej dawny przyjaciel z dzieciństwa, Patrick (grany przez Matthiasa Schloo), który wciąż ją kocha.
