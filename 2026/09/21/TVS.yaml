  title: Wydział kryminalny Kitzbühel
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    Tytuł oryginalny: SOKO Kitzbühel
    AT,DE
    Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne. Często są w nie zamieszeni przedstawiciele wyższych sfer. Wszystko przez to, że Kitzbühel to popularne miejsce wypoczynku bogaczy. Policjanci wspierani są przez Hannesa Koflera, który wraz z hrabiną von Schönberg często sami badają poszczególne zbrodnie.
  ageRating: 12
