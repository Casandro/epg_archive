  title: Rosamunde Pilcher - Oczami miłości 1 (odc. 45)
  subtitle: Po tragicznej śmierci rodziców Caroline Page znajduje schronienie u krewnych, Paula i George'a, w rodzinnej posiadłości na angielskiej prowincji.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Mit den Augen der Liebe
    DE, 2002
    Reżyseria: Richard Engel
    Występują: Jeannette Arndt, Nick Wilder, Jonathan Engel, Horst Naumann, Rolf Becker, Christine Buchegger
    Autorka książek dla dzieci, Caroline Page, mieszka z krewnymi, Paulem i George'em, którzy przyjęli ją pod swoje ramiona po przypadkowej śmierci rodziców ponad piętnaście lat temu, na wiejskiej posiadłości rodziny. Gdy Caroline pędzi na pomoc młodemu Williamowi na konnej przejażdżce, młoda kobieta nie ma pojęcia, że jest on synem jej wielkiej miłości, Leo Waltona. Po śmierci żony Susan Leo spędza wakacje z synem w rodzinnej Kornwalii, gdzie mieszka z siostrą Pamelą.
  ageRating: 12
  genre:
  - '22'
- eventId: 866020
  start: 2026-09-21T19:50:00Z
  stop: 2026-09-21T21:35:00Z
  title: Rosamunde Pilcher - Wiatr nad rzeką 1 (odc. 41)
  subtitle: Jenny Fairburn wraca do rodzinnego domu na urodziny matki, lecz zamiast świętowania zastaje firmę na skraju bankructwa.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wind über dem Fluss
    DE, 2001
    Reżyseria: Dieter Kehler
    Występują: Floriane Daniel, Nadja Tiller, Matthias Schloo, Joachim Kretzer, Alexander Kerst, Chrissy Schulz
    Jenny Fairburn (w tej roli Floriane Daniel) wraca z Londynu do rodzinnego domu z okazji urodzin swojej matki, Anne. Konflikt: Zamiast radosnego świętowania okazuje się, że przedsiębiorstwo żeglugowe należące do matki stoi na skraju bankructwa z powodu nieuczciwości dyrektora zarządzającego. Wątek miłosny: Na miejscu na Jenny czeka jej dawny przyjaciel z dzieciństwa, Patrick (grany przez Matthiasa Schloo), który wciąż ją kocha.
  ageRating: 12
  genre:
  - '22'
