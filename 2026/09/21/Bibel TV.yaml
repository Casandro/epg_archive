  title: Ein Hauch von Himmel
  subtitle: Dem Himmel so nah
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Herz von Josie Saunders schlägt, seit sie denken kann, fürs Fliegen. So wie ihr großes Vorbild Charles Lindbergh einst den Atlantik überflog, will auch die Air-Force-Pilotin neue Hürden überwinden. Bei der NASA kann sie das - als Astronautin wird sie zum Hubble-Satelliten fliegen, um dort Reparaturen vorzunehmen. Doch kurz vor ihrem großen Flug stirbt ihre geliebte Mutter. Josie glaubte noch nie an Gott, doch damit verliert sie auch den letzten Funken Hoffnung. Als die kleine krebskranke Diana, ihr größter Fan, ihr einen Brief mitgibt, den sie im All an Gott geben soll, wirft Josie ihn weg, denn für sie ist dieser angebliche Gott ein Verräter, der ihre Mutter sterben ließ. Es ist an Monica und Tess, Josie von der Liebe des allmächtigen Vaters zu überzeugen. Als Josie im Weltall das Sicherheitsseil reißt, begegnet Monica ihr.'
