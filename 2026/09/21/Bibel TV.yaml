  title: Hour of Power
  subtitle: Der Kampf in deinem Kopf und wie du ihn gewinnst
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Bobby Schuller ist sich sicher: Ein erneuerter Geist beginnt dort, wo Gedanken nicht einfach treiben dürfen, sondern bewusst vor Gott gebracht werden. Angst, Schuld und falsche Vorstellungen über sich selbst sollen nicht das letzte Wort haben. Wer lernt, auf den Heiligen Geist zu hören, erkennt besser, welche Gedanken aus Gottes Wahrheit kommen und welche nicht. So wächst ein Denken, das beherrscht wird von Glauben, Frieden und Gehorsam.'
