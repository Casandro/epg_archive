  title: Chyba systému
  description: Vláda v návrhu rozpočtu na rok 2027 prozatím počítá se schodkem 389 miliard korun. Jak vysoký deficit je ještě v pořádku, proč se státní dluh nesplácí a co znamená řídit stát jako JZD? Speciálním hostem je ekonom a spoluautor podcastu Škrty Jan Bittner.
