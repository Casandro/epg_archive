  title: Reportáže zahraničních zpravodajů
  description: Skalický rubín, který není polodrahokam, ale víno s více než stoletou historií. Experimentální skleník v Jordánsku. Carbonarium v polském Slezsku. Nebo muzeum punku na starých veřejných záchodcích v centru islandské metropole. To jsou Reportáže zahraničních zpravodajů.
