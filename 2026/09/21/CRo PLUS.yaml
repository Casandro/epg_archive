  start: 2026-09-21T01:05:00Z
  stop: 2026-09-21T01:33:00Z
  title: Leonardo Plus
  description: Jak se vyvíjí postavení Romů v Česku? Co přispívá ke kvalitnímu vzdělávání romských dětí? Jaké příklady přístupu státu k menšinám jinde v Evropě můžou být inspirací? Hostem Leonarda Plus je Petr Torák, zakladatel britské nevládní organizace Compass, který za svou dřívější policejní práci získal řád od britské královny. Moderuje Martina Mašková.
- eventId: 1041660
  start: 2026-09-21T01:33:00Z
  stop: 2026-09-21T02:00:00Z
  title: Žárovky
  description: Mladí vědci a vědkyně mění svět: Proč je tvar nanovláken důležitý při interakci s mikroorganismy? A leží budoucnost našich jídelníčků opravdu v laboratoři? To prozradí mikrobioložka Simona Peroutková. Moderuje Pavla Hubálková.
- eventId: 1041661
  start: 2026-09-21T02:00:00Z
  stop: 2026-09-21T02:05:00Z
  title: Zprávy
  subtitle: Aktuální události doma i ve světě
- eventId: 1041662
  start: 2026-09-21T02:05:00Z
  stop: 2026-09-21T02:33:00Z
  title: Laboratoř
  description: Jak houby ovlivňují rozšíření zvířat? Které houby přítahují nepůvodní stromy v českých zámeckých parcích? Proč je důležité nekácet baobaby? Debatují rostlinný biolog Viktor Žárský, půdní ekolog Petr Kohout a student Jiří Hermann. Moderuje Martina Mašková.
- eventId: 1041663
  start: 2026-09-21T02:33:00Z
  stop: 2026-09-21T03:00:00Z
  title: Osobnost Plus
  description: Anna Marešová, designérka. S láskou na Petřín - tímhle sloganem zve umělkyně na slavnostní otevření nové lanovky na pražský Petřín. Jak se navrhuje lanovka a co nového návštěvníkům nabídne? A proč podle ní někdy designér nejvíc pomůže světu tím, že něco nenavrhne? Moderuje Světlana Witowská.
