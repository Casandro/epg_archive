  description: 'o che ci circonda e delle sue regole. In questa puntata ci occupiamo di Ormoni. Ossitocina, Adrenalina, Dopamina. Sono tutti ormoni. Il nome deriva dal verbo greco ormao "mettere in movimento" ed è questo che fanno gli ormoni: mettono in movimento l''organismo e trasportano informazioni. Questi importantissimi messaggeri ci aiutano ad adattarci al mondo esterno. Ne parliamo in studio con Maria Marino, Professoressa di Fisiologia al Dipartimento di Scienze dell''Università di Roma Tre e con Ilenia Papa, ricercatrice dall''Australian National University di Camberra. All''IIt di Genova scopriamo il funzionamento della serotonina e Anna Pancaldi ci racconta le scoperte scientifiche sugli ormoni dei secoli scorsi: tra adrenalina ed elisir anti-età. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
