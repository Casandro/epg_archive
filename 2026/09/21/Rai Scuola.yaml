  title: Progetto Scienza 2023 Prospettive - Scie
  subtitle: 'Progetto Scienza 2023 Prospettive - Scienziati Misconosciuti p. 6 - La storia della scienza è piena di persone molto importanti che non sono mai diventate famose: a volte per sfortuna o mancanza di mezzi, '
  description: 'altre volte perché qualcuno ne ha rubato o sfruttato le scoperte senza riconoscergliene il merito. Alcuni di questi scienziati dimenticati hanno raggiunto notorietà e gloria dopo decenni e, spesso, dopo la propria morte. In questa puntata di "Prospettive", la giornalista scientifica Silvia Bencivelli racconta le vicende di cinque scienziati misconosciuti che ci hanno fatto progredire nella conoscenza del nostro mondo. Con lei, gli esperti: Alessandro Volpone, storico della scienza dell''Università di Bari, Mauro Capocci, storico della scienza dell''Università di Siena, Matteo Cerri, neurofisiologo dell''Università di Bologna e Isabella Saggio, genetista della Sapienza Università di Roma. "Prospettive" è il programma scientifico di Progetto Scienza di Rai Cultura che in ogni puntata ci presenta le scoperte, le invenzioni, le idee di scienziati famosi e misconosciuti che con le loro teorie e i loro esperimenti hanno cambiato il mondo in cui viviamo e ci hanno aiutato a capirlo meglio. Gli episodi narrati in ogni puntata sono parte del patrimonio di conoscenza e progresso scientifico ma raccontano anche le vicende e la natura di quegli esseri umani che guardando il cielo o le profondità della Terra, il dito che indica la Luna e anche la Luna, sono riusciti ad ampliare il nostro orizzonte. - un programma di Silvia Bencivelli, Daniela Mazzoli con la collaborazione di Fiorella Cappelli, Diego Garbati, Pierluigi Pantini; a cura di Eleonora Ottaviani; capo progetto Diego Garbati; regia Pierluigi Pantini; conduce Silvia Bencivelli un programma di Silvia Bencivelli, Daniela Mazzoli con la collaborazione di Fiorella Cappelli, Diego Garbati, Pierluigi Pantini; a cura di Eleonora Ottaviani; capo progetto Diego Garbati; regia Pierluigi Pantini; conduce Silvia Bencivelli'
