  title: Memex Nautilus - Buchi neri, non più osc
  subtitle: Memex Nautilus - Buchi neri, non più oscuri - Nautilus è il programma di informazione e approfondimento scientifico di Rai Cultura. Con l'astrofisico e divulgatore Luca Perri andiamo alla scoperta del mon..
  description: 'o che ci circonda e delle sue regole. In questa puntata parliamo degli oggetti più enigmatici, inafferrabili e misteriosi dell''Universo: i Buchi Neri. Ospiti in studio il ricercatore dell''Osservatorio di Brera dell''Inaf, Gabriele Ghisellini, e l''astrofisico della Specola Vaticana, uno dei più antichi osservatori del mondo, padre Gabriele Gionti. All''Istituto di Astrofisica di Bologna incontriamo le due ricercatrici italiane Elisabetta Liuzzo e Kazy Rigl, che ci spiegano come si cerca un Buco Nero e in che modo hanno collaborato con il team internazionale che ne ha realizzato la prima storica foto. Anna Pancaldi ci porta poi indietro di 250 anni per presentarci il marinaio inglese e il padre anglicano che intuirono per primi l''esistenza dei buchi neri. E ci racconta infine della disputa tra due giganti della scienza del Novecento, John Archibald Wheeler e Stephen Hawking, attorno ad una questione piuttosto curiosa: se i buchi neri abbiano o non abbiano peli e capelli. - un programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi'
