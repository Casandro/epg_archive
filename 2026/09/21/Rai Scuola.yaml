  description: ontra alcuni tra i maggiori esperti del mondo della ricerca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna alla scoperta dei robot che lavorano nel mondo della manifattura e dell'industria. Forse non hanno le sembianze degli androidi positronici, inventati dalla fantasia di Isaac Asimov, ma robot è anche una sega elettrica, una pialla, un braccio meccanico, un robot collaborativo, un drone. Protetti da una gabbia perimetrale o liberi di muoversi a stretto contatto con l'uomo, oggi i robot svolgono un ruolo chiave nel processo produttivo. Ci raccontano la loro esperienza e le loro ricerche Barbara Caputo, che al Politecnico di Torino sta riscrivendo il paradigma "robot" integrando meccanica e intelligenza artificiale; Bruno Siciliano, ordinario di automatica all'Università di Napoli Federico II, una bibbia della robotica industriale; Luca Salgarelli che, con la sua startup a Brescia, sta "liberando" dalle gabbie i robot di linea; Orlando Tovar che al CIM 4.0 ha inaugurato la linea pilota Digital Factory; Alessio Degani, ingegnere delle telecomunicazioni; Daniele Pillan, ingegnere elettrico; e Tatiana Tommasi, fisico e ingegnere del Politecnico di Torino. - un programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati reg