  subtitle: 'Progetto Scienza 2023 Racconti di Scienza - p. 02 - Starlight - Dal Festival della scienza di Genova: Starlight, settemillimetridiuniverso - scritto e interpretato da Filippo Tognazzo. Starlight, settemill'
  description: 'imetridiuniverso è lo spettacolo prodotto da Zelda compagnia teatrale professionale in collaborazione con l''Istituto Nazionale di Astrofisica. Narra la nascita dell''astrofisica in Italia attraverso il racconto della vita e delle ricerche di alcuni fra i più importanti scienziati del XIX secolo: Giuseppe Lorenzoni, Pietro Tacchini, Angelo Secchi, Lorenzo Respighi, Giovan Battista Donati, Arminio Nobile. Lo spettacolo rappresenta anche un''occasione per offrire uno sguardo nuovo sulla storia d''Italia fra il Risorgimento e la Grande Guerra, raccontata attraverso le vicissitudini e la passione di uomini che hanno trovato nella ricerca scientifica e nell''astronomia la loro ragione di vita. - Un programma di Diego Garbati e Daniela Mazzoli, a cura di Eleonora Ottaviani, capo progetto Diego Garbati, regia Alberto Polimanti, conduce Anna Pancaldi'
