  title: Progetto Scienza Newton (pt. 25 )"Mutazi
  subtitle: Progetto Scienza Newton (pt. 25 )"Mutazioni genetiche e evoluzione" - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita Telmo P
  description: 'ievani, filosofo della scienza ed evoluzionista, prorettore dell''Università di Padova. Assieme ci conducono alla scoperta delle mutazioni genetiche che hanno caratterizzato l''evoluzione della vita: dai primi organismi all''essere umano. Telmo Pievani svela gli errori genetici che hanno portato allo sviluppo delle specie viventi a partire da un unico antenato comune di nome L.U.C.A. (Last Universal Common Ancestor) fino ad oggi e con uno sguardo rivolto al futuro. L''antropologo molecolare David Caramelli mostra inoltre gli studi sulle mutazioni genetiche che vengono effettuati nel centro di ricerca del Dipartimento di Biologia all''Università di Firenze sulle ossa dei primi uomini. Pietro Greco infine ci racconta di quando Gregor Mendel prese una scorciatoia verso il successo. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga.'
