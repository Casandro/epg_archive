  title: Progetto Scienza STEM - p. 10 - Cibo
  subtitle: Progetto Scienza - STEM è il programma di informazione e approfondimento scientifico di Rai Cultura. Il divulgatore scientifico Davide Coero Borga incontra alcuni tra i maggiori esperti del mondo della ricerca
  description: 'e dell''innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga compie un viaggio alla scoperta di un tema di estrema attualità: il cibo. Dalla carne, ai cereali, all''acquacoltura, agli insetti, anche il cibo parla con il linguaggio delle displine STEM. Per farlo, incontra Sebastiana Failla, dirigente di ricerca al Centro "Zootecnia e Acquacoltura" del Consiglio per la Ricerca in Agricoltura e l''Analisi dell''Economia agraria a Monte Rotondo, vicino Roma, il genetista agrario Salvatore Ceccarelli, già docente di genetica agraria e oggi consulente presso un''organizzazione di ricerca per lo sviluppo (Bioversity International), Fabrizio Capoccioni, biologo e ricercatore al Centro di ricerca "zootecnia e acquacoltura" del Consiglio per la ricerca in agricoltura e l''Analisi dell''economia agraria di Monte Rotondo, Giulia Maffei, biologa esperta di entomofagia, appassionata di insetti e fondatrice, insieme a Giulia Tacchini, di Entonote, appassionata di insetti e fondatrice, Laura Gasco - ordinario di Zoocolture dell''Università di Torino e Responsabile della sezione Produzioni Animali al Centro Sperimentale di Tetto Frati, a Carmagnola (Torino). - un programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicolett'
