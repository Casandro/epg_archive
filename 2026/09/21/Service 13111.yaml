  title: TM Wissen
  subtitle: Technik, die bewegt - Wie Gelähmte wieder Fahrrad fahren und mehr
  description: Cedric Kapfenberger liebt das Motorradfahren. Dann hat er einen Unfall und sitzt im Rollstuhl. Jetzt tritt er wieder selbst in die Pedale - dank einer neuen Technik. Der Wiener Wissenschaftler und Ingenieur Dr. Martin Schmoll entwickelt ein Spezialrad, das mit Elektroden Cedrics Beinmuskeln aktiviert. Die Steuerung läuft über den Lenker. Damit wirkt Cedric nicht wie ein Rollstuhlfahrer, sondern wie jeder andere Radler. Eine Entwicklung, die Leben zurückgibt - und neue Wege öffnet // Hoch oben in den Tiroler Alpen entsteht das neue Pumpspeicherkraftwerk Kühtai. Auf 2.000 Metern Höhe stellen sich Menschen und Maschinen den Herausforderungen von Fels, Kälte und Zeitdruck. Das Kraftwerk soll die Energieversorgung Österreichs absichern und überschüssigen Sommerstrom im Winter verfügbar machen // Klettern ist mehr als Sport - es hilft auch der Seele. Therapeutisches Klettern kann daher Menschen mit Depressionen Schritt für Schritt aus dem Tief heraushelfen. Denn beim Suchen nach dem nächsten Griff bleibt kein Raum für Sorgen oder Grübeln.Österreich 2025
