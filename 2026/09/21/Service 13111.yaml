  description: 'Er gilt als härtester Team-Wettbewerb der Welt: Zum insgesamt 38. Mal ging jüngst wieder der legendäre Red Bull Dolomitenmann in Szene. Für die teilnehmenden Teams ging es in den Disziplinen Berglauf, Paragleiten, Mountainbiken und Kajakfahren quer durch die gnadenlose Berglandschaft Osttirols.Österreich 2026'
