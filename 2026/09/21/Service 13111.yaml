  title: Große Erfindungen
  subtitle: Glas
  description: |-
    Glas ist das erste Material, das jemals von einem Menschen künstlich hergestellt wurde! Es hat viele verschiedene Bereiche revolutioniert: die Architektur, verschiedene Technologien, die Industrie, die Kunst. Glas ist ein Material, das quasi überall zu finden ist, angefangen beim Mobiltelefon, bis hin zum Wohnhaus, in dem wir leben.
    Von der trüben schmutzigen Perle zum Hightech-Material der Zukunft hat es 4000 Jahre gedauert. Kaum ein anderes Material ist so vielseitig, so wandelbar! Dabei war Glas jahrhundertelang so wertvoll wie Gold und kaum zu bezahlen. Von den ersten Glas-Erfindungen in Mesopotamien bis hin zum Zukunftsmaterial Glas heute, das dünner ist als ein menschliches Haar und nicht zerbricht oder das die virtuelle mit der realen Welt zusammensetzen kann: Das Material Glas ist noch lange nicht am Ende seiner Entwicklungsgeschichte angekommen!
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Jennifer Gesslein
