  title: Dim u boci
  subtitle: Počelo je sa "per fumum" a danas "prolazimo" kroz mirisne oblake najrazličitijih mirisnih nota. Parfem nije ukras. On je trag. Potpis vremena. Istorija čoveka u jednoj bočici. I oduvek fascinira.
  description: Počelo je sa "per fumum" a danas "prolazimo" kroz mirisne oblake najrazličitijih mirisnih nota. Parfem nije ukras. On je trag. Potpis vremena. Istorija čoveka u jednoj bočici. I oduvek fascinira. Koristi se hiljadama godina u svim kulturama, ali se njegova uloga, simbolika i značenje razlikuju. Od rituala drevnih kultura do savremenog luksuza - parfem je oblikovao religiju, medicinu, ljubav, ratove i modu. Vrhunski parfem-majstori uspevaju da u kapi parfema dočaraju ceo jedan daleki svet ili neki specifičan trenutak. A ta kap je najintenzivnija forma sećanja. I zato parfem nije samo lep miris. On je nauka koju nosimo na koži. Nova serija Redakcije naučnog programa, Dim u boci, otkriva nauku skrivenu iza sveta parfema.
- eventId: 1005415
  start: 2026-09-21T12:15:00Z
  stop: 2026-09-21T12:27:00Z
  title: Da li znaš
  subtitle: 'Ako ste se ikada zapitali: da li je moguće izračunati kako da se iz penala uvek postigne gol, zašto na planeti ima više desnorukih ljudi, da li žene govore više od muškaraca, zašto iste boje vidimo.'
  description: 'Ako ste se ikada zapitali: da li je moguće izračunati kako da se iz penala uvek postigne gol, zašto na planeti ima više desnorukih ljudi, da li žene govore više od muškaraca, zašto iste boje vidimo različito, ove i mnoge druge odgovore, na pitanja iz svakodnevnog života, čućete u novom serijalu - "Da li znaš?". Radoznalost je "bolest" svih odraslih ljudi i savremenog doba a, kroz radoznalost se mnogo toga i uči. Novi serijal "Da li znaš" je petominutna igrana struktura koja nam daje odgovore na pitanja iz naše svakodnevice. Namenjena je svim generacijama, od predškolaca do penzionera.'
