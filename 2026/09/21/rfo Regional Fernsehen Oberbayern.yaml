  subtitle: Das Rosenheimer Herbstfest 2026 - Ein Rückblick auf die Highlights +++ 2 Hornissenstiche und plötzlich im Krankenhaus
  description: Nach dem Ende des Rosenheimer Herbstfests am Sonntag läuft seit Montag der Abbau, während die Schausteller weiterziehen, teils Richtung Oktoberfest, und wir auf 16 Tage mit Einzug, RFO Live aus dem Tatzlwurm, Auf an Pfiff und Feuerwerk zurückblicken. +++ Bei einem Spaziergang nahe Naring in Feldkirchen-Westerham geriet Uwe Baumer nach zwei Hornissenstichen ohne bekannte Allergie in Lebensgefahr, seine Frau alarmierte den Notruf, sogar ein Notarzt wurde gestochen, doch Baumer geht weiter spazieren und trägt nun EpiPens.
- eventId: 849383
  start: 2026-09-21T09:45:00Z
  stop: 2026-09-21T10:00:00Z
  title: Süd Blick Teil 5 (Wh.)
  subtitle: Auf ein Gespräch mit BMW-Open-Sieger Jakob Schnaitter und Mark Wallner +++ Auf ein Gespräch mit Markus Schrör - Wenn Schwimmen zur Gemeinschaft wird
  description: 'Neben US-Open-Sieger Alexander Zverev rückt das bayerische Doppel Jakob Schnaitter und Mark Wallner ins Rampenlicht: Als SchnaWall gewannen sie die BMW Open, wofür Schnaitter in Wasserburg geehrt wurde und nun über Ziele spricht. +++ Seit acht Jahren vernetzt der Arena Alpen Open Water Cup Freiwasser-Events in Südostbayern und Österreich; Organisator Markus Schrör betont Gemeinschaft und Naturerlebnis, plant weiteres Wachstum samt Vollmondschwimmen in größeren Städten und will den familiären Charakter bewahren.'
- eventId: 849384
  start: 2026-09-21T10:00:00Z
  stop: 2026-09-21T10:10:00Z
  title: Süd Blick Teil 1 (Wh.)
  subtitle: Steuerliche Entlastung für Vereine +++ Wolfabschuss in Berchtesgaden erlaubt +++ Verlängerung der Grenzkontrollen tritt in Kraft +++ Bauernherbst Auftakt am Chiemsee
  description: 'Bayern hat am 8. September eine Bundesratsinitiative beschlossen, die gemeinnützige Vereine steuerlich entlasten und Bürokratie senken soll, etwa durch höhere Freibeträge und vereinfachte Erklärungen, braucht dafür aber die Zustimmung des Bundes. +++ In Bayern entfacht die Rückkehr des Wolfs eine hitzige Debatte: Nach einer Gesetzesänderung sind Schutzmaßnahmen für Weidetiere leichter möglich, im Extremfall auch ein Abschuss, was im Berchtesgadener Land trotz nur einer Sichtung Naturschützer und Landwirte beschäftigt. +++ Die Grenzkontrollen bleiben: Seit heute gilt die angekündigte Verlängerung um weitere sechs Monate. Für den Grenzverkehr zwischen Bayern und Österreich heißt das weiterhin: Kontrollen, Wartezeiten und immer wieder Staus. Besonders betroffen sind Übergänge wie der Walserberg und Freilassing. +++ Nach dem Rosenheimer Herbstfest beginnt die zweite Tradition: Der Rosenheimer Bauernherbst ist zum 24. Mal in Bernau beim Chiemseefischer Lackerschmid eröffnet worden, mit Landrat Otto Lederer, Kreisbäuerin Kathi Kern und vielen Erzeugern, im Fokus regionale Spezialitäten.'
- eventId: 849385
  start: 2026-09-21T10:10:00Z
  stop: 2026-09-21T10:20:00Z
  title: Süd Blick Teil 2 (Wh.)
  subtitle: Flüchtlingsheim in Feldkirchen Westerham wird bezogen +++ Hornissenstiche lösen Großeinsatz aus +++ Polizeikontrollen zum Schulstart +++ Sicher zur Schule - Sicher nach Hause im BGL
  description: In Feldkirchen-Westerham sind Anfang September 41 Geflüchtete, darunter Familien und ältere Ukrainer, in ein neues Quartier an der Walter-Gessner-Straße gezogen; die Gemeinde unterstützt mit Willkommensflyer, kleinteiligen Einheiten und Betreuung. +++ Beim Spaziergang nahe Naring in Feldkirchen-Westerham geriet Uwe Baumer nach zwei Hornissenstichen ohne bekannte Allergie in Lebensgefahr, wurde nach Notruf im Wald gefunden, sogar ein Notarzt gestochen, doch Baumer bleibt gelassen und trägt nun zwei EpiPens. +++ Mit dem Schulstart der Erstklässler wächst bei vielen Eltern die Sorge um den Schulweg, denn gerade zu Beginn sind Kinder im Verkehr schwer einschätzbar. Deshalb kontrolliert die Polizei Autofahrer rund um Schulen verstärkt und berichtet von ersten Auffälligkeiten. +++ Im Zuständigkeitsbereich des Polizeipräsidiums Oberbayern-Süd gab es im Vorjahr 56 Schulwegunfälle mit 56 verletzten Kindern, beide Werte sanken, doch die Aktion Sicher zur Schule, sicher nach Hause bleibt wichtig und wird im Berchtesgadener Land zum Schulstart jeweils an einer Grundschule.
- eventId: 849386
  start: 2026-09-21T10:20:00Z
  stop: 2026-09-21T10:30:00Z
  title: Süd Blick Teil 3 (Wh.)
  subtitle: SPD erinnert in Freilassing an Karl Rittmann +++ Freestyleeinrad fahren in Gars
  description: Die SPD Freilassing erinnerte im Rathaussaal mit einem Festakt an Altbürgermeister Karl Rittmann zum 150. Geburtstag, der 1919 bis 1933 sowie 1946 bis 1947 Salzburghofen und Freilassing führte und von den Nazis entmachtet und dreimal inhaftiert wurde. +++ Das Garser Einrad-Freestyle-Team peilt im Herbst bei der Süddeutschen Meisterschaft erstmals die Qualifikation für die Deutsche Meisterschaft an, trainiert dafür derzeit intensiv und wurde von uns dabei begleitet.
