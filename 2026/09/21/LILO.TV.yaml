  title: So schmeckt die Welt - Saft
  subtitle: So schmeckt die Welt - Saft
  description: Trotz Hightec und Industrie, Deutschland ist ein Agrarland. Rund die Hälfte unserer Fläche wird landwirtschaftlich genutzt und hiervon sind 70 % Ackerland. Und die deutschen Landwirte sind nicht nur produktiv sondern auch kreativ. Und, Es schmeckt was in der Erde steckt ob auf dem Teller oder auch im Glas. Die Vielfalt unserer Produkte spiegelt sich auch in den Säften wieder. Nahezu jedes Obst oder Gemüse lässt sich als Saft oder Limonade verarbeiten. Von der Rosenblüte bis hin zum Sellerie.
