  title: Von Herzen mit Mutter Angelica - Staffel II
  subtitle: Moralische Werte und die Keile des Feindes
  description: In dieser Katechese spricht Mutter Angelica über Moral und Werte und wie sich diese in der heutigen Welt verändert haben. Das verdeutlicht sie mit dem ihr eigenen großen Humor an Hand von vielen Beispielen.Was früher verwerflich war scheint heute fast normal. Es fängt oft mit ganz kleinen Vergehen an und die werden dann zur Gewohnheit. Aber wie lassen sich diese kleine Schwächen in Jesus verwandeln? Der einzige Weg, eine Entscheidung für den Herrn zu treffen, ist die Entscheidung gegen das Vergehen und für das Gegenteil.
