  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Der Fußboden des Himmels- Vom zweiten Geheimnis des glorreichen Rosenkranzes
  description: Auf dem Kamm des Ölberges befindet sich der überlieferte Ort der Himmelfahrt Jesu. Nachdem Jesus seinen Jüngern und seiner Mutter mehrmals leibhaftig erschienen ist, verabschiedet er sich vierzig Tage nach seiner Auferstehung von seinen Jüngern und erhebt sich vor ihren Augen in den Himmel. Dabei kündigt er die Herabkunft des Heiligen Geistes an. Paul Badde folgt den Spuren Jesu im Heiligen Land.
  widescreen: true
- eventId: 1061008
  start: 2026-09-21T23:00:00Z
  stop: 2026-09-21T23:30:00Z
  title: GRANDIOS (4. Staffel)
  subtitle: Christian Heiß
  description: '"Musik ist die Sprache, die direkt ins Herz geht" sagt Domkapellmeister Christian Heiß zu GRANDIOS. Bei den Regensburger Domspatzen geschieht Glaubensvermittlung auf ganz natürliche und zwanglose Weise über die Musik. Christian Heiß fördert die Talente seiner Schülerinnen und Schüler, welche oft über die musikalische Begabung hinaus gehen. Doch dafür ist es wichtig, eine persönliche Beziehung zu jedem Einzelnen aufzubauen. Für ihn war immer klar, was er beruflich weitergeben will: die Freude am Glauben, vermittelt über die Musik.'
  widescreen: true
- eventId: 1061009
  start: 2026-09-21T23:30:00Z
  stop: 2026-09-22T00:00:00Z
  title: VATICANO - Das EWTN Nachrichtenmagazin aus Rom
  subtitle: Die Bewahrung der Schöpfung
  description: |-
    Diese Woche bei Vaticano:
    Ein Jahr nach seiner Einweihung besuchen wir den Borgo Laudato Si' und zeigen, wie die Prinzipien der Enzyklika Laudato Si' dort in die Praxis umgesetzt werden. Anschließend blicken wir auf die globale Arbeit des Malteserordens und sprechen mit dem Augustinerpater John Abubakar über die Papst-Leo-XIV.-Nachhaltigkeitsmedaille. Schließlich werfen wir einen Blick in die Vatikanischen Gärten und treffen die Menschen, die diese historischen Anlagen pflegen und ihren Wandel hin zu einer ökologischen Bewirtschaftung vorantreiben.
  widescreen: true
