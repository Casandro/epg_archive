  stop: 2026-09-21T09:00:00Z
  title: Maria - Zwischen Himmel und Erde
  subtitle: Maria in der Neuzeit II
  description: In der 11. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup ebenfalls über Maria in der Neuzeit. Gegen Ende der Neuzeit hat es viele Erscheinungen Mariens gegeben. Ich nenne nur La Salette, Lourdes, Fatima und Medjugorje, die große Bekanntschaft erlangt und viele Bekehrungen erzeugt haben. Es ist, als ob Maria den Descartes umkehren wollte, der zu Anfang der Neuzeit den Menschen zum Meister und Besitzer der Natur machen wollte. Das hat nicht geklappt. Aber zum Meister der Gnade kann Maria den Menschen machen.
