  description: Norbert Schlegel erzieht seinen Sohn Tim allein. Die Mutter hat die beiden vor einem Jahr verlassen und kümmert sich kaum noch um ihren Sohn. Norbert ist seitdem misstrauisch und vereinsamt. Als Norbert die Wohnung für kurze Zeit verlässt, beginnt Tim mit seinem Chemiebaukasten zu experimentieren. Es kommt zu einem Unfall, bei dem der Junge am Unterarm Verbrennungen zweiten Grades erleidet. Tim wird von der Nachbarin Carola Grund gerettet. Der Junge verbringt mitunter bei Carola seine freien Nachmittage, wenn sein Vater noch arbeitet. Als Norbert davon erfährt, ist er alles andere als begeistert.
