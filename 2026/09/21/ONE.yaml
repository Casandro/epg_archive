  title: The United States vs. Billie Holiday
  subtitle: Spielfilm USA 2021
  description: |-
    Ausstrahlung auch im englischen Originalton

    Zur Zeit der Rassentrennung Ende der 1930er-Jahre in den USA: Das Elend ihrer Jugend hinter sich gelassen, ist Billie Holiday (Andra Day) zu einer der erfolgreichsten Jazzsängerinnen der Welt aufgestiegen.

    Der Regierung jedoch ist die gefeierte "Lady Day" ein Dorn im Auge - nicht zuletzt wegen ihres kraftvollen Protestsongs "Strange Fruit", in dem sie offen die rassistisch motivierten Lynchmorde anprangert, die in den Südstaaten begangen werden.
