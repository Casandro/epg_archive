  title: Die da unten
  description: 'Unterwegs zwischen Kiosk, Kleingarten und Campingplatz: Nur wenige Monate vor der Landtagswahl in Mecklenburg-Vorpommern am 20. September 2026 ist die Stimmung hier bei einigen Menschen enttäuscht, frustriert, sogar verbittert. Frust auf "die da oben" ist nicht nur Populismus: Der Elitenforscher Michael Hartmann beschreibt ein stabiles "oben" in Wirtschaft, Justiz und Politik, das bestimmt, wie es in Deutschland weitergeht. Diese Ungleichheit gefährde so die Demokratie. Wer muss sie reparieren? Die "da oben" oder die "da unten"?'
  widescreen: true
