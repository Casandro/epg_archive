  title: Abschied von Deutschland
  description: Immer mehr Polen verlassen Deutschland, während weniger neu hinzukommen. Lange galt Deutschland als attraktiver Arbeits- und Lebensort - doch für viele verändert sich die Rechnung. Die Reportage zeigt, warum polnische Arbeitskräfte Deutschland verlassen, was sie nach Polen zurückzieht und welche Folgen das für deutsche Unternehmen hat.
