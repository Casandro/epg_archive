  title: Der XXL-Tunnelbohrer unter der Elbe
  subtitle: Arbeiten für die Energieversorgung von morgen
  description: Eine 730 Tonnen schwere Tunnelbohrmaschine hat sich auf einer Strecke von 5,2 Kilometern unter der Elbe fast bis nach Niedersachsen vorgearbeitet. Der Tunnel ist ein wichtiger Abschnitt des SuedLink-Projekts und soll künftig Windstrom aus dem Norden in den Süden Deutschlands transportieren. Der Durchbruch in Niedersachsen ist ein entscheidender Meilenstein - doch damit ist der Tunnelbau noch nicht abgeschlossen. "Die Nordreportage" begleitet die Verantwortlichen während der Bauphase.
