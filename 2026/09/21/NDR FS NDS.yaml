  description: 'Die Hermanssons, eine schrecklich nette Familie, treffen sich im schwedischen Ort Kymlinge zu einer Geburtstagsfeier. Am nächsten Morgen ist ihr Sohn Walter, seit einem obszönen Fernsehauftritt landesweit bekannt, spurlos verschwunden. Kurz darauf wird auch der Vorzeige-Enkel Henrik vermisst. Gunnar Barbarotti übernimmt den Fall, doch trotz seiner unkonventionellen Ermittlungsmethoden kommt der Inspektor nicht voran. Erst Monate später taucht Walters Leiche auf, nur von Henrik fehlt noch immer jede Spur. Barbarotti kommt ins Grübeln: Gibt es zwischen beiden Fällen überhaupt einen Zusammenhang?'
