  title: NDR Story - Wem gehört das Ackerland?
  subtitle: Der Preiskampf um den Boden
  description: 'Die Preise für Ackerland gehen in Norddeutschland seit Jahren steil nach oben, denn die Nachfrage nach Boden ist riesig. Erzeuger erneuerbarer Energien benötigen Flächen, für Bauprojekte müssen Ausgleichsflächen her. Und: finanzstarke Investoren sehen Boden offenbar als sichere Kapitalanlage. Doch was bedeutet das für die Landwirte, die auf dem Boden wirtschaften? Wird der Acker für sie bald unbezahlbar? Die NDR Autoren Lennart Banholzer und Simon Hoyme haben zwischen Weser und Oder exklusive Einblicke in die Besitzverhältnisse der regionalen Landwirtschaft recherchiert.'
