  title: Passato e presente - Simone Boccanegra i
  subtitle: 'Passato e presente - Simone Boccanegra il doge di Genova - ''''È sogno!...sì, spaventoso, atroce sogno il mio!'''' Il sogno è di Simon Boccanegra. Un''esclamazione che si addensa nell''atmosfera cupa dell''opera '
  description: "omonima di Giuseppe Verdi. Nella Genova di inizi 300, fervono le lotte tra patrizi e Plebei. Genova è una delle città più ricche e influenti d'Europa, Una potenza marittima e commerciale che, da dominatrice del Mediterraneo, è nel pieno del suo splendore. Una vera ''nazione globale'' ante litteram. Ma, la diarchia di ''Capitani del popolo'' che governa la città sta perdendo il controllo e quando cercano di imporre un nuovo ''abate del Popolo'' senza il consenso dei cittadini, il malcontento popolare esplode. È il 1339 e il popolo reclama una guida che non appartenga alla nobiltà. Quella guida è il plebeo Simone Boccanegra, membro d'una famiglia mercantile. Il popolo lo invoca come nuovo Abate e lo acclama Doge, un titolo che a Genova non esisteva. E' il primo doge di Genova e rappresenta il volto di una città potente ma divisa, sospesa tra ambizione politica, conflitti interni e apertura sul mondo. Un personaggio che nell'opera di Verdi diventa non solo un governante ma un uomo solo, consumato dal potere e attraversato da un desiderio quasi impossibile di pace e riconciliazione. Una figura estremamente moderna che Passato e Presente racconterà andando sui luoghi della Genova medievale con Maria Sole Sanasi. In studio con Paolo Mieli il professor Antonio Musarra. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio il prof. Antonio Musarra \nCon la partecipazione di Maria Sole Sanasi \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
- eventId: 1027571
  start: 2026-09-21T19:15:00Z
  stop: 2026-09-21T20:00:00Z
  title: 'Viaggio in Siciliaì.Catania tra acqua e '
  subtitle: 'Viaggio in Siciliaì.Catania tra acqua e fuoco - Il viaggio della scrittrice Simonetta Agnello Hornby e del suo amico illustratore Massimo Fenati prosegue verso Catania. Prima emozionante tappa: l''Etna e i..'
  description: suo paesaggio lunare. Ai piedi dell'Etna, spostandosi sul versante sud-est, Simonetta e Massimo raggiungono l'antico palmento di storici produttori di vini dell'Etna e scoprono antichi riti e tradizioni dei viticoltori della zona. Il fuoco e l'acqua caratterizzano la città di Catania. Simonetta e Massimo ritrovano questi due elementi nelle strade del centro storico. - Con Simonetta Agnello Hornby e Massimo Fenati
