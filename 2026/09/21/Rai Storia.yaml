  title: Che magnifica impresa.La pasta
  subtitle: 'In questa puntata si parla di pasta, da ieri ad oggi. Simbolo della cultura gastronomica italiana, la pasta rappresenta non soltanto qualcosa che ci identifica ma, nei decenni, è diventata anche uno dei prodotti di '
  description: "più ampio export dell'industria italiana. La sua importanza per l'economia del Paese non è seconda alla sua riconoscibilità e il motivo di tutto questo è la sua grande storia. Ospiti di puntata: Massimo Montanari, Margherita Mastromauro e Marisa Laurito. - Conduce Mario Sechi\nDi Mario Sechi, Enrico Salvatori Clemente Volpini e di Roberto Fagiolo, Fabrizio Marini e Gian Maria Tavanti; Coordinamento editoriale Anna Lisa Guglielmi\nRegia Claudio Del Signore  \nScritto con Roberto Fagiolo, Fabrizio Marini, Gian Maria Tavanti e con Elena Milani, \nA cura di Lucia De Angelis, \nProduttore esecutivo Germana Mudanò"
