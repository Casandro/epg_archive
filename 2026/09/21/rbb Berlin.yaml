  subtitle: Der Junggesellenabschied
  description: |-
    Ben Ahlbeck hatte einen denkbar schlechten Start mit seiner Schwiegermutter Badri Sherbaz. Als diese nun voll des Lobes über Leylas Exmann aus London zurückkehrt, entschließt sich Leyla zur schonungslosen Ehrlichkeit. Das Paar eröffnet Badri, dass sie heiraten werden. Doch damit nicht genug, denn Badri erleidet unmittelbar danach einen Herzinfarkt.

