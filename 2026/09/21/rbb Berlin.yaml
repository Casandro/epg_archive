  description: 'Brillenbärin Cashu hat es geschafft: Nach sechs Stunden Autofahrt von Zürich nach Frankfurt darf sie endlich ihre enge Transportbox verlassen. Sofort erkundet sie ihr neues Zuhause im Bärenhaus des Frankfurter Zoos und bezieht ihr Bett. Revierleiterin Claudia Löschmann freut sich und versucht, das Vertrauen der Bärin zu gewinnen. Dafür hat sie aus der Futterküche extra viele leckere Früchte geholt: Kiwi, Orangen und Weintrauben. Doch die Brillendame lässt sich nicht so einfach bestechen. Tierpfleger Peter Schramm aus dem Opel-Zoo hat dagegen ein ganz anderes Problem: Seine neue Erfindung will nicht wirklich funktionieren'
