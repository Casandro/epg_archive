  title: Der Tag
  subtitle: Im Osten nichts Neues? Mecklenburg-Vorpommern hat gewählt
  description: |-
    Nach der Wahl in Sachsen-Anhalt richtet sich die politische Aufmerksamkeit erneut auf den Osten: Bei der Landtagswahl in Mecklenburg-Vorpommern geht es um weit mehr als um Mehrheiten im Schweriner Landtag. Voraus ging der wohl polarisierteste Wahlkampf, den das Bundesland an der Ostsee je erlebt hat. Lange lag die SPD hinter der AfD, zuletzt prognostizierten Umfragen ein Kopf-an-Kopf-Rennen. Die amtierende Ministerpräsidentin Manuela Schwesig positionierte sich als "Frau gegen Blau" und führte einen Wahlkampf, den die SPD lange nicht gesehen hat.

    Wird wiederholt um 18:00 Uhr auf hr2.
