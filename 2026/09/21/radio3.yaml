- eventId: 540258
  start: 2026-09-21T18:00:00Z
  stop: 2026-09-21T20:00:00Z
  title: ARD Konzert
  description: "Ludwigsburger Schlossfestspiele\nElim Chan dirigiert das European Union Youth Orchestra und Solistin Maria Dueñas\n\nShootingstars beim Finale der Ludwigsburger Schlossfestspiele: die junge spanische Geigerin Maria Dueñas spielt Brahms' Violinkonzert, begleitet vom European Union Youth Orchestra und Dirigentin Elim Chan\n\nJohannes Brahms:\nViolinkonzert D-Dur op. 77\nSergei Rachmaninow:\nSinfonie Nr. 2 e-Moll op. 27\n\nMaria Dueñas, Violine\nEuropean Union Youth Orchestra \nLeitung: Elim Chan \n\nDie spanische Geigerin Maria Dueñas war 18, als sie den Internationalen Menuhin-Wettbewerb gewann. Die Folgen: Exklusivvertrag bei der Deutschen Grammophon, Stradivari-Geige und ein Generalschlüssel für die großen Konzertbühnen Europas. Den besitzt auch die Dirigentin Elim Chan. In Hong Kong gebürtig, in den USA ausgebildet, übernimmt sie ab 2027 als Chefdirigentin das San Francisco Symphony Orchestra - nachdem sie in London u. a. die First und Last Night of the Proms dirigiert hat. Bei der \"Last Night\" der Ludwigsburger Schlossfestspiele steht sie an der Spitze des European Union Youth Orchestras; hier spielen 120 junge Musiker*innen aus allen EU-Mitgliedsstaaten. Altersgrenze: 26. \n\nKonzert vom 5. August 2026 im Forum am Schlosspark, Ludwigsburg"
