  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  description: |-
    Der Wahl-September - Wir sprechen mit dem Historiker und Autor Ilko-Sascha Kowalzuk darüber, was wir aus den Wahlen im September lernen können.

    "Inside Bundestag" - Regisseur Lukas David Schmidt hat die Protokolle der ersten Sitzungswoche des Bundestags nach der Sommerpause zu einem Stück umgeschrieben: "Inside Bundestag" ist im Ballhaus Prinzenallee in Berlin zu sehen.

    Lisz Hirn "Gehorchen" - Die Philosophin Lisz Hirn untersucht in ihrem Buch "Gehorchen - Über das Wesen der Autorität" das Spannungsfeld zwischen Freiheit, Autorität und Widerstand.

    Van-Gogh-Sammlung - Helene Kröller-Müller erwarb zwischen 1908 und 1922 88 Gemälde und 172 Papierarbeiten von Van Gogh. Jetzt sind alle in einer Ausstellung im Kröller-Müller-Museum zu sehen, das mitten im niederländischen Nationalpark De Hoge Veluwe liegt.

    Maurizio Cattelan in Berlin - Er besuchte nie eine Kunstakademie, dennoch zählt der Italiener Maurizio Cattelan zu den gefragtesten und gleichzeitig rätselhaftesten Konzept- und Objekt­-Künstlern der Gegenwart. Seine Werke sind jetzt in Berlin zu sehen.

