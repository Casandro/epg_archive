  title: 'Kambodscha: Die erste Generation'
  subtitle: Dokumentation
  description: 'Kambodscha: Die erste GenerationLun Kimleang (Tänzerin), Oum Samean (Musiker) and Bang Sovanna (Journalist) sind drei junge Kambodschaner, die erlebt haben, wie der katholische Glaube ihre Leben verändert hat.Sie leben in schwierigen und herausfordernden Lebensumständen. Der Glaube jedoch gibt ihnen eine Vision, die voll Hoffnung und Liebe ist. "Die erste Generation" präsentiert die Früchte der katholischen Kirche, die auch eine Wiedergeburt dieser Nation repräsentieren.Es sind bereits Jahrzehnten vergangen, seit das verheerende Regime von Pol Pot die berühmt berüchtigten Felder des Todes hervorbrachte, die Auswirkungen einer solchen Brutalität jedoch belasten jedoch nach wie vor die Seele dieses asiatischen Landes.'
- eventId: 997300
  start: 2026-09-21T17:30:00Z
  stop: 2026-09-21T18:00:00Z
  title: GRANDIOS zu Gast bei Thomas D (Teil 1)
  subtitle: Gespräch
  description: 'Ob als Solokünstler oder Teil der "Fantastischen Vier": Seit 37 Jahren bringt Thomas D mit seinen Liedern die Menschen zum Feiern, Tanzen - und Nachdenken. Ein Gespräch über die Kraft der Musik, über eine Gabe, die Geschenk und Verpflichtung zugleich ist, über Vielfalt, Familie und das "Wir", das im Kleinen und Leisen wächst, über Authentizität und einen Frieden, der dann entsteht, wenn man sich selbst nicht zu ernst nimmt.'
- eventId: 997301
  start: 2026-09-21T18:00:00Z
  stop: 2026-09-21T18:15:00Z
  title: Was ist das geistige Erbe von Benedikt XVI.?
  subtitle: Spiritualität
  description: Univ.-Prof. em. DDr. Hanna-Barbara Gerl-Falkovitz ist Philosophin, Sprach- und Politikwissenschaftlerin. Nach ihrer Tätigkeit als Studienleiterin auf Burg Rothenfels/Main, akademische Oberrätin am Seminar für Christliche Weltanschauung, Religions- und Kulturtheorie der Universität München, sowie als Privatdozentin in Bayreuth, Tübingen und Eichstätt, folgte eine Professur für Philosophie an der Pädagogischen Hochschule in Weingarten/Bodensee. Von 1993 bis 2011 war sie Lehrstuhlinhaberin für Religionsphilosophie und vergleichende Religionswissenschaft an der Technischen Universität Dresden. Seit 2011 ist sie Leiterin des EUPHRat (Europäisches Institut für Philosophie und Religion) in Heiligenkreuz bei Wien. Prof. Gerl-Falkovitz ist u.a. Trägerin des Joseph-Pieper Preises, des Edith-Stein-Preises, des Augustin-Bea-Preises sowie des Ratzinger Preises. Die Tagespost beschreibt Hanna-Barbara Gerl-Falkovitz passend als "ein Leuchtfeuer im Nebel der postmodernen Landschaft" und "eine der wichtigsten katholischen Stimmen in Europa".
