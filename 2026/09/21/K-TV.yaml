  title: Pater Pio - Vater von Millionen
  subtitle: Dokumentation
  description: Der Heilige Pater Pio war nicht nur ein begnadeter Seelsorger sondern auch ein Mann der Tat. Seine Stigmatisierung trug zu seiner Bekanntheit bei. Er war jedoch stets darauf bedacht, auch die Leiden der Menschen zu lindern und mit den zahlreichen Spendengeldern ließ er ein großes Krankenhaus bauen, das heute zu den modernst ausgestatteten Klinken Italiens zählt und viele arme Menschen unentgeltlich versorgt.
