    PL, 2023
    Reżyseria: Agnieszka Żmijewska
    Występują: Andrzej Kaczmarczyk
    Praczka, świniopas, śledziarz, handlarz skupujący starzyznę i kurze łapki, wędrowny ostrzyciel noży odeszli w zapomnienie, choć tego ostatniego widziano jeszcze na warszawskich podwórkach na początku lat 90. XX w. Podobny los może czekać wikliniarzy, bednarzy, kołodziejów, garncarzy, choć ta ostatnia umiejętność przeżywa właśnie renesans. W niektórych przypadkach to ostatni moment, by rzemieślnicy podzielili się umiejętnościami.
