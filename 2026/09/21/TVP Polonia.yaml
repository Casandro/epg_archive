    PL, 2024
    Reżyseria: Piotr Kuciński
    Etiudy filmowe ukazujące historie wybitnych naukowców polskiej narodowości, którzy, żyjąc w różnych zakątkach świata, przyczynili się znacząco do rozwoju kultury, a swoją pracą i odkryciami dali podstawy do rozwoju nauki. W krótkich filmach widzowie poznają niezwykłe historie wybitnych Polaków, a wśród nich jest m.in. Maria Matylda Krzesińska, tancerka i nauczycielka tańca klasycznego. Od 1890 r. występowała w Teatrze Maryjskim, działała także na terenie Francji.
