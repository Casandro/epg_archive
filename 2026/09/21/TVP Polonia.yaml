    Basia Lawinówna nadal poszukuje Łukasza. Po aresztowaniu matki dziewczyna jeszcze bardziej pogardliwie i wrogo traktuje zakochanego w niej Andrzeja. Jednak właśnie interwencja Talara sprawia, że pani Lawinowa zostaje zwolniona. Wraca wreszcie ze stalagu znany przed wojną piłkarz, Kostek Bawolik. Jest zazdrosny o kinooperatora Rajmunda Wrotka, żyją z żoną obok siebie, osobno. Na Złotej przybywa lokatorów i rodzą się nowe konflikty między nimi.
