  start: 2026-09-21T11:00:00Z
  stop: 2026-09-21T11:50:00Z
  title: Blondynka s.VI - odc. 74 (seria VI, odc. 9) Piękne jest życie pozagrobowe
  subtitle: Mieszkańcy wsi są poruszeni perspektywą likwidacji lecznicy weterynaryjnej. Żorżeta na zlecenie wójta Steca ma nagrać film promocyjny, który pomoże wesprzeć lecznicę i wypromować Majaki.
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2018
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Marta Ścisłowicz, Magdalena Schejbal, Michał Lesień, Katarzyna Ankudowicz
    Cała wieś jest poruszona likwidacją lecznicy weterynaryjnej. Żorżeta, na zlecenie wójta Steca, ma nagrać film promocyjny, który pomoże wesprzeć lecznicę, a przy okazji promować Majaki. Film rozpoczyna się od fragmentu "Pana Tadeusza", który Żorżeta recytuje, wyjątkowo nie jąkając się. Nie tak wyobrażał sobie Stec promocję Majaków. Mimo niefortunnego początku, w filmiku biorą udział Dalmata, Traczyk z Oksaną i Nataszą, Sylwia. Wszyscy deklarują pomoc w stworzeniu nowej lecznicy.
  ageRating: 12
  genre:
  - '23'
