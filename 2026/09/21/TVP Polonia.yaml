  title: Blondynka s.VI - odc. 73 (seria VI, odc. 8) Koniec świata jest co dzień
  subtitle: Do Majaków przybywa wizytacja z województwa, by sprawdzić warunki w wolierze. Jeden z członków delegacji jest myśliwym. Mężczyzna dowiaduje się, że w okolicy żyje jeleń i postanawia go zastrzelić.
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2018
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Marta Ścisłowicz, Magdalena Schejbal, Michał Lesień, Katarzyna Ankudowicz
    Nadszedł czas wyprowadzki. Doktor przeżywa to mocno. Nie może pogodzić się z faktem, że musi opuścić dom, w którym spędził ostatnie kilkadziesiąt lat życia. Popada w melancholię. Śni mu się Rychterowa, która drwi z jego losu. Jasiunia stara się sprostać zadaniu. Dyryguje wywózką rzeczy. Cały czas liczy, że jakimś cudem, będą mogli razem z doktorem wrócić do lecznicy. W wyprowadzce pomaga pół wsi: Dalmata, Partyka, Pawełek, Pula - Hula, robotnicy leśni Auguścika.
  ageRating: 12
  genre:
  - '23'
