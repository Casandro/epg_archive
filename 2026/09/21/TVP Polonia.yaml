  title: Ojciec Mateusz - odc. 35 (Ojciec Mateusz III odc. 5) - Zakładnik
  subtitle: Karolina próbuje rozmawiać z Rafałem, by wyjaśnił sprawę jej obecności w czasie zabójstwa Szorskiego. Rafał odmawia; zdesperowana dziewczyna grozi bronią i bierze Mateusza jako zakładnika.
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Maciej Dejczer
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Maciej Musiał, Aleksandra Górska
    Karolina próbuje rozmawiać z Rafałem, by wyjaśnił sprawę jej obecności w czasie zabójstwa Szorskiego. Kiedy Rafał odmawia, zdesperowana dziewczyna grozi bronią i postanawia wziąć zakładnika, którym staje się Mateusz. Trwają poszukiwania uprowadzonego księdza, miasto jest zablokowane. Karolina wyjaśnia, że jest to jej próba obrony przed oskarżeniami. Dzwoni na plebanię i żąda 30 tysięcy okupu. Karolina opowiada Mateuszowi o swojej pracy dla Szorskiego, o tym, że to nie ona go zabiła.
  ageRating: 12
  genre:
  - '18'
