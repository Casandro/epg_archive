    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
    Występują: Henryk Talar, Paulina Gałązka, Maria Gładkowska, Mirosław Zbrojewicz, Mateusz Kmiecik, Rafał Mohr
    W żyrardowskiej komendzie rozpoczyna pracę aspirantka Zuza Wasiluk (Paulina Gałązka). Na skutek zbiegu okoliczności zostaje przydzielona do archiwum. Prowadzący je Henryk Mikos (Henryk Talar) powinien odejść na emeryturę, ale bardzo tego nie chce i wie, co zrobić, by tak się nie stało. Wkrótce okazuje się, że elektroniczne archiwum nie działa i ostatecznie Mikos wraca do pracy, a komendant przydziela mu do pomocy nową funkcjonariuszkę. Początki ich znajomości są trudne.
  ageRating: 12
  genre:
