  title: Kościół otwartych drzwi
  description: |-
    reportaż (Polska, 2026)
    Historia batystów w Żyrardowie sięga lat 60. XIX wieku, gdy do miasta przybył młody Adam Sonnenberg i zaczął opowiadać sąsiadom oraz współpracownikom z fabryki o Jezusie Chrystusie. Od tamtej pory wspólnotę wyróżnia otwartość na drugiego człowieka i wartości, które widoczne w życiu lokalnym i osobistym.
