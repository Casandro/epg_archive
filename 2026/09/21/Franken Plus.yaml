  title: 'Kultur daham: Von Fäden und Fränkisch - Die Schwabacher Marionettenbühne (Wh.)'
  subtitle: Wenn in Schwabach die Fäden gezogen werden, erwachen berühmte Märchenfiguren wie Rotkäppchen und der böse Wolf auf der Bühne zum Leben. Doch hinter der liebevollen Insz..
  description: In Kultur daham blicken wir hinter die Kulissen der Schwabacher Marionettenbühne und zeigen den Puppenspieler Armin Vogel bei seiner detailreichen Arbeit an den Spielkreuzen. Dabei wird deutlich, wie aus einem einst strengen Dialektverbot im Jahr 1978 mit dem Meiers Gerch eine Kultfigur und das Markenzeichen des Hauses wurde. Für die Verbindung von traditionellem Handwerk und fränkischer Mundart wurde die Bühne jetzt auch mit dem Dialektpreis Bayern ausgezeichnet.
