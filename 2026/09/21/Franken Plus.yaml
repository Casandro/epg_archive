  title: Unsere Heimat - Der Limes in Mittelfranken (Wh.)
  subtitle: Seit über 20 Jahren ist der Limes Weltkulturerbe der UNESCO.  70 Kilometer davon führen durch Mittelfranken. Um die Jahrtausendwende schließen sich drei Gemeinden im Landkreis Ansbach zusammen. Ihr ..
  description: Er war die größte Grenze, die es je im Mittelmeerraum gegeben hat - der Limes. Vom Syrien bis nach Nordengland reichte der Schutzwall im zweiten Jahrhundert. Dass die Grenze offener und umkämpfter war als gedacht zeigt. In der Sonderausstellung "Nachrichten im Geldbeutel - Was erzählen römische Münzen?" Historiker und Archäologen sammeln und katalogisieren viele Funde aus der RegionUmgebung. Sie werfen damit einen spannenden Blick in unsere Vergangenheit
