  title: 'Pasteur et Koch : Un duel de géants dans le monde des microbes'
  subtitle: La découverte de la transmission des maladies par les microbes, et la lutte victorieuse contre les pandémies, doivent beaucoup à la rivalité de Pasteur et Koch.
  genre:
  - '32'
  description: 'À la fin du XIXe siècle, le chimiste Louis Pasteur, déjà célèbre pour ses travaux sur la fermentation, a l''intuition que des micro-organismes pourraient être à l''origine des maladies infectieuses. Mais c''est à un total inconnu que l''on en doit la démonstration scientifique : médecin de campagne, Robert Koch est parvenu à identifier la bactérie responsable de la fièvre charbonneuse, qui décime les troupeaux. Vexé, Pasteur affine les résultats de son concurrent avec un coup d''éclat : en 1881, il inocule une forme atténuée de la maladie du charbon à une cinquantaine de moutons. La campagne de vaccination est couronnée de succès et le Français est acclamé par-delà les cercles scientifiques. Mais publiquement, Pasteur omet de mentionner les travaux de Koch. La rivalité entre eux s''intensifie alors, exacerbée par l''antagonisme entre leurs deux pays. Tuberculose, choléra, rage, peste, diphtérie. : à travers leur duel, la lutte contre les pandémies de l''époque connaît des avancées spectaculaires. Ego salutaire À l''aide de reconstitutions de qualité et des explications limpides de scientifiques français et allemands, ce documentaire retrace les grandes étapes de la compétition entre le découvreur du vaccin contre la rage et celui du bacille de la tuberculose, combat qui se prolongera par le biais de leurs disciples et de leurs instituts respectifs. Mathieu Schwartz met ainsi en lumière une guerre d''ego qui a profité à l''humanité, et écrit une page de l''histoire des sciences. Réalisateur: Mathieu Schwartz. Des acteurs: Patrick Bonnel (Louis Pasteur), Pierre Hiessler (Robert Koch), Charlotte Krenz (Emmy Koch), Paul Lefèvre (Emile Roux), Françoise Miquelis (madame Pasteur) (2018)'
- eventId: 1078739
  start: 2026-09-21T07:55:04Z
  stop: 2026-09-21T09:30:00Z
  title: 'Pasteur et Koch : un duel de géants dans le monde des microbes'
  description: |-
    Documentaire de Mathieu Schwartz (France, 2018, 1h36mn) Légendes de la science, le Français Louis Pasteur et l'Allemand Robert Koch se sont affrontés à l'heure de la découverte de la transmission des maladies par les microbes. Un tournant essentiel dans l'histoire de la médecine.

