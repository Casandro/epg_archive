  title: Invitation au voyage
  subtitle: 'Pays basque E24. Ramuntcho, le basque idéal de Pierre Loti - Les chemins sacrés du Pays basque - En France, le poulet basquaise de Guilhem - Biarritz : sauvetage sous le signe de la Vierge.'
  genre:
  - '116'
  description: 'Ramuntcho, le basque idéal de Pierre Loti\n\nAu Pays basque, la mer étreint fougueusement les montagnes tandis qu''à terre s''étend une nature sauvage. Au XIXème siècle, cette région apparaît comme un ailleurs exotique et mystérieux. Pierre Loti, grand marin qui a sillonné le globe, ne s''y trompe pas. De ses innombrables séjours basques, il tire un roman, Ramuntcho, où il livre ses impressions et dépeint sans fard la vie de ces villages dont il s''éprend éperdument. Au point d''embarquer, sur la terre ferme cette fois, pour l''une de ses plus grandes aventures.\n\n\n\nLes chemins sacrés du Pays basque\n\nChaque année, des centaines de milliers de pèlerins empruntent le chemin qui conduit à Saint-Jacques-de-Compostelle. Entre la France et l''Espagne, le Pays basque est peut-être la plus belle étape de ce chemin. La plus éprouvante aussi. Vingt-cinq kilomètres de lacets qui sillonnent la montagne pyrénéenne basque. Sillonnée par les hommes depuis des milliers d''années, on trouve le long de cette route sacrée des vestiges archéologiques anciens, témoins de la première religion des Basques, et des cités authentiques qui rappellent la genèse et l''âge d''or de ce pèlerinage.\n\n\n\nEn France, le poulet basquaise de Guilhem\n\nÀ Saint-Martin-d''Arberoue, Guilhem prépare dans son foodtruck le plus connu des plats basques : le poulet basquaise. Pour cela, il fait revenir de l''ail, de l''oignon, des piments doux et de la tomate auxquels il ajoute du piment d''Espelette. Il fait mijoter son poulet dans la sauce et c''est prêt. Inratable !\n\n\n\nBiarritz : sauvetage sous le signe de la Vierge\n\nAvec sa forme de coque de navire, il est un emblème de Biarritz. Le rocher de la Vierge est un imposant bloc de pierre, une curiosité naturelle qui offre un panorama époustouflant sur la baie et les Pyrénées. De son sommet, une statue de la Vierge veille sur les Biarrots, les marins et les baigneurs. Et elle n''est pas la seule... (2024)'
- eventId: 1078738
  start: 2026-09-21T07:07:36Z
  stop: 2026-09-21T07:55:00Z
  title: Invitation au voyage - Pays basque
  description: |-
    Magazine (France, 2026, 45mn) Découverte du Pays basque à travers quatre sujets : "Ramuntcho", le basque idéal de Pierre Loti ; les chemins sacrés de Saint-Jacques-de-Compostelle ; la recette du poulet basquaise ; le rocher de la Vierge, à Biarritz.

