  title: Planet Weltweit - Von Männern und Mustangs
  subtitle: Planet Weltweit - Von Männern und Mustangs
  description: |-
    Mustang-Pferde stehen in den USA für Freiheit und Abenteuer. Mit wehenden Mähnen und fliegenden Hufen galoppieren sie über die Prärien des amerikanischen Westen. Werden die Herden zu groß, müssen einige der Wildpferde eingefangen, zugeritten und verkauft werden. Keine leichte Aufgabe! Mike Buchanan ist Mitarbeiter der Vollzugsanstalt "Honor Farm" in Wyoming. Bereits vor über 30 Jahren erkannte er Parallelen im Freiheitsdrang seiner Häftlinge und der Mustangs. Er brachte die Pferde in das Gefängnis, damit sich Mensch und Tier gegenseitig zähmen. Planet Weltweit begleitet wilde Pferde und wilde Kerle auf ihrem gemeinsamen Weg aus dem Gefängnis.
    Das amerikanische Gefängnis "Honor Farm" liegt abgeschieden in den Weiten Wyomings. Auf einem farmartigen Gelände verbringen etwa 220 männliche Gefangene den Rest ihrer oft langjährigen Haftstrafen. Mike Buchanan ist mit Pferden aufgewachsen, konnte ihr Verhalten studieren - ebenso wie das der Häftlinge in seiner Zeit als Gefängniswärter. Er erkannte, dass Wildpferde sehr hilfreich sein können bei der Rehabilitierung und Resozialisierung von Häftlingen. Während die Rangordnung der Häftlinge oft durch Gewalt bestimmt wird, verlangen Wildpferde Ehrlichkeit, Souveränität und Geduld. Für Mustangs und Häftlinge entwickelte er ein Vier-Stufen-Ausbildungsprogramm. Schritt für Schritt werden die Pferde allmählich an den Kontakt zu Menschen gewöhnt. Dabei entstehen zwischen den misstrauischen, harten Männer und ihren eigenwilligen Schützlingen oft innige Beziehungen. Umso schwerer fällt dann der Abschied. Zwei Mal im Jahr führen die Häftlinge ihre Pferde auf einer großen Auktion zum Verkauf vor. Der 26-jährige Travis Wagner wird das erste Mal dabei sein. Er war alkoholkrank und sitzt wegen Scheckbetrugs. Seit Monaten übt er mit einem schönen braunen Mustang, den er Chaos nennt. Der Name ist Programm, erst nach und nach finden Mann und Pferd zusammen. DE 2006
