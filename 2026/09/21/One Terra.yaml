  description: "Koala-Baby Neil lebt seit einigen Wochen bei seinen Pflegeeltern, einem älteren Ehepaar, im Badeort Port Macquarie an der Ostküste Australiens. Das Waisenjunge wurde ohne Mutter gefunden. In Port Macquarie steht auch das erste Koala-Hospital Australiens. Ob Brandwunden oder Infektionen - seit 1973 finden hier alle verletzten, kranken oder verwaisten Koalas der Region ein vorübergehendes Zuhause. \n\n DE 2011"
