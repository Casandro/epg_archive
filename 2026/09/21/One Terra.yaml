  title: Planet Weltweit - Tradition am Steilhang - Die Schweiz und ihre Wildheuer
  subtitle: Planet Weltweit - Tradition am Steilhang - Die Schweiz und ihre Wildheuer
  description: 'Im Schweizer Kanton Uri pflegen die Bauern an den fast senkrechten Steilhängen eine gefährliche Tradition: Das Wildheuen. Seit Jahrhunderten mähen sie hier in den Alpen das Gras für ihre Tiere auch oberhalb der Weiden. Dafür braucht es vor allem Kondition und absolute Trittsicherheit. Doch es lohnt sich, denn Wildheu ist extrem gesund für die Tiere, das regelmäßige Mähen hält die Wiesen frei von Wildwuchs und ist obendrein ein Schutz vor Lawinen. Hoch über dem Vierwaldstättersee beginnt jeden August ein gefährliches Abenteuer:  die Saison der Wildheuer. Sepp Herger ist von Kindesbeinen an mit seinen Eltern auf der Alm, ein anderes Leben kann er sich kaum vorstellen. Vor acht Jahren hat er sich eine eigene Bergweide im Kanton Uri gekauft, hier lebt er den Sommer über mit seiner Frau Andrea in 1500 Metern Höhe. Die beiden hüten dort oben 80 Kühe, haben eine eigene Ziegenzucht, sind Käsebauern und nicht zuletzt Wildheuer. Die schwer zugänglichen Wildheuwiesen, liebevoll "Wildi" genannt, sind voller Kräuter und Blumen, das Heu ist nährstoffreich und regelmäßiges Mähen sorgt dafür, dass die Flächen frei von Wald bleiben und damit auch sicher vor Lawinen. Dafür zahlt der Kanton seinen Bauern sogar Geld. Doch das Wildheuen bleibt nicht nur körperlich mühsam, sondern ist vor allem extrem gefährlich. Der Tag im Sommer beginnt früh für Sepp und seine Frau. Nachdem die Kühe im Freien, direkt auf der Alm, gemolken wurden, geht es für Andrea in die eigene Käserei und für Sepp auf die "Wildi", die steilen Wildheuwiesen. Nicht nur, dass er das Heu der Wiesen überweigend von Hand mäht, er muss es auch zu 80 Kilogramm schweren Ballen binden. Allein sechs Tonnen wurden es in diesem Sommer. Auf noch steileren und höher gelegenen Wiesen kommt auch schon mal schweres Gerät zum Einsatz: Mäher und Helikopter. Ein Abenteuer ganz in der Tradition der Schweizer Bergbauern vor einer atemberaubenden Kulisse DE 2020'
- eventId: 1004011
  start: 2026-09-21T10:10:00Z
  stop: 2026-09-21T11:02:00Z
  title: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  subtitle: Planet Weltweit - Las Fallas - Valencias feurige Fiesta
  description: 'Planet Weltweit: "Las Fallas de Valencia" sind eine Mischung aus Frühlingsfest und Karneval. Sie verwandeln die spanische Stadt jedes Jahr in einen Party-Hotspot. Künstler wie Mario Gual del Olmo stecken viel Zeit und Kreativität in ihre riesigen Straßen-Skulpturen, die allerdings nicht sehr langlebig sein werden: Im März gehen sie traditionell in Flammen auf. Eine ganze Woche lang wird gefeiert, begleitet von Spielmannszügen, Fanfaren, Böllern und viel Feuerwerk. Die Ursprünge reichen zurück bis ins Mittelalter. Damals verbrannten die Zimmerleute am 19. März, dem Gedenktag ihres Schutzheiligen Joseph, alle Werkstatt-Reste auf den Straßen. "Fallas", übersetzt "Fehler" oder "Misserfolge", nannten sie diese Überreste erledigter oder misslungener Arbeiten und trieben mit dem Feuer den Winter aus. Später begann man, die Holzreste mit Puppen, den sogenannten "ninots", zu schmücken und zu bemalen.  Mario Gual del Olmo und andere "Artistas Falleros" arbeiten das ganze Jahr an ihren Werken. Die Vorbereitungen für das kommende Spektakel beginnen bereits im Frühling. Bunte Zeichnungen sollen den Auftraggebern die neuen Ideen schmackhaft machen. Das sind Fallas-Vereine, von denen es Dutzende in jedem Stadtviertel gibt. Rund 400 solcher Vereine gibt es derzeit, die alle eine bis zu 15 m hohe, große Falla und eine kleinere Kinder-Falla bauen lassen. Rund 120 Künstler, vor allem Designer, Zimmerleute, Bildhauer und Maler sowie deren Mitarbeiter leben davon. Die meisten haben ihre Werkstätten in der "Ciudad Fallera", einem eigenen Stadtviertel nur für dieses Handwerk. Hier entstehen jährlich fast 780 Kreationen im Gesamtwert von knapp acht Millionen Euro, nach Größe und Budget in Sektionen unterteilt. Lediglich eine "ninot indultat", eine "begnadigte Puppe", die vom Publikum gewählt wird, entgeht dem Verbrennen und wandert ins Museum. "Las Fallas de Valencia" - alle Jahre wieder eine spektakuläre, feurige Fiesta. DE 2022'
