  title: Planet Weltweit - Basketball - Die kleinen Barfußspieler von Mexiko
  subtitle: Planet Weltweit - Basketball - Die kleinen Barfußspieler von Mexiko
  description: Barfuß laufen sie um Anerkennung, kämpfen für Pokale und den Traum auf eine bessere Zukunft. Die Kinder der Triquis, einer indigenen Volksgruppe im Hochland Mexikos, zählen zu den besten Basketballspielern weltweit. Nicht mit ihrer Körpergröße, sondern mit ihrer Willenskraft brechen sie Rekorde. Weltrekorde! Missionare machten vor knapp 50 Jahren Basketball bei den Triquis im Bundesstaat Oaxaca populär. Aus Mangel an Freiflächen in den Kiefernwäldern des Hochlands kam Fußball nicht in Frage. Jedes Kind wächst dort heute mit diesem Sport auf, Jungen wie Mädchen. Deysi Martinez ist ein Ausnahmetalent. Dank ihres Talents und ihrer guten Noten geht sie seit anderthalb Jahren auf ein Sportinternat in der Hauptstadt Oaxaca. Deysi dribbelt den Ball im Slalom über den Betonboden, von vorne kommt Angriff, die Dreizehnjährige hat keine Zeit zum Überlegen, wie ein Pfeil schießt sie nach oben, wirft den Ball in den Korb und landet mit einem dumpfen Geräusch. Deysi gehört zu besten Basketball-Spielerinnen Mexikos, zumindest in ihrer Altersgruppe. Sie ist kleiner als ihre Konkurrenten in anderen Regionen und spielt meist barfuß, wie alle Triquis, eine kleine indigene Minderheit im Südwesten Mexikos. Etwa 38.000 von ihnen gibt es noch, ein Drittel der Erwachsenen sind in die Vereinigen Staaten ausgewandert, die meisten illegal. Zurück geblieben sind Alte, Frauen und Kinder. Auch Deysis Vater lebt seit rund drei Jahren in Washington, wo er als Erntehelfer arbeitet, für weniger als den Mindestlohn. Er war selbst Kapitän einer Basketballmannschaft. Die Tochter hat sein Talent geerbt. Das hat auch Sergio Ramirez Zuñiga erkannt. Der Trainer hat den Casa Club gegründet, eine Sportakademie, in der Triqui-Kinder gefördert werden. Die harte Schule des Trainers hat zu ersten Erfolgen geführt. Einige der jungen Spieler haben Stipendien, Sprachkurse mit Bildungsreisen, in Amerika und Europa erhalten. Auch Deysi hat diesen Traum. DE 2015
