  title: Planet Weltweit - Kentucky - Die Schlacht von Sacramento
  subtitle: Planet Weltweit - Kentucky - Die Schlacht von Sacramento
  description: 'Jedes Jahr im Mai wird aus einer beschaulichen Kleinstadt im Süden der USA ein kriegerischer Schauplatz, wenn seine Bewohner und zahlreiche Angereiste die Schlacht von Sacramento originalgetreu nachstellen. Aus Farmern und Handwerkern werden Offiziere und Soldaten, die sich mit Pistolen und Kanonen wilde Gefechte liefern. Als Abraham Lincoln 1861 zum Präsidenten der Vereinigten Staaten von Amerika gewählt wurde, kam es zur Abspaltung der Südstaaten. In dem folgenden Sezessionskrieg zwischen der Union und den Konföderierten Staaten schrieb die Schlacht von Sacramento im Staat Kentucky Geschichte. Sacramento erzählt seine Geschichte heute aus einer Perspektive, die der offiziellen Geschichtsschreibung widerspricht. GEO Reportage war mit auf dem Schlachtfeld der "Battle of Sacramento". Sacramento im Mai 2019. Überall in der Stadt gibt es Hinweise auf die Schlacht von Sacramento, "Battle of Sacramento", die die kleine Stadt weit über ihre Grenzen hinaus bekannt gemacht hat. Die Männer, die hier leben sind Pferdenarren, das gehört zur Lebensart und hat viel mit der Geschichte des landwirtschaftlich geprägten Südens zu tun. Ihre Pferde trainieren sie für die jährliche Nachstellung der berühmten Schlacht von Sacramento, wenn die Gegner von Union und Konföderierten im Gefecht aufeinander stürmen und Schüsse und Kanonenkugeln dröhnen. Doug Key ist einer dieser Männer und wie für die meisten Südstaatler sind für ihn Heimat, Familie und Freunde das wichtigste Gut, egal ob Schwarz oder Weiß: "Wir alle funktionieren zusammen wie eine große Familie. Wir sind Brüder, und der Erfolg in der Schlacht bringt uns noch näher zusammen und lässt uns gestärkt in die nächste gehen..." Jedes Jahr im Mai wird die Schlacht von 1861 wieder lebendig und mit ihr die Sichtweise des Südens, worum es im Bürgerkrieg ging. DE 2020'
