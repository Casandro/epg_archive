  title: Planet Weltweit - Kalifornien auf die harte Tour
  subtitle: Planet Weltweit - Kalifornien auf die harte Tour
  description: 'Kalifornien, Anfang August: Wo andere in der Sonne braten, suchen 15 Urlauber das wahre Leben - die Realität hinter dem kalifornischen Traum von Sonne, Sand und Meer. In einer Reality Tour entdecken sie vom Fahrrad aus Kaliforniens Hinterhof. Sie radeln durch Kaliforniens atemberaubend schöne Landschaft zu den sozialen und politischen Brennpunkten des Sonnenstaats, erkunden die harten Lebensbedingungen illegal eingewanderter Mexikaner. Im Visier: Themen wie Immigration und Freihandel, Umweltverschmutzung und Rassismus. Strampeln statt Strand.  Was macht eine 62-jährige Nonne auf einer knochenharten 1000-km Radtour entlang der kalifornischen Küste? Wie kommt eine gutsituierte Hausfrau auf die Idee, für eine Gesundheitsreform auf dem Fahrrad zu demonstrieren? Wie fühlt sich eine Anwältin bei der Übernachtung im Immigrantenheim? 13 amerikanische Frauen und zwei Männer auf einer Höllentour durch Kalifornien. Sie sehen ihr Land in einer Sackgasse, suchen neue Werte und eine politische Moral. Bis zu 150 Kilometer täglich strampeln sie dafür durch Hitze, Staub und Abgase. Start der Tour ist San Francisco. Die Stadt, die Tausende Touristen wegen ihrer Kultur und Lebensart reizt, lässt die Biker kalt. Sie haben keine Augen für die Cable Cars auf den steilen Straßen, nicht für Chinatown oder die legendäre Golden Gate Bridge. Entlang von Kaliforniens schneeweißen Stränden und spektakulären Steilküsten suchen sie soziale Brennpunkte und das wahre Leben. Derzeit leben rund 38 Millionen Lateinamerikaner in den USA, in Kalifornien machen die Latinos 32 Prozent der Bevölkerung aus. Schätzungsweise bis zu 300.000 Mexikaner reisen jährlich kurz vor der Erntezeit in die USA ein. Die mexikanischen Immigranten nehmen lebensgefährliche Strapazen, Gefängnis und Verfolgung auf sich, um hier eine neue Existenz zugründen. Die Tour der Radfahrer verfolgt ihren Weg zurück. DE 2004'
