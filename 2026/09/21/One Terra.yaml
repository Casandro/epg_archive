  title: Rund um den Globus - Joaquims wilde Reiter
  subtitle: Rund um den Globus - Joaquims wilde Reiter
  description: 'Der zehnjährige Luam hat sein bisheriges Leben auf der Straße verbracht. Nun kommt er auf die Farm von Senhor Joaquim, der seit Jahren Straßenkinder aufnimmt, um ihnen ein neues Leben zu bieten. Auf der Farm dürfen die Kinder wieder Kinder sein, können herumtollen und spielen. Und sie lernen, Pflichten und Verantwortung zu übernehmen. Etwa für das eigene Pferd, dass Senhor Joaquim und seine Frau Dona Terezinha jedem Kind geben. Auch Luam bekommt ein solches Pferd, für das er allein verantwortlich ist. Und nicht nur das: Wenn Luam will, kann er damit sogar eines Tages im Rampenlicht stehen - als Show-Reiter. So wie alle Kinder, die beweisen wollen, dass mehr in ihnen steckt als nur ein Straßenkind DE 2011'
