  title: Planet Weltweit - Churubamba - Frauen am Ball
  subtitle: Planet Weltweit - Churubamba - Frauen am Ball
  description: "Peru - eine stille Bergregion fernab der großen Städte. Sanft schmiegen sich die Wolken an die malerischen Felsen, ein Lama kaut träge vor sich hin bis ein Aufschrei jäh die Stille unterbricht: \"Tooor!\" Eine Gruppe Frauen reißt jubelnd die Arme in die Luft. \"Bei jedem Tor würden wir am liebsten erst mal zehn Minuten lang lachen\", sagt Juana Estrada Huamán. Sie ist Verteidigerin im Fußballteam von Churubamba, einem kleinen Andendorf. Jeden Tag spielt sie auf 3.850 Meter Höhe gemeinsam mit zwei Dutzend weiterer Bäuerinnen Fußball. Kicken ist für sie Spaß, Spannung und auch Flucht vor ihrem Alltag aus Feldarbeit, Viehzucht, Haushalt und Kinderversorgung. Planet Weltweit begleitet Juana Estrada Huamán und ihre Mannschaft während einer Reihe turbulenter Spiele. \n\nIn Churubamba gibt es keinen Strom, kaum fließendes Wasser. Nicht einmal eine Busverbindung führt in das kleine Dorf. Der nächste Ort ist eine Stunde Fußmarsch entfernt. Dorthin laufen die Frauen nur, um hin und wieder ihre Produkte auf dem Markt zu verkaufen - oder um Fußball zu spielen! Sie kennen weder Beckham noch Ballack oder Zidane. Auch, dass im Jahr 2006 eine Fußball-Weltmeisterschaft ausgetragen wird, weiß in Churubamba niemand. Wichtig ist für die Frauen vor allem, wie es ihren Tieren, ihrem Land und ihrer Familie geht. Und es ist wichtig, wie das nächste Spiel ausgeht. \n\nDiesen Sonntag trifft das Frauenteam aus Churubamba auf Manco, ein Dorf auf der anderen Seite des Berges, gegen das sie noch nie gespielt haben. Die Stimmung an und auf dem Spielfeld brodelt, als ginge es um den Weltmeistertitel. Am Ende geht Churubamba als Sieger vom Platz. Die Prämie: ein Dutzend Meerschweinchen - Cuy, wie sie hier genannt werden. Kross gebraten sind sie eines der Nationalgerichte Perus.\n\nIm Spiel darauf gibt es keinen Grund zum Jubeln: Churubamba verliert gegen Huilloc, und damit auch den Siegpreis - diesmal sind es Hühner. Damit wird das nächste Spiel für Churubamba umso wichtiger. DE 2006"
