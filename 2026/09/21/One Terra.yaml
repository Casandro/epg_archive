  title: Planet Weltweit - Estland und das kleine Königreich der Seto
  subtitle: Planet Weltweit - Estland und das kleine Königreich der Seto
  description: 'Es ist eines der kleinsten Völker Europas: Die ethnische Minderheit der Seto lebt im Süden des heutigen Estland, ihr traditionelles Siedlungsgebiet reicht bis über die nahe Grenze hinein ins westliche Russland. Nur noch einige Tausend von ihnen gibt es heute, mit ganz eigener Kultur. Einer ihrer wichtigsten Bräuche ist die alljährliche Wahl des "Vizekönigs". Er vertritt ihren König "Peko" auf Erden, einen legendenumwobenen, heidnischen Gott. Zwar sind die Seto schon seit Jahrhunderten auch streng gläubige orthodoxe Christen, aber "Peko" und sein irdischer Stellvertreter genießen nach wie vor höchstes Ansehen. Rein Järvelill ist seit einem Jahr der Vizekönig. Wird er die Wahl auch diesmal wieder gewinnen? Heute verläuft mitten durch das Seto-Stammland die EU-Außengrenze. Ein schwieriger Status und sicher einer der Gründe, warum den Seto ihre Traditionen so wichtig sind. Kulte und Zeremonien werden entsprechend ernsthaft praktiziert. Zwar nimmt heute nicht mehr jeder die alten Legenden für bare Münze, da sie aber dem kleinen Volk ihre Identität geben, bleibt Tradiertes elementar. Das ganze Jahr hindurch ist Vizekönig Rein Järvelill im estnischen Siedlungsgebiet der Seto unterwegs, gerade jetzt vor dem Fest. Die Dörfer und einzelnen Höfe liegen verstreut und zum Teil sehr weit entfernt voneinander. Überall sind die Seto mit der Vorbereitung ihres wichtigsten Rituals beschäftigt: Schmuckschmiede, Seifenmacher, Köche und Sänger, sie alle wollen mithelfen, diesen besonderen Tag gebührend zu begehen. Schon die Kinder werden dabei mit den alten Traditionen vertraut gemacht. Der Festtag selbst ist dann endlich die Gelegenheit, die Trachten anzuziehen. Frauen zeigen ihren üppigsten Silberschmuck, Chöre singen alte Lieder. Und schließlich der Höhepunkt, das große Finale, nämlich die Wahl des Vizekönigs. Rein Järvelill gibt alles, um das Seto-Volk ein weiteres Mal hinter sich zu vereinen - seine Konkurrenten nicht minder DE 2020'
