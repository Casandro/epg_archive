  title: Planet Weltweit - Die letzten Walfänger der Beringsee
  subtitle: Planet Weltweit - Die letzten Walfänger der Beringsee
  description: 'Tschukotka ist eine fernab gelegene Region im Nordosten Russlands und kaum von Menschen besiedelt. Zehntausende Grauwale ziehen jedes Jahr im Sommer hier vor der Küste entlang. Ein natürlicher Zyklus, der seit Generationen auch das Leben der Ureinwohner bestimmt - der Tschuktschen. Die Jagd auf Wale ist ihr Leben. Den letzten Tschuktschen ist es von der Internationalen Walfangkommission gestattet worden, pro Jahr etwa 140 Grauwale zu erlegen. GEO Reportage war mit an Bord Tschukotka liegt direkt an der Beringstraße, nur einen Steinwurf entfernt von Alaska. Die Küste hier ist reich an Meeresbewohnern: Fische, Walrosse und Wale. Die Waljagd ist für die Tschukschen immer ein Ereignis. Denn ein Wal ist nicht nur Nahrung. Er steht auch für die Identifikation der Ureinwohner als Volk. Für die Tschuktschen ist die Jagd eine uralte Tradition. Nur durch die Wale wurde diese Küste seit Jahrtausenden zu ihrer Heimat. Heute versuchen die Tschuktschen, ihre Identität bewusst zu erhalten. Auch deshalb ist es den Älteren wichtig, der jeweils jüngeren Generation die Tradition des Walfangs beizubringen. Jetzt überträgt Tvol, ein erfahrener Jäger, sein Wissen an den 13-jährigen Rustam. Alle hier glauben, dass die Zukunft ihres Volkes von der Richtung abhängt, die der jungen Generation vorgegeben ist. Neben dem Fang der Wale gehört dazu auch die Kultur. Und die wird besonders am offiziellen Festtag in Tschukotka, dem "Tag des Walfangs", großgeschrieben. Alle beteiligen sich emsig an den Vorbereitungen. Wenn nur das Wetter mitspielt.  DE 2019'
