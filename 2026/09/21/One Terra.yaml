  description: Wagemutige Segelflieger suchen in in den argentinischen Anden die "perfekte Welle". Mit den sogenannten Leewellen gelingen Rekord-Segelflüge. Sie sind aber auch verantwortlich für zahlreiche Flugzeugabstürze. Eine kleine Gruppe Wissenschaftler und Piloten - unter ihnen der Weltrekord-Halter im Segelflug Klaus Ohlmann - ist aufgebrochen, um dieses gefährliche Windphänomen zu erkunden.  DE 2007
