  title: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  subtitle: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  description: 'Für seine ungewöhnlichen Methoden der Pferdezähmung ist der argentinische Pferdeflüsterer Oscar Scarpati in seinem Land und der ganzen Welt bekannt. Regelmäßig ist er mit seinen drei Söhnen Cristobal, Painé und Pincén auf Tour, gemeinsam geben sie Seminare, helfen bei Problemen zwischen Pferd und Besitzer und verbreiten ihre Philosophie der Gewaltlosigkeit. Wird es ihnen auch gelingen, argentinische Wildpferde zu zähmen? GEO Reportage hat den Pferdeflüsterer begleitet. Argentinien. Bis heute spielen Pferde hier eine wichtige Rolle, bei Arbeit und Vergnügen. Im Umgang mit ihren Reittieren sind die Gauchos und die Besitzer der riesigen Estancias nicht gerade zimperlich. Gerade bei der "Doma tradicional", dem traditionellen Zähmen und Zureiten, werden die Tiere hart an die Kandare genommen. Das versetzt die Tiere jedoch in Angst, ein Problem vieler Pferdebesitzer und eine Gefahr. Denn ein ängstliches, schreckhaftes Pferd wird in Stresssituationen schnell unberechenbar. Der Argentinier Oscar Scarpati verfolgt einen ganz anderen Ansatz, denn er versteht die Sprache der Pferde. Er weiß, wie sie sich ausdrücken: mit ihren Ohren, ihren Beinen, ihrem ganzen Körper. Der Pferdeflüsterer wendet diese Sprache selbst an, um mit den Tieren in Kontakt zu treten und sie so auf sanfte Art zu zähmen. Viele Probleme, sei es beim Zureiten besonders temperamentvoller Pferde oder in der Kommunikation zwischen einem Besitzer und seinem Pferd, konnte Oscar mit seinem Wissen und seiner Fähigkeit schon lösen. Der Wechsel zwischen Berührungen an den empfindlichsten Stellen und dem Beruhigen des Pferdes mindert Berührungsängste und die Scheu vor unerwarteten Reizen. Eine Methode, die immer wieder funktioniert. Der Erfolg gibt Oscar und seinen Söhnen recht. Pferde brauchen Verständnis, keine Gewalt! DE 2011'
