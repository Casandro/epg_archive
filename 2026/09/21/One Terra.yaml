  title: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  subtitle: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  description: |-
    Um kaum einen anderen Meeresbewohner ranken sich so viele Legenden wie um den Tintenfisch - vom Ungeheuer Skylla in Homers Odyssee bis zum Monster-Kraken bei Jules Verne. Für die Bewohner des Mittelmeerraumes spielen Tintenfische als Nahrungsquelle eine wichtige Rolle. Seit Jahrtausenden werden sie in Tunesien mit einer Technik gefangen, die bereits die Römer benutzt haben: Statt Netzen legen die Fischer Tonamphoren am Meeresboden aus. Mohammed Dahmen ist einer der letzten, der die schlauen Tiere mit dieser traditionellen Methode überlistet. Planet Weltweit ist mit ihm hinaus aufs Mittelmeer gefahren.

    Für Mohammed Dahmen hat sich niemals die Frage gestellt, ob er einen anderen Beruf ergreifen möchte. Seine Familie lebt seit Generationen traditionell vom Tintenfischfang. Selbst jetzt, wo die Tiere durch die Großfischerei immer seltener werden, hält der 78-jährige an seinem Beruf fest. Mohammed lebt mit seiner Familie auf den Kerkennah-Inseln. Bekannt wurden die Inseln durch den Feldherren Hannibal, der hier seinen Stützpunkt hatte, bevor er sich mit seinen Kriegs-Elefanten in Richtung Rom zog. Von der einstigen Bedeutung der Region ist nicht mehr viel übriggeblieben. Das Leben ist mühsam. Immer mehr der 7000 Einwohner verlassen die karge Heimat, um sich auf dem Festland eine Existenz aufzubauen. Viehzucht oder Ackerbau gibt es kaum, die meisten Lebensmittel müssen exportiert werden. Nur Tintenfische gab es über Jahrhunderte genug. Hier im Golf von Gabés an der tunesischen Ostküste werden 80 Prozent des gesamten landesweiten Tintenfischs gefangen. Seit der Römerzeit sind Tonamphoren eine effektive Fangmethode. Über 500 Amphoren werden an einer langen Schnur aneinandergeknotet und dann ins Wasser gelassen. Die Tintenfische, selber Räuber der Meere, verwechseln die dunklen Gefäße mit natürlichen, kleinen Höhlen, in die sie sich zurückziehen, um ihrer Beute aufzulauern. Der Fischer braucht sie dann nur noch an die Oberfläche zu ziehen. DE 2012
