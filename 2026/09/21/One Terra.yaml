  title: Planet Weltweit - Georgiens himmlische Klöster
  subtitle: Planet Weltweit - Georgiens himmlische Klöster
  description: 'Majestätisch thronen die Klöster Georgiens in der rauen Schönheit des Kaukasus, meist einsam und abgelegenen, oft in den Fels geschlagen. Die Klöster sind lebendige Zeugen der Anfänge der Christianisierung und damit auch der kulturellen Entwicklung der Menschheit. Seit der 1991 wiedererlangten Souveränität Georgiens bemühen sich Kirche und Staat, ihre alten Klöster wieder mit Leben zu erfüllen, sie vor weiterem Verfall zu bewahren, und zu restaurieren. Das ist, neben ihrer religiösen Bestimmung, heute die wichtigste Aufgabe der Mönche. Schon im ersten Jahrhundert entstanden nach dem Vorbild der urchristlichen Gemeinden von Antiochia und Jerusalem auch im heutigen Georgien erste urchristlichen Gemeinden. Bereits im Jahre 337 wurde in dem ostgeorgischen Königreich Kartli das Christentum zur Staatsreligion erhoben, lange vor der Christianisierung Europas. Die georgische orthodoxe Kirche ist autokephal, d.h. eigenständig. Damit konnten, vor allem in der Abgeschiedenheit der Klöster, viele alte kirchliche und kulturelle Traditionen, alte Produktions- und Lebensweisen bewahrt werden. Was auf die Betrachter aus der heutigen, schnelllebigen und technisierten Welt eine große Faszination ausübt. Auf dem Territorium des kleinen Staates, der nicht größer ist als das Bundesland Bayern, gab es vor der Sowjetherrschaft unzählige aktive Klöster. Nur wenige konnten bewahrt werden. Ihre kulturhistorisch wertvollen Bauten mit über 1000 Jahre alten Fresken und Ikonen wurden unter der kommunistischen Herrschaft entweiht: als Lagerhäuser, Viehställe oder Militärlager und Kasernen missbraucht. Immer wieder unternimmt Vater Artschil, ein junger Erzpriester, Reisen durch die Klöster des Landes. Er interessiert sich vor allem für die Entwicklung des klösterlichen Lebens, sowohl in religiöser als auch wirtschaftlicher Hinsicht. Welche Perspektive hat das traditionell so eng mit Georgien verflochtene Klosterleben in der heutigen Zeit? DE 2018'
