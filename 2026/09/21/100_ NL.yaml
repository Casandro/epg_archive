  title: Giorgio Hokstam
  subtitle: Bij Koen wordt je op een vlotte manier bijgepraat over het laatste (Nederlandse) nieuws. Voor de dagelijkse actualiteit, showbizz, sport én uiteraard de muziek en artiesten uit Nederland ben je bij Koen aan het juiste adres!
  description: '''Waar je mij voor mag wakker maken? Rijsttafel! Dat is er van jongs af aan met de rijstlepel ingegoten!''Bij Koen wordt je iedere dag op een vlotte manier bijgepraat over het laatste (Nederlandse) nieuws. Voor de dagelijkse actualiteit, showbizz, sport én uiteraard de muziek en artiesten uit Nederland ben je bij Koen aan het juiste adres! Kortom, alle ingrediënten om met een zonnig humeur de dag tegemoet te gaan.Alles over. Koen!Wat wilde je vroeger worden?Gezagvoerder bij KLM! Mijn opa nam mij vroeger als kleuter al mee naar Schiphol om naar vliegtuigen te gaan kijken én om zelfs een aantal keer samen te vliegen. Vanaf dat moment was ik verkocht. Het besturen van een gigantische Boeing of Airbus lijkt me nog steeds geweldig.Wat is jouw guilty pleasure?Rob de Nijs - Banger Hart! Dat was namelijk de eerste Nederlandstalige single die ik kocht van mijn eigen spaargeld. Des te leuker dat ik uitgerekend dit nummer van Rob de Nijs nog regelmatig draai op 100% NL!Hoe ziet jouw ideale ochtend eruit?Door lekker uit te slapen. Op zaterdag en zondag is het écht royaal uitslapen, zonder wekker, tot minimaal 12u ''s middags!Waar mogen wij jou voor wakker maken?Een rijsttafel, fantastische rode wijn en een zeecontainer Italiaans schepijs!Mijn verloofde komt uit Indonesië en kan fantastisch koken. En mijn vader kwam uit Nederlands-Indië, dus de Indonesische keuken is me letterlijk met de rijstlepel ingegoten!Wat weet Nederland nog niet van jou?Ik heb jarenlang gebasketbald! En dat terwijl ik maar 1.77m ben. Inmiddels ben ik helaas nauwelijks op en basketbalveldje te vinden haha.Krijg je geen genoeg van Koen?Stuur Koen een berichtje via de 100% NL app of volg Koen via Instagram, Twitter, of Facebook.Je hoort Koen maandag t/m vrijdag van 19.00-22.00 uur. (2026)'
