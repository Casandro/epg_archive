  description: '''Ik wilde vroeger Kabouter worden! Dan kon ik gaan wonen en werken in de Efteling, dat is toch fantastisch.''Dé presentator van de 100% NL Top 20? Dat is Colin Banks! Onze doorgewinterde radiomaker maakt al sinds april 2010 onderdeel uit van het team. Colin zorgt ervoor dat jij niks hoeft te missen tijdens jouw werkdag en altijd op de hoogte bent van dé 100% NL Top 20! Je hoort Colin Je hoort Colin iedere werkdag tussen 13.00 en 16.00 uur en op zaterdag tussen 15.00 en 17.00 uur. Alles over. Colin!Wat is jouw ultieme Guilty Pleasure? Hmm, dat kan maar 1 ding zijn. ontbijtkoek met pindakaas!Waar mogen wij jou écht voor wakker maken? Makkelijk! Een Formule 1 race. Ik volg alles op de voet, geen race gaat aan mij voorbij! Zelfs op vakantieadressen in het buitenland zorg ik ervoor dat ik niets hoef te missen. Wellicht tot irritatie van mijn vrouw haha.Wat is jouw favoriete Nederlandstalige nummer aller tijden? Dat is natuurlijk Het werd zomer - Rob de Nijs. Echt een klassieker!Wat wilde je vroeger worden? Kabouter! Want dan kon ik gaan wonen en werken in de Efteling, dat is toch fantastisch.Hoe ziet jouw ideale dag eruit? Op mijn ideale dag sta ik natuurlijk van vroeg tot laat op Zandvoort!Laatste vraag! Wat weet Nederland nog niet van jou? Ik ben PSO Marshall bij Zandvoort races waaronder F1. Dat betekend dat help bij het veilig laten verlopen van de races. Als Marshall sta ik bij de Pitlane en doe ik de starts! Dit houdt in dat ik o.a. moet zorgen dat alle auto''s goed opgesteld staan voor de lampen uitgaan. Krijg je geen genoeg van Colin?Stuur een berichtje via de 100% NL app of volg Colin via Instagram, Twitter, of Facebook.Colin hoor je iedere werkdag tussen 13.00 en 16.00 uur en op zaterdag tussen 15.00 en 17.00 uur. (2026)'
