  title: Eko zona
  subtitle: ' '
  description: Direktan odnos između proizvođača i krajnjeg potrošača u Hrvatskoj još je u povojima, dok u zemljama zapadne Europe postoji trend godišnjih pretplata na košarice s ekološkim proizvodima. Jedan od proizvođača koji svoje ekološke proizvode s imanja u Vojniću izravno prodaje kupcima jest Igor Zlojtro. On ne iscrpljuje resurse, već ih regenerira te nastoji povećati bioraznolikost usjeva.  Plitvička jezera ponos su Like. To je najstariji i najveći nacionalni park u Hrvatskoj. Tu je laskavu titulu, kao što je poznato, dobio još 1949. godine, a trideset godina kasnije upisan je i na UNESCO-ov popis svjetske baštine. U njegovu se sastavu nalazi i sekundarna prašuma.  Strane vijesti donose priču o krijumčarenju slonovače te o golemoj biljci, botaničarima poznatoj kao Titan Arum, podrijetlom iz prašuma Sumatre, koja cvjeta samo 48 sati.
