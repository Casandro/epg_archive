  description: 'Autor: Martin Kyšperský; Interpret: Vašek Kramář; Premiéra: 20.8.2026 * Hudebník, skladatel a muzikolog Václav Kramář představí v pořadu Jak se vám líbí dvě nová alba, na nichž po letech oživil tvorbu dvou svých někdejších kapel ? vysokoškolské Off Side Story a středoškolské The UniQues. Zavzpomíná na okolnosti vzniku původních písní, vysvětlí, proč se k nim po letech vrátil, a prozradí, jak se na nových nahrávkách podíleli někdejší spoluhráči i hosté z dnešní české hudební scény. Moderuje Martin Kyšperský. [of sajd story] [d junyks] '
