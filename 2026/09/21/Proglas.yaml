  description: 'Autor: Hana Pinknerová; Interpret: Jaroslava Cýrusová * Když jsem sama byla matkou malých dětí, často mi v zapeklitých výchovných situacích pomáhalo položit si otázku: Co je cílem výchovy? Dost mi to dávalo nadhled a poskytovalo orili výchovy ? samostatností dětí? Nebo má důslednost právě v této situaci dává v souvislosti s cílem větší smysl?Zvažovali jsme například, zda mladší dceru nutit do hudebních lekcí, protože ji zjevně nebavily, nerada cvičila a nijak se nám nedařilo probudit v ní nadšení pro hru na nějaký hudební nástroj. Do určitého věku jsme viděli, že cvičením na klavír se učí ještě i dalším dovednostem než jen vyťukávání nějakých písniček a prstových cvičení. Měli jsme za to, že tato pravidelná povinnost je součástí základního vzdělání a trvali jsme na pravidelném cvičení na klavír. Od šesté třídy jsme ji této povinnosti zprostili, protože si nepřála pokračovat. Tehdy se vzájemné dobré vztahy převážily. Cíl se změnil, protože s rostoucím věkem se změnily okolnosti.Tuto zkušenost zkouším aplikovat i na sebe. Mám se do něčeho pustit? Souvisí to nějak s cílem mého života? Co je vlastně cílem? Nezměnil se během plynoucího času a proměně okolností? A jenom tak nesměle se odvažuju optat: Bože, co je tvým cílem mé výchovy?'
