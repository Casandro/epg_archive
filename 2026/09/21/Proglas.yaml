  start: 2026-09-21T14:00:00Z
  stop: 2026-09-21T15:00:00Z
  title: Čaj do páté
  subtitle: Rytmy dějin - Rok 1976 (13. díl)
  description: 'Autor a interpret: Roman Kabelka * Po odmlce je tu zpět občasník Rytmy dějin, který tentokrát odstartuje poměrně zostra propagandistickou tiskovou konferencí. Tento pořad v rámci cyklu Čaj do páté se bude totiž věnovat roku 1976 a za leden bude zmíněn návrat agenta StB v řadách Rádia Svobodná Evropa ? Pavla Minaříka. Kromě tragédií, jež se nevyhýbají žádné době, je cítit ve veřejném prostoru na obou stranách železné opony jakási únava nejen z propagandy, ale i z terorismu a ropné krize. Události doprovodí populární písně ze švýcarské singlové hitparády, které jasně ilustrují trend melodického evropského popu a šlágru. Jedná se o singly dobře známé, neboť díky své nekonfliktnosti pronikaly i za železnou oponu formou oficiálních coververzí. Celé ohlédnutí uzavírá Daddy Cool od Boney M., což je pozoruhodný singl v tom, jak jeho neochvějná popularita napříč desetiletími je v přímém rozporu s hudební kritikou.'
  genre:
  - '99'
- eventId: 863909
  start: 2026-09-21T15:00:00Z
  stop: 2026-09-21T15:10:00Z
  title: Zprávy
  description: 'Autor: Český rozhlas Plus * Zprávy ? krátké zpravodajské relace vysíláme od pondělí do pátku v časech 7.00, 8.00, 10.00 (ČRo+), 13.00 (Zprávy Proglasu), 15.00, 17.00 a 20.00 hodin (ČRo+). V sobotu vysíláme zprávy v 15.00.'
  genre:
  - '32'
- eventId: 863910
  start: 2026-09-21T15:10:00Z
  stop: 2026-09-21T15:35:00Z
  title: Rudl
  subtitle: Po 169
  description: Rudl ? pořad, který bere do hry vás, posluchače, protože je to vzhledem k charakteru naší stanice věc naprosto zásadní. Jde o to, že Proglas je společné dílo tvůrců, posluchačů, přispěvatelů. Jeden bez druhého a třetího se neobejde. Inu, bavme se o něm. Bez obav, bez obalu, na rovinu. Pořad otázek a odpovědí, nápadů a konstruktivní kritiky. Rozvaha, upřímnost, dialog. Rudl. Každé pondělí v 17.10. Nebojte se ozvat.
