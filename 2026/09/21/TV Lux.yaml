  title: U Nikodéma
  subtitle: Náboženská publicistika na aktuálnu tému.
  description: Relácia U Nikodéma prináša hlboký pohľad na tému ochrany životného prostredia a obnovy harmonickej rovnováhy stvorenia. V nadväznosti na posolstvo pápeža Leva XIV. k Svetovému dňu modlitieb za ochranu stvorenia sa diskusia zamýšľa nad tým, ako úzko súvisí vonkajšia ekologická kríza s vnútornou nerovnováhou v ľudskom srdci. Moderátor Cyril Jančišin privíta v štúdiu odborníčku na ekologické témy Andreu Krátku, člena Environmentálnej subkomisie Konferencie biskupov Slovenska Dominika Letza a zástupkyňu hnutia eRko Moniku Vojtašákovú. Hostia spoločne hľadajú odpovede na pálčivé otázky spojené s výkyvmi počasia, letnými horúčavami a povodňami na Slovensku, no zároveň ponúkajú nádej v podobe konkrétnych projektov, iniciatív pre deti a rodiny či dlhodobých vizii pre spoločenstvá. Sledujte rozhovor o tom ako uzdravovať prírodu, ako uzdravovať ľudské srdce.
