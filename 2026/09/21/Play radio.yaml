  title: PLAY jutro
  subtitle: Ako se uzme u obzir da je multitalentovana Una Senić, između ostalog, i instruktorka plesa oko šipke, čini se da će uz(buđenje) naročito pripadnika jačeg pola uz Play jutro svakog radnog dana od 6h.
  description: 'Ako se uzme u obzir da je multitalentovana Una Senić, između ostalog, i instruktorka plesa oko šipke, čini se da će uz(buđenje) naročito pripadnika jačeg pola uz Play jutro svakog radnog dana od 6h do 10h biti nasmejanije, maštovitije I lepše. Una je instruktorka pole dance-a i suvlasnica "Poledance fitness kluba Beograd". Mnogo pre trikova na šipci, posvetila se se radu u medijima. Prvo medijsko iskustvo stekla je na Radiju 202 na kojem je kao devetogodišnjakinja bila angažovana u emisiji Klincijada 202?. Kasnije se sa radija Una "prebacuje na TV" u kojem (do)minira velike licencne formate poput X Faktora I Talent Show-a. Markantni glumac Zoran Pajić koji će svakodnevno od 6h do 10h biti "partner u buđenju" zanosnoj Uni Senić u okviru Play jutra, za sebe kaže: "Kao mali gutao sam filmovime i serije, odatle ljubav prema glumi. Završio Akademiju umetnosti u klasi prošesora Predraga Ejdusa. Tek tada sam skapirao da u glumi nema leba, ali je ljubav prema sceni bila jača".'
