  subtitle: Vierundzwanzig Stunden Wiesn
  description: 'Nicht alle Menschen, die sich in diesen 16 Tagen auf dem Münchner Oktoberfest befinden, vergnügen sich dort auch. Der Dokumentarbericht aus dem Jahr 1960 zeigt, wer alles zum Arbeiten auf der Wiesn ist: Straßenkehrer, Budenbesitzer, Polizisten, Hendlbrater ...Und wer damals klug genug war, sich nach etlichen Maß Bier nicht mehr mit dem Auto auf den Heimweg zu begeben, der konnte den Lotsendienst rufen und wurde mitsamt dem eigenen Auto nach Hause gebracht.'
