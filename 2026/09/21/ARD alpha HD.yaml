  title: Abenteuer Wildnis
  subtitle: Nationalparks der Zukunft - Seychellen
  description: Die Seychellen sind ein globaler Biodiversitäts-Hotspot. Die Vielfalt der Arten ist außergewöhnlich, vor allem unter Wasser. Ein Paradies für Meeresbiologen, Taucher und Fischer. Aber das Paradies ist durch Überfischung und Plastikmüll im Ozean bedroht. Außerdem wollte der hoch verschuldete Inselstaat auf dem Meeresboden nach Öl und Gas bohren lassen. Dann übernahm in einem einzigartigen Deal ein Konglomerat verschiedener Umweltschutzorganisationen rund um den Hollywoodstar Leonardo DiCaprio einen Teil der Staatsschulden. Mit den frei gewordenen Geldern sollen die Seychellen im Gegenzug ein gewaltiges Meeresschutzgebiet finanzieren.
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
- eventId: 463833
  start: 2026-09-21T19:45:00Z
  stop: 2026-09-21T20:15:00Z
  title: Seychellen - Das bedrohte Paradies
  description: 'Urlaub auf den Seychellen - oder gar dort heiraten? Die Inselgruppe ist für viele ein Traum, vor allem für Deutsche, die hier die Gästeliste zahlenmäßig anführen. Sie ist aber auch immer noch ein Traum für Naturschützer, die auf den Seychellen auch von der Regierung unterstützt werden. Obwohl das Archipel nur 0,13 Prozent der Landfläche Deutschlands hat, ist sein neues Meeresschutzgebiet größer als die Bundesrepublik. Und dennoch: Das Paradies ist bedroht. Die Reportage zeigt die Schönheit der Insel, mit ihren seltenen Tierarten, glücklichen Hochzeitspaaren und weißen Stränden.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
