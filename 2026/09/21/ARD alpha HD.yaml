  title: Die 4 Elemente (6/16)
  subtitle: Woher kommt das Wasser?
  description: Aus was besteht eigentlich die Welt? Dieser uralten Menschheitsfrage geht diese 16-teilige Sendereihe nach. Wie immer versteht es Harald Lesch, den Zuschauern auf unterhaltsame Weise auch die kompliziertesten Fragen zu beantworten. Die Sendereihe schlägt einen kultur- und naturwissenschaftlichen Bogen von den alten griechischen Philosophen, die mit ihrer Lehre von den vier Elementen und den Atomen den Grundstein für eine rationale Auseinandersetzung mit der Natur legten, bis zur modernen Lehre der Elementarteilchen und fundamentalen physikalischen Wechselwirkungen.
