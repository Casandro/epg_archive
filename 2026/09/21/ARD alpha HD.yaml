  title: Steffen Diemer - Vom Kriegsreporter zum Fotografen der Stille
  description: "Nach etlichen Jahren als Kriegsreporter fotografiert Steffen Diemer heute hauptsächlich Blüten-Stillleben per Nassplattencollodiumverfahren, so findet er seine innere Ruhe. \n\nDiemer schafft Bilder voller meditativer Ruhe: einen Blütenzweig, ein Glas Wasser, einen Laib Brot. Aufgenommen mit einem altertümlichen Verfahren, das keine Vervielfältigungen zulässt.\n\nSeine Fotografien sind Ergebnis eines radikalen Kurswechsels. Ein halbes Leben lang war Diemer als Kriegsberichterstatter an den Fronten der Welt unterwegs, bis ein schwerer Schlag sein Leben erschütterte."
