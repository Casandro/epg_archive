  description: Albert hat Alpträume. Er bekommt die schrecklichen Bilder einfach nicht aus dem Kopf. Während sich die Familie bereits auf seine Entlassung aus dem Krankenhaus freut, kann Albert das Geschehene nicht verwinden und fühlt sich schuldig. Er hat als Feuerwehrmann versagt. Und dieses Gefühl wird ihm auch die Tatsache nicht nehmen, dass er Tu und Leo das Leben gerettet hat. Die polizeilichen Ermittlungen gegen Eva sind mittlerweile eingestellt. Wenigstens eine gute Nachricht. Was im Löwen passiert ist, war ein Unfall, an dem niemand schuld ist. Die Schuldgefühle bleiben trotzdem.
