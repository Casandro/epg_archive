  title: Rund um den Michel - tierisch unterwegs in Hamburg
  subtitle: Tierisch unterwegs in Hamburg
  description: Hamburg ist bekannt für seine Elbe, den Hafen und natürlich für die tierischen Bewohner, die dieser Stadt einen ganz besonderen Charme verleihen. Aber nicht nur die Schwäne auf der Alster oder die Möwen am Fischmarkt zählen zu den tierischen Highlights - auch auf zwei Beinen gibt es in der Hansestadt so einige Experten, die die Bühne für die ganz besonderen Tiere der Stadt bereiten.
