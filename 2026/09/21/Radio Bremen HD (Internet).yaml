- eventId: 1083180
  start: 2026-09-21T04:20:00Z
  stop: 2026-09-21T04:50:00Z
  title: Wie geht das? Bier brauen
  description: 'Lars Großkurth ist kein gelernter Brauer und auch nicht handwerklich begabt. Trotzdem ist er unter die Craft-Bier-Brauer gegangen. "Craft" heißt Handwerk. Gemeint ist damit: Bier brauen wie Anno 1516, als auch das berühmte Reinheitsgebot entstand. Craft-Bier brauen ist weltweit im Trend. Eine Million Euro haben er und seine Mitstreiter in eine neue Brauerei investiert. Aber eigentlich weiß der Mann mit dem Faible für Risikosportarten noch nicht mal ob das Hallentor groß genug für den bestellten Maischebottich ist.'
  genre:
  - '144'
- eventId: 1083546
  start: 2026-09-21T04:50:00Z
  stop: 2026-09-21T05:20:00Z
  title: Die Fallers - Eine Schwarzwaldfamilie (1058)
  subtitle: Wer heilt, hat Recht
  description: Albert hat Alpträume. Er bekommt die schrecklichen Bilder einfach nicht aus dem Kopf. Während sich die Familie bereits auf seine Entlassung aus dem Krankenhaus freut, kann Albert das Geschehene nicht verwinden und fühlt sich schuldig. Er hat als Feuerwehrmann versagt. Und dieses Gefühl wird ihm auch die Tatsache nicht nehmen, dass er Tu und Leo das Leben gerettet hat. Die polizeilichen Ermittlungen gegen Eva sind mittlerweile eingestellt. Wenigstens eine gute Nachricht. Was im Löwen passiert ist, war ein Unfall, an dem niemand schuld ist. Die Schuldgefühle bleiben trotzdem.
- eventId: 1084025
