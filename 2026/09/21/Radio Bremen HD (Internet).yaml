- eventId: 1077033
  start: 2026-09-21T02:55:00Z
  stop: 2026-09-21T03:25:00Z
  title: 'Die Nordreportage: Die Landmaschinen-Spezialisten'
  subtitle: Notruf zur Erntezeit
  description: 'Spätestens ab Ende Mai ist die Familie der Henningsen Landtechnik aus Böklund im nördlichen Schleswig-Holstein im Dauereinsatz für die Bauern. Denn wenn die Grasernte beginnt, zählt jede Minute. Im 24-Stunden-Notdienst repariert Werkstattleiter Ole Henningsen Trecker und Landmaschinen aller Art, besorgt neue Teile und organisiert Ersatzmaschinen. Oles Vater Holger Henningsen und dessen Bruder Thorsten Henningsen kümmern sich derweil in der Firma um das Alltagsgeschäft: reparieren, kaufen, verkaufen.'
  genre:
  - '112'
- eventId: 1082860
  start: 2026-09-21T03:25:00Z
  stop: 2026-09-21T03:55:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  description: Im niedersächsischen Kölau brütet Geflügelzüchterin Christine Bremer fünf ganz besondere Eier. Es sind die Eier einer Laufente. Auf Hof Schmidt im schleswig-holsteinischen Sarnekow muss Landwirt Marko Ladewig eine Reparatur erledigen, die er schon lange vor sich hergeschoben hat. Bei einer der Nachlauftränken für die Hühner funktioniert die automatische Stoppfunktion nicht. Im Vorharz auf Hof Thudt gibt es Probleme mit Bulle Ferdinand. Er lahmt und hat womöglich ein Geschwür an einer Klaue. Auf dem Sophienhof in Mecklenburg-Vorpommern formt der Kartoffelhäufler den sogenannten Enddamm.
