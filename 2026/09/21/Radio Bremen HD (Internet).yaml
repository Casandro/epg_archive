- eventId: 1083180
  start: 2026-09-21T04:20:00Z
  stop: 2026-09-21T04:50:00Z
  title: Wie geht das? Bier brauen
  description: 'Lars Großkurth ist kein gelernter Brauer und auch nicht handwerklich begabt. Trotzdem ist er unter die Craft-Bier-Brauer gegangen. "Craft" heißt Handwerk. Gemeint ist damit: Bier brauen wie Anno 1516, als auch das berühmte Reinheitsgebot entstand. Craft-Bier brauen ist weltweit im Trend. Eine Million Euro haben er und seine Mitstreiter in eine neue Brauerei investiert. Aber eigentlich weiß der Mann mit dem Faible für Risikosportarten noch nicht mal ob das Hallentor groß genug für den bestellten Maischebottich ist.'
  genre:
  - '144'
