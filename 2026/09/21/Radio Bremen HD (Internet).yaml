  title: 'Die Nordreportage: Hofgeschichten'
  description: Im niedersächsischen Kölau brütet Geflügelzüchterin Christine Bremer fünf ganz besondere Eier. Es sind die Eier einer Laufente. Auf Hof Schmidt im schleswig-holsteinischen Sarnekow muss Landwirt Marko Ladewig eine Reparatur erledigen, die er schon lange vor sich hergeschoben hat. Bei einer der Nachlauftränken für die Hühner funktioniert die automatische Stoppfunktion nicht. Im Vorharz auf Hof Thudt gibt es Probleme mit Bulle Ferdinand. Er lahmt und hat womöglich ein Geschwür an einer Klaue. Auf dem Sophienhof in Mecklenburg-Vorpommern formt der Kartoffelhäufler den sogenannten Enddamm.
