  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Franz Schubert: "Rosamunde", Entr'acte Nr. 3 und Ballettmusik Nr. 1 (Kammerakademie Potsdam: Olof Boman); Robert Schumann: Aus "Album für die Jugend", op. 68 (Olli Mustonen, Klavier); Edvard Grieg: "Peer Gynt", Suite Nr. 1 (Deutsches Symphonie-Orchester Berlin: Pietari Inkinen); Gabriel Fauré: Pavane, op. 50 (Albrecht Mayer, Oboe; Kammerakademie Potsdam); Witold Lutoslawski: "Kleine Suite" (Deutsches Symphonie-Orchester Berlin: Michal Nesterowicz); Gustav Holst: "Die Planeten", op. 32 (Cantus Domus; Deutsches Symphonie-Orchester Berlin: Hannu Lintu)

    2.03  Das ARD-Nachtkonzert (II)

    Richard Wagner: "Tristan und Isolde", Vorspiel und Isoldes Liebestod (hr-Sinfonieorchester: Paavo Järvi); Ferruccio Busoni: "Una festa di villaggio", op. 9 (Ira Maria Witoschynskyj, Klavier); Samuel Barber: Violoncellokonzert, op. 22 (Jan Vogler, Violoncello; Rundfunk-Sinfonieorchester Saarbrücken: Thomas Sanderling); Arnold Bax: Quintett (Agnès Clément, Harfe; Aris Quartett); Charles-Marie Widor: Orgelsinfonie Nr. 3 e-Moll (Christian Schmitt, Orgel; Bamberger Symphoniker: Stefan Solyom)

    4.03  Das ARD-Nachtkonzert (III)

    Michail Glinka: "Ein Leben für den Zaren", Vier Tänze (Philharmonia Orchestra: Efrem Kurtz); Wolfgang Amadeus Mozart: Sonate D-Dur, KV 381 (Lucas und Arthur Jussen, Klavier); Pietro Nardini: Violinkonzert G-Dur (Giuliano Carmignola, Violine; Venice Baroque Orchestra: Andrea Marcon)

    5.03  Das ARD-Nachtkonzert (IV)

    Franz Krommer: Partita Es-Dur, Andante. Allegretto, op. 71 (Zürcher Bläseroktett); Francesco Maria Veracini: Ouvertüre Nr. 6 B-Dur (Musica Antiqua Köln: Reinhard Goebel); Émile Waldteufel: "Pluie d'or" (Orchestre Philharmonique de Strasbourg: Theodor Guschlbauer); Wolfgang Amadeus Mozart: Sonate F-Dur, Allegro assai, KV 332 (Grigorij Sokolow, Klavier); Charles Avison: Konzert Nr. 5 d-Moll (Café Zimmermann); Louise Farrenc: Sinfonie Nr. 1 c-Moll, Minuetto (Solistes Européens Luxembourg: Christoph König)
