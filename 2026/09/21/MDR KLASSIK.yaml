  stop: 2026-09-21T20:00:00Z
  title: MDR KLASSIK - Konzert
  description: "ARD-Konzert\n\nGeigerin Maria Dueñas in Ludwigsburg\n\nJohannes Brahms:  Violinkonzert D-Dur op. 77\nSergei Rachmaninow: Sinfonie Nr. 2 e-Moll op. 27\n\nMaria Dueñas, Violine\nEuropean Union Youth Orchestra \nLeitung: Elim Chan\n\n(Aufnahme v. 05.08.26, Ludwigsburg, Forum am Schlosspark\n - Ludwigsburger Schlossfestspiele)\n\n\nDie spanische Geigerin Maria Dueñas war 18, als sie den Internationalen Menuhin\nWettbewerb gewann. Die Folgen: Exklusivvertrag bei der Deutschen Grammophon,\nStradivari-Geige und ein Generalschlüssel für die großen Konzertbühnen Europas. Den\nbesitzt auch die Dirigentin Elim Chan. In Hong Kong gebürtig, in den USA ausgebildet,\nübernimmt sie ab 2027 als Chefdirigentin das San Francisco Symphony Orchestra\nnachdem sie in London u. a. die First und Last Night of the Proms dirigiert hat. Bei der \"Last\nNight\" der Ludwigsburger Schlossfestspiele steht sie an der Spitze des European Union\nYouth Orchestras; hier spielen 120 junge Musiker*innen aus allen EU-Mitgliedsstaaten.\nAltersgrenze: 26."
