  subtitle: Ekipa geotechniczna dowierca się do pustej przestrzeni w "dziurze z pieniędzmi". Odkrycie zagubionego przedmiotu silnie wpływa na jednego z ocalałych członków legendarnej rodziny Restallów.
  description: |-
