    Seria dokumentalna bada, jak wyglądałaby nasza planeta, gdyby zabrakło na niej ludzi oraz jak zmieniłaby się przez kolejne dni, tygodnie, miesiące, lata czy milenia od zniknięcia człowieka. Autorzy filmu próbują znaleźć odpowiedzi na te pytania w oparciu o wiedzę ekspertów z takich dziedzin jak inżynieria, botanika, ekologia, biologia, geologia, klimatologia i archeologia.
