    Tytuł oryginalny: Polska. Największe tajemnice
    PL, 2026
    Program analizuje niezwykłe przypadki medyczne, w tym udokumentowane sytuacje wybudzenia osób uznanych za zmarłe. Przybliża także historię objawień maryjnych w Oławie związanych z Kazimierzem Domańskim oraz zagadkę zniknięcia jednego z najbardziej rozpoznawalnych polskich inwestorów kryptowalutowych. W odcinku pojawiają się również niewyjaśnione okoliczności śmierci Jolanty Brzeskiej, tajemnice klasztoru w Lubiążu oraz głośna relacja o rzekomym lądowaniu UFO w Emilcinie.
