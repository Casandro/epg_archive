  description: '"Als Feuer vom Himmel fiel - Der Bombenkrieg in Deutschland - Operation Gomoniha" beleuchtet die Strategie und Durchführung alliierter Luftangriffe im Zweiten Weltkrieg. Diese Operation zielte darauf ab, die deutsche Industrie und Infrastruktur zu schwächen und den Widerstand der Zivilbevölkerung zu brechen. Die Dokumentation zeigt die verheerenden Auswirkungen dieser Angriffe auf die deutschen Städte und die Kriegsführung der Nazis.'
