  subtitle: Vietnam - Krieg ohne Fronten - Der Wendepunkt
  description: Das sogenannte Tet-Fest, das Neujahrsfest, führte die Wende im Vietnamkrieg herbei. Die Vietcong starteten zusammen mit den nordvietnamesischen Truppen eine Großoffensive gegen die Amerikaner. Militärisch war es zwar ein Sieg für die USA, doch die öffentliche Unterstützung für den Krieg hatte ernste Risse bekommen.
