  title: Helden der Evolution - Antilopen
  subtitle: Helden der Evolution - Antilopen
  description: Rund 90 Antilopenarten gibt es auf der Erde. 70 davon sind in der Wildnis Afrikas zu Hause. So folgt die Kamera den schlanken Impalas und den hochbeinigen Leierantilopen. Sie hält außerdem die Wandungen der gigantischen Gnuherden fest, unter deren Hufen der Boden der Savanne erbebt. Dabei zeigen die Filmemacher diese und viele weitere faszinierende Antilopen in ihrer ganzen Vielfalt und nicht zuletzt ihrer bezaubernden Grazie und Eleganz.
