  title: phoenix plus
  subtitle: Berlin Code - Sonderausgabe nach den Landtagswahlen
  description: |-
    Drei Wahlen in zwei Wochen komplett vergeigt - und was fast keiner erwartet hätte, ist in Mecklenburg-Vorpommern Realität geworden: Die CDU ist erstmals aus einem Landtag geflogen, in Berlin ist sie ihre Mehrheit los.

    Der Kanzler hat schon kurz nach Schließung der Wahllokale (an-)gesagt: Ich bleibe Kanzler. Kann er das wirklich? Was passiert gerade in der Union? Und was beim Koalitionspartner SPD, der in Berlin ebenfalls eine schlimme Niederlage kassiert hat? Wie stabil ist diese Regierung - und wie geht sie mit den Wahlgewinnern AfD und Linke um?
