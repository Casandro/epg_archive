  subtitle: Deutschland im Herbst - Wie weiter nach den Wahlen?
  description: |-
    Super-Gau für die CDU bei den Landtagswahlen: In Mecklenburg-Vorpommern fliegt sie erstmals aus einem Landesparlament und in Berlin verliert sie klar gegen die Linke. Der Druck auf den bereits angeschlagenen Kanzler und CDU-Chef Friedrich Merz dürfte damit weiter steigen - doch er macht noch am Abend deutlich, dass er weitermachen will. Wie geht es nun weiter - in den Ländern und vor allem im Bund?
    Nach der Landtagswahl in Mecklenburg-Vorpommern und der Abgeordnetenhauswahl in Berlin diskutiert Thomas G. Becker mit:
