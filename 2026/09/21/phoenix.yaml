  title: Unter Krokodilen
  subtitle: Westaustraliens Nationalpark Mitchel River
  description: 'Der Mitchell-River Nationalpark liegt im Land der Aborigines. Mit dem Wissen und Schutz ihrer Ahnen bekommen sie verheerende Flächenbrände unter Kontrolle. Die Schöpfergeister Wandjina, die an Felswände gemalt sind, beobachten sie dabei. Sie bedeuten den Ureinwohnern alles. Familien Zusammenkünfte heißen bei den Aborigines: Corroborrees und sind eine Mischung aus Tanz, Ahnenkult und Festmahl. Cathy, die Älteste der Kimberley-Familie, erzählt die Geschichte von Wungurr, der Regenbogenschlange. Und Miles versucht die wilden Süßwasserkrokodile vor hochgiftigen Kröten zu beschützen, indem er sie trainiert.'
