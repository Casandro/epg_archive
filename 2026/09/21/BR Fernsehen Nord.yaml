  description: "Für die erste Mahler-Zusammenarbeit zwischen Dirigent und Orchester steht das monumentale Werk \"Das Lied von der Erde\" auf dem Programm. Die Symphonie für eine Tenor- und eine Alt- (oder Bariton-) Stimme und großes Orchester beschwört in sechs Sätzen vom \"Trinklied vom Jammer der Erde\" bis zum \"Abschied\" die Schönheit und Zerrissenheit des Kosmos des menschlichen Lebens in vielfältigsten Farben. \nIn den beiden Gesangspartien sind die tschechische Mezzosopranistin Magdalena Kozená und der australische Tenor Stuart Skelton zu erleben."
