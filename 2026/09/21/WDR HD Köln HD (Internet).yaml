- eventId: 1084045
  start: 2026-09-21T05:35:00Z
  stop: 2026-09-21T05:45:00Z
  title: 'planet schule: Nigeria (1/3)'
  description: |-
    Wie lebt es sich in Lagos, einer Millionenmetropole in Nigeria?
    Wier leben die Schwestern Claire und Anjola mit ihrer Familie. Claire studiert, Anjola geht noch zur Schule. Die beiden verbringen gerne Zeit miteinander, gehen auf den Markt oder in den Supermarkt. Durch die hohen Benzinpreise ist auch das Busfahren sehr teuer geworden, deshalb sind die beiden oft zu Fuß unterwegs. Trotz wirtschaftlicher Unsicherheit schauen sie mit Zuversicht auf ihre Zukunft.
