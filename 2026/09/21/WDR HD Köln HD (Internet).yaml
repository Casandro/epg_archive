  title: Wissen macht Ah! - Dusche nie!
  subtitle: 'Moderation: Ralph Caspers und Clarissa Corrêa da Silva'
  description: Ralph hat eine Schreibblockade. Für die heutige Sendung ist ihm rein gar nichts eingefallen. Und was macht Ralph dann? Er geht duschen, denn da hat er immer die besten Ideen. Was für ein Zufall, dass mitten im Studio eine Duschkabine steht! Clarissa nimmt die Zuschauer einfach mit in die Dusche, die eigentlich gar keine ist, und während sie in den feuchten Nebelschwaden Ralph beim Tischtennisspielen entdeckt, gibt es noch die Antworten auf folgende Fragen.
