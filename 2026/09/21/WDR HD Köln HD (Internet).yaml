  title: Garten & Lecker (2)
  subtitle: Natur - Moosgarten in Staudernheim
  description: |-
    Ein ehemaliger Sandsteinbruch an der Nahe in Rheinland-Pfalz ist das Ziel der zweiten "Garten & Lecker"- Reise. Dieses einst zugewucherte und unwegsame Gelände haben die "Naturgärtner" Ursula Altmoos und ihr Mann Michael in harter Arbeit in ein Wildgartenparadies verwandelt.
    Ihr Garten-Fest-Motto lautet: "Zwischen Moos und Flügelschlag". Als Vorspeise gibt es Zucchiniröllchen und Mangoldtaschen mit Ziegenkäse gefüllt, dazu gegrillte Tomaten. Zum Hauptgang serviert Ursula einen Salat aus dem eigenen Garten, dazu eine Knoblauchrauken-Bärlauch-Quiche. Und zum Nachtisch gibt es eine Holunder-Frischkäse-Torte.
- eventId: 1087412
