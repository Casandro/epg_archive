  title: Land & lecker
  subtitle: Wer kocht das beste Landmenü?
  description: |-
    Im großen Finale von Land & lecker empfängt Obstbäuerin Marlen Baumann ihre Gäste auf dem traditionsreichen Wardmanshof in Rees am Niederrhein. Zwischen blühenden Obstplantagen, Rheinlandschaft und Familiengeschichte zeigt die 40-Jährige, wie viel Leidenschaft, Mut und Handarbeit in jedem einzelnen Apfel stecken.
    Marlen kreiert ein Menü, das ihre Leidenschaft für heimisches Obst widerspiegelt: Zum Auftakt serviert sie Omas Kartoffelsalat mit Kichererbsen, Kürbis und Äpfeln. Es folgt Pinsa mit Ziegenkäse und Birne und Salat mit Ziegenfrischkäse und Apfel. Den süßen Abschluss bildet ein Ernteapfel mit Bourbon-Vanille.
