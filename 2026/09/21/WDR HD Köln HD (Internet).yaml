  description: 'Bei den Ermittlungen zum Tod eines Ehepaares sind Günter und Edwin völlig unterschiedlicher Meinung: Während Günter an einen gemeinsamen Selbstmord des Paares aufgrund einer Alzheimer-Erkrankung des Ehemannes glaubt, geht Edwin von einem Mord aus. Edwin und Günter versteigen sich in eine absurde Wette hinsichtlich des Tathergangs: Der Verlierer muss sich den Schnauzbart abrasieren. Auch Vicky, die eher Günters Meinung ist, und Hui, der auf Edwins Seite ist, werden in den Streit hineingezogen.'
