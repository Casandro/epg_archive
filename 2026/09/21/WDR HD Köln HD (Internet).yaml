  title: 'planet schule: Nigeria (1/3)'
  description: |-
    Wie lebt es sich in Lagos, einer Millionenmetropole in Nigeria?
    Wier leben die Schwestern Claire und Anjola mit ihrer Familie. Claire studiert, Anjola geht noch zur Schule. Die beiden verbringen gerne Zeit miteinander, gehen auf den Markt oder in den Supermarkt. Durch die hohen Benzinpreise ist auch das Busfahren sehr teuer geworden, deshalb sind die beiden oft zu Fuß unterwegs. Trotz wirtschaftlicher Unsicherheit schauen sie mit Zuversicht auf ihre Zukunft.
- eventId: 1084501
  start: 2026-09-21T05:45:00Z
  stop: 2026-09-21T05:55:00Z
  title: 'planet schule: Nigeria (2/3)'
  description: 'Lagos ist eine Stadt der Gegensätze: Über 30 Millionen Menschen leben in Nigerias Wirtschaftsmetropole an der Südküste des Landes, wo der Alltag oft von Wohnungsnot, Jobsuche und der Suche nach Perspektiven geprägt ist. Mitten in dieser riesigen Stadt lebt der 28-jährige Soziologiestudent Musodiq, der sich besonders für die Geschichte seines Landes interessiert.'
- eventId: 1084593
  start: 2026-09-21T05:55:00Z
  stop: 2026-09-21T06:05:00Z
  title: 'planet schule: Nigeria (3/3)'
  description: |-
    Viele Frauen im Norden Nigerias leben in schwierigen wirtschaftlichen Verhältnissen. In der Region rund um Bauchi begleitet der Film Khadija, Hadiza und weitere Frauen, die mit Unterstützung lokaler Projekte neue Perspektiven gewinnen.
    Das Developement Exchange Center unterstützt sie bei der Ausbildung und dem Weg zu wirtschaftlicher Unabhängigkeit.
- eventId: 1084794
  start: 2026-09-21T06:05:00Z
  stop: 2026-09-21T06:20:00Z
  title: 'planet schule: Ruanda - Versöhnung nach dem Völkermord?'
  description: |-
    Im Jahr 1994 werden in Ruanda über 800 000 Menschen umgebracht. Die Täter sind Hutu, sie töten ihre Mitbürger, die Tutsi sind. Hutu und Tutsi sind die beiden größten ethnischen Gruppen in Ruanda. Es ist ein Völkermord, mit Unterstützung der damaligen Regierung. Bis heute prägt der Genozid die Gesellschaft Ruandas.
    Vedaste und Solange, ein junges Paar, sind eng verbunden mit der Geschichte des Landes. Solange ist Tutsi, Vedaste ist Hutu. Solanges Mutter gehört zu den Opfern des Völkermordes, Vedastes Vater zu den Tätern. Er war beteiligt am Mord an Solanges Tante.
- eventId: 1084836
  start: 2026-09-21T06:20:00Z
  stop: 2026-09-21T06:35:00Z
  title: 'planet schule: Woher wissen wir das? - Was ist eine Art?'
  description: 'Wie definieren Biologen eine Tier- oder Pflanzenart? Klassisch gilt: Lebewesen gehören zur gleichen Art, wenn sie sich miteinander fortpflanzen können und ihr Nachwuchs fruchtbar ist. Doch es gibt Ausnahmen: Dr. Martin Päckert vom Senckenberg-Institut in Dresden untersucht beispielsweise die Hybridbildung zwischen Raben- und Nebelkrähen, die sich entlang der Elbe vermischen und sogenannte "Rackelkrähen" hervorbringen.'
