  title: 'Expedition in die Heimat: Mit dem Zug nach Basel'
  subtitle: 'Moderation: Annette Krause'
  description: 'Weil die Baseler:innen ihren Rhein lieben, sind sie an warmen Tagen mit dem sogenannten Wickelfisch unterwegs: einem wasserdichten Beutel, in dem die Klamotten verstaut werden. Auf diese Weise werden die gemütlichen Buvetten am Rheinufer besucht, kleine, feine Imbissbuden. Bei einer Führung durch das eindrucksvolle Areal des Novartis Campus geht es auch zur interaktiven Ausstellung "Wonders of Medicine", in der die Besucher:innen vieles über den Stand medizinischer Forschung erfahren. Larvenmacher:innen und Laternenkünstler:innen erklären der Moderatorin ihr faszinierendes Handwerk und die Magie der legendären Baseler Fasnacht.'
