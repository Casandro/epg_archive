- eventId: 1082093
  start: 2026-09-21T03:15:00Z
  stop: 2026-09-21T04:00:00Z
  title: 50 Jahre Kölner Treff - die Doku
  description: |-
    Zum 50. Geburtstag des Kölner Treff nimmt die 45-minütige Dokumentation die Zuschauerinnen und Zuschauer mit auf eine Reise durch fünf Jahrzehnte Fernseh- und Zeitgeschichte. Im Mittelpunkt steht eine Sendung, die Generationen von Gästen, Themen und Publikum geprägt hat - und dabei immer auch ein Spiegel ihrer Zeit war.

    Susan Link und Micky Beisenherz begleiten den Rückblick und öffnen den Blick auf prägende Gespräche, außergewöhnliche Gäste und Augenblicke, die im Gedächtnis geblieben sind.
- eventId: 1082842
  start: 2026-09-21T04:00:00Z
  stop: 2026-09-21T04:40:00Z
  title: Presseclub
  subtitle: 'Tanken und Heizen am Limit: Was hilft gegen die hohen Preise?'
  description: |-
    Wie können Autofahrer und Unternehmen angesichts der hohen Spritpreise entlastet werden? Warum sind die Benzinpreise europaweit so unterschiedlich und was können wir von unseren Nachbarn lernen? Spritpreisdeckel oder Übergewinnsteuer - welche Maßnahme kann kurzfristig helfen? Auch die Preise von Gas und Heizöl explodieren - stehen wir vor einem Winter der Energiekrisen? Und wie kann Deutschland sich langfristig unabhängiger machen von fossiler Energie?

    Darüber diskutiert WDR-Chefredakteurin Ellen Ehni mit den Gästen:
    * Jasper Bitter, BILD
    * Christian Feld, Westdeutscher Rundfunk
    * Antje Höning, Rheinische Post
    * Anja Krüger, taz
