  stop: 2026-09-21T06:35:00Z
  title: 'planet schule: Woher wissen wir das? - Was ist eine Art?'
  description: 'Wie definieren Biologen eine Tier- oder Pflanzenart? Klassisch gilt: Lebewesen gehören zur gleichen Art, wenn sie sich miteinander fortpflanzen können und ihr Nachwuchs fruchtbar ist. Doch es gibt Ausnahmen: Dr. Martin Päckert vom Senckenberg-Institut in Dresden untersucht beispielsweise die Hybridbildung zwischen Raben- und Nebelkrähen, die sich entlang der Elbe vermischen und sogenannte "Rackelkrähen" hervorbringen.'
