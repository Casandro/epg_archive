  title: Presseclub
  subtitle: 'Tanken und Heizen am Limit: Was hilft gegen die hohen Preise?'
  description: |-
    Wie können Autofahrer und Unternehmen angesichts der hohen Spritpreise entlastet werden? Warum sind die Benzinpreise europaweit so unterschiedlich und was können wir von unseren Nachbarn lernen? Spritpreisdeckel oder Übergewinnsteuer - welche Maßnahme kann kurzfristig helfen? Auch die Preise von Gas und Heizöl explodieren - stehen wir vor einem Winter der Energiekrisen? Und wie kann Deutschland sich langfristig unabhängiger machen von fossiler Energie?

    Darüber diskutiert WDR-Chefredakteurin Ellen Ehni mit den Gästen:
    * Jasper Bitter, BILD
    * Christian Feld, Westdeutscher Rundfunk
    * Antje Höning, Rheinische Post
    * Anja Krüger, taz
