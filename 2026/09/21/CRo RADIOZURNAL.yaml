  description: Kdo a s jakým programem chce vést třetí největší město Česka? Jak mohou Ostravě pomoci projekty jako je černá kostka, dostavba koncertního sálu nebo nový stadion na Bazalech? Jak život v moravskoslezské metropoli komplikují ekologické zátěže z minulosti? A čím by mohli politici přesvědčit mladé lidi, aby z Ostravy neodcházeli? Odpovídá Lukáš Vomlela, Ondřej Slach a Nicole Horáková Hirschlerová. Moderuje Tomáš Pancíř.
