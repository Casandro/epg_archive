  title: 'Archéologie au Québec / Réplication / Arctique '
  subtitle: 'Au sommaire : faut-il revoir l''approche de l''archéologie au Québec ; les jeux de la réplication, études à l''épreuve ; mystère Arct '
  description: "Au sommaire :\n\nFaut-il revoir l'approche de l'archéologie au Québec ?\nAu Québec, d'importants sites archéologiques restent à explorer. Des fouilles menées en 2025 sur des sites autochtones ancestraux amènent des archéologues à s'interroger sur l'approche de la discipline : à qui devrait appartenir le patrimoine archéologique ?\n\nLes jeux de la réplication : études à l'épreuve\nDes études scientifiques se multiplient, un peu partout sur la planète. La qualité de ces études est variable, et certaines disciplines sont plus affectées que d'autres. Un phénomène connu depuis longtemps dans le milieu de la recherche...\n\nMystère Arctique\nLe brise-glace « Amundsen » s'est rendu en Arctique pour mener une expédition cruciale afin d'étudier les micro-organismes sous la glace. Et les découvertes des scientifiques pourraient changer notre compréhension du rôle de l'océan Arctique dans la régulation du climat de la planète.\n\nPrésentation : Catherine Gauthier\n "
  ageRating: 7
