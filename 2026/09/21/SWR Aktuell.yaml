  title: SWR Aktuell Langstrecke
  description: "14:00\n11KM: der tagesschau-Podcast\nWie Israel Social Media als Kriegsfront nutzt\nBenjamin Netanjahu hat Social Media zur achten Front im Krieg erklärt. Damit rechtfertigt er Kampagnen Israels, die auch bewusste Desinformation beinhalten. Umgerechnet 600 Millionen Euro hat die israelische Regierung 2026 für ihre Hasbara, also die Beeinflussung der öffentlichen Meinung, eingeplant.  \nARD-Korrespondent Jan-Christoph Kitzler in Tel Aviv hat sich das System Hasbara genauer angeschaut. Mit ihm klären wir in dieser Folge, wie die israelische Regierung ihr Vorgehen rechtfertigt und welche Auswirkungen das bis nach Deutschland hat. \nHost: Elena Kuch\nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/\n\n14:30\nSWR Kultur Das Wissen\nLogisches Denken ohne Menschen - KI in der Mathematik\nKünstliche Intelligenz glänzt in der Mathe-Olympiade und kann mathematische Beweise führen. Wissenschaft und Schulunterricht können davon profitieren - dürfen sich das logische Denken dabei aber nicht abnehmen lassen.\nVon Christoph Drösser (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
