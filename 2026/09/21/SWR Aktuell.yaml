  title: ARD Infoabend
  description: "20:00h \nTagesschau - Die Themen des Tages aus Deutschland und der Welt erfahren Sie kompakt zusammengefasst in 15 Minuten.\n\n20:15h - 22:00h \n\"Mitreden! Deutschland diskutiert\" - Nach den Wahlen: Was muss Merz jetzt ändern?\nDas Wahlergebnis in Sachsen-Anhalt war ein Denkzettel für die Politik der Bundesregierung. Jetzt blicken alle gespannt auf die Parlamentswahlen in Mecklenburg-Vorpommern und Berlin. Die Frage steht im Raum: Muss die schwarz-rote Koalition im Bundestag ihren Kurs ändern oder jetzt erst recht die angekündigten Reformen umsetzen? Und: Wird sie das weiter unter einem Kanzler Merz tun? \n \nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html"
