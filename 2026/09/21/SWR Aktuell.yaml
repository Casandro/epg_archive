- eventId: 533827
  start: 2026-09-21T16:30:00Z
  stop: 2026-09-21T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Weg von Google und Paypal - Wie die EU digital unabhängiger werden will
  description: |-
    Von Jörg Hommer
    Die gängigen digitalen Dienstleistungen kommen in der Regel von US-amerikanischen Big-Tech-Unternehmen wie Alphabet oder Meta. Unter Trump ist das ein Problem. Um die Abhängigkeit von Google, Paypal und Co. zu verringern, arbeiten europäische Unternehmen schon seit Längerem an alternativen Angeboten - dazu gehören Suchmaschinen wie ecosia.org oder das Bezahlsystem WERO, aber auch der Neubau gigantischer Rechenzentren für eigenständige Cloud-Speicher. Nur: Um sich durchzusetzen, müssen die Anwendungen wachsen und brauchen viel mehr User. (SWR März 2026)
- eventId: 533828
  start: 2026-09-21T17:00:00Z
  stop: 2026-09-21T18:00:00Z
  title: Der Tag
  description: 'Nach der Wahl in Sachsen-Anhalt richtet sich die politische Aufmerksamkeit erneut auf den Osten: Bei der Landtagswahl in Mecklenburg-Vorpommern geht es um weit mehr als um Mehrheiten im Schweriner Landtag. Voraus ging der wohl polarisierteste Wahlkampf, den das Bundesland an der Ostsee je erlebt hat. Lange lag die SPD hinter der AfD, zuletzt prognostizierten Umfragen ein Kopf-an-Kopf-Rennen. Die amtierende Ministerpräsidentin Manuela Schwesig positionierte sich als "Frau gegen Blau" und führte einen Wahlkampf, den die SPD lange nicht gesehen hat.'
  subtitle: Im Osten nichts Neues? Mecklenburg-Vorpommern hat gewählt
