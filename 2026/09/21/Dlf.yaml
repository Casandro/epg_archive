  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nNach den Wahlen: Welchen Einfluss hat Religion auf das Ergebnis?\nIn Mecklenburg-Vorpommern und in Berlin wird am Sonntag gewählt. Im Gespräch erklärt der Religionssoziologe Gert Pickel, wie Christen, Muslime und Juden gewählt haben und wie sich die Kirchen und jüdische und muslimische Gemeinden politisch positionieren. \n\nJom Kippur - Wenn ein ganzes Land den Atem anhält\nDas Land steht still: Am Sonntagabend beginnt mit Jom Kippur der höchste jüdische Feiertag. Für 24 Stunden ruht in Israel das öffentliche Leben. Doch die tiefen gesellschaftlichen Spannungen im Land sind dennoch zu spüren. \n\nYoga-Serie Teil 1: Wer war Patanjali, der Vater der Yoga-Philosophie?\nIn unserer vierteiligen Serie über Yoga geht es im ersten Teil um die Ursprünge der philosophischen Lehre aus Indien. Sie geht zurück auf den indischen Gelehrten Pantanjali und sein Yogasutra. Das ist eine Schrift, die vor 1600 Jahren verfasst wurde und bis heute als Standardwerk der Yoga-Philosophie \n\nAm Mikrofon: Susanne Fritz"
