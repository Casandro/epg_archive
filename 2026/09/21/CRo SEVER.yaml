  title: Host Dopoledního expresu
  description: Štěnice v bytech i na cestách. Boj s nimi bývá zdlouhavý. Hostem Dopoledního expresu bude MUDr. Eva Patrasová, ředitelka protiepidemického odboru Krajské hygienické stanice v Ústí nad Labem. Vysvětlí, jak štěnice včas rozpoznat, jaká zdravotní rizika představují a proč jejich výskyt nutně neznamená špatnou hygienu. Dozvíte se, jaké jsou nejčastější mýty spojené s tímto hmyzem a jak účinně postupovat, pokud na ně doma narazíte. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Lenka Šobová.
