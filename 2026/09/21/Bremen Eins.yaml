  title: Bang Boom Böhling
  subtitle: mit Dirk Böhling
  description: 'Die "Sound meines Lebens"-Show: Dirk Böhling geht mit den Hörerinnen und Hörern auf eine Zeitreise. Wer hatte früher eine "Vokuhila"-Frisur und Schulterpolster im Sakko? Welche Spiele wurden bei den Kindergeburtstagen gespielt? Zu welcher Musik wurde zum ersten Mal geknutscht und was waren die absolut angesagten Läden? Dazu gibt es ein Wiederhören mit berühmten Fernseh-Musiken und Zitaten, und in jeder Sendung einen (fast) vergessenen Song aus den 80ern (Lost in 80s)...'
  genre:
  - '32'
- eventId: 534922
  start: 2026-09-21T20:00:00Z
  stop: 2026-09-21T22:00:00Z
  title: Musikclub 80er
  description: Kaum ein Jahrzehnt war musikalisch so vielfältig wie die 80er. Von Post-Punk bis New Wave, von Hard Rock bis Heavy Metal, von Euro-Disco bis Acid-House, vom Bubblegum-Pop bis zum Protestlied. Der HipHop wurde in den 80ern geboren, ebenso wie die Neue Deutsche Welle. Die Bands hießen Depeche Mode, U2 oder Duran Duran. David Bowie arbeitet mit Queen und Mick Jagger. Phil Collins macht erfolgreich Soloplatten. All die großen Kulthits spielen wir im Musikclub 80er ebenso wie selten gespielte Perlen oder wiederentdeckte Hits.
- eventId: 535228
