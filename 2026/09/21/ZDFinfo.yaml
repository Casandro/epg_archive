  title: Ägyptens Mumien
  subtitle: Der Weg zur Unsterblichkeit
  description: |-
    Frankreich 2026
    Ägyptens Bestattungsrituale geben bis heute Rätsel auf. Besonders die Mumien. Wer waren die Verstorbenen? Warum wurden sie mumifiziert - und mit welchen Rezepturen?

    Modernste Technologie soll Antworten liefern: CT-Scans, Analysen und Detektivarbeit im Labor. Interdisziplinäre Teams aus Radiologen, Archäologen und Ägyptologen begeben sich gemeinsam auf Spurensuche.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
- eventId: 969243
  start: 2026-09-21T02:20:00Z
  stop: 2026-09-21T03:05:00Z
  title: Ägyptens Mumien
  subtitle: Die Kunst der Mumifizierung
  description: |-
    Frankreich 2026
    2016 sorgt ein Sensationsfund in Sakkara für Aufsehen: In 13 Metern Tiefe entdecken Archäologen eine Mumifizierungswerkstatt. Kann der Fund mehr über die Praxis der Balsamierung verraten?

    Die Mumifizierung mit Salben und Tinkturen sollte den Verstorbenen das Weiterleben im Jenseits sichern. Grabbeigaben und kunstvolle Malereien auf Sarkophagen und in den Grabkammern sollten sie schützen auf der Reise ins Reich des Gottes Osiris.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
- eventId: 969244
  start: 2026-09-21T03:05:00Z
  stop: 2026-09-21T03:50:00Z
  title: Ägyptens Mumien
  subtitle: Die geheimen Rituale
  description: |-
    Frankreich 2026
    Die Faszination für das alte Ägypten lebt weiter. Bahnbrechende Entdeckungen und modernste Technik eröffnen der Forschung neue Perspektiven und liefern überraschende Erkenntnisse.

    Als Forscher in Kairo die Mumien der Pharaonen per CT-Scan durchleuchten, stoßen sie auf eine sensationelle Entdeckung: Die Bilder verraten die Todesursache von König Ramses III. Damit lösen sie ein jahrtausendealtes Rätsel um den Tod des mächtigen Herrschers.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
