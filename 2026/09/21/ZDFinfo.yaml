  title: Entscheidung auf dem Schlachtfeld
  subtitle: Azincourt - England gegen Frankreich
  description: |-
    Frankreich 2025
    Ein Schicksalstag im Hundertjährigen Krieg: Am 25. Oktober 1415 treffen die zahlenmäßig unterlegenen Truppen des englischen Königs auf ein scheinbar übermächtiges französisches Heer.

    Was zunächst nach einer aussichtslosen Defensive aussieht, entwickelt sich zum Wendepunkt - dank neuartiger Waffen: Langbögen. Die Schlacht von Azincourt wird zum Symbol für strategischen Einfallsreichtum und unerwarteten Triumph.
    HD-Produktion
