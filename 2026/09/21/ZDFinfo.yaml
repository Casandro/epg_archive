    Die "Terra X"-Reihe "Große Völker" versteht sich als Zeitreise zu den Wurzeln Europas und den Nationen, die den Weg in die Moderne geebnet haben. In diesem Teil geht es um die Griechen.

    Die moderne Welt hat den alten Griechen eine Menge zu verdanken: tragische Dramen, unterhaltsame Komödien oder auch den Mathematikunterricht. Und nicht zuletzt ist die Demokratie das Erbe berühmter Vordenker aus Athen. Griechenland gilt als die Wiege Europas.
