  title: Entscheidung auf dem Schlachtfeld
  subtitle: Marathon - Athen gegen die Perser
  description: |-
    Frankreich 2025
    490 vor Christus starten die Perser einen Feldzug gegen Athen. Ihr Ziel: der Sturz des Regimes und die Eroberung der Metropole. Bei Marathon kommt es zur entscheidenden Schlacht.

    Der Perserkönig will Athen für die Unterstützung eines Aufstandes griechischer Städte in Ionien bestrafen. Seine Truppen landen in der Ebene von Marathon. Dort werden sie bereits von den schwer bewaffneten Athenern erwartet.
    HD-Produktion
