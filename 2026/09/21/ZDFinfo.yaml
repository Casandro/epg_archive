  title: ZDF-History
  subtitle: Roms Rache - Die Schlacht im Harz
  description: |-
    Deutschland 2011
    "Varus, gib mir meine Legionen zurück!", soll der römische Kaiser Augustus nach der verlorenen Schlacht im Teutoburger Wald im Jahre 9 nach Christus ausgerufen haben.

    Nie wieder würden Römer in Germanien Fuß fassen. So steht es in den Schulbüchern. Tatsächlich machten Archäologen jüngst eine spektakuläre Entdeckung im Harz.
