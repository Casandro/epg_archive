  title: Entscheidung auf dem Schlachtfeld
  subtitle: Hastings - Wilhelm erobert England
  description: |-
    Frankreich 2025
    Im Jahr 1066 steht England am Scheideweg. Nach dem Tod des angelsächsischen Königs Edward entbrennt ein Machtkampf um die Krone. Mehrere Anwärter erheben Anspruch.

    Darunter auch Wilhelm, Herzog der Normandie. Sein Gegner ist der frisch gekrönte König Harold Godwinson. Die entscheidende Auseinandersetzung findet auf dem Schlachtfeld bei Hastings statt - ein Moment, der die Weichen für die Geschichte Englands neu stellt.
    HD-Produktion
