  title: Verlorene Schätze - Das Erbe des Assyrischen Reiches
  description: |-
    Großbritannien 2024
    2014 zerstören IS-Terroristen in Mossul große Teile des archäologischen Erbes aus assyrischer Zeit. Unter den Trümmern entdecken Forschende Überreste eines monumentalen Königspalastes.

    Die Artefakte stammen aus der Zeit König Sanheribs und zeugen von der weit entwickelten Kultur der Assyrer. Ausgeklügelte Bewässerungssysteme versorgten prachtvolle Gartenanlagen. Handelt es sich um die legendären Hängenden Gärten von Babylon?
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
