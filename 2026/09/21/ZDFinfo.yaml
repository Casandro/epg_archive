  title: Entscheidung auf dem Schlachtfeld
  subtitle: Die Wikinger vor Paris
  description: |-
    Frankreich 2023
    Die Belagerung von Paris durch die Wikinger im Jahr 885 verändert den Lauf der Geschichte Frankreichs. Die Doku sucht nach Spuren der legendären Blockade.

    Zwei Männer führen die Verteidigung an: Graf Odo und Bischof Gauzlin. Sie stellen sich den Männern aus dem Norden entgegen, die plündernd die Seine hinaufziehen und Angst und Schrecken verbreiten. Trotz ihrer Überlegenheit verlieren die Wikinger den Kampf um Paris.
    HD-Produktion
