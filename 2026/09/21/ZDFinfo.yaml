  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Kleopatras versunkene Stadt
  description: |-
    Großbritannien 2021
    Das antike Kanopus gilt als das altägyptische Atlantis. Über 25 Jahre hinweg legen Unterwasserarchäologen diese lang verschollene Hafenstadt aus dem 6. Jahrhundert vor Christus frei.

    Zu Zeiten von Kleopatra erlebt die antike Hafenstadt ihre wirtschaftliche Blütezeit. Später, unter der Herrschaft römischer Christen, werden Kirchen und Klöster errichtet, bevor die Stadt bei einem Erdbeben zerstört wird und durch einen Tsunami im Meer versinkt.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
