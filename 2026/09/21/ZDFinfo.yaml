  title: Entscheidung auf dem Schlachtfeld
  subtitle: Sekigahara - Kampf der Samurai
  description: |-
    Frankreich 2025
    Die Schlacht von Sekigahara markiert für Japan einen historischen Wendepunkt: Am 21. Oktober 1600 treffen zwei mächtige Armeen aufeinander und beenden eine Ära voller Konflikte.

    Auf der einen Seite steht die westliche Allianz unter der Führung von Ishida Mitsunari, die die bestehende Ordnung bewahren will. Auf der anderen Seite kämpft die östliche Armee unter Tokugawa Ieyasu, die eine neue Ära der Einheit und Stabilität einläuten möchte.
    HD-Produktion
