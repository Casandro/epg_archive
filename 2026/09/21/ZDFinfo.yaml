  title: Die sieben Mythen der Antike
  description: |-
    Deutschland 2023
    War Kleopatra eine eiskalte Verführerin? Gab es das Trojanische Pferd wirklich? Und warum stürzten sich 300 Spartaner in eine ausweglose Schlacht? Viele Mythen der Antike werfen Fragen auf.

    Forscherinnen und Forscher versuchen, die Wahrheit hinter den schillernden Erzählungen der Antike zu finden. Wie sind die Mythen entstanden und aus welchen Motiven? Eine Spurensuche nach den Ursprüngen der Legendenbildungen in und nach der Antike.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
