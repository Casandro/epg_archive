  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: König Salomos sagenhafter Reichtum
  description: |-
    Großbritannien 2018
    In der Bibel gilt König Salomo als mächtiger, weiser und unfassbar reicher Herrscher. Quelle seines Vermögens waren Minen. Archäologen wollen sie im israelischen Timna gefunden haben.

    Arbeiter und angesehene Fachleute produzierten dort ein Material, das ganze Zivilisationen prägen sollte: Kupfer. Doch König Salomo kann nicht der Besitzer dieses Minennetzwerks gewesen sein. Doch wie ist es ihm dann gelungen, von den Gewinnen zu profitieren?
    HD-Produktion
  genre:
  - '128'
  widescreen: true
