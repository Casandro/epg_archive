  stop: 2026-09-21T09:00:00Z
  title: Vizitka
  description: 'Radka Folprechtová, malířka a grafička. Na své výstavě Tanec květin přibližuje květiny z bezprostřední blízkosti. Přistupuje k nim jako k živým organismům v neustálém pohybu a jejich detailní zobrazení má být metaforou pro plynoucí čas a životní koloběh. V kontextu českého umění rezonuje tvorba Radky Folprechtové s tradicí lyrické abstrakce. Co všechno jí dovoluje malba tuší a akvarelem? A jak se dá vidět krása v pomíjivosti a nedokonalosti? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
