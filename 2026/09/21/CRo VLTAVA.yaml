  title: Četba s hvězdičkou
  description: 'Jack Black: Nemáte šanci (05/10). Strhující autobiografie tuláka a lupiče zaznamenává třicet let na cestě americkým podsvětím počátku dvacátého století. Bestseller, který ovlivnil celou generaci beatniků. Připravila Petra Hynčíková. Překlad Tomáš Míka. Účinkuje Tomáš Drápela. Režie Jakub Doubrava. Natočeno v roce 2022 (28 min).'
