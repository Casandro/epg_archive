- eventId: 1042864
  start: 2026-09-21T18:00:00Z
  stop: 2026-09-21T20:00:00Z
  title: Koncert SOČR
  description: 'Ve výběru z nahrávek Symfonického orchestru Českého rozhlasu zazní J. S. Bach/Leopold Stokowski: Toccata a fuga pro varhany d moll BWV 565 , úprava pro orchestr (dirigent Jan Kučera) - J. K. Vaňhal: Koncert pro dva fagoty a orchestr (dirigent Ondřej Kukal, Jaroslav Kubita a Michael Verner - - fagoty) - W. A. Mozart: Koncert pro dva klavíry a orchestr č. 10 Es dur K 365 (dirigent Ondrej Lenárd, Sergio Marchegiani a Marco Schiavo - klavíry) - Ladislav Simon: Koncert pro housle a orchestr (dirigent Vladimír Válek, Martin Válek - housle) - Igor Stravinskij: Pták Ohnivák, suita z baletu, verze z roku 1919 (dirigent Zdeněk Mácal). Připravil a uvádí Ondřej Scholtz.'
- eventId: 1042865
  start: 2026-09-21T20:00:00Z
  stop: 2026-09-21T21:00:00Z
  title: Souzvuk
  description: 'Agnes Martin: Myslící stéblo. Literárně-hudební pásmo z meditací a básní americké malířky ze sbírky Nezkalená mysl. Z překladu Martina Pokorného připravila Lucie Novotná. Účinkují Daniela Kolářová a Petr Gojda. V pořadu zazní skladby amerického violoncellisty a skladatele Davida Darlinga v autorově interpretaci. Režie Markéta Jahodová (57 min). Natočeno v roce 2016.'
- eventId: 1042999
