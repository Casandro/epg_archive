  title: Akcent
  description: Patnáctiletí v Česku přestávají rozumět psanému textu, takzvaná čtenářská gramotnost upadá. I to jsme se dozvěděli z posledního mezinárodního testování PISA. Proč to zhoršení? Jak souvisí čtenářská gramotnost se čtenářskou kulturou ve škole a v rodině? Co jde změnit a jak? Saša Michailidis se ptá Nikoly Šrámkové a Veroniky Fiedlerové.
- eventId: 1042781
  start: 2026-09-21T15:02:00Z
  stop: 2026-09-21T16:00:00Z
  title: ArtCafé
  description: 'Cesta zpěvačky Eivor z jazzových klubů na metalová pódia. Zpěvačka a skladatelka Eivor Pálsdóttir je jedním z nejvýraznějších hudebních představitelů Faerských ostrovů. Před dvěma roky učinila Eivor výrazný úkrok stranou. Opustila primárně akustické území, na kterém se delší dobu pohybovala, spojila se s metalovým prostředím a nabídla mu temně popovou nahrávku výrazně ovlivnějou domácím folklórem. Před vydáním letošní desky Tungl přijela zahrát na hlavní pódium metalového festivalu Brutal Assault. Před vystoupením si Pavel Zelinka se zpěvačkou povídal o její barevné kariéře, propojení s metalovým světem, i o podrobnostech o nové desce. Během povídání došlo i na fotbal! Naživo se Eivor představí i v Praze a to 18. března v pražském Roxy. E-mail: artcafe@rozhlas.cz'
- eventId: 1042782
  start: 2026-09-21T16:00:00Z
  stop: 2026-09-21T16:30:00Z
  title: Jazzový podvečer
  description: O všem novém v jazzu s Davidem Bradou. Pro každého, kdo nepřestává hledat a chce zůstat "up to date", stejně jako autor pořadu, jenž flámoval s Quincym Jonesem. Každé pondělí uvádí David Brada.
- eventId: 1042783
  start: 2026-09-21T16:30:00Z
  stop: 2026-09-21T17:00:00Z
  title: Četba na pokračování
  description: 'Bohumil Hrabal: Obsluhoval jsem anglického krále (06/14). Román českého prozaika, esejisty a básníka líčí od dvacátých do padesátých let 20. století, tedy v době velkých politických zvratů, životní dráhu číšníka Jana Dítěte, později hoteliéra a nakonec cestáře. Pro rozhlas připravil Jiří Červenka. Účinkuje Ladislav Mrkvička. Režie Markéta Jahodová (28 min). Natočeno v roce 2004.'
