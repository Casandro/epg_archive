  title: How I Met Your Mother
  subtitle: Die Kette des Anbrüllens Comedy-Serie, USA 2008
  description: Folge 59, Marshall hat seinen neuen Job in einer Top-Anwaltskanzlei angetreten und verzweifelt schon nach kurzer Zeit an seinem Chef ,Artillerie-Arthur', der ihn so anbrüllt, dass Marshall tatsächlich anfängt zu heulen. Nachdem er sich Rat von seinen Freunden geholt hat, hält er sich an Barney und schreit seinen Chef ebenso an - und verliert prompt seinen Job. Jetzt muss er einen Weg finden, um Lily zu erklären, weshalb er seinen Job verloren hat.
  widescreen: true
- eventId: 1014490
  start: 2026-09-21T22:35:00Z
