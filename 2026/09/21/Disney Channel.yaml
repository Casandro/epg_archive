  title: How I Met Your Mother
  subtitle: Zehn Sitzungen Comedy-Serie, USA 2008
  description: Folge 57, Ted ist immer noch verschossen in seine Hautärztin Stella und bittet sie unermüdlich um ein Date. Während sich die Arzthelferin Abby sofort in Ted verliebt hat, weißt ihn Stella weiterhin ab. Nach der letzten Sitzung erfährt er auch den Grund - Stella hat eine kleine Tochter und das mit den Dates gestaltet sich dadurch schwieriger als gedacht. Doch Ted lässt sich einiges einfallen ... Und Barney versucht alles, um die schöne Abby auf sich aufmerksam zu machen.
  widescreen: true
- eventId: 1014488
