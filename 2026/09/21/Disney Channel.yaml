  description: Folge 99, Tim bringt für seine Familie ein üppiges Abendessen mit nach Hause. Jill erinnert ihn daran, dass seine letzte Völlerei mit bösen Magenschmerzen endete, doch Tim lässt sich den Spaß am Essen nicht nehmen. Nachts wacht er, wie von Jill vorrausgesehen, mit schlimmen Bauchschmerzen auf. Da er nicht wieder einschlafen kann, schaut er sich alte "Tool Time" - Aufzeichnungen an und stellt bedrückenderweise fest, dass seine Show eine Aneinanderreihung von Pleiten, Pech und Pannen war...
