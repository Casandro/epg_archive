  title: How I Met Your Mother
  subtitle: Die Rächerin Comedy-Serie, USA 2008
  description: Folge 58, Der Architekt Ted Mosby wird im Jahr 2030 von seinen Kindern gefragt, wie er deren Mutter kennengelernt hat. In Rückblenden lässt er daraufhin sein turbulentes Leben als junger Erwachsener in New York Revue passieren. Er erzählt von seinen Freunden Marshall und Lily, die früh ein Paar wurden, dem Frauenheld Barney, der ständig gute Ratschläge parat hat, und der hübschen kanadischen Nachrichtensprecherin Robin.
  widescreen: true
- eventId: 1014489
