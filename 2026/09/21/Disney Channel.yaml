  title: How I Met Your Mother
  subtitle: Tue Böses, ernte Gutes Comedy-Serie, USA 2008
  description: Folge 56, Es ist St. Patricks Day und Ted hat keine Lust auf die verrückten Partys. Als jedoch Barney mit zwei scharfen Mädels vor der Tür steht, lässt er sich breitschlagen. Im Club angekommen unternimmt Ted Versuche, um Barneys Theorie ,tue Böses, ernte Gutes' zu bestätigen. Und so erhält er Gratischampagner, Kaviar und eine hübsche Frau ... Marshall und Robin unternehmen alles, damit Lily nicht merkt, dass die neue gemeinsame Wohnung den einen oder anderen Mangel hat.
  widescreen: true
