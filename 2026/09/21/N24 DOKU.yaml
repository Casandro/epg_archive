  title: 'Border Patrol Neuseeland: Weißes Pulver aus Brasilien'
  subtitle: 'Border Patrol Neuseeland: Weißes Pulver aus Brasilien'
  description: Am Flughafen Auckland endet eine Reise abrupt, als bei einem Brasilianer eine große Menge Kokain im Koffer entdeckt wird. Währenddessen bringt eine Frau mit nicht deklarierten Samen die Biosecurity-Beamten an ihre Grenzen. Bei der Einwanderungsbehörde versucht eine Ehefrau verzweifelt, den illegalen Aufenthalt ihres Mannes zu vertuschen. Die Folge zeigt, wie schnell Routine in brisante Entscheidungen umschlägt.
