  description: Eine Frau aus Venezuela berichtet Grenzbeamten von ihrer gefährlichen Flucht aus Venezuela und den hohen Summen, die sie an Schleuser zahlte. Währenddessen geraten in Laredo zwei US-Bürger unter Druck, nachdem ihr Versuch Drogen in Gemüsedosen zu schmuggeln aufflog und sie Hinweise auf ein illegales Netzwerk geben. In Hidalgo zeigt ein kurioser Fund, dass Polizeiarbeit nicht immer todernst ist.
