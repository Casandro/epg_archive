  subtitle: Urlaubsspaß de luxe - Ein Ferienpark entsteht
  description: 'Im Allgäu entsteht wird auf einer Fläche von 184 Hektar ein gigantischer Ferienpark errichtet. In tausend Ferienhäusern sollen zukünftig rund 5.000 Gäste ihren Urlaub verbringen können. Doch bis zur Eröffnung der Anlage am Fuße der Alpen ist es noch ein weiter Weg: 1.100 Bauarbeiter, Installateure und Techniker schuften für eine pünktliche Fertigstellung. Am Schluss fehlt das Dach einer Riesenrutsche und der TÜV prüft die Park-Attraktionen - wird das Feriendomizil dennoch rechtzeitig fertig?'
