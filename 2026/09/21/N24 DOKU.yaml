  stop: 2026-09-21T12:05:00Z
  title: Lost Places - Folge 97
  subtitle: Lost Places - Folge 97
  description: Wie ein Spinnennetz aus Stahl schweben die Seilbahnen über Tschiatura, Georgiens einst blühender Bergbaustadt. Ehemals pulsierende Adern, die Arbeiter zu den Minen brachten, sind sie heute stille Zeugen des Niedergangs. Viele Einwohner verließen die Stadt, und das "Venedig der Lüfte" verfiel zur Geisterstadt. Was geschah mit diesem einzigartigen Ort?
  widescreen: true
- eventId: 1014419
  start: 2026-09-21T12:05:00Z
  stop: 2026-09-21T13:00:00Z
  title: Lost Places - Folge 98
  subtitle: Lost Places - Folge 98
  description: Die Burg Houska in Tschechien, erbaut im 13. Jahrhundert direkt über dem "Tor zur Hölle", ist bis heute ein mystischer Ort voller düsterer Legenden. Es heißt, die Nazis hätten hier bis 1945 geheime Experimente durchgeführt. Sind das bloß Gruselgeschichten? Zudem das einstige Prunkstück Liberias, das 5-Sterne-Hotel Ducor in Monrovia. Ehemals ein Symbol des afrikanischen Aufschwungs, ist es heute nur noch eine Ruine - ein stummes Zeugnis vergangener Glanzzeiten.
  widescreen: true
- eventId: 1014420
  start: 2026-09-21T13:00:00Z
  stop: 2026-09-21T13:55:00Z
  title: Lost Places - Folge 99
  subtitle: Lost Places - Folge 99
  description: 'Der Küstenort Varosha im Nordosten Zyperns war einst ein Urlaubs-Hotspot für die Reichen und Schönen. Doch im Jahr 1974 wurden die Hotels, Boutiquen und Strände zu einer verbotenen Zone hinter Absperrungen und Stacheldraht. Außerdem: Zwei Küstenforts in den Bayous von Louisiana sind faszinierende Zeugen einer unsteten Phase der US-amerikanischen Geschichte. Und: Die einzigartige antike Höhlenstadt Wardsia in Georgien erlebte im Mittelalter ihre Blütezeit, bis ein Erdbeben alles veränderte.'
