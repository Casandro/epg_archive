  title: 'Hitlers Komplizen: Hermann Göring'
  subtitle: 'Hitlers Komplizen: Hermann Göring'
  description: Bei den Nürnberger Prozessen war Hermann Göring der ranghöchste überlebende Naziverbrecher. Im Dritten Reich agierte der ehemalige Jagdflieger nicht nur als Luftwaffenchef und Gestapo-Gründer. Er beauftragte die Errichtung der ersten Konzentrationslager ebenso wie die spätere "Endlösung der Judenfrage" und galt als designierter Nachfolger Hitlers. Eine Krankenakte beschrieb ihn schon im Jahr 1925 treffend als antisemitisch, brutal, hysterisch, charakterschwach und bösartig.
  widescreen: true
