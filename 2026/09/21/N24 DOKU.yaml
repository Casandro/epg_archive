  title: 'Traumzüge: Frecciarossa und Italo EVO'
  subtitle: 'Traumzüge: Frecciarossa und Italo EVO'
  description: 'Gleich zwei italienische Highspeed-Züge werden in dieser Dokumentation vorgestellt: Der staatliche Frecciarossa 1000 und der privat betriebene Italo EVO konkurrieren auf den gleichen Bahnhöfen und Strecken um Kunden. Der "rote Pfeil" rauscht mit 300 Kilometern pro Stunde von Mailand ins 800 Kilometer entfernte Neapel. Mit dem ebenfalls rot lackierten Italo EVO fährt Teddy Wilson von Venedig bis nach Turin. Technik und Eleganz, Geschwindigkeit und die Schönheit Italiens - was will man mehr?'
