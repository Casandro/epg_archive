  title: Faszination historische Militärtechnik
  subtitle: Faszination historische Militärtechnik
  description: 'Die Leidenschaft an historischer Militärtechnik in der eigenen Garage zu basteln, ist nicht nur in den USA groß. Inzwischen ist der Trend auch in Deutschland angekommen. Die technische Leistung, die hinter den historischen Relikten steckt, fasziniert die Insider der Szene. Vom Militärtechnik Festival Finowfurt bis hin zur Praxisstunde in der Panzerfahrschule: Die Reportage gibt Einblicke in die Welt der Militärtechnikfans, in ihre Bastlerstuben und ihre Sammlervitrinen.'
