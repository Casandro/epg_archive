  title: Lost Places - Folge 95
  subtitle: Lost Places - Folge 95
  description: 'Faszinierende Überreste vergangener Zeiten: Im schottischen Edinburgh erzählen unterirdische Gewölbe eine Geschichte von Aufbruch, Niedergang und Elend. Außerdem: Ein Fort an Kroatiens Küste, erbaut von einem vergangenen Reich zum Schutz einer mächtigen Flotte. Eine verlassene Fabrik in Island, die mit flüssigem Gold für wirtschaftlichen Aufschwung sorgte. Und: die Spuren einer Schlacht auf amerikanischem Boden, die die USA erschütterte.'
  widescreen: true
