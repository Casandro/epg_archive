  title: 'Traumzüge: Indian Pacific'
  subtitle: 'Traumzüge: Indian Pacific'
  description: Einmal quer über den australischen Kontinent, vom Indischen Ozean bis zum Pazifik, von Perth im Westen nach Sydney im Osten, das ist der Indian Pacific. Vier Tage dauert die mehr als 4.300 Kilometer lange Reise durchs Outback, die sengend heiße Nullarbor-Ebene und die Blue Mountains. An Bord des fast einen Kilometer langen Zuges befinden sich drei Fünf-Sterne-Küchen, luxuriöse Abteile und gemütliche Loungewagen. So wird die Fahrt durch die faszinierende Landschaft Australiens unvergesslich.
  widescreen: true
