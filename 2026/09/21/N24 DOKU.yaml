  title: 'Border Patrol Neuseeland: Brexit mal anders'
  subtitle: 'Border Patrol Neuseeland: Brexit mal anders'
  description: 'Nicht jeder, der nach Neuseeland will, hält sich an die Regeln - manchmal nur an seine eigenen.   An der Grenze treffen Beamte auf einen Briten, der seinen ganz persönlichen Brexit plant. Im Mailzentrum sorgt ein auffälliges Paket für Aufmerksamkeit - Glückstreffer oder Fehlalarm? Und: Eine angespannte Verfolgungsjagd in der Bay of Islands erfordert polizeiliche Verstärkung.'
  widescreen: true
