  subtitle: 'Reiseeuphorie: Roadtrip Oman - Die Bergwelt des Oman - einfach atemberaubend!'
  description: 'Wir lassen Nizwa hinter uns und begeben uns in die Bergwelt. Direkt am Start der Strecke zum Jabal Akhdar hält uns ein Checkpoint auf! Nur mit einem 4x4-Fahrzeug dürfen wir weiter. Oben angekommen, schlägt das Wetter sofort um: Die Temperatur sinkt, es wird kühl, aber die Aussicht ist fantastisch! Wir schlagen unser Lager in den Bergen auf, genießen den Blick ins Tal und die pure Natur. OM 2023'
