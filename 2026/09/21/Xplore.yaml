  title: Die Ostküste der USA - Big Apple und Meer
  subtitle: Die Ostküste der USA - Big Apple und Meer
  description: 'Von Delaware geht es entlang der Küste bis nach New Jersey, dem Vorort der großen Stadt, bis ins Herz von Manhattan. Delaware ist bekannt als Steuerparadies, aber an seiner Küste wachsen auch ausgezeichnete Weine. Peggy Raley fing mit wenigen Rebstöcken an und musste erst noch dafür sorgen, dass Weinanbau in dem puritanischen Bundesstaat legalisiert wurde. Heute ist ihr Hof an der gesamten Ostküste bekannt. In New Jersey macht sich die Nähe zu New York City bemerkbar, die Strände nicht nur von Atlantic City sind beliebte Badeplätze für Großstädter. Auf der Barnegat Halbinsel bei Toms River macht Lindsay Harrington Jagd auf kleine Krabbler für einen Insektenzoo und die Wissenschaft. Und dann weist die Freiheitsstatue den Weg ins Herz des Big Apple. Die wahren Kennzeichen von Manhattan sind für manche New Yorker jedoch die Wassertanks, ein typischer Wolkenkratzer hat mindestens einen. Clive Bushay sorgt für ihre Instandhaltung. Ein lebensgefährlicher Job in der Höhe. Auch Austin Horse muss hellwach sein, für den Fahrradkurier sind 100 Kilometer Strecke ein ganz normales Tagespensum, und das in einer Stadt, die ständig im Verkehrschaos steckt. Außerdem hat Austin einen Ruf zu verteidigen: als schnellster und bester Radkurier. Auf Long Island geht es wieder ruhiger zu, hier werden Austern gezüchtet. Ganz am Ende der Insel liegen die Hamptons, das Erholungsgebiet der Upper Class. Angela Boyer-Stump bringt dort Luxusimmobilien an den Mann. US 2014'
  ageRating: 6
