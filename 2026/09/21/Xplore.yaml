  title: Wanderlust! - Der Saar-Hunsrück-Steig, Deutschland
  subtitle: Wanderlust! - Der Saar-Hunsrück-Steig, Deutschland
  description: Der Saar-Hunsrück-Steig ist kein historischer Weg, sondern wurde erst 2007 erfunden. Ein "Designer-Wanderweg", der am Dreiländereck Frankreich-Saarland-Luxemburg beginnt. Er führt über 220 Kilometer bis nach Idar-Oberstein, mit einem Abstecher nach Trier. Der Weg zieht jährlich 100.000 Wanderer an und ist längst ein Wirtschaftsfaktor im abgelegenen und industriearmen Hunsrück. Reiseführerautor Bradley Mayhew hat noch nie vom "Hunsrück" gehört, dem Mittelgebirge zwischen Rhein und Mosel am Südwestrand Deutschlands. Ein Freund hat ihm die Trierer Geografin Kerstin Schneekloth als Wanderfreundin vermittelt. Also los! Mal sehen, was kommt! Lieblich, nicht spektakulär ist der Weg. Doch so angenehm in die Landschaft inszeniert, dass es entspannt, ihn zu gehen. Ein "Gute Laune-Hike", meint Bradley, der viel erlebt in Hunsrück. Die Saarschleife, einen Backclub der Frauen von Waldhölzbach mit einem Mönch aus Thailand. Er trifft auf den Chefdesigner von Villeroy&Boch, genießt die Akustik des Doms zu Trier, und trifft am Weg den Kellermeister von Schloss Marienlay in Ruwertal. Der Riesling ist herrlich. Nur der Rucksack ist danach doppelt schwer. Bald treffen Bradley und Kerstin einen "Gemischten Männerchor" aus Saarbrücken, der nur aus Männern besteht. Dann stehen 30 Männer im Wald, mittelalterliche "Heckenzeichen" in der Hand, ziehen Lose aus dem Hut, für einen "Rosenkranz". "Pretty exotic", meint Bradley, der meist in Asien arbeitet. Leider muss Kerstin irgendwann zurück zur Arbeit. Bradley wandert allein über Wiesen, Felder, Hochmoore, quert das Viadukt der stillgelegten Hunsrückbahn und verläuft sich. Andreas Jaschok vom Bornwiesenhof nimmt Bradley mit, zum Kühe treiben, Melken, Frühstück unterm Apfelbaum. Beim Wandern kann man was erleben! Vorbei die Zeit, als Wandern ein Rentnersport war. Heute ist es jung, grün und trendy. Am besten in Erinnerung blieben die Begegnungen, meint Bradley. "Nah dran ist man nur zu Fuß". DE 2014
  ageRating: 6
