  title: Entdecke die Welt - Genf
  description: Entdecke die Welt führt uns heute in die französische Schweiz, genauer gesagt nach Genf. Immer dann wenn sich politische Lager zu Gesprächen treffen, wichtige internationale Entscheidungen getroffen und berühmte Hände gedrückt werden, um Frieden und Freiheit gerungen wird, steht Genf am gleichnamigen See oft im Mittelpunkt.  Genf war und ist bis heute Drehscheibe und Mittelpunkt wirtschaftlicher, wie politischer Entscheidungen. Doch Genf ist mehr als nur Schauplatz von Machtspielen, sondern auch Spielpatz für Leib & Seele. Genf hat viele Künstler aber auch Handwerker angezogen und ihnen den Nährboden für extravangante Modelle gegeben. Genf versprüht diese pikante Mischung aus französischen Flair, schweizer Gelassenheit und internationalem Jet-Set.
