  title: Vier Frauen und ein Todesfall - Sondermüll
  subtitle: Vier Frauen und ein Todesfall - Sondermüll
  description: 'Bei der regelmäßigen Tour der örtlichen Müllabfuhr geschieht ein schrecklicher Unfall: Der Müllmann Klaus Prinz ist in den Häcksler des Müllwagens geraten. Natürlich ein neuer Fall für die vier Frauen, die ganz und gar nicht an ein Unglück glauben wollen und sich zunächst in der Nachbarschaft des Toten umhören. Bald stellen sie fest, dass gleich mehrere Dorfbewohner mit Prinz über Kreuz waren, darunter sogar dessen eigener Bruder, der seit Jahren nichts mit ihm zu tun haben wollte. Auffällig ist auch, dass Prinz kurz vor seinem Tod plötzlich über eine größere Geldsumme verfügte. Weitere Recherchen führen die Ilmer Sonderermittlerinnen letztendlich zu einer grausigen Entdeckung, die fatale Folgen für das ganze Dorf hat'
