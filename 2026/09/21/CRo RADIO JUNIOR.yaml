  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Stanislava Křížová, manažerka programu Rozumíme penězům AISIS. Finanční gramotnost - Jste finančně gramotní? Víte, co je kapesné, jak s ním správně hospodařit a na co si dát pozor, když nakupujete nebo platíte online? S manažerkou programu AISIS "Rozumíme penězům" Stáňou a její devítiletou dcerou Evou probereme to, co by o penězích měly vědět děti a jejich rodiče. Je pro děti lepší dostávat peníze v hotovosti nebo platit kartou? Proč neutrácet všechno hned? Jak si našetřit? Na co si dát pozor při prvních online nákupech? Jak poznat, když se vás někdo na internetu snaží o peníze připravit? Je možné už v dětství začít investovat? Jaké jsou nejčastější chyby, které děti při zacházení s penězi dělají? A co na to všechno říká její devítiletá dcera Eva? Moderuje Klára Nováková.
