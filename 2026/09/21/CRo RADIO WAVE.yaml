  title: Stage
  description: Na Stagi si dnes poslechneme koncert slovenské kapely Noční jazdci, který odehráli na Radiu FM v rámci koncertní série Pohoda_FM. Noční jazdci je projekt trojice hudebníků, který ve své tvorbě propojuje žánry, jako jsou dub, trance, funk a temnou elektroniku s hlubokými dubovými texturami a groovujícími rytmy. Širší pozornost si získali nominací na Radio Head Awards v kategorii Objev roku v roce 2021, od té doby vystoupili například na festivalech Uprising nebo také Sharpe. V dubnu 2025 vydali debutové album Toto sú Noční jazdci, kterým se etablovali na slovenské alternativní scéně. Stage laďte v pondělí ve 21:00.
