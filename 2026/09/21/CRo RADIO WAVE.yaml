  title: Startér
  description: Společné tři roky v hitparádě neobjevených na krku! Martin a Filip se ohlédnou za těmi nejzajímavějšími jmény, která Startérem prošla za dobu, kdy spolu drží moderátorské otěže. Někdo vzplanul a hned zase vyhasnul, někdo stabilně vzkvétá, někdo zas překvapuje chycením druhého dechu. Komu patří největší obdiv? Kdo to zabalil předčasně? A kdo patří mezi nejaktuálnější hot picks hitparády? Bilanční speciál Startéru laďte v pondělí ve 20:00. Moderují Filip Černý a Martin Šolc. (repríza)
- eventId:
