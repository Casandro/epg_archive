  title: Die Biene Maja
  subtitle: Mückenalarm
  description: |-
    Mückenalarm

    Willi und Maja stellen zu ihrer Freude fest, dass die Frösche am Teich verschwunden sind. Die Freude währt jedoch nicht lange, denn aus dem gleichen Grund kommen drei Mücken zum Teich.

    Sie hassen Frösche und wollen sich dort niederlassen. Außerdem erklären sie den Teich für die anderen Tiere zur Sperrzone. Sie wollen ihn für sich allein haben. Wer das missachtet, den überziehen sie mit einem schrillen Mückenton, der einem die Ohren zerfetzt.

    Für Maja und Willi ist klar, dass sie sich den Teich nicht wegnehmen lassen wollen. Dann doch lieber die Frösche, und genau das ist die Lösung: Wenn sie zurückkämen, dann würden die Mücken abhauen. Doch bevor es soweit ist, müssen Maja und Willi erst einmal herausfinden, warum die Frösche überhaupt weg sind.
