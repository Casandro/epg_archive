    Willkommen bei "Quizzen macht Ah!"! Clarissa und Tarkan führen heute durch eine ganz besondere Quiz Sendung. Wer kann alle Fragen richtig beantworten? Auf diejenige oder denjenigen wartet am Ende der Sendung ein toller Preis! Aber Achtung: Die Fragen sind nicht ohne... Während Clarissa und Tarkan andere Quiz-Shows im Deutschen Fernsehen blass aussehen lassen, beantworten sie gewohnt souverän die fünf Fragen der Sendung.

    Wie viele Füße hat der Tausendfüßer?

