  subtitle: Die Wiese gehört mir!
  description: |-
    Die Wiese gehört mir!

    Die Königin muss den Bienenstock verlassen und überträgt Richter Bienenwachs währenddessen die Amtsgeschäfte. Doch der Richter zeigt sich natürlich nicht als weiser und gerechter König.

    Ganz im Gegenteil erfindet er neue, unsinnige Regeln. Der Richter erklärt die Wiese zum Privatgrundstück des Bienenstocks und markiert jede Blume mit einem Stempel als Eigentum der Bienen. Andere Insekten der Wiese dürfen sie unter keinen Umständen anrühren.

    Maja ist außer sich vor Empörung und ersinnt zusammen mit Willi einen Plan, wie man diese sinnlose Idee vereiteln oder vielmehr ad absurdum führen kann.
