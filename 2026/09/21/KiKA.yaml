    Der kleine Hase und die kleine Feldmaus entdecken beim Spielen auf der Wiese einen ganz besonderen Baum. Er sieht nicht nur schön aus und trägt köstlich aussehende Früchte, man kann vor allem toll auf ihm spielen. Sie erklären ihn zu ihrem neuen Lieblingsbaum. Plötzlich zieht ein Gewittersturm auf. Der kleine Hase geht mit seiner Freundin lieber zum großen Hasen und sie suchen Schutz in einer Höhle. Dort treffen sie auch die kleine Rotfüchsin und das kleine Grauhörnchen. Als der Sturm sich gelegt hat, wollen der kleine Hasen und die kleine Feldmaus dem großen Hasen und ihren beiden Freunden ihren neuen Lieblingsbaum zeigen. Doch alles kommt anders, als sie es sich vorgestellt hatten.
