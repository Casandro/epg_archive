    Medaillen für Zac

    Pip und Posy tragen einen lustigen Wettkampf aus, und der Gewinner bekommt eine Medaille. Zac will unbedingt auch eine Medaille gewinnen - aber es gelingt ihm nicht.

    Pip und Posy helfen ein bisschen nach und lassen ihn absichtlich gewinnen. Als Zac dahinterkommt, ist er sehr enttäuscht. Er hätte seine Medaillen lieber auf ehrlichem Weg gewonnen. Pip und Posy geben ihm ein paar Tipps, wie er seine Chancen erhöhen kann.

