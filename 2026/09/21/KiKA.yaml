    Geisterstunde

    Mitten in der Nacht stößt Lady Jane einen markerschütternden Schrei aus. Sie glaubt, in der Galerie den Geist von König Heinrich VIII gesehen zu haben und da ist sie nicht die Einzige.

    Als auch Palastwache Ralph seltsame Vorfälle bei seinem nächtlichen Rundgang schildert, wächst die Unruhe am Hof. Queen Elizabeth verlangt Aufklärung und Grace nimmt die Ermittlungen auf. Sie glaubt an einen handfesten Grund hinter dem seltsamen Spuk.

    Doch je tiefer sie in den Fall eintaucht, desto geheimnisvoller scheinen die Ereignisse.
