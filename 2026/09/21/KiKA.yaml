    Die Weltreise

    Sam hat das Mäusehaus noch nie verlassen und träumt davon eine Weltreise zu machen. Da Julia noch neu im Mäusehaus ist, schlägt ihre Mutter erst einmal eine große Reise durchs Mäusehaus vor.

    Sam und Julia packen einen Koffer, nehmen ihr Reisebuch und los geht es. Zuerst schippert sie Opa Seemann mit dem Boot in ein fernes Land. Von dort geht es zu Fuß weiter, einmal um die Welt. Abends kehren die zwei mit vielen neuen Eindrücken wieder heim.
