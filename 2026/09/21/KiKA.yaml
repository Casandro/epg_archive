    Die verschwundene Königin

    Nachdem der Verräter Burns aus dem Kerker ausgebrochen ist, herrscht Ausgangssperre im Palast. Aber Queen Elizabeth hält sich nicht daran. Gemeinsam mit Grace verlässt sie den Palast.

    Lediglich mit Soldat Ralph als Beschützer will die Queen die Wahrsagerin Aurelia besuchen, um etwas über ihre Zukunft zu erfahren. Grace bittet Ellie und Masou so lange Lord Osborne zu überwachen. Sie hat ihn im Verdacht, mit Burns gemeinsame Sache zu machen.

    Doch während des Besuchs in Aurelias Zelt verschwindet die Queen plötzlich. Noch dazu taucht Osborne ganz in der Nähe auf. Grace gerät in Panik und sucht verzweifelt nach der verschwundenen Königin.
