  description: 'Raubfisch-Angeln: Das Angeln auf Barsch erfreut sich großer und stetig wachsender Beliebtheit. Für den Fang der gestreiften Räuber kommen allerlei Köder, Techniken und Taktiken in Frage. Während in früheren Jahren meist Naturköder wie Wurm oder Köderfisch beim Barschangeln zum Einsatz kamen, setzen heute viele auf künstliche Köder. Manche davon funktionieren das ganze Jahr hindurch, manche nur zu bestimmten Jahreszeiten. Der bekennende Barsch-Freak André Pawlitzki zeigt in diesem Video, mit welchen er besonders im Herbst erfolgreich ist.  DE 2015'
