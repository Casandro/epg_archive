  title: Smallfish Competition und Nascar Party
  subtitle: Smallfish Competition und Nascar Party
  description: 'In den Vereinigten Staaten angekommen, gab es erstmal Geschenke. Ungefähr 20 alte Angelruten und Rollen, Angelkoffer mit Bobbern usw. Die Aufgabe stand schnell fest: wir müssen uns eine Rute und Rolle herauspicken und damit versuchen, den ein oder anderen Fisch ans Band zu bekommen. Das einzige was wir von unserem mitgebrachtem Material verwenden dürfen ist der Köder. Gesagt, getan und los geht''s zum Pond hinter dem Haus. Ein harter Kampf, wer fängt die meisten Sunfish und Bluegill. Das war der perfekte Zeitvertreib bevor es für uns zum Nascar Race ging. Man kann es als ein Stück Kultur bezeichnen und wir waren mittendrin, im Innfield der Rennstrecke. Nach anfänglichen Schwierigkeiten und etwas Verspätung war die Party schon voll im Gange. Überall feiernde Menschen, riesige Camper, eigens für diese Veranstaltungen ausgebaut. Beobachtungsplattformen auf den Dächern und dieser wahnsinnige, ohrenbetäubende Lärm der 725 PS starken Boliden, ein Erlebnis der ganz besonderen Art. Und immer wieder rückte das Angeln in den Vordergrund. Interessante Gespräche, sofern möglich, total verrückte Leute und die Fish-On Geschichte, welche in den nächsten folgen immer wieder aufgelöst wird. DE 2017'
  ageRating: 12
- eventId: 1004198
  start: 2026-09-21T00:15:00Z
  stop: 2026-09-21T00:35:00Z
  title: The American Dream - Schwarzbarschangeln der Extraklasse
  subtitle: The American Dream - Schwarzbarschangeln der Extraklasse
  description: Unser Anglerstützpunkt für die nächste Woche, die Cabin, liegt am Cranberry Lake. Ein kleiner See in der Mitte von Michigan, der einen sehr guten Schwarzbarsch-Bestand aufweist. Bereits am ersten Angeltag ging es voll zur Sache. Die Bass waren richtig gierig und mit vier Anglern auf dem Bassboat gab es natürlich jede Menge geile Bisse, tolle Fische und nonstop Action. Gute Laune ist vorprogrammiert und gemeinsames Angeln und Erleben ist immer das Beste beim schönsten Hobby der Welt. Angeln verbindet und in den Vereinigten Staaten gehört es schon fast zum guten Ton. Wie einfach es sein kann, angeln zu gehen, machen uns die Amerikaner vor. Jahreslizenzen liegen für alle Fischarten und Gewässer in Michigan für Einwohner bei 26 Dollar, für Ausländer bei 76 Dollar. Kinder zahlen sogar nichts bzw. 1 Dollar. Für alle, denen das noch zu teuer ist oder die mit diesem Sport anfangen wollen, gibt es sogar zwei "Free Fishing Weekends" an denen jeder von Freitag bis Sonntag ohne Lizenz angeln darf. Die Lobby ist riesig, angeln ein Volkssport und ganz einfach auch für Kinder zugänglich. Es gehört für die Bewohner genauso zum Leben wie Fast Food. DE 2018
