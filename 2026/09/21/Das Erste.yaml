  title: Großstadtrevier (505)
  subtitle: Gefährliche Nachbarschaft
  description: |-
    Etwas weckt Dietmar Ohlsens Argwohn: Das neue Nachbarspaar hat das Haus ohne Vorbesichtigung gekauft und der Ehemann ist nachts stundenlang unterwegs. Ohlsen ist zwar Polizist, allerdings im Ruhestand. Doch das hält ihn nicht davon ab, der Sache auf den Grund zu gehen - sehr zum Verdruss seiner Frau Helga, die sich auf andere Zeiten gefreut hatte.
    Wegen Fahrerflucht gerät Ohlsen selbst ins Visier der Ermittler Harry Möller und Nils Sanchez. Die beiden finden heraus, dass Ohlsens Verdacht zwar nicht unbegründet, er selbst aber viel zu weit gegangen ist. Das wird auch Ohlsen bewusst, als seine Helga plötzlich in Lebensgefahr schwebt.
