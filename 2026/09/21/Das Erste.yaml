  title: Brennpunkt - Vertrauenskrise nach den Wahlen
  subtitle: in Mecklenburg-Vorpommern und Berlin
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Rente, Gesundheit, Sorge um den Arbeitsplatz. Nach den Wahlen in Mecklenburg-Vorpommern, Berlin und zuvor in Sachsen-Anhalt stellt der "ARD Brennpunkt" die Frage: Wie
    steht es um das Vertrauen in Politik, Parteien und die Regierung?
    Die jüngsten Wahlergebnisse zeichnen das Bild einer tiefgreifenden Veränderung der bundesdeutschen Parteienlandschaft und damit der politischen Willensbildung. Die ehemaligen Volksparteien kämpfen mit dramatisch schwindendem Zuspruch, die politischen Ränder erstarken - links wie rechts.
