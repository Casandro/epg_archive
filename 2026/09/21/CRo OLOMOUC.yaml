  title: Rockle
  description: Pokud dnes chcete jmenovat největší blues-rockovou kytarovou hvězdu, těžko se vyhnete jménu Joe Bonamassa. Letos opět nominován na Grammy za nejlepší bluesové album "Breakthrough", které přijede příští rok představit do Olomouce. Na Hané ostatně byl už minulý rok se superskupinou Black Country Communion a zážitek to byl fantastický. V létě 2027 se na Korunní pevnůstku vrátí se svojí skupinou a vokalistkami a jaké to asi bude? Více si povíme s Dušanem Neumannem nad deskou "Breakthrough". Moderuje Jiří Matějů.
