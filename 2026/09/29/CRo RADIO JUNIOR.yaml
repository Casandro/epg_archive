  title: Velká pohádka
  description: Pohádka houbového skřítka. Lojzek a Francka najdou na kraji lesa malinkého skřítka s houbovým semínkem. Když to semínko Františka zasadí, vyrostou z něj kouzelné klobouky, které přinášejí veselou mysl a dobrou náladu. A právě tyhle klobouky začne dívka rozdávat lidem na pouti, jen tak, zadarmo, jenže důsledky dopadnou na houbového skřítka? houbovým semínkem. Když to semínko Františka zasadí, vyrostou z něj kouzelné klobouky, které přinášejí veselou mysl a dobrou náladu. A právě tyhle klobouky začne dívka rozdávat lidem na pouti, jen tak, zadarmo, jenže důsledky dopadnou na houbového skřítka. Napsala Marie Kubátová, režie Jan Berger. Natočeno v roce 1989. Účinkují Ferdinand Krůta, Pavel Pípal, Věra Kubánková a další.
