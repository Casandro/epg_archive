  title: Pédocriminels, la traque
  subtitle: Avec le développement du numérique, Internet est devenu le terrain de chasse privilégié des prédateurs. Comment les forces policières luttent-elles contre la pédocriminalité.
  ageRating: 12
  genre:
  - '32'
  description: 'En 2022, quelque 88 millions d''images pédocriminelles circulaient dans le monde et, chaque seconde, au moins deux images de viols d''enfant sont échangées sur Internet. Partout où enfants et ados passent du temps (jeux vidéo en ligne, réseaux sociaux), des prédateurs sexuels sont, eux aussi, connectés. Depuis les confinements liés à la pandémie, les tentatives de grooming (ou sollicitation sexuelle de mineurs en ligne) ont explosé. Parallèlement, une pratique ne cesse de s''étendre : le viol d''enfants à distance, soit la commande d''agressions sexuelles à l''autre bout du monde, auxquelles on peut assister en direct. Face à l''ampleur de cette vaste scène de crime, les forces de police s''organisent. Réalisateur: Laetitia Ohnona. Des acteurs: Anne Jacq (la narratrice) (2024)'
