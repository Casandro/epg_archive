  description: 'La route M41 traverse le massif du Pamir et relie Douchanbé, capitale du Tadjikistan, à Bichkek, capitale du Kirghizistan. Elle a été achevée en 1932 et est un cadeau de l''Union soviétique à cette région reculée. La toponymie des sommets témoigne de cette influence. Le paysage change notablement en arrivant au Kirghizistan, avec des steppes prédominantes. Au bord du lac d''Issyk-Koul, un pavillon dédié à l''écrivain Tchinguiz Aïtmatov attire des visiteurs du monde entier. Réalisateur: Hajo Bergmann (2017)'
