  title: 'Pacifique Sud : la facture du climat'
  subtitle: Retour sur le combat mené cinq ans durant par des étudiants en droit du Pacifique Sud pour la justice climatique, qui a donné lieu à un jugement inespéré.
  genre:
  - '146'
  description: 'En 2020, Cynthia et Vishal, étudiants en droit au Vanuatu, et originaires respectivement des îles Salomon et Fidji, grignotées par la montée de l''océan et ravagées par les cyclones, ont décidé de réagir. Puisque, chaque année, les COP (Conference of Parties) s''avéraient impuissantes à freiner le cours des choses, l''ONG estudiantine qu''ils ont fondée se donne pour mission de saisir la Cour internationale de justice, principal organe juridique de l''ONU, afin de donner à leur colère une portée mondiale. Histoire d''une victoire Du Pacifique Sud à La Haye en passant par New York, ce documentaire suit les deux jeunes juristes, bientôt rejoints par des alliés de leur âge venus du monde entier, dans leur combat pour obtenir, d''abord, l''appui du gouvernement du Vanuatu, puis des États de la région, afin que ceux-ci portent leur parole devant l''Assemblée générale de l''ONU, seule à même de saisir la Cour internationale de justice. Le 23 juillet 2025, cette dernière a délivré à l''unanimité un arrêt certes consultatif, mais historique, qui apporte au droit de l''environnement une jurisprudence précieuse. Réaffirmant l''obligation juridique pour les États de lutter contre le changement climatique, la Cour a en effet soutenu la revendication principale des pays les moins riches, notamment du Pacifique Sud, aujourd''hui en première ligne des dérèglements induits par le réchauffement : les plus gros pollueurs doivent aussi être les plus gros payeurs. Or les pays européens et les États-Unis, responsables des plus fortes émissions de gaz à effet de serre en raison de l''industrialisation précoce qui a fait leur prospérité, soutiennent avec constance, de COP en COP, que le calcul des compensations doit être établi à partir de 2015, date de l''accord de Paris sur le climat. Les étapes de cette victoire, conquise de haute lutte, reflète ainsi les principaux enjeux d''une justice climatique à advenir. Réalisateur: Felix Golenko (2026)'
