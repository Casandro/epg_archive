  - '144'
  description: 'Route historique longue de 2 400 kilomètres, la Grand Trunk Road, tracée par les Britanniques à l''époque coloniale, relie l''Inde au Pakistan. Calcutta, première étape du périple, se montre sous son plus beau jour à l''occasion de Durga Puja, l''une des principales fêtes hindouistes. Cap ensuite sur Varanasi, haut lieu spirituel situé au bord du Gange. Après un passage par Delhi, le voyage se poursuit jusqu''à la frontière pakistanaise où, pendant une courte période, se tient une véritable parade martiale : des militaires en uniformes historiques défilent sous les acclamations des spectateurs. Ce premier volet se termine sur des images du quartier afghan de Peshawar, qui a fait du commerce du lapis-lazuli, une roche bleue aux nuances outremer, sa spécialité. Réalisateur: Hajo Bergmann (2017)'
