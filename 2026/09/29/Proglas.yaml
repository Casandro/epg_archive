  title: Na stole je téma
  subtitle: 'Wanko: Jsem přece jejich'
  description: 'Autor: Veronika Smyslová; Interpret: Andrea Buchtová; Premiéra: 29.9.2026 * Nakolik v nás žijí příběhy našich předků? A jak jejich zkušenosti, rozhodnutí, viny nebo křivdy ovlivňují náš vlastní život? Hostem pořadu Na stole je téma je výtvarnice a autorka projektu Wanko Andrea Buchtová, která se rozhodla otevřít vlastní rodinnou historii spojenou s Brnem, česko-německým soužitím, nacismem i poválečnými událostmi. Z osobního hledání postupně vznikl rozsáhlejší projekt propojující umění, terapii, historické bádání a veřejný dialog, jehož součástí je výstava  Wanko: ??vždycky jsme byli Brňáci?“ i časosběrný dokument Wanko: Jsem přece jejich.O rodinné paměti, o tom, co si neseme z příběhů předchozích generací, i o odvaze podívat se na vlastní minulost bez jednoduchého dělení na viníky a oběti si s Andreou Buchtovou povídají Veronika Smyslová a Markéta Brhlíková z Centra dialogu v Arnoldově vile, spravované Muzeem města Brna.'
