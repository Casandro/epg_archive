  title: Barvínek
  subtitle: Barvínek s Vojtou Fišerou - mimořádně nadaným mladým hudebníkem
  description: 'Autor: Alena Rubášová, Natálie Feitová; Interpret: Vojtěch Fišera - mladý houslista a klavírista * Tentokrát si Alča a Naty pozvaly do Barvínku mimořádně nadaného mladého houslistu a klavíristu, držitele ocenění Zlatý oříšek 2025 Vojtu Fišeru. Ačkoli má jen 12 let, je držitelem mnoha ocenění z domácích i mezinárodních soutěží. Zároveň miluje hru na varhany a sám začíná hudbu skládat. Jak vypadá jeho běžný den? Co je jeho velkým snem? Jaké má hudební vzory? A dokáže třeba jen tak odpočívat? To vše se dozvíte v novém Barvínku v úterý 29. září od 17.10 a pak v repríze v sobotu od 11 hodin.'
  genre:
