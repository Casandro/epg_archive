  description: 'Autor: Milan Tesař; Interpret: Luboš Malina, Kateřina García; Premiéra: 15.2.2018 * Na samém začátku roku 2018 vyšlo třetí album country kapely Malina Brothers. Tvoří ji tři bratři Malinové ? banjista Luboš, kytarista Pavel a houslista Pepa ? a spolu s nimi kontrabasista Pavel Peroutka. Hráči známí ze skupin jako Druhá tráva, Žalman & spol., Cop nebo Monogram si pozvali do studia zpěvačku Kateřinu García a společně natočili směs písní, na kterých se trampské vlivy potkávají s tradičními irskými melodiemi. O albu budou ve studiu hovořit Luboš Malina a Katka García.  [bradrs] [garsia]'
