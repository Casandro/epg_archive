  title: Laß jucken, Kumpel
  subtitle: Laß jucken, Kumpel
  description: Im Urlaub landen zwei Kumpel aus dem Ruhrgebiet in Bayern, um Ferien auf einem Bauernhof zu machen. Sie haben "alles inklusive" gebucht und darunter verstehen sie neben Verpflegung und Unterkunft natürlich auch kostenlosen Spaß mit den weiblichen Hotelgästen. Dazu kommen noch Sepp und Michael aus dem Dorfgasthaus, die es sich zur Aufgabe gemacht haben, den hübschen Damen das Jodeln beizubringen. Schon bald kann niemand mehr behaupten, dass es auf der Alm keine Sünde gäbe. Ge 1974
