- eventId: 1228990
  start: 2026-09-29T06:22:00Z
  stop: 2026-09-29T07:12:00Z
  title: Djeca sunca, dokumentarna serija (3/7)
  subtitle: ' '
  description: 'U trećoj epizodi od britanskog astronoma Davida Whitehousa saznajte kako su na Sunce gledali stari Grci i kako se taj pogled mijenjao od Aristotela i Ptolemeja do Kopernika. Središnja tema epizode jest Sunce u temelju svjetskih religija čime se bavi povjesničarka Acharya S. Arheoastronom Clive Ruggles predstavit će tu disciplinu koja spaja arhelogiju, astronomiju i kozmologiju, a bit će riječi i o ljekovitim aspektima Sunčeva zračenja, kao i povijesti istraživanja Sunčevih pjega kroz prve crteže pjega britanskog astronoma Thomasa Harriota. Scenaristi: Mislav Hudoletnjak i Krešimir Mišak'
- eventId: 1228991
  start: 2026-09-29T07:12:00Z
  stop: 2026-09-29T07:42:00Z
