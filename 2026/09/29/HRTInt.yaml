  title: Stipe u gostima (5), humoristična serija (11/20)
  subtitle: ' '
  description: Dino i Tina željeli bi kupiti neki mali, polovni automobil za koji, naravno, nemaju novca pa očekuju pomoć od roditelja. Lani se ideja o kupovini automobila nimalo ne sviđa, a Ive pokušava pomoći tako da Dini pronađe posao. Naravno, uz Đivinu svesrdnu pomoć. Stvari će se dodatno zakomplicirati kada Stipe kako bi pomogao unuku preuzme stvari u svoje ruke...
- eventId: 1228989
