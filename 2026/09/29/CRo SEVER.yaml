  stop: 2026-09-29T09:35:00Z
  title: Host Dopoledního expresu
  description: Hostem Dopoledního expresu bude správce Františkánského kláštera v Kadani Petr Liebscher. Pozveme vás na prohlídku tohoto jedinečného místa, které můžete navštívit denně po celý rok kromě pondělí. Společně projdeme klášterní zahradu, kde se dodnes pěstuje zelenina i vinná réva, a sestoupíme do tajemných několikanásobných sklepů.V samotném klášteře si prohlédneme úchvatné síně se sklípkovou neboli diamantovou klenbou a představíme si oltář 14 svatých pomocníků, který je opředený legendou z 15. století. Nahlédneme také do cely nedávno zesnulého, 103letého františkána Benedikta Holoty. Moderuje Eva Bucharová.
