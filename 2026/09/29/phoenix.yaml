  title: Was die Welt besser macht
  subtitle: Ick steh auf Berlin. 80er/90er
  widescreen: true
  hd: true
  description: West-Berlin ist in den 80er Jahren das Epizentrum der deutschen Musikwelt. Hier spielt das Leben und die Musik. Annette Humpe singt mit Ideal Berlin der Song wird zum Soundtrack der frühen 80er Jahre. Er ist ein Grundstein für das, was später als Neue Deutsche Welle in die Charts einzieht. Die gebürtige Ost-Berlinerin Nina Hagen ist angekommen in West-Berlin. Und feiert mit ihrer Nina Hagen Band Erfolg auf Erfolg. Doch die exzentrische Sängerin und ihre Musiker trennen sich im Streit. Ihre Band geht als Spliff eigene Wege. Die Bands der Neuen Deutschen Welle hört auch André Herzberg in Ost-Berlin.
- eventId:
  - 1186083
  - 1186617
  start: 2026-09-29T01:00:00Z
  stop: 2026-09-29T01:45:00Z
  title: Was die Welt besser macht
  subtitle: Freiheit
  description: Freiheit kaum ein Begriff ist so allgegenwärtig und doch so schwer zu fassen. Es ist ein Gefühl, nach dem fast alle Menschen streben. Mit Freiheit bezeichnet man meist die Möglichkeit, das eigene Leben frei zu gestalten und sich ohne Einschränkungen bewegen zu können. Im Namen der Freiheit werden blutige Kriege geführt, Revolutionen bringen Massen auf die Straße. Es ist ein weiter Weg, bis Freiheit als Grundrecht aller Menschen gilt. Der Wissenschaftsjournalist Mirko Drotschmann reist durch Europa und nach New York, um den Weg der Freiheit von der Antike bis heute aufzuzeigen.
  widescreen: true
  hd: true
- eventId:
