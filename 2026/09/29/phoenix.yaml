  title: Terror im Deutschen Herbst
  subtitle: Frieden statt Feindschaft
  description: |-
    5. September 1977, Köln-Braunsfeld. Gegen 17:30 Uhr fallen Schüsse durch das Kölner Wohnviertel. Was wie ein Bürgerkrieg klingt ist der Höhepunkt einer seit Jahren tobenden Auseinandersetzung. Die RAF hat der Bundesrepublik den Kampf angesagt. An diesem Tag entführen die Terroristen den Arbeitgeberpräsidenten Hanns-Martin Schleyer. Diese Tat ist der Beginn des sogenannten "Deutschen Herbstes".
    Mit der Geiselnahme Schleyers wollen die Terroristen ihre inhaftierten Genossen, darunter Andreas Baader und Gudrun Ensslin, freipressen.
    Der Film taucht ein in die 70er Jahre, als der Terror nach Nordrhein-Westfalen kam.
