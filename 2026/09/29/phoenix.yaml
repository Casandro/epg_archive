  title: Berlin Sounds
  subtitle: Ick steh auf Berlin. 80er/90er
  widescreen: true
  hd: true
  description: West-Berlin ist in den 80er Jahren das Epizentrum der deutschen Musikwelt. Hier spielt das Leben und die Musik. Annette Humpe singt mit Ideal Berlin der Song wird zum Soundtrack der frühen 80er Jahre. Er ist ein Grundstein für das, was später als Neue Deutsche Welle in die Charts einzieht. Die gebürtige Ost-Berlinerin Nina Hagen ist angekommen in West-Berlin. Und feiert mit ihrer Nina Hagen Band Erfolg auf Erfolg. Doch die exzentrische Sängerin und ihre Musiker trennen sich im Streit. Ihre Band geht als Spliff eigene Wege. Die Bands der Neuen Deutschen Welle hört auch André Herzberg in Ost-Berlin.
