  title: Pelagos
  subtitle: Welt der Wale
  widescreen: true
  hd: true
  description: Das Pelagos-Schutzgebiet im Mittelmeer ist eine sichere Zuflucht für Wale und Delfine. Hier sind die bedrohten Tiere sicher vor den Schleppnetzen der Fischereiflotten, aber auch vor anderen Gefahren. So konnte sich das Gebiet zu einem der artenreichsten Meeresgründe der Welt entwickeln.
