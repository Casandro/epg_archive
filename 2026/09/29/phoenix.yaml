  start: 2026-09-29T01:45:00Z
  stop: 2026-09-29T02:30:00Z
  title: Was die Welt besser macht
  subtitle: Alles neu. 00er  20er
  widescreen: true
  hd: true
  description: 'Die Elektropop-Band MiA. rund um Frontfrau Mieze Katz steht für das Lebensgefühl der frühen 2000er: mutig, laut, voller Lust auf Veränderung mit Songs wie Tanz der Moleküle und Alles neu. Mieze Katz erzählt in der Doku von Aufbruch, Brüchen und dem Weg zurück zur Musik. Die Beatsteaks sind fünf Freunde aus Ost-Berlin und Schwaben, die in einem Keller in Mitte anfangen und sich mit schnellem, melodiösem Punkrock bis auf die größten Festivalbühnen spielen. Mit Smack Smash gelingt ihnen der Durchbruch und ein Sound, der Berlin in Bewegung bringt. Doch mit dem Erfolg kommt auch die Frage: Wie weit kann man sich selbst treu bleiben?'
