  start: 2026-09-29T19:00:00Z
  stop: 2026-09-29T19:45:00Z
  title: Der Ozean
  subtitle: Oase des Lebens
  widescreen: true
  hd: true
  description: Der Ozean ist eine Oase des Lebens. Die Doku taucht ab in einzigartige, faszinierende Meeresregionen und ihre ganz spezielle Tierwelt. Buckelwale, die ihre lange Wanderung in antarktischem Gewässer beginnen. Seekühe, die sich in den seichten Lagunen der Bahamas von Putzerfischen verwöhnen lassen. Seehunde, die durch Kelpwälder vor der Küste Kaliforniens ihrer Beute nachjagen. Winzige Seepferdchen und stattliche Haie, die in tropischen Korallengärten Zuflucht, Brut -und Jagdgründe finden. Der Ozean bietet durch seine vielfältigen Lebensräume unzähligen illustren Tiergesellschaften Refugium, Schutz und Nahrung.
