  stop: 2026-09-29T05:55:00Z
  title: Na tri vode
  subtitle: Slušaoci mogu da čuju najnovije informacije iz sva tri grada, najave kulturnih događaja, teme koje su zanimljive našim sugrađanima bez obzira u kom gradu žive.
  description: Slušaoci mogu da čuju najnovije informacije iz sva tri grada, najave kulturnih događaja, teme koje su zanimljive našim sugrađanima bez obzira u kom gradu žive. Stalne rubrike - Dogodilo se na današnji dan, Dečji budilnik, Devojčice i dečaci, Stari Niš, Rokovnik ili Vojvođanske zanimljivosti, tu su da svakodnevica počne sa manje stresa a više optimizma. U dva sata, tu je i dobra muzika, drugačija u odnosu na ostale radio-stanice. Od 6 do 8 sati, pet dana u nedelji, program se čuje na talasima Radio Beograda 2, Radio Novog Sada, ali i na sajtovima Radio Beograda, Radio-televizije Vojvodine i Radio-televizije Srbije.
