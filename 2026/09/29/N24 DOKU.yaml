  title: Geheimnisvoller Bodensee - Auf der Jagd nach Schiffen und Schätzen
  subtitle: Geheimnisvoller Bodensee - Auf der Jagd nach Schiffen und Schätzen
  description: Der Bodensee, an der Oberfläche ein idyllisches Urlaubsparadies, birgt in der Tiefe verborgene Schätze wie Schiffswracks und versunkene Flugzeuge. Ein Abenteurerteam unter der Leitung des Schweizers Silvan Paganini hat es sich zur Aufgabe gemacht, mit einer neuartigen Bergetechnik das Dampfschiff Säntis aus mehr als 200 Metern Tiefe zu bergen. WELT taucht in die geheimnisvolle Unterwasserwelt ein und erlebt, wie das Team versucht, eines der lang gehüteten Geheimnisse des Sees zu lüften.
  widescreen: true
- eventId: 1247609
  start: 2026-09-29T13:02:00Z
  stop: 2026-09-29T13:57:00Z
  title: 'Traumzüge: Thai Rail'
  subtitle: 'Traumzüge: Thai Rail'
  description: 'Mit dem Zug lassen sich die unterschiedlichen Facetten Thailands kennenlernen: Am Golf entlang zur pulsierenden Hauptstadt Bangkok, durch Lop Buri in der Zentralregion, bis ins Hochland zur historischen Stadt Chiang Mai. Pro Jahr reisen mehr als 50 Millionen Menschen mit der Südbahn durch Thailand, mit über tausend Kilometern ist sie die längste Strecke des Landes. Doch das Regeln des Zugverkehrs ist eine logistische Herausforderung, denn das Streckennetz ist teilweise nur eingleisig befahrbar.'
  widescreen: true
- eventId: 1247610
  start: 2026-09-29T13:57:00Z
  stop: 2026-09-29T14:50:00Z
  title: 'Traumzüge: Rovos Railway'
  subtitle: 'Traumzüge: Rovos Railway'
  description: 'Er gehört zu den luxuriösesten Zügen der Welt und führt die Reisenden zurück in die goldenen Zeiten des Schienenverkehrs. Der "Pride of Africa" rollt in der Süd-Nord-Tour durch das atemberaubende Südafrika. Wilde Tiere und spektakuläre Natur begleiten die Passagiere. Ein Abenteuer von Küste zu Küste am Indischen Ozean: Das ist das Streckennetz der Rovos Railway. Die Etappen der Reise sind vielfältig geprägt - ob durch ein Naturreservat, die Wüste oder das Land der tausend Hügel.'
  widescreen: true
- eventId: 1247611
  start: 2026-09-29T14:50:00Z
  stop: 2026-09-29T15:42:00Z
  title: Heiß und zerbrechlich - Die Arbeit der Glasmacher
  subtitle: Heiß und zerbrechlich - Die Arbeit der Glasmacher
  description: 'Etwa 200.000 Gläser werden in einem Werk im niederbayerischen Zwiesel täglich produziert. Einige davon erhalten ihre Form durch traditionelle Handwerkskunst - in der Manufaktur wird jedes Exemplar mundgeblasen und von den Glasmachern modelliert. Ebenfalls in Bayern, im oberfränkischen Steinbach am Wald, befindet sich einer der größten deutschen Hersteller für Behälterglas. Pro Tag werden hier rund 3,1 Millionen alltägliche Gefäße, wie Flaschen, gefertigt. Ihr wichtigster Rohstoff: Altglas.'
  widescreen: true
- eventId: 1247635
  start: 2026-09-29T15:42:00Z
  stop: 2026-09-29T16:28:00Z
  title: Mythos Gold - Das magische Metall
  subtitle: Mythos Gold - Das magische Metall
  description: Gold ist ein Metall wie kein anderes. Es dient als Symbol für Reichtum, Macht und Göttlichkeit. Überirdisch ist nicht nur seine Schönheit, sondern auch die Herkunft - entstanden aus Sternenstaub. Auf der herausfordernden Suche nach dem seltenen Element überschreiten Menschen Grenzen. Die Reportage widmet sich der Faszination rund um Gold und begleitet die Suche nach dem Edelmetall.
  widescreen: true
- eventId: 1247636
  start: 2026-09-29T16:28:00Z
  stop: 2026-09-29T17:16:00Z
  title: Airport Security USA - Folge 10
  subtitle: Airport Security USA - Folge 10
  description: Eine Pistole in einem fehlgeleiteten Koffer aus London sorgt am San Francisco International Airport für Klärungsbedarf. Am selben Flughafen prüfen Beamte, ob ein allein reisender chinesischer Teenager Opfer von Menschenhandel ist. Am Flughafen von Honolulu finden Polizisten in für Australien bestimmte Frachtpakete die Droge Crystal Meth im Wert von zwei Millionen Dollar. Die Lügengeschichte zweier Reisender führt die Beamten am Newark International Airport zunächst auf eine falsche Fährte.
  widescreen: true
- eventId: 1247637
  start: 2026-09-29T17:16:00Z
  stop: 2026-09-29T18:15:00Z
  title: Airport Security USA - Folge 11
  subtitle: Airport Security USA - Folge 11
  description: 'In Newark geraten Beamte bei einer Frachtkontrolle an brisante Funde: Drogen, gefälschte Handtaschen, Medikamente. In Honolulu verweigert ein Passagier jedes Wort. Doch sein Handy deutet klar auf Drogenkonsum hin. San Francisco wird zum Schauplatz einer riskanten Festnahme - ein Gesuchter wird direkt nach der Landung gestellt. Der Mann beteuert lautstark seine Unschuld. Drei Flughäfen, drei Fälle voller Spannung - und die Frage: Haben die Beamten wirklich den Richtigen?'
  widescreen: true
- eventId: 1247664
  start: 2026-09-29T18:15:00Z
  stop: 2026-09-29T19:08:00Z
  title: Spacetime
  subtitle: Die Welt als Ganzes - Kein Makrokosmos ohne Mikrokosmos
  description: Wenn wir das Universum als Makrokosmos verstehen wollen, müssen wir auch die kleinsten Teilchen, den Mikrokosmos, berücksichtigen und umgekehrt - eine Schlüsselerkenntnis in der Kosmologie. Doch die Unendlichkeit ist genauso schwer fassbar wie kleinste Materiebausteine. Daher muss sich die Wissenschaft auf mathematische und theoretische Modelle stützen. Makro- und Mikrokosmos unterscheiden sich stark, bestimmen aber gemeinsam unser Universum.
  widescreen: true
- eventId: 1247665
  start: 2026-09-29T19:08:00Z
  stop: 2026-09-29T20:03:00Z
  title: Spacetime
  subtitle: Geboren aus dem Nichts - Unser Universum
  description: 'Am Anfang war der Knall. Aus dem Nichts entstand unser Universum. Aber was passierte direkt nach dem Big Bang? Weltraumexperte Ulrich Walter erklärt, wie sich das Universum aufblähte und welche Prozesse bis heute noch im Gange sind. Außerdem beschäftigt ihn die Frage, ob sich unser Universum bis in alle Ewigkeit ausdehnen wird. Der Astronaut erklärt die Phänomene, die unser Kosmos birgt: Was sind dunkle Energie und dunkle Materie? Gibt es wirklich parallele Universen?'
  widescreen: true
- eventId: 1247666
  start: 2026-09-29T20:03:00Z
  stop: 2026-09-29T21:05:00Z
  title: Spacetime
  subtitle: Mythos Weltraumfahrt - Ufos, Aliens und die Landung auf dem Mond
  description: Seit mehr als 40 Jahren sind Astronauten für längere Missionen im Weltraum - einst auf den Raumstationen Saljut und Skylab, heute auf der internationalen Raumstation ISS. Doch die Bedingungen im All sind nicht für Menschen geschaffen, dauerhaft können wir dort nicht überleben. War die erste Mondlandung 1969 nur vorgetäuscht? Viele Verschwörungstheorien kursieren um die bemannte Raumfahrt und extraterrestrisches Leben. Der ehemalige Raumfahrer Ulrich Walter klärt die hartnäckigsten Mythen auf.
  widescreen: true
- eventId: 1247684
  start: 2026-09-29T21:05:00Z
  stop: 2026-09-29T21:57:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Schottland'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Schottland'
  description: Einer der prominentesten UFO-Hotspots der Welt befindet in Schottland. In einem Gebiet, das als Falkirk-Dreieck bekannt ist, befindet sich das Dorf Bonnybridge. Hier kommt es am häufigsten zu UFO-Sichtungen in der Region. In dieser Episode untersuchen Craig Charles und Sarah Cruddas eine Vielzahl außergewöhnlicher schottischer UFO-Begegnungen, darunter auch die Sichtung einer glühenden roten Scheibe im Jahr 1991, die mit der Kamera über dem Polmont-Stausee festgehalten wurde.
  widescreen: true
- eventId: 1247685
  start: 2026-09-29T21:57:00Z
  stop: 2026-09-29T22:50:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  description: 'Vor fünfundzwanzig Jahren kam es am Nachthimmel über Phoenix, Arizona, zu einer spektakulären UFO-Massensichtung. Eine Reihe faszinierender Lichtformationen überquerte lautlos die Himmel über dicht besiedelten Städten. Am Abend des 13. März 1997 ging um etwa neunzehn Uhr die erste Meldung ein: Etwas Ungewöhnliches geschehe am Nachthimmel. In den nächsten achtundvierzig Stunden erreichten die Behörden zahlreiche Anrufe. Könnten diese Sichtungen auf außerirdische Lebensformen hindeuten?'
  widescreen: true
- eventId: 1247686
  start: 2026-09-29T22:50:00Z
  stop: 2026-09-29T23:37:00Z
  title: 'Strip the Cosmos: Leben auf dem Mars'
  subtitle: 'Strip the Cosmos: Leben auf dem Mars'
  description: 'Mehr als 40 Raumsonden sind inzwischen zum Mars geflogen, um unseren kosmischen Nachbarn besser kennenzulernen. In dieser Mission ist auch der neue NASA-Rover Perseverance seit dem 30. Juli 2020 unterwegs. Wissenschaftler erhoffen sich vom SUV-großen Roboterfahrzeug Hinweise, um die wohl brennendste Frage rund um den Mars zu beantworten: Gab es Leben auf dem erdähnlichen Planeten? Seine wüstenartige Beschaffenheit lässt daran zweifeln. Könnte der Mars dennoch von Menschen besiedelt werden?'
  widescreen: true
- eventId: 1247687
  start: 2026-09-29T23:37:00Z
  stop: 2026-09-30T00:26:00Z
  title: 'Strip the Cosmos: Weiße Löcher'
  subtitle: 'Strip the Cosmos: Weiße Löcher'
  description: 'Nachdem die Existenz Schwarzer Löcher inzwischen nicht nur mathematisch, sondern auch mittels eines Fotos bewiesen werden konnte, rückt deren Gegenstück in den Fokus der Astronomie: Weiße Löcher. Ein Energiestrom, aus dem etwas austreten, nichts aber eindringen kann. Woraus bestehen Weiße Löcher? Wo und unter welchen Bedingungen treten sie auf? Die Dokumentation geht auf die Suche nach dem mysteriösen Himmelskörper und erklärt die Gemeinsamkeiten und Unterschiede Schwarzer und Weißer Löcher.'
  widescreen: true
