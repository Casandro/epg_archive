  title: Geheimakte Tschernobyl (1)
  subtitle: Geheimakte Tschernobyl (1)
  description: 'Ukraine, April 1986: In Block 4 des Kernkraftwerks Tschernobyl explodiert der Reaktor und setzt eine radioaktive Wolke frei, die fast ganz Europa überzieht. Bis heute ist Tschernobyl hochgradig radioaktiv verseucht. Ein Konstruktionsfehler im RBMK-Reaktor ist vor dem Unfall nur einer kleinen Gruppe von Experten bekannt, doch Akten des KGB belegen, dass Mitarbeiter des sowjetischen Geheimdienstes sich damals schon Sorgen über die Sicherheit des Atomkraftwerks machten.'
  widescreen: true
- eventId: 1247747
  start: 2026-09-29T01:10:00Z
  stop: 2026-09-29T01:56:00Z
  title: Geheimakte Tschernobyl (2)
  subtitle: Geheimakte Tschernobyl (2)
  description: Die Explosion im nuklearen Reaktor 4 des Atommeiler Tschernobyl im April 1986 löste eine katastrophale Kernschmelze aus. Diese wiederum setzte radioaktive Stoffe in die Atmosphäre frei. Eine tödliche, atomare Wolke zog nach Nordwesten. Geheimakten des KGB zeigen, dass die schweren Folgen dieser Wolke - wie eine erhöhte Anzahl an Leukämieerkrankungen - versteckt werden sollten. Dies geschah durch die gezielte Manipulation des Wetters und durch das Unterdrücken kritischer Berichte in den Medien.
  widescreen: true
- eventId: 1247748
  start: 2026-09-29T01:56:00Z
  stop: 2026-09-29T02:49:00Z
  title: Der Sarkophag - Die neue Schutzhülle für Tschernobyl
  subtitle: Der Sarkophag - Die neue Schutzhülle für Tschernobyl
  description: Nach dem Reaktorunglück in Tschernobyl 1986 geht ein radioaktiver Fallout über Europa nieder. Infolgedessen wurde das Atomkraftwerk mit einem Schutzmantel aus Beton umhüllt. Doch dreißig Jahre später droht diese Schutzhülle zu zerfallen. Im Wettlauf gegen die Zeit will ein internationales Team den erneuten Austritt radioaktiver Strahlung durch die Konstruktion eines Sarkophags über der Ruine verhindern. Die Dokumentation gewährt einen Blick hinter die Kulissen des Mammutprojekts.
  widescreen: true
- eventId: 1247749
  start: 2026-09-29T02:49:00Z
  stop: 2026-09-29T03:32:00Z
  title: Lost Ships - Die Bismarck
  subtitle: Lost Ships - Die Bismarck
  description: Mit dem Zweiten Weltkrieg endet das Zeitalter der Schlachtschiffe. Im Mai 1941 werden im Nordatlantik die größten Schiffe der britischen und deutschen Kriegsmarinen zerstört. Die hochmoderne und scheinbar unbesiegbare Bismarck der Deutschen schickt die britische HMS Hood innerhalb weniger Minuten auf den Meeresgrund. Doch nur drei Tage später ist die Bismarck nach einer gnadenlosen Seeschlacht selbst versenkt. Taucherteams untersuchen die Wracks, um die damaligen Ereignisse zu rekonstruieren.
  widescreen: true
- eventId: 1247767
  start: 2026-09-29T03:32:00Z
  stop: 2026-09-29T04:15:00Z
  title: Lost Ships - Die Gustloff
  subtitle: Lost Ships - Die Gustloff
  description: Die Wilhelm Gustloff war das erste Kreuzfahrtschiff, das das NS-Regime erbaute, um darauf deutsche Arbeiter in den Urlaub zu schicken. Im Januar 1945 sind die Tage vergnügter Kreuzfahrten längst vorbei - das Schiff ist die letzte Hoffnung Tausender, vor der Roten Armee zu fliehen. Am 30. Januar 1945 legt die Wilhelm Gustloff auf die eisige Ostsee ab - und wird in der Nacht von sowjetischen Torpedos getroffen. Die Doku rekonstruiert die letzten Stunden an Bord des Schiffes anhand des Wracks.
  widescreen: true
- eventId: 1247768
  start: 2026-09-29T04:15:00Z
  stop: 2026-09-29T05:06:00Z
  title: Das Bermuda-Dreieck - Rätsel im Atlantik
  subtitle: Das Bermuda-Dreieck - Rätsel im Atlantik
  description: 'Für Urlauber das Traumziel schlechthin, für Piloten und Seemänner mitunter der größte Albtraum: die Inselgruppen der Bermudas im westlichen Atlantik. Lassen sich die Horrorgeschichten und Augenzeugenberichte über das Verunglücken oder Verschwinden zahlreicher Schiffe und Flieger im sagenumwobenen Bermuda-Dreieck wissenschaftlich erklären? Die Dokumentation deckt auf, was wirklich am Mythos um den "Friedhof des Atlantiks" dran ist - und was reiner Spekulation entspringt.'
  widescreen: true
- eventId: 1247769
  start: 2026-09-29T05:06:00Z
  stop: 2026-09-29T05:57:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 10'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 10'
  description: 5.000 Beamte arbeiten auf den 28 Brücken, die Mexiko und die Vereinigten Staaten verbinden. In dieser Folge beweist eine frisch ausgebildete Beamtin ihr Können, als sie bei einer Kontrolle in einem Auto 12 Kilo Kokain entdeckt. Außerdem stehen Zoll- und Grenzschutzbeamte auf höchster Alarmbereitschaft, weil ein entführtes Kind möglicherweise über die Grenze nach Mexiko gebracht wurde.
  widescreen: true
- eventId: 1247770
  start: 2026-09-29T05:57:00Z
  stop: 2026-09-29T06:45:00Z
  title: Airport Security USA - Folge 001
  subtitle: Airport Security USA - Folge 001
  description: 'Am internationalen Flughafen von San Francisco versucht ein Mann vier Kilo Marihuana ins Vereinigte Königreich zu schmuggeln. Zwar ist die Droge in Kalifornien legal, ihre Ausfuhr ist jedoch bundesweit strafbar. Statt eines üppigen Gewinns droht dem Erwischten eine lange Gefängnisstrafe. Ein Passagier aus Südkorea hat derweil ganz andere Probleme: Als er in die Maschine nach Seoul steigen will, fangen ihn Heimatschutzermittler ab. Ist der angebliche Tourist ein nordkoreanischer Spion?'
  widescreen: true
