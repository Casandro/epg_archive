  title: Pech na kółkach 1 (odc. 1)
  subtitle: Kompilacja najbardziej spektakularnych wypadków nagranych kamerą samochodową. Kraksy na autostradach, stłuczka trzech aut na skrzyżowaniu oraz niefortunne skoki przez samochody.
  description: |-
    Tytuł oryginalny: Wheels That Fail
    CA, 2014
    Reżyseria: Hugh John Murray
    Od ponad stu lat świat samochodów pełen jest śmiałych wyścigów, widowiskowych popisów i nieuniknionych wypadków. Pasja do prędkości i adrenaliny trwa nieprzerwanie, a dzisiaj te emocje można obserwować jak nigdy wcześniej. To kolekcja najbardziej szalonych, zaskakujących i niebezpiecznych przygód na czterech kołach, które wzbudzają zachwyt i napięcie.
  ageRating: 12
