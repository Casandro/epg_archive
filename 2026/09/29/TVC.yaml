  title: Hitlerowski "Titanic"
  subtitle: Jednym z dziwnych epizodów II wojny światowej była decyzja nazistowskiego ministra propagandy Josepha Goebbelsa o nakręceniu filmu nawiązującego do zatonięcia "Titanica".
  description: |-
    Tytuł oryginalny: Nazi Titanic
    US,GB, 2012
    Reżyseria: Oscar Chan
    Występują: Adolf Hitler, Steve Luckert, Andy Webb, Friedemann Beyer, Joseph Goebbels, Rolf Giesen
    W sercu Trzeciej Rzeszy powstał film, który miał być narzędziem propagandy - monumentalna, kosztowna produkcja zlecona przez Josepha Goebbelsa. "Titanic" w nazistowskiej wersji miał upokorzyć aliantów, a stał się niezamierzoną metaforą upadku samego reżimu. Tragiczny los twórców, dramatyczne kulisy produkcji i wstrząsające zakończenie - historia, w której granica między fikcją a rzeczywistością zaciera się w poruszający sposób.
  ageRating: 7
  genre:
