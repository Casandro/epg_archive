  title: Złapać przemytnika 2 (odc. 7)
  subtitle: Celnicy z Miami znajdują cztery kilogramy kokainy ukrytej w dwóch ciastach. Trop prowadzi do Atlanty, gdzie udaje się rozbić sieć przemytników.
