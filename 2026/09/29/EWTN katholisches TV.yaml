  title: Kirche in Not - Thema
  subtitle: Maria - Braut des heiligen Geistes und Urbild der Kirche
  description: |-
    Mit Pater Gregor Lenzen CP

    Maria wird in der Kirche als "Braut des Heiligen Geistes" verehrt. Doch was bedeutet das eigentlich? Und was hat diese besondere Beziehung Mariens zum Heiligen Geist mit unserem eigenen Glaubensleben zu tun? Der Vortrag zeigt, dass Gottes Wirken nicht an der Oberfläche beginnt, sondern im Inneren des Menschen. So wie Christus durch das Wirken des Heiligen Geistes in Maria Gestalt angenommen hat, soll auch der Glaube im Herzen des Menschen wachsen und Frucht bringen. Zugleich wird deutlich, warum Maria als Urbild der Kirche gilt: In ihr zeigt sich, wozu Kirche und Mensch letztlich berufen sind - zur tiefen Gemeinschaft mit Gott.
  widescreen: true
- eventId: 1139463
  start: 2026-09-29T15:30:00Z
  stop: 2026-09-29T16:00:00Z
  title: Zambia - DJ Baza
  subtitle: EWTN Galerie - Dokumentation
  description: |-
    In dieser Dokumentation begleiten wir DJ Baza - Michael Hamusa, der für Radio Musi-O-Tunya, einen katholischen Radiosender in Livingstone, Sambia, arbeitet.

    Das Radio als Stimme der Versöhnung, als Stimme derer, die sonst keine haben: Michael macht sich auf die Suche nach Geschichten fürs Radio. Der psychisch Kranke, der sich bekehrt hat und von seiner Rettung durch Jesus Christus singt, aber auch die Eltern, die in einer von einer Mine bleiverseuchten Gegend ihre Kinder kaum vor Vergiftung retten können. Michael erzählt diese Geschichten, bringt sie zu den Menschen. Zugleich lernt er, angeleitet von seiner Chefin Sr. Perpetua, seine Arbeit und seinen Dienst beim Radio immer besser auszuüben.

    Eine Dokumentation über das Leben und das Lernen, und über die Mission, die ein jeder Christ hat.
  widescreen: true
