  title: Der heilige Josef - Stationen seiner Verehrung
  subtitle: Die Initiative der Päpste
  description: Im 19. Und 20. Jahrhundert bereiteten die Päpste der Verehrung des heiligen Josef den entscheidenden Weg. Als sichtbare Zeichen entstehen Kongregationen, Bruderschaften und eindrucksvolle Kirchen. Im 4. Teil der Dokumentation werden eindrucksvolle Kirchen in europäischen Städten vorgestellt und das eindrucksvolle Oratorium im kanadischen Montreal besucht.
  widescreen: true
