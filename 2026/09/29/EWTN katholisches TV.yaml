  title: Maria - Zwischen Himmel und Erde
  subtitle: Maria als "Miterlöserin"
  description: 'In der 12. Episode spricht Robert Rauhut mit Prof. Dieter Hattrup über Maria als "Miterlöserin". Können wir Maria als Miterlöserin feiern? Johannes Paul II. sprach 1987 von der Mittlerschaft Mariens in Christus. Das Problem ist das Solus Christus der Neuzeit, das aus der Konkurrenz kommt. Wenn die Konkurrenz wegfällt, ist nicht nur Maria Miterlöserin, sondern jeder Mensch: Gott will dich nicht retten ohne dich. Das entspricht der Kirchenlehre von Lumen Gentium und der allgemeinen Berufung zur Heiligkeit in der Kirche.'
