  title: Kirche in Not - Thema
  subtitle: Maria - Braut des heiligen Geistes und Urbild der Kirche
  description: |-
    Mit Pater Gregor Lenzen CP

    Maria wird in der Kirche als "Braut des Heiligen Geistes" verehrt. Doch was bedeutet das eigentlich? Und was hat diese besondere Beziehung Mariens zum Heiligen Geist mit unserem eigenen Glaubensleben zu tun? Der Vortrag zeigt, dass Gottes Wirken nicht an der Oberfläche beginnt, sondern im Inneren des Menschen. So wie Christus durch das Wirken des Heiligen Geistes in Maria Gestalt angenommen hat, soll auch der Glaube im Herzen des Menschen wachsen und Frucht bringen. Zugleich wird deutlich, warum Maria als Urbild der Kirche gilt: In ihr zeigt sich, wozu Kirche und Mensch letztlich berufen sind - zur tiefen Gemeinschaft mit Gott.
  widescreen: true
- eventId:
