  title: Von Herzen mit Mutter Angelica - Staffel II
  subtitle: Gefühle, Gebete und der Tod
  description: 'In dieser Katechese spricht Mutter Angelika über die Notwendigkeit des Gebets und warum wir meist dann beten, wenn wir ein Problem haben. Und das ist das Gebet des Kummers. Warum aber nicht einfach ganz ruhig Jesus in der Anbetung betrachten? Kontemplation ist einfach dazusitzen und zu sagen: Herr, hier bin ich. Ich liebe Dich. Und das ist ganz einfach. Und in der Stille hört man dann die Präsenz Gottes. Diese Stille seiner Präsenz ist Liebe. Das zweite große Thema der Sendung ist der Tod. Wie bereiten wir uns darauf vor? Und wie werden wir sterben Was erwartet uns dann nach dem Tod?'
