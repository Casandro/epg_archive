  title: Borgia - 1505
  subtitle: Borgia - 1505
  description: Als Lucrezia erst nach der Geburt ihres Sohnes von Cesares Haft erfährt, verkündet sie kühn, eher ihren Sohn zu opfern als ihren Bruder zu verraten. Trotz Niccolo Machiavillis brillanten Plädoyers lässt Della Rovere ihn im Kerker. Lucrezias Bemühungen bleiben ohne Ergebnis, doch Machiavelli verhilft Cesare zur Flucht. Zurück in Ferrara, erfährt Lucrezia vom Tod ihres jüngsten Sohnes.  FR 2013
  ageRating: 16
- eventId: 1250868
  start: 2026-09-29T00:55:00Z
  stop: 2026-09-29T01:49:00Z
  title: Borgia - 1506
  subtitle: Borgia - 1506
  description: Während Lucrezia Alfonso D'Este einen Erben schenken muss, damit er sich nicht scheiden lässt, wird Cesare Gefangener Ferdinands von Aragon. Ferdinand bietet Cesare die Freiheit, wenn er seinen Schwiegersohn Philip von Habsburg tötet. Auch Philip verspricht Cesare seinen Schutz, wenn er Ferdinand tötet. Nach Philips Tod erneuert seine Witwe den Auftrag an Cesare. Doch das Attentat schlägt fehl. FR 2013
  ageRating: 16
- eventId: 1250869
  start: 2026-09-29T01:55:00Z
  stop: 2026-09-29T02:59:00Z
  title: Borgia - 1507
  subtitle: Borgia - 1507
  description: Cesare gelingt die Flucht nach Navarra zu seinem Schwager Johann d'Albret, in dessen Auftrag er einen Aufstand niederschlagen soll. Während Giulia in Rom die Zukunft der Familie Farnese sichert, stiftet Lucrezia Frieden zwischen ihrem Mann Alfonso D'Este und dessen Halbbruder Giulio. Cesare stirbt in einem Hinterhalt der Aufständischen. Sein Diener Agapito überbringt Lucrezia die Todesnachricht. FR 2013
