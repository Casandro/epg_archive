  title: Akcent
  description: Letošní Den architektury je ve znamení nedostupnosti bydlení v Česku. Jakou roli by mohla sehrát při řešení současného nepříznivého fenoménu udržitelná architektura? Jaké jsou její hlavní zásady a priority? A co v praxi obnáší prosazovat udržitelnou architekturu právě v tuzemsku? Saša Michailidis se ptá Petra Klímy a Jiřího Zábrana.
