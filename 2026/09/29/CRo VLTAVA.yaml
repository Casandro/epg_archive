  title: Vizitka
  description: 'Petr Váša, básník, performer a hudebník. Alternativní kapela Ty Syčáci, soustředěná kolem básníka, performera a hudebníka Petra Váši, vydává po osmi letech nové album, v pořadí už deváté. Deska s názvem DLOUHÁ ŠIROKÁ A BYSTROZRAKÁ je hudebním vyprávěním o hledání osobní i tvůrčí identity, podsvětí, ženských hrdinkách a snech, které se zdají přírodě, když spí. Jak dlouho vznikala a co bylo nejzásadnějšími inspiracemi? A nakolik se za těch osm let změnilo soukolí Petra Váši i Těch Syčáků a tím pádem i hudba, kterou dnes tvoří? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
