  description: 'Bohumil Hrabal: Obsluhoval jsem anglického krále (14/14). Román českého prozaika, esejisty a básníka líčí od dvacátých do padesátých let 20. století, tedy v době velkých politických zvratů, životní dráhu číšníka Jana Dítěte, později hoteliéra a nakonec cestáře. Pro rozhlas připravil Jiří Červenka. Účinkuje Ladislav Mrkvička. Režie Markéta Jahodová (29 min). Natočeno v roce 2004.'
