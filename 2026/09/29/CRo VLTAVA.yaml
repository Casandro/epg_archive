  title: ArtCafé
  description: 'Poslechněte si ArtCafé z píseckého festivalu Cool v plotě. David Pomahač diskutoval se spisovatelkou Marií Zelbovou, součástí bylo také autorské čtení z její knihy Táňa Praha 3 Žižkov. Ta vypráví o nestandardním dětství na pražském Žižkově na konci osmdesátých a v průběhu devadesátých let, prožitém v prostředí českého undergroundu. Rozhlasové zpracování knihy uvede Vltava v pořadu Četba s hvězdičkou od 27. září ve vysílání i na webu Českého rozhlasu Vltava. E-mail: artcafe@rozhlas.cz'
