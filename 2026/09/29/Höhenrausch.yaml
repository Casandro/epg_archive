  description: 'Ultimate Rush: Freerider James Heim, Mark Abma und Eric "Hoji" Hjorleifson begeben sich beim Skitourengehen im Hochgebirge auf die Suche nach einzigartigem Pulverschnee, den sie "Epic Pow" nennen. Dabei treffen sie auf verschiedenste Schneeformationen. In den Bergen von British Columbia warten nicht nur extreme sportliche Herausforderungen und gewaltige Naturschönheiten auf die Drei, sondern auch unberechenbare Gefahren. AT 2012'
