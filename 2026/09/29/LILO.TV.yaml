  title: So schmeckt die Welt - Marrakesch
  subtitle: So schmeckt die Welt - Marrakesch
  description: Marrakesch, die pulsierende Stadt im Herzen Marokkos, fasziniert mit ihrem einzigartigen Charme und ihrer orientalischen Atmosphäre. Die berühmten Souks in der Altstadt verzaubern mit exotischen Düften, lebhaften Farben und einem breiten Angebot an Handwerkskunst und Gewürzen. Die historische Medina mit ihren verwinkelten Gassen führt zu beeindruckenden Sehenswürdigkeiten wie dem prachtvollen Bahia-Palast und der imposanten Koutoubia-Moschee. Der lebendige Jemaa el-Fna-Platz ist das Herzstück der Stadt.
  genre:
  - '129'
  widescreen: true
