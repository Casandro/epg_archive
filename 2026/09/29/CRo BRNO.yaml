  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: šéfkuchař Oskar Klanert o konceptu Nová česká. Tato nová platforma si klade za cíl odlehčit, podporovat a propagovat českou kuchyni. Propojuje kuchaře, farmáře i školy a společně tvoří novou českou kuchyni, která vzdává hold minulosti a vaří pro budoucnost. Zkušený šéfkuchař Oskar Klanert přiblíží, jak by měla vypadat tradiční česká kuchyně v 21. století, proč se nemusíme obávat o svíčkovou a jaká je celková vize konceptu. Moderuje Jannis Moras.'
