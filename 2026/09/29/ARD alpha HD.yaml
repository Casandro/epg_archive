  hd: true
  audiodesc: true
  description: 'nano - das ist täglich 30 Minuten Wissenschaft: faszinierende Bilder aus der Welt der Natur- und Geisteswissenschaften, der Technik und der Medizin, spannende Berichte über Fortschritte in der Forschung, den Wandel in der Gesellschaft und über Veränderungen der Umwelt.'
- eventId: 551023
  start: 2026-09-29T03:30:00Z
  stop: 2026-09-29T04:00:00Z
  title: Bob Ross - The Joy of Painting
  subtitle: Rowboat on the Beach
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Jeder Mensch ein Künstler!" Dies berühmt-berüchtigte Motto von Joseph Beuys könnte auch von Bob Ross (1942-1995) stammen. Allein, der amerikanische Fernsehmaler hat - anders als Beuys - keine großen sozialen und politischen Revolutionen im Sinn. Bob Ross will "nur" die einzelnen Menschen glücklicher machen, und das heißt, zu potenten Malern, die ihre eigene Welt erschaffen. Er will uns zeigen: Ein kleiner Künstler steckt in jedem von uns, wir müssen ihn nur herauslassen. Und das geschieht, indem wir lernen, das Malen zu lernen und das Lernen dabei nicht als Mittel zum Zweck, sondern als Selbstzweck begreifen - Spaß dran finden.'
- eventId: 551024
  start: 2026-09-29T04:00:00Z
  stop: 2026-09-29T04:30:00Z
  title: Fast Track English (21/26)
  subtitle: Meet the Police
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Sprachkurs "Fast Track English" bietet die Möglichkeit, vorhandene Englischkenntnisse aufzufrischen und zu vertiefen. Die einzelnen Folgen sind rein englischsprachig. Die Begleitbücher geben aber deutschsprachige Hinweise und Anleitungen. Die Filme wurden an Originalschauplätzen in England gedreht. Es wird alltägliches Englisch gesprochen. Dabei wechseln individuelle Akzente und das Sprechtempo der native speakers, Engländerinnen und Engländer in ihrer normalen Umgebung. Es kann sein, dass der Sprachstudent zunächst nicht alles auf Anhieb versteht.
- eventId: 551025
  start: 2026-09-29T04:30:00Z
  stop: 2026-09-29T05:00:00Z
  title: TELEKOLLEG Französisch (5/39)
  subtitle: Bon Courage
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der 39-teilige Französischkurs "Bon Courage" richtet sich an Anfänger oder dient zur Auffrischung von Sprachkenntnissen. Der Kurs bringt nicht nur die französische Sprache, sondern auch die Lebensart der Franzosen näher.
- eventId: 551026
  start: 2026-09-29T05:00:00Z
  stop: 2026-09-29T05:30:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wie kommen die Löcher in den Käse? Wer malt die Streifen in die Zahnpasta? Wenn ihr etwas wissen wollt und eure Eltern nicht weiterwissen, hilft "Die Sendung mit der Maus" mit ihren Sachgeschichten. Und daneben gibt es natürlich noch die Lachgeschichten mit den Maus-Stars. Da ist der sympathische Maulwurf, der kleine blaue Elefant oder die kleine gelbe Ente. Bei der "Sendung mit der Maus" gibt es immer was zu lachen.
- eventId: 551027
  start: 2026-09-29T05:30:00Z
  stop: 2026-09-29T05:55:00Z
  title: Willi wills wissen (143)
  subtitle: Wer pflückt die Äpfel von den Bäumen?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Was ist rund, knackig und sehr gesund? Genau, der Apfel! Und um den dreht sich heute alles!\nWilli ist mit Obstbauer Martin unterwegs, der ihm seine riesige Plantage am Bodensee zeigt. Martin besitzt rund 100.000 Apfelbäume! Willi darf beim Ernten helfen- heute ist die Sorte Jona Gold an der Reihe. Aber Vorsicht beim Pflücken! Die Äpfel müssen wie rohe Eier behandelt werden, damit sie keine Druckstellen bekommen. \nVon den Apfelbäumen ins Supermarktregal - wie funktioniert das eigentlich? Das übernimmt zum Beispiel die Baywa, eine Erzeugergemeinschaft."
- eventId: 551028
  start: 2026-09-29T05:55:00Z
  stop: 2026-09-29T06:00:00Z
  title: Shaun das Schaf
  subtitle: Besetzt!
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Farmer lässt das Badezimmer renovieren und muss auf ein Baustellenklo ausweichen. Bitzer gibt sein Bestes, um die letzte Rolle Toilettenpapier aufzutreiben. Aber dann klemmt die Tür, und der Farmer ist gefangen. Als Shaun sieht, wie sich der Bauarbeiter eine Dose öffnet, kommt er auf eine gewagte Idee.
- eventId: 532884
  start: 2026-09-29T06:00:00Z
  stop: 2026-09-29T06:30:00Z
  title: TELEKOLLEG Physik - Elektrizität (17)
  subtitle: Elektrischer Strom
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Mit dieser Folge kommt etwas mehr Dynamik in die Elektrik. Nach dem Bereich der "Elektrostatik" werden nun fließende elektrische Ladungen näher untersucht. Eng verknüpft mit dem Begriff der elektrischen Stromstärke ist der Begriff des elektrischen Widerstands, der die Brücke zur elektrischen Spannung aus der letzten Sendung schlägt.
- eventId: 532885
  start: 2026-09-29T06:30:00Z
  stop: 2026-09-29T06:45:00Z
  title: Tele-Gym (5/8)
  subtitle: Schlank, Fit & Gesund
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Ein flacher Bauch, ein knackiger Po und straffe Beine - die Fitness-Expertin Nina Winkler hat dafür nach neuen sportwissenschaftlichen Erkenntnissen die besten Übungen zusammengestellt. \nDie acht intensiven Übungseinheiten trainieren nicht nur die Muskeln, sondern heizen gleichzeitig den Stoffwechsel und die Fettverbrennung an. Dabei schmelzen die Pölsterchen, und Bauch, Beine und Po werden intensiv in Form gebracht.\nDas Training ist für jede Altersgruppe geeignet, da die Übungen in unterschiedlichen Schwierigkeitsstufen gezeigt werden."
