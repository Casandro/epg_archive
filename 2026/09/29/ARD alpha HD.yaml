  description: In Deutschlands Milchviehwirtschaft leben rund vier Millionen Kühe. Damit diese Tiere täglich Milch geben, müssen sie ständig trächtig gehalten werden. Neun Monate dauert die Schwangerschaft einer Kuh, es ist ein fortlaufender Produktionsprozess. Doch was passiert mit den männlichen Tieren, für die die Milchwirtschaft keine Verwendung hat? Oft werden sie zu einer Art "Entsorgungsproblem".
