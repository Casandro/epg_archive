  title: Willi wills wissen (143)
  subtitle: Wer pflückt die Äpfel von den Bäumen?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Was ist rund, knackig und sehr gesund? Genau, der Apfel! Und um den dreht sich heute alles!\nWilli ist mit Obstbauer Martin unterwegs, der ihm seine riesige Plantage am Bodensee zeigt. Martin besitzt rund 100.000 Apfelbäume! Willi darf beim Ernten helfen- heute ist die Sorte Jona Gold an der Reihe. Aber Vorsicht beim Pflücken! Die Äpfel müssen wie rohe Eier behandelt werden, damit sie keine Druckstellen bekommen. \nVon den Apfelbäumen ins Supermarktregal - wie funktioniert das eigentlich? Das übernimmt zum Beispiel die Baywa, eine Erzeugergemeinschaft."
