  description: In der Winterzeit ist auf den Äckern wenig los, aber die Milchviehbetriebe im Norden haben auch in der kalten Jahreszeit zu tun wie immer. So ist es auch bei einem Familienunternehmen aus dem Landkreis Cuxhaven in Niedersachsen, das "alles für die Kuh" erledigt. Ein rollender Einkaufsladen für die Milchviehbetriebe der Region ist mit rund 1000 Artikeln an Bord unterwegs. Gleichzeitig kümmert sich der Reparaturdienst der Firma um Probleme bei der Melktechnik auf den Höfen.
