  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Namib ist die älteste Wüste der Welt. Sie prägt Namibia, den jungen Nationalstaat im Südwesten Afrikas. Eine Region mit extremen Herausforderungen, die sich Menschen ausgesucht haben, um hier ihr Glück zu finden. Sie züchten die Nachfahren der berühmten Namib-Wildpferde, schürfen in Vulkankratern bei sengender Hitze nach Halbedelsteinen, versorgen Wissenschaftler in aller Welt mit Klimadaten aus der Namib. Sie schützen die letzten Wüstenelefanten vor den Menschen, denn die Tiere werden als Konkurrenten um das knappe Wasser betrachtet. Die Wüste ist voller Leben.
- eventId: 533961
  start: 2026-09-29T19:00:00Z
  stop: 2026-09-29T19:45:00Z
  title: Welche Allergie hast Du?
  subtitle: Warum immer mehr Menschen allergisch reagieren
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Allergien gehören weltweit zu den häufigsten Erkrankungen - und die Zahl der Betroffenen steigt kontinuierlich. In Deutschland leiden bereits mehr als 30 Millionen Menschen darunter. Bis 2050 könnte sogar die Hälfte der europäischen Bevölkerung von allergischen Erkrankungen betroffen sein, in Deutschland also jeder Zweite. Doch warum nehmen Allergien so dramatisch zu? Welche Rolle spielen Umwelt, Klimawandel, Ernährung und Lebensstil? Und wie weit ist die Forschung?
- eventId: 533962
  start: 2026-09-29T19:45:00Z
  stop: 2026-09-29T20:15:00Z
  title: 'alpha-thema Gespräch: Klimawandel und Gesundheit'
  subtitle: 'Moderation: Mirjam Kottmann'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Unser Immunsystem wird durch den Klimawandel auf eine harte Probe gestellt. Viele Pflanzen produzieren zum Beispiel bei Dürre mehr Pollen, was für Allergiker eine zusätzliche Belastung darstellt. Wie sich der Klimawandel auch in anderen Bereichen auf die Gesundheit auswirkt, bespricht Mirjam Kottmann mit ihren Gästen:
    * Dr. Martin Herrmann, Vorsitzender der Deutschen Allianz Klimawandel und Gesundheit e. V.
    * Dr. Christina Berndt, Wissenschaftsautorin, empfiehlt konkrete Maßnahmen, wie man die eigene Gesundheit trotz Klimaveränderungen erhalten und gleichsam eine Klima-Resilienz aufbauen kann.
