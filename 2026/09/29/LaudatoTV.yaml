  title: Otvori spomenar
  subtitle: Religijski
  description: 'U novoj sezoni emisije " Otvori spomenar!" gostuje mladi kršćanski duo ZANAS koji je osvojio publiku prekrasnim duhovnim pjesmama, snažnih poruka i modernog zvuka. Duo čine dvojica talentiranih i simpatičnih mladića: Mateo Marić i Marin Lučić koji su i privatno najbolji prijatelji. Trap glazba ima dobar ritam ali i poruke koje mlade ljude mogu odvesti u krivom smjeru. Kršćanski sastav ZANAS donosi pjesme u najljepšem svjetlu, ispunjene Božjom ljubavi. Otkrit će nam, jesu li oduvijek znali da će tako izgledati njihov put i kada se sve promijenilo. Upoznat će nas i s trećim članom sastava ZANAS, kojeg uvijek stavljaju na prvo mjesto i kažu:" Ne ja, nego Ti!" zahvaljujući za sve blagoslove.'
