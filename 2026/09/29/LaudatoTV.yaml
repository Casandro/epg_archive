  description: Luka je vrlo sretan što će za svoj rođendan dobiti popularni Holo9, najbolji holografski sustav igara! Pošto ih nema dovoljno u prodaji, bolesni dječak u bolnici ga ne može nabaviti. Superknjiga vodi djecu na putovanje na kojem će upoznati Abraham i njegovog voljenog sina, Izaka. Abraham stavlja Boga na prvo mjesto u svom životu i voljan je žrtvovati svog vlastitog sina jer je to ono što Bog od njega traži. Luka se vraća kući i poklanja svoj Holo9 malom dječaku u bolnici. On žrtvuje ono što je njemu važno jer zna da je to ono što Bog traži od njega.
