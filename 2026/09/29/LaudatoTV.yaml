  description: Morske dubine kriju mnoge tajne, a najdragocjenije uvijek iznenade jer su od važnog povijesnog i kulturnog značaja. Ljetos je mnoge iznenadilo jedno od najvažnijih arheoloških otkrića iz bizantskog razdoblja na Mediteranu, brodolom na otoku Mljetu. Brod koji datira s kraja 7. ili početka 8. stoljeća prevozio je dragocjeni teret i zlato kakvo na ovim prostorima dosad nije viđeno. Pretpostavlja se da je brod potonuo pokušavajući pronaći zaklon u uvali Polače koja je stoljećima služila kao sigurno utočište. Tajnama morskih dubina vode nas podvodni arheolozi, Igor Miholjek i Pavle Dugonjić, koji s puno ljubavi i predanosti rade svoj posao. Kako doživljavaju svoj posao, duboko pod morem te jesu li ovakva otkrića neprocjenjive kulturne baštine, vrhunac njihova truda i rada, odgovorit će nam u emisiji.
