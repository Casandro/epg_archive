  title: Przepis na remont 1 (odc. 20)
  subtitle: Program, dzięki któremu widzowie mogą poznać tajniki majsterkowania. W każdym odcinku zostaną zaprezentowane proste pomysły, triki i sztuczki, które sprawią, że remont przestanie być udręką.
