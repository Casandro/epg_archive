  title: 'Unforgettable: Zapisane w pamięci 1 (odc. 11)'
  subtitle: Znany łowca duchów zostaje zamordowany. Carrie i Al dowiadują się, że jego śmierć powiązana jest z odkryciem, którego niedawno dokonał.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2011
    Reżyseria: Karen Gaviola
    Występują: Poppy Montgomery, Dylan Walsh, Michael Gaston, Kevin Rankin, Daya Vaidya, Scott Cohen
    Carrie Wells ma niezwykły dar zapamiętywania szczegółów otaczającej rzeczywistości. Bohaterka, która pracowała kiedyś w wydziale zabójstw, ponownie podejmuje współpracę z policją, a jej fenomenalna pamięć staje się kluczowym elementem wspierającym ją w prowadzeniu skomplikowanych śledztw.
  ageRating: 12
