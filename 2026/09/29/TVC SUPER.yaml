  title: Profil 7 (odc. 5)
  subtitle: Rocher, wezwany do gimnazjum w sprawie bójki z udziałem Lucasa, jest świadkiem próby samobójczej Eliotta Baroina. Udaje się jej zapobiec. Rocher odwozi do domu nastolatka, który chciał skoczyć z dachu budynku szkoły.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2016
    Reżyseria: Chris Briant
    Występują: Juliette Roudet, Philippe Bas, Jean-Michel Martial, Raphaël Ferret, Sophie De Fürst, Valérie Dashwood
    Rocher zostaje wezwany do gimnazjum w sprawie bójki z udziałem Lucasa. W tym czasie drugi uczestnik zajścia, Eliott Baroin, próbuje popełnić samobójstwo. W ostatniej chwili udaje się zapobiec tragedii. Rocher odwodzi do domu roztrzęsionego nastolatka. Na miejscu odkrywa, że matka Eliotta nie żyje od pewnego czasu.
