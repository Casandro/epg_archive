  title: Kod dva bela goluba
  subtitle: Od svog početka, 1968.
  description: Od svog početka, 1968. godine, pa do danas emisija Kod dva bela goluba priča priče o starom Beogradu, njegovim žiteljima, pojavama i događajima, ali i priče o prošlosti ostalih mesta Srbije, i o svemu onome što predstavlja živo jezgro naše tradicije. Oživljavanjem poznatih i manje poznatih ličnosti i događaja iz prošlosti, i skretanjem pažnje na istinske vrednosti sadašnjeg vremena, ova emisija i sama daje svoj doprinos bogaćenju naše kulturne baštine.
