  title: Der Tag
  subtitle: Pssst. Diese Sendung ist ein Geheimnis
  description: Alle Menschen haben Geheimnisse. Im Durchschnitt dreizehn, heißt es aus der Forschung. Manche sind winzig, manche verändern ein ganzes Leben. Viele Menschen verschweigen, was ihnen peinlich ist, schützen damit andere - oder sich selbst. Geheimnisse können Nähe schaffen und Vertrauen bedeuten. Sie können aber auch einsam machen. Und während wir im Privaten selbst entscheiden wollen, wer etwas über uns erfährt, leben Geheimdienste davon, anderen ihre Geheimnisse zu entreißen und Journalistinnen wiederum recherchieren sie.
