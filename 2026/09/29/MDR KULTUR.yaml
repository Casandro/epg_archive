- eventId: 653612
  start: 2026-09-29T16:00:00Z
  stop: 2026-09-29T17:00:00Z
  title: 'MDR KULTUR Spezial GESELLSCHAFT: Ausgebremst? - wie weiter mit VW in Zwickau'
  description: "Volkswagen steckt tief in der Krise. Nicht zum ersten Mal, aber dieses Mal ist es anders. Neben zehntausenden Arbeitsplätzen stehen auch ganze Standorte auf dem Spiel. So auch das Automobilwerk in Zwickau/Sachsen. Das Werk beschäftigt rund 8.000 Mitarbeiter und ist weiterhin einer der wichtigsten Industriestandorte in Sachsen.\n\n VW-Chef Oliver Blume erklärte Ende August 2026, dass für Zwickau bislang keine wettbewerbsfähige Auslastung für die Zeit nach 2030 dargestellt werden könne. Gleichzeitig betonte er aber, dass es keine Entscheidung über eine Werksschließung gebe.  \n\nInzwischen wurde beschlossen, Zwickau zum konzernweiten Kompetenzzentrum für Kreislaufwirtschaft und Fahrzeugrecycling auszubauen. Dafür sind Investitionen von bis zu 90 Millionen Euro vorgesehen, und laut VW sollen etwa 1.000 Arbeitsplätze in diesem neuen Geschäftsfeld gesichert werden. In einem Spezial fragt MDR KULTUR, wie die Stadt, die Menschen in diesen unsicheren Zeiten agieren. \n\nModeration: Julia Hemmerling\n\nRedaktion: Gabriele Bischoff und Annette Militz"
