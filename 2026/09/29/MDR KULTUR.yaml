- eventId: 653638
  start: 2026-09-29T18:00:00Z
  stop: 2026-09-29T19:00:00Z
  title: 'Kultur Regional: Werkstatt'
  subtitle: Wie offen kann Europa sein?
  description: "Mit dem europäischen Projekt verbindet sich der Gedanke an einen Kontinent, der sich nach Jahrhunderten nationaler Abgrenzungen und Kriege zu einer Einheit in Vielfalt öffnet und die inneren Widersprüche durch offenen Austausch überwindet. Nach dem Fall des Eisernen Vorhangs wurde der Weg frei für offene Grenzen in ganz Europa. \n\nNicht zuletzt unter dem Eindruck der sogenannten Flüchtlingskrise, erleben wir heute vermehrt innereuropäische Grenzkontrollen und verschärfte Maßnahmen an den europäischen Außengrenzen, die der EU den Vorwurf einer \"Festung Europa\" eingebracht haben. Auch in anderen Politikfeldern gerät die Idee einer gesamteuropäischen Offenheit in Konflikt mit nationalen Abgrenzungsbedürfnissen. \n\nWie offen kann, soll oder will Europa sein, nach innen und nach außen? \nGerade für Deutschland ist eine freundschaftliche Beziehung zu seinen Nachbarn im Osten und Westen wichtig. Dem trägt auch das 1991 in der Klassikerstadt gegründete Weimarer Dreieck Rechnung. In Anlehnung an dieses diplomatische Format diskutiert Helmut Heit von der Klassik-Stiftung mit Claire Demesmay, der Leiterin des Institut français Bonn, und Peter Oliver Loew, dem Direktor des Deutschen Polen-Instituts.\n\nWeimarer Kontroverse vom 14.09.2026 im Bauhaus-Museum\nEine Kooperation mit MDR KULTUR."
