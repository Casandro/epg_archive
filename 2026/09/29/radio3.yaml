- eventId: 657370
  start: 2026-09-29T19:00:00Z
  stop: 2026-09-29T20:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Neue Musik aktuell

    Was gibt es Neues in der Welt der Gegenwartsmusik? Aktuelle Entwicklungen in der Szene der neuen Musik werden beleuchtet und bewertet, Neuerscheinungen auf dem CD-Markt kritisch unter die Lupe genommen. Und immer liegt der Fokus auf Events in der zeitgenössischen Musik, die man auf keinen Fall verpassen sollte.

    Moderation: Andreas Göbel
- eventId: 657371
  start: 2026-09-29T20:00:00Z
  stop: 2026-09-29T21:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Thomas Haak'
  description: |-
    Jazzkonzert David Helbock & Julia Hofer vom 28.06.2026 - Festival JazzBaltica, Timmendorfer Strand

    David Helbock ist einer jener Jazzmusiker, die vor Ideen nur so sprudeln - fast jährlich überrascht der Pianist mit einem neuen Projekt. Auf der diesjährigen JazzBaltica war das ein Duo mit der E-Bassistin und Cellistin Julia Hofer aus Wien, die bislang eher in der Popwelt für Aufmerksamkeit sorgte. Mit ihrem Album "Faces Of Night", das von der London Times zu den besten Jazzalben des Jahres gewählt wurde, erforschen sie die vielfältigen Gesichter der Nacht: Mal verträumt und sphärisch, mal ganz irdisch und groovend - wie selbstverständlich zwischen Schumann, Monk und Prince wandelnd.

    Moderation: Thomas Haak
