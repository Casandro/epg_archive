  title: Vier Frauen und ein Todesfall - Schweißtreiben
  subtitle: Vier Frauen und ein Todesfall - Schweißtreiben
  description: Die Internationale Saunaweltmeisterschaft hält Dorf Ilm in Spannung. Hier profiliert sich der Ex-Bürgermeister Pepperl Nothdurfter um seiner Ex-Frau und Amtsnachfolgerin Mitzi eins auszuwischen. Dass der finnische Schwitz-Superstar den Löffel für immer abgibt und der Lokalmatador Stockinger sich ins Koma flüchtet, war nicht geplant. Hat da nicht jemand den Thermostat manipuliert? Wilde Gerüchte von Russenmafia bis Versicherungsbetrug! Davon wenig beeindruckt gedeihen die Ideen zum Passionsspiel. Und Franzi vollzieht seinen Wandel vom Gourmetkoch zurück zum Einser-Golf in Pink. Julie und Pippa in nun bekennender Mutter-Tochter-Beziehung lösen den Sauna-Fall in gewohnt radikaler Weise.
