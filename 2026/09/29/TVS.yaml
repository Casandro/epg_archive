  title: Górski lekarz
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    Tytuł oryginalny: Der Bergdoktor
    DE,AT, 2013
    Reżyseria: Axel De Roche
    Występują: Hans Sigl, Heiko Ruprecht, Mark Keller, Monika Baumgartner, Ronja Forcher
    "Doktor z alpejskiej wioski" - niemiecko-austriacki serial telewizyjny. Po wielu latach pracy za granicą chirurg z Tyrolu, Martin Gruber, chce sprawić swojej matce urodzinową niespodziankę i złożyć jej niezapowiedzianą wizytę. Rodzinna miejscowość Martina, górska wioska Ellmau, okazuje się zupełnie inna niż ta, którą zapamiętał.
  ageRating: 12
- eventId: 1109390
  start: 2026-09-29T16:50:00Z
  stop: 2026-09-29T17:50:00Z
  title: Krąg miłości
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    Tytuł oryginalny: Familie Dr. Kleist
    DE
    Reżyseria: Peter Weissflog
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser
    Doktor Christian Kleist, główny bohater, po śmierci żony Susanne przenosi się z szesnastoletnią Lisą i dwunastoletnim Peterem do spokojnego Eisenach, by zacząć nowy etap życia. Na miejscu otwiera własny gabinet lekarski, a dzięki życzliwości i empatii szybko zdobywa sympatię mieszkańców oraz burmistrza. Poznaje nowych ludzi, a po latach odnawia też kontakty z dawnymi kolegami i przyjaciółmi.
  ageRating: 12
- eventId: 1109391
  start: 2026-09-29T17:50:00Z
  stop: 2026-09-29T19:50:00Z
  title: 'Rosamunde Pilcher: W grę wchodzi miłość 1 (odc. 55)'
  subtitle: Amanda i Julian planują wspólną przyszłość, lecz ich życie komplikuje się po spotkaniu z wpływowym magnatem Hugh Hanthorpem. Wkrótce Julian musi wyjechać do Nowej Zelandii.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Liebe im Spiel
    DE,AT, 2004
    Reżyseria: Dieter Kehler
    Występują: Katrin Weißer, Klaus Wildbolz, Oliver Clemens, Christine Reinhart, Heidelinde Weis, Billie Zöckler
    Urocza i wykształcona Amanda pracuje w małym wydawnictwie magazynów podróżniczych w Plymouth. Jej chłopak, Julian Reeves, prowadzi dużą szkółkę na wsi. Szczęście ich dwojga wydaje się być przyćmione jedynie przez fakt, że muszą mieć weekendowy związek. Jednak sytuacja zmienia się, gdy Amanda spotyka matkę Juliana i jego ojca chrzestnego, Hugh Hanthorpe'a, na spotkaniu.
  ageRating: 12
  genre:
  - '22'
- eventId: 1109471
  start: 2026-09-29T19:50:00Z
  stop: 2026-09-29T21:35:00Z
  title: Rosamunde Pilcher - Gwiazdy spadają w sierpniu 1 (odc. 47)
  subtitle: Spokojne życie Mandy Trevors komplikuje powrót Johna Higginsa, jej dawnej miłości. Przypadkowe spotkanie po latach budzi uśpione uczucia i wystawia jej małżeństwo na próbę.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Sternschnuppen im August
    DE,GB, 2003
    Reżyseria: Dieter Kehler
    Występują: Elena Uhlig, Oliver Bootz, Nicki von Tempelhoff, Heide Keller, Bernd Stephan, Johanna Christine Gehlen
    Mandy i Roger Trevors są małżeństwem i mieszkają na rodzinnym majątku. Poza tym, że Mandy wolałaby, by Roger dołączył do firmy maklerskiej ojca Herny'ego niż hodował konie wyścigowe, małżeństwo wydaje się nienaruszone. Idealny świat Mandy zaczyna się chwiać, gdy pewnego dnia weterynarz John Higgins, wielka miłość Mandy, wraca do swojej ojczyzny. Lata wcześniej John był Szkocja, bo nie mógł znieść, że Mandy podjęła inną decyzję.
  ageRating: 12
  genre:
