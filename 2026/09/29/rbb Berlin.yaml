  description: "Der 2015 gegründete weltweit erste \"urbane Nationalpark\" der Welt liegt mitten in Toronto, der größten Metropole Kanadas. Obwohl ringsherum gut fünf Millionen Menschen leben, gibt es auf rund 16.000 Hektar eine verblüffende Vielfalt an Tieren und Pflanzen: 1.700 Arten sind es; Habichte, Kojoten und Stinktiere ebenso wie Biber, Seeadler und Stachelschweine. \nNeben der Natur schützt der Park auch historische Farmen, die bis heute bewirtschaftet werden. Hier wird versucht, ein neues Nationalparkkonzept umzusetzen, bei dem Kulturlandschaften Teil des geschützten Parks sind und die Bevölkerung stark mit einbezogen wird."
