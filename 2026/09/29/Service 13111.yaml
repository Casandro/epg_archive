  title: Bares für Rares
  subtitle: Funkelnde Diamantbrosche
  description: |-
    Ein wahres Juwel aus der Art-Déco-Periode! Genauer gesagt, sogar aus dem Zeitraum 1915 bis 1920! Die elegante Stabbrosche in schlanker Schiffchenform vereint zeitlosen Stil und exquisite Handwerkskunst. Die Vorderseite aus edlem Platin und die Rückseite aus 585er Gelbgold beherbergen insgesamt 19 funkelnde Diamanten, darunter prächtige Diamantrosen und Altschliff-Diamanten. Die drei größeren Diamantrosen in der Mitte glänzen mit einem Gesamtgewicht von ca. 0,9-1 Karat, während die kleineren Diamanten zusammen ca. 0,25 Karat wiegen. Hergestellt vom renommierten Hofjuwelier E. Goldschmidt aus Köln, wird dieses Meisterwerk in seiner originalen Schatulle präsentiert und ist ein wahres Highlight für jeden Schmuckliebhaber. Doch sehen die Händler dies ebenso? Gibt es zahlreiche Interessenten im Händlerraum? Wer ersteigert das funkelnde Schmuckstück? Es bleibt spannend!
    Show, Deutschland 2024, R: Sheila Bär-Mertens, Andre Spauke  M: Horst Lichter
