  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: "Frust statt Entlastung:  Drei Viertel der Österreicher mit Regierung unzufrieden\nTeuerung, Spritpreise und Migration: Das sind die größten Sorgen der Österreicher. Das zeigt eine exklusive OGM-Umfrage für BLICKWECHSEL. Wir haben uns im Land umgehört. Wie viel Vertrauen haben die Österreicher noch in ihre Regierung? Unsere exklusive Umfrage liefert ein deutliches Stimmungsbild. Dazu ein Gespräch mit Stephan Zöchling, Unternehmer und Chef des Auspuff-Herstellers REMUS.\n \nEnteignungspläne und Hamas-Verharmlosung: Droht Berlin die erste linksradikale Regierung?\nHistorischer Wahlsieg für die Linkspartei in Deutschland! Erstmals könnte sie die Regierende Bürgermeisterin in Berlin stellen. Ihr Programm: Wohnungskonzerne enteignen, weniger Polizei, den Verfassungsschutz abschaffen. Für besonders heftigen Streit sorgen die Antisemitismus-Vorwürfe. Der Zentralrat der Juden warnt eindringlich vor einer Regierung unter Führung der Linken. Was bedeutet dieser Wahlsieg für die jüdische Bevölkerung Berlins? Wir haben uns in der deutschen Hauptstadt umgehört, mit Menschen aus der jüdischen Gemeinde gesprochen und nachgefragt, wie Muslime den Wahlsieg sehen. \n\nInsekten auf dem Teller: Lebensmittel der Zukunft oder einfach nur eklig?\nHeuschrecken, Mehlwürmer und Käfer. Was für viele nach einer Dschungelprüfung klingt, landet in Österreich längst auf dem Teller. Die EU erlaubt Insekten sogar als Zutat in Brot, Gebäck und anderen Lebensmitteln. Doch fast drei Viertel der Österreicher wollen davon nichts wissen. Ein Volksbegehren fordert jetzt ein Verbot, auch Sternekoch Toni Mörwald winkt ab. Aber schmecken die Krabbeltiere vielleicht besser als gedacht? Wir haben den Selbstversuch gemacht und Passanten zur Insektenverkostung gebeten. Mit überraschendem Ergebnis!\nÖsterreich 2026,  M: Katrin Prähauser"
