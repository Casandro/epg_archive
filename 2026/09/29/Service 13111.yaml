  title: TM Wissen Spezial
  subtitle: Farbenfrohe Welt - Wie Licht, Leben und Technik zusammenspielen
  description: 'Die elektrolumineszierende Farbe, bisher bekannt aus der Welt des Motorsports und Showbusiness, bekommt eine neue Dimension: Sicherheit. Der spanische Ingenieur Roger Calaf entwickelt in einem internationalen Projekt Farben, die Leben retten könnten. Inspiriert wurde er von einem Unfall seines Freundes, des Apnoe-Tauchers Miguel Lozano, der beinahe während eines Weltrekordversuchs verunglückte. Seitdem hat Roger Calaf eine Vision: einen Taucheranzug zu entwickeln, der mithilfe der leuchtenden Farbe biometrische Werte wie Puls und Sauerstoffsättigung in Echtzeit anzeigt. Sobald die Werte gefährlich werden, beginnt der Anzug zu blinken - ein sofortiges Signal für Rettungskräfte. Die Farbe besteht aus mehreren Schichten, darunter Kupfer und Phosphor, und kann auf unterschiedlichste Oberflächen aufgetragen werden. Sie könnte nicht nur im Tauchsport, sondern auch in Feuerwehranzügen eingesetzt werden, um Einsatzkräfte in gefährlichen Situationen zu warnen. Kann diese Technologie die Zukunft der Schutzkleidung neu definieren? Österreich 2024'
