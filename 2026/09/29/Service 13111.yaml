  title: Bares für Rares
  subtitle: Picasso für einen Euro
  description: |-
    Ein Flohmarktfund sorgt im Pulheimer Walzwerk für Furore! Mit nur einem Euro konnte die Verkäuferin einen echten Picasso ersteigern! Wie fällt also die Wertsteigerung nach dem erfolgreichen Verkauf im Pulheimer Walzwerk aus? Kommt es überhaupt dazu? Wie taxiert die Expertin Dr. Friederike Werner das dargebotene Verkaufsobjekt?
    Zum Verkauf steht ein kleiner handbemalter Keramikteller aus der Edition Picasso. Er wurde im Jahr 1952 in der Keramikmanufaktur Madoura in Südfrankreich hergestellt. Der Teller wurde mit einer speziellen Paraffinmalerei-Technik gestaltet. Das Motiv wurde mit einer fetthaltigen Substanz aufgemalt, dann wurde der Teller in Glasur getaucht und gebrannt. Dies erzeugte einen besonderen Effekt, bei dem die Glasur die bemalten Stellen nicht annahm. Auf der Rückseite befinden sich Stempel und Markierungen, die die Echtheit des Stücks bestätigen, darunter Edition Picasso und die Marke der Manufaktur Madoura. Kommt es im Pulheimer Walzwerk zum erfolgreichen Verkauf? Kann der Schätzpreis durch die Expertin Dr. Friederike Werner erreicht oder gar übertroffen werden? Denn es handelt sich um eine limitierte Edition! Gibt es Händlergefechte um den wertvollen Teller von Pablo Picasso? Es bleibt spannend!
