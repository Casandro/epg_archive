  title: Hubert und Staller
  subtitle: Das letzte Kapitel
  description: "Revierleiter Girwidz' Besuch bei der bekannten Krimi-Schriftstellerin Lydia Fernét nimmt einen dramatischen Ausgang. Denn als er ihr Wohnzimmer betritt, findet er die Frau tot auf dem Boden liegen. Er selbst wird niedergeschlagen und der Täter kann unerkannt flüchten. Wer hat die Erfolgsautorin auf dem Gewissen? Die Ermittlungen führen Hubert und Staller in den Buchverlag von Claus Umbach. Der Verleger und die Assistentin der Toten berichten, wie beliebt Fernét mit ihrer Krimireihe war. Doch der Ruhm hatte seine Schattenseiten, denn seit einiger Zeit wurde sie von einem Stalker massiv belästigt. Und tatsächlich ist der Mann auf Bildern der Überwachungskamera vor ihrem Haus zu sehen. Hat die krankhafte Verehrung bis zum Mord geführt? \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2016, R: Philipp Osthus"
