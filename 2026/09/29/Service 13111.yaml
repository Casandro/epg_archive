  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die vergessene Stadt der Maya
  description: |-
    Die Kultur der Maya, die von vielen als eine der bedeutendsten Zivilisationen in der Geschichte Amerikas angesehen wird, florierte über 2000 Jahre lang. Die Maya verfügten über fortgeschrittene Kenntnisse in Astronomie, Mathematik und Zeitmessung und erschufen außergewöhnliche architektonische Bauwerke. Zudem entwickelten sie das einzige vollständige Schriftsystem in präkolumbianischem Amerika und verfassten ausführliche Texte über mächtige Götter, die in ferner Vergangenheit vom Himmel herabstiegen, um ihrer Zivilisation zu helfen.
    Mithilfe von fortschrittlicher LIDAR-Technologie sind im Dschungel von Guatemala mehr als 110.000 bisher unbekannte Maya-Strukturen entdeckt worden, von denen einige bis zu 3.000 Jahre alt sind. Diese Entdeckung hat unser Verständnis der alten Kultur erheblich erweitert. Waren die Maya-Geschichten von Himmelsgöttern womöglich gar keine Fiktion, sondern historische Berichte über außerirdische Besuche?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2024
  widescreen: true
