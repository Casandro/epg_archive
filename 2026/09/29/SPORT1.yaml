  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann.  PS Profi Sidney und seine Crew haben diesmal einen besonderen Auftrag: Sie sollen Andrea helfen, ihr Erbstück "Emma" wieder flott zu kriegen. Andrea liegt der silberne Peugeot besonders am Herzen, sie würde ihn nicht einmal gegen einen Porsche eintauschen wollen. Dennoch ist die Essenerin eingefleischter Fan von schnellen Flitzern. Sie fällt fast vom Glauben ab, als Sidney plötzlich vor ihrer Tür steht, ihren Wagen pimpen will und sie auch noch zu einem Privatrennen einlädt. Heute lässt Sidney sie in seine Tuning- und Racing-Welt eintauchen und bereitet ihr den aufregendsten Tag in ihrem Leben.'
