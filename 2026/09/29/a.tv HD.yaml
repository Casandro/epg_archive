  title: a.tv Sport (Wh.)
  subtitle: DFB in Augsburg zu Gast, AEV gegen Köln, Amateurfußball
  description: 'Internationaler Fußball in Augsburg: Wir blicken auf das Spiel der Deutschen Nationalmannschaft gegen Griechenland in der WWK Arena. Noch mehr Fußball gibt es mit den Highlights aus der Regionalliga Bayern - und dazu noch Amateurfußball mit dem Spiel BC Rinnenthal gegen den TSV Hollenbach. Eishockey darf auch nicht fehlen: wir haben die exklusiven Töne der Augsburger Panther nach dem Spiel gegen die Kölner Haie, und dazu die Frage der Woche an die Panther-Fans.'
- eventId:
  - 1057194
  - 1057235
  start: 2026-09-29T00:45:00Z
  stop: 2026-09-29T01:00:00Z
  title: Daheim & Draußen (Wh.)
  subtitle: 50 Jahre Friedberger Wochenmarkt und Kräuter haltbar machen mit den Gartenfreunden
  description: In dieser Folge sprechen wir im Studiotalk mit Tobias Stuhlenmiller und Albert Bihler von Energietechnik Stuhlenmiller. Außerdem sind wir in einer Änderungsschneiderei zu Besuch und lassen uns hier das Thema Upcycling näher bringen. Und wir zeigen, wie bei Miandji Orientteppiche nicht nur Teppiche gekauft werden können, sondern auch professionell repariert. Moderation Andrea Horn
