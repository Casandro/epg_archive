  description: Folge 59, Carla wird von Tag zu Tag nervöser, denn die Hochzeit mit Turk rückt immer näher. Da taucht zu allem Überfluss auch noch der smarte Dr. Ron Ramirez in der Klinik auf, für den Carla lange Zeit geschwärmt hat. Als ihr Traummann sie plötzlich zu einem romantischen Candlelight-Dinner einlädt, sagt sie spontan zu. Durch Zufall erfährt J.D. von Carlas Date und verspricht ihr, Turk gegenüber nichts zu erwähnen. Bald plagen ihn aber schwere Gewissensbisse.
