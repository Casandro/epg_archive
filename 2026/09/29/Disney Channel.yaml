  subtitle: Meine sexistischen Kollegen Comedy-Serie, USA 2004
  description: Folge 60, Das Klinikteam bekommt eine neue Kollegin. Die Chirurgin Dr. Miller entpuppt sich als resolute Emanze, die es sich zum Ziel gesetzt hat, ihren männlichen Kollegen den Sexismus auszutreiben. Carla ist von der Strategie begeistert, und schon bald muss selbst Dr. Kelso klein beigeben. Auf einem Seminar sollen alle männlichen Kollegen, die sich öfters sexistisch äußern, politische Korrektheit lernen. Dabei wird auch Dr. Cox einiges klar.
