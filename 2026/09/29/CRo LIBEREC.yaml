  title: Host Dopoledne pod Ještědem
  description: 'Téma: Mazlíčci s nadváhou. Odborník na správnou výživu psů a koček Martin Pučálka. Kila navíc nejsou pouze estetickým problémem. Zvyšují zátěž kloubů, zhoršují pohyblivost i dýchání a mohou zkracovat délku života jak lidí, tak i domácích mazlíčků. S odborníkem na zdravou výživu zvířat Martinem Pučálkou se zaměříme na příčiny obezity zvířat a také se naučíme číst etikety krmiv.'
