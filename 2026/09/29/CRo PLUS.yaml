  title: Jak to bylo doopravdy
  description: Od husitů k jezuitům. Záležel úspěch jezuitů také na ženách - mecenáškách? Osudy Marie Františky Slavatové, hraběnky z Meggau a podporovatelky řádu Tovaryšstva Ježíšova v Telči, přiblíží Ivana Chmel Denčevová a histork umění Martin Deutsch. Režie Michal Bureš.
- eventId: 1292392
  start: 2026-09-29T01:33:00Z
  stop: 2026-09-29T02:00:00Z
  title: Pro a proti
  description: Vyhubí nás umělá inteligence? Vědci varují, že lidstvo nad ní ztrácí kontrolu a přicházejí s plánem zastavit globálně vývoj systémů, které jsou chytřejší než člověk. Mají technologičtí giganti své modely ještě vůbec pod kontrolou, nebo už se nám AI potají vymyká z rukou? A co ukázal nedávný bezprecedentní útok modelů Open AI na platformu Hugging Face? S ředitelem pro technologii a bezpečnost české a slovenské pobočky Microsoftu Daliborem Kačmářem a s odborníkem na AI, spolautorem projektu Kanárci v síti Josefem Holým debatuje Lucie Vopálenská. 
