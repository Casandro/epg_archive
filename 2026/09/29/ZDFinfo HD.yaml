    Der Kanadier Martin Lepage wird nach seinem versuchten Schmuggel von 1,5 Tonnen Kokain in Martinique zu sieben Jahren Gefängnis verurteilt. Es ist ein mildes Urteil, weil er Ersttäter ist.

    Nach drei Jahren kommt er bereits frei und kehrt nach Kanada zurück. Doch möglicherweise hat er bereits vorher schon Drogen geschmuggelt. Normalerweise beauftragen Netzwerke keine unerfahrenen Kuriere mit solch großen Mengen. Ist Lepage wirklich ein kleiner Fisch?
