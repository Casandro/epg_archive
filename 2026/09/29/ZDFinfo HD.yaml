  title: Der Kokain-Coup - Jagd nach dem großen Deal
  subtitle: Der große Plan
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2023
    Der verurteilte kanadische Kokainschmuggler Martin Lepage gibt zu, dass er bislang die Wahrheit verschwiegen hat. Er will nun erzählen, wie er den Schmuggel organisiert hat.

    Im Sommer 2016 ist er von einem Mitglied eines kanadischen Motorradklubs angesprochen worden, ob er interessiert sei, Kokain von den Antillen nach Kanada zu transportieren. Er soll damit 2000 Dollar pro Kilo verdienen. Lepage erklärt sich bereit.
    HD-Produktion
- eventId: 899430
  start: 2026-09-29T00:45:00Z
  stop: 2026-09-29T01:30:00Z
  title: Der Kokain-Coup - Jagd nach dem großen Deal
  subtitle: Das böse Erwachen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2023
    Kokainschmuggler Martin Lepage nimmt in der Karibik in einer spektakulären Umladung auf hoher See 1,5 Tonnen Kokain mit an Bord seines Segelschiffes und nimmt Kurs auf Kanada.

    Doch die Fahrt wird nach zwei Tagen gestoppt. Der französische Zoll hatte das Boot schon länger im Visier, da es monatelang verwaist im Hafen von Martinique lag. Lepage und sein Mitsegler versuchen vergeblich, das Boot mitsamt der brisanten Ladung zu versenken.
    HD-Produktion
- eventId: 899431
  start: 2026-09-29T01:30:00Z
  stop: 2026-09-29T02:15:00Z
  title: Der Kokain-Coup - Jagd nach dem großen Deal
  subtitle: Bis zum bitteren Ende
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2023
    Der Kanadier Martin Lepage wird nach seinem versuchten Schmuggel von 1,5 Tonnen Kokain in Martinique zu sieben Jahren Gefängnis verurteilt. Es ist ein mildes Urteil, weil er Ersttäter ist.

    Nach drei Jahren kommt er bereits frei und kehrt nach Kanada zurück. Doch möglicherweise hat er bereits vorher schon Drogen geschmuggelt. Normalerweise beauftragen Netzwerke keine unerfahrenen Kuriere mit solch großen Mengen. Ist Lepage wirklich ein kleiner Fisch?
    HD-Produktion
