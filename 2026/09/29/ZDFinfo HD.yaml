    In der "Konferenz von Jalta" wird über eine Aufteilung Europas nach dem Zweiten Weltkrieg verhandelt. In dieser politischen "Poker-Partie" hat Josef Stalin einen Vorteil: Die Rote Armee ist nicht mehr weit von Berlin entfernt. Er nutzt dies für seine Ziele.
