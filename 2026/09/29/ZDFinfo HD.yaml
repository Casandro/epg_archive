  description: |-
    Deutschland 2023
    Die deutsch-tschechische Grenzregion ist geprägt von malerischer Natur und gleichzeitig überschwemmt von Crystal Meth, einer der gefährlichsten Drogen der Welt.

    6,5 Tonnen Crystal werden jährlich in Tschechien hergestellt, auch für den deutschen Markt. Bettina aus Franken ist seit 30 Jahren süchtig. Sie kommt von der Droge nicht mehr weg. Christian aus Sachsen hat alles verloren - seine Wohnung, Arbeit und Freiheit.
