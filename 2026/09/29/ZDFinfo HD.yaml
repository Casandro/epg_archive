    Mindestens vier Millionen Deutsche kiffen regelmäßig. Cannabis ist damit Deutschlands beliebteste illegale Droge. Welche Gefahren gehen von THC, dem Wirkstoff von Cannabis, aus?

    Warum Kriminelle vor allem auf dem flachen Land Cannabis anbauen und damit handeln, zeigt sich an Deutschlands Küste: Nordwestdeutschland gilt mittlerweile als der Hotspot des Drogenhandels in Deutschland.
