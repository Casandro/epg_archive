    Am 8. Dezember 1941 tritt Amerika in den Zweiten Weltkrieg ein. Auslöser ist der japanische Angriff auf die US-Flotte vor Pearl Harbor. Der Überraschungsangriff erfolgte ohne Kriegserklärung.

    Ein Großteil der amerikanischen Marine wird von den Japanern am 7. Dezember 1941 vor Hawaii liegend zerstört. Am Tag danach erklärt der US-Präsident Roosevelt seinen Landsleuten die schweren Verluste und fordert vom Kongress die Zustimmung zum Kriegseintritt.
