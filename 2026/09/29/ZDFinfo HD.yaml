    Deutschland 2024
    Abhängig auf Rezept: Besonders unter Jugendlichen wächst das Interesse an starken Schmerz- und Beruhigungsmitteln wie Tilidin und Xanax - auch auf dem Land. Mit tödlichen Nebenwirkungen.

    Schätzungsweise 2,9 Millionen Menschen in Deutschland haben einen problematischen Medikamentenkonsum. Brian ist abhängig von Tilidin, Xanax und Valium. Er steht kurz vor dem Entzug. In der Musik des Rap-Stars T-Low ("Sehnsucht") sind Drogen ein fester Bestandteil.
