    18. Juni 1940: Charles de Gaulle spricht in einer Radio-Ansprache aus dem Londoner Exil zu seinen Landsleuten. Er ruft die Franzosen auf, den deutschen Besatzern zu trotzen.

    Zwei Tage vor seiner Rede bricht de Gaulle mit der neuen französischen Regierung. Er akzeptiert die Kapitulation Frankreichs nicht und vereinbart mit Churchill eine Fortsetzung der britisch-französischen Kooperation gegen Hitlerdeutschland.
