  title: Rentnercops (26)
  subtitle: Es ist alles in Ordnung
  description: "Edwin wird immer noch zu Hause bei den Hoffmanns fürsorglich von Heidrun gepflegt - doch kaum gibt es einen neuen Fall ist Edwin auch wieder im Dienst: Im Hof einer Drogenberatungsstelle wird der Ex-Junkie Julius, der dort ehrenamtlich half, tot aufgefunden - mit Drogen in der Jackentasche. \nOffenbar war Julius wieder rückfällig geworden und hatte mit Drogen gedealt. Sein Bruder Bastian aber bestreitet den Rückfall: Julius habe in den letzten Monaten bei ihm gewohnt und einen Entzug gemacht. Er sei clean. Dr. Schmidt und die Laborergebnisse bestätigen das. Aber warum hatte er dann Drogen in der Tasche und wer hat ihn umgebracht?"
