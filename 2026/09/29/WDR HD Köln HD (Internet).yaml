  genre:
  - '16'
- eventId: 1337674
  start: 2026-09-29T13:10:00Z
  stop: 2026-09-29T14:00:00Z
  title: Rentnercops (27)
  subtitle: Auf die Plätze
  description: Während der alljährlichen Bundesjugendspiele bricht Ralf Wernheim vor den Augen seiner Tochter Lily tot zusammen. Wernheim wurde genau zu dem Zeitpunkt erschossen, als er den Startschuss zum 100-Meter-Lauf gab. Obwohl zahlreiche Schüler, Eltern und Lehrer anwesend waren, können Edwin, Günter und Hui keine brauchbaren Zeugenaussagen bekommen. Mit seiner geschiedenen Frau verstand er sich gut, eine neue Beziehung gab es nicht in seinem Leben. Doch die Mails auf seinem Computer weisen scheinbar darauf hin, dass er mit der besten Freundin seiner 17-jährigen Tochter ein Verhältnis hatte. Ein kniffliger Fall für die Rentnercops.
  ageRating: 6
  genre:
  - '16'
