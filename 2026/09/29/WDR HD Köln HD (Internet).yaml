  title: Wer weiß denn sowas?
  subtitle: mit Kai Pflaume
  description: |-
    Gäste: Jürgen Vogel und Reiner Schöne

    Die beiden Rätselmeister Bernhard Hoëcker und Elton stellen sich erneut den unglaublichen, amüsanten und überraschenden Fragen von Moderator Kai Pflaume. Sie spielen im Team mit jeweils einem prominenten Studiogast, denn es gilt, richtige Antworten auf skurrile und knifflige Fragen aus Wissenschaft, Tierwelt und dem täglichen Leben zu finden.

    Beide Teams spielen um Bares für ihre Unterstützer. Zu Beginn des Wissensspiels müssen sich die Zuschauer im Studio entscheiden: Setzen sie sich auf die Seite von Superhirn Bernhard Hoëcker oder von Quizmaster Elton?
- eventId: 1331979
  start: 2026-09-29T08:25:00Z
  stop: 2026-09-29T09:10:00Z
  title: Garten & Lecker (2)
  subtitle: Blumenkuchen aus dem Landgarten
  description: Selbstversorger Uli Schauerte bewirtschaftet bei Arnsberg 16.000 Quadratmeter und ernährt sich ganzjährig von seinem Gemüsegarten. Er hält Bienen, Hühner, Gänse und Wachteln, pflegt Staudenbeete, eine Wildblumen- und Streuobstwiese sowie einen großen Schwimmteich. Mit seiner Devise "selber machen und alte Materialien wiederverwenden" konnte er mit 34 Jahren seinen Traum vom Landgarten realisieren.
  genre:
  - '144'
- eventId: 1334425
  start: 2026-09-29T09:10:00Z
  stop: 2026-09-29T09:55:00Z
  title: 'Expedition in die Heimat: Burgen und Schlösser auf der Alb'
  subtitle: mit Anna Krause
  description: Die Burgen und Schlösser auf der Schwäbischen Alb sind lebendige Orte voller faszinierender Geschichten. SWR Moderatorin Annette Krause reist zu eindrucksvollen, traditionsreichen Gemäuern und trifft dort Schlossherren, Künstlerfamilien und Menschen, die diese historischen Orte mit Leidenschaft bewahren und neu beleben.
