  title: Impakt
  description: IQ Magazine ji letos zařadil do výběru New Bosses, kam pravidelně vybírá nejtalentovanější mladé osobnosti mezinárodního koncertního a festivalového průmyslu. I tak ale hudební produkční Andrea Blahová mluví o finanční nejistotě a potřebě kombinovat několik prací. "V tom seznamu jsem jediná, co má dvě práce. To dobře ilustruje rozdíl mezi mezinárodní a lokální scénou," říká. Co pro ni ocenění znamená? Jak vypadá práce v zákulisí zdánlivě nablýskaného festivalového světa? A jak se dnes daří českým a slovenským festivalům? Moderuje Adéla Šponerová. (repríza)
