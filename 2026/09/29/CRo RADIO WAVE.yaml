  title: Šatníky
  description: Poslechněte si, jaké kolekce zazářily na Mercedes-Benz Prague Fashion Weeku v klubu Sasazu. Vedu byla na MBPFW poprvé, Veronika Ruppert zase byla na všech dosavadních vydáních od začátků v roce 2010. V podcastu uslyšíte o kolekcích od Tomáše Višňovského, Hany Valtové, On The Boat nebo Valerie Jurčíkové. Moderují Veronika Ruppert a Veronika Dušková. (repríza)
