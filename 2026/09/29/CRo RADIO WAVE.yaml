  title: Nádech
  description: Finanční úzkost - jaký na nás má dopad? Jak ovlivňuje naše prožívání i chování a kdo ji zažívá? Souvisí s naší objektivní finanční situací? Odkud se bere náš vztah k penězům? Jak s ním souvisí světová ekonomická situace? A co nám může pomoci, pokud máme neustále pocit, že nemáme dost? V nové epizodě Nádechu s psychologem a psychoterapeutem Ondřejem Ostrovským. Moderuje Lucie Zajda.
