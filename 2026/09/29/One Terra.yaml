  title: Planet Weltweit - Kamelmilch, Kasachstans Wundermedizin
  subtitle: Planet Weltweit - Kamelmilch, Kasachstans Wundermedizin
  description: 'Im zentralasiatischen Kasachstan boomt ein neuer alter Ernährungs-Trend: Kamelmilch. Die Hirten schwören auf ihre heilende Kraft. Mehr und mehr Kasachen entdecken derzeit das Potential der Kamelzucht wieder, denn mit dem Fleisch und der Milch der Herdentiere lässt sich ordentlich Geld verdienen. So sichert eine uralte Tradition vielen Kasachen heute erneut das Überleben. Kasachstan ist der neuntgrößte Flächenstaat der Erde, der überwiegende Teil seines Territoriums besteht aus Steppen, Wüsten und Halbwüsten. Was viele Menschen selbst hier in Zentralasien als unwirtlichen Lebensraum empfinden, ist für Kamelhirten wie den 35-jährigen Berigbai und seine Frau Gulja angestammte Heimat. Die modernen Nomaden und ihre Tiere leben in und von der Wüste, wie einst Jahrhunderte lang ihre Vorfahren. Alles was sie brauchen, haben sie auf den Rücken ihrer Kamele und zwei Autos geladen, samt ihrem transportablen Haus - der Jurte. Der Kamelzüchter Sydyk wiederum macht ein Vermögen mit der Zucht von Kamelen. Die Taukum-Wüste erstreckt sich im Süden Kasachstans. Ihre Fläche entspricht fast der Größe der Schweiz. Sie ist ein idealer Lebensraum für allerlei Arten von Kamelen, deren Zucht langsam aber sicher wieder zu einem wichtigen Wirtschaftszweig im Lande wird. Im Zentrum steht dabei die Milch der Tiere. Seit jeher liefern die Kamele damit das Wichtigste, was Menschen zum Überleben in der Wüste brauchen: ausreichend Flüssigkeit, die außerdem einen hohen Nährwert besitzt. Die Nomaden haben eine Methode entwickelt, die Kamelmilch für lange Zeit haltbar zu machen. Durch Zugabe besonderer Milchsäurebakterien entsteht der so genannte "Kamelmilch-Schubat"; ein leicht säuerliches und sehr beliebtes Getränk, das nicht nur erfrischt und Durst löscht, sondern überdies auch als sehr gesund gilt. Nicht nur in Kasachstan hat sich der Schubat zum neuen Verkaufsschlager entwickelt - und wird sogar zur Behandlung von Kranken eingesetzt. DE 2014'
