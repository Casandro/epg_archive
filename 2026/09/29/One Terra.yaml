  title: Planet Weltweit - Rooibos, der rote Tee Südafrikas
  subtitle: Planet Weltweit - Rooibos, der rote Tee Südafrikas
  description: 'Südafrika ist die Heimat des weltweit begehrten Rooibos-Tees, der für die Menschen hier gleichermaßen Identität, Lebensgefühl sowie Lebensgrundlage bedeutet. Westkap in Südafrika ist eine Landschaft voller Schönheit und Zauber. Majestätisch erheben sich die Zederberge, zu deren Füßen eine kleine Stadt liegt, die aus einer längst vergangenen Zeit zu stammen scheint: Wupperthal! GEO Reportage nimmt uns mit in das Land des roten Tees. Die Rooibos-Pflanze wächst nur in der Gegend um die Zederberge. Alle Versuche, sie in anderen Ländern der Welt anzubauen, sind gescheitert. Wann genau die Khoi San, die Ureinwohner des südlichen Afrikas, die Rooibospflanze und deren Nutzung als Teegetränk entdeckt haben, ist nicht genau belegt. Jedoch ist der Herstellungsprozess seit Jahrhunderten gleich geblieben: Der frisch geerntete, noch grüne Rooibos muss geschnitten, zerdrückt und zum Fermentieren angehäuft werden. Erst dann wird er in der südafrikanischen Sonne getrocknet. Nur wenn all das richtig abläuft, erhält der Tee seine typische, ziegelrote Färbung. Maans Fortuin ist Farmer in einer Kooperative. Der Tee ist für ihn viel mehr als nur ein Produkt: "Das Schönste für mich ist, wenn ich eine volle Ernte sehe. Das ist für mich großartig. Ich bin stolz und glücklich. Es spült Geld in die Taschen der Bauern, es verändert das Leben der Ärmsten der Armen - es bringt Essen auf ihren Tisch..." Überall in der Provinz Westkap wurden in den letzten Jahren Kooperativen von Kleinbauern gegründet, sie produzieren Tee mit Bio-Zertifikat - und "handmade". Der Tee freut sich weltweit großer Beliebtheit, nicht zuletzt wegen seiner guten Eigenschaften: Er ist komplett koffeinfrei und seine entzündungshemmende Wirkung ist medizinisch belegt. Mit viel Lebensmut und Kreativität bewältigen die Rooibos-Bauern den Alltag. Doch die ohnehin harte Arbeit wird in diesem Jahr zusätzlich durch die anhaltende Trockenheit belastet. Der Wassermangel macht allen schwer zu schaffen.  DE 2018'
