  title: Planet Weltweit - Crémant, der feine Elsässer zum Fest
  subtitle: Planet Weltweit - Crémant, der feine Elsässer zum Fest
  description: 'Crémant. Wie der der edle Champagner, wird dieser Schaumwein nach dem "Champagner-Verfahren" hergestellt, so auch im Elsass. Die traditionelle Flaschengärung erzeugt teils spektakuläre Tropfen. Und die sind als "Crémant brut" durchaus mit einem "echten" Champagner vergleichbar. GEO Reportage spürt dem edlen Crémant in verschiedenen elsässischen Weinbaugebieten nach. Viele Crémants aus dem Elsass können geschmacklich locker mit Champagnern mithalten, solange edle Weinsorten Verwendung finden. Qualitativ hochwertige Anbau- und Verarbeitungsmethoden sowie die edlen Böden des Elsass bringen so manchen Spitzen-Crémant hervor. Das weiß auch einer der besten Sommeliers der Welt: Serge Dubs. Der Meister seines Faches begutachtet schon seit Jahrzehnten Weine, Champagner und Crémants. Er kennt die Methoden und Eigenarten der Winzer wie kaum ein zweiter. Schon während der Wachstumsphase, lange vor der Ente, lassen sich die zukünftigen Weinqualitäten ergründen. Je nach verwendeter Rebsorte wird der Crémant im Elsass meist weiß, selten auch als Rosé angeboten. Der Crémant aus dem Elsass gewinnt immer mehr Liebhaber, auch wenn der große Preisvorteil Geschichte ist. Für einen Elsässer Crémant kann man inzwischen problemlos 20 bis 30 Euro je Flasche bezahlen. Die Winzer und Gourmets im Elsass wissen, warum sie ihren hochwertigen Crémant verteidigen und freuen sich jedes Mal auf den neuesten Jahrgang.  DE 2017'
  ageRating: 6
