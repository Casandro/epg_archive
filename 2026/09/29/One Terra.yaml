  title: Planet Weltweit - Die Rettungshunde vom Gardasee
  subtitle: Planet Weltweit - Die Rettungshunde vom Gardasee
  description: 'Am malerischen Gardasee beginnt Ende der 1980er Jahre die Erfolgsgeschichte der weltweit einzigartigen Wasserrettungshunde-Staffel, der Cani Salvataggio. Ertrinken ist nach Verkehrsunfällen weltweit der zweithäufigste Unfalltod, die Rettung ist immer schwierig, geht es doch vor allem um Zeit und Kraft. Denn auch der Retter kann schnell selbst in Gefahr geraten. Die Italienische Rettungshundestaffel besteht aus Neufundländern und Retrievern - Hunden, die das Wasser lieben und mindestens 30 Kilogramm schwer sind. Zusammen mit ihrem Herrchen oder Frauchen werden sie drei Jahre lang zu Rettungsschwimmern ausgebildet.  Als Ferruccio Pilenga, ein altgedienter Zivilschutzmann, in den 1980er Jahren seinen ersten Neufundländer bekam, merkte er schnell, dass der stattliche Hund mit seinem vier Zentimeter dicken Unterfell für das italienische Klima zu warm "angezogen" war. Pilenga fing an, mit seinem Hund schwimmen zu gehen und merkte schnell, das sich die angeborene Wasserliebe und der Apportiertrieb des Hundes gut nutzen lassen. Die Idee der Scuola Italiana Cani Salvataggio, der Wasserrettungshunde-Schule, war geboren. Nur in Italien existiert diese Ausbildung, bei der Herr und Hund drei Jahre lang darauf trainiert werden, ein eingespieltes und unzertrennliches Team zu werden. Vor allem das bedingungslose Vertrauen zwischen Hund und Mensch ist die Basis für die Rettung Ertrinkender. Und so wird am malerischen Gardasee an jedem Wochenende des Jahres trainiert: Ob berufstätige Manager, Hausfrauen oder Studenten: sie alle steigen in ihre Neoprenanzüge, springen mit ihren Hunden von Booten, schwimmen weit hinaus auf den See und holen simulierte Opfer mittels eines Haltegurtes am Körper des Hundes zurück an Land. Die 17-jährige Esther Castellnovo und ihre Hündin Mia sind die Jüngsten im Team - die junge Frau steht erst am Anfang der komplizierten Ausbildung. DE 2011'
