  title: Planet Weltweit - Frankreichs Winzer - Tradition trifft Passion
  subtitle: Planet Weltweit - Frankreichs Winzer - Tradition trifft Passion
  description: 'Frankreich, das Land des Weins. Weinberge prägen die Landschaft wie in kaum einem anderen Land. Doch viele Winzer haben in den letzten Jahrzehnten die traditionellen Wege verlassen. Ihre Produktionspraktiken führten zur Erschöpfung der Reben, massenweise müssen in Frankreich und ganz Europa Weinberge gerodet werden. Immer öfter gehen Winzer nun neue Wege, sie wollen den Weinanbau umkrempeln. Die jungen Rebellen stellen sich dem Niedergang der Weinkultur entgegen. Mit neuen Ideen, aber mit Traditionsbewusstsein und vor allem im Einklang mit der Natur. Einer, der gegen das Sterben der Weinberge in Frankreich ankämpft, ist der Reben-Züchter Lilian Bérillon. In Villeneuve-lès-Avignon, einer kleinen Gemeinde in Südfrankreich, besitzt er eine Baumschule.  Sein Metier ist eher unbekannt, doch ist es das Zünglein an der Waage, wenn es um den Fortbestand der Weinberge geht: Die Qualität der von ihm gezüchteten Rebstöcke entscheidet über die Qualität der Trauben, die später an ihnen wachsen werden. "Die Situation ist durchaus ernst:  Früher pflanzte man Reben für eine Dauer von 80-100 Jahren; heute haben sie nur noch eine Lebensdauer von 20-30 Jahren....der moderne Weinanbau trägt dafür einen Teil der Verantwortung", sagt Lilian. Er pflegt enge Beziehungen zu den Winzern, bereist Weingüter im ganzen Land, um sich ein Bild zu machen und Lösungen zu entwickeln. Auch die nördlich von Lyon gelegene Weinregion Beaujolais durchlebt eine bewegte Zeit. Die umstrittene Qualität des Beaujolais nouveau hat eine ganze Region in die Krise geführt. Hier hat Julien Merle, ein junger Winzer in fünfter Generation, komplett mit der bisherigen Anbaupraxis gebrochen. Zusammen mit seiner Lebensgefährtin Nathalie arbeitet er in bester bäuerlicher Tradition: ökologisch, auf natürlichem Boden, ohne Chemie. Das Ergebnis sind junge, unverdorbene Naturweine, die nicht nur in Frankreich sondern weltweit im Trend sind. Werden sich die "jungen Wilden" durchsetzen auf dem Weinmarkt? DE 2020'
