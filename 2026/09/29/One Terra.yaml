  title: Planet Weltweit - Ein Traum von Schokolade
  subtitle: Planet Weltweit - Ein Traum von Schokolade
  description: Unter den Indianern Südamerikas war Kakao schon lange vor der Eroberung durch die Europäer ein beliebtes Nahrungs- und Genussmittel. Den Mayas galt er sogar als Trank der Götter. Sie verwendeten allerdings den aromatischen Criollo-Kakao - eine andere Kakaosorte als die, mit der heute handelsübliche Schokolade hergestellt wird. Die empfindliche Criollo-Pflanze wächst heute nur noch in den schwer zugänglichen Regenwäldern Venezuelas. Sie zu kultivieren, ist schwierig. Der italienische Schokoladenhersteller Gianluca Franzoni hat es trotzdem gewagt und war erfolgreich. Auf einer Plantage im Nordosten Venezuelas züchtet er seit mehreren Jahren Criollo- Edelkakao, um daraus Schokolade herzustellen, wie schon die Mayas sie kannten.  Wenn der Italiener Gianluca Franzoni Cioccolata sagt, meint er nicht irgendeine Süßigkeit. Er redet dann, wie bei gutem Wein, von einem Produkt, dessen Geschmack mit Herkunft, Kakaosorten, Verarbeitung und Prädikat beschrieben wird - und immer eine charakteristische Note hat. So findet man etwa in seiner Schokolade Porcelana nur Kakaobohnen der gleichnamigen Sorte, genauso wie Jahrgangs-Cabernet nur aus Weintrauben der gleichnamigen Rebe gekeltert wird. Franzonis Firma gehört zu den wenigen Herstellern, die ihre Edel-Schokolade ohne Zusatzstoffe wie Milch oder Zucker produzieren - also zu 100 Prozent aus Kakaobohnen. Dadurch bleibt der reine Geschmack erhalten. Mit herkömmlichen Kakao-Bohnen wäre reine Schokolade entsetzlich bitter. Deshalb verwendet Franzoni für seine Meisterstücke Bohnen der Criollo-Pflanze, die heute nur noch wild in den Regenwäldern Venezuelas wächst - und auf der Plantage der Gebrüder Franceschi. Auf deren Hacienda San José lernte Franzoni einst alles über den Edelkakao. Mit den Brüdern hat er aus dem anfälligen Criollo-Busch, der auf Plantagen meist binnen kurzer Zeit von Pilzen und Schädlingen hinweggerafft wird, dreizehn robuste Sorten gezüchtet. DE 2004
