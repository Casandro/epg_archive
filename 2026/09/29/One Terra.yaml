  title: Planet Weltweit - Thaimassage, die Heilkunst der Buddhisten
  subtitle: Planet Weltweit - Thaimassage, die Heilkunst der Buddhisten
  description: 'Es ist eine alte Heilkunst und in Asien weit verbreitet: Thai-Massage, die je nach Landesart den Körper, die Füße oder auch den Schultergürtel entspannen soll. In Thailand ist Massage seit jeher selbstverständlicher Teil des Alltags. Sie wird im familiären Umfeld zur Gesundheitsvorsorge praktiziert und sie findet auch in Krankenhäusern Anwendung. Thailands Massage-"Zentrum" ist Chiang Mai, die nördliche Landesmetropole. Über hundert Schulen werden hier betrieben. Wer in Thailand als Masseur arbeiten will, muss früher oder später eine staatliche Prüfung ablegen. GEO Reportage war vor Ort. Bei der Thai-Massage geht es meist um Gelenkmobilisation durch Stretching und Akupressur-Techniken. Unterstützt durch Kräuter, Kompressen und Lotionen. Die traditionelle Thai-Massage wurde Überlieferungen zufolge bereits vor über 2.500 Jahren praktiziert und sie ist eng mit dem Buddhismus verbunden. Als Gründungsvater gilt ein indischer Arzt namens Jivakar Kumar Bhaccha, ein Zeitgenosse und Leibarzt von Buddha persönlich. Auch die Yoga-Elemente verweisen auf einen indischen Ursprung, ebenso wie die Grundannahme der körpereigenen Energielinien, der sogenannten Sip Sen Tai, an den die Lebensenergie entlang fließen soll. Die Thai-Massage verspricht Linderung bei Störungen des Bewegungsapparats, regt die Blutzirkulation an und entspannt die Muskeln. Außerdem hilft sie, Schwellungen und Muskelkater abzubauen. Und nicht zuletzt ist Massage eine klassische Form von Wellness. Auf der Insel Koh Mak im Golf von Thailand, an der Grenze zu Kambodscha, lebt eine Meisterin der Thai-Massage. Mit ihren Schülerinnen betreibt Nhong Na Nakhon hier eine Massagepraxis, in der neben Entspannungs-Behandlungen auch ganz handfeste medizinische Probleme therapiert werden. Doch auch sie ist stets auf der Suche nach neuen Massagetechniken. Deshalb macht sich die Massage-Meisterin nun auf nach Chiang Mai.  DE 2019'
