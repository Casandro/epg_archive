  title: Planet Weltweit - Die Austern von Arcachon
  subtitle: Planet Weltweit - Die Austern von Arcachon
  description: "Im Becken von Arcachon an der französischen Atlantikküste liegt die Wiege der französischen Austernzucht - und mittlerweile auch die größte Austernbrutstätte Europas. Seit einiger Zeit jedoch bedrohen Viren und Bakterien die jährliche Ernte, und die ersten Austern sterben ab, bevor sie ein Jahr alt sind. Für die traditionellen Austernfischer ist das eine Katastrophe. \nDen Austernzüchtern im Becken von Arcachon steht das Wasser bis zum Hals - und das, obwohl ihre Produkte zur Leibspeise der Franzosen gehören. Der Grund ist ein Virus, das einen Großteil ihrer jährlichen Ernte zunichtemacht, bevor sie für das französische Weihnachts- und Silvesterfest geerntet werden kann. Die Einnahmen der Austernfischer schwinden, die Konkurrenzkämpfe nehmen zu. Während Wissenschaftler und Züchter verzweifelt versuchen, ein Mittel gegen den Erreger zu finden, gehen Spezialeinheiten der Küstenpolizei auf Streife, um Austerndiebe zu fangen. Diese Reportage hat Züchter an der französischen Atlantikküste bei ihrem Überlebenskampf begleitet. \nDie Weihnachtszeit ist in Frankreich untrennbar mit dem Austernschlürfen verbunden. Etwa 150.000 Tonnen der Schalentiere werden hier jedes Jahr verspeist. Die Züchter verdienen in dieser Zeit 70 Prozent ihres Jahreseinkommens. Einer von ihnen ist Olivier Laban, Chef einer mittelgroßen Austernfarm. Seine Auftragsbücher sind voll, doch wie lange er liefern kann, weiß er nicht. Seit einigen Jahren sind sämtliche Bestände des Beckens von einem Virus bedroht, das zwar für den Menschen ungefährlich ist, aber etwa 80 Prozent der jungen Austern dahinrafft, bevor sie verkauft werden können. Eine verheerende Entwicklung für die Züchter. Umweltschützer meinen, dass das Problem hausgemacht sei - durch die fortwährende Überzüchtung, die etwa dafür sorgen soll, dass die saisonal laichenden Tiere ganzjährig erhältlich sind, aber womöglich ihre natürlichen Abwehrkräfte schwächt. Für Männer wie Olivier Laban geht es um die nackte Existenz. DE 2013"
