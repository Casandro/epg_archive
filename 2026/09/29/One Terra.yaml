  title: Planet Weltweit - Die Eisbergjäger von Neufundland
  subtitle: Planet Weltweit - Die Eisbergjäger von Neufundland
  description: |-
    Gewaltige Eisberge ziehen im Frühling an der Küste Neufundland vorbei. Von Grönland aus treiben sie auf der sogenannten "Eisberg-Straße" nach Süden. Gefährliche Kolosse für Schiffe und Öl-Plattformen. Einige der Einwohner Neufundlands haben aus dem Naturschauspiel ein Geschäftsmodell entwickelt: Sie schleppen die kleineren Eisberge in den Hafen und schmelzen sie zum reinsten Trinkwasser, das es gibt.
    Die Titanic war ihr bekanntestes Opfer. Als sie 1912 vor der Küste Neufundlands einen Eisberg rammte und sank, rückte die kleine Insel erstmals in den Fokus der Öffentlichkeit. Damals wurde eine Aufklärungsstaffel gegründet, die Schiffe und nun auch die Bohrinseln vor drohender Gefahr warnt. Doch die Menschen erkannten auch den Nutzen der kalten Kolosse: Sie fischen sie ab und verarbeiten sie zu Trinkwasser. Dem reinsten Trinkwasser der Welt. Wir haben einen der wenigen noch arbeitenden Eisbergjäger begleitet.
    Ed Kean ist unzufrieden. Sein altes Boot macht ihm Sorgen, es versagt immer wieder seinen Dienst. Dabei ist er gerade jetzt im Frühjahr auf den Kutter angewiesen. Denn nun macht Ed sein Hauptgeschäft. Er sucht nach kleineren Eisbergen, die vor der Küste Neufundlands vorbeidriften, fängt sie ein und baut sie quasi ab. Das aus ihnen entstehende Schmelzwasser verkauft er an Bier- und Wodkaproduzenten, die sich rühmen, die jeweils reinsten Produkte ihrer Art herzustellen. Ed ist einer der letzten seiner Zunft. Dabei war die Eisbergjagd ein lohnendes und vielversprechendes Geschäft, als der Kabeljau-Fischfang, bis dahin die Haupteinnahmequelle vieler Neufundländer, in den 1990er Jahren zum Erliegen kam. Heute ist Ed einer der wenigen, die weiterhin diesem Beruf nachgehen. Nachfolger hat er keinen. Zu mühselig, zu unberechenbar das Gewerbe. Lediglich sein Cousin interessiert sich für die Branche. Dabei ist das Geschäft nach wie vor erfolgreich.  DE 2014
