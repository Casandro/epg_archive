  title: Planet Weltweit - Honeymoon auf Hainan
  subtitle: Planet Weltweit - Honeymoon auf Hainan
  description: 'Die Chinesen behaupten, Hainan sei besser als Hawaii - obwohl kaum ein Chinese je auf Hawaii gewesen ist. Hainan dagegen kennen sie: Zwölf Millionen Urlauber aus dem Reich der Mitte kommen jährlich auf die Ferieninsel im Südosten Chinas. Viele von ihnen mit der Absicht, sich in diesem Urlaubsparadies das Ja-Wort zu geben. Unter ihnen sind auch Tao Li und Jing Xu. Das Paar aus Zentralchina will am "Hochzeitsfestival" teilnehmen - einem Spektakel, das zu den Höhepunkten auf der Insel zählt.  Hainan, im äußersten Süden Chinas, ist gerade einmal zwei Flugstunden von Hongkong und Kanton entfernt. Für wohlhabende chinesische Großstädter ist die Insel vor der Haustür deshalb ein ideales Urlaubsziel: Strahlend blauer Himmel das ganze Jahr über, schneeweiße Südseestrände, kristallklares Wasser und fast unberührte Natur. In den Bergen der Insel breiten sich Tausende Hektar tropischer Regenwald aus. Die 27-jährige Jing Xu und ihr 33-jähriger Bräutigam Tao Li sind hierher gekommen, um zu heiraten - nach westlichem Vorbild, ganz in Weiß beim Hainan Hochzeits-Festival. Das ist neu in China - früher wurde nur nüchtern standesamtlich im Kreise der Familie geheiratet. Fast hundert Brautpaare wollen sich in den drei Tagen des Festivals das Ja-Wort geben. Und alle werden sie an einem Programm teilnehmen, welches eigens für dieses Ereignis kreiert wurde und in diesem Jahr bereits zum achten Mal stattfindet. Es besteht aus einem Tag der Liebe, einem Romantik- und dem eigentlichen Hochzeitstag. Vorbild dabei sind auch hier europäische Zeremonien vermischt mit chinesischen Sitten: So schieben sich beim Honeymoon Hunderte Chinesen gleichzeitig über den weißen Strand, ohne Lust auf ein Bad - nur die wenigsten Chinesen können schwimmen. Die idyllische Inselwelt wird im Stechschritt erkundet, und am romantischsten Ort der Insel, einem riesigen Beton-Reh, nehmen die Brautpaare an lautstarken Gruppenspielen teil. DE 2005'
