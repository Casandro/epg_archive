  description: An der Spitze der bretonischen Halbinsel liegt das Departement Finistère, das "Ende der Welt". Es ist eine urwüchsige Landschaft mit rauer Küste und sagenumwobener Leuchttürme. Der Atlantik sichert den Fischern traditionell ein gutes Auskommen, aber die Bestände gehen immer weiter zurück. Wie bewahren sich die Menschen ihre bretonische Lebensart? DE 2020
