  title: Planet Weltweit - Lichterglanz im Norden - Winter in Stockholm und den Schären
  subtitle: Planet Weltweit - Lichterglanz im Norden - Winter in Stockholm und den Schären
  description: 'Nur sechs Stunden natürliches Licht gibt es am dunkelsten Tag des Jahres in Stockholm. Diese lange Dunkelheit macht die Menschen dort und in den Schären, der Inselwelt vor der schwedischen Hauptstadt, erfinderisch. Sie schmücken Straßen und Fenster mit Licht, Künstler gestalten Lichtskulpturen und viele Schulen feieren traditionell das Lichterfest der Lucia mit Konzerten. Und alle freuen, wenn an klaren Wintertagen die Sonne vom Himmel strahlt. Stockholm und sein Schärengarten sind weltberühmt, im Sommer verbringen Tausende Touristen auf den kleinen Inseln ihren Urlaub. Im Winter herrscht hier zumeist Stille, aber die Versorgung mit allem Wichtigen ist trotzdem sichergestellt: Kapitän Niclas Jornée fährt täglich mit der Fähre "MS Queen" vom Festland zu den Schären und zurück. Er und sein Team sorgen für Nachschub für den kleinsten Inselladen bis hin zum Cateringunternehmen. Nur so können seine drei Gründerinnen das ganze Jahr über auf ihrer Heimatinsel leben und arbeiten. In Stockholm unterdessen bereitet sich der Chor der Adolf-Fredriks-Musikschule auf sein Lucia-Konzert in der Hedwig-Eleonora-Kirche vor. Aus den 120 Chorschülern wurde diesmal die 14-jährige Elsa ausgewählt, die Lucia darzustellen. Sie darf die mit brennenden Kerzen bestückte Lichterkrone feierlich auf dem Kopf tragen, eine Ehre für die Auserwählte. Auch beim Lichtkünstler Johan Ferner Ström laufen die Vorbereitungen auf die kalte, dunkle Jahreszeit. Zusammen mit seinem Kollegen Tor Svae wird er einen strahlenden Kinderspielplatz eröffnen, den beide gemeinsam gestaltet haben. Und es wartet auch schon ein Auftrag für neue Lichtskulpturen in Form von riesigen Eicheln auf sie. Die kalte Jahreszeit und ihre kurzen Tage mit wenig Licht werden von den Schweden kreativ und stimmungsvoll begangen. DE 2020'
