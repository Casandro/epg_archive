  title: Planet Weltweit - Die Zedernuss, die Königin von Sibirien
  subtitle: Planet Weltweit - Die Zedernuss, die Königin von Sibirien
  description: 'Die Samen der sibirischen Zirbelkiefer gelten als uraltes Heilmittel der einheimischen Volksmedizin. Gesund, cholesterinsenkend und schmackhaft, werden sie inzwischen maschinell verarbeitet und in die ganze Welt verschickt. Zuerst müssen sie jedoch in den Wäldern des Altai-Gebirges in mühevoller Handarbeit geerntet werden. Ganze Familien ziehen im Herbst in die Berge zur Zedernussernte. Und erarbeiten sich damit einen Verdienst, der für mehrere Monate zum Überleben reicht. GEO Reportage hat eine Familie begleitet. Der Altai: Gelegen im Vierländereck von Russland, Kasachstan, China und der Mongolei. Das Gebirge ist bis heute nur wenig erschlossen. Die Menschen leben verstreut in den umliegenden Tälern. Im September bereiten sie sich auf die Zedernussernte vor. Zu ihnen gehört auch die Familie von Aronat Bakchukov. Zusammen mit seinem Vater, Bruder und dem Schwager geht es dann für mehrere Wochen in die Berge, um dort die Zapfen direkt aus den Bäumen zu holen. Dafür nehmen die Männer mitunter halsbrecherische Aktionen in Kauf und klettern bis in die Spitzen der Zedern. Das macht die Arbeit gefährlich: Sibirische Zedern mit ihren Zapfen sind extrem harzig, die Äste dünn, ihre Nadeln zum Glück aber nicht sehr spitz. Die Männer müssen schnell sein. Nachbarn und Saison-Pflücker aus anderen Regionen sind ebenfalls unterwegs und machen ihnen die Ernte streitig. Außerdem fallen die Temperaturen Anfang September in diesen Höhen vor allem nachts schon unter den Gefrierpunkt. Für Aronat gibt es in diesem Jahr noch einen weiteren Grund, sich anzustrengen: Der 24-jährige möchte im Anschluss an die Ernte ein Praktikum in einer der nussverarbeitenden Firmen in der Großstadt Novosibirsk absolvieren. Es wäre sein erster Ausflug hinaus aus seinem Heimatdorf. Von dem verdienten Geld möchte sich Aronat einen sehnlichen Wunsch erfüllen: Endlich ein eigenes Pferd kaufen. Doch wird er nach dem Ausflug in die moderne Stadt überhaupt in sein Dorf zurückkehren wollen? DE 2019'
