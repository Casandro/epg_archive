  title: Sprintour - Deutsche Kolonien in Paraguay
  subtitle: Sprintour - Deutsche Kolonien in Paraguay
  description: Letzte Woche waren wir mit unserem Wohnmobil in der Hauptstadt von Paraguay, Asuncion, unterwegs. Jetzt geht es mit unserem Wohnmobil endlich in den Norden von Paraguay, durch den Chaco. Allerdings läuft dort nicht alles nach Plan und wir hängen wieder in der Werkstatt fest. Der westliche Chaco in Praguay besteht aus sumpfigen Palmensavannen, wohingegen der nördliche Teil des Chacos sehr trocken ist. Wir fahren auf der Ruta Transchaco mit unserem Wohnmobil in die Richtung von Filadelfia in Paraguay. Aber zuerst machen wir Halt in einem Naturschutzgebiet, in Campo Maria. Dort entfliehen wir der Hitze, machen uns einen schönen Vanlife Grillabend und können endlich mal ausschlafen. Auch wenn es teilweise sehr trocken ist, kann man dort viele unterschiedliche Vogelarten beobachten. Einmal die Hängematte aufspannen und voll und ganz das Vanlife genießen. Die Ruta Transchaco ist asphaltiert und gehört eher zu den guten Straßen in Paraguay. Die Hauptstraßen in Paraguay sind generell in einem guten Zustand. Wenn man allerdings nach links und rechts abbiegt, dann kann man sehr schnell auf einer schlechten Schotterpiste landen. So auch wir. Wir fahren durch zahlreiche Mennonitensiedlungen und staunen über den deutschen Einfluss in Paraguay. Damals sind viele (Ursprungs-) Deutsche nach Paraguay ausgewandert und haben im Norden deutsche Kolonien gegründet unter der Voraussetzung den Chaco urbar zu machen. Diesen deutschen Einfluss merkt man überall in der Region um Filadelfia und Loma Plata herum. Die deutsche Sprache ist dort weit verbreitet. Es sind auch einige Deutsche in diese Gegend ausgewandert. Zudem haben die Mennoniten dort zahlreiche Geschäfte, in denen wir endlich die Ersatzteile für unser Wohnmobil kaufen können, nach denen wir sehr lange in Südamerika gesucht haben. PY 2023
