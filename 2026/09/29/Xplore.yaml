  title: Sprintour - Offroad Peru mit dem Wohnmobil
  subtitle: Sprintour - Offroad Peru mit dem Wohnmobil
  description: 'Wir sind mit unserem Wohnmobil in Peru und wollen jetzt endlich die Andenregion in Peru erkunden. Offroad in den Anden in Peru: Ein Traum von uns beiden! Bevor es losgehen kann, landet unser Wohnmobil zuerst einmal in der Werkstatt. Ein Dämpfer von unserem VW Crafter Camper ist kaputt gegangen. Deshalb müssen wir wieder in Richtung Bolivien fahren um den Dämpfer auszutauschen. Zum Glück klappt es und unser VW Crafter Wohnmobil ist einsatzbereit für die Offroadstrecke in den Anden in Peru. Unser Ziel ist der Berg Pallay Punchu. Er ist im Gegensatz zu den Rainbow Mountains in Peru gar nicht touristisch erschlossen. Wir wagen das Offroad Abenteuer und begeben uns auf die spannende Strecke. Eine ewig lange Schotterpiste führt uns in den peruanischen Anden über wunderschöne Pässe, kleine Dörfer und eine atemberaubende Natur. Die Anden in Peru sehen sehr einzigartig aus. Es ist schwer Vergleiche zu finden. Die Strecke hoch zum Pallay Punchu erweist sich nach der ersten recht guten Passage als schwierig. Der Weg ist einspurig und auf 4500 m eine richtige Herausforderung für unseren VW Crafter Camper. Fürs Vanlife ist er perfekt, ist dieses Offroad Abenteuer aber zu viel für unser Camper? Unser Wohnmobil bekommt kaum Luft und das Anfahren wird immer schwieriger. Dazu werden die Kurven immer enger und der Weg immer steiler. Wendemöglichkeiten: Fehlanzeige! Manche Kurven sind so eng, dass wir für einen längeren Moment überhaupt nicht herauskommen. Auf über 4500 m ist das Anfahren eine richtige Qual. Wir schaffen es trotzdem diese Offroad Passage zu meistern und kommen oben am Berg an. Eine Stunde und 200 Hm später kommen wir ganz oben außer Puste an und können den Pallay Punchu in voller Pracht bestaunen. PE 2023'
  ageRating: 12
- eventId: 1250863
  start: 2026-09-29T07:35:00Z
  stop: 2026-09-29T07:58:00Z
  title: Sprintour - Durch die Berge in Peru
  subtitle: Sprintour - Durch die Berge in Peru
  description: Wieder kommen wir und unser VW Crafter Camper an unsere Grenzen! Unsere Reise durch Südamerika führt uns und unseren VW Crafter Camper durch die Anden in Peru. Wir wollen die Rainbow Mountains (Vinicunca) in Peru erkunden. Von Cusco aus fahren zahlreiche Tourbusse hoch zu dem Regenbogenberg in Peru. Wir haben uns allerdings einen ganz anderen Weg für unser Wohnmobil hoch zu den Bergen ausgesucht. Es ist ein kleiner Rundweg durch die Anden in Peru. Und der Weg kann kaum schöner sein. Der Weg führt vorbei an kleinen Dörfern in einer malerischen Landschaft auf einer Schotterpiste immer weiter hinauf. Unser Wohnmobil kämpft sich immer weiter hoch und hat richtig Schwierigkeiten mit der Höhe klarzukommen. Der erste Gang geht zwar recht gut, allerdings ist das Anfahren in dieser Höhe recht problematisch. Peru zeigt sich wieder von seiner schönsten und wildesten Seite. Gelbe Grasbüschel, die von Alpakaherden genüsslich bei blauem Himmel verschlungen werden. Eine faszinierende Landschaft die uns Peru hier mal wieder in Südamerika zeigt. Wir sind hin und weg. Allerdings wird die Offroad Piste immer schlechter. Große Löcher in dem Boden sowie viele Passagen mit großen Steinen. Ausgetrocknete Flussbette sind hier unser Endgegner. Ständig müssen wir diese passieren und kommen nur sehr langsam voran. Die Anhängerkupplung setzt permanent auf. Für unseren Camper ist die Strecke nicht gemacht. Für ein 4x4 Fahrzeug eher. Wir kämpfen uns durch und kommen am Abend an den Rainbow Mountains in Peru an und beschließen hoch zu fahren. Eine schmale Straße führt den Weg hinauf. Eine sehr beängstigende Situation, da einem jederzeit jemand entgegenkommen kann auf der einen Spur nach oben. Wir schaffen es gut hoch und übernachten auf knapp 4600 m an einem Parkplatz. Am nächsten Morgen starten wir unsere Tour bei Sonnenaufgang und erklimmen den Regenbogenberg. 200 Höhenmeter, die es ganz schön in sich haben. PE 2023
  ageRating: 12
- eventId: 1250864
