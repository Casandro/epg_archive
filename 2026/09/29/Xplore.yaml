  title: Höhenflüge - Im Ballon über die Alpen
  subtitle: Höhenflüge - Im Ballon über die Alpen
  description: Die winterlichen Alpen besitzen für Ballon-Abenteurer schon immer eine besondere Anziehungskraft. Sich hoch über die verschneiten Berge zu erheben und das majestätische Alpenpanorama in seiner vollen Pracht zu genießen, das ist nur im Ballon möglich. Doch eine Heißluftballonfahrt in den Alpen ist kein ungefährliches Abenteuer. Schroffe Gipfel, Bergseen, Wälder, Stromleitungen und Dörfer zerteilen die Landschaft in ein kleinteiliges Puzzle. Landeplätze sind rar und Notlandungen vorprogrammiert. Bei internationalen Heißluftballon-Festivals zaubern oft dutzende bunter Ballons ein gigantisches Spektakel in den Himmel und in der Nacht präsentieren beleuchtete Ballons ein phantastisches Lichtspektakel. DE 2012
