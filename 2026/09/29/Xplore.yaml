  title: Sprintour - Deutscher Einfluss in Paraguay
  subtitle: Sprintour - Deutscher Einfluss in Paraguay
  description: 'Nach einem Unfall in Brasilien haben wir in Paraguay den Unfallschaden am Wohnmobil reparieren lassen. In Hohenau wurde der Schaden zu unserer Zufriedenheit behoben und wir können endlich Paraguay mit unserem Camper erkunden. In Hohenau haben wir bemerkt, dass dort viele Deutsche wohnen. In der letzten Zeit sind auch viele deutsche Auswanderer in Hohenau angekommen. Vor allem Familien. Das wirft viele Fragen auf: Warum finden Deutsche Paraguay als Auswanderungsland so interessant? Nach vielen Gesprächen mit Einheimischen haben wir einige Theorien dazu. Nach der Stadt Hohenau geht es für uns in die Hauptstadt von Paraguay, nach Asuncion. Da merken wir bereits den Unterschied von der großen Hauptstadt zu dem eher dörflichen Erscheinungsbild von Hohenau. Asuncion ist auf den ersten Blick stressig und voll. Als wir jedoch mitten in der Stadt angekommen sind, wundern wir uns was für eine Ruhe und Zufriedenheit diese Stadt ausstrahlt. Sie ist nicht so voll und stressig. Asuncion hat vielleicht nicht so viele Highlights wie andere Hauptstädte in Südamerika, allerdings ist Asuncion sehr angenehm. Zudem gibt es zahlreiche deutsche Schulen, Krankenhäuser und deutsche Geschäfte sowie Bäckereien. Für deutsche Auswanderer vielleicht sehr wichtig, da sie so ihre Gebräuche und Traditionen im fremden Land Paraguay nicht ganz aufgeben müssen. So finden auch wir eine deutsche Bäckerei in Paraguay! Nach so vielen Monaten mit dem Camper durch Südamerika haben wir das Weissbrot einfach nur satt. Deshalb freuen wir uns sehr über Sauerteigbrot und Brezeln. Nach einem sehr entspannten Tag in Asuncion geht es für uns zurück zu dem Wohnmobil Übernachtungsplatz mitten in der Stadt. Wir freuen uns auf die Weiterreise mit unserem Camper durch Paraguay und die Erkundung des Hinterlandes. PY 2023'
