  title: Progetto Scienza 2024 Racconti di Scienz
  subtitle: Progetto Scienza 2024 Racconti di Scienza - Profili 5 Maria Montessori - Che cosa significa insegnare? E chi è un bravo studente? La scuola è stata per molto tempo un luogo di trasmissione del sapere, di r
  description: 'egole, giudizi e punizioni. La scuola, come ogni altra istituzione, è lo specchio dei tempi e della cultura. Nel clima generale e condiviso a volte spiccano delle eccezioni, figure che fanno la differenza, che segnano una svolta nel progresso della conoscenza. Per i bambini e gli scolari di tutto il mondo questa figura è Maria Montessori: una donna audace e preparata, tra le prime in Italia a laurearsi in Medicina, bambina amata e innamorata dei bambini. Sua è la convinzione scientifica, cioè frutto di osservazioni ripetute e ripetibili, che insegnare significa soprattutto ascoltare, capire, stimolare la passione, educare alla libertà. Chiara Buratti racconta gli anni della sua formazione come scienziata a Roma, lo studio dei bambini frenastenici negli ospedali psichiatrici, i primi esperimenti nel quartiere di San Lorenzo, la prima scuola fondata sul `Metodo''; ma anche la sua storia di donna e di madre. Racconti di Scienza - Profili è il programma di Progetto Scienza di Rai Cultura che ci avvicina ai grandi fondatori e innovatori della scienza. Ogni puntata tratteggia il profilo di una figura emblematica del suo tempo, che ha dedicato la propria vita alla ricerca, alla scoperta di nuovi codici e teorie per decifrare il nostro mondo.'
