  description: Zoologia, Davide Coero Borga e il Professor Biagio D'Aniello, zoologo dell'Università Federico II di Napoli, ci conducono alla scoperta dei segnali chimici che regolano la comunicazione all'interno della stessa specie e tra specie diverse, fino alla creazione di un vero e proprio legame di dipendenza. Donato Grasso, zoologo dell'Università di Parma mostra la sezione di un formicaio e spiega come le formiche regolano la propria attività quotidiana grazie alle tracce di feromoni. Con Anna Scandurra, zoologa dell'Università Federico II di Napoli, assistiamo infine al cambiamento del comportamento nei cani a seconda delle sostanze chimiche, i cosiddetti ormoni della felicità, che vengono liberate nell'ambiente. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Giuseppe Cembalo, Federica De Maria, Mario Ferrari, Daniela Mazzoli, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga con la partecipazione di Anna Pancaldi
