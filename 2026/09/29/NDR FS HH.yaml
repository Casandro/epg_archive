  title: Markt
  subtitle: 'Moderation: Jo Hiller'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Thema:
    * Haferflocken im Test: Wie gut ist das Superfood?
    Haferflocken gelten als Superfood und gehören bei vielen Menschen deshalb auf den Frühstückstisch. Sie sind reich an Ballaststoffen, Proteinen, Vitaminen und Mineralstoffen. Noch dazu fördern sie die Verdauung, sättigen lange, stabilisieren den Blutzuckerspiegel und können helfen, den Cholesterinspiegel zu senken und sogar Diabetes zu heilen. Dennoch gibt es immer wieder Schlagzeilen von gefährlichen Pestizidrückständen wie Glyphosat in Haferflocken. "Markt" macht den Test, lässt verschiedene Bio- und konventionelle Produkte im Labor untersuchen.
