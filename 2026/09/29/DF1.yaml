  title: MareTV
  subtitle: Griechenlands grüne Finger - Die Halbinsel Chalkidiki
  description: 'Wie der Dreizack des Meeresgottes Poseidon erhebt sich die Halbinsel Chalkidiki aus dem Meer, südöstlich von Thessaloniki. Ihre drei Ausläufer, die Fingern ähneln, sind voller Überraschungen: Ob auf Kassandra, Sithonia oder Athos, die Vegetation ist üppig und duftet nach Kräutern, durchsetzt mit zahllosen traumhaften Stränden und abgelegenen Fischerdörfern. In der kleinen Küstenstadt Ierissos baut die Familie Ioannou nicht nur sogenannte Kaikis, die legendären griechischen Fischerboote, sondern repariert, restauriert und flickt auch alle Arten von Holzbooten und schleppt große reparaturbedürftige Schiffe vom Meer an Land. Wassilis Mentogiannis entdeckte eine Seepferdchen-Kolonie, die er vergrößern möchte. Er bastelt am Prototyp einer speziellen Boje, die mit einem Solarpanel, einer Unterwasserkamera und modernster Computertechnologie für "Gesichtserkennung" ausgestattet ist.'
  genre:
  - '161'
  widescreen: true
  hd: true
