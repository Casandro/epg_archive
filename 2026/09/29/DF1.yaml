  title: MareTV
  subtitle: Ganz Holland auf einer Insel. Texel
  description: '"Das Wattenmeer ist mein Süßwarenladen", sagt Maarten Boon. Bei Ebbe steuert der 57-Jährige eine bestimmte Stelle auf Texel an, wo er genug Leckereien zum Knabbern findet: Meeresschnecken. Er kocht sie auf seinem Holzofen-Anhänger. Maarten lebt am, mit und vom Meer: Ein alter, umgebauter Kutter dient als Gartenschuppen. Am Wochenende räuchert er Fisch und unter der Woche sammelt er Treibgut. Lenie''t Hart steht sichtlich bewegt auf Ameland und beobachtet Franka in der Ferne. Franka ist eine Robbe, die ihre neu gefundene Freiheit genießt. Lenie hat mehrere Monate damit verbracht, den verwaisten Robbenwelpen in ihrer Robbenaufzucht großzuziehen, bevor Franka bereit war, ins Meer zurückzukehren. In den Niederlanden gilt Lenie als so etwas wie eine "Mutter Teresa des Meeres".'
  genre:
