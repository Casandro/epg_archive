  title: Sternstunde Philosophie
  subtitle: Die Welt retten mit Chemie? Nobelpreisträger Omar Yaghi
  description: |-
    Seine Lebensgeschichte ist filmreif: Aus einem palästinensischen Flüchtlingsjungen wird ein Nobelpreisträger in Chemie. Seine Forschungsarbeiten haben das Zeug, die Welt zu verändern: Sie könnten CO2-Emmissionen senken und Trinkwasser aus der Luft gewinnen. Barbara Bleisch trifft das Ausnahmetalent.
    Schweiz 2026
