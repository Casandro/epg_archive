  title: In aller Freundschaft (1017)
  subtitle: Der Wald vor lauter Bäumen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Maxima Dobenko, Bundeswehr-Majorin, die mit Dr. Kai Hoffmann zusammen in Mali war, kommt in die Klinik, um sich heimlich von Kai untersuchen zu lassen. Eigentlich ist es Vorschrift, dass sie sich beim Truppenarzt vorstellt. Dies möchte sie aber auf keinen Fall, da sie befürchtet, bei einem negativen Befund in den Innendienst versetzt zu werden.
- eventId: 562385
  start: 2026-09-29T06:25:00Z
  stop: 2026-09-29T07:10:00Z
  title: In aller Freundschaft (1018)
  subtitle: Dicht am Leben
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Dr. Maria Weber und Dr. Kai Hoffmann können ihrem Patienten Steven Sonders gute Nachrichten überbringen: Endlich sind die Spenderorgane da. Steven leidet an einem Herzfehler und soll ein neues Herz und eine neue Lunge bekommen. Extra für diese spektakuläre OP ist Mikko Rantala aus dem Erfurter Johannes-Thal-Klinikum angereist. Doch schon bei der ersten Voruntersuchung wird deutlich, dass Steven keinen Lebensmut mehr hat und die Operation ablehnt.'
