  title: 'Konfrontation: Markus Feldenkirchen trifft Bärbel Bas'
  widescreen: true
  subtitled: true
  hd: true
  description: |-
    Als Bundesarbeitsministerin steht sie vor einer der größten sozialen und politischen Herausforderungen der Gegenwart. Der Reformstreit um die Rente droht im Herbst 2025, die Koalition zu zerreißen. Im Zentrum des Sturms: Bärbel Bas. Als Ministerin soll sie den Sozialstaat reformieren, als SPD-Co-Chefin die um ihren Markenkern ringende SPD vor dem Untergang retten.
    Für das ARD-Format "Konfrontation" hat der renommierte Journalist Markus Feldenkirchen Bärbel Bas über mehrere Monate begleitet - in ihrem Alltag als Arbeitsministerin, im politischen Berlin und in ihrer Heimat Duisburg, Bas' Rückzugs- und Zufluchtsort.
