  title: 'Report Mainz: Belästigt. Gemobbt. Missbraucht.'
  subtitle: Soldatinnen in Gefahr?
  widescreen: true
  subtitled: true
  hd: true
  description: Sie geloben, im Ernstfall ihr Vaterland tapfer zu verteidigen. Diesen Eid schwören auch Frauen bei der Bundeswehr. Seit 25 Jahren stehen ihnen hier alle Laufbahnen offen. Sie hoffen auf Herausforderungen, aber vor allem auf Kameradschaft. Die ist bei der Bundeswehr sogar gesetzlich verankert, als soldatische Pflicht. Doch statt Kameradschaft erleben Soldatinnen oft Diskriminierung und sexuelle Übergriffe. Das zeigen die Recherchen von "Report Mainz".
