  title: Otvoreno
  subtitle: Središnji politički talk show HTV-a u kojem se svake večeri od ponedjeljka do četvrtka uz relevantne goste suprotstavljenih stajališta analizira politička tema dana.
  description: 'Glavni je grad ostao bez javnoga prijevoza i odvoza otpada. Štrajk u Zagrebu se nastavlja dok se gradonačelnik - koji ne pristaje na ultimatume - ne odazove na razgovor te ispuni zahtjeve štrajkaša - sindikalna je poruka. Je li štrajk zakonit? Zašto je počeo prije okončanja arbitraže o nužnim minimalnim uslogama? Koliko bi mogao trajati? Postoji li politička pozadina? Tko će platiti vrijeme provedeno u obustavi rada? Što se postiglo objavom plaća radnika koje su veće od medijalnih i prosječnih u Hrvatskoj? Što pokazuje njihov rast proteklih godina? Kolika je uopće učinkovitost gradskih službi kada nisu u štrajku? Gosti su: - Dražen Jović, predsjednik Sindikata prometnih i komunalnih službi Hrvatske, - Damir Bakić, zastupnik u Gradskoj skupštini, predsjednik Odbora za financije (Možemo), - Ivan Matijević, predsjednik GO HDZ-a Zagreb, - Alen Čičak, potpredsjednik SDP-a Zagreb Urednik i voditelj: Branko Nađvinski'
