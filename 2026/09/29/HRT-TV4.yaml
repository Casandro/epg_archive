  - '160'
  description: 'Ljetu je kraj, no veza s morem ostaje, pa i kroz našu emisiju. Plovimo danas od sjevera do juga, od obale do otoka.  Teški dani za plivaričare. Srdele je sve manje, a mjere sve strože. Istarski ribari s 20 spali na samo pet dana lova mjesečno. Postoji mogućnost da se mjera proširi i na ostale ribolovne zone. Na otoku Lošinju vraćamo se u prošlost i uz domaćine otkrivamo brodski jelovnik iz nekih drugih vremena. Na našoj obali nalaze se jedne od najstarijih solana u Europi, ovoga puta svratit ćemo do Stona, a uz kolege iz Istre otkriti grue. Palme, eukaliptusi, oleandri, bugenvilije, ruže, plovimo do otoka Ilovika.   Urednice: Irena Hrvatin i Dajana Kruneš'
