  title: Malcolm Douglas - Das große Flussabenteuer
  description: Malcolm Douglas ist erneut in Papua - Neuguinea unterwegs. Auf dem Strickland-River in einer der abgelegensten Regionen der zweitgrößten Insel der Welt, erlebt er zusammen mit seinen Begleitern ein unvergessliches Abenteuer. Er besucht alte Freunde, Krokodilfarmen und erfreut sich an der Schönheit der einzigartigen Natur zwischen seinen Besuchen in den faszinierenden Dörfern entlang dieses wilden Flusses fern ab der Zivilisation.
  widescreen: true
- eventId: 1139454
