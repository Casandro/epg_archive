  title: Die wilden Flüsse Afrikas - Luangwa
  description: 'Flusspferde, Krokodile, Zebras, Gazellen, Leoparden - sie alle tummeln sich zur Regenzeit im bzw. an den Ufern des Luangwa. Denn der Fluss, der sich durch den Osten Sambias schlängelt, bevor er sich schließlich mit dem Sambesi vereint, verspricht fette Beute. Doch wenn die Trockenzeit beginnt und die Pegel sinken, verwandelt der Luangwa sein Gesicht: Der sonst so mächtige Strom wird zum Rinnsal. Nur wirklich hartgesottene Bewohner haben das Zeug, in dieser gnadenlosen Umgebung zu überleben...'
  widescreen: true
