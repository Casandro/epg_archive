- eventId: 1139571
  start: 2026-09-29T21:15:00Z
  stop: 2026-09-29T22:20:00Z
  title: Die wilden Flüsse Afrikas - Okavango
  description: 'Das Okavango-Delta in Botswana gehört zu den außergewöhnlichsten Ökosystemen Afrikas: Der mächtige Fluss mündet nicht ins Meer oder in einen See - er verdunstet einfach mitten in der Kalahari-Wüste. Seine Quellen liegen in mehr als anderthalbtausend Kilometern Entfernung in Angola. Wenn dort die Regenzeit beginnt, rollt auf das Binnendelta eine Flutwelle zu, die das knochentrockene Gebiet in eine Insel des Lebens und in eines der größten und tierreichsten Feuchtgebiete des Kontinents verwandelt.'
  widescreen: true
- eventId: 1139572
  start: 2026-09-29T22:20:00Z
  stop: 2026-09-29T23:25:00Z
  title: Die wilden Flüsse Afrikas - Sand
  description: 'Über eine Strecke von rund 300 Kilometern schlängelt sich der südafrikanische Fluss Sand durch den Osten des Landes. An seinen Ufern herrscht stets reges Treiben: Zebras, Antilopen, Elefanten, Löwen, Leoparden und viele andere Tiere hoffen darauf, hier einen reich gedeckten Tisch vorzufinden. Doch insbesondere die Mütter von Jungtieren müssen höchste Vorsicht walten lassen - sonst wird ihr Nachwuchs zur schnellen Beute für die hungrigen Krokodile, die unter der Wasseroberfläche lauern.'
  widescreen: true
- eventId: 1139573
  start: 2026-09-29T23:25:00Z
  stop: 2026-09-30T00:35:00Z
  title: Die wilden Flüsse Afrikas - Zambesi
  description: 'Mal ist er friedlich, mal wild, mal geheimnisvoll - der Sambesi. Von seiner Quelle in Sambia bis zum Mündungsdelta in Mosambik legt Afrikas viertlängster Fluss rund 2.600 Kilometer zurück. Unterwegs verändert er dabei immer wieder sein Gesicht: Er fließt vorbei an mächtigen Gebirgszügen, schlängelt sich durch dichtes Buschland und stürzt sich an den Victoriafällen dramatisch über 100 Meter in die Tiefe. Sein Ziel erreicht der gewaltige Strom, wenn sich sein Wasser in den Indischen Ozean ergießt.'
  widescreen: true
