  title: MDR KLASSIK - Kombo
  description: "Kombo mit Kamilla Kaiser \n\nMusik und Literatur. Hans Christian Andersens Märchen \"Die Nachtigall\" - kombiniert mit Musik von Maurice Ravel, Caroline Shaw und Franz Schubert.\n\nEine kleine Nachtigall rettet mit ihrem Gesang einen mächtigen Kaiser. 1845 hat Hans Christian Andersen sein Märchen \"Die Nachtigall\" geschrieben und verhandelt darin auch die Frage, ob künstlicher oder echter Gesang mehr berührt. Im Märchen konkurriert ein Aufziehvogel mit einer echten Nachtigall. Es geht um Freiheit, Vergänglichkeit und das Erkennen von wahrer Schönheit. Kamilla Kaiser hat sich für handgemachte und gegen AI-produzierte Titel entschieden, inspiriert von Andersens Märchen."
- eventId: 657306
