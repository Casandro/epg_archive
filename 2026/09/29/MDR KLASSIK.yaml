  stop: 2026-09-29T20:00:00Z
  title: MDR KLASSIK - Neue Musik
  description: "Neue Musik aktuell\n\nWas gibt es Neues in der Welt der Gegenwartsmusik? \nAktuelle Entwicklungen in der Szene der neuen Musik werden\nbeleuchtet und bewertet, Neuerscheinungen auf dem CD-Markt \nkritisch unter die Lupe genommen. Und immer liegt der Fokus \nauf Events in der zeitgenössischen Musik, die man auf keinen \nFall verpassen sollte.\n\nModeration: Andreas Göbel"
