  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Johann Matthias Sperger: Sinfonie Nr. 21 g-Moll (L'arte del mondo: Werner Ehrhardt); Johannes Brahms: Variationen über ein eigenes Thema, op. 21, Nr. 1 (Andreas Boyde, Klavier); Robert Schumann: "Hermann und Dorothea", Ouvertüre (WDR Sinfonieorchester Köln: Heinz Holliger); François-Joseph Gossec: Sinfonie B-Dur, op. 6, Nr. 6 (Capella Coloniensis: Hans-Martin Linde); Ferdinand Hérold: Klavierkonzert Nr. 1 E-Dur (Angéline Pondepeyre, Klavier; WDR Rundfunkorchester Köln: Conrad van Alphen); Dmitri Schostakowitsch: Sinfonie Nr. 2 H-Dur - "An den Oktober" (WDR Rundfunkchor und Sinfonieorchester Köln: Rudolf Barschai)

    2.03  Das ARD-Nachtkonzert (II)

    Wolfgang Amadeus Mozart: Sinfonie D-Dur, KV 320 (Radio-Sinfonieorchester Stuttgart des SWR: Roger Norrington); Matthew Locke: "The Tempest", Bühnenmusik (Il Giardino Armonico: Giovanni Antonini); Gabriel Fauré: Streichquartett e-Moll, op. 121 (Quatuor Ébène); Arvo Pärt: Sinfonie Nr. 3 gis-Moll (Nationales Sinfonieorchester Estland: Paavo Järvi); Hugo Alfvén: "Schwedische Rhapsodie", op. 47 (Philharmonisches Orchester Stockholm: Neeme Järvi)

    4.03  Das ARD-Nachtkonzert (III)

    Florence Price: Violinkonzert Nr. 2 (Randall Goosby, Violine; Philadelphia Orchestra: Yannick Nézet-Séguin); Antonio Rosetti: Fagottkonzert B-Dur (Deutsche Kammerakademie Neuss, Fagott und Leitung: Eckart Hübner); Jules Massenet: "Cendrillon" (Academy of St. Martin in the Fields: Neville Marriner)

    5.03  Das ARD-Nachtkonzert (IV)

    Louis Theodore Gouvy: Sinfonie Nr. 5 B-Dur, Allegro (Deutsche Radio Philharmonie Saarbrücken Kaiserslautern: Jacques Mercier); Pietro Locatelli: Concerto grosso D-Dur, op. 1, Nr. 9 (Freiburger Barockorchester: Gottfried von der Goltz); Joseph Haydn: Klaviertrio Es-Dur, Allegro moderato, Hob. XV/22 (Beaux Arts Trio); Antonio Casimir Cartellieri: Sinfonie Nr. 4, Adagio (Evergreen Symphony Orchestra: Gernot Schmalfuss); Johann Christian Schiefferdecker: Suite Nr. 1 (Akademie für Alte Musik Berlin); Muzio Clementi: Sonate A-Dur, op. 1, Nr. 5 (Carlo Alberto Bacchi, Klavier)
