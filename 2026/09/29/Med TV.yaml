  title: Mediterranean Kitchen Morocco
  subtitle: ' '
  description: Kurt and Tarik prepare a favourite Moroccan dish, Lham bel barkouk, slow-cooked beef with sweet, caramelised prunes and toasted almonds. As the kitchen fills with rich aromas, the two tell stories from their careers and the memories that inspired Tarik to become a chef. It’s a glimpse into the real heart of Moroccan cooking, good tradition, warm hospitality and sharing a great meal.
