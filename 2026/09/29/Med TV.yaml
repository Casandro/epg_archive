  title: Colours of Mediterranean Culture
  subtitle: ' '
  description: From Malta to Greece, Mediterranean arts flourish. Valletta Baroque Festival, Malta International Arts Festival, and Birgu by Candlelight light up the island with music and heritage. Italy’s Cortona on the Move, La Fenice in Piazza San Marco, and Mercantia Festival showcase photography, opera, and street performance. France’s Art Paris and International Garden Festival, Spain’s Revela’t Festival and La Leyenda de Tartessos, Portugal’s Umbrella Sky Project and Walk & Talk Biennale, Turkey’s Istanbul Theatre Festival and Biennial, and Greece’s Athens & Epidaurus Festival highlight the Med’s rich artistic tapestry.
