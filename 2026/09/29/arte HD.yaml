  audiodesc: true
  description: "88 Millionen Aufnahmen von Kindesmissbrauch zirkulierten im Jahr 2022 weltweit. Jede Sekunde werden mindestens zwei Bilder von Kindesvergewaltigungen im Internet geteilt. In sozialen Netzwerken und Videospielen haben es Sexualstraftäter besonders einfach, neue Opfer zu finden. \nVier Jahre lang recherchierte die Regisseurin unter anderem in Deutschland, Frankreich, Großbritannien, Nordamerika und den Philippinen, mit welchen Maßnahmen die internationale Gemeinschaft reagiert. Sie begleitete Polizisten und Mitarbeiter von Organisationen, die die Täter aufspüren und täglich für die Sicherheit der Kinder kämpfen."
