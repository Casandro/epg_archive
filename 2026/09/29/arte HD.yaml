  title: Kohlenstoff
  subtitle: Eine Geschichte von Leben und Tod
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Kohlenstoff ist ein Element voller Widersprüche. Der Dokumentarfilm lüftet die letzten Geheimnisse des vielseitigen chemischen Elements, aus dem einerseits das Leben entstanden ist, das andererseits aber auch die Fähigkeit besitzt, diesem Leben ein Ende zu setzen. "Kohlenstoff. Eine Geschichte von Leben und Tod" erzählt, wie Kohlenstoff bei der Explosion sterbender Sterne entstand. Statements namhafter Wissenschaftler, faszinierende Animationen und ein atemberaubender Soundtrack fügen sich zu einer außergewöhnlichen Geschichte des Universums, zu der wir Menschen nur einen vergleichsweise geringen Teil beigetragen haben.
