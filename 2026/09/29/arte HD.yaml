  title: 360° Reportage
  subtitle: Albanien, die Stimmen der Schäfer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Über viele Jahrhunderte wanderten albanische Hirten mit ihren Tieren über den ganzen Balkan auf der Suche nach Futter. Eine Tradition, die mit der sozialistischen Diktatur ein jähes Ende fand. Nach deren Niedergang besannen sich viele der einstigen Schäfer wieder auf ihre alten Bräuche - und versuchten auch, ihre Kinder für den Hirtenberuf zu begeistern. Doch diese haben sich längst der Moderne zugewandt, studieren in den Städten und sehen keine Perspektive in der althergebrachten Tradition. Haben die Schäfer dennoch eine Zukunft in dem Balkanland?
