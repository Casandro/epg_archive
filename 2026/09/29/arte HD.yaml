  title: Amerikas Aufbruch in die Freiheit
  subtitle: Der Unabhängigkeitskrieg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die amerikanische Unabhängigkeitserklärung veränderte die Welt. 250 Jahre danach sind ihre Forderungen noch immer nicht vollständig eingelöst. Dieser Film rekonstruiert den Kampf für die Unabhängigkeit aus der Perspektive einfacher Menschen, die direkt beteiligt waren. Er schildert Ereignisse, die zu der Erklärung führten, und zeigt die Schlachten auf dem Weg zum Ziel.
