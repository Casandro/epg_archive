  title: Die Sprache der Vögel
  subtitle: Frankreich 2022
  description: 'Ob Kreischen, Flöten, Trillern oder Singen: Viel verstehen wir Menschen nicht von den Geräuschen der Vögel. Dabei wäre es doch vielleicht möglich, sich mit ihnen auszutauschen. Die Dokumentation gibt genau diesem Wunsch nach einer Kommunikation zwischen Mensch und Tier eine neue Perspektive.'
- eventId: 708514
  start: 2026-09-29T01:15:00Z
  stop: 2026-09-29T01:40:00Z
  title: Die Mythen der Wikinger (2/10)
  subtitle: Geschenke für die Götter
  description: Göttervater Odin hat erfahren, dass das Ende der Welt unausweichlich ist. Die Götterdämmerung "Ragnarök" beginnt, sobald einer der Götter Asgards stirbt. Odin ist entschlossen, dies um jeden Preis zu verhindern. Unterdessen unternimmt Loki einen Ausflug in die Welt der Zwerge und verwettet dort seinen eigenen Kopf. Ob es dem Gott der List auch diesmal gelingt, seinen Kopf aus der Schlinge zu ziehen?
