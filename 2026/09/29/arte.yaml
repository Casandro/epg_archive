  title: Die Freiheitsstatue
  subtitle: Wie eine Idee die Welt bewegte
  description: Die Freiheitsstatue ist eines der bekanntesten Wahrzeichen der USA. Entworfen wurde sie jedoch vom französischen Künstler Frédéric-Auguste Bartholdi. Frankreich machte sie den Amerikanern im Zeichen der republikanischen Ideale des 19. Jahrhunderts und des Kampfes gegen die Unterdrückung zum Geschenk.
- eventId: 708588
  start: 2026-09-29T08:25:00Z
  stop: 2026-09-29T09:25:00Z
  title: Beachtliche Stätten und ihre wilden Nachbarn
  subtitle: In Berg und Tal
  subtitled: true
  description: In Europas Berge kehrt die Wildnis zurück! In den rumänischen Karpaten sind wieder Bären und Wisente zu sehen, am Mont Blanc wachsen Algen und im besiedelten Elsass zeugen Störche und Feldhamster davon, wie schwierig sich das Zusammenleben von Mensch und Tier gestalten kann. Die Dokumentation begibt sich auf die Spuren wilder Tiere - von der Sächsischen Schweiz bis in die Pyrenäen.
