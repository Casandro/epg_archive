  title: Universum
  subtitle: Surfing Hippos - Der Strand der Dschungeltiere
  description: |-
    An Gabuns entlegener Küste trifft der endlose Regenwald auf den wilden Atlantik. Hier wandern Elefanten bis ans Meer, Schweine durchpflügen den Strand und Flusspferde surfen in der Brandung. Ein Ort, an dem Dschungeltiere Nahrung, Schutz und Heilung finden und an dem die Nacht seit Jahrtausenden neues Leben hervorbringt. Doch Plastik, getragen von fernen Strömungen, bedroht dieses uralte Gleichgewicht. Surfing Hippos nimmt uns mit in ein magisches Grenzland, in dem Wald und Meer verschmelzen - und erinnert daran, wie zerbrechlich selbst die wildesten Paradiese sind.
    Ein Film von Yann Sochaczewski & Marlen Hundertmark
    Bearbeitung: Judith Doppler
