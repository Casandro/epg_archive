  subtitle: 'Larissa Marolt zu: "Ich bin keine Zicke, ich stehe einfach für mich ein!"'
  description: "Durch die TV-Shows Topmodel oder Dschungelcamp wurde die Kärntnerin Larissa Marolt bereits im Teenageralter einem breiten Publikum bekannt. \nBei Patrick Budgen verrät die Schauspielerin, wie sie damals mit dem Ruhm und ihrem Image als Zicke umgegangen ist, wie sehr sie der elterliche Hotelbetrieb geprägt hat, und wie sie es geschafft hat, für ihr neues Projekt drei Publikumslieblinge nach Kärnten zu holen."
