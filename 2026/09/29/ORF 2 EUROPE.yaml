  title: Report
  description: "- Rote Zerreißproben: Die SPÖ stolpert in Chaostage: Medienmanager Gerhard Zeiler fordert Andreas Babler heraus und will den Parteivorsitz übernehmen, doch Babler will nicht weichen. \n- Dürre Felder, schwache Ernte - teures Essen? 1 Milliarde Euro - so hoch sind die geschätzten Schäden des Hitzesommers auf Österreichs Feldern. Vor allem bei Erdäpfeln, Mais und Zuckerrüben drohen Ertragsverluste von bis zu 70 Prozent. \n- Einsturzgefahr? Vor 50 Jahren stürzt die Reichsbrücke an einem Morgen im August plötzlich zusammen - die Bilder haben sich ins Gedächtnis eingeprägt. Seit damals hat sich Österreich zu einem Vorreiter entwickelt, was die Instandhaltung von Brücken betrifft."
  genre:
  - '34'
