  title: Das große Gotthilf-Fischer-Wunschkonzert
  subtitle: 'Heute möchten wir Ihnen eine besondere Legende der deutschen Musikszene vorstellen: Gotthilf Fischer. Gotthilf Fischer, geboren am 11. Februar 1928 in Plochingen, war ein deutscher Chorleiter und Dirigen...'
  description: "Heute möchten wir Ihnen eine besondere Legende der deutschen Musikszene vorstellen: Gotthilf Fischer. Gotthilf Fischer, geboren am 11. Februar 1928 in Plochingen, war ein deutscher Chorleiter und Dirigent, der mit seinem \x86Fischer-Chor\x86, weltweit bekannt wurde. Seine Musik war geprgt von einer einzigartigen Mischung aus traditionellen Volksliedern und modernen Pop-Hits, die er mit seinem unverkennbaren Stil und seiner charismatischen Persnlichkeit interpretierte."
