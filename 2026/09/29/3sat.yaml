  title: Der Zauber Andalusiens
  subtitle: Von Tarifa nach Sevilla
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das goldene Licht der "Costa de la Luz" bezaubert Tamina Kallert auf ihrer Reise durch den Südwesten Andalusiens ebenso wie die kilometerlangen Strände.

    Sie startet in Tarifa, dem südlichsten Punkt Europas und internationalen Treffpunkt der Surfer, und folgt der Route der weißen Dörfer, die alle auf eine maurische Vergangenheit zurückblicken.
    Moderation: Tamina Kallert

    HD-Produktion
