  title: Die Pyrenäen (3/4)
  subtitle: Feuerläufer und Knochenfresser
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Diese Folge führt nach Aragon und Navarra. Im Nationalpark "Ordesa y Monte Perdido" lebt der Bartgeier, eine der größten und schönsten Greifvogelarten Europas.

    Sein spanischer Name "Quebrantahueso" - Knochenbrecher -, verweist darauf, dass er sich von Tierknochen ernährt. Im Tal der Feuerläufer bei Isil besteht der Horizont nur aus Himmel und Bergen.
    HD-Produktion
