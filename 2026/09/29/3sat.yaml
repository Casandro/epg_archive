  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    75 Jahre Bundesverfassungsgericht - Seit 75 Jahren entscheidet das Bundesverfassungsgericht in Karlsruhe über die ganz großen Fragen. Seine Urteile spiegeln die gesellschaftlichen Debatten wider, die in der Bundesrepublik geführt werden. "Kulturzeit" spricht mit dem Philosophen Julian Nida-Rümelin über Geschichte und Zukunft des BVerfG.

    Lebendige Zivilgesellschaft - Was fällt weg, wenn der Bund bei "Demokratie leben!" kürzt?

    Immendorff-Ausstellung in Düsseldorf - Mit der ersten umfassenden Retrospektive in Jörg Immendorffs Wahlheimatstadt rückt ihn der Kunstpalast zurück ins Blickfeld. Rund 120 Werke aus fünf Jahrzehnten zeichnen seinen Weg, von den Anfängen an der Düsseldorfer Kunstakademie, bis zu den letzten im dortigen Atelier entstandenen Arbeiten nach.

    "Fremde Sonne" in Hamburg - Der Antikenzyklus "Anthropolis" am Deutschen Schauspielhaus Hamburg in der Neuschreibung von Roland Schimmelpfennig gehörte zu den Theaterereignissen des Jahres 2023/2024. Ab September 2026 macht sich Intendantin Karin Beier an eine Fortschreibung unter dem Titel "Fremde Sonne", mit dem Schwerpunkt auf der Medea-Jason-Geschichte und der Fahrt der Argonauten.

    Gucci für alle - La Watch Party - Mode als Gemeingut: Der französisch-algerische Content Creator und Modekritiker Lyas bringt deshalb das Prinzip des Public Viewing in die Mode. Runway-Shows werden live an öffentlichen Orten gezeigt.

    Moderation: Cécile Schortmann
    HD-Produktion
