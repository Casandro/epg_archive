  title: Die Pyrenäen (1/4)
  subtitle: Bären und Influencer
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Pyrenäen zwischen Frankreich und Spanien sind mehr als nur ein Gebirge. Die Berge haben das Salz der Meere in sich und den Honig der Akazien, den Geruch des Schnees und den der Lilien.

    Eine Landschaft voller Geheimnisse, in der man sich verliert, ohne verloren zu gehen. Atlantik oder Mittelmeer, hinter jedem Gipfel liegt das Meer - und ein neuer Horizont. Die vierteilige Filmreihe zeigt die beeindruckende Welt der Pyrenäen.
    HD-Produktion
- eventId:
  - 709928
  - 710880
  start: 2026-09-29T13:30:00Z
  stop: 2026-09-29T14:15:00Z
  title: Die Pyrenäen (2/4)
  subtitle: Unter Sternen und Schafen
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Diese Folge führt in die französischen Hochpyrenäen zum Observatorium auf dem Pic du Midi. Von dort aus ist die Weite des Universums ebenso sichtbar wie die höchsten Gipfel der Pyrenäen.

    Weiter unten wacht Patou über die Schafherden - ein riesiger weißer Hund mit sanftem Blick, der es mit Wölfen und Bären aufnimmt. Auf dem Monte Perdido besucht der Geologe Nacho López mit seiner Expedition einen der letzten Gletscher des Gebirges.
    HD-Produktion
- eventId:
  - 709929
  - 710881
  start: 2026-09-29T14:15:00Z
  stop: 2026-09-29T15:00:00Z
  title: Die Pyrenäen (3/4)
  subtitle: Feuerläufer und Knochenfresser
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Diese Folge führt nach Aragon und Navarra. Im Nationalpark "Ordesa y Monte Perdido" lebt der Bartgeier, eine der größten und schönsten Greifvogelarten Europas.

    Sein spanischer Name "Quebrantahueso" - Knochenbrecher -, verweist darauf, dass er sich von Tierknochen ernährt. Im Tal der Feuerläufer bei Isil besteht der Horizont nur aus Himmel und Bergen.
    HD-Produktion
- eventId:
  - 709930
  - 710887
  start: 2026-09-29T15:00:00Z
  stop: 2026-09-29T15:45:00Z
  title: Die Pyrenäen (4/4)
  subtitle: Gipfelstürmer und Sterneköche
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Diese Folge führt ins Baskenland. Ganz im Westen enden die Pyrenäen am Atlantischen Ozean. In der Bucht von Saint-Jean-de-Luz verankert ein Winzer seine Weinfässer am Meeresgrund.

    Er überlässt sie dem Wechsel der Gezeiten. Etwas abseits vom Jakobsweg führt Teresa Etxarri eine rollende Tierarztpraxis. Sie ist die einzige Tierärztin in der Region bei Mezkiritz. Bei Riglos befindet sich ein heiliger Tempel für den Klettersport.
    HD-Produktion
- eventId:
  - 709931
  - 710888
  start: 2026-09-29T15:45:00Z
  stop: 2026-09-29T16:30:00Z
  title: Korsika - Wilde Insel im Mittelmeer
  subtitle: Film von Katja Devaux
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Korsika - weite Strände, wilde Bergmassive, klare Flüsse und alte Städte: Da ist für jeden etwas dabei. In der Ferienzeit bevölkert sich die Mittelmeerinsel mit Zehntausenden Touristen.

    In der Vorsaison dagegen ist Korsika entspannt. Wenige Autos fahren auf den endlosen Kurvenstraßen, es gibt viel Platz an den Stränden und kaum Wanderer in den Bergen. Die beste Zeit, um die Insel in Ruhe zu erleben.
    HD-Produktion
