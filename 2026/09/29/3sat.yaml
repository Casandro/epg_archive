  title: Natur im Garten (3/10)
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    "Natur im Garten" führt diesmal nach Dornbach im Wienerwald. Karl Ploberger präsentiert geeignete Ersatzpflanzen für den Buchs, während Uschi Zezelitsch sich der Immortelle widmet.

    Der rund 2000 Quadratmeter große Garten von Michaela und Andreas Hofer verbindet farbenreiche Blumenbeete mit einem naturnahen Bereich voller Lebensräume für Tiere. Geschwungene Wege, ein Wildrosenhügel und ein Rosentunnel geben ihm eine märchenhafte Atmosphäre.
    Moderation: Karl Ploberger

    HD-Produktion
