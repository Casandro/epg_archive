  - 710875
  start: 2026-09-29T09:50:00Z
  stop: 2026-09-29T10:20:00Z
  title: Am Pass - Geschichten aus der Spitzenküche
  subtitle: Stefan Fäth, Hamburg
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    "Am Pass" erzählt vom Alltag und dem Leben junger Sterneköche in Norddeutschland. Am Pass, der Schnittstelle zwischen Küche und Service, richten sie ihre außergewöhnlichen Kreationen an.

    Alle teilen die Leidenschaft fürs Kochen, 16-Stunden-Arbeitstage und enorme Verantwortung. Der Film bietet ungewöhnliche und sehr persönliche Einblicke in die Welt der Sterneküche.
    HD-Produktion
