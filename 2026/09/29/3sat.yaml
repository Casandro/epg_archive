  title: Kreta mit allen Sinnen
  subtitle: Film von Lourdes Picareta
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die malerische Landschaft der Insel Kreta ist Inspirationsquelle vieler ihrer Bewohner. Dort kreuzen sich Kulturen, und die Sinne werden geschärft - durch Natur, Kunst und die Menschen.

    Eine Forscherin der griechischen Ernährungskultur kocht unter Olivenbäumen auf offenem Feuer Rezepte, die bis zu zwei Millionen Jahre vor Christus zurückreichen. In den Bergen lassen sich Kräuter für den Malotira-Tee entdecken, die erst ab 1800 Meter Höhe wachsen.
    HD-Produktion
- eventId:
  - 709853
  - 710874
  start: 2026-09-29T09:10:00Z
  stop: 2026-09-29T09:50:00Z
  title: Kappadokien - Im Herzen der Türkei
  subtitle: Film von Till Lehmann
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Märchenhafte Landschaften, uralte Höhlenkirchen und Ballons am Morgenhimmel: Kappadokien zählt zu den faszinierendsten Regionen der Türkei - und steht vor großen Veränderungen.

    Die Dokumentation begleitet einen Ballonpiloten, eine Familie in einer Felsenpyramide und einen Töpfermeister. Außerdem beginnt die Kürbisernte, während zwischen Hotels und Tourismus traditionelle Lebensweisen um ihren Platz kämpfen.
    HD-Produktion
- eventId:
