  title: Wir im Saarland - Grenzenlos
  description: "* Wanderndes Literaturfestival\n\"Les Passerelles\" nutzt die Wasserwege der Großregion, um Künstler und Publikum zusammenzubringen. \n* Moselfahrt der 5519\nDie Luxemburger Dampflokomotive 5519 ist ein Stück grenzenlose Geschichte. Ab 1949 zog sie für das Großherzogtum Kohle- und Erzzüge.\n* Neues Schulfach\nDas Gymnasium Louise Weiss in Sainte-Marie-aux-Mines hat Drohnenkunde als Schulfach eingeführt.\n * Ferien beim Nachbarn\nAm Haupteingang des Thermalparks von Vittel liegt ein Gebäude aus der Belle Epoque - oder besser zwei. Der aus Vittel stammende Architekt Philippe Winsback hat sie zu einem Gästehaus umgebaut."
- eventId: 1329905
  start: 2026-09-29T05:10:00Z
  stop: 2026-09-29T07:10:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
