  title: Krieg der Träume
  subtitle: Krieg
  description: Im März 1938 marschieren deutsche Truppen in Österreich ein. Am 9. November zerstören die Nazis in der Pogromnacht jüdische Geschäfte, stecken Synagogen in Brand und ermorden hunderte Menschen. Im März 1939 besetzen deutsche Truppen die Tschechoslowakei. Der britische Premierminister Neville Chamberlain verkündet das Ende der Appeasement-Politik. Während sich Polen die Unterstützung Englands und Frankreichs sichert, schließt Deutschland einen Nichtangriffspakt mit der Sowjetunion. Der deutsche Überfall auf Polen erfolgt am 1. September 1939. Der Zweite Weltkrieg beginnt.
