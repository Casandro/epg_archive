  description: 'Heute: Kegelrobbenheuler Piggelti kommt zurück in die Nordsee. Schwierige Untersuchung - Pumakater Mingo lässt die Zunge hängen und Beutelträger: ein Kängurubock mit Nachwuchs? ... und noch viele weitere Zoogeschichten von der Nordsee.'
- eventId: 559340
  start: 2026-09-29T11:50:00Z
  stop: 2026-09-29T12:20:00Z
  title: Nashorn, Zebra & Co.
  subtitle: Zoogeschichten aus München
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im Dschungelzelt gab es eine verletzte Schildkröte, deshalb machen Tierpfleger Matthias Mösch und Nele Loos einen Krankenbesuch. Süßwasserstachelrochen leben in den tropischen Gewässern Südamerikas. Ihr giftiger Stachel ist äußerst schmerzhaft und kann sogar tödlich sein: Ob man mit solchen Tieren Freundschaft schließen kann?

    Ein fünfstimmiger Chor, singende Elefanten bei der Tonprobe und viele andere Geschichten aus dem Münchner Tierpark Hellabrunn sehen die Zuschauerinnen und Zuschauer in dieser Folge von "Nashorn, Zebra & Co.".
- eventId: 559432
  start: 2026-09-29T12:20:00Z
  stop: 2026-09-29T13:10:00Z
  title: Rentnercops (26)
  subtitle: Es ist alles in Ordnung
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Edwin wird immer noch zu Hause bei den Hoffmanns fürsorglich von Heidrun gepflegt - doch kaum gibt es einen neuen Fall ist Edwin auch wieder im Dienst: Im Hof einer Drogenberatungsstelle wird der Ex-Junkie Julius, der dort ehrenamtlich half, tot aufgefunden - mit Drogen in der Jackentasche. \nOffenbar war Julius wieder rückfällig geworden und hatte mit Drogen gedealt. Sein Bruder Bastian aber bestreitet den Rückfall: Julius habe in den letzten Monaten bei ihm gewohnt und einen Entzug gemacht. Er sei clean. Dr. Schmidt und die Laborergebnisse bestätigen das. Aber warum hatte er dann Drogen in der Tasche und wer hat ihn umgebracht?"
- eventId: 559433
  start: 2026-09-29T13:10:00Z
  stop: 2026-09-29T14:00:00Z
  title: Rentnercops (27)
  subtitle: Auf die Plätze
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Während der alljährlichen Bundesjugendspiele bricht Ralf Wernheim vor den Augen seiner Tochter Lily tot zusammen. Wernheim wurde genau zu dem Zeitpunkt erschossen, als er den Startschuss zum 100-Meter-Lauf gab. Obwohl zahlreiche Schüler, Eltern und Lehrer anwesend waren, können Edwin, Günter und Hui keine brauchbaren Zeugenaussagen bekommen. Mit seiner geschiedenen Frau verstand er sich gut, eine neue Beziehung gab es nicht in seinem Leben. Doch die Mails auf seinem Computer weisen scheinbar darauf hin, dass er mit der besten Freundin seiner 17-jährigen Tochter ein Verhältnis hatte. Ein kniffliger Fall für die Rentnercops.
