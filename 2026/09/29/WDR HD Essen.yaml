  stop: 2026-09-29T16:00:00Z
  title: Hier und heute
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das pralle Leben aus allen Teilen Nordrhein-Westfalens, von A wie Arbeit bis Z wie Zukunft. Hier und heute mit Rezepten, Geschichten und Bildern ganz aus ihrer Nähe. Wie leben die Menschen im Westen? Was bewegt sie? Und wie sieht ihr Alltag aus? Von montags bis freitags erzählen wir Ihnen, was los ist in unserem Land, was die Menschen in NRW bewegt -  was Sie bewegt.

    Präsentiert wird "Hier und heute" in wöchentlichem Wechsel von Miriam Lange, Sven Kroll und Anne Willmes.
