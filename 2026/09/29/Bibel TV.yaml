  title: Hautnah - Gott mitten im Leben
  subtitle: Warum ich der Bibel glaube
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Zu Gast bei Wilfried Schulte ist der Verleger, Evangelist und Autor Hartmut Jaeger. Schon früh stieg Jaeger ins Verlagswesen ein und erarbeitete Unterrichtsmaterialien, die Kindern die Bibel näherbringen sollten. Mit seinem Verlag möchte er Menschen im Glauben stärken und die Bibel weiterverbreiten. Gemeinsam mit Schulte spricht Jaeger auch über seine Erfahrungen als Evangelist.'
