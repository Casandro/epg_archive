  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als Martin Fischer 1999 aus der Kirche austrat, hätte er niemals vermutet, seine Berufung viele Jahre später in einer katholischen Diözese zu finden. Heute leitet er darüber hinaus das katholisch-charismatische Gemeindeprojekt "homebase", das moderne Aspekte mit einer traditionellen Liturgie vereint. "Das Zentrale ist die Gottesbegegnung", vertritt er gegenüber Moderator Wolfgang Severin.'
