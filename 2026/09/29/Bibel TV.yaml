  title: grenzenlos
  subtitle: 150 Jahre Dialog der Kulturen(1/2)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Im Jahr 2025 feiern die Steyler Missionare - die Gesellschaft des göttlichen Wortes, so der offizielle Name - ihr 150-jähriges Bestehen. Aus den bescheidenen Anfängen in Steyl an der Maas entstand einer der größten Orden der katholischen Kirche und ein weltweites Missionswerk. Von Beginn an waren die Missionare, die in die Ferne aufbrachen, mit der Frage konfrontiert, wie die Begegnung von unterschiedlichen Kulturen glücken kann. Über die Jahrzehnte entstanden Konzepte für interkulturelle Gemeinschaften und Erfahrungen, die heute für unsere Gesellschaften von Bedeutung sein können. (Teil 1 von 2)'
  genre:
  - '115'
  widescreen: true
  hd: true
- eventId: 1113767
  start: 2026-09-29T03:15:00Z
  stop: 2026-09-29T03:45:00Z
  title: So lebt sich's gut
  subtitle: Bedeutungsvoll oder berühmt - Was möchtest du sein?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nur wenige sind bekannt oder berühmt, aber jeder Mensch kann seine Umgebung reicher oder ärmer machen. Bei Schloss Neuschwanstein denkt man zuerst an Ludwig den Zweiten, doch tatsächlich gebaut hat er es nicht. Ebenso wenig wie Salomo den Tempel in Jerusalem. Ideengeber wären nichts ohne Baumeister und Künstler, die ihre Pläne umsetzen. Doris Schulte lädt ein zu entdecken, dass das eigene Leben bedeutungsvoll ist. Auch dann, wenn man die Kerze ist, die das Licht eines anderen zum Leuchten bringt.'
  genre:
  - '115'
  widescreen: true
  hd: true
