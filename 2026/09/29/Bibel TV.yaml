  title: Alpha & Omega
  subtitle: 'Hülya Marquardt: Ein Leben ohne Beine'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Hülya Marquardt hat von Geburt an Fehlbildungen an Armen und Beinen. Grund ist der seltene Gendefekt Dysmelie. Bis zum sechsten Lebensjahr musste sie etwa zwanzigmal operiert werden, mit 18 Jahren wurden ihr beide Beine amputiert. Doch aufgeben kam für die inzwischen 43-Jährige nicht in Frage. Heute ist Hülya Marquardt Unternehmerin, Influencerin und Buchautorin. Zudem ist sie glücklich verheiratet und Mutter eines sechsjährigen Sohnes. Welchen Herausforderungen muss sie sich im Leben ohne Beine stellen? Was gibt ihr Kraft? Und wie kann die Gesellschaft inklusiver werden? Das erzählt sie Moderatorin Charlotte Mühlhan.'
