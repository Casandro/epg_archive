  description: Jeden Montag dreht sich bei HoamSpui live alles um den Sport aus der Region. Patrik Ehelechner und Benedikt Schnitzenbaumer begrüßen einen interessanten Studiogast, der seine Sportart vorstellt und spannende Einblicke in Training, Wettkampf und Vereinsleben gibt.
