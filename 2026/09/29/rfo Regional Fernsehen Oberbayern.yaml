  subtitle: Spieltag 11 - FC Memmingen gegen TSV Buchbach +++ Spieltag 11 - SV Wacker Burghausen gegen TSV 1860 München +++ Interview mit Fußballprofi Florian Niederlechner
  description: 'Im Topspiel unterlag der FC Memmingen dem Spitzenreiter TSV Buchbach daheim 0:1, nachdem Philipp Walter in der 51. Minute traf, Rießler verletzt raus musste und der FCM zum fünften Heimspiel in Folge ohne Tor blieb. +++ Beim ersten Duell seit 2017 sahen 8.800 Fans in Burghausen einen Regionalliga-Rekord: Wacker führte durch das 1:0 (17.), 1860 glich durch Erdogan (39.) aus, doch Schöller hielt stark und Wacker traf spät zum Sieg, 1860 verliert erstmals und fällt auf sieben. +++ Im Interview mit Patrick Ehelechner und Bene Schnitzenbaumer ist Fußballprofi Florian Niederlechner zu Gast, früher für Augsburg, Freiburg und Hertha in Bundesliga und 2. Liga aktiv, heute bei 1860 München, und spricht über Karriere, Fußball und das Duell Wacker Burghausen gegen die Löwen.'
- eventId: 1057293
  start: 2026-09-29T06:00:00Z
  stop: 2026-09-29T06:10:00Z
  title: Süd Journal vom 28.09.2026 (Wh.)
  subtitle: Verkehrschaos auf der A93 - LKW-Unfall während Blockabfertigung +++ Schmankerlstraße Rosenheim +++ Nachrichten kompakt
  description: 'Wegen österreichischer Blockabfertigung staute sich der Verkehr auf der A93, als ein 26-Jähriger kurz nach 7 Uhr bei Raubling-Reischenhart mit seinem Milch-Lkw nahezu ungebremst ins Stauende krachte, zwei Sattelzüge zusammenschob und eine stundenlange Vollsperrung auslöste. +++ Auf dem Rosenheimer Ludwigsplatz präsentierte die Schmankerlstraße regionale Erzeugnisse an über 30 Ständen, bot Gespräche mit Produzenten und Mitmachangebote für Kinder und warb für kurze Wege, mehr Wertschöpfung vor Ort und den Kauf heimischer Lebensmittel. +++ In den Nachrichten vom 28. September: WEGA feierte in Rosenheim 75 Jahre mit Modenschauen, Herrmann kündigt bayernweite Lichtkontrollen samt Licht-Test ab 1. Oktober an, und bei Traunstein löschte die Feuerwehr ein Stoppelfeldfeuer, wohl ausgelöst durch angezündeten Sperrmüll.'
- eventId: 1057294
  start: 2026-09-29T06:10:00Z
  stop: 2026-09-29T06:20:00Z
  title: Süd Journal vom 28.09.2026 (Wh.)
  subtitle: Ehrenabend in Saaldorf-Surheim +++ Motocross-Fahrerin Alexandra Massury im Gesamtweltcup auf Platz 10 +++ Suedsport vom 28ten September +++ Fußball - 11ter Spieltag in der Regionalliga Bayern +++ Basketball - Niederlage fü..
  description: 'Saaldorf-Surheim im Berchtesgadener Land ehrte bei einem Sportabend zahlreiche erfolgreiche Athletinnen und Athleten von Rallye bis Langlauf sowie die besten Stadtradeln-Kilometersammler; zwei Gemeindetaler für verdiente Funktionäre beschlossen den Abend. +++ Motocross-Fahrerin Alexandra Massury aus Berchtesgaden beendete die WM-Saison beim Finale in Darwin trotz Hitze, Zeitverschiebung und Leih-KTM mit zwei Top-10-Rängen und Platz 10 gesamt, gönnt sich nun Erholung fürs Studium und plant die nächste Saison. +++ In der Regionalliga Bayern setzt sich der TSV Buchbach weiter ab: Beim FC Memmingen siegte der Spitzenreiter 1:0, Philipp Walter traf nach der Pause aus 25 Metern, es war der sechste Erfolg in Serie und der Fünf-Punkte-Vorsprung; Wacker Burghausen schlug 1860 München 3:1. +++ Die Basketballerinnen des TSV Wasserburg kassierten zum Start der 2. Bundesliga Süd bei den Bender Baskets Grünberg eine 56:71-Niederlage, nachdem sie zunächst geführt hatten; Topscorerin Abby Ray erzielte 20 Punkte, am 4. Oktober folgt daheim gegen Stuttgart die Chance zur Revanche.'
