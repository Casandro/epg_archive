  title: Mein wunderbarer Kochsalon - Geschmortes Schulterscherzel
  subtitle: Mein wunderbarer Kochsalon - Geschmortes Schulterscherzel
  description: Tafelspitz und Schulterscherzel gehören in den Suppentopf, geduldig gesotten und dann mit Braterdäpfel, Apfelkren und Schnittlauchsauce gegessen. Das kennen wir und anders wollen wir es nicht. Das wäre ja wie Schnitzel mit Sauerkraut. Dann kam Markus Nagl vom Artner am Franziskanerplatz in meine Küche und schmorte ein Schulterscherzel. So zart und mit dichter Sauce, ein Traum, vor allem jetzt im Herbst, wo wir wieder mit Verve den Schmortopf anwerfen. Perfekt für Großfamilien und Gäste. AT 2019
