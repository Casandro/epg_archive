  title: Mein wunderbarer Kochsalon - Thai Curry Suppe
  subtitle: Mein wunderbarer Kochsalon - Thai Curry Suppe
  description: 'Freitagabend, 10 Gäste werden erwartet, entspanntes Abendessen mit Freunden. Der Einfachheit halber habe ich meine Burrata-Quelle angezapft, dazu ein paar San Marzano Tomaten und griechisches Olivenöl von unseren Freunden und fertig ist die Vorspeise. Kurz vor 19 Uhr dann das knappe SMS: "Freuen uns schon sehr. Übrigens: der F, die Y, der R und die M sind lactoseunverträglich. Juhu, bis gleich!" Von wegen Juhu. Die Burrata wurde flugs an die Kinder verfüttert, die mit der Entwicklung der Dinge sehr zufrieden waren. Eine kurze Inspektion meines Vorrates ergab ein paar Zutaten, die nicht mehr ganz taufrisch, sondern vom Curry vom Vortag stammten. Etwas Koriander, Ingwer, Knoblauch und Schalotten habe ich sowieso immer zu Hause, ein paar grüne Chilischote, eine Limette. Und so entstand eine der besten Vorspeisen, die ich seit langem produziert habe - grüne Currypaste, mit Fond und Kokosmilch eingekocht und fertig. AT 2019'
- eventId: 1250739
  start: 2026-09-29T05:25:00Z
  stop: 2026-09-29T05:28:00Z
  title: Mein wunderbarer Kochsalon - Chili Cheese Sandwich
  subtitle: Mein wunderbarer Kochsalon - Chili Cheese Sandwich
  description: Wenn ich wirklich nicht mehr Zeit als einen Boxenstopp in der Küche habe, dann steht am Ende meistens ein Sandwich vor mir. Ich bin eine bekennende Warmesserin, daher landet bei mir so gut wie jedes Sandwich in der Grillpfanne. Ich liebe geschmolzenen Käse und einen leichten Chili-Kick. Käse habe ich eigentlich immer zu Hause, und eingelegte Jalapeños auch (die gibt es zum Glück mittlerweile im Supermarkt). Mehr braucht es als Basis für dieses Fast food im besten Sinn nicht. Alles andere, was der Kühlschrank hergibt, ist ein willkommenes Upgrade - bei mir war es diesmal knuspriger Speck und knackiger Rucola. So luxuriös kann ein belegtes Brot sein. AT 2019
- eventId: 1250740
  start: 2026-09-29T05:30:00Z
  stop: 2026-09-29T05:34:00Z
  title: Mein wunderbarer Kochsalon - Cheesecake mit Erdbeeren und Baiser
  subtitle: Mein wunderbarer Kochsalon - Cheesecake mit Erdbeeren und Baiser
  description: Schon alleine das Wort Cheesecake macht mich glücklich. Auch, wenn sich manche immer wieder über Anglizismen beschweren, aber der Käsekuchen kann da triggertechnisch nicht mithalten. Dieses Rezept hat Johann Lafer erfunden, ich habe es nur etwas angepasst - hauchdünne Kekskruste, eine saftig-satte Frischkäsefüllung, die gebacken wird und eine turmhohe Baiserhaube mit frischen Erdbeeren machen das Ganze nicht nur geschmacklich zum Gesamtkunstwerk, sondern auch optisch. AT 2019
- eventId: 1250753
  start: 2026-09-29T05:35:00Z
  stop: 2026-09-29T05:45:00Z
  title: Mein wunderbarer Kochsalon - Reisbällchen
  subtitle: Mein wunderbarer Kochsalon - Reisbällchen
  description: Manchmal stehe ich stundenlang in der Küche, mühe mich ab (ja, ich bin ziemlich arm), etwas Gesundes und zugleich Gutes zu kochen, um dann nicht mehr als eine gerümpfte Nase zu ernten (Kari, Louis, das geht an euch). Daher freue ich mich immer über vegetarische Gerichte, die ich meiner Familie verkaufen kann. Diese Reisbällchen fallen genau in diese Kategorie. Ja, sie sind frittiert, das sollte man sich natürlich nicht jeden Tag gönnen, aber hin und wieder brauche ich das. Ich habe die Gewinnerin der Puls 4-Show "Kochgiganten" - Viktoria Stranzinger - zu mir in den Kochsalon eingeladen, sie hat sich Verstärkung aus der nächsten Generation mitgebracht. Wer über den Nachwuchs in der Gastronomie jammert, sollte einmal Kristina und Viktoria II auf die Finger schauen. Ihre Ernsthaftigkeit und Leidenschaft für das Kochen ist bemerkenswert. Einzig das Gemüse zu den Reisbällchen war nicht so ganz meine Sache, zu süß, aber das ist sicher Geschmacksache und die Hauptrolle spielen die Reisbällchen. Und die jungen Damen. AT 2019
