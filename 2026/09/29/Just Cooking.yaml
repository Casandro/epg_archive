  title: Die besten Köche der Welt - Zu Gast im Ikarus - Sidney Schutte
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Sidney Schutte
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sidney Schutte, Chefkoch des 2-Sterne-Restaurants "Librije''s Zusje", und Hangar-7 Executive Chef Martin Klein kreieren gemeinsam ein Menü der Spitzenklasse für das Restaurant Ikarus. In Amsterdam taucht Martin Klein in die Welt seines zukünftigen Gastkochs Sidney Schutte ein. Im Librije''s Zusje im Waldorf Astoria Hotel kocht der 41-jährige Niederländer exotisch-luxuriös: asiatische Zutaten treffen auf europäische Techniken. Martin Klein staunt über seltene Delikatessen wie Entenzungen und Silberohrpilze im Dessert. Außerdem besuchen die beiden einige von Schuttes besten Lieferanten, und reisen dafür quer durchs Land: von der Austernzucht im südlichen Zeeland bis zur Hofkäserei auf einer winzigen Flussinsel nahe Amsterdam. In Salzburg müssen diese Zutaten in Perfektion aufgetischt werden. AT 2017'
- eventId: 1250808
  start: 2026-09-29T19:10:00Z
  stop: 2026-09-29T19:57:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Dominique Crenn aus San Francisco
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Dominique Crenn aus San Francisco
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Geboren und aufgewachsen in Versailles, Frankreich, ist Dominique Crenn seit 2011 die Inhaberin des Fine Dining-Tempels "Atelier Crenn" in der Hafengegend von San Francisco. In dem exklusiven Restaurant serviert sie französisch inspirierte Molekularküche, die nicht nur die Gourmets von Kalifornien begeistert: auch der Guide Michlin ehrt das Atelier Crenn 2013 mit zwei Sternen. Dominique Crenn ist die allererste Frau, die sich in Amerika diese Auszeichnung erkämpfen konnte. AT 2016'
- eventId: 1250809
  start: 2026-09-29T20:00:00Z
  stop: 2026-09-29T20:47:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Sang-Hoon Deigeimbre aus Liernu
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Sang-Hoon Deigeimbre aus Liernu
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Der gebürtige Koreaner Sang-Hoon Degeimbre, zwei-Sterne-Koch aus Brüssel, und für Gault Millau Koch des Jahres 2016, gastiert im Restaurant Ikarus im Salzburger Hangar-7. Im belgischen Liernu erkundet Executive Chef Martin Klein Sang-Hoon Degeimbres Küchengeheimnisse in dessen Restaurant L''Air du Temps: Der Autodidakt Degeimbre eröffnete sein Gourmet-Restaurant 1997. Davor hatte er sich von einer Metzgerlehre zu einem der besten Sommeliers Belgiens hochgearbeitet. Kochtechniken wie Fermentation und ausgefallene Produkt-Kombinationen zählen zu den Hauptmerkmalen seiner Kochphilosophie. Degeimbres Gerichte sind Ausdruck zweier Welten: Seine koreanischen Wurzeln und der Einfluss Belgiens spiegeln sich in der Neuinterpretation des belgischen Klassikers Moules-frites wieder: Frittierte Kartoffeln, schwarz gefärbt von der Sepia des Tintenfischs, bilden die Schalen. Dazwischen das Muschelfleisch. Solche Kombinationen gilt es für Martin Klein mit dem Ikarus Team im Hangar-7 so auf die Teller zu bringen, dass neben Meister Degeimbre auch Ikarus-Patron Eckart Witzigmann zufrieden ist. Auf Sang-Hoon Degeimbre wartet in Salzburg außerdem noch bei der Regio-Challenge eine besondere Herausforderung: er trifft auf Weiserhofkoch Roland Essl, und beweist seine Kochkünste bei der Zubereitung eines heimischen Birkhahns. Salzburger Küche und das Kochen nach uralten regionalen Rezepten ist die große Stärke von Küchenchef Roland Essl. Dazu verwendet er österreichische Lebensmittel und kreiert Gerichte mit Geschichte, wie etwa die Stinkerknödel, die aus einem ganz speziellen Kas zubereitet sind. AT 2016'
- eventId: 1250823
  start: 2026-09-29T20:55:00Z
  stop: 2026-09-29T21:42:00Z
