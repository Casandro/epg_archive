  title: Mein wunderbarer Kochsalon - Schweinerücken mit Sauce Maltaise und Babyspinat
  subtitle: Mein wunderbarer Kochsalon - Schweinerücken mit Sauce Maltaise und Babyspinat
  description: Ich bin eine große Verfechterin der klassischen Saucen und finde, sie können ein ansatzweise banales Gericht in den Adelsstand erheben. Sebastian Hurnaus vom Casino Restaurant in Wien zeigt uns, was hinter der Sauce Maltaise steckt - und die wichtigsten Tricks, damit der Klassiker gelingt. Dazu gibt es einen saftigen Schweinerücken aus Niederösterreich. Was will man mehr? AT 2019
- eventId: 1250725
  start: 2026-09-29T03:50:00Z
  stop: 2026-09-29T03:53:00Z
  title: Mein wunderbarer Kochsalon - Schnelles Boeuf Stroganoff
  subtitle: Mein wunderbarer Kochsalon - Schnelles Boeuf Stroganoff
  description: Boeuf Stroganoff klingt nach großem Aufwand und Fortgeschrittenen-Niveau. Ist es aber nicht. Zugegeben, man muss für das Rindsfilet etwas tiefer in die Tasche greifen, aber nach meiner Devise - lieber weniger Fleisch, aber wenn, nur richtig Gutes - gönne ich es mir hin und wieder. Das Rezept für die Filetspitzen in säuerlicher Sauce wurde übrigens erstmals 1871 im russischen Kochbuch "Geschenk für junge Hausfrauen"  von Jelena Molochowetz erwähnt. Der in Moskau engagierte französische Koch Charles Brière brachte es zu einem Kochwettbewerb nach Paris, von wo aus es seinen internationalen Siegeszug aufnahm. Ich koche nicht sehr gerne mit Essiggurkerln, weil mir der Geschmack oft zu dominant ist. Daher habe ich sie nicht mitgekocht, sondern mit roten Zwiebeln sauer eingelegt und am Ende über das fertige Gericht gestreut. AT 2019
