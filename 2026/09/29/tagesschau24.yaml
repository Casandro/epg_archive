  title: Das Gipfeltreffen
  subtitle: Schubert, Sträter und König retten die Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Olaf Schubert, Torsten Sträter und Johann König erzählen, wie sie sich im Safari Club beim Durchschaukeln kennengelernt haben. Zuvor hat Olaf mit David Hasselhoff die Mauer eingerissen - und das, obwohl er ja alles hatte. Torsten kann sich außerdem nicht entscheiden, ob er Sternzeichen oder Partys schrecklicher findet, und Johann blickt in eine glückliche Zukunft als ausgestopfter Lurch im Laminat-Sarg. Dabei sind unsere Jungs noch immer fresh und spritzig. Nur ausziehen will sich wieder keiner. Aber egal. \n\nMit Fragen von Harald Lesch, Alexandra Popp, Sasha, 2RaumWohnung, Wincent Weiss, Louis Klamroth und Guido Maria Kretschmer."
