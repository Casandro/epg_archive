- eventId: 1057901
  start: 2026-09-29T19:30:00Z
  stop: 2026-09-29T20:00:00Z
  title: nachgefragt vom 28.09.2026 (Wh.)
  subtitle: Das Talkmagazin - Gäste sagen ihre Meinung!
  description: Die Ingolstädter Schriftstellerin Marieluise Fleißer hätte in diesem Jahr ihren 125. Geburtstag. Als eine der renommiertesten, deutschen Autorinnen im 20. Jahrhundert ist sie weit über die Ingolstädter Stadtgrenzen hinaus bekannt. Bei Nachgefragt spricht Michelle Milewski mit Doris Wittmann. Sie ist Kuratorin des Museums im Fleißerhaus und erzählt unter anderem, warum Fleißer in den 1920er Jahren einen Theaterskandal auslöste.
