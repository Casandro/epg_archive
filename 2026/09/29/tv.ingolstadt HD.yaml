  stop: 2026-09-29T16:45:00Z
  title: Studio Altmühl vom 29.09.2026
  subtitle: Das Magazin aus dem Altmühtal.
  description: Die Landkreise Eichstätt, Neuburg, Schrobenhausen, Pfaffenhofen und Ingolstadt erhalten jeweils ihr eigenes Landkreisstudio. Die Landkreismagazine werden von Korrespondenten aus der Region redaktionell begleitet und berichten wöchentlich aus dem Landkreis über aktuelle Geschehnisse.
- eventId: 1057821
  start: 2026-09-29T16:45:00Z
  stop: 2026-09-29T17:00:00Z
  title: Heimatgschichtn
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 1057822
  start: 2026-09-29T17:00:00Z
  stop: 2026-09-29T17:30:00Z
  title: news aktuell vom 29.09.2026 (Wh.)
  subtitle: Die wichtigsten Nachrichten aus Ingolstadt und der Region.
  description: Es ist die wichtigste Sendung mit News und Korrespondentenberichten aus Ingolstadt und aus den 5 Landkreisen Neuburg/Schrobenhausen, Weißenburg/Gunzenhausen, Eichstätt und Pfaffenhofen. Neben den Berichten und Kurzmeldungen zeigt News aktuell auch viele Bürgerumfragen und Statements, bzw. aktuelle Interviews.
- eventId: 1057823
  start: 2026-09-29T17:30:00Z
  stop: 2026-09-29T18:00:00Z
  title: Heimspiel vom 29.09.2026
  subtitle: Die Sportnachrichten aus Ingolstadt und der Region.
  description: Im Sendegebiet beheimatet sind attraktive Profivereine in den Bundesligen der Sportarten Eishockey und Fußball. Abseits dieser Spitzensport-Begleitung sollen Breitensport und Bayernliga, Nachwuchsarbeit und Ehrenamt im Regionalsport zum Tragen kommen. Attraktive Sportarten wie Turnen, Volleyball, Judo oder der Reitsport sollen regelmäßig präsentiert werden.
