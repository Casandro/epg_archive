  title: 'Detektyw Candice: Niezawodny instynkt 5 (odc. 8)'
  subtitle: Komendant Renoir i komisarz Leclerc testują aplikację randkową, której używała kobieta zamordowana w domu przez umówionym spotkaniem. Antoine nie wytrzymuje presji policjantów fetyszystów.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2017
    Reżyseria: Pascal Lahmani
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, Yeelem Jappain, Delphine Rich
    Pretty Woman (komendant Renoir) i Catwoman (komisarz Leclerc) testują aplikację randkową, której używała kobieta zamordowana w domu przez umówionym spotkaniem (krem do depilacji podpowiedział to Candice)! Antoine nie wytrzymuje presji policjantów fetyszystów i defilady potencjalnych kochanków Candice. Jedno ze spotkań okazuje się równie czarujące, co podejrzane. Czy Candice wkroczy do jaskini lwa?
