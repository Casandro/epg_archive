  title: ANIXE auf Reisen - Antarktis mit Richy Müller Teil 2
  description: 'Im zweiten Teil der Antarktis-Reportage verlässt Richy Müller den eisigen Kontinent für einen Besuch in Buenos Aires/Argentinien. Die 13-Millionen-Metropole mit europäischer Architektur ist das wirtschaftliche Powerhouse Südamerikas. Argentinien gehörte einst zu den wohlhabendsten Ländern der Welt. Das Land ist weltweit berühmt für seine riesigen Rinderherden und - wen wundert es? - für seine delikaten Steaks. Das ist auch Richy Müller zu Ohren gekommen und schon macht er sich auf die Suche nach dem besten Steakhaus des Landes. Die Argentinier lieben Fußball, das weiß jeder. Ebenso beliebt ist der Polo-Sport. Nach einer Trainingseinheit auf dem Pferderücken gesteht Richy Müller, dass Polo keineswegs so einfach ist wie es aussieht. Wie der Polo-Sport gehört auch der Tango nach Argentinien: Die mitreißende Musik und der Tanz haben ihren Ursprung in Buenos Aires, und sind Ausdruck des Lebensgefühls der Menschen. Grund genug für Richy Müller einen Tangokurs zu belegen und selbst das Tanzbein zu schwingen. Nach einem unterhaltsamen Streifzug zu Land heißt es bald wieder Leinen los in Richtung Antarktis. Während der Überfahrt durch die berüchtigte, sturmgepeitschte  Drake-Passage nimmt der Tatort-Kommissar das Schiff und seine Besatzung unter die Lupe. Dabei erfährt er, welche Voraussetzungen ein Expeditionsschiff erfüllen muss, um die antarktischen Gewässer befahren zu können. Das Ergebnis: Ein faszinierender Blick auf die technischen Finessen eines modernen Polarschiffes. Anschließend rüstet sich Richy Müller für eine Kanutour entlang der Eisberge und Küstengletscher.'
  widescreen: true
