  title: ERF Mensch Gott - Gott gibt _s echt! - Sicherheit durch Leistung
  description: Als ihr Vater schwer krank wird, bricht für Elena die vertraute Welt zusammen. Sicherheit findet sie von da an in ihrer Leistung. Doch die Überzeugung, stark und erfolgreich sein zu müssen, treibt sie mit Anfang 30 in eine Depression. Zu der Zeit arbeitet sie 70 - 80 Stunden pro Woche. Sie macht Karriere, scheut keine Herausforderung und keine Verantwortung. Und genauso hart, wie sie tagsüber arbeitet, geht sie abends feiern. Bis zu dem Moment, in dem ihr Körper streikt und ihre Seele leer ist.
