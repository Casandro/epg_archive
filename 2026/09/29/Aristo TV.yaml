  title: So schmeckt die Welt - Berchtesgadener Land
  description: Wir nehmen die Zuschauer mit in eine der schönsten Regionen Bayerns. Zwischen imposanten Bergen und klaren Seen entdecken wir traditionelle Spezialitäten, altes Handwerk und die Leidenschaft der Menschen für ihre Heimat. Ob auf Almen, in Manufakturen oder bei regionalen Produzenten - die Sendung zeigt, wie Natur, Kultur und Kulinarik hier zu einem einzigartigen Genusserlebnis verschmelzen.
