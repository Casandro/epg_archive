  title: Open Doors - Geschichten von Gottes Wirken
  subtitle: Gebete, die Kontinente verbinden
  description: |-
    Können Gebete Menschen erreichen, die man gar nicht kennt? In dieser bewegenden Folge von "Geschichten von Gottes Wirken" erleben Sie, wie die junge Chinesin Cathy und zwei ihrer Kommilitonen bei einer Reise in die USA Menschen begegnen, die jahrelang gezielt für sie gebetet haben - ohne sie jemals gesehen zu haben. Zufall oder Gottes wunderbare Führung? Paul Estabrooks erzählt eine faszinierende Geschichte über die Kraft des Gebets, Gottes Wirken über Grenzen hinweg und erstaunliche Begegnungen, die nur Gott vorbereiten kann. Lassen Sie sich ermutigen und entdecken Sie: Kein Gebet ist vergeblich! Schauen Sie rein und erleben Sie, wie Gott Gebete auf wundersame Weise beantwortet.

    Weitere Infos unter www.opendoors.de
  widescreen: true
  hd: true
