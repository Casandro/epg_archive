  title: Kommissar Wisting - Der Atem der Angst
  ageRating: 12
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Kommissar Wisting (Sven Nordin) nimmt an einem ungewöhnlichen Sondereinsatz teil: Ein bewaffnetes Polizeiaufgebot möchte sich von dem Serienmörder Kerr (Odin Waage), den Wisting hinter Gitter gebracht hat, zu den sterblichen Überresten eines verschollenen Opfers führen lassen. Wistings Tochter, die eine Dokumentation über das "Böse" dreht, darf den in Handschellen gefesselten Kerr auch hier begleiten. Wistings düstere Vorahnung bestätigt sich, als Kerr in einem Waldstück eine spektakuläre Flucht gelingt.'
