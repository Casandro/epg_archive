  title: Frauensauna - Plötzlich Wechseljahre
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Kathrin ist bereits mit 42 in die Wechseljahre gekommen und fühlt sich seitdem oft schlapp und antriebslos. Schlafprobleme und Erschöpfung bestimmen ihren Alltag, sie hofft durch gezieltes Training wieder mehr Energie zu bekommen. Andrea erlebt schon seit Ende 30 Hitzewallungen, Schlafstörungen und nachlassende Lust und fragt sich, ob die Veränderungen an ihr liegen - oder an den Männern in ihrem Leben. Janet arbeitet frühmorgens in einer Großküche und zieht sich bei Hitzewallungen ins Kühlhaus zurück. Doch Gelenkschmerzen, Schlaflosigkeit und innere Unruhe bleiben.
