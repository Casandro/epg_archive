  title: Eisbär, Affe & Co. (167)
  subtitle: Zoogeschichten aus Stuttgart
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: "Wo die Koikarpfen schwimmen, liegt bares Geld! Keine Reichtümer, aber jede Menge kleinerer Münzen. Gab es früher Jahre, in denen Pfleger und Gärtner dafür Gänsebraten essen konnten, fällt die Beköstigung in den letzten Jahren eher bescheiden aus. \nFamilie Waldhund erhält heute eine Aufgabe, die besondere Anforderungen an Teamgeist und Pfiffigkeit stellt: Ihr Futter, leckeres Fleisch, wird in einer Kiste verstaut, die sich nur im Zusammenwirken der Tiere öffnen lässt.\nDie Japanmakaken zieht es heute zum Wasser. Nicht nur der Hitze wegen: Dort schwimmen mehrere riesige Melonen - eine Köstlichkeit mitten im heißen Sommer."
