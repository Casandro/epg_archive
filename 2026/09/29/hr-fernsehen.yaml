  description: 'Deutschland steht offiziell fest an der Seite der Ukraine. Sanktionen sollen verhindern, dass westliche Technik in russischen Waffen, wie etwa Drohnen landet. Doch funktioniert das wirklich? In Kyjiw präsentieren Experten des ukrainischen Militär-Geheimdienstes dem Filmemacher Michael Höft überraschende Funde: In abgeschossenen Drohnen haben sie zahlreiche Bauteile auch deutscher Firmen gefunden, sogenannte Dual-Use-Technik. Wie können diese Teile trotz Sanktionen nach Russland gelangen? Ein Team des NDR folgt den Spuren geleakter russischer Zollpapiere und stößt auf ein Netzwerk von Zwischenhändlern in Zentralasien.'
