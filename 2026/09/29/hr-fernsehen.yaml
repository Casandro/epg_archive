  description: Ali Güngörmüs ist für "Kochs anders" im mittelhessischen Vogelsbergkreis unterwegs. Die Großhandelskauffrau Susanne Möller hat ihn nach Lauterbach-Frischborn eingeladen. Hier lebt die gebürtige Pfälzerin seit vielen Jahren, ist im internationalen Holzgeschäft tätig und engagiert sich besonders für Frauenrechte. Als begeisterte Hobbyköchin und Fan der "Küchenshow" will sie den Münchner Spitzenkoch mit einer Rindsroulade nach dem Rezept ihrer Mutter aus der Pfalz überzeugen. Dazu gibt es Rotkohl und Kartoffelbrei. Aber auch das hessische Lauterbach hat auf Susannes Kochkünste abgefärbt.
