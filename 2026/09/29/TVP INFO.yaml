  title: Podróże z historią 4 (odc. 3)
  subtitle: Widzowie poznają tajniki historycznej produkcji papieru. Radosław Kotarski rusza do Dusznik Zdroju. Zastanawia się, dlaczego produkcję papieru nazywa się czerpaniem i jak wykonuje się znak wodny.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Papier to rzecz na tyle zwyczajna, że właściwie nie zwracamy na niego większej uwagi na co dzień. Jednak nie wyobrażamy sobie życia bez papieru. Dlatego warto poznać tajniki jego historycznej produkcji. W tym celu Radosław Kotarski rusza do Dusznik Zdroju i sam ręcznie wytwarza arkusze papieru. Przy tej okazji zastanawia się, dlaczego produkcję papieru nazywamy czerpaniem i jak możliwe jest wykonanie znaku wodnego. Nie obędzie się bez wytężonej pracy!
  genre:
  - '149'
- eventId: 1109609
  start: 2026-09-29T01:20:00Z
  stop: 2026-09-29T01:56:00Z
  title: Polskie parki narodowe 1 (odc. 9)
  subtitle: Tematem programu będzie Narwiański Park Narodowy, wyjątkowy obszar chroniący rozlewiska Narwi, nazywany "polską Amazonią", będący rajem dla ptaków i miłośników przyrody.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
