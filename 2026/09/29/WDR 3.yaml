  title: WDR 3 Open
  description: "\"Die Hexenmeisterin siegt\", betitelt DER SPIEGEL seine Eloge auf Erykah Badu. \"Sie bricht den Fluch als Hexenmeisterin\", schreibt dagegen die taz. Ihr Rezensent Henrik von Holtum ist unter dem Namen Textor auch Rapper mit seiner Gruppe Kinderzimmer Productions und versteht HipHop und R&amp;B aus den USA besser als die meisten deutschsprachigen Autor:innen. Also reden wir mit ihm über \"Before The World Blows\", das neue Album von Erykah Badu &amp; The Alchemist. Und über den Telefonfetisch der Hexenmeisterin. \n<strong>Breezy </strong>| 3:23<br/>Erykah Badu &amp; The Alchemist\n<strong>Witch Doctor</strong> | 6:26<br/>Erykah Badu &amp; The Alchemist\n<strong>Valentine </strong>| 2:28<br/>Erykah Badu &amp; The Alchemist ft. Dram\n<strong>On and on</strong> | 3:45<br/>Erykah Badu\n<strong>Echos</strong> | 7:23<br/>Erykah Badu &amp; The Alchemist\n<strong>Aggressionsmanagement</strong> | 5:31<br/>Kinderzimmer Productions\n<strong>Master Teacher</strong> | 6:48<br/>Erykah Badu\n<strong>Wake up everybody</strong> | 7:30<br/>Harold Melvin &amp; The Blue Notes\n<strong>Hi </strong>| 0:35<br/>Erykah Badu\n<strong>Why Can't We Live Together</strong> | 4:49<br/>Timmy Thomas\n<strong>Cel U Lar Device</strong> | 6:28<br/>Erykah Badu\n<strong>Tyrone</strong> | 3:56<br/>Erykah Badu\n<strong>Caint Use My Phone (Suite)</strong> | 3:34<br/>Erykah Badu\n<strong>Hello</strong> | 4:07<br/>Lionel Richie\n<strong>Chantilly Lace</strong> | 2:20<br/>Big Bopper\n<strong>Hello</strong> | 4:52<br/>Adele\n<strong>Hello It's Me</strong> | 5:32<br/>Isley Brothers\n<strong>Hello feat. Andre 3000 </strong>| 4:27<br/>Erykah Badu\n<strong>Hotline Bling </strong>| 4:49<br/>Drake"
  subtitle: Hexenmeisterin? Königin? Erykah Badu ist zurück
