- eventId: 656804
  start: 2026-09-29T20:03:00Z
  stop: 2026-09-29T21:00:00Z
  title: WDR 3 Jazz
  subtitle: Romantiker der Avantgarde - Manfred Schoof (Extended Version)
  description: "\"Ich war immer frei, ein bunter Vogel, der mal hier, mal dahin flog. Wenn die Musik gut ist, ist es mir egal, was ich mache.\" Schoof wird 1936 in Magdeburg geboren, studiert in Kassel und Köln. Mitte der 1960er-Jahre gründet der Trompeter eine der ersten Gruppen des europäischen Free Jazz. Die Mitgliedschaft im Globe Unity Orchestra gehören genauso zu seiner Vita wie die Arbeit mit dem Komponisten Bernd Alois Zimmermann oder Kurt Edelhagen. Zudem schreibt er Kompositionen für Film und Fernsehen und kümmert sich um den Nachwuchs - als Dozent, ab 1990 als Professor und Leiter des Jazz-Studiengangs in Köln. Als \"Mann der ersten Stunde\" zählt Manfred Schoof zu den Granden nicht nur des deutschen, sondern des europäischen Jazz. \n<strong>Mines</strong> | 8:35<br/>Schoof/Dudek/Schlippenbach/Niebergall/Liebezeit\n<strong>Scales </strong>| 0:20<br/>Manfred Schoof\n<strong>Shadows </strong>| 0:10<br/>Manfred Schoof\n<strong>Ingredience of the Blues</strong> | 0:04<br/>Manfred Schoof\n<strong>Grasshopper</strong> | 0:05<br/>Shelly Manne\n<strong>Night at Ghandi's</strong> | 0:11<br/>Manfred Schoof\n<strong>Our Chant </strong>| 0:10<br/>Manfred Schoof\n<strong>Tropi </strong>| 0:15<br/>Alexander von Schlippenbach\n<strong>Adjustment </strong>| 2:10<br/>Alexander von Schlippenbach\n<strong>Globe Unity for 13 Instruments</strong> | 0:15<br/>Alexander v. Schlippenbach\n<strong>Elegia</strong> | 0:05<br/>Bernd Alois Zimmermann\n<strong>Lamento</strong> | 0:07<br/>Bernd Alois Zimmermann\n<strong>Improvisation I</strong> | 4:37<br/>Manfred Schoof\n<strong>Resonance</strong> | 7:00<br/>Manfred Schoof\n<strong>For Marianne</strong> | 0:15<br/>Manfred Schoof\n<strong>Die Fliege Adular</strong> | 0:10<br/>Manfred Schoof\n<strong>Et Anrheinerlied </strong>| 0:09<br/>Manfred Schoof\n<strong>Band Switch</strong> | 7:15<br/>George Gruntz\n<strong>Triple Adventure</strong> | 0:07<br/>Albert Mangelsdorff\n<strong>Ali's Waltz</strong> | 0:07<br/>Ali Haurand\n<strong>No Parietto</strong> | 0:10<br/>Gianluigi Trovesi\n<strong>Ingredience of the Blues</strong> | 0:03<br/>Manfred Schoof\n<strong>Smiles </strong>| 0:12<br/>Rainer Brüninghaus\n<strong>Globe Unity Orchestra - 50 Years</strong> | 4:20<br/>Alexander von Schlippenbach\n<strong>Suggestion</strong> | 4:20<br/>Manfred Schoof"
