  title: WDR 3 Konzert
  subtitle: 'Moderation: Susanne Herzog'
  description: "Alma Mahlers Lieder waren für Christine Pugel Groeneveld die Initialzündung, um sich auf die Suche nach verborgenen Schätzen anderer Komponistinnen zu machen. Zum Weltfrauentag am 8. März ist das Duo Deux Femmes im Wasserschloss Herten mit Liedern der Boulanger-Schwestern, von Pauline Viardot, von Germaine Tailleferre und vielen anderen Frauen aufgetreten. Musikalische Entdeckungen garantiert!\nLieder von <strong>Henriette Bosmans</strong>, <strong>Catharina van Rennes</strong>, <strong>Nadia Boulanger</strong>, <strong>Lili Boulanger</strong>, <strong>Cécile Chaminade</strong>, <strong>Alma Mahler</strong>, <strong>Poldowski Lady Dean Paul</strong>, <strong>Pauline Viardot</strong>, <strong>Dora Pejacevic</strong>, <strong>Germaine Tailleferre</strong> und <strong>Liza Lehmann</strong> \n<strong>Duo Deux Femmes</strong>:<br/>Christine Pugel Groeneveld, Sopran<br/>Vanda Albota, Klavier\nAufnahme vom 8. März 2026 aus Schloss Herten \nModeration: Susanne Herzog <br/>Redaktion: Simon Al-Odeh"
