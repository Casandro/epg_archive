  title: Dove sta Zazà (ep.2)
  subtitle: '"Dove sta Zazà" andò in onda nel 1973 sul Programma Nazionale in 4 puntate. Girato a colori, andò in onda in bianco e nero (qui di seguito, per la prima volta, tutte le puntate integrali a colori). Il programma era condotto ..'
  description: "a Gabriella Ferri, Enrico Montesano, Pippo Franco, Oreste Lionello e Pino Caruso. \"Dove sta Zazà\" era fondato sulle canzoni della Ferri e sugli sketch dei comici tratti dal repertorio del cabaret classico. La regia era di Antonello Falqui, autore del programma insieme a Mario Castellacci e Pier Francesco Pingitore. La seconda puntata è dedicata al cabaret nel periodo del primo dopoguerra e del fascismo in Italia: Gabriella Ferri canta \"Chitarrata Romana\", il corpo di ballo si esibisce in \"Maramao perché sei morto\", Pippo Franco ed Enrico Montesano raccontano degli anni e delle canzoni del ventennio. Pino Caruso fiancheggia Montesano in uno sketch comico sulla vita mondana. - Un programma di Enrico Salvatori \nCon la collaborazione di Lucia Ciancaglini\nProduttrice esecutiva Alessandra Giorgi \nRegia Agostino Pozzi, Fabrizio Marini"
