  title: Passato e Presente La strage di Marzabot
  subtitle: Passato e Presente La strage di Marzabotto - Monte Sole - Tra il 29 settembre e il 5 ottobre del 1944, si compie a Monte Sole la più sanguinosa strage compiuta dai nazifascisti durante l'occupazione tedesc
  description: "sca. La strage viene spesso ricordata come strage di Marzabotto, ma le violenze subite dalla popolazione civile hanno riguardato non solo il comune di Marzabotto ma tutta l'area. I tedeschi asserragliati sulla Linea Gotica, con gli Alleati che avanzano verso nord e i partigiani che rappresentano una spina nel fianco, decidono di rispondere attuando la strategia della ''terra bruciata'': annientare interi territori e la popolazione che ci vive. A Monte Sole è una settimana di fuoco che distrugge per sempre 115 località. Alla fine, il bilancio è di 770 morti, di cui quasi un terzo al di sotto dei dodici anni. E' la più grande strage di civili di tutta l'Europa occidentale. Emanuela Lucchetti racconta gli eventi direttamente dai luoghi in cui si sono svolti mentre in studio, con Paolo Mieli, c'è la storica Isabella Insolvibile. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli \nCon la consulenza di Cristoforo Gorno  \nOspite in studio la prof.ssa Isabella Insolvibile \nCon la partecipazione di Emanuela Lucchetti \nRegia Davide Frasnelli \nProduttore Esecutivo Valentina Tassini"
