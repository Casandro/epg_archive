- eventId: 651933
  start: 2026-09-29T12:00:00Z
  stop: 2026-09-29T13:00:00Z
  title: SWR Aktuell Langstrecke
  description: "14:00\nDer KI - Podcast  \nWie viel KI hält unser Staat aus?\nWidersprüche, Klagen, Einsprüche: Bürgerinnen und Bürger rüsten mit KI auf, die Ämter kommen nicht hinterher. Bringt das unseren Staat zum Einsturz - oder endlich in Bewegung?\nVon Marie Kilg & Fritz Espenlaub\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n\n14:30\nDie Justizreporter*innen\nKI in der Justiz - Fluch oder Segen?\nKI soll eigentlich das Leben aller erleichtern - in vielen Gerichten in Deutschland ist davon aber aktuell nicht viel zu spüren. Gerade in den Verfahren, in denen Bürger:innen ohne Anwält:innen vor Gericht ziehen können, suchen sie sich nämlich immer öfter Unterstützung von KI. Die formuliert dann direkt auch die Klageschrift oder den Antrag ans Gericht. Allerdings ist sie dabei nicht immer präzise, es schleichen sich sehr viele Fehler ein und es entstehen endlos lange Dokumente. Die Gerichte müssen diese aber genau durcharbeiten und das fordert immer mehr Zeit. Der Präsident des Landessozialgerichts Baden-Württemberg Bernd Mutschler und sein Richterkollege Frank Seeberger berichten über diese Schwemme an KI-Schriftsätzen. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-justizreporter-innen/urn:ard:show:8e3e202c41bc9ace/"
