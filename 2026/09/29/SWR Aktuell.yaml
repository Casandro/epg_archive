  title: SWR Kultur - Das Wissen
  subtitle: Erdgas aus Deutschland - Umstrittene Bohrprojekte und die Suche nach Alternativen
  description: |-
    Von Annette Beutler
    Trotz Energiewende ist Deutschlands Gasbedarf hoch. Mehr als die Hälfte aller Wohnungen werden mit Erdgas beheizt, auch die Industrie verbraucht viel Gas. Doch die heimische Förderung deckt nur noch fünf Prozent des Bedarfs. Das will die schwarz-rote Koalition ändern. Niedersachsen hat mehrere neue Bohrprojekte genehmigt, eines davon vor der Nordseeinsel Borkum. Doch eine langjährige Förderung stünde im Widerspruch zum Ziel der Klimaneutralität. Wäre heimisches Biogas die bessere Lösung?
