  title: 'Die Nordreportage: Der Isemarkt'
  subtitle: Basar der Hanseaten
  description: Er ist einer der schönsten Wochenmärkte in Hamburg und gehört mit fast einem Kilometer zu den längsten Freiluftmärkten Europas - der Isemarkt im Hamburger Stadtteil Harvestehude. Unter dem U-Bahn-Viadukt bieten mehr als 200 Marktbeschicker dienstags und freitags ihre Waren an. Gewürze aus aller Welt, Blumen und Gemüse aus den Vierlanden, Wurst aus der Pfalz oder Käse aus Frankreich. Doch es sind die Menschen, die dem Isemarkt sein Gesicht geben, Kunden und Marktleute, norddeutsche Originale und Hamburger Charaktere.
- eventId: 1322929
  start: 2026-09-29T01:00:00Z
  stop: 2026-09-29T01:30:00Z
  title: 'Die Nordreportage: Wenn der Tod ein Anfang ist'
  subtitle: Der strenge Ablauf einer Multiorganentnahme
  description: In ganz Deutschland warten pro Jahr etwa 10.000 schwerkranke Menschen auf ein neues Organ. In Mecklenburg-Vorpommern ist die Bereitschaft, Organe zu spenden, nach Hamburg die höchste deutschlandweit. Doch es reicht nicht. Hatte die Uniklinik Greifswald früher bis zu 25 Entnahmen pro Jahr, waren es 2019 nur noch vier. Wir begleiten eine Multiorganentnahme bei einem 21-Jährigen, der einen schweren Verkehrsunfall hatte.
  genre:
  - '144'
- eventId: 1324829
  start: 2026-09-29T01:30:00Z
  stop: 2026-09-29T02:00:00Z
  title: 'Die Nordreportage: Tatort Supermarkt'
  subtitle: Detektive im Einsatz
  description: Richie und sein Kollege Ali arbeiten seit 15 Jahren zusammen als Supermarktdetektive. Die beiden sind ein eingespieltes Team. Entdeckt einer von ihnen eine verdächtige Person, stehen sie untereinander in Funkkontakt und wechseln sich mit der Observation ab, damit es nicht zu auffällig wird. Der Zugriff erfolgt immer erst hinter der Kasse und grundsätzlich zu zweit. Die Diebe kommen aus allen Bevölkerungsschichten. Gestohlen werden vor allem Spirituosen und Drogerieartikel. In letzter Zeit aber auch vermehrt Fleischpakete von der Frischetheke.
- eventId: 1325870
  start: 2026-09-29T02:00:00Z
  stop: 2026-09-29T02:30:00Z
  title: die nordreportage
  subtitle: Ein Dorf im Ausnahmezustand - Das Drei-Tage-Festival von Wacken - Bauernschlau und Heavy Metal
  description: Bauer Uwe Trede hatte vor mehr als 15 Jahren zuerst die Idee und jetzt alles fest im Griff. Ohne ihn geht bei dem größten Open-Air-Heavy-Metal-Festival in Europa nichts. Er organisiert die drei Tage, in denen das kleine schleswig-holsteinische Dorf zum Mekka hartgesottener, eingefleischter Freaks dieser Musikszene wird. Für mehr als 40 Bands und 40.000 Fans aus aller Welt plant Uwe Trede mit seinen Helfern eine rundum dörflich familiäre Veranstaltung, wenn schwarz gekleidete Hardrocker auf grünen Wiesen feiern. In dieser Zeit wird in Wacken mehr Geld verdient, als sonst im ganzen Jahr.
- eventId: 1327909
