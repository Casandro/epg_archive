  title: Die Ostfriesen-Clique (1/3)
  subtitle: Helmuths Hosenecke
  description: Die dreiteilige Dokumentation "Die Ostfriesen-Clique" porträtiert Menschen, die es so nur in Ostfriesland geben kann, und zeigt, wie sie zwischen Großefehn, Wiesmoor und Leer zusammenhalten. Aus ganz Ostfriesland kommt die Kundschaft in Helmuths "Hosenecke" nach Wiesmoor, um sich in Modefragen beraten zu lassen. Hier gibt es über 4.000 Jeanshosen und satte Rabatte. Inhaber Helmuth Krüsmann gilt als Jeansspezialist und Mann mit Geschmack. In den meisten Fällen sieht er auf den ersten Blick, welche Größe der Kunde braucht. Klappt das nicht, wird Helmuth auch mal "knatschig".
- eventId: 1328147
  start: 2026-09-29T03:00:00Z
  stop: 2026-09-29T03:30:00Z
  title: Die Ostfriesen-Clique (2/3)
  subtitle: Herr Hicken und seine Polster
  description: Wer ostfriesisches Flair in seinem Wohnzimmer haben möchte, wendet sich an Manfred Hicken. In seiner Werkstatt in Großefehn baut der Polsterer Ostfriesensofas in allen Größen und Farben. Der angrenzende Laden hat auch normale Couchgarnituren auf Vorrat, doch das Ostfriesensofa ist der absolute Renner. Zusammen mit seiner Schwester, seiner Frau und den Angestellten kümmert sich Manfred Hicken nicht nur um den Bau, er ist auch ständig unterwegs, macht Hausbesuche, denn wer ein Sofa will, ordert ihn und seine Stoffmuster in die "gute Stube".
- eventId: 1328454
  start: 2026-09-29T03:30:00Z
  stop: 2026-09-29T04:00:00Z
  title: Die Ostfriesen-Clique (3/3)
  subtitle: Der Friesen-Frisör
  description: Der Friseursalon von Jürgen Hesse ist eine ganz eigene Welt und Kult in Ostfriesland. In seinem Laden wird die Kundschaft um ein halbes Jahrhundert zurückversetzt. Denn Jürgen Hesse besitzt noch die Originaleinrichtung seiner Mutter, die den Laden 1956 eröffnete. Umso moderner aber sind die Haarschnitte. Mit dem sogenannten Flat-Kamm mit integrierter Wasserwaage zaubert Jürgen Frisuren à la Tom Cruise im Filmklassiker "Top Gun". Liebstes Gesprächsthema ist sein großes Hobby Fußball.
- eventId: 1329077
