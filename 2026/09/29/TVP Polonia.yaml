  title: Stulecie Winnych 1 (odc. 5)
  subtitle: W Europie rozprzestrzenia się hiszpanka. Śmiertelna choroba dotyka także rodzinę Winnych. Bronia zaczyna pracę u dziedzica Podkowy Leśnej. Pod dom Winnych podjeżdża wojskowy samochód.
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Katarzyna Kwiatkowska, Arkadiusz Janiczek, Katarzyna Wajda
    Rodzina Winnych cieszy się z powrotu Antoniego. Bronia ma nadzieję, że już niebawem do ojca dołączą Roman i Kajetan. W Europie szaleje hiszpanka, śmiertelna grypa nie oszczędza rodziny Winnych. Stanisław dowiaduje się od Ignacego o ciąży Władzi. Bronia zaczyna służbę u Stanisława Lilpopa. Dziedzic Podkowy Leśnej wkrótce poznaje Anię i obdarza dziewczynkę wielką sympatią. Do Brwinowa docierają wieści o Bitwie Warszawskiej i wygranej Wojska Polskiego pod wodzą Piłsudskiego.
  ageRating: 12
- eventId: 1109469
  start: 2026-09-29T19:20:00Z
  stop: 2026-09-29T20:10:00Z
  title: Ojciec Mateusz 3 (odc. 7)
  subtitle: Podczas zawodów strzeleckich ma miejsce nieudany zamach na życie pewnego biznesmena. W czasie przesłuchania Czesław Mader twierdzi, że nie wie, dlaczego ktoś mógłby próbować go zabić.
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Piotr Polk, Dorota Kamińska, Olga Frycz, Jan Monczka, Dariusz Wnuk
    Aspirant Nocul startuje w zawodach strzeleckich. Kibicują mu koledzy policjanci i ksiądz Mateusz. Wśród publiczności znajduje się biznesmen Czesław Madera z żoną Ireną. Nagle biznesmen wychodzi z sali. Podąża za nim młody mężczyzna w czapce nasuniętej na oczy. Wkrótce z sali wychodzi również ksiądz Mateusz. Przypadkiem udaremnia zamach na biznesmena. Podczas przesłuchania Madera lekceważy sprawę. Twierdzi, że nie wie, dlaczego ktoś próbował go zabić. Odmawia policyjnej ochrony.
