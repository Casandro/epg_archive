    Filmowy portret Olgi Boznańskiej - jako artystki i kobiety. Osadzenie w kontekście historycznym, miejsce kobiety w świecie malarskim, psychologiczne przemiany, wybory życiowe i artystyczne. Film dokumentalny "Autoportret za mgłą. Olga Boznańska" opowiada o życiu i etapach twórczości znanej polskiej malarki, portrecistki.
