    Załamana rozstaniem z ukochanym Luiza rozważa przerwanie studiów weterynaryjnych, a Damian stanowczo zwalnia Aro z pracy za nawiązanie romansu z klientką. Tymczasem Wilk wymusza na Agacie podjęcie ostatecznej decyzji w kwestii zakupu mieszkania. Z kolei ostra kłótnia Emila z Emilką na tle internetowej działalności Daniela potęguje rosnące obawy Joanny o negatywny wpływ ojca na chłopca.
