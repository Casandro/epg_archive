    Aspirant Nocul startuje w zawodach strzeleckich. Kibicują mu koledzy policjanci i ksiądz Mateusz. Wśród publiczności znajduje się biznesmen Czesław Madera z żoną Ireną. Nagle biznesmen wychodzi z sali. Podąża za nim młody mężczyzna w czapce nasuniętej na oczy. Wkrótce z sali wychodzi również ksiądz Mateusz. Przypadkiem udaremnia zamach na biznesmena. Podczas przesłuchania Madera lekceważy sprawę. Twierdzi, że nie wie, dlaczego ktoś próbował go zabić. Odmawia policyjnej ochrony.
