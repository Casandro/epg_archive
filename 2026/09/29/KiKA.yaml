  description: |-
    3D-Animationsserie, Kanada / Singapur 2016
    Franklins Frühstück

    Bei Familie Schildkröte soll ein großes Familienfrühstück stattfinden. Diesmal will auch Tante kommen, also beschließt Franklin ein ganz besonderes Frühstück zuzubereiten - und zwar ganz allein. Doch das ist gar nicht so einfach, denn nicht alles schmeckt jedem. Franklin verbringt viel Zeit damit, herum zu probieren und das richtige Rezept zu finden. Da er aber dabei jede Hilfe ausschlägt, droht das lustige Experiment etwas aus dem Ruder zu laufen.
