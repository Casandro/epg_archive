    Miese Maschinen, Teil 1

    Der Siegeszug der neuen Technologien macht auch vor Garfields Welt nicht Halt. Jon verläßt sich im Alltag bereits so sehr auf sein Smartphone, das ihm gar nicht auffällt, wie Garfield es benutzt, um an extra Mahlzeiten zu kommen. Auf dem weit entfernten Planeten Schprocket sieht es allerdings noch schlimmer aus, denn dort haben die Smartphones bereits die Herrschaft über die Bewohner übernommen. Über allem steht eine Maschine namens Master Control. Dem genügt die Herrschaft über den Heimatplaneten nicht mehr. aster Control will auch die Macht über den Planeten Erde. Dazu tauscht er zunächst Zoey aus, die Smartphone-Stimme, die alle Fragen der Menschen beantwortet. Doch dann muß er es mit Garfield aufnehmen.
    Regie: Philippe Vidal
    Buch/Autor: Julien Magnat, Mark Evanier
    Musik: Laurent Bertrand, Jean-Christophe Prudhomme
    HD-Produktion
