  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nPapst-Besuch als Massen-Event: Warum ist Frankreich so begeistert von Papst Leo?\nAnders als sein Vorgänger Franziskus, der mit Vorliebe ?an die Ränder? der katholischen Welt reiste, hat Papst Leo XIV. in den vergangenen vier Tagen mit Frankreich bewusst eines der Kernländer des alten Europas besucht. Neben den gesellschaftlichen Themen nahm er besonders die Zukunft der EU in den Blick und besuchte die Heimatstadt von Robert Schuman. Der EU-Gründervater und frühere französische Außenminister könnte bald seliggesprochen werden. \n\nWahlen in Brasilien: Welchen Einfluss haben die Pfingstkirchen?\nAm kommenden Wochenende wählt Brasilien einen neuen Präsidenten. Im Wahlkampf stehen sich Amtsinhaber Luiz Inácio Lula da Silva und sein Herausforderer Flávio Bolsonaro gegenüber, der älteste Sohn von Ex-Präsident Jair Bolsonaro. Beide Kandidaten umwerben massiv Mitglieder von Pfingstkirchen, die ein Drittel der Wählerschaft ausmachen. Vor allem der ultrarechte Bolsonaro tritt offensiv bei religiösen Großevents wie der ?Marcha para Jesus? ..."
