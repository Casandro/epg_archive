  description: "Juckende Quaddeln und Schwellungen:\nNesselsucht erkennen und behandeln\n\nGast:\nProf. Dr. Petra Staubach-Renz, Oberärztin an der Hautklinik und Poliklinik der Universitätsmedizin Mainz\nAm Mikrofon: Lennart Pyritz\n\nReportage:\n\"Man probiert alles aus\": Eine Urtikaria-Betroffene berichtet\n\n11:05 Uhr-Gespräch:\nSelbsthilfe bei Nesselsucht \nInterview mit Sabine Bauer, Gründerin und Geschäftsführerin ?Urtikaria-Helden?\n\nAktuelle Informationen aus der Medizin: \nSocial Media-Sucht bei Jugendlichen: Ursachen und Abhilfe\nPriv.-Doz. Dr. Kerstin Paschke, Ärztliche Leitung des Deutsches Zentrum für Suchtfragen des Kindes- und Jugendalters, Universitätsklinikum Hamburg-Eppendorf\n\nGrippe, Corona, RSV\nWie gut funktionieren mRNA-Impfstoffe bei Risikogruppen\n\nHörertel.: 00800 4464 4464\nsprechstunde@deutschlandfunk.de\n10:30-10:35 Nachrichten\n\n11:00-11:05 Nachrichten"
