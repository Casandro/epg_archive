  stop: 2026-09-29T02:45:00Z
  title: 'Über Gott und die Welt: Engel, Erzengel, Geister'
  subtitle: Gespräch
  description: Was sind Engel und wozu sind sie da? Martin Leitner, Direktor des Priesterseminars Leopoldinum Heiligenkreuz, erklärt und gibt Rat. Ein Gespräch an der Phil.-Theol. Hochschule Benedikt XVI. Heiligenkreuz.
- eventId: 1243915
  start: 2026-09-29T02:45:00Z
  stop: 2026-09-29T03:15:00Z
  title: 'Island: Widerhall des Schöpfers'
  subtitle: Dokumentation
  description: '"Widerhall des Schöpfers" ist ein spektakulär schöner Film, der auf Island entstanden ist. An dieser letzten Grenze zur Zivilisation entdecken Männer und Frauen des Glaubens besondere Segnungen in dieser schönen, jedoch harschen Umgebung.Diese Schönheit ist eine Einladung, Gottes Schöpfung zu bewundern und seine Liebe zu den Menschen. Gleichzeitig sind das raue Klima und Terrain auch Herausforderungen und Schwierigkeiten auf der seelischen Ebene, die aber der Seele beim Wachsen helfen und damit dem Schöpfer näher bringen. Vom heidnischen Anbeten der Natur und seiner Wunder gelangen wir zum Lobpreis und zur Anbetung des Schöpfers.'
- eventId: 1243871
  start: 2026-09-29T03:15:00Z
  stop: 2026-09-29T03:45:00Z
  title: Medizin mit Tiefgang - wo Heilung mehr meint als nur Therapie
  subtitle: Gespräch
  description: Im neuen Format von und mit Dr. Claudia Kaminski geht es nicht nur um Diagnosen, Medikamente und Behandlungsmethoden - sondern auch um den Menschen in seiner ganzen Zerbrechlichkeit, Stärke und Würde - mit Blick auf die Ewigkeit.
- eventId: 1243872
  start: 2026-09-29T03:45:00Z
  stop: 2026-09-29T04:00:00Z
  title: 'Spirit: Wie Gott spricht - und wie wir hören können'
  subtitle: Gespräch
  description: 'Mit Dr. Margarete Eirich, Theologin und PädagoginModeration: Volker NiggewöhnerIn einer lauten und von Reizen überfluteten Welt stellt sich die Frage neu: Spricht Gott heute überhaupt noch - und wenn ja, wie? Im Gespräch mit der Theologin Margarete Eirich geht es um die verschiedenen Weisen, wie Gott zum Menschen spricht - in der Heiligen Schrift, im Gewissen und im Alltag. Zugleich wird deutlich, was das Hören auf Gott oft erschwert und wie es neu eingeübt werden kann. Eine Einladung, Gottes Stimme im eigenen Leben bewusster wahrzunehmen.'
