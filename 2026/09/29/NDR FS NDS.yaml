  description: 'Der Blaue will schnell ein Campingzelt aufbauen. Dabei erhält er ungefragte Hilfe von Grobi, der sich angeblich bestens mit Zelten auskennt. In der "Sesamstraße"-Märchenparodie "Aladin und die Wunderlampe" findet Held Ernie (Aladin) in einer Höhle eine Wunderlampe. Als er erkennt, dass er nun Herr eines mächtigen Geistes namens Bert ist, wird er maßlos und vergisst, sich das Wichtigste zu wünschen: seine Freiheit. Außerdem zeigt Abby Elmo, was sich alles aus einem Blatt Papier machen lässt.'
