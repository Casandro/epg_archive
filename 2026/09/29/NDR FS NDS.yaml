  title: Die Ostfriesen-Clique (3/3)
  subtitle: Der Friesen-Frisör
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Der Friseursalon von Jürgen Hesse ist eine ganz eigene Welt und Kult in Ostfriesland. In seinem Laden wird die Kundschaft um ein halbes Jahrhundert zurückversetzt. Denn Jürgen Hesse besitzt noch die Originaleinrichtung seiner Mutter, die den Laden 1956 eröffnete. Umso moderner aber sind die Haarschnitte. Mit dem sogenannten Flat-Kamm mit integrierter Wasserwaage zaubert Jürgen Frisuren à la Tom Cruise im Filmklassiker "Top Gun". Liebstes Gesprächsthema ist sein großes Hobby Fußball.
