  title: 'Die Nordreportage: Tatort Supermarkt'
  subtitle: Detektive im Einsatz
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Richie und sein Kollege Ali arbeiten seit 15 Jahren zusammen als Supermarktdetektive. Die beiden sind ein eingespieltes Team. Entdeckt einer von ihnen eine verdächtige Person, stehen sie untereinander in Funkkontakt und wechseln sich mit der Observation ab, damit es nicht zu auffällig wird. Der Zugriff erfolgt immer erst hinter der Kasse und grundsätzlich zu zweit. Die Diebe kommen aus allen Bevölkerungsschichten. Gestohlen werden vor allem Spirituosen und Drogerieartikel. In letzter Zeit aber auch vermehrt Fleischpakete von der Frischetheke.
