  title: Karpfenangeln am Grande Fiume Po
  subtitle: Karpfenangeln am Grande Fiume Po
  description: |-
    Dieser Fluss zieht mich nun seit über 20 Jahren in seinen Bann und bei jedem Besuch,entdecke ich eine neue Seite an Ihm: der Po in Italien. Der Po entspringt in 2020 Metern Höhe in den Cottischen Alpen und fließt nach 652 km südlich von Venedig ins Mittelmeer. Auf seinem Lauf kreuzt er die Gebiete Piemont, die Lombardei, Emilia Romagna und Venezien. Die Po-Ebene zählt zu den fruchtbarsten Regionen Italiens, Pinien und Pappeln wachsen entlang der Ufer und spenden Schatten. Ich verbringe bis zu 20 Wochen im Jahr an diesem Fluss, wobei der Waller die meiste Zeit in meinem Focus steht. Dass dieser Fluss aber weit mehr, als Waller zu bieten hat, ist mittlerweile vielen Anglern bekannt. Dieser Fluss verfügt über einen guten Bestand an Fischen wie Brassen, Karauschen, Zander, Meeräschen, Barben, Rapfen sowie Karpfen. Die Karpfenbestände des Po's sind gigantisch und Fische über 40 Pfund werden Jahr für Jahr gemeldet. Gerne möchte ich Ihnen einen kleinen Einblick in diese sehr spannende Art des Karpfenfisches geben. In diesen Film zeige ich ihnen die Spots zum Karpfenangeln, sowie Montagen. Abgerundet wird das Ganze mit dem verwendeten Futter und deren Zubereitung.
     IT 2023
