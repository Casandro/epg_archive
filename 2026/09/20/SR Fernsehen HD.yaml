  title: Lecker aufs Land
  subtitle: Zu Gast bei Myriam Sehringer im Markgräflerland
  description: "Myriam Sehringer ist beruflich angekommen: als Landfrau von Herzen. Seit 2025 ist ihr Hof im südbadischen Müllheim auch ein zertifizierter \"Lernort Bauernhof\", auf dem Kinder und Erwachsene Landwirtschaft hautnah erleben können. \nWährend des Studiums mitten in der Pandemie lernte sie ihren heutigen Mann Franz kennen. Ihr Hof im südbadischen Müllheim ist ein Obstbaubetrieb mit angeschlossener Tierhaltung. Um den Obstbau kümmert sich Myriams Schwager Max, sie und Franz sind für Tiere, Backstube und Vermarktung zuständig. In der hofeigenen Backstube backen Myriam und Franz Brot im Holzofen und verarbeiten einen Teil des Obstes."
