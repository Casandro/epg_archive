  title: WDR 5 Hörspiel am Sonntag
  subtitle: Nicht mit uns (3+4/6)
  description: |-
    Endlich ist der Schulabschluss in der Tasche und Hassan feiert mit seiner Stufe. Aus feucht-fröhlich wird übermütig und ein unbedachter Streich setzt Hassans komplette Zukunft aufs Spiel. Die Aktion wird angezeigt und gefährdet Hassans Aufenthaltsstatus. Aber seine Freunde Nina, Kevin, Jojo und Libby werden aktiv. Gemeinsam und mit viel Energie und Kreativität setzen sie alles daran, dass Hassan bleiben kann. Und Jojo hat nicht mehr nur seinen Karrieretraum als Profifußballer im Kopf, sondern auch Schmetterlinge im Bauch, wenn er mit Hassan zusammen ist...
    <strong>Teil 3: Auf der Demo</strong>
    Das Arbeiten an der <markup type="language.en">Social-Media</markup>-Kampagne und der Petition bringt Spaß und schweißt die Freunde noch enger zusammen. Ungeahnt viele Unterstützer folgen dem Aufruf zur Demo. Libbys Jagd auf Gegendemonstranten führt zur Eskalation.
    <strong>Teil 4: In Gefahr</strong>
    Jojo und Hassan genießen ihr romantisches Date im Eiscafé, was Jojos strengen Fußballer-Ernährungsplan strapaziert und Jojos Mutter provoziert. Nina kann Kevin knapp vor rechten Schlägern retten und lernt ihn noch näher kennen.
    Von Leonie Below <br/>Mit Ahmed Laissaoui, Joy Grant, Tyrell Otoo, Hannah Schiller <markup type="abbr" abbreviation="u.v.a." correspondent="und vielen anderen">u.v.a. </markup><br/>Regie: Matthias Kapohl <br/>Produktion: WDR 2024
    Ab dem <markup type="abbr" abbreviation="8." correspondent="achten">8.</markup> September <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
