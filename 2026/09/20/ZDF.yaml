  title: Dumb Money - Schnelles Geld
  description: |-
    USA 2023
    Während der Coronapandemie sorgt der YouTuber und Hobby-Finanzexperte Keith Gill alias Roaring Kitty für eine Revolution auf dem Aktienmarkt und für Milliardenverluste an der Wall Street.

    Mit seinen Videos motiviert Keith Menschen aus allen sozialen Schichten zum Kauf von Aktien des Videospielhändlers GameStop, auf deren Einbruch an der Börse vielfach spekuliert wurde.
    Nach plötzlichen Einschränkungen für die Anleger geht der Fall vor Gericht.
