  subtitle: Das Geheimnis der Seeklause
  description: |-
    Gemeinsam mit Hoagascht-Moderator Patrick Eisl gehen wir einem Goiserer Weltwunder auf die Spur: Erstmals seit rund 500 Jahren wird die historische Seeklause am Hallstätter See generalsaniert. Bauleiter Rudi Hackl erklärt, wie das einzigartige Holzbauwerk ohne Originalpläne detailgetreu erneuert wird. Beim Steegwirt erzählen Seniorchef Fritz Grampelhuber und Historiker Michael Kurz, warum die Seeklause einst für den Salzhandel unverzichtbar war. Außerdem stehen die Goiserer Gamsjagatage im Mittelpunkt: Bei der Radl-Pirsch rollen Hunderte mit geschmückten Waffenrädern durch den Ort, bevor bei der Gamsbartolympiade der schönste Gamsbart der Welt gekürt wird. Stimmungsvoll begleitet werden wir von den jungen Beriga Paschern mit ihrer urig-kraftvollen Goiserer Musizierweise.
    Volkskultur, Österreich 2026, R: Matthias Gugler M: Patrick Eisl
