  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Wahlherbst-Finale: Letzte Warnung für die Politik? \nDer deutsche Wahlherbst geht ins Finale: Nach Sachsen-Anhalt sind am Sonntag Mecklenburg-Vorpommern und Berlin dran. Im Nordosten will mehr als jeder Dritte AfD wählen, in der Hauptstadt greift die Linke nach dem Roten Rathaus. Links wie rechts dasselbe Signal: Die Regierenden rutschen ab. Nicht zuletzt kann dieser Wahltag auch über die Zukunft von Deutschlands Kanzler Friedrich Merz entscheiden. Ist das die Quittung für eine Politik, die ihre Wähler im Stich gelassen hat? Wer kann die vielen Krisen lösen? Und wie fest sitzt das politische Spitzenpersonal in Deutschland wie in Österreich im Sattel? \n\nZinsen, Tanken, Teuerung: Wie viel Krise verträgt Österreich? \n\"2026 wird das Jahr des Aufschwungs\", versprach Kanzler Stocker im Jänner. Jetzt ist Herbst, und statt Aufschwung kommt die Teuerung zurück. Sprit und Heizöl treiben die Inflation wieder über drei Prozent, die EZB hat die Zinsen heuer schon zweimal erhöht. Und der Staat steckt im Defizitverfahren und muss sparen, gerade wenn die Wirtschaft Hilfe bräuchte. Droht Österreich ein Winter der Teuerung? Und ist von der Dreierkoalition noch Entlastung zu erwarten - oder nur noch Machterhalt?\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
