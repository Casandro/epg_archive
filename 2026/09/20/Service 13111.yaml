  title: Terra Mater
  subtitle: Der Sturm - Tiere bei Blitz und Donner
  description: Wie verhalten sich Wildtiere, wenn es blitzt und donnert? Wenn ein schweres Sommergewitter über Mitteleuropa hereinbricht mit Sturmböen, Blitzeinschlägen, Hagel und sintflutartigen Regenfällen? In Zeiten des Klimawandels mehren sich solche Wetter-Extreme und stellen nicht nur den Menschen, sondern auch Flora und Fauna vor gewaltige Herausforderungen. Der Film dokumentiert den Verlauf eines Sturms und folgt dem Überlebenskampf unterschiedlicher Wildtiere, Insekten, Störche, Waschbären und Maulwürfe. Wie Tiere und Pflanzen auf die ersten Warnzeichen reagieren, mit welch überraschenden Strategien sie das Unwetter meistern und wer von der vermeintlichen Naturkatastrophe sogar profitieren kann, zeigt der Film in atemberaubenden Aufnahmen. 2023
