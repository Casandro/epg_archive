  title: Servus Kinder
  subtitle: Schwammerl-Narrisch
  description: 'Schwammerlsuchen kann ein richtiges Abenteuer sein. Das erleben vier Freunde im Bergwald bei Hüttau in Salzburg. Erwischt man ein giftiges Schwammerl, kann so ein Waldabenteuer mitunter lebensgefährlich sein! Schaffen es die Vier, genug gute Pilze für ein Mittagessen zu finden? Was es da alles zu beachten gilt, erklärt ihnen die Pilzberaterin Christl Baumgartner. Zusammen mit der Köchin Christiane Schaidreiter gelingt den jungen Schwammerlfreunden, auch aus wenigen Eierschwammerln ein feines Gericht zu zaubern. Und sie lernen obendrein, wie sich Pilze konservieren und sogar für kleine Bastelkunstwerke verwenden lassen.  Österreich 2023, R: Goerg Antretter'
