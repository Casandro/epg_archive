  title: Kunstraub - Die spektakulärsten Fälle Europas
  subtitle: Frankfurt
  description: |-
    Die gewagtesten Kunstraube Europas: Berühmte und über die Maße wertvolle Gemälde von William Turner, von Rembrandt van Rijn und Edvard Munchs ikonisches Werk "Der Schrei" wurden mit viel Geschick, Kunstfertigkeit, einem ausgeklügelten Plan und beinahe filmreif gestohlen. Jedes Jahr fallen Kunstwerke im Wert von 4,7 Milliarden Euro Diebstählen zum Opfer. Nach Waffen und Drogen ist es eines der lukrativsten Verbrechen. Die Spurensuche führt tief in die Welt der Kunstkriminalität: von den führenden Kunstgalerien Europas, über die Unterwelt Serbiens und Skandinaviens, bis hin zum Glanz und Glamour der Hollywood Hills. Die Detektive müssen gegen die kriminellen Superhirne ihr gesamtes Geschick aufbringen, um die Gemälde im globalen Katz-und-Maus-Spiel aufzuspüren und zu sichern. Erzählt wird die Geschichte von den Menschen, die an den Schauplätzen des Geschehens anwesend oder vom Kunstraub betroffen waren. Die Zeugen legen ein komplexes Geflecht von Kunstraub, Erpressung, Drogenhandel und sogar Mord frei. Mit dem Diebstahl von zwei Gemälden von William Turner, die 1994 als Leihgaben aus London in Frankfurt ausgestellt waren, beginnt ein Katz-und-Maus-Spiel quer durch Europa, von London nach Belgrad, tief hinein in die Welt der Kriminalität.
    Dokumentarfilm, Vereinigtes Königreich 2022, R: Hugh Ballantyne, Stuart Elliott
