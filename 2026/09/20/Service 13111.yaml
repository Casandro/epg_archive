  title: TM Wissen
  subtitle: Camembert ade? - Ist der beliebte Käse bedroht?
  description: 'Forschungsergebnisse aus Frankreich haben in den Medien für Furore gesorgt: der Schimmelpilz, der dem Camembert zu seinem typisch weißen Aussehen verhilft, ist von einer genetischen Verarmung bedroht. Für seinen typisch weißen Rand sorgt eine ganz bestimmte Schimmelpilz-Art: "Penicillium camemberti". Durch die industrielle Züchtung kommt es zu Mutationen des Pilzes. Die genetische Varianz des Pilzes nimmt ab. Dadurch verliert er immer mehr die Fähigkeit, Sporen zu bilden - und das ist ein Problem. Denn durch die Sporen vermehrt sich der Pilz. "Terra Mater Wissen" trifft den steirischen Käsemeister Vinzenz Stern, der in seiner Käserei eigenen Camembert herstellt. Ist der Camembert noch zu retten? // Ein Roboter, der selbständig beschädigte Kleidungsstücke repariert - ohne Nadel und Faden: Diese Entwicklung aus Linz könnte in naher Zukunft vielleicht ein wesentliches Umweltproblem lösen. Denn in Zeiten von günstiger "Fast Fashion" können selbst kleinste Beschädigungen an Textilien dazu führen, dass die Kleidung weggeworfen wird. Bislang ist das Reparieren von Kleidung nur in Handarbeit möglich, und dadurch zu teuer oder aufwändig. Zusammen mit dem Robotikexperten Professor Johannes Braumann forscht sie in Linz in dem Projekt "Fashion & Robotics" daran, Kleidung durch Roboter reparieren zu lassen. // Materialforscher Dr. Markus Retsch von der Universität Bayreuth sucht im Auftrag der EU nach einem Material, das Häuser von außen kühl halten kann und findet die Lösung in einer leeren Chipstüte. Denn die Innenseite ihrer Folie ist reflektierend. Doch wie wird aus Chipstüten eine kühlende Abdeckung für Häuser?Österreich 2024'
  genre:
  - '144'
  widescreen: true
- eventId: 980292
