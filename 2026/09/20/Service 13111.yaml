  title: TM Wissen
  subtitle: Die Chemie einer guten Geschichte - Was macht eine gute Erzählung aus?
  description: 'Egal ob in Büchern, im Kino, in der Werbung oder in der Politik: Menschen lieben spannende Geschichten. Eine gute Geschichte zu erzählen ist reine Chemie und je nachdem ob die Handlung spannend, lustig oder tragisch ist, schüttet unser Körper Hormone aus. Ein guter Cliffhanger kann sogar die gleichen Effekte haben, wie bei einer Drogensucht. "Terra Mater Wissen" über die Chemie des Geschichten Erzählens. // Walter Schindlegger ist ein wahrer Tüftler. Der Oberösterreicher hat es sich zur Aufgabe gemacht, einen Stuhl zu bauen, der keine Rückenschmerzen verursacht. Nach jahrelanger Entwicklung zusammen mit Markus Franz-Riegler und Thomas Riegler und fast 50 Prototypen ist seine Idee ausgereift: ein dynamischer Stuhl mit Pendelmechanik. Derzeit wird der Effekt dieses neuartigen ergonomischen Stuhls an der FH Gesundheitsberufe OÖ in Linz wissenschaftlich untersucht. Dr. Bernhard Schwartz hat Probanden dafür mehrere Wochen lang auf dem Pendelstuhl sitzen lassen. Der Ergonomie-Forscher möchte herausfinden, wie wir das Sitzen gesünder machen können. // Wenn das Wasser unsere Kläranlagen verlässt, ist es nicht wirklich sauber. Schmerzmittelreste, Antibiotika oder Hormone fließen zurück in die Gewässer und damit ins Ökosystem. Die konventionellen Reinigungsmethoden heimischer Kläranlagen können diese Rückstände nicht vollständig herausfiltern. Professorin Angela Hofmann aus Innsbruck stellt aus Restholz Aktivkohle her. An der Internationalen Hochschule in Innsbruck erforscht die Chemikerin die Eigenschaften der Aktivkohle und testet deren Reinigungskraft. // Außerdem: Wie wäre eine Welt ohne Wasser? // Wer hat den Sessel erfunden? Warum platzen Seifenblasen? Sind Gamer die besseren Chirurgen? Und: Wie romantisch ist der Hecht?Österreich 2024'
