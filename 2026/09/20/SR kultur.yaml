- eventId: 548322
  start: 2026-09-20T15:04:00Z
  stop: 2026-09-20T16:00:00Z
  title: 'Hörspielzeit:  Marthas Schlüssel'
  subtitle: von Michael Dillinger (SR 1997)
  description: "Seit dem Tod ihres Mannes lebt Martha Frey allein. Aus dem gemeinsamen Haus mit Kind und Enkelkindern ist sie ausgezogen, um der \"fürsorglichen Belagerung\" der lieben Familie zu entgehen. Eines Tages wird der Hausflur des Mietshauses, in dem Martha nun lebt, neu gestrichen und dabei verschwindet Marthas Wohnungsschlüssel spurlos - ausgerechnet der Gegenstand, an dem ihre Unabhängigkeit und Freiheit hängen. \nEin banales Stück Alltag, humorvoll erzählt im Dialog zwischen dem allwissenden Autor und Erzähler und seiner Figur Martha, das jedoch der Auftakt zu erheblichen Verwicklungen ist, die Marthas Leben durcheinanderbringen."
