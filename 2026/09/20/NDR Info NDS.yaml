  title: Organisiertes Verbrechen - Recherchen im Verborgenen
  subtitle: 'Kokain ohne Ende: Kokain-Highway im Atlantik (3/3)'
  description: Ein Speedboot rast mit zwei Tonnen Kokain über den Atlantik Richtung Portugal. Ein Scharfschütze der französischen Marine stoppt es aus einem Hubschrauber - ein seltener Fahndungserfolg. Denn viele solcher Boote erreichen Europas Küsten unentdeckt. Recherchen von NDR, WDR, SZ und internationalen Partnern zeigen, wie sich die Schmuggelrouten verändern, wie professionell Kokain-Netzwerke arbeiten und warum europäische Ermittler zunehmend das Militär einsetzen. Darum geht es in der neuen Staffel von "Organisiertes Verbrechen - Kokain ohne Ende".
