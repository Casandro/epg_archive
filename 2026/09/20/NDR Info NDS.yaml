  title: Die Lösung - der Psychologie-Podcast
  subtitle: Geld | Macht Reichtum glücklich? (mit Sebastian Klein)
  description: |-
    Was ist eigentlich mit meinen Gefühlen los? Wenn du dir diese Frage auch öfter stellst, ist der ARD-Psychologie-Podcast "Die Lösung" genau das Richtige für dich. Host Verena "Fiebi" Fiebiger und Journalistin Sophia Sailer hörst du jede Woche im Wechsel, um gemeinsam mit dir das tägliche Gefühlschaos zu sortieren. Mit dabei sind die Psychotherapeut:innen Nike Hilber und Sina Haghiri und zusammen reden sie über alles, was mentale Gesundheit angeht.

    Ein Podcast vom BR.
