  description: 'Julia und Paul fühlen sich von Nele und Jakob übergangen. Die Teamchefin und ihr Untermieter scheinen beim Frühstück bereits alle dienstlich relevanten Themen durchgehechelt zu haben, sodass der Rest der Crew sich langsam überflüssig fühlt. Natürlich ist es auch Jakob, der zur nächsten Fortbildung darf. Eigentlich hatte sich Julia beworben. Dieser Zwist überschattet bald die Ermittlungen zu einem Fall, den Paul zunächst als Bagatelle abtut: Die Gattin eines Juwelenhändlers meldet das Verschwinden ihres Mannes Robert Karl. Er sei auch per Handy nicht zu erreichen ... nur ein Mann, der fremdgeht?'
