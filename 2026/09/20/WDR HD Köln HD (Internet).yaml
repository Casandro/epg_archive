  title: Musik macht mich einfach glücklich!
  subtitle: Marie Jacquot persönlich
  description: |-
    Der Film begleitet Marie Jacquot, die neue Chefdirigentin des WDR Sinfonieorchesters, in ihre Vergangenheit - von ihren Anfängen im kleinen französischen Chartres bis heute.

    Marie Jacquot wollte eigentlich einmal Tennis-Profi werden. Wäre da nicht gleichzeitig die große Leidenschaft für die Musik gewesen. Im Portrait von Elmar Sommer gibt die neue und erste Chefdirigentin des WDR Sinfonieorchesters sehr persönliche Einblicke in ihre Geschichte, ihre Herkunft und ihre wichtigsten Stationen auf dem Weg zur Chefdirigentin eines der besten Sinfonieorchester Deutschlands.
- eventId: 1051469
