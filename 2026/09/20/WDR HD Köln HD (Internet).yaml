  title: 'Meisterküche: NRW trifft Niedersachsen'
  subtitle: Sechsteilige Reihe
  description: 'Die Meisterküche macht in diesem Jahr in vielen verschiedenen Regionen und Ländern Station - in NRW, in Deutschland und Europa. Yvonne Willicks präsentiert in der heutigen Folge kulinarische Highlights aus dem Nachbarland von NRW: Niedersachsen.'
