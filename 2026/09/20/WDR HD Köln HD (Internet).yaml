  title: Wunderschön! Urlaub rund um Königswinter
  subtitle: 'Moderation: André Gatzke'
  description: 'Königswinter ist ein Ort der schönen Blicke: Majestätisch zieht der Rhein an der Stadt vorüber, vom Wasser aus schaut man auf das Riesengebirge. Und vom Gipfel des Drachenfels können Besucher sehen, was es so alles gibt, rund um Königswinter. Das ist eine ganze Menge, stellt Moderator André Gatzke fest. Im Brohltal sucht er Edelsteine. Die sind dort vor rund 13.000 Jahren von einem Vulkan ausgespuckt worden. Wie man heimische Tiere vor die Kameralinse bekommt, lässt er sich im Kottenforst zeigen. Und in Bonn versucht er, wie Harry Potter, den magischen Schnatz zu jagen.'
