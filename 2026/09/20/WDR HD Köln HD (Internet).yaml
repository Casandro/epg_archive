  title: '"Echt jetzt Kölner Treff?!"'
  description: Was passiert, wenn Fernsehgeschichte auf den Blick von heute trifft? Zum Jubiläum des Kölner Treff öffnet der WDR sein Archiv und zeigt Ausschnitte, die verblüffen, berühren, amüsieren - und manchmal auch irritieren. In "Echt jetzt Kölner Treff?!" schauen Menschen aus NRW aus unterschiedlichen Generationen auf Szenen, die einst große Fernsehmomente waren und heute neue Fragen auslösen.
- eventId: 1045261
