  title: Musik macht mich einfach glücklich!
  subtitle: Marie Jacquot persönlich
  description: |-
    Der Film begleitet Marie Jacquot, die neue Chefdirigentin des WDR Sinfonieorchesters, in ihre Vergangenheit - von ihren Anfängen im kleinen französischen Chartres bis heute.

    Marie Jacquot wollte eigentlich einmal Tennis-Profi werden. Wäre da nicht gleichzeitig die große Leidenschaft für die Musik gewesen. Im Portrait von Elmar Sommer gibt die neue und erste Chefdirigentin des WDR Sinfonieorchesters sehr persönliche Einblicke in ihre Geschichte, ihre Herkunft und ihre wichtigsten Stationen auf dem Weg zur Chefdirigentin eines der besten Sinfonieorchester Deutschlands.
- eventId: 1051469
  start: 2026-09-20T05:05:00Z
  stop: 2026-09-20T06:45:00Z
  title: Marie Jacquot - Aufbruch in Köln
  subtitle: Das Antrittskonzert mit dem WDR Sinfonieorchester
  description: |-
    Marie Jacquot eröffnet ihre Amtszeit als Chefdirigentin mit Wagner, Chopin sowie Werken von Augusta Holmès und Skrjabin. Yulianna Avdeeva spielt Chopins Klavierkonzert Nr. 2.

    Am 18. September 2026 übernimmt Marie Jacquot in der Kölner Philharmonie die Leitung des WDR Sinfonieorchesters. Ihr Programm verbindet Wagners "Lohengrin"-Vorspiel mit Chopins Klavierkonzert Nr. 2 (Solistin: Yulianna Avdeeva). Mit "Andromède" von Augusta Holmès und Skrjabins "Le poème de l'extase" rücken sinfonische Dichtungen der Spätromantik in den Fokus.
