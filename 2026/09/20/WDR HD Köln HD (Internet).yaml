  description: Katerina Neydenova war 2014 die beste Physik-Schülerin der Welt. Dank der Hilfe ihres Lehrers Teodosi Teodosiew gewann sie damals die Physik-Olympiade. Heute untersucht sie mit High-Tech-Elektronenmikroskopen Proteine, um künftig bakterielle Krankheiten bekämpfen zu können. Womöglich erhält Katerina eines Tages einen Nobelpreis für ihre Arbeit in Cambridge.
