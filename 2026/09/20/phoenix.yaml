  description: '2026 feiern Wolfgang Niedecken und seine Band gleich zwei Jubiläen: Im März wurde der Sänger 75, und vor 50 Jahren wurde BAP gegründet. 1976 noch eine kölsche Kneipenband, ging es Anfang der 1980er-Jahre durch die Decke. Mit Liedern wie Verdamp lang her oder Kristallnaach traf BAP den Nerv einer Generation. Ein Filmteam begleitete Niedecken bei den Vorbereitungen zu einem Konzert in der Kölner Philharmonie. Außerdem berichten Weggefährten, warum und wie BAP sie geprägt hat.'
