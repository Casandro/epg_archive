  title: Die Sitte - Wie Staat und Polizei über die Moral wachten (1/2)
  subtitle: Von Weimar bis zur Nachkriegszeit
  description: 'Die Sittenwächter sind nicht weit - mit Zensur und Strafe. In den 1920ern bekommt die Sittenpolizei mehr Aufgaben: Serienmörder, Transvestiten, Pornografie. Die Verfolgung von sogenannten Asozialen ist nur eines der grausamen Kapitel in der NS-Zeit. Polizisten können ohne Strafverfahren Prostituierte, "Asoziale", Bettler, Sinti und Roma in KZs einweisen. Der NS-Staat schafft ein Netz an Bordellen. Sogar KZ-Bordelle lässt Reichsführer Himmler einrichten. Doppelmoral und willkürliche Verfolgung werden zum System.'
