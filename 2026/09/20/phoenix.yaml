  title: Buschflieger - Abenteuer am Himmel (1/3)
  subtitle: Südamerika
  description: |-
    Ihr Arbeitsplatz befindet sich in der Luft: Die Buschflieger Alessandro Huber und Eduardo Alvarez erleben tagtäglich Abenteuer am Himmel von Suriname und Argentinien. Permanent neu planen, sich der Natur fügen, Verantwortung für das Leben der Passagiere tragen - der Arbeitsalltag der Buschflieger ist anspruchsvoll.
    Wer in Suriname fliegt, muss ein gestandener Buschpilot sein. Nahezu 90 Prozent des Landes bestehen aus Regenwald, und die Landebahnen sind kurz.
    Eduardo Alvarez übernimmt heute Aufträge, um Felder zum Beispiel mit Saatgut zu besprühen. Der tiefe Flug erfordert äußerste Präzision und besondere Achtsamkeit.
