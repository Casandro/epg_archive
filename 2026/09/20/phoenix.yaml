  title: Die Sitte - Wie Staat und Polizei über die Moral wachten (2/2)
  subtitle: Von der sexuellen Revolution bis zu den bunten 1980ern
  description: |-
    1961 sorgen Gemälde des jungen Künstlers Georg Baselitz mit übergroßen Penissen noch für einen Skandal und ein Eingreifen der Sittenpolizei. Am Ende gewinnt die Kunstfreiheit.
    Mit der Freizügigkeit der 68er-Generation geraten immer mehr Fälle von Pornografie und Kuppelei ins Visier der Polizei. Homosexuelle und Prostituierte werden weiter streng überwacht.
    In den 1980er-Jahren ist Schluss: Es kommt bei der "Sitte" zu nachhaltigen Reformen.
