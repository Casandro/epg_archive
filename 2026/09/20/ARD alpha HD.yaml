  title: Europas letzter Sommer
  subtitle: Die Julikrise 1914
  description: 'Das Jahr 1914. Es herrscht Frieden und Wohlstand in Europa. Besonders das selbstbewusste Deutsche Reich blickt zurück auf einen beispiellosen, wirtschaftlichen Aufschwung. Dann fällt Ende Juni in Sarajewo ein tödlicher Schuss: der österreichische Thronfolger wird ermordet. Im Laufe des kommenden Monats überstürzen sich die Ereignisse. International nutzen Diplomaten und Staatslenker das Attentat als Vorwand, die eigene Macht zu vergrößern und alte Rechnungen zu begleichen. In nur wenigen Wochen stürzen Kompromisslosigkeit, Größenwahn und blinder Gehorsam den Kontinent in den bis dato größten Krieg der Menschheitsgeschichte.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
- eventId: 451293
