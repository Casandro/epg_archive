  title: Im Passeiertal - zwischen Saumpfaden und Wasserfällen
  description: |-
    Das Passeiertal ist wie Südtirol in Miniatur. Auf der einen Seite Richtung Meran sanft und mediterran mit Weinbau, steigt es auf der anderen steil an, zeigt sich felsig und alpin und ist oft noch bis tief in die warme Jahreszeit hinein schneebedeckt. Das nach Norden geschützte Tal zählt bis zu dreihundert Sonnentage jährlich.

    Vielfältig wie die Landschaft sind auch die Menschen hier. Der Südtiroler Filmautor Stefan Nicolini hat sich in dieser Region umgesehen und zeigt, wie sich die ländlichen Traditionen auch in unseren modernen Zeiten erhalten haben.
