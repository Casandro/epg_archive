    Musikrivalen

    Als Max wie gewohnt zu seinem Klavierunterricht bei Maestro Barenboim erscheint, läuft er einem weiteren Schüler des Maestros über den Weg. Arthur, so sein Name, scheint ein wahres Meistertalent zu besitzen, so gut spielt er Mozarts Konzert. Da Maestro Barenboim nicht darüber hinwegsehen kann wie geknickt Max deshalb ist, erzählt er ihm von Antonio Salieri, der zu Lebzeiten Mozarts musikalischer Konkurrent gewesen war. In der Schule steht inzwischen die Wahl zum Klassensprecher bevor. Max, Maurice und Tara treten gegeneinander an. Je weiter der Wahlkampf voranschreitet, desto überzeugter ist Max davon, ein missgönnender Neidhammel zu sein wie einst Salieri. Doch dann erklärt der Maestro, dass neidisch zu sein völlig normal ist. Denn unser Drang sich zu vergleichen ist oft die Quelle unseres Antriebs.
