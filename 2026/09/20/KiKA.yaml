    Champions von morgen

    Sie trainieren hart, träumen groß - und stehen schon früh im Rampenlicht: In der aktuellen Folge von "1, 2 oder 3" dreht sich alles um beeindruckende Nachwuchssportlerinnen und -sportler.

    Eine von ihnen ist die Hip Hop Tänzerin Aurelia, die in ihrer Altersklasse bereits den Weltmeistertitel gewonnen hat. Doch sie ist nicht die Einzige mit außergewöhnlichem Talent: junge Athlet*innen geben alles, um zu den Besten in ihrer Sportart zu gehören.

    Für ganz besondere Einblicke sorgt Juniorreporterin Lena. Sie begleitet ihre Namensvetterin und Snowboarderin Lena und erlebt hautnah, wie viel Mut, Technik und Training nötig sind, um spektakuläre Sprungschanzen beim Snowboardcross zu meistern. Auch beim Turmspringen wächst eine ehrgeizige neue Generation heran. Warum das Training hier nicht nur im Wasser, sondern auch an Land stattfindet, gilt es für die Rateteams herauszufinden.

    Die Quizshow für die ganze Familie. "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder. Für Vorschulkinder gibt es auf zdftivi.de und in der ZDFtivi-App das Angebot "Moin Piet - Quiz mit Quatsch".
