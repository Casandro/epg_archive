  title: Die Biene Maja
  subtitle: Findet den Schmierfink!
  description: |-
    Findet den Schmierfink!

    Über Nacht hat eine Biene ein lustiges Bild von Richter Bienenwachs auf die Wabenwand gemalt. Der Richter ist beleidigt und will unbedingt herausfinden, wer die Karikatur gemalt hat.

    Da am Abend alle Bienen zur großen Sternschnuppenparty hinaus auf die Wiese fliegen wollen, verhängt der Richter für alle eine Ausgangssperre. So will er erreichen, dass sich der Schuldige oder die Schuldige freiwillig meldet. Doch das funktioniert nicht.

    Maja und Willi finden es sehr ungerecht, dass alle nicht zur Party gehen dürfen, nur weil eine Biene etwas gemacht hat, was dem Richter nicht gefällt. Die beiden nehmen die Überführung des Künstlers in die eigene Hand und finden heraus, dass ihr Mitschüler Theo das Bild gemalt hat. Theo entschuldigt sich, und der Richter hält, was er versprochen hat: Nun dürfen alle Bienen zur Party fliegen - alle, bis auf Theo!

    Das finden Maja und Willi wieder sehr ungerecht, schließlich hat sich Theo entschuldigt. Der Richter lässt sich nicht erweichen, doch ausgerechnet die Wespen kommen Maja, Willi und Theo zu Hilfe und machen es am Ende doch noch möglich, dass auch Theo mit zur Party fliegen darf.
    Regie: Daniel Duda
    Buch/Autor: Pierre Spitzer-Couesnon, Edouard Petit
    Musik: Fabrice Aboulker, Karel Svoboda
