  title: STORY TIME
  subtitle: Hitzewelle - wir kühlen unsere Stadt!
  description: "Hitzewelle - wir kühlen unsere Stadt!\n\nMila und Emelie aus Berlin machen sich große Sorgen, dass es in ihrer Stadt bald zu heiß sein wird, um draußen spielen zu können. \n\nOder um auf der Straße unterwegs zu sein, zu Fuß, mit dem Rad, da wo kein Schatten ist. Denn dass es heißer wird, bilden sie sich nicht ein! Sie sehen, wie sich Grünflächen, Bäume und Pflanzen, verändern, viel \"Durst\" haben. Die Mädchen fragen sich, wie sie die Natur in den heißen Monaten schützen und erhalten können. \n\nWas muss in Berlin unternommen werden, um alle, die dort leben, vor den schlimmen Folgen eines Hitzesommers und dem Extremwetter zu schützen? Was können sie selbst und andere Kinder tun? Statt tatenlos zuzusehen, gehen Mila und Emelie auf die Suche nach Ideen und Lösungen für eine kühlere Stadt.\nRegie: Bernadette Hauke, Christian Fussenegger\nKamera: Christian Fussenegger\n\nHD-Produktion"
