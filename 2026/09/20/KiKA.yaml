  title: POV - Deine Geschichte zählt
  subtitle: Dose auf, Kopf frei - Wie ich mit Graffiti sichtbar werde
  description: |-
    Gesellschaftspolitisches Reportagemagazin

    Dose auf, Kopf frei - Wie ich mit Graffiti sichtbar werde

    Lucy sprüht seit drei Jahren Graffiti in Berlin und kennt die Szene inzwischen wie ihre Westentasche. Sie weiß, wer welches Graffiti gesprüht hat und kennt die Geschichten hinter den Bildern. Doch wie wird aus der ersten Faszination ein echtes Hobby? Wo fängt man an, wenn man selbst sprühen will? Und kann aus der Leidenschaft sogar ein Beruf werden?

    Bei "POV - Deine Geschichte zählt" begleitet Kiki Lucy durch Berlin und taucht mit ihr in eine Welt ein, die für viele fremd ist - und auf den ersten Blick für manche gar nicht nach Kunst aussieht. Gemeinsam erleben sie, was es bedeutet, eine leere Wand in die eigene Leinwand zu verwandeln. Es geht um Kreativität, Technik und das Gefühl, seine eigene Kunst mitten in die Stadt zu bringen.
