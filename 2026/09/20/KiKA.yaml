  title: Anna und die wilden Tiere
  subtitle: Das Geheimnis der Blattschneideameisen
  description: |-
    Das Geheimnis der Blattschneideameisen

    Wer Ordnung, Disziplin und Fleiß im Tierreich sucht, der sollte das Volk der Blattschneiderameisen unter die Lupe nehmen. Das macht Anna in der heutigen Sendung und besucht in Brasilien mit Biologin Lydia eine ganze Stadt mit diesen emsigen Insekten. Schnell stellt sie fest: hier haben die Weibchen das Sagen - Männchen, also die Drohnen, sind Mangelware.

    Der Staat ist streng organisiert: ganz oben thront die Königin und sorgt nach dem Hochzeitsflug für Nachwuchs. Dann, aber nur dann, dürfen auch die Männchen ran. Der Großteil des Volkes besteht aus Arbeiterinnen. Die großen Soldatinnen mit ihren gewaltigen Beißwerkzeugen verteidigen das Volk gegen Feinde. Kleinere Ameisen schneiden Blätter und Blüten und tragen sie im Gänsemarsch in ihren Bau. Unter der Erde hüten die Insekten ihr Geheimnis: endlose Tunnel führen zu Hunderten von Kammern, in denen die Ameisen einen Pilz züchten. Dieser Pilz, und nicht etwa die Blätter, ist nämlich die eigentliche Nahrung der Blattschneiderameisen.

    Zusammen mit Lydia und den fleißigen Insekten macht die Tierreporterin lustige Experimente. Sie findet heraus, welche geometrische Blattform den Ameisen am Besten gefällt. Sogar Annas präparierte Papierschnipsel unterscheiden die cleveren Tiere von echten Blättern und tragen sie dahin, wo sie hingehören: auf die Müllhalde - die gibt es in der Stadt der Blattschneiderameisen natürlich auch.
    Moderation: "Anna" Annika Preil
