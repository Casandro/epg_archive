  title: Team Timster
  subtitle: WhatsApp-Check! Chats, Kanäle, Tricks
  description: |-
    WhatsApp-Check! Chats, Kanäle, Tricks

    Sticker verschicken, Sprachis aufnehmen oder schnell den Klassenchat checken - für viele Kinder und Jugendliche gehört WhatsApp zum Alltag. Doch was steckt hinter der App? Wie funktionieren WhatsApp-Kanäle? Was hat es mit Meta AI auf sich? Und warum ist WhatsApp offiziell erst ab 13 Jahren erlaubt? Diese und viele weitere Kinderfragen beantwortet Tim in der neuen "Team Timster" Folge. Unterstützung bekommt er dabei von der Klasse FM des Johannes Brahms-Gymnasiums in Pinneberg, die ihre besten WhatsApp-Hacks zeigt - von selbstgemachten Stickern bis zu versteckten Funktionen. Außerdem geht Tim auf eine WhatsApp-Schnitzeljagd durch Hamburg, trifft beim Social Media Team der Tagesschau die Macher hinter den WhatsApp-Kanälen. Er spricht mit Medienexpertin Kira Thiel darüber, worauf Kinder beim Chatten und Teilen achten sollten. Warum nutzen ausgerechnet Computerprofis gar kein WhatsApp? Dieser Frage geht Tim beim Chaos Computer Club nach und erfährt, warum Datenschutz für Messenger-Dienste so wichtig ist. Ob Klassenchat, Meta AI, Kanäle oder Datenschutz - "Team Timster" zeigt, welche Möglichkeiten WhatsApp bietet, welche Funktionen richtig praktisch sind und worauf Kinder beim Chatten achten sollten.
    Moderation: Tim Gailus, Soraya Jamal

