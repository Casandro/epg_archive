  title: Die Biene Maja
  subtitle: Kurt und Ben reicht es
  description: |-
    Kurt und Ben reicht es

    Der Höhleneingang von Max wird wieder von einem Mistball versperrt. Er ist sauer und hat genug davon, nicht in seine Höhle hinein oder noch schlimmer, nicht mehr hinaus zu kommen.

    Auf einer Versammlung mit den anderen Insekten beschwert sich Max über die Mistbälle, die eine Gefahr für die Wiese darstellen. Maja versucht allen klarzumachen, dass die Mistkäfer eine wichtige Aufgabe für die Wiese erfüllen, sie räumen nämlich jeden Müll weg.

    Andere Insekten wie Rufus und Lara stimmen aber in die Beschwerde ein, und als sogar Paul gegen die Mistbälle wettert, wird beschlossen, dass Ben und Kurt zur Sicherheit aller das Mistrollen einstellen sollen. Schon bald stinkt es auf der Wiese zum Himmel und die Insekten wollen, dass Kurt und Ben ihre Arbeit wieder aufnehmen, doch die beiden sind sehr beleidigt. Sie verlangen eine umfassende Entschuldigung, die sie zu den wichtigsten Insekten der Wiese erklärt.
    Regie: Daniel Duda
    Buch/Autor: Pierre Spitzer-Couesnon, Edouard Petit
    Musik: Fabrice Aboulker, Karel Svoboda
