    Eine laute Knallerei

    Im Mäusehaus sind laute Knallgeräusche zu hören. Alle Bewohner des Hauses sind irritiert. Auch Sam und Julia, die sich neugierig aufmachen, die Ursache der lauten Geräusche herauszufinden.

    Julia meint, das Knallen würde sich anhören wie damals der Vulkan auf ihrer Insel. Aber es gibt keinen Vulkan in der Nähe. Ein Feuerwerk kann es tagsüber auch nicht sein. Als Sam und Julia dem Geräusch hinterhergehen, führt sie der Weg zu Oma Goudas Wohnung.
