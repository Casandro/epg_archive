  title: Team Timster
  subtitle: 'Weltkindertag: Natur, Tiere, Umwelt'
  description: |-
    Weltkindertag: Natur, Tiere, Umwelt

    Der Weltkindertag bei KiKA steht unter dem Motto: Natur, Tiere, Umwelt. Dafür hat sich der KiKA-Kinderredaktionsrat mit Hilfe aller Zuschauerinnen und Zuschauer entschieden. Sie haben außerdem entschieden, worum es in dieser Team Timster Folge gehen soll. Vor Ort sind dafür Johanna und Margarete. Sie möchten, dass passend zum Thema Umwelt, Finns Frage beantwortet werden soll. Er ist 11 Jahre alt und möchte wissen, warum künstliche Intelligenz benutzt wird, wenn sie doch so viel Wasser verbraucht. Für das Thema Natur haben Jonanna und Margaret den Buchtipp "Ein Mädchen namens Willow" ausgesucht. Wie man Tiere in der Stadt am besten fotografieren kann, wird in einem weiteren Beitrag erklärt. Auch in dieser Folge Team Timster darf ein Spieletipp nicht fehlen. Den haben die beiden Mitglieder des KiKA-Kinderredaktionsrates mitbracht: ihr Lieblingsspiel "Animal Crossing". Der Weltkindertag bei Team Timster: von Kindern für Kinder.
    Moderation: Tim Gailus, Soraya Jamal

