  subtitle: Dziennikarze Kanału Zero są na miejscu najważniejszych wydarzeń, jak również odkrywają nieznane sprawy sprzed lat.
  description: |-
    Tytuł oryginalny: Reportaż
    PL, 2025
    Dziennikarze Kanału Zero są na miejscu najważniejszych wydarzeń, jak również odkrywają nieznane sprawy sprzed lat. Nasi dziennikarze byli na granicy polsko-białoruskiej, w Izraelu, Ukrainie czy Naddniestrzu, opowiadając ludzkie historie. Ciekawi ludzie, ważne wydarzenia i tragedie ludzkie. Nasze reportaże i dokumenty pokazują rzeczywistość taką, jaka ona jest.
