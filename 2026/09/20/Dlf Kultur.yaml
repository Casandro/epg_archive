    Im Zentrum seht John Field, der ?Vater der Nocturne?. Um den ?drunken John? ranken sich nicht nur spektakuläre Erlebnisse und ein zweifelhafter Ruf als Trunkenbold und Lebemann. Vor allem war er der Erfinder neuer Konzertformate und Klaviertechniken. Die beiden Pianisten Paolo Restani und Tyler Hay haben sich intensiv mit Fields Schaffen auseinandergesetzt und präsentieren eine Reihe seiner Nocturnes, Sonaten und Salonstücke zusammen mit den 7 Klavierkonzerten.
