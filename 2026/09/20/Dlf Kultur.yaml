  title: Plus Eins
  description: "?Du musst besser sein als der weiße deutsche Mann?\n\nCaro Korneli im Gespräch mit Nazli Esfahani-Bayerl\n\nBestnoten in der Schule, am Nachmittag Ballett, Schwimmen, Klavier und Persisch-Unterricht: Es ging viel um Leistung während der Kindheit und Jugend von Nazli Esfahani-Bayerl. Familiäre Anforderungen zu erfüllen und den Wunsch nach persönlicher Freiheit zusammenzubringen, stellte sie oft vor große Herausforderungen. Sie hat gelernt, ihre chronische Erkrankung zu vereinbaren mit der Arbeit als Ärztin und gefragter Expertin.\n\nEin Klima-Aktivist verzweifelt: Aufhören zu kämpfen? \n\nCaro Korneli im Gespräch mit Tini v. Poser\n(Wdh. v. 17.09.2023)\n\nAls Klimaaktivist widmete Tadzio Müller sein Leben dem Kampf für eine gerechtere Welt. 2015 erlebt er die beginnende Klimabewegung mit Euphorie und Tatendrang. Doch als die Politik nicht mitzieht, hat er das Gefühl persönlich zu scheitern. Tadzio gerät in eine Depression und muss sich neu mit der Motivation und dem Ziel seines Aktivismus auseinandersetzen.\n11:00-11:05 Nachrichten"
