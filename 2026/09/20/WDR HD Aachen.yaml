  title: Heiter bis tödlich - Henker & Richter (10)
  subtitle: Der Sheriff
  description: |-
    Den Spitznamen "Sheriff" hat sich der passionierte Hobby-Denunziant Ernst-Otto Precht redlich verdient, denn kein Büdringhausener Falschparker oder Im-Park-Fußball-Spieler ist vor ihm sicher.
    Und so hält sich die  Anteilnahme in Grenzen, als der "Sheriff" eines Tages spurlos verschwindet. Doch kurze Zeit später tauchen Drohungen, blutige Voodoo-Puppen und  schließlich Prechts verlassener Wagen auf - bei Prechts Ehefrau liegen die  Nerven blank. In Büdringhausen hätte so ziemlich jeder ein Motiv - inklusive Richter Wagenführ, dessen Fußballdamen schon den einen oder anderen Ball in Prechts Garten befördert haben.
