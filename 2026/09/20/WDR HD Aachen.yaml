  title: 'Erlebnis Erde: Unsere Wälder (3/3)'
  subtitle: Zurück in die Zukunft
  description: In der letzten Folge seiner dreiteiligen Serie UNSERE WÄLDER berichtet Naturfilmer Jan Haft wie sich aus vermeintlicher Zerstörung und einem Blick in die Vergangenheit Konzepte für die Wälder der Zukunft entwickeln lassen. Allen voran, die Waldweide, eine uralte Form der Landnutzung. Der Film ist ein Plädoyer für die Rückkehr der großen Pflanzenfresser wie Wisent, wilde Pferde oder Rinder. Sie schaffen wichtige Voraussetzungen, damit unsere Wälder für die Zukunft gut gerüstet sind und sorgen dafür, dass Lichtungen entstehen und die Artenvielfalt sprunghaft ansteigt.
