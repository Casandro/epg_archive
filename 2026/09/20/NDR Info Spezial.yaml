  title: Zwischen Hamburg und Haiti
  subtitle: Einfach mehr chillen? Dänemarks Popkultursommer
  description: 'Im Sommer wird Kopenhagen zum Outdoor-Wohnzimmer Nordeuropas: Parks, Schlossgärten und Straßen werden zu Bühnen für Kunst, Musik und Kultur. Beim Kopenhagen Jazz Festival spielen internationale und lokale Künstler in ungewöhnlichen Locations. Weiter geht es auf die Färöer-Inseln zum G! Festival, wo Popkultur auf Wikingertradition trifft. Zwischen LGBTQ-Szene und Traditionalisten zeigt sich, wie Gegensätze aufeinandertreffen und ein gemeinsames Festival verbinden kann. Autor Max-Marian Unger war über einen Monat in Kopenhagen und auf den Färöern unterwegs.'
