  title: Slejvák
  description: Flexybabka i Spicy Pája budou bojovat v novém bizarním zápasovém formátu. Vilma s Mírou rozebírají vývoj tohoto konceptu a ptají se, jestli už narazil na absolutní dno. Mnohem víc je ale zaujal Troye Sivan a Nicole Kidman, které v současné době nelze na internetu uniknout. Jaké nové sitcomy se vyplatí sledovat a jak si pamatujeme odkaz legendární Dolly Parton? Poslouchejte nový Slejvák a pokud máte na prstech vytetovaný knírek, jste rozhodně ikona týdne! Moderují Vilma Svobodová a Miroslav Harant. (repríza)
