  title: Casablanca
  description: Cestovatel a ultraběžec Jan Rendl se vydal oběhnout jezero Titicaca. Nejdřív putoval po peruánských horách, kolem slavného jezera v nadmořské výšce přes 3800 metrů pak běh začal na bolívijské straně. Jaké zážitky mu to přineslo? Jak se srovnával s tím, že okruh těsně před koncem musel vzdát? Poslechněte jeho vyprávění v rozhovoru s Pavlem Sladkým v cestovatelském podcastu Radia Wave Casablanca. Moderuje Pavel Sladký.
