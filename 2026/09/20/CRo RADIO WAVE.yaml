  title: Hergot!
  description: Hostem Hergot!u bude básník a slamer Sufian Massalema, autor sbírky Možnosti přehlíženého, nominované na Cenu Jiřího Ortena. Mluvit budeme o tom, jak se v jeho poezii potkávají víra, rodinné kořeny na Blízkém východě, česká zkušenost a hledání vlastní identity. Zajímat nás bude také jeho vztah k islámu, proměny víry a to, jak se duchovní zkušenost propisuje do poezie i každodenního života. (repríza)
