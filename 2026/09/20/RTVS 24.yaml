  title: Občan za dverami (22)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Rozhodnutie zmeniť zdravotnú poisťovňu robíme väčšinou s vidinou lepších benefitov či kvalitnejšej starostlivosti. V prípade pani Lucie z Vasiľova, ktorá trpí raritným metabolickým ochorením, sa však toto rozhodnutie zmenilo na boj o prežitie.... Dar reči a herecký talent predurčujú človeka na úspech nielen v umení, ale aj v stavebníctve. Pán Róbert z Banskej Štiavnice na jedného takéto natrafil. O svojich kvalitách ho presvedčil natoľko, že mu zveril rekonštrukciu podkrovia svojho rodinného domu. No ako sa čoskoro ukázalo, bola to chyba... Natrafili ste na tovar, ku ktorému predajca pridáva darček zdarma. No nekúp to! Premýšľali ste ale niekedy nad tým, čo sa stane, keď sa vám pokazí práve ten darček? Stalo sa to aj pani Ivete. K novému kočíku za takmer tisíc eur dostala zdarma autosedačku. A práve tá sa pokazila. Predajca i dodávateľ sú presvedčení, že problém vyriešili správne. Advokátka, ale aj Slovenská obchodná inšpekcia to však vidia diametrálne odlišne... (2026)
