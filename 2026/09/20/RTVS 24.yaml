  subtitle: Špeciál s Martinom Lettrichom. Rozhovor so sochárom Martinom Lettrichom pri príležitosti jeho 75.narodenín.
  description: Rozhovor so sochárom Martinom Lettrichom pri príležitosti jeho 75.narodenín. Martin Lettrich je sochár komorných plastík, aj diel v priestore. Je známy tým, že k sochám a plastikám píše krátke básne a verše. Jeho manželkou je výtvarná teoretička Xénia Lettrichová. O tom, ako sa rozvíjal jeho talent, čím ho inšpiroval jeho otec, známy filmový režisér a ktorými dielami vyzdobil Galériu Statua v Bratislave, kde má výstavu k 75. narodeninám sa s ním pozhovárala moderátorka Gabika Pirošková. (2026)
  genre:
