  title: Reportéri (21)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: BEZ ZUBOV A V DLHOCH:Stratené zuby, diery v kostiach a hnisavé ďasná. Takéto komplikácie opisujú pacienti údajného zubára Hovika Nazaretyana. Pred tromi rokmi sme odhalili jeho kliniku, kde podľa našich zistení ordinoval bez potrebných povolení. Teraz po prvýkrát prehovoria aj jeho pacienti. Ako mohol fungovať celé roky bez zásahu úradov?XXXKEĎ ZÁKLAD NESTAČÍ:Rodičia detí s poruchami učenia často hľadajú pomoc, ktorá by im uľavila od školských problémov. Na Slovensku aj v Česku pôsobia centrá Basic, ktoré sľubujú zlepšenie pomocou študijnej technológie zakladateľa scientologickej cirkvi L. Rona Hubbarda. Učia v nich pritom aj lektori bez špecializovaného vzdelania. Prečo im rodičia dôverujú a aké je prepojenie centier so scientológiou? (2026)
  genre:
  - '32'
- eventId: 1056054
  start: 2026-09-20T12:00:00Z
  stop: 2026-09-20T12:25:00Z
  title: Cez lupu (27)
  subtitle: Komu zverujeme deti s poruchami reči či učenia?. Kauzy, kriminálne prípady, životné situácie, udalosti. Témy, o ktorých je dobré vedieť viac.
  description: Čoraz viac centier ponúka pomoc deťom s poruchami učenia alebo reči. Vieme však, či za dverami takéhoto centra pracuje skutočný odborník, alebo iba človek, ktorý sa za odborníka vydáva? Čo môže dieťaťu spôsobiť, ak sa dostane do rúk človeka bez potrebnej kvalifikácie? (2026)
  genre:
  - '35'
