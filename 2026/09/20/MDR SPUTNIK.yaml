- eventId: 534693
  start: 2026-09-20T20:00:00Z
  stop: 2026-09-20T21:00:00Z
  title: SPUTNIK Roboton
  subtitle: Eine Stunde Elektro
  description: Seit der Synthesizer in den Achtzigern den großen Durchbruch in der Musikwelt schaffte, haben sich unzählige Strömungen elektronischer Musik etabliert. SPUTNIK Roboton liefert für alle Freunde der Electrobeats genau jene Dokumentation zur Entwicklung der Szene - von Elektro-Funk bis Synthie-Pop.
- eventId: 534789
  start: 2026-09-20T21:00:00Z
  stop: 2026-09-20T22:00:00Z
  title: SPUTNIK Soundcheck
  subtitle: Deine Band im Radio
  description: SPUTNIK Soundcheck ist die Sendung zu den mySPUTNIK-Musikprofilen. Aus der Onlineplattform für neue Künstler und Bands sucht die Musikredaktion jede Woche Highlights heraus und präsentiert sie im Radio. Dazu gibt es Interviews, Reportagen aus Proberäumen und von Konzerten, sowie Konzerttermine.
- eventId: 534790
  start: 2026-09-20T22:00:00Z
  stop: 2026-09-20T23:00:00Z
  title: SPUTNIK Rock It
  description: Sechs Saiten, Stecker rein, Lautstärke auf 10 und einmal kräftig durchziehen. SPUTNIK Rock It spielt zu genau diesem Lebensgefühl Hits und schweißtreibende Live-Mitschnitte von Konzerten und Festivals. Laut, dreckig, impulsiv, treibend. kurz Rock'n'Roll.
