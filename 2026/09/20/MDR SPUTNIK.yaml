- eventId: 543978
  start: 2026-09-20T01:00:00Z
  stop: 2026-09-20T04:00:00Z
  title: Junge Nacht der ARD
  description: "Die junge Nacht der ARD ist gestartet. \nDamit machen die jungen Wellen der ARD gemeinsame Sache und bringen euch erstmals mit einem gemeinsamen Nachtprogramm durch die Nacht.\n\nIn dem neuen bundesweiten Angebot schieben unsere Moderator*innen die Nachtschicht, bieten viel Musik und alles aus Pop, Comedy und Info. Sie talken mit allen, die nicht ins Bett kommen oder keinen Schlaf finden.\n\n\"Die junge Nacht der ARD\" wird von 1LIVE aus Köln gesendet und von den jungen Wellen N-JOY (NDR), DASDING (SWR), Fritz (RBB), SPUTNIK (MDR), YOU FM (HR) und UNSERDING (SR) übernommen.\n\nZusammen wach sein!\n\nGemeinsam bleibt man besser wach. Deshalb freuen wir uns, wenn ihr mitmacht. Schickt unseren Moderator*innen eine Mail ins Studio an jungenacht@ard.de oder schreibt eine WhatsApp-Nachricht!\nWir freuen uns auf eure Nachrichten unter der Nummer 0221-56789111. Bitte schreibt uns immer euren Vornamen und euren Wohnort dazu."
- eventId: 544100
  start: 2026-09-20T04:00:00Z
  stop: 2026-09-20T06:00:00Z
  title: SPUTNIK Deine Lieblingsmusik
  subtitle: Deine Musik im Radio
  description: Tracks, Tracks, Tracks. Alles, was nicht gerade vom Top-40-Rotationsprinzip tot gespielt wird oder im Kaufhaus hoch- und runterdudelt, läuft hier Stück an Stück ohne Unterbrechung.
- eventId: 544250
  start: 2026-09-20T06:00:00Z
  stop: 2026-09-20T17:00:00Z
  title: SPUTNIK Dein Wochenende
  description: 'Das Begleitprogramm zum Sonntagsfrühstück: Entspannte Vormittagsunterhaltung mit den wichtigsten News des Tages und Geschehnissen vom Morgen, dazu Tipps für einen gelungenen Sonntag. Eure Lieblingsmusik als Sonntagssoundtrack versteht sich von selbst!'
- eventId: 531928
  start: 2026-09-20T17:00:00Z
  stop: 2026-09-20T19:00:00Z
  title: Radio mit K / SPUTNIK Deine Lieblingsmusik
  description: Jeden vierten Sonntag im Monat übernehmen Felix und Steffen von Kraftklub das SPUTNIK-Studio. Sie reden über Banales und Wichtiges, mal mit Gästen, mal ohne. Immer aber bringen sie ihre ganz persönlichen Top 5-Songs des Monats mit.
