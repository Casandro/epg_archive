  title: Die 12. SS-Panzerdivision ''Hitlerjugend''
  subtitle: Die 12. SS-Panzerdivision ''Hitlerjugend''
  description: Die Geschichte der 12. SS-Panzerdivision "Hitlerjugend" beginnt im Jahr 1943. Eine Truppe von 20.000 jungen deutschen Rekruten kommt in der Normandie zum Einsatz, wo die Westalliierten im Juni 1944 landen. Die meisten der jungen Männer sind nicht älter als 17 und im NS-Staat aufgewachsen. Sie haben seine Ideologie verinnerlicht, sind fanatisch und bereit, für Hitler zu kämpfen und zu sterben. Einige begehen grausame Morde. Die Hälfte von ihnen wird den Krieg nicht überleben.
