  title: Hindenburg - Die letzten Geheimnisse (2)
  subtitle: Hindenburg - Die letzten Geheimnisse (2)
  description: Seit dem Absturz der Hindenburg vor über 85 Jahren versuchen Expertinnen und Experten die Rätsel um den Vorfall zu lösen. Deutsche Ermittlungskräfte befragten noch am Absturzort Augenzeugen, studierten Wetterkarten und führten Experimente und Befragungen durch. War es tatsächlich ein Unfall, oder brachte Sabotage das damals größte gebaute Luftschiff zum Abstürzen? Die Dokumentation enthüllt neue Theorien, und zeigt lange verschollenes Filmmaterial, Augenzeugenberichte und Dokumente.
