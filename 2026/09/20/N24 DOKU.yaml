  description: Ein Schloss in Polen, auf das Hitler ein Auge hatte. Versteckt sich in den Felsen darunter ein verschollener Zug, gefüllt mit Nazi-Gold? Ein Schatzjäger ortet verdächtige Hinweise. Ein Luxusanwesen in Atlanta, erbaut von einem Coca-Cola-Erben für Feste und Zaubershows, die kein Glück brachten. Dazu ein libanesisches Luxushotel - Treffpunkt der politischen Elite, verwüstet im Bürgerkrieg. Und eine Prachtvilla in Irland, die, samt ihrem gehassten Besitzer, in den Flammen einer Rebellion unterging.
