  subtitle: Pohádky o potrestaném zlu a odměněné dobrotě - Jak hastrman Čvácha ucítil v kostech velkou vodu
  description: 'Autor: Milan Kynčl; Interpret: vypravěč - Magda Hauserová, hastrman Čvácha- Dušan Baur, mlynář - Vladimír Kintr, mlynář Kopejtko - Milan Kynčl, mlynářka - Irena Kintrová, rak Žouželka - Václav Ambrož; Premiéra: 18.12.2011 * Dnes se dozvíme, jak laskavému mlynáři pomohl hastrman, když hrozila povodeň. A také jak dopadl druhý mlynář, který myslel jen na svůj prospěch a nedal si poradit. No ano, vždyť tohle jsou "Pohádky o potrestaném zlu a odměněné dobrotě!"http://junior.proglas.cz/detail-clanku/jak-hastrman-cvacha-ucitil-v-kostech-velkou-vodu.html'
