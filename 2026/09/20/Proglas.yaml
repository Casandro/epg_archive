  title: Studna slova (Rádio 7)
  subtitle: 1. Korintským - Měřítko svobody (90. díl)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková * Jak poznat, kdy svou svobodu využít a kdy se jí z lásky k druhému vzdát? Apoštol Pavel se v závěru 10. kapitoly 1. listu Korintským znovu vrací k otázce masa obětovaného modlám a ukazuje, že rozhodujícím měřítkem našeho jednání není jen to, co smíme, ale také co prospívá druhým a co přináší slávu Bohu. Kazatel Jiří Hurta se ve svém praktickém výkladu podrobněji věnuje otázce, co je měřítkem našeho rozhodování a jednání.'
