- eventId: 834248
  start: 2026-09-20T03:30:00Z
  stop: 2026-09-20T03:57:00Z
  title: Knihovnička
  subtitle: Tvorba Petry Klabouchové
  description: 'Autor a interpret: Iva Horká; Premiéra: 19.9.2026 * Když se řekne Petra Klabouchová, většině čtenářů se dnes vybaví především Šumava. Ne ta turistická, zalitá sluncem, ale Šumava drsná, tajemná, plná zapomenutých příběhů, starých křivd a míst, kde minulost nikdy úplně neumřela. Přitom sama autorka začínala zcela jinak. Vystudovala žurnalistiku, pracovala v médiích a dnes se kromě psaní věnuje také hudebnímu průmyslu. Právě zkušenost novinářky je v jejích knihách znát ? její příběhy totiž nestojí jen na fantazii, ale velmi často na pečlivém pátrání v archivech, kronikách a skutečných historických událostech.V dnešní Knihovničce autorka pořadu Iva Horká představí její tvorbu a přidá také úryvek z románu Vona.'
- eventId: 834250
  start: 2026-09-20T03:57:00Z
  stop: 2026-09-20T04:00:00Z
  title: Myšlenka na den
  subtitle: Pro Boha není nikdy pozdě
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 26.9.2023 * Drazí bratři a sestry, dobrý den!Evangelium nám předkládá překvapivé podobenství: majitel vinice chodí od časného rozbřesku až do večera povolávat některé avá naše zásluhy, ale miluje nás jako děti.Zastavme se u dvou Božích činů, které z příběhu vyplývají. Zaprvé, Bůh vychází v každou hodinu, aby nás zavolal; zadruhé, každému se odměňuje stejnou "mincí".Za prvé, Bůh je ten, kdo vychází v každou hodinu, aby nás volal. V podobenství jsou dělníky nejen lidé, ale především Bůh, který vychází celý den, aniž by se unavil. Takový je Bůh: nečeká na naše úsilí, aby k nám přišel, neprovádí zkoušku, aby zhodnotil naše zásluhy, než nás vyhledá, nevzdává se, když se opozdíme s odpovědí; naopak, sám má iniciativu; v Ježíši k nám "vyšel", aby nám ukázal svou lásku. A hledá nás ve všech denních dobách, které, jak uvádí svatý Řehoř Veliký, představují různé etapy a období našeho života až do stáří (srov. Homilie na evangelium, 19). Jeho srdce se totiž nikdy neopozdí, stále nás hledá a čeká na nás. Nezapomínejme na to: Hospodin nás vždy hledá a čeká na nás, vždy!Právě proto, že má tak široké srdce, Bůh - to je druhý čin - oplácí každému stejnou "mincí", kterou je jeho láska. Zde je hlavní smysl podobenství: dělníci poslední hodiny jsou placeni stejně jako ti první, protože ve skutečnosti je Boží spravedlnost vyšší. Jde dál. Lidská spravedlnost říká "dát každému, co si zaslouží", zatímco Boží spravedlnost neměří lásku na vahách našich výnosů, našich výkonů nebo našich selhání: Bůh nás prostě miluje, miluje nás proto, že jsme děti, a činí tak bezpodmínečnou láskou, láskou bezplatnou.Kéž nám Panna Maria pomůže, abychom se obrátili k Boží míře, k lásce bez míry.PAPEŽ FRANTIŠEK                                                               Přeložila česká redakce vatikánských médií, krátil Martin Holík Celý text: https://www.vaticannews.va/cs/papez/news/2023-09/angelus-24-9-23.html'
