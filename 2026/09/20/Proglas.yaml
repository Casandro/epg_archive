  description: 'Autor: Antonín Žolnerčík; Interpret: Tomáš Kalus, Markéta Velká; Premiéra: 16.9.2026 * V České republice se nachází více než 30 obcí s názvem Lhotka. Ovšem pouze v jediné z nich, ve Lhotce pod Ondřejníkem, se již po několik desetiletí koná festival s názvem Sochovy národopisné slavnosti. Redaktor Antonín Žolnerčík si k mikrofonu pozval nejen ředitele festivalu Tomáše Kaluse, ale i programovou vedoucí Markétu Velkou. '
- eventId: 863872
