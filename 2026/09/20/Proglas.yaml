  title: Z archivu hudebních pořadů
  subtitle: S Petrem Linhartem o albu Šénau
  description: 'Autor: Milan Tesař; Interpret: Petr Linhart; Premiéra: 27.7.2026 * Písničkář Petr Linhart představí své nové album Šénau. Podobně jako na předchozích deskách se i tentokrát inspiruje krajinou českého pohraničí, ale v několika písňových textech zavítá i do Brna. Vysvětlí, proč desku pojmenoval podle teplické čtvrti Šanov a jak to souvisí s jeho prvními setkáními s hudbou obecně a konkrétně s Beatles. Řeč bude také o skutečných příbězích, které se proměnily v písně, od španělských školaček v tichém oddílu vlaku až po přízračného výpravčího na zaniklé výhybně v Brně-Husovicích. A také o stárnoucím Facebooku. [bítls] [fejsbuku]'
  genre:
  - '96'
