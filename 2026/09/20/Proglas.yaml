  stop: 2026-09-20T23:00:00Z
  title: Radioreport
  subtitle: pOODcast ostravsko-opavské diecéze - biskup Martin David
  description: 'Autor: Monika Pustovková; Interpret: Martin David; Premiéra: 17.9.2026 * Hostem prvního dílu je ostravsko-opavský biskup Martin David. S nadsázkou o sobě říká, že je "štramberské ucho". V rozhovoru se třeba dozvíte, že jej Bůh povolal v době, kdy pracoval v kopřivnické Tatře. Jak vypadá práce biskupa v dnešní době? K jaké bláznivé věci se nechal přesvědčit? Přijal by pozvání do taneční show Stardance? Jaký dárek mu udělá radost? Má spočítáno, kolik vlastní biskupských atributů - berel a miter? A co mu pomáhá udržet si nadhled?pOODcast ostravsko-opavské diecéze'
