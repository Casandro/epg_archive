  description: Ein Missionar, der sich für minderjährige Prostituierte auf den Philippinen einsetzt, ein anderer der für die Rechte der Urbevölkerung einer Insel im Pazifik kämpft, ein weiterer, der Asylbewerbern in Deutschland Kirchenasyl gewährt. Begleitet wurden sie und viele andere Steyler Missionare durch das Kamerateam von steyl medien - auf allen Kontinenten dieser Welt. Dabei entstanden die mittlerweile über 50 Episoden der Serie "grenzenlos'.
