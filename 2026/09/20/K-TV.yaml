  title: Auf den Spuren von Thomas von Aquin in Köln (Teil 3)
  subtitle: Dokumentation
  description: 'Das Wort Gottes und Aristoteles: Die Quellen des Thomas von Aquin und das "kölnische Erbe". Ein Kreuz aus der ehemaligen Kölner Dominikanerkirche, vor dem Thomas wahrscheinlich gebetet hat, erinnert an den ersten Impuls, der ihn zum  Eintritt in den Predigerorden bewegte: es war der Wunsch, Christus in seiner Armut und Niederigkeit nachzufolgen. Von der elementaren Bedeutung der Heiligen Schrift für Lebensform und Tätigkeit der Dominikaner zeugt das jüngere Bibelfenster im Kölner Dom. Als "kölnisches Erbe" wird Thomas vor allem die Auslegung der Ethik des Aristoteles durch Albert begleiten. Sie lehrt die Tugenden als Weg für das menschliche Streben nach Glückseligkeit. Dritter von drei Teilen.'
- eventId: 965647
  start: 2026-09-20T19:00:00Z
  stop: 2026-09-20T20:00:00Z
  title: Lourdes - Geheimnis der Kirche
  subtitle: Dokumentation
  description: In Lourdes bittet die Erscheinung die heilige Bernadette, zum Ortspfarrer zu gehen und ihm zu sagen, sie wünsche hier den Bau einer Kapelle. Damit macht die Gottesmutter Maria deutlich, dass es in Lourdes nicht um sie geht. Es geht um Christus, dem die Gläubigen in der Kirche begegnen können.
