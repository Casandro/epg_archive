  subtitle: 'TOK TOK S14 E15. Wat was er eerder: de kip of het ei? Eén ding is zeker: kippen zijn overal. Van een Spaans dorp vol scharrelkippen tot een kipfluencer in Hongkong en therapeutisch getok in Frankrijk.'
  description: 'Wat was er eerder: de kip of het ei? Over die vraag zijn de meningen verdeeld, maar één ding is zeker: kippen zijn overal. In een Spaans kustdorp scharrelen ze tussen de toeristen, maar ineens lijken er kippen te verdwijnen. Buurtbewoner Joana gaat op onderzoek uit. In Hongkong verkoopt Moon als kipfluencer levende en geslachte kippen via livestreams aan drukke stadsbewoners. En in een Frans verzorgingstehuis zijn kippen geen voedsel, maar therapie: ze helpen mensen met Alzheimer ontspannen en herinneringen ophalen. (2026)'
