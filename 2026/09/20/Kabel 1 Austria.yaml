    Infotainment, D 2026
    Altersfreigabe: ab 6
  description: |-
    Moderation: Peter Giesel

    Positano, Dubrovnik, Venedig - traumhaft schön und hoffnungslos überlaufen. Überfüllte Gassen, Schlangen ohne Ende, Preise, die den Urlaub teuer machen: Massentourismus hat Europas schönste Städte fest im Griff. Doch es geht auch anders. Peter Giesel trifft Einheimische, die noch wissen, wann die Gassen leer sind, wo man ohne Gedränge isst und das echte Lebensgefühl spürt - und zeigt, wie man diese Traumziele bereist, ohne im Touristenstrudel zu versinken.
