- eventId: 544096
  start: 2026-09-20T04:00:00Z
  stop: 2026-09-20T08:00:00Z
  title: MDR KULTUR am Sonntagmorgen
  description: "* 06:15 Uhr - PODCAST Bachkantate\n\n* 06:30 Uhr - Bach-Kantate (Folge 189): 16. Sonntag nach Trinitatis\nKomm, du süße Todesstunde BWV 161\nMatthew White, Countertenor, Hans Jörg Mammel, Tenor\nCollegium Vocale Gent\nPhilippe Herreweghe\nHarmonia mundi France\n\n* 07:15 Uhr - Wort zum Tag\n\n* 07:45 Uhr - Wortschätze: \"Unverhofftes Wiedersehen\" von Johann Peter Hebel\nDer Sohn eines süddeutschen Dieners überblickte einen weiten Horizont: Johann Peter Hebel war Lehrer, Prediger und Botaniker. Nach ihm wurde sogar eine Lilie benannt. Seine Arbeit für den \"Rheinischen Hausfreund\" verschaffte ihm einen Stammplatz im Orchester der Weltliteratur. Denn der protestantische Theologe aus dem Schwarzwald war ein Menschenfreund, der das Zerrissene und Verworrene dieser Welt nicht leugnen musste und trotzdem nicht an das Böse schlechthin glaubte.\nSchon Goethe hatte Hebel einen \"eigenen Platz auf dem deutschen Parnaß\" angeboten. Und der Philosoph Ernst Bloch hat für eine kurze Erzählung mit dem Titel \"Unverhofftes Wiedersehn\" einen besonders hohen Rang auf dem Siegertreppchen reserviert. Er sprach von der \"schönsten Geschichte der Welt\". Und die ist unser Wortschatz heute - zwei Tage, bevor sich der Todestag von Johann Peter Hebel zum 200. Male jährt. Es liest Rosemarie Fendel.\n \n* 08:15 Uhr - Wiedereröffnung Dresdner Synagoge\nWie sehr Jüdinnen und Juden Sachsen bereichert haben und weiter bereichern - das zeigt das Tacheles-Themenjahr seit einigen Monaten im ganzen Freistaat. Anlass für dieses besondere Jahr ist das 100. Jubiläum des Landesverbandes der jüdischen Gemeinden - daran wurde am Mittwoch dieser Woche im sächsischen Landtag mit einem Festakt erinnert. Und schon am Montag war die Dresdner Synagoge am Hasenberg wiedereröffnet worden. Es gibt also Grund zum Feiern - wenn auch nicht ohne Sorgen. Andreas Roth berichtet.\n\n* 08:30 Uhr - Wetter & Verkehr\n\n* 08:45 Uhr - Der Stichtag: 2001 Karl-Eduard von Schnitzler gestorben \nIn der DDR nannte man ihn \"Sudel-Ede: Der Chefkommentator des DDR-Fernsehens, Karl-Eduard von Schnitzler. Der Grund: Schnitzlers Sendung \"Der schwarze Kanal\". In der polemisierte er von 1960 bis 1989 hasserfüllt gegen die \"menschenverachtende\" Bundesrepublik. Kaum ein anderer Journalist der DDR erreichte Schnitzlers Bekanntheitsgrad. Heute vor 25 Jahren starb er im Alter von 83 Jahren. Mit dem Stichtag Ariana Hofmann.\n\n* 08:50 Uhr - Vorschau - Diskurs: Confusion Is Next. Die Nullerjahre - das Jahrzehnt des Umbruchs\nSocial Media und Big Brother, 9/11 und Afghanistan, Doppelte Staatsbürgerschaft und Deutscher Gangster-Rap - Die Nullerjahre boten Brüche und Widersprüche. Der Journalist Jens Balzer hat sich nun diesem Jahrzent gewidmet. Er selbst ist bereits erprobter Analyst früherer Dekaden, 80er und 90er. Jetzt also die Nuller mit dem Buch: \"Confusion Is Next - Das Jahrzehnt des Umbruchs\" (Rowohlt Verlag). Damit liefert er eine detaillierte und pointierte Betrachtung all der Ereignisse zwischen 2000 und 2010. Dabei schafft er es, Verbindungen zwischen großer und kleiner Politik zu ziehen und Kultur und gesellschaftlichen Debatten zu beleuchten und zu erklären. Was hat zum Beispiel \"Der Schuh des Manitu\" (aus dem Jahr 2001) mit der Debatte um die Leitkultur zu tun? 11 Jahre nach der Wiedervereinigung war der Film der erfolgreichste der Nachkriegszeit - eine Parodie der Karl-May-Verfilmungen. Dazu sagt Jens Balzer im MDR KULTUR Diskurs: Schon seit der Karl-May-Bücher, gäbe es eigentlich nichts Deutscheres als Cow"
