  title: 'MDR KULTUR Sonntagsraten: Der Herbst'
  subtitle: Radioquiz von und mit Axel Thielmann
  description: "Am 23. September um 02:05 Uhr beginnt mit dem kalendarischen Herbstanfang ganz offiziell die Jahreszeit zwischen Sommer und Winter. Es ist die Zeit des Blätterfalls, der Erntefeste und der Weinlese. Die Tage und Nächte werden langsam kühl, die letzten Rosen blühen nochmal und die Menschen stellen die Heizungen an. Der Herbst riecht anders, fühlt sich anders an, schmeckt anders als der Sommer. \n\nIm Sonntagsraten laden wir sie also heute ein, zu einem akustischen Herbst-Spaziergang.\n\nBei unseren Rätseln stehen keine wuchtigen Gewinnprämien im Vordergrund, sondern das Vergnügen zuzuhören und mitzumachen. Die Gewinnerin, der Gewinner wird aus all jenen MDR KULTUR-Hörern ermittelt, die die drei heute gestellten Fragen per E-Mail oder über den Postweg richtig beantworten. \n\nAußerdem gibt es ein kleines Rätsel-Extra in der Sendung: In einem der drei Rätsel ist ein Fehler versteckt. Wer den findet, kann noch während der Sendung direkt im MDR KULTUR-Studio unter der Tel.: 0800 55 99 88 4 anrufen und hat so die Chance auf einen Zusatzgewinn. Wer für die Lösung der drei Rätselfragen ein Überraschungspaket gewinnen möchte, sollte online mitmachen unter: sonntagsraten@mdr.de oder per Post an unten stehende Adresse."
- eventId: 544377
  start: 2026-09-20T10:00:00Z
  stop: 2026-09-20T11:00:00Z
  title: MDR KULTUR Café mit Rotraut Susanne Berner
  subtitle: Erfinderin der Wimmelbücher / Eine Sendung von Katharina Lohmeyer/Bremen 2
  description: |-
    Ihre Jahreszeiten-Bücher findet man in fast jeder Arztpraxis und in jedem Kinderzimmer. Rotraut Susanne Berner hat eine bunte Wimmelwelt voller Menschen und Tiere geschaffen, mit der Millionen von Kindern weltweit groß geworden sind. Obwohl sie es damit zu einer der bekanntesten Kinderbuch-Illustratorinnen Deutschlands gebracht und viele Preise erhalten hat, steht sie selbst selten im Rampenlicht. In mehr als 30 Sprachen wurden sie bereits übersetzt  und millionenfach verkauft - die Jahreszeitenwimmelbücher - beginnend mit dem Winter-Wimmelbuch können Kinder durch die Jahreszeiten wimmeln und sogar eine Sommernacht in Wimmlingen erleben. Viele Details können entdeckt und zahlreiche Geschichten erzählt werden, damit helfen die Wimmelbücher beim Spracherwerb und schulen die Konzentration auf spielerische Weise.

    Redaktion für MDR KULTUR: Gabriele Bischoff
- eventId: 544378
  start: 2026-09-20T11:00:00Z
  stop: 2026-09-20T14:00:00Z
  title: MDR KULTUR am Sonntagnachmittag
  description: "* 13:15 Uhr - Rhiannon Giddens \"Hope  Is The Thing With Feathers\"\nWer die Geschichte der US-amerikanischen Musik verstehen will, kommt an Rhiannon Giddens nicht vorbei. Ob als Grammy- und Pulitzer-Preisträgerin, als Banjo-Virtuosin oder Opernkomponistin - die Musikerin aus North Carolina deckt seit zwei Jahrzehnten unermüdlich die afrodiasporischen und indigenen Wurzeln der US-amerikanischen Roots-Musik auf. Auf ihrem neuen Album stellt sich Rhiannon Giddens ganz grundsätzliche Fragen: zu sich als Frau und Künstlerin, zur Musikindustrie allgemein, \"Hope Is the Thing with Feathers\" - und es ist eine Feier des musikalischen Gemeinschaftsgeistes, die in unserer hektischen Zeit wie ein kostbarer Anker wirkt.\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 2001 Karl-Eduard von Schnitzler gestorben \nIn der DDR nannte man ihn \"Sudel-Ede: Der Chefkommentator des DDR-Fernsehens, Karl-Eduard von Schnitzler. Der Grund: Schnitzlers Sendung \"Der schwarze Kanal\". In der polemisierte er von 1960 bis 1989 hasserfüllt gegen die \"menschenverachtende\" Bundesrepublik. Kaum ein anderer Journalist der DDR erreichte Schnitzlers Bekanntheitsgrad. Heute vor 25 Jahren starb er im Alter von 83 Jahren. Mit dem Stichtag Ariana Hofmann.\n\n* 13:55 Uhr - Tanzfest Chemnitz am Sonntag\nIn Chemnitz geht heute das 12. Internationale Tanzfestival \"Tanz Moderne Tanz\" zu Ende. Es wurde viel getanzt, es gab Workshops auch für die Einwohnerinnen und Einwohner - ein Festival für alle. Das Festival endet mit einem ganz besonderen Auftritt in der Fabrik heute Abend - eine Empfehlung von Rico Stehfest.\n\n* 14:15 Uhr - Aktion WERTvoll - Bioregionale Lebensmittel in Kantinen\nRegional, saisonal und möglichst bio - das wünschen sich viele Menschen auch in Kantinen und Mensen. Doch regionale Lebensmittel in großen Mengen in die Gemeinschaftsgastronomie zu bringen, ist gar nicht so einfach. In Leipzig soll genau das mit dem sogenannten WERTvoll-Aktionsgericht gelingen, das nunmehr zum sechsten Mal an den Start geht. Im September machen wieder zahlreiche Küchen bei der Aktion mit - in diesem Jahr erstmals auch die Kantine am Universitätsklinikum Leipzig. Elvira Birgit Speer hat sie besucht. \n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Frankfurter Buchmesse: Leseland Tschechien \nIn drei Wochen wird die Buchmesse in Frankfurt am Main eröffnet. Ehrengast ist dieses Jahr unser Nachbarland Tschechien, ein wirkliches Leseland. Klassiker wie Nemcova, Hasek, Capek oder Hrabal spielen eine große Rolle für die nationale Identität und auch zeitgenössische Autorinnen und Autoren werden verschlungen - mitunter noch auf Papier in der Metro. Oder in einer der vielen öffentlichen Büchereien. Doch auch in Tschechien ist die Lesekultur durch digitale Ablenkung in Gefahr. In der aktuellen Pisa-Studie ist das Land bei der Lesekompetenz abgerutscht, liegt aber immer noch über Deutschland und dem Durchschnitt. Schulen versuchen seit Jahren gegenzusteuern. Dazu nutzen sie ein einzigartiges Werkzeug: Die traditionellen Lesetagebücher, die Schülerinnern und Schüler seit Generationen führen. Inzwischen aber moderner. \n\n* 15:03 Uhr - MDR KULTUR - Diskurs: Confusion Is Next. Die Nullerjahre - das Jahrzehnt des Umbruchs  \nJens Balzer im Gespräch mit Hendryk Proske\nSocial Media und Big Brother, 9/11 und Afghanistan, Doppelte Staatsbürgerschaft und Deutscher Gangster-Rap - Die Nullerjahre boten Brüche und Widersprüche."
- eventId: 544502
  start: 2026-09-20T14:00:00Z
  stop: 2026-09-20T15:00:00Z
  title: Räuberessen
  subtitle: Von Frauke Angel
  description: "Zum Ärger seiner Lehrerin glänzt der zehnjährige Jonne, ein bisher unauffälliger beinahe schüchterne Schüler, neuerdings im Unterricht durch Zuspätkommen, Abwesenheit und schließlich sogar durch totale Leistungsverweigerung. Das macht ihn für seine aufmüpfige Banknachbarin Lou interessant, die ihn einlädt, nach der Schule Zeit mit ihrer Clique zu verbringen. Doch als die Kinder in der City beim Klauen erwischt werden, scheint der Ärger perfekt und Lou zieht sich zurück. Nicht so Jonne. Der legt jetzt erst richtig los. Das nächste Ding fährt er voll gegen die Wand. Und alle dürfen dabei zusehen.\n\nAus der Laudatio der Jury: \"Mit großer erzählerischer Kraft und einem tiefen Verständnis für die Lebenswelt junger Menschen zeigt das Hörspiel, wie viel Veränderung möglich wird, wenn jemand wirklich hinschaut und zuhört. 'Räuberessen' überzeugt durch seine emotionale Klarheit, seine nuancierte Figurenzeichnung und eine Produktion, die das Thema mit Respekt und Wärme hörbar macht.\"\n\nFrauke Angel wurde 1974 geboren. Nach einer Schauspielausbildung spielt sie an deutschen Stadt- und Privattheatern, sowie in renommierten Off-Theater Produktionen, schreibt Bücher und Geschichten. Ihr Kakadu-Kinderhörspiel \"Wir nannten ihn Tüte\" wurde mit dem MDR Kinderhörspielpreis 2020 ausgezeichnet.\n\nRegie: Friederike  Wigger\nKomposition: Andreas Weiser\nProduktion: Deutschlandradio 2025\n\nMitwirkende: \nEliot Karow - Jonne Scheunemann\nLinda Rohrer - Lou\nNele Rosetz - Romy Scheunemann\nLou Strenger - Franzi\nLasse Pantel - Wolfi\nVeronika Bachfischer - Frau Keil\nBernd Moss - Herr Wirts\nTonio Arango - Detektiv\nTilla Kratochwil - Frau Pietsch\nTalin Lopez - Polizist"
