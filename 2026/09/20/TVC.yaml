  title: Ludzkość - historia nas wszystkich 1 (odc. 5)
  subtitle: Dżyngis-chan, najbardziej żądny krwi władca w historii, maszeruje z wojskami przez Mongolię do Chin, tworząc potężne imperium i zostawiając po sobie 40 milionów ofiar. Wybucha epidemia dżumy.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Richard Machowicz, George Wunderlich, James Meigs, H.M. Agnes Hsu, Timothy Brook, Mehmet Oz
    Czyngis-chan, najkrwawszy wódz w historii, przetacza się jak burza od Mongolii po Chiny, tworząc potężne imperium i znacząc swój ślad 40 milionami ofiar. Ale jeszcze większe żniwo śmierci zbierze inny zabójca - czarna śmierć. Szlakami handlowymi mongolskiego imperium dżuma szerzy się w Azji i Europie, siejąc spustoszenie i stając się największą katastrofą biologiczną w dziejach. Dzięki izolacji bezpieczne pozostają obie Ameryki - zaraza je omija, a ich cywilizacje kwitną.
  ageRating: 7
  genre:
  - '35'
- eventId: 838087
  start: 2026-09-20T22:55:00Z
  stop: 2026-09-21T00:00:00Z
  title: Ludzkość - historia nas wszystkich 1 (odc. 6)
  subtitle: W Chinach nowy wynalazek, broń palna, umożliwiła zwycięstwo powstania chłopskiego i zjednoczenie kraju. Osiągnięcia Chińczyków inspirują ludzi zamieszkujących Europę, powstaje m.in. prasa drukarska.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Hugh Ballantyne
    Występują: Sam Sheridan, Mehmet Oz, Anthony Bourdain, S. James Gates, Santhi Hejeebu, H.M. Agnes Hsu
    Złoto z Ameryki pomaga odrodzić się Europie. Pieniądze płyną do Wenecji, stwarzając nowe szanse dla przedsiębiorców gotowych podjąć ryzyko. W Chinach nowy wynalazek - broń palna - umożliwia zwycięstwo chłopskiego powstania i zjednoczenie kraju. Osiągnięcia Chińczyków inspirują Europę, w efekcie powstaje m.in. prasa drukarska. Dzięki niej mogą powstawać miliony książek. Jedna z nich zainspiruje podróż do Nowego Świata. Ameryka wzywa!
  genre:
  - '35'
