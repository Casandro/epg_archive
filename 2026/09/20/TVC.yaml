  description: |-
    Tytuł oryginalny: Winnetou 3. Teil
    DE,FR,IT,YU,YU, 1965
    Reżyseria: Harald Reinl
    Występują: Lex Barker, Pierre Brice, Rik Battaglia, Ralf Wolter, Carl Lange, Ilija Ivezić
    Winnetou, dzielny wódz Apaczów, oraz jego przyjaciel Old Satterhand czekają na śmierć przywiązani do pala. Biali bandyci obarczyli Winnetou winą za śmierć syna wodza Indian z plamienia Jicarillo. Winnetou i Old Satterhand w ostatniej chwili uwolnieni przez trapera Sama Howkinsa uciekają w góry. Tam dochodzi do rozstrzygającej walki z Indianami Jicarillo i bandytami.
