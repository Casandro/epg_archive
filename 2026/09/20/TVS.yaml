  title: Rosamunde Pilcher - Wybrzeże marzeń 4 (odc. 8)
  subtitle: Po śmierci męża Kate Milhouse postanawia zacząć życie od nowa. Wraz z dziećmi, dwunastoletnim Williamem i sześcioletnią Mirandą, opuszcza Londyn i przenosi się do nadmorskiej wioski w Anglii.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Küste der Träume
    DE, 2001
    Reżyseria: Dieter Kehler
    Występują: Carin C. Tietze, Martin Halm, Anaid Iplicjian, Wolfgang Völz, Benedict Freitag, Raphael Ghobadloo
    Kate Milhouse chce zacząć od nowa po śmierci męża. Wraz z dziećmi, dwunastoletnim Williamem i sześcioletnią Mirandą, przeprowadza się z Londynu do małej wioski na wybrzeżu Anglii. Arnold Talbot, najlepszy przyjaciel jej męża, zaproponował jej pracę recepcjonistki w swoim hotelu. Nowy początek jest pod dobrą gwiazdą: Kate bardzo lubi pracować w hotelu, a jej nowy dom, romantyczny domek ogrodowy, a także sąsiadka i gospodyni, pani Pritchett, inspirują Kate i jej dzieci.
  ageRating: 12
  genre:
  - '22'
