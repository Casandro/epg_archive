  title: Martha Argerich in Warschau
  description: |-
    (Dokumentation, DEU 2020)
    Spätestens mit dem ersten Preis beim renommierten internationalen Chopin-Wettbewerb in Warschau 1965 erobert Martha Argerich die Klavierwelt. Ihr Sieg steht aber lange Zeit nicht fest. Einer ihrer ärgsten Konkurrenten ist Arthur Moreira Lima aus Brasilien. Nach drei Runden liegt er in Führung. Dann kommt das alles entscheidende Finale. Martha Argerich spielt Chopins erstes Klavierkonzert. Es ist die Geburtsstunde einer Legende. Enge Freunde von Martha Argerich wie der Dirigent Daniel Barenboim, die Pianistinnen Gabriela Montero und Sophie Pacini, der Geiger Gidon Kremer, ihr Konkurrent Arthur Moreira Lima, der polnische Starpianist Rafa? Blechacz, der 2005 den ersten Preis des Chopin-Wettbewerbs gewonnen hat, sowie Zeitzeugen kommen zu Wort.
    Regie: Holger Preuße, Philipp Quiring
