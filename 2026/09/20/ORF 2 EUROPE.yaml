  title: Äpfel - Paradiesische Versuchung
  description: |-
    (Dokumentation, AUT 2023)
    Er ist wohl der berühmteste Vertreter aus der Familie der Rosengewächse und gehört zu den beliebtesten Obstsorten: Der Apfel. Domestizierte Äpfel gab es bereits vor mehr als zwei Jahrtausenden in Südeuropa, im Kaukasus und Mittleren Osten wurden bereits vor vier Jahrtausenden Äpfel angebaut. Die heutigen Sorten sind das Ergebnis von Vermischung und Veredelung und seit Jahrhunderten eine geschätzte Zutat für unzählige Kochrezepte. Von Calvados bis Apfelstrudel, von Apfelwein bis zum Most. Die Dokumentation thematisiert die Geschichte des Apfels, einer der ältesten domestizierten Obstsorten, und zeigt die unterschiedlichsten Verarbeitungsformen. Ob im Strudel, Saft, oder Wein: Die paradiesische Versuchung ist seit Jahrhunderten eine beliebte Kochzutat.
    Gestaltung: Anita Lackenberger
  genre:
  - '116'
