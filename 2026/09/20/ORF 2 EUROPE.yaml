  title: DAS GESPRÄCH mit Susanne Schnabl
  subtitle: 'Gefährliche Intelligenz: Bedroht die KI die Menschheit?'
  description: "Es ist eine Warnung vor nicht weniger als der \"Auslöschung der Menschheit\": Gleich drei KI-Chefs warnen eindringlich vor ihrer eigenen Technologie, der Künstlichen Intelligenz, die außer Kontrolle geraten könnte. Müssen wir uns fürchten? Hat die Politik bisher versagt, klare Regeln, Grenzen und Verbote zu schaffen?\nFest steht: Die KI-Revolution ist voll im Gange. Wie wird sie unser Leben in den nächsten Jahren verändern - vom Job bis zum Alltag? Ersetzt sie massenhaft Arbeitsplätze, und macht sie uns, wie Kritiker warnen, sogar dümmer? \n\nDarüber diskutieren bei Susanne Schnabl der ehemalige Finanzminister und KI-Manager Gernot Blümel, Datenschützer Max Schrems, die Wirtschaftsinformatikerin Sarah Spiekermann, die vor den Risiken warnen, sowie KI-Experte René Mayrhofer."
