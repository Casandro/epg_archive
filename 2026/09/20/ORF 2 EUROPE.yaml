  title: Hereinspaziert!
  subtitle: Zu Besuch bei Elke Winkens und Marjan Shaki & Lukas Perman
  description: |-
    Sasa Schwarzjirg trifft in "Hereinspaziert! Zu Besuch bei ..." Persönlichkeiten des öffentlichen Lebens und spricht mit ihnen über Karriere, Privatleben und kommende Projekte. In dieser Ausgabe besucht sie Schauspielerin Elke Winkens sowie das Musicalpaar Marjan Shaki und Lukas Perman.
    Elke Winkens zählt seit Jahren zu den prägenden Gesichtern der deutsch-österreichischen Kulturszene. 2026 wurde sie für ihre Rolle in "How to Be Normal" mit dem Österreichischen Filmpreis ausgezeichnet und ist zudem für die Romy 2026 in der Kategorie "Beliebteste Schauspielerin" nominiert. Im Gespräch mit Sasa Schwarzjirg erzählt sie von ihrem Beruf, der Sichtbarkeit von Frauen ab 50 und von der besonderen Geschichte, wie sie ihren Mann kennengelernt hat.
    Lukas Perman und Marjan Shaki gelten als eines der bekanntesten Paare der österreichischen Musicalszene. Seit mehr als 20 Jahren begeistern sie ihr Publikum sowohl gemeinsam auf der Bühne als auch privat. Kennengelernt haben sie sich 2005 bei der deutschsprachigen Erstaufführung von "Romeo & Julia". Aus der Bühnenromanze wurde eine langjährige Partnerschaft und eine Familie mit vier gemeinsamen Kindern.
