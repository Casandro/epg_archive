  title: Österreich-Bild aus dem Landesstudio Vorarlberg
  subtitle: Freiheit auf Rädern - Alltag im Rollstuhl
  description: 'Auf einen Schlag gestaltet sich das Leben komplett neu - nach einem Unfall oder einer Krankheit. Man sitzt im Rollstuhl. Alles ist neu und verändert sich - für die betroffene Person ebenso wie auch für das Umfeld. Wie gehen Menschen mit diesem Schicksalsschlag um? Wie bewältigen sie ihr neues Leben? Welchen Stellenwert haben sie in der Gesellschaft? Der Rollstuhl gibt ihnen Mobilität und die Freiheit, ein selbstbestimmtes Leben zu führen. Die Dokumentation des ORF Vorarlberg begleitet mehrere Personen im Alltag, im Beruf und bei ihren Freizeitaktivitäten und zeigt, was möglich ist: Freiheit auf Rädern - beim Tennis, Basketball, Mountainbiken, Skifahren, im Ruderboot oder mit dem Kite.'
