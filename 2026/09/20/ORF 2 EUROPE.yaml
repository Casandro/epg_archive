  title: Natur im Garten
  description: |-
    Karl Ploberger präsentiert einen märchenhaften Naturgarten in Salzburg, farbenfrohe Herbstblüher für Balkon und Terrasse, Uschi Zezelitsch widmet sich der Heidelbeere und auf der Garten Tulln dreht sich alles um die vegetative Vermehrung von Pflanzen.
    Elisabeth und Helmut Kreipl-Ruess haben ihren rund 500 m2 großen Garten in Salzburg in den vergangenen 30 jahren Schritt für Schritt zu einem Naturgarten entwickelt. Alte Gehölze, Rosen, Beerensträucher und üppige Blühpflanzen schaffen einen vielfältigen Lebensraum für Igel, Singvögel, Wildbienen und Schmetterlinge. Besonderer Blickfang ist eine Garten-Modellbahn, die sich durch die Pflanzenwelt zieht.

    Garteln und mehr - Tipps vom Biogärtner
    Karl Ploberger zeigt, welche Herbstblüher jetzt Farbe auf Balkon und Terrasse bringen - von Herbstastern und Chrysanthemen bis zu Heidekraut, Fetthenne und dekorativen Gräsern.
    Uschi Zezelitsch stellt die Heidelbeere vor und spricht über ihre Verwendung in Küche und Hausapotheke. Außerdem zeigt sie, wie Heidelbeeren fermentiert und zu einer würzigen Sauce verarbeitet werden können.
    Auf der Garten Tulln zeigen die Gärtnerinnen verschiedene Methoden der vegetativen Vermehrung. Vorgestellt werden unter anderem Stecklinge, Steckholz und Absenker, mit denen Pflanzen aus dem eigenen Garten weitervermehrt werden können.
