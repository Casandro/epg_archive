  title: Gunst der Stunde mit Heiko Bräuning - Prügelknabe für die Welt
  subtitle: Gunst der Stunde mit Heiko Bräuning - Prügelknabe für die Welt
  description: 'Herzlich willkommen zur Gunst der Stunde. Das habe ich mir zugelegt: ein Gefängnis.  Wissen Sie für was das ist? Fürs Handy. Das ist ein Handygefängnis. Ist doch nötig, dass  das Handy ab und zu mal hinter Schloss und Riegel kommt und dann erst mal ne Weile  hinter diesen schwedischen Gardinen bleibt. Was aber, wenn man uns in so ein  Gefängnis sperrt? Ich hab das schon oft erlebt. Und das Leben im Knast, hinter Gittern,  ist mühsam. Aber wenn uns jemand zu diesem wegsperrt, einsperrt. Das tut weh. Gott  ist ein Gott der Freiheit. Er hat uns zur Freiheit berufen. Und diese königliche Freiheit der  Kinder Gottes feiern wir in diesem Gottesdienst! Heute zu Gast: Heiko Bauder. Einer, der  das schwere Schicksal anzieht. Wie er mit schwerster Schuld umgeht und immer noch  Kopf hoch am Leben ist, das erzählt er uns heute im Gespräch'
