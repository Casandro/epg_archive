  title: Noćni program
  subtitle: Gost Vesna Perinčić iz Republičke unije potrošača.
  description: 'Gost Danijela Pantić Publika je pamti kao voditeljku najgledanijeg kviza "Slagalica", radila je i kao stručnjak za medije i komunikaciju na projektima Evropske unije u Srbiji i Crnoj Gori i držala predavanja i treninge iz oblasti komunikacije, saradnje sa medijima, nastupa i odnosa sa javnošću. Kada je napustila RTS posvetila se istraživanju sirove hrane i nauci koja se bavi proučavanjem ljudskog ponašanja (NLP). Trenutno vodi kviz "Mozaik" na Kurir televiziji. Pred nama je sada i njena nova knjiga, za sve one koji žele da se zdravije hrane, pod nazivom "Vodič za vegane", koji je sadrži 70 raznovrsnih recepata za čitavu porodicu. Objavila je i knjigu "Probaj me, prodaj me: mediji i potrošačko društvo".'
