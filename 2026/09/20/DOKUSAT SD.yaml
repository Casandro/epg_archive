  title: Hitlers München - Nazibauten in der bayerischen Metropole
  subtitle: Hitlers München - Nazibauten in der bayerischen Metropole
  description: 'Hitlers monumentale Bauten - Die Dokumentation zeigt die Architektur im Nationalsozialismus Gigantische Bauten, die alle herkömmlichen Dimensionen sprengen sollten: Hitlers Größenwahn spiegelt sich auch in seinen architektonischen Plänen. Schon damals zeugten die Entwürfe vom Realitätsverlust des Diktators. München war die deutsche Stadt, der er sich immer besonders verbunden fühlte. Hier begann die NS-Bewegung, hier wurden Partei, SA und SS gegründet.'
  genre:
