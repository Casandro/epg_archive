  title: Frauen im Nazi-Projekt - Die Frau als Matrix
  subtitle: Frauen im Nazi-Projekt - Die Frau als Matrix
  description: 'In der Weimarer Republik emanzipierten sich Frauen durch die "Lebensreform"-Bewegung: Sie erhielten das Wahlrecht, Lockerungen der Abtreibungsgesetze, neue Berufe und Aufstiegsmöglichkeiten. Das nationalsozialistische Regime beschränkte sie hingegen auf Haus und Kindererziehung. Einige Frauen wie Leni Riefenstahl fanden ihren Platz in der männerdominierten NS-Machtstruktur.'
