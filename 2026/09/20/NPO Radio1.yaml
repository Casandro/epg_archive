  title: Een Uur Cultuur
  subtitle: 'Op zaterdag- en zondagochtend luister je tussen 06.00 tot 07.00 uur naar het cultuurprogramma van de VPRO: Een Uur Cultuur.'
  description: 'Op zaterdag- en zondagochtend luister je tussen 06.00 tot 07.00 uur naar het cultuurprogramma van de VPRO: Een Uur Cultuur. Elk weekend ontvangen Teddy Tops en Eva Koreman een spraakmakende cultuur-gast, die spannende, ontroerende en gratis tips deelt. Wat moet je de komende tijd luisteren, lezen of bezoeken? Deze ochtend stamp je je agenda vol met de beste muziek, boeken, films, concerten, exposities, theater- en dansvoorstellingen - althans volgens onze gast. Èn je leert deze maker, muzikant, ontwerper of schrijver, beter kennen aan de hand van diens eigen werk en persoonlijke tips. (2026)'
- eventId: 836027
  start: 2026-09-20T05:00:00Z
  stop: 2026-09-20T08:00:00Z
  title: Vroege vogels
  subtitle: 'Radioprogramma over natuur, milieu, klimaat en duurzaamheid. Presentatie: Menno Bentveld.'
  description: 'Volgens Tim van Deursen kunnen drones, slimme camera''s en kunstmatige intelligentie de natuur helpen redden. In zijn boek "Hack the Planet" laat hij zien hoe deze technologie kan worden ingezet. We spreken de schrijvers van twee genomineerde boeken voor de Natuurboekenprijs 2026. Andrea Kieskamp schreef "In lange rok de koraalriffen op. Anna Weber-van Bosse " en Dirk Hilbers en Constant Swinkels schreven ''Crossbill Natuurgids Nederland deel 1 en 2''. We spreken Kars Veling van de Vlinderstichting over de invloed van een hete, droge zomer op de nazomerse vlindergeneratie. Verder in de uitzending: Klimaatboomers, Achteruitgang van trekvogels, Jaime van Essen, Muurvogels, Hans de Kroon. De column is van Jean-Pierre Geelen. Vroege Vogels Radio op NPO Radio 1 wordt zondag gepresenteerd door Menno Bentveld van 7.00 tot 10.00 uur vanuit het Groene Huis in Amersfoort. Lees meer over de gehele uitzending. (2026)'
