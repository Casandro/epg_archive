  title: Rok w ogrodzie
  subtitle: W tym wydaniu prowadzący przypomną o sadzeniu kwiatów cebulowych kwitnących wiosną oraz przedstawią praktyczne porady dotyczące ich uprawy i najciekawsze nowości odmianowe.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie
    PL, 2026
    Przypomnimy o sadzeniu kwiatów cebulowych kwitnących wiosną oraz przekażemy praktyczne porady i nowości odmianowe. Pokażemy także niezwykłą rabatę ziołową Kamili Kasperskiej. Zaprezentujemy zawilce, fuksje i inne byliny końca lata oraz drzewa i krzewy o dekoracyjnych liściach. Zaprosimy na wizytę w ogrodach Kardiorg w Tallinnie. Zapowiedzią "Roku w ogrodzie Extra" będzie opowieść o kwiatach, które właśnie rozwinęły się w ogrodzie Agnieszki Dybowskiej w Stargardzie.
  genre:
  - '130'
- eventId: 937895
  start: 2026-09-20T03:43:00Z
  stop: 2026-09-20T03:54:00Z
  title: Rok w ogrodzie extra
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    W programie zostanie zaprezentowany ogród Agnieszki Dybowskiej, której pasjami są historia, radiostacje mikrofalowe oraz pielęgnacja przydomowej zieleni. Niewielki ogród skrywa wiele wyjątkowych roślin, a każda z nich ma własną historię. Widzowie poznają przestrzeń stworzoną własnymi rękami oraz codzienne życie właścicielki, w którym ważne miejsce zajmują hobby, zainteresowania i rozwijanie pasji.
  genre:
  - '130'
