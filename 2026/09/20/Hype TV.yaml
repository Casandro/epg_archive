  description: "U okupiranom Beogradu 1941.godine skupina mladih ilegalaca organizira niz sabotaža i diverzija protiv njemačkih snaga i lokalne policije. Predvođeni iskusnim operativcima, Prle i Tihi sa svojim suborcima uspijevaju nadmudriti neprijatelja u samom srcu grada, unatoč stalnim potjerama i opasnostima. \nFilm koji je poslužio kao predložak za kultnu televizijsku seriju, vjerno dočarava atmosferu otpora, mladenačke hrabrosti i uličnih borbi u okupiranom glavnom gradu, gdje svaki pogrešan korak može značiti smrt."
