  title: Verliebt auf Island
  subtitle: Fernsehfilm Deutschland 2019
  description: |-
    Geysire, Lavafelder und Mythen - die Vulkaninsel Island bietet eine ungewöhnliche Kulisse zum Heiraten, natürlich auch für eine spontane Doppelhochzeit. Wenn jedoch dem von Ben Blaskovic gespielten Bräutigam die Zukünftige abspringt und Ann-Kathrin Kramer als frisch verliebte Mutter ihre eigenen Heiratspläne für sich behält, wird aus dem Trip ein ungewöhnliches Abenteuer.
    Zwischen die Stühle gerät Ferdinand Seebacher als Trauzeuge seines besten Freundes und als heimlicher Verlobter seiner Mutter. Nico Sommer führte Regie bei dem Ensemblefilm über Liebe, Freundschaft und den Mut, sich auch schmerzhafte Wahrheiten zu sagen.
