  title: Passato e presente - Enrico Cernuschi, p
  subtitle: Passato e presente - Enrico Cernuschi, patriota, banchiere, collezionista d'arte - Una vita straordinaria, quella di Enrico Cernuschi, degna di un romanzo d'appendice ottocentesco, piena di ideali, battagl
  description: "ie, sconfitte, fughe, cambiamenti improvvisi, contraddizioni e incredibili successi. Giovane patriota rivoluzionario, guida la rivolta dei milanesi contro gli oppressori austriaci nelle cinque giornate di Milano del 1848, e l'anno dopo partecipa alla breve e drammatica esperienza della Repubblica Romana. Esiliato a Parigi, entra nel mondo della finanza, diventa un potente banchiere e uno degli uomini più ricchi di Francia, fonda la Banque de Paris, la futura Paribas. E, infine, viaggia in Oriente dove colleziona tesori artistici per poi fondare, al ritorno a Parigi, un museo che dona alla città. Un personaggio straordinario che ha attraversato il Risorgimento Italiano, la Primavera dei Popoli, il Secondo Impero, la Comune e la Seconda Repubblica Francese, sempre da protagonista. In studio, con Paolo Mieli, la professoressa Elena Bacchin. - Conduce Paolo Mieli\nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio la prof.ssa Elena Bacchin \nCon la partecipazione di Maria Sole Sanasi \nRegia Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
