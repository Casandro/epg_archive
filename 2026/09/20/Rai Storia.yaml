  title: 'Misteri d''archivio - 1968: la fine della'
  subtitle: 'Misteri d''archivio - 1968: la fine della Primavera di Praga - Praga, 21 agosto 1968: in poche ore, 27 divisioni dell''esercito del Patto di Varsavia invadono la capitale della Cecoslovacchia. Un''operazi'
  description: one militare destinata a mettere fine alla cosiddetta Primavera di Praga. Nonostante l'appello alla calma da parte del governo di Dubcek, la popolazione, principalmente i giovani, tenta di opporsi ai carri armati sovietici. Ci saranno più di 20 morti nella capitale e 50 vittime in tutto il Paese. - Introduce la puntata il prof. Adriano Roccucci
