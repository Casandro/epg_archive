    Architektonicznym symbolem Turynu jest Mole Antonelliana. Mole znaczy kolos. I rzeczywiście budowla jest imponująca. Z tarasu na szczycie Robert Makłowicz podziwia panoramę miasta. Podróżnik z Krakowa jest zdania, że dzieło Alessandra Antonellego jest dla Turynu tym, czym Pałac Kultury i Nauki dla Warszawy, a Wieża Eiffela dla Paryża. Początkowo miała to być synagoga. Jej budowę rozpoczęto zaraz po zjednoczeniu Włoch, bo gmina żydowska chciała mieć w Turynie odpowiednio okazałą świątynię.
