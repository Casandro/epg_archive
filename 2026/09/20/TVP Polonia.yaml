  title: Życie nad rozlewiskiem - odc. 11/13
  subtitle: W Warszawie Basia spotyka się z czytelnikami. Mieszkańcy rozlewiska żywo rozprawiają na temat książki. Nie podoba im się sposób, w jaki autorka opisała ich ukochane miasteczko.
  description: |-
    Tytuł oryginalny: Życie nad rozlewiskiem
    PL, 2011
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Joanna Fertacz
    Po wyznaniu Róży ksiądz Karol ma kryzys wiary. Pierwszy raz nie odprawia mszy. Ludzie nie rozumieją jego zachowania. Spacerującego samotnie po okolicy Karola odnajduje Maciej. Po rozmowie z przyjacielem, Karol wraca do kościoła. Konrad składa wymówienie. Nie może dalej pracować z Adą. Ada przyjmuje jego decyzję. Konrad wjeżdża na wakacje. Małgosia próbuje znaleźć z nim kontakt, ale bezskutecznie. W Warszawie Basia spotyka się z czytelnikami swojej książki.
