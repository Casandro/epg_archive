    Stanisław Anioł zostaje gospodarzem bloku i kieruje ruchem podczas przeprowadzki. Zamieszanie jest spore. Dwaj lokatorzy - Zygmunt Kotek i Zdzisław Kołek - otrzymali przydziały na to samo mieszkanie. Ostatecznie wprowadzają się obaj z rodzinami i prowizorycznie dzielą lokal na pół. Tragarze zamieniają lokatorom meble, esbecy mają założyć podsłuch u opozycjonisty, prof. Dąb-Rozwadowskiego. Wdowa przywozi trumnę ze zwłokami męża, by choć przez chwilę pobył w nowym mieszkaniu.
