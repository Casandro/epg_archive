  start: 2026-09-20T01:00:00Z
  stop: 2026-09-20T01:50:00Z
  title: Życie nad rozlewiskiem 1 (odc. 12)
  subtitle: Trwają poszukiwania Kaśki, która gdzieś zaginęła. Policjanci aresztują Krzysztofa i zabierają na komisariat. Iwona, rzekoma narzeczona, oskarża go o kradzież i oszustwo matrymonialne.
  description: |-
    Tytuł oryginalny: Życie nad rozlewiskiem
    PL, 2011
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Joanna Fertacz
    Cała wieś i miejscowa policja szukają Kaśki, która zniknęła w tajemniczych okolicznościach. Z Warszawy przyjeżdża zaniepokojona Basia, która przerwała spotkanie z czytelnikami. Po powrocie z wycieczki Konrad dostaje niespodziewanie z urzędu stanu cywilnego informację o terminie ślubu z Adą. Postanawia natychmiast wyjaśnić tę sprawę z byłą narzeczoną. Mirka zgadza się za opłatą wypożyczyć quady do poszukiwań Kaśki. Oburzony Piernacki postanawia wymówić wynajem pokoi quadowiczom.
  ageRating: 12
