  title: Susi und Strolch
  subtitle: Zeichentrickfilm, USA 1955
  description: 'Regie: Hamilton Luske, Clyde Geronimi, Wilfred Jackson. Darsteller: Barbara Luddy, Larry Roberts, Peggy Lee. Die charmante Cockerdame Susi lebt in einem liebevoll behüteten Zuhause. Als allerdings eines Tages Tante Sarah mit den heimtückischen Katzen Si und Am zum Babysitten kommt, sind für Susi die harmonischen Zeiten vorbei. Sie reißt aus und trifft den frechen Vagabunden Strolch. Bei einem unvergesslichen romantischen Spaghettiessen kommen sich die beiden näher und gemeinsam mit Strolch lernt Susi das abenteuerliche und ungebundene Leben auf der Straße kennen. Doch auf Susi warten ein Zuhause und eine Familie, die sie beschützen muss.'
  widescreen: true
- eventId: 1014323
  start: 2026-09-20T09:50:00Z
  stop: 2026-09-20T11:10:00Z
  title: Alice im Wunderland
  subtitle: Zeichentrickfilm, USA 1951
  description: 'Regie: Clyde Geronimi, Hamilton Luske, Wilfred Jackson, Jack Kinney. Darsteller: Kathryn Beaumont, Ed Wynn, Richard Haydn. Als Alice eines schönen Tages einem sprechenden weißen Kaninchen mit einer großen Uhr folgt, landet sie prompt in einer außergewöhnlichen Welt, dem Wunderland. Auf ihrer Reise durch diese fröhlich bunte, aber auch sehr eigenartige Welt, begegnet sie einer gestiefelten Raupe, einem verrückten Hutmacher und sie ist zu Gast bei einer Nichtgeburtstagsparty. Einer zwielichtigen Tigerkatze hat es das Mädchen schließlich zu verdanken, dass es den Zorn der Herzkönigin auf sich zieht.'
