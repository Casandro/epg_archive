  title: Prince Of Persia - Der Sand der Zeit
  subtitle: Fantasyabenteuer, USA 2010
  description: 'Regie: Mike Newell. Darsteller: Jake Gyllenhaal, Gemma Arterton, Ben Kingsley. An der Seite seiner Brüder Tus und Garsiv führt Prinz Dastan die persische Armee an, die gerade die heilige Stadt Alamut belagert. Alamut wird beschuldigt, Waffen an die Feinde Persiens zu verkaufen. Beim Überfall auf die Stadt fällt Dastan ein geheimnisvoller Dolch in die Hände. Bald findet der Prinz heraus, dass er mit Hilfe dieser Waffe die Zeit für einige Sekunden zurückdrehen kann. Die Eroberung verläuft erfolgreich und Prinzessin Tamina kann in ihren Gemächern festgesetzt werden...'
