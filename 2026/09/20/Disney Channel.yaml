  title: Alles steht Kopf
  subtitle: Animationsfilm, USA 2015
  description: 'Regie: Pete Docter, Ronnie Del Carmen. Darsteller: Amy Poehler, Phyllis Smith, Bill Hader. Im Hauptquartier, dem Kontrollzentrum im Kopf der elfjährigen Riley, leisten fünf Emotionen Schwerstarbeit: Angeführt von der optimistischen FREUDE, die Riley immer nur glücklich sehen möchte, sorgt sich ANGST ständig um Rileys Sicherheit, während WUT auf der Suche nach Gerechtigkeit bisweilen die Hutschnur platzt. Und die aufmerksame EKEL schützt den Teenager davor, sich zu vergiften - körperlich oder mental. Nur die unglückliche KUMMER weiß nicht so Recht, was ihre Aufgabe ist - nun ja, die anderen offensichtlich aber auch nicht...'
