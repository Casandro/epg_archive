  title: Der Schatzplanet
  subtitle: Zeichentrickfilm, USA/J 2002
  description: 'Regie: Ron Clements, John Musker. Darsteller: Emma Thompson, Roscoe Lee Browne, Patrick McGoohan. Seit seiner Kindheit träumt Jim Hawkins von der Suche nach dem sagenumwobenen Planeten, auf dem der Pirat Flint einen geheimnisumwitterten Schatz versteckt haben soll. Als Jim durch Zufall in den Besitz einer Schatzkarte gelangt, beginnt das größte Abenteuer seines Lebens. Zusammen mit dem Astronom Dr. Doppler bricht er auf in die Weiten des Universums. Auf der Weltraumgaleone Legacy schließt er schnell Freundschaft mit dem Schiffskoch John Silver. Doch dann übernimmt Silver das Kommando auf der Legacy - er will den Schatz für sich alleine.'
  widescreen: true
