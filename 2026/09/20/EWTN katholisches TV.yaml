  title: Kirche in Not - Spirit
  subtitle: 'Engel an meiner Seite: Glaube, Schutz und Begleitung'
  description: |-
    Mit Pater Engelbert Recktenwald FSSP, Autor und Mitgründer der Priesterbruderschaft St. Petrus
    Moderation: Volker Niggewöhner

    Gibt es Engel wirklich oder sind sie nur schöne religiöse Bilder? Warum sprechen so viele Menschen von unerklärlichen Bewahrungen, inneren Eingebungen oder dem Gefühl, nicht allein zu sein? Gemeinsam mit Pater Engelbert Recktenwald geht diese Ausgabe von SPIRIT der Frage nach, was die Kirche über Engel und Schutzengel lehrt - und welche Rolle sie im geistlichen Leben spielen. Dabei wird deutlich: Engel sind keine harmlosen Dekofiguren, sondern Boten Gottes und Begleiter des Menschen auf seinem Weg durchs Leben.
