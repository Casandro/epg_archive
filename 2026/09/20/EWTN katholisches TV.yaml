  title: Caterina von Siena Auf den Spuren einer großen Frau
  subtitle: Rom (1379-1380)
  description: 'Während die Hl. Caterina im Herbst 1378 in Siena ihr spirituelles Hauptwerk - den Dialog - zu Ende führt, wählen die von Papst Urban VI. abgefallenen Kardinäle einen Gegenpapst, der sich Clemens VII. nennt. Damit beginnt das fast 40 Jahre dauernde große Abendländische Schisma, ein Drama, das zugleich Caterina letzten Lebensabschnitt einleitet: Ihre Berufung nach Rom zur Unterstützung Papst Urbans VI.'
