  description: "Zum Start der Weizenernte feiern Molly und Nick eine entspannte Tailgate-Grillparty direkt auf dem Traktor. Zwischen Feldern und Abendlicht kocht Molly farbenfrohe Gerichte, die den Sommer einläuten und den Erntetag abrunden. Herzhaft, unkompliziert und genau richtig für einen langen Arbeitstag auf der Farm. \nUSA 2021"
