  subtitle: Joannas Weihnachtsleckereien
  description: "Joanna teilt eine ihrer liebsten Weihnachtstraditionen: das Verschenken von selbstgemachten Süßigkeiten an Familie und Freund:innen. Mit Klassikern wie Erdnusskrokant mit gesalzenem Karamell, Pfefferminzrinde aus weißer Schokolade, Kirschbonbons, Erdnussbutterkugeln und weichen Karamellbonbons kreiert sie Leckereien, die Freude und festliche Stimmung verbreiten. \nUSA 2021"
- eventId: 965493
