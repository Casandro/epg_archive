  description: "Für einen besonderen Date-Abend verwandelt Molly die Farm in ein gemütliches Open-Air-Kino. Statt Popcorn gibt es hausgemachte Klassiker mit einem Augenzwinkern, die perfekt zum Filmabend passen. Ein Abend, der zeigt, wie einfach gutes Essen und gemeinsame Zeit zusammengehören. \nUSA 2021"
