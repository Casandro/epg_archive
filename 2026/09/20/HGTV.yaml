- eventId: 965461
  start: 2026-09-20T00:30:00Z
  stop: 2026-09-20T01:15:00Z
  title: Gärtner mit Herz
  subtitle: Englischer Landgarten mit Hochbeeten
  description: "Alan und sein Team reisen nach Hinckley, um den 96-jährigen Weltkriegsveteranen Gordon zu überraschen - einen der wenigen noch lebenden Helden der D-Day-Landungen. Mit viel Respekt und Fingerspitzengefühl gestalten sie einen klassischen englischen Landgarten mit Hochbeeten, der sowohl pflegeleicht als auch würdevoll ist. Das Ergebnis soll auch ein Zeichen der Anerkennung sein. \nGBR 2022"
- eventId: 965462
  start: 2026-09-20T01:15:00Z
  stop: 2026-09-20T02:00:00Z
  title: Die Garten-Designer
  subtitle: Schneise der Zerstörung
  description: |-
    Das Haus von Brad und Kelly wurde durch einen Tornado in East Nashville völlig zerstört. Nachdem sie die letzten 1,5 Jahre damit verbracht hatten, sich auf das Innere ihres Hauses zu konzentrieren, beauftragten sie Rachel, John und Jamie mit der Gestaltung der Fassade und ihres Gartens. Mit einer wunderschönen gefliesten Terrasse, einer Außenküche, einem Lounge-Bereich mit Feuerstelle und einem liebevoll restaurierten Schornstein hält das Team sein Versprechen und schafft ein charmantes Haus und einen Traumgarten, in dem Brad, Kelly und ihre gesamte Familie gerne Zeit verbringen.
    CAN 2021
- eventId: 965463
  start: 2026-09-20T02:00:00Z
  stop: 2026-09-20T02:20:00Z
  title: Beach House Hunters
  subtitle: Das Strandhaus aus Kindertagen
  description: "Ein Paar aus der Stadt würde ihre Kinder gerne in einem Strandhaus in Destin aufwachsen sehen. Dafür wäre ein großer Garten und vier Zimmer perfekt - oder doch eine Boot-Anlegestelle und ein extra Gästezimmer? Auch wenn es nicht einfach wird, bei diesen Wünschen im Budget zu bleiben, ist der Makler bereit für die Herausforderung. \nUSA 2017"
- eventId: 965464
  start: 2026-09-20T02:20:00Z
  stop: 2026-09-20T02:40:00Z
  title: Beach House Hunters
  subtitle: Gestrandet mit Stil
  description: "Eine Familie aus Wisconsin sucht nach dem perfekten Strandhaus am Ufer des Michigansees. Doch Häuser am See sind heiß begehrt und die Familie muss schnell sein, um die Zusage für das perfekte Zuhause mit drei Zimmern und einem offenen Wohnbereich in einem einzugsfertigen Haus zu bekommen. \nUSA 2017"
- eventId: 965465
  start: 2026-09-20T02:40:00Z
  stop: 2026-09-20T03:00:00Z
  title: Beach House Hunters
  subtitle: Die Suche nach dem Paradies
  description: "Kokosnüsse am Strand in Hawaii knacken - eine Erinnerung, die eine Mutter auch gerne ihren Kindern ermöglichen würde. Deshalb besichtigt ein Paar die Strände von Oahu, auf der Suche nach einem passenden Anwesen mit einer Veranda und Blick aufs Meer. Der Immobilienmarkt an der Küste ist jedoch sehr begehrt, sodass es nicht einfach ist, ein Haus in ihrem Budget zu finden. \nUSA 2017"
- eventId: 965467
  start: 2026-09-20T03:00:00Z
  stop: 2026-09-20T03:25:00Z
  title: Beach House Hunters
  subtitle: Die Muschelsucher
  description: "Eine Familie aus Texas sucht ein Strandhaus auf der idyllischen Insel Whidbey. Kevin war als Kind oft mit seiner Familie dort und freut sich darauf, mit seinen eigenen Kindern wie früher Krebse und Muscheln am Strand zu sammeln. Trotz der schwierigen Immobilienlage zeigt der Makler den beiden verschiedene Häuser direkt am Strand oder mit Blick aufs Meer.  \nUSA 2018"
- eventId: 965468
  start: 2026-09-20T03:25:00Z
  stop: 2026-09-20T03:45:00Z
  title: Beach House Hunters
  subtitle: Der Liegestuhl ruft
  description: "Mit einem hart erarbeiteten Budget von 1,5 Millionen US-Dollar suchen Pat und Kathleen nach ihrem Traumhaus an den zerklüfteten Küsten und sonnigen Stränden von Narragansett Bay. Sie besichtigen Traumhäuser mit toller Aussicht und haben ihre erwachsenen Kinder als Berater dabei. Das Haus soll einen offenen Grundriss und einen pflegeleichten Garten sowie Gästezimmer für ihre Kinder haben. \nUSA 2018"
- eventId: 965469
  start: 2026-09-20T03:45:00Z
  stop: 2026-09-20T04:05:00Z
  title: Beach House Hunters
  subtitle: Ein Haus für viele Kinder
  description: "Nach zehn Jahren Urlaub an den schönen Stränden der ruhigen Düneninsel Topsail suchen Jennifer und Derek ein Zuhause für ihre sechsköpfige Familie. Wichtig ist den beiden, dass mindestens zwölf Leute im Haus schlafen können und dass es nah genug an der Natur und dem nächsten Taco-Lokal liegt. Die Maklerin ist zuversichtlich. \nUSA 2018"
- eventId: 965470
  start: 2026-09-20T04:05:00Z
  stop: 2026-09-20T04:25:00Z
  title: Homegrown - Aus Liebe zum Garten
  subtitle: Der Naschgarten
  description: "Raj und Gita wissen nicht, wie sie ihren schattigen und feuchten Garten in Midtown Atlanta in einen grünen, kindersicheren und gemütlichen Garten verwandeln können, der ihnen erlaubt, indische Gemüsesorten anzubauen. Jamila plant, den verwunschenen Garten zu öffnen, eine neue Stützmauer zu bauen und viele übergroße Pflanzgefäße für essbares Gemüse und Kräuter aufzustellen. Sie pflanzt Gemüse, Kräuter und Teepflanzen an und erklärt der jungen Familie, wie man die Pflanzen richtig pflegt. Am Ende wartet ein wahres Schlaraffenland auf die vier.  \nUSA 2022"
- eventId: 965471
  start: 2026-09-20T04:25:00Z
  stop: 2026-09-20T04:50:00Z
  title: Homegrown - Aus Liebe zum Garten
  subtitle: Seidenhühner und Gemüsebeete
  description: "Das Ehepaar Julie und John, das kürzlich ein neues Haus mit einem vernachlässigten Garten erworben hat, möchte diesen zu einem Ort machen, an dem ihre Familie gemeinsam gärtnern und zusammenkommen kann. Mithilfe von Jamila und ihrem Team wird der Garten nach und nach umgestaltet: Zunächst werden große Bäume entfernt und der Gartenbereich vereint. Die Terrasse wird erweitert und eine Feuerstelle hinzugefügt. Der alte Hühnerstall wird renoviert, und Schafe helfen, den Wildwuchs zu beseitigen. Frisches Gemüse und Kräuter runden das blühende Gartenparadies ab.  \nUSA 2022"
- eventId: 965472
  start: 2026-09-20T04:50:00Z
  stop: 2026-09-20T05:10:00Z
  title: Homegrown - Aus Liebe zum Garten
  subtitle: Zwergrinder und Hopfengarten
  description: "Jamila begibt sich aus der Stadt in das idyllische Dahlonega, um Sam und David bei ihrem Traumprojekt zu unterstützen: den Aufbau einer Brauerei und Farm. David, im Vorruhestand, möchte seine eigene Brauerei gründen und Hopfen anbauen, während Sam von einer Farm mit Zwerghochlandrindern träumt. Mit Jamilas Hilfe nehmen sie die Herausforderung an. Sie legen Gärten an, bereiten das Land vor und bereichern ihr Zuhause mit süßen Kälbchen. Inmitten von Brauereiplänen und Rinderpflege verwirklichen sie ihren Traum von einem idyllischen Leben auf dem Land, verwurzelt mit ihrer Leidenschaft für Bier und Natur.  \nUSA 2022"
- eventId: 965473
  start: 2026-09-20T05:10:00Z
  stop: 2026-09-20T05:30:00Z
  title: Homegrown - Aus Liebe zum Garten
  subtitle: Ein Garten für neugierige Kinder
  description: "Eine vierköpfige Familie lebt im sonnigen Südwesten von Atlanta und steht vor der Herausforderung, ihren Hanggarten in ein funktionales und kinderfreundliches Paradies zu verwandeln. Mit viel Enthusiasmus und Unterstützung von Jamila nehmen sie das Projekt in Angriff. Jamila setzt Schafe ein, um ein zugewachsenes Waldstück zu roden und ihre neuen terrassenförmig angelegten Gartenbeete mit Erbgemüse wie Tomaten, Wassermelonen und Okra zu bepflanzen. \nUSA 2022"
- eventId: 965474
  start: 2026-09-20T05:30:00Z
  stop: 2026-09-20T05:55:00Z
  title: Homegrown - Aus Liebe zum Garten
  subtitle: Ernten und Einmachen
  description: "Jamila hilft einer jungen Familie dabei, ihre Gartenernte optimal zu nutzen. Sie zeigt ihnen, wie sie Obst und Gemüse durch bewährte Einmachtechniken haltbar machen können - für eine nachhaltige Vorratshaltung und Lebensmittel aus dem eigenen Anbau das ganze Jahr über. \nUSA 2023"
