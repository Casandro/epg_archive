  stop: 2026-09-20T10:00:00Z
  title: Stars am Sonntag
  subtitle: Volker Bruch (Babylon Berlin) zu Gast bei Arne-Torben Voigts
  description: 'Es ist eines der großen Fernsehereignisse des Jahres: "Babylon Berlin" geht in die fünfte und letzte Staffel. Und wieder ermittelt Volker Bruch als Kommissar Gereon Rath in Berlin, diesmal im Jahr der Machtergreifung der NSDAP. Es verspricht ein spannendes Staffelfinale zu werden. Was die Fans noch erwarten können und warum "Babylon Berlin" eine besondere Rolle in der deutschen Film- und Fernsehgeschichte einnimmt, verrät Volker Bruch im Gespräch mit Moderator Arne-Torben Voigts.'
