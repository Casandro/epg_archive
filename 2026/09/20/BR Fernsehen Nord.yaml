  title: Drei. Zwo. Eins. Michl Müller - Das Beste
  description: "Seit Jahren begeistert Michl Müller sein Publikum mit scharfzüngigen Persiflagen, spritzigen Sketchen und urkomischen Alltagsbeobachtungen - jetzt bringt er die beliebtesten Szenen noch einmal ins Programm.\nImmer an seiner Seite: Die lustige und temperamentvolle Kabarettistin Constanze Lindner, auch sie ist eine wahre Meisterin der Verwandlung und besticht durch ihre Energie, ihren Charme und ihren unverwechselbaren Humor. Gemeinsam bilden sie ein unschlagbares Duo, das das Publikum von der ersten Minute an mitreißt. \nAußerdem mit dabei: die Kabarettistin Franziska Wanninger und der Comedian Florian Simbeck."
