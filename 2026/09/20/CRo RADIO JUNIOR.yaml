  title: Pohádkové poklady
  description: 'Jirka s kozú. Klasická pohádka Karla Jaromíra Erbena o chudém Jirkovi, který se rozhodne rozesmát věčně zamračenou princeznu. Napsal: Karel Jaromír Erben. Natočeno v roce 1951. Režie: Přemysl Pražský st.. Vypráví: Leopolda Dostalová.'
- eventId:
