  title: Pohádkové poklady
  description: 'O kalifu Čápovi. Orientální pohádka o kalifovi a jeho vezírovi, kterým zlý čaroděj podstrčil kouzelný prášek, aby se proměnili v čápy a čarodějův syn se mohl stát vládcem Bagdádu. Napsal: Wilhelm Hauff. Překlad: Jiří Dusl. Natočeno v roce 1968. Režie: Josef Svátek. Vypráví: František Smolík.'
