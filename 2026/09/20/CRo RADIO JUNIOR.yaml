  - 1016876
  start: 2026-09-20T17:50:00Z
  stop: 2026-09-20T18:00:00Z
  title: Hajaja
  description: Bleší pohádky 7/7 - Chyťte zloděje! Bylo nebylo pět kamarádů, kteří nebyli větší než blechy. No, ony to vlastně byly blechy. Spokojeně se vozily v kožíšku malého voříška a vypadalo to, že je nic nerozdělí. Jenže pak si pejsek našel nové paničky a bleší pětku čeká stěhování. Sedm veselých příhod, ve kterých spolu s bleškami seznámíme s nejrůznějšími psy a jejich lidmi. Napsala Markéta Nekolová. Dramaturgie a režie Renata Venclová. Natočeno v roce 2026. Vypráví Michal Bednář. PREMIÉRA.
