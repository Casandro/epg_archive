  description: Veliký diamant. Příběh ze života českých cestovatelů Čeňka Paclta a Emila Holuba, kteří však nebudou hlavními postavami. Poznáte Pana Linka, který pracuje na jedné jihoafrické farmě jako hledač diamantů. Co se bude dít? Napsal Eduard Martin. Režie Ladislav Rybišar. Účinkují Alois Švehlík, Radoslav Brzobohatý, Václav Mareš, Jiří Prager, Petr Brodský, Jan Čenský a další.
