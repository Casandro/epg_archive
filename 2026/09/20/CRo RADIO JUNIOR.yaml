  title: Velká pohádka
  description: 'O princi poutníkovi. Pohádka vypráví o princi Ahmedovi, který se vydá na dlouhou pouť napříč Španělskem najít dívku svého srdce. Je to příběh o lásce, snech, tužbách i o překonávání překážek, které mu stojí v cestě. Na motivy příběhu Irvinga Washingtona pro rozhlas napsala Helena Sýkorová. Režie: Dimitrij Dudík. Účinkují: Kryštof Hádek, Petr Pelzer, Ilja Racek a další.'
