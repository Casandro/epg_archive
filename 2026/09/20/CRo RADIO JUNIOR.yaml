  description: Poplach v Kovářské ulici. Příběh o nepoctivém obchodníkovi Bočanovi, kterému jeho hamižnost přinesla především posměch a odsouzení. Hlavním hrdinou příběhu ale není pan Bočan, je to třináctiletý Frantík Severýn, který dokáže svoji nebojácnost a smysl pro spravedlnost. Napsal podle knihy Václava Řezáče, Stanislav Lahodný. Režie Ladislav Rybišar. Účinkují Ladislav Boháč, Slávka Budínová, Václav Knop a další.
