  subtitle: 'Moderation: Volker Wieprecht'
  description: Wo herrscht Jubel, wo herrscht Katerstimmung? Im Wahlkampf lagen die Parteien dicht beieinander, doch wer hat am Wahltag die Nase vorn? rbb-Reporterinnen und Reporter berichten live von den Wahlpartys der Parteien und sprechen dort mit der Basis. Mit aktiven und ehemaligen Politikerinnen und Politikern analysiert Volker Wieprecht die Ergebnisse und lotet aus, wer mit wem künftig die Hauptstadt regieren könnte. Wo es Gemeinsamkeiten und Gegensätze bei den Parteien gibt, ordnet der Berliner Politikwissenschaftler Thorsten Faas ein.
