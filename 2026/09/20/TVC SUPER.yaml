  title: 'Detektyw Candice: Niezawodny instynkt 1 (odc. 7)'
  subtitle: Znalezione zostaje ciało zamordowanego 17-latka, przy którym odkryto dużą ilość marihuany. Candice podejrzewa, że sprawa ma drugie dno i nie wierzy, że chłopak był dealerem narkotyków.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2013
    Reżyseria: Nicolas Picard-Dreyfuss
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Alix Poisson, Samira Lachhab, Alexandre Varga
    W odludnym miejscu znaleziono ciało zamordowanego 17-latka, przy którym odkryto pokaźną ilość marihuany. Antoine uważa, że to sprawka handlarzy narkotyków. Candice próbuje za wszelką cenę złożyć w całość kawałki podartej nalepki, znalezionej w kieszeni nastolatka. Na ułożonym rysunku widnieje ryba. Policjantka podejrzewa, że sprawa ma drugie dno. Nie wierzy, że chłopak był dealerem narkotyków.
  ageRating: 16
- eventId: 838012
  start: 2026-09-20T19:20:00Z
  stop: 2026-09-20T20:35:00Z
  title: 'Detektyw Candice: Niezawodny instynkt 1 (odc. 8)'
  subtitle: Candice musi sama rozwiązać tajemnicę morderstwa dekoratorki łodzi. Sabine Missoni, delegatka związku zawodowego, została zamordowana w stoczni, nad którą wisi widmo bankructwa.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2013
    Reżyseria: Etienne Leduc
    Występują: Cécile Bois, Raphaël Lenglet, Gaya Verneuil, Alix Poisson, Samira Lachhab, Alexandre Varga
    Pomiędzy Candice a jej zastępcą panuje napięta atmosfera. Kapitan Dumas jest traktowany specjalnie. Członek znanej ekipy dochodzeniowej z Montpellier ma za zadanie przeprowadzić dochodzenie w delikatnej sprawie seryjnych napadów na tle rabunkowym. Tymczasem Candice musi sama rozwiązać tajemnicę morderstwa dekoratorki łodzi. Sabine Missoni, delegatka związku zawodowego, została zamordowana w stoczni, nad którą wisi widmo bankructwa.
  ageRating: 16
- eventId: 838013
  start: 2026-09-20T20:35:00Z
  stop: 2026-09-20T21:50:00Z
  title: Balthazar 4 (odc. 7)
  subtitle: Pamięć. Wróciwszy do rodzinnego miasteczka w celu zbadania sprawy uboju rytualnego, Balthazar musi zmierzyć się z trudnymi wspomnieniami. (S4,Ep7)
  description: |-
    Tytuł oryginalny: Balthazar
    FR, 2022
    Reżyseria: Franck Brett
    Występują: Tomer Sisley, Constance Labbé, Yannig Samot, Philypa Phoenix, Côme Levin, Caterina Murino
    Raphaël Balthazar jest utalentowanym patologiem sądowym. Błyskotliwy, czarujący mężczyzna bywa też irytujący. Jest lekkoduchem, który żyje pełnią życia, często wbrew normom i konwencjom. Jego metody pracy i zjadliwy dowcip kolidują z rozsądnym podejściem nowo mianowanej komendant policji Hélene Bach. Balthazara wciąż prześladuje morderstwo jego żony sprzed dwunastu lat. Nowe dowody sugerują, że jej zabójca wciąż może być na wolności.
  ageRating: 12
