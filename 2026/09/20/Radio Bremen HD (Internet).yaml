  title: mareTV
  subtitle: Die Insel Langeland - Hyggelig und hügelig
  description: 'Die Natur der dänischen Ostseeinsel, gelegen zwischen Fünen und Lolland im Südfünischen Inselmeer, ist einzigartig. Vom wilden, bewaldeten Norden bis zu schier endlosen Sandstränden und steilen Klippen im Süden ziehen sich Ketten von über tausend Huthügeln. Auf Langeland scheint Dänemark besonders entschleunigt: Entspannung steht hier sogar auf dem Stundenplan. Ein umtriebiger Erfinder tüftelt an Delikatessen aus Blasentang und ein Amateurfunker verbindet Langeland mit der ganzen Welt.'
- eventId: 1055418
  start: 2026-09-20T11:00:00Z
  stop: 2026-09-20T12:25:00Z
  title: Lindburgs Fall
  subtitle: Fernsehfilm Deutschland 2011
  description: 'Als "Kommissar Kämpfer" in der Krimiserie "Blaulicht" spielte Peter Lindburg jahrzehntelang seine Paraderolle. Jetzt soll die Serie abgesetzt werden, was dem vom Erfolg verwöhnten Star gar nicht schmeckt. Gekränkt kehrt er in seine Heimatstadt in Thüringen zurück, die er einst der Karriere wegen verließ. Doch das Verbrechen lässt den Fernsehermittler auch hier nicht los: Als er eines Abends einen Mord zu beobachten glaubt und den hoch angesehenen Staatsanwalt Dr. Eugen von Wangenheim der Tat verdächtigt, sorgt Lindburg für Aufregung bei den örtlichen Behörden. Haben den ehemaligen TV-Kommissar jetzt alle guten Geister verlassen?'
  ageRating: 6
  genre:
  - '16'
