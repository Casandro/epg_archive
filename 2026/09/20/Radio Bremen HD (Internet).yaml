  title: Edgar, das Super-Karibu
  subtitle: Die Fernbedienung
  description: 'Es ist Sankt Magnus in Windhausen! Und Magnus, der Bürgermeister, möchte diesen Tag feiern, indem er allen Einwohnerinnen und Einwohnern kleine Magnus-Roboter schenkt. Er bittet Super-Edgar darum, die Geschenke diskret in den Häusern von Windhausen zu verstecken. Nur muss Super-Edgar gleichzeitig auch seine neuen Antriebsschläger testen: Frank, der Erfinder, hat sie mit vielen neuen Möglichkeiten ausgestattet, eine verrückter als die andere.'
