  title: DAS! Rote Sofa
  subtitle: 'Gast: Schauspieler Benno Fürmann'
  description: Mit der finalen fünften Staffel ist die Mammutserie "Babylon Berlin" im Jahr 1933 angekommen - und Benno Fürmann ist darin aktuell wieder als skrupelloser und rechtsextremer Regierungsrat Oberst Wendt zu sehen. Wie er den sinistren Charakter verkörpert, belegt einmal mehr, dass Fürmann zur ersten Riege deutscher Schauspieler gehört. Seinen Durchbruch hatte er in der Ruhrpott-Serie "Und tschüss!". Der Deutsche Fernsehpreis für seine Rolle als jungen Boxer in "Die Bubi-Scholz-Story" katapultierte ihn endgültig nach oben. Auf dem Roten Sofa wird Benno Fürmann auch über sein Engagement für den Umweltschutz berichten.
