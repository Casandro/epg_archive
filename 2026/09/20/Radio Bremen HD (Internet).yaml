- eventId: 1051452
  start: 2026-09-20T04:55:00Z
  stop: 2026-09-20T05:10:00Z
  title: Edgar, das Super-Karibu
  subtitle: Der Superheld der Woche
  description: Super-Edgar wird der Preis des "Superhelden der Woche" verliehen. Birgit, die Füchsin macht daraus eine große Story in ihrer Zeitung und erzeugt eine regelrechte "Super-Edgar-Manie". Super-Edgar, der gar nichts von dem Preis weiß, fragt sich schon, warum seine Freunde sich so merkwürdig ihm gegenüber verhalten. Und siehe da, sein Unwissen wird als Starallüre angesehen. Und die Presse beginnt, sich gegen ihn zu stellen.
