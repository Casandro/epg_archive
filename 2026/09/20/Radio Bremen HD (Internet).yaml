  title: Hofgeschichten - Ackern zwischen Alpen und Ostsee (36/37)
  subtitle: Großer Markt beim Inselbauern
  description: "Einmal im Jahr organisiert Mathias Schilling den Fisch- und Wollmarkt in Schaprode auf Rügen. Viele regionale Händler bauen ihre Stände auf und feiern ihre jahrelange Zusammenarbeit mit dem Inselbauern. \n\nViel Zeit und Energie haben Nina und Korbinian Bartl vom Gschwandtnerhof in den Ausbau ihrer Ferienwohnung gesteckt. Jetzt sind die Landwirte auf der Zielgeraden. \n\nEs wird ein ungewöhnlich heißer Herbsttag an der brandenburgischen Groß Schauener Seenkette. Fischer Sander Fuhrmann ist schon zeitig auf dem Wasser unterwegs.\n\nIn Rheinhessen ist die Weinlese endlich geschafft. Aber für Winzerin Shanna Reis hört die Arbeit nicht auf."
