  title: Italienische Reise
  subtitle: Folk trifft Jazz - mit der NDR Bigband und Stefano Bollani
  description: 'Der italienische Meisterpianist Stefano Bollani liebt das Reisen - wortwörtlich und mit seiner Musik: Er ist unterwegs von der Klassik zum Blues und Jazz, vom dörflichen Tanz zum Popsong, wechselt die Perspektiven, entwirft immer neue Klangbilder. "Viaggio in Italia", Italienische Reise, heißt sein neuestes Projekt mit der NDR Bigband, mit der er schon 2013 erfolgreich zusammengearbeitet und einen "JazzEcho" gewonnen hat. Jetzt treffen Motive aus italienischen Folksongs auf aktuellen Jazz.'
