  title: Polizeifunk ruft (49)
  subtitle: Kerzen im Stroh
  description: Das frisch vermählte Ehepaar Inge und Walter Hartmann will ein paar besinnliche und erholsame Tage auf dem Bauernhof von Inges Verwandten verbringen. Doch selbst im Urlaub bringt Walter seinen kriminalistischen Spürsinn zur Anwendung, denn in den vergangenen zwei Wochen wurden insgesamt drei Brände auf den umliegenden Höfen gelegt. Mit Einverständnis des zuständigen Polizisten Feddersen untersucht Hartmann die Brandstelle und findet einen Kerzenhalter. Damit stellt er dem Pyromanen eine Falle.
  genre:
  - '16'
- eventId: 1061133
  start: 2026-09-20T12:50:00Z
  stop: 2026-09-20T13:15:00Z
  title: Polizeifunk ruft (50)
  subtitle: Vor der Verjährung
  description: Karlheinz Prengel wird bei den Vorbereitungen für die Verlobungsfeier durch ungebetenen Besuch gestört. Der drogensüchtige frühere Arzt Alfred Hasslinger erpresst den Apotheker, weil er ihm vor Jahren ein paar Ampullen Rauschgift ausgehändigt hat. Zwar holt Karlheinz beim alten Freund Walter Hartmann polizeilichen Rat ein. Aber aus Angst vor dem Chef verzögert er die Anzeige. Nur seiner Freundin Franziska beichtet er das noch nicht verjährte Vergehen. Am gleichen Abend findet die Nachbarin Kleinbacher den Erpresser tot im Vorgarten.
  genre:
  - '16'
- eventId: 1061675
  start: 2026-09-20T13:15:00Z
  stop: 2026-09-20T14:00:00Z
  title: Expeditionen ins Tierreich
  subtitle: Die Lübecker Bucht - Tiere an der Ostseeküste
  description: Sonne, Strand und Seebäder prägen die Lübecker Bucht, deren Landschaft von der letzten Eiszeit geformt wurde und bis heute im Wandel ist. Steilküsten rutschen ins Meer, junge Dünen entstehen, und stille Rückzugsorte bieten seltenen Arten Schutz. Im Mittelpunkt steht der Kiebitz, einst ein "Allerweltsvogel", heute vom Aussterben bedroht. Der Film zeigt seinen Kampf gegen Feinde, Wetterextreme und menschliche Eingriffe - sowie die Erfolge des Naturschutzes. Auch Seeadler, Fischotter, Uferschwalben und Schweinswale gehören zur vielfältigen Tierwelt.
- eventId: 1062188
  start: 2026-09-20T14:00:00Z
  stop: 2026-09-20T14:30:00Z
  title: Björn Freitag kocht grenzenlos köstlich
  subtitle: Málaga an der Costa del Sol
  description: Spitzenkoch Björn Freitag zieht es in die Sonne. Der Genussreisende ist unterwegs in Málaga - in kulinarischer Mission für "Grenzenlos köstlich". Die zweitgrößte andalusische Stadt liegt an der Costa del Sol. Die Malagueños lieben ihre Stadt, in der andalusisches Flair und moderner Großstadttrubel zusammenkommen. Björn wirft einen Blick in spanische Kochtöpfe. Wie wird der Tapas-Klassiker Croquetas modern interpretiert? Wie entsteht die Leibspeise der Malagueños, die Espetos de Sardinas?
  genre:
  - '144'
- eventId: 1064311
  start: 2026-09-20T14:30:00Z
  stop: 2026-09-20T15:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: Gefüllte Gerichte sind auf dem Teller immer eine Augenweide. Außerdem braucht man auf Grund der Füllungen kaum eine Beilage dazu zu servieren. Auf die inneren Werte der Gerichte kommt es schließlich an. Mit kulinarischer Kreativität und gesunden Zutaten zeigen NDR-Fernsehkoch Tarik Rose und Ernährungs-Doc Matthias Riedl heute ihr Talent als Verpackungskünstler am Herd.
