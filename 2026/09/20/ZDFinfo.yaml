  title: Entschlüsselt
  subtitle: Die Schriftrolle von Jerash
  description: |-
    Großbritannien 2025
    2014 stößt ein Grabungsteam in den Ruinen von Jerash in Jordanien, dem antiken Gerasa, auf eine stark beschädigte Schriftrolle aus Silber. Sie zu öffnen, wird zur Herausforderung.

    Das 1300 Jahre alte Artefakt ist zu zerbrechlich, um von Hand entrollt zu werden. Erst die Mikro-CT im Labor macht den verborgenen Inhalt sichtbar: 17 rätselhafte Zeilen. Bis heute rätseln Forschende über ihre Bedeutung.
