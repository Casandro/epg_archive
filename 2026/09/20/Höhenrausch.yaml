  title: Bergwelten - Gran Paradiso - Königreich für Steinböcke und Kletterer
  subtitle: Bergwelten - Gran Paradiso - Königreich für Steinböcke und Kletterer
  description: Auf den Spuren des Königs der Alpen, dem Urvater der Steinböcke in Europa, unternehmen Doppel-Olympiasieger Benjamin Raich und Kletter-Legende Bernd Zangerl eine Skitour im Gran Paradiso. Ihr Ziel ist der Gipfel des 4.061 Meter hohen Gran Paradiso. Im Königreich für Steinböcke und Kletterer gelingt Bernd Zangerl im Valle Dell'Órco die Tour "Grenzenlos". Zangerl setzt fünf Jahre nach seiner schweren Verletzung im Clean Climbing - also mit nur wenig Absicherung - einen Meilenstein. Namensvetterin Babsi Zangerl schafft im Gran Paradiso als erste Frau der Welt den Trad-Klassiker "Greenspit". Babsi und Bernd Zangerl demonstrieren nahezu ungesicherte Trad-Kletterei auf Weltklasse-Niveau in den Granitfelsen des Valle Dell'Órco. AT 2022
  ageRating: 6
