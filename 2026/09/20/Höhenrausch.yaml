  title: Bergwelten - Hanspeter Eisendle - Philosoph in Fels und Eis
  subtitle: Bergwelten - Hanspeter Eisendle - Philosoph in Fels und Eis
  description: "Sogar mitten in den Dolomiten gibt es Orte, wo Du wochenlang niemandem begegnest\", weiß Hanspeter Eisendle und meint die unbekannten Routen, die ihn besonders reizen, weil für sein Bergsteigen das Entdecken einsamer Rückzugsräume wesentlich ist. Die BERGWELTEN Dokumentation über den Sterzinger Kletterer eröffnet Einblicke in die inneren Landkarten seines Denkens und zeichnet so ein facettenreiches Berg-Leben voller spektakulärer Höhen, mit Expeditionen ins Himalaya und Erstbegehungen in höchsten Schwierigkeitsgraden, aber auch mit einem tragischen Tiefpunkt: einem Lawinenunglück im Jahr 2000. Durch eine schonungslos offene, ehrliche und selbstkritische Aufarbeitung und Dank des Mitgefühls der Angehörigen schaffte Eisendle es danach, wieder zurückzukehren. Als Bergführer und Mensch mit wachem Blick und der Gabe aufs Wesentliche zu fokussieren. \n\nWas im Portrait auch deutlich wird: Kaum jemand spricht so pointiert, feinsinnig und tiefgründig über das Wesen des Bergsteigens wie Eisendle. Er ist damit der seltene Glücksfall eines Alpinisten in dem die unaufgeregte und uneitle Einfachheit eines Bergmenschen in alpiner Alltags-Philosophie aufgeht. AT 2022"
  ageRating: 6
- eventId: 971918
