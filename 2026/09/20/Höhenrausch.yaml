  title: Bergwelten - Bergjagd Teil 2
  subtitle: Bergwelten - Bergjagd Teil 2
  description: Erfahrung, Wachsamkeit, Geduld, eine gewisse Portion Feingespür uvm. - die Liste der Attribute ist lange, die Jäger mitbringen müssen, um bei ihren herausfordernden Einsätzen im Gebirge reüssieren zu können. Kaum einer weiß das besser als Jäger & Förster Thomas Tscherne aus Bad Gastein. Ein respektvoller Umgang mit den Wildtieren steht bei ihm an erster Stelle. Nicht umsonst stapft er im Winter fast täglich den beschwerlichen, meist zugeschneiten Weg zu seiner Wildfütterung im Gasteiner Angertal hinauf. Thomas ist hier Jagdpächter und betreut dieses Revier schon seit über 25 Jahren. Anfang Oktober, noch vor dem großen Wintereinbruch, macht er sich mit Rucksack, Gewehr und Fernglas bepackt auf die Jagd nach einem Dreierhirsch. Dreierhirsche sind ein bis vierjährige männliche Tiere. Neben Kahlwild hat Thomas laut Abschussplan in dem Jahr nur einen Dreierhirsch frei. Nach besagtem Kahlwild hält sein Sohn Thomas Tscherne jun. Ausschau. Ein erster Winter-Vorbote ist bereits übers Land gezogen. Die Bedingungen am Berg sind jetzt noch härter und abweisender. Ob Thomas Anstrengungen belohnt werden? Eine Bergung des erlegten Tieres talabwärts, in diesem unwegsamen Gelände wäre beschwerlich und nur mit Unterstützung machbar... Seine Frau Rosina ist auf der Jagd nach einem Dreierhirsch. Über ein Hochplateau erreicht sie die Gegend, in dem das Rotwild zurzeit einsteht. Es beginnt ein anstrengender Abstieg mit schwerem Gepäck im steilen Gelände. Am Platz angekommen, richtet sie ihre Position her und es beginnt das Warten, bis das Wild von den Einständen auszieht. Und Christoph Burgstaller ist wie schon im Sommer bei Hannes Schwabl im hinteren Fuschertal auf einen alten Gamsbock eingeladen. Eine vermeintlich kranke Gamsgeiß durchkreuzt jedoch ihren ursprünglichen Plan. AT 2022
  ageRating: 6
