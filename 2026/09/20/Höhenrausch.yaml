  title: Bergwelten - Die Acht Tausender des Mühlviertels
  subtitle: Bergwelten - Die Acht Tausender des Mühlviertels
  description: Das Mühlviertel erstreckt sich von Linz und der Donau im Süden bis zu den Gipfeln des Böhmerwaldes im Norden und ist der älteste geologische Teil Oberösterreichs. Oft wird es als Hugelland abgetan und die alpinen Möglichkeiten darin unterschätzt. Dabei hat das Mühlviertel sowohl im Klettern als auch im alpinen Skisport talentierte Pioniere und Profis hervorgebracht. Der Skisport hat in Linz, speziell am Pöstlingberg, seinen Anfang genommen und blüht dort auch in manchen Wintern weiterhin auf. Die legendäre "Moawies", einst von Heinrich Kriechmayr errichtet, bildet die Basis für die beeindruckenden Erfolge seines Sohnes Vincent, der zwei goldene WM-Medaillen gewonnen hat.  AT 2023
