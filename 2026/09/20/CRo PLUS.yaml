  title: Vertikála
  description: Ve čtyřiadevadesáti letech zemřela Ludmila Javorová - žena, kterou do kněžské služby tajně vysvětil biskup skryté církve Felix Maria Davídek. Ve Vertikále se ohlédneme za jejím odkazem. Dá se právně vymazat záznam o křtu? Touhle otázkou se aktuálně zabývá Soudní dvůr Evropské unie. A papež příští víkend navštíví Francii.
