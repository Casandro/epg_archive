  title: Vertikála
  description: '"Někdy odpovědi na jednoduché otázky neexistují" - říká v debatě Vertikály Tomáš Kraus, ředitel Institutu Terezínské iniciativy. Spolu s historikem Jaroslavem Šebkem diskutují o symbolice osudu slovenského biskupa Jána Vojtaššáka, který již třicet let prochází s komplikacemi beatifikačním procesem. Jeho osud aktivního politika Slovenského štátu s výraznými antisemitskými prvky a následně mučedníka komunistického režimu je složité téma pro historiky, církev i veřejnost, konstatuje Jaroslav Šebek. Dodává, že diskuse o blahořečení tomu vůbec nepomáhá - Vojtaššákův příběh si především zaslouží kritický, nikoliv oslavný životopis, který by využil materiály, přístupné nyní ve vatikánských archivech. Více v debatě Vertikály, moderuje Eva Hůlková.'
