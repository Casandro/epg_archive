  description: Jaká je situace s možným zmírněním vízových sankcí pro Bělorusy, kteří mají příbuzné v Česku, prozradila Krystyna Šyjanok z Kanceláře demokratických sil Běloruska v Česku. O coming-outu a o tom jak na queer identitu nahlíží zdejší vietnamská komunita, bude mluvit podnikatel Quang Luong. A lektorka a překladatelka Natalia Shamrai popsala, jaké je učit ukrajinsky české policisty a vysokoškolské studenty na UK. Magazín připravila Tajana Mančalová. Moderuje Iveta Demeterová.
