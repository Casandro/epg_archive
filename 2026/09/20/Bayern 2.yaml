  title: Bayern 2 Salon
  subtitle: '"Die Odyssee" (7/8) von Meike Rötzer '
  description: |-
    Die Odyssee des Homer - einer der zentralen Texte europäischer Kultur schlechthin - neu erzählt von Meike Rötzer. In ihrer literarischen Nacherzählung legt sie die erzählerische Raffinesse Homers frei und befragt das Epos: Welche Spielräume haben Frauen in der von Männern dominierten antiken Ordnung? Ein vielstimmiges Panorama, in dem weibliche Figuren wie Penelope, Eurykleia, Kalypso, Nausikaa oder Athene Konturen gewinnen. Die vertraute Geschichte verschiebt sich: weg vom heroischen Einzelnen, hin zu einem Netz aus Abhängigkeiten, Loyalitäten und Widerständen. So wird deutlich, dass die Odyssee des Homer nicht nur von dem titelgebenden Helden, sondern auch von Frauen erzählt, und von den Bedingungen, unter denen sie entscheiden und handeln, wenn die Verwerfungen des Krieges in alle Bereiche einer Gemeinschaft hineinreichen.
    Von und mit Meike Rötzer
    BR/MDR/RBB 2026

    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar. Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar.
