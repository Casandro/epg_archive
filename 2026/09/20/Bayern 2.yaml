  title: Bayern 2 Hörspiel
  subtitle: '"Auf geht''s beim Schichtl" von Justin Schröder'
  description: "\"Die Unterlagen zu meinem Hörspiel habe ich, abgesehen von meiner eigenen Erinnerung, soweit Daten und ähnliches über die Person und das Unternehmen August Schichtls in Frage kamen, von Herrn Anton Roskowetz erhalten, der in einer hoch anzurechnenden Weise das Andenken dieses Künstlers pflegt und auch die Anregung zu einer Gedenkstunde beim Rundfunk gab. Er ist ja zwar tatsächlich als Kind einer angeheirateten, nicht adoptierten Tochter von Schichtls Frau, gesetzlich nicht verwandt, aber er hängt, wie ich sicher weiß, mit großer Liebe an dem Andenken seines 'Großvaters'. Nun scheint Herr Roskowetz recht wenig Lust zu haben, Ihnen die gewünschten Aufschlüsse zu erteilen, da er durch die mangelnde 'Anerkennung', ja nach seiner Darstellung mitunter sogar feindselige Einstellung seitens der Verwandtschaft verbittert ist. Dass Sie über August Schichtl, Ihren verstorbenen Onkel, nicht gut unterrichtet sind, ist verständlich, da die Brüder, deren einer Ihr Vater war, nicht miteinander harmonisierten.\" (Briefauszug von Justin Schröder an Xaver Schichtl, März 1937, Historisches Archiv des Bayerischen Rundfunks) \n\nVon Justin Schröder\nMit Fritz Straßner, Christa Berndl, Christiane Blumhoff, Margot Schellemann, Ludwig Schmid-Wildy, Karl Tischlinger, Hans Löscher, Rolf Castell, Maxl Graf, Karl Obermayr, Hans Stadtmüller, Bum Krüger, Wolf Euba, Annemarie Wendl-Kleinschmidt, Alexander Malachovsky, Ludwig Wühr, Helmut Alimonta, Percy Adlon, Jürgen Nefzger, Simon Schiller, Oskar Eckmüller, Marianne Lindner, Maria Stadler, Willi Schultes, Gerdt Diemeg, Michael Lenz, Max Griesser und Erni Singerl\nKomposition: Raimund Rosenberger\nRegie: Olf Fischer \nBR 1969\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
