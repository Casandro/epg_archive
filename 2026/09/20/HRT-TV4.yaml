  ageRating: 4
  genre:
  - '128'
  description: Dok ne kupiš konja i ne dovedeš ga u štalu, jednostavno ne znaš koliko voliš te divne životinje. Tako govori Slobodan Bobo Kunić iz Suhodola Budačkog na Kordunu. Kordunu u kojem su od oduvijek ljudi i konji bili jedno. Pamti Bobo kako je i njegova obitelj još prije 50 godina imala konje koje je potom zamijenio traktor. Ali prazninu u srcu zbog odlaska konja iz sela i života nije mogao zamijeniti niti jedan stroj, ma koliko konjskih snaga da ima. Zato je Slobodan iznova obogatio imanje tim plemenitim životinjama. Priča s njima, poji ih i timari. Njegujući tako i svoju dušu iz koje odzvanja topot konja s Korduna.
