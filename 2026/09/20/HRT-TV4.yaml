  title: 'Romano Bolković - 1 na 1: Philipp Blom, talk show'
  subtitle: Gosti Romana Bolkovića su diplomati, državnici, znanstvenici, političari, svi koji sudjeluju u oblikovanju europskih i svjetskih politika te djeluju na političke procese.
  ageRating: 4
  genre:
  - '160'
  description: 'Philipp Blom, rođen 1970. u Hamburgu, njemački je povjesničar, filozof, pisac i radijski voditelj te jedan od istaknutijih europskih javnih intelektualaca. Povijest, filozofiju i judaistiku studirao je u Beču i Oxfordu, gdje je doktorirao radom o nacionalizmu. Uz pisanje i povijesna istraživanja godinama djeluje kao radijski autor i voditelj: na austrijskom radiju Ö1 vodi emisiju Punkt eins, producira podcast BlomCast, a od 2025. vodi i ciklus MQ Talks u bečkom MuseumsQuartieru. Djelovao je i kao kustos, gostujući istraživač i umjetnički direktor međunarodnih kulturnih projekata. Blomove knjige povezuju ozbiljno povijesno istraživanje, filozofsku refleksiju i izrazito književan, esejistički pristup. Među njegovim su najpoznatijim djelima Vrtoglave godine, Rastrgane godine, Zli filozofi, Svijet izbačen iz ravnoteže, Ono što je na kocki i Podčinjavanje Zemlje, a njegove su knjige prevedene na šesnaest jezika. Za svoj je rad primio niz međunarodnih priznanja, među kojima su Austrijski počasni križ za znanost i umjetnost te Lessingova nagrada za kritiku. U njegovim se knjigama neprestano vraća isto veliko pitanje: kako su ideje, tehnologije, društveni lomovi i promjene u odnosu čovjeka prema prirodi oblikovali moderni svijet  i što nam povijest može reći o budućnosti koja upravo nastaje. S Philippom Blomom razgovaramo o velikom paradoksu moderne: o čovjeku koji stječe sve veću moć nad prirodom i svijetom, a istodobno postaje sve nesigurniji u to tko je, kamo ide i prema kojim bi mjerilima trebao živjeti. Kroz Vrtoglave godine, Rastrgane godine i Podčinjavanje Zemlje pratimo nastanak modernoga svijeta, njegove lomove i njegova temeljna proturječja. Pitamo koliko povijest krivotvorimo samim time što znamo kako je završila te što je 1914. doista promijenila ako su masovno društvo, nova tehnologija, feminizam, psihoanaliza, novi mediji i potrošačka kultura već postojali prije Velikoga rata. Razgovaramo o svijetu u kojem više znanja ne donosi nužno više sigurnosti, a trijumf razuma proizvodi čežnju za instinktom, mitom, nacijom i nasiljem. Govorimo o krizi tradicionalnih muških uloga, novim plemenima modernoga društva, potrošačkoj industriji sreće, ratnoj traumi kao političkoj sili i jazzu kao jeziku tjelesne slobode. Pitamo što se događa s demokracijom kada hiperinflacija razori vezu između rada, štedljivosti i životnog ishoda, kako se masakr pretvara u mit o junačkoj žrtvi te kada se poslijeratno vrijeme počinje pretvarati u novo predratno vrijeme. Od Uruka i Gilgameša do Bacona, Descartesa i prosvjetiteljstva pratimo dugu povijest podčinjavanja prirode i ljudi. Razgovaramo o klasifikaciji kao instrumentu moći, o vjeri u čovjeka kao gospodara svijeta te o starom snu o "novom čovjeku", koji se danas nastavlja u transhumanizmu, biotehnologiji i umjetnoj inteligenciji. Pitamo i jesmo li doista napustili velike ideologije ili smo samo prestali prepoznavati tržište kao vlastitu ideologiju. Na kraju ostaju pitanja našega vremena: zašto golemo znanje o klimatskoj krizi još ne uspijevamo pretvoriti u djelovanje, kakva nam je nova slika svijeta potrebna i možemo li čovjeka prestati zamišljati kao gospodara prirode. Jer možda najveći problem nije u tome što još ne znamo kako izići iz staroga svijeta, nego u tome što iz njega zapravo ne želimo izići.'
