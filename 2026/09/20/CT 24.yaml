  subtitle: Umělou inteligenci vypustili do světa a teď ji chtějí brzdit. Čeho se technologické firmy bojí? Jejích schopností, nebo své konkurence? Vulgarity, osobní útoky, ostré výroky. Proč politici v médiích i na sociálních
  description: |-
