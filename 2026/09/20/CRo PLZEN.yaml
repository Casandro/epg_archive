  title: Pochoutkový rok
  description: 'Vaříme podle vašich receptů. Dnes: Čeká vás recept, který se stal třetím nejlepším v roce 2025 podle poroty. V rámci letošního jubilejního desátého roku vysílání naší soutěže jsme totiž požádali osobnosti Pochoutkového roku, aby recepty, které kdysi vyhrály, uvařily a upekly podle svého. A tak dnes bude péct dvoubarevné tvarohové řezy ve své úpravě kuchař Ivan Vodochodský. Kromě toho se dnes dozvíte, jaké velké překvapení pro vás chystají Josef Maršálek a Patrik Rozehnal.'
