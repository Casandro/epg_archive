  title: The Incredible Journey - Wissenswertes aus aller Welt
  subtitle: Liebe am Taj
  description: |-
    Indien. Der Wort "Land" scheint es nicht zu erfassen. Achtundzwanzig Staaten - eher achtundzwanzig Länder - mit vielen Traditionen, Sprachen und Stilen, die sich über eine Geografie erstrecken, die vom hoch aufragenden Himalaya bis zum dampfenden Golf von Bengalen reicht. Und doch gibt es in diesem bunten und kulturellen Durcheinander ein Gebäude, das Indien für die Welt repräsentiert: das Taj Mahal. Heute werden wir uns auf eine Reise in dieses großartige Meisterwerk begeben und die erstaunliche Lektion entdecken, die dieses großartige Gebäude enthält. Eine Lektion, die es mit dem bedeutendsten Buch teilt, das die Welt je gesehen hat.

