  subtitle: 'Für den heutigen Studiogast sind Glaube, Liebe und Hoffnung ganz wichtige Werte. Gott und die Kirche stehen in seinem Lebensmittelpunkt: Jürgen Körnlein.'
  description: 'Für den heutigen Studiogast sind Glaube, Liebe und Hoffnung ganz wichtige Werte. Gott und die Kirche stehen in seinem Lebensmittelpunkt. Seit Jahren prägt er das evangelische Leben in Franken und Nürnberg. Es ist jedoch keine leichte Zeit: die großen Volkskirchen stehen in der Kritik und kämpfen mit Problemen und Herausforderungen: Skandale, Austritte und fehlende Gelder machen den Kirchen zu schaffen. Es gab und gibt schmerzliche Einschnitte. Trotzdem will er die Kirche fit für die Zukunft machen. Er ist leidenschaftlicher Sportler, Läufer und Maler. Bilder deines Lebens heute mit Dr. Jürgen Körnlein.'
