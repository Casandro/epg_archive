  title: Oddly Satisfying Science
  subtitle: Trau Deinen Augen nicht, Education / Science / Factual topics, Season:1 Episode:9
  description: 'S1 E9 Die Experimente dieser Folge befassen sich eingehender mit der Gedankenkontrolle. Es wird untersucht, warum Objekte und Menschen dazu neigen, sich miteinander zu synchronisieren. Außerdem geht es um die magischen Geheimnisse des Magnesiums. Education / Science / Factual topics, Regie: Aaron Bauer,  Mit: Maynard Okereke, Cole Kraten, Alex Dainis, Season:1 Episode:9'
