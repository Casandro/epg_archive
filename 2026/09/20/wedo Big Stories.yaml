  title: Oddly Satisfying Science
  subtitle: Der Sound der Wissenschaft, Education / Science / Factual topics, Season:1 Episode:10
  description: 'S1 E10 In dieser Folge stehen spannende Experimente im Mittelpunkt: Die Physik des Theremins wird erklärt, der Einfluss des Außenohrs auf das menschliche Gehör untersucht und eine faszinierende Lasershow mit Kymatik veranschaulicht komplexe Schwingungen. Education / Science / Factual topics, Regie: Aaron Bauer,  Mit: Maynard Okereke, Cole Kraten, Alex Dainis, Season:1 Episode:10'
