  description: "Chaleurs suffocantes, mégafeux dévastateurs, sécheresse historique... L'été 2026 est le plus chaud jamais enregistré en France, avec 120 000 hectares partis en fumée depuis le début de l'année et plus de 200 000 Français évacués, selon les estimations provisoires des autorités. Confrontées aux désastres et à leurs lourds impacts sociaux, environnementaux et économiques, les populations se sont mobilisées aux côtés des pompiers, des acteurs de la protection et de la société civiles, pour faire face à l'urgence et aux évacuations massives qui ont marqué les esprits. Plus que jamais, ces événements extrêmes, constatés à l'échelle mondiale, soulèvent de multiples questions, requièrent des réponses, solutions et actions, au niveau des institutions, des entreprises, des citoyens...\nUne émission pour comprendre les causes de ces incendies incontrôlables, mettre en lumière des solutions pour les prévenir et y faire face.\n\nPrésentation : Léa Salamé, Hugo Clément\n "
