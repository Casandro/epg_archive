  title: SWR Aktuell am Vormittag
  description: "9:00  \nFREIHEIT DELUXE mit Jagoda Mariniæ\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - Motive, Moves und Musik-Samples - Wieviel Zitat darf sein?\nDie Dusche läuft, eine Frau seift sich ein, hinter dem Duschvorhang eine Bewegung, ein Schatten kommt näher, hebt den Arm und reißt den Vorhang zur Seite - Na, erkannt? Sofort die Duschszene aus dem Film 'Psycho'  von Alfred Hitchock im Kopfkino gehabt? Dabei hab ich die Szene nur mit Worten beschrieben. Hab ich diese bekannte Film-Szene jetzt zitiert? Oder geklaut?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nKindheiten - gestern und heute\nAm 20. September ist Weltkindertag. Kindheit reimt sich in unserer Erinnerung meist auf \"unbeschwert\". Aber wie unbeschwert können Kinder heute aufwachsen? Werden sie nicht viel zu früh über die allgegenwärtigen digitalen Medien aus dem Paradies ihrer Kindheit vertrieben? Können und sollten wir unsere Kinder und Enkel schützen von der allzu frühen Begegnung mit der \"bösen\" digitalen Welt.\nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nREICH - Das Geschäft mit dem Zweifel\nDas Fenster im Flugzeug (3/5)\nIm Sommer 1988 schmilzt der Asphalt auf New Yorks Straßen. Der NASA-Forscher James Hansen spricht vor dem US-Senat aus, was viele längst wissen: Die Erde heizt sich auf und der Mensch trägt eine Verantwortung daran. Die Welt scheint aufzuwachen - sogar die Ölindustrie. Doch hinter den Kulissen gründet sie die Global Climate Coalition und plant den Gegenangriff.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/reich-das-geschaeft-mit-dem-zweifel/urn:ard:show:f5091cc57904afb9/"
- eventId: 556033
  start: 2026-09-20T10:00:00Z
  stop: 2026-09-20T13:00:00Z
  title: SWR Aktuell am Mittag
  description: "12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nBattriespeicher boomen - aber wie kriegen wir sie ans Netz?\nEigentlich sind Batteriespeicher eine richtig gute Sache - und für die Energiewende enorm wichtig. Bundesweit sind auch ganz viele große Projekte geplant. Aber: Viele Batteriespeicher kommen nicht ans Stromnetz. Bei den Netzbetreibern stapeln sich die Anträge für Anschlüsse. Zur Umsetzung kommt es oft nicht, oder es dauert extrem lange. Warum ist das so? Und warum funktioniert das in anderen Regionen auf der Welt besser? Kalifornien setzt seit Jahren auf große Batteriespeicher. Am Abend geben sie Solarstrom zurück an das Netz. Gaskraftwerke bleiben oft abgeschaltet. Was muss passieren, damit auch in Deutschland die Energiewende gelingt?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/ \n\n13:00 \nCamino - Religionen auf dem Weg\nFreiheit gesucht - Wie Spiritualität widerstandsfähig macht \nKrisen und große Belastungen erleben viele Menschen als Zeiten, in denen sich alles eng anfühlt. Die Sehnsucht nach Freiraum wächst. Wie lässt sich Freiheit finden und welche Rolle spielt dabei die Spiritualität?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~ \nNicole Markwald im Gespräch mit Anne Rabe, Schriftstellerin und politische Essayistin\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n\n14:30  \nSWR Kultur Das Wissen\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
