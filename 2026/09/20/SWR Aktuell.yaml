  title: SWR Aktuell am Nachmittag
  description: "15:00 \nAktuelles & Sport\n\n15:30\nSWR1 Leute mit Nele Neuhaus | Krimiautorin\nMit über 12 Millionen verkauften Büchern gilt Nele Neuhaus als Deutschlands erfolgreichste Krimiautorin. Ihre Bücher erscheinen in über 30 Ländern, viele Verfilmungen ihrer Krimis waren Quotenrenner. In ihrem neuen Taunuskrimi \"Alles wird Asche\" spielt KI eine wichtige Rolle\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nDie Wahlen und der Kanzler \nSchon wieder steht ein Wahlsonntag bevor. Und schon wieder sind alle nervös. Nachdem die AfD in Sachsen-Anhalt haushoch gewonnen hat, schaut das Land jetzt nach Mecklenburg-Vorpommern und Berlin. Da geht es um viel - auch für den Kanzler. Der steht unter Druck. Es wird bereits über Nachfolger gesprochen. Und Merz selbst sagt sogar eine wichtige Auslandsreise ab - um in Berlin zu bleiben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: New Best Friends - was die EU von Kanada will\nHinhörer der Rede zur Lage der EU: Kanada soll assoziiertes EU-Mitglied werden. Kann das gutgehen? Und hat Ursula von der Leyen geliefert, was die Europäer brauchen? Mit Kathrin Schmid, Thomas Spickhofen und Andreas Meyer-Feist.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - Wie gehen andere Demokratien mit rechten Parteien um?\nWie umgehen mit rechtspopulistischen Parteien, die nach der Macht greifen? Anlässlich des Wahlsiegs der AfD in Sachsen-Anhalt blickt der Weltspiegel Podcast nach Frankreich und Ungarn: In Frankreich ist die rechtspopulistische Partei Rassemblement National eine der stärksten politischen Kräfte und treibt den Diskurs an. Ungarn hat wiederum den ultrarechten Regierungschef Viktor Orbán im April abgewählt. Wie gehen die Länder mit Rechtsaußen-Parteien um?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus - Einergiemärkte am Kipppunkt\nBlockierte Seerouten treiben die Preise für Öl, Gas und Sprit. Benzin und Diesel könnten bald drei Euro pro Liter oder mehr kosten. Bleibt das jetzt so? Politiker scheinen keine neuen Ideen zu haben. Dabei könnte die Entwicklung nun eigentlich den Blick freimachen für einen Weg in die Zukunft der Energieversorgung.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
