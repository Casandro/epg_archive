  title: SWR Aktuell am Morgen
  description: "6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nKindheiten - gestern und heute\nAm 20. September ist Weltkindertag. Kindheit reimt sich in unserer Erinnerung meist auf \"unbeschwert\". Aber wie unbeschwert können Kinder heute aufwachsen? Werden sie nicht viel zu früh über die allgegenwärtigen digitalen Medien aus dem Paradies ihrer Kindheit vertrieben? Können und sollten wir unsere Kinder und Enkel schützen von der allzu frühen Begegnung mit der \"bösen\" digitalen Welt.\nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen - TALK\nPeter Spork Epigenetik - Wie beeinflusst die Umwelt unsere Gene?\nWerden wirklich Traumata und schlechte Ernährungsgewohnheiten \"vererbt\"? So einfach, wie oft dargestellt, sind die Vorgänge nicht. Und doch: Die Epigenetik hat die Biologie revolutioniert.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00 \nARD Interview der Woche ~ \nNicole Markwald im Gespräch mit Anne Rabe, Schriftstellerin und politische Essayistin\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n\n7:30  \nWeltspiegel - Wie gehen andere Demokratien mit rechten Parteien um?\nWie umgehen mit rechtspopulistischen Parteien, die nach der Macht greifen? Anlässlich des Wahlsiegs der AfD in Sachsen-Anhalt blickt der Weltspiegel Podcast nach Frankreich und Ungarn: In Frankreich ist die rechtspopulistische Partei Rassemblement National eine der stärksten politischen Kräfte und treibt den Diskurs an. Ungarn hat wiederum den ultrarechten Regierungschef Viktor Orbán im April abgewählt. Wie gehen die Länder mit Rechtsaußen-Parteien um?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nDie Wahlen und der Kanzler \nSchon wieder steht ein Wahlsonntag bevor. Und schon wieder sind alle nervös. Nachdem die AfD in Sachsen-Anhalt haushoch gewonnen hat, schaut das Land jetzt nach Mecklenburg-Vorpommern und Berlin. Da geht es um viel - auch für den Kanzler. Der steht unter Druck. Es wird bereits über Nachfolger gesprochen. Und Merz selbst sagt sogar eine wichtige Auslandsreise ab - um in Berlin zu bleiben.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
- eventId: 555729
