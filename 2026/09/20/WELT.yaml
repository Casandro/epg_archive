  title: Lost Places - Folge 126
  subtitle: Lost Places - Folge 126
  description: 'Im Norden Panamas versinkt eine gewaltige Festung im Dschungel. Einst erbaut, um den Panamakanal zu schützen, wurde Fort Sherman später zum Trainingslager für US-Elitesoldaten auf dem Weg nach Vietnam. Außerdem: das unglaubliche Märchenschloss eines italienischen Grafen, der glaubte, den Krebs mit elektrischer Homöopathie besiegen zu können. Und: die erstaunliche Geschichte der Siemensbahn in Berlin, die nach jahrzehntelangem Verfall schon bald aus ihrem Dornröschenschlaf erwachen soll.'
