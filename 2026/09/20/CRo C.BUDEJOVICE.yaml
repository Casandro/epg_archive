  title: Čtení na neděli
  description: Motýlí křídla Marušky Cihlářové - tak se jmenuje povídka Anny Bolavé, kterou jsme pro vás připravili na další zářijovou neděli. Je to příběh o tom, že největší láskou v životě starého Jiřího Holmajera byla holka pro všechny Maruška Cihlářová. Zamiloval se do ní jako šestnáctiletý kluk a nikdy ji nepřestal mít rád. V režii Jakuba Doubravy povídku v plzeňském rozhlasovém studiu v loňském roce načetl herec Jan Holík.
