  title: Písničky z cizí kapsy
  description: Vícekrát osvědčený tandem zpěváka Pavla Bobka a příležitostného textaře Michaela Žantovského pojal písničku Zkus se životu dál smát v příjemném hořkosladkém rozpoložení. Originál je o něco víc pichlavější, tak jak to ostatně měl ve zvyku jeho původní autor a interpret Lou Reed. Jednou elektrický skoro-folkař, občas provokatér, jindy tříakordový předchůdce punku či tvůrce elektronických vazeb a hluků, Lou Reed byl neobyčejně zajímavým autorem, jemuž se - i přes skromný vokální rozsah - vyplatilo naslouchat. Ve svých písničkových příbězích se totiž dokázal dotýkat skutečných či vyfabulovaných osudů postav i figurek na okraji společnosti a přinášet tak do populární hudby témata, kterým se nablýskané hvězdy mikrofonů vyhýbaly obloukem. K poslechu zve Martin Schuster.
