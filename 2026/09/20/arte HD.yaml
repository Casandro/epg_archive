  title: 'Marlon Brando: Im Paradies'
  subtitle: Deutschland 2023
  description: "Weltweit zählt Marlon Brando zu den bekanntesten Schauspielern des 20. Jahrhunderts. Seine Rollen in \"Apocalypse Now\" oder \"Der Pate\" bleiben unvergessen. Politisch engagierte er sich besonders für die US-Bürgerrechtsbewegung. Doch Brandos große Liebe galt der Wissenschaft. \n1966 erwarb er das Südseeatoll Tetiaroa, um dort ein ökologisches Modell zu entwickeln: Es sollte geforscht werden, ein Meeresschutzgebiet und ein Hotel entstehen. Viele Hindernisse stellten seine ambitionierten Pläne infrage. \nDie Dokumentation erzählt die Geschichte von Brando und seinem \"Paradies\"."
