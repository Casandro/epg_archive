  title: Corleone. Pate der Paten (2/2)
  subtitle: Der Fall
  description: "Salvatore \"Totò\" Riina: Sohn eines armen Bauern aus Corleone, der mit 52 Jahren durch Mord und Terror zum unumschränkten Herrscher der sizilianischen Mafia wird. Tommaso Buscetta: ein \"Verlierer\" des Mafiakrieges, der seinen Rachedurst nicht stillen kann. Giovanni Falcone: der Richter, dem es gelingt, Buscetta zur Kooperation mit der Justiz zu bewegen. Falcone initiiert den ersten Prozess gegen die sizilianische Mafia, bei dem Riina zu einer lebenslangen Freiheitsstrafe verurteilt wird. \n\nDie zweiteilige Dokumentation beleuchtet den blutigen Mafia-Krieg, der zwischen 1977 und 1994 mitten in Europa geführt wurde."
