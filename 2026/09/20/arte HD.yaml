  title: Versailles - Palast des Sonnenkönigs
  subtitle: Frankreich 2018
  description: 'Von den irrwitzigen barocken Fantasiegebilden über die Luxusgemächer der Höflinge bis zum Privatmuseum des Königs: Das heutige Versailles hat kaum noch Ähnlichkeit mit dem Schloss des Sonnenkönigs. Bereits unter seiner Herrschaft löschte es unaufhörlich seine eigene Geschichte aus. Zurzeit wird die versunkene Vergangenheit mit modernsten Mitteln wie Restaurierung und Digitalisierung Tausender von Schlossplänen erforscht. Durch die aufwendige Rekonstruktion der verschwundenen Räume kommen vergessene Bauabschnitte zum Vorschein, entfalten unbekannte Bauten ihren Reiz und offenbart sich die Nutzung der privatesten Räume des Schlosses.'
