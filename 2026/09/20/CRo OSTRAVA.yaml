  description: Ludwik s nelibostí sleduje drancování dolů. Ani Leon se s novými poválečnými pořádky nedokáže vyrovnat, a tak udělá zásadní životní rozhodnutí. Ženka se ocitá v koutě, protože rozvod se Szczepanem se zdá být nereálný. Netuší, jak má žít, a útěchu najde tam, kde by to sama nečekala. Premiéra 4. části četby ze závěrečného dílu trilogie Karin Lednické Šikmý kostel.
