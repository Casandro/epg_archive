  title: Die Küsten der Ostsee - Baltikum
  subtitle: Die Küsten der Ostsee - Baltikum
  description: 'In Estland startet die Reise in Tallinn. Von hier aus geht es zu zwei außergewöhnlichen Inseln, die unterschiedlicher nicht sein könnten. Auf Saaremaa werden Luxus-Yachten für den europäischen Markt gebaut, während auf Kihnu die Zeit stehen geblieben zu sein scheint. Hier leben Frauen, die ihre eigene Sprache, ihre eigenen Trachten und ihre ganz eigenen Transportmittel haben: alte Motorräder, M72, aus Sowjetzeiten. Aivar Ruukel wohnt im Soomaa Nationalpark, einer einzigartigen Wasserwelt, die er am liebsten mit seinem selbst gebauten Einbaum erkundet. Kurz hinter der Grenze nach Lettland fängt ein Fischer eine Delikatesse: Neunaugen, aalartige Wirbeltiere, die selten geworden sind in Europa. Im Hafen von Riga bildet die Seefahrts-Akademie die Schlepper für die großen Fähren aus Skandinavien aus. In Litauen werden Auerochsen eingefangen. Das Projekt rettet die Tiere vor dem Aussterben und erforscht die besten Aufzuchtmethoden. Die Reise endet auf der Kurischen Nehrung, einer zwei Kilometer langen Wanderdüne, auf der die Grenze zum russischen Kaliningrad verläuft. Eine junge Grenzerin kontrolliert das weitläufige Gebiet mit dem Quad und soll mit ihren Kollegen den Schmuggel nach Europa verhindern. DE 2011'
  ageRating: 6
- eventId: 971626
  start: 2026-09-20T07:15:00Z
  stop: 2026-09-20T08:07:00Z
  title: Die Küsten der Ostsee - Polen
  subtitle: Die Küsten der Ostsee - Polen
  description: 'Die letzte Episode auf der Reise rund um die Ostsee startet am Frischen Haff. Hier trainiert die Vizeweltmeisterin im Freestyle-Kiten, Karolina Winkowska. Über ein Relikt aus den Zeiten der Industrialisierung, dem Oberländischen Kanal, führt die Helikopterroute nach Danzig. Die Geschichte ist in Danzig allgegenwärtig. Auf der Werft nahm die Solidarno-Bewegung ihren Anfang: die Geburtsstunde des demokratischen Polens. Fotograf Micha Szlaga dokumentiert den Wandel seines Landes anhand einer Langzeitstudie der Werft. Heute trifft er statt ölverschmierter Blaumänner Künstler, die sich auf dem Gelände am Hafen ihre Ateliers eingerichtet haben. In der Danziger Bucht betaucht Polens ältester Taucher, Lech Nowicz, die Wracks, die hier seit dem Zweiten Weltkrieg überall verstreut liegen. Weiter nördlich ist die Danziger Bucht die Heimat von Schweinswalen. Forscher sichern ihr Überleben durch Schallzäune, die sie von den Netzen der Fischer fernhalten. Entlang der Küste über die Dünen von eba und Ustka führt die Reise nach Rusowo und Stettin. Hier wird eine alte polnische Tradition gehegt: die Pferdezucht. Jan Bobiks Familie führt das Hannoveraner-Gestüt Nowielice schon in der vierten Generation. DE 2011'
  ageRating: 6
- eventId: 971635
