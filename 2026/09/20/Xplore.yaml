  title: Die Ostküste der USA - Sonnenstaat Florida
  subtitle: Die Ostküste der USA - Sonnenstaat Florida
  description: 'Von den Keys, der Perlenkette am südlichen Zipfel, geht es vorbei an den Everglades und Miami zu Amerikas Weltraumbahnhof. Dann in den unbekannten Norden, Richtung Georgia. Nirgendwo lebt sich der American Way of Life so gelassen wie an den Traumstränden Floridas. Auf den Florida Keys, einer Inselkette ganz im Süden, zeigen sich die USA von ihrer lockeren Seite. Das Klima ist karibisch, der Lebensstil tiefenentspannt. Vor den Keys verlief im 17. Jahrhundert die Route der spanischen Silberflotte, die Schätze aus den Kolonien nach Europa schaffte. Immer wieder wurden die Galeonen von Hurrikans überrascht und kenterten. Nach den versunkenen Reichtümern sucht Kim Fisher, Berufs-Schatztaucher und Sohn von Mel Fisher, der bereits Gold, Silber und Smaragde im Wert von Hunderten Millionen Dollar barg. Auf Tauchgang geht auch Bette Zirkelbach, sie will einen Schatz anderer Art bewahren: im Turtle Hospital versorgt sie verletzte Meeresschildkröten und bereitet sie auf ihre Freilassung vor. Mit der Meeresbiologin Kayla Ripple geht es unter Wasser zu einer Korallen-Aufzuchtstation, mit Jesse Kennon in die Wildnis der Everglades. Aber der Sunshine State birgt auch eine wechselvolle Geschichte. St. Augustine mit seiner Befestigungsanlage, dem Castillo de San Marcos, ist mit über 500 Jahren die älteste von Europäern gegründete Siedlung in den USA. An diesem historischen Ort begibt sich der Stadtarchäologe Carl Halbirt auf Spurensuche. Florida überrascht mit einsamen Stränden, unverfälschter Natur und dem Erbe der europäischen Siedler. US 2014'
  ageRating: 6
- eventId: 971649
