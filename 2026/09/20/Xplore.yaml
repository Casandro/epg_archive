  title: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  description: Der bekannte Tatort-Schauspieler Richy Müller reist mit Ihnen nach "Down under", nach Australien. Dabei begibt er sich auf spannende Entdeckungstour quer durch die Bundesstaaten Victoria und South Australia. In Victoria lockt zunächst die Fahrt entlang der Küste, vorbei an der berühmten Felsformation der "Zwölf Apostel". Eine Koala-Auffangstation bietet einen passenden Zwischenstopp, um sich über die Lebensumstände der possierlichen Baumbewohner zu informieren. In Melbourne lernt Richy Müller von einem der berühmtesten Köche des Landes,  Mark Olive, das Kochen ohne Salz. Wer hätte gedacht, dass mitunter einfache Kräuter als Würze ausreichen. Richys Känguruh-Steak schmeckt jedenfalls köstlich. Von Victoria geht es weiter nach South Australia, u.a. in die Kleinstadt Parachilna, sofern man diesen Ort überhaupt Stadt nennen kann. Hier lebt nämlich kaum mehr als ein Dutzend Menschen. Ein Kuriosum! Doch Richy zieht es bald weiter zur Küste South Australias und zu einem gemeinsamen Bad mit Delphinen. DE 2012
  ageRating: 6
- eventId: 971730
  start: 2026-09-20T17:25:00Z
  stop: 2026-09-20T17:45:00Z
  title: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  subtitle: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  description: Mittelalterliche Städte und alte Windmühlen prägen das Bild des Emslandes. Zusammen mit Schauspieler Norman Kalle erkunden wir die vielseitige Region. Egal ob auf dem Elektroroller oder mit dem Kanu, die Region hat viel zu bieten. Außerdem ist die Region ein Paradies für Golfer. Der Schauspieler probiert Kräutertorte und drückt die Schulbank in der Kornakademie. Wasserski fahren ist deutlich schwerer als es aussieht, Norman Kalle probiert es einfach so oft bis es klappt und macht dann doch eine gute Figur auf den Brettern. Ein Besuch der Meyer Werft in Papenburg darf nicht fehlen. Denn hier entstehen die großen Kreuzfahrtschiffe. Diese müssen sich nach dem Stapellauf ihren Weg durch die recht enge und flache Ems bahnen. Zum Abschluss seiner Reise besucht Norman Kalle das Barockschloss Clemenswerth und tauch in die Welt der Adligen ein. DE 2011
  ageRating: 6
- eventId: 971731
