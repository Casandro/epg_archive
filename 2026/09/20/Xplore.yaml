  title: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  description: 'VIP Trip - Prominente auf Reisen 5: In dieser Folge von VIP Trip nimmt uns Fernsehkommissar Jürgen Heinrich mit nach Australien - genauer gesagt, in den bevölkerungsreichsten Bundesstaat New South Wales. Zuerst erleben wir die heimliche Hauptstadt Australiens aus luftiger Höhe. Mit dem Helikopter starten wir unsere Tour und erhalten einen beeindruckenden Ausblick auf Sydney - ein ganz anderes Bild der Metropole. Jürgen Heinrich bestaunt aber auch das berühmte Opernhaus Sydney, eines der wohl bekanntesten Wahrzeichen der Stadt. Entspannung findet er dann in der Sonne an Sydneys  Stadtstrand und Surferparadies Bondi Beach. Wir begleiten den Schauspieler außerdem bei einer Schiffstour auf der Suche nach Delfinen und bei seinem Versuch im "Stand Up Paddling". Gerade Abenteurer kommen in New South Wales auf ihre Kosten: bei rasanten Kajaktouren oder  bei  Wanderungen auf abgelegenen Routen in den Eukalyptuswäldern der Blue Mountains. Die Blue Mountains waren seit mindestens 14.000 Jahren von den australischen Ureinwohnern, den Aborigines, bewohnt. Noch heute entlocken sie dem Didgeridoo, ihrem traditionellen Musikinstrument, seltsam anmutende Klänge. Jürgen Heinrich versucht es auch. DE 2012'
