  title: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  description: 'VIP Trip - Prominente auf Reisen 5: Der aus "Die Bergretter" bekannte TV-Schauspieler Sebastian Ströbel nimmt die Zuschauer mit auf eine abenteuerliche Entdeckungsreise durch Israel. Eine der ältesten Städte der Welt darf bei dieser Tour natürlich nicht fehlen und so beginnt die Reise in Jerusalem. Grabeskirche, Felsendom und Klagemauer sind ein Muss für jeden Israel-Besucher und auch Sebastian Ströbel lässt sich von der besonderen Atmosphäre dieser Stadt verzaubern. Von diesem Zentrum und dem Ursprung dreier Weltreligionen führt ihn sodann der Weg knapp 300 Kilometer weiter südlich nach Eilat, einem beliebten Badeort mit einem 12 Kilometer langen Küstenabschnitt und gleichzeitig Israels einzigem Zugang zum Roten Meer. In der etwas weiter nördlich gelegenen Negev-Wüste kommt der im Alpinismus erfahrene Sebastian Ströbel dann voll auf seine Kosten. Beim Abseilen von einem Felsenturm im Ramon-Krater geht es ganze 30 Meter in die Tiefe: für den sportlichen Schauspieler absolut kein Problem. Überhaupt gibt es in der Wüste Negev eine Menge zu entdecken und so verbringt Sebastian Ströbel hier viel Zeit beim Mountain-Biking. Von besonderem Interesse sind für Ihn uralte Salzhöhlen und Minen, die schon in der Antike ausgebeutet wurden. Dabei genießt Sebastian bei süßem Tee die Gastfreundschaft der Beduinen. DE 2018'
  ageRating: 6
- eventId: 971753
