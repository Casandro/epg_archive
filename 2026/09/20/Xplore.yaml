  title: Wanderlust! - Der Cornwall-Küstenpfad, Großbritannien
  subtitle: Wanderlust! - Der Cornwall-Küstenpfad, Großbritannien
  description: 'Der Küstenpfad im englischen Cornwall bietet Klippen, Buchten, Fischerdörfer, dazu englische Lebensart und jede Menge maritime Geschichte. Er umrundet die gesamte Südwestspitze Englands, 1.014 km weit. Bradley Mayhew, britischer Autor von Reise- und Trekkingführern, wandert die schönsten 280 Kilometer - vom Künstlerstädtchen St. Ives über Land''s End bis zur Hafenstadt Plymouth. Bradley interessiert das echte Cornwall. Zu Fuß findet er es wie von allein. Er begegnet Menschen, die für Geschichte, den Alltag und das Lebensgefühl Cornwalls stehen. Bradley trifft sie zwischen geschichtsträchtigen Schlössern, einstigen Schmugglerverstecken und den Gärten Cornwalls. Der Küstenweg entstand aus den Pfaden der Schmuggler und Wrackplünderer. Dafür war die Küste einst berüchtigt. Die gesunkenen Schiffe auf dem Meeresgrund finden kaum Platz auf den Seekarten, so zahlreich sind sie. Nach St. Ives quert der Weg einen Landstrich, wo einst Zinn, Silber und Kupfer geschürft wurden. Nach Land''s End, der äußersten Südwestspitze Englands, führt der Wanderweg nach Osten. Bradley trifft Kapitän Andrew von der Küstenwache, die es dort seit dem 17. Jahrhundert gibt. Nach einem Blick in die Fischauktion von Newlyn, dem größten Fischereihafen Cornwalls, liegt die Festungsinsel St. Michael''s Mount am Pfad. Der Verwalter ist ein Schulfreund von Bradley. Er führt ihn exklusiv durch den Adelswohnsitz. Der Pfad streift viele "Landmarks" von Cornwall: Keynance Cove, den Leuchtturm Lizard Point und etliche cornische Gärten aus viktorianischer Zeit, darunter die "Vergessenen Gärten von Heligan". Die Coast-Path Rangerin Julie zeigt Bradley die Kunst des Barfuß-Laufens. Fischer Tonks nimmt ihn mit auf Krabbenfang. Landschaftsmaler Dave ist tiefenentspannt, das wäre man auch gerne. Und Chefgärtnerin Nicola erzählt über Leih-Ananas im 19. Jahrhundert. Nach zwei Wochen endet die Wanderung in der Hafenstadt Plymouth. DE 2014'
