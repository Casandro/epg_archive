  title: Die Küsten der Ostsee - Finnland
  subtitle: Die Küsten der Ostsee - Finnland
  description: 'Die Episode beginnt mit einem Besuch bei der Hovercraft-Patrouille der finnischen Grenzpolizei im Bottnischen Meerbusen. Weiter geht es von Vaasa nach Kaskinen und Pori. Hier leben die Menschen noch urfinnische Traditionen: Tangotanzen und Saunieren. Mit seiner mobilen Sauna fährt Student Hannu Poussu überall dort hin, wo seine Freunde gerade Lust haben zu schwitzen. Die finnischen Schären um Hanko sind das Revier von Felsenforscherin Helena Taskinen, die die Inschriften gestrandeter Kapitäne für die Nachwelt erhält. Nicht weit von ihr arbeitet Janne Castrén, eine Mischung aus Schärendoktor und James Bond 007, wie er selbst sagt. Mit seinem Schnellboot ist er im Sommer weit und breit der einzige Arzt für die Inselbewohner. In Kotka nahe der russischen Grenze geht Antti-Pekka Kangas einer ganz besonderen Sportart nach: Er ist Unterwasser-Rugby-Spieler. Und im Hafen von Helsinki wird die Fähre nach Estland von Ulrika Bachér auf den Weg gebracht. DE 2011'
  ageRating: 6
