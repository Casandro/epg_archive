  stop: 2026-09-20T10:07:00Z
  title: Die Ostküste der USA - Die Südstaaten
  subtitle: Die Ostküste der USA - Die Südstaaten
  description: 'Sklaverei und Bürgerkrieg prägten einst ihren Alltag, heute gelten die Südstaaten als besonders befreit. Die Reise geht von Georgia über die Carolinas bis Virginia. Sie endet in Höhe der Hauptstadt Washington. Hosley Hall ist Landwirt in Georgia. Zwischendurch zog es ihn für ein paar Jahre als Musiker in die Army, aber auf die Dauer war das nichts. Dann doch lieber Gefleckte Wachsbohnen ziehen, Red Ripper Kuhbohnen, Koch-Erdnüsse und andere klassische Südstaaten-Gewächse. Die Reise führt auf die Golden Isles und ihre ursprüngliche Küstenlandschaft mit dichten Wäldern, unberührten Sandstränden und Salzmarschen. Vor St. Simons Island ist Cap Fendig als Seebestatter im Einsatz, etwa 12 Mal im Monat gibt er Verstorbenen das letzte Geleit, bevor ihre Asche vom Wind aufs Meer getragen wird. Auf Hilton Head Island in South Carolina arbeitet Lara Neece an ihrem Segelboot und ihrem Traum: ein Törn auf die Bahamas und bis nach Neuseeland. Der "Friedhof des Atlantiks" vor den Outer Banks in North Carolina ist berüchtigt, mehr als 1.000 Schiffe sind der heimtückischen Strömung zum Opfer gefallen und gesunken. Hier lebt Nema Triplett, die Patenschaften für Wracktaucher übernimmt. Und bei Kitty Hawk forscht Professor Jesse McNinch an den Gesetzen des Ozeans. Wie treffen Stürme auf die Küste, wie kann man sich vor Flutwellen schützen? In Onancock, Virginia, bewirtet Johnny Mo seine Gäste mit regionaler Küche und Songs, die er auf seiner Gitarre zum Besten gibt. Sie handeln vom "Living on the Eastern Shore", vom Leben an der Ostküste, von was sonst? US 2014'
