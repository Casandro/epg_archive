  title: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  description: Dort wo heute Abu Dhabi liegt, war vor 50 Jahren praktisch nichts als Wüste. Mit dem Ölboom der Vereinigten Arabischen Emirate in den 60er Jahren des vergangenen Jahrhunderts jedoch entwickelte sich auch Abu Dhabi zu  einer Destination von Weltruf. Eva Habermann erkundet mit uns die vielfältige Metropole.   Eva lässt sich zunächst  von Scheich Suroor bin Mohammed Al Nahyan die Geschichte von Abu Dhabi erläutern. Der Scheich ist Mitglied der Herrscherfamilie und gehört zu den einflussreichsten Persönlichkeiten Abu Dhabis. Anschließend macht sich Eva auf den Weg zur drittgrößten Moschee der Welt. Die Scheich Zayid Moschee beeindruckt ihre Besucher mit weißem Marmor, unzähligen Dekorationen in Perlmutt und riesigen handgewebten Teppichen. Abu Dhabi verfügt neben imposanten religiösen Stätten und Wolkenkratzern auch über einzigartige Naturreservate. Eva Habermann entscheidet sich daher zu einem Abstecher zur Mangrovenküste. Zu Evas Glück fehlt dann nur noch ein Sonnenuntergang über der durchglühten Sandwüste. DE 2014
