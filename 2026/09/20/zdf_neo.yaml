  description: |-
    Deutschland 2026
    PFAS sind in aller Munde - das gilt sogar buchstäblich. Die sogenannten "Ewigkeitschemikalien" sind längst überall, sogar in unserem Blut.

    Wegen der Gefahren für Mensch und Umwelt fordern viele Verbände ein Verbot der gesamten Stoffklasse der PFAS. Aber die extrem stabilen Verbindungen haben unsere moderne Welt erst möglich gemacht und sind ein wesentlicher Baustein bei der Energiewende.
