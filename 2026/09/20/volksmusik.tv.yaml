  description: In dieser frischen Episode der 'Schatzkiste der Volksmusik', präsentiert von Michael Niekammer, entführen uns die Stimmen Der Berge in das fesselnde Musikuniversum der Volksmusik. Die einfühlsame Moderation von Michael Niekammer begleitet die Zuschauer durch eine facettenreiche Auswahl der besten Volksmusikstcke der Gruppe und verspricht eine nostalgische Reise durch die Hhepunkte ihrer beeindruckenden Karriere.
