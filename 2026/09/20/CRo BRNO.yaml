  title: Toulky Josefa Veselého
  description: 'V úvodu pořadu bude jeho autor tradičně vzpomínat na okolnosti jednoho z mnoha svých natáčení. Tetokrát půjde o zhruba čtyři desítky let staré pásmo, které pátralo Po stopách lišky Bystroušky. Je jasné, že v ukázce z něj uslyšíte ledacos zajímavého o Těsnohlídkovi, Janáčkovi a bílovických lesích. Jako další Kdotobyl, tedy neurčitá a záhadná postava, se představí žena, lékařka. Pro více indicií z jejího života budete muset poslouchat. Lékařství, konkrétně boji s neštovicemi, je věnován i díl Toulek českou minulostí, který zazní. Jmenuje se: Vakcína je latinsky "kravská".'
