  title: WDR 2 Jörg Thadeusz
  subtitle: 'Moderation: Jörg Thadeusz'
  description: "Manfred Lütz, Psychiater und Autor \nPsychologie ist in der gegenwärtigen Politik so wichtig wie nie zuvor, allerdings wird sie einfach nicht richtig eingesetzt. Zu diesem Urteil kommt der Psychiater und Bestsellerautor Manfred Lütz. Wieso es nichts bringt, Wähler zu beschimpfen und generell auch im Alltag immer nur über Probleme, statt über Lösungen zu sprechen, darum geht es in seinem neuen Buch  \"Churchills Augen. Psychologische Lichtblicke in irren Zeiten\".\nManfred Lütz studierte Medizin, Katholische Theologie und Philosophie, bis 2019 war er Chefarzt des Alexianer-Krankenhauses in Köln. Seit 2002 widmet er sich aber auch in recht unterhaltsamen Büchern den doch so schweren Fragen wie \"Gibt es Gott?\" oder \"Behandeln wir in der Psychiatrie womöglich die Falschen?\". Seine Bücher werden Bestseller.  Manfred Lütz tritt immer wieder im Kabarett auf und ist als Experte für Kirchenfragen in Talkrunden zu erleben. Darüber hinaus ist er Ritter des päpstlichen Gregoriusordens.\nBei WDR 2 Jörg Thadeusz spricht Manfred Lütz über die aktuell irren Zeiten, historische Parallelen und wie man trotz Krisen ein gutes Leben führen kann.\nDarin:<br/>zur vollen Stunde WDR aktuell"
