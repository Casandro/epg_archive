  title: Přímo z místa
  description: Hraniční kameny vztyčovali lidé v krajině odpradávna. Dodnes se některé z nich dají v lesích a na loukách najít. Asi nejvíce jich v 17. - 20. století stačili vztyčit kolem pozemků rodu knížat z Lichtenštejna. Právě po těchto artefaktech dnes pátrají badatelé a vezmou vás s sebou nejen do terénu, ale i do historie hraničníků jako takových. Připravil Miroslav Kobza.
