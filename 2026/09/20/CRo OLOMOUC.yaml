  title: Pochoutkový rok
  description: Je tu další díl narozeninového Pochoutkového roku. V něm vás čeká recept, který se stal třetím nejlepším v roce 2025 podle poroty. V rámci letošního jubilejního desátého roku vysílání naší soutěže jsme totiž požádali osobnosti Pochoutkového roku, aby recepty, které kdysi vyhrály, uvařily a upekly podle svého. A tak tentokrát bude péct dvoubarevné tvarohové řezy ve své úpravě kuchař Ivan Vodochodský. Kromě toho se dozvíte, jaké velké překvapení pro vás chystají Josef Maršálek a Patrik Rozehnal. A dál budeme slavit 10 let našeho pořadu s hosty, soutěží a přípitkem v radě z etikety.
