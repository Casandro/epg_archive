  title: Planet Weltweit - Polen - Ärger im Revier
  subtitle: Planet Weltweit - Polen - Ärger im Revier
  description: "Die Region von Suwalki, nordöstlich der polnischen Masuren, ist eine der wenigen Gegenden Europas mit noch intakter Natur: In den Wäldern leben Biber, Hirsche und Wildschweine, in den Seen tummeln sich Hechte und Aale. Die Menschen leben seit Generationen von Jagd und Fischfang. Manche legal, viele illegal. Um die Fischzucht professionell zu betreiben, hat der ehemalige Förster Andrzej Falkowski vom Staat einige Seen gepachtet. Dies hindert seine Nachbarn jedoch nicht, weiter in den Seen fischen. Der Streit zwischen Pächter und Bauern tobt seit Jahren. Wir haben die Region besucht und beobachtet, wie die Bewohner versuchen, den alten Konflikt zu lösen.\nLange Zeit waren die Wälder und Seen Polens Eigentum von König und Adel. Im 19. Jahrhundert fielen sie unter die Herrschaft des Zaren Alexander II. Um die polnischen Adeligen für ihre Freiheitskämpfe zu bestrafen, erweiterte er das Fischereirecht auf den Seen auf die Bauern, die ihm gegenüber loyal geblieben waren. Dieses Fangrecht wurde bis heute nicht offiziell aufgehoben, weshalb die heimischen Familien weiter darauf bestehen - auch wenn der Staat die Seen und Wälder inzwischen privat verpachtet hat. Pächter und Anlieger sehen sich beide im Recht, und das polnische Gesetz bietet keine klare Lösung. So müssen Jung-Unternehmer wie Andrzej Falkowski allein sehen, wie sie mit dem Problem fertig werden. \nEine Strategie besteht darin, potenzielle Fischdiebe und Wilderer zu beschäftigen, ihnen Arbeit und damit Brot zu verschaffen. Leszek Michalkiewicz, Bauer und Vater von fünf Kindern, ist einer davon. Er hat gelernt, sich im Leben durchzuschlagen. Sein brüchiges Haus hat er zu sozialistischen Zeiten selbst gebaut, die Mangelwaren Zement und Holz gegen illegal geschossenes Wild oder heimlich gefangenen Fisch getauscht. Seine sieben Hektar Getreideacker bringen nur kümmerlichen Ertrag. DE 2006"
