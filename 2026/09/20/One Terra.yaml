  title: Planet Weltweit - Im Land der schwarzen Witwen
  subtitle: Planet Weltweit - Im Land der schwarzen Witwen
  description: "Die Schwarze Witwe hat einen schlechten Ruf - kein Wunder, denn das Gift dieser Spinnenart ist 15-mal stärker als das der Klapperschlange. Doch kann diese Substanz, als Medizin eingesetzt, auch Leben retten. Um an das Gift zu gelangen, geht das Ehepaar Chuck und Anita Kristensen regelmäßig in der Wüste von Arizona auf Spinnenjagd. Neben den Schwarzen Witwen leben hier unzählige Gifttiere wie die Braune Einsiedlerspinne, Skorpione oder Riesentausendfüßer. Die Kristensens halten und züchten die gefangenen Tiere auf ihrer Farm. Dort werden sie gemolken und ihr Gift an Forschungseinrichtungen verkauft. Diese entwickeln daraus neue Medikamente - etwa gegen Herzerkrankungen oder bestimmte Krebsarten. Wir begleiten die Spinnenbändiger bei ihren Fangaktionen in der Wüste und der Zucht der hochgiftigen Tiere. \n\nIm Hochsommer steigen die Temperaturen in der Wüste von Arizona auf bis zu 50 Grad Celsius. Regen fällt selten. Nur wenige Lebewesen können diesen extremen Bedingungen trotzen. Unter anderem Spinnen. Sie haben einmalige Überlebenstechniken entwickelt, die sie lange Zeit ohne Wasser und Nahrung auskommen lassen. Starke Gifte ermöglichen ihnen, blitzschnell Beute zu schlagen; außerdem schützen sie die Spinnen vor Fressfeinden. Menschen haben nichts zu befürchten, solange sie die Tiere in Ruhe lassen oder wissen, wie man mit ihnen umgeht. Für Chuck und Anita Kristensen ist dieses Wissen überlebenswichtig. Regelmäßig fangen sie Schwarze Witwen und andere Gifttiere, um sie auf ihrer Farm zu melken. Seit über 20 Jahren betreibt das Ehepaar sein kleines, unter Fachleuten sehr geschätztes Unternehmen Spiderpharm. Neben den gefangenen Tieren beherbergt das Labor Nachzuchten sämtlicher Spezies - außer Schwarzen Witwen auch Vogelspinnen wie die imposante King Baboon, Skorpione oder Riesentausendfüßer. Insgesamt 70.000 Tiere tummeln sich in den Räumen von Spiderpharm.  DE 2006"
  ageRating: 6
