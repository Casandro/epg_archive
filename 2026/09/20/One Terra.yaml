  title: Planet Weltweit - Unterwegs mit der Irish Coast Guard
  subtitle: Planet Weltweit - Unterwegs mit der Irish Coast Guard
  description: |-
    County Kerry im Westen Irlands gehört zu den ursprünglichsten und für viele Menschen auch schönsten Regionen der Britischen Inseln. Doch die raue Küste fordert jedes Jahr ihre Opfer: Freizeitsegler, Surfer und Schwimmer unterschätzen die Kraft des Ozeans. Fischer riskieren in der tosenden See zuviel und geraten in Seenot. An Land verleiten die spektakulären Klippen manchen Wanderer, zu nah an die Felskante zu treten. Bei einem Notfall rücken die Freiwilligen der traditionsreichen irischen Küstenwache aus. Per Rettungsboot, Hubschrauber und mit Spürhunden suchen die Helfer nach Verletzten und Verschollenen. Wir haben Lebensretter der Dingle Coast Guard begleitet.

    Ein Mann ist von den Klippen gestürzt und liegt nun leblos auf den umspülten Felsen. Ein anderer Mann seilt sich langsam die steile Wand hinunter, um den Verletzten zu bergen. Er wird von seinen Kollegen gehalten, die das Seil Stück für Stück nachreichen. 21 Lebensretter umfasst das Team der Dingle Coast Guard. Mindestens einmal in der Woche treffen sie sich zum Training. Dieses Mal hat Einsatzleiter Frank Heidtke eine Kletterübung an den Klippen von Dingle angesetzt. Die Klippen an der Westküste Irlands gehören zu den rauen Gegenden dieser Welt. Sturmböen vom Atlantik fegen mit ungebrochener Kraft über das Festland, Regen peitscht auf den nackten Fels. Bis zu 200 Meter ragen die Klippen an einigen Stellen fast senkrecht aus dem Atlantik. Diese wilde Küste ist das Einsatzgebiet der Irish Coast Guard. Und die Lebensretter haben an diesem kleinen Küstenort viel zu tun. Neugierige Touristen, risikofreudige Abenteurer, aber auch sorglose Einheimische unterschätzen die Gefahren der gewaltigen Klippen und wagen sich oft zu dicht an den Abgrund. Schon ein unachtsamer Schritt, eine heftige Windböe kann die leichtsinnigen Menschen auf dem rutschigen Fels ins Straucheln bringen und in die Tiefe stürzen lassen. In solchen Fällen sind die Lifeguards die letzte Hoffnung für die Betroffenen. DE 2010
