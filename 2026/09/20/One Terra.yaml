  title: Planet Weltweit - Mexiko - Die edlen Reiterinnen
  subtitle: Planet Weltweit - Mexiko - Die edlen Reiterinnen
  description: 'Die "Charreria" ist Mexikos Volkssport. Es ist eine Art Rodeo, bei dem die Charros, die mexikanischen Cowboys, ihre Künste beim Reiten, Fangen mit dem Lasso, beim Bullenreiten und beim Einreiten ungezähmter Pferde unter Beweis stellen. Seit den 1950er Jahren haben Frauen ihre eigene Disziplin bei der Charreria: Die "Escaramuza", was soviel bedeutet wie Geplänkel oder Scharmützel. Acht Reiterinnen in prächtigen, traditionellen Kleidern und im Damensattel vollführen dabei im Galopp eine Choreografie aus ebenso halsbrecherischen wie eleganten Figuren. GEO Reportage hat die stolzen Reiterinnen begleitet Die "Escaramuza" gilt als eigene Sportart und ist inspiriert von den "Adelitas", den Soldatinnen, die während der mexikanischen Revolution von 1910 an der Seite der Männer kämpften, um die Diktatur des Machthabers Porfirio Dias zu beenden. Seit 1991 ist "Escaramuza" offiziell ein Wettkampfsport. Zunächst treten die regionalen Reiterteams der mexikanischen Bundesstaaten gegeneinander an. Es geht um Schnelligkeit, Präzision, Eleganz und das Gesamtbild des Teams. Und darum, das Escaramuza-Finale im Spätherbst in Zacathecas zu erreichen. "Las alteñitas", die Hochländerinnen, gehören zu den besten Escaramuza-Teams Mexikos. Zusammen mit ihrem Trainer José Eduardo Moreno bereiten sie sich auf den letzten Qualifikations-Wettkampf in Queretaro vor. Alle stehen unter Druck, beim Training, bei den direkten Vorbereitungen und während der Wettkämpfe. Bei den Reiterinnen geht es immer auch um Werte und Themen, die im Leben der alten mexikanischen Familien eine Rolle spielen: Stolz, Ansehen und Passion, die Rolle der Frau, die Frage nach Tradition, Moderne und Identität. Wie weit werden es die Frauen vom Team "Las alteñitas" in diesem Jahr bringen?  DE 2018'
