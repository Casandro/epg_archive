  title: Planet Weltweit - Die Feuerflieger von Valencia
  subtitle: Planet Weltweit - Die Feuerflieger von Valencia
  description: Jedes Jahr verliert Spanien mehrere zehntausend Hektar Wald durch Feuer. Besonders in den heißen Sommermonaten wüten unzählige Feuer das ausgetrocknete Land und vernichten ganze Regionen. Gelingt es nicht, die Feuer stoppen, wird in 50 Jahren die Hälfte der spanischen Wälder für immer verloren sein. Um diese Entwicklung aufzuhalten, bekämpft eine Feuerpatrouille aus Hubschraubern und Löschflugzeugen Brände bereits aus der Luft. Vor wenigen Minuten hat Joaquim Miniana - genannt Chimo - den Einsatzbefehl erhalten. Er soll eine breite Feuerfront in einem Bergwald bekämpfen. Die Feuerleitstelle hat Luftunterstützung angefordert. Mit drei Tonnen Löschmittel beladen hebt Chimo ab. Beim Start kennt der Pilot selten mehr Details als seinen Einsatzort. Starke Winde treiben die Feuerwalze durch das ausgetrocknete Nadelholz, in Sekunden brennen ganze Bäume nieder. Chimo fliegt mit über 200 Stundenkilometern in wenigen Metern Höhe direkt auf die Spitze des Feuers zu. Das Flugzeug verliert durch den Abwurf fast die Hälfte seines Gewichts. Der Pilot nutzt den plötzlichen Auftrieb, um die Gefahrenzone so schnell wie möglich zu verlassen. An manchen Einsatztagen während der Feuersaison starten und landen die Flugzeuge bis zu 20 Mal. Seit den 1960er Jahren hat sich die Zahl der Waldbrände in Spanien verzehnfacht, heute brennt es bis zu 25.000 Mal pro Jahr. Hauptgrund dafür sind die durch Bewirtschaftung immer stärker austrocknenden Böden. Dennoch haben die Löschmannschaften Erfolge aufzuweisen - durch schnelle Ortung der Brandherde können viele Feuer frühzeitig bekämpft werden. Moderne Technik ermöglicht außerdem ein effizienteres Vorgehen. Dennoch bleibt der Job einer der gefährlichsten Berufe überhaupt - jedes Jahr verunglücken Piloten bei ihrer Arbeit. Auch Chimo hat bereits einen schweren Unfall hinter sich. Ein Ereignis, das ihn vorsichtig gemacht hat. DE 2008
