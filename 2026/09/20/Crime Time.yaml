  title: Sea Patrol - Captain Kate
  subtitle: Sea Patrol - Captain Kate
  description: Die Crew der Hammersley leistet Aufbauhilfe auf den Samaru-Inseln, als plötzlich eine Mörsergranate einschlägt. Mike erhält Order, die Verletzen auf der Insel Tampu abzusetzen, als Jim um ein Schlauchboot für seine SAS-Einheit bittet. AU 2008
  ageRating: 12
- eventId: 971529
  start: 2026-09-20T01:10:00Z
