  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Felix Mendelssohn Bartholdy: Sinfonie Nr. 3 a-Moll - "Schottische" (Staatskapelle Dresden: Colin Davis); Franz Liszt: Offertorium (Friedemann Eichhorn, Violine; Rolf-Dieter Arens, Klavier); Arvo Pärt: "Fratres" (MDR-Sinfonieorchester: Kristjan Järvi); Carl Loewe: Streichquartett F-Dur, op. 24, Nr. 2 (Hallensia Quartett); Philip Lasser: "The Circle and the Child" (Simone Dinnerstein, Klavier; MDR-Sinfonieorchester: Kristjan Järvi)

    2.03  Das ARD-Nachtkonzert (II)

    Wolfgang Amadeus Mozart: Sinfonia concertante Es-Dur, KV 364 (Pamela Frank, Violine; Tabea Zimmermann, Viola; Münchener Kammerorchester: Christoph Poppen); Ludwig van Beethoven: Sonate Es-Dur, op. 31, Nr. 3 (Jean-Efflam Bavouzet, Klavier); Johann Nepomuk Hummel: Fagottkonzert F-Dur (Dag Jensen, Fagott; Kölner Rundfunk-Sinfonie-Orchester: Werner Andreas Albert); Georg Philipp Telemann: Quartett G-Dur (Florilegium); Reynaldo Hahn: "Le bal de Béatrice d'Este" (Thomas Peter, Trompete; Chloé Ducray, Maureen Thiébaut, Harfe; Alain Jacquon, Klavier; Romain Maisonnasse, Pierre-Olivier Schmitt, Schlagwerk; Ensemble Initium)

    4.03  Das ARD-Nachtkonzert (III)

    Amanda Maier: Violinkonzert d-Moll (Cecilia Zilliacus, Violine; Västerås Sinfonietta: Kristiina Poska); Dmitrij Bortnjanskij: Quintetto (Pratum Integrum Orchestra); Joseph Haydn: Sinfonie Nr. 5 A-Dur (Heidelberger Sinfoniker: Thomas Fey)

    5.03  Das ARD-Nachtkonzert (IV)

    Domenico Scarlatti: Sonate cis-Moll, K 247 (Sergei Babayan, Klavier); Antonio Vivaldi: Violoncellokonzert g-Moll, RV 416 (Anastasia Kobekina, Violoncello; Kammerorchester Basel); Gaetano Donizetti: Concertino D-Dur (Marc Grauwels, Flöte; Orchestre Symphonique de la Radiodiffusion Belge Bruxelles: André Vandernoot); Felix Mendelssohn Bartholdy: Streichersinfonie Nr. 1 C-Dur (Concerto Köln); Johann Friedrich Fasch: Flötenkonzert D-Dur (Jan de Winne, Flöte; Marcel Ponseele, Oboe; Il Gardellino); Richard Wagner: Sinfonie C-Dur, Allegro molto e vivace (Royal Scottish National Orchestra: Neeme Järvi)
