  description: "Zum zweiten Mal innerhalb von zwei Wochen blickt Deutschland auf Wahlen im Osten - neben Mecklenburg-Vorpommern wird auch in Berlin gewählt. Kann SPD-Ministerpräsidentin Manuela Schwesig ihre Aufholjagd mit einem Wahlsieg krönen - oder wird die AfD auch in Mecklenburg-Vorpommern zum Wahlsieger? Wer gewinnt das Kopf-an-Kopf-Rennen in Berlin? Welche Folgen hat dieser Wahlabend für die Bundespolitik? \n\nDie Gäste:  \n* Tim Klüssendorf, SPD-Generalsekretär  \n* Mathias Middelberg, Mitglied im CDU-Präsidium \n* Beatrix von Storch, stellvertretende AfD-Fraktionsvorsitzende  \n* Robin Alexander, Journalist, Podcast \"Machtwechsel\""
