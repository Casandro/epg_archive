  title: Borgia - Die Weisheit des heiligen Geistes
  subtitle: Borgia - Die Weisheit des heiligen Geistes
  description: 'Als Lucrezia das Fieber überstanden hat, steht ihr Entschluss fest: Sie will Nonne werden. Um seine Wahl zu sichern, verspricht Rodrigo den anderen Kardinälen Grundbesitz und Ämter. Sforza soll Vizekanzler werden, dessen Sohn soll Lucrezia heiraten. Rodrigo wird gewählt und nennt sich Alexander VI. Reumütig kehrt Cesare auf den Berggipfel zurück. Doch der Felsen ist leer: Sein Sohn wurde gerettet. FR 2011'
  ageRating: 16
- eventId: 971465
  start: 2026-09-20T20:55:00Z
  stop: 2026-09-20T21:49:00Z
  title: Borgia - Der Bund der Ehe
  subtitle: Borgia - Der Bund der Ehe
  description: |-
    Nach seiner Wahl zum Papst kehrt Rodrigo mit eisernem Besen, um Posten mit seinen Vertrauten neu zu besetzen. Frisch verlobt, kehrt Juan nach Rom zurück, doch der spanische König hat ihm den Segen für die Ehe mit Maria Enriques verweigert. Auch als Präfekt der Päpstlichen Garde versagt Juan. Unterdessen verheimlicht Alessandro Farnese seinem Freund Cesare, dass er dessen Sohn gerettet hat.
     FR 2011
  ageRating: 16
- eventId: 971490
  start: 2026-09-20T21:55:00Z
  stop: 2026-09-20T22:49:00Z
  title: Borgia - Legitimität
  subtitle: Borgia - Legitimität
  description: Zurück in Rom warnt Cesare seinen Vater vor einer Verschwörung. Rodrigo schmiedet eine Allianz mit den italienischen Stadtstaaten und sichert den Frieden mit Neapel, indem er seinen Sohn Goffredo mit Kronprinzessin Sancia verlobt. Als Rodrigos schwangere Geliebte Giulia Farnese angegriffen wird, bekennt er sich öffentlich zu seinen Kindern und ernennt Cesare und Alessandro zum Kardinal. FR 2011
  ageRating: 16
- eventId: 971491
  start: 2026-09-20T22:50:00Z
  stop: 2026-09-20T23:44:00Z
  title: Borgia - Schachzüge
  subtitle: Borgia - Schachzüge
  description: Die Orsini werden als Drahtzieher des Angriffs auf Giulia entlarvt. Rodrigo lässt zu den Waffen greifen. Juan widersetzt sich dem Rat seiner Offiziere und scheitert kläglich. Unterdessen fällt die französische Armee in Italien ein, König Karl VIII erhebt Anspruch auf das Königreich Neapel. Cesare ist ein brillanter Stratege, doch Rodrigo sieht ihn als seinen Nachfolger auf dem Stuhl Petri. FR 2011
  ageRating: 16
