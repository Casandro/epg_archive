  title: Cedar Cove - Das Gesetz des Herzens - Vorurteile
  subtitle: Cedar Cove - Das Gesetz des Herzens - Vorurteile
  description: 'Jack und Olivia fahren für ein romantisches Abenteuer nach Seattle. Doch leider wird nichts daraus: Sie müssen zurück nach Cedar Cove, wo ein großer Brand im Park ausgebrochen ist. In Verdacht der Brandstiftung steht Lenny, ein ehemaliger Sträfling, den Olivia gerade unterstützt, indem sie ihm bei der Jobsuche in Cedar Cove Arbeit hilft. US 2012'
