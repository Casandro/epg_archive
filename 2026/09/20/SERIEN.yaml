  title: Borgia - 1506
  subtitle: Borgia - 1506
  description: Während Lucrezia Alfonso D'Este einen Erben schenken muss, damit er sich nicht scheiden lässt, wird Cesare Gefangener Ferdinands von Aragon. Ferdinand bietet Cesare die Freiheit, wenn er seinen Schwiegersohn Philip von Habsburg tötet. Auch Philip verspricht Cesare seinen Schutz, wenn er Ferdinand tötet. Nach Philips Tod erneuert seine Witwe den Auftrag an Cesare. Doch das Attentat schlägt fehl. FR 2013
  ageRating: 16
- eventId: 971964
  start: 2026-09-20T00:55:00Z
  stop: 2026-09-20T01:59:00Z
  title: Borgia - 1507
  subtitle: Borgia - 1507
  description: Cesare gelingt die Flucht nach Navarra zu seinem Schwager Johann d'Albret, in dessen Auftrag er einen Aufstand niederschlagen soll. Während Giulia in Rom die Zukunft der Familie Farnese sichert, stiftet Lucrezia Frieden zwischen ihrem Mann Alfonso D'Este und dessen Halbbruder Giulio. Cesare stirbt in einem Hinterhalt der Aufständischen. Sein Diener Agapito überbringt Lucrezia die Todesnachricht. FR 2013
  ageRating: 16
- eventId: 971965
  start: 2026-09-20T02:05:00Z
  stop: 2026-09-20T03:00:00Z
  title: Borgia - 1492
  subtitle: Borgia - 1492
  description: 'Um einmal Papst werden zu können, laviert Kardinal Rodrigo Borgia geschickt zwischen verfeindeten Königreichen und einflussreichen Familien. Er sammelt seine illegitimen Kinder um sich: Juan, Cesare und Lucrezia. Wie Juan will auch Cesare eine militärische Laufbahn einsteigen, doch Rodrigo hat ihn für ein kirchliches Amt vorgesehen. Für Lucrezia sucht er einen Ehemann aus einflussreicher Familie. FR 2011'
  ageRating: 16
- eventId: 971970
  start: 2026-09-20T03:00:00Z
  stop: 2026-09-20T04:15:00Z
  title: Borgia - Ein heiliger Schwur
  subtitle: Borgia - Ein heiliger Schwur
  description: Rodrigo schickt Juan nach Spanien und Cesare zum Studium nach Pisa. Lucrezia, die schwer am Fieber erkrankt, wird von ihrer Mutter Vannozza gepflegt. Während im Konklave gestritten wird, bringt Cesares Geliebte einen Sohn zur Welt. Um Gottes Segen für Rodrigo zu erwirken und sein eigenes Leben nach Rodrigos Willen der Kirche weihen zu können, setzt Cesare den Neugeborenen auf einem Berggipfel aus. FR 2011
  ageRating: 16
