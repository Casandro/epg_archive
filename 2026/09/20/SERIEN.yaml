  title: Cedar Cove - Das Gesetz des Herzens - Der Kinder wegen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Der Kinder wegen
  description: Olivia hat in einem komplizierten Scheidungsverfahren zu richten. Beide Parteien kommen nicht über ihre Verletzungen hinweg und geraten immer wieder in einen selbstzerstörerischen Streit. Es gelingt Olivia nicht, Mr. und Mrs. Westen zum Wohle ihrer Kinder zu einer einvernehmlichen Einigung zu führen. Unterdessen kommen Jack Zweifel, dass sein Sohn sich ernsthaft um einen Job bemüht.  US 2012
  ageRating: 6
- eventId: 971972
  start: 2026-09-20T05:05:00Z
  stop: 2026-09-20T05:50:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Sieg über die Angst
  subtitle: Cedar Cove - Das Gesetz des Herzens - Sieg über die Angst
  description: 'Maryellen erfährt, dass der Fotograf John aus Not seine Bilder verkaufen möchte: Er hat seinen Job als Koch verloren. Maryellen hilft ihm, in Cedar Cove Arbeit zu finden. Justine bereitet einen  wunderbaren Empfang für Seths Rückkehr aus Alaska vor, doch der erscheint nicht. Besorgt beschließt Justine, nach Alaska zu fahren. Parallel wird Olivia von Jack zu einem Kurztrip nach Seattle eingeladen. US 2012'
- eventId: 971973
  start: 2026-09-20T05:50:00Z
