  subtitle: mit Sophia Fischer
  description: Der Pianist Justus Eichhorn hat sich für sein erstes Album den Titel "The Source" ausgesucht. 2009 in Weimar geboren, präsentiert der junge Musiker mit seinem Debüt eine Hommage an eben diese Stadt. Das Italienische Konzert von J. S. Bach steht hier unter anderem neben eigenen Klavier-Kompositionen.
