  title: Hvězdné návraty
  description: Dnešek bude ve Hvězdných návratech patřit oslavenkyni. Zítra totiž své kulatiny oslaví herečka Daniela Kolářová. A tak vám její herecký život shrne Patrik Rozehnal v jedné hodině a v dalším dílu našeho cyklu o českých hercích a komicích. Dozvíte se, kde Daniela Kolářová vyrůstala, kdo ji přivedl k divadlu, s jakou mužem tvořila slavnou hereckou dvojici a také kterého scénáristy si považuje. Čeká vás spousta ukázek, písniček a perliček ze života. Bavte se s námi po 16. hodině.
