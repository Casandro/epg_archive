  title: Lebenswelten
  description: "Berlins letzte Klöster\nWegweisende Inseln der Ruhe \nEine Sendung von Sabine Loeprick\n\nKlöster waren schon immer besondere Orte. Spirituelle Räume, in denen Menschen nach festgelegten Regeln leben, bewusst die \"Welt draußen\" lassen, um in die Beziehung mit Gott zu treten. Doch welche Bedeutung haben Klöster heute - gerade in einer Großstadt wie Berlin? Nach Schließungen von Einrichtungen hat es in den vergangenen Jahren auch immer wieder Neugründungen klösterlicher Gemeinschaften gegeben. Einige haben bewusst einen ökumenischen Ansatz gewählt und verstehen sich als Ankerpunkt für einen ganzen Kiez. Andere bleiben bewusst traditionell, leben nach strengen Regeln, öffnen sich aber gleichzeitig mit neuen Angeboten und Projekten nach außen. Die \"Klosterszene\" in Berlin ist lebendig und vielfältiger denn je."
