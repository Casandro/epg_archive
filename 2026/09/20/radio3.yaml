  title: radio3 Konzert
  subtitle: 'Moderation: Petra Gute'
  description: "Eröffnungskonzert Musikfest 2026\nMusikfest 2026: Sir Simon Rattle dirigiert de Falla, Janácek und eine Uraufführung\n\nManuel de Falla\nEl sombrero de tres picos (Der Dreispitz), Ballettmusik\nRinat Shaham, Mezzosopran\n\nCathy Milliken\nwhy feather yellow, Konzert für Englischhorn und Orchester (Uraufführung), Kompositionsauftrag der Stiftung Berliner Philharmoniker \nDominik Wollenweber, Englischhorn\n\nLeos Janácek\nTaras Bulba, Rhapsodie für Orchester\n\nBerliner Philharmoniker\nSir Simon Rattle, Dirigent\nRinat Shaham, Mezzosopran\nDominik Wollenweber, Englischhorn\n\nSir Simon Rattle kehrt ans Pult der Berliner Philharmoniker zurück und präsentiert ein Programm, das Gegensätze vereint: spanische Leichtigkeit, slawische Wucht und eine zeitgenössische Uraufführung. Manuel de Fallas Ballettmusik \"Der Dreispitz\" entführt in eine Welt voller Eleganz, Witz und feuriger Rhythmen, während Leos Janáceks Rhapsodie \"Taras Bulba\" mit archaischer Kraft das dramatische Schicksal eines Kosakenführers erzählt. Im Zentrum des Abends steht zudem ein neues Werk: Cathy Milliken hat für den Solo-Englischhornisten Dominik Wollenweber das Konzert \"why feather yellow\" komponiert - ein Kompositionsauftrag der Stiftung Berliner Philharmoniker, der an diesem Abend seine Uraufführung erlebt. Ergänzt wird das Programm durch die ausdrucksstarke Stimme der Mezzosopranistin Rinat Shaham.\n\nKonzertaufnahme vom 18.09.2026 in der Philharmonie Berlin\n\nModeration: Petra Gute"
