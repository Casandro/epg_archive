- eventId: 555724
  start: 2026-09-20T08:00:00Z
  stop: 2026-09-20T10:00:00Z
  title: SWR4 Promitalk
  subtitle: 'Gast: Christian Henze'
  description: |-
    "Das Erotischste für mich ist: Geldverdienen"
    Christian Henze liebt gutes Essen - und den Erfolg. Mit 28 Jahren bekommt er einen Michelin-Stern und ist damals Deutschlands jüngster Sternekoch mit eigenem Restaurant. Zuvor arbeitet er in Eckart Witzigmanns legendärer Küche und kocht später zwei Jahre für Milliardär Gunter Sachs. Im Promitalk erzählt Henze von Mut, Druck und der Suche nach dem perfekten Geschmack - und verrät, warum für ihn Geldverdienen durchaus erotisch ist.

    SWR4 Moderator Jörg Assenheimer ist jede Woche im Gespräch mit prominenten Talkgästen. Den SWR4 Promitalk gibt es auch kompakt zum Hören in ARD Sounds und zum Anschauen in der ARD Mediathek.
