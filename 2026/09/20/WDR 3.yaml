  title: WDR 3 Konzert
  subtitle: 'Cello-Kunst, Kuba-Groove: Ana Carla Maza'
  description: "Mit Ana Carla Maza kommt eine virtuose, lebensfrohe Musikerin auf die Bühne, die das Cello zum Motor einer Performance macht, in der kubanische Traditionen, Jazz, Klassik und Pop ineinandergreifen. Feine Klangfarben treffen auf treibende Grooves. Ein Höhepunkt des Over The Border Festivals 2026! Außerdem in dieser Ausgabe: Live-Musik der Band Che Sudaka aus Barcelona beim Rudolstadt Festival 2025. \n<strong>Ana Carla Maza</strong><br/>Ana Carla Maza, Cello, Gesang<br/>Mily Perez, Flügel, Controller Keyboard<br/>Myrza Sierra, Tres Cubano, Gitarre<br/>Jay Kalo, Schlagzeug, Bongos\nAufnahme vom 14. März beim Over The Border Festival aus dem Pantheon, Bonn\nAnschließend:\n<strong>Che Sudaka</strong><br/>Leo (Leonardo Gabriel Fernández Stracquadaño), Gesang, Gitarre<br/>Kachafaz (Marcos Alejandro Fernández Stracquadaño), Gesang<br/>Cheko (Sergio Adrián Morales Cleves), Akkordeon\nAufnahme vom 3. Juli 2025 beim Rudolstadt Festival von der Großen Bühne Heinepark, Rudolstadt"
