    <strong>Friedrich Silcher</strong><br/>Ännchen von Tharau <br/>Berliner Mozartchor<br/>Leitung: Reinhard Stollreiter<br/>(2'22)
    <strong>Heinrich Werner</strong><br/>Sah ein Knab ein Röslein stehn <br/>Berliner Mozartchor<br/>Leitung: Reinhard Stollreiter<br/>(1'55)
    <strong>Traditionell </strong><br/>Ein Vogel wollte Hochzeit halten <br/>Berliner Mozartchor<br/>Leitung: Reinhard Stollreiter<br/>(3'28)
    <strong>Heinrich Isaac</strong><br/>Innsbruck ich muss dich lassen <br/>Berliner Mozartchor<br/>Leitung: Reinhard Stollreiter<br/>(3'42)
    <strong>Johann Nepomuk Hummel</strong><br/>Variationen über "O du lieber Augustin"<br/>für Orchester C-Dur, WoO 2 <br/>London Mozart Players<br/>Leitung: Howard Shelley<br/>(08'57'')
    <strong>Frédéric Chopin<br/></strong>Bearbeitung: Charles Gerhardt<br/>Walzer Nr. 6 Des-Dur, op 64<br/>"Minutenwalzer"<br/>James Galway, Flöte<br/>National Philharmonic Orchestra<br/>Leitung: Charles Gerhardt<br/>(02'09'')
    <strong>Fréderic Chopin</strong><br/>Nocturne Es-Dur, op. 9 Nr. 2<br/>Bearbeitung für Flöte und Orchester: James Galway<br/>James Galway, Flöte<br/>National Philharmonic Orchestra London<br/>Leitung: David Measham<br/>(04'20'')
    <strong>Niccolò Paganini</strong><br/>Moto perpetuo für Violine und Orchester C-Dur, op.11 <br/>Bearbeitung für Flöte und Orchester: Charles Gebhardt<br/>James Galway, Flöte<br/>National Philharmonic Orchestra<br/>Leitung: Charles Gerhardt<br/>(05'09'')
    <strong>Richard Wagner</strong><br/>Allmächt'ger Vater (Gebet des Rienzi)<br/>aus: Rienzi, der letzte der Tribunen, WWV 49 (Oper in 5 Akten)<br/>Lauritz Melchior, Tenor<br/>Columbia Opernorchester<br/>Leitung: Erich Leinsdorf<br/>(04'35'')
