  title: WDR 3 Studio Neue Musik
  subtitle: Henze - Paradoxien eines Idealisten II
  description: "1966 stellt Henze mit der Euripides-Oper \"The Bassarids\" bei den Salzburger Festspielen eines seiner Hauptwerke vor. Schon zwei Jahre später löst das politisch engagierte Oratorium \"Das Floß der Medusa\" in Hamburg den wohl spektakulärsten Skandal der Nachkriegs-Musikgeschichte aus. Stimmen von Zeitzeugen und O-Töne beleben das facettenreiche Bild eines Genies im Widerspruch.     \n<strong>Die Bassariden: Vorspiel / erste Szene</strong> | 1:51<br/>Hans Werner Henze\n<strong>Die Bassariden: Der Mänadentanz</strong> | 1:54<br/>Hans Werner Henze\n<strong>Nachtstücke und Arien: \"Mit schlaftrunkenen Vögeln</strong>\" | 1:15<br/>Hans Werner Henze\n<strong>Nachtstücke und Arien: \"Mit schlaftrunkenen Vögeln\"</strong> | 1:03<br/>Hans Werner Henze\n<strong>Nachtstücke und Arien: Aria </strong>| 0:36<br/>Hans Werner Henze\n<strong>Voices: \"Roses and Revolutions\" / \"Rosen und Revolutionen\" </strong>| 0:47<br/>Hans Werner Henze\n<strong>Das Floß der Medusa</strong> | 1:04 <br/>Hans Werner Henze\n<strong>Das Floß der Medusa: \"Ho-Chi-Minh\"-Stelle</strong>  | 1:04<br/>Hans Werner Henze\n<strong>Das Floß der Medusa</strong> | 0:57<br/>Hans Werner Henze\n<strong>Tristan: Todesschrei </strong>| 1:06<br/>Hans Werner Henze\n<strong>Tristan, 6. Satz</strong> | 3:52<br/>Hans Werner Henze\n<strong>Lucy Escott-Variations</strong> | 2:55<br/>Hans Werner Henze\n<strong>Sinfonie Nr. 9: 1. Satz</strong> | 0:19<br/>Hans Werner Henze\n<strong>Sinfonie Nr. 9: 7. Satz \"Die Rettung\"</strong> | 7:39<br/>Hans Werner Henze"
