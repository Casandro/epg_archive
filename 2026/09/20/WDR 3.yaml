  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: |-
    Erst ein Trompetenruf, dann ein Ohrwurm, später ein Schneesturm: Diese Lieblingsstücke nehmen die Abkürzung quer durch die Musikgeschichte. Henry Purcell eröffnet festlich und mit königlichem Glanz. Danach treffen bekannte Melodien auf Chorklang zum Mitsummen, von "Am Brunnen vor dem Tore" bis "Ännchen von Tharau". Johann Nepomuk Hummel zeigt, wie viel Witz in "O du lieber Augustin" steckt, während James Galway Flötenklassiker von Chopin und Paganini in funkelnde Virtuosenstücke verwandelt. Richard Wagner betet, Dohnányi spannt einen großen romantischen Bogen mit seinem selten gespielten Violinkonzert, und Purcells Cold Genius sorgt für Gänsehaut. Vivaldi schickt den Winter vorbei, bevor Tschaikowskis Nussknacker überraschend auf zwei Akkordeons landet. Zum Schluss verliert Lortzings Bürgermeister die Geduld und gewinnt damit die Lacher auf seiner Seite.
    <strong>Die Musikstücke der Sendung</strong>
    <strong>Henry Purcell</strong><br/>Sound the trumpet<br/>aus: Come ye sons of art, Z 323 <br/>für Soli, Chor und Orchester<br/>Christophe Dumaux, Countertenor<br/>Andreas Scholl, Countertenor<br/>Accademia Bizantina<br/>Leitung: Stefano Montanari<br/>(03'00'')
