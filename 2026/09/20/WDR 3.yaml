  title: WDR 3 Jazz
  subtitle: 'Jelly Roll Morton: Der Erfinder des Jazz?'
  description: 1890 in New Orleans geboren, zieht es ihn später nach Chicago, hier gründet Morton Anfang der 1920er Jahre die Red Hot Peppers. Seine früheren Beziehungen zur Halb- und Unterwelt pflegt er weiter. Wenn Morton nicht gerade spielt, arbeitet er als Zuhälter, Schmuggler und Boxpromoter. Sein Auftreten gleicht dem eines Gangsters, stets einen Revolver in der Tasche und einen Diamanten im Goldzahn.
