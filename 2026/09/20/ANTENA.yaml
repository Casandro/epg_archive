  title: 'Detektyw Candice: Niezawodny instynkt 5 (odc. 1)'
  subtitle: Wzięci początkowo za figurantów w ramach seminarium korporacyjnego komendant Renoir i jej ekipa interweniują w zabawie w morderstwo, uświadamiając uczestnikom, że jedna z osób naprawdę nie żyje.
