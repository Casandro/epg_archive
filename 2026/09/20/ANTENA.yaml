    Początkowo wzięci za figurantów w ramach seminarium korporacyjnego komendant Renoir i jej ekipa interweniują podczas "Morderstwo Party", uświadamiając uczestnikom, że jedna z osób NAPRAWDĘ nie żyje! Doszło do przestępstwa w myśl opinii, że lepiej "mieć magistra i nie mieć dzieci", kiedy się jest młodą kobietą szukającą pracy. Nawet kłamiąc. Tymczasem Candice wraca do pracy, jakby nic się nie stało. Czyżby przeceniła swoje siły? Jej nieoczekiwane wnioski pozwolą na rozwikłanie kolejnej sprawy.
