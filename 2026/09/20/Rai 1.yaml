  title: 'Giovannino Guareschi. Non muoio neanche '
  subtitle: Giovannino Guareschi. Non muoio neanche se mi ammazzano 1^ Visione - FICTION - 1945. Giovannino Guareschi, dopo una prigionia vissuta nei lager tedeschi, fa ritorno a casa, nella bassa emiliana. Ha una buo
  description: "na ragione per farlo: a casa, oltre alla sua amata moglie Ennia, lo aspettano i figli Albertino e Carlotta. È proprio qui che Guareschi sente l'esigenza di fare nuovamente ciò che gli riesce meglio: catturare, con il suo sguardo di uomo libero, la realtà che lo circonda. Lo fa dando vita, nelle sue pagine piene di disegni e parole, al fortunato Mondo Piccolo e a personaggi entrati nella storia della cultura italiana come Don Camillo e Peppone, incarnazione perfetta dell'ironia e della profondità del loro autore... - Regia di Andrea Porporati\nCon Giuseppe Zeno, Benedetta Cimatti, Andrea Gherpelli, Rita Bosello, Claude William Jan, Alessando Bianchi, Jerry Mastrodomenico, Massimo Scola, Maurizio Donadoni, Salvatore Striano e con la partecipazione straordinaria di Andrea Roncato e Claudio Lauretta \nLiberamente tratto dal romanzo \"Chi sogna nuovi gerani\" di Alberto e Carlotta Guareschi (Rizzoli) \nUna produzione Anele in collaborazione con Rai Fiction \nProdotto da Gloria Giorgianni"
