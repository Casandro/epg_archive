  title: 'Il Tutto e il Nulla (1a parte): Il Tutto'
  subtitle: 'Jim Al-Khalili ci conduce in un viaggio epico per scoprire la vera dimensione di tutto e la straordinaria scienza dietro lo spazio vuoto. Questo episodio indaga su una domanda molto semplice: perché si fa '
  description: buio di notte? Il viaggio per trovare la risposta lo porterà attraverso storie straordinarie fino ai confini dell'universo conosciuto, per capire come la nostra comprensione dello spazio sia stata modellata dalla matematica e dall'astronomia.
