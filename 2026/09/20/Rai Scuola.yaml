  subtitle: Progetto Scienza Newton (p. 24) "Foreste in fiamme" - "Newton" è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita Anna Barbati, scienzi
  description: 'ata delle foreste e docente di Assestamento e Selvicoltura dell''Università degli Studi della Tuscia di Viterbo. È coordinatrice del progetto europeo PREVAIL (PREVention Action Increases Large fire response preparedness) sul tema della prevenzione degli incendi di grande dimensione. E parliamo proprio di incendi a partire da alcune domande fondamentali: come nasce un incendio e che cosa si intende per mega-incendio? Gli incendi sono davvero la prima causa di danno alle foreste? E quali sono stati i grandi incendi della Storia? I rischi per le foreste sono molti, ma sono gli incendi a rappresentare uno dei nemici più temuti: il mondo della ricerca scientifica e i suoi protagonisti si adoperano in prima linea con attività nel campo della prevenzione. Come, tra gli altri, il progetto Firetec, un modello di simulazione del comportamento di un incendio. Si devono proteggere le foreste anche perché gli alberi sono sacri: sono "i primi altari dei paesaggi e delle comunità umane", come ci spiega il botanico Manlio Speciale, curatore dell''Orto Botanico di Palermo. - Un programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga.'
