  description: i tra i maggiori esperti del mondo della ricerca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga compie un viaggio alla scoperta dello studio dei terremoti, fenomeni geofisici incontrollabili e dagli effetti a volte devastanti, ma anche strumenti scientifici utili per conoscere il nostro Pianeta. Raccontano le loro esperienze e il loro lavoro sul campo Michele Matteo Cosimo Carafa, geologo dell'Istituto Nazionale di Geofisica e Vulcanologia (INGV); Carlo Doglioni, Presidente dell'INGV; la geologa Susi Pepe e il geofisico Pietro Tizzani, ricercatori presso l'Istituto per il Rilevamento Elettromagnetico dell'Ambiente del Consiglio Nazionale delle Ricerche; Claudio Mazzotti, ingegnere e docente di Tecnica delle Costruzioni dell'Università di Bologna; Andrea Prota, docente di Tecnica delle Costruzioni e direttore del Dipartimento di Strutture per l'Ingegneria e l'Architettura dell'Università di Napoli Federico II. - un programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga
