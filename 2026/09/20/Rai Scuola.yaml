  title: 'Progetto Scienza Storie della Scienza - '
  subtitle: Progetto Scienza Storie della Scienza - p. 18 - Geometrie - Progetto Scienza Storie della Scienza è il programma condotto dal filosofo della scienza Telmo Pievani, con la partecipazione della giornalista s
  description: cientifica Silvia Bencivelli, che approfondisce come e perché la scienza sia diventata così centrale nel mondo di oggi. Le puntate raccontano la storia e l'evoluzione del pensiero scientifico, con le scoperte, le intuizioni, gli esperimenti, le invenzioni, l'applicazione del metodo scientifico. Storie della scienza che ci hanno svelato le regole del mondo e fondato la nostra civiltà. La geometria nasce per finalità pratiche, per la necessità di misurare il mondo e le città, per costruire, razionalizzare lo spazio. Ma come spesso accade nella storia della scienza, le finalità pratiche aprono la strada a ricchissimi percorsi teorici, a grandi salti nella capacità di pensiero. Nel caso della geometria, questo progresso si è sviluppato dando man forte ad altre discipline, come la matematica, e generando nuovi campi di studio, la cartografia, la topologia. In questo episodio ripercorriamo le conquiste e i continui sconfinamenti di questa scienza, dalle forme semplici fino all'osservazione del cosmo, la geometria non euclidea e quelle intuizioni che porranno le basi persino per gli studi di Albert Einstein. Percorriamo questa storia della scienza con Claudio Bartocci - Professore di Geometria e Storia della Matematica, Università di Genova; Nicola Ciccoli - Professore di Geometria, Università degli Studi di Perugia; Lucio Russo - Professore di Calcolo delle Probabilità, Università di Roma Tor Vergata. - un programma di Telmo Pievani, Silvia Bencivelli, Diego Garbati, Mario Ferrari, Daniela Mazzoli, Francesco Linguiti, Edwige Pezzulli a cura di Serena Patrignanelli, Eleonora Ottaviani e Caterina Mazzuoli progetto a cura di Diego Garbati - regia Mario Ferrari - conduce Telmo Pievani con la partecipazione di Silvia Bencivelli
