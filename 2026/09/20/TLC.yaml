  title: 'Mein Leben mit 300 kg: Das Wiedersehen'
  subtitle: Maja und Justin
  description: |-
    Maja und Justin kämpfen im zehnten Monat beziehungsweise im zweiten Jahr gegen ihr Übergewicht an. Maja war mit ihrer schlechten Gesundheit körperlich am Anschlag und schämte sich für ihre Fressattacken, die ihr ganzes Leben bestimmten. Als sie ein Gewicht von 313 Kilo erreichte und keinen Ausweg mehr sah, fuhr sie nach Houston zum Adipositas-Experten Dr. Now. Dort musste sie binnen zwei Monaten 45 Kilo abnehmen, um zur Magen-Bypass-OP zugelassen zu werden. Eine enorme Hürde für die esssüchtige Maja, doch sie zeigt eine Willenskraft und Disziplin, die sie sich selbst nicht zugetraut hätte.
    USA 2021
