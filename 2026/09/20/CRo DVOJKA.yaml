  description: 'Láska je dobrej matroš (2/3). Komediální seriál o tom, jak je těžké získat lásku za každou cenu. Scénář a režie Petr Vodička. Hudba Filip Veret. Dramaturgie Kateřina Rathouská. Režie Petr Vodička. Účinkují: Šárka Vaculíková, Ivan Trojan, Lucie Polišenská, Jan Meduna, Natália Drabiščáková, Petr Stach, Brian Caspe, Martin Myšička, Zdeněk Velen, Jakub Žáček, Petr Vršek, Marek Holý, Tomáš Dianiška, Martin Šebek, Libuše Šplíchalová, Miroslav Krobot, Petr Lněnička, Ladislav Hampl, Marta Dancingerová, Eva Leinweberová, Petr Jeništa, Veronika Lazorčáková, Anna Theimerová, Václav Neužil, Jana Stryková, Miloš Mazal, Ivana Stejskalová, Lenka Volfová-Vondrášková, Naděžda Mečířová, Renata Venclová, Dana Reichová, Kateřina Rathouská a Ilona Dušková. Natočeno v roce 2018 (43 minut). Repríza.'
