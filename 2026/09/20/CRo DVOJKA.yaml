  title: Výjimeční
  description: 'Jiří Mádl - herec, scénárista, režisér. Vyrostl obklopen filmy a právě jim se také celý život věnuje. Jak se jako náctiletý vyrovnával s přívalem popularity po uvedení Snowborďáků a co je pro něj ve filmařině nejdůležitější? I to napoví dokument s cyklu Výjimeční. Autorka: Kateřina Kubalová.'
