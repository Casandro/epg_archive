  start: 2026-09-20T17:00:00Z
  stop: 2026-09-20T17:50:00Z
  title: Muzikál expres
  description: Dnešní díl připomene Tima Curryho, který koncem prázdnin zemřel, a to v jeho nejslavnější roli v muzikálu Rocky Horror Show. A také výročí českých premiér muzikálů Hello, Dolly! a Vražda za oponou. Druhá část bude věnována muzikálovým rolím a písním Hany Zagorové při příležitosti jejích nedožitých 80. narozenin. Reprízu pořadu si můžete poslechnout v pátek 25. září od 21. hodiny. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
