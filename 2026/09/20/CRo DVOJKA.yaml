  title: Historie českého zločinu
  description: 11. díl - 38 hodin strachu. Byl srpen 1984 a na silnici u jihomoravských Čejkovic stopař přepadl řidiče. Bodl ho nožem, svázal ho, odcizil mu peněženku a s jeho autem ujel. To byl však jen začátek dramatického příběhu, který onen stopař, před několika dny propuštěný z výkonu trestu, plánoval několik měsíců. V následující tři dny jsou ve hře osudy dvou mladých lidí. O jejich osvobození se pokusí dvanáctičlenný tým Útvaru zvláštního určení, který je na místo činu dopraven vrtulníkem až z Prahy. Začíná se odpočítávat 38 hodin strachu. Příběh, který se zapsal do historie české kriminalistiky, podle skutečnosti napsala Bronislava Janečková za odborné spolupráce Jiřího Ignáce Laňky. Cyklus kriminálních příběhů "Historie českého zločinu" je připravován ve spolupráci s Muzeem Policie České republiky. Repríza.
- eventId:
  - 1011589
