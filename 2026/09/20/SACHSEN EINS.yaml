  title: 'eaf-Debatte - Eine Stadt für alle! '
  subtitle: eaf-Debatte - Eine Stadt für alle!  - Wie gestalten wir eine geschlechtergerechte Stadtplanung?
  description: 'Unsere Städte sind noch oft an den Bedürfnissen des Autoverkehrs ausgerichtet  und damit an den Mobilitätsmustern von Männern, die zur Arbeit fahren. Doch wie erleben Frauen den Alltag im öffentlichen Raum? Für Frauen stellen sich ganz praktische Fragen: Wo kann ich mich sicher bewegen, auch nach Einbruch der Dunkelheit? Wo finde ich als Schwangere oder Stillende einen geschützten Rückzugsort? Wo gibt es saubere, funktionierende, kostenfreie öffentliche Toiletten? Wie kann Stadtplanung den Bedürfnissen von Frauen gerecht werden? Wie gestalten wir Städte, in denen sich alle Menschen gleichermaßen sicher und willkommen fühlen? Als Diskussionsgast ist eingeladen: Marlen Foersterling vom Amt für Wohnungsbau und Stadterneuerung der Stadt Leipzig. Die Moderation übernimmt wie immer Georg Teichert.'
