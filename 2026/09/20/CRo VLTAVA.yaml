  title: Vizitka
  description: Autor obsáhlé biografie "Jan Procházka. Tvůrce v kulturním a politickém životě Československa 50. a 60. let" si na pozadí Procházkovy hvězdné umělecké i politické kariéry všímá i jiného příběhu. Příběhu československého poststalinismu. Literát, scenárista, vedoucí tvůrčí skupiny na Barrandově, kandidát ÚV KSČ a jeden z nejhlasitějších reformátorů Pražského jara, prý rozhodně nebyl "osobnostně fádní typ". Kromě nejznámějších filmů Ucho a Kočár do Vídně napsal přes třicet dalších scénářů. Jak tvorba Jana Procházky odrážela posun v jeho politických názorech? Kdy se z něj stal "protektor československé nové vlny"? A jaký měl být závěr trezorového snímku Ucho, který se nikdy nenatočil? V srpnu se Jana Bárty ptala Karolína Koubová.
