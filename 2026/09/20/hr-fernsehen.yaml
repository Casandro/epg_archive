  title: Der Raub des Kölner Domschatzes
  subtitle: Auf der Jagd nach den Dieben
  description: 'In der Nacht zum 2. November 1975 wird der Kölner Dom zum Schauplatz eines spektakulären Kunstraubes. Am Morgen des Allerheiligen waren drei Männer noch als Besucher in der Schatzkammer - nachts kehren sie zurück, um sie auszurauben. Zwei sichern, einer steigt durch einen schmalen Lüftungsschacht in die Schatzkammer ein, bricht die Vitrinen auf und raubt sie aus: liturgische Schätze und Schmuck, zum Teil Jahrhunderte Jahre alt - historische Kunstgegenstände von unschätzbarem Wert. Eine Jagd nach den Dieben beginnt.'
