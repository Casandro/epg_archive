  title: Klöster Haghpat und Sanahin, Armenien
  subtitle: Zwei ungleiche Geschwister
  description: Armenien ist eines der ältesten Kulturvölker der Welt, dessen Wurzeln bis in die Antike reichen, und gilt als erstes Land, in dem das Christentum Staatsreligion wurde. Der christliche Glaube ist Identifikation, Dreh- und Angelpunkt der Armenier. Der äußere Ausdruck dafür sind Kirchen und Klöster, die, ab dem 10. Jahrhundert nicht allein zu religiösen, sondern auch zu geistigen, kulturellen und teilweise auch zu politischen Schaltstellen Armeniens wurden, wie die Klöster Haghpat und Sanahin.
