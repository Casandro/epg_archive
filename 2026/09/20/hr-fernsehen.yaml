  title: Wettstreit der Kathedralen (2/2)
  subtitle: Die Gotik
  description: |-
    1144 wird die Kirche St. Denis bei Paris eingeweiht. Der Bau lässt die Menschen staunen: Licht, Glas, Spitzbögen und Kreuzrippen. "Es werde Licht!" lautet die Botschaft, die von dieser Kirche ausgeht und die eine ganze Epoche dazu anspornt, immer größere und lichtere Kathedralen zu schaffen: die Gotik. Ein regelrechter Wettkampf um den größten und schönsten Bau entbrennt. Das gotische Bauprinzip stachelt die mittelalterlichen Baumeister zu immer kühneren Konstruktionen an.
    In Freiburg, Straßburg und Ulm entstehen die weltgrößten Kirchen ihrer Zeit. Immer höher zum Himmel sollen sie aufstreben.
