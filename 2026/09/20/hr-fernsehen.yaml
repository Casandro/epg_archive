  title: 100 Jahre Neues Bauen
  subtitle: Das Privat-Bad
  description: Die Körperhygiene ist noch gar nicht so lange Privatsache. Bis Anfang des 20. Jahrhunderts badete man im öffentlichen Badehaus, wusch sich über einer Schüssel und musste für das dringendste Bedürfnis den Nachttopf benutzen oder sich auf einen längeren Weg zum kollektiv genutzten "Häuschen" begeben. Bäder und WC in der eigenen Wohnung, das gab es nur für Privilegierte. Erst mit dem "Neuen Bauen" in den 1920er Jahren werden Bad und WC zum festen Bestandteil der Wohnung. Zu- und Abflüsse, Spülung, Armaturen und Accessoires werden ein neues Feld für das Design.
