  title: Host Lenky Vahalové
  description: Novinář a youtuber Jiří Burýšek - známý jako Jirka vysvětluje věci - má na YouTube už více než půl milionu odběratelů. Zpracovává témata spojená s vesmírem, fungování lidského těla a mozku, ale také varuje před podvody. Proč lidé tolik věří internetovým podvodníkům? Jak se bránit manipulaci a dezinformacím? A proč část svého obsahu nepřesunul na placené platformy? Moderuje Lenka Vahalová
