  title: Die besten Köche der Welt - Zu Gast im Ikarus - Kobe Desramaults
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Kobe Desramaults
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Der Spitzenkoch Kobe Desramaults wurde 2013 zum Gault Millau Koch des Jahres, sein Restaurant In de Wulf steht bei Opinionated About Dining auf Platz 1 der besten 100 europäischen Restaurants. Nach der Übernahme des Familienbetriebes hat Kobe Desramaults das In de Wulf zu einem Restaurant von Weltformat gemacht. Die gemütliche und behagliche Atmosphäre des Lokals und die Nähe zu den Gästen, ist ihm dabei aber mindestens genauso wichtig, wie seine Koch-Philosophie. Auf der Suche nach dieser Philosophie geht Desramaults immer wieder zurück an die Orte seiner Kindheit - dort wo er gespielt hat, auf den Feldern und in den Wäldern rund um seinen Heimatort. Wichtig sind dabei regionale Bauern, die ihm genau jene Produkte liefern, die er sich für seine Küche vorstellt. Das gibt Desramaults Küche auch ein saisonales Bild. Somit wechseln die Gerichte nach den Jahreszeiten und der Spitzenkoch legt großen Wert darauf seine Zutaten soweit es geht in ihrer Ursprünglichkeit zu belassen. Dabei stehen Frische und klare Geschmackskompositionen im Vordergrund. AT 2014'
