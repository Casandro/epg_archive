  description: Ein Ausflugsschiff auf dem Bodensee. Gut gelaunte Passagiere feiern bei einer Kostüm-Party. Mittendrin Elena Barin am Tag vor ihrem Amtsantritt als Dezernatsleiterin bei der Kriminalpolizei Konstanz. Sie ist als Touristin unterwegs - bis zu dem Moment, als sie bei einem Passagier eine Waffe bemerkt. Robert Böwe, ein mehrfach vorbestrafter Intensivtäter, ist aus einem Schweizer Gefängnis ausgebrochen und auf der Flucht. Als er unter Druck gerät, bringt er zusammen mit einem Fluchthelfer das Schiff samt Mannschaft und Passagieren in seine Gewalt.
