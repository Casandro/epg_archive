  description: Koncertom Simfonijskog orkestra Hrvatske radiotelevizije pod ravnanjem maestra Ivana Huta, 6. srpnja 2021. otvorene su 61. Glazbene večeri u sv. Donatu. Simfonijski orkestar HRT-a redovito nastupa na otvorenjima ove najstarije zadarske glazbene manifestacije surađujući s mnogim renomiranim glazbenicima. Ovog puta orkestru se pridružio mladi nadareni hrvatski pijanist Lovre Marušić izvodeći Treći klavirski koncert Borisa Papandopula. Koncertni program uokvirile su simfonijske pjesme F. Liszta i C. Saint-Saënsa koje svaka na svoj način slavi život te prikazuju prolaznost čovjekova života i jednakost svih pred smrću.
- eventId: 994075
