  title: 'Otkrivamo Hrvatsku: Lastovo - njemačka verzija'
  subtitle: ' '
  description: Antički pomorci i trgovci nazivali su ga Ladesta. Rimljanima je bio Ladestris, a Porfirogenet ga spominje kao Lastobon, što je najbliže današnjem nazivu otoka i njegova središnjeg naselja - Lastova. Uz ugođaj iskonske prirode, specifične graditeljske baštine, kraških polja s vinogradima i maslinicima, zaštićenog arhipelaga, upoznajemo današnje Lastovce - kroz priču o čovjeku s osamljenog škoja kojeg je održalo polje, ribanje, volja, naslijeđe te još uzgaja piculje, praske, rukatac, koze, ovce i gradi fumare. Pridružuju mu se doseljenici s kontinenta i hrvatski povratnici iz svijeta.
