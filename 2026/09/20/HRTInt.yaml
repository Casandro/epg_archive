  title: 'Jojo i lijepe riječi: Volim (4/10)'
  subtitle: ' '
  description: 'U svakoj od epizoda novoga serijala "Jojo i njegovi prijatelji" družeći se na farmi kroz svladavanje različitih situacija i "problema" uče i upoznaju značenje i važnost LIJEPIH RIJEČI i njihovo korištenje u svakodnevnom životu. Tako će naučiti zašto je važno pozdraviti i nekome poželjeti dobro jutro (dobar dan ili laku noć), koliko je vrijedan osmijeh ili zbog čega nikada ne smijemo zaboraviti reći - oprosti, hvala i molim! Jojo i njegovi prijatelji kroz igru i pjesmu najmlađe uče ljubaznosti, poštovanju (svakoga pojedinca), empatiji, brižnosti... Uče ih koliko je važno voljeti kako sebe, tako i sve oko sebe!  Producentica: Blanka Barlović Scenarist, autor pjesama i animacija: Bojan Jambrošić Dramaturginja: Ivana Gudelj Redateljica: Ivana Radovčić Urednica: Silva Skender'
- eventId: 994060
  start: 2026-09-20T14:14:00Z
  stop: 2026-09-20T14:21:00Z
  title: 'Najbolji dan: Luci - strah od valova (7/7)'
  subtitle: ' '
  description: Luci je sićušna petogodišnjakinja. Ljeta provodi na otoku Čiovu u društvu tete Natalije, majke Vesne i oca Domagoja. Prošle godine svakodnevno je uživala na plaži igrajući se u plićaku i plivajući uz potporu najmilijih. Malo je nedostajalo da zapliva bez leptirića na rukama. Ovog ljeta, nažalost, uopće ne želi zakoračiti u more. Luci se sve više i više boji valova. Ne može ni mirno zaspati ako iz daljine čuje zvuk mora. Luci je pozvala DigiDigija da je ohrabri, a on je za nju priredio posebno iznenađenje. Stigao je u društvu deset malih patkica i u suzvučju s morem, samo za Luci, skladao posebnu uspavanku.
