  subtitle: ' '
  description: 'Krava je među najpoznatijim i najpopularnijim domaćim životinjama. O važnosti njezina mlijeka za našu prehranu znamo gotovo sve, ali ako vas zanima i zašto često maše svojim repom, ili može li njezin rog i zasvirati, gledajte "Volim životinje". Scenarist: Siniša Bahun Suradnica: Ana Macan Snimatelj i montažer: Đuro Gavran Animatorica: Alira Hrabar Oremović Redateljica: Mirela Sakoman Urednica: Anamarija Simonelli Milković'
