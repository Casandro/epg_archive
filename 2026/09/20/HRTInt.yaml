- eventId: 993668
  start: 2026-09-20T06:44:00Z
  stop: 2026-09-20T07:09:00Z
  title: Potrošački kod
  subtitle: ' '
  description: Tema prve emisije u 22. sezoni je kvaliteta vode. Nakon što se doznalo da je u Lici odloženo 37 tisuća tona ilegalnog otpada, građani strahuju da je zbog tog opasnog otpada kontaminirana voda iz javne opskrbe. Do danas je napravljeno više analiza, a prema najnovijoj - koju je proveo Hrvatski zavod za javno zdravstvo - voda iz javnog vodovodnog sustava Ličko-senjske županije te otoka Paga - sigurna je za piće. Neovisne analize pokazale su onečišćenje vode. Kako se rade analize, koji se parametri analiziraju te koji laboratoriji imaju certifikat za analizu? U emisiji gostuje Valerije Vrček, predstojnik Zavoda za organsku kemiju Farmaceutsko-biokemijskog fakulteta u Zagrebu.
- eventId: 993669
  start: 2026-09-20T07:09:00Z
  stop: 2026-09-20T07:33:00Z
  title: 'Otkrivamo Hrvatsku: Lastovo - njemačka verzija'
  subtitle: ' '
  description: Antički pomorci i trgovci nazivali su ga Ladesta. Rimljanima je bio Ladestris, a Porfirogenet ga spominje kao Lastobon, što je najbliže današnjem nazivu otoka i njegova središnjeg naselja - Lastova. Uz ugođaj iskonske prirode, specifične graditeljske baštine, kraških polja s vinogradima i maslinicima, zaštićenog arhipelaga, upoznajemo današnje Lastovce - kroz priču o čovjeku s osamljenog škoja kojeg je održalo polje, ribanje, volja, naslijeđe te još uzgaja piculje, praske, rukatac, koze, ovce i gradi fumare. Pridružuju mu se doseljenici s kontinenta i hrvatski povratnici iz svijeta.
