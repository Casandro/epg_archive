  stop: 2026-09-20T23:09:00Z
  title: Potrošački kod
  subtitle: ' '
  description: Tema prve emisije u 22. sezoni je kvaliteta vode. Nakon što se doznalo da je u Lici odloženo 37 tisuća tona ilegalnog otpada, građani strahuju da je zbog tog opasnog otpada kontaminirana voda iz javne opskrbe. Do danas je napravljeno više analiza, a prema najnovijoj - koju je proveo Hrvatski zavod za javno zdravstvo - voda iz javnog vodovodnog sustava Ličko-senjske županije te otoka Paga - sigurna je za piće. Neovisne analize pokazale su onečišćenje vode. Kako se rade analize, koji se parametri analiziraju te koji laboratoriji imaju certifikat za analizu? U emisiji gostuje Valerije Vrček, predstojnik Zavoda za organsku kemiju Farmaceutsko-biokemijskog fakulteta u Zagrebu.
- eventId: 994083
  start: 2026-09-20T23:09:00Z
