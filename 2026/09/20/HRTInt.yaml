  title: 'Tata i ja: Bazen (10/10)'
  subtitle: ' '
  description: U serijalu predstavljamo zajednički rad tate Domagoja i sedmogodišnjeg Tristana kao zabavnu igru kroz koju Tristan uči o svijetu oko sebe. Tristan je znatiželjan dječak i često s tatom provodi slobodno vrijeme u izradi različitih predmeta i pri tom se odlično zabavlja.  Kada su počeli vrući, ljetni dani Tristan se poželio rashladiti kupanjem u bazenu. Domagoj i Tristan brzo su osmislili i izradili jedan i u svojem dvorištu.
