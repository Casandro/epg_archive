  title: 'Klasika mundi: 61. Glazbene večeri u sv. Donatu - Lovre Marušić i Simfonijski orkestar HRT-a pod ravnanjem Ivana Huta, Forum, 06.07.2021.'
  subtitle: ' '
  description: Koncertom Simfonijskog orkestra Hrvatske radiotelevizije pod ravnanjem maestra Ivana Huta, 6. srpnja 2021. otvorene su 61. Glazbene večeri u sv. Donatu. Simfonijski orkestar HRT-a redovito nastupa na otvorenjima ove najstarije zadarske glazbene manifestacije surađujući s mnogim renomiranim glazbenicima. Ovog puta orkestru se pridružio mladi nadareni hrvatski pijanist Lovre Marušić izvodeći Treći klavirski koncert Borisa Papandopula. Koncertni program uokvirile su simfonijske pjesme F. Liszta i C. Saint-Saënsa koje svaka na svoj način slavi život te prikazuju prolaznost čovjekova života i jednakost svih pred smrću.
- eventId: 994057
  start: 2026-09-20T12:36:00Z
  stop: 2026-09-20T13:18:00Z
  title: Dolina sunca, serija (15/210)
  subtitle: ' '
  description: 'Juran da Nataši do znanja da zna za njezinu malu tajnu. Karlo iznenadi Augustinu skupim darom. Nikolu ljuti Andrijin ležeran stav prema poslu. Sofija se iznenadi Evinom idejom da od kuće naprave pansion. Doktor Otto pohvali Ladu što je samoinicijativno odvela Lovru na pregled u Zagreb i spasila ga. Nataša uvjerava Jurana da su pilule Augustinine. Karlo je zabrinut što će Augustina morati na studij u Zagreb, a on se vjerojatno neće uspjeti upisati zbog financijske situacije. Karlo od Sofije traži još novca. Eva dolazi Juliji s idejom da staru Sofijinu kuću prenamijeni u pansion. Ladu brine pomisao da ima nešto između Lovre i Nataše. Juran kaže Sonji da je u Natašinoj torbici pronašao kontracepcijske pilule. Njoj je već dosta neobaveznog seksa s Juranom, želi nešto ozbiljnije. Nataša moli Augustinu da je pokriva pred Juranom u laži oko pilula. Julija panično govori Andriji da mora odbiti posao restauriranja koji mu Eva nudi. Nikola je dao posao u gostioni Karlu, što dodatno ljuti Ružu. Eva je zatečena kada joj Julija kaže da kao gradonačelnica ima pravo odbiti upitan projekt. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
