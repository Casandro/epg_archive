- eventId: 993665
  start: 2026-09-20T06:21:00Z
  stop: 2026-09-20T06:33:00Z
  title: 'Tata i ja: Bazen (10/10)'
  subtitle: ' '
  description: U serijalu predstavljamo zajednički rad tate Domagoja i sedmogodišnjeg Tristana kao zabavnu igru kroz koju Tristan uči o svijetu oko sebe. Tristan je znatiželjan dječak i često s tatom provodi slobodno vrijeme u izradi različitih predmeta i pri tom se odlično zabavlja.  Kada su počeli vrući, ljetni dani Tristan se poželio rashladiti kupanjem u bazenu. Domagoj i Tristan brzo su osmislili i izradili jedan i u svojem dvorištu.
- eventId: 993666
  start: 2026-09-20T06:33:00Z
  stop: 2026-09-20T06:38:00Z
  title: 'Volim životinje: Krava (9/15)'
  subtitle: ' '
  description: 'Krava je među najpoznatijim i najpopularnijim domaćim životinjama. O važnosti njezina mlijeka za našu prehranu znamo gotovo sve, ali ako vas zanima i zašto često maše svojim repom, ili može li njezin rog i zasvirati, gledajte "Volim životinje". Scenarist: Siniša Bahun Suradnica: Ana Macan Snimatelj i montažer: Đuro Gavran Animatorica: Alira Hrabar Oremović Redateljica: Mirela Sakoman Urednica: Anamarija Simonelli Milković'
