  title: In aller Freundschaft - Die jungen Ärzte (255)
  subtitle: Falschmeldungen
  description: Dr. Elias Bähr betreut mit Dr. Emma Jahn die hochschwangere Tanja Jakobs, deren eineinhalbjährige Tochter Lotte operiert werden muss. Doch bei den Voruntersuchungen kommt es zu Irritationen, denn die Blutgruppen von Mutter und Tochter passen nicht zusammen. Was zuerst einen Fehler vermuten lässt, wird schnell zum Verdacht, dass Tanja nicht die leibliche Mutter von Lotte ist. Sind im Johannes-Thal-Klinikum möglicherweise zwei Babys vertauscht worden?
