  title: DAS! Rote Sofa
  subtitle: 'zu Gast: Frank "Froonck" Matthée, Hochzeitsplaner'
  description: |-
    Wenn es um den schönsten Tag des Lebens geht, vertrauen ihm viele: Deutschlands bekanntester Wedding Planner Frank "Froonck" Matthée. Ihm ist kein Blumenbogen zu groß, keine Location zu außergewöhnlich, kein Wunsch zu verrückt. Er liefert. Seit den frühen 2000er Jahren organisiert er Traumhochzeiten mit einer Leidenschaft, als wäre jede einzelne seine eigene.

    Durch TV-Formate wie "Frank - Der Weddingplaner" oder "4 Hochzeiten und eine Traumreise" wurde er bekannt. Nach einer Bildschirmpause feiert er nun sein großes TV-Comeback. Beim "Duell der Hochzeitsprofis" tritt er gegen kreative Kolleginnen und Kollegen aus der Branche an.
