  title: Leopard, Seebär & Co. (80)
  subtitle: Wapiti Joshi wird wild
  description: |-
    Wenn Wapitimänner in der Brunft sind, ist mit ihnen nicht gut Kirschen essen. Damit der wütende Joshi sich mal ein bisschen abreagieren kann, organisiert Volker Friedrich eine Tanne als Sparringpartner.
    Nicht alle Kamele sind Wüstenschiffe, der neue Hengst ist allenfalls ein Dünenschiff, der kommt nämlich aus Dänemark. Ein hübsches Kerlchen, das bei den Kameldamen gleich gut ankommt.
    Nasenbär Bärli macht seiner Art alle Ehre und erschnüffelt Futter in geschlossenen Besucherfäusten, und die Paviane bedanken sich lauthals für ihre neuen Obstbäume.
