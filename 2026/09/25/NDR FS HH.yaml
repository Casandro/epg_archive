  title: 'Die Nordreportage: Auf Fangfahrt mit Hochseefischern'
  description: 'Kapitän Fritz Flindt und seine Männer sind die letzten Hochseefischer Deutschlands. Ihr Schiff "Iris" ist das Neueste in der Flotte der Reederei Kutterfisch aus Cuxhaven, mit moderner Fangtechnik und einer eigenen Fischfabrik im Rumpf. Die erste Winterfahrt auf hoher See mit dem neuen Schiff: Zwischen Norwegen und den Shetlandinseln wollen die Fischer Seelachs fangen. Der Film begleitet sie eine Woche lang auf ihrer ersten Winterfahrt mit ihrem neuen Fischkutter.'
