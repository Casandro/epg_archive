  description: Die Massenarbeitslosigkeit infolge der Weltwirtschaftskrise erreicht 1932 ihren Höhepunkt. In Deutschland kämpft die Weimarer Republik ums Überleben. Ständig wechselnde Regierungen werden zwischen Extremisten von Links und Rechts zerrieben. Kommunisten und Nationalsozialisten liefern sich blutige Straßenschlachten. Am 30. Januar 1933 wird Adolf Hitler zum Reichskanzler ernannt. Der Reichstagsbrand Ende Februar 1933 dient dem Regime als Vorwand für die Zerschlagung der KPD und die Verfolgung ihrer Mitglieder. Jüdische Bürger sehen sich massiven Repressalien ausgesetzt.
