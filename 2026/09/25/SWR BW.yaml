  description: Wilhelm Schürmann hat kurz vor seinem 75. Geburtstag keine Lust, seine Lebensweise auch nur ein wenig seinem Alter und seinen gesundheitlichen Malessen anzupassen. Als er nach einem Schwächeanfall - zumindest vorerst - auf das Autofahren verzichten und zu seiner Tochter Bettina ziehen soll, haut der eigenwillige Alte kurz entschlossen ab. Mit seinem geliebten Camping-Oldtimerbus macht sich Wilhelm davon - allerdings nicht allein und dies alles andere als freiwillig. Dreist hängt sich nämlich der 16-jährige Ausreißer Felix, der vor einem Wochenende mit seinem Vater davonfährt, wie eine Klette an Wilhelm.
