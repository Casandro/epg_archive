  title: DAS! Rote Sofa
  subtitle: 'zu Gast: Frank "Froonck" Matthée, Hochzeitsplaner'
  description: |-
    Wenn es um den schönsten Tag des Lebens geht, vertrauen ihm viele: Deutschlands bekanntester Wedding Planner Frank "Froonck" Matthée. Ihm ist kein Blumenbogen zu groß, keine Location zu außergewöhnlich, kein Wunsch zu verrückt. Er liefert. Seit den frühen 2000er Jahren organisiert er Traumhochzeiten mit einer Leidenschaft, als wäre jede einzelne seine eigene.

    Durch TV-Formate wie "Frank - Der Weddingplaner" oder "4 Hochzeiten und eine Traumreise" wurde er bekannt. Nach einer Bildschirmpause feiert er nun sein großes TV-Comeback. Beim "Duell der Hochzeitsprofis" tritt er gegen kreative Kolleginnen und Kollegen aus der Branche an.
- eventId: 1198880
  start: 2026-09-25T04:00:00Z
  stop: 2026-09-25T04:20:00Z
  title: Sesamstraße
  description: 'Krümel backt Kekse, Finchen hilft ihm dabei. Was er nicht wusste: Backen erfordert manchmal auch Geduld. In der "Sesamstraße"-Märchenparodie der "Bremer Stadtmusikanten" sind Hund (Ernie) und Esel (Bert) auf dem Weg nach Bremen. In der Dämmerung kommen sie an einer Hütte vorbei, in der Wolf (als Katze) und Huhn (als Hahn) Abendbrot essen. Hund und Esel versuchen, die beiden zu erschrecken, um an ihr Essen zu kommen. Doch statt zu flüchten, lachen Katze und Huhn so sehr, dass es zu einem Lärm-Wettstreit kommt. Am Ende finden die vier zusammen und beschließen, gemeinsam in der Hütte zu bleiben.'
  genre:
  - '16'
