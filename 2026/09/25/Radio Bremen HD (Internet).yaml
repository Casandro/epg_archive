  title: Rote Rosen (4384)
  subtitle: Deutschland 2026
  description: |-
    Über Lüneburg leuchten in dieser Nacht die Polarlichter - doch Lou erlebt sie nicht unbeschwert: Sie arbeitet fieberhaft daran, alle Gehaltsverträge noch vor dem Spatenstich zu korrigieren.
    Toni ist nach Ellies Geständnis spurlos verschwunden. Jonas und Ellie suchen die ganze Nacht nach ihr. Die Suche bringt die beiden einander wieder näher.
    Julius sehnt sich nach mehr Romantik mit Richard. Der ist genervt und lässt ihn beim Date sitzen. Danach trifft Julius ausgerechnet Mo und schaut sich mit ihm die Polarlichter an.
    Michael greift zu fragwürdigen Mitteln gegen seine Müdigkeit.
