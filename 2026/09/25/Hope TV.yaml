  description: "Als bei der ältesten Tochter der Verdacht auf Autismus im Raum steht, beginnt für Karoline Herzog und ihre Familie eine herausfordernde Suche nach Antworten. In der »Beziehungskiste« spricht sie über Neurodivergenz, den Weg zur Diagnose, Masking, Selbstfürsorge im Familienalltag und darüber, warum die Diagnose Autismus auch eine große Chance sein kann: für mehr Verständnis, neue Perspektiven und einen liebevolleren Blick auf das Kind.\n\nGast: Karoline Herzog, Mutter von drei Kindern, die älteste Tochter mit Autismus-Diagnose \nModeration: Anja Wildemann\n\nBuchtipp: »Was, wenn wir unsere Kinder einfach ernst nehmen?« Von Karoline Herzog. Neukirchener Verlagsgesellschaft, 2026.\n\nWeitere Infos unter: www.hopetv.de"
