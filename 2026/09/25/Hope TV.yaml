  title: Hope Gottesdienst
  subtitle: Plötzlich ist alles anders -  Florentina Nerlich
  description: "Plötzlich ist alles anders. Krisen und Stürme können uns völlig unerwartet treffen und uns den Boden unter den Füßen wegziehen. Krankheit, eine Trennung, der Verlust eines Menschen oder andere schwierige Situationen können viele Fragen und Sorgen in uns auslösen. Aber wir müssen diese Zeiten nicht alleine durchkämpfen. Jesus lädt uns ein: \"Kommt alle zu mir, die ihr geplagt seid und mit Lasten beschwert seid!\" In dieser Predigt geht es darum, mit unseren Sorgen und Lebensstürmen zu Jesus zu kommen, ihm zu vertrauen und an ihm dranzubleiben.  \n\nWeitere Infos unter: www.hopetv.de"
