  title: Meine Kinderjahre (Folge 20 von 20)
  subtitle: Von Theodor Fontane
  description: "Nach schwerer Erkrankung schrieb sich der 72jährige Fontane an seinen Kindheitserinnerungen gesund. Auf seine unnachahmliche Weise erzählt er von der glücklichen Zeit, die er zwischen dem siebenten und zwölften Lebensjahr in Swinemünde an der Ostsee verbrachte. Ein buntbewegtes Kleinstadtbild wird lebendig: Schlacht- und Backfest, große Gesellschaft und Silvesterball, Landpartie und Gang übers Eis, Spiele im Haus und am Hafen. Der dunkle Hintergrund dieser Kindheit ist die Gegensätzlichkeit der Eltern und die Spielleidenschaft des Vaters. Und doch gilt ihm, seiner Menschlichkeit, seiner phantastischen Verklärung des Alltags, seinem Plaudertalent die ganze Liebe des Sohnes. Das Buch erschien im November 1893 und bescherte Fontane den Triumph, den Swinemünder Weihnachtsmarkt literarisch beherrscht zu haben.\n\nTheodor Fontane wurde am 30. Dezember 1819 in Neuruppin geboren und erlernte den Apothekerberuf. Anfänglich arbeitete er auch in Leipzig und Dresden, 1841 ab 1. April in der Leipziger Apotheke \"Zum weißen Hirsch\" in der Hainstrasse und ab Juli 1843 in der Salomonis-Apotheke in Dresden. 1849 gab er den Apothekerberuf auf, um sich als Journalist und freier Schriftsteller zu etablieren. Obgleich sein Werk und Wirken zumeist auf die Mark Brandenburg bezogen wird, führen einige seiner Romane und Erzählungen auch in den Harz - wie zum Beispiel \"Cecile\" oder \"Ellernklipp\" - und nach Tangermünde (\"Grete Minde\"). Neben der Tätigkeit als Kriegsberichterstatter, Reiseschriftsteller und Theaterkritiker schuf er seine berühmt gewordenen Romane und Erzählungen sowie die beiden Erinnerungsbücher \"Meine Kinderjahre\" und \"Von Zwanzig bis Dreißig\". Fontane starb am 20. September 1898 in Berlin.\n\nRegie: Veronika Hübner\nProduktion: ORB 1992\n\nMitwirkende: \nKurt Böwe"
