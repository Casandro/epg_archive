- eventId: 544758
  start: 2026-09-25T04:00:00Z
  stop: 2026-09-25T07:00:00Z
  title: MDR KULTUR am Morgen
  description: "* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Ausstellung \"Das Steinmetzhandwerk zwischen Tradition und Moderne\"\nDie Ausstellung mit dem Titel \"Das Steinmetzhandwerk zwischen Tradition und Moderne\" nimmt den Beitrag dieses Handwerks zu guter Baukultur in den Blick. Gezeigt wird sie ab 25. September in Zusammenarbeit mit dem Bundesverband Deutscher Steinmetze und dem Landesinnungsverband des Steinmetz- und Bildhauerhandwerks Sachsen.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1946 Heinrich George stirbt\nAls Repräsentant der nationalsozialistischen Kulturpolitik wird Heinrich George im Sommer 1945 verhaftet und stirbt in sowjetischer Haft.\nVon Silke Hennig\n\n* 06:50 Uhr - Theaterprojekt Luchsland Sachsen\n\n* 07:15 Uhr - Deutsches Fotomuseum in Markkleeberg schließt\nEs war vor 13 Jahren, ganz genau am 27. August 2013, als die Stadt Markkleeberg bei Leipzig stolz bekanntgab, ein Fotomuseum eröffnet zu haben. Für den wunderschön, im agra-Park gelegenen, ersten ostdeutschen Museumsneubau nach der Wende, war somit ein Nutzer gefunden - nachdem das \"Deutsche Landwirtschaftsmuseum Markkleeberg\" an gleicher Stelle 2001 wegen schlechter Besucherzahlen und Insolvenz schließen musste. Nun wird am kommenden Wochenende, dem 27. September, auch das \"Deutsche Fotomuseum Markkleeberg\" seine Pforten schließen müssen: Der Hauptgrund ist auch hier, wie bei seinem Vorgänger, schlechte Besucherzahlen. Ulrike Thielmann mit einer Bilanz.\n\n* 07:20 Uhr - Kulturtipp: Kantinenlesen in Görlitz/ 19.30 Uhr\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton \n\n* 07:50 Uhr - Güldener Herbst: Johannes Pramsohler \"Der Schmelztiegel Thüringen\"\nEin erlesenes Konzertprogramm in ausgewählten Residenzen,  so präsentiert sich DER GÜLDENE HERBST, das Festival Alter Musik Thüringen. Jahr um Jahrzieht es ein musikbegeistertes Publikum aus ganz Deutschland und dem Ausland an. In diesem Jahr findet der Der GÜLDENE HERBST t vom 25. bis 27. September in Gotha statt und steht unter dem Motto \"HEIMAT KLÄNGE\". Die Thüringen Musiktradition hat immer auch schon auch Komponisten außerhalb des Landes beeinflusst. \n\n* 08:10 Uhr - Peter Zudeicks satirischer Wochenrückblick\n\n* 08:20 Uhr - Ergebnisse Thüringer Studie: Christen und Wehrdienstverweigerung in der DDR\nChristen in der DDR sind diskriminiert worden - zum Bespiel, wenn sie den Kriegsdienst verweigerten oder als Jugendliche gegen die Wehrerziehung protestierten. Wie das SED-Regime in solchen Fällen gegen Christen vorging, das hat eine Studie untersucht, die von 2020 bis 2023 an der Universität Jena erstellt wurde - ihre Ergebnisse wurden am Mittwochabend im Thüringer Landtag  vorgestellt. Prof. Christopher Spehr, Kirchenhistoriker und Leiter dieser Studie  sagte zur Frage nach Entschädigungsleistungen und warum es so wichtig, dieses Kapitel DDR-Geschichte aufzuarbeiten\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Ausstellung: \"Meine liebste Otte\" in Kunststiftung Sachsen-Anhalt\nSpannende Neuentdeckung: \"Meine liebste Otte!\" eine Hommage an die Bauhaus-, Burg- und Bethel-Künstlerin Benita Koch-Otte (1892-1976).\n\n* 08:50 Uhr - Inklusives Konzert in Schmalkalden \nInklusives Konzert für Hörgeschädigte in Schmalkalden am 25.9. um 16 Uhr.\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Thomas Bille"
- eventId: 545333
  start: 2026-09-25T07:00:00Z
  stop: 2026-09-25T07:35:00Z
  title: Unser Haus mit Rutsche (Folge 15 von 15)
  subtitle: Von Safia Al Bagdadi
  description: "Eine Paradiesvogelfamilie, das sind sie zu Anfang. Layla und ihr Bruder Nouri führen mit ihren Eltern Amir und Claire ein unbeschwertes Leben im Saarbrücken der 1980er Jahre. Es wird Arabisch gesprochen, Französisch und Deutsch und wenn das Geld fehlt - improvisiert. Die Geschwister wachsen zwischen verschiedenen Sprachen und Kulturen auf. Was die junge Layla, aus deren Sicht die Geschichte in weiten Teilen erzählt wird, noch nicht wirklich greifen kann: es gibt Spannungen zwischen dem Vater, \"Babe\", dem Überlebenskünstler aus Bagdad, und der bourgeoisen Schwiegerfamilie im Elsass. Außerdem ist die Situation in Babes irakischer Heimat alles andere als stabil. Als dann der zweite Golfkrieg ausbricht, wird der Vater ein anderer und die Familie gerät ins Wanken.\n \nDie Eindrücke der kleinen Layla alternieren mit der Perspektive der erwachsenen Erzählerin, die in Paris lebt und auf ihre Kindheit zurückblickt. Sie steckt in einer Lebenskrise und ruft sich Träume und traurige Momente in Erinnerung. Safia Al Bagdadi erzählt leicht und lakonisch, blickt mit viel Humor auf schwierige Zeiten und erschafft Szenen, die unter die Haut gehen. \n\nSafia Al Bagdadi, geboren 1979 in Saarbrücken, hat Schauspiel am Konservatorium der Stadt Wien und Kommunikationswissenschaft an der LMU München studiert. Unter dem Pseudonym Safia Monney hat sie die Romane \"Am Ende ist noch längst nicht Schluss\" (2016), \"Harte Zeiten für echte Kerle\" (2018) und \"Ich traf Gott und sie heißt Miranda\" (2021) im Rowohlt Verlag veröffentlicht. Sie lebt als Schriftstellerin und Schauspielerin in Paris. \"Unser Haus mit Rutsche\" ist im Hanser Verlag erschienen, das Hörbuch, gelesen von der Autorin, bei speak low in Kooperation mit HR, MDR NDR und SR entstanden.\n\nProduktion: speak low, SR/MDR/HR/NDR 2026\n\nMitwirkende: \nSafia Al Bagdadi"
- eventId: 545334
  start: 2026-09-25T07:35:00Z
  stop: 2026-09-25T10:00:00Z
  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\nVon Katrin Engelhardt\n\n* 10:15 Uhr - Der Stichtag: 1946 Heinrich George stirbt\nAls Repräsentant der nationalsozialistischen Kulturpolitik wird Heinrich George im Sommer 1945 verhaftet und stirbt in sowjetischer Haft.\nVon Silke Hennig\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 10:40 Uhr - Veranstaltungstipp: Theaterprojekt Luchsland Sachsen \n\n* 10:50 Uhr - Das Gedicht: Was alles braucht's zum Paradies von Elisabeth Borchers.\nIhren im Suhrkamp Verlag betreuten Autoren galt Elisabeth Borchers, Jahrgang 1926, als strenge und unermüdliche Lektorin, sie hat wunderbare Kinderbücher geschrieben, als Übersetzerin und belesene Anthologistin hat sie sich zahlreiche Verdienste erworben. Das geheime Zentrum ihres Werks aber bildete bis zu ihrem Tod im September 2013 ihre Lyrik. \"Ein Gedicht\", hat sie einmal notiert, \"Ein Gedicht ist nicht diktierbar. Es setzt nicht Kenntnisse voraus, sondern Erfahrung.\"\nGedichte gehörten für Elisabeth Borchers erklärtermaßen zum \"Existenzminimum\". \nEs liest Donata Höffer.\n \n* 11:15 Uhr - Feuilleton (Wdh.)\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 11:45 Uhr - Konzert: Berlinski Oratorium \nEs ist Tacheles-Jahr - das Jahr der jüdischen Kultur in Sachsen und daran beteiligt sich in den nächsten Tagen auch der Leipziger Synagogalchor mit zwei Konzerten. Hier werden musikalische Tradition, jüdische Kultur und Leipziger Musikgeschichte miteinander verbunden - und zwar im Gewandhaus und auf dem Leipziger Hauptbahnhof! An beiden Orten wird das chorsinfonische Werk \"Avodat Shabbat\" aufgeführt vom Leipziger Komponisten Herman Berlinski. Wer das ist und wie das klingt - Beatrice Schwartner war bei den Proben dabei.\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Julia Hemmerling"
