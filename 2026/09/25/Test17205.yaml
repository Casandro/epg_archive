  title: Objectif Monde L'hebdo
  description: |-
    Musique : mon IA préférée L'industrie musicale est bouleversée par l'IA : les morceaux générés par des algorithmes, difficiles à détecter, inondent les plateformes de streaming. Près de deux chansons sur cinq mises en ligne en sont l'_uvre d'une IA, souvent sans que les auditeurs le sachent. Seule Deezer, le mentionne clairement. Pour illustrer cette facilité, une équipe de Mise au Point (RTS) a créé Jüna, un chanteur virtuel : son nom, sa biographie et ses chansons ont été écrits par ChatGPT, ses morceaux composés par Suno. En une journée, Jüna s'est retrouvé sur les plateformes. Fraude ou innovation : l'IA va-t-elle remplacer les artistes ?

     (Suisse Romande-2026)
