  title: Planet Weltweit - Sansibars erstes Frauenorchester
  subtitle: Planet Weltweit - Sansibars erstes Frauenorchester
  description: 'Sansibar, ein tropischer Sehnsuchtsort im Indischen Ozean vor der Küste Tansanias und ein buntes Gemisch von Ethnien, Religionen und Kulturen. Die Musik dieses afrikanisch-arabisch-indischen Völkermixes ist Taarab. In den zahlreichen Musikgruppen und Clubs durften die Frauen bisher zwar singen, aber keine Instrumente spielen. Die Reportrage hat das Tausi Women"s Taarab Orchestra, das erste reine Frauenorchester Sansibars, begleitet. Taarab-Musik ist ein Stilmix, der die verschiedenen Kulturen Sansibars widerspiegelt, sie vereint europäische und afrikanische Instrumente wie Violine, Akkordeon und Trommeln mit der arabischen Kanoun. Es ist Ramadan und in einigen Wochen sollen die Frauen des Tausi-Orchesters unter der Leitung von Mariam Hamdani beim dem wichtigsten Filmfestival Afrikas, dem Zanzibar International Film Festival (ZIFF), auftreten. Doch die Frauen sind müde, die muslimische Fastenzeit zehrt an den Kräften der Frauen und auch ihr musikalisches Können ist noch auf sehr unterschiedlichem Niveau. Viele von ihnen mussten persönlich einen hohen Preis dafür zahlen, Musik machen zu dürfen: Wie Amina Omar, die sich sogar scheiden ließ, weil ihr Mann das Musizieren seiner Ehefrau nicht tolerieren wollte. Bis vor ein paar Jahren durften Frauen in der muslimisch geprägten Kultur Sansibars öffentlich keine Instrumente spielen und höchstens als Sängerinnen in Männerorchestern auftreten. Mariam Hamdani, die erste weibliche Journalistin Sansibars, wollte das ändern und gründete vor acht Jahren das Tausi Women"s Taarab Orchestra. Sie setzt sich mit ihrem Orchester erfolgreich für die Emanzipation von Frauen ein, von denen einige inzwischen sogar an der Musikakademie Sansibars studieren oder sich als Kleinunternehmerinnen auf der Insel selbständig machen. Das stößt nicht bei allen Männern auf Begeisterung. Manche Imane, Väter oder Ehemänner meinen, Frauen, die öffentlich Musik machen, verstoßen gegen die Gesetze des Korans. DE 2015'
