  title: Planet Weltweit - Die Feuerspringer von Sibirien
  subtitle: Planet Weltweit - Die Feuerspringer von Sibirien
  description: Sommer in der Taiga - wochenlange Hitze hat die riesigen Wälder Sibiriens gefährlich ausgetrocknet. Jetzt ist Hochsaison für die Feuerspringer der "Avialesoochrana", einer Waldschutz-Spezialeinheit der russischen Feuerwehr. Mit Fallschirmen springen die Teams aus alten Doppeldeckern oder seilen sich aus Hubschraubern in die unzugänglichen Waldgebiete ab, um möglichst nahe am Brandherd das Feuer bekämpfen zu können. Ein hochriskanter Job, denn die Männer haben veraltete Ausrüstungen, ihr wichtigstes Werkzeug sind Schaufel und Spaten. Seit 1931 gelingt es den Feuerspringern, unter den jährlich bis zu 35.000 Bränden, die im Osten Russlands ausbrechen, jene zu löschen, die zum unkontrollierbaren Flächenbrand werden könnten. Russland hat die größten zusammenhängenden Nadelwälder der Erde. Besonders in Sibirien scheint die Taiga kein Ende zu nehmen. Jeden Sommer stehen die Feuerspringer hier vor der gewaltigen Aufgabe, Brände im Gebiet zwischen der arktischen Tundra und der mongolischen Grenze zu bekämpfen. Seit der Sowjetära ist das Personal der Spezialfeuerwehr aber deutlich reduziert worden, und der Etat für die Waldbrandbekämpfung wird jedes Jahr kleiner. Nur die Brände werden nicht weniger. Der 53- jährige Sergej Rogov ist Chef der Feuerspringertruppe von Irkutsk am Baikalsee. Schon unzählige Male ist er in Richtung Feuer geflogen. Rogov und seine mutigen Männer wissen nie genau, was auf sie zukommt. Stets haben sie ihre gesamte Ausrüstung bei sich, denn Siedlungen gibt es hier nicht. Die Teams aus fünf oder sechs Männern springen aus Antonow-2-Doppeldeckern oder seilen sich aus einem Mi-8-Hubschrauber ab - so nahe wie möglich am Feuer. Im Wald sind die Männer dann völlig auf sich allein gestellt. Ihr Überlebensgepäck sind Zelte, die noch aus dem Zweiten Weltkrieg stammen, , ein paar Schaufelblätter, Motorsägen und eine primitive Funkausrüstung. DE 2011
