  title: Planet Weltweit - Rio - Vom Strich auf den Laufsteg
  subtitle: Planet Weltweit - Rio - Vom Strich auf den Laufsteg
  description: Imperatriz Leopoldina, eine Gasse der Huren in Rio de Janeiro. Schon ab dem frühen Nachmittag warten Frauen an Straßenecken und auf Plastikstühlen vor dem Stundenhotel auf Kundschaft. Ein Billigstrich einerseits - der Geburtsort eines modernen Märchens andererseits. "Wir Prostituierte wollten schon lange, dass die Gesellschaft uns respektiert," sagt die 32-jährige Jane Eloy, "so haben wir eine Mode-Kollektion entworfen - vor allem, um beachtet zu werden." Und das ist ihnen gründlich gelungen. Mit ihrem Modelabel "Daspu", eine Kurzform des portugiesischen "das putas", von den Huren, sorgen die Frauen seither für Aufruhr in der brasilianischen Mode-Szene. Und auch in der internationalen Presse hat die phantasievolle Prostituiertenmode bereits Beachtung gefunden.  Bereits im ersten Jahr von "Daspu", dem Modelabel der Huren, handelten sich die Frauen Ärger mit einem mächtigen Gegner ein. Nämlich mit "Daslu" - dem exklusivsten Modetempel Brasiliens. Hier gibt es alles für die Oberschicht des Landes, vom Prada-Täschchen bis zum Hubschrauber. Dass der Name "Daspu" auch eine ironische Anspielung auf das Edelkaufhaus "Daslu" ist, empörte die Firmenanwälte. Sie drohten den Prostituierten in Rio mit einer Klage und lieferten ihnen so ungewollt eine enorme Aufmerksamkeit in den Medien - und die Initialzündung für ihren Erfolg! Auch in diesem Jahr sucht "Daspu" wieder die Schlagzeilen und die Provokation im Schatten der modischen Größen. Parallel zur Rio Fashion Week, einer der wichtigsten Modemessen Südamerikas, veranstalten sie eine Modenschau mit ihrer eigenen Kollektion - vor dem Stundenhotel, wo sie tagtäglich anschaffen gehen. Die dreifache Mutter Jane Eloy ist der Motor des Huren-Labels. Die Hälfte ihrer 32 Lebensjahre hat sie auf den Straßen von Rio als Prostituierte verbracht. Nun bereitet sie sich mit den anderen Prostituierten von "Daspu" auf den großen Tag der Modenschau vor. DE 2007
