  description: |-
    In Bolivien kommen jährlich rund 5000 Kinder mit einem Herzfehler zur Welt. Doch Aberglaube und ein problematisches Gesundheitssystem verhindern fast immer die eigentlich guten Heilungschancen. Dr. Alexandra Heath Freudenthals engagierter Einsatz für eine moderne Kinderkardiologie ist eine anhaltende Herausforderung zwischen Euphorie und Enttäuschung.
