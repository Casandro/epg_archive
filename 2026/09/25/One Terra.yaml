  title: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  subtitle: Planet Weltweit - Der Maestro, Neapels legendärer Boxmeister
  description: Im Städtchen Torre Annunziata, kurz vor den Toren von Neapel, betreibt Lucio Zurlo seit über 50 Jahren ein erfolgreiches Boxstudio. Der 77-jährige ist in der Boxszene eine Legende. Etliche Meistertitel konnten seine Zöglinge einfahren, nationale wie internationale. Und doch hat Zurlos Studio seinen privaten Charme nie verloren. Für viele Boxsportler ist es das zweite Wohnzimmer. Profis und Laien gehen hier ein und aus. So manchen gar hat Zurlos Zuwendung aus dem kriminellen Milieu gerettet. Lucio Zurlos Studio namens "Boxe Vesuviana" liegt im Stadtviertel "Provolera", was in neapolitanischen Dialekt so viel bedeutet wie "Pulverfass". Es ist eine Anspielung auf den Vulkan gleich nebenan, auch darauf dass sich hier einst eine Militärstation befand - der Name könnte aber auch die soziale Sprengkraft des armen Viertels bezeichnen. Der Boxsport hat hier eine riesige Anhängerschaft. Es ist schlicht für viele der Weg heraus aus Tristesse, Straßengewalt und sinnlosem Dasein. Zurlo engagiert sich daher nicht nur für Sport und Titelkämpfe. Er ist vor allem ein sozialer Anlaufpunkt. Diese Dokumentation taucht ein in die Welt des neapolitanischen Box-Zirkus. Im Boxstudio trainieren Sportler unterschiedlichen Alters. Von Anfängern bis hin zu Profis, so wie zum Beispiel Salvatore Annunziata. Nach einem Jahr Pause bereitet sich der 30-jährige auf einen wichtigen Kampf vor, der ihm die Möglichkeit geben könnte, um den nationalen Titel zu boxen. Salvatore besucht Lucios Boxtraining schon seit dem 12. Lebensjahr. Einst war er ein eher schüchternes Kind. Doch mit den Jahren ist aus Salvatore ein professioneller Boxer geworden, der auch schon den Welttitel IBF sowie den Mittelmeer-Boxtitel gewonnen hat. Und doch reicht sein Verdienst aus dem Sport nicht aus, um damit seine Familie zu ernähren. So arbeitet er zusätzlich vier Tage pro Woche auf dem Markt von Ischia als Verkäufer von Bekleidung. Sobald er Feierabend hat, trainiert er auch dort, am Strand unter freiem Himmel. DE 2014
