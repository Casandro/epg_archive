  description: "Die Vogelspinnen im Amazonas-Regenwald sind die größten der Welt. Und sie stehen auf der Speisekarte der Piaroa. Während der Regenzeit erbeuten die Ur-Einwohner aus dem Süden Venezuelas nur selten Vögel und Wild. Dann jagen sie Vogelspinnen. Zwar ist ein Biss zumeist nicht gefährlicher als der Stich einer Biene oder Wespe, trotzdem kann eine Begegnung mit einer Riesenvogelspinne sehr unangenehme Folgen haben. Die Spinnenjäger müssen extrem vorsichtig sein ' \n DE 2011"
