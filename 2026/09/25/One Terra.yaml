  title: Planet Weltweit - Heilende Schwingungen der Klangschalen
  subtitle: Planet Weltweit - Heilende Schwingungen der Klangschalen
  description: 'Aus Feuer, Metall und harter Arbeit werden sie geschmiedet - Klangschalen, von denen man sagt, sie haben wohltuende Kräfte. Generationen von Heilern vertrauen auf ihre Vibrationen, in der Schwangerschaft, bei Migräne und chronischen Schmerzen. Ihren Ursprung haben Klangschalen in Nepal. Dort stiften sie seit Generationen Stille und Meditation. GEO Reportage geht dem Phänomen der Klangschalen auf den Grund. Der vibrierende Klang dieser metallenen Gefäße hat sich längst über seine Heimat hinaus verbreitet. In der westlichen Welt vornehmlich als Therapie-Instrument zum Stressabbau genutzt, ist es in seiner nepalesischen Heimat bis heute mehr als das: Klangschalen sind Instrumente für Meditationen, Tantra-Zeremonien und Heilungs-Rituale. Klangschalen-Therapeuten wie Santa Ratna Shakya und seine Tochter Suvechhya gründen ihre Behandlung auf die Lehre der sieben Chakren. Das sind Energiezentren im Körper. So werden in der traditionellen Klangschalen-Therapie sieben verschiedene Schalen eingesetzt: sieben Töne für die sieben Chakren. Zu ihren Patienten gehört Sangita, die im achten Monat schwanger ist mit ihrem ersten Kind. Die Behandlung mit den Schalen soll eine natürliche und einfache Geburt vorbereiten. Um ihr weitere Erleichterungen zu verschaffen, will Santa Ratna Shakya ihr nun sogar eine Mondschale schmieden lassen. Das Licht des Mondes würde der Schale, so der schamanische Glaube, zusätzliche Kräfte verleihen. Doch Sangita ist weder die einzige Patientin für die Therapeuten, noch ist die Behandlung mit den Gefäßen der einzige Verwendungszweck. So gibt es auch stets eine große Nachfrage aus dem benachbarten buddhistischen Kloster, wo Klangschalen ebenfalls eine wichtige Rolle einnehmen. Zudem möchte Santas Tochter Suvechhya demnächst ihre Ausbildung zur Heilerin vollenden und muss sich auf die Prüfung vorbereiten. Abnehmen muss sie ihr Vater. DE 2019'
- eventId: 1150948
  start: 2026-09-25T21:15:00Z
  stop: 2026-09-25T22:07:00Z
  title: Planet Weltweit - Oman - die Rosen der Wüste
  subtitle: Planet Weltweit - Oman - die Rosen der Wüste
  description: |-
    Vierzig Grad im Schatten sind im Sommer die Regel. Im Winter wird es nur wenig kühler. Im Wüstensaat Oman ist Regen die Ausnahme, natürliche Flüsse oder Seen existieren nicht. Und doch haben die Menschen hier an vielen Stellen die Wüste zum Blühen gebracht - sogar mit der in leuchtendem Rosa blühenden Feldrose. Möglich macht dies ein über 1500 Jahre altes Kanalsystem - das so genannte Aflaj, ein gewaltiges Netz aus Rinnen, Schleusen und Wasserwegen. Das auf diese Weise  über Kilometer weitergeleitete Wasser erweckt die Steinwüste jedes Jahr aufs Neue zum Leben. Der Wakil ist zuständig für die Wartung des Aflajsystems. Sein Amt wird vom Vater an den Sohn weiter gegeben. Von diesen Wasserwächtern hängt  das Überleben in den Bergdörfern des Sultanats Oman ab.

    Während die Bewohner anderer arabischer Staaten noch auf sporadische Regenfälle und das Sammeln des Wassers in Zisternen angewiesen waren, entstand in Oman bereits ein landesweites System, das die Menschen ganzjährig mit Wasser versorgt  - die Aflaj. Ein Großteil der alten Kanäle leitet noch heute kostbares Quellwasser über Tausende Kilometer durch die Gebirge auf die Felder und Gärten des Landes. Auch das kleine Bergdorf Al Sheriqua verfügt über einen solchen Kanal,  einen sogenannten Falaj. Seit mehr als 40 Jahren ist Suleyman Al Riyami der oberste Wasserverantwortliche des Ortes, ein Wakil - zu Deutsch: ein Beauftragter. Der 62jährige überwacht, wie Generationen von Wasserbeauftragten vor ihm, den  Zustand des Dorfkanals ständig. Das uralte System muss zuverlässig funktionieren; nur dann können die Felder an den Bergflanken bewirtschaftet werden. Doch in diesem Jahr führt der Kanal weniger Wasser als sonst. Ein Problem, denn  demnächst steht die Rosenernte des Ortes an, und für viele Dorfbewohner sind die Rosen die einzige Einnahmequelle. Aus den Blüten wird das begehrte Rosenwasser gewonnen, aus dem Parfum und Gewürzzusätze hergestellt werden. DE 2007
  ageRating: 6
- eventId: 1150964
  start: 2026-09-25T22:15:00Z
  stop: 2026-09-25T23:07:00Z
  title: Planet Weltweit - Arktis - Die Route der Atomeisbrecher
  subtitle: Planet Weltweit - Arktis - Die Route der Atomeisbrecher
  description: "Russland - Land der klimatischen Extreme. An seiner Nordküste verläuft eine der am schwersten zu befahrenen Meeresstraßen der Welt: Die Nordostpassage, ein 6.000 Kilometer langer Seeweg durch das Polarmeer. Für die Containerschiffe, die küstennahe Industriezentren wie Norilsk versorgen müssen, ist die eisige Route im Winter alleine nicht zu bewältigen - insgesamt drei Atomeisbrecher müssen sie in Schlepp nehmen und durch das meterhohe Eis ziehen. \n\nDer Wind hat die Schollen zu meterhohen Packeis-Barrieren zusammen geschoben. Obwohl die Maschinen des Polarfrachters \"Iwan Papanin\" mit 17.000 PS arbeiten, kommt das Schiff kaum noch voran. Für Kapitän Woluschew wird es immer  schwieriger, einen Weg durch die fast geschlossene Eisdecke zu finden. Ohne einen der acht Eisbrecher der russischen Atomeisbrecher-Flotte würde sein Schiff stecken bleiben Der Eisbrecher muss so nah wie möglich an die \"Iwan Papanin\"  herankommen, um das Eis um den Frachter herum aufzubrechen. Eine diffiziles Manöver, denn der 75.000 PS starke Eisbrecher darf auf keinen Fall mit dem Frachter kollidieren. Dieser läuft nämlich ebenfalls bei voller Motorenleistung weiter  - eine falsche Bewegung, und der Frachter rammt das vor ihm agierende schwimmende nukleare Kraftwerk...\nDer nördliche Seeweg ist der härteste Teil der 6.000 Kilometer langen Nordostpassage - jener Meeresstraße, die entlang der Küsten Europas und Asiens in den Pazifik führt. Die Route der \"Iwan Papanin\" beginnt im europäischen Archangelsk  und endet in Dudinka - dem sibirischen Seehafen vor der Industriestadt Norilsk. Über diese Route werden die über 200.000 Einwohner versorgt - noch entscheidender ist allerdings, dass sie die Verschiffung der sibirischen Metallschätze in  alle Welt ermöglicht. Die Kunst der Kapitäne auf dieser Strecke besteht darin, nicht den kürzesten sondern den sichersten Weg durchs Eismeer zu finden. DE 2008"
  ageRating: 6
