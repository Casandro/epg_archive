  title: Planet Weltweit - Die Halligen mitten im Winter, mitten im Wasser
  subtitle: Planet Weltweit - Die Halligen mitten im Winter, mitten im Wasser
  description: 'Der Wind pfeift scharf über das zugefrorene Watt, auf dem sich die Eisschollen gegeneinander auftürmen. Milchig- weißes Licht verzaubert die Landschaft in ein eisiges Stilleben. Außer dem Wind hört man keinen Laut. Die Menschen trotzen den eisigen Temperaturen in den wenigen urigen, reetgedeckten Häusern: Winter auf der Hallig Langeneß. Sie ist die größte der zehn Halligen mitten in der Nordsee. Meerumschlossen, einsam, aber auch sehr romantisch.  Johann Petersen, genannt Hanni, fährt bei gefühlten minus 17 Grad auf seiner Lore - einer kleinen Schmalspurbahn - mitten durch das Watt. Der Besitzer des einzigen Kaufmannsladens hat Ware vom Festland geholt, um die wenigen Menschen auf der Hallig versorgen zu können. Vorräte und alles Lebensnotwenige müssen die 110 Bewohner der Hallig Langeneß immer im Haus haben. Überschwemmungen und schwere Sturmfluten können das kleine Fleckchen Erde mitten in der Nordsee jederzeit von der Außenwelt abschneiden. Dann kommt keine Fähre mehr hierher durch, und auch die kleinen Loren können dann nicht mehr über die Schmalspurtrasse hinüber zum Festland. Die warme Stube bekommt in diesen Tagen eine ganz neue Bedeutung: Mit der Familie am Ofen sitzen und Geschichten aus vergangenen Tagen lauschen - etwa von den verheerenden Sturmfluten, die Land und Tiere, nicht selten ganze Häuser verschlungen haben. Seit Tagen schon sind Hanni und die anderen Bewohner damit beschäftigt, das große Biike-Fest vorzubereiten, bei dem mit einem riesigen Feuer am Meer der Winter ausgetrieben werden soll. Früher wurden mit diesem Feuer und ganz viel Grünkohl mit Speck auch die Walfänger verabschiedet, die nach dem langen Winter wieder aufs Meer hinauszogen. Mit dem Biikefest ist die lange, eisige Jahreszeit dann endlich vorbei-Hoffnung keimt überall, es riecht nach Frühling, Leben kehrt auf die Hallig zurück. Wir lebt es sich so isoliert, so angewiesen auf die Launen der Natur? DE 2011'
