  description: Fernsehmoderatorin, Rennfahrerin, Gründerin eines Motorradclubs für Frauen, jahrelang galt die heute 42-jährige Kiki als Vorbild und Musterbeispiel weiblicher Selbstbestimmung in Malaysia. Nach der Geburt ihres vierten Kindes wandte sie sich dem konservativen Islam zu, entschied sich für den Hidschab und gab einen Teil ihrer Eigenständigkeit auf.  DE 2016
