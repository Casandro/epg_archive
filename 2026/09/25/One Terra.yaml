  title: Planet Weltweit - Dänemark - Königin Margrethe und ihr Sommerschloss
  subtitle: Planet Weltweit - Dänemark - Königin Margrethe und ihr Sommerschloss
  description: "Schloss Gråsten ist Sommersitz der Dänischen Königin. Damit Margrethe II. im malerischen Südjütland Urlaub machen kann, treffen ihr Hofstaat und das dänische Volk jedes Jahr reichlich Vorbereitungen. Die Gärtner bringen den Schlossgarten in Schuss, die Leibgarde probt den Wachwechsel und die Ringreiter trainieren für den Höhepunkt des Sommers, die Reiterparade vor der Königin.\n\nDer Schlossgarten von Gråsten ist eine Mischung aus englischem Landschaftsgarten und barocken Beeten. Wenn im Juli die Königin anreist, soll er in den schönsten Farben blühen. Besonders wichtig sind die Lieblingsblumen von Margrethe II. - die Margeriten. Die Gärtnerin Elin Johansen und ihre Kollegen ziehen sie in der kleinen Gärtnerei. Die Reportage ist in den hektischen Wochen der Vorbereitung in und um Südjütland unterwegs.\n\nFür die Ringreiterin Simone Nissen ist die Parade vor der Königin lange Tradition. Bereits als Kind hat sie der Königin vom Pferd herab Blumen überreicht. Dieses Jahr soll das zum ersten Mal ihre sechsjährige Tochter übernehmen. Die Kleine ist aufgeregt, aber auch stolz. Da wird der Wettkampf um die Ringe fast zur Nebensache. In Kopenhagen marschiert derweil die Leibgarde in ihren hohen Bärenfellmützen über den Hof der Kaserne. Sie üben den Wachwechsel für das Schloss Gråsten. Die Gardisten sind Anfang zwanzig und noch neu in der Truppe. Nach Gråsten kommen sie zum ersten Mal. Die Gardistin Line Hedegaard schwitzt ordentlich unter der Mütze. Es sind mehr als dreißig Grad, der heißeste Monat seit zehn Jahren. Regelmäßig fallen Gardisten bei Paraden in Ohnmacht. Das soll ihr nicht passieren, es wäre einfach zu peinlich. \n DE 2016"
