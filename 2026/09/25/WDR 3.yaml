  title: WDR 3 Hörspiel - Krimi
  subtitle: Tiefe Schnitte
  description: |-
    Eine Lehrerin und Freundin von Pelzer bittet das Ermittlungsteam um Hilfe: Ihre hochbegabte Schülerin Rojda, die einer kurdischen Familie entstammt, ist verschwunden. Die Lehrerin macht sich sowieso schon Sorgen; zu allem Überfluss hat sie Rojdas Jacke auf einem Polizeivideo wiedererkannt: Ein Geldautomatenbetrüger war damit bekleidet.
    Regie: Thomas Leutzbach<br/>Produktion: WDR <markup type="abbr" abbreviation="2009" correspondent="zweitausendundneun">2009</markup>
