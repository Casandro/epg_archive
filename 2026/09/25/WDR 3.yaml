  title: WDR 3 Jazz
  description: Frauenkollektive im Jazz zu gründen ist noch immer ein politischer Akt. Sie bringen weibliche und nicht-binäre Instrumentalmusikerinnen, Komponistinnen und Sängerinnen zusammen, um Sichtbarkeit zu erhöhen, Ressourcen zu teilen und gemeinsam aufzutreten. Gute Beispiele sind PENG aus Essen und COLECTIVA aus London, ein wegweisendes und erstes rein weibliches Afro-Latin-Jazz-Kollektiv.
  subtitle: All Star Female - Die Kraft weiblicher Kollektive
