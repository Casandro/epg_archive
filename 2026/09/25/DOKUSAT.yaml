  title: Das Dritte Reich vor Gericht - Das Urteil
  subtitle: Zu den Angeklagten der „Nürnberger Prozesse“ gehörten unter anderem Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Judenhetzer Julius...
  description: Zu den Angeklagten der „Nürnberger Prozesse“ gehörten unter anderem Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Judenhetzer Julius Streicher und SS-Sicherheitschef Ernst Kaltenbrunner. Die Dokumentation zeigt das geschichtliche Groereignis, das im Oktober 1946 in einem Hauptprozess mit der Verkndung von 12 Todesurteilen endete.
