  description: Als die Alliierten die Schreckensherrschaft Adolf Hitlers beendeten und das Ausmaß des Verbrechens erkannten, sollten die hinterbliebenen Verbrecher zur Rechenschaft gezogen werden. In den „Nürnberger Prozessen“, einem der umfangreichsten Prozesse der Kriegsgeschichte, wurden die Mitschuldigen fr ihre Taten vor dem Internationalen Militrtribunal verurteilt.
