    Jan, Magda i Irena spotykają się na pogrzebie Ewy. Andrzej, zły na cały świat, unika bliższego kontaktu ze swoimipracownikami, zwłaszcza z Janem i Magdą, których obwinia o zbyt wczesną śmierć żony. Mimo wszystko już następnego dnia zjawia się w pracy. Znajomość Danuty i Staszka pogłębia się, mężczyzna zaprasza ją na kolację. Korzystając z nieobecności matki, Jan próbuje naprawić nadszarpnięte niewątpliwie relacje z Polą, ale bez skutku.
