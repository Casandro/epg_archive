    Ks. Mateusz zostaje wezwany do biskupa dokładnie trzynastego, o godzinie 13:00. Ten numerologiczny zbieg okoliczności Natalia odczytuje jako znak, że nadchodzą wielkie zmiany. Gibalski z kolei, którego pensja ledwo wystarcza na utrzymanie żony i bliźniaków, myśląc o wielkich zmianach marzy przede wszystkim o trzeciej belce i awansie na sierżanta sztabowego. Na razie jednak bierze kolejny nocny dyżur, żeby w ciągu dnia móc zabrać bliźniaki na szczepienie - oczywiście trzynastego.
