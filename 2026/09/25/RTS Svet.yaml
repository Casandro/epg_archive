  description: Centralna informativna emisija Radio-televizije Srbije, Dnevnik 2, svakog dana u 19.30 časova donosi najvažnije i najaktuelnije vesti iz zemlje i sveta. Kroz objektivne izveštaje, analize i uključenja sa terena, prepoznatljiv voditeljski tim gledaocima pruža kompletan pregled političkih, ekonomskih i društvenih događaja dana. Kao najgledaniji informativni program sa višedecenijskom tradicijom, Dnevnik 2 ostaje ključni izvor proverenih informacija i prvi izbor miliona građana širom Srbije.
