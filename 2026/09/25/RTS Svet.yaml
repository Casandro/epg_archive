  title: Hari Mata Hari
  subtitle: Sarajevska pop grupa "Hari Mata Hari", osnovana davne 1985. godine u Sarajevu, pretrpela je brojne izmene.
  description: Sarajevska pop grupa "Hari Mata Hari", osnovana davne 1985. godine u Sarajevu, pretrpela je brojne izmene. Danas je čine Hajrudin Hari Varešanović (vokal), Izudin Izo Kolečić (bubnjevi, udaraljke), Karlo Martinović (solo gitara, prateći vokal) i Nihad Voloder (bas-gitara, prateći vokal). Većinu pesama Hari Mata Harija komponuje i aranžira Hari Varešanović. Iako opredeljeni prvenstveno za pop muziku, članovi benda često koketiraju sa rok, etno, pa i narodnim zvukom. Pesme "Kad dođe oktobar", "Sedamanest ti je godina", "Svi moji drumovi", "Volio bi da te ne volim", "Što je bilo, bilo je", "Strah me da te volim", "Otkud ti ko sudbina", "Prsten i zlatni lanac", "Ja ne pijem", "Znam priču o sreći", hitovi su koji su obeležili jugoslovensku scenu.
