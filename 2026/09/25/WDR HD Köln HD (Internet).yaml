  title: Garten & Lecker (6)
  subtitle: Alte Schätze - neuer Garten in Lohmar
  description: Finale - das letzte Gartenfest findet auf einer "Dorfwiese" in Lohmar statt. Diesen 10.000 Quadratmeter großen Gemeinschaftsgarten haben Caro und ihr Mann Florian vor zwei Jahren - mitten im Lockdown - gegründet. Gemeinsam mit den Menschen aus dem Dorf haben sie ein wahres Gartenparadies für Groß und Klein geschaffen. Gemüsebeete zum selbsternten, Naschsträucher mit vielen verschiedenen Beeren, seltene Blumen, eine kleine Fußballwiese für Kinder, eine Boulebahn für Erwachsene, ein Tipi für die Jugend.
- eventId: 1205259
  start: 2026-09-25T09:10:00Z
  stop: 2026-09-25T09:55:00Z
  title: 'Expedition in die Heimat: Radtour am Rhein - Von Konstanz nach Karlsruhe'
  subtitle: 'Moderation: Ramon Babazadeh'
  description: 'Baden-Württemberg kann man besonders gut mit dem Rad am Rhein entlang erkunden. Von Konstanz bis Karlsruhe begeistert der Eurovelo-Radweg die Radfans. Die Radtour führt über die Grenze in die Schweiz und nach Frankreich. Zehn Jahre der SWR Erfolgssendung "Expedition in die Heimat" wurden 2022 mit dieser Radtour quer durch den Südwesten gefeiert. Den Anfang machte SWR-Moderator Ramon Babazadeh in Baden-Württemberg: Er radelte 400 Kilometer von Konstanz bis Karlsruhe.'
- eventId: 1206114
