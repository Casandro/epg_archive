- eventId: 1208871
  start: 2026-09-25T12:20:00Z
  stop: 2026-09-25T13:10:00Z
  title: Rentnercops (22)
  subtitle: Eine Art Magie
  description: "Dieser Zaubertrick ging schief: die Assistentin des Zauberers Kalisto liegt tot in der mit Messern gespickten Kiste. Zunächst sieht es nach einem Unfall aus. Doch die Zwillingsschwester der Toten, die auch Bestandteil der Show war, glaubt an einen Mord. Und richtig, bei genauerer Untersuchung stellt man fest, dass der Öffnungsmechanismus der Kiste manipuliert war. \nSteckt Kalisto hinter dem Mord? Oder doch der \"Große Maldini\", der den deutlich jüngeren Kalisto als seinen Erzfeind betrachtet? Edwin und Günter haben alle Mühe, aus den widersprüchlichen Aussagen der beiden konkurrierenden Zauberer die Wahrheit herauszufiltern."
  ageRating: 6
  genre:
  - '16'
- eventId: 1209896
  start: 2026-09-25T13:10:00Z
  stop: 2026-09-25T14:00:00Z
  title: Rentnercops (23)
  subtitle: Aus dem Beton
  description: Ein Bewährungshelfer wird erschossen im Flur eines Hochhauses in einem sozialen Brennpunkt aufgefunden. In der Gegend hatte er offenbar einige Klienten, die auch Günter und Edwin noch von früher kennen. Die Tatwaffe wird in der Nähe des Opfers gefunden, versehen mit den Fingerabdrücken von Teddy. Günter und Edwin trauen Teddy die Tat nicht zu, denn sie wissen, dass er im Grunde kein übler Kerl ist. Aber die Indizien sprechen eine andere Sprache.
  genre:
  - '16'
