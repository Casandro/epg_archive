  description: 'Wenn es ein Paradies für Chamäleons gibt, befindet es sich auf Madagaskar. Auf der "roten Insel" lebt knapp die Hälfte der rund 200 bekannten Chamäleonarten - eine weltweit einzigartige Vielfalt. Man findet sie in allen Farben und Größen, mit Hörnern auf der Nase oder helmartigen Kopflappen. Madagaskar scheint für Chamäleons der ideale Lebensraum zu sein. Doch wie kam es dazu? Die Dokumentation erzählt, wie die faszinierenden Reptilien vor 65 Millionen Jahren auf die Insel kamen, und zeigt dann ein beeindruckendes Naturspektakel: den Karneval der Chamäleons.'
