  title: Notre-Dame, die Jahrhundertbaustelle (1/3)
  subtitle: Dem Himmel entgegen
  description: 'Am 15. April 2019 stand eines der berühmtesten Wahrzeichen Frankreichs in Flammen: die Pariser Kathedrale Notre-Dame. Das Großfeuer, das den Dachstuhl vernichtete und die Turmspitze der Kathedrale zum Einsturz brachte, zerstörte auch einen Teil des Gewölbes und schwächte die Kalksteinmauern. Nach einjährigen Aufräum- und Sicherungsarbeiten war die Einsturzgefahr gebannt und 200 Wissenschaftler konnten die Kirche betreten. Ihr Auftrag: die historisch originalgetreue Rekonstruktion der Kathedrale. Dazu mussten sie die Geheimnisse der mittelalterlichen Erbauer von Notre-Dame lüften.'
