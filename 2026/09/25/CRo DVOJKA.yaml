- eventId: 1163629
  start: 2026-09-25T20:00:00Z
  stop: 2026-09-25T20:30:00Z
  title: Četba na pokračování
  description: 'Alena Mornštajnová: Čas vos (07/14). Bářin život se nevyvíjel podle jejích představ a směr, který nabral, si sama nevybrala. Minulost už se napravit nedá, staré křivdy stále bolí, ale je třeba bojovat, aby se člověk dobral spravedlnosti a nenechal si vše líbit. Ani s Ptáčníkem se život nemazlil, stal se z něho samotář a podivín, který miluje víc ptáky než lidi. Když se jejich osudy protnou, ani jeden z nich netuší, kolik toho mají ve skutečnosti společného a jak moc si můžou navzájem pomoci. Pro rozhlas připravila Anna Smrčková. Dramaturgie Marina Feltlová. Účinkují Andrea Elsnerová a Kamil Halbich. Režie Dimitrij Dudík. Premiéra'
- eventId: 1163630
  start: 2026-09-25T20:30:00Z
  stop: 2026-09-25T21:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Jan Kostelník, vědec a farmaceut. Byla jeho dětská zvídavost spojená s přírodovědou? Která událost z osobního života ho vedla k výzkumu a vývoji postbiotik nové generace? A kde vznikl jeho silný vztah k Norsku? Moderuje Zuzana Maléřová.'
