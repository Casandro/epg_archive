- eventId: 1163627
  start: 2026-09-25T19:00:00Z
  stop: 2026-09-25T19:49:00Z
  title: Muzikál expres
  description: Muzikál expres připomene Tima Curryho, který koncem prázdnin zemřel, a to v jeho nejslavnější roli v muzikálu Rocky Horror Show. A také výročí českých premiér muzikálů Hello, Dolly! a Vražda za oponou. Druhá část bude věnována muzikálovým rolím a písním Hany Zagorové při příležitosti jejích nedožitých 80. narozenin. Uvádějí Michael Prostějovský a Pavel Bár. Repríza z 20.9.
