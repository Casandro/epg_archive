  title: 'Catfish : fausse identité'
  subtitle: Kirsten et Alex S08 E15. Kirsten rencontre Alex en ligne alors qu'elle est confinée avec son fiancé. Alex avoue plus tard être un imposteur, puis disparaît. Qui était réellement Alex ?
  description: 'CATFISH : 1. Au sens propre : Poisson-chat. 2. Au sens MTV : se dit d''une personne se faisant passer pour ce qu''elle n''est pas sur les réseaux sociaux, dans le but d''entretenir une relation amoureuse virtuelle, sous une fausse identité. Nev Schulman (à l''origine du documentaire CATFISH primé au festival de Sundance) décide, après son expérience malheureuse racontée dans ce documentaire, d''aider des gens tombés amoureux sur le net alors qu''ils n''ont jamais rencontré leur future moitié dans la vraie vie. Après les avoir questionnés et conseillés sur les pièges que peuvent engendrer une relation virtuelle, Nev part filmer LA rencontre, moment crucial où les deux tourtereaux se découvrent enfin en chair et en os. Grosses déceptions à prévoir, ou pas ! Au cours de ces rencontres décisives, le réalisateur s''attache également à découvrir les raisons qui ont poussé ces internautes à catfisher des inconnus sur la toile. Réalisateur: Michael Selditch. Des acteurs: Kamie Crawford (Self), Nev Schulman (Self) (2020)'
