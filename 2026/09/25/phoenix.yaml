  title: Die ersten Menschen
  subtitle: 1491 - Amerika vor Kolumbus
  description: Bevor Christoph Kolumbus 1492 Amerika für die Europäer entdeckte und einen furchtbaren Genozid an allen indigenen Völkern auslöste, lebten diese Völker in kulturellen und ökonomischen Zusammenhängen, über die die meisten Menschen kaum etwas wissen. Dies möchte diese Dokumentarreihe ändern und klärt über das Leben der Menschen vor der Ankunft der Weißen in Amerika auf.
