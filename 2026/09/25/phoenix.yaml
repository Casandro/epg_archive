  title: Politiker beleidigt - Meinungsfreiheit in Gefahr?
  subtitle: 'Moderation: Tanit Koch'
  description: "Der § 188 StGB ist eine Vorschrift zum Schutz von Personen des politischen Lebens vor bestimmten Beleidigungen, übler Nachrede und Verleumdung. Im Vergleich zu den allgemeinen Vorschriften drohen dabei höhere Strafen.\nWo endet zulässige politische Kritik und wo beginnt eine strafbare Beleidigung? Wie weit darf der Staat gehen, wenn Politiker zur Zielscheibe von Spott, Satire oder zugespitzter Kritik werden? Und braucht es dieses Sonderrecht für Politiker überhaupt? \nGenau diesen Fragen geht NDR Reporterin Tanit Koch in dieser neuen Ausgabe von \"KLAR\" nach."
- eventId:
