  title: Reiche und die Lieferketten
  subtitle: Warum ein gesetz leer läuft
  description: Das Lieferkettengesetz ist weiter in Kraft. Doch unter Katherina Reiche kommt die Arbeit der zuständigen Kontrollbehörde zunehmend zum Erliegen, zeigen Recherchen von ZDF frontal. Mit Personalpolitik und Eingriffen in die Arbeit der zuständigen Kontrollbehörde hebeln Katherina Reiche (CDU) und ihr Wirtschaftsministerium offenbar ein unliebsames Gesetz gezielt aus, vorbei am Bundestag. Das zeigen monatelange Recherchen von ZDF frontal. Es geht um das Lieferkettengesetz, das in Deutschland weiterhin gilt und um die Behörde, die kontrollieren soll, ob sich Unternehmen an das Gesetz halten.
