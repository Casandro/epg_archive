  - 595990
  start: 2026-09-25T03:15:00Z
  stop: 2026-09-25T03:30:00Z
  title: Politiker beleidigt - Meinungsfreiheit in Gefahr?
  description: Er wollte Bündnis 90/Die Grünen kritisieren. Dann kam die Polizei. Und ein Strafbefehl über 6000 Euro. Der Fall des Unternehmers Michael Much zeigt, wie schnell politische Zuspitzung zum Fall für die Justiz werden kann. Im Jahr 2023 hatte er ein großes Plakat mit Karikaturen grüner Spitzenpolitiker auf seinem Privatgrundstück aufgestellt. Die Polizei baute das Plakat ab, der Fall landete vor Gericht. Am Ende wurde er freigesprochen. Doch der Staat hat gezeigt, was rechtlich möglich wäre dank eines Paragrafen, der eigens zum besonderen Schutz von Politikern geschaffen wurde.
  widescreen: true
