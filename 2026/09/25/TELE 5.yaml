  title: Hard Rain
  description: "Seit Tagen gießt es in der Kleinstadt Huntingburg in Strömen. Wiesen, Felder und Straßen stehen unter Wasser, die Einwohner werden evakuiert. Die Kurierfahrer Tom (Christian Slater) und Charlie sollen in der Zwischenzeit drei Millionen Dollar aus der örtlichen Bank in Sicherheit bringen. Doch die heikle Mission läuft aus dem Ruder: Ganove Jim (Morgan Freeman) und seine Bande fangen die beiden ab... Um das Katastrophenszenario realistisch auf die Leinwand zu bannen, ließen die Produzenten die Stadt Huntingburg originalgetreu nachbauen. Fünfzig Holzbauten in der Größe von zwei Fußballfeldern wurden in einem Wassertank errichtet, der dann geflutet wurde. \nUSA 1997"
