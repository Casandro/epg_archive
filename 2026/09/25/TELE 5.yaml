  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Expedition in den Tod (Teil 1)
  description: "Es passierte 1959: Neun sowjetische Studenten brechen zu einer Ski-Tour in der eisigen Wildnis Sibiriens auf - und kommen nie zurück! Als man die verunglückten Ski-Wanderer verstreut am Djatlow-Pass findet, bietet sich dem Rettungstrupp ein Bild des Grauens. Die leblosen Körper sind übel zugerichtet. Bei zwei Toten fehlen die Augen, bei einem die Zunge. Ihre dicke Winterkleidung befindet sich zusammengelegt im Zelt, das vermutlich von innen aufgeschlitzt wurde. Was zur Hölle ist hier geschehen? Abenteurer Josh Gates schließt sich einer Expedition an, die das düstere Rätsel vom Djatlow-Pass nach 60 Jahren lösen will. \nUSA 2019"
