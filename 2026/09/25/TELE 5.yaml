  description: "Piraten: Einst haben sie die Küste Floridas heimgesucht und Siedler wie Seeleute in Angst und Schrecken versetzt. Kaum einer wurde mehr gefürchtet, als José Gaspar, der im späten 18. Jahrhundert zahllose Schiffe plünderte! Bis heute kursieren Gerüchte, dass der blutrünstige \"Gasparilla\" einen millionenschweren Goldschatz versteckt haben soll. Aber wo? Der Überlieferung zufolge hatte der Piraten-Chef an der Westküste Floridas ein regelrechtes Imperium aufgebaut. Von seiner blutbeschmierten Beute fehlt jedoch jede Spur. Josh Gates schließt sich einer Gruppe Schatzjäger an, die den Reichtum bereits wittern... \nUSA 2019"
