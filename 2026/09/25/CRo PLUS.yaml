  title: Pro a proti
  description: Rozpadne se Velká Británie? Velšané, Skotové a Irové chtějí referenda o nezávislosti na Spojeném království. Jde o pochopitelnou emancipaci menších národů, které se po brexitu pokoušejí o návrat do EU, anebo o nebezpečný politický hazard, který může oslabit celou Evropu? A jak do příběhu spletitých staletých vazeb ostrovního království zasahuje Donald Trump? Debatovat budeme s anglistkou a historičkou Johanou Kłusek z Jagelonské univerzity v polském Krakově a s novinářem a historikem, který se zaměřuje na poválečnou Británii, Ondřejem Šmigolem. Moderuje Lucie Vopálenská.
