  title: Radiokniha
  description: 'Jiří Křesťan: Zdeněk Nejedlý. Politik a vědec v osamění. (6/10) "Rudý dědek" - takovou přezdívku měl Zdeněk Nejedlý - klíčová, ale také směšná figurka z doby budování komunismu. Po druhé světové válce výrazně ovlivnil českou kulturu i školství. Za to se dočkal jak nadšených ovací, tak odsouzení a zesměšnění. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkuje Martin Sláma.'
