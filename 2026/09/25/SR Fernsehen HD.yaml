  title: Wendezeit
  subtitle: Spielfilm Deutschland 2019
  description: '1989: Doppelagentin Saskia Starke gerät in einen emotionalen Ausnahmezustand, als sich das Ende der DDR ankündigt. Sie lebt als Agentin der Stasi in Westberlin, ist mit einem Amerikaner verheiratet, hat mit ihm zwei Kinder und arbeitet offiziell in der amerikanischen Botschaft. Inoffiziell bedeutet das, sie arbeitet für die CIA. Der Stasi ist es also gelungen, eine Agentin direkt beim Klassenfeind zu positionieren. Doch dann passiert etwas, womit vor Monaten noch niemand gerechnet hat: Die DDR ist im Begriff, sich aufzulösen. Dieser Umbruch lässt Saskias Leben implodieren, das von Anfang an auf einer Lüge gegründet war.'
