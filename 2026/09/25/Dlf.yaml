  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nBerlin: Meron Mendel zur Partei Die Linke, jüdischem Leben und Antisemitismus \nDurch den Wahlsieg der Partei Die Linke bei der Berlinwahl ist in Deutschland erneut eine Antisemitismus-Debatte entbrannt. Wie sind die Antisemitismus-Vorwürfe gegenüber der Linken einzuordnen und was würde eine rot-grün-rote Landesregierung für Jüdinnen und Juden in Berlin bedeuten? Dazu im Live-Interview Einschätzungen von Meron Mendel, Direktor der Bildungsstätte Anne Frank in Frankfurt am Main. \n\nParis, Lourdes, Metz: Papst Leo reist nach Frankreich \nVon Freitag bis Montag ist Papst Leo in Frankreich unterwegs. Neben politischen Terminen und großen Messen steht auch ein Treffen mit Missbrauchsbetroffenen auf seinem Programm - an der Auswahl der Betroffenen gibt es jedoch Kritik. Mit Spannung wird zudem erwartet, wie Leo sich zur erzkonservativen Piusbruderschaft positioniert. Sie wurde vor kurzem offiziell aus der katholischen Kirche ausgeschlossen, ist in Frankreich aber sehr aktiv und hat eine vergleichsweise große Anhängerschaft. ..."
