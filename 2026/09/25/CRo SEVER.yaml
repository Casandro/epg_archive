  description: Zpravodajsko-publicistický souhrn z Ústeckého kraje. Dnes bude součástí i volební půlhodina. V pátek 9. a v sobotu 10. října nás čekají komunální volby. Po čtyřech letech tedy budeme opět vybírat nové městské a obecní zastupitele. Český rozhlas Sever vám každý všední den v půl šesté večer představí kandidující strany a hnutí ve všech okresních městech Ústeckého kraje. Dnes to budou kandidáti města Litoměřice.
