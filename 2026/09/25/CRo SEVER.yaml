  title: Host Dopoledního expresu
  description: 'Každoročně si 8. října připomínáme Památný den sokolstva: významný den České republiky, který odkazuje k tragickým událostem roku 1941, kdy byla sokolská organizace rozpuštěna a stovky jejích představitelů zatčeny nacistickým režimem. Co pro nás odkaz sokolských hrdinů znamená v dnešní době? Jaká je historie i současnost Tělocvičné jednoty Sokol a jaké akce se při této příležitosti chystají? Hostem Dopoledního expresu dnes bude Miroslav Korejs, starosta TJ Sokol v Ústí nad Labem. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Lenka Šobová.'
