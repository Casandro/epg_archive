  title: Konzert des Städtischen Orchesters Weingarten (Teil 2)
  subtitle: Unterhaltung
  description: Bei der Musikauswahl führt Stadtmusikdirektor Rafael Ohmayer die alte und bewährte Tradition fort, für jeden Geschmack der Besucher etwas im Repertoire zu haben. Im zweiten Teil erklingen die Filmmusik zu Star Wars"The Force Awakens" von John Williams, "The Merry Widow" Operette von Franz Lehar, das moderne Musikstück "Angel" von M.Brown. Zum Abschluss des Konzertes setzt das Medley "Mayday" von Yap Sin Yee den Schlusspunkt. Aufgezeichnet am 06. Januar 2023 im Kultur- und Kongresszentrum Oberschwaben.
