  subtitle: Gespräch
  description: Hans-Albert Courtial ist mit dem römisch-katholischen Virus infiziert und lebt seit Jahrzehnten in Rom. Dort führt er unter anderem eines der schönsten und dem Vatikan am nächsten gelegene Hotel, das Paolo VI. - Der Manager erzählt im Gespräch mit Dr. Claudia Kaminski aus seiner Kindheit und Jugend im katholischen Pfarrhaus von Dietkirchen und von den vielen kleinen und größeren Wundern in seinem Leben - auch von der ihn besonders prägenden ersten Begegnung mit Papst Paul VI., dem Namenspatron des Hotels. Die Wirren um die Enzyklika Humanae Vitae hat er 1968 hautnah mit erlebt. Die Terrasse ist den Zuschauern von K-TV vom Talk aus Rom gut bekannt.
