  title: 'Thema: Fatima und die Päpste'
  subtitle: Spiritualität
  description: Vortrag von Monsignore Dr. Florian KolfhausDie Verehrung der Gottesmutter Maria hat in der katholischen Kirche einen festen Platz - begründet in der Heiligen Schrift und getragen von der Glaubenserfahrung vieler Christen. Besondere Bedeutung haben dabei die Erscheinungen von Fatima im Jahr 1917 erlangt. Die Botschaften der Gottesmutter rufen zu Gebet, Umkehr und Vertrauen auf Gottes Gnade auf. Gerade die Päpste des 20. Jahrhunderts haben ihre geistliche Bedeutung für Kirche und Welt immer wieder hervorgehoben. Monsignore Dr. Florian Kolfhaus spricht in seinem Vortrag über die bleibende Aktualität von Fatima und darüber, was die Botschaft von damals uns heute zu sagen hat. Der Vortrag wurde beim Kongress "Treffpunkt Weltkirche" von KIRCHE IN NOT im März 2015 aufgezeichnet.
