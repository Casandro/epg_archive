  title: Gesprächszeit
  subtitle: mit Olaf Rathje
  description: Linh Tran zählt zu den ganz besonderen Weltmeisterinnen - schließlich wissen die wenigsten Menschen, dass es überhaupt eine Weltmeisterschaft im Tischfußball gibt. Dabei hat die Hamburgerin diesen Titel bereits fünfmal gewonnen. Sie ist die einzige Frau, die es geschafft hat, als Profi vom Tischfußball zu leben. Im Gespräch erzählt sie, warum Tischkickern auch ein Mentalsport ist. Und warum sie als Kind vietnamesischer Einwanderer früher am stetigen Leistungsdruck fast zerbrochen wäre.
