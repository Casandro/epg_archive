  description: 'Afrikanische Wildhunde, eine stark gefährdete Tierart, gelten als brutale Killer. Die Volontäre benötigen im Umgang mit ihnen gute Nerven, nicht nur wegen des ohrenbetäubenden Kläffens der Tiere und wegen ihrer oft unterschätzten Gefährlichkeit, sondern auch, weil sie als Futter bestialisch stinkende Eingeweide lieben. Andere haben es besser getroffen: Sie dürfen mit den entzückenden Baby-Pavianen im Pool plantschen. Die erwachsenen Paviane werden auf einer knochenharten Tour beherzt mit Milipap versorgt - ein traditioneller Maisbrei, der für die Affen pikanterweise mit Essensresten gestreckt wird.'
