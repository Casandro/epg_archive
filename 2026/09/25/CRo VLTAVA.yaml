  title: ArtCafé
  description: 'Byt či nebyt? Festival Film a architektura přibližuje různé představy obyvatel, architektů, politiků i developerů o podobě měst a hledá odpovědi na otázky, jak chceme ve městech žít a bydlet. Představí také vizionáře, kteří zpochybňují zažité představy o architektuře a bydlení. V ArtCafé se zaměříme na film Holešovice o gentrifikaci této pražské čtvrti a americký snímek Building on the Edge, který představuje jeden z možných způsobů, jak prostřednictvím architektury a designu hledat nové odpovědi na otázku bydlení. Agáta Hrnčířová přivítá dramaturga festivalu Václava Ševčíka, architektku Šárku Malošíkovou a režiséra Huga Wiesnera. E-mail: artcafe@rozhlas.cz'
