  title: Vizitka
  description: 'Barbora Kundračíková, historička umění a šéfkurátorka Muzea umění Olomouc-Středoevropského. Ještě dlouho po studiích ji práce s živým uměním nijak nelákala. V posledních letech je to ale pro kurátorku a historičku umění Barboru Kundračíkovou naprostá priorita. Pracuje jako šéfkurátorka Muzea umění Olomouc - Středoevropského fóra (SEFO), kde vede zdejší sbírky moderního umění. Odborně se zaměřuje především na evropské výtvarné umění 20. a 21. století, mechanickou reprezentaci (fotografii a grafiku), metodologii dějin umění a analytickou estetiku. Je pro ni při práci se současným uměním důležité tomu, co vidí, porozumět, anebo je pro ni taky zásadní nechat v sobě interpretaci díla doznívat? A jaký byl třetí ročník festivalu České sny ve Lvově, pro který připravila výstavu Nová mytologie? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
