  title: MareTV
  subtitle: Meeresarm zwischen England und Wales - Der gewaltige Bristol Channel
  description: 'Nautische Lotsen und Surfer brauchen hier alle Nerven wie Stahl, da es im Mündungsgebiet des Flusses Severn einen Tidenhub von bis zu 15 Metern gibt. Wenn der Mond günstig steht, bringt die zweitgrößte Gezeitenwelle der Welt die Herzen der Surfer zum Rasen. Steve King hält den Weltrekord auf der Severn Bore. Vor Jahren legte er 15 Kilometer ohne Unterbrechung mit seinem Brett auf dem Rücken einer wahrhaft wundersamen Welle zurück. Lundy liegt vor der Küste von North Devon am Eingang zum Bristol Channel. Mit einer Bevölkerung von nur 28 Personen sind sie bei rauem Wetter oft auf sich allein gestellt. Paul Barnett wuchs neben einem enormen Schiffsfriedhof auf. Zwischen 1909 und 1963 wurden mehr als 70 ausgemusterte Schiffe absichtlich in der Nähe von Purton versenkt: Die Wracks sollten der Erosion der Severn-Ufer entgegenwirken.'
