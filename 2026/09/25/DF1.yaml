  title: MareTV
  subtitle: Schweden - Hohe Küste am Bottnischen Meerbusen
  description: 'Schwedens Höga Kusten (Hohe Küste) hebt sich seit der letzten Eiszeit vor 10.000 Jahren um knapp einen Zentimeter pro Jahr. So ist eine hügelige Ostseelandschaft am Bottnischen Meerbusen mit kleinen und großen Inseln entstanden. Unberührte Natur, dichte Wälder und tatkräftige, recht eigenwillige Inselbewohnerinnen und -bewohner haben dort ganz viel Platz. Immer Ende August mischt sich dort ein beißender Gestank in die frische Ostseebrise. Über Wochen ist der sogenannte saure Hering, schwedisch: Surströmming, in Salzlake gegoren. Ruben Madsen ist Surströmming-Produzent und absoluter Kenner.'
