  title: Podróże z historią 4 (odc. 4)
  subtitle: Radosław Kotarski wyrusza do obiektów, o których do niedawna wiedziało kilkanaście osób w państwie, aby sprawdzić, jak w czasach zimnej wojny przygotowywano się do nadejścia katastrofy atomowej.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Jak w czasach zimnej wojny przygotowywano się do nadejścia atomowej katastrofy? Gdzie miały chronić się najważniejsze osoby w państwie? Jak miało wyglądać ich codzienne życie pod ziemią? Aby to sprawdzić, Radosław Kotarski rusza do obiektów, o których do niedawna wiedziało zaledwie kilkanaście osób w państwie, a umiejscowienie sekretnych budowli było jedną z najważniejszych tajemnic.
  genre:
  - '149'
- eventId: 1004499
  start: 2026-09-25T01:50:00Z
  stop: 2026-09-25T02:21:00Z
  title: Polskie parki narodowe 1 (odc. 8)
  subtitle: Tematem programu będzie Park Narodowy Bory Tucholskie, kraina rozległych lasów, jezior i torfowisk, będąca ostoją wielu rzadkich gatunków roślin i zwierząt.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziejczyk
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
