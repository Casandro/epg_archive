  title: Der Nachmittag
  subtitle: mit Dirk Böhling
  description: "Egal ob Sie noch auf der Arbeit sind oder schon auf dem Heimweg - Bremen Eins sorgt für Kopfkino. Viele der \"Größten Hits aller Zeiten\" erinnern an schöne persönliche Momente und schicken Sie mit einem guten Gefühl in den Feierabend. \nIn den Rundschauen um 16 und 17 Uhr informieren wir Sie kompetent und umfassend über die Themen des Tages aus Bremen, Bremerhaven, Niedersachsen und der Welt. Wie das Wetter wird, erfahren Sie ausführlich von unseren Wetterexperten um 16:15 Uhr."
