  title: Heimatleuchten - Anders als andere - Der mutige Rosserer & Der Tausendsassa
  subtitle: Heimatleuchten - Anders als andere - Der mutige Rosserer & Der Tausendsassa
  description: 'Zwei Menschen geben Einblicke in ihr Leben, das "anders verläuft als andere": Schicksalsschläge sind das "Schicksal" Tischlers Christian Leidinger: Der tragische Tod des Vaters, eine Rückenverletzung, zwei Scheidungen. Doch der Bludenzer Optimist wagt sich an die ersten astfreien Zirbenholzbetten und führt als erster in Vorarlberg die vier Tage Woche ein. Für seinen Traum verschuldet er sich doch er erschafft einen einzigartigen Ort! Der Rauriser Markus Rainer hat drei Leben gelebt! Als Zimmerer führt er bis zu 20köpfigen Teams. Dann muss er über Nacht den elterlichen maroden Hof übernehmen. Er saniert und züchtet Pferde bis ein Pferdetritt seinen Schädel zertrümmert. Nach Monaten im Koma züchtet er sofort weiter - doch sein Leben hat sich verändert. AT 2024'
  ageRating: 6
