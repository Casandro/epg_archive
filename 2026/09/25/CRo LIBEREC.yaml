- eventId: 1165196
  start: 2026-09-25T09:05:00Z
  stop: 2026-09-25T09:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Bezpečné teplo. Kominík a jednatel společnosti AHA komín Marek Hauer. Se začátkem topné sezony mají kominíci plné ruce práce. V průběhu září a října si je totiž majitelé kotlů objednávají na čištění komínů a spalinových cest před zahájením topné sezóny. Na co bychom měli před návštěvou kominíka myslet, jak bychom měli postupovat při prvním zatápění, to vše probereme hodinu před polednem.'
