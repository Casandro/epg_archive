  title: ARD Nachtkonzert - präsentiert von BR-KLASSIK
  description: |-
    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Edward Elgar: "In the South", Ouvertüre (Radio-Sinfonieorchester Stuttgart des SWR: Roger Norrington); Luigi Cherubini: Streichquartett Nr. 5 F-Dur (Hausmusik London); Ernst Eichner: Harfenkonzert C-Dur, op. 6, Nr. 1 (Silke Aichhorn, Harfe; Kurpfälzisches Kammerorchester: Stefan Fraas); Benjamin Britten: "Sacred and Profane", op. 91 (SWR Vokalensemble Stuttgart: Marcus Creed); Johann Georg Lickl: Bläsertrio Es-Dur (Dirk Altmann, Klarinette; Libor Sima, Fagott; Wolfgang Wipfler, Horn); Antonín Dvorák: Romanze f-Moll, op.

    0.03  Das ARD-Nachtkonzert (I)

    Präsentiert von BR Klassik

    Edward Elgar: "In the South", Ouvertüre (Radio-Sinfonieorchester Stuttgart des SWR: Roger Norrington); Luigi Cherubini: Streichquartett Nr. 5 F-Dur (Hausmusik London); Ernst Eichner: Harfenkonzert C-Dur, op. 6, Nr. 1 (Silke Aichhorn, Harfe; Kurpfälzisches Kammerorchester: Stefan Fraas); Benjamin Britten: "Sacred and Profane", op. 91 (SWR Vokalensemble Stuttgart: Marcus Creed); Johann Georg Lickl: Bläsertrio Es-Dur (Dirk Altmann, Klarinette; Libor Sima, Fagott; Wolfgang Wipfler, Horn); Antonín Dvorák: Romanze f-Moll, op. 11 (Natalie Chee, Violine; Radio-Sinfonieorchester Stuttgart des SWR: Asher Fisch)

    2.03  Das ARD-Nachtkonzert (II)

    Louis Spohr: Concertante h-Moll, op. 88 (Ulf Hoelscher, Gunhild Hoelscher, Violine; Rundfunk-Sinfonieorchester Berlin: Christian Fröhlich); Joseph Haydn: Streichquartett h-Moll, op. 64, Nr. 2 (Angeles String Quartet); Anton Bruckner: Adagio Ges-Dur (Rundfunk-Sinfonieorchester Saarbrücken: Stanislaw Skrowaczewski); Peter Tschaikowsky: "Eugen Onegin", Briefszene der Tatjana aus dem 1. Akt (Juliane Banse, Sopran; Deutsche Radio Philharmonie Saarbrücken Kaiserslautern: Christoph Poppen); Amy Beach: Sinfonie e-Moll, op. 32 (Detroit Symphony Orchestra: Neeme Järvi)

    4.03  Das ARD-Nachtkonzert (III)

    Joseph Wölfl: Klavierkonzert Nr. 6 D-Dur (Yorck Kronenberg, Klavier; SWR Rundfunkorchester Kaiserslautern: Johannes Moesus); Claude Debussy: "La damoiselle élue" (Sylvia McNair, Sopran; Susan Graham, Mezzosopran; Tanglewood Festival Chorus; Boston Symphony Orchestra: Seiji Ozawa); Ermanno Wolf-Ferrari: "Venezianische Suite", op. 18 (Oviedo Filarmonia: Friedrich Haider)

    5.03  Das ARD-Nachtkonzert (IV)

    François-Joseph Gossec: Sinfonie F-Dur, Allegro molto, op. 12, Nr. 6 (London Mozart Players: Matthias Bamert); Franz Berwald: Sinfonie Nr. 3 C-Dur, Allegro fuocoso (Göteborger Sinfoniker: Neeme Järvi); Antonio Vivaldi: Konzert B-Dur, RV 553 (Berliner Barock Solisten); Henri Herz: Klavierkonzert Nr. 4 E-Dur, Allegro moderato (Tasmanian Symphony Orchestra, Klavier und Leitung: Howard Shelley); Georg Friedrich Händel: Concerto grosso e-Moll, HWV 321 (Academy of St. Martin in the Fields: Iona Brown); Franz Schubert: Streichquartett g-Moll, Allegro, D 173 (Quatuor Modigliani)
