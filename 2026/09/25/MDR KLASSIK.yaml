  title: MDR KLASSIK - Konzert
  description: |-
    Konzert

    Romantik pur! Mit dem Teufel tanzen

    Carl Maria von Weber: Klarinettenquintett B-Dur op. 34
    Jörg Widmann: »Danse macabre« Fantasie für Klarinette solo
    Felix Mendelssohn Bartholdy: Sinfonie Nr. 5 d-Moll/D-Dur op. 107 »Reformation«

    Sächsische Staatskapelle Dresden
    Jörg Widman, Dirigent/Klarinette/Moderation

    (Aufnahme v. 20.09.26, Dresden, Kulturpalast)


    Gemeinsam mit Jörg Widmann lädt die Sächsische Staatskapelle Dresden zu einer Entdeckungsreise in die Welt der Romantik ein. Unter dem Titel »Romantik pur! Mit dem Teufel tanzen« begegnen sich Werke von Carl Maria von Weber, Felix Mendelssohn Bartholdy und Widmann selbst.

    Konzert

    Romantik pur! Mit dem Teufel tanzen

    Carl Maria von Weber: Klarinettenquintett B-Dur op. 34
    Jörg Widmann: »Danse macabre« Fantasie für Klarinette solo
    Felix Mendelssohn Bartholdy: Sinfonie Nr. 5 d-Moll/D-Dur op. 107 »Reformation«

    Sächsische Staatskapelle Dresden
    Jörg Widman, Dirigent/Klarinette/Moderation

    (Aufnahme v. 20.09.26, Dresden, Kulturpalast)


    Gemeinsam mit Jörg Widmann lädt die Sächsische Staatskapelle Dresden zu einer Entdeckungsreise in die Welt der Romantik ein. Unter dem Titel »Romantik pur! Mit dem Teufel tanzen« begegnen sich Werke von Carl Maria von Weber, Felix Mendelssohn Bartholdy und Widmann selbst. Mit musikalischen Beispielen, persönlichen Einblicken und großer Begeisterung eröffnet Widmann neue Zugänge zu einer Epoche, deren Faszination bis heute ungebrochen ist.
