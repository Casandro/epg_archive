  description: Die Kroatien-Rundfahrt ist ein mehrtägiges Etappen-Radrennen, das erstmals 1994 ausgetragen wurde. Innerhalb der UCI Europe Tour ist es ein Radrennen der UCI-Kategorie 2.1. Erst seit 2015 findet die Kroatien-Rundfahrt regelmäßig statt. Während der Etappen sind einige schwierige Anstiege zu bewältigen. Der populärste Sieger dieses Etappenrennens war Vincenzo Nibali im Jahre 2017. (2026)
