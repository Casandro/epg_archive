  title: ErlebtTV - Ich fühlte mich ausgeschlossen
  subtitle: ErlebtTV - Ich fühlte mich ausgeschlossen
  description: 'Ich gehöre nicht dazu. Dieses Gefühl vereint die drei Frauen der heutigen Sendung. Christy Pulis Leben ist geprägt von Gewalt, Missbrauch und Drogensucht. Dies ändert sich erst, als sie ins Gefängnis kommt. Nancy Amoah fühlt sich als Dunkelhäutige von ihrem Umfeld ausgegrenzt. Und Hope Donithan verzweifelt an einem Satz, den sie als Kind von einem Freund gehört hat. (Moderation: Sabine Bhandari / Andreas Waldmann)'
- eventId: 1123859
  start: 2026-09-25T00:29:00Z
  stop: 2026-09-25T00:59:00Z
  title: ERF Mensch Gott - Gott gibts echt! - "Ich suchte Liebe und verlor mich selbst"
  subtitle: ERF Mensch Gott - Gott gibts echt! - "Ich suchte Liebe und verlor mich selbst"
  description: Katja stürzt von einer Beziehung in die andere - immer auf der Suche nach Liebe und Nähe. Sie heiratet, doch glücklich wird sie nicht. Um nicht verlassen zu werden gibt sie sich selbst auf. Sie geht mit ihrem Mann in Swingerclubs  obwohl sie dabei innerlich zugrunde geht. Vor manchen Abenden trinkt sie eine ganze Flasche Wodka, um das überhaupt auszuhalten. Als sie glaubt, alles verloren zu haben, schickt sie einen verzweifelten Hilfeschrei zum Himmel.
- eventId: 1123860
  start: 2026-09-25T00:59:00Z
  stop: 2026-09-25T01:29:00Z
  title: Antworten mit Bayless Conley - Jesus - Herr über Körper, Seele und Geist
  subtitle: Antworten mit Bayless Conley - Jesus - Herr über Körper, Seele und Geist
  description: 'Sie sind weit mehr als das, was man von außen sieht: ein einzigartiges Zusammenspiel aus Geist, Seele und Körper. In dieser Predigt über drei außergewöhnliche Geschichten aus Markus 5 zeigt Ihnen Bayless Conley, dass Jesus der Herr über alle drei Bereiche Ihres Lebens ist.  Jesus schenkt - Freiheit für Ihre Seele von mentaler Belastung, - Heilung für Ihren Körper von Krankheit und - neues Leben für Ihren Geist, das bis in die Ewigkeit reicht. Erleben Sie, dass keine Situation außerhalb der Reichweite von Gottes verändernder Kraft liegt!'
