  title: Interview :24 (184)
  subtitle: Peter Dvorský. Relácia reaguje na aktuálne alebo nadčasové témy rezonujúce vo verejnom priestore, v politike, na sociálnych sieťach, v médiách. Približuje zaujímavých hostí, osobnosti, ich myšlienky, život.
  description: Hosťom relácie Interview 24 je Peter Dvorský, jeden z najvýznamnejších slovenských operných spevákov a tenorista, ktorý sa zaradil medzi svetovú špičku svojej generácie. Pri príležitosti jeho 75. narodenín sa obzrieme za mimoriadnou kariérou, ktorá viedla zo Slovenska na javiská milánskej La Scaly, viedenskej Štátnej opery, londýnskeho Covent Garden či Metropolitnej opery v New Yorku. Rozhovor priblíži jeho najväčšie umelecké úspechy, stretnutia s legendami svetovej opery, ale aj roky, počas ktorých sa venoval podpore mladých talentov, vedeniu operných scén a reprezentácii slovenskej kultúry v zahraničí. Reč bude aj o tom, čo zostáva po desaťročiach na javisku najdôležitejšie, ako sa mení operný svet a čo pre Petra Dvorského znamená hudba dnes. (2026)
  genre:
  - '36'
- eventId: 1219674
  start: 2026-09-25T18:30:00Z
  stop: 2026-09-25T19:30:00Z
