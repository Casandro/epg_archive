    Eine Nacht im Dschungel

    Taylor hat Ärger mit ihrem Vater Hector, weil sie mal wieder ihr Zimmer nicht aufgeräumt hat. Aus ihrer Sicht ist das Zeitverschwendung. In der Natur wird ja auch nicht ständig aufgeräumt.

