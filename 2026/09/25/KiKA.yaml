    Jon gibt viel Geld aus, um im Haus jeden Lichtschalter, alle elektrischen Geräte und die Jalousien mit seinem Computer verkabeln zu lassen. Jetzt glaubt er, dass er mit Hilfe einer Haushaltsüberwachungs-Software in Zukunft alles ganz bequem steuern kann. Doch als der Blitz ins Haus einschlägt, dreht die Software durch. Die eben noch so nette Frau namens Millie, die auf dem Bildschirm erschienen war und jeden Wunsch von Jon erfüllt hat, wird zu einer Furie. Sie übernimmt die Macht im Haus und hetzt die elektrischen Geräte auf Jon, Garfield und Odie. Der zur Hilfe gerufene Computernerd ist auch keine große Hilfe. Die Lage scheint aussichtslos zu sein...
