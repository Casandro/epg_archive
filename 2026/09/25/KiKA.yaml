  title: Die Biene Maja
  subtitle: Wer findet den Schatz?
  description: |-
    Wer findet den Schatz?

    Flip veranstaltet seine jährliche Schatzsuche, und Maja will, wie jedes Jahr, mitmachen. Willi hat keine Lust, denn bei der letzten Suche wurde er fast von einem Frosch gefressen.

    Deshalb ist er froh, als die Königin Maja und ihn bittet, im Bienenstock zu bleiben, um auf ihre kleine Nichte Clara aufzupassen. Doch Clara hat von der Schatzsuche Wind bekommen und reißt aus. Heimlich beobachtet sie, wie das erste Rätsel lautet und löst es fix.

    Auch die anderen Rätsel, die Flip an verschiedenen Stationen für die Teilnehmer aufgestellt hat, sind kein Problem für Clara. Schnell lässt sie die anderen wie Ben, Rufus und Max hinter sich.

    Als Maja und Willi bemerken, dass Clara nicht mehr im Bienenstock ist, fliegen sie hinaus auf die Wiese, um sie zu suchen. Die beiden grasen nun ebenfalls alle Stationen der Rallye ab. ...
