    Wer zweimal lügt ...

    Frau Kassandra bittet Willi und Maja, den jüngeren Bienenschülern Summsi, Brummel und Flitzi die Wiese zu zeigen. Als Erstes fliegen sie mit den Drillingen zu Oberst Paul und danach zu Kurt.

    Sowohl Paul als auch Kurt gestalten ihren Vortrag über ihre Aufgaben auf der Wiese sehr langatmig, und so langweilen sich die Kleinen. Um sich zu unterhalten und den Wiesenaufenthalt spannender zu gestalten, verschwinden zwei, und das Dritte schlägt falschen Alarm.

    Es behauptet gegenüber den Ameisen, Maja und Willi, dass jeweils zwei von ihnen in Not seien. Als dann Maja und Willi tatsächlich in Not geraten und die Drillinge bei den Ameisen um Hilfe bitten, glaubt Paul ihnen nicht mehr. Die Kleinen müssen die Ameisen erst mit einem Trick zum Teich locken, wo Paul dann mit eigenen Augen sieht, dass Maja und Willi vom Frosch bedroht werden.
