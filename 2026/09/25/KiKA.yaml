  title: Sesamstraße
  subtitle: Das Versteckspiel
  description: |-
    Lernen mit Spaß für Kinder

    Das Versteckspiel

    Elmo spielt mit Elin, Samson und Pferd Verstecken und Krümel zeigt, wie man einen Keks hören kann.

    Bert freut sich auf eine entspannte Lektüre, als Ernie vorbeikommt und ein "Fantasieschlagzeug" aufbaut.

    Bei "1,2,3... los geht's" ist Ava (7) schon richtig aufgeregt. Sie will heute zum ersten Mal Bus fahren - ohne Eltern. Hoffentlich klappt alles!

    Außerdem zeigt Krümel anhand eines Kekses, welche Sinne es gibt. Er ertastet den Keks, riecht ihn, sieht ihn, schmeckt ihn, aber hören kann er ihn nicht. Da kommt ihm eine Idee, wie man den Keks doch hören kann.

    Kiwi ist krank. So krank, dass er noch nicht einmal Lust hat, mit Strit Fahrrad zu fahren. Strit will ihn daher schnell wieder gesund machen. Doch was er auch immer mit seinem Freund Kiwi anstellt, entweder scheint dieser viel zu heiß zu sein oder viel zu kalt. Was tun?
    Regie: Dirk Nabersberg, Jojo Wolff

