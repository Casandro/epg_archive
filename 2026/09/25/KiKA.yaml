  title: Pip und Posy
  subtitle: Biggel und Boggel
  description: |-
    Biggel und Boggel

    Pip und Posy spielen Piraten und suchen sich dafür aus Frankies Spielekiste passende Figuren heraus: Es sind Biggel und Boggel. Froschi und Schweinchen sind plötzlich vergessen.

    Zac wundert sich darüber und fragt, ob Biggel und Boggel jetzt ihre neuen Schweinchen und Froschi wären. Da wird ihnen klar, wie unfair sie ihre alten Lieblingsspielzeuge behandelt haben und wollen die neuen wieder an Frankie zurückgeben.

    Aber die macht ihnen wiederum klar, dass Lieblingsspielzeuge genau wissen, wohin sie gehören.
