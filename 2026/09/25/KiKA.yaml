    Alle Unterwasserbewohner sind in heller Aufregung. Doch damit nicht genug: Cleos Schwester Kim hat Cleos Tagebuch gefunden und glaubt nun, Cleo sei eine Meerjungfrau. Cleo und ihre Freundinnen haben alle Hände voll zu tun, sie vom Gegenteil zu überzeugen.
