    Der Regenbogen

    Sam und Julia hatten vor, im Hof beim Brunnen zu spielen. Doch es regnet seit Tagen. Da erinnert sich Julia, dass auf ihrer Insel auf den Regen meist ein Regenbogen folgte.

    Sie erinnert sich auch, dass Regenbogen Farbrutschen für die Wolkenkinder sein sollen. Sam und Julia beschließen, den Regen so zu stoppen. Sie bemalen die Rutsche auf der überdachten Terrasse in Regenbogenfarben. Nun müsste der Regen doch bald aufhören.
    Regie: Régis Vidal
