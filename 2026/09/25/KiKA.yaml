    Ange bekommt eine neue Frisur. Mama flechtet ihr ganz viele Zöpfchen und steckt bunte Perlen drauf. Jetzt fehlen nur noch Haargummis und Knoten, damit alles gut hält. Eva hat einen neuen Song! In dem verrät sie den Hasenohren-Trick: So klappt das Schleife binden ganz einfach. Und Uke hüpft wie ein Hase durch seinen selbst gebauten Parcours aus Schuhen. Mehr Geschichten mit Schleifen und Knoten gibt es in dieser elefantastischen Folge.
