    Ein magischer Steinkreis im Meer hat ihn erfüllt, aber auf sehr eigene Art. So ist Cleo zwar noch Meerjungfrau, aber sie erinnert sich nicht mehr daran. Emma und Rikki haben gut damit zu tun, die unwissende Cleo vor Wasser zu schützen und einen Ausweg zu finden.
