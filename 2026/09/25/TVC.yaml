    To seria dokumentalna o największych katastrofach inżynieryjnych w historii, takich jak Czarnobyl, Bhopal, Deepwater Horizon, Titanic, Challenger i Hindenburg. Przedstawia śmiałe eksperymenty technologiczne z tragicznymi skutkami dla ich twórców i ofiar, wykorzystując archiwalne materiały i opinie ekspertów. Dokumentalna seria otrzymała dwie nagrody Telly w 2020 i 2021 roku, a także była nominowana do nagród Daytime Emmy.
