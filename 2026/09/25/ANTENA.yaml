  title: Prześladowana
  subtitle: Oparty na faktach film o odwadze i determinacji. Wychowywana w skrajnie religijnym środowisku nastolatka trafia do zamkniętego ośrodka po tym, jak bliscy dowiadują się o jej orientacji seksualnej.
  description: |-
    Tytuł oryginalny: Trapped: The Alex Cooper Story
    US, 2019
    Reżyseria: Jeffrey G. Hunt
    Występują: Addison Holley, Nicolette Pearse, Ian Lake, Sarah Booth, Kate Drummond, Wilson Cruz
    Poruszający, oparty na faktach dramat nastolatki wychowanej w skrajnie religijnym domu. Gdy bliscy dowiadują się o jej orientacji seksualnej, dziewczyna zostaje siłą wysłana do rygorystycznego ośrodka terapeutycznego. Aby przetrwać codzienne tortury i surowe kary, nastolatka decyduje się na ryzykowną strategię: udaje skruchę i posłuszeństwo, jednocześnie potajemnie planując ucieczkę z pomocą zaufanego sprzymierzeńca. Obsada: Addison Holley, Sarah Booth, Ian Lake
