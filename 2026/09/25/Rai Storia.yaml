  title: Buonasera Presidente Sandro Pertini
  subtitle: 'È stato forse il Presidente più amato, vicino al suo popolo: in molti lo chiamavano il "Nonno d''Italia". È Sandro Pertini il protagonista di questo appuntamento con "Buonasera Presidente", la docu-fiction co-pr'
  description: "odotta da Anele e Rai Storia. Nel \"faccia a faccia\" con il giornalista Filippo Ceccarelli il presidente Pertini è impersonato dall'attore Thomas Trabacchi. Al Quirinale dal 1978 al 1985, qualcuno scrisse che di lui si sa tutto: dal passato di antifascista condannato all'ergastolo e a morte, al presente di socialista privo di fanatismi e di dogmi; il suo coraggio, la sua onestà, la sua dignità e la sua lingua lunga. Con gli italiani ha saputo gioire per le vittorie ma anche piangere e soffrire. Si recò di persona a Vermicino, per il piccolo Alfredino Rampi, rompendo tutte le regole del cerimoniale e sfondando i confini tra istituzioni e gente comune. Un Presidente anziano ma non per questo privo di forza; amava i giovani, la musica, il teatro e naturalmente il calcio. In tanti hanno raccontato che sperava in una rielezione, perché temeva che dopo le luci del Quirinale, \"si sarebbe spento come una candela ad un soffio di vento\". \"Buonasera Presidente\" è realizzata con la consulenza editoriale di Filippo Ceccarelli e quella storica di Sabino Cassese e Alberto Melloni, è prodotta da Gloria Giorgianni, ideata e scritta da Filippo Ceccarelli, Alessandra Cravetto, Marco Dell'Omo, Giacomo Faenza e Davide Minnella. - \n\nRegia di Giacomo Faenza e Davide Minnella"
