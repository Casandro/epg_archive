  title: Garten & Lecker (6)
  subtitle: Alte Schätze - neuer Garten in Lohmar
  description: Finale - das letzte Gartenfest findet auf einer "Dorfwiese" in Lohmar statt. Diesen 10.000 Quadratmeter großen Gemeinschaftsgarten haben Caro und ihr Mann Florian vor zwei Jahren - mitten im Lockdown - gegründet. Gemeinsam mit den Menschen aus dem Dorf haben sie ein wahres Gartenparadies für Groß und Klein geschaffen. Gemüsebeete zum selbsternten, Naschsträucher mit vielen verschiedenen Beeren, seltene Blumen, eine kleine Fußballwiese für Kinder, eine Boulebahn für Erwachsene, ein Tipi für die Jugend.
