  title: Borgia - Die Verklärung Christi
  subtitle: Borgia - Die Verklärung Christi
  description: Cesare bietet Ludwig an, für ihn Mailand zu erobern, was Kardinal Briconnet alarmiert. Als Carlotta schließlich Cesares Liebe erwidert, weiß er Cesares Pläne zu durchkreuzen. Doch Cesare plant seine Rache. In Spoleto erwartet Lucrezia ein eisiger Empfang. Zwar gelingt es ihr mittels einer List, die Herzen der Bewohner zu erobern, doch Lucrezias Bruder Goffredo beschwört bald neue Probleme herauf. FR 2012
  ageRating: 16
- eventId: 1150816
  start: 2026-09-25T01:40:00Z
  stop: 2026-09-25T02:34:00Z
  title: Borgia - Mariä Himmelfahrt
  subtitle: Borgia - Mariä Himmelfahrt
  description: Cesare drängt darauf, Mailand zu erobern. Um Cesare zu zügeln, gibt König Ludwig ihm Charlotte zur Frau. In Spoleto kann Lucrezia, einen Krieg abwenden. Als sie jedoch schwanger wird, kehrt sie nach Rom zurück und überlässt die Stadt in den Händen ihres Vertrauten Bembo. Giulia will sich durch eine Ehe mit einem anderen Mann finanziell absichern, doch Rodrigo wird sie niemals gehen lassen.  FR 2012
  ageRating: 16
- eventId: 1150817
  start: 2026-09-25T02:40:00Z
  stop: 2026-09-25T03:55:00Z
  title: Borgia - Die Schmerzen Mariens
  subtitle: Borgia - Die Schmerzen Mariens
  description: 'Cesare nimmt Abschied von seiner Frau Charlotte. Mit militärischer List erobert er Mailand für König Ludwig Es kommt zum Konflikt zwischen Rodrigo und Herzogin Caterina. Der Papst setzt Cesares Truppen gegen die Herzogin ein. Lucrezia stiftet Frieden in ihrer Familie: Sie vermittelt eine Aussöhnung zwischen ihrer Halbschwester Isabella und Rodrigo, der seinen Enkel Aurelio in die Arme schließt.  FR 2012'
  ageRating: 16
