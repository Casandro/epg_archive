  title: Cedar Cove - Das Gesetz des Herzens - Eine zweite Chance
  subtitle: Cedar Cove - Das Gesetz des Herzens - Eine zweite Chance
  description: 'Ein neuer Staatsanwalt stellt sich vor in Cedar Cove: Paul und Olivia verstehen sich auf Anhieb. Mit der Assistenzstaatsanwältin Rebecca und ihrer störrischen Art dagegen, hat Paul Schwierigkeiten - so sehr, dass er sie schließlich entlässt. Die Beziehung zwischen Jack und Olivia ist weiter wackelig, wie sich zeigt, als Jack Olivia bittet, mit ihm zusammen zu ziehen. US 2014'
