  title: Borgia - Wer ist wie Gott?
  subtitle: Borgia - Wer ist wie Gott?
  description: Vergebens  belagert Cesare die Festung, in der Herzogin Caterina sich verschanzt hat, doch er gewinnt mit Leonardo da Vinci einen wichtigen Freund. Alfonso D'Este kehrt in Lucrezias Leben zurück und weckt die Eifersucht ihres Mannes Alfonso Di Calabria. Es kommt zum Zerwürfnis zwischen Giulia und Rodrigo, der sich in ein Kloster zurückzieht, und seine Amtsgeschäfte an Lucrezia übergibt.  FR 2012
  ageRating: 16
- eventId: 1150370
  start: 2026-09-25T21:00:00Z
  stop: 2026-09-25T21:54:00Z
  title: Borgia - 1495
  subtitle: Borgia - 1495
  description: Lucrezia führt Rodrigos Geschäfte mit großem Geschick, bis dieser nach Rom zurückkehrt und sie zu seiner Beraterin macht. Cesare führt einen Feldzug gegen abtrünnige Provinzen des Kirchenstaats. Zugleich soll er Rodrigos ehemalige Geliebte Giulia ausspionieren. Von seiner Frau Lucrezia und Cesare gedemütigt, wird Alfonso Di Calabria zum Spitzel von Rodrigos Feinden im Vatikan.  FR 2013
  ageRating: 16
- eventId: 1150371
  start: 2026-09-25T21:55:00Z
  stop: 2026-09-25T22:49:00Z
  title: Borgia - 1496
  subtitle: Borgia - 1496
  description: 'Nach einem epileptischen Anfall lässt Rodrigo Giulia nach Rom zurückkehren, doch ihr Liebesverhältnis ist beendet: Er genießt nun die Gegenwart von Yuisa, einer Frau aus der Neuen Welt. Vorerst verschonen Cesares Truppen Florenz. Als er Pesaro einnimmt und Lucrezias früheren Ehemann Giovanni Sforza tötet, schwört Alfonso Di Calabria Lucrezia, eher Cesare zu töten, als Sforzas Schicksal zu teilen. FR 2013'
  ageRating: 16
- eventId: 1150372
  start: 2026-09-25T22:55:00Z
  stop: 2026-09-25T23:49:00Z
  title: Borgia - 1497
  subtitle: Borgia - 1497
  description: Cesare macht Dorotea Malatesta zu seiner Gefangenen. Während Alfonso D'Este erneut in Lucrezias Leben tritt, treibt Giulia Rodrigos Vertraute Yuisa in den Selbstmord. Della Rovere lässt über seinen Geliebten Alidosi eine Schmähschrift über die Borgia in Umlauf bringen. König Ludwig greift in Cesares Feldzug gegen die Stadtstaaten ein, doch der Heerführer Vitelli unterläuft Cesares Pläne. FR 2013
