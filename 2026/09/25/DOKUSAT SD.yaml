  title: Helden der Evolution - Insekten
  description: Die Erde ist "der Planet der Insekten", denn auf jeden Menschen kommen geschätzt 1,4 Milliarden der kleinen Krabbler und Flieger. In ihrem faszinierenden Reich ist je nach Lebensraum extreme Stärke, Ausdauer oder Flinkheit gefragt. Ihre verblüffende Welt lädt nicht nur am Boden zum Staunen ein, denn auch die geflügelten Insekten kommen natürlich nicht zu kurz.
