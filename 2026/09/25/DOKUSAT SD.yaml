  title: Das unterirdische Reich - Von Festungen und Führerbunkern
  subtitle: Das unterirdische Reich - Von Festungen und Führerbunkern
  description: Unterwelten - über tief in der Erde verborgene Geheimnisse und Schätze Es war eines der gigantischsten Bauvorhaben der Menschheitsgeschichte. Überall im "Dritten Reich" und den von Deutschland besetzten Gebieten wurden 1944 ganze Fabrikanlagen in unterirdische Stollensysteme verlegt, um sie dem Bombenhagel der Alliierten zu entziehen. Sklavenarbeiter mussten bis Kriegsende unter unmenschlichen Bedingungen kilometerlange Tunnel in Berge graben.
