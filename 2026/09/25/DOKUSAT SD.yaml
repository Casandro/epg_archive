  title: Wildes Überleben - Von Natur aus wild
  subtitle: Wildes Überleben - Von Natur aus wild
  description: '"Von Natur aus wild" beobachtet Wildtiere bei einer ihrer wichtigsten Missionen - der Brut und Aufzucht ihrer Jungen. Um das Überleben ihrer Spezies zu sichern, ist der Fortpflanzungsdrang tief in der DNA eines jeden Tieres verwurzelt. Ob Raub- oder Beutetier - für jede Art ist es die größte Herausforderung des Lebens, ihre Nachkommen zu schützen. Vor extremen Witterungsbedingungen, vor hungrigen Jägern oder dem unmittelbar drohenden Hungertod. Dies ist ihre Überlebensmission.'
