  title: Helden der Evolution - Oktopusse
  description: 'Auf in die Tiefe zu den Oktopussen, den Chamäleons der Meere. Diese Folge geht den Geheimnissen der achtarmigen Kraken auf den Grund und zeigt auch ihre nächsten Verwandten: Kalmare, Sepien und Nautilus. Dieses Meeresquartett faszinierender Weichtiere bildet die Gruppe der Kopffüßer. Sie sind agil, hochintelligent und bisweilen tödlich, wie dieser Ausflug in ihre Unterwasserwelt zeigt.'
