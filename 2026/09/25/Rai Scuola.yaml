  description: "del mondo che ci circonda e delle sue regole. In questa puntata ci occupiamo di Tossine. Sostanze velenose e a volte letali, sono migliaia e di natura biologica, prodotte da organismi microbici, vegetali o animali che hanno un'azione dannosa su altri organismi viventi. Sono ovunque. Ne parliamo con Ornella Rossetto, professoressa del Dipartimento di Scienze Biomediche all'Università di Padova e con Cristiana Picco, ricercatrice dell'Istituto di Biofisica del CNR di Genova. Andiamo poi al Don Gnocchi di Milano, con la dottoressa Anna Castagna che ci svela come la tossina più pericolosa al mondo possa diventare un farmaco. Anna Pancaldi ci racconta infine di un misterioso omicidio e di una scoperta che ha cambiato la storia della medicina. - \n\nun programma di Diego Garbati e Francesco Linguiti - con la collaborazione di Massimo Bongiorno, Davide Coero Borga, Federica De Maria, Daniela Mazzoli, Pierluigi Pantini, Luca Perri, Nicoletta Piu, Pino Roggero - a cura di Eleonora Ottaviani - produttore esecutivo Livia Lauriola - progetto a cura di Diego Garbati - regia Pierluigi Pantini - conduce Luca Perri con la partecipazione di Anna Pancaldi"
