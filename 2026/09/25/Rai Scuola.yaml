  description: "ni tra i maggiori esperti del mondo della ricerca e dell'innovazione in vari ambiti del sapere scientifico per mostrare dal vivo cosa la scienza e la tecnologia possano fare per cambiare in meglio la vita di ognuno di noi e come possano anche rappresentare un investimento per il futuro per i giovani che vi si avvicinino. Le STEM (Scienza, Tecnologia, Ingegneria e Matematica) sono ovunque, anche dove non ce le aspetteremmo, e queste puntate hanno come focus proprio la dimostrazione che tanti sono i campi di interesse e altrettante e anche di più sono le loro applicazioni. In questa puntata Davide Coero Borga ci accompagna alla scoperta delle sfide che ci attendono per risanare il territorio: il suolo, le acque, l'aria, negli ultimi due secoli sono stati sfruttati ad un ritmo che oggi ci siamo resi conto non essere più sostenibile. Raccontano la loro esperienza e le loro ricerche Luca D'Angelo, Scienziato Ambientale di Arpa Lombardia; Anna Barra Caracciolo, Ecologa dell'Istituto di Ricerca sulle Acque del CNR; Marco De Sanctis, Biotecnologo sempre dell'Istituto di Ricerca sulle Acque del CNR; e Paolo Pileri, Ingegnere Ambientale del Politecnico di Milano. - \n\nun programma di Davide Coero Borga, Federica De Maria, Diego Garbati, Pierluigi Pantini, Nicoletta Piu, Pino Roggero con la collaborazione di Giuseppe Cembalo, Alberto Polimanti, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti/Giancarlo Russo/Giuseppe Cembalo/Nicoletta Piu conduce Davide Coero Borga"
