  title: Progetto Scienza Newton (pt. 29) ll ciel
  subtitle: Progetto Scienza Newton (pt. 29) ll cielo, dalla media all'alta atmosfera - Newton è il programma di informazione e approfondimento scientifico di Rai Cultura. In questa puntata Davide Coero Borga ospita F
  description: "rancesco Cairo, scienziato dell'atmosfera, ricercatore dell'Istituto di Scienze dell'Atmosfera e del Clima (ISAC-CNR) per parlare di media e alta atmosfera. Ci sono alcuni strati atmosferici che destano molto interesse tra gli scienziati come la stratosfera, che ospita lo strato di ozono. Con Francesco Cairo capiamo qual è lo stato di salute della nostra atmosfera e quali sono le connessioni tra clima e atmosfera. Seguendo un team dell'Esa alle isole Svalbard, nel Mar Glaciale Artico, vediamo come e dove viene studiato il fenomeno della fuga atmosferica dai poli terrestri. Infine, Pietro Greco ci racconta di quando per poco un gruppo di fisici non ha incendiato in un colpo solo l'intera atmosfera terrestre. - \n\nUn programma di Diego Garbati, Francesco Linguiti, Pino Roggero, Davide Coero Borga con la collaborazione di Massimo Bongiorno, Federica De Maria, Mario Ferrari, Pierluigi Pantini, Alberto Polimanti, Nicoletta Piu, Giancarlo Russo a cura di Eleonora Ottaviani, Caterina Mazzuoli progetto a cura di Diego Garbati regia Alberto Polimanti conduce Davide Coero Borga."
