  description: "e i genitori vanno a pescare. Gli Humboldt vengono lasciati nelle loro tane mentre gli adulti si godono un morbido atterraggio di piume su una spiaggia brulicante di cormorani. Stretti in un capannello, i pulcini imperatore devono essere identificati prima di essere nutriti e i loro genitori vengono sommersi da impostori affamati. Le procellarie giganti sono un pericolo sempre presente, mentre i pipistrelli vampiro prendono di mira gli Humboldt. Mentre i piccoli crescono e si lisciano la peluria, sfoggiano acconciature punk. I pulcini imperatore vanno a pattinare su una pista di ghiaccio appena formata, mentre i pulcini saltaroccia si esercitano nel salto. Alla fine tutti i pulcini partono per il mare, affrontando gli stessi pericoli dei loro genitori prima di loro, dai leoni marini agli uccelli predatori, dalle alte scogliere ai ghiacciai. Tutti affrontano enormi sfide. Ci sono un sacco di sorprese lungo il cammino, ma presto i pulcini scoprono la loro vera casa: il mare. Dall'uovo all'adolescenza, le telecamere spia sono state con i giovani pinguini durante i loro primi mesi difficili. Sono con loro mentre se ne vanno. Ci vorranno anni prima che seguano le orme dei genitori e tornino a riprodursi. - \n\n"
