  title: Giraffe, Erdmännchen & Co. (224)
  subtitle: Zoogeschichten aus Frankfurt und Kronberg
  description: 'Endlich ist es soweit: Die neue Frankfurter Brillenbärin Cashu darf ihr Außengehege erkunden. Das geschieht natürlich nur unter strenger Aufsicht von Pflegern und Zoodirektor. Cashu lässt sich davon nicht beirren und erkundet sofort die Bäume ihres Geheges. Denn Brillenbären sind begeisterte Kletterer und dass sie es gut können, beweist Cashu sofort. Sie klettert höher und höher auf die größte Platane der Anlage - doch schafft sie auch den Abstieg? Zoodirektor Prof. Manfred Niekisch und Revierleiterin Claudia Löschmann halten den Atem an.'
