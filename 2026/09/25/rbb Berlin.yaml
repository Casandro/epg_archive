  title: 'Quarks: Einsamkeit - Ein gefährliches Gefühl?'
  description: |-
    In dieser Quarks-Folge zeigen wir, wie viele Menschen von Einsamkeit betroffen sind und wie sich das für die Betroffenen anfühlt. Wir erklären aber auch, was man tun kann, wenn man sich einsam fühlt.
    Über Einsamkeit redet man nicht gerne. Und das obwohl es nicht nur ältere, sondern auch immer mehr junge Menschen trifft. Sich manchmal einsam zu fühlen ist prinzipiell auch "normal". Wenn das Gefühl der Einsamkeit aber chronisch wird, kann es ein gefährliches Warnsignal der Psyche sein.
