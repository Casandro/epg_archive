  title: Morden im Norden (111)
  subtitle: Alte Heimat
  description: 'Im Gartenteich der Lübecker Pension Singer treibt eine Tote. Es handelt sich um die erst tags zuvor angereiste Touristin Suzy Kaufman aus Kanada, die mit ihrer persönlichen Assistentin Edna Briggs ihre Geburtsstadt Lübeck besuchen wollte. Schleifspuren am Tatort weisen darauf hin, dass die vermögende Immobilienmaklerin aus Vancouver nicht durch einen Unfall ums Leben kam. Die Ergebnisse aus der Gerichtsmedizin bestätigen den Verdacht: Frau Kaufman wurde mit einem Schal erstickt und danach ins Wasser geworfen. Die Kommissare glauben zunächst an einen Raubmord.'
