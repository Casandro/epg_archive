  stop: 2026-09-25T00:37:00Z
  title: Kad klapa klapa (2. dio), pučka i predajna kultura
  subtitle: ' '
  description: 'Prije 50 godina u Šibeniku, gradu vrhunskih glazbenika, skupina mladića osnovala je - danas legendarnu - klapu Šibenik. Njihove jedinstvene obrade i izvedbe šibenskih izvornih narodnih pjesama odvele su ih odmah i do omiškog festivala, gdje su zatim godinama osvajali i žiri i publiku. To je bila prva klapa koja je nastupila u hramu klasične glazbe, velikoj dvorani KD V. Lisinskog, prva na splitskom festivalu, prva koja je punila kazališta i imala turneje po Americi... Suradnja s velikim skladateljima Arsenom Dedićem i Dušanom Šarcem stvorila je i novi glazbeni žanr, šibensku varošku pjesmu, koja je postala toliko popularna da se neke od tih pjesama danas smatraju narodnima. Svih tih desetljeća postojanja i nevjerojatne popularnosti klape Šibenik opstajala su među njezinim članovima i čvrsta prijateljstva, koja su, uz vrhunski profesionalizam, zapravo bila i tajnom njihovog velikog uspjeha. Istraživač: Stanko Ferić'
