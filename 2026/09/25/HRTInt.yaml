  title: Kod nas doma
  subtitle: ' '
  description: Renault 4, mini, buba i fićo bili su obiteljski automobili, statusni simboli i nezaobilazan dio naših cesta. Sada se ti kultni četverokotačni junaci vraćaju u dokumentarnoj seriji "Ide auto!", a kroz njihove priče i uspomene vode nas Juraj Šebalj i Mario Petreković, koji nam dolaze u goste. Nakon gotovo pet godina Jure Brkljača objavio je drugi studijski album "Postoji san" i tim nam povodom također stiže u goste. U rubrici "Razgovor sa stavom" Bruno Šimleša s Dubravkom Jagatićem i Tomislavom Horvatom razgovara o slučaju Eda Sheerana i tome gdje je granica između umjetnosti, osobnog stava i društvene odgovornosti.
