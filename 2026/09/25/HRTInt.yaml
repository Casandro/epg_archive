- eventId: 1132351
  start: 2026-09-25T20:44:00Z
  stop: 2026-09-25T21:28:00Z
  title: Dolina sunca, serija (16/210)
  subtitle: ' '
  description: 'Eva ostane zatečena kada sazna od Julije da ju je Vjeko planirao ostaviti. Adela panično uvjerava Nikolu da ne smije prihvatiti posao kod njih. Juran je uvjeren u to da se Nataša ne bi usudila uzimati tablete njemu iza leđa, ali Sonja inzistira na tome da malo istraži. Adela uspije uvjeriti Nikolu da odbije posao. Karlo je zabrinut kako će Augustina reagirati kada sazna da konobari kako bi dodatno zaradio. Julija je ljuta na Andriju što je prihvatio posao i izdao ju kada ga je najviše trebala. Lovro je zabrinut za oca i savjetuje mu da malo uspori s pićem. Nikola se upusti u razgovor s Lovrom i jada mu se, te mu izleti kako je skoro izazvao sudar, ali ga moli da nikome ništa ne kaže. Ivanu nije jasno što je Nikoli u zadnje vrijeme, pa upita Adelu zna li nešto. Sonja pokušava pronaći tablete u Natašinoj sobi, ali ju Nataša zatekne. Ruža i Nikola su razočarani što će Andrija restaurirati za Evu staru Sofijinu kuću. Juran sretne doktora Otta koji mu kaže da je baš u ovom trenutku Nataša u ordinaciji kod Lade. On odlazi prema ordinaciji i iznenadi se kad čuje razgovor između Lade i Nataše... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1132352
  start: 2026-09-25T21:28:00Z
  stop: 2026-09-25T21:53:00Z
  title: Druga strana
  subtitle: ' '
  description: 'Geopolitičke napetosti rastu. Središnje banke Amerike i Europe dižu kamatne stope, a investitori ne slijede stara, utabana pravila.Zašto ne kupuju obveznice koje nude veći prinos nego prije? Tko se boji vrtoglavog rasta državnog duga i inflacije? Hoće li na cijenu zlata više utjecati Hormuz ili indijska sezona vjenčanja? I zašto Europska središnja banka prati cijenu piva na Oktoberfestu? Kako je to davne 2008 govorio politolog Daniel Drezner: "Kada Sjedinjene Države duguju Kini stotine milijardi dolara, onda je to američki problem. No, kad joj duguju 600 tisuća milijardi dolara, onda je to kineski problem." Kina i Amerika zaglavile su u nužnoj ravnoteži i balansu međusobnog financijskog terorizma. Iz koje nema izlaza... barem ne lakog. Globalni investitori to su prepoznali. I ne daju se uvući u igru. A američki dug raste kao nikada do sada. I tu dolazimo do prvog tržišnog paradoksa. Amerika obećava više kamate, a to je uvijek značilo pad cijene zlata. Jer, zašto riskirati na tržištu kad američka država nudi sigurnu i stabilnu zaradu? Ove godine to se ne događa! Investitori pokazuju veći apetit prema zlatu od središnjih banaka do ETF-ova. Slijedi li oporavak ili novi tržišni zlatni balon, odgovara Vladimir Potočki, ekonomski analitičar i stručnjak za tržište plemenitih metala.'
