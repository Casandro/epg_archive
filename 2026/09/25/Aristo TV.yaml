  title: Entdecke die Welt - Paznaun
  description: Noch bis Mitte des 20.Jahrhunderts zählte das Paznaun zu den ärmsten Regionen Österreichs. Die Bergbauern konnten sich nur mit Mühe am Leben halten und mussten sogar ihre Kinder über Monate ins Ausland als Schwabenkinder abgeben. Heute zählt das Tal zu den bekannteste und populärsten Wintersportzentren Europas und präsentiert sich auch im Sommer überraschend Vielfältig. Vom genussvollen Wandern bis hin zur Adrenalinquelle beim Biken schöpft das Paznaun alle Ressourcen für seine Gäste aus.
  widescreen: true
- eventId: 1144622
  start: 2026-09-25T12:15:09Z
  stop: 2026-09-25T12:59:35Z
  title: So schmeckt die Welt - So schmeckt das Montafon
  description: Zusammen mit Eva Habermann, zeigen wir Ihnen, dass das Montafon nicht nur kulinarisch ein Traum ist, sondern auch landschaftlich. Berge und grüne Wiesen laden dazu ein, Spaziergänge zu machen und die besten Käseknöpfle ganz Montafon zu probieren. Insbesondere hat sich das Montafon über seine Käsesorten einen Namen gemacht. Dazu gehört auch das legendäre Käsefondue das einen selbst vom Geschmack zum schmelzen bringt. Und natürlich zeigen wir Ihnen, wie dieser besondere Käse und die Butter in der Sennerei gemacht wird. Als Absacker zeigen wir Ihnen die heimischen Kräuter, die gut für Tee und zum Schnapsbrennen geeignet sind.
  widescreen: true
