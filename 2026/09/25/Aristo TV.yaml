  description: 'Er will alles im Griff haben. Egal ob in der Familie oder in seinem anspruchsvollen Job  als TV-Produzent. Denn seit Christian früh seinen Vater verloren hat, sehnt er sich nach  Halt und Sicherheit. Doch dann gerät er in eine Midlifecrisis, die Projekte wachsen ihm  über den Kopf und seine Ehe gerät ins Wanken. Als auch noch der Hund den Postboten  beißt bricht er innerlich zusammen und spürt: Ich habe nichts mehr unter Kontrolle. Der  Beginn einer überraschenden Wende.'
