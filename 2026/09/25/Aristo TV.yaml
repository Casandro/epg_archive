  title: ErlebtTV - Auf der Suche nach finanzieller Sicherheit
  description: 'Drei Menschen erzählen, warum ihnen Wohlstand und finanzielle Sicherheit über alles ging: Tim Rutherford leidet in seinem Beruf als Polizist, trotzdem hält er aus finanziellen Gründen daran fest.  Marco Spalke entscheidet sich früh, nach Reichtum und Erfolg zu streben, doch den Frieden, nach dem er sucht, findet er dort nicht. Das Ehepaar Medina genießt einen unerwarteten Reichtum, bis die beiden vor einem Berg Schulden stehen. (Moderation: Sabine Bhandari / Andreas Waldmann)'
