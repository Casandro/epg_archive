  description: Jeder von uns geht phasenweise durch eine persönliche Wüste. Dies kann eine Wüste mit dem Ehepartner, eine Wüste mit den Kindern, Krankheitswüsten, finanzielle Wüsten oder emotionale Wüsten sein. Damit wir mit der Teststrecke und den damit verbundenen Versuchungen richtig umgehen, gibt uns diese Predigt die notwendigen Einsichten und Hilfestellungen.
