  title: ANIXE auf Reisen - Tampa und Anna Maria Island mit Michael Roll
  description: 'Der bekannte Schauspieler Michael Roll macht sich auf in den berühmten US-Sonnenstaat Florida. Dort erkundet er gleich zwei benachbarte Regionen: Tampa und Anna Maria Island. In der Metropole an der Golfküste erkundet er zunächst die Innenstadt auf einem Wasserfahrrad. Anschließend besucht er das historische kubanische Viertel Ybor City und lernt, wie Zigarren gedreht werden. Weiterhin steht die Erkundung von Busch Gardens auf dem Programm. Der Freizeitpark ist besonders als "El Dorado" für Achterbahn-Freaks bekannt. Auch eine Visite in einem Hospital für verletzte Manatees lässt er sich nicht entgehen. Dort beobachtet er, wie die Seekühe nach der medizinischen Behandlung wieder für die Auswilderung vorbereitet werden.'
