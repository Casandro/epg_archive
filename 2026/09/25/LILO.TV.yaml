  title: So schmeckt die Welt - Nürnberg
  subtitle: So schmeckt die Welt - Nürnberg
  description: Eine fesselnde und trendige Erkundungstour durch Nürnberg, einer Stadt mit reichhaltiger Geschichte. Von der Zeit des Mittelalters über die düsteren Jahre des Nationalsozialismus bis hin zur Gegenwart hat jede Epoche ihre Spuren hinterlassen, die auch heute noch sichtbar sind. Sei es die majestätische Burg, das ehemalige Wohnhaus von Albrecht Dürer, die beeindruckenden Felsenkeller oder das NS-Dokumentationszentrum - all dies zeugt von dem Kulturerbe und der kulturellen Bedeutung Nürnbergs.
  genre:
