  title: Sesamstraße
  description: 'Krümel backt Kekse, Finchen hilft ihm dabei. Was er nicht wusste: Backen erfordert manchmal auch Geduld. In der "Sesamstraße"-Märchenparodie der "Bremer Stadtmusikanten" sind Hund (Ernie) und Esel (Bert) auf dem Weg nach Bremen. In der Dämmerung kommen sie an einer Hütte vorbei, in der Wolf (als Katze) und Huhn (als Hahn) Abendbrot essen. Hund und Esel versuchen, die beiden zu erschrecken, um an ihr Essen zu kommen. Doch statt zu flüchten, lachen Katze und Huhn so sehr, dass es zu einem Lärm-Wettstreit kommt. Am Ende finden die vier zusammen und beschließen, gemeinsam in der Hütte zu bleiben.'
