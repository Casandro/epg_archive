  title: Käpt'ns Dinner
  subtitle: Mit Michel Abdollahi und Menowin Fröhlich
  description: Er wird durch "Deutschland sucht den Superstar" bekannt, sitzt schon als Jugendlicher im Gefängnis und macht später mit Drogenproblemen und weiteren Abstürzen Schlagzeilen. Heute blickt Menowin Fröhlich anders auf sein bewegtes Leben. Mit Michel Abdollahi spricht der Sänger und Entertainer über seine schwierige Kindheit, seine Sinti-Wurzeln, das Verhältnis zu seinen Eltern, seine Kinder und die Frage, was er aus seiner Vergangenheit gelernt hat. "Ich hab' mir wirklich vorgenommen, einfach heute mal Sachen zu sagen, die ich noch nie gesagt habe", sagt Menowin Fröhlich bei "Käpt'ns Dinner".
