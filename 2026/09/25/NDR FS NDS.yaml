  title: 'Die Nordreportage: Polizei gegen PS-Poser'
  subtitle: Auf Streife mit den Tuning-Polizisten
  description: 'Dicke Schlappen, lauter Auspuff und illegale Straßenrennen: Polizeikommissar Hendrik Vorreiter und seine Kolleginnen und Kollegen der Polizeidirektion Hannover sagen Autoposern und getunten PS-Boliden den Kampf an. Die Männer und Frauen der Sondereinheit sind die Tuningspezialisten der Polizei und gefragt wie nie, denn durch die Corona-Pandemie boomt die Poserszene in der Stadt. "Die Nordreportage" begleitet die Polizei in Niedersachsens Landeshauptstadt bei ihren Einsätzen gegen PS-Protzer und Innenstadt-Raser.'
