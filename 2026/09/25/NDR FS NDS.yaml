  title: In aller Freundschaft (312)
  subtitle: Böse Überraschungen
  description: |-
    Auf dem Weg in den Urlaub haben der Laborant Karsten Krause und seine Frau Anke einen Autounfall. Sie werden mit relativ leichten Verletzungen in die Sachsenklinik eingeliefert, wo Karsten seit einiger Zeit arbeitet.
    Dr. Eichhorn und Dr. Heilmann stellen bei der Routineuntersuchung fest, dass Anke Brustkrebs hat - zum zweiten Mal, wie sie schließlich erfahren. Doch Anke verweigert die Behandlung, denn sie kann während der Chemotherapie nicht schwanger werden - und das will sie unbedingt. Anke ist sogar bereit, das Kind um den Preis ihres eigenen Lebens zu bekommen, um damit ihrem Mann seinen größten Wunsch zu erfüllen.
