  description: |-
    Im Sommer, wenn die Wiesen ein Meer aus Blumen und Blüten bilden, bietet der Yellowstone-Nationalpark einen eindrucksvollen Anblick. Doch diese Pracht währt nur kurz.

    Schon nach wenigen Wochen erlebt der Park erneut eine Zeit des Wandels. Der Herbst hält Einzug, und ein besonderes Schauspiel beginnt: Bei der Brunft der mächtigen Wapiti-Hirschbullen kommt es zu spektakulären Kämpfen um die Vorherrschaft über Weibchen und Revier.
