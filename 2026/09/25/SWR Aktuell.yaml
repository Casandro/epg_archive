- eventId: 545122
  start: 2026-09-25T16:30:00Z
  stop: 2026-09-25T17:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Richtig Laufen - Wie der Ausdauersport Körper und Psyche stärk
  description: |-
    Von Klara Laue
    Gemeinsam zu joggen und für einen Marathon zu trainieren, wird unter jungen Menschen immer beliebter. Sie treffen sich in Laufclubs, motivieren sich über Apps und teilen ihre Erfolge. Doch um etwas für die Gesundheit zu tun, sind lange Distanzen und hartes Training nicht nötig. Die Sportmedizin rät zu regelmäßigen, lockeren Läufen und einer kontinuierlichen Steigerung. Damit stärkt man sein Herz und die kognitive Leistungsfähigkeit, baut Stress ab und kommt innerlich zur Ruhe. Auch Krankheiten können wir so vorbeugen.
- eventId: 545123
