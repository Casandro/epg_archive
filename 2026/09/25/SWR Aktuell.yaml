  title: Der Tag
  description: "19:00\nREICH - Das Geschäft mit dem Zweifel\nSchmutzige Siege (4/5)\nGrapevine, Texas. Wir berichten live von der CPAC, dem wichtigsten Treffen der amerikanischen Rechten: ein Trump-Bus in der Messehalle, Panels über Satan, Sharia und Öl. Und immer wieder ein Thema, das uns überrascht - Deutschland. Warum? Die Antwort beginnt mit einer Zeitungsanzeige von 2014: Obamas Umweltbehörde sei gefährlicher als Terroristen. Absender: eine Organisation, von der niemand je gehört hat.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/reich-das-geschaeft-mit-dem-zweifel/urn:ard:show:f5091cc57904afb9/ \n\n19:30\nKultur -\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/"
