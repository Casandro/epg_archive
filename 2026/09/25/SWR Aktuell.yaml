  title: SWR Aktuell Langstrecke
  description: "14:00  -  15:00\nDie Entscheidung. Politik, die uns bis heute prägt\nMein Opa, die Nazis und Olympia (Teil 1) \nBesessen\nWie konnte das IOC Olympia 1936 in Berlin belassen, in der Diktatur von Adolf Hitler und damit einem Land, in dem längst KZs errichtet wurden? Astrid Freyeisen erzählt, wie ihr Großvater Wolfgang Freyeisen als SA-Mann und NSDAP-Mitglied den Würzburger Rudervierer trainierte - eine der schwierigsten Recherchen in ihrem Leben. Denn: Für ihren Großvater war Gold bei Olympia 1936 der größte Traum. Über den politischen Kontext, die Diktatur der Nationalsozialisten, wollte er - wie so viele in Deutschland in der Nachkriegszeit - nicht sprechen. \n\nMein Opa, die Nazis und Olympia (Teil 2) \nErschrecken\nFünf elf- und zwölfjährige Ruderinnen entdecken, dass ihr Verein, der Würzburger Ruderverein Bayern, Olympia-Gold im NS-Staat gewonnen hat - und jüdische Vereinsmitglieder ausgeschlossen wurden. Gemeinsam mit Sebastian Karl, Enkel eines Goldruderers, suchen sie im Bootshaus beim WRV nach Spuren: Sie sehen ein Olympia-Wandbild plötzlich mit anderen Augen und entdecken eine \"Rumpelkammer\" voller Fotos. Darunter Propaganda-Aufnahmen vom Triumphzug 1936 und Bilder jüdischer Ruderer, die fliehen mussten oder ermordet wurden.\n\nMein Opa, die Nazis und Olympia (Teil 3) \nVersöhnen\nSoll sich Deutschland ausgerechnet für Olympia 2036 bewerben - 100 Jahre nach Berlin 1936? Schwimmlegende Michael Groß (dreifacher Olympiasieger), DOSB-Vorstandsvorsitzender Otto Fricke und Josef Schuster, Präsident des Zentralrats der Juden in Deutschland, diskutieren Pro und Contra. Es geht um die Frage, wie un/politisch Sport sein kann und darum, ob 2036 eher Versöhnungschance oder historische Hypothek wäre.\nHost: Jasmin Brock  | Reporterin: Astrid Freyeisen  | Redaktion: Barbara Kostolnik\nPodcast zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-entscheidung-politik-die-uns-bis-heute-praegt/urn:ard:show:e7bcaf8eea1771e3/"
