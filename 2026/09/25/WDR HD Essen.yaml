  description: Alle Mitarbeiter des Zoo Leipzig bangen mit dem kleinen Elefantenmädchen. Ganz gesund scheint es nicht zu sein. Das zierliche Kalb trinkt nicht und kann nur sehr schlecht alleine stehen. Alle versuchen, die Ursache für seinen Zustand zu finden. Auch Mutter Hoa zeigt sich nicht von ihrer besten Seite. Im Gegenteil, sie versucht immer wieder, der Kleinen weh zu tun. Die Möglichkeit, dass sie das Kalb trinken lässt, werden immer geringer.
