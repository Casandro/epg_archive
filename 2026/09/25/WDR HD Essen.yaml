  title: Made in NRW - Wirtschaft Wandel Wohlstand
  subtitle: 'Möbelbranche: Vom Boom zum Crash - und zurück'
  description: 'Hochwertige Küchen, edle Massivholz-Tische aus Manufakturen und Designer-Schlafzimmer mit technischen Raffinessen - dafür steht Nordrhein-Westfalen. Wir sind das Zentrum der deutschen Möbelindustrie. Mehr als ein Drittel der deutschen Möbelproduktion wird hier erwirtschaftet. Das beschert unserem Land Arbeitsplätze und Milliardenumsätze. Doch die Branche steckt in der schwersten Krise seit Jahren: Nach Rekordumsätzen während der Corona-Pandemie von rund 19 Mrd. Euro leidet die Branche an einer massiven Konsumflaute, internationalem Wettbewerb und politischen Krisen.'
