  title: 'Quarks: Die Zukunft der Kartoffel - Pommes-Boom oder Klimastress?'
  subtitle: 'Moderation: Ralph Caspers'
  description: 'In Deutschland wachsen die meisten Kartoffeln der EU, und seit dem 18. Jahrhundert gehört sie fest zu unserer Ernährung. Aber die Kartoffel gerät unter Druck. Unser Essverhalten verändert sich, hin zu Reis oder Pasta. Salz- oder Pellkartoffeln kommen dagegen immer seltener auf den Tisch, und es werden immer weniger Kartoffeln gekauft. Es sei denn sie sind verarbeitet: Pommes oder Chips boomen! Deshalb macht Quarks den Test: Wie gelingt die perfekte Pommes, ohne gefährliches Acrylamid und zu viel Fett.'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
