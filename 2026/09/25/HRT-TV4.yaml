  description: 'Ovaj tjedan obilježile su više cijene goriva koje vrijede do utorka. Koliko dugo država može amortizirati energetski udar i hoće li energenti biti još skuplji? Kako se formira cijena za gorivo i možemo li neovisno o krizi imati dovoljno zaliha za iduće mjesece? Na koji način vozači mogu uštedjeti? Gosti: Marijan Krpan, predsjednik Uprave Agencije za ugljikovodike; Ivan Brodić, analitičar za energetiku Urednica: Sanja Smiljanić Grubišić'
