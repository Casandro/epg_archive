  title: La firme
  subtitle: Un golden-boy, promis à un brillant avenir au sein d'un prestigieux cabinet d'avocats, découvre avec stupeur le véritable visage de ses employeurs.
  ageRating: 13
  genre:
  - '17'
  description: 'À la fin de ses études de droit, le brillant Mitch McDeere est sollicité par plusieurs grands cabinets d''avocats. Il fixe son choix sur Bendini, Lambert et Locke, qui lui offre les conditions les plus avantageuses. En contrepartie, il devra, comme chaque membre du cabinet, fournir quelque quatre-vingts heures de travail hebdomadaire. Mais Mitch se rend vite compte qu''il va en fait travailler pour la mafia. Contacté par le FBI pour lui servir d''indic, il se retrouve acculé de toutes parts. Le lucre et le luxe Dans cette adaptation du roman éponyme de John Grisham, tout semble trop parfait pour Mitch McDeere (joué par un Tom Cruise touchant, au début de sa carrière). Le cabinet d''avocats dans lequel il est embauché lui fournit des conditions de travail idéales, dont un salaire affriolant pour son jeune âge. Pourtant, le réalisateur Sydney Pollack réussit à instaurer une sensation de malaise à mesure que l''on découvre cette firme. À l''aide d''indices qu''il dissimule au début du film, d''un scénario solide et d''un rythme narratif enlevé, le cinéaste complique l''intrigue pour tenir le spectateur en haleine pendant plus de deux heures. Les nombreux dialogues en plans serrés cadrent au plus près de leurs émotions des personnages - portés par un casting épatant -, pris au piège de lourds secrets dont ils semblent incapables de s''extirper. Nommé aux Oscars dans la catégorie "meilleure musique de film", La firme est accompagnée d''une bande sonore troublante, presque exclusivement composée de piano, qui rend plus intense encore un suspense que Tom Cruise sublime. Réalisateur: Sydney Pollack. Des acteurs: Tom Cruise (Mitch McDeere), Jeanne Tripplehorn (Abby McDeere), Gene Hackman (Avery Tolar), Hal Holbrook (Oliver Lambert), Terry Kinney (Lamar Quinn) (1993)'
