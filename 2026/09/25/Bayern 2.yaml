  subtitle: Hörspiel & Podcast
  description: "Podcast\nSeelenfänger S7 Folge 6\nHoly Hell: Keep Calm and Carry on (6/6)\nRebecka reist in die Kwasizabantu-Mission in Rumänien. Sie will Prediger Hans Koller aus der Schweiz ins Gesicht sagen, was er ihr angetan hat - nicht mehr sein \"kostbares Mädchen\" sein. Währenddessen sucht Benni ganz woanders Heilung. \nVon Dennis Müller und Emeli Glaser\nBR 2026\n\nHörspiel\nFLOW. Beyond Baroque and Words \nIm Jahr 2022 erforschte der Musiker und Hörspielmacher Felix Kubin die Szene von Spoken Word und Poetry Slams in Los Angeles. Entstanden ist eine Collage aus einzigartigen Klängen und Geschichten.\n\nVon Felix Kubin\nMit Anne McGuire, Mariano Zaro, Pat O'Neill, Conney D Williams, Tongo Eisen-Martin, Lynne Thompson, Homer Flynn, Iván Salinas, 99 Hooker, Duke Haney, Andrew Maxwell, Shonda Buchanan, Felix Kubin und anderen\nKomposition: Felix Kubin\nRegie: Felix Kubin\nBR/DLF Kultur 2025\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
