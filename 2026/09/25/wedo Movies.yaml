  title: Joe and Max - Rivalen im Ring
  subtitle: Magazines / Reports / Documentary 2002, FSK 12
  description: '2002 ● FSK: 12 ● TMS Rating: ★★★★☆ Als der deutsche Boxer Max Schmeling 1936 völlig überraschend gegen den bislang ungeschlagenen und haushohen Favoriten Joe Louis aus den USA gewinnt, schreibt er Boxgeschichte. Sein Sieg kommt den Nationalsozialisten gelegen, denn sein sportlicher Erfolg lässt sich wirksam als Überlegenheit der weißen Rasse ummünzen. Als es zwei Jahre später zum Rückkampf mit dem schwarzen Amerikaner kommt, wird der Kampf ideologisch aufgebauscht, während die Boxer unbemerkt eine lange Freundschaft knüpfen. Magazines / Reports / Documentary 2002, Regie: Steve James,  Mit: Leonard Roberts, Til Schweiger, David Paymer, FSK 12'
