  title: Wo bleibt unser Wasser?
  subtitle: Flüsse zwischen Klimawandel und Platzgerangel
  description: 'Grundwasser, Böden, Fließgewässer: Trockenheit auch abseits des Sommers belastet den natürlichen Wasserhaushalt. Anfang Juni 2026 sprechen die Hydrologen im Thüringer Landesumweltamt von einem rekordtrockenen Winterhalbjahr: 40 Prozent weniger Niederschlag als im langjährigen Mittel. Der Klimawandel zwingt uns, das zu managen: Vor allem rund um unsere Flüsse müssen wir mehr Wasser in der Landschaft halten. Der Stapel mit den Masterplänen wird immer höher. Europäische Union, Bund, Landesregierungen - alle haben Strategien. Wieso sind sie nicht längst umgesetzt und worum wird so erbittert gestritten?'
  widescreen: true
  subtitled: true
