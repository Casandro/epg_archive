  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 9'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 9'
  description: 'In dieser Folge stoßen die Beamten von Zoll und Grenzschutz gleich auf zwei brisante Fälle: Hinter den Armaturenbrettern zweier Fahrzeuge entdecken sie Drogen - versehen mit einem unheilvollen Symbol. Der Verdacht: Es könnte sich um das hochgefährliche Fentanyl handeln. Gleichzeitig bittet in Laredo eine junge Mexikanerin verzweifelt mit ihren Kindern um Schutz vor ihrem eigenen Sohn - einem Neuzugang des berüchtigten Los-Zetas-Kartells, der seine Familie mit dem Tod bedroht.'
  widescreen: true
- eventId: 1116855
  start: 2026-09-25T19:10:00Z
  stop: 2026-09-25T20:05:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 10'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 10'
  description: 5.000 Beamte arbeiten auf den 28 Brücken, die Mexiko und die Vereinigten Staaten verbinden. In dieser Folge beweist eine frisch ausgebildete Beamtin ihr Können, als sie bei einer Kontrolle in einem Auto 12 Kilo Kokain entdeckt. Außerdem stehen Zoll- und Grenzschutzbeamte auf höchster Alarmbereitschaft, weil ein entführtes Kind möglicherweise über die Grenze nach Mexiko gebracht wurde.
  widescreen: true
