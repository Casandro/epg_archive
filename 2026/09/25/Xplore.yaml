  title: VIP Trip - Prominente auf Reisen 2 - Thailand mit Gila von Weitershausen
  subtitle: VIP Trip - Prominente auf Reisen 2 - Thailand mit Gila von Weitershausen
  description: |-
    Thailand entwickelt sich in den letzten Jahren immer mehr zu einem der beliebtesten Reiseziele in Asien. Die beliebte Schauspielerin Gila von Weitershausen beginnt ihre Reise im Urlaubsparadies Phuket. Ihre ersten Eindrücke...wie aus dem Katalog: Kristallklares Wasser und weite, weiße Sandstrände in tropischer Umgebung. Um mehr zu sehen begibt sich Gila von Weitershausen auf einen Ausflug in den Regenwald der Insel. Dieser bietet eine faszinierende und teils einzigartige Flora und Fauna. Bekannt ist Thailand natürlich auch für seine  Heilmassagen und nach einem anstrengenden Tag im Dschungel gibt es wahrlich nichts Besseres als eine entspannende Massage..
    Rund eine Stunde von Phuket entfernt befindet sich die Panja Bay. Diese überwältigenden Felsformationen inmitten des Ozeans sind nicht erst seit James Bond 007 bekannt und dienen immer wieder als einzigartige Filmkulisse.
    Doch Thailand steht  nicht nur für  Erholung und romantische Strandspaziergänge. Die Haupstadt Bangkok gilt zu recht als eine der Weltmetropolen Asiens. Bangkok ist eine Stadt der Gegensätze. Hochmoderne Shopping Center wechseln sich ab mit historischen Tempeln und einfachen Straßenmärkten, durch die sich die knatternden Tuktuk-  Motorroller drängeln. Keine Frage: Gila von Weitershausens Reisetagebuch über Thailand ist voller bunter Eindrücke. DE 2007
