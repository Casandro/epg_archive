  title: Sprintour - Mit dem Camper durch Bolivien
  subtitle: Sprintour - Mit dem Camper durch Bolivien
  description: Bereit für die schönste und schwierigste Offroad Strecke in Boliviens Hochland? Seit 4 Tagen fahren wir mit unserm Wohnmobil die Lagunen Route in Bolivien. Zusammen mit Freunden erleben wir das größte Offroad Abenteuer unserer Südamerikareise. Wir fahren auf einsamen Pisten durch unwirkliche Landschaften. Allerdings ist es manchmal nicht so einfach, wie es scheint. Wir fahren mit unserem Wohnmobil durch abgelegene Landschaften in Boliviens Hochland. Der Camper kämpft sich durch Offroad-Pisten auf knapp 5000 Höhenmeter. Eine einmalige Erfahrung, die wir mit unserem Wohnmobil in Bolivien machen dürfen. Leider ist uns im Gebirge von Bolivien die Standheizung kaputt gegangen, weshalb wir bitter kalte Nächte im Gebirge von Bolivien ertragen mussten. Bei -20 Grad war das Vanlife in Bolivien eine richtige Herausforderung. Vanlife auf der Lagunen Route haben wir uns etwas anders vorgestellt. Aber wir haben nicht aufgegeben. Dafür war Boliviens Landschaft einfach zu schön! Nach 5 Tagen auf der Lagunen Route sind wir in der Stadt Uyuni angekommen und starten nach der Besichtigung eines Eisenbahnfriedhofs auch direkt unsere Tour auf die Salar de Uyuni. Die Salar de Uyuni ist die größte Salzfläche der Welt und durch ihre dicke Salzschicht auch komplett mit dem Fahrzeug befahrbar. Das haben wir uns natürlich nicht entgehen lassen und sind in die Mitte der Salzfläche zu einer Koralleninsel gefahren. Ein Abenteuer, das seinesgleichen sucht! BO 2023
