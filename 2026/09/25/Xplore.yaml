  title: Sprintour - Das Pantanal in Brasilien
  subtitle: Sprintour - Das Pantanal in Brasilien
  description: Nach dem Unfall in Brasilien brauchen wir dringend eine Vanlife Pause. Deshalb haben wir uns ein Hotel genommen, lassen das Wohnmobil mal stehen und erkunden das Pantanal in Brasilien. Das Pantanal ist ist das größte kontinentale Feuchtgebiet der Erde und ist fast halb so groß wie Deutschland. Im regenreichen November überschwemmen Flüsse anliegende Gebiete. Im Mai geht das Wasser langsam wieder zurück und neues Leben kann entstehen. Dieser Wasserkreislauf ist wichtig für die Klimastabilisierung und die Artenvielfalt in diesem sensiblen Gebiet. Das Pantanal bietet immerhin einen Lebensraum für fast 700 Vogelarten und viele Säugetierarten. So gehen wir auf Erkundungstour um ein paar dieser Tierarten aus sicherer Entfernung zu beobachten. Endlich können wir eine Pause vom Vanlife machen und das Wohnmobil einfach stehen lassen. Keine Stellplatzsuche, kein Kochen, keine Erledigungen. Einfach nur wir mitten in der schönen Natur. Wir genießen die Vanlife Pause und sammeln Kraft im wunderschönen Brasilien und lassen alles auf uns wirken, bevor es dann nächste Woche wieder zurück nach Corumbá geht, wo der Schaden behoben werden soll. BR 2023
