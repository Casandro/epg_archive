  description: Biss auf Biss. Fisch auf Fisch. Was eine unglaubliche Session. Nachdem unser Besuch Babs Kijewski auf der geheimen Insel ankam, dauert es keine 2 Minuten und die erste Rute lief ab. In den folgenden Tagen fingen wir unzählige Karpfen. Unsere Strategie ging so gut auf, wie selten zuvor. Am Tage stellten wir den Karpfen unter überhängenden Büschen nach, in der Nacht brachten die großen Futterplätze im Freiwasser die Bisse. Fische bis 20 Kilo landeten in den Maschen und wir erlebten eine gute Zeit. Dieser knapp 60-minütige Block-Buster des Karpfenangelns ist authentisch, vermittelt die Bedeutung des Karpfenangelns und gibt viele Einblicke, wie Babs, Robin und Jörg vorgehen.   NL 2020
