    Der eine: Unternehmer, Visionär, Techmogul. Der andere: Präsident, Populist, Reizfigur. Die Doku erzählt die Geschichte als Machtanalyse: Wer von beiden kontrolliert mehr - die Wirtschaft, die Medien, die politische Bühne - und das Weltall?
