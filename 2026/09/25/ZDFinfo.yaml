  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Dokumentarfilm, Deutschland 2020
    Die sieben Weltwunder der Antike bergen bis heute viele Geheimnisse. Wie phänomenal waren sie? Wie sahen sie wirklich aus? "ZDF-History" geht auf Spurensuche.

    Die Idee zu den "Top Sieben" der antiken Bauwerke stammt aus Griechenland. Nicht nur die Größe, auch ihre prunkvolle Gestaltung und herausragende mythologische Bedeutung machten die Schauplätze schon damals zu magischen Orten.
    HD-Produktion
- eventId: 788221
  start: 2026-09-25T10:45:00Z
  stop: 2026-09-25T11:30:00Z
  title: Tatort Pyramide - Grabräubern auf der Spur
  genre:
  - '128'
  widescreen: true
  description: |-
    Ägypten 2017
    In der kargen Wüste Nordägyptens machen Archäologen eine erstaunliche Entdeckung: Überreste einer 4000 Jahre alten Pyramide und eine Grabkammer im Fundament geben Rätsel auf.

    Die Forscher sind sicher: Sie sind auf einen antiken Tatort gestoßen. Das Team um den Ägyptologen Dr. Mark Lehner erkundet die düstere Welt der antiken Grabräuber. Die im Grab gefundenen Holzfragmente zeigen einen Sargdeckel mit weiblichem Gesicht.
    HD-Produktion
- eventId: 788222
  start: 2026-09-25T11:30:00Z
  stop: 2026-09-25T12:15:00Z
  title: Die Pyramiden
  subtitle: Dahschur - Fantastische Entdeckungen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Dahschur erstreckt sich vom Westufer des Nils bis in die Wüste. Spektakulärste Monumente: die Knickpyramide und die Rote Pyramide. Errichtet etwa 2600 vor Christus durch Pharao Snofru.

    Er gilt bis heute als innovativster Bauherr des Alten Reichs Ägypten. Beim Bau der Knickpyramide gab es statische Probleme. Deshalb beauftragt König Snofru etwa in seinem 30. Regierungsjahr die Errichtung der Roten Pyramide. Sie gilt als die erste perfekte Pyramide.
    HD-Produktion
- eventId: 788223
  start: 2026-09-25T12:15:00Z
  stop: 2026-09-25T13:00:00Z
  title: Die Pyramiden
  subtitle: Abu Rawash - Verloren in der Zeit
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Sie ist nur noch eine stark zerstörte Ruine: die Pyramide des Pharaos Radjedef, erbaut etwa 2580 vor Christus. Nur noch ihr Sockel, ein tiefer Schacht und die ehemalige Baurampe sind erhalten.

    Aber vor allem die Fundamente faszinieren internationale Archäologen. Aus der Vogelperspektive kann man direkt in das Innere der Pyramide schauen. So ist es möglich, die unterschiedlichen Bauphasen zu studieren und Erkenntnisse über den Bau von Grabkammern zu gewinnen.
    HD-Produktion
- eventId: 791877
  start: 2026-09-25T13:00:00Z
  stop: 2026-09-25T13:45:00Z
  title: Die Pyramiden
  subtitle: Gizeh - Die letzten Geheimnisse
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Sie sind die bekanntesten Grabmäler der Welt: die Pyramiden in Ägypten. Einst erbaut für mächtige Pharaonen, wurden sie über die Jahrtausende geplündert und von späteren Herrschern zerstört.

    Auf der Hochebene von Gizeh reihen sich die Cheops-, die Chephren- und die Menkaure-Pyramide in einer perfekten Linie aneinander. Sie sind das einzige erhaltene Weltwunder der Antike. Internationale Archäologen versuchen, ihre letzten Geheimnisse zu entschlüsseln.
    HD-Produktion
- eventId: 791878
  start: 2026-09-25T13:45:00Z
  stop: 2026-09-25T14:30:00Z
  title: Die Pyramiden
  subtitle: Sakkara - Das erste Monument
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Sie ist die älteste der ägyptischen Pyramiden: die Stufenpyramide des Pharaos Djoser, erbaut um 2650 vor Christus. Aus der Ferne sieht sie aus wie eine Treppe, die in den Himmel ragt.

    Wie kann ein solches gigantisches Monument ohne moderne Maschinen errichtet werden? Woher stammen die Steine für den Bau? Mithilfe neuester Technologien wie Fotogrammetrie versuchen Wissenschaftler, die Rätsel um die berühmte Djoser-Pyramide zu lösen.
    HD-Produktion
- eventId: 791879
  start: 2026-09-25T14:30:00Z
  stop: 2026-09-25T15:15:00Z
  title: Die Pyramiden
  subtitle: Meidum - Das Scheingrab
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Sie ist weniger bekannt als die großen Pyramiden Ägyptens, aber dafür umso geheimnisvoller: die Meidum-Pyramide. Lange hielten Wissenschaftler das imposante Monument für einen Sonnentempel.

    Ausgrabungen in der Nekropole Meidum beweisen jedoch, dass es sich um eine echte Pyramide handelt. Und zwar um eine ganz besondere: Es sind zwei Pyramiden in einer. An ihr können Archäologen die Entwicklung von den Stufenpyramiden zu echten Pyramiden nachvollziehen.
    HD-Produktion
- eventId: 793644
  start: 2026-09-25T15:15:00Z
  stop: 2026-09-25T16:00:00Z
  title: Die Pyramiden
  subtitle: Cheops - Geheimnis der Felsenkammer
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2019
    Von den sieben Weltwundern der Antike gibt es nur noch sie: die Pyramiden von Gizeh. Die älteste und größte ist die Cheopspyramide. Ein Koloss aus Stein, seit 4500 Jahren Besuchermagnet.

    Jedes Jahr kommen Millionen Menschen nach Ägypten, um das geheimnisumwobene Grabmal von Pharao Cheops zu bewundern. Mit einer Seitenlänge von 230 Metern und einer Höhe von 146 Metern (heute 138 Metern) war die Pyramide lange Zeit das höchste Bauwerk der Welt.
    HD-Produktion
- eventId: 793645
  start: 2026-09-25T16:00:00Z
  stop: 2026-09-25T16:45:00Z
  title: Verlorene Schätze - Das Erbe des Assyrischen Reiches
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Großbritannien 2024
    2014 zerstören IS-Terroristen in Mossul große Teile des archäologischen Erbes aus assyrischer Zeit. Unter den Trümmern entdecken Forschende Überreste eines monumentalen Königspalastes.

    Die Artefakte stammen aus der Zeit König Sanheribs und zeugen von der weit entwickelten Kultur der Assyrer. Ausgeklügelte Bewässerungssysteme versorgten prachtvolle Gartenanlagen. Handelt es sich um die legendären Hängenden Gärten von Babylon?
    HD-Produktion
