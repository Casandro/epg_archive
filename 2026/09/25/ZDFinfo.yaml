    Deutschland 2023
    Die Fremdenlegion: 9000 Elitesoldaten aus aller Welt, ausgebildet mit Drill und Gehorsam, einsatzbereit für den Kampf. Der Weg in die Legion ist hart, bleiben dürfen nur die Besten.

    Täglich kommen Männer aus der ganzen Welt zur Legionskaserne im französischen Aubagne. Sie suchen eine zweite Chance im Leben. Doch was sie erwartet, ahnen sie nicht: scharfer Befehlston, harte Tests, wenig Schlaf, wenig zu essen, eine extreme Zeit.
