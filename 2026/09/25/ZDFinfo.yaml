    Die arabischen Länder drosseln wegen des Jom-Kippur-Krieges 1973 die Erdölproduktion, der Ölpreis steigt. Es folgt die schwerste Wirtschaftskrise nach dem Zweiten Weltkrieg.

    Die westlichen Industrienationen versuchen, den Benzin- und Ölverbrauch zu reduzieren. Auch in der BRD gibt's autofreie Sonntage, ein Tempolimit und die Aufforderung, weniger zu heizen. Doch die Krise nimmt ihren Lauf - mit Inflation und Massenarbeitslosigkeit.
