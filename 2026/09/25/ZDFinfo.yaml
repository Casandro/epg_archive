  start: 2026-09-25T08:00:00Z
  stop: 2026-09-25T08:45:00Z
  title: 'Auf Roms Spuren: Autun'
  subtitle: Festung des Augustus
  genre:
  - '128'
  widescreen: true
  description: |-
    Frankreich 2021
    Die französische Kleinstadt Autun war einst unter dem Namen Augustodunum ein Zentrum römischer Macht in Gallien. Überreste imposanter Monumente zeugen noch heute von ihrer Bedeutung.

    Das antike Augustodunum entstand innerhalb weniger Jahrzehnte nach römischem Vorbild als neue Hauptstadt der Haeduer. Erst allmählich lüften archäologische Untersuchungen mithilfe moderner Technik ihre letzten Geheimnisse.
    HD-Produktion
- eventId: 786450
  start: 2026-09-25T08:45:00Z
  stop: 2026-09-25T09:30:00Z
  title: Metropolen der Antike
  subtitle: Persepolis
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Persepolis: eine antike Metropole, die zum Mythos wird. Im 6. Jahrhundert vor Christus beginnt der König des Perserreiches, Dareios I., mit dem Bau dieser Königsstadt im heutigen Iran.

    Dareios entwirft majestätische Paläste. Eine ausgeklügelte Bewässerung macht die Umgebung von Persepolis zu einer fruchtbaren Oase - ein Wunder der antiken Welt. Wie konnte Alexander der Große eine so mächtige Stadt zu Fall bringen?
    HD-Produktion
- eventId: 786451
  start: 2026-09-25T09:30:00Z
  stop: 2026-09-25T10:15:00Z
  title: Metropolen der Antike
  subtitle: Athen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2024
    Das antike Athen gilt als Wiege der europäischen Zivilisation und Demokratie. Architektonische Meisterwerke zeugen noch heute von einer eindrucksvollen Vergangenheit.

    Von Architektur, Mathematik bis hin zur Kunst - vieles, was unser heutiges Leben prägt, ist ohne die Errungenschaften der Antike nicht denkbar. Athen beherbergt viele beeindruckende Bauwerke, die dank des Einfallsreichtums ihrer Erbauer überdauert haben.
    HD-Produktion
