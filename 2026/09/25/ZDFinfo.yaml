  title: Die unheimliche Macht der Konzerne
  subtitle: Giganten des Luxus
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: "Deutschland 2026\nLuxuskonzerne verkaufen mehr als nur ihre Produkte. Es geht um Status und Exklusivität. Hinter den Kulissen dreht sich aber viel um Gewinnmargen, Billigarbeit und fragwürdige Rohstoffe.\n\nOb Diamanten, Smartphones oder Krokodilledertaschen: Oft kauft der Kunde Produkte, deren realer Warenwert nur wenige Prozent des Verkaufspreises ausmachen. Und obendrein umgehen die \nLuxushersteller Arbeitnehmerrechte und Umweltvorgaben.\nHD-Produktion"
- eventId: 777870
  start: 2026-09-25T01:30:00Z
