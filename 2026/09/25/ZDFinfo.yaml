    Der Panzer: Die Bundeswehr plant weiter mit dem schweren Gefährt. Sie hat mit dem Schützenpanzer Puma und dem Kampfpanzer Leopard zwei hochmoderne Modelle. Die richtige Ausbildung in Technik und Taktik verlangt den Soldaten alles ab.
