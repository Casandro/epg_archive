  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2026
    Multinationale Transportunternehmen kontrollieren die Warenströme der Weltwirtschaft. Sie beherrschen die Wege auf See und Land oder die Reisen von Millionen Flugpassagieren.

    Die Big Player liefern sich einen globalen Verdrängungswettbewerb und agieren im Hintergrund. Dabei tragen sie zur Klimaerwärmung bei, lassen Menschen unter problematischen Bedingungen arbeiten und vernetzen sich mit der Politik, um ihre Interessen durchzusetzen.
    HD-Produktion
- eventId: 777869
