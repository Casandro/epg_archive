    Lehman Brothers ist nicht das einzige Geldhaus, das mit hochspekulativen Papieren Milliardenverluste macht. Viele Banken handeln mit riskanten Krediten, um immer höhere Gewinne zu erzielen. Als die US-Immobilienblase platzt, werden alle in diesen Sog hineingezogen.
