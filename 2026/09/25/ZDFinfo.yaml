  title: 'Auf Roms Spuren: Autun'
  subtitle: Festung des Augustus
  genre:
  - '128'
  widescreen: true
  description: |-
    Frankreich 2021
    Die französische Kleinstadt Autun war einst unter dem Namen Augustodunum ein Zentrum römischer Macht in Gallien. Überreste imposanter Monumente zeugen noch heute von ihrer Bedeutung.

    Das antike Augustodunum entstand innerhalb weniger Jahrzehnte nach römischem Vorbild als neue Hauptstadt der Haeduer. Erst allmählich lüften archäologische Untersuchungen mithilfe moderner Technik ihre letzten Geheimnisse.
