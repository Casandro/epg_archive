    Frankreich 2020
    Vor 2000 Jahren war es das größte Oppidum in ganz Gallien: Bibracte. Doch die mächtige Hauptstadt der Haeduer verschwand und lag lange unter dichtem Wald verborgen. Was war geschehen?

    Erst ab Mitte des 19. Jahrhunderts wurden erste Überreste wiederentdeckt. Wie sah die Stadt aus, in der bis zu 10.000 Menschen lebten? Wie entstanden ihre mächtigen Verteidigungsanlagen, und welchen Einfluss hatten die Römer auf den Keltenstamm?
