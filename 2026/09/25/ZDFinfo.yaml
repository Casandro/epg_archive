  title: Die großen Crashs
  subtitle: Weltwirtschaftskrise 1929
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Nach dem Zusammenbruch der New Yorker Börse im Oktober 1929 stürzt die Welt ins Chaos. Unternehmen gehen pleite, Millionen von Menschen verlieren ihren Job. Wie konnte es so weit kommen?

    Nach dem Börsencrash liegt die Wirtschaft am Boden, vor allem in der noch jungen Weimarer Republik. Die Arbeitslosenquote steigt auf 30 Prozent an. Für viele wird es ein täglicher Überlebenskampf. Not und Verzweiflung machen sich breit - bis die Stimmung kippt.
    HD-Produktion
