  title: '#selfie: ich - und die Welt'
  subtitle: Deutschland 2018
  description: 'Manche tun es öffentlich, manche heimlich, Fakt ist: fast jeder macht es - das Bild von sich selbst. Selfies - die Fotos, die das Smartphone schießt -  sind ein Phänomen des jungen 21. Jahrhunderts, Wort des Jahres 2013, längst professionalisiert mit Selfie-Sticks und aufsetzbaren Kameraoptiken. Selfies sind global. Und: global verständlich. Kommunikation heruntergebrochen auf das Wesentliche: Mimik und Gestik. Selfies, sagt der Kunsthistoriker Wolfgang Ullrich, sind Weltsprache. Und damit kulturgeschichtlich ein kleines Wunder.'
  subtitled: true
