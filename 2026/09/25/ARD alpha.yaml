  title: 'Back on Stage: Roachford'
  subtitle: BR Retro - Alabama in Concert
  description: "Schon als 14-Jähriger spielt Andrew Roachford mit seinem Onkel in Londoner Jazzclubs. Wenige Jahre später gründet er die Band Roachford und verbindet Soul, Pop, Rock und R&B. 1994, im Jahr der Veröffentlichung des Albums \"Permanent Shade of Blue\", tritt die Band in der Münchner Alabamahalle auf. \n\nJahrzehntelang lagerten die Mitschnitte von Kultsendungen wie \"Alabama in Concert\", \"Schlachthof in Concert\" oder \"Nachtwerk in Concert\" in den Archiven des Bayerischen Rundfunks - sie waren der Soundtrack einer ganzen Generation. \"Back on Stage\" hebt diese musikalischen Schätze und holt sie zurück ins Fernsehen."
