  description: 'Fünf Frauen aus Rosenheim und Umgebung fahren während des Oktoberfests 16 Tage lang nach München, um dort auf der Wiesn zu bedienen. Einige der porträtierten Frauen haben gerade das große Volksfest in Rosenheim, das Herbstfest, hinter sich und nun die Wiesn vor sich. Da sie im Garten des Löwenbräuzeltes von Wiggerl Hagn arbeiten, sind sie natürlich vom Wetter abhängig, aber "a bisserl was geht immer", sagen sie. Und das Härteste sei ohnehin nicht die Arbeit an sich sondern die tägliche Fahrerei: eine Stunde hin am Vormittag, eine Stunde zurück in der Nacht.'
