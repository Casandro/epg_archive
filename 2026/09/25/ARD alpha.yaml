  subtitle: Grenzen überwinden
  description: |-
    Ein Bahnhof, den eine Staatsgrenze teilt, ein ehemaliger Todesstreifen, der heute "Grünes Dach Europas" ist: In der deutsch-tschechischen Grenzregion im Bayerischen Wald wird sichtbar, wie Grenzen trennen - und wie sie überwunden werden können.
    "STATIONEN" erzählt am Bahnhof Bayerisch Eisenstein und im Nationalpark Bayerischer Wald/Sumava von der Zeit des Eisernen Vorhangs, von Vertreibung und Abschottung - und von Menschen, die heute Brücken bauen.
