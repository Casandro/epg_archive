  title: 'alpha-retro: Erinnerungen an die Wiesn (1985)'
  description: 'Sigi Sommer alias Blasius der Spaziergänger führt 1985 anlässlich des 175-jährigen Bestehens des Münchner Oktoberfestes über die Wiesn. Zunächst aber gibt es einen historischen Rückblick auf deren Entstehung 1810: Es wurde damals aus Anlass der Hochzeit zwischen Kronprinz Ludwig (der spätere König Ludwig I.) und Therese von Sachsen-Hildburghausen auf der Theresienwiese ein Pferderennen ausgerichtet mitsamt Festbuden etc. Dieses Fest wurde von da an jedes Jahr wiederholt und weil es ursprünglich immer im Oktober stattfand, war es eben das "Oktoberfest".'
