  title: In der steirischen Toskana
  description: Jedes Jahr im Herbst zieht die steirische Toskana die Menschen in ihren Bann - die steilen Hügel des Sausals, die prächtigen Farben, die neuen Weine der Saison, die Kastanien und der Sturm. Die Gegend an der Grenze zu Slowenien ist mit Sonnenstunden gesegnet wie nur wenige andere Flecken in Österreich. Zypressen gleich ragen Pappeln in die Höhe und verleihen dem Land das Flair der Toskana, wenn auch die meisten Bewohner der Region die Bezeichnung nicht lieben.
  subtitled: true
