  title: Host Radiožurnálu
  description: Odpovídá farář Martin Brousil. Říp je možná nejznámější českou horou, ale co všechno se na jeho vrcholu za devět století odehrálo? Letos uplyne 900 let od první písemné zmínky o rotundě svatého Jiří. Proč právě Říp získal tak silné místo v české paměti? Co znamená pro věřící dnes a jak se v něm potkává křesťanská tradice s příběhem praotce Čecha? Moderuje Jan Pokorný. (repríza)
