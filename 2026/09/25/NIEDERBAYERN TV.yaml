  description: "Mehr Kapazitäten für den Ernstfall: Neue Intensivstation in Landshut eröffnet\nDie Anforderungen an die Intensivmedizin steigen: Mehr ältere Patienten, komplexere Krankheitsbilder und zugleich der Anspruch, medizinisch auf dem neuesten Stand zu bleiben. Bayerns Kliniken investieren deshalb in moderne Strukturen und neue Behandlungsmöglichkeiten - und damit auch in die Versorgung schwer kranker Menschen.\nWie solche Investitionen die Intensivmedizin vor Ort verändern, zeigt sich auch in Niederbayern. In Landshut ist in den vergangenen Jahren eine neue Station entstanden - mit mehr Platz, moderner Technik und zusätzlichen Kapazitäten. Meine Kollegen mit allen Details der Einweihung dieser neuen Intensivstation. \n\nInvestition in die Bildung: Grundschule Nordwest nimmt Betrieb auf\nFür Familien ist die Frage nach einer guten Kinderbetreuung oft genauso wichtig wie die nach einem passenden Arbeitsplatz. Gerade für Menschen, die neu nach Landshut kommen, spielt dabei auch das Angebot an Schulen eine wichtige Rolle. Seit 1972 ist in Landshut jedoch keine neue Grundschule mehr eröffnet worden. Bis jetzt: Zu Beginn dieses Schuljahres öffneten gleich zwei neue Grundschulen ihre Türen für die Kinder. \n\nKeine Langeweile am Wochenende - Unsere Veranstaltungstipps für die kommenden Tage\nDer Herbst ist inzwischen in der Region angekommen: Die Bäume zeigen sich in leuchtenden Rot-, Gelb- und Orangetönen, die Tage werden langsam kürzer und die Natur präsentiert sich von ihrer besonders farbenfrohen Seite. Mindestens genauso bunt und abwechslungsreich fällt auch das Veranstaltungsprogramm für das kommende Wochenende aus. Ob spannende Angebote für Mangafans, kulturelle Höhepunkte oder musikalische Unterhaltung - in der Region ist wieder einiges geboten. Wenn Sie also noch nach einer Idee für einen Ausflug oder eine Freizeitaktivität suchen, dann lohnt sich ein Blick auf unseren Veranstaltungskalender- da werden Sie bestimmt fün..."
