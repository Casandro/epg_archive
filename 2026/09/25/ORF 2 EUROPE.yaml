  title: Universum History
  subtitle: Genosse Tito - Partisan, Volksheld, Diktator
  description: "Josip Broz \"Tito\" war vieles in einem. Sein Traum vom sozialistischen Vielvölkerstaat Jugoslawien sollte jedoch nur von kurzer Dauer sein. Im Zweiten Weltkrieg führt Tito die antifaschistische Partisanenbewegung an, die vor allem gegen Hitlers Truppen kämpft. Durch den militärischen Erfolg wächst sein Ansehen in der Bevölkerung. Viele Menschen projizieren ihre Hoffnungen auf Tito, der 1945 Staatschef der Volksrepublik Jugoslawien wird. Jahrzehntelang lenkt er die Geschicke des Staates und genießt internationales Ansehen in Politik und Kultur, während er Oppositionelle im eigenen Land unterdrückt und wegsperren lässt. \nDie Universum History Dokumentation zeichnet nach, wie aus dem gelernten Schlosser ein autokratischer Präsident wurde, dessen Popularität in der Bevölkerung beinahe unantastbar schien. Prominente Zeitzeuginnen wie Marina Abramovic oder Olivera Stajic geben Einblick, wie man sich in den Nachfolgestaaten Jugoslawiens bis heute an Tito erinnert.\nBuch und Regie: Sasha Djurkovic\nProduktion: Looksfilm, ORF, rbb/Arte"
  genre:
  - '129'
