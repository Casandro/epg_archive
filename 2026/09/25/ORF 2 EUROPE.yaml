  title: Erlebnis Österreich
  subtitle: Gefürchtet und geliebt - Alpenpässe in Vorarlberg
  description: Vor Jahrtausenden haben die Menschen erforscht, an welchen Stellen die Alpen überquert werden können. Die Dokumentation des ORF Vorarlberg zeigt, wie Alpenpässe Wege verkürzen und Täler verbinden. Ötzi und seine Vorfahren waren großen Gefahren ausgesetzt. Einen der wichtigsten Pässe in Vorarlberg, den Arlbergpass, zu überqueren, war besonders im Winter jahrhundertelang lebensgefährlich. Im 14. Jahrhundert hat Heinrich Findelkind das Hospiz in St. Christoph, eine Herberge, gebaut. Hier wurden Reisende, die von einem Wetterumsturz überrascht worden waren, aufgenommen. Heute sind Pässe in Vorarlberg wie das Furkajoch und die Bielerhöhe beliebte Ausflugsziele, Motorrad- und Radstrecken. Die Silvrettapassstraße wird alljährlich aufwändig vom Schnee geräumt und danach müssen die losen Felsbrocken oberhalb entfernt werden. Pässe an der Grenze zur Schweiz und zu Liechtenstein waren vor und während des Zweiten Weltkriegs Fluchtwege in die neutrale Schweiz. Heute befinden sich auf vielen Alpenpässen Aussichtspunkte. Von ihnen aus bewundert die Dokumentation die Schönheit der Landschaft.
  genre:
  - '34'
