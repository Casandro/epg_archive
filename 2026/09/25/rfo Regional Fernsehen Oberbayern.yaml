- eventId: 849329
  start: 2026-09-25T06:00:00Z
  stop: 2026-09-25T06:10:00Z
  title: Süd Journal vom 24.09.2026 (Wh.)
  subtitle: Katastrophenfallübung in Bad Reichenhall +++ komplett erneuert - Wasserspielplatz in Bad Feilnbach eröffnet +++ Nachrichten kompakt
  description: 'Wenn Mobilfunk, Internet und womöglich sogar der Strom ausfallen, soll die Telekom vorbereitet sein: In Bad Reichenhall übt sie den Ernstfall mit Ersatztechnik, Generatoren und einem mobilen Netz. +++ Rund Elf Monate, nachdem das Projekt ins Leben gerufen wurde, ist der neue Wasserspielplatz in Bad Feilnbach fertig. Die alte Anlage wurde komplett erneuert - finanziert ausschließlich über Spenden. Jetzt können die ersten Kinder den neuen Spielplatz ausprobieren. +++ Der Bundestag fördert drei Bäder in Rosenheim, Trostberg und Ruhpolding, während Bayerns Polizei zum Schulstart mehr Gurt- und Kindersicherungs-Verstöße zählte, und Rosenheim die Parkgebühren neu ordnen will, mit Gratiszeit erst ab 90 Minuten.'
- eventId: 849330
  start: 2026-09-25T06:10:00Z
  stop: 2026-09-25T06:20:00Z
  title: Süd Journal vom 24.09.2026 (Wh.)
  subtitle: 2500 Veranstaltungen zur Demenz Aktionswoche gestartet +++ Frauenterritorien in Burghausen
  description: 'In Bayern leben über eine Million Demenzkranke, die Zahl steigt weiter; zur Sensibilisierung läuft bis 27. September zum siebten Mal die Bayerische Demenzwoche mit mehr als 2.500 Terminen, auch in unserem Sendegebiet, etwa im Landkreis Rosenheim. +++ Im Burghauser Projektraum läuft statt einer Ausstellung die Filmkunst Frauenterritorien: Claire Angelini zeigt zwei Kurzfilme über Frauenrollen, darunter das Porträt der Einhandseglerin Isabelle Joschke, täglich 10 bis 18 Uhr, plus Sondervorführung am 16. Oktober im Ankerkino.'
- eventId: 849331
  start: 2026-09-25T06:20:00Z
  stop: 2026-09-25T06:30:00Z
  title: Süd Journal vom 24.09.2026 (Wh.)
  subtitle: Gestalten mit Blumenzwiebeln im Herbst +++ Schneeflocken über Berchtesgaden von Ursulina Pittrof +++ Wetter für das Sendegebiet
  description: Im Kreislehrgarten gegenüber Schloss Amerang zeigte ein kostenloser Workshop der Kreisfachberatung, wie man jetzt Tulpen, Narzissen und Schneeglöckchen richtig setzt, passende Zwiebeln für den Standort wählt und so mit 1.500 Exemplaren den Garten im Frühjahr erblühen lässt. +++ Ursulina Pittrof erzählt in Schneeflocken über Berchtesgaden eine romantisch-spannende Liebesgeschichte, in der das winterliche Berchtesgaden Vergangenheit, neue Gefühle und frische Perspektiven vereint und mit Lokalkolorit von Liebe, Vertrauen und Neuanfang lebt. +++ Morgen am Freitag im Osten und Nordosten wolkig und vereinzelt Schauer. Sonst nach Nebelauflösung von Südwesten zunehmend sonnig.
