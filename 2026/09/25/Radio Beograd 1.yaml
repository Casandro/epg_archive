  title: U središtu pažnje
  subtitle: Svakoga radnog dana emisija "U središtu pažnje" donosi intervju sa našim najboljim analitičarima i komentatorima, političarima i ekspertima, društvenim inovatorima i drugim poznatim ličnostima, ili.
  description: Svakoga radnog dana emisija "U središtu pažnje" donosi intervju sa našim najboljim analitičarima i komentatorima, političarima i ekspertima, društvenim inovatorima i drugim poznatim ličnostima, ili ličnostima koje će ubrzo postati poznate. Pored intervjua svakim radnim danom, emisija vam približava još jednu ključnu dnevnu temu, i daje kratak ali detaljan predled svih najvažnijih vesti. "U središtu pažnje" je emisija u kojoj novinari postavljaju pitanja o našim velikim društvenim teškoćama i nedorečenostima, i to onima koji uvek imaju bar deo pravog odgovora. Emisija koja ide jedan korak dalje u analizi vesti, i, kada god je moguće, jedan korak ispred same vesti.
