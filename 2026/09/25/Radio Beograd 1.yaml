  title: Romano Them
  subtitle: Ostanite uz Svet Roma u kojoj slušamo poslednje reči prof. dr Dragoljuba Ackovića, čoveka koji je čitav život posvetio svom narodu.
  description: Emisija svakodnevno donosi najvažnije vesti iz zemlje i sveta na romskom i srpskom jeziku. Bavi se temama iz života Roma, prikazujući napore i mere koje se preduzimaju za emancipaciju i integraciju ove, najveće evropske manjinske zajednice. Prenosi aktuelnosti vezane za Rome i na specifičan način senzibiliše javnost za probleme ove populacije.
