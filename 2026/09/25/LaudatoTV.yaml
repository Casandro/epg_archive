  title: Dudo i prijatelji, talk-show
  subtitle: Zabava
  description: Još kao dijete, današnji gost započeo je svoju sportsku priču u streljačkom klubu u rodnom Bjelovaru. Već nakon prvog hica bilo je jasno - pred njim je put ispisan zlatnim slovima. U drugom razredu srednje škole postao je član Hrvatske streljačke reprezentacije, a samo nekoliko godina kasnije - okitio se i olimpijskom medaljom. Gost emisije Dudo i prijatelji je jedan od najperspektivnijih mladih hrvatskih sportaša, precizan, smiren i nepokolebljiv - Miran Maričić.
- eventId: 1028525
  start: 2026-09-25T08:12:00Z
  stop: 2026-09-25T09:04:00Z
  title: Susret u riječi
  subtitle: Religijski
  description: Vladimir Sokol hrvatski je arheolog, muzeolog i istraživač srednjovjekovne i antičke baštine. Osnivač je Muzeja Prigorja u Sesvetama, gdje djeluje kao ravnatelj, a desetljećima se bavi arheološkim istraživanjima područja istočnog Zagreba i Sesvetskog Prigorja. Posebno se posvetio kasnoj antici i ranom srednjem vijeku, a svojim je istraživanjima pridonio boljem poznavanju arheološke prošlosti Zagreba i šire Hrvatske. Sudjelovao je na brojnim domaćim i međunarodnim stručnim skupovima te surađivao s različitim znanstvenim i kulturnim institucijama.
- eventId: 1028229
  start: 2026-09-25T09:04:00Z
  stop: 2026-09-25T10:00:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Ivana i Goran Kanceljak zajedno su prošli put ispunjen ljubavlju, radošću, ali i velikim životnim kušnjama. Kako sačuvati brak kroz gotovo tri desetljeća? Kako podizati veliku obitelj, nositi se s gubitkom i pronaći snagu za svaki novi dan? Njihova priča nije priča o savršenom životu, nego o ljubavi koja ostaje - i onda kada je najteže. Upoznajte bračni par Kanceljak i poslušajte njihovo iskreno svjedočanstvo o braku, obitelji, vjeri, gubitku i nadi.
