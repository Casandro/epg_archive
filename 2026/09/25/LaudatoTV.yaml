- eventId: 1024561
  start: 2026-09-25T23:34:00Z
  stop: 2026-09-26T01:14:00Z
  title: U zemlji prve Ljubavi
  subtitle: Dokumentarni
  description: Postoje putovanja koja se gledaju. I putovanja koja se pamte. Gdje kamen čuva korake, a tišina govori više od riječi. Pridružite nam se na hrvatskom hodočašću u Svetu Zemlju - na putu kroz Nazaret, Galileju, Betlehem i Jeruzalem. U zemlji gdje je Isus živio, učio i činio čudesa... i ostavio trag koji i danas mijenja čovjeka. Od trenutaka svjetla i radosti - do trenutaka kušnje, križa... i nade koja pobjeđuje.
