  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Raus aus dem Job - rein in den Ruhestand." Wie kann man den Abschied aus dem Berufsleben gut gestalten? In "Zwischen den Zeilen - Der Buch-Talk" ist Britta Laubvogel zu Gast. Die langjährige Bildungsreferentin hat zahlreiche Seminare zum Thema Übergang in den Ruhestand geleitet. Ihr Bestseller "Auf dem Weg in den Ruhestand" ist aus vielen Begegnungen, unterschiedlichen Erfahrungen und eigenem Erleben entstanden. Im Gespräch mit Stefan Loß gibt sie praktische Tipps für einen guten Abschied aus dem Berufsleben. Dabei geht es um das Loslassen von Altem, um die Gestaltung des Übergangs und um den Einstieg in die neue Lebensphase.'
