  subtitle: 'Hens verlovingsbeker E05. Kitty Laméris deed in 2018 een bijzondere ontdekking: ze herkende een hensbeker van de Friese adel. Nu duikt Kitty in de geschiedenis van de Friese adels en bezoekt een fraai landhuis.'
  description: 'Kitty Laméris deed in 2018 een bijzondere ontdekking: ze herkende een hensbeker van de Friese adel en taxeerde de beker op 85.000 euro. Nu duikt Kitty in de geschiedenis van de Friese adel en bezoekt een fraai landhuis. Ze spreekt met de conservator erfgoed 16e-20e eeuw van het Fries Museum, Eveline Holsappel. De Ottema-Kingma Stichting heeft de beker met steun van de Vereniging Rembrandt verworven en die in langdurige bruikleen aan het Fries Museum gegeven. (2024)'
