  title: Binnenstebuiten
  subtitle: S12 E123. Sam en Luna wonen in een gestapeld huurhuis en dromen over een leven in het groen, Ramon kruidt en bakt in de buitenlucht fajita met beefstrips, en Jade heeft als missie om heel veel bomen te planten.
  description: In het centrum van Groningen wonen de twee creatieve ondernemers Sam en Luna in een gestapeld huurhuis. Ze runnen een vintagewinkel en dromen groots, want inmiddels zijn ze ook trotse eigenaar van een heel oud huisje uit 1700. Nu maar hopen dat ze snel hun droom waar kunnen maken. * Chef-kok Ramon kookt het liefst in de buitenlucht. Op een zonnige locatie kruidt en bakt hij fajita met beefstrips en roostert hij maïs boven het vuur. * Jade heeft één missie; ze wil bomen terugbrengen in het weiland, niet een paar, maar het liefst miljoenen. In haar biologische boomkwekerij laat ze het ideale weiland met koeien en diverse fruitbomen zien. (2026)
