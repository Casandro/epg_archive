  description: In Amsterdam woont Coen op de plek waar hij is opgegroeid; een prachtig oud schip. Coen heeft zelf de plek verbouwd en verduurzaamd. Hij deelt het schip met "bootgenoot" Rutger en bij mooi weer betekent dat plonzen. * Sharon bereidt kerriegarnalen met Surinaamse masala, peultjes en sperziebonen, geserveerd met geurige kokosrijst. * Voor vogelaar en ecoloog Camilla is Marker Wadden haar tweede thuis, want al 10 jaar lang doet zij hier onderzoek. Deze keer neemt ze ons mee. * In het Groningse Bourtange is het alsof je even teruggaat in de tijd. Bewoonster Reintje kent de ophaalbruggen, de stervormige gracht en de wachtershuisjes als geen ander. (2026)
