  description: 'Er gaat geen dag voorbij of er is nieuws over een azc, maar wat gebeurt er nou eigenlijk écht in een asielzoekerscentrum? Margreet van Gils loopt mee in het azc in Leersum. In Op Pad trekt Roel Diepstraten zijn laarzen aan en wandelt in het dal van de Kleine Beerze tussen Vessem en Middelbeers. Hij hoort de porseleinhoen, maar de kans om hem te zien is nihil volgens boswachter Frans. Wel spot Roel vechtende beekjuffers en jagende oeverzwaluwen. In Route C: Petit Café du Bonheur is het Zomerlezengeschenk geschreven door wijnboer Ilja Gort. Een feelgoodroman over een jonge Nederlandse vrouw die een vervallen café in de Provence koopt. (2026)'
