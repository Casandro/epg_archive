  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Lubomír Čuhel - organizace Prague Baseball Week. Má prsty v úspěších pražského Tempa a výchově nové generace talentů. Luboš prozradí jak se klub z Krče proměnil v extraligovou sílu, co obnáší manažerská role v českých podmínkách, a proč je pro něj baseball víc než jen sport. Moderuje Jiří Kohout a Jana Rychterová.
