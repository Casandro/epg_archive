  title: Hajaja
  description: Pohádky z letní zahrádky 5/8 - Jak si pilná paní zalenošila. Máte rádi květiny? Kdo by neměl, viďte. K rozkvetlým kytkám si každý rád přivoní, ale kdo k nim občas přiloží ucho? Možná byste to měli zkusit. Květiny z letní zahrádky totiž umějí vyprávět pohádkové příběhy? Osm pohádek z letní zahrádky napsala Melita Denková. Natočeno v roce 1998. Režie Vladimír Gromov. Vypráví Daniela Kolářová.
