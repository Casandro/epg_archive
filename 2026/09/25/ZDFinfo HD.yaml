  stop: 2026-09-25T14:30:00Z
  title: Die Pyramiden
  subtitle: Sakkara - Das erste Monument
  description: |-
    Frankreich 2019
    Sie ist die älteste der ägyptischen Pyramiden: die Stufenpyramide des Pharaos Djoser, erbaut um 2650 vor Christus. Aus der Ferne sieht sie aus wie eine Treppe, die in den Himmel ragt.

    Wie kann ein solches gigantisches Monument ohne moderne Maschinen errichtet werden? Woher stammen die Steine für den Bau? Mithilfe neuester Technologien wie Fotogrammetrie versuchen Wissenschaftler, die Rätsel um die berühmte Djoser-Pyramide zu lösen.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
- eventId: 792017
  start: 2026-09-25T14:30:00Z
  stop: 2026-09-25T15:15:00Z
  title: Die Pyramiden
  subtitle: Meidum - Das Scheingrab
  description: |-
    Frankreich 2019
    Sie ist weniger bekannt als die großen Pyramiden Ägyptens, aber dafür umso geheimnisvoller: die Meidum-Pyramide. Lange hielten Wissenschaftler das imposante Monument für einen Sonnentempel.

    Ausgrabungen in der Nekropole Meidum beweisen jedoch, dass es sich um eine echte Pyramide handelt. Und zwar um eine ganz besondere: Es sind zwei Pyramiden in einer. An ihr können Archäologen die Entwicklung von den Stufenpyramiden zu echten Pyramiden nachvollziehen.
    HD-Produktion
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
