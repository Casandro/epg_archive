  stop: 2026-09-25T13:00:00Z
  title: Die Pyramiden
  subtitle: Abu Rawash - Verloren in der Zeit
  description: |-
    Frankreich 2019
    Sie ist nur noch eine stark zerstörte Ruine: die Pyramide des Pharaos Radjedef, erbaut etwa 2580 vor Christus. Nur noch ihr Sockel, ein tiefer Schacht und die ehemalige Baurampe sind erhalten.

    Aber vor allem die Fundamente faszinieren internationale Archäologen. Aus der Vogelperspektive kann man direkt in das Innere der Pyramide schauen. So ist es möglich, die unterschiedlichen Bauphasen zu studieren und Erkenntnisse über den Bau von Grabkammern zu gewinnen.
    HD-Produktion
  genre:
