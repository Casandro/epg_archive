  title: Arda Saatci läuft und läuft und läuft
  description: |-
    606 Kilometer bescherten ihm Anfang Mai einen Platz in den Geschichtsbüchern - und einen Eintrag ins Gästebuch des Landes Berlin: Arda Saatci. In 123 Stunden, 21 Minuten und 10 Sekunden lief der 28jährige vom Badwater Basin im Death Valley auf die Pier von Santa Monica nahe Los Angeles, kämpfte dabei gegen Erschöpfung, gegen Halluzinationen, die Müdigkeit, die Hitze, die Wüste, gegen sich selbst. Ein Kampf, den Millionen Fans in Echtzeit bewunderten - und dabei sahen, wie der Fitness-Cyborg seine Grenzen testete. Das selbstgesetzte Ziel von 96 Stunden verfehlte der Sohn türkischer Einwanderer zwar - doch sein unbedingter Wille, die Mission zu einem guten Ende zu führen verschafften ihm Anerkennung, Sympathie und Unterstützung. Genauso wie seine Bodenständigkeit, hatte er doch seiner Mutter versprochen, nach dem Zieleinlauf mit ihr ein Eis essen zu gehen.

    "Arda Saatci läuft und läuft und läuft" zeichnet die außergewöhnlichen Tage der Red Bull Cyborg Season - Ultra 600 noch einmal nach - trifft Freunde, Förderer, Fans und Weggefährten von Arda Saatci und beschreibt, wie der Berliner zum Vorbild, zum Idol einer ganzen Generation wurde.Österreich 2026
  genre:
  - '64'
  widescreen: true
