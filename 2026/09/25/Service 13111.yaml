  title: Kaktus Hotel
  description: "Im Kaktus Hotel in der Sonora-Wüste, im amerikanischen Südwesten, wird den tierischen Gästen allerlei Luxus geboten: von den Wurzeln im Kellergeschoss bis hinauf zur Rooftop-Bar. Wie es traditionell bei einem Luxushotel in der Einöde so ist, lockt der Kaktus als Kurzzeit-Habitat unzählige Besucher an: Ständig wird ein- und ausgecheckt. Feste werden gefeiert, Bündnisse geschmiedet und schlussendlich auch kleine und große Dramen durchlebt. Das Kaktus Hotel lädt ein in seine klimatisierten Penthouse-Suiten, auf seine kuscheligen Balkone und auf seine duftenden Terrassen mit grandioser Aussicht. \n\nWelcher tierische Wüstenbewohner kann da schon widerstehen? Aus allen Himmelsrichtungen kommen sie herangeflogen, gekrochen oder gehoppelt. Der Kaktus wird dadurch zum Mittelpunkt einer wilden Gemeinschaft, die das Leben in vollen Zügen zu feiern und zu genießen weiß. Der humorvolle und \"eher untypische\" Naturfilm lässt dabei keine Anekdote rund um das Kaktus Hotel aus. Eine faszinierende und mehrfach mit Preisen ausgezeichnete filmische Reise in die Welt der Kakteen, die ihren Bewohnern weit mehr als nur Stacheln zu bieten haben. Die Dokumentation hat bisher 14 internationale Filmpreise gewonnen und wurde auf Filmfestivals sowohl als beste als auch als innovativste Dokumentation ausgezeichnet.\nDokumentarfilm, Deutschland 2023, R: Yann Sochaczewski"
  widescreen: true
