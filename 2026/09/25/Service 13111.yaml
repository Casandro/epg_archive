  title: Heimatleuchten
  subtitle: Der Provokateur und die Revoluzzerin
  description: |-
    Zwei scheinbar unterschiedliche Menschen geben Einblicke in ihr Leben, das "anders verläuft als andere": Max Meyr-Melnhof ist heute erfolgreicher Unternehmer und Landesjägermeister. Dabei schaffte er als Junger keinen Schulabschluss und ist Legastheniker. Als sich sein Leben über Nacht schlagartig verändert, wächst er mit neuen Aufgaben und findet den Mut seinen ganz eigenen Weg zu gehen. Margit Holzer ist die erste Knoblauchbäuerin Kärntens. Nach einer Karriere als Managerin fährt sie mit dem Cabrio zum Feld und steht in High Heels auf Erntemaschinen. Kein Wunder, dass die selbstbewusste Frau das konservative Lavanttal in Aufruhr versetzt. Widerstände überwinden, Träume verwirklichen, nie aufgeben - das verbindet diese zwei unterschiedlichen Menschen.
    Volkskultur, Österreich 2025, R: Florian Guthknecht
