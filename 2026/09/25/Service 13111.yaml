  title: Talk Spezial
  subtitle: 'Selber denken: Ein Konzept von gestern?'
  description: |-
    Rechtspopulismus, Nahostkonflikt, Geschlechterdebatte: Bei vielen großen Themen unserer Zeit gibt es eine erwünschte Meinung - und eine, die weniger gern gehört wird. Während sich mit den vorgegebenen Positionen mühelos Beifall ernten lässt, stehen Andersdenkende unter Druck. Denn wer Glaubenssätze in Frage stellt, riskiert den öffentlichen Pranger. Sagen uns zunehmend andere, was wir zu denken haben? Oder ist "betreutes Denken" eine willkommene Orientierungshilfe in einer immer komplexeren Welt? Wo liegen die Grenzen des Sagbaren? Und wie finden wir zurück zu einer offenen gesellschaftlichen Debatte?
    Diskussion, Österreich 2026,  M: Michael Fleischhacker
