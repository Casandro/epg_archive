  title: Hubert und Staller
  subtitle: Bis zum letzten Tropfen
  description: |-
    Polizeirat Girwidz verdonnert sein gesamtes Team zur Blutspende, denn die Polizei soll der Wolfratshausener Bevölkerung als gutes Beispiel vorangehen. Allerdings ereignet sich im Blutspendezentrum ein tragischer Unfall: Eine ältere Spenderin hat offenbar so viel Blut verloren, dass sie noch vor Ort verstirbt. Zum Entsetzen aller stellt sich heraus, dass die Tote Erna Rattlinger ist - die Tante von Sabrina Rattlinger. Aber es kommt noch schlimmer: Der Blutverlust wurde absichtlich herbeigeführt - es war also Mord! Nun haben Hubert und Staller ein Problem. Denn unter Mordverdacht gerät nun deren Bekannte Sabrina Rattlinger, die als Alleinerbin ein eindeutiges Motiv hätte. Doch das Konto der Tante ist leer und das Haus wurde offenbar kurz vor dem Tod verkauft - über einen Mittelsmann, und zwar an Polizeirat Girwidz!

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.
    Krimi, Deutschland 2014, R: Sebastian Sorger
  widescreen: true
