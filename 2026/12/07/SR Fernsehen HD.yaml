  title: Assenheimers Promitalk
  subtitle: 'Moderation: Jörg Assenheimer'
  ageRating: 16
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Ein texanischer Autohändler mit einer skurrilen Ader für Marketing-Stunts veranstaltet einen Wettbewerb. Gewinner ist die Person, die am längsten ohne Unterbrechung, wach und stehend ihre Hand an einen nagelneuen Pick-up Chevrolet Avalanche halten kann. Dabei wird das Durchhaltevermögen der Teilnehmenden über Tage hinweg unter Schmerzen bis an die körperlichen und psychischen Grenzen getrieben. \n\nBasierend auf wahren Begebenheiten, wirft der Film einen verstörenden Blick auf den schrägen Ritus einer Klassengesellschaft, der Jahr für Jahr eine ganze Stadt in seinen Bann zieht."
