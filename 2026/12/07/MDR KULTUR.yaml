- eventId: 671331
  start: 2026-12-07T19:00:00Z
  stop: 2026-12-07T20:00:00Z
  title: Titel. Nerven. Wunder. Wetter
  subtitle: Aktuelle Autorenproduktionen
  description: "Ein filmanalytischer Vergleich\nAutor, Regie und Realisation: Carsten Schneider | Länge: 14'59\nMit: Uwe Hipler, Thomas Gießler, Marita Busch u.v.a.\n\nDen Auftakt der Sendung bestreitet Carsten Schneider, einer der Nestoren der deutschsprachigen freien Autorenproduktionen. Aus Anlass des 40. Jubiläums der Gründung des Studiengangs \"Kulturpädagogik\" (heute: \"Kulturwissenschaften und künstlerische Praxis\") an der Universität Hildesheim (den Schneider auch selbst absolvierte) versammelt er in einer nur minimal fiktionalisierten Sendung aus der Reihe \"unterwegs\" des Deutschlandfunks im Archivkeller der Universität eine bunte Gruppe ehemaliger Absolventen aller Geschlechter zu einer hymnischen Feier der Selbstkreativität: Oder: Wo der der Titel hinfällt, bleibt kein Wort auf dem anderen.\n\nTouch Pool - Berührungsbecken\nNach einer Erzählung von Alisa Kossak | Länge: 15'34\nBearbeitung und Regie: Sarah Veith\nMit: Annalena Haering, Emilia Reichenbach, Holger Jenss, Saskia Schenk\nKomposition: Florentin Berger Monit, Johannes Wernicke\n\nIn \"Touch Pool - Berührungsbecken\" betritt eine Person eine Klinik. Die Protagonistin hatte einen Unfall. Aber seitdem bei einer OP versehentlich ein Nerv im Fuß durchtrennt wurde, leidet die Patientin an einem Schmerzsyndrom, das medizinisch noch nicht vollständig verstanden ist. Das Stück erzählt von der Erfahrung eines versehrten Körpers und dem Umgang mit einer chronischen Krankheit. \"Aus 'krank' wird in diesem Hörspiel 'nicht gesund'. (...) Stattdessen erfahren wir unmittelbar und behutsam von der leiblichen Erfahrung eines versehrten Körpers, vom Blitzen der Nervenschmerzen, von Schmerz als einem Phänomen im Inneren des Körpers, das zugleich als fremd und grenzüberschreitend erlebt wird.\" (aus der Laudatio zur Verleihung des Kurzhörspielpreis \"Max15\" 2025)\n\nIch habe dem Wunder ein Ultimatum gestellt\nAutorenschaft und Regie: Kollektiv Wien (Leonie Ziem, Valerie Prinz, Fred Heinemann) | Länge: 12'\nMit: Leonie Ziem\n\nZwölf Mailbox-Nachrichten. Eine Anruferin versucht vergeblich, das Gegenüber zu erreichen. Doch das Gegenüber sitzt im Theater, bei einer Veranstaltung zu \"Wokeness und Cancel Culture\", zwei Kampfbegriffe der Rechten. Die Anruferin assoziiert die Fragwürdigkeiten des Verstehens, spürt der Abweisung von Kontakt als Strategie zur Begrenzung von Welterfahrung nach, auch und gerade im Privaten: \"Dieser eine Zentimeter Fremdheit, der immer bleibt.\" Das Hörspiel wurde für die \"Revue der Entpörung\" am Schauspielhaus Wien am 25.10.25 konzipiert, als 12 Soundinterventionen zwischen den einzelnen Beiträgen der Revue. \n\nwetter\nAutorin: Esma Ahmedi | Sound Design: Alina Volkova | Länge: 4'56\"\nStimmen: Betty Gjecaj, Paul Kraker, Orhan Kipcak\n\nEsma Ahmedi entwirft eine akustische Liebelei, die ihr Thema, das unverbindlich-unverantworliche (Dahin)Leben, lässig parodiert. Nichts schmerzt hier, schon gar nicht die Abwesenheit der/des Geliebten. Kann ich doch auf der App sehen, wie dort, wo sie/er ist, das Wetter ist. Nicht das mich das beträfe, es ist ja ihr/sein Wetter, nicht meines. Genauso wie Überschwemmungen und Waldbrände, solange sie bleiben, wo sie hingehören: in die App.\n\nKeine Meldungen\nAutor / Schnitt: Carsten Schneider | Länge: 2'49"
