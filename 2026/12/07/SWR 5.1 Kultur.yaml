  description: "Wir begleiten Sie mit handverlesener Popmusik, aktuellen Berichten aus der Kulturszene und inspirierenden Gesprächen in den Abend.\n\nDarin heute:\n\nBericht\nUni Heidelberg: Angebliche Renoir-Fälschung ist doch ein Original\nvon David Kopp\n\nBericht\nPolitische Filme beim Int. Filmfestival Mannheim Heidelberg\nvon Natalie Akbari\n\nBericht\nAlgorithmische Kompositionen - Die Karlsruher Computer-Musikerin Jia Liu\nvon Marie-Dominique Wetzel\n\nSong des Tages\nMei Semones: Two Hands\n\nBericht\n\"Simple too\" - Schöner pfuschen mit Yotam Ottolenghi\nvon Tobias Stosiek\n\nBericht\nFilm \"Identitti\" mit Frankfurter Rapperin Sabrina Setlur\nvon Natascha Pflaumbaum\n\nBuch des Tages\n\"Reaktionsmaschine. Tribunale sozialer Medien\" von Rupert Gaderer\nvon Leander Scholz\n\nMusikliste:\n\n1. Jorge, Seu: Folia do amor\n2. Pearl & The Oysters: Lights out\n3. Sotiris Letsios: Kathreftis\n4. The Womack Sisters: My Sisters and me\n5. Britta Rex: Resilience song\n6. Zayas, Ramiro: Familia\n7. Uusikuu: Me rakastavaiset\n8. DjeuhDjoah & Lieutenant Nicholson feat. Manone: Joséphine\n9. Mei Semones: Two Hands\n10. Saravá: On the mountain\n11. Nancy Vieira: Sol di nha vida\n12. Ditty: Kali \n13. Charlie Wood: Love can't love alone\n14. Nuits Saint Jorge: Bien au vent\n15. Ori Kaplan & Lihu Melamed: Merveille\n19:00 - 19:04 Nachrichten, Wetter"
