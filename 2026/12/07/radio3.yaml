  title: ARD Konzert
  description: "Jubiläumskonzert 75 Jahre SWR Big Band\n\nDie SWR Big Band feiert 75. Geburtstag\n\nIn diesem Konzert groovt es gewaltig: Harlems rauchiger Cotton Club trifft auf Kapustins virtuose Klangwelt: SWR Symphonieorchester, SWR Big Band und Frank Dupree Trio verschmelzen Jazz und Klassik.\n\nJazz und Klassik? Zwei Welten, die sich hier mit Verve begegnen. Duke Ellingtons \"A Parallel to Harlem\" entführt in die rauchige Atmosphäre des legendären Cotton Club im Harlem der 20er Jahre. Nikolai Kapustin verbindet klassische Präzision mit jazzigem Drive - virtuos interpretiert vom Frank Dupree Trio, der SWR Big Band und dem SWR Symphonieorchester unter Dominik Beykirch. Dazu: die Welturaufführung einer neuen Suite von Thorsten Wollmann. Ein Abend voller Groove, Energie und musikalischer Grenzgänge zum 75. Geburtstag der SWR Big Band. \n\nSWR Symphonieorchester\nSWR Big Band\nFrank Dupree (Klavier)\nObi Jenne (Schlagzeug)\nJakob Krupp (E-Bass)\nVolker Engelberth (Klavier)\nLeitung: Dominik Beykirch\nThorsten Wollmann:\n\"Spring Concerto\" für Jazz Piano und Big Band\nJazz-Sinfonie für Sinfonieorchester und Big Band (Uraufführung)\nNikolai Kapustin:\nKlavierkonzert Nr. 3 op. 48\nDuke Ellington:\n\"A Tone Parallel to Harlem\" (\"Harlem Suite\")\n\n(Konzert vom 30. Oktober 2026 in der Liederhalle Stuttgart)"
- eventId: 671664
  start: 2026-12-07T21:00:00Z
  stop: 2026-12-07T22:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Beate Sampson, Roland Spiegel und Ulrich Habersetzer'
  description: "Hören wir Gutes und reden darüber!, Vol. 68\nStarke Jazzalben im Gespräch\n \nBeate Sampson, Roland Spiegel und Ulrich Habersetzer überraschen sich gegenseitig und Sie mit spannenden Neuerscheinungen\n \n\"Eine Sendung wie eine Insel. Draußen herrscht hoher Seegang, aber was im Hier und Jetzt zählt, das sind handverlesene Töne, die in die Ohren des Publikums tropfen\". Das schrieb 2022 die Grimme-Jury in ihrer Begründung dafür, dass \"Hören wir Gutes und reden darüber!\" den Deutschen Radiopreis als \"Beste Sendung\" erhielt. Wir nehmen Sie mit auf diese Hör-Insel! Jede und jeder stellt ein neues Jazzalbum vor, ohne den anderen vorher zu verraten, worum es sich handelt. Hören, rätseln und laut nachdenken über Töne - darum geht es bei \"Hören wir Gutes\". Lassen Sie sich überraschen!\n\nModeration: Beate Sampson\nRoland Spiegel\nUlrich Habersetzer"
