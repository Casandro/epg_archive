  title: ARD Konzert
  subtitle: Die SWR Big Band feiert 75. Geburtstag
  description: "Jazz und Klassik? Zwei Welten, die sich hier mit Verve begegnen. Duke Ellingtons \"A Parallel to Harlem\" entführt in die rauchige Atmosphäre des legendären Cotton Club im Harlem der 20er Jahre. Nikolai Kapustin verbindet klassische Präzision mit jazzigem Drive - virtuos interpretiert vom Frank Dupree Trio, der SWR Big Band und dem SWR Symphonieorchester unter Dominik Beykirch. Dazu: die Welturaufführung einer neuen Suite von Thorsten Wollmann. Ein Abend voller Groove, Energie und musikalischer Grenzgänge zum 75. Geburtstag der SWR Big Band. \n<strong>Thorsten Wollmann<br/></strong>\"Spring Concerto\" für Jazz Piano und Big Band<br/>Jazz-Sinfonie für Sinfonieorchester und Big Band (Uraufführung)\n<strong>Nikolai Kapustin<br/></strong>Klavierkonzert Nr. 3, op. 48\n<strong>Duke Ellington<br/></strong>\"A Tone Parallel to Harlem\" (\"Harlem Suite\")\n<strong>SWR Symphonieorchester<br/>SWR Big Band<br/>Frank Dupree</strong>, Klavier<br/><strong>Obi Jenne</strong>, Schlagzeug<br/><strong>Jakob Krupp</strong>, E-Bass<br/><strong>Volker Engelberth</strong>, Klavier<br/>Leitung: <strong>Dominik Beykirch</strong>\nKonzert vom 30. Oktober 2026 aus der Stuttgarter Liederhalle"
