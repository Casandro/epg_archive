  title: Das Märchen vom goldenen Taler
  subtitle: Fernsehfilm Deutschland 2020
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Im kleinen Dorf Überall herrscht große Traurigkeit und Mutlosigkeit. Was die Bewohner auch tun, im Dorf wächst nichts außer Kohl. Doch das war nicht immer so: Viele Jahre hat der goldene Taler dem Dorf Reichtum und Glück beschert, ohne dass die Bewohner etwas dafür tun mussten. Das Mädchen Anna Barbara hält es nicht länger aus. Sie macht sich heimlich auf die Suche nach dem Lumpensammler, von dem die Frau des Bürgermeisters glaubt, dass er den goldenen Taler gestohlen hat.'
