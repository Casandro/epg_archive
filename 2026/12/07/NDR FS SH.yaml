  description: "CDU und SPD stecken mitten in einer Ehekrise: Dauerstreit über Reformen, Renten und verletzte Gefühle. Markus Söder warnt vor Kommunismus, die Junge Union schießt gegen links und Friedrich Merz beschwört die Gerechtigkeit, als ließe sie sich herbeireden. Kein Wunder, dass der Kanzler seinen Job am liebsten abgeben würde. Doch wer übernimmt freiwillig eine Koalition, die eigentlich schon jetzt reif für die Paartherapie ist? \n* Therapie zwecklos: Ehehölle Koalition\n* AfD-Schulpolitik: Setzen, rechts!\n* Künstliche Intelligenz: Dumm gelaufen für die Menschheit\n* Afghanistan: Schutzversprechen gebrochen?\n* und vieles mehr"
