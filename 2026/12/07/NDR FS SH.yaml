  description: "Bei Henrys Taufe flammen zwischen Daniel und Lou alte Gefühle auf. Lou hofft auf einen Neuanfang. Doch als sie Daniel ihre Gefühle offenbaren will, kommt der ihr zuvor und will lieber einen getrennten Neuanfang in München.\nVictoria verpasst die Taufe wegen eines Schmähartikels. Gerd nutzt die Gelegenheit und gesteht ihr, dass er eine Alpaka-Farm gekauft hat - Victoria ist entsetzt! Noch dazu in der Eifel! \nJulius und Mo versuchen, ihre Annäherung weiter geheim zu halten, bis Gisela sie aufklärt, dass alle im Rosenhaus über ihre Affäre Bescheid wissen."
