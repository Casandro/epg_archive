  title: 'Die Nordreportage: Leder aus Niedersachsen'
  subtitle: Die Wirtschaftselite von morgen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sie sind die nächsten CEOs der Welt: fünf Masterstudierende des Studiengangs Strategie und Management (SIM) Programm an der Universität St. Gallen. Allein für das SIM angenommen zu werden, ist ein Triumph. Das Auswahlverfahren ist hart umkämpft, aber Erfolg bedeutet eine garantierte Anstellung danach. Der Dokumentarfilm porträtiert fünf Studierende, die sich auf diesen Masterstudiengang einlassen: Feifei, Sarah, Tobias, Frederic und David. Sie alle haben ein klares Ziel: so schnell wie möglich beruflich erfolgreich zu sein.'
