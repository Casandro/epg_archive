  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im Berliner Tierpark rückt Tierarzt Dr. Andreas Pauly mit der Spritze bei den Zebras an. Ausgerechnet der Kleinste ist der Erste. Chapman-Zebra-Fohlen Florian soll seine allererste Impfung bekommen. Nebenan hat Hartmann-Bergzebra-Hengst Hakimo eine Wunde am Huf und muss in Narkose versetzt werden und Grevy-Zebra-Stute Franzi braucht eine Wurmkur. Der vierjährigen hinterindischen Tigerin Thaya geht es nicht gut. Heute soll eine Computertomographie zur Abklärung gemacht werden. Außerdem bei  Panda, Gorilla und Co.": Wieso bekommen die Altailuchse farbiges Futter und warum muss Ameisenbär Anton zur Beobachtung beim Tierarzt bleiben?'
