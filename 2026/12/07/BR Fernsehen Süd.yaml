  title: Abendschau - Der Süden
  subtitle: Kraftprotze im Urwald - Europäische Bisons
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ende der 1920er-Jahre waren in Deutschland nur noch 200 Biber an der Mittleren Elbe bei Dessau heimisch. Streng geschützt überlebten hier die bis zu 35 kg schweren Elbebiber. Zu dieser Zeit waren die großen Nager nahezu in ganz Europa verschwunden. Die Jagd nach ihrem wertvollen Pelz und dem schmackhaften Fleisch dezimierten früh ihre Bestände. Auch das sogenannte "Bibergeil", ein moschusähnliches Duftsekret, das in der Medizin als Schmerzmittel Verwendung fand, wurde den Tieren Mitte des 19. Jahrhunderts zum Verhängnis.
