- eventId: 982713
  start: 2026-12-17T13:00:00Z
  stop: 2026-12-17T13:30:00Z
  title: Hundert Mark und ein fröhliches Weihnachtsfest (Folge 2 von 3)
  subtitle: von Hans Fallada
  description: "Ein junges und mittelloses Paar notiert seit dem Sommer alle möglichen - und wenig realistischen - Wünsche für Weihnachten. Kein Tiefschlag hält sie davon ab und schließlich wird ihre Hartnäckigkeit belohnt.\n\nDer Schauspieler Günter Pfitzmann kam am 8. April 1924 zur Welt und war in Fernsehserien und Kinofilmen, aber auch auf der Theaterbühne zu Hause. Nach Kriegsende wurde er an der Berliner Schauspielschule \"Der Kreis\" zum Schauspieler ausgebildet. In Berlin trat er erstmals in der Komödie am Ku'damm auf und eine lange Karriere folgte: Günter Pfitzmann war Mitbegründer des Kabaretts \"Die Stachelschweine\" und spielte in weit über 50 Spielfilmen und Serien mit. Mit seiner freundlich-schnoddrigen Art und dem unüberhörbaren Berliner Dialekt spielte er sich in die Herzen des Publikums.\n\n(13 Min.)\n\nProduktion: RIAS 1967\n\nMitwirkende: \nGünter Pfitzmann"
