  title: Bayern 1 am Morgen
  subtitle: Mit Philipp Eger
  description: "Philipp Eger hat alles, was Bayern für einen guten Morgen braucht: gute Laune, gute Musik, gute Geschichten und ein gutes Gefühl für alles, worüber die Menschen in Bayern sprechen. Als gebürtiger Schwabe, der jetzt in Mittelfranken wohnt und in Oberbayern arbeitet kennt er sich perfekt in Bayern aus und fordert den Freistaat mit seiner täglichen Schätzfrage heraus. Im wöchentlichen Wechsel mit Marcus Fahn macht Philipp Eger aus einem alltäglichen Morgen einen guten Morgen! Von 5 bis 9 auf Bayern 1.  \n\nPhilipp Eger hat immer ein offenes Ohr für Sie. Schreiben Sie uns an studio@bayern1.de oder schicken Sie uns eine Sprachnachricht auf unser Studiohandy: 0151-19589000 (WhatsApp)\n\n5.10 Philipps besondere Morgennummer auf Bayern 1\n5.30 Nachrichten-Schlagzeilen\n5.56 Gedanken zur Adventszeit *\nMax Kronawitter\n6.00 / 7.00 / 8.00\nNachrichten, Wetter, Verkehr\n6.30 / 7.30 / 8.30 \nDas Wichtigste aus Ihrer Region\nGetrennte Ausstrahlung\nüber die fünf UKW-Sendergruppen\nOberbayern, Niederbayern/Oberpfalz, \nMittel- und Oberfranken, Mainfranken, Schwaben\n8.50 Philipps finale Frage\n\n* Als Podcast verfügbar in der App ARD Sounds"
