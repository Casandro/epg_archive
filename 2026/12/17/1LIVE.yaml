  title: 1LIVE Krimi
  subtitle: Landhaus mit Vergangenheit
  description: |-
    <markup type="language.en">Edmond</markup> und <markup type="language.en">Rachel</markup> haben gefunden, wonach sie jahrelang gesucht haben: ein perfektes Landhaus fernab der Großstadt. Doch kaum ziehen sie ein, beginnen rätselhafte Ereignisse. Sind es Einbildungen oder ist das Haus tatsächlich von einer unheimlichen Vergangenheit erfüllt? Je enger die Mauern sich um die Bewohner schließen, desto stärker geraten auch ihre Beziehungen unter Druck.
