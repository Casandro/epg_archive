  description: |-
    Die 21-jährige Bekkaa aus Frankfurt ist Autorin, Musikerin und Content Creatorin und erreicht mit ihren Texten auf Social Media mehrere Millionen Menschen. Sie schafft es in ihren kurzen, poetischen Texten die komplexen Identitätsfragen und das Gefühlschaos ihrer Generation zusammenzufassen.
    Für "Startrampe" covert sie ihr musikalisches Vorbild Cro, dessen Musik sie durch die Höhen und Tiefen ihrer Jugend begleitet hat. Gemeinsam mit ihrem Gitarristen, Producer und bestem Freund Patrik performt sie "Ein Teil" von Cro und ihren eigenen Song "Nicht mehr 16" - zwei gefühlvolle Sessions, in denen ihre R'n'B Vergangenheit durchscheint.
