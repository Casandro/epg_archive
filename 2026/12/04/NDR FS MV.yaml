  title: Zora schmeckt's!
  subtitle: Zu Gast in Nordhorn
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Von Bitterballen bis Bouillabaisse: In Nordhorn an der niederländischen Grenze gehören holländische Imbissklassiker genauso zum Alltag wie ein ganz eigener Döner. Zora entdeckt französische Küche im Stadtpark, packt beim Kaffeerösten in einem Inklusions-Café mit an und erfährt im Tierpark, warum regionale Spezialitäten zum Erhalt alter Nutztierrassen beitragen können. Dazu kommen eine Bootstour mit Gastronom Simon Kuipers, spanisch-mexikanische Tapas und Cocktails aus dem Zapfhahn. Eine abwechslungsreiche Genussreise durch eine Stadt, in der gutes Essen Menschen und Kulturen zusammenbringt.'
