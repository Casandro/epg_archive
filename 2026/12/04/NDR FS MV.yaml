  title: die nordstory - Hamburgs geheime Hinterhöfe
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hamburg ist eine Stadt zwischen hanseatischer Tradition und urbanem Trendbewusstsein, zwischen rauer Hafenromantik und modernem Großstadtflair. Doch wer nur auf die vorderen Fassaden schaut, verpasst eine der spannendsten Seiten der Stadt: ihre Hinterhöfe. Hinter Einfahrten, Torbögen und unscheinbaren Zufahrten verbergen sich häufig geheime Orte mitten in Hamburg. Werkstätten, Ateliers und idyllische Gärten machen die Höfe zu versteckten Kleinoden. Diese teils geheimnisvollen Orte erzählen von Hamburgs Geschichte.'
