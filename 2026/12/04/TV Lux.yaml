  title: Blahoslavený Duns Scotus - Obhajca Nepoškvrneného počatia
  subtitle: '"Ó, Mária, bez poškvrny dedičného hriechu počatá, oroduj za nás, ktorí sa k Tebe utiekame." Túto modlitbu odovzdala 18.'
  description: '"Ó, Mária, bez poškvrny dedičného hriechu počatá, oroduj za nás, ktorí sa k Tebe utiekame." Túto modlitbu odovzdala 18. júla 1830 Panna Mária Kataríne Laboure z rehole Dcér resťanskej lásky Vincenta de Paul, keď sa jej zjavila a prikázala jej, aby dala urobiť medailón s jej podobizňou. Nepoškvrnené počatie Panny Márie bolo témou teologických debát. Jeho obhajobu ako cirkevnú dogmu uskutočnil Ján Duns Scotus na univerzite v Paríži roku Pána 1305. Zomrel v Kolíne v roku 1308. 8.12. 1854 pápež Pius IX. slávnostne vyhlásil dogmu o Nepoškvrnenom počatí Panny Márie. Ján Duns Scotus bol blahorečený Jánom Pavlom II. 20. marca 1993. Réžia: Fernando Muraca. Účinkujú: Adriano Braidotti (Giovanni Scoto), Camilla Diana (Maria), Alessandro Chimi (Fra Guglielmo), Simone Pieroni (Il preside), Maria Toesca (La suora) (2011)'
  genre:
