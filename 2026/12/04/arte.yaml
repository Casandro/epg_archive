  title: Die Welt der Zitrusfrüchte
  subtitle: 'Duftend: Frankreichs Neroli'
  subtitled: true
  description: 'Im Hinterland der Côte d''Azur ist der Bitterorangenbaum, auch "Bigaradier" genannt, tief in der Geschichte verankert. Nicht wegen der Früchte, sondern wegen seiner Blüten: Aus ihnen wird Neroli-Öl destilliert, einer der wertvollsten Rohstoffe der Parfümindustrie. Begleitet werden Familien bei der Blüten-Ernte. Die Dokumentation zeigt, wie Patissiers ihre Köstlichkeiten mit Orangenwasser veredeln und wie Bio-Bauern neue Parzellen anlegen. Dabei wird in Destillen und auf Festen die einzigartige Kultur rund um die Orangenblüte entdeckt.'
- eventId:
  - 628544
  - 759235
  start: 2026-12-04T08:35:00Z
  stop: 2026-12-04T09:30:00Z
  title: Die Welt der Zitrusfrüchte
  subtitle: 'Heilig: Malaysias Pomelos'
  subtitled: true
  description: Die Pomelo, auch Citrus maxima genannt, ist die größte Zitrusfrucht der Welt. Ihre Heimat ist Südostasien. Hochsaison für Pomelos aus Malaysia sind die Monate Januar und Februar. In dieser Zeit findet das Fest zum chinesischen Neujahr statt. In den chinesischen Tempeln dient sie als Opfergabe für die Götter. Beim Festessen am Abend des chinesischen Neujahrsfestes ist das Fruchtfleisch der Pomelo wichtiger Bestandteil des Yee-Sang-Salates - ein Rohkostsalat, der mit Essstäbchen so hoch wie möglich in die Luft geworfen wird. Dieses Ritual soll Glück und Wohlstand für das neue Jahr bringen.
- eventId:
  - 624089
  - 759254
  start: 2026-12-04T09:30:00Z
  stop: 2026-12-04T10:25:00Z
  title: Die Welt der Zitrusfrüchte
  subtitle: 'Spritzig: Mexikos Limetten'
  subtitled: true
  description: 'In Veracruz wächst eine Frucht, die in Begleitung von Chili die meisten mexikanischen Gerichte würzt: die Limette. Begleitet werden die Menschen, die sie pflegen: traditionsbewusst, ökologisch und nachhaltig. Besucht werden Felder am Rand des letzten Bergnebelwalds. Dabei gibt es Reinigungsrituale mit der Limette zu erleben und eine Küche, die die Limette feiert. Die Limette: Geschmack, Duft und Seele eines ganzen Landes.'
