  title: Europas hoher Norden
  subtitle: Südschweden und Bornholm
  description: Die Geschichte Skandinaviens begann in der südschwedischen Provinz Schonen. Die Römer nannten das Land Scania und gaben damit dem hohen Norden Europas erstmals seinen Namen. 40 Kilometer vor der Küste liegt die dänische Insel Bornholm. Mit dem Postboot geht es zu einer winzigen Inselgruppe draußen in der Ostsee - den Erbseninseln. Weiter im Norden tauchen die Schären an der Küste von Småland auf. Dort liegt das legendäre "Glasreich", das Zentrum der schwedischen Glasindustrie. Im Dorf Foteviken mit seinem archäologischen Open-Air-Museum verbringen junge Skandinavier den Sommer als moderne Hobby-Wikinger.
