  title: Bombenterror des Zweiten Weltkriegs
  subtitle: Folge 4
  description: Mit dem Ende der Luftschlacht um England wurde Deutschlands Zivilbevölkerung bombardiert. Während die Luftwaffe nie einen schweren Langstreckenbomber besaß, hatten sich Großbritannien und die USA auf deren Entwicklung konzentriert.
  genre:
  - '129'
