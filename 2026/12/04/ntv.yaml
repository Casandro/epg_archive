  title: Hiroshima - Am Rande der Apokalypse
  subtitle: Folge 1
  description: Eine ungeheure Explosion verwüstet 1945 Hiroshima. In wenigen Sekunden werden 90.000 Menschen getötet. Hiroshima markiert das Ende des Zweiten Weltkriegs und den Beginn einer Ära, die von der Angst vor der Atomkraft beherrscht wird.
  genre:
  - '129'
- eventId: 1047683
  start: 2026-12-04T03:20:00Z
  stop: 2026-12-04T04:15:00Z
  title: Hiroshima - Am Rande der Apokalypse
  subtitle: Folge 2
  description: Eine Atombombe traf 1945 die Stadt Hiroshima. Mehr als 90.000 Menschen starben. Anhand zum Teil unveröffentlichter Archivmaterialien zeigt Regisseur David Korn-Brzoza, wie es zum Bombenabwurf kam und wie die Welt darauf reagierte.
  genre:
  - '129'
- eventId: 1047684
  start: 2026-12-04T04:15:00Z
  stop: 2026-12-04T05:00:00Z
  title: Bombenterror des Zweiten Weltkriegs
  subtitle: Folge 3
  description: Die deutsche Bombenkampagne gegen britische Städte wurde vom Bombenhagel der Alliierten, der auf deutsche Bevölkerungszentren niederging, bei Weitem übertroffen. 1941 erfolgte der berüchtigte Luftangriff auf Pear Harbor.
  genre:
  - '129'
