  title: Hitlers DNA - Das letzte Geheimnis des Diktators
  subtitle: Folge 1
  description: Was verrät Hitlers DNA über die 80 Jahre alten Gerüchte über einen jüdischen Verwandten? Die Experten untersuchen außerdem die Wahrscheinlichkeit, in Hitlers prägenden Jahren sowohl ADHS als auch Autismus zu haben.
  genre:
  - '129'
- eventId: 1039049
  start: 2026-12-04T01:40:00Z
  stop: 2026-12-04T02:25:00Z
  title: Hitlers DNA - Das letzte Geheimnis des Diktators
  subtitle: Folge 2
  description: Neue genetische Erkenntnisse deuten darauf hin, dass Hitler eine Neigung zu Schizophrenie und bipolaren Störungen hatte. Zudem wurde eine genetische Mutation festgestellt, die die sexuelle Entwicklung beeinträchtigen kann.
  genre:
  - '129'
