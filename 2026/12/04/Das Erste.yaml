  description: Einen überaus vergesslichen Kreis von Zeugen und Verdächtigen müssen Neill Rea alias Detective Mike Shepherd und sein Team im letzten Fall der vierten Brokenwood-Staffel vernehmen. Bei "Tödliche Erinnerung" führt die Spur in eine Seniorenresidenz und zu deren dementen Bewohnern. Nicht nur der Schauplatz des 16. Films der beliebten Reihe, sondern auch die Auflösung bietet selbst passionierten Krimiserienfans eine Überraschung. Zum Reiz der weltweit erfolgreichen Reihe gehört - neben der spannenden Geschichte, den besonderen Charakteren und dem idyllischen Kleinstadtsetting - auch der feine Humor, der stets die Fälle begleitet.
