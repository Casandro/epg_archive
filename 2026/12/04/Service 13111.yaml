  stop: 2026-12-04T21:15:00Z
  title: Paula kocht
  subtitle: Kärntner Winterküche
  description: 'Paula Bründl trifft auf Menschen, die im Einklang mit der Natur leben und wirtschaften und das, was der Winter zu bieten hat, auf neue Weise interpretieren und auf den Teller bringen. Die Liebe zum Gemüse treibt Stefanie Sonnleitner auch im Winter in den Garten. Gemeinsam mit Küchenchef Florian Bucar prägt die Tochter von Sissi Sonnleitner als Souschefin die Küchenlinie des Bio-Hotel Daberer. Der Fokus der beiden liegt auf Lebensmitteln aus dem Gailtal - je näher, desto besser. Wie der Fisch aus dem eigenen Teich. Stefan Lastin, ausgezeichnet mit einem Michelin Stern, kocht nicht nur kulinarisch auf höchstem Niveau. Sein Herd auf der Gamskogelhütte liegt auf 1.850 Meter Seehöhe. Dass frische Zutaten auch im Winter vor seiner Haustüre gedeihen, zeigt der Sternekoch Paula Bründl beim Flechten-Sammeln im nahen Wald. Bergbauer, Käsemeister und Kulinarik-Freak - so beschreibt sich Food-Enthusiast Michael Kerschbaumer selbst. Ausgehend von seinem Biobauernhof schaut er gerne über den Tellerrand, beim Besuch von Paula Bründl verschmelzen die Kulturen. Und zwar in Form von Koji Butter, Kimchi und Kärntner Bergkäse ganz einfach zu einem Alpen-Asia Käsetoast. Für Valentin Daberer liegt seine Biokäserei nicht nur auf der Sonnenseite des Gailtals, für ihn ist es die Sonnenseite des Lebens. Täglich produziert er hier drei Käsesorten aus der Rohmilch seiner Kühe. Der ehemalige Weltklasse-Schifahrer Fritz "the Cat" Strobl züchtet am elterlichen Hof hochwertige Angus-Rinder. Das fein marmorierte Fleisch ist in der Spitzen-Gastronomie heiß begehrt. So auch bei Stefan Lastin von der Gamskogelhütte. Kochen wie vor 100 Jahren - bei Kerzenlicht am Holzherd. 4 Sterneköche Hannes Müller, Manuel Ressi, Paul Ivic und Peter Fankhauser und die Challenge: Menü ohne Strom.Österreich 2026, R: Brigitte Erhart M: Paula Bründl'
  genre:
  - '112'
  widescreen: true
- eventId: 1088394
  start: 2026-12-04T21:15:00Z
  stop: 2026-12-04T22:15:00Z
  title: Die Gruaberin
  subtitle: Mit Monika Gruber und Schauspielerin Nina Proll
  description: 'In ihrem Vodcast trifft Monika Gruber spannende, interessante, lustige und unterhaltsame Menschen, die etwas zu sagen haben. Denn wie sagte ihre Oma immer? "Reden macht a Sach aus und bringt d''Leid zamm." Der Kabarettistin geht es um die hohe Kunst des Plauderns und Geschichtenerzählens und um menschliche Begegnungen. Thematisch ist es offen, nur langweilen darf es nicht und Tiefgang muss es haben. "Mein Vorbild als Podcaster ist der Joe Rogan. Der war genauso wie ich Stand-up-Comedian und hat aus Gaudi heraus gesagt: Jetzt hocken wir uns vor ein Mikro und reden einfach. Und - wow - jetzt ist das der erfolgreichste Podcast der Welt. Think big - warum nit."Österreich 2026'
  genre:
  - '112'
  widescreen: true
