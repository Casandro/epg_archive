  description: |-
    Eine schöne Unbekannte liegt tot auf einer Kuhweide. Sie trägt einen goldenen Armreif, der nicht zu ihrem einfachen Outfit passt. Die Ermittlungen ergeben: Es handelt sich um eine rumänische Gastarbeiterin. Eine heiße Spur führt zu Bäuerin Theres Freydank. Dort entdecken Hubert und Staller den gleichen Schmuck wie beim Mordopfer. Doch wie passt das alles zusammen?

