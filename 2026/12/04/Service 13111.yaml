  title: Hoagascht
  subtitle: Mein Bauernhaus - Streckhöfe im Burgenland
  description: 'Die Streckhöfe im Burgenland haben eine einzigartige Bauform: Wohnhaus, Stall und Werkstatt stehen in einer Linie hintereinander, oft aus Lehm gebaut. Schmale Häuser, die von außen schlicht wirken, fast unscheinbar - doch dahinter tun sich langgestreckte Innenhöfe mit schönen Arkadengängen auf. Christina Ömmer entdeckt, wie sich jahrhundertealte Bauweise und moderner Weinbau ergänzen, spürt ursprüngliche Höfe auf und trifft Menschen, die mit viel Gefühl aus alten, fast verfallenen Höfen wieder lebendige Orte machen.Österreich 2025, R: Magdalena Brunner M: Christina Ömmer'
