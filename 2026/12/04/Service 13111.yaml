  description: Die beiden Geparden-Mütter Chilli und Inara und ihre neun Jungen treffen aufeinander und es kommt zu einer Konfrontation. Schließlich trennen sich die Mütter, aber Chillis Junge - Siya und Kolisi - folgen versehentlich Inara. Trotz anfänglicher Feindseligkeit säugt Inara schließlich sogar die fremden Jungen. Die Familien vereinen sich wieder - und während Inara jagt, entführt Chilli die Jungen. Da Inara keine Jungen mehr hat, die sie versorgen muss, wird sie wieder paarungsbereit und sucht nach ihrem Gefährten Shadow. Doch sollte sie trächtig werden, kehrt sie womöglich nicht mehr zu ihrer Familie zurück.Österreich 2023
