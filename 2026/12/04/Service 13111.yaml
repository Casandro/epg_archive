  subtitle: Bäriger Winter - Von Hall ins Karwendel
  description: "Im Winter ist die Engalm, mitten im Karwendelgebirge, tief verschneit und verlassen. Bauer Martin Höger und Hansjörg Reiter kommen einmal im Monat mit dem Schneemobil herauf, um die Käselaibe im Kaskeller zu schrubben und zu wenden. Die Sonne kommt hier erst spät über die Berge. So bleibt die Langlaufloipe gut erhalten. Manfred Reindl spurt seit drei Jahrzehnten die 30 Kilometer lange Loipe bis in den Talschluss.\nHoch über Hall in Tirol wird auf über 2.600 Metern seit 90 Jahren die Glungezerhütte betrieben. Seit 2024 führt sie Tshering Lama Sherpa, der Cousin des verunglückten Bergsteigers David Lama.\nIm Tal steht seit 1680 die \"Bretze\". Früher bezahlten Künstler ihre Zeche mit Werken, noch heute hängen die Originalgemälde in den Stuben des Wirtshauses. Wirt Kurt Duracher kocht selbst und serviert Gerichte aus seiner Kindheit. Blutknödel zum Beispiel.\nNur wenige Kilometer weiter hackt Pater Justus Mwalemba vor dem Benediktinerkloster St. Georgenberg Holz zum Heizen. Der Tansanier trägt Lederhose, jodelt und bezeichnet sich als \"waschechten Tiroler\". \nIn Schwaz schleift Andreas Vylet Messer. \"10 bis 20 Mal in der Woche schneide ich mich. Das wächst aber sofort wieder zu\", meint er. Seine älteste Maschine ist über 100 Jahre alt. Am Talschluss des Nafingstals schupfen Michael Reitmeir und seine Frau die Weidener Hütte. Hier hat er ihr auch den Heiratsantrag gemacht.\nAm Glungezer geht es auf handgefertigten \"Klumpern\" den Hang hinunter. Fritz Gaber baut die kleinen Holzrodeln noch selbst. In der Wattener Lizum ist für Lukas Aichhorn die Welt in Ordnung. Für den Bergkäse muss er runter ins Tal, in den \"Kasbunker\" bei Volders, abends geht es zur Mondscheinskitour und in Thaur ziehen schließlich die Muller durch die Bauernstuben und vertreiben den kalten Winter.Österreich 2026, R: Eduardo Gellner"
