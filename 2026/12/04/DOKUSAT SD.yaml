  title: Helden der Evolution - Bären
  description: Bären gehören zu den größten und stärksten Säugetieren überhaupt. Sie sind stammesgeschichtlich mit den Hunden verwandt und in den unterschiedlichsten Lebensräumen Amerikas und Eurasiens zu Hause. In der Regel gelten diese Giganten der Wildnis als genügsame, ruhige Zeitgenossen. Doch sie können auch anders. Von den weißen Eisbären des Polarkreises bis zu den pechschwarzen Malaienbären Südostasiens - "Helden der Evolution" begibt sich auf die Spuren der Bären und begleitet sie durch ihren Alltag.
  widescreen: true
- eventId: 1088335
  start: 2026-12-04T16:20:00Z
  stop: 2026-12-04T17:30:00Z
  title: Helden der Evolution - Großkatzen
  description: 'Katzenartige Raubtiere sind ebenso geschmeidige wie effektive Jäger, die in vielen Naturlandschaften der Erde an der Spitze der Nahrungskette stehen. "Helden der Evolution" konzentriert sich auf die eindrucksvollsten unter ihnen: Tiger, Löwen, Leoparden und Jaguare. In packenden Bildern zeigt die Reihe diese imposanten Großkatzen in Aktion. Dabei wird die ungeheure Kraft dieser Tiere deutlich, die sie mit Taktik und enormer Beweglichkeit einsetzen, um im täglichen Kampf ums Dasein zu bestehen.'
  widescreen: true
