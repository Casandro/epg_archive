  title: Tiere vor der Kamera - Highway durch die Prärie - Weites Grasland
  description: Arendt und Schweiger führen durch die nordamerikanische Prärie, bremsen für Bisonherden und beobachten Kraniche über dem Highway. Millionen Vögel ziehen im Frühling durch das Grasland, während entlang der Straße Präriehunde, Antilopen und Bison zu sehen sind. Die Fahrt bietet unterhaltsame Einblicke in die Tierwelt, kommentiert mit einem Augenzwinkern.
