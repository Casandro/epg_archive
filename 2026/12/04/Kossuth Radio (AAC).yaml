  description: 'problémákról, éppúgy, mint zenéről, irodalomról és hagyományról. A legérdekesebb kulturális eseményekről a helyszínről számolunk be, a stúdióban pedig meghívott vendégeinkkel beszélgetünk: tudósokkal, közéleti személyiségekkel, papokkal-rabbikkal, művészekkel, zsidókkal és nem zsidókkal ? mindenkivel, akinek véleménye van zsidókról és zsidóságról. Újszerű nézőponttal és formabontó látásmóddal várunk félórára mindenkit ? aki szereti vagy utálja, ismeri vagy nem ismeri, a magyar zsidóságot. Riportjaink között pedig a zsidó zene teljes spektrumából válogatunk, a hagyományos dallamoktól a legmodernebb popig.'
