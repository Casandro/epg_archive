  title: Harangszöveg
  subtitle: '2026.12.04-i adás Ma délben a nyergesújfalui Szent Mihály római katolikus templom harangja szól a Kossuth Rádióban. Nyergesújfalu Komárom-Esztergom megyei város, a Duna jobb partján, a... '
  description: fővárostól 46 kilométerre, északnyugatra. Neve Kézai Simon krónikájában Nyergedszeg néven szerepel, majd a tatárjárás után kétszáz éven át Újfaluként hívták. A középkorban a Szovárd, a Bajót-Nagymartoni, a Kanizsai és a Tardos családok birtokolták. Luxemburgi Zsigmond király 1388-ban koronázási ajándékul az esztergomi érseknek adományozta. II. Rákóczi Ferenc a szabadság-harc alatt itt szabadította ki a császári városparancsnok által elfogott Bottyán Jánost, akiből a Nagyságos Fejedelem egyik leghűségesebb híve lett. A Szatmári béke után bajor és Fekete-erdei németek telepedtek le a Sánc-hegy környékén. 1720-ban, a törökök által lerombolt templom romjai helyén a hercegprímás, Keresztély Ágost újat építtetett. Ez azonban ötven év múlva leégett. Mária Terézia védnöksége alatt épült újjá 1771-ben. A nyergesújfalui Szent Mihály templom 45 méter magas tornyában három harang lakik. A délidőben megszólaló négy mázsa hét kilós harangot Szlezák Rafael mester öntötte rákospalotai műhelyében 1949-ben.
