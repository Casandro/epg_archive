  description: |-
    Der Gitarrist Mark Lettieri steht für ein "tightes", druckvoll groovendes Rhythmusspiel - geprägt im Umfeld von Snarky Puppy.
    Funk, Rock und komplexe Grooves verschmelzen bei Mark Lettieri zu einem unverwechselbaren Sound. Für die erste Begegnung mit der WDR Big Band im Januar 2024 arrangierte der ehemalige Chefdirigent Michael Abene die rhythmisch vertrackten Kompositionen Lettieris zu einem fulminanten Programm, das auch auf CD festgehalten wurde. Bei den Leverkusener Jazztagen 2026 wird dieses erfolgreiche Projekt erneut live präsentiert. Mit dabei ist auch wieder Mark Lettieris hochkarätige Rhythmusband.
