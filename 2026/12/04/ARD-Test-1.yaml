  description: 'Sie bildeten eines der legendärsten und erfolgreichsten Comedy-Duos der deutschen Fernsehgeschichte. Anfang der 1990er Jahre lernten sich Olli Dittrich und Wigald Boning im Hamburger "Quatsch Comedy Club" kennen. Der große Durchbruch folgte 1993 als feste Ensemblemitglieder der bahnbrechenden Sketch-Show "RTL Samstag Nacht". Mit "Zwei Stühle - Eine Meinung" schrieben sie dort Comedy-Geschichte: In der weltberühmten Interview-Parodie löcherte Moderator Wigald Boning die von Olli Dittrich verkörperten Charaktere - wie die "Lichtgestalt" Franz Beckenbauer und die Kunstfigur Mike Hansen mit scheinbar tiefgründigen Fragen.'
