  description: 'Beim LKA knallen die Sektkorken: Durch den Kronzeugen werden IS-Strukturen zerschlagen - und führende Köpfe verhaftet. Doch der Zorn des "Emirs" bringt jenen in Todesgefahr, von dem er sich verraten fühlt - selbst im Zeugenschutz. Dass Laudin sein Versprechen nicht halten konnte, belastet den erfolgreichen Staatsschützer. Obwohl der Beamte weiter vor Anis warnt, kann dieser im Dezember 2016 unbehelligt seinen Anschlag vorbereiten ...'
