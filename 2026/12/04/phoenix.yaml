  title: Baumeister der Wildnis (1/2)
  subtitle: Webervögel, Ameisen und Co.
  description: |-
    Tiere sind vielseitige und erstaunlich kreative Wesen. Sie gestalten aktiv ihre Welt - als Architekten, Ingenieure und Baumeister. Hoch in den Bäumen bauen sich Orang-Utans täglich ein neues Schlafnest. Australische Blattfloh-Larven nutzen den überschüssigen Zucker im Pflanzensaft, um sich daraus eine gitterartige Behausung zu bauen.
    Keilschwanzadler sind standorttreu. Das Brutpaar brütet immer im selben Horst, der jedes Jahr vergrößert wird. Es entstehende riesige Bauwerke aus Ästen und Reisig, die bis zu 50 Jahre genutzt werden.
