    40 Jahre teilen Stacheldraht und Minen Deutschland in Ost und West trennt der Todesstreifen der Innerdeutschen Grenze das Land. Für viele Deutsche wird er zum Schicksal. Im Film erzählen sie ihre Erlebnisse: darunter Flüchtlinge und Grenzsoldaten  und zwei Frauen aus Magdeburg. Sie sind die ersten DDR-Bürger, die am 9. November 1989 über die geöffnete Grenze fahren  bei Helmstedt, bevor in Berlin die Mauer fällt.

