  title: Temps présent
  description: |-
    Les survivants de Crans-Montana Pendant des semaines, parfois des mois, des jeunes victimes de Crans-Montana ont été plongées dans le coma, loin du battage médiatique, luttant pour leur survie. Leurs parents, à leur chevet, nous avaient confié leur détresse ; leurs enfants, aujourd'hui sortis du coma, ont accepté d'être suivis à leur tour par nos caméras. Jérémie, qui avait été transféré à Lyon, a dû être réopéré des cordes vocales abîmées par les fumées ; Farah va devoir subir de nouvelles opérations sur ses greffes. Tous deux tentent de retrouver une vie normale. Et puis il y a les très grands brûlés encore hospitalisés. Luka et Alan, brûlés au visage et sur près de 70 % de leur corps, ont entamé leur lente reconstruction. Ils nous livrent un témoignage bouleversant, plein d'espoir et de résilience.

    Un reportage de Yannick Tenet et Elisabeth Logean (Suisse Romande-2026)
