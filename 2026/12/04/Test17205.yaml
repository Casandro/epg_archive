  title: Objectif Monde L'hebdo
  description: "Protection de l'enfance : l'Espagne se mobilise Il y a quelques semaines le Parlement suisse a validé l'accord commercial entre la Suisse et le Mercosur. Ce traité avec le bloc sud-américain composé de l'Argentine, du Brésil, de l'Uruguay et du Paraguay doit permettre d'économiser 168 millions par an de droits de douane. Afin de calmer la colère et les inquiétudes des agriculteurs suisses, Berne a débloqué 550 000 euros. Mais dans les filières d'élevage, nombreux sont ceux qui s'interrogent sur leur capacité à pouvoir rivaliser avec les coûts de production de la viande argentine. Léandre Duggan est allé à la rencontre d'éleveurs de bovins suisses et argentins. \n\n (Suisse Romande-2026)"
