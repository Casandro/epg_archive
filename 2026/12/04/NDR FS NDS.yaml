  subtitle: Hochsaison bei den Schnittblumen
  description: "Bei Jens Wöbb auf dem Blumenhof in Altengamme ist die Zeit gekommen, in der er die meisten Blumen ernten kann.\nIm niedersächsischen Kölau hat Christine Bremer im\nInternet große mobile Ställe gekauft. Die stehen allerdings noch auf halber Strecke zwischen dem Verkäufer und ihrem Geflügelhof.\nAuf Hof Thudt in Herrhausen im Harzer Vorland ist der\nHäcksler vom Mähdrescher kaputt. Und das mitten in der Erntezeit! \nAuf dem Hof von Karsten Dudziak in Sophienhof bei\nNeustrelitz macht der Praktikant Elias Reich den\nHeuschwader klar."
