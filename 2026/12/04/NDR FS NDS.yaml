  description: 'Es wird gehörig turbulent im neuesten Film von Chiara Schoras, zu sehen am 4. Dezember im Ersten: Der im Jahr zuvor an Heiligabend verstorbene Ehemann ihrer Rollenfigur kehrt rechtzeitig zum Fest als humanoider Roboter zu den Kindern und ihr zurück - und löst als täuschend echtes und auch verbessertes Replikat im vielschichtig, warmherzig, besinnlich und humorvoll erzählten ARD-Weihnachtsstreifen "Der größte Wunsch" allerhand Komplikationen aus. Welche genau das sind, darüber wird Chiara Schoras auf dem Roten Sofa erzählen.'
