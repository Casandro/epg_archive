  description: "Elefantenmädchen Shila hat eine künstlerische Ader. Deshalb hat ihr Thorsten Köhrmann eine Staffelei aufgebaut und die drei Grundfarben besorgt: Blau, Rot und Gelb. Shilas Pinselstrich ist durchaus gekonnt. Nur die Farben, die findet man anschließend nicht nur auf dem Papier. \nBei gefühlten 35 Grad im Schatten brauchen die Tapire dringend eine Abkühlung. Martin Kersten verbindet das Duschbad gleich mit einer pflegenden Schlammpackung. Pinselohr-Eber Rufus leidet unter Zahnschmerzen und die Alpakaherde bekommt Zuwachs."
