  title: Wie geht das? Lupine - Neue Power vom Acker
  description: Bauern und Tüftler aus Mecklenburg-Vorpommern wollen gemeinsam den Ernährungsmarkt revolutionieren und Soja durch Lupinen ersetzen. Aus den Samen der weiß und blau blühenden Pflanzen, die so gut auf den trockenen norddeutschen Böden gedeihen, machen sie Brot, Eis oder Kaffee. Die Kunst besteht darin, das Lupineneiweiß zu nutzen und die Bitterstoffe zu neutralisieren. Wie geht das?
