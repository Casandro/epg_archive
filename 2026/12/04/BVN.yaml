  title: Meer dan verwacht
  subtitle: Feest, fietsen en eerste ontmoetingen S03 E04. Een inkijk in het zeer verrijkte, gezellige, chaotische, maar bij vlagen ook pittige bestaan van kersverse meerlinggezinnen.
  description: In Lisse is Kevin jarig. Nicole heeft een verrassing geregeld en ook de meiden pakken uit met hun cadeautjes voor papa. In Heerhugowaard kunnen Levi, Mats en Twan niet wachten om samen op de fiets te stappen, maar omdat er nog maar twee fietsen zijn moet er eerst een derde fiets komen. Daarna is het tijd voor fietsles en dat blijkt voor Mieke en Nick een flinke uitdaging. Op Ibiza proberen Cora en Floris hun vakantiegevoel te vinden met de drieling. In België breekt het moment aan waar Melissa en Ben maanden naartoe hebben geleefd; de geboorte van de drie meiden. Hun leven verandert van het ene op het andere moment compleet. (2026)
