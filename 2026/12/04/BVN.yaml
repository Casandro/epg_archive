  title: Pro Deo
  subtitle: Ongelijke strijd S01 E04. De aanslag op het kantoor heeft een enorme impact op Alex en haar collega's. Layla verdedigt een zieke vrouw die in een strijd verwikkeld is met het UWV en Henry doet er alles aan om Louis te helpen.
  description: 'De aanslag op het kantoor heeft een enorme impact op Alex en haar collega''s. Layla verdedigt een zieke vrouw die in een strijd verwikkeld is met het UWV, maar loopt tegen een muur van bureaucratie aan. Henry doet er alles aan om Louis te helpen, maar zijn situatie loopt steeds verder uit de hand. Dan krijgt Henry ook thuis slecht nieuws te horen. De financiële problemen van het kantoor dwingen Alex tot een keuze die ze liever niet wil maken. Ondertussen staat ze een vader bij die vecht voor zijn kind. Regisseur: Will Koopman. Acteurs: Tjitske Reidinga (Alex Sterkenburg), Annet Malherbe (Jacq van der Waal), Anne Prakke (Henry Langweer), Madina Rashidi (Layla Zahar), Edwin Jonker (Nelson Ceder) (2026)'
  ageRating: 12
