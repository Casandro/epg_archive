  title: Noord-Zuid-Oost-West
  subtitle: Buitengewoon - Van Rossem Vertelt S06 E190. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'In het natuurprogramma Buitengewoon: tussen Arnhem en Elst bouwen vier jonge boeren aan een bijzonder experiment: een voedselbos waarin landbouw en natuur samengaan. Een paar jaar geleden was dit nog een kaal weiland, nu groeit hier een compleet nieuw ecosysteem. In Van Rossem Vertelt: wolvenjacht. Historicus Maarten van Rossem vertelt over opmerkelijke gebeurtenissen uit andere tijden. In de 16e en 17e eeuw werd er intensief op de wolf gejaagd in onze provincie. Hoe zag die wolvenjacht eruit? Maarten gaat op onderzoek uit op de Utrechtse Heuvelrug. (2026)'
  genre:
  - '144'
