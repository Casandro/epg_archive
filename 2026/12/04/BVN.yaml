  title: Binnenstebuiten
  subtitle: S12 E172. In Amsterdam wonen jongeren in containerwoningen, chef-kok Sharon maakt Pom; een Surinaams gerecht, boswachter Marieke staat oog in oog met een dassenfamilie en groene gevels van mosbeton.
  description: Vanuit uit een dorp in Friesland kwam Chris snel in aanmerking voor zijn anderhalve containerstudio in Amsterdam. Met tweedehands meubels richt hij zijn stulpje in. * Chef-kok Sharon maakt pom, een Surinaams feestgerecht. Ze vult de ovenschotel van pomtayer met kippendijen en zoutvlees in een kruidige jus. Een gerecht dat de dag erna nog lekkerder is. * We gaan Terug in de tijd met boswachter Marieke. Ze ziet in 2016 voor het eerst wilde dassen, en dan ook nog eens een volledige dassenfamilie! * Marieke Eyskoot gaat bij langs bij Rik die een oplossing heeft gevonden voor de hittestress in de stad; hij maakt groene gevels van mosbeton. (2026)
