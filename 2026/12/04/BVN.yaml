  description: Eva wilde de strijd op de woningmarkt niet aangaan en verbouwde daarom samen met haar familie een oude schuur op het erf van haar ouders tot haar eigen starterswoning. * We gaan Terug in de Tijd met chef-kok Ramon die in 2023 langsgaat bij Welmoed. Niet alleen één van de jongste duurzame boeren van Nederland, maar ook eentje die vlogt over het wel en wee van het boerenleven. Samen met haar ouders runt ze een biologische dynamische melkveehouderij in het Friese Sondel. * Het zijn drukke tijden voor Sinterklaas. Kleermaker Mark Mous helpt de goedheiligman; hij is gespecialiseerd in het maken van pietenpakken en mantels voor de sint. (2026)
