  title: Het klokhuis
  subtitle: 'Broccoli S37 E4720. De een is er dol op, de ander ietsje minder en het is een van de gezondste groenten die er zijn: broccoli. Serah bezoekt een bedrijf waar per jaar acht miljoen broccoli''s worden verbouwd.'
  description: 'De een is er dol op, de ander ietsje minder en het is een van de gezondste groenten die er zijn: broccoli. Serah bezoekt een bedrijf in Noord-Holland waar per jaar acht miljoen broccoli''s worden verbouwd. Ze volgt het hele proces: van zaaien tot oogsten tot inpakken. En ze krijgt antwoord op al haar prangende broccoli-vragen. Wist je dat broccoli familie is van de bloemkool, maar ook van spruitjes, rode kool en paksoi? En waarom laat je van die heerlijke broccoli nou van die ongelooflijk vieze scheten? In Kitchen Time zien we een recept voor een bijzondere taart. (2023)'
  genre:
  - '16'
