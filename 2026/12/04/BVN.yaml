  stop: 2026-12-04T12:00:00Z
  title: Noord-Zuid-Oost-West
  subtitle: 'De Verdwenen Kastelen van Kennemerland - Natuurlijk Zoëy S06 E189. Erfgoedspecialist Marius Bruijn bezoekt kasteel van Brederode in Santpoort. In Natuurlijk Zoëy: zilverreigers in de Eempolder.'
  description: 'In Verdwenen Kastelen gaat erfgoedspecialist Marius Bruijn op zoek naar middeleeuwse kastelen die Kennemerland ooit domineerden, maar waar nu weinig of niets meer van over is. In deze aflevering kasteel van Brederode in Santpoort. In Natuurlijk Zoëy: zilverreigers. Presentator Eddy Zoëy is in de Eempolder, want daar is een watervogel te vinden die je vroeger weinig zag: de zilverreiger. (2026)'
  genre:
  - '144'
