  description: Eine Pilotin spielt Geige, eine Flugbegleiterin Klarinette. Sie sind zwei von 100 Musikern im Lufthansa Orchester. Techniker, Büroangestellte, Ramp Agents und noch mehr Mitarbeitende aus der Fliegerei musizieren in ihrer Freizeit. Das größte ehrenamtliche Betriebsorchester Deutschlands wurde erst 2011 gegründet und zählt schon heute zu den begehrtesten Ensembles in der Musikszene. Weltstars wie James Arthur haben mit den Hobbymusikern in der Elbphilharmonie in Hamburg gespielt. Jetzt ist Rea Garvey mit dem Orchester "in Concert".
