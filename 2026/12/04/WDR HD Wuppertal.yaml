  title: Darius Blair - Leverkusener Jazztage 2026
  subtitle: Aufzeichnung vom 02.11.2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Quartett um den Frankfurter Saxophonisten Darius Blair präsentiert vorwiegend eigene Kompositionen, die zugleich dynamisch und geerdet, nostalgisch träumerisch und emotional geladen sind. Die Musiker verweben ihre Stimmen zu einem lyrischen Dialog, in dem der Kern jeder Melodie aufleuchtet. Mit der Seele des Post Bop und der Lebendigkeit der New Yorker Newcomer-Szene begibt sich die Band auf eine musikalischen Reise, inspiriert durch Einflüsse aus Hard Bop, Gospel Klassik und Modern Jazz. In ehrwürdiger Verneigung vor ihren musikalischen Helden entsteht so ein ganz eigener, unverwechselbarer Sound.
