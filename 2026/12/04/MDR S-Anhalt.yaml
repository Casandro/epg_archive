  title: Heute im Osten - Reportage
  subtitle: AKW in Gefahr
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sommer 2026: Eine historische Dürre lässt den Pegel der Donau auf einen gefährlichen Tiefstand sinken - und bringt Ungarns einziges Atomkraftwerk an den Rand des Stillstands. Drei von vier Reaktoren mussten im AKW Paks abgeschaltet werden. "Das gab es noch nie", sagt Kraftwerksmitarbeiter Csaba Jantner. Sinkt der Pegel noch wenige Zentimeter, reicht das Wasser für die Kühlung nicht mehr aus - die vollständige Abschaltung droht. Um die Donau zu stauen, bauen Soldaten und Ingenieure eine gewaltige Sohlschwelle in den Fluss. Csaba Jantner erlebt die Krise hautnah: Werden sie das Kraftwerk retten?'
