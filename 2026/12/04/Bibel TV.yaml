  title: Gottes Häuser
  subtitle: Der St. Patrokli Dom zu Soest
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er gilt als der Inbegriff der Romanik in Westfalen: Der Patrokli-Dom zu Soest. Seit über 1000 Jahren ist das ehemalige Stift tief mit der Entwicklung der westfälischen Stadt Soest verbunden. Die heutige Propsteikirche, die dem Heiligen Patroklus geweiht ist, blickt auf eine bewegte Geschichte zurück. Propst Josef Heers lädt ein zu einer Entdeckungsreise durch Kreuzgang, Museum und Dom.'
