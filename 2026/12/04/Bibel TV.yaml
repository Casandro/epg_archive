  title: Erlebt TV
  subtitle: Die Wahrheit hinter der Fassade - Gewalt in der Ehe
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Katharina Samsons Traum von der perfekten Ehe wird schnell zum Albtraum: Ihr Mann schlägt sie. Als sie schwanger wird und die Situation weiter eskaliert, wird ihr klar, dass sie handeln muss. Dana Goodrum ist beruflich sehr erfolgreich, aber privat klappt es nicht, denn sie schlittert von einer gewalttätigen Beziehung in die nächste. Schließlich sieht sie nur noch einen Ausweg. Angie verlässt nach achtzehn Jahren ihren missbräuchlichen Ehemann und kann endlich das tun, was er ihr verboten hatte. Das ändert ihr Leben von Grund auf. (Moderation: Marzia Plichta / Andreas Waldmann)'
