  title: Drive Thru History - Unterwegs ...
  subtitle: 'durch die Evangelien: Jesus beginnt sein Wirken (5/18)'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er war ein einfacher Zimmermann. Doch kaum ein Mensch hat das Weltgeschehen so beeinflusst wie er: Jesus von Nazaret. In dieser Staffel von Drive Thru History begibt sich Dave Stotts auf die Spuren des außergewöhnlichen Lebens Jesu. Jesus wächst in Nazaret auf und erfüllt damit eine alte Prophezeiung. Aber was ist das für eine politische Welt, deren Bühne Jesus mit dem Beginn seines Wirkens betritt? Wer war Herodes Antipas? Was hat seine Regentschaft mit Jesus und Johannes dem Täufer zu tun? Und wie macht man eigentlich ein "Carbecue"? Auf der Suche nach Antworten braust Dave in einem alten Jeep kreuz und quer durchs Heilige Land und die Evangelien, wie sie die Bibel überliefert.'
