  title: Bibel TV Das Gespräch
  subtitle: 'Désirée Wiktorski: Ich habe mit Gott gerungen'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Ich bin mit Gott in den Ring gestiegen." So spricht Désirée Wiktorski über ihre Glaubenskämpfe. In einer Zeit schwerer Depressionen zweifelte sie an Gottes Versprechen und kapitulierte schließlich vor ihm. Für sie war klar, dass Gott etwas in ihrem Leben verändern müsste. Den Glauben daran hatte sie, die Kraft ging ihr aber aus. Von ihrem Kampf mit Gott und den Waffen des Glaubens berichtet sie im Gespräch mit Moderator Wolfgang Severin.'
