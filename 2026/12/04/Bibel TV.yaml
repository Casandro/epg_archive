  title: Hautnah - Gott mitten im Leben
  subtitle: Jesus hat mein Leben verändert
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Materiell gesehen ging es Hossein Mohassesi gut im Iran. Er war selbstständiger Goldschmied, hatte ein eigenes kleines Unternehmen. Doch er wollte in Freiheit leben, und zwar in Kanada. 2013 verließ er den Iran und kam nach Europa, mit dem Ziel, nach Kanada weiterzureisen. Doch es kam anders. Er lebt nun in Deutschland und Jesus hat sein Leben verändert.'
