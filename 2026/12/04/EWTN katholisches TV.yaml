  title: 'NEU: Medien.Macht.Mensch'
  subtitle: Journalismus - Anspruch und Realität
  description: Robert Rauhut fragt Prof. Michael Meyen in der 5. Folge, was guten Journalismus ausmacht und wie weit die Realität vom Ideal entfernt ist. Michael Meyen spricht über Objektivität, Neutralität und den Wandel hin zu Haltungs- und Aktivismusjournalismus. Im Mittelpunkt stehen Zeitdruck, Klicklogik, Skandalisierung und Moralisierung - aber auch die Frage, welche Bedeutung Transparenz und Vielfalt für einen glaubwürdigen Journalismus heute haben.
