  title: Sabbat - Das Gebot der Freiheit
  subtitle: Jesus und der Sabbat - Heilung als tiefste Erfüllung des Ruhetages
  description: |-
    Hat Jesus den Sabbat abgeschafft - oder seinen ursprünglichen Sinn neu sichtbar gemacht? Paulin Giurgi folgt den Begegnungen Jesu mit dem Sabbat und zeigt, warum es dabei immer wieder zu Konflikten mit religiösen Führern kam. Jesus heilt, richtet Menschen auf und erklärt: "Der Sabbat ist um des Menschen willen gemacht." So wird deutlich: Der Ruhetag soll keine Last sein, sondern Raum für Freiheit, Barmherzigkeit und neues Leben. Die Folge fragt, was Jesu Umgang mit dem Sabbat über Gottes Absicht mit diesem Gebot verrät.

