  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Dr. Benjamin und Lena Zeier: Fünf Kinder, Peru und ein großer Auftrag'
  description: |-
    Was gibt einer Familie die Kraft, ein sicheres Leben hinter sich zu lassen und in Peru Verantwortung für Hunderte Menschen zu übernehmen? Dr. Benjamin und Lena Zeier kennen sich seit dem Kindergarten, haben fünf Kinder und folgen gemeinsam einem Ruf, der ihr Leben verändert. Bei "Diospi Suyana", einem christlichen Missionswerk mit Krankenhaus, Schule und weiteren sozialen Einrichtungen in Peru, tragen sie Verantwortung für Missionare und einheimische Mitarbeitende. Lena prägt das Miteinander, Benjamin bringt seine Erfahrung als Arzt und Führungskraft ein. In dieser Folge erzählen sie, wie sie Entscheidungen treffen, als Familie zusammenhalten und worauf sie vertrauen, wenn die Aufgabe größer ist als sie selbst.

