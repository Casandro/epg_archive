  title: Reminded - Real Stories
  subtitle: Lorraine - Mein Leben mit Angst
  description: |-
    Lorraine lebt in ständiger Anspannung. Die Angst begleitet sie so lange, dass sie sie nicht mehr als Gefühl wahrnimmt, sondern als normalen Teil ihres Lebens. Sie rechnet jederzeit mit dem Schlimmsten - bis ihre größte Befürchtung tatsächlich eintritt. In dieser bewegenden Dokumentation erzählt sie, wie sie lernte, Kontrolle loszulassen, ihrer Angst zu begegnen und Schritt für Schritt neue Hoffnung zu finden. Eine ehrliche Geschichte über Angst, Verlust, Glauben und die Kraft, das Leben wieder anzunehmen.

