  title: Auf den Spuren großer Komponisten
  subtitle: Frédéric Chopin
  description: |-
    Warschau und Paris waren die Städte im Herzen von Frédéric Chopins Welt: er war einer der ersten großen Klaviervirtuosen, und seine Klaviermusik trug dazu bei, einen neuen romantischen Geist in allen Künsten einzuleiten. Obwohl er das kultivierte Leben der französischen Hauptstadt schätzte, erschütterte die wilde und leidenschaftliche Musik, die aus seiner Liebe zu seinem Heimatland erwuchs, sein Publikum bis ins Mark.
    Diese Folge bietet einen Platz in der ersten Reihe für intime Aufführungen vieler der beliebtesten Klavierwerke von Chopin.
