  title: Cliff!
  subtitle: Angenommen, nur angenommen
  description: |-
    Cliff Goldstein hinterfragt die gängige wissenschaftliche Erklärung für den Ursprung des Lebens und stellt ihr die biblische Schöpfungsgeschichte gegenüber. Anhand alltäglicher Beispiele wie einer Erdbeere zeigt er, warum er Komplexität und Schönheit der Natur nicht für Produkte blinden Zufalls hält. Er argumentiert, dass moderne Evolutionstheorien logische Widersprüche enthalten und letztlich ebenfalls auf Glaubensannahmen beruhen. Für Goldstein liefert die Bibel mit ihrem Bericht von einer absichtsvollen, göttlichen Schöpfung die schlüssigere und hoffnungsvollere Erklärung für den Ursprung des Lebens.

