  title: GRANDIOS
  subtitle: 'Janine Berger über Olympia und Druck: Fliegen, fallen, aufstehen'
  description: |-
    In Günzburg trifft Tobias Liminski eine der bekanntesten Sportlerinnen des deutschen Kunstturnens. Mit fünf Jahren begann sie, mit 16 stand sie bei den Spielen 2012 im Finale und verpasste Bronze durch eine Fehlentscheidung. Sie erzählt von Verletzungen, acht Knieoperationen und einer Mentalität, die nach jedem Rückschlag wieder aufsteht.

    Dann wird es persönlich: Als der Leistungsdruck sich vom Können auf das Körpergewicht verlagerte, rutschte sie unbemerkt in Bulimie und Depression. Ein offenes Gespräch über ein Tabuthema und darüber, warum es Mut braucht, über seelische Erkrankungen zu sprechen.

    Weitere Infos unter: www.hopetv.de
