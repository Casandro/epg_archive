  description: |-
    Die Albulabahn zählt seit 2008 zum UNESCO-Weltkulturerbe. Schon seit über 120 Jahren ist sie Verkehrs- und Lebensader zwischen Thusis und dem mondänen St. Moritz.

    Entlang des Wildbachs Albula geht es durch die spektakuläre Schynschlucht, eine uralte Nord-Süd-Verbindung zwischen Mittelmeer und Nordeuropa, die schon Kelten und Römer begingen. Auf die Passagiere wartet eine Reise der Superlative.
