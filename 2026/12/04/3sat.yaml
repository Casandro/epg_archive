    In Parks kann man die Natur hautnah erleben. Unerwartete Bewohner wie Feldhamster, Schildkröten und eine reichhaltige Vogelwelt lassen sich entdecken. In der Dokumentation erzählen Sachkundige vom geheimen Leben der Tiere und wie sie erforscht werden.
