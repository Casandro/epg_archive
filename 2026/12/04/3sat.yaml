    Die Lobau, der "Wasserwald", liegt im Osten Wiens und ist Teil des Nationalparks Donau-Auen. Es ist eines der letzten intakten Auengebiete Europas und auch eines der verletzlichsten.

    Die einzigartige Wildnis ist nicht nur das Rückzugsgebiet zahlreicher vom Aussterben bedrohter Tier- und Pflanzenarten, sie ist auch ein Naherholungsraum einer Millionenstadt. So braucht es neben Schutzmaßnahmen engagierte Fachleute, um das Naturjuwel zu erhalten.
    HD-Produktion
