  audiodesc: true
  description: |-
    USA 2025
    Ob in Bergen, Wäldern oder Tundra - überall auf der Nordhalbkugel der Erde finden sich Braunbären. Kälte macht ihnen wenig aus - sie bringen sogar mitten im Winter ihre Jungen zur Welt.

    Der Film zeigt Entwicklungsgeschichte und Erfolgsgeheimnisse der Braunbären sowie deren flexible Ernährung. Sie fressen zwar gern Fisch und Fleisch, können sich aber dank eines angepassten Verdauungssystems auch pflanzlich ernähren, anders als andere Raubtiere.
