  title: Der wilde Norden Sumatras
  subtitle: Dschungeltour zu den Orang Utans
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sumatra, eine indonesische Hauptinsel, ist die sechstgrößte Insel der Welt. Sie erstreckt sich über 1700 Kilometer von Nordwest nach Südost und ist bis zu 370 Kilometer breit.

    Der Äquator überquert die Mitte der Insel. Sumatra ist größtenteils von tropischem Regenwald bedeckt, der 2004 in die Liste des UNESCO-Weltnaturerbes aufgenommen wurde. Entsprechend viel gibt es zu entdecken. Der Film lädt zu einer Reise durch den Norden ein.
    HD-Produktion
