  description: |-
    Die Wengernalpbahn lädt zu einer spektakulären Reise an den Fuß des berühmtesten Dreigestirns der Alpen ein: Eiger, Mönch und Jungfrau.

    Als mit 19 Kilometern längste durchgehende Zahnradbahn der Welt fungiert sie als unverzichtbare Lebensader für die Region. Vom mystischen Lauterbrunnental führt sie hoch über den Wintersportort Wengen und die Wengernalp bis auf über 2000 Meter über dem Meer.
