  description: |-
    Reportage, Deutschland 2026
    Der Wunsch nach dem perfekten Körper ist allgegenwärtig. Schlank, makellos, groß, muskulös - Schönheitsideale bestimmen zunehmend den Alltag junger Menschen.

    Immer mehr Frauen und Männer investieren Zeit, Geld und manchmal sogar ihre Gesundheit, um diesen Idealen näherzukommen. Die "ZDF.reportage" begleitet Menschen, die bereit sind, für ihr äußeres Erscheinungsbild weit zu gehen.
