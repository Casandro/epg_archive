  audiodesc: true
  description: |-
    Deutschland 2026
    Trotz Hightech- und Spitzenmedizin sind in Deutschland jedes Jahr circa 170.000 Menschen von Behandlungsfehlern im Krankenhaus betroffen. Rund 17.000 bezahlen dafür mit ihrem Leben.

    Ursachen können Sepsis, Resistenzen, Fehldiagnosen oder falsche Medikamente sein. Jasmina Neudecker macht sich auf die Suche: Wie kann es sein, dass ausgerechnet Krankenhäuser so häufig krank machen, und was kann die Forschung dazu beitragen, um Risiken zu verringern?
