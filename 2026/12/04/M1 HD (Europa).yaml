  title: A peleskei nótárius
  subtitle: '(magyar tévéf., 1975)  A peleskei nótáriushoz állami hivatalnok érkezik: Fátermörder Jonatán a császár parancsát hozza, mely szerint be kell záratni az összes magyar iskolát. A... '
  description: 'tisztességben megőszült nótárius Budára utazik, hogy méltóságos kormányhivatalnokokra ráborítsa az asztalt. Eközben persze időt szakít a fővárosban tanuló fiára, Sándorra is, aki állítólag belehabarodott valami fehérszemélybe...A Peleskei nótárius a magyar humor egyik hagyományossá vált tipikus alakja, melyet Gvadányi József gróf teremtett meg az 1790-ben megjelent szatirikus verses elbeszélésében. A nótárius az ősi erkölcsökhöz ragaszkodó, szűk látókörű, a világtól kissé elmaradt, de egészséges észjárású és romlatlan falusi magyar ember képviselője, aki a fővárosi élet modern viszonyai közé jutva, szembeszáll az ő világnézetével ellenkező viszonyokkal, s ósdiságával egyrészt kissé komikussá lesz, de másrészt rokonszenvessé is, amikor a művelődéssel könnyen velejáró idegenszerűséget és léhaságot korholja a korabeli Magyarországon. Gvadányi műve után készült Gaál József azonos című bohózata 1838-ban, mely mindeddig legjobb és legnépszerűbb bohózatunk.  rendező:  Kalmár András szereplő(k): Nagy Zajtai István, nótárius: Páger Antal Hoffer úr: Bilicsi Tivadar Páter Mörder Jonatán: Garas Dezső Tóthi Dorka: Béres Ilona Hoffer Fánika: Borbás Gabriella'
