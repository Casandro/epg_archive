  title: Unsere Tipps - Ausflugs-Highlights im Westen
  subtitle: Ein Film von Maike van Galen und Brigitte Büscher
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    "Geheimnis Hohenzollernbrücke" ist ein Film, der die über 100-jährige Geschichte der Brücke bis heute zeigt: den Traum der Kaiser und Könige von der Überfahrt des Rheins zum Kölner Dom, die Zerstörung der Brücke im Zweiten Weltkrieg und die Gegenwart.
    Heute ist die Brücke eine der schönsten und wichtigsten Eisenbahnbrücken im Westen - ein Nadelöhr für Züge, Fußgänger und Fahrradfahrer.
