  title: Baumeister der Republik
  subtitle: Alois Mock - Der österreichische Europäer
  description: |-
    Alois Mock gilt als zentraler Baumeister des österreichischen EU-Beitritts. Als Außenminister begleitete er die österreichische Republik auf dem langen Weg nach Europa. In seiner Rolle der österreichischen Delegationsleituntung verhandelte er in Brüssel an vorderster Stelle, in der Schlussphase 80 Stunden am Stück, nächtelang. Aufopferungsvoll engagierte sich Alois Mock für die Integration in die Europäische Gemeinschaft. Der 12. Juni 1994, nur zwei Tage nach seinem 60. Geburtstag, wurde zum Höhepunkt in der politischen Karriere des Außenministers: 65,58% der Österreicherinnen und Österreicher stimmten für den EU-Beitritt. Mocks Ziel war erreicht.
    Die politische Karriere Alois Mocks begann 1969 als Unterrichtsminister im Kabinett von Josef Klaus. Zwei Jahre später wurde er zum Obmann des ÖAAB, dem Arbeitnehmerbund der ÖVP, und als solcher wortgewaltiger Oppositionspolitiker in den Kreisky-Jahren. 1979 rückte Mock in die erste Reihe auf, wurde Bundesparteiobmann der Volkspartei und ernstzunehmender Anwärter auf das Kanzleramt. Doch sowohl die Wahlen 1983 als auch 1986 gingen verloren. Mock wurde Vizekanzler und Außenminister. Die Rolle als Österreichs erster Diplomat füllte ihn gänzlich aus. Es waren turbulente Zeiten. Parallel zu den beginnenden EU-Beitrittsverhandlungen kollabierte die Sowjetunion und mit ihr die kommunistischen Nachbarn Österreichs. Die Bilder vom Abbau des Grenzzauns zwischen Österreich und Ungarn gingen um die Welt. Und im Süden forderte der 1991 ausgebrochene Jugoslawienkrieg das diplomatische Geschick des österreichischen Außenministers.
  genre:
  - '129'
