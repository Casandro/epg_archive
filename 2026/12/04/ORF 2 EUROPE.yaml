  title: Fit mit den Stars
  subtitle: Nico Langmann
  description: "Von 30. November bis 4. Dezember ist Nico Langmann als Vorturner bei \"Fit mit den Stars\" dabei. \nDer österreichische Rollstuhltennisspieler und Paralympics-Teilnehmer zählt zu den Besten seiner Sportart. Rund um den Internationalen Tag der Menschen mit Behinderungen am 3. Dezember setzt er ein starkes Zeichen für Inklusion, Selbstbestimmung und Lebensfreude. Mit seinen Übungen und seiner ansteckenden positiven Energie motiviert Nico Langmann das Publikum zum Mitmachen und zeigt eindrucksvoll, wie Sport Barrieren überwinden, Menschen verbinden und Freude an Bewegung vermitteln kann."
