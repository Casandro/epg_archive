  title: Universum History
  subtitle: Europas tödliche Grenze - Tragödien am Eisernen Vorhang
  description: "Es war der gefährlichste Ort im Kalten Krieg: Die Grenze zwischen der CSSR auf der einen und der BRD und Österreich auf der anderen Seite. Zwischen 1945 und 1989 kamen mehr als 1000 Menschen auf den rund 800 Kilometern ums Leben, weit mehr als an der Berliner Mauer. Damit hält dieser Teil des Eisernen Vorhangs den traurigen Rekord als tödlichster Grenzabschnitt. \nDer Film erzählt die Geschichte eines mörderischen Bollwerks aus tiefen Gräben, stromgeladenem Stacheldraht und Zäunen, schießwütigen Soldaten und mutigen Flüchtenden. Aber auch die Todeszahl unter Soldaten ist höher als anderswo, sie fielen Minen zum Opfer oder verübten Selbstmord. Die Flucht in den Westen ist für viele der letzte verzweifelte Ausweg - um den Diktaturen und der Enge ihrer Heimat zu entkommen, riskieren sie ihr Leben. Die Fluchtmittel sind vielfältig: Mit einer selbstgebastelten Abseil-Hilfe über die Stromleitung, mit dem LKW durch die Zäune, wie die Maulwürfe unter der Grenze hinweg. Nur wenige schaffen es in den Westen. Heute sind die Fälle wieder aktuell. Nach intensiver Aktenforschung bringt die NGO Platform of European Memory and Conscience mehrere solcher Fälle bei der tschechischen und der deutschen Staatsanwaltschaft zur Anzeige, um späte Gerechtigkeit zu erkämpfen. \nDie Doku zeichnet die spektakulärsten und zugleich tragischsten Fluchtversuche, unter Einbindung der neuesten Erkenntnisse aus den Ermittlungen und der Geschichtswissenschaft, nach. \nBuch und Regie: Oliver Halmburger"
  genre:
  - '129'
