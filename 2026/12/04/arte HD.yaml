  description: |-
    Die Konfrontation mit seinem ehemaligen Fußballtrainer, der ihn als Kind sexuell missbraucht hat, stürzt Frank in eine Lebenskrise. Er hatte sich nie jemandem anvertraut. Nun vernachlässigt er seine Arbeit als Unternehmensberater, nimmt heimlich Medikamente und wird von Panikattacken heimgesucht.
