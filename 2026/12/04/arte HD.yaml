  title: Europas hoher Norden
  subtitle: Westschweden und Vänersee
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Der Sage nach erschuf ein Riese Schwedens größten See, den Väner: Im Zorn riss er eine Scholle aus dem Ackerboden. Das Loch füllte sich mit Wasser und misst heute fast 6.000 Quadratkilometer. Am Ostufer des Väners liegt Mariestad. Hier findet man gleich mehrere Schleusen zum Göta-Kanal, der zusammen mit dem Göta-Fluss und dem Trollhätte-Kanal Göteborg mit Stockholm verbindet - über eine Strecke von fast 400 Kilometern und unter Überwindung von rund 90 Höhenmetern und 58 Schleusen quer durch Schweden. Vom Väner geht es zum Vättern, Schwedens zweitgrößtem See und weiter entlang der schwedischen Westküste Richtung Norden.'
