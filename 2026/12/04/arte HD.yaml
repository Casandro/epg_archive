  description: A23a ist der Codename eines der größten und ältesten Eisberge der Welt. 2025 driftet er seit 39 Jahren durchs Meer. Dann steuert er auf eine Insel zu, die vielen Vogel- und Meeressäugetierarten als Lebensraum dient. Die Crew eines kleinen Segelschiffs ist auf der Suche nach A23A, um die Folgen des Abschmelzens des fast eine Billion Tonnen schweren Süßwasser-Eismassivs zu untersuchen.
