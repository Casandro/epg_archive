  description: Kapuzineräffchen Sina ist bereits ein Jahr alt und macht in letzter Zeit große Schritte in Richtung Unabhängigkeit. Die kleine Handaufzucht muss sich endlich von ihren menschlichen Ziehvätern lösen und wird deshalb das erste Mal mit einem anderen Affenmädchen aus ihrer Familie zusammen gelassen. Die Tierpfleger sind gespannt, wie die Begegnung ausfallen wird. Auch das kleine Chaco-Pekari besucht zum ersten Mal seine Angehörigen. Da die älteren zwei Halbgeschwister dem Pekari-Jungen bereits kurz nach der Geburt die Muttermilch streitig gemacht haben, lebt das Flaschenkind bislang getrennt von der Nabelschweinfamilie.
