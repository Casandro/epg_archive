  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: "Podcast\nNicht Mehr Mein Land - In der Manosphere \nSo wirst Du Diktator! (2/5)\nAli trifft den \"Tiktok-Guru der AfD\", Erik Ahrens. Der hat dafür gesorgt, dass AfD-Politiker klingen wie Gurus der Manosphere. Dann wurde Erik selbst der AfD zu rechts. Ali erlebt, wie Erik seine Meinungen und Sprachen wechselt und fragt sich: Was kann man ihm wirklich glauben?\nVon Alexander Gutsfeld, BR 2026\n\nNicht Mehr Mein Land - In der Manosphere\nSo schlägst Du zurück! (3/5)\nFrauen werden in dem einflussreichen Manosphere-Podcast \"Fresh and fit\" bewertet und runtergemacht. Wer macht da mit und warum? Und was passiert hinter den Kulissen? Ali trifft Frauen, die den Podcast wütend verlassen haben - und welche, die wieder hingehen würden.\nVon Alexander Gutsfeld, BR 2026\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
