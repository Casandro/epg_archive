  description: |-
    Niklas und Elias haben es nicht leicht mit Eric und Carola Moltke. Eric kommt, zum Ärger seiner Mutter auf den letzten Drücker, zu einer Routinebehandlung ins JTK. Doch zu dieser kommt es nicht, denn Eric bricht noch vor dem Klinikum zusammen! Seine Mutter ist außer sich vor Sorge!
