  description: Die Pfleger des Opel-Zoos in Kronberg machen sich Sorgen um ihr Lisztäffchen-Weibchen. Seit langem ist sie schon alleine und fühlt sich einsam. Damit sich das ändert, machen sich die Pfleger auf den Weg in den Vogelpark nach Herborn, um dort ein neues Lisztäffchen-Weibchen abzuholen, auch dieses Äffchen lebt alleine. Werden sich die beiden einsamen Äffchen verstehen? So nah kam Praktikantin Claudia Müller den Nashörnern noch nie. Gemeinsam mit Tierpfleger Benjamin Schröder darf sie heute Kalusho und Tsororo füttern und sogar anfassen ...
