  description: |-
    Wäre Friedrich Merz ein Fußballer, würde man ihn öfter auf die Bank setzen, sagte im Sommer der Philosoph Peter Sloterdijk, einer der einflussreichsten Intellektuellen Deutschlands. Denn das Verhältnis zwischen Geist und Macht ist schon seit Konrad Adenauer die "Geschichte einer unbequemen Beziehung", so der Untertitel des aktuellen Werkes des Literaturwissenschaftlers und Hochschullehrers Dr. Peter-André Alt.
    In "Thadeusz lang & breit" spricht Jörg Thadeusz mit ihm über die einzelnen Kanzler und warum Intellektuelle heute in der Politik weniger gehört werden.
