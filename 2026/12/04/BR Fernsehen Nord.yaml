  description: 'Musikerin und Schauspielerin Rubi verbindet Pop und Rap zu einem Sound, der direkt aus der Lebenswelt ihrer Generation spricht - zwischen Selbstbehauptung, Druck und Identitätssuche. In "Rubi in 60 Sekunden" beantwortet sie schnelle Fragen mit überraschender Offenheit: Sie reflektiert Gen-Z-Klischees, spricht über ihre Erfahrungen im Musikbusiness und gibt konkrete Ratschläge an Artists am Anfang ihrer Laufbahn. Neben klaren Statements zeigt sie auch ihre persönliche Seite - von der teuersten Maniküre ihres Lebens bis hin zu ihrem großen Traum, einmal nach Tokio zu reisen.'
