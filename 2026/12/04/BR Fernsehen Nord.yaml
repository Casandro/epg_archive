  description: Oklahoma, 1906. Der verwitwete Farmer Henry McCarty führt ein einfaches Leben, schwört auf die Bibel und hält wenig von Schießkünsten. Als Henry auf seinem Land den schwer verletzten Curry und eine Ledertasche voller Dollarnoten findet, bringt er den bewusstlosen Unbekannten auf seine abgelegene Farm. Schon bald tauchen drei Männer auf, die sich als Sheriffs ausgeben und nach dem angeblichen Outlaw suchen. Zwar gelingt es Henry, die Verfolger abzuwimmeln, aber er weiß, dass die bewaffneten Reiter wiederkommen werden. Da ein Kampf immer unvermeidbarer wird, versucht er aus Curry die Wahrheit über ihn und das Geld herauszuholen.
