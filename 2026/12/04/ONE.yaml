  description: "Ausstrahlung auch im englischen Originalton\n\nMarlott macht sich mit Leichendieb Pritty auf zu dem vereinbarten Treffen mit den Auftragsmördern. Sie gelangen in die Tunnel unter dem Smithfield-Markt, die von der Kneipe \"The Fortune of War\" bis zum St.-Bartholomew's-Hospital führen. Marlott gibt sich als potentieller Kunde aus und gibt vor, ein gerade verstorbenes Mädchen zu benötigen, dass er selbst beim nächsten Treffen identifizieren wird. \n\nMarlott plant, Flora als Köder für die Bande der Auftragsmörder einzusetzen - sehr zum Missfallen Nightingales, der sich in Flora verliebt hat."
