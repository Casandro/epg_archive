  description: 'Timmon und seine Eltern haben eine Diagnose-Odyssee durchlebt, bis klar wurde: der Fünfjährige ist am Dup15Q-Syndrom erkrankt - eine von rund 8000 seltenen Krankheiten, an denen in Deutschland rund vier bis fünf Millionen Menschen leiden. Für unzählige Betroffene bleibt die Krankheit namenlos - und eine Therapie oft unerreichbar. Beleuchtet werden berührende Lebenswege von Betroffenen.'
