  description: |-
    Nicht nur in der Schule gibt es Sachtexte, wie den Praktikums- oder Unfallbericht. Auch in den Medien sind Sachtexte überall zu finden, vor allem wenn es darum geht, dass die Zuschauer, User oder Leser informiert werden sollen.

