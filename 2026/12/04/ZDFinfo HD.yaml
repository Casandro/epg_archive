- eventId: 817409
  start: 2026-12-04T00:10:00Z
  stop: 2026-12-04T00:55:00Z
  title: Panzer!
  subtitle: Der Erste Weltkrieg
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2017
    Der Panzer ist eine Idee, so alt wie der Krieg. Welcher Soldat wünscht sich nicht, unverwundbar zu sein, beweglich - und trotzdem kämpfen zu können?

    Anlässlich des 100. Jahrestages der ersten großen Panzerschlacht am 20. November 1917 begibt "Panzer!" sich auf die Spur dieser Idee - von den Ursprüngen bis heute - und wagt einen Blick in die Zukunft.
    HD-Produktion
- eventId: 817410
  start: 2026-12-04T00:55:00Z
  stop: 2026-12-04T01:40:00Z
  title: Panzer!
  subtitle: Der Zweite Weltkrieg
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2017
    Der Panzer ist die prägende Waffe des 20. Jahrhunderts. Entworfen aus den Erfahrungen der Grabenkämpfe des Ersten Weltkrieges, wurde er im Zweiten Weltkrieg zum entscheidenden Faktor.

    Doch die Wirklichkeit für die Panzerbesatzungen der kriegsführenden Nationen war weit entfernt von den heroisierenden Darstellungen der Propaganda. Qualvolle Enge, Angst und ohrenbetäubender Lärm prägten den Dienst in den stählernen Kolossen.
    HD-Produktion
- eventId: 821253
  start: 2026-12-04T01:40:00Z
  stop: 2026-12-04T02:25:00Z
  title: Panzer!
  subtitle: Werkzeug der Unterdrückung
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2017
    Im Kalten Krieg müssen sich Panzer mit Waffen wie Raketen und Atombomben die Hauptrolle teilen. Doch kaum ein anderes Kriegsgerät wirkt so furchteinflößend wie ein rollender Panzer.

    Obwohl in Schlachten leicht angreifbar, sind Panzer im Kalten Krieg ein wichtiger Teil der Abschreckungsstrategie. Doch die rollenden Ungetüme dienen häufig der Unterdrückung von zivilem Ungehorsam und werden nicht selten auch gegen die eigene Bevölkerung eingesetzt.
    HD-Produktion
- eventId: 821254
  start: 2026-12-04T02:25:00Z
  stop: 2026-12-04T03:10:00Z
  title: Panzer!
  subtitle: Gefecht und Geschäft
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2017
    9. November 1989 - der Mauerfall. Der dritte Weltkrieg mit knapp 100.000 Panzern in Ost und West fällt aus. Wohin mit all den Panzern? Und wie entsorgt man überhaupt Panzer?

    Nach zahlreichen Konflikten stellt sich immer wieder die Frage: Ist das Zeitalter der Panzer vorbei? Hat diese Waffengattung eine Zukunft? Mai 2014: Wie aus dem Nichts stellt Russland den völlig neuen Panzer T-14 vor. Beginnt nun erneut ein Panzer-Wettrüsten?
    HD-Produktion
- eventId: 828257
  start: 2026-12-04T03:10:00Z
  stop: 2026-12-04T03:55:00Z
  title: Kriegsschiffe - Tod auf See
  subtitle: Stahlmonster
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Ende des 19. Jahrhunderts ändert sich die Welt der Kriegsschiffe radikal: Stahl statt Holz. Dampfmaschinen ersetzen Segel. Bald zieht ein Krieg auf, wie die Welt ihn noch nie gesehen hat.

    An Bord der Schiffe dieser Zeit fahren Matrosen und Offiziere zur See, stellen sich dem Feind und hoffen auf heile Rückkehr. Es ist die Zeit zwischen 1864 und 1918. Der Film zeigt die größte Seeschlacht des Ersten Weltkrieges und den uneingeschränkten U-Boot-Krieg.
    HD-Produktion
- eventId: 828258
  start: 2026-12-04T03:55:00Z
  stop: 2026-12-04T04:40:00Z
  title: Kriegsschiffe - Tod auf See
  subtitle: Jäger und Gejagte
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Kaum ist der Erste Weltkrieg vorbei, kündigt sich ein neuer an, der auch auf den Ozeanen geführt wird. Die Ära der Schlachtschiffe endet. Flugzeugträger werden zum neuen Machtsymbol der Meere.

    Nationen setzen ihre Zukunft in Seeschlachten aufs Spiel. Sie kämpfen unter Wasser, auf dem Meer, in der Luft. Kriegsschiffe sind am Ausbruch des Zweiten Weltkrieges beteiligt. An Bord eines Kriegsschiffes wird schließlich auch das Ende des Krieges besiegelt.
    HD-Produktion
- eventId: 828259
  start: 2026-12-04T04:40:00Z
  stop: 2026-12-04T05:25:00Z
  title: Kriegsschiffe - Tod auf See
  subtitle: Das Atomzeitalter
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Mit dem Ende des Zweiten Weltkrieges steht die Zukunft der Kriegsschiffe selbst auf dem Spiel: Der Einsatz von Atombomben stellt den grundsätzlichen Nutzen von Kriegsschiffen infrage.

    Atomenergie ist mehr als nur eine Waffe: Nuklear betriebene Schiffe erreichen Reichweiten und Geschwindigkeiten wie nie zuvor. U-Boote mit nuklearem Antrieb können nahezu unbegrenzt operieren. Und unsichtbar bleiben, bis sie die Raketen und Torpedos abfeuern.
    HD-Produktion
- eventId: 828260
  start: 2026-12-04T05:25:00Z
  stop: 2026-12-04T06:10:00Z
  title: Kriegsschiffe - Tod auf See
  subtitle: Ungleiche Gegner
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2021
    Der Kalte Krieg ist vorbei. Nur eine Supermacht ist noch übrig, die USA. Bisher kämpften Schiffe gegen Schiffe. Doch was passiert, wenn neue Feinde mit traditionellen Regeln brechen?

    Im Zeitalter der asymmetrischen Kriegsführung kämpfen aufständische Gruppen gegen Nationen. Technologie ist das Mittel gegen Terrorismus. Neue Mächte steigen auf, alte werden wiedergeboren. U-Boot-Roboter und Drohnen lassen die Zukunft der Kriegsschiffe erahnen.
    HD-Produktion
- eventId: 828262
  start: 2026-12-04T06:10:00Z
  stop: 2026-12-04T06:55:00Z
  title: ZDF-History
  subtitle: Pearl Harbor
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2016
    Am 6. Dezember 1941 griffen japanische Flugzeuge die US-Flotte in Pearl Harbor an und versenkten die "USS Arizona". Jetzt konnten Spezialkameras erstmals das Innere des Wracks filmen.

    Die spektakulären Aufnahmen rekonstruieren aus einer ganz neuen Perspektive die dramatischen Stunden des Angriffs, der Weltgeschichte schrieb. Er führte zu Amerikas Eintritt in den Zweiten Weltkrieg und damit letztlich zur Niederlage Japans und Deutschlands.
    HD-Produktion
