  title: 'Moin! Schleswig-Holstein - Von Binnenland und Waterkant: Niederdeutsches Hörspiel'
  subtitle: Jan un Lene
  description: "Von Johann Diedrich Bellman\nRegie: Jochen Schütt\nRB/NDR 1995\n\nEigentlich ist es eine ganz einfache Liebesgeschichte, aber die kompromisslose Klarheit und Unbedingtheit, mit der Jan und Lene ihre Gefühle, ihre Überzeugungen und ihre moralischen Grundsätze leben, hebt sie über den Alltag hinaus.  \n \nIn einem unauffälligen Dorfkrug in Norddeutschland spielt sich eine Begegnung ab, deren Motive und deren treibende Kräfte den Ursprung dessen berühren, was Künstler seit Beginn der Geschichte bewegt hat."
