  description: 'Autor: Martin Novotný; Interpret: Daniel Kfelíř, Martin Novotný * Hostem Oktávy bude mladý český operní pěvec Daniel Kfelíř, který je od roku 2023 sólistou opery a operety Moravského divadla Olomouc. Působí také na mnoha významných českých scénách (Národní divadlo a Státní opera v Praze, Národní divadlo Brno, Národní divadlo moravskoslezské). Stal se také nositelem ocenění na mnoha pěveckých soutěžích (Mezinárodní pěvecká soutěž Antonína Dvořáka v Karlových Varech, Mezinárodní soutěž Mikuláše Schneidera-Trnavského v Trnavě). Pořad připravil a moderuje Martin Novotný.'
