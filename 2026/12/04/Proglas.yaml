  title: Večerní zíváček
  subtitle: František a jesličky - I bezcenná věc může být cenná (4. díl)
  description: 'Autor: časopis Duha; Interpret: Václav Ambrož; Premiéra: 4.12.2018 * Tři prkna, co byly pro truhláře Sebastiána k vyhození, pro Františka byly přesně to pravé. Každý vidíme cenu věcí jinak.  Na to nejcennější dohlédne jen ten, e byla cenná. Kolik najdete opravdu nevyužitelných věcí?Zkus se podívat kolem sebe. Co už pro tebe nemá cenu ? stará hračka, knížka. Přemýšlej, kdo a kde by ji ještě využil? Dokážeš jednu ze svých hraček darovat někomu, o kom víš, že by si ji přál?'
