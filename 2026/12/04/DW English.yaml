  title: Bad Banker
  subtitle: Confessions of a Money Launderer
  description: |-
    Money laundering is a lucrative business — for the launderers and for their clients. You can't just deposit money from drug dealing, for instance, into any bank account. But there are ways to make what's known as dirty money usable again. Laundering allows money from illicit activities to be funneled back into the legitimate economy. Among other methods, it can be done through shell companies, real estate purchases or cryptocurrency transactions.
    Money launderers find ways to make criminal proceeds appear clean: The money is invested, deposited and withdrawn again. It's all illegal, of course. Not least because no taxes get paid. Money launderers also face risks — money is not allowed to be lost. Anyone thinking they can pocket someone else's money can pay a high price — sometimes even with their life.
    It's estimated that 2% to 5% of global gross domestic product is laundered — amounting to trillions of euros worldwide every year. The damage that causes to governments and society can only be guessed at: Experts believe billions of euros are likely being defrauded.
    In most countries, money laundering is a criminal offense. Germany has a money laundering act that governs their prevention work. Banks, insurers, real estate agents, attorneys, notaries and providers of cryptocurrency services are all required to report suspicious transactions. At the same time, criminals work to exploit differences between national regulatory and oversight systems. The European Union has established the Anti-Money Laundering Authority (AMLA) to coordinate European efforts to combat money laundering. The new agency will operate across borders and strengthen cooperation among national authorities.
  widescreen: true
