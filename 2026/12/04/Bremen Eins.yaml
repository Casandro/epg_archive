  title: Musikclub 90er
  description: 'Die 90er waren ein musikalischer Flickenteppich: Während in Seattle der Grunge den Rock revolutionierte, brachten Boybands und Girlgroups eingängige Pop-Hits auf die Bühne. Techno und Eurodance ließen die Clubs beben, während Hip-Hop vom Underground in die Charts aufstieg. Britpop feierte mit Oasis und Blur große Erfolge, während Alanis Morissette und Radiohead neue Wege im Alternative Rock beschritten. Die Musikwelt wurde vielfältiger, experimenteller - und manchmal auch ziemlich verrückt. Im Musikclub 90er nehmen wir euch mit auf eine Reise durch dieses turbulente Jahrzehnt.'
