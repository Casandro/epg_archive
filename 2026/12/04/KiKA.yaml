  description: |-
    Henrik im Waldkindergarten

    Henrik ist fünf Jahre alt und gehört zur Waldgruppe seines Kindergartens. Der Wald ist ein riesiger Spielplatz für die Kinder. Bei fast jedem Wetter sind sie dort unterwegs. Im Wald kennt Henrik sich schon gut aus: Er weiß, wie man sich dort verhalten muss und entdeckt immer wieder etwas Neues. Besonders im Herbst gibt es für Henrik viel zu entdecken und so manchen Schatz zu sammeln.
    Regie: Jennifer Gesslein
