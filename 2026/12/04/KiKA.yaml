  description: |-
    Generalprobe

    Chiara ist mit ihrer neuen Aufgabe im Theatermodul überfordert. Die Generalprobe für den bevorstehenden Wettbewerb läuft ziemlich aus dem Ruder. Nicht zuletzt wegen Nesrin und Annika. Die beiden haben einen fesselnden Plan, der dank Prank-Master Hermann ein voller Erfolg wird. Hermann ahnt wiederum nicht, bei was er den beiden hilft. Pawel hat immer noch Angst, vergessen zu werden, bis Sibel und Badu ihm klarmachen: das wird niemals geschehen!
