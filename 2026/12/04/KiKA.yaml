  description: |-
    Plötzlich Schwestern

    Lena und Romy erfahren etwas Unglaubliches: Sie haben einen gemeinsamen Vater. Lena ist irritiert und beschließt, sich vorerst nur auf die bevorstehende Ballettvorführung zu konzentrieren.

    Die Konkurrenz unter den Ballettschülern ist groß. Denn nicht alle können eine Rolle in Armandos Traumszene des "Nussknackers" bekommen. Offen ist, ob letztlich Armandos moderne oder Madame Carrés traditionelle Version für die Pariser Oper ausgewählt wird.

    Ines und Frank kommen sich näher und das obwohl sie nur über den Briefkasten im Schornstein und über eine große Zeitdifferenz hinweg miteinander kommunizieren können. Beim Tüfteln über Strategien gegen die Zeitreisenbehörde entdecken sie überraschenderweise viele Gemeinsamkeiten.Isaac möchte sich gerne wieder mit Jeff versöhnen. Aber Jeff ist nicht so schnell bereit Isaac zu verzeihen, dass er ihm die Rolle des Prinzen weggeschnappt hat. Er lässt Isaac ein bisschen zappeln und macht sich einen Spaß daraus, den Beleidigten zu spielen.
    Darsteller:
    Lena Grisky - Jessica Lord
    Ines Lebreton - Eubha Akilade
