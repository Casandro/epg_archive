  title: WDR 3 Konzert
  subtitle: Benjamin Britten zum 50. Todestag
  description: "Seine Musik ist klar und doch nuancenreich. Das macht die Werke von Benjamin Britten, der am 4. Dezember 1976 in Suffolk gestorben ist, so unvergleichlich. Der estnische Komponist Arvo Pärt würdigte seinen englischen Kollegen - dem er nie persönlich begegnet ist - mit einem \"Cantus\". Britten selbst erkundete nächtliche Sphären in seinem Nocturne und der  Serenade, in dem Tenor und Horn die Protagonisten auf einer Reise durch Dunkelheit und Traum sind. Sergei Prokofjews vor Virtuosität sprühende \"Symphonie classique\" führt schließlich zurück ins Licht. \n<strong>Arvo Pärt<br/></strong>Cantus in Memoriam Benjamin Britten\n<strong>Benjamin Britten<br/></strong>Nocturne op. 60<br/>Serenade für Tenor, Horn and Steicher op. 31\n<strong>Serge Prokofiev<br/></strong>Sinfonie Nr. 1 D-Dur op. 25 (\"Klassische\") \n<strong>Ian Bostridge</strong>, Tenor<br/><strong>Rodrigo Ortiz Serrano</strong>, Horn <br/><strong>Münchner Rundfunkorchester</strong> <br/>Leitung: <strong>Gemma New</strong> \nAufnahme vom 18. Januar 2026 aus dem Prinzregentheater, München\nModeration: Ulrike Froleyks<br/>Redaktion: Dr. Michael Breugst"
