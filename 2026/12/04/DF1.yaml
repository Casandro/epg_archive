  title: BABYS DER WILDNIS
  subtitle: Die Langsamsten
  description: |-
    BABYS DER WILDNIS
    Die tierische Top 10 der Natur - überraschend, herzerwärmend und wild! Aus der Masse herauszustechen ist schwer, besonders im Tierreich. Bei schätzungsweise 8,7 Millionen Arten, die um Aufmerksamkeit wetteifern, müssen die zahlreichen Anwärter alles geben, um es in die Top-10-Listen zu schaffen. Aber es gibt eine Gruppe, die einen unfairen Vorteil hat: Tierbabys. Diese Serie zelebriert die Wunder des Tierreichs und ist ein Muss für alle Naturliebhaber.
    Die Langsamsten
    Sie sind faul, energieeffizient und immer langsam. Von Faultierbabys, die sich mit zwei Metern pro Minute bewegen, bis hin zu Schwänen, die auf dem Rücken ihrer Mutter trampen - der Countdown der sich am langsamsten bewegenden Tiere unseres Planeten geht los.
