  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Vasiliki czuje się odpowiedzialna za to, że Melina wróciła do Sifisa, więc postanawia udać się na Cypr, by wyjawić Achilleasowi całą prawdę. Będzie jednak naprawdę zaskoczona ciążą Eurydiki, która wymyśla kolejną intrygę. Na Krecie Sifis stosuje grę wobec Meliny. Eva, która początkowo unikała Sifisa, w końcu prosi go o wyjaśnienie sprawy dotyczącej jego relacji z Meliną. Po raz kolejny Sifis obiecuje jej, że to zrobi, ale dalej gra na dwa fronty.
