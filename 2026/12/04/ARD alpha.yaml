  title: RESPEKT kompakt
  subtitle: Demokratie?!? Wer hat das Sagen in der Schule?
  subtitled: true
  genre:
  - '128'
  description: "Bereits vor über einem Jahrhundert gab es in Preußen ambitionierte Ansätze, um Schüler mitbestimmen zu lassen. Sie wurden durch Lehrer und Eltern ausgebremst, denen die Pläne zu weit gingen. Bis heute bestimmen Schüler*innen nur selten über mehr als etwa das Ziel einer Klassenfahrt. Wenige Privatschulen wollen dagegen Schüler*innen in Verantwortung über wirklich relevante Fragen bringen - Schüler:innen bestimmen dort sogar über Budgetfragen und damit über die Gestaltung des Unterrichts mit. \nRespekt-Moderator Fabian Mader begegnet Schüler:innen, die für mehr Mitbestimmung an der Schule kämpfen."
