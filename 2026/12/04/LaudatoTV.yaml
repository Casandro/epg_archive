  title: Generacija plus
  subtitle: Magazin
  description: U novoj epizodi Generacija plus bavimo se temom Utjelovljenja. Razgovaramo o Isusu Kristu kao Božjem Logosu, o njegovim dvjema naravima - ljudskoj i božanskoj, te o važnosti i značenju njegova dolaska na svijet. Raspravljamo o filozofskim i teološkim aspektima, povijesnim okolnostima, i izazovima koje je ova istina vjere donijela kroz povijest, uključujući i hereze. Pitanja poput ,,Je li Isus mogao sagriješiti? i ,,Zašto je Bog odabrao tako malen i ponizan dolazak? nas vode kroz duboko promišljanje.
