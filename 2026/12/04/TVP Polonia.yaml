    Program dr. Andrzeja Kruszewicza przybliża widzom życie i zwyczaje różnych gatunków zwierząt. Autor jest lekarzem weterynarii, podróżnikiem, autorem wielu publikacji z zakresu ornitologii i dyrektorem warszawskiego ZOO. W programie będzie opowiadać o ssakach, ptakach, płazach i gadach, które można spotkać w ogrodach zoologicznych i w naturalnym środowisku.
