  title: Ojciec Mateusz s.XXVII - Odc. 353 (Ojciec Mateusz s. XXVII, odc. 11) Złamane serce
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2022
    Reżyseria: Radosław Dunaszewski
    Występują: Artur Żmijewski, Michał Piela, Kinga Preis, Eryk Lubos, Piotr Polk, Ewa Konstancja Bułhak
    Po 5 latach spędzonych na przymusowym leczeniu w szpitalu psychiatrycznym do Sandomierza wraca Janusz Dobrowolski, były alkoholik z kryminalną przeszłością. Schronienia udziela mu ciotka, która wspiera go również w próbach odzyskania części spadku po rodzicach, zapisanego w całości jego siostrze, Paulinie. Ta z kolei z bratem nie chce mieć nic wspólnego.
  ageRating: 12
  genre:
  - '18'
  subtitle: Po pięciu latach spędzonych na leczeniu w szpitalu psychiatrycznym do Sandomierza wraca Janusz Dobrowolski, alkoholik z kryminalną przeszłością. W rodzinie Dobrowolskich dochodzi do tragedii.
- eventId: 1042655
