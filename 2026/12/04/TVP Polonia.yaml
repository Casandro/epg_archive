    Na dyżurze zespół doktora Banacha musi pomóc nastolatkowi, który skarży się na ból "wszystkiego", ma gorączkę, problemy z nerkami oraz torsje - po zbyt forsownym treningu. Z kolei ekipa Lisickiego trafia na starszą kobietę z oparzeniami pleców - po stawianiu baniek. A w mieszkaniu obok wybucha nagle pożar. Tymczasem doktor Górska zmusza Górę, by dokończył szykowanie pokoju dla dzieci, ale w trakcie prac lekarz ma silny atak rwy kulszowej.
