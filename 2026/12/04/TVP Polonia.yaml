    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Nowy i Kuba zastanawiają się, jak pomóc matce braci, których uratowali ostatnio na terenie działek. Britney wyznaje Martynie, że nie wie, czy powinna na nowo zaufać Alkowi, a Klis ukrywa przed dziewczyną, że zamieszkał z Bereniką. Tymczasem na dyżurze zespół Julki i Alka trafia na kobietę z otwartym złamaniem ręki, potrąconą przez auto, a kilka godzin później pacjentem ratowników zostaje także sprawca wypadku, który traci nagle wzrok i nie może się poruszyć - po tym, jak został otruty.
