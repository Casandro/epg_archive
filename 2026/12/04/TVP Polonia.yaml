    Zwyczajna rozprawa sądowa w sprawie kradzieży roweru staje się areną dziwnych wypadków, nie tylko miłosnych. Sędzia, Sylwia Midowicz i Antoni Dziubak, sandomierski policjant, zostają w tym samym momencie trafieni strzałą Amora, a protokolant, Damian, nagle traci przytomność. Szybko jednak okazuje się, że te wydarzenia były zaledwie preludium do tragedii, która wydarza się w murach sądu, a środkami przypomina zbrodnie z czasów średniowiecza.
  ageRating: 12
