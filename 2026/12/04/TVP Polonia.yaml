  stop: 2026-12-04T16:00:00Z
  title: Bł. ks. Michał Sopoćko - sługa Miłosierdzia
  description: |-
    Tytuł oryginalny: Bł. ks. Michał Sopoćko - sługa Miłosierdzia
    PL, 2021
    Ksiądz Michał Sopoćko, urodzony 1 listopada 1888 r. w rejonie wileńskim, ukończył seminarium duchowne w Wilnie oraz pedagogikę na Uniwersytecie Warszawskim, zdobywając tytuły magistra i doktora teologii. Najbardziej owocne lata swojego życia spędził w Wilnie. W 2008 roku został beatyfikowany, a obecnie trwa proces kanonizacji. Był postacią tragiczną, przez lata odrzucaną, a teraz wywyższoną na ołtarze. Reportaż przybliża jego postać i prowadzi przez miejsca mu bliskie.
  genre:
  - '115'
  subtitle: W reportażu przybliżenie postaci ks.
