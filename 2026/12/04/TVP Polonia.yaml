  title: 'Makłowicz w podróży: Podróż 35. Tunezja - Mahdia'
  description: |-
    Tytuł oryginalny: Makłowicz w podróży
    PL, 2013
    Reżyseria: Paweł Lesisz
    Leżąca na morskim cyplu starożytna Mahdia została założona przez Fenicjan. Po nich przyszli Rzymianie, a dopiero potem Arabowie. Ich władca - z dynastii Fatymidów - ogłosił się zbawicielem, czyli mahdim, i założył tu stolicę kalifatu. Potem miastem rządzili Turcy osmańscy. Po wszystkich władcach pozostały twierdze i cmentarze. Cmentarz w Mahdii stanowi szczególną atrakcję turystyczną, bo jest to cmentarz morski, zlokalizowany na cyplu wysuniętym daleko w morze.
  genre:
  - '165'
  subtitle: W położonej na morskim cyplu Mahdii na straganach z przyprawami znajdują się składniki niezbędne do przyrządzenia dania odcinka - zupy rybnej, czyli szorby rybnej. Gotowanie odbywa się na skwerze.
