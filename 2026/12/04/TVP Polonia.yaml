  title: M jak miłość - odc. 1950
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Kinga Lewińska
    Występują: Teresa Lipowska, Krystian Wieczorek, Mikołaj Roznerski, Maurycy Popiel, Ilona Janyst, Adriana Kalska
    Anita jest o krok od załamania, gdy kolejne testy wykazują, że nadal nie zaszła w ciążę - i znów kłóci się przez to z Kamilem. Jeden z testów należących do przyjaciółki wykonuje za to Magda i gdy poznaje wynik, jest w szoku. Poza tym z Budzyńską kontaktuje się nagle była więźniarka Elżbieta, która ma nadzieję, że prawniczka ochroni ją przed brutalnym mężem - alkoholikiem, który ma powód, by się na niej zemścić. Gdy Magda zabiera kobietę do Grabiny, agresor rusza ich śladem.
  ageRating: 12
