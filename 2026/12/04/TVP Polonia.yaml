    Publikacja artykułu Weroniki wywołuje prawdziwą burzę. Wściekły Wilk musi zmierzyć się z zapowiedzią kontroli Nadzoru Budowlanego, a sprawą nielegalnego wydobycia piasku zaczyna interesować się policja pod wodzą aspiranta Majaka. W tym samym czasie Kacper zdobywa się wreszcie na odwagę i po raz pierwszy odprowadza Luizę do domu. Ich randkę bezceremonialnie przerywa jednak Emilka, która natychmiast donosi Malwinie i Jerzemu o nowej sympatii brata.
