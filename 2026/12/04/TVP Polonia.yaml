  title: Pięknie przyprawiONA - Dieta bogata w wit. D nie tylko na jesienne dni bez słońca
  description: |-
    Tytuł oryginalny: Pięknie przyprawiONA
    PL, 2022
    Reżyseria: Katarzyna Vanevska
    Słońce to oczywiście najlepsze źródło niezbędnej dla naszego zdrowia witaminy D. Co jednak poradzić, kiedy przychodzi jesienna i zimowa szaruga? Tu na ratunek musi przyjść dieta. Dzięki odpowiedniej diecie możemy zaspokoić ok. 20 proc. zapotrzebowania na witaminę D - skupimy się więc na odkrywaniu przepisów, produktów i sprytnych rozwiązań dietetycznych na braki słonecznej witaminy. Magazyn kulinarny,
