    Zrozpaczona Blanka przez kolejne godziny próbuje odnaleźć małą Ninę, podczas gdy policjanci z komendy wojewódzkiej: Dorota Kowal i Radosław Biegun prowadzą intensywne śledztwo w sprawie porwania. A gdy na miejscu zdarzenia zjawia się Mario, od razu zostaje jednym z podejrzanych. Z kolei Matylda wyznaje Falkowiczowi, że ma nowego chłopaka, a profesor postanawia "delikwenta" poznać. Dziewczyna zaprasza w końcu ukochanego na rodzinną kolację, na której zjawia się także Michał.
