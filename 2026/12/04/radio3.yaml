  title: Der radio3 Atelier Talk
  subtitle: Die Sendung mit der Kunst und der Wissenschaft
  description: "Kunst und Wissenschaft - eine alte Verbindung, die immer wieder Neues hervorbringt. Leonardo da Vinci sezierte Leichen, um den menschlichen Körper zu verstehen, Science-Fiction inspirierte die Raumfahrt und ohne Materialforschung gäbe es kein Bauhaus. Doch was treibt unsere Welt heute an?\n\n Ersponnene Ängste - von Spinnen und Menschen\nWarum fürchten wir uns vor Spinnen - und warum faszinieren sie uns zugleich? Ihre Netze, ihre erstaunlichen Fähigkeiten und ihre oft verborgenen Lebenswelten wecken Neugier, bei vielen Menschen aber auch Unbehagen oder sogar Panik. Dabei sind die meisten Spinnen für uns harmlos. Woher kommt unsere Angst? Was davon ist biologisch erklärbar, was kulturell geprägt? Und was sagt unser Verhältnis zu diesen Tieren über unseren Umgang mit dem Fremden und Unbekannten aus? \nModeratorin Siham El-Maimouni spricht darüber mit dem international renommierten Künstler Tomás Saraceno und dem Spinnenforscher Dr. Peter Jäger, Leiter der Sektion Arachnologie am Senckenberg Forschungsinstitut und Naturmuseum Frankfurt. \nTomás Saraceno beschäftigt sich seit vielen Jahren künstlerisch mit Spinnennetzen und den Lebenswelten der Spinnen. In seiner Installation \"In Orbit\" konnten Besucherinnen und Besucher in einem riesigen, mehrstöckigen Netz aus transparenten Seilen klettern und die Schwingungen der Konstruktion körperlich erleben. Aktuell zeigt er im Hamburger Bahnhof in Berlin in der Ausstellung \"Next Door\" einen detailgetreuen Nachbau des Netzes einer Schwarzen Witwe sowie echte Spinnennetze. \nDer Arachnologe Peter Jäger erforscht seit Jahrzehnten Spinnen, insbesondere Riesenkrabbenspinnen und die Artenvielfalt Südostasiens. Er hat mehrere hundert Spinnenarten wissenschaftlich beschrieben und setzt sich dafür ein, Menschen durch Wissen und unmittelbare Begegnung ihre Angst vor den Tieren zu nehmen. \nEin Gespräch über Spinnen, menschliche Ängste und die Frage, wie wir lernen können, dem Unbekannten offener zu begegnen.\n\nModeration: Siham El-Maimouni"
