  title: Mare Radio
  subtitle: mit Nikolas Golsch
  description: 'Die Ozeane sind eine Schatztruhe: In ihren Tiefen warten versunkene Schiffe voller historischer Kostbarkeiten auf ihre Entdeckung. Meeres-Lebewesen wie die Mangroven-Seescheide tragen wertvolle Stoffe in sich, die in der Krebstherapie eingesetzt werden können. Und Manganknollen wiederum enthalten wertvolle Rohstoffe für die Technologien der Zukunft. Mare Radio macht sich auf die Suche nach diesen Kostbarkeiten der Meere.'
