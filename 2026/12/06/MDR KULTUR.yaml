  title: MDR KULTUR Sonntagsraten
  subtitle: Radioquiz von und mit Axel Thielmann
  description: "Der Nikolaus\n\nDer 06.12. ist der Gedenk- und Todestag des heiligen Nikolaus von Myra, der durch die Legenden, die sich um seine Person ranken, zu einem der populärsten Heiligen der Kirche wurde.\nAber nicht nur das, denn, ob sie nun christlich sind oder nicht, am Morgen des 6. Dezember schauen Hierzulande fast alle Kinder vorsichtig vor die Tür und in die am Abend zuvor geputzten Schuhe, um zu sehen, was der gütig blickende alte Mann mit dem Rauschebart hineingelegt hat. Dass er gütig blickt, kennen sie aus der einschlägigen Weihnachtsliteratur und dem Fernsehen. \n\nAber was war das für ein Mann, über den es so viele Legenden gibt? Und welches Brauchtum rankt sich um das Datum 6. Dezember? Geschichten von - und über den Nikolaus. Das ist heute unser Thema im Sonntagsraten.\nBei unseren Rätseln stehen keine wuchtigen Gewinnprämien im Vordergrund, sondern das Vergnügen zuzuhören und mitzumachen. Die Gewinnerin, der Gewinner wird aus all jenen MDR KULTUR-Hörern ermittelt, die die drei heute gestellten Fragen per E-Mail oder über den Postweg richtig beantworten. \n\nAußerdem gibt es ein kleines Rätsel-Extra in der Sendung: In einem der drei Rätsel ist ein Fehler versteckt. Wer den findet, kann noch während der Sendung direkt im MDR KULTUR-Studio unter der Tel.: 0800 55 99 88 4 anrufen und hat so die Chance auf einen Zusatzgewinn. Wer für die Lösung der drei Rätselfragen ein Überraschungspaket gewinnen möchte, sollte online mitmachen unter: sonntagsraten@mdr.de oder per Post an unten stehende Adresse.\n\nAnregende Unterhaltung rund um drei interessante Rätselfragen."
