  title: MDR KULTUR Café mit Leh-Wei Liao
  description: |-
    Café: mit Leh-Wei Liao

    Sie gilt als eine der aufregendsten neuen Stimmen der deutschsprachigen Gegenwartsliteratur: Kaum ist ihr Debütroman "Glaszeit" erschienen, steht er schon auf der Longlist für den Deutschen Buchpreis 2026. In "Glaszeit" erzählt die 33-jährige eine queere Mutter-Tochter-Geschichte im pulsierenden Alltag von Taipei. Leh-Wei Liao wurde als Kind taiwanischer Eltern in Göttingen geboren. Sie studierte Medizin und arbeitete als Ärztin, heute studiert sie parallel Bildende Kunst an der Kunsthochschule Kassel.
