  title: Tolkien - Die wahre Geschichte der Ringe (3/3)
  subtitle: Claudia Major zu Gast bei Theo Koll
  widescreen: true
  hd: true
  description: Der dritte Teil der Serie zeigt, wie Tolkien aus den Erfahrungen der Menschheit, aber auch aus seinen eigenen eine eigene, scheinbar bis in die Kriege der Jetzt-Zeit gültige, Mythologie entwickelt. Als er 'Der Herr der Ringe' schreibt, kämpfen seine Söhne im Zweiten Weltkrieg. Als die erste Atombombe zum Einsatz kommt, arbeitet Tolkien gerade an seinem großen Kampf Gut gegen Böse. Vielleicht sind Tolkiens Bücher und ihre Verfilmungen auch deshalb bis heute so erfolgreich, weil sie abbilden, dass sich Geschichte wiederholt und es immer wieder Gefährten wie seine Protagonisten braucht, um das Böse zu besiegen.
