  title: Aus dem Oberallgäu und Kempten (Wh.)
  subtitle: Das Handwerk wird wieder beliebter - Woher kommt der neue Zulauf?
  description: Lange galt ein Studium für viele als der bevorzugte Weg ins Berufsleben. Doch inzwischen entdecken wieder mehr junge Menschen die Möglichkeiten einer handwerklichen Ausbildung. Wir besuchen einen Fernseh- und Radiotechnikbetrieb sowie die Heizungstechnik Vögel und sprechen über die Entwicklung, die Suche nach Auszubildenden und die aktuelle Auftragslage. Außerdem fragen wir, welche Rolle neue Anforderungen und technische Entwicklungen spielen und ob der Trend tatsächlich bei den Betrieben ankommt.
