  title: Abenteuer Diagnose - der Medizin-Krimi-Podcast
  subtitle: 'Kopfschmerzen, Nasenbluten, Ohnmacht: Warum spielt Sophias Blutdruck verrückt?'
  description: |-
    Schon wieder Kopfschmerzen und Schwindel: So geht es Sophia jeden Morgen direkt nach dem Aufstehen. Doch als der Schülerin nach einer Klassenarbeit plötzlich schwarz vor Augen wird, landet sie umgehend im Krankenhaus. Dort wird schnell klar: Mit ihrem Blutdruck stimmt etwas ganz und gar nicht.
    Es ist der Auftakt zu einer monatelangen Fahndung nach der richtigen Diagnose. Doch Sophia bleibt ein medizinisches Rätsel - eine Verdachtsdiagnose nach der anderen zerschlägt sich und auch die verabreichten Medikamente zeigen einfach keine Wirkung.
