  description: Ein junger Patient leidet noch immer an seiner schweren Depression. Suizidgedanken quälen ihn. Immer wieder wird er in der Psychiatrie vorstellig. Mittlerweile nimmt er an einem Therapieprogramm in der Tagesklinik teil. Hier soll er lernen, mit seinen negativen Gefühlen besser umzugehen. Wie schwierig das ist, zeigt der Fall einer alten Dame, die ebenfalls wegen akuter Suizidgefahr in die Akutstation eingeliefert wird. Ein Leben lang leidet sie unter den traumatischen Erfahrungen ihrer Kindheit.
