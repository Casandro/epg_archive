  title: Bayern 2 Hörspiel
  subtitle: '"Um zwölf Uhr mittags ist Zukunft. Zeit zum Essen" von Erik Altorfer'
  description: "Was war am Anfang? Das Wort, der Urknall oder bloß gespenstische Stille? Was macht eine Gemeinschaft aus und wer ist dafür verantwortlich, dass eine Gesellschaft funktioniert? Wofür leben wir? Und wann ist Zukunft? Hora Ensemblemitglieder stellen die wesentlichen Fragen des Lebens und beantworten sie in Erzählungen, Diskussionen, Songs und Lautgedichten - im Dialog mit dem Sound von Martin Schütz.\nIm HORA-Ensemble arbeiten ausschließlich Schauspieler*innen mit IV-zertifizierter kognitiver Beeinträchtigung.\n\nVon Erik Altorfer aus Texten von den Theater Hora Ensemblemitgliedern Remo Beuggert, Gianni Blumer, Matthias Brücker, Caitlin Friedly, Robin Gilly,Simone Gisler, Nikolai Gralak, Matthias Grandjean, Frank Häusermann, Lucas Maurer, Tiziana Pagliaro, Simon Stuber und Fabienne Villiger\nMit Remo Beuggert, Caitlin Friedly, Olivia Grigolli, Matthias Grandjean, Jasmin Mattei und Fabienne Villiger\nKomposition: Martin Schuetz\nRegie: Erik Altorfer\nBR 2025\n\nIm Anschluss:\n\nSherlock Holmes: Der Daumen des Ingenieurs\nEin junger Ingenieur wird schwer verletzt in die Praxis von Dr. Watson gebracht. Scheinbar hat jemand versucht, ihn bei seiner Arbeit an einer hydraulischen Presse umzubringen ...\n\nVon Sir Artur Conan Doyle\nAus dem Englischen von John Lackland/Ruth von Marcard  \nMit Peter Pasetti, Klaus Behrendt, Martin Benrath, Wolfgang Büttner, Rosemarie Pruppacher, Bum Krüger, Alexander Allerson, Gustl Datz, Wolfgang Dörich, Fred Kallmann und Carola Regier\nKomposition: Peter Zwetkoff\nRegie: Heinz-Günter Stamm\nBR 1965\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
