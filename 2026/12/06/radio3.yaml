  title: Lebenswelten
  description: "Für Deutschland kämpfen?\nJunge Christen, Juden und Muslime und der neue Wehrdienst\nEine Sendung von Matthias Bertsch\n\nKnapp vier Jahre nach dem Einmarsch Russlands in der Ukraine verabschiedete der Bundestag Anfang Dezember 2025 mit den Stimmen von CDU und SPD das Wehrdienstmodernisierungsgesetz. Alle jungen Männer ab Jahrgang 2008 müssen dazu Stellung beziehen, ob sie sich einen freiwilligen Wehrdienst vorstellen können. Wenn sich zu wenige Freiwillige finden, soll die Wehrpflicht wieder zum Zuge kommen - für Konfessionslose genauso wie für Christen, Juden und Muslime. \nDie Betroffenen selbst wurden nicht gefragt. Während manche den freiwilligen Wehrdienst oder auch eine Wehrpflicht nicht grundsätzlich ablehnen, fragen sich andere, wofür sie eigentlich kämpfen sollen. Schließlich tue der Staat zu wenig für sie."
