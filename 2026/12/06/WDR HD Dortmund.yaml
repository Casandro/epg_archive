  description: Ben Dellien hätte auf der nassen abendlichen Straße nur ein paar Schritte bis zum Straßengraben gehen müssen, dort liegt der Fahrradfahrer, den er gerade angefahren hat. Aber der Babysitter muss abgelöst, ein Auftrag noch zu Ende geführt werden - Ben steht unter Druck und fährt einfach weiter. Am nächsten Tag, während die Stuttgarter Kommissare Thorsten Lannert und Sebastian Bootz ihre Ermittlungen wegen Fahrerflucht und fahrlässiger Tötung aufnehmen und die ersten Indizien zusammensetzen, nagt die Reue an Ben. Trotzdem zieht er es vor, die Spuren des Unfalls zu vertuschen, statt sich zu stellen.
