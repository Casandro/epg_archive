  title: 'Hörspielzeit:  Das Reptilienhaus      :'
  subtitle: von Dejan Sorak  (SR/DLR Berlin 1996 )
  description: |-
    Donnerstagnachmittag halb fünf, im Reptilienhaus eines Zoos. Ein verlassener Ort. Wer sich dort verabredet, hat mit Sicherheit etwas zu verbergen, denkt sich Eugen und verwickelt Anton in ein Gespräch. Der wird zusehends nervöser, und bald stellt sich heraus: Anton ist weder Mafiosi noch Dealer, sondern mit seiner heimlichen Geliebten verabredet. Ihr Mann ist extrem eifersüchtig. Dafür hat Eugen vollstes Verständnis, vermutet er doch selbst, dass seine Frau ihn betrügt. Aber mit wem? Und wo?
    Dejan Soraks hochpräzise, turbulente Verwechslungskomödie schlägt rasante Haken und der Fantasie des Zuhörers oft ein Schnippchen. Christiane Ohaus hat Soraks Hörspiel mit einem Augenzwinkern und einem glänzenden Schauspieler-Trio inszeniert. Und auch das Krokodil spielt mit.
