  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: "Hörspiel\nKommissar Dubeau privat\nKommissar Dubeau ist in einer unangenehmen Lage. Sein Sohn Robert hat eine junge Frau, Christine Varin, erschlagen, und er wurde zufällig Zeuge der Tat. Was tun? Seinen eigenen Sohn vor den Kadi bringen? Nachdem sein Assistent, Inspektor Garnier, der Sache auf die Spur gekommen ist, kann eigentlich auch Kommissar Dubeau seine Ablenkungs- und Schweigetaktik nicht mehr weiterverfolgen. Doch da klingelt in seinem Büro das Telefon, und der Fall Varin nimmt eine ebenso unvermutete wie tragische Wendung.\n \nVon Maurice Roland und André Picot\nAus dem Französischen von Helga Kästner\nMit Peter Lieck, Jochen Striebeck, Hans Diehl, Hans-Günter Martens, Nicki von Tempelhoff, Michael Schütz, Tanja von Oertzen, Heidy Forster, Ilse Neubauer, Angelika Hartung-Atzorn und Ursula van der Wielen \nRegie: Gustl Weishappel\nBR 1987\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
