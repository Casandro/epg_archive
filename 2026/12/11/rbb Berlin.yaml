  description: Nach einem Reitunfall wird Sebastian von Lahnstein in die Sachsenklinik eingeliefert. Während er sich mit Schmerzen in die Hände von Chefarzt Dr. Roland Heilmann begibt, besteht seine Begleitung Gräfin Tanja von Lahnstein darauf, dass nur das Nötigste gemacht und Sebastian dann zu seinem Arzt nach Düsseldorf verlegt wird. Bei Sebastian zeigen sich Lähmungserscheinungen an den Beinen, alles weist zunächst auf eine Wirbelsäulenverletzung hin. Doch dann findet Dr. Heilmann einen Hirntumor. Schwester Arzu und Hans-Peter Brenner sind beide in der letzten Phase ihrer Prüfungen. Trotz Vorbereitung fällt Arzu durch ihre mündliche Prüfung.
