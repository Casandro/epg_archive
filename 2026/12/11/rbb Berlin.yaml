  description: Bei den Flusspferden im Zoo ist ein kleiner Bulle zur Welt gekommen! Der vier Wochen alte Sohn von Flusspferd Kathi unternimmt heute seine ersten Tauchversuche. Da Flusspferde meist unter Wasser geboren werden, beherrschen sie das Laufen auf dem Grund sofort. Mutter und Kind halten sich am Anfang lieber noch im flachen Teil des Wasserbeckens auf, denn Kathis Sohn kann noch nicht so lange die Luft anhalten. Die anderen Jungtiere aus der Flusspferd-Gruppe würden gern mit dem Nachwuchs spielen, doch da haben sie die Rechnung ohne Kathi gemacht!
