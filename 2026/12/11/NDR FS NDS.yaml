  subtitle: Islands einsamer Osten - Fjorde - Gletscher - Gammelhai
  description: Ostland nennen die Isländer den am dünnsten besiedelten Teil ihrer Insel. Die gewaltigen Ostfjorde gelten als das grüne Herz des Landes und der Vatnajökull ist der König aller Gletscher. Nur rund vier Prozent aller Isländer leben hier, dafür gelten sie als besonders fröhlich und entspannt. Sie verziehen keine Miene, wenn sie streng riechenden Gammelhai verzehren. Sie betreiben selbst im abgelegensten Winkel einen Süßigkeiten-Automaten und lassen den Tag am liebsten in "Hot Pots" mit heißem Wasser aus Geothermalquellen ausklingen - die gibt's überall in diesem Land aus Feuer und Eis.
