  title: Mysterium Gotik
  subtitle: Als die Kathedralen in den Himmel wuchsen
  widescreen: true
  hd: true
  description: 'In Frankreich entsteht im 12. Jahrhundert ein Architekturstil, der den Kirchenbau revolutioniert: die Gotik. Die Kathedralen streben in die Höhe. Licht durchflutet ihre Innenräume, an die Stelle massiver Mauern treten bunte Fenster - so ist die gesamte Fensterfläche der Kathedrale im französischen Chartres größer als ein Fußballfeld. Beeindruckendes Beispiel in Österreich ist der Wiener Stephansdom, das Wahrzeichen der Bundeshauptstadt. Die Dokumentation "Mysterium Gotik - Als die Kathedralen in den Himmel wuchsen" versucht den Rätseln und Geheimnissen der Gotik auf die Spur zu kommen.'
