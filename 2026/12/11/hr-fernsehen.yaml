  description: Da sich Storm nicht mehr an seine wahre Herkunft erinnern kann, versucht Tinka mithilfe der Briefkugel ihr Glück. Doch anstatt wichtige Erinnerungen aufleben zu lassen, zerbricht die Kugel. Auf der Suche nach weiteren Informationen steigen Tinka und Lasse nach Astrids Lucia-Vorführung in Storms Haus ein und finden tatsächlich weitere wichtige Hinweise für ihre Suche nach dem Weihnachtsstern. In der Wichtelwelt lässt Fileas Nille zu sich zitieren, um ihr mitzuteilen, dass er sie als seine Königin auserkoren hat.
