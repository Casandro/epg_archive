  description: Lasse und Tinka versuchen das alte Tagebuch zu entschlüsseln. Dafür suchen sie Hilfe bei Mikkel - vergeblich. Nun ruht ihre Hoffnung darauf, dass Oma es entschlüsseln kann. Es vergehen Stunden, bis das Tagebuch endlich von Oma Maja gelesen wird. Doch das Warten hat sich gelohnt, denn die Aufzeichnungen des Urgroßvaters liefern einen weiteren wichtigen Hinweis zum Verbleib des Weihnachtssterns. In der Welt der Wichtel hat Fileas Albträume. Er brennt darauf, endlich König zu werden, aber Erinnerungen an seinen älteren Bruder Storm und dessen Anrecht auf den Thron machen ihm zu schaffen.
