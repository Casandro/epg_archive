  title: Hand in Hand für Norddeutschland - DANKE
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Dr. Marcus Schwarz kennt die faszinierende Welt der Insekten wie kaum ein anderer. Zu verdanken hat er diese innige Beziehung seiner Großmutter, auf deren Hof er schon als Kind allerhand Krabbelgetier fasziniert beobachtete. Heute zeigt er, welche wichtige Rolle Fliegen, Käfer und Co. in der Natur und darüber hinaus spielen: Als forensischer Entomologe und Wundballistiker am Institut für Rechtsmedizin in Leipzig unterstützt er regelmäßig polizeiliche Ermittlungen mit seinen Gutachten, denn Insekten an Tatorten können wertvolle Rückschlüsse liefern.'
  subtitle: 'Moderation: Martina Schönherr und Yared Dibaba'
