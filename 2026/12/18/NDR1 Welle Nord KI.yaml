- eventId: 1017114
  start: 2026-12-18T20:00:00Z
  stop: 2026-12-18T21:00:00Z
  title: 'Moin! Schleswig-Holstein - Von Binnenland und Waterkant: Niederdeutsches Hörspiel'
  subtitle: Klassendag
  description: |-
    Von Rudolf Reiner
    Erika Rumsfeld: Anni
    Ruth Bunkenburg: Hedwig
    Herbert Leonardt: Ober
    Bernd Wiegmann: Stimme
    Regie: Hans-Jürgen Ott
    RB/NDR 1978

    Anni und Hedwig konnten sich noch nie leiden. Schon damals nicht, als sie noch gemeinsam zur Schule gingen. Dennoch lassen es sich die in die Jahre gekommenen Damen nicht nehmen, alljährlich zu ihrem Klassentreffen zu gehen.

    Dieses Mal jedoch sind sie die einzigen Teilnehmerinnen und unter der höflichen Oberfläche brodelt es plötzlich gewaltig, als sie beginnen, sich alte Geschichten aus dem Nähkästchen zu erzählen.
