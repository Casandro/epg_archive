  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: |-
    Podcast
    Nicht Mehr Mein Land - In der Manosphere
    So wirst Du hot! (4/5)
    Um besser auszusehen, hämmert Looksmaxxer Sinan auf sein Gesicht ein. In seiner Welt wird alles bewertet. Aber es gibt Dinge, die kann Sinan an sich nicht ändern. Dann findet er ein ganz neues Ranking.
    Von Alexander Gutsfeld, BR 2026

    Hörspiel
    Babylon Berlin
    Haus Vaterland (5/5): Die letzte Falle
    Charlotte Ritter und Gereon Rath planen ihre Hochzeit, doch Ruhe kehrt nicht ein. Ein verzweifelter Hilferuf, eine vertuschte Tat und neue Hinweise auf längst vergangene Verbrechen führen Rath auf die entscheidende Spur, deren Fäden in einem U-Bahn-Tunnel zusammenlaufen. Tief unter den Straßen Berlins muss er die letzten Puzzleteile zusammensetzen, um die Wahrheit aufzudecken.

    Von Volker Kutscher
    Mit Ole Lagerpusch, Alice Dwyer, Peter Nottmeier, Fabian Busch, Denis Moschitto, Benito Bause, Sebastian Urzendowsky, Anna-Maria Arkona, Anna Böttcher, Magdalena Monatasser, Roman Knizka und anderen
    Musik: Verena Guido und das WDR Funkhausorchester
    Bearbeitung: Thomas Böhm und Benjamin Quabeck
    Regie: Benjamin Quabeck
    WDR 2026

