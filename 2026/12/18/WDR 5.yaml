  title: WDR 5 - Lies mir was vor
  subtitle: 'Richard Adams Locke: "Neueste Berichte vom Cap der guten Hoffnung"'
  description: "<markup type=\"language.en\">Fake news</markup> sind kein neues Phänomen. <markup type=\"abbr\" abbreviation=\"1835\" correspondent=\"achtzehnhundertfünfunddreißig\">1835</markup> vermeldete die Tageszeitung <markup type=\"language.en\">New York Sun</markup>: Dank eines neuartigen gigantischen Teleskops seien der Wissenschaft sensationelle Beobachtungen geglückt - der Mond ist bewohnt! Die Meldung sorgte für internationale Aufmerksamkeit. Der Bericht des <markup type=\"language.en\">New Yorker</markup> Schriftstellers <markup type=\"language.en\">Richard Adams Locke</markup> gilt als eine der skurrilsten und poetischsten Falschmeldungen in der Zeitungsgeschichte. Sein Text versetzt den Leser in lunares Staunen. \nVon: Richard Adams Locke <br/>Mit Valentin Stroh und Glenn Goltz <br/>WDR <markup type=\"abbr\" abbreviation=\"2017\" correspondent=\"zweitausendsiebzehn\">2017</markup> \nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
