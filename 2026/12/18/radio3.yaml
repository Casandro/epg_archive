- eventId: 1014377
  start: 2026-12-18T19:00:00Z
  stop: 2026-12-18T22:00:00Z
  title: Alle Jahre Vidina - Die Popov Christmas-Show
  description: |-
    Vidina Popov singt Weihnachtslieder und das nicht allein. Zusammen mit ihren Gästen bringt sie bekannte Weihnachtslieder und Raritäten auf die Bühne. Und: Das Publikum soll auch mitsingen, denn diese Sendung ist Teil der ARD-Kampagne "Wir singen! Weihnachten in Deutschland". Es wird getalkt, gewichtelt und gesungen. Jeder Gast wird sein Lieblings-Weihnachtslied auf der Bühne präsentieren.
    Als Gäste begrüßen wir in dieser Spezialausgabe Jördis Triebel, Alli Neumann, Anna Prohaska, Joachim Meyerhoff und Daniel Zillmann sowie Berlin's 4 und als Hausband Izzy Ment.
