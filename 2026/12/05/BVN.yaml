  description: Een monument voor ongedoopte kinderen biedt ouders een tastbare plek van erkenning, rust en verbondenheid na een jarenlange stilte. Vroeger werden stilgeboren en ongedoopte kinderen vaak naamloos of onzichtbaar begraven, waardoor ouders hun verdriet niet konden delen. In de documentaire wordt teruggeblikt op deze geschiedenis en wat het monument voor ouders van doodgeboren kindjes betekent. (2026)
