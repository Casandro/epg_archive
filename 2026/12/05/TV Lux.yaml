  title: Tajomstvá Vatikánu I (3)
  subtitle: Štátik v tieni baziliky. Táto časť nám priblíži históriu pápežského štátu a Mestského štátu Vatikán.
  description: 'Táto časť nám priblíži históriu pápežského štátu a Mestského štátu Vatikán. Dozvieme sa prečo a ako prvý pápežský štát zanikol, aj ako vznikol Vatikánsky mestský štát v 20. rokoch minulého storočia. Budeme sledovať históriu dobytia Ríma Piemontčanmi a osudy pápežov v období, keď boli "zajatcami Vatikánu". Spoznáme niektoré právne kuriozity Vatikánu, ako napríklad: absencia súkromného vlastníctva, volebného práva, jestvovanie štátu bez národa. Autori dokumentu rozoberajú koncept funkčného štátu a národa. Zaujímavý je aj príbeh o vzniku Via Conciliazzione, vedúcej od Tiberu k Vatikánu. Réžia: Krzysztof Talczewski (2005)'
  genre:
