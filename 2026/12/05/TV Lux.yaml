  description: 'V rýchlom a neúprosnom svete automobilových pretekov stačí jediná chyba, aby sa navždy zmenili životy dvoch mužov. Pretekár Sean Weathers mal všetko - úspech, fanúšikov, aj milujúcu dcéru. Keď však rivalita s iným pretekárom prerastie do osobnej roviny, práve ego, ktoré ho doviedlo k víťazstvu, zapríčiní tragédiu a uvrhne jeho život do chaosu. Podnikateľ Jack Reed síce dosiahol úspech v biznise, no zlyhal ako otec. Náhly zvrat udalostí však zničí jeho nádej na zmierenie. Keď sa ich životy pretnú, vzniká medzi nimi nečakané priateľstvo, zatiaľ čo spoločne prechádzajú cestou bolesti, uzdravenia, odpustenia a nádeje na druhú šancu. Réžia: Judd Brannon. Účinkujú: Gary Graham (Jack Reed), Andrew Cheney (Sean Weathers), Isaiah Stratton (Ray Reed), Robert Amaya (Rex Marshall), Cameron Arnett (Logan Evans) (2017)'
