  title: Dunkirk
  subtitle: Spielfilm Großbritannien 2017
  genre:
  - '16'
  subtitled: true
  description: 'Mai 1940: Die französische Hafenstadt Dünkirchen ist von deutschen Truppen umstellt. Die Bewohner und knapp 400.000 Soldaten sind in einer ausweglosen Lage. In Großbritannien wird eine Rettungsmission über das Meer geplant, die Erfolgsaussichten erscheinen allerdings sehr gering. Während die Soldaten am Boden verzweifelt ums Überleben kämpfen, sorgen Piloten in ihren Spitfires für Feuerschutz aus der Luft. Auch Zivilisten versuchen, mit ihren kleinen Booten bei der größten Rettungsaktion des Zweiten Weltkriegs zu helfen.'
- eventId: 663548
  start: 2026-12-05T01:40:00Z
  stop: 2026-12-05T02:25:00Z
  title: Legendäre Dinner
  subtitle: Geschichte geht durch den Magen
  subtitled: true
  genre:
  - '144'
  description: |-
    Bei der Hochzeit von Prinzessin Elizabeth - der späteren Queen - und ihrem Philip wird zwei Jahre nach dem Ende des Zweiten Weltkriegs alles aufgetischt, was das noch kriegsgeschädigte Land zu bieten hat.
    Als 1963 US-Präsident John F. Kennedy die Bundesrepublik besucht, herrscht im Vorfeld große Aufregung. Doch ein festliches Dinner in Bad Godesberg sorgt für gute Stimmung.
    Coco Chanel hat die Mode revolutioniert, aber auch die Art, festlich zu speisen. In ihrer Villa "La Pausa" an der Côte d'Azur lädt sie ihre illustren Freunde ein zum sommerlich frischen Buffet.
