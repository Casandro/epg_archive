- eventId: 663289
  start: 2026-12-05T04:00:00Z
  stop: 2026-12-05T04:55:00Z
  title: Neues Leben für Kanadas Meereswelt
  subtitle: Die Rückkehr der Buckelwale
  subtitled: true
  description: In den letzten 20 Jahren sind immer mehr Buckelwale an die Küste von British Columbia zurückgekehrt, und mit ihnen Seeotter, Robben und Algenwälder. In der Meerenge zwischen Vancouver Island und dem Festland Kanadas offenbart sich ein einzigartiges Miteinander von Tieren - und von Menschen, die sich für einen nachhaltigen Umgang mit der Natur einsetzen. Der Film zeigt, wie sich ihr Engagement innerhalb kürzester Zeit positiv bemerkbar macht und neues Leben entstehen kann.
- eventId: 663290
  start: 2026-12-05T04:55:00Z
  stop: 2026-12-05T05:50:00Z
  title: Unser Körper - Unsere Zellen
  subtitle: Gibt es ewiges Leben im Mikrokosmos?
  subtitled: true
  description: 'Henrietta Lacks stirbt 1951 in Baltimore an Gebärmutterhalskrebs. Doch ein Teil ihrer Zellen lebt weiter. Bis heute werden sie in Laboren auf der ganzen Welt vermehrt - und öffnen Forschenden den Blick in einen Kosmos, der in uns allen steckt: die Zelle, kleinste Einheit des Lebens.'
- eventId: 663291
  start: 2026-12-05T05:50:00Z
  stop: 2026-12-05T06:45:00Z
  title: Unser Körper - Unsere Zellen
  subtitle: Woher kommt die Energie des Lebens?
  subtitled: true
  description: '"Woher kommt die Energie des Lebens?" zeigt Forschung an den Grenzen des Machbaren: Können wir das Altern verlangsamen, Schweineorgane für Transplantationen nutzbar machen oder Zellen so umprogrammieren, dass aus Hautzellen Eizellen entstehen? Was lange wie Science-Fiction klang, wird heute in Laboren erforscht und könnte die Medizin grundlegend verändern.'
- eventId: 663322
  start: 2026-12-05T06:45:00Z
  stop: 2026-12-05T07:10:00Z
  title: Impulse
  subtitle: 'Plattentektonik: Kontinente in Bewegung'
  description: Bloß keine mathematischen Formeln und keine physikalischen Gleichungen? Die Reihe für Kinder macht naturwissenschaftliche Sachverhalte auch für Mathe-, Physik- und Wissenschaftsmuffel schmackhaft. Diese Folge widmet sich der Erforschung der Plattentektonik. Können wir in Zukunft Vulkanausbrüche und Tsunamis noch besser voraussehen?
- eventId: 663323
  start: 2026-12-05T07:10:00Z
  stop: 2026-12-05T07:40:00Z
  title: Gibt es den perfekten Mord?
  subtitle: 42 - Die Antwort auf fast alles
  description: 'Moderne DNA-Analysen machen selbst kleinste Spuren zu wertvollen Hinweisen: Sie können Personen identifizieren und Merkmale wie Augen-, Haar- und Hautfarbe vorhersagen. Mit Hilfe der genetischen Ahnenforschung suchen Ermittler sogar nach Verwandten des Täters. Doch wie weit darf die Jagd nach Verbrechern gehen - und was wird aus unserer genetischen Privatsphäre?'
- eventId: 663324
  start: 2026-12-05T07:40:00Z
  stop: 2026-12-05T08:35:00Z
  title: 360° Reportage
  subtitle: 'Ein Palast aus Sand: Nepals magische Mandalas'
  subtitled: true
  description: 'Nepal ist die Wiege des Buddhismus. Hier soll vor rund 2.500 Jahren Prinz Siddharta Gautama geboren worden sein - der Erleuchtete, der Buddha. In der Hauptstadt Kathmandu leben heute überwiegend Hinduisten. Doch aus den kargen Bergdörfern des Himalayas zieht es mehr und mehr junge Menschen zu den Heiligen Stätten Buddhas - darunter auch immer mehr Mädchen. Sie dürfen nun auch ein außergewöhnliches und streng buddhistisches Kunsthandwerk praktizieren: Das "Malen" geheiligter Mandala-Bildnisse mit Sand.'
- eventId: 663325
  start: 2026-12-05T08:35:00Z
  stop: 2026-12-05T09:30:00Z
  title: 360° Reportage
  subtitle: 'Polen: Die Retterinnen der verletzten Wildtiere'
  subtitled: true
  description: Unweit von Warschau geben zwei engagierte Schwestern verletzten und nicht selten mutwillig misshandelten Tieren letzte Überlebenschancen. Izabella und Malgorzata Szmurlo - 61 und 71 Jahre alt - betreiben hier ein Rehabilitationszentrum für Wildtiere. Mehr als einhundert Tiere haben die beiden Tierärztinnen ein Zuhause gegeben.
