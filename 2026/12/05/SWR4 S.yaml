  title: SWR4 Party
  subtitle: mit Johannes Riedel
  description: |-
    Sie feiern zuhause oder gemeinsam mit Ihren Liebsten? Wir liefern Ihnen die passende Partymusik!

    Schicken Sie Ihre Musikwünsche schnell und einfach per Mail ins Studio über SWR4.de oder die SWR4 App in ARD Sounds. Oder Sie rufen uns einfach an - kostenlos vom Handy und aus dem Festnetz:

    08000 70 4444

    Übrigens: Unter dieser Nummer sind wir auch per WhatsApp und Signal erreichbar.

    Der Südwesten tanzt und feiert: Jeden Samstag bis 23 Uhr mit der SWR4 Party.
