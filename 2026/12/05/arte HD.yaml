  description: 'Mai 1940: Die französische Hafenstadt Dünkirchen ist von deutschen Truppen umstellt. Die Bewohner und knapp 400.000 Soldaten sind in einer ausweglosen Lage. In Großbritannien wird eine Rettungsmission über das Meer geplant, die Erfolgsaussichten erscheinen allerdings sehr gering. Während die Soldaten am Boden verzweifelt ums Überleben kämpfen, sorgen Piloten in ihren Spitfires für Feuerschutz aus der Luft. Auch Zivilisten versuchen, mit ihren kleinen Booten bei der größten Rettungsaktion des Zweiten Weltkriegs zu helfen.'
