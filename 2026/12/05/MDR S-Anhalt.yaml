  description: Familie Struutz kehrt ihrer sächsischen Heimat den Rücken und reist über die Alpen nach Neapel. Und weil Udo, Familienoberhaupt und leidgeprüfter Lateinlehrer, auch in der Freizeit am liebsten auf klassischen Spuren wandelt, folgt er den Stationen von Goethes "Italienischer Reise". Trabi "Schorsch", Udos lebenslange Hassliebe, soll die Familie dorthin bringen. So beginnt eine irrwitzige Urlaubsreise, bei der Familie Struutz und Trabi Schorsch allerhand Federn lassen und viel fürs Leben lernen.
