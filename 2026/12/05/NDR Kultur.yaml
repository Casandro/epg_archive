  title: Kunstverbrechen
  description: 'Gestohlene Gemälde, Kunstschmuggel, Fälscherskandale: Bei Kunstverbrechen rollen Lenore Lötsch und Torben Steenbuck spektakuläre Verbrechen in der Welt der Kunst- und Kultur auf. Ohne Blutvergießen, dafür mit spannender Kunst! Sie nehmen euch mit an Tatorte und hinter die Kulissen der Ermittlungen bei True-Crime-Fällen im vermeintlich glitzernden Kunstgeschäft. Sie treffen Zeugen, Experten und Opfer. Unterstützung bekommen sie dabei von Deutschlands bekanntestem Kunst-Kommissar René Allonge vom LKA Berlin.'
