  title: In aller Freundschaft - Die jungen Ärzte (294)
  subtitle: Freundschaft
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: 'Auf dem Weg zur Arbeit sind Dr. Leyla Sherbaz und Dr. Matteo Moreau mit dem Auto vor einem malerischen Bauernhof liegen geblieben, als sie plötzlich eine junge Frau um Hilfe rufen hören: Meera Hauser schleppt sich mit einer offenen Oberschenkelfraktur und einer Arterienverletzung aus dem Stall. Als die beiden Ärzte sie notversorgen, stellt sich heraus, dass Meeras kleiner Bruder in der Scheune vom Heu verschüttet wurde. Während Matteo einen Rettungswagen ruft, rennt Leyla in die Scheune, um Jannis zu retten. Doch dann stürzt ein morscher Stützbalken ab. Leyla wirft sich schützend über Jannis.'
