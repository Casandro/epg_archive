  description: Rund eine Million Menschen in Norddeutschland sind pflegebedürftig, Tendenz steigend. Etwa 80 Prozent von ihnen werden zu Hause von Angehörigen, Nachbarinnen und Nachbarn oder Pflegediensten versorgt, für viele ist das Pflegeheim der letzte Schritt. Wie lässt sich die Pflege in Zukunft sichern, welche Konzepte gibt es bereits, und wo stößt das System an seine Grenzen? Diesen Fragen widmet sich NDR Info live am 1. Dezember einen Tag lang aus dem Graf Recke Quartier, einer Pflegeeinrichtung in Neumünster in Schleswig-Holstein, die Pflege als ganzheitliche Aufgabe versteht.
