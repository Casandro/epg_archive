  title: 'Die Nordreportage: Der Nächste bitte!'
  subtitle: Geschichten aus dem Tierpark Hagenbeck in Hamburg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Pilzbefall im Giraffenrevier - die Impalas sehen aus, als hätten sie die Motten im Stall. Nur kann man die scheuen Antilopen leider nicht stillstehend einseifen, aber Thomas Günther und Dr. Adriane Prahl haben die Lösung: die "Antipilzberieselungsmaschine". Im Schweinestall braucht Muttersau Pia mal eine Pause von ihrem durstigen Ferkeldutzend. Der Ausflug an die frische Luft wird zur Geduldsprobe für Thomas Feierabend und Dave Nelde. Die Kamtschatka-Familie verwandelt sich in Honigbären, und die Roten Pandabären wandeln im Bambus-Schlaraffenland.'
