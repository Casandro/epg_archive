  title: Eisenbahn-Romantik (1090)
  subtitle: Mit der Nordlandsbahn über den Polarkreis
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Landschaftlich großes Kino, das sogar um Mitternacht erhellt ist: Das erlebt, wer im Juni mit dem Nachtzug der Nordlandsbahn von Trondheim nach Bodø reist. Der Zug hangelt sich entlang an Fjorden und Flüssen und fährt hinauf zur Saltfjellet-Hochebene, wo er den Polarkreis überquert. Am höchstgelegenen Bahnhof Lønsdal wacht in der Einsamkeit ein Fahrdienstleiter, um den Zug zu begrüßen.'
