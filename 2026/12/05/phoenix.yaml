  description: 'Die 2000er Jahre: Es geht aufwärts. Zunächst für die Spieler und Fans von Energie Cottbus, die Fußballgott Detlef Irrgang in die 1. Bundesliga schießt. Das Wunder der Lausitz für viele unvergessen. So starten die Brandenburger voller Hoffnung ins neue Jahrtausend. Großprojekte wie Lausitzring, Cargolifter und Chip-Fabrik versprechen eine blühende Zukunft und tausende Arbeitsplätze. Stattdessen kommen Agenda 2010 und Hartz IV, in denen viele Menschen eher Bedrohung und Abwertung sehen als Unterstützung.'
