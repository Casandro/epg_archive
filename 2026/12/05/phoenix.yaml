  hd: true
  description: 'Die 1990er Jahre: Brandenburg wird gegründet am Tag der Wiedervereinigung. Aus den ehemaligen DDR-Bezirken Potsdam, Frankfurt (Oder) und Cottbus wird das größte neue Bundesland. Es ist ein Aufbruch und gleichzeitig eine Suche nach der eigenen Identität. Das junge Land erlebt bald schwierige Zeiten: Der Angolaner Amadeu Antonio Kiowa wird 1990 in Eberswalde von einer Gruppe rechtsextremer Skinheads zu Tode geprügelt. Er ist eines der ersten Todesopfer rassistischer Gewalt im wiedervereinten Deutschland. Der Abschied der russischen Streitkräfte 1994 hinterlässt Brachen, Ruinen und militärische Altlasten.'
