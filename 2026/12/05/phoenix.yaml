  subtitle: Mit dem Fahrrad um die Welt
  widescreen: true
  hd: true
  description: 'Die Fahrräder beladen, losradeln und auf unbestimmte Zeit die Welt entdecken. Diesen mutigen Traum verwirklicht ein junges Paar auf seiner Tour durch Australien und Japan. Im Sommer 2021 kündigen Louisa (27) und Tobi (28) Jobs und Wohnungen und verabschieden sich von Freunden und Familie. Was für andere nur Wochenendvergnügen ist, ist jetzt ihr Leben: eine Weltreise auf einfachen Tourenrädern gebraucht gekauft und leicht zu reparieren. Ihr Zuhause ist ein kleines Zweipersonenzelt. Einziger Luxus: gepolsterte Hosen, Campingstühle und alle sieben Tage eine heiße Dusche und ein Bett.'
