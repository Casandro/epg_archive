  title: Die Kennedy-Saga
  subtitle: Zwei Brüder
  widescreen: true
  hd: true
  description: John F. Kennedy ist zum US-Präsidenten gewählt worden. Seine Frau Jackie und er bringen einen Hauch von Hollywood-Glamour ins Weiße Haus und werden als Traumpaar gefeiert. Die amerikanischen Bürger und die Presse liegen ihnen zu Füßen. Doch politisch ist die Amtszeit des jungen Präsidenten von den Unruhen des Kalten Krieges geprägt. Die Fronten zwischen den USA und der Sowjetunion verhärten sich immer mehr. Als 1962 schließlich ein Atomkrieg droht, ist John F. Kennedy auf die Unterstützung seines Bruders Robert angewiesen, den er zum Justizminister ernannt hat.
