  title: Abenteuer Freiheit
  subtitle: Vanlife in Südamerika
  widescreen: true
  hd: true
  description: 'Es ist die Erfüllung eines Lebenstraums: eine gewaltige Reise quer durch Südamerika. Mit Hündin Pepper fahren Svenja (33) und Sebastian (38) mit ihrem Camper über den riesigen Kontinent. Wenn sie morgens ihre Tür aufmachen, sehen sie Canyons oder Lagunen und manchmal 6000 Meter hohe Berge. Ein Jahr haben sie sich für das Abenteuer ihres Lebens Zeit genommen. Es ist eine Reise voller Überraschungen, die ihnen immer wieder viel abverlangt. Die Höhe der Anden und die oft fehlende Infrastruktur macht Südamerika zu keinem einfachen Reiseland besonders mit ihrem alten Gefährt, einem Auto ohne Allradantrieb und Komfort.'
