  title: Die Kennedy-Saga
  subtitle: Der Weg an die Macht
  widescreen: true
  hd: true
  description: 'In den 50er Jahren haben die Kennedys trotz mehrerer Schicksalsschläge nichts von ihrem Ehrgeiz und ihrem Glamour eingebüßt. Joes Ambitionen gelten mittlerweile der politischen Karriere seines Sohnes John, den er als den nächsten US-Präsidenten sieht. Da die Tatsache, dass John mit Mitte dreißig noch Junggeselle ist, ein ernsthaftes Hindernis für seine weitere Karriere darstellt, heiratet er die 21-jährige Jacqueline Bouvier. Mit ihr an seiner Seite und mit der Unterstützung seiner ganzen Familie gelingt ihm 1961 schließlich, wovon sein Vater immer geträumt hat: der Einzug ins Weiße Haus.'
