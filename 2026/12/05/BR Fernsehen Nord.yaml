  description: 'In dem kleinen Ort Buchendorf bei München liegt das bis jetzt einzige russisch-orthodoxe Frauenkloster Deutschlands. Unter der Leitung von Äbtissin Maria leben dort 13 Schwestern internationaler Herkunft, die einer strengen hierarchischen Ordnung folgen. Gleichzeitig müssen sich die Schwestern auch weltlichen Angelegenheiten widmen: Neben ihren alltäglichen Arbeiten geht es für die Frauen auch darum, Pilger zu versorgen und den Fortbestand des Klosters zu sichern.'
