  title: WDR 3 Lesung
  subtitle: 'Jaroslav Rudis: Trieste Centrale + Frank Schulz: Q''topia'
  description: "<strong>Jaroslav Rudis: Trieste Centrale </strong>\nWenzel Winterberg ist <markup type=\"abbr\" abbreviation=\"99\" correspondent=\"Neunundneunzig\">99</markup> Jahre alt und lebt in Berlin. Er liebt Geschichte, Mitteleuropa und die Eisenbahn. Bei einem Bier im Stammlokal erzählt er seinem Krankenpfleger von einer Italienreise mit seiner verstorbenen Frau. Als der Eiserne Vorhang sich noch durch Europa zog, fuhren sie mit Hilfe eines alten Baedekers gemeinsam mit dem Zug nach Triest, um dem Berliner Winter zu entfliehen.\nVon Jaroslav Rudis <br/>Mit: Jaroslav Rudis <br/>MDR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"20.\" correspondent=\"zwanzigsten\">20.</markup> November <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>.\nFrank Schulz: Q'topia \nEs wird eine Reise auf Leben und Tod: Drei verbliebene Mitglieder einer Band, die vor langem einmal berühmt war, begegnen sich in ihrem Heimatdorf. Einer von ihnen besitzt noch Songmaterial, das er zu einem letzten Album verarbeiten möchte. Doch der Weg dahin ist kompliziert. Frank Schulz erzählt von einer Expedition zu einem geheimnisvollen Bach, letztlich: einer Reise in die Kindheit. \nVon Frank Schulz <br/>Mit: Frank Schulz <br/>NDR <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"4.\" correspondent=\"vierten\">4.</markup> Dezember <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
