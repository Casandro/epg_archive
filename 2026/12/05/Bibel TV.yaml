  title: Stunde des Höchsten
  subtitle: 'Ankommen und Aufbrechen - 1. Advent: Die Sehnsucht nach dem Innehalten'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die ''Stunde des Höchsten'' ist ein Fernsehgottesdienst, der wöchentlich von den Zieglerschen produziert wird. Als Aufzeichnungsort dient eine Kapelle, die auf dem sogenannten "Höchsten" liegt, 800 Meter oberhalb des Bodensees, mit Panoramablick auf die Schweizer Alpen. Die Kapelle gehört zur Fachklinik Höchsten, einer Suchtklinik für Frauen. Die ''Stunde des Höchsten'' zeichnet sich dadurch aus, dass sie ein Studio-Gottesdienst ist, d. h. ohne Beteiligung von Publikum vor Ort. Der Gottesdienst möchte die Menschen in ihren Wohnzimmern erreichen.'
