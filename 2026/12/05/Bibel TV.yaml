  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Schon als Kind weiß Rebekah Hodges: Sie will Missionarin werden. Doch ihr Weg verläuft anders als gedacht. Statt zu Waisenkindern nach Afrika führen Ausbildung, Ehe und Familie sie nach Deutschland - in eine Berufung, die leiser beginnt und Zeit braucht. Im Gespräch mit Moderatorin Elena Schulte und Georgia Mix erzählt Rebekah von Warten, Loslassen und dem Vertrauen, dass Gott auch dann wirkt, wenn Türen sich nicht sofort öffnen.'
