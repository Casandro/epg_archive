  title: Meisterküche - Alles köstlich gefüllt
  subtitle: mit Yvonne Willicks
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Ob Pfannkuchen, Blätterteig oder zarte Fleischröllchen: In dieser Folge der Meisterküche präsentiert Moderatorin Yvonne Willicks Gerichte mit herzhaftem Innenleben. \nStudiogast Koch Jaspar Walk verpasst saftigen Hackbällchen einen cremigen Mozzarella-Kern. \nTV-Köchin Zora Klipp füllt deftige Hefe-Pfannkuchen - ebenfalls mit Hackfleisch. \nEine raffinierte Vorspeise serviert Spitzenkoch Björn Freitag: Blätterteig-Pralinen mit Sauerkraut-Kartoffel-Füllung.\nAuch Martina Meuth und Bernd Neuner-Duttenhofer steuern ein Rezept bei: mit Oliven gefüllte Schweineröllchen!"
