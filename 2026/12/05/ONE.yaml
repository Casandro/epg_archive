  description: 'Die Mutter von Hauptkommissar Paul Kleinert ist verstorben. Während der Beerdigung bekommt Kleinert einen Anruf aus dem Revier: Marco Schier, ein junger Revierförster, wurde verschnürt und mit indianischer Kriegsbemalung im Gesicht, tot im Wald aufgefunden. Der Hauptkommissar sieht den neuen Fall als willkommene Ablenkung von seiner Trauer. Als er am Tatort ankommt, ist seine pfiffige Sekretärin Klara Degen schon im Gespräch mit Werner Ristau. Der Rentner war mit seinem Welpen beim Spaziergang, als er den Toten fand. Er berichtet dem Team, es gebe tatsächlich Indianer in der Region: die Harz-Komantschen.'
