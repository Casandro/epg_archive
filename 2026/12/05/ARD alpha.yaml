- eventId: 663841
  start: 2026-12-05T05:00:00Z
  stop: 2026-12-05T05:30:00Z
  title: Englisch für Anfänger
  subtitle: Crime in the City
  description: '"What''s your name? Are you German?" Mit einfachen Fragen und Antworten führt dieser Klassiker unter den Fernsehsprachkursen in die englische Sprache ein. In 51 Lektionen werden die wichtigsten Grammatikstrukturen und der Grundwortschatz vermittelt. Wann sagt man "some" oder "any"? Wann  heißt es "he was" und wann "he has been"? Die Antworten auf diese und viele andere Fragen, die Sie im Englischunterricht nie zu stellen wagten, liefert "Englisch für Anfänger" in witzigen Spielszenen und fundierten Erklärteilen.'
- eventId: 663842
  start: 2026-12-05T05:30:00Z
  stop: 2026-12-05T06:00:00Z
  title: TELEKOLLEG Französisch
  subtitle: Esquisses de France
  description: Ausgewählte Regionen Frankreichs werden in diesen musisch-akzentuierten Dokumentationen in ihrer geographischen, gesellschaftlichen und kulturellen Besonderheit dargestellt. Landschaftliche Schönheiten gehören ebenso dazu wie Zentren wirtschaftlicher Bedeutung, Stätten der bildenden Kunst oder Schauplätze der Literatur. Interviews mit Franzosen verschiedenster Lebensbereiche vermitteln zusätzlich ein authentisches Bild von "Frankreich heute".
- eventId: 664240
  start: 2026-12-05T06:00:00Z
  stop: 2026-12-05T06:30:00Z
  title: 42 - Die Antwort auf fast alles
  subtitle: Werden Schwarze Löcher die neuen Kraftwerke?
  description: 'Schwarze Löcher kennen wir als die Zerstörer schlechthin: Sie zerreißen Sterne, verschlingen Licht und krümmen die Raumzeit. Sie sind wie kein anderes Objekt im All. Gleichzeitig zählen sie zu den größten Energiequellen, die es im Universum gibt! Lässt sich diese Kraft nutzen? Steckt in Schwarzen Löchern die Superenergie der Zukunft - oder spielen wir mit dem Feuer?'
