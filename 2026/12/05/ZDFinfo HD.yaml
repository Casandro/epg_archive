  title: Fremdenlegion
  subtitle: Rekruten im Härtetest
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Die Fremdenlegion: 9000 Elitesoldaten aus aller Welt, ausgebildet mit Drill und Gehorsam, einsatzbereit für den Kampf. Der Weg in die Legion ist hart, bleiben dürfen nur die Besten.

    Täglich kommen Männer aus der ganzen Welt zur Legionskaserne im französischen Aubagne. Sie suchen eine zweite Chance im Leben. Doch was sie erwartet, ahnen sie nicht: scharfer Befehlston, harte Tests, wenig Schlaf, wenig zu essen, eine extreme Zeit.
    HD-Produktion
- eventId: 863322
  start: 2026-12-05T01:25:00Z
  stop: 2026-12-05T02:10:00Z
  title: Fremdenlegion
  subtitle: Trainingshölle Regenwald
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Elitekämpfer im Dschungel: Im 3. Regiment der Fremdenlegion werden Legionäre und Spezialeinheiten befreundeter Armeen unter besonders harten Bedingungen geschult.

    Die Dschungelkampfschule gehört zu den härtesten militärischen Trainingsprogrammen. Die Soldaten campieren im Regenwald, Essen ist rationiert, es gibt keine Sanitäranlagen. Bedingungsloser Gehorsam ist Pflicht, und selbst kleinste Fehler werden hart bestraft.
    HD-Produktion
- eventId: 863323
  start: 2026-12-05T02:10:00Z
  stop: 2026-12-05T02:55:00Z
  title: Fremdenlegion
  subtitle: Härtetest Fallschirmjäger
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2025
    Elitekämpfer in der Luft: Frankreichs Fremdenlegion betreibt auf Korsika ihr einziges Fallschirmjäger-Regiment. Es gilt als besonders harte Prüfung mit einzigartigen Herausforderungen.

    Die Fallschirmjäger sind die einzige Einheit, für die sich Legionäre extra bewerben müssen. Nur die besten Anwärter haben nach der Grundausbildung eine Chance. Wer zugelassen wird, steht vor knochenharten Wochen in der Luft, aber auch im Wasser.
    HD-Produktion
- eventId: 863324
  start: 2026-12-05T02:55:00Z
  stop: 2026-12-05T03:40:00Z
  title: Fremdenlegion
  subtitle: 'Operation extrem: Häuserkampf und Gipfelsturm'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
