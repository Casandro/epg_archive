  description: |-
    Deutschland 2026
    Die Fremdenlegion im Extremtraining: Häuserkampf in den Gassen Korsikas, Grenzerfahrungen in den eisigen französischen Alpen. Schonungslose Herausforderungen für Frankreichs Elitekämpfer.

    In Korsikas Bergdörfern bringt ein Manöver die Fallschirmjäger an die Grenzen, in den Alpen trainieren zukünftige Gebirgspioniere in Eis und Schnee. Hart und kompromisslos: Wer nicht durchhält, ist raus. ZDFinfo geht mit der Reihe "Fremdenlegion" an die Extreme.
    HD-Produktion
