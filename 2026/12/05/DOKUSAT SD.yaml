  title: Tiere vor der Kamera - Highway durch Australien - Im heißen Herz
  description: Ernst Arendt und Hans Schweiger nehmen uns wieder mit, locker und unterhaltsam geht es durch Australien. Von Alice Springs stracks nach Osten durch die felsige Harts Range, dann immer weiter auf dem Plenty Highway bis nach Queensland und wieder zurück. Die 1.500 km sehen auf der Australienkarte nicht nach viel aus, sind aber voller Tier- und Landschaftserlebnisse. Ein Laubenvogel baut an seiner Renommier-Immobilie, Kakadus trinken im Flug.
  widescreen: true
- eventId: 1088398
  start: 2026-12-05T02:40:00Z
  stop: 2026-12-05T03:45:00Z
  title: Tiere vor der Kamera - Highway durch Australien - Auf nach Nordost
  description: 'Ernst Arendt und Hans Schweiger nehmen uns heute mit durch Australien. Auf dem Stuart Highway nach Norden bis Darwin, ein kleiner Schlenker durch den Kakadu-Nationalpark und dann nach Osten ins Atherton Tableland, 4.000 km voller Tiererlebnisse. Am Wegrand: Wellensittiche, Zebrafinken, Babbler, Apostlebirds, nächtliche Flughunde, Krokodile, Papageienschwärme, Kraniche und Glücksschwalben. Die Kängurus mischen sich unter die Golfspieler und dann das Unmögliche, ein Känguru hoch oben im Baum.'
  widescreen: true
