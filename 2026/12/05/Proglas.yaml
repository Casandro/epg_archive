  title: Barvínek
  subtitle: Mikulášský Barvínek
  description: 'Autor a interpret: Natálie Feitová, Alena Rubášová; Premiéra: 1.12.2026 * Blíží se Mikuláš a Barvínek bude u toho! V novém svátečním díle s Naty a Alčou si prozradíme, kdo vlastně svatý Mikuláš byl a jak souvisí s nadílkou. r? Proč si francouzské děti dávají 5. prosince před spaním do bot slámu a kousek mrkve? A kde Mikuláše naopak neslaví vůbec? To všechno si vysvětlíme. Mimo to obě moderátorky také zavzpomínají  na své mikulášské zážitky - od těch nejroztomilejších až po ty, ze kterých malinko zatrne. A protože k nadílce neodmyslitelně patří básničky, jednu se společně naučíme. V závěru nebude chybět opakovací kvíz, který prověří, jak bedlivě jste poslouchali. Mikulášský Barvínek laďte v úterý 1. 12. od 17.10 a v sobotu 5.12. od 11.00. '
