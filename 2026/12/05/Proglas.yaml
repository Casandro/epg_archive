  title: Slyšte, lidé!
  subtitle: Hudební výlet do Itálie 2026
  description: 'Autor a interpret: Milan Tesař * V pořadu Slyšte, lidé! se vydáme na hudební výlet do Itálie a představíme si pestrou současnou scénu v nahrávkách z posledních dvou let. Uslyšíme tradiční hudbu z jihu země i projekty, které ji propojují s elektronikou, jazzem, rockem a experimentálními postupy. Představí se mimo jiné Canzoniere Grecanico Salentino, Officina Zoè, Stefano Saletti, Brigan nebo sicilská skupina Nuhara. Závěr pořadu bude patřit písničkáři Lucovi Bassanesemu, který na svém albu Tera objevuje krásu a význam rodného benátského dialektu.[kancoňjére grekanyko salentýno] [ofičína dzoe] [stefano salety] [lukovi basanézemu]'
