  title: In persona Christi - Das sakramentale Priestertum in der Kirche
  subtitle: Der Priester im Dienst der Verkündigung
  description: Was tut der Priester? - Der Priester steht im Dienst der Verkündigung des Wortes Gottes. Dabei soll er gemäß dem Kirchenvater Augustinus die Stimme für das göttliche Wort sein. Seine Verkündigung in Predigt, Katechese und Lehre ist Sprechen in der Person Jesu Christi. Das erfordert von ihm zugleich die Bereitschaft, sich durch das Wort Gottes prägen und sein Leben zu einer überzeugenden Predigt werden zu lassen.
