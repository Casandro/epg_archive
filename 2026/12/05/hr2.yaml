  title: Archivschätze
  subtitle: 'Hauptwort: Glück - 1972, Eine Diskussion mit Alexander Mitscherlich'
  description: '"Glück ist relativ, Glück als Zustand und als Sache, die von außen auf den Menschen zukommt, sind zu unterscheiden. Ein Mensch, der Glück hat, braucht noch nicht fähig zu sein, dieses Glück wirklich zu empfinden. Für jeden Einzelnen bedeutet Glück etwas anderes: Glück als persönliches egoistisches Wohlergehen, Glück als Dasein und Tätigsein für andere, Glück als Sammeln und Vermehren von Erkenntnissen.'
