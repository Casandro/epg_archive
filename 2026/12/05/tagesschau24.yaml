  subtitle: Film von Theo Heyen
  subtitled: true
  description: Militante Reichsbürger:innen sind besonders stark im Südwesten vertreten. Nach den geheimen Umsturzplänen einer paramilitärischen Truppe sollte der Bundestag gestürmt werden. Die mutmaßlichen Terrorist:innen um Prinz Reuss bauten bereits "Heimatschutzkompanien" auf, die Politiker:innen verhaften und exekutieren sollten. Eine solche Einheit flog in Horb am Neckar auf. Im baden-württembergischen Reutlingen schoss ein Reichsbürger auf Polizist:innen, die ihn als Zeugen vernehmen wollten. Diese SWR-Dokumentation folgt den Spuren bewaffneter Reichsbürger:innen in Baden-Württemberg und Rheinland-Pfalz, die die Demokratie bekämpfen wollen.
