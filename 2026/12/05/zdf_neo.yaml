  description: |-
    Science-Fiction-Serie, Frankreich / Belgien 2022
    Die Quarantänestation im Krankenhaus ist verwüstet. Lydia Joukovskaïa, die Leiterin des Kosmodroms, glaubt den Aussagen des Sicherheitsdienstes nicht, dass Isaak verantwortlich ist.

    Der französische Delegierte Xavier De Livier vermutet derweil eine Sabotage der ISS. Tatsächlich stoßen die Ingenieure Reva und Mikhail auf einen von einem amerikanischen Satelliten gefälschten Datensatz. Ein erster Verdächtiger ist schnell gefunden.
