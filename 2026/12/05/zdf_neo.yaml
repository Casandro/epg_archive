  title: Marie Brand und der entsorgte Mann
  genre:
  - '17'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Krimi, Deutschland 2022
    Der Leichnam des Bauschutt-Entsorgers Lutz Köhm wird - eingewickelt in schwarze Plastikfolie - auf dem Gelände des maroden Entsorgungsbetriebs von Kai Milas aus dem Müll gefischt.

    Von der Freundin des Opfers, Jasmin Schulte, erfahren die Kommissare, dass die Geschäftsbeziehung zwischen Lutz Köhm und Kai Milas zuletzt sehr angespannt war. Auch Jasmin gerät in den Fokus der Ermittler.
    Darsteller:
    Marie Brand - Mariele Millowitsch
