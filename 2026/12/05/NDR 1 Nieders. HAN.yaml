  title: Die Songs unseres Lebens
  description: |-
    Angeschlossen NDR 90,3/NDR 1 Welle Nord

    Die großen Hits der 80er-Jahre stehen im Mittelpunkt dieser Stunden.
    Irgendwo zwischen 70er-Disco und 90er-Techno ist dieses Jahrzehnt musikalisch verortet. Mit ganz neuen Klängen und Soundelementen war die Zeit der Schulterpolster und Löwenmähnen ein aufregendes Jahrzehnt. NDR 1 Welle Nord, NDR 90,3 und NDR 1 Niedersachsen widmen den Samstagabend in erster Linie dieser Dekade. Die Moderatorinnen und Moderatoren präsentieren die großen Hits der Achtziger und erinnern an die eine und andere in Vergessenheit geratene Perle aus jenen Jahren.
