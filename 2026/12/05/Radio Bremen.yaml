  title: Watzmann ermittelt (49)
  subtitle: Schnee von gestern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Beissl und seine Frau staunen nicht schlecht, als plötzlich Ellis 15-jährige Nichte Ava aus Berlin vor der Tür steht. In ihrem Rucksack hat sie nicht nur ein Paar Kopfhörer, sondern auch einige Geheimnisse, die dem Beissl noch sauer aufstoßen werden und Johanna zur Mitwisserin machen. Wann gab es schon den Fall, dass die eigenen Kollegen ein Familienmitglied wegen Schwarzfahrens vorführen... \nAuch beruflich kommen bei dem Chef der Berchtesgadener Polizei ungute Erinnerungen hoch. Er war vor sechs Jahren der erste Polizist am Tatort bei einem Banküberfall. Nun ist einer der Bankräuber im Böcklmoos-Moor ermordet worden."
