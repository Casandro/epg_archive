  title: ARD Oper
  subtitle: Live aus der MET
  description: |-
    Camille Saint-Saëns: "Samson et Dalila"

    Samson: Clay Hilley
    Dalila: Aigul Akhmetshina
    Oberpriester des Dagon: Quinn Kelsey
    Abimélech: Alfred Walker
    Ein alter Hebräer: Morris Robinson
    Chor und Orchester der Metroopolitan Opera
    Leitung: Giacomo Sagripanti

    (Zeitversetzte Übertragung aus der Metropolitan Opera New York)

    Die legendäre Stärke des biblischen Helden Samson trifft auf die sinnlichen Verführungskünste der Dalila in Camille Saint-Saëns' Oper "Samson et Dalila". Im Freiheitskampf gegen die Philister will Samson als Geweihter Gottes die Hebräer aus der Unterdrückung führen, aber er erliegt der Schönheit und den erotischen Künsten der Philisterin Dalila und wird dadurch verwundbar. Saint-Saëns hat mit dieser Oper nach einem Libretto von Ferdinand Lemaire ein musikalisches Meisterwerk geschaffen, die Partitur sprüht vor Farbenpracht und dramatischer Ausdruckskraft - mit Hits wie "Mon c_ur s'ouvre à ta voix", der großen Verführungsarie der Dalila, oder dem entfesselten Bacchanal. An der Met übernehmen die Mezzosopranistin Aigul Akhmetshina und der Tenor Clay Hilley die Titelpartien, am Pult steht Giacomo Sagripanti.
