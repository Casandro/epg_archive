  title: Blindverkostung
  subtitle: 'Moderation: Christian Detig'
  description: |-
    Hector Berlioz: Symphonie fantastique

    Die Symphonie fantastique von Berlioz ist ebenso beliebt wie umstritten, in jedem Fall ist sie ein wegweisendes Werk für die Gattung. Christian Detig präsentiert seinen Gästen verschiedene Einspielungen, ohne zu verraten, wen sie hören. Musik ohne jedes Etikett. Die Frage ist also: Was hörst Du wirklich? Christine Lemke-Matwey, Kai Luehrs-Kaiser und Andreas Göbel diskutieren und rätseln, loben und verwerfen. Die Antworten sind eindringlich, provozierend, immer ehrlich. Am Ende ist man dem Werk manchmal nähergekommen, als einem lieb ist. Blindverkostung eben.

    Moderation: Christian Detig
