  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Juliette Gréco

    Sie war eine international bekannte Botschafterin des intellektuell geprägten französischen Chansons und pflegte Kontakte zu herausragenden Persönlichkeiten wie Jean-Paul Sartre und Miles Davis. Ihre Stimme war nicht so raumgreifend wie die von Edith Piaf. Doch Juliette Gréco zeichnete sich durch einen ganz eigenen Vortragsstil aus. Dazu zählten ihr erotischer und provokanter Sprechgesang in Verbindung mit Texten von literarischer Qualität. Eine Sendung von Ortrun Schütz.

    Moderation: Ortrun Schütz
