  title: auserlesen
  subtitle: 'Dr. Stefan Kunz: Was wir von christlichen Mystikern lernen können'
  description: |-
    Sie sahen Visionen, schwiegen tagelang oder fanden Gott beim Kartoffelschälen. Manche wurden als Heilige verehrt, andere als Ketzer angeklagt. Pfarrer und Autor Dr. Stefan Kunz nimmt uns mit auf eine Reise durch die faszinierende Welt der christlichen Mystik. Er erzählt von Menschen, die Gott auf ungewöhnliche Weise erfahren haben, und davon, warum ihre Erfahrungen auch heute noch relevant sind. Was können wir von ihnen über die Sehnsucht nach Gott und einen lebendigen Glauben lernen? Warum lohnt es sich auch für evangelische Christen, sich mit Mystik zu beschäftigen? Und welche geistlichen Übungen lassen sich in unseren Alltag übernehmen? Darum geht es in dieser Folge.

    Weitere Infos unter: www.hopetv.de
