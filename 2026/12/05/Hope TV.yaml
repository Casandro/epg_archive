  start: 2026-12-05T09:30:00Z
  stop: 2026-12-05T10:20:00Z
  title: Hope Gottesdienst
  subtitle: Die Wüste hat nicht das letzte Wort - Gennadi Giesbrecht
  description: |-
    In Jesaja 35 leuchtet die Verheißung: Die Wüste wird zum blühenden Land - Gottes Rettung beginnt. Die Predigt entfaltet das Adventsmotiv "Schon jetzt und noch nicht": In Christus erfahren wir bereits Heil, Frieden und neue Kraft. Doch die Vollendung bleibt noch aus: Krankheit, Angst und offene Fragen begleiten den Weg. Gott bahnt einen "heiligen Weg" - bis Freude und ewiges Zuhause kommen.

    Weitere Infos unter: www.hopetv.de
