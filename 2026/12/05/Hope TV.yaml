- eventId: 1098276
  start: 2026-12-05T01:15:00Z
  stop: 2026-12-05T01:45:00Z
  title: Songs of Hope
  subtitle: Ein Licht, das weiterleuchtet
  description: |-
    In der Adventszeit leuchten überall Lichter -  auf den Straßen, in Geschäften und in unseren Häusern. Doch es gibt ein Licht, das weit über Weihnachten hinausstrahlt: Jesus Christus. Er schenkt Hoffnung, die trägt, Wärme, die gut tut, und Zuversicht, die auch in dunklen Zeiten nicht erlischt. Mit berührenden Liedern und Gedanken entdecken wir, was es bedeutet, dieses Licht in unser Leben aufzunehmen und weiterzutragen. Denn wer von seinem Licht erfüllt ist, kann auch für andere zum Licht werden.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1098277
  start: 2026-12-05T01:45:00Z
  stop: 2026-12-05T03:05:00Z
  title: Hope Gottesdienst
  subtitle: Advent, Advent ein Lichtlein brennt - Helge Külls
  description: |-
    Advent ist mehr als Kerzenlicht, Plätzchen und Vorfreude auf Weihnachten. Die Predigt lädt dazu ein, Jesus Christus neu in den Mittelpunkt zu stellen: Was bedeutet es, dass Gott Mensch wurde? Und welche Hoffnung schenkt uns sein Versprechen, wiederzukommen? Zwischen Weihnachtsbräuchen und alltäglicher Ablenkung ermutigt sie, über Gottes Liebe nachzudenken und sie ganz praktisch an andere weiterzugeben.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1098290
  start: 2026-12-05T03:05:00Z
  stop: 2026-12-05T04:05:00Z
  title: Cliff!
  subtitle: Angenommen, nur angenommen
  description: |-
    Cliff Goldstein hinterfragt die gängige wissenschaftliche Erklärung für den Ursprung des Lebens und stellt ihr die biblische Schöpfungsgeschichte gegenüber. Anhand alltäglicher Beispiele wie einer Erdbeere zeigt er, warum er Komplexität und Schönheit der Natur nicht für Produkte blinden Zufalls hält. Er argumentiert, dass moderne Evolutionstheorien logische Widersprüche enthalten und letztlich ebenfalls auf Glaubensannahmen beruhen. Für Goldstein liefert die Bibel mit ihrem Bericht von einer absichtsvollen, göttlichen Schöpfung die schlüssigere und hoffnungsvollere Erklärung für den Ursprung des Lebens.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 1098291
  start: 2026-12-05T04:05:00Z
  stop: 2026-12-05T05:00:00Z
  title: Auf den Spuren großer Komponisten
  subtitle: Frédéric Chopin
  description: |-
    Warschau und Paris waren die Städte im Herzen von Frédéric Chopins Welt: er war einer der ersten großen Klaviervirtuosen, und seine Klaviermusik trug dazu bei, einen neuen romantischen Geist in allen Künsten einzuleiten. Obwohl er das kultivierte Leben der französischen Hauptstadt schätzte, erschütterte die wilde und leidenschaftliche Musik, die aus seiner Liebe zu seinem Heimatland erwuchs, sein Publikum bis ins Mark.
    Diese Folge bietet einen Platz in der ersten Reihe für intime Aufführungen vieler der beliebtesten Klavierwerke von Chopin.
  widescreen: true
  hd: true
