- eventId: 1098310
  start: 2026-12-05T07:00:00Z
  stop: 2026-12-05T08:00:00Z
  title: Sag Ja zu Jesus
  subtitle: Jesus - Der Herr des Lebens! (5/5)
  description: |-
    Die Angst vor dem Tod und seine scheinbare Endgültigkeit sind oft Tabuthemen in unserer Gesellschaft. Doch früher oder später müssen wir uns alle mit der Realität des Todes auseinandersetzen. Wer schon einmal die tiefe, kollektive Trauer bei einer Beerdigung erlebt hat, stellt sich vielleicht die Frage: Waren diese 50, 70 oder 90 Jahre wirklich alles? Wenn Sie mehr über die christliche Hoffnung auf die Auferstehung erfahren möchten, laden wir Sie herzlich zum fünften Abend von "Sag Ja zu Jesus" ein. Erleben Sie ermutigende Impulse und neue Perspektiven auf das Leben nach dem Tod.

    Weitere Informationen unter www.ja-jesus.de
