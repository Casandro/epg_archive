  title: MausRadio - MausHörspiel
  subtitle: Kim und der wirklich wahre Wandelstern
  description: |-
    Als Kim erfährt, dass der Weihnachtsstern gar kein Stern ist, stellt sie alles in Frage. Auf der Suche nach Antworten trifft Kim auf die Astrophysikerin Ariane Sanftleben, eine Expertin für "Interstellaren Staub". Mit Ariane erkundet Kim die kosmische Welt, in der die Fragen nicht aufhören und das Staunen erst anfängt. Ein Hörspiel, das zeigt, wie wichtig es ist, die Welt mit neugierigen Augen zu betrachten - egal, ob wir acht oder achtzig sind.
    Regie: Judith Lorentz<br/>Produktion: WDR <markup type="abbr" abbreviation="2024" correspondent="zweitausendvierundzwanzig">2024</markup>
