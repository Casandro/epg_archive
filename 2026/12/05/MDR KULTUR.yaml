  title: MDR KULTUR Weltgeschichte vor der Haustür
  description: |-
    Aus der Podcast-Reihe "Weltgeschichte vor der Haustür" von Autor Thomas Hartmann und Sprecherin Conny Wolter

    Das Grüne Gewölbe, die Semperoper, der Zwinger oder die Brühlschen Terrassen: Das sind nur ein paar der weltbekannten Sehenswürdigkeiten, die die Besucherin oder der Tourist in Dresden genießen kann. In der neuen Folge unseres Podcasts "Weltgeschichte vor der Haustür" geht es allerdings um eine andere Form des Genusses, für den die Stadt einst stand: Dresden, das war mal die Schokoladenmetropole Deutschlands, das sinnliche Vergnügen wurde bis in die USA exportiert. Thomas Hartmann hat sich aufgemacht, um die historische Schokoladenseite von Elbflorenz näher kennenzulernen. Es liest Conny Wolter.

    Ob zurückgelehnt oder über eine Arbeit gebeugt, ob im Auto oder in einem Eisenbahnabteil sitzend - was kann es Schöneres geben, als vorgelesen zu bekommen? Die Lesezeit auf MDR KULTUR beschert Ihnen dieses Vergnügen von Montag bis Freitag, 09:05 Uhr und 19:05 Uhr (Wh.).
  subtitle: Dresden von der Schokoladenseite
