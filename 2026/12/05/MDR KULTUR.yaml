  title: MDR KULTUR trifft
  subtitle: MDR KULTUR trifft - Menschen von hier
  description: "MDR KULTUR trifft: Uta Wanitschke, Künstlerische Leiterin die SCHOTTE. das Theater, Erfurt \n                 \nSeit 2008 ist Uta Wanitschke Künstlerische Leiterin der SCHOTTE, dem Kinder- und Jugendtheater in Erfurt. Dort hatte am 27. November die dokumentarische Theateraufführung \"Der leise Terror. Wer hört mich, wenn ich schweige?\" Premiere. Jugendliche zwischen 16 und 21 Jahren erarbeiteten in den vergangenen 12 Monaten und in Kooperation mit dem Thüringer Landtag ein Bühnenstück über das Leben und Wirken von Jürgen Fuchs. Der Schriftsteller, Psychologe, Bürgerrechtler und Vertreter der Opposition in der DDR geriet früh ins Visier der Staatssicherheit. Überwachung, gezielte Verunsicherung und Destabilisierung seines Umfeldes gehörten zu seinem Alltag. Seine Bücher durften in der DDR nicht erscheinen. Im Westen Deutschlands erschienen 1977 \"Gedächtnisprotokolle\" und 1978 \"Vernehmungsprotokolle\". Nach der Ausbürgerung von Wolf Biermann am 16.11.1976 wurde Jürgen Fuchs drei Tage später verhaftet und nach neun Monaten Gefängnis ebenfalls ausgebürgert. Die Staatssicherheit beobachtete und bedrohte ihn auch in West-Berlin weiter. Jürgen Fuchs, in Reichenbach im Vogtland geboren und lange in Jena lebend, starb 1999 mit nur 48 Jahren an Leukämie.\n                                                         \nUnsere Gäste fühlen sich dem kulturellen Leben in unserer Region besonders verpflichtet. Kuratoren, Musiker, Intendanten, Schriftsteller, Dirigenten, Maler und viele mehr finden hier ihren Platz und erzählen aus ihrem beruflichen Leben und ihrem privaten Alltag.\n\nModeration: Julia Hemmerling\nRedaktion: Angelika Zapf"
