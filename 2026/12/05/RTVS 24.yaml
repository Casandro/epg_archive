  title: Moja bublina (49)
  subtitle: Viera Kranz. Viera Kranz žila kedysi v obyčajnom byte a pracovala pre nemecký korporát. Vždy však mala blízko k prírode a k udržateľnému spôsobu života.
  description: Viera Kranz žila kedysi v obyčajnom byte a pracovala pre nemecký korporát. Vždy však mala blízko k prírode a k udržateľnému spôsobu života. Nakoniec sa spoločne so svojou rodinou usadila v Moravských Beskydoch mimo civilizácie a založili si malú farmu. Žije sezónne a lokálne. A postupne sa začala venovať spracovaniu vlny z rôznych zvierat. Od oviec až po angorské králiky. (2026)
  genre:
