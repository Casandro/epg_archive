- eventId: 892687
  start: 2026-12-14T21:00:00Z
  stop: 2026-12-14T22:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Eva Garthe'
  description: |-
    Advent, Advent, das Schlagzeug brennt!

    Vier ganz unterschiedliche Vertreter der Zunft stehen im Fokus: Diego Pinera wurde 1981 in Montevideo/Uruguay geboren, lebt seit 2003 in Berlin, und wurde vor drei Jahren mit dem Deutschen Jazzpreis ausgezeichnet. Auch Oliver Steidle hat diesen Preis bereits erhalten - im Jahr 2022. Er ist unter anderem auf dem aktuellen Album der aufstrebenden Trompeterin Heidi Bayer zu hören. Andi Haberl ist radikal Genre-übergreifend unterwegs, u.a. bereichert er das Andromeda Mega Express Orchestra und die Band The Notwist. Tilo Weber wiederum verbindet historische Renaissance-Werke mit modernem Jazz.

    Moderation: Eva Garthe
