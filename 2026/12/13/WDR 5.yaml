  title: MausLive
  subtitle: Dürer oder Die Jagd nach Ritter, Tod und Teufel
  description: |-
    Nürnberg <markup type="abbr" abbreviation="1513" correspondent="fünfzehnhundertdreizehn">1513</markup>. In der Werkstatt des Künstlers Albrecht Dürer herrscht helle Aufregung: Die Kupferplatte für den berühmten Druck "Ritter, Tod und Teufel" wurde gestohlen. Meister Dürer ist verzweifelt, denn das Bild soll ein Geschenk für den Kaiser sein - und das schon am nächsten Morgen. Durch Zufall bekommen die Kinder Martha, Appolonia und Eppo von dem Fall mit - und wollen den Dieb stellen. Eine aufregende Jagd durch die Gassen von Nürnberg beginnt. Mitten durch das maskierte Faschingstreiben des damals berühmten Schembartlaufs, und gegen die verrinnende Zeit, die die Glocken der Turmuhr unerbittlich schlagen.
    Regie: Frank Halbach<br/>Produktion: BR/NDR/HR/WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
    Das Hörspiel ist auch als interaktive Version auf www.abenteuer.ard.de verfügbar.
