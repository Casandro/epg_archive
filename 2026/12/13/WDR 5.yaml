  title: WDR 5 - Lies mir was vor
  subtitle: 'Adalbert Stifter: Bergkristall (2/2)'
  description: Ein hoher Berg trennt zwei Alpdörfer, deren Bewohner einander fremd sind. An Heiligabend verirren sich zwei Kinder in einem Schneesturm und verbringen die Nacht in einer Eishöhle auf dem Gipfel. Ihre Rettung am nächsten Morgen führt zur Versöhnung der Dörfler. Die 1845 entstandene Erzählung "Bergkristall" gehört zu Adalbert Stifters bekanntesten Werken.
