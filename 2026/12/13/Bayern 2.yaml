  title: Bayern 2 Hörspiel
  subtitle: '"Die dritte Zivilisation" von Arkadij und Boris Strugatzkij'
  description: "Cyber-Techniker Stas ist auf einem erdähnlichen Planeten stationiert. Es ist eine unheimliche, öde Welt, unbewohnt, ohne Flora und Fauna. Die ständige Stille ist schwer zu ertragen und Stas beginnt, Geräusche zu hören, sogar Babygeschrei. Hat er den Verstand verloren? Doch dann taucht ein Junge auf. Ist er der Urheber der akustischen Halluzinationen und wer hat ihn aufgezogen?\n \nVon Arkadij und Boris Strugatzkij \nAus dem Russischen von Aljonna Möckel \nMit Jens Wawrczeck, Jens Harzer, Margrit Carls, Wolfgang Höper, Otto Sander, Rolf Illig, Peter Weiss, Burkhard Dabinnus, Alexander Duda, Alexandra Maetz \nRegie: Irene Schuck \nBR 1999\n\nIm Anschluss:\n\nAlexander Kluge - ein Porträt\nAlexander Kluge (geb. am 14. Februar 1932 in Halberstadt, gestorben am 25. März 2026 in München) war einer der vielseitigsten deutschen Künstler und Intellektuellen. \nMit dem Ich ging der Jurist, Autor, Filmemacher und Träger fast aller wichtigen Film- und Literaturpreise knausrig um. Es trat in seinem Werk meist hinter oder neben die Kamera, wendete sich einem Thema oder einem Gast zu, stellte Fragen. Konnte Antworten kaum erwarten. Drängelte ein wenig. Nahm sich wieder zurück, war nie im Bild, bloß stets im Bilde. Manchmal füllte das Ich eine halbe Seite in einem von Kluges umfangreichen Büchern, musste erzählen von kaputten Tretautos oder der englischen Verwandtschaft, um ein wenig Entspannung zu generieren, etwas Vertrauen zu schaffen, Nähe.\nRegisseur und Autor Karl Bruckmaier arbeitete seit 2009 immer wieder mit Alexander Kluge. \nDabei wurden Kluges Texte, Gespräche über inhaltliche Details wie auch Kluges generelle Weltsicht integraler Bestandteil zahlreicher vom BR produzierten Hörspiele. Aus dieser langsam gewachsenen Gesprächsbeziehung entstand die Idee, entlang kurzer autobiografischer Notizen aus Kluges Werk der gesamten Lebenslinie dieses Mannes zu folgen und Kluge zu ermöglichen, ein Selbstportrait von sich zu zeichnen aus Worten und Gefühlen - und dem Hörer die Möglichkeit zu geben, dieser gewinnenden Stimme ausgiebig zu lauschen, wenn sie sagt: \"Ich\".\n\nVon Karl Bruckmaier\nMit Gabriel Raab\nRegie: Karl Bruckmaier \nBR 2012 \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
