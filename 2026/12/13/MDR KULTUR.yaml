- eventId: 868437
  start: 2026-12-13T17:00:00Z
  stop: 2026-12-13T18:00:00Z
  title: EBU Christmas Day - Konzert aus Vilnius
  description: "LIVE aus Vilnius\n\nTraditionelle Weihnachtsmusika aus Litauen: \nThe Christmas Morning Rose Has Blossomed\nGardens, Gardens, Leliumoj\nOh, Candles Were Glimmering in the Field\nBeyond the Forests\nLittle Ermine\nThe Breaking Dawn\nGreen Rue\nOh, Forest, Forest\n\nWas passiert, wenn traditionelle litauische Weihnachtslieder auf zeitgenössische Jazzimprovisation treffen? Die Antwort lautet \"neYra\" - ein einzigartiges Weihnachtsprogramm, in dem alte litauische Weihnachts- und Wintervolkslieder durch die künstlerische Sprache des Jazz neu interpretiert werden. \nDie Sängerin Veronika ChiChi und der Pianist Dmitrij Golovanov, Litauens führende Jazzkünstler, laden das Publikum ein, dieses musikalische Erbe nicht als Relikt der Vergangenheit zu erleben, sondern als lebendige kulturelle Tradition, die sich bis heute weiterentwickelt. Litauische Weihnachtslieder gehören zu den ältesten und intimsten Schichten des kulturellen Erbes des Landes. Sie bewahren das kollektive Gedächtnis, spiegeln die Beziehung der Menschheit zur Natur wider und verkörpern Themen wie Vorfreude, Hoffnung und die Sehnsucht nach Licht in der dunkelsten Zeit des Jahres.\n\nDas Programm besteht aus neu geschaffenen Arrangements traditioneller Weihnachtslieder, die speziell für dieses Projekt komponiert wurden. Alte Melodien verschmelzen mit zeitgenössischer Harmonik, Jazzimprovisation und spontaner musikalischer Interaktion und schaffen so einen lebendigen Dialog zwischen Tradition und Innovation, Vergangenheit und Gegenwart.\n\nVeronika ChiChi, Gesang\nDmitrij Golovanov, Klavier\n\nÜbertragung aus dem Studio des Litauischen Rundfunks."
- eventId: 868510
  start: 2026-12-13T18:00:00Z
  stop: 2026-12-13T19:00:00Z
  title: EBU Christmas Day - Konzert aus  Saarbrücken
  description: |-
    Aus Saarbrücken

    Werke von Georg Friedrich Händel, Johann Sebastian Bach, Felix Mendelssohn Bartholdy, Georges Bizet, Giacomo Puccini, Albert William Ketèlbey und Nikolaj Rimskij-Korsakows Suite zur Oper "Die Nacht vor Weihnachten"

    Wenn die Nächte am längsten sind und Schneestürme über die Dörfer fegen, öffnet sich eine ganz eigene Welt: Rimskij Korsakows Oper "Die Nacht vor Weihnachten" entführt uns in ein mythisches ukrainisches Dorf, wo Schmiede, Hexen, Teufel und singende Dorfbewohner die Weihnachtszeit mit zauberhaften Koljadaliedern feiern. Die Orchestersuite verdichtet die schönsten Momente der Oper in leuchtende Klangbilder - märchenhaft und wunderbar weihnachtlich. Dazu erklingen festliche Klassiker aus Bachs "Weihnachtsoratorium" und Händels "Messias". Die Ouvertüre aus Händels "Feuerwerksmusik" eröffnet pompös, während Mendelssohns "Lobgesang" und Bizets "Agnus Dei" zum Innehalten einladen.

    Matteo Ivan Rasic, Tenor
    Deutsche Radiophilharmonie Saarbrücken Kaiserslautern
    Leitung: Patrick Hahn

    Aufnahme vom 27. November aus dem Großen Sendesaal des Saarländischen Rundfunks
- eventId: 868511
  start: 2026-12-13T19:00:00Z
  stop: 2026-12-13T20:00:00Z
  title: EBU Christmas Day - Konzert aus Berlin
  description: |-
    Aus Berlin

    * Georg Friedrich Händel: Concerto grosso F-Dur op. 3 Nr. 4 HWV 315
    * Georg Friedrich Händel: "Let the bright seraphim" - Arie mit Trompete aus dem Oratorium "Samson" HWV 57
    * Georg Friedrich Händel: "Will the sun forget to streak" - Arie der Königin von Saba aus dem Oratorium "Solomon" HWV 67
    * Georg Friedrich Händel: Concerto grosso B-Dur op. 3 Nr. 2 HWV 313
    * Georg Friedrich Händel: "Ye sacred priests.Farewell ye limpid streams and floods" - Arie der Iphis aus dem Oratorium "Jephtha" HWV 70
    * Georg Friedrich Händel: Concerto grosso c-Moll op. 6 Nr. 8 HWV 326, daraus 2. Satz "Grave"
    * Georg Friedrich Händel: "In Jehovah's awful sight" und "Choirs of angels, all around thee" - Arien aus dem Oratorium "Deborah" HWV 51
    * Johann Sebastian Bach: 4. Orchestersuite D-Dur BWV 1069
    * Johann Sebastian Bach: Kantate "Falsche Welt, dir trau ich nicht" für Sopran BWV 52 (ohne Chor)

    Musik von Händel und Bach bildet den perfekten Auftakt zur Adventszeit. Drei Concerti grossi von Georg Friedrich Händel stehen auf dem Programm des Rundfunik-Sinfonieorchesters Berlin - und damit kehr Musik ins Repertoire zurück, die viele moderne Sinfonieorchester lange den auf Alte Musik spezialisierten Ensembles überlassen hatte. Heutzutage ermöglicht die historisch informierte Aufführungspraxis sogar modernen Orchestern, Werke von Händel, Bach oder Telemann überzeugend zu präsentieren - mit einer sichtbaren und hörbaren Begeisterung für und in den Klängen des Barock.Die Sopran-Solistin Anna Prohaska veredelt die festlichen und zugleich gefühlvollen Gesangspartien aus vier Oratorien Händels mit ihrer Interpretationskunst, ebenso wie auch bei Bachs Kantate, die bis heute ernüchternd aktuell bleibt:"Falsche Welt, Dir trau ich nicht".

    Anna Prohaska, Sopran
    Kinderchor der Staatsoper Berlin
    Rundfunk-Sinfonieorchester Berlin
    Leitung: George Petrou

    Aufnahme vom 8. Dezember aus dem Konzerthaus Berlin.
